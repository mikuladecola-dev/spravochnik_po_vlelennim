<script>const BASE="";const DOCNAME="Пришельцы (линия Фени)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0082-S01", "GR-0082--chto-eto"], "h": "<p>Старая линия инопланетян, придуманная Миколаем и Славой вдвоём. К моменту разговора (2025-12-17, окно w0114) линия существует в основном как ростер картинок, сгенерированных нейросетью: Миколай когда-то давно «просил нейронку нарисовать пришельцев», а теперь прогоняет тех же самых персонажей через новые модели для картинок и показывает результат Славе.</p>\n<p>Авторы сами сравнивают линию с «Бен 10»: увидев картинки, Слава спрашивает «Это типа Бен 10».</p>\n<p>Строго говоря, «группой» это является в том смысле, что персонажей несколько и они относятся к одной линии; связного сюжета, общей организации или совместных действий в переписке нет. Это ростер существ, а не отряд.</p>\n<p>Отнесение линии к вселенной «Феня» сделано по дате объявления — вселенная авторами не названа.</p>\n<p>Отдельно: эту линию не следует путать с «Пришельцами» вселенной «монстры» (<a href=\"GR-0043.html\">Пришельцы</a>) — это разные линии.</p>", "r": [["Пришельцы", "GR-0043.html"]]}, {"t": "Состав", "a": ["S02", "GR-0082-S02", "GR-0082--sostav"], "h": "<p>Поимённо (точнее, описательными кличками) в переписке названы двое:</p>\n<ul>\n<li><a href=\"PS-0343.html\">Летающий пришелец</a> — летающий пришелец («летающий»)</li>\n<li><a href=\"PS-0344.html\">Пузырик</a> — пузырик</li>\n</ul>\n<p>Кроме них на картинках есть другие пришельцы, которых авторы не опознают. Про одного из них Слава говорит прямо: «Это я вообще хуй знает кто». Сколько всего существ в линии, как они называются и какие у них силы — не сказано. Полного поимённого состава нет.</p>", "r": [["Летающий пришелец", "PS-0343.html"], ["Пузырик", "PS-0344.html"]]}, {"t": "Чем участники отличаются друг от друга", "a": ["S03", "GR-0082-S03", "GR-0082--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p>Различаются они внешним устройством тела; в переписке названо только оно.</p>\n<p><strong>Летающий (<a href=\"PS-0343.html\">Летающий пришелец</a>).</strong> По описанию Славы, которое он восстанавливает по памяти: «на плечах три отверстия с каждой стороны откуда тентакли вылетают с острым концом» — то есть по три отверстия с каждой стороны, и из них вылетают тентакли с острым концом. Имени у персонажа нет, он опознаётся по признаку «летающий». Полёт как таковой в переписке не описан — назван только сам признак.</p>\n<p><strong>Пузырик (<a href=\"PS-0344.html\">Пузырик</a>).</strong> По описанию Славы, «выглядит подобно медузи». Другого описания нет.</p>\n<p>Существенная деталь: обе эти черты Слава называет как то, чего не было в запросах к нейросети. Он вспоминает их как свои прежние описания, а Миколай подтверждает: «ну я тогда в описание не кидал это». То есть на картинках плечевых отверстий с тентаклями быть не должно — это часть исходной задумки, не попавшая в генерацию.</p>", "r": [["Летающий пришелец", "PS-0343.html"], ["Пузырик", "PS-0344.html"]]}, {"t": "Как менялась — по датам", "a": ["S04", "GR-0082-S04", "GR-0082--kak-menyalas"], "h": "<p>Обе версии относятся к одному дню и обе помечены как повтор прежней мысли: линия не развивается, а вспоминается.</p>\n<p><strong>2025-12-17, дневной заход (id 399151–399184).</strong> Миколай прогоняет тех же самых пришельцев через две новые модели генерации картинок и сравнивает результаты. Его оценка моделей: «мне нравится как сейчас делают. возможно лучше. а вот если сравнивать между этими я хз даже. вторая будто больше на массового пользователя работает, а первая на науку. но может я выдумываю». Самих персонажей в этом заходе не обсуждают — речь только о качестве генерации.</p>\n<p><strong>2025-12-17, вечерний заход (id 399310–399337).</strong> Слава видит картинки и не сразу понимает, что это («Бля это кто», «Это типа Бен 10»). Миколай напоминает: «ну помниш давно ещё просил нейронку нарисовать пришельцев». Слава сравнивает с прежними результатами не в пользу новых: «Ну там они выглядели круче что-ли». Дальше он восстанавливает по памяти две детали, которых в запросах не было, — плечевые отверстия с тентаклями у летающего и сходство пузырика с медузой (см. выше), — и признаёт, что остальных на картинках не узнаёт.</p>\n<p><strong>Авторство (там же, id 399332–399336).</strong> Миколай уточняет распределение вклада: «ну это было в целом по моим идеям, ты дополнял, но я кидал первые запросы», и добавляет, что это видно по сохранённым запросам, «которые нейронка писала». Слава соглашается: «Ну я тоже помню».</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "GR-0082-S05", "GR-0082--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет. Названы двое из неизвестного числа; сколько всего пришельцев в линии — не сказано.</li>\n<li>Части персонажей на картинках авторы сами не опознают.</li>\n<li>Способностей нет ни у кого. У летающего названы тентакли с острым концом, но что он ими делает и как применяет — не сказано; полёт назван только как признак-кличка. У пузырика способностей не названо вообще.</li>\n<li>Общих способностей группы в переписке нет. Что объединяет этих существ, кроме принадлежности к одной линии, не сказано.</li>\n<li>Иерархии нет: главного, вожака или деления на роли не названо.</li>\n<li>Отношений с другими группами нет: никакие другие группы или персонажи с этой линией в переписке не связаны.</li>\n<li>Вселенная авторами не названа. Отнесение к «Фене» сделано по дате объявления.</li>\n<li>Названия линии как таковой нет — «пришельцы» это обиходное слово авторов, а не имя.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0082--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0343.html\">Летающий пришелец</a>, <a href=\"PS-0344.html\">Пузырик</a></li>\n<li><strong>Упоминает группы:</strong> <a href=\"GR-0043.html\">Пришельцы</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0082--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0082.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0082-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0082/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первое, что надо чинить, — двойник. Рядом с этой статьёй лежит <code>PS-0342</code> «Пришельцы», заведённая как персонаж (5435 знаков базы, 1 ссылка), и содержит она ровно то же самое: происхождение линии, «Бен 10», описания летающего и пузырика, разбор авторства. Статья группы на неё не ссылается ни разу, хотя <code>PS-0343</code> и <code>PS-0344</code> набирают свои по две ссылки как раз с двух сторон этого раздвоения. Одна линия описана дважды в разных типах сущностей — пока это не сведено, любая правка расходится по двум местам.</p>\n<p>Вторая дорогая дыра — принадлежность к вселенной. Отнесение к «Фене» сделано по дате объявления, авторы вселенную не называли. От этого решения зависит место трёх записей сразу: <code>GR-0082</code>, <code>PS-0343</code>, <code>PS-0344</code>. И рядом стоит <code>GR-0043</code> «Пришельцы» из вселенной «монстры» — с ней эта линия разведена, но разведена тем же способом, то есть без опоры на слова авторов.</p>\n<h3>С чего начать</h3>\n<p>В базе лежит всё, что вообще сказано: <code>PS-0342</code> — id 399310–399337 (вечерний заход, описания и авторство) и 399151–399184 (дневной, только про качество генерации). Больше в переписке нет ничего, дополнять оттуда нечем.</p>\n<p>Дальше — только архив, и ориентир нужный. Искать надо раннее окно, где Миколай впервые «просил нейронку нарисовать пришельцев»: он сам говорит про это «давно ещё», то есть заметно раньше 2025-12-17, и в том разговоре должны быть исходные описания — те самые, из которых потом сложились «летающий» и «пузырик». Именно там, если где-то, лежит и название линии, и вселенная, и остальной состав. Второй след — вне переписки: Миколай указывает на сохранённую историю запросов, «если полистаешь видно будет, которые нейронка писала» (399333). Это не архив чата, это его собственные логи генераций, и без них поимённый состав не восстановить.</p>\n<h3>Как развивалось</h3>\n<p>Придумали давно — дата в переписке не зафиксирована. Ограничили сразу форматом: линия с самого начала существует как набор картинок, а не как текст. Забыли — между тем разговором и 2025-12-17 в архиве ничего. Вернулись 2025-12-17, но вернулись к инструменту, а не к задумке: днём сравниваются две модели генерации, персонажи при этом не обсуждаются вовсе; вечером Слава смотрит результат и не опознаёт часть собственных существ. Единственное, что в этот день добавилось к линии, — две детали, поднятые из памяти, а не с картинки.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для облика правило фактически названо: канон — то, что автор помнил из своих прежних описаний, а не то, что выдала нейросеть; отверстия с тентаклями на плечах в запросы не попали, и Миколай это подтверждает — значит, на картинках их нет, а в линии они есть. Для состава правила того же рода нет. Считается ли пришельцем этой линии тот, кого нейросеть нарисовала, а авторы не узнают («Это я вообще хуй знает кто»), — не сказано. Граница линии не проведена ровно там, где для облика она проведена явно.</p>\n<h3>Отклик</h3>\n<p>Зацепил один момент — тот, где картинка перестаёт быть источником. Линия целиком родилась из генераций, живёт как ростер изображений, и вдруг автор смотрит на новую картинку и правит её по памяти: у летающего должны быть три отверстия с каждой стороны, пузырик похож на медузу, и ни того, ни другого в запросах не было. То есть канон всё это время лежал не в файлах, а в голове, и обнаружился только при сверке. Плюс редкая для такого материала честность: «Ну там они выглядели круче что-ли» и «Это я вообще хуй знает кто» — про собственных персонажей. В остальном тут пока нечему цепляться: существ двое из неизвестного числа, и держатся они на одной детали каждый.</p></div>", "r": []}];</script>
