<script>const BASE="";const DOCNAME="Бетонный мир";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0147-S01", "MR-0147--ustroystvo"], "h": "<p>Бетонный мир — сеттинг истории «Бетонный герой» (2025-09-08, id 362528–362531, окно w0103). Бесконечный город из голого бетона, накрытый бетонным потолком вместо неба. В тексте называется «бетонный мир» и «бетонная тюрьма».</p>\n<p><strong>Постройки.</strong> «Бетонный здания без окон и дверей с пылью, что десяток лет копилось на них». Окон и дверей нет как предметов — есть только проёмы: «я увидел окно, а точнее просто отверстия, в котором должно было быть окно. Но это просто пробел из которого светила ярким светом». Комнаты пустые: «В этом помещении ничего не было. Абсолютно ничего, лишь бетонные стены и отверстия». Лестницы «без перил. Просто бетонные ступени и всё».</p>\n<p><strong>Что отсутствует.</strong> Нет ни мусора, ни следов работы или заброшенности: «там ведра, инструменты или хотя бы мусор, гравити, блять даже шприцы. Хоть что то, что напоминало бы стройку или заброшенность этого здания. Но здесь до ужаса чисто и ничего нет». На улице «Лишь бетонный здания без лавочек, травки и зелени. Просто бетон». Герой отдельно отмечает, что не видит ни арматуры, ни проводки, ни кирпичей.</p>\n<p><strong>Небо.</strong> Вместо неба сплошной бетонный потолок, край которого не виден: «Там на вверху, где должны были быть облака и неба, а возможно яркий звезды. Была лишь бетонный потолок. Он закрыл всё, абсолютно все». До потолка не достаёт ни одно здание: «Этот потолок, до которого не может дотянуться, не один бетонный столб». Герой сравнивает его с архаическим представлением о небе: «это словно видения наших предков о небе, как о слое. Как о чем то твёрдом и физическим. Но в нашей реальности, это было не так. А здесь бетонный потолок, что стал небом и с которого словно снег спадала пыль, был настоящим».</p>\n<p><strong>Свет.</strong> Источник света — лампы, расставленные без всякой логики: «этот грёбаный свет от лампы, который торчали везде. На потолке на бетонных сооружениях. Да даже в полу. Они просто были везде. Словно создателю было без разницы». Свет тусклый жёлтый, но из проёмов бьёт ярко, и он неестественный: «сейчас свет, как будто неестественный странно». Горизонт «серый и желтый, словно детский рисунок ребёнка».</p>\n<p><strong>Звук.</strong> «Абсолютная и всепоглощающая тишина. Здесь не было никакого звука абсолютно. Не было песни птиц, звук машин, шаги людей». Мир звук не отражает, а гасит: герой вскрикнул на лестнице и прислушался — «Не эхо, не ответа. Словно это место просто поглотила моей звук м всё». Кричать он не решается: «кричать в абсолютной тишине было, как-то страшно и странно. Словно я нарушу, какую ту гармонию, порядок, который нарушать не стоила».</p>\n<p><strong>Воздух.</strong> Застоявшийся и сухой: «воздух здесь был каким-то за стоявшим и абсолютно сухим, мёртвым без влаги, словно ветер не как не мог суда попасть». Ветра нет даже на крыше: «даже здесь на такой высоте не было даже слабого ветерка».</p>\n<p><strong>Пыль.</strong> Лежит везде слоями: «здесь пыль лежала везде несколькими слоями, как будто бы здесь давным давно не кого не было. Под давным давно я говорю не про неделю или месяц, а наверное несколько десятков лет». Пыль сыплется сверху, с потолка, «словно снег». Единственное исключение — комната, в которой герой очнулся: там пыли нет. Герой возвращается и проверяет это отдельно: «Я осмотрел свою комнату и ничего там не заметил. Лишь то, что там просто нет пыли. Но что это даёт ни-че-го».</p>\n<p><strong>Масштаб и выход.</strong> Мир бесконечен: с крыши «в этой пародий не было конца». Герой поднимается специально, чтобы найти стену или выход — не находит ни того, ни другого, и после этого констатирует: «Выхода нет. Я видел это собственными глазами». Ни воды, ни еды в мире не найдено; жажда — постоянный фон всего текста.</p>\n<p><strong>Природа мира.</strong> Прямо в тексте он определён как подделка под родной мир героя: «Как будто это место давно брошенно. Словно кто-то попытался повторить мой мир. Мир в котором я жил. Но это лишь имитация. Жалкая поганная попытка создать мой мир».</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0147-S02", "MR-0147--naselenie"], "h": "<p>Населения нет. Ни людей, ни животных, ни птиц, ни каких-либо существ в тексте не встречается. Единственный обитатель — герой, попавший сюда извне.</p>\n<p>Он обходит этаж за этажом в поисках друзей, Димы и Лёхи, с которыми пил накануне, и не находит никого; на последних этажах бросает поиски. Ощущение мира — «Словно я здесь один».</p>\n<p>Существование создателя мира упомянуто один раз, косвенно, в замечании про лампы: «Словно создателю было без разницы». Кто он — не сказано.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0147-S03", "MR-0147--mesto-vo-vselennoy"], "h": "<p>Запись входит в историю «Бетонный герой», связана с персонажами Бетонный герой и Герой-рассказчик (Бетонный герой). Мир противопоставлен родному миру героя — обычному, с квартирами, магазинами, друзьями, пятничной пьянкой, детской площадкой на четыре квартиры и четырёх детей одного возраста (Дима, Лёха, Андрей и рассказчик).</p>\n<p>Способ попадания в мир не объяснён. Последнее, что герой помнит, — как они собрались в пятницу у Димы: «Я после первой бутылки ничего не помню - это же ненормально. До этого я пил ещё больше и при этом всё до мелочей помнил. Так почему меня вырубила?» Сколько он пролежал в комнате до пробуждения, он тоже не знает: «может быть, что я лежал там день или месяц».</p>\n<p>Связи бетонного мира с прочими мирами вселенной «Апостол» в окне не проговорены.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0147-S04", "MR-0147--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-09-08, id 362528–362531 (09:24), окно w0103.</strong> Единственная версия. Текст выложен четырьмя сообщениями подряд и разбит на главы:</p>\n<ul>\n<li>«Глава пробуждения» — пробуждение с похмелья в пустой бетонной комнате, обнаружение отсутствия окон и дверей, спуск с третьего этажа по лестнице без перил.</li>\n<li>«Глава страх» — выход наружу, бетонный потолок вместо неба, лампы, тишина; паническая атака и попытка успокоиться дыханием.</li>\n<li>«Глава неба» — подъём на крышу здания в надежде увидеть стену или выход, осмотр с высоты, вывод об имитации родного мира.</li>\n<li>«Глава надежда?» — ходьба по бетонным улицам, усиливающаяся жажда, переход в воспоминание о детстве и о заброшенном бетонном доме, найденном Димой.</li>\n</ul>\n<p>Переработок и изменений сеттинга по датам в записи нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0147-S05", "MR-0147--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Природа мира и то, кто его создал, в окне не раскрыты (отмечено в самой записи как неясность).</li>\n<li>Зачем и как герой сюда попал — не сказано.</li>\n<li>Почему в комнате пробуждения нет пыли, тогда как везде она лежит десятилетними слоями, — отмечено самим героем и оставлено без объяснения.</li>\n<li>Есть ли в мире вода, еда, край или выход — не сказано; выхода герой не нашёл, но и подтверждения, что его нет, в тексте нет.</li>\n<li>Что стало с Димой и Лёхой, попали ли они в тот же мир — не сказано.</li>\n<li>Откуда берётся свет ламп и почему он неестественный — не объяснено.</li>\n<li>История обрывается на воспоминании о детстве; чем всё кончилось, в записи нет.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["MR-0147--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-09-08</td>\n<td>362528–362531</td>\n<td>w0103</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0147-betonnyy-mir.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0147--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0147.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
