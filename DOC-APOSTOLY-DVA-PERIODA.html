<script>const BASE="";const DOCNAME="Апостолы: два периода работы";
const LEAD="<div class=\"ed\"><p>Отдельное исследование по просьбе автора: над апостолами работали дважды, числа не сходятся (12 и 21).\nПериоды описаны раздельно и намеренно НЕ сведены в одну версию. Числа не примирялись.\nОсновные статьи (вселенная «Апостол» VS-0002, Имитатор PS-0383) этим файлом не переписывались.</p></div>";
const CH=[{"t": "Коротко", "a": ["DOC-APOSTOLY-DVA-PERIODA--korotko"], "h": "<p>Над апостолами авторы (Слава и Миколай) работали дважды, с перерывом. <strong>Период А</strong> — с 2025-01-27 по 2025-06-10: апостолы появляются как раздел служебного списка персонажей, получают определение («благословенный именно Богом»), пронумерованный поимённый состав и постепенно обрастают механикой; в конце этого периода вселенная апостолов объявляется закрытой (2025-03-25), но затем всё равно продолжает пополняться до июня. <strong>Период Б</strong> — с 2025-08-10 по 2026-07-14: апостолы возвращаются уже без исходного списка, как «группа лиц из 21 человека телепатически связанный друг с другом», переезжают из вселенной во вселенную (вселенная Оам, потом мир «без энергии», потом вселенная героев и злодеев) и несколько раз переопределяются по природе — то насекомые из коконов, то люди с мутацией, то «проект по созданию ИС».</p>\n<p>Числа в двух периодах разные. В периоде А единственное произнесённое вслух число рядом со списком — <strong>12</strong> («12 злодеев пока», 2025-03-06, id 298847), при том что авторская нумерация в самом списке доведена до <strong>14</strong>; ещё раз 21 всплывает в мае 2025 (id 331635) уже как определение. В периоде Б основное названное число — <strong>21</strong>, повторяемое дословной формулой, потом урезанное до <strong>12</strong> (2025-12-17, id 399552–399560), потом снятое совсем («неограниченное количество», 2026-04-25, id 466528), потом снова названное как 12 в новой вселенной (2026-06-02, id 487001, 487005). Периоды здесь не сводятся: ниже они описаны раздельно, и совпадения имён отмечены как совпадения имён.</p>", "r": []}, {"t": "Период А: список апостолов (2025-01-27 — 2025-06-10)", "a": ["DOC-APOSTOLY-DVA-PERIODA--period-a-spisok-apostolov-2025-01-27-202"], "h": "<h3>Что такое апостол в этом периоде</h3>\n<p><strong>Термин вводится как различение внутри благословенных.</strong> 2025-01-28 (id 285342–285343) Слава предлагает: «Давай благословенный Богом это апостооы, чтобы различать благословенных Богом и других». Миколай отвечает: «хорошая идея».</p>\n<p><strong>Апостол — строка верхнего уровня в списке.</strong> 2025-01-28 (id 285533–285537) Миколай указывает, что «не разделены благословенные и апостолы»; Слава обещает «Сделаю сделаю» и объясняет устройство: «Но там среди благословенных только апостолы а в скобках благословенный». Заголовок раздела при этом так и остаётся «Благословенный:» — и в январской, и в февральской, и в мартовской версии списка.</p>\n<p><strong>Апостол — отдельный человек-персонаж с прозвищем-функцией.</strong> 2025-01-28 (id 285363, 285405, 285409–285413) на прямой вопрос Миколая «че за воительница / от куда она» Слава отвечает: «Апостол», и добавляет: «Апостол у которогой есть дочь».</p>\n<p><strong>Апостол — сила и статус, к которому причисляют.</strong> 2025-03-03 (id 297458–297463), мини-история про Бессмертного выродка: эльф опознаёт в мальчике апостола и даёт характеристику классу — «\"Что-то, не верится, что ты апостол, тот самый легендарный, тем кем наш пугали старший, тех кого боялись сильнейший и те кто могут убить даже существо, ты явно не заслуживаешь эту силу\" Проронил эльф, прокручивая меч.» (id 297462). В финале появляется второй, взрослый апостол — «плакса» со шрамами-слезами, белыми светящимися глазами и винтовкой со штыком: «\" Похоже ты будешь аномалий нашего поколения \" Проронил апостол, хватая тела мальца на плечо и уходя» (id 297463).</p>\n<p><strong>Апостолами становятся; это отдельный процесс.</strong> 2025-03-10 (id 300761–300765) Миколай предполагает, что апостол в истории — «дед с шрамами слезами»; Слава: «Нет» и поясняет: «Эльф попав в наш мир почувствовал апостола и решил его убить, и всё эльф вообще не причастен к становлению апостолом \\ Старик, рыжий, Доктор и капитан русский солдаты, вот поэтому он их понимает». 2025-03-14 (id 302666–302681) Слава подтверждает, что Защитник до атаки кровью апостолом не был: «Нет ещё, иначе бы я написал бы белый глаза», «Он стал апостолом, когда его атаковали кровью в спину». В самом тексте истории «Битва» (2025-03-14, id 302378–302380): «В момент, когда он должен был умереть. Он получил благословение. И не обычная, а от бога.»</p>\n<p><strong>Подтип апостола — «Гении», прежде «Аномалия».</strong> 2025-03-06 (id 298872–298884) Слава: «Ну я говорил, только давай теперь таких называть Гениями то бишь, апостол со самой странной способностью, у каждого поколения такой был». На вопрос Миколая «а как до этого ты их называл?» — «Аномалия»; на «пример дай пж» — «Бессмертный».</p>\n<p><strong>Апостолы как организация.</strong> 2025-03-13 (id 301806, повтор в 301808 и 301823), реплика старика-арбетара: «-нет не знаешь, Апостолов. Эти апостолы не пойми кем себя возомнили и везде понаставили свои порядки, на чужой силе»; «поэтому пришлось ждать пока какой-нибудь апостол упустить альфю. При этом доведя его до полусмерти. И это было долго, как бы я ненавидел апостолов. Но не могу не признать, что свою работу они выполняють слишком идеально. Ну даже в идеальной системе есть единичные пробои.» В тот же день (id 301808) апостол прямо говорит о наборе агентов: «второй путь стать агентом нашей организаций». 2025-03-18 (id 305116) выстроена иерархия: «Кстати моим куратором был Михаил с кодовым прозвищем \"Медведь\"… И кстати я был там не один нас было 10. Как я понял потом. Каждый агент может быть куратором только для 10 людей.» 2025-03-18 (id 305329–305340) Миколай спрашивает «и сколько уже таких агентов» — Слава: «Дохера»; на «интересно че они с этими агентами делают» — «Отправляют сражаться».</p>\n<p><strong>Определение изнутри истории (март 2025).</strong> 2025-03-19 (id 305856), реплика Имитатора: «Ты и я апостолы. Это люди получивший благословения от правителя рая. То бишь от второго мира появившейся после кильке. Нас апостолов 21 во всём мире. Нас, именно нас благословенных правителем рая. Больше чем других благословенных другими правителями. Ну в принципе всё. Вот это основа.» Там же — чем апостол отличается от прочих благословенных: «есть отличие. Каждый правитель даёт разный способности. Но четыре базовых есть у всех. Это усиления, самоисцеления, энергия и сенсорика. У нас апостолов в отличие от всех. Способность формируется. То бишь у каждого апостола уникальная способность. У других же благословенных одним правителем. Одинаковые способности. Почему у тебя болить голова? Потому-что связь устанавливается с мозгом. И сила проходит через мозг. Повреждая его… И у нас благословенных есть предохранитель в голове. Который при случаи выгорания мозгов отключает благословенния.» Ограничение по составу — там же (id 305855–305856): «Но каждый правитель может дать ограниченной количество благословение. И к факту. Благословения можеть получать только разумный житель кильке. Первого мира.»</p>\n<p><strong>Итоговое определение периода (май 2025).</strong> 2025-05-31 (id 331635), внутри свода «Правители»: «Примечания: Апостолы это 21 человек получивший благословен от правителя рая. ( 21 это максимальное число благословения, который способен давать правитель рая. Другие же правители дают меньше). У апостолов есть дополнительная способность.  Телепатия между ними. ( они способны разговаривать. На расстоянии и также всем мести. Они также могут отказаться от телепатического общения и прервать разговор). Когда у всех благословенных одного правителя одна и та же способность. То у благословенных правителя рая. Они разные. Так как правитель рая. Посылает им лишь сгустки чистой и необработанной силы, который формируется во что уже только внутри Апостолов. Даруя им уникальные способности.» Там же о месте в иерархии силы: «так как всё благословенный включая апостолов. Получают плюс минус одинаковая количество энергии ( силы). Они являются одинаково сильными. Но это не включая индивидуальность людей. Всё же апостолы всё равно чаще всего сильнее любого другого благословенного.»</p>\n<p><strong>Механика-ограничения периода А.</strong> 2025-03-10 (id 300887–300898): «Благословенный это люди у которых есть связь с правителем другого мира, и чтобы получить его силу нужно сначала пропустить еë через мозг, из за этого благословенный не могут использовать благословенный 24/7». 2025-03-13 (id 301865–301874): «Я же говорил вроде апостолы не способны лечить и влиять на разум», «Благословенный вообще все»; Миколай: «ну да это я помню, поэтому посчитал странным». 2025-03-20 (id 306157–306165): предохранитель «можно» — «Вырубить».</p>\n<p><strong>Апостолы и АЗИП.</strong> 2025-05-28 (id 330952–330991) расшифровка аббревиатуры: «Апостол закон и права» (после «Не знаю» в id 330990). 2025-05-30: «На Северном полюсе два апостола сидят» (id 331453); на вопрос «кто является основателем» (id 331237) — «Апостолы» (id 331454); «Типо апостолы с давних времён защищали мир. И во всё времена государство о них знала» (id 331455); на «зачем и на кого она работает» (id 331238) — «На апостолов. Для защиты порядка» (id 331456).</p>\n<p><strong>«Апостол» как имя вселенной.</strong> 2025-06-10 (id 335358–335361): «Я придумал новую вселенную» — «Но главная вселенная всё равно апостол».</p>\n<h3>Названное число</h3>\n<ul>\n<li>2025-01-27 (id 284858) — число не названо, нумерации нет.</li>\n<li>2025-01-28 (id 285342–285343, 285363–285413, 285522–285548, 285533–285537) — число не названо. В связке 285522–285548 названо только количество добавлений: «И ещё два», «И ещё одно», «И ещё один».</li>\n<li>2025-02-25 (id 295553–295557) — названо число <strong>9</strong>, но это одержимые: «Одержимый» — «Благословенный ада» — «Которых 9». К апостолам не отнесено.</li>\n<li>2025-02-25 (id 295559) — словами число НЕ названо; авторская нумерация раздела «Благословенный:» идёт <strong>от 1 до 14</strong>.</li>\n<li>2025-03-06 (id 298847–298850) — единственное место, где число произнесено рядом со списком: «12 злодеев пока», «Ну в списке моём». Пронумерованный блок «Благословенный:» в том же сообщении доведён до 14. К какому именно разделу относилось «12 злодеев» (к «Благословенный» или к «Враг», где нумерации нет), из переписки не следует.</li>\n<li>2025-03-19 (id 305856) — <strong>21</strong>: «Нас апостолов 21 во всём мире.»</li>\n<li>2025-05-14 (id 325799) — словами не названо; нумерация раздела «Апостолы:» идёт 1–14.</li>\n<li>2025-05-30 (id 331453) — «два», но только про Северный полюс, не как общее число.</li>\n<li>2025-05-30 (id 331444) — <strong>21</strong>, но это филиалы АЗИП: «Ну у неё 21 главных филиалов. У каждого филиала ещё есть свои филиалы.» Связка с числом апостолов авторами не проговорена.</li>\n<li>2025-05-31 (id 331635) — <strong>21</strong>: «Апостолы это 21 человек получивший благословен от правителя рая. ( 21 это максимальное число благословения, который способен давать правитель рая…)».</li>\n</ul>\n<h3>Состав — списком, имена в том виде, как записаны</h3>\n<p><strong>2025-01-27 (id 284858), раздел «Благословенный:», без нумерации:</strong></p>\n<ol>\n<li>Имитатор 🗡( ветреной 🌬; электро⚡️; птичка 🔈)</li>\n<li>Агрегат🫥 ( теневые братья 🌑; экстримал ⏳; страдалец 🔪 )</li>\n<li>Разрушительнитца💪 ( огненная 💥)</li>\n<li>Палач☠️</li>\n<li>Защитник🤬( ангел 👼)</li>\n<li>Дитя света ✨(военный 🐺)</li>\n<li>Бессмертный выродок🤪</li>\n<li>Хулиган 💎(слайм 7️⃣)</li>\n<li>Вибрация 🫨</li>\n<li>Ученица???</li>\n</ol>\n<p>(Нумерация здесь моя, для чтения; у авторов в этот момент нумерации нет. В скобках, по пояснению Славы от 2025-01-28 id 285537, — прочие благословенные, не апостолы.)</p>\n<p><strong>2025-01-28 (id 285522, 285524–285548)</strong> — добавлен последней строкой: Масочник 🎭.</p>\n<p><strong>2025-02-25 (id 295559)</strong> — впервые пронумеровано рукой автора:</p>\n<pre><code>Благословенный:\n1.Имитатор 🗡( ветреной 🌬; электро⚡️; птичка 🔈)\n2.Агрегат🫥 ( теневые братья 🌑; экстримал ⏳; страдалец 🔪 )\n3.Разрушительница💪 ( огненная 💥)\n4.Палач☠️( тварь)\n5.Защитник🤬( ангел 👼)\n6.Дитя света ✨(военный 🐺)\n7.Бессмертный выродок🤪\n8.Хулиган 💎(слайм 7️⃣)\n9.Вибрация 🫨\n10.Ученица???\n11.Масочник 🎭\n12.Сон ✨\n13.Небесная 🚀\n14.Маэстро 🎼\n</code></pre>\n<p><strong>2025-03-06 (id 298850)</strong> — тот же состав 1–14, выложен целиком в ответ на вопрос Миколая «кто?». Слово «апостол» в самом списке не используется, раздел назван «Благословенный:».</p>\n<p><strong>2025-05-14 (id 325799)</strong> — тот же состав 1–14, но раздел впервые назван «Апостолы:» и идёт первой рубрикой большого реестра.</p>\n<p><strong>Поимённые привязки вне списка:</strong></p>\n<ul>\n<li>2025-01-28 (id 285409–285413) — боевая четвёрка против Серафима: «1) Воительнтца», «2) Агрегат», «3) Имитатор», «4) Палач». Имя «Воительнтца» в бою и «Разрушительнитца💪» в списке авторами прямо не отождествлены — совпадает только значок 💪 / «Оружейный браслет 💪»; как тождество не фиксируется.</li>\n<li>2025-02-25 — 2025-02-26 (id 295572–295578, 295903) — роли на отыгрыш: Миколаю «Начинай представлять себя как защитник», себе Слава берёт «А я выродок»; на переспрос Миколая «тот кого я убил или кто это😳» — «Апостол», «Бессмертный». Назавтра: «Ладно я выродок, наверное будет легче, неполного персонажа, отыгрывать, чтобы больше было простора».</li>\n<li>2025-03-13 (id 301808) — первое человеческое имя у апостола: «Я Дмитрий Рутковский или можно просто Дима. Кодовая прозвище \"агрегат\". И я апостол, тот самый, которого по твоим словам ненавидит старик». Миколай: «❤️‍🔥 спасибо за человеческое имя» (id 301810).</li>\n<li>2025-03-14 (id 302378) — Защитник (№5 в списке) получает имя: «А звать его Александром Лукашенко».</li>\n<li>2025-03-14 (id 302836–302842) — «нече не помниший апостол» (Бессмертный) среди действующих героев; «Ну Агрегат уравновешенный хоть второстепенный перс», «Пока что».</li>\n<li>2025-03-18 (id 305116) — «Ведь ему надо встретиться с новым апостооом по прозвищу \"защитник\"»; там же Михаил «Медведь» — куратор-агент, апостолом не назван; Михаил Саакашвили — не апостол.</li>\n<li>2025-03-18 (id 305422–305437) — «Имитатор апостол гг всего мира», «Это апостол который появился в конце».</li>\n<li>2025-03-19 (id 305856) — в сцене двое: «защитник» (Александр) и «имитатор»; поимённого списка нет, названо только число 21.</li>\n<li>2025-05-31 (id 331639) — «В нынешней время является агентом и приближенным Апостола (Бессмертного)» (карточка Куры-арбетара). Там же апостол как мера мощности: водоворот «достаточной сильный, чтобы затянуть апостола или арбетара».</li>\n</ul>\n<h3>Как менялся состав</h3>\n<ul>\n<li><strong>2025-01-27 → 2025-01-28 (id 284858 → 285522).</strong> Добавлен «Масочник 🎭» последней строкой. Слава сам ведёт счёт добавленному репликами «И ещё два \\ И ещё одно» (id 285538), «И ещё один \\ И ещё одно» (id 285541), «И ещё один» (id 285546), «Всё» (id 285548); Миколай угадывает позиции («Угадай что изменилась 😂», id 285524). Общее число апостолов не названо.</li>\n<li><strong>2025-01-28 → 2025-02-25 (id 285522 → 295559).</strong> Добавлены «12.Сон ✨», «13.Небесная 🚀», «14.Маэстро 🎼»; у «4.Палач☠️» появилась приписка «( тварь)»; написание «Разрушительнитца» сменилось на «Разрушительница»; никто из перечисленных ранее не удалён; «Ученица???» осталась с тремя вопросительными знаками. Параллельно вне раздела апостолов заведена категория «Одержимый:» с единственной строкой «Гурман».</li>\n<li><strong>2025-02-25 → 2025-03-06 → 2025-05-14 (id 295559 → 298850 → 325799).</strong> Состав 1–14 не меняется. Меняется только оформление: 2025-05-14 раздел впервые назван «Апостолы:» вместо «Благословенный:».</li>\n<li><strong>Пополнения через тексты историй.</strong> 2025-03-13 (id 301808) Агрегат получает человеческое имя Дмитрий Рутковский. 2025-03-14 (id 302378–302380, 302666–302681) Защитник получает имя Александр Лукашенко и по ходу боя становится апостолом; до атаки кровью апостолом не был.</li>\n<li><strong>2025-05-10 (id 324541)</strong> — за четыре дня до списка апостолов Слава скидывает перечень категорий вселенной, и апостолов в нём НЕТ: «Благословенный \\ Арбетары \\ Альфы \\ Чужемирцы \\ Владельцы артефактов \\ Фантазёры».</li>\n<li><strong>2025-05-14 (id 325800–325808)</strong> — сразу после списка: «Он жив», «Ну и нужно исправления»; Миколай уточняет «убрать кого-то?» / «добавить», Слава: «Добавления организация нимб и фантазеров \\ И перераспределение сил». Конкретных имён апостолов, которых убирают или добавляют, не названо; изменение состава именно апостолов здесь не заявлено.</li>\n</ul>\n<h3>Отклонённые варианты</h3>\n<ul>\n<li><strong>Другой состав против Серафима.</strong> 2025-01-28 (id 285405): «Вообще против Серафима по сюжету должны были драться совсем другие перс которых я ещё не придумал».</li>\n<li><strong>Раздел «Семь грехов».</strong> 2025-03-06 (id 298850–298856). Слава: «Грехи нужно убрать, а то тупо» (id 298854), Миколай: «ну просто в сюжет не совсем входят» (id 298856). В сообщении раздел выглядел так: «Гнев 😡( сила)», «Похоть 😵‍💫(контроль разума)», «Зависть 👹👹( полной копирование)», «Алчность ♾(всё моей)», «Гордыня 👑», «Чероугодия ◼️( поглощения)», «Лень😴( контроль территории)».</li>\n<li><strong>Гипотеза о составе: «дед с шрамами слезами» — апостол.</strong> 2025-03-10 (id 300761–300765). Миколай: «как я понял эльф это чужестранец, а дед с шрамами слезами кто-то из апостолов» — Слава: «Нет».</li>\n<li><strong>История про деятельность организации апостолов.</strong> 2025-03-13 (id 301923–301944). Миколай: «о деятельности организации апостолов?» (id 301925) — Слава: «О встречи старика и защитника \\ Старик же в конце сказал, что хочет провести тест-драйв» (id 301927).</li>\n<li><strong>Второе благословение для Бессмертного — без ответа.</strong> 2025-05-31 (id 331636 → 331661). В своде Слава ограничивает: «благословения даётся только одно. Больше человек не выдержит. И это одно благословения с ним до его смерти. Благословения нельзя разорвать». Миколай: «можно бессмертному дать второе?» (id 331661). Ответа в окне нет — ближайшее «Нет» (id 331667) относится к другому вопросу. Как принятое или отклонённое не фиксируется.</li>\n<li><strong>Отход от вселенной, где «нет страха».</strong> 2025-03-20 (id 306564–306583). Слава: «Ну я сейчас хочу слегка отойти от вселенной. Там страха нет. Везде апостолы, силы, нет смертей нет рисков.», «Обычный и ты нихера не получишь благословение или силы», «Но это опять всё задумки. Хер знает, что в итоге будет».</li>\n</ul>", "r": []}, {"t": "Период Б: группа из 21 (2025-08-10 — 2026-07-14)", "a": ["DOC-APOSTOLY-DVA-PERIODA--period-b-gruppa-iz-21-2025-08-10-2026-07"], "h": "<h3>Что такое апостол в этом периоде</h3>\n<p><strong>Апостол как одно лицо среди благословенных (август 2025).</strong> 2025-08-30 (id 359681): «Ты же знаешь кто такие апостол. Сильнейший среди благословенных. Людей, что лишь своё силой и авторитетом поддерживают мир и у них есть нерушимая организация Азип, которой уже более сотней лет». Слово написано в единственном числе — «кто такие апостол»; число не названо, телепатия не упоминается.</p>\n<p><strong>Апостол как единица измерения мощи.</strong> 2025-08-30 (id 359684): «Есть сестра благословенная правителем Кильке. Да она сильнее одного апостола. Но дальше че. Это не та сила, что поставит на колени весь мир. А её подручный всё слабее апостолов. Каждый из них один на один против апостолов продует. При этом у них не такая большая группировка». Дальше эта же роль повторяется в 2025-10-02 (id 370605) и 2025-11-05 (id 382108): «не кто из апостоловы не сможет нормально их ранить» (о детях мирового древа).</p>\n<p><strong>Главное определение периода — группа из 21 телепатически связанного (сентябрь 2025).</strong> 2025-09-12 (id 364808): «Апостол в данной вселенной это опять группа лиц из 21 человека телепатически связанный друг с другом. Но это не люди, это насекомые. Всё двадцать один апостол вылезли из разных коконов. И по своё природе не являются людьми. Хоть и очень на них похоже.» Формула повторена дословно 2025-10-03 (id 370732) и 2025-10-22 (id 377625) — с тем же словом «опять».</p>\n<p><strong>Механика этой версии.</strong> 2025-09-12 (id 364808): «Только теперь у них замедленная старения ( точнее они словно замерзают в каком-то возрасте( в рандомные возраст ). И они как арбетары. Если сжечь лес он будет гореть не переставая. То есть их ний силы постоянные ( конечно с некоторыми условностями) но они могут сами вырубить огонь. И во вторых теперь у них не по одной способности. Так как они по сути могут сами придумать новую способность. Но всё же они стараються делать упор в определённый способности. Ну не считая Имита».</p>\n<p><strong>Мотивация группы.</strong> 2025-09-12 (id 364808): «Здесь апостолы дорожат друг другом больше всех. Как раз таки из-за того что  та организации убила семью одного из апостолов и разгромила детский приют другого апостола. Всё остальные апостолы начали их истреблять. Даже тех кто просто приходил помолиться в церковь этой организации.» Про ту же охоту — 2025-09-12 (id 364774): «Но когда апостолы устроили охоту на одну религиозную организацию по всему миру. И делали они это особо не скрываясь. Да какой там скрываться. Они могли в центре города разнести церковь или многоэтажку которая принадлежал той организации. Апостола ещё могли публично устроить казнь десятков а то и сотни людей ( работников этой организации)… Раскрыв существование тёмной изнанки.»</p>\n<p><strong>Версия «съел насекомое» (сентябрь 2025).</strong> 2025-09-17 (id 366030–366034): «Разрушаем вселенную»; «Есть апостолы. Но апостолы это те кто сожрал насекомое ( не придумал ещё какое. Но шанс выживания после его съедения 13 процентов. Всего насекомых 21) пока что у них будет лишь баф к физ. И регенерация не каких индивидуальных способностей (пока что)».</p>\n<p><strong>Белые глаза как уникальная способность всех апостолов.</strong> 2025-09-17 (id 366109–366117), после перебора вариантов: «Ну наверное восприятия времени и сверхчувства как у Максима» (id 366116). Итоговое описание (id 366117, дословно повторено 2025-10-03 id 370767 и 2025-10-20 id 376401): «После активации белых глаз то для них время замедляется ( но они не становятся быстрее) и всех их чувства в  улучшаются и они становятся сверх чувствительными. Зрения слух осязания запах и вкус. \\ Из-за и боль они ощущают больнее. \\ Но зато у них словно всё на ладони они ощущать и видят всё что находиться вокруг. И способны словно предсказывать движение противников по слуху или зрению. \\ И становятся невероятно точными \\ \\ Но опять же долго держать включёнными такое восприятия они не могут. Мозг просто не выдержит такое большое количество информации и нагрузки. \\ Но и без активации белых глаз они физ. Сильный, быстрые, крепкий и владеют повышенной регенерацию ( ну не прям сверхрегенерацию, просто наверное раза 3 быстрее разный заживают) и владеют реакцию превосходящие любого человека.плюсом апостол может приспосабливаться к окружающей среде ну не прям сильно. А и они выносливый они могут обходиться без сна и чтобы на них это не как не влияло 3 дня».</p>\n<p><strong>Апостолы как раса.</strong> 2025-09-18 (id 366586): «Кто у нас как раса есть Поротой Азуриэль Апостолы Одержимый \\ Ну и монстры который я тебе скинул ну изменённый \\ Сейчас надо думать о расе ведь монстров можно просто из мифологии взять». 2025-11-17 (id 385768): «Апостолы 21 вторая по силе раса на земле (опять раса, в мире есть просто индивиды который могут быть сильными). Апостолы очень часто устраивают без порядок разрушая укорененый баланс между всеми. Из-за них по итогу в современном мире раскроется существования тёмный изнанки но это будет в будущем в будущем». Повторено 2025-12-06 (id 393287).</p>\n<p><strong>Природный контр-хищник.</strong> 2025-09-17 (id 366175): «Ты ведь понимаешь что для апостолов у которых главная силы сверх чувства и восприятия ( то есть самое главное нервная система и мозг) то есть Азуриэль является природным охотником Апостолов. При этом против Поротой они не так эффективны»; «Но апостолы сильнее поротоя» (id 366177); «Да апостолы и Азуриэль появились на земле естественным путем» (id 366193). Над апостолами поставлены Коты: «Коты. Их 9.они сильнеший… И вот они есть в каждую эпоху. Если один кот умрёт родиться новый и всегда их будет 9. Они вообще никуда не вмешиваться» (2025-11-17, id 385768).</p>\n<p><strong>Возврат формулы «21 человек, получивший благословение» (октябрь 2025).</strong> 2025-10-18 (id 375849), текст Славы, опубликованный сообщением Миколая для сайта: «Примечания: Апостолы это 21 человек получивший благословен от правителя рая. ( 21 это максимальное число благословения, который способен давать правитель рая. Другие же правители дают меньше). У апостолов есть дополнительная способность.  Телепатия между ними…» Миколай поясняет: «это только по одному твоему сообщению» (id 375848); Слава одобряет: «Очень круто» (id 375851), «Делай  так» (id 375852).</p>\n<p><strong>Версия «люди с мутацией» (октябрь 2025).</strong> 2025-10-20 (id 376401), раздел «Мутанты»: «Апостолы- это люди, у которых в утробе матери мутировало нервную систему мозг и глаза. Из-за этого их ней пять чувств, работоспособность мозга, реакция, точность выше чем у обычного человека в несколько раз. \\ Обуздать Оам они могут без поглощения огромного количества Оам. Им достаточно пережить одну эмоциональную ситуацию, и они неосознанно воспользуются Оам. И дальше они могут пользоваться им без проблем. Также они могут использовать белый глаза направив туда Оам.» И: «Как  ясно они у них лучший контроль Оам» (id 376402), «Пока что так» (id 376403). Ни числа 21, ни телепатии, ни группы в этом описании нет.</p>\n<p><strong>Возврат к насекомым (октябрь 2025).</strong> 2025-10-22 (id 377616–377617): «Кстати вернём старых апостолов \\ Они насекомые произошли от неизвестного мутировшого существа.»; «Просто если у них развита только мозг и нервная связь. Они не смогут в моей голове сражаться полноценная. ( эффект адаптации повышенный у них должен быть)». Что было до: «Ну в этой вселенной апостолы это проста люди у которых мутировала под воздействием Оам нервная связь и мозг» (id 377623). Происхождение: «21 от неизвестного мутировшего существо» (id 377631), «Так вот это существо мутировал из-за воздействием Оам» (id 377633), «Все монстры это мутированный под воздействием Оам» (id 377634). Слово «насекомые» тут же смягчено: «Насекомые это апостолы который выглядит как люди. (Насекомые я назвал их по приколу)» (id 377643).</p>\n<p><strong>Характер и роль (декабрь 2025).</strong> 2025-12-06 (id 393293): «Вообще апостолы на стороне добра. \\ Ну будут устраивать геноциды и теракты \\ Плюсом они высокомерны, хотя прямо этого не показывать. Ну они как бы с рождения лучшей людей, поэтому в полне ясно почему они высокомерные \\ Ну кроме бессмертного ( у него как бы не все в порядке с мозгами если ты помнишь)»; «И вот добрики и другие добряки есть. Но апостолы все же главные» (id 393294). Устройство группы: «Сам Имит тоже любит свою дочь. Также сильна как и своих братьев и сестёр апостолов. \\ Апостолы также относятся к ней дружелюбно так как она дочь Имита. И она иногда будет этим пользоваться» (id 393476).</p>\n<p><strong>Признак — белые глаза.</strong> 2025-12-04 (id 392478): «Если три пары глаз. \\ Первые белые апостола. Способны видеть оэм ну ещё чего-нибудь \\ Глаза черви… ( будет у котов) \\ Радужные глаза только для одного челика». Косвенно — 2025-10-05/06 (id 371690, 371829, 371832): Миколай замечает, что в аниме персонаж тоже придумывает апостолов, Слава: «Ну не белоглазых».</p>\n<p><strong>Апостолы — не люди, цикл не придуман (декабрь 2025).</strong> 2025-12-17 (id 399514): «И кто теперь будет апостолами. Типо они и так не люди. А их него родителя я так и не придумал»; (id 399521): «Апостолы не люди. Их ней цикл жизни я не придумал. \\ Защитник (один из апостолов) должен будет отказаться от человечность ( что плачет в нём и чувствует вину, что не уберёг семью) но что произойдет когда он откажется от человечности».</p>\n<p><strong>Версия «просто сверхлюди» (апрель 2026).</strong> 2026-04-25 (id 466520–466526): «Ну апостолов просто будут сверхлюдьми. \\ Физические сильными, выносливыми, ловками. И при активации белых глаз просто повышается всё чувство. \\ Также повышает регенерация». Наследование: «Дети апостолов, долгое промежуток времени просто люди. Но после 18 лет. Они становяться сверх людьми и у них будут чернеть глаза. \\ А и ещё их главная особенность. Они всегда после 18 лет захотят убить родителя. Это их главная цель» (id 466548, 466557, 466588); Миколай называет это эдиповым комплексом.</p>\n<p><strong>Версия «проект ИС» (июнь 2026).</strong> 2026-06-02 (id 487001): «Но на заметку после нуар лишь ещё один проект по созданию ИС удался. Проект апостолов. 12 созданных ИС. Но его уже на публику не раскрывали.» Общие с Нуаром особенности (id 487009, 487046, 487048): «Они не стареют, у них невероятное быстрая регенерация тела. И их тела очень адаптивные. Ну ещё несколько особенностей которых я прям здесь не скажу». Расклад сил: «Ну и апостолы которые держут нейтралитет. Конечно не все. Вот Граф один из столпов героев» (id 487004).</p>\n<p><strong>Апостолы во вселенной Оам (июнь 2026).</strong> 2026-06-07 (id 488544): «Имет апостол и фигура старшего брата среди апостолов. Архетип учёного.» Механика (id 488545): «Также он способен запомнить программу которой создал и потом повторить её без примера виде врага… А это большинство способности апостолов, огонь, лёд и холод»; «Имету на это пофиг он апостол у него реген тела даже без Оам. Большинство апостолы тоже им обучены оу и материализация, но материализация слишком опасная, долгая, и не эффективная и ты так же не можешь использовать её вместе со своей способностью»; «И поэтому на это способен лишь апостол Имет. ( фактик. Он тренировался на полотне созидания ( да способность звездочета)». И предел смертности: «Ну возможно кто-нибудь из апостолов оу может иногда применить, но материализацию точно нет. Сдохнут ведь, даже если апостолы» (id 488546).</p>\n<h3>Названное число</h3>\n<ul>\n<li>2025-08-10 (id 355186), 2025-08-30 (id 359681–359711) — число не названо ни разу. 2025-08-30 (id 359691): «В конце всё истории и в последнее битве апостолы продуют. Большинство апостолов сдохнуть. Поэтому нужна сила что позволит это сделать» — «большинство», без числа.</li>\n<li>2025-09-12 (id 364808) — <strong>21</strong>, названо дважды: «группа лиц из 21 человека», «Всё двадцать один апостол».</li>\n<li>2025-09-17 (id 366034) — <strong>21</strong>, но отнесено к насекомым: «Всего насекомых 21». Число апостолов в этой версии не названо.</li>\n<li>2025-09-17 (id 366106) — названы три вида насекомых («каменный жук», «Белая бабочка ( ну или гусеница)», «чёрный червь»), что расходится с «Всего насекомых 21».</li>\n<li>2025-10-03 (id 370732) — <strong>21</strong>: «группа лиц из 21 человека», «Всё двадцать один апостол».</li>\n<li>2025-10-18 (id 375849) — <strong>21</strong>: «Апостолы это 21 человек», «21 это максимальное число благословения».</li>\n<li>2025-10-20 (id 376401–376403) — число не названо.</li>\n<li>2025-10-22 (id 377625, 377628–377631) — <strong>21</strong>: «21 насекомое от 1 существа?» — «21 от неизвестного мутировшего существо».</li>\n<li>2025-11-17 (id 385768) — <strong>21</strong>: «Апостолы 21 вторая по силе раса на земле». Повторено 2025-12-06 (id 393287).</li>\n<li>2025-12-17 (id 399540) — <strong>21</strong>, с признанием пробела: «Как бы их 21 один и я не всех придумал. И вот из этих какого я не придумал будет моей маленькой жертвой». На вопрос Миколая «и кстати почему их 21?» (id 399546) — «Я хуй знает» (id 399548).</li>\n<li>2025-12-17 (id 399552–399560) — <strong>12</strong> вместо 21: «мб урезать?», «12 как по базе?» — «Какая база», «Ты просто перевернул число» — «ну было ж 12 апостолов у бога» — «Ну давай. А то мне в падлу придумывать всех 21».</li>\n<li>2025-12-17 (id 399562–399579) — сразу за этим неоконченный обмен числами: «если че бог любит все че на 3 делится и чем меньше частное тем больше нравится» (М), «Три» (С), «Не сука» (С), «4 мне нравится больше» (С), «Все четыре» (С), «12» (М), «там частное 4» (М), «лан» / «как хочешь» (М). Из текста не видно однозначно, идёт ли счёт про апостолов или про 4 последователей Бога красок, обсуждавшихся рядом; итог не зафиксирован.</li>\n<li>2026-01-31 (id 426512) — словами не названо; нумерация списка доведена до 12, строки 11 и 12 без имён.</li>\n<li>2026-02-09 (id 430400) — словами не названо; список пронумерован до 12, строка 7 пустая.</li>\n<li>2026-04-25 (id 466528) — число снято: «А поэтому апостолов может быть неограниченное количество»; пояснение (id 466535): «Не в этом проблема. Проблема была в способностях, я для каждого придумывал отдельную способность, Из-за чего ограничивал их число».</li>\n<li>2026-06-02 (id 487001) — <strong>12</strong>: «Проект апостолов. 12 созданных ИС.» И (id 487005): «Ну и получается \\ 6 героев, 6 злодеев, 4 ахрепископа, 12 апостолов, ну и кто-нибудь из Нимба».</li>\n<li>2026-06-03, 2026-06-07 (id 487514, 488439–488546) — число не названо.</li>\n</ul>\n<h3>Состав</h3>\n<p>Поимённых списков апостолов в первой половине периода нет: с августа 2025 по декабрь 2025 имена появляются только поштучно.</p>\n<p><strong>Поштучные именования:</strong></p>\n<ul>\n<li>2025-09-12 (id 364808) — единственное имя во всём куске, в приписке: «Ну не считая Имита».</li>\n<li>2025-10-03 (id 370842) — «Имитатор и звездочёт могут . Но если сконцентрируется» (о телепатии на дальнее расстояние; общий предел — 100 м, id 370841).</li>\n<li>2025-10-20 (id 376510) — сцена с Имитатором против пепельного человека: «Чё-то имитатор у меня в голове всё безумнее и безумнее… Но его это не волнует, он понял как использовать способность пепельника.» Слово «апостол» в самом сообщении не произносится — связь только через имя из id 370842.</li>\n<li>2025-11-05 (id 382099) — «Они были обучены стилю боя как у Палача ( апостола, который сильнейший в ближнем бою), но опять же это лишь имитация стиля Палача. Также было проведена попытка обучения особого усиления Имитатора, но из-за большой смертности от неё отказались.»</li>\n<li>2025-12-06 (id 393298) — «2 это апостол Граф (опять отсылка на семь островов) \\ Он высокомерный и беспечный апостол, что веселиться. \\ У него своя банда ( просто для развлечения) грубо говоря он король преступного мира \\ Его способность власть. Контроль всего, что есть в определенном радиусе. Достаточно силён, чтобы разнести гору, плюсом он быстрейший апостол ( хотя этот титул носит другой Апостол. Ну по факту он быстрее)». Имя «другого Апостола» не названо.</li>\n<li>2025-12-06 (id 393455, 393474, 393480) — «Только можешь уточнить что Имит ( Имитатор) Апостол»; «Имит это Имитатор. Только сокращена»; «Так как для правительства. Представитель Апостоловы именно Имит».</li>\n<li>2025-12-06 (id 393473) — «Вспоминая защитника ( апостола, который по сути сошёл с ума когда умер его ребенок, и в какой-то момент полностью откажется от своей человеческой натуры».</li>\n<li>2025-12-06 (id 393478) — трое, чей путь уже придуман: «Вообще у Агрегат, Графа и Защитника \\ Судьба предрешена. Ну я то есть придумал их ней путь». Имена даны в косвенном падеже, как в переписке.</li>\n<li>2025-12-06 (id 393293) — «бессмертный», без имени: «Ну кроме бессмертного ( у него как бы не все в порядке с мозгами если ты помнишь)».</li>\n<li>2026-06-02 (id 487176) — «А кстати Палач один из апостолов. Цепной пёс ассоциации… В ближнем бою он почти сильнейший \\ Надеюсь ты не забыл. \\ Что сильнейший апостолы это Граф и Палач».</li>\n<li>2026-06-07 (id 488544–488546) — «Имет апостол и фигура старшего брата среди апостолов»; «Он также научил этому стилю Мауру ( уродливая маска апостол со способностью вибрация)»; «звездочет» назван как обладатель полотна созидания, апостолом в этом сообщении прямо не назван.</li>\n<li>2026-06-07 (id 488439–488440) — «Дочь имета. (Доима)»: «Нимб захватили девушку которая  была беремена от Имета. Им было интересно унаследует ли ребёнок апостола его способности… А над ребёнком начали проводить всяческий эксперименты дабы выявить если у неё особенности апостолов.»</li>\n</ul>\n<p><strong>Первый поимённый список периода — 2026-01-31 (id 426512):</strong></p>\n<pre><code>Апостолы:\n1.Имитатор \n2.Агрегат\n3.Защитник \n4.Бессмертный выродок\n5.Граф \n6.Вибрация \n7.Масочник \n8.Звездачет \n9.Небесная \n10. Палач\n11.\n12.\n</code></pre>\n<p>Позиции 11 и 12 — номер есть, имени нет.</p>\n<p><strong>Второй поимённый список — 2026-02-09 (id 430400):</strong></p>\n<pre><code>Апостолы:\n1.Имитатор \n2.Агрегат\n3.Защитник \n4.Бессмертный выродок\n5.Граф \n6.Вибрация \n7.\n8.Звездачет \n9.Небесная \n10. Палач\n11.Кура \n12. Избранный\n</code></pre>\n<p>Здесь пустой стала строка 7, а строки 11 и 12 заполнены — «Кура» и «Избранный».</p>\n<p><strong>Список без подписи — 2026-06-09 (id 488786–488788).</strong> Слава пересылает сам себе старый список имён и сверяет по памяти. В самих этих сообщениях список НЕ подписан словом «апостолы» — авторы его никак не называют; в нём есть «имитатор» (= Имет, апостол) и «лёд» (одна из названных способностей апостолов), но принадлежность всего списка к апостолам авторами не заявлена. Порядок ровно как записан: «Энергет, прятки, закон, петля, феникс, Тен, волк, дракон, ци, имитатор, спартанец, вампир, драгоценность, бессмерт, жук, лёд, Дилан, граница, солнце». Дальше: «Че за граница» (id 488787), «Всех помню кроме границы и дилана» (id 488788).</p>\n<p><strong>Смежные перечни, куда апостолы входят или не входят:</strong></p>\n<ul>\n<li>2025-08-30 (id 359706) — перечень сил, где апостолы отдельной строкой НЕ выделены (они внутри благословенных по id 359681): «Благословенный \\ Арбетаров и Альфы \\ Творцы ( фантазёры)». Слава сам поправляется: «То есть четвёртую» (id 359707).</li>\n<li>2025-09-18 (id 366586) — расы: «Поротой Азуриэль Апостолы Одержимый».</li>\n<li>2025-10-02 (id 370605) — «Кто есть пока что не в сформировавшиеся мире \\ Апостолы с сверхспособностями (насекомые) \\ Каменный Поротой \\ Азуриэль \\ Допустим вампиры который могут контролировать кровь \\ И дети мирового древа». Там же (id 370628–370629): «Ну точнее только о апостолах», «Нравится мне они».</li>\n<li>2026-06-02 (id 487005) — «6 героев, 6 злодеев, 4 ахрепископа, 12 апостолов, ну и кто-нибудь из Нимба».</li>\n</ul>\n<h3>Как менялся состав</h3>\n<ul>\n<li><strong>Август 2025 (id 355184–359711).</strong> Состава нет вообще: апостол упоминается как одно лицо и как мера силы, имён и числа не названо. 2025-08-10 (id 355186) Слава просит вариантов способности «для самого жестокого апостола. Точне самого мерзкого лицемерного. Живущего лишь ради себя и наплевавший на всех. Он урод без только чего-то хорошего. И он не хитрый не умный просто ублюдок жестокий»; Миколай через сутки отвечает «бог у которого 2 лица» (id 355798), «или давать качества лицемерия другим» (id 355800).</li>\n<li><strong>2025-09-12 (id 364808).</strong> Введено число 21 и природа — насекомые из коконов. Единственное имя — Имит, в приписке-исключении.</li>\n<li><strong>2025-09-17 (id 366030–366034).</strong> Смена версии: апостол — тот, кто съел насекомое; 21 переезжает с апостолов на насекомых; появляется шанс выживания 13%.</li>\n<li><strong>2025-09-17 (id 366040).</strong> Предложены антиапостолы вместо одержимых: «Ещё добавить одержимых. Ну не одержимых. А сделать антиапостолов. С тёмными глазками. Ну они тоже должны насекомого съесть?» Вопрос о механике оставлен открытым.</li>\n<li><strong>2025-09-25 (id 368603–368608).</strong> Эта версия свёрнута: «Конец истории», «Конец вселенной», «Без энергии не как»; Миколай: «и че делать?» — «Хрен знает».</li>\n<li><strong>2025-10-03 (id 370732–370769).</strong> Формула про 21 повторена дословно. Уточнения по допросу Миколая: внешне полностью люди («Выглядят полностью как люди», id 370751), «Они говорят» (id 370752), «И у некоторых есть дети (обычный) дети апостолов рождаются обычными» (id 370756); «насекомые то есть они стали апостолами из-за насекомых?» — «Нет, они вылезли из коконов» (id 370757–370758); «Люди рождаются по другому \\ А апостолы вообще по другому и они куда более адаптивный существа» (id 370765); возраст в истории — 43 (id 370766–370768). Связь: «Они телепатически связанные друг с другом самого рождения» (id 370827), источник один (id 370829/370834), родились одновременно (id 370831/370836), апостолами родились, а не стали (id 370837/370840). Пробелы признаны прямо (id 370733): «Кто их родитель я так и не придумал \\ Какой следующий этап в их ней жизненном цикле будет я не знаю».</li>\n<li><strong>2025-10-18 (id 375849).</strong> Механика заменена: не коконы, а благословение от правителя рая; телепатия остаётся, но уже как дополнительная способность. Число то же — 21.</li>\n<li><strong>2025-10-20 (id 376401–376403).</strong> Третья версия за период: правители и благословения заменены частицей «Оам», апостолы переписаны в раздел «Мутанты» как люди с мутацией в утробе. Ни числа, ни телепатии, ни группы. Осталось: белые глаза (абзац дословно перенесён из id 370767) и лучший контроль Оам.</li>\n<li><strong>2025-10-22 (id 377616–377635).</strong> Возврат: «Кстати вернём старых апостолов \\ Они насекомые произошли от неизвестного мутировшого существа». Число 21 подтверждено, происхождение — от одного мутировавшего существа. Ограничение: «Ну только в вселенной Оам» (id 377627).</li>\n<li><strong>2025-11-17 (id 385768).</strong> Апостолы закреплены как раса, вторая по силе; над ними — Коты (их 9). Отдельно: «Проротой каменный челике. Владеют преступное организацию. Некий союз с апостолами».</li>\n<li><strong>2025-12-06 (id 393483–393486).</strong> «А также отдельно апостолы», «Я ведь изменил их и сделал насекомыми», и жалоба: «ИИ конечно хорошо. Но она не понимает многая. Отсылки, апостолы, сестра с её организации и многое другое».</li>\n<li><strong>2025-12-17 (id 399552–399560).</strong> Число урезано с 21 до 12; мотив назван прямо: «Ну давай. А то мне в падлу придумывать всех 21».</li>\n<li><strong>2026-01-31 (id 426512).</strong> Появляется первый поимённый список периода, на 12 номеров, две позиции пустые.</li>\n<li><strong>2026-01-31 (id 426535–426563).</strong> Попытка добить пустые позиции: Миколай предлагает «липкий \\ иссушающий»; Слава переспрашивает «Че за липкий» (id 426554); Миколай: «хм», «придумаю позже», «пока как заполнение» (id 426561–426563). Как утверждённые имена не приняты.</li>\n<li><strong>2026-02-09 (id 430400).</strong> Список пересобран: пустой стала строка 7, позиции 11 и 12 заняли «Кура» и «Избранный».</li>\n<li><strong>2026-04-25 (id 466476–466588).</strong> Апостолы возвращаются в новую вселенную — мир «без энергии», с благословенными и тёмными местами: «Хочу опять добавить апостолов». Определение сведено к сверхлюдям без индивидуальной способности; ограничение по числу снято; добавлена механика наследования (чёрные глаза после 18 лет и желание убить родителя).</li>\n<li><strong>2026-06-02 (id 487001–487176).</strong> Апостолы переопределены как «Проект апостолов. 12 созданных ИС», нейтральная сторона, но не все: «Вот Граф один из столпов героев». Названы сильнейшие: «Что сильнейший апостолы это Граф и Палач».</li>\n<li><strong>2026-06-07 (id 488439).</strong> Массовая правка возраста: «Давай изменим возраст апостолов теперь им за 40. \\ Звездочёт живёт отдельно от родителей, да и под бинтами не особо видно изменение. Не видно старый он или нет. \\ Агрегат уехать путешествовать. Но когда будет возвращаться домой. То будет отшучиваться, типа гены у него хорошие. Родителем граф вобще пофиг ( только они желают что бы он поскорее дал потомство из-за его способности)». Реакция Миколая: «ебать старые» (id 488442). Перечисление здесь — не полный список, а те, кого правка касается.</li>\n<li><strong>2026-06-07 (id 488546).</strong> Добавлен апостол Маура — «уродливая маска апостол со способностью вибрация».</li>\n<li><strong>Судьба апостолов в сюжете.</strong> 2025-08-30 (id 359691): «В конце всё истории и в последнее битве апостолы продуют. Большинство апостолов сдохнуть.» 2025-12-17 (id 399522, 399539–399547): «А что произойдет если апостол умрет. \\ Умретли он просто или переродится чем то иным. \\ У меня было пара идей. Заставите одно из апостолов быть выженым пламенем Серафима. После это конечно он выживает, но теряет семя ( я так и сам не до конца понял, что это за семя. Ну можешь считать это источником их силы и быстрое адаптации) и после этого он уходит от Апостолов ( точнее сбегает не желая чтобы его братья видели, как он умирает.) и По итогу он умирает в домике в лесу. И становится чем-то другими. Чудовищем. Он нападает на графа, что нашёл его. И пытается его сожрать.» Жертвой выбирается один из ещё не придуманных апостолов (id 399540). 2026-06-03 (id 487514): «Также он предсказал инцидент где апостол устроят геноцид. И они попытался им мешать. Очень сильно мешал. Но всё равно апостолы сделали своё дело, хотя и не так полноценно как сами того хотели.»</li>\n</ul>\n<h3>Отклонённые варианты</h3>\n<ul>\n<li><strong>Существа из рая как злодеи, Серафим как постоянный злодей.</strong> 2025-08-30 (id 359686–359687): «Есть Серафим. Но это одноразовый босс. Что появится, когда будет война с раем»; «И да я могу запихать разных существ из рая и устроить месива. Но существа из рая не подходят на злодеев. Во первых нет так таковой цели, кроме мести. Во вторых не какой группироаонной работы не будет их же в разный места раскидает».</li>\n<li><strong>Творцы во вселенной с апостолами.</strong> 2025-09-12 (id 364809): «Не знаю добавлять сюда творцов» — и прямой отказ 2025-09-17 (id 366039): «Артефактов и творцов точно не будет». Рамка: «Как ты понял я хочу более приземленую вселенную без правитель творцов и т. Д. Ну и без чудо способностей» (id 366041).</li>\n<li><strong>Сверхзрение / всевидящее око как способность апостолов.</strong> 2025-09-17 (id 366109–366115): «Сверх зрения или типа всё видящая ока я больше не хочу», перебраны «прозрачное зрение из клинка рассекающего демона» и «восприятия времени», выбрана связка восприятие времени + сверхчувства.</li>\n<li><strong>Существо-предок умерло, 21 насекомое съело его труп.</strong> 2025-10-22 (id 377639–377643). Миколай: «ещё вариант», «это существо умерло», «и 21 насекомые съели его труп» — Слава: «Нет».</li>\n<li><strong>Шкала «Эпические» на сайте.</strong> 2025-10-20 (id 376431): «Че за Эпические. Звучит хреново. Лучше бы была опасность примерный».</li>\n<li><strong>Дочь Имитатора как апостол «одна из 21».</strong> 2025-12-06 (id 393460 → 393468). Вариант пришёл из машинной вставки (три варианта статуса: апостол «Одна из 21» / полукровка / не апостол); Слава: «Хуйня. Имитатор жив. И будет участвовать в сюжете, возможно как гг. \\ Дети апостолов не являются апостолыми. Они обычные люди». Заодно отвергнута версия исчезновения Имитатора.</li>\n<li><strong>«Апостолы ⇒ значит есть бог».</strong> 2026-04-25 (id 466506–466514). Миколай: «а если апостолы», «значит есть и бог» — Слава: «Нет», «Без энергии», «Без богов».</li>\n<li><strong>«Все люди это апостолы».</strong> 2026-04-25 (id 466531, 466536–466537). Миколай (шутка): «все люди это апостолы 😁» — Слава: «Нихуяшеньки», «Не».</li>\n<li><strong>Смежное отклонение по составу столпов (не апостолы).</strong> 2026-06-03 (id 487531): «Святая дева её больше нет как персонаж вообще. Вместо неё одним из столпов злодеев становится Фатик ( желтоволосая девчушка) чем способности управления фотонами.» Ни та, ни другая к апостолам не отнесены — приводится, чтобы не спутать.</li>\n</ul>", "r": []}, {"t": "Что между периодами", "a": ["DOC-APOSTOLY-DVA-PERIODA--chto-mezhdu-periodami"], "h": "<p>Между 2025-06-10 (последнее упоминание апостолов в периоде А, id 335358–335361) и 2025-08-10 (первое упоминание в периоде Б, id 355186) в материале авторских высказываний об апостолах нет. Из этого промежутка чтецы отметили только машинное: 2025-07-30 (id 350785) — пересланный пост канала «ForgetMe | Нейросети» про генерацию видеообзоров в NotebookLM, к апостолам отношения не имеет.</p>\n<p>Внутри периода А отдельно стоит объявление о закрытии вселенной — 2025-03-25 (id 310843–310913): «Пора прощаться», «Это вселенная (апостолов ) была хорошая», «Была самой целестной», «Но для меня она исчерпала себя», «Конечно пока мы будем придерживаться еë. Пока я не создам новую», «Так как дальше я еë развивать не буду»; Миколай: «я уве понял что апостолов вселенная», «ей пиздец»; Слава: «Для меня апостолы были самой сбалансированный истории»; «Я не могу. Для меня она всё больше не как»; Миколай: «ты развивал её по большей части», «но она была в принципе сильная». Что уносится (id 310901): «Ну перс и артефакты. Возможно останутся. Хотя не факт. Возможно я создам вселенную вообще без сил». И сразу же (2025-03-25, id 311180–311181, переслано Миколаем в 311207–311208): «Сука первая что я сделал в голове это перенёс апостолов и уже придумал им логическая объяснения. Даже не до конца придумав мир», «Какой же я гений». После этого объявления апостолы в периоде А продолжают появляться — 2025-05-14 (id 325799), 2025-05-28 — 2025-05-31 (id 330991, 331453–331456, 331635–331639), 2025-06-10 (id 335358–335360).</p>\n<p>Внутри периода А же — пересчёт стартовых персонажей НОВОЙ вселенной, который легко спутать с пересчётом апостолов: 2025-03-25 (id 310939–310988). Обсуждаются числа 2/3/4/5: «Ну есть такая задумка начать с ключевых 2-5 персонажей т поверх них развивать вселенную», «Типо с 2-5», «Какой лучше число»; Миколай: «манипулятор и драчун», «2»; Слава: «Нет 4», «Или 3»; Миколай: «это проклятое число» (о 4), «это святое число» (о 3); Слава: «А мы любим проклятия», «Хотя сейчас лучше с 3»; Миколай: «мб с 2?». Апостолы здесь не считаются.</p>\n<p>Начало периода Б обрамлено таким же объявлением — 2025-09-12 (id 364756–364760): «Новая вселенная», «Хотя это просто редактирования старой вселенной», «Ну вселенную Апостол куда-нибудь в долгий ящик я не убираю. Просто отдохнуть от неё. Да и сама вселенная апостолов достаточно сложная и запутанная. Что даже я забываю кто че», «Самая сложная и пугающие для меня там стало это множество миров. Всё же множество миров для меня звучит слишком за мудрено сейчас».</p>", "r": []}, {"t": "Чем периоды различаются", "a": ["DOC-APOSTOLY-DVA-PERIODA--chem-periody-razlichayutsya"], "h": "<p><strong>Определение.</strong> В периоде А апостол — «благословенный Богом» (2025-01-28, id 285342), человек, отличаемый от прочих благословенных, отдельная строка верхнего уровня в списке; апостолом становятся (2025-03-14, id 302676: «Он стал апостолом, когда его атаковали кровью в спину»). В периоде Б основная формула — коллективная: «группа лиц из 21 человека телепатически связанный друг с другом» (2025-09-12, id 364808), и апостолами рождаются: «то есть они эволюционируют, но они не стали апостолами, они такими родились?» — «Да» (2025-10-03, id 370837/370840). Но и внутри периода Б определение не одно: одно лицо среди благословенных (2025-08-30, id 359681), насекомые из коконов (id 364808, 370732, 377625), съевшие насекомое (id 366034), люди с мутацией в утробе (2025-10-20, id 376401), 21 человек с благословением от правителя рая (2025-10-18, id 375849), сверхлюди без индивидуальных способностей (2026-04-25, id 466520), «12 созданных ИС» (2026-06-02, id 487001).</p>\n<p><strong>Природа.</strong> В периоде А апостолы — люди: у них человеческие имена (Дмитрий Рутковский, id 301808; Александр Лукашенко, id 302378) и прямое подтверждение «а защитник че прям человек?» — «Да» (id 302666–302667). В периоде Б апостолы прямо объявлены не людьми: «Но это не люди, это насекомые» (id 364808), «Апостолы не люди» (id 399514, 399521) — при том что «Выглядят полностью как люди» (id 370751) и «Насекомые я назвал их по приколу» (id 377643).</p>\n<p><strong>Число.</strong> Период А: у списка нумерация 1–14, произнесено вслух только «12 злодеев пока» (id 298847) и, отдельно от списка, «Нас апостолов 21 во всём мире» (id 305856) и «Апостолы это 21 человек» (id 331635). Период Б: 21 как основное число (id 364808, 370732, 375849, 377625, 385768, 393287, 399540), затем 12 (id 399560), затем «неограниченное количество» (id 466528), затем снова 12 (id 487001, 487005).</p>\n<p><strong>Состав.</strong> Период А: с 2025-02-25 существует устойчивый пронумерованный список 1–14, повторённый без изменений трижды (id 295559, 298850, 325799). Период Б: до января 2026 поимённых списков нет вообще, имена появляются поштучно; списки на 12 позиций появляются только 2026-01-31 (id 426512) и 2026-02-09 (id 430400), оба с пустыми строками.</p>\n<p><strong>Механика.</strong> Период А: сила идёт от правителя рая через мозг, поэтому не 24/7 (id 300888); апостолы не умеют лечить и влиять на разум (id 301867–301868); есть предохранитель в голове, который «Вырубить» можно (id 305856, 306163); телепатия между апостолами появляется в мае (id 331635); признак — белые светящиеся глаза (id 297463, 302670). Период Б: белые глаза как активируемый режим со сверхчувствами и дебаффом по боли (id 366117), постоянно действующие силы «как арбетары», замедленное/замершее старение (id 364808), регенерация без Оам (id 488545), природный охотник Азуриэль (id 366175), наследование через детей — то «дети апостолов рождаются обычными» (id 370756, 393468), то «после 18 лет… у них будут чернеть глаза» и «всегда после 18 лет захотят убить родителя» (id 466557, 466588).</p>\n<p><strong>Отношение к организации.</strong> Период А: АЗИП — организация, основанная апостолами и работающая на них (id 331454, 331456), апостолы «понаставили свои порядки» (id 301806), набирают агентов с иерархией «агент — куратор — 10 учеников» (id 305116). Период Б: сначала «нерушимая организация Азип, которой уже более сотней лет» (id 359681), затем апостолы становятся расой, союзной с преступной организацией Проротаев (id 385768), затем «проект» с нейтралитетом (id 487001, 487004).</p>", "r": []}, {"t": "Что совпадает", "a": ["DOC-APOSTOLY-DVA-PERIODA--chto-sovpadaet"], "h": "<p>Ниже — только совпадения имён и мотивов. Авторы нигде не говорят, что это те же самые персонажи; как тождество не фиксируется.</p>\n<p><strong>Имена, встречающиеся в обоих периодах:</strong></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Имя</th>\n<th>Период А</th>\n<th>Период Б</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Имитатор / Имит</td>\n<td>№1 в списке 1–14 (id 284858, 295559, 298850, 325799); «Имитатор апостол гг всего мира» (id 305428)</td>\n<td>id 364808 («Ну не считая Имита»), 370842, 376510, 382099, 393455 («Имит ( Имитатор) Апостол»), 426512 (№1), 430400 (№1), 488544 («Имет апостол и фигура старшего брата среди апостолов»)</td>\n</tr>\n<tr>\n<td>Агрегат</td>\n<td>№2 (id 284858 и далее); «Я Дмитрий Рутковский… Кодовая прозвище \"агрегат\". И я апостол» (id 301808)</td>\n<td>id 393478, 426512 (№2), 430400 (№2), 488439</td>\n</tr>\n<tr>\n<td>Защитник</td>\n<td>№5 (id 284858 и далее); «А звать его Александром Лукашенко» (id 302378)</td>\n<td>id 393473, 399521, 426512 (№3), 430400 (№3)</td>\n</tr>\n<tr>\n<td>Бессмертный выродок / Бессмертный</td>\n<td>№7 (id 284858 и далее); «Апостол», «Бессмертный» (id 295577–295578); «Апостола (Бессмертного)» (id 331639)</td>\n<td>id 393293 («кроме бессмертного»), 426512 (№4), 430400 (№4)</td>\n</tr>\n<tr>\n<td>Палач</td>\n<td>№4 (id 284858 и далее), с 2025-02-25 с припиской «( тварь)»</td>\n<td>id 382099 («апостола, который сильнейший в ближнем бою»), 426512 (№10), 430400 (№10), 487176</td>\n</tr>\n<tr>\n<td>Вибрация</td>\n<td>№9 (id 284858 и далее)</td>\n<td>id 426512 (№6), 430400 (№6), 488546 (Маура «со способностью вибрация»)</td>\n</tr>\n<tr>\n<td>Масочник</td>\n<td>добавлен 2025-01-28 (id 285522), №11</td>\n<td>id 426512 (№7)</td>\n</tr>\n<tr>\n<td>Небесная</td>\n<td>добавлена 2025-02-25 (id 295559), №13</td>\n<td>id 426512 (№9), 430400 (№9)</td>\n</tr>\n<tr>\n<td>Кура</td>\n<td>2025-05-31 (id 331639) — арбетар, «агент и приближенный Апостола (Бессмертного)», апостолом не названа</td>\n<td>2026-02-09 (id 430400) — №11 в списке апостолов</td>\n</tr>\n<tr>\n<td>Звездочёт</td>\n<td>в периоде А не встречается</td>\n<td>id 370842, 426512 (№8), 430400 (№8), 488439, 488545</td>\n</tr>\n<tr>\n<td>Граф</td>\n<td>в периоде А не встречается</td>\n<td>id 393298, 393478, 426512 (№5), 430400 (№5), 487004, 487176, 488439</td>\n</tr>\n<tr>\n<td>Избранный</td>\n<td>в периоде А не встречается</td>\n<td>id 430400 (№12); 2026-06-02 (id 487042–487045) «Изб» расшифровано как «Избранные», разбирается как один из столпов героев, апостолом прямо не назван</td>\n</tr>\n</tbody>\n</table></div>\n<p>Не переходят в списки периода Б имена периода А: Разрушительнитца / Разрушительница, Дитя света, Хулиган, Ученица???, Сон, Маэстро. Об их удалении авторы ничего не говорят.</p>\n<p><strong>Совпадающие мотивы:</strong></p>\n<ul>\n<li><strong>Белые глаза как признак апостола.</strong> Период А: «плакса» со «шрамами-слезами, белыми светящимися глазами» (id 297463); «Нет ещё, иначе бы я написал бы белый глаза» (id 302670). Период Б: «Первые белые апостола. Способны видеть оэм» (id 392478); весь абзац про активацию белых глаз (id 366117, 370767, 376401); «Ну не белоглазых» (id 371829).</li>\n<li><strong>Формула «21 человек, получивший благословение от правителя рая»</strong> — дословно одна и та же в периоде А (2025-05-31, id 331635) и в периоде Б (2025-10-18, id 375849), включая скобку про максимум благословений и абзац про телепатию. В периоде Б текст опубликован сообщением Миколая для сайта с пометкой «это только по одному твоему сообщению» (id 375848).</li>\n<li><strong>Ограничение по мозгу.</strong> Период А: «сила проходит через мозг. Повреждая его» (id 305856), «не могут использовать благословенный 24/7» (id 300888). Период Б: «Мозг просто не выдержит такое большое количество информации и нагрузки» (id 366117).</li>\n<li><strong>Апостол как мера силы.</strong> Период А: водоворот «достаточной сильный, чтобы затянуть апостола или арбетара» (id 331639). Период Б: «Да она сильнее одного апостола» (id 359684); «не кто из апостоловы не сможет нормально их ранить» (id 370605, 376402, 382108).</li>\n<li><strong>Дочь апостола.</strong> Период А: «Апостол у которогой есть дочь» (id 285412). Период Б: дочь Имита, ушедшая от него (id 393473, 393476), «Дочь имета. (Доима)» (id 488439–488440). Авторы этих упоминаний между собой не связывают.</li>\n<li><strong>Серафим как противник.</strong> Период А: боевая четвёрка против Серафима (id 285409–285413), «против Серафима по сюжету должны были драться совсем другие перс» (id 285405). Период Б: «Есть Серафим. Но это одноразовый босс. Что появится, когда будет война с раем» (id 359686); «Заставите одно из апостолов быть выженым пламенем Серафима» (id 399522).</li>\n<li><strong>Апостолы против религиозной организации.</strong> Период Б: id 364774, 364808, 370732, 377625. В периоде А в реестре есть раздел «Церковь:» (id 298850, 325799), но связки с апостолами авторы не проговаривают.</li>\n</ul>", "r": []}, {"t": "Расхождения и нерешённое", "a": ["DOC-APOSTOLY-DVA-PERIODA--rashozhdeniya-i-nereshennoe"], "h": "<ul>\n<li><strong>«12 злодеев» против нумерации до 14.</strong> 2025-03-06 (id 298847–298850): сказано «12 злодеев пока», «Ну в списке моём», а пронумерованный блок «Благословенный:» в том же сообщении доведён авторами до 14. К какому разделу относилось «12» (к «Благословенный» или к «Враг», где нумерации нет), из переписки не следует.</li>\n<li><strong>Служебная карточка «Список 12 апостолов» против авторской нумерации 1–14.</strong> Отмечено чтецами трижды: 2025-02-25 (id 295559), 2025-03-06 (id 298850), 2025-05-14 (id 325799). Ни Слава, ни Миколай в этих местах слов «их 14» или «их 12» не произносят.</li>\n<li><strong>21 в переписке против 12 в названии карточки (март — май 2025).</strong> В окнах 2025-03-18 — 2025-03-25 единственное названное число — 21 (id 305856), числа 12 в них нет вообще. То же для окон 2025-05-22 — 2025-06-17: «21» (id 331635), «12» авторами не произносится.</li>\n<li><strong>21 у апостолов и 21 у филиалов АЗИП.</strong> 2025-05-30 (id 331444): «Ну у неё 21 главных филиалов». Связка с числом апостолов (тоже 21, id 331635) авторами не проговорена — совпадение, не утверждение.</li>\n<li><strong>Заголовок раздела.</strong> 2025-01-28 (id 285533–285534) Слава обещает разделить благословенных и апостолов — «Сделаю сделаю»; заголовок остаётся «Благословенный:» и в феврале (id 295559), и в марте (id 298850). Раздел называется «Апостолы:» только с 2025-05-14 (id 325799).</li>\n<li><strong>Апостолы отсутствуют в перечне категорий за четыре дня до списка.</strong> 2025-05-10 (id 324541) — перечень без апостолов; 2025-05-14 (id 325799) — апостолы первой рубрикой.</li>\n<li><strong>«Воительнтца» и «Разрушительнитца».</strong> 2025-01-28 (id 285409–285413): имена авторами прямо не отождествлены, совпадает только значок 💪 / «Оружейный браслет 💪».</li>\n<li><strong>21 — апостолы или насекомые.</strong> 2025-09-12 (id 364808): «группа лиц из 21 человека», «Всё двадцать один апостол». 2025-09-17 (id 366034): «Всего насекомых 21», число апостолов не названо.</li>\n<li><strong>21 насекомое против трёх видов насекомых.</strong> 2025-09-17: «Всего насекомых 21» (id 366034) и «есть каменный жук \\ Белая бабочка ( ну или гусеница) \\ Ну и для одержимых чёрный червь» (id 366106).</li>\n<li><strong>«Это не люди, это насекомые» против «Выглядят полностью как люди».</strong> Внутри одной версии: id 370732 и id 370751 (оба 2025-10-03). Позже смягчено: «Насекомые я назвал их по приколу» (id 377643).</li>\n<li><strong>Список на 12 номеров с пустыми строками.</strong> 2026-01-31 (id 426512): строки 11 и 12 без имён. 2026-02-09 (id 430400): пустая строка 7, при этом 11 и 12 заполнены — 12 номеров, 11 заполненных строк. Имена «липкий» и «иссушающий» (id 426535) как утверждённые не приняты: «пока как заполнение» (id 426563).</li>\n<li><strong>«Почему их 21» — без ответа.</strong> 2025-12-17 (id 399546–399548). Миколай: «и кстати почему их 21?» — Слава: «Я хуй знает».</li>\n<li><strong>Обмен числами 3 / 4 / 12 сразу после решения про 12.</strong> 2025-12-17 (id 399562–399579). Из текста не видно однозначно, идёт ли счёт про апостолов или про 4 последователей Бога красок, обсуждавшихся рядом; разговор обрывается на «лан» / «как хочешь», нового числа апостолов не утверждено.</li>\n<li><strong>Титул быстрейшего апостола.</strong> 2025-12-06 (id 393298): «плюсом он быстрейший апостол ( хотя этот титул носит другой Апостол. Ну по факту он быстрее)». Имя носителя титула не названо.</li>\n<li><strong>Родитель апостолов и следующий этап жизненного цикла.</strong> Отмечено как пробел трижды и ни разу не закрыто: 2025-10-03 (id 370733), 2025-10-22 (id 377626), 2025-12-17 (id 399514, 399521, 399583 — пункт плана «Придумать жизненные цикл апостолов и придумать кто их родитель»).</li>\n<li><strong>Второе благословение для Бессмертного.</strong> 2025-05-31 (id 331661): предложение Миколая осталось без ответа в пределах окна.</li>\n<li><strong>Список без подписи.</strong> 2026-06-09 (id 488786): 19 имён, среди них «имитатор» и «лёд», но словом «апостолы» список авторами не назван; принадлежность не заявлена.</li>\n<li><strong>Судьба «Ученицы???».</strong> Имя стоит в списке периода А с 2025-01-27 по 2025-05-14 (id 284858 → 325799) с тремя вопросительными знаками; в переписке о ней не сказано ничего.</li>\n<li><strong>Апостолы на сайте.</strong> 2025-10-20 (id 376423–376435): «А апостолы где, всё есть даже вампиры, а апостолов нету» (id 376432). 2025-11-17 — 2025-11-19 (id 386174–386177, 386496–386509, 386616–386621): Миколай откладывает документ по вселенной — «бля, документ, точно», «когда-то я продолжу его делать», «я начал и забыл потом»; разбор концепции в пределах окна не состоялся.</li>\n</ul>", "r": []}, {"t": "Машинные вставки", "a": ["DOC-APOSTOLY-DVA-PERIODA--mashinnye-vstavki"], "h": "<p>Отмечены чтецами как машинные и в находки не взяты.</p>\n<p><strong>Период А:</strong></p>\n<ul>\n<li>2025-01-28, id 285350–285351 — копипаста из нейросети «как победить Серафима» (список тактик, «В Заключение»), после вопроса Миколая «кидать тебе или лучше самим думать?» (id 285348).</li>\n<li>2025-01-28, id 285369, 285378, 285466 — ссылки telegra.ph с боями персонажей и «анализом персов», сгенерированными нейросетью; Миколай: «да, тут не я подумал и да ты сказал так не делать» (id 285469).</li>\n<li>2025-01-30, id 286046 — разбор геометрической задачи (треугольник ABC), к вселенной отношения не имеет.</li>\n<li>2025-02-25, id 295605 — разбор характера Бена Теннисона («Ben 10»).</li>\n<li>2025-02-25, id 295612, 295618, 295620 — описания характеров чужих персонажей (Шинпачи, Кагура, Таня) для выбора роли на отыгрыш.</li>\n<li>2025-02-26, id 295984, 295995, 295996 — сгенерированная поэма «Проект Пирог» / «Пирог в шапке» с комментарием модели.</li>\n<li>2025-02-27, id 296044 — Миколай приводит свой промпт про летающий пирог.</li>\n<li>2025-03-01, id 297262 — ссылка на разбор электрической схемы в Grok.</li>\n<li>2025-03-03, id 297400–297417 — обсуждение картинок/символов от разных нейросетей.</li>\n<li>2025-03-11, id 301214–301239 — ссылки telegra.ph с анализом истории; Миколай отмечает, что нейросеть посчитала Славу персонажем (id 301219–301220).</li>\n<li>2025-03-13, id 301664 — ответ нейросети «как рисовать хоррор» с пунктами 1–8 и «Ключевой вывод».</li>\n<li>2025-03-14, id 302244–302260 — telegra.ph «nejronka-03-14»; Слава цитирует машинное обращение (id 302248, 302258).</li>\n<li>2025-03-14, id 302829 — пересланный чужой текст про «геймификацию».</li>\n<li>2025-03-16, id 303498–303565 — обсуждение того, что Grok всё привязывает к их вселенной; telegra.ph «Analiz-03-16-3», «zashchitnik-03-16».</li>\n<li>2025-03-18, id 305221, 305227 — «идеальный слух» и «идеальный контроль мышц» в «идеальной человеческой модели» (под способность Максима).</li>\n<li>2025-03-20, id 306605–306606 — длинный машинный разбор истории «Бессмертный»; Слава: «Это зачем?» (id 306607); Миколай: «нейронка настолько длинный анализ написала» (id 306615).</li>\n<li>2025-03-20, id 306634 — telegra.ph/kritika-03-20; Слава разбирает в id 306646.</li>\n<li>2025-03-25, id 310862, 311149, 311154, 311169–311173 — промпт про перевёрнутые слова, блок вопросов для создания вселенной, «творческий перезапуск», методички по созданию мира.</li>\n<li>2025-05-07, id 324211–324215 — разбор таёжного хоррора. Апостолы не упоминаются.</li>\n<li>2025-05-15, id 32
