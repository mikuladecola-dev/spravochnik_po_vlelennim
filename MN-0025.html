<script>const BASE="";const DOCNAME="Тьма под сценой";
const LEAD="";
const CH=[{"t": "Где находится — в каком мире и в каком его месте", "a": ["S01", "MN-0025-S01", "MN-0025--gde-nahoditsya"], "h": "<p>Вселенная не определена — в записи стоит «неясно» (по дате объявления). Окно w0111, 2025-11-21, сообщения 387594–387595.</p>\n<p>Монумент — часть Цирка ведущего: это то, что находится под полом сцены. Устройство подано вертикально и слоями: сцена, под ней тьма, а ниже тьмы — свет. Зрительный зал отделён от сцены перилами (ограждением); тьма же — не сбоку, а строго вниз.</p>", "r": []}, {"t": "Что собой представляет", "a": ["S02", "MN-0025-S02", "MN-0025--chto-soboy-predstavlyaet"], "h": "<p>Слой первый — <strong>тьма</strong>. Она описана как почти вещественная: там «было темно настолько, что казалось, что она телесная». Границ у неё нет — в конце фрагмента София падает «в бесконечную тьму не зная, где границы».</p>\n<p>Слой второй — <strong>свет под тьмой</strong>, и он страшнее. Правило сформулировано авторским текстом прямо и вынесено как главное:</p>\n<p>«Чудика пугала не тьма. Тьма не страшная, как бы вы не пытались фантазировать. Хотя те кто жил в той темноте. Был страшен. Но это не важно. Сейчас то страшнее всего свет. Свет, что был вниз. Свет из, которого из ходили крики. Душераздирающий крики, и они там не на секунду, не утехали.»</p>\n<p>То есть иерархия страха задана явно: тьма сама по себе не страшна; тот, кто в ней живёт, страшен; но страшнее всего — свет ниже тьмы и непрекращающиеся крики из него.</p>\n<p>Слой третий — <strong>обитатель тьмы</strong>. Он показан один раз и только частично. Когда падающий вниз чудик горит, свет его огня освещает тьму: «И это огонь. Нет свет огня осветил. Ту тьма. Заставил её отступить. Или тьма сама решил приоткрыть себя. Чтобы сам ведущий не забывал. Что живёт в нем. А там было видно. Лишь слегка шевеление, чего-то на столь большого, что сцена была лишь мошкой по сравнению размера этого существа.»</p>\n<p>Масштаб задан этим сравнением: сцена рядом с существом — мошка. Само существо не названо и не описано, видно только шевеление. Две версии того, почему тьма приоткрылась, даны в тексте как равноправные и не разрешаются: либо её отогнал свет огня, либо она открылась сама — «чтобы сам ведущий не забывал. Что живёт в нем».</p>", "r": []}, {"t": "Что с ним связано — предметы, механики, силы", "a": ["S03", "MN-0025-S03", "MN-0025--chto-s-nim-svyazano"], "h": "<p><strong>Исчезающий пол.</strong> Доступ вниз открывается по воле ведущего: пол под чудиком «вдруг исчез. Превратился в дым и он полетел вниз». После падения «Пол начал восстанавливаться». Тот же приём применён к Софии в конце: «А пол становился мягким словно тесто. И девочка начала падать». Как именно ведущий это делает, в переписке не объяснено.</p>\n<p><strong>Огонь, которым горит чудик.</strong> Отдельно отмечено, что огонь ведёт себя как живой и боится ведущего: когда горящий чудик схватил ведущего за ногу, «огонь, которым полыхал чудик отстранился от ведущего словно испугался. Словно кошка увидела собаку и от испугавшись отскочила». Именно этот огонь при падении осветил тьму.</p>\n<p><strong>Маска ведущего.</strong> Пульсирующая маска, которой ведущий «помогает избавиться» от чувства вины. Она надевается на человека сама, и после этого человек перестаёт ощущать тело: «Она и лица не почуствовала. А после поняла, что и рук не чувствует. Словно её нету. Словно она ничто». К тьме под сценой маска прямо не привязана; связь между ними в переписке не названа.</p>\n<p><strong>Свет внутри маски.</strong> Внутри состояния под маской София тоже видит свет и бежит на него — «Но вдруг она увидела свет. Она побежала в сторону света» — и попадает в тело избитого мальчика, то есть в воспоминание ведущего. Тот ли это свет, что под тьмой, в переписке не сказано.</p>", "r": []}, {"t": "Персонажи и события — кто с ним связан и что там происходило", "a": ["S04", "MN-0025-S04", "MN-0025--personazhi-i-sobytiya"], "h": "<p><strong>Ведущий.</strong> Хозяин сцены и цирка. Отправляет вниз чудика, который снял маску. Приказ отдан дважды: сначала тихо, наклонившись к уху, — «вниз живо!», затем, после мольбы, — «Я Сказал ВНИз!!!», грубо и зло. Он смотрит, как чудик падает, и продолжает глядеть в пол после того, как тот восстановился. Про обитателя тьмы сказано применительно именно к нему: тьма приоткрывается, «чтобы сам ведущий не забывал. Что живёт в нем».</p>\n<p><strong>Чудик.</strong> Один из выступающих в масках. Стоит на коленях, полыхает огнём. Умоляет не отправлять его вниз, предлагая взамен продолжение пытки: «пожалуйста.... Не надо.. Я способен выступать... Я правда способен.. Вы можете дальше меня поджигать». Хватает ведущего за ногу. Проваливается вниз, вопит и что-то пытается сказать, «Но его уже было не слышно». Что с ним стало внизу, не сказано.</p>\n<p>Остальные чудики в это время дрожат в углу, «Крепко держа свои маски». Ведущий называет их «жалкий, ничтожный опарыши, что бояться даже покаяться».</p>\n<p><strong>София (Софья).</strong> Девочка-зрительница, свидетельница падения. Ей жалко чудика: «За что с ним так. Ну и что, что он маску снял. Лицо у него же не страшное». Она пятится к перилам, разделяющим сцену и зрительный зал, но ведущий оказывается у неё за спиной. Разговор с ней ведётся ласково и с улыбкой:</p>\n<ul>\n<li>«София, а ты знала, что твоё имя обозначает мудрость. Но ты почему-то совершаешь так много глупых поступков»;</li>\n<li>о нарушенном ею запрете: «табу, которые ты нарушал, всё равно было негласным, а значит его, как бы и не было. Да?» — и она отвечает «Ддддааа»;</li>\n<li>о зрителях: «ещё не надо забывать вы зрители. Особенный гости моего цирка. Моей сцены. Каждому из вас я готов дать шанс», и затем грустно — «но почему-то вы его не цените».</li>\n</ul>\n<p>Оглядевшись, София видит, что зрители улыбаются «как манекен», а её родители — отец с гордой улыбкой и весело смотрящая мать — сидят «как истуканы» со стеклянным взглядом «куда-то за спину Софьи». Тогда у неё появляются вопросы: «Как мы оказались в этом цирке?», «Что это за цирк?», «Что за сцена?», «Что здесь вообще происходит?» Ответов в тексте нет.</p>\n<p><strong>Маска и воспоминания ведущего.</strong> На вопрос «ты же чуствуешь вину?» София отвечает «да», считая это правильным ответом, «Но ошибалась». Ведущий: «что же раз ты чувствуешь вину. То я помогу избавиться от этого чувства». Она бежит к родителям, успевает коснуться ограждения — и маска оказывается на ней, ограждение исчезает из рук. Дальше она проходит через два эпизода прошлого ведущего в теле избитого мальчика:</p>\n<ul>\n<li>мужчина лет сорока в военной одежде с ремнём с железной пряжкой; голос ведущего поясняет: «отец очень сильно любил бить меня железной пряжкой ремня. Словно находил в этом удовольствия»;</li>\n<li>комната, где всё ровно разложено, и домашнее задание; пояснение: «чтобы избежать побоев отца. Я пытался быть идеальным. Пытался наводить частоту. Хорошо учиться». Идеальный порядок не спасает: пьяный мужчина опрокидывает её со стула, бьёт ногой по рёбрам, тащит за волосы по коридору.</li>\n</ul>\n<p>Когда София вырывается и бежит по коридору, её тело парализует, и ведущий цокает: «всё должно идти по сценарию». После этого пол размягчается и она падает в бесконечную тьму, не чувствуя тела. Та ли это тьма, что под сценой, в переписке прямо не сказано.</p>", "r": []}, {"t": "Как менялся по версиям — по датам", "a": ["S05", "MN-0025-S05", "MN-0025--kak-menyalsya-po-versiyam"], "h": "<p>Версия одна.</p>\n<p><strong>Версия 1 — 2025-11-21 (окно w0111, id 387594–387595).</strong> Здесь тьма под сценой и вводится, и сразу получает своё правило: страшна не тьма, а свет под ней; тот, кто в темноте живёт, страшен, но «это не важно». Тогда же показано единственное появление существа — шевеление при свете горящего чудика. Других состояний и переработок в переписке нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "MN-0025-S06", "MN-0025--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вселенная не определена — в записи стоит «неясно».</li>\n<li>Кто именно живёт в темноте, не раскрыто; названо только то, что ведущий «не забывает, что живёт в нём», и что существо огромно настолько, что сцена рядом с ним — мошка.</li>\n<li>Что за свет находится ниже тьмы и кто кричит в нём, не объяснено.</li>\n<li>Что происходит с теми, кого отправили вниз, не сказано; судьба упавшего чудика не описана.</li>\n<li>Механика исчезающего пола не объяснена.</li>\n<li>Связь тьмы под сценой с бесконечной тьмой, в которую София падает под маской, не установлена — совпадают ли они, в переписке не сказано.</li>\n<li>Почему огонь чудика отшатывается от ведущего, не объяснено.</li>\n<li>Что за негласное табу нарушила София, прямо не названо.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["MN-0025--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-11-21</td>\n<td>387594–387595</td>\n<td>w0111</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/monumenty/MN-0025-tma-pod-scenoy.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MN-0025--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MN-0025.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
