<script>const BASE="";const DOCNAME="Захар Авгур";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0146-S01", "PS-0146--proishozhdenie"], "h": "<p>Персонаж Миколая, придуман и введён в один вечер 20 августа 2024 (id 220624–220694, окно w0054). Он же — рассказчик: история написана от первого лица, весь материал о нём — его собственная речь.</p>\n<p>Появляется в первой части истории, которую Миколай отправил в переписку частями. Перед отправкой он предупредил: «она слишком подробная выходит», «если полностью написать решусь сейчас, качество пострадает», и предложил Славе задавать вопросы — «отвечу в следующей части» (220625–220629).</p>\n<p>Имя и фамилия — Захар Авгур. Фамилия объясняется прямо в тексте самим персонажем: «да, моя фамилия похожа на название древних жрецов, всё верно». Он автор книги «Память забытому».</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0146-S02", "PS-0146--vneshnost"], "h": "<p>Внешность в переписке не описана. Из бытовых деталей известно только, что в момент действия он сидит на диване перед телевизором и сам оценивает своё состояние как «не ухоженный» — эта оценка звучит в другой истории, не в его; в его собственном тексте о внешности не сказано ничего.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0146-S03", "PS-0146--harakter"], "h": "<p>Определяющая черта — жажда славы, названная им самим прямым текстом: «а я, если честно, очень жажду славу».</p>\n<p>Его рассуждение о славе дано в переписке развёрнуто: «думать о бессмертии физическом бесполезно, людей обладающих ей не существовало, так что, все последующие потуги также безнадёжны. но вот в историю своё имя вписали многие, а моя цель затмить их своим величием. это самая достойная форма бессмертия».</p>\n<p>О собственной книге он говорит как о технически рассчитанной вещи: «в своей работе я реализовал все критерии известного опуса и создал её в форме, которая обязана возыметь огромную аудиторию, культовость и популярность. мой стиль значительно отличается от чужих, поэтому моё имя процитируют все издательства».</p>\n<p>Пишет непрерывно и в ущерб всему остальному: почту не читает, «я всё время пишу без конца и стараюсь улучшить навык, последний раз почту проверял, когда пригласили на церемонию». Именно непрочитанная почта и оказывается причиной его провала.</p>\n<p>Мистику отрицает. Увидев в эфире новость о задержании похитителей человека с рыбьей мутацией, комментирует: «ладно, только не говори, что поверил в эту сказку. мистических явлений не существует по крайней мере по телевизору о них точно не будут так нелепо говорить».</p>\n<p>К чужой славе относится через мерку известности. О спасателе: «да если бы он реально был героем, то о его подвигах знали бы все. как говорится \"герою - слава\". а о нём почти никто не знает, уличный парень. если бы я в этой истории его не упомянул, то и ты бы нигде больше о нем не услышал». Дружбу с ним объясняет тем же критерием: «он мне не конкурент, поэтому мы с ним дружим».</p>\n<p>Соперника по премии разносит: «да кто вообще посмел этого никчёмного графомана вообще пускать на телевизор, каждая его работа - третьесортная компиляция и подростковый опус. его работы достойны максимум четвёрки за урок по литературе и похвалу от матушки». Свой стаж противопоставляет чужому: «он первый раз участвствует в этом конкурсе, я участвую шестнадцатый год, я всё сделал идеально».</p>\n<p>Даже поражение сразу пересчитывает в возможную известность: «стоп, может благодаря тому, что мою работу признали экстремистской это мне подарит известность».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0146-S04", "PS-0146--sposobnosti"], "h": "<p>Способностей у него в переписке не названо. Он обычный человек — писатель.</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0146-S05", "PS-0146--svyazi-s-drugimi"], "h": "<p><strong>Спасатель.</strong> Знакомый Захара, персонаж Славы. Приходит к нему ночью, стучится в окно первого этажа; Захар описывает первое впечатление: «там стоял темный злой силуэт в капюшоне. но это оказался мой знакомый». Захар впускает его, чтобы не пропустить эфир, а тот встаёт перед телевизором и отчитывает его за непрочитанную почту. Захар характеризует его как помешанного на мистических существах фанатика и клоуна. Отношения он же и объясняет отсутствием конкуренции.</p>\n<p><strong>Беркут.</strong> Монстр, о котором Захар когда-то рассказал спасателю «известную байку»: «с ним была какая-то тёмная история связана». После рассказа спасатель «пошёл весь в ярости и с улыбкой до ушей в тот город где обитает это существо». В момент действия спасатель заявляет, что изгнал этого монстра, спас детей города и что «будущее теперь под его защитой».</p>\n<p><strong>Дифер Фрог.</strong> Писатель, получивший Пулитцеровскую премию вместо Захара. Захар видит это в записи церемонии и не понимает, как это возможно: «мне же вручили Пулитцеровскую премию, почему вместо меня её получает Дифер Фрог».</p>\n<p><strong>Человек с рыбьей мутацией.</strong> Появляется в выпуске новостей, прервавшем эфир: сообщение о задержании его похитителей. Захар в него не верит.</p>\n<p><strong>Гибрид монстра и человека (жертва похищения).</strong> Существо, которое спасатель предлагает поймать. Захар считает план безумием: «человека похитить, он точно сумасшедший», — и добавляет: «но его полный план на деле был куда мрачнее».</p>\n<p><strong>Память забытому.</strong> Книга Захара, за которую он претендовал на премию и которую позже признали экстремистской.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0146-S06", "PS-0146--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2024-08-20, id 220624–220654.</strong> Первое появление целиком: имя, фамилия «как у древних жрецов», книга «Память забытому», мотив славы как формы бессмертия, шестнадцатый год участия в премии, приход спасателя, срыв награждения и сделка.</p>\n<p>Ход сцены: он садится смотреть запись церемонии; эфир прерывает новость о задержании похитителей человека с рыбьей мутацией; в окно стучится спасатель; во время эфира выясняется, что премию получает Дифер Фрог. Объяснение даёт спасатель: работы Захара «через неделю признали экстремистскими и поэтому пришлось отдать место второму кандидату, не менее достойному», а предупреждение было — на почте, которую Захар не читал.</p>\n<p>Отдельная деталь, которую Захар оговаривает сам: награждение, по его словам, уже состоялось и он там присутствовал, но «свидетелей из знакомых не было. но это точно не сон».</p>\n<p>В конце первой части — сделка. Спасатель зовёт его на задание: поймать гибрида монстра и человека, ходящего по их улицам. Подкуп — трансляция: «все действия с этим существом(хотя явно этот поехавший просто выберет человека), будут транслироваться в даркнете». Захар соглашается ради имени: «а я хочу чтобы моё имя было известно на веки. он точно не спалится, а вот я. я придумаю план, как можно сделать так, чтобы нас разоблачили. да так, чтобы об этом узнал весь мир». Итог его рассуждения: «ну, я смогу заполучить славу, у меня это получиться в любом случае».</p>\n<p>Слава на этом месте отвечает: «Я тоже хотел это предложить» (220651).</p>\n<p><strong>Версия 2 — 2024-08-20, id 220662–220694.</strong> Обсуждение второй части, ещё не написанной. Слава прочёл первую часть и оценил: «Неплохо даже хорошой», «Лучшая твоя история» (220666).</p>\n<p>Планы Миколая на вторую часть, названные напрямую: «я хочу твоего спасателя сделать ублюдком)», «он использует монстров в своих целях для спасения людей», «моего персонажа с помощью какого-то жука заставил увидеть галлюцинацию» (220669–220672). То есть Захар из соучастника переводится в положение жертвы манипуляции: галлюцинацию ему навязывают через жука.</p>\n<p>Слава на этом месте остановил рассказ: «Стопэ», «Не надо слишком больших сполеров» (220673, 220675), — и задал единственный вопрос: похищенный — человек или нет. Ответ Миколая: «он человек, но с иммунитетом способным адаптировать клетки монстров. тобиж если к нему пришьют органы монстра он не умрёт» (220685). Там же зафиксирована связка историй: «это всё вступление в твою последнюю историю» (220681).</p>\n<p>Про похищенного Слава уточняет: «Я в свой истории про это не писал поэтому сам не знаю» (220684).</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0146-S07", "PS-0146--chto-s-nim-stalo"], "h": "<p>Вторая часть в переписке не появилась. Известно только намерение автора: Захар должен стать жертвой манипуляции спасателя и увидеть галлюцинацию, наведённую жуком. Написана ли эта часть — из переписки не видно.</p>\n<p>Последняя точка, в которой персонаж показан по тексту истории: он согласился на участие в похищении ради разоблачения и славы.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0146-S08", "PS-0146--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Внешность не описана.</li>\n<li>Вселенная нигде не названа; связь с историей Славы заявлена («это всё вступление в твою последнюю историю»), но названия цикла нет.</li>\n<li>Имя спасателя в этой истории не звучит — он назван только «спасатель», «знакомый».</li>\n<li>«Тёмная история», связанная с Беркутом, названа, но не рассказана.</li>\n<li>Не сказано, чем закончилась галлюцинация и была ли вторая часть написана.</li>\n<li>Не объяснено расхождение между тем, что Захар помнит награждение и своё присутствие на нём, и тем, что премию получил другой; вопрос в переписке не поднимался.</li>\n<li>Что за жук наводит галлюцинацию — не сказано.</li>\n<li>Судьба книги «Память забытому» после признания экстремистской не описана.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0146--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0146--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-20</td>\n<td>220624–220654</td>\n<td>w0054</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-08-20</td>\n<td>220662–220694</td>\n<td>w0054</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0146-zahar-avgur.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0146--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0146.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
