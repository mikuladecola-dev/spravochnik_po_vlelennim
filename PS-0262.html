<script>const BASE="";const DOCNAME="Бригада лесорубов";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0262-S01", "PS-0262--proishozhdenie"], "h": "<p>Бригада лесорубов — коллективный персонаж вселенной «Нимб», появившийся в тексте, который Слава выкладывает от первого лица от имени Ивана Васильевича (2025-05-02, id 323364–323370). Бригада — это «наши», напарники рассказчика; сам Иван Васильевич входит в её состав, и запись о бригаде числится частью его записи.</p>\n<p>Работа бригады — законная валка леса. Рассказчик оговаривает это дважды и отдельно: «И не подумайте, всё законное. Мы не какие-то там браконьеры или вроде того. Свою матушку Россию со всеми еë недостатками, я всё равно люблю. Поэтому, как либо вредить ей. Я не намерен». Позже, когда речь заходит про двустволки, оговорка повторяется: «И повторюсь мы не браконьеры. Оружия у нас законно».</p>\n<p>Время выезда названо приблизительно, самим рассказчиком: «Как-то осенью. Сейчас уже точно не припомню. Но где то в октябре». Место — тайга, «небольшой такой участок, который находился рядом с горой, а в это горе было много пещер». Пещеры Иван считает природными по единственному признаку: «Ну я не увидел там опор, поэтому посчитал эту пещеру природной».</p>\n<p>Численность на выезде: «Наш-то в бригаде было 8 человек».</p>\n<p>По именам в переписке названы пятеро:</p>\n<ul>\n<li><strong>Иван Васильевич</strong> — рассказчик, «мужик уже за тридцать, который пол жизни отдал работе лесоруба»;</li>\n<li><strong>бригадир</strong> — по имени не назван; возраст даётся косвенно: «Да быстро так словно не 50 летний мужик, а малец какой»;</li>\n<li><strong>Игорь</strong> — «самый младший из нас»;</li>\n<li><strong>Михаил</strong>, он же Мишка, Миша — «был парням крепким и самым крупным в бригаде»;</li>\n<li><strong>Тоха</strong>, он же Григорий — «Первым пошёл Тоха ну для вас Григорий».</li>\n</ul>\n<p>Остальные трое по именам не названы; в тексте они появляются только как пострадавшие.</p>\n<p>Быт и снаряжение: лагерь с палаткой, машина, аптечка («Аптечка конечно есть. Всё же не новички какие-нибудь»), фонарик, который «валялся в машине фиг пойми сколько», и две двустволки для охоты. Дежурные ходят готовить еду, бригада ест за общим столом. Есть упоминание прошлого опыта: «Сколько обвалом было на наших шахтах» — то есть работа бригады не сводится только к лесу, но подробнее это не раскрывается.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Что не сформулировано по вашей же логике — не материал авторов</b>\n<p>Про оружие правило проговорено дважды и отдельно: «И не подумайте, всё законное», «И повторюсь мы не браконьеры. Оружия у нас законно». Про сам заход в пещеру — вещь того же рода: чья это гора, можно ли туда лезть, отвечает ли за это кто-то — правила нет. Иван даёт одно определение, и то не про право, а про происхождение: «Ну я не увидел там опор, поэтому посчитал эту пещеру природной». Для двустволок законность названа, для проникновения — нет.</p></div>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0262-S02", "PS-0262--vneshnost"], "h": "<p>Отдельного описания бригады как группы нет; черты даются поштучно и по ходу действия.</p>\n<p>Михаил — «парням крепким и самым крупным в бригаде». Его размер работает как деталь сюжета: вход в пещеру ему мал, и при пролезании он рвёт кофту — «услышал резкий звук... это звук рвущийся одежды», после чего «уже осмотрев насколько сильно порвалось и поняв, что это уже на помойку».</p>\n<p>Игорь — самый младший, «Молодой шибко, залезть куда желает. Да и по выносливее нас будет».</p>\n<p>Бригадир — пятидесятилетний мужик, но на дерево залезает «словно не 50 летний мужик, а малец какой».</p>\n<p>Иван Васильевич — «за тридцать».</p>\n<p>Как бригада выглядит после спуска с горы, показано глазами бригадира: «Всё его работники бегут к нему все с порванной одеждой в крови и орут. Просто орут».</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0262-S03", "PS-0262--harakter"], "h": "<p>Характеры прописаны по отдельным людям.</p>\n<p><strong>Иван Васильевич.</strong> Главным своим качеством называет хладнокровие: «я всегда выбирался из этих бед благодаря моему самому главному, как по мне качеству хладнокровию. И вот сейчас это хладнокровия слетела с меня. Моей самое главное качество в жизни просто исчезла. Просто так, без какой-то либо причины». Второе — нежелание показывать слабость: «я, как вы уже поняли не любитель показывать слабость, какой бы она не была. Поэтому молчал». Это же он потом называет своей виной: «Конечно же ничего бригадиру я не сказал баран. Возможно если бы я отодвинул на второй план свою гордыню. И сказал всё как есть. То бригадир бы послушал бы меня. И мы бы уехали оттуда. Возможно, но не точно».</p>\n<p><strong>Бригадир.</strong> Описан формулой: «да бригадир всегда был таким человеком, который хочет потушить угли нежели потом тушить пожар. Хороший мужик». Именно поэтому он неожиданно для всех поддерживает поход в пещеру — как способ снять напряжение: «место здесь странная. Гнетущая какая-то. Вот тебя, как подкосила... не перебивая слушай не только тебя подкосила оглянись все, как не в себе. Вот я и подумал может вам развёлся надо. Всё же лучше эту проблему сразу устранить. Нежели потом расхлебывать».</p>\n<p>Он же держит скептическую позицию после бегства из пещеры: «вы серьёзно зверька кого-то испугались. Туда наверняка какая нибудь белка залезла или лиса. А вы как дети малый испугались», «Человека испугалась. Может пранкер какой. Нынче сейчас же это модное». И он же первым переводит разговор в практическое русло — вызов служб, медпомощь, распределение дежурств.</p>\n<p>Отдельная его черта — забота о репутации бригады: «как вы так то. Здоровый мужики об ехавших матушку Россию не один раз и где только не побывали и вот так всём в больничку отлететь. Кто узнаёт на смех поднимут».</p>\n<p><strong>Игорь.</strong> Инициатор похода в пещеру, продавливает его вопреки общему нежеланию: «а может давайте в пещеру сгоняем», «надо туда, когда ещё шанс выпадет», «тогда вы согласны. Но боитесь ночью. Ну не че днём пойдем», «на обеде можно». В отличие от Ивана, рассказывает бригадиру всё сразу: «Он то сразу всё выпалил. Сбивчиво запинаясь и яркая жестикулируя».</p>\n<p><strong>Михаил.</strong> «Миша вообще был парням винящий в первую очередь себя. Это вроде бы хорошо, но в некоторых ситуациях не является хорошей стороной. Ну мы конечно этим не пользовались Мишу-то всё уважали за его характер и доброту». В ночной сцене эта оценка пересматривается самим рассказчиком: «Мишка всё же оклеветал я тебя за зря. Зря говорил что он не способен дать сдачи. Вот дает. Смелее чем кто либо в бригаде. Хладнокровен чем кто либо в бригаде».</p>\n<p><strong>Тоха (Григорий).</strong> О нём сказано, что он «мужик не любящий подобный юмор» — в контексте истории с ребёнком в лесу, когда бригада не могла заподозрить его во вранье. Первым замечает движение в пещере и первым же ночью отшатывается от входа.</p>\n<p>Общая черта бригады — договороспособность и следование данному слову: «Мы то слова держим, поэтому быстро пообедав» — про обещание Игорю сходить в пещеру. И общая же реакция на предложение бригадира: «ну раз даже бригадир предлагает, грех уже будет не сходить».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0262-S04", "PS-0262--sposobnosti"], "h": "<p>Отдельная способность в переписке названа только у одного человека — у Тохи.</p>\n<p>«Первым не из гибкого желания, а от того что имеет удивительные особенности. Одно из них его географическая память, он может легко ориентироваться в новом городе или лесу».</p>\n<p>Формулировка «одно из них» подразумевает, что особенностей у Тохи несколько, но остальные в переписке не названы.</p>\n<p>Как это работает, показано двумя случаями:</p>\n<ol>\n<li><strong>Лес и ребёнок.</strong> «Тогда то одному из нас показалось, что ребёнок в лесу совсем один. Ну он и побежал к ребёнку, чтобы помочь, а ребёнок удирать то начал». Кто именно увидел ребёнка — не назван; за ним побежала вся бригада, ребёнка при этом не видел больше никто. «А говорить про то, что он может глюк словил, ведь правда не кто же не видел ребёнка кроме него. Мы как то по стеснялись». Обратно бригада выйти не могла: «Стояли так репу чесали. Как Тоха живо нас всех сориентировал. И мы обратно выбрались ещё более коротким маршрутом».</li>\n<li><strong>Пещера.</strong> Тоха идёт первым как навигатор, и он же выводит бригаду при бегстве: «Благо Тоха протолкнуться вперёд всех и начал координировать наш в бег. Если бы не он разбежались бы мы по этой пещере и забывая как звали».</li>\n</ol>\n<p>Здесь в тексте несостыковка, которую авторы не оговаривают: сначала выводит из пещеры Тоха, а через абзац — «Не могу нарадоваться что Игорь первый бежал. Он нас быстро к выходу вывел».</p>\n<p>Прочих способностей ни у кого из бригады не названо. Способности выживания, которые в тексте отмечаются, поданы как обычные человеческие: инстинкт («Инстинкт выживания человек не позволит ему умереть просто так. Но он тоже не всесилен») и страх как рабочий инструмент («благодаря только страху наши первобытный предки выживали. Поэтому страх это неплохой инструмент для выживания»).</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0262-S05", "PS-0262--svyazi-s-drugimi"], "h": "<p><strong>Иван Васильевич</strong> — рассказчик и участник; запись о бригаде помечена как часть его записи.</p>\n<p><strong>Тварь из пещеры</strong> — четвероногое существо, из-за которого бригада теряет человека. Описание, данное Иваном: «Это было четырех ногая ходячая тварь. Больше всего она смахивала на большую чёрную худую собаку. Но имеет некоторый странности. Это тело и лапы чём-то походили на человеческий. Не спрашивайте чем. Я сам не знаю. Я как то на по сознательном уровней понял сходство. Но было у неё ещё одна странность. Еë голова. Не как у собаки морда вытянутая. Но дальше со лба да самого носа лезвия, как бы вам это сказать. Представьте топор и эту острую часть сняли с топора и нацепили на морду собаки. Только у неё это видимо родной». Крик твари описан как «словно рёв зверя и человека который только что понял, что оказался в ситуаций хуже смерти. Жалостный но страшный рев». Вместо крови у неё «Что-то только черная, как смола».</p>\n<p>Что тварь делает с деревьями: «Тварь это своим лбом буквально рубит деревья, как почти что мы. Только сильнее быстрее и вертикально».</p>\n<p>Её уязвимость обнаруживает Игорь: «с дерева спрыгивает прям на эту собаку Игорь... он как-то извернулся и подломил еë коленки. Оказывается без разгона она не столь страшна. И если держать его голову на виду то справиться с ним будет достаточно легко».</p>\n<p><strong>Твари в горе (множество)</strong> — после того, как первая перестаёт подавать признаки жизни: «Пока со стороны горы не услышали рёв. Не один их было множество. Десятки если не сотни тварей там кричала».</p>\n<p><strong>Экстренные службы / «эти»</strong> — бригадир вызывает помощь по указанию: «позвонил я. Но эти прибудут только завтра. Тайна все же. Удачей будет если в радиусе 100км есть населённый пункты». Инструкция, которую бригада получает: в пещеру не спускаться, «затерявшегося туриста» не искать, но «постоять у входа в пещеру да и по орать. Наверное чтобы турист услышал и сам пришел».</p>\n<p><strong>Фармацевтическая компания</strong> — по названию не указана. После обращения в полицию («Они это за всерьёз не восприняли сначала. Но после нам перезвонили. Нет не полицая, а фармацевтическая компания») она лично приезжает ко всем, берёт показания, даёт подписать бумагу о неразглашении с выплатой — «Конечно же с моральными выплатами, как мои 6 зарплат». Компания оплачивает похороны Тохи и медицинские расходы, но своих препаратов не даёт: «Но при этом сами не предоставили свои препараты. Я то знаю. Да нет всё знают, что их ней препараты могут и конечность отрастить. Но они решили не тратить на нас это. Поэтому мне и ампутировали руку. Если бы они помогли то всё было бы иначе».</p>\n<p><strong>Король Матузов</strong> — упомянут один раз, как мера мастерства в бранной фигуре речи: «Охота оказать еë так чтобы сам король Матузов удивился. Но я ни шибко в этом хорошо». Кто это — в переписке не объясняется.</p>", "r": []}, {"t": "Как менялся — состояния по датам, старое не затирается", "a": ["S06", "PS-0262-S06", "PS-0262--kak-menyalsya"], "h": "<h3>2025-05-02, окно w0089, id 323364–323370 — Слава</h3>\n<p>Целиком выложен текст от первого лица. Здесь бригада появляется полностью: состав из восьми человек, быт, спор о пещере, поход, встреча с тварью, бегство, разбор потерь, ночное дежурство, гибель Тохи, бой с тварью, отъезд, разговор с фармацевтической компанией.</p>\n<p>Ключевые состояния бригады по ходу этого текста:</p>\n<ul>\n<li><strong>До похода:</strong> восемь человек, работа идёт нормально, но давит место. «Как будто не только на меня одного этот лес давит».</li>\n<li><strong>В пещере:</strong> бригадир остаётся снаружи, «следить чтобы ничего не украли или ещё чего»; в пещеру лезут по одному, «Больше в этот вход пещеры не пролазит»; фонарик почти не светит — «Я его включил, а он лишь едва свету даёт. Батарейки кажись садиться начали».</li>\n<li><strong>После спуска с горы:</strong> «троим досталось ой мамо не горюй. Один ногу вспорол. Мы его конечно перебинтовали... А ещё у одного рука из сустава вылетела. Мы его не трогали страшно всё таки. Может как не правильно вставим и всю жизнь ему испортим. Ещё у одного ключица кажись сломана. Рукой пошевелить не может». Иван получает ветку в плечо и вытаскивает её сам: «И вот достаю я ветку падлу. А падла она потому что не прямая ветка, а с изгибами. Поэтому больнее вытаскивать было. Перетерпел да и вытащил. После залил туда антисептик. Да и начал бинтовать».</li>\n<li><strong>Подсчёт целых:</strong> здесь идёт прямой спор о числе. Иван перечисляет: «ну Тоха как единственный правильный по видимому. Скатился на ногах, а не как мы всем телом то. Для Мишка то подобная неверная как массаж вот и целый. А Игорь удачно покатился. Ну как видимо и я». Бригадир: «так выходит из всей бригады, относительно целых осталось 4 человека». Иван: «пятеро». Бригадир: «а ну-ка. Четверо. Посмотри на себя. Да у тебя же не одного живого места нет».</li>\n<li><strong>Дежурства:</strong> бригадир «сначала хотел по одному выставлять. Но получив категорический отказ от Игоря и Мишы. Решил пойти на компромисс и выставил двух дежурных. Я и Тоха. И Игорь с Михаилом». Иван предпочёл бы другую пару: «Хотя я всё же хотел пойти с Мишой с ним как-то надёжнее». Смена — каждый час.</li>\n<li><strong>Оружие:</strong> две двустволки. «Вообще изначально хотели, чтобы всё оружия было у той группы, кто будет дежурить. Но стало страшно, что может в лагере случится, где всё раненные. Страшно стало их просто так оставлять. Поэтому пока одна группа дежурит. Вторая охраняет раненных». Это зафиксированный отклонённый вариант: обе двустволки дежурным.</li>\n<li><strong>Ночь:</strong> Тоха и Иван бегут от пещеры, забыв про ружья — «Позабыв, что мы вообще то вооруженные. Просто как то из головы вылетела». В лагере они смеются над собой, считая, что тварь не может выйти из пещеры: «Тогда не думали, что тварь то та вылезет из пещеры. Подумали, что не может она покинуть пещеру».</li>\n<li><strong>Гибель Тохи:</strong> «крик из ругаещего превратился в крик ужаса. Когда Тоху в спину врезалась тварь то та». Иван оказывается рядом: «в лицо и не только мне стрельнула горячая кровь. Из-за этого я как то потерялся в пространстве. Ослеп на мгновение из-за крови в глазах». Пульс он нащупать не может.</li>\n<li><strong>Бой:</strong> Михаил стреляет из двустволки и попадает «ровно в бок твари»; после этого «сразу выкинул двустволку из-за её бесполезности. И полез на дерева». Иван стреляет из ружья Тохи и попадает в голову — «Лишь слегка разлетелась та жижа в нём и все». Иван спасается на машине, которая оказывается закрытой («И черт она оказалось закрытой. Кто сука мать его закрывает машину среди леса, кто в ней залезет. Медведь что-ли»), получает удар в руку — «Разрывая плоть и ломая кости. Она вывихнула мне руку. И содрала с неë коже с плотью». На дереве его удерживает от падения бригадир. Затем бригадир спрыгивает и отвлекает тварь на себя, «При этом махая руками, как видимо пытаясь привлечь это паскуду». Дальше кричат все: «кто ругать, кто громко песню петь, кто молитву. Всё начали орать». Два выстрела с двух двустволок, прыжок Игоря, и вся бригада добивает тварь подручным: «Все остальные тоже что-то похватали и начали бить эту тварь. И так били его до изнеможении. Когда от неё осталось лишь мокрая места. Оно как то было ещё живо. Как?. Это же нереально. Мы же переломали ей всё кости». Тварь издаёт последний крик — «настолько сильный, что мы всё по закрывали уши и на землю попадали».</li>\n<li><strong>Отъезд:</strong> «И мы всё как то сразу ноги в руки да и по машинам. И на удивление быстро смогли уехать без потерей».</li>\n</ul>\n<h3>2025-05-07, окно w0094, id 324211–324215 — Миколай</h3>\n<p>Миколай проходит тот же текст ещё раз, по фрагментам 13–18, цитируя куски и давая к каждому пересказ. Новых фактов о бригаде здесь не появляется, задумка не меняется. Из этого прохода дополнительно фиксируется, что именно из бригадных деталей проговорено отдельно: скепсис бригадира на дереве, молчание Ивана, рассказ Игоря, состав и тяжесть травм троих раненых, спор о числе «относительно целых», отказ Игоря и Миши дежурить поодиночке, разбивка на пары Иван — Тоха и Игорь — Михаил, две законные двустволки по одной на группу, часовые смены, забытое при ночном бегстве оружие и удар твари в спину Тохи.</p>\n<p>Также в этом проходе отдельно проговорена цель самого текста — слова Ивана: «Прошлой до сих пор живёт во мне и потихоньку словно паразит вытягивает из меня жизнь. И это текст нужен именно для того, что закинуть этого паразита сюда, а самому возродиться подобное Фениксу ха. Что-то я стал верить в подобных тварей больше чем раньше».</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0262-S07", "PS-0262--chto-s-nim-stalo"], "h": "<p>Тоха (Григорий) погибает от удара твари в спину. Похороны оплачивает фармацевтическая компания.</p>\n<p>Остальные семеро уезжают из леса — «без потерей», то есть без новых погибших после Тохи.</p>\n<p>Трое раненых при спуске с горы (вспоротая до кости нога, вылетевший из сустава сустав руки, сломанная ключица) отправляются в больницу; бригадир отдельно распоряжается, чтобы туда же поехали Иван, Игорь и Михаил на проверку.</p>\n<p>Ивану Васильевичу ампутируют руку. Он прямо связывает это с решением компании не применять свои препараты.</p>\n<p>Вся бригада даёт показания фармацевтической компании и подписывает бумагу о неразглашении с выплатой; для Ивана размер выплаты — «как мои 6 зарплат». Медицинские расходы компания оплачивает.</p>\n<p>Дальнейшая судьба бригады как рабочего коллектива — работает ли она после этого, разъехались ли люди — в переписке не сказана. Из всех участников дальше прослеживается только Иван Васильевич, который пишет этот текст задним числом: «Хотя это всё равно не посмертной письмо. Вряд ли из-за этого они решат меня убить. Надеюсь».</p>", "r": []}, {"t": "Пробелы — чего в переписке нет", "a": ["S08", "PS-0262-S08", "PS-0262--probely"], "h": "<div class=\"gaps\"><ul>\n<li><strong>Имя бригадира не названо.</strong> Он проходит по тексту только как «бригадир».</li>\n<li><strong>Трое из восьми не названы вообще.</strong> Раненые фигурируют только по травмам: «Один ногу вспорол», «у одного рука из сустава вылетела», «у одного ключица кажись сломана». Кто из них кто и как их зовут — не сказано.</li>\n<li><strong>Остальные «удивительные особенности» Тохи.</strong> Сказано «Одно из них его географическая память» — про прочие в переписке не сказано.</li>\n<li><strong>Кто видел ребёнка в лесу.</strong> «Тогда то одному из нас показалось, что ребёнок в лесу совсем один» — имя не названо. Что это был за ребёнок и был ли он вообще — осталось нерешённым: «правда не кто же не видел ребёнка кроме него».</li>\n<li><strong>Кто вывел бригаду из пещеры.</strong> В одном месте это Тоха («начал координировать наш в бег»), в другом — Игорь («Не могу нарадоваться что Игорь первый бежал. Он нас быстро к выходу вывел»). Расхождение авторами не оговорено.</li>\n<li><strong>Название фармацевтической компании не названо.</strong> Как она узнала о случившемся раньше полиции — не объяснено, сказано только «нам перезвонили. Нет не полицая, а фармацевтическая компания».</li>\n<li><strong>Препараты компании.</strong> Сказано, что «их ней препараты могут и конечность отрастить» и что «все знают» об этом. Состав, механика и происхождение препаратов не названы.</li>\n<li><strong>Природа твари.</strong> Откуда она, чем является, почему у неё топор во лбу и чёрная смолистая жижа вместо крови — в переписке не объяснено. Иван прямо отказывается объяснять сходство с человеком: «Не спрашивайте чем. Я сам не знаю».</li>\n<li><strong>Сколько тварей в горе.</strong> Только оценка на слух: «Десятки если не сотни тварей там кричала». Точнее — не сказано.</li>\n<li><strong>Год и точное место.</strong> Только «где то в октябре», тайга, гора с пещерами, «Удачей будет если в радиусе 100км есть населённый пункты».</li>\n<li><strong>Кто такой король Матузов.</strong> Упомянут однократно и не пояснён.</li>\n<li><strong>Что было дальше с бригадой.</strong> Прослеживается только Иван Васильевич.</li>\n<li><strong>Связь с остальной вселенной «Нимб».</strong> В самой переписке бригада ни с одной другой линией напрямую не соединена; вселенная проставлена по дате объявления.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0262--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0073.html\">Бригада лесорубов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0262--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-05-02</td>\n<td>323364–323370</td>\n<td>w0089</td>\n<td>Нимб (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-05-07</td>\n<td>324211–324215</td>\n<td>w0094</td>\n<td>Нимб (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0262-brigada-lesorubov.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0262--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0262.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0262-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0262/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым чинить фармацевтическую компанию. На неё в базе четыре ссылки (<code>MR-0135</code>), а материала под ней 9750 знаков — меньше, чем под любым отдельным человеком бригады: у бригадира <code>PS-0263</code> — 49881, у Тохи <code>PS-0264</code> — 49921, у самой бригады 82992. На компании держится вся развязка: показания, бумага о неразглашении, оплаченные похороны и ампутированная рука Ивана. Рядом с ней <code>SP-0221</code> «Препараты Нимба» — две ссылки, 5182 знака; именно этими препаратами, «которые могут и конечность отрастить», объясняется, почему Иван остался без руки. Два самых нагруженных узла истории обеспечены хуже всего.</p>\n<p>Вторая по цене — <code>PS-0237</code> «Миша»: статьи нет, ссылок ноль, вселенная не проставлена, а материала 79519 знаков. Если это тот самый Михаил из бригады (<code>PS-0234</code>, Нимб, 45749), то почти 80 тысяч знаков висят мимо линии и ни на что не работают.</p>\n<p>Третье, самое дешёвое по объёму и самое заметное по факту: короля Матузова в базе нет вообще — ни статьи, ни сущности, ни строки. Имя названо, а завести его забыли.</p>\n<h3>С чего начать</h3>\n<p>В базе, не в архиве. Сначала свести <code>MR-0135</code>, <code>GR-0075</code> (группа с нулевым материалом) и <code>SP-0221</code> — сейчас компания разложена на три записи, из которых две пустые. Скорее всего недостающее лежит в <code>MR-0132</code> (Нимб, 88701) и <code>IS-0056</code>: про препараты и про то, откуда компания узнала раньше полиции, могло уйти туда. Потом сверить <code>PS-0237</code> с <code>PS-0234</code> — судя по объёмам, это один человек в двух записях.</p>\n<p>В архив идти только за Матузовым: единственное упоминание в окне w0089, 2025-05-02, id 323364–323370, и там это бранная фигура речи, то есть смотреть надо не в этом окне, а вокруг — не всплывало ли имя раньше в другой линии.</p>\n<h3>Как развивалось</h3>\n<p>2025-05-02 Слава выложил текст целиком за один заход: состав, поход, гибель Тохи, бой, развязка с компанией. 2025-05-07 Миколай прошёл тот же текст по фрагментам 13–18, процитировал и пересказал — новых фактов не добавилось, задумка не менялась. После 2025-05-07 записей по бригаде нет. Заявили целиком — переразобрали через пять дней — не возвращались.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Про оружие правило проговорено дважды и отдельно: «И не подумайте, всё законное», «И повторюсь мы не браконьеры. Оружия у нас законно». Про сам заход в пещеру — вещь того же рода: чья это гора, можно ли туда лезть, отвечает ли за это кто-то — правила нет. Иван даёт одно определение, и то не про право, а про происхождение: «Ну я не увидел там опор, поэтому посчитал эту пещеру природной». Для двустволок законность названа, для проникновения — нет.</p>\n<h3>Отклик</h3>\n<p>Зацепил спор о числе целых. Иван считает: Тоха, Мишка, Игорь, «ну как видимо и я» — пятеро. Бригадир: «а ну-ка. Четверо. Посмотри на себя. Да у тебя же не одного живого места нет». Человек считает себя целым, пока ему не покажут. Это работает лучше, чем вся тварь с топором во лбу, потому что здесь ничего не объясняется. И рядом — забытые у палатки ружья: два вооружённых мужика убегают от пещеры и вспоминают про оружие только в лагере, где смеются над собой. Тварь получилась описательной, а вот бригада как счётная единица — восемь, пятеро, четверо, семеро — держится сама.</p></div>", "r": []}];</script>
