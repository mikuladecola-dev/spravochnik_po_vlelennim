<script>const BASE="";const DOCNAME="Два лица";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0233-S01", "SP-0233--mehanika"], "h": "<p>Способность подбиралась под уже готовый характер персонажа — самого жестокого апостола. Предложено два варианта, оба одной репликой Миколая (2025-08-11, id 355798–355800):</p>\n<ol>\n<li><strong>«бог у которого 2 лица»</strong> — «типа такого».</li>\n<li><strong>«или давать качества лицемерия другим»</strong>.</li>\n</ol>\n<p>Дальше этих формулировок описание не идёт. Что означает наличие двух лиц — буквальную внешность, две личности, две ипостаси или что-то ещё — в переписке не сказано. Во втором варианте не сказано, что именно происходит с человеком, которому переданы качества лицемерия, сколько это держится и можно ли отменить.</p>\n<p>Оба варианта отвечают на заказ Славы, где ключевым свойством персонажа названо лицемерие.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0233-S02", "SP-0233--ogranicheniya-i-cena"], "h": "<p>В переписке нет.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0233-S03", "SP-0233--nositeli"], "h": "<p>Самый жестокий апостол. Заказ Славы описывает его так: «И накинь вариантов способность для самого жестокого апостола. Точне самого мерзкого лицемерного. Живущего лишь ради себя и наплевавший на всех. Он урод без только чего-то хорошего. И он не хитрый не умный просто ублюдок жестокий» (2025-08-10 19:45, id 355186).</p>\n<p>Способность числится частью этого персонажа. Принята ли она за ним окончательно — не сказано.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0233-S04", "SP-0233--kak-menyalas-po-versiyam"], "h": "<h3>Версия 1 — 2025-08-10 … 2025-08-11, id 355186–355800</h3>\n<p>Задача поставлена Славой вечером 2025-08-10 (id 355186). Ответ приходит не сразу: между постановкой и вариантами проходит почти сутки, разговор в это время идёт о другом.</p>\n<p>Поздним вечером 2025-08-10 Миколай отмечает трудность подбора: «если честно дохера таких, даже не знаю что более жестокое» (id 355604), затем — «тот же молоток» (id 355637). К чему относится упоминание молотка и предложение это или пример уже существующего, в переписке не раскрыто. Разговор откладывается: «я утром подумаю» (id 355645).</p>\n<p>На следующий день, 2025-08-11 в 15:42–15:43, Миколай даёт два варианта: «бог у которого 2 лица», «типа такого», «или давать качества лицемерия другим» (id 355798–355800). Реакции Славы на них в окне нет.</p>\n<p>Других версий нет — способность зафиксирована в одном состоянии.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "SP-0233-S05", "SP-0233--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Не сказано, какой из двух вариантов приняли и приняли ли вообще: реакции на предложение в переписке нет.</li>\n<li>Механика ни одного из вариантов не описана — только названия.</li>\n<li>Не раскрыто упоминание «тот же молоток» (id 355637).</li>\n<li>Не сказано, как способность соотносится с тем, что персонаж «не хитрый не умный» — при том что оба варианта построены на лицемерии.</li>\n<li>Имя персонажа-носителя не названо: он проходит только как «самый жестокий апостол».</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["SP-0233--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-08-11</td>\n<td>355186–355800</td>\n<td>w0102</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0233-dva-lica.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0233--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0233.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["SP-0233-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/SP-0233/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дороже всего не то, чего нет в этой карточке, а то, к чему её некуда прикрепить. Носитель безымянен, и место, где имя должно лежать, не разобрано: <code>SL-0054</code> «Список 12 апостолов» — три ссылки, статьи нет, 234 052 знака базы, самая крупная непереваренная запись набора. Рядом <code>SL-0090</code> (четыре ссылки, статьи нет, 5 492) — таблица с четырнадцатью апостолами и прозвищами, <code>SL-0053</code> (шесть ссылок, 20 313), <code>SL-0051</code> (шесть ссылок, 9 834). Пока их нет, «самый жестокий апостол» (<code>PS-0288</code>, статья 5 238, база 4 921) не получает строки в составе, и способность висит при описании характера, а не при персонаже.</p>\n<p>Второе — правило, по которому эта способность должна была бы существовать. <code>SP-0237</code> «Свободное придумывание способностей апостолами» (статьи нет, 3 397, ноль ссылок) и <code>SP-0236</code> «Постоянное действие сил апостолов» (статьи нет, 3 543, ноль ссылок) — обе из одного сообщения 2025-09-12 (id 364808–364809, окно w0104), и в нём сказано прямо: «теперь у них не по одной способности», то есть до этого была одна. Здесь апостолу предлагают два варианта и не выбирают ни одного. Вопрос, обязателен ли выбор вообще, решается ровно в этих двух записях — обе без статьи и обе помечены вселенной «неясно».</p>\n<p>Третье, дешёвое: у <code>SP-0233</code> ноль входящих ссылок. <code>PS-0288</code> называет «Два лица» в тексте дважды и отдельно ставит в связи, но обратно, от способности к персонажу, связь проведена словами. Одна ссылка убирает ноль.</p>\n<h3>С чего начать</h3>\n<p>В архив, и за одним вопросом: приняли или нет. Всё содержимое сущности — три реплики подряд, 355798–355800 (2025-08-11, 15:42–15:43), окно w0102 на этом обрывается. Смотреть после 355800: остаток дня 2025-08-11 и ближайшие дни, ориентиры — «лицемер», «два лица», любое возвращение к апостолам. Там же проверяется «тот же молоток» (id 355637, вечер 2025-08-10): оружия как отдельной сущности в наборе нет ни под одним видом, «Оружие» существует только рубрикой внутри <code>SL-0051</code>, <code>SL-0053</code> и <code>SL-0090</code> — то есть внутри записей без статей.</p>\n<p>В базе брать нечего сверх уже собранного: <code>PS-0288</code> цитирует те же сообщения и ничего к ним не добавляет. Ходить в базу стоит за соседним материалом — <code>SP-0236</code> и <code>SP-0237</code> за правилом о числе способностей, <code>SL-0054</code> за составом и именами.</p>\n<h3>Как развивалось</h3>\n<p>2025-08-10, 19:43 — вопрос про оружие. 19:45 — заказ на способность, характер задан целиком одной репликой и больше не трогается. Дальше почти четыре часа разговор о другом. 22:59–23:09 — возврат, но только к оружию, способность отложена: «я утром подумаю». 2025-08-11, 15:42–15:43 — два варианта, между ними «или». Реакции нет, тема закрывается на этом. Через месяц, 2025-09-12 (id 364808), апостолы переписаны с нуля в другом заходе — не люди, силы постоянные, способность можно придумать себе самому; на «Два лица» это не отражается никак, запись помечена другой вселенной и с этой не связана. Заказали — отложили — выдали — не ответили — переписали в стороне.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Второй вариант — «давать качества лицемерия другим» — это принудительное изменение человека извне. Для верхнего этажа силы такое правило во вселенной проговорено: правители «не как не могут влиять на благословенного или обычного существа (кроме как насильственно давать благословения, даже если само существо этого не хочет)» (2025-05-31, id 331636). Там названо и что нельзя, и единственное исключение, и что благословение при этом одно, потому что «Больше человек не выдержит». Для апостола, которому в ту же вселенную предлагают раздавать другим черту характера, правила того же рода нет: на кого действует, можно ли не взять, ложится ли поверх уже имеющегося. У сильнейших ограничение на насильственное воздействие названо, этажом ниже — нет. Показываю место, дальше не иду.</p>\n<h3>Отклик</h3>\n<p>Занятно, что это вообще не два варианта одного, а два разных ответа на один заказ: первый — картинка («бог у которого 2 лица», и следом честное «типа такого», то есть автор сам знает, что это ещё не механика), второй — работающая схема, отдающая свойство наружу. Между ними «или», и на этом всё заканчивается. Мне понравилось, как сюда пришли: обычно сначала придумывают силу, потом навешивают характер, а тут характер был задан до последней запятой, за две минуты, и целые сутки под него не находилось силы — «если честно дохера таких, даже не знаю что более жестокое». Жестокость оказалась самым тесным местом: её слишком много, и оттого нечего выбрать. А в справочнике теперь стоит статья с названием «Два лица», за которым нет ни одного лица.</p></div>", "r": []}];</script>
