<script>const BASE="";const DOCNAME="Свят";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0286-S01", "PS-0286--proishozhdenie"], "h": "<p>Персонаж наброска «Бетонный герой», выложенного Славой одним куском 2025-08-08 (id 354014–354016). Полное имя — Святослав, но им никто не пользуется: «Святославом его конечно же не кто не звал. Просто Свят и все, что нужно для брошенного ребёнка». Так и задано его положение: брошенный ребёнок, живущий на улице вдвоём с другом — рыжеволосым мальчишкой (<a href=\"PS-0287.html\">Рыжеволосый мальчишка</a>), у которого имени в тексте нет вовсе.</p>\n<p>Действие идёт не на Земле. Люди Землю покинули: «Много лет назад людям пришлось покинуть землю. Причины неизвестные или их скрывают». Свят родился уже здесь, среди заводов и бетона, и Земли не видел.</p>", "r": [["Рыжеволосый мальчишка", "PS-0287.html"]]}, {"t": "Внешность", "a": ["S02", "PS-0286-S02", "PS-0286--vneshnost"], "h": "<p>Худощавый. Глаза синие, названы дважды и по-разному: «Глаза его были красиво синими», и дальше он же — «голубоглазый мальчишка», «синеглазый друг». Волосы — «цвет волос был мусорная коричневый». Как и рыжеволосый, он истощён: в сцене погони оба названы «двумя истощёнными мальчишками».</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0286-S03", "PS-0286--harakter"], "h": "<p>Свят повёрнут на небе, которого над ним нет. Разговор он начинает с «говорят небо красивое» и держится за пересказанное: «они говорили небо было синим, а рядом с ним летали белые, как ангелы облака». Источник — «старрршшшики», и произносит он это слово неуверенно, растягивая.</p>\n<p>Ищет синеву в том, что видно на самом деле: «в глазах мальчишки, что пытались найти там в сером, от туч и дыми синеву, что и у себя». Небо над ним серое от туч и дыма заводов, которые «дымили своими горячими парами отравляли и так убитую планету», но без которых, как и без техники, производящей кислород, человечество здесь бы не выжило.</p>\n<p>Тяга доходит до того, что он перестаёт замечать опасность: встаёт на цыпочки, опирается на ржавые перила, тянется вперёд — «Он всё тянулся ещё чуть-чуть и он увидит, он точно всё увидит» — и перевешивается наружу, готовый упасть на бетон. Даже когда друг держит его над пропастью, он «всё продолжал тянуться к небу».</p>\n<p>На разнос после спасения отвечает коротко и неуверенно: «ну... Небо же... Там». На вопрос, не дали ли ему чего-нибудь старшики, отвечает, надув щёки: «да они, как будто дадут хоть, что-то».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0286-S04", "PS-0286--sposobnosti"], "h": "<p>Способностей у него в тексте нет.</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0286-S05", "PS-0286--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Рыжеволосый мальчишка (<a href=\"PS-0287.html\">Рыжеволосый мальчишка</a>)</strong> — назван «его единственный друг». Спорит со Святом про небо и про старшиков («ну дурак и ты серьезно им поверил»), но ловит его у перил, вытаскивает обратно и потом подаёт руку, чтобы поднять с пола. Вместе они идут искать еду и вместе крадут хлеб.</li>\n<li><strong>Старшики</strong> — те, от кого Свят знает про синее небо и белые облака. Рыжеволосый в них не верит и подозревает, что они могли что-то Святу дать; Свят это отрицает.</li>\n</ul>", "r": [["Рыжеволосый мальчишка", "PS-0287.html"]]}, {"t": "Что с ним стало", "a": ["S06", "PS-0286-S06", "PS-0286--chto-s-nim-stalo"], "h": "<p>После спасения оба идут искать еду, крадут у торговца хлеб — «Кусочек даже» — и убегают по сужающейся улице. Текст обрывается на том, что рыжеволосого перехватила «неизвестная мозолистая рука», а торговец покатился по бетону. Где в этот момент Свят и что с ним дальше — не сказано: сразу за текстом идёт замечание Славы «Это набросок, который я не продолжу» (2025-08-08, id 354016).</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0286-S07", "PS-0286--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Возраст, происхождение, откуда он и рыжеволосый знают друг друга — не названо.</li>\n<li>Правда ли то, что рассказывают старшики, и кто они такие — не раскрыто.</li>\n<li>Судьба Свята после сцены с торговцем — набросок обрывается, продолжения автор писать не стал.</li>\n<li>Связь наброска с остальной вселенной «Апостол» в переписке не проговорена.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0286--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0287.html\">Рыжеволосый мальчишка</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0287.html\">Рыжеволосый мальчишка</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0286--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-08-08</td>\n<td>354014–354016</td>\n<td>w0102</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0286-svyat.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0286--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0286.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0286-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0286/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дороже всего — «старшики». В реестре такой сущности нет вообще: ни id, ни статьи, ни строки базы. А на Святе это держит всё: единственное, что он знает про небо, он знает от них; единственное, что он говорит в свою защиту после спасения, — про них же. На старшиков ссылается эта статья, <code>PS-0287</code> (там весь конфликт — недоверие к ним) и <code>IS-0066</code>. Три статьи опираются на группу, которой в справочнике не заведено.</p>\n<p>Второе — «Бетонный герой» как история. <code>IS-0066</code>: статья 29 129 знаков, база 61 184, входящих ссылок ноль. Эта статья не ведёт туда, откуда Свят взят, и туда же не ведут <code>MR-0147</code> (ссылок 0), <code>PR-0086</code> (ссылок 0), <code>PR-0088</code> (ссылок 0). Весь кластер стоит изолированно, а под одним названием в нём лежат два несвязанных текста — августовский набросок про двух мальчишек и сентябрьская история про человека в бетонном мире. Плюс <code>PR-0090</code> (23 110 знаков базы, статьи нет, вселенная «неясно») — дубль сентябрьского текста.</p>\n<h3>С чего начать</h3>\n<p>В базе. В архив идти незачем: набросок выложен одним куском 2025-08-08 в 21:41 и закрыт автором через минуту.</p>\n<p><code>PR-0086</code>, id 354014–354018 — полный текст. Там есть вступление, не попавшее ни в эту статью, ни в <code>PS-0287</code>: про героев, которые увели людей с Земли и выродились, и про «Работа найдётся для всех. Вот только там не говориться о зарплате».</p>\n<p><code>IS-0066</code>, версия 1, id 354017–354032 — то, что идёт после последнего сообщения, зафиксированного в источниках статьи. 354018: «Ну скоро на эту тему будет другой набросок а может и полноценная история». 354029 — разбор Миколая: грамматики меньше, стиль богаче, описания «пусть и несколько пустые», «я прочитал всё, но понял не много. всё ещё трудно воспринимать текста. но, мне нравится».</p>\n<p>Что такое «старшики», ближе всего видно во втором употреблении того же слова, за пять месяцев до: id 311074, 2025-03-25, окно w0085 — «-старшики рассказали- не понятно зачем уточняет Игорь», про дырку в заборе завода. Та же роль: старшие, от которых приходит непроверяемое знание, ради которого дети куда-то лезут. Лежит в <code>IS-0044</code> (55 525 знаков базы, статьи нет, вселенная «неясно»), <code>PS-0237</code> (79 461, статьи нет) и <code>SP-0213</code>.</p>\n<p>Обещанное продолжение искать по 2025-09-04, id 361477–361479, и 2025-09-08, id 362520–362532 — то же название, но отождествления с обещанием в переписке нигде нет.</p>\n<h3>Как развивалось</h3>\n<p>Всё в пределах одного вечера. 2025-08-08, 21:41 — заявлено: мир без Земли, мальчик, который тянется к небу, которого над ним нет. В том же сообщении ограничено: небо оказывается серым от туч и заводского дыма, а заводы отравляют планету, но без них здесь не выжить, — то есть тяга Свята закрыта прямо на месте, в один заход. 21:41, id 354016 — брошено: «Это набросок, который я не продолжу», причём судьба Свята в тексте даже не названа, кадр уходит на рыжеволосого. Через минуту, id 354018, обещан возврат к теме. Через месяц выходит текст с тем же названием и другим героем. К Святу не возвращались.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Вступление наброска (id 354014, лежит в <code>PR-0086</code>) объясняет, куда в этом мире девают лишних людей: «Работа найдётся для всех», а «работа для неумехи — это стать пушечным мясом, который самовозглашают себя защитниками». Для взрослого населения механизм назван. Для двух брошенных детей, которые стоят в следующем абзаце того же сообщения, ни в какой работе не состоят и воруют кусок хлеба, того же объяснения нет: как в мире, где работа найдётся для всех, берутся беспризорники и почему они мимо этой воронки, не сказано ни словом. Правило про лишних людей выписано для одной части населения, для соседней — нет.</p>\n<h3>Отклик</h3>\n<p>Зацепила одна фраза: «в глазах мальчишки, что пытались найти там в сером, от туч и дыми синеву, что и у себя». Он не просто смотрит вверх — он сверяет серое небо с собственными глазами, то есть единственный образец синего, который у него есть, это он сам. Отсюда и то, что он не может остановиться у перил: ему не рассказ подтвердить надо, а себя. И «старрршшшики» с растянутыми буквами — неуверенность записана орфографией, а не описанием, и это дешевле и точнее любого «неуверенно протянул», которое стоит рядом. Финальное «ну... Небо же... Там» после разноса — тем же приёмом: три слова, две паузы, никакого раскаяния. Слабее выглядит другое: глаза названы синими, а через строку он голубоглазый, и тут же снова синеглазый — цвет, на котором держится весь образ, автор трижды называет по-разному в пределах одной сцены.</p></div>", "r": []}];</script>
