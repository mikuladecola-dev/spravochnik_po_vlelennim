<script>const BASE="";const DOCNAME="Любимый город";
const LEAD="<h1>Любимый город</h1>";
const CH=[{"t": "Об этом тексте", "a": ["S01", "PR-0109-S01", "PR-0109--ob-etom-tekste"], "h": "<ul>\n<li>Дата: 2026-02-14</li>\n<li>Сообщения: 432538–432540</li>\n<li>Состояние: брошено на середине — три сообщения подряд, текст обрывается на сцене в ночном переулке</li>\n<li>Действующие лица: рассказчик (имя не названо), «Жених» — мужчина с обручальным кольцом; на крыше ещё шестеро без имён</li>\n</ul>", "r": []}, {"t": "Текст", "a": ["S02", "PR-0109-S02", "PR-0109--tekst"], "h": "<p>Любимый город</p>\n<p>Не назвать мою жизнь удачной. К сожалению.</p>\n<p>У меня не было великих свершений. Было лишь пару горячительных напитков и интересные таблеточки, конечно и сигареты, как без них-то. Зато в азартные игры не играл, потому что чаще всего выигравал. Так же не был сердцеедом , потому что болела голова от попыток угодить другому человеку.  Ну и в принципе вся моя биография.</p>\n<p>Возможно всё бы закончилась тем, что моё тело бы сказало гудбай и я помер. Ну нет, случился момент в мой жизни, который что-то возможно изменил. Точнее это не момент, а места.</p>\n<p>---------</p>\n<p>Знаете просыпаться скрючившись в калачик после ночной гулянки всегда тяжёлая задача. Во первых всё тело ломит, а в горле вся влажность испарилась и стало так сухо, что ты чувствуешь как отваливаються какие-то куски с твоего горла. Во-вторых, похмелье, что двоечкой пробивает твою черепушку, а когда ещё солнце без пощады светит в опухшее лицо становится в двойне хуже.<br>&quot; Почему солнце так ярко бьёт по глазам? &quot; Ответ очевиден. Я на открытом воздухе. Поэтому тело продувает и на коже образовались маленькие пупырышки.</p>\n<p>Ладно если бы я просто отрубился, где-нибудь на улице. Но нет. В моей запоздало проснувшийся мозг ударили нейроны, отвечающие за телесное ощущение, и я чётко ощутил, что-то колючее, но при этом податливое. Трава.</p>\n<p>В городе- в тем более в моём- травы на его улицах хрень найдешь, а значит я где-то в лесу. Ну или могу быть в парке, который недавно подожгли, какие-то подростки.</p>\n<p>Начинаю потихоньку подниматься, как в глазах до этого видевший красный круги потемнело. В животе вся смесь моих питательных веществ очень настойчиво постучались  по зубам. Едва сдержав  рвоту, я всё же восстанавливаю зрение и.... Блять</p>\n<p>Нет, чудесней этого слова &quot;блять&quot;. Описывает всё и то что я лежу на какой-то лужайке строго постриженная, словно прическа солдата. И то что это лужайка находится на долбаной крыше пятиэтажки. Ну и конечно же как изюминка, на этой лужайке ещё шесть человек, старики и дети, женщины и мужчины. Мужчина средних лет с обручальным кольцом на пальце, пацан лет десяти, ну и подросток. Также молодая женщина в отключки, старичок, да и девчуля подросток. Идеальная команда для семейного конкурса. Всё такие ухоженные и единственный я белая ворона или как там говрилась?</p>\n<p>&quot; Прикольно приколист решил пьяных людей сюда притащить&quot;- подумал бы я. Если бы здесь не было десятилетнего мальчика, который, также как и остальные был в отключке.</p>\n<p>Что же. В ситуациях, когда ты не знаешь как действовать. Ты будешь действовать по инстинкту трёх принципов &quot; Бей, беги, замри&quot;.</p>\n<p>Угадайте какой выбрал я. Бег. Кроме инстинктивного понятия того, что мне мясоеду не место на зелёной лужайке. Я также понимал что оставаться в группе, в которой я очнулся первым, и в которой я самый подозрительный, не лучшая идея.</p>\n<p>Наконец-то встав, я впервые нормально огляделся. Я находился на крыше, без бортиков, то есть, кто нибудь из этих спящих бедолаг в принципе мог перевернуться и выпасть. Кроме зелёный травы, здесь была бетонное сооружение с железной дверью. &quot;Выход с крыши&quot;.Бьет очередной запоздавший нейрон по голове.</p>\n<p>Долго не думая. Я покачиваясь начал приближаться к двери.</p>\n<p>Дойдя до двери. Я схватился за приятно прохладную ручку двери. И сам не заметив прижался лбом к двери. Голова до этого хаотично пульсирующая, наконец-то начала успокаиваться. Но сейчас не до этого.</p>\n<p>Я дергаю дверь. И о чуда она открылась, обдавая меня застоявшимся воздухом. Долго не думая я начал спускаться и попутно подметил две детали.</p>\n<p>Первое: бежать в помещении, в котором застоялся воздух. Охренеть как приятное, когда вдыхаешь пыльный и вонючий воздух,  и чувствуешь как пылинки оседают в твоих лёгких. При этом душно до ужаса.</p>\n<p>Второе: это кажись заброшка. Нет здесь людей, вещей которые бы обозначали, что здесь живут. В принципе логично. Вряд ли бы нас кто на жилое здание поперл бы.</p>\n<p>Медленно спускаясь по лестнице, конечно же крепко держась за перила. Я уже начал думать, как я куплю прохладную водичку и буду глотать его большими глотками... Из-за этих мысли в горле стало ещё суше.</p>\n<p>Бам</p>\n<p>Звук захлопнувшейся двери разнёсся сверху. Я замер не понимая, как действовать, но стоял я не долго.</p>\n<p>Топ-топ</p>\n<p>Послышались быстрые шаги сверху. И подавшись принципу трёх инстинктов. Я побежал по лестнице не оглядываясь, и забыв о больной голове и о пустыне в горле.</p>\n<p>Я бежал пытаясь держаться за перилы, а чей-то топот лишь приближался.</p>\n<p>Послав своё самочувствие как можно дальше. Я начал буквально прыгать со ступенек, больно отбивая ноги, но продолжая скакать. Из-за этого шум бега за спиной начал отдаляться</p>\n<p>Прыгая ещё раз я не правильно рассчитал расстояние своей пульсирующей головой до слудующей ступенки. И потеряв равновесие начал падать. Отбивая все силы от углов ступенек. В конце громко шлепнушись о бетонный пол.</p>\n<p>В глазах начало мутиться , а жидкость с желудка до этого сдерживаемая начала выходить через рот, царапая моё нëбо.</p>\n<p>Топ-топ</p>\n<p>Чей то быстрый бег лишь приближался. Не давая мне времени подумать или принять решения.</p>\n<p>Шаги уже начали приближаться, а я лишь смог от ползти в угол и пытаться притвориться стеной.</p>\n<p>Топ-топ</p>\n<p>И вот перед моими мутными глазами появился силуэт мужчины в чёрной кофте, что быстро спускался по лестнице. Он увидев меня и на мгновение остановился тяжело дыша, но быстро потеряв ко мне интерес побежал дальше вниз.</p>\n<p>Я сразу понял, что это за мужчина. Жених. Ну мужчина с обручальным кольцом.</p>\n<p>&quot; И куда он так целеустремленно несётся &quot;- появление это мысли обозначало бы, что Жених что-то знает. Ну или он психанул, когда очнулся на крыше и просто начал бежать. Вот только лицо его выглядили уж слишком собраным и полным надежд. Вау как я умело могу читать людей. Надеюсь.</p>\n<p>-блять! -</p>\n<p>Опять это великое слова &quot; Блять&quot;. Прекрасно описывает, то что оказывается я блеванул не на пыльные бетон, а на свои пыльные штаны. Да ещё и адреналин начал от меня убегать, а боль начала догонять. Из-за этого руки, которыми я прикрывал руку при падения начали ныть, рёбра который я не прикрыл. И конечно ещё, как будто мы мозг набух и давит на черепушку, ещё этот поганный кислый вкус.</p>\n<p>Было бы неплохая идея позванить в больницу. Вот только я не знаю где я, а телефон у меня кирпич. Поэтому узнать свою геолокацию я не смогу вроде как. Если честно то я просто не как да не пробовал. Нет точное нет. В армию же можно с кирпичем, а значит он не показывает геолокацию.</p>\n<p>Я начал стават опираясь на стену. Двигаться вообще не хотелось, но ещё больше мне не хотелось оставаться в этом здании.</p>\n<p>Благо расстояния до выхода было мизерным. Поэтому я быстро дошёл до открытой двери.</p>\n<p>Приятный ветерок обдул моё лицо. Наконец-то вздохнув полную грудью. Я простоял с закрытыми глазами пару минут, приходя в себя.</p>\n<p>Открыв глаза я огляделся и... Нифига. Никого не было. Ни взглядов отвращения из-за грязных штанов. Ни гула машин. Ни даже песни наших младших пернатых братьев. Ничего.</p>\n<p>И в мою опухшую голову начали проникать вполне очевидный мысли:<br>&quot;Что это за город? &quot;<br>&quot; Почему здесь никого нет? &quot;<br>&quot;Как я здесь оказался? &quot;<br>Все эти мысли были по своему важны. Но были мысли куда более важные &quot; Где мне найти воду? &quot;. Каким бы не был ты героем, ты не сможешь совершать великий подвиги не утолив свои билогический хателки.</p>\n<p>Поэтому я начал бродить по пустым улицам. Было ой, как непривычно. Я человек прожившие в городе, где на каждом шагу есть человек, а сейчас пусто и тихо. Настолько тихо, что звенит в ушах или это потому что я всё же плохо прикрыл голову и стукнулся.</p>\n<p>Без разницы. Моя прогулка было недолгой. Я быстро заметил надписи маленького магазина &quot;магазин 24&quot;.</p>\n<p>Дойдя до магазина. Я с надёжной дёрнул железную дверь и... Почему то на двери мне сегодня везёт. Хотя я всегда был везунчиком.</p>\n<p>Зайдя в тёмный магазинчик. Магазин как магазин, стеклянный витрины за которым разная продукции и здесь даже воздух не застоявшийся. Подойдя к прилавку, я кое как перелез через прилавок.</p>\n<p>И быстро открыв бутылку с водой. Начал большими глотками глотать воду. Да именно глотать, а не пить. Быстро опустошив бутылку, я взялся за другую и продолжал пить.</p>\n<p>Я почуствовал разочарование. Просто в моих фантазиях вкус воды был таким приятным, а на деле просто безвкусная вода. И здесь мой взгляд остановился на холодильнике для напитков.</p>\n<p>Там были горячительные напитки, что прям спецально вызывающие выглядили.</p>\n<p>Я словно начал слышать<br>&quot; Эй дружек выпей нас. Тебе сразу полегчает &quot; Я же человек не привыкшей отказываться от просьбы. Открыл холодильник и взяв холодную банку пива.</p>\n<p>Я открыл железную крышку и начал пить. В голове начало приятно шуметь, а более потихоньку отпускать, а чем дальше уходила боль, чем больше пустых банок вылялось на полу. Через какое-то время на полу также начали валяться и стеклянные бутылки. При этом воспоминания начали тускнеть, и то что произошло дальше, лишь кадроми проносятся в голове.</p>\n<p>Я вроде как начал дебоширить. Бить ветрины, разбивать бутылки, а после мне захотелось в туалет и я сходил прямо в магазине. И ещё пару моментов, где я просто напивал какую-ту песню.</p>\n<p>****</p>\n<p>Моё сознание начало приходить лишь в ночном переулке. В луже теплое жидкости. Первая мысль<br>&quot;Че я за свинья под себя сходил&quot;, а вторая &quot; Бок...болит&quot; Эти две абсолютно разный мысли начали соединяться. И в мою пьяную голову ударила другая мысль &quot;кровь?! &quot;</p>\n<p>Я схватился за бок и начал отползать от лужы. В темноте города, что не давали пробиться луному цвету, не было видно цвет жидкости. Но в моёй голове цвет уже был ярко красным.</p>", "r": []}, {"t": "Связи — всё вместе", "a": ["PR-0109--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0087.html\">Группа на крыше (шесть спящих и рассказчик)</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["PR-0109--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PR-0109.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
