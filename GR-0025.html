<script>const BASE="";const DOCNAME="Фантазёры (творцы)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0025-S01", "GR-0025--chto-eto"], "h": "<p>Категория носителей сил во вселенной «Апостол». В переписке идёт под двумя названиями: «Фантазёры» (2025-05-10, id 324539–324541; 2025-05-14, id 325805–325808; 2025-05-31, id 331636) и «Творцы ( фантазёры)» (2025-08-30, id 359706).</p>\n<p>Это именно категория, а не одно существо и не рубрика каталога: речь идёт о множестве носителей («их очень мало»), причём в перечнях сил мира они стоят в одном ряду с благословенными, Арбетарами и Альфами.</p>\n<p>Определение дано Славой 2025-05-31 (id 331636): «Фантазеры это можно сказать правитель с маленькой буквой. Они создали свой мир в голове. Из-за этого даже глядя на наш мир ( то бишь мир в котором находиться их физическая оболочка). Они видят его по другому».</p>\n<p>То есть у фантазёра есть физическая оболочка, находящаяся в нашем мире, и собственный мир, созданный им в голове.</p>", "r": []}, {"t": "Общие способности группы", "a": ["S02", "GR-0025-S02", "GR-0025--obschie-sposobnosti-gruppy"], "h": "<p><strong>Иное зрение.</strong> Фантазёр смотрит на наш мир и видит его по-другому — по устройству своего. Приведён один пример (2025-05-31, id 331636): «Пример фантазёр, что видит мир виде линей, колебаний. Глядя на стенку он видит лишь большо миллиона движущих линий, который за, что-то отвечают.»</p>\n<p><strong>Влияние на наш мир по законам своего.</strong> «Из-за этого он способен влиять на наш мир. По законам своего. То есть он может изменить колебания волны ( нитки). И стена может стать воздухом или водой или взорваться в зависимости. Какую нитку потянули и как на неё повлияли.» Механика описана только на этом примере с линиями-нитками; для других возможных способов видеть мир ничего не расписано.</p>\n<p><strong>Сила.</strong> «Фантазёр на данный момент сильнейший существа.»</p>\n<p><strong>Уязвимость — исчезновение.</strong> «Но они могут просто исчезнуть. Потерять связь с нашим мирам и полностью окунуться свой. Исчезая. Из-за этого их очень мало. Ведь нет не одной причины жить в мире правителя. Если ты можешь попасть в свой.» То есть малочисленность категории объяснена именно уходом в собственный мир, а не редкостью появления.</p>\n<p><strong>Ограничение по артефактам.</strong> В том же сообщении, в разделе про артефакты: «Примечания: Благословенный; альфа, Арбетары и фантазёры не способны раскрыть всю мощь артефакта. Так как уже сами переполненный силой. Лучшего всего мощь артефакта способен раскрыть обычный человек.»</p>\n<p><strong>Закрытость мира фантазёра.</strong> Миколай спросил 2025-05-31 (id 331663): «а в мир фантазёра можно попасть?» — и добавил «хочу», «ну в целом крайне интересно». Ответ Славы (id 331667): «Нет». Вариант с попаданием в мир фантазёра, таким образом, предложен и отклонён.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S03", "GR-0025-S03", "GR-0025--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>Правители.</strong> Фантазёр — «правитель с маленькой буквой». Правители при этом описаны отдельно и выше: они «не как не могут влиять на благословенного или обычного существа ( кроме как насильственно давать благословения, даже если само существо этого не хочет)», и «при этом правители всевидящий». В строчке про исчезновение фантазёров наш мир назван «миром правителя»: «нет не одной причины жить в мире правителя. Если ты можешь попасть в свой». Прямо влияние правителей на фантазёров или обратное в переписке не разобрано.</p>\n<p><strong>Благословенные, Арбетары и Альфы.</strong> Идут с фантазёрами в одном перечне сил мира. В сообщении 331636 Арбетары и Альфы описаны как «одни те же существа», различающиеся происхождением (люди из кильке против чужемирцев), с базовым набором умений (усиленная регенерация, усиление тела и чувств, аура, сенсорика) плюс уникальная способность. Соотношение фантазёров с ними по силе задано только общей строкой «Фантазёр на данный момент сильнейший существа»; попарных сравнений нет.</p>\n<p><strong>Владельцы артефактов.</strong> Стоят рядом с фантазёрами в перечне 2025-05-10. По артефактам зафиксировано только ограничение (см. выше): фантазёр переполнен силой и всю мощь артефакта раскрыть не может, лучше всего это делает обычный человек. Про «артефакты с символикой» сказано, что «смертным существами некогда не раскрыть хотя бы 3 процентов всей мощи артефакт»; отнесены ли фантазёры к смертным существам — в переписке не сказано.</p>\n<p><strong>Организация нимб.</strong> Связана с фантазёрами по одному поводу: 2025-05-14 (id 325808) Слава называет их вместе как то, что надо добавить: «Добавления организация нимб и фантазеров И перераспределение сил». Что это за организация, в том окне не сказано. Позже, 2025-09-12 (id 364762), Нимб переопределён: «Организация Нимб более не фармавечическая компания это религиозная церковь» — но с фантазёрами это переопределение в переписке никак не связано.</p>\n<p><strong>Чужемирцы.</strong> Присутствуют в перечне 2025-05-10 отдельной строкой, при этом в описании 2025-05-31 чужемирцами названы Альфы. Отношение фантазёров к чужемирцам не оговорено.</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S04", "GR-0025-S04", "GR-0025--kak-menyalas"], "h": "<p><strong>2025-05-10 (id 324539–324541).</strong> Первое появление — последней строкой в рабочем перечне категорий сил, который Слава кидает списком: «Благословенный / Арбетары / Альфы / Чужемирцы / Владельцы артефактов / Фантазёры». Никаких пояснений при этом не даётся.</p>\n<p><strong>2025-05-14 (id 325805–325808).</strong> Миколай спрашивает, что делать с реестром: «убрать кого-то?», «добавить». Слава: «Добавления организация нимб и фантазеров И перераспределение сил». Фантазёры здесь — то, что надо добавить в реестр, вместе с Нимбом; плюс заявлено перераспределение сил. Само перераспределение в этом окне не расписано.</p>\n<p><strong>2025-05-31 (id 331636).</strong> Единственная развёрнутая разработка. В одном большом сообщении Слава описывает подряд правителей, Арбетаров и Альф, фантазёров и артефакты. Фантазёры получают: определение через «правителя с маленькой буквой», мир, созданный в голове, изменённое восприятие нашего мира, влияние на него по законам своего, пример с линиями и нитками, статус сильнейших существ на данный момент, склонность исчезать и объяснение малочисленности, а также ограничение по артефактам.</p>\n<p><strong>2025-05-31 (id 331663–331667).</strong> Уточнение по итогам разработки: в мир фантазёра попасть нельзя.</p>\n<p><strong>2025-08-30 (id 359697–359711).</strong> Перечень сил мира сокращается до трёх пунктов и переименовывается третий. Слава: «Можно придумать третью силу. Наподобие благословенных?»; Миколай: «а вторая какая?»; Слава: «Арбетаров и Альфы», затем списком: «Благословенный / Арбетаров и Альфы / Творцы ( фантазёры)» и «То есть четвёртую». Здесь фантазёры впервые названы творцами и стоят третьим пунктом из трёх уже существующих сил; чужемирцев и владельцев артефактов в перечне больше нет. Причина, по которой перечень сократился с шести строк до трёх, в переписке не названа. Разработки вокруг творцов в этом окне нет — список нужен, чтобы посчитать, какой по счёту будет новая сила.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "GR-0025-S05", "GR-0025--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет: ни одного фантазёра по имени в переписке не названо, список участников пуст.</li>\n<li>Как человек становится фантазёром — не сказано. Про Арбетаров и Альф механизм описан (ритуал, вырывание куска силы своего мира), про фантазёров — нет, только результат: «Они создали свой мир в голове».</li>\n<li>Чем фантазёры отличаются друг от друга — прямо не сформулировано. Дан один пример (мир как линии и колебания), помеченный словом «Пример», но перечня возможных вариантов восприятия и правила, как оно у кого складывается, в переписке нет.</li>\n<li>Иерархия внутри категории не описана: ни старших, ни ведущих, ни организации фантазёров между собой не упоминается.</li>\n<li>Отношение фантазёров к правителям остаётся нерешённым: сказано только, что фантазёр — «правитель с маленькой буквой» и что наш мир — «мир правителя»; могут ли правители влиять на фантазёров и наоборот, не сказано.</li>\n<li>«Перераспределение сил», заявленное 2025-05-14 вместе с добавлением фантазёров, в прочитанных записях не расписано.</li>\n<li>Почему в перечне 2025-08-30 остались три категории вместо шести и куда делись чужемирцы и владельцы артефактов — в переписке не сказано.</li>\n<li>Устройство категории в окне w0094 не раскрыто (помечено как неясность в самой базе).</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0025--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0025--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0025.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0025-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0025/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Самое дорогое здесь — не отсутствие имён и не механизм становления фантазёром, а то, что материал о фантазёрах лежит в базе непривязанным.</p>\n<p>У самой группы своей базы нет (0 знаков): статья собрана из <code>PS-0270</code> (9 594 знака базы) и <code>MR-0146</code> (2 460). При этом в базе есть запись <code>MR-0202</code> «Фантазёры и провал в свой мир» — 15 226 знаков, статьи нет, ссылок на неё нет, вселенная не проставлена («неясно»). Это больше, чем всё, из чего собрана нынешняя статья. Рядом ещё две такие же: <code>ID-0158</code> «Творцы» (3 644) и <code>MR-0156</code> «Запрет на творцов, артефакты, ауру и энергию» (4 121) — обе без статьи и без вселенной.</p>\n<p>То есть пробелы «чем фантазёры отличаются друг от друга» и «что с ними стало после 2025-08-30» могут оказаться не пробелами, а нераспознанным материалом. Это чинить первым: пока <code>MR-0202</code> висит в стороне, на группу опираются <code>GR-0023</code>, <code>VS-0002</code> и контракт агента АЗИП — и все три ссылаются на самую тонкую версию.</p>\n<h3>С чего начать</h3>\n<p>В базе, не в архиве. Прочитать <code>MR-0202</code>, <code>ID-0158</code>, <code>MR-0156</code> и сверить с <code>PS-0270</code>: если это тот же класс под словом «творцы», группа сразу вырастает вчетверо, а вселенную у трёх записей надо проставить.</p>\n<p>В архив идти только за двумя вещами: окно 2025-08-30 (id 359697–359711) — почему перечень сил ужался с шести строк до трёх; и окно 2025-05-14 (id 325805–325808) — за «перераспределением сил», которое заявлено вместе с фантазёрами и нигде не расписано. Оба ориентира узкие, искать вокруг соседних сообщений тех же дней.</p>\n<h3>Как развивалось</h3>\n<p>2025-05-10 — заявили одной строкой в списке, без пояснений. 2025-05-14 — назначили к добавлению в реестр вместе с Нимбом. 2025-05-31 — разработали целиком, в одном сообщении, и в тот же день ограничили: в мир фантазёра попасть нельзя. Дальше три месяца тишины. 2025-08-30 — вернулись, но не к устройству: переименовали в творцов и использовали строку списка, чтобы посчитать, какая по счёту будет новая сила.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>2025-05-14 про чёрный шар сказано, что он гасит благословение, но «на артефакты, альфоф и арбитаров никак не действует» — «так как их ней сила это их нея». Фантазёры к этому моменту уже четыре дня как названы в перечне сил, и сила у них тоже не по связи с правителем. Для альф и арбетаров исключение проговорено, для фантазёров того же рода — нет.</p>\n<h3>Отклик</h3>\n<p>Зацепила уязвимость. Обычно сильнейший класс придумывают через то, чего он не может; здесь наоборот — фантазёр исчезает не от удара, а от того, что у него нет причины оставаться. «Нет не одной причины жить в мире правителя. Если ты можешь попасть в свой» — это редкий случай, когда объяснение малочисленности работает и как объяснение характера. Хорошо и то, что пример один и очень конкретный: стена как миллион движущихся линий, потянул нитку — стена стала водой. Одного примера мало для правила, но он держит всю категорию на себе лучше, чем держал бы список. А диалог «а в мир фантазёра можно попасть?» — «хочу» — «Нет» стоит того, чтобы его не потерять при пересборке.</p></div>", "r": []}];</script>
