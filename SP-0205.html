<script>const BASE="";const DOCNAME="Цепи имитатора";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0205-S01", "SP-0205--mehanika"], "h": "<p>Приём имитатора, показанный только в бою, без отдельного объяснения (2025-03-19, id 305856–305858). Имитатор образует цепь и накидывает её на ангела — на шею или на ногу, — после чего тянет на себя.</p>\n<p>Три применения подряд в одной сцене:</p>\n<ol>\n<li>Ангел отталкивает противников, взлетает в воздух и начинает стрелять перьями из крыльев. Атаку он закончить не успевает: «вокруг его шей образуется цепь. И тянет его вниз. Очень быстро и сильно». Ангел не успевает ничего понять и оказывается лицом к лицу с имитатором, после чего улетает в деревья от удара.</li>\n<li>Ангел, отлетев в сторону, пытается снова подняться в воздух. «Имитатор не позволяет ему образуя цепь и накидавая. Эту цепь на ногу ангела».</li>\n<li>После того как струя огня ангела «присабачивает имитатора к землей» и всё в радиусе 23 метров сгорает за считанные секунды: «Из дыма и пыли. Вылетает цепь, которая обвивает шею ангела. Имитатор тянет на себя». Притянув ангела к себе, имитатор хватает его за шею и придавливает к земле.</li>\n</ol>\n<p>Общая функция во всех трёх случаях одна — не дать ангелу взлететь и подтащить его на дистанцию рукопашной. Цепь как оружие для удара или удушения не используется: только захват и притягивание.</p>\n<p>Как именно цепь возникает, из чего она состоит и откуда появляется, в переписке не сказано. Дальность броска не названа; третий бросок идёт «из дыма и пыли» через выжженный участок, но расстояние не указано.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0205-S02", "SP-0205--ogranicheniya-i-cena"], "h": "<p>Собственная цена цепей не описана. Известны только общие для благословлённых ограничения, которые имитатор излагает в той же сцене (id 305856): связь правителя устанавливается с мозгом, «И сила проходит через мозг. Повреждая его. Но не сильно», из-за чего благословлённые «не можем использовать благословенния 24/7», а в голове стоит предохранитель (<a href=\"SP-0204.html\">Предохранитель</a>), отключающий благословение при выгорании мозгов. Относятся ли эти ограничения к цепям напрямую — в переписке не сказано.</p>\n<p>Третье применение происходит, когда имитатор уже тяжело изранен: пробито лёгкое, ожоги третьей степени по всему телу, левая рука, по которой прошла первая струя пламени, «уже почти не ощущается. Там даже кость видна». Тем не менее цепь работает — «Но имитатор тянет». Никакой подготовки перед броском, в отличие от особого способа усиления, не требуется.</p>", "r": [["Предохранитель", "SP-0204.html"]]}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0205-S03", "SP-0205--nositeli"], "h": "<p>Единственный носитель в переписке — имитатор, апостол, благословлённый правителем рая. Настоящего имени он никому не говорит.</p>\n<p>К какой категории относятся цепи, не проговорено. Имитатор в разговоре с защитником называет четыре базовые способности всех благословлённых — «усиления, самоисцеления, энергия и сенсорика» — и говорит, что у апостолов, в отличие от остальных, способность формируется, то есть у каждого апостола она уникальная. Цепи ни к базовым, ни к уникальной способности имитатора в тексте не отнесены.</p>\n<p>В той же сцене имитатор применяет ещё два приёма, которые в тексте от цепей отделены: «особый способ усиления», удар по воздуху, который «поглащает слишком много сил. Да и его нужно ещё готовить», и оранжевые пузырьки, которыми он взрывает упыря — про это защитник думает: «Он сымитировал мою способность».</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0205-S04", "SP-0205--kak-menyalas-po-versiyam"], "h": "<p>Одна версия, 2025-03-19 (окно w0083, id 305856–305858). Внутри неё способность сразу показана в трёх применениях. Позднейших правок и обсуждений цепей в переписке нет.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0205-S05", "SP-0205--svyaz-s-drugimi-sposobnostyami"], "h": "<ul>\n<li>Благословение — общая рамка, в которую имитатор помещает силы апостолов; цепи прямо к ней не привязаны.</li>\n<li>Предохранитель (<a href=\"SP-0204.html\">Предохранитель</a>) — ограничитель в голове благословлённого; на цепи имитатора в тексте не влияет.</li>\n<li>Экзоскелет (<a href=\"SP-0210.html\">Экзоскелет</a>) — снаряжение упыря, участвующего в той же сцене; с цепями не пересекается.</li>\n</ul>\n<p>Цепи применяются только против ангела. Против упыря, второго чужемирца в этой сцене, имитатор их не использует — почему, не сказано.</p>", "r": [["Предохранитель", "SP-0204.html"], ["Экзоскелет", "SP-0210.html"]]}, {"t": "Пробелы", "a": ["S06", "SP-0205-S06", "SP-0205--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Природа цепи не описана: материал, длина, вес, откуда она берётся — ничего из этого в переписке нет.</li>\n<li>Не сказано, благословение это, часть уникальной способности имитатора или что-то третье.</li>\n<li>Не названы ни цена применения, ни лимит по числу цепей, ни максимальная дальность.</li>\n<li>Не сказано, можно ли накинуть цепь на кого-то, кроме ангела, и работает ли она на существ без крыльев.</li>\n<li>Не сказано, исчезает ли цепь после применения и что с ней происходит, когда имитатор её отпускает.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0205--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0204.html\">Предохранитель</a>, <a href=\"SP-0210.html\">Экзоскелет</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0383.html\">Имитатор</a></li>\n<li><strong>Упомянут в способностях:</strong> <a href=\"SP-0204.html\">Предохранитель</a>, <a href=\"SP-0210.html\">Экзоскелет</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0205--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-03-19</td>\n<td>305856–305858</td>\n<td>w0083</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0205-cepi-imitatora.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0205--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0205.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["SP-0205-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/SP-0205/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дыра тут не в цепях, а в том, что арсенал имитатора разложен по четырём вселенным и наполовину без статей. <code>PS-0293</code> «Усиление Имитатора» — 25 519 знаков базы, одна ссылка, статьи нет, приписан к «Оам»; при этом ровно та же тема уже разобрана в <code>SP-0060</code> «Усиление Имитатора» (112 113 базы, две ссылки, статья есть). Один предмет под двумя кодами, один разобран, второй лежит. Рядом ещё три записи без статей: <code>SP-0132</code> «Глаза Имитатора» (9 794, «7 островов»), <code>SP-0263</code> «Перерождение Имитатора» (5 356, вселенная «неясно»), <code>SP-0080</code> «Жидкая масса (инструмент Имитатора)» (2 141, «7 островов»). Сорок с лишним килобайт про приёмы одного персонажа, на которые кто-то ссылается и до которых справочник не дошёл.</p>\n<p>Это блокирует главный пробел статьи напрямую. Вопрос «благословение цепи, часть уникальной способности или что-то третье» решается только сведением всего арсенала в один список — а список сейчас нельзя составить, потому что четверть его позиций живёт в чужих вселенных без статей.</p>\n<p>Отдельно: реестровые <code>ID-0116</code> «Цепь связи» (5 105) и <code>ID-0115</code> «Цепи окавы» (4 717), обе без статей. В <code>PS-0383</code> про них честно сказано, что к имитатору они текстом не привязаны, — но прежде чем писать «природа цепи не описана», эти две записи надо прочесть и отвести явно.</p>\n<h3>С чего начать</h3>\n<p>В базе, и срочно: у этой статьи неверна первая дата. Цепь появляется не 2025-03-19, а 2025-03-18, id 305116 — и в другом виде. Она белая, образуется вокруг головы, и это убийство: «Вокруг его головы. Лишь на мгновение. Образовалось белая цепь. И в следующий мгновенной у Копьещика нет головы». Там же реакция свидетеля: «Что даже я не понял откуда взялась цепь». Лежит это не в <code>SP-0205</code>, а в <code>SP-0060</code> «Усиление Имитатора» (112 113 знаков базы) и продублировано в <code>PS-0383</code>, где диапазон цепей стоит правильно — 2025-03-18 – 2025-03-19. Оттуда же берётся цвет, которого в статье нет вовсе.</p>\n<p>Дословный текст сцены с ангелом — в <code>PR-0061</code> (34 415 знаков, проза), разбор той же сцены с другой стороны — в <code>SP-0079</code> «Имитация» (36 425) и <code>IS-0017</code> «Защитник» (139 029). В архив за этим идти не надо, всё уже в базе.</p>\n<h3>Как развивалось</h3>\n<p>2025-03-18 — показали как убийство: одна цепь, мгновенно, голова с плеч, объяснения нет и сам наблюдатель говорит, что не понял откуда она. 2025-03-19 — сузили: три броска подряд, и во всех трёх функция одна, служебная — не дать взлететь и подтащить к себе; убийства цепью больше нет ни разу. Не объяснили: в том же сообщении, id 305856, имитатор развёрнуто излагает устройство благословений, четыре базовые способности, связь через мозг и предохранитель — из этого куска выросли отдельные записи <code>SP-0163</code> и <code>SP-0204</code>, а цепи, показанные строкой ниже, остались без единого слова о том, что это такое. Не возвращались: после 2025-03-19 цепи в переписке не появляются.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>В этой же сцене имитатор проговаривает ограничение для своей стороны: сила идёт через мозг и повреждает его, «не можем использовать благословенния 24/7», а на случай выгорания в голове стоит предохранитель. Против него в этом бою стоят двое чужемирцев — ангел и упырь, — и оба применяют силу подряд, без пауз: перья, струя огня, выжигающая всё в радиусе 23 метров. Есть ли у чужемирских сил свой лимит, свой предохранитель или его аналог, не сказано. Правило про то, что силу нельзя жечь непрерывно, названо для одной из трёх сторон боя и не проговорено для двух других, хотя все три работают в одном кадре.</p>\n<h3>Отклик</h3>\n<p>Сильное здесь — что цепь так и не объяснили, и от этого она работает лучше, чем если бы объяснили. Три раза подряд одно и то же движение: возникла, обвила, потянула. Никакой подготовки, никакого замаха — на фоне «особого усиления», которое надо готовить и которое жрёт слишком много сил, цепь просто есть. И третий бросок вылетает из дыма, когда у человека пробито лёгкое, ожоги третьей степени и в левой руке видна кость: «Но имитатор тянет». Вот это «но» — вся характеристика персонажа, без единого прилагательного. Ещё зацепило, что бой он выигрывает и не добивает: «Имитатор не собирается убивать его. Ему нужны ответы. Почему жители рая устраивают нападения на другий миры?» — а горло ангелу перегрызает тот, кого он пришёл спасать, и остаётся только смотреть. Сцена, где сильнейший не может сделать ничего, потому что опоздал на полсекунды к чужому решению, стоит дороже, чем объяснение, из чего сделана цепь.</p></div>", "r": []}];</script>
