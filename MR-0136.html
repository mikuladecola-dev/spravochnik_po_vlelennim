<script>const BASE="";const DOCNAME="Инцидент (ядерный удар)";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0136-S01", "MR-0136--ustroystvo"], "h": "<p>Инцидент — катастрофа, разделившая мир пролога на до и после. Само слово «инцидент» — это название, которое даёт событию рассказчик: «В том мире, в котором жиле мы до инцидента я был просто офисный сотрудник» (2025-05-04, id 323659).</p>\n<p>Мир до инцидента описан рассказчиком как порядок. Это время, «где могли учиться, развиваться и мечтать. То время, где хаус и неразбериху. Упорядочил порядок и закон. Где ясно было где плохой, а где хороший. Где ты мог стать хоть кем угодно». Рассказчик отдельно отбивает возражение, что человек не мог стать тем, кем хотел: «Ведь это бред. Мы могли стать кем угодно, если бы возжелали этого. Да даже президентом стать могли. А также мы могли мечтать и надеяться на лучшей». Про происхождение этого порядка сказано так: «Мы жили в том порядке, который наши предки собрали за миллионы лет истории. Но ничто не вечно. И весь порядок собранный так долго, тщательно, был разрушен в один миг» (id 323659).</p>\n<p>Само событие показано изнутри, глазами одного человека, а не с высоты. Это субботнее утро. Рассказчик просыпается от будильника («От такого самого Би Би Би»), выключает его и ложится спать дальше; его будит звонком племянница, у которой в этот день день рождения. Он собирается, ест на кухне хлеб с майонезом и колбасой, вбивает в телефон запрос «детский магазин» и садится в машину ехать за подарком (id 323659–323660).</p>\n<p>Первый признак — пустота: «Катаясь по городу. Заметил что на улице очень мало людей. Ну это не удивительно. Утро субботы, кто вообще встанет». Пустота города сначала объясняется бытовым образом, но не отпускает: «Ехал я так. Почти по пустой дороги и думал \"что-то не так\" Не знаю почему. Просто эта мысль въелось в голову и не исчезала. Мой разум, что-то понял. Заметил мелкую размытую причину этой мысли. Но осознать еë не мог. Поэтому осталось лишь далёкой мыслью» (id 323660).</p>\n<p>Рассказчик останавливается на светофоре — специально отмечено, что людей не было, но он решил, что «не зачем нарушать закон», то есть порядок ещё действует. Он ложится на сиденье и закрывает глаза; услышав звук светофора, поднимает голову и видит небо: «Линий в воздухе, как от самолёта. Вот только их было сотни если не тысячи. Словно всё страны мира решили разом запустить всё имеющий боеголовки. А я лишь сейчас заметил эти линии» (id 323660).</p>\n<p>Порядок разрушения назван по шагам. Сначала — отсутствие любого предупреждения: «Не было сигнала или голоса, который говорил бы о запуске ракеты на нас. Не было паники, истерики. Была просто тишина». Затем: удар, сотрясение земли, гул всех зданий, волна. «Потом пошла волна. Заставив трещать окна и зеркала. Волна которая обронила здания. Всё начало рушится». Рассказчик остаётся в сознании, когда здание падает на его машину, «А после тьма и тишина. Словно умер я и лежу в могиле» (id 323660).</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0136-S02", "MR-0136--naselenie"], "h": "<p>Названы только люди из окружения рассказчика до удара: Алексей — выживший, до инцидента офисный сотрудник; его сестра, вышедшая замуж в 20 лет; её дочь, племянница Алексея, у которой в день инцидента день рождения. Через монолог племянницы упомянуты её подруги Катя и Лера с куклами и кукольным домиком и щенок. Про себя Алексей говорит: «У самого детей или хотя бы подружки у меня нету. Не сложилась как-то» (id 323659).</p>\n<p>О том, что стало с этими людьми после удара, в переписке не сказано.</p>\n<p>Отдельно задана позиция самого рассказчика перед аудиторией: «Хотите знать, что же было и что прошло? Я отвечу честно. Не буду врать или искажать историю. Ведь ты, вы обязаны знать. Но не ждите чудо, пафоса и интриги. Я обычный человек. Держите это в голове» (id 323659).</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0136-S03", "MR-0136--mesto-vo-vselennoy"], "h": "<p>Событие относится к вселенной «Нимб» по дате объявления; в самом тексте вселенная не названа.</p>\n<p>Связано с персонажем Алексей, с «Прологом про апокалипсис» и с «Опросом: какой апокалипсис страшней».</p>\n<p>Реплика соавтора в тот же день: «мне второй больше нравится, поэтому предлагаю продолжить первый» (2025-05-04, id 323661). Что именно сопоставлялось как «первый» и «второй», в переписке не расшифровано.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0136-S04", "MR-0136--kak-menyalsya-po-versiyam"], "h": "<p>Версия 1 — 2025-05-04, окно w0090, сообщения 323659–323661. Единственная версия. Первое и на данный момент единственное описание события: пустой город субботним утром, ощущение «что-то не так», сотни или тысячи инверсионных следов в небе, отсутствие сигнала и паники, тишина, удар, тряска земли, гул зданий, волна, обрушение домов, темнота.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0136-S05", "MR-0136--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Причина удара в тексте не объяснена. Сравнение «Словно всё страны мира решили разом запустить всё имеющий боеголовки» остаётся сравнением рассказчика, а не установленным фактом; кто нанёс удар и почему — не сказано.</li>\n<li>Вселенная в самом тексте не названа, отнесение к «Нимбу» сделано по дате объявления.</li>\n<li>Масштаб не задан: сказано только о том, что видел один человек в одном городе. Затронуты ли другие города или страны, в переписке не сказано.</li>\n<li>Что стало с сестрой, племянницей и остальными людьми — не сказано.</li>\n<li>Как Алексей выжил под обрушившимся зданием — не сказано; известно только, что он «выживший» и рассказывает уже после событий.</li>\n<li>Что стоит за репликой о «первом» и «втором» варианте — осталось нерешённым.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0136--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0006.html\">Нимб</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0136--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-05-04</td>\n<td>323659–323661</td>\n<td>w0090</td>\n<td>Нимб (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0136-incident-yadernyy-udar.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0136--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0136.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
