<script>const BASE="";const DOCNAME="Отряд Имитатора времён 8-летней войны";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0029-S01", "GR-0029--chto-eto"], "h": "<p>Военный отряд вселенной «7 островов», в котором Имитатор воевал в 8-летней войне. К моменту, когда о нём заходит речь, отряд уже не существует: «Но после войны отряд распался».</p>\n<p>Разведка определила это как группу, и это верно: речь именно об отряде из нескольких человек, а не об одном персонаже. Но весь отряд описан одной репликой Славы (2024-07-04, id 196162):</p>\n<div class=\"q\"><p>«Он воевал в 8 войне и у них был отряд бессмер, провидец и ещё КаВО нибудь<br>Но после войны отряд распался<br>А так сейчас у него есть помощник»</p></div>\n<p>Отряд возник в переписке как ответ на вопросы Миколая про окружение Имитатора: «ну у него какая команда», «где он вообще находится», «в чём» (2024-07-04, id 196151–196153). То есть отряд появился как часть биографии Имитатора — в разделе про его прошлое, семью и жильё, — а не как самостоятельная сущность. Отдельно к нему авторы больше не возвращались.</p>\n<p>Сама 8-летняя война в этом же окне названа событием, после которого людям некуда идти: Оазис — «остров спаситель для беженцев и людей который после 8 летний войны не куда идти, также все лабораторный крысы ( людий) от не куда идти, находят дом в оазисе» (2024-07-04, id 196043). Защитник Оазиса — Имитатор, тот самый участник отряда; он «следит чтобы на остров не попали преступники и криминальный люди». Связь между службой Имитатора в отряде и тем, что он потом стал защитником острова-убежища, в переписке не проговорена — обе вещи просто названы в одном окне.</p>\n<p>Отдельно фиксируется реплика Славы 2024-05-07 (id 166880), сказанная задолго до этого отряда и в другом разговоре: «просто кидать сильных персонажей в один отряд глупо тем более если их ний силы друг другу не подходят». Это высказывание об отрядах вообще; с отрядом Имитатора авторы его не связывали.</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0029-S02", "GR-0029--sostav"], "h": "<p>Поимённого состава нет. Названы три позиции, из них две — обозначениями, а не именами:</p>\n<ul>\n<li><strong>Имитатор</strong> — участник, ради биографии которого отряд и был придуман. Отдельной записи-персонажа у него в списке нет, его материал лежит в <a href=\"PS-0383.html\">Имитатор</a> «Усиление Имитатора». Каким он был во время войны, в переписке не сказано: вся его карточка (возраст 32, сила 7, ловкость 7, меткость 8, скорость 7, контроль 100, инструмент — жидкая масса, черты «ответственный, и чересчур трудяга»; 2024-07-04, id 196048) относится к настоящему времени, к периоду, когда он уже защитник Оазиса.</li>\n<li><strong>бессмер</strong> — назван одним словом, больше о нём не сказано ничего. Отдельной записи у него нет.</li>\n<li><strong>провидец</strong> — назван одним словом, больше о нём не сказано ничего. Отдельной записи у него нет.</li>\n<li><strong>«ещё КаВО нибудь»</strong> — четвёртый (и, возможно, не только четвёртый) участник не назван и не придуман. Численность отряда тоже не названа.</li>\n</ul>\n<p>В базе список участников (members) пуст: id для «бессмера» и «провидца» не заводились.</p>", "r": [["Имитатор", "PS-0383.html"]]}, {"t": "Как менялась — по датам", "a": ["S03", "GR-0029-S03", "GR-0029--kak-menyalas"], "h": "<p>Отряд прошёл через переписку один раз, за один вечер, и после этого не менялся. Ниже — состояния по датам, вместе с ближайшим окружением, потому что отряд назван внутри разговора об окружении Имитатора.</p>\n<p><strong>2024-07-03 (окно w0041, id 194833–194838).</strong> Сначала появляется не отряд, а помощник — то, что осталось у Имитатора после отряда: «У имитатор помощник есть», «Чел с разными цвета глаз имеющий 2 способности / Барьер и исцеление». Сам отряд в этот день ещё не упоминается.</p>\n<p><strong>2024-07-03 (окно w0041, id 194911–194915).</strong> Уточняется положение Имитатора: «Оазис защитник имитатор», «Вся власть находится у Имитатор он не только защищает но и отвечает за политику».</p>\n<p><strong>2024-07-04 (окно w0042, id 196150–196173).</strong> Единственное появление отряда. Миколай спрашивает про команду и местонахождение, Слава отвечает про войну и отряд (id 196162), после чего разговор сразу уходит к жилью и родне: «Дом есть и брат есть» (id 196171), «Офис ну есть , надо придумать» (id 196173). Реплики Миколая в этом месте — «он че бомж», «у него должен быть дом», «и офис» — про Имитатора, не про отряд.</p>\n<p><strong>После 2024-07-04.</strong> В записи <a href=\"PS-0383.html\">Имитатор</a> «Усиление Имитатора» 33 версии, они тянутся до 2026-04-29 и проходят через несколько вселенных (7 островов, Апостол, Оам, Цветной мир). Отряд времён 8-летней войны в них ни разу не всплывает. Позднейшие командные конструкции — команда против Серафима из четырёх человек (Воительница, Агрегат, Имитатор, Палач; 2025-01-28, id 285363) — относятся к вселенной «Апостол», и с отрядом 8-летней войны авторы их не связывали.</p>", "r": [["Имитатор", "PS-0383.html"]]}, {"t": "Пробелы", "a": ["S04", "GR-0029-S04", "GR-0029--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет. Есть два обозначения — «бессмер» и «провидец» — и открытая позиция «ещё КаВО нибудь».</li>\n<li>Кто такие «бессмер» и «провидец», не сказано вообще: ни способностей, ни внешности, ни имён, ни того, живы ли они. Записей в базе у них нет.</li>\n<li>Численность отряда не названа.</li>\n<li>Иерархия не названа: кто командовал отрядом и командовал ли кто-то, в переписке не сказано; неизвестно даже, был ли Имитатор рядовым участником или главным.</li>\n<li>Общих способностей отряда не названо; принцип, по которому людей собрали в один отряд, не проговорен.</li>\n<li>На чьей стороне и против кого воевал отряд, не сказано. Про саму 8-летнюю войну известно только то, что после неё осталась масса беженцев, которых принимает Оазис.</li>\n<li>Почему отряд распался, не сказано — сказано только, что распался.</li>\n<li>Отношений с другими группами не зафиксировано ни одного.</li>\n<li>В карточке базы отряд помечен как связанный с Имитатором и со «Слиянием двух измерений»; в самой переписке связь со «Слиянием двух измерений» не проговаривается.</li>\n<li>Помощник Имитатора (в базе <a href=\"PS-0103.html\">Помощник Имитатора</a>) участником отряда не назван — он назван как то, что есть «сейчас», после распада отряда. Был ли он в отряде, осталось нерешённым.</li>\n<li>Брат Имитатора (2024-07-04, id 196171) с отрядом никак не связан — просто упомянут в том же обмене репликами.</li>\n</ul></div>", "r": [["Помощник Имитатора", "PS-0103.html"]]}, {"t": "Связи — всё вместе", "a": ["GR-0029--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0103.html\">Помощник Имитатора</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0048.html\">Отряд сильнейших (команда «А»)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0012.html\">Цветной мир</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0029--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0029.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0029-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0029/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым чинить не состав отряда, а войну, в которой он воевал. <code>ID-0087</code> «8-летняя война»: статьи нет, в базе 2,1 КБ, ссылка одна. Мало по цифрам — но на этой войне держатся сразу две готовые статьи. Оазис (<code>MR-0020</code>, 18,5 КБ базы, три ссылки) определён через неё целиком: это остров для тех, кому «после 8 летний войны не куда идти». Отряд определён через неё же. Пока войны нет как отдельной записи, оба текста вынуждены пересказывать одну и ту же реплику про беженцев, и ни один не может сказать, кто с кем воевал.</p>\n<p>Второе — <code>ID-0050</code> «Провидец»: три ссылки, статьи нет, 14,2 КБ базы. Здесь провидец назван одним словом и брошен, а в базе под этим именем лежит материала в семь раз больше, чем весь отряд. Вселенные у записи другие (Апостол, игра бога), так что это не готовый ответ, а обязательная сверка: одно это слово или два разных. То же с «бессмером» — <code>IS-0013</code> «Бессмертный», шесть ссылок, 43 КБ базы, статья есть.</p>\n<p>Третье, техническое: одна сущность лежит двумя записями. <code>GR-0029</code> — базы 0, одна входящая ссылка; <code>PS-0110</code> «Отряд Имитатора времён 8-летней войны» — персонаж, две ссылки, 2 КБ базы. Весь материал у двойника, все входы врозь.</p>\n<h3>С чего начать</h3>\n<p>В базе искать почти нечего: <code>PS-0110</code> — 2 КБ, и они целиком процитированы в статье. Настоящий запас рядом: <code>PS-0383</code> «Имитатор» — 133 КБ базы, 33 версии до 2026-04-29. Прежде чем идти в архив, надо пройти эти версии на предмет войны и отряда: статья утверждает, что отряд там не всплывает ни разу, и это утверждение стоит проверить именно по <code>PS-0383</code>, а не по переписке.</p>\n<p>Дальше — сверка двух имён: <code>ID-0050</code> (провидец) и <code>IS-0013</code> (бессмертный), плюс <code>SP-0004</code> «Бессмертие, привязанное к предмету» (статьи нет, 2,3 КБ, вселенная неясна). Задача не «дописать участников», а ответить, заводились ли эти двое где-то ещё под тем же обозначением.</p>\n<p>В архив — за 2024-07-04, окно w0042, id 196150–196173, и за примыкающее w0041, 2024-07-03, id 194833–194915. Смотреть надо не сам ответ про отряд, а то, что вокруг: вопросы Миколая «ну у него какая команда», «где он вообще находится» и обрыв разговора на «Офис ну есть , надо придумать». Второй ориентир — 2024-07-04, id 196043, где та же война названа со стороны Оазиса. Третий, отдельный: 2024-05-07, id 166880 — реплика про подбор отрядов, сказанная за два месяца до и в другом разговоре.</p>\n<h3>Как развивалось</h3>\n<p>Заявили и ограничили одной репликой. 2024-07-04, id 196162: отряд назван и тут же закрыт — «Но после войны отряд распался», и следом «А так сейчас у него есть помощник». Появление и роспуск стоят в соседних строках.</p>\n<p>До этого, 2024-07-03, помощник и статус защитника Оазиса уже названы (id 194833–194838, 194911–194915) — то есть сначала появилось то, что осталось после отряда, и только на следующий день — сам отряд.</p>\n<p>Забыли в тех же минутах: разговор уходит на «Дом есть и брат есть» (id 196171) и офис (id 196173) внутри того же обмена.</p>\n<p>Не вернулись. За 33 версии Имитатора до 2026-04-29, через четыре вселенных, отряд не всплывает. Команда против Серафима из четырёх человек (2025-01-28, id 285363) собрана в другой вселенной и с этим отрядом не связана.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для Имитатора вопрос «а что после войны» проговорён: отряд распался, но «сейчас у него есть помощник» — судьба участника после роспуска названа прямо, в той же реплике.</p>\n<p>Для бессмера и провидца, участников того же отряда, того же рода вопрос не поставлен. Не сказано ни что они делали после, ни живы ли они, ни куда делись — сказано только «распался». Правило «после отряда у человека что-то остаётся» названо ровно для одного из троих.</p>\n<h3>Отклик</h3>\n<p>Зацепило, как отряд возникает и умирает в одном предложении. Не «был отряд, потом расскажу, что стало» — а «у них был отряд бессмер, провидец и ещё КаВО нибудь / Но после войны отряд распался». Причём это ответ не про отряд: Миколай спросил про команду в настоящем времени, и ответ строится как отрицание — команды нет, вот почему. Отряд здесь не сущность мира, а объяснение одиночества персонажа, и он ровно такого размера, какой нужен для объяснения. «Ещё КаВО нибудь» — честнее любого списка: место под четвёртого оставлено открытым прямо в тексте, вместе с опечаткой. И рядом лежит реплика двухмесячной давности про то, что кидать в один отряд людей с несовместимыми силами глупо, — сказанная про отряды вообще и ни разу не приложенная к собственному, где бессмертный и провидец стоят рядом без единого слова о том, зачем.</p></div>", "r": []}];</script>
