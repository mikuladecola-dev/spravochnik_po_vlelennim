<script>const BASE="";const DOCNAME="Альгиз";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0204-S01", "PS-0204--proishozhdenie"], "h": "<p>Альгиз — эльф, серийный убийца, психопат и дальтоник. Представлен целиком за один заход 2025-02-25 (id 295465–295507), в одном окне w0077.</p>\n<p>Материал попал в чат соавторов пересылкой из чужой переписки: автор персонажа — «девочка с конкурса», а не Миколай и не Слава. В пересланном тексте рассказчица говорит о себе в женском роде («Я однажды завела дневник и поклялась его больше никогда не заводить», «Я ДАЖЕ ДЛЯ КАЖДОЙ ЖЕРТВЫ ПРЕДЫСТОРИЮ ПРИДУМАЛА ЖОСКУЮ»). Название её вселенной в переписке не звучит. Альгиз назван её любимым персонажем: «Короче там был серийный убийца... Мой любимый. Его зовут Альгиз».</p>\n<p>Он «эльф с сюжеткой своей жоской». Происходит из семьи магов. Убил собственного брата — «Но на это не было какой-то причины. Он прсото ему надоел. И он не видел ничего плохого в том, чтобы... УБИТЬ брата...». За это его возненавидел, проклял и изгнал собственный отец.</p>\n<p>Обстоятельства проклятия: «Тогда его прокляли его же символом». Альгиз — руна, что обозначает защиту; персонаж носит имя этой руны, и проклятие построено именно на её значении.</p>\n<p>Отдельно отмечено, что персонаж всплыл через старый дневник автора: дневник заводился ради записей о себе, а заполнялся историями персонажей, и теперь перечитывается («Теперь я перечитываю и умираю...»).</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0204-S02", "PS-0204--vneshnost"], "h": "<p>Эльф. Дальтоник. Других описаний внешности в переписке нет.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0204-S03", "PS-0204--harakter"], "h": "<p>Психопат. Не видит ничего плохого в убийстве — в случае с братом мотива не было вообще, брат просто надоел.</p>\n<p>По складу — организатор, а не исполнитель: «Он был мозгом, в конце концов, а остальные – типа пешками».</p>\n<p>На виду ведёт себя тихо и не сопротивляется: «А он же как котёнок, когда на виду – даже не пискнет...».</p>\n<p>Слабость у него, как сказано, такая же, как «у всех серийных убийц»: «Ну этот боялся потерять дочь» — речь о приёмной дочери.</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0204-S04", "PS-0204--sposobnosti"], "h": "<p>Собственно способности у Альгиза не описаны. Описано проклятие, работающее как жёсткий запрет.</p>\n<p>Амулет с руной Альгиз носит сам Альгиз и «НЕ МОГ его снять никаким образом». При этом он «чисто физически не мог нанести вред»: «С любого расстояния. Любыми способами. Даже случайно».</p>\n<p>Механика показана примером: «Он мог кинуть нож лезвием прям в лицо врагу, но нож перед лицом обернется и абсолютно ничего не заденет».</p>\n<p>Обход запрета — убийство чужими руками. «Это было проклятием, которое он пытался разрушить, убивая чужими руками всё больше людей». Для каждой жертвы, по словам автора, была придумана отдельная предыстория.</p>\n<p>Названа одна из жертв — Алто, тёмный эльф, у которого был талант «всегда выигрывать в любых азартных играх, так что он мог обыграть само время». «Пантеоны богов склонялись перед его мастерством. Но даже того он убил».</p>\n<p>Разрушение проклятия убийствами не сработало: «Короче, он не получил той мощи».</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Что не сформулировано по вашей же логике — не материал авторов</b>\n<p>Запрет описан как правило с закрытым перечнем: «С любого расстояния. Любыми способами. Даже случайно» — и отдельно назван единственный обход, чужие руки. Направление у правила одно: от Альгиза наружу. Что делает та же руна, когда вред идёт к нему, не проговорено — при том что Альгиз означает защиту, проклятие построено именно на значении руны, а в статье есть эпизод, где его «почти убили» и взяли в плен. Для одной стороны правило названо подробно, для соседней такой же — нет.</p></div>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0204-S05", "PS-0204--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Отец</strong> — маг, возненавидел, проклял и изгнал Альгиза за убийство брата. Имя не названо.</li>\n<li><strong>Брат</strong> — убит Альгизом без причины. Имя не названо.</li>\n<li><strong>Алто</strong> — тёмный эльф, всегда выигрывающий в азартные игры, вплоть до выигрыша у самого времени; убит Альгизом.</li>\n<li><strong>Приёмная дочь</strong> — единственная названная слабость Альгиза, он боялся её потерять; в конце она сбежала. Имя не названо.</li>\n<li><strong>Другие персонажи автора</strong> — те, кто почти убил Альгиза и взял его в плен. По формулировке в переписке — «мои другие персонажи», то есть персонажи девочки с конкурса. Поимённо не названы.</li>\n<li><strong>Земова</strong>, <strong>Серп</strong> — числятся в связях записи, но в приведённой переписке не упоминаются; чем именно связаны, не сказано.</li>\n</ul>", "r": []}, {"t": "Как менялся", "a": ["S06", "PS-0204-S06", "PS-0204--kak-menyalsya"], "h": "<p>Версия одна, 2025-02-25 (id 295465–295507). Персонаж изложен разом, изменений и пересмотров в переписке нет.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0204-S07", "PS-0204--chto-s-nim-stalo"], "h": "<p>Альгиза почти убили другие персонажи автора. Убивать не стали: «Но типа они проявили нечеловеческую благосклонность, чтобы пощадить и держать в плену». Причина милосердия названа прямо и утилитарно: «Всё равно ведь никому плохого не сделает, и чтобы эти самые чужие руки не прибрал себе – вот». То есть в плену его держат не как опасного бойца — проклятие делает его безвредным лично, — а чтобы отрезать от исполнителей.</p>\n<p>Последнее, что сказано о его линии: «Короче я помню, как она сбежала...» — про приёмную дочь. Чем это кончилось, в переписке не сказано, рассказ на этом обрывается.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0204-S08", "PS-0204--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вселенная, в которой существует Альгиз, не названа; известно только, что она принадлежит девочке с конкурса и к вселенным Миколая и Славы отношения не имеет.</li>\n<li>Имена отца, брата и приёмной дочери не названы.</li>\n<li>Не сказано, кто именно из «других персонажей» пленил Альгиза и где его держат.</li>\n<li>Чем закончился побег приёмной дочери — осталось нерешённым, фраза обрывается.</li>\n<li>Не объяснено, как именно убийства чужими руками должны были разрушить проклятие и о какой «мощи» идёт речь («он не получил той мощи» — что это за мощь, не сказано).</li>\n<li>Дальтонизм упомянут одним словом и нигде не используется.</li>\n<li>Связь с Земовой и Серпом в переписке не раскрыта.</li>\n<li>Материал воспроизводится по памяти и по старому дневнику, с оговорками рассказчицы («Пытаюсь вспомнить вайб...», «Помню Алто...»).</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["PS-0204--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-02-25</td>\n<td>295465–295507</td>\n<td>w0077</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0204-algiz.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0204--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0204.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0204-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0204/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первое — не содержание, а подключение. <code>PS-0204</code> — узел всего кластера, и ссылок на него ноль. О нём говорят как минимум шесть записей: <code>PS-0205</code> Алто (он его убил), <code>PS-0206</code> приёмная дочь (его слабость), <code>SP-0188</code> проклятие руны Альгиз, <code>PS-0207</code> Серп (через параллель дочерей), <code>PS-0208</code> Земова, <code>MR-0112</code> вселенная девочки с конкурса (он там первым в списке населения). Ни одна на него не ссылается, блока «Связи» у самой статьи тоже нет. Единственная сшитая пара во всём кластере — <code>PS-0207</code>↔<code>PS-0208</code>. Это чинится без единого похода в архив и разблокирует чтение сразу семи статей.</p>\n<p>Второе, содержательное и самое дорогое: отец и брат. Вся причинность держится на них — брат убит без мотива, отец за это проклял и изгнал, из проклятия растёт всё остальное. Записей под них нет никаких: ни статьи, ни материала, ни id. В <code>blockers.json</code> их просто нет (<code>PS-0330</code> «Отец» — из Фени, <code>PS-0313</code> «Брат Миши» — вне вселенной, к этому отношения не имеют). Статья описывает следствие, у которого источник нигде не зафиксирован.</p>\n<p>Третье: <code>MR-0112</code> — рамка, в которой всё это существует, статья есть (5 008), ссылок ноль. Название вселенной там тоже не найдено, так что пробел «вселенная не названа» закрыт быть не может — но сама рамка описана и из кластера ни разу не позвана.</p>\n<h3>С чего начать</h3>\n<p>В базе, не в архиве. Весь материал — один непрерывный пересказ 25 февраля 2025 в окне w0077, порезанный на записи с перекрывающимися диапазонами:</p>\n<ul>\n<li><code>MR-0112</code> — 295448–295465 (чья вселенная, возраст, соавторы, состав)</li>\n<li><code>PS-0204</code> — 295465–295507</li>\n<li><code>PS-0205</code> — 295496–295501</li>\n<li><code>PS-0206</code> — 295503–295510</li>\n<li><code>PS-0208</code> — 295507–295510</li>\n<li><code>PS-0207</code> — 295508–295512</li>\n<li><code>PS-0209</code> — 295508–295522 (Серафима)</li>\n<li><code>SP-0188</code>, <code>SP-0189</code> — механика проклятия и талант жертвы</li>\n</ul>\n<p>Границы режут одни и те же сообщения: 295465 стоит и концом <code>MR-0112</code>, и началом <code>PS-0204</code>; 295507–295510 попадают сразу в четыре карточки. Пробел «связь с Земовой и Серпом не раскрыта» закрывается сверкой этих диапазонов между собой, а не архивом.</p>\n<p>В архив идти за двумя вещами. За продолжением: рассказ обрывается на «Короче я помню, как она сбежала...», и после 295522 по этой линии в базе нет ничего — смотреть 25 февраля 2025, w0077, дальше 295522, плюс вложения (в <code>PS-0209</code> обещаны рисунки: «а сейчас отправлю рисунки»). И за конкурсом: какой именно конкурс имеется в виду в «девочке с конкурса», нигде не сказано, а единственная конкурсная запись <code>SL-0112</code> («Чертова дюжина 2025», 6 379 базы, статьи нет) датирована октябрём 2025-го — на восемь месяцев позже и с этой вселенной не связана. Искать до февраля 2025.</p>\n<h3>Как развивалось</h3>\n<p>Всё выкладывается за один заход, окно w0077, 2025-02-25, id 295465–295507. Порядок строго цепочный: рамка вселенной, потом любимый персонаж, потом убийство брата, потом проклятие, потом механика запрета, потом обход через чужие руки, потом жертва, потом слабость, потом плен. Каждый следующий элемент входит через предыдущий, самостоятельно не введён ни один. Ограничение приходит одновременно с заявкой — проклятие названо не позже самого персонажа, а не после. Возврата нет: вторая версия не появилась, ни одна дата в кластере не выходит за 25 февраля. Последняя фраза обрывается на середине.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Запрет описан как правило с закрытым перечнем: «С любого расстояния. Любыми способами. Даже случайно» — и отдельно назван единственный обход, чужие руки. Направление у правила одно: от Альгиза наружу. Что делает та же руна, когда вред идёт к нему, не проговорено — при том что Альгиз означает защиту, проклятие построено именно на значении руны, а в статье есть эпизод, где его «почти убили» и взяли в плен. Для одной стороны правило названо подробно, для соседней такой же — нет.</p>\n<h3>Отклик</h3>\n<p>Зацепил мотив пощады: «Всё равно ведь никому плохого не сделает, и чтобы эти самые чужие руки не прибрал себе». Милосердие оказывается складским решением — не спасают, а изымают инструмент, и это сказано вслух, без попытки облагородить. Рядом с этим хорошо стоит сама конструкция проклятия: человека наказали его же именем, и руна защиты в итоге защищает от него всех, кроме него самого. Дальтонизм при этом висит одним словом и нигде не срабатывает — на общем фоне, где каждая деталь тут же куда-то вставлена, он заметен именно тем, что не вставлен никуда.</p></div>", "r": []}];</script>
