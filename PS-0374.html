<script>const BASE="";const DOCNAME="Фатик";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0374-S01", "PS-0374--proishozhdenie"], "h": "<p>Фатик введена 2026-06-03 (id 487531, окно w0121) как прямая замена другому персонажу. Слава: «Святая дева её больше нет как персонаж вообще. Вместо неё одним из столпов злодеев становится Фатик ( желтоволосая девчушка) чем способности управления фотонами». То есть персонаж возник не на пустом месте, а занял освободившееся место в составе столпов злодеев.</p>\n<p>Второй вариант имени, встречающийся в переписке, — «Фатика» (в форме «После битвы с Фатикой»).</p>\n<p>Принадлежность к вселенной в карточке помечена как «неясно» — определена по дате объявления, прямо в переписке не названа.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0374-S02", "PS-0374--vneshnost"], "h": "<p>Названа одна деталь: «желтоволосая девчушка». Возраст, рост, одежда, знаки принадлежности к секте — в переписке не описаны.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0374-S03", "PS-0374--harakter"], "h": "<p>Отдельного описания характера в переписке нет. Косвенно даны две вещи: она возглавляет секту, которая поклоняется ей как богине в человеческом виде, и она проиграла бой Нуару, после чего осталась жива.</p>\n<p>Сразу следом за репликой о Фатик идёт сообщение (id 487532, 2026-06-03): «Конечно он ебанутый. Он блять каждый Божий день слышат крики о помощи. Его каждую ночь мучуют кошмары. Конечно он ебанутый». Реплика в мужском роде и следует за упоминанием инквизитора с чистой Оам, состоящего в секте; к кому именно она относится, прямо не сказано.</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0374-S04", "PS-0374--sposobnosti"], "h": "<p>Основа — управление фотонами. Перечислено в одном сообщении (id 487531, 2026-06-03):</p>\n<ul>\n<li>Создание зрительных иллюзий. «Она может создавать зрительные иллюзии, разукрасить мир в чёрное белые, может сделать так что ты подумал что вы оказались во дворце».</li>\n<li>Перемещение «на невероятной скорости».</li>\n<li>«Мощные залпы энергии ( ну фотонов с массой, ну которые как бы нарушает законы физики, ну пока допустим)». Оговорка «ну пока допустим» принадлежит автору — противоречие с физикой замечено и оставлено как есть.</li>\n<li>Защитные выбросы: залпы применяются «например от тьмы Нуара».</li>\n<li>Осязаемые иллюзии — не по умолчанию, а с усилием: «Также если постарается её может сделать иллюзии осязаемыми».</li>\n<li>«Также может погладить все факторы устроив минутку тьмы» — формулировка дана в исходнике именно так.</li>\n<li>Ослепление и дезориентация: «Может ослепить, запутать в пространстве».</li>\n</ul>\n<p>Каких-либо ограничений, цены или расхода на эти способности в переписке не оговорено.</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0374-S05", "PS-0374--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Столпы злодеев</strong> — Фатик один из шести столпов, поставлена на место Святой девы.</li>\n<li><strong>Секта Фалим</strong> — Фатик её глава. Секта «покланяется ей как богини в человеческом виде». Имя секты придумано тут же, в том же сообщении: «( давай назовём данную секту Фалим)».</li>\n<li><strong>Инквизиторы</strong> — в секте Фалим состоит инквизитор с чистой Оам: «кстати в этой сети как раз таки состоит инквизитор с чистой Оам». Отдельно отряд инквизиторов атакует Нуара сразу после его боя с Фатик; связь между этим отрядом и сектантом-инквизитором в переписке не проведена.</li>\n<li><strong>Нуар</strong> — противник. Их бой описан только по результату и только со стороны Нуара.</li>\n</ul>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0374-S06", "PS-0374--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2026-06-03 (id 487531–487532, окно w0121).</strong> Введение персонажа: желтоволосая девчушка, столп злодеев вместо Святой девы, управление фотонами, глава секты Фалим. Здесь же назван весь набор способностей.</p>\n<p><strong>Версия 2 — 2026-06-09 (id 488828, окно w0121).</strong> Добавлен исход столкновения с Нуаром: «После битвы с Фатикой, нуар побеждает но не убивает. Оставляет её в живых и уходит». Сама Фатик в этом сообщении дальше не фигурирует — весь остальной текст идёт про Нуара: он уходит с места битвы уставший и потративший Оам «больше чем когда либа», после чего на него нападает отряд инквизиторов, ослепляет и лишает чувств, а он в ответ применяет тьму и убивает всех инквизиторов. Причина, по которой Нуар оставил Фатик в живых, в переписке не объяснена; объяснено только его поведение с инквизиторами: «почему нуар так поступил, он испугался впервые за долгое время он ощутил страх смерти и его знания помутнилась».</p>\n<p>Таким образом, бой с Фатик описан не сам по себе, а как отправная точка сцены с инквизиторами.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0374-S07", "PS-0374--chto-s-nim-stalo"], "h": "<p>Жива. Нуар победил и не убил, оставил в живых и ушёл (2026-06-09, id 488828). Что она делала после боя — в переписке не сказано.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0374-S08", "PS-0374--probely"], "h": "<div class=\"gaps\"><ul>\n<li>В описании инцидента с дырой (id 488439) после чёрно-белого мира упоминается некая Карен — возможно, это второе имя Фатик; прямо это не сказано (пометка неясности окна w0121).</li>\n<li>Сам бой с Нуаром не описан — только результат.</li>\n<li>Не сказано, почему Нуар её пощадил.</li>\n<li>Не описаны ограничения и цена её способностей.</li>\n<li>Не сказано, как именно она стала главой секты Фалим и что секта из себя представляет помимо поклонения.</li>\n<li>Не сказано, тот ли это инквизитор с чистой Оам, что состоит в секте, участвовал в нападении на Нуара.</li>\n<li>Внешность ограничена одной деталью; характера, биографии, возраста в переписке нет.</li>\n<li>Принадлежность к вселенной не названа — стоит пометка «неясно».</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0374--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0104.html\">Нуар</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0374--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-06-03</td>\n<td>487531–487532</td>\n<td>w0121</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-09</td>\n<td>488828–488828</td>\n<td>w0121</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0374-fatik.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0374--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0374.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
