<script>const BASE="";const DOCNAME="Помощник Имитатора";
const LEAD="";
const CH=[{"t": "Внешность", "a": ["S01", "PS-0103-S01", "PS-0103--vneshnost"], "h": "<p>«Чел с разными цвета глаз» — человек с разными цветами глаз (2024-07-03, id 194838). Других деталей внешности в переписке нет.</p>", "r": []}, {"t": "Способности", "a": ["S02", "PS-0103-S02", "PS-0103--sposobnosti"], "h": "<p>Владеет двумя способностями: барьер и исцеление. Формулировка Славы — «Чел с разными цвета глаз имеющий 2 способности / Барьер и исцеление» (2024-07-03, id 194838).</p>\n<p>Как именно работают барьер и исцеление, какие у них ограничения и цена — в переписке не сказано. Связь гетерохромии с двумя способностями прямо не проговорена.</p>", "r": []}, {"t": "Связи с другими", "a": ["S03", "PS-0103-S03", "PS-0103--svyazi-s-drugimi"], "h": "<p>Состоит при Имитаторе: «У имитатор помощник есть» (Слава, 2024-07-03, id 194833). Роль помощника Миколай описал так: «да, типо когда чел пойдёт по своим делам наёмника, солнышко останется» (id 194834) — то есть помощник остаётся на месте, когда основной персонаж уходит по своим делам.</p>\n<p>В той же реплике Миколай назвал дела «наёмника»; следом он сам переспросил «кто» (id 194835), Слава ответил «Нуар не наемник» (id 194836), Миколай согласился: «а, точняк, перепутал» (id 194837). Таким образом определение «наёмник» отклонено сразу же — Нуар наёмником не является. Кто такой Нуар и как он соотносится с Имитатором и с помощником, в этом фрагменте не поясняется.</p>\n<p>Кто такое «солнышко» из реплики id 194834 — сам помощник или другой персонаж — в переписке не сказано.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S04", "PS-0103-S04", "PS-0103--kak-menyalsya"], "h": "<p><strong>2024-07-03 (окно w0041, id 194833–194838).</strong> Единственное состояние и единственное появление. Зафиксировано: у Имитатора есть помощник; помощник остаётся, когда основной персонаж уходит по делам; человек с разными цветами глаз; две способности — барьер и исцеление. В ходе того же разговора отброшено ошибочное отнесение дел к «наёмнику» (Нуар наёмником не является).</p>\n<p>Других версий нет — обсуждение персонажа занимает шесть сообщений одного дня.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "PS-0103-S05", "PS-0103--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имени нет.</li>\n<li>Происхождение не описано.</li>\n<li>Характер не описан.</li>\n<li>Механика барьера и исцеления не раскрыта, ограничений и цены не названо.</li>\n<li>Какого цвета глаза — не названо, сказано только «разные».</li>\n<li>Дальнейшая судьба персонажа не обсуждалась: что с ним стало, в переписке не сказано.</li>\n<li>Соотношение помощника, Имитатора и Нуара не проговорено; кто обозначен словом «солнышко», осталось нерешённым.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0103--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0104.html\">Нуар</a>, <a href=\"PS-0383.html\">Имитатор</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0029.html\">Отряд Имитатора времён 8-летней войны</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0103--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-03</td>\n<td>194833–194838</td>\n<td>w0041</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0103-pomoschnik-imitatora.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0103--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0103.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
