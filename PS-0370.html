<script>const BASE="";const DOCNAME="Изб";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0370-S01", "PS-0370--proishozhdenie"], "h": "<p>Изб появляется 2026-06-02 (id 487006–487008) сразу в списке из трёх персонажей, которых Слава собирался разобрать: «Итак у меня есть три персонажа которых надо разобрать / Граф / Нуар / Изб». Разбор в тот день начался с Нуара, до Изб очередь дошла позже.</p>\n<p>Замысел персонажа Слава описал так (2026-06-02, id 487017): «Как зародился Изб. Я просто хотел создать летающего персонажа. Который чаще всего будет летать, а не стоять. А потом я запихнул его в Столпы героев. И поэтому ему нужно было добавить ещё способность, дабы он не выглядит ущербно из-за Графа и Нуара». То есть исходная задумка — один только полёт, а остальные способности добавлены после того, как персонаж попал в состав шести столпов героев, чтобы он не проигрывал на фоне Графа и Нуара.</p>\n<p>Имя — сокращение. Миколай переспросил про него 2026-06-02 (id 487042–487045): «прям Изб?» — «Ну типа Избранные», «Изб». Варианты написания, встречающиеся в переписке: «Избранные», «изб», «изба».</p>\n<p>На вопрос Миколая «не описал но чувствуешь что есть ещё что-то? или при встрече хочешь» (id 487046) Слава ответил «Чувствую» (id 487048) — то есть на 2026-06-02 автор считал персонажа неописанным до конца.</p>", "r": []}, {"t": "Характер", "a": ["S02", "PS-0370-S02", "PS-0370--harakter"], "h": "<p>Состояние на 2026-06-02 (id 487020): «Его слабость это то что он ещё новичок и он юноша. Он хочет стать героем который видел по телевизору. Ему нравится когда его боготворят. Но он плохо переносит критику из-за не опытности. И у него серая мораль в которое он верит».</p>\n<p>Короткая сводка характеров в тот же день (id 487021) ставит его рядом с Графом: «Граф высокомерный и часто раздражённые из-за боли в голове. Изб новичок который стремится к идеалами».</p>\n<p>Серая мораль расписана через пример — инцидент с вирусом, распылённым Нимбом (2026-06-02, id 487020). В центре города, где множество людей, обычные люди начинают превращаться в чудовищ — «Не всё примерно 20 людей из тысячи». Изб таранит всех превратившихся своим телом, то есть «принял радикальное решение убить всех перевоплощенных людей». Слава отдельно оговаривает, что «данные способ нельзя назвать неправильным»: если бы он начал их обезвреживать, это заняло бы долго и «Множество людей умрут».</p>\n<p>Отдельно зафиксирована деталь про улыбку: «Он таранил их своим телом улыбаясь. И не потому что ему это нравилось, а потому что для него героя тот кто всегда улыбается».</p>\n<p>Последствие: «После этого инцидента было множество критики в сторону Изб. Что ментально на нём сказалось. Он ещё юноша и новичок. Хотя и имеет сильнейшую способность».</p>\n<p>Ещё одна формулировка о его устойчивости — 2026-06-03 (id 487514), в перечислении причин, почему тот или иной герой не стал лицом ассоциации: «Изб не устойчив».</p>\n<p>2026-06-14 (id 489826–489840) в переписке идёт кусок, который к характеру относится неоднозначно. Миколай спрашивает «это изб?» (id 489826), Слава отвечает подряд: «Высокомерный», «Эго его больше всего мира», «Он ленивыц», «Подросток», «Что не понимает ценности чего либо», «И он мой любимый персонаж» (id 489827–489832). Затем, через несколько сообщений, Слава пишет: «Не изб идеалист и его идеалы в итоге падут» (id 489840) и следом про Бэма: «А бэм думающий что весь мир вертится вокруг него. Его идеалы никогда не падут» (id 489846). Кому именно адресовано перечисление «высокомерный / ленивый / подросток» — Изб или Бэму — в переписке не разъяснено; ответ «Не изб идеалист» стоит после него, но прямо это не проговорено.</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0370-S03", "PS-0370--sposobnosti"], "h": "<p>Основные способности перечислены 2026-06-02 (id 487018) списком из трёх пунктов.</p>\n<p><strong>Полёт.</strong> «Он способен летать. И у него всегда есть точка опоры в полете. Поэтому он всегда бьёт в полную силу даже в полете. Даже он способен себ зафиксировать в одной точки. И сдвинуть его нереально».</p>\n<p><strong>Неуязвимость.</strong> «Он достаточно часто прошибает собой каких нибудь злодеев, монстров, неудачных экспериментов Нимба и т. Д. И при этом остаётся без царапинки». С оговоркой автора о том, как он прокручивает истории: «Ну в моё фантазии где я как бы кручу историю. У него так и не разу не пошла кровь».</p>\n<p><strong>Сверхчеловеческая сила.</strong> «Он способен поднимать многотонный конструкции. Он способен двигаться с такое скоростью что может прошибать своих противников. Он одним ударом способен рассеить облака».</p>\n<p>Уточнение природы неуязвимости появилось только 2026-06-14 (id 489573): «И изб неуязвим из-за мерцание у него никогда не пойдёт кровь. Но синики и переломы и внутренние повреждения могут быть. Но крови никогда, это из-за того что он идеологически думает, что у героя не будет идти кровь». То есть неуязвимость на этой дате перестала быть полной: она сведена к отсутствию крови и объяснена через Мерцание и через его собственное идеологическое представление о герое.</p>\n<p>При этом в тексте от 2026-06-02 про него сказано, что он «имеет сильнейшую способность» (id 487020).</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0370-S04", "PS-0370--svyazi-s-drugimi"], "h": "<p><strong>Граф и Нуар.</strong> Заданы как мерка, под которую Изб дособирали: способности добавлялись, «дабы он не выглядит ущербно из-за Графа и Нуара» (id 487017). В сводке характеров он противопоставлен Графу (id 487021).</p>\n<p><strong>Шесть столпов героев.</strong> Изб входит в столпы героев — именно попадание туда потребовало добавить ему способностей (id 487017). В инциденте с дырой 2026-06-07 (id 488439) названо, что «Там вообще всё столпы участвовали».</p>\n<p><strong>Праведник.</strong> Герой, назначенный лицом ассоциации 2026-06-03 (id 487514). В том же сообщении: «В инциденте Изб. Он спасёт его от злодея. А после на глазах всех людей будет давить и ломать кости злодея». Праведник стал лицом ассоциации в том числе потому, что «он устойчив», а Изб — «не устойчив».</p>\n<p><strong>Ассоциация и её лицо.</strong> Изб — один из тех, кого рассматривали, но кто лицом ассоциации не стал. Рядом с ним в том же перечне (id 487514): Граф — «часто раздражённый», Нуар — «просто не хотел светиться, и напоминать людям о том что ИС такое сильные», Святая дева — конкурировала за роль и проиграла, «Не хватило голосов».</p>\n<p><strong>Нимб.</strong> Источник вируса в инциденте, из-за которого люди превращаются в чудовищ (id 487020), и организация, чьи «неудачные эксперименты» Изб прошибает собой (id 487018).</p>\n<p><strong>Инцидент с дырой (2026-06-07, id 488439).</strong> Доима, дочь Имета, открыла артефактом путь из мира фантазёра в центр города и со своей группой защищала фантазёра, державшего дыру открытой. Изб участвовал наравне с остальными столпами: «Там и Изб летал, спасал людей и бился с разными чудовищами. И праведник был, и Клед с графом». В том же эпизоде названы Нуар (его тьма накрыла радиус 3 км) и Карен.</p>\n<p><strong>Бэм.</strong> Противопоставлен Изб 2026-06-14 (id 489840–489846): Изб — идеалист, чьи идеалы в итоге падут; Бэм — «думающий что весь мир вертится вокруг него. Его идеалы никогда не падут». Слава добавил: «Это я как бог заявляю» (id 489847). На вопрос Миколая «а он будет в этой вселенной?» про Бэма ответ — «Конечно» (id 489849–489851).</p>\n<p><strong>Зана (<a href=\"PS-0379.html\">Зана</a>).</strong> 2026-06-17 (id 491162) в разборе Заны упомянуто падение Изб: «Кстати ему не понравилось падения изб, он посчитал что слишком рано и что слишком быстро подослали злодей не дав насладиться эмоциями Изб». То есть падение Изб к этой дате уже существует как событие, но само оно в переписке не расписано.</p>", "r": [["Зана", "PS-0379.html"]]}, {"t": "Как менялся", "a": ["S05", "PS-0370-S05", "PS-0370--kak-menyalsya"], "h": "<p><strong>2026-06-02, id 487006–487008.</strong> Введён в список персонажей на разбор вместе с Графом и Нуаром. Собственного содержания в этот момент в переписке ещё нет.</p>\n<p><strong>2026-06-02, id 487017–487018.</strong> Изложено происхождение замысла (летающий персонаж, дособранный под уровень столпов) и три основные способности: полёт, неуязвимость, сверхчеловеческая сила. Неуязвимость на этой дате — без оговорок: «остаётся без царапинки», крови не было ни разу.</p>\n<p><strong>2026-06-02, id 487020–487021.</strong> Добавлены слабость (новичок и юноша), зависимость от признания, непереносимость критики, серая мораль; расписан инцидент с вирусом Нимба и его ментальные последствия.</p>\n<p><strong>2026-06-02, id 487042–487048.</strong> Расшифровано имя — от «Избранные». Автор отмечает, что персонаж описан не до конца.</p>\n<p><strong>2026-06-03, id 487514–487516.</strong> Изб не становится лицом ассоциации — причина «не устойчив». В инциденте его спасает Праведник.</p>\n<p><strong>2026-06-07, id 488439.</strong> Участвует в инциденте с дырой: летает, спасает людей, бьётся с чудовищами.</p>\n<p><strong>2026-06-14, id 489571.</strong> «Кстати гг теперь Изб» — назначен главным героем. До этой даты статус главного героя за ним в переписке не закреплялся.</p>\n<p><strong>2026-06-14, id 489573.</strong> Неуязвимость переописана: она идёт от Мерцания, кровь не пойдёт никогда, но «синики и переломы и внутренние повреждения могут быть». Прежнее состояние («остаётся без царапинки») этим не отменено словами автора, но сужено.</p>\n<p><strong>2026-06-14, id 489826–489846.</strong> Противопоставление Бэму: Изб — идеалист, чьи идеалы в итоге падут.</p>\n<p><strong>2026-06-17, id 491162.</strong> Извне, из разбора Заны, приходит указание, что падение Изб уже произошло и что Зану не устроило, как оно было устроено.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S06", "PS-0370-S06", "PS-0370--chto-s-nim-stalo"], "h": "<p>На 2026-06-14 (id 489571) — главный герой вселенной. Про дальнейшее сказано только одно, и сказано как утверждение автора: «Не изб идеалист и его идеалы в итоге падут» (id 489840), с пометкой «Это я как бог заявляю» (id 489847).</p>\n<p>Отдельно, из разбора Заны 2026-06-17 (id 491162), известно, что падение Изб произошло, что к нему «подослали злодей» и что Зана счёл это «слишком рано» и «слишком быстро». Кто именно был подослан, чем падение кончилось и в каком состоянии Изб после него — в переписке не сказано.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0370-S07", "PS-0370--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Внешность не описана вообще: ни возраст цифрой, ни лицо, ни костюм, ни цвета. Есть только «юноша», «новичок» и (в неоднозначном куске 2026-06-14) «Подросток».</li>\n<li>Вселенная в окнах ни разу не названа; принадлежность проставлена по дате объявления.</li>\n<li>Не сказано, кому относится перечисление «Высокомерный / Эго его больше всего мира / Он ленивыц / Подросток / Что не понимает ценности чего либо» (id 489827–489832) — Изб или Бэму.</li>\n<li>Мерцание как механика в разбираемых кусках не объяснено: сказано только, что неуязвимость Изб идёт «из-за мерцание».</li>\n<li>Само падение Изб («Слом Изб») в переписке не расписано — оно упоминается только задним числом в разборе Заны.</li>\n<li>Фан-база Изб и «Влияние на реальность» числятся среди связанных с ним тем, но материала по ним в разобранных кусках нет.</li>\n<li>Инцидент с вирусом Нимба дан как пример его морали; отдельно как событие с датой, местом и последствиями он не развёрнут.</li>\n<li>Состав шести столпов героев целиком не назван: перечислены Граф, Нуар, Изб, Праведник, Клед, упомянута Святая дева, претендовавшая на место столпа.</li>\n<li>Как соотносятся между собой ранняя формулировка «остаётся без царапинки» и поздняя «синики и переломы и внутренние повреждения могут быть» — отдельно не оговорено.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0370--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0379.html\">Зана</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0104.html\">Нуар</a>, <a href=\"PS-0379.html\">Зана</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0370--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-06-02</td>\n<td>487006–487008</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-02</td>\n<td>487017–487018</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-02</td>\n<td>487020–487021</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-02</td>\n<td>487042–487048</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-03</td>\n<td>487514–487516</td>\n<td>w0121</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-07</td>\n<td>488439–488440</td>\n<td>w0121</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-14</td>\n<td>489571–489584</td>\n<td>w0121</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-14</td>\n<td>489826–489851</td>\n<td>w0121</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0370-izb.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0370--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0370.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
