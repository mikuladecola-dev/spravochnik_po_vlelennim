<script>const BASE="";const DOCNAME="Тварь из пещеры";
const LEAD="<p>Существо без имени, живущее в пещере в горе, рядом с которой работает бригада лесорубов. В переписке названий у него нет — авторы зовут его «нечто», «оно», «тварь», «чёрная собака». Материал охватывает 2025-05-02 — 2025-05-15, окна w0089 и w0094; версии 1–3 объявлены по вселенной Нимб, версия 4 — по вселенной Апостол.</p>";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0265-S01", "PS-0265--proishozhdenie"], "h": "<p>Природа и происхождение тварей в переписке не объяснены — это прямо помечено в записи как неясность окна w0089.</p>\n<p>Известно только место: пещера в горе. Пещера описана рассказчиком как «маленькая, тесная и темная», с постоянным звуком падающей капли. Существо там уже находится, когда бригада заходит внутрь; откуда оно там взялось, не сказано.</p>\n<p>Особь не одна. После того как бригада забила первую тварь, «со стороны горы» раздался рёв — «Не один их было множество. Десятки если не сотни тварей там кричала». Сколько их на самом деле и что они делают в горе — не сказано.</p>\n<p>15 мая (id 326310–326314) Миколай задал автору прямой вопрос о роли фармацевтической компании — «Это эксперименты, биологическое оружие или они „пылесосят аномалии“?» — и Слава ответил одним словом: «Биологическая оружия». Прямая связь этого ответа с происхождением самой твари в переписке не проговорена: сказано только о роли компании.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0265-S02", "PS-0265--vneshnost"], "h": "<p>Полное описание дано дважды одним и тем же текстом — в версии 2 (2025-05-02, id 323369) и в версии 3 как «фрагмент 18» (2025-05-07, id 324215):</p>\n<div class=\"q\"><p>«Это было четырех ногая ходячая тварь. Больше всего она смахивала на большую чёрную худую собаку. Но имеет некоторый странности. Это тело и лапы чём-то походили на человеческий. Не спрашивайте чем. Я сам не знаю. Я как то на по сознательном уровней понял сходство. Но было у неё ещё одна странность. Еë голова. Не как у собаки морда вытянутая. Но дальше со лба да самого носа лезвия, как бы вам это сказать. Представьте топор и эту острую часть сняли с топора и нацепили на морду собаки. Только у неё это видимо родной.»</p></div>\n<p>Отдельные черты, как они названы:</p>\n<ul>\n<li>четвероногая, ходячая, чёрная, худая, размером с большую собаку;</li>\n<li>тело и лапы «чём-то походили на человеческий», чем именно — рассказчик объяснить не может, понял «на по сознательном уровней»;</li>\n<li>вместо морды — лезвие ото лба до самого носа, как снятая с топора острая часть; для твари это «видимо родной»;</li>\n<li>голова названа «худая, чёрная бошка»;</li>\n<li>крови у неё нет. После попадания в бок «крови не пошла. Что-то только черная, как смола течь начала». После выстрела в голову «Лишь слегка разлетелась та жижа в нём и все».</li>\n</ul>\n<p>В темноте пещеры она не видна целиком: бригада различает только «движения чёрном на черном». Тоха, заметивший её первым, описать не может — «То тьма, то нога, то тень, какая тень во тьме».</p>\n<p>Звук описан отдельно от вида. В первой встрече (id 323366): «Это словно рёв зверя и человека который только что понял, что оказался в ситуаций хуже смерти. Жалостный но страшный рев пронеся по пещере». Во второй раз (фрагмент 17, id 324214) тот же звук назван так: «Я услышал рев. Тот самый, рев, который и не рев вообще».</p>\n<p>Род существа в тексте не выдержан: рассказчик пишет о нём то в женском, то в мужском, то в среднем роде («она смахивала», «он повернулся ко мне», «оно было злой»).</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Как развивалось — не материал авторов</b>\n<p>2 мая, первый заход: существо не показано вообще — «движения чёрном на черном», крик, бегство. 2 мая, второй заход в тот же день: показано целиком, с топором вместо морды, с чёрной смолой, с полным описанием на абзац. 7 мая: то же описание повторено дословно, слово в слово, уже как цитата в разборе. 15 мая, на прямой вопрос, показывать ли внешность целиком или оставить «чем меньше знаем, тем страшнее», — ответ «Чем меньше». Ограничение поставлено через тринадцать дней после того, как показали, и к уже написанному не применено: версии 2 и 3 остались как есть. Заявили намёком — раскрыли полностью — повторили дословно — задним числом ограничили.</p></div>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0265-S03", "PS-0265--harakter"], "h": "<p>Отдельного характера у существа не прописано, есть только поведение в сцене.</p>\n<ul>\n<li>Реагирует на то, что её увидели: «Поняв, что еë заметили, как заголосила».</li>\n<li>Преследует. По пещере рёв «за нами гнался», рассказчик, бежавший последним, «всё ощущал дыхания в спину».</li>\n<li>Атакует со спины: Тоху ударила в спину лезвием.</li>\n<li>После убийства Тохи бросилась не к ближайшему человеку (рассказчик стоял в шаге), а «к толпе».</li>\n<li>Способна сообразить, как достать добычу: «тварь то это к сожалению оказалось умный. Тоже на капот прыгнул и на крышу лезть».</li>\n<li>Отвечает на злость: по дереву, где сидел рассказчик, «било куда сильнее нежели в той дерево, где висел Миша» — «Оно было злой».</li>\n<li>Переключается на того, кто привлекает внимание: когда бригадир спрыгнул с дерева, «с матюками» побежал к другому и махал руками, тварь пошла за ним.</li>\n</ul>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0265-S04", "PS-0265--sposobnosti"], "h": "<p><strong>Лезвие вместо морды.</strong> Рубит им деревья и людей. «Тварь это своим лбом буквально рубит деревья, как почти что мы. Только сильнее быстрее и вертикально». Дерево «очень легко подавалось»; по дереву рассказчика она била, пока «в створе дерева уже появилась отверстия». Тем же лезвием она вонзилась в спину Тохи — «И вот этим топором она вонзилась в спину Тохи. Глупо вонзилась тварь то поганая». Удар оказался смертельным: пульс рассказчик нащупать не смог.</p>\n<p><strong>Сила рывка.</strong> Прыжок, нацеленный в спину, пришёлся вскользь в руку и «Разрывая плоть и ломая кости. Она вывихнула мне руку. И содрала с неë коже с плотью».</p>\n<p><strong>Прыжки и подвижность.</strong> Запрыгивает на капот и на крышу машины, обходит машину со стороны багажника, перепрыгивает через пригнувшегося человека.</p>\n<p><strong>Устойчивость к огнестрелу.</strong> Попадание из двустволки ровно в бок: «Та аш отлетела. Но не сдохла». Выстрел в голову в упор: «эффекта, как фильмах виде взрыва головы не было». Два одновременных попадания с двух двустволок: «Тварь то получив с двух двухстволок отлетала аж до другого дерева. Но всё ещё была жива».</p>\n<p><strong>Живучесть.</strong> Забитая палками и подручным до состояния, когда «от неё осталось лишь мокрая места», она была ещё жива, при переломанных костях.</p>\n<p><strong>Предсмертный крик.</strong> «Лишь издала крик настолько сильный, что мы всё по закрывали уши и на землю попадали. И ней дай бог она дальше бы крича. Мы бы точно там все бы оглохли бы».</p>\n<p><strong>Уязвимости</strong> (найдены в бою Игорем, который спрыгнул с дерева прямо на тварь и подломил ей колени): «Оказывается без разгона она не столь страшна. И если держать его голову на виду то справиться с ним будет достаточно легко».</p>\n<p><strong>Выход за пределы пещеры.</strong> Бригада предполагала обратное — «Тогда не думали, что тварь то та вылезет из пещеры. Подумали, что не может она покинуть пещеру» — и предположение оказалось неверным: тварь напала уже в лагере.</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0265-S05", "PS-0265--svyazi-s-drugimi"], "h": "<p><strong>Тоха</strong> — навигатор бригады, шедший первым. Дважды первым замечает существо: в пещере («там что-то двигается») и во время ночного дежурства, когда «весь день глазел в пещеру», отшатнулся и побежал. Убит ударом лезвия в спину в лагере. Похороны оплатила фармацевтическая компания.</p>\n<p><strong>Иван (Иван Васильевич)</strong> — рассказчик, ведёт весь текст от первого лица. В первой встрече бежал последним, получил ветку в плечо. Во второй сцене стоял рядом с Тохой в момент удара, был на мгновение ослеплён его кровью, стрелял твари в голову из ружья Тохи, убегал по машине, получил разорванную руку. Руку впоследствии ампутировали.</p>\n<p><strong>Бригадир</strong> — 50-летний, поначалу объясняет случившееся рационально: «вы серьёзно зверька кого-то испугались. Туда наверняка какая нибудь белка залезла или лиса»; потом допускает пранкера или застрявшего человека и вызывает службы. В бою спрыгивает с дерева и уводит тварь от рассказчика.</p>\n<p><strong>Михаил (Мишка)</strong> — единственный, кто в начале второй сцены не побежал, а прицелился и выстрелил в бок. После бесполезности выстрела выбросил двустволку и залез на дерево. Рассказчик о нём: «Мишка всё же оклеветал я тебя за зря. Зря говорил что он не способен дать сдачи».</p>\n<p><strong>Игорь</strong> — в первой встрече бежал впереди и вывел бригаду к выходу, потом остался сидеть на дереве и сбивчиво пересказывал случившееся бригадиру. Во второй сцене спрыгнул с дерева прямо на тварь и подломил ей колени, чем открыл её уязвимость.</p>\n<p><strong>Бригада в целом</strong> — после первой встречи: трое тяжело пострадали (вспоротая до кости нога, вылетевшая из сустава рука, предположительно сломанная ключица), относительно целыми бригадир насчитал четверых. Затем бригаде выдали две законные двустволки, по одному ружью на дежурную группу у пещеры и на лагерь; дежурили по часу парами — «Я и Тоха. И Игорь с Михаилом», поскольку Игорь и Миша дали «категорический отказ» дежурить поодиночке (id 324214).</p>\n<p><strong>Фармацевтическая компания</strong> — появляется после звонка в полицию. Полиция «за всерьёз не восприняли сначала», но перезвонила уже компания, приехала лично ко всем, взяла показания и дала подписать бумагу о неразглашении. Выплатила моральные — «как мои 6 зарплат», оплатила похороны Тохи и медицинские расходы. Свои препараты не дала: «Да нет всё знают, что их ней препараты могут и конечность отрастить. Но они решили не тратить на нас это. Поэтому мне и ампутировали руку». 15 мая роль компании названа автором словом «Биологическая оружия».</p>\n<p><strong>Полиция и МЧС</strong> — вызваны бригадиром, прибыть могли только на следующий день: «Тайна все же. Удачей будет если в радиусе 100км есть населённый пункты». Указание, полученное бригадиром по телефону: «больше не спускаться в пещеру и не искать возможного затерявшего туриста».</p>", "r": []}, {"t": "Как менялся", "a": ["S06", "PS-0265-S06", "PS-0265--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2025-05-02 (окно w0089, id 323366–323367).</strong> Первое появление. Существо не показано: во тьме различимо только «движения чёрном на черном», после чего оно кричит и гонит бригаду из пещеры наружу. Всё, что о нём известно на этой стадии, — крик («словно рёв зверя и человека») и то, что оно преследует. Дальше сцена уходит в последствия: скатывание по крутому склону, травмы, разговор с бригадиром, версии про белку, лису, человека, пранкера, звонок в службы.</p>\n<p>Внутри этой версии есть расхождение, оставленное как есть: сначала сказано, что бег координировал Тоха («Благо Тоха протолкнуться вперёд всех и начал координировать наш в бег»), затем — «Не могу нарадоваться что Игорь первый бежал. Он нас быстро к выходу вывел».</p>\n<p><strong>Версия 2 — 2025-05-02 (окно w0089, id 323369–323370).</strong> Тварь показана целиком и в бою. В этой версии появляются: полное описание внешности, удар лезвием в спину Тохи, чёрная смола вместо крови, бесполезность выстрелов, рубка деревьев лбом, погоня вокруг машины, разорванная рука рассказчика, спасение бригадиром, находка Игоря про колени и голову, коллективное забивание, предсмертный крик, глушащий людей. Финал версии: рёв «Десятки если не сотни тварей» со стороны горы и отъезд бригады без новых потерь. Дальше — фармацевтическая компания, неразглашение, ампутация.</p>\n<p><strong>Версия 3 — 2025-05-07 (окно w0094, id 324214–324215).</strong> Тот же материал в виде фрагментов с разбором. Добавлено то, чего не было в версиях 1–2: раздача двух законных двустволок, деление оружия по группам, часовые дежурства парами, отказ Игоря и Миши дежурить поодиночке, ночное дежурство Ивана с Тохой. Появляется вторая встреча — Тоха отшатывается от пещеры, оба бегут, Иван слышит «рев, который и не рев вообще», и оба забывают, что вооружены: «Позабыв, что мы вообще то вооруженные. Просто как то из головы вылетела». В лагере они смеются над собой в уверенности, что тварь не может покинуть пещеру, — и тварь бьёт Тоху в спину. Описание внешности в фрагменте 18 повторено дословно из версии 2.</p>\n<p><strong>Версия 4 — 2025-05-15 (окно w0094, id 326310–326315).</strong> Не сцена, а установка. Миколай задал автору пять вопросов, Слава ответил на четыре:</p>\n<ul>\n<li>роль фарм-корпорации — «Биологическая оружия»;</li>\n<li>цель истории — «Напугать»;</li>\n<li>судьба Ивана после событий — «На свободе но параноит»;</li>\n<li>показывать ли внешность существа целиком или оставить «чем меньше знаем, тем страшнее» — «Чем меньше».</li>\n</ul>\n<p>То есть на 15 мая внешность решено целиком не раскрывать, хотя в версиях 2 и 3 полное описание уже дано. Версии не сведены между собой.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0265-S07", "PS-0265--chto-s-nim-stalo"], "h": "<p>Одна особь убита. Последовательность: Игорь подломил ей колени → «мужики скопом накинулись на тварь», били палками и подручным «до изнеможении» → от неё «осталось лишь мокрая места», но она была ещё жива → издала предсмертный крик → «прекратила орать и вообще прекратила подавать, какие либо признаки жизни».</p>\n<p>Остальные не тронуты и остались в горе — на смерть первой они отозвались рёвом в количестве «Десятки если не сотни». Что было дальше с ними, в переписке не сказано.</p>\n<p>Тело убитой твари в тексте больше не упоминается: забрала ли его приехавшая фармацевтическая компания — не сказано.</p>", "r": []}, {"t": "Отклонённые и опровергнутые версии", "a": ["S08", "PS-0265-S08", "PS-0265--otklonennye-i-oprovergnutye-versii"], "h": "<p>Это версии самих героев, а не авторские правки, — фиксируются как часть текста.</p>\n<ul>\n<li>Бригадир: «Туда наверняка какая нибудь белка залезла или лиса»; затем «это человек был наверное», «Может пранкер какой», либо кто-то застрял и потерялся — тогда «надо вызывать МЧС и скорую возможно и полицию». Опровергнуто второй сценой.</li>\n<li>Бригада: тварь не может покинуть пещеру. Прямо названо ошибкой в фрагменте 18.</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S09", "PS-0265-S09", "PS-0265--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Природа и происхождение тварей не объяснены (помечено в самой записи, окно w0089).</li>\n<li>Связь твари с фармацевтической компанией прямо не названа. Сказано только, что роль компании — «Биологическая оружия», и что она скупила молчание бригады.</li>\n<li>Чем именно тело и лапы похожи на человеческие — не сказано: «Не спрашивайте чем. Я сам не знаю».</li>\n<li>Точное число тварей в горе не названо — «Десятки если не сотни».</li>\n<li>Собственного имени у существа нет; в переписке оно проходит как «нечто», «оно», «тварь», «чёрная собака».</li>\n<li>Что делает тварь в пещере, чем питается, откуда лезвие — не сказано.</li>\n<li>Из пяти вопросов 15 мая один остался без ответа: про приём «$не допустила модерация$» (мета-шутка над цензурой или замазанное досье внутри мира). Слава ответил только на четыре.</li>\n<li>Финальное сообщение окна (id 326315, 2025-05-15) — ссылка на codepen без пояснения; что там, в переписке не сказано.</li>\n<li>Как соотнести решение «Чем меньше» (2025-05-15) с уже написанными полными описаниями внешности (2025-05-02, 2025-05-07) — осталось нерешённым.</li>\n<li>Судьба остальных членов бригады после подписки о неразглашении не прослежена; из финала известно только про рассказчика — руку ампутировали, он «На свободе но параноит».</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0265--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0073.html\">Бригада лесорубов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0265--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-05-02</td>\n<td>323366–323367</td>\n<td>w0089</td>\n<td>Нимб (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-05-02</td>\n<td>323369–323370</td>\n<td>w0089</td>\n<td>Нимб (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-05-07</td>\n<td>324214–324215</td>\n<td>w0094</td>\n<td>Нимб (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-05-15</td>\n<td>326310–326315</td>\n<td>w0094</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0265-tvar-iz-peschery.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0265--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0265.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0265-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0265/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Считать здесь по счётчику ссылок бесполезно: во всём кусте лесорубов входящих ноль у всех записей без исключения. Не потому, что куст никому не нужен, а потому, что кроме этой статьи и <code>PS-0261</code> его в справочнике никто не держит. Цена дыры видна по другому числу — по объёму базы, на который нет статьи.</p>\n<p>Первое — вселенная. <code>MR-0132</code> «Нимб»: база 88 701, статьи нет. <code>VS-0006</code> «Нимб» как вселенная: база 21 285, статьи нет. Статья стоит в двух вселенных, и у той, по которой проходят три её четыре версии, в справочнике нет ни строки. Туда же упирается и главная содержательная дыра — «связь твари с фармацевтической компанией прямо не названа»: в <code>MR-0132</code> эта организация описана как фармкомпания с заводами, больницами и аптеками, которая параллельно ловит аномальные объекты и ставит опыты над людьми. Описана 8 апреля, за три недели до пещеры.</p>\n<p>Второе — то, из чего компания делает препараты. <code>SP-0221</code> «Препараты Нимба»: база 5 182, статьи нет. Там прямым текстом: препараты делаются на крови и биологических жидкостях пойманных объектов, лечат вплоть до отращивания конечностей, отдельно есть контракт с армией на усиливающие. Реплика Ивана «их препараты могут и конечность отрастить» — это не догадка героя, а уже записанное правило, только записанное в другом месте. Рядом <code>PS-0256</code> «Черныши» (1 864, статьи нет) и <code>PS-0255</code> «Медуза» (3 965, статьи нет) — те самые объекты, которых ловят и из которых делают сырьё. Совпадают ли черныши с тварью, в переписке не сказано; но проверять это надо там.</p>\n<p>Третье, самое дешёвое: <code>MR-0135</code> «Фармацевтическая компания» — статья есть, но всего 6 460 при одной ссылке, и она одна держит ответ «Биологическая оружия». Пока <code>MR-0135</code> и <code>MR-0132</code> не сведены, ответ 15 мая висит на записи в шесть тысяч знаков, а восемьдесят восемь тысяч про ту же организацию лежат отдельно и без статьи.</p>\n<h3>С чего начать</h3>\n<p>В архив идти почти не за чем — всё в базе, и не в соседних записях, а в соседнем месяце.</p>\n<ul>\n<li>Происхождение и хозяин: <code>MR-0132</code>, окно w0087, 2025-04-08 — id 317146–317258 (организация разворачивается), 317403–317474 (апокалипсис отменён, «есть только нимб и объекты»). <code>SP-0221</code> — id 317244–317249. <code>PS-0256</code> и <code>PS-0255</code> — то же окно.</li>\n<li>Разбор по фрагментам разъехался по четырём окнам, а в источниках стоит только последнее. Нарезка прошла по паузам в ноль часов: w0091 (323801–324188), w0092 (324189–324200), w0093 (324201–324210), w0094 (324211–324215). Всё, что сказано про тварь до фрагмента 17 — включая описание чёрной смолы, погоню вокруг машины и разрыв руки, — лежит в 324189–324210 и в справочник не попало. <code>PR-0075</code> это прямо отмечает: «фрагменты 1-12 — в предыдущем окне».</li>\n<li>Два окна чтения не подключены вовсе: <code>IS-0054</code> (w0090, 323575–323583, 3–4 мая, база 16 917, статьи нет) и <code>IS-0056</code> (w0091, 323801–323808, 5–7 мая, база 6 422, статьи нет). Если по ходу чтения спрашивали про природу твари, то там.</li>\n<li>В архив — за двумя мелочами того же дня: пятый вопрос про «$не допустила модерация$» и id 326315 со ссылкой на codepen. Окно w0094 кончается на 326365, то есть после этой ссылки прошло ещё полсотни сообщений — смотреть их.</li>\n</ul>\n<h3>Как развивалось</h3>\n<p>2 мая, первый заход: существо не показано вообще — «движения чёрном на черном», крик, бегство. 2 мая, второй заход в тот же день: показано целиком, с топором вместо морды, с чёрной смолой, с полным описанием на абзац. 7 мая: то же описание повторено дословно, слово в слово, уже как цитата в разборе. 15 мая, на прямой вопрос, показывать ли внешность целиком или оставить «чем меньше знаем, тем страшнее», — ответ «Чем меньше». Ограничение поставлено через тринадцать дней после того, как показали, и к уже написанному не применено: версии 2 и 3 остались как есть. Заявили намёком — раскрыли полностью — повторили дословно — задним числом ограничили.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для одной особи правила прописаны с редкой точностью: что не берёт (дробь в бок, выстрел в голову в упор, дуплет с двух стволов), что берёт (подломленные колени, голова на виду, отсутствие разгона), сколько она держится после того, как ей переломали все кости. Это работающая, проверенная в сцене механика.</p>\n<p>Для остальных того же вида правил нет ни одного. Их «десятки если не сотни», они отозвались рёвом на смерть первой — и не вышли. Почему не вышли, что их держит в горе, действует ли на них то же, что подействовало на первую, — не поставлено. При этом текст сам же снял предположение «не может покинуть пещеру» и назвал его ошибкой. Правило выхода наружу опровергнуто для одной твари и не сформулировано для остальных.</p>\n<h3>Отклик</h3>\n<p>Топор вместо морды — вещь, которую хочется запомнить, и работает она не описанием, а тем, как рассказчик до неё доходит: «Представьте топор и эту острую часть сняли с топора и нацепили на морду собаки. Только у неё это видимо родной.» Последнее слово тут главное. Но сильнее другое место — там, где он честно упирается: «Это тело и лапы чём-то походили на человеческий. Не спрашивайте чем. Я сам не знаю. Я как то на по сознательном уровней понял сходство.» Отказ объяснить сходство сделал больше, чем сделало бы объяснение.</p>\n<p>И ещё зацепило, что род существа плавает по всему тексту — «она смахивала», «он повернулся ко мне», «оно было злой» — и это не выправлено. Читается не как небрежность, а как то, что человек не знает, чем это назвать. Отдельно хорош звук: «Тот самый, рев, который и не рев вообще». Полстроки, и понятно, что имеется в виду, хотя объяснено не было ничего.</p></div>", "r": []}];</script>
