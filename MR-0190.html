<script>const BASE="";const DOCNAME="Ледяной мир";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0190-S01", "MR-0190--ustroystvo"], "h": "<p>Застывший замороженный мир. Второе название, данное в переписке, — «ледяной ад» (2026-02-16, id 433473). Ад здесь не оценка мира, а то, чем он должен был бы быть для попавшего: герой «не идентифицирует как ад, ад для него дар» — прохлада после летнего пекла. Раем мир при этом тоже не является: «но это не рай, рай другое. рай это другие».</p>\n<p>Мир статичен и обращён к герою как собеседник: «он ходит и разговаривает с застывшим миром».</p>\n<p>Взаимодействие с веществом мира описано отдельно и подробно:</p>\n<ul>\n<li>«касаясь ничего не происходит» — простое прикосновение не даёт эффекта;</li>\n<li>«но сильно взаимодействуя он согревает что-то, но выходит резко, не равномерно» — согревание срабатывает скачком, а не постепенно;</li>\n<li>следствие неравномерности: «рука например тает, но все остальное замороженное, он тянет и отрывает и всё в кровяке». То есть оттаявшая часть тела остаётся вмёрзшей в неоттаявшее окружение, и отделение происходит с разрывом.</li>\n</ul>\n<p>Предполагаемое (в переписке подано как «возможно») развитие: герой пробует согреть целую территорию — «будет стараться типа а потом такой а зачем мне это». После отказа от этой затеи он «просто замёрзнет, надолго замёрзнет полностью во льдах».</p>\n<p>Выход из мира привязан к плакучей иве: «потом когда ива вытянется на него упадут почи солнца он проснётся». Ива же и была входом — она «особое место, она исполнила его мечту».</p>\n<p>В том же сообщении записана отдельная реплика про кровь и кровлю: «густая кровь течёт по кровле. может именно из за этого она так называется? кровля». Связь этой реплики с ледяным миром в переписке не проговорена.</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0190-S02", "MR-0190--naselenie"], "h": "<p>Других людей в мире нет. В навигационной записи это сформулировано так: рай — это другие люди, «а здесь их нет». Единственный названный обитатель на время действия — попавший туда герой. Никакие существа, животные или иные фигуры мира не названы.</p>\n<p>При этом герой не одинок в смысле привязанностей: «ведь в обычном мире у него есть близкие которые его ждут к которым он хочет какие то планы».</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0190-S03", "MR-0190--mesto-vo-vselennoy"], "h": "<p>Мир входит в историю про ледяной ад — он назван частью этой истории. Связан также с плакучей ивой (место входа и выхода) и с согреванием застывшего мира (механика взаимодействия).</p>\n<p>Попадание в мир идёт из обычного летнего мира: «летом жарко гг бухает, обливается алкоголем, хочет охладиться, уснул под плакучей ивой». Смерть героя под ивой как объяснение перехода была рассмотрена и отброшена — «сдох? нет ну это скучно».</p>\n<p>Вселенная в самой переписке не названа; отнесение к Иссекаю сделано по дате объявления.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0190-S04", "MR-0190--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2026-02-16 (окно w0117, id 433471–433474).</strong> Единственная версия. Мир описан целиком в одном сообщении Миколая (id 433473), внутри плана истории: устройство, отношение героя к миру, противопоставление ад/рай через людей, механика согревания, замерзание и пробуждение.</p>\n<p>Тем же сообщением заданы требования к сцене входа — к тому, как показать летнюю жару, из которой герой попадает в мир (нумерация авторская):</p>\n<ol>\n<li>«надо показать как жарко летом»</li>\n<li>«именно показать от лица персонажа»</li>\n<li>«нужно использовать алкоголь с умом»</li>\n<li>«скорее всего у персонажа частный дом и он там какой нибудь сарай чинил, умаялся»</li>\n<li>«возможно его жёстко пилила жена тёща кто то такое»</li>\n<li>«так же довело дилемма которую он не мог решить видимо так же связанное с сараем и тем что он в нем делает»</li>\n<li>«кстати очень круто я подметил алкоголь и его горячительные свойства»</li>\n<li>«на улице итак жарко, а он ещё сосуды расширяет»</li>\n<li>«ужасно противно, страшно»</li>\n<li>«он ещё и без футболки, солнце палит, кожа с высохшим потом, красная»</li>\n</ol>\n<p>Отдельно зафиксирован общий принцип, с которого начат разбор: «у текста должна быть идея».</p>\n<h3>Отброшенное и неутверждённое</h3>\n<ul>\n<li>Смерть героя под ивой как механизм перехода — отброшено: «сдох? нет ну это скучно».</li>\n<li>Финал в виде рекламы туристических билетов: «вот почему зимой все летят в тёплые страны, а летом на Антарктиду не летают. я так хорошо отдохнул. покупайте билеты». Тут же оговорка автора: «насчёт рекламы я не уверен». Решение не принято.</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0190-S05", "MR-0190--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вселенная в переписке не названа (отмечено и в самой записи, окно w0117).</li>\n<li>Как именно ива «исполнила его мечту» и почему она «особое место» — не объяснено.</li>\n<li>Что представляет собой мир географически — размеры, ландшафт, есть ли границы — не сказано.</li>\n<li>С чем именно «разговаривает» застывший мир и отвечает ли он — не сказано.</li>\n<li>Что было заморожено до прихода героя (был ли это чей-то живой мир) — не сказано.</li>\n<li>Порог «сильного взаимодействия», отличающий его от касания, не описан.</li>\n<li>Сколько длится «надолго замёрзнет» и что происходит с героем в это время — не сказано.</li>\n<li>Возвращается ли герой к близким и планам, о которых помнил, — за пределами реплики про билеты не сказано.</li>\n<li>Финал с рекламой остался нерешённым.</li>\n<li>В окне звучит реплика Славы «А я ведь купился с этими облаками» (id 433472) — о каких облаках речь и относятся ли они к этому миру, из переписки не следует.</li>\n<li>Связь реплики про кровь и кровлю с миром не проговорена.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0190--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0005.html\">Иссекай</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0190--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-02-16</td>\n<td>433471–433474</td>\n<td>w0117</td>\n<td>Иссекай (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0190-ledyanoy-mir.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0190--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0190.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
