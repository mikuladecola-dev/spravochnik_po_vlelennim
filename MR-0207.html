<script>const BASE="";const DOCNAME="Килька";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0207-S01", "MR-0207--ustroystvo"], "h": "<p>Килька — первый мир. В базе она проходит как персонаж (вид: персонаж), но во всех зафиксированных версиях переписки речь идёт о мире; в самой базе к окну w0099 стоит пометка, что «в чате есть более раннее употребление имени \"Килька\" как персонажа — здесь это название мира». Поэтому статья написана по материалу о мире.</p>\n<p>Имя пишется по-разному от сообщения к сообщению: килька, кильке, кильки, кильку, килькв. Кроме собственного имени в переписке она называется «наш мир» и «первый мир».</p>\n<h3>Появление и порядок миров</h3>\n<p>Развёрнутое изложение основы дано 2025-03-18 (id 305116–305117), внутри рассказа от лица нового агента: «В начале всего было ничего. Потом появился первый мир \"Килька\". И да это наш мир. А потом начали появляться другие миры. И в каждом этом мире был свой бог. Его называют Правителем. И вот эти миры появляются и по сей день. И между всеми мирами есть некая связь. Но у всех это связь более крепкая с \" Килькой\" С первом миром.»</p>\n<p>То же со стороны Правителей — 2025-05-31 (id 331635): Правители «не физические существа появившиеся в нигде и в ни чем. Они первыми, что появилось в пустоте. И именно они начали создавать мир. По своему желанию.( между всеми мирами есть связь, которую не может оборвать не один правитель)». «Первым правителем был правитель кильке. Вторым же был правитель рая. Поэтому их мир в разы больше миров других правителей.» То есть Килька — мир первого правителя, и она вместе с Раем относится к мирам, которые «в разы больше» остальных.</p>\n<p>Второй мир — Рай, «появившийся после кильке» (id 305856, 2025-03-19). В истории технологически развитого мира (id 305854) выдвинута теория, что все нападения на миры «были устроены из Рая. Второго мира, который появился после Кильке» — с оговоркой «Хотя это опять же не точно. Лишь теория. Без стопроцентных фактов».</p>\n<h3>Закон невыхода</h3>\n<p>Самая устойчивая черта Кильки, проговорённая в переписке несколько раз с марта по октябрь 2025 года: из неё нельзя выйти.</p>\n<p>Первая фиксация — 2025-03-06 (id 298855–298864). Разговор начался с вопроса Миколая, может ли там быть «последняя битва»; прямого ответа на этот вопрос в окне нет, вместо него Слава формулирует закон: «В нашем мире / Не кто из кильке не может, не покинуть его пока не умрёт». Миколай перебирает исключения — «благословенные?», «трещины?» — Слава отвечает «И» и затем: «Я же говорил это факт не кто, кто уже попал в кильку не сможет еë покинуть, не как и никто». То есть закон распространяется и на благословенных, и на попавших сюда извне, а не только на уроженцев.</p>\n<p>В изложении агента (id 305117, 2025-03-18) это же сказано короче: «И самым главным фактом для меня был, то что мы субъекты первого мира. Не модем его пикинуть. Ну вот никак. Ну вот чужемирцы попадають нам за раз плюнуть.»</p>\n<p>В версии от 2025-05-31 (id 331635) правило встроено в общий список: «Любое существо может покинуть свой мир если будет знать способ. Но всё существа кильке не способны покинуть свой мир. Не каким либо образом.»</p>\n<p>Единственное исключение, названное 2025-03-06 (id 298864): «Есть только аномалий, но они в кильке» — то есть выход не наружу, а внутрь аномалии, которая сама остаётся частью Кильки.</p>\n<p>Отдельно — рассказ технологически развитого мира (id 305854, 2025-03-19), где житель говорит: «И что существа других миров. Спообны покидать свой. И мы также можем покинуть свой. Но зачем?» Это про их мир, не про Кильку; ограничение на выход у них не действует, ограничением является только отсутствие смысла уходить.</p>\n<h3>Как в Кильку попадают извне</h3>\n<p>Версия от 2025-03-18 (id 305117) — три способа, которыми чужемирцы попадают сюда:</p>\n<ol>\n<li>«достигнуть границы своего мира. Часто этот способ используют в маленьких мирах, который только недавно образовались. Опять же относительно \"кильке\"»;</li>\n<li>«спомощью ритуал, как с нашей стороны, как и с их ней» — рассказчик добавляет, что про ритуал ему «не рассказали по понятном причинам»;</li>\n<li>«самый редкий. Когда правитель сам тебя отправляет в другой мир».</li>\n</ol>\n<p>Версия от 2025-05-31 (id 331635) — тот же список, переписанный как способы покинуть свой мир вообще, с добавленным четвёртым пунктом и с объяснением, почему выброс идёт именно в Кильку:</p>\n<ul>\n<li>«С помощью ритуала???» (три знака вопроса стоят в исходнике — ритуал не доработан);</li>\n<li>«Можно дойти до края мира, если ваш мир маленький или средний. И прыгнув за край мир вас перенесёт в другой мир. ( чаще всего килькв. Так как существа, что покидають свой мир. Неосознанно перемещаться по связи, а связь с килькой у каждого другого мира сильная)»;</li>\n<li>«Можно попасть в пространственную аномалию»;</li>\n<li>«Вас может выкинуть сам правитель ( очень очень очень, крайне редко)».</li>\n</ul>\n<p>Механизм притяжения, таким образом, объяснён через связь: связь всех миров с Килькой сильнее, чем между собой, покинувшее свой мир существо перемещается по связи неосознанно и потому чаще всего оказывается здесь.</p>\n<p>2025-03-20 (id 306109–306114) Миколай уточняет: «а, то есть и в между мирами могут перемещаться? не обязательно в кильку типа» — Слава отвечает «Да» и добавляет «Я же говорил». То есть Килька — самый частый, но не единственный пункт назначения.</p>\n<p>Средством перехода в тексте истории выступает чёрная дымка: упыря тянет в неё в момент гибели его мира (id 305854–305855), и из неё же в Кильке появляются двое существ, ангел и упырь (id 305856).</p>\n<h3>Аномалии внутри Кильки</h3>\n<p>Определение дано 2025-03-06 (id 298865–298872), причём как напоминание — Миколай признаётся, что забыл, и что помнит «чет другое». Слава: «Аномалий это мир, который образовался внутри Кильке и конечно правитель кильке не позволяет ему расти». Пример назван тут же: «То бишь озера перерождения».</p>\n<p>Таким образом, внутри Кильки существует отдельный мир-аномалия, ограничиваемый в росте её собственным правителем, и попадание в аномалию — единственная названная в переписке форма ухода из Кильки, которая при этом остаётся внутри неё.</p>\n<p>Пространственная аномалия отдельно указана как один из способов межмирового перехода вообще (id 331635). Совпадают ли «аномалия — мир внутри Кильки» и «пространственная аномалия» из списка способов — в переписке не сказано.</p>\n<h3>Благословение как свойство Кильки</h3>\n<p>Ограничение по месту жительства названо дважды и обоими соавторами не оспорено.</p>\n<p>2025-03-19 (id 305856), объяснение имитатора защитнику: «Благословения можеть получать только разумный житель кильке. Первого мира. Не знаю точно с чем это связано. Но это просто факт.» Там же — устройство самого благословения: правитель другого мира устанавливает связь с существом и через неё передаёт силу; связь ставится на мозг, поэтому после использования болит голова; у благословенных есть «предохранитель в голове», который «при случаи выгорания мозгов отключает благословенния».</p>\n<p>2025-05-31 (id 331635), в общей сводке по Правителям: «Правители способны давать благословение. То есть настраивать связь с существом живущими в мире ( благословения даётся только существами живущими в кильке).» Оговорка «в кильке» стоит в скобках прямо внутри общей формулировки, из-за чего в том же предложении соседствуют «существом живущими в мире» и ограничение на Кильку.</p>\n<p>Килька здесь оказывается не просто первым, а единственным миром, где вообще возможны благословенные — включая апостолов, благословлённых правителем Рая. Почему так — «Не знаю точно с чем это связано. Но это просто факт».</p>\n<h3>Масштаб и физическая сторона</h3>\n<p>2025-03-20 (id 306122–306123) Миколай спрашивает: «какое у них соотношение земли к суши? у Земли например воды явно больше суши». Слава: «Как у нас».</p>\n<p>2025-05-31 (id 331649–331657) Миколай выстраивает масштаб: «то есть если килька это вселенная, там есть миллион галактик, у галактики миллион солнечных систем у солнечной системы от 1 до 50 планет, на планете например земля относительно среднего или даже небольшого размера 6-7 материков, так вот это существо может уничтожить Евразию». Слава поправляет не масштаб Кильки, а масштаб протобионтов: «Я подразумевал существ среднего и малого мира. А вот из нашего то он вполне солнечную систему разрушит». Прямого подтверждения, что Килька — именно вселенная с миллионом галактик, в ответе нет; подтверждено только то, что протобионт Кильки разрушит солнечную систему, тогда как протобионт малого или среднего мира — континент. На вопрос «а, у любого правителя есть пробионты» ответ — «Ну да наверное».</p>\n<p>В истории с расколовшимся солнцем (id 305854) приведены точные числа — расстояние от солнца до земли 149 597 870 700 метров, осколки прошли его за 3 минуты 36 секунд, скорость 694 444,44 км/с, поражено 78% суши и 12% воды, выжило 17% людей — но это цифры того технологически развитого мира, а не Кильки.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Отклик — не материал авторов</b>\n<p>Больше всего зацепило имя. Мир, который первый, самый большой и из которого нельзя выйти, называется Килька — и когда Слава на это натыкается, реакция честная: «Из всех имён Килька?», «Я бы заржал». И имя не меняют. Оно остаётся, и через два месяца в своде правил, написанном уже сухим справочным тоном, стоит «связь с килькой у каждого другого мира сильная» — и это работает лучше любого торжественного названия, потому что читается как то, как этот мир зовут внутри, а не как его назвали бы в мифе. Второе — сама фигура закона: за всё время его ни разу не объяснили и, кажется, не собирались. «Не знаю точно с чем это связано. Но это просто факт» — и про благословение, и про невыход. Мир, устройство которого известно его жителям ровно в объёме служебной инструкции, и дальше инструкции никто не лезет. И третье, совсем мелкое, но не отпускает: единственный выход отсюда — в аномалию, которая находится здесь же. Из мира без выхода можно уйти только вглубь него.</p></div>", "r": []}, {"t": "Население", "a": ["S02", "MR-0207-S02", "MR-0207--naselenie"], "h": "<p>Килька — «наш мир», мир соавторов, населённый обычными людьми; в её пределах действуют структуры и категории, названные в переписке.</p>\n<p><strong>Агенты.</strong> Организация, вербующая людей после столкновения с чужемирцами (id 305116, 2025-03-18). Порядок вербовки: вербовщик предлагает выбор из двух путей — «Первый я подхожу тебя к остановки и ты едешь домой. Забыв обо всём этом и живя обычной жизнью. Второй- ты становишься агентом и сразаешься с подобными тварями»; затем звонок, три дня на окончательный ответ, лагерь на шесть месяцев «под тренировкам и впитыванием информации». Рассказчик отучился три недели из-за идеальной физической формы. Названо ограничение: «Каждый агент может быть куратором только для 10 людей», и в наборе рассказчика было десять человек. Поимённо упомянуты Михаил Саакашвили (звонивший) и куратор Михаил с кодовым прозвищем «Медведь» — «По два метра ростом, в плечах почти также. Везде мыщцы и суровым лицом богатыря. Ходил он в кожанном плаще и был суров, но справедливым». Запись рассказчика с изложением основы «Через 7 минут эта запись была удалена Михаилом. А его отправитель был наказан».</p>\n<p><strong>Апостолы.</strong> 21 человек, получивший благословение от правителя Рая (id 305856, 331635). Действуют в Кильке: имитатор и защитник ждут появления чужемирца, называя время «Где-то в 21:00-21:30».</p>\n<p><strong>Благословенные.</strong> Существуют только здесь (см. выше). Средняя продолжительность жизни после получения благословения — 10 лет (id 331635).</p>\n<p><strong>Арбетары.</strong> 2025-05-31 (id 331636): «Арбетары и Альфа это одни те же существа. Но в первом случае это люди из кильке, а во втором это чужемирцы.» То есть арбетар определён именно через происхождение из Кильки: существо, «насильственно вырвали кусок силы своего мира», поселившее его в себе и заставившее выделять силу.</p>\n<p><strong>Чужемирцы.</strong> Существа, покинувшие свой мир, попадающие сюда чаще всего. Характеристика от 2025-03-18 (id 305116): «Чаще всего из-за того, что их ней миры суший ад. Или желанием захвата других миров. Ну грубо говоря почти всё чужемирцы жестокие психи. Для которых убийства это обыденная дело.»</p>\n<p><strong>Пришедшие из погибших миров.</strong> 2025-03-18 (id 305396–305401) Миколай спрашивает: «чел на которого ебнулось солнце придёт в кильку?» — Слава: «Да», «В конце его истории он попал в кильку». Речь о герое-упыре из технологически развитого мира; он влетает в чёрную дымку вместе с ангелом, и в Кильке (id 305856) из дымки выходят двое, ангел и упырь, вместо ожидавшегося одного чужемирца. Битву с ними принимает имитатор, оттолкнув защитника.</p>\n<p><strong>Протобионты.</strong> Дети правителей (id 331635). Килькой они не ограничены — они есть у правителей вообще, — но протобионт Кильки выделен по силе: «из нашего то он вполне солнечную систему разрушит» (id 331655).</p>\n<p>Отдельно в базе к Кильке привязаны Гении, Раса, связанная с ангелами, и Рай — как связанные сущности; их отношение к населению Кильки в приведённых кусках переписки не раскрыто.</p>", "r": []}, {"t": "Место во вселенной — как связана с другими мирами", "a": ["S03", "MR-0207-S03", "MR-0207--mesto-vo-vselennoy"], "h": "<p>Килька — точка отсчёта всей системы миров. Три положения повторяются во всех версиях:</p>\n<ol>\n<li>Она первая. Остальные миры появились после и появляются «по сей день» (id 305116).</li>\n<li>Связь есть между всеми мирами, «которую не может оборвать не один правитель», но с Килькой связь у каждого мира сильнее, чем с любым другим (id 305116, 331635).</li>\n<li>Из-за силы этой связи выброшенные из своих миров существа попадают чаще всего именно сюда, а сами жители Кильки не выходят никуда и никогда.</li>\n</ol>\n<p>Размер миров привязан к порядку появления: миры первого и второго правителя (Килька и Рай) «в разы больше миров других правителей» (id 331635). Малые и средние миры отсчитываются «Опять же относительно \"кильке\"» (id 305117) — то есть Килька служит и единицей измерения.</p>\n<p>Отношения с Раем: Рай — второй мир; апостолы — благословенные правителя Рая, живущие в Кильке; в истории погибшего технологического мира высказана теория, что нападения на миры организованы из Рая, и там же предположение, что зараза, породившая упырей, — «зараза из рая. Или это попытка правителя спасти людей. Не знаю».</p>", "r": []}, {"t": "Как менялась по версиям", "a": ["S04", "MR-0207-S04", "MR-0207--kak-menyalas-po-versiyam"], "h": "<p><strong>2025-03-06, окно w0079 (id 298855–298864).</strong> Повторное проговаривание закона невыхода; уточнено, что закон действует и на благословенных, и на «трещины», и что единственное исключение — аномалии, но они внутри Кильки.</p>\n<p><strong>2025-03-06, окно w0079 (id 298865–298872).</strong> Определение аномалии как мира, образовавшегося внутри Кильки, рост которого не позволяет правитель Кильки; пример — озеро перерождения.</p>\n<p><strong>2025-03-18, окно w0082 (id 305116–305117).</strong> Первое развёрнутое изложение основы мироздания внутри художественного текста: ничто → Килька → остальные миры; Правители; связь миров; чужемирцы и три способа попадания; невозможность для жителей Кильки покинуть мир. Рассказчик перечисляет, о чём ещё не сказал: «альфа, апостолы, благословенный, силы зверя, классификация, арбетары, аномалия, существа и так далее».</p>\n<p><strong>2025-03-18, окно w0082 (id 305359–305368).</strong> Не сюжетная, а внешняя фиксация: Миколай рассказал про устройство миров знакомой девушке на качелях — «у нас есть несколько миров, главный называется Килька, есть и другие». Реакция Славы на имя: «Из всех имён Килька?» и «Я бы заржал». Имя при этом не изменено.</p>\n<p><strong>2025-03-18, окно w0082 (id 305396–305401).</strong> Подтверждено, что герой другой истории, на которого упало солнце, в конце своей истории попадает в Кильку. Сшивка двух историй через Кильку как общий пункт назначения.</p>\n<p><strong>2025-03-19, окно w0083 (id 305854–305856).</strong> Килька показана изнутри истории: пролог о погибшем технологическом мире, где Килька названа первым миром, а Рай — вторым, и объяснение имитатора защитнику уже в самой Кильке. Здесь впервые сказано, что благословение может получать только разумный житель Кильки, и что связь миров обрывочная и нестабильная — технологический мир мог получать лишь «обрывки информации» и «не до конца поняли принцип связи».</p>\n<p><strong>2025-03-20, окно w0083 (id 306109–306125).</strong> Уточнение: перемещаться можно между любыми мирами, не обязательно в Кильку. Соотношение суши и воды — «Как у нас». Миколай отмечает своё отношение к материалу: «не люблю фантастику», «так хочется все равно объяснить это физически», Слава: «Так всё мои рассказы это фантастика».</p>\n<p><strong>2025-03-30, окно w0086 (id 314479–314485) — снятая версия.</strong> Миколай приписывает Кильке набор свойств: «килька родилась 80 миллиардов лет назад», «она поглощает существ из других миров», «и в ней всё равно всё стремиться к хаосу». Слава отклоняет атрибуцию дважды: «Это не килька» и «Это другая вселенная». Миколай соглашается. Таким образом, возраст 80 миллиардов лет, поглощение существ и стремление к хаосу к Кильке не относятся — это свойства другого, не названного объекта из другой вселенной. Из какой именно — в окне не сказано.</p>\n<p><strong>2025-05-31, окно w0099 (id 331635–331636).</strong> Свод правил в виде справки, а не рассказа. Килька здесь — мир первого правителя. Список способов покинуть мир расширен до четырёх (добавлена пространственная аномалия), объяснён механизм притяжения через силу связи, закон невыхода дан в окончательной формулировке, ограничение благословения Килькой перенесено из реплики персонажа в правило. Здесь же арбетары определены как «люди из кильке» в отличие от альф-чужемирцев. В том же сообщении изложены разделы, относящиеся к другим сущностям, — Правители, Протобионты, устройство благословения, апостолы, фантазёры, артефакты и артефакты с символикой.</p>\n<p><strong>2025-05-31, окно w0099 (id 331649–331657).</strong> Обсуждение масштаба: предположение Миколая о Кильке как вселенной с миллионом галактик и поправка Славы о протобионтах малых и средних миров против протобионта «из нашего».</p>\n<p><strong>2025-10-18, окно w0106 (id 375843–375852).</strong> Текст свода от 2025-05-31 воспроизведён дословно — Миколай собрал по нему набросок страницы на codepen «это только по одному твоему сообщению». Слава: «Очень круто», «Делай так». Нового о Кильке в окне не появилось; изменение здесь — форма подачи материала, не содержание.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0207-S05", "MR-0207--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вопрос, с которого началась первая фиксация, — «то есть там битвы быть не может последней?» (id 298855) — остался без прямого ответа; вместо ответа сформулирован закон невыхода.</li>\n<li>Ритуал перехода между мирами не доработан. В версии 2025-03-18 рассказчик говорит, что ему «не рассказали по понятном причинам»; в версии 2025-05-31 в самом списке стоит «С помощью ритуала???», а про ритуал арбетаров — «(с помощью ритуала??? Которой я ещё не доработал)».</li>\n<li>Почему благословение возможно только для жителей Кильки — не объяснено: «Не знаю точно с чем это связано. Но это просто факт».</li>\n<li>Совпадают ли аномалия как мир внутри Кильки и пространственная аномалия из списка способов перехода — в переписке не сказано.</li>\n<li>Правитель Кильки упоминается только через свои действия (не даёт аномалии расти, первым появился в пустоте); отдельного описания у него в этих окнах нет.</li>\n<li>Является ли Килька вселенной с миллионом галактик — предположение Миколая (id 331649), прямого подтверждения в ответе Славы нет.</li>\n<li>«Трещины», названные Миколаем как возможное исключение из закона невыхода (id 298859), в дальнейшем не раскрыты.</li>\n<li>Отдельно вселенная для окна w0079 не объявлена — в чате это просто «наш мир»; в окне w0083 название вселенной не объявлено, Килька там мир внутри истории, а не имя вселенной; в окнах w0086 и w0106 принадлежность к вселенной неясна.</li>\n<li>Написание названия в чате плавает (килька, кильке, кильки, кильку, килькв); единая форма не выбрана.</li>\n<li>Классификация в базе: Килька числится персонажем, тогда как во всех приведённых кусках это мир; более раннее употребление имени как имени персонажа в этих окнах не приведено.</li>\n<li>Связанные сущности, перечисленные в базе, но не раскрытые в приведённых кусках применительно к Кильке: Гении, раса, связанная с ангелами, Рай как отдельный мир, классификация чужемирцев по видам способностей («У них там ещё разделения по видам способностей. Ну это скука об этом говорить»), силы зверя.</li>\n</ul></div>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Отдельно стоит снять один пункт из «Пробелов»: «Правитель Кильки упоминается только через свои действия... отдельного описания у него в этих окнах нет». Описание есть — <code>PS-0217</code> «Правитель Кильки», статья 17 189 знаков, 14 203 в базе, две ссылки. Пробел верен для перечисленных окон и неверен для справочника.</p></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0207--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в мирах:</strong> <a href=\"MR-0124.html\">Чёрная дымка</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0207--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-03-06</td>\n<td>298855–298864</td>\n<td>w0079</td>\n<td>Апостол (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2025-03-06</td>\n<td>298865–298872</td>\n<td>w0079</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-18</td>\n<td>305116–305117</td>\n<td>w0082</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-18</td>\n<td>305359–305368</td>\n<td>w0082</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-18</td>\n<td>305396–305401</td>\n<td>w0082</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-19</td>\n<td>305854–305856</td>\n<td>w0083</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-20</td>\n<td>306109–306125</td>\n<td>w0083</td>\n<td>вне вселенной (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-30</td>\n<td>314479–314485</td>\n<td>w0086</td>\n<td>неясно (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2025-05-31</td>\n<td>331635–331636</td>\n<td>w0099</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-05-31</td>\n<td>331649–331657</td>\n<td>w0099</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-08-30</td>\n<td>359684–359685</td>\n<td>w0103</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-10-18</td>\n<td>375843–375852</td>\n<td>w0106</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0207-kilka.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0207--primechaniya-i-popravki"], "h": "<p><em>Внесено вручную. При пересборке сохраняется; если противоречит переписке — показаны оба варианта.</em></p>\n<ul>\n<li><strong>Килька — это мир, а не вселенная.</strong> Уточнение Миколая: «Килька — это мир внутри одной из\n  версий вселенной про апостолов, а не имя вселенной и не синоним слова „апостол“».\n  В первой сборке базы метка «Килька» была сведена в название вселенной «Апостол» как синоним —\n  это <strong>снято</strong>. Теперь вселенная у версий Кильки определяется по дате объявления, а не по имени мира.</li>\n<li><strong>Автор.</strong> Кильку придумал Миколай.</li>\n<li><strong>«Килька», «Кильке», «Кильки» — склонения одного слова</strong>, а не разные написания и не разные\n  сущности. В первой сборке они разъехались на отдельные записи в персонажах; сведены в один мир.</li>\n<li><strong>Правитель Кильки</strong> — правитель мира под названием Килька, он принадлежит Кильке и поэтому\n  стоит рядом с ней. Отдельной сущностью-дублем не является: привязан к этому миру.</li>\n</ul>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["MR-0207-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/MR-0207/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Самое дорогое здесь не то, чего нет, а то, что есть дважды. Килька существует в справочнике под двумя записями: <code>MR-0207</code> (статья, 68 896 в базе, даты с 2025-03-06) и <code>MR-0093</code> «Вселенная (наш мир)» (статья, 12 112 в базе, 2025-01-06, три ссылки — больше, чем у самой Кильки). Это один и тот же объект до и после переименования: там он «наш мир, будем называть „Вселенной“», первый и самый большой, здесь он «наш мир», первый, единица измерения для всех остальных. Пока они стоят порознь, любая статья, которой нужен первый мир, ссылается на одну из двух половин наугад: на <code>MR-0093</code> смотрят <code>MR-0121</code> и <code>MR-0140</code>, на <code>MR-0207</code> — <code>PS-0217</code>, <code>PS-0179</code>, <code>PS-0198</code>, <code>PS-0199</code>, <code>PS-0231</code>, <code>PS-0233</code>, <code>PS-0280</code>, <code>PS-0215</code>, <code>PR-0061</code>.</p>\n<p>Второе — вселенная <code>VS-0013</code> «вне вселенной»: статьи нет, 15 911 знаков в базе. Килька числится по ней наравне с «Апостолом», и в шапке это прямо помечено — «статьи ещё нет». То есть половина принадлежности главного мира ведёт в запись, которой не существует.</p>\n<p>Третье, дешёвое: <code>MR-0130</code> «раса, связанная с ангелами» — статьи нет, 6 696 знаков, вселенная «неясно». Она стоит в списке привязанных к Кильке сущностей, и статья честно пишет, что её отношение к населению не раскрыто. Материал под ней есть, разбирать его никто не начинал.</p>\n<p>Отдельно стоит снять один пункт из «Пробелов»: «Правитель Кильки упоминается только через свои действия... отдельного описания у него в этих окнах нет». Описание есть — <code>PS-0217</code> «Правитель Кильки», статья 17 189 знаков, 14 203 в базе, две ссылки. Пробел верен для перечисленных окон и неверен для справочника.</p>\n<h3>С чего начать</h3>\n<p>В базе, и первым делом — стык января и марта. В <code>MR-0093</code> (2025-01-06, id 278852–279038) сказано, что правитель нашего мира «создала смерть которая таскает души в разный миры», и что смерть «после нашей кончины не даёт остаться в нашем мире». В <code>MR-0207</code> закон невыхода в первой же формулировке звучит как «Не кто из кильке не может, не покинуть его пока не умрёт» (id 298855–298864). Оба куска говорят про одно и то же место и про одно и то же событие — смерть как единственный выход, — и лежат в разных записях, никак не сведённые. Смотреть надо туда, до всякого архива.</p>\n<p>Второе — правило перехода тоже разъехалось надвое: <code>MR-0121</code> «Три способа перехода между мирами» (2025-03-18, статья, 4 234 в базе) и <code>MR-0140</code> «Способы покинуть свой мир» (2025-05-31, статья, четыре способа). Это две версии одного списка, разнесённые по двум записям; в статье о Кильке они пересказаны обе, но между собой не связаны.</p>\n<p>В архив идти стоит ровно за одним окном. В таблице источников стоит 2025-08-30, w0103, id 359684–359685 — а в разборе версий его нет: между сводом от 31 мая и оформлением от 18 октября в статье пусто. Два сообщения, три с половиной месяца, никем не прочитаны.</p>\n<h3>Как развивалось</h3>\n<p>6 марта закон объявлен — причём в ответ не на тот вопрос: Миколай спрашивает про последнюю битву, ответа на это нет, вместо него появляется «никто из Кильки не может её покинуть». Тут же закон обносится оговорками: и благословенные, и попавшие извне, и трещины — все под него, исключение одно, и оно внутрь. 18 марта то же самое пересказывается изнутри художественного текста как основа мироздания. 19 марта добавляется, что и благословение возможно только здесь. 20 марта правило ослабляется с другой стороны: перемещаться можно между любыми мирами, Килька — самый частый, но не единственный адрес. 30 марта Слава отклоняет чужую атрибуцию — «Это не килька», «Это другая вселенная», — и Миколай соглашается. Дальше два месяца тишины, 31 мая всё это переписано уже не рассказом, а справкой, с четвёртым способом и с объяснением, почему тянет именно сюда. Потом полгода, и 18 октября текст справки возвращается дословно — но возвращается как вёрстка на codepen: «Очень круто», «Делай так». Заявили в ответ на другой вопрос, обвели ограничениями, отклонили лишнее, свели в свод, вернулись за оформлением.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Про того, кто даёт благословение, правило названо с одной стороны и не названо с другой. Имитатор объясняет: «Правитель другого мира устанавливает с тобой связь и через эту связь даёт тебе силу», и отдельно — «Благословения можеть получать только разумный житель кильке». Получатель определён жёстко, и определён через Кильку. Даритель определён только как «правитель другого мира» — а Килька, по всей остальной конструкции, тоже мир, и у неё тоже есть свой правитель, который в статье действует (не даёт аномалии расти) и первым появился в пустоте. Может ли правитель Кильки благословить жителя Кильки — то есть работает ли эта связь внутри одного мира, — не проговорено ни разу, хотя ровно для этого мира правило про получателя написано отдельной строкой.</p>\n<h3>Отклик</h3>\n<p>Больше всего зацепило имя. Мир, который первый, самый большой и из которого нельзя выйти, называется Килька — и когда Слава на это натыкается, реакция честная: «Из всех имён Килька?», «Я бы заржал». И имя не меняют. Оно остаётся, и через два месяца в своде правил, написанном уже сухим справочным тоном, стоит «связь с килькой у каждого другого мира сильная» — и это работает лучше любого торжественного названия, потому что читается как то, как этот мир зовут внутри, а не как его назвали бы в мифе. Второе — сама фигура закона: за всё время его ни разу не объяснили и, кажется, не собирались. «Не знаю точно с чем это связано. Но это просто факт» — и про благословение, и про невыход. Мир, устройство которого известно его жителям ровно в объёме служебной инструкции, и дальше инструкции никто не лезет. И третье, совсем мелкое, но не отпускает: единственный выход отсюда — в аномалию, которая находится здесь же. Из мира без выхода можно уйти только вглубь него.</p></div>", "r": []}];</script>
