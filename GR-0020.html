<script>const BASE="";const DOCNAME="Междумирцы";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0020-S01", "GR-0020--chto-eto"], "h": "<p>Собирательное название существ из других миров во вселенной «Апостол». В переписке это не оформленная группа с именами и не организация, а категория: набор персонажей, про которых сказано только то, что они пришли из других миров, и что их «где-то 7». Поимённого состава нет — вместо него в переписке разыграна загадка, которую Слава задаёт Миколаю: «Угадай кто из врагов чужамириц» (2025-01-24, id 284249). Ответ внутри переписки так и не дан.</p>\n<p>Слово в переписке пишется по-разному, и все написания относятся к одному и тому же: «междумирцов» (2025-01-22, id 283706), «чужемирцов» (2025-01-22, id 283728), «чужамириц» (2025-01-24, id 284249), «чудемириц» (2025-01-24, id 284280). Отождествление сделано прямо в тексте: Миколай переспрашивает «междумирцев?» (id 284290), Слава отвечает «Да» (id 284291).</p>\n<p>Первое появление — не как самостоятельной темы, а через того, кто их ненавидит. Слава описывает воплощение гнева (<a href=\"PS-0180.html\">Воплощение гнева</a>): «Принципиальному, прямолинейному и жестокому / Он воплощения гнева / Прототип защитника только молчиливова / Бэтмен с жестокостью и гневом / Тот кто да мозга костей ненавидит междумирцов» (2025-01-22, id 283706). То есть междумирцы вводятся как объект чужой ненависти, а не как собственная сущность.</p>\n<p>Про содержание самой категории Слава прямо говорит, что у него его нет: «За что карать его / Потому что ничего про них придумать не могу» (2025-01-22, id 283729–283730). Что именно означает «карать» и кого — его или их — в переписке не разъяснено.</p>", "r": [["Воплощение гнева", "PS-0180.html"]]}, {"t": "Состав", "a": ["S02", "GR-0020-S02", "GR-0020--sostav"], "h": "<p>Поимённого состава нет. Ни один междумирец не назван и не подтверждён, id за ними в плане группы не закреплены — список участников пуст.</p>\n<p>Есть только перечень кандидатов, названных Миколаем при отгадывании, и две вычеркнутые Славой позиции. Все имена берутся из блока «Враг» рабочего каталога Славы (Каталог: благословенные, враги, грехи, оружие, артефакты <em>(статьи ещё нет — <a href=\"kb/SL-0051-katalog-blagoslovennye-vragi-grehi-oruzhie-artefakty.html\">исходник</a>)</em>).</p>\n<p>Первая попытка (2025-01-24, id 284285–284286): Миколай называет «либо эльф либо доспехи», тут же снимает эльфа — «ой, не эльф». Слава отвечает, что круг шире: «Их там больше», «Где-то 7», «Не считал» (id 284287–284289).</p>\n<p>Вторая попытка, вечером того же дня (2025-01-24, id 284351–284363). Миколай сначала отказывается угадывать: «я не хочу гадать», «я не знаю как думать», «у меня нет предположений» (id 284353–284355), после чего всё же перечисляет: «насекомое, козлика, божество, зонтик», «пускай так», «и эльф ещё», «и доспехи» (id 284356–284359). Эльф, снятый утром, возвращён в список вечером.</p>\n<p>Реакция Славы на этот перечень (id 284361–284363): «Отсюда только зонтик убрать» и следом «И леший / Все».</p>\n<p>Таким образом после правки от перечисления Миколая остаются: насекомое, козлиха, божество, эльф, доспехи. Прямо междумирцами они не названы — Слава только сократил список, не подтвердив остаток.</p>\n<p>Отдельно: реплика «И леший / Все» относится к лешему, которого в перечислении Миколая не было. Что именно имеется в виду — что лешего тоже надо убрать из круга подозреваемых или что-то другое, — из текста однозначно не следует; в переписке это не оговорено.</p>\n<p>Количество тоже не сходится с перечнем: Слава называет «где-то 7» и добавляет «Не считал», а в оставшемся после вычёркиваний списке пять имён. Соответствие числа и списка в переписке не обсуждается.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Вторая по цене дыра — <code>SL-0051</code>. На каталог ссылаются шесть записей, статьи у него нет, в базе 9 834 знака. Это самая дорогая незакрытая позиция из всего, что касается этой группы: из блока «Враг» этого каталога берутся все имена, вокруг которых крутится загадка, и без статьи о каталоге состав междумирцев не на что положить. Рядом того же рода <code>SL-0053</code> (6 ссылок, статьи нет, 20 313 знаков базы) и <code>SL-0090</code> (4 ссылки, статьи нет, 5 492).</p></div>", "r": [["артефакты", "kb/SL-0051-katalog-blagoslovennye-vragi-grehi-oruzhie-artefakty.html"]]}, {"t": "Отношения с другими группами", "a": ["S03", "GR-0020-S03", "GR-0020--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>Воплощение гнева (<a href=\"PS-0180.html\">Воплощение гнева</a>).</strong> Единственная названная в переписке связь. Междумирцы — объект его ненависти: «Тот кто да мозга костей ненавидит междумирцов» (2025-01-22, id 283706). Через два часа Слава уточняет образ с их стороны: «Воплощений гнева / Непробиваемому чудовище / Страх всех чужемирцов / Способность скорость не подходит» (2025-01-22, id 283728). То есть отношение задано в обе стороны: он их ненавидит, они его боятся. Сам воплощение гнева проходит в каталоге по блоку «Благословенный» как «Защитник 🤬( ангел 👼)» (2025-01-24, id 284248).</p>\n<p><strong>Враги (блок каталога Каталог: благословенные, враги, грехи, оружие, артефакты <em>(статьи ещё нет — <a href=\"kb/SL-0051-katalog-blagoslovennye-vragi-grehi-oruzhie-artefakty.html\">исходник</a>)</em>).</strong> Междумирцы ищутся внутри списка врагов, а не рядом с ним: вопрос сформулирован как «Угадай кто из врагов чужамириц» (2025-01-24, id 284249) и повторён как «Угадай кто чудемириц / Из врагов» (id 284280–284281). На 2025-01-24 блок «Враг» состоит из: Доспехи 🏳️, Козлиха🪓, Сестра 🚺, Огненный снайпер🔥, Охотник 🔪, Божество😵, Убийца🩸, Зонтик🩸, Леший 🌳, Пар 💨, Садистка ✂️, Насекомое 😡, Старик ➡️⬅️, Эльф 🌬 (id 284278). Эльф в первой редакции каталога (id 284248) отсутствует и добавляется во второй.</p>\n<p>Совпадают ли множества «враги» и «междумирцы» полностью или междумирцы — только часть врагов, прямо не сказано; из формулировки «кто из врагов» следует, что это часть.</p>\n<p>Со списком благословенных и с семью грехами междумирцы в переписке никак не соотнесены.</p>\n<p>Степень проработки самих врагов Слава определяет так, отвечая на вопрос Миколая «а ты рил всех персов продумал? / ну которых написал»: «Ну только вид и способность и плюс минус характер» (2025-01-24, id 284364–284366).</p>", "r": [["артефакты", "kb/SL-0051-katalog-blagoslovennye-vragi-grehi-oruzhie-artefakty.html"], ["Воплощение гнева", "PS-0180.html"]]}, {"t": "Как менялась — по датам", "a": ["S04", "GR-0020-S04", "GR-0020--kak-menyalas"], "h": "<p><strong>2025-01-22 (id 283706).</strong> Появляются как «междумирцы» — те, кого воплощение гнева «да мозга костей ненавидит». Собственного описания нет.</p>\n<p><strong>2025-01-22, 10:05 (id 283728–283730).</strong> Второе упоминание, уже как «чужемирцы»: воплощение гнева — «Страх всех чужемирцов». Тут же Слава фиксирует, что наполнения у категории нет: «Потому что ничего про них придумать не могу».</p>\n<p><strong>2025-01-24, 10:32 (id 284249–284250).</strong> Категория превращается в загадку: «Угадай кто из врагов чужамириц». Миколай отвечает, что не может заняться этим сразу — он на уроке (id 284251, 284254), — но реагирует: «красиво кстати», «и пиздец интесно подумать» (id 284252–284253).</p>\n<p><strong>2025-01-24, 11:12 (id 284280–284281).</strong> Загадка повторена после выкладки второй редакции каталога: «Угадай кто чудемириц / Из врагов».</p>\n<p><strong>2025-01-24, 11:15–11:16 (id 284285–284291).</strong> Первый ответ Миколая: «либо эльф либо доспехи», сразу же «ой, не эльф». Слава задаёт масштаб: «Их там больше», «Где-то 7», «Не считал». Уточнение Миколая «междумирцев?» — «Да». Разговор прерывается: «ну в тогда дома подумаю а то я на урок иду меня убьют щас» (id 284292).</p>\n<p><strong>2025-01-24, 16:18–16:20 (id 284351–284363).</strong> Второй ответ. Перечень: насекомое, козлиха, божество, зонтик, эльф, доспехи. Правка Славы: убрать зонтика, реплика «И леший / Все». Миколай соглашается: «хорошо» (id 284362). Дальше разговор уходит на степень проработки персонажей.</p>\n<p>На этом линия обрывается. Дальнейших упоминаний междумирцев в источниках нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "GR-0020-S05", "GR-0020--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет. Ни один персонаж не назван междумирцем утвердительно — есть только предположения Миколая и вычёркивания Славы.</li>\n<li>Точный ответ на загадку внутри переписки не дан, осталось нерешённым.</li>\n<li>Число участников названо приблизительно и с оговоркой: «Где-то 7 / Не считал». Точное количество не установлено.</li>\n<li>Способностей, общих для междумирцев, в переписке нет — ни одной. Различий между ними тоже нет.</li>\n<li>Иерархии, устройства, главаря, внутренних отношений — не упоминается ничего.</li>\n<li>Не сказано, что такое «другие миры», откуда именно междумирцы приходят и как попадают в мир «Апостола».</li>\n<li>Не сказано, почему воплощение гнева их ненавидит; Слава прямо отмечает, что причины у него нет: «За что карать его / Потому что ничего про них придумать не могу».</li>\n<li>Не определено, совпадает ли круг междумирцев с блоком «Враг» каталога или составляет его часть; из формулировки вопроса следует второе, но прямо это не обсуждалось.</li>\n<li>Реплика «И леший / Все» не разъяснена: лешего в перечислении Миколая не было.</li>\n<li>Внешнего вида, поведения, языка, любых конкретных черт у категории нет.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0020--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0180.html\">Воплощение гнева</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0020--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0020.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0020-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0020/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым надо решить не загадку, а вопрос, существует ли эта группа отдельно от <code>GR-0019</code>. Статья сама фиксирует, что «междумирцы», «чужемирцов», «чужамириц», «чудемириц» — одно и то же, и что Слава это подтвердил прямым «Да». Слово «чужемирцы» при этом введено в переписке ещё раньше, 2025-01-06 (id 279029), и по нему собран отдельный узел с семью названными персонажами и определением. Пока это не разведено или не слито, статья о междумирцах остаётся категорией без единого признака рядом с категорией, у которой признаки есть.</p>\n<p>Вторая по цене дыра — <code>SL-0051</code>. На каталог ссылаются шесть записей, статьи у него нет, в базе 9 834 знака. Это самая дорогая незакрытая позиция из всего, что касается этой группы: из блока «Враг» этого каталога берутся все имена, вокруг которых крутится загадка, и без статьи о каталоге состав междумирцев не на что положить. Рядом того же рода <code>SL-0053</code> (6 ссылок, статьи нет, 20 313 знаков базы) и <code>SL-0090</code> (4 ссылки, статьи нет, 5 492).</p>\n<h3>С чего начать</h3>\n<p>В базе. <code>SL-0051</code> (2025-01-24, окно w0072, id 284248–284292) и поздние редакции того же перечня в <code>SL-0090</code> (2025-05-14, id 325798–325801) сверяются напрямую, и сверка уже даёт результат: в майской редакции блока «Враг» Зонтика нет, а Леший на месте. То есть вычёркивание зонтика до списка дошло, а реплика «И леший / Все» — нет. Это зацепка к тому, что она значила, и её можно проверить, не выходя из базы.</p>\n<p>За ответом на саму загадку в январь идти бесполезно: линия обрывается 2025-01-24 в 16:20 и больше не всплывает. Если ответ где-то есть, он там, где чужемирцы впервые получают вид и способность поимённо, — 2025-03-10 (id 300889–300892) и 2025-03-18 (id 305113–305117). Искать надо не слово «междумирец», а имена из оставшегося списка: насекомое, козлиха, божество, эльф, доспехи.</p>\n<h3>Как развивалось</h3>\n<p>2025-01-22 — заявили через чужую ненависть: категория появляется как то, что ненавидит воплощение гнева, собственного содержания нет. Через два часа того же дня сами и ограничили, причём напрямую: «Потому что ничего про них придумать не могу». 2025-01-24 — пустоту превратили в игру: «Угадай кто из врагов чужамириц», повторили после второй редакции каталога, задали масштаб «Где-то 7 / Не считал», вечером сократили перечень Миколая. И бросили в тот же вечер — дальнейших упоминаний нет.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>В этом же разговоре, через несколько сообщений после загадки, степень проработки объявлена для каталога целиком: «Ну только вид и способность и плюс минус характер». То есть по собственному правилу у каждого имени из блока «Враг» вид и способность есть. Междумирцы берутся ровно из этого блока — и ни у одного из пяти оставшихся кандидатов ни вид, ни способность в статье не названы. Правило проговорено для списка, из которого выделено подмножество, и к подмножеству не применено.</p>\n<h3>Отклик</h3>\n<p>Тут зацепило не то, что в остальных статьях. Материала почти нет, и статья честно оказывается статьёй не о междумирцах, а о том, как их не придумали. Реплика «За что карать его / Потому что ничего про них придумать не могу» стоит дорого: автор не стал заполнять пустоту чем попало, а отдал её второму в виде загадки — и загадка проработала два дня, дала «где-то 7», дала вычёркивания, и всё равно ничем не кончилась. Категория, у которой есть только то, что её кто-то ненавидит до мозга костей, — это нормальное рабочее состояние, а не провал; неприятно тут другое — что «И леший / Все» так и осталось непонятной репликой, и её уже, похоже, никто не помнит.</p></div>", "r": []}];</script>
