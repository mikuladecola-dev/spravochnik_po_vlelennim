<script>const BASE="";const DOCNAME="Группа на крыше (шесть спящих и рассказчик)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0087-S01", "GR-0087--chto-eto"], "h": "<p>Семь человек, очнувшихся на подстриженном газоне на крыше пятиэтажки в пустом городе — рассказчик и шесть спящих рядом с ним. Появляются в начале истории «Любимый город», написанной Славой тремя сообщениями подряд (2026-02-14, id 432538–432540).</p>\n<p>Организацией это не является: у людей на крыше нет ни общего имени, ни цели, ни договорённости между собой — они просто лежат рядом, и рассказчик видит их впервые. Словом «группа» они названы прямо в тексте, самим рассказчиком: «оставаться в группе, в которой я очнулся первым, и в которой я самый подозрительный, не лучшая идея». В разборе, который Миколай прислал 2026-02-16 (id 433174), они же названы «странная группа людей» — но эта формулировка принадлежит присланному тексту разбора, а не самому Миколаю в переписке.</p>\n<p>Как они там оказались и кто их туда принёс, в переписке не сказано. Рассказчик перебирает версии сам: «Прикольно приколист решил пьяных людей сюда притащить» — и тут же отбрасывает, потому что среди лежащих десятилетний мальчик. Второе его наблюдение: здание нежилое, «это кажись заброшка», и он выводит из этого — «Вряд ли бы нас кто на жилое здание поперл бы», то есть исходит из того, что их именно принесли. Кто и зачем — осталось нерешённым, продолжения истории в окне нет.</p>\n<p>Место действия описано отдельно (Пустой город, <a href=\"MN-0027.html\">Пустой город</a>): крыша пятиэтажки без бортиков, на ней газон, «строго постриженная, словно прическа солдата», и бетонное сооружение с железной дверью «Выход с крыши». Про отсутствие бортиков рассказчик замечает: «кто нибудь из этих спящих бедолаг в принципе мог перевернуться и выпасть».</p>", "r": [["Пустой город", "MN-0027.html"]]}, {"t": "Состав", "a": ["S02", "GR-0087-S02", "GR-0087--sostav"], "h": "<p>Всего на крыше семеро: рассказчик и шесть спящих.</p>\n<ul>\n<li><strong><a href=\"PS-0351.html\">Рассказчик «Любимого города»</a></strong> — рассказчик, безымянный. Имя не названо. Очнулся первым.</li>\n<li><strong><a href=\"PS-0352.html\">Жених</a></strong> — Жених, «мужчина средних лет с обручальным кольцом на пальце». Прозвище дал рассказчик уже позже, при встрече на лестнице: «Я сразу понял, что это за мужчина. Жених. Ну мужчина с обручальным кольцом». Очнулся вторым.</li>\n</ul>\n<p>Остальные пятеро перечислены одним списком и отдельных записей не имеют: «пацан лет десяти, ну и подросток. Также молодая женщина в отключки, старичок, да и девчуля подросток». Ни имён, ни прозвищ, ни отдельных реплик у них нет. В сумме рассказчик описывает лежащих как «шесть человек, старики и дети, женщины и мужчины».</p>\n<p>Общее впечатление от них дано одной фразой: «Идеальная команда для семейного конкурса. Всё такие ухоженные и единственный я белая ворона или как там говрилась?»</p>\n<p>Родственниками или знакомыми друг другу они нигде не названы. Сравнение с семейным конкурсом — про подбор по возрасту и полу и про ухоженный вид, а не про родство; никакой связи между шестерыми в переписке не установлено.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · С чего начать — не материал авторов</b>\n<p>В базе, и работа тут не поисковая, а сводная. Материал есть — свыше ста тысяч знаков на четыре записи, — но он разъехался по ним, и группа как целое не собрана ни в одной: состав перечислен в <code>IS-0086</code>, отличия рассказчика — в <code>PS-0351</code>, вся встреча на лестнице — в <code>PS-0352</code>, площадка и её размеры — в <code>MN-0027</code>. Пятеро без имён не попали отдельно никуда, они существуют строчкой перечисления внутри <code>IS-0086</code>.</p></div>", "r": [["Рассказчик «Любимого города»", "PS-0351.html"], ["Жених", "PS-0352.html"]]}, {"t": "Чем участники отличаются друг от друга", "a": ["S03", "GR-0087-S03", "GR-0087--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p>Внутри группы противопоставление одно и оно проходит по линии «рассказчик — все остальные».</p>\n<p>Все шестеро на момент пробуждения рассказчика без сознания: «десятилетнего мальчика, который, также как и остальные был в отключке». Рассказчик очнулся первым и это осознаёт как отдельную проблему — он «самый подозрительный», потому что он единственный, кто уже на ногах.</p>\n<p>Второе отличие — вид и состояние. Шестеро «всё такие ухоженные», рассказчик — «белая ворона»: с похмелья после ночной гулянки, в пыльных штанах, на которые он потом блюёт, с ломотой в теле и пересохшим горлом. Он же формулирует это по-своему: «мне мясоеду не место на зелёной лужайке».</p>\n<p>Собственная биография рассказчика дана в прологе: «У меня не было великих свершений. Было лишь пару горячительных напитков и интересные таблеточки, конечно и сигареты, как без них-то. Зато в азартные игры не играл, потому что чаще всего выигравал. Так же не был сердцеедом, потому что болела голова от попыток угодить другому человеку». При этом про себя он говорит «я всегда был везунчиком». Телефон у него «кирпич», геолокацию, по его рассуждению, не показывает.</p>\n<p>Действует рассказчик по правилу, которое сам называет «инстинкт трёх принципов „Бей, беги, замри“», и выбирает бег — сначала с крыши, потом от шагов на лестнице. Это же правило срабатывает у него второй раз, когда сверху хлопнула дверь.</p>\n<p>Жених отличается от рассказчика поведением после пробуждения. Он бежит вниз по лестнице в чёрной кофте, догоняет рассказчика, который в этот момент лежит на бетонном полу после падения, — «увидев меня и на мгновение остановился тяжело дыша, но быстро потеряв ко мне интерес побежал дальше вниз». Рассказчик читает это так: «лицо его выглядили уж слишком собраным и полным надежд», и отсюда делает вывод, что «Жених что-то знает». Тут же оставляет и вторую версию: «Ну или он психанул, когда очнулся на крыше и просто начал бежать». Какая из двух верна, в переписке не сказано.</p>\n<p>Про остальных пятерых никаких отличий не задано: они не просыпаются в пределах написанного текста и ничего не делают.</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S04", "GR-0087-S04", "GR-0087--kak-menyalas"], "h": "<p><strong>2026-02-14 (id 432538–432541).</strong> Слава пишет начало истории тремя сообщениями подряд. Группа задана целиком в первом же сообщении: семеро на газоне, состав шестерых перечислен, слово «группа» произнесено, рассказчик уходит с крыши. Во втором сообщении из состава выделяется второй участник — Жених — и происходит единственный контакт между двумя участниками группы за весь текст: встреча на лестнице, при которой они не говорят ни слова. Дальше рассказчик уходит в пустой город, к группе не возвращается, и до конца написанного она больше не появляется. Финальная сцена — ночной переулок, рассказчик приходит в себя в луже собственной крови. Кто его ранил, не сказано; с группой это нигде не связано. Сразу после текста Слава добавляет: «Я снова вернулся к Иссекаю».</p>\n<p><strong>2026-02-16 (id 433102–433184).</strong> Через два дня Миколай читает и разбирает текст построчно. По группе в этом разборе появляются две вещи.</p>\n<p>Первое — догадка о том, почему Жених потерял к рассказчику интерес (id 433167–433168): «либо он подумал что мальчик не человек / либо он подумал что он не пьяный», и следом «а кркк набухался». Это версия Миколая, в тексте истории её нет; Слава её не подтверждает и не опровергает.</p>\n<p>Второе — вопрос о размере площадки, на которой лежала группа (id 433182–433184). Миколай: «насколько она широкая интересно, 150 м²». Слава: «Хрен знает». Площадь газона так и осталась неустановленной.</p>\n<p>Отдельно в это же окно Миколай разбирает голос рассказчика (id 433129–433145): «это кто говорит», «персонаж?», «а зачем он так говорит», «для чего эти детали?», «почувствовать?», «чувствую», «но это чей-то голос», «так персонаж говорит?», «я ему не верю», «ну зачем он так говорит». Претензию он тут же снимает сам: «ну да, тут в целом другая идея, она работает на себя, так что нахуй претензию, просто это другое». Состава группы это не меняет.</p>\n<p>Состояний между этими двумя датами нет: группа была описана один раз и после этого не переписывалась.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "GR-0087-S05", "GR-0087--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет. Из семерых имени нет ни у кого; единственное обозначение сверх описания внешности — прозвище «Жених», которое рассказчик даёт по обручальному кольцу.</li>\n<li>Отдельных записей в базе только две — рассказчик (<a href=\"PS-0351.html\">Рассказчик «Любимого города»</a>) и Жених (<a href=\"PS-0352.html\">Жених</a>). Остальные пятеро (пацан лет десяти, подросток, молодая женщина, старичок, девчуля-подросток) существуют только строчкой перечисления.</li>\n<li>Как группа попала на крышу — не сказано. Рассказчик исходит из того, что их принесли, но кто и зачем, в переписке не названо.</li>\n<li>Связь между участниками не установлена: родственниками, знакомыми или отобранными по какому-то признаку они нигде не названы. Сходство с «семейным конкурсом» — только внешнее наблюдение рассказчика.</li>\n<li>Проснулись ли остальные пятеро, в написанном тексте не показано: рассказчик уходит с крыши и не возвращается, продолжения истории в окне нет.</li>\n<li>Способностей у группы никаких не заявлено — ни общих, ни отдельных. Раздел про то, что умеют все участники, писать не из чего.</li>\n<li>Иерархии нет: старшего, ведущего или какого-либо порядка внутри семерых в переписке не названо.</li>\n<li>С другими группами эти люди нигде не соотносятся; никаких других сторон, кроме них самих и пустого города, в тексте не появляется.</li>\n<li>Мотив Жениха остался нерешённым. Версия рассказчика («что-то знает» либо «психанул»), версия Миколая («мальчик не человек» либо «он не пьяный») — обе оставлены без ответа.</li>\n<li>Размер газона на крыше: спрошено 2026-02-16, ответ — «Хрен знает».</li>\n<li>Природа самого места (иной мир, симуляция, опустевшая реальность) не объяснена; вселенная «Иссекай» указана по соседней реплике, и возможно, что это жанр, а не название вселенной.</li>\n</ul></div>", "r": [["Рассказчик «Любимого города»", "PS-0351.html"], ["Жених", "PS-0352.html"]]}, {"t": "Связи — всё вместе", "a": ["GR-0087--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0351.html\">Рассказчик «Любимого города»</a>, <a href=\"PS-0352.html\">Жених</a></li>\n<li><strong>Упоминает монументы:</strong> <a href=\"MN-0027.html\">Пустой город</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0087--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0087.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0087-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0087/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Ссылок на <code>GR-0087</code> ноль, своей базы ноль (как у всех групп справочника), а всё, на что она ссылается, укомплектовано и крупно: <code>IS-0086</code> «Любимый город» (2 входящих, 43 130 знаков базы — крупнейшая запись вселенной), <code>PS-0352</code> Жених (3 входящих, 24 073), <code>PS-0351</code> Рассказчик (3 входящих, 20 287), <code>MN-0027</code> Пустой город (2 входящих, 19 010). Ни одного оборванного конца среди соседей нет. Чинить в самой записи нечего.</p>\n<p>Дыра, которая стоит дороже всего, лежит под всеми четырьмя сразу: у пустого города нет записи-мира. Он проведён монументом <code>MN-0027</code>, то есть местом внутри мира, — а что за мир вокруг него, не заведено вообще. На эту неопределённость опираются те же четыре статьи плюс эта, и она же прямо помечена как нерешённая («иной мир, симуляция, опустевшая реальность»). Для сравнения: единственный заведённый мир вселенной <code>MR-0190</code> «Ледяной мир» имеет 1 входящую ссылку и 4992 знака базы — вчетверо меньше, чем <code>MN-0027</code>, при статусе на ступень выше.</p>\n<p>Пятеро безымянных с крыши — дыра второго порядка: на них никто не ссылается, потому что ссылаться не на что. Заводить их до того, как решено, что вокруг них за место, смысла нет.</p>\n<h3>С чего начать</h3>\n<p>В базе, и работа тут не поисковая, а сводная. Материал есть — свыше ста тысяч знаков на четыре записи, — но он разъехался по ним, и группа как целое не собрана ни в одной: состав перечислен в <code>IS-0086</code>, отличия рассказчика — в <code>PS-0351</code>, вся встреча на лестнице — в <code>PS-0352</code>, площадка и её размеры — в <code>MN-0027</code>. Пятеро без имён не попали отдельно никуда, они существуют строчкой перечисления внутри <code>IS-0086</code>.</p>\n<p>В архив идти есть смысл ровно за одним — за проверкой, что материала больше нет. Ориентиры: окно w0117, 2026-02-14, 09:26, id 432538–432540 (три сообщения подряд, вся история целиком) и id 432541 сразу за ними. Разбор — 2026-02-16, id 433102–433184, из него по группе работают два места: 433167–433168 (догадка о Женихе) и 433182–433184 (вопрос о площади газона с ответом «Хрен знает»). После 433184 по этому кластеру в архиве ничего нет; продолжения истории не написано.</p>\n<h3>Как развивалось</h3>\n<p>Заявили и ограничили в одном абзаце: семеро названы, состав перечислен, слово «группа» произнесено — и тем же предложением, которым группа названа, рассказчик из неё выходит («оставаться в группе... не лучшая идея»). Группа задана и распущена быстрее, чем описана. Дальше сузили до двоих: во втором сообщении из семерых выделяется Жених, и происходит единственный контакт между участниками за весь текст. Через два дня, 2026-02-16, вернулись — но вернулись не к группе: оба вопроса разбора шли мимо неё, к мотиву Жениха и к квадратуре газона. Состава это не коснулось, и после 2026-02-16 к тексту не возвращались вообще.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для рассказчика правило поведения названо прямо и с именем: «инстинкт трёх принципов „Бей, беги, замри“». Он по нему действует дважды — уходит с крыши и бежит вниз от шагов, — и оба раза выбор объяснён этим правилом.</p>\n<p>Жених в той же обстановке делает ровно то же самое: просыпается вторым и бежит вниз. Но его бег правилом не объясняется — он подан как загадка, и обе версии («что-то знает» либо «психанул») ищут причину на стороне, хотя по уже названному правилу это тот же самый выбор из трёх. Для одного участника инстинкт назван, для соседнего того же рода — нет.</p>\n<h3>Отклик</h3>\n<p>Зацепила встреча на лестнице. Двое очнулись в одном непонятном месте, оба бегут вниз, один лежит на бетоне после падения, второй останавливается на мгновение — и теряет интерес. Ни слова не сказано. Из всех способов показать, что никакой группы тут нет, выбран самый экономный: люди, которые могли бы объединиться, проходят мимо друг друга, потому что каждому не до другого. И рядом стоит фраза «Идеальная команда для семейного конкурса» — ухоженные старики, дети, женщины и мужчины, подобранные так ровно, что подбор бросается в глаза, и никто в тексте на этом не задерживается, кроме рассказчика, которому в этом наборе не место. Полторы страницы, а место оказалось внятнее многих, где расписано на десять.</p></div>", "r": []}];</script>
