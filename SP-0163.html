<script>const BASE="";const DOCNAME="Благословение";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0163-S01", "SP-0163--mehanika"], "h": "<p>Благословение (<a href=\"SP-0163.html\">Благословение</a>) — сила, которую правитель мира даёт существу другого мира через связь. Разработка шла с 2025-01-06 по 2025-05-31 (id 278852–331662), формулировка механики менялась и уточнялась несколько раз; ниже сначала итоговое состояние, затем более ранние.</p>\n<p><strong>Кто даёт.</strong> Даёт правитель мира — «существо правящий этим миров» (278852, 2025-01-06). В первой формулировке: «И вот эти правитель могут дать свой благословений, но они могут дать свой благословений только людям из нашего мира». В поздней формулировке (331635, 2025-05-31) то же правило звучит как «благословения даётся только существами живущими в кильке»; в той же переписке Килька названа первым миром — имитатор говорит: «Благословения можеть получать только разумный житель кильке. Первого мира. Не знаю точно с чем это связано. Но это просто факт» (305856, 2025-03-19). Почему именно им — в переписке не объяснено, это прямо отмечено самим текстом («Не знаю точно с чем это связано»).</p>\n<p><strong>Как устроена передача.</strong> «Правители способны давать благословение. То есть настраивать связь с существом живущими в мире... Настроив это связь с существом (без его разрешения). Правитель способен передавать свою силу через эту связь к существу (человеком чаще всего). Сама связь устанавливается на мозге. То есть сила или энергия проходит через мозг вредя ему» (331635, 2025-05-31).</p>\n<p>Более ранняя формулировка того же (300888, 2025-03-10): «Благословенный это люди у которых есть связь с правителем другого мира, и чтобы получить его силу нужно сначала пропустить еë через мозг, из за этого благословенный не могут использовать благословенный 24/7».</p>\n<p>Ещё раньше (278936, 2025-01-06): «Это человек получающий силу с другого мира, и это все ещё человек. Вообще благословение надо активировать чтобы его применить». Благословенный остаётся человеком.</p>\n<p><strong>Активация.</strong> Благословение нужно активировать; активация — это «пропускания энергий через мозг» (331635). Признак активации у благословлённых правителем рая — белые глаза: «Вообще благословенный Богом есть общая чёрта виде белых глаз при активаций благословения» (283708, 2025-01-22); «И его глаза стали белыми. Это был признак использования благословенния правителем рая» (305856, 2025-03-19). В прозе белые глаза светятся в темноте (302380, 2025-03-14).</p>\n<p><strong>Четыре базовых способности.</strong> Есть у всех благословенных, независимо от правителя. Первая формулировка (305856, 2025-03-19): «Каждый правитель даёт разный способности. Но четыре базовых есть у всех. Это усиления, самоисцеления, энергия и сенсорика». Развёрнутая формулировка (331635, 2025-05-31): «усиленная регенерация; усиления тела и всех чуств; аура (то бишь самая энергия, которая выплескивается и заставляет чувствовать страх е животных и обычных людей. Так же способный влиять на окружающей. При сильном скоплении); сенсорика (позволяет ощущать других благослрвенных и арбетара или Протобионтов)».</p>\n<p><strong>Уникальная способность правителя.</strong> Помимо базовых, благословенный получает способность, идущую от конкретного правителя. Уникальность здесь означает уникальность правителя, а не носителя: «под уникальным подразумеввется, что у правителя уникальная благословенния дающий отличающий от всех других благословенной способность. НО если правитель, что дал вам благословения. Даст благословения ещё другому человеку. То оно будет такой же, как и у вас» (331635). Та же мысль раньше: «У других же благословенных одним правителем. Одинаковые способности» (305856).</p>\n<p><strong>Апостолы — исключение.</strong> Апостолы — благословенные правителем рая. У них способность не одинаковая, а формируется индивидуально: «У нас апостолов в отличие от всех. Способность формируется. То бишь у каждого апостола уникальная способность» (305856, 2025-03-19). Механизм объяснён позже: «правитель рая. Посылает им лишь сгустки чистой и необработанной силы, который формируется во что уже только внутри Апостолов. Даруя им уникальные способности» (331635, 2025-05-31). Там же у апостолов появляется дополнительная общая способность — телепатия между собой: «они способны разговаривать. На расстоянии и также всем мести. Они также могут отказаться от телепатического общения и прервать разговор».</p>\n<p><strong>Предохранитель.</strong> «И у нас благословенных есть предохранитель в голове. Который при случаи выгорания мозгов отключает благословенния. Но его можно —» (305856, 2025-03-19; фраза в исходнике обрывается). В бою предохранитель срабатывает сам: «Не замечая, что благословения выключалось. Точнее его выключил предохранитель. А имитатор не научил вырубать этот предохранитель» (305857). То есть предохранитель отключаем, но как именно — в переписке не сказано.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Что не сформулировано по вашей же логике — не материал авторов</b>\n<p>Предохранитель. Для благословенных правило названо: в голове стоит предохранитель, при выгорании мозгов он отключает благословение сам, в бою это показано работающим. Про арбетаров и альф в этой же статье сказано, что у них «по сути это благословенния только не через связь. А именно это сила находиться внутри их. Виде перегрузки мозга» — то есть повреждающий механизм признан тем же самым. Есть ли предохранитель у них, не сказано; рядом стоит прямо противоположное — «У них даже нету такого понятия, как отключения». Для одного носителя перегрузки защита названа, для другого носителя той же перегрузки правила того же рода нет.</p></div>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0163-S02", "SP-0163--ogranicheniya-i-cena"], "h": "<p><strong>Сила.</strong> Первое определение уровня (278932, 2025-01-06): «Но ты не бойся их Нея сила будет на уровне 10 то бишь они могут сломать деревянный дом не более». На вопрос Миколая «почему такие слабые» ответ: «А сильный и не нужный» (278937).</p>\n<p><strong>Равенство по силе.</strong> «Сразу всё благословенный равны по силе, путь то благословенный Богом, дьяволом, или другими правителем минимиров» (281368, 2025-01-13). Позже это объяснено через количество энергии: «так как всё благословенный включая апостолов. Получают плюс минус одинаковая количество энергии (силы). Они являются одинаково сильными. Но это не включая индивидуальность людей. Всё же апостолы всё равно чаще всего сильнее любого другого благословенного» (331635, 2025-05-31).</p>\n<p><strong>Временность эффектов.</strong> «Благословений это временная сила, типа еë нельзя долго сохранять. Например огонь стрельнуть по дереву оно горит, а после отключение благословенной огонь сразу исчезает» (281379, 2025-01-13). Позже с тем же примером и добавленным вторым: «После отключения благословенния они просто исчезают. Буть то огненный шар или остановка времени они просто отключаться» (331635, 2025-05-31).</p>\n<p><strong>Нельзя держать активным.</strong> «Благословений не может быть активным постоянная, это тратит выносливость» (281382, 2025-01-13). Позже причина заменена на повреждение мозга: «Именно из-за этого факта мы благословенный не можем использовать благословенния 24/7» (305856); «Поэтому благословенный не часто используют благословения. Ведь это вредит мозгу» (331635).</p>\n<p><strong>Головная боль.</strong> Защитник спрашивает: «почему после использования благословенния у меня болит голова?» Ответ: «Потому-что связь устанавливается с мозгом. И сила проходит через мозг. Повреждая его. Но не сильно» (305856, 2025-03-19).</p>\n<p><strong>Срок жизни.</strong> «Средние продолжительность жизнь у благословенного после получения благословения 10 лет» (331635, 2025-05-31).</p>\n<p><strong>Срок действия.</strong> На вопрос «пока человек не сдохнет?» — «Да» (278946–278948, 2025-01-06). Позже: «это одно благословения с ним до его смерти. Благословения нельзя разорвать» (331636, 2025-05-31).</p>\n<p><strong>Одно на существо.</strong> «благословения даётся только одно. Больше человек не выдержит» (331636, 2025-05-31).</p>\n<p><strong>Без согласия.</strong> Связь настраивается «без его разрешения» (331635); правители «не как не могут влиять на благословенного или обычного существа (кроме как насильственно давать благословения, даже если само существо этого не хочет)» (331636).</p>\n<p><strong>Лимит на число.</strong> «И бог и дьявол могут дать свой благословение лишь 21 человеку» (278944, 2025-01-06). «Но каждый правитель может дать ограниченной количество благословение» (305856). «21 это максимальное число благословения, который способен давать правитель рая. Другие же правители дают меньше» (331635). Правители минимиров «довольно редко дают свой благословение» (278941).</p>\n<p><strong>Соотношение с Семью грехами.</strong> «Но не забывай 7 грехов сильней благословенный и чтобы убить одного греха в максимум надо 3 благословенных именно Бога. А для остальных благословенных надо будет 5» (284276, 2025-01-24).</p>\n<p><strong>Артефакты.</strong> Благословенный не может раскрыть мощь артефакта: «Благословенный; альфа, Арбетары и фантазёры не способны раскрыть всю мощь артефакта. Так как уже сами переполненный силой. Лучшего всего мощь артефакта способен раскрыть обычный человек» (331635, 2025-05-31).</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0163-S03", "SP-0163--nositeli"], "h": "<p><strong>Кто может получить.</strong> Только люди нашего мира (278852, 2025-01-06), позже — «разумный житель кильке» (305856), ещё позже — «существами живущими в кильке» (331635). Вопрос Миколая «корову можно?» (331659, 2025-05-31) остался без ответа в переписке.</p>\n<p><strong>Числа.</strong> Бог и дьявол дают по 21 человеку (278944, 2025-01-06). В тот же день названо общее число: «А их именной сейчас 42... Благословенный бога и дьявола» (278966–278967). Через полчаса называется другая цифра: «Всего их 41» (279068). 2025-01-22 обсуждается вариант оставить 21 (283709–283712); Миколай отвечает «21» (283747). 2025-03-19: «Нас апостолов 21 во всём мире. Нас, именно нас благословенных правителем рая. Больше чем других благословенных другими правителями» (305856). 2025-05-31 подтверждено: апостолов 21 (331635).</p>\n<p><strong>Зачем даются.</strong> Богу — «В раю много добрых людей и бог име проникся из за этого даёт благословение»; дьяволу — «У дьявола часто сбегают в грешники в наш мир и их надо возвращать поэтому он даёт благословение» (278943, 2025-01-06). Роль благословенных дьявола: «Он даёт благословение людям, а эти люди изгоняют грешников из этого мира и отправляют в ад» — то есть убивают, «после смерти грешники опять отправляются в ад» (279011–279014). Общая мотивация правителей: «Опять они вечно наблюдают за нашем миров можно сказать единственное развлечения в их ней бесконечное жизни» (278941).</p>\n<p><strong>Положение в обществе.</strong> Общество о мирах не знает; «Благословенный имеют большую власть у верхушки и может многой» (278965, 2025-01-06).</p>\n<p><strong>Братья и сёстры.</strong> «Братья и сестры это то бишь благословенный одним правителем» (283706, 2025-01-22).</p>\n<p><strong>Названные носители.</strong> Список благословенных на 2025-01-24 (284278), с эмодзи-пометками автора и вложенными именами в скобках:</p>\n<ul>\n<li>Имитатор 🗡 (ветреной 🌬; электро ⚡️; птичка 🔈)</li>\n<li>Агрегат 🫥 (волк 🐺; экстримал ⏳; страдалец 🔪)</li>\n<li>Разрушительнитца 💪 (огненная 💥)</li>\n<li>Палач ☠️</li>\n<li>Защитник 🤬 (ангел 👼)</li>\n<li>Дитя света ✨ (Теневые братья 🌘)</li>\n<li>Бессмертный выродок 🤪</li>\n<li>Хулиган 💎 (слайм 7️⃣)</li>\n<li>Вибрация 🫨</li>\n<li>Ученица ???</li>\n</ul>\n<p>Что означают вложенные скобки и эмодзи — в переписке не объяснено.</p>\n<p>Ранее (283707, 2025-01-22) среди «братьев и сестёр» Защитника перечислены: «владельцы способности изменения агрегатного сотояния, Та кто может изменять плотность массу и размер объектов и себя, Тот у кого есть способность сжатия, Имитация, Бессмертный выродок, Теневые братья».</p>\n<p><strong>Апостолы в прозе.</strong> Имитатор о себе и Защитнике: «Ты и я апостолы. Это люди получивший благословения от правителя рая. То бишь от второго мира появившейся после кильке» (305856, 2025-03-19). Защитник получает благословение в момент, когда должен был умереть (302380, 2025-03-14); уточнено, что апостолом он стал «когда его атаковали кровью в спину» (302676). У Защитника при активации светятся конечности оранжевым (302380, 305857); Имитатор пользуется цепями, усиленным ударом («Это был особый способ усиления имитатор. Но он поглащает слишком много сил. Да и его нужно ещё готовить»), оранжевыми пузырьками-взрывом и имитацией чужой способности — «Он сымитировал мою способность» (305857–305858, 2025-03-19).</p>\n<p><strong>Благословение правителем нашего мира.</strong> «При этом глава этой организации будет единственный благословенный правителем нашего мира. То бишь она будет грубо говоря сильнейшей» (284170–284171, 2025-01-23) — речь об организации злодеев. Это третий вид благословения помимо благословения Богом и дьяволом.</p>\n<p><strong>Бессмертный.</strong> Центральная идея истории «Бессмертный» — «Внести апостола» (302863, 2025-03-14). 2025-05-31 Миколай спрашивает: «можно бессмертному дать второе?» и «как?» (331661–331662) — ответа в переписке нет.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0163-S04", "SP-0163--kak-menyalas-po-versiyam"], "h": "<p><strong>2025-01-06 (id 278852).</strong> Первое появление в рамках общего рассказа об устройстве вселенной: «И вот эти правитель могут дать свой благословений, но они могут дать свой благословений только людям из нашего мира».</p>\n<p><strong>2025-01-06 (id 278924–278944).</strong> Разбор на вопросы Миколая («а че такое человек с благословением? это всё ещё человек?»). Назначение: «Так сука если дракон или ещё какая хуйня вылезет чё делать не палить же ядеркой». Сила уровня 10 — сломать деревянный дом, не более. Благословенный остаётся человеком, благословение надо активировать. Правители минимиров дают редко, больше всех дают бог и дьявол — по 21 человеку каждый.</p>\n<p><strong>2025-01-06 (id 278945–278954).</strong> Благословение держится, пока носитель не умрёт.</p>\n<p><strong>2025-01-06 (id 278958–278967).</strong> Всего благословенных бога и дьявола «сейчас 42». Общество о мирах не знает, но благословенные имеют большую власть у верхушки. Первый рабочий шаг по вселенной сформулирован как «Сначала придумать способность всём благословенным».</p>\n<p><strong>2025-01-06 (id 279004–279014).</strong> Роль благословенных дьявола: изгонять грешников из нашего мира, то есть убивать, после чего те возвращаются в ад.</p>\n<p><strong>2025-01-06 (id 279065–279075).</strong> Счёт назван заново с другой цифрой: «Всего их 41». Договорились начать с одного полностью придуманного благословенного (сила, характер, мотивы): «я и одного хуй знает когда и как сделаю, поэтому начнем с 1». Слава обещал привести пример благословенного назавтра.</p>\n<p><strong>2025-01-13 (id 281365–281371).</strong> Равенство всех благословенных по силе независимо от источника благословения. В том же разговоре Миколай предлагает происхождение артефактов: «ну правители при создании своих миров периодически тратили энергию на создание артефактов в которых заключали идеи».</p>\n<p><strong>2025-01-13 (id 281374–281386).</strong> Благословение — временная сила, эффекты исчезают после отключения (пример с горящим деревом). Благословение не может быть активным постоянно, «это тратит выносливость». Миколай допускает, что раньше существовал способ сохранять силу: «ну мб раньше был способ» — дальше это не развито.</p>\n<p><strong>2025-01-22 (id 283706–283712).</strong> Белые глаза при активации как общая черта благословенных Богом. Слава замечает, что теми же глазами наделил тех, кто должен был быть благословлён дьяволом, менять не хочет («при этом и менять я ничего не хочу потому что мне и так нравится») и предлагает вообще убрать благословенных дьяволом. Отсюда вопрос о числе: 21 или 42.</p>\n<p><strong>2025-01-22 (id 283717–283748).</strong> Миколай против удаления благословенных дьяволом («я хочу благословенных дьяволом»). Причина предложения: «Потому что ничего про них придумать не могу». На вопрос о числе Миколай отвечает «21»; подтверждения от Славы в окне нет.</p>\n<p><strong>2025-01-23 (id 284170–284176).</strong> Вводится третий вид — благословение правителем нашего мира; такая одна, у главы организации злодеев, «грубо говоря сильнейшей». Тут же названы Семь грехов и Божество: «Будет слабей главы этой организации но сильней благословенного».</p>\n<p><strong>2025-01-24 (id 284276–284279).</strong> Количественное правило: «чтобы убить одного греха в максимум надо 3 благословенных именно Бога. А для остальных благословенных надо будет 5». Приведён список благословенных, врагов, семи грехов и идей.</p>\n<p><strong>2025-03-10 (id 300884–300889).</strong> Механика формулируется как отправная точка для объяснения Альф и Арбетар: связь с правителем другого мира, прогон силы через мозг, невозможность использовать 24/7.</p>\n<p><strong>2025-03-14 (id 302380–302383).</strong> Механика показана в прозе на Защитнике: благословение приходит в момент, когда он должен был умереть, и «не обычная, а от бога». Признак — белые глаза, светящиеся в темноте, затем свечение ноги в ярко-оранжевый и рывок. Отдельно проговорена разница уровней: «Одно дело это сражаться без благословенния с обычным человеком... Другой же дело это сражаться с другим благословенным. Ещё не обычным, а с апостолом».</p>\n<p><strong>2025-03-14 (id 302666–302681).</strong> Правило чтения: пока белые глаза не написаны, персонаж не апостол — «Нет ещё, иначе бы я написал бы белый глаза». Апостолом Защитник стал в момент удара кровью в спину.</p>\n<p><strong>2025-03-19 (id 305855–305858).</strong> Наиболее подробное объяснение до мая: разговор Имитатора с Защитником. Четыре базовых способности у всех; у апостолов способность формируется, у прочих благословенных одного правителя — одинаковая; связь идёт через мозг и повреждает его, отсюда головная боль и невозможность пользоваться силой постоянно; каждый правитель может дать ограниченное число благословений; апостолов 21; в голове есть предохранитель, отключающий благословение при выгорании мозгов. Работа механики показана в бою с ангелом и упырём (305857–305858).</p>\n<p><strong>2025-05-31 (id 331635–331636).</strong> Свод механики целиком: связь ставится на мозг, энергия проходит через него и вредит ему; средняя продолжительность жизни благословенного после получения — 10 лет; благословение даётся только существам Кильки и без согласия; одно на существо, больше не выдержит, разорвать нельзя, до смерти; четыре базовых способности (усиленная регенерация, усиление тела и всех чувств, аура, сенсорика) плюс уникальная способность правителя, одинаковая у всех его благословенных; у апостолов сила приходит «сгустками чистой и необработанной силы» и формируется внутри них, отсюда разные способности, плюс телепатия между апостолами; после отключения все эффекты исчезают; количество энергии у всех примерно одинаковое, значит и сила примерно одинакова, но «апостолы всё равно чаще всего сильнее любого другого благословенного».</p>\n<p><strong>2025-05-31 (id 331658–331662).</strong> Миколай задаёт вопросы к своду: почему благословение даётся именно этим существам, «корову можно?», «я могу её поглощать? левый чел. это энергия правителя? что он об этом думает? о выпуске энергии. а мозгу так легче, когда энергия во вне текёт? а если бы не лилась?», «можно бессмертному дать второе?», «как?». Ответы в окно не попали.</p>", "r": []}, {"t": "Отклонённые варианты", "a": ["S05", "SP-0163-S05", "SP-0163--otklonennye-varianty"], "h": "<ul>\n<li><strong>Убрать благословенных дьяволом</strong> (283708–283712, 2025-01-22). Предложение Славы, мотив — «Потому что ничего про них придумать не могу» и нежелание менять белые глаза, уже розданные тем, кто должен был быть благословлён дьяволом. Миколай против: «я хочу благословенных дьяволом». Внутри окна решение не принято.</li>\n<li><strong>Скорость как способность Защитника</strong> (283723–283728, 2025-01-22). Миколай: «вообще я бы дал скорость наверное. типа вот ему не нравится и он не терпит никогда, он берёт и пиздит тех кто не нравится. и не карают его ибо быстрый». Слава отклонил: «Способность скорость не подходит», плюс возражение «За что карать его».</li>\n<li><strong>Вулкан / каменная кожа</strong> (283733–283745, 2025-01-22). Миколай: «что-то типа вулкана... типа каменная кожа... внутри из лавы... даже если сломать камень он не упадёт, просто завязнет в лаве». Ответ Славы — знак «🚫».</li>\n<li><strong>Число благословенных.</strong> 21+21 (2025-01-06) → 42 (2025-01-06) → 41 (2025-01-06) → обсуждение 21 против 42 (2025-01-22) → 21 апостол как окончательное число благословенных правителем рая (2025-03-19, 2025-05-31). Старые цифры не отменялись отдельным решением, они просто перестали повторяться.</li>\n<li><strong>Способ сохранять силу в прошлом</strong> (281380, 2025-01-13). Миколай: «ну мб раньше был способ» — предположение, оставшееся без развития; оно соседствует с правилом о временности благословения и с версией происхождения артефактов как заключённой в них энергии правителей.</li>\n</ul>", "r": []}, {"t": "Связь с другими способностями", "a": ["S06", "SP-0163-S06", "SP-0163--svyaz-s-drugimi-sposobnostyami"], "h": "<p><strong>Арбетары и Альфа.</strong> «Арбетары и Альфа это одни те же существа. Но в первом случае это люди из кильке, а во втором это чужамирцы» (331636, 2025-05-31). Они «насильственно вырвали кусок силы своего мира (с помощью ритуала???...). А после посели его в себе и заставили выделять силу». Прямое сравнение с благословением дано авторски: «по сути это благословенния только не через связь. А именно это сила находиться внутри их. Виде перегрузки мозга». Базовые умения те же четыре (регенерация — «чаще всего превосходит благословенных», усиление тела и чувств, аура, сенсорика). Уникальная способность у них формируется, как у апостолов, даже если кусок силы один и тот же. Отличие в эффектах: «если они подожгут лес он будет гореть пока весь не выгореть. Либо его не потушат. Им не зачем отключат способность. У них даже нету такого понятия, как отключения. Но они должны будут учиться вырабатывать энергию и научиться использовать способность и контролировать энергию. Когда у благословенным это выходит автоматический». Благословение было названо отправной точкой для объяснения Альф и Арбетар (300884–300889, 2025-03-10).</p>\n<p><strong>Артефакты.</strong> Версия происхождения от Миколая (281371–281374, 2025-01-13): правители при создании миров тратили энергию на артефакты, «в которых заключали идеи», мотив — «просто думали что благословенных больше не будет и заботились о будущем». Версия Славы (331635, 2025-05-31): артефакт — объект, наделённый чрезмерной силой при неудачном контроле над созданием мира. Отдельно названы «артефакты с символикой», появившиеся вместе с правителями. Благословенные, альфы, арбетары и фантазёры мощь артефакта раскрыть не могут, «так как уже сами переполненный силой», лучше всех раскрывает обычный человек.</p>\n<p><strong>Семь грехов и Божество.</strong> Сильнее благословенных: чтобы убить одного греха в максимуме, нужно 3 благословенных Бога или 5 прочих благословенных (284276, 2025-01-24). Семь грехов и Божество «Будет слабей главы этой организации но сильней благословенного» (284175, 2025-01-23). Способности грехов на 2025-01-23: Похоть — контроль разума с ограничением; Алчность — поглощение чужой маны или объектов; Лень — телекинез плюс владение магией ветра; Зависть — полное перевоплощение в того, кому завидуешь, «полной копирование сил, магии, одежды, внешность но не характера»; Гордыня — «Слово закон с ограничением»; Чревоугодие и Гнев приняты без изменений. В списке 2025-01-24 (284278) Гнев помечен как сила, Алчность — «всё моей», Чревоугодие — поглощение, Лень — контроль территории.</p>\n<p><strong>Протобионты.</strong> Дети правителей, «создан именно правителем, а не из-за особенности мира», сила «в теории позволит уничтожить континент» (331635). С благословением связаны через сенсорику: базовая сенсорика благословенного позволяет ощущать «других благослрвенных и арбетара или Протобионтов».</p>\n<p><strong>Фантазёры.</strong> «правитель с маленькой буквой», создавшие свой мир в голове и влияющие на наш по законам своего. «Фантазёр на данный момент сильнейший существа» (331635, 2025-05-31). С благословением напрямую связаны только через правило об артефактах (не способны раскрыть их мощь).</p>\n<p><strong>Апостольская телепатия.</strong> Дополнительная способность, существующая только у благословенных правителя рая (331635).</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "SP-0163-S07", "SP-0163--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Почему благословение может получить только житель Кильки — не объяснено; в самом тексте это оформлено как «Не знаю точно с чем это связано. Но это просто факт» (305856).</li>\n<li>Ритуал, которым существа покидают свой мир и которым арбетары вырывают кусок силы, не доработан — авторская пометка в тексте: «с помощью ритуала??? Которой я ещё не доработал» (331636, 2025-05-31).</li>\n<li>Фраза о предохранителе оборвана: «Но его можно —» (305856). Как отключается предохранитель, не сказано; в бою прямо отмечено, что Имитатор этому не научил (305857).</li>\n<li>Вопросы Миколая от 2025-05-31 (331658–331662) остались без ответа в переписке: почему благословение даётся именно этим существам; можно ли благословить корову; можно ли поглощать эту энергию; что правитель думает о выпуске своей энергии; легче ли мозгу, когда энергия выходит наружу, и что было бы, если бы не лилась; можно ли дать Бессмертному второе благословение и как.</li>\n<li>Судьба благословенных дьяволом внутри окна w0072 не решена: Слава хочет убрать, Миколай против.</li>\n<li>Окончательное число благословенных Славой в окне w0072 не подтверждено; цифры 21+21, 42 и 41 в течение одного дня 2025-01-06 сменяли друг друга.</li>\n<li>Расхождение между правилом «благословение нельзя долго сохранять» и версией артефактов как заключённой в них силы правителей (w0071) не закрыто.</li>\n<li>Кто такие боги, дающие благословение, и чем апостол отличается от благословенного по силе — в окне w0081 не раскрыто; в мае 2025 разница сведена к формированию способности и к оговорке, что апостолы «чаще всего сильнее», но без объяснения, за счёт чего.</li>\n<li>Что означают вложенные в скобки имена и эмодзи в списке благословенных от 2025-01-24 (284278) — не объяснено.</li>\n<li>Пометка «Ученица???» в том же списке оставлена без содержания.</li>\n<li>Идеи «Чёрный ящик, озеро перерождения, корень желаний» (284278) названы, но с благословением в переписке не связаны.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0163--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0013.html\">Благословенные</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0163--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-01-06</td>\n<td>278852–278852</td>\n<td>w0070</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-06</td>\n<td>278924–278944</td>\n<td>w0070</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-06</td>\n<td>278945–278954</td>\n<td>w0070</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-06</td>\n<td>278958–278967</td>\n<td>w0070</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-06</td>\n<td>279004–279014</td>\n<td>w0070</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-06</td>\n<td>279065–279075</td>\n<td>w0070</td>\n<td>Апостол (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2025-01-13</td>\n<td>281365–281371</td>\n<td>w0071</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-13</td>\n<td>281374–281386</td>\n<td>w0071</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-22</td>\n<td>283706–283712</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-22</td>\n<td>283717–283748</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-23</td>\n<td>284170–284176</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-24</td>\n<td>284276–284279</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-10</td>\n<td>300884–300889</td>\n<td>w0079</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-14</td>\n<td>302380–302383</td>\n<td>w0081</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-14</td>\n<td>302666–302681</td>\n<td>w0081</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-14</td>\n<td>302859–302886</td>\n<td>w0081</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-19</td>\n<td>305855–305858</td>\n<td>w0083</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-05-31</td>\n<td>331635–331636</td>\n<td>w0099</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-05-31</td>\n<td>331658–331662</td>\n<td>w0099</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0163-blagoslovenie.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0163--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0163.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["SP-0163-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/SP-0163/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первое — бог и дьявол. Через всю статью идут два источника благословения: по 21 человеку у каждого, белые глаза как общая черта благословенных богом, благословенные дьявола выбивают грешников обратно в ад. Ни у бога, ни у дьявола нет ни статьи, ни записи в базе — сущности с такими именами в наборе нет вообще. Расписан только третий источник: <code>PS-0279</code> «Правитель рая» (23 121 базы, статья, две ссылки) и <code>MR-0095</code> «Рай» (54 131). От дьявольской половины остаётся <code>ID-0143</code> «Благословенный дьяволом» — 3 149 знаков базы, статьи нет, ссылок ноль. Спор 2025-01-22 (убирать благословенных дьяволом или нет) решается именно там, и решать его сейчас негде.</p>\n<p>Второе — майский свод, самая плотная часть статьи, в базе разложен на три записи со вселенной «неясно» и без статей: <code>SP-0240</code> «Благословение правителя» (9 835), <code>SP-0241</code> «Четыре основные способности благословенных» (9 573), <code>SP-0242</code> «Уникальная способность правителя» (9 592). Почти 29 тысяч знаков про механику, которую статья пересказывает по одной реплике 331635, и ни одной статьи, ни одной ссылки на них.</p>\n<p>Третье — каталог 284278, откуда взят список благословенных с эмодзи и вложенными скобками. Он лежит в <code>SL-0051</code> (9 834 базы, шесть ссылок, статьи нет) и <code>SL-0053</code> (20 313, шесть ссылок, статьи нет). Это две самые нагруженные бесстатейные записи набора; «что означают скобки и эмодзи» без них не разбирается.</p>\n<h3>С чего начать</h3>\n<p>В базе. Оборванная фраза про предохранитель («Но его можно —») продолжается не здесь: <code>SP-0204</code> «Предохранитель» — 17 153 знака базы, статья есть, две ссылки, вселенные «Апостол» и «вне вселенной». Это в восемь раз больше материала, чем цитата в статье.</p>\n<p>Сравнение с арбетарами и ритуал, помеченный самим Славой как недоработанный, — <code>SP-0198</code> «Ритуал становления Арбетаром» (48 879), <code>PS-0220</code> (38 531), <code>PS-0281</code> «Арбетары и Альфа» (7 646). Апостольская часть — <code>SL-0054</code> «Список 12 апостолов»: 234 052 знака базы, статьи нет, три ссылки. Числа 21 / 42 / 41 и их сведение — <code>PS-0179</code> (78 161) и <code>MR-0107</code> «Иерархия силы» (5 534 базы при 10 748 статьи, четыре ссылки).</p>\n<p>В архив — за ответами на 331658–331662. Смотреть окно w0099, 2025-05-31, всё правее 331662. По датам в источниках между 2025-05-31 и следующим окном w0107 (2025-10-20) у этой сущности нет ни одной записи — пятимесячная дыра, и если Слава отвечал на «корову можно?» и «можно бессмертному дать второе?», ответ лежит внутри неё.</p>\n<h3>Как развивалось</h3>\n<p>2025-01-06 — заявили: сила уровня 10, по 21 благословенному у бога и дьявола, держится до смерти носителя. 2025-01-13 — ограничили: сила временная, эффекты гаснут при отключении, держать активной нельзя, «это тратит выносливость». 2025-01-22 — попытались свернуть: Слава предлагает убрать благословенных дьяволом, Миколай против, решения нет. 2025-01-23–24 — встроили в иерархию: третий вид благословения у главы организации злодеев, счёт «3 благословенных бога или 5 прочих на одного греха». 2025-03-14–19 — вернулись через прозу: механику проговаривает не автор, а персонаж, Имитатор, объясняя её Защитнику. 2025-05-31 — свод целиком, и там же обоснование подменено: причина «тратит выносливость» заменена на «вредит мозгу», к ней добавлены 10 лет жизни. В тот же день — пять вопросов Миколая, оставшихся без ответа.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Предохранитель. Для благословенных правило названо: в голове стоит предохранитель, при выгорании мозгов он отключает благословение сам, в бою это показано работающим. Про арбетаров и альф в этой же статье сказано, что у них «по сути это благословенния только не через связь. А именно это сила находиться внутри их. Виде перегрузки мозга» — то есть повреждающий механизм признан тем же самым. Есть ли предохранитель у них, не сказано; рядом стоит прямо противоположное — «У них даже нету такого понятия, как отключения». Для одного носителя перегрузки защита названа, для другого носителя той же перегрузки правила того же рода нет.</p>\n<h3>Отклик</h3>\n<p>Сильнее всего тут не механика, а 302666: «Нет ещё, иначе бы я написал бы белый глаза». Признак мира и признак текста тут одно и то же — автор читает собственную прозу как документ, по которому можно установить факт. Белые глаза перестают быть описанием внешности и становятся отметкой в протоколе. Рядом второе: почти вся механика мая доходит до читателя не авторской справкой, а разговором Имитатора с Защитником — то есть объяснение вписано в мир как чей-то урок кому-то, со всеми последствиями, включая «а имитатор не научил вырубать этот предохранитель». Ошибка в обучении становится боевой ошибкой. И отдельно зацепил спор 2025-01-22: Слава хочет убрать благословенных дьяволом с честной причиной «ничего про них придумать не могу», Миколай отвечает «я хочу благословенных дьяволом». Это спор не о мире, а о том, кто будет их придумывать, и по состоянию базы (<code>ID-0143</code>, 3 149 знаков) видно, чем он кончился.</p></div>", "r": []}];</script>
