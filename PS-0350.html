<script>const BASE="";const DOCNAME="Водяные";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0350-S01", "PS-0350--proishozhdenie"], "h": "<p>Водяные прозвучали один раз — в реплике внутри выложенного Славой куска «Чёрного озера» (2026-02-08, id 430013, окно w0116). Это первое и единственное упоминание.</p>\n<p>Название в исходнике написано как «водеными»; в записи оно вынесено вариантом имени.</p>", "r": []}, {"t": "Что известно", "a": ["S02", "PS-0350-S02", "PS-0350--chto-izvestno"], "h": "<p>Всё, что сказано, содержится в одной фразе мужчины в белой рубашке, обращённой к рассказчику: «ты меня с водеными перепутал кажись?»</p>\n<p>Из этого следует, что водяные — те, за кого рассказчик принял собеседника, и что нечисть в этом мире не одна. Кто такие водяные, как выглядят, где живут и чем отличаются от мужчины в белой рубашке — не сказано.</p>", "r": []}, {"t": "Связи с другими", "a": ["S03", "PS-0350-S03", "PS-0350--svyazi-s-drugimi"], "h": "<p>Названы через контекст сцены: Мужчина в белой рубашке (тот, кто произносит реплику и кого с водяными спутали) и Чёрное озеро (текст, в котором реплика звучит). Водяные проходят как часть Чёрного озера.</p>\n<p>Разговора о водяных как о самостоятельной сущности между соавторами не было: сразу после выложенного куска Слава переходит к другому — «Вообще я думаю над новой истории с названием \"виновен? \"» (id 430014).</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S04", "PS-0350-S04", "PS-0350--kak-menyalsya"], "h": "<p><strong>2026-02-08, id 430013–430014 (окно w0116).</strong> Единственное упоминание, версия одна. Дальше в окне не разворачивается.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "PS-0350-S05", "PS-0350--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Никакой разработки нет — только название.</li>\n<li>Кто такие водяные, как выглядят и что умеют — в переписке не сказано.</li>\n<li>Почему рассказчик принял мужчину в белой рубашке за водяного — не объяснено.</li>\n<li>Один это персонаж или вид существ — из реплики следует множественное число, но состав и устройство не названы.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0350--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0035.html\">Водяные</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0350--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-02-08</td>\n<td>430013–430014</td>\n<td>w0116</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0350-vodyanye.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0350--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0350.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
