<script>const BASE="";const DOCNAME="Лень (грех)";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0160-S01", "SP-0160--mehanika"], "h": "<p>Лень — один из грехов в наборе «Семь грехов (магия по грехам)»: магия, привязанная к смертным грехам. Разбор грехов шёл 2024-12-24 — 2024-12-25 (id 273904–274468), и по лени авторы дали два разных варианта, которые между собой не сведены.</p>\n<p><strong>Вариант Миколая (2024-12-24, id 273906).</strong> Три составляющие, перечисленные подряд:</p>\n<ul>\n<li>«барьер неуязвимый пока тебе лень. хотя, пока ты спиш.» — то есть сначала условием названа собственно лень, тут же, в той же строке, условие уточнено до сна;</li>\n<li>«телепортация неподкондрольная, ну типа хочется куда то, туда и появляешься, но лень должно быть» — перемещение происходит по желанию («хочется куда то, туда и появляешься»), но управлять им носитель не может, и обязательное условие срабатывания — лень;</li>\n<li>«способность растечься, но не двигаться» — растекание есть, движение в растёкшемся состоянии не предусмотрено.</li>\n</ul>\n<p>Лень у Миколая выписана в одном длинном сообщении вместе с остальными грехами — похотью, чревоугодием, алчностью, гневом, завистью <a href=\"SP-0161.html\">Зависть (грех)</a> и гордыней; лень идёт четвёртым пунктом.</p>\n<p><strong>Вариант Славы (2024-12-24, id 273920).</strong> «Лень: я думал телекинез типа лень чё то делать вот и телекинез ( здесь ещё в придачу владений магий ветра, как никак они связаны)». Мотивировка способности та же, что у Миколая, но выведена в другую сторону: лень что-то делать руками — значит, предметы двигаются сами. К телекинезу довеском идёт владение магией ветра.</p>\n<p>Общий принцип, названный Миколаем при обсуждении грехов (2024-12-24, id 273917): «но в грехах это базовое подразумевается, такова природа греха». К чему именно относится «это», в приведённом куске переписки не сказано.</p>", "r": [["Зависть (грех)", "SP-0161.html"]]}, {"t": "Ограничения и цена", "a": ["S02", "SP-0160-S02", "SP-0160--ogranicheniya-i-cena"], "h": "<p>По варианту Миколая ограничения встроены в саму механику:</p>\n<ul>\n<li>барьер держится не всегда, а только пока действует условие — «пока тебе лень», в уточнённом виде «пока ты спиш»;</li>\n<li>телепортация «неподкондрольная», то есть носитель её не выбирает, и для срабатывания «лень должно быть»;</li>\n<li>растекание отсекает перемещение: «растечься, но не двигаться».</li>\n</ul>\n<p>Отдельного проклятья для лени, как для алчности («ты не можешь ничего отдать кому либо») или гнева, в переписке не выписано.</p>\n<p>По варианту Славы ограничений и цены не названо.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0160-S03", "SP-0160--nositeli"], "h": "<p>Носитель лени в переписке не назван. Грехи разбирались как система способностей, персонажи к ним не привязывались.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0160-S04", "SP-0160--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-12-24 (id 273904–273908), окно w0068.</strong> Миколай пишет грехи подряд («продолжаю грехи писатт») и в сообщении 273906 даёт лень как набор из трёх пунктов: неуязвимый барьер, пока лень / пока спишь; неподконтрольная телепортация по желанию, требующая лени; растекание без движения. Заканчивает вопросом «как тебе».</p>\n<p><strong>Версия 2 — 2024-12-24 (id 273917–273921), окно w0068.</strong> Слава отвечает своим разбором по всем грехам и по лени предлагает другое: телекинез, объяснённый через саму лень («лень чё то делать вот и телекинез»), плюс магия ветра «в придачу», потому что «как никак они связаны». Дальше пауза 1.5 часа.</p>\n<p><strong>Версия 3 — 2024-12-25 (id 274463–274468), окно w0068.</strong> Разбирается именно связка телекинеза и ветра. Миколай: «хз, я не думал, так что не особо понимаю про ветер». Слава объясняет: «Не типа магия телекинез и магия ветра они же похожий в чем то», «Ну не прям копия но есть похожие черты». Миколай: «дадада».</p>\n<p>В этом же куске стоит реплика Миколая 274463: «согл звучит уместнее, просто было воровство, а я повторятся не хотел, если убрать, но очень хорошо подходит, я тоже хотел» — она про воровство, к какому именно греху относится, в приведённом фрагменте не обозначено.</p>\n<p>Какой из двух вариантов лени принят, в переписке не сказано. Первый вариант прямо не отменён, второй прямо не утверждён.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0160-S05", "SP-0160--svyaz-s-drugimi-sposobnostyami"], "h": "<ul>\n<li>Часть набора «Семь грехов (магия по грехам)» — лень идёт наравне с похотью, чревоугодием, алчностью, гневом, завистью <a href=\"SP-0161.html\">Зависть (грех)</a> и гордыней.</li>\n<li>В варианте Славы лень напрямую связана с магией ветра, и связь эта обоснована сходством с телекинезом: «не прям копия но есть похожие черты» (2024-12-25, id 274465–274467).</li>\n<li>Привязка стихии к греху в разборе Миколая работает и для соседей: у гнева «магия взрыва развита», у зависти «магия льда развита», у гордыни «магия света и огня развита хорошо». У лени в варианте Миколая стихия не названа — стихия появляется только у Славы (ветер).</li>\n</ul>", "r": [["Зависть (грех)", "SP-0161.html"]]}, {"t": "Пробелы", "a": ["S06", "SP-0160-S06", "SP-0160--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Какой вариант лени окончательный — Миколая или Славы — в переписке не сказано; выбор остался нерешённым.</li>\n<li>В варианте Миколая условие барьера дано в двух видах сразу («пока тебе лень» и «пока ты спиш»), и что из этого итоговое, не решено.</li>\n<li>Не сказано, как три составляющие варианта Миколая соотносятся между собой: набор это или одна способность с проявлениями.</li>\n<li>Не сказано, куда именно телепортирует носителя неподконтрольная телепортация, если желание сталкивается с ленью, и есть ли у неё дальность.</li>\n<li>Про растекание не сказано ничего, кроме самого факта: во что растекаешься, обратимо ли это, сколько длится.</li>\n<li>Проклятье для лени не выписано, хотя у алчности и гнева проклятья названы.</li>\n<li>В варианте Славы не оговорены ни сила, ни предел телекинеза, ни объём владения магией ветра.</li>\n<li>Носитель не назван, вселенная в карточке помечена как неясная.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0160--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0161.html\">Зависть (грех)</a></li>\n<li><strong>Упомянут в способностях:</strong> <a href=\"SP-0138.html\">Мана</a>, <a href=\"SP-0161.html\">Зависть (грех)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0160--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-12-24</td>\n<td>273904–273908</td>\n<td>w0068</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-24</td>\n<td>273917–273921</td>\n<td>w0068</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-25</td>\n<td>274463–274468</td>\n<td>w0068</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0160-len-greh.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0160--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0160.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
