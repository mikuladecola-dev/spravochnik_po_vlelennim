<script>const BASE="";const DOCNAME="Терианы (квадроберы)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0046-S01", "GR-0046--chto-eto"], "h": "<p>Субкультура-сообщество вселенной «монстры». Объяснена Миколаем в чате 2024-08-11 (id 217711–217728) — в ответ на прямой вопрос «а кто такие терианы знаешь?», на который Слава ответил «Нет».</p>\n<p>Определение дано дословно: «это люди которые себя ощущают животными и ведут соответственно», «тобиж как кошка например». Поведение расписано перечнем: «ходят на 4 лапах, выгибаются, трутся обо всё, сворачиваются к клубок».</p>\n<p>Распространённость: «среди детей нынче популярная практика, да и взрослых» (id 217718). То есть сообщество не ограничено детьми, хотя в сюжете фигурирует именно как детское увлечение.</p>\n<p>Отдельно оговорено, что это не занятие и не тренировка. Когда в разговоре всплыло слово «йога» (Слава набирал его как «ега», «ейга»; Миколай поправил — «йога брат»), Миколай сравнение отверг: «ну не», «не она», «они так прям живут» (id 217725–217727). Разграничение зафиксировано: терианство — не практика, которой занимаются, а образ жизни.</p>\n<p>Квадроберы — подмножество внутри того же явления: «он был квадробером», «это терианы которые не всегда себя так ведут», «это типо спорт» (id 217746–217752). Формулировка появилась как переформулировка, когда Слава не понял первое объяснение (два вопросительных знака подряд, id 217742–217743, и ответ Миколая «тогда иначе выражусь»). Там же Миколай отсёк созвучие: «не квадрокоптером» (id 217750).</p>\n<p>Разведка не ошиблась: это действительно группа — сообщество людей, а не один персонаж. При этом запись служебная: в сюжете сообщество работает как обоснование мотива одного персонажа (см. «Состав»).</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0046-S02", "GR-0046--sostav"], "h": "<ul>\n<li><strong><a href=\"PS-0049.html\">Кирилл</a> — Кирилл.</strong> Единственный названный участник. «кирил к ним относил себя» (2024-08-11, id 217729). Мальчик шести лет, психического возраста почти четыре. Фанат субкультуры со стороны коротких видео: «помимо этого он ещё обожает листать короткие видео, в частности о терианах. да, Кирилл фанат этой субкультуры» (2024-08-10, id 217239). Себя ощущал птицей: «но он считал себя птицей» (id 217731), причём эта самоидентификация в переписке названа причиной его желания летать.</li>\n</ul>\n<p>Больше никого поимённо в состав не записано. Численность сообщества не названа, кроме общего «среди детей нынче популярная практика, да и взрослых».</p>\n<p>Отдельно: <strong>Беркут (<a href=\"PS-0134.html\">Беркут</a>)</strong> в состав не входит. Он материализованный монстр, у которого есть черты териана — «этот монстр был характерными для териана чертами, но настоящими крыльями и головой, даже точный видовой киль имеется» (2024-08-10, id 217239), и позже «беркут был частично похож на человека, который с оперением на голове» (2024-08-11, id 217737). Черты териана он получил потому, что таким его представлял Кирилл; членом сообщества его нигде не называют.</p>", "r": [["Кирилл", "PS-0049.html"], ["Беркут", "PS-0134.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0046-S03", "GR-0046--obschie-sposobnosti-gruppy"], "h": "<p>Общее у участников — поведение, а не умения. Названо: ходьба на четырёх конечностях, выгибание, трение обо всё, сворачивание клубком (id 217715).</p>\n<p>Сверхъестественных способностей за терианами в переписке не названо ни разу. Наоборот, отсутствие возможностей проговорено прямо на примере Кирилла, считавшего себя птицей: «он не имеет крыльев», «и не мог даже с земли взлететь» (id 217739–217740). Способ полёта ему приходилось искать — «он искал способ полететь» (id 217741).</p>", "r": []}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0046-S04", "GR-0046--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p><strong>По степени постоянства.</strong> Териан ведёт себя как животное всегда — «они так прям живут». Квадробер — «терианы которые не всегда себя так ведут», для него это «типо спорт» (id 217746–217752). Кирилл отнесён именно к квадроберам.</p>\n<p><strong>По животному.</strong> В качестве примера Миколай назвал кошку («тобиж как кошка например»). Кирилл — птица. Различие оказалось для сюжета определяющим: птичий вариант в сообществе, по словам Миколая, не встречается вовсе — «он не видел примера где кто-то так делал», «ни одной птицы квадробера нет» (id 217754–217755). В версии от 2024-08-10 то же сказано словами самого затруднения Кирилла: «его смущает, что нету не одного териана орнитотропа, как минимум летающего».</p>\n<p><strong>Следствие для Кирилла.</strong> Из-за отсутствия примера он не практиковался, а изучал: «поэтому он в основном изучал их», «чтобы потом практиковаться» (id 217756–217757). Практиковаться он начал только когда появился Беркут: «и тут», «удачная возможность», «появился пример», «появились крылья», «хули не попробовать» (id 217758–217762).</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S05", "GR-0046-S05", "GR-0046--kak-menyalas"], "h": "<p><strong>2024-08-10 (id 217239).</strong> Первое упоминание — внутри целиком написанной Миколаем истории. Субкультура названа, но не объяснена: сказано только, что Кирилл её фанат, смотрит о ней короткие видео и что его смущает отсутствие териана-орнитотропа. Слово «квадробер» ещё не звучит.</p>\n<p><strong>2024-08-11, 16:32–16:34 (id 217711–217728).</strong> Отдельное объяснение по прямому вопросу. Даны определение, перечень поведения, распространённость. Отвергнуто сравнение с йогой.</p>\n<p><strong>2024-08-11, 16:34–16:35 (id 217729–217737).</strong> Кирилл вписан в сообщество, уточнена его самоидентификация как птицы. Здесь же Слава выдвинул серию возражений к тому, что Кирилл — птица: «Почему самого начал не выпрыгнул с окна», «Почему разговаривал», «Почему не ел червей» (id 217734–217736), позже добавились «Почему разетку не вставлял» и «Почему не издавал звука полнта» (id 217747, 217749). По существу этих возражений Миколай не отвечал; ответом стало другое — уточнение статуса Кирилла.</p>\n<p><strong>2024-08-11, 16:37–16:38 (id 217744–217752).</strong> Уточнение, снимающее возражения: введено понятие квадробера. Кирилл переопределён из териана в квадробера — того, кто ведёт себя так не всегда. Именно здесь появляется «это типо спорт».</p>\n<p><strong>2024-08-11, 16:38–16:39 (id 217753–217762).</strong> Достроена связь субкультуры с сюжетом: отсутствие птиц-квадроберов объясняет, почему Кирилл только изучал птиц и почему появление Беркута стало для него возможностью.</p>\n<p>После 2024-08-11 сообщество в переписке не разрабатывается.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "GR-0046-S06", "GR-0046--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет. Назван один участник — Кирилл (<a href=\"PS-0049.html\">Кирилл</a>); больше никого.</li>\n<li>Численность не названа, ни для сообщества в целом, ни для города, где происходит действие.</li>\n<li>Иерархии нет: ни главных, ни ведущих, ни каких-либо ролей внутри сообщества в переписке не названо.</li>\n<li>Отношения с другими группами не названы вовсе. Как окружающие относятся к терианам, есть ли у сообщества противники или союзники — не сказано.</li>\n<li>Не сказано, знаком ли Кирилл с другими терианами лично или знает о них только по коротким видео. В тексте есть лишь то, что он «обожает листать короткие видео, в частности о терианах».</li>\n<li>Не сказано, состоят ли в сообществе друзья Кирилла (Паша и остальные); в переписке они проходят по другой линии — как «знающие» о Беркуте, не как терианы.</li>\n<li>Не сказано, какого именно животного считают своим взрослые участники и чем взрослое участие отличается от детского. Упомянуто только «да и взрослых».</li>\n<li>Осталось нерешённым, что происходит с сообществом после гибели Кирилла: судьба субкультуры в сюжете дальше не упоминается.</li>\n<li>Не объяснено, почему «ни одной птицы квадробера нет» — сказано только, что их нет.</li>\n<li>Возражения Славы (почему Кирилл разговаривал, не ел червей, не издавал звуков полёта) остались без ответа по существу; они сняты переопределением Кирилла в квадробера, а не разобраны.</li>\n</ul></div>", "r": [["Кирилл", "PS-0049.html"]]}, {"t": "Связи — всё вместе", "a": ["GR-0046--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0049.html\">Кирилл</a>, <a href=\"PS-0134.html\">Беркут</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0046--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0046.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0046-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0046/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — <code>ID-0091</code>, «Беркут возвращается каждые 3 месяца»: статьи нет, 2,7 КБ базы, одна ссылка (<code>VS-0015</code>). Это единственная запись, в которой сюжет продолжается за пределы гибели Кирилла — там «этих беркутов по миру много», предложение Славы про возвращение через три месяца и встречный вариант Миколая с мирным духом. Пробел «что происходит с сообществом после гибели Кирилла» упирается ровно в неё, и закрыть его больше неоткуда.</p>\n<p>Второе — обратный случай: <code>PS-0135</code>, «Паша (Пашка)». Статья есть, 12,4 КБ базы, входящих ссылок ноль. Здесь сказано, что неизвестно, состоят ли друзья Кирилла в сообществе; при этом ближайший друг лежит в базе отдельной статьёй, на которую не ссылается вообще никто. Дыра тут не в материале, а в том, что он ни с чем не соединён.</p>\n<p>Третье — <code>PS-0137</code>, «Терианство Кирилла» (5,4 КБ, две входящие ссылки). Тема та же, что у этой статьи, а ссылки идут туда; сюда — ни одной. Два входа в один предмет, и внешний мир базы знает про терианство через персонажа, а не через сообщество.</p>\n<p>Для порядка: по числам самая дорогая дыра во вселенной «монстры» — <code>SL-0013</code> («Список персонажей Славы», 10 КБ, две ссылки, статьи нет), но это перечень имён из другой линии (энергет, прятки, закон, петля...), к терианам он не ведёт.</p>\n<h3>С чего начать</h3>\n<p>Архив за этим вечером листать не надо — он уже в базе, просто лежит под чужим именем.</p>\n<p>Разговор, который здесь обрывается на id 217762, продолжается без паузы: сообщения 217763–217777 записаны в <code>PS-0134</code> («Беркут»). Там Миколай прямо объясняет, откуда взялась субкультура в сюжете: «я когда монстра создавал хотел чет выбрать из интересов и увлечений детей нашего времени», «я хотел скибиди туалет или сигму, но для балкона первый не подходит, второе долбоебизм». Это единственное место, где сказано, почему терианы вообще выбраны, и в статье о терианах его нет.</p>\n<p>Дальше в том же окне w0051: 217802–217805 (почему этот Беркут не вернётся — «он порождение желаний Кирилла») и 217806–217816 (<code>ID-0091</code>). Оттуда же тянется линия «беркутов много, они абсолютно разные», в которой сообщество уже не участвует.</p>\n<p>Остальное по кусту — <code>PS-0049</code> (23,2 КБ), <code>PS-0137</code> (5,4 КБ), <code>PR-0022</code> (12 КБ). Новый материал по самому сообществу в архиве искать бессмысленно: после 2024-08-11 слово в переписке не звучит, и если проверять, то только весь промежуток до конца августа — на предмет одного упоминания, а не разработки.</p>\n<h3>Как развивалось</h3>\n<p>Два дня. 2024-08-10 — субкультура появляется внутри целиком написанной истории, без объяснений: сказано только, что Кирилл её фанат и что его смущает отсутствие териана-орнитотропа. 2024-08-11, 16:32 — отдельное объяснение по прямому вопросу «а кто такие терианы знаешь?»: определение, перечень поведения, распространённость; тут же отсечено сравнение с йогой — «ну не», «не она», «они так прям живут». 16:34 — Кирилл вписан в сообщество, и следом идёт серия возражений Славы: почему не выпрыгнул из окна, почему разговаривал, почему не ел червей. 16:37 — «тогда иначе выражусь», вводится квадробер, Кирилл переопределён; возражения после этого не звучат. 16:38 — сообщество пристёгнуто к сюжету: птиц-квадроберов нет, поэтому Кирилл изучал, а не практиковался, поэтому Беркут стал возможностью. 16:39 — разговор уходит к выбору темы монстра и больше к терианам не возвращается.</p>\n<p>Понятие квадробера появилось не как расширение, а на возражениях: между вопросом «почему не ел червей» и переопределением — три минуты.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Правило деления внутри сообщества названо, и названо по одному признаку — постоянству. Териан «так прям живёт», квадробер ведёт себя так «не всегда», для него «это типо спорт». На этой мерке держится вся конструкция: Кирилл переопределён именно через неё.</p>\n<p>Взрослые участники упомянуты в той же реплике, где дана распространённость: «среди детей нынче популярная практика, да и взрослых». По какой стороне мерки проходят они — не сказано ни слова. Признак деления сформулирован, а единственная другая названная часть сообщества под него не подведена.</p>\n<h3>Отклик</h3>\n<p>Самое интересное здесь — шов, который авторы не стали прятать. Слава задаёт вопросы, на которые ответить нельзя: почему Кирилл разговаривал, почему не ел червей, почему не издавал звука полёта, почему не совал пальцы в розетку. И Миколай не отвечает ни на один — он говорит «тогда иначе выражусь» и меняет категорию: Кирилл больше не териан, он квадробер, тот, кто ведёт себя так не всегда. Возражения не опровергнуты, они просто перестали относиться к делу. Приём честный и наглый одновременно, и он тут виден целиком, с таймингом.</p>\n<p>Второе, что зацепило, — птичья линия. «Ни одной птицы квадробера нет» — и из этого одного отсутствия вырастает всё: почему шестилетний мальчик не играл, а изучал; почему он ждал; почему появление существа с крыльями сработало как разрешение, а не как чудо. Ребёнок, которому для того, чтобы быть собой, не хватало примера. Это сильнее, чем сам монстр.</p></div>", "r": []}];</script>
