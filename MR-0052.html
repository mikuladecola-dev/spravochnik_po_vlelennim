<script>const BASE="";const DOCNAME="Монстры и вера";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0052-S01", "MR-0052--ustroystvo"], "h": "<p>Центральное правило вселенной, которое Миколай разворачивает 2024-08-11 (окно w0051) под вопросами Славы. Разбор идёт вокруг уже написанного рассказа про Кирилла и Беркута (<a href=\"MR-0051.html\">Материализация монстров из желаний и веры</a>): Слава ищет в правиле противоречия, Миколай на ходу дописывает оговорки.</p>\n<p><strong>Базовое правило.</strong> «вера порождает монстров» (id 217835). Источник идеи назван прямо: «ща и идея была у меня взяла из бездомного бога» (id 217830). Слава оценил правило как «Тупо» (id 217836), Миколай ответил «нихуя».</p>\n<p><strong>Сила.</strong> «сила веры и количество верующих определяет силу монстра» (id 217841). Позже уточнено: «чем больше других людей разделяют веру в него тем могущественнее он становится» (id 217862). Про Беркута сказано: «в этого верил весь город и кто-то из интернета» (id 217843).</p>\n<p>Вера при этом отвечает только за материализацию, а не за неуязвимость: «ну так она определяет силу его материализации не более» (id 217917). Отсюда — уязвимость через контакт: «если ты взаимодействуешь с этой материализацией, ты можешь её убить» (id 217918).</p>\n<p>Влияние веры на материализацию одинаково у всех людей, различается только её качество: «у всех вера влияет одинаково на материализацию», «качество разное» (id 217988–217989).</p>\n<p><strong>Родитель.</strong> «у монстра есть один родитель» (id 217861). Родитель — тот, кто определяет характер существа: «так не один Кирилл в него верит, родители в плане тот кто определяет его характер» (id 217913), и с ним же связаны внешность и суть: на вопрос, в каком смысле монстр умирает, если вера осталась, — «его внешность и суть» (id 217915). Основное желание родителя переходит на монстра: «основное желание родителя отражается на монстре» (id 217984).</p>\n<p>Вера родителя отличается от остальной: «истинная вера только у родителя», «никто не знает существо также как родитель» (id 217939–217940). Без родителя существо не исчезает, но и прежним не остаётся: «без него оно может трансформироваться», «но оно не станет таким же» (id 217941–217942).</p>\n<p><strong>Оговорки к правилу</strong> (id 217852–217868), выданные подряд после того, как Слава упёрся в вопрос «Так в него же все равно верят»:</p>\n<ul>\n<li>«монстров вера не сразу поражает»;</li>\n<li>«не всегда даже при негативных мыслях они взаимодействуют с с миром»;</li>\n<li>«они могут и не родиться от веры»;</li>\n<li>«они могут умереть»;</li>\n<li>«даже если в них верят»;</li>\n<li>«могут заново родиться»;</li>\n<li>«одно убийство делает дух злым».</li>\n</ul>\n<p>Возрождение привязано к живому родителю: «и если бы Кирилл был жив была бы возможность возродится» (id 217920).</p>\n<p><strong>Злость.</strong> Помимо правила «одно убийство делает дух злым», названа вторая причина — страх окружающих. На вопрос Славы, почему монстр стал злым, «ведь вера обычного народа влиять на него слабо», ответ: «его боялись, страх это сильная эмоция» (id 217985–217986).</p>\n<p><strong>Легенда против веры.</strong> После того как вариант с массовым стиранием памяти был отменён (см. ниже), Миколай развёл два понятия: то, что остаётся после смерти монстра, — не вера, а легенда. «вера осталась», «но это не надо конкретно верой называть», «просто вот мол легенда епт», «это форсят копипасты» (id 217934–217937). Слава с этим не согласился: «Вера осталась значит монстр жив» (id 217938).</p>\n<p><strong>Сложность механизма.</strong> Собственный итог Миколая: «механизм материализации сложный», «походу придётся целое эссе писать» (id 217943–217944). Эссе в переписке не появилось.</p>", "r": [["Материализация монстров из желаний и веры", "MR-0051.html"]]}, {"t": "Население", "a": ["S02", "MR-0052-S02", "MR-0052--naselenie"], "h": "<p>Разбор ведётся на примере уже существующих персонажей.</p>\n<p><strong>Беркут</strong> — монстр, порождённый верой; в него «верил весь город и кто-то из интернета». К моменту гибели ослаб: «о нем знали мб помнили, но он уже не вызывал ужаса, почти на всех балконах защита, родители детей не подпускают к балконам» (id 217848), «а вот монстр к тому моменту порядком ослабел» (id 217864). Утратил силу настолько, что не мог выполнять то, чем был страшен: «то что он насильно может скинуть людей, ну сейчас он даже ребенка бы не скинул» (id 217867). Убит: «да», «его убили» (id 217844–217845).</p>\n<p><strong>Кирилл</strong> — родитель Беркута. Его смерть монстра не убила, потому что «не один Кирилл в него верит», но лишила возможности возрождения.</p>\n<p><strong>Защитник</strong> — тот, кто убил Беркута. О нём сказано: «защитник не слабак» (id 217863), «защитник его смог убить ибо как минимум он его может коснуться» (id 217865), «а об оружии его не говорилось» (id 217866). Прямо с Пашкой из рассказа в этом окне он не отождествлён.</p>\n<p>Файл сущности отмечает связи с «Беркут», «Кирилл», «Ограничения силы монстров», «Типы зарождения монстров», «Что такое монстр» — id для них в исходнике не приведены.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0052-S03", "MR-0052--mesto-vo-vselennoy"], "h": "<p>Вселенная — «монстры», отнесение по дате объявления; в самой переписке вселенная нигде не названа.</p>\n<p>Правило продолжает и переформулирует механику из <a href=\"MR-0051.html\">Материализация монстров из желаний и веры</a> «Материализация монстров из желаний и веры»: там существо порождало желание, здесь — вера, а желание родителя остаётся отдельным фактором, который «отражается на монстре».</p>\n<p>Про типы зарождения монстров Миколай пояснил, что приведённые ранее примеры не были продуманной системой: «если про рождение, эт просто примеры разнообразия хз, захотел у нейронки узнать и заодно кинул сюда» (id 217911).</p>", "r": [["Материализация монстров из желаний и веры", "MR-0051.html"]]}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0052-S04", "MR-0052--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-08-11, 16:52–16:55 (id 217828–217847).</strong> Правило вводится одной строкой — «вера порождает монстров» — со ссылкой на «Бездомного бога», и сразу дополняется мерой силы: «сила веры и количество верующих определяет силу монстра». Слава немедленно ставит главное возражение, вокруг которого крутится весь остальной разбор: «Вера некуда не исчезает, когда монстр умирает» (id 217838) и «И как он умер, вираже осталась» (id 217847). Миколай сначала отрицает саму смерть монстра — «так в моей истории монстр и не умер» (id 217839), — но затем подтверждает: «его убили».</p>\n<p><strong>Версия 2 — 2024-08-11, 16:55–17:02 (id 217847–217870).</strong> Ответ на возражение — набор оговорок, снимающих жёсткую связь «вера есть, значит монстр есть»: вера действует не сразу, не всегда даёт взаимодействие с миром даже при негативных мыслях, монстр может не родиться, может умереть при живой вере, может родиться заново. Здесь же вводятся фигура единственного родителя, зависимость могущества от числа разделяющих веру и правило «одно убийство делает дух злым». Одновременно объясняется гибель Беркута через ослабление веры (защита на балконах, отсутствие ужаса) и через контакт («он его может коснуться»).</p>\n<p><strong>Версия 3 — 2024-08-11, 17:23–17:34 (id 217911–217946).</strong> Разбор смерти доводится до разделения понятий: вера отвечает за силу материализации, а не за бессмертие; материализацию можно убить, взаимодействуя с ней; возрождение возможно только при живом родителе. Здесь выдвигается и тут же отменяется версия про стирание памяти (см. отклонённые варианты). Итогом вводится различение веры и легенды и вводится «истинная вера только у родителя». Разбор Миколай закрывает вопросом «есть ещё вопросы?».</p>\n<p><strong>Версия 4 — 2024-08-11, 17:53–17:55 (id 217983–217990).</strong> Дополнения: желание родителя отражается на монстре (для Беркута — желание Кирилла просто полетать), злым монстра сделал страх окружающих как сильная эмоция, влияние веры на материализацию у всех одинаковое и различается только качеством. Слава тут же выводит из последнего противоречие: «Тогда он должен быть бессмертным если вера влиять одинаково» (id 217990) — ответа в приведённом фрагменте нет, обсуждение обрывается.</p>", "r": []}, {"t": "Отклонённые варианты", "a": ["S05", "MR-0052-S05", "MR-0052--otklonennye-varianty"], "h": "<ul>\n<li><strong>Массовое стирание памяти.</strong> Предложено как объяснение того, куда девается вера после смерти монстра: «возможно при смерти этой материальной сущности после смерти родителя, умирают и воспоминания у людей об этой сущности» (id 217922), «просто стирается существование этого существа» (id 217929). Слава: «Тогда массовая потеря памяти», «Это глупо», «Массовая потеря памяти и даже СМИ который все это записывали и снимали все забыли» (id 217925–217930). Миколай вариант снял: «ну епта, нет массовой потери памяти тогда» (id 217933) — и заменил его различением веры и легенды.</li>\n<li><strong>Линия Славы про автора игры.</strong> Слава предлагал что-то, отталкиваясь от того, что автор игры выпустил и другие игры: «Тогда автор этой игры создал ещё игры», «Он создал более 100 игар» (id 217828, 217831). Миколай отклонил: «ну я понимаю твою задумку, но как по мне это баян» (id 217829). Содержание самой задумки в переписке не изложено.</li>\n<li><strong>Примеры типов зарождения монстров, полученные от нейросети,</strong> — заявлены как несерьёзные: «эт просто примеры разнообразия хз».</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S06", "MR-0052-S06", "MR-0052--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вселенная нигде не названа.</li>\n<li>Возражение Славы «Вера осталась значит монстр жив» и вывод «Тогда он должен быть бессмертным если вера влиять одинаково» остались без ответа: обсуждение обрывается на его вопросах и продолжается в следующем окне.</li>\n<li>Что именно делает веру «истинной» у родителя и чем она отличается по механике от веры остальных — не описано, кроме «никто не знает существо также как родитель».</li>\n<li>Во что именно может «трансформироваться» существо без родителя — не сказано.</li>\n<li>Обещанное эссе про механизм материализации не написано.</li>\n<li>Кто такой «защитник», убивший Беркута, и чем он его убил — не сказано: «а об оружии его не говорилось».</li>\n<li>Правило «одно убийство делает дух злым» и объяснение через страх окружающих между собой не согласованы.</li>\n<li>Реплика Славы «Я про то что ты написал что родитель 100 суицидник» (id 217987) отсылает к тексту, которого в собранных фрагментах нет.</li>\n<li>Навигация файла указывает основной массив 217830–217962 и продолжение 217968–218014, но в версии вошли только 217828–217847, 217847–217870, 217911–217946 и 217983–217990; промежутки 217871–217910, 217947–217982 и 217991–218014 в исходник не попали.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0052--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0051.html\">Материализация монстров из желаний и веры</a></li>\n<li><strong>Упомянут в мирах:</strong> <a href=\"MR-0051.html\">Материализация монстров из желаний и веры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0052--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-11</td>\n<td>217828–217847</td>\n<td>w0051</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-08-11</td>\n<td>217847–217870</td>\n<td>w0051</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-08-11</td>\n<td>217911–217946</td>\n<td>w0051</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-08-11</td>\n<td>217983–217990</td>\n<td>w0051</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0052-monstry-i-vera.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0052--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0052.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
