<script>const BASE="";const DOCNAME="Чёрное озеро";
const LEAD="";
const CH=[{"t": "Содержание", "a": ["S01", "IS-0084-S01", "IS-0084--soderzhanie"], "h": "<p>Незаконченный рассказ Славы, выложенный целиком в один заход тремя сообщениями подряд (2026-02-08, id 430010–430013). Повествование от первого лица, рассказчик — Сергей.</p>\n<p>Открывается рассказ тем, чего герою хотелось бы: «Знаете после работы под летним жарким солнцем. Мне нужно просто отдохнуть. Окунуться в холодную воду, чтобы холод колол мою кожу, заставил горячую голову шуметь. Чтобы наконец-то прийти в себя и воскреснуть». Вместо этого он идёт «с потными мужиками в дремучей лес», держа в руках увесистый топорик. Остальные тоже вооружены: вилы, топоры, фонарики, и «лишь у местного охотника двустволка». Сам герой оценивает происходящее так: «Картина того как мужики с вилами топорами идут в лес скажем честно и смешная и страшная».</p>\n<p>Что именно произошло, герой не знает, и выясняет по дороге у Мишки, «близкого приятеля в этой деревне». Из разговора складывается обстановка:</p>\n<ul>\n<li>электричества в деревне нет с двух часов дня, а на момент выхода в лес уже закат;</li>\n<li>связь не ловит;</li>\n<li>мужики, у кого есть машина, уехали в город узнать, почему выключили электричество, и до сих пор не вернулись;</li>\n<li>на внука Любки кто-то напал и полоснул руку. Володя, который бинтовал, «говорил, что нервы задела и пацан больше не сможет, как прежде рукой махать»;</li>\n<li>кто напал — неизвестно, известно только, что он «в лес убежал»;</li>\n<li>сам пострадавший пацан говорит, «что чудовищя какой. Ну ему конечно некто не поверил. В шоке пацан просто».</li>\n</ul>\n<p>Герой отмечает, что мог и не идти: толпы хватило бы и без него, а он мог остаться пить чай с бутербродом. Никто ему изначально ничего не объяснил — «И они просто толпой мимо моего забора прошли и начали созывать и выкрикивать дружной толпой разные слова, что хрень пойми, о чем они. Ну и я дурак подался коллективному помешательству и пошёл за ними». Поворачивать назад ему уже кажется «по-дурацки».</p>\n<p>Дальше — переход по времени и долгий проход по лесу. Герой в деревне недавно, к лесу не привык, спотыкается «раза четыре», падает мордой в землю, его кусают комары, впереди идущие отпускают ветки ему в лицо. Лес описан как «Неприятный лес скажю честно. Густой, что даже яркий звезды закрывает», притом что «в деревне звезды горят в разы ярчее, чем в городах». Слышно только монотонное дыхание толпы и шаги. Герой замечает, что уверенность толпы напускная: Васька, «как видимо успевший притронуться к рюмке», вечно спотыкается и кряхтит; Мишка трясётся и оглядывается на любой шорох.</p>\n<p>Толпу останавливает запыхавшийся мужик, имени которого герой не знает («Не со всеми успел познакомиться»), и предлагает возвращаться: ночью можно заблудиться. Старик с ружьём спрашивает, что тот предлагает; толпа быстро соглашается расходиться — кто-то напоминает, что ему свиней кормить. Те, кто хотел продолжать, оказываются в меньшинстве. Герой «внутренний ликовала» и разворачивается в обратную сторону.</p>\n<p>Дальше — «Хрусть...», а затем чавкающий звук сзади. Лучи фонарей выхватывают существо: «Массивного лохматого зверя стоящий на двух ногах». Описание даётся с оговоркой самого рассказчика — «Нет... Ну он... Как бы.. Я не знаю» — и затем прямо: «это было существо под два метра ростом и также в ширене. Покрытой черной шерстью. Он был без шее. То есть голова и сразу плечи. Глаза его горели оранжовым огнем. А в своей массивной руке он держал раздавленную голову». Хруст и чавканье шли именно от раздавленной головы.</p>\n<p>Наступает пауза, в которой «как будто даже время остановилась в этот блядский миг»: мужики держат на чудовище лучи фонарей, боясь потерять его из виду, герой боится «хоть малейшим писком оборвать такой хрупкий мир». Пауза кончается выстрелом старого охотника прямо в морду чудовищу. Чудовище ревёт, «давай понять, что даже прямой выстрел голову ему нипочём», и этот крик становится сигналом к бегству: «Мы бежали сбросив фонарики, топоры и вилы».</p>\n<p>Герой отстаёт, потому что спотыкается о корни. Шагов чудовища не слышно, и это его не успокаивает: «Ведь он также тиха пробрался к нам не издав не звука. Мне было в разы легче когда я его видел и мог хоть как-то понимать, что он будет делать, а сейчас нихрена не ясна». Крикнуть, чтобы подождали, он боится — страшно выдать себя, и «в горле мерзкая липкая субстанция, что не даёт издать звуков». Вариант залезть на дерево он отвергает сам: «Нет он его лёгким движением повалит». На переборе вариантов он проваливается левой ногой в яму и слышит «сука знакомый звук.... Хруст..» — ломает ногу. Боль такая, что крик не срывается.</p>\n<p>Второй эпизод (id 430012). Герой вынимает ногу, она «бессильно висит словно культяпка», крови вроде нет, но «не видна не зги». Услышав чей-то топот, он ползёт на звук, взяв по пути плотную ветку, с мыслью «Блять кто бы ты не был сука помоги». Бегущий спотыкается и с размаху ударяется о дерево — это оказывается «пьяный, старый Васька, у которого вроде как не всё дома в голове».</p>\n<p>Васька подбегает, хватает героя за руку и бесцеремонно тащит; от рывка сломанная нога выворачивается, и герой не выдерживает: «СУКА Стой!». Испугавшись, что крик их выдал, он закусывает свободную руку так, что «через мгновения в рот полелась горячая жидкость», и не замечает этого, продолжая кусать себя. Васька останавливается у ямки, сбрасывает героя туда, забрасывает землёй, травой и ветками, потом «встал отряхнулся, посмотрел на меня и кивнув побежал куда-то». Никаких объяснений Васька не даёт — «принимает какой решений, которым не спешил делиться со мной».</p>\n<p>Лёжа в яме, герой мёрзнет, боль ослабевает, но не исчезает, и всё перекрывается страхом, «что тебя найдёт Это». Когда ничего не происходит, разум успокаивается, и идёт поток мыслей, приведённый в тексте отдельными строками: «Это вообще рельно?», «Чудовище в лесу», «Хруст и чавканье», «Может..», «Если предположить», «Я что сошёл с ума», «Или это плата за грехи», «Но я же не виновен?», «Я не хотел», «И что дальше», «Как я со сломанной ногой дойду до деревни?». Затем адреналин отступает, приходит усталость, и герой засыпает.</p>\n<p>Финальный эпизод — утро. Птицы, солнце, «Тёплый лучи солнце согревают и лечат всю усталость. И жёлтая жидкость...... Чего?» На героя мочится мужчина, который его не заметил и отскакивает, застёгивая штаны, с извинениями. Мужчина описан как «высокий и подтянутый мужчина в делай рубашке и в чёрных джинсах. Явно не с деревни». Герой пытается встать, нога не зажила, он падает и стонет. Мужчина отходит, подбирает пару крепких веток и говорит: «эй! Не знаю, что произошло но тебе лучше шину сделать. Нога у тебя кажись сломанная», подходя медленно, «словно боясь спугнуть».</p>\n<p>Герой хватает ветку и машет вокруг себя с мыслью «может это чудовищя», требует: «отвечай кто ты. Ты же не из местных, а значит замаскировался сука!». Мужчина сначала наклоняет голову вправо, «Словно спрашивая \"о чем ты?\"», потом его глаза расширяются, как будто он что-то вспомнил, и он начинает искренне смеяться — «И лес до этого поглативший только крики отчаяния и рёв монстра, погладил смех». Отсмеявшись и вытерев слезинки, он произносит последнюю реплику текста:</p>\n<div class=\"q\"><p>«ты меня с водеными перепутал кажись?»</p></div>\n<p>На этой фразе выложенный текст обрывается. Что такое водяные, кто такой мужчина и как он связан с чудовищем — в выложенном куске не сказано.</p>", "r": []}, {"t": "Персонажи", "a": ["S02", "IS-0084-S02", "IS-0084--personazhi"], "h": "<p><strong>Сергей</strong> — рассказчик, от чьего лица идёт весь текст. В деревне живёт недавно («недавно здесь обоснавался»), знает не всех, к лесу не привык. Работает — целый день перед походом работал под солнцем. Идёт в лес с топориком, ломает левую ногу, проводит ночь в яме, засыпанный землёй и ветками. Имя названо в диалоге с Мишкой: «а Сергей ты чтоль?».</p>\n<p><strong>Мишка</strong> — «близкий приятель в этой деревне», через которого герой узнаёт всю фактическую обстановку (свет, связь, уехавшие в город, нападение на внука Любки). По ходу похода нервничает, трясётся и оглядывается на любой шорох.</p>\n<p><strong>Васька</strong> — старый, пьяный, «у которого вроде как не всё дома в голове». В походе постоянно спотыкается и кряхтит. Именно он находит сломавшего ногу героя, тащит его, сбрасывает в ямку, забрасывает землёй, травой и ветками — то есть прячет — и убегает, кивнув. Мотивов и планов не объясняет.</p>\n<p><strong>Чудовище из леса</strong> — двухметровое существо, «под два метра ростом и также в ширене», покрытое чёрной шерстью, без шеи («голова и сразу плечи»), с глазами, горящими оранжевым огнём; в руке держит раздавленную голову. Стоит и передвигается на двух ногах, двигается беззвучно. Прямой выстрел в голову из двустволки его не берёт — только вызывает рёв. Предположительно оно же напало на внука Любки, но в тексте это не утверждается: там сказано только, что пацан говорит про «чудовищя какой» и что ему не поверили.</p>\n<p><strong>Мужчина в белой рубашке</strong> — появляется утром, высокий и подтянутый, в белой рубашке и чёрных джинсах, «Явно не с деревни». Мочится на засыпанного землёй героя, не заметив его; извиняется, предлагает сделать шину, разбирается в переломах на глаз. На обвинение в маскировке реагирует непониманием, потом чем-то вспомнившимся и смехом. Произносит единственное в тексте упоминание водяных.</p>\n<p><strong>Водяные</strong> — только упомянуты, в самой последней реплике мужчины. Никаких свойств, описания и роли в выложенном тексте нет.</p>\n<p><strong>Старый охотник (старик с ружьём)</strong> — единственный в толпе с двустволкой. Отвечает запыхавшемуся мужику («ну и что предлагаешь») и первым нарушает замершую сцену, выстрелив чудовищу в морду.</p>\n<p><strong>Запыхавшийся мужик</strong> — имени рассказчик не знает. Останавливает толпу и предлагает возвращаться, чтобы не заблудиться ночью.</p>\n<p><strong>Упомянутые, но не появляющиеся:</strong> внук Любки — пострадавший, которому полоснули руку; Володя — тот, кто бинтовал руку и сказал про задетые нервы; Любка; уехавшие в город на машинах мужики, которые не вернулись.</p>\n<p>В карточке записи среди связанных сущностей значится также <strong>Вина</strong> — в тексте ей соответствуют строки внутреннего монолога «Или это плата за грехи» и «Но я же не виновен? / Я не хотел». Прямо в переписке эта связь не проговорена.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Дороже всего чинить не персонажей — все они (Мужчина в белой рубашке, Чудовище из леса, Водяные) уже получили свои статьи. Дыра — в том, что рассказ анонсирует сразу после себя: идея «Виновен?» (<code>ID-0165</code>), на которую ссылается именно эта статья и больше никто. Статьи о ней нет, а материал в базе — 2772 байта — уже есть. Пока «Виновен?» без статьи, связь между двумя рассказами Славы («плата за грехи», «но я же не виновен?») повисает без опоры.</p></div>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "IS-0084-S03", "IS-0084--mesto-vo-vselennoy"], "h": "<p>Вселенная в переписке не названа; в записи проставлена как «7 островов» по дате объявления. В самом тексте никаких привязок к другим мирам, островам или известным местам нет.</p>\n<p>Единственная точка стыковки с остальным материалом — водяные, названные в последней реплике мужчины в белой рубашке (id 430013). Связь с чем-либо ещё в переписке не проговорена.</p>\n<p>Отдельно: сразу после выкладки Слава сообщает, что думает над новой историей — «Вообще я думаю над новой истории с названием \"виновен?\"» (id 430014). Как эта будущая история связана с «Чёрным озером» и связана ли вообще, в переписке не сказано; общим остаётся только мотив вины, звучащий в мыслях героя в яме.</p>", "r": []}, {"t": "Состояние", "a": ["S04", "IS-0084-S04", "IS-0084--sostoyanie"], "h": "<p>Не закончена. Автор предупреждает об этом до выкладки: «История есть. Но она не законченая скидывать?» (id 430005). Миколай отвечает «кидай» и добавляет «и на следующей неделе тоже жду» (id 430007–430008), а также говорит, что сам сегодня попробует что-нибудь написать.</p>\n<p>Текст выложен целиком 2026-02-08 в 13:00 тремя сообщениями (id 430010, 430011, 430012) плюс четвёртое, обрывающееся на реплике про водяных (430013). Правок, переписываний и продолжения в окне w0116 нет — вторая зафиксированная версия записи (id 430040–430070) состоит только из реакций Миколая по ходу чтения, без изменений текста.</p>\n<p>Реакции Миколая по ходу чтения (2026-02-08, id 430040–430070), в порядке поступления: «красиво», «то самое», «облом», «хм, на кого они охотятся», «охота на бесов», «страшно», «и че нету связи», «эх», «эх, жалко», «красиво», «и моча..». После прочтения: «я прочитал», «полностью», «круто написана история», «мне нравится», «герой очень живой», «все живые», «и описания сцен красивые». Затем — реакция на сообщение про новую историю: «ооо», «интересно», «ты про эту?», «или другое».</p>\n<p>Отдельная пометка Миколая (id 430069–430070): «пока про озеро ничего не было», «а, у этой же есть» — то есть заглавное чёрное озеро в выложенном куске так и не появилось.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "IS-0084-S05", "IS-0084--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Название «Чёрное озеро» в выложенном тексте не отыгрывается: озера в нём нет вообще. Это отмечает и Миколай: «пока про озеро ничего не было». Единственная вода в тексте — та, в которой герой хотел бы окунуться в первом абзаце. Связь названия с сюжетом в переписке не объяснена.</li>\n<li>Вселенная нигде не названа.</li>\n<li>Кто такие водяные, чем они отличаются от чудовища и почему герой мог перепутать с ними мужчину — не сказано. Текст обрывается на этой реплике.</li>\n<li>Кто такой мужчина в белой рубашке, откуда он в лесу утром и что он вспомнил перед тем, как засмеяться, — не сказано.</li>\n<li>Что стало с деревней, с ушедшими в лес мужиками, с Васькой, Мишкой и старым охотником после бегства — не сказано.</li>\n<li>Причина отключения света и связи не названа; уехавшие в город мужики в тексте так и не возвращаются.</li>\n<li>Чья была раздавленная голова в руке чудовища — не сказано.</li>\n<li>Не сказано, то ли это существо, что напало на внука Любки; в тексте есть только слова самого пацана про «чудовищя какой», которым не поверили.</li>\n<li>Чем кончается утренняя сцена и дошёл ли герой до деревни со сломанной ногой — не написано, история на этом месте прервана.</li>\n<li>Связь с историей «виновен?», которую Слава анонсирует следом (id 430014), осталась непрояснённой: Миколай спрашивает «ты про эту? / или другое», ответ в окне не зафиксирован.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["IS-0084--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0035.html\">Водяные</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["IS-0084--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-02-08</td>\n<td>430005–430014</td>\n<td>w0116</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-02-08</td>\n<td>430040–430070</td>\n<td>w0116</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/istorii/IS-0084-chernoe-ozero.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["IS-0084--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/IS-0084.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["IS-0084-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/IS-0084/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дороже всего чинить не персонажей — все они (Мужчина в белой рубашке, Чудовище из леса, Водяные) уже получили свои статьи. Дыра — в том, что рассказ анонсирует сразу после себя: идея «Виновен?» (<code>ID-0165</code>), на которую ссылается именно эта статья и больше никто. Статьи о ней нет, а материал в базе — 2772 байта — уже есть. Пока «Виновен?» без статьи, связь между двумя рассказами Славы («плата за грехи», «но я же не виновен?») повисает без опоры.</p>\n<h3>С чего начать</h3>\n<p>Материал в базе, не в архиве: <code>kb/sushnosti/idei/ID-0165-vinoven.md</code>. Смотреть туда раньше, чем снова лезть в окно w0116, — там, возможно, уже есть ответ на вопрос Миколая «ты про эту? / или другое», который в самом окне так и остался без ответа.</p>\n<h3>Как развивалось</h3>\n<p>Рассказ вышел одним заходом, без предварительных версий и без последующих правок: автор сразу предупредил, что он не закончен, выложил три сообщения подряд, получил только реакции по ходу чтения — и на этом остановился. Развития по датам здесь нет, есть один эпизод, оборванный на реплике про водяных.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Название рассказа — «Чёрное озеро» — держится только как заголовок; в самом тексте озера нет, воды нет вовсе, кроме желания героя в первом абзаце в неё окунуться. Для других рассказов заголовок обычно отыгрывается прямым эпизодом или образом — здесь этого нет, и даже Миколай сам это заметил в процессе чтения.</p>\n<h3>Отклик</h3>\n<p>Цепляет не чудовище, а пауза перед выстрелом — «как будто даже время остановилось в этот блядский миг», когда все держат лучи фонарей на звере, боясь и потерять его из виду, и спугнуть тишину лишним звуком. Это единственное место в тексте, где страх передан не действием, а бездействием, и он там держится дольше, чем сама погоня.</p></div>", "r": []}];</script>
