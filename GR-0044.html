<script>const BASE="";const DOCNAME="Вампиры";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0044-S01", "GR-0044--chto-eto"], "h": "<p>Раса монстров вселенной «монстры». Названа во множественном числе внутри одной истории — «Истории про Горгону и Асешу» (<a href=\"PR-0026.html\">История про Горгону и Асешу («ну завтра я точно смогу пригласить Асешу погулять»)</a>, 2024-08-11, id 218119–218123), которую Миколай выложил в чат целиком двумя сообщениями. В самой истории рассказчик говорит о вампирах как о виде, у которого есть общие свойства: «поэтому пришлось звонить знакомому другу вампиру, они очень сильные», «вы когда-нибудь видели вампиров с лишним весом», «у вампиров он тоже короткий, намного короче чем у людей».</p>\n<p>При этом на следующий день, в разборе с Славой (2024-08-12, id 218193–218297), Миколай отказался считать вампиров новым видом, введённым во вселенную. Слава сформулировал: «Так ты же добавил новый вид монстров в эту вселенную» (id 218232), Миколай ответил: «нет это не так, конкретно у нашего героя есть знакомый вампир, хули» (id 218233) и следом «монстр понятие растяжимое» (id 218234). До этого Слава заметил: «Ну не знаю у тебя так написано словно каждый второй монстор и все они живут в мире» (id 218228) — то есть впечатление общего мира с расселёнными монстрами Миколай тоже отверг.</p>\n<p>Так что статья описывает не оформленное сообщество, а расу-обобщение: свойства вампиров как вида проговорены (сила, метаболизм, короткий кишечник, превращение в летучую мышь, сон в гробу), а сообщества, поселения, численности и организации у них в переписке нет. Единственный названный представитель — один, Ник-Хан.</p>", "r": [["История про Горгону и Асешу («ну завтра я точно смогу пригласить Асешу погулять»)", "PR-0026.html"]]}, {"t": "Состав", "a": ["S02", "GR-0044-S02", "GR-0044--sostav"], "h": "<ul>\n<li><a href=\"PS-0142.html\">Ник-Хан</a> — Ник-Хан, друг рассказчика, живёт в пещере. Единственный вампир, названный по имени. Варианты имени в переписке: Ник, Хан.</li>\n</ul>\n<p>Других поимённых вампиров нет. Все прочие упоминания расы — обобщённые: «вампиры», «обычный вампир».</p>\n<p>Рассказчик истории (<a href=\"PS-0141.html\">Рассказчик истории про Горгону</a>) вампиром не является: он человек, который вампиру звонит. В споре Слава отдельно уточнял: «Какого хуя у него в друзьях вампир» (id 218209).</p>", "r": [["Ник-Хан", "PS-0142.html"], ["Рассказчик истории про Горгону", "PS-0141.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0044-S03", "GR-0044--obschie-sposobnosti-gruppy"], "h": "<p>Свойства, названные для вампиров вообще (2024-08-11, id 218122):</p>\n<p><strong>Сила.</strong> Вампиры «очень сильные». Мера силы в истории задана задачей: поднять и перенести окаменевшую девушку — «это же теперь каменная статуя которая весит не одну сотню килограмм», рассказчик про себя говорит «я никогда такой груз не подниму», а вампира зовёт именно для этого.</p>\n<p><strong>Худоба.</strong> «вы когда-нибудь видели вампиров с лишним весом. я в массовой культуре тоже не видел» — отсутствие толстых вампиров подаётся как наблюдение, которое надо объяснить.</p>\n<p><strong>Метаболизм и короткий кишечник.</strong> Основное правило расы, сформулированное так: «так вот они все худые не из-за того что могут превращаться в летучих мышей. и от того они очень сильные. не поняли прикол, да? у мышей невероятно быстрый метаболизм и короткий кишечник, кстати у вампиров он тоже короткий, намного короче чем у людей. еда если ещё проще, то еда быстрее переваривается и выходит из организма, и эффективней его наделяет энергией».</p>\n<p>Формулировка внутренне расходится: сначала сказано «не из-за того что могут превращаться в летучих мышей», а дальше объяснение идёт именно через мышиный метаболизм и мышиный кишечник. Правка этого места в переписке не обсуждалась.</p>\n<p><strong>Превращение в летучую мышь.</strong> Названо как общее свойство вампиров. У Ник-Хана превращение показано в действии: он превращается по требованию рассказчика, откладывает гуано на полу пещеры и возвращается в человеческий облик уже без жира — «представьте себе бодибилдера с мёртвой серой кожей. да, его метаболизм убрал весь жир, но мускулатуру зато очень возбудил и сделал невероятно объёмной». Сразу после превращения «его живот сильно прихватило и он захотел в туалет».</p>\n<p><strong>Мёртвая серая кожа.</strong> Названа при описании Ник-Хана после превращения; отдельно как свойство всей расы не проговорена.</p>\n<p><strong>Скорость перемещения.</strong> Ник-Хан живёт «в пещере за 2 тысячи километров от моего города», после звонка «через 1 минуты и 34 секунды он был на месте, благо ночь была». Он же переносит с собой людей: рассказчик «попросил нас увести к себе в комнату, ну точнее пещеру», и вместе с окаменевшей Асешей их переносят в пещеру, а затем обратно в город. Как именно происходит перемещение — не сказано.</p>\n<p>Оговорка «благо ночь была» — единственное в переписке указание на то, что время суток имеет значение. Прямо про вред дневного света не сказано.</p>\n<p><strong>Сон в гробу.</strong> Существует как норма для вампиров и назван только через отрицание для Ник-Хана: «только он не спит в гробу тысячелетиями».</p>", "r": []}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0044-S04", "GR-0044--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p>Названный вампир один, поэтому вся разница в переписке — это разница между Ник-Ханом и «обычным вампиром».</p>\n<p>Ник-Хан толстый, чего для вампира по правилу расы быть не должно. Объяснение дано в самой истории (2024-08-11, id 218122): «почему же у моего друга ожирение и что где сломалось? всё просто, он много ест и редко превращается в летучую мышь, метаболизм у него на самом деле даже сильнее чем у обычного вампира, только он не спит в гробу тысячелетиями. он каждый день поедает тонны жареных сверчков за просмотром сериальчиков и за написанием рецензий по ним. как вы заметили метаболизм у него всё ещё работает, но он его ограничивает».</p>\n<p>То есть отличия Ник-Хана от нормы вида:</p>\n<ul>\n<li>метаболизм сильнее, чем у обычного вампира;</li>\n<li>не спит в гробу тысячелетиями;</li>\n<li>редко превращается в летучую мышь и потому ограничивает свой метаболизм;</li>\n<li>много ест — «тонны жареных сверчков»;</li>\n<li>из-за этого имеет ожирение, тогда как вампиры «все худые».</li>\n</ul>\n<p>При превращении разница снимается: жир уходит, остаётся мускулатура «невероятно объёмной».</p>\n<p>В споре 2024-08-12 Миколай сводит отличие к двум пунктам. На вопрос Славы «В чем не обычность» (id 218197) отвечает «он толстый» (id 218198); позже на «я про то что твой вампир ничем не выделяется» (id 218236) отвечает «он более сильный» (id 218240).</p>\n<p>Прочие черты Ник-Хана, названные в истории и не отнесённые к расе: живёт в пещере; смотрит сериалы и пишет на них рецензии; держит коллекцию книг, но не читает их — книгу о снятии окаменения «он купил потому что обложка красивая, а так он сериалы смотрит», «по этой книги экранизации ещё не было». Об имени сказано: «более нелепого имени конечно не придумать, но что поделать, тогда это было достаточно красивое и редкое имя».</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S05", "GR-0044-S05", "GR-0044--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>С людьми.</strong> Тело вампира описывается через сравнение с человеческим: кишечник «намного короче чем у людей», сила больше человеческой настолько, что вампира зовут поднять то, чего человек не поднимет. Отношения при этом дружеские и бытовые: рассказчик просто звонит знакомому. На вопрос Славы, почему у героя в друзьях вампир, Миколай отвечает, что это частный случай, а не устройство мира: «конкретно у нашего героя есть знакомый вампир» (id 218233).</p>\n<p>Отношения не симметричные: рассказчик может распоряжаться вампиром. Требование превратиться и отложить гуано он подаёт как приказ — «я сказал, ну точнее на нервах я был психованный, поэтому правильнее будет сказать приказал ему превратиться в летучую мышь отложить кучку прямо на полу». Ник-Хан отказывается, «конечно он не хотел этого делать, это же мерзко, но я сильно настаивал и ему пришлось согласиться». Он же потом помогает донести Асешу обратно к подруге.</p>\n<p><strong>С Горгоной.</strong> Прямого контакта нет. Связь только через последствие: окаменение, наложенное горгоной, снимается с помощью вампирского гуано (<a href=\"SP-0103.html\">снятие окаменения гуано и спиртом</a>). Горгона и вампир в истории не встречаются, отношений между ними в переписке не названо.</p>\n<p><strong>С другими группами</strong> отношений не названо. Существование других вампиров кроме Ник-Хана подразумевается формулировками во множественном числе, но никакого вампирского сообщества, поселения или связи между вампирами в переписке нет.</p>", "r": [["снятие окаменения гуано и спиртом", "SP-0103.html"]]}, {"t": "Как менялась — по датам", "a": ["S06", "GR-0044-S06", "GR-0044--kak-menyalas"], "h": "<p><strong>2024-08-11, id 218119–218123.</strong> Раса появляется целиком в один заход, внутри истории. Здесь заданы: сила, худоба, короткий кишечник, быстрый метаболизм, превращение в летучую мышь, сон в гробу тысячелетиями, а также единственный представитель — Ник-Хан с его отклонением от нормы (ожирение, сверчки, сериалы, пещера, скорость 2000 км за 1 минуту 34 секунды). Тем же заходом гуано летучей мыши из его пещеры становится основой способа снятия окаменения (<a href=\"SP-0103.html\">снятие окаменения гуано и спиртом</a>).</p>\n<p><strong>2024-08-12, id 218193–218297.</strong> Разбор со Славой. Новых свойств расе не добавлено, зафиксированы позиции сторон.</p>\n<p>Слава трижды заявляет, что вампир не выделяется: «Сам вид монстров как вампир ничем не примечателен» (id 218201), «И снова же вампир обычный» (id 218224), «я про то что твой вампир ничем не выделяется» (id 218236). Также: «При этом без какого либо его раскрытия либо изуминки этот перс выглядит так словно про него забудут» (id 218283).</p>\n<p>Миколай отвечает по пунктам: «ну так он не самый обычный» (id 218193), «он толстый» (id 218198), «он более сильный» (id 218240). Функцию персонажа в истории он определяет прямо: «ты ну так роль в другом» (id 218226) — «его роль срать красиво» (id 218229), «не более» (id 218230). Про ценность истории: «ценность истории ващ не в персах» (id 218285), «конкретно этой» (id 218286), ценность — «в идее» (id 218290), «к том как избавились от окамения» (id 218293). На вопрос, что в истории есть, отвечает: «в вампире и применении его фекалий как минимум» (id 218282).</p>\n<p>Здесь же отвергается расширительное толкование: раса не объявляется новым видом вселенной (id 218232–218234, см. «Что это»).</p>\n<p><strong>Отклонённые и оспоренные варианты.</strong></p>\n<ul>\n<li>Слава предлагает по сюжету отдать окаменевшую учёным — «Ученым отдали бы» (id 218231). В историю это не вошло; ответа на предложение в переписке нет.</li>\n<li>Слава спрашивает, почему не вызвали полицию, раз это повседневка (id 218223). Миколай отвечает: «че полиция сделает» (id 218225).</li>\n<li>Слава оспаривает происхождение идеи со снятием окаменения, называя источником «Доктор Стоун» (id 218297, ранее id 218202 — Миколай сам ссылается на «Доктора Стоуна»). Миколай источник отрицает применительно к русской комедии («не русской», «я их ващ не смотрю», id 218294–218295), на «Доктора Стоуна» ответа в переписке нет.</li>\n<li>Слава отдельно цепляется к книге о снятии окаменения: «И из какой хули библиотеки он достал книгу о окаменения» (id 218199), «Какой нормальный человек напишет книгу о снятии окаменения» (id 218206). Ответа по существу нет.</li>\n<li>Жанр остался спорным: Слава называет «Ужастик» (id 218238) и «Трагедия» (id 218239), возражает «Но сука не как повседневка» (id 218243). Миколай: «ну там есть элемент трагедии но подано в легкой форме» (id 218245). Общий жанр не согласован.</li>\n<li>Миколай подтверждает, что история написана в шутку: «сука ну да, это угар был, но ты сам сказал что главное чтобы был монстр хули не нравится» (id 218237), и относит серьёзные работы к более позднему периоду — «это уже после мы начали делать такие работы» (id 218242).</li>\n</ul>\n<p>Дальнейших упоминаний расы после 2024-08-12 в переданных источниках нет.</p>", "r": [["снятие окаменения гуано и спиртом", "SP-0103.html"]]}, {"t": "Пробелы", "a": ["S07", "GR-0044-S07", "GR-0044--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет: назван один вампир, Ник-Хан. Сколько вампиров всего, где живут остальные, знакомы ли между собой — в переписке не сказано.</li>\n<li>Иерархии нет: ни главы, ни старшинства, ни деления внутри расы не названо.</li>\n<li>Питание кровью не упоминается ни разу. Единственная названная еда вампира — жареные сверчки, «тонны», у Ник-Хана. Пьют ли вампиры кровь — в переписке не сказано.</li>\n<li>Происхождение расы не названо: откуда вампиры взялись, рождаются или обращаются — нет.</li>\n<li>Про гроб сказано только через отрицание для Ник-Хана («не спит в гробу тысячелетиями»). Спит ли обычный вампир в гробу постоянно, что при этом с ним происходит и почему это влияет на метаболизм — не объяснено.</li>\n<li>Реакция на дневной свет прямо не описана. Есть только оговорка «благо ночь была» при перелёте на 2000 километров.</li>\n<li>Механизм перемещения (полёт, телепортация, что-то иное) не назван, хотя скорость указана точно.</li>\n<li>Внутреннее противоречие формулировки о худобе («не из-за того что могут превращаться в летучих мышей» против объяснения через мышиный метаболизм) осталось нерешённым — авторы его не обсуждали.</li>\n<li>Статус вампиров во вселенной остался спорным: автор отрицает, что ввёл новый вид монстров, но правила расы в тексте сформулированы обобщённо. Вопрос Славы про то, что «каждый второй монстор и все они живут в мире», закрыт отрицанием, но устройство мира так и не описано.</li>\n<li>Отношений с другими группами не названо.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0044--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0141.html\">Рассказчик истории про Горгону</a>, <a href=\"PS-0142.html\">Ник-Хан</a></li>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0103.html\">снятие окаменения гуано и спиртом</a></li>\n<li><strong>Упоминает прозу:</strong> <a href=\"PR-0026.html\">История про Горгону и Асешу («ну завтра я точно смогу пригласить Асешу погулять»)</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0044--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0044.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0044-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0044/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дорогих дыр в этом кусте нет, и это стоит сказать прямо: всё, на что статья ссылается, статьями закрыто — <code>SP-0102</code> «метаболизм вампиров» (три входящие ссылки, 16 828 знаков базы), <code>SP-0103</code> (три ссылки), <code>PS-0142</code> Ник-Хан (две), <code>PR-0026</code> (две), <code>PS-0141</code> (одна). Чинить по числу ссылок нечего.</p>\n<p>Дорого другое — несведённость. Про вампиров в базе есть два куста, и они не знают друг о друге. Здесь, в «монстрах», — <code>GR-0044</code>, ноль входящих ссылок, база под группой ноль. В «Оам» — <code>GR-0069</code> с тем же именем «Вампиры» (тоже ноль входящих) и <code>PS-0299</code> с 30 729 знаками базы, где вампиры целиком построены на крови: мутировавшая под Оам кровь, кровь как управляемая конечность, вампиры как аристократия. Тут же, в «монстрах», кровь не упомянута ни разу — это первый пункт пробелов. То есть недостающее по этой статье лежит в базе, просто под другой вселенной.</p>\n<p>Третье, мелкое, но именно дыра: <code>ID-0067</code> «Пожиратели свежих мертвецов (переосмысленные вампиры)» — 2 530 знаков, статьи нет, ноль ссылок, «Новый мир», 2024-06-03. Вампиров уже переосмысляли за два месяца до истории про Горгону, и связи с этим не проведено.</p>\n<h3>С чего начать</h3>\n<p>В базе, не в архиве. Питание и происхождение — <code>PS-0299</code> (окна w0106–w0112, 2025-10-02 — 2025-12-06) и <code>ID-0067</code> (w0036, 2024-06-03). Ни то, ни другое не про вселенную «монстры», но именно там лежит то, чего здесь нет.</p>\n<p>Внутри куста «монстров» смотреть <code>SP-0102</code>: 16 828 знаков базы против 11 186 статьи, и противоречие про мышиный метаболизм («не из-за того что могут превращаться в летучих мышей» против объяснения через мышиный кишечник) должно быть видно там дословно, в исходном сообщении 218122.</p>\n<p>В архив — под одно. Ответ на «Доктора Стоуна»: Слава называет источник в 218297, это последнее сообщение окна в записи, ответа нет. Искать в сообщениях после 218297 того же дня, 2024-08-12, вечер. Там же, вероятно, и реакция на предложение «Ученым отдали бы» (218231), которая тоже потерялась.</p>\n<h3>Как развивалось</h3>\n<p>Заявили и ограничили с промежутком в сутки. 2024-08-11 раса появляется целиком, внутри прозы, одним заходом: сила, худоба, метаболизм, кишечник, превращение, гроб, единственный представитель с отклонением. 2024-08-12 — разбор, и ограничение приходит не к свойствам, а к статусу: автор снимает обобщение («нет это не так, конкретно у нашего героя есть знакомый вампир»), новых свойств не добавляется ни одного, фиксируются позиции сторон. После 2024-08-12 упоминаний нет. Возвращения не было.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для превращения в летучую мышь связь с метаболизмом проговорена — оно его разгоняет, поэтому Ник-Хан, который редко превращается, толстый. Для сна в гробу, признака того же ряда, такой связи нет. При этом отличие Ник-Хана от нормы держится на обоих сразу: «только он не спит в гробу тысячелетиями» стоит в одном перечне с «редко превращается». Что гроб делает с вампиром и почему его отсутствие идёт в один список с непревращением — не сказано.</p>\n<h3>Отклик</h3>\n<p>Сильное здесь — форма объяснения, а не сам вампир. Вы начали с наблюдения не про мир, а про массовую культуру («вы когда-нибудь видели вампиров с лишним весом»), и вывели из него биологию — короткий кишечник, быстрый метаболизм, отсюда сила. Это обратный ход: не свойство придумано, а объяснено то, что и так все знают. И весь механизм честно отработан на исключении — толстый вампир не ломает правило, а подтверждает его через ограничение. Дальше гуано становится лекарством от окаменения, и роль персонажа формулируется как «его роль срать красиво» — это ровно тот случай, когда шутка держит конструкцию лучше, чем держал бы замысел. Спор на следующий день, где Слава трижды повторяет, что вампир ничем не выделяется, а Миколай отвечает «ценность истории ващ не в персах», читается как спор о том, что вообще считать материалом, — и он интереснее самой истории.</p></div>", "r": []}];</script>
