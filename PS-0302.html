<script>const BASE="";const DOCNAME="Пепельный человек";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0302-S01", "PS-0302--proishozhdenie"], "h": "<p>Не названо. Персонаж появляется сразу внутри боевой сцены, отдельной карточки у него нет (2025-10-20, id 376506–376512, окно w0107). Вселенная Оам проставлена по дате объявления, а не потому, что она названа в самой сцене.</p>\n<p>Варианты имени, встречающиеся в переписке: «пепельник», «пепельный».</p>", "r": []}, {"t": "Способности", "a": ["S02", "PS-0302-S02", "PS-0302--sposobnosti"], "h": "<p>Работа с пеплом, показанная в двух проявлениях.</p>\n<p>Первое — пепел внутри тела противника. Слава: «В моменте пепельный заполняет лёгкий имитатора пеплом. Лишая имитатор воздуха и заставляя его задыхаться.» Имитатор, «держась за горло не мог придумать способ вытащить пепел» — то есть изъять пепел из лёгких напрямую нельзя.</p>\n<p>Второе — пепел вокруг. Окружающий пепел гасит огонь: когда Имитатор поджигает себя изнутри, «Огонь бушует, но пепел вокруг него его гасят».</p>\n<p>Механика того, откуда берётся пепел и как он вводится в лёгкие, в переписке не описана.</p>", "r": []}, {"t": "Связи с другими", "a": ["S03", "PS-0302-S03", "PS-0302--svyazi-s-drugimi"], "h": "<p>Имитатор — противник в сцене 376510. Единственная связь, названная в переписке.</p>\n<p>Исход сцены: Имитатор создаёт пламя в ладонях, прикрывая его ладонями от окружающего пепла, подносит ко рту и глотает. Дальше — «имитатор извергает пламя из горла, поджаривая само горло и рот. Его грудная клетка прожигается оранжевым светом. Из щелей между ребров вырывается пламя. Прожигая кожу, плоть.» Огонь гасится окружающим пеплом. Финал сцены — про Имитатора, не про пепельного: «Имитатор ели стоя поднимает обоженое лицо, на котором сгорела вся кожа и улыбается. Сквозь его рёбра можно увидеть бьющей его сердца. Но его это не волнует, он понял как использовать способность пепельника.»</p>\n<p>То, что именно Имитатор понял и как он потом использует способность пепельника, в переписке не сказано.</p>", "r": []}, {"t": "Как менялся", "a": ["S04", "PS-0302-S04", "PS-0302--kak-menyalsya"], "h": "<p>Версия 1 — 2025-10-20 (id 376506–376512, окно w0107). Единственная версия. Персонаж вводится как противник в сцене и в этом же виде остаётся; изменений и пересмотров нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "PS-0302-S05", "PS-0302--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Происхождения нет.</li>\n<li>Вселенная в самой сцене не названа — проставлена по дате объявления.</li>\n<li>Внешность не описана.</li>\n<li>Характер не описан, реплик у персонажа нет.</li>\n<li>Чем сцена кончилась для самого пепельного человека — не сказано.</li>\n<li>Кроме этой сцены о нём ничего нет.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["PS-0302--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-10-20</td>\n<td>376506–376512</td>\n<td>w0107</td>\n<td>Оам (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0302-pepelnyy-chelovek.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0302--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0302.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
