<script>const BASE="";const DOCNAME="Команда (подручные) сестры";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0007-S01", "GR-0007--chto-eto"], "h": "<p>Группировка ключевого злодея вселенной «Апостол» — команда сестры имитатора (<a href=\"PS-0215.html\">Сестра имитатора</a>). В переписке она называется описательно: «её команда», «её подручный», «у них не такая большая группировка». Собственного названия у группы авторы не давали.</p>\n<p>Разведочная пометка «группа» верна, но с оговоркой: в переписке группа существует только как совокупная величина — набор бойцов с заданным потолком силы и заданной численностью. Поимённо не назван ни один подручный. Отдельная запись базы «Подручные сестры» (<a href=\"PS-0289.html\">Подручные сестры</a>) — это собирательное обозначение, а не конкретный персонаж.</p>\n<p>Основное состояние группы задано в одном разговоре (2025-08-30, id 359684–359691), где Слава разбирает, хватает ли злодейской стороне силы на финал истории.</p>", "r": [["Сестра имитатора", "PS-0215.html"], ["Подручные сестры", "PS-0289.html"]]}, {"t": "Состав", "a": ["S02", "GR-0007-S02", "GR-0007--sostav"], "h": "<ul>\n<li><a href=\"PS-0215.html\">Сестра имитатора</a> — сестра имитатора, она же «Сестра», она же «сестра благословенная правителем Кильке». Ключевой злодей истории и глава группы.</li>\n<li><a href=\"PS-0289.html\">Подручные сестры</a> — «Подручные сестры», собирательная запись. Отдельных подручных ни по именам, ни по числу авторы не перечисляли; сказано только, что группировка «не такая большая».</li>\n</ul>\n<p>Правитель Кильке (<a href=\"MR-0207.html\">Килька</a>) в состав группы не вписан: он назван тем, чьим благословением наделена сестра, и больше о нём в этих сообщениях ничего нет.</p>", "r": [["Сестра имитатора", "PS-0215.html"], ["Подручные сестры", "PS-0289.html"], ["Килька", "MR-0207.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0007-S03", "GR-0007--obschie-sposobnosti-gruppy"], "h": "<p>Прямого перечня умений в переписке нет. Есть только шкала силы, заданная через апостолов:</p>\n<ul>\n<li>Сестра — «сильнее одного апостола». При этом «это не та сила, что поставит на колени весь мир».</li>\n<li>Подручные — «её подручный всё слабее апостолов. Каждый из них один на один против апостолов продует».</li>\n</ul>\n<p>То есть весь описанный «общий» признак группы — положение относительно апостолов: лидер выше одного апостола, рядовые участники ниже. Ни конкретных способностей, ни источника силы подручных (благословение, дар, обучение) в переписке не названо.</p>\n<p>Отдельно оговорена численность: «При этом у них не такая большая группировка» (2025-08-30, id 359684).</p>", "r": []}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0007-S04", "GR-0007--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p>Единственное различие, зафиксированное в переписке, — разрыв между сестрой и остальными. Сестра благословлена правителем Кильке и сильнее одного апостола; подручные все до одного слабее апостолов и проигрывают им в поединке один на один. Внутри самих подручных никаких различий не проводится — они описаны одной строкой как однородная масса.</p>", "r": []}, {"t": "Иерархия", "a": ["S05", "GR-0007-S05", "GR-0007--ierarhiya"], "h": "<p>Группа названа по сестре и через притяжательное: «её команда», «её подручный». Сестра — вершина и единственный названный уровень; решение о её статусе закреплено прямо: «Нет сестра так и останется ключевым злодеем» (2025-08-30, id 359688).</p>\n<p>Над сестрой стоит фигура правителя Кильке — но только в смысле благословения («сестра благословенная правителем Кильке»). Подчиняется ли сестра Кильке, входит ли он в командную структуру и кто кому отдаёт приказы — в переписке не сказано.</p>\n<p>Никаких промежуточных звеньев (заместители, старшие подручные, деление на отряды) не введено.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S06", "GR-0007-S06", "GR-0007--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>Апостолы</strong> — противостоящая сторона. Сила группы измеряется только через них. Запланированный исход: «В конце всё истории и в последнее битве апостолы продуют. Большинство апостолов сдохнуть» (2025-08-30, id 359691). Именно под этот финал Слава и ищет недостающую силу: «Поэтому нужна сила что позволит это сделать».</p>\n<p><strong>Правитель Кильке</strong> — источник благословения сестры. Больше о его отношениях с группой ничего не сказано.</p>\n<p><strong>Существа рая / Серафим</strong> — рассмотрены и отклонены как пополнение злодейской стороны, см. раздел ниже. В группу не входят.</p>\n<p>Отношение группы к цели «объединение всех миров» тянется от более раннего обсуждения (2025-03-06, id 298826–298841), где цель объявлена, но там речь о сестре и злодеях вообще, а не о команде: команда как отдельная сущность в том разговоре ещё не появилась.</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S07", "GR-0007-S07", "GR-0007--kak-menyalas"], "h": "<p><strong>2025-03-06 (id 298826–298841).</strong> Заложен контур злодейской стороны, но без команды. Слава: «Цель главного злодея объединить всё миры в один, конечно главным будет Килька, таким образом наш правитель хочет иметь контроль над другими мирами. А зачем это сестре имитатора, не знаю но придумаю». Затем правка: «И вообще мир будет объединять сестра имитатора, а не правитель». Миколай в качестве препятствий предлагает «независимость других миров и конкуренция» и описывает артефакт-медиатор, «позволял менять натяжение струн пространства всех миров»; сам оговаривает: «я даю щас сырую идею». Слава принимает: «Да сырая идея, ну можно отталкиваться». Обсуждаются также нужные для обряда предметы: «Нужно хотя бы 16 вещей так как сюжет должен быть длинным». Подручных, команды, группировки на этом этапе нет вообще.</p>\n<p><strong>2025-08-30 (id 359684–359691).</strong> Появляется группа как величина и сразу как проблема. Заданы три параметра: сестра сильнее одного апостола, но её силы не хватает на весь мир; подручные слабее апостолов и поодиночке апостолам проигрывают; группировка небольшая. Отсюда вывод: «Нужен злодей» (id 359685) и формулировка задачи: «Но кто в её команде должен быть настолько сильном что перевернёт хот битвы» (id 359688). Статус сестры при этом подтверждён, а не заменён: она «так и останется ключевым злодеем».</p>\n<p><strong>Отклонённые варианты (2025-08-30).</strong></p>\n<ul>\n<li><em>Серафим.</em> «Есть Серафим. Но это одноразовый босс. Что появится, когда будет война с раем» (id 359686). Отклонён как разовая фигура, привязанная к отдельной войне.</li>\n<li><em>Существа из рая скопом.</em> «И да я могу запихать разных существ из рая и устроить месива. Но существа из рая не подходят на злодеев» (id 359687). Две причины названы прямо: «Во первых нет так таковой цели, кроме мести. Во вторых не какой группироаонной работы не будет их же в разный места раскидает».</li>\n</ul>\n<p>Кто именно закроет дыру в команде, в переписке не решено — на этом разговор об этом обрывается.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "GR-0007-S08", "GR-0007--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет. Ни одного подручного не назвали ни по имени, ни по прозвищу.</li>\n<li>Численность не названа — только «не такая большая группировка».</li>\n<li>Способности подручных не описаны: сказано лишь, что все они слабее апостолов.</li>\n<li>Название группы отсутствует; в переписке она проходит как «её команда» / «её подручные».</li>\n<li>Главная задача осталась нерешённой: сила, «что перевернёт хот битвы», не придумана, кандидат не выбран.</li>\n<li>Отношения сестры и правителя Кильке не проговорены: известно только, что он её благословил.</li>\n<li>Внутренняя структура (кто кем командует под сестрой) не вводилась.</li>\n<li>Мотив сестры не придуман: «А зачем это сестре имитатора, не знаю но придумаю» (2025-03-06, id 298826), к этому вопросу в позднейшем окне не возвращались.</li>\n<li>Чья именно она сестра — в окне 2025-08-30 не сказано.</li>\n<li>Как группа связана с целью объединения миров и с обрядом на «хотя бы 16 вещей» — в переписке не сказано; эти темы обсуждались до появления команды.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0007--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0215.html\">Сестра имитатора</a>, <a href=\"PS-0289.html\">Подручные сестры</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0007--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0007.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0007-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0007/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дорогая дыра здесь не «поимённого состава нет», а то, что злодейская сторона уже расписана в записях, на которые статья не смотрит. <code>MR-0105</code> «Организация злодеев» — четыре ссылки, статья есть, база 4 924: там названы и категории состава («В их ней организаций есть Альфы и благословенный»), и вершина — «глава этой организации будет единственный благословенный правителем нашего мира», «она будет грубо говоря сильнейшей» (2025-01-23, id 284170–284171). <code>PS-0185</code> «Глава организации злодеев» — две ссылки, 3 050. <code>MR-0107</code> «Иерархия силы» — четыре ссылки, 5 534, и это ровно та шкала, которой в статье «нет».</p>\n<p>То есть чинить первым надо один вопрос: глава организации злодеев (женщина, благословлена правителем, сильнейшая, январь 2025) и сестра имитатора (благословлена правителем Кильке, сильнее одного апостола, ключевой злодей, август 2025) — это один персонаж или два. В переписке отождествления нет, придумывать его нельзя, но от ответа зависит, есть у этой группы структура и состав или их правда нет. Ссылок на <code>MR-0105</code> уже четыре, на <code>MR-0107</code> четыре — они тянут за собой ещё несколько статей.</p>\n<h3>С чего начать</h3>\n<p>В базе, две точки; в архив идти не надо.</p>\n<p>Первая — продолжение группы после 2025-08-30, на котором статья обрывается. 2025-11-17, id 385768: «Группировка сестры ( который теперь будет дочерью Имитатора. И я не знаю какие у неё будет цель)», то же сообщение переслано 2025-12-06 (393287) и развёрнуто в id 393313, 393477–393480. Там же появляется первый и пока единственный названный участник — <code>PS-0325</code> «Босс группировки дочери» (ноль ссылок, статьи нет, база 2 914): обычный человек, «хитрый и уверенный», который «Попытается наладить связь с Имитам». Пробел «ни одного подручного не назвали» после этого закрывается наполовину, а иерархия получает второй уровень. Смотреть <code>PS-0324</code> «Дочь Имитатора» (две ссылки, статья есть, 9 403) и <code>PS-0375</code> «Доима (дочь Имета)» (три ссылки, статьи нет, 9 036).</p>\n<p>Вторая — Килька. <code>MR-0207</code> — 68 896 знаков базы при одной ссылке, статья есть. Статья пишет, что отношения сестры и правителя не проговорены; прежде чем это утверждать, эти 68 тысяч надо прочесть. Туда же <code>IS-0036</code> «Цель злодеев: объединение всех миров» (одна ссылка, статья есть, 11 288) — под пробелом «как группа связана с целью объединения миров».</p>\n<h3>Как развивалось</h3>\n<p>2025-03-06 — заявили цель и злодейку, команды ещё нет вообще; мотив сестры тут же помечен как непридуманный («не знаю но придумаю»). 2025-08-30 — команда вводится сразу с потолком: сестра сильнее одного апостола, но не мира; подручные слабее апостолов поодиночке; группировка небольшая, — и сразу упирается в уже назначенный финал, где апостолы должны проиграть. В том же разговоре отклонены оба кандидата на усиление, и обсуждение обрывается на вопросе «кто в её команде должен быть настолько сильном что перевернёт хот битвы». 2025-11-17 — группа возвращается, но уже как группировка дочери, в другом мире и с боссом-человеком во главе; вопрос августа так и остался без ответа, а сама постановка задачи сменилась.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Критерии отказа названы вслух, причём оба: существа рая не годятся, потому что «нет так таковой цели, кроме мести» и «не какой группироаонной работы не будет их же в разный места раскидает». То есть требования к злодейской стороне сформулированы — своя цель и способность работать вместе. К уже принятым подручным ни одно из двух не приложено: цели у них нет ни одной, а у самой сестры мотив прямо объявлен непридуманным; про совместную работу подручных не сказано ничего, они описаны одной строкой как однородная масса. Правило отбора названо для отклонённых кандидатов и не поставлено тем, кто уже в составе.</p>\n<h3>Отклик</h3>\n<p>Зацепило, что группа появляется не как замысел, а как арифметика. «Да она сильнее одного апостола. Но дальше че» — это не описание злодеев, это ревизия склада: автор считает, чем располагает, и видит, что на финал, который он уже себе назначил, не хватает. Отсюда и «Нужен злодей» — не потому что интересно, а потому что не сходится баланс. И отклонение существ рая по причине «их же в разный места раскидает» — возражение не эстетическое, а логистическое: они не соберутся, значит не сработают. Такой разговор о вымысле мне попадается редко и он честнее большинства: не «кого бы добавить покруче», а «сколько у меня есть силы и хватает ли её на сцену, которую я уже пообещал». Жаль только, что подручные при этом так и остались строкой; вся конкретность ушла на то, чтобы доказать, что их недостаточно.</p></div>", "r": []}];</script>
