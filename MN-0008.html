<script>const BASE="";const DOCNAME="Степь с руинами";
const LEAD="";
const CH=[{"t": "Где находится — в каком мире и в каком его месте", "a": ["S01", "MN-0008-S01", "MN-0008--gde-nahoditsya"], "h": "<p>Вселенная «монстры» — так помечено по дате объявления; в самом сообщении вселенная не названа (2024-10-20, id 247842, окно w0062).</p>\n<p>Где степь расположена относительно других мест, в переписке не сказано. Известно только, что до неё можно дойти пешком: рассказчик после случившегося «ушёл в ту степь» самостоятельно, специально, чтобы разобраться. Из степи его и девочку увезли — его домой, её в скорую, — значит, город или посёлок где-то рядом, но расстояние и название не приводятся. В тексте место называется только «та степь».</p>", "r": []}, {"t": "Что собой представляет", "a": ["S02", "MN-0008-S02", "MN-0008--chto-soboy-predstavlyaet"], "h": "<p>Степь, «среди которой много руин, трупов, черепов, гнилых растений». Рассказчик называет её «адское место».</p>\n<p>Поверхность песчаная — девочка рисовала на песке, и рассказчик присоединился к ней.</p>\n<p>В степи есть могилы: во второй свой приход рассказчик застаёт девушку, которая «сидит и избивает могилу какого-то парня». Чья это могила, кто и когда хоронил в степи, откуда там могилы при том, что трупы лежат непогребёнными, — в переписке не сказано.</p>\n<p>Главная особенность места сформулирована рассказчиком как факт: кроме девочки, живых там нет. Дословно: «она была единственным живим существом в той степи». Тут же он оговаривается — «ну по крайней мере я так думал», и дальше вся история строится на том, что он ошибся: лежавшая рядом девушка тоже оказалась жива.</p>", "r": []}, {"t": "Что с ним связано — предметы, механики, силы", "a": ["S03", "MN-0008-S03", "MN-0008--chto-s-nim-svyazano"], "h": "<p>Со степью связано отношение властей к тому, что в ней лежит. Рассказчик вызвал полицию и скорую. Дальше по его словам:</p>\n<ul>\n<li>забрали его вместе с девочкой, а женщину «они трогать не стали и не возвращались потом к ней, что довольно странно»;</li>\n<li>«и сколько я бы о ней не спрашивал они игнорировали темы связанные с ней»;</li>\n<li>всю дорогу с ним вообще не говорили, «лишь в конце попросили не поднимать эту тему в разговорах. и всё».</li>\n</ul>\n<p>Почему полиция и скорая ведут себя так, знают ли они о степи что-то заранее, есть ли запрет на само место или только на разговоры о лежащей там девушке — в переписке не объясняется.</p>\n<p>Девочку увезли в скорую с диагнозом пищевое отравление.</p>\n<p>Степь служит рамкой, в которую вставлено рассуждение первого рассказчика о смерти как праве. Само рассуждение открывает сообщение: «люди смертны и это так потрясающе», мементо мори — «напутствие \"помни о смерти\", которое прямо указывает, знать что ты смертный»; «быть или не быть» названо «не самый свободный выбор, ведь ты не сможешь быть вечно»; религии «гласят о перерождении, о рае и аде», «существо в низу распоряжаться твоей душой и твоим фатумом. даже если ты не верующий»; «некоторые действительно попадают куда-то, некоторые исчезают на всегда, но только после смерти». Итоговая формулировка: «смерть это не просто награда, это право, которое отнять не возможно. и важно его защищать».</p>", "r": []}, {"t": "Персонажи и события — кто с ним связан и что там происходило", "a": ["S04", "MN-0008-S04", "MN-0008--personazhi-i-sobytiya"], "h": "<p><strong>Девочка с пламенными волосами.</strong> Описание при первой встрече: «яркие, но глубокие голубые глаза, пылающие красные волосы, нет, буквально пламенные, крайне плотная джинсовая куртка, черная юбка и стандартные массовые розовые колготки, обуви не было».</p>\n<p>Она рисовала на песке, рассказчик присоединился. Вместе нарисовали триптих Босха и то, «как кронос пожирает своих детей». Рассказчик отдельно отмечает, что выбор работ для перерисовки был не за ним: «инициатива в выборе работ для перерисовки была не за мной, а сей юной леди, что меня не удивило».</p>\n<p>Одновременно с этим девочка жевала кожу с левой лопатки лежащей рядом девушки. Рассказчик: «мне было жутко, страшно. но я знаю, что о детях важно заботиться и я не подавал виду, как минимум её воспитание не моя ответственность».</p>\n<p><strong>Девушка, отринувшая смерть.</strong> Та, чью кожу жевала девочка. Рассказчик поправляет сам себя в описании: сначала называет её женщиной, потом — «хотя прозвучало оскорбительно, женщиной её точно звать не стоит это вполне молодая девушка, двадцати лет». Предположение о родстве осторожное: «возможно являвшаяся матерью».</p>\n<p>При первой встрече она не подавала признаков жизни. Рассказчик проверял: «у неё не билось сердце, я тогда проверял. она была бездыханна и холодна».</p>\n<p>Когда он вернулся в степь искать «остатки той женщины которую жевала девочка», он застал её живой и бьющей могилу. Его формулировка перехода: «я ошибся. хотя нет. она ошибка».</p>\n<p>Вывод рассказчика о ней — дословно:</p>\n<div class=\"q\"><p>«какая мерзость, девушка не имеет права на смерть. конечно. можете сказать что я спешу в этом заключении, но нет. даже этот случай громко говорит о том, что она отринула смерть. она не способна умереть и это страшно, её нельзя допускать до общества».</p></div>\n<p>И итог всей истории с его стороны: «бывают случаи, когда кто-то лишается этого права и больше не является человеком. она монстр и нельзя этому существу быть среди людей. важно защищать право смерти. но кто это будет делать?»</p>\n<p><strong>Второй рассказчик.</strong> В том же сообщении дана вторая точка зрения, помеченная как «[другой рассказчик]». Он возражает первому и переопределяет саму рамку: «ну ты и параноик. в смысле смерть это право? ты вообще ничего не понял после встречи с той девчонкой. смерть это навык понятное дело. она пытается обучиться и достичь цели, а ты на неё ярлыки вешаешь, мол она монстр. ты просто в голове себе надумал возможные сценарии, даже не поработав с ней».</p>\n<p>Он знаком с девушкой лично: «я лично знаком с ней, мы друзья. и я всегда готов её поддержать. умирать не просто и это делать куда приятнее когда рядом есть близкий и понимающий человек который тебя ценит». Его формулировка её состояния: «смерть она не испытывала, но она способна на смерть».</p>\n<p>Приведённый им случай: «помню её расстреляли с узи 16 вооружённых солдат как только она проходила мимо их територии, потом она восстановилась пришла ко мне, в слезах но с улыбкой. это был действительно прекрасный момент. ведь в этот раз она восстановилась за час, а не за 7 минут как раньше». Отмечено, что восстановление стало занимать больше времени, а не меньше, и что для второго рассказчика это движение к цели. Территория солдат — отдельное место, к степи в переписке не привязана.</p>\n<p>Время: встреча с девочкой была «около четырёхсот дней назад» относительно момента рассказа.</p>", "r": []}, {"t": "Как менялся по версиям — по датам", "a": ["S05", "MN-0008-S05", "MN-0008--kak-menyalsya-po-versiyam"], "h": "<p>Версия одна — 2024-10-20 (id 247842, окно w0062). Место появляется сразу целиком, внутри одного сообщения Миколая, и больше в переписке не обсуждается. Название «Степь с руинами» — рабочее; в тексте она называется только «та степь».</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "MN-0008-S06", "MN-0008--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вселенная в самом сообщении не названа; отнесение к «монстрам» сделано по дате объявления.</li>\n<li>Где степь находится, как называется, какой она величины — не сказано.</li>\n<li>Что это за руины, чьи они и от чего остались — не сказано.</li>\n<li>Откуда в степи трупы, черепа и могилы, кто их туда положил — не сказано.</li>\n<li>Чья могила, которую избивает девушка, и почему она это делает — не сказано. Имя парня не названо.</li>\n<li>Почему полиция и скорая не трогают лежащую в степи девушку и запрещают говорить об этом — не объяснено.</li>\n<li>Как девочка и девушка связаны между собой — только предположение рассказчика («возможно являвшаяся матерью»), подтверждения нет.</li>\n<li>Живёт ли кто-то в степи постоянно, возвращались ли туда девочка и девушка после увоза — не сказано.</li>\n<li>Вопрос, которым заканчивается история («важно защищать право смерти. но кто это будет делать?»), в переписке оставлен без ответа.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MN-0008--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MN-0008--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-10-20</td>\n<td>247842–247842</td>\n<td>w0062</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/monumenty/MN-0008-step-s-ruinami.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MN-0008--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MN-0008.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
