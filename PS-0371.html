<script>const BASE="";const DOCNAME="Фан-база Изб";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0371-S01", "PS-0371--proishozhdenie"], "h": "<p>Фан-база Изб введена 2026-06-02 (id 487064–487065, окно w0120) как примечание к арке слома Изб. Слава излагал план злодеев против Изб и в конце добавил: «Примечание: у Изб есть своя преданная фанатка база которой защищает его от критики».</p>\n<p>Назначение оговорено прямо в том же примечании — чтобы картина не выглядела однозначной: «Ну как бы не всё просто возненавидили Изб из-за одной ошибки. У него есть своя преданная фан база, которой было больно смотреть трансляцию где хейтеры критиковали Изб».</p>\n<p>Это не отдельный персонаж с именем, а группа, зафиксированная одной репликой.</p>", "r": []}, {"t": "Характер", "a": ["S02", "PS-0371-S02", "PS-0371--harakter"], "h": "<p>Единственная названная черта — преданность. Фан-база защищает Изб от критики «даже после инцидента с вирусом». То есть событие, из-за которого Изб стал объектом ненависти, преданности не отменило.</p>\n<p>Реакция на травлю: фанатам «было больно смотреть трансляцию где хейтеры критиковали Изб».</p>", "r": []}, {"t": "Связи с другими", "a": ["S03", "PS-0371-S03", "PS-0371--svyazi-s-drugimi"], "h": "<ul>\n<li>Изб — тот, чью сторону база держит. В карточке база проходит как часть Изб.</li>\n<li>Слом Изб — арка, внутри которой фан-база и появляется.</li>\n<li>Хейтеры Изб — противостоящая толпа, собранная злодеями.</li>\n</ul>\n<p>Контекст, в котором названа фан-база: среди столпов героев самым уязвимым будет Изб, «потому что он самый неопытный и юные», поэтому злодеи захотят «либо переманить его либо либо разрушить психически дабы он не преставля угрозы». В одной из арок, после убийства 20 преобразованных, злодеи соберут в одном месте хейтеров Изб, и Изб там появится из-за какого-то задания. Толпу подогревают злодеи; обвиняют и кидаются мусором семьи перевоплощённых; критику злодеи контролируют так, «чтобы толпа кричала что Изба злодей».</p>\n<p>Открытый на тот момент вопрос по Изб: «что станет если Изб поверит, что он злодей, как его способность на это отреагирует. Либо никак, но сам Изб получит психическую травму. Либо его способность повлияет на самого Изб и злодей получат невероятно сильного союзника».</p>", "r": []}, {"t": "События", "a": ["S04", "PS-0371-S04", "PS-0371--sobytiya"], "h": "<p>На том сборище хейтеров фанатов Изб просто не было. Узнав, что происходит, они «начали выдвигаться табы поддержать Изб». Результата это не изменило: «Ну даже так Изб всё равно получил травму».</p>", "r": []}, {"t": "Как менялась", "a": ["S05", "PS-0371-S05", "PS-0371--kak-menyalas"], "h": "<p>Версия одна, 2026-06-02 (id 487064–487065, окно w0120). Изменений не было.</p>\n<p>В той же паре сообщений Слава перечислил три пути развития Изб — сделать его злодеем, дать «духовный рост Изб» (он преодолевает критику и растёт дальше), либо сломать его — и выбрал: «И вот я выбрал путь сломать Изб». Первые два, соответственно, отклонены. Как выбранный путь сказывается на фан-базе, в переписке не сказано.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0371-S06", "PS-0371--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Численность, состав, устройство фан-базы не названы.</li>\n<li>Отдельные лица внутри базы не выделены.</li>\n<li>Успели ли выдвинувшиеся фанаты дойти до места сборища — не сказано; сказано только, что травму Изб всё равно получил.</li>\n<li>Что такое «инцидент с вирусом», в этой реплике не разъясняется.</li>\n<li>Судьба фан-базы после слома Изб в переписке не обсуждалась.</li>\n<li>Вселенная в карточке помечена как «неясно» — привязка только по дате объявления.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["PS-0371--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-06-02</td>\n<td>487064–487065</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0371-fan-baza-izb.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0371--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0371.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
