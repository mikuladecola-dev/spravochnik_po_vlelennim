<script>const BASE="";const DOCNAME="Прятки";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0063-S01", "SP-0063--mehanika"], "h": "<p>Прятки — способность-считалка, придуманная Славой (2024-05-25, id 173092–173099). Работает по схеме детской игры.</p>\n<p>Дословное и единственное изложение (id 173097): «Ну вот персонаж считает до 10 и говорит кто не спрятался я не виноват и всех кого он увидит своими глазами раздавить ( конечно особо крепкий получат лишь сильный урон и повреждений внутренних органов ) вообще он может найти только 5 объектов а дальше откат способности».</p>\n<p>Порядок действий, как он изложен:</p>\n<ol>\n<li>Носитель считает до 10.</li>\n<li>Произносит фразу «кто не спрятался я не виноват».</li>\n<li>Все, кого он увидит своими глазами, раздавливаются.</li>\n</ol>\n<p>Условие поражения — увидеть цель глазами. Иных условий наведения в переписке не названо.</p>\n<p>Против «особо крепких» эффект ослаблен: вместо раздавливания они «получат лишь сильный урон и повреждений внутренних органов». Порог крепости, при котором цель перестаёт раздавливаться, не задан.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0063-S02", "SP-0063--ogranicheniya-i-cena"], "h": "<p>Ограничение по числу целей: «он может найти только 5 объектов а дальше откат способности» (id 173097). Пятью объектами лимит и исчерпывается, дальше наступает откат.</p>\n<p>В чём именно состоит откат — не сказано. Длительность отката, его последствия для носителя и способ его пережидания в переписке не описаны.</p>\n<p>Отдельно: время счёта до 10 само по себе является окном, в которое цели могут спрятаться, — это заложено в самой фразе-триггере, но как тактическое ограничение авторами не проговорено.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0063-S03", "SP-0063--nositeli"], "h": "<p>Носитель не назван. В исходнике это зафиксировано как неясность: в списке персонажей Славы значится «прятки» как отдельная единица, и неясно, это имя персонажа или название силы.</p>\n<p>Слово «прятки» входит в перечень, который Слава записывает чуть позже в том же окне (id 173128): «Энергет, прятки, закон, петля, феникс, Тен, волк, дракон, ци, имитатор, спартанец, вампир, драгоценность, бессмерт, жук, лёд, Дилан, граница, солнце». Список составлен со словами «Надо потихоньку записывать а то я по тихонько забываю» (id 173129), и в нём вперемешку идут и названия сил, и имена (Тен, Дилан).</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0063-S04", "SP-0063--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 (2024-05-25, id 173092–173099)</strong> — первое и единственное изложение. Разговор начинается с вопроса Миколая «Персонажей и миры пока не придумываешь?» (id 173092), ответ Славы — «Продумываю» (id 173093) и сразу «Прятки способности» (id 173095). Далее следует описание механики целиком.</p>\n<p>Реакция Миколая (id 173098): «Хорошая концепция». После этого разговор уходит в сторону тезауруса вселенной.</p>\n<p>Изменений после этой даты нет — способность зафиксирована в одном состоянии и больше не пересматривалась.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0063-S05", "SP-0063--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Прятки входят в систему сил абакра (<a href=\"SP-0064.html\">абакра</a>) как одна из абилок, перечисленных в списке id 173128.</p>\n<p>Связанные записи, отмеченные в исходнике: Список персонажей Славы, абакра (<a href=\"SP-0064.html\">абакра</a>).</p>", "r": [["абакра", "SP-0064.html"]]}, {"t": "Пробелы", "a": ["S06", "SP-0063-S06", "SP-0063--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Носитель не назван. Неясно, «прятки» — имя персонажа или название силы.</li>\n<li>Не сказано, в чём состоит откат, сколько он длится и чем грозит носителю.</li>\n<li>Не задан порог, отделяющий «особо крепких» от тех, кого способность раздавливает насмерть.</li>\n<li>Не сказано, что происходит, если носитель видит больше пяти целей одновременно — выбирает ли он, срабатывает ли по первым пяти, или способность обрывается.</li>\n<li>Не сказано, обязательна ли фраза «кто не спрятался я не виноват» дословно и что будет, если счёт прерван.</li>\n<li>Не сказано, действует ли способность на цель, которую носитель видит через преграду, отражение или запись — условие сформулировано только как «увидит своими глазами».</li>\n<li>Механика «спрятаться» с точки зрения цели не описана: неясно, спасает ли укрытие само по себе или только отсутствие в поле зрения носителя.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0063--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0064.html\">абакра</a></li>\n<li><strong>Упомянут в способностях:</strong> <a href=\"SP-0064.html\">абакра</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0012.html\">Цветной мир</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0063--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-05-25</td>\n<td>173092–173099</td>\n<td>w0035</td>\n<td>Цветной мир (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0063-pryatki.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0063--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0063.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
