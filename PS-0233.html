<script>const BASE="";const DOCNAME="Ангел";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0233-S01", "PS-0233--proishozhdenie"], "h": "<p>Ангел появляется в тексте Славы (2025-03-19, id 305855–305858, окно w0083). Текст написан от первого лица — рассказчиком выступает упырь, защищавший группу людей, — и ангел входит в него как то, чем «рай ответил нам в ответ».</p>\n<p>Прямая цепочка в тексте: рассказчик-упырь уничтожал перагов, «но на сопротивление всегда будут отвечать. И рай ответил нам в ответ». Возвращаясь с вылазки с добытой едой, рассказчик «увидел лишь кровь и боль. Там был ангел». Ангел находился на месте, где жили подопечные рассказчика. О том, кто именно послал ангела, каким способом он попал туда и разговаривал ли он с кем-нибудь, в переписке не сказано.</p>\n<p>Принадлежность ангела к раю прямо в описании его появления не оговорена, но в конце эпизода имитатор, победив его, оставляет его в живых ради ответа на вопрос: «Почему жители рая устраивают нападения на другий миры?» — то есть в тексте ангел отнесён к жителям рая. Рай в той же переписке назван вторым миром, появившимся после кильке (первого мира), и правитель рая — источник благословений апостолов.</p>\n<p>Из мира рассказчика ангел уходит вместе с ним. За спиной рассказчика возникла чёрная дымка, которая тянула его к себе; рассказчик держался и не улетал в неё («Но нет я не сбегу. Я убью или буду убить. Я не уйду»), а мысль о происходящем была: «Это правитель пытается меня спасти. Отправив в другой мир». Уход состоялся не по воле рассказчика: «Но ангел заметил меня. И влетел в меня и мы вместе влетели, в эту дымку». Так ангел оказался чужемирцем в первом мире.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0233-S02", "PS-0233--vneshnost"], "h": "<p>Описание дано рассказчиком-упырём дословно: «Гуманоид, состоящий только из белых перьев. Он был вытянутым. По два метра ростом. У него было две пары рук и две пары крыльев. И вертикальный глаз один. Но он был закрыть. Хаха и нимб у него был. Как в сказках».</p>\n<p>Итого: рост два метра, вытянутое тело, полностью из белых перьев, две пары рук, две пары крыльев, один вертикальный глаз (в обычном состоянии закрытый), нимб. Что делает нимб и есть ли у него функция — в переписке не сказано.</p>\n<p>Реакция рассказчика на этот облик строится на противопоставлении: «Ну что за бред. Почему? Я уродливый и страшный. Отражения этого тёмного и страшного мира. Защищаю и стараюсь спасти людей. А ангел. Белый и чистый. Лишь убивает».</p>\n<p>Отдельно, уже вне сюжетного текста, Слава подтверждает облик прямой репликой (2025-03-20, id 306459–306460): «Ангел красивый», «Он не страшный».</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0233-S03", "PS-0233--harakter"], "h": "<p>Реплик ангела в переписке нет — он не говорит ни слова ни в одном фрагменте. Всё, что о нём известно, — это действия: убийство подопечных рассказчика, атака на рассказчика при провале в дымку, бой против имитатора и защитника, попытки отлететь и уйти от захвата в ходе боя.</p>\n<p>Авторская характеристика дана в обсуждении вне сюжета (2025-03-20, id 306457–306465). Миколай спрашивает: «или монстр это обяз кто-то страшный убийца». Слава отвечает: «Ангел красивый», «Он не страшный». Миколай: «но он убийца», «и дерётся». Слава подводит итог: «У каждого есть \"но\" Какая разница чем это \"но\" Отличается».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0233-S04", "PS-0233--sposobnosti"], "h": "<p>Всё известное о его возможностях взято из боя с имитатором и защитником (2025-03-19, id 305855–305858).</p>\n<p><strong>Стрельба перьями.</strong> Ангел взлетает в воздух и стреляет перьями из своих крыльев. Атака применяется повторно; в одном из эпизодов все перья попадают по упырю, что не останавливает того. Защитник во время сближения «прячясь либо уклоняясь от перьев».</p>\n<p><strong>Огонь через открытый глаз.</strong> Глаз обычно закрыт; для атаки ангел его открывает и после атаки закрывает. Первое применение: «в него врезается струя огня. Заставив того отлететь. Это его атаковал ангел. Открыв свой глаз. Но после атаки закрыв». Второе применение крупнее: «Ангел открывает свой глаз. И вокруг него образуется пламя»; струя огня прибивает имитатора к земле, и «всё в радиусе 23 метров сгорает. За считанные секунды». Именно от первой струи пламени у имитатора пострадала левая рука — «уже почти не ощущается. Там даже кость видна».</p>\n<p><strong>Крылья как оружие.</strong> Крыло ангела в момент удара «был твёрже железа и острей ножа». Удар крылом должен был пробить сердце имитатора; тот успел отойти в бок, и крыло прошибло ему лёгкое.</p>\n<p><strong>Полёт и гашение инерции.</strong> Ангел летает, и дважды в тексте, будучи отброшенным, «в полёте гасит инерцию».</p>\n<p><strong>Живучесть.</strong> Имитатор подбрасывает его в небо и подрывает оранжевыми пузырьками: взрыв, «Способный снести здания. Но не способные убить ангела».</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0233-S05", "PS-0233--svyazi-s-drugimi"], "h": "<p><strong>Упырь-рассказчик.</strong> Ангел убил тех, кого рассказчик защищал; в тексте это точка, где рассказчик теряет то, что удерживало его от деградации: «Я потерял свою нить. Держащий меня. Теперь и еë нету. Я перестану быть собой. Я лишь упырь». Ангел же втолкнул рассказчика в чёрную дымку, оказавшись вместе с ним в первом мире. В самом бою они противниками друг другу не являются: упырь атакует имитатора, «считая его врагом», а не ангела; при этом перья ангела попадают по упырю, а один из ударов имитатора накрывает обоих сразу.</p>\n<p><strong>Имитатор.</strong> Основной противник ангела. Ожидал появления одного чужемирца и «только в последние момент засек, что их будет двое». Останавливает первую атаку ангела цепью вокруг шеи, срывает его попытку улететь цепью на ноге, бьёт особым способом усиления (оранжевые пузырьки, взрыв), держит ангела в воздухе, не давая коснуться земли, вращает за крыло, прибивает к земле и в итоге вырывает крылья. Ранен ангелом: пробитое лёгкое от удара крылом, ожоги третьей степени по всему телу, почти утраченная левая рука.</p>\n<p><strong>Защитник (Александр).</strong> Апостол, благословлённый правителем рая. Бросался к ангелу в ходе боя, но до прямой схватки с ним дело дошло только в конце — именно защитник и добивает ангела.</p>\n<p><strong>Рай.</strong> Мир, к жителям которого ангела относит имитатор в своём вопросе о нападениях на другие миры. Сам ангел о раe ничего не сообщает.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0233-S06", "PS-0233--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2025-03-19 (вселенная «Апостол», окно w0083, id 305855–305858).</strong> Ангел вводится целиком в одном тексте: внешность, роль убийцы подопечных рассказчика, перенос в первый мир через чёрную дымку, бой в первом мире со всеми способностями (перья, огонь из открытого глаза, крылья твёрже железа и острее ножа), поражение и гибель.</p>\n<p><strong>Версия 2 — 2025-03-20 (помечена как «вне вселенной», окно w0083, id 306457–306465).</strong> Не сюжетный эпизод, а авторская реплика о персонаже. К облику и роли ничего не добавляется, кроме прямого утверждения Славы, что ангел красивый и не страшный, и его формулировки про «но»: «У каждого есть \"но\" Какая разница чем это \"но\" Отличается».</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0233-S07", "PS-0233--chto-s-nim-stalo"], "h": "<p>Убит в первом мире в конце боя (2025-03-19, id 305858).</p>\n<p>Порядок событий: имитатор не даёт ангелу коснуться земли, каждый раз ударяя его у самой земли; затем хватает за крыло и вертит вокруг себя, ломая деревья; бросает в небо и подрывает оранжевыми пузырьками — взрыв ангела не убивает. Ангел отвечает открытым глазом и огнём, выжигающим всё в радиусе 23 метров. Из дыма вылетает цепь имитатора, обвивает шею ангела; имитатор притягивает его, хватает за шею и вбивает в землю, «Словно давая по чуствовать тепло земли после его пламени». Затем бежит около сорока метров, вспахивая землю, и бросает ангела в уцелевшие деревья. Ангел снова гасит инерцию в полёте, но имитатор вспрыгивает ему на спину, «И каждой рукой хватает по паре крыльев. И давя ногой по спине ангела. Он тянет крылья на себя. Слышаться хрусть. И крылья отделяються от тела ангела». Удар по затылку — и ангел падает, «уже не в силах что-либо сделать».</p>\n<p>Убивать его имитатор не собирался: «Ему нужны ответы. Почему жители рая устраивают нападения на другий миры?» Но перед ангелом появляется пришедший в себя защитник и «зубами прогрызает ангелу горло». Имитатор не успел его остановить и смотрел на защитника «с неким разочировающим взглядом», в котором «всё ещё остаётся невероятное волнение за защитника».</p>\n<p>Таким образом, вопрос имитатора остался без ответа, а ангел погиб, ничего не сказав.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0233-S08", "PS-0233--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имени у персонажа нет — он назван только «ангел».</li>\n<li>В переписке нет ни одной его реплики; говорит ли он вообще — не сказано.</li>\n<li>Мотив нападения на подопечных рассказчика не объяснён; ответы на вопрос «Почему жители рая устраивают нападения на другий миры?» так и не получены — это прямо зафиксировано в самом тексте.</li>\n<li>Прямого утверждения, что ангел родом из рая, в описании его появления нет; отнесение к жителям рая следует только из вопроса имитатора.</li>\n<li>Не сказано, единственный ли он такой, есть ли другие ангелы и является ли «ангел» видом или личным обозначением.</li>\n<li>Разумность, наличие воли и подчинённость кому-либо (правителю рая или иному) не оговорены.</li>\n<li>Назначение нимба не описано.</li>\n<li>Не сказано, восстанавливаются ли крылья и что вообще способно его убить, кроме перегрызенного горла: взрыв, «Способный снести здания», его не убил.</li>\n<li>Каким образом ангел попал в мир рассказчика (до чёрной дымки) — не сказано.</li>\n<li>Что стало с телом после смерти, в переписке не сказано.</li>\n<li>Реплика 2025-03-20 помечена как «вне вселенной», и как она соотносится с сюжетным текстом 2025-03-19 — авторами не оговорено.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0233--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в мирах:</strong> <a href=\"MR-0124.html\">Чёрная дымка</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0233--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-03-19</td>\n<td>305855–305858</td>\n<td>w0083</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-20</td>\n<td>306457–306466</td>\n<td>w0083</td>\n<td>вне вселенной (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0233-angel.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0233--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0233.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0233-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0233/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дороже всего <code>VS-0013</code> «вне вселенной»: статьи нет, база 15 911, и на неё завязано пятнадцать статей справочника — <code>PS-0233</code>, <code>PS-0231</code>, <code>PS-0199</code>, <code>PS-0211</code>, <code>PS-0216</code>, <code>PS-0229</code>, <code>MR-0095</code>, <code>MR-0123</code>, <code>MR-0124</code>, <code>MR-0207</code>, <code>SP-0060</code>, <code>SP-0204</code>, <code>SP-0210</code>, <code>IS-0041</code>, <code>IS-0060</code>. У каждой в шапке стоит «статьи ещё нет». Для ангела это не формальность: вся его авторская характеристика — «Ангел красивый», «Он не страшный», «У каждого есть \"но\"» — помечена именно этой вселенной. То есть единственное, что сказано о персонаже вне боя, лежит в разделе, которого не существует, и статья вынуждена объяснять эту пометку в собственных пробелах.</p>\n<p>Второе — ангел как вид, а не как имя. <code>PS-0245</code> «Ангелы (как биологический вид)» — статьи нет, база 5 210; <code>MR-0130</code> «раса, связанная с ангелами» — статьи нет, 6 696. Ссылок на них ноль, поэтому по числам это не блокер, но почти двенадцать тысяч знаков лежат ровно под тем вопросом, который статья называет своим пробелом: единственный ли он такой и вид это или личное обозначение.</p>\n<h3>С чего начать</h3>\n<p>В базе. Обе карточки про ангелов — одно окно, w0086, 2025-03-30, id 314452–314469 и 314494–314512, то есть через одиннадцать дней после текста с ангелом. Там Слава спрашивает сам: «Как думаешь сколько живут ангелы / Если представить что это биологический вид»; Миколай отвечает «от 500 до 2000 лет», потом говорит, что хотел назвать миллионы, допускает бессмертие и кидает классификацию видов бессмертия с просьбой выбрать. В <code>MR-0130</code> — малочисленная раса, связанная с ангелами, прожившая тысячу лет и получившая от этого психические отклонения. Оговорка обязательная: у обеих карточек вселенная помечена «неясно», соседом стоит «новый мир (сказка о новом мире)», и на «Апостол» этот разговор не отнесён. Решать, а не искать.</p>\n<p>В архив — за одним хвостом: Миколай сказал «ну хочешь исследование проведу?» и «мне тоже интересно» (id 314460–314461). Проводилось ли исследование, по базе не видно. Смотреть окна после w0086.</p>\n<p>Чего в архиве заведомо нет: ответа на вопрос имитатора «Почему жители рая устраивают нападения на другий миры?». Он не потерян при разборе — он не получен внутри самого текста, и текст это фиксирует.</p>\n<h3>Как развивалось</h3>\n<p>19 марта — ангел вводится и в том же тексте гибнет: облик, четыре способа драться, вырванные крылья, перегрызенное горло. Ни одной реплики, ни до, ни во время, ни перед смертью. 20 марта — не сюжет, а спор о том, обязан ли монстр быть страшным; ангел получает единственную оценку от автора и вместе с ней уходит в «вне вселенной». 30 марта — слово «ангел» возвращается, но уже без персонажа: срок жизни, биология, бессмертие, раса на тысячу лет, — и этот разговор к мартовскому ангелу не привязан. Ввели и в том же сообщении закрыли; через сутки вынесли за пределы вселенной; через одиннадцать дней вернулись к слову, но не к тому, кто им назван.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Про перагов правило принадлежности проговорено с точностью до оговорки: они «падший ангелы», они похожи на ангелов из мифов — «но лишь похожими». Сходство названо, тождество отдельно снято. Про самого ангела обратного правила нет: если пераг ангелом только кажется, то чем ангел является, не сказано ни разу — ни видом, ни существом рая, ни чьим-то изделием. Для похожего случая граница проведена, для основного — нет.</p>\n<h3>Отклик</h3>\n<p>Держит здесь одна пара строк: «Я уродливый и страшный. Отражения этого тёмного и страшного мира. Защищаю и стараюсь спасти людей. А ангел. Белый и чистый. Лишь убивает». Всё описание облика — перья, четыре руки, четыре крыла, нимб «как в сказках» — работает не на красоту, а на этот счёт: красивое убивает, страшное защищает, и никто из двоих об этом не спорит, потому что ангел вообще не говорит. И дальше Слава не даёт из этого мораль, а отвечает Миколаю в лоб: «У каждого есть \"но\" Какая разница чем это \"но\" Отличается» — то есть отказывается делать из красивого убийцы фигуру. Отдельно зацепил финал: имитатору нужен был ответ, он специально оставил ангела живым — и защитник перегрыз ему горло раньше, чем тот успел вмешаться. Вопрос убит вместе со свидетелем, и разочарованный взгляд имитатора на это — самая точная реакция, какая тут возможна. Единственный персонаж на весь эпизод, который молчит, и он же единственный, кто мог бы объяснить, зачем всё это.</p></div>", "r": []}];</script>
