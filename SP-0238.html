<script>const BASE="";const DOCNAME="Белые глаза";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0238-S01", "SP-0238--mehanika"], "h": "<p>Белые глаза — общая способность всей расы апостолов, а не отдельного персонажа. Задача, с которой Слава начинал (2025-09-17, id 366109–366112): «Для расы апостолов нужно дать какую-ту уникальную способность. Именно всём апостолом». Требования к ней он поставил сразу два — чтобы «сочеталось с белыми глазами», но при этом «было больше физиологическая».</p>\n<p>Итоговая формулировка (2025-09-17, id 366117) с тех пор повторяется в переписке почти дословно:</p>\n<div class=\"q\"><p>«После активации белых глаз то для них время замедляется ( но они не становятся быстрее) и всех их чувства в улучшаются и они становятся сверх чувствительными. Зрения слух осязания запах и вкус.»</p></div>\n<p>То есть замедляется именно восприятие времени, а не тело: апостол «не становится быстрее», он успевает больше воспринять и обработать. Обостряются все пять чувств — зрение, слух, осязание, запах и вкус, — и они «становятся сверх чувствительными».</p>\n<p>Дальше — что это даёт в бою (id 366117):</p>\n<div class=\"q\"><p>«Но зато у них словно всё на ладони они ощущать и видят всё что находиться вокруг. И способны словно предсказывать движение противников по слуху или зрению.<br>И становятся невероятно точными»</p></div>\n<p>Предсказание движений идёт именно «по слуху или зрению» — это следствие обострённых чувств, а не отдельное предвидение.</p>\n<p>Способ включения назван позже (2025-10-20, id 376401): апостолы «могут использовать белый глаза направив туда Оам». То есть активация — это направление Оам в глаза. Там же (id 376402) сказано и общее положение апостолов по отношению к Оам: «Как ясно они у них лучший контроль Оам».</p>\n<h3>Физиологическая основа</h3>\n<p>Апостол в описании 2025-10-20 (id 376401) — один из видов мутантов, возникших от воздействия Оам:</p>\n<div class=\"q\"><p>«Апостолы- это люди, у которых в утробе матери мутировало нервную систему мозг и глаза. Из-за этого их ней пять чувств, работоспособность мозга, реакция, точность выше чем у обычного человека в несколько раз.»</p></div>\n<p>Там же — как апостолы вообще получают доступ к Оам, в отличие от обычных людей: «Обуздать Оам они могут без поглощения огромного количества Оам. Им достаточно пережить одну эмоциональную ситуацию, и они неосознанно воспользуются Оам. И дальше они могут пользоваться им без проблем». Обычному человеку для этого нужно поглотить воду или воздух с большой концентрацией Оам и пережить это — с риском, что «лёгкий или сосуд лопаются, либо Оам просто остановит сердца либо Оам из-за своей токсичности убьет человека».</p>\n<h3>Численные пределы</h3>\n<p>Уточнялись в диалоге 2025-10-03 (id 370838–370851). Миколай спросил, насколько далеко достаёт восприятие и «могут почувствовать что в России находясь в Австралии?». Слава ответил «Да», затем назвал «100 м», затем добавил исключение: «Имитатор и звездочёт могут . Но если сконцентрируется». На вопрос про запах — тоже «100 м». Отдельно названо, что апостолы чувствуют «Температуру воздуху и давлению».</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0238-S02", "SP-0238--ogranicheniya-i-cena"], "h": "<p>Дебаффы Слава прописал в том же сообщении, что и саму способность (2025-09-17, id 366117), не откладывая.</p>\n<p>Первое — боль:</p>\n<div class=\"q\"><p>«Из-за и боль они ощущают больнее.»</p></div>\n<p>Обострение чувств не выборочное: усиливается и болевая чувствительность.</p>\n<p>Второе — время удержания:</p>\n<div class=\"q\"><p>«Но опять же долго держать включёнными такое восприятия они не могут. Мозг просто не выдержит такое большое количество информации и нагрузки.»</p></div>\n<p>Ограничение упирается в объём информации и нагрузку на мозг. Конкретный срок, сколько именно можно держать белые глаза включёнными, в переписке не назван.</p>\n<p>Отдельно в диалоге о пределах (2025-10-03, id 370847–370851) названы сроки выживания апостола: без воды — «7» (единица не названа), без воздуха — «3 минуты». К самой активации белых глаз это не привязано.</p>\n<p>Ещё одно ограничение по восприятию названо не для апостолов, а для Азуриэля (2025-10-20, id 376401): «находясь в толпе он теряется и не может сконцетрироваться». На апостолов оно в переписке не переносится.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0238-S03", "SP-0238--nositeli"], "h": "<p>Белые глаза есть у всей расы апостолов — это ставилось условием с самого начала: «Именно всём апостолом» (id 366109).</p>\n<p>Поимённо в связи со способностью названы Имитатор и Звездочёт — как те, кто может почувствовать через континент, «но если сконцентрируется» (2025-10-03, id 370842). Апостолы ли они, в переписке прямо не сказано.</p>\n<p>Азуриэль в навигации записи стоит в связанных, но его способность описана как другая и прямо от эмпатии отделена (2025-10-20, id 376401): «Азуриэль: Нейро-сканер. Его способность это не эзотерическая эмпатия, а гиперразвитое чувство, позволяющее напрямую считывать и интерпретировать биоэлектрическую активность нервной системы других существ». Белых глаз у него не названо.</p>\n<h3>Базовые характеристики апостола без активации</h3>\n<p>Приводятся в том же сообщении, что и способность (2025-09-17, id 366117; дословно повторено 2025-10-03, id 370767):</p>\n<div class=\"q\"><p>«Но и без активации белых глаз они физ. Сильный, быстрые, крепкий и владеют повышенной регенерацию ( ну не прям сверхрегенерацию, просто наверное раза 3 быстрее разный заживают) и владеют реакцию превосходящие любого человека.плюсом апостол может приспосабливаться к окружающей среде ну не прям сильно. А и они выносливый они могут обходиться без сна и чтобы на них это не как не влияло 3 дня»</p></div>\n<p>То есть: физическая сила, скорость, крепкость, регенерация примерно втрое быстрее обычной (оговорка «не прям сверхрегенерацию»), реакция выше любой человеческой, приспособление к окружающей среде («не прям сильно») и до 3 суток без сна без последствий.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0238-S04", "SP-0238--kak-menyalas-po-versiyam"], "h": "<p><strong>2025-09-17, id 366109–366116 (окно w0105).</strong> Перебор вариантов. Слава ставит задачу и сразу отсекает часть поля: «Сверх зрения или типа всё видящая ока я больше не хочу». Требования — сочетаться с белыми глазами и быть «больше физиологическая». Названы три варианта: «что-то вроде прозрачного зрения из клинка рассекающего демона», «типа восприятия времени ( ну то бишь улучшенная реакция» и, в итоге, «Ну наверное восприятия времени и сверхчувства как у Максима».</p>\n<p><strong>2025-09-17, id 366117 (окно w0105).</strong> Окончательная формулировка, написанная одним куском: замедление времени без ускорения тела, сверхчувствительность всех пяти чувств, «всё на ладони», предсказание движений противника по слуху или зрению, невероятная точность. В том же сообщении — оба дебаффа (усиленная боль, мозг не выдерживает долгой нагрузки) и базовые характеристики апостола без активации.</p>\n<p><strong>2025-09-17, id 366126 (окно w0105).</strong> В том же окне заходит описание Азуриэля — синяя (возможно розовая) кожа, острые уши как у эльфа, меняющиеся от эмоций узоры на лице, зимняя одежда, гибкость, эмпатия, «Прекрасно ощущать намерения». К белым глазам это описание не привязано.</p>\n<p><strong>2025-10-03, id 370766–370769 (окно w0106).</strong> Описание способности повторено дословно, слово в слово с версией от 2025-09-17. Изменений в тексте нет.</p>\n<p><strong>2025-10-03, id 370838–370851 (окно w0106).</strong> Добавлены числа: слух — 100 м, запах — 100 м, чувствуются температура воздуха и давление; исключение для Имитатора и Звездочёта при концентрации; без воды 7, без воздуха 3 минуты.</p>\n<p><strong>2025-10-05 — 2025-10-06, id 371685–371832 (окно w0106).</strong> Тема не развивается. Миколай смотрит аниме и замечает: «там перс тоже придумывает апостолов для истории». Слава отвечает: «Ну не белоглазых». Миколай: «это да». На саму способность это никак не влияет.</p>\n<p><strong>2025-10-20, id 376399–376403 (окно w0107).</strong> Способность вписывается в общее объяснение Оам. Появляется происхождение апостолов как мутантов (мутация нервной системы, мозга и глаз в утробе матери), способ активации — направить Оам в глаза, — и фраза про лучший контроль Оам. Само описание эффекта белых глаз повторено прежним текстом, без правок. В том же сообщении Слава перечисляет остальные линии мутантов: Аскизы, Дети мирового древа, Азуриэль, Поротай, Вампиры. Заканчивает: «Пока что так».</p>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S05", "SP-0238-S05", "SP-0238--otklonennye-varianty"], "h": "<ul>\n<li><strong>Сверхзрение</strong> — отвергнуто прямо: «Сверх зрения или типа всё видящая ока я больше не хочу» (2025-09-17, id 366109).</li>\n<li><strong>Всевидящее око</strong> — отвергнуто там же, той же фразой.</li>\n<li><strong>Прозрачное зрение из «Клинка, рассекающего демонов»</strong> — предложено (id 366113), но не выбрано; словами оно не забраковано, просто через несколько минут Слава остановился на другом.</li>\n<li><strong>«Восприятие времени» само по себе</strong>, без сверхчувств (id 366115, с расшифровкой «ну то бишь улучшенная реакция») — вариант промежуточный: в итоге взят вместе со сверхчувствами (id 366116).</li>\n</ul>", "r": []}, {"t": "Связь с другими способностями", "a": ["S06", "SP-0238-S06", "SP-0238--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Белые глаза — не самостоятельная сила, а применение Оам: активация состоит в том, что апостол направляет Оам в глаза (2025-10-20, id 376401). За этим стоит общее устройство Оам: человек поглощает частицы через дыхание и кожу, они расходятся по телу с кровью, у каждого своя ёмкость, избыток выходит «через споры, с выдохом и просто через кожу либо другие способы выделением».</p>\n<p>Способность стоит в ряду других мутаций от Оам, перечисленных в одном сообщении (2025-10-20, id 376401–376402), но пересечений с ними в переписке не названо:</p>\n<ul>\n<li><strong>Аскизы</strong> — вечные дети от мутировавшей аксолотли-матки: не стареют, быстрая регенерация, зверский аппетит, «инстинкт голода выше разума», не чувствуют боли.</li>\n<li><strong>Дети мирового древа</strong> — гуманоидные деревянные существа с оранжевой сердцевиной, где хранится Оам; сказано прямо, что «не кто из апостоловы не сможет нормально их ранить», а рану они регенерируют. Огонь им не вредит, могут двигаться в земле и внутри деревьев.</li>\n<li><strong>Азуриэль</strong> — «Нейро-сканер», прямое считывание биоэлектрической активности нервной системы, с оговоркой, что это «не эзотерическая эмпатия, а гиперразвитое чувство». Азуриэли «с рождения могут использовать Оам и скорость поглощения и выделения Оам у них выше чем у кого либо».</li>\n<li><strong>Поротай</strong> — от съеденного мутировавшего жука: смерть, низший Поротай (крепкость, реген, сверхсила, потеря личности) или высший Поротай (реген, контроль над низшими, обращение частей тела в камень, сверхсила) с дебаффом в виде второй жестокой личности.</li>\n<li><strong>Вампиры</strong> — мутация крови и пищевой системы: чувствуют Оам, выпив кровь, кровью же пополняют его запасы, а сама кровь «легко контролируемая подобно конечности».</li>\n</ul>\n<p>Единственное названное прямое сопоставление между этими линиями — что апостолы не могут нормально ранить Детей мирового древа.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "SP-0238-S07", "SP-0238--probely"], "h": "<div class=\"gaps\"><ul>\n<li>«Сверхчувства как у Максима» (2025-09-17, id 366116) — кто такой Максим, в переписке не объясняется.</li>\n<li>«Без воды 7» (2025-10-03, id 370850) — единица измерения не названа (дней?).</li>\n<li>Сколько именно можно держать белые глаза включёнными — не названо, только «долго держать &lt;…&gt; не могут».</li>\n<li>Ответы про дальность противоречат друг другу и не сведены: на вопрос, почувствуют ли из Австралии происходящее в России, сказано «Да», следом — «100 м», следом — исключение для Имитатора и Звездочёта при концентрации. Что из этого общее правило, в переписке не решено.</li>\n<li>Апостолы ли Имитатор и Звездочёт и почему им доступно больше — не сказано.</li>\n<li>Как выглядят глаза при активации и меняются ли внешне — не описано.</li>\n<li>Стоимость активации кроме нагрузки на мозг (расход Оам, откат, последствия перегрузки) — не названа.</li>\n<li>Что происходит, если держать белые глаза дольше предела, — прямо не сказано, только «Мозг просто не выдержит».</li>\n<li>Есть ли у апостолов различия в силе белых глаз между собой — не обсуждалось.</li>\n<li>Связь белых глаз с остальными линиями мутантов, кроме упоминания, что апостолы не могут ранить Детей мирового древа, не установлена.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0238--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0056.html\">Апостолы (21 апостол; «насекомые»)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0008.html\">Оам</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0238--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-09-17</td>\n<td>366109–366116</td>\n<td>w0105</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-09-17</td>\n<td>366117–366126</td>\n<td>w0105</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-10-03</td>\n<td>370766–370769</td>\n<td>w0106</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-10-03</td>\n<td>370838–370851</td>\n<td>w0106</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-10-06</td>\n<td>371685–371832</td>
