<script>const BASE="";const DOCNAME="7 островов";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0018-S01", "MR-0018--ustroystvo"], "h": "<p>Мир состоит из семи островов. Каркас задан Славой 2024-07-03 (id 194774–194777) одним списком:</p>\n<pre><code>7 островов\n1 оазис ( Имитатор )\n2 ??????( Нуар ( челек с растворением личности ))\n3 асгар ( Избранный ( ты его не знаешь))\n</code></pre>\n<p>Тут же дано определение единицы мира: «Остров это город ну или страна» (194775). На момент составления списка готовы три острова: «3 есть», «Надо 4 и у них должен быть защитник типо Иметатора» (194776–194777). То есть у каждого острова есть защитник, и защитник — обязательная часть острова, а не украшение.</p>\n<p>Почему островов именно семь, объяснено так: «Не знаю. Это число типо не слишком много и не слишком мало» (194896).</p>\n<p><strong>Биомы.</strong> Способ достроить недостающие четыре острова предложил Миколай: «может это будут разные биомы?» (194778), «тогда всё куда проще, болото, тропики, вулканы, айсберг» (194780). Слава согласился: «Ну пока норм». Под эти биомы Миколай сразу дал четырёх защитников (194785):</p>\n<pre><code>1. блуждающий огненный гриб\n2. дриада великан\n3. тот пламенный перс\n4. юкиона с миниганом в котором снаряд сосульки\n</code></pre>\n<p>Соответствие защитников биомам в списке не проставлено; из последующей переписки видно только, что юкиона относится к айсбергам.</p>\n<p><strong>Режимы правления.</strong> Острова — «это разные страны с разными режимами» (195995–195996). Проработку мира договорились начинать именно с островов, и разбирать в них «Политику, экономикю, черты» (194908). Что названо конкретно:</p>\n<ul>\n<li>Асгард — теократия: «допустим Асгард это уже теократия, тобиж власть у церкви» (194910);</li>\n<li>Оазис — «Это можно сказать обычный город с мирными людьми. Вся власть находится у Имитатор он не только защищает но и отвечает за политику» (194915), что Миколай определил как «конституционная монархия» (194916);</li>\n<li>остров Нуара — «Федеративная республика» (194921). Тоталитаризм Миколай сначала предлагал отдать Нуару, но Слава возразил: «Ну нуар хороший челик. А вообще можно одному из островов» (194920);</li>\n<li>айсберги — тоталитаризм: «ну тогда дам этот грех женщине», «на айсбергах будет тотальный контроль», «и ебнутая женщина с миниганом убивать всех ослушивающихся» (194922–194924).</li>\n</ul>\n<p><strong>Война.</strong> Мир не мирный. «Нет конечно я сделаю так чтобы хотя бы 3 острова воевали» (194890). Причина войны на тот момент не придумана: на вопрос «а причина» — «Придумаю», «Для начала острова хотя бы» (194892–194894).</p>\n<p>Распределение мирного и военного между соавторами (2024-07-04): «Именно у тебя утопия. Там и война и революция. У меня почти все мирные острова» (196006) — реплика Славы, где «утопия» употреблена в значении, обратном словарному, что Миколай сразу поправил: «утопия если что это рай», «антиутопия это наоборот». Миколай раскладывает то же самое со своей стороны: «ты хочешь создать преступную организацию», «и ввести военное положение меж тремя островами», «скорее всего это будут твои», «а мои чисто на периферии», «для раскрытия и глубины» (195997–196003).</p>\n<p>По Асгарду: «Асгарде остров религии и возможно они будут типо Гитлера» (196022), «Типо верить что они посланники богов а все остальные демон так они будут воспитывать детей и т.п.» (196025). Война там — «С кем то», не гражданская. По Оазису: «Я говорил что в оазисе мире среди гражданских», затем уточнение: «Точней не война, а мини конфликт в оазисе полноценный войны не будет» (196024, 196027). На вопрос «а из-за чего конфликт?» (196030) ответа в окне нет.</p>\n<p><strong>Защитники не привязаны к своим островам.</strong> «я вот не хочу чтобы защитки чисто сидели» (196119). Ответ Славы: «Сталкер наемник. Имитатор часто будет покидать остров по заданием. А остальные твой челики не знаю» (196122).</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0018-S02", "MR-0018--naselenie"], "h": "<p>Помимо жителей островов и их защитников в мире названы:</p>\n<ul>\n<li>преступная организация — «Ну там будет преступная организации» (194887). Она не разлита по всему миру: на вопрос «почему преступленая организация везде», «как они и зачем расселись везде» — «Они не везде есть группа людей и все» (196123);</li>\n<li>группа сверхлюдей как возможные главные герои: «Наверное будут группа сверх людей» (194889).</li>\n</ul>\n<p>Поимённо в связи с миром названы защитники и персонажи: Имитатор (Оазис), Нуар — «челек с растворением личности», Избранный (Асгар/Асгард), Юкиона (Айсберг), сталкер-наёмник (Остров сталкера), а также Остров Нуара (подводный). Четыре защитника, предложенные Миколаем под биомы, перечислены выше.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0018-S03", "MR-0018--mesto-vo-vselennoy"], "h": "<p>Вселенная у записи указана двойная — «7 островов» и «монстры». В самой переписке окон w0041 и w0042 название вселенной не произносится.</p>\n<p>Отдельное положение мира зафиксировано 2024-09-04 (id 227721–227731): 7 островов названы отсылкой, спрятанной в рисунке стенда Славы (свиток вместо трусов). Мир, который создаёт этот стенд, — «на котором ты можешь создавать что угодно», «но с разной степенью реализации», «это крч мир который может создать твой стенд», «он будет работать как расширенная территория», «как в мире магической битвы». Собственного описания мира в этом окне нет, только отсылка.</p>\n<p>Также в связях записи значится «Объединение двух миров».</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0018-S04", "MR-0018--kak-menyalsya-po-versiyam"], "h": "<p><strong>2024-07-03, id 194774–194785.</strong> Исходный список: 7 островов, из них названы три с защитниками (Оазис — Имитатор, безымянный остров — Нуар, Асгар — Избранный). Остров = город или страна. Нужны ещё четыре острова и четыре защитника. Миколай предлагает делать острова разными биомами (болото, тропики, вулканы, айсберг) и даёт под них четырёх защитников.</p>\n<p><strong>2024-07-03, id 194886–194896.</strong> Мир объявлен немирным: минимум три острова будут воевать, причина откладывается. Объяснено число островов. Упомянуты преступная организация и группа сверхлюдей.</p>\n<p><strong>2024-07-03, id 194900–194935.</strong> Договорились начинать проработку с островов: политика, экономика, черты. Розданы режимы правления (теократия Асгарду, конституционная монархия Оазису, федеративная республика Нуару, тотальный контроль айсбергам). Миколай объясняет, зачем задаёт много вопросов: «я просто хочу больше выудить контекста для того чтобы реально развивать уже мир, а поэтому спрашиваю дохуя»; Слава отвечает: «Нет так наоборот мир прароботони становится если много вопросов задавать. Как? Откуда? И т.п.». Слава признаёт, что три «острова Миколая» ещё не продуманы, но принимает их: «Вообще на счёт тех 3 островов надо подумать кто защитник ну или мне смириться с этими», «Ну я даже их в голове продумать не успел. Нужно время». Миколай: «да путь будут».</p>\n<p><strong>2024-07-03, id 194993–195004.</strong> Отношения и конфликты между островами отложены: «короче, у кого конфликты» — «Давай попозже подумаем». Разговор обрывается.</p>\n<p><strong>2024-07-04, id 195991–196030.</strong> Перечисление того, что уже есть: 7 островов, на каждом защитник, разные страны с разными режимами, преступная организация, военное положение между тремя островами. Распределение по соавторам: у Миколая война и революция, у Славы «почти все мирные острова». Уточнения по Асгарду (религия, «типо Гитлера», война с кем-то) и Оазису (не война, а мини-конфликт среди гражданских).</p>\n<p><strong>2024-07-04, id 196119–196123.</strong> Защитники не должны сидеть на своих островах: сталкер — наёмник, Имитатор часто покидает остров по заданиям. Про защитников Миколая — «не знаю». Преступная организация распространена не повсеместно.</p>\n<p><strong>2024-09-04, id 227721–227731.</strong> 7 островов появляются в другом качестве: как мир, который может создать стенд-свиток, работающий по образцу расширенной территории из «мира магической битвы». Отсылка спрятана в рисунке.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0018-S05", "MR-0018--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Название вселенной в переписке ни разу не произнесено (окна w0041, w0042).</li>\n<li>Второй остров списка остался без имени: в исходном перечне на его месте стоит «??????».</li>\n<li>Четыре «острова Миколая» существуют только как биом плюс защитник; ни политики, ни экономики, ни названий у них нет.</li>\n<li>Соответствие четырёх предложенных защитников («блуждающий огненный гриб», «дриада великан», «тот пламенный перс», «юкиона с миниганом в котором снаряд сосульки») конкретным биомам не проставлено, кроме юкионы и айсбергов.</li>\n<li>Причина войны между тремя островами не придумана: «Придумаю».</li>\n<li>Из-за чего мини-конфликт в Оазисе — вопрос задан (196030), ответа в окне нет.</li>\n<li>Отношения и конфликты между островами отложены «попозже» и в этих окнах не разобраны.</li>\n<li>Какие именно три острова воюют, поимённо не названо; сказано только «скорее всего это будут твои».</li>\n<li>Режимы правления названы не для всех семи островов.</li>\n<li>В окне w0056 сам мир не раскрыт, только отсылка; существовал ли он там раньше в переписке — неясно.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0018--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0104.html\">Нуар</a></li>\n<li><strong>Упомянут в мирах:</strong> <a href=\"MR-0020.html\">Оазис</a>, <a href=\"MR-0023.html\">Остров сталкера</a>, <a href=\"MR-0042.html\">Концепция появления силы</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0030.html\">Защитники островов</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a>, <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0018--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-03</td>\n<td>194774–194785</td>\n<td>w0041</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-03</td>\n<td>194886–194896</td>\n<td>w0041</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-03</td>\n<td>194900–194935</td>\n<td>w0041</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-03</td>\n<td>194993–195004</td>\n<td>w0041</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-04</td>\n<td>195991–196030</td>\n<td>w0042</td>\n<td>7 островов (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2024-07-04</td>\n<td>196119–196123</td>\n<td>w0042</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-09-04</td>\n<td>227721–227731</td>\n<td>w0056</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0018-7-ostrovov.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0018--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0018.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
