<script>const BASE="";const DOCNAME="Масочник";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0195-S01", "PS-0195--proishozhdenie"], "h": "<p>Персонаж существует в двух состояниях, разнесённых почти на два с половиной месяца и по двум вселенным: сначала как строчка в реестре персонажей вселенной «Апостол» (2025-01-28), затем как названный злодей в «Нимбе» (2025-04-08).</p>\n<p>Первое появление — 2025-01-28 (id 285519–285527, окно w0073), в списке, который Слава скидывает целиком: «Список персонажей вселенной» с разделами Благословенные / Враг / Церковь / Военный / Сторонние силы / Семь грехов / Существа / Аномалии / Оружие / Артефакты / Идеи. Масочник стоит в разделе «Благословенный», последним в перечне, сразу после «Ученица???», и записан с эмодзи маски:</p>\n<div class=\"q\"><p>Масочник 🎭</p></div>\n<p>Перед ним в том же разделе идут Имитатор, Агрегат, Разрушительнитца, Палач, Защитник, Дитя света, Бессмертный выродок, Хулиган, Вибрация, Ученица. У части имён в скобках указаны сопутствующие обозначения (у Имитатора — «ветреной 🌬; электро⚡️; птичка 🔈», у Агрегата — «теневые братья 🌑; экстримал ⏳; страдалец 🔪» и так далее); у Масочника скобок нет — только имя и эмодзи. Никакой разработки при этом появлении нет.</p>\n<p>Список подан как изменённая редакция уже существовавшего: сразу после него Слава пишет «Угадай что изменилась 😂», Миколай спрашивает «что добавил?» и отвечает себе — «бля», а затем добавляет: «ваще я ждал что сущности появятся». Разделы «Военный» и «Существа» в этой редакции пустые.</p>", "r": []}, {"t": "Связи с другими", "a": ["S02", "PS-0195-S02", "PS-0195--svyazi-s-drugimi"], "h": "<p>Демон — второй персонаж, названный вместе с Масочником в качестве злодея (2025-04-08, id 317515): «Демон и масочник». Двойной статус закреплён за парой целиком, они названы вместе.</p>\n<p>Нимб — структура, к руководству которой Масочник отнесён. На вопрос Миколая «это челы другого мира или директора нимба или всё вместе?» Слава отвечает: «И то и другой» (id 317516–317517). То есть Масочник одновременно и персонаж другого мира, и из руководства Нимба; ни одна из двух половин статуса не раскрыта.</p>\n<p>Список персонажей вселенной (Благословенные / Враг / Церковь / Военный / Сторонние силы / Семь грехов / Существа / Аномалии / Оружие / Артефакты / Идеи) — реестр, в котором Масочник впервые появился, в разделе благословенных.</p>\n<p>Связь между двумя состояниями — благословенным из реестра «Апостола» и злодеем «Нимба» — в переписке не проговорена.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S03", "PS-0195-S03", "PS-0195--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2025-01-28, вселенная «Апостол» (по дате объявления), окно w0073, id 285519–285527.</strong></p>\n<p>Новое имя в разделе благословенных во второй редакции реестра. Только название с эмодзи маски, разработки нет: ни способностей, ни оружия, ни внешности, ни связей. Больше в этом окне не упоминается.</p>\n<p><strong>Версия 2 — 2025-04-08, вселенная «Нимб» (объявлено), окно w0087, id 317508–317518.</strong></p>\n<p>Единственное упоминание в этом окне. Контекст задан вопросами Миколая о злодее: «о чем история?», «в плане злодей кто». Слава сначала отвечает про устройство материала: «Ну будут мини истории о некоторых объектов , будней нимба и т. П. Пока я ещё не до конца придумал мир, пусть пока будет так» (id 317512). Дальше — «Ааааааааааааааааааааааааааааааа», и следом ответ на вопрос: «Демон и масочник».</p>\n<p>На уточнение «это челы другого мира или директора нимба или всё вместе?» следует «И то и другой» (id 317517). Разговор тут же уходит в сторону: «Че ща другой мир?» (id 317518).</p>\n<p>Прежнее состояние — принадлежность к благословенным «Апостола» — при этом не отменяется и не упоминается: реестр во второй версии не пересматривается, старая строчка просто остаётся.</p>", "r": []}, {"t": "Пробелы", "a": ["S04", "PS-0195-S04", "PS-0195--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Способности не названы ни в одной из версий. Эмодзи маски 🎭 — единственное, что стоит рядом с именем; что оно означает — маска как предмет, как способность или просто иллюстрация к имени — не сказано.</li>\n<li>Внешность не описана.</li>\n<li>Характер не описан.</li>\n<li>Ничего кроме имени не сказано (w0087).</li>\n<li>Настоящее имя, пол, происхождение не названы.</li>\n<li>Не сказано, чьё именно благословение у него в первой версии и от какого мира.</li>\n<li>Не сказано, тот ли это персонаж, что и благословенный Масочник из реестра «Апостола», или совпадение имени: переход между вселенными в переписке не обсуждался.</li>\n<li>«Челы другого мира» — какого именно мира, не названо; вопрос «Че ща другой мир?» остался без ответа в этом куске.</li>\n<li>Как Масочник соотносится с Демоном (напарники, равные, подчинение) — не сказано.</li>\n<li>Что означает статус «директора нимба», в этом куске не раскрыто. Сам мир на 2025-04-08 ещё не додуман («Пока я ещё не до конца придумал мир»), поэтому место Масочника в его устройстве осталось нерешённым.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0195--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0001.html\">Апостолы (организация апостолов, «благословенные Богом»)</a>, <a href=\"GR-0009.html\">Организация Нимб (НБО)</a>, <a href=\"GR-0013.html\">Благословенные</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0001.html\">Апостолы (организация апостолов, «благословенные Богом»)</a>, <a href=\"GR-0009.html\">Организация Нимб (НБО)</a>, <a href=\"GR-0013.html\">Благословенные</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0195--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-01-28</td>\n<td>285519–285527</td>\n<td>w0073</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-04-08</td>\n<td>317508–317518</td>\n<td>w0087</td>\n<td>Нимб (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0195-masochnik.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0195--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0195.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0195-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0195/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Про самого Масочника чинить нечего — двух упоминаний хватает ровно на то, чтобы завести карточку. Дорогая дыра рядом, и она видна прямо из шапки статьи: вселенная Нимб помечена как «статьи ещё нет».</p>\n<p>Цифры такие. <code>MR-0132</code> «Нимб» — 88 701 знак базы, статьи нет, ноль входящих ссылок. <code>VS-0006</code> «Нимб» как вселенная — 21 285, статьи нет, ноль ссылок. Плюс <code>MR-0133</code> «Отделы Нимба» (1 526), <code>SP-0221</code> «Препараты Нимба» (5 182), <code>IS-0090</code> «Инцидент с вирусом Нимба» (5 635) — все без статей и без ссылок. Больше ста двадцати тысяч знаков материала об одном месте, и ни одной статьи. При этом «Нимб» как организация внутри «Апостола» описан: <code>MR-0137</code> — две ссылки, статья 6 277; <code>GR-0009</code> — статья 12 002. Половина с меньшим материалом раскрыта, половина со 120 тысячами — нет, и вторая половина как раз та, в которой Масочник числится злодеем.</p>\n<p>Второе — Демон. Единственный, с кем Масочник связан в переписке, назван с ним одной парой и в одном статусе. <code>PS-0011</code> «Демон» — 13 508 базы, статьи нет, ноль ссылок; <code>SP-0010</code> «Ускорение (Демон)» — 4 023, <code>PS-0012</code> «Напарники Демона» — 2 689, оба так же. Нет статьи о Демоне, а на него ссылается эта статья, и больше ей ссылаться не на что: реплика «Демон и масочник» — вся её связная часть.</p>\n<p>Третье, общее: единственное место первого появления — реестр. <code>SL-0053</code> — шесть входящих ссылок, статьи нет, база 20 313; <code>SL-0051</code> — шесть ссылок, статьи нет, 9 834; <code>SL-0090</code> — четыре ссылки, 5 492. Три списка с наибольшим числом ссылок во всём наборе, и ни у одного нет статьи. Масочник в них строка, и таких строк там много.</p>\n<h3>С чего начать</h3>\n<p>В базе, и не с персонажа, а с места. <code>MR-0132</code> (88 701) — там же, по объёму, должно лежать и то, кто такие директора Нимба, и <code>VS-0006</code>, <code>MR-0133</code>, <code>SP-0221</code>, <code>IS-0090</code>. Демон — <code>PS-0011</code>, <code>SP-0010</code>, <code>PS-0012</code>. Реестр, в котором имя появилось, — <code>SL-0053</code> и <code>SL-0051</code>, окно w0073.</p>\n<p>Что означает эмодзи маски, из базы не решить: ближайшие однокоренные записи — <code>SP-0259</code> «Маска», <code>SP-0251</code> «Маска ведущего», <code>SP-0090</code> «Ускорение (маска)», <code>PS-0013</code> «Парень в белой маске с улыбкой» — все в других вселенных, и связаны они с этим именем или нет, из справочника не следует. Это вопрос к авторам, а не к базе.</p>\n<p>В архив идти надо, и ориентиров два. 2025-01-28, окно w0073, id 285519–285527: список прислан целиком, но реакция на него — «ваще я ждал что сущности появятся», то есть разбора не было. Смотреть, обсуждался ли список после присылки, в тот же вечер и в следующие дни. И 2025-04-08, окно w0087, после id 317518: ответ «И то и другой» дан на уточняющий вопрос, разговор на нём не кончается, а Нимб на эту дату ещё не придуман — «пусть пока будет так». Всё, что придумано позже, где-то в архиве есть, раз в базе под Нимбом сто двадцать тысяч знаков.</p>\n<h3>Как развивалось</h3>\n<p>2025-01-28 — заявили одним именем в перечне благословенных, без пояснений в скобках, которые есть у соседей по списку. Ограничивать было нечего. Дальше два с половиной месяца ни одного упоминания. 2025-04-08 — вернулись, но в другой вселенной и в другой роли: не благословенный, а злодей Нимба, и сразу в двойном статусе. Прежняя принадлежность не отменена и не упомянута — две точки в переписке между собой не связаны. После апреля — ничего.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Про Нимб как организацию внутри «Апостола» отношение проговорено: есть организация, у неё место в мире, она числится по этой вселенной. Про Нимб как отдельную вселенную — того же рода правила нет: где проходит граница, один это Нимб или два разных, переносится ли туда что-то из «Апостола» вместе с именем. Масочник стоит ровно на этом шве — в шапке у него обе вселенной, потому что 2025-01-28 он в одной, а 2025-04-08 в другой, и как эти две записи соотносятся, не сказано. Правило для организации названо, для одноимённой вселенной — нет.</p>\n<h3>Отклик</h3>\n<p>Честно — зацепиться почти не за что, тут два упоминания и одно имя. Но одно живое место есть: ответ «И то и другой». Вопрос был поставлен как выбор из двух — челы другого мира или директора Нимба, — и ответ выбор отменяет. Обычно это признак того, что автор ещё не решил, но здесь оно сработало иначе: из отказа выбирать получился единственный признак персонажа, который у него вообще есть. Масочник — это человек, который одновременно снаружи мира и в его руководстве, и больше про него ничего не известно; при этом такой признак сам по себе интереснее, чем половина полностью расписанных карточек рядом. Второе, что осталось, — реакция Миколая на реестр: «ваще я ждал что сущности появятся». Список из тридцати имён прислан, и первое, что о нём говорят, — что в нём не то. Про состояние работы на январь 2025-го эта фраза говорит больше, чем сам список.</p></div>", "r": []}];</script>
