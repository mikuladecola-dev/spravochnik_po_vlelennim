<script>const BASE="";const DOCNAME="Игра бога";
const LEAD="";
const CH=[{"t": "Содержание", "a": ["S01", "IS-0012-S01", "IS-0012--soderzhanie"], "h": "<p>«Игра бога» — игра-вселенная, придуманная Славой поздно вечером 2 апреля 2024 года (2024-04-02, id 153126–153150). Начало разговора: Слава пишет «Сносим вселенную» и предлагает взамен новую — «Новая и более лёгкая».</p>\n<p>Исходная посылка сформулирована так: «20 человек оказались на какой-то территории и их поделили на 2 группы и т.п», «То бишь соревнование и испытания / То бишь игра бога». Отсюда и название. Отдельным сообщением добавлено: «И у всех них есть способности».</p>\n<p>Приглашение к соавторству прямое — «Хочешь сыграть?», ответ Миколая: «Го».</p>\n<p>Правила набора персонажей заданы Славой в тот же вечер:</p>\n<ul>\n<li>«От тебя 10 человека любых можешь взять из своего окружения и превратить в персонажа желательно» — то есть каждый автор берёт десять человек из собственного окружения и превращает их в персонажей; двадцать участников складываются из двух наборов по десять.</li>\n<li>«И также их способности что бы подходили под характер ну хотя бы чуть чуть и чтобы не были прям нарушающий баланс» — два требования к способностям: соответствие характеру прототипа (хотя бы частичное) и отсутствие нарушения баланса.</li>\n<li>Отдельно, уже после «Споки ноки», Слава дописывает: «Так же фотки людей которых ты брал персонажа» — то есть к персонажам прикладываются фотографии прототипов.</li>\n</ul>\n<p>Миколай отвечает «Оке, собираю команду». Ещё до правил он бросает про себя: «Моя способность лежать 24 на 7» — в дальнейшем к этому в окне не возвращаются.</p>\n<p>На следующее утро (2024-04-03, id 153406–153420) Слава ставит вопрос о продолжении: «Кстати и что дальше вот мы про всех персов рассказам и что дальше». Тут же он поясняет происхождение замысла: «( Я та про игру сказал в полусонном состояния когда спать ложился поэтому не знаю что дальше)». Через несколько сообщений он предлагает вариант и сразу признаёт его незавершённость: «Просто как идея ( можно на друг друга скидывать монстров с характеристиками и способностями, а другая .......) я не знаю чё дальше».</p>\n<p>Днём того же дня (2024-04-03, id 153452–153506) Миколай задаёт порядок действий. Он объявляет: «Мы придумали персов», «Началась игра бога».</p>\n<p>Порядок такой:</p>\n<ol>\n<li>«Мы должны прописать взаимоотношения в своей команде», «Кто главный кто баласт и т.д» — каждый автор расписывает внутреннюю иерархию своей десятки.</li>\n<li>«А потом будут они соревноваться» — турнир. На вопрос, как именно, Миколай отвечает себе сам: «Я хезе. Но идея есть».</li>\n<li>«Придумаем турнир какой-нибудь», «Ну и пропишем идею».</li>\n<li>«Мы идею турнира кидаем нейронке».</li>\n<li>«А потом прописываем наш ход» — ход каждый автор пишет в чат.</li>\n<li>«И потом в контексте тура пишем нейронке. Она сама пропишет исход. И действия. И типо кто и как победит».</li>\n</ol>\n<p>То есть авторы задают идею турнира и свои ходы, а исход, действия и победителя определяет нейросеть. Миколай подгоняет: «Так что начинай отношения прописывать пораньше», «И я начну», «И заодно идею тура придумаем». Слава соглашается: «Хорошо».</p>\n<p>Приз турнира назван там же: «А приз, лист Шакоропаля». Сразу после этого Миколай сообщает соавтору назначение приза: «По сути это будет макгафин». На вопрос Славы «Че за лист» ответ — «Если интересно погугли». Термин Миколай поясняет цитатой определения: макгафин — «предмет, цель или событие, которое является причиной развития сюжета, но само по себе не имеет большого значения для истории», важность его в том, что «он заставляет героев действовать и движет историей вперёд, зачастую приводя к конфликтам и погоням, но его конкретные свойства и природа зачастую остаются неосвещенными или оказываются несущественными для разрешения сюжета».</p>\n<p>Статус этого знания оговорён отдельно: «Только тсс», «Участникам об этом знать не нужно». То есть макгафинная природа приза — знание авторского уровня, скрытое от участников игры.</p>", "r": []}, {"t": "Персонажи", "a": ["S02", "IS-0012-S02", "IS-0012--personazhi"], "h": "<p>Двадцать участников: по десять от каждого автора, взятых из собственного окружения и превращённых в персонажей. Поимённо в самом окне w0029 состав не перечислен; со «Игрой бога» связаны Адам Тихой, Аполлон, Войс Патина, Дима, Дядон Гомбевский, Каваи Навалов, Кирилл, Лист Шакоропаля, Максим, Нат Магнов, Нерадио Попов, Ояш Бичевский, Перо Кладович, Пил Пончик, Саша, Терор Мачилович, Турнир. Кто из них в какой из двух команд — в переписке не сказано.</p>\n<p>Роли внутри команды заданы только категориями — «Кто главный кто баласт и т.д»; конкретное распределение не прописано.</p>\n<p>Лист Шакоропаля фигурирует не как персонаж, а как приз турнира и макгафин.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "IS-0012-S03", "IS-0012--mesto-vo-vselennoy"], "h": "<p>«Игра бога» объявлена как замена предыдущей вселенной: разговор открывается словами Славы «Сносим вселенную» и «Новая и более лёгкая». Название вселенной совпадает с названием игры и происходит от формулы «То бишь соревнование и испытания / То бишь игра бога».</p>\n<p>Внутри вселенной с историей связаны Турнир (форма соревнования) и Лист Шакоропаля (приз турнира, макгафин).</p>\n<p>Особенность устройства: часть повествовательной работы вынесена за пределы переписки — исход туров, действия и победителя определяет нейросеть, которой авторы отдают идею турнира и свои ходы.</p>", "r": []}, {"t": "Состояние", "a": ["S04", "IS-0012-S04", "IS-0012--sostoyanie"], "h": "<p>Замысел остановился на стадии правил. За окно w0029 (2024-04-02 — 2024-04-03) объявлены посылка, правила набора персонажей, порядок работы, механизм с нейросетью и приз. Ни отношения в командах, ни сам турнир в окне так и не прописаны, хотя Миколай объявил «Началась игра бога» и договорился с соавтором начинать.</p>\n<p>Версий три, все в пределах двух суток:</p>\n<ul>\n<li>Версия 1 (2024-04-02, id 153126–153150) — объявление игры и правила набора персонажей.</li>\n<li>Версия 2 (2024-04-03, id 153406–153420) — вопрос «что дальше» после того, как персонажи названы; признание Славы, что игра придумана «в полусонном состояния»; предложенный и не развитый вариант со скидыванием монстров.</li>\n<li>Версия 3 (2024-04-03, id 153452–153506) — порядок работы от Миколая, механизм с нейросетью, приз-макгафин.</li>\n</ul>\n<h3>Отклонённые и неразвитые варианты</h3>\n<ul>\n<li>«Можно на друг друга скидывать монстров с характеристиками и способностями, а другая .......» (2024-04-03, id 153417) — предложено Славой как «просто как идея», с оговоркой «я не знаю чё дальше»; окончание фразы оборвано самим автором. Дальше в окне к этому варианту не возвращаются; вместо него Миколай предлагает турнир с нейросетью.</li>\n<li>«Моя способность лежать 24 на 7» (2024-04-02, id 153139) — брошено Миколаем до объявления правил, развития не получило.</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S05", "IS-0012-S05", "IS-0012--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Ни отношения в командах, ни сам турнир в окне так и не прописаны.</li>\n<li>Что такое «территория», на которой оказались 20 человек, — не описано.</li>\n<li>По какому принципу двадцать делятся на две группы, кто делит — в переписке не сказано.</li>\n<li>Кто такой «бог» из названия и есть ли он как действующее лицо — не сказано.</li>\n<li>Идея турнира («придумаем турнир какой-нибудь») осталась ненаписанной.</li>\n<li>Что такое лист Шакоропаля по существу — не объяснено; на вопрос «Че за лист» ответ был «Если интересно погугли». По природе приза оговорено только то, что это макгафин, свойства которого «зачастую остаются неосвещенными».</li>\n<li>Поимённый состав двух команд по десять человек в окне не приведён.</li>\n<li>Какая именно нейросеть и как именно ей передаются идея тура и ходы — не уточнено.</li>\n<li>Судьба «снесённой» предыдущей вселенной — не описана.</li>\n<li>Чем закончился разговор про монстров (обрыв «а другая .......») — осталось нерешённым.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["IS-0012--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0049.html\">Команда Миколая (10 персонажей игры бога)</a>, <a href=\"GR-0050.html\">Команда Славы (персонажи игры бога)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0014.html\">игра бога</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["IS-0012--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-04-02</td>\n<td>153126–153150</td>\n<td>w0029</td>\n<td>игра бога (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-04-03</td>\n<td>153406–153420</td>\n<td>w0029</td>\n<td>игра бога (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-04-03</td>\n<td>153452–153506</td>\n<td>w0029</td>\n<td>игра бога (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/istorii/IS-0012-igra-boga.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["IS-0012--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/IS-0012.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
