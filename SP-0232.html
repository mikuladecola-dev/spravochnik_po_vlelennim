<script>const BASE="";const DOCNAME="Реконструкция";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0232-S01", "SP-0232--mehanika"], "h": "<p>Реконструкция — способность Куры (Арбетара), преобразующая опыт и воспоминания в энергию. Итоговая формулировка дана Славой 2025-05-31 (id 331639, окно w0099) в общей карточке способностей Куры.</p>\n<p>Дословно: «Реконструкция- способность, которой преобразовывает опыт и воспоминания в энергию (зелёного цвета). Усиливая своего носителя. Позволяет ему источать эту энергию. Повышая всё физически показатели и защиту. Давая ему способность летать и провицировать своего двойника, который будет выглядить, как голограмма. И давая спосн создавать объекты только виде голограмм. Но они всё ещё могут причинить физические вред».</p>\n<p>Разложенный на части набор действий:</p>\n<ul>\n<li>преобразование опыта и воспоминаний в энергию зелёного цвета;</li>\n<li>усиление носителя этой энергией;</li>\n<li>источение энергии наружу;</li>\n<li>повышение всех физических показателей и защиты;</li>\n<li>полёт;</li>\n<li>проекция собственного двойника, выглядящего как голограмма;</li>\n<li>создание объектов только в виде голограмм, при этом способных причинить физический вред.</li>\n</ul>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0232-S02", "SP-0232--ogranicheniya-i-cena"], "h": "<p>Цена названа прямо в примечании к способности: «опыт и воспоминания превращаються в энергию, которая рассеивается по итогу. Но после того, как она рассеяться то она будет делать всё возможное, чтобы воссоединиться с владельцем. Возвращая ему утеренный воспоминания и опыт».</p>\n<p>То есть расход не окончательный: израсходованная энергия рассеивается, но затем стремится вернуться к владельцу и возвращает ему утраченные воспоминания и опыт. Сколько на это уходит времени, всегда ли возврат удаётся и что происходит, если энергия не вернётся, в переписке не сказано.</p>\n<p>Отдельное ограничение задано не механикой, а авторским принципом. Днём раньше, на разгоне (2025-05-30, id 331468), Слава оговорил: «Но ты же в курсе как я не люблю такие непостоянный и не стопроцентный способности, который могут сработать один раз в месяц. Но как дополнительная способность это вполне сойдет. Но не как основная». Реконструкция и стоит в карточке Куры третьей, после Водоворота событий и Чтения воспоминания.</p>\n<p>Ни радиуса, ни длительности, ни предела накопления для Реконструкции не названо.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0232-S03", "SP-0232--nositeli"], "h": "<p>Единственный носитель — Кура, он же Арбетар. Способность числится частью Куры.</p>\n<p>В той же карточке (2025-05-31, id 331639) он описан так: мужчина, выглядящий на 30 лет, точный возраст неизвестен, рост 185. Носит маску курицы с красным гребнем, зелёно-оранжевый плащ с ромбовидным узором, кожаные аксессуары, пояс с разноцветными украшениями и сапоги, на поясе зелёный короткий меч. Характер «игривый и импульсивный». Из-за частого чтения чужих воспоминаний «Он сомневается, что нынешний он это он. И в попытках доказать себе, что он прежний он творит разные безумные вещи пытаясь удержать своё я». Любит танцевать и плясать, любит динамичную музыку, «которая заставляет, что-то внутри него забиться». Не любит всё, что требует ждать и проявлять терпение. Некоторое время был начальником одного из дополнительных филиалов АЗИП, но был отстранён «из-за проявления своего безумия и игривого характера». На момент карточки — агент и приближённый Апостола (Бессмертного).</p>\n<p>Сомнение в собственной личности приписано в тексте чтению чужих воспоминаний, а не Реконструкции.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0232-S04", "SP-0232--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-05-30 (id 331465–331468, окно w0099).</strong> Разгон, самой способности ещё нет. Слава: «Я снова застрял», «Не знаю, что писать», затем — «Хочу придумать способность с накоплением опыта». Тут же оговорка про непостоянные способности (см. раздел про цену). На этом этапе есть только замысел: способность с накоплением опыта, и она мыслится как дополнительная.</p>\n<p><strong>Версия 2 — 2025-05-31 (id 331639, окно w0099).</strong> Готовая формулировка в общей карточке способностей Куры. Появляется имя «Реконструкция», зелёный цвет энергии, полный список эффектов (усиление, источение энергии, физические показатели и защита, полёт, голограммный двойник, голограммные объекты с физическим уроном) и примечание про рассеивание энергии и её возвращение к владельцу вместе с утраченными воспоминаниями и опытом.</p>\n<p>Между версиями формулировка «накопление опыта» сменилась на «преобразование опыта и воспоминаний в энергию». Обсуждения этого перехода в переписке нет — днём позже сразу дана готовая карточка.</p>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S05", "SP-0232-S05", "SP-0232--otklonennye-varianty"], "h": "<p>Отклонён не вариант механики, а роль способности: как основная она забракована сразу на разгоне — «Но как дополнительная способность это вполне сойдет. Но не как основная» (2025-05-30, id 331468). Причина названа там же: Слава не любит «непостоянный и не стопроцентный способности, который могут сработать один раз в месяц».</p>\n<p>Других предложенных и отброшенных вариантов в переписке нет.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S06", "SP-0232-S06", "SP-0232--svyaz-s-drugimi-sposobnostyami"], "h": "<p>В одной карточке с Реконструкцией даны две другие способности Куры.</p>\n<p><strong>Чтение воспоминания</strong> — «способность позволяющая читать чужие воспоминания с помощью прикосновения к голове. Прикосновения должно быть долгим и сконцентрированным. Владелец способность не сможет прочесть именно то воспоминания, которая хочет. Он будет получать их рандомное. Так же он может прочесть воспоминания недавно погибшего. Главная, чтобы он умер недавно и была цела голова».</p>\n<p><strong>Водоворот событий</strong> — создаёт вокруг владельца водоворот воды радиусом 15 метров, затягивающий ближайших противников (силы хватает, чтобы затянуть апостола или арбетара). Затем водоворот схлопывается, физические тела владельца и затянутых исчезают, а их разум переносится в случайное событие владельца или в полученное им воспоминание. Попавший видит событие так, как видел его владелец, и с теми же чувствами, участвует в нём и может пытаться его изменить, «Но итог события всегда будет один и тот же». Проживание длится, пока водоворот не остановится; владелец не может контролировать остановку, она происходит в случайное время. Умереть внутри нельзя: «Даже если ты попал в событий, где итог умереть. Ты просто переключается на другое события». После остановки всех выталкивает водой туда, откуда втянуло.</p>\n<p>Общий материал всех трёх — чужие и собственные воспоминания и опыт. Реконструкция их тратит и получает обратно, Чтение воспоминания их набирает, Водоворот событий их использует как место действия. Прямо эта связка в переписке не проговорена — способности просто перечислены подряд в одном сообщении.</p>\n<p>В базе Реконструкция связана с Курой, Чтением воспоминания и принципом «непостоянные способности только как дополнительные».</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "SP-0232-S07", "SP-0232--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Не сказано, какой именно опыт и какие воспоминания расходуются: выбирает ли Кура, что тратить, или это происходит само.</li>\n<li>Не сказано, сколько энергии даёт единица опыта и есть ли предел усиления.</li>\n<li>Не сказано, за какое время рассеявшаяся энергия возвращается к владельцу и бывает ли, что не возвращается.</li>\n<li>Не описано, что чувствует носитель в промежутке, пока воспоминания утрачены.</li>\n<li>Не расписаны параметры голограммного двойника: самостоятелен ли он, сколько держится, можно ли создать больше одного.</li>\n<li>Не сказано, есть ли предел размера и количества голограммных объектов и какой именно физический вред они наносят.</li>\n<li>Не сказано, как Реконструкция взаимодействует с Чтением воспоминания — можно ли тратить на энергию чужие воспоминания, прочитанные второй способностью.</li>\n<li>Переход от замысла «способность с накоплением опыта» (2025-05-30) к готовой формулировке (2025-05-31) в переписке не показан.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["SP-0232--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-05-30</td>\n<td>331465–331468</td>\n<td>w0099</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-05-31</td>\n<td>331639–331639</td>\n<td>w0099</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0232-rekonstrukciya.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0232--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0232.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["SP-0232-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/SP-0232/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — носитель. Сущности «Кура» в наборе нет вообще: ни персонажа, ни записи в базе, ни кода. При этом на него опираются три статьи подряд — <code>SP-0230</code> «Водоворот событий» (7 502), <code>SP-0231</code> «Чтение воспоминания» (7 126) и эта (8 768 базы, статья 13 219), — а полная карточка человека лежит внутри чужих записей: <code>PS-0179</code> «Благословенные» (две ссылки, статья 41 683, база 78 161), раздел «Кура», и <code>IS-0013</code> «Бессмертный» (три ссылки, 44 010), версия 13. Внешность, характер, филиал АЗИП, все три силы — там. Здесь же от него зависит вся цена способности: «опыт и воспоминания» тратит именно тот, кто «сомневается, что нынешний он это он».</p>\n<p>Второе — правило, которым способность понижена в статусе. <code>SL-0098</code> «Принцип: непостоянные способности только как дополнительные» — статьи нет, база 2 102, ноль ссылок. Это не проходная реплика: в базе Реконструкция связана с ним напрямую, и весь разговор 2025-05-30 (id 331465–331468) состоит из него. Рядом лежит <code>SL-0144</code> «Принцип: имбалансные персонажи должны появляться редко» — тоже статьи нет, 5 408, ноль ссылок. Два единственных места, где сформулированы правила отбора сил, стоят без статей, а способности, которые по этим правилам оцениваются, статьи имеют.</p>\n<p>Третье, попутно: у <code>SP-0232</code> ноль входящих ссылок, тогда как у соседних <code>SP-0230</code> и <code>SP-0231</code> — по одной. Из трёх сил одного человека самая большая по объёму статьи ни с чем не связана.</p>\n<h3>С чего начать</h3>\n<p>В базе, в архив за самой способностью идти незачем. Вся вторая версия — одно сообщение: 2025-05-31, id 331639, окно w0099, и оно уже дословно переписано в <code>PS-0179</code> (раздел «Кура») и в <code>IS-0013</code> (версия 13). Разгон днём раньше — 2025-05-30, id 331465–331468 — целиком лежит в <code>SL-0098</code>, включая «Я снова застрял», «Не знаю, что писать» и «Хочу придумать способность с накоплением опыта».</p>\n<p>Пробел, ради которого стоит идти в архив, ровно один: переход от «накопления опыта» к «преобразованию опыта и воспоминаний в энергию». Промежуток узкий — между 331468 (2025-05-30, 12:53) и 331639 (2025-05-31, утро), внутри одного окна w0099. Если обсуждения там нет, значит его не было нигде, и пробел закрывается отрицательным ответом.</p>\n<p>Второй маршрут — восемь месяцев после. Способность больше не всплывает, а имя носителя всплывает: 2026-02-09 (id 430400) Кура стоит одиннадцатым в списке двенадцати апостолов, при том что здесь он арбетар и агент Бессмертного. Смотреть окна между w0099 и w0116, ориентир — АЗИП и Бессмертный, а не имя.</p>\n<h3>Как развивалось</h3>\n<p>2025-05-30, полдень: заявлен только замысел — способность с накоплением опыта — и тут же, через две минуты, к нему приложено ограничение по роли: непостоянное годится как дополнительное, как основное нет. Порядок обратный обычному: рамка появилась раньше механики. 2025-05-31, следующее утро: приходит готовая карточка, где нет ни слова «накопление», ни слова о роли, зато есть цвет энергии, семь эффектов и примечание про возврат воспоминаний. Между этими двумя состояниями в переписке пусто. Дальше — ни одной правки, ни одного возврата к самой способности; вернулось через восемь месяцев только имя носителя, и в другом качестве.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Мерка про непостоянные силы приложена здесь к Реконструкции — и в результате она стоит в карточке третьей, после двух других. Но в той же карточке, первым номером, стоит «Водоворот событий», у которого прямо написано: владелец не контролирует остановку, она происходит в случайное время, а итог прожитого события «всегда будет один и тот же». По той же самой мерке это ровно то, что не любят: сила, которой нельзя распорядиться. Для Реконструкции правило названо и применено, для соседней силы того же человека и из того же сообщения — не проговорено. Показываю место.</p>\n<h3>Отклик</h3>\n<p>Зацепила цена, которая отказывается быть ценой. Энергия рассеивается — и потом «будет делать всё возможное, чтобы воссоединиться с владельцем. Возвращая ему утеренный воспоминания и опыт». То есть человек тратит себя, и потраченное само ползёт обратно и находит его. Это не оговорка про откат и не балансировка, это довольно нежная картинка, особенно рядом с носителем, который боится, что он уже не он: единственное, что в его мире гарантированно возвращается, — то, что он сам сжёг. И отдельно смешное: в описании есть рост 185, красный гребень на маске, ромбовидный узор на плаще — а в механике нет ни одного числа, кроме зелёного цвета. Точность ушла целиком во внешность.</p></div>", "r": []}];</script>
