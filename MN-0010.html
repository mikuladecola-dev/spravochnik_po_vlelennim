<script>const BASE="";const DOCNAME="Камень желаний";
const LEAD="";
const CH=[{"t": "Где находится — в каком мире и в каком его месте", "a": ["S01", "MN-0010-S01", "MN-0010--gde-nahoditsya"], "h": "<p>Мир и место не названы ни в одном из пяти появлений. По датам объявления запись числится сначала за вселенной «монстры» (2024-11-09, id 255047), затем за вселенной «Апостол» (2025-01-24 и позже).</p>\n<p>Единственная привязка, которая у камня есть, — раздел рабочего каталога. Сначала это строка «Идей» (2025-01-24, id 284248 и id 284300), потом отдельный раздел «Аномалий», куда камень переезжает 27 января 2025 года вместе с озером перерождения (<a href=\"MN-0009.html\">Озеро перерождения</a>):</p>\n<pre><code>Аномалий:\nКамний желаний 🪨\nОзеро перерождения ⚫️\n</code></pre>\n<p>(2025-01-27, id 284858; повторено 2025-01-28, id 285522.)</p>", "r": [["Озеро перерождения", "MN-0009.html"]]}, {"t": "Что собой представляет", "a": ["S02", "MN-0010-S02", "MN-0010--chto-soboy-predstavlyaet"], "h": "<p>Только название. Что камень делает — не сказано ни разу. За всё время существования записи (2024-11-09 — 2025-01-28) кроме имени и эмодзи 🪨 к нему ничего не добавлено: ни размера, ни вида, ни того, как загадывают желание, ни какова цена.</p>\n<p>Варианты написания, встречающиеся в каталоге: «камень желаний» (2024-11-09, id 255047; 2025-01-24, id 284300), «корень желаний» (2025-01-24, id 284248), «Камний желаний» (2025-01-27, id 284858; 2025-01-28, id 285522). В более поздних реестрах, за пределами версий этой карточки, соседняя запись значится во множественном числе — «Камни желаний».</p>", "r": []}, {"t": "Что с ним связано — предметы, механики, силы", "a": ["S03", "MN-0010-S03", "MN-0010--chto-s-nim-svyazano"], "h": "<p><strong>Озеро перерождения (<a href=\"MN-0009.html\">Озеро перерождения</a>).</strong> Первое появление камня прозвучало именно как альтернатива озеру: озеро было названо строкой раньше, и сразу за ним — «Ну или ещё камень желаний» (2024-11-09, id 255047). Дальше они идут парой: сначала в общем перечне «Идей» вместе с чёрным ящиком, затем вдвоём составляют весь раздел «Аномалий».</p>\n<p><strong>Чёрный ящик.</strong> Третий пункт строки «Идей». В «Аномалий» он не переехал и остался в «Идей» (2025-01-27, id 284858; 2025-01-28, id 285522).</p>\n<p>Сам каталог, в котором камень числится, содержит разделы: благословенные, враги, церковь, военный, сторонние силы, семь грехов, существа, аномалии, оружие, артефакты, идеи. Прямых связей камня с чем-либо из этих разделов в переписке не проведено.</p>", "r": [["Озеро перерождения", "MN-0009.html"]]}, {"t": "Персонажи и события — кто с ним связан и что там происходило", "a": ["S04", "MN-0010-S04", "MN-0010--personazhi-i-sobytiya"], "h": "<p>Ни одного персонажа с камнем не связано. Единственный обмен репликами по поводу камня — в момент первого появления: Слава называет его, Миколай отвечает «слава» и «это че такое» (2024-11-09, id 255049–255050). Ответа на этот вопрос в переписке нет.</p>", "r": []}, {"t": "Как менялся по версиям — по датам", "a": ["S05", "MN-0010-S05", "MN-0010--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-11-09, вселенная «монстры», окно w0063, id 255047–255050.</strong> Первое упоминание одной строкой: «Ну или ещё камень желаний». Названо как альтернатива озеру перерождения. Реакция Миколая — «это че такое». Дальше не развивалось.</p>\n<p><strong>Версия 2 — 2025-01-24, вселенная «Апостол», окно w0072, id 284248–284250.</strong> В большом каталоге благословенных и врагов последняя строка — раздел «Идей»: «Чёрный ящик, озеро перерождения, корень желаний». Написание здесь — «корень», а не «камень».</p>\n<p><strong>Версия 3 — 2025-01-24, окно w0072, id 284300–284301.</strong> Тот же каталог, расширенный (добавлены семь грехов, оружие, артефакты). В разделе «Идей» уже: «Чёрный ящик, озеро перерождения, камень желаний». Кроме смены слова ничего не изменилось. Миколай на всю выкладку отвечает: «ебаиь ты работяга» (id 284301).</p>\n<p><strong>Версия 4 — 2025-01-27, окно w0073, id 284858.</strong> В каталоге появляется новый раздел «Аномалий», и запись переезжает туда из «Идей» под написанием «Камний желаний 🪨», вместе с «Озером перерождения ⚫️». В «Идеях» остаётся только «Чёрный ящик».</p>\n<p><strong>Версия 5 — 2025-01-28, окно w0073, id 285519–285522.</strong> Повтор каталога. Раздел «Аномалий» без изменений: «Камний желаний 🪨», «Озеро перерождения ⚫️».</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "MN-0010-S06", "MN-0010--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Что делает камень — не сказано ни разу, ни в одной из пяти версий.</li>\n<li>Непонятно, было ли «корень желаний» → «камень желаний» опечаткой или сознательным переименованием: в переписке это не обсуждается.</li>\n<li>Никакой разработки после первого называния нет — все последующие появления это строка в каталоге.</li>\n<li>Где находится, кто им пользуется, какова цена желания — не названо.</li>\n<li>Чем «аномалия» отличается от «идеи» в терминологии каталога, не оговорено; зафиксировано только, что раздел «Аномалий» появился 2025-01-27 и что камень тогда же туда переехал.</li>\n<li>Вопрос Миколая «это че такое» (id 255050) так и остался без ответа.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MN-0010--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает монументы:</strong> <a href=\"MN-0009.html\">Озеро перерождения</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0163.html\">ГГ-защитник</a></li>\n<li><strong>Упомянут в монументах:</strong> <a href=\"MN-0009.html\">Озеро перерождения</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MN-0010--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-11-09</td>\n<td>255047–255050</td>\n<td>w0063</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-24</td>\n<td>284248–284250</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-24</td>\n<td>284300–284301</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-27</td>\n<td>284858–284858</td>\n<td>w0073</td>\n<td>Апостол (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2025-01-28</td>\n<td>285519–285522</td>\n<td>w0073</td>\n<td>Апостол (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/monumenty/MN-0010-kamen-zhelaniy.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MN-0010--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MN-0010.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
