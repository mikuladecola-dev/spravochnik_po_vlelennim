<script>const BASE="";const DOCNAME="Пресрог";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0036-S01", "MR-0036--ustroystvo"], "h": "<p>Пресрог — мировая преступная организация во вселенной «7 островов». В переписке встречается также как «престог», «преступная команда», «преступная организация».</p>\n<p>Основная формулировка Миколая (2024-07-09, id 201999–202004): «пресрог / это преступная организация / имеющая суверенитет / тобиж независимость / от государств / в ней состоят существа обоих миров».</p>\n<p>Слава сформулировал независимость отдельно: «Преступная организация независит нет от кого» (id 201988).</p>\n<p>Организация работает не на всех островах. На вопрос Миколая «где люди на каждом отрове» Слава ответил: «Не на каждом» (id 201978–201979). При этом организация общая — то есть одна и та же на разных островах, а не набор местных группировок.</p>\n<p>Разграничение с другими криминальными структурами островов проведено прямо (id 201964–201984):</p>\n<ul>\n<li>на Асгарде роль преступной организации играет церковь: «Это церковь»;</li>\n<li>у сталкера (остров-пустыня, <a href=\"MR-0037.html\">Пректри (остров-пустыня)</a>) — не отделение Пресрога, а «просто криминальный остров»: «Нет у сталкера просто криминальный остров»;</li>\n<li>«Семена у сталкера» (id 201966).</li>\n</ul>\n<p>Миколай отдельно отметил несостыковку с церковью Асгарда: «у церки цель убивать всех из внешнего мира, не / для преступной мировой организации странно» (id 201972–201973). Слава подтвердил «Да», но объяснения не последовало.</p>\n<p>Цель организации не придумана. Прямой обмен (2024-07-09, id 202090–202099):</p>\n<div class=\"q\"><p>Миколай: преступная команда<br>Миколай: че там они делают то<br>Миколай: я не понимаю<br>Слава: Не знаю<br>Слава: Мы цель не придумали</p></div>\n<p>После этого тему свернули и перешли к острову-пустыне.</p>", "r": [["Пректри (остров-пустыня)", "MR-0037.html"]]}, {"t": "Население", "a": ["S02", "MR-0036-S02", "MR-0036--naselenie"], "h": "<p>Состав, названный Славой (2024-07-09, id 202017–202018):</p>\n<ul>\n<li>Кай</li>\n<li>Закон</li>\n<li>Мазохистка</li>\n</ul>\n<p>Защитники в организацию не входят: на вопрос «туда входит кто-то из защитников?» — ответ «Нет» (id 202006–202007).</p>\n<p>Глава не выбран. «есть глава?» — «Не знаю», «мы выбрали?» — «я забыл» (id 202005–202011).</p>\n<p>Позже к организации отнесён персонаж Температура: «Температура в престог» (2024-07-09, id 202358). До этого шло уточнение, одиночка он или нет; Слава на вопрос «они оба одиночки?» ответил «Нет», а про сталкера сказал «Не он одиночка / То бишь просто легенда» (id 202354–202359). Кроме принадлежности к Пресрогу о Температуре в этом окне ничего не сказано.</p>\n<p><strong>Отклонённые и брошенные варианты.</strong></p>\n<p><em>Колобок</em> — вариант главы Пресрога, наброшенный Миколаем (2024-07-09, id 202013–202016): «ну это я яно кто-то мне хороший / хулиган какой-то / думаю это будет / колобок». Развития не получил, Слава сразу перешёл к списку участников.</p>\n<p><em>Мазохистка</em> — третья участница в списке Славы. Миколай попросил подробностей («а вот про последнюю подробнее / не помню чтобы о ней говорили»), Слава ответил: «Да забудь о ней её сразу убьют после её появления» (2024-07-09, id 202019–202021). Названа и брошена.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0036-S03", "MR-0036--mesto-vo-vselennoy"], "h": "<p>Пресрог не привязан к одному острову: он не подчиняется государствам и действует на части островов. В нём состоят «существа обоих миров» — какие именно два мира имеются в виду, в переписке не расшифровано.</p>\n<p>Соседние криминальные структуры островов от него отделены: церковь Асгарда и криминальный остров сталкера (Пректри, <a href=\"MR-0037.html\">Пректри (остров-пустыня)</a>) — не части Пресрога.</p>", "r": [["Пректри (остров-пустыня)", "MR-0037.html"]]}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0036-S04", "MR-0036--kak-menyalsya-po-versiyam"], "h": "<p>Вся работа над Пресрогом уместилась в один вечер 2024-07-09 (окно w0046).</p>\n<p><strong>2024-07-09, id 201964–201990.</strong> Разграничение: на Асгарде преступную роль играет церковь, у сталкера просто криминальный остров, сама организация ни от кого не зависит. Название на этот момент ещё не дано — Слава спрашивает: «Название это преступной организаций / ?».</p>\n<p><strong>2024-07-09, id 201991–202016.</strong> Название придумал Слава: «Пресрог / Норм ?» (id 201992–201993). Реакция Миколая: «гор серп», затем «ну / норм». Здесь же формулируется суверенитет, независимость от государств и состав из существ обоих миров. Главу не выбрали, звучит шуточный вариант — Колобок.</p>\n<p><strong>2024-07-09, id 202017–202024.</strong> Назван состав: Кай, Закон, Мазохистка. Защитники не входят. Мазохистка тут же отброшена.</p>\n<p><strong>2024-07-09, id 202090–202101.</strong> Цель организации так и не придумана, тему сворачивают: «тогда от них опять уходим на другой остров?» — «Уходим / В пустыню».</p>\n<p><strong>2024-07-09, id 202351–202362.</strong> В Пресрог добавлен Температура.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0036-S05", "MR-0036--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Цель организации не придумана — сказано прямо: «Мы цель не придумали» (id 202096).</li>\n<li>Глава не выбран: «Не знаю» (id 202010). Единственный прозвучавший вариант — Колобок — оставлен без развития.</li>\n<li>Что за «оба мира», существа которых состоят в организации, в переписке не поясняется.</li>\n<li>Про Кая и Закон в рамках этого разговора о Пресроге ничего не сказано, кроме принадлежности к составу.</li>\n<li>Про Температуру сказано только, что он в Пресроге; кто он и что умеет — в переписке не сказано.</li>\n<li>Несостыковка с целью асгардской церкви («убивать всех из внешнего мира») отмечена Миколаем, но осталась нерешённой.</li>\n<li>Не сказано, на каких именно островах Пресрог работает, а на каких нет.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0036--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0037.html\">Пректри (остров-пустыня)</a></li>\n<li><strong>Упомянут в мирах:</strong> <a href=\"MR-0037.html\">Пректри (остров-пустыня)</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0026.html\">Пресрог (преступная организация)</a>, <a href=\"GR-0027.html\">Церковь Асгарда</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0036--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-09</td>\n<td>201964–201990</td>\n<td>w0046</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-09</td>\n<td>201991–202016</td>\n<td>w0046</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-09</td>\n<td>202017–202024</td>\n<td>w0046</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-09</td>\n<td>202090–202101</td>\n<td>w0046</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-09</td>\n<td>202351–202362</td>\n<td>w0046</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0036-presrog.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0036--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0036.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
