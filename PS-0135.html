<script>const BASE="";const DOCNAME="Паша (Пашка)";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0135-S01", "PS-0135--proishozhdenie"], "h": "<p>Друг главного героя истории про Беркута — шестилетнего Кирилла. Введён в той же истории, одним заходом, 2024-08-10 (id 217239–217240, окно w0050). В первом сообщении он назван Пашей, во втором — Пашкой: «однажды друг Кирилла - Пашка, захотел избавиться от него».</p>\n<p>Первое появление — как адресат сообщений Кирилла: «каждый раз приходя из заведения дошкольной программы он приходил в свою комнату и писал своему другу по парте Паше, чтобы поиграть в популярную нынче шутер мобу(MOBA) с ним по сети». То есть связь двойная: сидят за одной партой и играют вместе по сети.</p>\n<p>Второе и последнее появление — после гибели Кирилла. К этому моменту Беркут, материализованный детской верой монстр, увёл душу Кирилла в небо, тело мальчика не спасли, а сам монстр остался и «в любых условиях старался воспроизводить тот сценарий с теми кто его видит, пусть уже насильно, ему мало было полетать»; на балконы массово стали ставить ограждения от детей, «но не все могли это позволить». Именно в этой обстановке действует Паша: «однажды друг Кирилла - Пашка, захотел избавиться от него, отомстить за товарища и остальных».</p>", "r": []}, {"t": "Характер", "a": ["S02", "PS-0135-S02", "PS-0135--harakter"], "h": "<p>Отдельно не описан. Всё, что о нём известно, следует из его поступка: месть — не только за друга, но и за других детей («отомстить за товарища и остальных»), и подготовленный, а не спонтанный выход на монстра — он заранее нашёл открытый балкон и пришёл туда снаряжённым.</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0135-S03", "PS-0135--sposobnosti"], "h": "<p>Своих нет. Есть снаряжение, с которым он идёт на Беркута: «он нашёл открытый балкон и пришёл туда и украденным оружием отца и солью». Оружие отца украдено, соль принесена вместе с ним; ни тип оружия, ни назначение соли в переписке не поясняются.</p>\n<p>Столкновение описано двумя фразами: «Как только увидел это существо начал обороняться. Но его мощь доминировала».</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0135-S04", "PS-0135--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Кирилл</strong> — друг по парте и напарник по игре; ради него и предпринята месть. Инициатива в их общении по тексту исходит от Кирилла: он пишет Паше после садика, чтобы поиграть.</li>\n<li><strong>Беркут</strong> — монстр, материализовавшийся из детского увлечения Кирилла легендарным персонажем шутер-мобы; противник Паши в единственной сцене их встречи.</li>\n</ul>", "r": []}, {"t": "Как менялся", "a": ["S05", "PS-0135-S05", "PS-0135--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2024-08-10 (id 217239–217240, w0050).</strong> Единственная. Персонаж вводится и отрабатывается целиком в пределах одной истории: сначала как друг по парте и партнёр по игре (id 217239), затем как мститель, вышедший на монстра с украденным оружием отца и солью (id 217240). Других версий и переработок в базе нет.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S06", "PS-0135-S06", "PS-0135--chto-s-nim-stalo"], "h": "<p>Прямо не сказано. Последнее, что о нём известно: «начал обороняться. но его мощь доминировала». Дальше история переходит к общему итогу через три года: «прошло 3 года и ничего не изменилось, правда теперь дети видят вместо лазурного неба кисло-пурпурное..». Погиб ли Паша, был ли уведён так же, как Кирилл, или уцелел — в переписке не сказано.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0135-S07", "PS-0135--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Исход столкновения с Беркутом не назван: сказано только, что «его мощь доминировала».</li>\n<li>Возраст Паши не назван. Известно лишь, что он сидит с Кириллом за одной партой в заведении дошкольной программы; про его психический возраст — от которого в этой истории зависит способность видеть монстров и взаимодействовать с иным миром — ничего не сказано.</li>\n<li>Не сказано, видел ли Паша Беркута до дня мести и как узнал, что монстр появится на открытом балконе.</li>\n<li>Не сказано, зачем нужна соль и какое именно оружие отца он украл.</li>\n<li>Не сказано, сколько времени прошло между гибелью Кирилла и выходом Паши на балкон.</li>\n<li>Внешность, семья (кроме упоминания отца, у которого украдено оружие) и дальнейшая судьба не описаны.</li>\n<li>Три года, прошедшие в финале, к Паше в тексте не привязаны.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["PS-0135--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-10</td>\n<td>217239–217240</td>\n<td>w0050</td>\n<td>монстры (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0135-pasha-pashka.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0135--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0135.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
