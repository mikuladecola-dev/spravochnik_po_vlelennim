<script>const BASE="";const DOCNAME="вещества спасателя";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0109-S01", "SP-0109--mehanika"], "h": "<p>Вещества спасателя — арсенал препаратов, которым спасатель пользуется в работе с пойманными монстрами. Единственный раз способность разобрана в переписке 2024-08-26 (id 224940, окно w0055), в сцене, где напарники держат пойманного голубца.</p>\n<p>Конкретно названо одно применение: игла с дозой, которая должна отключать монстра. В сцене спасатель колет этой иглой не пленника, а собственного напарника-писателя — как проверку. Писатель реагирует: «эй, ты че делаешь. убери иглу, больно же». Доза на него не действует, и спасатель делает из этого вывод о его природе: «был бы монстром, то тебя бы эта доза смогла бы отключить».</p>\n<p>Таким образом, вещества работают не только как средство обездвиживания, но и как тест на принадлежность к домену монстров: подействовало — монстр, не подействовало — нет. Писатель предлагает другое объяснение — «боже, да просто у меня другая группа крови», — и спасатель отвечает разбором крови: «у тебя в кровь красная, у него синяя. ты хоть одного человека видел, в чьей крови течёт гемоцианин?». То есть в рамках сцены признак, по которому доза различает цели, увязан с гемоцианином в крови монстра против красной крови человека; прямо как механизм действия вещества это не сформулировано.</p>\n<p>Множественное число («наших веществ») говорит, что препаратов несколько. Что именно ещё входит в арсенал, в переписке не сказано.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0109-S02", "SP-0109--ogranicheniya-i-cena"], "h": "<p>Главное ограничение заявлено прямо и является поводом всей сцены: «а вызывать амнезию не одно из наших веществ не умеет» (в навигационной сводке та же реплика приведена как «вызывать амнезию ни одно из наших веществ не умеет»). Стереть память пленнику, который услышал лишнее, препаратами нельзя.</p>\n<p>Второе ограничение — избирательность по цели: доза отключает монстра, но не человека с красной кровью. На писателе она не сработала.</p>\n<p>Цена ограничения — переход к другим средствам. На вопрос «че делать теперь» спасатель отвечает: «да не ссы, есть пара народных методов». Народный метод, который тут же обсуждается, — кирпичом по голове. Писатель пытается возразить: «стой, ну не обязательно наверное, кирпичем по голове», спасатель отвечает «ты че такой весь правильный, мы и так по локоть в меазмах», и писатель уступает: «эх, делай». Названа «пара» методов, перечислен один; второй не назван.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0109-S03", "SP-0109--nositeli"], "h": "<p>Спасатель. Формулировка «наших веществ» относит арсенал к паре спасатель — писатель, но игла в сцене в руках спасателя, и он же решает, кому и зачем колоть. Запись отнесена к спасателю как часть его снаряжения («часть чего: спасатель»). Применяет ли вещества писатель самостоятельно, в переписке не сказано.</p>\n<p>Цели, на которых вещества применяются или проверяются в сцене: пойманный монстр (голубец) и писатель.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0109-S04", "SP-0109--kak-menyalas-po-versiyam"], "h": "<p>Версия одна.</p>\n<ul>\n<li>2024-08-26 (id 224940, окно w0055) — первое и единственное появление: заявлено, что амнезию вещества не дают; заявлена игла с дозой, отключающая монстра, но не человека с красной кровью; взамен амнезии предложены «народные методы».</li>\n</ul>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S05", "SP-0109-S05", "SP-0109--otklonennye-varianty"], "h": "<p>Как способ решить проблему с услышавшим лишнее пленником рассматривалась амнезия — и была отброшена не по замыслу авторов, а внутри самой механики: такого вещества в арсенале нет. Возражение писателя против кирпича по голове отклонено спасателем в той же реплике.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S06", "SP-0109-S06", "SP-0109--svyaz-s-drugimi-sposobnostyami"], "h": "<ul>\n<li><a href=\"SP-0108.html\">эфир писателя</a> (эфир писателя) — вещества понадобились именно из-за эфира: при включённом эфире было сказано лишнее, пленник понял, что идёт трансляция, и встал вопрос об амнезии. Обе способности описаны одним и тем же сообщением 224940.</li>\n<li>Голубец (пойманный монстр) указан в файле среди связанных сущностей: именно к нему адресованы поиски амнезии.</li>\n</ul>\n<p>Кроме того, в этой же сцене доза служит опорой для рассуждения спасателя о монстрах как об одном из доменов живых существ — «в ряду с бактериями, археями или эукариотами», — и о крови с гемоцианином как признаке.</p>", "r": [["эфир писателя", "SP-0108.html"]]}, {"t": "Пробелы", "a": ["S07", "SP-0109-S07", "SP-0109--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Состав веществ не назван: сказано только, что их несколько и что амнезии среди них нет.</li>\n<li>Как действует доза, сколько длится отключение, откуда препараты берутся и кто их делает — в переписке не сказано.</li>\n<li>Не сказано, обязательна ли инъекция иглой или есть другие способы введения.</li>\n<li>Была ли доза действительно введена писателю до того, как он потребовал убрать иглу, из текста не следует.</li>\n<li>Второй из «пары народных методов» не назван.</li>\n<li>Не сказано, чем закончился эпизод с кирпичом: сработал ли «народный метод», забыл ли пленник про эфир.</li>\n<li>Что такое «меазмы», в которых напарники «по локоть», в переписке не поясняется.</li>\n<li>Кому принадлежит имя «Киппер», произнесённое в этой же сцене, не сказано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0109--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0108.html\">эфир писателя</a></li>\n<li><strong>Упомянут в способностях:</strong> <a href=\"SP-0108.html\">эфир писателя</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0109--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-26</td>\n<td>224940–224940</td>\n<td>w0055</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0109-veschestva-spasatelya.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0109--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0109.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
