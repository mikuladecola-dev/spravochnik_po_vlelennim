<script>const BASE="";const DOCNAME="Материализация";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0129-S01", "SP-0129--mehanika"], "h": "<p>Материализация — создание неживого объекта. В переписке она описана двумя способами, и второе описание не отменяет первого, а разворачивает его через устройство «программы в голове».</p>\n<p>Первое описание (2024-12-13, id 269866): носитель «может из частиц энергий создать любой не живой предмет но энергий тратится дофига». Тут же оговорка про остальных: «если что обычный тоже так могут но то к чему относится структура например структура воды ты можешь без каких проблем создать воду». То есть материализация доступна не только Имитатору — обычные носители структуры материализуют легко то, что относится к их собственной структуре, и лишь произвольный предмет остаётся исключительным.</p>\n<p>Второе описание (2026-06-07, id 488545). Материализуемые объекты перечислены прямо: «Воду, машину, меч, пулемёт и т. Д.». Ключевое: «Он мателирезует объект без программы в голове».</p>\n<p>Чтобы это работало, в том же сообщении объяснено, что такое программа в голове: «Программа в голове это способность. А точнее это готовая конструкции Оам. По которой мы способны производить способности. Эту готовую и чустую конструкции мы способны навешивать дополнительные штрихи или слегка видо изменять. ( не сильно, ядро конструкции то бишь суть способности всегда остаётся одна и та же). То есть конструкции огня. И мы можем штриховать ее, по типу огненный шар, небесное копьё, прожег пространства. Но ядро всегда остаётся огонь.»</p>\n<p>Отсюда определение самой способности: «Материализация это создания конструкции Оам с нуля». Сложность конструкции зависит от объекта: «тем сложнее объект, тем сложнее конструкции».</p>\n<p>Отдельно оговорено, что знание конструкции не отменяет работы по её сборке: «даже зная конструкции, в бою тебе все равно с нуля придётся её создавать». Способность с готовым шаблоном требует только «пары штрихов», материализация — полной сборки каждый раз.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0129-S02", "SP-0129--ogranicheniya-i-cena"], "h": "<p>Цена в первой версии сформулирована коротко: «энергий тратится дофига».</p>\n<p>Во второй версии (2026-06-07, id 488545) перечислены конкретные отказы при ошибке в сборке конструкции с нуля:</p>\n<ul>\n<li>Взрыв. «создание какое либо конструкции с нуля, всегда приводят к взрыву, что тебе просто руки оторвёт, или вообще сдохнешь».</li>\n<li>Высасывание Оам: «вся твоя Оам направляется в окружающую среду неконтролируема». Названы также «какие либо другие дефекты» — без перечисления.</li>\n<li>Обратный откат Оам, назван «худшая откат Оам»: «Когда Оам что ты выпустил, для создания конструкции. Направляется обратно. То есть вся твоя Оам течёт в одно направление и здесь вдруг появляется Оам что течёт в противоположную сторону, да ты просто разорвешься изнутри. 100 процентная смерть.»</li>\n</ul>\n<p>Требования к применению: «нужна точность и концентрация и время куда больше чем для программы раза в 10, а концентрации в раза 100». Цена ошибки — «И одна ошибка и бам ты сдох».</p>\n<p>Итоговая оценка применимости, данная в переписке: материализация «слишком опасная, долгая, и не эффективная и ты так же не можешь использовать её вместе со своей способностью». Отсюда вывод авторов: «Поэтому кроме Имета их никто и не использует» (id 488546), с уточнением, что даже апостолы при попытке «Сдохнут ведь, даже если апостолы».</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0129-S03", "SP-0129--nositeli"], "h": "<p>Имитатор (он же Имет). В версии 2024-12-13 материализация перечислена среди способностей Имитатора — мужчины, владельца глаз, у которого «так и не смогла сформироваться структура дающий способности ( у него вместо него частицы)». Минусы частиц там же: «плохой контроль; слабая способность накопления ( маленькая количество энергий)».</p>\n<p>В версии 2026-06-07 носитель назван Иметом — «апостол и фигура старшего брата среди апостолов. Архетип учёного». Основание для владения материализацией: «У него гибкая программа в голове. То есть когда у всех программа способности в голове закоренелая. То у него она податливая и гибкая.»</p>\n<p>Обычные носители структуры — по версии 2024-12-13 могут материализовать то, что относится к их структуре (пример: носитель структуры воды создаёт воду «без каких проблем»).</p>\n<p>Апостолы. По версии 2026-06-07: «Большинство апостолы тоже им обучены оу и материализация» — то есть обучение есть, но применения нет, потому что способ смертельно опасен. Отдельно: «Ну возможно кто-нибудь из апостолов оу может иногда применить, но материализацию точно нет».</p>\n<p>Как Имет её освоил — указано как «фактик»: «Он тренировался на полотне созидания ( да способность звездочета). Сутью полотна, как это увидел Имет, было сохранять разные конструкции, при этом если конструкции не удаётся то они просто распадаются, а не взрываются и т. Д.» То есть полотно созидания снимало смертельную цену ошибки на время тренировки.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0129-S04", "SP-0129--kak-menyalas-po-versiyam"], "h": "<p><strong>2024-12-13 (id 269866, окно w0066).</strong> Материализация — один из пунктов карточки Имитатора. Формулировка: создание любого неживого предмета из частиц энергии, очень большой расход энергии, оговорка про обычных носителей и их структуру. Механика через конструкции Оам не описана; слова «программа в голове», «конструкция», «Оам» в этой версии не звучат — работа объясняется через частицы вместо структуры.</p>\n<p><strong>2026-06-07, 21:54 (id 488504–488506, окно w0121).</strong> Дословный повтор карточки 2024 года — Слава ищет и присылает старый текст. Содержание не меняется.</p>\n<p><strong>2026-06-07, 22:58 (id 488545–488546, окно w0121).</strong> Развёрнутая версия. Материализация переопределена как «создания конструкции Оам с нуля», введено понятие программы в голове как готовой конструкции Оам с неизменяемым ядром и возможностью «штрихов». Добавлены: перечень материализуемых объектов, зависимость сложности конструкции от сложности объекта, три вида отказа (взрыв, высасывание Оам, обратный откат Оам со стопроцентной смертью), множители «время раза в 10, концентрация в раза 100», объяснение, почему способность неприменима в бою для всех, кроме Имета, и происхождение навыка Имета через полотно созидания Звездочёта.</p>\n<p>Обоснование носителя тоже сместилось: в 2024 году материализация Имитатора опиралась на то, что у него вместо структуры частицы; в 2026 году — на то, что у него гибкая, а не «закоренелая» программа в голове.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0129-S05", "SP-0129--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Материализация входит в набор Имета вместе с особым усилением (оу) — они названы как пара того, чему «обучены» апостолы. Про оу в том же сообщении (id 488545): усиление покрывает Оам «каждую волокну мыщцы и кости, и всё до атомов»; при плохом покрытии волокно «просто взорвётся от напряжения»; оу нельзя комбинировать со способностью — «Ты не можешь их комбинировать. Никто не может, кроме Имета». То же ограничение прямо перенесено на материализацию: «ты так же не можешь использовать её вместе со своей способностью».</p>\n<p>Полотно созидания (способность Звездочёта) — тренировочная среда для материализации: сохраняет конструкции, а неудачные «просто распадаются, а не взрываются».</p>\n<p>Программа в голове (готовая конструкция Оам) — противоположность материализации: там шаблон уже есть, здесь его нет. У Имета три слота программы, «Одну он всегда оставляет чистое», прочие два он заполняет — первый кукловодом («Я не умру пока не кончится оам»), второй огнём либо вибрацией.</p>\n<p>Имитация — главная способность Имета по версии 2026 года: «изменения своё конструкции в голове на способность, которой он видит визуально… он не копирует саму программу способности из мозга врага, он создаёт похожую по увиденному». Она тоже про сборку конструкции, но по увиденному образцу, а не с нуля.</p>\n<p>По версии 2024 года материализация стояла в одном списке с «Особая усиления», «\"Я не умру пока не кончится энергия\"», «Волнистый удар», «Удар разрушающий структуру» и способностью глаз видеть чужую структуру и формировать её частицами на время.</p>\n<p>В карточке способности как связанные перечислены: Апостолы, Имет (Имитатор), Имитатор, Программа в голове (конструкция Оам), Сосудники (сосуд и структура), Частицы вместо структуры.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "SP-0129-S06", "SP-0129--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Что такое Оам, в переписке по этой способности не объясняется — понятие используется как известное.</li>\n<li>Не сказано, сколько времени занимает материализация в абсолютных величинах: указан только множитель «раза в 10» относительно применения программы.</li>\n<li>Не сказано, сохраняется ли материализованный объект после того, как носитель перестал его поддерживать, и разрушается ли он сам по себе.</li>\n<li>Размер и максимальная сложность объекта не ограничены явно: сказано лишь, что сложнее объект — сложнее конструкция. Верхнего предела нет.</li>\n<li>«какие либо другие дефекты» при ошибке названы, но не перечислены.</li>\n<li>Не сказано, как соотносится версия 2024 года (частицы вместо структуры) с версией 2026 года (гибкая программа в голове) — заменяет ли одно объяснение другое или они сосуществуют. В переписке это не оговорено.</li>\n<li>Не сказано, могут ли обычные носители структуры материализовать «своё» вещество после введения механики конструкций Оам — оговорка про структуру воды осталась только в версии 2024 года.</li>\n<li>Не сказано, где находится полотно созидания и получал ли Имет доступ к нему от самого Звездочёта.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["SP-0129--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-12-13</td>\n<td>269866–269866</td>\n<td>w0066</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-07</td>\n<td>488504–488506</td>\n<td>w0121</td>\n<td>неясно (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2026-06-07</td>\n<td>488545–488546</td>\n<td>w0121</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0129-materializaciya.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0129--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0129.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
