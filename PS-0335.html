<script>const BASE="";const DOCNAME="Черноволосая служанка";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0335-S01", "PS-0335--proishozhdenie"], "h": "<p>Персонаж появляется в прозаическом тексте Славы, выложенном одним заходом (2025-12-14, id 397758–397760, окно w0113). Текст озаглавлен «Фанатик (обычный мир)» и написан от первого лица: человек из обычного мира, ухаживавший за разлагающимися телами своих родителей, просыпается в чужом теле и обнаруживает себя старшим сыном графа Бэлута — Дионисом. Служанка — первый персонаж этого мира, с которым он говорит.</p>\n<p>Собственного имени у неё нет. В тексте она называется «фигура горничные», «моя дорогая служанка», «моя черноволосая служанка», «моя милая служанка». Имя не названо ни в прозе, ни в обсуждении.</p>\n<p>Её положение в доме: она приписана к Дионису («Ты же моя служанка?» — «да господин я ваша служанка»), но по ходу главы выясняется, что служит она графине Виктории.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0335-S02", "PS-0335--vneshnost"], "h": "<p>Описана целиком через темноту. В момент первого появления она стоит в углу тёмной комнаты: «Особо выдающим лицо её не было. Просто тьма во тьме. Чёрные глаза, с чёрными волосами скрытый в углу комнаты, как же приторно».</p>\n<p>Больше о её внешности ничего не сказано — ни роста, ни возраста, ни одежды. Постоянный признак, вынесенный в имя статьи, — чёрные волосы и чёрные глаза.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0335-S03", "PS-0335--harakter"], "h": "<p>Основная её черта в тексте — бесстрастность. Она отвечает «приглушенная», «бесстрастно», «без колебаний»; на комплименты не отвечает словами, только кивает головой.</p>\n<p>На вопрос гг об имени, возрасте и дате она отвечает мгновенно и полностью: «вы Дионис Бэлут старший сын графа Бэлута. В этом году вам исполнилась 23 года. Сегодняшняя дата 28 июня 1417 год». Реакция гг на это: «Словно только ждала когда я задам этот вопрос».</p>\n<p>Она не задаёт встречных вопросов и не показывает, что заметила странность в поведении господина — гг сам отмечает, что «явно, что-то заподозрет», но со стороны служанки ничего не следует.</p>\n<p>Два момента, где эмоция всё-таки проступает:</p>\n<ul>\n<li>когда гг просит принести ужин в покои, она сначала не отвечает — «Служанка не ответила, заколебалась что-ли ?» — и лишь потом сообщает, что ужинать он будет с графом и графиней;</li>\n<li>на реплику гг «Аха тем более мачеха Виктория» — «служанка слегка с езжилась».</li>\n</ul>\n<p>Второй момент и есть точка раскрытия: гг делает из этого вывод «Все было до ужаса очевидным. Моя милая служанка служит графине».</p>\n<p>Инициативу она проявляет через голову господина: не дожидаясь распоряжения, она передала графу, что у Диониса сегодня хорошее настроение. На запрет — «больше не делай что-либо без моего приказа» — она отвечает низким поклоном: «да господин я ваша служанка. Больше такого не повторится».</p>\n<p>Перед дверью в обеденный зал, куда ей входа нет, «черноволосая служанка наклонилась желая мне удачи».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0335-S04", "PS-0335--sposobnosti"], "h": "<p>Прямо как способность в переписке ничего не оформлено, но за ней записаны действия, которые в тексте поданы без объяснения:</p>\n<ul>\n<li><strong>Вода из ниоткуда.</strong> В саду, когда гг держится за колотящееся сердце, «Служанка же стоял рядом со мной. Держа в руках стакан воды, который она достала из неоткуда». Откуда — не сказано; ни гг, ни авторы это не комментируют.</li>\n<li><strong>Мгновенная связь через дворецкого.</strong> Сообщение графу она передала, пока они были в библиотеке, — гг этого не заметил и не понял: «когда ты успела?» — «я сообщил через дворецкого, когда мы были в библиотеке». Сам гг при этом принял дворецкого за библиотекаря.</li>\n<li><strong>Знание особняка и истории.</strong> Она водит гг по особняку-лабиринту, показывает библиотеку, кухню и залы, и по его просьбе излагает «упрощённый вариант истории королевства Пиор» — этого гг хватает, чтобы опознать мир как ту самую сказку о герое справедливости, которую он читал в своём мире.</li>\n<li><strong>Помощь с одеждой.</strong> Наряды этого мира гг сам надеть не может: «Слишком сложно одеваемый и без помощи дополнительных рук их не одеть».</li>\n</ul>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0335-S05", "PS-0335--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Дионис Бэлут</strong> — её господин по должности. Отношения односторонние: он расспрашивает, шутит, делает комплименты, она отвечает кивками. Ему принадлежат обе оценки её работы, см. ниже.</li>\n<li><strong>Графиня Виктория</strong> (<a href=\"PS-0334.html\">Семья Бэлут</a>) — та, кому она служит на деле. Установлено во второй версии по её реакции на слово «мачеха».</li>\n<li><strong>Граф Эдгар Бэлут</strong> (<a href=\"PS-0334.html\">Семья Бэлут</a>) — получатель её донесения о настроении Диониса; после этого граф потребовал присутствия сына на ужине.</li>\n<li><strong>Дворецкий</strong> — канал, через который она передаёт сведения графу. Отдельно как персонаж не прописан; сказано только, что на ужине присутствует «главный дворецкий, с несколькими своими приближёнными».</li>\n<li><strong>Семья Бэлут</strong> (<a href=\"PS-0334.html\">Семья Бэлут</a>) — состав семьи гг узнаёт именно от неё: «Граф Эдгар Бэлут ваш отец и графиня Виктория Бэлут ваша мачеха», «у вас также есть младший брат и младшая сестра от графине Виктории».</li>\n</ul>", "r": [["Семья Бэлут", "PS-0334.html"]]}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0335-S06", "PS-0335--kak-menyalsya"], "h": "<p>Персонаж написан за один вечер, обе версии — 2025-12-14, окно w0113. Это не переработка задумки, а две последовательные части одного текста.</p>\n<p><strong>Версия 1 (id 397758–397759).</strong> Служанка вводится как безымянная фигура во тьме, отвечает на вопросы о имени/возрасте/дате, водит гг по особняку, рассказывает про семью и про королевство Пиор, достаёт стакан воды из ниоткуда, сообщает графу через дворецкого и получает запрет действовать без приказа. Оценка гг в этой версии: «будь конкурс лучшей служанки. Ты бы заняла первое место».</p>\n<p><strong>Версия 2 (id 397760).</strong> Помогает гг переодеться, ведёт его на ужин, даёт совет о поведении с семьёй: «так же как и сейчас господин. Думаю они будут рады увидеть вас в хорошем здраве». Здесь же — раскрытие её настоящей принадлежности и переворот прежней оценки. Перед дверью гг говорит: «знаешь теперь я думаю. Ты займешь последнее место» — «служанка приподняла голову в недоумении».</p>\n<p>Формулировка первой версии не заменена второй: обе оценки стоят в тексте как две точки, «первое место» до раскрытия и «последнее место» после.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0335-S07", "PS-0335--chto-s-nim-stalo"], "h": "<p>После ужина гг выходит из зала и ищет её глазами: «Негде её не было, а я даже с путеводителем пару раз заходила не туда. Это конец. Мне правда придётся спать в горидоре». Дальше в записанной части текста она не появляется — в следующем куске (id 397761, см. <a href=\"PS-0334.html\">Семья Бэлут</a>) гг идёт по коридору за Лукасом и Алисой. Чем закончился эпизод с исчезновением служанки и вернулась ли она, в переписке не сказано.</p>", "r": [["Семья Бэлут", "PS-0334.html"]]}, {"t": "Пробелы", "a": ["S08", "PS-0335-S08", "PS-0335--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имени нет — ни в прозе, ни в обсуждении.</li>\n<li>Возраст, рост, одежда, лицо не описаны: сказано только «тьма во тьме», чёрные волосы, чёрные глаза.</li>\n<li>Откуда взялся стакан воды «из неоткуда» — не объяснено, магия это или нет, не сказано.</li>\n<li>Как именно она передала сообщение графу «когда мы были в библиотеке» так, что гг не заметил, — не объяснено.</li>\n<li>С какого времени и на каких условиях она приставлена к Дионису графиней — не сказано.</li>\n<li>Что она сама думает о Дионисе и заметила ли подмену — не сказано; её недоумение показано только один раз, на реплике про «последнее место».</li>\n<li>Куда она делась после ужина — осталось нерешённым.</li>\n<li>Обсуждения этого персонажа между соавторами в переписке нет: есть только проза Славы.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0335--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0334.html\">Семья Бэлут</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0334.html\">Семья Бэлут</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0081.html\">Семья Бэлут</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0335--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-12-14</td>\n<td>397758–397759</td>\n<td>w0113</td>\n<td>Феня (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-14</td>\n<td>397760–397760</td>\n<td>w0113</td>\n<td>Феня (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0335-chernovolosaya-sluzhanka.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0335--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0335.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
