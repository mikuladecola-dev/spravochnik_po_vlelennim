<script>const BASE="";const DOCNAME="Азуриэль (народ)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0068-S01", "GR-0068--chto-eto"], "h": "<p>Азуриэль — раса-народ во вселенной Оам. Происхождение сформулировано так: «Это было группа лиц, чей дети мутировали полностью превратившись Азуриэль. Они с рождения могут использовать Оам и скорость поглощения и выделения Оам у них выше чем у кого либо» (2025-10-20, id 376401; тот же текст повторён 2025-11-05, id 382108). Образ жизни: «Азуриэль. Как народ что прячется от цивилизации. Но некоторый всё же живут среди людей» (2025-11-17, id 385768; повторено 2025-12-06, id 393287).</p>\n<p>При этом в переписке Азуриэль описан двояко, и расхождение не снято. Началось всё с одного существа: 2025-03-26 (id 311282–311288) Слава описал персонажа по понравившейся картинке, дал ему имя Азуриэль и говорил о нём в единственном числе — «он». В том же виде («он», «его способность») Азуриэль описывается и 2025-09-17 (id 366126–366159). Формулировка про народ появляется только внутри большого свода 2025-10-20 (id 376401), причём в одном и том же блоке: сначала идёт описание «его» внешности и «его» способности, а следом — фраза про группу лиц, чьи дети мутировали. Кем является Азуриэль — отдельным персонажем или названием расы — в переписке прямо не решено; в базе это расхождение отмечено как неясность окон w0105 и w0107. Отдельно стоит запись 2026-04-19 (id 462205), где «пятый азуриэль» перечислен среди благословенных как один персонаж наряду с Героем, Александром, Юрой и Максимом.</p>\n<p>Внешность (описание одинаково для персонажа и для народа, повторено во всех сводах): «Гуманоид человеческого роста синий кожей( не точно может розовый) с острыми ушами как у эльфа. Также на лице красивый узоры разного цвета, который могут меняться в зависимости от эмоций. Одежда зимняя. Сам он гибкий» (2025-03-26, id 311285 и 311288; далее без изменений в id 366126, 376401, 382108). В версии от 2025-11-05 внешность отнесена уже ко всем: гуманоиды человеческого роста, гибкие, ходят в зимней одежде.</p>\n<p>Появление на Земле — естественное: «Да апостолы и Азуриэль появились на земле естественным путем» (2025-09-17, id 366193).</p>", "r": []}, {"t": "Общие способности группы", "a": ["S02", "GR-0068-S02", "GR-0068--obschie-sposobnosti-gruppy"], "h": "<p><strong>Оам.</strong> «Они с рождения могут использовать Оам и скорость поглощения и выделения Оам у них выше чем у кого либо» (2025-10-20, id 376401). Это единственная способность, прямо заявленная как общая для всего народа. По общему устройству мира (там же, id 376401) обычному человеку, чтобы пользоваться Оам, нужно поглотить его в большой концентрации и пережить это — Азуриэль этот этап не проходят, у них владение с рождения.</p>\n<p><strong>Нейро-сканер (<a href=\"SP-0239.html\">Нейро-сканер</a>).</strong> Первая формулировка — эмпатия: «Эмпатия. Прекрасно ощущать намерения» (2025-09-17, id 366126; сама идея эмпатии названа ещё 2025-03-26, id 311417). В тот же день переформулировано: «Азуриэль: Нейро-сканер. Его способность это не эзотерическая эмпатия, а гиперразвитое чувство, позволяющее напрямую считывать и интерпретировать биоэлектрическую активность нервной системы других существ» (id 366148). Эта формулировка написана нейросетью — Миколай сразу спросил «это нейронка написала?» (id 366160), Слава подтвердил (id 366168), — но авторы её приняли и дальше пользуются именно ей: она без изменений входит в своды 2025-10-20 (id 376401) и 2025-11-05 (id 382108).</p>\n<p><strong>Слабость.</strong> «находясь в толпе он теряется и не может сконцетрироваться» (2025-09-17, id 366151; повторено в сводах id 376401, 382108).</p>\n<p><strong>Электричество.</strong> «И кстати он может поглощать электричество и улучшать своё физ. Данные и регенерацию. И бить током прикоснувшись человека или стрелять молнии. Но не каких громовых драконов либо ещё какое фантастическое и связанное с энергией бредятины» (2025-09-17, id 366159). Сказано про «него» в единственном числе; в своды 2025-10-20 и 2025-11-05 эта часть не вошла, распространяется ли она на весь народ — в переписке не сказано.</p>\n<p><strong>Вариант 2026-04-19.</strong> В записи про благословенных способность описана иначе: «Он способен чувствовать эмоции людей. А иногда он способен чётко ощутить эмоции нечто, который опять же его куда-то ведут. Если он не пойдёт то его способности умиляться и он более отчётливо начнёт осушать чужие чувствовать, а так как их много он начнёт сходить с ума от этого» (id 462205). Как это соотносится с нейро-сканером и относится ли к народу — в переписке не сказано.</p>", "r": [["Нейро-сканер", "SP-0239.html"]]}, {"t": "Чем участники отличаются друг от друга", "a": ["S03", "GR-0068-S03", "GR-0068--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p>Единственное названное различие — образ жизни: народ прячется от цивилизации, «Но некоторый всё же живут среди людей» (2025-11-17, id 385768; 2025-12-06, id 393287). Чем живущие среди людей отличаются от прячущихся, кроме места жительства, не сказано.</p>\n<p>Не зафиксирован цвет кожи: «синий кожей( не точно может розовый)» — оговорка сохраняется во всех версиях описания, от 2025-03-26 (id 311285) до 2025-11-05 (id 382108). Разделены ли Азуриэль по цвету кожи на группы, в переписке не сказано — это неопределённость самого описания, а не признак различия.</p>\n<p>Других различий между отдельными Азуриэль в переписке нет.</p>", "r": []}, {"t": "Иерархия", "a": ["S04", "GR-0068-S04", "GR-0068--ierarhiya"], "h": "<p>Внутренняя иерархия народа не описана: вожди, старшие, деление на группы не названы.</p>\n<p>Место в иерархии сил мира задано перечнем 2025-11-17 (id 385768) и повторено 2025-12-06 (id 393287): сильнейшие — коты, их девять; вторая по силе раса — апостолы; «Ну и дальше расы и организации который равны по силе с друг другом», и в этом ряду равных стоит Азуриэль — вместе с Детьми мирового древа, Поротаями, группировкой сестры (дочери Имитатора), правительской организацией, церковью с паладинами, организацией Виктора, Пернатыми, вампирами и Аскизами. Там же отдельно оговорено, что «в мире есть просто индивиды который могут быть сильными» помимо рас.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S05", "GR-0068-S05", "GR-0068--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>Апостолы.</strong> «Ты ведь понимаешь что для апостолов у которых главная силы сверх чувства и восприятия ( то есть самое главное нервная система и мозг) то есть Азуриэль является природным охотником Апостолов» (2025-09-17, id 366175). Миколай переспросил: «природным?» (id 366178); ответ, который последовал, касался только происхождения — «Да апостолы и Азуриэль появились на земле естественным путем. Читай выше и всё поймёшь» (id 366193). Сам термин «природный охотник» дальше не разъяснялся.</p>\n<p><strong>Поротай.</strong> «При этом против Поротой они не так эффективны» (2025-09-17, id 366175) — по логике того же сообщения потому, что сила Поротаев не держится на нервной системе. Тут же оговорено: «Но апостолы сильнее поротоя» (id 366177).</p>\n<p><strong>Люди.</strong> Народ прячется от цивилизации, часть живёт среди людей (2025-11-17, id 385768). Как именно живут среди людей и знают ли люди о них — не сказано.</p>\n<p><strong>Прочие расы.</strong> Азуриэль перечисляется в ряду рас вселенной: «Кто у нас как раса есть Поротой Азуриэль Апостолы Одержимый» (2025-09-18, id 366586); в перечне обитателей ещё несформировавшегося мира вместе с апостолами, каменным Поротоем, вампирами и детьми мирового древа (2025-10-02, id 370605). Каких-либо союзов или конфликтов с ними в переписке не названо — в отличие от Поротаев, о которых сказано «Некий союз с апостолами» (id 385768).</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S06", "GR-0068-S06", "GR-0068--kak-menyalas"], "h": "<p><strong>2025-03-26, id 311282–311288 (окно w0086).</strong> Слава описывает существо по пересланной картинке, ещё без имени: гуманоид человеческого роста, синяя (может розовая) кожа, острые эльфийские уши, красивые узоры на лице, зимняя одежда, гибкий; спрашивает: «И какая у него будет способность». Затем даёт имя — Азуриэль — и повторяет описание с добавлением: узоры «могут меняться в зависимости от эмоций». Вселенная в этом окне прямо не названа.</p>\n<p><strong>2025-03-26, id 311412–311429.</strong> Миколай просит расширить представление о существе, чтобы придумать силу: «я все равно не понимаю что это за существо чтобы давать способности», «а то скажу что он ртутью управляет, а ты скажешь, вообще-то очевидно льдом или деревом». Слава отказывается расширять: «Эмпатия я хотел на этом остановиться. Просто хотел чтобы ты возможно подкинул какую нибудь идею». Здесь же <strong>отклонён целый пласт</strong>: на вопрос, надо ли думать про стихии и вещества, ответ — «Нет идти ты в жопу. Там не будет не какой концепций силы( энергий) там будут другое», с пояснением «Я просто всегда слишком сильно стараюсь развить эту энергию и забиваю на всё остальные». Что будет вместо — отложено на «При встрече» и в переписке не раскрыто.</p>\n<p><strong>2025-09-17, id 366126–366128 (окно w0105).</strong> Слава пересылает кусок из другого чата (под заголовком «Слава дондоков:») с прежним описанием внешности и способностью: «Эмпатия. Прекрасно ощущать намерения».</p>\n<p><strong>2025-09-17, id 366148–366159.</strong> Эмпатия переформулирована в нейро-сканер — прямое считывание биоэлектрической активности нервной системы. Добавлены слабость в толпе и работа с электричеством с прямым ограничением: «не каких громовых драконов либо ещё какое фантастическое и связанное с энергией бредятины». Миколай: «это нейронка написала?» (id 366160).</p>\n<p><strong>2025-09-17, id 366175–366193.</strong> Задана роль во вселенной: природный охотник на апостолов, менее эффективен против Поротаев; появился на Земле естественным путём.</p>\n<p><strong>2025-09-18, id 366583–366586.</strong> Азуриэль назван в перечне рас вселенной наряду с Поротоем, апостолами и одержимыми.</p>\n<p><strong>2025-10-02, id 370600–370613 (окно w0106).</strong> Упомянут одной строкой в перечне обитателей несформировавшегося мира, без пояснений.</p>\n<p><strong>2025-10-20, id 376399–376403 (окно w0107).</strong> Большой свод по вселенной Оам: история появления частиц Оам, механика поглощения и выделения, перечень мутантов. В разделе про Азуриэля к прежнему описанию и нейро-сканеру добавлено происхождение расы и рекордная скорость обмена Оам: «Это было группа лиц, чей дети мутировали полностью превратившись Азуриэль. Они с рождения могут использовать Оам и скорость поглощения и выделения Оам у них выше чем у кого либо». Именно с этого момента Азуриэль существует в тексте одновременно как «он» и как народ. Завершается свод словами «Пока что так».</p>\n<p><strong>2025-11-05, id 382108 (окно w0108).</strong> Тот же свод повторён без изменений в части Азуриэля.</p>\n<p><strong>2025-11-17, id 385768–385769 (окно w0109).</strong> Новое — образ жизни: народ, прячущийся от цивилизации, часть живёт среди людей. Здесь же Азуриэль поставлен в ряд рас и организаций, равных между собой по силе, ниже котов и апостолов.</p>\n<p><strong>2025-12-06, id 393286–393290 (окно w0112).</strong> Тот же перечень повторён дословно, в контексте разбора сторон конфликта мира Оэм: «В нашем мире Оэм уже существует много сторон для конфликта». По самому Азуриэлю ничего нового, кроме одной строки, нет.</p>\n<p><strong>2026-02-06 — 2026-02-07, id 429348–429816 (окно w0115).</strong> Слава просит закинуть Оэм в нейросеть, Миколай делает документ и присылает ссылки. Слава замечает: «Че то мало информация оказывается о ОЭМ»; Миколай признаёт, что скинул не всё («ой, ч не все чет кинул видимо», «бля, было не оч удобно ибо много материала»), потом доделывает: «тут уже про сам мир есть. И дополнительное». Слава одобряет. Содержание документа осталось за ссылками, попал ли туда Азуриэль — в переписке не сказано.</p>\n<p><strong>2026-04-19, id 462204–462206 (окно w0120).</strong> Азуриэль появляется в новом ряду — среди благословенных, «людей, что способны чувствовать присутствия когото. Кого именно неизвестно, может бог, может ещё какое-то существо». Он там пятый: чувствует эмоции людей, иногда чётко ощущает эмоции нечто, которые его куда-то ведут; если не идёт — способность усиливается, чужие чувства становятся отчётливее и он сходит с ума. Вселенная в этом окне прямо не названа. Как эта версия соотносится с народом Азуриэль, не проговорено.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "GR-0068-S07", "GR-0068--probely"], "h": "<div class=\"gaps\"><ul>\n<li><strong>Поимённого состава нет.</strong> Ни один Азуриэль по имени не назван; списка участников в переписке не существует. Численность народа не названа.</li>\n<li><strong>Не решено, персонаж это или раса.</strong> Азуриэль описан и как «он» (2025-03-26, 2025-09-17, 2026-04-19), и как народ (с 2025-10-20). Расхождение осталось нерешённым, авторы его не обсуждали.</li>\n<li><strong>Кто такая «группа лиц», чьи дети мутировали, — не сказано.</strong> Ни кто они, ни где и когда это произошло, ни сколько их было.</li>\n<li><strong>Механика мутации не описана.</strong> Сказано только, что дети «мутировали полностью»; отчего именно и почему полностью — не объяснено.</li>\n<li><strong>Цвет кожи не зафиксирован</strong> — синий или розовый, оговорка держится с первого описания до последнего.</li>\n<li><strong>Где живёт народ, не сказано.</strong> Сказано только, что он прячется от цивилизации.</li>\n<li><strong>Внутренней иерархии нет:</strong> вожди, старшие, деление на группы не названы.</li>\n<li><strong>Термин «природный охотник» не разъяснён.</strong> Миколай переспросил, ответ ушёл в сторону происхождения на Земле.</li>\n<li><strong>Отношения с большинством рас и организаций мира не описаны</strong> — названы только апостолы, Поротай и люди.</li>\n<li><strong>Электрическая часть способности не привязана к народу:</strong> в 366159 речь идёт про «него», в общерасовые своды она не вошла.</li>\n<li><strong>Версия 2026-04-19 (благословенный) не связана с остальными:</strong> ни отменяет их, ни дополняет — связь в переписке не названа.</li>\n<li><strong>Обещанное «При встрече»</strong> (что будет вместо концепций энергий и стихий, 2025-03-26, id 311429) в переписке не раскрыто.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0068--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0239.html\">Нейро-сканер</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0068--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0068.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0068-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0068/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым чинить <code>SL-0054</code> — «Список 12 апостолов». Статьи нет, базы 229 КБ, семь входящих ссылок, вселенные сразу четыре, и Оам среди них. Это самая дорогая незакрытая запись во всём справочнике по числу ссылок, и для этой статьи она узловая: весь смысл Азуриэля задан через апостолов — «природный охотник Апостолов». Пока апостолы Оама не написаны, термин «природный охотник» некуда посадить: Миколай переспросил про него в тот же день, ответ ушёл в сторону, и второй стороны отношения в справочнике просто нет. Рядом та же картина в мелком масштабе: у группы <code>GR-0056</code> «Апостолы (21 апостол; насекомые)» статья есть, а базы 0 — то есть статья про апостолов Оама пуста, а материал висит в записи без статьи.</p>\n<p>Второе — расщепление самого Азуриэля на три записи, из которых эта статья самая пустая. У <code>GR-0068</code> базы 0 и ноль входящих ссылок; 50 КБ и две ссылки лежат в <code>MR-0129</code> «Азуриэль» (заведён как мир); первая версия способности — в <code>SP-0219</code> «Эмпатия (Азуриэль)»: статьи нет, 3,1 КБ, вселенная помечена «вне вселенной», хотя это прямой предок нейро-сканера (<code>SP-0239</code>, 25 КБ, статья есть). Спор «персонаж или раса», который статья честно выносит в пробелы, в базе уже материализован: он лежит между записью-миром и записью-группой.</p>\n<p>Третье — ряд 2026-04-19. <code>PS-0359</code> «Герой» (14,7 КБ), <code>PS-0361</code> «Юра» (7,7 КБ), <code>PS-0362</code> «Четвёртый благословенный (запах дома)» (8,0 КБ) — все из окна w0120, у всех вселенная «неясно», ни у одного нет статьи, ни на одного никто не ссылается. «Пятый азуриэль» — из этого же перечня, и он единственный из пятерых, кто попал в статью.</p>\n<h3>С чего начать</h3>\n<p>Материал в базе, в архив нужно точечно.</p>\n<p>Основной массив — <code>MR-0129</code> (50 КБ). Всё, что в этой статье занимает абзац, там развёрнуто; сводить надо оттуда, а не заново из переписки. Первая версия способности — <code>SP-0219</code>, окно w0086, 2025-03-26.</p>\n<p>Ряд благословенных — <code>PS-0359</code>, <code>PS-0361</code>, <code>PS-0362</code>, окно w0120. Все три отвечают на вопрос, к какому именно перечню приписан «пятый азуриэль»; у <code>PS-0359</code> версий четыре и даты тянутся до 2026-06-02, то есть этот ряд после апреля продолжали, а Азуриэль в нём остался на одной версии.</p>\n<p>В архив — за двумя вещами. Первая: окно w0115, 2026-02-06 — 2026-02-07. Там Миколай собирает документ по Оэм для нейросети и присылает ссылки; содержание за ссылками, и попал ли туда Азуриэль, из переписки не видно. Смотреть надо не текст окна, а что именно ушло по ссылкам. Вторая: обещанное «При встрече» от 2025-03-26 (id 311429) — то, что должно было встать вместо концепций энергий и стихий. В базе следа нет; если оно вообще существует, оно устное, и в архиве будет только косвенно — по тому, что появилось в переписке после этой даты.</p>\n<h3>Как развивалось</h3>\n<p>2025-03-26 — заявили одно существо по картинке, в единственном числе, «он». Тем же днём ограничили дважды: сам автор отказался расширять описание («Эмпатия я хотел на этом остановиться») и отдельно отрезал целый пласт — «там не будет не какой концепций силы( энергий)», с пояснением про собственную привычку. Дальше почти полгода тишины. 2025-09-17 вернулись и переписали эмпатию в нейро-сканер — чужим текстом, который Миколай сразу опознал; в тот же день добавили слабость, электричество и роль охотника на апостолов. 2025-10-20 внутри общего свода по Оам существо стало народом, причём в одном блоке с описанием «его» внешности; свод кончается словами «Пока что так». 2025-11-05 и 2025-12-06 повторили дословно, без единого нового слова про Азуриэля. 2026-04-19 вернулись в третий раз — уже как к пятому благословенному, с третьей формулировкой способности, и связь с народом не назвали.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>В своде 2025-10-20 правило входа в силу для обычного человека названо прямо: чтобы пользоваться Оам, надо поглотить его в большой концентрации и пережить это. Порог, событие, цена.</p>\n<p>Для тех, кто стал первыми Азуриэль, правила такого же рода нет. Сказано только, что была «группа лиц, чей дети мутировали полностью превратившись Азуриэль» — и что у готового Азуриэля владение с рождения. Но дети этой группы рождением ничего не получали: с ними что-то произошло. Был ли у них тот же порог, что у человека, поглощавшего Оам, или другой, и почему «полностью», если в том же своде есть отдельный перечень мутантов, — не проговорено. Для людей вход описан как событие, для первого поколения народа — нет, хотя это ровно тот же переход.</p>\n<h3>Отклик</h3>\n<p>Зацепило 2025-03-26. Миколай честно объясняет, почему не может придумать силу: «я все равно не понимаю что это за существо чтобы давать способности», «а то скажу что он ртутью управляет, а ты скажешь, вообще-то очевидно льдом или деревом» — это точная формулировка проблемы соавторства, лучше многих. И получает в ответ «Нет идти ты в жопу», а следом — «Я просто всегда слишком сильно стараюсь развить эту энергию и забиваю на всё остальные». Человек посреди ругани ставит себе диагноз и на этом основании вырезает из мира целую систему, которую любит больше всего. Это редкий случай, когда отказ мотивирован не миром, а собственной привычкой автора, и он в переписке проговорён вслух.</p>\n<p>Второе, что осталось в голове: «синий кожей( не точно может розовый)». Эта скобка держится с марта до ноября, проходит через три свода без единой правки, и её никто не закрывает. Она пережила смену эмпатии на нейро-сканер, превращение персонажа в народ и два дословных повтора. Из всех неопределённостей статьи именно эта выглядит не забытой, а сохранённой.</p></div>", "r": []}];</script>
