<script>const BASE="";const DOCNAME="Кай";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0111-S01", "PS-0111--proishozhdenie"], "h": "<p>Персонаж Славы, объявлен 2024-07-04 (окно w0042, id 196107–196111) сразу как участник преступной организации: карточка вводится словами «Один из участников». Позже (2024-07-09, id 202017–202018) в списке участников Пресрога он назван первым, рядом с Законом и Мазохисткой.</p>\n<p>Карточка заполнена по общему формату:</p>\n<ul>\n<li>Имя: кай.</li>\n<li>Возраст: 29.</li>\n<li>Любит: драки.</li>\n<li>Не любит: — (поле оставлено пустым).</li>\n<li>Сила: 8. Ловкость: 8. Меткость: 6. Скорость: 7. Выносливость: 9. Контроль: 6.</li>\n<li>Инструмент: «рога ( чем больше чем сильней)».</li>\n<li>Способности: огонь.</li>\n<li>Приёмы: «Приемы потом» — и следом отдельным сообщением сам список.</li>\n</ul>\n<p>Реакция Миколая на карточку: «так нахуй», «это заебенно кнш».</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0111-S02", "PS-0111--vneshnost"], "h": "<p>«Внешка как рогатый демон» (2024-07-05, id 197943). Уточнение дано 2024-07-09 (id 202033–202035): «Человек с рогами», «То бишь демон», «Ну он не демон». То есть демоническая внешность при человеческой природе.</p>\n<p>Рога — не только внешняя черта, но и инструмент по карточке, с прямой зависимостью: «чем больше чем сильней».</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0111-S03", "PS-0111--harakter"], "h": "<p>Из карточки: любит драки. Поле «не любит» оставлено пустым в обеих версиях карточки (2024-07-04 и 2024-07-09).</p>\n<p>Отдельно оговорено, что Кай не курит. Причина дана Славой не как черта персонажа, а как соображение автора: «Не знаю глупо кажется. Сильный челик да и курить» (2024-07-05, id 198010–198012).</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0111-S04", "PS-0111--sposobnosti"], "h": "<p>Способность — огонь. Приёмы (2024-07-04, id 196109; повторены без изменений 2024-07-09, id 202032):</p>\n<ol>\n<li>Огненная регенерация</li>\n<li>Огненный удар</li>\n<li>Файрболы</li>\n<li>Огненное копьё</li>\n<li>Полёт</li>\n<li>Огненный аватар</li>\n</ol>\n<p>Раскрытия того, как каждый приём работает, в переписке нет — приведён только список названий.</p>\n<p>Бытовое применение (2024-07-05, id 198006–198009). На вопрос Миколая «а как кай в жизни использует способность? ну помимо убийства» Слава ответил: «Кай готовить пожрать. Летайте» — то есть готовит еду и летает.</p>\n<p><strong>Грань.</strong> 2024-07-05 (id 197940, 197948–197949) сказано, что гранью могут пользоваться Кай и Имитатор. При этом на текущий момент сюжета Кай ею не владеет: «Он по сюжету научиться делать грань», «А так который сейчас не может использовать грань». Владение гранью, таким образом, заявлено как будущее событие, а не как имеющаяся способность.</p>\n<p>Оружие персонажу отдельно не заведено: 2024-07-05 (id 198006) Слава отметил «Да и оружие надо бы», но дальше в приведённых кусках к этому не возвращался. В карточке заполнены только графы «Инструмент» и «Способности».</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0111-S05", "PS-0111--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Преступная организация / Пресрог</strong> — Кай в ней состоит (id 198028). 2024-07-09 в списке участников он идёт вместе с <strong>Законом</strong> и <strong>Мазохисткой</strong>. Про Мазохистку Слава сразу сказал: «Да забудь о ней её сразу убьют после её появления».</li>\n<li><strong>Имитатор</strong> — второй персонаж, названный способным пользоваться гранью. Про Имитатора в том же обмене сказано: «Имитатор видо изменяет способности. Вместо имитация, создания множество других способностей, то бишь он может сам придумывать способности», внешность — «как серафим», «Ну не полноценный серафим».</li>\n<li><strong>Параман</strong> — бог, в которого верят люди. Названо в ответ на путаницу вокруг Кая (см. ниже).</li>\n<li><strong>Защитник Асгарда (Избранный)</strong> — с ним Кай путается в разговоре 2024-07-05 и 2024-07-09.</li>\n</ul>\n<p><strong>Путаница «Кай — бог».</strong> 2024-07-05 (id 197944–197946) Миколай на описание рогатого демона отвечает «чтоо», «и его считают богом», «круто». 2024-07-05 (id 198023–198041) он спрашивает «а кай че за хуй», «и где он», «бог», «получается», «а люди его видят?». Слава отвечает «Он состоит в той преступной организации» и на прямой вопрос уточняет: «Так он человек», «Где ты взял что он бог». На вопрос, в кого тогда верят люди, отвечает: «Ну Парамана». 2024-07-09 (id 202025–202028) Миколай снова спрашивает, не из Асгарда ли Кай, Слава отвечает «Нет», «Он то не человек» — фраза противоречит его же более раннему и более позднему «Так он человек» / «Человек с рогами»; в переписке эта фраза не поправлена и не обсуждена. Миколай объясняет свои вопросы так: «у меня с памятью на имена проблемы».</p>", "r": []}, {"t": "Как менялся", "a": ["S06", "PS-0111-S06", "PS-0111--kak-menyalsya"], "h": "<p><strong>2024-07-04, id 196107–196111 (w0042).</strong> Введён как «один из участников». Полная карточка со статами, инструментом (рога), способностью (огонь) и списком из шести огненных приёмов, присланным сразу вслед за пометкой «Приемы потом». Поле «не любит» пустое.</p>\n<p><strong>2024-07-05, id 197939–197955 (w0044).</strong> Задана внешность: «Внешка как рогатый демон». Заявлено, что гранью может пользоваться и Кай, и Имитатор, но Кай пока не умеет и научится по сюжету. В том же обмене возникает первая путаница с богом.</p>\n<p><strong>2024-07-05, id 198006–198012 (w0044).</strong> Бытовое применение силы: готовит еду, летает. Отмечено, что не курит. Отмечена нехватка оружия («Да и оружие надо бы»).</p>\n<p><strong>2024-07-05, id 198022–198041 (w0044).</strong> Закреплена принадлежность к преступной организации. Прямо оговорено, что Кай человек, а не бог; бог, в которого верят люди, — Параман.</p>\n<p><strong>2024-07-09, id 202017–202039 (w0046).</strong> Кай назван участником Пресрога в списке с Законом и Мазохисткой. Карточка прислана повторно слово в слово, вместе со списком приёмов и сохранённой пометкой «Приемы потом» и пустым полем «не любит». Добавлена формулировка природы: «Человек с рогами», «То бишь демон», «Ну он не демон». В том же обмене — реплика «Он то не человек», не согласованная с остальными.</p>\n<p>Между версиями ни один стат, ни один приём и ни одна графа карточки не изменились: 2024-07-09 карточка воспроизведена в точности такой же, как 2024-07-04.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0111-S07", "PS-0111--chto-s-nim-stalo"], "h": "<p>По состоянию на 2024-07-09 Кай — действующий участник Пресрога (преступной организации). Заявлено будущее сюжетное событие: он научится делать грань. Произошло ли оно, в приведённых кусках переписки не сказано.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0111-S08", "PS-0111--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поле «не любит» осталось пустым в обеих версиях карточки.</li>\n<li>Механика приёмов не расписана — только названия шести приёмов.</li>\n<li>Оружие не заведено, хотя необходимость его отмечена.</li>\n<li>Что за «та преступная организация» (её состав, цели, отношение к Пресрогу) в окне w0044 не расшифровано.</li>\n<li>Реплика «Он то не человек» (id 202028) противоречит «Так он человек» (id 198036) и «Человек с рогами. То бишь демон. Ну он не демон» (id 202033–202035); противоречие в переписке не разобрано.</li>\n<li>Как именно Кай научится грани и что при этом изменится — не сказано.</li>\n<li>Разграничение реплик про Кая и про защитника Асгарда в окне w0044 не проведено: часть вопросов про способность Миколай задаёт про Кая, а Слава отвечает то про одного, то про другого.</li>\n<li>Происхождение персонажа, откуда у него рога, прошлое и связи вне организации не названы.</li>\n<li>Верхний предел зависимости «чем больше рога, тем сильнее» не оговорён.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0111--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0026.html\">Пресрог (преступная организация)</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0104.html\">Нуар</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0026.html\">Пресрог (преступная организация)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0111--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-04</td>\n<td>196107–196111</td>\n<td>w0042</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-05</td>\n<td>197939–197955</td>\n<td>w0044</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-05</td>\n<td>198006–198012</td>\n<td>w0044</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-05</td>\n<td>198022–198041</td>\n<td>w0044</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-09</td>\n<td>202017–202039</td>\n<td>w0046</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0111-kay.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0111--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0111.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
