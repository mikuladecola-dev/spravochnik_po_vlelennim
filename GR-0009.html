<script>const BASE="";const DOCNAME="Организация Нимб (НБО)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0009-S01", "GR-0009--chto-eto"], "h": "<p>Разведка занесла «Нимб» в группы, но по переписке это не группа персонажей, а организация — фармацевтическая компания, вокруг которой Слава строит одноимённый сеттинг. Поимённого состава у неё нет: за всё время в чате названы два человека, и то с оговоркой (см. «Состав»). Всё остальное — устройство самой конторы: заводы, отделы, товар и то, что она ловит.</p>\n<p>Первое и самое подробное описание Слава даёт 2025-04-08 (id 317240–317258), отвечая на вопросы Миколая о том, что за апокалипсис он строит. Ответ на все вопросы разом — одно слово: «Нимб» (317228).</p>\n<p>Что сказано в этом заходе:</p>\n<ul>\n<li>«Организация нимб» (317240).</li>\n<li>«Официально появилась в 2003 году 11 июня» (317241).</li>\n<li>«Это фармацевтическая компания» (317242).</li>\n<li>«У ней есть свои фармацевтический заводы, фабрики, А также больницы и аптеки, ветеринарный клиники» (317243).</li>\n<li>«Известно своими качественными товарами и услугами» (317244), «Способны излечить даже рак» (317245), «Или отрастить конечность» (317246), «Что бы полечиться в нимбе к нам ездять даже иностранцы» (317247).</li>\n<li>«И у них также контракт с армии» (317248).</li>\n<li>«Хотя формально они правительства организация, но на деле они свободная организация» (317249).</li>\n<li>«А теперь же к сладкому» (317250) — «Они типа сцп» (317251).</li>\n<li>«Ловят разный объекты виде чернышей и медузы» (317252), «И на основе их ней крови или чего-нибудь другого создають разный препараты» (317253).</li>\n<li>«А также проводят эксперименты над людьми» (317254), «Чаще всего над преступниками» (317255), «Но бывает и над сиротами» (317256).</li>\n</ul>\n<p>Жанр автор определяет сам: «Грубо говоря это организация сцп только измененая под мои рамки» (317258). Позже уточняет, что объекты — не официальные SCP: «Мои» / «Личные» / «Хотя они могут быть похоже» / «Ведь в сцп их там дохуя» (317450–317454).</p>\n<p>Сокращение придумывает Миколай: «дай называть нб: нимб банк» / «банк объектов» / «нбо» (317467–317469), Слава соглашается — «Ок» / «Нбо» (317470–317471). При этом сокращение относится не ко всей организации: на вопрос Славы «А че не просто нимб» (317473) Миколай отвечает «ну типа нимб это пошире будет» (317472), «там же они как больничка и другое» (317474). То есть НБО — та часть, что ловит и держит объекты, а Нимб — вся контора целиком.</p>\n<p>Отдельная оговорка: под именем «Нимб» в архиве идут записи по двум разным вселенным — по «Нимбу» (<a href=\"VS-0006.html\">Нимб</a>) и по «Апостолу», где 2025-09-12 организация переопределяется как религиозная церковь. В одну статью они сведены по совпадению имени. Что это одна и та же организация, авторы прямо нигде не говорили.</p>", "r": [["Нимб", "VS-0006.html"]]}, {"t": "Состав", "a": ["S02", "GR-0009-S02", "GR-0009--sostav"], "h": "<ul>\n<li><a href=\"PS-0011.html\">Демон</a> — Демон</li>\n<li><a href=\"PS-0195.html\">Масочник</a> — Масочник</li>\n</ul>\n<p>Оба названы одной репликой. На вопросы Миколая «кто хуйло» / «в плане злодей кто» (317508, 317511) Слава сначала отвечает, что злодея нет («Не кто», 317509), а потом выкрикивает: «Ааааааааааааааааааааааааааааааа» (317513) — «Демон и масочник» (317515).</p>\n<p>Дальше идёт ключевое уточнение статуса. Миколай спрашивает: «это челы другого мира или директора нимба или всё вместе?» (317516). Слава: «И то и другой» (317517). Ни у Демона, ни у Масочника ни должность, ни отдел, ни что-либо ещё внутри организации не названы.</p>\n<p>Больше никого в организации по имени не назвали. Отделы перечислены (см. «Иерархия»), но кто в них работает — не сказано. Сотрудники появляются только безымянно: в истории лесорубов приезжают представители компании (2025-05-02, id 323370), а в позднем заходе 2026-06-07 (id 488439) упомянуты «ученный», ставившие опыты на дочери Имета, и она сама — выращенная организацией сотрудница; но эта запись относится к другому сеттингу, и в состав группы её никто не сводил.</p>", "r": [["Демон", "PS-0011.html"], ["Масочник", "PS-0195.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0009-S03", "GR-0009--obschie-sposobnosti-gruppy"], "h": "<p>Способностей, общих для участников, в переписке нет — про Масочника вообще ничего не сказано, а способности Демона к организации не привязаны. Что есть — это возможности самой конторы.</p>\n<p><strong>Препараты.</strong> Главный продукт. Сырьё — то, что берут с пойманных объектов: «И на основе их ней крови или чего-нибудь другого создають разный препараты» (317253). На уточняющий вопрос Миколая Слава сначала отвечает «Препараты создають на основе их ней крови / Типо как у яд змей» (317306), потом правит сам себя: про медузу — «Нет крови» (317488), «Биологический жидкости» (317490).</p>\n<p>Механика намеренно простая: «Че они просто исследует объекты и иногда исследование дают результаты и они создают препараты» (317479), «Исследует и получают результат» (317484).</p>\n<p>Эффекты: лечат рак, отращивают конечности (317245–317246). Не только лекарственные — на перечисление Миколая «лекарственных?» / «убийственных?» / «усиливающих?» (317498, 317501–317502) Слава отвечает «Не только» (317500).</p>\n<p>Мотив назван прямо: «именно для препаратов» / «Для получение денег» (317496–317497), «Им не хватает денег налогоплательщиков» (317503).</p>\n<p><strong>Контракт с армией.</strong> «У них есть контракт с армии после того как их ней препараты начали показываться хороший результаты» (317505), «Контракт на создания препаратов который могут усилить (типо супер солдат)» (317507).</p>\n<p><strong>Ловля объектов.</strong> «Нет нимб ловит аномальный объекты» (317392). Названные объекты — «Медуза, черныши, серафим,..» (317440). Черныши (<a href=\"PS-0256.html\">Черныши</a>) названы только в паре с медузами, что они такое — не описано. Медуза (<a href=\"PS-0255.html\">Медуза</a>) описана одним свойством: «медуза находиться вне пространства этого мира» (317530), «Чисто формально, но тела его в нашем мире, но законы физике действуют на него по правилам пространства другого мира» (317536). Дальше Слава говорит: «Там я вообще поебоду придумал» / «Расписывать дофига» (317538–317539) — обещанное подробное описание в чат так и не попало.</p>\n<p>Откуда объекты берутся, автор признаёт непридуманным: «Я даже не придумал откуда они берутся?» (317481).</p>\n<p><strong>Эксперименты над людьми.</strong> «А также проводят эксперименты над людьми» (317254), «Чаще всего над преступниками» (317255), «Но бывает и над сиротами» (317256), повтор — «Также там производять опыт над людьми» (317447).</p>\n<p><strong>Замалчивание инцидентов.</strong> В истории лесорубов (2025-05-02, id 323370) компания приезжает вместо полиции, берёт показания, даёт подписку о неразглашении и платит: «Конечно же с моральными выплатами, как мои 6 зарплат», оплачивает похороны и медицинские расходы. При этом своих препаратов пострадавшим не даёт: «Да нет всё знают, что их ней препараты могут и конечность отрастить. Но они решили не тратить на нас это. Поэтому мне и ампутировали руку». Рассказчик заканчивает опасением: «Вряд ли из-за этого они решат меня убить. Надеюсь». Компания в этом тексте безымянная, с Нимбом прямо не отождествлена (см. «Пробелы»).</p>\n<p><strong>Рассылка писем.</strong> В истории про корабль желаний (2025-04-21, id 320984) участники получили письма от организации «Нимб», и в тексте она названа «Одна из крупнейших организаций всего мира». Виновата ли она в происходящем — внутри истории оставлено открытым: «я не говорила, что она виновата. Я лишь сказала, что письмо от них. А это что-то да и значит».</p>", "r": [["Черныши", "PS-0256.html"], ["Медуза", "PS-0255.html"]]}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0009-S04", "GR-0009--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p><strong>Демон (<a href=\"PS-0011.html\">Демон</a>).</strong> Разработан задолго до Нимба, 2023-03-27 (id 37529–37598), вселенная тогда не названа. Описание: «17 летние нормального телосложения ходит в белой маски где нарисовано улыбка черный плащ Убивает в прямом эфире сверхлюдей который делали грехи на подобие безмысленного убийство» (37532). «Чаще всего он пользуется пистолетом» (37534). Кличку объясняет сам Слава: способностей у него много, «Потому что его кличка демон» (37543), «И надо было дать изюминку» (37544).</p>\n<p>Заявлено шесть способностей, доведены четыре:</p>\n<ol>\n<li>Контроль грешников — «тем грешней человек тем лучше контролирует он их» (37532).</li>\n<li>Ускорение — «он может ускорять себя и другие неудушевленый предметы» (37573).</li>\n<li>Контроль тела — «он может как либо изменять тела и регенерировать» (37577).</li>\n<li>Душа грешника — «хватая противника за голову и за 3 минуты создаёт в его голове мир где он проживает разный или одну жизнь» (37580).</li>\n</ol>\n<p>Пятая и шестая остались нерешёнными: «Ну вот осталось ещё 2» (37581).</p>\n<p>Отклонённые и переданные варианты:</p>\n<ul>\n<li>Контроль интернета Слава сначала называет второй способностью (37547), но в сводных перечнях (37573, 37577) на этом месте уже ускорение.</li>\n<li>Короткую невидимость, лечение других, приведение в сознание, телекинез для камеры, камеру на лбу, контроль радиоволн предлагает Миколай (37535–37542). Лечение и приведение в сознание Слава отдаёт напарникам: «Ему же все равно нужны напарники» (37557), «Ну и вот у него будет напарник с такой способностю» (37562). Самому Демону — «Ему нужна боевая способность» (37564).</li>\n<li>Миколай возражает против лечащих способностей у самого Демона по соображениям жестокости: «Он грешника избивает до потери сознания, приводит в сознание и дальше» (37556), «Или крови грешник много потерял, он его лечит и снова» (37560).</li>\n<li>Управление мышцами Слава отклоняет — «Глупо» (37568).</li>\n<li>Клон грешника (37582) и отнятие способности при убийстве (37585) отклонены оба: «Может другую» / «Может другую» (37595–37596). На этом разговор обрывается.</li>\n</ul>\n<p>В заходе 2025-04-08 к Демону не добавлено ничего, кроме имени и двойного статуса. Рядом Миколай тянет параллель с «Мастером и Маргаритой»: «там демон был типа сущностью другого мира» (317520), потом поправляется — «скорее он находился в существующем мире вне времени» (317524), «ну вот он демон» (317526).</p>\n<p><strong>Масочник (<a href=\"PS-0195.html\">Масочник</a>).</strong> Материала нет. Впервые появляется 2025-01-28 в реестре другой вселенной строкой «Масочник 🎭» (id 285522) — без раскрытия. В Нимбе назван только вторым именем рядом с Демоном (317515) и разделяет с ним тот же двойной статус. Ни внешности, ни способностей, ни роли не сказано.</p>", "r": [["Демон", "PS-0011.html"], ["Масочник", "PS-0195.html"]]}, {"t": "Иерархия", "a": ["S05", "GR-0009-S05", "GR-0009--ierarhiya"], "h": "<p>Отделы перечислены одним сообщением 2025-04-08 (id 317257), заведены отдельной записью <a href=\"MR-0133.html\">Отделы Нимба</a>:</p>\n<div class=\"q\"><p>«У них есть три основных отдела<br>Силовики( ну здесь всё ясно)<br>Бухгалтерии<br>Исследования</p>\n<p>Ещё есть отдал Этики, который часто ругается с отделом силовиков и исследования»</p></div>\n<p>То есть основных отделов три, отдел этики стоит отдельно от них четвёртым и находится в постоянном конфликте с двумя из трёх — силовиками и исследованиями. Кто в отделах работает и кто ими руководит — не сказано.</p>\n<p>Над организацией: «формально они правительства организация, но на деле они свободная организация» (317249).</p>\n<p>Руководство: единственное касание — вопрос Миколая про «директоров нимба» (317516) и ответ Славы «И то и другой» (317517) про Демона и Масочника. Слово «директора» в вопросе принадлежит Миколаю; Слава его не повторяет и не уточняет.</p>", "r": [["Отделы Нимба", "MR-0133.html"]]}, {"t": "Отношения с другими группами", "a": ["S06", "GR-0009-S06", "GR-0009--otnosheniya-s-drugimi-gruppami"], "h": "<ul>\n<li><strong>Армия.</strong> Контракт на усиливающие препараты, «типо супер солдат» (317248, 317505, 317507).</li>\n<li><strong>Правительство.</strong> Формально Нимб — правительственная организация, фактически свободная (317249). Ему не хватает «денег налогоплательщиков» (317503).</li>\n<li><strong>Объекты</strong> (черныши <a href=\"PS-0256.html\">Черныши</a>, медуза <a href=\"PS-0255.html\">Медуза</a>, Серафим) — то, что Нимб ловит и разбирает на сырьё (317252, 317440).</li>\n<li><strong>Иностранцы.</strong> «Что бы полечиться в нимбе к нам ездять даже иностранцы» (317247).</li>\n<li><strong>Персонажи истории про корабль</strong> (Игорь <a href=\"PS-0240.html\">Игорь</a>, Ника, Паша) — получатели писем от организации (320984). Игорь здесь клерк, высокий худой мужчина в очках и пиджаке; связи с самой организацией, кроме полученного письма, у него нет.</li>\n<li><strong>Бригада лесорубов</strong> — сторона, с которой безымянная фармацевтическая компания улаживает инцидент (323370). Отождествление этой компании с Нимбом в переписке не заявлено.</li>\n<li><strong>Фантазёры.</strong> Названы в одной реплике с Нимбом как второе добавление в реестр «Апостола»: «Добавления организация нимб и фантазеров И перераспределение сил» (325808). Чем эти две позиции связаны между собой, кроме одновременного внесения, не сказано.</li>\n</ul>\n<p>В заходах 2026 года (уже по другому сеттингу) рядом названы: ассоциация, которая контролирует и помогает героям, злодеи, культ с четырьмя епископами, апостолы (487001–487005), а также собственная организация Доимы, «о которой нимба неизвестно» (488439).</p>", "r": [["Черныши", "PS-0256.html"], ["Медуза", "PS-0255.html"], ["Игорь", "PS-0240.html"]]}, {"t": "Как менялась — по датам", "a": ["S07", "GR-0009-S07", "GR-0009--kak-menyalas"], "h": "<p><strong>2023-03-27 (id 37529–37598).</strong> Слава придумывает Демона; никакой организации рядом нет, вселенная не названа. Разработка обрывается на четвёртой способности из шести.</p>\n<p><strong>2025-01-28 (id 285519–285527).</strong> Масочник появляется строкой в реестре персонажей вселенной «Апостол». Связи с Нимбом ещё нет.</p>\n<p><strong>2025-04-08, день (id 317240–317258).</strong> Полное развёртывание организации: дата основания, профиль, репутация, контракт с армией, ловля объектов, препараты, опыты над людьми, четыре отдела, авторское определение — «организация сцп только измененая под мои рамки».</p>\n<p><strong>2025-04-08, 16:17 (id 317301–317314).</strong> Уточнение по препаратам: делают на основе крови объектов, «Типо как у яд змей» (317306). Миколай предлагает копаться в составе крови — «мне покопаться в кровяке?» (317304), «я могу узнать составы крови и особенности чтобы применить в создании чего-то» (317309). Слава откладывает: «Ну только позде» / «Я занят» (317310–317311). Здесь же Миколай задаёт вопросы, ответов на которые в этом заходе нет: «это люди да? антагонисты выходит» (317305), «а протагонисты это то кого создали в нимбе?» (317307), «те кого в нимб создали» (317314).</p>\n<p><strong>2025-04-08, 21:13 (id 317392–317454).</strong> Отсечение прежней рамки. До этого Слава строил апокалипсис, где монстры — протагонисты, а люди — антагонисты (317213–317215). Теперь: «А его нету» (317405), «Апокалипсиса и вируса нету» (317430), «Просто знаю есть объекты и есть нимб» (317410), «Есть только нимб и объекты» (317432), «И всё происходит в современном мире» (317412). На вопрос, будет ли апокалипсис дальше, — «Не знаю» (317413). На вопрос Миколая «это темка которой управляет нимб?» (317418) — «Не, забудь про это» (317422). Здесь же объекты объявлены личными, а не официальными SCP (317448–317454).</p>\n<p><strong>2025-04-08, 21:18 (id 317459–317512).</strong> Введено сокращение НБО. Уточнены мотив (деньги) и армейский контракт. Формат вещи назван так: «Ну будут мини истории о некоторых объектов , будней нимба и т. П.» (317512). Тут же признание: «Пока я ещё не до конца придумал мир, пусть пока будет так» (317512).</p>\n<p><strong>2025-04-08, 21:29 (id 317513–317527).</strong> Названы Демон и Масочник, статус — «И то и другой».</p>\n<p><strong>2025-04-08, 21:32 (id 317530–317542).</strong> Медуза: тело в нашем мире, физика — по правилам другого. Дальнейшее расписывание отложено и в чат не попало.</p>\n<p><strong>2025-04-21 (id 320982–320991).</strong> Нимб всплывает внутри прозы — во второй брошенной истории про корабль желаний (<a href=\"IS-0050.html\">Брошенная история про корабль желаний</a>). Здесь организация — отправитель писем и «Одна из крупнейших организаций всего мира». Отдельного объявления вселенной в этом окне нет, привязка идёт по названию внутри текста. Миколай текст в этот вечер не читает: «но я немного позже чекну» / «завтра наверное» (320989–320990).</p>\n<p><strong>2025-05-02 (id 323370).</strong> В эпилоге истории лесорубов появляется безымянная фармацевтическая компания (<a href=\"MR-0135.html\">Фармацевтическая компания</a>) — приезжает вместо полиции, подписка о неразглашении, откупные, похороны и медрасходы за свой счёт, препараты не тратит. Связь с Нимбом здесь не заявлена; в карточке компании прямо отмечено, что «связь с организацией „Нимб“ из прошлой истории Славы не заявлена».</p>\n<p><strong>2025-05-14 (id 325798–325808).</strong> В другой вселенной, «Апостол», Слава выкладывает большой реестр персонажей и сил одним сообщением (Реестр персонажей и сил (Апостолы, Одержимый, Враг, Церковь, Военный, Сторонние силы, Существа, Аномалии, Оружие, Артефакты, Идеи) <em>(статьи ещё нет — <a href=\"kb/SL-0090-reestr-personazhey-i-sil-apostoly-oderzhimyy-vrag-cerkov-voe.html\">исходник</a>)</em>) и сразу говорит, что нужны правки: «Ну и нужно исправления» (325801). На уточнения Миколая «убрать кого-то?» / «добавить» (325806–325807) отвечает: «Добавления организация нимб и фантазеров / И перераспределение сил» (325808). То есть Нимб входит в «Апостол» сразу как пункт списка правок. В какой раздел реестра его собирались вписать — не сказано; дальше в этом окне он не разворачивается. Разделы реестра на тот момент: Апостолы (14 позиций), Одержимый (Гурман), Враг (13 позиций), Церковь (Священнослужитель, Многоглазый), Военный (Зеркальный, Очкарик), Сторонние силы (Породитель, Провидец, Серафим), Существа (пусто), Аномалии (Камни желаний, Озеро перерождения), Оружие (13 позиций), Артефакты (11 позиций), Идеи (Чёрный ящик).</p>\n<p><strong>2025-05-15 (id 326310–326315).</strong> Миколай задаёт прямой вопрос про фарм-корпорацию из истории лесорубов: «Какова роль фарм-корпорации? Это эксперименты, биологическое оружие или они „пылесосят аномалии“?» (326310). Ответ Славы одной строкой: «Биологическая оружия» (326314). Переносится ли эта роль на Нимб, в переписке не сказано.</p>\n<p><strong>2025-09-12 (id 364761–364764).</strong> Переопределение при переработке вселенной: «Новая вселенная более простая» (364761), «Организация Нимб более не фармавечическая компания это религиозная церковь» (364762). Следом: «Ладно давай начнём» (364763) — и разговор уходит к определению благословенных и одержимых. Что означает для Нимба статус религиозной церкви — чем она занимается, кому подчиняется, кто в неё входит — не разбирается. Прежнее описание при этом не отменяется ни в чём, кроме природы организации.</p>\n<p><strong>2026-06-02 (id 487001–487006).</strong> Организация с тем же именем в новом сеттинге героев и злодеев. «Есть нимб что проводит эксперимент, у них в этих экспериментах нет одной цели, у них их дохрена. По типу создать искусственного сверхчеловека, создать лекарство на крови сверхчеловека и т.д.» (487001). Про этику: «ну у них есть маленький изъян их эксперимент не этичный ( и это мягко сказано) сотни тысяч людей умирают пробуя их лекарство. В экспериментах умирает ещё сотня и так далее» (487001). Первый искусственный сверхчеловек — Нуар; до него ИС «большинство из них теряли рассудок или у них появлялись дефекты тела или они умирали. Превращались в жижу» (487006), Нуар — «первый ИС кто сохранил разум и получил способности без каких либо дефектов» (487006). После Нуара правительство раскрывает, «какой нимб плохое», но общество реагирует наоборот и начинает продвигать идею искусственных сверхлюдей; другие организации тоже принимаются их создавать (487001). Второй удавшийся проект — апостолы, 12 ИС, на публику не раскрывался (487001). В итоговом раскладе сил Нимб идёт последней позицией: «6 героев, 6 злодеев, 4 ахрепископа, 12 апостолов, ну и кто-нибудь из Нимба» (487005) — кто именно, не названо.</p>\n<p><strong>2026-06-07 (id 488439–488440).</strong> Роль в биографии Доимы, дочери Имитатора: «Нимб захватили девушку которая была беремена от Имета. Им было интересно унаследует ли ребёнок апостола его способности». Мать умирает, над ребёнком ставят опыты; «По итогу когда ей исполнилось восемь лет, ученный сдались и больше не тестировали её». Дальше — «Поэтому они просто решили взрастить сотрудника, у них и так нехватка кадрова была». Выросшая Доима заводит собственную организацию, «о которой нимба неизвестно».</p>", "r": [["Идеи)", "kb/SL-0090-reestr-personazhey-i-sil-apostoly-oderzhimyy-vrag-cerkov-voe.html"], ["Фармацевтическая компания", "MR-0135.html"], ["Брошенная история про корабль желаний", "IS-0050.html"]]}, {"t": "Пробелы", "a": ["S08", "GR-0009-S08", "GR-0009--probely"], "h": "<div class=\"gaps\"><ul>\n<li><strong>Поимённого состава нет.</strong> Названы только двое — Демон и Масочник, и то как злодеи с двойным статусом, а не как перечисленные сотрудники. Ни рядовых работников, ни глав отделов, ни числа людей.</li>\n<li><strong>Что за должности у Демона и Масочника</strong> — не сказано. Слово «директора» звучит только в вопросе Миколая; Слава отвечает «И то и другой», не уточняя.</li>\n<li><strong>Про Масочника не сказано ничего</strong> сверх имени.</li>\n<li><strong>Пятая и шестая способности Демона</strong> остались нерешёнными; из предложенных Миколаем вариантов Слава отклонил оба, и на «Может, сам или завтра?» (37597) разговор оборвался.</li>\n<li><strong>Откуда берутся объекты</strong> — Слава прямо говорит, что не придумал: «Я даже не придумал откуда они берутся?» (317481).</li>\n<li><strong>Что такое черныши</strong> — не описано ни разу, только название в паре с медузами.</li>\n<li><strong>Обещанное подробное описание медузы</strong> («Там я вообще поебоду придумал», 317538) в чат не попало.</li>\n<li><strong>Кто протагонист</strong> — Миколай спрашивает трижды (317305, 317307, 317314), прямого ответа нет. На «кто гг» (317506) Слава отвечает не в тему, на «кто хуйло» — «Не кто» (317509).</li>\n<li><strong>Будет ли апокалипсис дальше</strong> — «Не знаю» (317413).</li>\n<li><strong>Мир не додуман</strong> по собственному признанию автора: «Пока я ещё не до конца придумал мир, пусть пока будет так» (317512).</li>\n<li><strong>Связь Нимба с фармацевтической компанией из истории лесорубов</strong> нигде не заявлена. Компания там безымянная; сближение держится только на реплике 2025-09-12 «Организация Нимб более не фармавечическая компания» и на совпадении функции (препараты, отращивание конечностей).</li>\n<li><strong>Что за «организация нимб» в реестре вселенной «Апостол»</strong> (325808) — не сказано; строка так и осталась пунктом списка правок. Раздел «Церковь» в том реестре существовал до переопределения Нимба в церковь; связывали ли авторы одно с другим, в переписке не сказано.</li>\n<li><strong>Одна ли это организация во всех вселенных</strong> — авторы не говорили. Записи по «Нимбу» и по «Апостолу» сведены здесь по совпадению имени.</li>\n<li>В сводке базы по окну w0120 значится, что Нимб распыляет вирус, превращающий людей в чудовищ; в дословных сообщениях 487001–487006 этого нет.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0009--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0011.html\">Демон</a>, <a href=\"PS-0195.html\">Масочник</a>, <a href=\"PS-0240.html\">Игорь</a>, <a href=\"PS-0255.html\">Медуза</a>, <a href=\"PS-0256.html\">Черныши</a></li>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0133.html\">Отделы Нимба</a>, <a href=\"MR-0135.html\">Фармацевтическая компания</a></li>\n<li><strong>Упоминает истории:</strong> <a href=\"IS-0050.html\">Брошенная история про корабль желаний</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0075.html\">Фармацевтическая компания (из истории про лесорубов)</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0009--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0009.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0009-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0009/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Главная дыра здесь не в переписке, а в сборке: статья пишет, что про Нимб не сказано почти ничего, а под этим именем в базе лежит 88 701 знак. <code>MR-0132</code> «Нимб» — мир, статьи нет, 88 701, вселенная помечена «Нимб». Рядом <code>VS-0006</code> «Нимб» — вселенная, статьи нет, 21 285. Плюс <code>MR-0133</code> «Отделы Нимба» (1 526), <code>SP-0221</code> «Препараты Нимба» (5 182), <code>IS-0090</code> «Инцидент с вирусом Нимба» (5 635), <code>SP-0224</code> (22 990) — ни у одной статьи нет, ни одна не связана ни с <code>GR-0009</code>, ни с <code>MR-0137</code> (две ссылки, статья есть, база 2 927).</p>\n<p>Отсюда и приоритет: чинить надо не «состав» и не «иерархию», а вопрос «Нимб-организация из реестра „Апостола“ и Нимб-вселенная — это одно или два». На этом одном вопросе висят почти все девять пробелов статьи разом. Пока он не решён, <code>MR-0137</code> (2 927 знаков на две ссылки) остаётся самой дорогой записью набора по соотношению спроса к материалу.</p>\n<h3>С чего начать</h3>\n<p>В базе — и в одном конкретном окне архива, которое до статьи не дошло. w0087, 2025-04-08, id 317240–317257: «Организация нимб» расписана прямым текстом на полтора десятка реплик — дата основания (11 июня 2003), фармацевтические заводы, фабрики, больницы, аптеки, ветклиники, «Способны излечить даже рак», «Или отрастить конечность», контракт с армией, «формально они правительства организация, но на деле они свободная», ловля объектов и препараты на их крови, эксперименты над людьми (преступники, сироты), три основных отдела. Это за месяц до реплики 2025-05-14, которую статья держит за первое упоминание, и это ровно то, что в статье названо «нигде прямо не проговорённым» и восстанавливаемым «только задним числом из слова „более не“».</p>\n<p>Сцены тоже есть, вопреки последнему пробелу. w0088, 2025-04-14 — 04-23: проза, четверо на корабле, «от организации „нимб“?» — письмо, которым их туда позвали. w0121, 2026-06-07, id 488439: Нимб захватывает беременную женщину, ставит опыты на ребёнке, «просто решили взрастить сотрудника» — записи <code>PS-0375</code> «Доима (дочь Имета)» (три ссылки, статьи нет, 9 036) и <code>PS-0324</code> «Дочь Имитатора» (статья есть, 9 403). w0120, 2026-06-02, id 487001: Нимб как автор «проекта апостолов, 12 созданных ИС». Последнее — точка, где организация и главная группа вселенной наконец сходятся, и в статье её нет.</p>\n<h3>Как развивалось</h3>\n<p>2025-04-08 — расписали подробно, в другом контуре. 2025-05-14 — завели одной строкой в списке правок «Апостола», без единого слова о том, что это. Четыре месяца тишины. 2025-09-12 — переопределили одной репликой, отменив состояние, которое в этом контуре ни разу не было заявлено, и тут же ушли к благословенным. 2026-06-02 и 2026-06-07 — вернулись, уже без объяснений и сразу с действиями: эксперименты, кадры, захват, происхождение апостолов.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для безымянной фармкомпании из истории про лесорубов роль в сюжете названа прямо и по требованию: Миколай спрашивает — «Это эксперименты, биологическое оружие или они „пылесосят аномалии“?», Слава отвечает — «Биологическая оружия» (2025-05-15, id 326310). То есть у организации, у которой нет даже имени, функция проговорена. У Нимба — организации с именем и двумя объявленными природами — такого вопроса не задано ни разу, и функции нет ни в фармацевтической редакции, ни в церковной. Правило «спросить организацию, зачем она в сюжете» применено к безымянной и не применено к именованной.</p>\n<h3>Отклик</h3>\n<p>Сильное место здесь одно, и оно случайное: организация, чьё прошлое существует только в форме отрицания. «Более не фармавечическая компания» — и всё, что было до этого, задним числом становится известно из того, что его отменили. Как археология по отпечатку. А самое живое во всём материале статьи — не Нимб, а лесорубы: препараты, которые умеют отрастить конечность, но их «решили не тратить на нас», «поэтому мне и ампутировали руку», шесть зарплат, бумага о неразглашении, оплаченные похороны и финальное «Вряд ли из-за этого они решат меня убить. Надеюсь». Тут за четыре строки видно, как устроена корпорация: она не злая, она считает. Это конкретнее и злее, чем всё, что сказано про Нимб напрямую, — и связь между ними так и не заявлена.</p></div>", "r": []}];</script>
