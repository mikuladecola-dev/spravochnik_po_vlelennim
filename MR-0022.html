<script>const BASE="";const DOCNAME="Асгард";
const LEAD="<p>Асгард (<a href=\"MR-0022.html\">Асгард</a>) — третий остров из семи в цикле «7 островов», летающий остров-теократия. В переписке имя пишется по-разному: «асгар», «Асгар», «Асгард», «Асгарде», «азгарда», «асдард»; в самом первом перечислении островов он обозначен просто как «3 остров». Проработан за четыре окна с 2024-07-03 по 2024-07-09 (id 194774–201966), всего 14 зафиксированных версий.</p>";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0022-S01", "MR-0022--ustroystvo"], "h": "<p><strong>Положение.</strong> Асгард — остров в небе. Первое описание: «Его остров будет в небе и там все будет повязанной на религий» (2024-07-03, id 194842), в противопоставление острову Имитатора: «У имитатор остров на земле обычной» (id 194843). На вопрос «на облаках?» Слава отвечает «Да» (2024-07-05, id 197880–197881), и первое время остров описывается как расположенный на облаках.</p>\n<p>2024-07-09 (id 201865–201869) формулировка уточняется. Миколай спрашивает: «это что / облака / или кусок летающей земли». Слава сначала отвечает «Острова в небе», затем на прямой выбор указывает — кусок летающей земли. Отсюда Миколай выводит: «ну тогда всё заебись / вопрос о ресурсах закрыт / это архипелаг / на разном острове свои ресурсы» (id 201870–201874), Слава подтверждает.</p>\n<p><strong>Движение и высота.</strong> Асгард неподвижен: на вопрос «Асгар двигается» — «Нет» (2024-07-09, id 201888–201890). Висит «Над гористой местности» (id 201895). Над Оазисом он не находится — на предположение Миколая Слава отвечает «Нет конечно» (id 201897–201899). Высота осталась без ответа: на вопрос «на какой высоте / относительно мира» Слава говорит «Не знаю» (id 201893, 201902). При этом в более раннем разговоре высота названа косвенно — «тупо прыгаешь с нескольких километров на землёй» (2024-07-05, id 197970).</p>\n<p><strong>Происхождение.</strong> На вопрос «и как он появился» — «Из фэнтези мира» (2024-07-09, id 201862–201863). Больше об этом не говорится.</p>\n<p><strong>Строй.</strong> Теократия. Формулировка Миколая: «допустим Асгард это уже теократия, тобиж власть у церкви» (2024-07-03, id 194910). Подтверждено 2024-07-04: «церковь получается у власти» (id 196125). Итоговая формула 2024-07-09: «власть у церкви, правитель папа Римский» (id 201808). Правитель — «папа римский», он же названный «правитель техноложки» (id 201782–201784). Правители — «Персы / И их 3 главных правителей» (id 201810–201811); что это значит и кто именно эти трое, дальше не раскрывается.</p>\n<p>Отдельно оговорено, что папа римский — не защитник острова. Миколай предположил: «ну папа это этот хуй / защитник», Слава ответил «Нет» (id 201812–201814). Защитник — «избранный 14 летний мальчик» (id 201818).</p>\n<p><strong>Религия.</strong> Бог — Параман. «Это бог в которого они верят» (2024-07-09, id 201746–201747). На вопрос, что бог представляет собой на деле: «Просто бог которого придумали чтобы оправдать свои действия» (id 201754). Верят также, что «отце может разговаривать с богом» (id 201821).</p>\n<p>Догмат сформулирован дословно: «Нам нужно истребить всех тех в кого вселился демон всех тех кого не понимает нашего бога мы должны очистить мир для спасения его» (id 201803). Миколай оценил это как «поверхностное описание», но других формулировок вероучения в переписке нет.</p>\n<p>Раньше та же идея была сказана иначе: жители «возможно они будут типо Гитлера» (2024-07-04, id 196022), «Типо верить что они посланники богов а все остальные демон так они будут воспитывать детей и т.п.» (id 196025). Миколай сопоставил это со «Смертными грехами»: «а, ну как в смертных грехах примерно» (id 196026), «ну там тож религия ёбу дала» (id 196028).</p>\n<p><strong>Экономика.</strong> Остров ни с кем не сотрудничает, и вопрос «Откуда ресурсы ведь они не с кем не сотрудничает» Слава прямо ставит как открытый (2024-07-09, id 201807); закрывается он позже через архипелаг летающих островов со своими ресурсами у каждого (id 201871–201874).</p>\n<p>Основа хозяйства — поля и рудники: «Ну поля сажать», «Руду добывать», «В рудниках который будут в небе» (2024-07-05, id 197988–197995). Руда идёт на две вещи: «Золотые церкви строить» и «Да и оружие надо бы» (id 198005–198006).</p>\n<p>Причина, по которой на теократическом острове вообще нужен труд, а не одно божье подаяние, объяснена Славой: «Так у защитника не дохуя энергий меньше чем у нуара или имитатора / Он ещё ребенок не до конца развитой силой», «Дак религия не со всем такая», «Да и они хотят войну устроить один Избранные не будет же сражаться» (id 197998–198001).</p>\n<p><strong>Транспорт.</strong> Крыльев у жителей нет. На вопрос «у жителей есть крылья?» ответ: «Есть корабли летающий», «Ну или животные» (2024-07-09, id 201913–201916).</p>\n<p><strong>Армия.</strong> «Есть конечно они же хотят завоевать весь мир» (2024-07-09, id 201921). Служба пожизненная с 16 лет: «Пожизненно с 16» (id 201928). До призыва — «А до этого на полях или в пещерах работаешь / И по выходным молимся» (id 201929–201930). Вопрос Миколая о сроке службы («пожизненно?») Слава принял формулой «Ну допустим да».</p>\n<p>Войны двух родов: внутренние — «Ну революционеры» (id 201952) — и «Или для защиты территории» (id 201954). Нападения на другие острова защитников на момент начала истории ещё не начались: «В момент начала истории они ещё готовились» (id 201955). Это согласуется с ранней формулировкой: «Они будут сидеть набирать ресурсы и силы для атаки на все острова» (2024-07-04, id 196127) — мотив, который Миколай сразу свёл к «все вокруг демоны» (id 196130).</p>\n<p>Чужаки извне приходят редко, тремя способами: «Нападения / Или для тайного сотрудничества», «Или просто агенты» (id 201958–201963).</p>\n<p><strong>Преступность.</strong> На вопрос «там тож есть семена преступной организации?» ответ: «Это церковь» (id 201964–201965). Там же указано: «Семена у сталкера» — что это значит, в переписке не раскрыто.</p>\n<p><strong>Быт.</strong> «люди молятся Богу и получают пищу» (2024-07-05, id 197967). Занятий, кроме молитвы и работы, нет: на реплику Миколая «там ни дачи нихуя / вообще делать нечего» Слава отвечает «Молиться», «И работать» (id 197981–197986). Миколай сводит распорядок к «тупо молиться, хавать спать, срать» (id 197985).</p>\n<p>Отдельное наблюдение Миколая об Асгарде: «а вообще если так подумать / это идеальное место для суицида / тупо прыгаешь с нескольких километров на землёй, звучит весело / наверное все неверующие так рано или поздно делают» (id 197968–197971). На это Слава возражает по факту: «Ну так там нет не верующих / Всех не верующих убили» (id 197979).</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Отклик — не материал авторов</b>\n<p>Больше всего цепляет не теократия сама по себе, а короткий обмен про самоубийства: Миколай замечает, что остров в небе — идеальное место, «наверное все неверующие так рано или поздно делают», а Слава просто отвечает по факту устройства мира — неверующих там нет, их всех убили. Ирония считана верно, а ответ на неё дан предельно буквально, без единой попытки её поддержать.</p></div>", "r": []}, {"t": "Население", "a": ["S02", "MR-0022-S02", "MR-0022--naselenie"], "h": "<p>Численность «Выше среднего» (2024-07-09, id 201937). Детей больше, чем взрослых (id 201938). Долгожителями жители не являются: «Нет мало живут они же с рождения работаю и в армии умирают» (id 201940).</p>\n<p>Неверующих на острове не осталось — их убили (2024-07-05, id 197979).</p>\n<p>Дети воспитываются в том, что жители — посланники богов, а все прочие — демоны (2024-07-04, id 196025).</p>\n<p>Мужчины с 16 лет пожизненно в армии; до 16 работают на полях или в пещерах, по выходным молятся.</p>\n<p>Женщины: «Работают в полях и в пещерах готовят кушать армии шеют одежду. И иногда вступают в армию» (id 201941). Обобщение Славы: «Грубо говоря производители», «Всего орудий детей еды и т.п.» (id 201942–201943). На вопрос «трахаются по закону или по желанию?» — «По желанию» (id 201931, 201936).</p>\n<p><strong>Защитник Асгарда — Избранный.</strong> Ребёнок; в первом описании «Ребенок лет 15» (2024-07-03, id 194841), позже «Защитник избранный 14 летний мальчик» (2024-07-09, id 201818). Считается посланником богов. Способность — контроль и изменение атомов (id 194841). Что он с ними делает: «Камень может сделать жидким / Воздух прочными что хуй пробъешь / Воду в железо» (2024-07-05, id 197884); формулировка Славы — «Философские камень ходячий» (id 197885). Замена вещества полностью, а не только агрегатного состояния: на вопрос «а дерево в золото?» — «Может / Только в зависимости от количества энергий / Она у него не бесконечная» (id 197890–197893). Дополнительно телекинез (id 197889). Слава о нём: «И правда полубог» (id 197891).</p>\n<p>Энергия у него ограничена и меньше, чем у других защитников: «у защитника не дохуя энергий меньше чем у нуара или имитатора / Он ещё ребенок не до конца развитой силой» (id 197998), «Тем более он слабее нуара и имитатора» (id 198001), позже повторено: «У него не бесконечная энергия / И у него меньше чем у любого защитника энергия» (2024-07-09, id 201857, 201861).</p>\n<p>Его положение описано так: «Ну так его с детства приручили что все не верующий одержимы демонами и он их убивает и до сих пор является ребенком / Которым играют взрослый дяденкий» (2024-07-05, id 197976). Слава: «Кстати их него защитника жалко»; Миколай: «жалко их», «мне вот людей больше жалко» (id 197972–197975).</p>\n<p><strong>Отряд белых.</strong> Приближённые защитника, трое: «1. Бесцветная / 2. Лев / 3. Наблюдатель» (2024-07-04, id 196145). Слава представил их как отряд, о котором говорил раньше, причём под другим названием: «Ну я их не так называл», «Я их как то назвал» (id 196141–196143); Миколай предположил вариант «бесцветные?» — Слава уточнил, что бесцветная только одна из отряда (id 196142–196144). Договорённость: «Потом как-нибудь расскажу полностью» (id 196146). Миколай: «они получается его сподручные» — «Ну получается» (id 196148–196149).</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0022-S03", "MR-0022--mesto-vo-vselennoy"], "h": "<p>Асгард — третий остров в списке семи. Первое перечисление (2024-07-03, id 194774):</p>\n<pre><code>1 оазис ( Имитатор )\n2 ??????( Нуар ( челек с растворением личности ))\n3 асгар ( Избранный ( ты его не знаешь))\n</code></pre>\n<p>Там же дано определение масштаба острова вообще: «Остров это город ну или страна» (id 194775).</p>\n<p>Асгард входит в архипелаг летающих островов, где «на разном острове свои ресурсы» (2024-07-09, id 201872–201873).</p>\n<p>Относительно поверхности: висит над гористой местностью, не над Оазисом (id 201895–201899).</p>\n<p>Война. 2024-07-04 Миколай выясняет, где во вселенной идёт война; Слава говорит про Асгард «Ну здесь война», «С кем то», и одновременно про Оазис: «Я говорил что в оазисе мире среди гражданских», «Точней не война, а мини конфликт в оазисе полноценный войны не будет» (id 196015–196027). Асгард готовит нападение на все острова, но к началу истории ещё только готовится (id 196127, 201955).</p>\n<p>Контакты с внешним миром редки и сводятся к нападениям, тайному сотрудничеству и агентам (id 201958–201963).</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0022-S04", "MR-0022--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-07-03 (id 194774–194776).</strong> Назван третьим в списке островов: «3 асгар ( Избранный ( ты его не знаешь))». Остров определён как «город ну или страна».</p>\n<p><strong>Версия 2 — 2024-07-03 (id 194841–194843).</strong> Остров в небе, «там все будет повязанной на религий». Защитник — ребёнок лет 15, которого считают посланником богов, способность — контроль и изменение атомов.</p>\n<p><strong>Версия 3 — 2024-07-03 (id 194910).</strong> Строй определён Миколаем: теократия, власть у церкви. В этой реплике впервые появляется написание «Асгард».</p>\n<p><strong>Версия 4 — 2024-07-04 (id 196011–196029).</strong> Остров религии, жители «типо Гитлера»: посланники богов, все остальные — демоны, на этом строится воспитание детей. Сопоставление со «Смертными грехами».</p>\n<p><strong>Версия 5 — 2024-07-04 (id 196124–196149).</strong> У власти церковь. Остров копит ресурсы и силы для атаки на все острова. Появляется отряд белых — Бесцветная, Лев, Наблюдатель — как приближённые защитника.</p>\n<p><strong>Версия 6 — 2024-07-05 (id 197871–197893).</strong> Третий остров прямо назван Асгардом и помещён «на облаках». Раскрыт набор возможностей защитника: камень в жидкость, воздух в прочное, вода в железо, дерево в золото при достаточной энергии, телекинез; «Философские камень ходячий». Введено ограничение по энергии.</p>\n<p><strong>Версия 7 — 2024-07-05 (id 197966–197996).</strong> Быт: молитва и работа, ничего больше. Неверующих не осталось — всех убили. Замечание про идеальное место для суицида. Работа — поля и рудники в небе. Положение защитника: приручён с детства, «которым играют взрослый дяденкий».</p>\n<p><strong>Версия 8 — 2024-07-05 (id 197995–198006).</strong> Экономика: руда идёт на золотые церкви и на оружие. Обоснование необходимости труда — у защитника мало энергии, и «религия не со всем такая», а войну нужно вести не одному Избранному.</p>\n<p><strong>Версия 9 — 2024-07-09 (id 201735–201760).</strong> Возврат к теме после перерыва. Введён Параман — бог, в которого верят на Асгарде. Бог — «просто бог которого придумали чтобы оправдать свои действия». Подтверждено, что во главе — папа римский.</p>\n<p><strong>Версия 10 — 2024-07-09 (id 201782–201826).</strong> Власть у церкви, правитель — папа римский, он же «правитель техноложки». Дословная формула вероучения об истреблении одержимых демонами и непонимающих бога ради очищения мира. Верят, что отец может разговаривать с богом. Правители — «Персы» и «их 3 главных правителей». Отклонено отождествление папы римского с защитником. Защитник уточнён как 14-летний мальчик (в версии 2 было «лет 15»).</p>\n<p><strong>Версия 11 — 2024-07-09 (id 201855–201880).</strong> Происхождение — «из фэнтези мира». Уточнение природы острова: не облака, а куски летающей земли. Отсюда — архипелаг островов, у каждого свои ресурсы; этим закрывается вопрос о том, откуда ресурсы у изолированного Асгарда. Повторено ограничение энергии защитника, теперь в сильной форме: меньше, чем у любого защитника.</p>\n<p><strong>Версия 12 — 2024-07-09 (id 201886–201918).</strong> Асгард неподвижен, висит над гористой местностью, не над Оазисом. Высота осталась неизвестной. Крыльев у жителей нет — есть летающие корабли и животные.</p>\n<p><strong>Версия 13 — 2024-07-09 (id 201919–201943).</strong> Армия: пожизненная служба с 16 лет, до этого работа на полях и в пещерах, по выходным молитвы. Население выше среднего, детей больше, живут мало. Женщины — «производители» орудий, детей, еды; поля, пещеры, готовка для армии, пошив одежды, иногда служба.</p>\n<p><strong>Версия 14 — 2024-07-09 (id 201944–201966).</strong> Войны — с революционерами внутри и ради защиты территории; нападения на другие острова к началу истории ещё только готовятся. Чужаки приходят редко: нападения, тайное сотрудничество, агенты. Преступная организация Асгарда — это сама церковь.</p>\n<h3>Отклонённые и пересмотренные варианты</h3>\n<ul>\n<li>«Облака» как материал острова (2024-07-05, id 197880–197881) заменены на «кусок летающей земли» (2024-07-09, id 201868–201869). Ранняя формулировка не отменена прямым словом, но на прямой выбор Слава указал именно на летающую землю.</li>\n<li>Название отряда «бесцветные», предложенное Миколаем (id 196142), отклонено: бесцветная — одна из троих, отряд называется «отряд белых».</li>\n<li>Отождествление папы римского с защитником (id 201812–201813) отклонено прямо: «Нет».</li>\n<li>Расположение Асгарда над Оазисом (id 201897) отклонено: «Нет конечно».</li>\n<li>Возраст защитника: «лет 15» (2024-07-03, id 194841) → «14 летний мальчик» (2024-07-09, id 201818).</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0022-S05", "MR-0022--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Высота, на которой висит Асгард, осталась без ответа: «Не знаю» (id 201902). Косвенно упомянуты «несколько километров» (id 197970), но как ответ на вопрос о высоте это не давалось.</li>\n<li>Имя защитника Асгарда в окне w0042 не называется; он именуется только через роль — Избранный, защитник.</li>\n<li>Кто такие «Персы» и кто эти «3 главных правителей» (id 201810–201811) — не раскрыто.</li>\n<li>Что означает «Семена у сталкера» (id 201966) — в переписке не объяснено.</li>\n<li>Отряд белых назван составом (Бесцветная, Лев, Наблюдатель), но не описан: «Потом как-нибудь расскажу полностью» (id 196146). Прежнее название отряда, о котором Слава говорил раньше, он сам не вспомнил.</li>\n<li>На вопрос Миколая «а кто конкретно» (о неверующих, которых убивает защитник) — «Не знаю / Надо придумать» (id 197978–197980). Осталось нерешённым.</li>\n<li>Что находится под Асгардом, кроме указания «гористая местность», не названо (id 201896).</li>\n<li>Как именно летающая земля держится в воздухе и как остров связан с «фэнтези миром», из которого появился, не объяснено.</li>\n<li>Название вселенной, к которой относится остров, в окне w0044 не объявлено.</li>\n<li>Карточка сущности перечисляет среди связанных Кая и Пресрога, но в приведённых кусках переписки об Асгарде они не фигурируют — что именно их связывает с островом, здесь не сказано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0022--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в мирах:</strong> <a href=\"MR-0031.html\">Религия Асгарда</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0027.html\">Церковь Асгарда</a>, <a href=\"GR-0028.html\">Отряд белых</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0022--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-03</td>\n<td>194774–194776</td>\n<td>w0041</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-03</td>\n<td>194841–194843</td>\n<td>w0041</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-03</td>\n<td>194910–194912</td>\n<td>w0041</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-04</td>\n<td>196011–196029</td>\n<td>w0042</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-04</td>\n<td>196124–196149</td>\n<td>w0042</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-05</td>\n<td>197871–197893</td>\n<td>w0044</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-05</td>\n<td>197966–197996</td>\n<td>w0044</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-05</td>\n<td>197995–198006</td>\n<td>w0044</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-09</td>\n<td>201735–201760</td>\n<td>w0046</td>\n<td>7 островов (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2024-07-09</td>\n<td>201782–201826</td>\n<td>w0046</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-09</td>\n<td>201855–201880</td>\n<td>w0046</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-09</td>\n<td>201886–201918</td>\n<td>w0046</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-09</td>\n<td>201919–201943</td>\n<td>w0046</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-09</td>\n<td>201944–201966</td>\n<td>w0046</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0022-asgard.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0022--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0022.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["MR-0022-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/MR-0022/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Самая дорогая незакрытая нить — не про сам Асгард, а про то, как он вписан в общий рейтинг силы защитников. Служебная запись «Сравнение силы защитников» (<code>SL-0020</code>) так и не стала статьёй, хотя на неё уже ссылается статья мира <code>VS-0001</code> (7 островов), причём дважды — в тексте и в своде связей. Там же зафиксировано и нигде не отменено решение заменить Сталкера как защитника или вовсе убрать его из вселенной, при том что в перечне островов (id 201636) Сталкер по-прежнему числится защитником Пректри. Это решение прямо касается того, как Избранный из Асгарда сравнивается с другими защитниками, — а само сравнение держится именно на этой нерешённой записи.</p>\n<h3>С чего начать</h3>\n<p>Архив копать не нужно: сравнение уже процитировано в <code>VS-0001</code>, id 202138–202155 (2024-07-09) — «Избранный азуенная способность / Имитатор глазки / Наур сосуд самый мощный», «а сталкер как говно» — и там же нерешённое «его в этой вселенной не будет пожалуй» против списка островов, где Сталкер всё ещё на месте. Это то же окно w0046, где 2024-07-09 уточнялась и большая часть параметров самого Асгарда.</p>\n<h3>Как развивалось</h3>\n<p>Асгард держится на переопределении, а не на добавлении. Заявили 2024-07-03: остров в небе (id 194842). Через два дня, 2024-07-05, уточнили образ — «на облаках?» — «Да» (id 197880–197881), и так и осталось общим местом. Только 2024-07-09 вопрос заострили прямо: «это что / облака / или кусок летающей земли» — и Слава выбрал землю, а не облака (id 201865–201869). Ранняя версия при этом нигде не была отменена словом — просто по ней перестали говорить, и на прямой вопрос ответили иначе.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для своих неверующих внутри острова правило прямое: их убили, других не осталось (id 197979). Но остров всё равно принимает чужаков — через нападения, тайное сотрудничество и агентов (id 201958–201963). Правило о том, что происходит с человеком, который проникает на остров или попадает на него таким путём, — обращают ли его, проверяют ли на веру, убивают ли по той же логике, что и местных неверующих, — не сформулировано вовсе, хотя логика для местных уже есть.</p>\n<h3>Отклик</h3>\n<p>Больше всего цепляет не теократия сама по себе, а короткий обмен про самоубийства: Миколай замечает, что остров в небе — идеальное место, «наверное все неверующие так рано или поздно делают», а Слава просто отвечает по факту устройства мира — неверующих там нет, их всех убили. Ирония считана верно, а ответ на неё дан предельно буквально, без единой попытки её поддержать.</p></div>", "r": []}];</script>
