<script>const BASE="";const DOCNAME="Тьма";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0071-S01", "SP-0071--mehanika"], "h": "<p>Способность известна под несколькими названиями: «тьма», «дым», «тень», «шарики». Разработка растянута на два периода: июнь — июль 2024 (окна w0040 и w0043) и июнь 2026 (окно w0120). Всего десять версий, 2024-06-28 — 2026-06-02.</p>\n<p><strong>Определение.</strong> На прямой вопрос Миколая «В плане тьма / Это че такое / Я конечно встречал, но не понимаю» Слава отвечает одним словом: «Тень» (2024-06-28, id 190736–190739). Через два дня добавляется вторая формулировка: «Тьма осязаемая фигня», «Вот и все подробности» (2024-06-30, id 191889–191890).</p>\n<p><strong>Источник.</strong> Тьма не призывается извне, а исходит из самого носителя. Миколай спрашивает: «Ты вообще как видишь / Типо он тьму призывает / И ей атакует» — Слава: «Он из него сочится» (2024-06-28, id 190769–190773). Вместе с тьмой у носителя идёт регенерация: «И у него Реген» (id 190774). Регенерация именно восстанавливающая, а не собирающая: на вопрос «А, так может если ему руку отхуярить он сможет её восстановить или прилепить?» ответ — «Восстановить» (id 190776–190777).</p>\n<p><strong>Поглощение и фильтрация.</strong> В версии 3 (2024-07-04, id 196738–196748) тьма описана как фильтр: «а тьма сосёт его и фильтрует меж дном и атмосферой» — речь о кислороде. Дальше объём поглощаемого расширяется: «считай любой газ и дым она сосёт, че не надо наружу кидает» (id 196987). В версии 5 та же механика через другой образ: «тьма это как вакуум, он насыщается одним, и убирает другое по воли нуара» (id 196937), причём «она может выделять то что накопила» (id 196942).</p>\n<p>Обоснование, зачем это нужно, Миколай проговаривает отдельно: «ну то что ты жгёшь, обязательно выделяет углекислый / это правило мироздания / а вообще, люди дышут, потребляя кислород, выделяют угль / ну а он создаёт вредные условия / для жизни / поэтому от него надо избавляться» (id 196947–196952).</p>\n<p><strong>Концентрация: барьер против рассеянного состояния.</strong> Разделение вводится в версии 4 (2024-07-04, id 196886–196900). «дым тут это тоже самое что и тьма / просто выглядит так / это уже барьер / от воды / он сам фильтрует че каво». На вопрос «Барьер это дым ?» Миколай отвечает сразу «нет» и «да» и уточняет: «просто нет такой концентрации», «но концентрированный крч / он его удерживает в форме / а там, он просто его выделяет, там форма не требуется / лишь курс». То есть одно и то же вещество: концентрированное удерживается в форме барьера, разрежённое просто выделяется в заданном направлении.</p>\n<p><strong>Наглядная модель — шарики.</strong> Версия 7 (2024-07-04, id 197014–197035): «представь тьму как множество шариков / ты можешь их потрогать / и в них перемещаться / а эти шарики могут сосать &lt;...&gt; газ / пыль / грязь / прям сосут / с себя / и перемещаться могут». Слава пересказывает своими словами и получает подтверждение: «Тьма может поглощает все / С помощью этого трубы на суши качает воздух и они находятся внутри тьмы, и также люди / С помощью этого он может контролировать тех кто проходить через трубы / А сфера поглощает грязь и делает их в телесный комки и выкидывать океан» — Миколай: «ну примерно так», «короче да так».</p>\n<p><strong>Пропитывание территории (версия 2026 года).</strong> Слава: «Ну он просто пропитывает всё своё тьмой. Всё воздух, землю, воду. Всё что не имеет инстинктов или разума попадають под воздействия тьмы ( то есть даже деревья и трава превращается во тьму). И эту тьму Наур может полностью контролировать и перемещаться в ней» (2026-06-02, id 487010). Радиус области — «примерно 3 км». Внутри области действует двойной эффект: «в области тьмы способности нуар становяться мощнее, а способности противников слабее».</p>\n<p>Критерий превращения — отсутствие инстинктов или разума. Деревья и трава названы прямо как то, что превращается во тьму.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0071-S02", "SP-0071--ogranicheniya-i-cena"], "h": "<ul>\n<li><strong>Выделять тьму обязательно.</strong> Про носителя под водой: «иначе он сдохнет» (2024-07-04, id 196899). Там же: «это очень сложно» (id 196900).</li>\n<li><strong>Тьма не окутывает весь остров.</strong> Слава: «Тьма не окутывает весь остров», Миколай подтверждает: «остров не окутывает / зато трубу» (2024-07-04, id 196941–196945).</li>\n<li><strong>Выход за барьер смертелен.</strong> «но прикол в том, что если ты за барьер выйдешь, а это сделает просто, тебя под весом воды к ебеням раздавит» (2024-07-04, id 196744).</li>\n<li><strong>Воздух не превращается.</strong> Ограничение введено 2026-06-02 после вопроса Миколая «не слишком имба / ?»: «Да-да. Воздух он не превращает во тьму» (id 487049–487052). Закреплено как условность мира: «Наур больше не превращает воздух во тьму. Он превращает только твёрдые и жидкие вещества» (id 487170).</li>\n<li><strong>Плёнка сверхлюдей.</strong> Общая для вселенной защита: «У сверхлюдей есть как бы плёнка что защищает от воздействия других способности. Чем сильнее сверхчеловек тем больше плёнка» (2026-06-02, id 487170). В сообщении она приведена как ограничение для Графа («Поэтому граф против особо сильных не может раздавить их просто или остановить сердца»); распространяется ли она на тьму — в переписке отдельно не сказано.</li>\n<li><strong>Дебаффов нет.</strong> «И все больше дебаффов не будет» (2024-06-28, id 190802) — см. отклонённые варианты.</li>\n</ul>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0071-S03", "SP-0071--nositeli"], "h": "<p><strong>Персонаж с раздвоением личности (вторая, убийственная личность).</strong> Первый носитель, версии 1–2 (2024-06-28 — 2024-06-30). Слава: «Есть один с раздвоением личности способности тьма / Приемы??????» (id 190733). Расклад личностей: «Первая личность лентяй, сонливый, вечно засыпающий, с краткой временной памятью / Вторая убийца получающий удовольствия» (id 190747), при этом «У первой личности нет способностей» (id 190748). Позже Слава правит описание убийцы: «Убийца прости это не правильная описания / Он скорее в открытую нападает показывая ничтожество противника и превращает его в месиво» (id 190763). В карточке сущности тьма отнесена к этому персонажу («Часть чего»).</p>\n<p><strong>Нуар.</strong> Носитель в версиях 3–10. В окне w0043 (июль 2024) на его тьме держится подводный остров: барьер от воды, фильтрация воздуха и транспортная среда одновременно. В окне w0120 (июнь 2026) тьма — его главная способность. Слава: «Ну начнём с Нуара. Ведь я просто добавил пару способности и улучшил тьму» (2026-06-02, id 487008). Прочие его способности, названные в том же сообщении: управление собственной кровью, «Слова» (приказы, которым люди повинуются), молния. Там же — общие особенности Нуара и апостолов: «Они не стареют, у них невероятное быстрая регенерация тела. И их тела очень адаптивные. Ну ещё несколько особенностей которых я прям здесь не скажу» (id 487009).</p>\n<p>Связь между двумя носителями (тот же это персонаж или разные) в переписке не проговорена.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0071-S04", "SP-0071--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-06-28 (окно w0040, id 190730–190824).</strong> Способность второй, убийственной личности персонажа с раздвоением. Тьма = тень. Сочится из носителя, ей он атакует. Прилагается регенерация (восстановление конечностей). Слава отсекает дебаффы. Миколай пробует придумать «красивую атаку»: «Ну бля, я чет интересное хочу придумать / Но не выходит». Разговор откладывается — Слава: «Потом».</p>\n<p><strong>Версия 2 — 2024-06-30 (окно w0040, id 191884–191893).</strong> Возврат к отложенному вопросу. «Тьма осязаемая фигня / Вот и все подробности». Вопрос Миколая «А че по инструментам?» остаётся без ответа: «Хммм».</p>\n<p><strong>Версия 3 — 2024-07-04 (окно w0043, id 196738–196748).</strong> Носитель — Нуар, контекст — остров на дне океана. Тьма сосёт кислород и фильтрует его между дном и атмосферой. Под тьмой при этом возможен обычный фотосинтез: «да не, обычный фотосинтез реализует, который мне возможен во тьме под водой», потому что Солнце «энергией делиться».</p>\n<p><strong>Версия 4 — 2024-07-04 (окно w0043, id 196863–196900).</strong> Введено тождество тьма = дым = барьер и различение по концентрации. Барьер от воды, сам фильтрует. Трубы — это тоже тьма: «это и есть трубы», «тьма / без солнца», «ну так сама тьма поглощает газ / в трубах нету». Куда девается газ: «в сферу / и из неё». Носителю необходимо выделять тьму, иначе он умрёт.</p>\n<p><strong>Версия 5 — 2024-07-04 (окно w0043, id 196937–196952).</strong> Тьма как вакуум: насыщается одним, убирает другое по воле Нуара, может выделять накопленное. Уточнено покрытие: остров не окутывает, трубу — окутывает. Слава предлагает альтернативный образ: «Или дым от костра», Миколай отвечает «ну от жизни всех существ / ну из дерева».</p>\n<p><strong>Версия 6 — 2024-07-04 (окно w0043, id 196981–196989).</strong> Расширение поглощаемого: «считай любой газ и дым она сосёт, че не надо наружу кидает». Дым от костра из обсуждения выведен: «на дым вообще поебать / забудь о нём».</p>\n<p><strong>Версия 7 — 2024-07-04 (окно w0043, id 197014–197035).</strong> Модель шариков: осязаемые, внутри них можно перемещаться, сами перемещаются, сосут газ, пыль и грязь. Добавлена функция контроля: через тьму в трубах Нуар «может контролировать тех кто проходить через трубы». Сфера скатывает грязь в комки и выкидывает в океан. Пересказ Славы подтверждён Миколаем.</p>\n<p><strong>Версия 8 — 2026-06-02 (окно w0120, id 487008–487010).</strong> Улучшенная версия. Пропитывание тьмой воздуха, земли и воды; всё без инстинктов и разума превращается во тьму, включая деревья и траву. Полный контроль и перемещение в тьме. Радиус около 3 км. Внутри области способности Нуара сильнее, способности противников слабее.</p>\n<p><strong>Версия 9 — 2026-06-02 (окно w0120, id 487049–487053).</strong> Правка после вопроса Миколая про имбаланс: воздух Нуар во тьму не превращает.</p>\n<p><strong>Версия 10 — 2026-06-02 (окно w0120, id 487170–487172).</strong> Правка закреплена как условность мира: превращаются только твёрдые и жидкие вещества. В том же сообщении введена плёнка сверхлюдей.</p>\n<p>Вселенная для версий 8–10 в карточке помечена как «неясно (по дате объявления)»; для версий 1–7 — «7 островов».</p>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S05", "SP-0071-S05", "SP-0071--otklonennye-varianty"], "h": "<p><strong>Набор приёмов от Миколая (2024-06-28, id 190751).</strong> Предложены четыре механики разом:</p>\n<ul>\n<li>«Возможность сталкерить падая в тень»;</li>\n<li>«тэпэшка через теневой мир, но не себя а предметов, то есть, может стрелять в свою тень а снаряды из другой вылетают»;</li>\n<li>«пожирание солнца внутри человека лишением тени, человек так станет неосязаемым, то есть не нанесёт урон и не возможно будет нанести урон ему &lt;...&gt; радиус 5 метров, так челы смогут проходит сквозь препятствия в радиусе действия».</li>\n</ul>\n<p>Оценка Славы: «Все говно кроме солнца» (id 190757). Уцелевшая часть переформулирована им как отдельная механика: «Солнце поглашаеть все положительных чувств ( не действует на сильных духом)» (id 190793). Миколай отмечает совпадение: «А, сука я тоже самое написал другими словами».</p>\n<p><strong>Захват тенью в духе Шикамару (2024-06-28, id 190740–190742).</strong> «Ну у одной личности будет способность шикимару / Захват» — Слава: «Нет».</p>\n<p><strong>Дебаффы прикосновением (2024-06-28, id 190779–190784).</strong> «Ну тогда он может проклинать противника, дебафить по всем статам лишь прикосновением / И уже над слабаками издеваться / Кромсать» — Слава: «Нет», «Не будет», затем общий запрет: «И все больше дебаффов не будет».</p>\n<p><strong>Баф инструментов тьмой (2024-06-28, id 190806).</strong> «Он бафает себе инструменты, они наделяются тьмой, и ну в общем лучше работают». Ответа по существу нет — Миколай сам обрывает мысль («Стоп») и переключается на «красивую атаку». В версии 2 вопрос «А че по инструментам?» тоже остался без ответа («Хммм»).</p>\n<p><strong>Превращение воздуха во тьму (2026-06-02).</strong> Входило в версию 8, отменено в версии 9 и закреплено как отменённое в версии 10.</p>\n<p><strong>Дым от костра как отдельная сущность (2024-07-04).</strong> Слава несколько раз возвращается к дыму от костра («Какой дым от костра или от тьмы ?», «Почему 😠»), Миколай выводит его из обсуждения: «от костра поебать», «на дым вообще поебать / забудь о нём».</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S06", "SP-0071-S06", "SP-0071--svyaz-s-drugimi-sposobnostyami"], "h": "<p><strong>Солнце.</strong> Работают в паре в подводном острове: способность Солнца влияет на выделение кислорода обычными растениями, тьма этот кислород сосёт и фильтрует между дном и атмосферой (2024-07-04, id 196739–196740). Фотосинтез во тьме под водой возможен именно потому, что Солнце «энергией делиться» (id 196748). При этом трубы описаны как тьма «без солнца» (id 196875), хотя Слава возражает: «Там есть солнца» (id 196876) — противоречие в переписке не разрешено. Отдельно Солнце имеет собственную механику, выросшую из отклонённого предложения Миколая: «Солнце поглашаеть все положительных чувств ( не действует на сильных духом)».</p>\n<p><strong>Регенерация.</strong> Идёт в комплекте с тьмой у носителя с самого начала («И у него Реген», 2024-06-28). В 2026 году регенерация названа общей особенностью Нуара и апостолов и служит основой для другой его способности — управления кровью: «Может управлять собственное кровью, а из-за регенерация он может вырабатывать эту кровь дофига».</p>\n<p><strong>Плёнка сверхлюдей.</strong> Механика защиты от чужих способностей, введённая тем же сообщением, что и финальная условность по тьме (2026-06-02, id 487170).</p>\n<p><strong>Прочие способности Нуара</strong> — «Слова» и молния — названы в одном сообщении с тьмой (id 487010), но взаимодействие с тьмой не описано. Про «Слова»: «Он может отдавать приказы и люди повинуются. Не особо действительно против сильных противников. Да и он не может сказать убить себя или навредить себе, инстинкт самосохранения просто не даст этого сделать». Про молнию: «Ну здесь говорить особого не чево просто плюс разрушительный навык».</p>", "r": []}, {"t": "Связь с объектами", "a": ["S07", "SP-0071-S07", "SP-0071--svyaz-s-obektami"], "h": "<p>Тьма — несущая конструкция острова на дне океана. Трубы сферы сделаны из тьмы; сфера поглощает грязь, скатывает её в комки и выбрасывает в океан. Через тьму в трубах носитель контролирует проходящих. Также в карточке сущности среди связанного назван Оберег — в приведённых кусках переписки он не фигурирует, характер связи не описан.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "SP-0071-S08", "SP-0071--probely"], "h": "<div class=\"gaps\"><ul>\n<li><strong>Первая проработка не доведена до конца.</strong> Миколай прямо говорит: «Ну бля, я чет интересное хочу придумать / Но не выходит». Вопросы «Типо тьма / Че она делает / Как она делает» остались без ответа, Слава закрывает разговор словом «Потом» (2024-06-28).</li>\n<li><strong>Инструменты.</strong> Тема поднималась дважды («А че по инструментам?», «Он бафает себе инструменты») и оба раза не была решена. Ответ Славы — «Хммм».</li>\n<li><strong>Красивая атака.</strong> Запрос сформулирован («Ты хочешь красивую атаку» — «Ну да наверное»), но так и не выполнен.</li>\n<li><strong>Отношения двух носителей.</strong> Персонаж с раздвоением личности и Нуар в переписке не связаны и не разведены явно; переход способности от одного к другому не проговорён.</li>\n<li><strong>Солнце в трубах.</strong> «тьма / без солнца» против «Там есть солнца» — расхождение осталось нерешённым.</li>\n<li><strong>Плёнка сверхлюдей и тьма.</strong> Действует ли плёнка против превращения во тьму — в переписке не сказано; пример дан только для Графа.</li>\n<li><strong>Точный радиус.</strong> Дан приблизительно: «примерно 3 км». Радиус подводного барьера не назван вовсе.</li>\n<li><strong>Величина усиления и ослабления.</strong> Что способности внутри области у Нуара «мощнее», а у противников «слабее», сказано, но насколько — не сказано.</li>\n<li><strong>Вселенная версий 8–10.</strong> В карточке помечена как неясная. Для окна w0040 в неясностях отдельно отмечено: «Вселенная не названа».</li>\n<li><strong>Дополнительные особенности Нуара и апостолов</strong> Слава сознательно не раскрыл: «Ну ещё несколько особенностей которых я прям здесь не скажу».</li>\n<li><strong>Оберег.</strong> Числится связанным с тьмой, но в переписке по этой сущности не появляется.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0071--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0104.html\">Нуар</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0071--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-06-28</td>\n<td>190730–190824</td>\n<td>w0040</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-06-30</td>\n<td>191884–191893</td>\n<td>w0040</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-04</td>\n<td>196738–196748</td>\n<td>w0043</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-04</td>\n<td>196863–196900</td>\n<td>w0043</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-04</td>\n<td>196937–196952</td>\n<td>w0043</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-04</td>\n<td>196981–196989</td>\n<td>w0043</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-04</td>\n<td>197014–197035</td>\n<td>w0043</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-02</td>\n<td>487008–487010</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-02</td>\n<td>487049–487053</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-02</td>\n<td>487170–487172</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0071-tma.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0071--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0071.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["SP-0071-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/SP-0071/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>В статье прямо названы «прочие способности Нуара» — «Слова» и молния, упомянутые в одном сообщении с тьмой, но без разбора. Обе оказались отдельными сущностями в базе: «Слова» (<code>SP-0266</code>) и «Молния» (<code>SP-0267</code>), у каждой уже есть по одной ссылке и по 3–3,5 тысячи знаков материала, но статей нет ни у той, ни у другой. Это ближайшая по этой карточке дыра, которая тормозит не саму тьму, а понимание Нуара как носителя в целом — без этих двух статей он описан только на треть.</p>\n<h3>С чего начать</h3>\n<p>В архив можно не ходить — материал под обе способности уже собран: <code>SP-0266</code> («Слова», 3384 знака) и <code>SP-0267</code> («Молния», 3183 знака). Если понадобится более широкий контекст, обе впервые называются в одном и том же сообщении, что и финальная версия тьмы — 2026-06-02, окно w0120, id 487008–487010.</p>\n<h3>Как развивалось</h3>\n<p>Способность заявлена 28 июня 2024 (id 190730) как тень одной из личностей персонажа с раздвоением. За неделю обросла ограничениями — обязательное выделение, барьер, смертельный выход за него (окно w0043, начало июля 2024). После этого — почти двухлетний разрыв: следующее упоминание тьмы датировано только 2 июня 2026. Возвращение не тихое — Слава сам обозначает его как апгрейд: «Ну начнём с Нуара. Ведь я просто добавил пару способности и улучшил тьму».</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для Нуара как носителя тьмы цена и ограничения прописаны прямо: обязан выделять тьму, иначе умрёт; выход за барьер смертелен. Для первого носителя той же способности — персонажа с раздвоением личности — никакой аналогичной цены не названо: ему тьма досталась вместе с бонусом (регенерацией), а расплаты за неё в переписке нет вовсе.</p>\n<h3>Отклик</h3>\n<p>Сильнее всего подействовал сам разрыв в датах — способность, брошенная в июле 2024 на полуслове («Хммм» в ответ на вопрос про инструменты), спустя два года возвращается не с нуля, а с узнаваемой преемственностью: тот же вакуум, та же идея фильтрации, только теперь это уже не барьер вокруг трубы, а трёхкилометровая зона. Редко видно так наглядно, что что-то не забыто, а просто отложено.</p></div>", "r": []}];</script>
