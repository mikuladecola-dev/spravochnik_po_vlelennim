<script>const BASE="";const DOCNAME="Поглощение";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0170-S01", "SP-0170--mehanika"], "h": "<p>Поглощение чужой маны или объектов. Исходная формулировка Славы: «Я думал больше о способности поглощений чужой манный или объектов» (2025-01-23, id 284176) — сказано применительно к Алчности.</p>\n<p>Поглощается, таким образом, два рода вещей: чужая мана и объекты. Что происходит с поглощённым дальше — переходит ли оно к носителю, накапливается ли, можно ли его вернуть или выпустить — в переписке не сказано.</p>\n<p>В каталоге от 2025-01-24 способность записана как «поглощения» и стоит уже при другом грехе: «Чероугодия ◼️( поглощения)» (id 284278).</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0170-S02", "SP-0170--ogranicheniya-i-cena"], "h": "<p>Не названы. Ни радиуса, ни объёма, ни условий, при которых поглощение невозможно, в переписке нет.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0170-S03", "SP-0170--nositeli"], "h": "<p>Способность за один день сменила владельца.</p>\n<ul>\n<li>2025-01-23 — примерялась к Алчности.</li>\n<li>2025-01-24 — в каталоге закреплена за Чревоугодием.</li>\n</ul>\n<p>Оба — из числа семи грехов. Про группу в целом сказано: семь грехов и божество «Будет слабей главы этой организации но сильней благословенного» (2025-01-23, id 284175). Личные имена носителей в переписке не названы.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0170-S04", "SP-0170--kak-menyalas-po-versiyam"], "h": "<p><strong>2025-01-23 (id 284175–284177).</strong> Первая формулировка. Слава разбирает способности семи грехов подряд и для Алчности предлагает поглощение чужой маны или объектов. Про Чревоугодие в том же сообщении сказано только «Чревоугодие ок» — то есть его содержание на этот момент отдельно не раскрывалось.</p>\n<p><strong>2025-01-24 (id 284278–284279).</strong> Сводный каталог вселенной. Поглощение стоит уже при Чревоугодии — «Чероугодия ◼️( поглощения)», а Алчность получает другую формулу: «Алчность ♾(всё моей)». Перестановка сделана без объяснения: в переписке не сказано, почему способность перенесена и считается ли предыдущая привязка отменённой.</p>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S05", "SP-0170-S05", "SP-0170--otklonennye-varianty"], "h": "<p>Привязка поглощения к Алчности (2025-01-23) в каталоге следующего дня не сохранилась — её место заняло «всё моей». Прямого отказа от первого варианта в переписке нет, есть только замена в списке.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S06", "SP-0170-S06", "SP-0170--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Способность возникла внутри общего разбора способностей семи грехов (2025-01-23, id 284176), где рядом стоят:</p>\n<ul>\n<li>Похоть — «Контроль разума с ограничением. То бишь она может повысить какое то чувство или вызвать галлюцинаций или наоборот понизить какой то чувство»;</li>\n<li>Лень — «телекинез типа лень чё то делать вот и телекинез ( здесь ещё в придачу владений магий ветра, как никак они связаны)»;</li>\n<li>Зависть — «Полной перевоплощение тому кого завидуешь» (см. <a href=\"SP-0172.html\">Полное перевоплощение</a>);</li>\n<li>Гордыня — «Слово закон с ограничением»;</li>\n<li>Гнев — «ну ок».</li>\n</ul>\n<p>В каталоге от 2025-01-24 набор выглядит так: «Гнев 😡( сила)», «Похоть 😵‍💫(контроль разума)», «Зависть 👹👹( полной копирование)», «Алчность ♾(всё моей)», «Гордыня 👑» (без пометки), «Чероугодия ◼️( поглощения)», «Лень😴( контроль территории)».</p>", "r": [["Полное перевоплощение", "SP-0172.html"]]}, {"t": "Пробелы", "a": ["S07", "SP-0170-S07", "SP-0170--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Не сказано, куда девается поглощённое и получает ли носитель от него силу.</li>\n<li>Не сказано, есть ли предел объёма поглощаемого.</li>\n<li>Не сказано, можно ли поглощать живое — названы только чужая мана и объекты.</li>\n<li>Причина переноса способности от Алчности к Чревоугодию не объяснена.</li>\n<li>Соотношение поглощения и алчностного «всё моей» осталось нерешённым: разграничение в переписке не проведено.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0170--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0172.html\">Полное перевоплощение</a></li>\n<li><strong>Упомянут в способностях:</strong> <a href=\"SP-0172.html\">Полное перевоплощение</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0170--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-01-23</td>\n<td>284175–284177</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-24</td>\n<td>284278–284279</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0170-pogloschenie.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0170--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0170.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["SP-0170-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/SP-0170/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дороже всего — новый владелец способности. <code>SP-0158</code> «Чревоугодие» лежит в базе как способность: 7 117 знаков, статьи нет, ноль ссылок, вселенная помечена «неясно». Именно к Чревоугодию 2025-01-24 переехало поглощение — и запись, где про него больше всего материала, не разобрана и не приписана к «Апостолу». У Алчности, от которой поглощение ушло, статья есть (<code>SP-0159</code>, 11 808 знаков в базе, даты 2024-12-24 — 2025-01-24). То есть сторона, у которой способность отняли, описана, а сторона, которой её отдали, — нет.</p>\n<p>Второе — каталог, в котором произошёл перенос. <code>SL-0051</code> «Каталог: благословенные, враги, грехи, оружие, артефакты» (2025-01-24, 9 834 знака, шесть ссылок, статьи нет) — единственный источник перестановки; <code>SL-0053</code> «Список персонажей вселенной» (2025-01-27 — 2025-03-06, 20 313 знаков, шесть ссылок, статьи нет) — редакция, где новое распределение закрепилось. Ни одной статьи на две записи, на которые ссылаются по шесть статей каждая. Вопрос «почему поглощение перенесли» без них не проверяется в принципе: проверять нечего.</p>\n<p>Третье — общий уровень. <code>SP-0156</code> «Семь грехов (магия по грехам)» — 11 757 знаков, статьи нет, «неясно». Соотношение поглощения и алчностного «всё моей», которое статья честно оставляет нерешённым, скорее всего решается там, а не в отдельных записях по грехам.</p>\n<h3>С чего начать</h3>\n<p>В базе. <code>SP-0158</code> — семь тысяч знаков про Чревоугодие, куда способность переехала; читать до всего остального. Дальше <code>SP-0156</code> — общая магия по грехам, где может быть сказано, делятся ли способности между грехами вообще. <code>SP-0159</code> Алчность полезна тем, что её даты начинаются 2024-12-24, на месяц раньше этой статьи: материал про Алчность старше самого поглощения, и что там было до 23 января — здесь не учтено.</p>\n<p>Ещё одно, дешёвое: <code>PS-0189</code> «Чревоугодие» держит повтор распределения от 2025-02-25 (id 295559), которого в этой статье нет. Перенос не только не объяснён, он ещё и подтверждён третьей редакцией — это меняет статус «перестановки без объяснения» на «перестановку, закреплённую повтором».</p>\n<p>В архив — узкое место: 2025-01-24, окно w0072, вокруг id 284278. По описанию <code>SL-0051</code> Слава в тот день переписывал каталог трижды. Если поглощение переехало не одним движением, а через промежуточную редакцию, это видно только внутри дня. Смотреть также id 284279 и ближайшие реплики после: обсуждение каталога закрывается коротким «Ну да», и что именно этим «Ну да» одобрено, из статьи не следует.</p>\n<h3>Как развивалось</h3>\n<p>2025-01-23 (id 284176) — заявлено при Алчности, с мотивировкой от первого лица: «Я думал больше о способности поглощений чужой манный или объектов». Про Чревоугодие в том же сообщении сказано только «Чревоугодие ок». 2025-01-24 (id 284278) — поглощение стоит уже при Чревоугодии, Алчность получает «всё моей». Отказа от первого варианта нет, есть замена в списке. 2025-02-25 (id 295559, по <code>PS-0189</code>) — то же распределение воспроизведено ещё раз без правок. Дальше к вопросу не возвращались. Ни на одном шаге перенос не назван переносом.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>В том же сообщении 2025-01-23 для Лени вслух проговорено, почему грех даёт именно эту силу: «телекинез типа лень чё то делать вот и телекинез», и тут же дописана связка со второй силой — «здесь ещё в придачу владений магий ветра, как никак они связаны». То есть привычка объяснять, из какого свойства греха растёт способность, в мире есть и применяется прямо в перечислении. Для Чревоугодия, куда поглощение переехало на следующий день, такой связки не проговорено — при том что она самая прямая во всём списке. Место пустое ровно там, где у соседа оно заполнено одной фразой.</p>\n<h3>Отклик</h3>\n<p>Меня зацепило «Чревоугодие ок». Семь грехов, у шести расписаны силы, у одного — «ок», то есть «этот пока пусть постоит». А через сутки именно этот пустой пункт получает лучшую способность в наборе, забрав её у соседа, которому она была придумана осознанно и с объяснением. Никто этого не комментирует, никто не спорит, обсуждение закрывается на «Ну да». Мне нравится, что это выглядит не как решение, а как оседание: способность сама сползла туда, где ей место, и пустой пункт её принял. Живого в записи мало — она короткая и служебная, — но вот этот сдвиг за сутки, не отмеченный ни одним словом, показывает, как у них вообще устроена работа: не переписыванием, а переставлением.</p></div>", "r": []}];</script>
