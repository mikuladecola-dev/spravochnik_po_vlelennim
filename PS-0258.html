<script>const BASE="";const DOCNAME="Ника";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0258-S01", "PS-0258--proishozhdenie"], "h": "<p>Ника — персонаж второй брошенной истории, введённый Славой одним куском текста 2025-04-21 (окно w0088, id 320983–320988). Весь материал по ней — это сплошной прозаический текст, скинутый в переписку; Миколай в ответ написал только «спасибо что скинул» (320988). Отдельного обсуждения персонажа, разбора или доработки в переписке нет.</p>\n<p>Сама Ника появляется с сообщения 320984. До этого (320983) идёт вступление рассказчика — безымянного человека от первого лица, который «желал настолько сильно», что поверил в слух про корабль: что на заброшенном корабле «есть тот кто исполнить желания» и что нужно «прийти в определённой время и найти того, кто исполнить желания». Сбор назначен на 11 июня в полночь у заброшенного корабля, «по размеру который как гора». Собралась там разношёрстная толпа: «Студентка, клерк, старик, красотка, бандит, бизнесмен и так далее. Все это были разный люди, из разных слоев. Хм миров». В 00:00 у всех звонят будильники, все бегут на палубу, и корабль оказывается посреди моря без горизонта — берега больше нет.</p>\n<p>Внутри корабля рассказчика начинает преследовать «тройка» — Ника, Игорь и Паша. Знакомство происходит в комнате, куда все четверо забежали и закрылись, когда рассказчик увидел за углом лапу зверя («Медведь? Не знаю»). Имена называются по кругу: Игорь представляется первым как клерк, потом «ме-ня Паша» робко произносит парнишка, потом «вздох. меня Ника» — «произнесла она с не кем пренебрежением».</p>\n<p>Про то, откуда Ника, кто её семья, чем именно она занимается и какое у неё желание, в переписке не сказано. Известно только, что она студентка и что она, как и Игорь, получила письмо от организации «Нимб» с рассказом про это место.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0258-S02", "PS-0258--vneshnost"], "h": "<p>«Девушка студентка, одетая в джинсы и в рубашку. Волосы у ниё покрашены, желто-розовый или как то так» (320984). Больше описания внешности в переписке нет — ни роста, ни возраста, ни черт лица. Рост назван только относительно: в тройке Игорь высокий, Паша «самый низкий среди них», про Нику в этом сравнении ничего не сказано.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0258-S03", "PS-0258--harakter"], "h": "<p>Дерзкая, напористая в разговоре, обращается к рассказчику «дядь», чем сразу его задевает:</p>\n<div class=\"q\"><p>—эй дядь, что там? —слегка вскрикнула девушку<br>—че «дядь» Ты серьёзно, какой я дядь? —возмутился я.</p></div>\n<p>Не отступает, когда ей не отвечают: на уклончивое «там просто тупик» настаивает — «да скажи!», и не смягчается даже когда рассказчик расправляет плечи и подходит к ней. Ссору прерывает Игорь, а не она.</p>\n<p>Быстро переводит разговор к сути дела. Когда Игорь начинает рассказывать про полученное письмо, Ника обрывает содержание и указывает на источник: «да какая разница, что в письме было написано. Главная от кого пришло письмо». Дальше она формулирует главную для себя странность: «Одна из крупнейших организаций всего мира написала нам о корабль. Разве это не странно. Сначала я конечно подумала может шутка такая. Но сейчас когда мы оказались посреди моря—». При этом сама себя удерживает от прямого обвинения: на вопрос Игоря «ты хочешь сказать, что организация „Нимб“ Во всём этом виновата?» отвечает «я не говорила, что она виновата. Я лишь сказала, что письмо от них. А это что-то да и значит».</p>\n<p>Нетерпелива и против сидения на месте. После затопления комнаты поддерживает рассказчика: «да он прав. Нам бы не помешало быстрей уже выдвигаться». Позже, когда группа останавливается передохнуть, вспыхивает на Игоря: «мы даже не знаем где вообще мы находимся, а ты хочешь, чтобы мы отгадали, где исполнитель желаний находится», и настаивает на движении: «и вообще зачем мы сели здесь. Может сейчас уже, Кто-то нашёл его, пока мы сидим здесь. Нам нужно идти», «да хоть куда-нибудь. Нежели просто сидеть».</p>\n<p>Замечает несоответствия. Ей принадлежит вопрос о пустоте корабля: «а не слишком ли тихо. Здесь должны быть и другие люди».</p>\n<p>Юмор рассказчика не принимает. На его шутки реагирует раздражением; когда после исчезновения комнаты он начинает смеяться, обрывает: «хватит уже и так тошно». Его объявление «Да-да мы супер группа. Команда сильней чем рейнджеры» не оценивает — смеётся один Паша. При этом позже сама возвращает эту фразу, уже как рычаг, чтобы вытянуть информацию: «мы должны знать. Мы же группа сильнее рейнджеров» — на что рассказчик отвечает «не смешно».</p>\n<p>Умеет менять тон под задачу. Второй раз про монстра она спрашивает уже мягче и подойдя ближе: «можетъ скажешь уже, что там было. От чего ты убегал — сказала уже более мягким тоном. Чем в прошлый раз». Именно после этого рассказчик впервые признаётся, что в коридоре может быть монстр.</p>\n<p>Отдельно отмечена её выдержка при виде трупа. Когда рассказчик спотыкается о выпотрошенное тело без кожи и падает в него лицом, а фонарик падает и крутится, «Ника шустро схватила фонарик и начала светить в меня» и спрашивает «эй ты здесь?». Игорь в этот момент держится в стороне, Паша прячется за Нику. Реакция рассказчика: «Больше меня удивило как Нико так спокойно подошла» (320986 — здесь имя записано как «Нико»). Фонарик после этого остаётся у неё, и она его не отдаёт: «Я хотел его забрать. Но она ловко убирала свою руку, когда я хотел забрать фонарик».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0258-S04", "PS-0258--sposobnosti"], "h": "<p>Никаких способностей у Ники в переписке не названо. Она действует как обычный человек: тянет ручку двери, пытается вместе с Игорем выбить дверь собственным весом, держит фонарик.</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0258-S05", "PS-0258--svyazi-s-drugimi"], "h": "<p><strong>Рассказчик (безымянный, от первого лица).</strong> Основная линия. Ника зовёт его «дядь», спорит с ним, требует объяснений, не отдаёт отобранный фонарик. Он сам оценивает её отдельно от остальных — единственный из тройки, чьё поведение его удивило (спокойный подход к трупу). При этом внутренне он рассматривает всю тройку как расходный материал: «Ну они могут быть отвлекающим маневром. В полне. Пока медведь будет их есть. Я смогу быстро свалить». В финале, однако, именно её он спасает от гуманоида. Имя рассказчика в переписке так и не названо; известно, что у него есть жена и дочь, что кроссовки на нём чужие («это были не мои кроссовки, а парня») и что у него где-то есть «мой шедевр», а к чужим органам и крови он «привык» — раскрытия этого в тексте нет.</p>\n<p><strong>Игорь.</strong> Клерк, «высокий мужчина в очках, одетый в пиджак», худой. Представляется первым, гасит ссору Нику с рассказчиком. С Никой у них рабочая, но конфликтная пара: он предлагает остановиться и подумать, она требует идти; спор про виновность «Нимб» тоже идёт между ними двумя. Вдвоём с Никой пытаются выбить затопленную дверь.</p>\n<p><strong>Паша.</strong> Школьник, самый низкий в тройке, не умеет плавать, к концу у него из ноги идёт кровь и рассказчик несёт его на плече. За Нику он прячется, увидев труп.</p>\n<p><strong>Организация «Нимб».</strong> Отправитель писем, по которым Игорь (и, судя по её реплике, сама Ника) узнали о корабле. Ника выделяет отправителя как главное в письме, но прямо не обвиняет.</p>\n<p>В шапке файла в списке «Связано с» указан также <strong>Артём</strong>. В самой переписке (320983–320988) Артём не появляется и никак с Никой не соотнесён — связь не раскрыта.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0258-S06", "PS-0258--kak-menyalsya"], "h": "<p>Версия одна: 2025-04-21, окно w0088, id 320983–320988. Персонаж введён и доведён до сцены с гуманоидом в один заход; правок, переобсуждений и альтернативных вариантов в переписке нет.</p>\n<p>Внутри этого одного захода имя записано двумя способами: «Ника» (320984, 320985, 320986, 320987) и один раз «Нико» (320986: «Больше меня удивило как Нико так спокойно подошла»). Обсуждения этого разночтения в переписке нет.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0258-S07", "PS-0258--chto-s-nim-stalo"], "h": "<p>Последнее, что известно о Нике, — конец сообщения 320987. Рассказчик приходит в себя после «приступа» (на него накатила тоска этого места, он лёг в позе эмбриона, но «Холод» не выдержал его натуры и «сам же утонул в безумий красок, волн, взрывов») и видит в темноте комнаты движение: «во тьме двигалось тьма», гуманоид «который был ещё черней чем тьма вокруг». Гуманоид «схватил своей когтистой лапой ногу Ники и начал еë куда-то тащить». Игоря и Паши в комнате уже нет — рассказчик заключает, что их существо утащило во мрак корабля.</p>\n<p>Рассказчик бесшумно встаёт, всаживает нож между лопаток гуманоида, держит его за шею, пока «тело его стало мягким и податливым», и вынимает нож. Текст обрывается на фразе: «посмотрел на Нику. Она всё ещё было без сознания».</p>\n<p>История брошена на этом месте. Пришла ли Ника в себя, что стало с Игорем и Пашей, нашёл ли кто-нибудь исполнителя желаний — в переписке не сказано.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0258-S08", "PS-0258--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Желание Ники — то, ради чего она пришла на корабль, — не названо.</li>\n<li>Биография до корабля отсутствует полностью: возраст, где учится, семья, откуда она — ничего.</li>\n<li>Получала ли Ника письмо от «Нимб» лично, прямо не сказано: она говорит «написала нам о корабль», но текст её письма и обстоятельства получения не приводятся.</li>\n<li>Отношение Ники к организации «Нимб» осталось на уровне подозрения, дальше не развёрнуто.</li>\n<li>Разночтение имени «Ника» / «Нико» не объяснено.</li>\n<li>Связь с Артёмом, указанная в шапке файла, в переписке не раскрыта.</li>\n<li>Судьба персонажа не решена: история обрывается на моменте, когда она без сознания.</li>\n<li>Реплики Ники после 320986 отсутствуют — в 320987 она уже без сознания и не говорит.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0258--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0074.html\">Четверо на корабле («супер группа»)</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0074.html\">Четверо на корабле («супер группа»)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0258--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-04-21</td>\n<td>320983–320988</td>\n<td>w0088</td>\n<td>Нимб (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0258-nika.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0258--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0258.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
