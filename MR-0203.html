<script>const BASE="";const DOCNAME="Инквизиторы";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0203-S01", "MR-0203--ustroystvo"], "h": "<p>Инквизиторы — отряды, охотящиеся на сверхлюдей (2026-06-03 — 2026-06-09, id 487531–488828). Действуют группой: в описанной сцене на цель выходит именно «отряд инквизиторов», а не одиночка.</p>\n<p>Инквизиторы владеют оам — в сцене боя они пытаются его использовать, и то, что оам не срабатывает, подано как исключительная ситуация, а не как их обычное состояние. Отдельно оговорён инквизитор «с чистой Оам»: «кстати в этой сети как раз таки состоит инквизитор с чистой Оам» (2026-06-03, id 487531). Что такое чистая Оам и чем она отличается от обычной, в переписке не сказано.</p>\n<p>Боевые приёмы отряда, показанные в сцене с Нуаром (2026-06-09, id 488828): атака на ослабленную и не успевшую восстановиться цель, ослепление, лишение зрения и чувств — «по итогу его ослепляют, лишают зрения и чувство, он в полной тьме».</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0203-S02", "MR-0203--naselenie"], "h": "<p>Отдельные инквизиторы по именам не названы. Названы две роли:</p>\n<ul>\n<li>инквизитор с чистой Оам, состоящий в секте Фалим — глава этой секты Фатик, секта поклоняется ей «как богини в человеческом виде» (2026-06-03, id 487531);</li>\n<li>безымянный инквизитор из отряда, атаковавшего Нуара, — тот, кто в сцене услышал звук, побежал на него и увидел происходящее.</li>\n</ul>\n<p>Численность отряда не названа. Итог сцены зафиксирован скобкой: «(Всё инквизиторы были убиты.)»</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0203-S03", "MR-0203--mesto-vo-vselennoy"], "h": "<p>Инквизиторы стоят по отношению к сверхлюдям как охотники: их функция — охота на сверхлюдей. При этом состав пересекается с сектой Фалим, которая относится к стороне злодеев через свою главу Фатик — одну из столпов злодеев. Пересечение названо прямо, но никак не объяснено: не сказано, служит ли инквизитор в секте тайно, знает ли о нём его собственный отряд, знает ли инквизиция о секте.</p>\n<p>Второе пересечение — с Нуаром, первым искусственным сверхчеловеком (<a href=\"MR-0195.html\">Искусственные сверхлюди (ИС)</a>). Отряд инквизиторов выходит на него сразу после его боя с Фатикой, когда он потратил оам «больше чем когда либа».</p>", "r": [["Искусственные сверхлюди (ИС)", "MR-0195.html"]]}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0203-S04", "MR-0203--kak-menyalsya-po-versiyam"], "h": "<p>Версия 1 — 2026-06-03 (id 487531–487532). Инквизиторы упомянуты одной строкой, внутри описания Фатик и её секты: в секте Фалим состоит инквизитор с чистой Оам. Здесь же задан контекст: святой девы «больше нет как персонаж вообще», вместо неё одним из столпов злодеев становится Фатик, желтоволосая девчушка со способностью управления фотонами, и она же — глава секты, которой дано название Фалим («давай назовём данную секту Фалим»).</p>\n<p>Версия 2 — 2026-06-09 (id 488828). Развёрнутая сцена. После битвы с Фатикой Нуар побеждает, но не убивает: «Оставляет её в живых и уходит». Уставший и потративший много оам, он уходит с места битвы в раздумьях, и, не успев далеко отойти, попадает под атаку отряда инквизиторов. Ослабленный Нуар пытается отбиваться, но его ослепляют и лишают чувств — он оказывается в полной тьме. Дальше к нему приходит озарение, и он использует тьму.</p>\n<p>Область тьмы в этой сцене маленькая по сравнению с тем, какой он делал её раньше. Внутри неё: «люди попав в эту тьму не видели света, не слышали звуков, они не были даже уверены стоят ли они или лежат, и идут». Оам внутри тьмы не работает — «Пытаюсь использовать оам, он просто чём-то поглащался».</p>\n<p>Дальнейший ход сцены: один из инквизиторов наконец услышал звук и, не поняв, что это, «с облегчением побежал на звук звук чавканья, липкий звук хруста». Прибежав, он видит: «Слепой существо жадно поедает его товарища». Он пытается использовать оам — не получается, «что-то его поглощает». Инквизитор начинает потихоньку отступать, не дыша, боясь издать малейший звук, но «голова во вся крови повернула голову в его сторону и смотрит слепыми глазами».</p>\n<p>Итог сцены и мотивировка Нуара даны скобками: «(Всё инквизиторы были убиты.) ( почему нуар так поступил, он испугался впервые за долгое время он ощутил страх смерти и его знания помутнилась)».</p>\n<p>Между версиями инквизиторы из упоминания-детали превращаются в действующую сторону сцены; их устройство при этом не переописывается, добавляется только то, что видно в бою.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0203-S05", "MR-0203--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Структура инквизиции не описана: кому подчиняется, кто отдаёт приказы, сколько отрядов, как выглядит набор.</li>\n<li>Численность отряда, атаковавшего Нуара, не названа.</li>\n<li>Ни один инквизитор не назван по имени, включая того, что состоит в секте Фалим.</li>\n<li>Что такое «чистая Оам» и чем она отличается от обычной — не объяснено.</li>\n<li>Не сказано, связан ли инквизитор из секты Фалим с погибшим отрядом.</li>\n<li>Не сказано, как инквизиторы вышли на Нуара сразу после боя с Фатикой — совпадение, слежка или наводка; в переписке не сказано.</li>\n<li>Не сказано, что стало с инквизицией после гибели отряда и известно ли ей вообще, что произошло.</li>\n<li>Принадлежность к вселенной помечена как «неясно» — привязка сделана по дате объявления.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0203--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0195.html\">Искусственные сверхлюди (ИС)</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0104.html\">Нуар</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0203--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-06-03</td>\n<td>487531–487532</td>\n<td>w0121</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-09</td>\n<td>488828–488828</td>\n<td>w0121</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0203-inkvizitory.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0203--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0203.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
