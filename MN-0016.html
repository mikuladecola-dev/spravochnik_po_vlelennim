<script>const BASE="";const DOCNAME="Деревня Лихой";
const LEAD="";
const CH=[{"t": "Где находится — в каком мире и в каком его месте", "a": ["S01", "MN-0016-S01", "MN-0016--gde-nahoditsya"], "h": "<p>Деревня Лихой относится к вселенной «Апостол». Материал по ней укладывается в один день — 2025-03-13, окно w0080, сообщения 301805–301846.</p>\n<p>Страна названа прямо и в ответ на прямой вопрос. Миколай спросил (2025-03-13 14:04, id 301840): «деревня лихой в России? или в Германии?» Слава ответил (2025-03-13 14:23, id 301846): «В Росси». Более точной привязки — область, расстояние до города, соседние населённые пункты — в переписке нет.</p>\n<p>Единственная характеристика расположения, данная внутри сцены, — труднонаходимость. Старик говорит про Лихой: «я сам еë ели ели нашёл, если бы не учитель, вообще не знал бы о такой» (id 301805). То есть деревня не то чтобы спрятана механикой, но о ней не знают: знание о её существовании передаётся от учителя к ученику по линии арбетаров.</p>\n<p>Отдельно в той же карточке проходит <strong>деревня Ливия</strong> — второе, другое место, названное в том же монологе. Про неё сказано: «Нет, этот дом не в деревне Лихой, а в деревне Ливия, ближе Санкт-Петербург» (id 301805, повтор в id 301821). Ливия и Лихой — разные деревни, и в тексте они разводятся специально, именно репликой «нет, этот дом не в деревне Лихой». В базе они сведены в одну запись как варианты имени, но по переписке это два разных места: Лихой — где происходит действие настоящего времени, Ливия — родная деревня старика, ближе к Санкт-Петербургу.</p>", "r": []}, {"t": "Что собой представляет", "a": ["S02", "MN-0016-S02", "MN-0016--chto-soboy-predstavlyaet"], "h": "<p>О самой деревне Лихой в переписке сказано мало и почти всё — через реплики старика и через то, что видит и слышит связанный герой.</p>\n<p>Деревня глухая, малоизвестная. Старик называет её так, будто это должно что-то значить для собеседника: «мы! Мы то в деревне Лихой, знаешь такую?» — и произносит это «радостно словно ребёнок» (id 301805). Герой отвечает, что не знает, и старик находит это естественным, поскольку сам нашёл её еле-еле и только благодаря учителю.</p>\n<p>Из физической обстановки в тексте есть одна деталь: пол помещения, куда героя вытряхивают из ящика, — деревянный («меня словно пса оттуда выкинули на деревьяный пол», id 301805). Ни размеров деревни, ни числа жителей, ни того, живёт ли там кто-то вообще помимо участников обряда, в переписке нет.</p>\n<p>В навигационной сводке базы записано, что обряд проводится «в её центре». В самих процитированных сообщениях места обряда внутри деревни не уточнено — сказано только, что герой находится в деревне Лихой и что он материал для обряда.</p>", "r": []}, {"t": "Что с ним связано — предметы, механики, силы", "a": ["S03", "MN-0016-S03", "MN-0016--chto-s-nim-svyazano"], "h": "<p>Деревня Лихой связана с одним — с <strong>ритуалом становления Арбетаром</strong>. Всё, что о ней говорится, говорится в момент подготовки этого обряда и в объяснение того, зачем героя сюда привезли.</p>\n<p>Про ритуал в этом окне сказано следующее.</p>\n<p>Материалы обряда старик перечисляет сам: «И начал этот уже мужчина готовится к ритуалу, собирать материал. И один из этих материалов ты, и пару чужемирцов, и ещё один благословенный и самая сложная альфа» (id 301821). То есть набор — проводник (герой), несколько чужемирцев, благословенный и альфа.</p>\n<p>Порядок сложности добычи материала он тоже проговаривает. Благословенного убить было легко: «вся их сила, и не их вообще. Жалкий благословенный получивший силу лишь потому что понравились правителем, но сами они эту силу не добывали. Лишь мелкий пизжоны». И отдельно — что «благословенный не могут использовать благословенния долга, поэтому можно просто неожидано напасть и убить и всё». Чужемирцев убить было сложнее, но, по его словам, «это так цветочки».</p>\n<p>Самым сложным был альфа. Причина названа прямо: «у альфа и арбетатов похожий силый. Они как и мы может использовать свою силу 24/7 без риска повредить мозг. А если сила всегда активна и его защищает, то просто неожиданная атака, на нём не проканает». Отсюда его способ: «пришлось ждать пока какой-нибудь апостол упустить альфю. При этом доведя его до полусмерти. И это было долго». Про апостолов при этом сказано с раздражением и признанием одновременно: «как бы я ненавидел апостолов. Но не могу не признать, что свою работу они выполняють слишком идеально. Ну даже в идеальной системе есть единичные пробои. И вот так я получил тела альфа».</p>\n<p>Роль героя в обряде — проводник. Требование к проводнику: «В моём обряде нужен проводник. С чистой душой. Ну конечно не прям 100% чистой душой, а где-то на 80% плюс минус» (id 301821). Обычная практика арбетаров при этом другая: «Для этого всё арбетаты чаще всего используют детей лет от 3 до 12, где-то». Герой подходит лучше детей, и объяснение дано механическое: «ты человек с 89% чистой душой подходишь лучше чем дети. Как никак через тело и душу ребёнка проходить мало силы, а вот через тебя. Со взрослым телом и крепкой душой пройдёт куда больше силы. Я наверное буду сильнейшем арбетатом в этом поколения, если используя тебя».</p>\n<p>Само слово «Арбетар» расшифровано тут же: «Арбетар(швецский; на русском трудяга)» (id 301805).</p>", "r": []}, {"t": "Персонажи и события — кто с ним связан и что там происходило", "a": ["S04", "MN-0016-S04", "MN-0016--personazhi-i-sobytiya"], "h": "<p><strong>Как герой туда попал.</strong> Сцене предшествует другая: герой и его альтер-эго обсуждают, чем ударить по элитному ресторану — базукой, ракетой, «вообще можно ядерку», — сходятся на машине, берут займы и кредиты, чтобы «пожрем нормально перед смертью», и «Фургон в 3 часа ночи въехал в один из элитных ресторанов......» (id 301820). Дальше герой приходит в себя уже в ящике.</p>\n<p><strong>Пробуждение в ящике.</strong> Герой очнулся связанным в тесном железном ящике, в темноте, руки за спиной, лёжа на спине, ноги привязаны: «лежу в ней как селёдка в консейрве». У него начинается клаустрофобия и паника, он бьётся головой о железную стенку, теряет ориентацию — «Я потерялся в пространстве и не понимал где вверх? Где вниз? Где права? Где лева?». Его выпускают, выбрасывают на деревянный пол, он продолжает кричать и биться, и приходит в себя только когда «на меня вылили на голову ведро холодной воды» (id 301805).</p>\n<p><strong>Старик.</strong> Первым делом спрашивает: «Пацан с тобой всё в порядке?» — и объясняет беспокойство: «а то я испугался, что какая болезнь у тебя». Герой отмечает его вид: «я заметил как сука элеганский он одет. С бородкой как у бизнесменов, с чёрными волосами, одет в смокинг» (id 301805).</p>\n<p>Старик сам предлагает рассказать всё: «я скажу тебе почему, как и зачем ты здесь, всё же для меня ты сделаешь невероятную услугу» — и выбирает начать с начала: «а давай сначала, как мы пришли к настоящему?»</p>\n<p><strong>Альтер-эго.</strong> В деревне альтер-эго героя ведёт себя иначе, чем обычно. В начале сцены герой пугается — «а где альтро-эго?». Оно отзывается позже и объясняет: «я всё же позднее тебя проснулся, только сейчас», на что герой удивляется: «Разве ты не должен просыпаться со мной в одно время?» Дальше оно велит слушать и тянуть время: «Без разницы просто слушай. Потяни время. Ты же давно с людьми не говорил», а во время рассказа про альфу молчит, и герой это отмечает: «Иногда его хер заткнешь, а сейчас молчит» (id 301805, 301821).</p>\n<p><strong>Рассказанная в Лихой история старика.</strong> Весь его монолог — биография, привязанная к деревне Ливия.</p>\n<p>Жил мальчик с отцом-пьяницей и слабохарактерной матерью: «жил он плох, его били, некормили, ругали, а мать выплескивала на нём эмоций от побоев отца». Уйти мать не могла из-за слабохарактерности, «да и некуда ей была. Единственное, что было это дом в деревне и ни-че-го более». Дом этот — в Ливии, не в Лихой.</p>\n<p>Дальше — уничтожение Ливии: «В деревню решил заглянуть Арбетар(швецский; на русском трудяга). И начал Арбетар там всё крушить и поглащать жизнь человеческий и начал он из них делать чудищь словно из картины шизофриника» (id 301805). Формулировка про случившееся дана так: «Не случилось счастье для мальчика, но не счастья для жителей деревни».</p>\n<p>Арбетар увидел мальчика, который «отбиваться пытался, но плохо выходила», «увидил он в его глазах желания жить» — и взял в ученики. Мотив назван: «Ведь он стар, хоть души людей и питательные, но на них вечность прожить не выйдет» (id 301821).</p>\n<p>Ученичество описано перечнем: «Принести то, убить того, сожрать это, защитить того, провести ритуал. И так далее. И жил он так 50 годков. И перестал он быть ребёнком, а его учитель был таким же, но слегка лишь поседев». Только после этого «учитель рассказал ему про способ стать Арбетаром. И кинул его в свободное плавание».</p>\n<p><strong>Реакция героя.</strong> На слово «материал» он кричит: «Почему я материал? А?» — и получает выговор: «перебиват плохо, тем более старших». Позже пытается отговориться тем, что не подходит по чистоте души: «эй нет, ты кажись попутал, я не без грешник. и за мной есть грехи. Да сука я почти что суицидник. Я калечил людей. Я пил. Я курю. Я вообще говножуй. Я явно не тот кого ты ищешь. Ты ошибся. С каждым бывает, поэтому давай на этом закончим» — с пояснением про себя: «Не хочу быть жертвоприношением для чего-то» (id 301821).</p>\n<p>Старик отвечает, что проверял: «Я порылся в твой биографии. И нашёл много интересных деталей. Во-первых ты одиночка у тебя нет родных, не друзей, тебя воспитала бабушка. Ты не закончил колледж из-за, инцидента. Ну как инцидента ты избил одного избалованного паренька, который пытался затащить в кровать девочку, которая явно этого не хотела. После ты работал в ресторанах, курьером» (id 301821). На этом процитированный фрагмент обрывается.</p>\n<p>Параллельно герой и альтер-эго обсуждают побег. Альтер-эго на вопрос «И че придумал? что-нибудь?» отвечает: «Не совсем, но сделал пару заготовок. Как? Потом узнаешь сейчас главное выбраться» (id 301821).</p>", "r": []}, {"t": "Как менялся по версиям — по датам", "a": ["S05", "MN-0016-S05", "MN-0016--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-03-13, окно w0080, id 301805.</strong> Первое появление обеих деревень. Лихой названа как место действия, Ливия — как родная деревня мальчика, ближе к Санкт-Петербургу, уничтоженная Арбетаром. Фрагмент обрывается на моменте, когда Арбетар решает сделать мальчика учеником.</p>\n<p><strong>Версия 2 — 2025-03-13, окно w0080, id 301820–301821.</strong> Тот же текст выложен полностью и с продолжением. Начало сцены дополнено эпизодом с фургоном и рестораном (id 301820). В продолжении (id 301821) раскрыты: 50 лет ученичества, способ стать Арбетаром, список материалов для ритуала, объяснения про благословенных, чужемирцев и альфу, требование к проводнику и 89% чистой души героя, а также справка старика о биографии героя. Сама деревня Лихой при этом не переописывается — новых деталей о месте не добавлено.</p>\n<p><strong>Версия 3 — 2025-03-13, окно w0080, id 301840–301846.</strong> Уточнение географии. Миколай задаёт серию вопросов по тексту: про страну (id 301840), про то, что для Славы значит альтер-эго и как он это понимает (id 301841), «че значит чистая душа» (id 301842), «тут типа раздельный разум, ну как минимум это есть?» (id 301844), «о, если это отсылка то прикольно» (id 301845). В пределах этого окна отвечено только на первый: «В Росси» (id 301846).</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "MN-0016-S06", "MN-0016--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Ответы на вопросы Миколая от 2025-03-13 (id 301841–301845) — про альтер-эго, про чистую душу, про раздельный разум — в этом окне не даны. Отвечено только про страну.</li>\n<li>Как выглядит деревня Лихой, сколько в ней жителей, есть ли там кто-то, кроме участников обряда, — не сказано.</li>\n<li>Место обряда внутри деревни: в навигационной сводке базы стоит «в её центре», но в процитированных сообщениях это не подтверждено.</li>\n<li>Почему обряд проводится именно в Лихой, а не в любом другом месте, — в переписке не сказано. Единственное, что связывает деревню с обрядом, — то, что старик её нашёл через учителя.</li>\n<li>Точное расположение Лихой в России не названо. Про Ливию сказано только «ближе Санкт-Петербург».</li>\n<li>Что стало с Ливией после разрушения — стоит ли она, осталось ли что-то от жителей, превращённых «в чудищь» — не сказано.</li>\n<li>Как соотносятся два арбетара (учитель и ученик, ставший стариком) с самим разрушением Ливии — учитель и разрушитель Ливии по тексту одно лицо, но отдельно это нигде не оговорено.</li>\n<li>Соотношение имён «деревня Лихой» и «деревня Ливия» в базе оформлено как варианты одного имени; в переписке это два разных места.</li>\n<li>Чем закончилось происходящее в Лихой — обряд состоялся, сорвался, герой выбрался — в пределах окна не показано.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["MN-0016--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-03-13</td>\n<td>301805–301805</td>\n<td>w0080</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-13</td>\n<td>301820–301821</td>\n<td>w0080</td>\n<td>Апостол (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2025-03-13</td>\n<td>301840–301846</td>\n<td>w0080</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/monumenty/MN-0016-derevnya-lihoy.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MN-0016--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MN-0016.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
