<script>const BASE="";const DOCNAME="Дерзкий друг гг";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0129-S01", "PS-0129--proishozhdenie"], "h": "<p>Материал относится к периоду, объявленному 2024-07-31 (id 214143); имени в переписке этой вселенной не дали.</p>\n<p>Персонаж введён 2024-07-31 (id 214383–214384) взамен роли «бомж» (<a href=\"PS-0128.html\">Бомж</a>) в составе команды из пяти человек: «Вместо бомжа. Дерзкий друг гг» (Слава).</p>", "r": [["Бомж", "PS-0128.html"]]}, {"t": "Характер", "a": ["S02", "PS-0129-S02", "PS-0129--harakter"], "h": "<p>На вопрос Миколая «кто он» Слава определил суть персонажа: «Друг который друг по вине» — «Он чувствует вину за то что сделал с гг в детстве поэтому и дружит с ним» (id 214387–214388). Дружба держится не на симпатии, а именно на чувстве вины за детский поступок.</p>", "r": []}, {"t": "Связи с другими", "a": ["S03", "PS-0129-S03", "PS-0129--svyazi-s-drugimi"], "h": "<p>Дружит с гг (ГГ-шизофреник) — по формулировке Славы, «друг по вине». По социальной роли, как подтвердил Слава на прямой вопрос Миколая, он тоже подросток. Часть команды гиг (5 человек); занял в составе место, освободившееся после вытеснения роли «бомж» (<a href=\"PS-0128.html\">Бомж</a>).</p>", "r": [["Бомж", "PS-0128.html"]]}, {"t": "Как менялся", "a": ["S04", "PS-0129-S04", "PS-0129--kak-menyalsya"], "h": "<h3>2024-07-31, id 214383–214392</h3>\n<p>Введён как замена бомжу. Определён как «друг по вине», чувствующий вину за поступок в детстве; подросток по социальной роли. Миколай сразу предположил конкретику — «он его изнасиловал?» — Слава отверг: «Он мальчик» / «Они мальчики».</p>\n<h3>2024-07-31, id 214391–214414</h3>\n<p>Дальнейший перебор вариантов вины со стороны Миколая, все отклонены или оставлены без ответа:</p>\n<ul>\n<li>убил собаку — Слава: «Нет», затем «Не знаю»;</li>\n<li>ославил гг перед коллективом в начальной школе — Слава: «Не знаю»;</li>\n<li>рассказал чужой секрет про розовые трусы — реакция Славы не зафиксирована, сам Миколай завершает: «я хз».</li>\n</ul>\n<p>Слава прямо резюмирует: «Не придумал».</p>", "r": []}, {"t": "Что с ним стало", "a": ["S05", "PS-0129-S05", "PS-0129--chto-s-nim-stalo"], "h": "<p>Конкретная причина вины так и осталась неопределённой — обсуждение обрывается на неподтверждённых вариантах.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0129-S06", "PS-0129--probely"], "h": "<div class=\"gaps\"><p>Суть вины не придумана — это прямо отмечено в переписке как открытая дыра в биографии. Внешность персонажа не описана. Способности не упоминаются. Неясно, совпадает ли его роль «по социальной роли — подросток» с отдельно введённой ролью «подросток» (<a href=\"PS-0127.html\">Подросток</a>) в исходном составе пятёрки, или это разные позиции — в переписке связь прямо не проговорена, зафиксировано только совпадение социальной роли.</p></div>", "r": [["Подросток", "PS-0127.html"]]}, {"t": "Связи — всё вместе", "a": ["PS-0129--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0127.html\">Подросток</a>, <a href=\"PS-0128.html\">Бомж</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0127.html\">Подросток</a>, <a href=\"PS-0128.html\">Бомж</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0129--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-31</td>\n<td>214383–214392</td>\n<td>w0049</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-31</td>\n<td>214391–214414</td>\n<td>w0049</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0129-derzkiy-drug-gg.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0129--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0129.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
