<script>const BASE="";const DOCNAME="Ограничения силы монстров";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0053-S01", "MR-0053--ustroystvo"], "h": "<p>«Ограничения силы монстров» — набор жёстких правил на порождение монстров верой. Весь набор возник за один вечер (2024-08-11, id 217950–218014, окно w0051) как ответ Миколая на два вопроса Славы: почему монстров не семь миллиардов и почему в этой системе нет всесильного божественного монстра.</p>\n<p>Отправные вопросы Славы: «Получается любой может создать монстра и получается их 7.000.000.000» (id 217951–217952) и «И вообще в разных мультиках бывают божественная сильный монстр / Который по щелчку пальца могут стереть все живое» (id 217958).</p>\n<p><strong>Базовое положение.</strong> Создать монстра действительно может любой человек, и монстр у каждого свой: «ну конечно любой может, у каждого есть свой, они разные, но нужна глубокая и долгая связь» (id 217957). Ограничитель здесь один — «глубокая и долгая связь»; никаких других условий на создание обычного монстра в переписке не названо.</p>\n<p><strong>Ограничения на монстра, способного стереть всё живое.</strong> Миколай перечисляет их подряд (id 217968–217975):</p>\n<ol>\n<li>\n<p><em>Родитель обязан быть суицидником.</em> «ну так во первых родитель должен быть суицидником 100%, он информацию о нём должен распространять на соответствующих форумах». То есть требуется не только сам родитель, но и его работа по распространению информации о монстре — «на соответствующих форумах».</p>\n</li>\n<li>\n<p><em>Людей в мире физически не хватит.</em> «однако столь сильной эмоции они не добьются, у мира просто нет ну настолько большого количества людей».</p>\n</li>\n<li>\n<p><em>Эффект сломанного телефона.</em> Даже гипотетическое увеличение населения не помогает: «да и даже если 19 миллиардов людей было как они все поверят в одно существо, эффект сломанного телефона просто мне даст настоящую веру одному существу в лучшем случае, да и вера не будет такой сильной у всех». Информация о монстре искажается при передаче, поэтому по-настоящему верят в один вариант существа, и вера у всех разной силы.</p>\n</li>\n<li>\n<p><em>Общий вывод.</em> «сильных монстров верой не создать», с оговоркой сразу следом: «ну точнее это потребует очень больших усилий» (id 217969–217970).</p>\n</li>\n<li>\n<p><em>Рациональное мышление останавливает развитие.</em> «да и если перейти в рациональное мышление когда думаешь о монстрах то он не станет развиваться»; развитие монстра — «это прерогатива иррациональных мыслей» и «сильных эмоций» (id 217971–217973).</p>\n</li>\n</ol>\n<p><strong>Внутреннее противоречие, проговорённое авторами.</strong> Пункт 1 требует родителя-суицидника, пункт 5 требует сильных эмоций, а у суицидников их нет: «у суицидников нет столь сильных эмоций, как минимум страха смерти», «ток желание» (id 217974–217975). Миколай проговаривает обе половины и на вопрос о монстре масштаба всего мира отвечает: «но чтоб для всего мира», «хз», «не знаю таких» (id 217976–217978). Противоречие в окне не снимается — оно и есть причина, по которой всесильного монстра в системе нет.</p>\n<p><strong>Кирилл как проверочный случай.</strong> Слава дважды приводит его как контрпример: «Кирилл как то легко его создал» (id 217953) и «А теперь логический объясни, почему родитель суицидник / Ведь Кирилл не был суицидником» (id 217979–217980). Ответ: «так он и не хотел уничтожить мир», «просто полетать» (id 217981–217982). Требование родителя-суицидника относится только к монстру, уничтожающему мир, а не к монстрам вообще.</p>\n<p><strong>Порог желания.</strong> Обычного, эпизодического желания апокалипсиса недостаточно. Слава: «Я на при мер тоже иногда хочу чтобы мир исчез или случился апокалипсис» (id 218002); Миколай: «ну это слишком незначительно для создания монстра» (id 218003). Ранее — «какой долбаёб будет хотеть чтобы мир уничтожен», «ну тот кто и сам жить не хочет», «иначе он просто долбаёб» (id 217997–218000), на что Слава отвечает «Любой» (id 217999).</p>\n<p><strong>Возражения Славы, оставшиеся без ответа.</strong> Три штуки, все в конце окна: количество желающих апокалипсиса — «Ну так не я один хочу чтобы мир разрушился или случился апокалипсис / Те кто хочет этого миллярды» (id 218008); суицидники хотят, но не верят — «Да и суицидники если и хотят чтобы мир разрушался, все равно в это верить не будут» (id 218009); и главное разделение — «Хотение и вера разные вещи» (id 218011). Плюс вопрос про бога: «А почему не помогает, ведь люди верят что он поможет» (id 217996). Миколай: «...», «я позже напишу», «хотел просто сейчас» (id 218012–218014).</p>", "r": []}, {"t": "Место во вселенной", "a": ["S02", "MR-0053-S02", "MR-0053--mesto-vo-vselennoy"], "h": "<p>Относится к вселенной «монстры». Часть темы «Монстры и вера» — набор ограничений описывает именно механизм порождения монстров верой, а не отдельную местность. Связан с фигурой Кирилла, чей монстр служит примером обычного, не апокалиптического случая.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S03", "MR-0053-S03", "MR-0053--kak-menyalsya-po-versiyam"], "h": "<p>Все три версии — 2024-08-11, окно w0051, один вечерний разговор.</p>\n<p><strong>Версия 1 — 2024-08-11 (id 217950–217958).</strong> Заданы вопрос про семь миллиардов монстров и вопрос про божественного монстра из мультиков. Единственное сформулированное ограничение — «нужна глубокая и долгая связь».</p>\n<p><strong>Версия 2 — 2024-08-11 (id 217966–217982).</strong> Развёрнутый набор ограничений: родитель-суицидник и форумы, нехватка людей, эффект сломанного телефона, «сильных монстров верой не создать», рациональное мышление против иррациональных мыслей и сильных эмоций, отсутствие сильных эмоций у суицидников. Здесь же разобран случай Кирилла. Перед ответом Миколай берёт паузу: «я подумаю» (id 217966).</p>\n<p><strong>Версия 3 — 2024-08-11 (id 217996–218014).</strong> Введён порог желания («слишком незначительно для создания монстра»). Слава выдвигает три возражения — миллиарды желающих, различие хотения и веры, вопрос про бога. Ответ отложен: «я позже напишу».</p>", "r": []}, {"t": "Пробелы", "a": ["S04", "MR-0053-S04", "MR-0053--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вопрос про бога («А почему не помогает, ведь люди верят что он поможет», id 217996) внутри окна ответа не получил.</li>\n<li>Различение «Хотение и вера разные вещи» (id 218011) выдвинуто Славой и не разобрано.</li>\n<li>Противоречие между требованием родителя-суицидника и требованием сильных эмоций проговорено, но не разрешено.</li>\n<li>Что именно считается «глубокой и долгой связью» — сроки, форма, признаки — не сказано.</li>\n<li>Сколько монстров есть в мире на самом деле, если их не семь миллиардов, в переписке не названо.</li>\n<li>Порог, отделяющий «слишком незначительное» желание от достаточного, не определён.</li>\n<li>Не сказано, что происходит с уже созданным монстром, если родитель переходит к рациональному мышлению: сказано только, что монстр «не станет развиваться».</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0053--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0053--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-11</td>\n<td>217950–217958</td>\n<td>w0051</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-08-11</td>\n<td>217966–217982</td>\n<td>w0051</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-08-11</td>\n<td>217996–218014</td>\n<td>w0051</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0053-ogranicheniya-sily-monstrov.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0053--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0053.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
