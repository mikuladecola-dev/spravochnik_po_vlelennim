<script>const BASE="";const DOCNAME="Эниг";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0377-S01", "PS-0377--proishozhdenie"], "h": "<p>Эниг введён целиком в одном заходе 2026-06-09 (id 488783–488786), в момент, когда Слава переделывал уже имевшихся персонажей под вселенную: «Приходится переделывать всех персов под вселенную» (id 488783).</p>\n<p>Его положение в классификации задано сразу и с оговорками: «Эниг сл с подвохом. Точнее самый особенный сл. Или даже не сл и не ис и не фантазёр.» То есть формально он проходит как СЛ, но тут же выведен за пределы всех трёх категорий.</p>\n<p>Предыстория. Одна фантазёрша забеременела и «не почуствовала того чего хотела»: она рассчитывала, что с беременностью появится мотивация остаться в этом мире, но мир по-прежнему казался ей серым. Она начала исчезать — то есть отправляться в свой мир. Её сознание постепенно уходило от тела всё дальше, при этом беременность продолжалась. В итоге она окончательно покинула тело, «а тела без сознания это просто труп». Врачам пришлось поддерживать тело и провести роды раньше срока. Поэтому Эниг «родился слабым и нездоровым».</p>\n<p>Он попал в приют. «И будучи нездоровым, хиленьким и вечно бледным (не типо бледный красивый, а типо бледный больной, так сказать серовато бледный) он плохо жил в приюте. Над ним издевались, да и он был отстраненым, словно не в этом мире.»</p>\n<p>Так он дожил до 10 лет — «всё такой же бледный, хиленький и больной и не являющийся сл», при этом уже «познавший неприятную сторону человечества». В 10 лет он впервые провалился.</p>\n<p><strong>Первый провал.</strong> Тело и сознание Энига исчезают из нашего мира и оказываются на первом слое мира его матери. Первый слой представляет собой «пустой чёрной пространство, наполненной синими молниями, неизвестной ранее энергии, это не оам и не ток, это совершенно новая энергия». Энергия ядовита для живых существ, но для Энига она оказалась безвредной. Он смог поглотить её часть и затем провалился обратно в настоящее — в двух метрах от точки, где исчез.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0377-S02", "PS-0377--vneshnost"], "h": "<p>Постоянные признаки: слабый, хилый, вечно бледный. Автор отдельно оговаривает характер бледности: «не типо бледный красивый, а типо бледный больной, так сказать серовато бледный». На момент начала сюжета ему 17 лет.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0377-S03", "PS-0377--harakter"], "h": "<p>В детстве — отстранённость: «он был отстраненым, словно не в этом мире». К 10 годам он уже «познавший неприятную сторону человечества».</p>\n<p>К 17 годам: «он злодей, но не принадлежит не какой организаций. И он любит по драться и давить врагов.»</p>\n<p>Отдельная и определяющая черта — зависимость от СОЭ. Энергия для него не ядовита, но «вызывает чувство эфория, посылает дофамина дофига. И мутить сознание. Делая тебе словно пьяным и ты творишь всякую дичь. Убиваешь прохожего. Убиваешь всех в приюти. Купаясь в ванне кого-то богача и т. Д.» Итоговая формулировка: «Можно сказать он наркоман, а его наркотик это СОЭ».</p>\n<p>Отдельно оговорено ограничение по мастерству, а не по силе: «у него нет программы поэтому использовать прям креативно он не может, да и он ещё юный».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0377-S04", "PS-0377--sposobnosti"], "h": "<p><strong>Провал (телепортация на малую дистанцию).</strong> Эниг способен провалиться в мир матери и вернуться обратно, сам выбирая точку появления — в радиусе 50 метров от места, где он провалился. Длительность: проваливается он на 2 секунды по меркам нашего мира, при этом по меркам того мира он может находиться в пустоте, наполненной неизвестной энергией, 2 минуты, «а после насильно возращается обратная».</p>\n<p><strong>Перезарядка.</strong> Непрерывно проваливаться он не может: перезарядка занимает 3 минуты нашего времени.</p>\n<p><strong>Провал объектов.</strong> Он способен заставить провалиться объекты, не наполненные оам. Пояснение автора: «это я к тому что он не может составить провалится артефакты, людей и живые организмы ( во всех живых организмов есть оам)». Объекты могут пробыть там 1 секунду для нашего мира и одну минуту для того мира. После возврата Эниг также контролирует, где они появятся — в радиусе 30 метров от места исчезновения. Отдельное правило: он не может заставить объект появиться внутри другого объекта; при такой попытке объект «просто рандомном месте появиться ну в радиусе 30 метров».</p>\n<p><strong>СОЭ (странная особая энергия).</strong> После возвращения объекты пропитываются странной особой энергией — СОЭ. Пока СОЭ в них находится, Эниг может этими объектами управлять («ну типо телекинез»). Он также способен собирать СОЭ из этих объектов. Смысл этого действия объяснён прямо: поскольку сам он проваливаться без остановки не может из-за перезарядки, объекты — способ добыть СОЭ, «поэтому он так делает если ему нужна СОЭ».</p>\n<p>Применения СОЭ:</p>\n<ul>\n<li><strong>Усиление.</strong> «Просто покрывает себя этими синими молниями и увеличивает свои физически характеристики.»</li>\n<li><strong>Регенерация.</strong> «СОЭ имеет очень хорошо восстанавливает тела, ну то бишь с помощью СОЭ можно хорошо регенерировать лучше чем от оам.»</li>\n<li><strong>Ядовитые удары.</strong> Так как СОЭ ядовита для всех, удар, пропитанный СОЭ, «является очень болючим, и сложно восстанавливаемым», то есть после такого удара «восстановиться с помощью оам очень сложная». Накопительный эффект: «если ты прям будешь впитывать удары СОЭ то по-тихоньку тебе будет всё хреновее так как СОЭ распостраняется по телу и тебе будет хреновее. Очень сложно вывести с помощью оам.»</li>\n<li><strong>Выстрел молнией.</strong> Он может стрелять СОЭ как молнией, «но он косой и поэтому часто не попадает».</li>\n<li><strong>Выброс во все стороны.</strong> Он может выпустить заряд СОЭ в разные стороны.</li>\n</ul>\n<p>Итоговую сводку автор дал сам (id 488785): «у него способности это телепортация на малый расстояние ( провалы то есть). Телекинез пропитаных СОЭ объектов. Усиление, опасный удары, косой выстрел молнии. Ну и просто выпуск накопившиеся СОЭ в разные стороны.»</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0377-S05", "PS-0377--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Мать-фантазёрша.</strong> Названа только как «одна фантазерша», имени нет. Она ушла в свой мир во время беременности, её сознание покинуло тело до родов. Её мир — источник способностей Энига; на его первый слой он и проваливается. Прямой связи, встречи или контакта между ними в переписке нет.</li>\n<li><strong>Мир матери.</strong> Первый слой — пустое чёрное пространство с синими молниями. Другие слои упомянуты только косвенно, самим словом «первый», их описания нет.</li>\n<li><strong>Приют.</strong> Место, где он рос и где над ним издевались. В перечне того, что творит человек под действием СОЭ, отдельно упомянуто «Убиваешь всех в приюти», но применительно ли это к самому Энигу и к его собственному приюту — прямо не сказано.</li>\n<li><strong>Организации.</strong> Связей нет по прямому указанию: «он злодей, но не принадлежит не какой организаций».</li>\n<li><strong>Категории мира.</strong> Он не СЛ, не ИС и не фантазёр — но при этом заведён как «сл с подвохом», «самый особенный сл».</li>\n<li><strong>Оам.</strong> Противопоставлена СОЭ по нескольким пунктам: СОЭ — «не оам и не ток», это «совершенно новая энергия»; она восстанавливает тела лучше, чем оам; повреждения от неё оамом лечатся плохо; наличие оам в объекте делает объект непроваливаемым.</li>\n</ul>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0377-S06", "PS-0377--kak-menyalsya"], "h": "<p><strong>2026-06-09 (id 488783–488786), окно w0121 — единственная версия.</strong> Персонаж введён целиком за один раз: предыстория, первый провал, полный набор способностей, зависимость от СОЭ, статус злодея-одиночки и итоговая сводка. Правок и последующих состояний в архиве нет.</p>\n<p>Единственное изменение, зафиксированное внутри самой версии, — переделка персонажа под вселенную: Эниг существовал до этого («Приходится переделывать всех персов под вселенную»), но каким он был до переделки, в переписке не сказано.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0377-S07", "PS-0377--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вселенная не названа: в файле стоит «неясно», привязка сделана по дате объявления.</li>\n<li>Классификация оставлена противоречивой намеренно: «сл с подвохом», «самый особенный сл», «или даже не сл и не ис и не фантазёр» — окончательного ответа нет. Расшифровки сокращений СЛ и ИС в этом окне нет.</li>\n<li>Мать не названа по имени, её судьба после ухода в свой мир не описана.</li>\n<li>Не сказано, сколько слоёв у мира матери и что находится за первым.</li>\n<li>Не объяснено, почему СОЭ безвредна именно для Энига.</li>\n<li>Не сказано, что происходит с Энигом между 10 и 17 годами: описан первый провал в 10 лет и состояние на 17, промежуток пуст.</li>\n<li>Перечисленные под СОЭ поступки («убиваешь прохожего», «убиваешь всех в приюти», «купаясь в ванне кого-то богача») даны как примеры действий в помутнённом состоянии; совершил ли их Эниг, в переписке не уточнено.</li>\n<li>«Программы» у него нет — что означает «программа» как понятие мира, в этом окне не объяснено.</li>\n<li>Сообщение id 488786 в том же окне — перечень «Энергет, прятки, закон, петля, феникс, Тен, волк, дракон, ци, имитатор, спартанец, вампир, драгоценность, бессмерт, жук, лёд, Дилан, граница, солнце» — идёт без пояснений; его отношение к Энигу в переписке не оговорено.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["PS-0377--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-06-09</td>\n<td>488783–488786</td>\n<td>w0121</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0377-enig.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0377--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0377.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
