<script>const BASE="";const DOCNAME="Цветной мир";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0011-S01", "MR-0011--ustroystvo"], "h": "<p>«Цветной мир» — название вселенной, принятое 25.05.2024 (id 173342–173346).</p>\n<p>Состояние вселенной на момент окна w0035 описано самим Славой в ответ на вопросы Миколая о сюжете. Миколай: «А на чем сюжет стоит», «Какая фабула?», «Пизделово?» (id 173328–173330). Слава: «Не знаю мы только персонажей и систему сил продумали» (id 173331) и «Да у меня даже нет гг чтобы пихнуть ему двигатель сюжета» (id 173332). То есть на этот момент существуют персонажи и система сил, сюжета и фабулы нет, главный герой не определён.</p>\n<p>Система сил, о которой идёт речь, — это деление носителей абакры на бесцветных и цветных (<a href=\"MR-0009.html\">Бесцветные и Цветные</a>) и программа опытов по переводу из одной категории в другую (<a href=\"MR-0010.html\">Эксперименты по превращению бесцветного в цветного</a>).</p>\n<p>Требование к сюжету сформулировано Миколаем сразу после принятия названия: «Но должен быть конфликт для сюжета» (id 173347). Ответ Славы: «Но это потом», «Хотя он есть», «Я по позже напишу» (id 173348–173350). Сам конфликт в этом окне не назван — сказано только, что он есть.</p>", "r": [["Бесцветные и Цветные", "MR-0009.html"], ["Эксперименты по превращению бесцветного в цветного", "MR-0010.html"]]}, {"t": "Население", "a": ["S02", "MR-0011-S02", "MR-0011--naselenie"], "h": "<p>Персонажи, названные в окне w0035:</p>\n<ul>\n<li><strong>Командир</strong> — командир сильнейшего отряда; «После развала команды построил приют для детей в отшибе от людей и жил там поживал»; «И он в теорий сильнейший» (id 173147). Главным героем не является: на вопрос Миколая «Он гг?» Слава отвечает «Нет» и добавляет «Он будет редко появляться» (id 173324–173326). Его роль в системе координат вселенной: «типа добро» (id 173321), позже — «он будет означать добро реальной добро» (id 173177). Подробнее — <a href=\"MR-0010.html\">Эксперименты по превращению бесцветного в цветного</a>.</li>\n<li><strong>Энергетик</strong> — «Энергетик чел со способностью телепортироваться и черпать оттуда энергию» (id 173339). Реплика возникает как временное решение: «Ну ладно пусть будет пока энергетик» (id 173338). Откуда именно он черпает энергию («оттуда»), в приведённом куске не уточняется; из чего вырос этот персонаж и в каком он отношении к остальным, не сказано.</li>\n<li><strong>Главный герой</strong> — на момент обсуждения названия отсутствует. Слава: «У меня же там не один гг» (id 173310) и «Да у меня даже нет гг чтобы пихнуть ему двигатель сюжета» (id 173332). Позже в тот же день (id 173353) появляется текст про мальчика без имени, пробудившегося цветным, — см. <a href=\"MR-0009.html\">Бесцветные и Цветные</a>.</li>\n</ul>", "r": [["Эксперименты по превращению бесцветного в цветного", "MR-0010.html"], ["Бесцветные и Цветные", "MR-0009.html"]]}, {"t": "Место во вселенной", "a": ["S03", "MR-0011-S03", "MR-0011--mesto-vo-vselennoy"], "h": "<p>«Цветной мир» — это название самой вселенной, а не отдельного мира внутри неё. К ней отнесены материалы «Бесцветные и Цветные» (<a href=\"MR-0009.html\">Бесцветные и Цветные</a>) и «Эксперименты по превращению бесцветного в цветного» (<a href=\"MR-0010.html\">Эксперименты по превращению бесцветного в цветного</a>), а также персонажи Командир, Волк, Тен, Энергетик и абакра как система сил.</p>\n<p>Отношений с другими вселенными в этом окне не зафиксировано. Единственное касание чужого материала — реплика Миколая в начале разговора: «По идее норм концепция, можно дополнить или объединить с другой» (id 173146); с какой другой концепцией предлагалось объединять, не названо, и продолжения эта мысль в приведённых кусках не получила.</p>", "r": [["Бесцветные и Цветные", "MR-0009.html"], ["Эксперименты по превращению бесцветного в цветного", "MR-0010.html"]]}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0011-S04", "MR-0011--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-05-25 (id 173306–173316), окно w0035. Начало разговора о названии.</strong> Тема возникает по недоразумению: Слава решил, что Миколай спрашивает, как назвать вселенную, приняв за это присланную фотографию, где надо было назвать фнаф (id 173306, 173309). Своих идей у Славы на этот момент нет: «Вообще нету. У меня же там не один гг» (id 173310–173311 по тексту реплики). Миколай предлагает подход: «Ну можно назвать по глупому», «Потом будет привычно» (id 173311–173312), и следом — вариант «Не сахар» (id 173313).</p>\n<p><em>Отклонённый вариант: «Не сахар».</em> Слава отвергает сразу: «Точно не это» (id 173314). Миколай не спорит: «Ахахах», «Да» (id 173315–173316).</p>\n<p><strong>Версия 2 — 2024-05-25 (id 173317–173332), окно w0035. Вариант «Паладин».</strong> Миколай: «Ну ладно, тогда более серьёзные подходы рассмотреть бы» (id 173317). Слава предлагает «Паладин» (id 173318). Обоснование: «Типо мы только что рассматривали командира а он типа добро» (id 173321) — то есть название выводится из образа командира. Следом Слава прикладывает ссылку на ютуб-шортс (id 173322) и начинает «И плюс» (id 173323), но продолжение перебивается вопросом Миколая «Он гг?».</p>\n<p><em>Вариант «Паладин» дальше не принят:</em> выясняется, что командир не главный герой и «будет редко появляться» (id 173325–173326), Миколай отвечает уклончиво — «Нуу, в принципе» (id 173327) — и переводит разговор на сюжет и фабулу. Прямого отказа от «Паладина» в переписке нет; вариант просто не возвращается после того, как принято другое название. «Паладин» при этом остаётся в материале как отдельная связанная сущность.</p>\n<p><strong>Версия 3 — 2024-05-25 (id 173338–173350), окно w0035. Принято название «Цветной мир».</strong> После реплик про Энергетика Слава предлагает: «Цветной мир» и следом «?» (id 173342–173343). Реакция Миколая: «Оооо», «Оо», «Идеально» (id 173344–173346). Тут же ставится требование конфликта для сюжета (id 173347) и откладывается на потом (id 173348–173350).</p>\n<p>Таким образом, порядок вариантов: «Не сахар» (отвергнут) → «Паладин» (не принят, оставлен без прямого отказа) → «Цветной мир» (принято).</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0011-S05", "MR-0011--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Фабулы и сюжета на момент окна нет — это зафиксировано прямым признанием Славы, а не умолчанием.</li>\n<li>Конфликт объявлен существующим («Хотя он есть»), но не описан; Слава обещает написать позже.</li>\n<li>Главный герой не определён; при этом сказано, что героев не один.</li>\n<li>Устройство мира в бытовом смысле — география, страны, эпоха, технологический уровень — в этом окне не обсуждалось вовсе.</li>\n<li>Откуда взялось название «Цветной мир» и связано ли оно напрямую с делением на бесцветных и цветных, не объяснено.</li>\n<li>Судьба варианта «Паладин» осталась нерешённой: прямого отказа нет.</li>\n<li>Содержание ссылки на ютуб-шортс (id 173322), приведённой в обоснование «Паладина», из переписки не восстанавливается.</li>\n<li>Что имел в виду Миколай под «объединить с другой» концепцией (id 173146), не названо.</li>\n<li>Энергетик введён одной репликой и словом «пока»; закреплён ли он во вселенной окончательно, не сказано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0011--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0009.html\">Бесцветные и Цветные</a>, <a href=\"MR-0010.html\">Эксперименты по превращению бесцветного в цветного</a></li>\n<li><strong>Упомянут в мирах:</strong> <a href=\"MR-0009.html\">Бесцветные и Цветные</a>, <a href=\"MR-0010.html\">Эксперименты по превращению бесцветного в цветного</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0090.html\">Бесцветные и Цветные</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0007.html\">Новый мир</a>, <a href=\"VS-0012.html\">Цветной мир</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0011--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-05-25</td>\n<td>173306–173316</td>\n<td>w0035</td>\n<td>Цветной мир (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-05-25</td>\n<td>173317–173332</td>\n<td>w0035</td>\n<td>Цветной мир (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-05-25</td>\n<td>173338–173350</td>\n<td>w0035</td>\n<td>Цветной мир (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0011-cvetnoy-mir.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0011--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0011.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
