<script>const BASE="";const DOCNAME="Общество и знание о мирах";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0102-S01", "MR-0102--ustroystvo"], "h": "<p>Речь идёт о том, что о существовании миров знают и чего не знают. Разговор идёт (2025-01-06, id 278911–278923 и 278960–278967).</p>\n<p>Существа других миров о других мирах знают, но перемещаться между ними не могут: «Знают что есть, но покинуть свой мир не могут», «Лишь наблюдать».</p>\n<p>Про правителей сказано отдельно: «большинство правитель пытаются достигнуть нашего правителя из за этого пытаются везде его копировать» (id 278912). Кто такой «наш правитель» и в чём именно состоит копирование, в переписке не расшифровано.</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0102-S02", "MR-0102--naselenie"], "h": "<p>Общество нашего мира о других мирах не знает: «Общество не знает» (id 278915). При этом мифы и монстров изучают с начальных классов — предложение Миколая: «ну типа вообще с начальных классов изучают мифы и монстров всяких, мб это общество знает но не верит» (id 278920). Слава подтвердил в той же формулировке: «Знает о мифов но не верят» (id 278922).</p>\n<p>Драконов общество не видело: на вопрос «их общество видело?» ответ — «Драконов нет» (id 278962, 278965).</p>\n<p>Благословенные, в отличие от драконов, обществу известны и встроены во власть: «Благословенный имеют большую власть у верхушки и может многой» (id 278965). Их число названо тут же: «А их именной сейчас 42» (id 278966). Следующей репликой уточняется: «Благословенный бога и дьявола» (id 278967).</p>", "r": []}, {"t": "Место во вселенной — как связан с другими мирами", "a": ["S03", "MR-0102-S03", "MR-0102--mesto-vo-vselennoy"], "h": "<p>Запись отнесена к вселенной «Апостол» и помечена как часть сущности «Вселенная (наш мир)». Связана с сущностями «Благословение» и «Минимиры».</p>\n<p>Отношение между мирами описано односторонним наблюдением: границу не пересекают, но видят. Про то, знают ли о других мирах жители самого «нашего мира» с точки зрения существ других миров (то есть симметрична ли эта видимость), в переписке не сказано.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0102-S04", "MR-0102--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-01-06 (окно w0070, id 278911–278923).</strong> Введено: общество не знает о других мирах; мифы и монстры изучаются со школы, но обществом не воспринимаются всерьёз; существа других миров знают о чужих мирах и только наблюдают.</p>\n<p><strong>Версия 2 — 2025-01-06 (окно w0070, id 278960–278967).</strong> Уточнение по двум группам существ: драконов общество не видело, благословенные обладают властью у верхушки; названо число 42 и уточнено, что это благословенные бога и дьявола.</p>\n<p>Между двумя версиями Слава ставит условие по порядку работы: «Сначала придумать способность всём благословенным» (id 278961) — то есть вопрос о видимости благословенных обществом был отложен за вопрос об их способностях.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0102-S05", "MR-0102--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Не сказано, что означает «наш правитель» и почему остальные правители его копируют.</li>\n<li>Не сказано, о ком именно идёт речь под «существами других миров» — состав не назван.</li>\n<li>Не объяснено, почему при отсутствии драконов в поле зрения общества благословенные видимы и влиятельны; связь между двумя утверждениями в переписке не проведена.</li>\n<li>Число 42 дано без пояснения — постоянное это количество, предел или текущий счёт, не сказано.</li>\n<li>Формулировка «может многой» (id 278965) осталась нерасшифрованной.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0102--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0013.html\">Благословенные</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0102--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-01-06</td>\n<td>278911–278923</td>\n<td>w0070</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-06</td>\n<td>278960–278967</td>\n<td>w0070</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0102-obschestvo-i-znanie-o-mirah.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0102--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0102.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["MR-0102-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/MR-0102/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — «наш правитель». Статья честно помечает его как нерасшифрованного, но чинится это не поиском материала: расшифровка стоит в соседних id того же дня и того же окна. В <code>MR-0097</code> на вопрос «а наш кто создал?» дан ответ «Существо» (id 278886) и там же сказано, что «самым сильном является „существо“». Реплика про копирование (278912) лежит на стыке двух записей и досталась обеим. Настоящая дыра глубже: у фигуры «существо» вообще нет записи в наборе — ни статьи, ни строки в базе, — при том что на неё опираются эта статья, <code>MR-0097</code> (9.6 КБ), <code>PS-0178</code> «Смерть» (5.8 КБ, ссылок ноль) и <code>MR-0093</code> «Вселенная (наш мир)» (три ссылки, 12.1 КБ).</p>\n<p>Вторая — состав «существ других миров». В статье он помечен как неназванный, а в базе лежит и он самый объёмный из всего, что рядом: <code>PS-0198</code> «Чужемирцы» — статья, 58.7 КБ; <code>MR-0100</code> «Чужемирцы и аномальные люди» — две ссылки; <code>MR-0117</code> «Чужемирцы»; <code>SP-0182</code> «Чутьё на чужемирцев» — 8.9 КБ; <code>PS-0231</code> «Упыри» — 17.4 КБ. Отсюда не видно ни одной из них, хотя вопрос статьи — кто наблюдает и кого общество не замечает — ровно про этот куст.</p>\n<p>Третья: драконы. Утверждение «драконов общество не видело» стоит без предмета — записи о драконах в этой вселенной нет. <code>PS-0080</code> «Дракон» (2.3 КБ) отнесён к «Цветному миру», <code>PS-0382</code> «Трёхголовый дракон Апола» (6.7 КБ) без статьи и без вселенной. То же с <code>MR-0090</code> «Оборотни» — 1.7 КБ, статьи нет, вселенная не определена.</p>\n<h3>С чего начать</h3>\n<p>В базе, и число 42 разбирать не по этому окну. В <code>MR-0096</code> тот же день, то же окно w0070: «И бог и дьявол могут дать свой благословение лишь 21 человеку» (id 278944). Два числа стоят в соседних записях одного разговора и нигде не сведены между собой — это первое, что надо положить рядом. Дальше <code>SP-0163</code> «Благословение» (86.8 КБ, 2025-01-06 — 2025-05-31) и <code>PS-0179</code> «Благословенные» (78.2 КБ, тянется до 2026-04-25): там и способности, которые Слава поставил условием в id 278961, и, скорее всего, дальнейшая судьба счёта. Про власть у верхушки — <code>MR-0099</code> «Территории и организации благословенных» (две ссылки).</p>\n<p>В архив — за одним словом. «Может многой» (id 278965) осталось нерасшифрованным; смотреть надо хвост w0070 после id 278967, переспрашивал ли Миколай. Там же ищется ответ на вопрос о симметрии видимости, который в статье поставлен, но в переписке не задан вслух.</p>\n<h3>Как развивалось</h3>\n<p>Заявили режим знания (278911–278923): общество о других мирах не знает, мифы и монстров изучает со школы, но всерьёз не берёт; существа других миров о чужих мирах знают и только наблюдают. Ограничили примером: драконов общество не видело. Отложили — и отложили явным распоряжением о порядке работы: «Сначала придумать способность всём благословенным» (278961), то есть вопрос видимости отправлен в очередь за вопрос способностей. Вернулись через несколько реплик, но уже не к обществу: 278965–278967 — про власть благословенных у верхушки, число 42 и уточнение «бога и дьявола». Всё внутри 2025-01-06; к теме общества после этого дня не возвращались.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для мифов и монстров режим знания назван точно и в двух формулировках сразу: изучают со школы, знают, но не верят. Для благословенных названо только, что они «имеют большую власть у верхушки». Что с ними у остального общества — знает и не верит, знает и верит, не знает вовсе — не проговорено, хотя это единственная группа, которая одновременно сверхъестественная и живёт здесь, среди тех, кто её якобы не замечает. Для дальних правило знания сформулировано, для ближних — нет.</p>\n<h3>Отклик</h3>\n<p>«Знает о мифов но не верят» — самая рабочая строчка в записи. Она снимает вопрос, на котором обычно ломаются такие миры: не надо ничего прятать, достаточно, чтобы про это рассказывали в начальных классах. Знание есть, вера отсутствует, и это держит тайну надёжнее любой секретности — школьная программа как маскировка. Отдельно любопытно, что реплика родилась из подсказки Миколая и была принята почти дословно, встык, — таких мест в этом разговоре немного, обычно предложения уходят в пустоту. А число 42 рядом выглядит совсем иначе: оно названо раньше, чем что-либо, что могло бы его объяснить, и в статье это видно честно.</p></div>", "r": []}];</script>
