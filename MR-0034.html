<script>const BASE="";const DOCNAME="Защитники островов";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0034-S01", "MR-0034--ustroystvo"], "h": "<p>Защитник — роль в устройстве мира островов: у каждого острова свой защитник. Обсуждение целиком укладывается в один вечер (2024-07-09, окно w0046).</p>\n<p>Энергия защитника не бесконечна: «У него не бесконечная энергия» (id 201857). Объём энергии у разных защитников разный, и они сравнимы между собой — про избранного сказано: «И у него меньше чем у любого защитника энергия» (id 201861).</p>\n<p>Власть защитника не выходит за пределы его острова. Поселения, лежащие вне островов, защитникам не принадлежат: «Потому что защитник не всемогущий ему и так тяжело» (id 202460). Расположены такие деревни, по словам Славы, «ближе островов» (id 202459).</p>\n<p>Защитник привязан не к личности, а к острову: если остров меняется, меняется и защитник. Когда вулкан заменяется на технологичный остров, на вопрос «защитник тот же?» ответ — «Нет наверное», и из этого следует, что сталкера в этой вселенной не будет (id 201616–201618).</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0034-S02", "MR-0034--naselenie"], "h": "<p>Про деревни вне островов сказано: «Люди и нелюди зависит от деревни» (id 202457) — то есть состав населения деревни различается от деревни к деревне.</p>\n<p>Остров-пустыня описан через сталкера: «Сталкер остров пустыня. Наемники криминал наркотики все там» (id 201621).</p>", "r": []}, {"t": "Место во вселенной — как связан с другими мирами", "a": ["S03", "MR-0034-S03", "MR-0034--mesto-vo-vselennoy"], "h": "<p>Запись отнесена к вселенной «7 островов» и помечена как часть «Мира островов (архипелага защитников)».</p>\n<p>Названные защитники и связанные персонажи: Антон, Избранный (защитник Асгарда), Сталкер.</p>\n<p>Про избранного сказано, что он появился «Из фэнтези мира» (id 201863) — то есть защитник может быть пришедшим из другого мира, а не рождённым на своём острове.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0034-S04", "MR-0034--kak-menyalsya-po-versiyam"], "h": "<p>Все три состояния относятся к одному дню, 2024-07-09, и идут подряд по ходу разговора.</p>\n<p><strong>Версия 1 — 2024-07-09, 21:07–21:09 (id 201616–201621).</strong> При замене вулкана на технологичный остров защитник меняется. Отсюда — что сталкера в прежнем виде в этой вселенной не будет. Слава помечает это как справку: «Ну это я чиста сказал чтобы ты знал». Тут же даётся описание острова-пустыни со сталкером.</p>\n<p><strong>Версия 2 — 2024-07-09, 21:48–21:49 (id 201855–201864).</strong> Вводится ограничение энергии: она не бесконечна, и у избранного её меньше, чем у любого защитника. На вопрос Миколая, как избранный появился, ответ: из фэнтези мира. Вопрос «че это вообще за остров» (id 201860) в этом куске остаётся без ответа.</p>\n<p><strong>Версия 3 — 2024-07-09, 23:15–23:19 (id 202457–202461).</strong> Объясняется, почему деревни не принадлежат островам: защитник не всемогущ, ему и так тяжело. Состав деревень — люди и нелюди — зависит от конкретной деревни. Заканчивается вопросом Миколая «насколько мир большой?» (id 202461), ответа на который в этом куске нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0034-S05", "MR-0034--probely"], "h": "<div class=\"gaps\"><ul>\n<li>В чём состоит работа защитника и на что тратится энергия — не описано.</li>\n<li>Как назначается или появляется защитник острова (кроме того, что избранный пришёл из фэнтези мира) — не сказано.</li>\n<li>Восстанавливается ли энергия и как — не сказано.</li>\n<li>Кто защищает деревни вне островов, если защитники до них не дотягиваются, — осталось нерешённым.</li>\n<li>Размер мира — вопрос задан (id 202461), ответа в записи нет.</li>\n<li>Полного списка защитников по островам нет; названы только Антон, Избранный (защитник Асгарда) и Сталкер.</li>\n<li>Кто становится защитником технологичного острова взамен сталкера — не названо.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0034--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0030.html\">Защитники островов</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0034--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-09</td>\n<td>201616–201621</td>\n<td>w0046</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-09</td>\n<td>201855–201864</td>\n<td>w0046</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-09</td>\n<td>202457–202461</td>\n<td>w0046</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0034-zaschitniki-ostrovov.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0034--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0034.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
