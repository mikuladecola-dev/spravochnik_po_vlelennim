<script>const BASE="";const DOCNAME="Сжатие";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0181-S01", "SP-0181--mehanika"], "h": "<p>Способность Палача, одного из четырёх персонажей команды, собранной против Серафима (2025-01-28, id 285363). Формулировка Славы: «Его способность сжатия он может жать пространства чтобы приблизится к противнткк, или сжать атаку противника. Он также может сжимать ауру и делать слэш».</p>\n<p>В переписке названы три применения, и все три описаны одним предложением, без развёрнутых пояснений:</p>\n<ol>\n<li><strong>Сжатие пространства</strong> — ради сближения с противником. Пространство между Палачом и целью сжимается, и за счёт этого он оказывается рядом.</li>\n<li><strong>Сжатие атаки противника</strong> — объектом сжатия становится сама входящая атака.</li>\n<li><strong>Сжатие ауры</strong> — сжатая аура выпускается в виде слэша. Это единственное из трёх применений, которое даёт наступательный удар как таковой.</li>\n</ol>\n<p>Способность прямо связана с ролью носителя в бою: Палач назван «Быстрейший в этой пати», и все его атаки «нацеленый на жизненный важный точки противника». Оружие — катана.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0181-S02", "SP-0181--ogranicheniya-i-cena"], "h": "<p>В переписке не сказано. Ни расхода, ни отката, ни предела дальности сжатия, ни ограничения по числу применений не названо. Не сказано и того, есть ли предел массы или силы атаки, которую можно сжать, — то есть работает ли сжатие атаки против любого удара или только против части.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0181-S03", "SP-0181--nositeli"], "h": "<p>Палач. Других носителей не названо.</p>\n<p>Палач — один из четырёх персонажей, записанных Славой в одном сообщении (2025-01-28, id 285363) как команда, которая «будут сражаться командой против Серафима». Остальные трое и их способности:</p>\n<ul>\n<li><strong>Воительница</strong> — «огромную физическую силу и очень крепка, но скорость на среднем уровни»; способность — «контроль над массой, размером и плотностью, но только на себе или на неживых объектов»; оружие — оружейный браслет, «браслет на котором висят разный холодный орудия, которая она сможет увеличить и сделать плотней».</li>\n<li><strong>Агрегат</strong> — «Имеет средний показатель, но достаточно быстрые Воительницы»; способность — «менять агрегатной состояния неодушевлённых объектов, он может сделать прочным воздух или землю превратить в воду»; оружия не имеет, «точнее сам его создаёт из воздуха за счёт этого оно почти невидимая».</li>\n<li><strong>Имитатор</strong> — «Самый живучий среди них при этом прочность у него ниже чем у Воительницы»; способность — «имитировать способность врага, но лишь одну способность и то ему надо время, но плюс способность в том что он конечно имитирует но способен будет её развить»; оружие — жидкость, которая «моментально может принять любую форму».</li>\n</ul>\n<p>Отдельно оговорено: способность Имитатора — имитация одной вражеской способности. Может ли она быть направлена на Сжатие (то есть на союзника), в переписке не обсуждается.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0181-S04", "SP-0181--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-01-28 (окно w0073, id 285353–285369).</strong> Единственное состояние. Все три применения описаны сразу, в первом же появлении способности. После этого к Сжатию в переписке не возвращались; правок и уточнений нет.</p>\n<p>Контекст записи: Слава сначала предупредил, что «сейчас я запишу персонажей который будут противостоять ему» (id 285353), Миколай согласился (id 285354), после чего в id 285363 пришёл весь список из четырёх персонажей. Завершилось окно ссылкой Миколая на telegra.ph/boi-01-28 (id 285369) — что в ней, в переписке не сказано.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0181-S05", "SP-0181--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Сжатие входит в набор из четырёх способностей, придуманных под одну задачу — противостояние Серафиму. По принципу они соседствуют с контролем массы/размера/плотности (Воительница) и сменой агрегатных состояний (Агрегат): все три работают с физическими параметрами материи и пространства, но разделение между ними в переписке не проговаривалось.</p>\n<p>Прямой связи Сжатия с конкретными способностями Серафима (контроль времени, свет, святой огонь, манипуляция сознанием <a href=\"SP-0177.html\">Манипуляция сознанием</a>, телекинез) в переписке не установлено. То есть не сказано, какое именно применение Сжатия против какой силы Серафима задумано работать, — хотя сама команда собрана именно против него.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Дальше по цене — Серафим, ради которого собрана вся команда. Он разложен на четыре тонкие записи: <code>PS-0209</code> «Серафима» (2 914 знака в базе, ноль ссылок), <code>SP-0187</code> «Силы Серафима» (4 303), <code>SP-0225</code> «Способности Серафима» (3 861), <code>SP-0177</code> «Манипуляция сознанием» (3 114). Четырнадцать килобайт на четыре кода, и на главную из них не ссылается никто. Пробел «не сказано, какое применение Сжатия против какой силы Серафима задумано» чинится не в этой статье, а сведением этих четырёх.</p></div>", "r": [["Манипуляция сознанием", "SP-0177.html"]]}, {"t": "Пробелы", "a": ["S06", "SP-0181-S06", "SP-0181--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Цена и ограничения способности не названы вообще.</li>\n<li>Не сказано, чем «аура» является в этой системе и откуда берётся, — сжимаемая аура упомянута один раз и не определена.</li>\n<li>Не сказано, чужую ауру Палач сжимает или свою.</li>\n<li>Не сказано, на какое расстояние работает сжатие пространства.</li>\n<li>Не сказано, что происходит со сжатой атакой противника после сжатия: гасится ли она, уменьшается, возвращается.</li>\n<li>Происхождение способности (врождённая, полученная, от чего зависит) не обсуждалось.</li>\n<li>Осталось нерешённым, состоялся ли бой команды против Серафима и чем кончился: в переписке дальше этого места тема не идёт.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0181--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0177.html\">Манипуляция сознанием</a></li>\n<li><strong>Упомянут в способностях:</strong> <a href=\"SP-0177.html\">Манипуляция сознанием</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0008.html\">Команда против Серафима («пати»)</a>, <a href=\"GR-0011.html\">Братья и сёстры (благословенные одним правителем)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0181--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-01-28</td>\n<td>285353–285369</td>\n<td>w0073</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0181-szhatie.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0181--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0181.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["SP-0181-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/SP-0181/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым чинить ауру. У неё нет записи вообще: ни статьи, ни исходника, ни кода во вселенной «Апостол». Ближайшее, что есть в базе, — <code>ID-0093</code> «система ауры» (5 172 знака, статьи нет, ноль ссылок) и она приписана к другой вселенной, «монстры»; ещё <code>MR-0156</code> «Запрет на творцов, артефакты, ауру и энергию» (4 121, статьи нет). При этом аура как рабочий механизм проходит не меньше чем через семнадцать статей справочника: <code>SP-0163</code> Благословение, <code>SP-0164</code> и <code>SP-0165</code> (базовые умения благословенных бога и дьявола), <code>SP-0127</code>, <code>SP-0179</code>, <code>SP-0180</code>, <code>PS-0171</code> Палач, <code>PS-0182</code> Агрегат, <code>PS-0226</code> Арбетары, <code>PS-0278</code> Правители, <code>PS-0281</code>, <code>MR-0095</code> Рай, <code>MR-0140</code> и эта. Сжатие ауры — одно из трёх применений способности и единственное, дающее удар; пока аура не сведена в одно место, третье применение описывать не через что.</p>\n<p>Дальше по цене — Серафим, ради которого собрана вся команда. Он разложен на четыре тонкие записи: <code>PS-0209</code> «Серафима» (2 914 знака в базе, ноль ссылок), <code>SP-0187</code> «Силы Серафима» (4 303), <code>SP-0225</code> «Способности Серафима» (3 861), <code>SP-0177</code> «Манипуляция сознанием» (3 114). Четырнадцать килобайт на четыре кода, и на главную из них не ссылается никто. Пробел «не сказано, какое применение Сжатия против какой силы Серафима задумано» чинится не в этой статье, а сведением этих четырёх.</p>\n<h3>С чего начать</h3>\n<p>Аура: материал в базе есть, просто разъехался по трём соседям. <code>SP-0164</code> (2025-01-06, id 278985) — «аура(просто аура)», с авторской оговоркой прямо в перечислении. <code>SP-0165</code> (2025-01-06, id 278987) — аура в наборе благословенных дьявола, тоже без раскрытия. <code>SP-0163</code> (2025-05-31, id 331635) — единственное развёрнутое определение: «аура (то бишь самая энергия, которая выплескивается и заставляет чувствовать страх е животных и обычных людей. Так же способный влиять на окружающей. При сильном скоплении)». То есть на момент записи Сжатия, 2025-01-28, определения ещё не было — оно появилось четыре месяца спустя, и подводить под него слэш Палача задним числом нельзя. Это надо оговорить, а не тянуть.</p>\n<p>В архив — за одним адресом: id 285369, ссылка <code>telegra.ph/boi-01-28</code>, которой Миколай закрывает окно. Что в ней, в переписке не сказано, а название прямо обещает тот самый бой, которого «в переписке дальше нет». Смотреть окно w0073 целиком и соседние дни после 2025-01-28.</p>\n<h3>Как развивалось</h3>\n<p>2025-01-28 — заявили всё сразу: четыре бойца, четыре способности, оружие каждому, роль в бою, одним сообщением (id 285363). Ограничили тут же, но выборочно: Воительнице область действия названа («только на себе или на неживых объектов»), Имитатору — тоже («лишь одну способность и то ему надо время»), Агрегату — «неодушевлённых объектов». Забыли в тот же час: окно закрывается ссылкой, и к Сжатию больше не возвращаются никогда. Вернулись к носителю, но мимо способности: 2025-05-19 Палач переписан целиком — уже не боец из пати, а осколок сознания с топором вместо катаны; 2025-11-05 он апостол и образец стиля ближнего боя; 2026-06-02 — «Придумаю способность и тебе скину». То есть через шестнадцать месяцев способность объявлена ненаписанной, при том что Сжатие не отменено и не упомянуто.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для Воительницы и Агрегата очерчено, на что способность не действует: у одной — «только на себе или на неживых объектов», у другого — «неодушевлённых объектов». Оба ограничения про одно и то же — живое исключено. Сжатие описано в том же сообщении, тем же перечислением, и объект у него не ограничен ничем: пространство, атака, аура. Можно ли сжать противника — не сказано ни да, ни нет. Для двух из трёх «физических» способностей команды граница живого проведена, для третьей такого же рода — нет.</p>\n<h3>Отклик</h3>\n<p>Понравилось, как экономно тут придуман быстрейший боец: скорость ему дана не ногами, а тем, что он убирает расстояние — сжимает пространство и оказывается рядом. Скорость как свойство мира, а не тела. И вся способность получается странно оборонительной для того, у кого все атаки «нацеленый на жизненный важный точки»: из трёх применений два — про то, как добраться и как погасить, и только третье бьёт. Ещё зацепило, что четверо придуманы под одного противника, каждому выдана ниша и оружие вплоть до браслета с висящими на нём железками, — и бой не состоялся. Команда собрана, экипирована, пронумерована по скорости и прочности, и на этом её жизнь кончается ссылкой на telegra.ph. Из четверых дальше пошёл только Имитатор, а Палача через полтора года пришлось придумывать заново, будто сжатия и не было.</p></div>", "r": []}];</script>
