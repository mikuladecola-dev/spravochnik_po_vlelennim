<script>const BASE="";const DOCNAME="Радужные глаза";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0252-S01", "SP-0252--mehanika"], "h": "<p>Основа описания дана через сравнение с живописью (2025-12-04, id 392466): «Просто человек у которого глаза цвета радуги. И вот ты видел как картина не высохшая течёт. Он может так сделать со всем миром. для него все состоит из красок». Автор тут же отметил, что механику трудно объяснить, — на этом объяснение в переписке и остановилось.</p>\n<p>То есть носитель воспринимает мир как состоящий из красок и способен привести его в состояние невысохшей картины, где краски начинают течь.</p>\n<p>Работа способности показана в прозаическом фрагменте того же сообщения. Там она включается вместе со сменой цвета глаз: до применения у персонажа чёрные глаза, в момент действия — «его глаза уже не были черными. Они были всех цветов радуги».</p>\n<p>Что происходит при применении, по фрагменту:</p>\n<ul>\n<li>Мир начинает течь: «Весь мир поплыл. Словно краски начала растекаться по картине».</li>\n<li>Растекание захватывает предметы и людей: костёр растаял, сестра героя тоже таяла, «Её лицо превратилась в смазанную картину». Удержать её руками нельзя — «она все истекала, он не мог её ухватить».</li>\n<li>Поверхность мира становится проходимой, но ненадёжной: герой бежит «По мокрому и жидкому миру», раз за разом падая.</li>\n<li>Наступает тишина: убийство совершено среди дня, но никто не кричит.</li>\n<li>Воткнутый в тело меч не вытаскивается.</li>\n<li>Прикосновение носителя завершает действие: «рука медленно опускалась на его лицо».</li>\n</ul>\n<p>Результат виден в финальной сцене фрагмента. Юнец сообщает в палатке: «Голова трупа словно просто растаяла. Словно на картине просто перемещали краски. И ещё он словно из неоткуда появился. Пряма на ногах его сестры». То есть после применения тело оказалось перемещённым в другое место — «словно из неоткуда появился», — а голова растаяла так, как если бы краски на картине сдвинули. Вопрос про труп в палатке задаёт «черноглазые мужчина»: убитый ударом в шею жив и на месте, а трупом оказался нападавший.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0252-S02", "SP-0252--ogranicheniya-i-cena"], "h": "<p>Ограничений и цены применения в переписке не названо.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0252-S03", "SP-0252--nositeli"], "h": "<p>Носитель один. Прямая формулировка: «Радужные глаза только для одного челика» (id 392478).</p>\n<p>Этот носитель — Бог красок; способность заявлена как его часть. В прозаическом фрагменте он же — главнокомандующий с чёрными глазами, в чью палатку идёт убийца.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0252-S04", "SP-0252--kak-menyalas-po-versiyam"], "h": "<p>Версия 1 — 2025-12-04 (id 392466–392492, окно w0112). Единственное состояние: описание через текущие краски, прозаический фрагмент с применением и указание на единственного носителя. Позже описание не менялось.</p>\n<p>Внутри этого же дня уточнён статус радужных глаз в общей системе: они названы третьей из трёх пар глаз (id 392478).</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0252-S05", "SP-0252--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Радужные глаза входят в набор «Три пары глаз» (id 392478):</p>\n<ol>\n<li>«Первые белые апостола. Способны видеть оэм ну ещё чего-нибудь» — что ещё, не решено.</li>\n<li>«Глаза черви. Зрачки у них будут словно состоять из тысячи маленьких червячков и вечно двигаться вызывая отвращения и страх (будет у котов)».</li>\n<li>«Радужные глаза только для одного челика».</li>\n</ol>\n<p>К третьей паре рядом отнесены сведения о котах, у которых вторая пара: «Коты наверное буду типо духами. Будут чисто из Оэм состоять» и «Поэтому запас и понимания Оэм у них больше всех» (id 392486, 392489).</p>\n<p>Связь самих радужных глаз с Оамом/Оэмом в переписке не оговорена: про белые и червивые глаза сказано через Оэм, про радужные — только через краски.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "SP-0252-S06", "SP-0252--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Механика не доведена до объяснения — автор прямо остановился на том, что это трудно объяснить.</li>\n<li>Не сказано, обратимо ли растекание мира и что происходит с местом после применения.</li>\n<li>Не сказано, есть ли предел охвата: фраза «со всем миром» не уточнена — весь мир целиком или участок вокруг.</li>\n<li>Не объяснено, почему меч не вытаскивался и почему наступила тишина, — эти детали показаны в прозе, но не разобраны.</li>\n<li>Не объяснено, как труп оказался перемещённым «пряма на ногах его сестры».</li>\n<li>Не сказано, зачем нужна смена чёрных глаз на радужные — постоянный это облик с переключением или маскировка.</li>\n<li>Место носителя в сюжете осталось нерешённым: «Бог красок. Я не знаю куда его деть. Возможно будет антагонистом», «Как никак сильный и могущественный» (id 392490–392491).</li>\n<li>Характер носителя не продуман: «Ну я даже характер его не продумал. Лишь образ» (id 392492).</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["SP-0252--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-12-04</td>\n<td>392466–392492</td>\n<td>w0112</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0252-raduzhnye-glaza.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0252--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0252.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
