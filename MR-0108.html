<script>const BASE="";const DOCNAME="Сущность";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0108-S01", "MR-0108--ustroystvo"], "h": "<p>Сущности — класс существ, объявленный поверх уже имевшихся к тому моменту Альф, грехов и правителей (2025-01-27, id 284852–284857). Слава вводит их прямым перечислением: «Есть Альфы есть грехи есть правитель», «Будут ещё и сущность».</p>\n<p>Определение родства: «Сущность это дети правитель. У каждого правитель есть выродок». То есть сущность — ребёнок правителя, и у каждого правителя такой выродок имеется; счёт идёт по принципу «один правитель — один выродок».</p>\n<p>По способу действия сущности описаны не как персонажи, а как погодное или геологическое явление: «эти сущность как стихийная катастрофа, как цунами, ураган, вулкан».</p>\n<p>Механика их появления в нашем мире: «они иногда покидают минимиры и прилетають к нам». Дальше два исхода, названные автором прямо:</p>\n<ul>\n<li>буйство — «они начинают буйствовать и благословеный их толпой гасят»;</li>\n<li>спячка — «они просто уходят в спячку».</li>\n</ul>\n<p>Отдельно отмечено, что «один из этих существ живёт и спит в перимутский треугольник» — то есть один экземпляр, ушедший по второму сценарию, локализован в Перимутском треугольнике.</p>\n<p>Убийство сущности имеет последствия за пределами нашего мира: «когда они буйствует и мы их убиваем, то это сказывается на их родном мире». Из этого выведено отношение к благословенным на той стороне: «из-за этого благословенных бояться и знають что они существуют». То есть знание о существовании благословенных в родных мирах сущностей получено именно через гибель сущностей, а не иначе.</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0108-S02", "MR-0108--naselenie"], "h": "<p>Сами сущности и есть население статьи: дети правителей, по одному выродку на правителя. Иных обитателей у сущностей не описано.</p>\n<p>Со стороны нашего мира с ними взаимодействуют благословенные — толпой, в режиме гашения буйствующей сущности.</p>", "r": []}, {"t": "Место во вселенной — как связан с другими мирами", "a": ["S03", "MR-0108-S03", "MR-0108--mesto-vo-vselennoy"], "h": "<p>Сущности принадлежат минимирам и оттуда прилетают к нам; их родной мир страдает от их гибели у нас. Связь между мирами, таким образом, двусторонняя: перемещение идёт в одну сторону (минимиры → наш мир), а последствие смерти отражается обратно.</p>\n<p>Указана прямая привязка к месту в нашем мире — Перимутский треугольник, где спит одна из сущностей.</p>\n<p>По силе сущности поставлены выше Серафима: «они слишком мощные, мощней Серафима» (2025-01-28, id 285529).</p>\n<p>Как связанные в записи перечислены: Альфы, Благословенные, Перимутский треугольник, Правители, Серафим.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0108-S04", "MR-0108--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-01-27 (id 284852–284857).</strong> Введение класса. Сущности объявлены детьми правителей, по выродку на правителя; описаны как стихийное бедствие; описан прилёт в наш мир, два исхода (буйство/спячка), спящий экземпляр в Перимутском треугольнике и обратное действие их убийства на родной мир.</p>\n<p><strong>Версия 2 — 2025-01-28 (id 285526–285532).</strong> Уточнение статуса, а не устройства. Миколай ждал появления сущностей («ваще я ждал что сущности появятся»). Слава отвечает, что в сюжете их пока не будет: «их сложная представить ведь в сюжете пока их не будет так как они слишком мощный, мощней Серафима». То есть класс существует в устройстве вселенной, но выведен за пределы текущего сюжета по двум причинам — сложность представления и избыточная мощность.</p>\n<p>В том же обмене Миколай спрашивает про «цепь связи», Слава отвечает, что она «была только в артефактах, я её после перенёс в орудий». Эта реплика к сущностям не относится и на них не завязана.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0108-S05", "MR-0108--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вселенная нигде в окне не названа прямо; отнесена к «Апостолу» по дате объявления.</li>\n<li>Отношение сущностей к минимирам как таковым и к междумирцам из прошлых окон не проговорено.</li>\n<li>Не сказано, как именно гибель сущности «сказывается» на родном мире — характер и масштаб последствия не описаны.</li>\n<li>Не сказано, сколько сущностей всего, кроме того что у каждого правителя есть выродок; общее число правителей здесь не названо.</li>\n<li>Не сказано, чем определяется выбор между буйством и спячкой при прилёте.</li>\n<li>Не описано, как выглядит сущность и есть ли у неё разум, воля, речь.</li>\n<li>Не сказано, могут ли сущности вернуться в свой мир.</li>\n<li>Появление сущностей в сюжете оставлено нерешённым: на 2025-01-28 их «пока не будет», условия появления не оговорены.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0108--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0024.html\">Протобионты (сущности, дети правителей)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0108--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-01-27</td>\n<td>284852–284857</td>\n<td>w0073</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-28</td>\n<td>285526–285532</td>\n<td>w0073</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0108-suschnost.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0108--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0108.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["MR-0108-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/MR-0108/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — счёт правителей. Вся арифметика сущностей задана одной формулой «один правитель — один выродок», значит число сущностей равно числу правителей, а сколько правителей — не сказано нигде. Материал при этом лежит и не сведён: <code>MR-0120</code> «Правитель» (35 КБ), <code>PS-0278</code> «Правители» (26.8 КБ), <code>MR-0097</code> «Правители миров» (9.6 КБ), <code>MR-0103</code> «Правители минимиров» (3.8 КБ) — четыре отдельные записи об одном и том же, у всех статьи есть, общего счёта нет ни в одной. Пока его нет, эта статья не может сказать, о скольких существах она говорит.</p>\n<p>Вторая дорогая дыра — двойное имя. <code>PS-0280</code> «Протобионты» (18.9 КБ, две ссылки) и <code>MR-0108</code> «Сущность» — это, судя по группе <code>GR-0024</code> «Протобионты (сущности, дети правителей)», одно и то же, но статья про сущностей не знает, что у класса есть второе название с вдвое большим материалом.</p>\n<p>Третья — благословение правителя как механизм: <code>SP-0240</code> (9.8 КБ) и <code>SP-0242</code> (9.6 КБ) статей не имеют вовсе, а «благословеный их толпой гасят» держится именно на них.</p>\n<h3>С чего начать</h3>\n<p>В базе. Сводить: <code>PS-0280</code>, <code>PS-0278</code>, <code>MR-0120</code>, <code>MR-0097</code>, <code>MR-0094</code> «Минимиры» (12.5 КБ), <code>MR-0101</code> «Грехи (существа минимиров)» (4.6 КБ) — грехи по устройству соседний класс из тех же минимиров, а в статье о сущностях они не упомянуты. Серафим, к которому привязано сравнение по силе, разложен на три записи: <code>PS-0209</code>, <code>SP-0187</code>, <code>SP-0225</code> — все мелкие, все со статьями. Перимутский треугольник — <code>MN-0014</code>, 2.4 КБ, статья есть, ссылок на неё ноль, хотя спящая сущность единственная конкретная точка во всей записи.</p>\n<p>В архив — за числом правителей и за тем, чем определяется буйство против спячки. Ориентир: январь 2025, окна w0071–w0073, id 281365–285532 — вся тема правителей, минимиров, грехов и сущностей укладывается в эти две недели.</p>\n<h3>Как развивалось</h3>\n<p>2025-01-27 — класс объявлен целиком за одно окно: родство, механика прилёта, два исхода, обратное действие смерти. 2025-01-28, назавтра — ограничение: Миколай ждал появления сущностей, Слава выводит их за пределы сюжета по двум названным причинам, сложности и мощности. Дальше в материале записи возвратов нет. Между вводом и изъятием — один день.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Счёт задан жёстко: у каждого правителя есть выродок. В соседней записи <code>MR-0103</code> Бог и дьявол названы правителями наравне с прочими — и вот про них не сказано, попадают ли они под то же правило, есть ли выродок у Бога и выродок у дьявола. Для правителей минимиров формула названа, для двух правителей, объявленных им равными, — нет.</p>\n<h3>Отклик</h3>\n<p>Зацепила экономика узнавания: о существовании благословенных на той стороне знают не потому, что кто-то туда ходил, а потому что там чувствуют смерть своих. Знание доходит одним каналом — через потерю. Это придумано в одной фразе и без пояснений, и оно лучше держит связь двух миров, чем любое описание перехода. И спящая сущность в Перимутском треугольнике — хороший ход: взять готовую земную байку и назначить ей причину, не объясняя её. Ограничение назавтра тоже по-своему честное — «слишком мощный, мощней Серафима» это ведь признание, что класс сломает сюжет, и он отложен, а не переписан под размер.</p></div>", "r": []}];</script>
