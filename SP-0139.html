<script>const BASE="";const DOCNAME="Табу";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0139-S01", "SP-0139--mehanika"], "h": "<p>Понятие «табу» (у Славы также «дабу») возникает в один вечер дважды, в двух несовпадающих значениях. Второй вариант вытеснил первый по итогу разговора, но первый не был переформулирован — он был отвергнут вместе с той картиной маны, на которой держался.</p>\n<p><strong>Табу как запрет (формулировка Миколая, 2024-12-21, id 272508).</strong> Дословно: «Табу - это запреты, направленные на защиту маны и предотвращение ее загрязнения или утечки». Из этого Миколай сразу выводил вторую сущность: «тогда помимо магии будет скверна» (id 272510), «миазмы всякие» (id 272516). Основание — прочитанное им о мане и её происхождении (id 272519–272522).</p>\n<p><strong>Табу как клятва (формулировка Славы, 2024-12-21, id 272859).</strong> Дословно: «Давай клятву типо я не убью, я не ем мясо и т.п. И чем сложней дабу чем сильней ты будешь». То есть табу — добровольно принятое на себя ограничение, а не внешний запрет, и его сложность прямо конвертируется в силу носителя. Миколай подытожил это одним словом: «принципы» (id 272863), и Слава принял: «Все понял», «Ок» (id 272864–272865).</p>\n<p>Промежуточное толкование Миколая перед этим — «то че делать нельзя» (id 272852) и «вот кто-то сказал, так делать нельзя и всё» (id 272855) — Слава дважды отверг: «Нет», «Нет» (id 272853–272854). То есть табу именно самоналоженное, а не предписанное кем-то извне.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0139-S02", "SP-0139--ogranicheniya-i-cena"], "h": "<p>Цена табу — само содержание клятвы: носитель отказывается от чего-то («я не убью», «я не ем мясо»), и чем труднее отказ, тем сильнее он становится. Механика связи задана только этой формулировкой — «чем сложней дабу чем сильней ты будешь» (2024-12-21, id 272859). Как измеряется сложность табу, что происходит при нарушении клятвы, можно ли взять несколько табу сразу — в переписке не сказано.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0139-S03", "SP-0139--nositeli"], "h": "<p>Конкретных носителей табу в переписке не названо. Формулировка дана в общем виде — «ты», без привязки к персонажу или сословию.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0139-S04", "SP-0139--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 (2024-12-21, id 272508–272523).</strong> Табу — запреты, защищающие ману от загрязнения и утечки (Миколай). Из этого выводится скверна. Слава отказывается от самой идеи загрязнения маны: «Какой загрязнения откуда ты это взял» (id 272517), «Не у меня чуть другие представления о Мане» (id 272521). На предложение «тогда помимо магии будет скверна» ответ — «Нет» (id 272510–272511).</p>\n<p><strong>Версия 2 (2024-12-21, id 272846–272865), тот же вечер, ближе к концу окна.</strong> Заход инициирует Слава: «Кстати ты знаешь вообще что такое дабу» (id 272846). Табу переопределено как клятва, дающая силу пропорционально своей сложности. Определение через запрет отброшено внутри самого разговора (id 272852–272854).</p>\n<p>Параллельно во втором заходе идёт разговор о мане и скверне, накладывающийся на реплики о табу. Из него — представления Славы о мане: «Любой объект выделяют Ману. Но не каждой живой существо способное её использовать» (id 272851). И его же напоминание о ранее принятой договорённости про скверну: «Мы же договаривались что это будет как яд созданный разумным существом» (id 272856). Миколай при этом описывает свою линию: у монстров мана ядовитая (id 272848–272849), «ядом демоны наделяют животных» (id 272858), «те отравляются и агресируют» (id 272860), «становятся злом» (id 272861).</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0139-S05", "SP-0139--svyaz-s-drugimi-sposobnostyami"], "h": "<ul>\n<li><strong>Мана.</strong> В первой версии табу существует ради защиты маны; во второй эта связь отпадает, и связь табу с маной больше не названа — в переписке не сказано, расходует ли табу ману или работает помимо неё.</li>\n<li><strong>Скверна (ядовитая мана).</strong> Выведена Миколаем из первой версии табу как её следствие. После отклонения первой версии скверна остаётся в разговоре, но уже не через табу, а как «яд созданный разумным существом» по более ранней договорённости (id 272856).</li>\n</ul>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S06", "SP-0139-S06", "SP-0139--otklonennye-varianty"], "h": "<ul>\n<li><strong>Табу как защита маны от загрязнения и утечки</strong> (Миколай, id 272508). Отклонено Славой вместе с самим понятием загрязнения маны: «Какой загрязнения откуда ты это взял», «Не у меня чуть другие представления о Мане».</li>\n<li><strong>Скверна как следствие табу</strong> — «тогда помимо магии будет скверна» (id 272510). Ответ: «Нет» (id 272511). Скверна как таковая при этом сохранена, но на другом основании.</li>\n<li><strong>Табу как внешний запрет</strong> — «то че делать нельзя», «вот кто-то сказал, так делать нельзя и всё» (id 272852, 272855). Отклонено дважды: «Нет», «Нет».</li>\n<li><strong>Миазмы</strong> (id 272516) — упомянуты Миколаем в связке с загрязнением маны, дальше не развиты и вместе с первой версией отпали.</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S07", "SP-0139-S07", "SP-0139--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Что происходит при нарушении табу — в переписке не сказано.</li>\n<li>Как именно сложность табу переводится в силу, и в какую именно силу — не описано.</li>\n<li>Кто и что накладывает табу, есть ли обряд или свидетель — не сказано; отвергнуто лишь то, что запрет приходит извне.</li>\n<li>Можно ли держать несколько табу одновременно, можно ли снять взятое — осталось нерешённым.</li>\n<li>Носители не названы.</li>\n<li>Соотношение табу с маной после отказа от первой версии не переопределено.</li>\n<li>Реплики о табу во второй версии перемежаются репликами о мане и скверне, идущими встречным потоком; какие из них Миколай адресовал табу, а какие — своей линии про демонов и ядовитую ману, из текста однозначно не восстанавливается.</li>\n<li>Вселенная записи помечена как «неясно»: разговор идёт 2024-12-21, в тот же день, когда объявлена безымянная средневековая вселенная (id 272184), но прямой привязки в переписке не сказано.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["SP-0139--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-12-21</td>\n<td>272508–272523</td>\n<td>w0067</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-21</td>\n<td>272846–272865</td>\n<td>w0067</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0139-tabu.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0139--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0139.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
