<script>const BASE="";const DOCNAME="Глаза Имитатора";
const LEAD="<p>Способность вселенной «7 островов». Даты: 2024-12-13 — 2026-06-07, окна w0066 и w0121, три версии. Вариант названия в исходнике: «владелец глаз».</p>";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0132-S01", "SP-0132--mehanika"], "h": "<p>Глаза Имитатора видят чужую структуру и позволяют её воспроизвести. Формулировка Славы (2024-12-13, id 269866, дословно повторённая 2026-06-07, id 488504): «его глазки способны видеть чужую структуры и так как у него самого нет структуры то он может с помощью частиц сформировать чужую структуру опять же на время да и структура которую имитируют в разы несовершенной по сравнений с оригиналом».</p>\n<p>Механика опирается на общее устройство мира, заданное в той же карточке: у людей есть структура, дающая способности («структура дающий способности»), и способности привязаны к тому, к чему структура относится — например, обладателю структуры воды создать воду ничего не стоит. У Имитатора структура «так и не смогла сформироваться», вместо неё — частицы. Именно отсутствие собственной структуры и делает возможной подстановку чужой: своё место не занято.</p>\n<p>Таким образом способность состоит из двух шагов: увидеть структуру и собрать её копию из частиц. Копия временная и «в разы несовершеннее» оригинала.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0132-S02", "SP-0132--ogranicheniya-i-cena"], "h": "<ul>\n<li><strong>Временность.</strong> Сформированная чужая структура держится только «на время». Срок не назван.</li>\n<li><strong>Качество копии.</strong> Имитированная структура «в разы несовершенной по сравнений с оригиналом». Насколько именно — не уточнено.</li>\n<li><strong>Минусы частиц</strong> (общие для всего, что Имитатор делает частицами, id 269866): «плохой контроль; слабая способность накопления ( маленькая количество энергий)».</li>\n<li>Расход энергии конкретно на работу глаз не указан. Для соседней способности — материализации — расход оговорён отдельно: «но энергий тратится дофига».</li>\n</ul>\n<p>Показания о контроле в переписке расходятся и не сведены: в карточке (id 269866) плохой контроль назван минусом частиц, а в следующем сообщении того же вечера (id 269881) сказано «В третьих у него идеальный контроль». Какое из двух состояний итоговое — в переписке не решено.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0132-S03", "SP-0132--nositeli"], "h": "<p>Носитель — Имитатор, он же Имет: «Имитатор мужчина, Владелец глаз». Он назван сильнейшим носителем в своей категории: «В четвёртых сильнейший владелец глаз( то бишь лучший всех их использует)» (2024-12-13, id 269881).</p>\n<p>Категория «владельцы глаз» подразумевает, что глаза есть не у него одного, но кто ещё в неё входит — в переписке не сказано.</p>\n<p>Прочие характеристики Имитатора из того же перечня (id 269881): «Во первых он самый живучий из за \"Я не умру пока не кончится энергия\"», «Во вторых в плане усилений он опять же сильнейший». Его манера боя описана так: «В битве он всегда хочет научится чего то новому поэтому почти некогда не сражается на все 100 в самом начале он ждёт когда его противник раскроет все карты чтобы чего нибудь научится, в большинство битвах он получает серьезный урон всего тела из за того что не сражается на все 100 в самом начале но даже так он один из сильнейших». Прямой связи между этим ожиданием раскрытых карт и работой глаз в переписке не проговорено.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0132-S04", "SP-0132--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-12-13 (id 269866, окно w0066).</strong> Глаза описаны в общей карточке Имитатора, последним пунктом после пяти других способностей. Здесь задано всё содержание механики: зрение структуры, отсутствие собственной структуры, сборка чужой из частиц, временность, несовершенство копии.</p>\n<p><strong>Версия 2 — 2024-12-13 (id 269881–269883, окно w0066).</strong> Уточнение статуса: Имитатор — «сильнейший владелец глаз( то бишь лучший всех их использует)». Механика глаз не меняется, добавляется место носителя в иерархии. В этом же обмене Миколай формулирует общий уровень сильных персонажей: «сильные же имеют такие возможности, которые разрушают некоторые системы или контролируют их, но это просто слова, я не знаю как точно описать». Слава отвечает конкретикой не про глаза, а про усиление: «Вот его удар с особым усилением способен уничтожить многоэтажку».</p>\n<p><strong>Версия 3 — 2026-06-07 (id 488504–488506, окно w0121).</strong> Повтор прежней мысли: Слава заново выкладывает ту же карточку целиком, слово в слово с версией 1, вместе с минусами частиц (плохой контроль, малое накопление энергии). Контекст — поиск старого материала: «нашёл?» — «Вот». Правок в описании глаз нет. Вселенная в этом окне не объявлена, проставлена по дате.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0132-S05", "SP-0132--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Глаза — шестая и последняя позиция в перечне способностей Имитатора. Остальные пять (id 269866, повтор id 488504):</p>\n<ul>\n<li><strong>Особая усиления</strong> — «когда другие усиливают просто часть тела или все тела имитатор усиливает каждую волокна мышцы каждый кость из за этого его усиления раза 10 больше чем у обычных людей». Удар с особым усилением «способен уничтожить многоэтажку» (id 269883).</li>\n<li><strong>«Я не умру пока не кончится энергия»</strong> — в карточке пояснения нет: «но здесь понятно». Через неё объясняется его живучесть.</li>\n<li><strong>Материализация</strong> — «он может из частиц энергий создать любой не живой предмет но энергий тратится дофига ( если что обычный тоже так могут но то к чему относится структура например структура воды ты можешь без каких проблем создать воду )».</li>\n<li><strong>Волнистый удар</strong> — «удар составляющий структура колебаться из за этого все действующий способности отменяются например ты запустил огненный шар и держишь его где то в воздухе по после того как тебя ударили этот огненный шар исчезает но после удара ты сразу сможешь использовать способность».</li>\n<li><strong>Удар разрушающий структуру</strong> — «чтобы использовать этот удар тебе надо полностью отказаться от защиты да и плюсом твой мозг будет по тихонько сгорать если попытается его использовать, сам удар разрушает структуру на время дела оппонента чуть ли не простым человеком».</li>\n</ul>\n<p>Общая для всего набора основа — частицы вместо структуры. Глаза, материализация и оба удара в карточке связаны с темой структуры: первые видят и копируют её, волнистый удар заставляет её колебаться, разрушающий удар временно её сносит. Прямо эта система в переписке не сведена в одно правило — перечислены отдельные пункты.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "SP-0132-S06", "SP-0132--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Срок, на который держится скопированная структура, не назван.</li>\n<li>Насколько именно копия хуже оригинала — сказано только «в разы».</li>\n<li>Не сказано, сколько структур можно держать одновременно и можно ли скопированную структуру сменить до истечения срока.</li>\n<li>Не сказано, нужно ли видеть носителя структуры в момент имитации или достаточно однажды увиденной структуры.</li>\n<li>Расход энергии на работу глаз не указан.</li>\n<li>Категория «владельцы глаз» упомянута, но кто ещё в неё входит — не сказано (окно w0066).</li>\n<li>Противоречие «плохой контроль» (минус частиц) и «идеальный контроль» (id 269881) в переписке не разрешено.</li>\n<li>Миколай прямо отмечает, что уровень сильных персонажей у него не описан точно: «это просто слова, я не знаю как точно описать».</li>\n<li>Правок между 2024-12-13 и 2026-06-07 нет: за полтора года описание глаз не менялось, только было выложено повторно.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0132--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0383.html\">Имитатор</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0132--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-12-13</td>\n<td>269866–269866</td>\n<td>w0066</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-13</td>\n<td>269881–269883</td>\n<td>w0066</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-07</td>\n<td>488504–488506</td>\n<td>w0121</td>\n<td>неясно (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0132-glaza-imitatora.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0132--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0132.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
