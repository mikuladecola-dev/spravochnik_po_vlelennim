<script>const BASE="";const DOCNAME="Дядон Гомбевский";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0037-S01", "PS-0037--proishozhdenie"], "h": "<p>Персонаж вселенной «игра бога», придуман Миколаем. Введён одним сообщением — карточкой (2024-04-02, id 153325, окно w0029). Одна версия, к персонажу не возвращались.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0037-S02", "PS-0037--vneshnost"], "h": "<p>«Среднего роста и крупного телосложения мужчина 45 лет». Больше о внешности ничего не сказано.</p>\n<p>Телосложение здесь связано со способностью: масса — то, чем он оперирует.</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0037-S03", "PS-0037--sposobnosti"], "h": "<p>Названы две.</p>\n<p><strong>Медвежьи руки.</strong> «Способность превращать руки в медвежьи и направлять туды всю массу» — руки превращаются в медвежьи, и в них перекачивается вся масса тела. То есть это не просто изменение формы: масса собирается в руках.</p>\n<p>Что происходит с остальным телом, когда вся масса ушла в руки, в переписке не сказано.</p>\n<p><strong>Невидимость от голосов.</strong> «невидимость если слышит больше 3 голосов» — способность включается по условию: он должен слышать больше трёх голосов. Условие завязано на слух, а не на количество присутствующих: сказано именно «слышит».</p>\n<p>Обе способности перечислены подряд, связь между ними не оговорена — вторая введена словами «И ещё одна».</p>", "r": []}, {"t": "Как менялся", "a": ["S04", "PS-0037-S04", "PS-0037--kak-menyalsya"], "h": "<p>Одно состояние.</p>\n<ul>\n<li><strong>2024-04-02 (id 153325, окно w0029)</strong> — полная карточка с двумя способностями: мужчина 45 лет, среднего роста, крупного телосложения; превращение рук в медвежьи с перекачкой туда всей массы; невидимость при более чем трёх слышимых голосах.</li>\n</ul>\n<p>Правок после этого не было.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "PS-0037-S05", "PS-0037--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Характер не описан — в карточке только внешность и способности.</li>\n<li>Не сказано, что даёт перекачка всей массы в руки: сила удара, вес, прочность — эффект не назван.</li>\n<li>Не сказано, что становится с остальным телом при перекачке массы.</li>\n<li>Невидимость: не сказано, включается ли она сама или по воле персонажа, сколько держится и что происходит, когда голосов становится три или меньше.</li>\n<li>Не сказано, считаются ли голоса живых людей, любые голоса, записи.</li>\n<li>Связи с другими персонажами не названы.</li>\n<li>Судьба персонажа не описана.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0037--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0049.html\">Команда Миколая (10 персонажей игры бога)</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0049.html\">Команда Миколая (10 персонажей игры бога)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0014.html\">игра бога</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0037--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-04-02</td>\n<td>153325–153325</td>\n<td>w0029</td>\n<td>игра бога (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0037-dyadon-gombevskiy.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0037--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0037.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
