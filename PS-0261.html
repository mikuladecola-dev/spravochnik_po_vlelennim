<script>const BASE="";const DOCNAME="Иван Васильевич";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0261-S01", "PS-0261--proishozhdenie"], "h": "<p>Иван Васильевич — рассказчик истории про бригаду лесорубов и пещеру, ведущий повествование от первого лица. Появляется 2025-05-02 (окно w0089, id 323364–323370) сразу целиком: вступление-обращение к читателям, представление, вся история похода в пещеру и эпилог. Варианты имени в карточке: Ваня, Иван, дровосек, лесоруб. Вселенные по карточке — Апостол и Нимб (проставлены по дате объявления, в самих окнах вселенная не названа).</p>\n<p>Текст начинается с обращения и тут же с отказа от него: «Здравствуйте дорогие читатели. Тьфу. Как то слишком много официоза. Не думаете?» Цель заявлена прямо: «Моя цель проста, рассказать свою историю. И вы уже сами в конце решите, кто я. Джентльмен третьего поколения, чёрствый хлеб или псих о котором психушка плачет.» Из трёх этих образов он выбирает третий: «Да упаси Бог, я бы выбрал псих. Ведь это означало бы, что именно я какой-то не такой, а не мир поехал с ума.»</p>\n<p>Представляется он так: «Я Иван Васильевич. Простой имя легко запомнить. Я был дровосеком. Ну не прям дровосеком, как из мультиков, который одни по лесу шагают. Я же был с бригадой. Мы вместе рубили лес.» Отдельно оговаривает законность работы: «И не подумайте, всё законное. Мы не какие-то там браконьеры или вроде того. Свою матушку Россию со всеми еë недостатками, я всё равно люблю. Поэтому, как либо вредить ей. Я не намерен.» Позже он так же отдельно оговаривает законность оружия: «И повторюсь мы не браконьеры. Оружия у нас законно.»</p>\n<p>Возраст и биография даны через одну фразу: «я мужик уже за тридцать, который пол жизни отдал работе лесоруба. Привыкший, каким либо невзгодам, плохой погоди, холоду зимой на столь сильному, что аж кости дрожать. Или жизнь в бедности, когда едва хватает денег на хлеб.»</p>\n<h3>Обстановка событий</h3>\n<p>Время — осень, «где то в октябре», точнее он не помнит: «Сейчас уже точно не припомню.» Место — тайга, участок под вырубку рядом с горой, в которой много пещер. Пещеру он определил как природную по отсутствию опор: «Природный пещеры вроде как. Ну я не увидел там опор, поэтому посчитал эту пещеру природной.» В бригаде было 8 человек.</p>\n<p>Первое, что происходит с Иваном на месте, — потеря главного его качества: «было, какой-то падкая чувство идущий опасности. Я сам не понял откуда у меня это чувство появилось. И даже как-то застеснялся этого страха.» И далее: «я всегда выбирался из этих бед благодаря моему самому главному, как по мне качеству хладнокровию. И вот сейчас это хладнокровия слетела с меня. Моей самое главное качество в жизни просто исчезла. Просто так, без какой-то либо причины.»</p>\n<p>Бригада замечает его состояние и решает, что он болеет. Бригадир говорит: «ты если болеешь езжай домой. Лучше сразу езжай нежели с тобой, что здесь случиться. Потом же мне отвечать.» Иван отговаривается тем, что «просто старею слегка поэтому и вымотался». За ужином разговор не клеится — «Как будто не только на меня одного этот лес давит».</p>\n<h3>Поход в пещеру</h3>\n<p>Инициатор — Игорь, самый младший: «а может давайте в пещеру сгоняем». Остальные отказываются («да чего туда соваться, обвалится ещё»), спорят про ночь и про обед, но поход поддерживает бригадир: «да ладно вы. Поедите быстро да и сходите». Бригаду это удивляет, и решение принимается словами «ну раз даже бригадир предлагает, грех уже будет не сходить».</p>\n<p>Вечером Иван спрашивает бригадира наедине, почему тот поддержал Игоря. Ответ: «место здесь странная. Гнетущая какая-то. Вот тебя, как подкосила»; «не перебивая слушай не только тебя подкосила оглянись все, как не в себе. Вот я и подумал может вам развёлся надо. Всё же лучше эту проблему сразу устранить. Нежели потом расхлебывать». Иван комментирует: «бригадир всегда был таким человеком, который хочет потушить угли нежели потом тушить пожар. Хороший мужик.»</p>\n<p>Снаряжения не берут — только фонарик, который «валялся в машине фиг пойми сколько» и в пещере оказался почти бесполезным (садились батарейки). Подъём по склону тяжёлый: «Камни грязь, да ещё и под углом», поднялись примерно на пять метров. Иван заранее боится двух вещей: обвала («Сколько обвалом было на наших шахтах, а здесь просто пещера и риск еë обрушения явно повыше будет чем у шахте») и того, что пещера занята медведем. Бригадир остался снаружи следить за лагерем и вещами.</p>\n<p>Внутрь лезут по одному через узкий вход, Иван — третьим, в полуприседе; дальше пещера расширяется. Михаил, самый крупный, застревает и рвёт кофту. Первым в глубину идёт Тоха как навигатор. Атмосфера: «В пещере было не то чтобы страшно, неуютно. Мы то лесорубы привыкли на воздухе быть, а здесь пещера маленькая, тесная и темная. Да и в уши бьёт едва слышимый звук падения капли воды.»</p>\n<p>Тоха останавливается со словами «там что-то двигается» и внятно объяснить не может — «То тьма, то нога, то тень, какая тень во тьме». Бригада различает «движения чёрном на черном». Существо, поняв, что его заметили, кричит. Крик описан так: «Это словно рёв зверя и человека который только что понял, что оказался в ситуаций хуже смерти. Жалостный но страшный рев пронеся по пещере.»</p>\n<p>Побег: Тоха проталкивается вперёд и координирует бег, иначе, по словам Ивана, «разбежались бы мы по этой пещере и забывая как звали». Иван бежит последним, у выхода бригада застревает в лазе, и он выпинывает всех наружу: «Да некультурно и некрасиво. Но знаете мне было глубоко насрать на это, когда за тобой бежит какая-то фигня и ты бежишь последний тебе может быть на многое насрать.» Вылетев из лаза, все катятся кубарем по крутому склону. Ивану ветка протыкает плечо, камни бьют по рёбрам и голове.</p>\n<p>Внизу бригада бежит к бригадиру, тот решает, что за ними медведь, и залезает на дерево «быстро так словно не 50 летний мужик, а малец какой». Иван лезет на соседнее дерево и этим движением загоняет ветку в плече ещё глубже, чего в тот момент не чувствует.</p>\n<h3>Первая реакция бригадира</h3>\n<p>С дерева бригадир видит, что за ними никого нет, и начинает расспрашивать Ивана, а тот молчит. Рассказывает Игорь — «сбивчиво запинаясь и яркая жестикулируя». Бригадир скептичен: «вы серьёзно зверька кого-то испугались. Туда наверняка какая нибудь белка залезла или лиса. А вы как дети малый испугались». Игорь возражает: «это человек был наверное». Бригадир: «и что. Человека испугалась. Может пранкер какой. Нынче сейчас же это модное. А если там кто-то застрял и потерялся то надо вызывать МЧС и скорую возможно и полицию», — и, посмотрев на торчащую из плеча ветку, добавляет: «да и вам бы не помешало».</p>\n<p>Иван собирает разбежавшихся — одного приходится нести на руках, тот «ногу вспорол до кости». В палатке оказывают первую помощь; Иван сам вытаскивает из плеча ветку, которую называет «ветку падлу»: «А падла она потому что не прямая ветка, а с изгибами. Поэтому больнее вытаскивать было. Перетерпел да и вытащил.»</p>\n<p>Бригадир сообщает, что помощь придёт только завтра: «Тайна все же. Удачей будет если в радиусе 100км есть населённый пункты». Список пострадавших со слов Ивана: у одного нога вспорота, у другого «рука из сустава вылетела» (вправлять не рискнули), у третьего «ключица кажись сломана». Относительно целыми Иван считает Тоху, Мишу, Игоря и себя — бригадир поправляет: «Четверо. Посмотри на себя. Да у тебя же не одного живого места нет.» Реакция бригадира на всю ситуацию: «как вы так то. Здоровый мужики об ехавших матушку Россию не один раз и где только не побывали и вот так всём в больничку отлететь. Кто узнаёт на смех поднимут.» Иван при этом чувствует жалость к нему и вину.</p>\n<h3>Дежурство у пещеры</h3>\n<p>Указание «сверху», переданное бригадиром: в пещеру не спускаться и туриста не искать, но постоять у входа и покричать — «Наверное чтобы турист услышал и сам пришел». Бригадир усмехается над этим «словно вспомнил анекдот» и предполагает, что искать не велели именно после его рассказа о том, «как вы филигранно спустились с горы».</p>\n<p>Из пятерых ходячих бригадир хотел ставить дежурных по одному, но Игорь и Миша отказались категорически; выставили парами — Иван с Тохой и Игорь с Михаилом, смена каждый час. Иван замечает про себя: «Хотя я всё же хотел пойти с Мишой с ним как-то надёжнее.» Выдают две двустволки; изначально хотели отдать оба ружья дежурной группе, но побоялись оставлять раненых в лагере без оружия, поэтому по одному на группу — одна дежурит, вторая охраняет лагерь.</p>\n<p>Дежурство идёт спокойно до ночи. Иван рассуждает о страхе: «И здесь неплохо таки помогал страх. Не давал расслабиться и держал на чеку. Все же как не суди, но благодаря только страху наши первобытный предки выживали. Поэтому страх это неплохой инструмент для выживания.»</p>\n<p>Ночью Тоха шарахается от входа и бежит. Иван «как последний дурак» заглядывает сам, ничего не видит, но тоже бежит — медленнее, потому что «страх был маленьким». Догоняет Тоху только после того, как слышит «Тот самый, рев, который и не рев вообще»: «Неплохую мотивацию дал мне этот рев. Я за два прыжка догнал Тоху». Про ружья оба забывают: «Позабыв, что мы вообще то вооруженные. Просто как то из головы вылетела.»</p>\n<p>В лагере они вспоминают про оружие и смеются над собой, будучи уверены, что тварь не может покинуть пещеру. Их бег переполошил лагерь, кто-то кричал на них — «Но после это крик из ругаещего превратился в крик ужаса. Когда Тоху в спину врезалась тварь то та.»</p>\n<h3>Бой в лагере</h3>\n<p>Тоха гибнет первым — тварь бьёт его в спину головным лезвием. Иван стоит рядом, ему в лицо бьёт горячая кровь, он на мгновение слепнет и паникует: «Здесь тварь какая-та, а я её не вижу. Что ещё может быть страшнее.» Тварь бросается не на него, а на толпу.</p>\n<p>Михаил единственный не побежал, а прицелился и выстрелил — «Хладнокровен чем кто либо в бригаде». Попадание в бок отбрасывает тварь, но не убивает; крови нет, течёт «Что-то только черная, как смола». Миша бросает бесполезную двустволку и лезет на дерево; тварь начинает рубить дерево лбом — «своим лбом буквально рубит деревья, как почти что мы. Только сильнее быстрее и вертикально».</p>\n<p>Иван в это время безуспешно ищет пульс у Тохи, потом выхватывает ружьё из его рук и попадает твари в голову «чуть ли не на обумь». Эффекта нет: «Лишь слегка разлетелась та жижа в нём и все.» Тварь переключается на него. Иван бежит к машине, машина заперта («Кто сука мать его закрывает машину среди леса, кто в ней залезет. Медведь что-ли»), он запрыгивает на крышу, падает с другой стороны, лезет через капот; тварь повторяет манёвр — «тварь то это к сожалению оказалось умный». Он уворачивается прыжком в сторону.</p>\n<p>Обессилев, Иван бежит к деревьям и падает — «ноги просто отказали». Именно падение спасает: бросок твари приходится не в спину, а в руку — «Разрывая плоть и ломая кости. Она вывихнула мне руку. И содрала с неë коже с плотью.» Боль возвращает силы: «Ноги, который только что были ватными, налились силой. И я побежал. И на расстоянии одного метра запрыгнул на дерево. И чуть ли не зубами лезь вверх.»</p>\n<p>На дереве его удерживает от падения бригадир. Тварь начинает рубить это дерево злее, чем предыдущее, пробивая ствол насквозь. Бригадир спрыгивает вниз, с матом бежит к другому дереву и машет руками, отвлекая тварь; Иван и остальные начинают орать — «кто ругать, кто громко песню петь, кто молитву». Миша и раненый в ногу спрыгивают, заряжают обе двустволки, и, как только бригадир оказывается на дереве, стреляют дуплетом. Тварь отбрасывает до другого дерева, но она снова встаёт.</p>\n<p>Перелом даёт Игорь: спрыгивает с дерева прямо на тварь и подламывает ей колени. Вывод Ивана: «Оказывается без разгона она не столь страшна. И если держать его голову на виду то справиться с ним будет достаточно легко.» Бригада забивает тварь подручным — Иван хватает по пути палку. Даже переломанная, тварь ещё жива: «Мы же переломали ей всё кости. А она до сих пор жива.» Затем она издаёт крик такой силы, что все падают и зажимают уши, и умолкает.</p>\n<p>Финал сцены — рёв со стороны горы: «Не один их было множество. Десятки если не сотни тварей там кричала.» Бригада уезжает без новых потерь.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0261-S02", "PS-0261--vneshnost"], "h": "<p>Прямого описания внешности нет — рассказ ведётся от его лица. Известно только: мужик за тридцать, полжизни отработал лесорубом, физически способен нести раненого товарища на руках и залезть на дерево с разорванной рукой.</p>\n<p>Что известно точно — его состояние по ходу событий. После спуска по склону: ветка, пробившая плечо и загнанная глубже при лазании на дерево; удары камней по рёбрам и голове. Оценка бригадира: «Да у тебя же не одного живого места нет. Да и рана на плече. Сейчас чего-нибудь подцепишь и пиши пропала.» Ветку он вытащил сам, залил антисептиком и забинтовал. В финале — рука с разорванной плотью, сломанными костями, вывихнутая, с содранной кожей. Итог — рука ампутирована.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0261-S03", "PS-0261--harakter"], "h": "<p>Главное качество, названное им самим, — хладнокровие: «я всегда выбирался из этих бед благодаря моему самому главному, как по мне качеству хладнокровию». Завязка истории строится именно на том, что оно исчезло без причины.</p>\n<p>Второе — нежелание показывать слабость, и оно же его главная претензия к себе. На дереве он молчит при бригадире: «я, как вы уже поняли не любитель показывать слабость, какой бы она не была. Поэтому молчал. Да и чтобы я ему сказал, что мы увидели что-то в пещере и убежали, как дети какие-то.» Позже он называет это гордыней и винит себя прямым текстом: «Конечно же ничего бригадиру я не сказал баран. Возможно если бы я отодвинул на второй план свою гордыню. И сказал всё как есть. То бригадир бы послушал бы меня. И мы бы уехали оттуда. Возможно, но не точно.....»</p>\n<p>Совесть по поводу оставленного в пещере: «Возможно конечно там и правда человек, который нуждается в помощи. И мы все гниды, который просто убежали от него.» Но страх сильнее: «Даже если и так, но тот рёв до сих пор где то здесь. В груди до сих пор распространяется и пожирает все остальные страхи. Становясь лидером.»</p>\n<p>Отношение к прошлому и к самому тексту сформулировано как метафора паразита и Феникса: «Не хочу я думать о прошлом, который уже не изменить. Который должно уже исчезнуть, а не цепляться задуши и не жить во мне. Желал конечно, но сделать то ничего не мог. Прошлой до сих пор живёт во мне и потихоньку словно паразит вытягивает из меня жизнь. И это текст нужен именно для того, что закинуть этого паразита сюда, а самому возродиться подобное Фениксу ха.» Там же — смена мировоззрения: «Что-то я стал верить в подобных тварей больше чем раньше.»</p>\n<p>Прочие черты, видные по тексту:</p>\n<ul>\n<li>Законопослушность, которую он проговаривает дважды и без просьбы — про рубку леса и про оружие.</li>\n<li>Черный юмор по отношению к собственному ужасу: «Неплохую мотивацию дал мне этот рев.»</li>\n<li>Отказ от вежливости под угрозой: «мне было глубоко насрать на это, когда за тобой бежит какая-то фигня».</li>\n<li>Забота о бригаде: сам собирает разбежавшихся, несёт раненого, оказывает первую помощь, при этом свои травмы преуменьшает («-пятеро- исправил я»).</li>\n<li>Способность признавать ошибку в оценке товарища: «Мишка всё же оклеветал я тебя за зря. Зря говорил что он не способен дать сдачи. Вот дает.»</li>\n<li>Отдельное рассуждение о страхе как инструменте выживания, а не как о слабости.</li>\n<li>Заранее отвечает воображаемому скептику: «И если вы сейчас будете мне говорить, что может это человек, которому вот сейчас нужна помощь... Вам легко это говорить сидя на дивания и попивая чай.»</li>\n</ul>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0261-S04", "PS-0261--svyazi-s-drugimi"], "h": "<p>По карточке связан с: Бригада Ивана Васильевича, Бригада лесорубов, Тварь из пещеры, Фармацевтическая компания.</p>\n<p><strong>Бригадир.</strong> Возраст около 50 («словно не 50 летний мужик»). Характеристика от Ивана: «бригадир всегда был таким человеком, который хочет потушить угли нежели потом тушить пожар. Хороший мужик.» Он поддержал поход в пещеру именно как способ снять напряжение, остался снаружи охранять лагерь, отнёсся к рассказу скептически, вызвал помощь, организовал дежурство, а в бою спрыгнул с дерева и увёл тварь от Ивана. Его главная реакция на случившееся — забота о репутации бригады: «Кто узнаёт на смех поднимут.» Имя не названо.</p>\n<p><strong>Игорь.</strong> Самый младший в бригаде, инициатор похода в пещеру, «Молодой шибко, залезть куда желает. Да и по выносливее нас будет». Полез первым, вывел бригаду к выходу, единственный рассказал бригадиру о случившемся, дольше всех оставался на дереве. В финале спрыгнул на тварь и подломил ей колени, чем переломил бой.</p>\n<p><strong>Михаил, он же Мишка, он же Миша.</strong> Самый крупный в бригаде — из-за этого порвал кофту в узком лазе. «Миша вообще был парням винящий в первую очередь себя. Это вроде бы хорошо, но в некоторых ситуациях не является хорошей стороной.» В бою — единственный, кто не побежал: прицелился и попал твари в бок. Иван оценивает его как самого смелого и самого хладнокровного в бригаде и хотел дежурить именно с ним, «с ним как-то надёжнее». Отдельно отмечено, что имя Мишка сначала мелькает как шутка про медведя: «А вот и наш Мишка. Усмехнулся я в мыслях. Мишка то есть Михаил.»</p>\n<p><strong>Тоха, полное имя Григорий.</strong> Навигатор бригады. О нём сказано, что он «имеет удивительные особенности» и одна из них — «его географическая память, он может легко ориентироваться в новом городе или лесу». Приведён случай: кто-то из бригады погнался в лесу за ребёнком, которого не видел больше никто, бригада заплутала, и вывел всех Тоха, причём «более коротким маршрутом». В пещере первым замечает существо. Дежурил в паре с Иваном, первым сорвался ночью. Погиб первым при нападении твари на лагерь. Иван проверял у него пульс и не нашёл, потом взял из его рук ружьё.</p>\n<p><strong>Трое тяжелораненых</strong> при спуске по склону: у одного вспорота нога до кости, у другого рука вышла из сустава, у третьего предположительно сломана ключица. Имена не названы. Один из них (раненный в ногу) в финале спрыгнул с дерева и стрелял вместе с Мишей.</p>\n<p><strong>Тварь из пещеры.</strong> Описание Ивана: «четырех ногая ходячая тварь. Больше всего она смахивала на большую чёрную худую собаку. Но имеет некоторый странности. Это тело и лапы чём-то походили на человеческий. Не спрашивайте чем. Я сам не знаю. Я как то на по сознательном уровней понял сходство.» Голова: «Не как у собаки морда вытянутая. Но дальше со лба да самого носа лезвия... Представьте топор и эту острую часть сняли с топора и нацепили на морду собаки. Только у неё это видимо родной.» Вместо крови «Что-то только черная, как смола». Дробь и выстрел в голову не убивают. Умеет рубить деревья лбом, «сильнее быстрее и вертикально» лесорубов. Умна настолько, что повторяет манёвр Ивана через капот машины. Уязвима без разгона и при подломленных коленях. Крик — «словно рёв зверя и человека который только что понял, что оказался в ситуаций хуже смерти». Тварей в горе множество: «Десятки если не сотни».</p>\n<p><strong>Фармацевтическая компания.</strong> Появляется после того, как бригада позвонила в полицию: «Они это за всерьёз не восприняли сначала. Но после нам перезвонили. Нет не полицая, а фармацевтическая компания.» Приехали лично ко всем, взяли показания, дали подписать бумагу о неразглашении «Конечно же с моральными выплатами, как мои 6 зарплат», оплатили похороны Тохи и медицинские расходы. Своих препаратов не дали, хотя, по словам Ивана, всем известно, «что их ней препараты могут и конечность отрастить». Иван прямо связывает с этим ампутацию: «Поэтому мне и ампутировали руку. Если бы они помогли то всё было бы иначе.» На вопрос о роли фарм-корпорации (эксперименты, биологическое оружие или «пылесосят аномалии») автор 2025-05-15 ответил: «Биологическая оружия».</p>", "r": []}, {"t": "Как менялся", "a": ["S05", "PS-0261-S05", "PS-0261--kak-menyalsya"], "h": "<h3>2025-05-02 — версия 1 (окно w0089, id 323364–323370)</h3>\n<p>Первое и полное появление: текст истории целиком одним заходом от Славы — вступление-обращение, представление, весь поход в пещеру, бой в лагере и эпилог с фарм-компанией и ампутацией. Персонаж здесь уже сложился окончательно: мужик за тридцать, лесоруб из бригады в 8 человек, главное качество — хладнокровие, ведёт исповедь читателю, в финале — с ампутированной рукой. Вселенная в окне не названа; в карточке проставлен Нимб по дате объявления.</p>\n<h3>2025-05-07 — версия 2 (окно w0094, id 324211–324215)</h3>\n<p>Сам текст Ивана не менялся. Миколай разбирает историю по фрагментам 13–18, приводя дословные цитаты и добавляя к каждой пересказ. Разобранные фрагменты: молчание перед бригадиром и скепсис бригадира (13), сбор раненых и вытаскивание ветки из плеча (14), рефлексия про паразита и Феникса (15), организация дежурства и раздача двустволок (16), ночной побег и рёв (17), выход твари из пещеры и её описание (18). Пересказ фрагмента 18 обрывается на полуслове — последнее слово в записи «Глав». Вселенная в окне не названа; в карточке проставлен Нимб по дате объявления.</p>\n<h3>2025-05-15 — версия 3 (окно w0094, id 326303–326318)</h3>\n<p>Автору заданы пять конкретных вопросов по истории:</p>\n<ol>\n<li>Какова роль фарм-корпорации — эксперименты, биологическое оружие или они «пылесосят аномалии»?</li>\n<li>Почему выбран приём «$не допустила модерация$» — мета-шутка над цензурой или часть внутреннего мира (замазанное досье)?</li>\n<li>Цель истории — напугать, разоблачить «заговор» или исследовать мужскую психику на пределе?</li>\n<li>Какова судьба Ивана после событий — он действительно в больнице и пишет исповедь оттуда, или свободен, но параноит?</li>\n<li>Планируется ли показать внешность существа целиком или оставить «чем меньше знаем, тем страшнее»?</li>\n</ol>\n<p>Ответ Славы (id 326314) — четыре строки, по одной на вопрос: «Биологическая оружия / Напугать / На свободе но параноит / Чем меньше». Вопрос про приём «$не допустила модерация$» остался без ответа. Вселенная в карточке для этой версии проставлена как Апостол — по дате объявления; в самом окне вселенная не названа.</p>\n<p>В том же окне идёт короткий обмен репликами о краткости ответов: Миколай — «вот такими ответами он меня ваще бесит», Слава — «Ну норм, как ему ещё отвечать он же не автор». Кого именно имеют в виду под «он», в переписке не сказано.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S06", "PS-0261-S06", "PS-0261--chto-s-nim-stalo"], "h": "<p>По тексту истории (2025-05-02): после боя бригада уехала без новых потерь, обратилась в полицию, получила вместо неё фармацевтическую компанию, подписала бумагу о неразглашении и получила выплату размером «как мои 6 зарплат». Похороны Тохи и медицинские расходы оплачены компанией, препараты, способные отрастить конечность, не предоставлены — Ивану ампутировали руку.</p>\n<p>Собственный статус текста он определяет так: «И это текст нужен именно для того, что закинуть этого паразита сюда, а самому возродиться подобное Фениксу ха.» И заканчивает историю опасением: «Хотя это всё равно не посмертной письмо. Вряд ли из-за этого они решат меня убить. Надеюсь.»</p>\n<p>Ответ автора 2025-05-15 на прямой вопрос, в больнице ли он: «На свободе но параноит». Намёк на психушку во вступлении, таким образом, остаётся образом, а не местом действия.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0261-S07", "PS-0261--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вселенная нигде не названа: по окну w0089 — «Вселенная нигде не названа; неясно, связана ли история с прежними историями Славы»; по окну w0094 — «Вселенная нигде не названа — история идёт отдельно от благословенных». Пометки Нимб и Апостол в карточке проставлены по дате объявления, а не по тексту.</li>\n<li>Вопрос о приёме «$не допустила модерация$» (мета-шутка над цензурой или замазанное досье внутри мира) задан 2025-05-15 и остался без ответа.</li>\n<li>Фамилия Ивана Васильевича не названа. Вариант имени «Ваня» есть в карточке, но в самих сообщениях не встречается.</li>\n<li>Имя бригадира не названо. Имена троих тяжелораненых не названы. Из восьми человек бригады по именам известны пятеро: Иван, бригадир, Игорь, Михаил, Тоха (Григорий).</li>\n<li>Что стало с остальными членами бригады после событий, кроме оплаты лечения и похорон Тохи, не сказано.</li>\n<li>Регион, название горы и точная дата событий не названы: «где то в октябре. Сейчас уже точно не припомню.»</li>\n<li>Природа твари не объяснена. Ответ автора про биологическое оружие относится к роли фарм-корпорации; связь твари с корпорацией прямо не проговорена. Показывать существо целиком не планируется — «Чем меньше».</li>\n<li>Что сделали с горой, пещерой и десятками тварей внутри — не сказано.</li>\n<li>Про Тоху сказано, что он «имеет удивительные особенности», названа только одна — географическая память. Остальные не перечислены. Эпизод с ребёнком в лесу, которого видел только один человек, объяснения не получил.</li>\n<li>Упоминание «сам король Матузов» («Охота оказать еë так чтобы сам король Матузов удивился») не поясняется.</li>\n<li>Реплика Славы 2025-05-15 «А ну о битве Защитника и арбетара» (id 326309) следует за словом «старенькая» и вопросом «а о чем эта история?»; к какой именно истории она относится, в переписке не сказано.</li>\n<li>Дописан ли текст Ивана Васильевича полностью и планировалось ли продолжение — не сказано. Пересказ фрагмента 18 в окне w0094 обрывается на полуслове.</li>\n</ul></div>\n<div class=\"mnote\"><b>⚙ машинная заметка · С чего начать — не материал авторов</b>\n<ul>\n<li>«Про Тоху сказано, что он имеет удивительные особенности, названа только одна». Она и вынесена: <code>SP-0224</code> «Географическая память Тохи», база 22 990, статьи нет, источник — id 323365–323367. Это те же самые сообщения, из которых собрана эта статья. Кусок не потерян, он просто ушёл в соседнюю запись, и эпизод с ребёнком в лесу там же.</li>\n<li>«Реплика Славы 2025-05-15 „А ну о битве Защитника и арбетара“ (326309) — к какой истории относится, не сказано». Относится к <code>IS-0057</code> «Битва Защитника и арбетара»: статья есть, 4 621, одна ссылка, источник — id 326302–326310. То есть эта самая реплика в неё уже входит. Пробел снимается сведением двух записей.</li>\n<li>Разбор 7 мая разъехался по четырём окнам из-за нарезки по паузам в ноль часов: w0091 (323801–324188), w0092 (324189–324200), w0093 (324201–324210), w0094 (324211–324215). В источниках стоит только последний кусок. В 324189–324210 лежат фрагменты 1–12 — в том числе разбор мотивации бригадира, «потушить угли», хладнокровия и того, почему бригада поверила бригадиру. Ровно то, чего статье не хватает по характеру.</li>\n<li>Не подключены и два окна чтения: <code>IS-0054</code> (w0090, 323575–323583, 3–4 мая) и <code>IS-0056</code> (w0091, 323801–323808, 5–7 мая). Оба без статей. Если по ходу чтения спрашивали про имена, регион или фамилию — то там.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0261--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0073.html\">Бригада лесорубов</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0073.html\">Бригада лесорубов</a>, <a href=\"GR-0075.html\">Фармацевтическая компания (из истории про лесорубов)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0261--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-05-02</td>\n<td>323364–323370</td>\n<td>w0089</td>\n<td>Нимб (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-05-07</td>\n<td>324211–324215</td>\n<td>w0094</td>\n<td>Нимб (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-05-15</td>\n<td>326303–326318</td>\n<td>w0094</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0261-ivan-vasilevich.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0261--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0261.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0261-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0261/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — бригада. <code>PS-0262</code> «Бригада лесорубов» — база 82 992, статьи нет. <code>PS-0264</code> «Тоха» — 49 921, статьи нет. <code>PS-0263</code> «Бригадир» — 49 881, статьи нет. Двести тысяч знаков на трёх, и единственный вход в справочник для всех восьмерых — этот рассказчик. Погибший, начальник и коллектив, вокруг которых собрана вся история, существуют только пересказом внутри чужой статьи.</p>\n<p>Вторым — не дыра, а слипшиеся записи, и чинить их надо раньше, чем заводить статьи. <code>PS-0240</code> «Игорь», 115 210 знаков, статьи нет — держит трёх разных Игорей: самого крутого парня класса из истории про завод (w0085), клерка в очках и пиджаке из второй брошенной истории (w0088) и младшего в бригаде (w0089). <code>PS-0234</code> «Михаил», 45 749, две вселенные — держит двоих, и в базе прямо стоит, что это «не тот Михаил, который медведь». Пока они не разведены, любая статья по ним будет статьёй про трёх человек сразу.</p>\n<p>Третьим — сам текст. <code>PR-0070</code> «Здравствуйте дорогие читатели» — 49 551, статьи нет; <code>PR-0075</code>, фрагменты 13–18 — 32 662, статьи нет. Проза, которую эта статья пересказывает, в справочник не выложена, и статья на 43 467 знаков фактически стоит вместо неё. Это единственное место в кусте, где статья крупнее того, из чего сделана.</p>\n<p>Вселенная (<code>VS-0006</code>, 21 285, статьи нет) — тоже дыра, но она общая с <code>PS-0265</code>, и чинить её надо один раз на обе.</p>\n<h3>С чего начать</h3>\n<p>Три из перечисленных в статье пробелов закрываются, не выходя из базы.</p>\n<ul>\n<li>«Про Тоху сказано, что он имеет удивительные особенности, названа только одна». Она и вынесена: <code>SP-0224</code> «Географическая память Тохи», база 22 990, статьи нет, источник — id 323365–323367. Это те же самые сообщения, из которых собрана эта статья. Кусок не потерян, он просто ушёл в соседнюю запись, и эпизод с ребёнком в лесу там же.</li>\n<li>«Реплика Славы 2025-05-15 „А ну о битве Защитника и арбетара“ (326309) — к какой истории относится, не сказано». Относится к <code>IS-0057</code> «Битва Защитника и арбетара»: статья есть, 4 621, одна ссылка, источник — id 326302–326310. То есть эта самая реплика в неё уже входит. Пробел снимается сведением двух записей.</li>\n<li>Разбор 7 мая разъехался по четырём окнам из-за нарезки по паузам в ноль часов: w0091 (323801–324188), w0092 (324189–324200), w0093 (324201–324210), w0094 (324211–324215). В источниках стоит только последний кусок. В 324189–324210 лежат фрагменты 1–12 — в том числе разбор мотивации бригадира, «потушить угли», хладнокровия и того, почему бригада поверила бригадиру. Ровно то, чего статье не хватает по характеру.</li>\n<li>Не подключены и два окна чтения: <code>IS-0054</code> (w0090, 323575–323583, 3–4 мая) и <code>IS-0056</code> (w0091, 323801–323808, 5–7 мая). Оба без статей. Если по ходу чтения спрашивали про имена, регион или фамилию — то там.</li>\n</ul>\n<p>В архив — за «королём Матузовым». По архиву слово проходит дважды: в самом тексте (323369) и в цитате, которую Миколай прислал обратно в разборе (324196). То есть его прочитали, переписали и не спросили о нём ни разу. Ни в разборе, ни в пяти вопросах 15 мая к нему не возвращались. Это стоит фиксировать именно так — не как непрояснённое место, а как место, которое видели и прошли мимо.</p>\n<h3>Как развивалось</h3>\n<p>2 мая — весь текст одним заходом, целиком, от вступления до ампутации. 3–4 мая — Миколай читает по частям. 5–7 мая — читает дальше, засыпает над текстом, теряет место, доходит второй раз, дочитывает. 7 мая утром — присылает разбор по фрагментам, на который Слава отвечает: «Ответ длиннее в 3 раза чем сама история. Но ок». 15 мая — пять вопросов, четыре ответа: «Биологическая оружия / Напугать / На свободе но параноит / Чем меньше». Пятый без ответа. Тогда же в стороне идёт обмен про краткость ответов вообще. Дальше не возвращались.</p>\n<p>Выложили целиком — читали десять дней — разобрали вчетверо длиннее — свели к четырём строкам.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Про страх правило названо прямо и развёрнуто: «страх это неплохой инструмент для выживания», предки выживали благодаря ему, он не даёт расслабиться и держит начеку. Это работающее правило, и оно даже применено — Иван объясняет через него собственное поведение на дежурстве.</p>\n<p>Для предчувствия, с которого история начинается, правила нет. «Падкая чувство идущий опасности», появившееся до всяких событий и без причины, снявшее с человека его главное качество, — и бригадир говорит, что подкосило не его одного, а всех: «оглянись все, как не в себе». Восемь человек одновременно, до первой встречи с чем бы то ни было. Свойство ли это места, объекта, самих людей или просто настроение — не сказано нигде, при том что мир, к которому история приписана, весь построен на аномальных объектах. Правило для страха есть, для того, что было до страха, — нет.</p>\n<h3>Отклик</h3>\n<p>Сильнее всего — то, как он объясняет, зачем вообще пишет: «Прошлой до сих пор живёт во мне и потихоньку словно паразит вытягивает из меня жизнь. И это текст нужен именно для того, что закинуть этого паразита сюда, а самому возродиться подобное Фениксу ха.» Вот это «ха» в конце дороже всей метафоры: человек сам слышит, как пафосно вышло, и не переписывает, а отмахивается.</p>\n<p>И весь текст держится на том, что он заранее ждёт осуждения. Начинает с трёх вариантов, кем его сочтут, и сам выбирает «псих» — потому что тогда сумасшедший он, а не мир. Отвечает воображаемому читателю до того, как тот успел возразить: «Вам легко это говорить сидя на дивания и попивая чай». Признаёт вину не за побег, а за гордыню: не сказал бригадиру правду и считает, что этим убил Тоху. Это исповедь, написанная человеком, который заранее знает приговор.</p>\n<p>Отдельно зацепило место, где двое вооружённых мужиков убегают от пещеры, забыв, что у них ружья, — «Просто как то из головы вылетела», — потом в лагере смеются над собой, и ровно в этот момент погибает Тоха. Смех и удар в спину стоят в соседних предложениях, и никто этого не подчёркивает.</p></div>", "r": []}];</script>
