<script>const BASE="";const DOCNAME="Энергия, сосуд и структура";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0070-S01", "MR-0070--ustroystvo"], "h": "<p>Система, которую Слава называет «концепт силы» (2024-11-17, id 258978–259005). Излагается заново после того, как Миколай на вопрос «Ты помнишь концепт силы ?» отвечает «помню много всяких было», «я короче не помню».</p>\n<p>Полная выкладка (id 258985):</p>\n<div class=\"q\"><p>«В этом мире каждый владеет энергий ( без структуры) просто энергий<br>Но рождаются те кто имеет сосуд , который позволяет накапливать энергий, и так энергия накапливается самого рождения и создаёт свою уникальную структуру( то бишь способность) это может зависеть от всего от психологического состояния ребенка, от сосуда, от среды, и т.п.<br>Сосуд ещё можно качать<br>Как и объем и контроль структурной энергий<br>Энергий становится структурной примерно в 7 лет<br>Энергий не просто накапливается, типо если её слишком много сосуд выпускают ту которую не может удержать»</p></div>\n<p>Разложенное по пунктам:</p>\n<ul>\n<li>Энергия есть у всех. У большинства она без структуры — «просто энергий».</li>\n<li>Сосуд — врождённое: «рождаются те кто имеет сосуд». Сосуд позволяет накапливать энергию.</li>\n<li>Накопление идёт «самого рождения», и накопленная энергия сама создаёт «свою уникальную структуру( то бишь способность)». Способность здесь тождественна структуре.</li>\n<li>Что определяет структуру: психологическое состояние ребёнка, сосуд, среда — «это может зависеть от всего», перечень открытый и заканчивается «и т.п.».</li>\n<li>Прокачиваемое: сам сосуд, объём структурной энергии и контроль над ней.</li>\n<li>Срок: «Энергий становится структурной примерно в 7 лет».</li>\n<li>Избыток: сосуд не удерживает всё — «если её слишком много сосуд выпускают ту которую не может удержать».</li>\n</ul>\n<p>Через несколько минут (id 258997) добавляется устройство одной конкретной структуры — чёрного ящика: «Черный ящик это структура / И черный ящик поверх свой структуры образует хранящую внутри него структуру / В черном ящики может хранится фиг знает сколько структур». То есть чёрный ящик сам является структурой, и поверх собственной структуры образует вместилище для чужих; сколько именно структур в него помещается, не определено — «фиг знает сколько».</p>\n<p>Миколай, разбираясь, выводит из этого схему для кристалла (id 259002–259005): «кристал собирает энергию», «это одна из структур», «и она может быть в ящике», «восполняет сосуд». Возражений на это в переписке нет.</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0070-S02", "MR-0070--naselenie"], "h": "<p>Разделение по этой системе одно: те, у кого сосуд есть, и все остальные. Энергией владеет каждый, но без сосуда она остаётся бесструктурной, то есть способности не даёт. Наличие сосуда — вопрос рождения.</p>\n<p>Отдельных персонажей или групп в этом окне не названо.</p>", "r": []}, {"t": "Место во вселенной — как связан с другими мирами", "a": ["S03", "MR-0070-S03", "MR-0070--mesto-vo-vselennoy"], "h": "<p>В файле указано, что система является частью мира сект и сбежавших сверхлюдей.</p>\n<p>Как связанные названы: Кристал, Мир сект и сбежавших сверхлюдей, Чёрный ящик.</p>\n<p>Продолжение системы — «Кристаллизация энергии» (<a href=\"MR-0073.html\">Кристаллизация энергии</a>, 2024-11-30): там Миколай описывает, что физически происходит с энергией к семи годам, и прямо ссылается на структуру Славы («как я раньше обозвал твою структуру - кристаллы»). Семилетний рубеж в обеих выкладках совпадает.</p>", "r": [["Кристаллизация энергии", "MR-0073.html"]]}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0070-S04", "MR-0070--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-11-17 (id 258978–258985), окно w0064.</strong> Повтор ранее обсуждавшейся мысли. Слава пересказывает систему целиком заново, потому что Миколай её не помнит. Сюда входит всё базовое устройство: энергия у всех, сосуд у рождённых с ним, самозарождение уникальной структуры, факторы влияния, прокачка сосуда/объёма/контроля, семилетний срок, сброс избытка.</p>\n<p><strong>Версия 2 — 2024-11-17 (id 258986–259005), окно w0064.</strong> Через несколько минут, по итогам непонимания Миколая: «прочел», «понял», «и теперь», «не понял», «как», «он может получать эти структуры», «они изначально есть в способности?». В ответ уточняется устройство чёрного ящика как структуры, хранящей другие структуры, и от Миколая идёт разбор кристалла — структура, которая собирает энергию, может лежать в ящике и восполняет сосуд.</p>\n<p>Первая версия второй не отменяется: вторая только достраивает частные случаи поверх общей схемы.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0070-S05", "MR-0070--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Названия у системы в чате нет; Слава называет её «концепт силы».</li>\n<li>Это повтор ранее обсуждавшейся мысли — оригинальное изложение находится где-то раньше в архиве, в этом окне его нет.</li>\n<li>Вселенная в окне не объявлена; отнесение к «монстрам» сделано по дате.</li>\n<li>Перечень факторов, определяющих структуру, открытый: «это может зависеть от всего ... и т.п.» — полного списка нет.</li>\n<li>Как именно качается сосуд, объём и контроль, не сказано; названа только сама возможность.</li>\n<li>Ёмкость чёрного ящика не определена: «фиг знает сколько структур».</li>\n<li>Как чёрный ящик получает чужие структуры — вопрос Миколая («как он может получать эти структуры», «они изначально есть в способности?») прямого ответа не получает; Слава отвечает описанием того, что ящик собой представляет, а не тем, откуда в нём берётся содержимое.</li>\n<li>«Примерно в 7 лет» — точный срок не задан.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0070--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0073.html\">Кристаллизация энергии</a></li>\n<li><strong>Упомянут в мирах:</strong> <a href=\"MR-0073.html\">Кристаллизация энергии</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0041.html\">Секты, выращивающие сверхлюдей</a>, <a href=\"GR-0042.html\">Сверхлюди (люди с сосудом)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0070--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-11-17</td>\n<td>258978–258985</td>\n<td>w0064</td>\n<td>монстры (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2024-11-17</td>\n<td>258986–259005</td>\n<td>w0064</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0070-energiya-sosud-i-struktura.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0070--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0070.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
