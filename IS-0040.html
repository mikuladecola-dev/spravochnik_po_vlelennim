<script>const BASE="";const DOCNAME="Антоша";
const LEAD="";
const CH=[{"t": "Содержание", "a": ["S01", "IS-0040-S01", "IS-0040--soderzhanie"], "h": "<p>Текста истории в переписке нет — «самого текста истории в окне нет» (окно w0082). История существует в архиве только как название и как отсылка.</p>\n<p>Единственное содержательное указание: сцена с цепью и белыми глазами, названная ранее в сообщении 305116, относится к Антоше. Миколай говорит про эту сцену: «и это я где-то слышал... ну я прикол пока чувствую», Слава отвечает: «Так это про Антошу» (2025-03-18, id 305329–305330).</p>\n<p>В том же разговоре Миколай переводит разговор с конкретной сцены на общий вывод: «я про то что у этих апостолов такая система получается» (id 305333). Что именно за «система» и как она устроена — в этих сообщениях не раскрыто.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S02", "IS-0040-S02", "IS-0040--mesto-vo-vselennoy"], "h": "<p>Вселенная: Апостол (по дате объявления).</p>\n<p>История связана с Имитатором: приёмы имитатора отсылают к истории про Антошу. Именно эта сшивка и составляет всё, что зафиксировано об Антоше в окне w0082.</p>\n<p>В рейтинге историй Антоша стоит вторым (id 305098). Из чего состоит рейтинг и по какому критерию он выстроен — в переписке не сказано.</p>", "r": []}, {"t": "Состояние", "a": ["S03", "IS-0040-S03", "IS-0040--sostoyanie"], "h": "<p>Одна версия, одна дата: 2025-03-18 (окно w0082, id 305329–305333). Помечена как «повтор прежней мысли» — в этом окне история не разрабатывается заново, а вспоминается как уже существующая.</p>", "r": []}, {"t": "Пробелы", "a": ["S04", "IS-0040-S04", "IS-0040--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Текста истории в окне нет; известны только название, отсылка к сцене с цепью и белыми глазами и место в рейтинге.</li>\n<li>Кто такой Антоша — персонаж, рассказчик или что-то ещё — в переписке не сказано.</li>\n<li>Что за «система» у апостолов, о которой говорит Миколай в id 305333, здесь не объяснено.</li>\n<li>Как именно приёмы имитатора соотносятся с Антошей — названо только как факт сходства, механика связи не описана.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["IS-0040--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-03-18</td>\n<td>305329–305333</td>\n<td>w0082</td>\n<td>Апостол (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/istorii/IS-0040-antosha.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["IS-0040--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/IS-0040.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
