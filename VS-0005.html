<script>const BASE="";const DOCNAME="Иссекай";
const LEAD="";
const CH=[{"t": "Зарождение", "a": ["S01", "VS-0005-S01", "VS-0005--zarozhdenie"], "h": "<p>Вселенная объявлена одной репликой Славы 2026-02-14 в 09:29 (окно w0117, id 432541):</p>\n<div class=\"q\"><p>Я снова вернулся к Иссекаю</p></div>\n<p>Это единственное объявление во всей карточке <a href=\"VS-0005.html\">Иссекай</a>. В карточке оно проведено как <strong>возврат</strong>, окно 432538–432549. Формулировка сделана как возвращение к чему-то уже бывшему («снова вернулся»), а не как первое учреждение. <strong>Когда Иссекай существовал до этого, откуда автор вернулся и что было первым разом — в переписке не сказано</strong>: ни более раннего отрезка, ни более раннего объявления, ни упоминания предыдущего периода в файле нет.</p>\n<p>Составитель карточки при описании события пометил: «Сразу после текста „Любимый город“ С пишет, что снова вернулся к Иссекаю. Заявка прозвучала в чате прямо, но неясно, вселенная это или жанровая рамка». То же сомнение продублировано в карточке истории «Любимый город» (<a href=\"IS-0086.html\">Любимый город</a>): «Вселенная указана по соседней реплике про Иссекай — возможно, это жанр, а не название вселенной». Разрешения этой неопределённости в переписке нет — других дословных реплик про Иссекай в файле вселенной не приведено.</p>\n<p><strong>Что было прямо до объявления.</strong> Непосредственно перед репликой 432541 Слава тремя сообщениями подряд выложил текст «Любимый город» (2026-02-14, 09:26, id 432538, 432539, 432540). Объявление идёт через три минуты после последнего куска.</p>\n<p>Содержание выложенного текста — то, из чего вырос возврат к Иссекаю:</p>\n<p><em>Вступление от рассказчика.</em> «Не назвать мою жизнь удачной. К сожалению». Великих свершений не было — «было лишь пару горячительных напитков и интересные таблеточки, конечно и сигареты, как без них-то». В азартные игры не играл, «потому что чаще всего выигравал». Сердцеедом не был, «потому что болела голова от попыток угодить другому человеку». Всё бы закончилось тем, что тело сказало бы гудбай и он помер, но случился «момент», который что-то изменил, — «точнее это не момент, а места».</p>\n<p><em>Пробуждение (432538).</em> Рассказчик просыпается скрючившись в калачик после ночной гулянки: тело ломит, в горле пересохло, похмелье «двоечкой пробивает черепушку», солнце бьёт в опухшее лицо. Под ним трава — «что-то колючее, но при этом податливое». Рассуждает, что в его городе травы на улицах не найдёшь, значит он в лесу или в парке, «который недавно подожгли, какие-то подростки». Поднявшись, видит, что лежит на лужайке, «строго постриженная, словно прическа солдата», и что лужайка находится на крыше пятиэтажки. Кроме него на лужайке ещё шесть человек, все в отключке. Мысль о розыгрыше он отбрасывает из-за десятилетнего мальчика. Дальше действует «по инстинкту трёх принципов „Бей, беги, замри“» и выбирает бег: «мне мясоеду не место на зелёной лужайке», и оставаться в группе, где он очнулся первым и где он самый подозрительный, — не лучшая идея. Крыша без бортиков; на крыше бетонное сооружение с железной дверью и надписью «Выход с крыши».</p>\n<p><em>Погоня и Жених (432539).</em> Сверху раздаётся звук захлопнувшейся двери, потом быстрые шаги — «Топ-топ». Рассказчик бежит вниз, неправильно рассчитывает расстояние между ступенями, падает, бьётся об углы и шлёпается о бетонный пол; его рвёт. Мимо, тяжело дыша, пробегает силуэт мужчины в чёрной кофте: останавливается на мгновение, увидев его, но быстро теряет интерес и бежит дальше вниз. Рассказчик его опознаёт: «Я сразу понял, что это за мужчина. Жених. Ну мужчина с обручальным кольцом». Дальше — боль после падения, мысль позвонить в больницу и невозможность это сделать: он не знает, где находится, а телефон у него кирпич, геолокацию не показывает.</p>\n<p><em>Пустой город (432539).</em> Выйдя из здания: «Нифига. Никого не было. Ни взглядов отвращения из-за грязных штанов. Ни гула машин. Ни даже песни наших младших пернатых братьев. Ничего». Возникают вопросы «Что это за город?», «Почему здесь никого нет?», «Как я здесь оказался?» — и мысль, которую он называет куда более важной: «Где мне найти воду?». «Каким бы не был ты героем, ты не сможешь совершать великий подвиги не утолив свои билогический хателки». Он находит вывеску «магазин 24», перелезает через прилавок и пьёт воду большими глотками — «именно глотать, а не пить».</p>\n<p><em>Запой в магазине (432540).</em> Вода разочаровывает: «в моих фантазиях вкус воды был таким приятным, а на деле просто безвкусная вода». Взгляд останавливается на холодильнике с горячительными напитками, которые «прям спецально вызывающие выглядили»; рассказчик слышит их как голос: «Эй дружек выпей нас. Тебе сразу полегчает» — и отвечает, что он «человек не привыкшей отказываться от просьбы». Дальше пиво, пустые банки, стеклянные бутылки, и происходящее «лишь кадроми проносятся в голове»: дебош, битые витрины, разбитые бутылки, сходил в туалет прямо в магазине, пел песню.</p>\n<p><em>Обрыв (432540).</em> Сознание приходит в ночном переулке, в луже тёплой жидкости. Первая мысль — «Че я за свинья под себя сходил», вторая — «Бок...болит». Мысли соединяются в третью: «кровь?!». В темноте цвета жидкости не видно, «но в моёй голове цвет уже был ярко красным». На этом текст обрывается; продолжения в файле нет.</p>\n<p><strong>После объявления.</strong> После 432541 в окне идёт пауза 3.2 часа, затем Миколай присылает ссылку (2026-02-14, 12:38, id 432549): <code>https://codepen.io/Pitator-the-flexboxer/full/wBWOROp</code>. Связана ли ссылка с Иссекаем — в переписке не сказано, она просто попадает в границы окна.</p>\n<p><strong>Слово «Иссекай» в чате.</strong> Кроме объявления 432541, слово звучит ещё раз 2026-02-16 в реплике Миколая «пиши иссекай» (id 433593), стоящей в ряду советов по письму («пиши истории короче», «меньше слов, больше сути»). Во всех остальных местах карточки слово стоит только в служебных полях.</p>\n<p><strong>Отрезок жизни.</strong> Объявлен один:</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>С</th>\n<th>По</th>\n<th>По какому объявлению</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-02-14</td>\n<td>2026-04-19</td>\n<td>возврат 432541 — «снова вернулся к Иссекаю»</td>\n</tr>\n</tbody>\n</table></div>\n<p>В файле дважды повторена пометка: «Границы поставлены по объявлению в чате плюс дате, а не по содержанию. Отрезки могут быть несмежными — это нормально». Дата начала прямо опирается на 432541. <strong>Дата конца 2026-04-19 никаким объявлением не подкреплена</strong> — события-закрытия нет, реплики с закрытием нет, откуда взята правая граница, в файле не объяснено.</p>\n<p>Границ при этом в одном файле три пары: шапка даёт <code>2026-02-13 — 2026-04-11</code>, таблица отрезков — <code>2026-02-14 — 2026-04-19</code>. Левая граница шапки на день раньше единственного объявления и совпадает с датой служебной записи Документ-систематизация концепций и миров <em>(статьи ещё нет — <a href=\"kb/SL-0133-dokument-sistematizaciya-koncepciy-i-mirov.html\">исходник</a>)</em> «Документ-систематизация концепций и миров» (2026-02-13, id 432166–432177). Правая граница отрезка на восемь дней позже самой поздней даты состава. Расхождение в файле не объяснено.</p>\n<p><strong>Состав.</strong> За вселенной числится 31 сущность: 3 идеи, 4 истории, 1 мир, 2 монумента, 8 персонажей, 10 служебных записей, 3 способности. Даты распределены скоплениями: 2026-02-13 — 1 запись; 2026-02-14 — 4 записи (всё, что заведено в день объявления: история «Любимый город», «Пустой город», «Жених», «Рассказчик „Любимого города“»); 2026-02-16 — 18 записей; 2026-02-20 — 1 запись (Дариус Баллив); 2026-04-11 — 7 записей. Чем эти скопления вызваны, в переписке не сказано — дословных реплик за эти даты в файле вселенной нет. У большинства записей отнесение проставлено пометкой «вселенная: Иссекай (по дате объявления)», то есть по попаданию в отрезок, а не по заявлению авторов. У истории <a href=\"IS-0089.html\">Рогалик и бесконечный данж</a> «Рогалик и бесконечный данж» стоит отдельно: «Вселенная не объявлена, история существует сама по себе».</p>\n<p><strong>Названия и рабочие обозначения, прозвучавшие в чате</strong></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Обозначение</th>\n<th>Кто ввёл</th>\n<th>Дата и id</th>\n<th>Что означает</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>«Иссекай»</td>\n<td>Слава</td>\n<td>2026-02-14, id 432541</td>\n<td>Единственное название вселенной, в форме «к Иссекаю». Имя это вселенной или жанровая рамка — не разрешено</td>\n</tr>\n<tr>\n<td>«иссекай»</td>\n<td>Миколай</td>\n<td>2026-02-16, id 433593</td>\n<td>«пиши иссекай» — совет по письму в ряду других советов</td>\n</tr>\n<tr>\n<td>«Любимый город»</td>\n<td>Слава</td>\n<td>2026-02-14, id 432538</td>\n<td>Название текста, выложенного прямо перед объявлением</td>\n</tr>\n<tr>\n<td>«Жених»</td>\n<td>Слава (через рассказчика)</td>\n<td>2026-02-14, id 432539</td>\n<td>Рабочее обозначение персонажа по признаку: «Ну мужчина с обручальным кольцом»</td>\n</tr>\n<tr>\n<td>«магазин 24»</td>\n<td>Слава</td>\n<td>2026-02-14, id 432539</td>\n<td>Вывеска магазина в тексте</td>\n</tr>\n<tr>\n<td>«Выход с крыши»</td>\n<td>Слава</td>\n<td>2026-02-14, id 432538</td>\n<td>Надпись на бетонном сооружении на крыше</td>\n</tr>\n<tr>\n<td>«Бей, беги, замри»</td>\n<td>Слава</td>\n<td>2026-02-14, id 432538</td>\n<td>«инстинкт трёх принципов», названный рассказчиком</td>\n</tr>\n</tbody>\n</table></div>\n<p>Обозначения «Пустой город» (<a href=\"MN-0027.html\">Пустой город</a>) и «Рассказчик „Любимого города“» (<a href=\"PS-0351.html\">Рассказчик «Любимого города»</a>) в чате не звучат — это названия из служебной таблицы карточки. В самом тексте города по имени не называют, а у рассказчика собственного имени нет.</p>", "r": [["Документ-систематизация концепций и миров", "kb/SL-0133-dokument-sistematizaciya-koncepciy-i-mirov.html"], ["Рассказчик «Любимого города»", "PS-0351.html"], ["Пустой город", "MN-0027.html"], ["Любимый город", "IS-0086.html"], ["Рогалик и бесконечный данж", "IS-0089.html"]]}, {"t": "Масштаб", "a": ["S02", "VS-0005-S02", "VS-0005--masshtab"], "h": "<p>Записей вида «мир» во вселенной ровно одна — <strong><a href=\"MR-0190.html\">Ледяной мир</a> «Ледяной мир»</strong> (2026-02-16, окно w0117, id 433471–433474), вариант имени «ледяной ад». Кроме неё пространство описано ещё в трёх местах, проведённых по другим видам: <a href=\"MN-0027.html\">Пустой город</a> «Пустой город» (монумент), <a href=\"MN-0028.html\">Плакучая ива</a> «Плакучая ива» (монумент, продублирована как <a href=\"MN-0028.html\">Плакучая ива</a>), и бесконечный данж, у которого отдельной записи-мира нет — устройство его пространства лежит внутри истории <a href=\"IS-0089.html\">Рогалик и бесконечный данж</a>. Ещё две вещи имеют обстановку, нигде не описанную как мир: глава 1 «Сумасшедшего где-то?» (внутри <a href=\"PS-0356.html\">Дариус Баллив</a>) и рассказ «Цена жизни» (<a href=\"IS-0088.html\">Цена жизни</a>).</p>\n<p><strong>Сколько миров во вселенной — в переписке не сказано.</strong> Вопрос о числе миров соавторы не ставили ни разу; слово «мир» во множественном числе применительно к Иссекаю нигде не звучит. Общей карты, общей космологии, иерархии миров, общего пантеона в переписке нет. Материал распадается на четыре куска, между которыми связь не проведена ни разу.</p>\n<h3>Ледяной мир (<a href=\"MR-0190.html\">Ледяной мир</a>)</h3>\n<p>Весь материал по нему — один длинный план, выложенный Миколаем 2026-02-16 в 21:31 (id 433473). До этого он дважды отказывался его кидать: «я план не кину», «или а то спойлеры ты тож не любишь» (433459, 433461), пока Слава не сказал: «Кидай, а то снова будешь говорить о великих эпопех, а по итогу не сможешь даже докончить» (433467). План открывается фразой «у текста должна быть идея».</p>\n<p>Устройство мира формулировками Миколая:</p>\n<ul>\n<li>«ледяной мир, ледяной ад который он не идентифицирует как ад, ад для него дар. но это не рай, рай другое. рай это другие»;</li>\n<li>мир застывший — герой «ходит и разговаривает с застывшим миром»;</li>\n<li>обычный мир при этом продолжает существовать и герой о нём помнит: «ведь в обычном мире у него есть близкие которые его ждут к которым он хочет какие то планы»;</li>\n<li>пребывание конечно: герой «просто замёрзнет, надолго замёрзнет полностью во льдах», потом просыпается.</li>\n</ul>\n<p>Финал по плану — шутка с рекламной интонацией: «вот почему зимой все летят в тёплые страны, а летом на Антарктиду не летают. я так хорошо отдохнул. покупайте билеты», с припиской самого Миколая: «насчёт рекламы я не уверен».</p>\n<p>Реакция Славы на весь план — одна реплика: «Да ты умеешь держать интригу а потом все» (433474). Обсуждения после этого нет. Кто в этом мире хозяин, есть ли в нём кто-то живой кроме героя, какого он размера, где кончается, кто и что именно застыло — в переписке не сказано; сказано только, что герой «разговаривает с застывшим миром». В карточке <a href=\"MR-0190.html\">Ледяной мир</a> в разделе «Неясности» стоит: «Вселенная не названа».</p>\n<h3>Плакучая ива — единственное перемещение между мирами (<a href=\"MN-0028.html\">Плакучая ива</a>)</h3>\n<p>Из того же сообщения 433473:</p>\n<div class=\"q\"><p>летом жарко гг бухает, обливается алкоголем, хочет охладиться, уснул под плакучей ивой. сдох? нет ну это скучно. ива особое место, она исполнила его мечту. он попал в ледяной мир</p></div>\n<p>Механика, как она названа: ива — «особое место», и она исполняет желание — герой хотел охладиться, она это исполнила. Перенос происходит через сон под ивой в летнюю жару. Обратный ход тоже через неё и привязан к росту дерева: «потом когда ива вытянется на него упадут почи солнца он проснётся» (в оригинале опечатка, речь о лучах солнца). То есть возвращение наступает не по воле героя и не по чьему-то решению, а когда дерево вырастет настолько, что перестанет закрывать спящего от солнца. Сколько это по времени — не сказано, в плане только «надолго замёрзнет».</p>\n<p>Никакого другого способа попасть в другой мир в переписке по этой вселенной не описано. Порталов, ритуалов, призывов, смерти-как-перехода нет. Откуда ива, одна ли она, кто ещё может ей воспользоваться — не сказано.</p>\n<h3>Пустой город (<a href=\"MN-0027.html\">Пустой город</a>)</h3>\n<p>Площадка «Любимого города» (2026-02-14, id 432538–432540; вторая версия записи — 2026-02-16, id 433182–433184). Это не «другой мир» по тексту: в карточке прямо стоит «Природа города (иной мир, симуляция, опустевшая реальность) не объяснена».</p>\n<p>Что о городе сказано:</p>\n<ul>\n<li>герой приходит в себя на газоне на крыше пятиэтажки, трава «строго постриженная, словно прическа солдата», крыша без бортиков — «кто нибудь из этих спящих бедолаг в принципе мог перевернуться и выпасть»; на крыше бетонное сооружение с железной дверью «Выход с крыши»;</li>\n<li>дом — заброшка: «Нет здесь людей, вещей которые бы обозначали, что здесь живут», воздух в подъезде застоявшийся, пыльный и душный, «Вряд ли бы нас кто на жилое здание поперл бы»;</li>\n<li>город пуст полностью: «Ни взглядов отвращения из-за грязных штанов. Ни гула машин. Ни даже песни наших младших пернатых братьев. Ничего»;</li>\n<li>при этом работает на вид обычный «магазин 24»: стеклянные витрины с продукцией, воздух там не застоявшийся, дверь не заперта;</li>\n<li>двери герою открываются: «Я дергаю дверь. И о чуда она открылась», «Почему то на двери мне сегодня везёт. Хотя я всегда был везунчиком»;</li>\n<li>кончается кусок ночью в переулке, герой приходит в себя в луже собственной крови с раной в боку.</li>\n</ul>\n<p>Как герой туда попал — в тексте не объяснено, это и есть заявленная загадка. Единственное уточнение по устройству места, которое Миколай попросил 2026-02-16 (433182): «насколько она широкая интересно, 150 м²» — про газон на крыше. Ответ Славы: «Хрен знает» (433184). Размеры не зафиксированы.</p>\n<h3>Бесконечный данж (<a href=\"IS-0089.html\">Рогалик и бесконечный данж</a>)</h3>\n<p>Замысел Славы от 2026-04-11 (окно w0119, id 457505–457512, затем 457546–457576). Постановка (457506):</p>\n<div class=\"q\"><p>Я хочу написать Рогалик и бесконечный данж. Смысл ясен да.<br>Типо гг просыпается в начале данже и ничего не помнит, проходит дальше и умирает и снова оказывается в самом начале, но сам данж изменился.<br>Бесконечный данж означает здесь нет конца, как и концовки. Это просто для меня бесконечный рассказ, который я никогда не закончу.</p></div>\n<p>Устройство пространства выяснено чередой прямых вопросов Миколая и односложных ответов Славы (457546–457560): «ну данж это подземка», «там есть внешний мир?» — «Нет»; «он может в обычный мир попасть» / «или город есть внутри данжа» — «Нет», «Нет»; «но обычный мир существует?» — «Нет. Просто бесконечный данж. И всё».</p>\n<p>То есть мир один и он же единственный: внешнего мира не существует вообще, города внутри данжа нет, перемещаться некуда и не из чего. Это прямая противоположность устройству ледяного мира, где обычный мир есть и герой в него возвращается; соотнесения этих двух устройств в переписке нет.</p>\n<p>Внутренняя геометрия (457566–457575):</p>\n<ul>\n<li>«начальная комната в которой выдаются базовое оружие. У каждого начальная комната своя»;</li>\n<li>«там нету первого уровня. У каждого свои данжы. Но они подобраны так чтобы все-таки был шанс на выживание при твоём текущем состоянии»;</li>\n<li>на уточнение Миколая «просто у каждого свой данж» Слава поправляет: «Нет у них один данж, но свои комнаты», и поэтому «они могут пересекаться с другими людьми».</li>\n</ul>\n<p>Уровни и условия соавтор решил не проектировать заранее: «Похую на данж его условия будт каждый раз меняться и я уже походу буду придумывать условия. Для нового уровня» (457507), «Уровни данж я там уже на ходу буду придумывать, это не так уж и важно Из-за его вычных изменений условий» (457515). Обсуждать он взялся именно систему прокачки: «Мне нужно именно система прокачки» (457576).</p>\n<p>Направление данжа осталось нерешённым: движение описано словом «спускаются», и Миколай отдельно спросил, «или можно вечно вверх идти тоже» (457568) — прямого ответа на «вверх» в переписке нет.</p>\n<h3>Обстановка «Сумасшедшего где-то?» (<a href=\"PS-0356.html\">Дариус Баллив</a>)</h3>\n<p>Текст главы 1 Слава прислал 2026-02-20 в 08:59 тремя сообщениями (окно w0119, id 435083–435085). Обсуждения в окне нет — в карточке помечено: «Вселенная в чате не названа. Персонажи Ден, Клар, Джек, Карен и мальчик с красными глазами существуют только внутри текста, отдельного обсуждения по ним в окне нет».</p>\n<p>Что даёт текст об устройстве места: действие идёт «среди обгоревших обломков домов», на месте уничтоженной деревни; отдельно названа деревня Ликней, где живёт семья командира Дена. Есть дворянские семьи, есть отряды в масках, собирающие «горечь, страх и отчаяние» в стеклянную пробирку, есть мана. Дариус называет себя «посланником Божьим», и рассказчик уточняет: «ведь он правда был посланником Божьим, только не их Бога» — то есть богов в этом тексте как минимум два, «их Бог» и Бог Дариуса, но ни один не назван. Глава 2 начинается с кареты, «украшеной золотыми узорами», внутри — черноволосый мальчик с алыми глазами и мужчина, и обрывается на середине абзаца.</p>\n<p>Географических имён во всём материале вселенной два: деревня Ликней и сожжённая деревня, из которой собрана пробирка; последняя по имени не названа, связаны ли они — не сказано.</p>\n<h3>Обстановка «Цены жизни» (<a href=\"IS-0088.html\">Цена жизни</a>)</h3>\n<p>Рассказ Славы, скинут 2026-02-16 в 22:31 (окно w0118, id 433706), написан, по его словам, «На прошлое недели» (433711). Сам он оценил текст словами «Просто хуйня» (433707). Обстановка проступает только через реплики: существует совет, принимающий решения о судьбе убийцы («совет принят объективное решение»); существует помещение с трупами и охраной («они быстро шагом направились в комнату, где хранились трупы. Охранники лишь встали и поздоровались»); мир опасный и убыльный — слова Бена: «Не тогда когда мир был пропитан законам и правилам, не сейчас, когда мы дохнем как мухи, чтобы хоть что-то защитить. Люди никогда не будет объективными». В карточке помечено: «упомянуты „совет“, который принимает решения, и мир, где „мы дохнем как мухи“ — окружение не раскрыто».</p>\n<h3>Кто правит</h3>\n<p>Ни в одном из кусков не названо ни правителя, ни бога-распорядителя, ни организации, управляющей миром.</p>\n<ul>\n<li><strong>Ледяной мир</strong> — никого. Ива исполняет желание, но кто она и подчиняется ли кому-то, не сказано.</li>\n<li><strong>Пустой город</strong> — никого. Кто перенёс на крышу семерых, не сказано; это открытый вопрос самой истории.</li>\n<li><strong>Бесконечный данж</strong> — правителя нет. Есть таинственный торговец, который продаёт навыки, и есть неназванная сила, подбирающая подземелья «так чтобы все-таки был шанс на выживание при твоём текущем состоянии». Кто подбирает — не спрошено и не сказано.</li>\n<li><strong>«Сумасшедший где-то?»</strong> — есть дворянские семьи, иерархия «господин / командир / подчинённые», «руководство», от имени которого выступает Дариус, и два Бога. Прямо ни один правитель не назван.</li>\n<li><strong>«Цена жизни»</strong> — есть «совет», принимающий «объективное решение». Из кого он и кем поставлен — не сказано.</li>\n</ul>\n<h3>Как куски связаны между собой</h3>\n<p>Ни одной связи между кусками в переписке не проведено. Что зафиксировано в разделах «Связано с» — четыре замкнутых кластера:</p>\n<ul>\n<li>ледяной мир (окно w0117, 2026-02-16, всё из одного сообщения 433473): Ледяной мир ↔ Плакучая ива ↔ Согревание застывшего мира ↔ история про ледяной ад (<a href=\"IS-0087.html\">история про ледяной ад</a>) ↔ План истории про ледяной ад (План истории про ледяной ад <em>(статьи ещё нет — <a href=\"kb/SL-0132-plan-istorii-pro-ledyanoy-ad.html\">исходник</a>)</em>) ↔ каламбур «кровля от крови» (кровля от крови <em>(статьи ещё нет — <a href=\"kb/ID-0166-krovlya-ot-krovi.html\">исходник</a>)</em>);</li>\n<li>пустой город (w0117, 2026-02-14 и 2026-02-16): Любимый город ↔ Пустой город ↔ Рассказчик ↔ Жених;</li>\n<li>данж (w0119, 2026-04-11): Рогалик и бесконечный данж ↔ Система прокачки ↔ Петля возрождения ↔ Другие исследователи ↔ Таинственный торговец ↔ Четыре стадии компетентности;</li>\n<li>«Цена жизни» (w0118, 2026-02-16): Цена жизни ↔ Ден ↔ Бен ↔ Крис.</li>\n</ul>\n<p>Одиночка — «Сумасшедший где-то?» / Дариус Баллив (w0119, 2026-02-20).</p>\n<p>Единственный мостик между кластерами не сюжетный, а разговорный. 2026-02-16 в 11:45–11:46 Миколай, дочитывая «Любимый город», говорит про свой ледяной замысел: «мб по забыл и украл», «мб спи додумался», «но я историю сейчас планирую», «то есть план писал», «и там такая же идея» (433110–433115). Из-за этого в карточке <a href=\"IS-0087.html\">история про ледяной ад</a> «Любимый город» стоит в списке «Связано с». В чём именно совпадает идея, не расшифровано; ни один из авторов не сказал, что это один и тот же мир.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<ul>\n<li><code>SL-0133</code> «Документ-систематизация концепций и миров» — 2 входящих, 4438 знаков базы, статьи нет. Самая дорогая позиция «Иссекая»: это единственная незакрытая сущность с более чем одной ссылкой, и именно на её дату (2026-02-13) опирается левая граница шапки вселенной — граница стоит на записи, статьи о которой не существует. Плюс это единственный мостик наружу: сущность числится сразу за «Иссекаем» и за «7 островами».</li>\n<li><code>SL-0132</code> «План истории про ледяной ад» — 1 входящая, 4938 знаков. Формально дешевле, фактически нет: из одного сообщения 433473 выросли четыре статьи разом — <code>MR-0190</code> «Ледяной мир», <code>MN-0028</code> «Плакучая ива», <code>SP-0260</code> «Согревание застывшего мира», <code>IS-0087</code> «история про ледяной ад». Запись-источник, на которой стоит весь этот куст, статьи не имеет.</li>\n<li><code>SL-0142</code> (6688), <code>ID-0166</code> (4401), <code>SL-0141</code> (4203) — по 1 входящей, дальше по остаточному принципу.</li>\n</ul></div>", "r": [["кровля от крови", "kb/ID-0166-krovlya-ot-krovi.html"], ["План истории про ледяной ад", "kb/SL-0132-plan-istorii-pro-ledyanoy-ad.html"], ["Дариус Баллив", "PS-0356.html"], ["Ледяной мир", "MR-0190.html"], ["Пустой город", "MN-0027.html"], ["Плакучая ива", "MN-0028.html"], ["Рогалик и бесконечный данж", "IS-0089.html"], ["Цена жизни", "IS-0088.html"], ["история про ледяной ад", "IS-0087.html"]]}, {"t": "Организации и сообщества", "a": ["S03", "VS-0005-S03", "VS-0005--organizacii-i-soobschestva"], "h": "<p>Записей вида «группа» (GR-) у вселенной нет ни одной. Всё, что похоже на организацию, живёт внутри присланных Славой прозаических текстов; отдельно организации соавторы не обсуждали ни разу — они разбирали язык, мотивацию персонажей и механику прокачки. Ни одной организации с собственным названием в материале нет: отряд Дена безымянный, совет назван просто «советом», начальство над Дариусом — просто «руководством», семья Баллив названа только фамилией.</p>\n<h3>Отряд под командой Дена — «Сумасшедший где-то?» (2026-02-20, id 435083–435085)</h3>\n<p>Единственная в материале структура с начальником, подчинёнными, заданием, отчётностью и наказанием. В тексте она называется «группа», «отряд», «семёрка», «члены этой группы»; слово «сборщики» принадлежит навигационной строке базы, а не авторам.</p>\n<p><strong>Состав и вид.</strong> «Ранним утром. Среди обгоревших обломков домов. Стояло семь людей, у каждого из них было скрыто лицо повязками и лишь глаза были видны». Отличить их друг от друга нельзя — Дариус поясняет: «имя перепутал? Ну прости, вы все в масках, вас очень сложно отличить Клар». По именам названы:</p>\n<ul>\n<li><strong>Ден</strong> — «высокий мужчина в маске», командир отряда, хранит при себе пробирку со сбором и отчитывается лично Дариусу;</li>\n<li><strong>Клар</strong> — зелёные глаза, входит в тройку, отвечавшую за то, чтобы никто не сбежал; первым возражает Дариусу и первым просит командира убить его безболезненно;</li>\n<li><strong>Джек</strong> — стоял ближе всего к Дариусу, единственный, кто увернулся от ножей и ударил в ответ; Дариус называет его «самый смышлёный из этой семёрки», добавляя «жаль только, что слабый»;</li>\n<li><strong>тройка сильнейших</strong> — трое, что «покорно сидели»; Ден о них: «те трое сильнейший в нашей группе и их потери может быть..». Двое из тройки по именам не названы.</li>\n</ul>\n<p>Отдельно стоит <strong>Карен</strong> — назван Дариусом по имени как команда к атаке («Дариус, как всегда улыбнулся и произнёс - Карен-»), после чего «из слепой зоны для группы вылетели ножи». Действует на стороне Дариуса против отряда; входит ли он куда-то формально и кто он — в тексте не определено. Его ножи отравлены, Дариус про себя отмечает: «Ножи отравлены, они долго не протянут», у поражённых «мышцы горели, а нейрная система сошла с ума», температура тел повышается, чувствительность обостряется.</p>\n<p><strong>Чем занимается.</strong> Первый вопрос Дариуса при встрече: «Не могли бы вы показать, сколько успели собрать». Ден передаёт «стеклянную пробирку, украшенную железными узорами», внутри — чёрно-красная жидкость, пробирка заполнена на треть. Мысль Дариуса: «В принципе не плохо. С такой маленькой деревни собрать такое большое количество горечи, страха и отчаяния». Сама деревня к моменту сцены — «обгоревшие обломки домов». Кто пробирки принимает дальше, куда они идут и что с ними делают, в переписке не сказано.</p>\n<p>Сбор продолжается и по ходу разговора: когда Дариус называет деревню Ликней, где живёт семья Дена, «Дариус взглянул на него и его улыбки слегка дрогнула, но попутно замечая, как пробирка стала чуть тяжелее». Связь между страхом Дена и весом пробирки авторами не проговорена — два факта стоят рядом в тексте.</p>\n<p>Вторая обязанность — зачистка и проверка: «как вы могли допустить, что сбежало аж два человека», «плохо проверили места преступления». Сбежавшие — дети; один очевидец остался на месте, под грудой обгоревших досок («на них смотрели два красных глаза»). Оправдание отряда — «сбежавший были лишь дети», ответ Дариуса — «а разве вы должны думать / у вас было лишь одна задача, и вы с ней не справились». Про себя они — убийцы: «Тройка не желая вызывать ещё большую вину опустила голова, чтобы их глаза не пересеклись, что за трогательная сцена... для убийц».</p>\n<p><strong>Как устроено подчинение.</strong> Дариус приходит один, знает имя командира и распоряжается; Ден рассуждает: «он вышел один и он знает моё имя. При этом так бесцеремонно командует. Возможно это блеф. Но лучше перестраховаться» — и командует своим: «Всем сесть на колени!», садясь первым и подавая пример подчинённым. Дариус на это: «молодчина Ден. Всё же не просто так стал командиром этого отряда». Когда Дариус говорит «но», Ден понимает: «теперь не было сомнения, что он от руководства», и отдельно — «Ден лишь больше убедился, что это вышестоящее». Значит, над отрядом есть <strong>руководство</strong>, к которому Дариус относится; ни имени, ни состава, ни названия у него в переписке нет.</p>\n<p>Право наказывать делегируется вниз: «и так Ден, так как ты командир этой группы. Ты должен их наказать» — Дариус бросает Дену нож. Ден просит: «Могу ли я принять наказание вместо моих подчиненых», кланяется до земли, бьётся об землю головой. Дариус соглашается, но наказанием оказывается поездка в деревню Ликней: «ты должен будешь убить одного члена своей семьи. Это и есть твоё наказание». Затем условие меняется на выбор — либо тройка, допустившая побег свидетелей, либо семья: «решай быстрее иначе я просто прикизу убить и твою жену и сына». Возражение Дена, что тройка — сильнейшие в группе, отбито формулой «не тебе решать, что может быть значимой потери для нас».</p>\n<p><strong>Внутренние связи.</strong> «Не у кого из них не было семьи, кроме Дена. Да и именно Ден пригласил большинство из них суда и дал вторую жизнь». Отсюда их решение: «Поэтому хотя бы так оплатить командиру» (авторская ремарка следом: «Интересно кому принадлежит эти мысли?»). Клар: «командир сделайте это. Только безболезненно», второй: «командир сделайте это бесполезнено». Ден «сделал это быстро и чисто, не дав товарищии ощутить боль».</p>\n<p><strong>Разгром отряда.</strong> Сразу после казни тройки Дариус вызывает Карена; «двое из них падают за мертво», Ден получает нож в плечо, «также как и одному из его соратников», Джек уворачивается и пробивает Дариусу сердце. Дариус выживает, после чего голова Джека «была перевёрнутая на 180 градусов». Ден в конце спрашивает «Да ...к-о т-ы та-ко?» и получает тот же ответ — «Посланик Божьей». Арифметика в тексте не сходится: из семерых трое убиты Деном, но дальше падают замертво ещё двое, ранены Ден и один соратник, плюс действует Джек. В переписке это не замечено и не исправлено.</p>\n<p><strong>Приём текста.</strong> Миколай его в окне так и не прочитал: «немного позже прочитаю» (435237, 2026-02-20 14:05), «ну я правда прочитать хочу, но щас не могу», «нет сил на это» (435617–435619, 2026-02-21), и ещё 2026-04-11 — «если че я пока не дочитал твою историю» (457628). Поэтому совместной разработки отряда, руководства и семьи Баллив не было.</p>\n<h3>Дворянская семья Баллив</h3>\n<p>Названа одной строкой: «Это был Дариус Баллив старший сын дворянской семьи Баллив» (id 435083). Дариус — «статный юноша лет 20», в дорогой одежде (после удара ножом «на груде начала расплываться красное пятно портя дорогую одежду», он пытается оттереть пятно платком, потом отряхивает пыль с плеча). Других членов семьи, владений, положения семьи в мире, отношения семьи к отряду или к «руководству» в переписке нет; сама фамилия больше нигде не возникает.</p>\n<p>Себя Дариус представляет как «посланик Божией», и авторская ремарка уточняет: «ведь он правда был посланником Божьим, только не их Бога». Ни один из двух богов не назван, никакой церкви или культа в материале нет.</p>\n<h3>Совет и хранилище трупов — «Цена жизни» (2026-02-16, id 433706)</h3>\n<p>Совет упомянут одной репликой. Ден в споре с Беном: «потому что мы с тобой не имеем права судить»; Бен: «А кто имеет право. Бог что-ли или дьявол»; Ден: «совет принят объективное решение». Совет — орган, который принимает решения о наказании и на чью объективность ссылается Ден. Бен объективность отрицает: «с каких пор люди стали объективными. Не тогда когда мир был пропитан законам и правилам, не сейчас, когда мы дохнем как мухи, чтобы хоть что-то защитить. Люди никогда не будет объективными». Из этой же реплики видно, что есть некое «мы», которое «дохнет как мухи, чтобы хоть что-то защитить»; что это за «мы», не раскрыто.</p>\n<p>Рядом упомянута ещё одна служба, тоже без названия: Бен ведёт Дена «в другое здание», где «хранились трупы», в комнату с мешками; «Охранники лишь встали и поздоровались». Трупы хранятся организованно и под охраной, охрана знает Бена и Дена в лицо. Чьи это охранники — не сказано.</p>\n<h3>Данж: организаций нет</h3>\n<p>В бесконечном данже никакой организации, лагерей, гильдий, союзов между исследователями не заявлено. Внешнего мира и города, где они могли бы объединяться, тоже нет. Единственная фигура с ролью в обмене — таинственный торговец, у которого покупаются навыки.</p>\n<h3>Шестеро на крыше — «Любимый город» (2026-02-14, id 432538)</h3>\n<p>Единственный в материале сводный список состава — перечисление людей, оказавшихся вместе, без всякой организации за ними. Дословно: «на этой лужайке ещё шесть человек, старики и дети, женщины и мужчины. Мужчина средних лет с обручальным кольцом на пальце, пацан лет десяти, ну и подросток. Также молодая женщина в отключки, старичок, да и девчуля подросток. Идеальная команда для семейного конкурса. Всё такие ухоженные и единственный я белая ворона».</p>\n<p>Группой это сообщество не становится: рассказчик сразу уходит — «оставаться в группе, в которой я очнулся первым, и в которой я самый подозрительный, не лучшая идея». Кто и зачем собрал этих людей на крыше, не сказано. В тексте есть только косвенное «нас кто»: «это кажись заброшка... Вряд ли бы нас кто на жилое здание поперл бы». Никакой организации, эксперимента, игры или устроителя не названо.</p>", "r": []}, {"t": "Население и классы", "a": ["S04", "VS-0005-S04", "VS-0005--naselenie-i-klassy"], "h": "<p>Записей, описывающих разряд обитателей, а не отдельного человека, в базе вселенной две: <a href=\"PS-0358.html\">Другие исследователи</a> «Другие исследователи» и <a href=\"PS-0357.html\">Таинственный торговец</a> «Таинственный торговец» (последний — роль-должность, названная одной репликой). Остальные записи-персонажи — отдельные люди: Жених, Рассказчик «Любимого города», Дариус Баллив, Ден, Бен, Крис. Разряды, перечисленные ниже без собственных записей (шестеро с крыши, семёрка в масках, дворянство, совет и охрана, «юный герой»), существуют только внутри присланных текстов.</p>\n<p>Общего населения, общей расовой картины и общей сословной лестницы у четырёх кусков вселенной нет — в переписке нигде не сказано, что эти истории происходят в одном мире.</p>\n<h3>Главный герой «Рогалика» и другие исследователи (2026-04-11)</h3>\n<p>Единственное в материале отношение двух разрядов населения, названное авторами прямо.</p>\n<p><strong>Главный герой</strong> собственной записи-персонажа не имеет, описан внутри истории и способности. «Гг просыпается в начале данже и ничего не помнит, проходит дальше и умирает и снова оказывается в самом начале, но сам данж изменился» (457506).</p>\n<p><strong>Другие исследователи</strong> (<a href=\"PS-0358.html\">Другие исследователи</a>) введены Славой сразу как условие задачи о прокачке (457515): «Допустим там есть другие исследователи ( ну то бишь люди который здесь очутились и спускаються по данжу, но без возможности вернуться в прошлое). И вот система прокачки. Типа навыки и очки, ну и деньги.?»</p>\n<p>Уточнения — из ответов на вопросы Миколая (457561–457575):</p>\n<ul>\n<li>происхождение: на вопрос «а другие люди умирающие откуда появляются? спавн?» ответ — «Они не помнят». Это весь ответ;</li>\n<li>«начальная комната в которой выдаются базовое оружие. У каждого начальная комната своя»;</li>\n<li>«Другие люди навсегда умирают если что» — главное, чем они отличаются от главного героя;</li>\n<li>«там нету первого уровня. У каждого свои данжы. Но они подобраны так чтобы все-таки был шанс на выживание при твоём текущем состоянии»;</li>\n<li>«Ну они могут пересекаться с другими людьми», потому что «у них один данж, но свои комнаты».</li>\n</ul>\n<p>Отличие разрядов — только в смерти: герой умирает и оказывается в начале (петля), другие «навсегда умирают». Память утрачена у обеих сторон: герой «ничего не помнит», другие «не помнят». Чем ещё герой отличается от остальных — в переписке не сказано.</p>\n<p>Существование других исследователей поставлено как причина, зачем система прокачки вообще нужна: именно из-за них была отвергнута идея прокачки через каннибализм (возражение Славы — «А другие персонажам как качаться»). Пользуются ли другие исследователи тем же торговцем и тем же ОЭм — в переписке не сказано.</p>\n<h3>Таинственный торговец (<a href=\"PS-0357.html\">Таинственный торговец</a>)</h3>\n<p>Введён одной репликой: за прохождение уровня даётся ОЭм, на них покупаются навыки, а на вопрос, где покупать, — «Купить у таинственного торговца» (457554). Единственная неигровая инстанция в данже. В карточке помечено: «Кто он и откуда в данже — не обсуждалось».</p>\n<h3>Рассказчик «Любимого города» и Жених</h3>\n<p><strong>Рассказчик</strong> (<a href=\"PS-0351.html\">Рассказчик «Любимого города»</a>) собственного имени в тексте не имеет. Признак, по которому он отделяет себя от остальных: «Всё такие ухоженные и единственный я белая ворона или как там говрилась?» и дальше — «Кроме инстинктивного понятия того, что мне мясоеду не место на зелёной лужайке».</p>\n<p><strong>Жених</strong> (<a href=\"PS-0352.html\">Жених</a>, самая крупная запись вселенной) — «Мужчина средних лет с обручальным кольцом». Прозвище дано рассказчиком по признаку: «Я сразу понял, что это за мужчина. Жених. Ну мужчина с обручальным кольцом». Очнулся вторым, в чёрной кофте пробежал вниз мимо упавшего рассказчика, «тяжело дыша, но быстро потеряв ко мне интерес побежал дальше вниз». Вывод рассказчика: «И куда он так целеустремленно несётся» — «появление это мысли обозначало бы, что Жених что-то знает. Ну или он психанул, когда очнулся на крыше и просто начал бежать. Вот только лицо его выглядили уж слишком собраным и полным надежд».</p>\n<p>Вторая версия записи — разбор Миколая 2026-02-16 (id 433167): почему Жених потерял интерес — «либо он подумал что мальчик не человек / либо он подумал что он не пьяный». Реплика оборвана, кто такой «мальчик» в этой догадке, не поясняется, обсуждение дальше не пошло. Ни одна из версий не подтверждена и не отвергнута — история не продолжена, в карточке <a href=\"IS-0086.html\">Любимый город</a> стоит: «История не закончена, продолжения в окне нет».</p>\n<p>Остальные четверо с крыши (пацан лет десяти, подросток, молодая женщина, старичок, девчуля-подросток) отдельными записями не оформлены и в тексте больше не появляются.</p>\n<h3>Население пустого города</h3>\n<p>Его нет. «Никого не было. Ни взглядов отвращения из-за грязных штанов. Ни гула машин. Ни даже песни наших младших пернатых братьев. Ничего». Ни людей, ни машин, ни птиц. Пятиэтажка — заброшка. При этом «магазин 24» работает на вид: продукция на месте, воздух не застоявшийся, двери не заперты.</p>\n<h3>Дворянство, посланник и «юный герой»</h3>\n<p>Дариус Баллив — «старший сын дворянской семьи Баллив». Это единственное сословное обозначение во всём материале вселенной. Что такое дворянство в этом мире, сколько таких семей, как они соотносятся с отрядами — не сказано.</p>\n<p>Второе самоопределение Дариуса не сословное: на вопрос «кто ты?» он отвечает «посланик Божией». Отряд считывает его иначе: Ден убеждается, «что это вышестоящее», и обращается «господин».</p>\n<p>Ещё одна фигура, названная разрядом: бледный мальчик лет двенадцати, «с чёрными волосами и с алой красными глазами», сидящий «в убежище построенными хаосам» под обгоревшими досками. Дариус «поклонившись сказал - здравствуйте юный герой-». Слово «герой» здесь — обращение-титул; что оно означает в этом мире, не поясняется. Глава 2 начинается с кареты, где едут этот мальчик и мужчина, «что не сводил глаз с мальчика»; кто этот мужчина, не сказано.</p>\n<h3>Люди «Цены жизни»</h3>\n<p>Мир населён обычными людьми; названы совет и охрана при хранилище трупов (см. раздел об организациях). Общее состояние людей задано репликой Бена — «мы дохнем как мухи, чтобы хоть что-то защитить». От кого защищают и что происходит — не сказано.</p>\n<p>Персонажи: <strong>Ден</strong> (каштановые волосы, позиция второго шанса — «он не желал ему смерть. Это вышло случайно», «он же ещё ребёнок», «ему надо дать второй шанс», «Бен мы его накажем. Только не так, как хочешь ты»), <strong>Бен</strong> (черноволосый, красные глаза, позиция мести — «Второй шанс!! - скажи это Крису. Крису кто-нибудь давал второй шанс», «и ты хочешь, чтобы я просто отпустил того, кто отнял чужое будущее?», «ты не остановишь меня своими словами. Тем более когда ты сам в них не до конца веришь»), <strong>Крис</strong> (убитый ребёнок, в сцене — труп в мешке). Подросток-убийца в сцене не присутствует и имени не имеет.</p>\n<p>Замысел шире сцены, объяснён Славой сразу после текста (433713): «Точнее чувство виновности и цены жизни. Я хотел написать историю о персонажей, что говорит о том что не виновен и представляет вполне разумный доводы ну мстительный дух его всё равно заебыввет». Что такое «мстительный дух» — сущность или метафора — не разъяснено, записи под него нет.</p>\n<p><strong>Ден в двух текстах.</strong> В «Цене жизни» (2026-02-16) Ден — каштановолосый, защитник второго шанса; в «Сумасшедшем где-то?» (2026-02-20) Ден — командир отряда в маске. В базе помечено: «В следующем окне (w0119, история „Сумасшедший где-то?“) тоже действует Ден — командир отряда; тождество персонажей не заявлено». Соавторы совпадение имён не обсуждали.</p>\n<h3>Ледяной мир: населения нет</h3>\n<p>Населённость определена прямо: «но это не рай, рай другое. рай это другие. он ходит и разговаривает с застывшим миром. ведь в обычном мире у него есть близкие которые его ждут к которым он хочет какие то планы». Населения там нет по определению, и это оформлено формулой «рай это другие». Единственный житель — герой, разговаривающий с застывшим миром.</p>\n<h3>Прилегающее: перерождённые (иссекай-типаж), вне вселенной</h3>\n<p>Единственная в архиве запись, где «иссекай» описан как разряд существ, — <a href=\"PS-0020.html\">Перерождённые герои (иссекай-типаж)</a> «Перерождённые герои (иссекай-типаж)» (2023-06-13, окно w0015, id 45001–45016 и 45033–45039). Вселенная у записи стоит «неясно», к <a href=\"VS-0005.html\">Иссекай</a> материал не отнесён, дата на два с половиной года раньше. Разговор начался с типажа «маленьких скромных мальчиков» из аниме, манги, ранобэ; Слава на вопрос, нравится ли ему такой типаж, ответил «Не особо» и «Ну не думал».</p>\n<p>Описание разряда дано Миколаем сплошняком: «Они обычно иссекаятся»; «До перерождения их возраст от 15 до 45»; «После перерождения до 7»; «Они обладают воспоминаниями из прошлой жизни, хотят жить лучше чем раньше, приносить пользу людям»; «Для этого используют навыки и знания накопленные в прошлом и возможности нового мира, например магия или фамильяры»; «И у них много друзей». В записи помечено: «Вселенная не объявлена; неясно, для своего мира это или обобщение аниме-тропа».</p>\n<p>Связь этого разряда с материалом 2026 года в переписке не установлена. Ни один персонаж Иссекая 2026 года не описан как перерождённый: рассказчик «Любимого города» просто просыпается на крыше, герой «Рогалика» просто просыпается в данже без памяти.</p>", "r": [["Другие исследователи", "PS-0358.html"], ["Таинственный торговец", "PS-0357.html"], ["Рассказчик «Любимого города»", "PS-0351.html"], ["Жених", "PS-0352.html"], ["Перерождённые герои (иссекай-типаж)", "PS-0020.html"], ["Любимый город", "IS-0086.html"]]}, {"t": "Система способностей", "a": ["S05", "VS-0005-S05", "VS-0005--sistema-sposobnostey"], "h": "<p>Единой системы сил во вселенной нет. Материал распадается на три несвязанных набора, между которыми в переписке не проведено ни одной связи: бесконечный данж (2026-04-11, id 457505–457627), ледяной мир (2026-02-16, id 433471–433474) и текст «Сумасшедший где-то?» (2026-02-20, id 435083–435085). Ни одной реплики, где авторы соотносят ману Дариуса с навыками в данже или с согреванием, не существует.</p>\n<p>Сущностей вида «способность» во вселенной три: <a href=\"SP-0262.html\">Система прокачки в бесконечном данже</a> «Система прокачки в бесконечном данже» (5 версий — наибольшее число версий в карточке), <a href=\"SP-0261.html\">Петля возрождения ГГ</a> «Петля возрождения ГГ» (2 версии), <a href=\"SP-0260.html\">Согревание застывшего мира</a> «Согревание застывшего мира» (1 версия).</p>\n<h3>Данж: покупка + повторение + мастерство</h3>\n<p>Вся механика обсуждена за одно утро 2026-04-11 (около 09:09–09:57). Сам Слава разбил работу на три вопроса (457506): «Во первых надо условия данжа сделать, способ прокачки, оружия и т. Д. После надо решить как гг будет возрождаться». Условия данжа он тут же снял с обсуждения и вернул разговор к прокачке.</p>\n<p>Итог обсуждения (457612–457627) сведён Миколаем к формуле <strong>«продажа навыков и прокачка через повтор»</strong> (457617), плюс третья составляющая — мастерство.</p>\n<p><strong>1. Откуда навык берётся: покупается за ОЭм у таинственного торговца.</strong> Предложение Славы (457551): «Вообще типо за прохождения уровня получаешь допустим ОЭм и можешь купить навыки. Пассивный который всегда усиливают. И активный типо огненный шар». Продавец назван следующей репликой: «Купить у таинственного торговца» (457554).</p>\n<ul>\n<li>источник валюты — прохождение уровня;</li>\n<li>валюта — <strong>ОЭм</strong>. В карточке <a href=\"SP-0262.html\">Система прокачки в бесконечном данже</a> помечена неясность: «Валюта названа „ОЭм“ — неясно, то же ли это, что энергия/вселенная Оам-Оэм из других мест архива, или просто созвучие»;</li>\n<li>два рода навыков: <strong>пассивные</strong> — «который всегда усиливают», и <strong>активные</strong> — «типо огненный шар»;</li>\n<li>базовое оружие, в отличие от навыков, выдаётся бесплатно — в начальной комнате, у каждого своей.</li>\n</ul>\n<p>В самой первой постановке (457515) Слава перечислял составляющие иначе: «Типа навыки и очки, ну и деньги.?». Миколай спросил «почему деньги?» (457546) — прямого ответа в переписке нет, вместо ответа Слава выдал схему с ОЭм.</p>\n<p><strong>2. Как навык растёт: через повтор действий.</strong> Предложение Миколая (457585–457597), названное им самим «идея которая мне нравится», «она реалистичная во много»: «прокачка через использование»; «типа хочешь стать мечником, используй меч»; «чем дольше» — «тем круче»; на вопрос Славы «А откуда навыки получить?» — «через повтор действий»; норма роста названа числом: «то есть персонаж долго повторяет одно и тоже и каждые повторов 50 на столько растет, что осваивается». При итоге Миколай добавил оговорку: «и можно не тупо повторять, а пробовать по другому» (457618).</p>\n<p>Слава возразил вопросом «А огненный шар откуда взять?» (457595–457596) — чистое повторение не объясняет появление активного навыка. Компромисс предложил он же (457601): «Ну можно сделать покупку навыка и качать его мастерство и мощь, через повторения».</p>\n<p><strong>3. Мастерство — отдельная величина.</strong> Слово ввёл Слава (457619). Миколай уточнил: «типа идеальное владение или степень владения навыком?» (457623). Определение Славы (457624): «Ну типа пользоваться более умело. Типо стрелять метка и махать мечом плавней. Ну использовать способность по разному». После этого Миколай согласился («о, ну тогда да») и обсуждение закрылось: «пока-что всё?» — «Ну да» (457626–457627).</p>\n<p>Таким образом различаются три вещи, названные авторами по отдельности: <strong>навык</strong> (покупается), <strong>мощь</strong> (растёт через повторения), <strong>мастерство</strong> (умелость и разнообразие применения).</p>\n<p><strong>Отдельный тезис: сила уже есть, знания о ней нет.</strong> Миколай (457602): «ну тогда я представляю что персонаж изначально это может, просто он может не знать что это может». Под этот тезис он скинул справку — Четыре стадии компетентности <em>(статьи ещё нет — <a href=\"kb/SL-0142-chetyre-stadii-kompetentnosti.html\">исходник</a>)</em> «Четыре стадии компетентности» (457609): неосознанная некомпетентность («Я не знаю, что я не умею») → осознанная некомпетентность («Я знаю, что я не умею», названа самым сложным этапом, потому что падает самооценка и пропадает мотивация) → осознанная компетентность («Я знаю, как это делать, но мне нужно об этом думать») → неосознанная компетентность («Я просто это делаю», состояние определено как мастерство, навык ушёл в подсознание), плюс бонусная пятая ступень — осознанная компетентность над неосознанной, уровень эксперта-преподавателя, который может разложить свой автоматизм обратно на детали, чтобы научить другого. В карточке помечено: «Текст явно откуда-то скопирован (общеизвестная модель обучения), авторским материалом не является». Сам Миколай после отправки заметил: «я думал покороче будет» (457610).</p>\n<p>Возражение Славы, которым спор и закрылся (457612–457613): «Ну да прикольно, но как гг навык получать будет разные. Если он их даже не помнит и не знает» / «Поэтому с продажей навыка всё ещё остаёмся». То есть беспамятство героя — прямая причина, по которой покупка навыков осталась в системе: связь названа в переписке словом «поэтому». Как четыре стадии компетентности встраиваются в итоговую механику и встраиваются ли вообще — не сказано.</p>\n<h3>Петля возрождения (<a href=\"SP-0261.html\">Петля возрождения ГГ</a>)</h3>\n<p>Вопрос поставлен Славой в объявлении замысла (457506) двумя вариантами: «Типа либо это просто петля» / «Либо после смерти нашого гг, мы будем переключаться на другого, который в начале. Ну я не уверен, что смогу это осилить».</p>\n<p>Разъяснение обоих вариантов Миколаю, попросившему «объясни че за петля че за другой» (457527–457528): «Ну где гг умирает и оказывается в начале то бишь петля» и «А про другого типо мы наблюдаем за гг и он умирает, ну и всё он по-настоящему умер и теперь у нас новый гг». Реакция Миколая на второй вариант: «а, нифига» / «я такое не видел».</p>\n<p>Решение принято до объяснения, репликой «Да всё я уже решил один гг» (457525), и закреплено отказом от второго варианта: «Только я такое не потяну» / «Не смогу» (457531–457532).</p>\n<p>Что происходит с купленными навыками, ОЭм и мастерством при смерти и возврате в начало — в переписке не сказано, вопрос не задан ни одним из соавторов.</p>\n<h3>Ледяной мир: согревание застывшего (<a href=\"SP-0260.html\">Согревание застывшего мира</a>)</h3>\n<p>Механика изложена внутри плана Миколая, целиком в одном сообщении (2026-02-16 21:31, id 433473). Дословно:</p>\n<div class=\"q\"><p>касаясь ничего не происходит. но сильно взаимодействуя он согревает что-то, но выходит резко, не равномерно, рука например тает, но все остальное замороженное, он тянет и отрывает и всё в кровяке.</p></div>\n<p>Что здесь названо:</p>\n<ul>\n<li><strong>порог</strong>: простое касание не даёт ничего, эффект включается только при сильном взаимодействии;</li>\n<li><strong>свойство эффекта</strong>: согревание идёт «резко, не равномерно» — целиком предмет не оттаивает;</li>\n<li><strong>цена</strong>: оттаявшая часть отделяется от замёрзшей при попытке потянуть, с кровью; пример в плане — рука;</li>\n<li><strong>масштаб</strong>: «возможно он согреет какую то территорию будет стараться типа а потом такой а зачем мне это» — согревание целой территории названо возможным, но как замысел, который герой бросает;</li>\n<li><strong>конец применения</strong>: «и просто замёрзнет, надолго замёрзнет полностью во льдах».</li>\n</ul>\n<p>В карточке <a href=\"SP-0260.html\">Согревание застывшего мира</a> помечено прямо: «Не сказано, свойство это самого мира или самого героя». От этого зависит, устроен ли ледяной мир так для всех или реагирует именно на этого героя; соавторы вопрос не поднимали. Ограничений по количеству, усталости или расходу в переписке нет.</p>\n<p>Вход в мир и выход из него — через плакучую иву, см. раздел «Масштаб».</p>\n<h3>Мана — «Сумасшедший где-то?»</h3>\n<p>Слово «мана» во всём материале вселенной встречается один раз, в тексте главы 1. Дариус получает нож в сердце от Джека: «Джек почуствовал, как вокруг пронзоного сердца Дариусу собралась мана виде оков и сердце Дариусу снова забилась». После этого Дариус спокойно говорит: «Всё же Джек ты самый смышлёный из этой семёрки — жаль только, что слабый», разворачивает голову Джека на 180 градусов и вынимает нож из своей груди.</p>\n<p>Названо: вещество называется мана; оно собирается вокруг пронзённого сердца; форма — оковы; результат — сердце снова забилось. Откуда мана берётся, кто её даёт, расходуется ли, есть ли предел, есть ли она у кого-то кроме Дариуса — в тексте и в переписке не сказано. Отдельной записи-способности под ману в базе нет.</p>\n<h3>Пробирка: сбор горечи, страха и отчаяния</h3>\n<p>По тексту: собирается горечь, страх и отчаяние людей; носитель сбора — чёрно-красная жидкость в стеклянной пробирке, украшенной железными узорами; вес пробирки растёт вместе с новым страхом («как пробирка стала чуть тяжелее»). Для чего собранное нужно, куда идёт, даёт ли оно силу — не сказано ни в тексте главы, ни в чате. Механика самого сбора не описана.</p>\n<p>Рядом стоит отравленное оружие Карена: действие яда описано физиологически — мышцы горят, нервная система сходит с ума, температура тела повышается, чувствительность обостряется.</p>\n<h3>Прилегающее: везение с дверями в «Любимом городе»</h3>\n<p>В карточке <a href=\"MN-0027.html\">Пустой город</a> зафиксировано формулировкой «Все двери герою открываются». В самом тексте это дважды подано как везение, а не как способность: дверь с крыши — «Я дергаю дверь. И о чуда она открылась»; дверь магазина — «Почему то на двери мне сегодня везёт. Хотя я всегда был везунчиком». Что это механика мира, в переписке не сказано.</p>\n<h3>Механики, которые предлагали и отклонили</h3>\n<ol>\n<li><strong>Каннибализм — съесть врага и забрать его навыки.</strong> Предложение Миколая (457539–457545): «ну я за каннибализм» / «мне всегда это нравилось» / «типа перс съедает врага сильного» / «и берёт так его навыки». Возражение Славы прозвучало раньше, чем Миколай договорил: «А другие персонажам как качаться» (457542). Итог: Миколай — «ладно ещё подумаю», Слава — «Нет». Причина отказа названа прямо: механика не покрывает других персонажей.</li>\n<li><strong>Смена главного героя вместо петли.</strong> Вариант самого Славы, отклонён им же: «Только я такое не потяну» / «Не смогу».</li>\n<li><strong>Обычный мир за пределами данжа.</strong> Предположения Миколая «он может в обычный мир попасть», «но обычный мир существует?» отклонены: «Нет» / «Нет» / «Просто бесконечный данж» / «И всё».</li>\n<li><strong>Город внутри данжа.</strong> Предположение Миколая (457553) отклонено тем же «Нет». Вместо города введён таинственный торговец.</li>\n<li><strong>Обычные люди, приходящие в данж извне.</strong> Реплика Миколая «обычные люди идут от туда» (457549) снята ответом «Они не помнят» и отсутствием внешнего мира.</li>\n<li><strong>Первый уровень и порядок спуска.</strong> Вопрос Миколая «они начинают с первого уровня или рандомно? или можно вечно вверх идти тоже» (457568) — ответ: «Ну там нету первого уровня», вместо этого подбор подземелья под текущее состояние. Про «вверх» ответа нет.</li>\n<li><strong>Отдельный данж на каждого.</strong> Предположение Миколая «просто у каждого свой данж» поправлено: «Нет у них один данж, но свои комнаты».</li>\n<li><strong>Чистая прокачка через использование, без покупки навыков.</strong> В первоначальном виде не прошла: Слава упёрся в вопрос «А огненный шар откуда взять?» и закрыл его формулой «Поэтому с продажей навыка всё ещё остаёмся». Отклонена не механика целиком, а её самодостаточность — прокачка через повтор осталась в итоговой связке.</li>\n<li><strong>Четыре стадии компетентности как несущая механика.</strong> Скинуты как опора, в систему не встроены; прямого «нет» не сказано, дальнейшего использования тоже нет.</li>\n<li><strong>Концовка-реклама в ледяном аде.</strong> Сомнение пометил сам автор плана: «насчёт рекламы я не уверен».</li>\n</ol>\n<p>В общем реестре отклонённого записей по «Иссекаю» нет — единственная запись там относится к вселенной «игра бога».</p>", "r": [["Четыре стадии компетентности", "kb/SL-0142-chetyre-stadii-kompetentnosti.html"], ["Система прокачки в бесконечном данже", "SP-0262.html"], ["Петля возрождения ГГ", "SP-0261.html"], ["Согревание застывшего мира", "SP-0260.html"], ["Пустой город", "MN-0027.html"]]}, {"t": "Возвраты", "a": ["S06", "VS-0005-S06", "VS-0005--vozvraty"], "h": "<p>Возврат в карточке один, и он же — единственное объявление вселенной вообще: 2026-02-14, окно w0117, сообщения 432538–432549, реплика Слава 09:29 (id 432541) «Я снова вернулся к Иссекаю».</p>\n<p>Смен (переименований, переучреждений, переходов вселенной в другую) и закрытий в файле не зафиксировано ни одного. Из чего именно был совершён возврат и что было первым разом — в переписке не сказано.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "VS-0005-S07", "VS-0005--probely"], "h": "<div class=\"gaps\"><p><strong>По самой вселенной</strong></p>\n<ol>\n<li><strong>Первичного объявления нет.</strong> Единственная реплика говорит о возвращении; когда Иссекай существовал до этого и откуда автор вернулся — не сказано.</li>\n<li><strong>Не разрешено, вселенная это или жанр.</strong> Источник помечает сам: «Заявка прозвучала в чате прямо, но неясно, вселенная это или жанровая рамка», и в <a href=\"IS-0086.html\">Любимый город</a>: «возможно, это жанр, а не название вселенной». Ни одна последующая реплика этого не проясняет. Слово используется в переписке и как жанровое: 2026-02-16 Миколай советует «пиши иссекай» в ряду советов по письму; 2025-12-17 (id 399662–399664) «не иссекай?» / «Иссекай» сказано про историю «Фанатик», заведённую во вселенную «Феня».</li>\n<li><strong>Кончина не объявлена.</strong> Дословной фразы о конце, закрытии или отказе от Иссекая в источнике нет. Правая граница отрезка 2026-04-19 стоит без объявления.</li>\n<li><strong>Три несогласованные границы:</strong> шапка даёт 2026-02-13 — 2026-04-11, таблица отрезков — 2026-02-14 — 2026-04-19. Расхождение слева (день) и справа (восемь дней) не объяснено.</li>\n<li><strong>Середина жизни вселенной не покрыта ни одной дословной репликой</strong> в файле вселенной: событие ровно одно, а 30 из 31 сущности заведены 16 февраля, 20–21 февраля и 11 апреля.</li>\n<li><strong>Ссылка Миколая на codepen</strong> (432549) попадает в окно объявления, но связь её с Иссекаем не названа. В составе есть служебное Игры на codepen <em>(статьи ещё нет — <a href=\"kb/SL-0141-igry-na-codepen.html\">исходник</a>)</em> «Игры на codepen» с 2026-02-16 — соотносятся ли они, не сказано.</li>\n<li><strong>Проза <a href=\"PR-0124.html\">Как же тебе жарко Бэн</a> «Как же тебе жарко Бэн»</strong> датирована 2026-02-21, вне обеих правых границ логики состава; персонаж <a href=\"PS-0354.html\">Бен</a> «Бен» заведён 2026-02-16, совпадение имён в переписке не оговорено. Сам обрывок — несколько строк про собаку в будке, сопровождённые словами «это все что я написал», «потом не продолжил», «я просто не придумал как я опишу».</li>\n<li><strong>Число миров не обсуждалось ни разу.</strong> Общей карты, космологии, иерархии миров нет. Связей между четырьмя кусками не проведено ни одной; единственное сближение — реплики Миколая «и там такая же идея» про «Любимый город» и свой ледяной замысел, в чём именно совпадение, не расшифровано.</li>\n<li><strong>Правителя нет нигде.</strong> Ближайшее к власти — «совет» в «Цене жизни» (кем поставлен, не сказано), дворянские семьи, «руководство» и два Бога в «Сумасшедшем где-то?», и неназванная сила, подбирающая подземелья под состояние идущего в данже.</li>\n</ol>\n<p><strong>По устройству мест</strong></p>\n<ol start=\"10\">\n<li><strong>Природа пустого города</strong> (иной мир, симуляция, опустевшая реальность) не объяснена; кто собрал на крыше семерых спящих и кто ранил рассказчика в ночном переулке — открытый вопрос самой истории. Размер газона на крыше остался без ответа: «Хрен знает».</li>\n<li><strong>Ледяной мир:</strong> кто и что в нём застыло, есть ли кто-то живой кроме героя, где он кончается — не сказано.</li>\n<li><strong>Природа ивы</strong> — «особое место», и только. Откуда она, одна ли она, кому ещё доступна — не сказано. Никакого другого способа перемещения между мирами в материале нет; в данже перемещение исключено принципиально.</li>\n<li><strong>Направление данжа</strong> (только вниз или можно вверх) осталось нерешённым: вопрос Миколая 457568 прямого ответа не получил.</li>\n<li><strong>Кто подбирает подземелья</strong> под состояние идущего — не спрошено и не сказано.</li>\n<li><strong>Условия данжа, уровни и оружие</strong> сняты с обсуждения самим автором («я уже походу буду придумывать условия»), то есть вопрос оставлен открытым намеренно.</li>\n</ol>\n<p><strong>По силам</strong></p>\n<ol start=\"16\">\n<li><strong>Что происходит с навыками, ОЭм и мастерством при смерти героя</strong> — вопрос не задан ни одним из соавторов, хотя петля и система прокачки обсуждались подряд в одном окне.</li>\n<li><strong>Что такое ОЭм</strong> — помечено в <a href=\"SP-0262.html\">Система прокачки в бесконечном данже</a>: неясно, то же ли это, что энергия/вселенная Оам-Оэм из других мест архива, или просто созвучие.</li>\n<li><strong>Кто такой таинственный торговец</strong> — «Кто он и откуда в данже — не обсуждалось». Где именно встречается, один он или их много — нет.</li>\n<li><strong>Пользуются ли другие исследователи той же системой прокачки</strong> (ОЭм, торговец) — не сказано, хотя именно их существование выставлено причиной, зачем система нужна.</li>\n<li><strong>Согревание — свойство мира или героя</strong> — прямо помечено как неразрешённое в <a href=\"SP-0260.html\">Согревание застывшего мира</a>.</li>\n<li><strong>Мана</strong> — откуда, кто даёт, расходуется ли, есть ли у кого-то кроме Дариуса; отдельной записи под неё нет.</li>\n<li><strong>Назначение собранного в пробирку</strong> не объяснено ни в тексте, ни в чате; даёт ли собранное силу — не сказано. Связь между страхом Дена и тем, что пробирка потяжелела, авторами не проговорена.</li>\n<li><strong>Четыре стадии компетентности</strong> остались висеть: скинуты как опора, ответом стало возражение про беспамятство, дальше не использованы.</li>\n<li>Ни разу не обсуждались: предел силы, потолок прокачки, обучение навыку от другого носителя, потеря навыка, врождённость или наследуемость сил, различие сил по происхождению.</li>\n<li><strong>Два утверждения о доступе к силе стоят рядом и не сведены:</strong> герой навыков «даже не помнит и не знает», и поэтому сам их не изобретёт (этим держится продажа), — и тезис Миколая, что «персонаж изначально это может, просто он может не знать что это может».</li>\n</ol>\n<p><strong>По населению и организациям</strong></p>\n<ol start=\"26\">\n<li><strong>Организаций почти нет.</strong> Записей вида «группа» у вселенной ноль; всё организационное существует только внутри четырёх прозаических текстов и ни разу не обсуждалось соавторами отдельно. Орденов, компаний, служб, государств, церквей, гильдий, корпораций в материале нет.</li>\n<li><strong>Названий нет.</strong> Отряд Дена безымянный, совет назван просто «советом», начальство над Дариусом — «руководством», семья Баллив названа только фамилией.</li>\n<li><strong>Кто такое «руководство»</strong> над Дариусом, как оно устроено, что за Бог, чьим посланником он себя называет, и кто «их» Бог — ничего не сказано.</li>\n<li><strong>Состав совета</strong> из «Цены жизни», его полномочия, чьи охранники стоят при хранилище трупов и что за «мы», которое «дохнет как мухи, чтобы хоть что-то защитить», — не раскрыто (помечено как неясность в базе).</li>\n<li><strong>Кто такой Карен</strong>, входил ли он в отряд или пришёл с Дариусом — в тексте не определено.</li>\n<li><strong>Счёт членов отряда не сходится</strong> (семеро, трое убиты Деном, затем ещё двое замертво плюс раненые и Джек). В переписке это не замечено и не исправлено.</li>\n<li><strong>Противоречие в семье Дена:</strong> Дариус сначала говорит «твоя жена и дочь», затем — «сынишки, что хочет стать таким же сильным, как ты», и «убить и твою жену и сына». Не обсуждалось.</li>\n<li><strong>Откуда берутся другие исследователи.</strong> Прямой вопрос «спавн?» остался без ответа: «Они не помнят».</li>\n<li><strong>Тождество двух Денов</strong> (командир отряда в «Сумасшедшем где-то?» и защитник второго шанса в «Цене жизни») не заявлено; вопрос в переписке не поднимался.</li>\n<li><strong>Что означает титул «юный герой»</strong> в мире «Сумасшедшего где-то?» — не поясняется.</li>\n<li><strong>Что имел в виду Миколай в догадке про Жениха</strong> «либо он подумал что мальчик не человек» — какой мальчик, реплика оборвана и не развёрнута.</li>\n<li><strong>Мстительный дух</strong> из замысла «Цены жизни» нигде не описан, записи под него нет.</li>\n<li>Джек, Карен, Клар, мальчик с красными глазами и четверо из шестерых на крыше отдельными записями не заведены — существуют только внутри текстов.</li>\n<li><strong>Связь <a href=\"PS-0020.html\">Перерождённые герои (иссекай-типаж)</a> «Перерождённые герои (иссекай-типаж)» (2023-06-13) с материалом 2026 года не установлена.</strong> Ни один персонаж Иссекая 2026 года не описан как перерождённый.</li>\n</ol>\n<p><strong>По текстам</strong></p>\n<ol start=\"40\">\n<li><strong>Ни один текст не дописан.</strong> «Любимый город» оборван на сцене в ночном переулке; продолжения, разгадки пустого города, объяснения, как семеро оказались на крыше и куда бежал Жених, нет. «История про ледяной ад» существует только планом — «Написан только план, самого текста нет», названия у истории нет. «Сумасшедший где-то?» оборван на середине абзаца главы 2. «Рогалик» по замыслу закончен не будет: «бесконечный рассказ, который я никогда не закончу».</li>\n<li><strong>Главный организационный текст не был прочитан соавтором:</strong> Миколай не дочитал «Сумасшедшего где-то?» ни 2026-02-20, ни 2026-02-21, ни к 2026-04-11 — «если че я пока не дочитал твою историю».</li>\n<li><strong>Обсуждение прокачки закрыто</strong> репликами «пока-что всё?» / «Ну да» (2026-04-11, id 457626–457627); дальше материал по Иссекаю в архиве не продолжается.</li>\n<li><strong>Все 31 сущность состава известны в карточке вселенной только по названию, дате и числу версий.</strong> Как «Ледяной мир», «Рогалик и бесконечный данж», «Петля возрождения ГГ», «Дариус Баллив», «Таинственный торговец» связаны с «Любимым городом» и между собой — в файле вселенной не сказано.</li>\n</ol></div>", "r": [["Игры на codepen", "kb/SL-0141-igry-na-codepen.html"], ["Бен", "PS-0354.html"], ["Перерождённые герои (иссекай-типаж)", "PS-0020.html"], ["Система прокачки в бесконечном данже", "SP-0262.html"], ["Согревание застывшего мира", "SP-0260.html"], ["Любимый город", "IS-0086.html"], ["Как же тебе жарко Бэн", "PR-0124.html"]]}, {"t": "Связи — всё вместе", "a": ["VS-0005--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0020.html\">Перерождённые герои (иссекай-типаж)</a>, <a href=\"PS-0351.html\">Рассказчик «Любимого города»</a>, <a href=\"PS-0352.html\">Жених</a>, <a href=\"PS-0354.html\">Бен</a>, <a href=\"PS-0356.html\">Дариус Баллив</a>, <a href=\"PS-0357.html\">Таинственный торговец</a>, <a href=\"PS-0358.html\">Другие исследователи</a></li>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0260.html\">Согревание застывшего мира</a>, <a href=\"SP-0261.html\">Петля возрождения ГГ</a>, <a href=\"SP-0262.html\">Система прокачки в бесконечном данже</a></li>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0190.html\">Ледяной мир</a></li>\n<li><strong>Упоминает монументы:</strong> <a href=\"MN-0027.html\">Пустой город</a>, <a href=\"MN-0028.html\">Плакучая ива</a></li>\n<li><strong>Упоминает истории:</strong> <a href=\"IS-0086.html\">Любимый город</a>, <a href=\"IS-0087.html\">история про ледяной ад</a>, <a href=\"IS-0088.html\">Цена жизни</a>, <a href=\"IS-0089.html\">Рогалик и бесконечный данж</a></li>\n<li><strong>Упоминает прозу:</strong> <a href=\"PR-0124.html\">Как же тебе жарко Бэн</a></li>\n<li><strong>Группы:</strong> <a href=\"GR-0084.html\">Отряд Дена (семеро в масках, сборщики)</a>, <a href=\"GR-0085.html\">Дворянская семья Баллив</a>, <a href=\"GR-0086.html\">Совет</a>, <a href=\"GR-0087.html\">Группа на крыше (шесть спящих и рассказчик)</a></li>\n<li><strong>Персонажи:</strong> <a href=\"PS-0351.html\">Рассказчик «Любимого города»</a>, <a href=\"PS-0352.html\">Жених</a>, <a href=\"PS-0353.html\">Ден</a>, <a href=\"PS-0354.html\">Бен</a>, <a href=\"PS-0355.html\">Крис</a>, <a href=\"PS-0356.html\">Дариус Баллив</a>, <a href=\"PS-0357.html\">Таинственный торговец</a>, <a href=\"PS-0358.html\">Другие исследователи</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["VS-0005--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/VS-0005.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["VS-0005-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/VS-0005/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Во вселенной 52 сущности, из них пять — с материалом в базе, но без статьи. Чинить их надо в этом порядке, по числу входящих:</p>\n<ul>\n<li><code>SL-0133</code> «Документ-систематизация концепций и миров» — 2 входящих, 4438 знаков базы, статьи нет. Самая дорогая позиция «Иссекая»: это единственная незакрытая сущность с более чем одной ссылкой, и именно на её дату (2026-02-13) опирается левая граница шапки вселенной — граница стоит на записи, статьи о которой не существует. Плюс это единственный мостик наружу: сущность числится сразу за «Иссекаем» и за «7 островами».</li>\n<li><code>SL-0132</code> «План истории про ледяной ад» — 1 входящая, 4938 знаков. Формально дешевле, фактически нет: из одного сообщения 433473 выросли четыре статьи разом — <code>MR-0190</code> «Ледяной мир», <code>MN-0028</code> «Плакучая ива», <code>SP-0260</code> «Согревание застывшего мира», <code>IS-0087</code> «история про ледяной ад». Запись-источник, на которой стоит весь этот куст, статьи не имеет.</li>\n<li><code>SL-0142</code> (6688), <code>ID-0166</code> (4401), <code>SL-0141</code> (4203) — по 1 входящей, дальше по остаточному принципу.</li>\n</ul>\n<p>Отдельно — не дыра, а сверка, и она дешевле всего перечисленного. Валюта в данже названа «ОЭм», и в статье это помечено как неясность. В базе есть <code>MR-0182</code> «Оэм» — 16 входящих ссылок и 40 101 знак базы, одна из самых нагруженных записей всего справочника (вселенные «7 островов» и «Оам»), и при ней <code>SL-0125</code> «Список нерешённых вопросов по миру Оэм» (3899 знаков, статьи нет). Одна проверка закрывает вопрос в обе стороны: либо у «Иссекая» появляется единственная связь с остальным архивом, либо в <code>SP-0262</code> встаёт твёрдая пометка о созвучии.</p>\n<h3>С чего начать</h3>\n<p>В базе, и по конкретным записям: <code>SL-0133</code> (4438) — там же должно быть видно, попал ли «Иссекай» в авторскую систематизацию миров как вселенная или как жанр, а это главный неразрешённый вопрос всей статьи. Следом <code>SL-0132</code> (4938) — сверить план 433473 с тем, что разнесено по четырём производным записям, и понять, что при разноске потерялось. Сверку ОЭм вести по <code>MR-0182</code> и <code>SL-0125</code>, ничего не сводя, пока не найдётся дословная реплика.</p>\n<p>В архив — за двумя вещами, обе с точными ориентирами. Первое: правая граница 2026-04-19 не подкреплена ничем. Последняя реплика по вселенной — 457627, «Ну да» в ответ на «пока-что всё?», 2026-04-11 утром. Смотреть надо отрезок 2026-04-11 — 2026-04-19 целиком: если реплики закрытия там нет, границу надо честно пометить как техническую, а не искать её дальше. Второе: расхождение шапки (2026-02-13 — 2026-04-11) и таблицы отрезков (2026-02-14 — 2026-04-19) — это две разные ошибки на двух концах, и левая проверяется быстро, по одной записи 432166–432177.</p>\n<p>Третье место, куда стоит заглянуть, но без ожиданий: 30 сущностей из 31 заведены в три дня — 2026-02-16, 2026-02-20 и 2026-04-11, — и ни одна дословная реплика за эти даты в файл вселенной не попала. Материал под скоплениями есть, он просто не поднят на уровень вселенной.</p>\n<h3>Как развивалось</h3>\n<p>Заявили возвратом, а не учреждением: 2026-02-14, 09:29, «Я снова вернулся к Иссекаю» — сразу после выкладки «Любимого города», через три минуты. Ограничили тут же и не намеренно: слово прозвучало один раз и больше в этом значении не повторялось. Через два дня — всплеск: 18 записей за 2026-02-16, ледяной план, «Цена жизни», разбор «Любимого города»; и в тот же день второе употребление слова, уже в другом смысле — «пиши иссекай» в ряду советов по письму рядом с «пиши истории короче». Дальше 2026-02-20 один текст, который соавтор так и не прочитал ни в тот день, ни через сутки, ни через два месяца. Потом пауза почти на семь недель. Вернулись 2026-04-11 — к куску, который с предыдущими не связан ничем, и провели по нему единственное настоящее совместное обсуждение за всю вселенную — одно утро, примерно 09:09–09:57; закрыли его репликами «пока-что всё?» — «Ну да».</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Вопрос о внешнем мире для двух кусков из трёх решён прямо. В данже — серией отказов: «он может в обычный мир попасть» — «Нет», «но обычный мир существует?» — «Нет», «Просто бесконечный данж. И всё». В ледяном мире — наоборот и так же прямо: обычный мир есть, там близкие, которые ждут, и герой в него возвращается, когда ива вырастет. Два взаимоисключающих устройства, оба названы вслух.</p>\n<p>Пустой город — соседний случай того же рода, и для него этот вопрос не задан ни разу. При том что зацепка в тексте лежит на поверхности: рассказчик помнит свой город и сравнивает с ним увиденное («в моём городе травы на улицах не найдёшь»), то есть какое-то «оттуда» у него есть. Есть ли обычный мир вокруг пустого города — не спрошено ни автором, ни соавтором, хотя ровно этот вопрос по двум другим кускам проговорён до конца.</p>\n<h3>Отклик</h3>\n<p>Больше всего зацепило «рай это другие» — брошенное посреди плана, между «ледяной ад» и «он ходит и разговаривает с застывшим миром», без всякой подводки, и мгновенно переворачивающее весь замысел: мир, где всё замерло, — не наказание, а отдых, потому что в нём никого нет. И следом рядом — механика согревания, где оттаявшая рука отрывается от замёрзшего тела; идея про тепло как насилие, изложенная в одну строчку и не развёрнутая никем. Второе — три «Нет» подряд про данж. Автор отрезает внешний мир, город, возвращение, и на вопрос, что же остаётся, отвечает «Просто бесконечный данж. И всё»; а замысел заранее объявлен незакончиваемым — «бесконечный рассказ, который я никогда не закончу». Это сказано не как оправдание, а как свойство вещи, и в этом виде оно работает. Статья при этом сама себе не подыгрывает: она честно пишет, что вселенная, возможно, вовсе не вселенная, а жанр, что правой границы никто не объявлял и что четыре куска между собой не связаны ни одной репликой. Читать такое неуютно и правильно.</p></div>", "r": []}];</script>
