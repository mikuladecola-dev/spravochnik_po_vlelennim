<script>const BASE="";const DOCNAME="Оборотни";
const LEAD="<p>Оборотни — раса из общего списка рас, определённая в короткой договорённости 2024-12-21 (id 272806–272815). Версия одна.</p>";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0090-S01", "MR-0090--ustroystvo"], "h": "<p>Оборотень — это «Человек + животное» (Слава, id 272813). Волк при этом не обязателен: на вопрос Миколая «волк &lt;=&gt; человек?» (id 272807) и его же замечание «ну обычно так» (id 272810) следует расширение — «но типа жираф человек», «чем не оборотень» (id 272811–272812). То есть вторая половина оборотня может быть любым животным, а не только волком.</p>\n<p>На этой формуле разговор и закрывается: «Ок», «Оборотень» (id 272814–272815).</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0090-S02", "MR-0090--naselenie"], "h": "<p>Раса оборотней. Отдельные особи, численность, места обитания в переписке не названы.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0090-S03", "MR-0090--mesto-vo-vselennoy"], "h": "<p>Часть списка рас (Расы). Других связей в записи не проставлено.</p>\n<p>Принадлежность к вселенной по записи стоит как «неясно» и определяется только по дате объявления (безымянная вселенная, объявленная 2024-12-21, id 272184).</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0090-S04", "MR-0090--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-12-21 (окно w0067, id 272806–272815).</strong> Оборотень определён как человек плюс животное, с прямым отказом от обязательного волка.</p>\n<p>Отклонённый вариант: оборотень как исключительно «волк &lt;=&gt; человек» (Миколай, id 272807) — отклонён им же в пользу произвольного животного.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0090-S05", "MR-0090--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Механика превращения — как, когда, по чьей воле происходит смена облика — не описана.</li>\n<li>Наследуется ли принадлежность к расе, передаётся ли она укусом или иначе — не сказано.</li>\n<li>Особенность расы по той же схеме, что у соседних рас («Вампир кровь / Эльф растения»), оборотням не назначена.</li>\n<li>Численность, места обитания, отдельные персонажи — не названы.</li>\n<li>Принадлежность к конкретной вселенной в переписке не проговорена, стоит по дате.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["MR-0090--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-12-21</td>\n<td>272806–272815</td>\n<td>w0067</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0090-oborotni.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0090--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0090.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
