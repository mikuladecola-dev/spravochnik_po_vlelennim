<script>const BASE="";const DOCNAME="Спартанец";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0082-S01", "PS-0082--proishozhdenie"], "h": "<p>Спартанец впервые упоминается в общем списке персонажей, который Слава выписывает по памяти (2024-05-25, id 173128): «Энергет, прятки, закон, петля, феникс, Тен, волк, дракон, ци, имитатор, спартанец, вампир, драгоценность, бессмерт, жук, лёд, Дилан, граница, солнце». Список записывался с оговоркой «Надо потихоньку записывать а то я по тихонько забываю» (id 173129). Миколай отдельно спросил, кто такие «Тен, волк, дракон, ци, спартанец» (id 173130–173131), и разбор по этому списку пошёл по порядку; до Спартанца очередь дошла вопросом Миколая «А спартанец?» (2024-05-25, id 173136).</p>\n<p>Никакой биографии, места рождения или прошлого в переписке не сказано — персонаж вводится сразу через роль (напарник имитатора) и через внешность.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0082-S02", "PS-0082--vneshnost"], "h": "<p>Единственное описание дано Славой одной фразой (2024-05-25, id 173137): «Он будет ходить полностью голый только в железных ботинках, трусах и в шлеме».</p>\n<p>То есть на нём три предмета: железные ботинки, трусы и шлем; всё остальное тело открыто. Материал трусов и шлема не назван — железными названы только ботинки. Ни возраст, ни телосложение, ни лицо не описаны, хотя телосложение косвенно затрагивается в обсуждении способности (см. ниже вариант с маленьким телом).</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0082-S03", "PS-0082--sposobnosti"], "h": "<p>Способность обсуждалась, но так и не была выбрана. Слава поставил вопрос прямо: «и вот какую дать способности спартанцу» (2024-05-25, id 173137), после чего добавил знак вопроса отдельным сообщением (id 173138), то есть ждал ответа.</p>\n<p>Миколай ответил, что «Есть 2 концепции известные» (id 173140), и назвал их:</p>\n<ul>\n<li>«Или как Мга мышцы увеличивать» (id 173142) — увеличение мышц по образцу «Моей геройской академии».</li>\n<li>«Или как в баки бесквит Оливер мышцы размером с остров прячет в маленьком теле» (id 173144) — то есть мышцы размером с остров, спрятанные в маленьком теле, по образцу Оливы из «Баки».</li>\n</ul>\n<p>Между этими двумя репликами стоит сообщение «1 даже в той вселенной выдумка» (id 173141). К чему именно оно относится и что именно названо выдумкой даже внутри вселенной — из переписки не следует; реплика осталась нерасшифрованной.</p>\n<p>Отдельно Миколай оценил обсуждаемое как рабочее направление и допустил смешение: «По идее норм концепция, можно дополнить или объединить с другой» (id 173146). То есть варианты не были противопоставлены как взаимоисключающие — допускалось их объединение. Какой вариант выбран в итоге, не сказано: ни один из двух не был ни принят, ни отклонён.</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0082-S04", "PS-0082--svyazi-s-drugimi"], "h": "<p>Имитатор — Спартанец назван его напарником: «спартанец напарник имитатор» (2024-05-25, id 173137). Тут же Слава даёт в скобках характеристику самого имитатора: «( имитатор один из сильнейших существ в той вселенной )». Характер напарничества (отряд, пара, служба, дружба) не уточняется — сказано только само слово «напарник».</p>\n<p>Кроме имитатора, Спартанец связан со списком персонажей Славы как элемент этого списка.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S05", "PS-0082-S05", "PS-0082--kak-menyalsya"], "h": "<p><strong>2024-05-25 (окно w0035, id 173135–173147)</strong> — единственное состояние. Персонаж появляется, получает роль напарника имитатора и описание внешности; способность выносится на обсуждение и остаётся открытой. Обсуждение обрывается: сразу после реплики Миколая о концепциях Слава переключается на следующий вопрос — «И кстати раз пошли суда то ещё вопрос» (id 173145) — и переходит к другому персонажу, командиру сильнейшего отряда, который «После развала команды построил приют для детей в отшибе от людей и жил там поживал» и «в теорий сильнейший» (id 173147). К Спартанцу разговор больше не возвращается.</p>\n<p>Других версий нет: в базе значится одна версия, диапазон дат 2024-05-25 — 2024-05-25.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0082-S06", "PS-0082--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Способность не выбрана. Предложены две концепции, ни одна не утверждена и ни одна не отклонена; допущено их объединение, но объединения никто не сделал.</li>\n<li>Реплика «1 даже в той вселенной выдумка» (id 173141) не разъяснена — к какой из концепций она относится, в переписке не сказано.</li>\n<li>Имя (собственное, помимо прозвища «Спартанец») не названо.</li>\n<li>Происхождение, возраст, биография не названы.</li>\n<li>Не сказано, почему он ходит почти голым — обосновывается ли это способностью, характером или чем-то ещё.</li>\n<li>Не сказано, из чего сделаны трусы и шлем; железными названы только ботинки.</li>\n<li>Не описано, в чём состоит напарничество с имитатором и как эта пара действует.</li>\n<li>Что с персонажем стало дальше по сюжету — в переписке не сказано, продолжения обсуждения нет.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0082--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0091.html\">Имитатор и Спартанец (напарники)</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0091.html\">Имитатор и Спартанец (напарники)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0082--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-05-25</td>\n<td>173135–173147</td>\n<td>w0035</td>\n<td>Цветной мир (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0082-spartanec.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0082--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0082.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
