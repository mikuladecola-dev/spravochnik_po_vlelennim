<script>const BASE="";const DOCNAME="Чёрное озеро";
const LEAD="";
const CH=[{"t": "Об этом тексте", "a": ["S01", "PR-0107-S01", "PR-0107--ob-etom-tekste"], "h": "<ul>\n<li>Дата: 2026-02-08</li>\n<li>Сообщения: 430010–430013</li>\n<li>Состояние: брошено на середине — текст обрывается на реплике мужчины про водяных, продолжения нет</li>\n<li>Действующие лица: Сергей (рассказчик), Мишка (Миша), Васька, старый охотник с двустволкой, внук Любки, Володя, незнакомый мужчина в лесу, чудовище</li>\n</ul>", "r": []}, {"t": "Текст", "a": ["S02", "PR-0107-S02", "PR-0107--tekst"], "h": "<p>Чёрное озеро</p>\n<p>Знаете после работы под летним жарким солнцем. Мне нужно просто отдохнуть. Окунуться в холодную воду, чтобы холод колол мою кожу, заставил горячую голову шуметь. Чтобы наконец-то прийти в себя и воскреснуть. </p>\n<p>Но нет. Мне приходится тащится с потными мужиками в дремучей лес. В руках держа увесистый топорик. Остальные же мужики, тоже не с пустыми руками пришли. Вилы, топоры, фонарики и лишь у местного охотника двустволка. </p>\n<p>Картина того как мужики с вилами топорами идут в лес скажем честно и смешная и страшная. Что вообще здесь происходит? Наверника задастся вопросом любой человек. </p>\n<p>Скажу коротко, что-то произошло. Я сам не до конца понял ситуацию. Поэтому ускорив шаг. Подхожу к Мишке, к близкому приятелю в этой деревне. </p>\n<p>-эй Мишка- говорю неосознанно тихо. <br>-а Сергей ты чтоль? - оборачиваясь произносит Миша. <br>- Да-да, кто еще- говорю ему, а оборачиваюсь. Проверя чтобы нас никто не подслушал<br>- а что вообще происходит ? - задавал вопрос наконец-то я. <br>- а ты не знаешь что-ли? - искренне удивляется Мишка. Я же ещё в большем смятение<br>-всмысле о чем?! - <br>-не знаешь получается- вздыхает Мишка. <br>- слушай у тебя дома свет есть? - спрашивает Мишка. Я же качаю головой. Электричество как уже с двух часов дня нету, а сейчас уже закат летом. <br>-а связь ловит? - продолжил задавать вопрос Мишка. Снова покачав головой, я всё же не выдержувыюсь и говорю. <br>-Мишка, че за вопросы. Просто скажи, что происходит и всё- <br>-да блять. Хрен знает, что происходит- говорит Мишка потирай подбородок<br>- слушай у всей деревни свет нету и связь не ловит. Мужики у кого есть машина, в город поехали узнать почему электричество выключили. Так до сих пор не приехали- произносит Миша глотая слюну в засохшем горле. <br>- а ещё и на внука Любки, Кто-то напал и руку полоснул. Да кровищей там было. Володя, что руку бинтовал говорил, что нервы задела и пацан больше не сможет, как прежде рукой махать- сказал Миша. А я задумался, как так-то. На кого-то напали, а я только сейчас узнаю. <br>-кто напал то, а Мишка? - задаю вопрос<br>-в том то и дело, что не знаю, кто напал. Знают только, что в лес убежал- <br>-пацан то этот говорит, что чудовищя какой. Ну ему конечно некто не поверил. В шоке пацан просто. Ну всё же, кто его так полоснул- Закончил Миша ускорив шаг. </p>\n<p>Да уж получается я мог не идти. Думаю, чтобы преступника поймать этой толпы хватит вполне себе, а я мог остаться и чай попить, у меня же там ещё и сладости завалялись, и бутерброд можно было бы сделать добавив больше колбасы.... Сука есть охота. </p>\n<p>Нет ну почему мне изначально ничего не обьснили. Хотя может и объясняли, а я просто не услышал. Устал же я всё же, пока весь день работал. И они просто толпой мимо моего забора прошли и начали созывать и выкрикивать дружной толпой разные слова, что хрень пойми, о чем они. Ну и я дурак подался коллективному помешательству и пошёл за ними. </p>\n<p>Сейчас уже поварачивать назад по-дурацки будет. </p>\n<p>.......... </p>\n<p>Не знаю сколько шли мы еще. Но комары успели знатно меня покусать. Всю шею искусали и как будто даже волосы. Ещё и темно стало и я так как недавно здесь обоснавался не привык к лесу этому. И раза четыре спотыкался и мордой в землю падаю. Ещё эти блять ветки, который впереди идущий натягивают и отпускають прям мне в лицо. После этого с рублю этот лес нахрен. </p>\n<p>Неприятный лес скажю честно. Густой, что даже яркий звезды  закрывает. А в деревне звезды горят в разы ярчее, чем в городах. Да и тихо как-то. Кроме монотононого дыхание толпы и шагов. Ничего другого не слышно. Лишь изредка слышна, как птицы взлетают с веток испугавшись толпы двуногих. Да уж отношения с лесом у меня точно будут плохими. </p>\n<p>А мужиком хотьбы хны. Идут деловита обступая корни деревьев. Возможно будь я единственным таким неуклюжим моя бы самооценка упала бы. Но благо я такой не один. Васька, как видимо успевший притронуться к рюмке. Вечно спотыкался и кряхтел. Да и Мишка чё-то нервный. трясется и оглядывается на любой шолох. Да и если приглядеться всё здесь не так уверенно идут, как мне показалось изначально. Устали видимо, как и я.</p>\n<p>-эй народ! - остановившись прикрикнул запыхавшийся мужик. Имени я его не знаю. Не со всеми успел познакомиться. </p>\n<p>Когда всё остановились и посмотрели на мужика. Он продолжил <br>- мы что так и будем здесь всю ночь бродите?- <br>- ну и что предлагаешью- спросил старик с ружьём. <br>-  да обратно идти, что здесь предлагать. Устали уже все. Да и если дальше идти по ночи то и заблудиться можно. Потом хрен от чуда выйдем- сказал мужик. И толпа быстро начало соглашаться. <br>- да и если бы. Был кто-то уже нашли. <br>-убежал это уже наверное далековато. Так что да лучше домой идти. <br>- хорошая идея. Мне ещё свиней кормить надо<br>- а точно правильно так отступать. <br>Были конечно те кто хотел продолжить. Ну их было меньшество. Да и они тоже устали и начали согласиться, что всё закругляться надо. </p>\n<p>Я же лишь внутренний ликовала. Пока толпа ещё гудела. Я уже развернулся в обратную сторону, чтобы просто осмотреться. Увидел же я лишь темноту и редко различимый ветки. Как ни странно преставля путь назад ноги загудели. Не куда уже не хотелось идти. Можно просто лечь здесь и поспать. </p>\n<p>Хрусть... </p>\n<p>Громкий и отчётливый звук чего-то хрустнощего, который просто бробирает до костей заставля иснтиктивно по ежится. Я же рефлекторно начал смотреть туда же куда смотреть вглядываясь.  Пока не услышал чавкающий звук сзади. </p>\n<p>Повернувшись мужикам я лицезрел картину. Лучи фонаря отчётливо дали увидеть этого. Массивного лохматого зверя стоящий на двух ногах. Нет... Ну он... Как бы.. Я не знаю</p>\n<p>Кароче это было существо под два метра ростом и также в ширене. Покрытой черной шерстью. Он был без шее. То есть голова и сразу плечи. Глаза его горели оранжоаым огнем. А в своей массивной руке он держал раздавленную голову. И блять всё эти звуки хруста и чавканье от раздавленный головы. </p>\n<p>Всё замерло, как будто даже время остановилась в этот блядский миг. Все мужики, который до этого рвались наказать преступника замерли и единственное, что могли это держать лучь фонаря на чудище. Боясь потерять его из виду. Я же замер с толпой и даже моёй дыхания остановилась, я боялся хоть малейшим писком оборвать такой хрупкий мир. </p>\n<p>Первым разрушил этот хрупкий и блаженный момент был не пьяный Васька. Не дрожащий словно осиновый листь Мишка. Ни даже чудовища, что изучала нас своими глазами бусинками. Это был старый охотник, что перекинув ружьё стрельно прямо в морду чудовищу. А дальше начался хаос. </p>\n<p>Чудовище взревело, давай понять , что даже прямой выстрел голову ему нипочём. И именно его крик стал для нас сигналом. И мы побежали, кто куда без разницы. Мы бежали сбросив фонарики, топоры и вилы. </p>\n<p> Я бежал следом за какой то группой мужиков. Но сука я отставал, потому что спотыкался на эти корни. Я падал и сразу вставал и бежал. Шагов чудовища не было слышно, но это ни капельки не радовало. Ведь он также тиха пробрался к нам не издав не звука. Мне было в разы легче когда я его видел и мог хоть как-то понимать, что он будет делать, а сейчас нихрена не ясна. </p>\n<p>Спины мужиков всё отдаляються, а в этой густой тьме леса. Я сам вряд ли выбирусь. Можно было бы крикнуть &quot; Эй мужики суки меня подождите&quot; Но сука страшная. Страшная выдать себя, а ещё в горле мерзкая липкая субстанция, что не даёт издать звуков. </p>\n<p>Бежать бежать бежать. Нет, надо что-то делать если продолжу бежать просто вы бьюсь из сил и заплутаю. Спину мужиков не видать. И звуки бужавших позади тоже не слыхать. Сука. Сука почему я? </p>\n<p>Что делать? Что делать? Можетъ на дерева залесть. Нет он его лёгким движением повалит. Что мне сделать? </p>\n<p>Перебирая множества вариантов спасения. Я не почувствовал опоры в ноге и нырнув левой ногой кудато. Я по инерции двинулся вперёд услышав сука знакомый звук.... Хруст.. </p>\n<p>Сукаа. Больно больно. Настолько больно, что крик просто не может сорваться. В глазах образовались слезы. А ногу жгло и болела. Я не мог собраться, не мог вынуть ногу из этой ямы. Не мог хотя бы восстановить дыхания. </p>\n<p>Где-то я гнида слышал, что боль помогает прийти в себя. Ну блять идти те суда давайте это обсудим. Насколько же боль может привести в себя.</p>\n<p>Кое-как собравшись глубоко дыша и проклинай весь это недоотряд героем мать его. Я закусив губу достаю ногу. Она же бессильно висит словно культяпка. Ну крове вроде нет. Хотя я хрень знает, не видна не зги. </p>\n<p>Я услышал топот. Чей-то блять громкий топот. Я начал пользти в сторону топота. Взяв ещё по пути плотную ветку. </p>\n<p>Блять кто бы ты не был сука помоги. </p>\n<p>Спасибо. Мои молитвы услышали бежавший споткнулся и громко стукнулся от дерева. Стона он начал потирать голову. Я же взяв в руки в ноги поползь изо всех сил. И блять нет, не услышали меня боги. Этот бежавший был пьяный, старый Васька, у которого вроде как не всё дома в голове. </p>\n<p>Васька услышав шелест травы вызванный моим тасканий своей туши обернулся. Его глаза до этого и так большие, стали ещё больше и чуть не выпали из орбиты. </p>\n<p>Он подпрыгнул с места и подбежал ко мне. Схватил меня за руку и бесцеремонно начал тащить за собой. Из-за резкого рывка моя нога до этого находившийся в состоянии покоя извернулась И сотряслась на ветках. Вызывая горячую боль, что волнами разливалась по всему телу. Но это боль была уровня ниже до этого из-за этого крикнул<br>- СУКА Стой! - не ожидавший от самого себя крика. Я прикрыл рот рукой. Но блять поздно, всё спалили нас 100 процента. Васька же замер явно не понимая, что же делать. Оглядевшись он всё же принимает какой решений, которым не спешил делиться со мной. А лишь крепче схватил мою руку и начал тащить. </p>\n<p>Я закусил свооболную руку боясь вновь крикнуть. Крепко я вцепился зубами в кисть, что через мгновения в рот полелась горячая жидкость. Но я этого не заметил продолжая кусать себя. </p>\n<p>Наконец-то Васька остановился у какой то ямки. И не долго думая скинул меня туда. Не ожидавший это, не выдержал и крикнул. </p>\n<p>Васька же не обратив на этой внимание начал забрасывать меня землёй, травой и ветками. Закидав меня он встал отряхнулся, посмотрел на меня и кивнув побежал куда-то. </p>\n<p>И что мне делать? Лежать не двигаться. Легко сказать, а на деле лёжа в неудобной позе. Плюсом до этого незамечаемый холод начал просачиваться через одежду, ну и конечно боль, которая конечно ослабла но не куда неизчезла. </p>\n<p>Конечно всё это люто исчезает перед страхом того, что тебя найдёт Это. Ну секунда за секундой, минутой за минутой. Ничего не происходила и разум уже уставший от выброса эмоции начал успокаиваться. </p>\n<p>И так лёжа уже продолжительное время. Ты успокаиваешь и начинаешь думать. <br>&quot;Это вообще рельно? &quot;<br>&quot;Чудовище в лесу&quot;<br>&quot;Хруст и чавканье&quot;<br>&quot;Может.. &quot;<br>&quot;Если предположить&quot;<br>&quot;Я что сошёл с ума&quot;<br>&quot;Или это плата за грехи&quot;<br>&quot;Но я же не виновен? &quot;<br>&quot;Я не хотел &quot;<br>&quot;И что дальше&quot;<br>&quot;Как я со сломанной ногой дойду до деревни? &quot;<br>Тысячи мысли, от мала до велика. Начали заполнять голову. </p>\n<p>Когда приходит успокоения. Адреналин отступает и да этого отставший от меня &quot;усталость&quot;. С разбегу врезается в моём остывший тела и лишь глубже погружает голову в мысли, чтобы самому не заметить, как сон подкрался и уже давно тебя увёл </p>\n<p>........... </p>\n<p>Какой прекрасное утро. Птицы поют, а солнце освещает даже этот густой лес. Тёплый лучи солнце согревают и лечат всю усталость. И жёлтая жидкость...... Чего? <br>-Какого хрена!!!- выкрикиваю я, поднимая верхную часть тела. </p>\n<p>Мужчина до этого испражнявшися  на меня, от удивления отскачил и начал застёгивать штаны. </p>\n<p>-прости, прости не заметил- начал он говорить. Обезоружена подняв руки. </p>\n<p>Скидывая с лица прилипшую землю и листья. Я мелком рассматриваю мужчину. </p>\n<p>Это был высокий и подтянутый мужчина в делай рубашке и в чёрных джинсах. Явно не с деревни. Я конечно не всех там знаю, но такого там явно не было. </p>\n<p>Забыв обо всем, что происходило вчера я попытался встать. И конечно же нога не исцелилась, каким то образом за ночь. И боль прошибло мою макушку. Из-за чего я упал и схватившись за ногу начал даже не орать, а стонать. </p>\n<p>Мужчина увидевший это. Огляделся и после отойдя подальше подхватил пару крепких веток. </p>\n<p>- эй! Не знаю, что произошло но тебе лучше шину сделать. Нога у тебя кажись сломанная- сказал он медленно начал подходит, словно боясь спугнуть. </p>\n<p>Я же схватил ветку и начал махать вокруг себя. С мыслью &quot;может это чудовищя&quot;</p>\n<p>-полегче, полегче ты чего ?- спросил явно с удивлением мужчина. </p>\n<p>-отвечай кто ты. Ты же не из местных, а значит замаскировался сука!-</p>\n<p>Мужчина удивлены наклонил в голову права. Словно спрашивая &quot;о чем ты? &quot; А после его глаза расширяются словно он что-то вспомнил. </p>\n<p>И лес до этого поглативший только крики отчаяния и рёв монстра, погладил смех. На удивление искренне смех. </p>\n<p>Мужчина чуть-ли не падал согнувшись от смеха. </p>\n<p>- прости! Прости! - говорил он выставив руку вперёд. </p>\n<p>Наконец-то успокоившись он начал протирать слезинки возникший от смеха. Я же был просто а шоке. Какого хрена ты смеешься. Что здесь вообще происходит? </p>\n<p>- ты меня с водеными перепутал кажись?</p>", "r": []}, {"t": "Связи — всё вместе", "a": ["PR-0107--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0035.html\">Водяные</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["PR-0107--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PR-0107.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
