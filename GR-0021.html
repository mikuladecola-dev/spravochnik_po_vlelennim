<script>const BASE="";const DOCNAME="Упыри";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0021-S01", "GR-0021--chto-eto"], "h": "<p>Упыри — не группа в смысле отряда или организации, а вид (раса-сообщество): те, кто появился среди выживших после катастрофы. Поимённого состава у них нет, и в переписке они нигде не действуют как объединение — только как категория существ, к которой принадлежат отдельные персонажи. Разведка отнесла их к группам, но по материалу это ближе к статье определителя, чем к статье об отряде.</p>\n<p>Введены Славой одним большим монологом от первого лица (2025-03-19, id 305854–305855). Внутри истории рассказ ведёт житель технологически развитого мира, переживший раскол солнца, и упыри описываются как часть последствий этой катастрофы:</p>\n<p>«После катастрофы. Среди выживших начали появляется упыри. Это где-то 30-40 процентов выживших стали упырями. Кто такие упыри? Это не люди, которых тяжело убить.»</p>\n<p>Доля названа прямо: 30-40 процентов выживших. Для сравнения, в том же монологе сказано, что после раскола солнца в живых осталось 17% людей — но переход от одного процента к другому в переписке не проговорён, соотношение этих чисел не обсуждалось.</p>\n<p>Происхождение оставлено открытым самим автором, двумя вариантами без выбора между ними:</p>\n<p>«От чего вообще взялись упыри. Это заража из рая. Или это попытка правителя спасти людей. Не знаю.»</p>\n<p>Ни один из двух вариантов дальше не подтверждается и не отбрасывается.</p>\n<p>Название вида объясняется через минусы, а не через живучесть: «Но я же не просто так назвал их упырями. У них был один явный минус. Каннибализм.»</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0021-S02", "GR-0021--sostav"], "h": "<ul>\n<li><a href=\"PS-0232.html\">Упырь-рассказчик</a> — Упырь-рассказчик (вариант имени «чужемирец»), единственный названный поимённо представитель вида. Ведёт рассказ от первого лица и сам объявляет о своей принадлежности: «Но вы наверное уже поняли. Я упырь.»</li>\n</ul>\n<p>Больше никто из упырей по имени не назван. Остальные фигурируют только массой: «30-40 процентов выживших», «кому-то удавалось вернуть своей „Я“», «а кому-то даже продержатся 3 года».</p>\n<p>Отдельно стоит рассказчик из более раннего фрагмента (2025-02-24, id 293229), у которого записана способность «Бессмертие рассказчика» (<a href=\"SP-0185.html\">Бессмертие рассказчика</a>). Он не назван упырём как принадлежащий виду — он в упыря превращается: «И снова шел и забывал кем я был и забывал язык и забывал я даже мыслить и становился упырем я». Прямой связи между этим фрагментом и видом из монолога 2025-03-19 в переписке не проведено.</p>", "r": [["Упырь-рассказчик", "PS-0232.html"], ["Бессмертие рассказчика", "SP-0185.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0021-S03", "GR-0021--obschie-sposobnosti-gruppy"], "h": "<p><strong>Живучесть (<a href=\"SP-0207.html\">Живучесть упыря</a>).</strong> Единственная сила упыря, сформулированная перечислением того, что его не убивает (2025-03-19, id 305855):</p>\n<p>«Ты можешь скинуть его с небоскреба. Но он выживет. Ты можешь подорвать его или жечь. Он выживет. Ты можешь продырявить ему черепушки, что аж мозги будут видно. Но он выживет. Ты можешь выпотрошить или утопить его. Но он выживет. И так я могу перечислять до бесконечности.»</p>\n<p>Список автор сам объявляет незакрытым. При этом живучесть строго отделена от других сверхспособностей:</p>\n<p>«Но при этом он. Упырь не владеет, какой-то сверхчеловеческой силой или скоростью. Он просто живучий и всё.»</p>\n<p>Механизм живучести (регенерация, отсутствие болевой чувствительности, что-то ещё) в переписке не назван. Известно только, что боль упырь чувствует: рассказчик описывает надевание экзоскелета как четырнадцать дней пытки — но от боли не умирает.</p>\n<p><strong>Голод (<a href=\"SP-0208.html\">Голод упыря</a>).</strong> Первый из двух минусов, названный автором «каннибализм»:</p>\n<p>«У них невероятный голод. Подобно... Не знаю с кем подобно. Это просто был голод, который не как не удовлетворить, что бы они не ели. Но если они съедят человечину. Этот бесконечный голод утихнет. И они смогут стать счастливы.»</p>\n<p>Сравнение автор начал и не закончил — «не знаю с кем подобно». Отдельно оговорено, что голод сам по себе не был бы приговором, потому что источник пищи есть: «Будь-то он один. То можно было жить. Ведь пераги это люди. Их можно есть. Жувать. Глотать.»</p>\n<p><strong>Потеря «я» (<a href=\"SP-0209.html\">Потеря «я»</a>).</strong> Второй минус, названный неизбежным:</p>\n<p>«Второй минус. В том что мы теряли своей собственной „я“. Деградируя. Нет кому-то удавалось вернуть своей „Я“. А кому-то даже продержатся 3 года. Но по итогу всегда всё заканчивалась тем, что они теряли снова или первый раз. Без разницы. Они всë равно теряли своей „я“.»</p>\n<p>То есть возврат себя и удержание себя возможны, но временны; исход один для всех. Единственное названное средство удержания — цель, и оно тоже не спасает навсегда (см. ниже).</p>", "r": [["Живучесть упыря", "SP-0207.html"], ["Голод упыря", "SP-0208.html"], ["Потеря «я»", "SP-0209.html"]]}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0021-S04", "GR-0021--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p>Единственное различие внутри вида, названное в переписке, — сохранность «я» и срок этой сохранности. Оно же единственное, по которому упыри вообще как-то разделены:</p>\n<ul>\n<li>те, кто теряет «я» сразу («первый раз»);</li>\n<li>те, кому «удавалось вернуть своей „Я“»;</li>\n<li>те, кому удавалось «продержатся 3 года»;</li>\n<li>рассказчик (<a href=\"PS-0232.html\">Упырь-рассказчик</a>), не терявший «я» вовсе на протяжении шести лет.</li>\n</ul>\n<p>Причина его исключительности названа прямо и не сводится к силе: «Но нет. Я не терял своей „Я“. Почему же? Потому-что у меня была цель. Я должен был защитить тех 38 людей. Они нуждались во мне. Поэтому я не мог дать слабины.»</p>\n<p>Цель как удерживающий механизм названа «нитью»: когда подопечные погибают, рассказчик говорит «Я потерял свою нить. Держащий меня. Теперь и еë нету. Я перестану быть собой. Я лишь упырь.» Из этого следует, что защита от деградации у него была внешняя, а не врождённая — и снялась вместе с поводом.</p>\n<p>Второе отличие — не свойство вида, а снаряжение. Экзоскелет (<a href=\"SP-0210.html\">Экзоскелет</a>) собрали шесть учёных «из всех имеющих ресурсов», и надеть его может только упырь: «чтобы его одеть. Нужно было отрезать несколько конечности. Вырвать органы и продырявить череп. Обычный человек его никогда в жизни не сможет одеть. Ну я мог.» Рассказчик отказался от обезболивающего («Я же всё равно не умру от боли. Оставьте лучше для людей») и терпел четырнадцать дней. Результат: «И стал сильнее, быстрее. Теперь я стал живым оружием.» Таким образом сверхсила и сверхскорость, которых у вида нет, добираются техникой, а не природой. Носили ли экзоскелет другие упыри, в переписке не сказано — назван один случай.</p>\n<p>Отдельно фиксируется, как выглядит упырь, потерявший «я», в бою (2025-03-19, id 305856–305857). После перехода в другой мир он атакует всех подряд, «считая его врагом», действует «подобное зверью», а его удары описаны как «ясных. Но всё ещё сильных и быстрых» — то есть без сохранённого «я» упырь дерётся, но не различает. Удары по нему не работают: удар в бок «не проходит», усиленный удар по челюсти даёт кровь — «Он не пошатнулся или даже не закрыл глаза», удар в открытую рану на спине не вызывает даже крика. Разрушить его удалось только взрывом изнутри — имитацией чужой способности. Отдельно отмечено, что после длительного избиения удары самого упыря «стали слабее. Но всё также опасным», то есть изнашивается он всё-таки заметно.</p>", "r": [["Упырь-рассказчик", "PS-0232.html"], ["Экзоскелет", "SP-0210.html"]]}, {"t": "Отношения с другими группами", "a": ["S05", "GR-0021-S05", "GR-0021--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>Пераги.</strong> Двойное отношение, названное прямо. С одной стороны, пераги — враги: «Монстры у которых главная цель убить всё разумной на планете Земля. Падший ангелы», соотношение «23 заражённых на одного человека». С другой — еда, и именно потому, что они остаются людьми: «Ведь пераги это люди. Их можно есть. Жувать. Глотать.» Рассказчик после экзоскелета описывает себя как «Я уничтожал перагов».</p>\n<p><strong>Рай.</strong> Один из двух вариантов происхождения упырей — «заража из рая». Рай в том же монологе назван вторым миром, появившимся после Кильки, и источником нападений на миры («Что все нападения на миры. Были устроены из Рая»), но эта версия помечена самим текстом как недоказанная: «Хотя это опять же не точно. Лишь теория. Без стопроцентных фактов.» Связь Рая с упырями через перагов и ангелов в переписке не выведена — названы только два варианта происхождения.</p>\n<p><strong>Правитель.</strong> Второй вариант происхождения — «попытка правителя спасти людей». Правитель того же мира отдельно упомянут как возможная причина того, что кто-то вообще выжил при расколе солнца («Возможно наш правитель подсобил»), и как тот, кто тянул рассказчика в чёрную дымку: «Это правитель пытается меня спасти. Отправив в другой мир». Прямо сказано, что это мысль самого рассказчика, а не установленный факт.</p>\n<p><strong>Апостолы (защитник, имитатор).</strong> Единственный записанный контакт упыря с апостолами — бой сразу после перехода в другой мир (2025-03-19, id 305856–305858). Апостолы ждали одного чужемирца, из чёрной дымки вылетели двое — упырь и ангел. Упырь дерётся с обоими апостолами и с ангелом одновременно, никого не различая. Заканчивается тем, что имитатор имитирует благословение защитника и подрывает упыря изнутри: «И вдруг грудь упырья. Начала надуваться мелкими и большими оранжевыми пузырьками. И БАМ. Упырь взрывается.» Это единственный записанный случай гибели упыря. Отношений между упырями как видом и апостолами как группой в переписке нет — есть один бой одного упыря.</p>\n<p><strong>Ангел.</strong> Существо, из-за которого рассказчик потерял «нить»: «Гуманоид, состоящий только из белых перьев. Он был вытянутым. По два метра ростом. У него было две пары рук и две пары крыльев. И вертикальный глаз один.» Противопоставление ангела и упыря сформулировано самим рассказчиком: «Я уродливый и страшный. Отражения этого тёмного и страшного мира. Защищаю и стараюсь спасти людей. А ангел. Белый и чистый. Лишь убивает.»</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S06", "GR-0021-S06", "GR-0021--kak-menyalas"], "h": "<p><strong>2025-02-24 (id 293229).</strong> Слово «упырь» появляется раньше вида — в рассказе про Перагов, как итог деградации отдельного человека, а не как категория выживших. Там упырь — конечная точка распада: «забывал кем я был и забывал язык и забывал я даже мыслить и становился упырем я», и он же «упырем безмозглым, жрущий Перагов». В том фрагменте бессмертие приходит после поедания плоти Перага, но прямой связи «съел — стал бессмертным» текст не утверждает — она держится только на порядке событий. Связка этого раннего употребления с видом упырей из монолога 19 марта в переписке не сделана.</p>\n<p><strong>2025-03-19 (id 305854–305855).</strong> Упыри вводятся как вид: доля среди выживших (30-40%), живучесть, прямое отрицание сверхсилы и сверхскорости, два минуса — голод и потеря «я», происхождение оставлено двумя вариантами без выбора.</p>\n<p><strong>2025-03-19 (id 305855–305856).</strong> К виду добавляется экзоскелет — не свойство вида, а то, что доступно только упырю из-за его живучести.</p>\n<p><strong>2025-03-19 (id 305856–305858).</strong> Упырь без «я» показан в действии и погибает от взрыва изнутри. До этого способ убить упыря не назывался вообще; здесь показан один сработавший.</p>\n<p><strong>2025-03-20 (id 306134–306147).</strong> Обсуждение при чтении. Миколай: «круто быть упырём», затем «подобно Гулям из токийского гуля» — то есть вид опознан через сравнение с гулями из «Токийского гуля». Миколай спрашивает «ты тоже упырь?», Слава отвечает «А я разве терял» — то есть отвечает изнутри роли рассказчика. Миколай отдельно замечает сбивку повествования: «но ты говоришь мы». На экзоскелет реакция: «че за нахуй», Слава объясняет «У них же более развитый мир», Миколай — «что они могут позволить себя насиловать чтобы надеть экзоскелет. ну эт прикольно».</p>\n<p>Отклонённых вариантов устройства вида в переписке нет — ни один вариант не предлагался и не забраковывался. Оба варианта происхождения оставлены сосуществующими.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "GR-0021-S07", "GR-0021--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет. Назван один упырь из вида — <a href=\"PS-0232.html\">Упырь-рассказчик</a>, и он же рассказчик; остальные существуют только как проценты и как безличные «кому-то».</li>\n<li>Иерархии нет. Ни вождя, ни старших, ни деления на своих и чужих внутри вида в переписке не упоминается; о том, взаимодействуют ли упыри между собой вообще, не сказано ничего.</li>\n<li>Происхождение осталось нерешённым: «Это заража из рая. Или это попытка правителя спасти людей. Не знаю.» Выбор между вариантами не сделан.</li>\n<li>Механизм живучести не назван. Сказано, что убить нельзя, но не сказано, за счёт чего — регенерации, отсутствия нужных органов или чего-то ещё.</li>\n<li>Как человек становится упырём — не сказано. Известно только, что это происходило «после катастрофы» и «среди выживших», без описания процесса, заражения или отбора.</li>\n<li>Не сказано, чем определяется, кто из выживших станет упырём, а кто нет.</li>\n<li>Что происходит с упырём после потери «я» дальше — не описано, кроме поведения в бою. Умирает ли он, живёт ли неопределённо долго, остаётся ли способным на что-то — не сказано.</li>\n<li>Срок в три года и шестилетний срок рассказчика не сведены: неясно, три года — это типичный предел или один упомянутый случай.</li>\n<li>Есть ли способы убить упыря, кроме показанного взрыва изнутри, не обсуждалось.</li>\n<li>Связь между «упырём» из фрагмента 2025-02-24 (id 293229) и видом упырей из 2025-03-19 в переписке не установлена — совпадает только слово.</li>\n<li>Отношения упырей с обычными выжившими людьми (кроме подопечных рассказчика) не описаны: как люди относятся к упырям, живущим рядом, при том что упыри питаются человечиной, в переписке не сказано.</li>\n</ul></div>", "r": [["Упырь-рассказчик", "PS-0232.html"]]}, {"t": "Связи — всё вместе", "a": ["GR-0021--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0232.html\">Упырь-рассказчик</a></li>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0185.html\">Бессмертие рассказчика</a>, <a href=\"SP-0207.html\">Живучесть упыря</a>, <a href=\"SP-0208.html\">Голод упыря</a>, <a href=\"SP-0209.html\">Потеря «я»</a>, <a href=\"SP-0210.html\">Экзоскелет</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0021--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0021.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0021-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0021/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дороже всего не происхождение упырей, а несведённость двух половин слова. «Упырь» февраля (2025-02-24, id 293229) — конечная точка распада одного человека; «упырь» марта (2025-03-19) — вид, 30-40 процентов выживших. Связки между ними в переписке нет, и в базе она тоже не сделана: февральская половина лежит в <code>SP-0185</code> (9 064 знака базы) и <code>PS-0200</code> (24 602), мартовская — в <code>PS-0231</code> (17 407) и <code>PS-0232</code> (35 190). На <code>PS-0200</code> и <code>PS-0231</code> сейчас не ссылается ни одна статья, кроме статьи о вселенной. Пока не решено, одна это сущность или две, половина ссылок в узле ведёт неизвестно куда: <code>SP-0185</code> привязана к группе упырей, хотя описывает бессмертие рассказчика из истории про Перагов.</p>\n<p>Дальше по цене — происхождение. Тут дыра не в материале: обе версии («заража из рая» и «попытка правителя») упираются в записи с большой базой — <code>MR-0095</code> (54 131), <code>MR-0120</code> (35 010), <code>PS-0279</code> (23 121), <code>PS-0217</code> (14 203). Развилка произнесена один раз и никогда не возвращалась; выбирать между вариантами не обязательно, но проверить, попадает ли она в эти четыре записи, стоит раньше, чем описывать механизм живучести.</p>\n<h3>С чего начать</h3>\n<p>В базе, не в архиве. Сравнить <code>PS-0200</code> и <code>SP-0185</code> с <code>PS-0231</code> и <code>PS-0232</code> по одному признаку: приходит ли бессмертие февральского рассказчика после поедания плоти Перага или помимо него. В самом фрагменте связь держится только на порядке событий, а в мартовском монологе живучесть — врождённое свойство вида, к еде не привязанное. Это проверяемое расхождение, и решать его надо на имеющемся материале.</p>\n<p>В архив — только за происхождением: развилка сказана 2025-03-19, id 305854, окно w0083. Смотреть надо не февраль, а более поздние окна, где Рай обсуждается сам по себе, — начиная с w0094 (май). Если версия «заража из рая» где-то подтверждалась или отбрасывалась, это будет там, а не рядом с монологом.</p>\n<h3>Как развивалось</h3>\n<p>2025-02-24 — слово появляется раньше вида: упырь как то, чем становится человек, потерявший язык и мысль. Дальше почти месяц ничего. 2025-03-19 — вид заявлен целиком в одном монологе: доля выживших, живучесть, два минуса. В том же монологе и ограничили: «Упырь не владеет, какой-то сверхчеловеческой силой или скоростью. Он просто живучий и всё». В том же дне и показали единственную смерть упыря — взрывом изнутри. 2025-03-20 — обсуждение при чтении, где Слава отвечает на вопрос «ты тоже упырь?» изнутри роли. Возвращения после этого нет: вся сущность родилась, обросла ограничениями и закрылась внутри одних суток.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Минусов названо два, и они поданы парой. Для второго — потери «я» — назван удерживающий механизм: цель, «нить», прямо помечено, что она внешняя и снимается вместе с поводом. Для первого — голода — механизма того же рода нет. Сказано, чем он утоляется, но не сказано, копится ли он заново, как быстро возвращается, можно ли его держать так же, как рассказчик держал своё «я», и связаны ли между собой эти две шкалы. Правило удержания сформулировано для одной половины пары.</p>\n<p>Второе место: для экзоскелета названо условие входа — операция, которую переживёт только упырь. Для человека, который эту операцию делает и потом живёт рядом, условия не названы вовсе, хотя шесть учёных и 38 подопечных в тексте есть.</p>\n<h3>Отклик</h3>\n<p>«Нить» — лучшее, что здесь есть, и она работает по своим же правилам до конца: защита от распада оказалась внешней, люди кончились — защита кончилась, и рассказчик объявляет это сам, спокойно, как факт своей биографии. Список того, что упыря не убивает, читается как считалка и честно обрывается на «и так я могу перечислять до бесконечности» — неубиваемость держится на перечислении, а не на механизме, и от этого она страшнее, чем была бы с объяснением. Зацепил и обмен «ты тоже упырь?» — «А я разве терял»: единственное место, где автор и рассказчик совпали, и оно случилось само, а не было задумано.</p></div>", "r": []}];</script>
