<script>const BASE="";const DOCNAME="Паша";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0259-S01", "PS-0259--proishozhdenie"], "h": "<p>Паша — персонаж второй брошенной истории, записанной Славой одним заходом 2025-04-21 (id 320983–320988, окно w0088). Вселенная — «Нимб», объявлена. Версия одна: даты начала и конца совпадают, 2025-04-21 — 2025-04-21.</p>\n<p>История написана от первого лица; имя рассказчика в переписке не названо. Паша появляется со второго сообщения (id 320984) и остаётся до конца записанного куска.</p>\n<p>Завязка, в которую он попадает: рассказчик поверил «в одну чушь наверное. Чушь про корабль. Что там, на том корабле есть тот кто исполнить желания». 11 июня в полночь у заброшенного корабля «по размеру который как гора» собирается разношёрстная толпа — «студентка, клерк, старик, красотка, бандит, бизнесмен и так далее», из «разных слоев. Хм миров». В 00:00 нужно успеть забежать на палубу; те, кто не успел, остаются, а корабль оказывается посреди моря без горизонта.</p>\n<p>Как Паша попал на корабль и что он там загадал — в переписке не сказано. Про Игоря сказано, что он получил письмо от организации «нимб»; про Пашу источник приглашения не назван.</p>\n<p>Паша входит в тройку, которая идёт за рассказчиком по тёмным коридорам и оказывается с ним заперта в одной комнате: студентка Ника, клерк Игорь и он. Знакомство происходит там же — Игорь предлагает «например как нас зовут», и Паша отзывается:</p>\n<div class=\"q\"><p>«-ме-ня Паша- робко произнёс парнишка. Всё это время сидевший тихо»</p></div>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0259-S02", "PS-0259--vneshnost"], "h": "<p>Описан почти только через рост и возраст, в момент, когда рассказчик рассматривает нагнавшую его тройку:</p>\n<div class=\"q\"><p>«И третий самый низкий среди них был пацан. Вообще школьник кажись. И че он здесь забыл?»</p></div>\n<p>Дальше он называется «парнишка». Одежда не описана — у Ники («в джинсы и в рубашку», волосы «желто-розовый или как то так») и у Игоря («высокий мужчина в очках, одетый в пиджак») одежда названа, у Паши нет.</p>\n<p>Косвенно к внешности относится размер: когда трескается окно в затопляемой комнате, рассказчик прикидывает, что через него не выбраться — «оно же маленькой. Туда влезет только Паша и то не факт».</p>\n<p>Его кровь названа «детской»: «а из ног у Пашы пошла детская кровушка».</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0259-S03", "PS-0259--harakter"], "h": "<p>Молчаливый и робкий. При первом появлении «всё это время сидевший тихо», имя произносит запинаясь.</p>\n<p>Единственный из группы, кто отзывается на шутки рассказчика. Когда рассказчик разводит руки и объявляет группу командой, «не кто не оценил. Лишь построили раздраженый лица. Хотя нет. Вот Паша улыбается и слегка смеётся. Ну хоть, кто-то в юморе разбирается». При этом шутка про смерть его пугает: на «конечно! Сработает, а если нет то мы всего лишь умрем» — «Паша вздрогнул ему явно не понравилась шутка».</p>\n<p>Пугливый, но не бездействующий. В затопляемой комнате, пока Игорь с разбегу бьётся в железную дверь, «вот Паша молодец пытается, что-то найти» — рассказчик присоединяется к нему. План с выбиванием двери давлением воды Паша переспрашивает: «-а это, точно сработает?».</p>\n<p>Не хочет быть обузой: когда рассказчик сажает его на плечо, «он отнекивался. Говоря что и сам дойдет. Но я был твёрд».</p>\n<p>Не выдерживает вида трупа — после того как рассказчик падает лицом в выпотрошенное тело, Паша «встал и зашёл за Нику. В нежелание на это смотреть».</p>\n<p>Единственная его самостоятельная реплика по существу — та, что переламывает сцену в комнате отдыха:</p>\n<div class=\"q\"><p>«-я хочу домой- сказал Паша сидящий в углу комнаты и прижавшись колени к голове»</p></div>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0259-S04", "PS-0259--svyazi-s-drugimi"], "h": "<p><strong>Рассказчик</strong> (имя не названо). Отношения односторонне опекающие с одной стороны и потребительские с другой. Рассказчик держит Пашу над водой в затопленной комнате: «Пришлось взять Пашу. Кажись он не умеет плавать. И держать его по выше. Дабы кислорода оставалось, как можно больше, когда комнату полностью заполнет вода». Он же успокаивает его собственной логикой: «-да не бойся ты. Ты если, что в окно полежишь и выживешь-успокоил его я. Точнее я так думал. Но какая чёрту разница. Раз я так думал. Значит так и есть». Он же сажает разбившего ноги Пашу на плечо и несёт по коридору, чувствуя, как тот «мелко дрожал». При этом ровно про эту же тройку рассказчик до того думал: «Ну они могут быть отвлекающим маневром. В полне. Пока медведь будет их есть. Я смогу быстро свалить». Специально Паша из этого расчёта не исключён.</p>\n<p>Отдельно: рассказчик — тот, кто на берегу толкал людей, ранял их, ставил подсечки, чтобы уменьшить число попавших на корабль, и кто вспоминает, что ему «привычно» быть «в чужих органах и крови» («Мой шедевр, где-то там»). Паша об этом ничего не знает — что-либо на этот счёт в переписке не сказано.</p>\n<p><strong>Игорь</strong> — клерк в пиджаке и очках, тот, кто первым назвался и предложил остановиться на отдых. Прямого взаимодействия Паши и Игоря в тексте нет; они связаны финалом — исчезают вместе.</p>\n<p><strong>Ника</strong> — студентка. Взаимодействие одно: после падения рассказчика на труп Паша прячется за неё.</p>\n<p><strong>Артём</strong> — указан в поле «Связано с» карточки, но в записанном куске переписки не появляется ни разу. Чем он связан с Пашей — в переписке не сказано.</p>\n<p><strong>Организация «Нимб»</strong> — в разговоре тройки названа отправителем письма про корабль. Ника: «Одна из крупнейших организаций всего мира написала нам о корабль. Разве это не странно». Игорь: «ты хочешь сказать, что организация \"Нимб\" Во всём этом виновата?» Ника: «я не говорила, что она виновата. Я лишь сказала, что письмо от них. А это что-то да и значит». Паша в этом обсуждении не участвует.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S05", "PS-0259-S05", "PS-0259--kak-menyalsya"], "h": "<p><strong>2025-04-21 (id 320983–320988, окно w0088)</strong> — единственное состояние. Персонаж введён, раскрыт и к финалу куска пропадает. Других версий, правок и переписываний в переписке нет.</p>\n<p>Порядок сцен внутри этого состояния:</p>\n<ol>\n<li><strong>id 320984</strong> — появление. Тройка нагоняет рассказчика, все запираются в комнате, Паша называет себя.</li>\n<li><strong>id 320984</strong> — смеётся над шуткой про «супер группу»; после этого трескается окно, комната начинает затапливаться, и он ищет, чем помочь.</li>\n<li><strong>id 320985</strong> — переспрашивает про план с дверью, вздрагивает от шутки про смерть. Комната заливается полностью; выясняется, что он не умеет плавать, и рассказчик держит его над водой. Дверь выбита, воду выносит группу в коридор, где она «как-то быстро исчезла, испарилась», а комнаты за спиной уже нет.</li>\n<li><strong>id 320985</strong> — в тёмном коридоре «тени начали кидаться под ноги», Паша разбивает ноги в кровь и едет на плече рассказчика, мелко дрожа.</li>\n<li><strong>id 320986</strong> — рассказчик запинается о труп и падает вместе с ним; Паша падает на чистый пол, успевает закрыться руками, встаёт и уходит за Нику.</li>\n<li><strong>id 320986</strong> — в комнате без окон, выбранной для передышки, произносит «я хочу домой».</li>\n<li><strong>id 320987</strong> — исчезает вместе с Игорем.</li>\n</ol>", "r": []}, {"t": "Что с ним стало", "a": ["S06", "PS-0259-S06", "PS-0259--chto-s-nim-stalo"], "h": "<p>Реплика «я хочу домой» запускает у рассказчика приступ, описанный как внешнее воздействие — «Холод», тоска, которая «залазила мне словно в грудь», и которая на рассказчике ломается: «Ведь \"Холод\" Не знал какой же я. Не знал мою извращенную натуру. Не знал, что я не сожалею».</p>\n<p>Очнувшись, рассказчик обнаруживает в темноте чёрного гуманоида, «который был ещё черней чем тьма вокруг», тащащего Нику за ногу когтистой лапой. Паши и Игоря в комнате уже нет:</p>\n<div class=\"q\"><p>«Ну есть конечно этот гуманоид и Ника. Но где Игорь и Паша.<br>Получается их это существо утащил во мрак корабля, а я здесь. Хм значит неплохо быть в группе. Ведь первым ты всё равно не умрёшь.»</p></div>\n<p>То есть версия об утаскивании во мрак — догадка рассказчика, а не показанная сцена. Дальше рассказчик убивает гуманоида ножом в спину и остаётся с бессознательной Никой; на этом записанный кусок обрывается. Жив Паша или нет, куда именно его утащили и возвращается ли он — в переписке не сказано, история брошена.</p>\n<p>Существо, возможно связанное с исчезновением, до того показано только лапой за углом: «Едва показалось рука?. Нееет лапа зверя. Медведь? Не знаю», размером «как моя голова». Одно это существо или разные — не уточнено.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0259-S07", "PS-0259--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Фамилия, возраст, город, семья — не названы.</li>\n<li>Желание, ради которого он пришёл к кораблю, — не названо. Мотив есть у рассказчика, у Паши нет.</li>\n<li>Как он узнал о корабле — не сказано. Письмо от «Нимба» упомянуто только применительно к Игорю и Нике.</li>\n<li>Как школьник попал в ночную давку у корабля и почему прошёл на палубу — не объяснено; сам рассказчик отмечает «и че он здесь забыл?», но ответа не получает.</li>\n<li>Внешность за пределами роста и возраста не описана; одежда не названа.</li>\n<li>Связь с Артёмом, указанная в карточке, в переписке не проявлена.</li>\n<li>Судьба после исчезновения — осталось нерешённым. История брошена на сообщении id 320987; последнее сообщение окна (id 320988, Миколай) обсуждения не содержит.</li>\n<li>Обсуждения персонажа между соавторами в окне нет — только сам текст истории. Правок, вариантов и отклонённых версий Паши не зафиксировано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0259--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0074.html\">Четверо на корабле («супер группа»)</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0074.html\">Четверо на корабле («супер группа»)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0259--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-04-21</td>\n<td>320983–320988</td>\n<td>w0088</td>\n<td>Нимб (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0259-pasha.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0259--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0259.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
