<script>const BASE="";const DOCNAME="Бессмертный главный герой";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0331-S01", "PS-0331--proishozhdenie"], "h": "<p>Образ главного героя, из-за которого вообще появилась вселенная Феня. Слава прямо сказал (2025-12-09, id 394757): «Вообще это Вселенная появилась лишь потому что я пытался тот образ гг сделать в настоящим. А после она просто стало лёгкая вселенная».</p>\n<p>До этого — в том же разговоре — Слава сказал, что образ был перенесён из другого места: «Вообще этот образ гг был впихнут во вторую Вселенную» (394664).</p>\n<p>Образ существует раньше конкретных историй и переживает их: Слава бросил историю, где пытался его использовать, — «Сдайся. Я кинул эту историю. Потому что не понял гг» (394640), — но сам образ остался и был впихнут дальше.</p>", "r": []}, {"t": "Характер", "a": ["S02", "PS-0331-S02", "PS-0331--harakter"], "h": "<p>Две прямые характеристики от автора, обе 2025-12-09.</p>\n<p>Первая (394645–394646): «Просто есть образ гг. И этот образ отчасти можно оправдать лишь исекаем» — «Ну и тем что гг долбоеб».</p>\n<p>Вторая — уточнение, которое первую частично отменяет. Миколай начал реплику со слов «раз гг долбаеб», и Слава ответил: «Это не гг», «Гг бессмертный» (394737–394741). То есть «долбоеб» отнесено не к гг; при этом ранее «долбоеб» было сказано именно про гг. Оба состояния сохранены как есть, разъяснения в переписке нет.</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0331-S03", "PS-0331--sposobnosti"], "h": "<p>Бессмертие. Единственное названное свойство: «Гг бессмертный» (394741).</p>", "r": []}, {"t": "Место образа во вселенной", "a": ["S04", "PS-0331-S04", "PS-0331--mesto-obraza-vo-vselennoy"], "h": "<p>Из-за этого образа Феня получила свою общую настройку. Слава (394757): «А после она просто стало лёгкая вселенная. То есть сверх силы там слабее. И в теории даже обычные человек способен победить сверхчеловека. Из-за легче развивать отношения людей.» Он же противопоставил это другой своей вселенной: «Просто в Оам все чё-то слишком сильный. Да и Оам Вселенная большая как боевик».</p>\n<p>Жанр истории, в которой образ пытались реализовать, — исекай: «Вообще обычный исекай», «То есть исекай в мир фэнтези» (394657, 394659). Миколай заметил на это: «ну исекай можно интересным сделать, просто другой жанр» (394641).</p>", "r": []}, {"t": "Как менялся", "a": ["S05", "PS-0331-S05", "PS-0331--kak-menyalsya"], "h": "<p><strong>2025-12-09, около 15:17–15:22 (id 394640–394664).</strong> Образ описан как оправдываемый только исекаем и тем, что «гг долбоеб». Историю с ним Слава бросил, потому что «не понял гг». Миколай отметил, что раньше Слава так с персонажами не поступал: «ты никогда так не поступал с персами» (394647). Слава пообещал скинуть текст, когда напишет, и попросил себя подгонять: «Спрашивай. Подгоняй меня» (394650, 394661). В конце — «Вообще этот образ гг был впихнут во вторую Вселенную».</p>\n<p><strong>2025-12-09, 15:31 (id 394737–394742).</strong> Уточнение: «долбоеб» — не гг. Гг бессмертный.</p>\n<p><strong>2025-12-09, 15:36 (id 394757).</strong> Заявлено происхождение вселенной от этого образа и объяснено, во что вселенная превратилась после.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S06", "PS-0331-S06", "PS-0331--chto-s-nim-stalo"], "h": "<p>Одну историю с ним Слава бросил — «Я кинул эту историю. Потому что не понял гг» (394640). Другую он в том же разговоре пообещал довести: «Но вот эту историю я точно до концу» (394642). Из-за этого образа история переписывается снова и снова. Дальнейшего результата в прочитанной переписке нет.</p>", "r": []}, {"t": "Связи с другими", "a": ["S07", "PS-0331-S07", "PS-0331--svyazi-s-drugimi"], "h": "<ul>\n<li>Феня — вселенная, появившаяся из попытки сделать этот образ настоящим.</li>\n<li>Фанатик — история, связанная с образом; тождество не установлено, см. пробелы.</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0331-S08", "PS-0331--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Неясно, тождественен ли бессмертный гг Фени герою истории «Фанатик» или это только общий образ.</li>\n<li>Имя персонажа не названо — он проходит как «гг», «образ гг».</li>\n<li>Внешность не описана.</li>\n<li>Противоречие «долбоеб / это не гг» в переписке не разрешено.</li>\n<li>Механика бессмертия не разобрана: ни ограничений, ни цены, ни того, как оно выглядит в тексте.</li>\n<li>Не сказано, какие именно истории имеются в виду под брошенной и под той, которую Слава «точно до концу».</li>\n<li>Не сказано, что это за «вторая Вселенная», в которую образ был впихнут, — и совпадает ли она с Феней.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0331--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0011.html\">Феня</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0331--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-12-09</td>\n<td>394640–394664</td>\n<td>w0113</td>\n<td>Феня (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-09</td>\n<td>394737–394742</td>\n<td>w0113</td>\n<td>Феня (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-09</td>\n<td>394757–394757</td>\n<td>w0113</td>\n<td>Феня (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0331-bessmertnyy-glavnyy-geroy.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0331--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0331.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
