<script>const BASE="";const DOCNAME="Маска";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0259-S01", "SP-0259--mehanika"], "h": "<p>Отправной точкой была не механика, а предмет: «Есть маска. Чёрная маска с оранжевыми узорами. Без отверстие.» (2026-01-25, id 423806). Способность к этому предмету придумывалась отдельно и не сразу.</p>\n<p>Требования к способности Слава задал списком (2026-01-25, id 423807–423809):</p>\n<ul>\n<li>она не атакующая;</li>\n<li>носитель в этой маске должен суметь «проникнуть в защищённая места»;</li>\n<li>он должен суметь «убить группу вооружённых людей»;</li>\n<li>при этом он защищает мирных людей;</li>\n<li>«у этого персонажа нет сверх силы».</li>\n</ul>\n<p>Решение, найденное через несколько дней (2026-01-30, id 426075), — маскировка: «Люди просто тяжело его заметить в этой маске. А в толпе они инстикттвно будут считать его своим». То есть эффект двойной: снижение заметности как таковой и инстинктивное признание носителя своим внутри толпы. Второй эффект сформулирован именно через инстинкт, не через внушение или иллюзию.</p>\n<p>На вопрос Миколая, чем является способность — защитной или маскирующей (2026-01-30, id 426067–426068), Слава ответил «Нет» и «Да» подряд (id 426070–426071), то есть не защитная, а маскирующая.</p>\n<p>Аналогия, предложенная Миколаем и принятая Славой (2026-01-30, id 426081, 426086): «типа как супермена в очках?» — «Ну типа».</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0259-S02", "SP-0259--ogranicheniya-i-cena"], "h": "<p>Прямо не обсуждались. Из формулировки задачи следует одно ограничение по носителю: у персонажа нет сверхсилы, и маска её не даёт — способность неатакующая, а перечисленные задачи (проникновение, убийство группы вооружённых) носитель выполняет без силового преимущества. Как именно маскировка позволяет убить группу вооружённых людей, в переписке не разобрано.</p>\n<p>Конструктивная особенность маски — отсутствие отверстий («Без отверстие», id 423806). Последствия этого для носителя (как он видит, дышит) не обсуждались.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0259-S03", "SP-0259--nositeli"], "h": "<p>Носитель не назван по имени. Задача сформулирована про «перс с этой маской» (id 423809) — персонаж с маской, без имени.</p>\n<p>В связях записи значатся Апостолы и Масочник, но связь маски с Масочником из списка Апостолов в переписке прямо не проговорена.</p>\n<p>Масок предполагается шесть (2026-01-27, id 424732), соответственно носителей может быть несколько, но об этом не сказано.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0259-S04", "SP-0259--kak-menyalas-po-versiyam"], "h": "<p><strong>2026-01-25 (id 423805–423951).</strong> Постановка задачи. Слава: «Давай вернёмся к тупому шаблону». Описан предмет — чёрная маска с оранжевыми узорами, без отверстий — и перечислены требования к способности. Сама способность на этом этапе не придумана: Миколай отложил ответ («утром напишу», id 423950).</p>\n<p><strong>2026-01-27 (id 424732–424748).</strong> Слава: «Будет шесть масок, с разными цветами и узорами». Масок становится набор, а не одна. Ответ Миколая — согласие без содержательного вклада, разбор отложен.</p>\n<p><strong>2026-01-30 (id 426060–426089).</strong> Способность определена как маскирующая, а не защитная. Формулировка эффекта дана Славой; он отмечает, что придумал её сам и заранее: «Ну я как бы уже придумал», «А это сюжет в моей голове летал» (id 426075, 426077). В этот же момент Миколай предлагает раскладку цветов для шести масок (id 426076): «го 3 с белым 3 с черным и плюсуем: фиолетовый, оранжевый, зелёный, красный, синий, серый». Реакция Славы — «Ну ок» (id 426079). Дальше цветовая раскладка не разбиралась: какой цвет к какой маске, что означает деление на «с белым» и «с чёрным» — не сказано.</p>\n<p>Отмеченное расхождение внутри версий: исходная маска описана как чёрная с оранжевыми узорами (2026-01-25), а раскладка Миколая говорит о трёх масках с белым и трёх с чёрным плюс шесть дополнительных цветов, включая оранжевый (2026-01-30). Как исходная маска встраивается в эту раскладку, в переписке не согласовано.</p>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S05", "SP-0259-S05", "SP-0259--otklonennye-varianty"], "h": "<p>Вариант «защитная способность» отклонён прямым ответом Славы (2026-01-30, id 426067–426071) в пользу маскирующей.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S06", "SP-0259-S06", "SP-0259--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Связей с другими способностями в переписке не названо.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "SP-0259-S07", "SP-0259--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Носитель маски не назван по имени.</li>\n<li>Связь с Масочником из списка Апостолов прямо не проговорена.</li>\n<li>Вселенная в этом окне не объявлена; отнесение к Фене сделано по дате.</li>\n<li>Не сказано, как маскировка обеспечивает выполнение задачи «убить группу вооружённых людей».</li>\n<li>Раскладка цветов шести масок принята («Ну ок»), но не расписана: соответствие цветов маскам и смысл деления «3 с белым / 3 с чёрным» осталось нерешённым.</li>\n<li>Не сказано, различаются ли способности шести масок между собой или все шесть маскирующие.</li>\n<li>Устройство маски без отверстий не объяснено.</li>\n<li>Цена и ограничения способности не обсуждались.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0259--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0078.html\">Апостолы (Феня; список 12)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0259--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-01-25</td>\n<td>423805–423951</td>\n<td>w0115</td>\n<td>Феня (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-01-27</td>\n<td>424732–424748</td>\n<td>w0115</td>\n<td>Феня (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-01-30</td>\n<td>426060–426089</td>\n<td>w0115</td>\n<td>Феня (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0259-maska.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0259--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0259.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
