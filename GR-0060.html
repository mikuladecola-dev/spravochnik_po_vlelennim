<script>const BASE="";const DOCNAME="Группировка сестры (она же группа злодеев дочери Имитатора)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0060-S01", "GR-0060--chto-eto"], "h": "<p>Преступная организация вокруг дочери Имитатора в мире Оэм (он же Оам). Собственного названия у неё нет: в переписке она проходит только по своей главе — «Группировка сестры», позже «своя группа злодеев» дочери Имитатора.</p>\n<p>Впервые названа в общем перечне рас и организаций Оэм (2025-11-17, id 385768) одной строкой: «Группировка сестры ( который теперь будет дочерью Имитатора. И я не знаю какие у неё будет цель)». Тот же перечень слово в слово повторён 2025-12-06 (id 393287).</p>\n<p>Организация перенесена в Оэм вместе с самой «сестрой» из «Вселенной правителя». Про её прежнее состояние сказано (2025-12-06, id 393313): «В вселенной правителя её целью было объединить миры и вызвать Апокалипсис. У неё даже есть своя группа злодеев. Ну теперь я не знаю какая у неё цель в мире Оэм».</p>\n<p>По месту в силовой раскладке Оэм группировка стоит в третьем ярусе. Первые — коты (их девять, «они сильнеший», ни во что не вмешиваются), вторые — апостолы, «21 вторая по силе раса на земле», а дальше идут «расы и организации который равны по силе с друг другом» — и в этом списке перечислена группировка сестры наравне с Детьми мирового древа, Азуриэль, правительской организацией, церковью с паладинами, организацией Виктора, пернатыми, вампирами и прочими (2025-11-17, id 385768; повтор 2025-12-06, id 393287).</p>\n<p>Цель организации в мире Оэм не придумана — это прямо сказано дважды, при первом упоминании и через три недели («Ну теперь я не знаю какая у неё цель в мире Оэм», id 393313).</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0060-S02", "GR-0060--sostav"], "h": "<p>Поимённого состава нет. Названы двое:</p>\n<ul>\n<li><a href=\"PS-0324.html\">Дочь Имитатора</a> — дочь Имитатора, бывшая «сестра», глава. Имя не придумано: «А имя его дочери я не придумал» (2025-12-06, id 393475). Вариант «Имита» в переписке возникает как сокращение, при этом отдельно оговорено, что «Имит это Имитатор. Только сокращена» (id 393474).</li>\n<li><a href=\"PS-0325.html\">Босс группировки дочери</a> — босс группировки. Имени нет.</li>\n</ul>\n<p>Остальные участники не названы вообще: сказано только, что «у неё даже есть своя группа злодеев» (id 393313). Ни численности, ни рядовых членов, ни структуры в переписке нет.</p>", "r": [["Дочь Имитатора", "PS-0324.html"], ["Босс группировки дочери", "PS-0325.html"]]}, {"t": "Чем участники отличаются друг от друга", "a": ["S03", "GR-0060-S03", "GR-0060--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p><strong>Дочь Имитатора (<a href=\"PS-0324.html\">Дочь Имитатора</a>).</strong> Один из двух основных злодеев Оэм; второй — Бог красок, про которого сказано «Человек ( Бог красок) лишь образ. Он будет злодеем ну каким я не знаю» (2025-12-06, id 393314).</p>\n<p>Носит грех Чревоугодия — «то бишь голодная для знания», и это прямо привязано к отцу: «как её отец ( имитатора)» (id 393313).</p>\n<p>Не апостол. Это оговорено отдельно, как опровержение: «Дети апостолов не являются апостолыми. Они обычные люди» (2025-12-06, id 393468).</p>\n<p>Ушла от отца и скрывалась. Причина расписана целиком (2025-12-06, id 393473): «Это дочь ушла от него. И скрывалась. ( так как её пугал факт своего старения, когда её отец не старел ни на день. Она боялась что он почувствует если увидит что она стареет а он нет, а также боялась что он почувствуете хороня своего ребенка. Вспоминая защитника ( апостола, который по сути сошёл с ума когда умер его ребенок, и в какой-то момент полностью откажется от своей человеческой натуры. Она любит отца)».</p>\n<p>То есть страх у неё двойной: что отец заметит её старение при собственном нестарении и что отцу придётся хоронить своего ребёнка. Опорный пример здесь — Защитник, апостол, который «по сути сошёл с ума когда умер его ребенок».</p>\n<p>Апостолы относятся к ней дружелюбно, и она этим пользуется: «Апостолы также относятся к ней дружелюбно так как она дочь Имита. И она иногда будет этим пользоваться» — «Для плана» (2025-12-06, id 393476–393477). Что за план — в переписке не сказано.</p>\n<p><strong>Босс (<a href=\"PS-0325.html\">Босс группировки дочери</a>).</strong> Обычный человек. Появляется репликой «Да. И у неё будет босс ( обычный человек но с глубоким убеждением)» (2025-12-06, id 393462). Через четверть часа добавлено: «Это босс будет хитрым и уверенным. Хотя обычные человек. Попытается наладить связь с Имитам» (id 393479).</p>\n<p>Никаких способностей у него не названо; «обычный человек» проговорено дважды, оба раза как противопоставление («но с глубоким убеждением», «хотя обычные человек»). В чём состоит его глубокое убеждение — не сказано.</p>", "r": [["Дочь Имитатора", "PS-0324.html"], ["Босс группировки дочери", "PS-0325.html"]]}, {"t": "Иерархия", "a": ["S04", "GR-0060-S04", "GR-0060--ierarhiya"], "h": "<p>Группировка названа по дочери Имитатора и принадлежит ей: «У неё даже есть своя группа злодеев» (id 393313), «у неё будет босс» (id 393462). То есть босс стоит при ней, а не над ней.</p>\n<p>Больше уровней не описано. Как босс и дочь распределяют дела между собой, кто из них ведёт организацию повседневно, есть ли между ними подчинение или партнёрство — в переписке не сказано.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S05", "GR-0060-S05", "GR-0060--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>С Имитатором и апостолами.</strong> Единственная заявленная внешняя линия — попытка босса выйти на Имита. Мотив назван сразу же: «Попытается наладить связь с Имитам» — «Так как для правительства. Представитель Апостоловы именно Имит» (2025-12-06, id 393479–393480). То есть связь с Имитом для группировки — это выход на апостолов в их официальном, признанном правительством качестве.</p>\n<p>Вторая линия — та же дружелюбность апостолов к дочери «так как она дочь Имита», которой она пользуется «для плана» (id 393476–393477).</p>\n<p>Сам Имитатор в это время: жив, никуда не исчезал, «будет участвовать в сюжете, возможно как гг» (id 393468); апостол (id 393455); носит тот же грех Чревоугодия; любит дочь — «Сам Имит тоже любит свою дочь. Также сильна как и своих братьев и сестёр апостолов» (id 393476). Позже, в разборе от 2026-04-19 (id 462272), его роль в Оэм названа так: «В Оэм он просто политический важный перс».</p>\n<p><strong>С апостолами как силой в мире.</strong> Апостолы в Оэм отнесены к стороне добра, при этом «Ну будут устраивать геноциды и теракты» и «Плюсом они высокомерны, хотя прямо этого не показывать» (2025-12-06, id 393293). Отдельного конфликта или союза группировки с ними не заявлено — только личное дружелюбие к дочери и планируемый выход босса на Имита.</p>\n<p><strong>Со вторым основным злодеем.</strong> Дочь и Бог красок названы двумя основными злодеями Оэм в одном перечислении (id 393313–393314), но никакой связи, союза или вражды между ними и их силами в переписке не проговорено.</p>\n<p><strong>С прочими сторонами Оэм.</strong> Промежуточными злодеями мира названы Дети мирового древа, клан крылатых (Серафим), церкви, иногда люди, Виктор, «что воскрешает трупы, ну точнее делает из них марионеток» (2025-12-06, id 393305–393308). Отношений группировки с ними не описано.</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S06", "GR-0060-S06", "GR-0060--kak-menyalas"], "h": "<p><strong>2025-11-17 (id 385768–385769).</strong> Первое упоминание, одна строка в перечне сил Оэм. Зафиксировано два состояния сразу: организация раньше принадлежала «сестре», теперь её глава переписывается в дочь Имитатора; цели нет — «И я не знаю какие у неё будет цель».</p>\n<p><strong>2025-12-06, вечер, около 17:36 (id 393287–393296).</strong> Перечень организаций Оэм повторён дословно, строка про группировку — без изменений. Разложена иерархия сил мира, группировка остаётся в ярусе «равных по силе» организаций.</p>\n<p><strong>2025-12-06, 17:54 (id 393313).</strong> Развёрнуто: глава названа «Сестра, ну теперь дочь имитатора (Имита)»; сообщается прежняя цель из «Вселенной правителя» — «объединить миры и вызвать Апокалипсис»; подтверждено существование группы злодеев при ней; цель в Оэм по-прежнему не придумана; добавлен грех Чревоугодия — «то бишь голодная для знания», как у отца. Тогда же (id 393316) сформулирована задача, которая на этот день так и осталась невыполненной: «Так мне нужна цель и мотивация двух сильнейших за мир И цель и мотивация двух сильнейших злодеев».</p>\n<p><strong>2025-12-06, 21:41 (id 393462).</strong> Появляется вторая фигура: «И у неё будет босс ( обычный человек но с глубоким убеждением)».</p>\n<p><strong>2025-12-06, 21:48–21:53 (id 393468–393477).</strong> Отклонённая версия: часть предложенного разбора помечена как неверная («Хуйня»), и вместо неё зафиксировано: Имитатор жив и никуда не исчезал, дети апостолов апостолами не являются. На этом же месте выстроена предыстория дочери — уход от отца, страх старения, любовь к отцу, дружелюбие апостолов и использование этого дружелюбия «для плана».</p>\n<p><strong>2025-12-06, 21:55–21:56 (id 393479–393480).</strong> Босс дополнен: «хитрым и уверенным», при этом обычный человек; заявлена его линия на Имита и объяснение, почему именно на него.</p>\n<p><strong>2026-04-19 (id 462201–462204).</strong> Мир Оэм отложен целиком: «Поэтому Оэм пока отложим», «Строим новую вселенную без энергии». Причина названа не в группировке, а в Имитаторе — из-за него в каждой вселенной поднимается уровень сил. Там же сказано, что в Оэм Имитатор «должен был бы стать Богом красок. То есть буквально Богом что перерисовает мир». Сама группировка в этом окне не упоминается, и что с ней при откладывании мира — не проговорено.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "GR-0060-S07", "GR-0060--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Названия у группировки нет — только «по сестре». Собственное имя не придумывалось.</li>\n<li>Цели в мире Оэм нет. Это осталось нерешённым: заявлено при первом упоминании (2025-11-17) и повторено месяц спустя (2025-12-06, id 393313).</li>\n<li>Поимённого состава нет: кроме главы и босса участники не названы, численность не названа, структура не описана.</li>\n<li>Общих способностей группы нет вообще — ни у кого из участников, кроме главы, способности не упомянуты, а у самой главы способности тоже не описаны, названы только грех Чревоугодия и происхождение.</li>\n<li>Имени главы нет: «А имя его дочери я не придумал» (id 393475). Имени босса нет.</li>\n<li>В чём состоит «глубокое убеждение» босса — не сказано.</li>\n<li>Что за «план», ради которого дочь пользуется дружелюбием апостолов, — не сказано.</li>\n<li>Чем закончилась или к чему привела попытка босса наладить связь с Имитом — не сказано; заявлено только намерение.</li>\n<li>База, территория, ресурсы, способ существования организации — ничего этого в переписке нет.</li>\n<li>В том же куске переписки, где появляется босс (id 393463–393465), идут реплики про образ и про Матку в церкви; к боссу они в переписке не отнесены, и связь с ним не проговорена.</li>\n<li>Судьба группировки после откладывания мира Оэм (2026-04-19) не обсуждалась.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0060--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0324.html\">Дочь Имитатора</a>, <a href=\"PS-0325.html\">Босс группировки дочери</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0060--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0060.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0060-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0060/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Самое дорогое здесь — не отсутствие цели у группировки, а то, что её глава разъехалась на две сущности. У <code>PS-0324</code> («Дочь Имитатора») статья есть, а у <code>PS-0375</code> («Доима, дочь Имета») статьи нет вообще, при 9036 знаках материала в базе, и на неё ссылаются <code>PS-0383</code>, <code>PS-0324</code>, <code>PS-0215</code>, <code>PS-0104</code> и <code>IS-0067</code>. То есть пять записей указывают на фигуру, которой в справочнике нет, и одна из них — та самая статья, куда ведёт эта. Пока это не сведено, всё, что в статье помечено как «имени нет», будет висеть: имя, возможно, уже есть, просто под другим номером.</p>\n<p>Вторая по цене — <code>PS-0364</code> («Дети апостолов»): 3521 знак базы, статьи нет. Именно там лежит правило, на котором в статье держится оговорка «Дети апостолов не являются апостолыми», и ссылаются на неё <code>PS-0324</code> и <code>GR-0001</code>.</p>\n<h3>С чего начать</h3>\n<p>В архив идти не надо — материал в базе. Первым делом свести <code>PS-0375</code> с <code>PS-0324</code> (или развести окончательно, если это разные фигуры) и посмотреть <code>IS-0092</code> — «Эксперимент Доимы: дыра между мирами», 8080 знаков, ни статьи, ни ссылок; если это та же дочь, там лежит целое сюжетное действие, которого в статье нет ни строкой. Дальше <code>SL-0125</code> — «Список нерешённых вопросов по миру Оэм», 3899 знаков без статьи: задача «мне нужна цель и мотивация двух сильнейших злодеев» из id 393316 почти наверняка попала туда, и проверять её надо там, а не перечитывать чат.</p>\n<p>В архив — только за двумя вещами. Окно 2026-04-19, id 462201–462272: мир откладывали, а про группировку не сказали ничего; надо смотреть, не обсуждалась ли она позже под другим именем. И id 393463–393465 — там между репликой про босса и репликой про его линию на Имита идут куски про образ и про Матку в церкви; статья честно говорит, что связь не проговорена, но само соседство в одном окне стоит перечитать целиком.</p>\n<h3>Как развивалось</h3>\n<p>2025-11-17 — заявили одной строкой и сразу отметили, что цели нет. 2025-12-06, 17:36 — перечень повторили дословно, строка не изменилась. 17:54 — развернули происхождение и грех, и той же рукой повторили, что цели по-прежнему нет. 21:41–21:56 — вместо цели прирастили сбоку вторую фигуру, босса, и дали ей направление движения (выход на Имита). 2026-04-19 — мир отложили целиком, группировку не упомянули. Заявили — повторили без изменений — обошли нерешённое, добавив соседнюю деталь — отложили вместе с миром.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Про принадлежность к апостолам правило названо прямо: «Дети апостолов не являются апостолыми. Они обычные люди». Про грех — вопрос ровно того же рода — правила нет: у дочери Чревоугодие «как её отец», но передаётся ли грех детям апостолов вообще, или это единичный случай, не проговорено. Два утверждения об одних и тех же детях стоят в соседних сообщениях одного вечера: не апостолы — и при этом с отцовским грехом.</p>\n<h3>Отклик</h3>\n<p>Зацепила причина побега. Не «поссорились», не «предала» — а страх, что отец заметит её старение при собственном нестарении, и второй, отдельный: что отцу придётся её хоронить. И тут же приведён прецедент — Защитник, апостол, который сошёл с ума, когда умер его ребёнок. Она уходит не от отца, а от того, что с ним сделает её смерть, и при этом «Она любит отца». Это сильный мотив, и он делает ровно ту работу, которую должна была делать ненайденная цель организации. Сама группировка на его фоне выглядит пустой оболочкой: всё живое в статье принадлежит дочери, а не группе — у группы нет ни имени, ни людей, ни места.</p></div>", "r": []}];</script>
