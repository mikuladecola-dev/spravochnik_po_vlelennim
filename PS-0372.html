<script>const BASE="";const DOCNAME="Праведник";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0372-S01", "PS-0372--proishozhdenie"], "h": "<p>Введён 2026-06-03 одним большим сообщением Славы (id 487514, окно w0121), которое начинается с назначения роли и имени: «Герой лицо ассоциации. Давай назовём его \"Праведник\".» То есть роль — герой номер один, лицо ассоциации — задана раньше имени.</p>", "r": []}, {"t": "Характер", "a": ["S02", "PS-0372-S02", "PS-0372--harakter"], "h": "<p>Функция героя описана как безусловная: «он всегда героет, он всегда придёт на помощь даже когда злодей будут действовать скрытно». Отдельно отмечена его устойчивость — «А также он устойчив».</p>\n<p>Обращение со злодеями зафиксировано на примере инцидента Изба: спасая Изба от злодея, Праведник «на глазах всех людей будет давить и ломать кости злодея». Свою позицию он там же проговаривает: «ему без разницы что будут делать злодей, ведь итог один он их убьёт и ему без разницы мнения общества или предыстория злодей, а также его цель он просто убьёт их».</p>\n<p>Эта сцена вызвала возражение соавтора. Миколай (2026-06-03, id 487517–487519): «но чёт он ебанутый», «нахуй так со злодеем», «ну он же лицо». Ответ Славы (id 487532): «Конечно он ебанутый. Он блять каждый Божий день слышат крики о помощи. Его каждую ночь мучуют кошмары. Конечно он ебанутый». Миколай принял объяснение спустя примерно 1.3 часа (id 487541–487542): «аа», «тогда справедливо».</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0372-S03", "PS-0372--sposobnosti"], "h": "<p>Основной набор (2026-06-03, id 487514): «Способность праведника слышать мольбы, воскрешения и маломальская видения будущего.» Дополнительно к этому: «он будет способен видить картинку будущего, точнее картинку инцидента где умрут множество людей, так отголосок он увидит во сне».</p>\n<p>Боевых способностей у него нет: «Во первых у него нет боевых способностей. Он просто будет усилять себя с помощью Оам.»</p>\n<p>Отдельно закреплена плёнка: «И ц него самая плотная плёнка, Из-за того, что-то как бы является на полшишечки коллективным разумом. Ну его разум открыт для других разумов поэтому он растёт вместе с тем разумом который но вырос.»</p>\n<p>Реализованные применения способности, названные в переписке:</p>\n<ul>\n<li>предсказал инцидент с геноцидом апостолов: «Также он предсказал инцидент где апостол устроят геноцид. И они попытался им мешать. Очень сильно мешал. Но всё равно апостолы сделали своё дело, хотя и не так полноценно как сами того хотели»;</li>\n<li>в инциденте Изба спас Изба от злодея.</li>\n</ul>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0372-S04", "PS-0372--svyazi-s-drugimi"], "h": "<p><strong>Ассоциация.</strong> Праведник — её лицо. Обоснование дано прямо: «Почему именно праведник лицо ассоциации. Потому что он всегда героет, он всегда придёт на помощь даже когда злодей будут действовать скрытно. Также он не плохая пропаганда. Вот героем номер один может стать даже человек без атакующей способность. А также он устойчив.»</p>\n<p><strong>Изб.</strong> Праведник спасает его в «инциденте Изб». В списке несостоявшихся лиц ассоциации: «Изб не устойчив».</p>\n<p><strong>Граф.</strong> В том же списке: «Граф часто раздражённый».</p>\n<p><strong>Нуар.</strong> В том же списке: «Нуар просто не хотел светиться, и напоминать людям о том что ИС такое сильные».</p>\n<p><strong>Святая дева (<a href=\"PS-0373.html\">Святая дева</a>).</strong> Реальная конкурентка за роль: «она в полне себе конкурировала за роль лица ассоциации. Но по итогу проиграла. Не хватило голосов. Возможно в будущем будет заменой праведника.» Через два часа того же дня (id 487531) Слава убирает Святую деву из вселенной целиком, так что заявленная возможная замена Праведника отменяется вместе с персонажем.</p>\n<p><strong>Апостолы.</strong> Противостояние: предсказал их геноцид и «Очень сильно мешал», но помешал не полностью.</p>", "r": [["Святая дева", "PS-0373.html"]]}, {"t": "Как менялся", "a": ["S05", "PS-0372-S05", "PS-0372--kak-menyalsya"], "h": "<p>Одна версия, 2026-06-03 (id 487514–487542, окно w0121). Внутри окна сама задумка Праведника не переписывалась: всё, что о нём сказано, задано первым сообщением, а дальнейший обмен репликами только защищает уже сказанное (возражение Миколая про жестокость и ответ Славы про крики о помощи и кошмары).</p>\n<p>Менялось окружение: в том же окне (id 487531) вычеркнута Святая дева, названная в первом сообщении возможной будущей заменой Праведника.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0372-S06", "PS-0372--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Внешность не описана вообще.</li>\n<li>Настоящее имя, возраст, биография до роли лица ассоциации — не названы.</li>\n<li>«Оам», которым он себя усиливает, в этих репликах не расшифровывается.</li>\n<li>«Плёнка» и её плотность не объясняются; сказано только, что у Праведника она самая плотная и почему.</li>\n<li>Механика воскрешения не описана: кого, при каких условиях, с какой ценой — не сказано.</li>\n<li>«Инцидент Изб» упомянут как известное событие, но не описан.</li>\n<li>Устройство ассоциации и процедура голосования за её лицо не описаны; сказано лишь, что Святой деве «не хватило голосов».</li>\n<li>«ИС», о силе которых Нуар не хотел напоминать людям, не расшифровано.</li>\n<li>Что с Праведником стало в итоге — в переписке не сказано.</li>\n<li>Вселенная в базе помечена как «неясно (по дате объявления)».</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0372--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0373.html\">Святая дева</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0104.html\">Нуар</a>, <a href=\"PS-0373.html\">Святая дева</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0372--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-06-03</td>\n<td>487514–487542</td>\n<td>w0121</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0372-pravednik.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0372--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0372.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
