<script>const BASE="";const DOCNAME="Копейщики";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0228-S01", "PS-0228--proishozhdenie"], "h": "<p>Копейщики появляются в рассказе Славы от первого лица (2025-03-18, id 305115–305116, окно w0082). В навигации базы рассказчик назван Максимом; в самом тексте имя не звучит.</p>\n<p>К моменту их появления рассказчик уже убил в заброшке чёрную лучницу — женщину с чёрной кровью, которую он забил насмерть, наступая ногой на голову, «Пока не слышу характерный хрусть. Ломающий черепушки. И кровь у неë тоже черная». После этого он продолжал жить как раньше, но «скука стало куда сильнее. После того приключения с лучницей. Теперь простый драки мне казались детской забавой. Я хотел боя за жизнь. Где либо тебя либо ты». Ночные прогулки продолжались и результата не давали — «До одного момента. Я нашёл их в лесу».</p>\n<p>Появление копейщиков привязано к чёрной дымке: «Я гулял по лесу и увидел чёрную дымку. И сразу понял, что это, что то не правильная». У дымки был овраг, рассказчику пришлось спускаться по склону, и на разгоне «словно из темноты появляется тёмный мужчина». Откуда именно они пришли и что такое дымка, в этом фрагменте не объяснено; объяснение про чужемирцев даётся позже, отдельно.</p>\n<p>В переписке используются написания «Копьещик» и «черныш».</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0228-S02", "PS-0228--vneshnost"], "h": "<p>Прямо сказано только, что они такие же, как убитая лучница: «тёмный мужчина. Подобной той который я убил. Но этот с копьём». Их двое, оба одного вида. Отдельного описания лиц, одежды или роста нет. Кровь лучницы была чёрной; про кровь копейщиков не сказано.</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0228-S03", "PS-0228--sposobnosti"], "h": "<p>Копья появляются у них заново. Один копейщик бросил копьё в спину рассказчику, а затем оказался готов к тычку «Не пойми откуда взявшимся у него ещё одним копьем». Как именно это работает, в переписке не объяснено.</p>\n<p>Тело копейщика проницаемо для стрелы союзной лучницы. Когда рассказчик перехватил копьё и встал за спину копейщика, прикрываясь им как щитом, «стрела прошла насквозь этого черныша даже не ранев его. А вот меня она ранила. И выстрел оказался мощным. Я аж отлетел».</p>\n<p>Сравнение с лучницей дано прямо: «Они хоть не такие ловкий, как лучница. Но более крепкие». Крепкость подтверждена в бою: после удара в лицо «он не отлетел и не вырубился. От достаточно не плохого удара».</p>\n<p>Слабость оружия рассказчик формулирует сам: «Как никак копье не орудия ближнего боя» — поэтому он перехватывает копьё и сближается.</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0228-S04", "PS-0228--svyazi-s-drugimi"], "h": "<p>В том же бою участвует лучница в кустах — третий противник, стреляющий из засады. Рассказчик определяет её присутствие на слух: «Я слышу хрусть травы с другой стороны, левей. Их здесь трой». Её стрела задевает ему лоб, вторая пробивает копейщика насквозь и ранит рассказчика.</p>\n<p>Имитатор — тот, кто убил всех троих. В момент боя он не назван: рассказчик видит только белые глаза, светящиеся из чащи и исчезающие. Затем он выходит — мужчина от 20 до 30, в белой рубашке и чёрных брюках, сквозь рубашку видны мышцы, «словно в рекламах», лицо симметричное, причёска обычная, только волосы чуть длинноваты, идёт с улыбкой. Он предлагает подвезти, а потом даёт выбор: «Первый я подхожу тебя к остановки и ты едешь домой. Забыв обо всём этом и живя обычной жизнью. Второй- ты становишься агентом и сразаешься с подобными тварями, как сегодняшний. Выбор за тобой. Я не буду говорить плюс и минус». Рассказчик выбирает второе. Уезжая, имитатор говорит, что спешит: «Ведь ему надо встретиться с новым апостооом по прозвищу \"защитник\"».</p>\n<p>Чужемирцы — вид, к которому в базе отнесены копейщики (запись помечена как часть чужемирцев). Объяснение даётся рассказчику уже в лагере агентов, после боя: «В начале всего было ничего. Потом появился первый мир \"Килька\". И да это наш мир. А потом начали появляться другие миры. И в каждом этом мире был свой бог. Его называют Правителем. И вот эти миры появляются и по сей день. И между всеми мирами есть некая связь. Но у всех это связь более крепкая с \"Килькой\" С первом миром». Далее: «чужемирцы. Это существо покинувший свой мир. По каким либо причинам. Чаще всего из-за того, что их ней миры суший ад. Или желанием захвата других миров. Ну грубо говоря почти всё чужемирцы жестокие психи. Для которых убийства это обыденная дело. У них там ещё разделения по видам способностей». Разделение по видам способностей в переписке не расписано — рассказчик обрывает себя: «Ну это скука об этом говорить». Прямо копейщики чужемирцами в тексте боя не названы.</p>", "r": []}, {"t": "Как менялся", "a": ["S05", "PS-0228-S05", "PS-0228--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2025-03-18 (id 305115–305116), вселенная «Апостол», окно w0082.</strong> Единственная версия. Копейщики появляются, участвуют в бою и гибнут в пределах одного эпизода. Более поздних переработок в переписке нет.</p>\n<p>Ход боя: первый копейщик выходит из темноты уже в стойке для удара, рассказчик уходит в бок, из-за инерции прокручивается вокруг него и оказывается за спиной, бьёт по лицу. Второй бросает копьё в спину — рассказчик уходит в бок. Первый бьёт горизонтально, рассказчик нагибается, встаёт и снова бьёт по лицу; тот устаивает. Рассказчик перехватывает его копьё, слышит выстрел из кустов слева, отскакивает, стрела задевает лоб. Отскок сближает его со вторым, у которого уже новое копьё; рассказчик изгибается всем туловищем, прокручивается вокруг оси для удара в повороте, но противник приседает, и рассказчик пинает его ногой, заставив покатиться назад. Развернувшись к подбегающему первому, перехватывает копьё и встаёт ему за спину, прикрываясь от лучницы, — и получает стрелу, прошедшую копейщика насквозь.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S06", "PS-0228-S06", "PS-0228--chto-s-nim-stalo"], "h": "<p>Оба погибли в этом же бою, от имитатора.</p>\n<p>Первый: «Когда этот Копьещик уже замахнулся для удара. Вокруг его головы. Лишь на мгновение. Образовалось белая цепь. И в следующий мгновенной у Копьещика нет головы. Она слетела. Это было мгновенно. Что даже я не понял откуда взялась цепь».</p>\n<p>Второй: «А второй Копьещик, который находился рядом. Явно тоже удивился. Он стоял у дерева и дрожал. С широкой открытыми глазами. Пока не взорвался. Словно изнутри. И лишь на мгновение, когда произошёл взрыв. Там за спиной этого взорвоного черныша. Засветились белый глаза. И исчезли. Словно их и не было».</p>\n<p>Лучница в кустах побежала прочь; рассказчик услышал «падения тела об землю и тишина».</p>\n<p>После боя рассказчик уехал с имитатором, согласился стать агентом, через три дня был забран, попал в лагерь на шесть месяцев подготовки, но отучился три недели — «Так как я был в идеальном физической форме и мне оставалось только дать информацию и ресурсы и всё». Куратором был Михаил Саакашвили с кодовым прозвищем «Медведь»: под два метра ростом, почти столько же в плечах, мышцы, суровое лицо богатыря, кожаный плащ, «суров, но справедливым». В группе было десять человек: «Каждый агент может быть куратором только для 10 людей».</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0228-S07", "PS-0228--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Кто такие копейщики по происхождению, в тексте боя не сказано; отнесение к чужемирцам идёт из базы, а не из реплики.</li>\n<li>Не сказано, из какого мира они пришли и зачем.</li>\n<li>Механика повторного появления копий не объяснена.</li>\n<li>Почему стрела лучницы прошла копейщика насквозь, не ранив его, а рассказчика ранила, — не объяснено.</li>\n<li>Способность имитатора (белая цепь, взрыв изнутри, белые глаза) в этом фрагменте только показана; ни названия, ни объяснения нет — рассказчик сам говорит, что не понял, откуда взялась цепь.</li>\n<li>Число противников уточняется в бою на слух («Их здесь двое. Нет. &lt;...&gt; Их здесь трой»), но общий состав группы прямо не назван.</li>\n<li>Разделение чужемирцев по видам способностей упомянуто и не раскрыто.</li>\n<li>Цвет крови копейщиков не назван, хотя у лучницы он оговорён отдельно.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0228--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0019.html\">Чужемирцы</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0019.html\">Чужемирцы</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0228--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-03-18</td>\n<td>305115–305116</td>\n<td>w0082</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0228-kopeyschiki.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0228--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0228.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0228-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0228/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Самая дорогая дыра здесь — не сами копейщики, а классификация, в которую их некуда положить. В тексте прямо сказано, что у чужемирцев «ещё разделения по видам способностей», и тут же оборвано. Разбирать это разделение должны служебные списки, и они же — самые цитируемые записи справочника без статьи: <code>SL-0053</code> «Список персонажей вселенной» (6 ссылок, статьи нет, база 20 313), <code>SL-0051</code> «Каталог: благословенные, враги, грехи, оружие, артефакты» (6 ссылок, статьи нет, 9 834), <code>SL-0090</code> (4 ссылки, статьи нет, 5 492), <code>SL-0089</code> «Список категорий сил: Благословенный, Арбетары, Альфы, Чужемирцы, Владельцы артефактов, Фантазёры» (4 ссылки, статьи нет, всего 1 753 знака). Ни на одну из четырёх нельзя сослаться. Пока их нет, копейщики останутся тем, чем они сейчас и являются: двумя противниками без разряда — и вместе с ними в том же положении <code>PS-0227</code>, <code>PS-0198</code>, <code>MR-0117</code>, <code>MR-0100</code>.</p>\n<p>Отдельно: <code>SL-0089</code> при четырёх ссылках весит 1 753 знака. Это значит, что материала под категориями почти нет — то есть разбирать придётся не запись, а архив.</p>\n<h3>С чего начать</h3>\n<p>Три из восьми перечисленных пробелов закрываются в базе, без архива.</p>\n<p>Механика повторного появления копий — <code>SP-0203</code> «Создание оружия из себя» (статья есть, база 2 067), окно 305314–305321, тот же день 2025-03-18. Правило родовое: «Они могут создавать оружия из себя», с сразу же введённым ограничением «Но трансформировать тело не могут». Копьё, взявшееся «не пойми откуда», — это оно и есть; статья про копейщиков сформулирована так, будто объяснения нет, а объяснение лежит через две записи.</p>\n<p>Чёрная дымка — <code>MR-0124</code> «Чёрная дымка» (статья есть, база 28 831). Это единственная крупная запись, отвечающая на «что такое дымка» и почему у неё овраг.</p>\n<p>Белая цепь, взрыв изнутри и белые глаза — <code>SP-0205</code> «Цепи имитатора» (3 ссылки, статья, 20 127) и <code>PS-0383</code> «Имитатор», где 305855 (2025-03-19) даёт того же мужчину 20–30 лет в белой рубашке и тёмных брюках уже с именем. Отнесение копейщиков к чужемирцам подпирается <code>PS-0198</code> (статья, 58 680).</p>\n<p>В архив — за одним: за разделением по видам способностей. Смотреть окно w0082, 2025-03-18, участок после 305117 и разговор 305333–305354, где Миколай как раз расспрашивает про систему; если ответа нет и там, то дальше по w0083–w0084.</p>\n<h3>Как развивалось</h3>\n<p>Показали, объяснили задним числом, сами свернули объяснение, не вернулись. 2025-03-18 копейщики появляются, дерутся и гибнут внутри одного эпизода, 305115–305116, — весь их срок жизни это два сообщения. Объяснение того, кто они, приходит позже в том же тексте и из другого места: рассказчик уже в лагере, и космология — Килька, Правители, чужемирцы — подаётся как учебный материал. То есть вид объяснён после гибели носителей. И там же, дойдя до разделения по способностям, рассказчик обрывает сам себя: «Ну это скука об этом говорить». Более поздних переработок нет: даты статьи начинаются и заканчиваются 2025-03-18.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Правило о том, откуда у чужемирца оружие, названо: он делает его из себя, тело при этом не меняя. Правило о том, как это оружие действует на человека, тоже названо и показано — стрела ранит Максима, и глубоко. Про третий случай, который в сцене прямо разыгран, правила нет: стрела «прошла насквозь этого черныша даже не ранев его». Оружие чужемирца против чужемирца — тот же род случая, что и два первых, и он единственный оставлен без формулировки. Место видно, потому что оно в тексте не пропущено, а показано.</p>\n<h3>Отклик</h3>\n<p>Сильнее всего — второй копейщик. Первого срубает белая цепь, и это эффектно, но обычно. А второй просто стоит у дерева и дрожит с широко открытыми глазами, пока не взрывается. Между тем, как он понял, что сейчас произойдёт, и тем, как это произошло, есть пауза — и она в тексте есть физически, отдельным предложением. Ещё зацепила хореография: перехват копья и уход за спину противника, чтобы прикрыться им от лучницы, — тактически правильное решение, которое немедленно наказывается тем, что чужемирское тело для чужемирской стрелы не препятствие. Приём, который сработал бы против человека, здесь оборачивается против того, кто его применил, и это придумано лучше, чем объяснено. Слабое место чувствуется там же, где сильное: про этих двоих не сказано ничего сверх того, что они крепче лучницы и менее ловкие, — они существуют ровно столько, сколько длится драка.</p></div>", "r": []}];</script>
