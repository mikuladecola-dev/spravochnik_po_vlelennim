<script>const BASE="";const DOCNAME="Смотрящий";

const CH=[{"t": "Связи с другими", "a": ["S01", "PS-0172-S01", "PS-0172--svyazi-s-drugimi"], "h": "<p>Смотрящий назван в перечне сильнейших персонажей вселенной вместе с Имитатором, Палачом и Нуаром. Формулировка Славы: «И сильнейшего виде Имитатора и Палача, Нуара, смотрящего / Какой уровень силы у них по твоему» (2024-12-13, id 269820). Перечисление идёт в разговоре про уровни сил 1-10, с которыми запись и связана в базе.</p>\n<p>Ответа на заданный вопрос по этому персонажу не последовало: Миколай ответил на саму идею шкалы — «ну вводить четкие уровни силы идея сложная кнш» (id 269822), Слава уточнил «Не примерно» и добавил про шкалу: «Да ито она наверное не раз смениться» (id 269823–269824). Ни один уровень силы Смотрящему в этом окне не присвоен.</p>", "r": []}, {"t": "Как менялся", "a": ["S02", "PS-0172-S02", "PS-0172--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2024-12-13 (окно w0066, id 269818–269824).</strong> Единственная версия. Имя названо в списке сильнейших и не раскрыто. Больше в переписке к персонажу не возвращаются.</p>", "r": []}, {"t": "Пробелы", "a": ["S03", "PS-0172-S03", "PS-0172--probely"], "h": "<div class=\"gaps\"><ul>\n<li><strong>В окне только имя.</strong> Происхождение, внешность, характер, способности, судьба — ничего из этого не названо.</li>\n<li><strong>Уровень силы не назван</strong>, хотя вопрос про уровень был задан именно в связи с этим перечнем.</li>\n<li><strong>Чем Смотрящий связан с Имитатором, Палачом и Нуаром</strong>, кроме попадания в один перечень сильнейших, в переписке не сказано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0172--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0104.html\">Нуар</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t":
