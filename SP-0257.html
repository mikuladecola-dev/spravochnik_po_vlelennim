<script>const BASE="";const DOCNAME="Сверхлюди Фени";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0257-S01", "SP-0257--mehanika"], "h": "<p>Общая система сил вселенной Феня, а не отдельная способность. Задана через сравнение с другой вселенной соавторов — Оам.</p>\n<p>Ключевое свойство: «сверх силы там слабее. И в теории даже обычные человек способен победить сверхчеловека» (2025-12-09, id 394757). Обычный человек не исключён из расклада — он остаётся возможным противником сверхчеловека.</p>\n<p>Причина, по которой сделано именно так, названа прямо и является авторской, а не внутримировой: «Из-за легче развивать отношения людей. Просто в Оам все чё-то слишком сильный. Да и Оам Вселенная большая как боевик» (id 394757). Феня описана как «лёгкая вселенная» в противопоставление Оам.</p>\n<p>Природа носителей: сверхлюди Фени — люди. На вопрос Миколая, «они полу люди или люди мутанты» (id 394799), ответ Славы — «Они люди» (id 394808). Не полулюди и не мутанты.</p>\n<p>Потомство: на вопрос «а они меж собой могут иметь потомство» (id 394798) ответ утвердительный по итогу разбора; способность наследуется или нет — не сказано.</p>\n<p>Психика: сверхлюди обмануты Отцом, и при этом их психика в порядке — это зафиксировано как отдельное свойство, отличающее их от типового сюжета о сломанных сверхлюдях.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0257-S02", "SP-0257--ogranicheniya-i-cena"], "h": "<p>Ограничение системное: сила сверхчеловека не даёт гарантированного превосходства над обычным человеком. Конкретных механик, цен или откатов в переписке нет.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0257-S03", "SP-0257--nositeli"], "h": "<p>Сверхлюди Фени как класс. Поимённо в этом окне носители не перечислены.</p>\n<p>Все они находятся в положении обманутых: «Феня. Идеально описывает всех сверхлюдей. Их наебали» (2025-12-09, id 394753) — то есть само слово «феня» здесь работает как определение состояния сверхлюдей, а не только как имя вселенной. Механика обмана вынесена в отдельную запись — контракт на «души» (<a href=\"SP-0256.html\">Контракт на «души»</a>), заключённый с ними Отцом.</p>", "r": [["Контракт на «души»", "SP-0256.html"]]}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0257-S04", "SP-0257--kak-menyalas-po-versiyam"], "h": "<p><strong>2025-12-09, версия 1 (id 394753–394757).</strong> Заявлено, что сверхлюди обмануты. Даётся история происхождения вселенной: она «появилась лишь потому что я пытался тот образ гг сделать в настоящим», а «после она просто стало лёгкая вселенная». Отсюда — ослабленные сверхсилы и возможность победы обычного человека над сверхчеловеком.</p>\n<p><strong>2025-12-09, версия 2 (id 394798–394809).</strong> Уточнена природа сверхлюдей: они люди, не полулюди и не мутанты, могут иметь потомство между собой. В этой же части разговор уходит к Отцу: «Ну духовные отец. Папа приёмный» (id 394803), «Отец уважает отца» (id 394809).</p>\n<p>Между версиями противоречий нет — вторая уточняет первую.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0257-S05", "SP-0257--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Контракт на «души» (<a href=\"SP-0256.html\">Контракт на «души»</a>) — механика, которой сверхлюди Фени обмануты Отцом.</p>", "r": [["Контракт на «души»", "SP-0256.html"]]}, {"t": "Пробелы", "a": ["S06", "SP-0257-S06", "SP-0257--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Конкретные сверхспособности сверхлюдей не перечислены.</li>\n<li>Не сказано, откуда берётся сверхсила и передаётся ли она потомству.</li>\n<li>Не названо, сколько сверхлюдей и как они организованы.</li>\n<li>Не разобрано, в чём именно состоял обман с их стороны восприятия — только со стороны механики контракта.</li>\n<li>Не сказано, чем именно ослаблены силы количественно и есть ли верхняя граница.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0257--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0256.html\">Контракт на «души»</a></li>\n<li><strong>Упомянут в способностях:</strong> <a href=\"SP-0256.html\">Контракт на «души»</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0080.html\">Сверхлюди (Феня)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0257--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-12-09</td>\n<td>394753–394757</td>\n<td>w0113</td>\n<td>Феня (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-09</td>\n<td>394798–394809</td>\n<td>w0113</td>\n<td>Феня (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0257-sverhlyudi-feni.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0257--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0257.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
