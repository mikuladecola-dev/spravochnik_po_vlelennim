<script>const BASE="";const DOCNAME="Деревня в «Закате»";
const LEAD="";
const CH=[{"t": "Где находится", "a": ["S01", "MN-0026-S01", "MN-0026--gde-nahoditsya"], "h": "<p>Вселенная не определена — в карточке стоит «неясно». Место входит в историю «Закат» (2025-11-21, окно w0111, id 387600–387602). Географической привязки в переписке нет: сказано только, что это деревня, и что небо над ней «не закрывает дым или многоэтажки» (id 387600).</p>\n<p>Пространство разделено на две части, и граница между ними — забор участка рассказчика. Внутри — двор и дом. Снаружи, «за нерушимом забором была не просто деревня. Там был хаус, страх и ужас» (id 387601).</p>", "r": []}, {"t": "Что собой представляет", "a": ["S02", "MN-0026-S02", "MN-0026--chto-soboy-predstavlyaet"], "h": "<p><strong>Участок рассказчика.</strong> Описан как обычный: «Двор, как двор. Деревянная баня, трава, которая уже по колено. Огородик, на котором росли кусты и сорняки. И сиротливый топор, который лежал на траве, а вокруг него пару дровишек» (id 387601). Топор лежит там потому, что днём герой хотел затопить баню и начал рубить дрова, но бросил из-за жары. Есть дом с кухней (кухонная мебель, «столики и гарнитуры, в которых хранится посуда»), крыльцо, окно, из которого виден закат, и калитка.</p>\n<p><strong>Погода и время суток.</strong> Действие — на закате: «Словно горизонт горит, ярко-красным со смесью оранжевого огня»; позже, когда солнце садится ниже, «теперь горизонт был больше ало-красным». Днём жара «почти достигала 40 градусов» (id 387600–387601).</p>\n<p><strong>Деревня за забором.</strong> Там бегают «месива без кожи» и лежат трупы деревенских. Главная характеристика места — звук: «Было слышно множества криков, что переплетались в один. Этот крик был неутихаем. И вряд ли он утихнет. Пока всё живой, не погибнете в этой деревне». И дальше: страшны не существа и не трупы, а крики, «Что резали словно нож. И резали они не тела, а что-то первобытное. Что-то, что осталось у каждого человека от предков» (id 387601).</p>\n<p>Забор назван нерушимым; на момент фрагмента ничто снаружи внутрь участка не проникает, кроме одного существа, которое уже находится в доме.</p>", "r": []}, {"t": "Что с ним связано", "a": ["S03", "MN-0026-S03", "MN-0026--chto-s-nim-svyazano"], "h": "<p>Предметы, оказавшиеся значимыми внутри места:</p>\n<ul>\n<li><strong>Кухонный нож</strong> — не срабатывает: «Кухонный нож делают тонким. Поэтому если попытаться ударить человека. То он просто прогнëтся». По итогу драки нож прогнут и выброшен.</li>\n<li><strong>Сковородка</strong> — срабатывает: удар в затылок сбивает существо с ног, второй удар по голове её вскрывает.</li>\n<li><strong>Топор</strong> во дворе — герой берёт его, когда идёт к калитке.</li>\n<li>В карманах у героя телефон, ключи, кошелёк и мятные конфеты; сигарет нет, потому что он «как бы начал бросать курить».</li>\n</ul>\n<p>Отдельно зафиксировано наблюдение про удушение: «Невозможно задушить человека, вот так. Ведь он как бы не бездушная кукла. Он будет рыпаться, облеваться потом».</p>", "r": []}, {"t": "Персонажи и события", "a": ["S04", "MN-0026-S04", "MN-0026--personazhi-i-sobytiya"], "h": "<p><strong>Рассказчик «Заката».</strong> Ведёт повествование от первого лица. В начале стоит у окна и смотрит на закат; отмечает, что закат по-прежнему красив, хотя «давно перестали все называть красивым» и «в стихах и в книгах. Я давно перестал видеть строки о красивом закате».</p>\n<p><strong>Существо без кожи («кусок мяса»).</strong> Жилистый мужчина без кожи, носа и ушей; пол определяется по гениталиям. Из отверстия на месте носа и рта вытекает жидкость — «То рывками, то медленно», на вдохе меньше, на выдохе «словно под давлением вылетает». Дыхание булькающее. Атакует вяло и медленно, промахивается, врезается в кухонную мебель. Крови у него в привычном виде нет: из глазниц бьёт струя, которая «была жёлтым и словно сопли липкими и тягучий», на вкус кислая, «с прикусом прокисшего молока». В конце от удара сковородкой голова «словна лопнула», и из неё летят кровь и розовые куски.</p>\n<p><strong>Ход событий во фрагменте.</strong> Драка на кухне: нож в глаза, попадание жидкости в рот рассказчика, попытка задушить, бросок в кухонный гарнитур, удары сковородкой, смерть существа. Затем — выход на крыльцо, поиск сигарет, конфета, осмотр двора, мысль о том, что назавтра труп на жаре начнёт вонять и «трупы. От жары надуваются и лопаются». В финале фрагмента рассказчик идёт к калитке, по дороге берёт топор и с ним выходит с участка.</p>\n<p>Отдельной строкой в этом же наборе сообщений отмечено, что живого человека внутри деревни герой не встречает; за забором — только существа и трупы деревенских.</p>", "r": []}, {"t": "Как менялся по версиям — по датам", "a": ["S05", "MN-0026-S05", "MN-0026--kak-menyalsya-po-versiyam"], "h": "<p>Версия одна, 2025-11-21 (окно w0111, id 387600–387602). Последним сообщением набора идёт пометка «Черновики» (id 387602) — то есть материал помечен автором как черновой.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "MN-0026-S06", "MN-0026--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Откуда взялись существа и что вообще происходит в деревне — не объяснено (отмечено как неясность в самом окне).</li>\n<li>Название деревни, её расположение и вселенная не названы.</li>\n<li>Что произошло после выхода за калитку — во фрагменте нет.</li>\n<li>Сколько существ в деревне, есть ли выжившие, чьи именно крики слышны — не сказано.</li>\n<li>Связь с другими местами и вселенными в переписке не устанавливалась.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MN-0026--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0320.html\">Рассказчик «Заката»</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MN-0026--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-11-21</td>\n<td>387600–387602</td>\n<td>w0111</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/monumenty/MN-0026-derevnya-v-zakate.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MN-0026--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MN-0026.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
