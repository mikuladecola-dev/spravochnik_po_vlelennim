<script>const BASE="";const DOCNAME="Истории про Максима";
const LEAD="";
const CH=[{"t": "Содержание", "a": ["S01", "IS-0055-S01", "IS-0055--soderzhanie"], "h": "<p>Текст от первого лица — пролог к серии историй про Максима. Скинут Славой одним сообщением (2025-05-06, id 323934) в окне w0091.</p>\n<p>Пролог открывается рассуждением о попытках и опыте: «Каждая попытка новый старт. Каждый новый старт это накопительный опыт. А опыт очень важен. Нельзя его вот так, просто бросить. Хотя есть множество опытов, который ты желаешь не получать». У рассказчика такой опыт есть — «Опыт страшный и мерзкий. Словно липкий и склизкий черви ползут по лёгким. По сердце и поедают мозг». Опыт был забыт и вспомнился заново — «Во сне который пробудил во мне все эти страхи и волнения». Рассказчик называет свой текст так: «Это моё откровения. Моя истина, который может быть лишь бредом».</p>\n<p>Дальше начинается собственно завязка: «Однажды я решил пойти в поход. Нет, не один решил пойти я. Нас тогда было шесть людей. Жалкая горстка людей, по сравнению с угрозой. С той угрозой......». Рассказчик обрывает сам себя, замечая, что нельзя начать с начала, а потом переключиться на середину, и обещает больше так не делать — он хочет, чтобы читатель «хоть на долю почувствовали ту горечь и отчаяние».</p>\n<p>Основная сцена пролога — спор рассказчика с его лучшим другом Андреем, «который привык делать всё наоборот», о том, зачем Андрей позвал в поход Максима. Рассказчик уже ходил с Максимом в поход и «ноги стёр до крови». Своё объяснение он даёт так: «да потому-что это чупакабра шустрая, быстрая и ловкая. Скачет туда сюда. Бегает то на гору то на речку то на дерева. И мы пытаясь за ним поспевать. Ноги содрали». Рассказчик называет себя атлетом и спортсменом, который за Максимом не поспел, а Андрея — «дохляк».</p>\n<p>Отдельно в споре проговаривается разница между тем, как рассказчика гонял летом дед, и тем, как гоняет Максим: «Дед гонял меня зная мои пределы. А Максим гонял пытаясь найти свои пределы».</p>\n<p>Далее рассказчик перечисляет, чем ещё был плох прошлый поход с Максимом: Максим «Зачем-то мишку сука спер, у медведицы» — и всей группе пришлось убегать по лесу от медведицы; Максим уговорил их залезть в пещеру, откуда потом два дня не могли выйти; всю дорогу ловил лису. Андрей на это реагирует не по существу спора: «аааа вот откуда у него дома медведь, а лису то я не видел?». Рассказчик признаёт, что лису Максим поймал и съел — «Живодер хренов. Но суп вышел вкусный».</p>\n<p>Сцена заканчивается репликой Андрея «ну конечно. Он же Максим, совершённый во всём» — он кладёт руку рассказчику на плечо — и словами рассказчика: «ладно давай уже пошли. Собираться в поход».</p>\n<p>Из пролога следует, что дальше история должна была вести к «той угрозе», против которой шесть человек — «жалкая горстка людей», и к пещере; но продолжения в переписке нет.</p>", "r": []}, {"t": "Персонажи", "a": ["S02", "IS-0055-S02", "IS-0055--personazhi"], "h": "<ul>\n<li><strong>Рассказчик историй про Максима</strong> — говорит от первого лица, атлет и спортсмен, ходил с Максимом в поход раньше. Имя в тексте не названо.</li>\n<li><strong>Андрей</strong> — лучший друг рассказчика, «который привык делать всё наоборот». Именно он позвал Максима в поход. Считает Максима «совершённым во всём».</li>\n<li><strong>Максим</strong> — герой, вокруг которого строятся истории. Сам в прологе не появляется, показан только через рассказ о прошлом походе: быстрый, неутомимый, «чупакабра», украл медвежонка у медведицы, затащил группу в пещеру, поймал и съел лису; дома у него есть медведь.</li>\n</ul>\n<p>В поход, по тексту, шли шесть человек; остальные трое не названы.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "IS-0055-S03", "IS-0055--mesto-vo-vselennoy"], "h": "<p>Отнесено к вселенной Нимб по дате объявления. В самой переписке вселенная не объявлена.</p>", "r": []}, {"t": "Состояние", "a": ["S04", "IS-0055-S04", "IS-0055--sostoyanie"], "h": "<p>Переписана с нуля. 2025-05-06 (id 323926–323940) Слава сообщает: «Истории про максима я удалил» — и следом «И заново пролог написал». На вопрос Миколая «зачем» отвечает: «С тем прологом я бы не смог продолжить».</p>\n<p>После того как новый текст скинут (id 323934), автор описывает соотношение старого и нового варианта тремя репликами подряд: «Изменения там не особо» (323936), «Структура та же» (323938), «Но плоть другая» (323940).</p>\n<p>Старый пролог и удалённые прежние истории про Максима в переписку не попали — есть только сообщение об их удалении.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "IS-0055-S05", "IS-0055--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Не сказано, сколько именно прежних историй про Максима было удалено и сохранились ли они где-то.</li>\n<li>Старый пролог не приведён; в чём конкретно состоит различие «плоти» при той же структуре — не разобрано.</li>\n<li>Продолжения после пролога в переписке нет.</li>\n<li>«Та угроза», против которой шесть человек — «жалкая горстка», не названа.</li>\n<li>Не названы трое остальных участников похода.</li>\n<li>Имя рассказчика не названо.</li>\n<li>Вселенная в переписке не объявлена.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["IS-0055--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-05-06</td>\n<td>323926–323940</td>\n<td>w0091</td>\n<td>Нимб (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/istorii/IS-0055-istorii-pro-maksima.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["IS-0055--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/IS-0055.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
