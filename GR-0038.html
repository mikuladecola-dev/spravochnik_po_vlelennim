<script>const BASE="";const DOCNAME="Рыболюди";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0038-S01", "GR-0038--chto-eto"], "h": "<p>Раса монстров вселенной Славы, обитающая в воде. Собственного закреплённого названия у расы в переписке нет: она существует только через словосочетания, которые авторы употребляют по ходу дела — «рыба человек», «рыбочеловек», «рыбомонстр», «рыболюди», «рыбалюди». Множественное число появляется у Миколая при описании места обитания и осведомлённости расы: «его отец плавал в месте где обитают рыболюди», «рыбалюди об этом знают» (2024-08-17, id 220213).</p>\n<p>Разведка занесла запись как группу с пометкой «раса-сообщество», и по материалу это действительно раса, а не поимённый коллектив: ни один рыбочеловек в переписке не назван по имени, не выделен как отдельная фигура и не получил реплики. В тексте фигурируют только безымянные особи — допрошенная, съеденная, сваренная, преследуемая. Поимённого состава у группы нет, и это не пробел разметки, а состояние материала.</p>\n<p>Место обитания расы названо только описательно — «место где обитают рыболюди», куда «плавал» отец будущего носителя генов. Ни названия водоёма, ни его вида (озеро, море, река) в переписке нет.</p>\n<p>Отдельно стоит отметить, что раса существует внутри общей рамки, которую Миколай проговаривает устами спасателя в 224940 (2024-08-26): «монстры - один из доменов живых существ. в ряду с бактериями, археями или эукариотами. у каждого типа свои особенности, появления, поведения. в общем целая наука». Рыболюди — один из типов внутри этого домена; прямо это в переписке не сформулировано, но раса всё время называется монстрами («рыбомонстр», «нарежем тушку рыбомонстра», «охотник пытался чет допросить одного такого монстра»).</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0038-S02", "GR-0038--sostav"], "h": "<p>Поимённых участников нет — members пуст, и это соответствует переписке. Ни одна особь расы не названа, не описана внешне и не получила характера.</p>\n<p>В тексте фигурируют следующие безымянные представители расы, каждый — в единственном эпизоде:</p>\n<ul>\n<li>Рыбочеловек, укусивший отца будущего носителя генов в ключицу (2024-08-17, id 220213). Обозначен как «кто-то из них».</li>\n<li>Рыбочеловек, которого допрашивал охотник: «охотник пытался чет допросить одного такого монстра, узнал историю и начал охоту уже на человека» (2024-08-17, id 220213).</li>\n<li>Рыбочеловек, чью голову подают узнику на тарелке: «а там сука бошка, нет не башка человека или какого либо животного. А бышка рыба человека» (2024-08-17, id 220168).</li>\n<li>«Тушка рыбомонстра», которую спасатель и писатель собираются нарезать: «ну давай вот без вопросов идём уже нарежем тушку рыбомонстра» (2024-08-26, id 224940).</li>\n<li>Рыбочеловек, за которым спасатель шёл до Ньюса и над которым ведёт тесты (2024-08-29, id 226088).</li>\n</ul>\n<p>Отождествлены ли эти особи между собой — в переписке не сказано. Голова на тарелке, тушка и объект тестов могут быть одним существом или разными; авторы этот вопрос не поднимали.</p>\n<p>К расе НЕ принадлежит <a href=\"PS-0143.html\">Человек с генами рыбочеловека</a>, человек с генами рыбочеловека. Он прямо назван человеком: «он человек, но с иммунитетом способным адаптировать клетки монстров» (2024-08-20, id 220685). Он носитель их генов, а не член расы.</p>", "r": [["Человек с генами рыбочеловека", "PS-0143.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0038-S03", "GR-0038--obschie-sposobnosti-gruppy"], "h": "<p><strong>Гены, передающиеся человеку (<a href=\"SP-0104.html\">гены рыбочеловека</a>).</strong> Основная зафиксированная черта расы — её генетический материал способен попасть к человеку и работать в нём. Механика передачи описана Миколаем в 220213 (2024-08-17): отец будущего носителя «плавал в месте где обитают рыболюди», один из них «укусил отца этого чела в ключицу, ну и в семяпроводе через кровь или молочные железы проникли гены рыбочеловека». Ребёнок «родился с генами».</p>\n<p>Что дают гены носителю, сказано через то, за чем охотник наблюдает: он «начал над ним опыты проводить и наблюдать за каннибализмом и физическими способностями». То есть гены дают физические способности и тягу к каннибализму. Точный список физических способностей не проговорён.</p>\n<p>Насколько эти же свойства присущи самим рыболюдям, а не только человеческому носителю, в переписке прямо не сказано. Косвенно о питании расы говорит спасатель: «и то, как эта ошибка природы питается этими существами так расслабляет» (2024-08-29, id 226088) — рыбочеловек питается другими существами; какими именно — «этими существами» — не уточнено.</p>\n<p><strong>Постоянная гипермедленная регенерация (<a href=\"SP-0111.html\">гипермедленная регенерация</a>).</strong> Зафиксирована в 226088 (2024-08-29): «суп из него такой ароматный, постоянная гипермедленная регенерация даже в варёном состоянии это райское наслаждение для моих очей». Ключевое свойство — регенерация не прекращается, когда рыбочеловек сварен. Скорость её обозначена самим названием: гипермедленная. Ни предела восстановления, ни того, может ли рыбочеловек восстановиться из сваренного состояния целиком, в переписке нет — сказано только, что процесс продолжается и наблюдаем.</p>\n<p><strong>Осведомлённость расы.</strong> Рыболюди знают о существовании человека, родившегося с их генами: «так вот чел родился с генами, рыбалюди об этом знают» (2024-08-17, id 220213). Как они узнали и что делают с этим знанием — не сказано; никаких их действий по отношению к носителю в переписке нет.</p>\n<p><strong>Съедобность.</strong> Из рыбочеловека варят суп, и суп «ароматный»; тушку нарезают; голову подают на тарелке. Отдельно узник в истории Славы заявляет готовность «полностью сожрать того рыба человека» (2024-08-17, id 220168).</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · С чего начать — не материал авторов</b>\n<p>Сводить: <code>PS-0145</code> (17,3 КБ) — сюда; <code>PS-0144</code> (спасатель, 51 КБ) — оттуда вычитывать всё про расу, потому что все пять эпизодов расы приходят через него; <code>PS-0143</code> (19 КБ) — граница «носитель не член расы»; три способности — <code>SP-0104</code>, <code>SP-0107</code>, <code>SP-0111</code> — по 2–4 КБ каждая, и все три висят на одном непринятом черновике.</p></div>", "r": [["гены рыбочеловека", "SP-0104.html"], ["гипермедленная регенерация", "SP-0111.html"]]}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0038-S04", "GR-0038--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p>Материала нет: ни одна особь не отличена от другой ни по способностям, ни по внешности, ни по роли. Все упоминания расы одинаковы по содержанию.</p>\n<p>Единственный различительный признак, который вообще появляется рядом с расой, относится не к рыболюдям: допрошенный монстр знает историю про укус и носителя генов, тогда как о знании остальных сказано только общим «рыбалюди об этом знают». Отдельной характеристикой особи это в переписке не оформлено.</p>", "r": []}, {"t": "Иерархия", "a": ["S05", "GR-0038-S05", "GR-0038--ierarhiya"], "h": "<p>Об иерархии внутри расы в переписке не сказано ничего: ни вожака, ни старших, ни разделения ролей.</p>\n<p>Есть высказывание, сделанное про домен монстров целиком, а не про рыболюдей отдельно (2024-08-26, id 224940, реплика спасателя): «нет у них никакого предводителя, их(существов) слишком много и нормально все живут вместе». Там же о социальном устройстве монстров: «а они более социальные существа, даже не социум у них, а более сложное явление, которое я не понимаю». Распространяется ли это на рыболюдей — в переписке не сказано; сами рыболюди в этом разговоре не упоминаются.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S06", "GR-0038-S06", "GR-0038--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>Со спасателем (<a href=\"PS-0144.html\">спасатель</a>, он же Киппер, охотник на нечисть).</strong> Отношения односторонние: он на них охотится, ест их и ставит на них опыты.</p>\n<ul>\n<li>Он допрашивал одного из них и через этот допрос вышел на человеческого носителя генов: «охотник пытался чет допросить одного такого монстра, узнал историю и начал охоту уже на человека» (2024-08-17, id 220213). То есть рыболюди — источник информации, с которого началась охота на <a href=\"PS-0143.html\">Человек с генами рыбочеловека</a>.</li>\n<li>Он подаёт голову рыбочеловека узнику как еду (2024-08-17, id 220168). Именно этот эпизод заставляет узника переопределить похитителя: «здесь я уже начал понимать что это не просто псих а какое то охотник на нечисть».</li>\n<li>Он нарезает тушку рыбомонстра вместе с писателем (2024-08-26, id 224940).</li>\n<li>Он преследовал рыбочеловека до Ньюса (<a href=\"MN-0006.html\">Ньюс</a>) и держит его для исследований (2024-08-29, id 226088). Цель исследования названа точно: «после 56 тестов я смогу с уверенностью определить его возможности, его днк и другие данные». Вычислениями должен заняться писатель — «тот паренёк займётся вычислениями пока не надоест, деньги сможет с глубин интернета собрать на исследование».</li>\n<li>Мотив спасателя по отношению к монстрам вообще: «эти твари мои враги и я их же использую для мести» (2024-08-26, id 224940) и «эти изверги, я ненавижу их. их не останется ни одного» (2024-08-29, id 226088). Рыболюди в этом счёте не выделены — они часть общего списка на истребление.</li>\n</ul>\n<p><strong>С человеком с генами рыбочеловека (<a href=\"PS-0143.html\">Человек с генами рыбочеловека</a>).</strong> Связь генетическая и односторонняя: он несёт их гены, они об этом знают. Никакого контакта между ним и расой в переписке не описано.</p>\n<p><strong>С людьми вообще.</strong> Отдельно о рыболюдях не сказано. О монстрах в целом спасатель говорит (2024-08-26, id 224940): «их инстинкт говорит прятаться от людей, но от людей они сильно зависят, как и люди от них, они связаны ментальными сигналами, но обычно это никак не отражается» и «иногда их отклонения доходят до вмешательства в жизнь людей, тогда их судьбу обречена, общество их не примет». Применительно к рыболюдям это не проговаривалось.</p>\n<p><strong>С Ньюсом (<a href=\"MN-0006.html\">Ньюс</a>).</strong> Локация, до которой спасатель шёл за рыбочеловеком. Что это за место, чем оно связано с расой, живут ли рыболюди там или только оказались — не описано. В переписке Ньюс упоминается один раз.</p>", "r": [["спасатель", "PS-0144.html"], ["Человек с генами рыбочеловека", "PS-0143.html"], ["Ньюс", "MN-0006.html"]]}, {"t": "Как менялась — по датам", "a": ["S07", "GR-0038-S07", "GR-0038--kak-menyalas"], "h": "<p><strong>2024-08-17, вечер (id 220167–220168, окно w0053).</strong> Раса появляется внутри истории Славы «История про похищение (записки узника)» (<a href=\"PR-0027.html\">История про похищение (записки узника)</a>) одной деталью — головой на тарелке. Узник шесть месяцев сидит в заключении на супе и каше, потом ему приносят накрытую тарелку: «Поднял крышку, а там сука бошка, нет не башка человека или какого либо животного. А бышка рыба человека». Дальше он сам себе объясняет, чем эта еда была раньше: «После рыба, ну или что то похожей на рыбу». На этом этапе рыболюди — не раса и не сообщество, а единичный элемент реквизита: существует нечто, что можно убить и подать как блюдо. Множественного числа ещё нет.</p>\n<p><strong>2024-08-17, 23:14 (id 220209–220220, окно w0053).</strong> Миколай, разбирая историю, разворачивает единичного рыбочеловека в расу с местом обитания. Здесь появляется всё разом: рыболюди во множественном числе, их водное место обитания, механика передачи генов, факт их осведомлённости и допрос одного из них охотником. Формулировка целиком: «тогда может это чел который имеет гены рыбочеловека? типа, его отец плавал в месте где обитают рыболюди, кто-то из них кончил, но это в твоей вселенной кринж, ток что укусил отца этого чела в ключицу, ну и в семяпроводе через кровь или молочные железы проникли гены рыбочеловека».</p>\n<p>Миколай тут же оговаривает статус собственного предложения как чернового и передаёт его Славе: «мне похуй насколько это реалистично, такой концепт интересен и можно его запихнуть сюда, ты сможешь доработать может если не нравится». Ответа Славы с доработкой в переписке нет — на следующей реплике он спрашивает про похитителя.</p>\n<p>Отклонённый вариант, зафиксированный прямо в момент отклонения: передача генов через зачатие. Миколай проговаривает его и сам отбрасывает по несовместимости со вселенной Славы — «кто-то из них кончил, но это в твоей вселенной кринж, ток что укусил отца этого чела в ключицу». Укус выбран как замена.</p>\n<p>Здесь же охотник опознан: на вопрос Славы «Кто похититель ?» Миколай отвечает «ясен хуй спасатель» и добавляет «он же ебанутый на голову».</p>\n<p><strong>2024-08-20 (id 220649–220650, 220678–220690, окно w0054).</strong> Раса напрямую не упоминается, но её след появляется в мире через новость по телевизору: эфир церемонии сменяется «новостью о задержании похитителей человека с рыбьей мутацией». То есть существование носителя генов становится публичным фактом внутри вселенной, а сама мутация в новостном языке названа «рыбьей».</p>\n<p>В этот же день на прямой вопрос Славы «Он человек?» (Слава добавляет: «Я в свой истории про это не писал поэтому сам не знаю») Миколай отвечает: «он человек, но с иммунитетом способным адаптировать клетки монстров. тобиж если к нему пришьют органы монстра он не умрёт» (<a href=\"SP-0107.html\">иммунитет, адаптирующий клетки монстров</a>). Это ответ о носителе, а не о расе, но он проводит границу: носитель к расе не причислен.</p>\n<p><strong>2024-08-26, 11:30 (id 224940, окно w0055).</strong> Раса возвращается одной фразой в конце большого диалога: «ну давай вот без вопросов идём уже нарежем тушку рыбомонстра и телефон парню зарядим, посмотрим, что сегодня напишет». Появляется третий вариант названия — «рыбомонстр». Тело рыболюдей закреплено как расходный материал: тушку нарезают буднично, между делом.</p>\n<p><strong>2024-08-29, 17:35 (id 226088, окно w0055).</strong> Самое подробное описание расы за всю переписку, внутри этюда о повседневности спасателя. Здесь добавляются сразу три свойства: вкус («суп из него такой ароматный»), регенерация («постоянная гипермедленная регенерация даже в варёном состоянии») и способ питания («и то, как эта ошибка природы питается этими существами так расслабляет»). Тогда же появляется Ньюс как точка преследования — «я же вообще за рыбочеловеком шел до Ньюса» — и программа исследования на 56 тестов.</p>\n<p>Сам Миколай в тот же вечер обозначил задачу текста: «один из повседневности спасателя», «хотел характер раскрыть» (id 226094–226095). То есть подробности о рыболюдях появились попутно, как фон для персонажа, а не как отдельная проработка расы. Слава в ответ потребовал описывать вводимое: «Если добавляеш надо хотя бы описывать А то нехуя не ясна» (id 226108) — но замечание относилось к векторному шару, не к рыболюдям.</p>\n<p>После 2024-08-29 раса в переписке не появляется.</p>", "r": [["иммунитет, адаптирующий клетки монстров", "SP-0107.html"], ["История про похищение (записки узника)", "PR-0027.html"]]}, {"t": "Пробелы", "a": ["S08", "GR-0038-S08", "GR-0038--probely"], "h": "<div class=\"gaps\"><ul>\n<li><strong>Поимённого состава нет.</strong> Ни один рыбочеловек не назван и не описан как отдельное существо.</li>\n<li><strong>Названия расы нет.</strong> Все обозначения — рабочие словосочетания авторов; ни Слава, ни Миколай названия не закрепляли.</li>\n<li><strong>Место обитания не названо.</strong> Есть только «место где обитают рыболюди». Тип водоёма не указан.</li>\n<li><strong>Внешность не описана.</strong> Известно лишь, что у существа есть голова, помещающаяся на большую тарелку, и что узник опознаёт её как «бышку рыба человека», а еду до этого определяет как «рыба, ну или что то похожей на рыбу». Ничего больше.</li>\n<li><strong>Точный список физических способностей не проговорён</strong> — сказано только, что охотник наблюдает «каннибализм и физические способности» у носителя генов.</li>\n<li><strong>Не сказано, есть ли у самих рыболюдей те же каннибализм и физические способности,</strong> что у человеческого носителя; свойства перечислены применительно к нему.</li>\n<li><strong>Чем именно они питаются</strong> — «этими существами», без расшифровки.</li>\n<li><strong>Иерархии, вожака, устройства сообщества нет.</strong> Общие слова спасателя об отсутствии предводителя относятся к домену монстров целиком.</li>\n<li><strong>Отношений расы к спасателю, к людям и к носителю их генов нет</strong> — все связи описаны только со стороны спасателя. Как рыболюди реагируют на охоту, знают ли о ней, что делают со знанием о носителе — осталось нерешённым.</li>\n<li><strong>Не отождествлены между собой</strong> голова на тарелке, тушка, допрошенный монстр и объект 56 тестов.</li>\n<li><strong>Численность расы не названа.</strong></li>\n<li><strong>Связь с <a href=\"PS-0131.html\">Тварь (человек-рыба из озера)</a></strong> («Тварь», человек-рыба из озера, 2024-08-08, id 215834, окно w0050), из которого в конце истории «ещё штук 30 твари вылазит», в переписке не проведена. Авторы нигде не сказали, что озёрная тварь и рыболюди — одно и то же, поэтому в состав она не внесена.</li>\n<li><strong>Судьба чернового статуса концепта.</strong> Миколай отдал его Славе на доработку («ты сможешь доработать может если не нравится»), Слава ответа по существу не дал. Приняты ли гены и укус как канон вселенной — в переписке не сказано.</li>\n<li><strong>Результат 56 тестов</strong> и вообще исход исследования рыбочеловека не показаны.</li>\n</ul></div>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Третье, дешевле, но заметно: <code>PS-0131</code> («Тварь», человек-рыба из озера) — две ссылки, 7 КБ. Статья честно не сводит её с расой, потому что авторы не сводили. Но именно там единственное число рядом с водяными существами — «ещё штук 30 твари вылазит», — а численность расы стоит в пробелах.</p></div>", "r": [["Тварь (человек-рыба из озера)", "PS-0131.html"]]}, {"t": "Связи — всё вместе", "a": ["GR-0038--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0131.html\">Тварь (человек-рыба из озера)</a>, <a href=\"PS-0143.html\">Человек с генами рыбочеловека</a>, <a href=\"PS-0144.html\">спасатель</a></li>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0104.html\">гены рыбочеловека</a>, <a href=\"SP-0107.html\">иммунитет, адаптирующий клетки монстров</a>, <a href=\"SP-0111.html\">гипермедленная регенерация</a></li>\n<li><strong>Упоминает монументы:</strong> <a href=\"MN-0006.html\">Ньюс</a></li>\n<li><strong>Упоминает прозу:</strong> <a href=\"PR-0027.html\">История про похищение (записки узника)</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0038--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0038.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0038-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0038/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым чинить раздвоение самой расы. У этой статьи (<code>GR-0038</code>) собственной базы 0 и ноль входящих ссылок, а параллельная запись <code>PS-0145</code> — «рыболюди», заведённая как персонаж, — держит 17,3 КБ материала и две входящие ссылки. То есть весь материал расы лежит под персонажным id, а разбор расы — здесь, и связи между ними нет. Кто пойдёт по ссылке на рыболюдей из <code>PS-0143</code> или <code>PS-0144</code>, до этой статьи не доберётся. Это дороже любого сюжетного пробела: пока не сведено, любое дополнение придётся вносить дважды.</p>\n<p>Второе — <code>SL-0013</code>, «Список персонажей Славы»: две ссылки, статьи нет, 10 КБ базы, вселенные «монстры» и «Цветной мир». Это самая крупная запись вселенной «монстры» без статьи и единственное место, где закреплённое название расы вообще могло бы обнаружиться — статья справедливо пишет, что названия нет, но проверено ли это по <code>SL-0013</code>, из статьи не видно.</p>\n<p>Третье, дешевле, но заметно: <code>PS-0131</code> («Тварь», человек-рыба из озера) — две ссылки, 7 КБ. Статья честно не сводит её с расой, потому что авторы не сводили. Но именно там единственное число рядом с водяными существами — «ещё штук 30 твари вылазит», — а численность расы стоит в пробелах.</p>\n<h3>С чего начать</h3>\n<p>Всё в базе, в архив идти почти не за чем.</p>\n<p>Сводить: <code>PS-0145</code> (17,3 КБ) — сюда; <code>PS-0144</code> (спасатель, 51 КБ) — оттуда вычитывать всё про расу, потому что все пять эпизодов расы приходят через него; <code>PS-0143</code> (19 КБ) — граница «носитель не член расы»; три способности — <code>SP-0104</code>, <code>SP-0107</code>, <code>SP-0111</code> — по 2–4 КБ каждая, и все три висят на одном непринятом черновике.</p>\n<p>Проверить по <code>SL-0013</code> — есть ли название.</p>\n<p>В архив стоит идти за двумя точками. Первая: 2024-08-08, id 215834 (окно w0050) — озёрная тварь и «штук 30». Это на девять дней раньше первого рыбочеловека, и вопрос не в том, одно ли это существо (авторы не сказали, и выдумывать нечего), а в том, обсуждали ли они озёрную тварь между 8 и 17 августа — тогда ясно, помнил ли Миколай про неё, когда разворачивал расу. Вторая: всё после 2024-08-29 17:35 (226088). Статья утверждает, что раса больше не появляется; это утверждение об отсутствии, и его дешевле подтвердить один раз, чем возвращаться.</p>\n<h3>Как развивалось</h3>\n<p>Заявили с конца. 2024-08-17 вечером раса появляется как реквизит — голова на тарелке, единственное число, никакой расы ещё нет. Тем же вечером в 23:14 Миколай разворачивает её в расу разом: место обитания, укус, гены, осведомлённость, допрос охотником — всё в одной реплике. Ограничили сразу же и сам автор: «мне похуй насколько это реалистично... ты сможешь доработать может если не нравится» — концепт помечен как черновик и передан Славе. Слава по существу не ответил, следующей репликой спросив про похитителя.</p>\n<p>Дальше раса не разрабатывается, а обслуживает других: 2024-08-20 — след в новостях («рыбья мутация»), но речь о носителе; 2024-08-26 — одна фраза, тушку нарезают между делом; 2024-08-29 — самое подробное описание за всю переписку, и оно приходит внутри этюда о характере спасателя, что Миколай в тот же вечер и проговаривает: «один из повседневности спасателя», «хотел характер раскрыть». После 2024-08-29 не возвращались.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Про генетическую передачу правило проведено в одну сторону и подробно: гены рыболюдей попали в человека, дают физические способности и каннибализм, а сам человек при этом остаётся человеком — «он человек, но с иммунитетом способным адаптировать клетки монстров».</p>\n<p>Отдельно, уже про саму расу, названо свойство совсем другого порядка: регенерация не прекращается даже в варёном состоянии. Это единственное собственное свойство расы, зафиксированное прямо.</p>\n<p>И вот оно к носителю не приложено никак. Все прочие свойства расы через гены к нему перешли и перечислены, а вопрос, работает ли у него та же регенерация — при том что он под пятьюдесятью шестью тестами именно на предмет «его возможности, его днк», — не задан ни разу. Для расы правило названо, для соседнего случая того же ряда — нет.</p>\n<h3>Отклик</h3>\n<p>Сильное здесь — то, что вся раса известна с одной стороны стола. Место обитания названо через отца, который туда плавал. Существование расы установлено через голову на тарелке. Биология — через суп: «суп из него такой ароматный, постоянная гипермедленная регенерация даже в варёном состоянии это райское наслаждение для моих очей». Ключевое свойство целого вида открыто через кулинарию, и открыл его тот, кто их ест. Ни одной реплики, ни одного имени, ни одного взгляда с их стороны — только рецепт, тушка и 56 тестов. Не уверен, что это задумано, но эффект настоящий: раса существует ровно в объёме того, что с ней сделали. И отдельно понравилась строчка «кто-то из них кончил, но это в твоей вселенной кринж, ток что укусил» — человек придумывает, отвергает и правит собственную идею в пределах одного предложения, не останавливаясь.</p></div>", "r": []}];</script>
