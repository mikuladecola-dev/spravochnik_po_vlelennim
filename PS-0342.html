<script>const BASE="";const DOCNAME="Пришельцы";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0342-S01", "PS-0342--proishozhdenie"], "h": "<p>Старая линия пришельцев, придуманная авторами вдвоём и с самого начала существовавшая в виде картинок от нейросети. Миколай напомнил: «ну помниш давно ещё просил нейронку нарисовать пришельцев» (2025-12-17, id 399319).</p>\n<p>Авторство разделено репликой Миколая (399332–399334): «ну это было в целом по моим идеям, ты дополнял, но я кидал первые запросы», «если полистаешь видно будет», «которые нейронка писала». Слава на это ответил «Ну я тоже помню» (399336).</p>\n<p>Сами авторы сравнивают получившееся с «Бен 10»: увидев картинку, Слава написал «Бля это кто» и «Это типа Бен 10» (399310–399312).</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0342-S02", "PS-0342--vneshnost"], "h": "<p>Описания, которые Слава восстановил по памяти 2025-12-17 вечером, глядя на новые картинки. По его словам, этих деталей в запросах к нейросети не было, — Миколай подтвердил: «аа, ну я тогда в описание не кидал это» (399327).</p>\n<p><strong>Летающий</strong> (399324): «Плюсом у летающего. Я говорил на плечах три отверстия с каждой стороны откуда тентакли вылетают с острым концом».</p>\n<p><strong>Пузырик</strong> (399325): «И это пузырик я говорил выглядит подобно медузи».</p>\n<p>Про остальных на картинках Слава сказал: «Это я вообще хуй знает кто» (399326).</p>\n<p>Общая оценка новых картинок против старых, от Славы: «Ну там они выглядели круче что-ли» (399321).</p>", "r": []}, {"t": "Как менялся", "a": ["S03", "PS-0342-S03", "PS-0342--kak-menyalsya"], "h": "<p><strong>2025-12-17, 12:23 (id 399151–399184).</strong> Миколай прогнал тех же самых пришельцев через две новые модели генерации картинок и сравнил результаты: «я проиестил 2 новые модели на тех же пришельцах. мне нравится как сейчас делают. возможно лучше. а вот если сравнивать между этими я хз даже. вторая будто больше на массового пользователя работает, а первая на науку. но может я выдумываю» (399151). Слава в этот момент был занят зачётками и ответил «Ну жди» (399167, 399174). Сам облик пришельцев в этой версии не обсуждался — только качество генерации.</p>\n<p><strong>2025-12-17, 18:37–18:43 (id 399310–399337).</strong> Слава посмотрел картинки, не опознал часть персонажей и восстановил по памяти те детали облика, которых не было в запросах: отверстия и тентакли у летающего, медузоподобность пузырика. Тут же уточнено авторство линии.</p>\n<p>Изменения самих пришельцев между этими двумя моментами в переписке не зафиксировано: менялись модели-генераторы, а не задумка.</p>", "r": []}, {"t": "Пробелы", "a": ["S04", "PS-0342-S04", "PS-0342--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вселенная не названа. Отнесение к Фене сделано по дате объявления, а не по прямому указанию авторов.</li>\n<li>Часть пришельцев на картинках авторы сами не опознают («Это я вообще хуй знает кто»).</li>\n<li>Сколько всего пришельцев и как они называются — в переписке не сказано; поимённо звучат только «летающий» и «пузырик», причём это описательные обозначения, а не имена.</li>\n<li>Способности не названы: у летающего упомянуты тентакли с острым концом как часть облика, но что они делают, не сказано.</li>\n<li>Никаких связей с другими персонажами, историями или сюжетом в переписке нет.</li>\n<li>Какие именно две модели тестировал Миколай, не названо.</li>\n<li>Что стало с линией дальше, не сказано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0342--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0082.html\">Пришельцы (линия Фени)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0342--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-12-17</td>\n<td>399151–399184</td>\n<td>w0114</td>\n<td>Феня (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2025-12-17</td>\n<td>399310–399337</td>\n<td>w0114</td>\n<td>Феня (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0342-prishelcy.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0342--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0342.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
