<script>const BASE="";const DOCNAME="Ад";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0096-S01", "MR-0096--ustroystvo"], "h": "<p>Ад — один из миров вселенной «Апостол», введённый Славой при первом изложении общего мироустройства (2025-01-06, id 278852). Иерархия миров задана по размеру: «Вот есть наш мир будем называть \"Вселенной\" и этот мир самый большой», далее — «На втором месте по размеру это \"рай\" и \"ад\"», и ниже — «множество минимиров». Наш мир появился первым и является самым большим; все прочие миры, «будь то \"рай\" или \"ад\" или минимиры», всегда связаны с ним именно поэтому.</p>\n<p>На уточняющий вопрос Миколая «че такое мир» Слава ответил: «Типо параллельный мир. Но как я говорил наш мир первый и самый большой» (id 278855–278856). Дальнейшие вопросы Миколая — «большой это как», «как мы это покажем в истории?», «как эти размеры работают?» (id 278857–278860) — ответа в переписке не получили; Миколай сам свернул тему: «ладно прости, лучше сначала прочитаю».</p>\n<p>Попадание в ад определяется смертью: «мы умираем и отправляемся в рай или ад, ну или в минимирок ну это случается крайне редко». Отправляет умерших не сам ад, а отдельная сущность — «смерть»: «она после нашей кончины не даёт остаться в нашем мире и вечно отправлять нам куда-то» (id 278852).</p>\n<p>Ключевое отличие ада от рая в первом изложении — направление утечки: «из \"рай\" по понятным причинам не кто не хочет сбегать, а вот с \"ад\" грешники сбегают» (id 278852).</p>\n<p>Почти во всех мирах есть правитель — «существо правящий этим миров». Правитель ада — дьявол, и он сразу же оговорён как добрый: «сразу дьявол правитель \"ада\" добрый, типо он карает грешников» (id 278852). Позже формулировка ужесточена: «дьявол каратель, он наказывает грешников» (2025-01-06, id 279004).</p>\n<p>Правители миров могут давать своё благословение, но «только людям из нашего мира» (id 278852). Правители минимиров дают благословение редко; «Больше все благословенный даёт бог и дьявол» — это «их ний полномочия» (id 278941–278942). Численный предел назван: «И бог и дьявол могут дать свой благословение лишь 21 человеку» (id 278944).</p>\n<p>Мотив дьявола раздавать благословения — прямо служебный: «У дьявола часто сбегают в грешники в наш мир и их надо возвращать поэтому он даёт благословение» (id 278943). У бога мотив другой: «В раю много добрых людей и бог име проникся из за этого даёт благословение».</p>\n<p>Механика возврата беглецов разобрана отдельно (id 279004–279014). Миколай переспросил, наказывает ли дьявол грешных благословением; Слава: «Он даёт благословение людям, а эти люди изгоняют грешников из этого мира и отправляют в ад» (id 279011). На уточнение «убивая?» — «Да после смерти грешники опять отправляются в ад» (id 279014). То есть благословенные дьявола убивают сбежавших грешников в нашем мире, и смерть возвращает тех обратно в ад.</p>\n<p>Отдельной чертой правителей названо наблюдение за нашим миром: «Опять они вечно наблюдают за нашем миров можно сказать единственное развлечения в их ней бесконечное жизни» (id 278941).</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0096-S02", "MR-0096--naselenie"], "h": "<ul>\n<li>Дьявол — правитель ада, «добрый», каратель грешников. На момент версии 2 он «и так в бешенстве что сбегают грешники» (id 278954).</li>\n<li>Грешники — те, кто попадает в ад после смерти. Единственная категория, которая из ада сбегает, и сбегает в наш мир.</li>\n<li>Демоны — не сбегают. Причина названа прямо: «А демоны бояться гнева дьявола который и так в бешенстве что сбегают грешники» (id 278954). Для сравнения, по ангелам рая дан симметричный ответ: «Ангела просто незачем сбегать».</li>\n<li>Благословлённые дьяволом люди — жители нашего мира, не ада, но существуют ради его нужд: изгоняют сбежавших грешников обратно. Их не более 21 (id 278944).</li>\n</ul>", "r": []}, {"t": "Место во вселенной — как связан с другими мирами", "a": ["S03", "MR-0096-S03", "MR-0096--mesto-vo-vselennoy"], "h": "<p>Ад — второй по размеру мир наравне с раем, ниже нашего мира и выше минимиров. Связь с нашим миром двусторонняя: из нашего мира в ад поступают умершие грешники, из ада в наш мир сбегают те же грешники, и обратно их выталкивают благословлённые дьяволом люди.</p>\n<p>Минимиры к аду напрямую не привязаны: они «чаще всего пытаются копировать нашей мир», они «тёмный жуткий жестокий все существо там опасный», и именно оттуда происходят драконы, упыри, оборотни, леший и прочие «мистический монстры» (id 278852). Попадание умершего в минимир возможно, но «случается крайне редко».</p>\n<p>Миколай сформулировал предположение: «кстати я так понял рай и ад миры не совсем зависящие от нашего мира раз там по целый стать худшей или лучшей версией если я прав» (id 278945). Ответы Славы шли подряд — «Неа», «Да», и на переспрос «всё мимо?» — «Первой мимо» (id 278947–278950). Какое из двух заданных подряд утверждений при этом признано верным, из переписки однозначно не восстанавливается.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0096-S04", "MR-0096--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-01-06 (id 278852–278861).</strong> Первое изложение. Задана иерархия миров по размеру, роль «смерти» как отправителя умерших, побеги грешников из ада, дьявол как добрый правитель-каратель, институт благословения от правителей миров только людям нашего мира. Вопросы Миколая о том, что такое «мир» и как работают размеры, остались частично без ответа.</p>\n<p><strong>Версия 2 — 2025-01-06 (id 278941–278954).</strong> Уточнена экономика благословений: правители минимиров дают их редко, основные раздатчики — бог и дьявол, предел — 21 человек у каждого. Названы разные мотивы бога и дьявола. Введено, что дьявол «в бешенстве» от побегов, а демоны из-за этого сбегать боятся; ангелам сбегать незачем. Добавлено наблюдение правителей за нашим миром как их единственное развлечение.</p>\n<p><strong>Версия 3 — 2025-01-06 (id 279004–279014).</strong> Раскрыта механика возврата: благословлённые дьяволом люди изгоняют грешников из нашего мира, убивая их, после чего смерть снова отправляет грешников в ад. Формулировка о дьяволе перешла из «добрый, типо он карает грешников» в «дьявол каратель, он наказывает грешников».</p>\n<p>Все три версии относятся к одному дню, 2025-01-06, окно w0070; более поздних состояний ада в материале нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0096-S05", "MR-0096--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Как именно работают «размеры» миров и чем «больший» мир отличается от «меньшего» — Миколай спросил трижды, ответа в переписке нет.</li>\n<li>Как размер мира предполагалось показывать в самой истории — не сказано.</li>\n<li>Внутреннее устройство ада (география, структура, как выглядит наказание грешников внутри ада, а не после побега) — не описано.</li>\n<li>Каким образом грешники сбегают из ада в наш мир — механика побега не названа.</li>\n<li>По какому признаку умерший распределяется в рай, ад или минимир — не сказано; названо только, что в минимир попадают крайне редко.</li>\n<li>Что происходит с грешником при повторном возвращении в ад, отличается ли это от первого попадания — не сказано.</li>\n<li>Ответ Славы на предположение Миколая о независимости рая и ада от нашего мира («Первой мимо») остался неоднозначным: какое из двух утверждений отвергнуто, не восстанавливается.</li>\n<li>Число 21 названо как предел благословлённых у бога и у дьявола, но откуда взялось именно 21 — в переписке не объяснено.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0096--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0023.html\">Правители (правители миров, правители минимиров)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0096--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-01-06</td>\n<td>278852–278861</td>\n<td>w0070</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-06</td>\n<td>278941–278954</td>\n<td>w0070</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-06</td>\n<td>279004–279014</td>\n<td>w0070</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0096-ad.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0096--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0096.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["MR-0096-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/MR-0096/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — дьявол. Он здесь правитель мира, раздатчик благословений с пределом в 21 человека, мотив всей механики возврата и единственная фигура, у которой сменилась формулировка между версиями. Записи с таким именем в наборе нет вообще — ни статьи, ни строки в базе. Есть только производные: <code>SP-0165</code> «Базовые умения благословенных дьявола» (статья, одна ссылка, 5.2 КБ базы) и <code>ID-0143</code> «Благословенный дьяволом» (3.1 КБ базы, статьи нет). При этом на другом конце той же пары фигура собрана: <code>PS-0279</code> «Правитель рая» — статья, две ссылки, 23.1 КБ базы, материал тянется до 2025-10-18. То же с богом: отдельной записи нет, ближайшее по имени — <code>PS-0306</code> «Существо-Бог», без статьи, 4.2 КБ, и отнесено к «вне вселенной».</p>\n<p>Вторая по цене — демоны. Они названы населением ада и им объяснено поведение (не сбегают, потому что боятся). Записи <code>MR-0091</code> «Демоны» — 3.6 КБ базы, статьи нет, вселенная не определена. Их зеркало собрано полностью: <code>PS-0233</code> «Ангел» — статья, 28.6 КБ.</p>\n<p>Третье, дешёвое в починке: <code>PS-0178</code> «Смерть». Статья есть (5.8 КБ), ссылок на неё ноль. Вся механика возврата грешников держится на том, что смерть после убийства снова отправляет их в ад, — и ни одна запись на смерть не ссылается.</p>\n<h3>С чего начать</h3>\n<p>В базе. <code>PS-0279</code> «Правитель рая», id 331635–331636 (2025-05-31) — там правители переопределены заново: «не физические существа появившиеся в нигде», первым появился правитель Кильки, вторым правитель рая, «поэтому их мир в разы больше миров других правителей». Это надо класть рядом с здешним «наш мир появился первым и самый большой» из id 278852: два порядка первенства лежат в наборе одновременно и нигде не сведены. Дальше <code>SP-0163</code> «Благословение» (86.8 КБ, 2025-01-06 — 2025-05-31) — там же должно быть, что стало с числом 21 и с мотивами бога и дьявола. Ангелы и демоны — <code>PS-0233</code> и <code>MR-0091</code>.</p>\n<p>В архив — за внутренним устройством ада. В w0070 его нет: 2025-01-06 весь ушёл на границы, побеги и возврат, но не на то, что внутри. Ориентир — окна после 2025-01-06, где всплывают благословенные дьявола: <code>PS-0179</code> «Благословенные» тянется до 2026-04-25, <code>SP-0165</code> — там же должны быть следы. Заодно там же смотреть трижды заданный вопрос про размеры (id 278857–278860), который Миколай свернул сам.</p>\n<h3>Как развивалось</h3>\n<p>Заявили целиком одной репликой (278852, 2025-01-06): иерархия миров, смерть как отправитель, побеги грешников, дьявол-каратель, благословение только людям нашего мира. Ограничили в тот же день (278941–278954): правители минимиров дают благословение редко, у бога и дьявола предел — 21 человек, демоны не сбегают из страха. Оставили без ответа три подряд вопроса о размерах — и оставил их сам спрашивающий: «ладно прости, лучше сначала прочитаю». Вернулись в 279004–279014, к побегам, и на возврате формулировка о дьяволе сдвинулась: «сразу дьявол правитель „ада“ добрый, типо он карает грешников» → «дьявол каратель, он наказывает грешников». Всё внутри одного дня и окна w0070; после 2025-01-06 к аду не возвращались, тогда как рай (<code>MR-0095</code>, 54.1 КБ базы) и правители (<code>MR-0120</code>, до 2026-02-06) продолжались.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для утечки из ада правило прописано до конца: грешники сбегают в наш мир, благословенные дьявола их там убивают, смерть возвращает обратно. Утечка из минимиров названа в том же разговоре — существа приходят «через край своего мира» и «творят бесчинства», — но кто их выталкивает назад и выталкивает ли кто-нибудь, не сказано. Для одной дыры в границе назван и охранник, и способ возврата; для соседней дыры того же рода — ни того, ни другого.</p>\n<h3>Отклик</h3>\n<p>Зацепило, что благословение у дьявола — служебное. Он раздаёт его не из щедрости и не в награду, а потому что у него сбегают и надо возвращать: двадцать один человек в нашем мире — это, по сути, отдел возврата беглецов, работающий убийством. И «добрый» он ровно в том смысле, в каком добр исполнитель, — карает тех, кого положено. Пара с богом от этого выходит несимметричной: у одного кадровая необходимость, у другого «проникся». Мне это нравится больше, чем если бы оба давали силу по одной причине. Отдельно хорош ход, где ад не наказывает сам: наказание вынесено наружу, в наш мир, и делают его люди.</p></div>", "r": []}];</script>
