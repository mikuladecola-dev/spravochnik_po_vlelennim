<script>const BASE="";const DOCNAME="Душа грешника";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0012-S01", "SP-0012--mehanika"], "h": "<p>Способность применяется при физическом контакте: носитель хватает противника за голову. Дальше, по формулировке Славы, он «за 3 минуты создаёт в его голове мир где он проживает разный или одну жизнь» (2023-03-27, id 37580). То есть три минуты — это время, за которое внутри головы противника разворачивается мир, а сам противник успевает прожить в нём либо одну жизнь, либо несколько разных.</p>\n<p>Название способности — «душа грешника» — дано автором сразу вместе с механикой, отдельно не объяснялось.</p>\n<p>Способность названа четвёртой в наборе. По условию, заданному Славой в том же окне, у персонажа «должно быть 6 способности» (2023-03-27, id 37532).</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0012-S02", "SP-0012--ogranicheniya-i-cena"], "h": "<p>Единственное явно названное ограничение — контактное: нужно схватить противника за голову. Никакой цены, отката, расхода сил или ограничения по числу применений в переписке не сказано.</p>\n<p>Не сказано также, что происходит с противником после трёх минут: остаётся ли он в сознании, помнит ли прожитую жизнь, наносится ли ему вред.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0012-S03", "SP-0012--nositeli"], "h": "<p>Носитель — Демон.</p>\n<p>Он же в переписке описан (2023-03-27, id 37532) как персонаж 17 лет, нормального телосложения, в белой маске с нарисованной улыбкой и чёрном плаще, убивающий в прямом эфире сверхлюдей, совершавших грехи. В окне 2023-12-14 «душа грешника» прямо названа четвёртой способностью «персонажа из сообщения 37532», то есть этого же персонажа.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0012-S04", "SP-0012--kak-menyalas-po-versiyam"], "h": "<h3>2023-03-27 (id 37578–37583), окно w0011</h3>\n<p>Единственная развёрнутая формулировка. Слава задаёт способность целиком, одним сообщением: «Четвертая способность душа грешника( хватая противника за голову и за 3 минуты создаёт в его голове мир где он проживает разный или одну жизнь )» (id 37580). Сразу после этого он отмечает, что «осталось ещё 2» — то есть из шести способностей на тот момент оставалось придумать две.</p>\n<h3>2023-12-14 (id 63305–63310), окно w0020</h3>\n<p>Механика не повторяется и не уточняется. Способность фигурирует только как пункт перечня, когда Миколай перечисляет иконки, нарисованные нейросетью для этого персонажа: «Сверху слева на право: контроль грешниками, ускорение. Снизу: контроль тела, душа грешника» (id 63306). «Душа грешника» — иконка снизу справа.</p>\n<p>Здесь же Миколай отмечает, что изначально не указал нейросети аниме-стиль, «и вышел жуткий чел, но прикольный».</p>\n<p>В этом окне названы четыре способности из шести; какие две остальные, в перечне не приведено.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0012-S05", "SP-0012--svyaz-s-drugimi-sposobnostyami"], "h": "<p>В перечне 2023-12-14 «душа грешника» стоит рядом с способностями «контроль грешниками», «ускорение» и «контроль тела» — как часть одного набора одного персонажа. Механической связи между ними в переписке не описано.</p>\n<p>Первая способность того же персонажа сформулирована Славой так: «контроли грешнико( тем грешней человек тем лучше контролирует он их )» (2023-03-27, id 37532).</p>\n<p>В том же обмене, сразу после формулировки «души грешника», Миколай предложил: «Способность создать клон грешника, который будет сражаться с грешником, отвлекать его» (id 37582). Связь этого предложения с «душой грешника» в переписке не названа.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "SP-0012-S06", "SP-0012--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вселенная не определена ни в одном из окон.</li>\n<li>В окне 2023-12-14 механика не описана — только название в перечне.</li>\n<li>Не сказано, что даёт способность носителю: убивает ли она, обездвиживает, служит допросом или наказанием.</li>\n<li>Не сказано, чем наполняется создаваемый мир и кто его определяет.</li>\n<li>Не объяснено, почему способность называется «душа грешника» и работает ли она только на грешниках.</li>\n<li>Не названы две оставшиеся способности из шести.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0012--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в способностях:</strong> <a href=\"SP-0013.html\">Короткая невидимость</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0012--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2023-03-27</td>\n<td>37578–37583</td>\n<td>w0011</td>\n<td>неясно (не определено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2023-12-14</td>\n<td>63305–63310</td>\n<td>w0020</td>\n<td>неясно (не определено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0012-dusha-greshnika.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0012--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0012.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
