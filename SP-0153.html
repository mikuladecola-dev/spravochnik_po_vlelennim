<script>const BASE="";const DOCNAME="Линза удачи";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0153-S01", "SP-0153--mehanika"], "h": "<p>Линза удачи — предмет, через который её владелец видит удачу людей. Формулировка Миколая целиком: «есть ещё линза удачи, он видит с её помощью удачу людей» (2024-12-23, id 273515).</p>\n<p>Больше о работе линзы в переписке ничего нет: как выглядит увиденная удача, измеряется ли она, можно ли на неё влиять — не сказано.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S02", "SP-0153-S02", "SP-0153--nositeli"], "h": "<p>Линза принадлежит персонажу Миколая — тёмному эльфу. Он введён в той же карточке (2024-12-23, id 273515): персонаж 207 лет, открытая цель — стать королём, полная цель — изменить государство; работает на команду и на поддержку, всё, что использует, дополняет команду; общительный, в народе укрепляет имя, держась относительно в тени, репутация надёжная; по характеру, внешне и внутренне добрый и эмпатичный. Тёмный эльф — поэтому тёмная магия развита хорошо.</p>\n<p>Способность отнесена к этому персонажу как его часть.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S03", "SP-0153-S03", "SP-0153--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-12-23 (id 273513–273517).</strong> Единственная версия. Линза введена одной строкой внутри общей карточки персонажа, которую Миколай выдал списком после реплики Славы «Перс твой» (id 273513). Дальнейших переработок нет.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S04", "SP-0153-S04", "SP-0153--svyaz-s-drugimi-sposobnostyami"], "h": "<p>В той же карточке персонажа (2024-12-23, id 273515) перечислены остальные его умения и предметы. Прямой связи между ними и линзой в переписке не проведено, они просто соседствуют в одном списке:</p>\n<ul>\n<li><strong>Листок бумаги из клевера.</strong> «он может написать заклинание и сложить листок в оригами, тогда поимеет свой и материализует относительно функции формы».</li>\n<li><strong>Усиление и стихия огня.</strong> «обычно он использует стихию огня и усиливает человека».</li>\n<li><strong>Тёмная магия</strong> — развита хорошо, поскольку он тёмный эльф.</li>\n<li><strong>Чтение опыта через прикосновение.</strong> «погладив по голове кого-то и если тот участвует в процессе он может узнать опыт этого человека и изучить его даже относительно прожить, но чревато потерями навыков или памяти, ну относительно кнш».</li>\n<li><strong>Базовый набор заклинаний:</strong> «шар огня, мини ураган с ладонь по размеру, водяной луч (режет хорошо твёрдое а мягкое не может), ослепление, усыпление». Оговорено, что это «базовый набор который он раскрывает разным людям, не весь».</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S05", "SP-0153-S05", "SP-0153--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Механика видения удачи не раскрыта.</li>\n<li>Не сказано, откуда у персонажа линза и что она собой представляет физически.</li>\n<li>Не сказано, работает ли линза на самого владельца, есть ли у неё цена или ограничение по применению.</li>\n<li>Не сказано, связана ли линза удачи с листком бумаги из клевера (клевер как знак удачи в переписке не обыгран).</li>\n<li>Принадлежность к вселенной в записи помечена как «неясно» (по дате объявления).</li>\n<li>Из соседних реплик к описанию персонажа: на «у него коричневые джинсы» Слава ответил «Джинсы в средневековье» (id 273517). Обсуждение на этом обрывается, к линзе оно отношения не имеет и итог его в переписке не зафиксирован.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["SP-0153--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-12-23</td>\n<td>273513–273517</td>\n<td>w0068</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0153-linza-udachi.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0153--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0153.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
