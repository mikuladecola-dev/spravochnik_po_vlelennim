<script>const BASE="";const DOCNAME="Королевство Пиор";
const LEAD="<p>Мир, в который попадает Дионис Бэлут в истории «Фанатик». Второе название — просто Пиор. Известен по одному окну w0113 (2025-12-14, id 397759).</p>";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0187-S01", "MR-0187--ustroystvo"], "h": "<p>Средневековое королевство Пиор. Интерьер описан изнутри истории: «Сам интерьер, здесь как и ожидалось был средневековым. Разные узоры, где попало и не экономия пространства». Отдельно отмечены ковры: «Невероятная мягкий ковры». Особняк графской семьи устроен как лабиринт — «длинейший на свете коридор», «идиотский коридор с множеств дверей», сам дом герой называет «лабиринтом называемая особняком». В особняке есть библиотека, кухня, несколько залов, сад с фарфоровой скульптурой, покои героя (тёмная комнатушка) и общая столовая, где семья ужинает вместе.</p>\n<p>Главное свойство мира: он — мир книги. Служанка по просьбе героя пересказала «упрощённый вариант истории королевства Пиор», и этого хватило, чтобы герой узнал, куда попал: «Этой информации мне хватило, чтобы понять, что это за мир». Мир опознан как «та самая сказка о герое справедливости, что борется со всем злом на свете», которую герой читал раньше. Его собственная формулировка: «Я лютый грешник попал в тот самый лучик света».</p>\n<p>Из этого следует, что в мире есть герой справедливости — фигура, ради встречи с которой герой и живёт: «Единственно, что я хотел это понаблюдать за главным героем. В независимости в каком я романе». Сам этот герой справедливости в переписке не появляется и не назван по имени.</p>\n<p>Из бытовых деталей мира: есть штат прислуги с разделением ролей — служанка, дворецкий, библиотекарь (герой их путает: «дворецкий я думал это был библиотекарь»), и сообщения между слугами и графом передаются через дворецкого достаточно быстро, чтобы граф успел отдать распоряжение об ужине, пока герой ходил по дому.</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0187-S02", "MR-0187--naselenie"], "h": "<p>Аристократия. Семья Бэлут, названная служанкой:</p>\n<ul>\n<li>граф Эдгар Бэлут — отец Диониса;</li>\n<li>графиня Виктория Бэлут — мачеха Диониса;</li>\n<li>младший брат и младшая сестра от графини Виктории.</li>\n</ul>\n<p>Реакция героя на состав семьи: «Что мачеха» и «Я прочитал достаточно рассказов, чтобы понимать мачеха не сулит ничего хорошего», затем «Это плоха, очень плоха» — он опознаёт заготовку под политическую борьбу в семье и хочет её избежать.</p>\n<p>Прислуга. Черноволосая служанка, приставленная к Дионису, — бесстрастная, отвечает односложно, на комплименты только кивает, воду достаёт «из неоткуда». Герой оценил её: «да ты нечто», «будь конкурс лучшей служанки. Ты бы заняла первое место». Она же действует на опережение без приказа: успела сообщить графу, что у господина «сегодня у вас за долгое время хорошее настроение», после чего граф потребовал его присутствия на ужине. Герой запретил ей самодеятельность: «больше не делай что-либо без моего приказа. Ты же моя служанка?» — ответ: «да господин я ваша служанка. Больше такого не повторится».</p>\n<p>Отдельно упомянуты дворецкий и, предположительно, библиотекарь — герой не различает их точно.</p>", "r": []}, {"t": "Место во вселенной — как связан с другими мирами", "a": ["S03", "MR-0187-S03", "MR-0187--mesto-vo-vselennoy"], "h": "<p>Мир отнесён к вселенной Феня и указан как часть истории «Фанатик». Связан с персонажем Дионис Бэлут — попаданцем, для которого Пиор является миром прочитанного в прошлой жизни романа. Связей с другими мирами вселенной (Оам, Феня, семь островов) в переписке нет.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0187-S04", "MR-0187--kak-menyalsya-po-versiyam"], "h": "<p>Версия одна.</p>\n<p><strong>2025-12-14 (id 397759).</strong> Мир назван — королевство Пиор. Даны средневековый интерьер, устройство особняка, состав графской семьи Бэлут, фигура служанки и опознание мира как мира сказки о герое справедливости. Никаких более ранних или более поздних состояний в переписке нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0187-S05", "MR-0187--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Устройство мира, кроме названия и «сказки о герое справедливости», не раскрыто (w0113).</li>\n<li>Сама «упрощённая история королевства Пиор», которую рассказала служанка, в тексте не приводится — сказано только, что она прозвучала и что герою её хватило.</li>\n<li>Кто такой герой справедливости, как его зовут, где он находится — не сказано.</li>\n<li>Название романа/сказки, который герой читал в прошлой жизни, не даётся.</li>\n<li>География, политика, соседи королевства, наличие магии или других рас — не упоминаются вовсе.</li>\n<li>Положение семьи Бэлут в королевстве (кроме графского титула) не описано.</li>\n<li>Имя служанки не названо.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0187--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0081.html\">Семья Бэлут</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0011.html\">Феня</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0187--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-12-14</td>\n<td>397759–397759</td>\n<td>w0113</td>\n<td>Феня (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0187-korolevstvo-pior.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0187--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0187.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
