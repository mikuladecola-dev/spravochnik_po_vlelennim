<script>const BASE="";const DOCNAME="Плакучая ива";
const LEAD="";
const CH=[{"t": "Где находится", "a": ["S01", "MN-0028-S01", "MN-0028--gde-nahoditsya"], "h": "<p>Ива стоит в обычном мире героя — том, где «летом жарко», где у героя есть «близкие которые его ждут к которым он хочет какие то планы». Конкретная местность не названа. Есть только пункт плана: «скорее всего у персонажа частный дом и он там какой нибудь сарай чинил, умаялся» — то есть ива предполагается где-то рядом с домом и сараем, но прямо это не сказано.</p>\n<p>Вселенная в карточке проставлена как Иссекай по дате объявления (2026-02-16, id 433471–433474).</p>", "r": []}, {"t": "Что собой представляет", "a": ["S02", "MN-0028-S02", "MN-0028--chto-soboy-predstavlyaet"], "h": "<p>Плакучая ива — «особое место». Герой засыпает под ней в летнюю жару, и ива исполняет его желание: «она исполнила его мечту». Желание сформулировано как «хочет охладиться».</p>\n<p>Ива работает в обе стороны. Вход: герой уснул под ней и попал в ледяной мир. Выход: «потом когда ива вытянется на него упадут почи солнца он проснётся» — то есть пробуждение привязано к самой иве, к тому, что она вытянется и перестанет закрывать героя от солнца.</p>\n<p>Слово «плакучая» в переписке никак отдельно не обыгрывается.</p>", "r": []}, {"t": "Что с ним связано", "a": ["S03", "MN-0028-S03", "MN-0028--chto-s-nim-svyazano"], "h": "<p>Связана с ледяным миром и с историей про ледяной ад — ива и есть точка входа и выхода.</p>\n<p>Устройство того, куда ива переправляет героя, описано так: «он попал в ледяной мир, ледяной ад который он не идентифицирует как ад, ад для него дар. но это не рай, рай другое. рай это другие». Мир застывший, герой «ходит и разговаривает с застывшим миром».</p>\n<p>Механика взаимодействия с застывшим миром: «касаясь ничего не происходит. но сильно взаимодействуя он согревает что-то, но выходит резко, не равномерно, рука например тает, но все остальное замороженное, он тянет и отрывает и всё в кровяке».</p>\n<p>Отдельно к иве привязан алкоголь как условие входа: «гг бухает, обливается алкоголем, хочет охладиться, уснул под плакучей ивой». В плане это развёрнуто: «нужно использовать алкоголь с умом», «кстати очень круто я подметил алкоголь и его горячительные свойства», «на улице итак жарко, а он ещё сосуды расширяет».</p>", "r": []}, {"t": "Персонажи и события", "a": ["S04", "MN-0028-S04", "MN-0028--personazhi-i-sobytiya"], "h": "<p>Персонаж один — главный герой, по имени не назван. Про него в переписке сказано: летом жарко, он бухает, обливается алкоголем, хочет охладиться, засыпает под ивой. Отдельно оговорено, что он не умирает: «сдох? нет ну это скучно».</p>\n<p>Что происходит после переноса: он ходит по застывшему миру и разговаривает с ним, пробует что-то согревать — «возможно он согреет какую то территорию будет стараться типа а потом такой а зачем мне это. и просто замёрзнет, надолго замёрзнет полностью во льдах».</p>\n<p>Возвращение через иву и реплика героя после пробуждения: «и такой: вот почему зимой все летят в тёплые страны, а летом на Антарктиду не летают. я так хорошо отдохнул. покупайте билеты».</p>\n<p>Дополнительные пункты про состояние героя до переноса, заданные списком: «надо показать как жарко летом», «именно показать от лица персонажа», «возможно его жёстко пилила жена тёща кто то такое», «так же довело дилемма которую он не мог решить видимо так же связанное с сараем и тем что он в нем делает», «ужасно противно, страшно», «он ещё и без футболки, солнце палит, кожа с высохшим потом, красная».</p>", "r": []}, {"t": "Как менялся по версиям — по датам", "a": ["S05", "MN-0028-S05", "MN-0028--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2026-02-16 (id 433471–433474, окно w0117).</strong> Ива вводится сразу целиком, в одном сообщении-плане: особое место, исполняющее желание, вход в ледяной мир и выход из него. Других состояний нет — задумка за один заход изложена и дальше в этом окне не переделывалась.</p>\n<h3>Отдельно: сомнения авторов</h3>\n<p>Концовка с репликой про билеты помечена самим Миколаем как неуверенная: «насчёт рекламы я не уверен». Вариант не отброшен, но и не утверждён.</p>\n<p>Рядом в том же сообщении идёт реплика, не связанная с ивой напрямую: «густая кровь течёт по кровле. может именно из за этого она так называется? кровля».</p>\n<p>Перед планом Миколай формулирует требование к тексту: «у текста должна быть идея».</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "MN-0028-S06", "MN-0028--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Как именно ива исполняет желание — механики нет, сказано только «ива особое место, она исполнила его мечту».</li>\n<li>Почему ива вообще особая, откуда у неё это свойство — в переписке не сказано.</li>\n<li>Работает ли она для кого-то, кроме этого героя, — не обсуждалось.</li>\n<li>Где ива растёт географически — не названо; частный дом с сараем стоит в плане с оговоркой «скорее всего».</li>\n<li>Как долго герой отсутствует по времени обычного мира — прямо не сказано; есть только «надолго замёрзнет полностью во льдах» про время внутри ледяного мира.</li>\n<li>Вход требует алкоголя и сна или чего-то одного — не разделено.</li>\n<li>Концовка с «покупайте билеты» осталась нерешённой.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MN-0028--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0005.html\">Иссекай</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MN-0028--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-02-16</td>\n<td>433471–433474</td>\n<td>w0117</td>\n<td>Иссекай (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/monumenty/MN-0028-plakuchaya-iva.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MN-0028--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MN-0028.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
