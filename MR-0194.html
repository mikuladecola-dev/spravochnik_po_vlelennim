<script>const BASE="";const DOCNAME="Ассоциация";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0194-S01", "MR-0194--ustroystvo"], "h": "<p>Ассоциация — организация, «которая контролирует и помогает героем» (2026-06-02, id 487001). Она названа в первом же описании вселенной героев и злодеев (<a href=\"MR-0193.html\">Вселенная героев и злодеев</a>) наряду со злодеями, Нимбом и культом. Варианты имени в переписке: «ассоциация героев», «Ассоциация и лицо ассоциации».</p>\n<h3>Шесть столпов</h3>\n<p>«На стороне ассоциации 6 столпов. Тобишь шесть сильнейших Героев. В ней входит граф и нуар, ну ещё челики который я потом расскажу» (2026-06-02, id 487002). Симметрично устроены и злодеи: «Также и у злодеев есть шесть столпов ( так сказать разрушение)» (487003).</p>\n<p>В общем раскладе сил вселенной столпы Ассоциации идут как «6 героев» (487005).</p>\n<h3>Цепной пёс</h3>\n<p>2026-06-02 (id 487176) введена фигура Палача — одного из 12 апостолов: «Цепной пёс ассоциации. Ну точнее ассоциации так думает».</p>\n<p>Что понимается под цепным псом, сказано прямо: «Под цепным псом я имею ввиду убийцу, что убивает тиха всех неугодных ассоциации». Палач при этом не герой — «ну не числиться». В ближнем бою он «почти сильнейший».</p>\n<p>Там же напоминание об иерархии апостолов: «сильнейший апостолы это Граф и Палач».</p>\n<p>Оговорка «Ну точнее ассоциации так думает» означает, что принадлежность Палача Ассоциации мнимая; чьим он является на самом деле, в переписке не сказано.</p>\n<h3>Лицо Ассоциации</h3>\n<p>2026-06-03 (id 487514) вводится отдельная публичная роль — «лицо ассоциации». Её занимает Праведник: «Герой лицо ассоциации. Давай назовём его \"Праведник\"».</p>\n<p>Роль выборная: место лица Ассоциации разыгрывается голосованием — Святая дева «в полне себе конкурировала за роль лица ассоциации. Но по итогу проиграла. Не хватило голосов».</p>\n<p>Смысл роли — пропагандистский. Причины, по которым лицом стал именно Праведник:</p>\n<ul>\n<li>«он всегда героет, он всегда придёт на помощь даже когда злодей будут действовать скрытно»;</li>\n<li>«он не плохая пропаганда. Вот героем номер один может стать даже человек без атакующей способность»;</li>\n<li>«а также он устойчив».</li>\n</ul>\n<p>Причины, по которым лицом не стали остальные кандидаты, перечислены списком:</p>\n<ul>\n<li>«Изб не устойчив»;</li>\n<li>«Граф часто раздражённый»;</li>\n<li>«Нуар просто не хотел светиться, и напоминать людям о том что ИС такое сильные»;</li>\n<li>Святая дева — конкурировала, но проиграла голосование, «не хватило голосов. Возможно в будущем будет заменой праведника».</li>\n</ul>", "r": [["Вселенная героев и злодеев", "MR-0193.html"]]}, {"t": "Население", "a": ["S02", "MR-0194-S02", "MR-0194--naselenie"], "h": "<p><strong>Праведник</strong> — лицо Ассоциации. Способности: «слышать мольбы, воскрешения и маломальская видения будущего». Дополнительно он «способен видить картинку будущего, точнее картинку инцидента где умрут множество людей, так отголосок он увидит во сне».</p>\n<p>Боевых способностей у него нет: «Он просто будет усилять себя с помощью Оам». У него «самая плотная плёнка» — по причине, которую автор формулирует так: он «как бы является на полшишечки коллективным разумом. Ну его разум открыт для других разумов поэтому он растёт вместе с тем разумом который но вырос».</p>\n<p>Два эпизода с его участием названы:</p>\n<ul>\n<li>Инцидент Изб. Праведник спасёт Изб от злодея, «а после на глазах всех людей будет давить и ломать кости злодея. И скажет что ему без разницы что будут делать злодей, ведь итог один он их убьёт и ему без разницы мнения общества или предыстория злодей, а также его цель он просто убьёт их».</li>\n<li>Геноцид апостолов. Праведник предсказал инцидент, «где апостол устроят геноцид. И они попытался им мешать. Очень сильно мешал. Но всё равно апостолы сделали своё дело, хотя и не так полноценно как сами того хотели».</li>\n</ul>\n<p><strong>Палач</strong> — апостол, цепной пёс Ассоциации, убийца неугодных, героем не числится, почти сильнейший в ближнем бою.</p>\n<p><strong>Граф</strong> — апостол и один из шести столпов; вместе с Палачом — сильнейший из апостолов; «часто раздражённый», из-за чего не стал лицом.</p>\n<p><strong>Нуар</strong> — первый искусственный сверхчеловек, один из шести столпов. Лицом не стал по собственному нежеланию светиться.</p>\n<p><strong>Изб</strong> — кандидат на лицо Ассоциации, отсеян как «не устойчив».</p>\n<p><strong>Святая дева</strong> — «девушка с золотыми волосами. Её способность свет, она может ускоряться и формировать свет. Она боец ближнего боя и у неё свой стиль мяча основанный на её способности». Отдельно оговорена её связь с Нуаром: «Боится Нуара, так как тот, когда та ещё стремилась занят места столпа, была сильная им избита в тренировочном бою. Нуар переборщил потому что ему было интересно, как свет противостоит тьме. Но она после этого сильна выросла, потому что у неё появилась мотивация». В версии 3 этот персонаж отменён — см. ниже.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0194-S03", "MR-0194--mesto-vo-vselennoy"], "h": "<p>Ассоциация — часть вселенной героев и злодеев (<a href=\"MR-0193.html\">Вселенная героев и злодеев</a>). В устройстве этой вселенной она стоит первой из четырёх сил, наряду со злодеями (у которых своя организация «для противовеса Ассоциации»), Нимбом и культом.</p>", "r": [["Вселенная героев и злодеев", "MR-0193.html"]]}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0194-S04", "MR-0194--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2026-06-02 (окно w0120, id 487001–487005).</strong> Ассоциация вводится как организация, контролирующая и помогающая героям. На её стороне шесть столпов — шесть сильнейших героев, среди них Граф и Нуар. Названа симметрия с шестью столпами злодеев и общий расклад сил вселенной.</p>\n<p><strong>Версия 2 — 2026-06-02 (окно w0120, id 487176–487178).</strong> Добавлен Палач — апостол и цепной пёс, с оговоркой, что Ассоциация лишь думает, будто он её пёс. Реакция Миколая: «ок», «но конечно чет идей мало приходит».</p>\n<p><strong>Версия 3 — 2026-06-03 (окно w0121, id 487514–487542).</strong> Введена роль лица Ассоциации и голосование за неё; Праведник получает имя, способности и биографию роли; перечислены отсеявшиеся кандидаты и причины.</p>\n<p>Обсуждение внутри этой версии: Миколай — «пока-что круто», «но чёт он ебанутый», «нахуй так со злодеем», «ну он же лицо». Ответ Славы (487532): «Конечно он ебанутый. Он каждый Божий день слышат крики о помощи. Его каждую ночь мучуют кошмары. Конечно он ебанутый». Миколай после паузы: «аа», «тогда справедливо».</p>\n<h3>Отменено в версии 3: Святая дева</h3>\n<p>В том же окне, 2026-06-03 (id 487531): «Святая дева её больше нет как персонаж вообще». Персонаж отменён целиком, вместе с ролью конкурентки за лицо Ассоциации и с заготовкой «возможно в будущем будет заменой праведника», данной в том же дне (487514).</p>\n<p>Замена идёт не в Ассоциацию, а на сторону злодеев: «Вместо неё одним из столпов злодеев становится Фатик ( желтоволосая девчушка) чем способности управления фотонами». Её набор: зрительные иллюзии, «разукрасить мир в чёрное белые», внушение, что «вы оказались во дворце»; перемещение «на невероятной скорости»; «мощные залпы энергии ( ну фотонов с массой, ну которые как бы нарушает законы физики, ну пока допустим)» — выбросами она защищается, например от тьмы Нуара; «также если постарается её может сделать иллюзии осязаемыми»; «может погладить все факторы устроив минутку тьмы»; может ослепить и запутать в пространстве. Фатик — глава секты, которая поклоняется ей «как богини в человеческом виде»; секте дано имя Фалим; в ней состоит инквизитор с чистой Оам.</p>\n<p>Там же, в 487531, уточнено соотношение сил, к Ассоциации отношения не имеющее напрямую: «Нет серафим не сильнее Нуар. Они плюс минус равны по силе, но просто Пламя Серафима представляет опасность. Также у нуара больше всего Оам».</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0194-S05", "MR-0194--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Состав шести столпов Ассоциации полностью не назван: прямо указаны Граф и Нуар, остальные — «ну ещё челики который я потом расскажу».</li>\n<li>Чьим цепным псом Палач является на самом деле, если Ассоциация «так думает» ошибочно, — в переписке не сказано.</li>\n<li>Процедура голосования за лицо Ассоциации не описана: кто голосует, как часто, что даёт роль — не сказано.</li>\n<li>Внутреннее устройство Ассоциации помимо столпов, лица и Палача (руководство, штат, отношения с правительством) не описано.</li>\n<li>Механика «плёнки» и «Оам» в этих окнах не объясняется, хотя обе используются в описании Праведника как известные.</li>\n<li>Исход инцидента Изб и геноцида апостолов за пределами приведённого не раскрыт.</li>\n<li>Заготовка «возможно в будущем будет заменой праведника» осталась нереализованной: персонаж, к которому она относилась, отменён в тот же день.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0194--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0193.html\">Вселенная героев и злодеев</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0104.html\">Нуар</a></li>\n<li><strong>Упомянут в мирах:</strong> <a href=\"MR-0193.html\">Вселенная героев и злодеев</a>, <a href=\"MR-0202.html\">Фантазёры и провал в свой мир</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0194--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-06-02</td>\n<td>487001–487005</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-02</td>\n<td>487176–487178</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-03</td>\n<td>487514–487542</td>\n<td>w0121</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0194-associaciya.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0194--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0194.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
