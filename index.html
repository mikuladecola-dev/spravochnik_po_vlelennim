const CH=[{"t": "Вселенные", "a": ["S01"], "r": [], "h": "<p>Каждая вселенная объявлена в переписке датой и репликой. Одна вселенная может состоять из нескольких несмежных отрезков.</p><div class=\"homegrid\"><a class=\"homerow\" href=\"VS-0002.html\"><b>Апостол</b><span class=\"m\">VS-0002 · 342</span></a><a class=\"homerow\" href=\"VS-0015.html\"><b>монстры</b><span class=\"m\">VS-0015 · 180</span></a><a class=\"homerow\" href=\"VS-0001.html\"><b>7 островов</b><span class=\"m\">VS-0001 · 173</span></a><a class=\"homerow\" href=\"VS-0014.html\"><b>игра бога</b><span class=\"m\">VS-0014 · 82</span></a><a class=\"homerow\" href=\"VS-0006.html\"><b>Нимб</b><span class=\"m\">VS-0006 · 60</span></a><a class=\"homerow\" href=\"VS-0008.html\"><b>Оам</b><span class=\"m\">VS-0008 · 60</span></a><a class=\"homerow\" href=\"VS-0005.html\"><b>Иссекай</b><span class=\"m\">VS-0005 · 47</span></a><a class=\"homerow\" href=\"VS-0011.html\"><b>Феня</b><span class=\"m\">VS-0011 · 42</span></a><a class=\"homerow\" href=\"VS-0009.html\"><b>Падения небес</b><span class=\"m\">VS-0009 · 36</span></a><a class=\"homerow\" href=\"VS-0012.html\"><b>Цветной мир</b><span class=\"m\">VS-0012 · 23</span></a><a class=\"homerow\" href=\"VS-0007.html\"><b>Новый мир</b><span class=\"m\">VS-0007 · 22</span></a><a class=\"homerow\" href=\"VS-0004.html\"><b>Гигахрущевка</b><span class=\"m\">VS-0004 · 2</span></a></div>"}, {"t": "Разделы", "a": ["S02"], "r": [], "h": "<p>Всё остальное — через бургер слева: там поиск по всем статьям и списки по разделам.</p><div class=\"homegrid\"><a class=\"homerow\" href=\"#\"><b>Вселенные</b><span class=\"m\">12</span></a><a class=\"homerow\" href=\"#\"><b>Персонажи</b><span class=\"m\">344</span></a><a class=\"homerow\" href=\"#\"><b>Группы</b><span class=\"m\">99</span></a><a class=\"homerow\" href=\"#\"><b>Способности</b><span class=\"m\">260</span></a><a class=\"homerow\" href=\"#\"><b>Миры</b><span class=\"m\">179</span></a><a class=\"homerow\" href=\"#\"><b>Мону
