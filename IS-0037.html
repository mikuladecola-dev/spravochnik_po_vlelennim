<script>const BASE="";const DOCNAME="Чужемирец (история)";
const LEAD="";
const CH=[{"t": "Содержание", "a": ["S01", "IS-0037-S01", "IS-0037--soderzhanie"], "h": "<p>Ранее написанная история Славы. Её текста в переписке нет — есть только упоминания.</p>\n<p>Центральная идея названа самим автором при перечислении идей своих историй (2025-03-14, id 302863): «Чужемиреу. Идея по экспеминтировать, и проверять себя в нагнетаний атмосферы. И рифм». То есть история писалась как проба: эксперимент, проверка себя в нагнетании атмосферы и в рифмах.</p>\n<p>Второе, что о ней сказано по содержанию (2025-03-13, id 301886): её герой мести не ищет. Слава разграничивает своих героев так: «Бессмертный мстить не собирается / Чужемирец тоже не собирается / Только защитник / Ну Антоша».</p>\n<p>Больше о сюжете, событиях и устройстве истории в переписке ничего не сказано.</p>", "r": []}, {"t": "Персонажи", "a": ["S02", "IS-0037-S02", "IS-0037--personazhi"], "h": "<p>Персонажи истории в переписке поимённо не перечислены. По записи справочника с историей связаны Бессмертный, Защитник, Старик-арбетар (как рассказчик-чужемирец) и чужемирцы; в самих цитатах из переписки эти связи не проговариваются — там Бессмертный и Защитник названы только в сопоставлении «кто мстит, а кто нет» (id 301886).</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "IS-0037-S03", "IS-0037--mesto-vo-vselennoy"], "h": "<p>Вселенная — «Апостол» (проставлено по дате объявления). История входит в перечень историй Славы наравне с «Защитником», «Бессмертным», «Антошей» и «Битвой» (id 302863).</p>\n<p>В том же разговоре Миколай описывает, как из требования центральной идеи у него самого получилось деление на несколько историй: «поэтому я решил поделить», «в итоге вышла небольшая вселенная», «серия рассказов» (id 302874–302877). Слава на это отвечает, что идея есть в каждой истории, «даже если ты еë забыл» (id 302880), и что «в некоторых может быть паутин этих идей» (id 302882), с советом: «Ну возми просто одну лидирующую и поверх ней сделай раскрытия других идей» (id 302883). Про себя добавляет: «Я так делал. Ну хотя там было только две идей» (id 302885).</p>", "r": []}, {"t": "Состояние", "a": ["S04", "IS-0037-S04", "IS-0037--sostoyanie"], "h": "<p>История написана до разговоров, попавших в эти окна; в переписке она фигурирует как уже существующая. Своей идеи автор считает раскрытыми: «Идей были раскрыты» (id 302866).</p>\n<p>Отдельно история рассматривалась как кандидат на продолжение. 2025-03-16 (id 303466–303479) Миколай спрашивает, есть ли идея следующей истории. Слава отвечает: «Есть, много дохера и они вместе не смогут соединиться» (id 303469) — и просит подсказку, оговорив, что мнение «возможная никак не повлияет» (id 303471). Список вариантов (id 303472):</p>\n<p>1) агент\n2) про безбашенного парня\n3) «мои жуки( если помнишь, который каменный и у которых две личности)»\n4) чужемирец\n5) продолжения история Антошки</p>\n<p>Миколай выбрал «жуки» (id 303473). Слава после этого сказал: «Ладно понял бесбашеный» (id 303474), пояснив, что спрашивал, чтобы понять себя: «Просто я должен был так понять к чему меня больше тянет» (id 303478). Таким образом вариант с чужемирцем в качестве следующей истории взят не был.</p>\n<p>Хронология упоминаний:</p>\n<ul>\n<li>2025-03-13 (id 301886–301887) — упоминание в перечне историй: герой мести не ищет.</li>\n<li>2025-03-14 (id 302859–302886) — названа центральная идея.</li>\n<li>2025-03-16 (id 303466–303479) — числится среди вариантов следующей истории, не выбран.</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S05", "IS-0037-S05", "IS-0037--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Текста самой истории в окнах нет; сюжет, события и финал не изложены.</li>\n<li>Персонажи истории не названы. Связь с Бессмертным, Защитником, Стариком-арбетаром и чужемирцами в переписке не проговорена.</li>\n<li>Что означает «рифмы» в формулировке центральной идеи — есть ли в истории стихотворные вставки и какие — в переписке не сказано.</li>\n<li>Дата написания истории не названа, известно только, что она предшествует разговорам марта 2025.</li>\n<li>Мотивация героя, если не месть, не названа.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["IS-0037--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-03-13</td>\n<td>301886–301887</td>\n<td>w0080</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-14</td>\n<td>302859–302886</td>\n<td>w0081</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-16</td>\n<td>303466–303479</td>\n<td>w0081</td>\n<td>Апостол (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/istorii/IS-0037-chuzhemirec-istoriya.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["IS-0037--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/IS-0037.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
