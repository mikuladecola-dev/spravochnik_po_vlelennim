<script>const BASE="";const DOCNAME="Пресрог (преступная организация)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0026-S01", "GR-0026--chto-eto"], "h": "<p>Мировая преступная организация вселенной «7 островов». Названа «Пресрог» — название придумал Слава (2024-07-09, id 201991–201993). В переписке встречается также как «престог», «прес огр», «прест огр», «преступная команда», «преступная организация».</p>\n<p>Определение, которое дал ей Миколай сразу после того, как прозвучало название (2024-07-09, id 201999–202004): «пресрог / это преступная организация / имеющая суверенитет / тобиж независимость / от государств / в ней состоят существа обоих миров».</p>\n<p>До появления имени она разрабатывалась под рабочим названием «преступная организация» (2024-07-03 — 2024-07-04, id 194885–196123). В базе это две записи — <a href=\"MR-0026.html\">Преступная организация</a> «Преступная организация» и <a href=\"MR-0036.html\">Пресрог</a> «Пресрог», — но речь об одной и той же организации: 2024-07-05 про Кая сказано «Он состоит в той преступной организации» (id 198028), а 2024-07-09 он же попадает в список участников Пресрога (id 202018).</p>\n<p>Ключевые свойства, названные в переписке:</p>\n<ul>\n<li>«Преступная организация не зависит не от одного острова» (2024-07-04, id 196051), на вопрос «на каком острове?» — «Не на коком» (id 196049);</li>\n<li>«она не зависит не от одного защитника» — «Да, но она может заключать союзы» (2024-07-04, id 196056–196057);</li>\n<li>есть «верхушка типо сильнейших в той организаций» (2024-07-04, id 196055);</li>\n<li>«Преступная организация независит нет от кого» (2024-07-09, id 201988);</li>\n<li>работает не на каждом острове: на вопрос «где люди на каждом отрове» — «Не на каждом», при этом организация «общая» (2024-07-09, id 201978–201981).</li>\n</ul>\n<p>Вопрос «она везде?» решался дважды и с разным исходом. 2024-07-04 в 18:07 Слава ответил «Ну может быть везде» (id 196054), а через полчаса на вопрос «почему преступленая организация везде / как они и зачем расселись везде» — «Они не везде есть группа людей и все» (id 196120–196123).</p>\n<p>Отдельно оговорено, что не является Пресрогом: на Асгарде роль преступной организации играет церковь («Это церковь», 2024-07-09, id 201965), у сталкера — «просто криминальный остров» (id 201984), он же «остров наемников» (2024-07-04, id 196058). Миколай на это отметил: «у церки цель убивать всех из внешнего мира, не / для преступной мировой организации странно» (id 201972–201973).</p>", "r": [["Преступная организация", "MR-0026.html"], ["Пресрог", "MR-0036.html"]]}, {"t": "Состав", "a": ["S02", "GR-0026-S02", "GR-0026--sostav"], "h": "<p>Список участников, данный Славой (2024-07-09, id 202017–202018), под заголовком «Участники»:</p>\n<ul>\n<li><strong><a href=\"PS-0111.html\">Кай</a></strong> — Кай</li>\n<li><strong><a href=\"PS-0031.html\">Закон</a></strong> — Закон</li>\n<li>Мазохистка</li>\n</ul>\n<p>Мазохистка отдельной записью в базе не заведена, она проходит как грань внутри <a href=\"MR-0036.html\">Пресрог</a>. На просьбу Миколая «а вот про последнюю подробнее / не помню чтобы о ней говорили» Слава ответил: «Да забудь о ней её сразу убьют после её появления» (id 202019–202021). Больше о ней ничего не сказано.</p>\n<p>Кай был назван участником раньше остальных: 2024-07-04 Слава пишет «Один из участников» и следом даёт его карточку (id 196107–196108), а 2024-07-05 подтверждает — «Он состоит в той преступной организации» (id 198028).</p>\n<p>Позже назван ещё один — Температура (2024-07-09, id 202351–202358): «И температура тоже», затем «Температура в престог». В members справочника он не внесён: отдельной подтверждённой записи под этим именем в базе нет.</p>\n<p>Кто в организацию не входит: на вопрос «туда входит кто-то из защитников?» Слава ответил «Нет» (2024-07-09, id 202006–202007).</p>\n<p>Глава не выбран. На вопросы «есть глава? / кто глава / мы выбрали?» — «Не знаю» (2024-07-09, id 202005–202010).</p>", "r": [["Кай", "PS-0111.html"], ["Закон", "PS-0031.html"], ["Пресрог", "MR-0036.html"]]}, {"t": "Чем участники отличаются друг от друга", "a": ["S03", "GR-0026-S03", "GR-0026--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p><strong>Кай (<a href=\"PS-0111.html\">Кай</a>).</strong> Карточка Славы, данная дважды в одинаковом виде (2024-07-04, id 196108; повтор 2024-07-09, id 202032):</p>\n<div class=\"q\"><p>Имя: кай / Возраст: 29 / Любит: драки / Не любит: / Сила:8 / Ловкость:8 / Меткость:6 / Скорость:7 / Выносливость:9 / Контроль: 6 / Инструмент: рога ( чем больше чем сильней) / Способности: огонь / Приемы потом</p></div>\n<p>Приёмы (id 196109, повтор id 202032): огненная регенерация, огненный удар, файрболы, огненное копьё, полёт, огненный аватар.</p>\n<p>Раса: «Человек с рогами / То бишь демон / Ну он не демон» (2024-07-09, id 202033–202035). Ранее внешность описана как «Внешка как рогатый демон» (2024-07-05, id 197943). Отдельно оговорено, что он не бог: «Так он человек / Где ты взял что он бог» (2024-07-05, id 198036–198037).</p>\n<p>Грань: «грань может пользоваться и кай и Имитатор», но «который сейчас не может использовать грань» — «Он по сюжету научиться делать грань» (2024-07-05, id 197940, 197948–197949).</p>\n<p>Быт: на вопрос, как он использует способность помимо убийства, — «Кай готовить пожрать / Летайте» (2024-07-05, id 198009). «Он не курит», причина — «Не знаю глупо кажется / Сильный челик да и курить» (id 198010–198012).</p>\n<p><strong>Закон (<a href=\"PS-0031.html\">Закон</a>).</strong> Раса — «Человек обычный» (2024-07-09, id 202046). «Закон расист» (id 202040). Как проявляется расизм: «Ненавистью», «Но считает рабами и убиваетне», «Не всегда убивает» (id 202049–202053).</p>\n<p>Его способность разрабатывалась отдельно и раньше, вне привязки к организации (2024-03-12, id 138166–138220). Исходная формулировка Славы: «в радиусе 70 метром может сказать любой законны и его обязательно выполнять ( то бишь не убивать , не прыгать и т.д) а если нет будет наказание ( не прыгать если прыгнешь твой весь увеличиться на 1 тонну плюс минус ; не убивать за хочешь убить и нападешь то не сможешь двигаться н количество времени )» (id 138166). Уточнения: «Нет закон что то запрещает только» (id 138188), «Любой кто в радиусе 70 метров должен подчиняться закону» (id 138201). Действие не зависит от того, услышал ли человек: «там без разницы услышал ты или нет пока не покинул радиус действия способности закон будет действовать» (id 138176).</p>\n<p><strong>Мазохистка.</strong> Названа в списке и сразу отброшена, никаких свойств не описано.</p>\n<p><strong>Температура.</strong> Что он такое — в переписке не согласовано. На вопрос «он один из глав / или на подсосах» Слава ответил «Не он одиночка / То бишь просто легенда», после чего на уточняющие вопросы Миколая («один из иди оба», «они оба одиночки?») пришло «Температура в престог» и затем «Нет» (2024-07-09, id 202351–202359). Ответы друг с другом не сведены.</p>", "r": [["Кай", "PS-0111.html"], ["Закон", "PS-0031.html"]]}, {"t": "Иерархия", "a": ["S04", "GR-0026-S04", "GR-0026--ierarhiya"], "h": "<p>Верхушка. «Ну главная там есть верхушка типо сильнейших в той организаций» (2024-07-04, id 196055). Её состав: «Ну это верхушка прес огр будет состоять как из современных как из фэнтези» (2024-07-04, id 196076). Поимённо верхушка не названа.</p>\n<p>Глава. Не выбран (2024-07-09, id 202005–202010). Единственный прозвучавший вариант — Колобок, наброшенный Миколаем: «ну это я яно кто-то мне хороший / хулиган какой-то / думаю это будет / колобок» (id 202013–202016). Развития не получил — следующим сообщением Слава перешёл к списку участников.</p>\n<p>Соотношение сил внутри организации. Своих Закон не трогает: на вопрос «из преступной не трогает? / чисто презирает» — «Да», и следом «Он бы и не смог его убить или победить» про Кая (2024-07-09, id 202054–202058).</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S05", "GR-0026-S05", "GR-0026--otnosheniya-s-drugimi-gruppami"], "h": "<ul>\n<li><strong>С государствами и островами.</strong> Суверенитет, «независимость от государств» (2024-07-09, id 202001–202003); не зависит ни от одного острова (2024-07-04, id 196051).</li>\n<li><strong>С защитниками.</strong> Не зависит ни от одного защитника, но «может заключать союзы» (2024-07-04, id 196056–196057). Никто из защитников в неё не входит (2024-07-09, id 202006–202007).</li>\n<li><strong>С Асгардом.</strong> Своей ячейки Пресрога там нет — роль преступной организации играет церковь (2024-07-09, id 201964–201966). Цель церкви — «убивать всех из внешнего мира».</li>\n<li><strong>С островом сталкера.</strong> «Нет у сталкера просто криминальный остров» (2024-07-09, id 201984), «Остров сталкера. Это остров наемников» (2024-07-04, id 196058). Организация там та же самая или нет — вопрос Миколая «ну у сталкера та же?» получил ответ про отдельный криминальный остров.</li>\n<li><strong>С Оазисом и Имитатором.</strong> Имитатор — защитник Оазиса, в организации не состоит; «имитатор следит чтобы на остров не попали преступники и криминальный люди» (2024-07-04, id 196043). При этом на вопрос, зачем организация расселась везде, Слава ответил через персонажей: «Сталкер наемник / Имитатор часто будет покидать остров по заданием / А остальные твой челики не знаю» (2024-07-04, id 196122).</li>\n<li><strong>С группой сверхлюдей и ГГ.</strong> Организация впервые названа в ответ на вопрос «так а кто гг вообще»: «Ну там будет преступная организации», следом «Наверное будут группа сверх людей» (2024-07-03, id 194885–194889).</li>\n<li><strong>Война между островами.</strong> Исходная связка Славы, пересказанная Миколаем: «ты хочешь создать преступную организацию / и ввести военное положение меж тремя островами» (2024-07-04, id 195997–196000), ср. «Нет конечно я сделаю так чтобы хотя бы 3 острова воевали» (2024-07-03, id 194890).</li>\n</ul>", "r": []}, {"t": "Как менялась — по датам", "a": ["S06", "GR-0026-S06", "GR-0026--kak-menyalas"], "h": "<p><strong>2024-07-03, id 194885–194890.</strong> Первое упоминание. Названа в ответ на вопрос про главного героя, дальше в этом окне не раскрыта.</p>\n<p><strong>2024-07-04, id 195996–196003.</strong> Исходный замысел проговорён Миколаем: создать преступную организацию и ввести военное положение между тремя островами. Там же — распределение персонажей: «скорее всего это будут твои / а мои чисто на периферии / для раскрытия и глубины».</p>\n<p><strong>2024-07-04, id 196047–196062.</strong> Устройство: не привязана ни к одному острову, «может быть везде», есть верхушка «типо сильнейших», не зависит от защитников, но может заключать союзы. Вопрос Миколая «в чем её преступление?» (id 196059) прямого ответа не получил. Итог окна: «Вот этой нужно придумать / Их ней цель» (id 196062).</p>\n<p><strong>2024-07-04, id 196067–196107.</strong> Перебор мотивов. Рассмотрены и отвергнуты:</p>\n<ul>\n<li>узнать или повторить слияние двух измерений — отклонено самим Славой: «А нафиг им повторять слияния или обратная его делать / Когда обществом 2 миров вроде уже как то уживаются», «Там уже грубо говоря страны построены и все живут так нафиг им» (id 196069, 196079);</li>\n<li>обратить слияние вспять — предложено Миколаем через ненависть, «эта ненависть просто подпитывает их интерес / к тому чтобы обратить процесс» (id 196075–196077);</li>\n<li>сверхсущество — «Ну это тоже звучит говнисто» (id 196090), затем прямо «Сверх существо говно» (id 196106);</li>\n<li>инерция долгожителей: «ну это же люди / они ёбнутые / из истории легко пронаблюдать / царя нет, а они его ищут / им не удобно / некоторым наверняка лет по 200 / они уже привыкли к одному, ма такая смена вообще не кайф» (id 196081–196089) — отнесено Славой к тому же «говнисто».</li>\n</ul>\n<p>Предложены и не отклонены явно: «может у кого-то есть чисто научный интерес», «может у кого-то есть отвращение к челам из иного измерения» (id 196072–196073). Там же уточнено, что верхушка будет из современных и из фэнтези (id 196076). Открытый вопрос Миколая: их преступления связаны с двумя мирами «иди просто денег надо хз», «или ты хочешь чтобы они чет изобрели?» (id 196101–196103) — ответ «Да не знаю я» (id 196105).</p>\n<p>Хронология мира, зафиксированная попутно: война шла 8 лет, после войны прошло 10 лет, «Ну или меньше потом решим» (id 196087, 196093, 196097).</p>\n<p><strong>2024-07-04, id 196107–196111.</strong> Кай назван «Один из участников», дана его карточка и список огненных приёмов.</p>\n<p><strong>2024-07-04, id 196112–196123.</strong> Отвергнут ещё один мотив: «может захват власти» — «Нет» (id 196113–196114). Уточнение про распространённость: «Они не везде есть группа людей и все» (id 196123).</p>\n<p><strong>2024-07-05, id 198022–198041.</strong> Принадлежность Кая подтверждена: «Он состоит в той преступной организации». В этом окне сама организация не расшифрована — какая именно «та», не оговорено.</p>\n<p><strong>2024-07-09, id 201964–201990.</strong> Разграничение: на Асгарде роль преступной организации играет церковь, у сталкера просто криминальный остров, сама организация ни от кого не зависит и работает не на каждом острове, но общая.</p>\n<p><strong>2024-07-09, id 201991–202016.</strong> Появляется название: «Пресрог / Норм ?» — «гор серп / ахахпз / ну / норм». Формулируется определение (суверенитет, независимость от государств, существа обоих миров). Глава не выбран, в качестве варианта наброшен Колобок.</p>\n<p><strong>2024-07-09, id 202017–202024.</strong> Состав: Кай, Закон, Мазохистка. Мазохистка тут же отброшена.</p>\n<p><strong>2024-07-09, id 202025–202039.</strong> Повторно дана карточка Кая, уточнено «Человек с рогами / То бишь демон / Ну он не демон».</p>\n<p><strong>2024-07-09, id 202039–202062.</strong> Разобран Закон: обычный человек, расист, ненависть, иные расы для него рабы, убивает не всегда, своих не трогает, Кая одолеть не смог бы.</p>\n<p><strong>2024-07-09, id 202090–202101.</strong> Возврат к цели: «преступная команда / че там они делают то / я не понимаю» — «Не знаю / Мы цель не придумали». Тему сворачивают: «тогда от них опять уходим на другой остров? / или думаем» — «Уходим / В пустыню».</p>\n<p><strong>2024-07-09, id 202351–202359.</strong> Назван Температура — «И температура тоже», «Температура в престог», при этом «Не он одиночка / То бишь просто легенда».</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "GR-0026-S07", "GR-0026--probely"], "h": "<div class=\"gaps\"><ul>\n<li><strong>Цели у организации нет.</strong> Прямо зафиксировано дважды: «Вот этой нужно придумать / Их ней цель» (2024-07-04, id 196062) и «Мы цель не придумали» (2024-07-09, id 202096). Ни один из перебранных мотивов не выбран.</li>\n<li><strong>Главы нет.</strong> «кто глава / мы выбрали?» — «Не знаю» (2024-07-09, id 202008–202010). Единственный вариант — Колобок — не обсуждался дальше одного сообщения.</li>\n<li><strong>Состав верхушки не назван.</strong> Известно только, что она «типо сильнейших» и «как из современных как из фэнтези»; поимённо никто в неё не записан, и связь верхушки с известным составом (Кай, Закон, Мазохистка) в переписке не проведена.</li>\n<li><strong>В чём именно её преступление — не сказано.</strong> Вопрос Миколая «в чем её преступление?» (2024-07-04, id 196059) остался без ответа: следующая реплика Славы относится к другому.</li>\n<li><strong>Связаны ли их преступления с двумя мирами — не решено.</strong> «ну современным и фентези. их преступления связаны с этим / иди просто денег надо хз» — «Да не знаю я» (2024-07-04, id 196101–196105).</li>\n<li><strong>Мазохистка не раскрыта.</strong> Названа и отброшена в том же окне; никаких свойств, способностей и роли.</li>\n<li><strong>Статус Температуры неясен.</strong> «одиночка», «просто легенда» и «Температура в престог» в переписке не сведены; в ту же минуту прозвучало «Нет» без указания, к чему оно относится. Заметка справочника отмечает, что это, вероятно, карточка, из которой вырос Катапира (<a href=\"PS-0096.html\">Катапира</a>), но прямого подтверждения в базе нет.</li>\n<li><strong>Персонажи Миколая в организации не определены.</strong> «А остальные твой челики не знаю» (2024-07-04, id 196122).</li>\n<li><strong>Распространённость противоречива.</strong> «Ну может быть везде» (id 196054) и «Они не везде есть группа людей и все» (id 196123) — оба сказаны 2024-07-04, старое не отменено.</li>\n<li><strong>Одна и та же организация у сталкера или нет</strong> — вопрос «ну у сталкера та же?» (2024-07-09, id 201982) прямого «да/нет» не получил, ответ сместился на то, что у сталкера отдельный криминальный остров.</li>\n<li><strong>У Кая поле «Не любит» в карточке пустое</strong> в обеих версиях; приёмы в самой карточке помечены «Приемы потом», хотя списком даны отдельно.</li>\n<li><strong>Имя носителя способности «Закон»</strong> при её разработке (2024-03-12) не указывалось, и слабости способности тогда согласованы не были: предложение Миколая про слышимость Слава отклонил, а разбор Миколай прекратил сам («я не буду погружаться и усложнять», id 138218).</li>\n</ul></div>", "r": [["Катапира", "PS-0096.html"]]}, {"t": "Связи — всё вместе", "a": ["GR-0026--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0031.html\">Закон</a>, <a href=\"PS-0096.html\">Катапира</a>, <a href=\"PS-0111.html\">Кай</a></li>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0026.html\">Преступная организация</a>, <a href=\"MR-0036.html\">Пресрог</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0026--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0026.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0026-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0026/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первое, что чинить, — не цель организации, а её раздвоение в базе. Одна и та же организация лежит двумя записями: <code>MR-0026</code> («Преступная организация», 12,8 КБ базы) и <code>MR-0036</code> («Пресрог», 11,4 КБ). На каждую по четыре входящие ссылки, то есть восемь ссылок на один объект разошлись пополам, и статья сама вынуждена объяснять читателю, что это одно и то же. Пока записи не сведены, любая правка по организации делается дважды.</p>\n<p>Второе по цене — <code>ID-0080</code> («Группа сверхлюдей (ГГ)»): две ссылки, статьи нет, 1,8 КБ базы. Это те, против кого Пресрог должен работать: организация и группа сверхлюдей названы в одном обмене репликами 2024-07-03 как ответ на вопрос «так а кто гг вообще». Цель организации не придумывается в пустоте — её не к чему привязать, пока противоположная сторона не описана. Материала там мало, но дыра блокирующая: она держит главный пробел статьи.</p>\n<p>Третье — участники без записей. Мазохистка не заведена нигде. Температура своей записи не имеет, хотя назван участником прямым текстом.</p>\n<h3>С чего начать</h3>\n<p>По Температуре — сначала в базу, не в архив. Рядом лежит <code>SP-0068</code> («Повышение температуры»): 12,2 КБ базы и ноль входящих ссылок, вселенная та же. Двенадцать килобайт материала, на который никто не ссылается, при том что статья прямо ищет, что такое Температура. Вторая версия справочника ведёт к <code>PS-0096</code> (Катапира, 17,4 КБ) — проверять надо обе, и сначала <code>SP-0068</code>, потому что нулевые ссылки означают, что этот кусок вообще ни к чему не подшит.</p>\n<p>По цели организации — в архив, и адрес известен точно. Разговор дважды подходил к ней и дважды сворачивал: 2024-07-04 итог окна «Вот этой нужно придумать / Их ней цель» (id 196062) и 2024-07-09 «Мы цель не придумали» с уходом «В пустыню» (id 202096–202101). Искать надо после 2024-07-09, по окнам про пустыню — если цель где-то всплыла, то там, а не раньше.</p>\n<p>По Мазохистке архив бесполезен: её назвали и в том же обмене закрыли («Да забудь о ней её сразу убьют после её появления», id 202021). Это не потеря, это отказ.</p>\n<h3>Как развивалось</h3>\n<p>2024-07-03 организация заявлена одной фразой в ответ на вопрос про главного героя. 2024-07-04 её обстроили свойствами — суверенитет, независимость от островов и защитников, верхушка — и тут же уперлись в вопрос «в чём её преступление?», который прямого ответа не получил. Дальше пошёл перебор мотивов, и все были отвергнуты: повторить слияние, обратить слияние, сверхсущество, инерция долгожителей, захват власти. Итог окна — цель надо придумать.</p>\n<p>2024-07-05 подтверждена принадлежность одного участника. 2024-07-09 организация получила имя, определение, состав из трёх позиций (одна из которых тут же отброшена) и подробный разбор двух персонажей — то есть за один вечер обросла всем, кроме того, чего не хватало с самого начала. В конце того же вечера к цели вернулись третий раз и свернули снова.</p>\n<p>Свойство «везде или не везде» решалось дважды в один день с разным исходом, и старое не отменено.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Разграничение «где Пресрог, а где не Пресрог» проведено для двух островов и названо прямо: на Асгарде роль преступной организации играет церковь, у сталкера — просто криминальный остров, отдельная территория наёмников. Оба раза это не отговорка, а решение: место занято чем-то своим. При этом сказано, что организация работает «Не на каждом» острове, но общая. Для остальных островов такого же разграничения нет — ни где она есть, ни что стоит вместо неё там, где её нет. Для двух случаев правило названо, для прочих того же рода — не проговорено.</p>\n<h3>Отклик</h3>\n<p>Понравился Закон — не как персонаж организации, а как деталь. Его способность придумана 2024-03-12, за четыре месяца до самой организации и вне всякой связи с ней, и села в неё без единой переделки. И внутри способности есть по-настоящему хорошая мелочь: «там без разницы услышал ты или нет пока не покинул радиус действия» — закон действует границей, а не словом, слышимость к делу не относится. Это уже не «сказал и все подчиняются», это территория. Плюс бытовая логика вокруг него: расист, который своих не трогает, — и не из принципа, а потому что «Он бы и не смог его убить или победить». Живее, чем весь перебор мотивов организации, который занял целое окно и кончился ничем.</p></div>", "r": []}];</script>
