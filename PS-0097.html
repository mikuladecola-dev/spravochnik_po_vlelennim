<script>const BASE="";const DOCNAME="Сталкер";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0097-S01", "PS-0097--proishozhdenie"], "h": "<p>Персонаж Славы. Возник (2024-06-21, id 185079–185095) в момент, когда соавторы разбирали способности для новых персонажей: Слава берёт себе огонь, Миколай в той же реплике объявляет, что у него «будет костяной». Тут же Слава предлагает расширить систему характеристик: «Добавим ещё один стать меткость» — и следом присылает готовую карточку персонажа.</p>\n<p>Имя как таковое персонажу не давалось: в карточке стоит «Имя: сталкер ( ну кличка)». То есть Сталкер — кличка, настоящее имя в переписке не названо.</p>\n<p>В обсуждении семи островов (2024-07-03, id 194785–194794) Миколай выдвигает его в защитники одного из островов, называя не по кличке, а описательно — «тот пламенный перс». Слава уточняет: «Или ты про сталкера ?», Миколай подтверждает. Слава отвечает: «Ну можно, ну он уже наемник хотя можно» — то есть согласие даётся с оговоркой, что персонаж уже занят другой ролью.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0097-S02", "PS-0097--vneshnost"], "h": "<p>По карточке (2024-06-21, id 185093; повторена дословно 2024-07-09, id 202138): «мужчин лет 40 в маске( виде кибер маски, ты поймёшь надеюсь) на все лицо; в плаще, а под ним черная, серая форма». Маска закрывает всё лицо, вид маски — кибер; Слава оставил уточнение на усмотрение соавтора, отдельного описания маски в переписке нет.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0097-S03", "PS-0097--harakter"], "h": "<p>Из карточки: «Черты характера; спокойный, хладнокровные; не питает не кому ненависти, но убивает по заказу».</p>\n<p>Отдельными строками карточки заданы вкусы:</p>\n<ul>\n<li>любит — «сладкая и травяной чая»;</li>\n<li>не любит — «поломку оружия».</li>\n</ul>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0097-S04", "PS-0097--sposobnosti"], "h": "<p>Стихия — огонь.</p>\n<p>Характеристики (карточка 2024-06-21, id 185093, без изменений повторена 2024-07-09, id 202138):</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Характеристика</th>\n<th>Значение</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Сила</td>\n<td>6</td>\n</tr>\n<tr>\n<td>Скорость</td>\n<td>7</td>\n</tr>\n<tr>\n<td>Ловкость</td>\n<td>8</td>\n</tr>\n<tr>\n<td>Меткость</td>\n<td>10</td>\n</tr>\n<tr>\n<td>Выносливость</td>\n<td>6</td>\n</tr>\n<tr>\n<td>Контроль</td>\n<td>8</td>\n</tr>\n</tbody>\n</table></div>\n<p>Меткость 10 — максимум среди его статов; сама характеристика «меткость» была введена в систему в этом же разговоре и ради него.</p>\n<p>Оружие: «снайперская винтовка; 2 пистолета; нож армейский».</p>\n<p>Инструмент: «глаза ( тепловой видение )» — тепловое зрение.</p>\n<p>Приёмы, три штуки, дословно по карточке:</p>\n<ol>\n<li><strong>Огненная пуля</strong> — «его снайперская винтовка и пистолеты особой оружея под него у них нет патронов, он сам делает их с помощью огня и стреляет ими из оружия при попадания взрывается». То есть его оружие сделано под него и патронов не имеет: боеприпас он создаёт огнём сам, при попадании пуля взрывается.</li>\n<li><strong>Огненные цепи (из ладони)</strong> — «может из огня сформулировать цепь и контролировать его на расстояний, защищаясь ими или атакуя, или делать как человек паук». Три применения: защита, атака и перемещение по-человеку-пауку.</li>\n<li><strong>Подземный ад</strong> — «прижимает руки к землёй, и из земли в радиусе 100 метров вырывается огненненый колы, протыкая противника».</li>\n</ol>\n<p>Оценка силы персонажа соавторами (2024-07-09, id 202140–202144): Слава — «Он через чур слабый», «По сравнению с другими», Миколай — «кстати да». Сравнение, которое приводит Слава: «Избранный азуенная способность / Имитатор глазки / Наур сосуд самый мощный», а «сталкер как говно».</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0097-S05", "PS-0097--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Защитники островов</strong> — кандидат в защитники, выдвинут Миколаем (2024-07-03), снят с этой роли (2024-07-09).</li>\n<li><strong>Пректри (остров-пустыня) / Остров сталкера</strong> — остров, к которому он был привязан как защитник, а после снятия остался просто местом его жизни. Миколай спрашивает «сталкер там живёт?», Слава: «Да» (2024-07-09, id 202349–202350).</li>\n<li><strong>Избранный (<a href=\"PS-0106.html\">Защитник Асгарда (Избранный)</a>), Имитатор, Нуар</strong> — другие защитники, на фоне которых он признан слабым (2024-07-09, id 202143).</li>\n<li>Карточка «Связано с» в базе перечисляет также: Антон, Зурбон, Катапира, Огонь, Система характеристик персонажей, Текси. Содержание этих связей в приведённых кусках переписки не раскрыто.</li>\n</ul>\n<p>Гильдий у наёмников нет: «Гильдий нет он одиночка» (2024-07-09, id 202164). Кто конкретно его нанимает — не названо, сказано только, что «Его находят и просят кого то устранить» (id 202162).</p>", "r": [["Защитник Асгарда (Избранный)", "PS-0106.html"]]}, {"t": "Как менялся", "a": ["S06", "PS-0097-S06", "PS-0097--kak-menyalsya"], "h": "<p><strong>2024-06-21 (id 185079–185095).</strong> Создание. Полная карточка: кличка, вкусы, шесть характеристик, оружие, инструмент, внешность, стихия огонь, три приёма, черта характера. Роль — «убивает по заказу», то есть изначально наёмник.</p>\n<p><strong>2024-07-03, около 19:06 (id 194785–194794).</strong> Миколай включает его в список кандидатов в защитники островов, третьим пунктом: «1. блуждающий огненный гриб / 2. дриада великан / 3. тот пламенный перс / 4. юкиона с миниганом в котором снаряд сосульки». Слава соглашается с оговоркой про уже имеющуюся роль наёмника.</p>\n<p><strong>2024-07-03, около 20:04 (id 194962–194979).</strong> Описывается его остров — «анархичное государство»: «это хаос полный», «каждый сам за себя», «гетто», «банды», «преступность», «убийства». Дальше идёт оговорка: «ноооо там пиздец жарко поэтому там это всё редко происходит», а «если они попадут к другим, то они будут как звери» и станут «хватать базовые для жизни вещи».</p>\n<p><strong>2024-07-09, 22:34 (id 202135–202140).</strong> Слава заново присылает ту же карточку целиком, без изменений, и сразу за ней даёт вывод: «Он через чур слабый».</p>\n<p><strong>2024-07-09, 22:35–22:37 (id 202140–202156).</strong> Признан слишком слабым в сравнении с другими защитниками. Слава ставит выбор: «Нужно его прокачать или вместо него поставить другого?». Миколай выбирает второе: «другого надо💔», и добавляет: «его в этой вселенной не будет пожалуй».</p>\n<p><strong>2024-07-09, 22:37–22:39 (id 202154–202170).</strong> Пересборка роли сразу после снятия. Слава: «Будет как наемник». Миколай спрашивает, кто нанимает — «он просто так предлагает услуги или есть гильдия». Слава: «Его находят и просят кого то устранить», «Гильдий нет он одиночка». Миколай: «он пользуется славой, о нем хотят легенды?» — Слава: «Да». Параллельно Миколай объясняет, зачем на место защитника нужен новый персонаж: «ну как раз силу показать. мол настолько сильный и достойный защищать город», «раз там правит сила».</p>\n<p><strong>2024-07-09, 22:58–23:00 (id 202344–202362).</strong> Уточнение положения на острове. Контакты с внешним миром у острова есть — «Там дохуя наемников ,будут». Сталкер живёт там же. Миколай: «он один из глав или на подсосах» — Слава: «Не он одиночка / То бишь просто легенда». В главы кланов он не входит.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0097-S07", "PS-0097--chto-s-nim-stalo"], "h": "<p>С поста защитника острова снят (2024-07-09). Реплика Миколая «его в этой вселенной не будет пожалуй» тут же оспорена дальнейшим ходом разговора: персонаж остался во вселенной, но не как защитник, а как наёмник-одиночка, живущий в пустынном острове. Гильдии он не принадлежит, к главам кланов не относится, пользуется славой, о нём ходят легенды — «просто легенда».</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0097-S08", "PS-0097--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Настоящее имя не названо, есть только кличка.</li>\n<li>Кто его нанимает конкретно — не сказано, механика только «его находят и просят кого то устранить».</li>\n<li>В окне w0041 (2024-07-03) сам персонаж не описывается: он упоминается как уже известный обоим соавторам.</li>\n<li>Вопрос «нового перса или из тех кто есть?» на место защитника острова в приведённом куске остался без ответа: Миколай отвечает «мммм» и переходит к другому.</li>\n<li>Реплика Миколая «ну я бы нового ввёл символичного» и вопрос Славы «В чем символика ?» дают ответ про силу и власть силы на острове, но кто именно стал новым защитником вместо Сталкера — в этих кусках не названо.</li>\n<li>Связь с Антоном, Зурбоном, Катапирой и Текси значится в базе, но в приведённых кусках переписки не раскрыта.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0097--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0030.html\">Защитники островов</a></li>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0106.html\">Защитник Асгарда (Избранный)</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0106.html\">Защитник Асгарда (Избранный)</a></li>\n<li><strong>Упомянут в мирах:</strong> <a href=\"MR-0023.html\">Остров сталкера</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0030.html\">Защитники островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0097--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-06-21</td>\n<td>185079–185095</td>\n<td>w0038</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-03</td>\n<td>194785–194794</td>\n<td>w0041</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-03</td>\n<td>194962–194979</td>\n<td>w0041</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-09</td>\n<td>202135–202140</td>\n<td>w0046</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-09</td>\n<td>202140–202156</td>\n<td>w0046</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-09</td>\n<td>202154–202170</td>\n<td>w0046</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-09</td>\n<td>202344–202362</td>\n<td>w0046</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0097-stalker.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0097--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0097.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
