<script>const BASE="";const DOCNAME="Ден";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0353-S01", "PS-0353--proishozhdenie"], "h": "<p>Персонаж истории «Цена жизни», выложенной Славой одним куском (2026-02-16, id 433706–433713, окно w0118). Текст был написан не в день публикации: на вопрос Миколая «это ты когда успел?» Слава ответил «На прошлое недели». Собственная оценка автора сразу после публикации — «Просто хуйня».</p>\n<p>Замысел, который Слава назвал следом: «Просто я подумал о разногласий», «Точнее чувство виновности и цены жизни. Я хотел написать историю о персонажей, что говорит о том что не виновен и представляет вполне разумный доводы ну мстительный дух его всё равно заебыввет». Ден в тексте — та сторона разногласия, которая приводит доводы; связан ли он с фигурой «того, кто говорит, что не виновен», в переписке не сказано.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0353-S02", "PS-0353--vneshnost"], "h": "<p>«Мужчина с каштановыми волосами». Больше о внешности ничего не сказано — возраст, рост, одежда не названы.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0353-S03", "PS-0353--harakter"], "h": "<p>Позиция Дена в сцене — «решить всё как цивилизованный людей». Он оспаривает право Бена решать в одиночку: «Ты не можешь просто взять и единолично решить принять решение, о чужой жизни».</p>\n<p>Доводы, которые он приводит в защиту подростка-убийцы:</p>\n<ul>\n<li>«он не желал ему смерть. Это вышло случайно»;</li>\n<li>«Он же говорил, что хотел лишь подшутить»;</li>\n<li>«да и он же ещё ребёнок» — сказано «взмолился Ден»;</li>\n<li>«то что пацани ещё ребёнок. Он не до конца осознаёт свои действия. Поэтому ему надо дать второй шанс. Тем более это не он убил Криса».</li>\n</ul>\n<p>Последняя реплика внутренне расходится с остальной сценой: Бен спорит о судьбе того, кто «отнял чужое будущее», а Ден в этой же фразе говорит, что убил Криса не он. Как это соотносится, в переписке не разъяснено.</p>\n<p>Ден не отрицает наказания как такового: «Бен мы его накажем. Только не так, как хочешь ты». Основание его позиции — отсутствие права судить: «потому что мы с тобой не имеем права судить» и «совет принят объективное решение».</p>\n<p>Реакция на насилие со стороны Бена: когда тот прижимает его голову к голове трупа, Ден рычит («Бен какого!») и «Из-за всех сил держась, чтобы не приблизиться к мёртвому лицу». Труп он опознаёт неуверенно и с криком: «-д-да??», «-....Крис!?».</p>\n<p>Последняя характеристика Дена в сцене дана устами Бена: «ты не остановишь меня своими словами. Тем более когда ты сам в них не до конца веришь». Ответа Дена на это в тексте нет — сцена на этом обрывается.</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0353-S04", "PS-0353--svyazi-s-drugimi"], "h": "<ul>\n<li>Бен (<a href=\"PS-0354.html\">Бен</a>) — второй участник спора. Отношения в сцене: обращаются друг к другу по имени, без пояснения, кем приходятся друг другу; Бен тыкает Дену пальцем в грудь, хватает за плечо, ведёт в здание с трупами, прижимает его голову к голове Криса. Ден ему при этом не отвечает силой. Кем они друг другу приходятся — коллеги, сослуживцы, друзья — в переписке не сказано.</li>\n<li>Крис (<a href=\"PS-0355.html\">Крис</a>) — погибший, чей труп Бен показывает Дену. Знаком ли Ден с Крисом до сцены, не сказано; он опознаёт его в лицо.</li>\n<li>Подросток-убийца — персонаж, о котором идёт спор; в тексте не назван по имени и не появляется. Ден его защищает, Бен собирается расправиться.</li>\n<li>Совет — инстанция, на которую Ден ссылается: «совет принят объективное решение». Что это за совет, из кого состоит и какое именно решение принял, не сказано.</li>\n</ul>", "r": [["Бен", "PS-0354.html"], ["Крис", "PS-0355.html"]]}, {"t": "Как менялся — состояния по датам", "a": ["S05", "PS-0353-S05", "PS-0353--kak-menyalsya"], "h": "<p><strong>2026-02-16 (id 433706–433713), версия 1.</strong> Единственное состояние. Первое и единственное появление в тексте: позиция «второй шанс», спор с Беном, сцена у трупа Криса. Дальнейших правок и обсуждений персонажа в переписке нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0353-S06", "PS-0353--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Дальнейшая судьба Дена не описана — сцена обрывается репликой Бена, продолжение не написано.</li>\n<li>Кем Ден работает, какое положение занимает и почему участвует в решении чужой судьбы, не сказано.</li>\n<li>Отношения между Деном и Беном не названы.</li>\n<li>«Совет» упомянут один раз, состав и полномочия не названы.</li>\n<li>Мир, в котором происходит действие, не описан; единственная зацепка — слова Бена «когда мы дохнем как мухи, чтобы хоть что-то защитить», из которых устройство мира не восстанавливается.</li>\n<li>В следующем окне (w0119, история «Сумасшедший где-то?») тоже действует Ден — командир отряда. Тождество этих персонажей не заявлено; авторы вопрос не поднимали.</li>\n<li>Как реплика «Тем более это не он убил Криса» согласуется с остальным спором, осталось нерешённым.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0353--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0354.html\">Бен</a>, <a href=\"PS-0355.html\">Крис</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0354.html\">Бен</a>, <a href=\"PS-0355.html\">Крис</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0084.html\">Отряд Дена (семеро в масках, сборщики)</a>, <a href=\"GR-0086.html\">Совет</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0353--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-02-16</td>\n<td>433706–433713</td>\n<td>w0118</td>\n<td>Иссекай (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0353-den.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0353--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0353.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
