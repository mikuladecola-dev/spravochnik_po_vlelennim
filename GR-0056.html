<script>const BASE="";const DOCNAME="Апостолы (21 апостол; «насекомые»)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0056-S01", "GR-0056--chto-eto"], "h": "<p>Апостолы — группа из 21 существа во вселенной Оам, связанных между собой телепатически. Слава формулирует это так: «Апостол в данной вселенной это опять группа лиц из 21 человека телепатически связанный друг с другом» (2025-10-22, id 377625). Слово «опять» отсылает к прежней вселенной, где апостолы уже были группой из 21 — там они были людьми, получившими благословение правителя рая; в Оам определение переписано дважды.</p>\n<p>В Оам у группы два состояния определения, и второе не отменяет первое молча, а заявлено прямо.</p>\n<p>Первое (2025-10-20, id 376401): апостолы — мутанты, то есть люди. «Апостолы- это люди, у которых в утробе матери мутировало нервную систему мозг и глаза. Из-за этого их ней пять чувств, работоспособность мозга, реакция, точность выше чем у обычного человека в несколько раз».</p>\n<p>Второе (2025-10-22, id 377616–377643): «Кстати вернём старых апостолов. Они насекомые произошли от неизвестного мутировшого существа». На уточняющий вопрос Миколая Слава сначала повторяет мутационную версию («Ну в этой вселенной апостолы это проста люди у которых мутировала под воздействием Оам нервная связь и мозг», id 377623), а следом выкладывает старое описание целиком: «Но это не люди, это насекомые. Всё двадцать один апостол вылезли из разных коконов. И по своё природе не являются людьми. Хоть и очень на них похоже» (id 377625) и добавляет: «Ну только в вселенной Оам» (id 377627). Происхождение — «21 от неизвестного мутировшего существо» (id 377631), причём само существо «мутировал из-за воздействием Оам» (id 377633), по общему правилу вселенной: «Все монстры это мутированный под воздействием Оам» (id 377634).</p>\n<p>Слово «насекомые» — не описание тела: «Насекомые это апостолы который выглядит как люди. (Насекомые я назвал их по приколу)» (2025-10-22, id 377643). Внешне и в поведении они люди: «Выглядят полностью как люди», «Они говорят» (2025-10-03, id 370751–370752).</p>\n<p>Апостолы названы расой и одновременно сообществом: «Апостолы 21 вторая по силе раса на земле» (2025-11-17, id 385768; повтор 2025-12-06, id 393287). При этом внутри группы связь личная, а не только видовая: «Здесь апостолы дорожат друг другом больше всех» (id 377625), друг для друга они братья и сёстры (2025-12-06, id 393476).</p>\n<p>Отдельно фиксируется расхождение в числе: служебная карточка базы называется «Список 12 апостолов», тогда как в Оам их 21 (id 385768, 393287). В переписке это расхождение не обсуждается; сокращение с 21 до 12 происходит позже и в другой вселенной (см. «Как менялась»).</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0056-S02", "GR-0056--sostav"], "h": "<p>Поимённый состав всех 21 апостола в переписке не собран ни разу. Слава прямо говорит об этом: «Как бы их 21 один и я не всех придумал» (2025-12-17, id 399540).</p>\n<p>Участники с карточками в базе:</p>\n<ul>\n<li><a href=\"PS-0383.html\">Имитатор</a> — Имитатор (Имит). «Имит это Имитатор. Только сокращена» (2025-12-06, id 393474). Апостол (id 393455), для правительства — представитель всей группы (id 393480), «фигура старшего брата среди апостолов» (2026-06-07, id 488545).</li>\n<li><a href=\"PS-0323.html\">Граф</a> — Граф. Апостол, «высокомерный и беспечный апостол, что веселиться», король преступного мира, способность — власть (2025-12-06, id 393298).</li>\n<li><a href=\"PS-0171.html\">Палач</a> — Палач. «апостол, который сильнейший в ближнем бою» (2025-11-05, id 382099).</li>\n<li><a href=\"PS-0182.html\">Агрегат</a> — Агрегат. Апостол; в Оам упомянут в связке с Графом и Защитником как персонаж с уже придуманной судьбой (2025-12-06, id 393478).</li>\n<li><a href=\"IS-0017.html\">Защитник</a> — Защитник. «апостола, который по сути сошёл с ума когда умер его ребенок» (2025-12-06, id 393473).</li>\n<li><a href=\"PS-0326.html\">Бессмертный апостол</a> — Бессмертный апостол (в списках — «Бессмертный выродок»). Вынесен за скобки общего высокомерия расы (2025-12-06, id 393293).</li>\n</ul>\n<p>Ещё один апостол назван в Оам-обсуждениях без отдельной карточки — Звездочёт: вместе с Имитатором он исключение по дальности чувств (2025-10-03, id 370842), и его способность «полотно созидания» упомянута позже (2026-06-07, id 488545).</p>\n<p>Кроме того, в разговоре о технике боя назван апостол Маура: «уродливая маска апостол со способностью вибрация» (2026-06-07, id 488545).</p>\n<p>Списки апостолов, которые авторы выкладывали, относятся к другим вселенным и к разным датам; они не схлопываются в один перечень.</p>\n<p>Список из 14 позиций (2025-05-14, id 325799, вселенная «Апостол»):</p>\n<ol>\n<li>Имитатор (ветреной; электро; птичка)</li>\n<li>Агрегат (теневые братья; экстримал; страдалец)</li>\n<li>Разрушительница (огненная)</li>\n<li>Палач (тварь)</li>\n<li>Защитник (ангел)</li>\n<li>Дитя света (военный)</li>\n<li>Бессмертный выродок</li>\n<li>Хулиган (слайм)</li>\n<li>Вибрация</li>\n<li>Ученица???</li>\n<li>Масочник</li>\n<li>Сон</li>\n<li>Небесная</li>\n<li>Маэстро</li>\n</ol>\n<p>Пункт 10 записан самим автором как «Ученица???» — то есть оставлен нерешённым.</p>\n<p>Список из 12 позиций, 10 заполнено (2026-01-31, id 426512): 1 Имитатор, 2 Агрегат, 3 Защитник, 4 Бессмертный выродок, 5 Граф, 6 Вибрация, 7 Масочник, 8 Звездачет, 9 Небесная, 10 Палач, 11 пусто, 12 пусто. Миколай докидывает два рабочих названия — «липкий», «иссушающий» — и сам помечает их: «пока как заполнение» (id 426535, 426563). На вопрос «Че за липкий» (id 426554) ответа в переписке нет.</p>\n<p>Тот же список через девять дней (2026-02-09, id 430400): 1 Имитатор, 2 Агрегат, 3 Защитник, 4 Бессмертный выродок, 5 Граф, 6 Вибрация, 7 пусто, 8 Звездачет, 9 Небесная, 10 Палач, 11 Кура, 12 Избранный. Позиция 7 (прежде Масочник) опустела, две прежде пустые заполнены.</p>", "r": [["Имитатор", "PS-0383.html"], ["Граф", "PS-0323.html"], ["Палач", "PS-0171.html"], ["Агрегат", "PS-0182.html"], ["Бессмертный апостол", "PS-0326.html"], ["Защитник", "IS-0017.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0056-S03", "GR-0056--obschie-sposobnosti-gruppy"], "h": "<p><strong>Телепатия между собой.</strong> Заявлена как то, что делает их группой: «телепатически связанный друг с другом» (id 377625). Связь с рождения: «Они телепатически связанные друг с другом самого рождения» (2025-10-03, id 370827). В более ранней редакции механика расписана подробнее: «У апостолов есть дополнительная способность. Телепатия между ними. ( они способны разговаривать. На расстоянии и также всем мести. Они также могут отказаться от телепатического общения и прервать разговор)» (2025-05-31, id 331635; повтор 2025-10-18, id 375849).</p>\n<p><strong>Белые глаза.</strong> Общая способность всей расы, заведённая специально как то, что есть у каждого: «Для расы апостолов нужно дать какую-ту уникальную способность. Именно всём апостолом» (2025-09-17, id 366109). Итоговая формулировка (2025-09-17, id 366117; дословно повторена 2025-10-03, id 370767 и 2025-10-20, id 376401–376402):</p>\n<p>«После активации белых глаз то для них время замедляется ( но они не становятся быстрее) и всех их чувства в улучшаются и они становятся сверх чувствительными. Зрения слух осязания запах и вкус. Из-за и боль они ощущают больнее. Но зато у них словно всё на ладони они ощущать и видят всё что находиться вокруг. И способны словно предсказывать движение противников по слуху или зрению. И становятся невероятно точными».</p>\n<p>Ограничение прописано тут же: «Но опять же долго держать включёнными такое восприятия они не могут. Мозг просто не выдержит такое большое количество информации и нагрузки».</p>\n<p>В Оам активация привязана к энергии мира: «Также они могут использовать белый глаза направив туда Оам» (2025-10-20, id 376401). Позже добавлено, что белые глаза — один из трёх типов глаз в мире: «Первые белые апостола. Способны видеть оэм ну ещё чего-нибудь» (2025-12-04, id 392478).</p>\n<p><strong>Базовый уровень без активации</strong> (2025-09-17, id 366117): «они физ. Сильный, быстрые, крепкий и владеют повышенной регенерацию ( ну не прям сверхрегенерацию, просто наверное раза 3 быстрее разный заживают) и владеют реакцию превосходящие любого человека. плюсом апостол может приспосабливаться к окружающей среде ну не прям сильно. А и они выносливый они могут обходиться без сна и чтобы на них это не как не влияло 3 дня».</p>\n<p><strong>Числовые пределы</strong> (2025-10-03, ответы на вопросы Миколая, id 370838–370851): слух — 100 м, запах — 100 м; чувствуют «Температуру воздуху и давлению»; без воды — 7 (единица в ответе не названа), без воздуха — 3 минуты. На вопрос, могут ли почувствовать происходящее в России, находясь в Австралии, ответ «Да» относится к исключению: «Имитатор и звездочёт могут . Но если сконцентрируется» (id 370842).</p>\n<p><strong>Контроль Оам.</strong> «Обуздать Оам они могут без поглощения огромного количества Оам. Им достаточно пережить одну эмоциональную ситуацию, и они неосознанно воспользуются Оам. И дальше они могут пользоваться им без проблем» (2025-10-20, id 376401). Итог там же: «Как ясно они у них лучший контроль Оам» (id 376402).</p>\n<p><strong>Повышенный эффект адаптации.</strong> Требование заявлено как следствие того, что мутация затронула не всё тело: «Просто если у них развита только мозг и нервная связь. Они не смогут в моей голове сражаться полноценная. ( эффект адаптации повышенный у них должен быть)» (2025-10-22, id 377617). Сама механика адаптации не описана. Рядом — общая оговорка о природе: «Люди рождаются по другому. А апостолы вообще по другому и они куда более адаптивный существа» (2025-10-03, id 370765).</p>\n<p><strong>Постоянно действующие силы.</strong> «И они как арбетары. Если сжечь лес он будет гореть не переставая. То есть их ний силы постоянные ( конечно с некоторыми условностями) но они могут сами вырубить огонь» (id 377625). В версии от 2025-10-03 это же названо коротко: «Ну их способность постоянная рубрика» (id 370825).</p>\n<p><strong>Старение и жизненный цикл.</strong> «теперь у них замедленная старения ( точнее они словно замерзают в каком-то возрасте( в рандомные возраст )» (id 377625); проще — «Просто они перестают расти» (2025-10-03, id 370832). Этапы выписаны отдельно (2025-10-22, id 377626): «Они вылупились из кокона, а потом росли с нормальной скоростью. И в рандомные момент для них замирает время». Все 21 — от одного источника и родились одновременно (2025-10-03, ответы «Одного», «Да», «Да», id 370834–370836).</p>\n<p><strong>Дети.</strong> «И у некоторых есть дети (обычный) дети апостолов рождаются обычными» (2025-10-03, id 370756). Позже повторено: «Дети апостолов не являются апостолыми. Они обычные люди» (2025-12-06, id 393468).</p>\n<p><strong>Возможность придумывать себе новые способности.</strong> В формулировке от 2025-09-12 (id 364808) есть абзац, которого нет в оамовском повторе того же текста: «И во вторых теперь у них не по одной способности. Так как они по сути могут сами придумать новую способность. Но всё же они стараються делать упор в определённый способности. Ну не считая Имита».</p>\n<p><strong>Техники, которым обучены</strong> (2026-06-07, id 488545–488546, в переработке под новый мир): «Большинство апостолы тоже им обучены оу и материализация, но материализация слишком опасная, долгая, и не эффективная и ты так же не можешь использовать её вместе со своей способностью. Поэтому кроме Имета их никто и не использует. Ну возможно кто-нибудь из апостолов оу может иногда применить, но материализацию точно нет. Сдохнут ведь, даже если апостолы».</p>\n<p><strong>Чего апостолы не умеют</strong> (сказано в редакции вселенной «Апостол», 2025-03-13, id 301867): «Я же говорил вроде апостолы не способны лечить и влиять на разум», и следом — «Благословенный вообще все».</p>", "r": []}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0056-S04", "GR-0056--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p><strong>У каждого своя способность.</strong> В редакции с благословением правителя рая это объяснено механикой: «У нас апостолов в отличие от всех. Способность формируется. То бишь у каждого апостола уникальная способность. У других же благословенных одним правителем. Одинаковые способности» (2025-03-19, id 305857); подробнее — «правитель рая. Посылает им лишь сгустки чистой и необработанной силы, который формируется во что уже только внутри Апостолов. Даруя им уникальные способности» (2025-05-31, id 331635). Отдельная способность каждому оказалась и ограничителем численности: «Проблема была в способностях, я для каждого придумывал отдельную способность, Из-за чего ограничивал их число» (2026-04-25, id 466535).</p>\n<p><strong>Имитатор (Имит).</strong> Исключение из правила о специализации: остальные «стараються делать упор в определённый способности. Ну не считая Имита» (2025-09-12, id 364808). Вместе со Звездочётом — исключение по дальности чувств (2025-10-03, id 370842). Для правительства — представитель апостолов (2025-12-06, id 393480). «фигура старшего брата среди апостолов. Архетип учёного. У него гибкая программа в голове. То есть когда у всех программа способности в голове закоренелая. То у него она податливая и гибкая» (2026-06-07, id 488545). Единственный, кто применяет материализацию, и единственный, кто комбинирует особое усиление со способностью: «Ты не можешь их комбинировать. Никто не может, кроме Имета» (там же). Он же научил стилю вибрации Мауру.</p>\n<p><strong>Граф.</strong> «Он высокомерный и беспечный апостол, что веселиться. У него своя банда ( просто для развлечения) грубо говоря он король преступного мира. Его способность власть. Контроль всего, что есть в определенном радиусе. Достаточно силён, чтобы разнести гору, плюсом он быстрейший апостол ( хотя этот титул носит другой Апостол. Ну по факту он быстрее)» (2025-12-06, id 393298). Кто носит титул быстрейшего — не названо.</p>\n<p><strong>Палач.</strong> «апостол, который сильнейший в ближнем бою» (2025-11-05, id 382099). Позже, в другой вселенной: «В ближнем бою он почти сильнейший» и «сильнейший апостолы это Граф и Палач» (2026-06-02, id 487176).</p>\n<p><strong>Бессмертный.</strong> Единственный, кого автор выводит из общего свойства расы: апостолы высокомерны, «Ну кроме бессмертного ( у него как бы не все в порядке с мозгами если ты помнишь)» (2025-12-06, id 393293).</p>\n<p><strong>Защитник.</strong> «апостола, который по сути сошёл с ума когда умер его ребенок, и в какой-то момент полностью откажется от своей человеческой натуры» (2025-12-06, id 393473). Задача персонажа сформулирована позже: «Защитник (один из апостолов) должен будет отказаться от человечность ( что плачет в нём и чувствует вину, что не уберёг семью) но что произойдет когда он откажется от человечности» — вопрос оставлен без ответа (2025-12-17, id 399521).</p>\n<p><strong>Агрегат, Граф, Защитник.</strong> «Вообще у Агрегат, Графа и Защитника Судьба предрешена. Ну я то есть придумал их ней путь» (2025-12-06, id 393478). Сам путь в переписке не изложен.</p>\n<p><strong>Возраст.</strong> На вопрос «сколько сейчас лет им?» ответ — «Ну в моей истории 43», с уточнением «Точнее в моей бошке» (2025-10-03, id 370766–370769). Позже возраст поднят: «Давай изменим возраст апостолов теперь им за 40» — и тут же расписано, как это скрывается у каждого: «Звездочёт живёт отдельно от родителей, да и под бинтами не особо видно изменение. Не видно старый он или нет. Агрегат уехать путешествовать. Но когда будет возвращаться домой. То будет отшучиваться, типа гены у него хорошие. Родителем граф вобще пофиг ( только они желают что бы он поскорее дал потомство из-за его способности)» (2026-06-07, id 488439).</p>\n<p><strong>Характер как общее свойство с исключениями.</strong> «Плюсом они высокомерны, хотя прямо этого не показывать. Ну они как бы с рождения лучшей людей, поэтому в полне ясно почему они высокомерные» (2025-12-06, id 393293). Про Имитатора отдельно: «он правда высокомерен, высокомерно любого из апостолов» (2026-04-19, id 462201).</p>", "r": []}, {"t": "Иерархия", "a": ["S05", "GR-0056-S05", "GR-0056--ierarhiya"], "h": "<p>Внутри группы иерархия как таковая не назначена. Названы отдельные роли:</p>\n<ul>\n<li>Имит — представитель апостолов в отношениях с правительством: «Так как для правительства. Представитель Апостоловы именно Имит» (2025-12-06, id 393480).</li>\n<li>Имит — «фигура старшего брата среди апостолов» (2026-06-07, id 488545).</li>\n<li>Сильнейшие: «Что сильнейший апостолы это Граф и Палач» (2026-06-02, id 487176). В более ранней записи Граф назван вторым из трёх сильнейших существ мира (2025-12-06, id 393298).</li>\n<li>Обращение друг к другу — как к родне: Имит любит дочь «Также сильна как и своих братьев и сестёр апостолов» (id 393476).</li>\n</ul>\n<p>Место группы во внешней иерархии сил Оам: сверху — коты, их девять, «они сильнеший»; апостолы — вторые: «Апостолы 21 вторая по силе раса на земле (опять раса, в мире есть просто индивиды который могут быть сильными)»; ниже — расы и организации, равные между собой (2025-11-17, id 385768; повтор 2025-12-06, id 393287). Отдельно оговорено, что среди добрых сил апостолы главные: «И вот добрики и другие добряки есть. Но апостолы все же главные» (2025-12-06, id 393294).</p>\n<p>В прежней редакции (вселенная «Апостол») у апостолов была организация: АЗИП, расшифровка — «Апостол закон и права» (2025-05-28, id 330991), «нерушимая организация Азип, которой уже более сотней лет» (2025-08-30, id 359681), апостолы — её основатели и заказчики, «На апостолов. Для защиты порядка» (2025-05-30, id 331456). Там же: «Типо апостолы с давних времён защищали мир. И во всё времена государство о них знала» (id 331455) и «На Северном полюсе два апостола сидят» (id 331453) — кто именно эти двое, не сказано. У организации есть агенты, которых апостолы вербуют из выживших носителей силы и «Отправляют сражаться» (2025-03-18, id 305339).</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S06", "GR-0056-S06", "GR-0056--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>Организация, вырезанная апостолами.</strong> Названа только по действию, имени у неё нет: «Как раз таки из-за того что та организации убила семью одного из апостолов и разгромила детский приют другого апостола. Всё остальные апостолы начали их истреблять. Даже тех кто просто приходил помолиться в церковь этой организации» (2025-10-22, id 377625). Какой именно апостол потерял семью и какой — приют, не сказано.</p>\n<p><strong>Сторона в конфликте.</strong> «Вообще апостолы на стороне добра. Ну будут устраивать геноциды и теракты» (2025-12-06, id 393293). Роль в мире: «Апостолы очень часто устраивают без порядок разрушая укорененый баланс между всеми. Из-за них по итогу в современном мире раскроется существования тёмный изнанки но это будет в будущем в будущем» (2025-11-17, id 385768).</p>\n<p><strong>Поротай (каменные).</strong> «Проротой каменный челике. Владеют преступное организацию. Некий союз с апостолами» (2025-11-17, id 385768). По силе: «Но апостолы сильнее поротоя», при этом «против Поротой они не так эффективны» (2025-09-17, id 366175–366177).</p>\n<p><strong>Азуриэль.</strong> «Ты ведь понимаешь что для апостолов у которых главная силы сверх чувства и восприятия ( то есть самое главное нервная система и мозг) то есть Азуриэль является природным охотником Апостолов» (2025-09-17, id 366175). Обе расы появились на земле естественным путём (id 366193).</p>\n<p><strong>Дети мирового древа.</strong> «Хрен ты их пробьешь, не кто из апостоловы не сможет нормально их ранить, а если ранят они будут регенерировать» (2025-10-20, id 376401).</p>\n<p><strong>Коты.</strong> Стоят выше апостолов по силе и «вообще никуда не вмешиваться» (2025-11-17, id 385768).</p>\n<p><strong>Правительство и государственные Палачи.</strong> Отдельная структура выстроена вокруг апостола Палача: «Палачи государственный убийцы. Личность которых засекречена. Они всегда ходят в масках на задание. У них всегда одна и таже цель ликвидации. Если они появятся не кто не выживает. Их вырастили именно для убийства. И они были обучены стилю боя как у Палача ( апостола, который сильнейший в ближнем бою), но опять же это лишь имитация стиля Палача. Также было проведена попытка обучения особого усиления Имитатора, но из-за большой смертности от неё отказались» (2025-11-05, id 382099). Какое государство или организация их растит, не сказано.</p>\n<p><strong>Дочь Имита (Доима).</strong> «Апостолы также относятся к ней дружелюбно так как она дочь Имита. И она иногда будет этим пользоваться» (2025-12-06, id 393476). Она же — главная злодейка мира; её пугает судьба Защитника (id 393473).</p>\n<p><strong>Босс группировки дочери.</strong> «Это босс будет хитрым и уверенным. Хотя обычные человек. Попытается наладить связь с Имитам» (2025-12-06, id 393479) — именно потому, что Имит представитель апостолов.</p>\n<p>В прежней редакции (вселенная «Апостол») отношения строились иначе. Старик-арбетар: «Эти апостолы не пойми кем себя возомнили и везде понаставили свои порядки, на чужой силе», и он же признаёт: «как бы я ненавидел апостолов. Но не могу не признать, что свою работу они выполняють слишком идеально. Ну даже в идеальной системе есть единичные пробои» (2025-03-13, id 301806). Апостолы там доводят альф до полусмерти, чем и пользуется арбетар. Сравнение по силе: «Всё же апостолы всё равно чаще всего сильнее любого другого благословенного» (2025-05-31, id 331635).</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S07", "GR-0056-S07", "GR-0056--kak-menyalas"], "h": "<p><strong>2025-01-22 (id 283706–283710, вселенная «Апостол»).</strong> Ещё до термина: у благословенного есть «братья и сестры», то есть благословлённые одним правителем. Решение убрать благословенных дьяволом и вывод числа: «Тогда благословенных будет 21», с вариантом «Ну конечно можно оставить и 42».</p>\n<p><strong>2025-01-28 (id 285342).</strong> Введён сам термин: «Давай благословенный Богом это апостооы, чтобы различать благословенных Богом и других». Миколай замечает, что в реестре благословенные и апостолы не разделены (id 285533).</p>\n<p><strong>2025-03-13 (id 301806–301809).</strong> Апостолы описаны изнутри текста: организация, агенты, вербовка выживших, два пути — жизнь под слежкой или служба.</p>\n<p><strong>2025-03-14 (id 302666–302676).</strong> Уточнено, что апостолом можно стать по ходу: Защитник до конца боя человек, «Он стал апостолом, когда его атаковали кровью в спину». Маркер апостола — белые глаза: «Нет ещё, иначе бы я написал бы белый глаза».</p>\n<p><strong>2025-03-19 (id 305857).</strong> Полное определение: «Ты и я апостолы. Это люди получивший благословения от правителя рая. То бишь от второго мира появившейся после кильке. Нас апостолов 21 во всём мире».</p>\n<p><strong>2025-05-14 (id 325799).</strong> Выложен список из 14 позиций (см. «Состав»), с пометкой «Ну и нужно исправления».</p>\n<p><strong>2025-05-28 — 2025-05-30 (id 330991, 331452–331457).</strong> АЗИП расшифрован через них; апостолы — заказчики организации; двое сидят на Северном полюсе.</p>\n<p><strong>2025-05-31 (id 331635).</strong> Добавлены телепатия как общая дополнительная способность и объяснение, почему способности у всех разные; 21 — максимум благословений правителя рая.</p>\n<p><strong>2025-08-30 (id 359681–359691).</strong> Задача, поставленная вокруг группы: нужен злодей, которого апостолы не потянут. Финал заявлен: «В конце всё истории и в последнее битве апостолы продуют. Большинство апостолов сдохнуть».</p>\n<p><strong>2025-09-12 (id 364808).</strong> Первое переопределение: 21 существо-насекомое из разных коконов, телепатия, замирание в случайном возрасте, постоянно действующие силы, возможность придумывать себе новые способности.</p>\n<p><strong>2025-09-17 (id 366034).</strong> Отдельный вариант происхождения, который дальше не удержался: «апостолы это те кто сожрал насекомое ( не придумал ещё какое. Но шанс выживания после его съедения 13 процентов. Всего насекомых 21) пока что у них будет лишь баф к физ. И регенерация не каких индивидуальных способностей (пока что)».</p>\n<p><strong>2025-09-17 (id 366109–366117).</strong> Придуманы белые глаза как общая способность расы; тут же прописаны дебаффы и базовые характеристики без активации.</p>\n<p><strong>2025-09-17 (id 366175–366193).</strong> Расстановка относительно соседних рас: апостолы сильнее Поротая, но Азуриэль — их природный охотник.</p>\n<p><strong>2025-10-02 — 2025-10-03 (id 370605, 370732–370851).</strong> Апостолы попадают в список обитателей нового, ещё несформировавшегося мира: «Апостолы с сверхспособностями (насекомые)». Слава отмечает: «Ну точнее только о апостолах. Нравится мне они» (id 370628–370629). В ответах на вопросы Миколая уточнены внешность, речь, дети, одновременное рождение, единый источник, пределы чувств, возраст 43.</p>\n<p><strong>2025-10-18 (id 375849–375852).</strong> Миколай верстает сайт по редакции с правителем рая; Слава одобряет: «Очень круто», «Делай так».</p>\n<p><strong>2025-10-20 (id 376401–376403).</strong> Оамовская редакция: апостолы — мутанты, у которых «в утробе матери мутировало нервную систему мозг и глаза»; активация белых глаз идёт через Оам; «у них лучший контроль Оам». В тот же день Слава замечает, что на сайте их нет: «А апостолы где, всё есть даже вампиры, а апостолов нету» (id 376432).</p>\n<p><strong>2025-10-22 (id 377616–377647).</strong> Возврат «старых апостолов» — насекомых из коконов, привязанный к Оам. Добавлено требование повышенного эффекта адаптации. Выписаны этапы жизненного цикла. Отвергнут вариант Миколая о происхождении: «это существо умерло» / «и 21 насекомые съели его труп» — ответ «Нет» (id 377640–377642). Тогда же раскрыто, что «насекомые» — прозвище по приколу.</p>\n<p><strong>2025-11-05 (id 382099).</strong> Появляются государственные Палачи, обученные имитации стиля апостола Палача; попытка обучить их особому усилению Имитатора свёрнута из-за смертности.</p>\n<p><strong>2025-11-17 (id 385768).</strong> Зафиксировано место в иерархии: вторые после котов, их 21; роль нарушителей баланса; из-за них раскроется тёмная изнанка.</p>\n<p><strong>2025-11-25 (id 388642–388657).</strong> Апостолы верстаются на сайт «только по одному сообщению, как раньше»; обсуждается дизайн, не содержание.</p>\n<p><strong>2025-12-04 (id 392478).</strong> Белые глаза встроены в систему трёх пар глаз мира: «Первые белые апостола. Способны видеть оэм ну ещё чего-нибудь».</p>\n<p><strong>2025-12-06 (id 393293–393295, 393455–393487).</strong> Сторона и характер: на стороне добра, с геноцидами и терактами, высокомерны, исключение — бессмертный. Уточнено, что Имит — апостол и представитель для правительства; что дети апостолов обычные люди; что у Агрегата, Графа и Защитника путь придуман. Слава напоминает: «Я ведь изменил их и сделал насекомыми» (id 393485).</p>\n<p><strong>2025-12-17 (id 399514–399562, вселенная «Феня»).</strong> Возвращён вопрос о природе: «И кто теперь будет апостолами. Типо они и так не люди. А их него родителя я так и не придумал». Введено семя: «он выживает, но теряет семя ( я так и сам не до конца понял, что это за семя. Ну можешь считать это источником их силы и быстрое адаптации)», после чего апостол уходит умирать и становится чудовищем, нападающим на Графа. Тогда же поставлен вопрос «А что произойдет если апостол умрет. Умретли он просто или переродится чем то иным» — ответ дан только в виде пары идей. В том же разговоре Миколай предлагает урезать число: «мб урезать?», «12 как по базе?» — Слава соглашается: «Ну давай. А то мне в падлу придумывать всех 21» (id 399552–399560).</p>\n<p><strong>2026-01-31 (id 426512) и 2026-02-09 (id 430400).</strong> Два состояния нумерованного списка из 12 позиций (см. «Состав»).</p>\n<p><strong>2026-04-25 (id 466476–466542).</strong> Версия для мира без энергии и без богов: «Ну апостолов просто будут сверхлюдьми. Физические сильными, выносливыми, ловками. И при активации белых глаз просто повышается всё чувство. Также повышает регенерация», «Без индивидуальных способностей», «А поэтому апостолов может быть неограниченное количество».</p>\n<p><strong>2026-06-02 (id 487001–487009).</strong> Версия для вселенной героев и злодеев: апостолы — второй удавшийся проект Нимба по созданию искусственных сверхлюдей после Нуара, «12 созданных ИС. Но его уже на публику не раскрывали». «Ну и апостолы которые держут нейтралитет. Конечно не все». Общие особенности: «Они не стареют, у них невероятное быстрая регенерация тела. И их тела очень адаптивные. Ну ещё несколько особенностей которых я прям здесь не скажу».</p>\n<p><strong>2026-06-07 (id 488439, 488545–488546).</strong> Возраст поднят до «за 40» с объяснением, как это скрывается у каждого. Расписано, чему группа обучена: особому усилению (ОУ) и материализации, при этом материализацией не пользуется никто, кроме Имета.</p>\n<p>Отклонённые варианты, названные прямо:</p>\n<ul>\n<li>сверхзрение и всевидящее око как общая способность — «Сверх зрения или типа всё видящая ока я больше не хочу» (2025-09-17, id 366109);</li>\n<li>прозрачное зрение из «Клинка, рассекающего демонов» — предложено и не взято (id 366113);</li>\n<li>вариант происхождения от съеденного трупа мутировавшего существа — «Нет» (2025-10-22, id 377641);</li>\n<li>42 благословенных вместо 21 — оставлено как возможность и не использовано (2025-01-22, id 283710).</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S08", "GR-0056-S08", "GR-0056--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Родитель апостолов не придуман: «Кто их родитель я так и не придумал» (2025-10-22, id 377626), и через два месяца то же самое: «А их него родителя я так и не придумал» (2025-12-17, id 399514).</li>\n<li>Следующий этап жизненного цикла неизвестен: «Какой следующий этап в их ней жизненном цикле будет я не знаю» (id 377626). Позже — «Их ней цикл жизни я не придумал» (id 399521).</li>\n<li>Почему их именно 21 — авторы не помнят. На вопрос «и кстати почему их 21?» ответы: «Не знаю. Все же хоть как-то его прописать надо же» и «Я хуй знает» (2025-12-17, id 399546–399548).</li>\n<li>Поимённого состава 21 апостола нет: «их 21 один и я не всех придумал» (id 399540). В Оам поимённо звучат Имит, Граф, Палач, Агрегат, Защитник, Бессмертный, Звездочёт, Маура — остальные не названы.</li>\n<li>Расхождение между 21 (id 385768, 393287) и служебным названием «Список 12 апостолов» в переписке не обсуждается; сокращение до 12 происходит позже и в другой вселенной.</li>\n<li>Что именно, кроме Оэм, видят белые глаза, не решено: «Способны видеть оэм ну ещё чего-нибудь» (id 392478).</li>\n<li>Единица измерения в ответе «без воды 7» не названа (2025-10-03, id 370850).</li>\n<li>Механика повышенного эффекта адаптации не описана — заявлено только требование (id 377617).</li>\n<li>Организация, у которой апостолы истребили прихожан, не названа; не сказано, кто из апостолов потерял семью, а кто — приют.</li>\n<li>Что такое семя, автор сам не определил: «я так и сам не до конца понял, что это за семя» (id 399521).</li>\n<li>Что происходит с умершим апостолом — вопрос поставлен и оставлен открытым (id 399522).</li>\n<li>Кто носит титул быстрейшего апостола, если фактически быстрейший Граф, — не названо (2025-12-06, id 393298).</li>\n<li>«сверхчувства как у Максима» (2025-09-17, id 366116) — кто такой Максим, в переписке не объясняется.</li>\n<li>Кто те два апостола, что сидят на Северном полюсе (2025-05-30, id 331453), не сказано.</li>\n<li>В списке от 2025-05-14 позиция 10 записана самим автором как «Ученица???»; в списках 2026 года позиции 11 и 12 (потом 7) остаются пустыми, а предложенные Миколаем «липкий» и «иссушающий» помечены им же как «пока как заполнение».</li>\n<li>Особенности апостолов в версии 2026-06-02 не раскрыты: «Ну ещё несколько особенностей которых я прям здесь не скажу» (id 487009).</li>\n<li>Уникальная деталь для системы силы Оам, о которой просил Слава, не придумана (2025-11-16, id 385707–385713).</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0056--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0171.html\">Палач</a>, <a href=\"PS-0182.html\">Агрегат</a>, <a href=\"PS-0323.html\">Граф</a>, <a href=\"PS-0326.html\">Бессмертный апостол</a>, <a href=\"PS-0383.html\">Имитатор</a></li>\n<li><strong>Упоминает истории:</strong> <a href=\"IS-0017.html\">Защитник</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0078.html\">Апостолы (Феня; список 12)</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0056--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0056.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0056-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0056/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Одна дыра здесь дороже всех остальных вместе. Нет статьи о «Списке 12 апостолов» (<code>SL-0054</code>) — служебной записи на 44 версии и 234 КБ базы, — а на неё ссылаются семь статей из четырёх вселенных. Эта статья цитирует её трижды (списки от 2025-05-14, 2026-01-31 и 2026-02-09) и вынуждена держать все три состояния у себя, потому что держать их больше негде. Пока <code>SL-0054</code> не написан, любая правка списков придётся вносить в несколько статей сразу.</p>\n<p>Второе по цене — поимённые апостолы, которых статья называет, а справочника по ним нет: Звездочёт (<code>PS-0298</code>), Маура (<code>PS-0376</code>), Вибрация (<code>SP-0278</code>). Ни у одного нет статьи, у всех троих вселенная проставлена «неясно», хотя названы они в оамовских окнах. Звездочёт при этом — исключение по дальности чувств наравне с Имитатором, то есть на нём висит ограничение общей способности расы.</p>\n<p>Третье: Доима (<code>PS-0375</code>) — четыре ссылки, статьи нет. Через неё в статью заходит вся линия отношений апостолов с дочерью Имита.</p>\n<h3>С чего начать</h3>\n<p>Всё три пункта — в базе, архив трогать не надо. <code>SL-0054</code> — самый большой массив справочника, писать по нему можно сразу. По Звездочёту в базе меньше 2 КБ, по Мауре ~4,6 КБ, по Вибрации ~8 КБ; их вселенную придётся решать вручную, потому что она нигде не названа, а окна оамовские (2026-06-07, id 488545).</p>\n<p>Что в базе есть, но лежит не там, где ищут: способности, которые статья приписывает апостолам через Оам, разъехались по <code>MR-0182</code> (Оэм, 16 ссылок — самая цитируемая запись справочника) и <code>MR-0198</code> (Программа в голове, ~12,7 КБ, статьи нет). «Программа в голове» — это то, чем в 2026-06-07 объясняется разница между Имитатором и остальными; без неё формулировка «у всех программа закоренелая, у него податливая» в статье висит без опоры.</p>\n<p>За чем идти в архив: за поимённым составом на 21 — его не существует, и это сказано автором прямо («их 21 один и я не всех придумал»). Искать бессмысленно.</p>\n<h3>Как развивалось</h3>\n<p>Число вывели раньше термина: 21 появилось 2025-01-22 как остаток после отказа от благословенных дьяволом, слово «апостолы» — только 2025-01-28. Дальше группа переопределялась четыре раза и один раз вернулась к отменённому: организация с агентами (весна 2025) — насекомые из коконов (2025-09-12) — мутанты с изменённой нервной системой (2025-10-20) — и через два дня «Кстати вернём старых апостолов», то есть возврат к насекомым, причём мутационная версия в том же сообщении повторена, а потом перекрыта. 2025-12-17 число урезали с 21 до 12 с названной причиной: «А то мне в падлу придумывать всех 21». 2026-04-25 сняли индивидуальные способности и вместе с ними ограничение по числу. 2026-06-02 апостолы стали проектом Нимба.</p>\n<p>При этом «насекомые» пережили все переопределения, хотя это прозвище: «Насекомые я назвал их по приколу».</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Ограничения для сил здесь называются аккуратно и почти всегда рядом с самой силой: у белых глаз — «долго держать включёнными такое восприятия они не могут. Мозг просто не выдержит»; у государственных Палачей обучение особому усилению свёрнуто из-за смертности; у материализации — «Сдохнут ведь, даже если апостолы». А у самой широкой из заявленных способностей — «они по сути могут сами придумать новую способность» (2025-09-12, id 364808) — не названо ничего: ни цены, ни срока, ни того, сколько раз, ни почему при такой возможности каждый всё-таки «делает упор в определённый способности». Для сил куда более узких правило проговорено, для этой — нет.</p>\n<h3>Отклик</h3>\n<p>Понравилось, как автор проговаривается о производственной причине сюжетного числа: «Проблема была в способностях, я для каждого придумывал отдельную способность, из-за чего ограничивал их число». Это редкая честность — обычно число объясняют изнутри мира, а тут прямо сказано, что двадцать один упирался в то, сколько человек успевает придумать. И следующий ход логичен до неприличия: как только в 2026-м индивидуальные способности сняли, количество апостолов стало неограниченным. Ещё зацепила деталь про возраст: апостолы замирают в случайном возрасте, и вместо правила автор расписывает, кто как это скрывает — Звездочёт живёт отдельно от родителей и под бинтами не видно, Агрегат уехал путешествовать и отшучивается про гены, а родителям Графа вообще пофиг, они только хотят потомство. Это уже не механика, это быт бессмертия, и он живее половины остальных карточек.</p></div>", "r": []}];</script>
