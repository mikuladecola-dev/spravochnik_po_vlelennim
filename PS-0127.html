<script>const BASE="";const DOCNAME="Подросток";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0127-S01", "PS-0127--proishozhdenie"], "h": "<p>Материал относится к периоду, объявленному 2024-07-31 (id 214143); имени в переписке этой вселенной не дали.</p>\n<p>Роль возникла при перечислении состава команды из пяти человек: «ну больной, врач, военный, механик и подросток» (Миколай, id 214322). Это один из первоначальных вариантов состава «Команда гиг» — на тот момент ещё с механиком, который следом был забракован и заменён на бомжа (<a href=\"PS-0128.html\">Бомж</a>).</p>", "r": [["Бомж", "PS-0128.html"]]}, {"t": "Как менялся", "a": ["S02", "PS-0127-S02", "PS-0127--kak-menyalsya"], "h": "<h3>2024-07-31, id 214316–214341</h3>\n<p>Возраст подростка сначала назван 13 — Слава оценил его коротко: «Говно». Миколай тут же пересмотрел: «17» (id 214336–214338). В этом же куске переписки перечислены и возраста остальных членов пятёрки: «бомжу 34, врачу 45, больному 28» и «военному 50» — причём про военного отдельно отмечено, что 50 лет ему «позавчера исполнилось».</p>", "r": []}, {"t": "Связи с другими", "a": ["S03", "PS-0127-S03", "PS-0127--svyazi-s-drugimi"], "h": "<p>Часть команды гиг (5 человек), наряду с бомжом (<a href=\"PS-0128.html\">Бомж</a>, позже заменённым на дерзкого друга гг — <a href=\"PS-0129.html\">Дерзкий друг гг</a>), врачом, военным и больным.</p>", "r": [["Бомж", "PS-0128.html"], ["Дерзкий друг гг", "PS-0129.html"]]}, {"t": "Пробелы", "a": ["S04", "PS-0127-S04", "PS-0127--probely"], "h": "<div class=\"gaps\"><p>Внешность, характер и способности подростка в переписке не описаны. Неясно, совпадает ли эта роль с персонажем <a href=\"PS-0129.html\">Дерзкий друг гг</a> «дерзкий друг гг», про которого отдельно уточнено, что «по социальной роли, он тоже подросток» — прямой связи между ними в переписке не названо, только совпадение социальной роли.</p></div>", "r": [["Дерзкий друг гг", "PS-0129.html"]]}, {"t": "Связи — всё вместе", "a": ["PS-0127--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0128.html\">Бомж</a>, <a href=\"PS-0129.html\">Дерзкий друг гг</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0128.html\">Бомж</a>, <a href=\"PS-0129.html\">Дерзкий друг гг</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0127--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-31</td>\n<td>214316–214341</td>\n<td>w0049</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0127-podrostok.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0127--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0127.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
