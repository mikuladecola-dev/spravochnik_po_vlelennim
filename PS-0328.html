<script>const BASE="";const DOCNAME="Бенжимен Бэнуар";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0328-S01", "PS-0328--proishozhdenie"], "h": "<p>Бенжимен Бэнуар — главный герой прозаического текста Славы «Страх» (2025-12-09, окно w0113). Текст выложен дважды: первый черновик (id 394433) и переписанный вариант (id 394532), между ними — обсуждение с Миколаем (id 394487–394531), в котором биография героя и достраивается.</p>\n<p>Он представляется в тексте сам: «Я Бенжимен Бэнуар первенец и ближайшее на замену отцу дворянина». Написание фамилии в переписке колеблется — «Бенжимен» и «Бэнжимен» встречаются в одном и том же абзаце.</p>\n<p>Биография, собранная в обсуждении:</p>\n<ul>\n<li>Сын покойной жены графа, а не внебрачный. Вопрос Миколая: «он сын шлюхи или покойной матери?» — ответ Славы: «Покойной матери».</li>\n<li>Мать умерла сразу после родов: «Его мать просто сразу умерла после родов и я посчитал это не важным».</li>\n<li>Мать была женой графа — на прямой вопрос «и еще мать была жена графа?» ответ «Да».</li>\n<li>Воспитывала его мачеха. Вопрос Миколая: «интересно кто его воспитывал и какие у них отношения» — ответ Славы: «Мачеха». И следом: «Мать умерла, а отец ненавидел».</li>\n<li>Меч в руках держал и учился раньше — на вопрос «интересно держал ли он раньше мечь и учился ли где-то» ответ: «Да. Я же сказал что Аристократов если и посылают на войну то в безопасные места». На дальнейшие расспросы Слава ответил «Узнаешь».</li>\n<li>Среди новобранцев он единственный дворянин — на вопрос «она единственный дворянин?» ответ: «Он».</li>\n</ul>\n<p>Исходное положение сюжета: его, первенца и наследника графа, отправляют не в тыл и не в штаб, а на передовую, на осаду крепости — на фронт, известный самой высокой смертностью.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0328-S02", "PS-0328--vneshnost"], "h": "<p>Отдельного описания внешности в переписке нет. Прописано только лицо в строю новобранцев, и оно меняется между версиями:</p>\n<ul>\n<li>версия 1 (id 394433): «Лишь Бенжимен не дрожал. Стоял ровно, а лицо было невозмутимо»;</li>\n<li>версия 3 (id 394532): «Стоял ровно, а лицо было словно фарфоровая маска, холодное и невозмутимое».</li>\n</ul>\n<p>Ни возраст, ни цвет волос и глаз, ни рост в переписке не названы. Сказано, что он стоит «в ширинку с другими молодыми парнями» (в первой версии — «с другими молодыми простолюдинами»).</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0328-S03", "PS-0328--harakter"], "h": "<p>Персонаж построен на разрыве между внутренним состоянием и внешним видом. Внутри: «Да именно страх поглотил моей сознания. Руки дрожали, хоть я пытался это скрыть». В строю: «Но это лишь внешний. Внутри же он дрожал, кричал и хотел сбежать».</p>\n<p>Причина, по которой он не убегает, названа воспитанием: «Он бы мог сбежать. Выбить дверь, спрыгнуть с кареты и побежать в сторону леса исчезнув. Но он не мог. Всю жизнь воспитанный, как благородный дворянин, он даже дрожь пытался скрыть». Миколай выделил это отдельной репликой: «он бы мог, но он не мог».</p>\n<p>Меч он держит не как оружие, а как опору: «едва заметна дрожу держа меч в руках, как оберег».</p>\n<p>Состояние времени в карете: «Бэнжимен потерял счет времени. Для него время было бесконечным и при этом мигом».</p>\n<p>Его отношение к отцу — равнодушие: «На графа ему было наплевать, также как и графу на него». Отношение к мачехе — надежда, которую он сам подтачивает: «Он просто надеялся, что мачеха не могла этого сделать. Кто угодно только не она. Его уверенность с каждой минутой тускнело. Слышав множеств истории, как новый жены избавляется от детей бывших жен. Эта мысль была ужасна».</p>\n<p>Успокаивается он не надеждой, а расчётом и отказом от побега: «Уже поздно, я уже здесь и попытка сбежать лишь бы развязала руки всем недругам и солдатам». И прямо оговорено, чем это на самом деле является: «После этой мысли Бенжимен немного успокоился. Скорее это можно назвать смирением».</p>\n<p>Свою семью он при этом не отбрасывает: «Но он пытался об этом не думать. Ведь это все же его семья».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0328-S04", "PS-0328--sposobnosti"], "h": "<p>Прямо оговорено, что магии у него не будет: «Гг не будет владеть магией. Чисто хладнокровием и мечом будет шататься» (id 394531). Это сказано на фоне того, что мир — «фэнтези с магией и другими расами».</p>\n<p>Владение мечом: обучение и прежний опыт подтверждены («Да»), но уровень не описан, и в записанной части текста он ни разу не дерётся.</p>\n<p>Хладнокровие здесь названо способностью наравне с мечом — не как черта характера, а как то, чем герой будет обходиться вместо магии.</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0328-S05", "PS-0328--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Отец, граф Бэнуар.</strong> Имени нет. Отношение: в первой версии «Его отец граф очень сильно недолюбливал сына», в переписанной — «Его отец граф не скрывал неприязнь ко мне», в обсуждении — «отец ненавидел». Отдельно зафиксировано, что покушения уже были: отец «мог заказать моей убийства даже здесь, как он делал и раньше».</li>\n<li><strong>Мачеха, новая супруга графа.</strong> Имени нет. Она его воспитывала. Она же — тот, на кого он больше всего боится подумать в связи с отправкой на фронт.</li>\n<li><strong>Дети графа от новой супруги.</strong> Названы только как возможная причина: «Да и новая супруга графа и их дети, тоже могли сыграть роль». Ни имён, ни числа, ни возраста.</li>\n<li><strong>Покойная мать.</strong> Жена графа, умерла сразу после родов. Больше о ней ничего.</li>\n<li><strong>Грозный мужчина со шрамами.</strong> Офицер, встречающий новобранцев: «Его лицо было покрыта шрамами, а глаза были твердыми и холодными. Было видно, что этот мужчина пережил много сражений». Он видит в пополнении смертников и злится не на них, а на систему: «Он прекрасно понимал, что сейчас нехватка людей. Но и не мог смириться с тем, что этих новобранцев сюда посылали на убой. Лишь из-за того, что сюда повышают новобранцев, здесь высокая смертность». Оба черновика обрываются ровно на том месте, где его взгляд доходит до героя: «Взгляд остановился на г». Имени у него нет. Слово «твёрдые глаза» Миколай отметил отдельно: «крутое слово», «твёрдые глаза».</li>\n<li><strong>История «Страх»</strong> — текст, в котором он существует; других появлений у персонажа в переписке нет.</li>\n</ul>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0328-S06", "PS-0328--kak-menyalsya"], "h": "<p>Всё уложилось в одно утро 2025-12-09.</p>\n<p><strong>Версия 1 — черновик (09:08, id 394433).</strong> Полный текст сцены: карета, меч-оберег, мысли об отце и мачехе, строй новобранцев, выход офицера. Формулировки этой версии: «И даже не на, не важные военные точки»; «Сейчас еду в карете»; «Его отец граф очень сильно недолюбливал сына»; «Хоть кто, но не она»; «он стоял в ширинку с другими молодыми простолюдинами»; «Ведь этот фронт быль знаменит одной из самых высоких показатель смертей»; «лицо было невозмутимо»; сдерживают убийц «другие солдаты»; офицер думает «нам на помощь зелёный новобранцы», «сейчас нехватка кадров», новобранцев «посылали на смерть».</p>\n<p><strong>Версия 2 — обсуждение (09:21–09:55, id 394487–394531).</strong> Здесь достроена биография (см. «Происхождение») и приняты решения о рамке: мир — «фэнтези с магией и другими расами», «Плюсом недопонимания я хочу там развить», герой магией не владеет. Тут же Слава зафиксировал будущую доработку: «Плюсом из-за тебя я понял, что нужно добавить сценку где будет говориться как он туда так легко попал». Такая сценка в переписке не написана.</p>\n<p><strong>Версия 3 — переписанный черновик (09:55, id 394532).</strong> Тот же текст с правками:</p>\n<ul>\n<li>фронт уточнён: «На осаду крепости, где пролилось уже литр крови»; «И даже не на спокойную точку»;</li>\n<li>карета: «Сейчас еду в трясущиеся карете»; добавлен мир вокруг: «Весь его мир был в этой карете. Внутрь проникали звуки пение птиц, и звуки насекомых. Но где-то там далеко»;</li>\n<li>мешок: «мешок попыхах забитыми моими вещами»;</li>\n<li>отец: «не скрывал неприязнь ко мне» вместо «очень сильно недолюбливал сына»;</li>\n<li>мачеха: «Кто угодно только не она» вместо «Хоть кто, но не она»; «Его уверенность с каждой минутой тускнело»;</li>\n<li>строй: «с другими молодыми парнями» вместо «с другими молодыми простолюдинами»; «Этот фронт славился высокой смертностью» вместо развёрнутой формулировки;</li>\n<li>лицо: «словно фарфоровая маска, холодное и невозмутимое»;</li>\n<li>сдерживающая сила изменена: убийц сдерживают не «другие солдаты», а «свидетели»;</li>\n<li>офицер: «зелёный щенков послали» вместо «зелёный новобранцы», «нехватка людей» вместо «нехватка кадров», «посылали на убой» вместо «на смерть».</li>\n</ul>\n<p>Обрыв на «Взгляд остановился на г» сохранён в обеих версиях.</p>\n<p><strong>Отклонённый вариант.</strong> Происхождение «сын шлюхи» предложено Миколаем как распространённый ход («честно часто видел когда первое», «и всё же в аниме или других историях говорят о сыне с какой-то такой дамой») и отклонено Славой: «Покойной матери», «Я разочарование о таких мыслих», «Я та не прям любитель жестить. Тем более в этом плане».</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0328-S07", "PS-0328--chto-s-nim-stalo"], "h": "<p>Записанная часть истории заканчивается на первом дне на фронте, в строю, в момент, когда офицер доходит взглядом до него. Что было дальше, в переписке нет. На вопросы Миколая о дальнейшем Слава отвечал «Узнаешь».</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0328-S08", "PS-0328--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имени отца и мачехи нет; сколько у графа детей от новой жены и кто они — не сказано.</li>\n<li>Возраст Бенжимена не назван.</li>\n<li>Внешность, кроме лица, не описана.</li>\n<li>Кто именно добился отправки на фронт — отец, мачеха или её дети — осталось нерешённым: в тексте перечислены как возможные причины, ответа нет.</li>\n<li>Был ли брак родителей по расчёту — вопрос задан Миколаем («а брак был по расчёту за деньги?») и оставлен открытым: «Я не знаю я не думал об этом. Его мать просто сразу умерла после родов и я посчитал это не важным».</li>\n<li>Отношения с мачехой, которая его воспитывала, не описаны — вопрос был задан («какие у них отношения»), ответ ограничился словом «Мачеха».</li>\n<li>Как на него реагируют другие — вопрос Миколая (id 394520) без ответа в переписке.</li>\n<li>Уровень владения мечом и где он учился — не сказано.</li>\n<li>Сценка о том, «как он туда так легко попал», намечена, но не написана.</li>\n<li>Название королевства, крепости и сторон войны не названо; про мир сказано только, что это фэнтези с магией и другими расами.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["PS-0328--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-12-09</td>\n<td>394433–394433</td>\n<td>w0113</td>\n<td>Феня (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-09</td>\n<td>394487–394531</td>\n<td>w0113</td>\n<td>Феня (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-09</td>\n<td>394532–394532</td>\n<td>w0113</td>\n<td>Феня (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0328-benzhimen-benuar.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0328--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0328.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
