<script>const BASE="";const DOCNAME="Четверо на корабле («супер группа»)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0074-S01", "GR-0074--chto-eto"], "h": "<p>Четверо незнакомцев, сбившихся вместе внутри заброшенного корабля исполняющего желания. Это не задуманная соавторами команда, которую обсуждали в чате: группа существует только внутри прозаического текста, который Слава скинул в чат пятью сообщениями подряд (2025-04-21, id 320982–320987) с пометкой «Вторая» — вторая из двух заметок брошенных историй. Обсуждения группы между Миколаем и Славой нет вообще: Миколай ответил «спасибо что скинул», «но я немного позже чекну», «завтра наверное» (320988–320991) и к концу окна (321314–321340) текст так и не прочитал.</p>\n<p>Объединение названо прямо в тексте. Ника спрашивает: «и что получается мы пока группой ходить будем?», рассказчик отвечает: «Да-да мы супер группа. Команда сильней чем рейнджеры». Дальше по тексту сквозные обозначения — «вся наша группа», «всю нашу команду», и Ника позже возвращает шутку рассказчику: «мы должны знать. Мы же группа сильнее рейнджеров».</p>\n<p>Собственного имени у группы нет. «Супер группа» — это выкрик рассказчика, на который «не кто не оценил. Лишь построили раздраженый лица», кроме Паши.</p>\n<p>Условия, при которых четверо оказались вместе: 11 июня в полночь у заброшенного корабля «по размеру который как гора» собирается толпа разных людей — «Студентка, клерк, старик, красотка, бандит, бизнесмен и так далее. Все это были разный люди, из разных слоев. Хм миров». Все пришли, «чтобы исполнить своё самое заведное желание». Ровно в 00:00 у всех звенит будильник, нужно успеть забежать на палубу; в 00:01 берега уже нет, вокруг «морей без горизонта». Внутри корабля тьма, в которой «вытянув руку ты ее не увидишь». Трое (Ника, Игорь, Паша) идут следом за рассказчиком, тот пытается от них оторваться, но, наткнувшись за углом на лапу зверя, бежит обратно и запирается с ними в одной комнате — с этого места (320984) они действуют вместе.</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0074-S02", "GR-0074--sostav"], "h": "<p>Четверо, все люди, познакомились уже на корабле:</p>\n<ul>\n<li><strong><a href=\"PS-0257.html\">Артём</a> — Артём</strong>, рассказчик от первого лица. Во второй истории по имени не назван; в базе отождествлён с Артёмом из первой истории по жене и дочери, ждущим дома, и по упоминанию «моего шедевра» и привычки к чужим органам, но прямо в тексте это не сказано.</li>\n<li><strong><a href=\"PS-0240.html\">Игорь</a> — Игорь</strong>, клерк.</li>\n<li><strong><a href=\"PS-0258.html\">Ника</a> — Ника</strong>, студентка.</li>\n<li><strong><a href=\"PS-0259.html\">Паша</a> — Паша</strong>, школьник.</li>\n</ul>\n<p>Порядок знакомства в тексте: первым представляется Игорь («нам не зачем ругаться. Давайте, что нибудь другой обсудим. Например как нас зовут. Меня зовут Игорь»), затем Паша («ме-ня Паша» — «робко произнёс парнишка»), затем Ника («вздох. меня Ника» — «произнесла она с не кем пренебрежением»). Рассказчик своё имя в ответ не называет, вместо этого переводит тему: «а как вы узнали об этом месте».</p>", "r": [["Артём", "PS-0257.html"], ["Игорь", "PS-0240.html"], ["Ника", "PS-0258.html"], ["Паша", "PS-0259.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0074-S03", "GR-0074--obschie-sposobnosti-gruppy"], "h": "<p>Способностей ни у кого из четверых не названо. Все четверо — обычные люди без чего-либо сверхъестественного, и группа держится не на умениях, а на вещах, которых у неё случайно оказалось по одной штуке.</p>\n<p>Что есть у всех:</p>\n<ul>\n<li>Желание, ради которого они пришли к кораблю в назначенную полночь и успели забежать до 00:01. Содержание желания не названо ни у кого, включая рассказчика, — он говорит только «Моя цель проста и понятна. Исполнить мечту».</li>\n<li>Знание, что желание может оказаться одно на всех: рассказчик вслух произнёс мысль «А что если он может исполнить лишь одно желания» ещё на берегу, при всех.</li>\n<li>Один фонарик на четверых. Рассказчик: «я понял, что я единственный такой умный человек в нашей группе, кто взял фонарик. Да они всё были без фонариков. Конечно у них был телефон, но он быстро сломался находясь в воде». Дальше: «вся наша группа опиралось лишь на один источник света. Такой маленький фонарик. Защищал нас от тьмы. Или же наоборот был маячком для этой тьмы». Второй фонарик у рассказчика в запасе есть, но об этом он сообщает только после розыгрыша Игоря.</li>\n</ul>\n<p>Единственное совместное действие всей группы как группы — выбивание двери из затопленной комнаты по плану рассказчика: «эй давлением воды и наших тел выбим дверь!». Ника и Игорь давят на дверь весом, рассказчик держится за поручень над дверью и бьёт ногами, Пашу рассказчик держит повыше, чтобы тому дольше хватило воздуха («Кажись он не умеет плавать»). Дверь слетает, «всё нашу команду. Уносить водой в коридор».</p>\n<p>«Холод» (<a href=\"SP-0223.html\">«Холод»</a>) к общим свойствам группы не относится: он накатывает только на рассказчика, и остальные в этот момент, по его словам, никак ему не помогли — «Тем более почему они не помогли мне? С моим приступом? Или что это было. Не знаю».</p>", "r": [["«Холод»", "SP-0223.html"]]}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0074-S04", "GR-0074--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p><strong>Рассказчик (Артём, <a href=\"PS-0257.html\">Артём</a>).</strong> Тот, кто на берегу калечил конкурентов ради своего шанса: «Поэтому без каких-либо угрызений совести. Я толкал людей, ранял их, ставил подсечки. Они падали и в их глазах был лишь ужас». Говорит вслух почти все мысли: «я тот тип людей, который чуть-ли не все мысли говорит в слух. Тем более когда он возбуждён». Шутит в опасности и над спутниками — обещает Паше «Сработает, а если нет то мы всего лишь умрем», светит фонариком вверх, чтобы остальные подольше не видели, по чему идут, изображает потерю фонарика и светит Игорю в лицо. Из четверых только он взял фонарик, и только у него нож. Привычен к трупам: упав лицом в выпотрошенное тело, отмечает — «Было мерзко. Но привычно. Я привык быть в чужих органах и крови. Это так навевает воспоминания. Мой шедевр, где-то там, а я здесь, чтобы зделать, то что нужно». Кроссовки на нём чужие, «слегка большими для меня. Ведь это были не мои кроссовки, а парня». Спутников рассматривает утилитарно: «Ну они могут быть отвлекающим маневром. В полне. Пока медведь будет их есть. Я смогу быстро свалить», и позже, обнаружив, что Игоря и Пашу утащили, — «Хм значит неплохо быть в группе. Ведь первым ты всё равно не умрёшь».</p>\n<p><strong>Игорь (<a href=\"PS-0240.html\">Игорь</a>).</strong> Клерк, «высокий мужчина в очках, одетый в пиджак. Не смотря на длинный рост был худым». Первым гасит ссору («тиха, тиха. Давайте все успокоимся») и первым представляется. Единственный, про кого прямо сказано, что он получил письмо: «я как бы письмо получил. Там в этом письме об этом месте и говорилось». Дальше спорит с Никой о том, виновата ли организация «Нимб». Действует напролом там, где это не работает: «Игорь с разбегу врезается в дверь. Он кажется думал, что сможет выбить железную дверь своей тушой. Ну хотя бы упорство ему не занимать». Он же вводит в группу осторожность и планирование: предлагает остановиться («Если мы продолжим так без разумно шагать. То можем и умереть, а если мы умрём мы не исполним желания»), предлагает анализировать («давайте подумаем. Мы находимся на корабле, где может быть исполняющий желания») и предлагает искать «комнату без окон». Шутки рассказчика не переносит: «знаешь шутки твои мне вообще не подушей». К трупу не подходит, держится «под одоль».</p>\n<p><strong>Ника (<a href=\"PS-0258.html\">Ника</a>).</strong> Студентка, «одетая в джинсы и в рубашку. Волосы у ниё покрашены, желто-розовый или как то так». Дерзкая, зовёт рассказчика «дядь», настаивает на ответах («да скажи!»), давит на группу требованием двигаться («и вообще зачем мы сели здесь. Может сейчас уже, Кто-то нашёл его, пока мы сидим здесь. Нам нужно идти»). Она задаёт вопрос про письма и настаивает на том, что важен отправитель: «да какая разница, что в письме было написано. Главная от кого пришло письмо», и не даёт свести это к обвинению — «я не говорила, что она виновата. Я лишь сказала, что письмо от них. А это что-то да и значит». Реагирует быстрее других: хватается за ручку двери при первом же треске, подхватывает упавший крутящийся фонарик и светит им; после этого фонарик остаётся у неё — «Я хотел его забрать. Но она ловко убирала свою руку, когда я хотел забрать фонарик». К выпотрошенному телу подходит спокойно, и это удивляет рассказчика: «Больше меня удивило как Нико так спокойно подошла». Способна сменить тон, когда нужно вытянуть информацию: спрашивает про монстра «уже более мягким тоном. Чем в прошлый раз», подойдя поближе и напомнив про группу.</p>\n<p><strong>Паша (<a href=\"PS-0259.html\">Паша</a>).</strong> Самый младший, «самый низкий среди них», школьник. Робкий, долго молчит («Всё это время сидевший тихо»). Единственный, кто смеётся над шутками рассказчика: «Вот Паша улыбается и слегка смеётся. Ну хоть, кто-то в юморе разбирается». В запертой комнате не спорит, а ищет выход — «Вот Паша молодец пытается, что-то найти». Самый мелкий физически: только он теоретически пролез бы в окно, «и то не факт». Плавать, судя по всему, не умеет. В коридоре разбивает ноги в кровь и едет на плече рассказчика, хотя отнекивается и говорит, что дойдёт сам; на плече «мелко дрожал». Он же произносит фразу, с которой начинается приступ рассказчика: «я хочу домой».</p>", "r": [["Артём", "PS-0257.html"], ["Игорь", "PS-0240.html"], ["Ника", "PS-0258.html"], ["Паша", "PS-0259.html"]]}, {"t": "Иерархия", "a": ["S05", "GR-0074-S05", "GR-0074--ierarhiya"], "h": "<p>Главным никто не назначен и вслух лидером никто не назван.</p>\n<p>Фактически группа собирается вокруг рассказчика и идёт за ним: сначала «Это тройка шла за мной», потом, когда он бежит от лапы, «Они увидев, как я резво бегу. Не долго думая побежали за мной вслед». Его раздражает даже необходимость проговаривать это вслух: «И зачем этот вопрос. Не могли, что-ли просто за мной пойти. Бесят». У него единственный фонарик, единственный нож и знание про существо в коридоре, которое он сначала скрывает от остальных («да не от чего. Там просто тупик- не хотел я раскрывать всю информацию»). Его план с дверью группа выполняет. Его запрет — «нет- отрезал я. — точно не в коридоре» — не обсуждается, но требует объяснения, которого добивается Ника.</p>\n<p>Второй центр — Игорь: он задаёт процедуру (знакомство, привал, поиск комнаты без окон), и рассказчик с ним соглашается, отмечая, что тот прав, — «А лицо Игорь удивилась. Не ожидал он кажется, что я так быстро соглашусь».</p>\n<p>Ника выступает противовесом обоим: спорит с Игорем («мы даже не знаем где вообще мы находимся, а ты хочешь, чтобы мы отгадали, где исполнитель желаний находится»), забирает и удерживает фонарик, требует у рассказчика информацию. Их с Игорем спор рассказчик описывает как «сценка устной битвой. Бессмысленной и глупой».</p>\n<p>Паша в решениях не участвует, за него решают: рассказчик поднимает его на плечо вопреки возражениям — «Он отнекивался. Говоря что и сам дойдет. Но я был твёрд».</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S06", "GR-0074-S06", "GR-0074--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>Остальные пришедшие к кораблю.</strong> Прямые конкуренты: если желание одно, «то нужно сократить число попавших туда». Рассказчик на берегу толкает и калечит бегущих, в том числе здоровяка («Явно зэк»), который перед этим толкнул его в плечо и потребовал прекратить шутки. Забежав на палубу, он оборачивается, «чтобы вытолкнуть тех, кто захочет забежать», но берега уже нет. На палубе остаются десятки людей; часть уходит внутрь вслед за рассказчиком, часть остаётся. Позже Ника замечает, что других не слышно: «а не слишком ли тихо. Здесь должны быть и другие люди», на что рассказчик отвечает «ну корабль большой». В коридорах группа идёт по чему-то булькающему под ногами и натыкается на выпотрошенное тело без кожи.</p>\n<p><strong>Обитатели корабля (<a href=\"PS-0260.html\">Обитатели корабля</a>).</strong> Сначала лапа за углом — «Нееет лапа зверя. Медведь? Не знаю», размером с голову рассказчика. Свою оценку он даёт сразу: один на один — «Точно помру», вчетвером — «От биться от медведя мало вероятно». Затем в темноте комнаты — гуманоид, «который был ещё черней чем тьма вокруг», с когтистой лапой, тощий, но с сильной на вид спиной. Он утаскивает Игоря и Пашу во мрак корабля и тащит за ногу Нику; рассказчик убивает его ножом между лопаток, держа за шею. Одно это существо или разные — не сказано.</p>\n<p><strong>Организация «Нимб» (<a href=\"MR-0132.html\">Нимб</a>).</strong> Отправитель писем о корабле. Ника: «Одна из крупнейших организаций всего мира написала нам о корабль. Разве это не странно». Игорь спрашивает, виновата ли она во всём этом; Ника отказывается от такой формулировки. Вопрос остаётся открытым — история обрывается раньше. Кто такой «исполняющий желания» и как он связан с «Нимбом», в тексте не объяснено.</p>\n<p><strong>Рейнджеры.</strong> Названы только в шутке рассказчика — «Команда сильней чем рейнджеры» — как мерка, с которой он сравнивает свою четвёрку. Никакого отношения к сюжету не имеют; кто это, в тексте не поясняется.</p>", "r": [["Обитатели корабля", "PS-0260.html"], ["Нимб", "MR-0132.html"]]}, {"t": "Как менялась — по датам", "a": ["S07", "GR-0074-S07", "GR-0074--kak-menyalas"], "h": "<p>Вся группа существует внутри одного текста, выложенного за один вечер (2025-04-21, 20:06, id 320982–320987). Изменения — это стадии внутри самого текста.</p>\n<p><strong>Берег, до группы (320983).</strong> Толпа разных людей у корабля; четверо будущих участников в ней не выделены. Рассказчик действует один и против всех.</p>\n<p><strong>Тьма коридоров, преследование (320983–320984).</strong> «Тройка» идёт за рассказчиком, он от неё отрывается, гасит фонарик, бежит. Затем бежит обратно от лапы и оказывается заперт с ними в одной комнате.</p>\n<p><strong>Знакомство и объявление группы (320984).</strong> Названы имена — Игорь, Паша, Ника. Проговорены письма от «Нимба». Ника спрашивает «и что получается мы пока группой ходить будем?», рассказчик отвечает «Да-да мы супер группа. Команда сильней чем рейнджеры». В этот же момент трескается окно и начинает заливать комнату.</p>\n<p><strong>Затопленная комната (320984–320985).</strong> Первое совместное действие: дверь выбивают давлением воды и телами. После этого комната исчезает вместе с водой — на её месте ничего нет.</p>\n<p><strong>Коридор с телами (320985–320986).</strong> Один фонарик на группу, тени кидаются под ноги, Паша разбивает ноги и едет на плече рассказчика; рассказчик падает лицом в выпотрошенное тело; фонарик переходит к Нике.</p>\n<p><strong>Привал в комнате без окон (320986).</strong> Спор о том, идти или думать; Паша говорит «я хочу домой»; на рассказчика накатывает «Холод», и он ложится в позе эмбриона.</p>\n<p><strong>Финал (320987).</strong> Рассказчик приходит в себя, остальных рядом нет. Чёрный гуманоид тащит бесчувственную Нику за ногу; Игорь и Паша, по выводу рассказчика, уже утащены во мрак корабля. Рассказчик убивает гуманоида ножом. Текст обрывается на том, что Ника «всё ещё было без сознания». Из четверых в сознании и на месте остаётся один.</p>\n<p><strong>После текста (320988–320991).</strong> Реакция соавтора — «спасибо что скинул», «но я немного позже чекну», «завтра наверное», «а щас буду спать». К концу окна (321314–321340) Миколай текст так и не прочитал. Продолжения нет, история брошена.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "GR-0074-S08", "GR-0074--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имени у группы нет. «Супер группа» и «команда сильнее рейнджеров» — шутка рассказчика внутри текста, а не название.</li>\n<li>Продолжения нет: история обрывается сразу после убийства гуманоида. Что стало с Игорем и Пашей, очнулась ли Ника, добрался ли кто-нибудь до исполняющего желания — не сказано.</li>\n<li>Желания, ради которых участники пришли к кораблю, не названы ни у кого, включая рассказчика.</li>\n<li>Про письмо от «Нимба» прямо сказано только у Игоря; Ника говорит «написала нам о корабль», не уточняя, кому именно. Про рассказчика сказано только, что он «повёлся на одну чушь» — «Чушь про корабль»; письма у него в тексте нет. Получал ли письмо Паша — не сказано.</li>\n<li>Фамилии, возраст, города и что-либо о жизни Ники, Игоря и Паши до корабля в тексте отсутствуют.</li>\n<li>Имя рассказчика во второй истории не звучит. Отождествление с Артёмом из первой истории (320979) держится на жене и дочери, ждущих дома, и на упоминании «моего шедевра» и привычки к чужим органам — прямо это не сказано.</li>\n<li>Как связаны «Нимб» и корабль, виновата ли организация в происходящем — «осталось нерешённым», Ника прямо отказывается это утверждать.</li>\n<li>Кто такой исполняющий желания и правда ли, что желание всего одно, — не объяснено; мысль про одно желание принадлежит рассказчику и ничем не подтверждена.</li>\n<li>Одно ли существо в корабле или разные (лапа-«медведь» и чёрный гуманоид) — не сказано.</li>\n<li>«Холод» — отдельная сущность корабля или образ внутреннего состояния рассказчика — не разъяснено.</li>\n<li>Куда делись остальные попавшие на корабль десятки людей — в тексте не сказано, кроме реплики про то, что корабль большой, и выпотрошенных тел в коридоре.</li>\n<li>Обсуждения этой группы соавторами нет: текст скинут одним куском, Миколай его не читал, никаких правок, вариантов или отклонённых версий по группе в переписке не появилось.</li>\n<li>Имя Игорь в базе идёт под тем же id (<a href=\"PS-0240.html\">Игорь</a>), что и Игорь из истории про завод имени Попова (w0085, 2025-03-25) и Игорь из бригады лесорубов (w0089, 2025-05-02). Сама база помечает это как неясность: «Имя Игорь встречалось и в прошлой брошенной истории Славы про корабль (w0088) — совпадение или нет, неясно». В переписке связь не названа.</li>\n</ul></div>", "r": [["Игорь", "PS-0240.html"]]}, {"t": "Связи — всё вместе", "a": ["GR-0074--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0240.html\">Игорь</a>, <a href=\"PS-0257.html\">Артём</a>, <a href=\"PS-0258.html\">Ника</a>, <a href=\"PS-0259.html\">Паша</a>, <a href=\"PS-0260.html\">Обитатели корабля</a></li>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0223.html\">«Холод»</a></li>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0132.html\">Нимб</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0074--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0074.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0074-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0074/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дыр в обычном смысле — «на сущность ссылаются, а статьи нет» — у этой статьи нет ни одной: все её связи ведут в написанные записи. Дорого здесь другое.</p>\n<p>Первое. Статья спрашивает, кто такой исполняющий желания и как он связан с «Нимбом», а запись, которая должна на это отвечать, в её связях не стоит: <code>MN-0019</code> «Заброшенный корабль исполняющего желания», 33,7 КБ базы и одна-единственная входящая ссылка. Рядом ещё два входа в тот же вечер — <code>IS-0050</code> (33,5 КБ, две ссылки) и <code>PR-0069</code>, сам текст (32,7 КБ, одна ссылка). Три записи по тридцать с лишним килобайт про один текст, и группа, живущая внутри этого текста, не соединена ни с одной. Это чинить первым: не писать новое, а связать.</p>\n<p>Второе. <code>PS-0240</code> — «Игорь»: четыре входящие ссылки, 115 КБ базы, и под этим id, как отмечает сама статья, сидят трое разных Игорей из трёх историй (корабль, завод имени Попова, бригада лесорубов). Пока они не разведены, любая из четырёх ссылок ведёт неизвестно куда. Похожая, но более мягкая версия — <code>PS-0257</code> (Артём, 39,3 КБ): отождествление рассказчика с ним держится на жене, дочери и «моём шедевре», и статья это честно помечает.</p>\n<h3>С чего начать</h3>\n<p>Материал есть, он в базе, и он разъехался.</p>\n<p>Про корабль и механику желания — <code>MN-0019</code>, <code>IS-0050</code>, <code>PR-0069</code>. Про организацию, которая разослала письма, — <code>MR-0132</code> (88,7 КБ, пять ссылок) и <code>MR-0133</code> («Отделы Нимба», всего 1,5 КБ, две ссылки): спор Игоря и Ники о вине организации упирается именно в <code>MR-0132</code>, и там же придётся решать, отвечает ли вообще эта вселенная на такой вопрос.</p>\n<p>Разводить Игорей — по датам: 2025-04-21 (корабль), 2025-03-25 (завод имени Попова, w0085), 2025-05-02 (бригада лесорубов, w0089). Три окна, между ними больше месяца, так что развести можно и без архива, по самим записям.</p>\n<p>В архив идти стоит ровно за одним: за реакцией. Слава скинул текст 2025-04-21 в 20:06 пятью сообщениями, Миколай ответил «завтра наверное», к концу окна (321314–321340) не прочитал. Проверять надо не этот вечер, а следующие — прочитал ли вообще когда-нибудь и сказал ли хоть слово. Если нет, это стоит зафиксировать прямо: текст в справочнике есть, а обсуждения его не существует.</p>\n<h3>Как развивалось</h3>\n<p>По датам развития нет: одна дата, один вечер, один текст. Развитие целиком внутри него.</p>\n<p>Заявили — сразу как брошенное: текст пришёл с пометкой «Вторая», вторым из двух в связке заметок о брошенных историях, то есть был назван брошенным раньше, чем прочитан. Ограничили — самим текстом: способностей ни у кого нет, один фонарик на четверых, один нож, одно совместное действие за всю историю. Забыли — в тот же вечер: «спасибо что скинул», «но я немного позже чекну», «завтра наверное». Не вернулись.</p>\n<p>Внутри текста та же дуга: одиночка против всех на берегу — четвёрка в запертой комнате — распад, где из четверых на месте и в сознании остаётся один.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Вход на корабль описан с точностью до минуты и работает как правило: 11 июня, полночь, у всех звенит будильник, в 00:01 берега уже нет — успел или не успел, третьего нет.</p>\n<p>Выхода нет никакого. Ни для того, кто желание получит, ни для того, кто не получит, ни для тех десятков, что остались на палубе. Правило для входа названо жёстко, правило для соседнего случая — выхода — не проговорено ни разу, при том что на нём держится вся арифметика рассказчика: он потому и калечит людей на берегу, что считает, будто желание одно. Догадка про одно желание, кстати, тоже ничем не подтверждена — но это статья уже отмечает; я показываю другое место, вход без выхода.</p>\n<h3>Отклик</h3>\n<p>Рассказчик здесь работает лучше, чем должен бы. Шутка «мы супер группа. Команда сильней чем рейнджеры» проваливается — «не кто не оценил. Лишь построили раздраженый лица», — и смеётся только Паша, школьник, самый мелкий. К финалу Пашу утаскивают во тьму первым. Никто этого не подчёркивает, оно просто так лежит. И рядом фраза, ради которой, по-моему, вся эта группа и существует: «Хм значит неплохо быть в группе. Ведь первым ты всё равно не умрёшь». Человек называет свою команду супергруппой и в тот же вечер объясняет сам себе, что ценность команды — в очереди на смерть. Плюс «Было мерзко. Но привычно. Я привык быть в чужих органах и крови» — брошено мимоходом, ничем не объяснено, и от этого страшнее, чем если бы объяснили. Жаль, что текст не дочитали: он не про исполнение желаний, а про то, каким голосом человек рассказывает о себе, не замечая, что рассказывает.</p></div>", "r": []}];</script>
