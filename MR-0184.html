<script>const BASE="";const DOCNAME="Феня";
const LEAD="<p>Вторая вселенная соавторов, получившая имя прямо в окне w0113 (2025-12-09, id 394730–394839). До этого называлась описательно — «вторая Вселенная». Встречается также написание со строчной буквы: «феня».</p>";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0184-S01", "MR-0184--ustroystvo"], "h": "<p>Феня определена не через географию, а через уровень силы. Слава: «А после она просто стало лёгкая вселенная. То есть сверх силы там слабее. И в теории даже обычные человек способен победить сверхчеловека. Из-за легче развивать отношения людей» (394757). Та же мысль повторена позже: «По сути Вселенная лёгкая я же её придумал для развития персонажей, чтобы не заморачиваться над системы силы» (394839).</p>\n<p>То есть устройство задано двумя правилами:</p>\n<ul>\n<li>сверхсилы здесь слабее, чем в Оам;</li>\n<li>обычный человек в теории способен победить сверхчеловека.</li>\n</ul>\n<p>Цель обоих правил названа прямо — облегчить развитие отношений между людьми и не разрабатывать подробную систему силы.</p>\n<p>Происхождение вселенной: она возникла не как мир, а как попытка проверить один образ. Слава: «Вообще это Вселенная появилась лишь потому что я пытался тот образ гг сделать в настоящим» (394757) — речь про образ бессмертного главного героя. Только потом она «просто стало лёгкая вселенная».</p>\n<p>Название. Вариант «феня» предложил Миколай: «пусть будет феня» (394745), пояснив: «феня это язык торговли, где всех наёбывали и придумали слово лох» (394749). Слава сперва отреагировал непониманием («Что это за унизительно остановки речь. Она предназначена для подавления воли?», 394746; «Сам ты Феня», 394748), затем принял: «Тогда феня» (394751) и подвёл обоснование: «Феня. Идеально описывает всех сверхлюдей. Их наебали» (394753).</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0184-S02", "MR-0184--naselenie"], "h": "<p>Названы сверхлюди Фени — те самые, которых «наебали», и обычные люди, способные в теории сверхчеловека победить. Разница между ними, по заявленному правилу, невелика.</p>\n<p>Отдельно упомянут бессмертный главный герой: на реплику Миколая «раз гг долбаеб» Слава ответил «Это не гг» и «Гг бессмертный» (394737, 394740–394741). Из связей сущности сюда же относится Образ бессмертного гг, из которого вселенная и выросла, и Отец.</p>", "r": []}, {"t": "Место во вселенной — как связан с другими мирами", "a": ["S03", "MR-0184-S03", "MR-0184--mesto-vo-vselennoy"], "h": "<p>Феня — вторая вселенная. Первая — Оам. Слава перечисляет, что уже есть, задавая вопрос о названии: «Как назвать вторую Вселенную. Первая Оам. Ещё есть семь островов И правитель. А эту как назвать?» (394734). Семь островов и правитель названы как существующие элементы, но к какой именно вселенной они относятся, из реплики не следует.</p>\n<p>Противопоставление с Оам сформулировано прямо: «Просто в Оам все чё-то слишком сильный. Да и Оам Вселенная большая как боевик» (394757). Феня относительно Оам — лёгкая, с ослабленными сверхсилами и упором на отношения; Оам — большая и боевиковая, с очень сильными персонажами.</p>\n<p>Способ связи двух вселенных (переход между ними, общая история, общие персонажи) в переписке не обсуждается.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0184-S04", "MR-0184--kak-menyalsya-po-versiyam"], "h": "<p><strong>2025-12-09, версия 1 (id 394730–394753).</strong> Обсуждение имени. Отклонённые и попутные варианты, прозвучавшие до принятия: Слава предлагает «Вторая» (394738); Миколай в шутку предлагает назвать по имени Славы — «та к и назовём», «вай какой» (394736, 394739). Оба уходят. Принято «феня» с обоснованием через воровской язык торговли и через обманутых сверхлюдей. В качестве примера логики названия Миколай приводит: «типа Инфинити это бесконечность» (394747).</p>\n<p><strong>2025-12-09, версия 2 (id 394757).</strong> Задним числом объяснено происхождение вселенной: она появилась из попытки сделать образ бессмертного гг настоящим, а затем стала «лёгкой» — сверхсилы слабее, обычный человек может победить сверхчеловека, отношения людей развивать легче. Здесь же противопоставление с Оам.</p>\n<p><strong>2025-12-09, версия 3 (id 394839), повтор прежней мысли.</strong> То же самое короче: «Вселенная лёгкая я же её придумал для развития персонажей, чтобы не заморачиваться над системы силы».</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0184-S05", "MR-0184--probely"], "h": "<div class=\"gaps\"><ul>\n<li>География, страны, эпоха Фени не описаны вообще — вселенная задана только через уровень силы и задачу.</li>\n<li>Кто и как «наебал» сверхлюдей — в переписке не сказано, обоснование названия дальше формулировки не развёрнуто.</li>\n<li>Чем именно сверхсилы Фени слабее сил Оам, где проходит граница — не уточнено; система силы намеренно не разрабатывалась.</li>\n<li>К какой вселенной относятся «семь островов» и «правитель» (394734) — не сказано.</li>\n<li>Как Феня связана с Оам сюжетно — не обсуждалось.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0184--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0080.html\">Сверхлюди (Феня)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0011.html\">Феня</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0184--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-12-09</td>\n<td>394730–394753</td>\n<td>w0113</td>\n<td>Феня (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-09</td>\n<td>394757–394757</td>\n<td>w0113</td>\n<td>Феня (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-09</td>\n<td>394839–394839</td>\n<td>w0113</td>\n<td>Феня (объявлено)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0184-fenya.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0184--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0184.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
