<script>const BASE="";const DOCNAME="Я защитник";
const LEAD="";
const CH=[{"t": "Об этом тексте", "a": ["S01", "PR-0023-S01", "PR-0023--ob-etom-tekste"], "h": "<ul>\n<li>Дата: 2024-08-11</li>\n<li>Сообщения: 217605–217606</li>\n<li>Состояние: дописано</li>\n<li>Действующие лица: рассказчик («я защитник»), его жена, дочь, гоблины (брошенные дети), полицейский-следователь, друг, монстр Беркута, мальчики Кирилл и Паша</li>\n</ul>", "r": []}, {"t": "Текст", "a": ["S02", "PR-0023-S02", "PR-0023--tekst"], "h": "<p>Я защитник. Вы спросите защитник чего, и я вам отвечу защитник благополучия и семейного очага. И как же я им стал ну давайте поведаю.</p>\n<p>Был я обычным офисным сотрудников ну не прям обычным ну суть вы уловили, жил я в частном доме, в большом доме с огородом, прям как в деревне. И вместе со мной жили прекрасная жёнушка которая с годами становится только красивее, и дочь которая в моем сознания была милейшим созданием и как вы понял я их очень обожал. Да мы тот самый 1 из 1.000 у которых счастливый брак и я рад этому. Моя жизнь шла стабильно и размерено, можно сказать лучше некуда. Я жил в идеальном зоне комфорта, пока меня от туда не выпнули, схватили за волосы и вытащили из моего такого любимого и давно забытого круга комфорта. И вам интересная что за паскуда, точней паскуды вытащили, вынесли меня от туда. Вот сейчас я вам и расскажу. Этот день был обычным таким же как вчера или после вчера или год назад. Все прекрасная, даже смог пораньше уйди с работы и прийти к любимым. Смог поиграть с дочуркой, смог поговорить с женой. И вот сели мы ужинать, как сука неожиданно окно, своим телом разбил сука карлик. Сука как это существо ещё можно назвать карлик серым оттенка кожи, при этом Галина имеет длинный когти на руках, и острый зубы, при этом одеты как бомжи . И как мне по-вашему реагировать на это в мой в дом ,в окно вламываются бомжеватый карлик с каким-то заболеванием кожи. Ну я как бы схватил то что первое попалась на руку и швырнул паскуде прямо в морду, а швырнул я тарелку супа, поэтому карлик особо не пострадал но стал злей. На что я резко встал схватил стул и начал вертеть им вокруг до около. А жене кричу бегите в комнату  и вызывайте полицию ,ну они побежали. А я все махаю этим стулом, а карлики не подходят бояться паскуды, как вдруг сверху, ну то бишь как видимо с потолка, дал мне по затылку и я сразу упал. Нет я не потерял сознания просто упал от неожиданного удара прям по затылку. Лежу прихожув себя, а эти карлики к двери в, котором была моя дочь и жена  посеменили всей толпой. И долго не думая схватил одного за ногу и как начал долбить его по лицу. И как бы друзья его долго просто так не стояли а как на прыгнули и начали кромсать лицо, грудь и руки, даже глаз мне выкалили. Но что характерно в шею не одна паскуда мне не поцарапала, словно просто хотели причинить боль не убивая. И конечно же я вырубился, да здесь сука любой вырубится. Проснулся я уже в больнице, как видимо жена всё-таки успел вызвать полицию. Оглядываясь и здесь заходит полицейский, и сразу начал спрашивать, что с женой и дочкой, поймали ли они карликов, не понравились ли дочка и жена и все в том духе. Полицейский на все ответил, лучше бы не отвечал, лучше бы я вообще умер в тот день. А рассказал он мне вот что.позвонили им в дежурку и заявили о нападении, так они сразу табильная похватали и поехали по адресу. Видят все стекла выбиты, а дверь цела, ну они долгой не думая зашли видят сначала меня изуродованного, и дверь расцарапаную  и открытую, а там боже упаси. Невероятная месива вся комната кровью облита, и в центре комнаты женщина без пол головы, и ещё выпотрошенная. Не одного внутреннего органа не было внутри так и в доме. Ну они ещё раз весь дом обошли проверили что некого нету, и вызвали мед скорую и подкрепления. Вот меня и в больницу доставили, обработали, зашили и болей удаляющий внутри вено пустили. И у меня сразу же вопрос возник, где моя дочь. Следователь сказал что её не было в доме и в окраинах. И знаете , что я чувствовал, нет конечно не знаете вам не приходить терять самого близкого человека, человека которому ты отдал свой сердце и душу. Это смесь чувств вина, горечь, грусть, эмпатия но властвовал над всеми другими гнев. Гнев который способен был выразить человек  , который все. Наверняка вас интересует почему я сказал только о гибели свой жены, а про дочь не слово, потому что я твердо уверен что она жива, да можете сказать это глупо, но единственная вещь, которая заставила меня встать. После того как пролежал в больнице некоторая время. Я начал искать информацию о этих карликах в мифологии.</p>\n<p>Ведь сука я был уверен что это не человек, это ебучий гоблины. Полиция их искал как мою и дочь но после неудачных попыток, закинул это дело в долгий ящик. И нет я их не вину я ведь уже говорил что эти тварь, мифологический тварь, поэтому поймать полиций их конечно невозможно. Да я рад если бы их поймала полиция их бы просто посадили, а так если я их найду то явно сделаю с ними довольно болезненный вещи. Ну ладно вернёмся сути отыскал я похожих монстров из мифологий. Брошенный дети, недоношенный дети которых просто выкидывали их же мамы, они становится злыми духами, и ненавидят детей который получили заботу от родителей. Также ненавидят и всех женщин, а вот о мужчинах не слово, их всегда выкидывала именно мать. Вот поэтому они не убили меня, ну точнее я так думаю. Ну и дальше все просто я начал готовиться к встречи с ними, как я говорил ранее я был офисным работником поэтому физически был плохо сложен, поэтому я начал посещать все возможный клубы и по боксу и по борьбе и по тэхвондо. Начал выжимать из себя все соки, что как можно быстрее стать сильнее. При этом я работал также активная ведь чем больше денег чем опасней оружия я могу купить. И кстати у меня на лице осталась не мало шрамов, поэтому и на работе и в спортзале на меня косились но мне было без разницы у меня есть цель и я к ней иду. И вот спустя год тренировок и покупки ружья, а также попытки добычи информацией и место нахождения тварь. Я понял мне нужно практика в драке не та что в спортзале а настоящая. Поэтому одна старую одежду, обмотав голову бинтов, так как у шрамы из за которых меня могут легко вычислить. Ну и начал гулять на в неблагополучных районах, и как  счастья ко мне пристали пьяная группа отморозков. И тогда я весь скопившиеся гнев и ярость пустил на них сломал я одну в руку, второму две ноги и пытался заставить на них ходить, другому лицо размазал, что у него могут и похлеще шрамы остаться   чем у меня. И конечно вы скажите зачем так жесток они же тебе ничего не сделал. Да мне они ничего не сделали, но сколько жизней они могли сломать или уже сломали, сколько счастливых семье разрушили. Так что я защитил будущих жертв и мне ни капли их не жалко. Долбоебов который толпой нападают и ведут себя словно они короли, думают, что бы они не сделали им все сойдёт с рук. Так как это было хорошая места я начал там часто быть для практики, меня даже прозвали народным мстителем. Ну всё это фигня, ведь я так не смог найти не одного чудовища, ни монстра ни чево. Я уже не знал что мне делать, я уже начал думать , что может я глюк словил и на самом деле на нас напали не брошенный дети, а обычные люди. Я уже переставал верить в свою цель вдруг друг, который единственный не бросивший меня в трудно время который всегда помогал и помогает мне, не рассказал о массовом суицид детей в одном городе. И что ходить мольба, что виновен во всем Беркута, какой то летающий монстр, и угадайте, что я сделал да я отправился в тот город купил квартиру и сутки на пролет сидел на балконе, и вот когда я уже отчаялся, он сука появился. Вы даже не представляете как я был рад, до глубины души. Но при этом гнев не куда не ушли и я схватил мачету и ударил по крылу. Что бы гнилостная тварь не улетела. Я знал сколько оно убило, самого первого мальчика Кирилла чьи родители даже сейчас страдают и винят себя, до последнего мальчика Паши. Я знал сколько семье оно уничтожило, и я начал её кромсать, при этом не убивая. Я ведь хотел чтобы она страдала, и только в конце когда оно ничего не могло сделать я скинул её с балкона, и представляете они испарилась. Я сначала испугался подумав что дал ей сбежать но проведя на балконе ещё 2 неделе я уверувался, что оно сдохло.</p>\n<p>Я защитник, и я буду защищать</p>", "r": []}, {"t": "Связи — всё вместе", "a": ["PR-0023--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0039.html\">Брошенные дети (гоблины)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["PR-0023--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PR-0023.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
