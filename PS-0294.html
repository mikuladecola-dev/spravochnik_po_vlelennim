<script>const BASE="";const DOCNAME="Низший Поротай";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0294-S01", "PS-0294--proishozhdenie"], "h": "<p>Материал относится к вселенной, объявленной 2025-09-17 репликой «Разрушаем вселенную» (id 366030); собственного названия в переписке ей не дали.</p>\n<p>Низший Поротай введён Славой 2025-09-17 в 07:46–07:48 (id 366034–366036), в том же сообщении, где заданы апостолы (те, кто съел насекомое, шанс выживания 13%, всего насекомых 21). Это второй из трёх исходов поедания жука: «превращаются в низший Поротай (горбатого двух лицого, полукаменного-полуплоти, и ты теряешь личностей и слушаещя высшего Поротая) способности крепкость, реген, сверхсила» (id 366035).</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0294-S02", "PS-0294--vneshnost"], "h": "<p>Горбатое, двуликое (двух лицого), полукаменное-полуплотяное существо (id 366035).</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0294-S03", "PS-0294--harakter"], "h": "<p>Теряет личность, подчиняется высшему Поротаю: «ты теряешь личностей и слушаещя высшего Поротая» (id 366035).</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0294-S04", "PS-0294--sposobnosti"], "h": "<p>Крепость, регенерация, сверхсила (id 366035).</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0294-S05", "PS-0294--svyazi-s-drugimi"], "h": "<p>Подчиняется Высшему Поротаю (<a href=\"PS-0295.html\">Высший Поротай</a>): «слушаещя высшего Поротая». Часть общей задумки «Поротай», введённой в одном сообщении с апостолами.</p>", "r": [["Высший Поротай", "PS-0295.html"]]}, {"t": "Как менялся", "a": ["S06", "PS-0294-S06", "PS-0294--kak-menyalsya"], "h": "<h3>2025-09-17 (id 366034–366036)</h3>\n<p>Единственная зафиксированная версия — второй из трёх исходов поедания жука (первый — смерть, третий — высший Поротай, <a href=\"PS-0295.html\">Высший Поротай</a>). Открытый вопрос о происхождении насекомых и монстров (id 366036) касается и низшего Поротая, ответа нет.</p>", "r": [["Высший Поротай", "PS-0295.html"]]}, {"t": "Что с ним стало", "a": ["S07", "PS-0294-S07", "PS-0294--chto-s-nim-stalo"], "h": "<p>Дальнейшего развития в прочитанном материале нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0294-S08", "PS-0294--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Не назван вид жука, поедание которого даёт этот исход.</li>\n<li>Не раскрыто, откуда взялись насекомые и монстры (вопрос id 366036 без ответа).</li>\n<li>Не сказано, что происходит с потерянной личностью — только сам факт потери, без деталей.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0294--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0295.html\">Высший Поротай</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0295.html\">Высший Поротай</a>, <a href=\"PS-0296.html\">Антиапостолы / Одержимые</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0007.html\">Новый мир</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0294--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-09-17</td>\n<td>366034–366036</td>\n<td>w0105</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0294-nizshiy-porotay.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0294--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0294.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
