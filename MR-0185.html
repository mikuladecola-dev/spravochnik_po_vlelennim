<script>const BASE="";const DOCNAME="Боги во вселенной Феня";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0185-S01", "MR-0185--ustroystvo"], "h": "<p>Во вселенной Феня боги существуют. Слава формулирует это так: «Боги конечно есть, но они будут появляться изредка» (2025-12-09, id 394784). То есть их наличие не отрицается, но частота их появления в материале заранее ограничена — изредка.</p>\n<p>Отец к богам не относится. Ответ дан на прямой вопрос Миколая «бог?» — «А их отец не Бог» (2025-12-09, id 394781–394784). Кем Отец является вместо этого, в данном обсуждении не сказано.</p>\n<p>Отдельно очерчен предел божьих возможностей, и очерчен он через душу. Слава: «Душа всегда принадлежит человека. Её нельзя отнять или купить», «Даже Бог на такое не способен», «Что говорить уже о Отце» (2025-12-09, id 394843–394847). Таким образом душа выведена из-под власти богов полностью: она не отчуждаема ни силой (отнять), ни сделкой (купить), и запрет распространяется на самый верхний уровень — на Бога. Отец в этой иерархии стоит ниже: раз на такое не способен даже Бог, то тем более не способен Отец.</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0185-S02", "MR-0185--naselenie"], "h": "<p>В переписке названы боги как класс и Отец как отдельная фигура, к богам не принадлежащая. Ни имён отдельных богов, ни их числа, ни пантеона в этом обсуждении нет.</p>", "r": []}, {"t": "Место во вселенной — как связан с другими мирами", "a": ["S03", "MR-0185-S03", "MR-0185--mesto-vo-vselennoy"], "h": "<p>Запись входит во вселенную Феня. Связь с конкретными мирами внутри Фени в переписке не обсуждалась.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0185-S04", "MR-0185--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-12-09 (id 394781–394784).</strong> Установлено: боги во вселенной есть, появляться будут изредка, Отец богом не является.</p>\n<p><strong>Версия 2 — 2025-12-09 (id 394843–394847).</strong> Тем же днём добавлено ограничение сверху: душа всегда принадлежит человеку, её нельзя отнять или купить, и на это не способен даже Бог — тем более Отец.</p>\n<p>Первая версия при этом не отменяется: вторая только достраивает границу божьих возможностей.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0185-S05", "MR-0185--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Не сказано, кто такие боги, сколько их и как они называются.</li>\n<li>Не сказано, кем является Отец, если он не бог.</li>\n<li>Не раскрыто, что означает «появляться изредка» — редкость их присутствия в мире или редкость их появления в сюжете.</li>\n<li>Написание «О» с большой буквы у слова «Отец» Миколай спрашивает прямо («у тебя всегда О с большой буквы?», id 394783), ответа на этот вопрос в переписке нет.</li>\n<li>Не сказано, что боги с душой всё-таки могут делать, если отнять и купить нельзя.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0185--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0080.html\">Сверхлюди (Феня)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0011.html\">Феня</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0185--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-12-09</td>\n<td>394781–394784</td>\n<td>w0113</td>\n<td>Феня (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-09</td>\n<td>394843–394847</td>\n<td>w0113</td>\n<td>Феня (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0185-bogi-vo-vselennoy-fenya.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0185--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0185.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
