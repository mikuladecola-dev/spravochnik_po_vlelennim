<script>const BASE="";const DOCNAME="История про Антона (Антоша)";
const LEAD="";
const CH=[{"t": "Об этом тексте", "a": ["S01", "PR-0058-S01", "PR-0058--ob-etom-tekste"], "h": "<ul>\n<li>Дата: 2025-03-13</li>\n<li>Сообщения: 301819–301824 (ранее тот же текст выложен фрагментом без завязки, 301805–301809)</li>\n<li>Состояние: дописано; выкладывалось дважды в один день — сначала кусок без начала (301805–301809), затем Слава перевыложил текст целиком с завязкой (301819–301824) и подтвердил: «Читай. Я проверял. Это полный». Второй диапазон дословно содержит весь текст первого, поэтому ранняя выкладка не утрачена; отдельной второй редакции нет.</li>\n<li>Действующие лица: Антон Смирнов (Антоша), его альтро-эго — брат, старик-Арбетар, Дмитрий Рутковский («Дима», кодовое прозвище «Агрегат»), бабушка (упоминается)</li>\n</ul>", "r": []}, {"t": "Текст", "a": ["S02", "PR-0058-S02", "PR-0058--tekst"], "h": "<p>Ну что я за мудак, нахрена я это сделал. Вот теперь разхлебывай. А что мне нужно было сделать? Смотреть а. Или сделать вид, что я ничего не заметил, как пацана явно безпризорника, какой-то жилистый мудин в свой фургон заталкивает. Ну не знаю можно было припугнуть или позвонить полицией,это всё равно не твоё дело. Эх телефона то у меня не было, а припугнуть и чтобы я этим добился. А сейчас ты чего добился. Мужика этого сам пинком в его же фургон запихнул и по затылку ему ты начал колотить, а пацан то молодец сразу смекнул, что сваливать надо, ну и убежал, а ты и не заметил, продолжая бить этого жирдая. Ну это ещё ладно, нафига ты начал искать у него ключи?!, почему ты просто не ушёл, когда их не нашел, зачем ты полез на передния сидения? Зачем ты их нашёл? И поехал в лес? Можно было просто уйти он же тебя не видел . Ты как будто не понимаешь, что отпусти я его так, то он бы продолжал воровать детей. А тебе то какая разница на этих детей? Ты и так в бегах. Так нафига? Потому- что я знаю этих детей, я же и подкармливал. И что?. И что сейчас будешь делать?после того как ты его уже привязал к дереву, что ты собираешься делать. Я не знаю. Ну да, ты же правидник сука. Ну почему я должен быть именно твоим альтро-эго? <br>-Тише он просыпается! </p>\n<p>Пиздец это самая говнище, меня повязали и ладно если полиция. Ну нет, здесь полицией вообще не пахнет. Воняет только психом, который сам собой болтает. И че делать? <br>-эй мужик тебе то это надо? Ты же сам должен понимать, что у меня есть крыша, и если я исчезну они найдут тебя, поэтому давай ты меня отпустишь, хорошо?  как можно более успокаивающее голосом произнёс я<br>-если я тебя отпущу вы же меня потом убьете-сказал псих. Клюнул, дела за малом <br>-нет, если они узнают, что я вот так лохонулся, то меня тоже убьют, поэтому я никому не расскажу -ха, а неплохо я стилю. <br>-лад... Нннееееттт!. Раз уж начали то надо доделывать, ты меня слышишь.Я устал убегать, мы и так уже в самой жопи мира, прячемся от криминала потому-что ты решил помочь пацанчику, по итогу теперь этот пацанцик, Где-то спокойно проводит время, а ты в жопе, так зачем усугублять, согласись- начал он спорить самим собой. Сука он точно шизик. Так спокойно, на психов главное не давить, а спокойно пояснить ситуацию<br>-не беспокойся тебе  не нужно будет убег..... ааааа- сука, сука, это гнида меня моим же молотком по коленной чашечки убарила, сука болить, како ва он так резко ? <br>-Ладно! Ладно раз уж решил подохнуть, так давай быстрее, узнай у него, кто же покупатель- проревел он, а меня окутал страх, он же меня точно убьёт..хрусть. Сука снова ударил только в другую чашечку <br>-кто покупатель? -повторил он словно я не услышал первый раз педрила. Я молчал, ведь тех людей фиг знать, что могут со мной сделать. Молчал я долго, даже когда он продолжал бить по чашечкам, даже когда он начал ломать пальца и пихать в ногти деревьяшки я долго молчал, что уже наступил утро, а потом день,я молчал. Но я не смог молчать когда он стянул с меня штаны и уже целился молотком мне в промежность. Вот тогда я всё вывалил.Что доставляю детей в один из элитнеших ресторанов, что там любят кушать человечину, что я всего лишь шестерка, который сразу устранять если я хотя бы слова пророню, и что в том ресторане кушает даже начальник полиции, поэтому безполезно. Или пытаться что-то сделать, так что отстань уже от меня </p>\n<p>Вот сука, это оказалось куда отвратильней. И что делать? Что делать сваливать в другую жопу мира в надежде, что тебя так и быть не тронуть, не заметять, а как же дети? Ты лучше о себе переживал бы, ты кем себя возомнил героям в сияющих доспехах, неужто тебе на столько понравилась книжка, которую читала тебе бабушка. Эй это вообще к чему? Ладно ладно всё задраль поехали.Что? Так бабушка здесь причём? Всё всё понял езжай уже. А с этим, что делать? Да оставь его, всё равно некуда не уйдёт. Ну ладно.<br>И как будем, что делать? Вау вдруг у меня спрашиваешь я думал мои слова здесь не имеют значения. Да харе, ты же мой альтро-эго должен помогать. А ты лысая обезьяна. Ладно понял прости. И так?  Возми базуку и стрелни в этот ресторан, или запусти туда ракету, или вообще можно ядерку. Хаха смешно прям не могу, а теперь давай серьёзно. Что серьёзно у нас нету ничего, даже сука пистолета. Ну можно машиной туда врезаться, ближе к ночи. Можно-можно всё можно. Эй я здесь идей предлагаю, а ты ржёшь. Дай хоть чуть-чуть тебя позлить. Ладно и что. Что-что возьмём взаймы и кредиты и пожрем нормально перед смертью. Желудок вот уже к спины касается. Ну да этого бы не помешало бы. <br>Ночью 3:00<br>И что готов. Нет, но ты же не остановишься да?! Да<br>Фургон в 3 часа ночи въехал в один из элитных ресторанов...... </p>\n<p>-какого черта? <br>Что происходит? Где я? Аааа ааа, голова ломит, какого? Блять я в каком-то ящики. Сука в железном ну или нет, не знаю, в темноте как то несподручно понять, в каком ящике меня заперли. Ну точно не в деревянном, слишком холодный, гладкий и крепкий, как мне отсюда выбраться. Ладно, ладно не ной. Всё будет хорошо Антоша,  ты выберешься и жизнь твоя будет долгой и счастливой, главная спокойствия, но один черт сердце колотиться. Нифига это не успокаивает, ещё сука клаустрофобия начилась, а ухудшает сеë деяния, то что я связан, и гнида неудобно связали меня падлы. Руки за спиной, при этом я на спине лежу, и ноги привязаны, и это коробка мне мала, лежу в ней как селёдка в консейрве.  И вы не представляете, какой спектор эмоции я испытывал, вы же наверное не оказывались связанным, в тесном ящике, в темноте. Пиздец... Сука блять словно молитву повторял я. Все матершиный слова который в жизни знал. И походу этого начал вертеться как червякь, я словил панику, истерику, страх и всё возможные эмоций. Я орал словно умалишенный и бился головой об железную стенку, я не понимал где я? Я потерялся в пространстве и не понимал где вверх? Где вниз ? Где права? Где лева? Я настолько окунулся в эту панику, что продолжал орать и вертеться, пытаясь головой пробить железную дверцу, даже когда меня уже оттуда выпустили я продолжал и даже тогда, когда меня словно пса оттуда выкинули на деревьяный пол я продолжал орать и вертеться, словно в конвульсиях. И лишь тогда когда на меня вылили на голову ведро холодной воды, я пришёл в себя. <br>-Пацан с тобой всё в порядке?-Волнуюсь произнес, какой то старик <br>-эй а да!? - не до конца придя в себя произнес я. <br>-ну и хорошо, а то я испугался, что какая болезнь у тебя- выдохнул дед<br>-а где мы? -робкой произнес я. Уже слегка придя в себя, я заметил как сука элеганский он одет. С бородкой как у бизнесменов, с чёрными волосами, одет в смокинг. <br>-мы! Мы то в деревне Лихой, знаешь такую? - радостно словно ребёнок произнес старик. А я слегка испугался, а где альтро-эго? <br>-нннет-слегка испугана произнес я. Дед ухмыльнулся. <br>-ну это и понятно, я сам еë ели ели нашёл, если бы не учитель, вообще не знал бы о такой. <br>-а что здесь делаю я? -тихо словно нагадившая псина пропискал я, и в это же время кричал про себя. Эй, ты где? Не пугай? Да тихо ты! Я думаю, как нам отсюда выбратся. Я ещё не до конца всё понял, я всё же позднее тебя проснулся, только сейчас. В смысле? Разве ты не должен просыпаться с  стану агентом! - прокричал я ему в спину. Я отомщю за брата. Я убью его. Да и я не смогу нормально спать если буду знать, что кого то, мог спасти. Но не сделал этого. Я же праведник сука. <br>-я не приму этот ответ. Я приду сюда через три дня и тогда ты дашь мне ответ- уходя сказал он. Но я знал, что через три дня мой ответ не изменится.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Дороже всего здесь не нехватка материала, а его раздвоение. <code>MN-0015</code> «Деревня Лихая» и <code>MN-0016</code> «Деревня Лихой» — две отдельные статьи, 20 758 и 20 893 знака, у обеих ноль ссылок, и ни одна не упоминает другую ни разу. В первой — братская могила и вторая мировая (<code>PR-0056</code>, 2025-03-03), во второй — ритуал арбетара и Россия (этот текст, 2025-03-13). Имена расходятся на одно окончание, даты — на десять дней. Вопрос «одно это место или два» в справочнике не задан вообще, ни в тексте статей, ни в «Пробелах». А внутри <code>MN-0016</code> сидит ещё и третье место, деревня Ливия, которая в базе слита с Лихой как вариант имени, хотя в тексте они разведены специально: «Нет, этот дом не в деревне Лихой, а в деревне Ливия, ближе Санкт-Петербург». Итого на географию этого текста приходятся две статьи и один слипшийся дубль, и ровно через эту точку идёт единственная возможная связь с <code>PR-0056</code>.</p></div>\n<div class=\"mnote\"><b>⚙ машинная заметка · Как развивалось — не материал авторов</b>\n<p>Всё уложилось в один день. Сначала текст выложен куском без завязки (301805–301809), потом перевыложен целиком (301819–301824) с подтверждением «Читай. Я проверял. Это полный». Ограничения пришли тут же и с двух сторон: снаружи — ответ про страну, внутри — отделение Ливии от Лихой прямой репликой. Забыто в тот же день: вопросы 301841–301845 остались без ответа, а «заготовки» отложены репликой самого текста — «Как? Потом узнаешь сейчас главное выбраться», — и в переписке к ним не возвращаются (в <code>PS-0221</code> и <code>PS-0222</code> это записано отдельными пунктами). Вернулись на следующий день, 2025-03-14: последний абзац с выбором мишени («Аа точно, защитник») развёрнут в <code>PR-0059</code>. Но и там нигде прямо не сказано, что рассказчик — этот старик; в <code>PS-0224</code> помечено: «связь читается по контексту и по левому краю окна».</p></div>\n<div class=\"mnote\"><b>⚙ машинная заметка · Отклик — не материал авторов</b>\n<p>Самое сильное здесь — техническое, и я не уверен, что сделано нарочно. Монолог старика на полторы страницы — это чистая выгрузка сеттинга, худший из известных способов рассказать мир. Но он вставлен в текст так, что герою нужно, чтобы старик говорил подольше: «Без разницы просто слушай. Потяни время». Экспозиция становится тактикой, и читаешь её не как справку, а как отсчёт. Плюс её всё время перебивает второй голос — «он что мне решил всю свою биографию рассказать. Харе ныть ты нас в это втянул», — и голоса не разделены ни кавычками, ни атрибуцией, различаешь их только по интонации. К середине привыкаешь и перестаёшь спотыкаться, а потом текст этим пользуется: пропажу второго голоса замечаешь раньше, чем герой.</p></div>", "r": []}, {"t": "Примечания и поправки", "a": ["PR-0058--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PR-0058.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PR-0058-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PR-0058/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дороже всего здесь не нехватка материала, а его раздвоение. <code>MN-0015</code> «Деревня Лихая» и <code>MN-0016</code> «Деревня Лихой» — две отдельные статьи, 20 758 и 20 893 знака, у обеих ноль ссылок, и ни одна не упоминает другую ни разу. В первой — братская могила и вторая мировая (<code>PR-0056</code>, 2025-03-03), во второй — ритуал арбетара и Россия (этот текст, 2025-03-13). Имена расходятся на одно окончание, даты — на десять дней. Вопрос «одно это место или два» в справочнике не задан вообще, ни в тексте статей, ни в «Пробелах». А внутри <code>MN-0016</code> сидит ещё и третье место, деревня Ливия, которая в базе слита с Лихой как вариант имени, хотя в тексте они разведены специально: «Нет, этот дом не в деревне Лихой, а в деревне Ливия, ближе Санкт-Петербург». Итого на географию этого текста приходятся две статьи и один слипшийся дубль, и ровно через эту точку идёт единственная возможная связь с <code>PR-0056</code>.</p>\n<p>Второе — <code>SL-0066</code> «Разбор истории про Антона»: статьи нет, 8 664 знака в базе, ноль ссылок. Это разговор соавторов именно об этом тексте, и он лежит неразобранным, пока сам текст стоит без единой связи.</p>\n<p>Третье — <code>SL-0089</code> «Список категорий сил (Благословенный, Арбетары, Альфы, Чужемирцы, Владельцы артефактов, Фантазёры)»: статьи нет, 1 753 знака, четыре ссылки. Монолог старика — это, по сути, единственное место, где категории проговорены не списком, а через различие: «у альфа и арбетатов похожий силый. Они как и мы может использовать свою силу 24/7 без риска повредить мозг», «благословенный не могут использовать благословенния долга, поэтому можно просто неожидано напасть и убить». Опорная запись, на которую вешаются <code>MR-0146</code>, <code>PS-0281</code> и группы, стоит без статьи и почти без материала.</p>\n<h3>С чего начать</h3>\n<p>В базе, не в архиве. Материал этого текста уже разъехался по восьми записям, и почти везде базы вдвое-вчетверо больше статьи: <code>PS-0224</code> старик-арбетар (статья 31 395, база 90 651), <code>PS-0221</code> Антон Смирнов (27 943 / 74 390), <code>PS-0222</code> альтер-эго-брат (19 174 / 72 757), <code>SP-0198</code> ритуал становления Арбетаром (26 429 / 48 879), <code>SP-0196</code> заготовки (15 473 / 48 534), <code>SP-0199</code> проводник (15 311 / 39 325), <code>PS-0223</code> Дмитрий Рутковский (15 362 / 21 902), <code>MN-0016</code>. У самой статьи <code>PR-0058</code> раздела «Связи» нет вовсе, и ссылок на неё ноль — то есть обратной дороги от этих восьми к тексту нет ни одной.</p>\n<p>В архив имеет смысл идти за одним конкретным местом: 2025-03-13, id 301841–301845 — вопросы Миколая про альтер-эго, про чистую душу и про раздельный разум. И в <code>PS-0222</code>, и в <code>MN-0016</code> помечено, что ответа на них не последовало; отвечено только на «деревня лихой в России? или в Германии?» — «В Росси» (id 301846). Проверять надо, не ответили ли позже, в w0080–w0081, 13–14 марта, — потому что на следующий день Слава пишет продолжение, и вопросы могли уйти туда.</p>\n<h3>Как развивалось</h3>\n<p>Всё уложилось в один день. Сначала текст выложен куском без завязки (301805–301809), потом перевыложен целиком (301819–301824) с подтверждением «Читай. Я проверял. Это полный». Ограничения пришли тут же и с двух сторон: снаружи — ответ про страну, внутри — отделение Ливии от Лихой прямой репликой. Забыто в тот же день: вопросы 301841–301845 остались без ответа, а «заготовки» отложены репликой самого текста — «Как? Потом узнаешь сейчас главное выбраться», — и в переписке к ним не возвращаются (в <code>PS-0221</code> и <code>PS-0222</code> это записано отдельными пунктами). Вернулись на следующий день, 2025-03-14: последний абзац с выбором мишени («Аа точно, защитник») развёрнут в <code>PR-0059</code>. Но и там нигде прямо не сказано, что рассказчик — этот старик; в <code>PS-0224</code> помечено: «связь читается по контексту и по левому краю окна».</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Чистота души здесь оцифрована подробнее всего остального. Нужен проводник «не прям 100% чистой душой, а где-то на 80% плюс минус»; у Антона 89%; дети от 3 до 12 берутся не потому, что чище, а потому, что через них «проходить мало силы»; шанс старика без проводника — 0%, с ним — 8%. Для одного носителя правило названо в числах, с порогом, с обоснованием и с ценой.</p>\n<p>А через полглавы выясняется, что тело было не одно на одну душу: «В одном теле было две души, и обе были чисты». И к этому случаю проценты не приложены никак. 89 — это чьё, его, брата, среднее, суммарное; считает ли обряд душу или тело; знал ли старик, что берёт двоих, когда рылся в биографии Антона и не нашёл там второго. В тексте прямо сказано, что урон достался брату, — то есть обряд их различил. Для одной души шкала есть, для двух в одном теле — не проговорена, хотя ровно на этом различении держится и то, что Антон выжил.</p>\n<h3>Отклик</h3>\n<p>Самое сильное здесь — техническое, и я не уверен, что сделано нарочно. Монолог старика на полторы страницы — это чистая выгрузка сеттинга, худший из известных способов рассказать мир. Но он вставлен в текст так, что герою нужно, чтобы старик говорил подольше: «Без разницы просто слушай. Потяни время». Экспозиция становится тактикой, и читаешь её не как справку, а как отсчёт. Плюс её всё время перебивает второй голос — «он что мне решил всю свою биографию рассказать. Харе ныть ты нас в это втянул», — и голоса не разделены ни кавычками, ни атрибуцией, различаешь их только по интонации. К середине привыкаешь и перестаёшь спотыкаться, а потом текст этим пользуется: пропажу второго голоса замечаешь раньше, чем герой.</p>\n<p>И финал у альтер-эго правильный. Не откровение про кусочек чужого мозга — оно как раз объяснено врачом и потому неинтересно, — а прощание, где брат отменяет всё, чем герой был: «хватит быть правидником». Он не спасает и не даёт совета на будущее, он говорит, что бабушка велела заботиться о себе, и что теперь некому будет отговорить. Это на порядок точнее, чем снимок мозга. Написано при этом так, что читать физически трудно: грамматика рассыпается на каждой фразе, и первую страницу приходится продираться.</p></div>", "r": []}];</script>
