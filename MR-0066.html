<script>const BASE="";const DOCNAME="Чёрный, белый и серый миры";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0066-S01", "MR-0066--ustroystvo"], "h": "<p>Изложено Славой одним развёрнутым сообщением (2024-11-09, окно w0063, id 255014) как исходная задумка: «Изначально я хотел чтобы монстры появлялись из других миров / Которых миллиарды и который делаются на черной белый и серый / И вот монстры из черного мира к нам полжуть / И люде из нашего мира могут черпать силу из другого мира ( черный маг белый маг серый маг)».</p>\n<p>Из этого складывается устройство:</p>\n<ul>\n<li>Миров миллиарды.</li>\n<li>Все они делятся на три разряда: чёрный, белый и серый.</li>\n<li>Монстры приходят из чёрного мира — «к нам полжуть», то есть проникают в наш мир.</li>\n<li>Люди нашего мира могут черпать силу из другого мира. Отсюда деление самих людей: «черный маг белый маг серый маг».</li>\n</ul>\n<p>Следствие из миллиардного количества миров дано отдельным сообщением (id 255021): «И способности у них всех уникальный так как они черпать силы из разных миллиардом миров». То есть уникальность способностей выводится не из носителя, а из того, что источников — миллиарды разных миров.</p>\n<p>Разговор идёт в рамке «всё упирается в систему сил» (id 255005).</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0066-S02", "MR-0066--naselenie"], "h": "<ul>\n<li>Монстры — в чёрном мире, откуда лезут в наш.</li>\n<li>Маги нашего мира, разделённые по миру-источнику: чёрный маг, белый маг, серый маг.</li>\n<li>Главный герой в этой схеме — «защитник»: «И во все у меня в этих мирах гг вообще защитник» (id 255026).</li>\n</ul>\n<p>Население белого и серого миров отдельно не описано.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0066-S03", "MR-0066--mesto-vo-vselennoy"], "h": "<p>Наш мир противопоставлен другим мирам: монстры приходят оттуда, силу люди тоже черпают оттуда. Прямого контакта между чёрным, белым и серым мирами в переписке не описано — все связи идут через наш мир.</p>\n<p>Как связанные названы: Озеро перерождения, Хоррор с организацией, Чёрный маг / белый маг / серый маг. Первые две в приведённом куске переписки не упоминаются.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0066-S04", "MR-0066--kak-menyalsya-po-versiyam"], "h": "<p>Версия 1 — 2024-11-09 (окно w0063, id 255005–255027). Единственная версия и одновременно единственное изложение.</p>\n<p>Схема выложена уже в прошедшем времени — как то, чего хотелось «изначально». Тут же автор её и оценивает по жанру (id 255022): «Сама задумка вроде не плохая но это снова из хоррора превращается в боевик». Возражение против такого поворота — не в качестве схемы, а в её жанровом следствии.</p>\n<p>Ответ Миколая (id 255023–255024): «ну по идее можно и из такого сделать хоррор», но «просто это всё утратит основную идею». Слава закрывает ветку (id 255025): «Да только мало обещающий». Разговор уходит дальше — Миколай переводит его на другое: «ну вообще я знаю формулу страха» (id 255027).</p>\n<p>Таким образом схема миллиардов миров зафиксирована как отклонённый или по крайней мере отложенный вариант устройства: возражение — сползание из хоррора в боевик и утрата основной идеи. Прямого отказа словом в переписке нет, разговор просто переключается.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0066-S05", "MR-0066--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Чем чёрный, белый и серый миры различаются по существу, кроме имени и того, что из чёрного лезут монстры, не сказано.</li>\n<li>Что даёт сила белого и серого миров и чем белый маг отличается от серого — не разобрано.</li>\n<li>Как именно люди черпают силу из другого мира — механизм не назван.</li>\n<li>Как монстры попадают в наш мир («полжуть») — способ перехода не описан.</li>\n<li>Что такое «основная идея», которую схема утрачивает, в этом месте не расшифровано.</li>\n<li>Вселенная в переписке не названа; неясно, тот ли это мир, где происходит проза про ГГ (отмечено в неясностях окна w0063).</li>\n<li>Судьба схемы осталась нерешённой: она не принята и не отвергнута словом, разговор переключается на «формулу страха».</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0066--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0045.html\">Чёрные, белые и серые маги</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0066--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-11-09</td>\n<td>255005–255027</td>\n<td>w0063</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0066-chernyy-belyy-i-seryy-miry.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0066--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0066.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
