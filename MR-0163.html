<script>const BASE="";const DOCNAME="Пожиратели богов";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0163-S01", "MR-0163--ustroystvo"], "h": "<p>В этом куске переписки (2025-10-02) новых деталей самого механизма пожирания богов не добавлено — это возврат к теме. Слава пишет: «И по пожиратели богов я не забыл». После паузы в 2,1 часа Миколай отвечает: «идеи крутые и ура есть мир», «думал об этом сегодня... и вчера... частенько думаю», «хочу прям норм выделить время как-нибудь». Тут же признаёт свою роль в разработке: «ты чаще конкретно работаешь над историей», «я пока чет вообще не помогаю», «да ладно, почти никогда не помогал».</p>\n<p>Слава уточняет распределение труда: «так я больше думаю о деталях нежели о самом мире», и отдельно отмечает: «тема про пожирания богов мне зашла». Миколай вспоминает: «а, я вспомнил», «я забыл, что это моя идея».</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0163-S02", "MR-0163--naselenie"], "h": "<p>В том же сообщении, где Слава упоминает, что не забыл про пожирателей богов, он перечисляет, кто уже есть «пока что не в сформировавшиеся мире» — то есть население мира в целом, без прямой привязки к теме поедания богов:</p>\n<ul>\n<li>апостолы со сверхспособностями (насекомые);</li>\n<li>Каменный Поротой;</li>\n<li>Азуриэль;</li>\n<li>вампиры, способные контролировать кровь (с оговоркой «допустим»);</li>\n<li>дети мирового древа.</li>\n</ul>\n<p>Дети мирового древа описаны подробно: гуманоидные деревянные существа с оранжевой сердцевиной, способны менять облик на человеческий — «так как они из дерева мирового древа». Их «хрен ты их пробьешь»: ни один из апостолов не сможет нормально их ранить, а если ранят — они регенерируют. Сверхсильны, «сильнейший наверное в физическом плане». Могут передвигаться в земле и внутри деревьев. Огонь их «не пере[берёт]», «сам огонь на них тухнет». Могут выпускать корни и драться ими.</p>\n<p>Связь этого списка персонажей именно с механикой поедания богов в переписке не проговорена — список описывает общий состав ещё не сформировавшегося мира, а не конкретно тему пожирателей богов.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0163-S03", "MR-0163--mesto-vo-vselennoy"], "h": "<p>Материал относится к той же вселенной, что и <a href=\"MR-0160.html\">Бог, которого едят</a> и <a href=\"MR-0159.html\">Воскрешение погибших цивилизаций</a> — объявленной 2025-09-25 (id 368605); имени в переписке ей не дали. Слава хочет сделать пожирание богов «первоисточником возникновения всей этой мистической штуки» мира. Названа связь с сущностями «Апостолы» и «Мировое древо» (через персонажей из списка выше), но детали самой связи не раскрыты.</p>", "r": [["Бог, которого едят", "MR-0160.html"], ["Воскрешение погибших цивилизаций", "MR-0159.html"]]}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0163-S04", "MR-0163--kak-menyalsya-po-versiyam"], "h": "<h3>Версия 1 — 2025-10-02, id 370605–370630 — повтор прежней мысли</h3>\n<p>Сама разработка идеи велась раньше, в предыдущем окне (см. <a href=\"MR-0160.html\">Бог, которого едят</a>, 2025-09-26). В этом окне зафиксирован только возврат к теме: Слава подтверждает, что не забыл идею, и хочет сделать её первоисточником мистики мира; Миколай признаёт, что идея изначально была его.</p>", "r": [["Бог, которого едят", "MR-0160.html"]]}, {"t": "Пробелы", "a": ["S05", "MR-0163-S05", "MR-0163--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Как именно пожирание богов связано с апостолами и мировым древом — в окне не сказано.</li>\n<li>Связь перечисленных персонажей (апостолы, Каменный Поротой, Азуриэль, вампиры, дети мирового древа) конкретно с темой пожирателей богов не проговорена.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0163--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0159.html\">Воскрешение погибших цивилизаций</a>, <a href=\"MR-0160.html\">Бог, которого едят</a></li>\n<li><strong>Упомянут в мирах:</strong> <a href=\"MR-0160.html\">Бог, которого едят</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0163--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-10-02</td>\n<td>370605–370630</td>\n<td>w0106</td>\n<td>неясно (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0163-pozhirateli-bogov.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0163--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0163.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
