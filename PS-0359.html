<script>const BASE="";const DOCNAME="Герой";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0359-S01", "PS-0359--proishozhdenie"], "h": "<p>Персонаж — часть первого наброска категории «благословенные», который Слава выложил Миколаю единым сообщением 2026-04-19 (id 462204–462206): «И пока что основой послужат благословенный, одарённый, и т. д. Щя скину тебе кто они». Благословенные определены как «люди, что способны чувствовать присутствия когото. Кого именно неизвестно, может бог, может ещё какое-то существо». Герой назван в этом списке первым. Вселенная объявлена 2026-04-19 (id 462203), имени в переписке ей не дали.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0359-S02", "PS-0359--vneshnost"], "h": "<p>В переписке не описана.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0359-S03", "PS-0359--harakter"], "h": "<p>Впрямую не описан. Из более поздней реплики Славы (версия от 2026-06-02, id 487154–487155) следует требование к образу персонажа: «Я хочу чтобы герой твёрдо стоял на ногах. Ведь он герой. Символ справедливости и надежды».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0359-S04", "PS-0359--sposobnosti"], "h": "<p>Слышит шёпот-мольбу о помощи: «герой молю спаси...», «Герой помоги», «Герой, герой герой» — «когда людям нужна помощь и так они внутренне обращаются к нему». Помощь подразумевается «материальная, физическая и духовная». Шёпот «в некотором роде предсказывает будущее» — если человека должна сбить машина, Герой заранее услышит мольбу о помощи.</p>\n<p>Минус способности: если он не спасёт тех, кто молил о помощи, «то ему будут сниться кошмары, настоль страшный, что просто думать о ней будет пугать Героя».</p>\n<p>Плюс: каждый раз, когда он при смерти («ну там ему голову пристрелили или машина сбила или он упал с десяти этажки»), он вырубается и слышит голос «герой пора вставать», после чего просыпается в больнице живой, «а врачи диву даются».</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0359-S05", "PS-0359--svyazi-s-drugimi"], "h": "<p>Часть той же группы благословенных, что <a href=\"PS-0360.html\">Александор</a> (Александор) и <a href=\"PS-0362.html\">Четвёртый благословенный (запах дома)</a> (четвёртый благословенный, запах дома) — все перечислены Славой в одном сообщении 2026-04-19. В том же сообщении упомянуты ещё не входящие в это задание благословенные: Юра (предсказывает опасность по двум белым точкам), пятый Азуриэль (чувствует эмоции людей) и седьмой Максим (сверхчеловеческое восприятие скорости).</p>\n<p>Позже (2026-06-02) Герой назван «один из столпов героев» и «лицом всей ассоциации героев» — упомянуты Ассоциация и Шесть столпов героев, а также Граф, Изб, Нуар, но их связь с Героем в прочитанном материале не раскрыта — состав и характер этих связей не назван.</p>", "r": [["Александор", "PS-0360.html"], ["Четвёртый благословенный (запах дома)", "PS-0362.html"]]}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0359-S06", "PS-0359--kak-menyalsya"], "h": "<h3>2026-04-19 (id 462204–462206)</h3>\n<p>Первое описание: шёпот-мольба, отчасти предсказывающий будущее, кошмары за неспасённых, воскрешение при смерти по голосу «герой пора вставать».</p>\n<h3>2026-06-02, первая часть (id 487082–487095)</h3>\n<p>Персонаж перенесён в новую вселенную (без энергии, без имени в чате) и переопределён: «Один из столпов героев. Герой, что каждый Божий день слышат голос что молят его спасти их... Он как бы является лицом всей ассоциации героев». Слава прямо признаёт, что не знает, какую способность дать герою: «И кстати мне нужна помощь... Я и сам не знаю... Ему нужна способность... Какую». Миколай спрашивает про идеи — оба фиксируют их отсутствие: Слава — «Нету... Вообще никакой», Миколай — «не... нету... я пытался».</p>\n<h3>2026-06-02, вторая часть (id 487096–487107)</h3>\n<p>Слава дословно повторяет старое описание Героя (шёпот, кошмары, воскрешение) и сообщает, что скинул этот отрывок в нейросеть с просьбой придумать способность, и просит Миколая сделать то же самое. Миколай уточняет, ответила ли нейросеть или Слава придумал сам — Слава отвечает: «Не это я сам. Я не глянул.. Я здесь договор заполняю. Позже напишу». Миколай обещает тоже отправить материал в нейросеть: «обязательно».</p>\n<h3>2026-06-02, третья часть (id 487148–487169) — отклонённый вариант</h3>\n<p>Слава отвергает вариант, в котором сила героя строится на вере: «Я не хочу веру... Я не люблю веру. Я хочу чтобы герой твёрдо стоял на ногах. Ведь он герой. Символ справедливости и надежды». Миколай уточняет: «а у какой нейронки вера? у всех?» — Слава подтверждает: «Да». Миколай предлагает попробовать другую нейросеть (ссылки на telegra.ph: «drugaya-06-02-4» и «ubrat-veru-06-02») и предлагает попросить её «нахуй послать веру и идти в другую сторону». Один из вариантов ответа нейросети — сделать героя неуязвимым: «Он у меня блять просто предложил сделать его неуязвимым». Славе вариант в целом нравится («Нравится»), но кажется слишком сильным: «Но как то имбаласная... Можешь ему сказать уменьшит имбу».</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0359-S07", "PS-0359--chto-s-nim-stalo"], "h": "<p>Итоговая способность персонажа для новой (безымянной) вселенной в прочитанном материале не определена. Обсуждение оборвано на просьбе Славы уменьшить силу предложенного нейросетью варианта неуязвимости — ответа Миколая или дальнейшего решения в переписке нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0359-S08", "PS-0359--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Внешность и характер персонажа отдельно не описаны.</li>\n<li>Связь Героя с сущностями Ассоциация, Граф, Изб, Нуар, Шесть столпов героев в переписке не раскрыта — только названы.</li>\n<li>Финальная способность героя для этой вселенной не названа, «состав не назван».</li>\n<li>Исход работы с нейросетями (какой вариант в итоге приняли) осталось нерешённым.</li>\n<li>В источнике отмечено, что имя персонажа не дано внутри этого окна и появляется в другом окне под именем «Праведник» — эта связь выходит за рамки материала данной вселенной и здесь не раскрывается подробнее.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0359--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0360.html\">Александор</a>, <a href=\"PS-0362.html\">Четвёртый благословенный (запах дома)</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0360.html\">Александор</a>, <a href=\"PS-0362.html\">Четвёртый благословенный (запах дома)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0359--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-04-19</td>\n<td>462204–462206</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-02</td>\n<td>487082–487095</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-02</td>\n<td>487096–487107</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2026-06-02</td>\n<td>487148–487169</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0359-geroy.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0359--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0359.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
