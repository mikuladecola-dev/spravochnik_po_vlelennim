<script>const BASE="";const DOCNAME="Межостровная корпорация по вывозу мусора";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0036-S01", "GR-0036--chto-eto"], "h": "<p>Межостровная корпорация по вывозу мусора — организация вселенной «7 островов», названная одной репликой в ответ на вопрос о логистике мусора. Разведка числит её группой; по материалу переписки это не группа с участниками, а названная и не развёрнутая организация: у неё нет ни состава, ни устройства, ни руководства, ни хотя бы одного упомянутого сотрудника. Всё, что о ней сказано, — два сообщения Миколая (2024-07-04, id 197088 и 197092): «ну там будет корпорация» и, отдельной репликой, «межостровная».</p>\n<p>Корпорация возникает как ответ на конкретный вопрос, а не как самостоятельная задумка. К этому моменту соавторы уже решили, что грязь и пыль на островах собираются в одном месте и вывозятся, и что избавляется от собранного отдельный мета-человек (<a href=\"SP-0084.html\">Мета-человек, утилизирующий мусор</a>, 2024-07-04, id 197044–197053). Слава спрашивает: «Кто будет возить» и «И что взамен» (id 197074–197075). Миколай переспрашивает, кому взамен, и формулирует вопрос по-своему: «у кого выгода от того что они возят всякую дичь» — «к ней» — «мусор в том числе» (id 197076–197080). Слава при этом отводит разговор в сторону: «Нужно придумать куда мусор на своем же острове» (id 197085). Ответом на вопрос «кто возит» и становится корпорация.</p>\n<p>То есть по назначению это перевозчик: сторона, которая возит мусор (и, по формулировке Миколая, «всякую дичь» вообще) к Дриаде, где им занимается закреплённый за ней мета-человек. Слово «межостровная» — единственная характеристика корпорации: она работает не в пределах одного острова. Вопрос о выгоде перевозчиков, ради которого корпорация и была названа, ответа в переписке не получил: назвав её, Миколай тут же уходит с темы («тц» — «лан», id 197093–197094), а Слава переключается на солнце.</p>", "r": [["Мета-человек, утилизирующий мусор", "SP-0084.html"]]}, {"t": "Как менялась — по датам", "a": ["S02", "GR-0036-S02", "GR-0036--kak-menyalas"], "h": "<p>Вся история корпорации умещается в один вечер 2024-07-04 и одну версию. Ниже — состояния соседних тем, между которыми она была названа и после которых заглохла.</p>\n<p><strong>2024-07-04, id 197044–197080 — предыстория, мусорный мета-человек.</strong> Слава предлагает: «Давай вся это грязь и пыль будет собираться в одном месте и они будут её вывозить?» Миколай соглашается и отвечает на вопрос, куда возить: «мета людей же дохуя», «может есть те, кто может как-то перерабатывать эту залупу», «или на крайняк сжигать бесследно» (id 197051–197053). Дальше вариант «на каждом острове особенный»: «на одном он отправляет эту залупу в какое-то пустое измерение», «на другом сжигает до тла», «в другом перерабатывает во что-то полезное», «в другом, уменьшает количество» (id 197058–197064). Слава закрепляет этого человека за Дриадой: «У дриады» — «Будет человек» — «И он будет только у нее»; Миколай отвечает «ну вообще я хотел для современных, ну пускай» и добавляет «только один» (id 197062–197072). Обоснование Славы: «Типо дриада растения за чистоту» (id 197073). Отсюда и вопрос о перевозчике.</p>\n<p><strong>2024-07-04, 21:57–21:58, id 197088–197092 — корпорация названа.</strong> «ну там будет корпорация», через несколько реплик — «межостровная». Между этими двумя сообщениями Слава говорит «Вотвот» и дважды «Тихо» (id 197089–197091) — то есть просит паузу, потому что параллельно додумывает своё. Дальше корпорация не упоминается ни разу.</p>\n<p><strong>2024-07-04, 21:58–22:05, id 197095–197116 — вместо корпорации разбирают солнце.</strong> Слава: «Для поддержания солнце в ней будет сжигаться мусор» (id 197095), затем «Солнце это звезда которая что-то поглощает», «Даже если держать её на способности вечно не выйдет» (id 197098–197099). Проверив (по его словам, в мультфильме), он уточняет: «Она сжигает водород» (id 197108) — и тут же снимает возражение: «Похую пусть мусор просто сжигаться в солнце» (id 197110). Миколай закрепляет это как условие способности: «это так способность работает» — «такое условие» (id 197113–197114) и подводит итог: «чет мы на мусоре люто застряли» (id 197116).</p>\n<p><strong>2024-07-04, 22:05–22:09, id 197117–197136 — конфликт вокруг вывоза и закрытие темы.</strong> Миколай излагает задумку, о которой говорил раньше: «есть те страны, которые захотят оборвать вывоз мусора из хороших стран, союзников к стране нуара», «такой конфликт я придумал», мотив — «ну типо ресурсов будет меньше» (id 197124–197127). Сам же её сворачивает: «ну пыть хз», «чет я уже надумываю люто да» (id 197128–197129). Слава закрывает тему решением: «У каждого остров будет свой способ избавиться от мусора» (id 197130), Миколай соглашается: «оке» — «тогда всё норм» (id 197131–197132). Окно кончается репликами про водород («это вода», «без кислорода») и «ладно, забыли» (id 197133–197136).</p>\n<p>Отклонённое и брошенное: конфликт из-за перекрытия вывоза мусора (Конфликт из-за вывоза мусора <em>(статьи ещё нет — <a href=\"kb/ID-0085-konflikt-iz-za-vyvoza-musora.html\">исходник</a>)</em>) предложен и снят самим автором в тех же нескольких минутах, разработки у него нет. Решение «у каждого острова свой способ» (<a href=\"MR-0030.html\">Утилизация мусора на островах</a>) фактически снимает и нужду в межостровной перевозке — но в переписке это последствие не проговорено, и корпорацию после него не отменяли и не переопределяли: тему просто закрыли.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · С чего начать — не материал авторов</b>\n<p>В базе, ничего искать не надо — всё разъехалось по четырём соседним записям одного вечера. <code>ID-0081</code> (окно w0043, id 197074–197094) — сама корпорация и вопрос о выгоде; <code>ID-0085</code> (окно w0044, id 197117–197136) — конфликт и его снятие; <code>MR-0030</code> — решение «у каждого острова свой способ»; <code>SP-0084</code> — мета-человек и четыре варианта утилизации по островам. Разрыв проходит ровно по границе окон w0043/w0044: вопрос задан в одном, ответ на него в другом, и в собранном виде они нигде не стоят рядом.</p></div>", "r": [["Конфликт из-за вывоза мусора", "kb/ID-0085-konflikt-iz-za-vyvoza-musora.html"], ["Утилизация мусора на островах", "MR-0030.html"]]}, {"t": "Пробелы", "a": ["S03", "GR-0036-S03", "GR-0036--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет. Ни один сотрудник, владелец или руководитель корпорации не назван; в плане статьи список участников пуст.</li>\n<li>Устройства нет: как корпорация организована, кому принадлежит, на скольких островах работает — в переписке не сказано.</li>\n<li>Общих способностей участников не названо. Мусорный мета-человек (<a href=\"SP-0084.html\">Мета-человек, утилизирующий мусор</a>) закреплён за Дриадой и назван отдельно от корпорации; в переписке он к ней не приписан.</li>\n<li>Иерархия не обсуждалась.</li>\n<li>Отношения с другими группами не названы. Страны, которые «захотят оборвать вывоз мусора», и союзники Нуара упомянуты в соседней задумке (Конфликт из-за вывоза мусора <em>(статьи ещё нет — <a href=\"kb/ID-0085-konflikt-iz-za-vyvoza-musora.html\">исходник</a>)</em>), но противниками или контрагентами именно корпорации в переписке не объявлены.</li>\n<li>Вопрос, ради которого корпорация была названа, — «И что взамен», «у кого выгода от того что они возят всякую дичь» — остался нерешённым.</li>\n<li>Соотношение корпорации с решением «у каждого остров будет свой способ избавиться от мусора» не проговорено: осталось нерешённым, возит ли она что-то после этого решения.</li>\n<li>Названия, штаб-квартиры, острова приписки у корпорации нет.</li>\n</ul></div>", "r": [["Конфликт из-за вывоза мусора", "kb/ID-0085-konflikt-iz-za-vyvoza-musora.html"], ["Мета-человек, утилизирующий мусор", "SP-0084.html"]]}, {"t": "Связи — всё вместе", "a": ["GR-0036--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0084.html\">Мета-человек, утилизирующий мусор</a></li>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0030.html\">Утилизация мусора на островах</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0036--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0036.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0036-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0036/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Чинить первым <code>ID-0085</code> «Конфликт из-за вывоза мусора»: 2 ссылки, статьи нет, база 3 090. Это единственное место во всём материале, где у корпорации появляется вторая сторона — страны, которые захотят оборвать вывоз к союзникам Нуара. Без него перевозчик остаётся стороной без контрагента, и вопрос «у кого выгода», ради которого корпорация вообще была названа, некуда даже поставить. Пока <code>ID-0085</code> не развёрнут, ни одна статья не может сказать про корпорацию ничего, кроме того, что она есть.</p>\n<p>Второе — <code>PS-0115</code> Дриада: 2 ссылки, статья есть, база 2 278. Это единственный названный адрес, куда всё возится, и в связях этой статьи её нет вовсе — Дриада упомянута в тексте и не проведена в связи. Плюс Дриад в базе две: <code>PS-0115</code> (2 278) и <code>PS-0108</code> «Дриада великан» (1 ссылка, 5 569), и какая из них та самая, из связки не следует.</p>\n<p>Третье, чисто учётное: у корпорации два кода. Базовая запись <code>ID-0081</code> (2 ссылки, 3 056) и статья <code>GR-0036</code> — при этом входящие ссылки идут на <code>ID-0081</code>, а у статьи их ноль. Весь мусорный узел мелкий и замкнутый: <code>MR-0030</code> — 5 483, <code>SP-0084</code> — 5 916, <code>ID-0081</code> — 3 056, <code>ID-0085</code> — 3 090, при том что вокруг стоит <code>MR-0018</code> «7 островов» с семью ссылками и 17 843 знаками.</p>\n<h3>С чего начать</h3>\n<p>В базе, ничего искать не надо — всё разъехалось по четырём соседним записям одного вечера. <code>ID-0081</code> (окно w0043, id 197074–197094) — сама корпорация и вопрос о выгоде; <code>ID-0085</code> (окно w0044, id 197117–197136) — конфликт и его снятие; <code>MR-0030</code> — решение «у каждого острова свой способ»; <code>SP-0084</code> — мета-человек и четыре варианта утилизации по островам. Разрыв проходит ровно по границе окон w0043/w0044: вопрос задан в одном, ответ на него в другом, и в собранном виде они нигде не стоят рядом.</p>\n<p>В архив идти стоит за одним — за тем, что было до 21:55. Миколай в 22:05 ссылается на разговор, которого в окне нет: «Про че ты говорил», «Про войну что ли ?», «Недавно до того как я вышел». Значит, задумка про войну вокруг вывоза излагалась раньше и в w0043 не попала. Ориентир — 2024-07-04 до 21:55 и предыдущее окно того же дня.</p>\n<h3>Как развивалось</h3>\n<p>Четырнадцать минут, от начала до «забыли». 21:55 — заявили вопросом: «Кто будет возить», «И что взамен». 21:57 — назвали: «ну там будет корпорация». 21:58 — уточнили одним словом: «межостровная», и тут же «тц», «лан». 21:58–22:05 — ушли в солнце. 22:07 — вернулись, но не к корпорации, а к конфликту вокруг вывоза, и автор свернул его за минуту сам: «чет я уже надумываю люто да». 22:08 — Слава закрыл тему решением «У каждого остров будет свой способ избавиться от мусора», Миколай согласился: «тогда всё норм». 22:09 — «ладно, забыли». Возврата не было: после этого вечера корпорация не упоминается ни разу, ни отменена, ни переопределена.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Про утилизатора правило единственности названо жёстко и дважды: «И он будет только у нее», «только один». Один мета-человек на весь мир, закреплённый за одним островом. Про перевозчика такого правила нет. Слово «межостровная» — единственная его характеристика, и из неё не следует, одна ли эта корпорация на семь островов или на каждом своя, монополия это или рынок. Для точки, где мусор исчезает, единственность оговорена; для линии, по которой он туда попадает, — нет.</p>\n<h3>Отклик</h3>\n<p>Мне нравится, откуда эта корпорация взялась. Не из замысла, а из вопроса «и что взамен» — то есть кто-то в разговоре всерьёз спросил, зачем чужие люди станут возить чужой мусор, и не удовлетворился тем, что возят. Вопрос взрослый, ответ на него так и не прозвучал, но сам факт, что мир проверяли на экономику, а не на пафос, дороже иного ответа. И весь этот вечер устроен смешно: соавторы полчаса всерьёз разбираются, чем питается солнце, чтобы выяснить, можно ли сжечь в нём мусор, приходят к водороду, и тут же машут рукой — «Похую пусть мусор просто сжигаться в солнце». Ещё зацепило, что тему закрыли решением, которое тихо отменяет саму корпорацию: если у каждого острова свой способ, возить между островами нечего. Никто этого не заметил, и корпорация осталась стоять — организация, которой в собственном мире уже нечего делать.</p></div>", "r": []}];</script>
