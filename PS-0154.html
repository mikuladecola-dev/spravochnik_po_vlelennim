<script>const BASE="";const DOCNAME="векторный шар";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0154-S01", "PS-0154--proishozhdenie"], "h": "<p>Векторный шар появился 2024-08-29 (id 226088–226102, окно w0055) внутри большого монолога Миколая от лица спасателя — куска прозы, который Миколай сам обозначил как «один из повседневности спасателя» (226094) и пояснил: «хотел характер раскрыть» (226095). Монстр там упомянут походя, как деталь быта: «эта векторная тварь очень сподручна для перемещения конечно, её буду истреблять последней. хотя нет всех и сразу» и, ниже, «ай, раздавил опять векторный шар, благо над холмом пролетал» (226088).</p>\n<p>Отдельного описания в тот момент не было. Оно появилось по прямому запросу Славы, который переспросил: «Векторный шар» — «?» — «Пролетал над холмом ?» (226097–226099). Ответом на этот вопрос и стала механика монстра (226100–226101).</p>\n<p>Второе название, использованное в том же монологе, — «векторная тварь».</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0154-S02", "PS-0154--vneshnost"], "h": "<p>Собственно описания внешности в переписке нет. Из названия следует, что это шар. В 226102 Миколай добавляет к описанию реплику «мелкий хуй» — к чему именно она относится (к размеру монстра или к чему-то ещё), в переписке не пояснено.</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0154-S03", "PS-0154--sposobnosti"], "h": "<p>Механика описана Миколаем дословно так:</p>\n<div class=\"q\"><p>«это монстр которого ты бросаешь, но не отпуская и в ту сторону к которую идёт инерция он бесконечно тебя уносит» (226100)</p></div>\n<div class=\"q\"><p>«обычно всегда в небо, а после если ты достаточно высоко он отпускает и бьёт током чтобы ты разбился» (226101)</p></div>\n<p>То есть: монстра бросают, не выпуская из рук; по вектору инерции броска он бесконечно уносит бросившего. Направление обычно в небо. Набрав достаточную высоту, шар сам отпускает носителя и бьёт его током, чтобы тот разбился.</p>\n<p>Из монолога спасателя следует, что монстра используют как транспорт: «эта векторная тварь очень сподручна для перемещения» (226088). Убийственная часть механики при таком использовании, видимо, не срабатывает — но как именно спасатель её обходит, в переписке не сказано.</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0154-S04", "PS-0154--svyazi-s-drugimi"], "h": "<ul>\n<li>Спасатель — постоянный пользователь векторного шара как средства перемещения. Он же собирается его уничтожать, но в последнюю очередь: «её буду истреблять последней. хотя нет всех и сразу» (226088). В том же монологе он мимоходом раздавливает одного: «ай, раздавил опять векторный шар, благо над холмом пролетал» — слово «опять» указывает, что это происходит регулярно. Следующая фраза — «че интересно он ждет от меня, потом спрошу» (226088) — к кому относится местоимение «он», в переписке не уточнено.</li>\n<li>Монстры как домен живых существ — векторный шар входит в общий ряд монстров, которых спасатель намерен истребить («их не останется ни одного», 226088).</li>\n</ul>", "r": []}, {"t": "Как менялся", "a": ["S05", "PS-0154-S05", "PS-0154--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2024-08-29 (id 226088–226102, окно w0055).</strong> Единственное состояние: упоминание в монологе спасателя, затем описание механики по запросу Славы. Изменений и последующих версий нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0154-S06", "PS-0154--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Внешность, размер, количество особей не описаны.</li>\n<li>Не сказано, как спасатель пользуется шаром для перемещения, не разбиваясь.</li>\n<li>Не объяснено, почему шар подлежит истреблению «последним» — из-за полезности или по другой причине.</li>\n<li>Не сказано, разумен ли он, есть ли у него поведение помимо описанной механики.</li>\n<li>Реплика «че интересно он ждет от меня, потом спрошу» (226088) осталась без продолжения — вопрос так и не был задан в переписке.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0154--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0154--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-29</td>\n<td>226088–226102</td>\n<td>w0055</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0154-vektornyy-shar.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0154--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0154.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
