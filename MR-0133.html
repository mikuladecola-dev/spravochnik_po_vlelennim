<script>const BASE="";const DOCNAME="Отделы Нимба";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0133-S01", "MR-0133--ustroystvo"], "h": "<p>Внутренняя структура организации «Нимб». Перечислена списком одним сообщением (2025-04-08, id 317257).</p>\n<p>Три основных отдела:</p>\n<ul>\n<li>Силовики — «ну здесь всё ясно», пояснения автор не даёт.</li>\n<li>Бухгалтерия.</li>\n<li>Исследования.</li>\n</ul>\n<p>Помимо трёх основных есть ещё один: «Ещё есть отдал Этики, который часто ругается с отделом силовиков и исследования». То есть отдел этики вынесен за рамки трёх основных и задан через конфликт — он конфликтует с двумя отделами из трёх, с силовиками и с исследованиями. С бухгалтерией конфликт не назван.</p>\n<p>Ориентир, который автор даёт сразу следом: «Грубо говоря это организация сцп только измененая под мои рамки» (id 317258). В чём именно состоит изменение «под мои рамки», не расшифровано.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S02", "MR-0133-S02", "MR-0133--mesto-vo-vselennoy"], "h": "<p>Вселенная — «Нимб» (объявлено). Отделы являются частью организации «Нимб».</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S03", "MR-0133-S03", "MR-0133--kak-menyalsya-po-versiyam"], "h": "<p>Версия 1 — 2025-04-08, окно w0087, сообщения 317257–317258. Единственная версия; после неё структура в переписке не пересматривалась.</p>", "r": []}, {"t": "Пробелы", "a": ["S04", "MR-0133-S04", "MR-0133--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Функции отделов не описаны, кроме отсылки «ну здесь всё ясно» для силовиков. Чем занимается отдел исследований и что именно ведёт бухгалтерия, не сказано.</li>\n<li>Полномочия отдела этики не названы — сказано только, что он «часто ругается» с силовиками и исследованиями; чем заканчиваются эти конфликты и кто в них главнее, не сказано.</li>\n<li>Отношения отдела этики с бухгалтерией не упомянуты.</li>\n<li>Ни одного сотрудника, руководителя или численности отделов не названо.</li>\n<li>Существуют ли отделы помимо перечисленных четырёх, не сказано.</li>\n<li>В чём «Нимб» отличается от организации SCP («изменена под мои рамки»), не расшифровано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0133--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0009.html\">Организация Нимб (НБО)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0006.html\">Нимб</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0133--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-04-08</td>\n<td>317257–317258</td>\n<td>w0087</td>\n<td>Нимб (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0133-otdely-nimba.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0133--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0133.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
