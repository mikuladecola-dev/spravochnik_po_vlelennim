<script>const BASE="";const DOCNAME="Преступная организация";
const LEAD="<p>Сквозная антагонистическая сила вселенной «7 островов». Варианты написания в переписке: «прес огр», «прест огр». Разрабатывалась в двух окнах: вброшена 2024-07-03 (id 194885–194890, окно w0041), проработана 2024-07-04 (id 195996–196123, окно w0042).</p>";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0026-S01", "MR-0026--ustroystvo"], "h": "<p>Организация не привязана ни к одному острову. На вопрос «а у кого преступная организация? на каком острове?» Слава отвечает «Не на коком» и «Преступная организация не зависит не от одного острова» (id 196047–196051).</p>\n<p>У организации есть верхушка: «Ну главная там есть верхушка типо сильнейших в той организаций» (id 196055). Состав верхушки смешанный — «Ну это верхушка прес огр будет состоять как из современных как из фэнтези» (id 196076).</p>\n<p>От защитников островов организация не зависит, но контакт с ними возможен: на реплику «она не зависит не от одного защитника» Слава отвечает «Да, но она может заключать союзы» (id 196056–196057).</p>\n<p>Вопрос о географии организации проходит две стадии. Сначала на вопрос «она везде?» — «Ну может быть везде» (id 196052–196054). Позже, когда Миколай возвращается к этому («почему преступленая организация везде», «как они и зачем расселись везде», id 196120–196121), Слава снимает формулировку: «Они не везде есть группа людей и все» (id 196123).</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0026-S02", "MR-0026--naselenie"], "h": "<p>Участники названы поимённо только частично. По навигации записи, Кай назван одним из участников; в самом фрагменте переписки стоит только реплика Славы «Один из участников» (id 196107).</p>\n<p>Организация связана с записями: 7 островов, 7 островов и их защитники, Группа сверхлюдей (ГГ), Кай, Слияние двух измерений.</p>", "r": []}, {"t": "Мотив", "a": ["S03", "MR-0026-S03", "MR-0026--motiv"], "h": "<p>Цель организации к концу окна w0042 не определена. Слава ставит задачу прямо: «Вот этой нужно придумать / Их ней цель» (id 196062) и повторяет позже: «И их нея цель» (id 196098).</p>\n<p>Перебранные варианты (id 196067–196123):</p>\n<ul>\n<li><strong>Узнать или повторить слияние двух измерений.</strong> Слава сам же возражает: «А нафиг им повторять слияния или обратная его делать / Когда обществом 2 миров вроде уже как то уживаются» (id 196069). Дополнительный аргумент: «Там уже грубо говоря страны построены и все живут так нафиг им» (id 196079).</li>\n<li><strong>Обратить слияние вспять.</strong> Миколай подводит к этому через мотивацию отдельных людей: «может у кого-то есть чисто научный интерес», «может у кого-то есть отвращение к челам из иного измерения», «эта ненависть просто подпитывает их интерес» — «к тому чтобы обратить процесс» (id 196072–196077).</li>\n<li><strong>Сверхсущество.</strong> Отвергнуто дважды: «Ну это тоже звучит говнисто» (id 196090) и «Сверх существо говно» (id 196106).</li>\n<li><strong>Захват власти.</strong> Предложен Миколаем, отклонён Славой одним словом: «Нет» (id 196113–196114).</li>\n<li><strong>Деньги.</strong> Поставлено как вопрос — «иди просто денег надо хз» (id 196102) — ответа не получило.</li>\n<li><strong>Изобретение чего-либо.</strong> Вопрос Миколая «или ты хочешь чтобы они чет изобрели?» (id 196103) остался без ответа: «Да не знаю я» (id 196105).</li>\n</ul>\n<p>Отдельно проговорено, что подача мотива идёт через главного героя: «Да-да гг будет об этом узнавать как и зрителей / Вот только прест огр зачем» (id 196074).</p>\n<p>В обсуждении Миколай приводит рассуждение о людях как аргумент за долгую память и неприятие перемен (id 196081–196089): «ну это же люди / они ёбнутые / из истории легко пронаблюдать / царя нет, а они его ищут / им не удобно», «некоторым наверняка лет по 200 / они уже привыкли к одному, ма такая смена вообще не кайф». Слава на это отвечает, что вариант «звучит говнисто».</p>", "r": []}, {"t": "Место во вселенной", "a": ["S04", "MR-0026-S04", "MR-0026--mesto-vo-vselennoy"], "h": "<p>Организация задумана как сила, работающая поверх островной географии, — единственная структура, которая ни к одному острову не приписана. Действует в мире после слияния двух измерений, в котором «уже грубо говоря страны построены и все живут» (id 196079).</p>\n<p>Хронология вокруг организации уточняется здесь же: «8 лет война шла» (id 196087), «После войны прошло 10лет» (id 196093), причём Слава сразу оставляет число открытым — «Ну или меньше потом решим» (id 196097).</p>\n<p>Роли персонажей вокруг организации, названные Славой (id 196122): «Сталкер наемник / Имитатор часто будет покидать остров по заданием / А остальные твой челики не знаю».</p>\n<p>По распределению сторон между соавторами Миколай предполагает (id 196001–196003): «скорее всего это будут твои / а мои чисто на периферии / для раскрытия и глубины».</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S05", "MR-0026-S05", "MR-0026--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-07-03 (id 194885–194890, окно w0041).</strong> Организация названа в ответ на вопрос о главном герое. Миколай: «так а кто гг вообще» — Слава: «Не знаю», «Ну там будет преступная организации» (id 194885–194887). Тут же названы группа сверхлюдей как вероятные главные герои («Наверное будут группа сверх людей») и военное положение: «Нет конечно я сделаю так чтобы хотя бы 3 острова воевали» (id 194890). Дальше в этом окне организация не раскрывается.</p>\n<p><strong>Версия 2 — 2024-07-04 (id 195996–196003, окно w0042).</strong> Миколай проговаривает исходный замысел Славы: «ты хочешь создать преступную организацию» и «ввести военное положение меж тремя островами» (id 195997, 196000).</p>\n<p><strong>Версия 3 — 2024-07-04 (id 196047–196062).</strong> Устанавливается устройство: не привязана к островам, «может быть везде», есть верхушка из сильнейших, независима от защитников, но может заключать союзы. Цель ещё не придумана. В этот же обмен репликами вклиниваются посторонние темы — карточка имитатора и уточнение, что остров сталкера это остров наёмников в пустыне.</p>\n<p><strong>Версия 4 — 2024-07-04 (id 196067–196107).</strong> Перебор мотивов после подсказки нейросети: узнать или повторить слияние, обратить его вспять, создать сверхсущество. Устанавливается смешанный состав верхушки — современные и фэнтезийные. Уточняются сроки после войны. Вопрос, связаны ли преступления организации с существованием двух миров или им просто нужны деньги, поставлен и оставлен без решения: «Да не знаю я».</p>\n<p><strong>Версия 5 — 2024-07-04 (id 196112–196123).</strong> Отвергнут мотив захвата власти. Формулировка про «везде» отменена: «Они не везде есть группа людей и все». Миколай фиксирует своё требование к сюжету: «я вот не хочу чтобы защитки чисто сидели» (id 196119).</p>", "r": []}, {"t": "Отклонённые варианты", "a": ["S06", "MR-0026-S06", "MR-0026--otklonennye-varianty"], "h": "<ul>\n<li>Сверхсущество как цель — отвергнуто дважды, «звучит говнисто» и «Сверх существо говно».</li>\n<li>Захват власти — «Нет».</li>\n<li>Повторение слияния измерений — отвергнуто самим Славой на том основании, что общества двух миров уже уживаются.</li>\n<li>Тезис «организация есть везде» — снят в пятой версии в пользу «группа людей и все».</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S07", "MR-0026-S07", "MR-0026--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Цель организации к концу окна w0042 не определена.</li>\n<li>Состав верхушки не назван — сказано только, что в неё войдут и современные, и фэнтезийные.</li>\n<li>В чём именно состоит преступление организации: вопрос Миколая «в чем её преступление?» (id 196059) в переписке ответа не получил — следующая реплика Славы «В пустыни» относится к другой ветке разговора, об острове сталкера.</li>\n<li>Связь преступлений с существованием двух миров (современного и фэнтезийного) осталась нерешённой.</li>\n<li>Численность, структура ниже верхушки, название организации в переписке не названы.</li>\n<li>Кто главный герой — на момент вброса организации не решено: «Не знаю».</li>\n<li>Роли персонажей Миколая относительно организации не определены: «А остальные твой челики не знаю».</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0026--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в мирах:</strong> <a href=\"MR-0027.html\">Слияние двух измерений</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0026.html\">Пресрог (преступная организация)</a>, <a href=\"GR-0037.html\">Группа сверхлюдей (ГГ)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0026--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-03</td>\n<td>194885–194890</td>\n<td>w0041</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-04</td>\n<td>195996–196003</td>\n<td>w0042</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-04</td>\n<td>196047–196062</td>\n<td>w0042</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-04</td>\n<td>196067–196107</td>\n<td>w0042</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-04</td>\n<td>196112–196123</td>\n<td>w0042</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0026-prestupnaya-organizaciya.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0026--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0026.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
