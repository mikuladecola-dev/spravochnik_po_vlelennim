<script>const BASE="";const DOCNAME="Дворянская семья Баллив";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0085-S01", "GR-0085--chto-eto"], "h": "<p>Дворянский род во вселенной «Иссекай». Название встречается в тексте истории «Сумасшедший где-то?» (2026-02-20, id 435083–435085) дословно, при первом появлении единственного названного участника: «Это был Дариус Баллив старший сын дворянской семьи Баллив». Второй раз семья упоминается в той же главе описательно, когда Ден просит принять наказание вместо подчинённых: этим он «очень удивил сына дворянской семьи».</p>\n<p>Отдельного обсуждения семьи Баллив в переписке нет. Она существует только внутри присланного Славой текста главы 1 и не разбирается авторами ни до, ни после. Всё, что о ней известно, — эти два упоминания: род дворянский, у него есть старший сын Дариус.</p>\n<p>По формальному признаку это группа (род, семья), но показана она через одного человека. Ни родители, ни другие дети, ни владения, ни герб, ни положение рода среди прочих дворянских семей в тексте не названы.</p>\n<p>Дариус в сцене действует не от имени семьи. Он представляется отряду сборщиков как «посланик Божией» — «ведь он правда был посланником Божьим, только не их Бога», — принимает у командира Дена пробирку с чёрно-красной жидкостью, собранной с сожжённой деревни («горечи, страха и отчаяния»), назначает наказание и затем убивает отряд. Ден по ходу сцены делает вывод, что Дариус «от руководства», но что это за руководство и связано ли оно с семьёй Баллив — в тексте не сказано.</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0085-S02", "GR-0085--sostav"], "h": "<ul>\n<li><a href=\"PS-0356.html\">Дариус Баллив</a> — Дариус Баллив, «старший сын дворянской семьи Баллив», статный юноша лет 20.</li>\n</ul>\n<p>Больше никто из членов семьи не назван. Формулировка «старший сын» подразумевает наличие других детей, но они в тексте не показаны и не упомянуты.</p>", "r": [["Дариус Баллив", "PS-0356.html"]]}, {"t": "Иерархия", "a": ["S03", "GR-0085-S03", "GR-0085--ierarhiya"], "h": "<p>Единственное указание на внутреннее устройство рода — слово «старший» в определении Дариуса: «старший сын дворянской семьи Баллив». Глава семьи не назван, отец и мать в тексте не появляются, положение Дариуса относительно других членов рода (кроме того, что он старший из сыновей) не описано.</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S04", "GR-0085-S04", "GR-0085--kak-menyalas"], "h": "<p><strong>2026-02-20 (id 435083–435085).</strong> Единственное появление. Слава присылает текст главы 1 и первые строки главы 2 истории «Сумасшедший где-то?» тремя сообщениями подряд. Семья Баллив названа в первом из них, при представлении Дариуса, и второй раз — в том же сообщении, оборотом «сына дворянской семьи». Текст обрывается на середине абзаца в начале главы 2 (карета, черноволосый мальчик и мужчина), продолжения в окне нет. Правок, уточнений и обсуждения после присылки не было; версия одна.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "GR-0085-S05", "GR-0085--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет. Кроме Дариуса не назван ни один член семьи.</li>\n<li>Другие дети рода не показаны, хотя «старший сын» их подразумевает. Сколько их и кто они — в переписке не сказано.</li>\n<li>Родители Дариуса, глава рода, старшие родственники — не названы.</li>\n<li>Владения, земли, замок, герб, девиз, титул рода — ничего этого в тексте нет.</li>\n<li>Положение семьи Баллив среди других дворянских родов, а также государство или регион, к которому род относится, не названы.</li>\n<li>Отношения семьи с другими группами не описаны. Отряд из семи сборщиков (Ден, Клар, Джек, Карен и трое неназванных), с которым Дариус имеет дело в сцене, к семье Баллив в тексте не привязан: Ден заключает, что Дариус «от руководства», но чьё это руководство — осталось нерешённым.</li>\n<li>Связана ли семья Баллив с тем, чьим «посланником Божьим» называет себя Дариус, — в переписке не сказано.</li>\n<li>Способности рода как таковые не описаны. Мана, собирающаяся «виде оков» вокруг пронзённого сердца Дариуса и заставляющая сердце снова забиться, показана как его собственное свойство; наследственной или семейной она нигде не названа.</li>\n<li>Обсуждения семьи авторами (замысла, роли в сюжете, дальнейших планов) в окне нет вообще — есть только сам текст главы.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0085--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0356.html\">Дариус Баллив</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0085--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0085.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0085-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0085/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дорогой дыры в самой записи нет, и это стоит сказать прямо: на <code>GR-0085</code> ссылок ноль, единственная сущность, на которую она ссылается, — <code>PS-0356</code> Дариус Баллив (3 входящих, статья 18 489, база 18 433) — самая полная запись всего этого куста. Семья Баллив живёт целиком за её счёт: у самой группы 0 знаков базы.</p>\n<p>Ноль базы тут не аномалия. У всех четырёх групп «Иссекая» — <code>GR-0084</code>, <code>GR-0085</code>, <code>GR-0086</code>, <code>GR-0087</code> — <code>razmer_bazy: 0</code>. Группы во вселенной собраны производным способом, из статей персонажей и прозы, и своего материала под ними нет ни у одной. Это системная особенность, а не пробел конкретной записи, но она объясняет, почему статью о роде нечем наполнить.</p>\n<p>Ближайшая настоящая дыра, куда стоит идти первым: <code>SL-0133</code> «Документ-систематизация концепций и миров» (7 островов и Иссекай) — две входящие ссылки, статьи нет, 4438 знаков базы. Это единственная незакрытая позиция «Иссекая» с более чем одной ссылкой, и по названию — ровно то место, где дворянские роды и их положение могли быть выписаны списком, если выписывались вообще.</p>\n<h3>С чего начать</h3>\n<p>В базе искать почти нечего, и это надо признать до начала поисков. Всё, что есть о семье, — два оборота внутри одного текста: <code>PR-0123</code> «Сумасшедший где-то?» (2 ссылки, 17 057 знаков). Единственный сосед, где может лежать неучтённое, — <code>PS-0356</code> (18 433): там собран весь Дариус, и если род где-то характеризуется через него, то только там. Проверить <code>SL-0133</code> (4438) — на предмет того, попал ли род Баллив в авторскую систематизацию миров.</p>\n<p>Дальше — архив, с честным ожиданием пустоты. Ориентир: присылка главы 2026-02-20, id 435083–435085. Отрезок «Иссекая» открывается возвратом 2026-02-14 (id 432541) и держится до 2026-04-19 (id 462202). Смотреть надо интервал после id 435085 до 462202: не называл ли Слава род в обсуждении вне текста — планами, репликой про то, кто такие Балливы, или в связке с «руководством», от которого Дариус пришёл. Два месяца вселенной после присылки — окно достаточное, чтобы что-то всплыло, если оно вообще было.</p>\n<h3>Как развивалось</h3>\n<p>Здесь нет ни одной стадии, кроме первой. Заявили — двумя оборотами в одном сообщении, при представлении персонажа: «старший сын дворянской семьи Баллив» и следом «сына дворянской семьи». Не ограничивали, не отклоняли, не откладывали. И не возвращались: после 2026-02-20 «Иссекай» шёл ещё два месяца, до 2026-04-19, и род в переписке за это время не прозвучал ни разу.</p>\n<p>Отличие от соседа по той же главе: у отряда (<code>GR-0084</code>) внутри сцены есть хотя бы движение — состав меняется от семерых до двоих. У семьи Баллив нет и этого. Она названа один раз и остаётся в том же состоянии, в каком появилась.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Правило про семью в этой сцене названо жёстко и работает как механизм: у сборщиков семей нет («Не у кого из них не было семьи, кроме Дена»), и именно семья Дена оказывается тем, чем его наказывают — деревня Ликней, жена, ребёнок. Служба и родня связаны напрямую: за провал на службе отвечает родня.</p>\n<p>Дариус — соседний случай того же рода. Он тоже на службе, тоже у некоего вышестоящего руководства, которое говорит о себе «нас», и у него, в отличие от подчинённых Дена, семья названа — она вписана прямо в его имя. Отвечает ли род Баллив за него так же, как деревня Ликней за Дена, распространяется ли на дворянина то правило, которым он только что воспользовался, — не проговорено. Правило сформулировано для одной стороны сцены и не названо для другой, хотя обе стоят в одном подчинении.</p>\n<h3>Отклик</h3>\n<p>Зацепила одна вещь, и она маленькая. Род назван ровно затем, чтобы Дариусу было откуда взяться, — и тут же отставлен: отряду он представляется не Балливом, а «посланиником Божием», с немедленной поправкой «только не их Бога». Фамилия в этой сцене работает как то, чем персонаж не пользуется: она у него есть, она дворянская, и в момент, когда надо назвать себя перед семью вооружёнными людьми, он берёт другое имя. Больше в записи ничего нет, и притворяться, что есть, смысла нет — два оборота в одном сообщении, из которых вырос целый раздел «Пробелы» длиннее самой статьи.</p></div>", "r": []}];</script>
