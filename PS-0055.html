<script>const BASE="";const DOCNAME="Сордекваксус";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0055-S01", "PS-0055--proishozhdenie"], "h": "<p>Сордекваксус — пришелец вселенной «игра бога», сделанный 2024-04-06 (окно w0030) под конкретную заявку Славы: «Можешь там забить пришелец с крыльями / А то нужен ещё летающий» (id 154409). Миколай ответил: «А, тогда я щас там солянку устрою» (id 154410) — то есть персонаж собирался как «солянка», сборка из нескольких реальных животных.</p>\n<p>Составные части названы в самой карточке: птеродактиль сордес (отсюда и первая часть имени), древесная лягушка и гектокотиль осьминога. Второе имя персонажа, под которым он проходит в позднейшем разговоре, — «лягуха с крыльями».</p>\n<p>Представлен карточкой 2024-04-06 в 16:45 (id 154412): «Встречайте пришельца по имени Сордекваксус!»</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0055-S02", "PS-0055--vneshnost"], "h": "<p>Описание из карточки, дословно:</p>\n<ul>\n<li>«Прямоходящий гуманоид с крыльями птеродактиля сордес за спиной»</li>\n<li>«Удлиненная голова с чертами птеродактиля (клюв с зубами) и лягушки (большие глаза, растягивающийся рот)»</li>\n<li>«Две руки с длинными цепкими пальцами и перепонками между ними»</li>\n<li>«Мускулистые ноги с перепончатыми лапами древесной лягушки»</li>\n<li>«На предплечьях имеются щупальца, напоминающие гектокотиль осьминогов»</li>\n<li>«Кожа покрыта узором, имитирующим кору деревьев, и может менять цвет для маскировки»</li>\n</ul>\n<p>Расположение щупалец было уточнено на следующем шаге, см. раздел «Как менялся».</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0055-S03", "PS-0055--harakter"], "h": "<p>Отдельного характера у персонажа нет — он описан как вид, а не как личность. О поведении сказано: «агрессивного нрава при вторжении на его территорию», встреча с сордекваксусом «может быть опасна для человека».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0055-S04", "PS-0055--sposobnosti"], "h": "<p>Из карточки, дословно:</p>\n<ul>\n<li>«Полет на большие расстояния с помощью крыльев»</li>\n<li>«Лазание по деревьям и скалам с помощью цепких конечностей»</li>\n<li>«Маскировка под окружающую среду за счет изменения окраски кожи»</li>\n<li>«Хватание и манипулирование предметами гибкими щупальцами на руках»</li>\n<li>«Плевки ядовитой слюной, парализующей жертву»</li>\n<li>«Острое зрение, слух и обоняние для охоты и ориентирования»</li>\n</ul>\n<p>Заявка, под которую персонаж делался, — именно полёт: «нужен ещё летающий».</p>", "r": []}, {"t": "Среда обитания и образ жизни", "a": ["S05", "PS-0055-S05", "PS-0055--sreda-obitaniya-i-obraz-zhizni"], "h": "<p>«Сордекваксусы обитают в лесах на деревьях, охотясь на мелких животных. Также способны планировать над открытыми пространствами в поисках добычи».</p>\n<p>Имя используется во множественном числе — то есть речь идёт о виде, а не об одном существе. Это подтверждается и позднейшей репликой Славы про весь набор: «чисто как отдельный виды расы а не часть челика» (id 154667).</p>", "r": []}, {"t": "Связи с другими", "a": ["S06", "PS-0055-S06", "PS-0055--svyazi-s-drugimi"], "h": "<p>В навигации записи персонаж связан с сущностью «многоликий»; в чём именно состоит связь, в приведённых кусках переписки не раскрыто.</p>\n<p>В разговоре 2024-04-07 Сордекваксус зачтён третьим в тройке одобренных пришельцев набора — рядом с «быстрым с узорами молний» и «быком или козлом» (id 154664).</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S07", "PS-0055-S07", "PS-0055--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2024-04-06 (id 154409–154413, окно w0030).</strong> Полная карточка: внешность, шесть способностей, среда обитания и нрав. Щупальца в этой версии описаны просто как находящиеся «на предплечьях».</p>\n<p><strong>Версия 2 — 2024-04-06 (id 154413–154415, окно w0030).</strong> Уточнение по арту, дословно: «По логике этого арта, щупальца у этого пришельца спрятаны в плечах из плеч они могут вылазить» (id 154414). То есть щупальца не открыто растут на предплечьях, а убраны в плечи и выдвигаются оттуда. Правка идёт от изображения, а не от текста; сам арт в переписке не описан.</p>\n<p><strong>Версия 3 — 2024-04-07 (id 154664–154667, окно w0030).</strong> Повтор прежней мысли, без изменений устройства персонажа: Слава пересчитывает одобренных — «Три это быстрый с узорами молний, бык или козел; а третий кто» (id 154664). Миколай: «Ну я подумал что лягуху с крыльями ты тож одобрил» (id 154665), «А мне лично все понравились» (id 154666). Слава: «Ну мне тоже ну там чисто как отдельный виды расы а не часть челика» (id 154667). Тем самым Сордекваксус попадает в тройку одобренных.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S08", "PS-0055-S08", "PS-0055--chto-s-nim-stalo"], "h": "<p>Персонаж одобрен и входит в тройку отобранных пришельцев набора (2024-04-07). Оговорка Славы задаёт статус: сордекваксусы идут как «отдельный виды расы», а не как «часть челика» — то есть как самостоятельный вид, а не как облик или составляющая какого-то персонажа.</p>", "r": []}, {"t": "Пробелы", "a": ["S09", "PS-0055-S09", "PS-0055--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Планета происхождения и место сордекваксусов во вселенной не названы.</li>\n<li>Не сказано, есть ли у вида речь, разум, общество; описание идёт как о хищном животном виде.</li>\n<li>Никакого именованного индивидуального представителя вида в переписке нет — имя относится к виду целиком.</li>\n<li>Связь с сущностью «многоликий» упомянута в навигации, но в приведённых кусках переписки не раскрыта.</li>\n<li>Арт, по которому уточнялось расположение щупалец, в переписке не описан; кто его сделал — не сказано.</li>\n<li>Как «спрятаны в плечах» согласуется с изначальным «на предплечьях» — прямо не оговорено, старая формулировка не отменена.</li>\n<li>Смысл фразы Славы «а не часть челика» до конца не развёрнут: с чем именно сопоставляются виды, в переписке не сказано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0055--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0014.html\">игра бога</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0055--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-04-06</td>\n<td>154409–154413</td>\n<td>w0030</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-04-06</td>\n<td>154413–154415</td>\n<td>w0030</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-04-07</td>\n<td>154664–154667</td>\n<td>w0030</td>\n<td>игра бога (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0055-sordekvaksus.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0055--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0055.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
