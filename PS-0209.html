<script>const BASE="";const DOCNAME="Серафима";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0209-S01", "PS-0209--proishozhdenie"], "h": "<p>Серафима — приёмная дочь Серпа, «местного супергероя». Материал чужой: Миколай пересказывает вселенную девочки с конкурса, придуманную ею в пятом классе, и пересылает куски из другого чата.</p>\n<p>По происхождению: «Её родил кот. От человечечкой сущности». Сам Миколай на этом месте комментирует задумку — «ОМЕГАВЕРС ЗООФИЛИЯ В 5 КЛАССЕ?» — и смеётся.</p>\n<p>Про биографию сказано только, что «История у неё тяжёлая»; в чём эта история состоит, не рассказано.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0209-S02", "PS-0209--vneshnost"], "h": "<p>Кошкодевочка. Других деталей нет; упомянуто, что к пересказу прилагались рисунки («а сейчас отправлю рисунки»), но их содержание в тексте не описано.</p>", "r": []}, {"t": "Связи с другими", "a": ["S03", "PS-0209-S03", "PS-0209--svyazi-s-drugimi"], "h": "<ul>\n<li>Серп — приёмный отец, «местный супергерой» той же вселенной.</li>\n<li>Земова — основной персонаж автора исходной вселенной, за которую та ролила; названа в том же ряду персонажей, которые «пожалели её».</li>\n</ul>", "r": []}, {"t": "Статус", "a": ["S04", "PS-0209-S04", "PS-0209--status"], "h": "<p>Одна из любимых персонажей автора исходной вселенной: «Моя любимая карочи, НУ ОДНА ИЗ».</p>", "r": []}, {"t": "Как менялся", "a": ["S05", "PS-0209-S05", "PS-0209--kak-menyalsya"], "h": "<p><strong>2025-02-25 (id 295508–295522).</strong> Единственная версия. Персонаж представлен целиком в одном сообщении подряд: происхождение от кота и человеческой сущности, статус приёмной дочери Серпа, вид — кошкодевочка, имя, статус любимой.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0209-S06", "PS-0209--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Чужой материал, пересланный из другого чата; сама история Серафимы не рассказана, только помечена как тяжёлая.</li>\n<li>Способности не названы.</li>\n<li>Характер не описан.</li>\n<li>Что с ней стало — в переписке не сказано.</li>\n<li>Связь Серафимы со вселенной «Апостол» (кроме того, что о ней говорили в этом чате) не установлена.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["PS-0209--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-02-25</td>\n<td>295508–295522</td>\n<td>w0077</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0209-serafima.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0209--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0209.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0209-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0209/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Самое дорогое здесь — не отсутствие материала, а то, что материал уже есть, но лежит в чужой карточке. Диапазоны пересекаются буквально: <code>PS-0206</code> «Приёмная дочь Альгиза» стоит на id 295503–295510, эта статья — на 295508–295522, общие три сообщения. И в <code>PS-0206</code> есть реплика, которой здесь не хватает: «ОООО У СЕРПА ТОЖЕ ПРИЁМНАЯ ДОЧЬ. Только там пиздец». Это и есть та самая «тяжёлая история», о которой здесь сказано, что её нет. Единственный содержательный пробел статьи закрывается соседней записью, а не архивом.</p>\n<p>Второе — вселенная. <code>MR-0112</code> «вселенная девочки с конкурса»: статья 5.0 КБ при базе 3.7, ссылок ноль. При этом внутри неё поимённо перечислены шесть персонажей, у каждого своя карточка, и ни один на неё не ссылается. Пробел «связь Серафимы со вселенной Апостол не установлена» — производная от этого: контейнер не подключён, поэтому все шестеро висят прямо во вселенной «Апостол» по дате объявления. Плюс <code>MR-0112</code> не решён по авторству: она пишет «Это не вселенная Миколая и Славы», а соседняя <code>PS-0210</code> — что персонаж оттуда принадлежит Миколаю.</p>\n<p>Третье, техническое, но чинить лучше сразу: по строке «Серафим» набор склеивается. Рядом стоят <code>SP-0187</code> «Силы Серафима» (4.3 КБ, одна ссылка), <code>SP-0225</code> «Способности Серафима» (3.9 КБ) и <code>GR-0008</code> «Команда против Серафима» — это, судя по всему, другое лицо, мужское, из вселенной «Апостол». Родительный падеж мужского имени совпадает с именительным женского; любой поиск по имени будет тащить их вместе.</p>\n<h3>С чего начать</h3>\n<p>В базу. Сама Серафима выбрана почти до дна — статья 2.7 КБ при базе 2.9, добирать нечего. Материал разъехался по соседям, и все они тоньше, чем ожидаешь: <code>PS-0207</code> Серп — статья 3.8 КБ при базе 1.8, <code>PS-0208</code> Земова — 2.2 при 1.8, <code>PS-0206</code> — 3.1 при 2.2. Читать их надо вместе с <code>PS-0204</code> Альгиз (7.3 КБ базы) как один кусок окна w0077: там ровно один эпизод — побег приёмной дочери Альгиза и те, кто её пожалел, — и Серп в нём участвует.</p>\n<p>В архив — за двумя вещами, обе за 2025-02-25, окно w0077. Первая: где кончается пересылка из другого чата. Рисунки анонсированы прямо в тексте («а сейчас отправлю рисунки»), значит, сразу после 295522 в архиве идут вложения — их наличие и подписи к ним и есть единственный шанс на внешность. Вторая: реплика «Так вот...» (id 295464 по <code>MR-0112</code>) начинает обещанный рассказ о вселенной, и приведённый кусок на ней обрывается. Продолжение надо искать в архиве после этого id, не в базе — там его нет.</p>\n<h3>Как развивалось</h3>\n<p>Одна дата, 2025-02-25, одно сообщение подряд. Заявили целиком — происхождение, отец, вид, статус любимой — и тут же ограничили: «История у неё тяжёлая», без содержания. То есть единственная линия персонажа введена сразу помеченной как нерассказанная. Рисунки объявлены отправленными, но в текст не попали. Возврата нет: больше эта запись нигде не появляется, ссылок на неё ноль.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для приёмной дочери Альгиза функция названа: она не самостоятельный персонаж, а слабость отца — «Ну как у всех серийных убийц. Есть какие-то слабости. Ну этот боялся потерять дочь». Через неё объяснён сам Альгиз. Серафима — приёмная дочь Серпа, и её ставят в тот же ряд прямой репликой «у Серпа тоже приёмная дочь». Но для неё связь названа только как родство. Что приёмная дочь значит для Серпа, «местного супергероя», — та же ли это конструкция слабости или другая, — не проговорено, хотя параллель между двумя случаями отмечена вслух самим автором.</p>\n<h3>Отклик</h3>\n<p>Сильное — «Её родил кот. От человечечкой сущности». Не «она кошкодевочка», не «полукровка», а именно так, с обратной стороны: субъект — кот, человек проходит как «сущность». Пятиклассница построила фразу, в которой человеческое — служебная часть предложения. И то, что в записи сохранена реакция на этот материал, а не только сам материал: «ОМЕГАВЕРС ЗООФИЛИЯ В 5 КЛАССЕ?» и смех. Обычно справочник фиксирует, что придумано; здесь заодно зафиксировано, как это читается годы спустя, и от этого персонаж существует сразу в двух временах — как чья-то любимая в пятом классе и как повод заржать в двадцать. Жаль, что дальше ничего: между «моя любимая карочи, НУ ОДНА ИЗ» и «история у неё тяжёлая» есть весь персонаж, и его никто не пересказал.</p></div>", "r": []}];</script>
