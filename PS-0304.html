<script>const BASE="";const DOCNAME="Палачи";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0304-S01", "PS-0304--proishozhdenie"], "h": "<p>Палачи — государственные убийцы, описанные единым куском 2025-11-05 (id 382099, окно w0108). Вселенная Оам объявлена. Это не отдельный персонаж, а группа: «Их вырастили именно для убийства».</p>\n<p>Личности засекречены. Какое именно государство или организация их растит, не сказано.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0304-S02", "PS-0304--vneshnost"], "h": "<p>«Они всегда ходят в масках на задание.» Больше о внешности ничего.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0304-S03", "PS-0304--harakter"], "h": "<p>Отдельно не описан. Из описания следует только то, что задача у них всегда одна: «У них всегда одна и таже цель ликвидации. Если они появятся не кто не выживает.»</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0304-S04", "PS-0304--sposobnosti"], "h": "<p>Обучены боевому стилю апостола Палача — «они были обучены стилю боя как у Палача ( апостола, который сильнейший в ближнем бою), но опять же это лишь имитация стиля Палача». Оговорка «лишь имитация» стоит в самом исходнике: это не сам стиль, а его воспроизведение.</p>\n<p>Отдельно зафиксирована свёрнутая попытка: «Также было проведена попытка обучения особого усиления Имитатора, но из-за большой смертности от неё отказались.» То есть особому усилению Имитатора палачей пробовали учить, но отказались из-за большой смертности. От чьей смертности — обучаемых или кого-то ещё — из текста прямо не следует, хотя речь идёт о свёрнутом обучении.</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0304-S05", "PS-0304--svyazi-s-drugimi"], "h": "<ul>\n<li>Палач (апостол) — источник боевого стиля, «сильнейший в ближнем бою». Палачи носят его имя и имитируют его стиль.</li>\n<li>Апостолы — через фигуру Палача.</li>\n<li>Имитатор — через отменённую попытку обучить палачей его особому усилению.</li>\n<li>Оам — вселенная, к которой они отнесены.</li>\n</ul>", "r": []}, {"t": "Как менялся", "a": ["S06", "PS-0304-S06", "PS-0304--kak-menyalsya"], "h": "<p>Версия 1 — 2025-11-05 (id 382099, окно w0108). Единственная версия, одно сообщение. Всё описание дано сразу и целиком, пересмотров нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0304-S07", "PS-0304--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Государство или организация, которая их растит, не названа.</li>\n<li>Кто такой Палач-апостол помимо того, что он сильнейший в ближнем бою, здесь не раскрыто.</li>\n<li>Что такое «особое усиление Имитатора», в этом куске не объясняется.</li>\n<li>Численность, устройство, иерархия не названы.</li>\n<li>Конкретных палачей — с именами, сценами, событиями — в переписке нет.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0304--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0056.html\">Апостолы (21 апостол; «насекомые»)</a>, <a href=\"GR-0070.html\">Палачи (государственные убийцы)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0008.html\">Оам</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0304--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-11-05</td>\n<td>382099–382099</td>\n<td>w0108</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0304-palachi.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0304--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0304.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
