<script>const BASE="";const DOCNAME="Арбетары и Альфа";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0281-S01", "PS-0281--proishozhdenie"], "h": "<p>Арбетары и Альфа — категория существ во вселенной «Апостол», описанная Славой одним сообщением (2025-05-31, id 331636, окно w0099).</p>\n<p>Это одни и те же существа, различающиеся только происхождением: «Арбетары и Альфа это одни те же существа. Но в первом случае это люди из кильке, а во втором это чужемирцы».</p>\n<p>Способ появления: «это существа, который насильственно вырвали кусок силы своего мира( с помощью ритуала??? Которой я ещё не доработал). А после посели его в себе и заставили выделять силу».</p>\n<p>Ключевое отличие от благословенных — где находится сила: «Из-за того, что грубо говоря это их сила ( внутри них). Они могут использовать его без ограничений. ( по сути это благословенния только не через связь. А именно это сила находиться внутри их) Виде перегрузки мозга».</p>\n<p>Контекст, в котором это сказано: в том же сообщении Слава фиксирует, что правители «не как не могут влиять на благословенного или обычного существа (кроме как насильственно давать благословения, даже если само существо этого не хочет)», что благословение даётся только одно — «Больше человек не выдержит. И это одно благословения с ним до его смерти. Благословения нельзя разорвать» — и что при этом «правители всевидящий».</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Как развивалось — не материал авторов</b>\n<p>2025-01-22 — заявили Альф отдельно и коротко: «Альфы сильнейший существа в своём мире», без всякого обряда и в связке с организацией злодеев. 2025-03-13 — показали обряд изнутри сцены, глазами проводника, с составом, процентами чистой души и энергетическим следом. 2025-03-14 — арбетары названы тем, ради раскрытия чего пишется отдельная история: «Антоша. Идея раскрыть Арбетаров». 2025-05-31 — переопределили: Альфа и Арбетар оказываются одними и теми же существами, разница только в происхождении, механизм переписан на «вырвали кусок силы своего мира», а сам обряд в том же предложении помечен как недоработанный — «с помощью ритуала??? Которой я ещё не доработал». Вернулись позже и не сюда: 2025-09-12 арбетары объясняются через одержимых, 2025-09-17 их предстоит «куда-то пристроить» в новой вселенной, и материал по ним идёт до 2025-10-18.</p></div>", "r": []}, {"t": "Способности", "a": ["S02", "PS-0281-S02", "PS-0281--sposobnosti"], "h": "<p>Базовый набор — четыре умения, те же, что у благословенных: «усиленная регенерация( регенерация чаще всего превосходит благословенных) ; усиление тела и чувств; аура; сенсорика».</p>\n<p>Сверх этого — уникальная способность, формирующаяся индивидуально: «И также получают уникальную способность. Даже если они сцапали один и тот же кусок силы. У них она всё равно будет разная. Так как этот кусок начинает формироваться подобно апостолом. Из-за этого они получают уникальную способность».</p>\n<p>Применение не ограничено и не отключается: «При этом если они подожгут лес он будет гореть пока весь не выгореть. Либо его не потушат. Им не зачем отключат способность. У них даже нету такого понятия, как отключения».</p>\n<p>Взамен — обязательное обучение, которого у благословенных нет: «Но они должны будут учиться вырабатывать энергию и научиться использовать способность и контролировать энергию. Когда у благословенным это выходит автоматический».</p>\n<p>Отдельное ограничение касается артефактов. Артефакты — «объект, что имеет силу правителя», возникший из того, что «когда то правитель пытался создать мир. И не в состоянии полностью контролировать этот процесс наделили какой-либо объект через чур большой сил этот самый объект». Арбетары и Альфа входят в число тех, кто не может их толком использовать: «Благословенный; альфа, Арбетары и фантазёры не способны раскрыть всю мощь артефакта. Так как уже сами переполненный силой. Лучшего всего мощь артефакта способен раскрыть обычный человек».</p>\n<p>Про артефакты с символикой — те, что «не был ни кем создан», появились вместе с правителями и имеют невероятную мощь, — сказано шире: «смертным существами некогда не раскрыть хотя бы 3 процентов всей мощи артефакт».</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Отклик — не материал авторов</b>\n<p>Самое интересное здесь — что категория определена через отсутствие. Не через то, что арбетары умеют, а через то, чего у них нет: «Им не зачем отключат способность. У них даже нету такого понятия, как отключения». И сразу пример, который делает это физическим: подожжённый лес горит, пока не выгорит весь или пока его не потушат. Сила без выключателя описана убедительнее, чем сила с выключателем, — у благословенных предохранитель, лимит, десять лет жизни, а у этих просто ничего не кончается само. Второе, что зацепило, — перевёрнутое правило про артефакты: полностью раскрыть мощь способен обычный человек, а благословенный, альфа, арбетар и фантазёр не могут, потому что «уже сами переполненный силой». Обычно в таких системах сила открывает двери; тут она их закрывает, и пустота оказывается пропускной способностью. И оставленное прямо в тексте «ритуала??? Которой я ещё не доработал» — честнее, чем любая придуманная на бегу подробность.</p></div>", "r": []}, {"t": "Связи с другими", "a": ["S03", "PS-0281-S03", "PS-0281--svyazi-s-drugimi"], "h": "<p><strong>Благословение и благословенные.</strong> Прямая точка сравнения: арбетары и Альфа — «по сути это благословенния только не через связь». Отличия названы поимённо: сила внутри, а не по связи; применение без ограничений; нет понятия отключения; регенерация чаще всего превосходит благословенных; способность требует обучения, тогда как у благословенных всё выходит автоматически.</p>\n<p><strong>Апостолы.</strong> Механизм формирования уникальной способности задан через них: вырванный кусок силы «начинает формироваться подобно апостолом».</p>\n<p><strong>Килька.</strong> Мир, откуда происходят люди, становящиеся арбетарами.</p>\n<p><strong>Чужемирцы.</strong> Те, кто при том же ритуале становится Альфой.</p>\n<p><strong>Фантазёры.</strong> В том же сообщении описаны отдельно и на арбетаров не сводятся: «правитель с маленькой буквой», создавшие свой мир в голове и потому видящие мир иначе — пример фантазёра, «что видит мир виде линей, колебаний. Глядя на стенку он видит лишь большо миллиона движущих линий, который за, что-то отвечают», и способного менять колебания нитки так, что «стена может стать воздухом или водой или взорваться». Слава называет их сильнейшими существами на данный момент, но с оговоркой, что они могут просто исчезнуть, «потерять связь с нашим мирам и полностью окунуться свой». С арбетарами и Альфой их объединяет только общее ограничение по артефактам.</p>", "r": []}, {"t": "Как менялся", "a": ["S04", "PS-0281-S04", "PS-0281--kak-menyalsya"], "h": "<p><strong>2025-05-31 (id 331636, окно w0099).</strong> Единственная версия. Категория задана целиком в одном сообщении: тождество арбетаров и Альфы, происхождение через ритуал вырывания куска силы своего мира, размещение силы внутри носителя, четыре базовых умения плюс уникальная способность, отсутствие отключения, необходимость обучаться, ограничение по артефактам.</p>\n<p>Более ранних или более поздних состояний в материале нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "PS-0281-S05", "PS-0281--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Ритуал вырывания куска силы автором не доработан — Слава помечает это прямо в тексте: «с помощью ритуала??? Которой я ещё не доработал».</li>\n<li>Что означает формулировка «виде перегрузки мозга» применительно к использованию силы — не разъяснено; цена или последствия такой перегрузки не описаны.</li>\n<li>Ни одного носителя по имени не названо — Арбетар и Альфа фигурируют как категории, а не как отдельные персонажи.</li>\n<li>Внешность и характер не описаны.</li>\n<li>Не сказано, кто и зачем проводит ритуал, добровольно ли это, и что происходит с миром, у которого вырвали кусок силы.</li>\n<li>Не сказано, как арбетары и Альфа соотносятся по силе с апостолами и с благословенными — кроме частного сравнения по регенерации.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0281--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0017.html\">Арбетары</a>, <a href=\"GR-0018.html\">Альфы</a>, <a href=\"GR-0019.html\">Чужемирцы</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0281--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-05-31</td>\n<td>331636–331636</td>\n<td>w0099</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0281-arbetary-i-alfa.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0281--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0281.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0281-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0281/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — <code>SL-0089</code> «Список категорий сил (Благословенный, Арбетары, Альфы, Чужемирцы, Владельцы артефактов, Фантазёры)». Четыре ссылки, статьи нет, в базе всего 1 753 знака. Это дешевле всего починить и дороже всего не чинить: перечень, в котором эта статья — одна клетка, а <code>MR-0146</code> «Силы мира: Благословенные, Арбетаров и Альфы, Творцы (фантазёры)» (три ссылки, 2 460 в базе) — вторая попытка того же перечня. Пока обе записи не сведены, любое утверждение «арбетары — это по сути благословение, только не через связь» держится на одном сообщении, а не на таксономии.</p>\n<p>Вторая по цене дыра — та же категория, разложенная по шести кодам и трём типам. Альфы существуют как <code>MR-0106</code> (тип «мир», 28 881 в базе), как <code>GR-0018</code> (группа) и здесь как персонаж. Арбетары — как <code>PS-0226</code> (20 681), <code>PS-0220</code> (38 531), <code>PS-0224</code> «Старик-арбетар» (90 651) и <code>SP-0198</code> «Ритуал становления Арбетаром» (48 879). Около 190 килобайт про существ, которые в этой статье объявлены одними и теми же, лежат под шестью разными кодами, и ни в одном месте не сказано, какая из записей главная. Пробел «ни одного носителя по имени не названо» — не пробел мира: в <code>PS-0224</code> носитель есть, у него 90 килобайт материала и сцена обряда.</p>\n<h3>С чего начать</h3>\n<p>В базе, но осторожно. Под пробел «ритуал не доработан» в базе лежит <code>SP-0198</code> (2025-03-13, id 301806–301821, 48 879 знаков) — обряд, расписанный до состава: мозг благословенного, тело альфы, пара чужемирцев, ещё один благословенный и проводник с чистой душой «где-то на 80%». Это не тот обряд, о котором говорит эта статья: тут силу вырывают у собственного мира, там Арбетара изготавливают из чужих тел, и тело Альфы служит материалом. Два разных описания появления одних и тех же существ, с разницей в два с половиной месяца, нигде не сведены. Начинать надо с того, чтобы это расхождение зафиксировать, а не с того, чтобы закрыть им пробел.</p>\n<p>Дальше по базе: <code>MR-0106</code> (даты 2025-01-22 — 2025-03-13) — там своя формулировка, «с помощью ритуала или ещё чего», и своя версия про «ядро»; <code>PS-0226</code> (2025-03-14 — 2025-10-18) — там арбетары идут через одержимых и через новую безымянную вселенную, то есть материал по теме продолжается ещё пять месяцев после этой статьи. Про артефакты — <code>SP-0047</code> (24 897) и <code>SP-0212</code> (2 060). В архив за этим ходить не надо.</p>\n<h3>Как развивалось</h3>\n<p>2025-01-22 — заявили Альф отдельно и коротко: «Альфы сильнейший существа в своём мире», без всякого обряда и в связке с организацией злодеев. 2025-03-13 — показали обряд изнутри сцены, глазами проводника, с составом, процентами чистой души и энергетическим следом. 2025-03-14 — арбетары названы тем, ради раскрытия чего пишется отдельная история: «Антоша. Идея раскрыть Арбетаров». 2025-05-31 — переопределили: Альфа и Арбетар оказываются одними и теми же существами, разница только в происхождении, механизм переписан на «вырвали кусок силы своего мира», а сам обряд в том же предложении помечен как недоработанный — «с помощью ритуала??? Которой я ещё не доработал». Вернулись позже и не сюда: 2025-09-12 арбетары объясняются через одержимых, 2025-09-17 их предстоит «куда-то пристроить» в новой вселенной, и материал по ним идёт до 2025-10-18.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для благословения счёт и необратимость названы жёстко и в том же сообщении: одно на существо, «Больше человек не выдержит», «одно благословения с ним до его смерти», «Благословения нельзя разорвать». Арбетары и Альфа поставлены рядом как прямой аналог — «по сути это благословенния только не через связь». Про их сторону ничего подобного не сказано: можно ли посадить в себя второй кусок силы, есть ли предел вместимости, можно ли кусок вынуть или вернуть миру, кончается ли он со смертью носителя. Для силы, идущей по связи, правило единственности проговорено; для силы, лежащей внутри, такого же рода правила нет.</p>\n<h3>Отклик</h3>\n<p>Самое интересное здесь — что категория определена через отсутствие. Не через то, что арбетары умеют, а через то, чего у них нет: «Им не зачем отключат способность. У них даже нету такого понятия, как отключения». И сразу пример, который делает это физическим: подожжённый лес горит, пока не выгорит весь или пока его не потушат. Сила без выключателя описана убедительнее, чем сила с выключателем, — у благословенных предохранитель, лимит, десять лет жизни, а у этих просто ничего не кончается само. Второе, что зацепило, — перевёрнутое правило про артефакты: полностью раскрыть мощь способен обычный человек, а благословенный, альфа, арбетар и фантазёр не могут, потому что «уже сами переполненный силой». Обычно в таких системах сила открывает двери; тут она их закрывает, и пустота оказывается пропускной способностью. И оставленное прямо в тексте «ритуала??? Которой я ещё не доработал» — честнее, чем любая придуманная на бегу подробность.</p></div>", "r": []}];</script>
