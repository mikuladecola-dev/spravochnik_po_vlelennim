<script>const BASE="";const DOCNAME="«Холод»";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0223-S01", "SP-0223--mehanika"], "h": "<p>«Холод» — так, в кавычках, называет это сам рассказчик (Артём) внутри второй брошенной истории (2025-04-21, окно w0088, id 320986–320987). Кавычки стоят в исходном тексте, отсюда и написание имени.</p>\n<p>Действие начинается не с удара, а с тоски. Спусковой момент в тексте — реплика Паши, сидящего в углу комнаты, прижав колени к голове: «я хочу домой». Дальше рассказчик ловит у себя ту же мысль и удивляется ей: «\"Я то же хочу домой\" Удивился я собственной мысли».</p>\n<p>Затем идёт само описание, дословно: «Тоска нахлынула на меня. Тоска этого место залазила мне словно в грудь. Захватывая моей сердце. Окутывая и делая дыхания прерывистом.» Изнутри это идёт как поток вопросов: «\"Что я здесь делаю? Зачем я здесь? Я хочу домой? Тёплый дом, где ждут меня жена и дочь. В места которая я могу назвать родным. Я не хочу здесь быть\"».</p>\n<p>Телесные признаки перечислены по порядку:</p>\n<ul>\n<li>глаза «начали гореть. Наливаться свинцом о жалость к себе»;</li>\n<li>«Грудь начало жимать»;</li>\n<li>рассказчик ложится в позе эмбриона — «В надежде согреть себя же, чтобы тот холод в сердце не распространялся дальше»;</li>\n<li>попытка не помогает: «Но он распространялся заполоная лёгкий»;</li>\n<li>дальше вниз: «Этот холод спускался всё ниже. Касаясь уже не сердце, а как будто бы самой моей естество».</li>\n</ul>\n<p>То есть движение идёт снаружи внутрь и сверху вниз: грудь → сердце → лёгкие → «самое естество». Приведённая в тексте цель — найти уязвимость: «Он думал, что найдёт уязвимость».</p>\n<p>Источник в тексте назван дважды и по-разному: сначала это «тоска этого место» (то есть свойство места — заброшенного корабля исполняющего желания), затем — «Холод» как некто, кто «не знал», «думал» и «утонул», то есть действующее лицо. Что из этого верно, в переписке не разобрано.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0223-S02", "SP-0223--ogranicheniya-i-cena"], "h": "<p>Против рассказчика Холод не сработал, и причина названа прямо: «Но это было ошибкой. Ведь \" Холод\" Не знал какой же я. Не знал мою извращенную натуру. Не знал, что я не сожалею.»</p>\n<p>Проигрыш описан как утопление в чужом внутреннем содержимом: «Но сам же утонул в безумий красок, волн, взрывов. Там был фестиваль, всё взрывалось. Было цветной море. Холоду здесь было не месту.»</p>\n<p>Таким образом, в единственном показанном применении Холод упирается в отсутствие сожаления у цели — жалость к себе есть, а сожаления нет, и зацепиться не за что.</p>\n<p>Цена для цели всё равно взимается. После этого рассказчик отключается и очнулся уже в той же комнате, в темноте, один: «Я очнулся в той комнате, в которой мы остановились. Здесь было темно.» За время отключки группу растащило — Игоря и Паши уже нет, а Нику за ногу когтистой лапой утаскивает чёрный гуманоид. Сам рассказчик не знает, что с ним было: «Тем более почему они не помогли мне? С моим приступом? Или что это было. Не знаю.» Слово «приступ» — его собственное предположение, не объяснение.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0223-S03", "SP-0223--nositeli"], "h": "<p>Носитель в обычном смысле не назван. Холод в переписке привязан к двум сущностям:</p>\n<ul>\n<li><strong>Заброшенный корабль исполняющего желания</strong> — как место, чья тоска «залазила в грудь»;</li>\n<li><strong>Артём</strong> — как тот, на ком Холод показан и в ком он тонет; «фестиваль» из красок, волн и взрывов принадлежит именно его натуре.</li>\n</ul>\n<p>Кто ещё из группы (Ника, Игорь, Паша) подвергался тому же, в переписке не сказано.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0223-S04", "SP-0223--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-04-21 (окно w0088, id 320985–320988).</strong> Единственная. Холод вводится сразу в двух ролях: как атака места/сущности и как то, что разбивается о защиту рассказчика. Больше к нему не возвращаются.</p>\n<p>Обстановка, в которой это происходит, задана в том же куске: затопленная комната на корабле, выбитая давлением воды дверь, коридор, где под ногами булькает и лежит выпотрошенное тело без кожи, единственный работающий фонарик, тени, кидающиеся под ноги. Группа как раз остановилась передохнуть в комнате без окон — Игорь предложил остановку, потому что «Если мы продолжим так без разумно шагать. То можем и умереть, а если мы умрём мы не исполним желания». Приступ настигает рассказчика именно в этой остановке.</p>\n<p>Переписка на этом месте обрывается репликой Миколая «спасибо что скинул» (id 320988) — разбора не последовало.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "SP-0223-S05", "SP-0223--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Не разъяснено, отдельная это сущность корабля или образ внутреннего состояния рассказчика. В базе способность условно поставлена как грань Артёма — с прямой пометкой, что вопрос не решён.</li>\n<li>Не сказано, действует ли Холод на кого-то, кроме рассказчика, и что именно случилось с Игорем, Пашей и Никой, пока рассказчик был без сознания.</li>\n<li>«Фестиваль» — краски, волны, взрывы, цветное море — назван, но не объяснён: что это, откуда, всегда ли внутри Артёма так, не сказано.</li>\n<li>Не сказано, сколько длилось состояние и почему рассказчик потерял сознание, если Холод проиграл.</li>\n<li>Не сказано, повторяется ли Холод, можно ли ему сопротивляться иначе, есть ли у него связь с чёрным гуманоидом из той же сцены.</li>\n<li>Жена и дочь рассказчика упомянуты только внутри приступа; отдельно в этом куске о них ничего не говорится.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0223--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0074.html\">Четверо на корабле («супер группа»)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0223--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-04-21</td>\n<td>320985–320988</td>\n<td>w0088</td>\n<td>Нимб (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0223-holod.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0223--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0223.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
