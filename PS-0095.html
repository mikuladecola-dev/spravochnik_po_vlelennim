<script>const BASE="";const DOCNAME="Текси";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0095-S01", "PS-0095--proishozhdenie"], "h": "<p>Персонаж Славы. Впервые выложен карточкой 2024-06-18 (окно w0038, сообщения 183250–183251, вселенная «7 островов») под рабочим обозначением «Магнетик т.п.» — без имени. Имя Текси дано позже, 2024-06-21 (185045), после прямого запроса Славы «И имя» (185040).</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0095-S02", "PS-0095--vneshnost"], "h": "<p>В переписке не описана. Названы только возраст — 20 лет — и снаряжение (см. ниже).</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0095-S03", "PS-0095--harakter"], "h": "<p>Дано 2024-06-21 в полной карточке (185045):</p>\n<div class=\"q\"><p>«Черта характера: спокойный, интроверт( то бишь держит все проблемы и со мнения внутри себя), с опаская относится к людям»</p></div>\n<p>Там же:</p>\n<ul>\n<li>Любит: «яблоки, брата( как брата)».</li>\n<li>Не любит: «толпы людей, жару».</li>\n</ul>\n<p>Уточнение «брата (как брата)» дано Славой в самой карточке — то есть отношение к брату оговорено отдельно как именно братское.</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0095-S04", "PS-0095--sposobnosti"], "h": "<p>Способность — магнетизм.</p>\n<p><strong>Инструмент.</strong> Большой железный меч. Формулировка 2024-06-18 (183250): «большой железный меч ( как у берсерка) ему его легко контролировать пулять его и летайте на нем». В карточке 2024-06-21 (185045): «огромные меч ( легче контролировать и легко запускать воздух или летать на нем , самый убойный среди всех орудий)». Инструмент он «почти всегда держит воздухе» (183250).</p>\n<p><strong>Оружие.</strong> По карточке 2024-06-18: 10 клинков — «он использует их для отвлечения или если много слабых целей, так как скорость и убойность у них в разы меньше инструмента»; лёгкий и тонкий меч на поясе — «что бы им сражаться так как свой инструмент он почти всегда держит воздухе»; железные перчатки и ботинки — «с помощью магнетизма усиливает их из-за этого удара в разы сильней». В карточке 2024-06-21 то же перечислено как «10 ножей; одноручный меч; железный перчатки и обувь».</p>\n<p><strong>Статы</strong> (2024-06-21, 185045): Сила 10, Скорость 5,5, Ловкость 6, Выносливость 8, Контроль 5.</p>\n<p><strong>Приёмы</strong> (2024-06-21, 185045):</p>\n<ol>\n<li>«магнитная поля, складывает пальцы круг и через них запускать нож с невероятной скоростью, но меткость хромает как и контроль из за этого использует только в ближе». В первой карточке (183250) этот же приём назван фирменным и описан так: «сложить пальцы круг и через него пустить нож давая ему невероятной ускорения ( минус он очень не меткий поэтому прием использует лишь в ближе )».</li>\n<li>«железная кожа, пускает себя кровь и из железа в крови, покрываеть себя защищаясь и усиливая себя ( слишком рискованно использовать на постоянной основе; большая потеря кровь)».</li>\n<li>«грать желаза, запуск 10 ножей для отвлечения внимания или чтобы убить слабых противников».</li>\n</ol>\n<p><strong>Правило, приложенное к карточке.</strong> Сразу за первой карточкой Слава дописал (183251):</p>\n<div class=\"q\"><p>«Добавка если ты получил ранения из-за того что слишком сильно использовал свою силу, то какой либо не был целитель он это не восстановить ты либо ждёшь и она сама восстанавливается либо это рано остаётся навсегда»</p></div>\n<p>В переписке это дано как добавка к карточке; относится ли правило только к Текси или ко всем носителям сил, не оговорено.</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0095-S05", "PS-0095--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Брат</strong> — назван в графе «Любит»: «брата( как брата)». Кто это, в переписке не сказано.</li>\n<li><strong>Катапира</strong> — персонаж Миколая (способность «повышение температуры»). Разбирались парой: 2024-06-21 Слава предложил «Хочешь можем разобрать под этим категорий 2 персов» (184996), переслал свою карточку и карточку «Температура т.п.» (185000–185001) и спросил «Каво выбираешь?» (185003). Миколай взял температурного и оформил его как Катапиру (185046). Дальше шёл общий спор о статах.</li>\n<li><strong>Система характеристик персонажей</strong> — общая сетка граф (Любит / Не любит / статы / Оружие / Инструмент / Способности / Приёмы / Черта характера), по которой оформлены обе карточки.</li>\n<li>В списке связей исходника названы также <strong>Зурбон</strong> и <strong>Сталкер</strong>; в приведённых кусках переписки они не фигурируют.</li>\n</ul>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0095-S06", "PS-0095--kak-menyalsya"], "h": "<p><strong>2024-06-18, окно w0038, id 183250–183251.</strong> Первая карточка, без имени, под обозначением «Магнетик т.п.»: мужчина 20 лет, магнетизм, инструмент — большой железный меч как у берсерка, оружие — 10 клинков, лёгкий тонкий меч на поясе, железные перчатки и ботинки, фирменный приём с ножом через сложенные кольцом пальцы. Отдельной добавкой — правило о ранениях от перерасхода силы, которые не лечит никакой целитель.</p>\n<p><strong>2024-06-21, id 184996–185003</strong> (повтор прежней мысли). Карточка переслана без изменений — для разбора по новым категориям вместе со вторым персонажем.</p>\n<p><strong>2024-06-21, id 185040–185046.</strong> Полная карточка. Появляется имя — Текси. Добавлены: «Любит» и «Не любит», статы (Сила 10, Скорость 5,5, Ловкость 6, Выносливость 8, Контроль 5), три именованных приёма (магнитная поля, железная кожа, грать желаза), черта характера. Прежний фирменный приём вошёл в список как первый под именем «магнитная поля»; появился новый приём «железная кожа»; «10 клинки» переименованы в «10 ножей».</p>\n<p><strong>2024-06-21, id 185057–185079.</strong> Правка статов после спора о скорости и ловкости. Слава: «Ну типа ловкость и скорость одно и тоже / Или не ?» (185060–185061), затем «Ладно не ,добавь скорость и я добавлю» (185062). Миколай развёл понятия: «Ловкость это способность уклоняться от препятствий, выбираться из любой хуйни. А скорость ну это то насколько быстро перемещается» (185063). Там же Миколай сформулировал принцип балансировки: «Я не хочу всё-таки его делать очень быстрым / Типо ты часто переживаешь за баланс и как по мне в таком случае не стоит в самом начале всех делать имбовыми / Надо дать им и будущим персам потанцевал» (185066–185068). Слава: «Да уловил / И изменил статы» (185069–185070), на переспрос Миколая — «Я у своего» (185075). Новые значения статов Текси в переписке не приведены.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0095-S07", "PS-0095--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Итоговые статы после правки 2024-06-21 не названы: зафиксировано только, что Слава их изменил у своего персонажа.</li>\n<li>Не сказано, чем «Скорость 5,5» стала после введения различия между скоростью и ловкостью.</li>\n<li>Кто такой брат Текси — не сказано.</li>\n<li>Внешность не описана.</li>\n<li>Предыстория не дана.</li>\n<li>Роль во вселенной, принадлежность к какой-либо команде или организации не названы.</li>\n<li>Не оговорено, распространяется ли правило о неизлечимых ранениях от перерасхода силы (183251) на всех персонажей или только на Текси.</li>\n<li>Соотношение обозначения «Магнетик т.п.» и имени Текси прямо не проговорено: имя просто заменило рабочее обозначение в новой карточке.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["PS-0095--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-06-18</td>\n<td>183250–183251</td>\n<td>w0038</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-06-21</td>\n<td>184996–185003</td>\n<td>w0038</td>\n<td>7 островов (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2024-06-21</td>\n<td>185040–185046</td>\n<td>w0038</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-06-21</td>\n<td>185057–185079</td>\n<td>w0038</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0095-teksi.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0095--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0095.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
