<script>const BASE="";const DOCNAME="Демон";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0011-S01", "PS-0011--proishozhdenie"], "h": "<p>Персонаж Славы. Появился 2023-03-27 (окно w0011, id 37529–37546) сразу цельным описанием — внешность, возраст, род занятий, оружие и заявка на шесть способностей. Вселенная в этом окне нигде не названа.</p>\n<p>Кличка объяснена самим Славой в том же вечере (id 37543–37544). На вопрос Миколая «Зачем так много способностей блин» ответ звучит так: «Потому что его кличка демон» и «И надо было дать изюминку». То есть количество способностей выведено из клички, а не наоборот.</p>\n<p>Два года спустя, 2025-04-08 (окно w0087, id 317506–317527), Демон назван в ответ на вопрос «в плане злодей кто» — вместе с Масочником. К этому моменту вселенная объявлена как Нимб.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0011-S02", "PS-0011--vneshnost"], "h": "<p>Дословно из первого описания (2023-03-27, id 37532):</p>\n<div class=\"q\"><p>«17 летние нормального телосложения ходит в белой маски где нарисовано улыбка черный плащ»</p></div>\n<p>То есть: семнадцать лет, нормальное телосложение, белая маска с нарисованной улыбкой, чёрный плащ. Других деталей внешности за всё время нет; лицо под маской не описывалось.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0011-S03", "PS-0011--harakter"], "h": "<p>Отдельно характер не разбирался. Всё, что о нём известно, следует из образа действий: он убивает в прямом эфире сверхлюдей, совершавших грехи — «на подобие безмысленного убийство или каких ещё грехов». Чаще всего пользуется пистолетом (id 37534).</p>\n<p>Единственный разговор, задевающий его жестокость, — обмен 2023-03-27 (id 37553–37562). Миколай указывает, к чему приведёт сочетание способностей лечить и приводить в сознание: «Представляешь как это жестоко», «Он грешника избивает до потери сознания, приводит в сознание и дальше», «Или крови грешник много потерял, он его лечит и снова». Слава на это отвечает «Ну нет» и переводит обе способности напарникам. То есть такой способ действия был проговорен, но за самим Демоном не закреплён.</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0011-S04", "PS-0011--sposobnosti"], "h": "<p>Заявлено с самого начала шесть способностей (id 37532: «у него должно быть 6 способности»). За вечер 2023-03-27 набрано четыре; пятая и шестая обсуждались, но обе предложенные были отклонены.</p>\n<p><strong>Закреплённые за Демоном (сводный перечень Славы, id 37573–37580):</strong></p>\n<ol>\n<li><strong>Контроль грешников.</strong> Первая и исходная. Дословно: «первая способности контроли грешнико( тем грешней человек тем лучше контролирует он их )» — то есть тем грешней человек, тем лучше он их контролирует.</li>\n<li><strong>Ускорение.</strong> «он может ускорять себя и другие неудушевленый предметы».</li>\n<li><strong>Контроль тела.</strong> «он может как либо изменять тела и регенерировать». В этом пункте поглощена регенерация, которую Слава называл отдельно раньше в том же разговоре (id 37550: «Ну регенерация»).</li>\n<li><strong>Душа грешника.</strong> «хватая противника за голову и за 3 минуты создаёт в его голове мир где он проживает разный или одну жизнь».</li>\n</ol>\n<p><strong>Контроль интернета.</strong> В одном из промежуточных перечислений Слава ставит его вторым: «Первая контроль грешника вторая контроль интернета» (id 37547). В более позднем сводном перечне того же вечера второй уже стоит ускорение, и контроль интернета в списке не повторён. Отменён он или просто не переписан, в переписке не сказано. Происходит он, по-видимому, из предложения Миколая «Способность контролировать радиоволны чтобы его видео транслировались на всех каналах в мире» (id 37542), но прямо этой связи Слава не проводил.</p>\n<p><strong>Способности, переданные напарникам.</strong> Лечение и приведение в сознание Слава снял с Демона и отдал напарникам: «Ему же все равно нужны напарники», «У него будет напарники», «Он же один не будет», «Ну и вот у него будет напарник с такой способностю» (id 37557–37562).</p>\n<p><strong>Пятая и шестая — не закрыты.</strong> После четвёртой Слава пишет: «Ну вот осталось ещё 2» (id 37581). Дальше Миколай предлагает два варианта, Слава оба отклоняет (см. ниже), и разговор обрывается.</p>\n<p><strong>Отклонённые и не принятые варианты:</strong></p>\n<ul>\n<li><em>Короткая невидимость</em> — первое предложение Миколая (id 37535): «когда полиция находит место убийства грешников, для того чтобы он успел скрыться». В сводные перечни Славы не вошла.</li>\n<li><em>Приведение человека в сознание</em> (id 37537) и <em>лечение других людей</em> (id 37538) — предложены Миколаем, затем самим же Миколаем разобраны как жестокие в сочетании с избиением, и Славой переданы напарникам.</li>\n<li><em>Телекинез для камеры</em> (id 37539) — «чтобы камеру для прямого эфира переносить». Не вошёл.</li>\n<li><em>Камера на лбу</em> (id 37540–37541) — альтернатива телекинезу, на случай съёмки от первого лица. Не вошла.</li>\n<li><em>Контроль радиоволн</em> (id 37542) — «чтобы его видео транслировались на всех каналах в мире».</li>\n<li><em>Телепатия</em> (id 37565) — предложена как боевая, когда Слава сказал «Ему нужна боевая способность». Не принята.</li>\n<li><em>Управление мышцами</em> (id 37567) — «Ну тогда управление мышцами». Слава: «Глупо» (id 37568).</li>\n<li><em>Инерционная телепатия</em> (id 37569) — «чтобы патроны жёстко ускорять». Ответ Славы: «А ясно» (id 37571). Согласия нет; в перечнях не появляется.</li>\n<li><em>Клон грешника</em> (id 37582) — предложение на пятую: «Способность создать клон грешника, который будет сражаться с грешником, отвлекать его».</li>\n<li><em>Отнятие способности при убийстве</em> (id 37585) — предложение на шестую: «Ну и способность отнимать способность при убийстве».</li>\n</ul>\n<p>Оба последних отклонены Славой одной и той же репликой, повторённой дважды: «Может другую», «Может другую» (id 37595–37596). Миколай уточнил «Может, сам или завтра?» и ушёл; тема в переписке не возобновлялась.</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0011-S05", "PS-0011--svyazi-s-drugimi"], "h": "<p><strong>Напарники Демона.</strong> Заявлены как необходимая часть: «Ему же все равно нужны напарники», «Он же один не будет». Им переданы лечение и приведение в сознание. Состав напарников не назван, имён нет.</p>\n<p><strong>Масочник.</strong> Назван рядом с Демоном как второй злодей (2025-04-08, id 317515: «Демон и масочник»). Что их связывает и связывает ли вообще, в переписке не сказано.</p>\n<p><strong>Нимб.</strong> На уточняющий вопрос Миколая «это челы другого мира или директора нимба или всё вместе?» (id 317516) Слава ответил: «И то и другой» (id 317517). То есть Демон заявлен и как персонаж другого мира, и как директор Нимба одновременно. Дальше это не раскрывается.</p>\n<p><strong>Демон из «Мастера и Маргариты».</strong> Рядом Миколай тянет литературную параллель (id 317519–317526): «у мы сейчас мастера и Маргариту читаем в школе на литре», «там демон был типа сущностью другого мира», затем поправляется: «скорее он находился в существующем мире вне времени», «ну вот он демон». Слава в это время перечисляет «Кот», «И этот волшебник». Перенесена ли эта характеристика — сущность в существующем мире вне времени — на самого Демона, в переписке не сказано.</p>\n<p><strong>Грешники.</strong> Постоянный объект и способностей, и убийств: контроль грешников, душа грешника, отклонённый клон грешника, отклонённое отнятие способности при убийстве.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0011-S06", "PS-0011--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2023-03-27, id 37529–37546, окно w0011, вселенная не определена.</strong> Первое описание целиком: 17 лет, нормальное телосложение, белая маска с нарисованной улыбкой, чёрный плащ; убивает в прямом эфире сверхлюдей-грешников; чаще всего пользуется пистолетом; должно быть шесть способностей, первая — контроль грешников, «тем грешней человек тем лучше контролирует он их». Сразу задан вопрос: «И какий ещё 5 способность ему дать?». Миколай накидывает варианты (короткая невидимость, приведение в сознание, лечение, телекинез для камеры либо камера на лбу, контроль радиоволн) и попутно спрашивает: «Зачем так много способностей блин». Ответ Славы — про кличку и «изюминку».</p>\n<p><strong>Версия 2 — 2023-03-27, id 37546–37572, окно w0011.</strong> Промежуточный перечень: «Первая контроль грешника вторая контроль интернета», плюс регенерация, «И ещё 4», затем «Так да 3 надо». Спор о жестокости лечения и приведения в сознание. Решение: часть способностей уходит напарникам, Демону нужна боевая. Предложены и не приняты телепатия, управление мышцами («Глупо»), инерционная телепатия для ускорения патронов.</p>\n<p><strong>Версия 3 — 2023-03-27, id 37573–37581, окно w0011.</strong> Сводный перечень Славы, накопительно: сначала «Его первая способность контроль грешниками его вторая ускорения», затем «Первая контроль грешниками вторая ускорения третий контроль тела», затем «Четвертая способность душа грешника». Регенерация здесь оказывается внутри контроля тела, контроль интернета из списка выпадает. Миколай в этом месте отвечает «Достаточно» и «Тц», Слава подгоняет: «Давай давай придумывай сценарист». Итог версии: «Ну вот осталось ещё 2».</p>\n<p><strong>Версия 4 — 2023-03-27, id 37582–37598, окно w0011.</strong> Пятая и шестая: клон грешника и отнятие способности при убийстве. Обе отклонены («Может другую»). Разговор уходит в сторону и обрывается.</p>\n<p><strong>Версия 5 — 2025-04-08, id 317506–317527, окно w0087, вселенная Нимб.</strong> Демон назван злодеем вместе с Масочником и заявлен как фигура двойной природы: и человек другого мира, и директор Нимба — «И то и другой». Ничего кроме имени и этого двойственного статуса не сказано. Ни маска, ни плащ, ни способности здесь не повторяются.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0011-S07", "PS-0011--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вселенная в окне w0011 нигде не названа.</li>\n<li>Пятая и шестая способности так и не назначены: оба предложенных варианта отклонены, в следующем окне тема не всплывает. Доведены ли они когда-либо — неизвестно.</li>\n<li>Судьба контроля интернета не решена: он назван второй способностью в одном перечне и отсутствует в следующем; отменён он или просто не переписан, не сказано.</li>\n<li>Ограничения и цена способностей не разбирались ни для одной из четырёх закреплённых.</li>\n<li>Состав напарников не назван — сказано только, что они будут и что им отходят лечение и приведение в сознание.</li>\n<li>Имя под кличкой не названо, лицо под маской не описано.</li>\n<li>Как сочетаются «чел другого мира» и «директор Нимба» в одном персонаже, не объяснено.</li>\n<li>Перенесена ли на Демона характеристика из разговора о «Мастере и Маргарите» («находился в существующем мире вне времени»), в переписке не сказано.</li>\n<li>Связь Демона с Масочником не описана — только совместное упоминание.</li>\n<li>Что с ним стало, в переписке нет: события с его участием не описывались.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0011--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0009.html\">Организация Нимб (НБО)</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0009.html\">Организация Нимб (НБО)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0011--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2023-03-27</td>\n<td>37529–37546</td>\n<td>w0011</td>\n<td>неясно (не определено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2023-03-27</td>\n<td>37546–37572</td>\n<td>w0011</td>\n<td>неясно (не определено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2023-03-27</td>\n<td>37573–37581</td>\n<td>w0011</td>\n<td>неясно (не определено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2023-03-27</td>\n<td>37582–37598</td>\n<td>w0011</td>\n<td>неясно (не определено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-04-08</td>\n<td>317506–317527</td>\n<td>w0087</td>\n<td>Нимб (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0011-demon.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0011--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0011.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
