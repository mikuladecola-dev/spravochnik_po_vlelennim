<script>const BASE="";const DOCNAME="Рука из сна Алека";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0149-S01", "PS-0149--proishozhdenie"], "h": "<p>Появляется в тексте, который Слава прислал одним сообщением (2024-08-21, id 222143, окно w0054). Текст написан от первого лица от имени Алека — студента 4 курса, живущего в однокомнатной квартире.</p>\n<p>Рука приходит к Алеку во сне не сразу. Сначала — ресторан рядом с домом, суп с непонятным названием, незнакомка (<a href=\"PS-0150.html\">незнакомка из ресторана</a>), которая на него «зырит, пожирает взглядом», подсаживается и уговаривает пойти к нему домой. Дальше — провал: «когда я дверь открывал и здесь темень, не не то бишь в глазах, а в памяти не фига не помнил». Алек очнулся голым на кровати, на тумбочке — записка с извинением и сообщением, что она вынесла мусор. Он проверил, всё ли на месте: пропал только мусор и блины со стола. Прошёлся по врачам, все сказали, что с ним всё в порядке, и он «забил на это».</p>\n<p>Рука снится ему на десятую ночь после потери памяти. Сам образ у Алека возник без объяснения: «Откуда я вообще взял что это рука не знаю, как то подсознательно представил этот образ».</p>\n<p>Связь между провалом в памяти и появлением руки в переписке не названа — рука просто приходит через десять ночей после того случая.</p>", "r": [["незнакомка из ресторана", "PS-0150.html"]]}, {"t": "Внешность", "a": ["S02", "PS-0149-S02", "PS-0149--vneshnost"], "h": "<p>Отдельного описания нет. Всё действие происходит «в непроглядной темноте», Алек видит не руку, а знает, что это рука. Варианты именования в переписке: «рука», «ручища».</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0149-S03", "PS-0149--sposobnosti"], "h": "<p>Преследование во сне. Алек в темноте бежит от руки, она гонится за ним. Погоня идёт всю ночь.</p>\n<p>Касание. Рука до Алека дотрагивается, и по этому касанию он понимает, что это не сон. Боли нет: «Нет я не почувствовал боли». Ощущение не кожное — «это ощущалась не как прикосновения к кожи», и точнее Алек сформулировать не может («ощущалась как та не понятно»), но описывает так: «Словно холодной рукой притронулись к моему сердцу». Реакция тела — «каждую клетка моего тела тряслась».</p>\n<p>Реальная усталость во сне. После восьми минут бега Алек «был готов лёгкий выплюнуть», задыхался. Передышки не даётся: «Но перекупить мне не дали, и вот рука снова близка и мне нужно снова бежать».</p>\n<p>Реальное течение времени. «Во сне время шло как не во сне. То бишь для меня это длилась и правду всю ночь». Проснулся Алек «весь в поту, и еле дыша», пошёл на кухню пить воду, потом умываться.</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0149-S04", "PS-0149--svyazi-s-drugimi"], "h": "<p>Алек — тот, за кем рука гонится, и единственный, кто её видел. Других носителей или свидетелей в переписке нет.</p>\n<p>Незнакомка из ресторана (<a href=\"PS-0150.html\">незнакомка из ресторана</a>) — присутствует в том же тексте, идёт раньше руки по времени. Прямая связь между ней и рукой в переписке не проведена.</p>", "r": [["незнакомка из ресторана", "PS-0150.html"]]}, {"t": "Как менялся — состояния по датам", "a": ["S05", "PS-0149-S05", "PS-0149--kak-menyalsya"], "h": "<p><strong>2024-08-21 (id 222143, окно w0054).</strong> Единственное зафиксированное состояние. Всё, что о руке известно, изложено в одном сообщении Славы; переработок и вторых версий в переписке нет.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S06", "PS-0149-S06", "PS-0149--chto-s-nim-stalo"], "h": "<p>История обрывается на том, что Алек стоит после пробуждения и думает, что делать дальше: «это явно не сон, да и я совсем не тупорылый и понимаю, что это не сон, где со мной ничего не будет». Что рука сделает дальше и чем всё кончилось — в переписке не сказано.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0149-S07", "PS-0149--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Природа существа не раскрыта — что это такое, откуда взялось, чего хочет.</li>\n<li>Связь с потерей памяти Алека не объяснена; названо только то, что рука пришла на десятую ночь после того случая.</li>\n<li>Внешнего описания нет: действие в полной темноте, форма руки известна только по подсознательному ощущению Алека.</li>\n<li>Что происходит, если рука схватит, а не заденет, — не сказано.</li>\n<li>Имени у существа нет.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0149--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0150.html\">незнакомка из ресторана</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0150.html\">незнакомка из ресторана</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0149--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-21</td>\n<td>222143–222143</td>\n<td>w0054</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0149-ruka-iz-sna-aleka.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0149--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0149.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
