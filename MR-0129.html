<script>const BASE="";const DOCNAME="Азуриэль";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0129-S01", "MR-0129--ustroystvo"], "h": "<p>Азуриэль (<a href=\"MR-0129.html\">Азуриэль</a>) в переписке существует одновременно в двух качествах, и авторы это не разделили: как отдельное существо («он», описанный по картинке) и как народ/раса в перечне обитателей мира. Обе трактовки идут параллельно с 2025-03-26 по 2026-04-19 и ни одна не отменена.</p>\n<p>Исходное описание, данное Славой по понравившейся картинке (2025-03-26, id 311285):</p>\n<div class=\"q\"><p>«Гуманоид человеческого роста синий кожей( не точно может розовый) с острыми ушами как у эльфа<br>Также на лице красивый узоры разного цвета<br>Одежда зимняя<br>Сам он гибкий»</p></div>\n<p>Через четыре минуты (id 311287) прозвучало имя — «Азуриэль», и описание было повторено с добавлением: узоры «могут меняться в зависимости от эмоций» (id 311288).</p>\n<p>Цвет кожи так и не зафиксирован: во всех повторениях описания сохраняется формулировка «синий кожей( не точно может розовый)». Ни разу выбор не сделан.</p>\n<p>Способность, названная сразу и не менявшаяся в основе, — эмпатия. Слава: «Эмпатия я хотел на этом остановиться. Просто хотел чтобы ты возможно подкинул какую нибудь идею» (2025-03-26, id 311417). Развёрнутая формулировка появилась 2025-09-17 (id 366126): «Прекрасно ощущать намерения».</p>\n<p>Отдельно в этом же обсуждении закрыта целая ветка мироустройства. На вопрос Миколая, надо ли думать «стихии вещества и другое», Слава ответил: «Нет идти ты в жопу. Там не будет не какой концепций силы( энергий) там будут другое» (2025-03-26, id 311425), и пояснил: «Я просто всегда слишком сильно стараюсь развить эту энергию и забиваю на всё остальные» (id 311428). Что именно «другое» — в переписке не сказано, ответ отложен на «При встрече» (id 311429).</p>\n<h3>Нейро-сканер</h3>\n<p>2025-09-17 (id 366148) способность переформулирована под названием «Азуриэль: Нейро-сканер»:</p>\n<div class=\"q\"><p>«Его способность это не эзотерическая эмпатия, а гиперразвитое чувство, позволяющее напрямую считывать и интерпретировать биоэлектрическую активность нервной системы других существ.»</p></div>\n<p>В исходном файле при этой версии стоит пометка, что данная формулировка машинная (см. ai_inserts) — то есть текст пришёл в чат не как собственная фраза автора.</p>\n<p>К нейро-сканеру сразу же приложены два уточнения:</p>\n<ul>\n<li>Слабость: «находясь в толпе он теряется и не может сконцетрироваться» (id 366151).</li>\n<li>Работа с электричеством (id 366159): «он может поглощать электричество и улучшать своё физ. Данные и регенерацию. И бить током прикоснувшись человека или стрелять молнии. Но не каких громовых драконов либо ещё какое фантастическое и связанное с энергией бредятины».</li>\n</ul>\n<p>Оговорка про «громовых драконов» — прямое ограничение масштаба: электричество остаётся бытовым и телесным, без крупных энергетических форм.</p>\n<h3>Отношение к Оам</h3>\n<p>С 2025-10-20 (id 376401) Азуриэль вписан в общую систему Оам. Оам — неизвестные частицы, попавшие на Землю с метеоритами, долгое время токсичные, затем нейтральные после адаптации; человек поглощает их дыханием и через кожу, у каждого своя ёмкость, излишки выходят «через споры, с выдохом и просто через кожу»; выпуск лишнего Оам «происходит чуть быстрее чем поглащения». Обычный человек получает доступ к Оам только через передозировку концентрацией, где два исхода — смерть либо «человеку удаётся почувствовать и обуздать Оам».</p>\n<p>Азуриэль в этой системе — исключение: «Они с рождения могут использовать Оам и скорость поглощения и выделения Оам у них выше чем у кого либо» (id 376401). То есть им не нужен кризисный опыт обуздания, и по скорости обмена они держат рекорд среди всех перечисленных мутантов.</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0129-S02", "MR-0129--naselenie"], "h": "<p>Происхождение расы названо один раз и затем повторялось дословно (2025-10-20, id 376401):</p>\n<div class=\"q\"><p>«Это было группа лиц, чей дети мутировали полностью превратившись Азуриэль.»</p></div>\n<p>То есть мутация не постепенная и не частичная: мутировали дети, и мутировали «полностью». Кто именно была эта «группа лиц», где и когда — в переписке не сказано.</p>\n<p>Появление на Земле: «Да апостолы и Азуриэль появились на земле естественным путем» (2025-09-17, id 366193). Естественным — то есть через Оам-мутацию, а не как пришельцы или порождения чего-то извне.</p>\n<p>Образ жизни зафиксирован 2025-11-17 (id 385768) в общем перечне рас и организаций:</p>\n<div class=\"q\"><p>«Азуриэль. Как народ что прячется от цивилизации. Но некоторый всё же живут среди людей»</p></div>\n<p>Повторено без изменений 2025-12-06 (id 393287). Где именно прячутся, чем живут, есть ли у них своё место (в отличие от Детей мирового древа, про которых сказано «Живут в мести которой мутировала от Оам») — не сказано.</p>\n<p>Внешние признаки народа те же, что у изначального персонажа: человеческий рост, синяя (возможно розовая) кожа, острые эльфийские уши, узоры на лице, меняющие цвет от эмоций, зимняя одежда, гибкость.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0129-S03", "MR-0129--mesto-vo-vselennoy"], "h": "<h3>Природный охотник на апостолов</h3>\n<p>Ключевая роль сформулирована 2025-09-17 (id 366175):</p>\n<div class=\"q\"><p>«Ты ведь понимаешь что для апостолов у которых главная силы сверх чувства и восприятия ( то есть самое главное нервная система и мозг) то есть Азуриэль является природным охотником Апостолов. При этом против Поротой они не так эффективны»</p></div>\n<p>Логика прямая: сила апостолов держится на нервной системе и мозге, а нейро-сканер Азуриэля читает именно нервную систему. Против Поротаев (каменных, чья сила физическая) — «не так эффективны».</p>\n<p>Тут же оговорено соотношение сил: «Но апостолы сильнее поротоя» (id 366177). На вопрос Миколая «природным?» (id 366178) прямого ответа не последовало — разговор ушёл на другую тему.</p>\n<h3>В перечнях рас</h3>\n<p>Азуриэль устойчиво стоит в списках рас и сторон вселенной:</p>\n<ul>\n<li>2025-09-18 (id 366586): «Кто у нас как раса есть Поротой Азуриэль Апостолы Одержимый». Тут же — «Сейчас надо думать о расе ведь монстров можно просто из мифологии взять».</li>\n<li>2025-10-02 (id 370605), перечень «Кто есть пока что не в сформировавшиеся мире»: Апостолы с сверхспособностями (насекомые), Каменный Поротой, Азуриэль, вампиры, контролирующие кровь, и Дети мирового древа. По итогу обсуждения Миколай: «идеи крутые и ура есть мир» (id 370613).</li>\n<li>2025-10-20 (id 376401) — большой свод мутантов: Апостолы, Аскизы, Дети мирового древа, Азуриэль, Поротай, Вампиры.</li>\n<li>2025-11-17 (id 385768) и 2025-12-06 (id 393287) — расстановка сил. Наверху коты (их девять, ни во что не вмешиваются), затем «Апостолы 21 вторая по силе раса на земле», дальше — «расы и организации который равны по силе с друг другом», и в этом ряду Азуриэль вместе с Детьми мирового древа, Поротаями, группировкой сестры, правительственной организацией, церковью с паладинами, организацией Виктора, Пернатыми, вампирами-аристократами и Аскизами. Итог: «В нашем мире Оэм уже существует много сторон для конфликта» (id 393290).</li>\n</ul>\n<h3>Мировое древо</h3>\n<p>2025-10-02 разговор открывается репликой «Существо порождённым мировым древом» (id 370600), после чего идёт перечень с Азуриэлем. Связан ли Азуриэль с мировым древом или эта реплика относится к другому существу — из текста не следует.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0129-S04", "MR-0129--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-03-26 (id 311282–311286).</strong> Персонаж описан по картинке, без имени. Внешность: гуманоид человеческого роста, синяя (возможно розовая) кожа, острые эльфийские уши, «красивый узоры разного цвета» на лице, зимняя одежда, гибкий. Вопрос открыт: «И какая у него будет способность».</p>\n<p><strong>Версия 2 — 2025-03-26 (id 311287–311288).</strong> Дано имя — Азуриэль. Описание повторено, добавлено, что узоры на лице «могут меняться в зависимости от эмоций».</p>\n<p><strong>Версия 3 — 2025-03-26 (id 311412–311429).</strong> Миколай просит расширить представление о существе, чтобы придумать силу: «я все равно не понимаю что это за существо чтобы давать способности», «а то скажу что он ртутью управляет, а ты скажешь, вообще-то очевидно льдом или деревом». Слава отказывается расширять: остановиться хочет на эмпатии. Заодно закрыта тема стихий и веществ для этого мира.</p>\n<p><strong>Версия 4 — 2025-09-17 (id 366126–366128).</strong> Слава пересылает кусок из другого чата (с заголовком «Слава дондоков:»). Внешность повторена дословно, способность названа: «Эмпатия / Прекрасно ощущать намерения».</p>\n<p><strong>Версия 5 — 2025-09-17 (id 366148–366159).</strong> Способность переформулирована как «Нейро-сканер» — считывание биоэлектрической активности нервной системы вместо «эзотерической эмпатии». Добавлены слабость в толпе и работа с электричеством (поглощение, усиление физданных и регенерации, удар током при касании, молнии) с оговоркой против «фантастическое и связанное с энергией бредятины».</p>\n<p><strong>Версия 6 — 2025-09-17 (id 366175–366193).</strong> Роль во вселенной: природный охотник на апостолов; против Поротаев малоэффективен; апостолы сильнее Поротаев. Происхождение — «появились на земле естественным путем». В этом же окне Миколай параллельно придумывает Поротаев (жук, три исхода поедания), к Азуриэлю это не относится.</p>\n<p><strong>Версия 7 — 2025-09-18 (id 366583–366586).</strong> Повтор: Азуриэль в перечне рас наравне с Поротоем, Апостолами и Одержимыми.</p>\n<p><strong>Версия 8 — 2025-10-02 (id 370600–370613).</strong> Упомянут в перечне обитателей несформировавшегося мира, без пояснений.</p>\n<p><strong>Версия 9 — 2025-10-20 (id 376399–376403).</strong> Азуриэль встроен в полный свод мироустройства Оам. Внешность и эмпатия повторены дословно, к ним приклеен блок про нейро-сканер и слабость в толпе, и впервые добавлено происхождение расы («группа лиц, чей дети мутировали полностью») плюс рекордная скорость поглощения и выделения Оам и владение Оам с рождения.</p>\n<p><strong>Версия 10 — 2025-11-05 (id 382108).</strong> Тот же свод переслан заново одним сообщением, текст про Азуриэля идентичен версии 9. Изменений нет.</p>\n<p><strong>Версия 11 — 2025-11-17 (id 385768–385769).</strong> Новое: образ жизни. «Народ что прячется от цивилизации. Но некоторый всё же живут среди людей». Азуриэль помещён в средний эшелон — среди рас и организаций, равных друг другу по силе.</p>\n<p><strong>Версия 12 — 2025-12-06 (id 393286–393290).</strong> Перечень повторён дословно, Азуриэль — одной строкой без изменений.</p>\n<p><strong>Версия 13 — 2026-04-19 (id 462204–462206).</strong> Резкая смена рамки. Азуриэль появляется не как раса и не как отдельное существо из прежней системы, а как один из «благословенных» — людей, «что способны чувствовать присутствия когото. Кого именно неизвестно, может бог, может ещё какое-то существо». В этом списке он пятый:</p>\n<div class=\"q\"><p>«Пятый азуриэль. Он способен чувствовать эмоции людей. А иногда он способен чётко ощутить эмоции нечто, который опять же его куда-то ведут. Если он не пойдёт то его способности умиляться и он более отчётливо начнёт осушать чужие чувствовать, а так как их много он начнёт сходить с ума от этого.»</p></div>\n<p>Схема, общая для всех благословенных: канал восприятия «нечто» (у Героя — шёпот, у Александра — везение, у Юры — две белые точки, у четвёртого — запах дома, у Максима — сердцебиение) плюс наказание за неподчинение зову. У Азуриэля наказание — усиление способности: чужие чувства становятся отчётливее, и от их количества он сходит с ума. Имя здесь пишется со строчной («азуриэль»), номер пятый; шестой в списке пропущен, после пятого сразу идёт «Седьмой Максим».</p>\n<p>Как версия 13 соотносится с прежней расой Азуриэлей — в переписке не сказано. Слава закончил перечень словами «Ну принцип ты понял» (id 462206).</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0129-S05", "MR-0129--probely"], "h": "<div class=\"gaps\"><ul>\n<li><strong>Персонаж или раса — не решено.</strong> С самого начала Азуриэль описывается как «он», при этом с 2025-09-18 стоит в перечнях рас, а с 2025-10-20 имеет описание происхождения народа. Разделения на имя персонажа и название вида в переписке нет. Отмечено как неясность в окнах w0105 и w0107.</li>\n<li><strong>Цвет кожи не зафиксирован.</strong> Формулировка «синий кожей( не точно может розовый)» повторяется во всех версиях без выбора (неясность окна w0108).</li>\n<li><strong>Принадлежность к миру.</strong> В первом окне (w0086) вселенная прямо не названа; неясно, к какому именно миру он относится, кроме соседства с «новым миром» Славы. Версии 4–8 отнесены к неясной вселенной, версии 9–12 — к Оам, версия 13 снова к неясной.</li>\n<li><strong>«Там будут другое».</strong> Слава отказался от концепций энергий и стихий, но чем они заменяются — не сказано, разговор перенесён на встречу (id 311429).</li>\n<li><strong>Заголовок «Слава дондоков»</strong> перед блоком описания в версиях 4, 9 и 10 не пояснён (неясность окна w0107).</li>\n<li><strong>Где живут.</strong> Сказано только, что прячутся от цивилизации и что часть живёт среди людей. Территория, поселения, устройство сообщества — не названы.</li>\n<li><strong>Численность, происхождение имени, язык, продолжительность жизни, размножение</strong> — не обсуждались.</li>\n<li><strong>Отношения с другими расами</strong> прописаны только через боевую эффективность (охотник на апостолов, слаб против Поротаев). Союзов, вражды, торговли, договоров — в переписке нет.</li>\n<li><strong>Связь с мировым древом</strong> не подтверждена: реплика «Существо порождённым мировым древом» (id 370600) стоит рядом с перечнем, но к кому относится — из текста не следует.</li>\n<li><strong>Электричество</strong> (версия 5) больше ни разу не всплывало — ни в своде 2025-10-20, ни позже. Отменено оно или просто не повторялось — не сказано.</li>\n<li><strong>Соотношение версии 13 с остальными</strong> не установлено: благословенный Азуриэль и раса Азуриэлей нигде не связаны и не разделены.</li>\n<li><strong>В окне w0106</strong> упоминание одно, «кто это — не сказано».</li>\n<li><strong>Ответ на вопрос «природным?»</strong> (id 366178) не дан — разговор прервался на посторонней теме.</li>\n</ul></div>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Самая дорогая дыра здесь — не в самом Азуриэле, а рядом с ним: вселенная «вне вселенной» (<code>VS-0013</code>), к которой статья прямо привязывает несколько версий персонажа (версии 1–8 и 13), до сих пор без статьи. По <code>blockers.json</code> для неё уже накоплено 35203 байта материала в базе — то есть не пусто, просто не собрано. Пока её нет, сама статья об Азуриэле вынуждена через раздел «Пробелы» держать открытым основной вопрос — «к какому миру он вообще относится» — хотя ответ, возможно, уже частично лежит в базе.</p></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0129--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0068.html\">Азуриэль (народ)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0008.html\">Оам</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0129--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-03-26</td>\n<td>311282–311286</td>\n<td>w0086</td>\n<td>вне вселенной (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-26</td>\n<td>311287–311288</td>\n<td>w0086</td>\n<td>вне вселенной (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2025-03-26</td>\n<td>311412–311429</td>\n<td>w0086</td>\n<td>вне вселенной (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-09-17</td>\n<td>366126–366128</td>\n<td>w0105</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-09-17</td>\n<td>366148–366159</td>\n<td>w0105</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-09-17</td>\n<td>366175–366193</td>\n<td>w0105</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-09-18</td>\n<td>366583–366586</td>\n<td>w0105</td>\n<td>неясно (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2025-10-02</td>\n<td>370600–370613</td>\n<td>w0106</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-10-20</td>\n<td>376399–376403</td>\n<td>w0107</td>\n<td>Оам (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-11-05</td>\n<td>382108–382108</td>\n<td>w0108</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-11-17</td>\n<td>385768–385769</td>\n<td>w0109</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-06</td>\n<td>393286–393290</td>\n<td>w0112</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-04-19</td>\n<td>462204–462206</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0129-azuriel.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0129--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0129.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["MR-0129-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/MR-0129/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Самая дорогая дыра здесь — не в самом Азуриэле, а рядом с ним: вселенная «вне вселенной» (<code>VS-0013</code>), к которой статья прямо привязывает несколько версий персонажа (версии 1–8 и 13), до сих пор без статьи. По <code>blockers.json</code> для неё уже накоплено 35203 байта материала в базе — то есть не пусто, просто не собрано. Пока её нет, сама статья об Азуриэле вынуждена через раздел «Пробелы» держать открытым основной вопрос — «к какому миру он вообще относится» — хотя ответ, возможно, уже частично лежит в базе.</p>\n<h3>С чего начать</h3>\n<p>Материал не в архиве, он уже в базе: <code>kb/vselennye/VS-0013-vne-vselennoy.md</code>. Стоит начать оттуда — прежде чем гадать, к какой вселенной относится Азуриэль в версиях 1–8 и 13, стоит посмотреть, что вообще написано про «вне вселенной» как категорию.</p>\n<h3>Как развивалось</h3>\n<p>Персонаж объявлен 2025-03-26 без имени и без силы, через несколько минут получил имя, затем на предложение расширить его образ автор ответил отказом и заморозил тему стихий. Способность несколько раз переформулировалась (эмпатия → нейро-сканер) и один раз обросла деталью (работа с электричеством), которая после 2025-09-17 больше не всплывала. Роль во вселенной Оам — с 2025-10-20 по 2025-12-06 — повторялась дословно четыре раза без единого изменения. А 2026-04-19, спустя четыре месяца тишины, имя всплыло заново в совершенно другой рамке — как один из «благословенных», без единого слова о том, как это соотносится с прежней расой.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для Детей мирового древа названо, где они живут («в месте, которое мутировало от Оам»). Для Азуриэля тот же вопрос — где живёт народ, что прячется от цивилизации — задан и остался без ответа, хотя оба народа появляются в одном и том же своде мутантов 2025-10-20 и оба формально принадлежат к одной системе Оам.</p>\n<h3>Отклик</h3>\n<p>Больше всего цепляет не мир, а разрыв между версией 12 и версией 13: полгода Азуриэль был расой в перечне сторон конфликта, а потом, одной репликой, стал единичным «благословенным» с именем, написанным уже со строчной буквы. Это не ошибка и не правка задним числом — просто два разных Азуриэля существуют рядом, и никто не заметил столкновения. За такими швами обычно интереснее следить, чем за самими фактами.</p></div>", "r": []}];</script>
