<script>const BASE="";const DOCNAME="Бог, которого едят";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0160-S01", "MR-0160--ustroystvo"], "h": "<p>Механизм мира построен на образе бога, который даёт себя есть. Плоть бога — хлеб, кровь — вино, кости — творог (уподобление христианскому причастию). Бог болен; поедающие его заражаются, но не туберкулёзом — «болезнь бога другая». Определение бога, данное в переписке: «что такое бог? бог это создатель мира». Магия определена так: «это то, что влияет на реальность силой слов или действий».</p>\n<p>В христианстве бог = слово, слово = болезнь. У здоровых людей это слово-болезнь «не влияет ни на что», но «съедая бога и заражаясь, они уподобляються» — и через это уподобление получают способность влиять на реальность.</p>\n<p>Идею изложил Миколай на паре, предупредив «долго буду писать». Слава оценил её как «интересная пища для ума» и добавил: «можно что-нибудь придумать».</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0160-S02", "MR-0160--naselenie"], "h": "<p>О конкретном населении этого мира в переписке не сказано. Названы только собирательно «поедающие» бога — те, кто заражается его болезнью.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0160-S03", "MR-0160--mesto-vo-vselennoy"], "h": "<p>Материал относится к вселенной, объявленной 2025-09-25 (id 368605); имени в переписке ей не дали — в источнике плана она обозначена как безымянная / «Разрушаем вселенную».</p>\n<p>Идея выросла из спора об истоке магии в <a href=\"MR-0159.html\">Воскрешение погибших цивилизаций</a> «Воскрешение погибших цивилизаций»: Слава настоял, что «у всего должен быть исток», и на следующий день Миколай предложил механизм поедания бога как ответ на этот запрос. Позже, в окне w0106 (см. <a href=\"MR-0163.html\">Пожиратели богов</a> «Пожиратели богов»), Слава решает сделать эту идею «первоисточником возникновения всей этой мистической штуки» мира.</p>", "r": [["Воскрешение погибших цивилизаций", "MR-0159.html"], ["Пожиратели богов", "MR-0163.html"]]}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0160-S04", "MR-0160--kak-menyalsya-po-versiyam"], "h": "<h3>Версия 1 — 2025-09-26 (id 368900–368939)</h3>\n<p>Единственная зафиксированная версия: введён механизм бог-еда → болезнь бога → заражение поедающих → уподобление богу → способность влиять на реальность. Названия, под которыми идея упоминалась в переписке: «Бог, которого едят (болезнь бога = слово = магия)», «все дело в канибализме и боге», «пожирание богов», «пожиратели богов».</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0160-S05", "MR-0160--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Почему цивилизации, поедавшие бога, вымерли и какие у этой силы границы — Миколай прямо пишет «я хз».</li>\n<li>Вселенная, к которой относится идея, в переписке не названа.</li>\n<li>Кто именно ест бога (какая цивилизация, какой народ) — состав не назван.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0160--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0159.html\">Воскрешение погибших цивилизаций</a>, <a href=\"MR-0163.html\">Пожиратели богов</a></li>\n<li><strong>Упомянут в мирах:</strong> <a href=\"MR-0159.html\">Воскрешение погибших цивилизаций</a>, <a href=\"MR-0163.html\">Пожиратели богов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0160--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-09-26</td>\n<td>368900–368939</td>\n<td>w0105</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0160-bog-kotorogo-edyat.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0160--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0160.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
