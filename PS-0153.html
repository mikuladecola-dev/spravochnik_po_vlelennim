<script>const BASE="";const DOCNAME="Голубец";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0153-S01", "PS-0153--proishozhdenie"], "h": "<p>Появляется в истории, выложенной 2024-08-26 (id 224940, окно w0055). Первая же фраза сообщения вводит его как уже пойманного: «бро, мы походу голубец поймали». Кем и при каких обстоятельствах он пойман, в переписке не сказано — к моменту начала текста он уже находится у писателя и спасателя.</p>\n<p>Имени у него нет. В переписке он называется «голубец» и «парень» («телефон парню зарядим»). Откуда взялось слово «голубец», не пояснено; отдельно спасатель отмечает цвет его крови, но связывает ли текст одно с другим — не сказано.</p>\n<p>Повествование ведётся от лица писателя; реплики в кавычках принадлежат спасателю. Это разграничение Миколай пояснил отдельно уже после публикации текста: «в кавычках говорит твой спасатель» (224962), «без них мой писатель» (224963).</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0153-S02", "PS-0153--vneshnost"], "h": "<p>Выглядит как человек. Спасатель настаивает, что внешность обманывает: «это не человек, это монстр, пусть он и выглядит так».</p>\n<p>Единственная названная телесная особенность — кровь. Она синяя, спасатель называет вещество: «у тебя в кровь красная, у него синяя. ты хоть одного человека видел, в чьей крови течёт гемоцианин?». Писатель на это возражает: «это особенность природы, почему сразу монстр».</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0153-S03", "PS-0153--harakter"], "h": "<p>В сознании и адекватен — так его описывает писатель: «видно что в сознании и адекватен».</p>\n<p>Признаётся писателю в любви и сам же объясняет это стокгольмским синдромом: «я читал, что это Стокгольмский синдром». Писатель этого термина не знает и спрашивает, что это; получает в ответ «чел, тебя в гугле забанили?». Писатель хотел продолжить разговор («че такой душный, я так-то поговорить хотел»), но спасатель обрывает: «ну не в эфире же».</p>\n<p>Голубец что-то пишет — регулярно, изо дня в день. Ему для этого заряжают телефон: «телефон парню зарядим, посмотрим, что сегодня напишет». Что именно он пишет, в переписке не сказано.</p>\n<p>Голубец слышит и понимает происходящее вокруг: услышав при себе слова про эфир, он «теперь понял что мы в эфире». Никакой его реакции на это в тексте не описано.</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0153-S04", "PS-0153--sposobnosti"], "h": "<p>После удара о землю в отключке ломает стены — и делает это стабильно, а не однажды. Спасатель приводит это как довод: «ты же видел что он делает после удара о землю в отключке. каждый раз стены ломаются». Писатель довод не принимает: «да я и сам бы такое сделал, но это же не значит что я монстр».</p>\n<p>Отключается от дозы из иглы. Это тоже подано как признак монстра — спасатель колет самого писателя, тот не отключается, и получает объяснение: «был бы монстром, то тебя бы эта доза смогла бы отключить». Писатель объясняет разницу иначе: «боже, да просто у меня другая группа крови». Состав дозы не назван, она проходит по общему разряду веществ спасателя.</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0153-S05", "PS-0153--svyazi-s-drugimi"], "h": "<p><strong>Писатель.</strong> Держит голубца вместе со спасателем, разговаривает с ним, получает от него признание в любви. Считает его человеком и последовательно отвергает все доводы обратного. Не понимает, зачем всё это делается: «я не понимаю что тебе этот человек сделал и зачем такие странные эксперименты».</p>\n<p><strong>Спасатель.</strong> Настаивает, что голубец — монстр. Именно из-за спора о нём разворачивается объяснение того, что монстры — не ярлык, а домен живых существ: «ты сейчас видишь понятие монстр, как ярлык и его субъективное значение. но, на самом деле, в школе не преподают этого, монстры - один из доменов живых существ. в ряду с бактериями, археями или эукариотами. у каждого типа свои особенности, появления, поведения. в общем целая наука». К домену голубца внутри этой системы текст его не относит — тип не назван.</p>\n<p>Там же спасатель отвечает на вопрос, где у монстров главный: «нет у них никакого предводителя, их(существов) слишком много и нормально все живут вместе. их инстинкт говорит прятаться от людей, но от людей они сильно зависят, как и люди от них, они связаны ментальными сигналами, но обычно это никак не отражается». Про случаи вроде голубца сказано отдельно: «иногда их отклонения доходят до вмешательства в жизнь людей, тогда их судьбу обречена, общество их не примет. а они более социальные существа, даже не социум у них, а более сложное явление, которое я не понимаю». Свою осведомлённость спасатель объясняет так: «учиться надо, трогать мир. хотя я большинство монстров познал из-за из вмешательства в мою жизнь. эти твари мои враги и я их же использую для мести».</p>\n<p><strong>Киппер.</strong> Имя произносится один раз, писателем, в момент, когда он спохватывается, что при голубце сказано лишнее: «стоп. Киппер. ну ты же при нём это сказал». К кому обращение, в переписке не пояснено.</p>\n<p><strong>Монстр, натравленный на писателя раньше.</strong> Возникает из оговорки спасателя: «хочешь чтобы я снова на тебя монстра натравил? он то пожалел тебя, но если надоешь, такие большие иллюзии тебе покажет». Писатель цепляется за слово «снова», спасатель уходит от ответа, писатель повторяет вопрос дважды («че ты имел блин ввиду под 'снова'? эй, не игнорь!»). Ответ дан уже в обсуждении, вне текста истории: на вопрос Славы «А что значит снова» (224966) Миколай отвечает — «спасатель натравил тех кто иллюзию по телеку покажет» (224967).</p>\n<p><strong>Рыбомонстр.</strong> Упомянут в одном ряду с зарядкой телефона голубца как текущее занятие: «пойдём уже нарежем тушку рыбомонстра и телефон парню зарядим». Писатель отзывается про осетра: «ну осётр своего рода монстр, но он же из домена эукариотов».</p>", "r": []}, {"t": "Как менялся", "a": ["S06", "PS-0153-S06", "PS-0153--kak-menyalsya"], "h": "<p><strong>2024-08-26 (id 224940–224968, окно w0055).</strong> Единственная версия. В этот же день Слава задал по тексту два вопроса. На «Это он натравил карликов?» (224957) Миколай переспросил — «какие» (224968), то есть никаких карликов в тексте нет и вопрос остался без разбора. На замечание «И чё такая короткая» (224958) Миколай ответил, что писал без плана: «хез, я не знал уже о чем и как писал» и «всё забыл» (224959–224960).</p>\n<p>В том же окне Миколай выложил отдельный текст, написанный «позавчера» (224953–224954) — про разговор с другим человеком как про прохождение лабиринта в темноте с системой наград и наказаний. С голубцом этот текст никак не связан.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0153-S07", "PS-0153--chto-s-nim-stalo"], "h": "<p>Не сказано. На момент конца текста он всё ещё у писателя и спасателя, ему заряжают телефон. Продолжения истории в переписке нет.</p>\n<p>Отдельно обсуждалось, что делать с тем, что голубец узнал про эфир: «а вызывать амнезию не одно из наших веществ не умеет. че делать теперь». Спасатель отвечает: «да не ссы, есть пара народных методов». Писатель предполагает, что речь про кирпич по голове, и пробует возразить («ну не обязательно наверное, кирпичем по голове»), спасатель отмахивается: «ты че такой весь правильный, мы и так по локоть в меазмах». Писатель соглашается: «эх, делай». Сделано ли это и что именно — в переписке не сказано.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0153-S08", "PS-0153--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Осталось нерешённым, тот ли это «паренёк», что в 226088 занимается вычислениями.</li>\n<li>Имени нет, только прозвище «голубец»; происхождение прозвища не объяснено.</li>\n<li>Как и где его поймали — не сказано.</li>\n<li>К какому типу монстров он относится внутри домена — не сказано, хотя система типов в том же разговоре описана.</li>\n<li>Что он пишет в телефоне — не сказано, хотя ради этого ему заряжают телефон.</li>\n<li>Состав дозы, которая его отключает, не назван.</li>\n<li>Кто такой Киппер — не пояснено.</li>\n<li>Про карликов из вопроса Славы в тексте ничего нет.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["PS-0153--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-26</td>\n<td>224940–224968</td>\n<td>w0055</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0153-golubec.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0153--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0153.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
