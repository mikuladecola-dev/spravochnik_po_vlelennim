<script>const BASE="";const DOCNAME="Тёмная изнанка";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0168-S01", "MR-0168--ustroystvo"], "h": "<p>Тёмная изнанка названа в переписке одной фразой и дальше не разворачивается. Всё, что о ней сказано, — это то, что она существует и что её существование раскроется:</p>\n<div class=\"q\"><p>«Из-за них по итогу в современном мире раскроется существования тёмный изнанки но это будет в будущем в будущем»</p></div>\n<p>Отсюда следует три вещи, и только они:</p>\n<ol>\n<li>Тёмная изнанка на момент «современного мира» существует, но её существование не раскрыто — то есть она скрыта.</li>\n<li>Раскрытие произойдёт из-за апостолов.</li>\n<li>Раскрытие отнесено в будущее — в исходной формулировке «в будущем» сказано дважды подряд.</li>\n</ol>\n<p>Что тёмная изнанка собой представляет — отдельное пространство, скрытый слой обычного мира, изнанка в буквальном смысле, — в переписке не сказано. В навигации базы (окно w0112) она записана как «скрытая сторона мира Оэм», но в самих сообщениях этой формулировки нет: там есть только приведённая выше фраза.</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0168-S02", "MR-0168--naselenie"], "h": "<p>Кто населяет тёмную изнанку — в переписке не сказано. Ни одна раса, организация или отдельный персонаж к ней не привязаны.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0168-S03", "MR-0168--mesto-vo-vselennoy"], "h": "<p>Тёмная изнанка упоминается внутри одного большого перечня сил вселенной — списка рас и организаций, которые Слава перечисляет подряд (2025-11-17, id 385768–385769; повторно 2025-12-06, id 393286–393290). Сама она в этом перечне не строка, а следствие: она названа в абзаце про апостолов.</p>\n<p>Апостолы в этом перечне описаны так: «Апостолы 21 вторая по силе раса на земле (опять раса, в мире есть просто индивиды который могут быть сильными). Апостолы очень часто устраивают без порядок разрушая укорененый баланс между всеми». Раскрытие тёмной изнанки поставлено как итог этой их деятельности — «Из-за них по итогу».</p>\n<p>Место действия, где произойдёт раскрытие, названо «современный мир». Во второй раз этот же перечень идёт в разговоре про Оэм, который Слава заканчивает словами: «В нашем мире Оэм уже существует много сторон для конфликта» (2025-12-06, id 393290). Как соотносятся Оам и Оэм и в котором из них лежит тёмная изнанка — в переписке не разобрано.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0168-S04", "MR-0168--kak-menyalsya-po-versiyam"], "h": "<p><strong>2025-11-17 (id 385768–385769, окно w0109).</strong> Тёмная изнанка названа впервые, внутри перечня сил вселенной, одной фразой. Дальше не разворачивается.</p>\n<p><strong>2025-12-06 (id 393286–393290, окно w0112).</strong> Тот же перечень повторяется дословно, включая ту же фразу про тёмную изнанку. Новых сведений о ней во второй раз не добавлено. Изменение только в обрамлении: перед перечнем идёт «Давай вспомним», после — «В нашем мире Оэм уже существует много сторон для конфликта».</p>\n<p>То есть за две версии содержание не менялось — второе появление это повторное проговаривание уже сказанного.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0168-S05", "MR-0168--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Что такое тёмная изнанка — не объяснено ни в одной из двух версий.</li>\n<li>Как она устроена, есть ли у неё география, границы, вход — не сказано.</li>\n<li>Кто в ней живёт — не сказано.</li>\n<li>Каким образом апостолы приводят к её раскрытию — не сказано.</li>\n<li>Что произойдёт после раскрытия и для кого это последствия — не сказано.</li>\n<li>Когда именно наступает «будущее в будущем» — не определено.</li>\n<li>Была ли тёмная изнанка известна кому-то до раскрытия — не сказано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0168--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в мирах:</strong> <a href=\"MR-0170.html\">Группировка сестры</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0008.html\">Оам</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0168--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-11-17</td>\n<td>385768–385769</td>\n<td>w0109</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-06</td>\n<td>393286–393290</td>\n<td>w0112</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0168-temnaya-iznanka.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0168--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0168.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
