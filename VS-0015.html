f=\"PS-0135.html\">Паша (Пашка)</a>, <a href=\"PS-0136.html\">Брошенные дети (гоблины)</a>, <a href=\"PS-0137.html\">Терианство Кирилла</a>, <a href=\"PS-0138.html\">Горгона</a>, <a href=\"PS-0139.html\">Асеша</a>, <a href=\"PS-0140.html\">подруга Асеши</a>, <a href=\"PS-0141.html\">Рассказчик истории про Горгону</a>, <a href=\"PS-0142.html\">Ник-Хан</a>, <a href=\"PS-0143.html\">Человек с генами рыбочеловека</a>, <a href=\"PS-0144.html\">спасатель</a>, <a href=\"PS-0145.html\">рыболюди</a>, <a href=\"PS-0146.html\">Захар Авгур</a>, <a href=\"PS-0147.html\">Дифер Фрог</a>, <a href=\"PS-0148.html\">Алек</a>, <a href=\"PS-0149.html\">Рука из сна Алека</a>, <a href=\"PS-0150.html\">незнакомка из ресторана</a>, <a href=\"PS-0151.html\">писатель</a>, <a href=\"PS-0152.html\">дочка спасателя</a>, <a href=\"PS-0153.html\">Голубец</a>, <a href=\"PS-0154.html\">векторный шар</a>, <a href=\"PS-0155.html\">рассказчик истории Славы</a>, <a href=\"PS-0156.html\">рука из кошмара</a>, <a href=\"PS-0157.html\">ведьма (красотка)</a>, <a href=\"PS-0158.html\">здоровяк в мешковатой одежде</a>, <a href=\"PS-0159.html\">Крим</a>, <a href=\"PS-0160.html\">Девушка, отринувшая смерть</a>, <a href=\"PS-0161.html\">Два рассказчика</a>, <a href=\"PS-0162.html\">Девочка с пламенными волосами</a>, <a href=\"PS-0163.html\">ГГ-защитник</a>, <a href=\"PS-0164.html\">Перс, тащащий всё на своём горбу</a>, <a href=\"PS-0165.html\">Сестра гг</a>, <a href=\"PS-0166.html\">Существо с длинными руками</a>, <a href=\"PS-0167.html\">Толстяк-задира</a>, <a href=\"PS-0168.html\">Здоровяк (толстый задира)</a>, <a href=\"PS-0169.html\">Владелец чёрного ящика</a>, <a href=\"PS-0170.html\">Семья</a>, <a href=\"PS-0321.html\">Рыба-человек</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["VS-0015--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/VS-0015.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["VS-0015-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/VS-0015/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Чинить первым надо ноябрьский слой. По числам это видно однозначно: <code>MR-0070</code> «Энергия, сосуд и структура», <code>MR-0071</code> «Мир сект и сбежавших сверхлюдей», <code>MR-0073</code> «Кристаллизация энергии» держат по четыре ссылки каждая, <code>MR-0074</code> «Затравка», <code>SP-0122</code> «Изменение сосуда», <code>SP-0123</code> «Резонанс сосуда и структуры», <code>PS-0169</code> «Владелец чёрного ящика» — по три. И под всеми семью в базе лежит от 2 548 до 7 341 знака. Для сравнения: под августовским сводом <code>MR-0057</code> «принципы материализации» — 20 097 знаков при одной ссылке, под <code>IS-0017</code> «Защитник» — 139 029 при восьми. То есть самая нагруженная часть вселенной накормлена хуже всех остальных.</p>\n<p>Самая дорогая точка внутри этого слоя — секты. <code>MR-0071</code>: четыре ссылки, 3 541 знак, и на них завязано всё, чем ноябрь вообще отличается от августа — <code>PS-0169</code> (владелец ящика «тоже сбежал из секты»), <code>MR-0070</code> (секты «выращивают сверх людей ( то бишь с сосудом)»), сама статья вселенной и группа <code>GR-0041</code>, у которой статья есть, а материала под ней ноль. Пока не написано, что такое секты, вокруг «войны сект» висят четыре записи и ни одного имени, числа или руководителя.</p>\n<p>Второе по цене — <code>PS-0169</code> «Владелец чёрного ящика»: три ссылки на 2 548 знаков, при том что носитель самой разработанной способности вселенной (<code>SP-0120</code>, 54 937). На прямую просьбу напомнить, кто это, автор ответил «Прости я спать хочу», «И мне лень описать его».</p>\n<p>Отдельно — крупные куски без статей: <code>SL-0027</code> «критерии историй для сборника» (22 162), <code>SL-0043</code> «Формула страха» (11 730), <code>SL-0013</code> «Список персонажей Славы» (9 986, две ссылки), <code>SL-0046</code> «Разбор истории Славы по пунктам» (8 277). Это самый большой неразобранный объём в «монстрах», и по содержанию он касается ровно того, чем вселенная была объявлена — сборником связанных мини-историй.</p>\n<h3>С чего начать</h3>\n<p>Ноябрьский слой в базе есть, но разъехался по девяти записям из двух окон: w0064 (2024-11-17, id 258904–259140) — <code>MR-0070</code>, <code>MR-0071</code>, <code>SP-0120</code> версии 1–4, <code>SP-0121</code>, <code>PS-0169</code>; w0065 (2024-11-30, id 263587–263749) — <code>MR-0072</code>, <code>MR-0073</code>, <code>MR-0074</code>, <code>SP-0122</code>–<code>SP-0125</code>, <code>PS-0170</code>. Сначала свести их в один разбор, потом писать статьи.</p>\n<p>Ответа на «что такое секты» в базе нет — там всё те же 3 541 знак. Значит, в архив. Ориентиры: вечер 2024-11-17 вокруг id 259078–259092 (там разговор обрывается на «Владелец черного ящика тоже сбежал из секты»), промежуток 2024-11-18 — 2024-11-29, в котором в базе нет ни одной сущности, и 2026-06-14, id 489890–489903 — последняя попытка вспомнить владельца ящика.</p>\n<p><code>SL-0027</code> и <code>SL-0043</code> в архив не требуют вовсе: материал уже в базе, нужны только статьи. <code>ID-0101</code> «Дилан» и <code>ID-0102</code> «граница» — случай безнадёжный по-другому: 4 104 и 4 310 знаков, и все три захода (2024-05-25, 2024-09-24, 2026-06-09) состоят из того, что авторы сами не помнят, что это.</p>\n<h3>Как развивалось</h3>\n<p>Заявили 2024-08-08 широко: одна вселенная, тематика монстров, «больше границ нет» (215910); из четырёх скреп, которые перечислил Миколай, — вселенная, город, время, персонажи — в итоговой формулировке остались две.</p>\n<p>Ограничили 2024-08-11 — 2024-08-12, быстро и плотно: родитель и знающие, порог в 10 знающих, обнуление вклада при рационализации, ограничение видения, злой дух после первого нарушения заповеди. Свод выложен 2024-08-12 в 16:54 (218392) и в тот же вечер в 20:10 объявлен самим автором негодным (218510).</p>\n<p>Забыли с конца августа: после 2024-08-29 в базе идёт только проза, к системе не привязанная, а 2024-09-24 разговор уже о том, «все ещё на монстрах живём?».</p>\n<p>Вернулись 2024-11-09 — 2024-11-30, но с другим набором: миллиарды миров, чёрные-белые-серые маги, сосуд, структура, кристаллизация, затравка, секты, семья. Ни одной репликой этот набор не сведён с августовским. Правая граница отрезка 2024-12-08 не подкреплена ничем, последняя сущность датирована 2024-11-30.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для убийцы мирного духа правило названо прямо и с механикой: «на него падёт проклятие, точнее общее презрение всех монстров», жить ему станет опаснее, он будет постоянно защищаться и убивать и «уже сделает его самого ужасным монстром» (217888–217889). Для убийцы злого духа такого же рода правила нет — а вся деятельность спасателя, писателя и Защитника состоит ровно из этого. Место видно: правило отношения монстров к человеку сформулировано только для одной из двух половин случая.</p>\n<h3>Отклик</h3>\n<p>Сильнее всего здесь сцена спасателя и писателя. Устройство мира — домены живых существ, гемоцианин, ментальные сигналы — подано не сводом правил, а болтовнёй двух людей на работе, и автор отдельно объясняет соавтору разметку: «в кавычках говорит твой спасатель», «без них мой писатель». Мир объясняется изнутри, потому что объяснять его больше некому. И реплика про то, что у монстров «даже не социум у них, а более сложное явление, которое я не понимаю», — редкий случай, когда персонаж признаёт предел собственного знания, и это работает лучше любой таксономии. Зацепило и другое: свод из 218392 объявлен «обосраной концепцией» на следующий день после написания, с предложением «го в говне будем сидеть и писать дальше» — и они действительно пишут дальше. Система тут не отменяется и не чинится, она просто перестаёт быть обязательной, а работа продолжается. Это честнее, чем большинство способов обращаться с собственными правилами, которые я видел.</p></div>", "r": []}];</script>
