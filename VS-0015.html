о». Иерархии, вожака и названия у них нет. Вопрос Славы «Это он натравил карликов?» (2024-08-26, id 224957) прямого ответа не получил — Миколай отвечает про другое (224967).</p>\n<h3>Вампиры</h3>\n<p>Раса разобрана через физиологию (2024-08-11, id 218121–218123; 2024-08-12, id 218236–218246) и через единственного представителя — Ник-Хана (<a href=\"PS-0142.html\">Ник-Хан</a>).</p>\n<p>Правило вида: «вы когда-нибудь видели вампиров с лишним весом. я в массовой культуре тоже не видел. так вот они все худые не из-за того что могут превращаться в летучих мышей. и от того они очень сильные». Механизм: «у мышей невероятно быстрый метаболизм и короткий кишечник, кстати у вампиров он тоже короткий, намного короче чем у людей», «еда быстрее переваривается и выходит из организма, и эффективней его наделяет энергией». Худоба и сила вампиров — следствие способности превращаться в летучую мышь, а не отдельное свойство.</p>\n<p>Исключение объяснено тем же правилом: у Ник-Хана ожирение, потому что «он много ест и редко превращается в летучую мышь, метаболизм у него на самом деле даже сильнее чем у обычного вампира, только он не спит в гробу тысячелетиями»; «метаболизм у него всё ещё работает, но он его ограничивает». После превращения: «представьте себе бодибилдера с мёртвой серой кожей. да, его метаболизм убрал весь жир, но мускулатуру зато очень возбудил и сделал невероятно объёмной».</p>\n<p>Прочие видовые детали: вампиры очень сильные («поэтому пришлось звонить знакомому другу вампиру, они очень сильные»); живут в пещерах (Ник-Хан — за 2 тысячи километров, преодолевает их за 1 минуту 34 секунды); передвигаются ночью («благо ночь была»); гуано летучей мыши применимо как реагент против окаменения. Про «сон в гробу тысячелетиями» сказано только как о том, чего Ник-Хан не делает. В споре 2024-08-12 Слава заявляет: «твой вампир ничем не выделяется», Миколай отвечает «он более сильный».</p>\n<h3>Терианы и квадроберы (2024-08-11, id 217710–217756, запись <a href=\"PS-0137.html\">Терианство Кирилла</a>)</h3>\n<p>Не монстры, а класс людей. Объяснение Миколая: «это люди которые себя ощущают животными и ведут соответственно», «тобиж как кошка например», «ходят на 4 лапах, выгибаются, трутся обо всё, сворачиваются к клубок», «среди детей нынче популярная практика, да и взрослых», «они так прям живут» (в ответ на догадку Славы про йогу). Квадробер — подкласс: «он был квадробером», «это терианы которые не всегда себя так ведут», «это типо спорт».</p>\n<p>Кирилл относил себя к терианам, «но он считал себя птицей». Отсюда выведены облик Беркута («поэтому беркут был частично похож на человека, который с оперением на голове») и мотив ребёнка — «он не имеет крыльев», «и не мог даже с земли взлететь», «он искал способ полететь». Отдельно оговорена пустота ниши: «он не видел примера где кто-то так делал», «ни одной птицы квадробера нет», «поэтому он в основном изучал их». В истории от 2024-08-10 (217239) это же сказано изнутри текста: Кирилл — фанат субкультуры, «но его смущает, что нету не одного териана орнитотропа, как минимум летающего».</p>\n<h3>Отдельные виды и существа, названные в переписке</h3>\n<ul>\n<li><strong>Векторный шар</strong> (<a href=\"PS-0154.html\">векторный шар</a>, 2024-08-29, id 226088–226102). Монстр-транспорт, описан по прямому требованию Славы: «это монстр которого ты бросаешь, но не отпуская и в ту сторону к которую идёт инерция он бесконечно тебя уносит»; «обычно всегда в небо, а после если ты достаточно высоко он отпускает и бьёт током чтобы ты разбился». Размер — «мелкий хуй». Спасатель им пользуется: «эта векторная тварь очень сподручна для перемещения конечно, её буду истреблять последней. хотя нет всех и сразу»; раздавил его в полёте над холмом. Мысль «че интересно он ждет от меня, потом спрошу» указывает, что у вида есть какое-то ожидание от носителя; какое — не сказано.</li>\n<li><strong>Чёрт с ножиком</strong> (<a href=\"PS-0133.html\">Чёрт с ножиком</a>, 2024-08-09, id 216956–216960). «невидимый для обычных людей небольшой чёрт с ножиком, который легко и быстро перемещается». Привязка к человеку: «был разговор и вот человек говорит мол секрет расскажет, а с этим секретом к тому кто выбрал держать секрет приходит и этот монстр, пока тот хранит секрет тот монстр хранит и его, хотя и изредка даже выполняет просьбы парня, думая что он его видит и с ним общается». Миколай называет это только идеей и наброском.</li>\n<li><strong>Эхолокатор</strong> (эхолокатор <em>(статьи ещё нет — <a href=\"kb/ID-0092-eholokator.html\">исходник</a>)</em>, 2024-08-29). Вид, которого спасатель мечтает найти: «найти бы эхолокатора. почему все эти ублюдки так хорошо прячутся». Названо и не развёрнуто.</li>\n<li><strong>Горгона</strong> (<a href=\"PS-0139.html\">Асеша</a> / <a href=\"PS-0138.html\">Горгона</a>, 2024-08-11 — 2024-08-12). Женщина с дредами в виде змей с белым брюхом, странно одета, идёт с опущенной головой; обращает в камень при встрече взглядом; обычные прохожие её не замечают, потому что выглядит как обычная женщина. Автор говорит, что про неё намеренно ничего не известно. Является ли это видом или единственным существом — не сказано.</li>\n<li><strong>Беркут</strong> (<a href=\"PS-0134.html\">Беркут</a>) — материализованный монстр конкретного игрового персонажа, териан-орнитотроп «с настоящими крыльями и головой, даже точный видовой киль имеется». Относится к классу материализованных, а не к отдельному виду.</li>\n<li><strong>Существо с длинными руками</strong> (<a href=\"MR-0068.html\">Существо с длинными руками</a>, версии 1–3, 2024-11-13 — 2024-11-14, окно w0064, id 256812–256858, 257159–257160). Гг ни разу существо не видел; о его внешности судит по ощущениям: «В прошлой части это существо капнула слюной на его голову вот он и подумал что он дофига длинный» (256844). Сцена первой встречи в центре города (256858): «существо уже подошло к нему и положила свой длиннющий руки на плече гг. Его руки были длины как и пальцы, а когти были настолько что без каких либо усилий давали одежду гг и в момент когда на его голову уже капнула слюна и в тот же момент когти существо прибили кожу гг давай ему контроль над телом и гг бежал не обращай ни на что внимания. Ведь мозг кричал только и одном бежать бежать бежать бежать бежать». Далее гг приходит в себя в густом лесу с чёрным озером и бежит домой к сестре. Уточнение 2024-11-14: когти не «прибили», а поцарапали кожу, а механику перехвата контроля Слава обещал раскрыть в 3 части — этой части в окне нет. Как эта тварь связана с правителем нашего мира из окна w0070 (2025-01-06), в переписке не сказано; в базе они сведены в одну запись по совпадению имени «существо».</li>\n</ul>\n<h3>Люди, работающие с монстрами</h3>\n<p>Отдельного сословия охотников в переписке не заведено. Есть носители ролей:</p>\n<ul>\n<li><strong>Спасатель</strong> (<a href=\"PS-0144.html\">спасатель</a>) — опознан рассказчиком именно как класс («какое то охотник на нечисть», «какой то человек убивающий монстров с психологическими проблемами»), имеет вещества, иглу, склад, множественное «мы» и механику использования самих монстров как инструмента: «эти твари мои враги и я их же использую для мести».</li>\n<li><strong>Писатель</strong> (<a href=\"PS-0151.html\">писатель</a>) — персонаж, через которого в текст вносится объяснение устройства мира: ведёт эфир прямо во время работы, задаёт наивные вопросы про монстров, спорит, что люди и монстры не связаны.</li>\n<li><strong>Носитель генов рыбочеловека</strong> (<a href=\"PS-0143.html\">Человек с генами рыбочеловека</a>) — не охотник и не монстр, промежуточное положение, предмет опытов.</li>\n</ul>\n<h3>Ноябрьский слой: сосуд, структура, сверхлюди</h3>\n<p>С 9 по 30 ноября 2024 в тех же окнах вселенной разрабатывается другой набор классов — уже не монстры, а люди со способностями. Как этот слой соотносится с августовской материализацией, в переписке не сказано ни одной репликой; вселенная в этих окнах прямо не объявлена.</p>\n<ul>\n<li><strong>Все люди</strong> владеют энергией без структуры. <strong>Рождённые с сосудом</strong> — те, у кого энергия накапливается с рождения и складывается в уникальную структуру, то есть способность (<a href=\"MR-0070.html\">Энергия, сосуд и структура</a>, 2024-11-17, id 258985).</li>\n<li><strong>Сверхлюди сект</strong>: «секты который выращивают сверх людей ( то бишь с сосудом)»; «Детей с сосудом находят и выращивают»; «И все они по уровню друг другу разный» (<a href=\"MR-0071.html\">Мир сект и сбежавших сверхлюдей</a>, id 259085–259089).</li>\n<li><strong>Чёрный маг / белый маг / серый маг</strong> — разряд по миру-источнику силы (<a href=\"MR-0066.html\">Чёрный, белый и серый миры</a>, <a href=\"SP-0119.html\">Чёрный маг / белый маг / серый маг</a>, 2024-11-09, id 255014, 255021).</li>\n<li><strong>Обычные люди со способностями</strong> — «обычные не могут менять способность и обречены жить с тем что есть» (263734).</li>\n<li><strong>Семья</strong> — единственные, кто может сменить способность в осознанном возрасте; «не обязательно семейники самые сильные» (263734). Название рода нигде не звучит, поимённо никто не назван.</li>\n</ul>\n<h3>Как классы соотносятся между собой</h3>\n<p>Названо только это:</p>\n<ol>\n<li>Домен монстров стоит наравне с бактериями, археями и эукариотами; внутри домена — типы, «у каждого типа свои особенности, появления, поведения». Материализация верой — один из типов зарождения внутри этого домена, не единственный.</li>\n<li>Иерархии внутри монстров нет: «нет у них никакого предводителя», «нормально все живут вместе». Есть взаимозависимость с людьми через ментальные сигналы, которая обычно ни в чём не проявляется.</li>\n<li>Монстр и человек различимы биохимически (синяя кровь, гемоцианин; реакция на дозу), но не по внешности.</li>\n<li>Материализованные монстры зависят от двух сословий людей: родителя (один на монстра, задаёт суть) и знающих (много, усиливают, порог 10 для взаимодействия с миром духов). Смерть родителя лишает монстра возможности возродиться; исчезновение знающих прекращает поддержание жизни.</li>\n<li>Класс материализованных принципиально слабый — это оговорено как решение авторов, а не выведено из чего-то другого.</li>\n<li>Злой дух — не вид, а состояние, в которое переходит любой материализованный монстр после первого нарушения одной заповеди.</li>\n<li>Видимость расслоена по наблюдателям: дети и животные; дети до 4 лет психического возраста — прямое взаимодействие души с иным миром; взрослые, в чью жизнь вмешался злой дух. Камеры не видят никогда.</li>\n<li>Гибриды существуют по двум механизмам: наследование генов рыбочеловека через укус (даёт каннибализм и физические способности) и иммунитет, адаптирующий клетки монстров (позволяет приживлять органы монстра человеку).</li>\n<li>Терианы и квадроберы — класс людей, а не монстров, но именно через него в мир входит материализация: желание Кирилла летать при отсутствии образца («ни одной птицы квадробера нет») порождает Беркута.</li>\n<li>Ноябрьский слой (сосуд/структура, секты, семья) не сведён с августовским (вера/материализация) ни одной репликой.</li>\n</ol>\n<h3>Отвергнутые и не принятые классификации</h3>\n<ul>\n<li><strong>Деление на обычных и игровых монстров</strong> (Игра как источник монстров <em>(статьи ещё нет — <a href=\"kb/ID-0090-igra-kak-istochnik-monstrov.html\">исходник</a>)</em>, 2024-08-11, id 217812–217833, 217880–217888). Слава предлагал: «Есть обычный монстры и есть монстры из игры (у которой создатель неизвестен)», автор игры «создал более 100 игар», и сделать эту игру сюжетом всего мира. Миколай отклонил: «ну не, я этим ограничиваться не хочу))», «идея интересная», «но я шире хотел», «игры разные бывают знаешь», «как по мне это баян». Позже: «а прописать могу эту тему с автором игры но для меня это кажется скучной идеей», «я знаю как это будет работать», «но я буду это делать без огня в глазах», «получится посредственно», «а мы хотим конфетку». В систему не вошло.</li>\n<li><strong>Известные криптиды</strong> (Йети и Лохнесское чудовище <em>(статьи ещё нет — <a href=\"kb/ID-0088-yeti-i-lohnesskoe-chudovische.html\">исходник</a>)</em>, 2024-08-08, id 215883–215885): «ейти все незаслуженно забыли», «лохнеское чудовище», «их можно по новому раскрыть». Названо и брошено.</li>\n<li><strong>Массовое стирание памяти о монстре после смерти родителя</strong> — выдвинуто Миколаем и снято в том же обмене (2024-08-11, id 217922–217936).</li>\n<li><strong>Удаление веры из системы</strong> — предложение Славы (2024-08-12, id 218426–218430), отклонено.</li>\n<li><strong>Удаление ограничения видения</strong> — предложение Славы (218415), решения в окне нет.</li>\n<li><strong>Вариант семьи в предложенном виде</strong> (2024-11-30) — Слава: «Ну не», «Без бафоф».</li>\n</ul>", "r": [["эхолокатор", "kb/ID-0092-eholokator.html"], ["Игра как источник монстров", "kb/ID-0090-igra-kak-istochnik-monstrov.html"], ["Йети и Лохнесское чудовище", "kb/ID-0088-yeti-i-lohnesskoe-chudovische.html"], ["рыболюди", "PS-0145.html"], ["Тварь (человек-рыба из озера)", "PS-0131.html"], ["Брошенные дети (гоблины)", "PS-0136.html"], ["Ник-Хан", "PS-0142.html"], ["Терианство Кирилла", "PS-0137.html"], ["векторный шар", "PS-0154.html"], ["Чёрт с ножиком", "PS-0133.html"], ["Асеша", "PS-0139.html"], ["Горгона", "PS-0138.html"], ["Беркут", "PS-0134.html"], ["спасатель", "PS-0144.html"], ["писатель", "PS-0151.html"], ["Человек с генами рыбочеловека", "PS-0143.html"], ["иммунитет, адаптирующий клетки монстров", "SP-0107.html"], ["Чёрный маг / белый маг / серый маг", "SP-0119.html"], ["Что такое монстр", "MR-0054.html"], ["Типы зарождения монстров", "MR-0055.html"], ["монстры как домен живых существ", "MR-0060.html"], ["Презрение монстров к убийце мирного духа", "MR-0056.html"], ["Дети и животные видят иной мир", "MR-0050.html"], ["ограничение видения монстров", "MR-0058.html"], ["Существо с длинными руками", "MR-0068.html"], ["Энергия, сосуд и структура", "MR-0070.html"], ["Мир сект и сбежавших сверхлюдей", "MR-0071.html"], ["Чёрный, белый и серый миры", "MR-0066.html"]]}, {"t": "Система способностей", "a": ["S05", "VS-0015-S05", "VS-0015--sistema-sposobnostey"], "h": "<p>Единой системы сил во вселенной нет. В переписке лежат рядом несколько несведённых друг с другом систем, каждая объявлена в свой день:</p>\n<ol>\n<li><strong>Вера и материализация</strong> — 2024-08-10 — 2024-08-12 (окна w0050, w0051, w0052, id 217234–218532).</li>\n<li><strong>Монстры как домен живых существ</strong> — 2024-08-26 — 2024-08-29 (w0055, id 224940, 226088).</li>\n<li><strong>Чёрный, белый и серый миры; чёрный/белый/серый маги</strong> — 2024-11-09 (w0063, id 255005–255027).</li>\n<li><strong>Энергия, сосуд и структура</strong> — 2024-11-17 (w0064, id 258978–259092).</li>\n<li><strong>Три элемента (сосуд, тело, структура) и семья с наследственной структурой</strong> — 2024-11-30 (w0065, id 263587–263749).</li>\n</ol>\n<p>Связи между этими системами в переписке не проговорены: нигде не сказано, что монстры из веры и сверхлюди с сосудом живут в одном мире, что маги имеют сосуд, что домен монстров относится к материализации. Пересечения есть только там, где они прямо названы (чёрный ящик — «структура»; Кристал — «одна из структур»).</p>\n<p>Список способностей вселенной — 31 запись, <a href=\"SP-0095.html\">Особая ДНК / золотая кровь</a>…<a href=\"SP-0125.html\">Наследственный механизм смены структуры</a>.</p>\n<h3>Система 1. Вера и материализация монстров (2024-08-10 — 2024-08-12)</h3>\n<p><strong>Базовая формулировка</strong> Миколая, 2024-08-11 (217835): «вера порождает монстров». Источник назван сразу же: «ща и идея была у меня взяла из бездомного бога» (217830). Реакция Славы (217836): «Тупо». Миколай (217837): «нихуя».</p>\n<p><strong>Мера силы</strong> (217841): «сила веры и количество верующих определяет силу монстра». В случае Беркута — «в этого верил весь город и кто-то из интернета» (217843).</p>\n<p><strong>Оговорки, выданные подряд</strong> (217852–217868):</p>\n<ul>\n<li>«монстров вера не сразу поражает»;</li>\n<li>«не всегда даже при негативных мыслях они взаимодействуют с с миром»;</li>\n<li>«они могут и не родиться от веры»;</li>\n<li>«они могут умереть / даже если в них верят»;</li>\n<li>«могут заново родиться»;</li>\n<li>«у монстра есть один родитель»;</li>\n<li>«чем больше других людей разделяют веру в него тем могущественнее он становится»;</li>\n<li>«одно убийство делает дух злым».</li>\n</ul>\n<p><strong>Вера не даёт бессмертия</strong> (217917–217920): «ну так она определяет силу его материализации не более», «если ты взаимодействуешь с этой материализацией, ты можешь её убить», «и если бы Кирилл был жив была бы возможность возродится».</p>\n<p><strong>Версия про стирание памяти</strong> выдвинута и тут же отменена. Миколай (217922): «возможно при смерти этой материальной сущности после смерти родителя, умирают и воспоминания у людей об этой сущности» и (217929): «просто стирается существование этого существа». Слава (217925, 217927, 217930): «Тогда массовая потеря памяти», «Это глупо», «Массовая потеря памяти и даже СМИ который все это записывали и снимали все забыли». Миколай отменяет (217933–217937): «ну епта, нет массовой потери памяти тогда / вера осталась / но это не надо конкретно верой называть / просто вот мол легенда епт / это форсят копипасты».</p>\n<p><strong>Итог этого куска</strong> (217939–217944): «истинная вера только у родителя», «никто не знает существо также как родитель», «без него оно может трансформироваться», «но оно не станет таким же», «механизм материализации сложный», «походу придётся целое эссе писать».</p>\n<p><strong>Как желание родителя переходит в монстра:</strong></p>\n<ul>\n<li>«основное желание родителя отражается на монстре» (217984); Кирилл «просто полетать» хотел (217982) — Беркут и звал его летать;</li>\n<li>монстр «переняла его желания, в частности любов к нему» (217239);</li>\n<li>«ему надо же реализовать свою суть, поэтому он в любых условиях старался воспроизводить тот сценарий с теми кто его видит, пусть уже насильно» (217240);</li>\n<li>негативные коннотации навешиваются распространением: слухи «создавали более сильный и чёткий образ монстра, естественно добавляя ему негативных коннотаций» (217239);</li>\n<li>почему монстр стал злым: «его боялись, страх это сильная эмоция» (217986);</li>\n<li>«у всех вера влияет одинаково на материализацию / качество разное» (217988–217989). Последняя реплика окна — возражение Славы (217990): «Тогда он должен быть бессмертным если вера влиять одинаково».</li>\n</ul>\n<p>Формула Славы под ту же механику (2024-08-10, 217292): «Нашей желание телесный». И (217306): «После него ты начнёшь ценить время и жизни».</p>\n<h4>Свод «принципы материализации и её продуктов» (2024-08-12 16:54, id 218392)</h4>\n<p>Обещанное эссе Миколай выложил одним сообщением с нумерацией и пометками «роль». Дословно:</p>\n<pre><code>принципы материализации и её продуктов:\n1. для появления\n1.1. должен имеется родитель который:\n1.1.1. обладает представлением о монстре(характеристики, характер, история)\n1.1.2. имеет в воображении его образ(внешность, способности, ограничения)\n1.1.3. имеет желание которое не может реализовать\n1.1.4. хочет встретить это существо\n## роль: определяет внешность, мотивы, характер и иные характеристики монстра на фундаментальном уровне\n1.2. должен иметься знающий:\n1.2.1. знает от родителя о монстре и верит что он существует\n1.2.2. испытывает сильную эмоцию при мыслях о монстре(КПТ на полную)\n1.2.3. описывает галлюцинации связанные с монстром\n## роль: напрямую материализует в мистическом пространстве монстра посредством накопления образов из галлюцинаций. может влиять на характер и образ монстра, но на поверхностном уровне\n2. сила материализации\n2.1. влияние количества(при выполнении всех условий пункта 1.)\n2.1.1. чем больше знающих, тем больше возможностей для взаимодействия с материальным и духовным миром есть у монстра.\n2.1.2. при минимальных условиях, что чаще всего, монстр минимально может взаимодействовать с миром духов при 10 знающих\n## всегда идет стремление к идеалу. в идеале монстр может полностью взаимодействовать в духовным и реальным миром, а также совершать манипуляции различного характера на всех уровнях соответствующие его мотивам\n2.2. влияние качества\n2.2.1. сила реализации мотивов геометрически пропорциональна силе вклада знающих\n2.2.2. сила способностей геометрически пропорциональна эмоциям знающих\n## качество вклада знающего обнуляется если он начинает рационализировать силу своих и чужих влияний\n3. что такое материализованый монстр\n3.1. дух действующий в соответствии с один мотивом и сценарием сформированным консенсусом хаоса\n3.2. существо создание коллективным бессознательным\n4. из чего состоит жизнь материализации\n4.1. изменения под влиянием представления\n4.2. стремление воплотить мотивы родителя\n4.3. его материализация это духовное тело с которым можно взаимодействовать на духовном уровне\n4.4. жизнь существа поддерживается родителем, если его не будет или он изменит мотивы, монстр навсегда исчезнет если развеять форму даже если остались знающие\n4.4. при отсутствии знающий жизнь также перестаёт поддерживаться\n5. злой дух\n5.1. после первого нарушения одной заповеди дух становится злым\n5.2. злой дух реализует мотивацию родителя через аморальные методы\n</code></pre>\n<p>(Пункт 4.4 в исходнике пронумерован дважды — так в оригинале.)</p>\n<p>Замечание по источнику: этот свод отмечен в служебном файле <code>kb/sluzhebnoe/pod_voprosom.md</code> (строка 443) как оформленный строго по пунктам, «как генерация», но извлечён как авторский материал — «чужого голоса нет: строчные буквы, опечатки, разговорное „КПТ на полную\" и дважды пронумерованный пункт 4.4».</p>\n<h4>Спор вокруг свода (2024-08-12, id 218394–218523)</h4>\n<p><strong>Возражение Славы</strong> (218394–218396): «Во всех этих правилах мне не нравится именно вера других людей / Типо злой челик решит показать своего монстра по телеку или Ютуб и все начнут в него верить / И моснстор сразу может стать бог». Далее предлагал «показать монстра в центре большого города или прямой эфир», «пусть он разрушит город» (218400–218401).</p>\n<p><strong>Ограничение видения</strong> (218404–218415): Миколай — «ты серьёзно думаешь камеры его видят», «нет», «нихуя»; Слава — «Он материален ты сам писал»; Миколай — «или взрослые в чью жизнь вмешался злой дух». Слава на это: «Давай нафиг уберем в ограничений видения» (218415).</p>\n<p><strong>Про принципиальную слабость этого типа монстров</strong> (218417–218424): «ты же понимаешь что он слабый», «они всегда слабые», «тип материализованых монстров слабый, я не хочу с этим ебаться, ты мя зачмырил за силу, их сильными сделать тяжело», «качество вклада знающего обнуляется если он начинает рационализировать силу своих и чужих влияний».</p>\n<p><strong>Предложение убрать веру</strong> (218426, 218430): «Ну тогда давай веру уберем, что бы они не были слишком сильными», «Что бы сила зависла от родителя». Отказ Миколая (218433, 218436–218438): «нужна зависимость от других людей», «че каждый мелкий еблан создаст себе убийцу вселенной и всё», «залупа это», «надо всё усложнить». Уточнение (218441): «он не сможет возродиться если сдохнет родитель».</p>\n<p><strong>Возражение о недостижимой детальности воображения</strong> (218445): «Ты серьезно, ты сам же придумал ограничения типо что бы моснстор появился нужно знать его детально от мелкой волосинки до концика чего то, знать его палатки. Грубо говоря фантазия должна быть настолько прокачено. Вот ты сможешь приставить существо, полный образ существо, знать как она будет выглядеть в нашем мире, знать как на 1.000.000 вещей он будет реагировать / Нет ты не сможешь у тебя терпения не хватит, или будут не состыковки». Ответа по существу в окне нет.</p>\n<p><strong>Возражение про сатанистов</strong> (218468): «А сатана / Есть групп сатанистов, культистов / Кто пропагандирует монстра и сам в него верит тогда почему он не появится». Прямого ответа в окне нет.</p>\n<p><strong>Откуда у людей вера в чужого монстра</strong> (218471–218482): Слава — «Откуда люди могут верить монстра про которого рассказал родитель / Это же не реально»; Миколай — «реально но сложно», «в бога же кто-то верит, ты еблан?»; на вопрос, как в это поверили друзья Кирилла — «а ничего что его друзья дети?». Слава возражает (218479): «Так это разная вера в бога создавалось очень долго и это было в трудные времена в которых кроме веры ничего не оставалось».</p>\n<p><strong>Сколько монстров в мире</strong> (218488–218498): Слава — «Получается этих монстров много»; Миколай — «у одного родителя один», «знающие его усиливают», «по сути в мире их приличное количество», «но они не разнообразные».</p>\n<p><strong>Финал окна</strong> (218509–218523, 20:10), Миколай: «слава / концепция обосраная / го в говне будем сидеть и писать дальше», «там уже всё доработаем», «я так не могу думать», «делаем свои работы такими какими хотим видеть», «и без доёбов», «всё со временем отшлифуется». То есть свод правил объявлен самим автором негодным на следующий день после публикации, и предложен режим работы «пишем как хотим, дорабатываем по ходу». Согласился ли Слава — из окна не следует: он отвечает «Нет / Я сегодня устал».</p>\n<h4>Почему нет всемогущего монстра (2024-08-11, id 217950–218014, запись <a href=\"MR-0053.html\">Ограничения силы монстров</a>)</h4>\n<p>Ветка выросла из вопроса Славы: «Получается любой может создать монстра и получается их 7.000.000.000» и «в разных мультиках бывают божественная сильный монстр который по щелчку пальца могут стереть все живое».</p>\n<p>Ответы Миколая:</p>\n<ul>\n<li>«ну конечно любой может, у каждого есть свой, они разные, но нужна глубокая и долгая связь» (217957);</li>\n<li>родитель монстра, способного стереть всё живое, «должен быть суицидником 100%», он «информацию о нём должен распространять на соответствующих форумах, однако столь сильной эмоции они не добьются, у мира просто нет ну настолько большого количества людей»;</li>\n<li>«да и даже если 19 миллиардов людей было как они все поверят в одно существо, эффект сломанного телефона просто мне даст настоящую веру одному существу в лучшем случае, да и вера не будет такой сильной у всех»;</li>\n<li>«сильных монстров верой не создать», «ну точнее это потребует очень больших усилий»;</li>\n<li>«да и если перейти в рациональное мышление когда думаешь о монстрах то он не станет развиваться», «это прерогатива иррациональных мыслей», «и сильных эмоций»;</li>\n<li>«у суицидников нет столь сильных эмоций, как минимум страха смерти», «ток желание».</li>\n</ul>\n<p>Про Кирилла, который суицидником не был: «так он и не хотел уничтожить мир», «просто полетать».</p>\n<p>Возражения Славы, оставшиеся без ответа внутри окна: «Хотение и вера разные вещи» (218011, повтор 218112); «Я на при мер тоже иногда хочу чтобы мир исчез или случился апокалипсис» — ответ: «ну это слишком незначительно для создания монстра» (218003); вопрос про бога, в которого верят миллионы («А почему не помогает, ведь люди верят что он поможет», 217996), Миколай отложил: «я позже напишу» (218013).</p>\n<h4>Пример работы системы на носителе</h4>\n<p>Способность Беркута сбрасывать людей (<a href=\"SP-0098.html\">Способность Беркута сбрасывать людей</a>, 2024-08-11, id 217864–217868): сила прямо привязана к текущему уровню веры. «а вот монстр к тому моменту порядком ослабел», «защитник его смог убить ибо как минимум он его может коснуться», «то что он насильно может скинуть людей, ну сейчас он даже ребенка бы не скинул». Причина ослабления названа раньше (217848): «о нем знали мб помнили, но он уже не вызывал ужаса, почти на всех балконах защита, родители детей не подпускают к балконам».</p>\n<h3>Система 2. Монстры как домен живых существ (2024-08-26 — 2024-08-29)</h3>\n<p>Устройство домена изложено в разделе «Население и классы». По части сил из него следует:</p>\n<ul>\n<li><strong>Диагностика по крови и дозе</strong>: у человека кровь красная, у монстра синяя, гемоцианин; «был бы монстром, то тебя бы эта доза смогла бы отключить».</li>\n<li><strong>Ауры в этом мире нет</strong>: «ещё говорит, что ауры не существует. ну ладно, это правда» (226088).</li>\n<li><strong>Вещества спасателя</strong> (<a href=\"SP-0109.html\">вещества спасателя</a>, 224940): «а вызывать амнезию не одно из наших веществ не умеет» — амнезия арсеналом не достигается; взамен «есть пара народных методов», конкретно кирпич по голове. Есть игла с дозой, отключающая монстра.</li>\n<li><strong>Использование монстров как инструмента</strong> (<a href=\"SP-0105.html\">использование монстров спасателем</a>, 2024-08-20, id 220668–220677): «он использует монстров в своих целях для спасения людей»; частный случай — «моего персонажа с помощью какого-то жука заставил увидеть галлюцинацию» (<a href=\"SP-0106.html\">жук-галлюциноген</a>, жук-галлюциноген). Границы механики — какими монстрами, как подчиняет — не описаны: разговор оборван просьбой Славы не спойлерить.</li>\n</ul>\n<h3>Система 3. Чёрный, белый и серый миры; маги (2024-11-09, id 255005–255027)</h3>\n<p>Внутри разговора о хорроре с организацией. Слава (255014): «Изначально я хотел чтобы монстры появлялись из других миров / Которых миллиарды и который делаются на черной белый и серый / И вот монстры из черного мира к нам полжуть / И люде из нашего мира могут черпать силу из другого мира ( черный маг белый маг серый маг)». И (255021): «И способности у них всех уникальный так как они черпать силы из разных миллиардом миров».</p>\n<p>То есть разряд носителя (чёрный / белый / серый маг) определяется тем, из какого мира он черпает; уникальность способностей объясняется числом миров-источников. Как именно происходит черпание и есть ли ограничения — в переписке не сказано.</p>\n<p>Оценка самого Славы: «Сама задумка вроде не плохая но это снова из хоррора превращается в боевик» (255022), «Да только мало обещающий» (255025). Миколай: «ну по идее можно и из такого сделать хоррор», «просто это всё утратит основную идею» (255023–255024). Дальше система не развивалась.</p>\n<p>В этой же вселенной названы аномалии: озеро перерождения («который превращает монстра», 255042) и камень желаний (255047) — их механика не расписана.</p>\n<h3>Система 4. Энергия, сосуд и структура (2024-11-17)</h3>\n<p>Слава пересказывает концепт заново, потому что Миколай не помнит («Ты помнишь концепт силы?» — «я короче не помню»). Полный текст (258985):</p>\n<div class=\"q\"><p>«В этом мире каждый владеет энергий ( без структуры) просто энергий. Но рождаются те кто имеет сосуд, который позволяет накапливать энергий, и так энергия накапливается самого рождения и создаёт свою уникальную структуру ( то бишь способность) это может зависеть от всего от психологического состояния ребенка, от сосуда, от среды, и т.п. Сосуд ещё можно качать. Как и объем и контроль структурной энергий. Энергий становится структурной примерно в 7 лет. Энергий не просто накапливается, типо если её слишком много сосуд выпускают ту которую не может удержать»</p></div>\n<p>Из этого следуют:</p>\n<ul>\n<li><strong>Разряды носителей.</strong> Энергия есть у всех, но без структуры; способность есть только у тех, кто родился с сосудом.</li>\n<li><strong>Откуда берётся способность.</strong> Никто её не даёт: энергия накапливается с рождения и сама складывается в уникальную структуру.</li>\n<li><strong>Что определяет.</strong> Психологическое состояние ребёнка, сосуд, среда «и т.п.».</li>\n<li><strong>Срок.</strong> Энергия становится структурной примерно в 7 лет.</li>\n<li><strong>Что качается.</strong> Сам сосуд, объём и контроль структурной энергии.</li>\n<li><strong>Сброс избытка.</strong> Что не удерживается — выпускается наружу.</li>\n</ul>\n<p><strong>Способность = структура.</strong> Уточнено на чёрном ящике (258997): «Черный ящик это структура. И черный ящик поверх свой структуры образует хранящую внутри него структуру. В черном ящики может хранится фиг знает сколько структур».</p>\n<p><strong>Поглощение энергии восполняет сосуд.</strong> Миколай про Кристала (259002–259005): «кристал собирает энергию», «это одна из структур», «и она может быть в ящике», «восполняет сосуд».</p>\n<p>Мир вокруг этой системы — секты, война сект и сбежавшие сверхлюди (259085) — описан в разделе «Организации и сообщества». Источник вдохновения назван прямо: «Я недавно смотрел анимацию боёв стикменов», «И там был маломальский сюжет» (259081–259082).</p>\n<p><strong>Цена и урон на примере Кристала</strong> (<a href=\"SP-0121.html\">Кристал</a>, id 258968–259056). Кристал — первый пришелец Бен 10, которого разбирали под чёрный ящик. Описание Славы (258973): «Кристал поглощает энергий и преобразует в радужную энергий способен стрелять ими, также может летать». Оценка встраиваемости (258974–258975): «допустим можно реализовать поглащение энергии», «типа оружие создавать затратно». Проблема баланса: Слава сам называет поглощение читом — «Типо поглощает энергию», «Это же чит код» (259009–259010), потому что оно восполняет сосуд. Спор о цене (259022–259035): Миколай — «в если атакуют / он получит урон и энергию», «но в 2 раза меньше например», «половину отсосёт / половину получит уроном»; Слава — «Нет весь поглотит», «Типо он не мгновенно поглащает и в этот момент получает урон», «Получает процентов наверное 65». Принятая формулировка: поглощает всю энергию, но поглощение не мгновенное, и в процессе получает около 65% урона. Что его вырубает (259045): «в одной из серий его водой смыло в трансформатор и там он получил заряд электричество и походу он вырубился так как вода проводник а он весь был воде и по сути он получил урон со всех сторон». Войдёт ли Кристал в итоговый список, осталось нерешённым: Слава считает, что он «вообще не к месту» (259006).</p>\n<h3>Система 5. Три элемента и семья с наследственной структурой (2024-11-30)</h3>\n<p><strong>Рамка</strong> (263677, Слава): «Есть три элемента. Сосуд тело структура». Способности выводятся из комбинаций (263680): «Структура+тела=глазки», «Сосуд+тело=изменяющую сосуд». Миколай добавляет (263678–263679): «и некоторые наследственые структуры по типу глаз», «но это можно в структуру кинуть лан».</p>\n<p><strong>Глазки</strong> (<a href=\"SP-0124.html\">Глазки</a>) — наследственные структуры по типу глаз, комбинация структура+тело. Механика глаз в окне не раскрыта; ранее Слава просил про них идею, разработка отложена.</p>\n<p><strong>Изменение сосуда и резонанс</strong> (263684, Слава, полностью):</p>\n<div class=\"q\"><p>«Есть семья. У них с рождения сосуд который они способны по прихоти изменить ( но не слишком сильно потому что сосуд может не выдержать). Изменять сосуд даёт такие вишки как невероятный большой объем сосуд для накопления энергия, идеальная тело с высокими физическими показателями и развитыми всеми чувствами и ещё что нибудь придумаю. Ну пик это когда они могут изменить сосуд на структура то бишь сделать сосуд идентичный с структурой что приведет резонансу с сосудом и структурой и повышает все характеристики и т п. Типо новый прием там»</p></div>\n<ul>\n<li>Ограничение: менять не слишком сильно — сосуд может не выдержать.</li>\n<li>Что даёт: невероятно большой объём сосуда под накопление энергии; идеальное тело с высокими физическими показателями и развитыми всеми чувствами; список открыт («и ещё что нибудь придумаю»).</li>\n<li>Пик — резонанс сосуда и структуры (<a href=\"SP-0123.html\">Резонанс сосуда и структуры</a>): сделать сосуд идентичным структуре, что повышает все характеристики. Назван отдельным новым приёмом; детали резонанса не расписаны.</li>\n</ul>\n<p><strong>Кристаллизация энергии и затравка</strong> (263727, Миколай, 21:30):</p>\n<ul>\n<li>«как я раньше обозвал твою структуру — кристаллы. энергия в сосуде жидкая с рождения и всегда, но конкретно до 7 лет кристаллизуется часть энергии, на этом кристалле написаны данные отраженные в опыте и определяющие способность»;</li>\n<li>«для выращивания настоящих кристаллов есть свой алгоритм, но это процесс обратимый, однако в разных кристаллах сложность разная, например процессоры это монокристаллы и информацией и их не целесообразно и не практично плавить и кристализировать заново, после записывая информацию, проще чистое вещество взять. поэтому никто из людей не может менять свою структуру, это невероятно сложно»;</li>\n<li>затравка: «для формирования нужна так называемая затравка. при рождении она появляется и благодаря ней появляется возможность кристаллизовать энергию через опыт», и без неё расплавленный кристалл не восстановить — «даже если другие расплавят этот кристал они не создадут его заново не за что».</li>\n</ul>\n<p>Поправка автора к своей же прежней версии (263728): «я тогда забыл то что не просто кто-то пишет способность а это результат опыта».</p>\n<p><strong>Наследственный механизм смены структуры</strong> (<a href=\"SP-0125.html\">Наследственный механизм смены структуры</a>, та же реплика 263727):</p>\n<ul>\n<li>«в этой семье такая особенность, у них есть структура наследственная, с механизмом упрощающим этот процесс, которых для других невозможен изв сложности»;</li>\n<li>«они в течении 2 дней могут давить в определённую точку для изменения агрегатного состояния структуры способности»;</li>\n<li>цена: «расплавив они лишаются структуры способности и по сути становятся как новорождённые»;</li>\n<li>«у этой семьи наследственная структура имеет возможность создать искусственно затравку»;</li>\n<li>срок восстановления: «для кристаллизации новой структуры им нужно то же время что и с момента рождения и она также будет неразвита»;</li>\n<li>«у разных членов семьи разное допущение с разными параметрами поиграть может будет».</li>\n</ul>\n<p><strong>Балансная надстройка</strong> (263734): «детский опыт довольно мистический, но не всегда сильный, в осознанном возрасте они могут пройти традиционное семейное обучение 2 года, а после развиваться так как пожелают, что позволит создать способности намного сложнее тех что появляются с рождения»; «и ваще не хочу я делать их имбалансными. это обычные люди со способностями, не обязательно семейники самые сильные, это нечестно, но обычные не могут менять способность и обречены жить с тем что есть, а вот моя семья способна изменить на более привлекательную и крутую в основном возрасте». На вопрос Славы «И где здесь плюсы? Что сделай эту семью могучий» ответ: «они невъебено могучая».</p>\n<p><strong>Итог</strong> (263736–263741): Слава — «Ну не», «Без бафоф»; Миколай — «это сплошной баф как по мне», «я не понимаю». Слава закрыл: «Ну идею ты мне подкинул», «Молодец». Вариант в этом виде принят не был; разговор на этом остановлен. Третью семью («И третий семью должен ты покинуть идею», 263686) так и не придумали.</p>\n<h3>Чёрный ящик (<a href=\"SP-0120.html\">Чёрный ящик</a>)</h3>\n<p>Крупнейший файл базы по этой вселенной, 14 версий, 2024-11-17 — 2026-06-17. К вселенной «монстры» отнесены только версии 1–4 (2024-11-17, окно w0064, id 258904–259140).</p>\n<p>Первая формулировка Славы (258912): «Новая способность. Черный ящик ( выдает разный способности). Является частичной передающий способностью». Миколай забраковал как непонятное: «это ваще не понятно», «мало деталей», «даже на примера нет» (258920–258923).</p>\n<p>Развёрнутая механика (258924):</p>\n<div class=\"q\"><p>«Есть способность черный ящик. И вот его владелец способен создавать разный черный орудий броню. Или создать черный кубик разного размера ( без разницы) и открывая его, владельцу выдаётся способность типо управления огнем, молниями, супер скорость и т.п. То бишь как Омнитрикс ( из Бен 10) только он не изменяет форму владельца а просто даёт способность»</p></div>\n<p>Параметры, вытянутые вопросами Миколая (258926–258953): список способностей ограничен — «Ну типа да»; рангов нет; сколько носит за раз — «Одну»; смена — «сначала ждёт когда это способность исчезнет и потом снова открывает черный ящик»; срок действия — «Не знаю. 10 минут +-»; длина списка — «Ну хотя бы 20».</p>\n<p>Встраивание в систему энергии (258997): ящик сам является структурой и поверх своей структуры образует хранящуюся внутри структуру; «В черном ящики может хранится фиг знает сколько структур».</p>\n<p>Причина, по которой Слава сам не мог развить идею (259107): «Проблема в том что я не могу реализовать способности пришельцев Бен 10 в черный ящик», «Раз соединять не хочу а вместе они не катят». Обоснование выбора источника (259114): «Потому что Омнитрикс=черный ящик». Разбор Миколая (259116–259122): «а омнитрикс это че / часы выбора пришельца? / а черный ящик / шкатулька со способностями / но не выбор / а рандом / а почему именно способности пришельцев это не объясняет алё». Изначальный замысел Славы назван прямо (258964): «Вообще изначально я хотел просто взять всех пришельцев из Бен 10 и забрать их ний способность слегка изменив или соединив с другими».</p>\n<p>Взамен Бен 10 Миколай дал вики умений (Ссылки на вики умений (anime-characters-fight) <em>(статьи ещё нет — <a href=\"kb/SL-0047-ssylki-na-viki-umeniy-anime-characters-fight.html\">исходник</a>)</em>, id 259128–259139): общая статья «Умения, силы и способности» на anime-characters-fight и точечные ссылки — манипуляции энергией, регенерация, неосязаемость, манипуляции газом, манипуляции растениями, сверхчеловеческие характеристики. «наверное от сюда», «тут всё есть», «абсолютно», «на всех уровнях».</p>\n<p>Список из 20 способностей так и не составлен.</p>\n<p><strong>Версии в других вселенных</strong> (для сведения, не «монстры»):</p>\n<ul>\n<li>2025-01-24, 2025-01-27, 2025-05-14 (Апостол, id 284248, 284300, 284858, 285522, 325799): название стоит одной строкой в разделе «Идей» рабочего каталога, содержание не раскрыто.</li>\n<li>2025-04-18 (Нимб, id 320032–320135) — другое определение: «Чёрный ящик устройства записывающий и сохраняющие знание, параметры и характеристики вселенной. Бытия. У чёрного ящик есть вход, через который он поглощает знания, параметры и характеристики. Также у него есть выход. То бишь отворяя чёрный ящик ты получаешь результат его обработки информации о чем либо»; «Под вселенной подразумевается всё», «Буте то объект или субъект. Живой или не живой». Владелец есть, не всегда человек, меняется — «Это кочевной артефакт» (320092–320097). Происхождение: «Ог появился вместе с большим взрывом и записывал информацию о нашей вселенной, а также сохранял их, чтобы возможно при уничтожение вселенной остался дубликат» (320098). Выдача способностей через запрос (320110–320117): «Ты даёшь запрос Чёрному ящику и он его выполняет по ситуации», «Типо говорит ли он правду», «Или мне нужно стать быстрее и чёрный ящик подберёт данный (характеристики или параметры) существ имеющию большую скорости и временно превратит тебя в его»; «Сложность вопроса зависит не от сложной формулировки а от типа вопроса, я хочу спасти вселенную это сложный запрос. Хоть формулировка лёгкая». Цена: «Задавая запрос и зависимость от его сложности он будет поглощать „выносливость? Или жизненную силу\"», «Я не знаю», «Наверное жизненную силу». На прямой вопрос Миколая, имеет ли это отношение к тогдашней прозе, Слава ответил «не» (320142).</li>\n<li>2026-06-14 и 2026-06-17 (вселенная неясна): ящик назван как известный, владельцем стал Бэм; описание отложено («Прости я спать хочу», «И мне лень описать его»). В 2026-06-17 показан как предмет гонки организаций; свойства не описаны.</li>\n</ul>\n<p>Связь версий 2024 года и версий 2025 года в переписке не оговорена.</p>\n<h3>Разряды носителей: что прямо названо</h3>\n<p><strong>В системе веры (2024-08):</strong> родитель — первоисточник, один монстр на одного родителя, определяет всё на фундаментальном уровне, «истинная вера только у родителя»; знающий — материализует, влияет поверхностно, усиливает, порог «10 знающих» для минимального взаимодействия с миром духов; материализованный монстр — дух с одним мотивом; после первого нарушения заповеди — злой дух; видящие — дети, животные, души до 4 лет психического возраста, взрослые, в чью жизнь вмешался злой дух; камеры — нет.</p>\n<p><strong>В системе домена (2024-08):</strong> люди (кровь красная) и монстры (кровь синяя, гемоцианин); монстры — домен, «у каждого типа свои особенности, появления, поведения»; предводителя нет. Отдельный разряд — человек, чей «иммунитет способен адаптировать клетки монстров» (<a href=\"SP-0107.html\">иммунитет, адаптирующий клетки монстров</a>).</p>\n<p><strong>В системе миров (2024-11-09):</strong> чёрный маг / белый маг / серый маг — по миру-источнику.</p>\n<p><strong>В системе сосуда (2024-11-17 и 2024-11-30):</strong> все люди — энергия без структуры; рождённые с сосудом — сверхлюди, их находят и растят секты, «все они по уровню друг другу разный»; обычные люди со способностями — «обречены жить с тем что есть»; семья с наследственной структурой — единственные, кто может сменить способность в осознанном возрасте.</p>\n<p><strong>Явно отвергнутый разряд:</strong> ранжирование самих способностей (обычные / редкие / эпические / уникальные).</p>\n<h3>Цена, ограничения и слабости по отдельным способностям</h3>\n<ul>\n<li><strong>Чёрный ящик (2024-11-17)</strong>: одна способность за раз; выпадает рандомно, не выбирается; срок около 10 минут; следующую можно достать только после исчезновения текущей.</li>\n<li><strong>Чёрный ящик (2025-04-18, Нимб)</strong>: плата за запрос — «выносливость? Или жизненную силу», «Наверное жизненную силу»; чем сложнее тип запроса, тем больше берёт.</li>\n<li><strong>Кристал</strong>: поглощает всё, но не мгновенно, и получает при этом около 65% урона; вырубается от тока в воде.</li>\n<li><strong>Пламенный</strong> (<a href=\"SP-0021.html\">Пламенный</a>): слабостей нет — «По сути у него нет слабости» (259059), из-за чего набор и назван читом.</li>\n<li><strong>Стенд Миколая</strong> (<a href=\"SP-0113.html\">Стенд Миколая</a>, 2024-09-04, id 227701–227705): «Все к чему прикоснуться шупальцы, то ты сможешь сохранить и в случай чего создать дубликат»; ограничение — «слотов сохранения ограниченный», «6 слотов». Сохраняются ли только предметы или и живое — не сказано.</li>\n<li><strong>Стенд Славы</strong> (<a href=\"SP-0114.html\">Стенд Славы</a>, 2024-09-04, id 227719–227735): свиток, «на котором ты можешь создавать что угодно», «но с разной степенью реализации»; «можно реализовать токо один предмет, реализация не стабильная и зависит от создателя, желания, проработки и другого»; цена — «кнш ты жертвуешь самым ценным ресурсом» / «временем». Стенд способен развернуть мир «7 остров» как расширенную территорию.</li>\n<li><strong>Термоядерный синтез клеток донора</strong> (<a href=\"SP-0096.html\">Термоядерный синтез клеток донора</a>, 2024-08-08, id 215794–215796): клетки «превращая каждый атом воздуха кроме углерода в кислород, что позволяет в 99 раз увеличить питание организма полезными веществами, его кровь невероятно сильно насыщается»; обратная сторона — «но ему надо невъебенно много хавать», «когда маленький был, он от двух дневного голода целый город схавал».</li>\n<li><strong>Буквальное исполнение желаний</strong> (<a href=\"SP-0097.html\">Буквальное исполнение желаний, которое нельзя отменить</a>, 2024-08-09, id 216958): монстр слышит высказанное вслух желание и исполняет буквально; «после начала реализации действие желания нельзя отменить».</li>\n<li><strong>Метаболизм вампиров</strong> (<a href=\"SP-0102.html\">метаболизм вампиров</a>, 2024-08-11, id 218122): худоба и сила объясняются превращением в летучую мышь; ограничитель у Ник-Хана — «метаболизм у него всё ещё работает, но он его ограничивает».</li>\n<li><strong>Снятие окаменения гуано и спиртом</strong> (<a href=\"SP-0103.html\">снятие окаменения гуано и спиртом</a>, 2024-08-11, id 218123): состав — гуано летучей мыши (нитраты, «способствуют разложению при контакте с неорганикой и увеличению энергии в контакте с органикой») плюс насыщенный азотом воздух пещеры плюс окислительный слой фекалий, разведённые спиртом (вином), пропорции определены на глаз по книге из коллекции Ник-Хана. Применение: статую опускают в купальню с водой, смесь из-за меньшей плотности держится на поверхности и покрывает всю площадь; камень отпадает трещинами. Автор называет это главной ценностью истории — «в идее», «к том как избавились от окамения» (218290, 218293); Слава возражает, что это «Доктор Стоун» (218297).</li>\n<li><strong>Гены рыбочеловека</strong> (<a href=\"SP-0104.html\">гены рыбочеловека</a>, 2024-08-17, id 220213): наследуемая мутация, переданная через укус в ключицу; даёт каннибализм и физические способности; точный список физических способностей не проговорён. Автор оговаривает: «мне похуй насколько это реалистично, такой концепт интересен».</li>\n<li><strong>Гипермедленная регенерация</strong> (<a href=\"SP-0111.html\">гипермедленная регенерация</a>, 2024-08-29, id 226088): «постоянная гипермедленная регенерация даже в варёном состоянии».</li>\n<li><strong>Перенос по вектору инерции</strong> (<a href=\"SP-0110.html\">перенос по вектору инерции</a>, 2024-08-29, id 226100–226101): «это монстр которого ты бросаешь, но не отпуская и в ту сторону к которую идёт инерция он бесконечно тебя уносит», «обычно всегда в небо, а после если ты достаточно высоко он отпускает и бьёт током чтобы ты разбился».</li>\n<li><strong>Восстановление после смертельных повреждений</strong> (<a href=\"SP-0118.html\">Восстановление после смертельных повреждений</a>, 2024-10-20 и 2024-10-21, id 247842–247843, 248170–248172): «она не способна умереть»; время восстановления плавает — «в этот раз она восстановилась за час, а не за 7 минут как раньше»; во льдах Антарктиды «её организм зачал прогревать себя после 13 минуты». Сформулировано как правило: «вот у нас человек, у которого природа забрала право на смерть», «он взрослеет но не травмируется», «он вечно восстанавливается».</li>\n<li><strong>Касание руки</strong> (<a href=\"SP-0112.html\">касание руки</a>, 2024-08-27, id 225501): последствия из сна переносятся наяву — «косания которая заставила дребезжать каждую клетку моего тела»; после захвата рука «болела так словно я крапиву взял и полностью её руку обвязал и каждый 10 минут менял на новую»; за 23 дня герой сбросил 7 кг, нервозность, раздражительность.</li>\n<li><strong>Особая ДНК / золотая кровь</strong> (<a href=\"SP-0095.html\">Особая ДНК / золотая кровь</a>, 2024-08-07 и 2024-08-08, id 215636–215793): проходит несколько состояний — «более подходящая ДНК» → ДНК вымерших видов («есть виды которые вымерли и их днк утратилось, а в нем оно есть», «и оно ценное для использования и исследования») → золотая кровь (тему подкинул Слава: «Ты знаешь что такое золотая кровь? Узнай. Я объяснять не умею») → «1 человек остался нужном геном производящим нужную кровь, единственную в своём роде», «вот он будет донором».</li>\n<li><strong>Волшебное слово «пожалуйста»</strong> (<a href=\"SP-0116.html\">Волшебное слово «пожалуйста»</a>, 2024-09-17, id 230873): правило внутри истории, которое мама объясняет Криму: «есть волшебное слово „пожалуйста\", если его скажешь, то тебе всё отдадут что хочешь и сделают всё, что пожелаешь… только помни, его нужно говорить спокойно, но чётко. сначала произносишь, что тебе нужно, а потом слово или наоборот». Срабатывает подряд на маме, шестнадцатилетней девушке, дядьке с пачкой сливок и девочке. На следующий день (<a href=\"SP-0117.html\">слово «пожалуйста»</a>, 2024-09-18, id 232687–232690) автор снимает магический статус: «сейчас оно не волшебное, просто ебанутые взрослые решили подыграть», «а он поверил», «и как тебе не нравится», «вера порадила монстра». Что за монстр — «увидишь», в окне не раскрыто.</li>\n<li><strong>Трипл Хук</strong> (<a href=\"SP-0115.html\">Трипл Хук</a>, 2024-09-17, id 230873): фраза-приём, которую Крим выкрикивает вместо волшебного слова. По его представлению «эта фраза отбрасывает соперника ломая позвоночник», здесь же «заставляет смеяться». Откуда приём у Крима и работает ли он где-то по-настоящему — не сказано.</li>\n</ul>\n<h3>Правило мира: «смерть это право, смерть это навык» (2024-10-20 — 2024-10-21, окно w0062)</h3>\n<p>Правило мира и, по прямым словам автора, центральная мысль рассказа. Изложено 2024-10-20 (247842–247843) двумя голосами.</p>\n<p>Первый рассказчик: «смерть это не просто награда, это право, которое отнять не возможно. и важно его защищать. но кто будет этим заниматься и точно ли это целесообразное утверждение?». Дальше о девушке, у которой не билось сердце и которая при этом жива: «какая мерзость, девушка не имеет права на смерть», «она отринула смерть. она не способна умереть и это страшно, её нельзя допускать до общества». Вывод: «бывают случаи, когда кто-то лишается этого права и больше не является человеком. она монстр и нельзя этому существу быть среди людей. важно защищать право смерти. но кто это будет делать?»</p>\n<p>Второй рассказчик возражает: «в смысле смерть это право? ты вообще ничего не понял после встречи с той девчонкой. смерть это навык понятное дело. она пытается обучиться и достичь цели, а ты на неё ярлыки вешаешь, мол она монстр». И про механику восстановления: «смерть она не испытывала, но она способна на смерть», расстрел шестнадцатью вооружёнными солдатами из узи, после которого «она восстановилась за час, а не за 7 минут как раньше»; заплыв во льдах Антарктиды, где «её организм зачал прогревать себя после 13 минуты».</p>\n<p>Отношения рассказчиков уточнены 2024-10-21 (248141): «с первым рассказчиком они скорее враги и вообще не знают друг друга, он просто через 20 лет начал комментировать его рассказ, будто в диалоге». Кто второй рассказчик — не решено: «и я хз кто это / я ваще не заморачивался» (248142–248143).</p>\n<p>Формула названа автором прямо (248115): «основная идея что смерть это навык», и целиком (248150): «смерть это право, смерть это навык». Оценка Славы (248151): «Норм».</p>\n<p>Спор о том, человек ли бессмертный (248159–248177): Слава — «Я ожидал типо монстр который страдает от бессмертия», «Думаешь человек проживший 200 лет человек», «Даже психологический он уже не человек», «Почему друзья умирают родители и все близкие». Миколай — «человек которого считают монстром / классика», «вот у нас человек, у которого природа забрала право на смерть / он взрослеет но не травмируется / он вечно восстанавливается», «я хочу так сделать».</p>\n<h3>Механики, которые предлагали и отклонили или отложили</h3>\n<p><strong>Отклонено прямо:</strong></p>\n<ol>\n<li><strong>Система ранжирования способностей</strong> (2024-11-17, id 258926–258937). Миколай: «они ранжированы?», «тобиж уникальные, редкие обычные эпичные». Слава: «Нет, каждая способность по своему полезная в разных ситуациях». Миколай уточняет: «ну ранг не это определяет», «а определяет скорее шанс выпадения». Слава: «Нет», «Нету». Повторное предложение через 25 минут (259016: «поэтому систему ранжирования можно сделать») осталось без ответа.</li>\n<li><strong>Разные кубики под разные способности</strong> (id 259060–259072). Миколай предложил разбить набор Пламенного: «один реген», «другой управление огр», «еще сила», «и ещё передвижение в земле». Слава: «Нет типо разделять способности который изначально были вмести как глупо», «Да и плюсом все по отдельности они какие то слабый». Миколай: «нет, всё вместе это чит», «да / слабые / но полезные». Итог не выбран, способность в ящик так и не встроена.</li>\n<li><strong>Убрать веру, завязать силу только на родителя</strong> (2024-08-12, id 218426–218438).</li>\n<li><strong>Убрать ограничение видения</strong> (2024-08-12, id 218415) — отбито ссылкой на правило про обнуление вклада при рационализации (218424) и на принципиальную слабость типа (218423).</li>\n<li><strong>Массовая потеря памяти после смерти монстра</strong> (2024-08-11, id 217922–217933) — выдвинуто самим Миколаем и отменено под возражением Славы про СМИ; замена — легенда, которую «форсят копипасты».</li>\n<li><strong>Игра как источник монстров</strong> (Игра как источник монстров <em>(статьи ещё нет — <a href=\"kb/ID-0090-igra-kak-istochnik-monstrov.html\">исходник</a>)</em>, 2024-08-11, id 217812–217833, 217880–217888).</li>\n<li><strong>Беркут возвращается каждые 3 месяца</strong> (Беркут возвращается каждые 3 месяца <em>(статьи ещё нет — <a href=\"kb/ID-0091-berkut-vozvraschaetsya-kazhdye-3-mesyaca.html\">исходник</a>)</em>, 2024-08-11, id 217808). Слава: «он появится через 3 месяца защитник о нем узнает и снова убьет поняв что эту тварь надо убивать каждый 3 месяца». Миколай перебил встречным вариантом: «он увидет другого беркута и подумает что тот всё ещё жив и убьёт его, а это был мирный дух» (217815) — из чего и выросло правило про презрение монстров к убийце мирного духа.</li>\n<li><strong>Аура</strong> — заявлено внутри прозы как факт мира (226088): «ещё говорит, что ауры не существует. ну ладно, это правда». За два дня до этого Миколай бросил в чат заготовку «система ауры», «переформулирую», «#внушение» (система ауры <em>(статьи ещё нет — <a href=\"kb/ID-0093-sistema-aury.html\">исходник</a>)</em>, 2024-08-28, id 225821–225823) — никто не подхватил.</li>\n<li><strong>Вариант семьи в предложенном виде</strong> (2024-11-30, id 263736–263741).</li>\n<li><strong>Сам свод «принципы материализации и её продуктов»</strong> — объявлен негодным автором в тот же день (2024-08-12 20:10, id 218510).</li>\n</ol>\n<p><strong>Отложено (не отклонено, но и не сделано):</strong></p>\n<ol start=\"11\">\n<li><strong>Слабость молния + вода</strong> (2024-11-17, id 259049–259053). Миколай: «ну как будто можно из этого сделать слабость к способносте», «типа такое сочетание дебафит или отключает способность или пользователя», «молния + вода». Слава: «Ну это потом». Правило про сочетания стихий как дебаффы больше не появляется.</li>\n<li><strong>Стихийный набор для списка способностей</strong> (id 258954–258964). Миколай: «стихийные мы даём ему? / 6 / или тьма и свет не входят? / ок тогда 4 есть / полёт это ветер или другое? / какие вообще возможности дают стихии». Слава: «Не знаю». Список не собрали, разговор ушёл в Бен 10.</li>\n<li><strong>Глазки</strong> (<a href=\"SP-0124.html\">Глазки</a>) — место в системе закреплено, механика отложена.</li>\n<li><strong>Растения</strong> — Миколай спрашивает 2024-11-30 (263591): «ты про растения чет придумал или отложил», Слава: «Думал», «Но отложил».</li>\n<li><strong>Система «чёрный/белый/серый маг»</strong> (2024-11-09) — заявлена и брошена в тот же вечер.</li>\n</ol>\n<h3>Что осталось несведённым внутри самого материала</h3>\n<ul>\n<li>Две формулировки перехода в злого духа стоят рядом и не сопоставлены: «одно убийство делает дух злым» (217868) и «после первого нарушения одной заповеди дух становится злым» (218392). Список заповедей нигде не приведён.</li>\n<li>Свод 218392 говорит, что монстр исчезнет навсегда, если развеять форму при отсутствии или смене мотивов родителя; ветка 217920 говорит, что при живом родителе «была бы возможность возродится»; отдельно стоит «он не сможет возродиться если сдохнет родитель» (218441). Соотношение этих трёх формулировок авторы не проговаривали.</li>\n<li>Правило «сила веры и количество верующих определяет силу монстра» (217841) и правило «у всех вера влияет одинаково на материализацию / качество разное» (217988–217989) стоят в одном окне; как они складываются — не сказано.</li>\n<li>Чёрный ящик описан и как структура внутри системы сосуда (2024-11-17), и как кочевой артефакт, появившийся вместе с большим взрывом (2025-04-18, вселенная Нимб). Что из этого отменяет что — не сказано.</li>\n</ul>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Второе по цене — <code>PS-0169</code> «Владелец чёрного ящика»: три ссылки на 2 548 знаков, при том что носитель самой разработанной способности вселенной (<code>SP-0120</code>, 54 937). На прямую просьбу напомнить, кто это, автор ответил «Прости я спать хочу», «И мне лень описать его».</p></div>\n<div class=\"mnote\"><b>⚙ машинная заметка · Отклик — не материал авторов</b>\n<p>Сильнее всего здесь сцена спасателя и писателя. Устройство мира — домены живых существ, гемоцианин, ментальные сигналы — подано не сводом правил, а болтовнёй двух людей на работе, и автор отдельно объясняет соавтору разметку: «в кавычках говорит твой спасатель», «без них мой писатель». Мир объясняется изнутри, потому что объяснять его больше некому. И реплика про то, что у монстров «даже не социум у них, а более сложное явление, которое я не понимаю», — редкий случай, когда персонаж признаёт предел собственного знания, и это работает лучше любой таксономии. Зацепило и другое: свод из 218392 объявлен «обосраной концепцией» на следующий день после написания, с предложением «го в говне будем сидеть и писать дальше» — и они действительно пишут дальше. Система тут не отменяется и не чинится, она просто перестаёт быть обязательной, а работа продолжается. Это честнее, чем большинство способов обращаться с собственными правилами, которые я видел.</p></div>", "r": [["Игра как источник монстров", "kb/ID-0090-igra-kak-istochnik-monstrov.html"], ["Беркут возвращается каждые 3 месяца", "kb/ID-0091-berkut-vozvraschaetsya-kazhdye-3-mesyaca.html"], ["система ауры", "kb/ID-0093-sistema-aury.html"], ["Ссылки на вики умений (anime-characters-fight)", "kb/SL-0047-ssylki-na-viki-umeniy-anime-characters-fight.html"], ["Особая ДНК / золотая кровь", "SP-0095.html"], ["Наследственный механизм смены структуры", "SP-0125.html"], ["Способность Беркута сбрасывать людей", "SP-0098.html"], ["вещества спасателя", "SP-0109.html"], ["использование монстров спасателем", "SP-0105.html"], ["жук-галлюциноген", "SP-0106.html"], ["Кристал", "SP-0121.html"], ["Глазки", "SP-0124.html"], ["Резонанс сосуда и структуры", "SP-0123.html"], ["Чёрный ящик", "SP-0120.html"], ["иммунитет, адаптирующий клетки монстров", "SP-0107.html"], ["Пламенный", "SP-0021.html"], ["Стенд Миколая", "SP-0113.html"], ["Стенд Славы", "SP-0114.html"], ["Термоядерный синтез клеток донора", "SP-0096.html"], ["Буквальное исполнение желаний, которое нельзя отменить", "SP-0097.html"], ["метаболизм вампиров", "SP-0102.html"], ["снятие окаменения гуано и спиртом", "SP-0103.html"], ["гены рыбочеловека", "SP-0104.html"], ["гипермедленная регенерация", "SP-0111.html"], ["перенос по вектору инерции", "SP-0110.html"], ["Восстановление после смертельных повреждений", "SP-0118.html"], ["касание руки", "SP-0112.html"], ["Волшебное слово «пожалуйста»", "SP-0116.html"], ["слово «пожалуйста»", "SP-0117.html"], ["Трипл Хук", "SP-0115.html"], ["Ограничения силы монстров", "MR-0053.html"]]}, {"t": "Пробелы", "a": ["S06", "VS-0015-S06", "VS-0015--probely"], "h": "<div class=\"gaps\"><h3>Границы вселенной, её начало и конец</h3>\n<ol>\n<li><strong>Кончина вселенной нигде не объявлена.</strong> Ни одно из двух дословных объявлений (2024-08-08, 2024-09-24) не содержит закрытия, отказа от вселенной или заявления о её конце; в разделе «События-объявления» нет события типа «закрытие», паузы, заморозки или возврата. Единственное, что играет роль конца, — правая граница отрезка <strong>2024-12-08</strong>, у которой нет ни объявления, ни цитаты, ни причины, при том что последняя сущность датирована 2024-11-30, а последняя проза — 2024-11-13. Что произошло 2024-12-08 и произошло ли — в переписке не сказано.</li>\n<li>Ближайшая по смыслу реплика, которая могла бы касаться конца, — «Возможно не на долго» Славы (2024-09-24, 235580) с пояснением «Ну может быть мне в голову что то влетит» (235583) и «Ну это все в будущем» (235584); к вселенной она прямо не отнесена, и работа после неё продолжалась.</li>\n<li><strong>Что было до вселенной — не изложено.</strong> Единственный след «старой» вселенной — опция Славы «Или старая?» (2024-09-24, 235562); какая именно вселенная имеется в виду, не названо.</li>\n<li>Не объяснено, <strong>почему к вселенной отнесены сущности с датами раньше объявления 2024-08-08</strong> — от «Пламенного» (<a href=\"SP-0021.html\">Пламенный</a>, 2023-05-24) и «Кирилла» (<a href=\"PS-0049.html\">Кирилл</a>, 2024-04-03) до «7 островов» (<a href=\"MR-0018.html\">7 островов</a>, 2024-07-03), «Защитника» (<a href=\"IS-0017.html\">Защитник</a>, 2024-07-04) и мира «Монстры» (<a href=\"MR-0046.html\">Монстры</a>, 2024-07-31).</li>\n<li>Отношение между вселенной «монстры» (<a href=\"VS-0015.html\">монстры</a>) и одноимённым <strong>миром «Монстры»</strong> (<a href=\"MR-0046.html\">Монстры</a>, с 2024-07-31) в переписке не проговорено.</li>\n<li>Расхождение <code>отрезков_объявлено: 2</code> в шапке против одной строки в таблице отрезков внутри файла не разрешено.</li>\n<li>Ссылка «235561 закреплено название „монстры“» указывает на сообщение, где стоит «Новая вселенная»; фактически название звучит в 235571. В файле это не выправлено.</li>\n<li>Собственного имени у вселенной на 2024-08-08 нет — это отмечено прямо в строке события. Название появляется только через полтора месяца. В окнах w0051, w0052, w0055, w0063, w0064, w0065 стоит помета «вселенная не объявлена / не названа».</li>\n<li>Слово <strong>«моча» / «в моче»</strong> как рабочее обозначение вселенной (235565–235566) не объяснено — откуда оно и что значит, не сказано.</li>\n<li>Содержание всех 156 сущностей и 23 текстов прозы в самом <a href=\"VS-0015.html\">монстры</a> не раскрыто — только названия, даты, число версий и пути.</li>\n</ol>\n<h3>Рамки и договорённости 2024-08-08</h3>\n<ol start=\"11\">\n<li>Из перечня Миколая («одна вселенная / один город / одно время / одни персонажи», 215896–215900) в итоговой формулировке 215910 остались только «одна вселенная и тематика монстров, больше границ нет». Действует ли условие <strong>«один город»</strong> — не решено; название города нигде не звучит.</li>\n<li>Реплика Славы <strong>«Лубок время»</strong> (215902) с продолжением «Хоть какие» (215903) не разъяснена; Миколай отвечает «что / а / пон», без расшифровки. Что имелось в виду под временем действия — не сказано.</li>\n<li><strong>Фамилия ГГ</strong>: на «Кстати гг мой историй зовут Андрей» (215913) Миколай отвечает «надеюсь Федореев» (215916). Подтверждения или опровержения нет.</li>\n<li>Ответ «Да» Славы (215915) на итоговый вопрос Миколая «верно?» (215911) отделён двумя чужими репликами; формально к чему он относится, в тексте не помечено.</li>\n</ol>\n<h3>Масштаб и космология</h3>\n<ol start=\"15\">\n<li><strong>Числа миров два, и они не сведены</strong>: «миллиарды» (255014, 2024-11-09) и «Вселенная бесконечная» (279031, 2025-01-06).</li>\n<li>Схема «чёрный/белый/серый» изложена Славой как то, чего он «изначально хотел», и тут же им самим отмечена как поворот из хоррора в боевик (255022). Принята она или отвергнута — осталось нерешённым.</li>\n<li><strong>Чем белый мир отличается от серого</strong> — не сказано. Содержательно определён только чёрный.</li>\n<li><strong>Геометрия мира не решена</strong>: на вопрос «он шарик или листок?» (278869) прямого ответа нет, на вопрос про размеры (278882) ответа нет.</li>\n<li><strong>Порталы</strong>: слово произнесено Миколаем (278874) и не подтверждено.</li>\n<li><strong>Мотивы Смерти</strong>: «ей платят за это? нахуя она это делает? вредная привычка?» (278877) — без ответа.</li>\n<li><strong>Прямое противоречие в определении Существа</strong>: 2025-01-06 (278868) Существо — правитель нашего мира; 2025-03-10 (300760) Существо — «ребёнок правителя, который имеет физическую оболочку». Противоречие в переписке не замечено.</li>\n<li><strong>Противоречие про контроль над вселенной</strong>: «а есть кто-то кто контролирует все миры?» — «Нет» (278888), при этом на «но существо вселенную контролирует» (279028) ответ «Есть» (279030).</li>\n<li>Расхождение навигации базы и дословной реплики: реплика 278868 — «но сейчас он не нейтрален», навигационная помета окна w0070 — «Сейчас нейтрален».</li>\n<li><strong>Связаны ли миры между собой напрямую, минуя наш</strong>, — не сказано.</li>\n<li>Что такое <strong>минимиры</strong> (279029) — не объяснено.</li>\n<li>Что означают <strong>альфы</strong> сейчас — не сказано; сказано только, что «раньше означали сильнейшей разумной субъекты в своём мире» (300892).</li>\n<li>Причина и механика <strong>побега чужемирцев</strong> — «по разным причинам» (300890), дальше ничего.</li>\n<li>Как <strong>двухслойное устройство</strong> (реальный мир / мир духов / мистическое пространство свода 218392) соотносится с миллиардами миров <a href=\"MR-0066.html\">Чёрный, белый и серый миры</a> — нигде не сведено.</li>\n<li>Материал по правителям миров и перемещению между мирами лежит в окнах <strong>w0070 и w0079, где вселенная объявлена как «Апостол»</strong>, а не «монстры». Сущности «Правители миров», «Правитель Кильки», «Вселенная (наш мир)», «Чужамирцы», «Смерть» только перечислены в шапке <a href=\"MR-0068.html\">Существо с длинными руками</a> и не раскрыты; их файлов в списке миров вселенной «монстры» нет.</li>\n<li><a href=\"MR-0066.html\">Чёрный, белый и серый миры</a> несёт помету: неясно, тот ли это мир, где происходит проза про ГГ.</li>\n<li><strong>7 островов</strong>: причина войны между тремя островами не придумана («Придумаю», 194893); отношения и конфликты между островами отложены («Давай попозже подумаем», 194999) и не возобновлены; четыре «острова Миколая» существуют только как биом плюс защитник; второй остров (Нуара) в исходном списке идёт без названия — «2 ??????». Всё это, кроме окна w0056, относится к вселенной «7 островов».</li>\n</ol>\n<h3>Организации</h3>\n<ol start=\"32\">\n<li><strong>«Хоррор с организацией»</strong> (255003, 2024-11-09): что это за организация, чем занимается, кто в неё входит — не сказано ни слова.</li>\n<li><strong>Секты</strong> (259085–259089): нет названий, числа, руководителей, различий между ними, причины и хода «войны сект». Не сказано, что делают с теми, кто не сбежал.</li>\n<li><strong>Владелец чёрного ящика</strong> (<a href=\"PS-0169.html\">Владелец чёрного ящика</a>): кроме «сбежал из секты» биографии нет; 2026-06-14 на прямую просьбу напомнить, кто это, ответ — «Прости я спать хочу», «И мне лень описать его».</li>\n<li><strong>Дело спасателя и писателя</strong>: нигде не названо организацией, у него нет имени, руководителя и других участников. Что именно на складе — не раскрыто. Кто такие «мы» в речи спасателя — не сказано. Имя писателя ни разу не названо; неясно, он ли «тот паренёк» из 226088. Смысл слова «снова» в реплике спасателя остался вопросом самого Славы (224966).</li>\n<li>Отношения между делом спасателя (август 2024) и сектами (ноябрь 2024) не устанавливались вообще.</li>\n<li>Ни в одном окне не заведено службы, ведомства, ордена, компании или государства, занятых монстрами. Полиция дело бросает и, по объяснению героя, поймать мифологических тварей не может.</li>\n<li>Что такое у монстров «более сложное явление, которое я не понимаю» вместо социума (224940) — не раскрыто.</li>\n<li><strong>Семья</strong> (<a href=\"PS-0170.html\">Семья</a>): названия нет, поимённо никто не назван, вселенная в окне не объявлена; вариант отвергнут Славой («Без бафоф») и не переделывался; третью семью (263686) не придумали.</li>\n<li><strong>«Команда тена»</strong> с командиром-волком (173132, 2024-05-25): единственное упоминание, состав и назначение неизвестны. Пункты <strong>«Дилан»</strong> и <strong>«граница»</strong> из того же списка авторы не помнят сами — на 2026-06-09 «Всех помню кроме границы и дилана».</li>\n<li><strong>Пришельцы</strong> (<a href=\"MR-0047.html\">Мир, захваченный пришельцами</a>): есть «вождь или тянка», но структуры, названия и численности нет; линия ни с чем не связана и после 2024-08-08 не продолжалась.</li>\n<li>Организации <strong>Насла, Загик, Нора</strong> и «ассоциация» (<a href=\"SP-0120.html\">Чёрный ящик</a>, версия 14, 2026-06-17) названы в записи, входящей в список «монстров», но окно w0122 помечено «вселенная: неясно». Отнести их к «монстрам» на основании переписки нельзя.</li>\n<li>Правило «Чаще всего эти благословенный создают какую-то организацию» (279029) объявлено в отрезке вселенной «Апостол». Действует ли оно в «монстрах» — не сказано.</li>\n<li>В разделе «Группы» справочника (<a href=\"GR-0001.html\">Апостолы (организация апостолов, «благословенные Богом»)</a>–<a href=\"GR-0037.html\">Группа сверхлюдей (ГГ)</a>) нет ни одной записи, отнесённой к вселенной «монстры».</li>\n</ol>\n<h3>Население и классы</h3>\n<ol start=\"45\">\n<li><strong>Название расы рыболюдей</strong> не закреплено — только «рыба человек», «рыбочеловек», «рыбомонстр». Точный список их физических способностей не проговорён.</li>\n<li><strong>Связь озёрной «Твари»</strong> (215834), объявленной первым монстром и «новым видом монстров», с рыболюдьми из истории 17 августа нигде не проведена.</li>\n<li><strong>Связь монстров с грибницей</strong> в самом раннем слое (2024-07-31) — порождены ею или отдельны — не проговорена.</li>\n<li>Кто <strong>натравил гоблинов-карликов</strong> на дом Защитника: вопрос Славы (224957) прямого ответа не получил.</li>\n<li><strong>Горгона</strong> — единичное существо или вид, не сказано; автор отдельно заявляет, что про неё намеренно ничего не известно.</li>\n<li><strong>Векторный шар</strong> «чего-то ждёт» от носителя («че интересно он ждет от меня, потом спрошу», 226088) — чего именно, не выяснено.</li>\n<li>Перечни типов зарождения монстров (217892–217902) машинные; авторским в них является только выбор пунктов 10 и 12 и комментарии. Полноценной авторской типологии зарождения в переписке нет.</li>\n<li><strong>Механика перехвата контроля над телом</strong> когтями Существа обещана Славой «в 3 часть» (257159) — этой части в окне нет.</li>\n<li>Как тварь из окна w0064 (2024-11-13) связана с правителем нашего мира из окна w0070 (2025-01-06) — не сказано; в базе они сведены по совпадению имени.</li>\n</ol>\n<h3>Система способностей</h3>\n<ol start=\"54\">\n<li><strong>Как связаны между собой пять систем сил этой вселенной</strong> — не сказано ни разу. Ноябрьский слой (сосуд, структура, кристаллизация, затравка, секты, семья, чёрные/белые/серые маги) ни одной репликой не сведён с августовским (вера, родитель, знающие, материализация).</li>\n<li><strong>Судьба свода «принципы материализации и её продуктов»</strong>: 2024-08-12 (218509–218511) Миколай объявляет «концепция обосраная» и предлагает писать как хочется. Явной отмены правил нет, утверждения тоже нет; согласился ли Слава с этим режимом — из окна не следует.</li>\n<li>Без ответа остались возражения Славы: почему не появляется бог, в которого верят миллионы (217958, 217996; «я позже напишу» — ответа в дальнейших окнах нет); почему не появляется монстр у сатанистов и культистов (218468); «Хотение и вера разные вещи» (218011); недостижимость требуемой детальности воображения родителя (218445); «Тогда он должен быть бессмертным если вера влиять одинаково» (217990) — окно обрывается на этой реплике.</li>\n<li>Сколько всего <strong>«заповедей»</strong> у духа и какие они — не сказано нигде.</li>\n<li>Предложение Славы <strong>убрать ограничение видения</strong> (218415) осталось без принятого решения.</li>\n<li>Как именно измеряется <strong>«качество вклада знающего»</strong> и что считается рационализацией — не сказано.</li>\n<li>Есть ли у системы «энергия, сосуд, структура» какая-либо <strong>шкала уровней</strong>, хотя сказано, что беглецы «по уровню друг другу разный».</li>\n<li>Что происходит с носителем, если <strong>сосуд «не выдержит»</strong> при изменении.</li>\n<li>Можно ли <strong>вырастить или встроить сосуд взрослому</strong> — на прямой вопрос ответ был только про детей («Детей с сосудом находят и выращивают»), про встраивание не ответили.</li>\n<li><strong>Детали резонанса</strong> сосуда и структуры (<a href=\"SP-0123.html\">Резонанс сосуда и структуры</a>) не расписаны, только сам принцип. <strong>Механика глаз</strong> (<a href=\"SP-0124.html\">Глазки</a>) не раскрыта, только место в системе комбинаций.</li>\n<li><strong>Механика черпания силы</strong> у чёрных/белых/серых магов и её ограничения не описаны.</li>\n<li><strong>Чёрный ящик</strong>: список из 20 способностей так и не составлен; итог по Пламенному не выбран, способность в ящик не встроена; не решено, войдёт ли Кристал в итоговый список — Слава считает, что он «вообще не к месту». Соотношение ящика образца 2024-11-17 (структура, кубик, 10 минут) и образца 2025-04-18 (кочевой артефакт, запрос, плата жизненной силой) авторы не оговаривали; в версиях 2026 года свойства не описаны — описание отложено самим Славой.</li>\n<li><strong><a href=\"SP-0113.html\">Стенд Миколая</a></strong>: неясно, сохраняются ли стендом только предметы или и живое.</li>\n<li><strong><a href=\"SP-0105.html\">использование монстров спасателем</a> / <a href=\"SP-0106.html\">жук-галлюциноген</a></strong>: границы механики использования монстров спасателем не описаны — разговор оборван просьбой не спойлерить.</li>\n<li><strong><a href=\"SP-0116.html\">Волшебное слово «пожалуйста»</a> / <a href=\"SP-0117.html\">слово «пожалуйста»</a></strong>: не проговорено, реальная ли это сила мира или буквальное детское прочтение вежливости; что за «монстр», порождённый верой, не раскрыто («увидишь»). <strong><a href=\"SP-0115.html\">Трипл Хук</a></strong>: не сказано, откуда у Крима «Трипл Хук».</li>\n<li><strong>система ауры <em>(статьи ещё нет — <a href=\"kb/ID-0093-sistema-aury.html\">исходник</a>)</em> («система ауры»)</strong>: неясно, часть ли это той же вселенной.</li>\n<li>Кто <strong>второй рассказчик</strong> в правиле «смерть это право, смерть это навык» — автор прямо говорит «и я хз кто это / я ваще не заморачивался» (248142–248143).</li>\n<li>У системы «энергия, сосуд, структура» <strong>названия в чате нет</strong>, Слава называет это «концепт силы»; это повтор более раннего обсуждения, оригинал в разобранных окнах не найден.</li>\n</ol></div>", "r": [["система ауры", "kb/ID-0093-sistema-aury.html"], ["Апостолы (организация апостолов, «благословенные Богом»)", "GR-0001.html"], ["Группа сверхлюдей (ГГ)", "GR-0037.html"], ["Кирилл", "PS-0049.html"], ["Владелец чёрного ящика", "PS-0169.html"], ["Семья", "PS-0170.html"], ["Пламенный", "SP-0021.html"], ["Чёрный ящик", "SP-0120.html"], ["Резонанс сосуда и структуры", "SP-0123.html"], ["Глазки", "SP-0124.html"], ["Стенд Миколая", "SP-0113.html"], ["использование монстров спасателем", "SP-0105.html"], ["жук-галлюциноген", "SP-0106.html"], ["Волшебное слово «пожалуйста»", "SP-0116.html"], ["слово l\">Чёрный, белый и серый миры</a>, <a href=\"MR-0068.html\">Существо с длинными руками</a>, <a href=\"MR-0070.html\">Энергия, сосуд и структура</a>, <a href=\"MR-0071.html\">Мир сект и сбежавших сверхлюдей</a>, <a href=\"MR-0072.html\">Три элемента: сосуд, тело, структура</a>, <a href=\"MR-0073.html\">Кристаллизация энергии</a>, <a href=\"MR-0074.html\">Затравка</a></li>\n<li><strong>Упоминает монументы:</strong> <a href=\"MN-0004.html\">склад спасателя</a>, <a href=\"MN-0007.html\">Колосс</a>, <a href=\"MN-0008.html\">Степь с руинами</a>, <a href=\"MN-0009.html\">Озеро перерождения</a></li>\n<li><strong>Упоминает группы:</strong> <a href=\"GR-0001.html\">Апостолы (организация апостолов, «благословенные Богом»)</a>, <a href=\"GR-0025.html\">Фантазёры (творцы)</a>, <a href=\"GR-0026.html\">Пресрог (преступная организация)</a>, <a href=\"GR-0037.html\">Группа сверхлюдей (ГГ)</a></li>\n<li><strong>Упоминает истории:</strong> <a href=\"IS-0017.html\">Защитник</a>, <a href=\"IS-0028.html\">Хоррор с организацией</a></li>\n<li><strong>Упоминает прозу:</strong> <a href=\"PR-0020.html\">Поехали группа друзей на озеро (история про тварь)</a>, <a href=\"PR-0021.html\">Набросок про монстра-хранителя секрета</a>, <a href=\"PR-0022.html\">История про Беркута</a>, <a href=\"PR-0023.html\">Я защитник</a>, О трубадур, дурак наш бравый (история о трубадуре) <em>(статьи ещё нет — <a href=\"kb/PR-0024-o-trubadur-durak-nash-bravyy-istoriya-o-trubadure.html\">исходник</a>)</em>, <a href=\"PR-0025.html\">История про цветы</a>, <a href=\"PR-0026.html\">История про Горгону и Асешу («ну завтра я точно смогу пригласить Асешу погулять»)</a>, <a href=\"PR-0027.html\">История про похищение (записки узника)</a>, <a href=\"PR-0028.html\">История Захара Авгура (часть 1)</a>, <a href=\"PR-0029.html\">История Алека (часть 1)</a>, Эссе: \"Искусство безответной любви: гарантированный путь к одиночеству\" <em>(статьи ещё нет — <a href=\"kb/PR-0030-esse-iskusstvo-bezotvetnoy-lyubvi-garantirovannyy-put-k
