<script>const BASE="";const DOCNAME="монстры";
const LEAD="";
const CH=[{"t": "Зарождение", "a": ["S01", "VS-0015-S01", "VS-0015--zarozhdenie"], "h": "<p>Вселенная записана в базе как <a href=\"VS-0015.html\">монстры</a>, тип — «вселенная», название в шапке — «монстры». В шапке файла: <code>отрезков_объявлено: 2</code>, <code>даты: 2023-05-24 — 2024-11-30</code>, <code>сущностей: 156</code>. Соавторы — Слава и Миколай (в служебных строках файла — «С» и «М»). К разделу «Отрезки жизни» стоит оговорка самого файла: «Границы поставлены по объявлению в чате плюс дате, а не по содержанию. Отрезки могут быть несмежными — это нормально».</p>\n<p>Дословных объявлений в файле два: <strong>2024-08-08</strong> (id 215834–215916, окно w0050) и <strong>2024-09-24</strong> (id 235553–235588, окно w0059). Таблица «Отрезки жизни» при этом содержит одну строку:</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>С</th>\n<th>По</th>\n<th>По какому объявлению</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-08</td>\n<td>2024-12-08</td>\n<td>объявление 215855 — одна вселенная из связанных мини-историй, книга монстров; 235561 закреплено название «монстры»</td>\n</tr>\n</tbody>\n</table></div>\n<p>Правая граница 2024-12-08 не подкреплена в файле ни объявлением, ни цитатой, ни сущностью: последняя сущность вселенной датирована 2024-11-30, последняя проза — 2024-11-13. Откуда взялась эта дата — в файле не объяснено.</p>\n<h3>Из чего выросла (2024-08-08 18:17, id 215834)</h3>\n<p>Вселенная выросла из одной истории Славы, присланной в чат вечером 2024-08-08. Содержание истории в присланном виде: компания друзей поехала на озеро, сняла дом близ озера; один из друзей всю ночь не спал, поэтому по приезде сразу уснул и проснулся уже ночью. Рядом никого не было, он пошёл к озеру, увидел там купающихся, как он думал, друзей, и пошёл купаться с ними. В разговоре он спросил, где остальные, ему ответили, что дома, и он пошёл их звать. У домика двери резко открыли настоящие друзья и спросили, где он был; он встал в ступор, и в этот момент сзади услышал «хлопки мокрый ноги от землю», обернулся — «а там не то человек не то рыба». Он побежал, поскальзываясь и падая, тварь бежала следом; у самой двери он упал на ступеньках, друг втащил его за руку внутрь, дверь сразу закрыли. Вооружились «всем чем можно ( ножами)» и ждали, держась подальше от окон. Тварь влетела в окно, встала в стойку прыжка, прыгнула на самого большого, пытаясь попасть зубами по шее; «качок не промах», увернулся, но упал вместе с ней. Второй пацан начал тыкать тварь «куда только можно», подключились остальные, тварь убили. Тот, кто спал днём, сразу начал хватать вещи и садиться в машину, остальные тоже стали собираться, и в момент отъезда «из озера ещё штук 30 твари вылазит». Финал в присланном виде: «Ну они уехали».</p>\n<p>Отдельно зафиксировано, что это не первый вариант: на вопрос Миколая «с первой попытки? или это не первый вариант истории?» (215842–215843) Слава ответил «Ну в голове с третий» (215844). Реакция Миколая на текст — «норм» (215841), «неплохо» (215845). Дальше: «хочешь прорабатывать?» (215847), Слава — «Не просто» (215849), «Ну вообще да» (215851).</p>\n<p>Сама история занесена в раздел прозы вселенной: 2024-08-08 — «Поехали группа друзей на озеро (история про тварь)», <a href=\"PR-0020.html\">Поехали группа друзей на озеро (история про тварь)</a>, помечена «целиком».</p>\n<p>Слава здесь же предупреждает о занятости: «Если что я дом крашу поэтому в эти пару дней не буду нормально отвечать» (215848).</p>\n<h3>Объявление (2024-08-08, около 18:36, id 215855–215858)</h3>\n<p>Объявление сделано сообщением Славы:</p>\n<div class=\"q\"><p>[215855] Я хочу построить вселенную на из мини истории</p></div>\n<p>и сразу следом:</p>\n<div class=\"q\"><p>[215857] То бишь вот это история / Потом другая связанная с первой но другая</p></div>\n<p>То есть заявлена одна вселенная, собираемая из связанных между собой мини-историй.</p>\n<p>Той же цепочкой Слава называет первого монстра:</p>\n<div class=\"q\"><p>[215858] У нас есть первый монстр / Тварь</p></div>\n<h3>Границы вселенной, как их проговорили авторы (2024-08-08, id 215859–215916)</h3>\n<p>Уточнение рамок идёт сразу за объявлением, вопросами Миколая и ответами Славы.</p>\n<p><strong>Про первого монстра.</strong> Миколай: «так» (215859), «их же дохуя, не?» (215860–215861), «че за тварь» (215862); Слава: «Какого ?» (215863); Миколай: «рыба?» (215864), «или ты о чем» (215865); Слава: «Да» (215866), «Ну типа новый вид монстров» (215867). Тварь из озера — не единичное существо, а новый вид монстров.</p>\n<p><strong>Про происхождение монстров.</strong> Миколай: «мы будем новых создавать, меня имеющихся или полностью пиздить» (215870, в переписке именно так); Слава: «Ну то и то» (215871). Монстры бывают и новые, и переделанные, и заимствованные целиком.</p>\n<p><strong>Про свод монстров.</strong> Миколай: «че в нашей книге монстров будет» (215872); Слава: «В каком смысле ю» (215873); Миколай: «не, ты уже написал» (215874), «ну типа Некрономикон наш» (215875).</p>\n<p><strong>Про формат.</strong> Миколай: «строим огромную историю из кучи маленьких?» (215879). На вопрос Славы «Чё есть идей по монстров / Или нет» (215877–215878) — «ну» (215880), «конечно есть» (215881).</p>\n<p><strong>Про уже существующих монстров.</strong> Миколай: «ейти все незаслуженно забыли» (215883), «лохнеское чудовище» (215884), «их можно по новому раскрыть» (215885). Эти двое попали в состав вселенной отдельной идеей — «Йети и Лохнесское чудовище» (Йети и Лохнесское чудовище <em>(статьи ещё нет — <a href=\"kb/ID-0088-yeti-i-lohnesskoe-chudovische.html\">исходник</a>)</em>, с 2024-08-08). Дальше разговор ушёл в другую сторону, и линия не развивалась.</p>\n<p><strong>Про разделение труда.</strong> Слава: «Сам придумаю мини историю со своим монстром» (215890); Миколай: «ты со своим я со своим?» (215891); Слава: «Да» (215893).</p>\n<p><strong>Про то, что истории объединяет.</strong> Миколай: «а лейтмотив историй» (215892), «что из будет объединять» (215895) и перечисление — «одна вселенная» (215896), «один город» (215897), «одно время» (215899), «одни персонажи» (215900). Слава добавляет: «Можно добавлять персонажей из старых истории» (215898), «Например я спизу у тебя когото» (215901), «Лубок время» (215902), «Хоть какие» (215903). Миколай: «что» (215904), «а» (215905), «пон» (215906).</p>\n<p><strong>Итоговая формулировка границ</strong> — Миколай:</p>\n<div class=\"q\"><p>[215910] получается их объединяет одна вселенная и тематика монстров, больше границ нет<br>[215911] верно?</p></div>\n<p>Ответ «Да» от Славы стоит через две реплики (215915), между ними — «через 600 лет» Миколая (215912), реплика Славы про имя ГГ (215913) и «и тотне обещаю» Миколая (215914). Прямо в тексте не отмечено, к какому именно вопросу относится это «Да»; по порядку сообщений оно идёт после «верно?».</p>\n<p>Из перечисленного Миколаем списка («одна вселенная / один город / одно время / одни персонажи») в итоговой формулировке 215910 остались только «одна вселенная и тематика монстров»; про «один город» дальше в этом объявлении не сказано ничего.</p>\n<p><strong>Про главного героя.</strong> Слава: «Кстати гг мой историй зовут Андрей» (215913). Миколай: «надеюсь Федореев» (215916) — фамилия в чате дальше не подтверждена и не опровергнута. Персонаж «Андрей» есть в составе вселенной (<a href=\"PS-0132.html\">Андрей</a>, 4 версии, с 2024-08-08).</p>\n<p><strong>Про сроки.</strong> Слава: «И что когда придумаешь» (215907), «Сегодня» (215908), «Или завтра» (215909); Миколай: «через 600 лет» (215912), «и тотне обещаю» (215914).</p>\n<h3>Что было до неё</h3>\n<p>Прямо в переписке 2024-08-08 о предшествующей вселенной ничего не сказано. Что было до — в тексте объявлений не изложено.</p>\n<p>Косвенно на существование более ранней вселенной указывает только реплика Славы 2024-09-24: он предлагает выбор «Новая вселенная» (235561) / «Или старая?» (235562) / «Или эта?» (235563). Какая именно «старая» имеется в виду — в переписке не сказано.</p>\n<p>Кроме того, раздел «Что внутри» относит к этой вселенной ряд сущностей с датами <strong>раньше</strong> объявления 2024-08-08:</p>\n<ul>\n<li>способность «Пламенный» (<a href=\"SP-0021.html\">Пламенный</a>, 5 версий, с <strong>2023-05-24</strong>) — самая ранняя дата во всём файле; именно она даёт левую границу диапазона в шапке;</li>\n<li>персонаж «Кирилл» (<a href=\"PS-0049.html\">Кирилл</a>, 6 версий, с <strong>2024-04-03</strong>);</li>\n<li>служебное «Список персонажей Славы» (Список персонажей Славы <em>(статьи ещё нет — <a href=\"kb/SL-0013-spisok-personazhey-slavy.html\">исходник</a>)</em>, 3 версии, с <strong>2024-05-25</strong>);</li>\n<li>мир «7 островов» (<a href=\"MR-0018.html\">7 островов</a>, 7 версий, с <strong>2024-07-03</strong>);</li>\n<li>история «Защитник» (<a href=\"IS-0017.html\">Защитник</a>, 21 версия, с <strong>2024-07-04</strong>) — самая многоверсионная история списка;</li>\n<li>мир «Монстры» (<a href=\"MR-0046.html\">Монстры</a>, 3 версии, с <strong>2024-07-31</strong>);</li>\n<li>мир «Мир, захваченный пришельцами» (<a href=\"MR-0047.html\">Мир, захваченный пришельцами</a>, 2 версии, с <strong>2024-08-07</strong>);</li>\n<li>персонаж «ГГ с особой ДНК (донор)» (<a href=\"PS-0130.html\">ГГ с особой ДНК (донор)</a>, 2 версии, с <strong>2024-08-07</strong>);</li>\n<li>способность «Особая ДНК / золотая кровь» (<a href=\"SP-0095.html\">Особая ДНК / золотая кровь</a>, 4 версии, с <strong>2024-08-07</strong>).</li>\n</ul>\n<p>Почему эти сущности отнесены к вселенной «монстры», хотя датированы раньше объявления, в файле не объяснено.</p>\n<h3>Второе объявление: проверка статуса и решение остаться (2024-09-24, id 235553–235588, окно w0059)</h3>\n<p>Единственное второе объявление файла, помечено как служебное.</p>\n<p>Миколай: «слава» (235553), «а мы че делаем и когда?» (235555), «все ещё на монстрах живём?» (235556).</p>\n<p>Слава: «А бля, фиг знает я пока чисто на учебе и рисование. Хочу прокачать рисование насколько это возможно» (235558). Затем задаёт выбор: «А ты как хочешь ?» (235560), «Новая вселенная» (235561), «Или старая?» (235562), «Или эта?» (235563).</p>\n<p>Миколай выбирает остаться:</p>\n<div class=\"q\"><p>[235564] ну я хочу писать обо всём на свете<br>[235565] пока в моче посидим<br>[235566] тобиж в этой хочу остаться</p></div>\n<p>Слава на это: «Может монстры а не в мочей» (235571), «Ну ок» (235572).</p>\n<p>Договорённость о работе: Слава — «Пиши истории тогда и скидывай» (235573), «А буду ночью читать и говорить обосралься я или нет» (235575). Миколай — «щас когда получиться я сделаю» (235576), «в общем» (235577), «мы договорились» (235578).</p>\n<p>Отдельная реплика Миколая в этом же обмене, без привязки к конкретному решению: «ну в плане всё что остаётся неизменным я оскорбляю, это моя философия» (235574).</p>\n<p>В конце обмена Слава говорит «Возможно не на долго» (235580), на «эх / почему» Миколая (235581–235582) отвечает «Ну может быть мне в голову что то влетит» (235583), «Ну это все в будущем» (235584). Миколай: «а, ну я не против, ладно» (235586). К чему именно относится «Возможно не на долго» — в переписке не уточнено.</p>\n<p>Итог по этому объявлению: смены вселенной не произошло, работа продолжается в той же; изменилось распределение ролей — Миколай пишет и скидывает истории, Слава читает ночью и отвечает.</p>\n<h3>Названия и рабочие обозначения</h3>\n<ul>\n<li><strong>«монстры»</strong> — закреплённое название, стоит в шапке файла и в заголовке. В самом чате возникает 2024-09-24 репликой Славы «Может монстры а не в мочей» (235571) — как поправка к формулировке Миколая. Это наиболее ранняя точка, где название прозвучало как имя вселенной, а не как тема.</li>\n<li><strong>«тематика монстров»</strong> — то, чем описана вселенная в границах 2024-08-08: «их объединяет одна вселенная и тематика монстров, больше границ нет» (215910).</li>\n<li><strong>«моча» / «в моче»</strong> — рабочее обозначение Миколая для текущей вселенной: «пока в моче посидим» (235565), «тобиж в этой хочу остаться» (235566). Слава его отклоняет в пользу «монстры» (235571). Что означает это слово и откуда взялось — в переписке не объяснено.</li>\n<li><strong>«наша книга монстров»</strong> — обозначение свода монстров, не самой вселенной: «че в нашей книге монстров будет» (215872).</li>\n<li><strong>«Некрономикон наш»</strong> — то же самое, названное иначе (215875). Существует как отдельная сущность-мир <a href=\"MR-0049.html\">Некрономикон наш</a> «Некрономикон наш» (1 версия, с 2024-08-08).</li>\n<li><strong>«Монстры»</strong> — отдельный мир <a href=\"MR-0046.html\">Монстры</a> (3 версии, с 2024-07-31), датированный раньше объявления вселенной. Совпадает по названию с вселенной; отношение между ними в переписке не проговорено.</li>\n<li><strong>«одна вселенная»</strong> — рабочая формула объединения (215896, 215910), а не имя.</li>\n<li><strong>«огромная история из кучи маленьких»</strong> — описание формата, данное Миколаем (215879).</li>\n<li><strong>«вселенная на из мини истории»</strong> — исходная формулировка Славы при объявлении (215855).</li>\n<li><strong>«Тварь»</strong> — имя первого монстра, а не вселенной (215858); персонаж <a href=\"PS-0131.html\">Тварь (человек-рыба из озера)</a> «Тварь (человек-рыба из озера)» (1 версия, с 2024-08-08).</li>\n<li><strong>«Андрей»</strong> — ГГ историй Славы (215913), персонаж <a href=\"PS-0132.html\">Андрей</a>.</li>\n</ul>\n<p>В строке события 2024-08-08 прямо отмечено: «Собственного имени вселенной в чате не закреплено». Кроме того, пометы «вселенная не объявлена / не названа» стоят у окон w0051, w0052, w0055, w0063, w0064, w0065 — то есть у большей части рабочего материала; в окне w0052 авторы говорят «наша вселенная».</p>\n<h3>Что файл относит к вселенной</h3>\n<p>Раздел «Что внутри» перечисляет 156 сущностей семи видов. Разбивка по видам: персонажи — 42, способности — 32, миры — 22, служебное — 22, идеи — 19, истории — 11, монументы — 8 (проза считается отдельно, 23 позиции).</p>\n<p>Крайние даты состава: самая ранняя — 2023-05-24 (<a href=\"SP-0021.html\">Пламенный</a> «Пламенный»), самая поздняя — 2024-11-30 (мир «Затравка» <a href=\"MR-0074.html\">Затравка</a>, мир «Кристаллизация энергии» <a href=\"MR-0073.html\">Кристаллизация энергии</a>, мир «Три элемента: сосуд, тело, структура» <a href=\"MR-0072.html\">Три элемента: сосуд, тело, структура</a>, персонаж «Семья» <a href=\"PS-0170.html\">Семья</a>, способности «Глазки» <a href=\"SP-0124.html\">Глазки</a>, «Изменение сосуда» <a href=\"SP-0122.html\">Изменение сосуда</a>, «Резонанс сосуда и структуры» <a href=\"SP-0123.html\">Резонанс сосуда и структуры</a>, «Наследственный механизм смены структуры» <a href=\"SP-0125.html\">Наследственный механизм смены структуры</a>). Эти крайние даты и дают диапазон <code>2023-05-24 — 2024-11-30</code> в шапке файла — счёт, не совпадающий с отрезком 2024-08-08 — 2024-12-08 ни слева, ни справа.</p>\n<p>Самые многоверсионные сущности состава: история «Защитник» (<a href=\"IS-0017.html\">Защитник</a>) — 21 версия; способность «Чёрный ящик» (<a href=\"SP-0120.html\">Чёрный ящик</a>, с 2024-11-17) — 14 версий; персонаж «Беркут» (<a href=\"PS-0134.html\">Беркут</a>, с 2024-08-10) — 9 версий; монумент «Озеро перерождения» (<a href=\"MN-0009.html\">Озеро перерождения</a>, с 2024-11-09) — 8 версий; мир «7 островов» (<a href=\"MR-0018.html\">7 островов</a>) — 7 версий; мир «Существо с длинными руками» (<a href=\"MR-0068.html\">Существо с длинными руками</a>, с 2024-11-13) — 7 версий; мир «принципы материализации и её продуктов» (<a href=\"MR-0057.html\">принципы материализации и её продуктов</a>, с 2024-08-11) — 7 версий; персонаж «спасатель» (<a href=\"PS-0144.html\">спасатель</a>, с 2024-08-17) — 7 версий; персонаж «ГГ-защитник» (<a href=\"PS-0163.html\">ГГ-защитник</a>, с 2024-11-09) — 7 версий.</p>\n<p>Проза вселенной — 23 позиции, от 2024-08-08 до 2024-11-13, помечены как «целиком» либо «обрывок»:</p>\n<ul>\n<li>2024-08-08 — «Поехали группа друзей на озеро (история про тварь)» <a href=\"PR-0020.html\">Поехали группа друзей на озеро (история про тварь)</a> (целиком)</li>\n<li>2024-08-09 — «Набросок про монстра-хранителя секрета» <a href=\"PR-0021.html\">Набросок про монстра-хранителя секрета</a> (обрывок)</li>\n<li>2024-08-10 — «История про Беркута» <a href=\"PR-0022.html\">История про Беркута</a> (целиком)</li>\n<li>2024-08-11 — «История про Горгону и Асешу» <a href=\"PR-0026.html\">История про Горгону и Асешу («ну завтра я точно смогу пригласить Асешу погулять»)</a> (целиком)</li>\n<li>2024-08-11 — «История про цветы» <a href=\"PR-0025.html\">История про цветы</a> (целиком)</li>\n<li>2024-08-11 — «О трубадур, дурак наш бравый (история о трубадуре)» О трубадур, дурак наш бравый (история о трубадуре) <em>(статьи ещё нет — <a href=\"kb/PR-0024-o-trubadur-durak-nash-bravyy-istoriya-o-trubadure.html\">исходник</a>)</em> (целиком)</li>\n<li>2024-08-11 — «Я защитник» <a href=\"PR-0023.html\">Я защитник</a> (целиком)</li>\n<li>2024-08-17 — «История про похищение (записки узника)» <a href=\"PR-0027.html\">История про похищение (записки узника)</a> (целиком)</li>\n<li>2024-08-20 — «История Захара Авгура (часть 1)» <a href=\"PR-0028.html\">История Захара Авгура (часть 1)</a> (обрывок)</li>\n<li>2024-08-21 — «История Алека (часть 1)» <a href=\"PR-0029.html\">История Алека (часть 1)</a> (обрывок)</li>\n<li>2024-08-21 — эссе «Искусство безответной любви: гарантированный путь к одиночеству» Эссе: \"Искусство безответной любви: гарантированный путь к одиночеству\" <em>(статьи ещё нет — <a href=\"kb/PR-0030-esse-iskusstvo-bezotvetnoy-lyubvi-garantirovannyy-put-k-odin.html\">исходник</a>)</em> (целиком)</li>\n<li>2024-08-26 — «Вторая часть истории (голубец, эксперименты, домен монстров)» <a href=\"PR-0031.html\">Вторая часть истории (голубец, эксперименты, домен монстров)</a> (обрывок)</li>\n<li>2024-08-27 — «Здорова, это снова я, и да я жив (продолжение истории про руку)» <a href=\"PR-0032.html\">Здорова, это снова я, и да я жив (продолжение истории про руку)</a> (обрывок)</li>\n<li>2024-08-29 — «Один день из повседневности спасателя» <a href=\"PR-0033.html\">Один день из повседневности спасателя</a> (обрывок)</li>\n<li>2024-09-14 — когда нежность растекаясь по телу <em>(статьи ещё нет — <a href=\"kb/PR-0034-kogda-nezhnost-rastekayas-po-telu.html\">исходник</a>)</em> (целиком)</li>\n<li>2024-09-17 — «на кассе в супермаркете Колосс, моя мама оплачивает покупки» <a href=\"PR-0035.html\">на кассе в супермаркете Колосс, моя мама оплачивает покупки</a> (обрывок)</li>\n<li>2024-09-17 — осматривая панораму на мосту <em>(статьи ещё нет — <a href=\"kb/PR-0036-osmatrivaya-panoramu-na-mostu.html\">исходник</a>)</em> (целиком)</li>\n<li>2024-09-20 — я накрыл сей день на стол <em>(статьи ещё нет — <a href=\"kb/PR-0037-ya-nakryl-sey-den-na-stol.html\">исходник</a>)</em> (целиком)</li>\n<li>2024-10-20 — «люди смертны и это так потрясающе» <a href=\"PR-0038.html\">люди смертны и это так потрясающе</a> (целиком)</li>\n<li>2024-11-10 — «Мини предыстория (ГГ, сестра и существо)» <a href=\"PR-0039.html\">Мини предыстория (ГГ, сестра и существо)</a> (целиком)</li>\n<li>2024-11-11 — «Проснувшись с утра я чувство себя разбитым (школа и задира)» <a href=\"PR-0040.html\">Проснувшись с утра я чувство себя разбитым (школа и задира)</a> (целиком)</li>\n<li>2024-11-13 — «История про гг и существо. Часть 1 (предыстория)» <a href=\"PR-0041.html\">История про гг и существо. Часть 1 (предыстория)</a> (целиком)</li>\n<li>2024-11-13 — «История про гг и существо. Часть 2 (фрагмент, цитата)» <a href=\"PR-0042.html\">История про гг и существо. Часть 2 (фрагмент, цитата)</a> (обрывок)</li>\n</ul>\n<p>Содержание сущностей и тексты прозы в самом файле <a href=\"VS-0015.html\">монстры</a> не приведены — даны вид, название, число версий, дата и путь к отдельному файлу.</p>\n<h3>Расхождения внутри файла</h3>\n<ol>\n<li>В шапке <code>отрезков_объявлено: 2</code>, в таблице «Отрезки жизни» — одна строка. Объявлений-событий действительно два, но второе (2024-09-24) — не начало нового отрезка, а решение остаться в текущей вселенной.</li>\n<li>В графе «По какому объявлению» сказано: «235561 закреплено название „монстры“». Под id 235561 стоит реплика Славы «Новая вселенная» — одна из трёх опций выбора. Название «монстры» звучит в сообщении 235571. В файле это не выправлено.</li>\n<li>Правая граница отрезка 2024-12-08 не подкреплена ничем.</li>\n<li>Диапазон дат в шапке (по крайним датам состава) и отрезок (по объявлениям) — два разных счёта.</li>\n</ol>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Чинить первым надо ноябрьский слой. По числам это видно однозначно: <code>MR-0070</code> «Энергия, сосуд и структура», <code>MR-0071</code> «Мир сект и сбежавших сверхлюдей», <code>MR-0073</code> «Кристаллизация энергии» держат по четыре ссылки каждая, <code>MR-0074</code> «Затравка», <code>SP-0122</code> «Изменение сосуда», <code>SP-0123</code> «Резонанс сосуда и структуры», <code>PS-0169</code> «Владелец чёрного ящика» — по три. И под всеми семью в базе лежит от 2 548 до 7 341 знака. Для сравнения: под августовским сводом <code>MR-0057</code> «принципы материализации» — 20 097 знаков при одной ссылке, под <code>IS-0017</code> «Защитник» — 139 029 при восьми. То есть самая нагруженная часть вселенной накормлена хуже всех остальных.</p></div>\n<div class=\"mnote\"><b>⚙ машинная заметка · С чего начать — не материал авторов</b>\n<p>Ноябрьский слой в базе есть, но разъехался по девяти записям из двух окон: w0064 (2024-11-17, id 258904–259140) — <code>MR-0070</code>, <code>MR-0071</code>, <code>SP-0120</code> версии 1–4, <code>SP-0121</code>, <code>PS-0169</code>; w0065 (2024-11-30, id 263587–263749) — <code>MR-0072</code>, <code>MR-0073</code>, <code>MR-0074</code>, <code>SP-0122</code>–<code>SP-0125</code>, <code>PS-0170</code>. Сначала свести их в один разбор, потом писать статьи.</p></div>", "r": [["дурак наш бравый (история о трубадуре)", "kb/PR-0024-o-trubadur-durak-nash-bravyy-istoriya-o-trubadure.html"], ["гарантированный путь к одиночеству\"", "kb/PR-0030-esse-iskusstvo-bezotvetnoy-lyubvi-garantirovannyy-put-k-odin.html"], ["когда нежность растекаясь по телу", "kb/PR-0034-kogda-nezhnost-rastekayas-po-telu.html"], ["осматривая панораму на мосту", "kb/PR-0036-osmatrivaya-panoramu-na-mostu.html"], ["я накрыл сей день на стол", "kb/PR-0037-ya-nakryl-sey-den-na-stol.html"], ["Йети и Лохнесское чудовище", "kb/ID-0088-yeti-i-lohnesskoe-chudovische.html"], ["Список персонажей Славы", "kb/SL-0013-spisok-personazhey-slavy.html"], ["Андрей", "PS-0132.html"], ["Кирилл", "PS-0049.html"], ["ГГ с особой ДНК (донор)", "PS-0130.html"], ["Тварь (человек-рыба из озера)", "PS-0131.html"], ["Семья", "PS-0170.html"], ["Беркут", "PS-0134.html"], ["спасатель", "PS-0144.html"], ["ГГ-защитник", "PS-0163.html"], ["Пламенный", "SP-0021.html"], ["Особая ДНК / золотая кровь", "SP-0095.html"], ["Глазки", "SP-0124.html"], ["Изменение сосуда", "SP-0122.html"], ["Резонанс сосуда и структуры", "SP-0123.html"], ["Наследственный механизм смены структуры", "SP-0125.html"], ["Чёрный ящик", "SP-0120.html"], ["7 островов", "MR-0018.html"], ["Монстры", "MR-0046.html"], ["Мир, захваченный пришельцами", "MR-0047.html"], ["Некрономикон наш", "MR-0049.html"], ["Затравка", "MR-0074.html"], ["Кристаллизация энергии", "MR-0073.html"], ["Три элемента: сосуд, тело, структура", "MR-0072.html"], ["Существо с длинными руками", "MR-0068.html"], ["принципы материализации и её продуктов", "MR-0057.html"], ["Озеро перерождения", "MN-0009.html"], ["Защитник", "IS-0017.html"], ["Поехали группа друзей на озеро (история про тварь)", "PR-0020.html"], ["Набросок про монстра-хранителя секрета", "PR-0021.html"], ["История про Беркута", "PR-0022.html"], ["История про Горгону и Асешу («ну завтра я точно смогу пригласить Асешу погулять»)", "PR-0026.html"], ["История про цветы", "PR-0025.html"], ["Я защитник", "PR-0023.html"], ["История про похищение (записки узника)", "PR-0027.html"], ["История Захара Авгура (часть 1)", "PR-0028.html"], ["История Алека (часть 1)", "PR-0029.html"], ["Вторая часть истории (голубец, эксперименты, домен монстров)", "PR-0031.html"], ["Здорова, это снова я, и да я жив (продолжение истории про руку)", "PR-0032.html"], ["Один день из повседневности спасателя", "PR-0033.html"], ["на кассе в супермаркете Колосс, моя мама оплачивает покупки", "PR-0035.html"], ["люди смертны и это так потрясающе", "PR-0038.html"], ["Мини предыстория (ГГ, сестра и существо)", "PR-0039.html"], ["Проснувшись с утра я чувство себя разбитым (школа и задира)", "PR-0040.html"], ["История про гг и существо. Часть 1 (предыстория)", "PR-0041.html"], ["История про гг и существо. Часть 2 (фрагмент, цитата)", "PR-0042.html"]]}, {"t": "Масштаб", "a": ["S02", "VS-0015-S02", "VS-0015--masshtab"], "h": "<p>Единого свода «в мире N миров» в переписке нет. О количестве миров и об устройстве пространства высказывались дважды, в разных отрезках, и эти высказывания между собой не сведены.</p>\n<h3>Сколько миров</h3>\n<p>Число названо один раз, Славой, 2024-11-09 (id 255014, окно w0063, запись <a href=\"MR-0066.html\">Чёрный, белый и серый миры</a>):</p>\n<div class=\"q\"><p>«Изначально я хотел чтобы монстры появлялись из других миров / Которых миллиарды и который делаются на черной белый и серый / И вот монстры из черного мира к нам полжуть / И люде из нашего мира могут черпать силу из другого мира ( черный маг белый маг серый маг)»</p></div>\n<p>Миров миллиарды, и они делятся на три разряда — чёрный, белый и серый.</p>\n<p>Формулировка «изначально я хотел» — описание замысла, а не действующего правила: Слава излагает схему как то, чего он хотел, и тут же сам по ней проходится (255022): «Сама задумка вроде не плохая но это снова из хоррора превращается в боевик». Миколай отвечает (255023–255024): «ну по идее можно и из такого сделать хоррор / просто это всё утратит основную идею». Слава (255025): «Да только мало обещающий». Принята схема или отвергнута — в переписке не сказано; разговор уходит на «формулу страха» (255027).</p>\n<p>Второе высказывание о количестве — 2025-01-06 (id 279031, окно w0070), Слава: «Вселенная бесконечная». Числа миров при этом не названо. Важная оговорка: окно w0070 относится к записи <a href=\"MR-0068.html\">Существо с длинными руками</a>, где вселенная объявлена как <strong>«Апостол»</strong>, а не «монстры»; весь материал ниже, помеченный w0070 и w0079, лежит в отрезке другой вселенной и переносится сюда только как то, что стоит в записях списка «монстров».</p>\n<p>Содержательно из трёх разрядов определён только чёрный: из него «монстры к нам полжуть». Чем белый мир отличается от серого — в переписке не сказано. Отражением разрядов в людях названы чёрный маг, белый маг и серый маг.</p>\n<h3>Как устроено пространство</h3>\n<p>Разбор идёт единственным куском — 2025-01-06, id 278869–278889, окно w0070 (вселенная объявлена как «Апостол»). Спрашивает Миколай, отвечает Слава.</p>\n<p>Миколай (278869–278870): «а типа я на краю города могу стоять? он шарик или листок? я упаду на краю? / как это работает».</p>\n<p>Слава (278873): «Ты можешь увидеть конец мира / Если ты упадешь то просто попадешь в другой мир / Он просто кусок нашего мира».</p>\n<p>Отсюда: у мира есть край, край видим, за краем не пустота, а другой мир, и другой мир при этом описан как «кусок нашего мира». Шарик мир или листок — прямо не отвечено. На вопрос про размеры (278882, в контексте того, что правитель может менять свой мир) ответа в окне нет.</p>\n<p>Отдельно от этого во вселенной действует двухслойное устройство. В <a href=\"MR-0050.html\">Дети и животные видят иной мир</a> и <a href=\"MR-0051.html\">Материализация монстров из желаний и веры</a> (2024-08-10, окно w0050) есть «иной мир» и «мир духов» как второй слой рядом с материальным. В своде принципов материализации (id 218392, 2024-08-12) прямо названы «мистическое пространство», «духовный мир» и «реальный мир»: знающий «напрямую материализует в мистическом пространстве монстра», а сила материализации меряется тем, насколько монстр может взаимодействовать «с материальным и духовным миром». Как это двухслойное устройство соотносится с миллиардами миров <a href=\"MR-0066.html\">Чёрный, белый и серый миры</a> — в переписке не сказано.</p>\n<h3>Как между мирами перемещаются</h3>\n<p>Три способа; все названы в окне w0070, 2025-01-06 и 2025-03-10 (вселенная объявлена как «Апостол»):</p>\n<ol>\n<li><strong>Через край своего мира.</strong> Слава (278873): «Если ты упадешь то просто попадешь в другой мир». И (278878): «Связь все миры связаны с нашем миров поэтому случается так что они могут попасть в наш через край своего мира / Мы же пока живы не можем попасть в другой мир». Проход через край работает в одну сторону: чужие к нам — да, мы к ним при жизни — нет.</li>\n<li><strong>Смерть переносит души.</strong> Миколай спрашивает (278874): «порталы?» — прямого ответа про порталы нет; вместо этого Слава пишет (278875): «Смерть таскает наши души в других миры». Повторено развёрнуто (278883): «Существо являющий правителем нашего мира создала смерть которая таскает души в разный миры». Вопросы Миколая о мотивах Смерти (278877): «ей платят за это? нахуя она это делает? вредная привычка?» — без ответа.</li>\n<li><strong>Побег чужемирцев.</strong> 2025-03-10 (id 300890, окно w0079), Слава: «Существа других миров, который сбегают в наш по разным причинам». Механика побега не описана.</li>\n</ol>\n<h3>Какие миры названы</h3>\n<ul>\n<li><strong>Чёрный, белый и серый</strong> (255014, 2024-11-09) — не имена отдельных миров, а три разряда, на которые делятся миллиарды миров.</li>\n<li><strong>Наш мир</strong> — постоянное рабочее обозначение, имени не имеет. В <a href=\"MR-0068.html\">Существо с длинными руками</a> у него есть правитель и создатель.</li>\n<li><strong>Рай.</strong> 2025-01-06 (278868, w0070): «Бог есть в рая он его правитель». Единственный названный мир с названным правителем, кроме нашего.</li>\n<li><strong>7 островов</strong> — не мир в смысле планеты, а каркас сеттинга: семь островов, каждый — город или страна («Остров это город ну или страна», 194775, 2024-07-03). Запись <a href=\"MR-0018.html\">7 островов</a> числится сразу в двух вселенных, и к «монстрам» отнесено только окно w0056 (2024-09-04, id 227721–227731), где Миколай называет 7 островов отсылкой, спрятанной в рисунке, и говорит, что это «мир который может создать твой стенд», работающий «как расширенная территория», «как в мире магической битвы».</li>\n<li><strong>Минимиры.</strong> Слово произнесено один раз, 2025-01-06 (279029, w0070), в перечне того, из кого состоят организации благословенных: «могут быть как и простые люди как и благословенный( от минимиров), а также аномальный люди или даже чужемирцый». Что такое минимиры — не объяснено.</li>\n</ul>\n<p>При записи <a href=\"MR-0066.html\">Чёрный, белый и серый миры</a> стоит помета неясности: вселенная не названа; неясно, тот ли это мир, где происходит проза про ГГ.</p>\n<h3>Чем миры отличаются друг от друга</h3>\n<p>По материалу — практически ничем, кроме разряда (чёрный/белый/серый) и того, что чёрный поставляет монстров. Отличие миров друг от друга нигде не разбирается.</p>\n<p>Подробно разобрано только отличие островов друг от друга внутри мира семи островов, и этот разбор лежит в окнах w0041 и w0042 (2024-07-03 и 2024-07-04), отнесённых к вселенной «7 островов»:</p>\n<ul>\n<li><strong>Оазис</strong>, защитник Имитатор. Слава (194915): «Это можно сказать обычный город с мирными людьми / Вся власть находится у Имитатор он не только защищает но и отвечает за политику». Миколай на это (194916): «понятно, конституционная монархия». Позже (196027): в Оазисе «не война, а мини конфликт», «полноценный войны не будет».</li>\n<li><strong>Остров Нуара</strong> (в исходном списке 194774 идёт без названия: «2 ??????( Нуар ( челек с растворением личности ))»). Миколай предлагает туда тоталитаризм (194919), Слава возражает (194920): «Ну нуар хороший челик / А вообще можно одному из островов». Миколай тогда даёт Нуару федеративную республику (194921).</li>\n<li><strong>Асгар / Асгард</strong>, защитник Избранный. Миколай (194910): «допустим Асгард это уже теократия, тобиж власть у церкви». Слава (196022): «Асгарде остров религии и возможно они будут типо Гитлера», и (196025): «Типо верить что они посланники богов а все остальные демон так они будут воспитывать детей и т.п.».</li>\n<li><strong>Четыре недостающих острова</strong> заданы биомами. Миколай (194780): «болото, тропики, вулканы, айсберг», и под них четыре защитника (194785): «1. блуждающий огненный гриб / 2. дриада великан / 3. тот пламенный перс / 4. юкиона с миниганом в котором снаряд сосульки». Тоталитаризм ушёл на айсберги: «ну тогда дам этот грех женщине / на айсбергах будет тотальный контроль / и ебнутая женщина с миниганом убивать всех ослушивающихся» (194922–194924).</li>\n</ul>\n<p>Почему островов именно семь, Слава объясняет так (194896): «Не знаю / Это число типо не слишком много и не слишком мало». Разделение по авторам (196006): «Именно у тебя утопия / Там и война и революция / У меня почти все мирные острова»; Миколай поправляет (196008–196009): «утопия если что это рай / антиутопия это наоборот», и описывает свою роль (196001–196003): военное положение между тремя островами «скорее всего это будут твои», «а мои чисто на периферии / для раскрытия и глубины». Четыре «острова Миколая» на момент разговора существуют только как биом плюс защитник; Слава (194931): «Ну я даже их в голове продумать не успел / Нужно время».</p>\n<h3>Кто правит мирами</h3>\n<p>Весь этот материал лежит в окнах w0070 и w0079 (2025-01-06 и 2025-03-10), где вселенная объявлена как «Апостол».</p>\n<p>Правители есть у всех миров. Миколай прямо спрашивает (278876): «как он правит? у всех миров есть правители?» — Слава отвечает «Да» (278879). Полномочия правителя (278880): «Он может изменять этот мир как хочешь ведь это его мир».</p>\n<p>Правитель нашего мира — <strong>Существо</strong>. Слава (278868): «Также есть существо в нашем мире который является правителем нашего мира ( но сейчас он не нейтрален, в сюжете пока его не будет)». В навигационной пометке к окну w0070 то же записано как «Сейчас нейтрален, в сюжете пока не появится» — навигация базы и дословная реплика расходятся в частице «не»; что имелось в виду, из окна не восстанавливается.</p>\n<p>Существо создало Смерть (278883). На вопрос «а наш кто создал?» (278884) Слава сначала пишет «Нет» (278885), затем «Существо» (278886).</p>\n<p>Верховного правителя над всеми мирами нет. Миколай (278887): «а есть кто-то кто контролирует все миры?» — Слава: «Нет» (278888), «Но самым сильном является \" существо\"» (278889). При этом на реплику Миколая «но существо вселенную контролирует» (279028) Слава отвечает «Есть» (279030) и добавляет «Вселенная бесконечная» (279031). Как одно сочетается с другим — в переписке не разобрано.</p>\n<p>Правитель рая — Бог (278868).</p>\n<p>Определение Существа менялось. 2025-03-10 (300757–300760, окно w0079) Миколай спрашивает, что такое Существо, потому что забыл, и Слава отвечает: «Существо это ребёнок правителя, который имеет физическую оболочку». Это противоречит определению от 2025-01-06, где Существо само является правителем нашего мира. В переписке противоречие не отмечено и не разрешено.</p>\n<p>В том же окне w0079 Существа помещены в классификацию чужемирцев (300891): «Чужамирцы делятся на: / обычных просто чужемирца с разной анатомии / Существа про них я говорил / Альфы». Об альфах (300892): «Альфы раньше означали сильнейшей разумной субъекты в своём мире, которая имеет, что-то похоже на благословенния». Что означают альфы теперь — не сказано.</p>\n<p>Внутри мира монстров правителя нет. Спасатель (224940, 2024-08-26, окно w0055), в ответ на вопрос «где их мао садао», «ну где их тёмный повелитель, самый главный кого ты хочешь одолеть»: «нет у них никакого предводителя, их(существов) слишком много и нормально все живут вместе».</p>\n<p>Правители островов — не правители миров, а защитники: «7 остров / и на каждом защитник / это разные страны / с разными режимами» (195993–195996). Защитник определён как сильнейший человек острова. Защитники не привязаны к своим островам намертво; Миколай возражает против того, чтобы «защитки чисто сидели» (196119), Слава отвечает (196122): «Сталкер наемник / Имитатор часто будет покидать остров по заданием / А остальные твой челики не знаю».</p>\n<h3>Как миры связаны между собой</h3>\n<p>Прямая формулировка одна, Слава, 2025-01-06 (278878, w0070):</p>\n<div class=\"q\"><p>«Связь все миры связаны с нашем миров поэтому случается так что они могут попасть в наш через край своего мира / Мы же пока живы не можем попасть в другой мир»</p></div>\n<p>То есть связь устроена звездой: все миры связаны с нашим. Связаны ли миры между собой напрямую, минуя наш, — в переписке не сказано.</p>\n<p>Дополнительные каналы связи, названные в других записях:</p>\n<ul>\n<li>Из чёрного мира монстры лезут к нам (255014, 2024-11-09).</li>\n<li>Люди нашего мира черпают силу из других миров, отсюда чёрные, белые и серые маги; уникальность способностей объяснена этим же (255021): «И способности у них всех уникальный так как они черпать силы из разных миллиардом миров».</li>\n<li>Смерть переносит души между мирами (278875, 278883).</li>\n<li>Чужемирцы сбегают в наш мир (300890).</li>\n<li>Наш мир и мир духов связаны детьми и животными (217239, 2024-08-10): «дети и животные могут видеть мистических существ, а до 4 лет психического возраста их душа способна взаимодействовать с иным миром напрямую, поэтому если недоглядеть за ними их за руку могут увести монстры в мир иной и с вами останется лишь их физическая оболочка, так что нужно быть внимательнее». Позже (217622, окно w0051) правило расширено на взрослых, в чью жизнь вмешался злой дух.</li>\n<li>Люди и монстры связаны ментальными сигналами (224940, 2024-08-26): «от людей они сильно зависят, как и люди от них, они связаны ментальными сигналами, но обычно это никак не отражается».</li>\n</ul>\n<h3>Как связаны истории</h3>\n<p>Отдельно от связи миров в объявлении 2024-08-08 задана связь историй между собой (id 215852–215916, запись <a href=\"MR-0049.html\">Некрономикон наш</a>). Слава: «Я хочу построить вселенную на из мини истории / То бишь вот это история / Потом другая связанная с первой но другая» (215855–215857). Миколай переспрашивает: «строим огромную историю из кучи маленьких?» (215879) и сводит правило: «получается их объединяет одна вселенная и тематика монстров, больше границ нет» (215910). Из перечисленных им скреп («одна вселенная», «один город», «одно время», «одни персонажи») Славой подтверждены вселенная, время и возможность переноса персонажей: «Можно добавлять персонажей из старых истории» (215898), «Например я спизу у тебя когото» (215901). Рабочее имя сборника — «Некрономикон наш» (215875).</p>", "r": [["Чёрный, белый и серый миры", "MR-0066.html"], ["Существо с длинными руками", "MR-0068.html"], ["Дети и животные видят иной мир", "MR-0050.html"], ["Материализация монстров из желаний и веры", "MR-0051.html"], ["7 островов", "MR-0018.html"], ["Некрономикон наш", "MR-0049.html"]]}, {"t": "Организации и сообщества", "a": ["S03", "VS-0015-S03", "VS-0015--organizacii-i-soobschestva"], "h": "<p>Организаций как оформленных сущностей у этой вселенной нет: в разделе «Группы» справочника 37 записей (<a href=\"GR-0001.html\">Апостолы (организация апостолов, «благословенные Богом»)</a> … <a href=\"GR-0037.html\">Группа сверхлюдей (ГГ)</a>), и ни одна не отнесена к «монстрам» — <a href=\"GR-0001.html\">Апостолы (организация апостолов, «благословенные Богом»)</a>–<a href=\"GR-0025.html\">Фантазёры (творцы)</a> отнесены к вселенной «Апостол», <a href=\"GR-0026.html\">Пресрог (преступная организация)</a>–<a href=\"GR-0037.html\">Группа сверхлюдей (ГГ)</a> — к «7 островам». Служебный список вселенной (22 записи: Список персонажей Славы <em>(статьи ещё нет — <a href=\"kb/SL-0013-spisok-personazhey-slavy.html\">исходник</a>)</em>, критерии историй для сборника <em>(статьи ещё нет — <a href=\"kb/SL-0027-kriterii-istoriy-dlya-sbornika.html\">исходник</a>)</em>–Ссылки на вики умений (anime-characters-fight) <em>(статьи ещё нет — <a href=\"kb/SL-0047-ssylki-na-viki-umeniy-anime-characters-fight.html\">исходник</a>)</em>) целиком посвящён рабочему процессу соавторов — критериям историй, обучению рисованию, формуле страха, договорённостям о том, как писать; записей об организациях внутри мира в нём нет.</p>\n<p>Всё, что есть, лежит внутри записей других видов — мир, история, персонаж, способность — и чаще всего одной репликой.</p>\n<h3>Секты, выращивающие сверхлюдей (2024-11-17, окно w0064, id 259078–259092, запись <a href=\"MR-0071.html\">Мир сект и сбежавших сверхлюдей</a>)</h3>\n<p>Единственная организация «монстров», у которой есть описанное устройство и конфликт. Изложена Славой одним сообщением (259085) после вопроса Миколая «че за мир тогда, расскажи»:</p>\n<div class=\"q\"><p>«И вот наш мир. Обычный современный мир где все хорошо, но там существует секты который выращивают сверх людей ( то бишь с сосудом) и вот сейчас происходит война сект, и сект в данный момент пытаются либо вернуть либу убить своих сверх людей который от них сбежали чтобы при случай чего не было ножа в спину»</p></div>\n<p>Уточнения тут же:</p>\n<ul>\n<li>Миколай: «типа обычным людям встраивают сосуд или детей с сосудом развивают или че» (259088). Слава: «Детей с сосудом находят и выращивают» (259089). То есть сосуд не встраивается.</li>\n<li>«И все они по уровню друг другу разный» (259087) — о сбежавших сверхлюдях. Шкалы уровней в переписке нет.</li>\n<li>«Владелец черного ящика тоже сбежал из секты» (259086).</li>\n</ul>\n<p>Источник вдохновения назван прямо: «Я недавно смотрел анимацию боёв стикменов», «И там был маломальский сюжет» (259081–259082).</p>\n<p>Членство в секте — это дети с сосудом, найденные и выращенные сектой; «сосуд» — термин из системы «энергия, сосуд и структура» того же дня. Сколько сект, как они называются, кто ими руководит, чем различаются, из-за чего и как идёт «война сект» — не сказано.</p>\n<p>Единственный названный беглец — <a href=\"PS-0169.html\">Владелец чёрного ящика</a> «Владелец чёрного ящика» (2024-11-17): носитель способности «Чёрный ящик», сбежал из секты. Больше о нём в окне ничего нет; позже, 2026-06-14 (id 489890–489903), на просьбу Миколая напомнить, что это такое, Слава отвечает: «Прости я спать хочу», «И мне лень описать его».</p>\n<h3>«Хоррор с организацией» (2024-11-09, окно w0063, id 255001–255053, запись <a href=\"IS-0028.html\">Хоррор с организацией</a>)</h3>\n<p>Замысел объявлен одной репликой Славы: «Вообще я хотел создать хоррор с организаций» (255003). Миколай переспрашивает: «как» (255004). Слава сразу уходит в сторону: «Ну и снова все упирается в систему сил» (255005), и дальше вместо организации разворачивается система миллиардов миров и чёрных, белых и серых магов (255014).</p>\n<p>Что это за организация, чем она занимается, кто в неё входит — в переписке не сказано ни слова. Дальше в окне речь идёт о формуле страха, ГГ-защитнике, озере перерождения и камне желаний.</p>\n<h3>Дело спасателя и писателя (2024-08-17 — 2024-08-29, окна w0053–w0055)</h3>\n<p>Самая проработанная совместная деятельность вселенной. Организацией она нигде не названа, но у неё есть база, общий арсенал, трансляция и разделение труда.</p>\n<p><strong>Спасатель</strong> (<a href=\"PS-0144.html\">спасатель</a>) — персонаж Славы, которого Миколай взял в свои истории. Варианты имени в переписке: Киппер, знакомый, охотник на нечисть, похититель, смотрящий, спаситель. Появляется как безмолвный тюремщик в истории Славы (id 220167–220168, 2024-08-17): фургон, мешок на голову, укол в шею, тёмная комната 5 на 5 метров без дверей и окон, белая комната со столом, суп, потом каша, гладит по голове, на 6-й месяц подаёт узнику под крышкой «бышка рыба человека». Рассказчик опознаёт его как класс: «это не просто псих а какое то охотник на нечисть», «какой то человек убивающий монстров с психологическими проблемами». На прямой вопрос Славы «Кто похититель ?» (220214) Миколай отвечает: «ясен хуй спасатель» (220216), «он же ебанутый на голову» (220217).</p>\n<p>2024-08-20 (id 220649–220650) он входит в историю Миколая как знакомый Захара Авгура: «темный злой силуэт в капюшоне», «уличный парень», «он помешан на всяких мистических существах». Рассказывает, что изгнал монстра Беркута, «Спас детей того города и будущее теперь под его защитой», зовёт Захара на задание. План, которым он подкупает Захара: поймать «гибрида монстра и человека», и все действия с этим существом «будут транслироваться в даркнете».</p>\n<p>Заявление Миколая о роли персонажа (220669–220671): «я хочу твоего спасателя сделать ублюдком)», «то он использует монстров в своих целях для спасения людей», «моего персонажа с помощью какого-то жука заставил увидеть галлюцинацию».</p>\n<p>«Киппер» — то же лицо: «ну это просто спасатель на английском языке» (225608, 2024-08-27). Внешность зафиксирована Славой (225613): «у спасателя не длинный волосы он не ходит в мешковатой одежде и у спасателя на лице шрамы». Собственный мотив (224940): «эти твари мои враги и я их же использую для мести», и в этюде про будни (226088, 2024-08-29): «я хочу увидеть дочку. я устал видеть эти мерзкие лица, устал каждого уничтожать. я хочу жить счастливо и размеренно со своей семьёй. эти изверги, я ненавижу их. их не останется ни одного». Места промысла названы: Хойя-Бача («пойду пока-что в Хойя-Бачу монстров на монстров порыбачу») и Ньюс.</p>\n<p><strong>Писатель</strong> (<a href=\"PS-0151.html\">писатель</a>) — персонаж Миколая, 2024-08-26 — 2024-08-29, окно w0055. Рост 165 при 27 годах. В истории 224940 его речь идёт без кавычек, речь спасателя — в кавычках; Миколай поясняет разметку Славе прямо: «в кавычках говорит твой спасатель» (224962), «без них мой писатель» (224963). Спорит, что люди и монстры не связаны и что «ауры не существует». Ему обещана работа: «тот паренёк займётся вычислениями пока не надоест, деньги сможет с глубин интернета собрать на исследование» (226088). Имя персонажа в окне ни разу не названо.</p>\n<p><strong>Общее имущество и общий язык:</strong></p>\n<ul>\n<li><a href=\"MN-0004.html\">склад спасателя</a> «склад спасателя» (2024-08-29, id 226088): «ладно, погнали покажу склад», «в общем, заходи.. ублюдки, приятного аппетита». Что именно на складе — не раскрыто; по реплике внутри там кто-то содержится и ест.</li>\n<li><a href=\"SP-0109.html\">вещества спасателя</a> «вещества спасателя» (2024-08-26, id 224940): «а вызывать амнезию не одно из наших веществ не умеет», взамен предлагаются «пара народных методов» (кирпич по голове). Есть игла с дозой, которая должна отключать монстра, но не человека.</li>\n<li><a href=\"SP-0108.html\">эфир писателя</a> «эфир писателя» (2024-08-26): писатель ведёт прямую трансляцию прямо во время работы — «ну не в эфире же», «ты эфир остановил?».</li>\n<li>Общее «мы»: «бро, мы походу голубец поймали», «мы и так по локоть в меазмах».</li>\n</ul>\n<p>Названия у их дела нет, руководителя нет, других участников не названо. Кто такие «мы» в речи спасателя — в переписке не сказано.</p>\n<h3>Монстры без предводителя (2024-08-26, окно w0055, id 224940, запись <a href=\"MR-0060.html\">монстры как домен живых существ</a>)</h3>\n<p>Прямой отказ от идеи организации у монстров. Вопрос задан писателем: «и где их мао садао?», «ну где их тёмный повелитель, самый главный кого ты хочешь одолеть, герой наш? и почему никто из людей не знает об этих существах?». Ответ спасателя:</p>\n<div class=\"q\"><p>«нет у них никакого предводителя, их(существов) слишком много и нормально все живут вместе. их инстинкт говорит прятаться от людей, но от людей они сильно зависят, как и люди от них, они связаны ментальными сигналами, но обычно это никак не отражается»</p></div>\n<div class=\"q\"><p>«иногда их отклонения доходят до вмешательства в жизнь людей, тогда их судьбу обречена, общество их не примет. а они более социальные существа, даже не социум у них, а более сложное явление, которое я не понимаю»</p></div>\n<h3>Полиция</h3>\n<p>Единственная государственная служба, которая в «монстрах» действует. Появляется в истории Защитника (<a href=\"IS-0017.html\">Защитник</a> версия 2, 2024-08-11, id 217605–217606; те же куски лежат в <a href=\"PS-0136.html\">Брошенные дети (гоблины)</a> и <a href=\"PR-0023.html\">Я защитник</a>):</p>\n<ul>\n<li>Жена и дочь бегут «в комнату и вызывайте полицию».</li>\n<li>Полиция приезжает по звонку в дежурку, находит разбитые стёкла, изуродованного героя, выпотрошенную жену, вызывает «мед скорую и подкрепления». Следователь сообщает, что дочери в доме и в окраинах не было.</li>\n<li>Итог: «Полиция их искал как мою и дочь но после неудачных попыток, закинул это дело в долгий ящик».</li>\n<li>Объяснение бессилия полиции даёт сам герой: «я ведь уже говорил что эти тварь, мифологический тварь, поэтому поймать полиций их конечно невозможно».</li>\n<li>Почему он не хочет их участия: «Да я рад если бы их поймала полиция их бы просто посадили, а так если я их найду то явно сделаю с ними довольно болезненный вещи».</li>\n</ul>\n<p>Второй раз полиция всплывает как аргумент в разборе истории про Горгону (2024-08-12, id 218223–218225): Слава — «А хули полицию не вызвал раз это повседневка», Миколай — «че полиция сделает». Третий — в <a href=\"MN-0008.html\">Степь с руинами</a> «Степь с руинами» (2024-10-20): полиция и скорая не трогают лежащую там девушку и запрещают трогать другим.</p>\n<p>Никакой службы по монстрам, охотничьей гильдии или ведомства во вселенной не заведено. Место такой службы занимают частные лица — спасатель и Защитник, которого «даже прозвали народным мстителем» (217606).</p>\n<h3>Пришельцы как захватившая мир сила (2024-08-07 — 2024-08-08, окно w0050, id 215636–215644, 215787–215796, запись <a href=\"MR-0047.html\">Мир, захваченный пришельцами</a>)</h3>\n<p>Коллективный субъект с собственной целью, словом «организация» не назван.</p>\n<ul>\n<li>«Мир захватили пришельцы и распылили вирус который убил некоторых людей а некоторым дал способности / Но пришельцы даже так были недовольны им нужен был ещё более подходящая ДНК» (215636).</li>\n<li>«Земля для пришельцов это грубо говоря песочница где они проводят опыты и просто наблюдают / Вирус дал некоторым людям сверхсилы» (215642).</li>\n<li>Мотив достраивает Миколай (215787–215791): «крч, у инопречеленсов вождь или тянка заболели», «нужно спасать», «на их планете нет вещества и вывести не могут», «знают что есть на земле», «но на самом деле этой информации 563 миллиона лет».</li>\n<li>Сюжет со стороны людей (215644): «гг особый ДНК его хватают потом он сбегает и ныкается в разных местах попутно сражаясь, добывает информацию, раскрывает секреты, устраивать бунты».</li>\n</ul>\n<p>Состав: «вождь (или тянка)» и безымянная масса пришельцев. Связанные записи — <a href=\"PS-0130.html\">ГГ с особой ДНК (донор)</a> «ГГ с особой ДНК (донор)», <a href=\"SP-0095.html\">Особая ДНК / золотая кровь</a> «Особая ДНК / золотая кровь», <a href=\"SP-0096.html\">Термоядерный синтез клеток донора</a> «Термоядерный синтез клеток донора». Ни с одной другой линией «монстров» эта линия в переписке не связана и после 2024-08-08 не продолжалась.</p>\n<h3>Коллективы, которые ведут себя как сообщества</h3>\n<ul>\n<li><strong>Брошенные дети (гоблины)</strong> — <a href=\"PS-0136.html\">Брошенные дети (гоблины)</a>, 2024-08-11. Действуют толпой и согласованно, с внятным правилом отбора своей мишени. Подробно — в разделе «Население и классы».</li>\n<li><strong>Рыболюди</strong> — <a href=\"PS-0145.html\">рыболюди</a>. Живут в определённом водном месте: «его отец плавал в месте где обитают рыболюди» (220213); обладают общим знанием о своих генах у постороннего: «чел родился с генами, рыбалюди об этом знают». Сообщества, вождя или поселения у них не описано.</li>\n<li><strong>Семья</strong> — <a href=\"PS-0170.html\">Семья</a>, 2024-11-30. Род с наследственной особенностью и с обучением внутри рода: «в осознанном возрасте они могут пройти традиционное семейное обучение 2 года, а после развиваться так как пожелают» (263734). Названия семьи нигде не звучит, поимённо никто не назван. Подробно — в разделах «Население и классы» и «Система способностей».</li>\n<li><strong>Банда задиры</strong> — <a href=\"PS-0167.html\">Толстяк-задира</a>, <a href=\"PS-0168.html\">Здоровяк (толстый задира)</a>, 2024-11-11 и 2024-11-13. Школьная группа при толстяке-задире: «его недо банда» (255795), «со свой бандой» (256742) — «Вчера гг тоже его избил и вчера в местью со свой бандой он побил гг». Ни состава, ни имени, ни численности.</li>\n</ul>\n<h3>Учреждения фона</h3>\n<ul>\n<li><strong>Колосс</strong> (<a href=\"MN-0007.html\">Колосс</a>, 2024-09-17, id 230869–230874) — супермаркет, место действия истории про Крима: касса, выход, покупатели. Там же продаётся батончик «Андромеда», рекламу которого Крим видел утром. Кроме названия и того, что это супермаркет, ничего не сказано.</li>\n<li><strong>Школа с плохой репутацией</strong> — <a href=\"PS-0163.html\">ГГ-защитник</a> «ГГ-защитник» (2024-11-10, id 255096): родители «каждый раз посылают его в школу с плохой репутации». Миколай уточняет: «тобиж у школы репутация плохая? не у гг или родителей верно» — «Да» (256897, 256901). Учителя «меняются так часто, что я не успевал запоминать имена» (255795).</li>\n<li><strong>Пулитцеровская премия, издательства, даркнет</strong> — история Захара Авгура (<a href=\"PS-0146.html\">Захар Авгур</a>, <a href=\"PS-0147.html\">Дифер Фрог</a>, 2024-08-20, id 220649–220650): шестнадцатый год участия в конкурсе, церемония в записи, премия уходит Диферу Фрогу, «мои работы через неделю признали экстремистскими и поэтому пришлось отдать место второму кандидату», уведомление пришло на почту. Даркнет — площадка трансляции.</li>\n<li><strong>Спортивные клубы</strong> — «я начал посещать все возможный клубы и по боксу и по борьбе и по тэхвондо» (217606).</li>\n</ul>\n<h3>Государственное устройство 7 островов</h3>\n<p>Запись <a href=\"MR-0018.html\">7 островов</a> числится в двух вселенных, и всё государственное устройство лежит в версиях 1–6, отнесённых к вселенной «7 островов» (2024-07-03 — 2024-07-04, id 194774–196123); к «монстрам» отнесена только версия 7 (2024-09-04) с отсылкой в рисунке. Что там названо: «Остров это город ну или страна» (194775); семь островов, на каждом защитник, «это разные страны», «с разными режимами» (195995–195996); преступная организация — «Ну там будет преступная организации» (194887), «ты хочешь создать преступную организацию» (195997), на вопросы «почему преступленая организация везде», «как они и зачем расселись везде» (196120–196121) ответ Славы: «Они не везде есть группа людей и все» (196123); группа сверхлюдей как возможные ГГ — «Наверное будут группа сверх людей» (194889); что прорабатывать — «Политику, экономикю, черты» (194908). Отношения между островами отложены репликой «Давай попозже подумаем» (194999) и в записи не возобновлялись.</p>\n<h3>Сводные списки состава</h3>\n<p><strong>Список персонажей Славы <em>(статьи ещё нет — <a href=\"kb/SL-0013-spisok-personazhey-slavy.html\">исходник</a>)</em> «Список персонажей Славы»</strong> (вселенные: Цветной мир, монстры; 3 версии, 2024-05-25 — 2026-06-09) — единственный авторский сводный перечень, проходящий через «монстров». Один и тот же список повторяется трижды дословно:</p>\n<div class=\"q\"><p>«Энергет, прятки, закон, петля, феникс, Тен, волк, дракон, ци, имитатор, спартанец, вампир, драгоценность, бессмерт, жук, лёд, Дилан, граница, солнце»</p></div>\n<ul>\n<li>Версия 1 — 2024-05-25, окно w0035, id 173127–173136, вселенная «Цветной мир». Просьба: «Надо потихоньку записывать а то я по тихонько забываю» (173129). Расшифрованы только: «Тен 10 форм / Волк командир команды тена с способностю как у волка / Дракон женщина способна превращаться в дракона частично или полностью» (173132) и «Ци ты наверное не помнишь владелец не контролирующий энергий использует посых для контроля» (173133). Способности волка — «Когти скорость инстинкты регенерация» (173135).</li>\n<li>Версия 2 — 2024-09-24, окно w0059, id 235514–235555, вселенная «монстры». Тот же список (235517) и сразу: «И блядь что значит Дилан», «И граница» (235518–235519). Миколай: «не ебу», «я из этих только жука знаю» (235521, 235525), «как будто ты не обо всех писал тут», «в голове придумал но не выписал» (235534–235535).</li>\n<li>Версия 3 — 2026-06-09, окно w0121, id 488786–488789: список повторён, «Че за граница», «Всех помню кроме границы и дилана».</li>\n</ul>\n<p>Из этого списка в базе «монстров» отдельными записями стоят только Дилан <em>(статьи ещё нет — <a href=\"kb/ID-0101-dilan.html\">исходник</a>)</em> «Дилан» и граница <em>(статьи ещё нет — <a href=\"kb/ID-0102-granica.html\">исходник</a>)</em> «граница» — обе как нераскрытые пункты перечня. Единственная упомянутая в нём структура — «команда тена», у которой есть командир: волк. Что это за команда, кто ещё в неё входит — не сказано.</p>\n<p><strong>Реестр «Благословенный / Враг / Церковь / Военный / Сторонний силы / Семь грехов / Существа / Аномалий / Оружие / Артефакты / Идей»</strong> лежит внутри записи <a href=\"SP-0120.html\">Чёрный ящик</a> (версии 5–8 и 12: 2025-01-24 id 284248 и 284300, 2025-01-27 id 284858, 2025-01-28 id 285522, 2025-05-14 id 325799) и относится к вселенной «Апостол». В список «монстров» он попадает только потому, что «Чёрный ящик» стоит в его разделе «Идей:» и в этом качестве повторяется во всех редакциях. Разделы реестра со временем прирастают: сперва «Благословенный / Враг / Идей», потом «Церковь», «Военный», «Сторонний силы», «Семь грехов», «Существа», «Аномалий», «Оружие», «Артефакты», в мае 2025 — «Одержимый». Апостолы в финальной редакции пронумерованы 1–14. Реакция Миколая на объём: «ебаиь ты работяга» (284301).</p>\n<h3>Организации, названные в записях списка, но принадлежащие другим отрезкам</h3>\n<ul>\n<li><strong>Организация Насла, Загик, Нора, ассоциация</strong> — <a href=\"SP-0120.html\">Чёрный ящик</a>, версия 14, 2026-06-17, окно w0122, id 491161–491163. Окно помечено «вселенная: неясно», термины «сл», «ис», «оам» приходят из более поздней линии. Там: «Организация Насла. В этой организации злодеев лишь обычный люди там нету сл или ис»; идеология — «сл и всё кто контролирует оам зло. Абсолютное зло. Дети что получили в руку ядерную бомбу. Монстры что не понимают собственной силы и ответственности. И их цель уничтожить всех сл или подчинить их под строгие правила»; «В данной организации также вступила и секта что считает сл демонами вылезший из ада»; глава — Зана, который «так не считает», о себе — «Главный фанат сл»; отношения с другими — «Некоторая время сотрудничал с загик в гонке за чёрным ящиком. Но в решающей момент когда чёрный ящик был в руках старика. Он предал его ударив в спину и отобрав чёрный ящик», «Он так делал и с другими организацими, по типу Нора. Или ассоциации если те вдруг начали доверять ему». Отнести это к «монстрам» на основании переписки нельзя.</li>\n<li><strong>Общее правило об организациях</strong> — <a href=\"MR-0068.html\">Существо с длинными руками</a>, версия 5, 2025-01-06, окно w0070, вселенная «Апостол» (279029): «Чаще всего эти благословенный создают какую-то организацию, так как в одиночку это просто не возможно / В этой организаций могут быть как и простые люди как и благословенный( от минимиров), а также аномальный люди или даже чужемирцый». Это ближайшее к общему правилу об организациях во всём материале, но объявлено оно не в «монстрах».</li>\n<li><strong>Организация апостолов</strong> — реплика Миколая «о деятельности организации апостолов?» (2025-03-13, id 301925, 301933) и всё связанное с правителями, благословенными и числом благословений лежит в версиях 7–21 записи <a href=\"IS-0017.html\">Защитник</a>, отнесённых к вселенным Апостол, Оам и Феня.</li>\n</ul>\n<h3>Что с чем связано</h3>\n<p>Названо прямо только это:</p>\n<ul>\n<li>Секты (<a href=\"MR-0071.html\">Мир сект и сбежавших сверхлюдей</a>) ↔ Владелец чёрного ящика (<a href=\"PS-0169.html\">Владелец чёрного ящика</a>): он «тоже сбежал из секты», и секты его ловят или убивают (259086).</li>\n<li>Секты (<a href=\"MR-0071.html\">Мир сект и сбежавших сверхлюдей</a>) ↔ система «сосуд/структура» (<a href=\"MR-0070.html\">Энергия, сосуд и структура</a>): секты «выращивают сверх людей ( то бишь с сосудом)» (259085).</li>\n<li>Спасатель (<a href=\"PS-0144.html\">спасатель</a>) ↔ писатель (<a href=\"PS-0151.html\">писатель</a>): общий склад, общие вещества, общий эфир; писателю обещаны вычисления и сбор денег на исследование.</li>\n<li>Спасатель ↔ Захар Авгур (<a href=\"PS-0146.html\">Захар Авгур</a>): знакомые, «он мне не конкурент, поэтому мы с ним дружим»; спасатель втягивает его в похищение с трансляцией в даркнете.</li>\n<li>Спасатель ↔ монстры как домен (<a href=\"MR-0060.html\">монстры как домен живых существ</a>): он же излагает устройство домена и говорит, что предводителя у монстров нет.</li>\n<li>Защитник (<a href=\"IS-0017.html\">Защитник</a>) ↔ гоблины (<a href=\"PS-0136.html\">Брошенные дети (гоблины)</a>) ↔ полиция: полиция ищет и бросает дело, Защитник заменяет её собой.</li>\n<li>«Хоррор с организацией» (<a href=\"IS-0028.html\">Хоррор с организацией</a>) ↔ ГГ-защитник (<a href=\"PS-0163.html\">ГГ-защитник</a>), формула страха (Формула страха <em>(статьи ещё нет — <a href=\"kb/SL-0043-formula-straha.html\">исходник</a>)</em>), чёрные/белые/серые миры (<a href=\"MR-0066.html\">Чёрный, белый и серый миры</a>), маги (<a href=\"SP-0119.html\">Чёрный маг / белый маг / серый маг</a>): всё это один разговор 2024-11-09.</li>\n</ul>\n<p>Отношения между делом спасателя (август 2024) и сектами (ноябрь 2024) в переписке не устанавливались. Семья (<a href=\"PS-0170.html\">Семья</a>) ни с сектами, ни с чем-либо ещё не связана: разговор 2024-11-30 идёт сам по себе. Пришельцы (<a href=\"MR-0047.html\">Мир, захваченный пришельцами</a>) не связаны ни с одной другой линией.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Самая дорогая точка внутри этого слоя — секты. <code>MR-0071</code>: четыре ссылки, 3 541 знак, и на них завязано всё, чем ноябрь вообще отличается от августа — <code>PS-0169</code> (владелец ящика «тоже сбежал из секты»), <code>MR-0070</code> (секты «выращивают сверх людей ( то бишь с сосудом)»), сама статья вселенной и группа <code>GR-0041</code>, у которой статья есть, а материала под ней ноль. Пока не написано, что такое секты, вокруг «войны сект» висят четыре записи и ни одного имени, числа или руководителя.</p></div>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Отдельно — крупные куски без статей: <code>SL-0027</code> «критерии историй для сборника» (22 162), <code>SL-0043</code> «Формула страха» (11 730), <code>SL-0013</code> «Список персонажей Славы» (9 986, две ссылки), <code>SL-0046</code> «Разбор истории Славы по пунктам» (8 277). Это самый большой неразобранный объём в «монстрах», и по содержанию он касается ровно того, чем вселенная была объявлена — сборником связанных мини-историй.</p></div>\n<div class=\"mnote\"><b>⚙ машинная заметка · С чего начать — не материал авторов</b>\n<p><code>SL-0027</code> и <code>SL-0043</code> в архив не требуют вовсе: материал уже в базе, нужны только статьи. <code>ID-0101</code> «Дилан» и <code>ID-0102</code> «граница» — случай безнадёжный по-другому: 4 104 и 4 310 знаков, и все три захода (2024-05-25, 2024-09-24, 2026-06-09) состоят из того, что авторы сами не помнят, что это.</p></div>", "r": [["Дилан", "kb/ID-0101-dilan.html"], ["граница", "kb/ID-0102-granica.html"], ["Список персонажей Славы", "kb/SL-0013-spisok-personazhey-slavy.html"], ["критерии историй для сборника", "kb/SL-0027-kriterii-istoriy-dlya-sbornika.html"], ["Ссылки на вики умений (anime-characters-fight)", "kb/SL-0047-ssylki-na-viki-umeniy-anime-characters-fight.html"], ["Формула страха", "kb/SL-0043-formula-straha.html"], ["Апостолы (организация апостолов, «благословенные Богом»)", "GR-0001.html"], ["Группа сверхлюдей (ГГ)", "GR-0037.html"], ["Фантазёры (творцы)", "GR-0025.html"], ["Пресрог (преступная организация)", "GR-0026.html"], ["Владелец чёрного ящика", "PS-0169.html"], ["спасатель", "PS-0144.html"], ["писатель", "PS-0151.html"], ["Брошенные дети (гоблины)", "PS-0136.html"], ["ГГ с особой ДНК (донор)", "PS-0130.html"], ["рыболюди", "PS-0145.html"], ["Семья", "PS-0170.html"], ["Толстяк-задира", "PS-0167.html"], ["Здоровяк (толстый задира)", "PS-0168.html"], ["ГГ-защитник", "PS-0163.html"], ["Захар Авгур", "PS-0146.html"], ["Дифер Фрог", "PS-0147.html"], ["вещества спасателя", "SP-0109.html"], ["эфир писателя", "SP-0108.html"], ["Особая ДНК / золотая кровь", "SP-0095.html"], ["Термоядерный синтез клеток донора", "SP-0096.html"], ["Чёрный ящик", "SP-0120.html"], ["Чёрный маг / белый маг / серый маг", "SP-0119.html"], ["Мир сект и сбежавших сверхлюдей", "MR-0071.html"], ["монстры как домен живых существ", "MR-0060.html"], ["Мир, захваченный пришельцами", "MR-0047.html"], ["7 островов", "MR-0018.html"], ["Существо с длинными руками", "MR-0068.html"], ["Энергия, сосуд и структура", "MR-0070.html"], ["Чёрный, белый и серый миры", "MR-0066.html"], ["склад спасателя", "MN-0004.html"], ["Степь с руинами", "MN-0008.html"], ["Колосс", "MN-0007.html"], ["Хоррор с организацией", "IS-0028.html"], ["Защитник", "IS-0017.html"], ["Я защитник", "PR-0023.html"]]}, {"t": "Население и классы", "a": ["S04", "VS-0015-S04", "VS-0015--naselenie-i-klassy"], "h": "<h3>Объём понятия «монстр»</h3>\n<p>Определение дано намеренно широким (2024-08-11, id 217869–217882, запись <a href=\"MR-0054.html\">Что такое монстр</a>). Миколай: «вообще монстр это такое понятие, под которое можно всё засунуть» — «от человека до чего-то просто большого», «от обычного персонажа в игре которого надо убить до главного антагониста главного героя», «от уродливой хуепуталы, гибрида всяких живых тварей, до пугающего чувства нахождения под кровати чего-то», «это просто даже событие которое вышло из под контроля», «всё это называется монстром», «а значит всё это даёт большую свободу и спектр возможностей».</p>\n<p>Там же оговорено, что порождение верой — «это один из типов монстров», «один из типов их зарождения», «конечно есть другие». Другие способы в переписке не разобраны.</p>\n<p>Перечни способов зарождения (2024-08-11, id 217891–217911, запись <a href=\"MR-0055.html\">Типы зарождения монстров</a>) Миколай сам называет запросом к нейросети: «эт просто примеры разнообразия хз, захотел у нейронки узнать и заодно кинул сюда» (217911). Авторским в них является только выбор: свой тип он определяет как пункт 10 первого списка — «Порождение коллективным бессознательным» («у меня 10», 217894), и отдельно отмечает как «прикольную идею» пункт 12 третьего списка — «Сущности, являющиеся воплощением нереализованных путей эволюции» (217900). Реакция Славы на перечни: «Ты как то все замудрил» (217906).</p>\n<h3>Самый ранний слой: монстры апокалипсиса и грибница (2024-07-31, id 214171–214186, 214235–214243)</h3>\n<p>Там ещё «монстры апокалипсиса». В версии Миколая они были запечатаны, «их ещё древние мастера убрали в очень глубокое место», выбрались из-за луча квазара. В принятой версии монстры таскают добычу (людей) в грибницы, первая грибница заразила людей, захватила разум и дала одну цель — есть, а размножается перенесением части себя делением. Связь монстров с грибницей — порождены ею или отдельны от неё — в переписке не проговорена.</p>\n<h3>Монстры как домен живых существ (2024-08-26 — 2024-08-29, окно w0055, id 224940, 226088, запись <a href=\"MR-0060.html\">монстры как домен живых существ</a>)</h3>\n<p>Верхний ярус классификации, изложенный внутри истории репликами спасателя:</p>\n<div class=\"q\"><p>«ты сейчас видишь понятие монстр, как ярлык и его субъективное значение. но, на самом деле, в школе не преподают этого, монстры — один из доменов живых существ. в ряду с бактериями, археями или эукариотами. у каждого типа свои особенности, появления, поведения. в общем целая наука»</p></div>\n<p>То есть монстр — не оценка и не ярлык, а таксономический разряд. Отдельная реплика писателя фиксирует, что осётр — «своего рода монстр, но он же из домена эукариотов»: домен определяется не страшностью, а происхождением.</p>\n<p>Устройство сообщества: «нет у них никакого предводителя, их(существов) слишком много и нормально все живут вместе»; «их инстинкт говорит прятаться от людей, но от людей они сильно зависят, как и люди от них, они связаны ментальными сигналами, но обычно это никак не отражается»; «иногда их отклонения доходят до вмешательства в жизнь людей, тогда их судьбу обречена, общество их не примет»; «а они более социальные существа, даже не социум у них, а более сложное явление, которое я не понимаю».</p>\n<p>2024-08-29 (226088) тема заходит с другой стороны: писатель спорит, «что люди и монстры не связаны, утверждая что это отдельный вид», спасатель отмахивается — «согласен, это совсем не аргумент». Там же: «ещё говорит, что ауры не существует. ну ладно, это правда».</p>\n<p><strong>Как отличают монстра от человека</strong> (2024-08-26, id 224940–224968):</p>\n<ul>\n<li>цвет крови: «у тебя в кровь красная, у него синяя. ты хоть одного человека видел, в чьей крови течёт гемоцианин?»;</li>\n<li>реакция на препарат: «был бы монстром, то тебя бы эта доза смогла бы отключить»;</li>\n<li>физика: пойманный «голубец» после удара о землю в отключке — «каждый раз стены ломаются».</li>\n</ul>\n<p>Внешность признаком не является: «это не человек, это монстр, пусть он и выглядит так».</p>\n<h3>Материализованные монстры и два людских сословия</h3>\n<p>Самый проработанный класс существ и связанные с ним роли людей. Полный свод правил приведён в разделе «Система способностей»; здесь — состав.</p>\n<p><strong>Родитель</strong> — первоисточник монстра. «обладает представлением о монстре(характеристики, характер, история)», «имеет в воображении его образ(внешность, способности, ограничения)», «имеет желание которое не может реализовать», «хочет встретить это существо». Роль: «определяет внешность, мотивы, характер и иные характеристики монстра на фундаментальном уровне». Один родитель — один монстр: «у одного родителя один» (218489).</p>\n<p><strong>Знающий</strong> — «знает от родителя о монстре и верит что он существует», «испытывает сильную эмоцию при мыслях о монстре(КПТ на полную)», «описывает галлюцинации связанные с монстром». Роль: «напрямую материализует в мистическом пространстве монстра посредством накопления образов из галлюцинаций. может влиять на характер и образ монстра, но на поверхностном уровне». Знающих много, они усиливают: «знающие его усиливают» (218490).</p>\n<p>Соотношение сословий (2024-08-11, id 217939–217942): «истинная вера только у родителя», «никто не знает существо также как родитель», «без него оно может трансформироваться», «но оно не станет таким же».</p>\n<p><strong>Материализованный монстр</strong> — «дух действующий в соответствии с один мотивом и сценарием сформированным консенсусом хаоса»; «существо создание коллективным бессознательным».</p>\n<p><strong>Злой дух</strong> — не вид, а состояние: «после первого нарушения одной заповеди дух становится злым», «злой дух реализует мотивацию родителя через аморальные методы» (218392). Ранее то же в другой формулировке: «одно убийство делает дух злым» (217868). Какие заповеди и сколько их — не сказано. Внутри истории про Беркута это показано на примере: после гибели Кирилла «нет человека дарующего хоть малейшей позитивной коннотации его существования, вот тогда он стал чистым злом» (217240).</p>\n<p>Обратное отношение — со стороны монстров к человеку (запись <a href=\"MR-0056.html\">Презрение монстров к убийце мирного духа</a>, 2024-08-11, id 217888–217889): за убийство мирного духа «на него падёт проклятие, точнее общее презрение всех монстров поэтому ему жить будет опаснее, он будет постоянно защищаться и убивать, что уже сделает его самого ужасным монстром», «ибо он по правде невинных мож даже только рождённых созданий будет убивать». Это не магический эффект, а общее отношение монстров к убийце.</p>\n<p><strong>Множественность одинаковых монстров.</strong> В истории про Беркута (2024-08-10, id 217239) прямо оговорено: «понятное дело он не первый и не единственный, кто о Беркуте думает, так что это не уникальная материализация, точнее субъективное представление разное у всех, но так это не единственный в своём роде „Беркут“ из той же игры, того же авторства». Позже (217806–217810): «но этих беркутов по миру много / они абсолютно разные / но их объединяет то что он из одной игры». Общая численность класса: «по сути в мире их приличное количество», «но они не разнообразные» (218497–218498).</p>\n<h3>Кто способен видеть монстров</h3>\n<p>Правило дано зачином истории (2024-08-10, id 217239, запись <a href=\"MR-0050.html\">Дети и животные видят иной мир</a>): «дети и животные могут видеть мистических существ, а до 4 лет психического возраста их душа способна взаимодействовать с иным миром напрямую, поэтому если недоглядеть за ними их за руку могут увести монстры в мир иной и с вами останется лишь их физическая оболочка, так что нужно быть внимательнее».</p>\n<p>Детали оттуда же: возраст измеряется не годами, а психическим возрастом (Кириллу 6 лет, «почти 4 психических»); утрата ребёнка выглядит как то, что дома остаётся физическая оболочка; душа, ушедшая с монстром, не знает, что тело умирает, «а значит не сможет вовремя вернуться в тело». Распространители слухов названы «психически маленькие носители информации», которые «своей уверенностью и широким распространением создавали более сильный и чёткий образ монстра».</p>\n<p>Расширение и ограничения (2024-08-12, id 218398–218422, запись <a href=\"MR-0058.html\">ограничение видения монстров</a>): камеры монстра не видят («ты серьёзно думаешь камеры его видят» — «нет», «нихуя»), поэтому показать его по телевизору или в прямом эфире нельзя; кроме детей видеть могут «взрослые в чью жизнь вмешался злой дух» (218412). Слава предлагает: «Давай нафиг уберем в ограничений видения» (218415) — принятого решения в окне нет.</p>\n<h3>Рыболюди (<a href=\"PS-0145.html\">рыболюди</a>, 2024-08-17 — 2024-08-29, окна w0053 и w0055)</h3>\n<p>Раса вселенной Славы. Названия расы как такового в чате не закреплено, встречается только через словосочетания: «рыба человек», «рыбочеловек», «рыбомонстр».</p>\n<p>Первое появление — 2024-08-17, id 220168: узнику вместо каши приносят накрытую большую тарелку, под крышкой «бышка рыба человека». Именно с этого блюда рассказчик понимает, кто его держит.</p>\n<p>Место обитания и наследование — 2024-08-17, id 220209–220220. Миколай: «может это чел который имеет гены рыбочеловека? типа, его отец плавал в месте где обитают рыболюди, кто-то из них… укусил отца этого чела в ключицу, ну и в семяпроводе через кровь или молочные железы проникли гены рыбочеловека». Вариант с зачатием отвергнут прямо — «но это в твоей вселенной кринж», поэтому передача через укус. «мне похуй насколько это реалистично, такой концепт интересен». Ребёнок «родился с генами, рыбалюди об этом знают». Что даёт мутация: охотник «начал над ним опыты проводить и наблюдать за каннибализмом и физическими способностями» — тяга к каннибализму и физические способности; точный список физических способностей не проговорён.</p>\n<p>Свойства вида — 2024-08-29, id 226088, со стороны охотника: «суп из него такой ароматный, постоянная гипермедленная регенерация даже в варёном состоянии это райское наслаждение для моих очей». Регенерация постоянная и работает даже когда существо сварено. Питание: «то, как эта ошибка природы питается этими существами так расслабляет». Охотник ведёт программу: «после 56 тестов я смогу с уверенностью определить его возможности, его днк и другие данные». Тушку рыбомонстра «нарезают» (224940). Место, до которого спасатель шёл за рыбочеловеком, названо — Ньюс.</p>\n<p>Отдельно у похищенного человека есть иммунитет, «способный адаптировать клетки монстров»: «если к нему пришьют органы монстра он не умрёт» (2024-08-20, id 220683–220690, запись <a href=\"SP-0107.html\">иммунитет, адаптирующий клетки монстров</a>).</p>\n<p><strong>Отношение к первому монстру вселенной.</strong> «Тварь» из истории 8 августа (<a href=\"PS-0131.html\">Тварь (человек-рыба из озера)</a>, id 215834) — «не то человек не то рыба», выходит из озера, шлёпает мокрыми ногами по земле, встаёт в стойку прыжка и метит зубами в шею; в конце «из озера ещё штук 30 твари вылазит». Слава объявляет её первым монстром и «новым видом монстров» (215858, 215867). Прямой связи между озёрной тварью и рыболюдьми из истории 17 августа в переписке не проведено — в базе это две отдельные записи.</p>\n<h3>Брошенные дети (гоблины) — <a href=\"PS-0136.html\">Брошенные дети (гоблины)</a>, 2024-08-11, id 217605–217606</h3>\n<p>Вид монстров из истории Защитника, изложен одним заходом, одна версия, дальше не развивался.</p>\n<p>Внешность: «карлик серым оттенка кожи, при этом… имеет длинный когти на руках, и острый зубы, при этом одеты как бомжи». Повадки: врываются в дом через окно телом, ходят толпой («эти карлики к двери в, котором была моя дочь и жена посеменили всей толпой»), лазают по потолку и бьют сверху по затылку, поодиночке подходить боятся. Кромсают лицо, грудь и руки, но «в шею не одна паскуда мне не поцарапала, словно просто хотели причинить боль не убивая». Женщину в доме убили и выпотрошили — «в центре комнаты женщина без пол головы, и ещё выпотрошенная. Не одного внутреннего органа не было внутри так и в доме». Ребёнка унесли.</p>\n<p>Мифологическое объяснение, которое герой находит сам: «Брошенный дети, недоношенный дети которых просто выкидывали их же мамы, они становится злыми духами, и ненавидят детей который получили заботу от родителей. Также ненавидят и всех женщин, а вот о мужчинах не слово, их всегда выкидывала именно мать». Отсюда правило избирательности: «Вот поэтому они не убили меня, ну точнее я так думаю» — оговорка о догадке принадлежит рассказчику.</p>\n<p>Отдельно зафиксировано, что полиция их поймать не может: «эти тварь, мифологический тварь, поэтому поймать полиций их конечно невозможн
