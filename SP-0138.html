<script>const BASE="";const DOCNAME="Мана";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0138-S01", "SP-0138--mehanika"], "h": "<p>Мана обсуждалась 2024-12-21 (id 272354–272857, окно w0067) — в тот же день, что было объявлено средневековье. Модель маны в этой переписке держит Слава; Миколай приносит в разговор представления, вычитанные снаружи, и они не приживаются.</p>\n<p><strong>Исходное предположение (id 272354).</strong> Слава: «Типо мана это сила дарованная высшим ?» Миколай сначала отвечает «хз», «посморим», «ща», «позже», Слава — «Оба», и через час с небольшим Миколай подтверждает: «да» (id 272361).</p>\n<p><strong>Развёрнутая модель (2024-12-21, id 272537).</strong> Ключевое сообщение, приведённое дословно:</p>\n<div class=\"q\"><p>«Мана выделяется из всех объектов буть то камень или жираф<br>После того как он выделится он будет находиться в свой структуре но после разрушится и превратится просто Ману без сильных примесей<br>То бишь вот кладбище а туда выделяется мана смерти и вот она летает но после разрушается и превращается просто Ману который может поглотить любой маг и использовать его для огненного шара»</p></div>\n<p>То есть цикл такой: мана выделяется из любого объекта, одушевлённого или нет — «буть то камень или жираф»; сразу после выделения она сохраняет структуру источника (у кладбища это «мана смерти») и в этом виде летает; затем структура разрушается, и мана становится просто маной «без сильных примесей»; такую ману может поглотить любой маг и пустить в дело — на приведённый в пример огненный шар.</p>\n<p><strong>Уточнение по носителям (2024-12-21, id 272851).</strong> Слава: «Любой объект выделяют Ману / Но не каждой живой существо способное её использовать». Выделение маны — свойство всего сущего, использование — нет.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0138-S02", "SP-0138--ogranicheniya-i-cena"], "h": "<ul>\n<li>Мана из источника не пригодна к употреблению сразу: пока она «находится в свой структуре», она несёт свойство источника (мана смерти с кладбища), и только после разрушения структуры превращается в ману, которую поглощает любой маг. Оговорено, что чистая мана получается «без сильных примесей» — то есть без примесей полностью не сказано.</li>\n<li>Способность выделять ману есть у всего, способность использовать — не у всех: «не каждой живой существо способное её использовать».</li>\n<li>Животные ману не используют. Миколай: «животные» — «имеют ману обычную», и в конце разговора «они не используют» (id 272845–272857).</li>\n<li>Загрязнения маны в модели нет — см. отклонённые варианты.</li>\n</ul>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0138-S03", "SP-0138--nositeli"], "h": "<ul>\n<li>Любой объект — источник маны, живой и неживой: «буть то камень или жираф».</li>\n<li>Любой маг — потребитель: чистую ману «может поглотить любой маг и использовать его для огненного шара».</li>\n<li>Животные — «имеют ману обычную» (Миколай, id 272847), но «они не используют» (id 272857).</li>\n<li>Монстры — «ядовитую» (Миколай, id 272849). Реплика про монстров и ядовитую ману стоит в перечислении рядом с животными; ответа Славы на неё в этом куске нет.</li>\n<li>Места как источники: кладбище выделяет ману смерти.</li>\n</ul>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0138-S04", "SP-0138--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-12-21 (id 272354–272361), окно w0067.</strong> Предположение Славы: «мана это сила дарованная высшим ?». Миколай откладывает ответ и после паузы в 1.1 часа соглашается — «да».</p>\n<p><strong>Версия 2 — 2024-12-21 (id 272508–272537), окно w0067.</strong> Разговор начинается с табу: Миколай приносит формулировку «Табу - это запреты, направленные на защиту маны и предотвращение ее загрязнения или утечки», Слава отвечает «Есть». Миколай: «тогда помимо магии будет скверна» — Слава: «Нет». Миколай спрашивает «а где он?», Слава отвечает «В небесах» и следом «Нет». Миколай: «а че так», «миазмы всякие». Слава: «Какой загрязнения откуда ты это взял». Миколай объясняет, откуда взял: «ну», «я про ману читал», «её происхождение», «и типа у нее связь с такой темкой». Слава: «Не у меня чуть другие представления о Мане». Миколай просит рассказать («рассказывай свои представления», «я имею ввиду что такое мана для тебя»), Слава отвечает «Какие может а не что это» и «Сложно в буквах», предлагает созвон («Ты занят ?» — «звонок?» — «Да» — «без проблем»), после чего всё-таки пишет буквами развёрнутое определение маны (id 272537).</p>\n<p><strong>Версия 3 — 2024-12-21 (id 272721–272722), окно w0067, повтор прежней мысли.</strong> Слава пересылает то же определение маны слово в слово и добавляет: «Напишу как свободен буду». Содержание не меняется — это фиксация.</p>\n<p><strong>Версия 4 — 2024-12-21 (id 272845–272857), окно w0067.</strong> Два разговора идут вперемешку. По мане: Миколай перечисляет «животные» — «имеют ману обычную» — «монстры» — «ядовитую»; Слава добавляет правило «Любой объект выделяют Ману / Но не каждой живой существо способное её использовать»; Миколай заканчивает про животных: «они не используют». Параллельно Слава спрашивает: «Кстати ты знаешь вообще что такое дабу», Миколай отвечает «табу?», «то че делать нельзя», «вот кто-то сказал, так делать нельзя и всё», Слава отвечает «Нет», «Нет» и «Мы же договаривались что это будет как яд созданный разумным существом». К чему относится «это» в последней реплике, прямо не названо; реплика идёт в ответ на вопрос про табу и расходится с формулировкой табу как запретов из id 272508.</p>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S05", "SP-0138-S05", "SP-0138--otklonennye-varianty"], "h": "<ul>\n<li><strong>Загрязнение маны.</strong> Миколай приносит из прочитанного идею загрязнения маны и миазмов. Слава отвергает: «Какой загрязнения откуда ты это взял», «Не у меня чуть другие представления о Мане» (2024-12-21, id 272517, 272521). В итоговой модели вместо загрязнения — примеси структуры источника, которые сами разрушаются.</li>\n<li><strong>Скверна как следствие загрязнения.</strong> Миколай: «тогда помимо магии будет скверна» — Слава: «Нет» (id 272510–272511). При этом ядовитая мана в разговоре остаётся: у монстров она «ядовитая» (id 272849), и в карточке скверна проходит как ядовитая мана. Как одно соотносится с другим, авторы не проговорили.</li>\n<li><strong>Табу как «то че делать нельзя».</strong> Толкование Миколая Слава отвергает дважды («Нет», «Нет») и напоминает про уговор: «Мы же договаривались что это будет как яд созданный разумным существом» (id 272853–272856). При этом формулировку табу как «запретов, направленных на защиту маны», Слава ранее принял репликой «Есть» (id 272508–272509).</li>\n</ul>", "r": []}, {"t": "Связь с другими способностями", "a": ["S06", "SP-0138-S06", "SP-0138--svyaz-s-drugimi-sposobnostyami"], "h": "<ul>\n<li>Мана связана с магией напрямую: чистую ману маг поглощает и превращает в заклинание — «использовать его для огненного шара».</li>\n<li>Гримуары, скверна (ядовитая мана) и табу проходят рядом с маной по карточке; из переписки видно только табу — как запреты на защиту маны от загрязнения и утечки (принято репликой «Есть») и одновременно как «яд созданный разумным существом» по уговору, на который ссылается Слава.</li>\n<li>Мана смерти как разновидность со структурой источника — единственный названный пример структурированной маны.</li>\n<li>Поглощение чужой маны появляется отдельно, при разборе грехов: алчность в варианте Славы — «способность поглощений чужой манный или объектов» (2024-12-24, id 273920, см. <a href=\"SP-0161.html\">Зависть (грех)</a> и <a href=\"SP-0160.html\">Лень (грех)</a> по тому же разбору). Связи этой механики с моделью маны авторы не проводили.</li>\n</ul>", "r": [["Зависть (грех)", "SP-0161.html"], ["Лень (грех)", "SP-0160.html"]]}, {"t": "Пробелы", "a": ["S07", "SP-0138-S07", "SP-0138--probely"], "h": "<div class=\"gaps\"><ul>\n<li>«Сила дарованная высшим» (версия 1) и «выделяется из всех объектов» (версия 2) прямо между собой не сведены: кто такие «высшие» и как дарование сочетается с выделением из камня и жирафа, не сказано.</li>\n<li>Не сказано, сколько мана держится «в свой структуре» до разрушения и от чего это зависит.</li>\n<li>Не сказано, что означают «без сильных примесей»: какие примеси остаются и влияют ли они на заклинание.</li>\n<li>Не сказано, можно ли использовать ману до разрушения структуры — например, ману смерти прямо с кладбища.</li>\n<li>Не сказано, есть ли у мага собственный запас маны, восполняется ли он и есть ли предел поглощения.</li>\n<li>Кто именно способен использовать ману, кроме магов, не перечислено — сказано только, что «не каждой живой существо способное её использовать».</li>\n<li>Ядовитая мана у монстров названа Миколаем, но Славой не подтверждена и не отвергнута; как она соотносится со скверной, которую Слава отверг, осталось нерешённым.</li>\n<li>Определение табу осталось в двух несведённых видах: запреты на защиту маны и «яд созданный разумным существом».</li>\n<li>Часть обсуждения ушла в звонок («Сложно в буквах», созвон 2024-12-21 около 20:00) — что там проговорили сверх записанного, в переписке не отражено.</li>\n<li>Вселенная в карточке помечена как неясная.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0138--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0160.html\">Лень (грех)</a>, <a href=\"SP-0161.html\">Зависть (грех)</a></li>\n<li><strong>Упомянут в способностях:</strong> <a href=\"SP-0137.html\">Магия</a>, <a href=\"SP-0141.html\">Гримуары (книги заклинаний)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0138--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-12-21</td>\n<td>272354–272361</td>\n<td>w0067</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-21</td>\n<td>272508–272537</td>\n<td>w0067</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-21</td>\n<td>272721–272722</td>\n<td>w0067</td>\n<td>неясно (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2024-12-21</td>\n<td>272845–272857</td>\n<td>w0067</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0138-mana.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0138--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0138.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
