<script>const BASE="";const DOCNAME="Дракон";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0080-S01", "PS-0080--proishozhdenie"], "h": "<p>Дракон появляется как пункт в списке персонажей, который Слава выписал по памяти (2024-05-25, id 173128): «Энергет, прятки, закон, петля, феникс, Тен, волк, дракон, ци, имитатор, спартанец, вампир, драгоценность, бессмерт, жук, лёд, Дилан, граница, солнце». Список записывался с оговоркой «Надо потихоньку записывать а то я по тихонько забываю» (id 173129).</p>\n<p>Миколай выбрал из списка пять имён и спросил, кто они: «Тен, волк, дракон, ци, спартанец» / «Кто такие» (id 173130–173131). Ответ Славы по этим пунктам (id 173132) и содержит единственное описание Дракона. Никакой предыстории, места рождения или обстоятельств появления в переписке нет.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0080-S02", "PS-0080--vneshnost"], "h": "<p>Персонаж — женщина. Отдельно внешность в человеческой форме не описана; описана только возможность превращения (см. Способности). Как выглядит драконья форма — размер, цвет, крылья — не сказано.</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0080-S03", "PS-0080--sposobnosti"], "h": "<p>Единственная зафиксированная способность, дословно (2024-05-25, id 173132): «Дракон женщина способна превращаться в дракона частично или полностью».</p>\n<p>Существенно, что превращение оговорено в двух режимах — частичное и полное. Что именно даёт частичное превращение (какие части тела, какие свойства при этом появляются), не расписано. Боевые свойства драконьей формы — огонь, полёт, чешуя, сила — не названы ни в каком виде.</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0080-S04", "PS-0080--svyazi-s-drugimi"], "h": "<p>Дракон входит в список персонажей Славы и разбирается в одном ответе вместе с Теном, Волком и Ци (id 173132–173133):</p>\n<ul>\n<li>Тен — «10 форм».</li>\n<li>Волк — «командир команды тена с способностю как у волка»; на уточняющий вопрос Миколая «Способности волка: когти, клыки, вой?» (id 173134) Слава ответил: «Когти скорость инстинкты регенерация» (id 173135).</li>\n<li>Ци — «владелец не контролирующий энергий использует посых для контроля» (id 173133), с оговоркой Славы «ты наверное не помнишь».</li>\n</ul>\n<p>Принадлежность Дракона к чьей-либо команде или отряду не названа — в отличие от Волка, про которого сказано, что он командир команды Тена. Связь Дракона с этими персонажами — только соседство в списке и в одном ответе.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S05", "PS-0080-S05", "PS-0080--kak-menyalsya"], "h": "<p><strong>2024-05-25 (окно w0035, id 173128–173135)</strong> — единственное состояние. Персонаж назван в списке и расшифрован одной строкой при разборе списка. К нему в переписке больше не возвращались: разговор пошёл дальше по списку, к Волку и Спартанцу.</p>\n<p>В базе значится одна версия, диапазон дат 2024-05-25 — 2024-05-25.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0080-S06", "PS-0080--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имя собственное не названо — только «дракон» как пункт списка.</li>\n<li>Внешность (ни человеческая, ни драконья) не описана.</li>\n<li>Характер не описан вообще.</li>\n<li>Не сказано, что даёт частичное превращение и чем оно отличается от полного, кроме объёма.</li>\n<li>Свойства драконьей формы (огонь, полёт, прочность, размер) не названы.</li>\n<li>Не сказано, на чьей она стороне, входит ли в чью-то команду и с кем взаимодействует.</li>\n<li>Что с ней стало — в переписке не сказано, продолжения обсуждения нет.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["PS-0080--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-05-25</td>\n<td>173128–173135</td>\n<td>w0035</td>\n<td>Цветной мир (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0080-drakon.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0080--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0080.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
