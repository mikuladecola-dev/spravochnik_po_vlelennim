<script>const BASE="";const DOCNAME="Организация злодеев";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0006-S01", "GR-0006--chto-eto"], "h": "<p>Организация злодеев — объединение персонажей вселенной «Апостол», введённое Славой как тема для разработки: «Мотивы организаций злодеев. В их ней организаций есть Альфы и благословенный» (2025-01-22, id 283835). То есть в состав входят две категории носителей силы — Альфы и благословенные.</p>\n<p>На следующий день сверху ставится глава: «При этом глава этой организации будет единственный благословенный правителем нашего мира» (2025-01-23, id 284170), «То бишь она будет грубо говоря сильнейшей» (id 284171). Тогда же под неё подписываются семь грехов и божество: «7 грехов и божество ( помнишь его) Будет слабей главы этой организации но сильней благословенного» (id 284175).</p>\n<p>Организация разрабатывалась как сторона-антагонист: цель линии злодеев сформулирована позже, 2025-03-06 — объединить все миры в один (id 298826).</p>\n<p>Сами мотивы организации, ради которых тема и была объявлена, в переписке так и не сформулированы: Миколай дважды откладывает ответ («я позже отвечу», 2025-01-23, id 284174).</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0006-S02", "GR-0006--sostav"], "h": "<p>Названы категориями и уровнями, а не поимённо.</p>\n<ul>\n<li><a href=\"PS-0185.html\">Глава организации злодеев</a> — глава организации, единственная благословлённая правителем нашего мира; женский персонаж (в репликах «она»), имени нет.</li>\n<li><a href=\"PS-0187.html\">Семь грехов</a> — семь грехов: Похоть, Чревоугодие, Алчность, Лень, Гнев, Зависть, Гордыня.</li>\n<li><a href=\"PS-0193.html\">Божество</a> — божество; введено репликой «7 грехов и божество ( помнишь его)», то есть придумано раньше, но описания в этом окне нет.</li>\n<li><a href=\"MR-0106.html\">Альфы</a> — Альфы, одна из двух категорий, названных в составе организации.</li>\n<li><a href=\"PS-0179.html\">Благословенные</a> — благословенные, вторая категория, названная в составе организации.</li>\n</ul>\n<p>Поимённого состава организации нет: сказано, из каких категорий она собрана и кто на каком уровне иерархии стоит, но перечня конкретных участников с именами в переписке не приводится. Каталоги персонажей, которые Слава скидывает в тех же окнах (рубрики «Благословенный», «Враг», «Семь грехов» и т. д.), формально не подписаны как состав этой организации.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Как развивалось — не материал авторов</b>\n<p>2025-01-22 — заявлено: тема «мотивы организаций злодеев», в составе Альфы и благословенные. 2025-01-23 — вместо мотивов достроена вертикаль: глава, под ней семь грехов и божество, всем грехам розданы способности; ответ на исходный вопрос отложен. 2025-01-24 — ограничили числом (3 благословенных Бога на греха, 5 для остальных) и свели всё в каталог, где часть вчерашних способностей уже стоит на других местах; Гордыня зависла между «словом закон» и отклонённым «выходом за предел». Дальше полтора месяца тишины. 2025-03-06 — вернулись, но не к мотивам, а к цели, и за один день переписали её автора с правителя Кильки на сестру имитатора, а в конце того же дня предложили грехи убрать. 2025-03-10 и 2025-03-13 — вернулись к двум категориям из первой реплики, Альфам и благословенным, и описали их заново, теперь снаружи, глазами арбетара. 2025-08-30 — вернулись к вопросу о главном злодее, но уже через сестру и АЗИП; слова «организация злодеев» в этом окне нет.</p></div>", "r": [["Глава организации злодеев", "PS-0185.html"], ["Семь грехов", "PS-0187.html"], ["Божество", "PS-0193.html"], ["Благословенные", "PS-0179.html"], ["Альфы", "MR-0106.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0006-S03", "GR-0006--obschie-sposobnosti-gruppy"], "h": "<p>Общей для всей организации способности в переписке не названо. Общее у участников — только принадлежность к носителям силы: две категории, Альфы и благословенные, плюс отдельные уровни (глава, семь грехов, божество).</p>\n<p>Из числового правила, заданного для организации в целом, названо одно: «чтобы убить одного греха в максимум надо 3 благословенных именно Бога, А для остальных благословенных надо будет 5» (2025-01-24, id 284276). Формулировка «а для остальных» читается двояко — то ли речь про остальных грехов, то ли про остальных благословенных; в переписке не уточнено.</p>", "r": []}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0006-S04", "GR-0006--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p><strong>Альфы.</strong> Первое определение — «Альфы сильнейший существа в своём мире» (2025-01-22, id 283839).</p>\n<p>Позже определение разворачивается (2025-03-10, id 300891–300907). Сначала раннее состояние: «Альфы раньше означали сильнейшей разумной субъекты в своём мире, которая имеет, что-то похоже на благословенния» (id 300892), после чего Слава сам отмечает, что «теперь я допер» (id 300894). Затем развёрнутая механика: «Альфы это субъекты своего мира, который смогли сцапать кусочек силы своего мира, с помощью ритуала или ещё чего, и вот получив кусочек силы своего мира, они зародилил в себе ядро, которая и вырабатывает энергию, у них нет связи, их нея сила только их нея, а из-за отсутствия связи напряжения на мозг исчезает, так как через мозг больше ничего не проходит, и теперь они по-сути могут использовать свою силу 24/7» (id 300898). Оттуда же следствия: «И так как это их нея сила, а не сторонняя, они могут лечить и баффеть не только себя, а огонь которым они устроили пожар не исчезнет пока его не потушить или пока альфа не умрёт».</p>\n<p>2025-03-13 (id 301806) добавлено, как альфу убивают: сила альфы похожа на арбетарскую, «Они как и мы может использовать свою силу 24/7 без риска повредить мозг. А если сила всегда активна и его защищает, то просто неожиданная атака, на нём не проканает». Поэтому пришлось ждать, «пока какой-нибудь апостол упустить альфю. При этом доведя его до полусмерти». Тело альфы названо самым сложным материалом ритуала становления Арбетаром.</p>\n<p><strong>Благословенные.</strong> Противоположный полюс: сила у них не собственная. «Ведь по правде говоря вся их сила, и не их вообще. Жалкий благословенный получивший силу лишь потому что понравились правителем, но сами они эту силу не добывали» (2025-03-13, id 301806). Там же — уязвимость: «благословенный не могут использовать благословенния долга, поэтому можно просто неожидано напасть и убить и всё». Что такое «благословение долга», в окне не раскрыто.</p>\n<p>Ограничения благословения проговаривались и раньше: «Благословений это временная сила, типа еë нельзя долго сохранять. Например огонь стрельнуть по дереву оно горит, а после отключение благословенной огонь сразу исчезает» (2025-01-13, id 281379); «Благословений не может быть активным постоянная, это тратит выносливость» (id 281382). И запрет на две функции: «апостолы не способны лечить и влиять на разум», «Благословенный вообще все» (2025-03-13, id 301867–301868).</p>\n<p>Таким образом, различие Альфы/благословенные проведено по трём точкам: чья сила (своя против сторонней), можно ли держать её включённой (24/7 против траты выносливости), можно ли лечить и баффать других (можно против нельзя).</p>\n<p><strong>Семь грехов.</strong> Способности розданы 2025-01-23 (id 284176):</p>\n<ul>\n<li>Похоть — «Контроль разума с ограничением. То бишь она может повысить какое то чувство или вызвать галлюцинаций или наоборот понизить какой то чувство».</li>\n<li>Чревоугодие — «ок» (то есть принято без изменений; что за способность имелась в виду, в этом сообщении не расшифровано).</li>\n<li>Алчность — «Я думал больше о способности поглощений чужой манный или объектов».</li>\n<li>Лень — «я думал телекинез типа лень чё то делать вот и телекинез ( здесь ещё в придачу владений магий ветра, как никак они связаны)».</li>\n<li>Гнев — «ну ок».</li>\n<li>Зависть — «Полной перевоплощение тому кого завидуешь, под полный подразумевается полной копирование сил, магии, одежды, внешность но не характера».</li>\n<li>Гордыня — «Слово закон с ограничением».</li>\n</ul>\n<p>На следующий день, 2025-01-24, в сводном каталоге (id 284278, повтор id 284300) грехи записаны короткими пометками, и часть пометок расходится с раздачей от 23-го:</p>\n<ul>\n<li>Гнев (сила)</li>\n<li>Похоть (контроль разума)</li>\n<li>Зависть (полной копирование)</li>\n<li>Алчность (всё моей)</li>\n<li>Гордыня — без пометки способности</li>\n<li>Чероугодия (поглощения)</li>\n<li>Лень (контроль территории)</li>\n</ul>\n<p>То есть поглощение 2025-01-23 стояло у Алчности, а 2025-01-24 в каталоге стоит у Чревоугодия; у Алчности вместо него «всё моей». У Лени вместо телекинеза с магией ветра — «контроль территории». Обе записи оставлены как есть, объяснения перестановки в переписке нет.</p>\n<p><strong>Гордыня отдельно.</strong> 2025-01-24 Слава возвращается к ней: «Греху гордыни какая способность» (id 284255), «Типо слова закон, че то я не могу представить битву» (id 284256). Миколай предлагает «выход за предел» (id 284257) и объясняет: «типа он гордится силой, отрицая ограничения тела. он легко способен сбросить естественные биологические ограничители, но после такие травмы получить» (id 284271). Следом он присылает список самих ограничителей (id 284274): центральный регулятор усталости, болевые рецепторы, терморегуляция, инстинкты самосохранения — с примечанием, что тренировки и адаптация могут «обмануть» эти системы, повышая выносливость, но с риском перегрузок. Реакция Славы: «Ну пока звучит плохо» (id 284273). Миколай сам понижает статус предложения: «ну можно как одна из его особенностей но не основная» (id 284275). Итог не зафиксирован: в каталоге того же дня у Гордыни остаётся только корона без пометки способности.</p>\n<p><strong>Божество.</strong> Отдельным уровнем не описано. Единственное содержательное про него — что оно того же ранга, что семь грехов: слабее главы, сильнее благословенного (2025-01-23, id 284175). В каталогах того же окна «Божество 😵» числится в рубрике «Враг» (2025-01-24, id 284248). Тогда же Слава предлагает Миколаю угадать, кто из врагов чужамирец (id 284249–284250); ответа в этих сообщениях нет.</p>\n<p><strong>Глава.</strong> Отличается от всех тем, что она единственная благословлённая правителем нашего мира, и именно из этого выводится её сила: «То бишь она будет грубо говоря сильнейшей». Никаких конкретных способностей ей не назначено, имени нет.</p>", "r": []}, {"t": "Иерархия", "a": ["S05", "GR-0006-S05", "GR-0006--ierarhiya"], "h": "<p>Собрана 2025-01-23 (id 284170–284176) и уточнена числом 2025-01-24 (id 284276):</p>\n<ol>\n<li>Глава организации — единственная благословлённая правителем нашего мира, сильнейшая; выше неё в организации никого не названо.</li>\n<li>Семь грехов и божество — «Будет слабей главы этой организации но сильней благословенного».</li>\n<li>Благословенный — нижний из названных уровней.</li>\n</ol>\n<p>Числовая мера разрыва между вторым и третьим уровнем: «чтобы убить одного греха в максимум надо 3 благословенных именно Бога, А для остальных благословенных надо будет 5» (2025-01-24, id 284276).</p>\n<p>Куда в этой лестнице встают Альфы, в переписке не сказано: они названы в составе организации (2025-01-22), но в иерархию 2025-01-23 не вписаны.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S06", "GR-0006-S06", "GR-0006--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>С благословенными и апостолами.</strong> Отношение задано через шкалу силы: грехи сильнее благословенных, и убийство одного греха требует группы благословенных. Отдельно, вне разговора об организации, зафиксирована неприязнь Арбетара к апостолам: «Эти апостолы не пойми кем себя возомнили и везде понаставили свои порядки, на чужой силе» (2025-03-13, id 301806).</p>\n<p><strong>С другими мирами.</strong> Препятствие цели названо Миколаем: «ну как минимум это независимость других миров и конкуренция. в плане препятствий» (2025-03-06, id 298827).</p>\n<p><strong>Сестра имитатора и правитель Кильки.</strong> В обсуждении цели (2025-03-06) главным злодеем сначала назван правитель Кильки, потом сестра имитатора (см. следующий раздел). Позже, 2025-08-30, Слава пишет: «Есть сестра благословенная правителем Кильке. Да она сильнее одного апостола. Но дальше че. Это не та сила, что поставит на колени весь мир. А её подручный всё слабее апостолов. Каждый из них один на один против апостолов продует. При этом у них не такая большая группировка» (id 359684) и «Нет сестра так и останется ключевым злодеем. Но кто в её команде должен быть настолько сильном что перевернёт хот битвы» (id 359688). Что «сестра, благословенная правителем Кильке» и глава организации злодеев («единственный благословенный правителем нашего мира») — одно лицо, в переписке не сказано; связь здесь не фиксируется.</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S07", "GR-0006-S07", "GR-0006--kak-menyalas"], "h": "<p><strong>2025-01-22 (id 283833–283842).</strong> Тема объявлена. «В их ней организаций есть Альфы и благословенный». Тут же Миколай выясняет рамку: «альфы?», «а дьявол существует?», «миры разные всё ещё есть?». Ответы: Альфы — сильнейшие существа в своём мире; разные миры есть — «Да»; про дьявола — «Возможно».</p>\n<p><strong>2025-01-23 (id 284147–284176).</strong> Введена глава: единственная благословлённая правителем нашего мира, сильнейшая. Под неё поставлены семь грехов и божество. Розданы способности всем семи грехам. Миколай в этот момент отвечать не может: «я позже отвечу».</p>\n<p><strong>2025-01-24 (id 284255–284302).</strong> Возврат к Гордыне, предложение Миколая «выход за предел» и его отклонение Славой («Ну пока звучит плохо»). Добавлено правило убийства греха (3 благословенных Бога, для остальных 5). Слава сводит всех в общий каталог, где грехи записаны короткими пометками; часть пометок расходится с раздачей 23-го числа. Миколай: «остальные грехи сейчас норм?» — Слава: «Ну да».</p>\n<p><strong>2025-03-06 (id 298826–298857).</strong> Сформулирована цель. Три состояния подряд, все в один день:</p>\n<p><em>Первое (id 298826).</em> «Цель главного злодея объединить всё миры в один, конечно главным будет Килька, таким образом наш правитель хочет иметь контроль над другими мирами». Открытые вопросы, поставленные тут же: препятствия достижения цели, что злодеям нужно, что за артефакт был у агрегата и зачем им благословенный Фениксом. Про мотив сестры имитатора: «А зачем это сестре имитатора, не знаю но придумаю».</p>\n<p>Ответы Миколая (id 298827): препятствия — независимость других миров и конкуренция; артефакт «по типу медиатора позволял менять натяжение струн пространства всех миров», при игре на правильной частоте владелец мог применять свою способность на увеличенной площади или на далёком расстоянии, «передовая по волне струны», а если этот артефакт использует правитель или пропускает его через какую-то установку — «можно воздействовать на струнную связь между мирами»; сам он помечает это как «сырую идею». Про Феникса: «благословлённый фениксом имеет способность создавать на вечность большое количество пламени, что можно либо как топливо использовать либо для того чтобы нагреть стены, расшевелить и сделать больше похожими на частицы».</p>\n<p><em>Второе (id 298834–298843).</em> Правка авторства цели: «И вообще мир будет объединять сестра имитатора, а не правитель». Прежняя версия с правителем не переписывается, а заменяется. Добавлено условие обряда: «Нужно хотя бы 16 вещей так как сюжет должен быть длинным» (id 298841). Механизм по Миколаю: «какое-то крупное сооружение размером с гору, какой-то механизм, который можно объединить собрав артефакты 🤔 разных миров и запитав огнём благословенного фенриром, ибо он самый мощный и есть ещё какая-то особенность» (id 298843). В этой реплике источник огня назван «фенриром», в предыдущей — «фениксом»; расхождение в переписке не оговорено.</p>\n<p><em>Третье (id 298844–298857).</em> Финальная битва — «у озера будет красиво», «ну наверное это будет что-то из средних миров». Рай и ад откладываются: «ну рай или ад оставим на последок» (id 298851), «Так в конце объединятся только мелкие и некоторый средний миры, а рай и ад останутся наверняка» (id 298853). Тогда же Слава считает: «12 злодеев пока», «Ну в списке моём» (id 298847–298848), и на вопрос «кто?» присылает весь каталог, а затем уточняет одним словом: «Враг» (id 298852). В присланной рубрике «Враг» четырнадцать позиций; расхождение с числом 12 не оговорено.</p>\n<p>Там же — предложение убрать грехи: «Грехи нужно убрать, а то тупо» (id 298854). Дальше Миколай спрашивает «то есть там битвы быть не может последней?» и добавляет «ну просто в сюжет не совсем входят» (id 298855–298856), а Слава отвечает про другое: «В нашем мире Не кто из кильке не может, не покинуть его пока не умрёт» (id 298857). К чему относятся реплики Миколая — к раю и аду или к грехам — из текста однозначно не следует; решения по грехам в переписке нет.</p>\n<p><strong>2025-03-10 (id 300891–300907).</strong> Переопределены Альфы: ядро вместо связи, своя сила, отсутствие нагрузки на мозг, работа 24/7, возможность лечить и баффать других, неугасающий огонь. Старое определение («сильнейшие разумные субъекты в своём мире, имеющие что-то похожее на благословение») в этой же реплике помечено самим автором как прежнее.</p>\n<p><strong>2025-03-13 (id 301806–301874).</strong> Обе категории описаны с внешней позиции — устами Арбетара, для которого они материал ритуала: благословенного убить легко, альфу сложнее всего. Тогда же подтверждено, что благословенные все не лечат и не влияют на разум.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "GR-0006-S08", "GR-0006--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Мотивы организации — то, ради чего тема и была объявлена 2025-01-22, — так и не сформулированы. Миколай откладывает ответ, разговор уходит в иерархию и способности.</li>\n<li>Имени у главы организации нет. Никаких способностей, кроме статуса сильнейшей, ей не приписано.</li>\n<li>Поимённого состава организации нет. Названы категории (Альфы, благословенные) и уровни (глава, семь грехов, божество), но кто конкретно входит — не перечислено. Каталоги персонажей в тех же окнах составом организации не объявлены.</li>\n<li>Численность не названа. «12 злодеев пока» относится к списку Славы, а не к организации, и само это число расходится с четырнадцатью позициями в рубрике «Враг».</li>\n<li>Место Альф в иерархии не определено: они в составе, но в лестницу «глава &gt; семь грехов и божество &gt; благословенный» не вписаны.</li>\n<li>Формулировка «А для остальных благословенных надо будет 5» читается неоднозначно — то ли про других грехов, то ли про других благословенных.</li>\n<li>Существование дьявола оставлено на «Возможно» (2025-01-22, id 283841).</li>\n<li>Божество не описано: реплика «7 грехов и божество ( помнишь его)» отсылает к более раннему разговору, описания в окне нет.</li>\n<li>Способность Гордыни осталась нерешённой: «слово закон» самому автору не даёт представить битву, «выход за предел» отклонён («Ну пока звучит плохо», затем понижен самим предложившим до неосновной особенности), в каталоге пометки нет.</li>\n<li>Перестановка способностей между Алчностью и Чревоугодием и замена телекинеза у Лени на «контроль территории» произошли без объяснения в переписке.</li>\n<li>Мотив сестры имитатора не придуман: «А зачем это сестре имитатора, не знаю но придумаю».</li>\n<li>Что за артефакт был у агрегата — вопрос поставлен, но ответ дан только как «сырая идея» про медиатор и струны пространства; доработки в окне нет.</li>\n<li>Список из «хотя бы 16 вещей» для обряда не составлен: названо только требуемое количество и причина («сюжет должен быть длинным»).</li>\n<li>Судьба грехов после реплики «Грехи нужно убрать, а то тупо» осталась нерешённой.</li>\n<li>Является ли глава организации тем же лицом, что «сестра, благословенная правителем Кильке» (2025-08-30), в переписке не сказано.</li>\n<li>Расхождение «благословенный Фениксом» / «благословенного фенриром» в соседних репликах 2025-03-06 не оговорено.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0006--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0179.html\">Благословенные</a>, <a href=\"PS-0185.html\">Глава организации злодеев</a>, <a href=\"PS-0187.html\">Семь грехов</a>, <a href=\"PS-0193.html\">Божество</a></li>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0106.html\">Альфы</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0006--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0006.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0006-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0006/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым чинить не мотивы, а каталоги. <code>SL-0051</code> — шесть ссылок, статьи нет, база 9 834; <code>SL-0053</code> — шесть ссылок, статьи нет, база 20 313. Это те самые сводные перечни от 2025-01-24 (id 284248, 284278, 284300), из которых статья берёт и рубрику «Враг», и короткие пометки грехов, и число «12 злодеев пока» против четырнадцати позиций. Два самых цитируемых объекта во всём наборе, и оба без статьи. Пока их нет, поимённый состав организации нечем закрыть в принципе: единственное место, где перечислены конкретные лица, читателю недоступно.</p>\n<p>Второе — глава. <code>PS-0185</code> «Глава организации злодеев»: две ссылки, статья есть, но база 3 050. Три тысячи знаков — это ровно те четыре реплики 2025-01-23, что уже процитированы. На вершине иерархии стоит фигура, о которой в базе нет ничего сверх статьи, и добирать неоткуда. Рядом <code>PS-0215</code> «Сестра имитатора» — четыре ссылки, статья есть, база 7 906. Вопрос тождества («единственная благословлённая правителем нашего мира» и «сестра, благословенная правителем Кильке») упирается в две записи, в которых суммарно одиннадцать тысяч знаков на двоих.</p>\n<p>Третье — расползание грехов по двум семействам номеров. Персонажи: <code>PS-0188</code>, <code>PS-0189</code>, <code>PS-0190</code>, <code>PS-0191</code>, <code>PS-0192</code>, <code>PS-0177</code> — статьи есть, база по 4–11 тысяч. Способности: <code>SP-0156</code> (11 757), <code>SP-0157</code> (7 256), <code>SP-0158</code> (7 117), <code>SP-0160</code> (8 291), <code>SP-0161</code> (8 056), <code>SP-0162</code> (7 454) — статей нет ни у одной, ссылок ноль. Больше пятидесяти тысяч знаков по способностям грехов лежит в наборе, на который никто не ссылается. Именно там, а не в архиве, надо искать ответ на перестановку «поглощения» между Алчностью и Чревоугодием и на «контроль территории» у Лени.</p>\n<p>И отдельно: <code>MR-0105</code> «Организация злодеев» — четыре ссылки, статья есть, база 4 924. Это та же организация под другим номером и в другом разделе; четыре ссылки идут туда, ноль — сюда.</p>\n<h3>С чего начать</h3>\n<p>В базе, не в архиве:</p>\n<ul>\n<li><code>SP-0162</code> «Гордыня (грех)» — 7 454 знака, ноль ссылок, статьи нет. Способность Гордыни в статье числится нерешённой; если что-то по ней решалось позже, оно здесь.</li>\n<li><code>SP-0159</code> «Алчность» — 11 808, и <code>SP-0156</code> «Семь грехов (магия по грехам)» — 11 757. Пара, по которой проверяется перестановка способностей.</li>\n<li><code>ID-0111</code> «Добродетели и грехи как основа благословений» — 5 419, статьи нет. Единственная запись, где грехи связаны с механикой благословений, а не просто розданы по списку.</li>\n<li><code>IS-0036</code> «Цель злодеев: объединение всех миров» — 11 288, статья есть. Втрое больше, чем цитируется в разделе про 2025-03-06.</li>\n<li><code>MR-0106</code> «Альфы» — 28 881. Вопрос «куда Альфы встают в иерархию» стоит проверить тут прежде, чем идти в переписку.</li>\n</ul>\n<p>В архив — за двумя точками:</p>\n<ol>\n<li>Мотивы. 2025-01-23, id 284174: «я позже отвечу». Обещание дано и в окне не закрыто. Смотреть надо не 23-е, а то, что идёт после 2025-01-24 и до 2025-03-06 — весь промежуток между каталогом и появлением цели. Если ответ был, он в этом окне.</li>\n<li>Божество. Реплика «7 грехов и божество ( помнишь его)» (2025-01-23, id 284175) — прямая отсылка назад. Искать до 22 января, вокруг первого разговора про дьявола и правителей; там же, вероятно, лежит и «Возможно» про дьявола (id 283841).</li>\n</ol>\n<p>Третье, если хватит времени: 2025-03-06 после id 298857. «Грехи нужно убрать, а то тупо» осталось без решения, а разговор в этом месте перескакивает на Кильку. Дальше по дате видно, вернулись к грехам или нет.</p>\n<h3>Как развивалось</h3>\n<p>2025-01-22 — заявлено: тема «мотивы организаций злодеев», в составе Альфы и благословенные. 2025-01-23 — вместо мотивов достроена вертикаль: глава, под ней семь грехов и божество, всем грехам розданы способности; ответ на исходный вопрос отложен. 2025-01-24 — ограничили числом (3 благословенных Бога на греха, 5 для остальных) и свели всё в каталог, где часть вчерашних способностей уже стоит на других местах; Гордыня зависла между «словом закон» и отклонённым «выходом за предел». Дальше полтора месяца тишины. 2025-03-06 — вернулись, но не к мотивам, а к цели, и за один день переписали её автора с правителя Кильки на сестру имитатора, а в конце того же дня предложили грехи убрать. 2025-03-10 и 2025-03-13 — вернулись к двум категориям из первой реплики, Альфам и благословенным, и описали их заново, теперь снаружи, глазами арбетара. 2025-08-30 — вернулись к вопросу о главном злодее, но уже через сестру и АЗИП; слова «организация злодеев» в этом окне нет.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>2025-03-13 названо правило и названо максимально широко: «апостолы не способны лечить и влиять на разум», и следом — «Благословенный вообще все». Запрет на влияние на разум распространён на всех благословенных без исключений.</p>\n<p>Организация собрана из двух категорий: Альфы и благословенные. Похоти 2025-01-23 выдано «Контроль разума с ограничением», Гордыне — «Слово закон», Зависти — полное копирование чужих сил. К какой из двух категорий относятся семь грехов, в переписке не сказано ни разу: в иерархии они стоят между главой и благословенным, то есть не отождествлены ни с теми, ни с другими.</p>\n<p>Для благословенных правило про разум названо. Для грехов, у которых способность на разуме и построена, правила того же рода нет — как нет и ответа, попадают ли они под запрет вообще.</p>\n<h3>Отклик</h3>\n<p>Сильнее всего здесь работает 2025-01-24 — день, когда Гордыню обсуждали дольше всех и в итоге оставили с пустой пометкой. «Типо слова закон, че то я не могу представить битву» — это ведь не претензия к способности, а признание, что критерий тут один: получается вообразить драку или нет. И ответом идёт очень подробный, почти физиологический список того, что можно отключить в собственном теле — регулятор усталости, болевые рецепторы, терморегуляция, инстинкт самосохранения. На него: «Ну пока звучит плохо». И дальше человек, который это придумал, сам понижает своё предложение до «одной из особенностей, но не основной». Три реплики, и в каталоге у Гордыни остаётся корона без единого слова. Мне это кажется самым честным местом всей статьи: грех, чья суть — отрицание ограничений, оказался единственным, кому ограничение так и не смогли подобрать. И рядом, в том же дне, «а для остальных благословенных надо будет 5» — фраза, которая ломается ровно посередине и с тех пор читается двумя способами. Числа расставили раньше, чем договорились, кого считают.</p></div>", "r": []}];</script>
