<script>const BASE="";const DOCNAME="Барьерная магия";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0143-S01", "SP-0143--mehanika"], "h": "<p>Собственных правил работы барьера в переписке не задано: барьерная магия появляется только как пример — сначала как эталон сложности, затем как название конкретного гримуара, затем как пример масштабного применения.</p>\n<p>Как гримуар это книга «барьер вокруг тела» (2024-12-21, id 272610). Книга одна и «привязана к университету, залу с библиотекой или к классу». Люди обучаются в университете «писать книги для, себя»; использовать можно «по одной книге» или несколько сразу.</p>\n<p>Как масштабное применение это «барьер на государство» — пример из перечня того, зачем нужны гримуары: «в четверых это промышленный инструмент, для каких либо систем по типу барьерамна государство, тобиж на масштабные дела и командные заклинания» (id 272702).</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0143-S02", "SP-0143--ogranicheniya-i-cena"], "h": "<p>Барьерная магия введена Славой как мерило сложности: «Ты понял насколько сложно использовать барьерную магию» (id 272191). Реплика противопоставляет местную магию простому вливанию маны: «Книга маны там не надо нихуя просто влил Ману и все. Наши книги их надо сука почитать понять и отработать в голове» (id 272609) — то есть гримуар требует прочтения, понимания и отработки в голове, а не только маны.</p>\n<p>Отдельно назван предел силы: «в одиночку ты не сможешь одолеть например армию» (id 272615). Барьер на государство отнесён к масштабным делам и командным заклинаниям, то есть к тому, что не делается одним человеком.</p>\n<p>Книга «барьер вокруг тела» привязана к месту — университету, залу с библиотекой или классу; что это ограничение означает на практике, не расписано.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S03", "SP-0143-S03", "SP-0143--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-12-21, 12:03 (окно w0067, id 272190–272195).</strong> Слава ставит барьерную магию как пример того, насколько магию сложно использовать: «Ты хоть понял суть магии» / «Ты понял насколько сложно использовать барьерную магию». Миколай отвечает, что будет ещё изучать вопрос, и признаёт: «у меня понимание более упрощённое» (id 272195).</p>\n<p><strong>Версия 2 — 2024-12-21, 20:29–20:30 (окно w0067, id 272609–272615).</strong> Барьерная магия становится названием конкретного гримуара: «вот книга \"барьер вокруг тела\" и эта книга одна и привязана к университету, залу с библиотекой или к классу». Здесь же появляются обучение письму книг в университете, возможность использовать одну книгу или несколько и оговорка про армию.</p>\n<p><strong>Версия 3 — 2024-12-21, 21:06 (окно w0067, id 272702–272703).</strong> Масштаб меняется с тела на государство. Барьер на государство назван четвёртым доводом в пользу гримуаров — как «промышленный инструмент» для систем, масштабных дел и командных заклинаний. Барьер вокруг тела при этом не отменяется.</p>\n<p>Все три состояния относятся к одному дню, 2024-12-21 — дню объявления вселенной (id 272184).</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S04", "SP-0143-S04", "SP-0143--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Барьерная магия описана как часть магии вообще и существует в переписке главным образом через гримуары. В перечислении id 272702 гримуар противопоставлен магии, которую «ты используешь в голове»: заклинание в гримуаре достаточно питать маной, и это, по перечню, облегчает процесс, развивает воображение через чтение чужих гримуаров, даёт «опыт и культуру» как опору — «плечи гигантов, преемственность», позволяет писать гримуар под свои потребности и автоматизировать сложные идеи, и, в-четвёртых, работает как промышленный инструмент — здесь и возникает барьер на государство.</p>\n<p>Отдельно противопоставлены книга маны (в неё «просто влил Ману и все») и «наши книги», которые надо прочитать, понять и отработать в голове.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "SP-0143-S05", "SP-0143--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Собственных правил работы барьера в окне не задано: как он ставится, что держит, как ломается — не сказано.</li>\n<li>Чем «барьер вокруг тела» отличается от «барьера на государство» по механике, кроме масштаба, не сказано.</li>\n<li>Что означает привязка книги к университету, залу с библиотекой или классу — не расписано.</li>\n<li>Почему барьерная магия названа особенно сложной, не объяснено; Миколай прямо говорит, что вопрос ещё не изучен.</li>\n<li>Сколько людей нужно на командное заклинание уровня барьера на государство — не названо.</li>\n<li>Вселенная в карточке помечена как неясная (определяется только по дате объявления).</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0143--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в способностях:</strong> <a href=\"SP-0137.html\">Магия</a>, <a href=\"SP-0141.html\">Гримуары (книги заклинаний)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0143--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-12-21</td>\n<td>272190–272195</td>\n<td>w0067</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-21</td>\n<td>272609–272615</td>\n<td>w0067</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-21</td>\n<td>272702–272703</td>\n<td>w0067</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0143-barernaya-magiya.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0143--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0143.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
