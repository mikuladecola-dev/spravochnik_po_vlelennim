<script>const BASE="";const DOCNAME="Правители миров";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0097-S01", "MR-0097--ustroystvo"], "h": "<p>Правители — «существо правящий этим миров». Всё изложение сделано за один день (2025-01-06, окно w0070, id 278852–278912).</p>\n<p><strong>Где они есть.</strong> «И вообще почти во всех мирах есть правитель». «Почти» — исключения не названы.</p>\n<p><strong>Облик.</strong> «У них нет облика они могут принять любой».</p>\n<p><strong>Что они контролируют.</strong> Правитель «может изменять этот мир как хочешь ведь это его мир»; «контролирует полностью свой мир изменяя пространства». На вопрос Миколая «размеры тоже?» (id 278882) ответ «Нет» (id 278885) — то есть размеры мира правителю неподвластны. Реплики в этом месте идут вразнобой: между вопросом о размерах и ответом Слава успевает сказать про смерть (id 278883), а Миколай — спросить «а наш кто создал?» (id 278884), на что ответ «Существо» (id 278886).</p>\n<p><strong>Что не их работа.</strong> Миколай перечисляет: дождик, войны, «то что хлеб упал», ссоры (id 278899–278902). Ответы: про войны и бытовые мелочи — «Нет, это наша работа»; про дождь — «Нет это экологией, круговорот».</p>\n<p><strong>Как появились.</strong> «Просто появились в пустоте. По итогу создавая землю воду и т.д.»</p>\n<p><strong>Иерархия.</strong> На вопрос «а есть кто-то кто контролирует все миры?» — «Нет». Но: «самым сильном является „существо“». Существо — правитель нашего мира; наш мир никто не создавал (ответ «Нет» на «а наш кто создал?» в этом месте относится к размерам, а на сам вопрос о создателе нашего мира дан ответ «Существо»). Существо «создала смерть которая таскает души в разный миры».</p>\n<p><strong>Чем заняты.</strong> Правители минимиров «могут наблюдать за нашем, вот и изменять свой пытаясь копировать наш чтобы хоть чуть-чуть приблизится к могуществу „существа“». «Большинство правитель пытаются достигнуть нашего правителя из за этого пытаются везде его копировать». В навигационной сводке базы это сформулировано как «Единственное развлечение в бесконечной жизни — наблюдать за нашим миром» — в приведённых кусках переписки такой формулировки нет.</p>\n<p><strong>Благословение.</strong> «И вот эти правитель могут дать свой благословение, но они могут дать свой благословений только людям из нашего мира». Механика самого благословения здесь не разбирается.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Что не сформулировано по вашей же логике — не материал авторов</b>\n<p>Граница ответственности правителя проведена — но только для одного мира. Дождь отнесён к экологии, войны и ссоры — к людям, правителю оставлено пространство. Про минимиры сказано другое и не про то же: правитель там «контролирует полностью свой мир изменяя пространства». Есть ли в минимире своя экология и свои дела жителей, то есть работает ли там то же разделение, — не проговорено. Для нашего мира зона правителя ограничена снизу, для остальных миров того же устройства — нет.</p></div>", "r": []}, {"t": "Место во вселенной", "a": ["S02", "MR-0097-S02", "MR-0097--mesto-vo-vselennoy"], "h": "<p>Правители встроены в общую карту миров, изложенную в том же разговоре (id 278852):</p>\n<ul>\n<li>Наш мир — «Вселенная», самый большой и появившийся первым. Действие происходит в современном мире.</li>\n<li>На втором месте по размеру — «рай» и «ад».</li>\n<li>Кроме них — «множество минимиров».</li>\n<li>«Вообще все миры будь то „рай“ или „ад“ или минимиры всегда связаны с нашем миров так как наш мир появился первым и является самым большим, и чаще всего минимиры пытаются копировать нашей мир».</li>\n<li>Связь между мирами есть у всех со всеми, но неравной силы: «Самая крепкая связь с нашем миров так как он первый и по суть на основе него строились и другие миры. Между всеми мирами есть связь но самый сильной только с нашем».</li>\n</ul>\n<p>Минимиры: «чаще всего эти минимиры темный жуткий жестокий все существо там опасный». Их обитатели попадают к нам «через край своего мира» и «творят бесчинства»; «все те мистический монстры (драконы, упырь, оборотни, леший, и т.д) это существа из минимиров». В обратную сторону переход при жизни невозможен: «Мы же пока живы не можем попасть в другой мир».</p>\n<p>Смерть и посмертие: после смерти человек отправляется в рай или ад, «ну или в минимирок ну это случается крайне редко». Причина — сама смерть: «она после нашей кончины не даёт остаться в нашем мире и вечно отправлять нам куда-то». Из рая «по понятным причинам не кто не хочет сбегать, а вот с „ад“ грешники сбегают». Про правителя ада сказано: «сразу дьявол правитель „ада“ добрый, типо он карает грешников».</p>\n<p>Душа — «Это мы, наш фантомный облик».</p>\n<p>В базе сущность связана с: Благословение, Бог, Дьявол, Минимиры, Существо.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S03", "MR-0097-S03", "MR-0097--kak-menyalsya-po-versiyam"], "h": "<p>Все три версии приходятся на один день, 2025-01-06, и не отменяют друг друга, а достраивают.</p>\n<p><strong>Версия 1 — 2025-01-06 (id 278852).</strong> Общая карта миров и первое упоминание правителей: почти во всех мирах есть правитель, и он может дать благословение — только людям из нашего мира.</p>\n<p><strong>Версия 2 — 2025-01-06 (id 278876–278894).</strong> Как правят: могут менять свой мир как хотят, но не размеры. Над всеми мирами не стоит никто, самый сильный — «существо», правитель нашего мира, создавшее смерть. Душа определена как фантомный облик. Правители минимиров копируют наш мир, наблюдая за ним.</p>\n<p><strong>Версия 3 — 2025-01-06 (id 278898–278912).</strong> Облика нет — принимают любой. Контроль над пространством своего мира полный. Дождь отнесён к экологии, войны и ссоры — к людям. Появились в пустоте, создав землю, воду и прочее. Повторно закреплено, что копирование нашего мира — попытка приблизиться к «существу».</p>", "r": []}, {"t": "Пробелы", "a": ["S04", "MR-0097-S04", "MR-0097--probely"], "h": "<div class=\"gaps\"><ul>\n<li>В каких мирах правителя нет — сказано «почти во всех», исключения не названы.</li>\n<li>Правитель рая и правитель ада: дьявол назван правителем ада, кто правит раем — в переписке не сказано.</li>\n<li>Отношения правителей между собой не описаны — только их общая ориентация на наш мир.</li>\n<li>Вопрос Миколая «а вот в каком-то мини мире будет 3 связи с разными мирами, это реально?» (id 278906) остался без ответа: в ответе говорится только о силе связи с нашим миром.</li>\n<li>Вопрос «тобиж что-то новое в новых мирах вообще не ценится? развитие которые идет другим путём не естественно? бывает?» (id 278910) прямого ответа не получил.</li>\n<li>Вопрос «люди знают об этом? животные?» (id 278911) остался без ответа — следом идёт реплика про копирование нашего мира.</li>\n<li>Вопрос «ей платят за это? нахуя она это делает? вредная привычка?» (id 278877) без ответа.</li>\n<li>Как именно правители минимиров копируют наш мир (вопрос id 278891) — механика не описана, сказано только, что они наблюдают и изменяют свой мир.</li>\n<li>Создаются ли минимиры или существовали всегда (вопрос id 278893) — прямого ответа нет.</li>\n<li>Механика благословения в этом разговоре не разбирается.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0097--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0023.html\">Правители (правители миров, правители минимиров)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0097--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-01-06</td>\n<td>278852–278852</td>\n<td>w0070</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-06</td>\n<td>278876–278894</td>\n<td>w0070</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-06</td>\n<td>278898–278912</td>\n<td>w0070</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0097-praviteli-mirov.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0097--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0097.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["MR-0097-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/MR-0097/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — «существо». Это правитель нашего мира, самый сильный из всех, создатель смерти и тот, кого копируют все остальные правители, — то есть вершина всей конструкции. Записи с таким именем в наборе нет: ни статьи, ни строки в базе. Ближайшее по названию — <code>MR-0068</code> и <code>PS-0166</code> «Существо с длинными руками», это другая вещь и другой разговор. При этом на «существо» опираются сразу три статьи: эта, <code>PS-0178</code> «Смерть» (создана им, 5.8 КБ), <code>MR-0093</code> «Вселенная (наш мир)» (три ссылки, 12.1 КБ), а в <code>MR-0102</code> та же фигура проходит под именем «наш правитель» и там прямо помечена как нерасшифрованная. Дыра дорогая именно потому, что она наверху: под ней всё остальное.</p>\n<p>Вторая — счёт правителей нигде не сведён. Об одном и том же говорят шесть записей, у каждой своя статья и свой объём: <code>MR-0120</code> «Правитель» (35 КБ, 2025-03-18 — 2026-02-06), <code>PS-0278</code> «Правители» (26.8 КБ, 2025-05-31 — 2025-10-18), <code>PS-0279</code> «Правитель рая» (23.1 КБ), <code>PS-0217</code> «Правитель Кильки» (14.2 КБ), <code>MR-0103</code> «Правители минимиров» (3.8 КБ) и эта (9.6 КБ). Сколько их всего и кто в этом списке — не сказано ни в одной.</p>\n<p>Третья: механика благословения объявлена здесь и здесь же отложена, а обе записи, где она лежит, не раскрыты — <code>SP-0240</code> «Благословение правителя» (9.8 КБ) и <code>SP-0242</code> «Уникальная способность правителя» (9.6 КБ), статей нет, вселенная у обеих не определена.</p>\n<h3>С чего начать</h3>\n<p>В базе. Пробел «кто правит раем» закрывается прямо: <code>PS-0279</code> «Правитель рая», статья есть, id 331635–331636 (2025-05-31). Там же лежит более позднее общее определение правителей — «не физические существа появившиеся в нигде и в ни чем», порядок появления (первым правитель Кильки, вторым правитель рая) и вывод, что от очерёдности зависит размер мира. Это надо ставить рядом со здешним «наш мир появился первым и является самым большим» — два несведённых первенства.</p>\n<p>Состав существ, которые к нам переходят, тоже в базе и он большой: <code>PS-0198</code> «Чужемирцы» (58.7 КБ), <code>MR-0100</code> «Чужемирцы и аномальные люди» (две ссылки), <code>MR-0117</code>, <code>SP-0182</code> «Чутьё на чужемирцев» (8.9 КБ), <code>PS-0231</code> «Упыри» (17.4 КБ).</p>\n<p>В архив — за неотвеченными вопросами. Их четыре и все в один день, w0070, 2025-01-06: id 278877, 278906, 278910, 278911. Смотреть надо не вокруг них, а дальше — ближайшее продолжение темы правителей в базе датировано 2025-01-13, id 281365–281379 (<code>MR-0103</code>), потом 2025-03-18. Проверять, не подобрал ли кто-то из двоих эти вопросы там.</p>\n<h3>Как развивалось</h3>\n<p>Заявили одной репликой (278852): карта миров целиком и правитель как её узел. Ограничили в тот же день и подряд — размеры мира менять нельзя (278885), над всеми мирами не стоит никто, благословение только людям нашего мира, дождь относится к экологии, войны и ссоры — к людям. Забыли в том же окне: четыре вопроса подряд ушли без ответа, причём один из них (278911, «люди знают об этом? животные?») перебит следующей репликой про копирование. Вернулись в третьем заходе (278898–278912) — но вернулись к уже сказанному и повторно закрепили копирование нашего мира, ни один из оставленных вопросов не подобрав. После 2025-01-06 тема ушла из этой записи в другие: следующие состояния правителей датированы 2025-03-18 и 2025-05-31.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Граница ответственности правителя проведена — но только для одного мира. Дождь отнесён к экологии, войны и ссоры — к людям, правителю оставлено пространство. Про минимиры сказано другое и не про то же: правитель там «контролирует полностью свой мир изменяя пространства». Есть ли в минимире своя экология и свои дела жителей, то есть работает ли там то же разделение, — не проговорено. Для нашего мира зона правителя ограничена снизу, для остальных миров того же устройства — нет.</p>\n<h3>Отклик</h3>\n<p>Самое сильное здесь — короткое «Нет» на вопрос про размеры. Правитель может в своём мире всё, менять пространство как хочет, принимать любой облик, — и не может ровно одного: сделать мир больше. На этом одном запрете стоит всё их поведение: раз размер задан снаружи и навсегда, единственное, что остаётся, — копировать того, кому досталось больше. Бессилие в одном пункте объясняет характер лучше, чем описание характера. И рядом ещё одна деталь, которую я бы не тронул: «просто появились в пустоте». Без мифа, без причины, буквально просто появились и начали делать землю и воду. Мир, у которого нет истории до первого дня.</p></div>", "r": []}];</script>
