<script>const BASE="";const DOCNAME="Пераг";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0199-S01", "PS-0199--proishozhdenie"], "h": "<p>Пераг (варианты написания в переписке: ПЕРАГ, ПеРаг, Пераги; собирательно — «падшие ангелы»; шуточное искажение — «пирог») появляется в истории Славы, которую он пишет и выкладывает кусками в чат (2025-02-24, id 293226–293229). Вселенные, к которым отнесены версии: «Апостол» (версии 1–5) и «вне вселенной» (версия 6, разъяснение в чате).</p>\n<p>Пераги — бывшие люди. В первом появлении (293227) рассказчик прямо не уверен: «Это был, когда-то человек, хотя ручаться я не стану». Появляются они в мире, где солнце раскололось: рассказчик описывает, как «солнце разрушается на тысячи, нет, миллард сотен своих кусков», осколки летят на землю, он выживает под обломками здания и выбирается в темноту, где света больше нет. Уже после этого он встречает первого Перага.</p>\n<p>Имя даёт сам рассказчик, прямо по ходу повествования: «Думаю не помешало бы, дать им название для ясности ума, давайте например \"пераг\"». То есть слово внутри истории — не самоназвание существ и не термин, а придумка очевидца.</p>\n<p>В версии 5 (2025-03-19, id 305854) происхождение сформулировано иначе и от лица другого рассказчика — жителя технологически развитого мира. Там Пераги — вторая волна катастрофы: «Раскол солнце был лишь первой волной. После началось заражение и появление этих зараженных, которых в других мирах называют Пераг». Формулировка «которых в других мирах называют Пераг» ставит название вне этого мира; как это соотносится с тем, что в версии 1 имя выдумал рассказчик на месте, в переписке не сказано.</p>\n<p>Откуда взялось само заражение — не названо. В окне w0076 не сказано, откуда взялись Пераги и связаны ли они с разрушением солнца. В версии 5 есть теория о Рае как источнике нападений на миры вообще («Что все нападения на миры. Были устроены из Рая. Второго мира, который появился после Кильке»), но она подана как теория: «Хотя это опять же не точно. Лишь теория. Без стопроцентных фактов». Отдельная реплика «Это заража из рая. Или это попытка правителя спасти людей. Не знаю» относится к упырям, а не к Перагам.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0199-S02", "PS-0199--vneshnost"], "h": "<p>Основной признак — белые перья, лезущие из тела наружу. В первом описании (293227): «перья белый как снег, не они ещё белее, белее чем душа младенца. И эти перья вылазили из недор тела, стремясь в наружу. Но больше всех, этих перье были в голове». Первый встреченный Пераг был «весь в крови», и перья читались отчётливо даже сквозь «красное месиво».</p>\n<p>Первая реакция рассказчика на увиденное — «Ну увидел, я ангела?!!» — то есть сходство с ангелом отмечено сразу, при первой встрече.</p>\n<p>В версии 5 (305854) описание собрано плотнее: «Это люди, который обрастают белыми перьями. Словно они состоят из чистого серебра. Они становятся похожими на ангелов из мифов. Но лишь похожими. На деле это были чудища».</p>\n<p>Перья не горят и не темнеют. При гибели Перага под обрушенным горящим музеем (293228): «И всё горела, кроме перьев белых. И даже в красно-оранжевым огне, эти перье были белые».</p>\n<p>Звук — «крик подобной звериному реву. Но всё же это был не рев, а что-то большее, похожее на крик» (293227). Передвигается первый Пераг «шатаясь».</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0199-S03", "PS-0199--harakter"], "h": "<p>Как отдельный характер Пераг в переписке не разработан. Поведение: замечает человека и сразу бежит на него (293227), преследует бегущего, в том числе внутрь горящего здания (293228). При гибели кричит.</p>\n<p>В версии 5 поведение сведено к цели: «Монстры у которых главная цель убить всё разумной на планете Земля. Падший ангелы».</p>\n<p>Отдельно стоит эпизод версии 3 (293229), где Пераг подан как собеседник. Рассказчик обращается к мёртвому: «а, скажи Пераг. Ты ведь говорил, на человеческом, так скажи, скажи мне правду это ад». Затем: «Схватил Перага он живого связал и говорил он с ним и слышал он ответ. И жил он так с Перагом в том доме одиноком. Иногда поедая его плоть». Тут же в тексте это снимается: «они ведь не говорил со мной это всё в мой голове. Я псих, я сошёл с ума». Речь Перагов, таким образом, в самой истории объявлена галлюцинацией рассказчика; окончательно вопрос о том, говорят ли они, в переписке не решён.</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0199-S04", "PS-0199--sposobnosti"], "h": "<p><strong>Перо-меч.</strong> Из руки вырастает длинное перо, используемое как клинок (293228): «с руки его вылазить огромное и длинное перо, словно меч». Рассказчик называет его «недомеч», далее — «крыло-мечом». В бою Пераг машет им над головой преследуемого; ударом он подрубает опору горящего здания.</p>\n<p><strong>Перья как броня.</strong> Пули, попадающие в перья, отскакивают; по голому телу проходят (293227): «всё пули, который попадали в перья отскакивали, а если попал просто тело то они прошибали».</p>\n<p><strong>Огнестойкость перьев.</strong> См. раздел «Внешность»: перья остаются белыми в огне, когда всё остальное горит.</p>\n<p><strong>Плоть не гниёт и съедобна.</strong> Версия 3 (293229): рассказчик, придавленный плитой, ест мёртвого Перага — «его плоть не гнила и была вкусна». Это даёт ему время выкопаться. В версии 5 то же свойство названо как ресурс для упырей: «Ведь пераги это люди. Их можно есть. Жувать. Глотать».</p>\n<p>Уязвимость: Пераг гибнет обычным образом — первого убивает обрушенное на него здание («видел я горящего Перага, он был мертв»).</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0199-S05", "PS-0199--svyazi-s-drugimi"], "h": "<p><strong>Рассказчик истории про Перагов</strong> — очевидец из версий 1–3, давший им имя. По ходу истории он сам перестаёт быть человеком: лицо содрано до кости, «руки были лишь кости не более», он ест плоть Перагов, безуспешно пытается покончить с собой множеством способов и после каждой попытки «становился куда страшнее Перагов», в итоге движется к превращению в упыря.</p>\n<p><strong>Упыри</strong> — вторая категория изменившихся людей, введённая в версии 5. Живучие до неубиваемости, без сверхсилы и сверхскорости, с неутолимым голодом, который гасит только человечина, и с постепенной потерей собственного «я». С Перагами связаны напрямую тем, что перагами питаются. В версии 3 то же движение показано на самом рассказчике: «зная, что в конце пути я стану упырем», «жрущий Перагов».</p>\n<p><strong>Раскол солнца</strong> — событие, после которого Пераги появляются. В версии 5 прямо: раскол — первая волна, заражение и Пераги — вторая.</p>\n<p><strong>Мир без солнца</strong> — среда, где Пераги встречаются: темнота, отсутствие людей, редкие уцелевшие здания и магазины.</p>\n<p><strong>Рай</strong> — отдельный мир. В версии 5 приведена теория, что нападения на миры устраивались из Рая. Кроме того, там же описан ангел из Рая, который приходит убивать: «Гуманоид, состоящий только из белых перьев. Он был вытянутым. По два метра ростом. У него было две пары рук и две пары крыльев. И вертикальный глаз один. Но он был закрыть» — и нимб. Это существо и Пераг — разные вещи; см. версию 6.</p>\n<p><strong>Перо-меч Перага</strong>, <strong>Перья Перага</strong> — выделенные части, описанные выше.</p>\n<p>Соотношение численности (версия 5, 305854): «Коэффициент этих зараженных. 23 заражённых на одного человека. Где-то так».</p>", "r": []}, {"t": "Как менялся", "a": ["S06", "PS-0199-S06", "PS-0199--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2025-02-24, окно w0076, id 293226–293227.</strong> Первое появление. Окровавленное существо, бывший человек, белые перья лезут из тела, больше всего на голове; рёв-крик. Рассказчик прячется, наблюдает, даёт имя. Затем первая стычка: пули от перьев отскакивают, по голому телу проходят. Вселенная — «Апостол» (по дате объявления).</p>\n<p><strong>Версия 2 — 2025-02-24, окно w0076, id 293228.</strong> Добавлено перо-меч из руки. Пераг преследует рассказчика в горящий музей, подрубает опору «крылом-мечом», гибнет под обрушенным зданием. Зафиксировано, что перья не горят.</p>\n<p><strong>Версия 3 — 2025-02-24, окно w0076, id 293229.</strong> Пераги становятся фоном мира: рассказчик встречает их постоянно и прячется — «явно больше месяца». Введено, что мёртвая плоть не гниёт и съедобна. Введён эпизод с живым связанным Перагом, разговором и ответами — и тут же снят как безумие рассказчика.</p>\n<p><strong>Версия 4 — 2025-02-27, окно w0078, id 296039–296045.</strong> Прямого материала по существам нет, только уточнение сути в чате. Слава: «Надеюсь ты понимаешь что Пераг и пирог это разный штуки». Миколай: «конечно», «я просто хочу шутить об этом», «это забавно». Слава: «А то в моменты я подумал, что в моей истории, ты всё время думал что это пирог». Единственное пояснение сути дано Миколаем в тексте запроса к нейросети (296044), где он просит написать поэму про летающие пироги и оговаривает контекст: «ну типа я называю это пирог по сути это название что то типа ангела, сказал это для понимания контекста но ты рассказывай именно о пироге». Сама история с Перагом в этом окне не приводится, только упоминание.</p>\n<p><strong>Версия 5 — 2025-03-19, окно w0083, id 305854–305855.</strong> Смена рассказчика и рамки: житель технологически развитого мира, установившего обрывочную связь с другими мирами. Пераги перестают быть безымянным ужасом одного очевидца и становятся второй волной катастрофы с числовым коэффициентом 23 к 1, с формулировкой «Падший ангелы» и с целью «убить всё разумной на планете Земля». Название вынесено за пределы мира рассказчика: «которых в других мирах называют Пераг». Рядом введены упыри и отдельно — ангел из Рая.</p>\n<p><strong>Версия 6 — 2025-03-20, окно w0083, id 306126–306135.</strong> Разъяснение в чате, вселенная указана как «вне вселенной». Миколай: «я думал пераг это ангел», «чел из рая». Слава: «Н-не», «Это заражённый». Здесь же Миколай замечает по поводу подачи версии 5: «прикольно говорить в процентах с но ты так всё раздробил что трудно представить» и «а, я не понял что намерено направились».</p>\n<p>Отдельно: соотношение версий 1–3 и версии 5 в переписке не сводится. Старое не отменено, новое не привязано к старому.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0199-S07", "PS-0199--chto-s-nim-stalo"], "h": "<p>Как вид Пераги в последней версии остаются действующим населением разрушенного мира — заражённых в 23 раза больше, чем людей. Рассказчик версии 5 бьётся с ними в экзоскелете: «Я побеждал. Я уничтожал перагов». Его собственная линия обрывается тем, что ангел из Рая убивает тех, кого он защищал, и они вдвоём с ангелом влетают в чёрную дымку, тянущую в другой мир.</p>\n<p>Судьба конкретных Перагов из версий 1–3: первый встреченный погибает под обрушенным горящим музеем; второй — связанный, живёт при рассказчике в одиноком доме и постепенно им поедается, дальнейшая его участь не описана.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0199-S08", "PS-0199--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Откуда взялись Пераги и как передаётся заражение — не сказано. В w0076 связь с разрушением солнца не оговорена; в версии 5 сказано только, что заражение началось после раскола.</li>\n<li>Как соотносится имя, придуманное рассказчиком в версии 1, с формулировкой версии 5 «которых в других мирах называют Пераг» — в переписке не сказано.</li>\n<li>Говорят ли Пераги. В версии 3 говорят, там же это объявлено галлюцинацией; отдельного решения нет.</li>\n<li>Отличие Перага от ангела из Рая заявлено (306131: «Это заражённый»), но чем при этом объясняется общий облик из белых перьев — не сказано.</li>\n<li>Сохраняет ли Пераг что-то от бывшего человека (память, личность) — не сказано.</li>\n<li>Механизм роста пера-меча и вообще способ его применения, кроме размахивания на бегу, не описан.</li>\n<li>Вселенная в окне w0076 не названа; отнесение версий 1–3 к «Апостолу» сделано по дате объявления.</li>\n<li>В окне w0078 сама история с Перагом не приводится, только упоминание.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0199--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0022.html\">Пераги</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0022.html\">Пераги</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0199--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-02-24</td>\n<td>293226–293227</td>\n<td>w0076</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-02-24</td>\n<td>293228–293228</td>\n<td>w0076</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-02-24</td>\n<td>293229–293229</td>\n<td>w0076</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-02-27</td>\n<td>296039–296045</td>\n<td>w0078</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-19</td>\n<td>305854–305855</td>\n<td>w0083</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-20</td>\n<td>306126–306135</td>\n<td>w0083</td>\n<td>вне вселенной (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0199-perag.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0199--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0199.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0199-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0199/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Материала здесь больше, чем у всего вокруг: 44 124 знака базы, шесть версий, шесть окон. Дыра при этом не в материале, а в том, что узел ни к чему не подключён — в связях стоит одна группа <code>GR-0022</code>. Всё, о чём статья говорит подробно, заведено отдельно, статьи имеет, а ссылок почти не собрало: <code>PS-0200</code> Рассказчик истории про Перагов (24 602, ноль ссылок), <code>MR-0123</code> Раскол солнца (18 152, ноль), <code>PS-0231</code> Упыри (17 407, одна), <code>MR-0110</code> Мир без солнца (23 565, одна), <code>MR-0095</code> Рай (54 131, одна), <code>PS-0233</code> Ангел (28 551, одна), <code>SP-0183</code> Перья Перага (15 757), <code>SP-0184</code> Перо-меч (8 261), <code>SP-0208</code> Голод упыря (15 749), плюс сама проза — <code>PR-0052</code> и <code>PR-0061</code>. Починка одна и дешёвая: проставить связи от самой большой карточки наружу. Это разблокирует навигацию сразу по десятку статей.</p>\n<p>Второе — <code>VS-0013</code> «вне вселенной»: статьи нет, база 15 911, и в шапке этой статьи прямо стоит «статьи ещё нет». Под этой вселенной 49 сущностей, включая <code>MR-0095</code>, <code>PS-0231</code>, <code>PS-0233</code>, <code>MR-0207</code>. Пераг отнесён к ней напрямую, версией 6. То есть половина рамки, в которой существует последнее состояние персонажа, не описана.</p>\n<p>Третье, содержательное: заражение. Откуда взялись Пераги — не сказано, и записи под это нет. Рядом стоит <code>SP-0186</code> «вирус перьев» (Апостол, 2025-02-25, статья есть, 3 901) — тоже про перья, тоже про то, что «в нашем мире он тоже будет». С Перагами это ни разу не сведено — ни с той стороны, ни с этой.</p>\n<h3>С чего начать</h3>\n<p>В базе, не в архиве. Версии 1–3 целиком лежат в <code>PR-0052</code> (22 285), версия 5 — в <code>PR-0061</code> (34 415), туда же ушли упыри, ангел и экзоскелет; разбор рассказчика — в <code>PS-0200</code> (24 602). Детали, которых в этой статье нет, уже разобраны в трёх соседних карточках.</p>\n<p>Единственное место, где база пуста, — версия 4: 2025-02-27, окно w0078, id 296039–296045. Здесь прямо записано, что самой истории в этом окне нет, только шутка про пирог и запрос к нейросети. Если между версиями 3 и 5 где-то происходила пересборка рамки — а меняется всё: рассказчик, мир, статус названия, — искать надо именно в этом промежутке: w0078–w0083, 2025-02-27 — 2025-03-19. По ключам не «Пераг», а «заражение», «упыри», «связь с другими мирами».</p>\n<h3>Как развивалось</h3>\n<p>24 февраля — три версии за один вечер: существо, оружие, фон мира. Там же, в версии 3, заявлено, что Пераг говорит, и тут же снято как безумие рассказчика. 27 февраля материала нет — есть шутка про пирог. 19 марта — возврат другой рамкой: другой рассказчик, другой мир, коэффициент 23 к 1, «Падший ангелы», и имя вынесено наружу — «которых в других мирах называют Пераг». 20 марта — разъяснение уже в чате, не в истории, и оно отнесено «вне вселенной». Старое не отменено, новое к старому не привязано; в статье это записано прямо.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Разговору 2025-03-20 («я думал пераг это ангел» — «Это заражённый») проставлена вселенная «вне вселенной»: для разговора о материале заведена отдельная рамка. Разговор 2025-02-27 устроен ровно так же — говорят не изнутри истории, а о ней («Пераг и пирог это разный штуки»), и самой истории в окне нет, что тут же и отмечено. Вселенная у него — «Апостол (по дате объявления)». Для одного разговора о материале правило названо, для соседнего такого же — нет.</p>\n<h3>Отклик</h3>\n<p>Самое сильное здесь — имя. «Думаю не помешало бы, дать им название для ясности ума, давайте например „пераг“»: существо получает имя не потому, что оно так называется, а потому что рассказчику надо чем-то держать голову в порядке. Это работает лучше любого описания — слово тут инструмент выживания, а не термин. И потом версия 5 это тихо ломает: «которых в других мирах называют Пераг», придумка одного напуганного человека оказывается общим межмировым словом, и никто этого не оговаривает, оно просто становится так. Из мелочей зацепила огнестойкость перьев — всё горит, перья белые; вещь, которую видно и не надо объяснять, в отличие от коэффициента 23 к 1, про который сам Миколай честно сказал, что «трудно представить».</p></div>", "r": []}];</script>
