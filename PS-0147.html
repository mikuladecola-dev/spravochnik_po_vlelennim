<script>const BASE="";const DOCNAME="Дифер Фрог";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0147-S01", "PS-0147--proishozhdenie"], "h": "<p>Появляется 2024-08-20 (id 220649–220650, окно w0054) внутри истории, которую ведёт от первого лица Захар Авгур. Собственного появления в переписке за пределами этого текста у него нет — он назван только как имя, прозвучавшее с экрана.</p>\n<p>Имя названо в момент, когда Захар смотрит запись церемонии вручения Пулитцеровской премии и видит вместо себя другого лауреата: «мне же вручили Пулитцеровскую премию, почему вместо меня её получает Дифер Фрог».</p>", "r": []}, {"t": "Характер", "a": ["S02", "PS-0147-S02", "PS-0147--harakter"], "h": "<p>Всё, что о нём известно, — оценка Захара, конкурента. Никаких реплик, поступков и внешности у него в тексте нет.</p>\n<p>Захар называет его графоманом и дилетантом: «да кто вообще посмел этого никчёмного графомана вообще пускать на телевизор», «с чего все лавры достались этому делитанту». О его работах: «каждая его работа - третьесортная компиляция и подростковый опус. его работы достойны максимум четвёрки за урок по литературе и похвалу от матушки».</p>\n<p>Отдельно Захара задевает разница в стаже: «он первый раз участвствует в этом конкурсе, я участвую шестнадцатый год, я всё сделал идеально».</p>", "r": []}, {"t": "Связи с другими", "a": ["S03", "PS-0147-S03", "PS-0147--svyazi-s-drugimi"], "h": "<p><strong>Захар Авгур.</strong> Единственная названная связь. Захар — автор книги «Память забытому», участвует в конкурсе шестнадцатый год и жаждет славы как формы бессмертия: «думать о бессмертии физическом бесполезно, людей обладающих ей не существовало, так что, все последующие потуги также безнадёжны. но вот в историю своё имя вписали многие, а моя цель затмить их своим величием. это самая достойная форма бессмертия».</p>\n<p>Захар утверждает, что премию уже получил и присутствовал на церемонии: «меня уже наградили, я присутствовал там. даже из знакомых свидетелей... ну ладно, свидетелей из знакомых не было. но это точно не сон». В записи же премию получает Дифер Фрог.</p>\n<p>Причину замены объясняет знакомый Захара (спасатель), пришедший к нему домой: работы Захара «через неделю признали экстремистскими и поэтому пришлось отдать место второму кандидату, не менее достойному». О решении Захара уведомляли по почте, которую он не читал: «а, мне оказывается писали на почту..». Таким образом, Дифер Фрог в истории — второй кандидат, получивший место после снятия первого. Виделись ли они лично, встречались ли где-то — в переписке не сказано.</p>\n<p>Никакого отношения Дифера Фрога к монстрам, спасателю или другим линиям истории (изгнанный монстр Беркут, гибрид монстра и человека, планируемая трансляция в даркнете) в тексте нет.</p>", "r": []}, {"t": "Как менялся", "a": ["S04", "PS-0147-S04", "PS-0147--kak-menyalsya"], "h": "<p><strong>2024-08-20 (id 220649–220650, окно w0054).</strong> Единственная версия и единственное упоминание. Отдельной разработки персонажа после этого не было.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "PS-0147-S05", "PS-0147--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Внешность, возраст, пол не названы.</li>\n<li>Реплик и действий нет — он только назван.</li>\n<li>За какую работу он получил премию, не сказано; о его текстах есть только оценка Захара.</li>\n<li>Знакомы ли они с Захаром лично — не сказано.</li>\n<li>Отдельной разработки персонажа нет, он упомянут только внутри текста истории.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0147--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0147--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-20</td>\n<td>220649–220650</td>\n<td>w0054</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0147-difer-frog.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0147--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0147.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
