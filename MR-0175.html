<script>const BASE="";const DOCNAME="Орден по убийству котов";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0175-S01", "MR-0175--ustroystvo"], "h": "<p>Орден задан одной строкой:</p>\n<div class=\"q\"><p>«Так же появиться орден предназначеный для убийства котов.»</p></div>\n<p>Из этого следует, что орден:</p>\n<ul>\n<li>на момент перечисления сил вселенной ещё не существует — он «появиться», то есть возникает позже;</li>\n<li>имеет одно назначение, и оно вынесено прямо в определение: убийство котов.</li>\n</ul>\n<p>Больше об устройстве ордена ничего не сказано. Численность, иерархия, кто его основал, где он базируется, какими средствами он собирается убивать котов — в переписке не названо. Вариант написания «Орден для убийства котов» и исходная форма «орден предназначеный для убийства котов» — одна и та же строка, других формулировок нет.</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0175-S02", "MR-0175--naselenie"], "h": "<p>Состав ордена не назван. Ни одного члена, основателя или руководителя в переписке нет.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0175-S03", "MR-0175--mesto-vo-vselennoy"], "h": "<p>Орден назван внутри перечня рас и организаций вселенной (2025-11-17, id 385768–385769; повторно 2025-12-06, id 393286–393290). Перечень открывается котами — теми, против кого орден и создаётся:</p>\n<div class=\"q\"><p>«Коты. Их 9.они сильнеший ( уникальный особенности, я для них не придумал помоги) и вот они есть в каждую эпоху. Если один кот умрёт родиться новый и всегда их будет 9. Они вообще никуда не вмешиваться»</p></div>\n<p>Здесь важны два условия, которые задают орден как задачу. Первое — коты «сильнеший», то есть верх силовой лестницы вселенной. Второе — их количество восстанавливается: «Если один кот умрёт родиться новый и всегда их будет 9». Убийство кота, таким образом, не уменьшает число котов. Как орден относится к этому свойству и есть ли у него способ его обойти — в переписке не разобрано; связь между «всегда их будет 9» и целью ордена авторами не проговорена.</p>\n<p>Третье, что сказано про котов: «Они вообще никуда не вмешиваться». Причина, по которой орден охотится на невмешивающихся, не названа.</p>\n<p>Сам орден стоит в перечне после списка сил, про которые сказано «Ну и дальше расы и организации который равны по силе с друг другом»: детей мирового древа, каменного челика с преступной организацией, азуриэль, группировки сестры (<a href=\"MR-0170.html\">Группировка сестры</a>), правительственной организации по контролю, церкви с паладинами, организации Виктора, пернатых. Входит ли орден в этот ряд «равных по силе» или стоит отдельно — из текста однозначно не следует: он назван строкой ниже, между пернатыми и вампирами.</p>\n<p>Второе появление перечня идёт в разговоре про Оэм и заканчивается фразой «В нашем мире Оэм уже существует много сторон для конфликта» (2025-12-06, id 393290).</p>", "r": [["Группировка сестры", "MR-0170.html"]]}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0175-S04", "MR-0175--kak-menyalsya-po-versiyam"], "h": "<p><strong>2025-11-17 (id 385768–385769, окно w0109).</strong> Орден заявлен как будущая структура вселенной — одной строкой, в общем перечне сил.</p>\n<p><strong>2025-12-06 (id 393286–393290, окно w0112).</strong> Перечень повторён дословно, строка про орден та же. Ничего не добавлено и не убрано.</p>\n<p>За две версии содержание не менялось.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0175-S05", "MR-0175--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Никаких подробностей автором не дано, кроме одной строки назначения.</li>\n<li>Кто входит в орден, кто его создал, когда он появляется — не сказано.</li>\n<li>Почему коты стали целью — не сказано.</li>\n<li>Как орден намерен справиться с тем, что убитый кот заменяется новым и «всегда их будет 9» — не разобрано.</li>\n<li>Удавалось ли ордену убить хоть одного кота — не сказано.</li>\n<li>Отношения ордена с остальными силами перечня — не названы.</li>\n<li>Уникальные особенности самих котов на момент обеих версий тоже не придуманы: «уникальный особенности, я для них не придумал помоги».</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0175--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0170.html\">Группировка сестры</a></li>\n<li><strong>Упомянут в мирах:</strong> <a href=\"MR-0170.html\">Группировка сестры</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0057.html\">Коты (девять котов)</a>, <a href=\"GR-0058.html\">Орден по убийству котов</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0008.html\">Оам</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0175--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-11-17</td>\n<td>385768–385769</td>\n<td>w0109</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-06</td>\n<td>393286–393290</td>\n<td>w0112</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0175-orden-po-ubiystvu-kotov.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0175--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0175.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
