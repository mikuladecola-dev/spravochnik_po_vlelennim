<script>const BASE="";const DOCNAME="Отец ведущего";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0318-S01", "PS-0318--proishozhdenie"], "h": "<p>Персонаж существует только внутри видения, которое Ведущий показывает Софии — разворачивает перед ней сцены из чьего-то детства. По имени персонаж не назван; в переписке он обозначен как «отец ведущего» и «мужчина, что считал себя военным». Материал относится к вселенной, объявленной 2025-11-18 (id 386292) — имени в переписке ей не дали; сам эпизод датирован 2025-11-21, окно w0111, id сообщений 387595–387598, текст написан Славой.</p>\n<p>Внутри видения голос Ведущего произносит: «отец очень сильно любил бить меня железной пряжкой ремня. Словно находил в этом удовольствия.» Это единственное место, где прямо сказано, что избивающий ребёнка мужчина — отец самого Ведущего; в остальном тексте персонаж фигурирует просто как «мужчина» или «тот, что бил её» глазами Софии.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0318-S02", "PS-0318--vneshnost"], "h": "<p>«Крепкий мужчина лет сорока… одет в военную одежду, а в руках его был ремень, с железной пряжкой.» Смотрит «невероятным злым взглядом». Его военная принадлежность оказывается мнимой: «того вонючего мужчины, что гордо говорил, что военный. Хотя от военного у него была лишь форма.»</p>\n<p>В другой сцене того же видения — иначе: «На лице его выступали слезы. Но они слезами радости. Его губы дрожали. И он крепко, но нежно держал свёрток.» Оранжевый свет заката ложится на него, картина описана как «красивой, нежной и изысканной».</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0318-S03", "PS-0318--harakter"], "h": "<p>Показан в двух несовместимых состояниях одного видения.</p>\n<p>Первое: жестокий, получает удовольствие от избиений — «отец очень сильно любил бить меня железной пряжкой ремня. Словно находил в этом удовольствия.» Пьёт («последовал пьяный бормотания»), гордится выдуманной военной принадлежностью, бьёт ремнём, сбрасывает со стула, тащит за волосы по коридору.</p>\n<p>Второе: нежный отец новорождённого — плачет «слезами радости», «нежно улыбнулся и спокойно и медленно начал покачивать свёрток», не реагирует ни на что вокруг («у мужчины не сдвинулась не одна скула»).</p>\n<p>Как эти два состояния связаны друг с другом — не сказано; переписка не поясняет, разные ли это периоды одной судьбы или намеренно подставленные Ведущим картины.</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0318-S04", "PS-0318--sposobnosti"], "h": "<p>Сам по себе персонаж ничего сверхъестественного не совершает — бьёт, пьёт, качает младенца. Но выясняется, что весь его образ — иллюзия, подконтрольная Ведущему: когда тот «быстрым шагом подошёл к мужчине. И ударил его. Тот же просто разлетелся как дым.» То есть физически персонаж нестоек и рассыпается при вмешательстве Ведущего.</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0318-S05", "PS-0318--svyazi-s-drugimi"], "h": "<ul>\n<li>Ведущий — по данным записи, персонаж отмечен как «часть» Ведущего; реплика Ведущего называет его своим отцом.</li>\n<li>София — воспринимает его как фигуру насилия из показанных ей чужих воспоминаний: «узнала. Того самого мужчину, что уже не единожды избивал её.» Пытается спастись от него бегством, у реки кричит ему «Эй тупой мужик. Ты урод!!», из-за чего он гонится за ней в воду.</li>\n<li>Гигантский младенец — указан как связанная сущность, но в прочитанном фрагменте прямого пересечения между ним и «отцом ведущего» нет; связь не прояснена.</li>\n</ul>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0318-S06", "PS-0318--kak-menyalsya"], "h": "<h3>2025-11-21, версия 1 (id 387595–387596)</h3>\n<p>Жестокая фигура: бьёт ремнём с железной пряжкой, пьяный опрокидывает ребёнка со стула, тащит за волосы по коридору, пока у той «уже начинала идти кровь». Ведущий сопровождает сцену репликой от первого лица о собственном отце: «чтобы избежать побоев отца. Я пытался быть идеальным. Пытался наводить частоту. Хорошо учиться.»</p>\n<p>Отдельно в этой же версии показан берег реки: тот же мужчина «весело разговаривал людьми на берегу. Словно всего того, что он творил и не было», приходит в ярость от оскорбления Софии и лезет за ней в воду.</p>\n<h3>2025-11-21, версия 2 (id 387596–387598)</h3>\n<p>Продолжение той же сцены: больничная палата, мужчина держит свёрток с новорождённым, плачет слезами радости. Затем Ведущий разоблачает картину — бьёт мужчину, тот «разлетелся как дым», а на месте сцены проступает мальчик лет пяти без движения, рядом окровавленный кирпич: «кирпич, который держит она своими руками» (держит София), а сам мальчик «был похож, чуть ли не копии мужчины, что бил её». Что именно произошло и кем приходится мальчик персонажу — не сказано.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0318-S07", "PS-0318--chto-s-nim-stalo"], "h": "<p>В прочитанном фрагменте персонаж как иллюзия уничтожен Ведущим («разлетелся как дым»). Существовал ли он в реальности вне видения, жив ли — в переписке не сказано.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0318-S08", "PS-0318--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Не сказано, как соотносятся два состояния видения — жестокий отец и нежный отец новорождённого: разные ли это периоды его жизни или намеренная подмена картин Ведущим.</li>\n<li>Не до конца ясно, чей это отец в буквальном смысле сюжета: голос Ведущего говорит «отец… бил меня», но сцену видит и переживает София, и часть эпизода (кирпич, мальчик без движения) завязана уже на неё саму — прямая связь между линией Ведущего и линией Софии в этом эпизоде не объяснена.</li>\n<li>Связь с Гигантским младенцем, заявленная в карточке персонажа, в прочитанном материале не раскрыта.</li>\n<li>Имя персонажа не названо, только описательные обозначения («отец ведущего», «мужчина, что считал себя военным»).</li>\n<li>Смысл эпизода с окровавленным кирпичом и неподвижным мальчиком — кто его убил и кем он приходится персонажу — не сказано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0318--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0319.html\">Гигантский младенец</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0318--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-11-21</td>\n<td>387595–387596</td>\n<td>w0111</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-11-21</td>\n<td>387596–387598</td>\n<td>w0111</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0318-otec-veduschego.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0318--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0318.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
