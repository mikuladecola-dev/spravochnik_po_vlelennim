<script>const BASE="";const DOCNAME="Алек";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0148-S01", "PS-0148--proishozhdenie"], "h": "<p>Алек — главный герой истории Славы, написанной от первого лица (2024-08-21, id 222143, окно w0054). Он же рассказчик: весь текст — его прямая речь, обращённая к читателю, начинающаяся с «Здравствуйте ну или привет, а блин ладно здорова».</p>\n<p>Себя он представляет так: «Я чел которому не повезло или наоборот повезло это как смотреть». Звать его Алек. Студент 4 курса, живёт один в своей однокомнатной квартире. Оценка себя: «Парень я вроде не плохой. Жил не тужил до одного дня».</p>\n<p>Тот один день — суббота, когда он решил передохнуть от учёбы. «Ну на голодной желудок как то не отдыхается» — и он пошёл в ресторанчик рядом с домом. Заказал какой-то супчик, название не помнит, «у нее какой то названия странная». Пока ел, заметил, что на него смотрят: «вот буквально зырит, пожирает взглядом». Смотрел на него незнакомка, которую он описывает как «ниче себе модможелей, ну на 20». Она подсела к нему, они разговорились, и она предложила пойти к нему домой. Он согласился, хотя ему «слегка сыкотной стало» — он опасался, что за ними могут пойти «какие нибудь анбалы». Причину согласия называет сам: «Ну она так играла на эмоциях, что я согласился».</p>\n<p>Дальше — момент, с которого начинается вся история. Когда он открывал дверь квартиры, наступила темнота: «и здесь темень, не не то бишь в глазах, а в памяти не фига не помнил». Очнулся голым на кровати. На тумбочке лежала записка с извинением и с оповещением, что она выбросила мусор.</p>\n<p>Дальнейшая последовательность его действий, как он её излагает: сразу проверил, всё ли на месте — всё оказалось на месте, кроме мусора («Ну блинон который были на столе»). После проверки испугался по-настоящему: «как бы люди просто так не теряют память». Прошёлся по некоторым докторам. Когда все сказали, что с ним всё окей, забил на это: «как бы а чё париться, раз сам врач говорит, что все ок».</p>\n<p>Пару дней всё было хорошо. На 10-ю ночь после потери памяти ему приснился сон, в котором он в непроглядной темноте бежит от руки.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0148-S02", "PS-0148--vneshnost"], "h": "<p>Собственная внешность Алека в переписке не описана — ни роста, ни лица, ни одежды. Единственная самохарактеристика внешнего порядка отсутствует; о себе он говорит только статусом (студент 4 курса) и самооценкой («парень я вроде не плохой»).</p>\n<p>Косвенно о физическом состоянии: во сне после восьми минут бега он «был готов лёгкий выплюнуть», задыхался; проснулся «весь в поту, и еле дыша».</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0148-S03", "PS-0148--harakter"], "h": "<p>Речевая манера — основная характеристика персонажа. Разговорная, с самоперебивами, обращениями к читателю («И как бы чё делать как да на тебе красивая баба смотрит. Не знаете. Вот и я не знаю»), с постоянным возвратом к теме («Ладно не суть»). Миколай отметил это отдельно: «и язык ещё прикольный у героя. ну речь в плане» (2024-08-21, id 222180).</p>\n<p>Отношение к себе — жёсткое и без самооправданий. О согласии пойти домой с незнакомкой: «Да-да глупо, и не буду оправдываться я ебучий кретин не понимающие ситуаций». О себе в ресторане, когда на него смотрели: «и как еблан продолжил кушать».</p>\n<p>При этом он настаивает на собственной сообразительности: «И конечно же я не совсем дебил, и понимал, что здесь что то не так». «Ну как бы так не бывает что ты без алкоголя без наркоты вдруг теряищи воспоминания». И про сон: «да и я совсем не тупорылый и понимаю, что это не сон, где со мной ничего не будет».</p>\n<p>Склонность бросать тему, когда получена удобная санкция извне: после обхода врачей забил на происшествие, потому что врач сказал, что всё ок.</p>\n<p>Реакция Миколая на характер героя (2024-08-21, id 222164–222166): «ну гг долбаёб какой-то», «с незнакомой женщиной начал общаться», «это опасно же».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0148-S04", "PS-0148--sposobnosti"], "h": "<p>Способностей у Алека в переписке нет. То, что с ним происходит, — то, что делают с ним.</p>\n<p>Отдельно он фиксирует, что во сне у него работает обычная физиология: он выдыхается за восемь минут бега, задыхается, и это он приводит как доказательство, что сон — не сон. Второе такое доказательство — течение времени: «во сне время шло как не во сне. То бишь для меня это длилась и правду всю ночь».</p>\n<p>Образ руки он не увидел, а достроил сам: «Откуда я вообще взял что это рука не знаю, как то подсознательно представил этот образ».</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0148-S05", "PS-0148--svyazi-s-drugimi"], "h": "<p><strong>Незнакомка из ресторана</strong> — женщина, которую он описывает как модель лет двадцати. Встреча с ней в ресторане и приход к нему домой — точка, после которой начинается потеря памяти. В более позднем тексте (2024-08-27, id 225501) рассказчик выдвигает догадку, что это была ведьма или суккуб — см. <a href=\"PS-0157.html\">ведьма (красотка)</a>.</p>\n<p><strong>Рука</strong> (<a href=\"PS-0156.html\">рука из кошмара</a>) — преследователь из сна, появляется на 10-ю ночь после потери памяти. Прикосновение руки Алек описывает подробно: боли не было, но «это ощущалась не как прикосновения к кожи, это сука ощущалась как та не понятно. Но при этом пугающий. Словно холодной рукой притронулись к моему сердцу. Это сука не романтично. Это страшно, что каждую клетка моего тела тряслась». После касания он «стартонул как олимпиец» и бежал всю ночь.</p>", "r": [["ведьма (красотка)", "PS-0157.html"], ["рука из кошмара", "PS-0156.html"]]}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0148-S06", "PS-0148--kak-menyalsya"], "h": "<p><strong>2024-08-21 (id 222143), версия 1.</strong> Единственное появление персонажа в тексте истории: возраст и статус (студент 4 курса, однокомнатная квартира, живёт один), речевая манера, встреча в ресторане, потеря памяти при открывании двери, пробуждение голым, записка и пропавший мусор, обход врачей, первый сон на 10-ю ночь, касание руки, бег всю ночь, пробуждение. Заканчивается текст на положении «Вот сейчас стою и думаю и что дальше ведь это явно не сон».</p>\n<p><strong>2024-08-21 (id 222163–222181), версия 2.</strong> Разбора персонажа авторами как такового нет; есть один вопрос по устройству сцены. Миколай спросил, куда делась женщина: «а куда она делась я чет не понял», «типо когда он память потерял где она была» (id 222169, 222171). Слава ответил: «В следующий части» (id 222172). То есть на 2024-08-21 местонахождение женщины в момент потери памяти сознательно отложено во вторую часть, а не оставлено без ответа.</p>\n<p>Изменений в самом персонаже между версиями нет — вторая версия это реакция и один отложенный вопрос.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0148-S07", "PS-0148--chto-s-nim-stalo"], "h": "<p>На конец текста от 2024-08-21 Алек жив, потерял память об одном вечере, прошёл врачей без результата и пережил первую ночь кошмара. Его положение он формулирует сам: «Вот сейчас стою и думаю и что дальше».</p>\n<p>Продолжение истории (2024-08-27, id 225501, окно w0055) ведётся от того же первого лица и продолжает те же события — 10-й день, потеря памяти, сон-не-сон, — но имя Алека в нём не названо, и в базе рассказчик этой части проходит как «рассказчик истории Славы». В продолжении: он пытался искать в интернете колдунов и экспертов чёрной магии, ничего не нашёл, кошмар вернулся на 15-й день, потом на 17-й, потом каждую ночь; к 23-му дню сбросил 7 кг. Подробности — в <a href=\"PS-0156.html\">рука из кошмара</a>.</p>", "r": [["рука из кошмара", "PS-0156.html"]]}, {"t": "Пробелы", "a": ["S08", "PS-0148-S08", "PS-0148--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Внешность не описана вообще.</li>\n<li>Фамилия, возраст числом, специальность и вуз не названы.</li>\n<li>Где была женщина в момент потери памяти — на 2024-08-21 не сказано, ответ отложен в следующую часть (id 222172).</li>\n<li>Что именно было в записке, кроме извинения и оповещения про мусор, не сказано. Почему пропал именно мусор — не объяснено.</li>\n<li>Каких «некоторых докторов» он обошёл и что именно проверяли, не сказано.</li>\n<li>Связь руки с незнакомкой в тексте 2024-08-21 не проговорена; на этот момент Алек только сам достроил образ руки подсознательно.</li>\n<li>Вселенная в окне w0054 не названа; связь с историями про монстров и спасателя не проговорена (отмечено в базе как неясность).</li>\n<li>Прямая идентификация Алека с рассказчиком продолжения от 2024-08-27 в переписке не сделана — имя там не повторяется.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0148--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0156.html\">рука из кошмара</a>, <a href=\"PS-0157.html\">ведьма (красотка)</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0156.html\">рука из кошмара</a>, <a href=\"PS-0157.html\">ведьма (красотка)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0148--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-21</td>\n<td>222143–222143</td>\n<td>w0054</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-08-21</td>\n<td>222163–222181</td>\n<td>w0054</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0148-alek.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0148--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0148.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
