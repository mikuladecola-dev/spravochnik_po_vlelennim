<script>const BASE="";const DOCNAME="Дети мирового древа";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0161-S01", "MR-0161--ustroystvo"], "h": "<p>«Дети мирового древа» — раса гуманоидных деревянных существ, порождённых мировым древом. Автор описаний — Слава; все версии записи принадлежат ему, Миколай в переписке отзывается и уточняет.</p>\n<p>Происхождение расы названо дважды и одинаково: «Произошли от мутировшого дерева из-за Большого количества Оам» (2025-10-20, id 376399–376403; повторено 2025-11-05, id 382108). В самом первом упоминании (2025-10-02, id 370600–370613) формулировка другая и более общая: «Существо порождённым мировым древом».</p>\n<p>Строение: «гуманноидный деревянный существо с оранжевой сердцевинной, в котором как раз и хранится Оам». Оранжевая сердцевина присутствует во всех описаниях; функция хранилища Оам появляется начиная со второй версии (2025-10-20) — в первой (2025-10-02) сердцевина названа, но что в ней, не сказано.</p>\n<p>Свойства расы, перечисленные Славой единым блоком и повторённые почти дословно во второй и третьей версиях:</p>\n<ul>\n<li>смена облика: «Они могут изменить образ на человеческий»;</li>\n<li>прочность: «Так как они из дерева мирового древа. Хрен ты их пробьешь, не кто из апостоловы не сможет нормально их ранить, а если ранят они будут регенерировать»;</li>\n<li>сила: «Ну и они сверхсильный (сильнейший наверное в физическом плане)»;</li>\n<li>перемещение: «Они могут передвигаться в земле и внутри деревьях»;</li>\n<li>отношение к огню: в первой версии — «Огонь их не перед. Сам огонь на них тухнет», во второй и третьей — «Огонь им не вредит. Сам огонь на них тухнет»;</li>\n<li>бой: «Ну они могут выпускать корни туда сюда ими драться».</li>\n</ul>\n<p>Место обитания добавлено позже: «Дети мирового древа. Живут в мести которой мутировала от Оам» (2025-11-17, id 385768–385769). Конкретная местность не названа.</p>\n<p>Само мировое древо, от которого раса произошла и по которому названа, отдельно в этих окнах не описано — это отмечено в исходнике как неясность дважды (окна w0107 и w0112).</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0161-S02", "MR-0161--naselenie"], "h": "<p>Раса описана как единая, без внутреннего деления на подвиды, ранги или роли. Численность не названа, отдельные представители по именам не упоминаются, вожди и структура общества не описаны. Способ размножения не обсуждался.</p>\n<p>Дети мирового древа перечисляются в переписке всегда рядом с другими обитателями мира. В первом списке (2025-10-02) соседями по перечислению названы: «Апостолы с сверхспособностями (насекомые)», «Каменный Поротой», «Азуриэль», «Допустим вампиры который могут контролировать кровь». В развёрнутом описании мира (2025-10-20 и 2025-11-05) статья о Детях мирового древа стоит между Аскизами и Азуриэлем, в общем ряду мутантов, возникших под воздействием Оам.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0161-S03", "MR-0161--mesto-vo-vselennoy"], "h": "<p>Раса относится к вселенной Оам. Её место в общей расстановке сил зафиксировано в списке рас от 2025-11-17 (id 385768–385769), повторённом без изменений 2025-12-06 (id 393286–393290).</p>\n<p>Порядок в этом списке такой: сначала коты — «Их 9.они сильнеший ( уникальный особенности, я для них не придумал помоги) и вот они есть в каждую эпоху»; затем «Апостолы 21 вторая по силе раса на земле»; затем — «Ну и дальше расы и организации который равны по силе с друг другом», и первой в этом равном ряду идут Дети мирового древа. То есть по силе они поставлены ниже котов и апостолов и наравне с Поротаями («Проротой каменный челике. Владеют преступное организацию. Некий союз с апостолами»), Азуриэлями, группировкой сестры, правительской организацией, церковью с паладинами, организацией Виктора, Пернатыми (Серафим, Пераги), вампирами и Аскизами.</p>\n<p>Отдельно связь с апостолами: апостолы названы как те, кто не может их пробить — «не кто из апостоловы не сможет нормально их ранить». Никакого союза, вражды или контакта между расами в переписке не описано, кроме этого сравнения по силе.</p>\n<p>Сюжетная роль назначена 2025-12-06 (id 393304–393310): «Вообще промежуточными злодеями будут / Дети мирового древа / И клан крылатых ( Серафим)». Тут же Слава добавляет других кандидатов на ту же роль: «Ну или церкви, да и люди иногда», «Да еще и Виктор, что воскрешает трупы, ну точнее делает из них марионеток». Кто при этом два основных злодея — не сказано: Слава говорит «Ну вот у меня в голове два основных злодея», Миколай спрашивает «котов?», ответа в переписке нет.</p>\n<p>В том же окне 2025-12-06 Слава говорит: «В нашем мире Оэм уже существует много сторон для конфликта». Название частицы здесь дано как Оэм, а не Оам; в исходнике место обитания расы в этой версии соответственно записано как мутировавшее от Оэм. Соотношение Оам и Оэм в переписке не разъяснено.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0161-S04", "MR-0161--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-10-02, id 370600–370613 (окно w0106).</strong> Первое появление. Начинается с одной строки: «Существо порождённым мировым древом». Затем раса включена в список тех, «Кто есть пока что не в сформировавшиеся мире», рядом с апостолами, Каменным Поротоем, Азуриэлем и вампирами. Даны: человеческий облик, непробиваемость, невозможность для апостолов их толком ранить, регенерация, звание сильнейших в физическом плане, передвижение в земле и внутри деревьев, потухание огня, бой корнями. Оранжевая сердцевина названа без указания, что в ней хранится. Происхождение — от мирового древа, слово «мутация» ещё не звучит. Сразу же Слава просит: «Если есть идея по их улучшения кидай». Миколай отвечает через два часа: «идеи крутые и ура есть мир». Никаких идей по улучшению в этом окне не последовало.</p>\n<p><strong>Версия 2 — 2025-10-20, id 376399–376403 (окно w0107).</strong> Раса включена в большое описание мира: падение метеоритов, частицы Оам, гибель и адаптация людей, механика поглощения и ёмкости Оам, мутанты. Здесь Дети мирового древа получают отдельную статью в общем перечне мутантов. Изменения относительно версии 1: происхождение переформулировано как мутация — «Произошли от мутировшого дерева из-за Большого количества Оам»; оранжевая сердцевина названа хранилищем Оам — «с оранжевой сердцевинной, в котором как раз и хранится Оам»; фраза об огне поправлена с «Огонь их не перед» на «Огонь им не вредит». Остальной набор свойств перенесён дословно. Завершается сообщением «Пока что так».</p>\n<p><strong>Версия 3 — 2025-11-05, id 382108 (окно w0108).</strong> Блок о расе повторён слово в слово по версии 2, без изменений. Изменений в самой расе нет; повтор идёт в составе повторного изложения всего перечня мутантов (апостолы, Аскизы, Дети мирового древа, Азуриэль, Поротай, вампиры).</p>\n<p><strong>Версия 4 — 2025-11-17, id 385768–385769 (окно w0109).</strong> Формат меняется: вместо описания свойств — расстановка рас по силе и по занятому месту. Новое: «Дети мирового древа. Живут в мести которой мутировала от Оам». Раса поставлена в ряд тех, кто «равны по силе с друг другом», ниже котов и апостолов. Описание внешности и способностей в этой версии не повторяется — оно не отменено, но и не воспроизведено.</p>\n<p><strong>Версия 5 — 2025-12-06, id 393286–393290 (окно w0112).</strong> Список рас от 2025-11-17 повторён дословно, включая строку о месте обитания. Изменений в записи о расе нет. Добавлена реплика про Оэм: «В нашем мире Оэм уже существует много сторон для конфликта».</p>\n<p><strong>Версия 6 — 2025-12-06, id 393304–393310 (окно w0112).</strong> Назначена сюжетная роль: «Вообще промежуточными злодеями будут / Дети мирового древа / И клан крылатых ( Серафим)». Это единственное изменение; свойства и место обитания не пересматриваются.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0161-S05", "MR-0161--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Мировое древо как объект мира отдельно не расписано — отмечено в исходнике для окон w0107 и w0112. Где оно находится, существует ли до сих пор, одно ли оно — не сказано.</li>\n<li>Местность, где живут Дети мирового древа, не названа и не описана — сказано только, что она «мутировала от Оам» (в версии 5 — от Оэм).</li>\n<li>Соотношение Оам и Оэм не разъяснено: в поздних окнах частица называется то так, то так.</li>\n<li>Численность расы, устройство её общества, наличие вождей, способ появления новых особей — не обсуждались.</li>\n<li>Отдельные персонажи из этой расы не названы ни разу.</li>\n<li>Слабости не названы: описаны только неуязвимости (прочность, регенерация, невосприимчивость к огню). Чем их можно убить — в переписке не сказано.</li>\n<li>Просьба Славы «Если есть идея по их улучшения кидай» (2025-10-02) осталась без предложений; отклонённых вариантов по этой расе в переписке нет.</li>\n<li>Вопрос Миколая «котов?» о том, кто два основных злодея, остался без ответа.</li>\n<li>Отношения расы с апостолами, кроме сравнения по прочности, не описаны; союзов и конфликтов с другими расами не назначено.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0161--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0067.html\">Дети мирового древа</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0008.html\">Оам</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0161--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-10-02</td>\n<td>370600–370613</td>\n<td>w0106</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-10-20</td>\n<td>376399–376403</td>\n<td>w0107</td>\n<td>Оам (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-11-05</td>\n<td>382108–382108</td>\n<td>w0108</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-11-17</td>\n<td>385768–385769</td>\n<td>w0109</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-06</td>\n<td>393286–393290</td>\n<td>w0112</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-06</td>\n<td>393304–393310</td>\n<td>w0112</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0161-deti-mirovogo-dreva.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0161--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0161.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
