<script>const BASE="";const DOCNAME="Магия";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0137-S01", "SP-0137--mehanika"], "h": "<p>Центральная механика сеттинга, объявленного 2024-12-21 (id 272184: «лучше возьмём наверное магию для начала»). За один день (окно w0067) определение магии прошло через несколько несовпадающих формулировок, и авторы к общему знаменателю в этом окне не пришли.</p>\n<p><strong>Определение через духов и стихии (id 272115, 2024-12-21 10:41).</strong> Дословно:</p>\n<div class=\"q\"><p>магия обычно имеет 6 классических элементов, огон, земля, воздух, вода, тьма и свет. эти элементы закреплены за духами, некоторые постижения позволяют с этими духами общаться и просьбы на их языке о чем-то например кинут шар огня относительно конца посоха, надо произнести и дух это сделает, а ты потратишь силы, ну маны нет это церковь придумала, а так ты просто калории сбрасываешь</p></div>\n<p>То есть: шесть классических элементов (огонь, земля, воздух, вода, тьма, свет); элементы закреплены за духами; «некоторые постижения» позволяют с духами общаться и просить их «на их языке»; просьба произносится, дух её выполняет, маг тратит силы. Маны в этой версии нет вообще — «маны нет это церковь придумала», расходуются калории.</p>\n<p><strong>Упрощённая модель (id 272195–272201, 12:04).</strong> Миколай сам называет её более простой: «у меня понимание более упрощённое» — «вот есть идея», «есть энергия», «и ты идеи можешь материализовать» «через стихии» «и энергию» «и влиять на разное по разному».</p>\n<p><strong>Итоговая формула вечера (id 272668–272670, 20:52).</strong> «магия это про идею», «имея идею и ману ты её можешь скастовать», «и идею можно написать в книге». Здесь мана уже присутствует как рабочий элемент — в отличие от утренней версии, где её нет.</p>\n<p>Обучение при этой формуле: «обучение идет не содержательной части», «естественно у всех она разная», «их обучают форме», «то каким образом работает та или иная структура гримуара» (id 272697–272700). Сама передача знания идёт от античных мыслителей: они «поняли основные принципы», «в своих книгах они изложили эти мысли», «люди на основе этих идей смогли написать учебники», и, опираясь на учебники, «можно написать свои мысли» «и материализовать через вливание маны» (id 272685–272696).</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0137-S02", "SP-0137--ogranicheniya-i-cena"], "h": "<ul>\n<li>В версии с духами цена — силы и калории: «а ты потратишь силы», «а так ты просто калории сбрасываешь». Восстановление: «на деле их тяжело восстановить», «но возможно» (id 272116–272117). Дальше Миколай оставляет следствия открытыми: «и типа ну дальше включай логику как на самом деле это влияет на организм», «воображение».</li>\n<li>В итоговой формуле цена — мана: понять магию можно, «кастуя и восстанавливая ману» (id 272702).</li>\n<li>Возражение о неоднозначности идеи. Слава: «Да вот каждый поймет её по разному» (id 272672). Ответ Миколая идёт через понятие науки: «наука» «это то» «что не понимается по разному», «они имеет одно значение» (id 272687–272691). Слава: «Философия не точная наука» (id 272690). Спор в окне не закрыт.</li>\n</ul>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0137-S03", "SP-0137--nositeli"], "h": "<p>Магией владеют не только маги дальнего боя. На вопрос Славы «А и маги владеть будут все не только маги дальнего боя?» Миколай отвечает: «ну магия разная будет», «все ли маги», «ну думаю да» (id 272254–272258).</p>\n<p>Разные среды обучения и применения (id 272259–272263): «одни будут учиться в школе», «другие раздолбаи в улицах суету наводят», Слава добавляет «Другие в казармах», Миколай уточняет «типа армия?» и соглашается — «ок».</p>\n<p>См. также <a href=\"MR-0085.html\">Маги в обществе</a> (маги в обществе).</p>", "r": [["Маги в обществе", "MR-0085.html"]]}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0137-S04", "SP-0137--kak-menyalas-po-versiyam"], "h": "<p>Все пять состояний относятся к 2024-12-21, окно w0067.</p>\n<p><strong>Версия 1 (2024-12-21, id 272111–272125, 10:38–10:44).</strong> Слава просит определение: «Скинь определения магии», «Что это блять такое». Миколай даёт версию с шестью классическими элементами, духами, произнесённой просьбой, тратой калорий и прямым отрицанием маны («маны нет это церковь придумала»). Слава спрашивает, есть ли ещё определения; Миколай отвечает, что есть, но соберётся позже.</p>\n<p><strong>Версия 2 (2024-12-21, id 272134–272139, 11:13–11:15).</strong> Слава приносит внешний источник — определения магии со стороннего вики-архива способностей (ссылка на arhiv-sposobnostei.fandom.com) — и предлагает: «Вот пока это за основу». Что именно оттуда взято, в переписке не зафиксировано.</p>\n<p><strong>Версия 3 (2024-12-21, id 272183–272205, 12:00–12:06).</strong> Магия выбирается как то, с чего начинать работу над сеттингом: «лучше возьмём наверное магию для начала», «нам бы хоть что-то делать», «а система сил не то с чем так важно работать» — при этом «важно», «но в истории лучше развивать всё». Слава ставит два вопроса подряд: «Ты хоть понял суть магии», «Ты понял насколько сложно использовать барьерную магию». Миколай отвечает «ладно», «я ещё буду изучать этот вопрос», «у меня понимание более упрощённое» и излагает схему «идея — энергия — материализация через стихии». Слава предлагает объяснить голосом: «Я позвоню попозже и постараюсь объяснить?».</p>\n<p><strong>Версия 4 (2024-12-21, id 272254–272263, 14:12–14:14).</strong> Магия «разная», владеют ею, скорее всего, все маги; школа, улица, казармы/армия как разные среды. В аннотации к этой версии отмечен также вопрос о самоусилениях («баф к физухе»), но в сохранённых сообщениях он не воспроизведён.</p>\n<p><strong>Версия 5 (2024-12-21, id 272666–272705, 20:38–21:08).</strong> Итоговая формула: «магия это про идею», «имея идею и ману ты её можешь скастовать», «и идею можно написать в книге». Обучение форме, а не содержанию. Здесь же — происхождение знания от античных мыслителей и учебников и развёрнутое обоснование гримуаров (см. <a href=\"SP-0141.html\">Гримуары (книги заклинаний)</a>).</p>", "r": [["Гримуары (книги заклинаний)", "SP-0141.html"]]}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S05", "SP-0137-S05", "SP-0137--otklonennye-varianty"], "h": "<ul>\n<li><strong>Мана как выдумка церкви.</strong> В версии 1 маны нет: «ну маны нет это церковь придумала, а так ты просто калории сбрасываешь». К вечеру того же дня мана работает в формуле как обязательный элемент («имея идею и ману ты её можешь скастовать»). Прямого отказа от утренней версии в переписке нет — она просто не воспроизводится дальше. Расхождение зафиксировано и в самом источнике: у Миколая маны сначала нет вообще, у Славы мана — основа всего, к общему знаменателю в окне не пришли.</li>\n<li><strong>Внешние определения магии за основу</strong> (версия 2, ссылка на вики-архив способностей). Предложение прозвучало, дальнейшего следа в переписке не оставило.</li>\n</ul>", "r": []}, {"t": "Связь с другими способностями", "a": ["S06", "SP-0137-S06", "SP-0137--svyaz-s-drugimi-sposobnostyami"], "h": "<ul>\n<li><a href=\"SP-0138.html\">Мана</a> (мана) — предмет главного расхождения: есть она или её «церковь придумала».</li>\n<li><a href=\"SP-0141.html\">Гримуары (книги заклинаний)</a> (гримуары) — прямое продолжение формулы «идею можно написать в книге»; вся вечерняя часть обсуждения магии переходит в обсуждение книг. Механика гримуаров в тот же вечер была отброшена.</li>\n<li><a href=\"SP-0143.html\">Барьерная магия</a> (барьерная магия) — Слава использует её как пробный камень понимания: «Ты понял насколько сложно использовать барьерную магию».</li>\n<li><a href=\"SP-0142.html\">Предрасположенность к магии</a> (предрасположенность к магии) — указана в связях источника.</li>\n<li><a href=\"MR-0085.html\">Маги в обществе</a> (маги в обществе) — среды, где магией пользуются: школа, улица, казармы.</li>\n</ul>", "r": [["Мана", "SP-0138.html"], ["Гримуары (книги заклинаний)", "SP-0141.html"], ["Барьерная магия", "SP-0143.html"], ["Предрасположенность к магии", "SP-0142.html"], ["Маги в обществе", "MR-0085.html"]]}, {"t": "Пробелы", "a": ["S07", "SP-0137-S07", "SP-0137--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Шесть классических элементов версии 1 (огонь, земля, воздух, вода, тьма, свет) с духами и «постижениями» дальше не переиспользуются; как они соотносятся с формулой «идея плюс мана», в переписке не сказано.</li>\n<li>Кто такие духи, как они устроены, что такое «их язык» и что такое «постижения» — не раскрыто.</li>\n<li>Что именно взято из внешних определений магии, на которые ссылался Слава, не зафиксировано.</li>\n<li>Вопрос Славы «Ты хоть понял суть магии» остался без ответа по существу; обещанный телефонный разговор в переписке не отражён.</li>\n<li>Вопрос о самоусилениях (баф к физухе) в сохранённых сообщениях не воспроизведён и ответа не имеет.</li>\n<li>Спор о том, понимается ли идея всеми одинаково, закончился на репликах «наука это то что не понимается по разному» и «Философия не точная наука» — без решения.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0137--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0138.html\">Мана</a>, <a href=\"SP-0141.html\">Гримуары (книги заклинаний)</a>, <a href=\"SP-0142.html\">Предрасположенность к магии</a>, <a href=\"SP-0143.html\">Барьерная магия</a></li>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0085.html\">Маги в обществе</a></li>\n<li><strong>Упомянут в способностях:</strong> <a href=\"SP-0141.html\">Гримуары (книги заклинаний)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0137--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-12-21</td>\n<td>272111–272125</td>\n<td>w0067</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-21</td>\n<td>272134–272139</td>\n<td>w0067</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-21</td>\n<td>272183–272205</td>\n<td>w0067</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-21</td>\n<td>272254–272263</td>\n<td>w0067</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-21</td>\n<td>272666–272705</td>\n<td>w0067</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0137-magiya.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0137--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0137.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
