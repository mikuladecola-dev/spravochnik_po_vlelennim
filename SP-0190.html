<script>const BASE="";const DOCNAME="V:R0 («виро»)";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0190-S01", "SP-0190--mehanika"], "h": "<p>Технология, а не биологическое свойство. Появляется в переписке 2025-02-25 (id 295349–295350, окно w0077) внутри пересланного текста — базой этот материал помечен как чужой: «часть пересланной истории девочки с конкурса, не разработка соавторов».</p>\n<p>Определение дано в самом тексте дословно: «V:R0 – программа для хладнокровной и объективной оценки жизненной ситуации человека, что создавалась для замены ненужным в наших реалиях психологам». Отношение создателя к тем, кого программа заменяет, там же в скобках: «(я хотел сказать, мешкам с кишками, что одобряли хаотичную сторону человека)».</p>\n<p>Официальное название — V:R0. Разговорное — «виро»: «Вместо официального названия обыватели использовали в своей речи сленг \"виро\", что существенно сокращало время произношения и написания».</p>\n<p>Программа развивалась вместе с нейросетями: «Виро развивался вместе с нейросетями, и мы становились всё озолочённей на слова». Работа над ней шла стандартными обновлениями — «гигансткие системы из различных кодовых материалов, которые склеиваем раз за разом мы в стандартное обновление».</p>\n<p>Отдельный продукт линейки — MetaV:RO, он же «мета виро»: «наш первый интерактивный куб \"MetaV:RO\" для работы с маленькими и \"необычными\" пациентами». Это физический предмет, кубик, который держат в руках и крутят. Его функции создатель перечисляет в интервью: «Он не только проанализирует психику вашего ребёнка, но и поможет ему расставить приоритеты ориентируясь на возраст и интересы. Работает даже с самыми травмированными малышами!»</p>\n<p>Виро выдаёт результат в виде того, что было у человека в голове. Единственный показанный в тексте результат — итог сеанса дочери создателя, Ниллы: на вопрос отца «Как её результаты?» ответом идёт одна фраза — «Почему папа меня не любит?». Формат вывода — что именно возвращает программа помимо этого — не описан.</p>\n<p>Применение внутри семьи: отец предлагает виро как способ разрешить конфликт — «Давай ты используешь виро и найдёшь выход из наших разногласий! Вместе работать гораздо лучше, верно?».</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0190-S02", "SP-0190--ogranicheniya-i-cena"], "h": "<p>Технических ограничений программы в тексте не названо.</p>\n<p>Названо коммерческое устройство: базовая версия распространялась как демо, дополнительные функции покупались отдельно. Распространение — «На момент официального релиза виро нашей демоверсией пользовалось более десяти миллионов человек, а через месяц мы набрали первую сотню с последующими покупками дополнительных функций». Виро стала популярна и в других странах, «повсеместно использовали только нашу аналитическую программу».</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0190-S03", "SP-0190--nositeli"], "h": "<p>Пользователи виро — обыватели, десятки и сотни миллионов; предприятия вкладываются в проект («вполне мог бы обеспечить свою семью на сотни лет с одних вкладов крупных предприятий в этот проект»).</p>\n<p>Создатели — фирма, где рассказчик один из создателей и имеет «полное право на управление нашей аналитической новаторской разработкой». По фотографии перечислена команда: рассказчик (Ален), Роберт, Нэн, Мэйя, Барни.</p>\n<p>Нилла — дочь рассказчика, показана на рекламной фотографии MetaV:RO с кубом в руках; эта реклама «обошлась нам дороже, чем все предыдущие», потому что «Девочка улыбается не наигранно». Публично отцовство рассказчик отрицает: на вопрос журналиста «ваша дочь?» он отвечает «А с чего вы взяли, что у меня есть дети?».</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0190-S04", "SP-0190--kak-menyalas-po-versiyam"], "h": "<p>Версия одна, 2025-02-25 (id 295349–295350, окно w0077). Описание дано сразу целиком: назначение, сленговое имя, релиз и число пользователей, детский куб MetaV:RO. Более поздних состояний в базе нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "SP-0190-S05", "SP-0190--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Материал чужой: это часть пересланной истории с конкурса, а не разработка Миколая и Славы. Как виро соотносится с остальной вселенной «Апостол» и соотносится ли вообще — в переписке не сказано.</li>\n<li>Не сказано, как виро технически проводит оценку: что подаётся на вход, по какой методике, где заканчивается программа и начинается нейросеть.</li>\n<li>Не сказано, в каком виде виро отдаёт результат обычному пользователю.</li>\n<li>Не сказано, чем MetaV:RO отличается от виро по устройству, помимо того, что это интерактивный куб для детей и «необычных» пациентов.</li>\n<li>Не пояснено, кто такие «необычные» пациенты — слово в тексте взято в кавычки без расшифровки.</li>\n<li>Не сказано, воспользовалась ли Нилла виро добровольно и как результат «Почему папа меня не любит?» был получен.</li>\n<li>Не сказано, есть ли у виро ошибки, отказы или случаи неверной оценки.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["SP-0190--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-02-25</td>\n<td>295349–295350</td>\n<td>w0077</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0190-v-r0-viro.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0190--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0190.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["SP-0190-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/SP-0190/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Эта ветка ничего не блокирует: на <code>SP-0190</code> не ссылается ни одна статья, на <code>PR-0055</code> «Виро (V:R0) — Ален и Нилла» (14.7 КБ) тоже ноль, на <code>MR-0112</code> «вселенная девочки с конкурса» (3.7 КБ) ноль. По числам чинить виро в последнюю очередь.</p>\n<p>Чинить надо не виро, а границу чужого материала, к которой он относится. <code>SL-0119</code> «Нумерация присланных историй (Первый, Второе, Третье, Четвёртое, Пятая)» — 71.0 КБ базы, статьи нет; <code>SL-0112</code> «Конкурс „Чертова дюжина 2025“» — 6.3 КБ, статьи нет. Это два самых крупных нерасписанных места, где вообще фиксируется, что и от кого пришло со стороны. Пока их нет, у четырёх записей — <code>SP-0190</code>, <code>PR-0055</code>, <code>MR-0112</code>, <code>PS-0208</code> «Земова» — вселенная «Апостол» проставлена по дате объявления, а не по содержанию, и проверить это нечем. Дыра дешёвая в починке и снимает вопрос принадлежности сразу для всех четырёх.</p>\n<h3>С чего начать</h3>\n<p>В базе. Вся проза уже лежит в <code>PR-0055</code> (14.7 КБ) — там же должно быть то, чего в статье о способности нет: что виро отдаёт обычному пользователю и как прошёл сеанс Ниллы. <code>MR-0112</code> (3.7 КБ) — рамка вселенной, к которой этот текст относится по-настоящему. <code>SL-0119</code> (71.0 КБ) — общий список присланного, там же соседние истории того же происхождения.</p>\n<p>В архив идти надо не за механикой программы (её в чужом тексте, скорее всего, и нет), а за реакцией: окно w0077, 2025-02-25, id 295349–295350. Ориентир — сообщения вокруг пересылки: кто прислал, что соавторы ответили, обсуждали ли, брать ли это в свой мир. Именно там решается, чужой это материал навсегда или заимствование.</p>\n<h3>Как развивалось</h3>\n<p>Одна дата, 2025-02-25, два сообщения. Заявили целиком и сразу: назначение, сленговое имя, релиз, десять миллионов демо-пользователей, детский куб MetaV:RO. Не ограничили — технических пределов не назвали вовсе, только коммерческие. Не вернулись: более поздних состояний в базе нет. Привязку к «Апостолу» получили по дате объявления.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Правило доступа названо для функций: базовая версия — демо для всех, дополнительное покупается отдельно. Правило доступа к результату не названо нигде. Сеанс проходит Нилла, а единственную выданную фразу — «Почему папа меня не любит?» — слышит отец, который эту фразу и заказал. Кому вообще уходит вывод программы, объявленной «хладнокровной и объективной», — пациенту, тому, кто её включил, или фирме, — не проговорено. Для денег правило есть, для того же вопроса про результат — нет.</p>\n<h3>Отклик</h3>\n<p>Зацепила скобка: «(я хотел сказать, мешкам с кишками, что одобряли хаотичную сторону человека)». Она делает половину работы по характеру рассказчика — человек, который поправляется в сторону худшего. И конструкция целиком неглупая: программа, созданная, чтобы заменить тех, кто «одобрял хаотичную сторону человека», в итоге выдаёт ровно один результат за весь текст, и результат этот — детский вопрос, на который объективная оценка ситуации ничего не отвечает. Рекламный кадр с Ниллой, который «обошёлся нам дороже, чем все предыдущие», потому что «Девочка улыбается не наигранно», и следом публичное «А с чего вы взяли, что у меня есть дети?» — это собрано аккуратнее, чем большинство материала вокруг. Обидно только, что текст чужой и в справочнике висит как отдельно стоящий: связей у него нет ни одной.</p></div>", "r": []}];</script>
