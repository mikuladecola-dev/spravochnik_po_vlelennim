<script>const BASE="";const DOCNAME="Страх";
const LEAD="";
const CH=[{"t": "Содержание", "a": ["S01", "IS-0082-S01", "IS-0082--soderzhanie"], "h": "<p>История Славы про дворянского первенца, которого отец отправляет на осаду крепости. Вся работа над ней уместилась в один день (2025-12-09, id 394411–394648, окно w0113): два черновика подряд, построчный разбор Миколая между ними и отказ от истории вечером того же дня.</p>\n<p>Текст начинается от первого лица и по ходу первого же абзаца переходит на третье. Герой едет в карете на войну: «Да именно страх поглотил моей сознания. Руки дрожали, хоть я пытался это скрыть. Меня отправляли на войну. Меня, сына дворянина.» Отправляют его не в тыл и не в штаб, а на передовую — на осаду крепости. Он держит меч в руках «как оберег» и смотрит на мешок со своими вещами, качающийся туда-сюда.</p>\n<p>В карете он теряет счёт времени: «Для него время было бесконечным и при этом мигом». В голове один вопрос — «Почему???», — хотя ответ он знает: отец-граф его недолюбливает, свою роль могли сыграть новая супруга графа и их дети. Он надеется, что мачеха тут ни при чём — «Хоть кто, но не она», — но уверенность тускнеет, потому что он слышал много историй о том, как новые супруги избавляются от детей бывших.</p>\n<p>Он мог бы сбежать — выбить дверь, спрыгнуть с кареты, уйти в лес, — но не может: «Всю жизнь воспитанный дворянином, он даже дрожь пытался скрыть».</p>\n<p>Дальше — построение новобранцев. Многие дрожат, некоторые плачут, фронт знаменит одним из самых высоких показателей смертей. Бенжимен единственный не дрожит: стоит ровно, лицо невозмутимо, «Но это лишь внешний. Внутри же он дрожал, кричал и хотел сбежать». Мысль о побеге он отгоняет рассуждением: бежать поздно, попытка «лишь бы развязала руки всем недругам и солдатам», отец мог заказать его убийство и здесь, «как он делал и раньше». Успокоение от этой мысли автор в тексте называет так: «Скорее это можно назвать смирением».</p>\n<p>Последняя сцена черновика — выход из палатки грозного мужчины со шрамами на лице и «твёрдыми и холодными» глазами. Он смотрит на новобранцев, цокает и думает: «Серьезно, нам на помощь зелёный новобранцы, что даже не разу не убивали». Он понимает, что кадров не хватает, но не мирится с тем, что новобранцев посылают на смерть; жаловаться бесполезно, «Его никто не слушал». Обрыв черновика приходится на середину фразы: «Взгляд остановился на г».</p>\n<p>Заявленный жанр (394531): «это фэнтези с магией и другими расами». Планировалось развить «недопонимания». Заявленная задача жанра — комедия: на вопрос Миколая, зачем он начал эту историю, Слава отвечает «Комедия», с оговоркой «Наверное» (394552–394553). Миколай отмечает: «пока на комедию не похоже, не смешно» (394554).</p>\n<p>Мир взят готовым: «Клише из клише фэнтези мир» (394547), «Не придумал просто взял существующий» (394550).</p>\n<p>Злодей в истории на момент разговора не появился: «В это истории злодея ещё не появилась» (394579). Идей по злодеям и их планам Слава спрашивал у Миколая для ОАМ, не для этой истории; ответ — «пока нет идей» (394577–394578).</p>", "r": []}, {"t": "Персонажи", "a": ["S02", "IS-0082-S02", "IS-0082--personazhi"], "h": "<p><strong>Бенжимен Бэнуар</strong> (в тексте написание колеблется: «Бенжимен» и «Бэнжимен») — главный герой. «Я Бенжимен Бэнуар первенец и ближайшее на замену отцу дворянина». Единственный дворянин среди отправленных на передовую (394512–394513: на вопрос «она единственный дворянин?» ответ — «Он»).</p>\n<p>Уточнения, полученные в разборе:</p>\n<ul>\n<li>Отправил его отец (394478–394479).</li>\n<li>Мать — покойная жена графа, не «шлюха». Миколай спрашивал прямо: «он сын шлюхи или покойной матери?» — «Покойной матери» (394487–394489); «и еще мать была жена графа?» — «Да» (394496–394497). Слава на постановку вопроса отреагировал: «Я разочарование о таких мыслих» (394491) и «Я та не прям любитель жестить. Тем более в этом плане» (394495).</li>\n<li>Мать умерла сразу после родов (394500).</li>\n<li>Воспитывала его мачеха: «Мачеха» / «Мать умерла, а отец ненавидел» (394509–394510).</li>\n<li>Мечом владеть умеет и учился — на вопрос «интересно держал ли он раньше мечь и учился ли где-то» ответ «Да» (394515, 394518).</li>\n<li>Магией владеть не будет: «Гг не будет владеть магией. Чисто хладнокровием и мечом будет шататься» (394531).</li>\n<li>Отец, по мыслям героя, и раньше заказывал его убийство.</li>\n</ul>\n<p><strong>Отец, граф</strong> — не скрывает неприязни к сыну; во второй редакции формулировка изменена (см. ниже). У графа новая супруга и дети от неё, которые «тоже могли сыграть роль».</p>\n<p><strong>Мачеха</strong> — новая супруга графа, воспитывала героя. Герой надеется, что отправка на передовую не её рук дело.</p>\n<p><strong>Мужчина со шрамами</strong> — командир (звание не названо), выходит из палатки к строю новобранцев. Лицо в шрамах, глаза «твёрдые и холодные», «пережил много сражений», «сам его вид вызывал тревогу в сердцах новобранцев». Понимает нехватку кадров, но не мирится с отправкой новобранцев на смерть, его жалоб никто не слушает. Имя в переписке не названо.</p>\n<p><strong>Новобранцы</strong> — молодые; в первой редакции «простолюдины», во второй просто «парни». Дрожат, плачут, «у большинства которых опухли глаза».</p>\n<p>По братьям у героя вопрос задан, но не отвечен: «а братья есть интересно покачто» (394458). Известно только о детях графа от новой супруги.</p>\n<p>Связанные записи справочника: Бенжимен Бэнуар, Мир истории «Страх», Фанатик.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "IS-0082-S03", "IS-0082--mesto-vo-vselennoy"], "h": "<p>Вселенная в переписке не объявлена; отнесение к «Фене» сделано по дате. Мир описан самим автором как готовый шаблон: «Клише из клише фэнтези мир», «Не придумал просто взял существующий» (394547, 394550). Наполнение: магия и другие расы (394531).</p>\n<p>Сеттинг Миколай определил при чтении: «ок, сеттинг, средние века походу» и «и перс не русский» — с оговоркой «не обсираю но мне нужна такая заметка» (394451–394453).</p>\n<p>Устройство отправки на войну проговорено отдельно: аристократов, если и посылают, то в безопасные места — «Например в столицу или просто в тылу. Как типо резервный солдаты, который балту пинают» (394459), «Я же сказал что Аристократов если и посылают на войну то в безопасные места» (394518). Именно поэтому отправка героя на передовую требует объяснения, и после разбора Слава решил такую сцену добавить: «из-за тебя я понял, что нужно добавить сценку где будет говориться как он туда так легко попал» (394531).</p>\n<p>Про сам фронт в тексте: на этой осаде «пролилось уже литр крови» (вторая редакция), фронт «славился высокой смертностью», и причина смертности названа прямо — «Лишь из-за того, что сюда повышают новобранцев, здесь высокая смертность».</p>\n<p>Связь с исекаем: 2025-12-09 15:17 Миколай спросил, исекай ли это. Ответ — «Это нет», «Другой будет» (394636–394637). То есть «Страх» исекаем не является, но следующая история Славы после него — исекай.</p>", "r": []}, {"t": "Состояние", "a": ["S04", "IS-0082-S04", "IS-0082--sostoyanie"], "h": "<p>Брошена в день написания.</p>\n<p><strong>2025-12-09, утро (id 394411–394433).</strong> Слава просит оценку: «Если я тебе скину истории. Ты сможешь сказать норм или говно?», «Только честно», «И если что я либо просто брошу эту историю либо продолжу. Но ты об этом не думай». Миколай: «я не умею что-то засирать», «буду цепляться за каждое нахуй слово», «по моим хотелкам и критериям». Условие Славы на разбор: «Нет сука, не орфография. Это блять черновик. А именно текст». Миколай подтверждает: «не орфография», «всё остальное на мыло», «где грязно будет видно». Скинут первый черновик (394433).</p>\n<p><strong>Разбор первого черновика (id 394447–394500).</strong> Миколай читает по ходу и комментирует:</p>\n<ul>\n<li>о названии: «название это сильная позиция любой работы, что-то важное. значит буду это учитывать всю историю интересно как сработает» (394447). Слава: «Блять ты же знаешь мои истории. Название и истории иногда не сочетаються» (394448);</li>\n<li>о мече: «в карете с мечом, меч как оберег, типа предмет защитник», «визуально интересно» (394460, 394463);</li>\n<li>о приёме: «ты пытаешься показать а не рассказать», «это хорошо», но с оговоркой «но я из тех читателей которые не выкупают ибо читают редко» (394464–394466);</li>\n<li>про мешок с вещами Слава поясняет: «Это я простое не знал как показать что у него есть вещи» (394470), Миколай — «если т то ваще круто» (394472), Слава — «Все понил больше деталь сюда» (394473);</li>\n<li>вопросы по фактуре: кто отправил (отец), сын покойной матери или нет, была ли мать женой графа, был ли брак по расчёту за деньги. На последнее: «Я не знаю я не думал об этом. Его мать просто сразу умерла после родов и я посчитал это не важным» (394500).</li>\n</ul>\n<p><strong>Продолжение разбора (id 394504–394531).</strong> Миколай отмечает отдельные места: «адекватный», «он бы мог, но он не мог», «крутое слово», «твёрдые глаза», «крутой», «интересное слово», «ты круто прописываешь детали». Заданы вопросы про воспитание, про меч, про реакцию окружающих на героя («интересно как на него другие реагируют», 394520 — ответ «Узнаешь», 394519). Слава подытоживает жанр, магию у гг и необходимость новой сцены (394531).</p>\n<p><strong>Второй черновик (id 394532).</strong> Тот же фрагмент, переписанный. Отличия от первого:</p>\n<ul>\n<li>«И даже не на, не важные военные точки» → «И даже не на спокойную точку»;</li>\n<li>к осаде крепости добавлено «где пролилось уже литр крови»;</li>\n<li>карета стала «трясущиеся»;</li>\n<li>мешок «попыхах забитыми моими вещами»;</li>\n<li>добавлены звуки снаружи: «Весь его мир был в этой карете. Внутрь проникали звуки пение птиц, и звуки насекомых. Но где-то там далеко»;</li>\n<li>«Его отец граф очень сильно недолюбливал сына» → «Его отец граф не скрывал неприязнь ко мне»;</li>\n<li>«Хоть кто, но не она» → «Кто угодно только не она»;</li>\n<li>«Его уверенность тускнело» → «Его уверенность с каждой минутой тускнело»;</li>\n<li>«новый супруги избавляються от детей бывших супруг» → «новый жены избавляется от детей бывших жен»;</li>\n<li>побег: добавлено «исчезнув»;</li>\n<li>«воспитанный дворянином» → «воспитанный, как благородный дворянин»;</li>\n<li>«с другими молодыми простолюдинами» → «с другими молодыми парнями»;</li>\n<li>«этот фронт быль знаменит одной из самых высоких показатель смертей» → «Этот фронт славился высокой смертностью»;</li>\n<li>лицо героя: «лицо было невозмутимо» → «лицо было словно фарфоровая маска, холодное и невозмутимое»;</li>\n<li>что сдерживает убийц: «другие солдаты» → «свидетели»;</li>\n<li>реплика командира: «зелёный новобранцы» → «зелёный щенков послали», «нехватка кадров» → «нехватка людей», «посылали на смерть» → «посылали на убой».</li>\n</ul>\n<p>Слава о второй редакции: «Вот здесь слегка лучше», «Но не обязательно читать» (394535, 394537).</p>\n<p><strong>Вердикт Миколая (id 394538–394566).</strong> Сначала шуткой: «хуйня полнейшая переделывай» — и сразу «да ладно, щас посмотрю ещё». Замечание по тексту: сбой лица повествования — «ко мне», «его отец ко мне» (394540–394541), Слава: «Понял». Итог: «не я прочитал», «пока норм», «не к чему доебаться», «мб позже пересмотрю», «но щас так думаю, не говно», «но черновик недоделанный», «очевидно и не минус», «просто ну не говно и всё», «я думаю хорошая история».</p>\n<p><strong>Планы после вердикта (id 394567–394591).</strong> Слава: «Ладно буду пока развивать. И дорабатывать. Если появляется сомнения я снова скину». По названию Миколай: «ну а вот по названию, ну всё сходится в целом», «страшно челу»; Слава хочет менять — «Надо изменит его», Миколай возражает: «нет это больше для этой части типа», «для одного эпизода». Слава: «Начало и название да подходят. Но дальше-то», Миколай: «вот как развивать будешь там и понятно будет», «мб набросай план ещё». Слава сообщает о заготовках в голове: «Я изменил в голове сценку боя» и «Ещё в голове под накидал разный тревожный мысли гг». Ни изменённая сцена боя, ни тревожные мысли гг в переписку не выложены.</p>\n<p><strong>Отказ, 15:17–15:19 (id 394634–394648).</strong> Слава: «Сдайся. Я кинул эту историю. Потому что не понял гг». Взамен будет исекай — «Другой будет». Про новую историю: «Но вот эту историю я точно до концу». Причина выбора исекая: «Просто есть образ гг. И этот образ отчасти можно оправдать лишь исекаем», «Ну и тем что гг долбоеб». Миколай: «ну исекай можно интересным сделать, просто другой жанр», «жаль кнш, ну понимаю», и отдельно — «ты никогда так не поступал с персами», «мне интересно».</p>\n<p>Отклонённое:</p>\n<ul>\n<li>смена названия «Страх» — предложена Славой, Миколай возразил, что название работает для этого эпизода; итог не зафиксирован, поскольку история брошена в тот же день;</li>\n<li>версия происхождения героя как сына не жены графа — предположение Миколая, отвергнуто автором сразу.</li>\n</ul>\n<p>Незапланированное в тексте: брак родителей по расчёту — «Я не знаю я не думал об этом»; вопрос оставлен без решения.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "IS-0082-S05", "IS-0082--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Название мира и его принадлежность к вселенной не объявлены; сказано только «клише из клише фэнтези мир», «не придумал просто взял существующий».</li>\n<li>Имя командира со шрамами не названо, звание тоже.</li>\n<li>Есть ли у героя братья — вопрос задан (394458) и не отвечен; известны только дети графа от новой супруги, число и пол не названы.</li>\n<li>Реакция окружающих на дворянина в строю не описана: на вопрос ответ «Узнаешь», продолжения нет.</li>\n<li>Сцена, объясняющая, как герой так легко попал на передовую, только заявлена — не написана.</li>\n<li>Изменённая сцена боя и «тревожные мысли гг» существовали только «в голове», в переписку не выложены.</li>\n<li>Злодей в истории не появился, планов злодеев нет: «пока нет идей».</li>\n<li>Как в истории должны были работать магия, другие расы и «недопонимания», не сказано — только перечислено.</li>\n<li>Расы не названы ни одна.</li>\n<li>Что стало с решением менять название — осталось нерешённым.</li>\n<li>Брак матери героя и графа: по расчёту или нет — автор не думал об этом.</li>\n<li>Текст обрывается на середине фразы «Взгляд остановился на г»; что дальше — не написано.</li>\n<li>Что именно значит «не понял гг» — не расшифровано.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["IS-0082--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-12-09</td>\n<td>394411–394500</td>\n<td>w0113</td>\n<td>Феня (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-09</td>\n<td>394504–394531</td>\n<td>w0113</td>\n<td>Феня (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-09</td>\n<td>394531–394591</td>\n<td>w0113</td>\n<td>Феня (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-09</td>\n<td>394634–394648</td>\n<td>w0113</td>\n<td>Феня (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/istorii/IS-0082-strah.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["IS-0082--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/IS-0082.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["IS-0082-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/IS-0082/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дорогой дыры в самой записи нет. Всё, на что ссылается «Страх» — <code>PS-0328</code> Бенжимен Бэнуар (16 713), <code>PS-0330</code> Отец (6 835), <code>MR-0183</code> Мир истории «Страх» (9 118), <code>MR-0184</code> Феня (7 569), <code>IS-0083</code> Фанатик (22 178) — уже со статьями по <code>blockers.json</code>. Ближайшая настоящая дыра лежит не здесь, а на соседней записи: <code>IS-0083</code> «Фанатик», начатая в тот же день сразу после отказа от «Страха», ссылается на группу <code>GR-0081</code> «Семья Бэлут», у которой нет ни статьи, ни материала (<code>est_statya: false</code>, <code>razmer_bazy: 0</code>). Чинить в первую очередь стоит там.</p>\n<h3>С чего начать</h3>\n<p>Архив по «Страху» выбран подчистую. Вся переписка по истории — id 394411–394648, одно окно w0113, один день, 2025-12-09. После 15:19 (id 394648) продолжения нет: история брошена и к ней больше не возвращались. Поэтому незакрытые вопросы статьи — имя командира, есть ли у героя братья, куда делись «изменённая сцена боя» и «тревожные мысли гг» из головы автора, что означает «не понял гг» — это не вопрос поиска по архиву. Их там просто нет: они не были произнесены, а не потеряны при разборе.</p>\n<h3>Как развивалось</h3>\n<p>Всё уместилось в один день. Утром — заявка на разбор: «сможешь сказать норм или говно». В течение дня, по ходу построчного чтения, — ограничение мира и героя: правило про аристократов в тылу, отказ гг от магии, отказ от версии «сын шлюхи» в пользу покойной жены графа. Ближе к вечеру вердикт «не говно» и план «буду пока развивать». Тем же вечером, в 15:17–15:19, — отказ: «Сдайся. Я кинул эту историю. Потому что не понял гг». Возврата не случилось — в том же окне сразу начата «Фанатик».</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>К одной версии происхождения героя — что он сын не жены графа — автор отнёсся резко и вслух: «Я разочарование о таких мыслих», «Я та не прям любитель жестить». К мачехе, которая грозит герою той же по типу судьбой (он боится, что именно новая жена «избавляется от детей бывших»), такой оговорки нет — расхожий сюжетный ход использован без единого слова сомнения в его уместности.</p>\n<h3>Отклик</h3>\n<p>Зацепила скорость и спокойствие финала. Днём — «пока норм», «не к чему доебаться», «я думаю хорошая история», план дорабатывать. Через несколько часов, в том же окне, — отказ без единой попытки спасти уже одобренный текст, просто «не понял гг». Миколай сам отмечает это как нетипичное: «ты никогда так не поступал с персами». Это, кажется, единственное в записи место, где решение не подкреплено ничем крупнее одной фразы — и именно поэтому оно выглядит настоящим, а не постановочным.</p></div>", "r": []}];</script>
