<script>const BASE="";const DOCNAME="Ложный герой";
const LEAD="";
const CH=[{"t": "Об этом тексте", "a": ["S01", "PR-0098-S01", "PR-0098--ob-etom-tekste"], "h": "<ul>\n<li>Дата: 2025-11-21</li>\n<li>Сообщения: 387585–387585</li>\n<li>Состояние: дописано (цельная короткая сцена с финальной строкой)</li>\n<li>Действующие лица: мужчина (Дима), безымянное существо, семья мужчины (мать, дитя, глава семейства)</li>\n</ul>", "r": []}, {"t": "Текст", "a": ["S02", "PR-0098-S02", "PR-0098--tekst"], "h": "<p>Ложный герой</p>\n<p>Была прекрасная ночь. На небе без облачка и можно было увидеть луну, во всей её красе. В деревне, без многоэтажных зданий, что закрывали неба, без дыма выпускаемым бетонным организмам. Небо полный звёзд, что светили куда приятнее солнца, и тишина. В деревне всё люди уже ложились спать, им не был удивительным такой пейзаж, как звёздная неба. Но как видимо не всё готовились ко сну. В одном доме на окраине было слышно шум вызываемая разрушением, и огни в этой доме всё ещё горели в окнах....<br>Окно разбилось под натиском человеческого тела кинутый в окно. Человек подозрительно одетый в тусклую одету, и закрытым лицом. Уже успел приземлиться у деревянных ворот. Мужчина долго не думав вскочил и пристально посмотрел, в разбитое окно. Из окна вылазил что-то не подходящий к небесному пейзажу, и неподходящий к миру реалиста.<br>Это было на удивление жилистым, упругим, рост его был метра 2 если не выше. С виду оно было похоже на человека, но сероватой кожей и с отсутствующимся гениталиями, ну и с рогами, не в том положении, в которым мы привыкли преставоять их нахождения, а в достаточном странном месте. Один из них был вместо уха, другой же спустился чуть ниже уха.<br>И этой громадина было сложно прочесть в разбитое окошечка, через который мужчина пролетел на ура.<br>Мужчина нагнулся и раставил ноги готовый в любую секунду отскочить. Существо же, кое-как смогла выйти через окно, и не теряя времени рывком сократила дистанцию с мужчиной. Оно размашистой замахнулась, и словно плетью ударил по деревяному забору, забор не выдержав натиска неведонного существа сломался на шепки. Человек же который удачно увернулся от удара чудовища, пнул в подколенную ямку. Оно не смогло удержать равновесия присела на колено, и получила точный удар в челюсть. Но даже не строгнула, атаковала в ответ. Из того положения, в котором атаковало существо, атака было читаемой и мужчина отойдя вбок избежал удара. Мужчина решил опрокинуть существо пинком вбок, но оно лишь слегка пошатнулась, схватила его за ногу кинула его так легко, словно мужчина ничего не весил. Человек больно ударился спиной об стену дома, ему показалось, что-то хрустнула. Он надеялся хоть бы не спина, не хватала ему ещё этого. Благо ноги руки он чувствовал, хотя спина всё же жутко болела. Мужчина попытался встать, но был остановлен звонким ударом об его голову. Удар был достаточным, чтобы череп мужчины сломался, как греческий орех. На удивление мужчина не умер, и даже не потерял сознание. Хотя двигаться он всё же мог, лишь кряхтеть и думать &quot;что же дальше? &quot;<br>А дальше существо схватила мужчину за ногу и печально посмотрев в целой окно, в котором мать сильно обнимали своё плачущие дитя, а рядом с ними лежал окрававленое тело главы семейства. Существо развернулась и направилась в густой тёмный лес, которой даже Луны свет не мог разверить, а за собой оно тащила мужчину.</p>\n<p>&quot;Погеройствовал блять Дима&quot; Именно такие мысли лезли в окровавленную голову. Пока этот тащил его куда-то в глубь леса.<br>&lt;/content&gt;</p>", "r": []}, {"t": "Примечания и поправки", "a": ["PR-0098--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PR-0098.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
