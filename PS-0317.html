<script>const BASE="";const DOCNAME="София";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0317-S01", "PS-0317--proishozhdenie"], "h": "<p>Материал относится к вселенной, объявленной 2025-11-18 (id 386292) — «маленькая вселенная по мотивам сна (обратные)»; имени в переписке ей не дали, так и осталась безымянной.</p>\n<p>София — девочка из зрительного зала цирка Ведущего. В сцене (2025-11-21, id 387592) она первая, импульсивно подняв руку, крикнула о желании услышать историю Ведущего, за что тот вывел её на сцену. Рядом с ней в зале сидели родители: отец, явно гордый тем, что именно его дочь вызвали на сцену, и мать, пытавшаяся держать вид строгой, но с глазами, которые «явно выдавали крик души» (387592). Дальнейшее происхождение персонажа, её возраст, фамилия и обстоятельства жизни до цирка в переписке не названы.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0317-S02", "PS-0317--vneshnost"], "h": "<p>В переписке не описана: нет ни одной прямой характеристики роста, волос, одежды. Единственное, что известно — она ребёнок («девочка», «юная леди» — обращение Ведущего), достаточно маленькая, чтобы Ведущий говорил ей о «маленьком тельце».</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0317-S03", "PS-0317--harakter"], "h": "<p>На сцене её «резко ударила смелость. Словно это было не она» (387592) — она задаёт Ведущему вопрос о его имени, хотя это «негласное табу этой сцены», а затем спрашивает его о родителях. После казни чудика, снявшего маску-лицо Ведущего, её реакция — жалость: «Софий стала жалко чудика. За что с ним так. Ну и что, что он маску снял. Лицо у него же не страшное» (387594).</p>\n<p>Внутри маски, оказавшись в теле избитого мальчика и увидев его мучителя на берегу реки, София открыто провоцирует его: «Эй тупой мужик. Ты урод!!» (387596) — и специально показывает, что ей «безразличен гнев мужчины».</p>\n<p>В финале зафиксированного отрывка она отказывается от помощи Ведущего — тот предлагает ей две подсказки, она отвечает: «нет мне не надо. Себе оставь» (387598/387599) — и встаёт «в оборонительную стойку. Готовая биться даже на смерть» (387598).</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0317-S04", "PS-0317--sposobnosti"], "h": "<p>Отдельных способностей самой Софии в переписке не названо. Указан только предел чужой силы применительно к ней: Ведущий сам говорит, что не может «контролировать чувства и эмоции, а также влиять на эмоций или воспоминания» в её голове (387598) — то есть маска даёт доступ к чужим телам и воспоминаниям, но не позволяет управлять её собственными эмоциями. Прямой связи этого ограничения с какой-либо её отдельной способностью в тексте нет — состав не назван.</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0317-S05", "PS-0317--svyazi-s-drugimi"], "h": "<p><strong>Ведущий</strong> — вызывает Софию на сцену, ведёт с ней диалог о вине и о значении её имени («София, а ты знала, что твоё имя обозначает мудрость. Но ты почему-то совершаешь так много глупых поступков», 387594), сравнивает её с чудиками-«актёрами»: «тем более ты не актриса. Вот как эти жалкий, ничтожный опарыши, что бояться даже покаяться» (387594). Проводит её через маску по чужим воспоминаниям, в конце называет «моя безымянная София» (387597/387598).</p>\n<p><strong>Маска ведущего</strong> — предмет, через который София лишается собственного тела и оказывается последовательно в чужих воспоминаниях.</p>\n<p><strong>Цирк ведущего</strong> — место действия, сцена, зрительный зал.</p>\n<p><strong>Родители Софии</strong> — присутствуют в зале, безымянны; после того как София попадает в маску, она видит их «улыбающихся, как манекен», со «стеклянным взглядом» (387595) — то есть в их обычном виде их подменяет иллюзия/часть representación цирка.</p>\n<p><strong>Чудик с маской-лицом Ведущего</strong> — вблизи Софии его казнят (сжигают) за то, что маска с него слетела; её реакция на это описана выше.</p>\n<p><strong>Избитый мальчик / мужчина в военной форме</strong> — чужое тело и чужой мучитель, через которых София проживает воспоминания Ведущего о его детстве.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0317-S06", "PS-0317--kak-menyalsya"], "h": "<p>Все три фрагмента датированы одним днём, 2025-11-21, окно w0111, и представляют собой последовательные сцены одной сессии, а не пересмотр замысла.</p>\n<p><strong>Версия 1 (id 387592–387595).</strong> София — первая на сцене, называет своё имя, нарушает табу вопросом об имени Ведущего, затем спрашивает о его родителях. Наблюдает казнь чудика, снявшего маску, пугается взгляда Ведущего. Ведущий обыгрывает её имя («значит мудрость»), добивается от неё признания вины («ты же чувствуешь вину?» — «да»), обещает «избавить от этого чувства», надевает на неё маску. Она теряет тело, оказывается в теле избитого мальчика.</p>\n<p><strong>Версия 2 (id 387595–387598).</strong> Внутри маски: полностью теряет ощущение собственного тела, лица, рук; переживает избиение мальчика отцом с ремнём и железной пряжкой. Затем — сцена у реки: провоцирует мужчину, чуть не тонет, её вытаскивает Ведущий, снова бросает в воду. Дальше — больничная палата: тот же мужчину умилённо держит новорождённого, у Софии рождается зависть («Я хочу тоже так», «Почуствовать отцовскую любовь»). Сцена сменяется на окровавленный кирпич у неё в руках и тело мальчика на траве — её тошнит. Бежит через лес, слышит смех, который оказывается её собственным — «самый искренний смех за всю её жизнь». Из тьмы выходит огромный рот, называющий её «моя безымянная София» и требующий ответа.</p>\n<p><strong>Версия 3 (id 387598–387599).</strong> Продолжение той же сцены (участок сообщений частично совпадает с версией 2): голос Ведущего возвращает её в собственное тело, она срывает маску, встаёт в оборонительную стойку. Отказывается от предложенных Ведущим подсказок. Ведущий формулирует предел своей власти над ней (не может влиять на её чувства, эмоции и воспоминания). Фрагмент обрывается на реплике «[387599] Слава: Пятая» — без пояснения, к чему относится это слово.</p>\n<p>В переписке также встречаются вариативные написания имени — «София», «Софий», «Софья» — без указания, какое из них закреплено как основное.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0317-S07", "PS-0317--chto-s-nim-stalo"], "h": "<p>Дальнейшая судьба Софии после отказа от подсказок Ведущего в переписке не зафиксирована — фрагмент обрывается на слове «Пятая» (387599), продолжение не найдено.</p>", "r": []}, {"t": "Пробелы — чего в переписке нет", "a": ["S08", "PS-0317-S08", "PS-0317--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Внешность Софии не описана.</li>\n<li>Возраст, фамилия, домашние обстоятельства до цирка не названы.</li>\n<li>Не сказано, почему Ведущий называет её «безымянной», хотя её имя было названо и обыграно в самом начале сцены.</li>\n<li>Не поясняется значение обрывающейся реплики «Пятая» (387599).</li>\n<li>Не уточнено, закреплено ли какое-то одно написание имени («София» / «Софий» / «Софья») как основное — переписка использует все три вперемешку.</li>\n<li>Не сказано, является ли ограничение силы Ведущего («не может влиять на её чувства, эмоции и воспоминания») особенностью именно Софии или общим правилом маски — состав не назван.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0317--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0319.html\">Гигантский младенец</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0317--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-11-21</td>\n<td>387592–387595</td>\n<td>w0111</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-11-21</td>\n<td>387595–387598</td>\n<td>w0111</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-11-21</td>\n<td>387598–387599</td>\n<td>w0111</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0317-sofiya.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0317--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0317.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
