<script>const BASE="";const DOCNAME="Семья";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0170-S01", "PS-0170--proishozhdenie"], "h": "<p>Не отдельный персонаж, а род — «семья», у членов которой с рождения есть особенность, отличающая их от прочих людей. Название семьи нигде не звучит; в переписке она проходит как «семья», «моя семья», «эта семья».</p>\n<p>Разработана целиком за один день, 30 ноября 2024 (окно w0065, id 263344–263749). Заказчик идеи — Слава: он с утра требует «Чё идей по семье нету» (263344) и ставит срок: «Чтобы сегодня было хотя бы одна идею» (263354–263356). Рамку задаёт Слава, механику достраивает Миколай.</p>\n<p>Семья идёт в одном ряду с двумя другими задачами того же дня: Слава просил идеи «2 новых» персонажей и отдельно про растения/траву — эту он «Думал. Но отложил» (263674–263675). Третью сущность Слава оставил Миколаю: «И третий семью должен ты покинуть идею» (263686).</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0170-S02", "PS-0170--vneshnost"], "h": "<p>Не описана.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0170-S03", "PS-0170--harakter"], "h": "<p>Не описан. Семья проработана как носитель механики, характеров отдельных членов в переписке нет.</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0170-S04", "PS-0170--sposobnosti"], "h": "<h3>Рамка: три элемента</h3>\n<p>Формулировка Славы: «Есть три элемента. Сосуд тело структура» (263677). Способности собираются из их комбинаций:</p>\n<ul>\n<li>«Структура+тела=глазки»</li>\n<li>«Сосуд+тело=изменяющую сосуд» (263680)</li>\n</ul>\n<p>Миколай на это добавляет: «и некоторые наследственые структуры по типу глаз», — и сам же убирает возражение: «но это можно в структуру кинуть лан» (263678–263679).</p>\n<h3>Изменение сосуда — версия Славы</h3>\n<p>Ключевая особенность семьи по Славе: «У них с рождения сосуд который они способны по прихоти изменить ( но не слишком сильно потому что сосуд может не выдержать)» (263684).</p>\n<p>Что даёт изменение сосуда:</p>\n<ul>\n<li>«невероятный большой объем сосуд для накопления энергия»</li>\n<li>«идеальная тело с высокими физическими показателями и развитыми всеми чувствами»</li>\n<li>«и ещё что нибудь придумаю» — список оставлен открытым</li>\n</ul>\n<p>Пик возможностей: «когда они могут изменить сосуд на структура то бишь сделать сосуд идентичный с структурой что приведет резонансу с сосудом и структурой и повышает все характеристики и т п. Типо новый прием там» (263684).</p>\n<h3>Кристаллы и переплавка структуры — версия Миколая</h3>\n<p>Миколай перекладывает структуру на свою прежнюю метафору: «как я раньше обозвал твою структуру - кристаллы» (263727).</p>\n<p>Базовое устройство, общее для всех, не только для семьи:</p>\n<ul>\n<li>Энергия в сосуде «жидкая с рождения и всегда», но «конкретно до 7 лет кристаллизуется часть энергии».</li>\n<li>На этом кристалле «написаны данные отраженные в опыте и определяющие способность».</li>\n<li>Способность — не произвольная запись: «я тогда забыл то что не просто кто-то пишет способность а это результат опыта» (263728).</li>\n</ul>\n<p>Почему обычный человек не может сменить способность — объяснено через настоящие кристаллы: «для выращивания настоящих кристаллов есть свой алгоритм, но это процесс обратимый, однако в разных кристаллах сложность разная, например процессоры это монокристаллы и информацией и их не целесообразно и не практично плавить и кристализировать заново, после записывая информацию, проще чистое вещество взять. поэтому никто из людей не может менять свою структуру, это невероятно сложно» (263727).</p>\n<p>Отличие семьи — наследственный механизм: «у них есть структура наследственная, с механизмом упрощающим этот процесс, которых для других невозможен изв сложности. они в течении 2 дней могут давить в определённую точку для изменения агрегатного состояния структуры способности» (263727).</p>\n<p>Что происходит после переплавки: «расплавив они лишаются структуры способности и по сути становятся как новорождённые».</p>\n<h3>Затравка</h3>\n<p>Второе отличие, без которого первое бесполезно: «даже если другие расплавят этот кристал они не создадут его заново не за что ибо для формирования нужна так называемая затравка. при рождении она появляется и благодаря ней появляется возможность кристаллизовать энергию через опыт. так вот у этой семьи наследственная структура имеет возможность создать искусственно затравку» (263727).</p>\n<h3>Цена</h3>\n<p>Сказано прямо: «я, не просто так сказал что они как новорождённые. для кристаллизации новой структуры им нужно то же время что и с момента рождения и она также будет неразвита» (263727).</p>\n<p>Второе ограничение — от Славы: сосуд изменяют «но не слишком сильно потому что сосуд может не выдержать» (263684).</p>\n<h3>В чём выигрыш</h3>\n<p>На прямой вопрос Славы «И где здесь плюсы ? Что сделай эту семью могучий» (263729–263730) Миколай отвечает: «они невъебено могучая» (263733) — и объясняет через качество опыта: «детский опыт довольно мистический, но не всегда сильный, в осознанном возрасте они могут пройти традиционное семейное обучение 2 года, а после развиваться так как пожелают, что позволит создать способности намного сложнее тех что появляются с рождения» (263734).</p>\n<p>То есть переплавка выгодна именно тем, что новую структуру растят осознанно, а не случайным детским опытом.</p>\n<h3>Разброс внутри семьи</h3>\n<p>«у разных членов семьи разное допущение с разными параметрами поиграть может будет» (263727) — заявлено как возможность, конкретных членов и параметров не названо.</p>\n<h3>Позиция автора о балансе</h3>\n<p>Миколай отдельно оговаривает границу: «и ваще не хочу я делать их имбалансными. это обычные люди со способностями, не обязательно семейники самые сильные, это нечестно, но обычные не могут менять способность и обречены жить с тем что есть, а вот моя семья способна изменить на более привлекательную и крутую в основном возрасте» (263734).</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0170-S05", "PS-0170--svyazi-s-drugimi"], "h": "<p><strong>Глазки.</strong> Способность из комбинации «Структура+тела», названа Славой в той же рамке трёх элементов. К семье привязана только через общую систему; отдельно связь с семьёй не оговорена.</p>\n<p><strong>Три элемента: сосуд, тело, структура.</strong> Общая система, внутри которой семья определена.</p>\n<p><strong>Кристаллизация энергии, Затравка, Изменение сосуда, Наследственный механизм смены структуры.</strong> Механики, из которых собран этот род.</p>\n<p><strong>Обычные люди со способностями.</strong> Названы как противопоставление: «обычные не могут менять способность и обречены жить с тем что есть».</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0170-S06", "PS-0170--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2024-11-30, id 263344–263356.</strong> Служебный разгон, содержания нет. Слава требует идей, Миколай отвечает: «не, нету», «ток сейчас проснулся». Слава ставит срок на тот же день.</p>\n<p><strong>Версия 2 — 2024-11-30, вечер, id 263587–263686.</strong> Слава задаёт рамку. Три элемента, две комбинации (глазки, изменяющая сосуд), семья с врождённой способностью изменять сосуд «по прихоти», ограничение по прочности сосуда, перечень выгод, пик в виде резонанса сосуда и структуры. Миколай на этом этапе комбинацию «сосуд плюс тело» не понял и переспросил: «че эта комбинация даёт» (263681–263682); ответом и стало развёрнутое описание семьи.</p>\n<p><strong>Версия 3 — 2024-11-30, 21:08–21:38, id 263710–263734.</strong> Миколай достраивает механику. Сначала он приостанавливается: «одну деталь ток щас вспомнил», «я думал типа всё умный, но вспомнил кое че» (263717–263718) — этой деталью оказывается то, что способность есть результат опыта, а не произвольная запись. Затем — кристаллы, семилетний порог кристаллизации, сравнение с процессорами, двухдневное давление в точку, состояние новорождённого, искусственная затравка, двухлетнее традиционное семейное обучение в осознанном возрасте, оговорка про имбаланс.</p>\n<p><strong>Версия 4 — 2024-11-30, 21:39–21:44, id 263735–263749.</strong> Слава вариант отклоняет.</p>", "r": []}, {"t": "Отклонённое", "a": ["S07", "PS-0170-S07", "PS-0170--otklonennoe"], "h": "<p>Версия Миколая с кристаллами и переплавкой отвергнута Славой в тот же вечер. Диалог целиком: «че думаешь?» — «Ну не» — «а че не понравилось?» — «Без бафоф» — «это сплошной баф как по мне», «я не понимаю» (263735–263740).</p>\n<p>Слава смягчает отказ, но идею не принимает: «Ну идею ты мне подкинул», «Молодец» (263741, 263743). Миколай закрывает тему: «ладно, в другой раз постараюсь своевременно подкидывать идеи», «а пока на сегодня всё» (263744–263745).</p>\n<p>Расхождение осталось неразобранным: Слава считает вариант «без бафов», Миколай — «сплошной баф», и разбор в переписке не состоялся.</p>\n<p>Отдельно отложена соседняя задача про растения/траву: «Думал. Но отложил» (263674–263675).</p>", "r": []}, {"t": "Что с ним стало", "a": ["S08", "PS-0170-S08", "PS-0170--chto-s-nim-stalo"], "h": "<p>Разработка остановилась на отказе Славы вечером 30 ноября. Принятой считается только рамка Славы (три элемента, изменение сосуда, резонанс); достройка Миколая (кристаллы, переплавка, затравка) отклонена и в дальнейшую работу не пошла.</p>\n<p>Отдельно осталось висеть обещание Славы объяснить претензию — не по семье, а по манере разговора: Миколай спрашивает «когда напишешь что тебе не понравилось в том что и как я говорил? или ты удалил пока я спал?», Слава отвечает «Через часик напишу» (263746–263748). Написал ли — в переписке нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S09", "PS-0170-S09", "PS-0170--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Название семьи нигде не звучит.</li>\n<li>Вселенная не объявлена.</li>\n<li>Ни один член семьи не назван по имени; заявленное «у разных членов семьи разное допущение с разными параметрами» не раскрыто.</li>\n<li>Перечень выгод от изменения сосуда оставлен открытым самим автором: «и ещё что нибудь придумаю».</li>\n<li>Не сказано, насколько именно «не слишком сильно» можно менять сосуд и что происходит, если сосуд не выдержит.</li>\n<li>Что такое «определённая точка», в которую давят два дня, — не сказано.</li>\n<li>Содержание «традиционного семейного обучения 2 года» не описано.</li>\n<li>Не объяснено, почему Слава счёл вариант «без бафов»; разбор обещан, но в переписке его нет.</li>\n<li>Связь семьи с «глазками» через рамку трёх элементов не проговорена — есть ли глазки у членов семьи, не сказано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0170--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0040.html\">Семья</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0170--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-11-30</td>\n<td>263344–263356</td>\n<td>w0065</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-11-30</td>\n<td>263587–263686</td>\n<td>w0065</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-11-30</td>\n<td>263710–263734</td>\n<td>w0065</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-11-30</td>\n<td>263735–263749</td>\n<td>w0065</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0170-semya.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0170--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0170.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
