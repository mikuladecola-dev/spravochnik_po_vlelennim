<script>const BASE="";const DOCNAME="Божество";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0193-S01", "PS-0193--proishozhdenie"], "h": "<p>Персонаж вселенной «Апостол». В переписке окна w0072 он появляется не как новая придумка, а как отсылка к уже существующему замыслу: Слава пишет «7 грехов и божество ( помнишь его)» (2025-01-23, id 284175). Формулировка «помнишь его» означает, что Божество было придумано раньше этого окна; самого описания — кто это, откуда взялся, как выглядит — в переписке здесь нет.</p>\n<p>Вводится Божество сразу в связке с семью грехами — как существо того же уровня, что и они.</p>", "r": []}, {"t": "Способности", "a": ["S02", "PS-0193-S02", "PS-0193--sposobnosti"], "h": "<p>Способности Божества в переписке не названы. Указано только его место по силе — и то в общей формулировке, относящейся сразу и к семи грехам, и к Божеству: «Будет слабей главы этой организации но сильней благословенного» (2025-01-23, id 284175).</p>\n<p>То есть по шкале силы:</p>\n<ul>\n<li>глава организации — выше;</li>\n<li>семь грехов и Божество — средний уровень;</li>\n<li>благословенный — ниже.</li>\n</ul>\n<p>Что это за «организация» и кто её глава, в этом фрагменте не сказано.</p>\n<p>Сразу за этой репликой (id 284176) Слава расписывает способности каждого из семи грехов по отдельности — Похоть (<a href=\"PS-0188.html\">Похоть</a>), Чревоугодие, Алчность, Лень, Гнев, Зависть (<a href=\"PS-0191.html\">Зависть (грех)</a>), Гордыня. Божества в этом перечне нет: расписаны только грехи, Божество остаётся без способности.</p>", "r": [["Похоть", "PS-0188.html"], ["Зависть (грех)", "PS-0191.html"]]}, {"t": "Связи с другими", "a": ["S03", "PS-0193-S03", "PS-0193--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Семь грехов</strong> — поставлено с ними в один ряд по силе, одной репликой и одним уровнем иерархии.</li>\n<li><strong>Глава организации</strong> — сильнее Божества. Кто это, не названо.</li>\n<li><strong>Благословенный</strong> — слабее Божества. «Благословенный» в переписке одновременно и категория, и заголовок списка персонажей (Имитатор, Агрегат, Разрушительнитца, Палач, Защитник, Дитя света, Бессмертный выродок, Хулиган, Вибрация, Ученица).</li>\n<li><strong>Враги</strong> — Божество числится в списке врагов (2025-01-24, id 284248).</li>\n</ul>", "r": []}, {"t": "Как менялся — состояния по датам, старое не затирается", "a": ["S04", "PS-0193-S04", "PS-0193--kak-menyalsya"], "h": "<h3>2025-01-23 (id 284175–284177) — место в иерархии</h3>\n<p>Первое упоминание в окне. Божество ставится рядом с семью грехами: «7 грехов и божество ( помнишь его) / Будет слабей главы этой организации но сильней благословенного».</p>\n<h3>2025-01-24 (id 284248–284250) — в каталоге врагов</h3>\n<p>Слава выкладывает каталог персонажей, разбитый на «Благословенный:» и «Враг:». Божество стоит в списке врагов, записанное как «Божество😵»:</p>\n<div class=\"q\"><p>Доспехи 🏳️ / Козлиха🪓 / Сестра 🚺 / Огненный снайпер🔥 / Охотник 🔪 / Божество😵 / Убийца🩸 / Зонтик🩸 / Леший 🌳 / Пар 💨 / Садистка ✂️ / Насекомое 😡 / Старик ➡️⬅️</p></div>\n<p>Здесь же, отдельным блоком, идёт «Идей: Чёрный ящик, озеро перерождения, корень желаний».</p>\n<p>Сразу после каталога Слава задаёт вопрос: «Угадай кто из врагов чужамириц» (id 284249) и «?» (id 284250). Божество входит в список врагов, из которого предлагается угадывать чужемирца, — то есть попадает в круг кандидатов. Ответа на вопрос в переписке нет; кто именно чужемирец, осталось нерешённым.</p>\n<p>Тот же каталог врагов повторяется 2025-01-24 в id 284278 с одним отличием — в конец списка врагов добавлен «Эльф 🌬». Позиция Божества при этом не меняется.</p>", "r": []}, {"t": "Пробелы — чего в переписке нет", "a": ["S05", "PS-0193-S05", "PS-0193--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Внешность не описана вообще.</li>\n<li>Характер не описан.</li>\n<li>Способности не названы — задано только место по силе.</li>\n<li>Не сказано, как Божество связано с семью грехами по сути: только что оно того же уровня. Является ли оно их частью, начальником, отдельной фигурой — в переписке не сказано.</li>\n<li>Не названо, что за организация имеется в виду и кто её глава.</li>\n<li>Имя, происхождение и история персонажа остались за пределами окна: есть только отсылка «помнишь его».</li>\n<li>Кто из врагов чужемирец — вопрос задан (id 284249), ответ в переписке не зафиксирован.</li>\n<li>Что с персонажем стало дальше — в переписке не сказано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0193--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0006.html\">Организация злодеев</a></li>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0188.html\">Похоть</a>, <a href=\"PS-0191.html\">Зависть (грех)</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0188.html\">Похоть</a>, <a href=\"PS-0191.html\">Зависть (грех)</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0006.html\">Организация злодеев</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0193--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-01-23</td>\n<td>284175–284177</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2025-01-24</td>\n<td>284248–284250</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0193-bozhestvo.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0193--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0193.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0193-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0193/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — каталоги. <code>SL-0051</code> «Каталог: благословенные, враги, грехи, оружие, артефакты»: шесть ссылок, статьи нет, база 9 834. Это единственное место во всём наборе, где Божество вообще существует как что-то кроме одной реплики: строка «Божество😵» в перечне врагов, обе редакции от 2025-01-24 (284248 и 284278) лежат там. Рядом <code>SL-0053</code> — тоже шесть ссылок, статьи нет, база 20 313. Два самых цитируемых объекта набора, и оба без статьи; пока их нет, у половины персонажей вселенной единственный источник существования читателю недоступен.</p>\n<p>Второе — то, чего нет вообще. Реплика «7 грехов и божество ( помнишь его)» отсылает к разговору до 2025-01-23, и сущности на этот разговор в базе не заведено ни одной. У самого <code>PS-0193</code> база 4 074 — ровно то, что уже процитировано в статье, наращивать неоткуда. Для сравнения: у Похоти 4 054, у Лени 4 125, у Зависти 4 062 — все пять записей это один и тот же кусок окна w0072, размноженный по номерам.</p>\n<p>Третье — иерархия, в которую Божество поставлено. <code>MR-0107</code> «Иерархия силы»: четыре ссылки, статья есть, 5 534 — держит ту же реплику 284175 и добавляет к ней цену. <code>PS-0185</code> «Глава организации злодеев»: две ссылки, статья есть, 3 050 — там прямо сказано, кто это: единственная благословлённая правителем нашего мира, женский персонаж, выше неё нет никого. Статья при этом трижды повторяет «кто глава организации, не названо». В переписке окна — не названо, в справочнике — названо, и это дешевле всего исправить.</p>\n<h3>С чего начать</h3>\n<p>В базе:</p>\n<ul>\n<li><code>SL-0051</code> (9 834) — обе редакции каталога целиком, вместе с оговоркой Славы, что у всех перечисленных продумано только вид, способность и плюс-минус характер. Это прямой ответ на пробел «внешность и характер не описаны»: их и не было.</li>\n<li><code>MR-0107</code> (5 534) и <code>MR-0105</code> «Организация злодеев» (четыре ссылки, статья есть, 4 924) — вторая половина иерархии: сколько благословенных нужно, чтобы убить греха, и из кого организация состоит.</li>\n<li>Вопрос 284249 «Угадай кто из врагов чужамириц»: смотреть <code>MR-0100</code> «Чужемирцы и аномальные люди» (две ссылки, статья есть, 3 285), <code>PS-0198</code> «Чужемирцы» (58 680) и <code>PS-0218</code> «Эльф (чужемирец)» (5 563, w0079, 300765: попал в наш мир, почуял апостола). Эльф появился в списке врагов позже самого вопроса — в 284278, — так что ответом на 284249 он быть не может по времени, но проверить эту дорожку стоит первой.</li>\n</ul>\n<p>Ловушка: <code>ID-0052</code> «Божественные способности (3 основные)» (3 402, статьи нет) по имени липнет мгновенно, а это 2024-05-07, вселенная «игра бога», другой разговор.</p>\n<p>В архив — за «помнишь его», и это единственное, за чем туда идти. Ориентир: до 2025-01-23, окно w0070 и раньше, вокруг разговора 2025-01-06 про грехи как существ минимиров (<code>MR-0101</code>, 4 608) и про правителей минимиров (<code>MR-0103</code>, 3 793) — Божество введено в связке с грехами, и если оно где-то придумывалось, то в том же слое. Вторая точка — w0072 до 284170, где начинается разговор про благословения Бога и дьявола.</p>\n<h3>Как развивалось</h3>\n<p>2025-01-23 — заявили ссылкой назад, на то, чего в окне нет: «помнишь его». Той же репликой ограничили с двух сторон — слабее главы, сильнее благословенного. Следующим сообщением, 284176, автор расписывает способности всем семи грехам по одному, и Божество из перечня выпадает: поставлено в ряд и пропущено при раздаче. 2025-01-24 — вернулись, но уже в другом качестве: не фигура, а строка в списке врагов, «Божество😵», шестая из тринадцати. В тот же день список повторён с добавленным в конец Эльфом — позиция Божества не изменилась. Между двумя каталогами задан вопрос про чужемирца и не закрыт. Дальше записей нет.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>В том же окне w0072 цена названа прямо: чтобы убить одного греха в максимуме, нужно три благословенных именно Бога, а для остальных благословенных — пять (<code>MR-0107</code>, 2025-01-24). Правило существует, оно количественное и проверяемое.</p>\n<p>Божество поставлено на тот же уровень тем же движением и той же фразой. Цены для него не названо — ни числа, ни «столько же», ни «неизвестно». Уровень общий, правило написано только для одной половины уровня.</p>\n<h3>Отклик</h3>\n<p>Зацепило «помнишь его» — две скобки, в которых вся история персонажа. Человек вводит в мир фигуру уровня семи грехов, и вводит её как напоминание, а не как новость; значит, где-то был вечер, когда её придумали, и он не в этом чате или не в этом окне. Дальше по тексту видно, чем это оборачивается: при раздаче способностей Божество просто пропускают, а через день оно оседает в списке врагов между Охотником и Убийцей, с грустным смайликом и без единого слова. Самая сильная вещь тут — не персонаж, а сам жест: назвать существо божеством и тут же поставить его в середину чужой иерархии, ниже женщины, благословлённой правителем. В мире, где божество — это не вершина, а средний уровень, есть что-то, чего в самом описании нет и, боюсь, уже не будет.</p></div>", "r": []}];</script>
