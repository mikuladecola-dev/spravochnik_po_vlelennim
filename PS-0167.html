<script>const BASE="";const DOCNAME="Толстяк-задира";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0167-S01", "PS-0167--proishozhdenie"], "h": "<p>Персонаж введён не в обсуждении, а сразу в прозе: 2024-11-11 Слава прислал в чат фрагмент от первого лица (id 255795, окно w0063), где герой утром идёт в школу и встречает на крыльце этого персонажа. Имени у него нет — в тексте он «здоровяк», «толстый задира», «толстяк».</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0167-S02", "PS-0167--vneshnost"], "h": "<p>Прямого описания нет, кроме того, что он «здоровяк» и «толстый задира». В конце эпизода у него «окровавленной лицо».</p>\n<p>Отдельно нужно отметить: описание «он был большим, а руки длинный и острый ногти» в том же фрагменте относится не к толстяку, а к существу, которого герой боится, — и приведено как раз в рассуждении о том, не человек ли это существо.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0167-S03", "PS-0167--harakter"], "h": "<p>Задира. Действует не один, а с группой — герой допускает, что «возможно он снова придет со свой недо бандой».</p>\n<p>Конфликт двусторонний и начался не с толстяка: накануне герой сам разбил ему нос, за что толстяк после уроков ждал его на заднем дворе, «где меня очевидно отмутохали». Наутро он снова ждёт на крыльце.</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0167-S04", "PS-0167--svyazi-s-drugimi"], "h": "<p><strong>ГГ-защитник.</strong> Единственная связь. Толстяк — тот, на ком герой вымещает состояние: «И я с весельем и наслаждением снова зарядил ему в лицо, было приятно просто подраться, забыть обо всем и просто бить толстого задиру. Пытаясь забыть, пытаясь выплеснуть все те эмоции который не давай мне успокоиться».</p>\n<p>Дальше герой прямо противопоставляет толстяка настоящему источнику страха. Людей он не боится по принципиальным соображениям: «Я не боялся людей, ведь это глупо человек боится человека если это и будет так то наша общество не крепче картонной коробке, а я верил что нашей общество крепкая, поэтому я не боялся». Боится он другого: «то невообразимое существо который в любой момент может взять и убить я боюсь его настолько что мое страх перерастает в гнев а из гнева в решимость убить эту тварь, ради безопасности сестры, ради мой безопасности, ради безопасности этого толстяка которого я сейчас бью».</p>\n<p>То есть избиваемый толстяк попадает в тот же список тех, кого герой защищает, — наравне с сестрой и самим собой. Эпизод заканчивается благодарностью: «Я с благодарностью взглянул на окровавленной лицо толстяка. Он дал мне решимость и почти что решил страх. Я благодарен ему и его лицу».</p>", "r": []}, {"t": "Как менялся", "a": ["S05", "PS-0167-S05", "PS-0167--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2024-11-11 (id 255795–255805, окно w0063).</strong> Единственное состояние. Весь персонаж целиком содержится в одном присланном фрагменте прозы; переработок и последующих версий нет.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S06", "PS-0167-S06", "PS-0167--chto-s-nim-stalo"], "h": "<p>Обсуждения фрагмента в переписке не последовало. Через четыре часа Миколай ответил только о своём порядке чтения: «так как я решил что буду читать и думать» — «я хуй его знает когда прочту» — «но хорошо что ты написал» (255803–255805). Дальше персонаж не появляется.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0167-S07", "PS-0167--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имени нет.</li>\n<li>Внешность за пределами слов «здоровяк» и «толстый» не описана.</li>\n<li>«Недобанда» упомянута, но состав её не назван и никто из неё не показан.</li>\n<li>Из-за чего герой накануне разбил ему нос — не сказано.</li>\n<li>Чем закончилась утренняя драка на крыльце и было ли продолжение — осталось нерешённым: соавтор фрагмент на момент переписки не прочитал.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0167--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0047.html\">Банда толстяка-задиры («недобанда»)</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0163.html\">ГГ-защитник</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0047.html\">Банда толстяка-задиры («недобанда»)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0167--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-11-11</td>\n<td>255795–255805</td>\n<td>w0063</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0167-tolstyak-zadira.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0167--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0167.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
