<script>const BASE="";const DOCNAME="Вселенная (наш мир)";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0093-S01", "MR-0093--ustroystvo"], "h": "<p>Наш мир. Слава вводит его первым же сообщением 2025-01-06 (id 278852): «Сразу, все это происходит в современном мире. Вот есть наш мир будем называть \"Вселенной\" и этот мир самый большой».</p>\n<p>Три свойства, объявленные сразу и повторённые дальше: он <strong>первый</strong>, он <strong>самый большой</strong>, он <strong>бесконечный</strong>. На вопрос М «большой это как» (278857) и «как эти размеры работают?» (278860) ответ: «Это бесконечный» (278862). Повторно подтверждено в 279031: «Вселенная бесконечная».</p>\n<p>Что такое мир вообще — М спрашивает сходу (278855: «че такое мир»), ответ: «Типо параллельный мир. Но как я говорил наш мир первый и самый большой» (278856).</p>\n<p>Планеты есть. М спрашивает: «а у нас планеты есть? если планета сама бесконечна? вряд ли. тобиж все действия на земле. но существо вселенную контролирует» (279024–279028). Ответ: «Есть» (279030) и «Вселенная бесконечная» (279031). То есть планеты существуют, действие истории идёт на земле, при этом бесконечна вселенная, а не планета.</p>\n<p>Правитель. Правитель нашего мира — «существо». Формулировки: «Также есть существо в нашем мире который является правителем нашего мира ( но сейчас он не нейтрален, в сюжете пока его не будет)» (278868); «Существо» (278886) — в ответ на вопрос «а наш кто создал?». Наш мир никем не создан: на вопрос М С отвечает «Нет» (278885), затем называет «Существо». «Существо» — самый сильный: «Но самым сильном является \"существо\"» (278889).</p>\n<p>Смерть. «Существо являющий правителем нашего мира создала смерть которая таскает души в разный миры» (278883). «Смерть таскает наши души в других миры» (278875). Причина, по которой умерший не остаётся здесь: «из за \"смерти\" она после нашей кончины не даёт остаться в нашем мире и вечно отправлять нам куда-то» (278852).</p>\n<p>Душа. На вопрос «че такое душа» (278890): «Это мы, наш фантомный облик» (278892).</p>\n<p>Край мира. У мира можно увидеть конец, и падение с края переносит в другой мир: «Ты можешь увидеть конец мира. Если ты упадешь то просто попадешь в другой мир. Он просто кусок нашего мира» (278873).</p>\n<p>Благословение. Правители миров могут дать своё благословение, но только людям из нашего мира: «И вот эти правитель могут дать свой благословение, но они могут дать свой благословений только людям из нашего мира» (278852).</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Отклик — не материал авторов</b>\n<p>Сильное здесь — как быстро большое сводится к маленькому. На «большой это как» и «как эти размеры работают?» ответ приходит в три слова: «Это бесконечный». И следом Миколай задаёт единственный вопрос, который в этом окне действительно опасен: «как мы это покажем в истории?» — и он остаётся без ответа. Между этими двумя репликами вся разница между устройством мира и работающим текстом, и она тут видна невооружённым глазом.</p></div>", "r": []}, {"t": "Население", "a": ["S02", "MR-0093-S02", "MR-0093--naselenie"], "h": "<p>Люди. Отдельно оговорена практика благословенных (279029): «Чаще всего эти благословенный создают какую-то организацию, так как в одиночку это просто не возможно. В этой организаций могут быть как и простые люди как и благословенный( от минимиров), а также аномальный люди или даже чужемирцый». То есть в нашем мире действуют организации смешанного состава: простые люди, благословенные от минимиров, аномальные люди, чужемирцы.</p>\n<p>Существа из других миров, попавшие сюда через край своего мира, — драконы, упыри, оборотни, леший и прочие мифические монстры. Подробнее см. <a href=\"MR-0094.html\">Минимиры</a>.</p>\n<p>Смерть — существо, созданное «существом», уносящее души умерших в другие миры.</p>\n<p>Правитель нашего мира — «существо». В сюжете на момент 2025-01-06 его не будет: «но сейчас он не нейтрален, в сюжете пока его не будет» (278868).</p>", "r": [["Минимиры", "MR-0094.html"]]}, {"t": "Место во вселенной", "a": ["S03", "MR-0093-S03", "MR-0093--mesto-vo-vselennoy"], "h": "<p>Наш мир — основа, с которой строятся остальные. «Вообще все миры будь то \"рай\" или \"ад\" или минимиры всегда связаны с нашем миров так как наш мир появился первым и является самым большим, и чаще всего минимиры пытаются копировать нашей мир» (278852). Развёрнуто (278908): «Самая крепкая связь с нашем миров так как он первый и по суть на основе него строились и другие миры. Между всеми мирами есть связь но самый сильной только с нашем».</p>\n<p>Иерархия по размеру: наш мир самый большой (бесконечный), на втором месте — «рай» и «ад», кроме них есть множество минимиров.</p>\n<p>Рай и ад. «вот смотри мы умираем и отправляемся в рай или ад, ну или в минимирок ну это случается крайне редко» (278852). Побеги идут в одну сторону: «И вот из \"рай\" по понятным причинам не кто не хочет сбегать, а вот с \"ад\" грешники сбегают, и вот сразу дьявол правитель \"ада\" добрый, типо он карает грешников». Правитель рая — Бог: «Бог есть в рая он его правитель» (278868).</p>\n<p>Переход односторонний. Обитатели других миров могут попасть к нам через край своего мира; мы при жизни уйти не можем: «Мы же пока живы не можем попасть в другой мир» (278878).</p>\n<p>Никто не контролирует все миры сразу. На прямой вопрос «а есть кто-то кто контролирует все миры?» (278887) — «Нет» (278888), с оговоркой про силу «существа».</p>\n<p>Число миров на 2025-01-06: три плюс минимиры, вопрос о расширении отложен («Ну это надо подумать», «Ну пока 3 мира», 278896–278897).</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0093-S04", "MR-0093--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-01-06, 14:17–14:21 (id 278852–278863).</strong> Первое изложение. Всё происходит в современном мире; наш мир называется «Вселенной», он первый и самый большой; на втором месте рай и ад; кроме них множество минимиров. Задана связь всех миров с нашим, копирование, посмертие, Смерть, правители и благословение. На уточняющие вопросы М размер конкретизирован как бесконечность.</p>\n<p><strong>Версия 2 — 2025-01-06, 14:23–14:37 (id 278869–278909).</strong> Ответы на вопросы М. У мира есть край, упавший с края попадает в другой мир. Все миры связаны с нашим сильнее всего, потому что он первый и на его основе строились остальные. Наш мир никем не создан, его правитель — «существо», оно же создало Смерть. Душа — «это мы, наш фантомный облик». Правители не имеют облика, могут принять любой, полностью контролируют свой мир, изменяя пространство, включая размеры. Правители появились в пустоте, «по итогу создавая землю воду и т.д.». Никто не контролирует все миры; самое сильное — «существо».</p>\n<p><strong>Версия 3 — 2025-01-06, 15:16–15:18 (id 279024–279031).</strong> Планеты есть; действие истории идёт на земле; бесконечна вселенная, а не планета; «существо» контролирует вселенную. Здесь же — про организации, создаваемые благословенными, и их смешанный состав.</p>\n<p><strong>Позднее переименование (2025-03-18).</strong> В изложении устройства мира от 2025-03-18 (id 305116, см. <a href=\"MR-0122.html\">Агенты</a>) наш мир назван не «Вселенной», а «Килькой»: «В начале всего было ничего. Потом появился первый мир \"Килька\". И да это наш мир». Само переименование в переписке не обсуждается и не объясняется; свойства (первый, связь всех миров крепче всего с ним) при этом сохранены.</p>", "r": [["Агенты", "MR-0122.html"]]}, {"t": "Пробелы", "a": ["S05", "MR-0093-S05", "MR-0093--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Что такое «существо» подробно — не раскрыто. Сказано только, что оно правитель нашего мира, самое сильное, создало Смерть и «сейчас он не нейтрален, в сюжете пока его не будет».</li>\n<li>Как именно показать «большой» и «бесконечный» в самой истории — М спросил прямо: «как мы это покажем в истории?» (278859), ответа по существу нет, дан только сам факт бесконечности.</li>\n<li>Мотивы Смерти — «ей платят за это? нахуя она это делает? вредная привычка?» (278877) — без ответа.</li>\n<li>Останется ли миров три — отложено (278895–278897).</li>\n<li>Как связаны названия «Вселенная» и «Килька» для одного и того же мира — в переписке не сказано.</li>\n<li>Знают ли обычные люди и животные об устройстве миров (278911) — вопрос задан, ответа нет.</li>\n<li>Организации благословенных (279029) названы, но ни одна конкретная организация в этом окне не описана.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0093--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0094.html\">Минимиры</a>, <a href=\"MR-0122.html\">Агенты</a></li>\n<li><strong>Упомянут в мирах:</strong> <a href=\"MR-0094.html\">Минимиры</a>, <a href=\"MR-0122.html\">Агенты</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0023.html\">Правители (правители миров, правители минимиров)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0093--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-01-06</td>\n<td>278852–278863</td>\n<td>w0070</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-06</td>\n<td>278869–278909</td>\n<td>w0070</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-06</td>\n<td>279024–279031</td>\n<td>w0070</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0093-vselennaya-nash-mir.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0093--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0093.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["MR-0093-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/MR-0093/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первое, что чинить, — «существо». На нём здесь держится всё: правитель нашего мира, единственный, кто никем не создан, самый сильный, создатель Смерти. Отдельной статьи под этим именем нет, и хуже того — имя в базе занято чужим объектом: «Существо» стоит псевдонимом у <code>MR-0068</code> / <code>PS-0166</code> «Существо с длинными руками» (18 447 и 11 978 знаков), это другой персонаж из другой линии. Второй кандидат, <code>PS-0306</code> «Существо-Бог» — 4 210 знаков, статьи нет, вселенная не определена. Похоже, ту же фигуру описывает <code>PS-0217</code> «Правитель Кильки» — две ссылки, статья есть, база 14 203, там и происхождение правителей, и порядок их появления, и механика благословения. Но нигде не сказано, что «существо» из января 2025 и правитель Кильки — одно и то же, а придумывать это отождествление нельзя. Пока оно не подтверждено, дыра стоит дорого: через «существо» в статье завязаны Смерть, души, иерархия силы и отсутствие создателя у нашего мира.</p>\n<p>Вторая по цене — название. <code>MR-0207</code> «Килька»: 68 896 знаков базы против 12 112 у этой статьи. Пробел «как связаны „Вселенная“ и „Килька“» блокирует не одну статью, а весь верхний этаж космологии: <code>PS-0278</code> «Правители» (26 811), <code>MR-0120</code> «Правитель» (35 010), <code>MR-0140</code> «Способы покинуть свой мир» (23 534) написаны уже в терминах Кильки, а этот текст — в терминах «Вселенной». Пока связка не проговорена, два описания одного мира живут порознь.</p>\n<h3>С чего начать</h3>\n<p>В базе. Архив нужен в двух точках, не больше.</p>\n<p>По «существу» и правителям — <code>PS-0217</code>, <code>MR-0207</code>, <code>PS-0278</code>, <code>MR-0120</code>, <code>MR-0097</code> «Правители миров» (9 624), <code>MR-0103</code> «Правители минимиров» (3 793). Всё со статьями, всё вне связей этой статьи.</p>\n<p>По краю мира и переходу — материал разъехался: здесь край описан одной репликой (id 278873), а систематика лежит в <code>MR-0121</code> «Три способа перехода между мирами» (4 234) и <code>MR-0140</code> «Способы покинуть свой мир» (23 534). Ни та, ни другая в связях не значатся.</p>\n<p>По пробелу «знают ли обычные люди об устройстве миров» (вопрос 278911) — <code>MR-0102</code> «Общество и знание о мирах», статья есть, база 4 050: запись заведена ровно под этот вопрос, проверить надо, отвечает ли она на него.</p>\n<p>По организациям благословенных (279029) — <code>MR-0099</code> «Территории и организации благословенных» (3 135). Мало, но это ближайшее.</p>\n<p>В архив идти за двумя вещами. Первое — мотивы Смерти: вопрос задан 2025-01-06, id 278877, в окне ответа нет; <code>PS-0178</code> «Смерть» — 5 826 знаков, <code>MR-0098</code> «Душа» — 1 596, обе маленькие, значит ответа скорее всего нет и в базе. Второе — молчаливое переименование: 2025-03-18, id 305116; смотреть надо не само сообщение, оно уже процитировано, а что идёт до и после него в тот день.</p>\n<h3>Как развивалось</h3>\n<p>Один день, три захода. 14:17–14:21 — заявили целиком: наш мир первый, самый большой, называется «Вселенной», рай и ад вторые, дальше минимиры, всё связано с нашим. 14:23–14:37 — ограничили под вопросами Миколая: появился край, появилось «существо», появилось «мы пока живы не можем попасть в другой мир», размер сведён к «это бесконечный». 15:16–15:18 — добавили планеты и организации благословенных. Тем же днём отложили вопрос о числе миров: «Ну пока 3 мира». Через два с лишним месяца, 2025-03-18, мир пересказан заново и уже под именем «Килька», без упоминания прежнего названия. К имени «Вселенная» в переписке не возвращались.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Правило о благословении названо с ограничением: правители миров могут дать благословение, «но они могут дать свой благословений только людям из нашего мира». Правило про чужих названо. Про своего — нет: даёт ли благословение «существо», правитель нашего мира, и кому оно его даёт, если все прочие правители благословляют именно его жителей, — не проговорено. Позиция ровно того же рода, что и у остальных правителей, а формулировки для неё нет. Показываю место.</p>\n<h3>Отклик</h3>\n<p>Сильное здесь — как быстро большое сводится к маленькому. На «большой это как» и «как эти размеры работают?» ответ приходит в три слова: «Это бесконечный». И следом Миколай задаёт единственный вопрос, который в этом окне действительно опасен: «как мы это покажем в истории?» — и он остаётся без ответа. Между этими двумя репликами вся разница между устройством мира и работающим текстом, и она тут видна невооружённым глазом.</p>\n<p>Отдельно — «Это мы, наш фантомный облик». Четыре слова про душу, и они лучше, чем девяносто процентов космологий, которые я читал: не субстанция, не искра, а облик, то есть внешность без тела. И лучший вопрос окна — «ей платят за это? нахуя она это делает? вредная привычка?» про Смерть. Существо, которое таскает души по мирам и у которого нет ни причины, ни зарплаты, ни привычки, — это готовый персонаж, и он до сих пор пустой.</p></div>", "r": []}];</script>
