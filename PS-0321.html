<script>const BASE="";const DOCNAME="Рыба-человек";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0321-S01", "PS-0321--proishozhdenie"], "h": "<p>Персонаж вселенной «монстры». Слава называет его «Мой первый написанный монстор» — то есть первым монстром, которого он записал (2025-11-29, id 389955–389958). Миколай подтверждает, что помнит его: «а я помню».</p>\n<p>Само упоминание возникло задним числом, при пересылке старого сообщения — Слава переслал сообщение 215834 и отреагировал на него: «Вау». Описания существа в этом окне нет, есть только отсылка к пересланному сообщению.</p>\n<p>Имя записывается как «Рыба-человек», встречаются написания «Рыба человек», «рыба-человек».</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S02", "PS-0321-S02", "PS-0321--kak-menyalsya"], "h": "<p><strong>2025-11-29 (окно w0111, id 389955–389958).</strong> Единственное состояние в переписке — повтор прежней мысли, а не новая разработка. Слава пересылает старое сообщение 215834, называет Рыбу-человека своим первым написанным монстром, Миколай подтверждает, что помнит. Изменений задумки в этом обмене нет.</p>\n<p>Других версий в переписке не зафиксировано.</p>", "r": []}, {"t": "Пробелы — чего в переписке нет", "a": ["S03", "PS-0321-S03", "PS-0321--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Материал существа лежит вне окна, в сообщении 215834. В самом окне w0111 описания нет.</li>\n<li>Внешность не описана.</li>\n<li>Характер не описан.</li>\n<li>Способности не названы.</li>\n<li>Связи с другими персонажами не названы.</li>\n<li>Что с ним стало — в переписке не сказано.</li>\n<li>Дата, когда Рыба-человек был написан впервые, не названа: сказано только, что это первый написанный монстр Славы.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["PS-0321--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody
