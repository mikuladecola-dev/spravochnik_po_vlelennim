<script>const BASE="";const DOCNAME="Зурбон";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0098-S01", "PS-0098--proishozhdenie"], "h": "<p>Персонаж Миколая, объявлен 2024-06-21 (id 185089–185096). Появился как ответная карточка в обмене: Миколай пишет «У меня будет костяной», Слава в тот же момент присылает свою карточку персонажа Сталкер (снайпер в кибермаске, способность — огонь), а Миколай следом выкладывает полную карточку Зурбона. Тем же утром Слава предложил добавить в общий шаблон характеристик отдельный стат — меткость («Добавим ещё один стать меткость»), и в карточке Зурбона меткость уже есть.</p>\n<p>Карточка заполнена по общему формату: имя, возраст, любит, не любит, статы, оружие, инструмент, способности, приёмы, черты характера, описание внешности.</p>\n<ul>\n<li>Возраст: 34.</li>\n<li>Любит: «морских губок, стимпанк и технарей».</li>\n<li>Не любит: «романтику, птиц (в том числе в еде)».</li>\n<li>Сила: 7. Ловкость: 10. Меткость: 3. Скорость: 5. Контроль: 7.</li>\n<li>Оружие: «маленькая секира размером с предплечье».</li>\n<li>Инструмент: «мешок с инвентарём на пол гектара вместимостью».</li>\n</ul>\n<p>Выносливость в карточке Зурбона не указана, хотя в карточке Сталкера в том же обмене она есть.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0098-S02", "PS-0098--vneshnost"], "h": "<p>Стимпанковский вид, описан в карточке дословно:</p>\n<p>«Цилиндр на голове, медный монокль на левом глазу. Одет в чёрный фрак, галстук в стиле стимпанк, на руках множество перстней и браслетов с реальным механическим функционалом, брюки подвернуты и выглядят как шорты, на икрах татуировки дырок вы коже, которые трипофобов люто пугают».</p>\n<p>Перстни и браслеты оговорены отдельно как имеющие «реальный механический функционал».</p>\n<p>В тот же день (2024-06-21, id 185194–185201) Миколай прислал рисунки — внешность и отдельно тату, с пометкой «Много попыток было, единственная норм». Слава сказал, что представлял персонажа иначе: «Я думал старик с длинными усами». Миколай возраст подтвердил: «Ну ему 34», «Норм, ещё молодой» — и прислал второй рисунок, о котором сказал «Тут уже возраст хорошо передан». Сами изображения в переписке не описаны словами.</p>\n<p>Вечером того же дня (id 185262–185280) обсуждалась нарисованная фигура с несимметричным телосложением. Слава: «Да нахуй симметрию». Миколай объяснил несимметричность как следствие способности: «Он просто одни кости удлинил, другие уменьшил», «Это его способность», «Ничего странного». На вопрос Славы «А кожа мышцы куда» и «Сухожилия жир» ответа не последовало — Миколай признал: «Это я не продумал», «Подловил блин».</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0098-S03", "PS-0098--harakter"], "h": "<p>Из карточки дословно: «очень добрый и отзывчивый, любит помогать людям, особенно тем кто шарит за технику. В бою немного конченый, цветы блять выращивает чтобы на них похоронить противника».</p>\n<p>То есть отзывчивость и симпатия к технарям — базовая черта, а боевое поведение вынесено отдельным пунктом как контраст: выращивание цветов под будущую могилу противника прямо в бою.</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0098-S04", "PS-0098--sposobnosti"], "h": "<p>Способность — контроль и созидание костей. Три приёма, дословно по карточке:</p>\n<ol>\n<li><strong>Костная мука</strong> — «дробление костей в муку и последующее разпыление на растения увеличивает их способность к росту. Иногда они превосходят свои возможности вырастая за секунду до колоссальных размеров, что помогает ему в бою или для поднятия на высоту».</li>\n<li><strong>Суставная связка</strong> — «созданные кости он может соединять между собой суставами для создания неких цепей или может так кости приклеивать к чему либо например к секире».</li>\n<li><strong>Манипуляция собственными костями</strong> — «увеличение, уменьшение, улучшение гибкости. Может как росомаха когти сделать пхех».</li>\n</ol>\n<p>Третий приём применяется и вне боя: несимметричное телосложение на рисунке объяснено именно им — персонаж одни свои кости удлинил, другие уменьшил.</p>\n<p>Связка приёмов 1 и «цветы блять выращивает чтобы на них похоронить противника» из черт характера: рост растений обеспечивается костной мукой.</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0098-S05", "PS-0098--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Сталкер</strong> — персонаж Славы, чья карточка идёт в переписке непосредственно перед карточкой Зурбона (id 185093). Сюжетной связи между ними в переписке не названо, только соседство в обмене карточками.</li>\n<li><strong>Катапира</strong> — в окне w0121 (2026-06-14) Зурбон и Катапира упоминаются вместе как персонажи, пересланные из старой переписки и вставляемые в новую вселенную.</li>\n<li><strong>Текси</strong> — числится в связях записи; в приведённых кусках переписки связь не раскрыта.</li>\n<li><strong>Система характеристик персонажей</strong> — Зурбон заполнен по общему шаблону статов, в обсуждении которого в тот же день добавили меткость.</li>\n</ul>", "r": []}, {"t": "Как менялся", "a": ["S06", "PS-0098-S06", "PS-0098--kak-menyalsya"], "h": "<p><strong>2024-06-21, id 185089–185096.</strong> Полная карточка целиком: имя, возраст 34, любит/не любит, статы (сила 7, ловкость 10, меткость 3, скорость 5, контроль 7), оружие, инструмент, способность, три приёма, черты характера, абзац внешности.</p>\n<p><strong>2024-06-21, id 185194–185201.</strong> Присланы рисунки внешности и татуировки. Возраст обсуждён и подтверждён: 34, а не старик. Ничего в карточке не изменено.</p>\n<p><strong>2024-06-21, id 185262–185280.</strong> Обсуждена несимметричная фигура на рисунке. Несимметричность закреплена как результат работы способности над собственным скелетом. Вопрос о мягких тканях (кожа, мышцы, сухожилия, жир) при изменении длины костей поставлен и оставлен без ответа.</p>\n<p><strong>2026-06-14, id 489440–489441.</strong> Слава присылает карточку Зурбона слово в слово в прежнем виде — те же возраст, статы, оружие, инструмент, три приёма, черты характера и абзац внешности. Ни одна цифра и ни одна формулировка не изменены. Следом: «Короче я слегка их переделал и запихнул в вселенную». В чём состояла переделка, в переписке не сказано — присланный текст карточки идентичен версии 2024 года.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0098-S07", "PS-0098--chto-s-nim-stalo"], "h": "<p>По состоянию на 2026-06-14 персонаж перенесён из старой переписки в новую вселенную вместе с Катапирой. Какая это вселенная — в записи помечено как неясное («вселенная: неясно (по дате объявления)»). Сюжетных событий с участием Зурбона в переписке не описано.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0098-S08", "PS-0098--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Выносливость — единственный стат общего шаблона, не указанный в карточке; ни в одной из четырёх версий он не появился.</li>\n<li>Куда деваются кожа, мышцы, сухожилия и жир при удлинении и укорачивании костей — вопрос Славы (id 185272, 185278) остался без ответа, автор прямо сказал «Это я не продумал».</li>\n<li>Что именно Слава «слегка переделал» перед вставкой во вселенную (2026-06-14) — не сказано; текст карточки при этом не изменился.</li>\n<li>В какую вселенную персонаж вставлен в 2026 году — не названо.</li>\n<li>Происхождение персонажа, его прошлое, место жительства, принадлежность к какой-либо группе — в переписке не сказано.</li>\n<li>Связь с Текси не раскрыта.</li>\n<li>Ограничения способности (расход, откуда берутся кости для созидания, предел размеров) не оговорены.</li>\n<li>Как проявляется в сюжете нелюбовь к романтике и птицам — не сказано.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["PS-0098--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-06-21</td>\n<td>185089–185096</td>\n<td>w0038</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-06-21</td>\n<td>185194–185201</td>\n<td>w0038</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-06-21</td>\n<td>185262–185280</td>\n<td>w0038</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-14</td>\n<td>489440–489441</td>\n<td>w0121</td>\n<td>неясно (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0098-zurbon.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0098--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0098.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
