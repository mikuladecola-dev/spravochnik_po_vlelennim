<script>const BASE="";const DOCNAME="Пустынник";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0225-S01", "PS-0225--proishozhdenie"], "h": "<p>Персонаж появился 2025-03-14 в куске прозы Славы (окно w0081, id 302380) — как фигура, выпрыгивающая из кустов с мечом и спасающая рассказчика. В тот же день, в разговоре по написанному, Миколай спросил, «че за пустынный» (302766), и Слава ответил: «Новый перс» (302768). Миколай сначала предположил, что это Бессмертный — «я просто подумал бессмертный», «раз кровь» (302772–302773); Слава это отверг: «Не» (302775). На уточнение «он благословенный или как там» (302776) Слава ответил «Да» (302777).</p>\n<p>Имя в записи даётся в двух формах: «Пустынник» (заголовок записи, вопрос Миколая — «пустынный») и «пустырник» — так его называет сам текст Славы во всех упоминаниях внутри прозы. Какая форма основная, в переписке не решено.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0225-S02", "PS-0225--vneshnost"], "h": "<p>В сводке записи первое появление описано так: костюм, закрывающий всё тело, поверх него маска, полностью скрывающая лицо, и плащ; меч; на руке, в месте, где режут вены, оставлен открытый участок кожи. В приведённом куске переписки (302380–302383) этого описания нет — оно относится к первому появлению, но дословной цитаты в записи не сохранено. Открытый участок кожи на месте, где режут вены, — то, из-за чего Миколай и предположил Бессмертного («раз кровь»).</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · С чего начать — не материал авторов</b>\n<p>В архив — за двумя вещами, обе в окне w0081. Первая: описание внешности (костюм, маска, плащ, меч, открытая кожа) в сводке есть, дословного куска нет — смотреть надо до 302380, первое появление. Вторая: вопрос Славы «И че какой место и как тебе?» (302781) остался без ответа в сохранённом куске — смотреть вечер 2025-03-14 после 302781 и утро 2025-03-15.</p></div>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0225-S03", "PS-0225--harakter"], "h": "<p>Рассказчик, наблюдающий его со стороны, оценивает его в момент боя как безрассудного: «Что за дурак и глупец. Такие долго не живут. Ну и ладно пока он меня спасает». При этом рассказчик считает, что нужен Пустыннику живым: «Ведь пустырнику я, явно нужен живой».</p>\n<p>Осторожность у него при этом есть: увидев, что Защитник выжил и получил благословение, «пустырник тоже прекрасно понял, что это опасно». Он не стал продолжать бой, а перехватил рассказчика через плечо и побежал.</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0225-S04", "PS-0225--sposobnosti"], "h": "<p>Он благословенный (302776–302777). Какое именно благословение — в переписке не названо.</p>\n<p>Бой он начинает без благословения. Логика этого проговорена рассказчиком: «Одно дело это сражаться без благословенния с обычным человеком. Зная, что ты можешь использовать благословенния в любой момент. Другой же дело это сражаться с другим благословенным. Ещё не обычным, а с апостолом».</p>\n<p>В сцене бегства: несёт рассказчика через плечо и при этом бежит быстрее раненого Защитника — «Ну в это гонке. Очевидно победителем был пустырник». Вокруг них «словно взрываись деревья», но «пустырник легко от них уклонялся». Оторвался примерно на 150 метров, после чего Защитник разрывом сократил дистанцию на 147 метров.</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0225-S05", "PS-0225--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Защитник</strong> — противник в первой сцене. Пустынник дерётся с ним, считает его убитым, затем Защитник поднимается с белыми светящимися глазами: «В момент, когда он должен был умереть. Он получил благословение. И не обычная, а от бога». Рассказчик называет его апостолом. От него Пустынник уносит рассказчика.</li>\n<li><strong>Рассказчик (Старик-арбетар, чужемирец)</strong> — тот, кого он спасает и уносит. Рассказчик ранен в ногу. Зачем Пустыннику рассказчик живой, не сказано.</li>\n<li><strong>Бессмертный</strong> — только как отвергнутая версия Миколая о том, кто это (302772–302775).</li>\n<li><strong>Поток крови</strong> — в записи указан среди связанных, но в приведённых кусках переписки не упомянут.</li>\n</ul>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0225-S06", "PS-0225--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2025-03-14 (окно w0081, id 302380–302383).</strong> Первое появление в прозе. Сцена: бой с Защитником, воскрешение Защитника через благословение «от бога», бегство с рассказчиком на плече, погоня, оторвались на 150 метров, рывок Защитника со светящейся оранжевым ногой, крик рассказчика про тела жены и дочери, сброшенные в реку, ответ Защитника «ТЫ СДОХНЕШЬ!» и его уход к реке.</p>\n<p>Та же реплика (302380) дальше уходит в другую сцену, к Пустыннику отношения не имеющую: больница в Санкт-Петербурге, парень Антон собирает вещи, пытается «услышать голос внутри себя», говорит «Физические я полностью восстановился. Просто как то тихо в голове», чувствует, что «у него нету больше, чего-то важного», и решает научиться пользоваться данной ему силой, «Чтобы убить одного старого и до ужаса лицемерного старика». Следом Слава добавляет: «Это будет первая места» (302381), «Я уверен в нём больше чем в тебе» (302382), «Конечно шутка» (302383). К кому относится «в нём» — к Антону или к Пустыннику — из переписки не следует.</p>\n<p><strong>Версия 2 — 2025-03-14, вечер (окно w0081, id 302766–302781).</strong> Разбор по прочитанному. Здесь зафиксировано только два факта: это новый персонаж и он благословенный, а не Бессмертный. Заканчивается вопросом Славы: «И че какой место и как тебе?» (302781).</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0225-S07", "PS-0225--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Зачем Пустыннику нужен рассказчик живым — не раскрыто.</li>\n<li>Какое у него благословение — не названо.</li>\n<li>Форма имени не выбрана: «Пустынник» / «пустырник» / «пустынный».</li>\n<li>Внешность (костюм, маска, плащ, меч, открытый участок кожи на руке) есть в сводке записи, но дословного текста первого появления с этим описанием в сохранённых кусках нет.</li>\n<li>Связь с «Потоком крови» указана в записи, но в переписке не объяснена.</li>\n<li>Реакции Миколая на сцену по существу нет: он спросил, кто это, получил ответ и на вопрос «как тебе?» в сохранённом куске не ответил.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0225--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0013.html\">Благословенные</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0013.html\">Благословенные</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0225--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-03-14</td>\n<td>302380–302383</td>\n<td>w0081</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-14</td>\n<td>302766–302781</td>\n<td>w0081</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0225-pustynnik.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0225--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0225.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0225-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0225/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дороже всего — отсутствие карточки персонажа у Защитника. Он есть только как история: <code>IS-0017</code> «Защитник» (2 ссылки, статья, база 139 029 — крупнейшая запись в этом углу справочника). Персонажа с таким именем в «Апостоле» нет: <code>PS-0106</code> и <code>PS-0117</code> — защитники островов из другой вселенной. При этом на него завязано всё вокруг: эта статья (противник в единственной сцене Пустынника), <code>PS-0196</code> «Семья Защитника, жена и дочь» (статья, 37 618 — те самые тела в реке), <code>IS-0057</code> «Битва Защитника и арбетара» (3 039), <code>IS-0058</code>, <code>IS-0038</code>, а в соседнем сюжете — вербовщик из <code>PS-0228</code>, спешащий «к новому апостолу по прозвищу защитник». Пока Защитник живёт как сюжет, а не как лицо, у Пустынника нет второй стороны — а он существует ровно в одном бою с ним.</p>\n<p>Вторая дыра дешёвая и чинится связью, а не поиском: <code>SP-0200</code> «Поток крови (сила Пустынника)» — статья есть, база 8 175. В пробелах этой статьи написано, что связь с «Потоком крови» указана, но в переписке не объяснена. Она объяснена: в <code>SP-0200</code> есть и удар в спину, отбрасывающий Защитника через два дерева, и назначение открытого участка кожи на запястье. В блоке связей этой статьи <code>SP-0200</code> не стоит вовсе — там только группа <code>GR-0013</code>.</p>\n<p>Третье: <code>SL-0089</code> «Список категорий сил» (4 ссылки, статьи нет, база 1 753) и <code>SL-0051</code> (6 ссылок, статьи нет, 9 834). Вопрос «какое у него благословение» упирается в них — благословенных как разряд разбирать негде.</p>\n<h3>С чего начать</h3>\n<p>Почти всё — в базе, и разъехалось по трём записям. <code>SP-0200</code> (8 175) — механика и запястье, плюс отдельно зафиксировано, что сила придерживается до критического момента, а обычный бой ведётся мечом; этого в статье нет. <code>PS-0224</code> «Старик-арбетар» (статья, 90 651) — рассказчик той же сцены, тот, кого Пустынник уносит; вопрос «зачем он ему живой» надо задавать сначала там, потому что материала под ним в десять раз больше, чем под самим Пустынником (8 637). <code>SP-0163</code> «Благословение» (статья, 86 784) — рамка, в которую его поместили одним словом «Да». Антоновский хвост реплики 302380 разобран в <code>PS-0221</code> «Антон Смирнов» (статья, 74 390) и <code>SL-0066</code> «Разбор истории про Антона» (статьи нет, 8 664) — туда же уходит вопрос, к кому относится «Я уверен в нём больше чем в тебе».</p>\n<p>В архив — за двумя вещами, обе в окне w0081. Первая: описание внешности (костюм, маска, плащ, меч, открытая кожа) в сводке есть, дословного куска нет — смотреть надо до 302380, первое появление. Вторая: вопрос Славы «И че какой место и как тебе?» (302781) остался без ответа в сохранённом куске — смотреть вечер 2025-03-14 после 302781 и утро 2025-03-15.</p>\n<h3>Как развивалось</h3>\n<p>Заявили и ограничили в один день. 2025-03-14 персонаж выпрыгивает из кустов с мечом внутри большого куска прозы, 302380: бой, воскрешение Защитника, бегство с рассказчиком на плече, погоня, 150 метров и рывок. Вечером того же дня, 302766–302781, — разбор, и там всё, что происходит с персонажем, это отсечения: Миколай предполагает Бессмертного, Слава отвечает «Не»; Миколай предполагает благословенного, Слава отвечает «Да». Ни одного утверждения, только да и нет на чужие версии. Забыли сразу: даты статьи открываются и закрываются 2025-03-14, второй сцены нет. Не вернулись — при этом реплика 302380 в тот же день уходит дальше, к Антону в петербургской больнице, то есть внимание переехало внутри одного сообщения.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для Защитника момент получения благословения назван как формула: «В момент, когда он должен был умереть. Он получил благословение. И не обычная, а от бога», — и к ней приложен внешний признак, светящиеся белые глаза. Для Пустынника, который в той же сцене и того же разряда — благословенный, — не названо ни условия, при котором он его получил, ни признака, по которому его можно опознать. Условие входа проговорено для одного благословенного и не проговорено для второго, стоящего напротив.</p>\n<h3>Отклик</h3>\n<p>Зацепили 150 и 147. Пустынник отрывается примерно на 150 метров, Защитник одним рывком сокращает разрыв на 147 — и вот эта нелепая, бухгалтерская точность делает погоню страшнее любого описания: разница в три метра, и она посчитана. Ещё понравилось, как рассказчик относится к своему спасителю: «Что за дурак и глупец. Такие долго не живут. Ну и ладно пока он меня спасает» — человека несут на плече, а он выставляет ему оценку за тактику. Из этого одного предложения о Пустыннике известно больше, чем из всего остального. И отдельно — имя, которое так и не устоялось: заголовок говорит «Пустынник», Миколай спрашивает «че за пустынный», а сам текст все разы пишет «пустырник», то есть сорную траву. Персонаж, у которого не выбрана даже форма имени, при этом уже успел кого-то спасти, оценить опасность и убежать — на восемь тысяч знаков базы это, честно говоря, много.</p></div>", "r": []}];</script>
