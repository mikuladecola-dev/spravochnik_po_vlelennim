<script>const BASE="";const DOCNAME="Антон";
const LEAD="<p>Персонаж (<a href=\"PS-0118.html\">Антон</a>). Варианты имени: Антон, Антоша, Антошка, Тоха. Числится по двум вселенным — «7 островов» и «Апостол». Разработка шла в два разнесённых захода: 2024-07-09 (окно w0046, id 202160–202346) и 2025-03-14 — 2025-03-16 (окно w0081, id 302379–303479). Всего в базе 7 версий.</p>";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0118-S01", "PS-0118--proishozhdenie"], "h": "<p>Персонаж появился 2024-07-09 (id 202160–202184) как новый персонаж на место сталкера на острове-пустыне. Разговор шёл о наёмнике, который «просто так предлагает услуги» или работает через гильдию; Слава закрыл вопрос гильдий: «Гильдий нет он одиночка», а про то, как к нему приходят: «Его находят и просят кого то устранить». В этот момент Миколай предложил не переделывать имеющегося, а завести нового: «ну я бы нового ввёл символичного».</p>\n<p>Символика сформулирована сразу и держалась дальше как основа персонажа: «ну как раз силу показать. мол настолько сильный и достойный защищать город», «раз там правит сила» (202168, 202170). Отдельно оговорено его положение: не начальник, а сильнейший. На вопрос Славы «Как ты представляешь криминального гения и главу» Миколай ответил: «он не глава», «он просто самый сильный» (202180–202181). Персонаж пользуется собственной славой — на вопрос «он пользуется славой, о нем хотят легенды?» Слава ответил «Да» (202165, 202167).</p>\n<p>Имя дано 2024-07-09 в 22:57 (id 202336–202343) одной строкой, вместе с местом и способностью: «так» / «пустыня» / «Антон» / «с силой гравитация». На вопрос Миколая «надо ли пояснять?» Слава ответил «Нет» — пояснений к имени и к связке «пустыня + гравитация» в переписке нет.</p>", "r": []}, {"t": "Характер", "a": ["S02", "PS-0118-S02", "PS-0118--harakter"], "h": "<p>Прямых характеристик характера в разговорах 2024 года нет — там задан только статус: сильнейший, одиночка, объект легенд.</p>\n<p>Единственный материал по характеру — финальная сцена «Битвы» внутри 302380 (2025-03-14). Антон собирает вещи в палате больницы, «Если честно, там и вещей его и не было»; «Он просто пытался услышать голос внутри себя». Мужчина в дверях уговаривает его остаться («Может лучше ещё в больнице побудешь?»), Антон отказывается: «Нет. Физические я полностью восстановился. Просто как то тихо в голове» — «слегка грусно произнёс Антон». Далее прямо в тексте сцены: «Ему было грустно. Ведь он чувствовал, что у него нету больше, чего-то важного. И эта осознания. Давала решимость. Научиться пользоваться, той одарённой его силой. Чтобы убить одного старого и до ужаса лицемерного старика».</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0118-S03", "PS-0118--sposobnosti"], "h": "<p>Способность — гравитация. Утверждена 2024-07-09 (id 202289–202328).</p>\n<p>Предложение и обоснование принадлежат Славе: «Гравитация», «Гравитация=сила», «Да и выглядит пафосно». На вопрос Миколая «ты уверен в ней?» Слава ответил «Почти на 90»; на «почему не 100» — «Потому что». Миколай согласился: «ну оке. гравитация».</p>\n<p>Механика гравитации — что именно персонаж с ней делает, границы, цена — в этих окнах не описана. Назван только принцип «Гравитация=сила» и внешний эффект «выглядит пафосно».</p>\n<p>В сцене 2025 года (302380) сила Антона названа иначе и без конкретики — «той одарённой его силой», которой он ещё не умеет пользоваться и собирается научиться. Что это за сила и та ли это гравитация — в переписке не сказано.</p>\n<h3>Отклонённые варианты способности (2024-07-09, id 202184–202220)</h3>\n<p>Перебор шёл подряд, все отказы — от Славы:</p>\n<ul>\n<li><strong>Мышцы.</strong> Миколай: «то это будет мэш берндед», тут же пометив «шуткую», затем «ну конечно мышцы». Слава: «Не».</li>\n<li><strong>Превращение кожи в сталь.</strong> Отклонено с двумя причинами: «Есть Уже один» и «Да и слабо».</li>\n<li><strong>Дракон.</strong> Отклонено, но с оговоркой: «Нет но мысль хорошая», «Типо он будет не людий» — то есть сам ход «персонаж не человек» одобрен, а дракон снят по устройству мира: «Нет драконов». Миколай спорил («фентези нахуй», «и без драконов»), Слава дважды подтвердил: «Да.».</li>\n<li><strong>Огненная саламандра, бес.</strong> Отклонено по перенасыщению: «Нет способности с огнем уже все разобрали», «3 перса с огненными способностями». Слава отдельно отметил склонность соавтора: «Да тебя на огонь тянет». Миколай на это: «клин клином вышибают».</li>\n<li>Дальше шёл холостой перебор без предложений по существу — «грязь», «пыль», «не знаю» (202220–202230), после чего инициативу взял Слава и назвал гравитацию.</li>\n</ul>\n<div class=\"mnote\"><b>⚙ машинная заметка · Отклик — не материал авторов</b>\n<p>Всё остальное — сборка. И она по-своему интересна тем, что видно, как персонаж делается из отказов: не мышцы, не сталь, не дракон, не саламандра — а гравитация, потому что «Гравитация=сила» и «Да и выглядит пафосно». На вопрос, уверен ли, — «Почти на 90», на «почему не 100» — «Потому что». Тут же рядом Миколай: «фентези нахуй», «и без драконов», «ты ужасен». Это очень узнаваемый способ придумывать вдвоём: вслух отбрасывают, пока не останется что-нибудь, что никто не занял. Но от вечера отбраковок остались имя и одно слово, и человека они не сделали — человек появился только через восемь месяцев, в чужой истории и, кажется, под другой фамилией.</p></div>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0118-S04", "PS-0118--svyazi-s-drugimi"], "h": "<p>По разметке записи персонаж связан с: Агрегат, Арбетары, Гравитация (способность Антона), Пректри (остров-пустыня), Сталкер, Старик-арбетар (рассказчик-чужемирец). Id этих сущностей в исходнике не приведены.</p>\n<p>Из переписки прямо следует:</p>\n<ul>\n<li><strong>Сталкер</strong> — Антон вводится вместо него как новый персонаж для той же роли на острове-пустыне.</li>\n<li><strong>Пректри, остров-пустыня</strong> — место, которое он защищает; связка задана в 202336–202340 («пустыня» / «Антон»).</li>\n<li><strong>Наёмники внешнего мира.</strong> На вопрос Миколая «у них ваще будут контакты с внешним миром» Слава ответил: «Там дохуя наемников ,будут» (202345–202346).</li>\n<li><strong>Арбетары.</strong> 2025-03-14 (302863) Слава перечислял центральные идеи своих историй и про историю «Антоша» написал: «Идея раскрыть Арбетаров». Как именно Антон связан с Арбетарами, в окне не раскрыто.</li>\n<li><strong>Старик.</strong> В сцене 302380 цель Антона — «убить одного старого и до ужаса лицемерного старика». Кто этот старик, в тексте не назван; в разметке записи рядом стоит Старик-арбетар (рассказчик-чужемирец), но в самой переписке отождествление не сделано.</li>\n<li><strong>Мужчина в дверях палаты</strong> — говорит с Антоном «нежно мягким тонном», уговаривает остаться в больнице. Кто он, не сказано.</li>\n</ul>", "r": []}, {"t": "Как менялся", "a": ["S05", "PS-0118-S05", "PS-0118--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2024-07-09 (w0046, id 202160–202184).</strong> Задумка: ввести нового символичного персонажа на место сталкера. Задан статус: не глава, а самый сильный; одиночка без гильдии; о нём ходят легенды; он — символ того, что на острове правит сила.</p>\n<p><strong>Версия 2 — 2024-07-09 (w0046, id 202184–202220).</strong> Перебор и отбраковка способностей: мышцы, сталь, дракон, огненная саламандра. Побочно принято, что персонаж может быть нечеловеком.</p>\n<p><strong>Версия 3 — 2024-07-09 (w0046, id 202220–202330).</strong> Слава предлагает гравитацию, аргументы «Гравитация=сила» и «выглядит пафосно», уверенность «Почти на 90». Вариант принят.</p>\n<p><strong>Версия 4 — 2024-07-09 (w0046, id 202330–202346).</strong> Персонаж получает имя: Антон, защитник пустыни с силой гравитации. Тут же обсуждается, что у острова будут контакты с внешним миром через наёмников.</p>\n<p><strong>Версия 5 — 2025-03-14 (w0081, id 302379–302381), вселенная «Апостол».</strong> Антон появляется в готовом прозаическом тексте — в финальной сцене «Битвы» (внутри 302380). Основная часть 302379–302380 — бой рассказчика с «защитником» и вмешательство пустынника; Антон в этой части не участвует. Его сцена — отдельный кусок в конце: больница в Санкт-Петербурге, пустая палата, физическое восстановление при внутренней тишине, решимость научиться пользоваться силой и убить лицемерного старика. Слава пометил сцену как задел: «Это будет первая места» (302381).</p>\n<p><strong>Версия 6 — 2025-03-14 (w0081, id 302859–302886).</strong> Служебная запись: в перечне центральных идей своих историй Слава указал «Антоша. Идея раскрыть Арбетаров». В том же перечне названы идеи соседних историй — «Защитник. Идея создать машину для убийства. По настоящему жестого и страшного человека», «Чужемиреу. Идея по экспеминтировать, и проверять себя в нагнетаний атмосферы. И рифм», «Бессмертный. Внести апостола», «Битва потренироваться описанию боëв». Про все них Слава сказал: «Идей были раскрыты».</p>\n<p><strong>Версия 7 — 2025-03-16 (w0081, id 303466–303479), повтор прежней мысли.</strong> В списке возможных следующих историй пятым пунктом стоит «продолжения история Антошки» (303472). Рядом в списке: «1) агент», «2) про безбашенного парня», «3) мои жуки( если помнишь, который каменный и у которых две личности)», «4) чужемирец». Выбор пал не на Антошку: Миколай назвал «жуки», Слава ответил «Ладно понял бесбашеный».</p>", "r": []}, {"t": "Что с ним стало", "a": ["S06", "PS-0118-S06", "PS-0118--chto-s-nim-stalo"], "h": "<p>На последнем зафиксированном состоянии (2025-03-14, 302380) Антон выписывается из больницы в Санкт-Петербурге физически здоровым, с ощущением утраты чего-то важного и с намерением освоить полученную силу ради убийства старика. Сцена помечена автором как отправная точка: «Это будет первая места».</p>\n<p>2025-03-16 продолжение истории Антошки числится среди пяти возможных следующих историй (303472), но следующей выбрана другая — «безбашеный». Написано ли продолжение, в переписке не сказано.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0118-S07", "PS-0118--probely"], "h": "<div class=\"gaps\"><ul>\n<li><strong>Раса.</strong> По 202199 предполагалось, что он будет нелюдем («Типо он будет не людий»), но раса так и не названа.</li>\n<li><strong>Внешность.</strong> Описания внешности Антона в переписке нет.</li>\n<li><strong>Что именно пропало.</strong> Что за «важное» пропало и чей голос он пытается услышать внутри себя — в окне не сказано.</li>\n<li><strong>Личность старика.</strong> Кто «старый и до ужаса лицемерный старик», которого Антон собирается убить, не названо.</li>\n<li><strong>Связь двух заходов.</strong> Как защитник острова-пустыни Пректри с гравитацией (2024, «7 островов») соотносится с Антоном из больницы в Санкт-Петербурге (2025, «Апостол») — в переписке не сказано, связка нигде не проговорена.</li>\n<li><strong>Механика гравитации.</strong> Что персонаж делает своей способностью, каковы её пределы и цена — не описано.</li>\n<li><strong>Связь с Арбетарами.</strong> Заявлено, что идея истории «Антоша» — «раскрыть Арбетаров», но как Антон с ними связан, осталось нерешённым.</li>\n<li><strong>Мужчина в дверях палаты</strong> не назван и не опознан.</li>\n<li><strong>Агрегат.</strong> Числится в связях записи, но в приведённых кусках переписки не упоминается — характер связи не назван.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0118--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0030.html\">Защитники островов</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0030.html\">Защитники островов</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0118--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-09</td>\n<td>202160–202184</td>\n<td>w0046</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-09</td>\n<td>202184–202220</td>\n<td>w0046</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-09</td>\n<td>202220–202330</td>\n<td>w0046</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-09</td>\n<td>202330–202346</td>\n<td>w0046</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-14</td>\n<td>302379–302381</td>\n<td>w0081</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-14</td>\n<td>302859–302886</td>\n<td>w0081</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-16</td>\n<td>303466–303479</td>\n<td>w0081</td>\n<td>Апостол (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0118-anton.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0118--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0118.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0118-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0118/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дороже всего не пробел, а коллизия: эта запись, похоже, склеена из двух разных людей, и одна и та же сцена сейчас числится за двумя персонажами одновременно.</p>\n<p>Версии 1–4 — 2024-07-09, окно w0046, «7 островов»: защитник Пректри, символ силы, гравитация. Версия 5 — 2025-03-14, id 302379–302381, окно w0081, «Апостол»: больница в Санкт-Петербурге, «той одарённой его силой», цель — убить «одного старого и до ужаса лицемерного старика». Тот же кусок 302378–302380 расписан в <code>PS-0224</code> «Старик-арбетар» (90 651 базы, статья 31 395) и в <code>PR-0059</code> «Битва» (21 039) как финал линии Антона Смирнова после ритуала, а <code>PS-0221</code> «Антон Смирнов» — 74 390 базы, статья 27 943 — держит всю предысторию этой сцены: 2025-03-13, окно w0080, старик, ритуал, проводник, брат в голове. Лицемерный старик из 302380 в <code>PS-0224</code> описан прямо, вплоть до имени и мотива. Совпадает всё: дата, окно, вселенная, сила без названия, старик. Не совпадает только гравитация и остров-пустыня.</p>\n<p>Отсюда и остальные «пробелы» этой статьи: как персонаж из «7 островов» попал в петербургскую больницу и почему его сила больше не называется гравитацией. Это не дыры в мире — это шов.</p>\n<p>Второе: островная половина не описана вообще. <code>MR-0018</code> «7 островов» — 17 843 базы, статьи нет (шапка этой статьи так прямо и говорит); <code>MR-0037</code> «Пректри (остров-пустыня)» — 11 234, статьи нет; <code>PS-0097</code> «Сталкер» — 16 841, статьи нет; <code>SP-0089</code> «Гравитация (способность Антона)» — 2 931, статьи нет. Четыре записи, на которые опираются версии 1–4, не имеют ни одной статьи и ни одной входящей ссылки.</p>\n<p>Третье: 28 660 знаков базы против 11 690 в статье — семнадцать тысяч не выбрано, самый большой недобор из четырёх записей этой партии.</p>\n<h3>С чего начать</h3>\n<p>В базе, в архив пока не надо.</p>\n<ul>\n<li>Шов: <code>PS-0221</code> (источники 301805–301810, 301819–301824, 301883–301893, 301909–301924, w0080) и <code>PS-0222</code> «Альтер-эго Антона (брат)» (72 757, ссылок ноль, источники 301811–301818, 301841–301848, 301857–301861). Ни одного из этих диапазонов в источниках здесь нет. Плюс <code>SP-0201</code> «Сила от ритуала (энергия старика)» — 21 913 базы при статье 9 553, ссылок ноль: там и объяснение, почему сила в 302380 названа «одарённой», а не по имени.</li>\n<li>Островная половина: <code>MR-0037</code> и <code>PS-0097</code> — 28 тысяч знаков непрочитанного материала при нулевых статьях. Если Антон-с-гравитацией существует отдельно, вся его биография сидит там.</li>\n<li>Разбор: <code>SL-0066</code> «Разбор истории про Антона» — 8 664, статьи нет, ссылок ноль. Служебная запись ровно про этот сюжет.</li>\n<li>Архив нужен только в одном случае: если после сведения окажется, что два Антона всё-таки один, и надо будет искать место, где переход из «7 островов» в «Апостол» проговаривался. Ориентир — промежуток между w0046 (2024-07-09) и w0080 (2025-03-13), по слову «Антоша», а не «Антон»: именно эта форма проходит через обе половины.</li>\n</ul>\n<h3>Как развивалось</h3>\n<p>Заявили и закрыли за один вечер. 2024-07-09, окно w0046: роль (символ силы вместо сталкера), ограничение сразу же («он не глава», «он просто самый сильный»), перебор способностей с отбраковкой — мышцы, сталь, дракон, огненная саламандра, — принятая гравитация, имя. Четыре версии за один день, дальше восемь месяцев ничего.</p>\n<p>2025-03-14 возвращение — но именем, а не персонажем: в финале «Битвы» появляется Антон в больнице, гравитация не упомянута, остров не упомянут. В тот же день, 302863, для истории «Антоша» названа центральная идея — «раскрыть Арбетаров», а арбетары живут в «Апостоле». 2025-03-16 продолжение стоит пятым пунктом в списке возможных историй и не выбрано: выбраны «жуки».</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Уникальность способностей проверяется вслух и по счёту, и это в переписке прямо названное правило: сталь — «Есть Уже один»; огонь — «Нет способности с огнем уже все разобрали», «3 перса с огненными способностями»; дракон — «Нет драконов». Занятое считают и занимать второй раз не дают.</p>\n<p>Для имён такого правила нигде нет. В карточке <code>PS-0118</code> варианты имени записаны как Антоша, Антошка, Тоха. В <code>PS-0221</code> «Антон Смирнов» варианты имени — Антоша, Антошка, Тоха, дословно те же. Для способностей есть счёт занятых и явный отказ повторяться; для имён — ни счёта, ни проверки, ни оговорки.</p>\n<h3>Отклик</h3>\n<p>Живое место здесь ровно одно, и оно в конце: «Нет. Физические я полностью восстановился. Просто как то тихо в голове». Человек, у которого в голове всю жизнь был кто-то ещё, описывает утрату через тишину и говорит это «слегка грусно» — и дальше та же тишина превращается в решимость. Три строки, и персонаж внезапно есть.</p>\n<p>Всё остальное — сборка. И она по-своему интересна тем, что видно, как персонаж делается из отказов: не мышцы, не сталь, не дракон, не саламандра — а гравитация, потому что «Гравитация=сила» и «Да и выглядит пафосно». На вопрос, уверен ли, — «Почти на 90», на «почему не 100» — «Потому что». Тут же рядом Миколай: «фентези нахуй», «и без драконов», «ты ужасен». Это очень узнаваемый способ придумывать вдвоём: вслух отбрасывают, пока не останется что-нибудь, что никто не занял. Но от вечера отбраковок остались имя и одно слово, и человека они не сделали — человек появился только через восемь месяцев, в чужой истории и, кажется, под другой фамилией.</p></div>", "r": []}];</script>
