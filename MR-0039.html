<script>const BASE="";const DOCNAME="Ойкумена";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0039-S01", "MR-0039--ustroystvo"], "h": "<p>Ойкумена — не отдельный остров и не отдельная местность, а общее имя всей совокупности островов сразу. Формулировка Миколая: «а все остова вместе это ойкумена» (2024-07-09, id 202388).</p>\n<p>Никакого внутреннего устройства — границ, центра, порядка островов внутри ойкумены, числа входящих в неё островов — в переписке не описано. Названо только само имя и то, что оно покрывает.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S02", "MR-0039-S02", "MR-0039--mesto-vo-vselennoy"], "h": "<p>Имя введено в пару к другому названию — ультима туле. Разговор идёт подряд: сначала Миколай утверждает уже названное («это обосновано», «так оно и должно называться», «никак иначе», id 202385–202387), затем добавляет ойкумену как имя для всех островов вместе (id 202388). Само то, что именно было названо перед этим и почему «обосновано», в приведённом куске переписки не сказано.</p>\n<p>Ойкумена входит в Мир островов (архипелаг защитников) — она названа как часть этого мира, а не как самостоятельный мир рядом с ним.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S03", "MR-0039-S03", "MR-0039--kak-menyalsya-po-versiyam"], "h": "<p>Версия 1 — 2024-07-09 (окно w0046, id 202385–202400). Единственное состояние: имя вводится и принимается. Слава спрашивает только о том, удержится ли название («А ты запомнишь ?», id 202393), Миколай отвечает: «это название в моём сердце», «его точно не забыть» (id 202394, 202396), Слава соглашается — «Ну тогда ок» (id 202400). Разбора по существу с его стороны нет.</p>\n<p>Позднейших версий нет: даты записи 2024-07-09 — 2024-07-09, версий одна. Отклонённых вариантов имени в переписке не предложено.</p>", "r": []}, {"t": "Пробелы", "a": ["S04", "MR-0039-S04", "MR-0039--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Население ойкумены не описано вообще: кто там живёт, отличаются ли жители разных островов — в переписке не сказано.</li>\n<li>Сколько островов входит в ойкумену и совпадает ли их число с семью из названия вселенной — не сказано.</li>\n<li>Отношение ойкумены к ультима туле названо только как «пара»: что именно противопоставляется или дополняется — граница обитаемого и необитаемого, центр и край, — осталось нерешённым.</li>\n<li>Реплики id 202385–202387 («это обосновано», «так оно и должно называться») относятся к чему-то, названному до приведённого куска; к чему именно — из текста не следует.</li>\n<li>Пользуются ли этим словом сами жители островов, или это только авторское служебное имя, — не сказано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0039--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0039--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-09</td>\n<td>202385–202400</td>\n<td>w0046</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0039-oykumena.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0039--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0039.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
