<script>const BASE="";const DOCNAME="Клаустрофобия";
const LEAD="";
const CH=[{"t": "Содержание", "a": ["S01", "IS-0076-S01", "IS-0076--soderzhanie"], "h": "<p>Текст «Клаустрофобия», присланный Славой целиком одним сообщением 2025-11-21 в 18:16 (id 387575), сразу за которым идёт подпись «Первый» (id 387576) — первый из пачки пронумерованных историй (Первый, Второе, Третье, Четвёртое, Пятая).</p>\n<p>Рассказчик заходит в плохо сохранившийся ресторан советской постройки, стоящий в пяти километрах от населённого пункта. Он замечает нервно курящую в углу фигуру — своего друга, который и позвал его поговорить «на темы неизвестные мне». Друг нервно машет рукой, «со стороны это могло показаться словно у него припадок». Сев за деревянный стол, рассказчик спрашивает о цели встречи.</p>\n<p>Друг спрашивает: «Серёга ты не замечал ничего странного?» — рассказчик резко отвечает «Нет», раздражённый тем, что друг названивал ни свет ни заря и заставил его тащиться в «богом забытое место». На вопрос, что вообще он должен был заметить, друг мнётся: «может вокруг тебя люди странно себя начали вести или...» — рассказчик обрывает его: «единственной кто странно себя ведет. Так это только ты». Друг сжимается, явно сильно обеспокоен; рассказчик чувствует вину и просит объяснить, что именно странного он должен был увидеть.</p>\n<p>Друг «начал поливать без вязаные мысли, как будто ему в голове всё блендером перемешали»: «мёртвые глаза, как у рыбы, а ещё они что мастерят, и в новостях по криминальной хронике говорилось, что число смертей возросло». Рассказчик отмечает, что друг и раньше был склонен к теориям заговора, но никогда не рассказывал о них всерьёз — «так просто как о интересной вещи, как о сериале». Оглядев пустой зал ресторана — «пусто, здесь было пусто, не одного человека» — рассказчику становится не по себе. Друг окликает его: «ты меня слушаешь?!» — рассказчик отговаривается делами и уходит. На этом текст обрывается.</p>", "r": []}, {"t": "Персонажи", "a": ["S02", "IS-0076-S02", "IS-0076--personazhi"], "h": "<ul>\n<li><strong>Рассказчик</strong> («я») — в тексте к нему один раз обращаются «Серёга»; при этом в середине текста тем же именем («Сергей») ошибочно назван, судя по контексту, сам друг-рассказчик о параноидальности — путаница имён в исходнике не устранена.</li>\n<li><strong>Саша / Саня</strong> — нервный друг, инициатор встречи, рассказывает о «странностях»: мёртвых рыбьих глазах у людей вокруг, о том, что они «что-то мастерят», и о росте числа смертей по криминальной хронике.</li>\n</ul>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "IS-0076-S03", "IS-0076--mesto-vo-vselennoy"], "h": "<p>По заданию материал отнесён к периоду, объявленному 2025-11-18 (id 386292) — маленькой вселенной по мотивам сна про обратных; имени в переписке она не получила. В самом тексте эта связь по имени не названа, вселенная помечена как «неясно». Отдельные детали — «мёртвые глаза, как у рыбы», люди, которые «что-то мастерят» — перекликаются с описанием обратных из <a href=\"IS-0073.html\">Сон про плот и домик с механизмом</a> (стеклянные, тусклые глаза; каждый строит что-то своё), но прямой связи между текстами переписка не устанавливает.</p>", "r": [["Сон про плот и домик с механизмом", "IS-0073.html"]]}, {"t": "Состояние", "a": ["S04", "IS-0076-S04", "IS-0076--sostoyanie"], "h": "<p>Обрывается на уходе рассказчика из ресторана — разговор не завершён, тема «странностей» не раскрыта. Текст помечен автором как «Первый» в серии из как минимум пяти пронумерованных историй (Первый, Второе, Третье, Четвёртое, Пятая), остальные тексты серии в этом материале не даны.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "IS-0076-S05", "IS-0076--probely"], "h": "<div class=\"gaps\"><ul>\n<li>В чём именно заключаются «странности», о которых говорит Саша, кроме перечисленных деталей — не раскрыто.</li>\n<li>Судьба разговора после ухода рассказчика — не показана.</li>\n<li>Путаница имён рассказчика/друга (Серёга/Сергей) в переписке не объяснена и не исправлена.</li>\n<li>Связь с миром обратных (сон, объявленный 2025-11-18) в тексте не названа прямо, только совпадают отдельные детали.</li>\n<li>Состав и содержание остальных историй серии (Второе, Третье, Четвёртое, Пятая) не даны.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["IS-0076--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает истории:</strong> <a href=\"IS-0073.html\">Сон про плот и домик с механизмом</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0309.html\">Саша (Саня)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["IS-0076--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-11-21</td>\n<td>387575–387576</td>\n<td>w0110</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/istorii/IS-0076-klaustrofobiya.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["IS-0076--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/IS-0076.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
