<script>const BASE="";const DOCNAME="Отряд Дена (семеро в масках, сборщики)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0084-S01", "GR-0084--chto-eto"], "h": "<p>Отряд из семи человек с закрытыми повязками лицами, действующий в главе 1 рассказа «Сумасшедший где-то?» (Слава, 2026-02-20, id 435083–435085). В тексте группа названа несколькими способами: «отряд» («не просто так стал командиром этого отряда»), «эта группа», «эта семёрка», «тройка сильнейших в этой группе».</p>\n<p>Это боевая или рабочая единица под командованием Дена, подчинённая некоему вышестоящему руководству. Её работа в тексте показана через результат: Ден передаёт Дариусу «стеклянную пробирку, украшенную железными узорами», внутри которой «чёрно-красная жидкость». Дариус, оценивая содержимое, думает: «В принципе не плохо. С такой маленькой деревни собрать такое большое количество горечи, страха и отчаяния». Пробирка заполнена на треть.</p>\n<p>Отряд обсуждался не в переписке как замысел, а существует только внутри присланного Славой текста главы. Отдельного разговора соавторов про этот отряд в окне w0119 нет.</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0084-S02", "GR-0084--sostav"], "h": "<p>Семь человек. Поимённо в тексте названы трое:</p>\n<ul>\n<li><strong>Ден</strong> — командир, «высокий мужчина в маске». Отдельной записи базы на этого Дена нет.</li>\n<li><strong>Клар</strong> — зеленоглазый; отдельной записи базы нет.</li>\n<li><strong>Джек</strong> — стоял ближе всех к Дариусу; отдельной записи базы нет.</li>\n</ul>\n<p>Остальные четверо остаются безымянными: «один из этой тройки», «другой член этой группы», «его соратник».</p>\n<p>Карен в отряд не входит: он действует «из слепой зоны для группы» на стороне Дариуса и бьёт по отряду ножами.</p>\n<p>Дариус Баллив (<a href=\"PS-0356.html\">Дариус Баллив</a>) в отряде не состоит — он приходит к отряду со стороны, как вышестоящий.</p>\n<p><a href=\"PS-0353.html\">Ден</a> «Ден» — персонаж другого рассказа, «Цена жизни» (Слава, 2026-02-16, id 433706–433713), мужчина с каштановыми волосами, спорящий с Беном о втором шансе для подростка-убийцы. Тождество этого Дена и командира отряда в переписке не заявлено.</p>", "r": [["Дариус Баллив", "PS-0356.html"], ["Ден", "PS-0353.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0084-S03", "GR-0084--obschie-sposobnosti-gruppy"], "h": "<p>Отдельных способностей — магии, навыков, силы — у участников отряда в тексте не описано. Про группу сказано следующее:</p>\n<ul>\n<li>Все семеро в масках или повязках: «у каждого из них было скрыто лицо повязками и лишь глаза были видны». Маски делают их неразличимыми даже для начальства — Дариус, перепутав имя, говорит: «Ну прости, вы все в масках, вас очень сложно отличить Клар».</li>\n<li>Все вооружены: при появлении Дариуса «Группа отреагировала. Схватившись за оружие».</li>\n<li>Отряд занимается сбором «горечи, страха и отчаяния» в пробирку. Как именно происходит сбор, в тексте не описано; показан только результат — пробирка с чёрно-красной жидкостью и её вес. В момент, когда Ден узнаёт, что наказание коснётся его семьи, Дариус замечает, «как пробирка стала чуть тяжелее».</li>\n<li>Отряд работает по заданиям: перед сценой деревня сожжена, а сама формулировка задачи в тексте не приводится — Дариус говорит только «у вас было лишь одна задача, и вы с ней не справились». Претензии две: «как вы могли допустить, что сбежало аж два человека» и «плохо проверили места преступления».</li>\n</ul>", "r": []}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0084-S04", "GR-0084--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<ul>\n<li><strong>Тройка сильнейших.</strong> Ден называет троих провинившихся «те трое сильнейший в нашей группе», их потеря, по его словам, «может быть..» — фразу он не договаривает. Дариус подтверждает это же после их гибели: «тройка сильнейших в этой группе уже убита».</li>\n<li><strong>Джек</strong> — по оценке Дариуса, «самый смышлёный из этой семёрки», но при этом «слабый». Он единственный, кто «легко увернулся, словно ожидая подобного» от ножей Карена, и единственный, кто успел ударить — вогнал металл в сердце Дариуса.</li>\n<li><strong>Клар</strong> — единственный, чья внешняя примета названа: зелёные глаза. Он же вступается за наказанного Дена: «прошу прощения. Но это черезчур суровое наказание».</li>\n<li><strong>Семья.</strong> Прямо сказано: «Не у кого из них не было семьи, кроме Дена». Семья Дена живёт в деревне Ликней. Состав семьи в тексте назван по-разному, версии не сводятся: Дариус сначала спрашивает «там же проживают твоя жена и дочь?», потом говорит про «сынишки, что хочет стать таким же сильным, как ты» и грозит «прикизу убить и твою жену и сына».</li>\n</ul>", "r": []}, {"t": "Иерархия", "a": ["S05", "GR-0084-S05", "GR-0084--ierarhiya"], "h": "<p>Командир — Ден. Прямо: «и так Ден, так как ты командир этой группы. Ты должен их наказать». Дариус хвалит его за то, что тот верно оценил обстановку и первым встал на колени: «молодчина Ден. Всё же не просто так стал командиром этого отряда».</p>\n<p>Ден отдаёт приказы («Всем сесть на колени!») и подаёт пример подчинённым. Остальные названы «его подчинённые», «его соратники».</p>\n<p>Помимо командования, между Деном и отрядом есть отношение долга: «именно Ден пригласил большинство из них суда и дал вторую жизнь. „Поэтому хотя бы так оплатить командиру“». Кому принадлежат эти мысли, текст не сообщает и задаёт вопрос прямо: «Интересно кому принадлежит эти мысли?»</p>\n<p>Ден пытается принять наказание вместо подчинённых: «Могу ли я принять наказание вместо моих подчиненых». Дариус соглашается — и наказанием оказывается требование убить кого-то из своей семьи.</p>\n<p>Над отрядом стоит внешнее руководство. Ден по ходу разговора «лишь больше убедился, что это вышестоящее» и «теперь не было сомнения, что он от руководства». Дариус говорит о себе и начальстве во множественном числе: «не тебе решать, что может быть значимой потери для нас». Что это за руководство, как оно называется и кому передаётся собранная жидкость — в тексте не сказано.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S06", "GR-0084-S06", "GR-0084--otnosheniya-s-drugimi-gruppami"], "h": "<ul>\n<li><strong>Дариус Баллив и его сторона.</strong> Дариус — старший сын дворянской семьи Баллив, юноша лет 20, называет себя «посланником Божьим» и уточняет про себя: «только не их Бога». Он приходит к отряду один, принимает пробирку, объявляет наказание и в итоге уничтожает отряд. Отряд ему подчиняется, но не знает его: первый вопрос Дена — «кто ты?». Джек считает его «самым опасным» врагом и пытается убить; удар в сердце Дариуса не срабатывает — «вокруг пронзоного сердца Дариусу собралась мана виде оков и сердце Дариусу снова забилась».</li>\n<li><strong>Карен.</strong> Действует по слову Дариуса — тот просто произносит имя, и «из слепой зоны для группы вылетели ножи». Ножи отравлены: «Ножи отравлены, они долго не протянут». В отряд Карен не входит; о его принадлежности к какой-либо другой группе не сказано.</li>\n<li><strong>Дворянская семья Баллив.</strong> Названа только как происхождение Дариуса; отношений отряда с этой семьёй как таковой в тексте нет.</li>\n<li><strong>Мальчик с красными глазами.</strong> Свидетель, уцелевший под обгоревшими досками, — та самая ошибка отряда. Бледный мальчик лет двенадцати, черноволосый, с алыми глазами; Дариус кланяется ему со словами «здравствуйте юный герой». К отряду он относится как жертва и как улика: именно из-за него и двух сбежавших детей отряд наказан.</li>\n</ul>", "r": []}, {"t": "Как менялась", "a": ["S07", "GR-0084-S07", "GR-0084--kak-menyalas"], "h": "<p>Единственная дата — 2026-02-20 (id 435083–435085). Версий замысла, менявшихся во времени, нет: отряд появляется и уничтожается внутри одной главы. Изменения состава внутри сцены идут так:</p>\n<ol>\n<li>Изначально — семь человек в масках среди обгоревших обломков домов.</li>\n<li>Дариус предъявляет претензию троим и требует, чтобы Ден их наказал. Двое из тройки сами просят: «командир сделайте это. Только безболезненно» (Клар) и «командир сделайте это бесполезнено» (второй). Ден убивает троих: «Ден сделал это быстро и чисто, не дав товарищии ощутить боль».</li>\n<li>По слову Дариуса вступает Карен: «Не успев отреагировать двое из них падают за мертво». Ден ранен ножом в плечо, ранен и «один из его соратников».</li>\n<li>Джек уворачивается, наносит удар Дариусу в сердце, Дариус выживает, и «его голова была перевёрнутая на 180 градусов».</li>\n<li>Ден и его соратник остаются на ногах, но отравлены: «их мышцы горели, а нейрная система сошла с ума», температура тел повысилась, чувствительность обострилась. Дариус считает, что «они долго не протянут» и что «Карен должен справится». Последняя реплика Дена — «Да ...к-о т-ы та-ко?», у него «глаза набухли и вываливались».</li>\n</ol>\n<p>Чем кончилось для двоих оставшихся, в присланном тексте не показано: глава переходит к мальчику с красными глазами, дальше идёт начало главы 2 (карета, черноволосый мальчик и мужчина), и текст обрывается на середине абзаца — продолжения в окне нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "GR-0084-S08", "GR-0084--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет: из семи названы только Ден, Клар и Джек, остальные четверо безымянны.</li>\n<li>Отдельных записей базы на Дена (командира), Клара и Джека нет, поэтому список участников группы пуст.</li>\n<li>Название отряда не дано. Как называют себя сборщики и есть ли у структуры имя — не сказано.</li>\n<li>Вышестоящее руководство не названо: кому передаётся пробирка дальше, зачем нужны «горечь, страх и отчаяние» и что с ними делают — в тексте не сказано.</li>\n<li>Способ сбора жидкости не описан.</li>\n<li>Задача отряда прямо не сформулирована; названы только два невыполненных её пункта (не упустить свидетелей, проверить место).</li>\n<li>Способностей, магии или боевых навыков участников не описано; из всей группы что-то похожее на приём показывает только Джек (уклонение и рывок), да и то без объяснения.</li>\n<li>Внутри текста не сходится, кто такой Клар: сначала Дариус называет этим именем говорившего из провинившейся тройки, и на имя откликается кто-то другой («Клар вздрогнул и поднял свою голову»), затем Клар описан как «до это молчавший», а в конце именно Клар просит убить его безболезненно, то есть оказывается в тройке. Текст этого не разрешает.</li>\n<li>Не сходится арифметика гибели: после убийства троих остаются четверо, но дальше двое падают мёртвыми от ножей Карена, ранены Ден и «один из его соратников», и отдельно действует Джек. Как эти люди распределяются по семёрке, из текста не выводится.</li>\n<li>Состав семьи Дена назван противоречиво — «жена и дочь», затем «сынишка» и «жена и сын»; какое из этих состояний верное, не сказано.</li>\n<li>Тождество Дена-командира и Дена из «Цены жизни» (<a href=\"PS-0353.html\">Ден</a>) не заявлено.</li>\n<li>Кому принадлежат мысли «Поэтому хотя бы так оплатить командиру», текст оставляет открытым вопросом.</li>\n<li>Судьба двух отравленных выживших осталась нерешённой: продолжения в окне нет.</li>\n</ul></div>", "r": [["Ден", "PS-0353.html"]]}, {"t": "Связи — всё вместе", "a": ["GR-0084--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0353.html\">Ден</a>, <a href=\"PS-0356.html\">Дариус Баллив</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0084--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0084.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0084-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0084/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дорогая дыра здесь одна, и она не про отсутствующую статью, а про статью, которая, возможно, покрывает двух разных людей. <code>PS-0353</code> «Ден» собирает четыре входящих ссылки при 7945 знаках базы, но её материал — это Ден из «Цены жизни» (<code>IS-0088</code>, <code>PR-0121</code>), мужчина с каштановыми волосами, спорящий с Беном. Командир отряда в масках — это <code>PR-0123</code>, другой текст, другая дата, и тождество нигде не заявлено. Пока это не разведено, четыре ссылки ведут в одну запись про, возможно, двоих. Чинится дешевле всего и разблокирует больше всего: <code>GR-0084</code>, <code>IS-0088</code>, <code>PR-0121</code>, <code>PR-0123</code>.</p>\n<p>Вторая дыра — регистровая и тоже дешёвая. Клара, Джека и Карена в <code>blockers.json</code> нет вообще: ни одной сущности с такими именами, ни статьи, ни базы. Поэтому список участников группы пуст не потому, что материал потерян, а потому, что записи не заводили. Из семи человек трое названы по имени, и ни один не существует в реестре. Эту дыру числа не показывают: у несуществующей сущности не бывает входящих ссылок.</p>\n<p>Для сравнения — материал под рукой есть: <code>PS-0356</code> Дариус Баллив (3 ссылки, 18 433 знака базы) и <code>PR-0123</code> «Сумасшедший где-то?» (2 ссылки, 17 057). То есть с одной стороны сцены запись подробная, с другой — не заведена.</p>\n<h3>С чего начать</h3>\n<p>В базе, не в архиве. Весь исходник лежит в одном месте — <code>PR-0123</code>, 17 057 знаков, тот же текст главы. Разъехалось по соседям: <code>PS-0356</code> (18 433) — самая полная запись по Дариусу, включая ману-оковы вокруг пронзённого сердца; <code>SP-0138</code> «Мана» (2 ссылки, 7945); <code>SP-0140</code> «Скверна (ядовитая мана)» (статья есть, база 6563) — это единственное место, где отравленные ножи Карена можно попробовать подвести под уже описанное правило, если яд в этой вселенной один и тот же. Проверять стоит именно эту связку: в статье отряда яд назван, но никак не соотнесён с существующей записью о ядовитой мане.</p>\n<p>В архив идти имеет смысл ровно за одним — за продолжением. Текст оборван на середине абзаца в начале главы 2 (карета, черноволосый мальчик и мужчина), присылка — id 435083–435085, 2026-02-20. Отрезок «Иссекая» держится с 2026-02-14 (возврат, id 432541) до 2026-04-19 (id 462202). То есть после обрыва было ещё два месяца этой вселенной. Смотреть надо интервал id 435085 … 462202: была ли досылка главы 2 и всплывали ли где-то Клар, Джек, Карен, деревня Ликней и слово про вышестоящее руководство вне самого текста.</p>\n<h3>Как развивалось</h3>\n<p>Стадии замысла у этого отряда нет. Он не был заявлен, ограничен и забыт — он пришёл уже написанным: три сообщения подряд, одна дата, ноль обсуждения до и после. Развитие идёт не по датам, а внутри сцены: семеро — трое убиты собственным командиром — двое падают от ножей — Джек бьёт и промахивается по сути — двое отравленных остаются на ногах. За полторы страницы группа заведена и уничтожена.</p>\n<p>Это отличает запись от соседей по вселенной: <code>IS-0088</code> «Цена жизни» и <code>PS-0353</code>/<code>PS-0354</code> собраны из разговора, а <code>GR-0084</code> — целиком из присланного текста. Обсуждения отряда в окне w0119 нет ни строчки.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Правило замещения в наказании названо прямо и работает: Ден спрашивает «Могу ли я принять наказание вместо моих подчиненых», Дариус соглашается. Сверху вниз — командир отвечает за отряд — проговорено и подтверждено действием.</p>\n<p>Соседний случай стоит в той же сцене, буквально через реплику: Клар вступается за наказанного командира — «прошу прощения. Но это черезчур суровое наказание». Может ли подчинённый принять наказание вместо командира, действует ли замещение снизу вверх и почему заступничество Клара ничего не меняет — не сказано. Направление, в которое персонаж тянется, правилом не покрыто.</p>\n<h3>Отклик</h3>\n<p>Сильнее всего — пробирка, которая становится тяжелее. Мера собранного отчаяния физическая, её видно и можно взвесить, и она прибавляет в весе ровно в тот момент, когда Ден понимает, что наказание достанет его семью. Инструмент замера регистрирует того, кто его принёс. Это лучший ход в главе, и он сделан одной фразой, без объяснения — просто «пробирка стала чуть тяжелее». Второе, что зацепило, другого свойства: посреди сцены стоит прямой вопрос «Интересно кому принадлежит эти мысли?». Автор не знает, чья это внутренняя реплика, и оставляет вопрос в тексте вместо того, чтобы убрать абзац. Это не приём и не небрежность в чистом виде, это видимый шов — и он там самый живой кусок после пробирки.</p></div>", "r": []}];</script>
