<script>const BASE="";const DOCNAME="Команда против Серафима («пати»)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0008-S01", "GR-0008--chto-eto"], "h": "<p>Боевой отряд из четырёх апостолов, собранный под одного противника — Серафима. Формулировка Славы, с которой группа начинается: «Они будут сражаться командой против Серафима» (2025-01-28, id 285363). В самом же тексте того сообщения употреблено другое слово — «пати»: «Быстрейший в этой пати» (о Палаче, там же). Отдельного названия у отряда нет, в переписке он обозначен только этими двумя словами.</p>\n<p>Появление группы укладывается в полчаса одного вечера. В 19:01 Слава объявляет намерение: «Ладно сейчас я запишу персонажей который будут противостоять ему ты в нейрону скинушь?» (id 285353). Миколай отвечает: «хорошо давай» (id 285354). В 19:29 приходит сам список — четыре персонажа под номерами, у каждого показатели, способность и оружие (id 285363). В 19:35 Миколай выкладывает ссылку <code>https://telegra.ph/boi-01-28</code> (id 285369). Что именно в ней — в переписке не пересказано.</p>\n<p>Через двадцать минут после списка Слава делает оговорку, которая меняет статус всего отряда: «Вообще против Серафима по сюжету должны были драться совсем другие перс которых я ещё не придумал» (2025-01-28 19:49, id 285405). То есть эти четверо поставлены против Серафима не по сюжету, а как наличные персонажи под конкретную задачу; сюжетные противники Серафима на тот момент не придуманы.</p>\n<p>Разведка определила это как группу верно: четыре персонажа названы вместе, одним списком, под общую задачу, и внутри списка они сравниваются друг с другом («быстрейший в этой пати», «самый живучий среди них», «прочность у него ниже чем у Воительницы»). Но группа существует ровно в одном сообщении и его ближайшем обсуждении.</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0008-S02", "GR-0008--sostav"], "h": "<p>Состав дан нумерованным списком (2025-01-28, id 285363), нумерация авторская:</p>\n<ol>\n<li><strong><a href=\"PS-0194.html\">Воительница</a></strong> — Воительница. В переписке написано «Воительнтца».</li>\n<li><strong><a href=\"PS-0182.html\">Агрегат</a></strong> — Агрегат.</li>\n<li>Имитатор — отдельной записью в списке вселенной «Апостол» не заведён, у него есть только способности (<a href=\"PS-0383.html\">Имитатор</a>, <a href=\"SP-0079.html\">Имитация</a>, <a href=\"SP-0127.html\">Особое усиление</a>).</li>\n<li><strong><a href=\"PS-0171.html\">Палач</a></strong> — Палач.</li>\n</ol>\n<p>Все четверо к этому моменту уже числились в реестре благословенных, составленном четырьмя днями раньше (2025-01-24, id 284248 и id 284278): «Имитатор 🗡( ветреной 🌬; электро⚡️; птичка 🔈)», «Агрегат🫥 ( волк🐺; экстримал ⏳ )» (в более поздней версии реестра — «волк🐺; экстримал ⏳; страдалец 🔪»), «Разрушительнитца💪 ( огненная 💥)», «Палач☠️». То есть отряд собран из уже готового реестра, а не придуман с нуля.</p>\n<p>Совпадение «Воительница» = «Разрушительнитца 💪» не подтверждено: эмодзи и оружейный браслет совпадают, имя другое.</p>\n<p>Ещё раньше, 2025-01-22, все четыре способности отряда перечислены разом в другом контексте — как способности «братьев и сестёр» персонажа, описанного в id 283706: «Среди его братьев и сестёр есть владельцы способности изменения агрегатного сотояния, / Та кто может изменять плотность массу и размер объектов и себя / Тот у кого есть способность сжатия / Имитация / Бессмертный выродок / Теневые братья» (id 283707). «Братья и сестры это то бишь благословенный одним правителем» (id 283706). Носители названы там по способностям, без имён.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Второе. Статья пишет, что Имитатор отдельной записью не заведён, — а статья <code>PS-0383</code> «Имитатор» существует и она одна из самых полных в наборе. Своей записи в базе у него действительно нет (0 знаков), материал лежит под <code>SP-0060</code> «Усиление Имитатора» (112 113, две ссылки) и <code>PS-0293</code> «Усиление Имитатора» как персонаж (25 519, статьи нет). Но ссылки из <code>GR-0008</code> на <code>PS-0383</code> нет, и состав отряда собран из трёх карточек вместо четырёх.</p></div>", "r": [["Воительница", "PS-0194.html"], ["Агрегат", "PS-0182.html"], ["Имитатор", "PS-0383.html"], ["Палач", "PS-0171.html"], ["Имитация", "SP-0079.html"], ["Особое усиление", "SP-0127.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0008-S03", "GR-0008--obschie-sposobnosti-gruppy"], "h": "<p>Общей для всей четвёрки способности, совместного приёма или групповой техники в переписке не названо. Общее у них другое:</p>\n<ul>\n<li>Все четверо — из числа благословенных, то есть «братья и сестры», «благословенный одним правителем» (2025-01-22, id 283706).</li>\n<li>У каждого ровно одна именованная способность.</li>\n<li>У каждого своё оружие — с оговоркой по Агрегату, у которого оружия нет как предмета: «Не имеет орудия, точнее сам его создаёт из воздуха за счёт этого оно почти невидимая» (id 285363).</li>\n<li>Показатели каждого заданы не абсолютно, а сравнением с остальными членами отряда: скорость и живучесть меряются друг о друга.</li>\n<li>О принадлежности к апостолам прямо сказано только про Воительницу — на вопрос Миколая «от куда она» (id 285410) Слава отвечает: «Апостол» (id 285411). Агрегат и Палач названы апостолами позже и вне контекста отряда. Про Имитатора в этих записях такого утверждения нет.</li>\n</ul>", "r": []}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0008-S04", "GR-0008--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p>Все характеристики ниже — из одного сообщения (2025-01-28, id 285363).</p>\n<p><strong>1) Воительница (<a href=\"PS-0194.html\">Воительница</a>).</strong> «Имеет огромную физическую силу и очень крепка, но скорость на среднем уровни». Способность — контроль над массой, размером и плотностью (<a href=\"SP-0179.html\">Контроль над массой, размером и плотностью</a>), с прямым ограничением: «но только на себе или на неживых объектов». Оружие: «оружейный браслет- это браслет на котором висят разный холодный орудия, которая она сможет увеличить и сделать плотней». То есть способность и оружие сцеплены: браслет работает через увеличение и уплотнение висящих на нём орудий.</p>\n<p>Уточнения по ней пришли отдельно, в тот же вечер (id 285405–285418). Миколай спрашивает: «че за воительница», «от куда она». Слава: «Апостол» (id 285411), «Апостол у которогой есть дочь» (id 285412). Миколай задаёт вопрос, который так и остаётся без ответа: «воительница просто прозвище по способности а не по профессии?» (id 285413). Затем: «вопросов нет», «вроде понятно», «и очень интересно» (id 285416–285418).</p>\n<p><strong>2) Агрегат (<a href=\"PS-0182.html\">Агрегат</a>).</strong> «Имеет средний показатель, но достаточно быстрые Воительницы» — формулировка авторская, так и записана. Способность — смена агрегатного состояния (<a href=\"SP-0180.html\">Смена агрегатного состояния</a>): «менять агрегатной состояния неодушевлённых объектов, он может сделать прочным воздух или землю превратить в воду». Ограничение — только неодушевлённое. Оружия у него нет: он делает его из воздуха, и «за счёт этого оно почти невидимая».</p>\n<p><strong>3) Имитатор.</strong> «Самый живучий среди них при этом прочность у него ниже чем у Воительницы» — живучесть и прочность здесь разведены как разные показатели. Способность — имитация (<a href=\"SP-0079.html\">Имитация</a>): «имитировать способность врага, но лишь одну способность и то ему надо время, но плюс способность в том что он конечно имитирует но способен будет еë развить». То есть три оговорки сразу: одна способность за раз, не мгновенно, но скопированное можно развивать дальше. Оружие: «жидкость который моментально может принять любую форму».</p>\n<p><strong>4) Палач (<a href=\"PS-0171.html\">Палач</a>).</strong> «Быстрейший в этой пати, его всё атаки нацеленый на жизненный важный точки противника». Способность — сжатие (<a href=\"SP-0181.html\">Сжатие</a>), с тремя применениями: «он может жать пространства чтобы приблизится к противнткк, или сжать атаку противника. Он также может сжимать ауру и делать слэш». Оружие — катана. Расхождение: в реестре благословенных у Палача значится «меч палача ☠️», здесь названа катана.</p>\n<p><strong>Сравнительная шкала внутри отряда</strong>, как она вычитывается из текста:</p>\n<ul>\n<li>Скорость: Палач — быстрейший; Агрегат быстрее Воительницы; у Воительницы скорость средняя.</li>\n<li>Сила и прочность: Воительница — огромная сила, «очень крепка»; прочность Имитатора ниже, чем у неё.</li>\n<li>Живучесть: Имитатор — самый живучий.</li>\n<li>Про силу и прочность Агрегата и Палача отдельно ничего не сказано, кроме «средний показатель» у Агрегата.</li>\n</ul>", "r": [["Воительница", "PS-0194.html"], ["Агрегат", "PS-0182.html"], ["Палач", "PS-0171.html"], ["Контроль над массой, размером и плотностью", "SP-0179.html"], ["Смена агрегатного состояния", "SP-0180.html"], ["Имитация", "SP-0079.html"], ["Сжатие", "SP-0181.html"]]}, {"t": "Иерархия", "a": ["S05", "GR-0008-S05", "GR-0008--ierarhiya"], "h": "<p>Иерархия не названа. Есть только нумерация от 1 до 4 в списке и сравнение показателей между собой. Кто в отряде командует, кто кому подчиняется, кто собирал состав внутри вымысла — в переписке не сказано. Нумерация в тексте не объявлена ни ранговой, ни порядком по силе.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S06", "GR-0008-S06", "GR-0008--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>Апостолы.</strong> Отряд состоит из апостолов; в карточках Агрегата и Палача указано «Часть чего: Апостолы». Воительница названа апостолом прямо (id 285411).</p>\n<p><strong>Благословенные, «братья и сёстры».</strong> Все четверо взяты из реестра благословенных (2025-01-24, id 284248, 284278), где они идут в одном столбце с Теневыми братьями, Защитником, Дитём света, Бессмертным выродком, Хулиганом, Вибрацией и Ученицей. Четыре их способности перечислены как способности «братьев и сестёр» — «благословенный одним правителем» (2025-01-22, id 283707).</p>\n<p><strong>Серафим.</strong> Противник, под которого отряд собран. Сам Серафим в этих записях не описан: ни способностей, ни принадлежности, ни того, чем бой кончился. Тут же сказано, что сюжетные его противники — другие: «против Серафима по сюжету должны были драться совсем другие перс которых я ещё не придумал» (id 285405).</p>\n<p><strong>Враги (второй столбец реестра).</strong> В реестре благословенных от 2025-01-24 параллельно идёт список «Враг:» — Доспехи, Козлиха, Сестра, Огненный снайпер, Охотник, Божество, Убийца, Зонтик, Леший, Пар, Садистка, Насекомое, Старик, позже Эльф. Связи отряда с этим списком в переписке не проведено; Серафим в нём не значится.</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S07", "GR-0008-S07", "GR-0008--kak-menyalas"], "h": "<p><strong>2025-01-22 (id 283706–283710).</strong> Ещё не группа: четыре её способности названы как способности «братьев и сестёр» одного персонажа, без имён. В тех же сообщениях идёт перебор устройства благословенных вообще: «вообще благословенный Богом есть общая чёрта виде белых глаз при активаций благословения / И я эти глазами наделил всех тех который должны быть благословений дьяволом, при этом и менять я ничего не хочу потому что мне и так нравится / Поэтому я думаю вообще убрать благословенных дьяволом» (id 283708), «Тогда благословенных будет 21» (id 283709), «Ну конечно можно оставить и 42» (id 283710). Это касается всего пула благословенных, а не отряда.</p>\n<p><strong>2025-01-24 (id 284248, 284278).</strong> Реестр благословенных. Все четверо в нём есть, у Агрегата в скобках приписки — сначала «волк🐺; экстримал ⏳», в тот же день добавлен «страдалец 🔪».</p>\n<p><strong>2025-01-28, 19:01–19:35 (id 285353–285369).</strong> Отряд собран и расписан целиком: четыре номера, показатели, способности, оружие. Это единственное состояние группы. Материал предназначался для передачи нейросети, результат — ссылка <code>https://telegra.ph/boi-01-28</code>.</p>\n<p><strong>2025-01-28, 19:49–19:54 (id 285405–285418).</strong> Достройка по Воительнице (апостол, есть дочь) и оговорка Славы, что по сюжету против Серафима должны драться другие, ещё не придуманные персонажи. Вопрос Миколая про природу прозвища остаётся без ответа, обсуждение закрывается на «вопросов нет».</p>\n<p><strong>После 2025-01-28 отряд как отряд не упоминается ни разу.</strong> Участники дальше разрабатываются порознь, вне связи с Серафимом и друг с другом:</p>\n<ul>\n<li><strong>2025-03-14 (id 302839–302842).</strong> Агрегат: «Ну Агрегат уравновешенный хоть второстепенный перс», «Пока что». Миколай: «пока не центральный».</li>\n<li><strong>2025-05-19 (id 328114–328117).</strong> Палач: разработка, никак не сходящаяся с боевым номером 4. Здесь он — фигура из безумия Александра: высокий плечистый человек в тесной чёрной коже, без кожи и без носа на лице, с острыми наростами из щёк, лысый, с огромным цельножелезным топором вдвое больше обычного; идёт медленно, «Знал что не убегу»; узнаётся по звуку «таскания чего-то тяжелого и железного по бетону». Никакой катаны, никакого сжатия. Позже (id 328132–328133, самих сообщений в архиве нет) он объяснён как осколок сознания, ставший самостоятельным.</li>\n<li><strong>2025-11-05 (id 382099).</strong> Палач назван «апостолом, который сильнейший в ближнем бою»; его стилю обучены государственные Палачи — «но опять же это лишь имитация стиля Палача». Там же: «было проведена попытка обучения особого усиления Имитатора, но из-за большой смертности от неё отказались».</li>\n<li><strong>2025-12-06 (id 393477–393480).</strong> Агрегат: «Вообще у Агрегат, Графа и Защитника / Судьба предрешена. Ну я то есть придумал их ней путь». Больше в окне ничего.</li>\n<li><strong>2026-04-19 (id 462201–462203).</strong> Имитатор переписан заново и уже без отряда: «Имитатор, высокомерный черт, что должен будет пройти свой этап перерождения»; «А в конце он имитирует способность врага и превосходит его в мастерстве».</li>\n<li><strong>2026-06-02 (id 487176).</strong> Палач: «Цепной пёс ассоциации. Ну точнее ассоциации так думает»; «В ближнем бою он почти сильнейший»; «сильнейший апостолы это Граф и Палач».</li>\n<li><strong>2026-06-07 (id 488504, 488544–488545).</strong> Имитатор ещё раз перерабатывается «под новый мир», под именем Имет.</li>\n</ul>\n<p>Ни одна из этих поздних версий отряд не отменяет и на него не ссылается — они просто идут мимо него.</p>\n<p><strong>Отклонённый вариант.</strong> Единственное, что в связи с отрядом прямо забраковано, — его собственное сюжетное основание: Слава сам, через двадцать минут после списка, сказал, что против Серафима по сюжету должны были драться другие, ещё не придуманные персонажи (id 285405). Отряд при этом не отозван и не переписан — оговорка просто повисает.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "GR-0008-S08", "GR-0008--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имитатор, третий номер отряда, отдельной записью в списке вселенной «Апостол» не заведён — есть только его способности (<a href=\"PS-0383.html\">Имитатор</a>, <a href=\"SP-0079.html\">Имитация</a>, <a href=\"SP-0127.html\">Особое усиление</a>).</li>\n<li>Иерархии нет: кто в отряде главный, не сказано. Нумерация 1–4 никак не объявлена.</li>\n<li>Своего названия у группы нет — только «командой» и «пати».</li>\n<li>Серафим, единственный противник, под которого отряд собран, в этих записях не описан вообще: ни сил, ни принадлежности, ни исхода боя.</li>\n<li>Чем кончилось столкновение и было ли оно — не сказано. Содержимое ссылки <code>https://telegra.ph/boi-01-28</code> в переписке не пересказано.</li>\n<li>Не подтверждено, тот ли это персонаж, что в реестре зовётся «Разрушительнитца 💪».</li>\n<li>Оружие Палача расходится: в реестре «меч палача ☠️», в отряде — катана. Расхождение не обсуждалось.</li>\n<li>Вопрос Миколая «воительница просто прозвище по способности а не по профессии?» (id 285413) остался без ответа.</li>\n<li>Про дочь Воительницы сказано ровно одно: она есть (id 285412). Ни имени, ни роли.</li>\n<li>Приписки в скобках у Агрегата в реестре (волк 🐺; экстремал ⏳; страдалец 🔪) не объяснены.</li>\n<li>Апостолами на момент сборки отряда прямо названа только Воительница; про Имитатора такого утверждения нет нигде в этих записях.</li>\n<li>Как отряд собрался внутри вымысла — кто их созвал, знакомы ли они между собой, воевали ли вместе раньше — не сказано.</li>\n<li>Совместных приёмов, тактики, распределения ролей в бою нет: сравниваются только показатели.</li>\n</ul></div>", "r": [["Имитатор", "PS-0383.html"], ["Имитация", "SP-0079.html"], ["Особое усиление", "SP-0127.html"]]}, {"t": "Связи — всё вместе", "a": ["GR-0008--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0171.html\">Палач</a>, <a href=\"PS-0182.html\">Агрегат</a>, <a href=\"PS-0194.html\">Воительница</a></li>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0079.html\">Имитация</a>, <a href=\"SP-0127.html\">Особое усиление</a>, <a href=\"SP-0179.html\">Контроль над массой, размером и плотностью</a>, <a href=\"SP-0180.html\">Смена агрегатного состояния</a>, <a href=\"SP-0181.html\">Сжатие</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0008--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0008.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0008-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0008/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — Серафим. Отдельной записи о нём в базе нет ни под каким id: весь материал разложен по двум карточкам способностей, <code>SP-0187</code> «Силы Серафима» (одна ссылка, статья есть, база 4 303) и <code>SP-0225</code> «Способности Серафима» (ноль ссылок, статья есть, 3 861). Это одна и та же строка из четырёх сил, вычитанная из двух редакций реестра (2025-02-25 и 2025-05-14), то есть дублирующая пара вместо персонажа. На него при этом опираются две группы — эта, где он единственное основание существования отряда, и <code>GR-0007</code>, где он рассмотрен и отклонён как «одноразовый босс». Отдельно: <code>PS-0209</code> «Серафима» (статья есть, 2 914) — это не он, а кошкодевочка из чужой вселенной, пересказанной Миколаем; по имени их склеить очень легко, при слиянии проверить.</p>\n<p>Второе. Статья пишет, что Имитатор отдельной записью не заведён, — а статья <code>PS-0383</code> «Имитатор» существует и она одна из самых полных в наборе. Своей записи в базе у него действительно нет (0 знаков), материал лежит под <code>SP-0060</code> «Усиление Имитатора» (112 113, две ссылки) и <code>PS-0293</code> «Усиление Имитатора» как персонаж (25 519, статьи нет). Но ссылки из <code>GR-0008</code> на <code>PS-0383</code> нет, и состав отряда собран из трёх карточек вместо четырёх.</p>\n<h3>С чего начать</h3>\n<p>Не в архив — в то же окно, которое статья уже цитирует. w0073, id 285380–285393: исход боя назван прямо. «Ура» — «Только имитатор умер» (285381) — «Он гг» (285382). Оценка автора там же: «Ну вообще есть много того что я проставлять по другому» (285388); Миколай в этот момент ещё не дочитал (285387), а через десять минут связывает смерть с характеристиками отряда: «наверное поэтому нейронка решила его убить 🤡» (285414). Пробел «чем кончилось столкновение и было ли оно» закрывается на месте, не выходя из окна. Там же вторая ссылка того вечера — <code>telegra.ph/nu-01-28-3</code> (285466, 20:06), помимо уже названной в статье.</p>\n<p>Расхождение по оружию Палача (реестр — «меч палача ☠️», отряд — катана) тоже смотрится в базе: <code>PS-0171</code> «Палач» — четыре ссылки, статья есть, база 39 423, самая крупная карточка среди участников.</p>\n<h3>Как развивалось</h3>\n<p>2025-01-22 — четыре способности названы разом, без имён, как способности «братьев и сестёр». 2025-01-24 — все четверо попадают в реестр благословенных. 2025-01-28, 19:29 — отряд собран целиком: номера, показатели, способности, оружие. 19:49, через двадцать минут — сам автор снимает у отряда сюжетное основание: против Серафима «должны были драться совсем другие перс которых я ещё не придумал». 19:54 — «вопросов нет». Дальше возврата нет вообще: 2025-03-14, 2025-05-19, 2025-11-05, 2025-12-06, 2026-04-19, 2026-06-02, 2026-06-07 — участников переписывают поодиночке, отряд не поминают ни разу. Из четырёх групп этого блока это единственная, где четвёртого такта нет.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>У трёх способностей из четырёх предел назван прямо и в той же реплике, что и сама способность: у Воительницы — «но только на себе или на неживых объектов», у Агрегата — только неодушевлённое, у Имитатора сразу три оговорки (одна способность за раз, нужно время, но скопированное можно развить). У Палача сжатие расписано в трёх применениях — сжать пространство, сжать чужую атаку, сжать ауру и сделать слэш — и не имеет ни одного ограничения. Правило цены сформулировано для трёх и не сформулировано для четвёртого, притом что четвёртый — самый широкий приём в списке.</p>\n<h3>Отклик</h3>\n<p>Тут интересна не четвёрка, а способ, которым она описана: ни одного абсолютного показателя, все меряются друг о друга. Быстрейший в пати; быстрее Воительницы; прочность ниже, чем у Воительницы; самый живучий среди них. Замкнутая система координат, где сила существует только внутри отряда и наружу не переводится — и именно поэтому про Серафима, ради которого всё затевалось, сказать нечего вообще: его в этой системе нет. А потом эта шкала один-единственный раз во что-то сыграла — нейросеть прочитала «прочность ниже, чем у Воительницы» буквально и убила главного героя, и Миколай это сразу считал. Машина оказалась единственным читателем, отнёсшимся к цифрам всерьёз. И двадцать минут между списком и «вообще-то по сюжету должны драться другие» — очень честный отрезок времени.</p></div>", "r": []}];</script>
