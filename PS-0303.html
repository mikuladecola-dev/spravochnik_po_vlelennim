<script>const BASE="";const DOCNAME="Жизненный цикл апостолов";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0303-S01", "PS-0303--proishozhdenie"], "h": "<p>Запись выписана отдельно от общего описания апостолов — как перечень этапов, который автор проговорил специально: «Вот этапы апостолов» (2025-10-22, id 377626). Относится только к вселенной Оам: сразу после перечня уточнено «Ну только в вселенной Оам» (id 377627).</p>\n<p>Сам цикл дан в трёх пунктах:</p>\n<ol>\n<li>«Они вылупились из кокона»;</li>\n<li>«а потом росли с нормальной скоростью»;</li>\n<li>«И в рандомные момент для них замирает время».</li>\n</ol>\n<p>Началу цикла предшествует то, что описано в общей характеристике апостолов того же дня (id 377625): апостолы — группа из 21 существа, телепатически связанных друг с другом, но не люди, а насекомые. «Всё двадцать один апостол вылезли из разных коконов. И по своё природе не являются людьми. Хоть и очень на них похоже». То есть коконы у всех разные, а не общий.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0303-S02", "PS-0303--vneshnost"], "h": "<p>Отдельного описания нет. Из общей характеристики: апостолы не люди, а насекомые, «Хоть и очень на них похоже» — то есть внешне схожи с людьми. Возраст, на котором для конкретного апостола замирает время, случаен, поэтому и внешний возраст у разных апостолов разный. Как это выглядит, не описано.</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0303-S03", "PS-0303--sposobnosti"], "h": "<p>Третий этап цикла — замирание времени — сформулирован в двух видах. В перечне этапов: «в рандомные момент для них замирает время». В общем описании апостолов: «у них замедленная старения ( точнее они словно замерзают в каком-то возрасте( в рандомные возраст )».</p>\n<p>Рядом, но не как часть цикла, описано свойство их сил: «И они как арбетары. Если сжечь лес он будет гореть не переставая. То есть их ний силы постоянные ( конечно с некоторыми условностями) но они могут сами вырубить огонь». То есть последствия применения силы апостола не прекращаются сами, но апостол может их отменить.</p>\n<p>Отдельно оговорено, что в остальном апостолы Оам такие же, как в другой вселенной: «Изменения они всё такие же как и в другой вселенной». Изменение внесено только в старение.</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0303-S04", "PS-0303--svyazi-s-drugimi"], "h": "<ul>\n<li>Апостолы — раса, чей цикл описан; всё содержание записи относится к ним и ни к кому больше.</li>\n<li>Родитель апостолов — фигура, которая должна была бы стоять в начале цикла, но её нет: «Кто их родитель я так и не придумал».</li>\n<li>В том же сообщении, что и общая характеристика, описана причина сплочённости апостолов: «Здесь апостолы дорожат друг другом больше всех» — из-за того, что некая организация убила семью одного апостола и разгромила детский приют другого, после чего остальные апостолы начали эту организацию истреблять, «Даже тех кто просто приходил помолиться в церковь этой организации». К жизненному циклу это прямо не отнесено, названия организации нет.</li>\n</ul>", "r": []}, {"t": "Как менялся", "a": ["S05", "PS-0303-S05", "PS-0303--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2025-10-22 (окно w0108, id 377625–377627).</strong> Единственная версия. Перечислены три этапа, оговорена привязка к вселенной Оам, и тут же отмечены два незаполненных места — родитель и следующий этап. Позже переписка к жизненному циклу не возвращается.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0303-S06", "PS-0303--probely"], "h": "<div class=\"gaps\"><ul>\n<li>«Кто их родитель я так и не придумал» — начало цикла пустое.</li>\n<li>«Какой следующий этап в их ней жизненном цикле будет я не знаю» — цикл обрывается на замирании времени; что дальше, осталось нерешённым.</li>\n<li>Умирают ли апостолы и что происходит при смерти — не сказано.</li>\n<li>Сколько длится рост «с нормальной скоростью» и от чего зависит момент замирания времени (назван случайным) — не объяснено.</li>\n<li>Как из коконов появляется ровно 21 апостол и появляются ли новые коконы — не сказано.</li>\n<li>«Некоторые условности», при которых силы апостолов постоянны, не перечислены.</li>\n<li>Организация, убившая семью одного апостола и разгромившая приют другого, не названа.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0303--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0056.html\">Апостолы (21 апостол; «насекомые»)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0008.html\">Оам</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0303--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-10-22</td>\n<td>377625–377627</td>\n<td>w0108</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0303-zhiznennyy-cikl-apostolov.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0303--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0303.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
