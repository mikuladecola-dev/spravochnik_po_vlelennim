<script>const BASE="";const DOCNAME="Подручные сестры";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0289-S01", "PS-0289--proishozhdenie"], "h": "<p>Подручные сестры — команда при Сестре, «благословенной правителем Кильке». Как эта команда собралась, кто в неё входит и откуда взялись её участники, в переписке не сказано: обсуждение (2025-08-30, id 359684–359691) идёт не о составе, а о том, какой силы этому составу не хватает.</p>", "r": []}, {"t": "Способности", "a": ["S02", "PS-0289-S02", "PS-0289--sposobnosti"], "h": "<p>Задана только верхняя граница силы. Сама Сестра «сильнее одного апостола», но, по формулировке Славы, «это не та сила, что поставит на колени весь мир». Её подручные слабее: «А её подручный всё слабее апостолов. Каждый из них один на один против апостолов продует». Дополнительно оговорено, что численностью это не компенсируется — «При этом у них не такая большая группировка».</p>\n<p>Ни у одного из подручных индивидуальная способность не названа.</p>", "r": []}, {"t": "Связи с другими", "a": ["S03", "PS-0289-S03", "PS-0289--svyazi-s-drugimi"], "h": "<p>Подручные существуют как часть Сестры — она остаётся «ключевым злодеем», команда прикреплена к ней. Противостоят апостолам.</p>\n<p>Отдельно в том же разговоре перебирались и отбрасывались кандидаты на роль недостающей силы:</p>\n<ul>\n<li>Серафим — «Но это одноразовый босс. Что появится, когда будет война с раем». То есть на постоянного злодея не годится.</li>\n<li>Разные существа из рая — отклонены по двум причинам: «Во первых нет так таковой цели, кроме мести. Во вторых не какой группироаонной работы не будет их же в разный места раскидает».</li>\n</ul>", "r": []}, {"t": "Как менялся", "a": ["S04", "PS-0289-S04", "PS-0289--kak-menyalsya"], "h": "<p><strong>2025-08-30 (id 359684–359691).</strong> Единственная версия. Заданы рамки силы команды и сформулирована дыра, которую надо закрыть: «Нет сестра так и останется ключевым злодеем. Но кто в её команде должен быть настолько сильном что перевернёт хот битвы».</p>\n<p>Требование к этому кандидату задано через финал: «В конце всё истории и в последнее битве апостолы продуют. Большинство апостолов сдохнуть. Поэтому нужна сила что позволит это сделать».</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "PS-0289-S05", "PS-0289--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Состав команды не назван: ни имён, ни числа подручных, ни их способностей.</li>\n<li>Кандидат, который «перевернёт ход битвы», на 2025-08-30 не найден — вопрос оставлен открытым.</li>\n<li>Что такое Кильке и почему благословение его правителя даёт Сестре силу больше апостольской, в переписке не сказано.</li>\n<li>Отношения подручных с Сестрой (подчинение, верность, происхождение связи) не описаны.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0289--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0007.html\">Команда (подручные) сестры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0289--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-08-30</td>\n<td>359684–359691</td>\n<td>w0103</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0289-podruchnye-sestry.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0289--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0289.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0289-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0289/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Из четырёх пробелов статьи один объявлен зря: «Что такое Кильке» в справочнике уже есть. <code>MR-0207</code> «Килька» — статья есть, база 68 896 знаков, одна ссылка; <code>PS-0217</code> «Правитель Кильки» — статья есть, 14 203, две ссылки. Прежде чем писать «в переписке не сказано», эти 68 тысяч надо прочесть; при этом ни на одну из двух записей статья не ссылается. В связях у неё вообще только <code>GR-0007</code> — группа, у которой база 0, то есть собранная из этой же статьи и ничего к ней не добавляющая. Сама Сестра, вокруг которой всё построено, — <code>PS-0215</code> «Сестра имитатора», четыре ссылки, статья есть, база 7 906 — в связях отсутствует.</p>\n<p>Дальше по цене идут списки, и это блокер не только для этой статьи. <code>SL-0053</code> (шесть ссылок, статьи нет, база 20 313) и <code>SL-0051</code> (шесть ссылок, статьи нет, 9 834) — каталоги благословенных, врагов, грехов, оружия и артефактов; <code>SL-0090</code> (четыре ссылки, статьи нет, 5 492) и <code>SL-0089</code> (четыре ссылки, статьи нет, 1 753). Четыре записи держат двадцать входящих ссылок и не имеют ни одной статьи. Пробел «состав команды не назван» решается там, если решается вообще: поимённый состав злодейской стороны, если он где-то зафиксирован, лежит в этих каталогах, а не в карточке подручных.</p>\n<p>Третье: шкала. Вся статья описывает подручных сравнением — слабее апостолов, сестра сильнее одного апостола, но не мира. <code>MR-0107</code> «Иерархия силы» (четыре ссылки, статья есть, 5 534) и <code>MR-0105</code> «Организация злодеев» (четыре ссылки, статья, 4 924) — это ровно та шкала и та структура, к которым сравнение отсылает, и обе не подключены.</p>\n<h3>С чего начать</h3>\n<p>В базе, и там же лежат оба отклонённых кандидата — их отклонение можно проверить, не выходя в архив. Серафим: <code>SP-0187</code> «Силы Серафима» (статья, 4 303), <code>SP-0225</code> «Способности Серафима» (статья, 3 861), <code>PS-0209</code> «Серафима» (статья, 2 914). Рай: <code>MR-0095</code> (статья, база 54 131, одна ссылка). Довод «нет так таковой цели, кроме мести» проверяется по этим 54 тысячам, а не по памяти.</p>\n<p>Продолжение разговора за пределами 2025-08-30 тоже в базе. Группа возвращается 2025-11-17, id 385768, оттуда переслано 2025-12-06 (id 393287) и развёрнуто в id 393313 и 393477–393480; там же появляется <code>PS-0325</code> «Босс группировки дочери» (статьи нет, база 2 914) — первый и пока единственный названный участник. Смежная запись — <code>MR-0170</code> «Группировка сестры» (статьи нет, 4 292).</p>\n<p>В архив идти стоит только за одним: за финалом. <code>IS-0067</code> «Финальная битва и гибель апостолов» — статья есть, а базы под ней всего 1 945 знаков. Требование к недостающей силе выведено именно из финала («В конце всё истории и в последнее битве апостолы продуют»), то есть самая нагруженная опора этой статьи держится на самой тонкой записи в кусте. Ориентир — окно w0103 вокруг 2025-08-30 и всё, где всплывает гибель апостолов.</p>\n<h3>Как развивалось</h3>\n<p>2025-08-30, один разговор, id 359684–359691. Заявили: команда при Сестре существует, Сестра — ключевой злодей. Тут же ограничили, причём сверху и снизу сразу: сильнее одного апостола, но «это не та сила, что поставит на колени весь мир»; подручные слабее апостолов поодиночке; численностью не компенсируется — «не такая большая группировка». В том же разговоре перебрали двух кандидатов на добор силы и обоих отклонили. Разговор обрывается на вопросе «кто в её команде должен быть настолько сильном что перевернёт хот битвы», и в этом окне к нему не возвращаются. Дальше группа всплывает через два с половиной месяца уже в другой постановке — как группировка дочери Имитатора.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для Сестры источник силы назван: она «благословенная правителем Кильке», отсюда и «сильнее одного апостола». Сила приходит от благословения, и у благословения есть конкретный источник с именем. Для подручных, стоящих в той же строке, источник не назван вообще: сказано только, насколько они слабее апостолов, но не сказано, от чего они вообще сильны — благословлены ли они, кем, тем же ли правителем или никем. Для апостолов правило тоже названо, они «благословенные Богом». То есть у двух сторон происхождение силы проговорено, у третьей, помещённой прямо между ними и измеренной через обе, — нет.</p>\n<h3>Отклик</h3>\n<p>Странная запись: команда, о которой самое точное известное — это то, чего она не может. Ни одного имени, ни одной способности, ни одного лица, но зато с точностью до формулировки зафиксировано поражение: «Каждый из них один на один против апостолов продует». Обычно бывает наоборот — сначала придумывают, кто крутой, потом соображают, как его ослабить. Здесь сначала выставлен потолок, а внутрь потолка ещё никто не поселён, и весь разговор идёт о пустом месте с известными размерами. Зацепило и то, каким доводом отбрасывают существ рая — «их же в разный места раскидает». Это не про то, что они не подходят по духу, а про то, что их не собрать в одну сцену. Возражение завхоза, и оно честнее большинства рассуждений о злодеях.</p></div>", "r": []}];</script>
