<script>const BASE="";const DOCNAME="Арбетары";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0017-S01", "GR-0017--chto-eto"], "h": "<p>Арбетары — категория существ вселенной «Апостол», введённая Славой 2025-03-10 (id 300882–300921) как дополнение к уже существовавшему устройству мира. Это не отряд и не организация с поимённым составом: в переписке арбетары описываются как класс силы наряду с благословенными, альфами, чужемирцами, владельцами артефактов и фантазёрами. Поимённо в переписке назван один арбетар — старик из истории про Антошу (<a href=\"PS-0224.html\">Старик-арбетар</a>); остальные проходят как безымянные («учитель», «Арбетар, заглянувший в деревню»).</p>\n<p>Определение даётся дважды, с интервалом почти в три месяца.</p>\n<p>2025-03-10 (id 300910–300911), ход рассуждения от альф:</p>\n<div class=\"q\"><p>«Я подумал раз так могут альфа, так значит так могут и люди, сцапать кусок силы своего мира»</p></div>\n<div class=\"q\"><p>«И вот люди, который сцапали кусок силы своего мира называют Арбетар»</p></div>\n<p>2025-05-31 (id 331636), уже совместно с альфами:</p>\n<div class=\"q\"><p>«Арбетары и Альфа это одни те же существа. Но в первом случае это люди из кильке, а во втором это чужемирцы. Если их описывать то это существа, который насильственно вырвали кусок силы своего мира( с помощью ритуала??? Которой я ещё не доработал). А после посели его в себе и заставили выделять силу.»</p></div>\n<p>Название объяснено внутри художественного текста 2025-03-13 (id 301805): «Арбетар(швецский; на русском трудяга)».</p>\n<p>Как класс арбетары противопоставлены благословенным. Благословенные, по описанию от 2025-03-10 (id 300888), — «люди у которых есть связь с правителем другого мира, и чтобы получить его силу нужно сначала пропустить еë через мозг, из за этого благословенный не могут использовать благословенный 24/7». У арбетара сила своя и находится внутри него, поэтому ограничения снимаются: «по сути это благословенния только не через связь. А именно это сила находиться внутри их» (2025-05-31, id 331636).</p>\n<p>Отдельно зафиксировано, что арбетары делают, придя к людям (2025-03-13, id 301805):</p>\n<div class=\"q\"><p>«В деревню решил заглянуть Арбетар(швецский; на русском трудяга). И начал Арбетар там всё крушить и поглащать жизнь человеческий и начал он из них делать чудищь словно из картины шизофриника.»</p></div>\n<p>Центральной идеей истории «Антоша» Слава назвал именно раскрытие этого класса — «Антоша. Идея раскрыть Арбетаров» (2025-03-14, id 302863).</p>", "r": [["Старик-арбетар", "PS-0224.html"]]}, {"t": "Состав", "a": ["S02", "GR-0017-S02", "GR-0017--sostav"], "h": "<ul>\n<li><strong><a href=\"PS-0224.html\">Старик-арбетар</a></strong> — Старик-арбетар. Дед в смокинге, с бородкой «как у бизнесменов», с чёрными волосами. Единственный арбетар, показанный подробно: его биография, его ритуал, его бой. Имя в переписке не называется.</li>\n<li><strong><a href=\"PS-0220.html\">Арбетар</a></strong> — карточка самого класса «Арбетар» (введение 2025-03-10, описание вида 2025-03-13). Это не отдельное лицо, а запись о категории.</li>\n</ul>\n<p>Кроме них в тексте упомянуты, но не названы:</p>\n<ul>\n<li>Учитель старика — арбетар, который разорил деревню Ливия, убил семью мальчика и взял его в ученики. Имени нет, отдельной карточки нет.</li>\n<li>Ученик как ступень: старик 50 лет ходил в учениках и лишь потом стал арбетаром сам. Был ли ученик до ритуала уже арбетаром — не сказано.</li>\n<li>Антон Смирнов — проводник ритуала, выживший. Апостол Дмитрий Рутковский говорит ему: «за тобой будет слежка, так как ты тоже получил кусок силы нашего мира. При этом выжив» (2025-03-13, id 301809). Прямой вопрос Миколая — «он тоже арбетар пусть и слабый?» (2025-03-13, id 301879) — остался без ответа.</li>\n</ul>\n<p>Поимённого списка арбетаров в переписке нет; сколько их всего в мире, не сказано.</p>", "r": [["Старик-арбетар", "PS-0224.html"], ["Арбетар", "PS-0220.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0017-S03", "GR-0017--obschie-sposobnosti-gruppy"], "h": "<p>Механика силы разложена в двух местах: 2025-03-10 (id 300898, через альф) и 2025-05-31 (id 331636, уже про арбетаров и альф вместе).</p>\n<p><strong>Устройство.</strong> Кусок силы своего мира захватывается насильственно и поселяется внутри. У альф это описано как ядро: «получив кусочек силы своего мира, они зародилил в себе ядро, которая и вырабатывает энергию, у них нет связи, их нея сила только их нея, а из-за отсутствия связи напряжения на мозг исчезает, так как через мозг больше ничего не проходит, и теперь они по-сути могут использовать свою силу 24/7» (id 300898).</p>\n<p><strong>Постоянное действие.</strong> Ключевая черта класса, повторённая трижды за полгода. 2025-03-10 (id 300898): «огонь которым они устроили пожар не исчезнет пока его не потушить или пока альфа не умрёт». 2025-05-31 (id 331636):</p>\n<div class=\"q\"><p>«если они подожгут лес он будет гореть пока весь не выгореть. Либо его не потушат. Им не зачем отключат  способность. У них даже нету такого понятия,  как отключения.»</p></div>\n<p>Это противопоставлено благословенным, у которых после отключения благословения всё созданное силой исчезает — «Буть то огненный шар или остановка времени они просто отключаться» (2025-10-18, id 375849).</p>\n<p><strong>Четыре базовых умения</strong> (2025-05-31, id 331636) — те же четыре, что у благословенных:</p>\n<ul>\n<li>усиленная регенерация — «регенерация чаще всего превосходит благословенных»;</li>\n<li>усиление тела и чувств;</li>\n<li>аура;</li>\n<li>сенсорика.</li>\n</ul>\n<p><strong>Уникальная способность.</strong> Есть у каждого, и она индивидуальна: «Даже если они сцапали один и тот же кусок силы. У них она всё равно будет разная. Так как этот кусок начинает формироваться подобно апостолом.»</p>\n<p><strong>Обязательное обучение.</strong> Отличие от благословенных: «они должны будут учиться вырабатывать энергию и научиться использовать способность и контролировать энергию. Когда у благословенным это выходит автоматический.»</p>\n<p><strong>Долголетие и питание душами.</strong> 2025-03-13 (id 301806): учитель старика «стар, хоть души людей и питательные, но на них вечность прожить не выйдет». За 50 лет ученичества учитель «был таким же, но слегка лишь поседев». Вечности души людей не дают — поэтому берут учеников.</p>\n<p><strong>Ограничение по артефактам.</strong> 2025-05-31 (id 331636): «Благословенный; альфа, Арбетары и фантазёры не способны раскрыть всю мощь артефакта. Так как уже сами переполненный силой. Лучшего всего мощь артефакта способен раскрыть обычный человек.»</p>\n<p><strong>Цена входа.</strong> 2025-03-10 (id 300913):</p>\n<div class=\"q\"><p>«И кстати люди и чужемирцы сцапав кусок силы своего мира, их ней шанс на выживания 7 процентов<br>Чаще всего идёт отторжения и они могут сойти с ума, их ней тела могут начать гнить, или взорваться<br>Или они могут стать монстрами ведомый только инстинктами»</p></div>\n<p>Позже, в подробном описании ритуала (2025-03-13, id 301807), цифры другие и считаются иначе: без проводника с чистой душой шанс удачного поглощения «составляет 0%», а с проводником-Антоном «мой шанс подрастёт на 8%». Как это соотносится с семью процентами от 2025-03-10, в переписке не сказано.</p>\n<p><strong>Ритуал становления</strong> (2025-03-13, id 301806–301807; см. <a href=\"SP-0198.html\">Ритуал становления Арбетаром</a>). Материалы: один благословенный, пара чужемирцев, альфа и проводник. Роли расписаны словами старика:</p>\n<div class=\"q\"><p>«я использую мозг благословенного, чтобы он начал собирать силу. И тело Альфы дабы он его пресовал. А всё остальные компоненты служат активаторами. И после того как вся это сила от прессуется она пройдёт через тебя. Нет. Точнее ты станешь для неё сосудом. Она будет накапливаться в тебе. Пока выдерживает твоей тела. А после твоя душа покроет эту силу. Сделав еë более безопасная для меня.»</p></div>\n<p>Требования к проводнику: чистая душа «где-то на 80% плюс минус». Обычная практика класса — «Для этого всё арбетаты чаще всего используют детей лет от 3 до 12, где-то». Взрослый проводник лучше при прочих равных: «Как никак через тело и душу ребёнка проходить мало силы, а вот через тебя. Со взрослым телом и крепкой душой пройдёт куда больше силы.» Отсюда расчёт старика: «Я наверное буду сильнейшем арбетатом в этом поколения, если используя тебя.»</p>\n<p>Обстановка обряда (id 301807): центр деревни, кровь на траве, символика, мозг на алтаре, в центре — тело «какой-то анатомический неправильной»; в ходе обряда идёт искажение воздуха «как на кастром», но без огня и тепла, мозг светится и шевелится, тело в центре начинает двигаться «Словно зарядом тока его бьют».</p>\n<p><strong>Состояние сразу после ритуала</strong> (2025-03-14, id 302378), от первого лица:</p>\n<div class=\"q\"><p>«Вся та сила, которую я получил от ритуала. Она большая и мощная. Могущественная. Я чувствую, что могу свернуть горы. Что я словно бедствия природы, который обычным людям ни за что не остановить. Но признаться честно. Сила ещё не сформировалась. И использовать еë кроме как для усиления или пару простых заклинаний, можно только было. Да и плюсом моё тело ещё не до конца адаптировалась к новой силе.»</p></div>\n<p>Дальше по бою вскрываются рабочие ограничения свежего арбетара: он собирает энергию в ладонь и материализует её «в сгусток темноты», которым бросается; обнаруживает, «что не способен использовать усиления и защиту энергий одновременно»; вливает в руку «куда больше энергий, чем она могла выдержать»; чтобы разорвать дистанцию, «собрав энергию. Я взрываю еë внутри меня».</p>", "r": [["Ритуал становления Арбетаром", "SP-0198.html"]]}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0017-S04", "GR-0017--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p><strong>Арбетар и альфа.</strong> Это единственное различие, названное прямо (2025-05-31, id 331636): «в первом случае это люди из кильке, а во втором это чужемирцы». В остальном — одни и те же существа. Заметка к группе повторяет это же: арбетар — из Кильки, альфа — чужемирец, в остальном одно и то же.</p>\n<p><strong>Уникальная способность.</strong> У каждого своя, даже при одном и том же захваченном куске силы (2025-05-31, id 331636).</p>\n<p><strong>Сила поколения.</strong> Старик считает, что качество проводника определяет итоговую мощь: с 89-процентно чистой душой взрослого он рассчитывает стать «сильнейшем арбетатом в этом поколения» (2025-03-13, id 301806). То есть арбетары различаются по силе, и различие закладывается на ритуале.</p>\n<p><strong>Обученность.</strong> Свежий арбетар и старый арбетар — разные вещи. Старик после ритуала не умеет пользоваться силой («я ещё не научился пользоваться силю», id 301807), тело не адаптировано, и это прямо приводит к проигрышу. Его собственный учитель за 50 лет «слегка лишь поседев» — то есть у старых арбетаров сила уже освоена и старение замедлено.</p>", "r": []}, {"t": "Иерархия", "a": ["S05", "GR-0017-S05", "GR-0017--ierarhiya"], "h": "<p>Формальной иерархии, званий или организации у арбетаров в переписке нет. Единственная зафиксированная структура — <strong>учитель и ученик</strong>, и она наследуется по одной и той же схеме (2025-03-13, id 301805–301806):</p>\n<p>Арбетар приходит в деревню, крушит её и поглощает жизни. Среди жертв замечает того, кто сопротивляется: «увидил он в его глазах желания жить. И решил он сделать из него своего ученика». Мотив взятия ученика назван прямо — «Ведь он стар, хоть души людей и питательные, но на них вечность прожить не выйдет».</p>\n<p>Содержание ученичества: «И начал он его гонять. Принести то, убить того, сожрать это, защитить того, провести ритуал. И так далее. И жил он так 50 годков.»</p>\n<p>Завершение: «И только тогда, учитель рассказал ему про способ стать Арбетаром. И кинул его в свободное плавание.» То есть способ становления арбетаром — знание, передаваемое учителем в конце обучения, а не в начале; дальше ученик собирает материалы и проводит ритуал сам.</p>\n<p>Учитель старика в переписке существует только как фигура прошлого — что с ним стало, не сказано. Отношений между действующими арбетарами (были ли они знакомы, конкурировали, объединялись) в переписке нет.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S06", "GR-0017-S06", "GR-0017--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>Благословенные.</strong> Арбетары их презирают. Монолог старика (2025-03-13, id 301806):</p>\n<div class=\"q\"><p>«Ведь по правде говоря вся их сила, и не их вообще. Жалкий благословенный получивший силу лишь потому что понравились правителем, но сами они эту силу не добывали. Лишь мелкий пизжоны.»</p></div>\n<p>Практически благословенные — расходный материал ритуала и лёгкая добыча: «благословенный не могут использовать благословенния долга, поэтому можно просто неожидано напасть и убить и всё».</p>\n<p><strong>Апостолы.</strong> Названы главным объектом ненависти. На вопрос, кого из благословенных он ненавидит больше всех:</p>\n<div class=\"q\"><p>«нет не знаешь, Апостолов. Эти апостолы не пойми кем себя возомнили и везде понаставили свои порядки, на чужой силе»</p></div>\n<p>При этом старик признаёт их работу: «не могу не признать, что свою работу они выполняють слишком идеально. Ну даже в идеальной системе есть единичные пробои.» Практическая сторона: он ждал, «пока какой-нибудь апостол упустить альфю. При этом доведя его до полусмерти» — то есть добыл тело альфы, подобрав то, что не добили апостолы. Тест-драйв силы на апостолах он себе запрещает: «Ну уж точно не с апостолами. С ними ещё рано.»</p>\n<p>С другой стороны, апостол Дмитрий Рутковский по прозвищу «Агрегат» именно засёк всплеск энергии от обряда: «Именно я засек, огромный сплеск энергии, и обнаружив в деревню и твоё тело» (id 301808). Апостолы, таким образом, реагируют на арбетарские ритуалы.</p>\n<p><strong>Альфы.</strong> Двойственно. По статусу это одно и то же (2025-05-31), а по сюжету 2025-03-13 альфа — самый труднодобываемый материал ритуала, и причина названа именно через сходство:</p>\n<div class=\"q\"><p>«Ведь у альфа и арбетатов похожий силый. Они как и мы может использовать свою силу 24/7 без риска повредить мозг. А если сила всегда активна и его защищает, то просто неожиданная атака, на нём не проканает»</p></div>\n<p><strong>Чужемирцы.</strong> Тоже материал ритуала, по сложности — между благословенным и альфой: «Сложнее было убить чужемирцов. Ну это так цветочки.»</p>\n<p><strong>Защитник.</strong> Единственный показанный бой арбетара — против Защитника (Александра Лукашенко), 2025-03-14, id 302378–302380. Старик выбирает его как мишень для проверки силы: «Аа точно, защитник. Недавно появившаяся охотник за чужемирцами. Он вроде бы сильный. Будет не плохим манекеном для проверки мой новый силы» (id 301807). Бой арбетар проигрывает, спасается за счёт вмешательства Пустынника и обмана про тела жены и дочери Защитника, и заканчивает выводом: «Я должен стать сильней, чтобы защитить себя. Я должен восстановиться и начать тренировки. Больше не каких тест-драйвов.» Отдельно эта история подписана автором как «битва Защитника и арбетара» (2025-05-15, id 326309); текст самой истории лежит в другом месте архива.</p>\n<p><strong>Одержимые и демоны</strong> (2025-09-12, окно w0104, вселенная в этом окне не объявлена). Одержимый объявлен аналогом арбетара:</p>\n<div class=\"q\"><p>«Одержимый это аналог Арбетара ( я даже в иногда буду называть их так) то есть у него такие же силы. Но ему не надо обучаться. Он сразу сильный.»</p></div>\n<p>Различие с арбетаром здесь именно в обучении — арбетар обязан учиться, одержимый сразу силён. Через полчаса Слава сам себя поправляет (id 364797): «Плюсом арбетары. Точнее демоны не могут попасть в наш мир. Точнее могут но там надо какой-нибудь сложный обряд придумать. Демоны в разы сильнее одержимых.» Одно ли это и то же — арбетары и демоны — из правки не следует, и в окне не выясняется.</p>\n<p><strong>Апостолы-насекомые новой вселенной</strong> (2025-10-03, id 370732). Арбетар здесь работает как образец для сравнения: «И они как арбетары. Если сжечь лес он будет гореть не переставая. То есть их ний силы постоянные ( конечно с некоторыми условностями) но они могут сами вырубить огонь.» Отличие от арбетаров названо в скобках: апостолы огонь вырубить могут, а у арбетаров «нету такого понятия, как отключения».</p>\n<p><strong>Протобионты.</strong> Упомянуты вместе с арбетарами как то, что улавливает сенсорика благословенного: «сенсорика ( позволяет ощущать других благослрвенных и арбетара или Протобионтов)» (2025-10-18, id 375849). Больше про эту связь ничего.</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S07", "GR-0017-S07", "GR-0017--kak-menyalas"], "h": "<p><strong>2025-03-10 (id 300882–300921).</strong> Введение класса. Слава выстраивает цепочку: благословенные → чужемирцы → альфы → арбетары. Альфы описаны как «субъекты своего мира, который смогли сцапать кусочек силы своего мира, с помощью ритуала или ещё чего»; из этого выводятся арбетары — то же самое, но люди. Сразу же назначена цена: 7 процентов выживания, отторжение с сумасшествием, гниением, взрывом или превращением в монстра «ведомый только инстинктами». Автор помечает степень готовности: «Идея ещё не до конца доработана так как я еë только сегодня придумал, ну давай доебись я хочу понять где я не прав» (id 300918). Миколай отвечает: «ты прав, по идее пока претензий нету» и «мне всё нравится» (id 300920–300921). Тут же обещана следующая история — «Моя следующая история, о том как они это делают» (id 300912).</p>\n<p><strong>2025-03-13 (id 301805–301824, повтор полной версии — id 301820–301824).</strong> Обещанная история выложена. Появляются: шведское происхождение названия («трудяга»), поведение в деревне, механика ученичества, полный состав ритуала, требования к проводнику, ненависть к апостолам, тактика убийства благословенного/чужемирца/альфы, картина обряда в центре деревни Лихой. Деревня Ливия (родная деревня старика, ближе к Санкт-Петербургу) — уничтожена его будущим учителем. На вопрос Миколая о географии (id 301840) Слава отвечает: «В Росси» (id 301846).</p>\n<p>В этом же окне обозначено, что дальше: «О встречи старика и защитника / Старик же в конце сказал, что хочет провести тест-драйв» (id 301927), с задачей для автора — «В этой истории я хочу сделать упор на драку. Ведь у меня всё развивается диалоги, описание персонажи, сюжет, а вот описание драки полная говно» (id 301935).</p>\n<p><strong>2025-03-14 (id 302378–302380).</strong> Бой выложен. Появляется рабочая картина «свежего» арбетара: сила не сформирована, тело не адаптировано, усиление и защита не совмещаются, приёмы — сгусток темноты и взрыв энергии внутри себя. Итог боя — поражение и решение тренироваться.</p>\n<p>В этом же окне (id 302582–302584) Миколай уточняет: «в истории защитника рассказчик чужемирец?» — Слава подтверждает: «Да». То есть рассказчик-арбетар назван чужемирцем, хотя арбетар определялся как человек. В базе помечено, что тождество рассказчика «Битвы» и старика из истории про Антошу прямо в окне не сказано и читается по контексту.</p>\n<p>Тогда же (id 302863) арбетары названы центральной идеей истории «Антоша»: «Антоша. Идея раскрыть Арбетаров». И тогда же (id 302836) Слава перечисляет свой состав персонажей: «два мститель, нече не помниший апостол, и один с ушедший с ума чужемирец».</p>\n<p><strong>2025-05-10 (id 324541).</strong> Рабочий перечень категорий сил, шесть строк, арбетары и альфы стоят отдельными строками:</p>\n<div class=\"q\"><p>«Благословенный<br>Арбетары<br>Альфы<br>Чужемирцы<br>Владельцы артефактов<br>Фантазёры»</p></div>\n<p><strong>2025-05-15 (id 326309).</strong> История опознана и подписана: «А ну о битве Защитника и арбетара».</p>\n<p><strong>2025-05-31 (id 331636).</strong> Самая полная выкладка по классу. Арбетары и альфы сведены в одно: «одни те же существа», различие только в происхождении (килька / чужемирцы). Здесь же — четыре базовых умения, регенерация выше благословенских, уникальная способность формируется «подобно апостолом», отсутствие понятия отключения, обязательность обучения, неспособность раскрыть мощь артефакта. Ритуал вырывания куска силы помечен как недоработанный прямо в тексте: «с помощью ритуала??? Которой я ещё не доработал».</p>\n<p><strong>2025-08-30 (id 359697–359711).</strong> Перечень сил мира сокращён до трёх строк, и арбетары с альфами теперь одна строка:</p>\n<div class=\"q\"><p>«Благословенный<br>Арбетаров и Альфы<br>Творцы ( фантазёры)»</p></div>\n<p>Перечень собирался ради подсчёта: новая сила будет четвёртой (id 359707).</p>\n<p><strong>2025-09-12 (id 364766, 364797), окно с необъявленной вселенной.</strong> Арбетар используется как мерка для нового класса — одержимых: «Одержимый это аналог Арбетара ( я даже в иногда буду называть их так)». Отличие: одержимому не надо обучаться. Следом автор поправляет себя, переходя с арбетаров на демонов и оговаривая, что попасть в мир напрямую они не могут, нужен «какой-нибудь сложный обряд», который ещё не придуман.</p>\n<p><strong>2025-09-17 (id 366037–366039, 366097–366098, 366200–366203).</strong> Три подхода за один день, все три без результата.</p>\n<p>Первый — заявка: «Также хочу добавить арбетаров как тёмных магов», сразу с оговоркой «Ну сначала надо с этим разобраться». В том же сообщении отклонены другие сущности: «Артефактов и творцов точно не будет».</p>\n<p>Второй — арбетары названы единственным возможным исключением из полного запрета на энергию: «И ещё без ауры или энергии. Вообще без них. Ну не считая апбетаров (ну о нем я ещё думаю».</p>\n<p>Третий — прямой вопрос Миколаю: «Вот только что с арбетарами делать» / «?». Ответ Миколая — «читаю пока чтобы понял что ты сделал вообще» (id 366203). Решения в окне не появляется; содержания у ярлыка «тёмные маги» тоже.</p>\n<p><strong>2025-10-03 (id 370732).</strong> Арбетар работает как уже известный термин: постоянно действующая сила апостолов-насекомых объяснена через сравнение с арбетарами.</p>\n<p><strong>2025-10-18 (id 375849).</strong> Второе использование как известного термина: в перечне четырёх способностей благословенных сенсорика описана как то, что «позволяет ощущать других благослрвенных и арбетара или Протобионтов». Пояснения, кто такие арбетары, в окне нет.</p>", "r": []}, {"t": "Отклонённые и незакрытые варианты", "a": ["S08", "GR-0017-S08", "GR-0017--otklonennye-i-nezakrytye-varianty"], "h": "<ul>\n<li><strong>Арбетары как тёмные маги</strong> (2025-09-17, id 366037). Заявлено, не отклонено, но и не наполнено — за три подхода того же дня содержания у ярлыка так и не появилось.</li>\n<li><strong>Арбетары как единственное исключение из запрета на энергию</strong> (2025-09-17, id 366097). Оставлено в состоянии «ну о нем я ещё думаю».</li>\n<li><strong>Артефакты и творцы</strong> (2025-09-17, id 366039) — отклонены прямо: «Артефактов и творцов точно не будет». Это соседнее решение того же окна; арбетаров оно не касается напрямую, но задаёт, от чего в тот момент отказывались.</li>\n<li><strong>Ритуал вырывания куска силы</strong> — на 2025-05-31 помечен самим автором вопросительными знаками как недоработанный, хотя конкретный ритуал старика был расписан ещё 2025-03-13.</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S09", "GR-0017-S09", "GR-0017--probely"], "h": "<div class=\"gaps\"><ul>\n<li><strong>Поимённого состава нет.</strong> Назван один арбетар, и тот без имени — «старик», «дед». Сколько арбетаров в мире, есть ли между ними связи, знают ли они друг о друге — в переписке не сказано.</li>\n<li><strong>Организации нет.</strong> У благословенных и одержимых организации названы прямо; у арбетаров ничего подобного не упоминается.</li>\n<li><strong>Числа не сведены.</strong> 7 процентов выживания (2025-03-10) и 0 процентов без проводника / +8 процентов с проводником (2025-03-13) в переписке между собой не соотнесены.</li>\n<li><strong>Человек или чужемирец.</strong> Определение говорит: арбетар — человек, альфа — чужемирец. Рассказчика истории про Защитника Слава подтверждает как чужемирца (2025-03-14, id 302584). Противоречие в переписке не обсуждается.</li>\n<li><strong>Статус Антона.</strong> Вопрос Миколая «он тоже арбетар пусть и слабый?» (2025-03-13, id 301879) остался без ответа.</li>\n<li><strong>Арбетары и демоны.</strong> После самопоправки 2025-09-12 (id 364797) непонятно, одно это и то же или разное; в окне не выясняется.</li>\n<li><strong>«Тёмные маги» — только ярлык.</strong> Что именно арбетары делают как тёмные маги, не сказано; прямой вопрос «что с арбетарами делать» (2025-09-17, id 366200) остался нерешённым.</li>\n<li><strong>Судьба учителя</strong> старика не названа. Что стало с ним после того, как он «кинул его в свободное плавание», в переписке нет.</li>\n<li><strong>Судьба старика после проигрыша</strong> Защитнику не показана; он уходит с Пустынником и решает тренироваться, дальше о нём в этих окнах ничего.</li>\n<li><strong>Кто такой Пустынник</strong> и почему он спасает арбетара — в переписке не объяснено; названо только, что он благословенный и что сила у него связана с кровью.</li>\n<li><strong>Как арбетар «делает из людей чудищ»</strong> — механика не описана, есть только сам факт и сравнение «словно из картины шизофриника».</li>\n<li><strong>Что происходит с проводником в норме</strong> — из ритуала известен только случай Антона, выжившего за счёт второй души в теле. Обычный исход для проводника не назван.</li>\n<li><strong>Окна w0104–w0106 (сентябрь–октябрь 2025) идут с необъявленной вселенной.</strong> Относятся ли эти упоминания арбетаров к той же вселенной «Апостол» или к перезапуску, в переписке не оговорено.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0017--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0220.html\">Арбетар</a>, <a href=\"PS-0224.html\">Старик-арбетар</a></li>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0198.html\">Ритуал становления Арбетаром</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0017--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0017.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0017-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0017/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Главная проблема тут не в том, чего нет, а в том, что одно и то же расписано в шести местах, и ссылки на класс размазаны по ним поштучно.</p>\n<p>Про арбетаров в базе лежит: <code>PS-0220</code> — 38 531 знак, одна ссылка; <code>PS-0226</code> — 20 681, две ссылки; <code>PS-0281</code> — 7 646, три ссылки; <code>MR-0106</code> — 28 881, две ссылки; плюс <code>SP-0198</code> (48 879) и <code>PS-0224</code> (90 651). Ни одна из этих записей не собирает на себя больше трёх ссылок, а суммарно под классом почти 235 килобайт. Пока они не сведены, любая соседняя статья ссылается на случайную треть материала.</p>\n<p>Рядом то же самое с человеком: <code>PS-0182</code> «Агрегат» — пять ссылок (больше всех в наборе), статья 14 119, база 13 777; <code>PS-0223</code> «Дмитрий Рутковский („Агрегат“)» — две ссылки, статья 15 362, база 21 902. Это одна фигура на двух карточках, и ссылки поделены 5 к 2. Чинить первым стоит именно расхождения такого рода: они дешевле в работе и снимают больше, чем любая ненаписанная биография.</p>\n<p>Из того, чего действительно нет: <code>SL-0051</code> и <code>SL-0053</code> — по шесть ссылок каждый, статьи нет, база 9 834 и 20 313. Перечень категорий сил <code>SL-0089</code>, на который статья опирается датой 2025-05-10, — четыре ссылки, статьи нет, база 1 753.</p>\n<h3>С чего начать</h3>\n<p>В базе. Сначала сведение: <code>PS-0220</code> / <code>PS-0226</code> / <code>PS-0281</code> / <code>MR-0106</code> — решить, что из этого одна запись, и куда сходятся ссылки. Тем же приёмом <code>PS-0182</code> и <code>PS-0223</code>.</p>\n<p>Отдельно — <code>SP-0199</code> «Проводник (чистая душа)»: 39 325 знаков базы и ноль ссылок. Пробел «что происходит с проводником в норме» может закрываться прямо оттуда, статья про арбетаров на эту запись просто не смотрит. Так же и с числами: 7 процентов (2025-03-10) и 0 / +8 (2025-03-13) лежат в разных записях, соотнести их можно, не выходя из базы.</p>\n<p>В архив — за двумя окнами. 2025-09-17, id 366037–366203: три подхода за день, «тёмные маги», исключение из запрета на энергию и прямой вопрос «что с арбетарами делать» — искать надо не эти сообщения, а то, что шло между ними и после, в тот же вечер. И окна w0104–w0106 (2025-09-12 — 2025-10-18) с необъявленной вселенной: пока не решено, «Апостол» это или перезапуск, три поздних упоминания арбетаров висят без адреса.</p>\n<h3>Как развивалось</h3>\n<p>2025-03-10 — вывели из альф одним рассуждением, тут же назначили цену (7 процентов) и сами пометили как недоделанное. 2025-03-13/14 — за трое суток выдали всё: происхождение названия, ученичество, полный ритуал, бой, состояние свежего арбетара. 2025-05-31 — свели с альфами в одно. Дальше класс перестаёт быть предметом разработки: 2025-09-12 через него объясняют одержимых, 2025-10-03 — апостолов-насекомых, 2025-10-18 он просто стоит в перечне того, что ловит сенсорика. 2025-09-17 — единственная попытка вернуться к нему как к предмету, и она обрывается на вопросе без ответа.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для арбетара цена входа названа в числах и в исходах: 7 процентов выживания, отторжение, сумасшествие, гниение, взрыв, превращение в монстра; без проводника — 0 процентов. Одержимый объявлен аналогом арбетара с теми же силами и с единственным отличием «ему не надо обучаться». Цена входа для одержимого не названа никакая: ни ритуала, ни шанса, ни проводника, ни того, чем он платит вместо обучения. Правило есть у одной половины пары и отсутствует у второй, при том что пару составил сам автор.</p>\n<h3>Отклик</h3>\n<p>Зацепило название. Класс, который весь построен на презрении к благословенным за то, что «сами они эту силу не добывали», назван словом «трудяга» — и это не ирония автора, а внутренняя логика: у них добыто, а не подарено. Весь спор класса с миром уложен в одно слово, и оно шведское, что добавляет ровно ту степень необъяснимости, которая тут работает. Второе сильное — устройство ученичества: способ стать арбетаром сообщают в конце пятидесяти лет, а не в начале, и после этого «кинул его в свободное плавание». Учитель, который берёт ученика, потому что стареет и душами вечность не проживёшь, а потом отдаёт ему инструкцию и отпускает, — это цикл, у которого видно и мотив, и срок. Слабее всего то, что весь класс держится на одном показанном экземпляре, и тот проигрывает свой единственный бой.</p></div>", "r": []}];</script>
