<script>const BASE="";const DOCNAME="Сверхлюди (люди с сосудом)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0042-S01", "GR-0042--chto-eto"], "h": "<p>«Сверхлюди» — термин из переписки Миколая и Славы по вселенной «монстры»: Слава пишет «секты который выращивают сверх людей ( то бишь с сосудом)» (2024-11-17, id 259085). Это не организация и не отряд, а класс носителей силы: все, у кого есть сосуд. Общего имени у класса в переписке нет, слово «сверхлюди» появляется только внутри описания мира и всегда в связке с сосудом.</p>\n<p>Отличие от обычного человека проведено прямо: «В этом мире каждый владеет энергий ( без структуры) просто энергий Но рождаются те кто имеет сосуд , который позволяет накапливать энергий» (2024-11-17, id 258985). То есть энергия есть у всех, сосуд — не у всех, и именно сосуд делает человека сверхчеловеком.</p>\n<p>Внутри класса отдельно выделено подмножество — «сбежавшие сверхлюди»: те, кого секты вырастили и кто от них ушёл. За ними охотятся (2024-11-17, id 259085–259087).</p>\n<p>Поимённо в переписке назван один носитель — владелец «Чёрного ящика». Остальные существуют как масса: «секты», «свои сверхлюди», «они». Списка нет.</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0042-S02", "GR-0042--sostav"], "h": "<ul>\n<li><a href=\"PS-0169.html\">Владелец чёрного ящика</a> — Владелец чёрного ящика. Единственный названный представитель класса. Имени у него в переписке нет, есть только способность и одна биографическая деталь: «Владелец черного ящика тоже сбежал из секты» (2024-11-17, id 259086).</li>\n</ul>\n<p>Больше никто поимённо не назван. Ни численность класса, ни численность сбежавших в переписке не обсуждались.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Третье — перекос по единственному названному носителю. У <code>PS-0169</code> (Владелец чёрного ящика) базы 2,5 КБ, а у предмета в его руках, <code>SP-0120</code> («Чёрный ящик»), — 55 КБ и четыре ссылки в трёх вселенных. Артефакт разработан примерно в двадцать раз плотнее человека, который его носит, и именно поэтому раздел «Состав» состоит из одной строки.</p></div>", "r": [["Владелец чёрного ящика", "PS-0169.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0042-S03", "GR-0042--obschie-sposobnosti-gruppy"], "h": "<p>Механику Слава излагает 2024-11-17 (id 258978–258985) — по его собственным словам, повторно, потому что Миколай не помнит («ты помнишь концепт силы?» — «я короче не помню»). Оригинальное изложение осталось где-то раньше в архиве, в этих файлах его нет.</p>\n<p>Состояние на 2024-11-17 (id 258985), дословно:</p>\n<div class=\"q\"><p>«В этом мире каждый владеет энергий ( без структуры) просто энергий<br>Но рождаются те кто имеет сосуд , который позволяет накапливать энергий, и так энергия накапливается самого рождения и создаёт свою уникальную структуру( то бишь способность) это может зависеть от всего от психологического состояния ребенка, от сосуда, от среды, и т.п.<br>Сосуд ещё можно качать<br>Как и объем и контроль структурной энергий<br>Энергий становится структурной примерно в 7 лет<br>Энергий не просто накапливается, типо если её слишком много сосуд выпускают ту которую не может удержать»</p></div>\n<p>Разложенное по пунктам, всё — из этой цитаты:</p>\n<ul>\n<li>Сосуд есть с рождения и копит энергию с рождения.</li>\n<li>Накопленная энергия сама складывается в уникальную структуру. Структура — это и есть способность.</li>\n<li>От чего зависит структура: психологическое состояние ребёнка, сосуд, среда, «и т.п.». Список открытый, полностью не закрыт.</li>\n<li>Энергия становится структурной примерно в 7 лет.</li>\n<li>Излишек, который сосуд не может удержать, он выпускает наружу.</li>\n<li>Качать можно: сам сосуд, объём структурной энергии, контроль структурной энергии.</li>\n</ul>\n<p>Способность — это структура. Так это уточнено в разборе «Чёрного ящика»: «Черный ящик это структура И черный ящик поверх свой структуры образует хранящую внутри него структуру» (2024-11-17, id 258997). То есть отдельная способность и структура — одно и то же, и структуры могут вкладываться друг в друга.</p>\n<p>Отдельно зафиксирован механизм восполнения сосуда — через структуру, собирающую энергию. Миколай проговаривает его на примере Кристала: «кристал собирает энергию / это одна из структур / и она может быть в ящике / восполняет сосуд» (2024-11-17, id 259002–259005). Сам Слава тут же называет это «чит код» (id 259010), Миколай отвечает «не по сути да» — вопрос балансировки поглощения энергии остался нерешённым.</p>", "r": []}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0042-S04", "GR-0042--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p><strong>Уровень.</strong> Прямая формулировка про сбежавших сверхлюдей: «И все они по уровню друг другу разный» (2024-11-17, id 259087). Шкалы уровней, ступеней или названий рангов в переписке нет.</p>\n<p><strong>Структура у каждого своя.</strong> Уникальность структуры заложена в самом законе: она «уникальная», её определяют психика ребёнка, сосуд и среда. Двух одинаковых сверхлюдей механика не предполагает.</p>\n<p><strong>Способность — результат опыта, а не выдача извне.</strong> Миколай отдельно оговаривает это 2024-11-30: «я тогда забыл то что не просто кто-то пишет способность а это результат опыта» (id 263728).</p>\n<p><strong>Семья с наследственной структурой.</strong> 2024-11-30 (id 263727) Миколай вводит подмножество, отличающееся от всех прочих носителей сосуда. Его слова:</p>\n<div class=\"q\"><p>«а в этой семье такая особенность, у них есть структура наследственная, с механизмом упрощающим этот процесс, которых для других невозможен изв сложности. они в течении 2 дней могут давить в определённую точку для изменения агрегатного состояния структуры способности. расплавив они лишаются структуры способности и по сути становятся как новорождённые.»</p></div>\n<p>Что из этого следует по тексту:</p>\n<ul>\n<li>Обычный сверхчеловек свою структуру сменить не может. Причина — сложность процесса, а не запрет: «поэтому никто из людей не может менять свою структуру, это невероятно сложно».</li>\n<li>Члены семьи могут: два дня давления в определённую точку меняют агрегатное состояние структуры.</li>\n<li>Расплавив структуру, член семьи лишается способности и становится «как новорождённые».</li>\n<li>Второе отличие — затравка. «даже если другие расплавят этот кристал они не создадут его заново не за что ибо для формирования нужна так называемая затравка. при рождении она появляется и благодаря ней появляется возможность кристаллизовать энергию через опыт. так вот у этой семьи наследственная структура имеет возможность создать искусственно затравку.» Затравка есть у всех от рождения, но повторно её умеет создать только семья.</li>\n<li>Цена: «для кристаллизации новой структуры им нужно то же время что и с момента рождения и она также будет неразвита».</li>\n<li>Компенсация: «детский опыт довольно мистический, но не всегда сильный, в осознанном возрасте они могут пройти традиционное семейное обучение 2 года, а после развиваться так как пожелают, что позволит создать способности намного сложнее тех что появляются с рождения» (2024-11-30, id 263734).</li>\n</ul>\n<p>Миколай тут же ставит рамку по силе: «и ваще не хочу я делать их имбалансными. это обычные люди со способностями, не обязательно семейники самые сильные, это нечестно, но обычные не могут менять способность и обречены жить с тем что есть, а вот моя семья способна изменить на более привлекательную и крутую в основном возрасте» (id 263734). То есть преимущество семьи — не в силе, а в сменяемости структуры.</p>\n<p>Насколько велик разброс внутри самой семьи, не решено: «у разных членов семьи разное допущение с разными параметрами поиграть может будет» (id 263727) — как именно, не обсуждалось. Слава на всю выкладку в этих файлах не отвечает; Миколай заканчивает вопросом «че думаешь?» (id 263735).</p>\n<p><strong>Владелец «Чёрного ящика».</strong> Его структура устроена иначе прочих: она хранит внутри себя другие структуры, «В черном ящики может хранится фиг знает сколько структур» (2024-11-17, id 258997). Механика выдачи на 2024-11-17 (id 258924–258948): владелец создаёт чёрное оружие и броню либо чёрный кубик любого размера; открыв кубик, получает способность (управление огнём, молниями, суперскорость и т.п.); форму владельца это не меняет — «как Омнитрикс ( из Бен 10) только он не изменяет форму владельца а просто даёт способность». За раз носится одна способность, выпадает она случайно, держится «10 минут +-», следующую можно достать только после исчезновения текущей.</p>", "r": []}, {"t": "Иерархия", "a": ["S05", "GR-0042-S05", "GR-0042--ierarhiya"], "h": "<p>Внутри класса сверхлюдей иерархии не описано. Есть только заявление о разнице уровней между сбежавшими (id 259087) и отсутствие ранговой шкалы.</p>\n<p>Ранжирование обсуждалось, но применительно к способностям, выпадающим из «Чёрного ящика», а не к самим сверхлюдям. Миколай предложил градацию «уникальные, редкие обычные эпичные» и привязку ранга к шансу выпадения (2024-11-17, id 258926–258937). Слава отверг: «Нет, каждая способность по своему полезная в разных ситуациях», затем на довод про шанс выпадения — «Нет / Нету». Миколай повторил предложение позже, оттолкнувшись от читовости поглощения энергии: «поэтому систему ранжирования можно сделать» (id 259016) — ответа не последовало.</p>\n<p>Управляющая структура над сверхлюдьми в мире — секты, но они состоят не из сверхлюдей, а выращивают их. Отношения «секта — сверхчеловек» описаны как владение и охота, а не как ступени внутри одной группы.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S06", "GR-0042-S06", "GR-0042--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>Секты.</strong> Основной контрагент класса. Описание мира (2024-11-17, id 259085):</p>\n<div class=\"q\"><p>«Обычный современный мир где все хорошо, но там существует секты который выращивают сверх людей ( то бишь с сосудом) и вот сейчас происходит война сект, и сект в данный момент пытаются либо вернуть либу убить своих сверх людей который от них сбежали чтобы при случай чего не было ножа в спину»</p></div>\n<p>Уточнение по способу набора — на прямой вопрос Миколая, «типа обычным людям встраивают сосуд или детей с сосудом развивают или че» (id 259088), Слава отвечает: «Детей с сосудом находят и выращивают» (id 259089). Вариант со встраиванием сосуда обычному человеку, таким образом, не принят — он был назван Миколаем как вопрос и отклонён ответом.</p>\n<p>Секты между собой в состоянии войны. Мотив охоты за беглецами назван прямо: «чтобы при случай чего не было ножа в спину».</p>\n<p><strong>Сбежавшие сверхлюди как подмножество.</strong> Они противопоставлены сектам, но не описаны как объединение между собой. Есть ли у них связи, союзы, общая сторона — в переписке не сказано. Владелец «Чёрного ящика» отнесён к ним: «тоже сбежал из секты».</p>\n<p><strong>Семья с наследственной структурой</strong> (2024-11-30) вводится как отдельное явление внутри мира. Связана ли она с сектами, была ли она их объектом охоты, входят ли её члены в число сбежавших — в переписке не сказано.</p>\n<p><strong>«Сосудники» (<a href=\"GR-0032.html\">Сосудники</a>) из вселенной «7 островов»</strong> отмечены как класс с той же механикой сосуда и структуры. Это сопоставление из карточки справочника; в самой переписке двух вселенных Миколай и Слава не связывают.</p>", "r": [["Сосудники", "GR-0032.html"]]}, {"t": "Как менялась — по датам", "a": ["S07", "GR-0042-S07", "GR-0042--kak-menyalas"], "h": "<p><strong>2024-11-17, id 258978–258985.</strong> Слава заново излагает «концепт силы» — по его же словам, это повтор ранее обсуждавшейся мысли, оригинал в этих материалах отсутствует. Состояние: энергия у всех, сосуд у избранных, структура складывается сама, порог — 7 лет, излишек выпускается, сосуд/объём/контроль качаются.</p>\n<p><strong>2024-11-17, id 258986–259005.</strong> Уточнение по запросу Миколая («как он может получать эти структуры», «они изначально есть в способности?»): способность и структура — одно и то же; структуры могут храниться внутри другой структуры; поглощающая энергию структура восполняет сосуд.</p>\n<p><strong>2024-11-17, id 259078–259092.</strong> Появляется мир, в котором класс живёт: современный мир, секты, война сект, охота на сбежавших. Источник замысла назван Славой прямо: «Я недавно смотрел анимацию боёв стикменов» и «там был маломальский сюжет» (id 259081–259082). Здесь же класс получает своё название — «сверх люди ( то бишь с сосудом)», и здесь же владелец «Чёрного ящика» становится беглецом.</p>\n<p><strong>2024-11-30, id 263717–263728.</strong> Миколай перекладывает ту же систему на другой язык, не отменяя старого: структуру Славы он раньше назвал кристаллами, и теперь строит на этом. Новое состояние: энергия в сосуде жидкая с рождения и всегда; до 7 лет часть её кристаллизуется; на кристалле записаны данные, отражённые в опыте, они и определяют способность. Аналогия, которой он это объясняет, — процессоры: «процессоры это монокристаллы и информацией и их не целесообразно и не практично плавить и кристализировать заново, после записывая информацию, проще чистое вещество взять». Отсюда выводится, почему обычные люди не меняют структуру. Тут же вводится затравка и семья с наследственной структурой. Пометка автора: деталь вспомнилась не сразу — «одну деталь ток щас вспомнил», «я думал типа всё умный, но вспомнил кое че».</p>\n<p><strong>2024-11-30, id 263733–263735.</strong> Дополнение про детский опыт («довольно мистический, но не всегда сильный»), про двухлетнее традиционное семейное обучение в осознанном возрасте и про то, что созданные позже способности могут быть сложнее врождённых. Плюс рамка баланса — семья не должна быть имбалансной.</p>\n<p>Двух состояний системы (изложение Славы от 2024-11-17 и кристаллическая версия Миколая от 2024-11-30) переписка не сводит воедино; ни одно из них не объявлено отменённым.</p>\n<p><strong>Отклонённое и отложенное</strong> (всё — 2024-11-17, вокруг «Чёрного ящика», то есть вокруг единственного названного носителя):</p>\n<ul>\n<li>Разбить набор способностей Пламенного на отдельные кубики — реген, управление огнём, сила, передвижение в земле (id 259060–259066). Слава отверг: «Нет типо разделять способности который изначально были вмести как глупо», и добавил: «Да и плюсом все по отдельности они какие то слабый». Миколай стоял на своём — «нет, всё вместе это чит», «слабые / но полезные». Не принято.</li>\n<li>Система ранжирования способностей (id 258926–258937 и повтор id 259010–259017) — отвергнута, см. раздел «Иерархия».</li>\n<li>Слабость «молния + вода»: Миколай предложил сделать правилом, что определённые сочетания стихий дебафают или отключают способность либо самого носителя (id 259049–259051). Слава: «Ну это потом». Отложено, к этому не вернулись.</li>\n<li>Стихийный набор как основа списка способностей: шесть стихий или четыре, если не считать тьму и свет; отдельный вопрос — «полёт это ветер или другое?» (id 258954–258963). Слава: «Не знаю». Разговор ушёл в сторону Бен 10, список не собран.</li>\n<li>Взять способности пришельцев Бен 10 целиком: «Вообще изначально я хотел просто взять всех пришельцев из Бен 10 и забрать их ний способность слегка изменив или соединив с другими» (id 258964). Проблему Слава называет сам: «я не могу реализовать способности пришельцев Бен 10 в черный ящик», «Раз соединять не хочу а вместе они не катят» (id 259107, 259111). Взамен Миколай дал ссылки на вики умений и сил как источник (id 259128–259139). Список так и не составлен.</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S08", "GR-0042-S08", "GR-0042--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет. Назван один носитель — <a href=\"PS-0169.html\">Владелец чёрного ящика</a>, владелец «Чёрного ящика», причём без имени.</li>\n<li>Численность класса, доля людей с сосудом в населении, численность сбежавших — не названы.</li>\n<li>Названия у класса как термина нет; «сверхлюди» — слово из фразы Славы, а не объявленное имя. Названия вселенной в чате тоже нет.</li>\n<li>Названия у самой системы силы нет; Слава называет её «концепт силы».</li>\n<li>Шкала уровней не введена, при том что разница уровней между беглецами заявлена.</li>\n<li>От чего ещё зависит структура, кроме психики, сосуда и среды, — список оставлен открытым («и т.п.»).</li>\n<li>Как именно качается сосуд, объём и контроль, — не описано.</li>\n<li>Названий, количества и устройства сект нет. Как секты находят детей с сосудом, не сказано; сказано только, что находят и выращивают.</li>\n<li>Состав и название семьи с наследственной структурой не даны, её место в мире сект не определено. Разброс параметров между членами семьи оставлен как незавершённое: «у разных членов семьи разное допущение с разными параметрами поиграть может будет».</li>\n<li>Реакции Славы на кристаллическую выкладку 2024-11-30 в этих материалах нет; вопрос Миколая «че думаешь?» остался без ответа.</li>\n<li>Проблема читовости структуры, поглощающей энергию и восполняющей сосуд, поднята («Это же чит код») и не решена.</li>\n<li>Списка способностей «Чёрного ящика» хотя бы на 20 позиций, о котором договаривались, не существует.</li>\n<li>Оригинальное, первое изложение «концепта силы» в материалы не попало — есть только повтор от 2024-11-17.</li>\n<li>После 2024-11-30 материала по классу нет. Название «Чёрный ящик» дальше встречается в других вселенных (в реестрах «Апостола» с 2025-01-24 и в разборе 2025-04-18 по «Нимбу», где это уже кочевой артефакт, записывающий данные вселенной), но с сосудом, структурой и сверхлюдьми там ничто не связано; переносил ли автор механику, в переписке не сказано.</li>\n</ul></div>", "r": [["Владелец чёрного ящика", "PS-0169.html"]]}, {"t": "Связи — всё вместе", "a": ["GR-0042--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0169.html\">Владелец чёрного ящика</a></li>\n<li><strong>Упоминает группы:</strong> <a href=\"GR-0032.html\">Сосудники</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0080.html\">Сверхлюди (Феня)</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0042--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0042.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0042-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0042/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Самая дорогая дыра здесь — не отсутствие поимённого состава, а секты. Они держат весь мир класса: охота, война, набор детей — всё через них. Запись под них есть (<code>GR-0041</code>, «Секты, выращивающие сверхлюдей»), но на неё ноль входящих ссылок, и эта статья, где секты разобраны как основной контрагент, на неё тоже не ссылается. Рядом <code>MR-0071</code> («Мир сект и сбежавших сверхлюдей») — четыре ссылки, база 3,5 КБ: то есть на устройство этого мира уже опираются четыре записи, а группа, которая его населяет, стоит в стороне.</p>\n<p>Второе: семья с наследственной структурой. Статья расписывает её на полстраницы и не ссылается ни на <code>PS-0170</code> («Семья», 13,6 КБ базы, две ссылки), ни на <code>GR-0040</code> («Семья», ноль ссылок). Самый объёмный кусок раздела «Чем участники отличаются» висит без опоры на записи, которые уже есть.</p>\n<p>Третье — перекос по единственному названному носителю. У <code>PS-0169</code> (Владелец чёрного ящика) базы 2,5 КБ, а у предмета в его руках, <code>SP-0120</code> («Чёрный ящик»), — 55 КБ и четыре ссылки в трёх вселенных. Артефакт разработан примерно в двадцать раз плотнее человека, который его носит, и именно поэтому раздел «Состав» состоит из одной строки.</p>\n<h3>С чего начать</h3>\n<p>В архив идти почти не за чем. Механика уже в базе, просто разъехалась по соседним записям: <code>MR-0070</code> («Энергия, сосуд и структура», 5,8 КБ, четыре ссылки), <code>MR-0072</code> («Три элемента: сосуд, тело, структура», 3,5 КБ), <code>SP-0122</code> («Изменение сосуда», 3,6 КБ), <code>SP-0123</code> («Резонанс сосуда и структуры», 2,9 КБ, три ссылки), <code>MR-0074</code> («Затравка», 4,7 КБ), <code>SP-0125</code> («Наследственный механизм смены структуры», 7,7 КБ). <code>SP-0123</code> в статье не упомянут вообще ни разу, хотя на него ссылаются три записи — проверить его надо первым: либо это часть той же механики и её место в разделе о способностях, либо это отдельная ветка, и тогда стоит понять, чья.</p>\n<p>В архив — ровно за одним: за первым изложением «концепта силы». Слава 2024-11-17 (id 258978) говорит о нём как о повторе, значит оригинал лежит раньше. Ориентир — окна до 2024-11-17, искать вокруг слов «сосуд», «структура», «концепт силы» и вокруг разбора «Чёрного ящика», потому что оба раза механику поднимали именно из-за него.</p>\n<p>Второе место для архива — после 2024-11-30. Реакции Славы на кристаллическую версию в материалах нет; вопрос «че думаешь?» повис. Стоит проверить, не пришёл ли ответ в следующем окне.</p>\n<h3>Как развивалось</h3>\n<p>2024-11-17 механику заявили целиком за один вечер: энергия у всех, сосуд у некоторых, структура складывается сама, порог 7 лет. В тот же вечер её начали ограничивать — но не изнутри, а отказами: ранжирование способностей отвергнуто дважды, дробление набора Пламенного отвергнуто, слабость «молния + вода» отложена репликой «Ну это потом», стихийный список не собран, перенос способностей из Бен 10 признан нереализуемым самим автором. Читовость структуры, восполняющей сосуд, названа тогда же и не закрыта.</p>\n<p>2024-11-30 вернулись — но другим человеком и другим языком: Миколай переложил ту же систему на кристаллы, вывел из процессорной аналогии запрет на смену структуры, ввёл затравку и семью. Старое при этом не отменено. Разговор оборвался на «че думаешь?». После 2024-11-30 материала по классу нет; название «Чёрный ящик» дальше живёт в других вселенных уже без сосуда и структуры.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Про смену структуры правило проведено дважды и оба раза чётко: обычный человек сменить не может (слишком сложно, аналогия с монокристаллом), член семьи может (два дня давления, расплав, новая затравка, цена — время с нуля). Для третьего случая, который тут же в статье и стоит, такого правила нет. Владелец «Чёрного ящика» носит структуру, внутри которой хранятся другие структуры, и достаёт их по одной раз в десять минут. Считается ли это сменой структуры, и если нет, то почему запрет, выведенный из невозможности переплавить монокристалл, на ящик не распространяется, — не проговорено. Для обычных названо, для семьи названо, для вложенных структур такого же рода — нет.</p>\n<h3>Отклик</h3>\n<p>Зацепила процессорная аналогия. Обычно такие вставки в мироустройство работают как украшение — тут наоборот: из «монокристаллы с записанной информацией нецелесообразно плавить и кристаллизовать заново, проще взять чистое вещество» напрямую вытекает запрет, почему человек не меняет свою способность. Не метафора поверх правила, а правило, выведенное из метафоры. И честная пометка рядом — «одну деталь ток щас вспомнил», «я думал типа всё умный, но вспомнил кое че» — показывает, что это не заготовка, а придумалось по ходу. Отдельно понравилось, что автор сам себе ставит рамку и объясняет её вслух: «не хочу я делать их имбалансными… обычные не могут менять способность и обречены жить с тем что есть». Преимущество семьи сдвинуто с силы на сменяемость — это редкий и осмысленный ход, и жаль, что он остался без ответа второго автора.</p></div>", "r": []}];</script>
