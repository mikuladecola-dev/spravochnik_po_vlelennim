<script>const BASE="";const DOCNAME="Секта Фалим";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0197-S01", "MR-0197--ustroystvo"], "h": "<p>Секта, поклоняющаяся Фатик «как богини в человеческом виде». Фатик — «желтоволосая девчушка», один из столпов злодеев, со способностями управления фотонами; она же «является главой секты». Больше об устройстве секты — иерархии, обрядах, численности, местонахождении — в переписке ничего нет.</p>\n<p>Название дано прямо в момент появления секты, отдельной вставкой в реплике: «давай назовём данную секту Фалим» (2026-06-03, id 487531). Других вариантов названия не предлагалось.</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0197-S02", "MR-0197--naselenie"], "h": "<p>Названы двое участников (точнее — один участник и предводительница):</p>\n<ul>\n<li>Фатик — глава секты, объект поклонения. За ней в той же реплике закреплён набор способностей: управление фотонами, зрительные иллюзии, «разукрасить мир в чёрное белые», может «сделать так что ты подумал что вы оказались во дворце», перемещение «на невероятной скорости», «мощные залпы энергии ( ну фотонов с массой, ну которые как бы нарушает законы физики, ну пока допустим)» — в том числе как защита от тьмы Нуара, а «если постарается её может сделать иллюзии осязаемыми», «может погладить все факторы устроив минутку тьмы», может ослепить и «запутать в пространстве».</li>\n<li>Инквизитор с чистой Оам — «кстати в этой сети как раз таки состоит инквизитор с чистой Оам» (2026-06-03, id 487531). Имя его в этом месте переписки не названо.</li>\n</ul>\n<p>Следующей репликой (2026-06-03, id 487532) сказано: «Конечно он ебанутый. Он блять каждый Божий день слышат крики о помощи. Его каждую ночь мучуют кошмары». Реплика идёт сразу за упоминанием инквизитора с чистой Оам; прямо, о ком речь, не сказано.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0197-S03", "MR-0197--mesto-vo-vselennoy"], "h": "<p>Секта появилась внутри реплики о перестройке пантеона злодеев: «Святая дева её больше нет как персонаж вообще. Вместо неё одним из столпов злодеев становится Фатик». То есть секта заводится вместе с заменой Святой девы на Фатик в числе столпов злодеев.</p>\n<p>В той же реплике упоминаются серафим и Нуар: «Нет серафим не сильнее Нуар. Они плюс минус равны по силе, но просто Пламя Серафима представляет опасность. Также у нуара больше всего Оам». Прямая связь этих двоих с сектой не проговорена — Нуар назван только как тот, от чьей тьмы Фатик защищается залпами.</p>\n<p>К какой вселенной относится секта, в записи стоит как «неясно» (проставлено по дате объявления, 2026-06-03).</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0197-S04", "MR-0197--kak-menyalsya-po-versiyam"], "h": "<p>Одна версия, одно окно (w0121), 2026-06-03, сообщения 487531–487532. Секта названа и привязана к Фатик в одной реплике; дальше в переписке к ней не возвращаются.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0197-S05", "MR-0197--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Устройство секты (обряды, иерархия, где базируется, сколько народу) — в переписке не сказано.</li>\n<li>Как секта относится к остальным инквизиторам и относится ли — не проговорено.</li>\n<li>Имя инквизитора с чистой Оам в этом месте переписки не названо.</li>\n<li>Кому именно принадлежит реплика про кошмары и крики о помощи, прямо не указано.</li>\n<li>Принадлежность к конкретной вселенной осталась нерешённой.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0197--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0104.html\">Нуар</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0197--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-06-03</td>\n<td>487531–487532</td>\n<td>w0121</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0197-sekta-falim.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0197--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0197.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
