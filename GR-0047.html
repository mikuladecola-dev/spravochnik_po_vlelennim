<script>const BASE="";const DOCNAME="Банда толстяка-задиры («недобанда»)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0047-S01", "GR-0047--chto-eto"], "h": "<p>Компания школьного задиры из истории про ГГ и существо (вселенная «монстры»). В переписке она названа двумя способами: в самой прозе, от первого лица ГГ, — «своя недо банда» («И да возможно он снова придет со свой недо бандой ну и без разницы. Пусть придут», 2024-11-11, id 255795), а в последующем разборе — просто «банда»: «Вчера гг тоже его избил и вчера в местью со свой бандой он побил гг» (Слава, 2024-11-13, id 256742). Миколай в конспекте пишет так же: «тогда же \"здоровяк\" ждал гг после уроков на заднем дворе с бандой», «з. и банда отмудохали гг вчера» (2024-11-13, id 256967).</p>\n<p>Собственного имени у банды нет. Как отдельная сущность она в переписке не разрабатывалась: авторы обсуждали не её, а хронологию драк и мотивацию ГГ, и банда упоминается только как обстоятельство этих драк.</p>\n<p>Важная оговорка по составу. В карточке группы в поле members стоят два id — <a href=\"PS-0167.html\">Толстяк-задира</a> и <a href=\"PS-0168.html\">Здоровяк (толстый задира)</a>, — но это две записи базы об одном и том же персонаже, сделанные по разным окнам переписки (w0063 и w0064). То есть поимённо (точнее, по описанию, имени у него тоже нет) в банде известен один участник — сам задира. Остальные её члены не названы, не описаны и не сосчитаны; в переписке они существуют только как слово «банда» рядом с ним.</p>\n<p>Ещё одна оговорка: банда и её главарь — обычные люди, не монстры. Это выяснено прямым вопросом. Миколай: «получается он считает задиру за существо?» (2024-11-13, id 256824) — Слава: «Нет» (id 256825). Ранее в том же разговоре: Миколай — «он просто с задирой подрался», «это обычный человек», «не?» (id 256817–256819), Слава — «Да обычный человек» (id 256820).</p>", "r": [["Толстяк-задира", "PS-0167.html"], ["Здоровяк (толстый задира)", "PS-0168.html"]]}, {"t": "Состав", "a": ["S02", "GR-0047-S02", "GR-0047--sostav"], "h": "<ul>\n<li><a href=\"PS-0167.html\">Толстяк-задира</a> — Толстяк-задира (запись по окну w0063, 2024-11-11). Варианты имени в базе: «здоровяк», «толстяк».</li>\n<li><a href=\"PS-0168.html\">Здоровяк (толстый задира)</a> — Здоровяк (толстый задира) (запись по окну w0064, 2024-11-13). Варианты имени в базе: «з.», «здоровяк», «толстяк».</li>\n</ul>\n<p>Обе записи — об одном персонаже: школьном задире, которому ГГ разбил нос и который на следующее утро ждёт его на крыльце.</p>\n<p>Остальной состав не назван. Ни числа участников, ни имён, ни описаний, ни того, учатся ли они в той же школе, в переписке нет. Банда фигурирует только целиком, как «его банда» / «своя недо банда».</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Третье — дубль в составе. <code>PS-0167</code> «Толстяк-задира» и <code>PS-0168</code> «Здоровяк (толстый задира)» — один человек, две записи, по три входящие ссылки на каждую, 5,4 и 3,7 КБ. Статья честно это оговаривает в двух местах, но в реестре их по-прежнему двое, и раздел «Состав» из-за этого читается как список из двух участников там, где участник один.</p></div>", "r": [["Толстяк-задира", "PS-0167.html"], ["Здоровяк (толстый задира)", "PS-0168.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0047-S03", "GR-0047--obschie-sposobnosti-gruppy"], "h": "<p>Ничего сверхъестественного за бандой не числится. Единственное, что она умеет по переписке, — избивать гуртом: «вчера в местью со свой бандой он побил гг» (Слава, 2024-11-13, id 256742), «з. и банда отмудохали гг вчера» (конспект Миколая, 2024-11-13, id 256967).</p>\n<p>Из того же материала следует порядок действий, общий для всей компании: назначенное место и время — «после уроков ожидал меня на заднем дворе, где меня очевидно отмутохали» (проза, 2024-11-11, id 255795). Сбор происходит после уроков, на заднем дворе школы. Повод — месть за главаря: избиение случилось в тот же день, когда ГГ разбил задире нос.</p>\n<p>Отдельно зафиксировано, что банда воспринимается как повторяемая угроза, а не однократный эпизод: «возможно он снова придет со свой недо бандой» (проза, 2024-11-11, id 255795).</p>", "r": []}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0047-S04", "GR-0047--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p>Различия внутри банды в переписке не проведены. Описан только главарь.</p>\n<p>О нём известно: он «здоровяк», «толстый задира», «толстяк»; ГГ разбил ему нос накануне; наутро он стоит на крыльце с уже разбитым лицом — «Я с благодарностью взглянул на  окровавленной лицо толстяка» (проза, 2024-11-11, id 255795). Обсуждая его в разборе, Миколай отдельно отметил: «так задира толстый» (2024-11-13, id 256821) — реплика прозвучала в ходе выяснения, не путает ли ГГ задиру с существом (существо большое и длиннорукое, задира — толстый).</p>\n<p>Про остальных участников не сказано ничего: ни как они выглядят, ни сколько их, ни кто из них что делает в драке. Разделения ролей внутри банды в переписке не сказано.</p>", "r": []}, {"t": "Иерархия", "a": ["S05", "GR-0047-S05", "GR-0047--ierarhiya"], "h": "<p>Единственное, что зафиксировано, — принадлежность банды задире, выраженная притяжательно: «своя недо банда», «со свой бандой», «его банда». Задира выступает тем, ради кого и с кем банда приходит.</p>\n<p>Инициатива в обоих упоминаниях исходит от него: он «ожидал меня на заднем дворе», он «снова придет со свой недо бандой». В конспекте Миколая тот же порядок: «\"здоровяк\" ждал гг после уроков на заднем дворе с бандой» (2024-11-13, id 256967).</p>\n<p>Никаких других званий, ролей или второго по старшинству в переписке не названо. Как банда собралась и на чём держится — не обсуждалось.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S06", "GR-0047-S06", "GR-0047--otnosheniya-s-drugimi-gruppami"], "h": "<p>Других групп, с которыми банда как-то соотносится, в переписке нет. Все зафиксированные отношения — с отдельными персонажами и с одним существом.</p>\n<p><strong>С ГГ-защитником (<a href=\"PS-0163.html\">ГГ-защитник</a>).</strong> Банда — сторона в цепочке школьных драк. По уточнённой Славой хронологии (2024-11-13, id 256736–256754): накануне ГГ избил задиру и разбил ему нос; в тот же день после уроков задира с бандой отомстил на заднем дворе; наутро, до уроков, ГГ снова бьёт задиру на крыльце. Миколай переспрашивает: «а сейчас они пиздятся перед уроками?» — Слава: «Да» (id 256749–256750); «вот он его на крыльце встретил и началось да?» — Слава: «Гг просто увидел его и начал избивать» (id 256751–256754).</p>\n<p>ГГ банды не боится и последствий её прихода не взвешивает: «Пусть придут, пусть побюуть пусть сломать руку, пусть ломают физически как хотят» (проза, 2024-11-11, id 255795). Основание этому даётся тут же и общее — не про банду конкретно, а про людей вообще: «Я не боялся людей, ведь это глупо человек боится человека если это и будет так то наша общество не крепче картонной коробке, а я верил что нашей общество крепкая, поэтому я не боялся». В конспекте Миколая эта же связка разложена так: «гг не боится людей. страх людей к людям он считает глупым. убежден, если человек боялся бы человека, общество не было бы прочным. это убеждение - причина отсутствия страха перед людьми» (2024-11-13, id 256967).</p>\n<p>Отношение ГГ к самому задире при этом не враждебное по итогу: драка с ним служит способом выплеснуть эмоции («было приятно просто подраться, забыть обо всем и просто бить толстого задиру»), и ГГ включает его в число тех, ради чьей безопасности собирается убить существо: «ради безопасности сестры, ради мой безопасности, ради безопасности этого толстяка которого я сейчас бью». Заканчивается это прямой благодарностью: «Он дал мне решимость и почти что решил страх. Я благодарен ему и его лицу» (проза, 2024-11-11, id 255795).</p>\n<p><strong>С существом.</strong> Прямого контакта между бандой и существом в переписке нет — они противопоставлены только через восприятие ГГ. Банда и её главарь стоят на стороне «людей, которых можно не бояться», существо — на другой: «но чего я действительно боялся это то невообразимое существо который в любой момент может взять и убить» (проза, 2024-11-11, id 255795). Разбор 2024-11-13 (id 256812–256846) целиком посвящён тому, чтобы эти две вещи не смешивались: Миколай сначала решил, что ГГ считает задиру существом, и получил отказ.</p>", "r": [["ГГ-защитник", "PS-0163.html"]]}, {"t": "Как менялась — по датам", "a": ["S07", "GR-0047-S07", "GR-0047--kak-menyalas"], "h": "<p><strong>2024-11-11 (id 255795–255805), окно w0063.</strong> Банда появляется впервые — внутри прозы Славы «Проснувшись с утра я чувство себя разбитым» (<a href=\"PR-0040.html\">Проснувшись с утра я чувство себя разбитым (школа и задира)</a>), одной оговоркой от лица ГГ: «И да возможно он снова придет со свой недо бандой ну и без разницы». Здесь же ретроспективно упомянуто её единственное действие: «который после уроков ожидал меня на заднем дворе, где меня очевидно отмутохали» — само слово «банда» в этой фразе не звучит, участие компании в избиении на заднем дворе будет названо только через два дня. Реакция Миколая в этот день по существу не последовала: «так как я решил что буду читать и думать», «я хуй его знает когда прочту», «но хорошо что ты написал» (id 255803–255805).</p>\n<p><strong>2024-11-13, вечер (id 256736–256760), окно w0064.</strong> Разбор хронологии. Миколай не мог понять, когда именно происходили драки: «вчера ждал», «или сейчас», «после уроков» (id 256737–256739). Слава уточняет и здесь впервые прямо приписывает избиение банде: «Вчера гг тоже его избил и вчера в местью со свой бандой он побил гг» (id 256742). Появляется мотив мести и подтверждается, что нынешняя драка — перед уроками, на крыльце, и начинает её ГГ.</p>\n<p><strong>2024-11-13, 20:12–20:21 (id 256812–256867), окно w0064.</strong> Уточнение природы задиры и банды. Отдельно проговорено, что это обычные люди и что ГГ не принимает задиру за существо. Заодно выясняется, что разбираемый текст — вторая часть, а первая (предыстория, <a href=\"PR-0041.html\">История про гг и существо. Часть 1 (предыстория)</a>) была выложена раньше; в предыстории банды нет вовсе.</p>\n<p><strong>2024-11-13, 22:03 (id 256967–256968), окно w0064.</strong> Миколай сводит обе части в пофразовый конспект (Разбор истории Славы по пунктам (части 1 и 2) <em>(статьи ещё нет — <a href=\"kb/SL-0046-razbor-istorii-slavy-po-punktam-chasti-1-i-2.html\">исходник</a>)</em>). Банда в нём получает три отдельные строки-факта: «тогда же \"здоровяк\" ждал гг после уроков на заднем дворе с бандой», «з. и банда отмудохали гг вчера», «не придает им значения(если придёт з. с бандой без разницы)». Новых сведений о составе или устройстве банды конспект не добавляет — он фиксирует уже сказанное.</p>\n<p><strong>Отклонённое.</strong> Прочтение Миколая, что задира (а с ним и вся школьная линия) как-то связан с существом, было предложено 2024-11-13 (id 256824: «получается он считает задиру за существо?») и отклонено Славой в следующем же сообщении: «Нет» (id 256825). На уточняющий вопрос «а кого он считает существом» (id 256827) ответ был: «Не кого» (id 256829).</p>\n<p>После 2024-11-13 банда в материалах не упоминается. В окне w0064 Слава обещает продолжение — «В 3 часть расскажу» (2024-11-14, id 257159), — но третьей части в этих источниках нет.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · С чего начать — не материал авторов</b>\n<p>w0063, 2024-11-11 — <code>PR-0040</code>, единственный первичный текст, откуда взято всё, что банда вообще делает. w0064, 2024-11-13 — <code>SL-0046</code> (конспект), <code>PR-0041</code> «Часть 1 (предыстория)» 6,0 КБ и <code>PR-0042</code> «Часть 2» — 1,2 КБ. На второй стоит обратить внимание отдельно: в базе она лежит как «фрагмент, цитата», то есть самой второй части в справочнике фактически нет, есть кусок. Всё, что статья цитирует из прозы, идёт из <code>PR-0040</code>, а не из <code>PR-0042</code>.</p></div>", "r": [["Разбор истории Славы по пунктам (части 1 и 2)", "kb/SL-0046-razbor-istorii-slavy-po-punktam-chasti-1-i-2.html"], ["Проснувшись с утра я чувство себя разбитым (школа и задира)", "PR-0040.html"], ["История про гг и существо. Часть 1 (предыстория)", "PR-0041.html"]]}, {"t": "Пробелы", "a": ["S08", "GR-0047-S08", "GR-0047--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имени у банды нет.</li>\n<li>Поимённого состава нет. Кроме главаря, ни один участник не назван и не описан.</li>\n<li>Численность не названа.</li>\n<li>У самого главаря имени тоже нет — в записи <a href=\"PS-0167.html\">Толстяк-задира</a> это отмечено прямо: «имени нет».</li>\n<li>Не сказано, учатся ли участники банды в той же школе и в каком они классе.</li>\n<li>Не сказано, как банда образовалась, давно ли существует и что удерживает её вокруг задиры.</li>\n<li>Не сказано, был ли у ГГ конфликт с бандой до того, как он разбил задире нос; в предыстории (<a href=\"PR-0041.html\">История про гг и существо. Часть 1 (предыстория)</a>, 2024-11-13, id 256858) школа упоминается — «Он уже был готов к драке и не боялся получать», — но ни задиры, ни банды там нет.</li>\n<li>Ролей внутри драки на заднем дворе никто не расписывал: сказано только, что банда «отмутохала» ГГ.</li>\n<li>Осталось нерешённым, придёт ли банда снова. Это выставлено как возможность в самой прозе («возможно он снова придет со свой недо бандой») и там же обесценено ГГ; продолжения в материалах нет.</li>\n<li>Никакой реакции школы, учителей или взрослых на драки в переписке не обсуждалась.</li>\n<li>Слова «недо банда» авторы не расшифровывали: чем «недобанда» отличается от банды, в переписке не сказано. В дальнейших упоминаниях оба соавтора говорят просто «банда».</li>\n</ul></div>", "r": [["Толстяк-задира", "PS-0167.html"], ["История про гг и существо. Часть 1 (предыстория)", "PR-0041.html"]]}, {"t": "Связи — всё вместе", "a": ["GR-0047--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0163.html\">ГГ-защитник</a>, <a href=\"PS-0167.html\">Толстяк-задира</a>, <a href=\"PS-0168.html\">Здоровяк (толстый задира)</a></li>\n<li><strong>Упоминает прозу:</strong> <a href=\"PR-0040.html\">Проснувшись с утра я чувство себя разбитым (школа и задира)</a>, <a href=\"PR-0041.html\">История про гг и существо. Часть 1 (предыстория)</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0047--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0047.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0047-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0047/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым чинить <code>SL-0013</code> «Список персонажей Славы»: две входящие ссылки, статьи нет, 9,8 КБ, три версии, окна w0035, w0059 и w0121, даты от 2024-05-25 до 2026-06-09. Это самая долгоживущая запись без статьи в кластере «монстры» и единственное место, где персонажи Славы вообще собраны именами в одну кучу. У банды нет ни имени, ни поимённого состава, и у главаря имени тоже нет — статья это отмечает трижды. Пока список без статьи, вопрос «как их зовут» некуда даже адресовать: проверить, есть ли задира в перечне, сейчас можно только вручную.</p>\n<p>Второе — <code>SL-0046</code> «Разбор истории Славы по пунктам (части 1 и 2)»: одна ссылка, статьи нет, 8,1 КБ. Статья ссылается на него прямо, с пометкой «статьи ещё нет», и при этом три из пяти фактов о банде взяты именно оттуда. Материала в конспекте больше, чем в самой прозе: <code>PR-0040</code> — 4,7 КБ, <code>SL-0046</code> — 8,1 КБ. Служебная запись переросла источник и остаётся необслуженной.</p>\n<p>Третье — дубль в составе. <code>PS-0167</code> «Толстяк-задира» и <code>PS-0168</code> «Здоровяк (толстый задира)» — один человек, две записи, по три входящие ссылки на каждую, 5,4 и 3,7 КБ. Статья честно это оговаривает в двух местах, но в реестре их по-прежнему двое, и раздел «Состав» из-за этого читается как список из двух участников там, где участник один.</p>\n<h3>С чего начать</h3>\n<p>Материала мало, и весь он в базе, в двух окнах.</p>\n<p>w0063, 2024-11-11 — <code>PR-0040</code>, единственный первичный текст, откуда взято всё, что банда вообще делает. w0064, 2024-11-13 — <code>SL-0046</code> (конспект), <code>PR-0041</code> «Часть 1 (предыстория)» 6,0 КБ и <code>PR-0042</code> «Часть 2» — 1,2 КБ. На второй стоит обратить внимание отдельно: в базе она лежит как «фрагмент, цитата», то есть самой второй части в справочнике фактически нет, есть кусок. Всё, что статья цитирует из прозы, идёт из <code>PR-0040</code>, а не из <code>PR-0042</code>.</p>\n<p>Для соотношения масштабов: <code>PS-0163</code> «ГГ-защитник» — 36 КБ, четыре ссылки. Банда описана через него, и почти всё, что о ней известно, — это его отношение к ней. Прежде чем искать новое, стоит вычесть его материал: часть строк про банду там уже разобрана.</p>\n<p>В архив — за третьей частью. 2024-11-14, id 257159: «В 3 часть расскажу». В базе слова «часть 3» нет вообще — ни записи, ни следа, ни отказа. Смотреть окна после w0064, начиная с 2024-11-14. Если третьей части нет и там, тогда все открытые вопросы по банде закрываются одним фактом: продолжения не было.</p>\n<h3>Как развивалось</h3>\n<p>2024-11-11 — заявили одной оговоркой внутри прозы, от лица ГГ, и в той же фразе обесценили: «возможно он снова придет со свой недо бандой ну и без разницы. Пусть придут». Слово «банда» тут звучит один раз, при этом самого избиения ей ещё не приписано. Миколай в этот день по существу не ответил: «я хуй его знает когда прочту». 2024-11-13 вечером вернулись — но не к банде, а к хронологии драк, которую Миколай не мог собрать; там банда впервые получает действие: «вчера в местью со свой бандой он побил гг». Через два часа ограничили: обычные люди, не монстры, задиру за существо ГГ не принимает. Ещё через полтора — свели обе части в пофразовый конспект, где банда получает ровно три строки и ни одного нового факта. После 2024-11-13 не упоминается ни разу.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Правило разделения страха названо прямо и обоснованно: людей ГГ не боится, потому что «человек боится человека если это и будет так то наша общество не крепче картонной коробке»; существа боится, потому что оно «в любой момент может взять и убить». Граница проведена по признаку — человек или не человек — и под неё специально подведено убеждение, а не характер. Миколай в конспекте это ещё и выделил отдельным пунктом как причину.</p>\n<p>Для соседнего случая правила нет. Банда бьёт гуртом — это уже не человек против человека, а несколько против одного, и в тот единственный раз, когда это случилось, ГГ действительно проиграл. Попадает ли толпа под то же «глупо бояться», или страх перед группой людей проходит по другой мерке, не проговорено нигде — при том что обе фразы стоят в одном абзаце 255795, буквально через строку друг от друга, и одна из них описывает как раз групповое избиение.</p>\n<h3>Отклик</h3>\n<p>Сильное здесь — благодарность. «Я с благодарностью взглянул на окровавленной лицо толстяка», и дальше прямым текстом: «Он дал мне решимость и почти что решил страх. Я благодарен ему и его лицу». Человека вчера отметелили толпой на заднем дворе, наутро он сам подходит и бьёт первым — и в процессе включает избиваемого в список тех, ради чьей безопасности собирается убить существо: сестра, он сам, «этот толстяк которого я сейчас бью». Драка тут работает не как месть, а как способ вспомнить, чего бояться не надо. Это неожиданный ход, и он сделан без единого объяснения — просто поставлен рядом и оставлен.</p>\n<p>И слово «недобанда», которое авторы ни разу не расшифровали, а в дальнейшем сами перестали употреблять. Оно точнее любого объяснения: банда, которой не хватает на то, чтобы быть страшной. Один раз произнесено — и заменено на обычное «банда» в обоих разборах, как будто оговорка была слишком меткой, чтобы её удержать.</p></div>", "r": []}];</script>
