<script>const BASE="";const DOCNAME="Апостолы (организация апостолов, «благословенные Богом»)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0001-S01", "GR-0001--chto-eto"], "h": "<p>Разведка не ошиблась: это действительно группа, но группа двойного рода. Апостолы — одновременно класс носителей силы и организация. Термин введён 2025-01-28 одной репликой Славы: «Давай благословенный Богом это апостооы, чтобы различать благословенных Богом и других» (id 285342). Миколай ответил: «хорошая идея» (285343). До этого дня в каталогах соавторов был только раздел «Благословенный», и апостолы из него ещё не выделялись.</p>\n<p>Дальше термин обрастает содержанием с двух сторон. Со стороны силы: апостолы — те, кто получил благословение от правителя рая, и таких на весь мир 21 (2025-03-19, id 305855; 2025-05-31, id 331635). Со стороны устройства мира: это «организация апостолов» (2025-03-13, id 301925), у которой есть агенты, кураторы, лагерь подготовки и аббревиатура АЗИП — «Апостол закон и права» (2025-05-28, id 330991).</p>\n<p>Название вселенной идёт от них: вселенная называется «Апостол» (<a href=\"MR-0113.html\">Апостол (вселенная)</a>), и Слава называет её главной: «Но главная вселенная всё равно апостол» (2025-06-10, id 335360). При закрытии этой вселенной он говорит о ней так: «Это вселенная (апостолов) была хорошая», «Была самой целестной», «Для меня апостолы были самой сбалансированный истории» (2025-03-25, id 310844–310874).</p>\n<p>Определение, данное изнутри разговора позже: «Ты же знаешь кто такие апостол. Сильнейший среди благословенных. Людей, что лишь своё силой и авторитетом поддерживают мир и у них есть нерушимая организация Азип, которой уже более сотней лет» (2025-08-30, id 359681).</p>\n<p>Определение, данное изнутри текста — устами эльфа-чужемирца, который встречает апостола: «Что-то, не верится, что ты апостол, тот самый легендарный, тем кем наш пугали старший, тех кого боялись сильнейший и те кто могут убить даже существо, ты явно не заслуживаешь эту силу» (2025-03-03, id 297462).</p>", "r": [["Апостол (вселенная)", "MR-0113.html"]]}, {"t": "Состав", "a": ["S02", "GR-0001-S02", "GR-0001--sostav"], "h": "<p>Поимённого состава, закрытого до конца, у группы нет ни в одной редакции. Есть реестры разной длины и разных дат; ниже — участники, у которых в базе есть отдельные записи.</p>\n<ul>\n<li><a href=\"PS-0182.html\">Агрегат</a> — Агрегат. Владелец способности изменения агрегатного состояния; в каталогах идёт с приписками «волк 🐺; экстримал ⏳; страдалец 🔪», позже волк заменён на «теневые братья 🌑».</li>\n<li><a href=\"PS-0223.html\">Дмитрий Рутковский («Агрегат»)</a> — Дмитрий Рутковский («Агрегат»), он же Дима. Представляется в тексте так: «Я Дмитрий Рутковский или можно просто Дима. Кодовая прозвище \"агрегат\". И я апостол, тот самый, которого по твоим словам ненавидит старик» (2025-03-13, id 301808).</li>\n<li><a href=\"PS-0171.html\">Палач</a> — Палач.</li>\n<li><a href=\"PS-0194.html\">Воительница</a> — Воительница (в реестрах пишется как «Разрушительнитца» / «Разрушительница»). По базе не подтверждено, что Разрушительница и Воительница — одно лицо.</li>\n<li><a href=\"PS-0184.html\">Бессмертный выродок</a> — Бессмертный выродок. Слава берёт его себе для отыгрыша и уточняет, что это апостол и он бессмертный (2025-02-25, w0077).</li>\n<li><a href=\"PS-0195.html\">Масочник</a> — Масочник. Добавлен в реестр во второй редакции 2025-01-28 (id 285522), одним названием с эмодзи маски.</li>\n<li><a href=\"IS-0017.html\">Защитник</a> — Защитник, он же Александр. Статус апостола подтверждён прямым обменом репликами: «кстати, он же и правда новый апостол)» — «Да» (2025-03-18, id 305338–305340).</li>\n<li><a href=\"IS-0013.html\">Бессмертный</a> — Бессмертный.</li>\n<li><a href=\"PS-0211.html\">Мальчик из братской могилы (Бессмертный)</a> — Мальчик из братской могилы (Бессмертный).</li>\n<li><a href=\"PS-0288.html\">самый жестокий апостол</a> — самый жестокий апостол, имени не получил.</li>\n</ul>\n<p>Отдельно стоит реестр от 2025-05-14 (id 325799) — это самый полный поимённый список, 14 позиций, выложенный одним сообщением под заголовком «Апостолы:»:</p>\n<ol>\n<li>Имитатор 🗡 (ветреной 🌬; электро ⚡️; птичка 🔈)</li>\n<li>Агрегат 🫥 (теневые братья 🌑; экстримал ⏳; страдалец 🔪)</li>\n<li>Разрушительница 💪 (огненная 💥)</li>\n<li>Палач ☠️ (тварь)</li>\n<li>Защитник 🤬 (ангел 👼)</li>\n<li>Дитя света ✨ (военный 🐺)</li>\n<li>Бессмертный выродок 🤪</li>\n<li>Хулиган 💎 (слайм 7️⃣)</li>\n<li>Вибрация 🫨</li>\n<li>Ученица???</li>\n<li>Масочник 🎭</li>\n<li>Сон ✨</li>\n<li>Небесная 🚀</li>\n<li>Маэстро 🎼</li>\n</ol>\n<p>Пункт 10 записан самим автором как «Ученица???» — то есть оставлен нерешённым ещё в момент составления. Сразу после выкладки Слава пишет: «Ну и нужно исправления» (id 325801), и на вопрос, в чём именно: «Добавления организация нимб и фантазеров. И перераспределение сил» (id 325808).</p>\n<p>Тот же список из 14 позиций стоит и в более ранних редакциях реестра — 2025-02-25 (id 295559) и 2025-03-06 (id 298850) — но там он озаглавлен «Благословенный:», а не «Апостолы:». В самой ранней редакции 2025-01-24 (id 284248) позиций десять: Имитатор, Агрегат, Разрушительница, Палач, Защитник, Дитя света, Бессмертный выродок, Хулиган, Вибрация, Ученица — плюс отдельной строкой «Теневый братья 🌘», которые в следующей же редакции того же дня уходят в скобку к другому персонажу.</p>\n<p>Про степень проработки этого списка Миколай спросил прямо: «а ты рил всех персов продумал?» Слава: «Ну только вид и способность и плюс минус характер» (2025-01-24, id 284364–284366).</p>\n<p>Поздние списки — уже на 12 позиций, см. раздел «Как менялась».</p>\n<p>Помимо реестров в переписке названы ещё апостолы, отдельных записей в списке не имеющие: Имитатор (Имет, Имит), Граф, Звездочёт (Звездачет), Кура, Избранный, Маура (по описанию — «уродливая маска апостол со способностью вибрация», 2026-06-07, id 488545).</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Третье — поимённый состав. Из четырнадцати позиций реестра 2025-05-14 отдельные записи в базе есть у семи: Имитатор, Агрегат, Разрушительница-Воительница, Палач, Защитник, Бессмертный выродок, Масочник. У остальных семи — Дитя света, Хулиган, Вибрация, Ученица, Сон, Небесная, Маэстро — в базе нет вообще ничего, ни статьи, ни исходника. Из поздних имён так же нет <code>Кура</code> и <code>Избранного</code> (список 2026-02-09, id 430400). Заведены, но без статей: <code>PS-0323</code> Граф (7 851, ноль ссылок — при том что в статье он столп героев, один из двух сильнейших и один из трёх с придуманным путём), <code>PS-0298</code> Звездочёт (1 946), <code>PS-0376</code> Маура (4 634), <code>PS-0375</code> Доима, дочь Имета (9 036, три ссылки). Пробел «поимённого состава на 21 позицию нет» — это не только авторская незавершённость, это ещё и половина известных имён, до которых база не дошла.</p></div>", "r": [["Агрегат", "PS-0182.html"], ["Дмитрий Рутковский («Агрегат»)", "PS-0223.html"], ["Палач", "PS-0171.html"], ["Воительница", "PS-0194.html"], ["Бессмертный выродок", "PS-0184.html"], ["Масочник", "PS-0195.html"], ["Мальчик из братской могилы (Бессмертный)", "PS-0211.html"], ["самый жестокий апостол", "PS-0288.html"], ["Защитник", "IS-0017.html"], ["Бессмертный", "IS-0013.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0001-S03", "GR-0001--obschie-sposobnosti-gruppy"], "h": "<p>Набор общих способностей менялся вместе с природой группы. Ниже — по редакциям.</p>\n<p><strong>Редакция «благословенные правителя рая» (2025-03-19 — 2025-05-31, 2025-10-18).</strong></p>\n<p>Базовый набор, общий вообще для всех благословенных, объясняет Имитатор Защитнику: «Каждый правитель даёт разный способности. Но четыре базовых есть у всех. Это усиления, самоисцеления, энергия и сенсорика» (2025-03-19, id 305856). В развёрнутой системной записи от 2025-05-31 (id 331635) те же четыре расписаны подробнее: «усиленная регенерация; усиления тела и всех чуств; аура (то бишь самая энергия, которая выплескивается и заставляет чувствовать страх е животных и обычных людей. Так же способный влиять на окружающей. При сильном скоплении); сенсорика (позволяет ощущать других благослрвенных и арбетара или Протобионтов)».</p>\n<p>Что отличает именно апостолов:</p>\n<ul>\n<li>Уникальная, у каждого своя способность. «У нас апостолов в отличие от всех. Способность формируется. То бишь у каждого апостола уникальная способность. У других же благословенных одним правителем. Одинаковые способности» (2025-03-19, id 305856). Механика этого объяснена так: «правитель рая. Посылает им лишь сгустки чистой и необработанной силы, который формируется во что уже только внутри Апостолов. Даруя им уникальные способности» (2025-05-31, id 331635).</li>\n<li>Телепатия между собой. «У апостолов есть дополнительная способность. Телепатия между ними. (они способны разговаривать. На расстоянии и также всем мести. Они также могут отказаться от телепатического общения и прервать разговор)» (2025-05-31, id 331635).</li>\n<li>Белые глаза как признак работающей силы: «И его глаза стали белыми. Это был признак использования благословенния правителем рая» (2025-03-19, id 305855).</li>\n<li>Общая сравнительная планка: «Всё же апостолы всё равно чаще всего сильнее любого другого благословенного» (2025-05-31, id 331635). Оговорка тут же: энергии все благословенные получают «плюс минус одинаковая количество», поэтому «Они являются одинаково сильными. Но это не включая индивидуальность людей».</li>\n</ul>\n<p>Ограничения этой редакции:</p>\n<ul>\n<li>«Я же говорил вроде апостолы не способны лечить и влиять на разум» — и тут же: «Благословенный вообще все» (2025-03-13, id 301867–301868). Раненого в тексте поэтому лечат «Лекарствами и бинтами» (id 301866).</li>\n<li>Сила идёт через мозг и вредит ему: «Почему у тебя болить голова? Потому-что связь устанавливается с мозгом. И сила проходит через мозг. Повреждая его» (2025-03-19, id 305856). Отсюда предохранитель: «у нас благословенных есть предохранитель в голове. Который при случаи выгорания мозгов отключает благословенния. Но его можно —» — фраза в тексте обрывается, как отключить предохранитель, не сказано. В сцене боя это отыграно: «Не замечая, что благословения выключалось. Точнее его выключил предохранитель. А имитатор не научил вырубать этот предохранитель» (id 305857).</li>\n<li>Срок жизни: «Средние продолжительность жизнь у благословенного после получения благословения 10 лет» (2025-05-31, id 331635).</li>\n<li>Всё, что сделано силой, исчезает при отключении: «Вы можете поджечь лес. Но после отключения благословенния весь огонь исчезнет».</li>\n</ul>\n<p><strong>Редакция «насекомые из коконов» (2025-09-12, повторена 2025-10-03 и 2025-10-22).</strong></p>\n<p>«Апостол в данной вселенной это опять группа лиц из 21 человека телепатически связанный друг с другом. Но это не люди, это насекомые. Всё двадцать один апостол вылезли из разных коконов. И по своё природе не являются людьми. Хоть и очень на них похоже» (2025-09-12, id 364808).</p>\n<ul>\n<li>Замедленное старение: «они словно замерзают в каком-то возрасте (в рандомные возраст)».</li>\n<li>Силы постоянного действия: «И они как арбетары. Если сжечь лес он будет гореть не переставая. То есть их ний силы постоянные (конечно с некоторыми условностями) но они могут сами вырубить огонь».</li>\n<li>Больше не одна способность на каждого: «теперь у них не по одной способности. Так как они по сути могут сами придумать новую способность. Но всё же они стараються делать упор в определённый способности. Ну не считая Имита».</li>\n<li>Телепатия — с рождения: «Они телепатически связанные друг с другом самого рождения» (2025-10-03, id 370827).</li>\n<li>Дети апостолов апостолами не являются: «И у некоторых есть дети (обычный) дети апостолов рождаются обычными» (2025-10-03, id 370756); позже повторено прямо: «Дети апостолов не являются апостолыми. Они обычные люди» (2025-12-06, id 393468).</li>\n<li>Внешне — люди: «Выглядят полностью как люди», «Они говорят» (2025-10-03, id 370751–370752). Слово «насекомые» позже объяснено как прозвище: «Насекомые это апостолы который выглядит как люди. (Насекомые я назвал их по приколу)» (2025-10-22, id 377643).</li>\n</ul>\n<p><strong>Редакция «раса белоглазых» (2025-09-17, w0105).</strong></p>\n<p>Здесь у расы появляется общая для всех уникальная способность — белые глаза. Задача поставлена так: «Для расы апостолов нужно дать какую-ту уникальную способность. Именно всём апостолом. Сверх зрения или типа всё видящая ока я больше не хочу» (id 366109), с уточнениями «Чтобы сочеталось с белыми глазами» и «Но при этом было больше физиологическая». Перебраны варианты: «что-то вроде прозрачного зрения из клинка рассекающего демона» (id 366113), «типа восприятия времени (ну то бишь улучшенная реакция)» (id 366115). Выбрано: «Ну наверное восприятия времени и сверхчувства как у Максима» (id 366116).</p>\n<p>Готовая формулировка (id 366117), которая дальше кочует по редакциям почти дословно:</p>\n<p>«После активации белых глаз то для них время замедляется (но они не становятся быстрее) и всех их чувства в улучшаются и они становятся сверх чувствительными. Зрения слух осязания запах и вкус. Из-за и боль они ощущают больнее. Но зато у них словно всё на ладони они ощущать и видят всё что находиться вокруг. И способны словно предсказывать движение противников по слуху или зрению. И становятся невероятно точными».</p>\n<p>Ограничение: «долго держать включёнными такое восприятия они не могут. Мозг просто не выдержит такое большое количество информации и нагрузки».</p>\n<p>Базовый уровень, без активации: «физ. Сильный, быстрые, крепкий и владеют повышенной регенерацию (ну не прям сверхрегенерацию, просто наверное раза 3 быстрее разный заживают) и владеют реакцию превосходящие любого человека. плюсом апостол может приспосабливаться к окружающей среде ну не прям сильно. А и они выносливый они могут обходиться без сна и чтобы на них это не как не влияло 3 дня».</p>\n<p>Числовые пределы, полученные ответами на вопросы Миколая (2025-10-03, id 370838–370851): дальность чувств — 100 м (и по слуху, и по запаху), исключение — «Имитатор и звездочёт могут. Но если сконцентрируется»; чувствуют «Температуру воздуху и давлению»; без воды — 7 (единица измерения в переписке не названа), без воздуха — 3 минуты.</p>\n<p><strong>Редакция Оам-мутантов (2025-10-20, w0107).</strong></p>\n<p>«Апостолы — это люди, у которых в утробе матери мутировало нервную систему мозг и глаза. Из-за этого их ней пять чувств, работоспособность мозга, реакция, точность выше чем у обычного человека в несколько раз. Обуздать Оам они могут без поглощения огромного количества Оам. Им достаточно пережить одну эмоциональную ситуацию, и они неосознанно воспользуются Оам. И дальше они могут пользоваться им без проблем. Также они могут использовать белый глаза направив туда Оам» (id 376401). Итог: «Как ясно они у них лучший контроль Оам».</p>\n<p><strong>Редакция «мир без энергии» (2026-04-25).</strong></p>\n<p>«Ну апостолов просто будут сверхлюдьми. Физические сильными, выносливыми, ловками. И при активации белых глаз просто повышается всё чувство. Также повышает регенерация» (id 466520), и следом: «Без индивидуальных способностей» (id 466526).</p>\n<p><strong>Редакция «искусственные сверхлюди» (2026-06-02).</strong></p>\n<p>«у Нуара и апостолов есть особенности. Они не стареют, у них невероятное быстрая регенерация тела. И их тела очень адаптивные. Ну ещё несколько особенностей которых я прям здесь не скажу» (id 487009). Что это за остальные особенности — в переписке не сказано.</p>\n<p><strong>Обучение (2026-06-07, id 488545–488546).</strong></p>\n<p>«Большинство апостолы тоже им обучены оу и материализация, но материализация слишком опасная, долгая, и не эффективная и ты так же не можешь использовать её вместе со своей способностью. Поэтому кроме Имета их никто и не использует. Ну возможно кто-нибудь из апостолов оу может иногда применить, но материализацию точно нет. Сдохнут ведь, даже если апостолы».</p>\n<p>Там же перечислено, какие способности среди апостолов встречаются чаще всего: «А это большинство способности апостолов, огонь, лёд и холод».</p>", "r": []}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0001-S04", "GR-0001--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p>Главный принцип различия в редакции с правителем рая: у каждого апостола способность своя, и это прямо противопоставлено остальным благословенным, у которых способности одинаковые (2025-03-19, id 305856). Из-за этого же принципа число апостолов было ограничено, и Слава позже называет это причиной: «Проблема была в способностях, я для каждого придумывал отдельную способность, Из-за чего ограничивал их число» (2026-04-25, id 466535).</p>\n<p>В реестре 2025-05-14 (id 325799) различия зафиксированы скобками при именах: у Имитатора «ветреной 🌬; электро ⚡️; птичка 🔈», у Агрегата «теневые братья 🌑; экстримал ⏳; страдалец 🔪», у Разрушительницы «огненная 💥», у Палача «тварь», у Защитника «ангел 👼», у Дитя света «военный 🐺», у Хулигана «слайм 7️⃣». По словам Славы (2025-01-28, id 285537), в этом списке «среди благословенных только апостолы а в скобках благословенный» — то есть скобки перечисляют не силы, а привязанных к апостолу благословенных.</p>\n<p>Отдельно названные различия:</p>\n<ul>\n<li>Имитатор (Имет, Имит) — «фигура старшего брата среди апостолов. Архетип учёного». Его отличие механическое: «когда у всех программа способности в голове закоренелая. То у него она податливая и гибкая». Единственный, кто пользуется материализацией. Единственный, кто может комбинировать особое усиление со своей способностью: «Ты не можешь их комбинировать. Никто не может, кроме Имета». В редакции с несколькими способностями он же исключение из правила про упор в определённые способности: «Ну не считая Имита» (2025-09-12, id 364808). Он же — представитель апостолов для правительства (2025-12-06, id 393480). Он и Звездочёт — единственные, кто пробивает потолок в 100 м, «Но если сконцентрируется» (2025-10-03, id 370842). Он же обучил Мауру своему стилю вибрации (2026-06-07, id 488545).</li>\n<li>Защитник (Александр) — апостол, который «по сути сошёл с ума когда умер его ребенок, и в какой-то момент полностью откажется от своей человеческой натуры» (2025-12-06, id 393473). Задача на него сформулирована 2025-12-17: «Защитник (один из апостолов) должен будет отказаться от человечность (что плачет в нём и чувствует вину, что не уберёг семью) но что произойдет когда он откажется от человечности» — вопрос оставлен открытым.</li>\n<li>Бессмертный — исключение из общего характера группы: апостолы высокомерны, «Ну кроме бессмертного (у него как бы не все в порядке с мозгами если ты помнишь)» (2025-12-06, id 393293).</li>\n<li>Палач — «Цепной пёс ассоциации. Ну точнее ассоциации так думает. Под цепным псом я имею ввиду убийцу, что убивает тиха всех неугодных ассоциации. И он не герой, ну не числиться. В ближнем бою он почти сильнейший» (2026-06-02, id 487176).</li>\n<li>Граф — один из шести столпов героев на стороне Ассоциации (2026-06-02, id 487002, 487004).</li>\n<li>Звездочёт — владеет «полотном созидания»; Имет на нём тренировался, потому что «Сутью полотна, как это увидел Имет, было сохранять разные конструкции, при этом если конструкции не удаётся то они просто распадаются, а не взрываются» (2026-06-07, id 488545).</li>\n<li>Маура — «уродливая маска апостол со способностью вибрация» (2026-06-07, id 488545).</li>\n<li>Агрегат — «уравновешенный, в отличие от остальных» (w0081); у него, Графа и Защитника «Судьба предрешена. Ну я то есть придумал их ней путь» (2025-12-06, id 393478).</li>\n<li>Самый жестокий апостол (<a href=\"PS-0288.html\">самый жестокий апостол</a>) — задан характером, а не способностью: «самого мерзкого лицемерного. Живущего лишь ради себя и наплевавший на всех. Он урод без только чего-то хорошего. И он не хитрый не умный просто ублюдок жестокий» (2025-08-10, id 355186). Способность для него запрошена у Миколая; тот предложил два варианта: «бог у которого 2 лица» и «или давать качества лицемерия другим» (2025-08-11, id 355798–355800). Который из вариантов принят — в переписке не сказано. Там же обсуждалось оружие «которая причиняет много боли»; ответ Миколая — «тот же молоток» (id 355637).</li>\n</ul>\n<p>Различие по возрасту при общей неподвижности старения проработано 2026-06-07 (id 488439): «Звездочёт живёт отдельно от родителей, да и под бинтами не особо видно изменение. Не видно старый он или нет. Агрегат уехать путешествовать. Но когда будет возвращаться домой. То будет отшучиваться, типа гены у него хорошие. Родителем граф вобще пофиг (только они желают что бы он поскорее дал потомство из-за его способности)».</p>", "r": [["самый жестокий апостол", "PS-0288.html"]]}, {"t": "Иерархия", "a": ["S05", "GR-0001-S05", "GR-0001--ierarhiya"], "h": "<p>Внутри мира апостолы стоят над агентами. Это зафиксировано как «Класс сильных носителей силы, стоящий над агентами» (w0082). Устройство агентской вертикали описано изнутри текста: рекрут даёт ответ через три дня, потом «меня заберут в лагере, где я должен буду прожить 6 месяцов под тренировкам и впитыванием информации», и «Каждый агент может быть куратором только для 10 людей» (2025-03-18, id 305116). На вопросы Миколая «интересно че они с этими агентами делают» и «и сколько уже таких агентов» ответы: «Отправляют сражаться» и «Дохера» (2025-03-18, id 305334–305339).</p>\n<p>Внутри самой группы формальной вертикали не описано. Названы отдельные роли:</p>\n<ul>\n<li>Имет — «фигура старшего брата среди апостолов» (2026-06-07, id 488545) и «для правительства. Представитель Апостоловы именно Имит» (2025-12-06, id 393480).</li>\n<li>«Что сильнейший апостолы это Граф и Палач» (2026-06-02, id 487176).</li>\n<li>Друг друга апостолы называют братьями и сёстрами: Имит любит свою дочь «Также сильна как и своих братьев и сестёр апостолов» (2025-12-06, id 393476).</li>\n</ul>\n<p>Ранжирование группы относительно мира менялось:</p>\n<ul>\n<li>«Сильнейший среди благословенных» (2025-08-30, id 359681).</li>\n<li>«Апостолы 21 вторая по силе раса на земле» — первые коты, которых девять (2025-11-17, id 385768; повторено 2025-12-06, id 393287). Тут же авторская оговорка: «опять раса, в мире есть просто индивиды который могут быть сильными».</li>\n<li>«И вот добрики и другие добряки есть. Но апостолы все же главные» (2025-12-06, id 393294).</li>\n</ul>\n<p>Оговорка о равенстве внутри группы: все благословенные, включая апостолов, «Получают плюс минус одинаковая количество энергии (силы). Они являются одинаково сильными. Но это не включая индивидуальность людей» (2025-05-31, id 331635).</p>\n<p>Размещение по миру описано одной строкой: «Во всём мире», «На Северном полюсе два апостола сидят» (2025-05-30, id 331452–331453).</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S06", "GR-0001-S06", "GR-0001--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>АЗИП.</strong> Аббревиатура расшифрована 2025-05-28: «Апостол закон и права» (id 330991). Организация основана апостолами и работает на них: «Типо апостолы с давних времён защищали мир. И во всё времена государство о них знала», «На апостолов. Для защиты порядка» (2025-05-30, id 331455–331456). Позже: «у них есть нерушимая организация Азип, которой уже более сотней лет» (2025-08-30, id 359681).</p>\n<p><strong>Агенты.</strong> Вербуются апостолами из тех, кто выжил, получив кусок силы мира. Предлагаемый выбор дословно: «Первый ты восстанавливаясь и живёшь обычный жизнью. Но за тобой будет слежка, так как ты тоже получил кусок силы нашего мира. При этом выжив. За тобой будет слежка, чтобы ты никому не навредили. А второй путь стать агентом нашей организаций. И защищать сон мирных людей. Но при этом рискуя своей жизнью» (2025-03-13, id 301809).</p>\n<p><strong>Арбетары и альфы.</strong> Отношение враждебное и описано глазами старика-арбетара: «Эти апостолы не пойми кем себя возомнили и везде понаставили свои порядки, на чужой силе»; «как бы я ненавидел апостолов. Но не могу не признать, что свою работу они выполняють слишком идеально. Ну даже в идеальной системе есть единичные пробои» (2025-03-13, id 301806). Практическая сторона этой вражды: чтобы добыть тело альфы, старику «пришлось ждать пока какой-нибудь апостол упустить альфю. При этом доведя его до полусмерти». Он же оценивает соотношение сил: «Нужно провести тест-драйв. С кем же? Ну уж точно не с апостолами. С ними ещё рано» (id 301823).</p>\n<p><strong>Сестра и её группировка.</strong> Ключевой злодей вселенной. «Есть сестра благословенная правителем Кильке. Да она сильнее одного апостола. Но дальше че. Это не та сила, что поставит на колени весь мир. А её подручный всё слабее апостолов. Каждый из них один на один против апостолов продует. При этом у них не такая большая группировка» (2025-08-30, id 359684). Позже Сестра переопределена: «Группировка сестры (который теперь будет дочерью Имитатора. И я не знаю какие у неё будет цель)» (2025-11-17, id 385768).</p>\n<p><strong>Дочь Имитатора (Доима).</strong> Апостолы относятся к ней дружелюбно, и это отношение через отца: «Апостолы также относятся к ней дружелюбно так как она дочь Имита. И она иногда будет этим пользоваться» (2025-12-06, id 393476).</p>\n<p><strong>Серафим.</strong> Обозначен как «одноразовый босс. Что появится, когда будет война с раем» (2025-08-30, id 359686). В идее от 2025-12-17 (id 399522) его пламя выжигает одного из апостолов, и тот теряет «семя».</p>\n<p><strong>Церковь-организация (редакция с коконами).</strong> Отношения строятся на мести: «та организации убила семью одного из апостолов и разгромила детский приют другого апостола. Всё остальные апостолы начали их истреблять. Даже тех кто просто приходил помолиться в церковь этой организации» (2025-09-12, id 364808). В том же куске сказано, что именно из-за этого «апостолы дорожат друг другом больше всех».</p>\n<p><strong>Поротаи.</strong> «Проротой каменный челике. Владеют преступное организацию. Некий союз с апостолами» (2025-11-17, id 385768). По соотношению сил: «против Поротой они не так эффективны», но «апостолы сильнее поротоя» (2025-09-17, id 366175–366177).</p>\n<p><strong>Азуриэль.</strong> «Ты ведь понимаешь что для апостолов у которых главная силы сверх чувства и восприятия (то есть самое главное нервная система и мозг) то есть Азуриэль является природным охотником Апостолов» (2025-09-17, id 366175).</p>\n<p><strong>Дети мирового древа.</strong> «Хрен ты их пробьешь, не кто из апостоловы не сможет нормально их ранить, а если ранят они будут регенерировать» (2025-10-02, id 370605).</p>\n<p><strong>Коты.</strong> Стоят выше апостолов: котов девять, они сильнейшие, «Они вообще никуда не вмешиваться»; апостолы — вторая по силе раса (2025-11-17, id 385768).</p>\n<p><strong>Нимб.</strong> В редакции 2026-06-02 апостолы — продукт Нимба: «после нуар лишь ещё один проект по созданию ИС удался. Проект апостолов. 12 созданных ИС. Но его уже на публику не раскрывали» (id 487001). В той же вселенной Нимб захватил беременную от Имета женщину, чтобы проверить, унаследует ли ребёнок способности апостола (2026-06-07, id 488439).</p>\n<p><strong>Ассоциация героев и злодеи.</strong> «Ну и апостолы которые держут нейтралитет. Конечно не все. Вот Граф один из столпов героев» (2026-06-02, id 487004). Палач при этом — тихий исполнитель Ассоциации, «Ну точнее ассоциации так думает».</p>\n<p><strong>Мир в целом (редакция Оам).</strong> «Апостолы очень часто устраивают без порядок разрушая укорененый баланс между всеми. Из-за них по итогу в современном мире раскроется существования тёмный изнанки но это будет в будущем в будущем» (2025-11-17, id 385768). Сторона и характер уточнены отдельно: «Вообще апостолы на стороне добра. Ну будут устраивать геноциды и теракты. Плюсом они высокомерны, хотя прямо этого не показывать. Ну они как бы с рождения лучшей людей, поэтому в полне ясно почему они высокомерные» (2025-12-06, id 393293).</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S07", "GR-0001-S07", "GR-0001--kak-menyalas"], "h": "<p><strong>2025-01-24 (id 284248–284367).</strong> Группы как таковой ещё нет. Есть раздел «Благословенный» в рабочем каталоге на десять позиций. В тот же день каталог переписан ещё дважды: во второй редакции добавлены страдалец к Агрегату, слайм к Хулигану, теневые братья к Дитя света, во врагов — Эльф, и появляется блок «Семь грехов»; в третьей добавлены блоки «Оружие» и «Артефакты», а в идеях «корень желаний» заменён на «камень желаний». Соотношение сил с грехами задано так: «не забывай 7 грехов сильней благословенный и чтобы убить одного греха в максимум надо 3 благословенных именно Бога, А для остальных благословенных надо будет 5» (id 284276).</p>\n<p><strong>2025-01-28 (id 285341–285344).</strong> Введён термин. Апостолы = благословенные Богом, отдельно от прочих благословенных.</p>\n<p><strong>2025-01-28 (id 285531–285538).</strong> Сразу встаёт задача разнести их в реестре. Миколай: «не разделены благословенные и апостолы». Слава: «Сделаю сделаю». Разделение в реестре так и не появляется: во всех последующих редакциях 2025 года раздел по-прежнему озаглавлен «Благословенный:», и только 2025-05-14 (id 325799) заголовок меняется на «Апостолы:».</p>\n<p><strong>2025-02-25 (id 295547–295559).</strong> Объявлен формат работы над ними. Слава: «Бля она попала прям туда где у меня дыра, а именно в повествования и сюжет. Я же только концепции и придумываю, а персонажей особо не раскрывал» — «Ну так концепция у меня пока, что есть, поэтому буду скидывать мини истории апостолов». Начать решено с Бессмертного выродка.</p>\n<p><strong>2025-03-03 (id 297458–297463).</strong> Первое появление апостола в прозе. Он выведен не через систему, а через реакцию врага: легендарные, тех «кого боялись сильнейший». Внешность конкретного апостола: мужчина в форме как у солдат, «но более раскошно, что-ли, и элегантно», со шрамами «словно он плачет, две полосы вниз, словно он роняет слезы», с белыми блестящими глазами; дерётся винтовкой со штыком. Забирает мальчика со словами: «Похоже ты будешь аномалий нашего поколения».</p>\n<p><strong>2025-03-06 (id 298854).</strong> Решение убрать из реестра «Семь грехов»: «Грехи нужно убрать, а то тупо».</p>\n<p><strong>2025-03-13 (id 301806–301809).</strong> Апостолы описаны изнутри мира с двух сторон: как ненавидимые арбетаром носители чужой силы и как организация с агентами и вербовкой. Впервые назван конкретный апостол по имени и фамилии — Дмитрий Рутковский, «Агрегат».</p>\n<p><strong>2025-03-13 (id 301865–301874).</strong> Ограничение зафиксировано: не способны лечить и влиять на разум.</p>\n<p><strong>2025-03-18 (id 305116–305117, 305329–305341).</strong> Достроена агентская система: три дня на ответ, лагерь на полгода, куратор на десять человек. Защитник подтверждён как новый апостол. Миколай: «я про то что у этих апостолов такая система получается».</p>\n<p><strong>2025-03-19 (id 305855–305857).</strong> Первая полная система изнутри текста: 21 на весь мир, благословение от правителя рая, четыре базовых способности у всех благословенных, уникальная формирующаяся способность у апостолов, белые глаза как признак работы силы, предохранитель в голове.</p>\n<p><strong>2025-03-25 (id 310843–310913).</strong> Вселенная закрыта. «Но для меня она исчерпала себя», «дальше я еë развивать не буду». Судьба наследства оставлена неопределённой: «Ну перс и артефакты. Возможно останутся. Хотя не факт. Возможно я создам вселенную вообще без сил». В тот же день (id 311180) апостолы перенесены в ещё не придуманный мир: «первая что я сделал в голове это перенёс апостолов и уже придумал им логическая объяснения. Даже не до конца придумав мир». Само это «логическое объяснение» в переписку не попало.</p>\n<p><strong>2025-05-14 (id 325799).</strong> Реестр из 14 позиций впервые озаглавлен «Апостолы:». Сразу помечено, что «нужно исправления»: добавить организацию нимб и фантазёров, перераспределить силы.</p>\n<p><strong>2025-05-28 — 2025-05-30 (id 330991, 331452–331457).</strong> Достроена организационная надстройка: АЗИП, роль основателей и заказчиков, историческая глубина («с давних времён»), двое на Северном полюсе.</p>\n<p><strong>2025-05-31 (id 331635–331636).</strong> Системная запись, где апостолы поставлены в общую механику правителей и благословений. Здесь появляется телепатия между ними и объяснение уникальности через необработанные сгустки силы. Здесь же — срок жизни благословенного в 10 лет.</p>\n<p><strong>2025-08-10 — 2025-08-11 (id 355184–355800).</strong> Разработка отдельного апостола, заданного через характер, а не через силу. Способность для него запрошена и предложена, выбор не зафиксирован.</p>\n<p><strong>2025-08-30 (id 359681–359692).</strong> Зафиксирована концовка: «В конце всё истории и в последнее битве апостолы продуют. Большинство апостолов сдохнуть. Поэтому нужна сила что позволит это сделать». Вся задача поиска злодея строится от этого финала: «И как придумать злодея, чтобы люди осушители страх. О том что апостол не справится и Азип не вывозит».</p>\n<p><strong>2025-09-12 (id 364757–364761).</strong> Вселенная «Апостол» отложена: «сама вселенная апостолов достаточно сложная и запутанная. Что даже я забываю кто че»; названа причина — «множество миров для меня звучит слишком за мудрено сейчас». Отложена, но не закрыта: «куда-нибудь в долгий ящик я не убираю».</p>\n<p><strong>2025-09-12 (id 364808–364809).</strong> Первая переработка под новую вселенную: 21 не человек, а насекомые из разных коконов; замедленное старение; постоянно действующие силы; не одна способность на каждого; общая близость друг к другу, объяснённая местью за убитую семью и разгромленный приют.</p>\n<p><strong>2025-09-17 (id 366033–366041).</strong> Другое, несовместимое с предыдущим объяснение: «апостолы это те кто сожрал насекомое (не придумал ещё какое. Но шанс выживания после его съедения 13 процентов. Всего насекомых 21)». На этом шаге у них «лишь баф к физ. И регенерация не каких индивидуальных способностей (пока что)». Тут же заявлена общая установка: «Как ты понял я хочу более приземленую вселенную без правитель творцов и т. Д. Ну и без чудо способностей». Артефакты и творцы решено не вносить.</p>\n<p><strong>2025-09-17 (id 366109–366117).</strong> Расе добавлена общая уникальная способность — белые глаза, и прописан базовый уровень без активации.</p>\n<p><strong>2025-09-17 (id 366175–366193).</strong> Место в расстановке сил: сильнее Поротаев, но уязвимы к Азуриэлю, потому что их сила завязана на нервной системе и мозге.</p>\n<p><strong>2025-10-02 — 2025-10-03 (id 370605–370851).</strong> Апостолы включены в список обитателей нового, ещё не сформировавшегося мира. Слава: «Ну точнее только о апостолах. Нравится мне они». Прописаны этапы жизни, внешность, дети, числовые пределы чувств.</p>\n<p><strong>2025-10-18 (id 375843–375852).</strong> Возврат к редакции с правителем рая — через вёрстку сайта: Миколай собирает страницу «только по одному твоему сообщению», взяв текст от 2025-05-31; Слава отвечает «Очень круто» и «Делай так».</p>\n<p><strong>2025-10-20 (id 376401–376403).</strong> Оам-редакция: апостолы — мутанты, у которых ещё в утробе мутировали нервная система, мозг и глаза; лучший контроль Оам среди всех.</p>\n<p><strong>2025-10-20 (id 376432).</strong> Слава замечает отсутствие апостолов на сайте: «А апостолы где, всё есть даже вампиры, а апостолов нету».</p>\n<p><strong>2025-10-22 (id 377616–377647).</strong> Возврат старой версии внутри вселенной Оам: «Кстати вернём старых апостолов. Они насекомые произошли от неизвестного мутировшого существа». Причина возврата названа: «Просто если у них развита только мозг и нервная связь. Они не смогут в моей голове сражаться полноценная. (эффект адаптации повышенный у них должен быть)». Происхождение сведено к Оам: «Так вот это существо мутировал из-за воздействием Оам». Отклонённый вариант Миколая: существо умерло, «и 21 насекомые съели его труп» — ответ Славы: «Нет». Тогда же снят вопрос о буквальных насекомых: прозвище дано «по приколу».</p>\n<p><strong>2025-11-17 (id 385768–385769).</strong> Место в мировой иерархии: 21, вторая по силе раса после котов. Добавлены роль нарушителей баланса и будущее раскрытие тёмной изнанки. Обозначен «некий союз с апостолами» у Поротаев.</p>\n<p><strong>2025-11-25 (id 388642–388657).</strong> Апостолы верстаются на сайт в двух вариантах дизайна: «да это апостолы только по одному сообщению, как раньше».</p>\n<p><strong>2025-12-06 (id 393287–393296).</strong> Уточнена сторона и характер: на стороне добра, но с геноцидами и терактами, высокомерны, кроме Бессмертного.</p>\n<p><strong>2025-12-06 (id 393455–393487).</strong> Уточнения по составу и связям: Имит (Имитатор) — апостол; дети апостолов — обычные люди; апостолы зовут друг друга братьями и сёстрами; у Агрегата, Графа и Защитника путь уже придуман; Имит — представитель апостолов перед правительством.</p>\n<p><strong>2025-12-17 (id 399512–399562).</strong> Открытые вопросы поставлены прямо: «И кто теперь будет апостолами. Типо они и так не люди. А их него родителя я так и не придумал»; «Апостолы не люди. Их ней цикл жизни я не придумал»; «А что произойдет если апостол умрет. Умретли он просто или переродится чем то иным». Предложена одна идея на этот счёт: одного выжигает пламя Серафима, он выживает, но теряет «семя» («я так и сам не до конца понял, что это за семя. Ну можешь считать это источником их силы и быстрое адаптации»), сбегает от остальных, «не желая чтобы его братья видели, как он умирает», умирает в домике в лесу и становится чудовищем, которое нападает на нашедшего его Графа.</p>\n<p><strong>2025-12-17 (id 399539–399562).</strong> Число урезано с 21 до 12. Причина у Славы бытовая: «Как бы их 21 один и я не всех придумал», «Ну давай. А то мне в падлу придумывать всех 21». Довод Миколая: «12 как по базе?», «ну было ж 12 апостолов у бога». На вопрос «и кстати почему их 21?» ответ: «Я хуй знает». Отдельная реплика Миколая про числа: «если че бог любит все че на 3 делится и чем меньше частное тем больше нравится».</p>\n<p><strong>2026-01-31 (id 426512–426563).</strong> Первый список на 12 позиций, из них 10 заполнены: 1 Имитатор, 2 Агрегат, 3 Защитник, 4 Бессмертный выродок, 5 Граф, 6 Вибрация, 7 Масочник, 8 Звездачет, 9 Небесная, 10 Палач; позиции 11 и 12 пустые. Миколай докидывает два рабочих названия — «липкий» и «иссушающий» — и сам помечает их статус: «придумаю позже», «пока как заполнение». В дальнейшие списки эти два названия не попадают.</p>\n<p><strong>2026-02-09 (id 430400).</strong> Тот же список с изменениями: позиция 7 опустела (раньше стоял Масочник), а прежде пустые 11 и 12 заполнены — Кура и Избранный.</p>\n<p><strong>2026-04-25 (id 466476–466542).</strong> Апостолы перенесены в мир без энергии и без богов. Здесь они — просто сверхлюди, без индивидуальных способностей, и потому «апостолов может быть неограниченное количество». Реплика Славы о самом приёме переноса: «Ну я их везде пихаю».</p>\n<p><strong>2026-06-02 (id 487001–487009, 487176).</strong> Апостолы перенесены во вселенную героев и злодеев: 12 искусственных сверхлюдей, второй удавшийся проект Нимба после Нуара, публике не раскрытый. Держат нейтралитет — не все. Не стареют, быстрая регенерация, адаптивные тела. Сильнейшие — Граф и Палач.</p>\n<p><strong>2026-06-07 (id 488439).</strong> Возраст поднят: «Давай изменим возраст апостолов теперь им за 40». Тут же расписано, как это скрывается у Звездочёта, Агрегата и Графа. Реакция Миколая: «ебать старые».</p>\n<p><strong>2026-06-07 (id 488545–488546).</strong> Прописано, чему из техник группа обучена и чем при этом не пользуется: особому усилению и материализации обучено большинство, но материализацию не применяет никто, кроме Имета.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "GR-0001-S08", "GR-0001--probely"], "h": "<div class=\"gaps\"><ul>\n<li><strong>Поимённого состава на 21 позицию нет ни разу.</strong> Максимальный поимённый список — 14 позиций (2025-05-14, id 325799), при том что число апостолов в тот период — 21. Слава признаёт это прямо: «Как бы их 21 один и я не всех придумал» (2025-12-17, id 399540).</li>\n<li><strong>Почему их именно 21 — не сказано.</strong> На прямой вопрос Миколая «и кстати почему их 21?» ответ: «Я хуй знает» (2025-12-17, id 399546–399548).</li>\n<li><strong>Позиция «Ученица???»</strong> стоит со знаками вопроса в каждой редакции реестра, начиная с 2025-01-24 — не определена самим автором.</li>\n<li><strong>Позиция 7 в списке 2026-02-09 пуста</strong> (id 430400), чем её заполнить — не сказано.</li>\n<li><strong>«Липкий» и «иссушающий»</strong> (2026-01-31, id 426535) остались рабочими названиями без содержания: на вопрос «Че за липкий» ответ пришёл через полтора часа — «придумаю позже», «пока как заполнение».</li>\n<li><strong>Родитель апостолов не придуман.</strong> «Кто их родитель я так и не придумал» (2025-10-03, id 370733), повторено 2025-12-17: «А их него родителя я так и не придумал».</li>\n<li><strong>Жизненный цикл не придуман.</strong> «Какой следующий этап в их ней жизненном цикле будет я не знаю» (2025-10-03, id 370733); «Апостолы не люди. Их ней цикл жизни я не придумал» (2025-12-17, id 399521).</li>\n<li><strong>Что происходит со смертью апостола — осталось нерешённым.</strong> «А что произойдет если апостол умрет. Умретли он просто или переродится чем то иным» (2025-12-17, id 399522); предложена одна идея, но принята она или нет — в переписке не сказано.</li>\n<li><strong>Что такое «семя» — автор не знает сам.</strong> «я так и сам не до конца понял, что это за семя» (2025-12-17, id 399522).</li>\n<li><strong>Две версии происхождения не согласованы.</strong> Коконы против благословения правителя рая — в чате прямо не сведены; версии просто сменяют друг друга и возвращаются.</li>\n<li><strong>Как отключить предохранитель — не сказано.</strong> Фраза «Но его можно —» обрывается на середине (2025-03-19, id 305856).</li>\n<li><strong>Природа огня и вопрос про животных</strong> оставлены без ответа: на вопросы Миколая «и какая природа огня» и «и у каждого разное животное?» ответы «Не знаю» и «Нет» (2025-10-03, id 370820–370823).</li>\n<li><strong>Единица измерения «без воды — 7» не названа</strong> (2025-10-03, id 370850).</li>\n<li><strong>Остальные особенности апостолов в редакции 2026-06-02 не раскрыты:</strong> «Ну ещё несколько особенностей которых я прям здесь не скажу» (id 487009).</li>\n<li><strong>Что будет, когда Защитник откажется от человечности</strong> — вопрос поставлен и оставлен: «но что произойдет когда он откажется от человечности» (2025-12-17, id 399521).</li>\n<li><strong>Способность самого жестокого апостола</strong> запрошена и предложена в двух вариантах, но принятый вариант в переписке не назван.</li>\n<li><strong>Почему прозвище «Агрегат»</strong> — вопрос задан внутри самого текста и оставлен без ответа (2025-03-13, w0080).</li>\n<li><strong>«Логическое объяснение» апостолам в новом мире</strong> (2025-03-25, id 311180) в переписку не попало.</li>\n<li><strong>Состав артефактов апостолов не назван.</strong> Категория упомянута одной строкой при закрытии вселенной: «Ну перс и артефакты. Возможно останутся» (2025-03-25, id 310901).</li>\n<li><strong>Кто именно из апостолов сидит на Северном полюсе</strong> — не сказано (2025-05-30, id 331453).</li>\n<li><strong>Разрушительница и Воительница (<a href=\"PS-0194.html\">Воительница</a>)</strong> — по базе не подтверждено, что это одно лицо.</li>\n<li><strong>Разделение благословенных и апостолов в реестре, обещанное 2025-01-28</strong> («Сделаю сделаю»), в самих редакциях реестра так и не выполнено.</li>\n<li><strong>Обещанные мини-истории апостолов</strong> (2025-02-25) в базе представлены только объявлением плана; сам цикл историй как отдельная серия в переписке не развёрнут.</li>\n</ul></div>\n<div class=\"mnote\"><b>⚙ машинная заметка · С чего начать — не материал авторов</b>\n<p>Под несколько пробелов статьи материал уже лежит готовый и просто не подцеплен: <code>PS-0303</code> «Жизненный цикл апостолов» (3 566, вселенная Оам) — прямо под «цикл жизни я не придумал»; <code>PS-0364</code> «Дети апостолов» (3 521); <code>SP-0264</code> «Белые глаза апостолов» (2 260); <code>SP-0236</code> «Постоянное действие сил апостолов» (3 543) и <code>SP-0237</code> «Свободное придумывание способностей апостолами» (3 397) — обе под редакцию с коконами; <code>PS-0296</code> «Антиапостолы / Одержимые» (3 643); <code>IS-0069</code> «Охота апостолов» (7 421); <code>MR-0153</code> «Насекомые (источник сил)» (5 672); <code>MR-0148</code> «Новая вселенная (безымянная, переработка Апостола)» (3 372) — под пробел про «логическое объяснение» апостолам в новом мире. Все без статей, у всех ноль ссылок, у большинства вселенная помечена «неясно» — то есть материал есть, но он не приписан ни к одной редакции.</p></div>", "r": [["Воительница", "PS-0194.html"]]}, {"t": "Связи — всё вместе", "a": ["GR-0001--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0171.html\">Палач</a>, <a href=\"PS-0182.html\">Агрегат</a>, <a href=\"PS-0184.html\">Бессмертный выродок</a>, <a href=\"PS-0194.html\">Воительница</a>, <a href=\"PS-0195.html\">Масочник</a>, <a href=\"PS-0211.html\">Мальчик из братской могилы (Бессмертный)</a>, <a href=\"PS-0223.html\">Дмитрий Рутковский («Агрегат»)</a>, <a href=\"PS-0288.html\">самый жестокий апостол</a></li>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0113.html\">Апостол (вселенная)</a></li>\n<li><strong>Упоминает истории:</strong> <a href=\"IS-0013.html\">Бессмертный</a>, <a href=\"IS-0017.html\">Защитник</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0078.html\">Апостолы (Феня; список 12)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0001--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0001.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0001-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0001/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Самая дорогая дыра — <code>SL-0054</code> «Список 12 апостолов». На неё ссылаются три статьи, статьи у неё нет, а в базе под ней лежит 234 052 знака: второй по объёму необработанный кусок во всём справочнике и самый крупный из тех, на которые вообще кто-то ссылается. Запись сборная, вселенные у неё сразу четыре («7 островов», «Апостол», «Оам», «Феня»), — то есть под одним кодом собран весь сквозной проход апостолов через миры, ровно та линия, которую эта статья восстанавливает по датам вручную. Пока эти 234 килобайта не разобраны, любое утверждение о составе группы держится на реестрах, выложенных в чате, а не на базе.</p>\n<p>Следом — сами реестры: <code>SL-0051</code> (9 834) и <code>SL-0053</code> (20 313) по шесть ссылок каждая, <code>SL-0090</code> (5 492) и <code>SL-0089</code> (1 753) по четыре. Ни одной статьи на четверых. Раздел «Состав» этой статьи целиком построен на их редакциях, и пробел «разделение благословенных и апостолов в реестре так и не выполнено» проверяется именно по ним.</p>\n<p>Третье — поимённый состав. Из четырнадцати позиций реестра 2025-05-14 отдельные записи в базе есть у семи: Имитатор, Агрегат, Разрушительница-Воительница, Палач, Защитник, Бессмертный выродок, Масочник. У остальных семи — Дитя света, Хулиган, Вибрация, Ученица, Сон, Небесная, Маэстро — в базе нет вообще ничего, ни статьи, ни исходника. Из поздних имён так же нет <code>Кура</code> и <code>Избранного</code> (список 2026-02-09, id 430400). Заведены, но без статей: <code>PS-0323</code> Граф (7 851, ноль ссылок — при том что в статье он столп героев, один из двух сильнейших и один из трёх с придуманным путём), <code>PS-0298</code> Звездочёт (1 946), <code>PS-0376</code> Маура (4 634), <code>PS-0375</code> Доима, дочь Имета (9 036, три ссылки). Пробел «поимённого состава на 21 позицию нет» — это не только авторская незавершённость, это ещё и половина известных имён, до которых база не дошла.</p>\n<h3>С чего начать</h3>\n<p>Сначала база, архив потом.</p>\n<p>Под несколько пробелов статьи материал уже лежит готовый и просто не подцеплен: <code>PS-0303</code> «Жизненный цикл апостолов» (3 566, вселенная Оам) — прямо под «цикл жизни я не придумал»; <code>PS-0364</code> «Дети апостолов» (3 521); <code>SP-0264</code> «Белые глаза апостолов» (2 260); <code>SP-0236</code> «Постоянное действие сил апостолов» (3 543) и <code>SP-0237</code> «Свободное придумывание способностей апостолами» (3 397) — обе под редакцию с коконами; <code>PS-0296</code> «Антиапостолы / Одержимые» (3 643); <code>IS-0069</code> «Охота апостолов» (7 421); <code>MR-0153</code> «Насекомые (источник сил)» (5 672); <code>MR-0148</code> «Новая вселенная (безымянная, переработка Апостола)» (3 372) — под пробел про «логическое объяснение» апостолам в новом мире. Все без статей, у всех ноль ссылок, у большинства вселенная помечена «неясно» — то есть материал есть, но он не приписан ни к одной редакции.</p>\n<p>Обещанные мини-истории: <code>SL-0058</code> (2 662, одна ссылка) — прежде чем писать, что цикл не развёрнут, надо прочесть эту запись. Организационная надстройка вся со статьями и подцеплена: <code>MR-0138</code> АЗИП, <code>MR-0139</code> контракт агента, <code>PS-0277</code> агент АЗИП, <code>MR-0122</code> агенты, <code>PS-0279</code> правитель рая.</p>\n<p>В архив — за двумя вещами. Первое: позиция 7 в списке 2026-02-09, id 430400, и появление Куры и Избранного — смотреть вокруг этого id, что именно заменило Масочника. Второе: 2025-03-25, id 311180 — «перенёс апостолов и уже придумал им логическая объяснения». В переписку объяснение не попало, но окно w0084 стоит просмотреть целиком: перенос состоялся в тот же день, что и закрытие вселенной, объяснение могло уйти в соседние сообщения.</p>\n<h3>Как развивалось</h3>\n<p>2025-01-28 — заявили одной репликой и с чисто служебным мотивом: «Давай благословенный Богом это апостооы, чтобы различать». Тогда же поставлена задача развести их в реестре и получено «Сделаю сделаю». 2025-03-19 — 2025-05-31 — ограничили, плотно и сразу со всех сторон: 21 на весь мир, четыре базовых способности, уникальность через необработанный сгусток, предохранитель в голове, срок жизни десять лет, лечить и влиять на разум нельзя. Забыли обещанное разделение: во всех редакциях реестра 2025 года раздел по-прежнему озаглавлен «Благословенный», заголовок «Апостолы:» появляется только 2025-05-14, через три с половиной месяца, и без единого слова об этом. Вернулись — многократно и в другом качестве: 2025-09-12 коконы, 2025-09-17 съеденное насекомое и белые глаза, 2025-10-20 Оам-мутанты, 2025-10-22 возврат насекомых, 2026-04-25 мир без энергии, 2026-06-02 проект Нимба. Каждый возврат — с новым происхождением и без сведения с предыдущим. Собственный комментарий к этому ходу дан 2026-04-25: «Ну я их везде пихаю».</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Нагрузка на агента посчитана: «Каждый агент может быть куратором только для 10 людей». Апостолы в той же вертикали стоят прямо над агентами и сами их вербуют — но сколько агентов приходится на одного апостола, есть ли там своя норма или её нет вовсе, не сказано. На прямой вопрос «и сколько уже таких агентов» ответ «Дохера», то есть общее число тоже открыто. Для нижнего звена вертикали правило есть, для верхнего — при том что вертикаль строится именно от апостолов — такого правила не проговорено.</p>\n<h3>Отклик</h3>\n<p>Самое сильное здесь — не система, а способ, которым автор с ней обращается. Апостолы шесть раз меняют природу: благословенные правителя рая, насекомые из коконов, съевшие насекомое, мутанты Оам, сверхлюди без сил, искусственный проект Нимба, — и каждый раз это не переписывание, а переезд. Группа снимается с одного объяснения и ставится на другое, как мебель, которую перевозят из квартиры в квартиру: стены другие, стол тот же. Причины при этом всегда бытовые и названы вслух — «мне в падлу придумывать всех 21», «я для каждого придумывал отдельную способность, из-за чего ограничивал их число», «Нравится мне они». Меня зацепило именно это несовпадение масштабов: мир перестраивается целиком, потому что двадцать одного персонажа лень придумывать. И ещё «и кстати почему их 21?» — «Я хуй знает», — где число, вокруг которого полтора года держалась вся арифметика силы, оказывается ничем не обосновано и от этого не рушится. Вымысел тут живёт не за счёт согласованности, а за счёт того, что кто-то к нему привязан.</p></div>", "r": []}];</script>
