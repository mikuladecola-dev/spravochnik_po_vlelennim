<script>const BASE="";const DOCNAME="Объединение двух миров";
const LEAD="<p>Предыстория вселенной «7 островов»: столкновение и сращивание двух миров — фэнтезийного и современного. Варианты названия у авторов: «1мир + 1 мир = 1 новому миру», «объединенный мир». Всё обсуждение уложилось в один вечер (2024-07-03, id 194798–194890, окно w0041).</p>";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0019-S01", "MR-0019--ustroystvo"], "h": "<p>Исходно существовали два мира: «Фэнтези мир» и «современные» (2024-07-03, id 194801). На вопрос, что имеется в виду под разными мирами — планеты, измерения или конкретно жители, — Слава отвечает: «Альтернативный мир», затем уточняет: «2 разных измерения» (id 194866–194869).</p>\n<p>Механика соединения описана так: «Представь 2 планеты столкнулись ( из за этого в каждом мире произошли трещины в пространстве который их соединила ) и по итогу спустя 8 лет стали одним целом» (id 194871). Дверей или порталов как отдельного объекта нет — соединяют именно трещины в пространстве, возникшие в каждом из миров.</p>\n<p>Причина столкновения не выбрана. Названы три кандидата: «Объединения миров который мог произойти из-за современного либо из за фэнтези либо 3 лицами» (id 194854).</p>\n<p>Восемь лет — это одновременно срок объединения и срок войны: «Эти миры объединялись 8 лет / И в это время шла война между этими двумя мирами» (id 194854). Миколай отмечает символичность цифры — «ой 8 лет, символичненько», «ну обычно так говорят про спецоперацию», «где ты был 8 лет», «можно это обыграть» (id 194855, 194858–194862). Как именно обыграть — в переписке не сказано.</p>\n<p>Результат объединения — взаимный обмен: «Теперь мир объединился / Из за этого люди получили энергию другого мира а другой мир получил технологий» (id 194864). Итоговая формула Славы: «1мир + 1 мир = 1 новому миру» (id 194865).</p>\n<p>География объединённой территории: на вопрос, будет ли современный мир на континенте, Слава отвечает — «Объединенный будет где то современный где то тяп ляп» (id 194809). На вопрос, полностью ли фэнтезийны острова, ответ: «Объединения современного с фэнтезийном» (id 194811). То есть острова тоже смешанные, а не чисто фэнтезийные.</p>\n<p>Правило силы: магии в мире нет. «Там нет магии» (id 194880). Вместо неё — энергия: «Фэнтези мир есть энергий ( способности)» (id 194882). Люди из современного мира могут ею пользоваться — на прямой вопрос «а современные могут их юзать?» ответ «Да» (id 194883–194884).</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0019-S02", "MR-0019--naselenie"], "h": "<p>«Люди и ещё надо добавить разных видов» (id 194878). Какие именно виды — на этом этапе не названо, задача оставлена открытой.</p>\n<p>В том же окне обсуждаются духи и феи как раса (в связанном материале по режимам правления островов), но в самой ветке про объединение миров состав рас не назван.</p>\n<p>Состояние мира на текущий момент повествования: войны уже нет, но полного мира тоже не планируется. На вопрос Миколая, мирно ли сейчас, Слава отвечает: «Нет конечно я сделаю так чтобы хотя бы 3 острова воевали» (id 194888, 194890).</p>\n<p>Отдельно упомянуты будущие силы в мире: «Ну там будет преступная организации» (id 194887) и «Наверное будут группа сверх людей» (id 194889). Ни та, ни другая на этом этапе не разработаны.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0019-S03", "MR-0019--mesto-vo-vselennoy"], "h": "<p>Это предыстория самой вселенной «7 островов» — объединённый мир и есть тот мир, в котором находятся семь островов. Сильнейший человек на острове называется защитником: «Это типо просто сильней челик на острове его называют защитником» (id 194851).</p>\n<p>Миколай задаёт вопрос, почему сильнейшие с разных островов не объединятся (id 194852–194853). Прямого ответа в переписке нет; Слава говорит про существующие связи между ними: «Вообще многий из них знакомы друг с другом / А некоторые союзники типо имитатор союзник нуара» (id 194856).</p>\n<p>Главный герой на этом этапе не выбран: на вопрос «так а кто гг вообще» ответ — «Не знаю» (id 194885–194886).</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0019-S04", "MR-0019--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-07-03 (id 194798–194811).</strong> Первая формулировка: «Два мира столкнулись и начали объединяются» — фэнтезийный и современный. Определяется характер объединённой территории («где то современный где то тяп ляп») и островов (смешение современного с фэнтезийным). В этом же куске Миколай сбрасывает набросанный нейросетью список существ — блуждающий огненный гриб, дриада-великан десяти метров ростом с корой и мхом вместо кожи, Юкиона с миниганом, стреляющим сосульками, — и сразу помечает: «хз, нейронка быстро набросала» (id 194802, 194804). Как этот список соотносится с миром, в этой версии не обсуждается.</p>\n<p><strong>Версия 2 — 2024-07-03 (id 194850–194875).</strong> Проработана механика: три возможных виновника объединения, восемь лет объединения = восемь лет войны, два измерения, столкновение планет, трещины в пространстве. Появляется формула «1мир + 1 мир = 1 новому миру» и обмен «энергия ↔ технологии». Реакция Миколая на механику — «ну так это же капец ваще», «как так то» (id 194873–194874), после чего тему сворачивают: «ладно», «опустим» (id 194875–194876).</p>\n<p><strong>Версия 3 — 2024-07-03 (id 194876–194890).</strong> Правила силы и населения: магии нет, есть энергия (способности), люди из современного мира ею пользоваться могут. Население — люди плюс неопределённые «разные виды». Ставится вопрос о главном герое и текущем состоянии мира.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0019-S05", "MR-0019--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Причина столкновения миров не выбрана — из трёх вариантов (современный мир, фэнтези, третьи лица) не назван ни один как окончательный.</li>\n<li>Как обыгрывается символика восьми лет — обозначено намерением «можно это обыграть», решения нет.</li>\n<li>Состав рас не назван: «Люди и ещё надо добавить разных видов».</li>\n<li>Главный герой не определён («Не знаю»).</li>\n<li>Преступная организация и «группа сверх людей» упомянуты, но не разработаны.</li>\n<li>Не сказано, что стало с трещинами в пространстве после того, как миры «стали одним целом».</li>\n<li>Не сказано, чем закончилась восьмилетняя война и кто в ней победил.</li>\n<li>Не объяснено, почему сильнейшие с разных островов не объединяются — вопрос задан, ответ не дан.</li>\n<li>Существа из нейросетевого списка (огненный гриб, дриада-великан, Юкиона с миниганом) в этой ветке в мир не встроены.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0019--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0019--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-03</td>\n<td>194798–194811</td>\n<td>w0041</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-03</td>\n<td>194850–194875</td>\n<td>w0041</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-03</td>\n<td>194876–194890</td>\n<td>w0041</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0019-obedinenie-dvuh-mirov.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0019--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0019.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
