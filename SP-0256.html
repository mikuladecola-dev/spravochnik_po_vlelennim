<script>const BASE="";const DOCNAME="Контракт на «души»";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0256-S01", "SP-0256--mehanika"], "h": "<p>Механика обмана сверхлюдей Фени (<a href=\"SP-0257.html\">Сверхлюди Фени</a>). Отец заключил с ними контракт на «души» и «просто не выполняет условия контракта» (2025-12-09, id 394817). Обман состоит не в изъятии чего-либо, а в неисполнении обязательств второй стороной.</p>\n<p>Кавычки в названии подчёркнуто важны и являются частью формулировки. Когда Миколай спросил «типа как демоны?» и «а как душу забрать?» (id 394829, 394831), Слава ответил «Прочитай снова» и «Видишь кавычки 😏» (id 394830, 394833). То есть буквальные души предметом контракта не являются, слово в контракте стоит не в прямом значении.</p>\n<p>Написание в переписке — «Контракт на \"души\"» (id 394827).</p>", "r": [["Сверхлюди Фени", "SP-0257.html"]]}, {"t": "Ограничения и цена", "a": ["S02", "SP-0256-S02", "SP-0256--ogranicheniya-i-cena"], "h": "<p>Правило мира, ограничивающее саму возможность сделок с душами (2025-12-09, id 394843–394847): «Душа всегда принадлежит человека. Её нельзя отнять или купить». Дальше — усиление через иерархию: «Даже Бог на такое не способен», «Что говорить уже о Отце».</p>\n<p>На прямой вопрос «а как душу забрать?» (id 394831) ответ — «Не как» (id 394840).</p>\n<p>Из этого следует, что механика контракта не может работать через реальное отчуждение души ни для кого, включая Отца. Отец в этой иерархии стоит ниже Бога.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0256-S03", "SP-0256--nositeli"], "h": "<p>Одна сторона контракта — Отец, он заключает контракт и не исполняет его условия. Другая сторона — сверхлюди Фени (<a href=\"SP-0257.html\">Сверхлюди Фени</a>), обманутая сторона.</p>", "r": [["Сверхлюди Фени", "SP-0257.html"]]}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0256-S04", "SP-0256--kak-menyalas-po-versiyam"], "h": "<p><strong>2025-12-09, версия 1 (id 394812–394833).</strong> На вопрос «а как наебали» (id 394812) Слава отвечает про неисполнение условий контракта и вводит формулировку «Контракт на \"души\"» с настоянием на кавычках. Параллельно в этом же куске идёт разговор об Иисусе и о том, что говорящий «мог быть шизиком. И сказать все что попало. И люди в это поверили бы» (id 394824) — к механике контракта прямо не привязано.</p>\n<p><strong>2025-12-09, версия 2 (id 394840–394847).</strong> Добавлено правило мира: душу нельзя отнять или купить, она всегда принадлежит человеку, и это не под силу даже Богу, тем более Отцу. Первая версия не отменяется — второе подпирает первое: контракт на «души» не может быть контрактом на настоящие души.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0256-S05", "SP-0256--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Сверхлюди Фени (<a href=\"SP-0257.html\">Сверхлюди Фени</a>) — те, кто обманут этим контрактом. Запись отнесена как часть к Отцу.</p>", "r": [["Сверхлюди Фени", "SP-0257.html"]]}, {"t": "Пробелы", "a": ["S06", "SP-0256-S06", "SP-0256--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Что именно является предметом контракта вместо душ — не сказано.</li>\n<li>Условия контракта не названы: что Отец обещал и чего именно не выполняет, осталось нерешённым.</li>\n<li>Не сказано, что сверхлюди отдавали или делали по контракту со своей стороны.</li>\n<li>Не сказано, когда и при каких обстоятельствах контракт заключался.</li>\n<li>Не сказано, знают ли сверхлюди о неисполнении.</li>\n<li>Соотношение Бога и Отца в этой вселенной затронуто только сравнением возможностей, отдельно не разобрано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0256--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0257.html\">Сверхлюди Фени</a></li>\n<li><strong>Упомянут в способностях:</strong> <a href=\"SP-0257.html\">Сверхлюди Фени</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0080.html\">Сверхлюди (Феня)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0256--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-12-09</td>\n<td>394812–394833</td>\n<td>w0113</td>\n<td>Феня (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-09</td>\n<td>394840–394847</td>\n<td>w0113</td>\n<td>Феня (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0256-kontrakt-na-dushi.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0256--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0256.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
