<script>const BASE="";const DOCNAME="Дариус Баллив";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0356-S01", "PS-0356--proishozhdenie"], "h": "<p>Главный герой главы 1 истории «Сумасшедший где-то?», присланной Славой в окне w0119 (2026-02-20, id 435083–435085). Персонаж появляется целиком внутри текста; отдельного обсуждения по нему в окне нет.</p>\n<p>«Это был Дариус Баллив старший сын дворянской семьи Баллив». Возраст задан приблизительно: «статный юноша лет 20». Семья Баллив названа дворянской, больше о ней ничего не сказано — ни о родителях, ни о младших детях, ни о владениях.</p>\n<p>О себе он говорит одно и то же дважды, и оба раза одинаково. При первой встрече с отрядом: «— посланик Божией — ответил Дариус. Широко улыбаясь, ведь он правда был посланником Божьим, только не их Бога.» И в конце сцены, умирающему Дену: «— Ден я же говорил уже — Дариус улыбнулся и развернувшись к Дену распахнул руки — Посланик Божьей». Чей он посланник — какой это Бог, и какого Бога отряд считает своим, — в переписке не сказано.</p>\n<p>Также он говорит о себе как о представителе некоего руководства. Ден делает вывод: «теперь не было сомнения, что он от руководства». Сам Дариус говорит «не тебе решать, что может быть значимой потери для нас» — то есть «нас», организация, за ним стоит, но она не названа.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0356-S02", "PS-0356--vneshnost"], "h": "<p>«Статный юноша лет 20». Одежда дорогая — это отмечено дважды: нож в сердце «портя дорогую одежду», и потом он безуспешно пытается свести пятно платком.</p>\n<p>Лицо открыто, в отличие от семерых из отряда: «у каждого из них было скрыто лицо повязками и лишь глаза были видны». Постоянная деталь — улыбка: он «широко улыбался», «шире улыбнулся», «мило улыбаясь», «как всегда улыбнулся». Своя улыбка для него отдельная ценность: «\"Жаль Ден не видит мою улыбку\" Разочарованной подумал Дариус. Ведь это было одной из его лучших улыбок».</p>\n<p>После удара ножом на груди расплывается красное пятно; нож он потом вынимает сам и отряхивается.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0356-S03", "PS-0356--harakter"], "h": "<p><strong>Вежливая форма при приказе.</strong> Требования он подаёт просьбами: «— а теперь давайте на коленки — вежливо попросил их Дариус». Похвала звучит так же буднично, как и приговор: «— Молодцы. — похвалил их Дариус, попутно похлопав по плечу Дена — С этим вы справились очень хорошо, но —».</p>\n<p><strong>Проверяет и оценивает.</strong> Первую же реакцию Дена он про себя комментирует: «\"Молодец\" Промелькнула позвала в мыслях Дариуса.» Пока Ден соображает, Дариус его мысленно подгоняет: «\"Давай думай Ден, соображай и делай правильный выводы.\"» Когда Ден командует всем встать на колени, следует: «— молодчина Ден. Всё же не просто так стал командиром этого отряда».</p>\n<p><strong>Отказывает в праве думать.</strong> Оправдание одного из тройки — «сбежавший были лишь дети.... Так что думаю» — он обрывает: «— а разве вы должны думать — перебил его Дариус гордо подняв голову — у вас было лишь одна задача, и вы с ней не справились».</p>\n<p><strong>Не различает подчинённых.</strong> Обратившись к говорящему как к Клару и попав случайно, объясняется: «— что? — удивлено уставился Дариус в ответ на него — имя перепутал? Ну прости, вы все в масках, вас очень сложно отличить Клар —».</p>\n<p><strong>Соглашается, не отменяя решения.</strong> На возражение «это черезчур суровое наказание» и «это лишь дети и они не представляют опасности» он отвечает: «— да вы абсолютно правы — быстро согласился Дариус, от чего удивил всех присутствующих. — но если бы выжили только они —» и показывает пальцем на развалины, где прячется свидетель.</p>\n<p><strong>Держит себя в порядке.</strong> Перед тем как подойти к обломкам, где сидит мальчик: «Дариус замер перед обломками и начал лихорадочно поправлять одежду и пытаться убрать стереть платком красное пятно, но быстро поняв, что это бесполезное. Решил напоследок отряхнуть пыль с плеча». К мальчику он обращается с поклоном: «— здравствуйте юный герой».</p>\n<p><strong>Устаёт от процедуры.</strong> Ближе к концу торга с Деном: «— решай быстрее иначе я просто прикизу убить и твою жену и сына — произнести уставшим голосом Дариус».</p>\n<p>Единственное место, где его выражение сбивается, — реакция на страх Дена: «Дариус взглянул на него и его улыбки слегка дрогнула, но попутно замечая, как пробирка стала чуть тяжелее».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0356-S04", "PS-0356--sposobnosti"], "h": "<p><strong>Выживание после удара в сердце.</strong> Джек пробивает ему грудь ножом, и дальше: «Джек почуствовал, как вокруг пронзоного сердца Дариусу собралась мана виде оков и сердце Дариусу снова забилась.» Формулировка «мана виде оков» — единственное описание механики; как она работает, откуда берётся и есть ли у неё цена, в переписке не сказано. После этого он спокойно разговаривает, вынимает нож из груди и продолжает действовать.</p>\n<p><strong>Убийство без видимого действия.</strong> Сразу после этого: «Не успел Джек осознать ситуацию, как его голова была перевёрнутая на 180 градусов.» Чем и как это сделано, не показано.</p>\n<p><strong>Восприятие чужого взгляда.</strong> Он замечает спрятанного свидетеля раньше отряда и указывает на него: «— не чуствуюте? Прожигающий взгляд, что пытается запомнить каждую деталь вашей внешности —». Отдельная это способность или наблюдательность, не сказано.</p>\n<p><strong>Чувствительность к пробирке.</strong> Он замечает, что пробирка «стала чуть тяжелее» в тот момент, когда Ден покрывается мурашками от страха. Пробирка при этом лежит у него в руке.</p>\n<p><strong>Пробирка и её содержимое.</strong> Ден передаёт ему «стеклянную пробирку, украшенную железными узорами», внутри которой «чёрно-красная жидкость», заполнена на треть. Оценка Дариуса: «\"В принципе не плохо. С такой маленькой деревни собрать такое большое количество горечи, страха и отчаяния.\"» То есть отряд собирает горечь, страх и отчаяние, а сожжённая деревня — источник. Каким способом сбор производится, в переписке не сказано. Задача отряда сформулирована только через провал: не должно было остаться очевидцев, и место преступления должно было быть проверено.</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0356-S05", "PS-0356--svyazi-s-drugimi"], "h": "<p><strong>Ден</strong> — командир отряда сборщиков, «высокому мужчине в маске». Дариус знает его по имени заранее, знает про деревню Ликней, где живёт его семья, знает, что жена «начала пробовать готовить блюда севера», и что сын «хочет стать таким же сильным, как ты». Отношение к нему выделенное: Дариуса удивляет просьба Дена принять наказание за подчинённых («Могу ли я принять наказание вместо моих подчиненых»), и он уступает: «— кхм. Кхм.. Ладно Ден раз это ты».</p>\n<p>Наказание Дариус назначает в два хода. Сначала — убить одного члена собственной семьи: «— ты должен будешь убить одного члена своей семьи. Это и есть твоё наказание —». Потом, после указания на свидетеля, — выбор: «— должен выбрать, кому умирать. Этим троим, что позволили сбежать двум очевидцам и плохо проверили места преступления... — или твой жене, что начала пробовать готовить блюда севера. Ну или сынишки, что хочет стать таким же сильным, как ты. Решать тебе.» Ден выбирает троих и убивает их сам.</p>\n<p>В тексте есть разночтение: сначала сказано «там же проживают твоя жена и дочь?», дальше дважды — про сына («сынишки», «твою жену и сына»). Какое верно, в переписке не сказано.</p>\n<p><strong>Клар</strong> — член отряда с зелёными глазами; тот, чьё имя Дариус назвал наугад и попал. Он же просит за приговорённых («это черезчур суровое наказание») и он же даёт согласие на собственную смерть: «— командир сделайте это. Только безболезненно — проронил Клар, Дену. Но взгляд его уставился на Дариуса. Дариус лишь махнул рукой словно соглашаясь.»</p>\n<p><strong>Джек</strong> — «Стоявший ближе всего к Дариусу член этой группы». Единственный, кто уклоняется от ножей Карен, «словно ожидая подобного», и единственный, кто наносит Дариусу удар. Оценка Дариуса после воскрешения: «— Всё же Джек ты самый смышлёный из этой семёрки — спокойно произнёс Дариус — жаль только, что слабый —».</p>\n<p><strong>Карен</strong> — тот, кого Дариус вызывает одним словом («— Карен —») и кто атакует отряд ножами «из слепой зоны для группы». Ножи отравлены: «\"Ножи отравлены, они долго не протянут. Карен должен справится, как никак тройка сильнейших в этой группе уже убита.\"» Сам Карен в тексте не показан — ни внешности, ни реплик.</p>\n<p><strong>Мальчик с красными глазами</strong> — двенадцатилетний, «бледный мальчик лет двенадцати, с чёрными волосами и с алой красными глазами», прятался под обгоревшими досками. Дариус называет его целью всей операции: «\"Поэтому можно перейти к главному блюду\"». Обращение к нему: «Дариус радостно улыбнулся и поклонившись сказал — здравствуйте юный герой». Почему мальчик «юный герой» и зачем он нужен, в переписке не сказано.</p>\n<p><strong>Двое сбежавших детей</strong> — те, из-за кого отряд провалил задание. Мальчик с красными глазами — один из очевидцев («двум очевидцам»), второй в тексте не появляется.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0356-S06", "PS-0356--kak-menyalsya"], "h": "<p><strong>2026-02-20, id 435083–435085, окно w0119.</strong> Единственная версия. Персонаж введён целиком внутри присланного текста главы 1 и начала главы 2. Обсуждения, правок и других вариантов после этого в переписке нет.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0356-S07", "PS-0356--chto-s-nim-stalo"], "h": "<p>Глава 1 заканчивается тем, что Дариус разбирает обломки и здоровается с мальчиком. Ден и его соратник к этому моменту отравлены и, по расчёту Дариуса, «долго не протянут»; добивать их он оставляет Карен.</p>\n<p>Начало главы 2 — сцена в карете: «По неровной дороге, ехала роскошная карета украшеная золотыми узорами. Внутри этой трясующий кареты сидела два человека. Черноволосый мальчик, что уставился в пол и слегка подпрыгивал из-за скачки кареты, и мужчина, что не сводил глаз с мальчика.» Мужчина по имени не назван; что это Дариус, в тексте прямо не сказано.</p>\n<p>Дальше главы 2 в переписке нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0356-S08", "PS-0356--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вселенная в чате не названа; принадлежность к «Иссекаю» проставлена по дате объявления.</li>\n<li>Чей он посланник — какой Бог за ним стоит и чем этот Бог отличается от «их Бога» — не сказано.</li>\n<li>Организация, от которой он действует («не тебе решать, что может быть значимой потери для нас»), не названа.</li>\n<li>Механика маны не объяснена: как собираются «оки» вокруг сердца, есть ли у этого цена или предел, в переписке не сказано.</li>\n<li>Как Джеку свернуло голову — не показано.</li>\n<li>Способ сбора «горечи, страха и отчаяния» в пробирку не описан; неясно и то, почему пробирка тяжелеет при чужом страхе рядом.</li>\n<li>Зачем нужен мальчик с красными глазами и почему он «юный герой» — осталось нерешённым.</li>\n<li>Карен в тексте не показан — ни внешности, ни реплик, ни того, кто он Дариусу.</li>\n<li>Судьба Дена, его соратника и его семьи после конца главы 1 не описана.</li>\n<li>Разночтение «дочь» / «сын» в описании семьи Дена не разрешено.</li>\n<li>Семья Баллив упомянута только как дворянская; родители, родня, положение семьи не описаны.</li>\n<li>Персонажи Ден, Клар, Джек, Карен и мальчик с красными глазами существуют только внутри текста, отдельного обсуждения по ним в окне нет.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0356--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0085.html\">Дворянская семья Баллив</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0084.html\">Отряд Дена (семеро в масках, сборщики)</a>, <a href=\"GR-0085.html\">Дворянская семья Баллив</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0005.html\">Иссекай</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0356--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-02-20</td>\n<td>435083–435085</td>\n<td>w0119</td>\n<td>Иссекай (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0356-darius-balliv.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0356--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0356.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
