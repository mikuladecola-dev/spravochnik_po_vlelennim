<script>const BASE="";const DOCNAME="Вирус пришельцев";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0048-S01", "MR-0048--ustroystvo"], "h": "<p>Мир, в котором Землю захватили пришельцы. Отправная точка сеттинга — реплика Славы: «Мир захватили пришельцы и распылили вирус который убил некоторых людей а некоторым дал способности» (2024-08-07, id 215636). При этом «пришельцы даже так были недовольны им, нужна была ещё более подходящая ДНК» (id 215636).</p>\n<p>Зачем пришельцам более подходящая ДНК — вопрос, который сам Слава ставит вслух: «Вопрос нахуй им более подходящая днк» (id 215637). В ответ Миколай выдаёт два развёрнутых списка вариантов (id 215638, 215639, дословно приведены ниже в разделе «Как менялся по версиям») и просит: «если из этого ничего, тогда ты согласен на то чтобы я попробовал на свой лад переиначить представление о космических туристах?» (id 215640), «ток ты не скипай эти идеи, а вдумайся хорошенько» (id 215641). Прямого согласия или отказа Славы на это предложение в переписке нет — вместо ответа на него Слава формулирует собственное объяснение.</p>\n<p>Версия Славы: «Земля для пришельцов это грубо говоря песочница где они проводят опыты и просто наблюдают» (id 215642). Вопрос про особую ДНК он повторяет отдельно ещё раз: «И вопрос был что за особую ДНК ищет пришельцы в людях» (id 215643) — сам ответ, какая именно ДНК нужна пришельцам, в прочитанном куске переписки не даётся.</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0048-S02", "MR-0048--naselenie"], "h": "<p>Люди делятся вирусом на две группы: тех, кого он убил, и тех, кому «дал способности» (id 215636). Отдельно выделен гг с особой ДНК: «Сам сюжет гг особый ДНК его хватают потом он сбегает и ныкается в разных местах попутно сражаясь, добывает информацию, раскрывает секреты, устраивать бунты» (id 215644).</p>", "r": []}, {"t": "Место во вселенной — как связан с другими мирами", "a": ["S03", "MR-0048-S03", "MR-0048--mesto-vo-vselennoy"], "h": "<p>В переписке этот мир напрямую назван «Мир, захваченный пришельцами»: пришельцы — внешняя сила, для которой Земля — «песочница», где они «проводят опыты и просто наблюдают» (id 215642).</p>\n<p>Материал относится к вселенной, объявленной 2024-07-31 (id 214143), — имени в переписке ей не дали, дальше она фигурирует просто как «новая вселенная». Прочитанный кусок про вирус пришельцев датирован 2024-08-07 (окно w0050) и содержательно не пересекается с апокалипсисом/грибницей той же вселенной, описанной в версии от 2024-07-31 (<a href=\"MR-0044.html\">апокалипсис (новая вселенная)</a>): единый ли это сеттинг или отдельный набросок в рамках необозначенной вселенной — в переписке не проговорено.</p>", "r": [["апокалипсис (новая вселенная)", "MR-0044.html"]]}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0048-S04", "MR-0048--kak-menyalsya-po-versiyam"], "h": "<ul>\n<li>2024-08-07, версия 1 (id 215636–215644): единственная зафиксированная версия. Отправная точка — вирус пришельцев, убивающий одних и дающий способности другим. Попутно Миколай предлагает два списка альтернативных целей изменения ДНК пришельцами:</li>\n<li>(id 215638) «Создание \"сверхлюдей\" с уникальными способностями», «Разработка биологических интерфейсов для связи с технологиями пришельцев», «Формирование коллективного сознания или телепатической сети», «Адаптация людей к жизни в экстремальных условиях (космос, другие планеты)», «Создание биологических компьютеров на основе человеческого мозга», «Достижение практического бессмертия через регенерацию клеток», «Разработка способности к метаморфозам или изменению формы тела», «Создание симбиотических отношений между людьми и инопланетными организмами».</li>\n<li>(id 215639) «Создание \"квантового сознания\", способного воспринимать многомерную реальность», «Развитие способности манипулировать фундаментальными силами вселенной», «Эволюция человечества в нематериальные энергетические сущности», «Достижение коллективного сверхразума, способного влиять на ход эволюции галактик», «Развитие способности контролировать каждую клетку тела индивидуально», «Создание внутреннего \"биологического интернета\" в человеческом теле», «Использование людей как \"биологических антенн\" для связи с параллельными вселенными», «Превращение человечества в живой инструмент для изучения темной материи и энергии».</li>\n</ul>\n<p>Эти списки не были явно приняты Славой — вместо них закрепилась его короткая формулировка про Землю-«песочницу» и наблюдение/опыты пришельцев.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0048-S05", "MR-0048--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Какая именно «более подходящая ДНК» нужна пришельцам, в переписке не сказано — вопрос ставится дважды (id 215637, id 215643) и остаётся без ответа.</li>\n<li>Согласие Славы на предложение Миколая «переиначить представление о космических туристах» (id 215640) в переписке не зафиксировано.</li>\n<li>Связь этого мира с миром <a href=\"MR-0044.html\">апокалипсис (новая вселенная)</a> (апокалипсис/грибница той же необозначенной вселенной) не проговорена — один ли это сеттинг или два отдельных наброска, не сказано.</li>\n<li>Что дальше происходит с гг после того, как он «сбегает и ныкается... добывает информацию, раскрывает секреты, устраивать бунты» (id 215644), в прочитанном куске не описано.</li>\n</ul></div>", "r": [["апокалипсис (новая вселенная)", "MR-0044.html"]]}, {"t": "Связи — всё вместе", "a": ["MR-0048--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0044.html\">апокалипсис (новая вселенная)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0048--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-07</td>\n<td>215636–215644</td>\n<td>w0050</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0048-virus-prishelcev.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0048--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0048.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
