<script>const BASE="";const DOCNAME="Глаза-черви";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0254-S01", "SP-0254--mehanika"], "h": "<p>Признак глаз: зрачки «будут словно состоять из тысячи маленьких червячков и вечно двигаться» (2025-12-04, id 392478). Движение постоянное, не прекращающееся.</p>\n<p>Задуманный эффект на смотрящего — «вызывая отвращения и страх» (2025-12-04, id 392478). Во второй заход того же дня Слава уточнил, как это выглядит вблизи: «Типа это вроде нормальный зрачок. Но если пригляделся то там словно движутся черви. Из-за возникает чувство отвращения, ну и чувство жути» (2025-12-04, id 392667). То есть на расстоянии зрачок читается как обычный, эффект возникает только при разглядывании.</p>\n<p>Мера страшности задана сравнением с другими парами глаз: «в моей голове эти глаза страшные. Страшнее просто белых или радужных» (2025-12-04, id 392663).</p>\n<p>Природа впечатления описана формулой «Словно это что-то не понятное» (2025-12-04, id 392670) — реплика идёт в переписке вперемежку с посторонним обсуждением, но по смыслу продолжает описание глаз.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S02", "SP-0254-S02", "SP-0254--nositeli"], "h": "<p>Коты. Отдано им сразу при заявке: «( будет у котов)» (2025-12-04, id 392478).</p>\n<p>Про самих носителей в том же окне сказано: «Коты наверное буду типо духами. Будут чисто из Оэм состоять» (id 392486), и следом — «Поэтому запас и понимания Оэм у них больше всех» (id 392489). Связь этого свойства котов с самими глазами-червями в переписке не проговорена.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S03", "SP-0254-S03", "SP-0254--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-12-04, id 392474–392492.</strong> Заявка внутри перечня «трёх пар глаз»: зрачки из тысячи маленьких червячков, вечно двигаются, вызывают отвращение и страх, будут у котов.</p>\n<p><strong>Версия 2 — 2025-12-04, id 392649–392674.</strong> Тот же день, вечер. Развёрнуто в ответ на реплику Миколая о том, что вопрос не в том, как написано, а в том, «как персонаж это реализует» (id 392654). Добавлено: издали зрачок нормальный, черви видны только при разглядывании; глаза страшнее белых и радужных; ощущение — «что-то не понятное».</p>\n<p>Первая формулировка второй не отменена, вторая её дополняет.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S04", "SP-0254-S04", "SP-0254--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Одна из «трёх пар глаз», перечисленных вместе (2025-12-04, id 392478):</p>\n<ul>\n<li>«Первые белые апостола. Способны видеть оэм ну ещё чего-нибудь»;</li>\n<li>глаза-черви — у котов;</li>\n<li>«Радужные глаза только для одного челика».</li>\n</ul>", "r": []}, {"t": "Пробелы — чего в переписке нет", "a": ["S05", "SP-0254-S05", "SP-0254--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Не сказано, даёт ли способность что-либо носителю (зрение, восприятие) или это только внешний признак и воздействие на смотрящего. Про белые глаза функция названа («способны видеть оэм»), про глаза-червей — нет.</li>\n<li>Не сказано, у всех ли котов такие глаза.</li>\n<li>Ограничения и цена не названы — про них в переписке ничего.</li>\n<li>Кто такой «один челик» с радужными глазами, не назван.</li>\n<li>Формулировка про белые глаза оборвана самим автором: «Способны видеть оэм ну ещё чего-нибудь» — что именно ещё, осталось нерешённым.</li>\n<li>Написание материи в этом окне — «Оэм»/«оэм», в других местах «Оам»; соотнесение вариантов в переписке не оговорено.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0254--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0057.html\">Коты (девять котов)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0254--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-12-04</td>\n<td>392474–392492</td>\n<td>w0112</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-04</td>\n<td>392649–392674</td>\n<td>w0112</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0254-glaza-chervi.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0254--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0254.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
