<script>const BASE="";const DOCNAME="Церковная власть Асгарда";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0032-S01", "MR-0032--ustroystvo"], "h": "<p>Церковная власть Асгарда — верхушка, которой подчиняется защитник Асгарда. Разговор начался с вопроса Миколая о том, кому защитник подотчётен: «надо бы ещё обозначить че за хуи им дёргают», «под кем он ходит» (2024-07-05, id 198016–198017).</p>\n<p>Ответ Славы — «Религия» (id 198018), и следом формулировка её задачи, произнесённая от лица самой этой власти: «Нам нужно истребить всех тех в кого вселился демон всех тех кого не понимает нашего бога мы должны очистить мир для спасения его».</p>\n<p>Число управляющих обсуждалось прямо: «Сколько их будет», «3 достаточно или больше» (id 198019–198020) — Миколай: «достаточно» (id 198021). Итого верхушка — трое.</p>\n<p>Из троих расписан один: «1 точно главный священник то бишь святой отец» (id 198022). Варианты имени этой фигуры в записи — «главный священник», «святой отец». Остальные двое не придуманы.</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0032-S02", "MR-0032--naselenie"], "h": "<p>Отдельно не описано; речь идёт только о правящей верхушке из трёх человек и о защитнике, которого она «дёргает».</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0032-S03", "MR-0032--mesto-vo-vselennoy"], "h": "<p>Запись отнесена к части «Асгард». Связана с сущностями «Асгард», «Защитник Асгарда (Избранный)» и «Религия Асгарда». Отношение к защитнику — управляющее: он «ходит под» этой верхушкой.</p>\n<p>Сразу после назначения главного священника Миколай задал вопрос о боге: «а кай че за хуй», «и где он», «бог», «получается» (2024-07-05, id 198023–198026). Ответа в этом фрагменте нет.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0032-S04", "MR-0032--kak-menyalsya-po-versiyam"], "h": "<p>Версия одна — 2024-07-05, окно w0044, сообщения 198015–198026, около 00:51–00:54. Структура задана сразу: трое наверху, один из них — главный священник (святой отец), который и дёргает защитника.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0032-S05", "MR-0032--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Двое из трёх не придуманы — в записи отмечено прямо: «Двое из трёх не придуманы».</li>\n<li>Кто такой Кай и где он находится — вопрос задан (id 198023–198025), ответ в переписке отсутствует.</li>\n<li>Бог Асгарда упомянут вопросительно, не описан.</li>\n<li>Как именно церковная власть «дёргает» защитника — механика не расписана.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0032--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в мирах:</strong> <a href=\"MR-0031.html\">Религия Асгарда</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0027.html\">Церковь Асгарда</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0032--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-05</td>\n<td>198015–198026</td>\n<td>w0044</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0032-cerkovnaya-vlast-asgarda.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0032--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0032.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
