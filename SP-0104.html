<script>const BASE="";const DOCNAME="гены рыбочеловека";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0104-S01", "SP-0104--mehanika"], "h": "<p>Наследуемая мутация, попадающая к человеку от рыболюдей. Придумана целиком в один заход (2024-08-17, id 220209–220220, окно w0053).</p>\n<p>Схема передачи такая: отец носителя плавал в месте, где обитают рыболюди, и один из них укусил его в ключицу. Дальше — дословно: «в семяпроводе через кровь или молочные железы проникли гены рыбочеловека». Сын родился уже с генами.</p>\n<p>Автор сразу снимает вопрос о правдоподобии механизма: «мне похуй насколько это реалистично, такой концепт интересен и можно его запихнуть сюда, ты сможешь доработать может если не нравится».</p>\n<p>Что гены дают носителю, названо двумя пунктами: тяга к каннибализму и физические способности. Именно ради наблюдения за этими двумя вещами охотник и проводит над носителем опыты.</p>\n<p>Способность придумана не сама по себе, а как ответ на вопрос «кто это?» внутри наброска новой истории о похищении — «типо машина подъезжает накидывает мешок и уводит». Похитителем в том же разговоре назван спасатель: «ясен хуй спасатель», «он же ебанутый на голову».</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0104-S02", "SP-0104--ogranicheniya-i-cena"], "h": "<p>Прямо ограничения не проговорены. Проговорены последствия для носителя: рыболюди знают о том, что он существует с их генами; охотник допрашивал одного такого монстра, узнал историю и после этого «начал охоту уже на человека», а затем «начал над ним опыты проводить и наблюдать за каннибализмом и физическими способностями».</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0104-S03", "SP-0104--nositeli"], "h": "<p>Один носитель — «чел с генами рыбочеловека», сын укушенного. Сам укушенный отец носителем генов не назван: гены проникли через него к ребёнку, что происходит с ним самим, в переписке не сказано.</p>\n<p>Источник генов — рыболюди.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0104-S04", "SP-0104--kak-menyalas-po-versiyam"], "h": "<p>Версия 1 — 2024-08-17 (id 220209–220220, окно w0053). Единственное состояние: механизм передачи (укус в ключицу, дальше кровь / семяпровод / молочные железы), врождённость у сына, каннибализм и физические способности как проявление, охотник и опыты. Позже к способности не возвращались.</p>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S05", "SP-0104-S05", "SP-0104--otklonennye-varianty"], "h": "<ul>\n<li>Первый вариант передачи гена — через семя рыболюда: «кто-то из них кончил, но это в твоей вселенной кринж, ток что укусил отца этого чела в ключицу». Вариант отброшен прямо по ходу реплики и заменён укусом в ключицу.</li>\n<li>Более ранний вариант того, кем может быть персонаж, из которого выросла способность: «я бы сказал что это обычный человек, которому делать нехуй, думать постоянно о похитителях». Отклонён на месте: «но ты не этого ждёшь, да и я чёт тоже поинтереснее хочу».</li>\n<li>Сама формулировка предложена с оговоркой о возможной доработке соавтором («ты сможешь доработать может если не нравится»); доработки в переписке не последовало.</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S06", "SP-0104-S06", "SP-0104--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Точный список физических способностей не проговорён.</li>\n<li>Как именно проявляется тяга к каннибализму — не сказано.</li>\n<li>Передаются ли гены дальше, следующему поколению, — не сказано.</li>\n<li>Что стало с укушенным отцом — не сказано.</li>\n<li>Какие именно опыты проводит охотник и чем это кончилось — осталось нерешённым.</li>\n<li>Внешние признаки мутации не названы: неизвестно, отличается ли носитель от обычного человека.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0104--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0038.html\">Рыболюди</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0104--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-17</td>\n<td>220209–220220</td>\n<td>w0053</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0104-geny-rybocheloveka.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0104--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0104.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
