<script>const BASE="";const DOCNAME="Пророки каменные («Проротой каменный челике», Поротаи)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0064-S01", "GR-0064--chto-eto"], "h": "<p>Раса-сообщество каменных людей во вселенной Оам. В переписке название пишется по-разному: «Проротой каменный челике» (2025-11-17, id 385768; 2025-12-06, id 393287), «Поротай», «Поротой», «Поротая», «Поротаи», «высший Поротай», «низший Поротай», «каменные существа». Написания в чате между собой не сведены — единого варианта авторы не установили.</p>\n<p>Разведка отнесла это к группам, и в переписке есть основание и для группового чтения, и для видового: Слава называет Поротаев то «вид» («Придумал один вид Поротай», 2024-04-02, id 152575), то «раса» («Кто у нас как раса есть Поротой Азуриэль Апостолы Одержимый», 2025-09-18, id 366586). Как сообщество с внутренним подчинением и с собственным имуществом они описаны в перечне сил мира: «Проротой каменный челике. Владеют преступное организацию. Некий союз с апостолами» (2025-11-17, id 385768).</p>\n<p>Отдельно надо отметить сдвиг в том, к чему прикреплено само слово «Поротай». В ранних версиях Поротай — это человек, съевший жука: «есть жуг ты его съедаеш» (2024-04-02, id 152575). В версиях 2025-10-20 (id 376401) и 2025-11-05 (id 382108) раздел прямо начинается с «Поротай / Это мутировавший жук если его съесть человек то у него 3 варианта» — то есть Поротаем назван и сам жук. Обе формулировки в переписке сосуществуют, выбор между ними не сделан.</p>\n<p>Преступная организация, которой Поротаи владеют, собственного названия в переписке не получила.</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0064-S02", "GR-0064--sostav"], "h": "<p>Поимённого состава нет: ни один Поротай в переписке не назван по имени. Сообщество делится на две ступени, обе описаны:</p>\n<ul>\n<li><strong>Низший Поротай</strong> — «горбатого двух лицого, полукаменного-полуплоти, и ты теряешь личностей и слушаещя высшего Поротая» (2024-04-02, id 152575). В версии 2025-10-20 (id 376401) то же место записано как «двух ликого» и «слушаешь высшего Поротая».</li>\n<li><strong>Высший Поротай</strong> — «сохраняешь свой человеческий образ и личность» (2024-04-02, id 152575).</li>\n</ul>\n<p>Численность ни низших, ни высших не названа. Соотношение между ступенями не оговорено.</p>", "r": []}, {"t": "Общие способности группы", "a": ["S03", "GR-0064-S03", "GR-0064--obschie-sposobnosti-gruppy"], "h": "<p>Общая для всех — способ появления. Человек съедает жука, и дальше «у тебя 3 варианта» (2024-04-02, id 152575; повторено 2024-06-03, id 175810; 2025-03-26, id 311279; 2025-09-17, id 366035; 2025-10-20, id 376401; 2025-11-05, id 382108):</p>\n<ol>\n<li>«смерть, все твои внутренности превращаются в камень и отказывают»;</li>\n<li>«превращаются в низший Поротай»;</li>\n<li>«превращается высшего Поротая».</li>\n</ol>\n<p>Механика вынесена в отдельную запись базы как «Превращение через поедание Поротая» (<a href=\"SP-0246.html\">Превращение через поедание Поротая</a>, 2025-11-05, id 382108).</p>\n<p>Жук в ранних версиях называется «жуг» (2024-04-02, id 152575), с 2025-10-20 (id 376401) — «мутировавший жук». В списке насекомых, которые Слава предлагал добавить, отдельным пунктом стоит «Каменный жук» (2025-09-18, id 366585).</p>\n<p>Общее у обеих ступеней — регенерация и сверхсила. У низшего: «крепкость, реген, сверхсила». У высшего: «реген, контроль над низшими, превращать части тела в твердый камень, сверхчеловеческая сила» (2024-04-02, id 152575).</p>\n<p>Слава отдельно проговорил, что разрыва между ступенями по способностям почти нет: «Поротая низший владеет почти идентичными способностями Поротая высшего» (2024-04-02, id 152603).</p>\n<p>Шанс каждого из трёх исходов в переписке не назван. Для апостолов такой процент оговорён («шанс выживания после его съедения 13 процентов», 2025-09-17, id 366034), для Поротаев — нет.</p>", "r": [["Превращение через поедание Поротая", "SP-0246.html"]]}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0064-S04", "GR-0064--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p>Различия проходят ровно по линии низший/высший.</p>\n<p><strong>Низший.</strong> Теряет личность. Облик меняется: горбатый, двуликий (в записи 2024 года — «двух лицого», в записи 2025-10-20 — «двух ликого»), полукаменный-полуплоть. Подчинён высшему. Способности: крепкость, регенерация, сверхсила.</p>\n<p><strong>Высший.</strong> Сохраняет человеческий образ и человеческую личность. Способности: регенерация, контроль над низшими, превращение частей тела в твёрдый камень, сверхчеловеческая сила.</p>\n<p><strong>Дебафф высшего.</strong> «Дебафф у тебя появляется вторая личность жестокая, кровожадная, алочная и т.д. И она составляет чаще всего становится жестоким кровожадным и т.д» (2024-04-02, id 152575). В версии 2025-10-20 (id 376401) «алочная» записано как «алчная». Дебафф в тексте привязан к третьему варианту, то есть к высшему; для низшего отдельного дебаффа не названо — впрочем, низший и так теряет личность.</p>\n<p>Никаких индивидуальных, отличающих одного Поротая от другого способностей в переписке нет.</p>", "r": []}, {"t": "Иерархия", "a": ["S05", "GR-0064-S05", "GR-0064--ierarhiya"], "h": "<p>Иерархия двухступенчатая и односторонняя: низший «слушаещя высшего Поротая» (2024-04-02, id 152575), а у высшего в списке способностей прямо стоит «контроль над низшими». Кто из высших главный, есть ли среди высших своя лестница, как решаются споры между высшими — в переписке не сказано.</p>\n<p>Кем внутри Поротаев управляется принадлежащая им преступная организация — тоже не сказано.</p>\n<p>Место Поротаев в общей иерархии сил мира Оам зафиксировано в разборе расстановки (2025-12-06, id 393287): сильнейшие — коты, «Апостолы 21 вторая по силе раса на земле», а дальше «расы и организации который равны по силе с друг другом», и в этом третьем ярусе перечислены Проротой наряду с Детьми мирового древа, Азуриэлями, группировкой сестры, правительской организацией, церковью с паладинами, организацией Виктора, пернатыми, вампирами и Аскизами.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S06", "GR-0064-S06", "GR-0064--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>Апостолы.</strong> «Некий союз с апостолами» (2025-11-17, id 385768; повторено 2025-12-06, id 393287). Слово «некий» стоит в исходнике — содержание союза не расписано. Отдельно оговорено соотношение сил: «Но апостолы сильнее поротоя» (2025-09-17, id 366177).</p>\n<p><strong>Азуриэль.</strong> Азуриэли — «природный охотник Апостолов», поскольку главная сила апостолов — «сверх чувства и восприятия (то есть самое главное нервная система и мозг)». Против Поротаев эта охота работает хуже: «При этом против Поротой они не так эффективны» (2025-09-17, id 366175). Миколай на это переспросил про слово «природным» (id 366178); дальше в окне тема не продолжена.</p>\n<p><strong>Преступная организация.</strong> Ею Поротаи владеют (2025-11-17, id 385768). Ни имени, ни структуры, ни состава организации в переписке нет.</p>\n<p>Отношений с остальными силами мира Оам — котами, Детьми мирового древа, вампирами, Аскизами, церковью, орденом убийц котов — в переписке не названо.</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S07", "GR-0064-S07", "GR-0064--kak-menyalas"], "h": "<p><strong>2024-04-02 (id 152572–152578).</strong> Слава выкладывает вид целиком, первым же блоком: жуг, три исхода, облик и способности низшего, облик и способности высшего, дебафф второй личности. Тут же спрашивает: «Какую ещё способность добавить к выше Поротаем» (id 152576).</p>\n<p><strong>2024-04-02, вечер (id 152598–152606).</strong> Обсуждение дополнительной способности. Миколай: «Ты точно чет хочешь добавить у Поротая как по мне и так много способностей, а концепцию ты придумал, в чем вопрос не пон» (id 152599). Слава объясняет мотив: «Поротая низший владеет почти идентичными способностями Поротая высшего вот поэтому я думал может ещё че добавить» (id 152603) — и оставляет вопрос открытым: «Концепцию та я придумал ну ты можешь туда что нибудь добавить типо объект или вид или способность или т.д». Дополнительная способность высшему так и не добавлена: ни в этом окне, ни в последующих версиях набор способностей не меняется.</p>\n<p><strong>2024-06-03 (id 175805–175815).</strong> Слава напоминает: «Помнишь про каменных существ» (id 175807). Миколай не помнит («Неа», id 175808; «Напомнишь?», id 175809). Слава пересылает то же описание дословно (id 175810). Разговор идёт в потоке о «Новом мире»; переносится ли Поротай именно туда или просто вспоминается как старая наработка — не проговорено.</p>\n<p><strong>2025-03-26 (id 311278–311281).</strong> То же описание переслано снова, в контексте «Я уже сказку составляю о новом мире» (id 311278). Вселенная прямо не названа.</p>\n<p><strong>2025-09-17, утро (id 366034–366036).</strong> Описание вновь переслано, теперь рядом с апостолами и вопросом «Откуда взялись эти насекомые и монстры» (id 366036).</p>\n<p><strong>2025-09-17, день (id 366175–366178).</strong> Уточнение баланса: апостолы сильнее Поротаев, Азуриэли против Поротаев работают хуже, чем против апостолов.</p>\n<p><strong>2025-09-18 (id 366583–366586).</strong> Поротой числится среди рас вселенной: «Кто у нас как раса есть Поротой Азуриэль Апостолы Одержимый» (id 366586). В списке насекомых, которых предлагается добавить, появляется «Каменный жук» (id 366585).</p>\n<p><strong>2025-10-20 (id 376399–376403).</strong> Поротай встроен в общее описание мира Оам вместе с апостолами, аскизами, детьми мирового древа, азуриэлями и вампирами. Здесь Поротаем назван сам жук: «Это мутировавший жук если его съесть человек то у него 3 варианта». Мелкие правки текста: «двух ликого» вместо «двух лицого», «слушаешь» вместо «слушаещя», «алчная» вместо «алочная».</p>\n<p><strong>2025-11-05 (id 382108).</strong> Тот же блок повторён; из него отдельной записью базы выделена механика трёх исходов (<a href=\"SP-0246.html\">Превращение через поедание Поротая</a>).</p>\n<p><strong>2025-11-17 (id 385768–385769).</strong> Новое: у Поротаев появляются собственность и внешняя политика. «Проротой каменный челике. Владеют преступное организацию. Некий союз с апостолами». Связь этого «Проротоя» с прежним «Поротаем» по смыслу очевидна, но прямо в окне не проговорена.</p>\n<p><strong>2025-12-06 (id 393286–393296).</strong> Тот же перечень сил повторён дословно, дальше идёт разбор сторон конфликта. Поротаи в разбор добрых, промежуточных и основных злодеев не попадают — среди промежуточных злодеев названы Дети мирового древа, клан крылатых, церкви, люди и Виктор, среди основных — дочь Имитатора и Бог красок.</p>\n<p><strong>2026-02-06 — 2026-02-07 (id 429348–429816).</strong> Миколай собирает документ по ОЭМ для нейросети. Слава замечает: «Че то мало информация оказывается о ОЭМ» (id 429386), Миколай признаёт: «ой, ч не все чет кинул видимо» (id 429387), позже — «я еще пару раз лоханулся и не скинул всё прям» (id 429807). Попал ли в этот документ материал по Поротаям, из переписки не видно: содержание документа только по внешним ссылкам.</p>", "r": [["Превращение через поедание Поротая", "SP-0246.html"]]}, {"t": "Пробелы", "a": ["S08", "GR-0064-S08", "GR-0064--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет: ни одного Поротая по имени в переписке не названо. Список участников в плане пуст.</li>\n<li>Численность расы и соотношение низших и высших не названы.</li>\n<li>Шансы трёх исходов при поедании жука не названы.</li>\n<li>Содержание союза с апостолами не раскрыто — сказано только «некий союз».</li>\n<li>Преступная организация, которой Поротаи владеют, не имеет ни названия, ни описания структуры; кто ею руководит внутри иерархии Поротаев, не сказано.</li>\n<li>Дополнительная способность высшему Поротаю, о которой Слава спрашивал 2024-04-02 (id 152576), так и не была придумана — вопрос остался нерешённым.</li>\n<li>Внутри ступени высших иерархия не описана: есть ли главный, как высшие соотносятся между собой — не сказано.</li>\n<li>Отдельного дебаффа для низшего не названо.</li>\n<li>Написания «Проротой», «Поротай», «Поротой», «Пророки каменные» в чате не сведены к одному варианту.</li>\n<li>Не решено, что именно называется Поротаем — человек после превращения или сам мутировавший жук; в переписке есть обе формулировки.</li>\n<li>Где Поротаи живут, как организованы территориально, есть ли у них своя местность — не сказано.</li>\n<li>К какой вселенной вид приписан, менялось: в 2024-04-02 вселенная прямо не названа (запись базы относит окно к «игре бога»), в 2024-06-03 разговор идёт про «Новый мир», в 2025-03-26 вселенная не названа, к 2025-10-20 Поротай числится в Оам.</li>\n<li>Роль Поротаев в конфликте (добро, промежуточные злодеи, основные злодеи) при разборе сторон 2025-12-06 не определена.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0064--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0246.html\">Превращение через поедание Поротая</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0051.html\">Поротаи (низшие и высшие)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0007.html\">Новый мир</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0064--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0064.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0064-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0064/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Самое дорогое здесь — не пробел в мире, а раздвоение кода. <code>PS-0036</code> «Поротай»: четыре ссылки, 38 750 знаков базы, вселенных сразу четыре — «игра бога», «Новый мир», Оам, «вне вселенной». <code>MR-0169</code> «Пророки каменные»: тоже четыре ссылки, но 8 328 знаков, и ссылаются на него соседи по третьему ярусу сил Оам — <code>MR-0171</code> «Правительственная организация по контролю» (4 ссылки), <code>MR-0174</code> «Пернатые» (4 ссылки), <code>VS-0008</code>. Один вид описан под двумя кодами в разных вселенных, и статей на него тоже две: эта и <code>GR-0051</code> «Поротаи (низшие и высшие)» («игра бога»). Пока «Проротой каменный челике» из перечня 2025-11-17 не сведён с «Поротаем» 2024 года, каждая ссылка соседей ведёт в половину материала — и та половина, куда ведут ссылки, впятеро тоньше.</p>\n<p>Второе — преступная организация. У неё нет кода вообще: ни статьи, ни записи в базе, ни строки в числах, потому что назвать её нечем. При этом это единственная внешняя политика расы, кроме «некоего союза». Дыра, у которой нет id, в цифрах не видна совсем. Для сравнения, на 7 островах такая же сущность заведена дважды и подробно: <code>MR-0026</code> «Преступная организация» (4 ссылки, 12 802) и <code>GR-0026</code> «Пресрог».</p>\n<p>Третье — <code>PS-0294</code> «Низший Поротай» (3 195) и <code>PS-0295</code> «Высший Поротай» (3 221), обе без статьи, обе во вселенной «неясно», плюс <code>ID-0160</code> «Каменный Поротой» (2 859). Ноль ссылок на всех трёх: две ступени, на которых держится вся иерархия статьи, лежат в базе неподключёнными.</p>\n<h3>С чего начать</h3>\n<p>В базе, и разбор дешёвый. <code>PS-0294</code>, <code>PS-0295</code>, <code>ID-0160</code> — это те же исходы поедания жука, разложенные по отдельным записям; <code>SP-0246</code> «Превращение через поедание Поротая» (7 753) — механика; <code>SP-0052</code> «Жуг» (2 ссылки, 7 471) — само насекомое, заведённое в «игре бога». Сведение этих пяти кодов с <code>PS-0036</code> и <code>MR-0169</code> закрывает вопрос «что называется Поротаем — человек или жук» без похода в архив: обе формулировки уже лежат в базе, просто под разными сущностями.</p>\n<p>В архив — за тремя вещами.</p>\n<ul>\n<li>2024-04-02, вечер, id 152598–152606. Там Слава объясняет, зачем ему дополнительная способность высшему, и отдаёт вопрос соавтору: «ты можешь туда что нибудь добавить». Смотреть ленту после 152606 — в собранном материале ответа нет, а вопрос прожил полтора года.</li>\n<li>2025-11-17, id 385768–385769, окно w0109. Момент, где у расы внезапно появляются собственность и союз. Ни подготовки, ни продолжения; читать окно целиком — откуда взялась организация.</li>\n<li>2026-02-06 — 2026-02-07, id 429348–429816. Сборка документа по ОЭМ, где Слава говорит «Че то мало информация оказывается о ОЭМ», а Миколай признаёт «я еще пару раз лоханулся и не скинул всё прям». Здесь смотреть не реплики, а вложения: попал ли в документ материал по Поротаям и что именно не попало.</li>\n</ul>\n<h3>Как развивалось</h3>\n<p>Заявили в один вечер и целиком: 2024-04-02 вид выложен первым же блоком — жуг, три исхода, облики, способности обеих ступеней, дебафф. Ограничил его в тот же вечер сам автор, и не механикой, а признанием: «Поротая низший владеет почти идентичными способностями Поротая высшего вот поэтому я думал может ещё че добавить». Проблема названа вслух, помощь запрошена, ничего не добавлено. Дальше полтора года вид не переписывается, а пересылается — 2024-06-03, 2025-03-26, 2025-09-17, 2025-10-20, 2025-11-05: тот же текст, меняются только опечатки («алочная» на «алчная», «двух лицого» на «двух ликого») и вселенная вокруг него. Вернулись 2025-11-17, и возврат добавил не свойства, а положение: организация, союз с апостолами, место в третьем ярусе. 2025-12-06 — снова дословный повтор. Единица развития здесь — пересылка, а не редакция.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для апостолов названо, кто их природный охотник и почему: Азуриэли, потому что главная сила апостолов — «сверх чувства и восприятия (то есть самое главное нервная система и мозг)». Правило собрано: охотник подобран под устройство силы жертвы. Для Поротаев из той же реплики известен только результат — «против Поротой они не так эффективны», — а основания нет, хотя устройство их силы описано не хуже апостольского: камень, регенерация, сверхсила, потеря личности у низшего. Место, где правило названо для одной расы и не применено к соседней, стоящей в том же перечне.</p>\n<h3>Отклик</h3>\n<p>Три исхода одного действия — умер, стал низшим, стал высшим — самая экономная вещь в этой статье: одна фраза, и уже есть и риск, и сословие, и подчинение. Зацепило, что автор в тот же вечер сам увидел, где конструкция проседает: если низший почти равен высшему по силе, то цена превращения нигде не отражена, — и что за полтора года это осталось единственной попыткой что-то в ней поправить. И ещё одна вещь, которую они, по-моему, построили, не проговорив: низший теряет личность сразу, высший получает вторую, жестокую, и она «чаще всего» побеждает. Это одна и та же потеря на разных скоростях, и разница между ступенями оказывается не в том, что с тобой случится, а в том, как долго ты будешь это наблюдать. Отдельно смешное и грустное: текст пересылается снова и снова человеку, который каждый раз отвечает «Неа» на «Помнишь про каменных существ».</p></div>", "r": []}];</script>
