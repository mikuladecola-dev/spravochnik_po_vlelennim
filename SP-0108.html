<script>const BASE="";const DOCNAME="эфир писателя";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0108-S01", "SP-0108--mehanika"], "h": "<p>Прямая трансляция, которую писатель ведёт прямо во время работы. Второе имя в файле — просто «эфир».</p>\n<p>Эфир идёт фоном к происходящему: писатель разговаривает со спасателем, занимается пойманным монстром и одновременно находится в эфире. Из этого следуют два свойства, названные в переписке (2024-08-26, id 224940):</p>\n<ul>\n<li>При включённом эфире нельзя говорить лишнего. Спасатель обрывает разговор фразой «ну не в эфире же» — в ответ на попытку писателя обсудить Стокгольмский синдром вслух.</li>\n<li>Эфир можно остановить. Спасатель проверяет это перед тем, как говорить по делу: «ты эфир остановил?». Писатель отвечает «нет», спасатель реагирует «тогда че ты спрашиваешь!?», и писатель останавливает эфир: «ладно всё, я остановил». Только после этого спасатель объясняет, почему пленник — монстр.</li>\n</ul>\n<p>Способ включения и выключения не описан, площадка трансляции не названа, зрители в переписке не появляются.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0108-S02", "SP-0108--ogranicheniya-i-cena"], "h": "<p>Цена в переписке показана на конкретном проколе. Писатель сказал что-то при третьем лице, не остановив эфир, и понял это задним числом: «стоп. Киппер. ну ты же при нём это сказал. он теперь понял что мы в эфире».</p>\n<p>Дальше цена разворачивается через отсутствие подходящего средства: «а вызывать амнезию не одно из наших веществ не умеет. че делать теперь». Ответ спасателя — «да не ссы, есть пара народных методов», и обсуждается кирпич по голове. То есть последствие ошибки с эфиром закрывается физически, а не препаратом.</p>\n<p>Второе ограничение — дисциплина разговора: пока эфир идёт, спасатель отказывается обсуждать дела и требует внимательности («внимательнее будь, но»).</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0108-S03", "SP-0108--nositeli"], "h": "<p>Писатель. В файле способность отнесена к нему («часть чего: писатель»). Эфир ведёт он, он же его останавливает по требованию спасателя. Спасатель эфир не ведёт, но говорит о нём как о совместном риске («он теперь понял что мы в эфире» — реплика писателя, но во множественном числе).</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0108-S04", "SP-0108--kak-menyalas-po-versiyam"], "h": "<p>Версия одна.</p>\n<ul>\n<li>2024-08-26, id 224940, окно w0055. Первое появление механики: эфир идёт во время работы, его можно остановить, при включённом эфире нельзя говорить лишнего; из-за эфира посторонний узнаёт лишнее, и возникает вопрос об амнезии.</li>\n</ul>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0108-S05", "SP-0108--svyaz-s-drugimi-sposobnostyami"], "h": "<ul>\n<li>Вещества спасателя (<a href=\"SP-0109.html\">вещества спасателя</a>). Прокол с эфиром напрямую упирается в арсенал: амнезию вещества не вызывают, поэтому решение уходит в «народные методы». Обе способности описаны в одном и том же сообщении (2024-08-26, id 224940).</li>\n<li>Голубец (пойманный монстр). Разговор, из-за которого понадобилось останавливать эфир, начался с того, что голубец признаётся писателю в любви и объясняет это Стокгольмским синдромом.</li>\n<li>Спасатель. В файле указан среди связанных сущностей: именно он контролирует, включён эфир или нет.</li>\n</ul>", "r": [["вещества спасателя", "SP-0109.html"]]}, {"t": "Пробелы", "a": ["S06", "SP-0108-S06", "SP-0108--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Где идёт эфир — площадка, сервис, формат — не назван.</li>\n<li>Есть ли у эфира аудитория, кто её составляет, сколько зрителей — в переписке не сказано.</li>\n<li>Кто такой Киппер, при котором была произнесена лишняя фраза, в самом тексте не пояснено; навигационная сводка файла относит эту роль к пленнику, но прямо в переписке это не сказано.</li>\n<li>Что именно понял Киппер и чем это грозит — не раскрыто.</li>\n<li>Как эфир включается и останавливается технически — не описано.</li>\n<li>Есть ли у эфира собственные эффекты, кроме риска сказать лишнее (например, влияние на монстров), — не сказано.</li>\n<li>Чем закончилась история с амнезией и был ли эфир после этого возобновлён — осталось нерешённым.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0108--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0109.html\">вещества спасателя</a></li>\n<li><strong>Упомянут в способностях:</strong> <a href=\"SP-0109.html\">вещества спасателя</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0108--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-26</td>\n<td>224940–224940</td>\n<td>w0055</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0108-efir-pisatelya.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0108--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0108.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
