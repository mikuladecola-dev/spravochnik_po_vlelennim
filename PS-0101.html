<script>const BASE="";const DOCNAME="Анчи";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0101-S01", "PS-0101--proishozhdenie"], "h": "<p>Персонаж не соавторов, а стороннего автора — Ани Мареевой, которая ведёт свой телеграм-канал и сама рисует (на планшете). В переписке Миколая и Славы Анчи появляется 2024-06-30 (окно w0040, id 191684–191734) как пересланный материал: Миколай пересылает Славе кусок своего диалога с автором и её арты, Слава расспрашивает.</p>\n<p>Из-за способа пересылки весь текст диалога в базе идёт под именем Миколая — реплики автора и реплики Миколая перемешаны в одном потоке и по подписи не различаются. Дальше в переписке подпись «Слава» появляется только начиная с id 191712, когда пересылка кончается и начинается собственный разговор соавторов.</p>\n<p>Вселенная, к которой персонаж принадлежит у своего автора, не названа. Вписывания Анчи во вселенную «7 островов» в переписке нет.</p>\n<p>Из пересланного диалога: Анчи — основной и самый проработанный персонаж автора. Дословно: «анчи самый известный персонаж и его больше всех он интересует, у меня нет другой мотивации, чтобы прописывать и других». Прочие персонажи прописаны меньше — «конечно, может там перс кайоши и лэршэль больше прописаны, но тоже интерес не тянет, если люди не интересуются и я не хорошо поразмышляю».</p>\n<p>Автор ассоциирует себя с персонажем и называет себя его именем: «сам персонаж мне в душу запал, поэтому и я себя кличу как Анчи». Миколай описывает это осторожнее: «Например персонаж с которым себя ассоциирует немного», «Или много», «Не знаю».</p>\n<p>Варианты написания имени, встречающиеся в материале: Анчи, anchiiqk, анчи. В подписи к арту ко дню рождения персонажа — «С ДНЮХОЙ ТЕБЯ АНЧЮЧА!!». Дата этого дня рождения в переписке не названа.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0101-S02", "PS-0101--vneshnost"], "h": "<p>Словесного описания внешности в переписке нет — показаны только арты (пометки #арт в id 191716, 191723, 191724 и далее в id 191782–191789). Единственная характеристика внешности дана Славой обобщённо, про персонажей этого автора в целом: у них есть исключительная черта во внешности.</p>\n<p>Про сами арты в переписке сказано, что среди них есть «сборная солянка» и «редрав референса», а также поздравительный арт ко дню рождения персонажа. Автор жалуется на передачу цвета: «во первых я в рот ебала цветовосприятие на телефоне, во-вторых это выглядело лучше, пока рисовала, вот бля буду».</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0101-S03", "PS-0101--harakter"], "h": "<p>В переписке не описан. Обсуждается не характер персонажа, а метод его прописывания: автор говорит, что ей «нравится прописывать некоторые мелочёвки у персонажей, чем просто пихать какие-то факты, которые могут быть непонятны и необоснованы», и что короткое понятно каждому.</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0101-S04", "PS-0101--sposobnosti"], "h": "<p>Способности не названы. Запись связана с принципом прописывания персонажей без способностей.</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0101-S05", "PS-0101--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Кайоши</strong> и <strong>Лэршэль</strong> — другие персонажи того же автора, названы как прописанные больше остальных, но всё равно меньше Анчи.</li>\n<li><strong>Мэри</strong> — числится в связях записи; в приведённых кусках переписки связь не раскрыта.</li>\n<li><strong>Ви</strong> — реальный человек, не персонаж: читатель, чей интерес к Анчи держится годами. Дословно: «есть человек по имени Ви, у которого интерес упал на Анчи ещё на протяжении долгих годов». Ви названа автором того самого арта, показанного в id 191785. С Ви автор познакомилась не через приложения, в отличие от остальных.</li>\n<li>Окружение автора, названное в разговоре: Крис, Шеги, Энфи — знакомство через Пони Таун (ПТ), «общее увлечение из одних фандомов»; упоминается «магма» как место, где собираются: «в магме мало кто собирается, мы только спрашиваем, будут ли они с нами или нет, тогда уже и начинается».</li>\n</ul>\n<p>Отдельно в диалоге сформулирована зависимость проработки персонажей от реакции аудитории: Миколай спрашивает «Получается реакция людей на персонажей определяет и на твой интерес к персонажам?», автор отвечает «именно», добавляя, что «не только от него зависит», потому что персонаж запал ей в душу.</p>", "r": []}, {"t": "Как менялся", "a": ["S06", "PS-0101-S06", "PS-0101--kak-menyalsya"], "h": "<p><strong>2024-06-30, id 191684–191734.</strong> Пересылка диалога с автором и первых артов. Зафиксировано: Анчи — самый известный и самый проработанный персонаж автора; остальные прописаны меньше из-за отсутствия мотивации и интереса аудитории; автор ассоциирует себя с персонажем и зовётся его именем. Названы Кайоши и Лэршэль. Названа Ви и её многолетний интерес к персонажу.</p>\n<p><strong>2024-06-30, id 191782–191796.</strong> Показ дальнейших артов (арт ко дню рождения, арт авторства Ви, «сборная солянка», «редрав референса») и рассказ об окружении автора. Слава реагирует: «Пиздец завидно», и на уточнение «Скиллу или связям» отвечает: «Скиллу. На связь похую». Тут же отмечено наличие у этих персонажей исключительной черты во внешности.</p>\n<p>Между двумя версиями содержание карточки персонажа не менялось — вторая добавляет только материал по артам и окружению.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0101-S07", "PS-0101--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Внешность словами не описана — только арты, содержание которых в переписке не пересказано.</li>\n<li>Характер, биография, возраст, пол персонажа не названы.</li>\n<li>Способности не названы.</li>\n<li>Вселенная, к которой персонаж принадлежит, не названа; во вселенную «7 островов» он не вписывался.</li>\n<li>Связь с Мэри не раскрыта.</li>\n<li>Дата дня рождения персонажа, отмеченного артом, не названа.</li>\n<li>Кто такие Кайоши и Лэршэль по существу — не сказано, названы только как менее проработанные персонажи того же автора.</li>\n<li>Из-за формата пересылки в записи невозможно по подписи отделить реплики автора от реплик Миколая.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["PS-0101--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-06-30</td>\n<td>191684–191734</td>\n<td>w0040</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-06-30</td>\n<td>191782–191796</td>\n<td>w0040</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0101-anchi.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0101--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0101.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
