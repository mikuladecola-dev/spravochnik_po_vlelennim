<script>const BASE="";const DOCNAME="Два рассказчика";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0161-S01", "PS-0161--proishozhdenie"], "h": "<p>Две безымянные фигуры, от лица которых идёт текст «люди смертны и это так потрясающе» (2024-10-20, id 247842–247843, окно w0062). Первый ведёт монолог о праве на смерть и рассказывает историю про девочку в степи; второй перебивает его и возражает по всем пунктам. Собственных имён у обоих нет ни в одной версии; в переписке они называются «рассказчик», «расказчики», «другой рассказчик», «авторы».</p>\n<p>Статус обоих внутри истории Миколай уточнил на следующий день (2024-10-21, id 248119–248145): «ваще левые типы». Главный герой — не они: «гг девушка», «а это можно сказать авторы». Слава сказал «Рассказчик» — Миколай поправил во множественном числе: «расказчики».</p>\n<p>Первый рассказчик начинает с общего рассуждения: «люди смертны и это так потрясающе! ещё с древности идут разговоры об экзистенциальных вопросах, по типу мементо мори, тобиж напутствие \"помни о смерти\", которое прямо указывает, знать что ты смертный». Он говорит, что «тривиальное \"быть или не быть\" это не самый свободный выбор, ведь ты не сможешь быть вечно», что религии говорят о перерождении, рае и аде, что «существо в низу распоряжаться твоей душой и твоим фатумом», и что даже у неверующего исход наступает только после смерти: «некоторые действительно попадают куда-то, некоторые исчезают на всегда, но только после смерти». Отсюда его основной тезис: «смерть это не просто награда, это право, которое отнять не возможно. и важно его защищать». Дальше он ставит вопросы, ради которых и рассказывает историю: «но кто будет этим заниматься и точно ли это целесообразное утверждение? неужели кто-то может его отнять?»</p>\n<p>История, которую он рассказывает о себе. Около четырёхсот дней назад он встретил девочку: «у неё были яркие, но глубокие голубые глаза, пылающие красные волосы, нет, буквально пламенные, крайне плотная джинсовая куртка, черная юбка и стандартные массовые розовые колготки, обуви не было». Она рисовала на песке, он присоединился, вместе они перерисовывали триптих Босха и то, «как кронос пожирает своих детей». Выбор работ был не за ним, а за ней, и это его не удивило: «я вовсе не чёрствый, это действительно впечатляет». Необычным было другое — она была единственным живым существом в той степи. Рядом лежала женщина, чью кожу с левой лопатки девочка жевала и которая «возможно являвшаяся матерью не подавала признаки жизни»; тут же он поправляет себя: «женщиной её точно звать не стоит это вполне молодая девушка, двадцати лет».</p>\n<p>Дальше он прерывает рассказ: «простите я остановлюсь. мне было жутко, страшно. но я знаю, что о детях важно заботиться и я не подавал виду, как минимум её воспитание не моя ответственность». Он вызвал полицию и скорую, но забрали его вместе с девочкой, а женщину «они трогать не стали и не возвращались потом к ней, что довольно странно»; на все его вопросы о ней темы игнорировали. Девочку увезли на скорой «из-за пищевого отравления», его отвезли домой. Всю дорогу с ним не разговаривали, «лишь в конце попросили не поднимать эту тему в разговорах. и всё».</p>\n<p>Он решил разобраться сам и ушёл обратно в ту степь, «среди которой много руин, трупов, черепов, гнилых растений», искать остатки той женщины. Итог поисков он формулирует так: «я ошибся. хотя нет. она ошибка». Пояснение: девочка была в том месте не единственной живой — та девушка тоже жива. При этом «у неё не билось сердце, я тогда проверял. она была бездыханна и холодна. а сейчас сидит и избивает могилу какого-то парня».</p>\n<p>Вывод первого рассказчика: «какая мерзость, девушка не имеет права на смерть», «даже этот случай громко говорит о том, что она отринула смерть. она не способна умереть и это страшно, её нельзя допускать до общества». И общий смысл, ради которого история рассказана: «бывают случаи, когда кто-то лишается этого права и больше не является человеком. она монстр и нельзя этому существу быть среди людей. важно защищать право смерти. но кто это будет делать?»</p>\n<p>Второй рассказчик вступает репликой «[другой рассказчик]» прямо в том же сообщении и отвечает по каждому пункту. Его позиция: «ну ты и параноик. в смысле смерть это право? ты вообще ничего не понял после встречи с той девчонкой. смерть это навык понятное дело. она пытается обучиться и достичь цели, а ты на неё ярлыки вешаешь, мол она монстр. ты просто в голове себе надумал возможные сценарии, даже не поработав с ней». В отличие от первого, он знает её лично: «я лично знаком с ней, мы друзья. и я всегда готов её поддержать. умирать не просто и это делать куда приятнее когда рядом есть близкий и понимающий человек который тебя ценит». Он же вводит различение, обратное формуле первого: «смерть она не испытывала, но она способна на смерть».</p>\n<p>В подтверждение он приводит два случая. Первый: «помню её расстреляли с узи 16 вооружённых солдат как только она проходила мимо их територии, потом она восстановилась пришла ко мне, в слезах но с улыбкой. это был действительно прекрасный момент. ведь в этот раз она восстановилась за час, а не за 7 минут как раньше». Второй: «ещё она однажды пошла плавать во льдах Антарктиды в микро бикини. думала что её парализует, она утонет, мозг перестанет работать и восстановится не получится. но её организм зачал прогревать себя после 13 минуты это было скучно, поэтому она пошла ко мне за поддержкой».</p>\n<p>Заканчивает он собственным обязательством: «я готов быть рядом с ней и помочь научиться умирать и не позволю кому-то считать её монстром».</p>", "r": []}, {"t": "Характер", "a": ["S02", "PS-0161-S02", "PS-0161--harakter"], "h": "<p>Первый рассказчик по манере речи спокоен — на это обратил внимание Слава: «А чё сука такой спокойный». Объяснение Миколая двойное. Внешне: «ну он добряк просто». На деле: «на самом деле он перепуган до ужаса». Спокойствие объясняется двумя обстоятельствами: во-первых, он не участник сцены, а рассказчик уже задним числом — «это он пересказывает», «естественно он может эмоции отпустить»; во-вторых, в самой сцене «он делал вид что ему норм» — «чтобы не травмировать девочку». Это же сказано в самом тексте: «мне было жутко, страшно. но я знаю, что о детях важно заботиться и я не подавал виду».</p>\n<p>Слава возражением не удовлетворился: «И это не меняет того что он так спокойно подошёл к девчонки». Миколай согласился, что в тексте это не проработано: «надо было прописать лучше», «ибо понял что вообще не правильно всё сделал с рассказом с самого начала». Ответ Славы: «Ну тогда надо было чётче писать».</p>\n<p>Второй рассказчик по характеру задан только через реплику: он спорит, обвиняет первого в паранойе и надуманных сценариях, настаивает на дружбе и поддержке и берёт на себя обязательство защищать девушку от ярлыка монстра.</p>", "r": []}, {"t": "Связи с другими", "a": ["S03", "PS-0161-S03", "PS-0161--svyazi-s-drugimi"], "h": "<ul>\n<li>Девушка, отринувшая смерть — предмет спора обоих. Для первого она монстр, которого «нельзя допускать до общества»; для второго — подруга, которую он поддерживает и которой помогает «научиться умирать». Второй утверждает личное знакомство и совместные эпизоды (возвращение к нему после расстрела, обращение за поддержкой после Антарктиды).</li>\n<li>Между собой рассказчики не связаны ни знакомством, ни общей сценой. Уточнение Миколая от 2024-10-21 (id 248141): «с первым рассказчиком они скорее враги и вообще не знают друг друга, он просто через 20 лет начал комментировать его рассказ, будто в диалоге». То есть форма диалога в тексте — условная, разрыв между репликами составляет двадцать лет.</li>\n<li>Оба относятся к тексту «люди смертны и это так потрясающе» и внутри него главными героями не являются.</li>\n</ul>", "r": []}, {"t": "Как менялся", "a": ["S04", "PS-0161-S04", "PS-0161--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2024-10-20 (id 247842–247843, w0062).</strong> Появляются оба. Первый — монолог о праве на смерть, история про степь, девочку и не подающую признаков жизни девушку, вывод о монстре. Второй — врезка «[другой рассказчик]»: смерть как навык, дружба с девушкой, эпизоды с расстрелом из узи и с Антарктидой.</p>\n<p><strong>Версия 2 — 2024-10-21 (id 248119–248145, w0062).</strong> Текст не переписывался, уточнялся статус фигур в разговоре Славы и Миколая. Добавлено: оба — «ваще левые типы» и «можно сказать авторы», а не главные герои; спокойствие первого — маска при внутреннем ужасе; между рассказчиками — вражда и отсутствие знакомства, а комментарий второго отделён двадцатью годами. Тогда же Миколай признал общий просчёт построения рассказа: «понял что вообще не правильно всё сделал с рассказом с самого начала».</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "PS-0161-S05", "PS-0161--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Личность второго рассказчика автором сознательно не определена: «и я хз кто это», «я ваще не заморачивался» (2024-10-21, id 248142–248143).</li>\n<li>Имён нет ни у первого, ни у второго.</li>\n<li>Внешность обоих не описана.</li>\n<li>Не сказано, кому и при каких обстоятельствах первый рассказывает свою историю (обращение «расскажу вам историю» и «простите я остановлюсь» — единственные следы адресата).</li>\n<li>Не сказано, откуда второй знает рассказ первого и почему начал комментировать его именно через 20 лет.</li>\n<li>Не сказано, как второй познакомился с девушкой и когда.</li>\n<li>Вражда рассказчиков объявлена, но её содержание и происхождение в переписке не раскрыты.</li>\n<li>Заявленное Миколаем намерение переписать рассказ («надо было прописать лучше») в дальнейшем не реализовано в пределах окна w0062.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["PS-0161--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-10-20</td>\n<td>247842–247843</td>\n<td>w0062</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-10-21</td>\n<td>248119–248145</td>\n<td>w0062</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0161-dva-rasskazchika.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0161--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0161.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
