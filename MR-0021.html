<script>const BASE="";const DOCNAME="Остров Нуара (подводный)";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0021-S01", "MR-0021--ustroystvo"], "h": "<p>Остров Нуара — остров под водой, на дне океана. Разрабатывался в двух окнах: 2024-07-03 (id 194812–194922) и 2024-07-04 (id 196694–197107). Собственного имени у острова в переписке нет: в исходном списке островов на его месте стоят вопросительные знаки, и ни в одном окне название не звучит.</p>\n<p><strong>Расположение и форма.</strong> Остров лежит в очень глубокой яме в океане — «очень глубоко», «прям пиздец как» (2024-07-04, id 196818–196819). Форму автор описывает так: «ну тут это как яма, а я хотел сферу, но с наружи сфера так и будет выглядеть» (id 196813). Снаружи, со дна океана, это «сфера с множество трубами», «Черными трубами» (id 196820–196821). Сверху, если смотреть над водой, — поверхность океана и остров (id 196811, 196847). Есть рисунок автора, сделанный по ходу спора (id 196833, «нарисую»), в переписке он упоминается, но содержание рисунка передано только словами.</p>\n<p><strong>Барьер.</strong> Воду держит тьма Нуара: «И тьма будет держать воду как барьер» (2024-07-03, id 194815). Вода удерживается внутри сферы, наружу «типо как дым» идут каналы (2024-07-04, id 196825–196827). Барьер — это концентрированная тьма: «дым тут это тоже самое что и тьма, просто выглядит так», «это уже барьер от воды», «он сам фильтрует че каво» (id 196886–196890). Разница между барьером и каналами — в концентрации: «просто нет такой концентрации», «но концентрированный крч», «он его удерживает в форме», «а там, он просто его выделяет, там форма не требуется — лишь курс, иначе он сдохнет» (id 196892–196899). Тьма при этом не окутывает весь остров: «остров не окутывает, зато трубу» (id 196941–196945).</p>\n<p>Барьер завязан на самого Нуара, и это отмечено сразу: «Вот только если он сдохнет будет пиздец острову» (2024-07-03, id 194817). В обычном состоянии тьма жителям не мешает — «ну если в обычном состоянии ваще не действует это даже хорошо» (id 194827).</p>\n<p><strong>Давление.</strong> Выйти за барьер легко, и это смертельно: «если ты за барьер выйдешь, а это сделает просто, тебя под весом воды к ебеням раздавит» (2024-07-04, id 196744), «тя нахуй давят десятки тонн воды» (id 196757). Отсюда система каналов: «не напрямую в воду, а как бы в барьере будут подобия труб» (id 196768), альтернатива — «или выходить можно через дно» (id 196769). Формулировка перехода: «Трубы где ты проходишь через неё давления плавно поднимается» (id 196770), «с нормальным переходом давления» (id 196836).</p>\n<p><strong>Трубы.</strong> Итоговая схема автора — два вида труб (id 196922):</p>\n<div class=\"q\"><p>«так есть 2 вида труб:<br>1) внутрь для выхода в сам океан из сферы<br>2) из чистой, хаотичной тьмы, она:<br>а) сосёт воздух и фильтрует его<br>б) позволяет ресурсам и людям перемещаться между сферой и внешним миром»</p></div>\n<p>Трубы для выхода в воду «внутрь направлены» (id 196824). Каналы второго типа — «сплошнве большие каналы для фильтрации и переноса воздуха» и «транспортировки людей, ресурсов» (id 196838–196842). Как в такую трубу попадает человек: «этот дым сверху сферы, на деле идёт от его стенки и туда люди идут, а если про наружу, туда идут через порт» (id 196956); «взаимодействие газов и людей по разному происходят» (id 196959).</p>\n<p><strong>Тьма как среда.</strong> Механику тьмы автор объясняет двумя образами. Первый: «тьма это как вакуум, он насыщается одним, и убирает другое по воли нуара» (id 196937). Второй: «представь тьму как множество шариков» — их можно потрогать, в них перемещаться, а сами шарики «сосут» газ, пыль, грязь «прям сосут с себя» и могут перемещаться (id 197015–197029). Общий принцип: «считай любой газ и дым она сосёт, че не надо наружу кидает» (id 196987).</p>\n<p>Итоговая формулировка, на которой оба сошлись (id 197032, подтверждено «ну примерно так» и «короче да так», id 197034–197035):</p>\n<div class=\"q\"><p>«Тьма может поглощает все<br>С помощью этого трубы на суши качает воздух и они находятся внутри тьмы, и также люди<br>С помощью этого он может контролировать тех кто проходить через трубы<br>А сфера поглощает грязь и делает их в телесный комки и выкидывать океан»</p></div>\n<p><strong>Воздух и кислород.</strong> Кислород дают обычные растения и водоросли — «в нашем случае там дохуя обычных растений» (id 196742), водоросли тоже («конечно есть», id 196741). Работает это за счёт солнышка: «логично способность солнышка влияет на способность обычных растений выделять кислород» (id 196739). На вопрос, ускоряет ли солнце процессы жизни, ответ отрицательный: «да не, обычный фотосинтез реализует, который мне возможен во тьме под водой» (id 196746), механизм — «энергией делиться» (id 196748). Тьма при этом «сосёт его и фильтрует меж дном и атмосферой» (id 196740).</p>\n<p>Углекислый газ образуется от жизни существ и от огня: «ну то что ты жгёшь, обязательно выделяет углекислый — это правило мироздания» (id 196947–196948), «люди дышут, потребляя кислород, выделяют угль», «он создаёт вредные условия для жизни, поэтому от него надо избавляться» (id 196949–196952). Дым от костров отдельной механики не получил: «на дым вообще поебать, забудь о нём» — сказано в контексте того, что «дым» на рисунке был способом изобразить трубу, а не отдельная сущность (id 196981–196985).</p>\n<p><strong>Мусор.</strong> Газы и пыль в естественных количествах уходят в океан нормально: «ну газы в воздух уходят это норм а пыль в естественных количествах уходит» (id 197038). Перебор возникает при войне и разрушениях: «типо слишком многое придётся сосать», «дыма и пыли из-за разрушений дохуя» (id 197042–197043). Решение — собирать: «Давай вся это грязь и пыль будет собираться в одном месте и они будут её вывозить?» — «да, так оно и порешим» (id 197044–197046). Копится медленно: «ну это же не быстро копится» (id 197049).</p>\n<p>Утилизацией занимаются мета-люди: «мета людей же дохуя, может есть те, кто может как-то перерабатывать эту залупу или на крайняк сжигать бесследно» (id 197051–197053). На вопрос, на каком острове такой человек, ответ — на каждом свой, «мой варик на каждом особенный»: «на одном он отправляет эту залупу в какое-то пустое измерение», «на другом сжигает до тла», «в другом перерабатывает во что-то полезное», «в другом, уменьшает количество» (id 197058–197064). Слава закрепил такого человека за дриадой — «И он будет только у нее», «типо дриада растения за чистоту» (id 197062–197073); автор соглашается с оговоркой «ну вообще я хотел для современных, ну пускай», «только один» (id 197070–197072).</p>\n<p>Вывозом занимается корпорация — «ну там будет корпорация», «межостровная» (id 197088, 197092). Дальше добавляется сжигание мусора ради поддержания солнца: «Для поддержания солнце в ней будет сжигаться мусор», с обоснованием «Солнце это звезда которая что-то поглощает. Даже если держать её на способности вечно не выйдет» (id 197095–197099).</p>\n<p><strong>Ландшафт и обстановка.</strong> Внутри сферы есть и воздух, и вода — на вопрос «там, че вообще, воздух везде / вода» ответ «Да» (id 196731–196734). Отдельная характеристика места — «Тихо» (id 196735). Оценка места автором по ходу разработки: «вообще прикольное местечко» (id 196743).</p>\n<p><strong>Режим правления.</strong> Зафиксированы два состояния, оба сохраняются (см. раздел о версиях): федеративная республика (2024-07-03) и конституционная монархия (2024-07-04).</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0021-S02", "MR-0021--naselenie"], "h": "<p><strong>Рыба-люди.</strong> Основная часть населения: «Вообще там по большей части жить будет рыба люди» (id 196751). Давление им не мешает по рождению: «ну они рождаются уже по ебейшим весом», «и из погружение обычно плавное» (id 196752–196753).</p>\n<p><strong>Обычные жители.</strong> Живут в условиях, требующих подготовки: «ну ебать они качки там будут все, каждый с тренировками как для космонавта» (id 196774–196775). Дети — уязвимая группа: «ну детей там к хуям разорвёт, так что родители будут за этим следить» (id 196776–196777).</p>\n<p><strong>Нуар</strong> — защитник острова, он же наёмник: тьма Нуара держит барьер, и «когда чел пойдёт по своим делам наёмника, солнышко останется» (id 194834). Характеристика от Славы: «ну нуар хороший челик» (id 194920).</p>\n<p><strong>Солнышко</strong> — человек со способностью солнца. Идея появилась из проблемы еды: «Ну может там будет жить человек со способностью солнца или типо того», «Или он будет помощником» (id 194830–194831), при этом упоминается, что «У имитатор помощник есть» (id 194833). В версии 2024-07-04 солнышко — император (id 196716–196717).</p>\n<p><strong>Императорша</strong> — рыба-человек (id 196718, 196721). С солнышком у них отношения, но неофициальные: «Не официальный», «Ну хочу чтобы были» (id 196724–196726); автор называет это «симбиоз» (id 196727).</p>\n<p><strong>Мета-люди.</strong> Введены в этом же окне при разборе того, как защитник закрывает целый остров: «Защитник — сильнейший человек на острове. Есть другие мета-люди», «Он не один остров защищает», «Мета — люди с энергий», «Способностью» (id 196706–196713). Термин взят как временный: «Где то услышал», «Ну пусть будут пока мета» (id 196710–196711).</p>\n<p><strong>Фауна.</strong> На дне рыб много (id 196780, 196795–196797), кроме них — «акулы и киты ещё», «ещё губки наверное» (id 196799–196800) и «какий нибудь твари» (id 196801). Отдельной строкой стоит незакрытая заявка: «вообще в планах было страх моря реализовать» (id 196802).</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0021-S03", "MR-0021--mesto-vo-vselennoy"], "h": "<p>Остров создан как заполнение свободного уровня: «может нуара под воду пошлём? там темноты дохуя», «а то хули в небе есть кто-то, а ниже уровня земли нету никого» (2024-07-03, id 194812–194813).</p>\n<p>Ресурсно остров несамостоятелен: «так, это дно, там ваще ловить нехуй» (id 196778), «все ресурсы они берут с оазиса» — «по типу железа, газа, нефти хз» (id 196781, 196787). Итог: «они в очень развитых отношениях экономических и ресурсных с оазисом» (id 196808). Ещё до этого фиксируется общая потребность: «всё равно нужны порты коммуникации с внешним миром», «транспорт, все дела, хавать ведь надо чето, а без солнца еды норм не будет» (id 194828–194829).</p>\n<p>Связь с островом дриады — через мета-человека-утилизатора, которого Слава закрепил именно за дриадой (id 197062–197069). Вывоз мусора идёт через межостровную корпорацию (id 197088–197092).</p>\n<p>Отношения с соседями за пределами оазиса и дриады не разобраны: вопрос «а что насчёт враждующих стран, может кому-то вода ваще не нравится» (id 197101–197102) остался без ответа.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0021-S04", "MR-0021--kak-menyalsya-po-versiyam"], "h": "<p><strong>2024-07-03, id 194812–194817.</strong> Исходная идея: отправить Нуара под воду, потому что «там темноты дохуя» и потому что в небе кто-то уже есть, а ниже уровня земли нет никого. Тьма держит воду как барьер. Сразу же отмечена уязвимость: смерть защитника = конец острова.</p>\n<p><strong>2024-07-03, id 194827–194835.</strong> Экономика: тьма в обычном состоянии не действует, нужны порты связи с внешним миром и транспорт; без солнца нормальной еды не будет. Отсюда появляется человек со способностью солнца — либо житель, либо помощник; закрепляется как «солнышко», который остаётся на острове, когда Нуар уходит по делам наёмника.</p>\n<p><strong>2024-07-03, id 194919–194922.</strong> Режим правления: федеративная республика. Тоталитаризм Нуару не отдали — «ну нуар хороший челик».</p>\n<p><strong>2024-07-04, id 196694–196735.</strong> Остров описан как «вода», режим — конституционная монархия. Старое название режима не отменялось явно, просто названо новое. Разобрано, как защитники держат острова: защитник — сильнейший человек на острове, есть другие мета-люди, защитник не один остров защищает. Солнышко — император, императорша — рыба-человек, отношения неофициальные, «симбиоз». Ландшафт: воздух и вода, тихо.</p>\n<p><strong>2024-07-04, id 196736–196753.</strong> Объяснение кислорода: обычных растений и водорослей много, способность солнышка делится с ними энергией, поэтому обычный фотосинтез работает даже во тьме под водой; тьма сосёт воздух и фильтрует его между дном и атмосферой. Введены рыба-люди как основное население; они рождаются под большим весом, погружение у них плавное.</p>\n<p><strong>2024-07-04, id 196744–196777.</strong> Барьер: выйти за него легко, снаружи раздавит весом воды. Вводятся каналы — подобия труб внутри барьера, с плавным подъёмом давления; альтернативный вариант выхода — через дно. Жители — качки с тренировками как у космонавтов; детей разорвёт, за этим следят родители.</p>\n<p><strong>2024-07-04, id 196778–196808.</strong> Экономика и фауна: на дне ресурсов нет, всё берут с оазиса (железо, газ, нефть), отношения с оазисом «очень развитые экономические и ресурсные». Живность: рыбы, акулы, киты, губки, «какие-нибудь твари». Упомянут нереализованный план — «страх моря».</p>\n<p><strong>2024-07-04, id 196805–196833.</strong> Внешний вид: очень глубокая яма в океане; автор хотел сферу, и снаружи это выглядит сферой. На дне океана — сфера с множеством чёрных труб. Трубы для выхода в воду направлены внутрь; вода удерживается внутри сферы, наружу «как дым» идут каналы. Сопровождается рисунком автора.</p>\n<p><strong>2024-07-04, id 196834–197035.</strong> Длинный спор о системе труб и о выводе углекислого газа, дыма, пыли и грязи. Сходятся на версии Миколая: тьма поглощает всё, трубы находятся внутри тьмы, через них качается воздух и ходят люди, Нуар может контролировать тех, кто проходит через трубы, а сфера скатывает грязь в комки и выкидывает в океан.</p>\n<p><strong>2024-07-04, id 197036–197107.</strong> Мусорный вопрос: газы и пыль в естественных количествах уходят в океан нормально, при войне и разрушениях — перебор. Решают собирать грязь в одном месте и вывозить. Вводятся мета-люди-утилизаторы (на каждом острове свой способ), человек-утилизатор закрепляется за дриадой, вывозом занимается межостровная корпорация, а мусор сжигается для поддержания солнца.</p>", "r": []}, {"t": "Отклонённые варианты", "a": ["S05", "MR-0021-S05", "MR-0021--otklonennye-varianty"], "h": "<p><strong>Тоталитаризм для острова Нуара</strong> (2024-07-03, id 194919–194922). Режим предложили отдать Нуару, отказались со ссылкой на характер персонажа — «ну нуар хороший челик»; вместо этого острову дали федеративную республику, а «этот грех» отдали женщине.</p>\n<p><strong>Четыре вида труб</strong> (2024-07-04, id 196914, повторено id 196927). Схема Славы:</p>\n<div class=\"q\"><p>«Есть сфера в на дне океана из него выходит четыре вида трубы<br>1) для поглощения кислорода<br>2 для выкидывания углекислого газа<br>3 для людей<br>4 для выхода в океан»</p></div>\n<p>Отклонена автором мира («так», «нет», id 196929–196930) в пользу схемы из двух видов труб. Аргумент за четыре: «Ну нет слишком мало труб» (id 196935); аргумент против: «ты сейчас сам просто не понимаешь как у тебя всё сложно» (id 196965). Промежуточный вариант Славы «Кислород в сферу / Углекислый газ и дым в небо» (id 196883) тоже не прошёл.</p>\n<p><strong>Ускоренный фотосинтез от солнца.</strong> Предположение «Солнце составляет проходить более быстрый процесс жизни из за этого кислород выделяется быстрей?» (id 196745) отклонено: «да не, обычный фотосинтез реализует» (id 196746).</p>\n<p><strong>Мета-человек-утилизатор для современных.</strong> Автор хотел отдать такого персонажа современным, но уступил: «ну вообще я хотел для современных, ну пускай» (id 197070).</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "MR-0021-S06", "MR-0021--probely"], "h": "<div class=\"gaps\"><ul>\n<li><strong>Название острова не дано.</strong> Ни в одном из окон оно не звучит; в исходном списке островов на его месте стоят вопросительные знаки. Попытка назвать была: «как это назвать», «бля», «похуй, тут конституционная монархия» (id 196702–196704).</li>\n<li><strong>Как плавают рыбы внутри сферы.</strong> Вопрос задан прямо — «А как рыбы плавают?» — и назван хорошим, но ответа не получил (id 196747, 196749).</li>\n<li><strong>Сколько раз и куда возить мусор.</strong> «Вот только сколько раз им придется их возить», «И куда» (id 197047–197048) — на вопрос о частоте ответ только «ну это же не быстро копится», конкретика не названа.</li>\n<li><strong>Что получают за вывоз мусора.</strong> «Кто будет возить», «И что взамен», «у кого выгода от того что они возят всякую дичь к ней, мусор в том числе» (id 197074–197080) — выгодоприобретатель не назван.</li>\n<li><strong>Куда девать мусор на самом острове.</strong> «Нужно придумать куда мусор на своем же острове» (id 197085) — осталось нерешённым; следом идёт корпорация и сжигание в солнце, но связь между этим и внутриостровной утилизацией в переписке не проговорена.</li>\n<li><strong>Враждующие страны и отношение соседей к воде.</strong> Вопрос «а что насчёт враждующих стран, может кому-то вода ваще не нравится» (id 197101–197102) задан и остался без ответа — разговор в этом месте прервался.</li>\n<li><strong>Страх моря.</strong> Заявлено как план — «вообще в планах было страх моря реализовать» (id 196802) — и в переписке не развёрнуто.</li>\n<li><strong>Соотношение федеративной республики и конституционной монархии.</strong> Оба режима названы для этого острова в разные дни (2024-07-03 и 2024-07-04); отмены первого варианта в переписке нет.</li>\n<li><strong>Содержание рисунка.</strong> Автор нарисовал устройство сферы (id 196833), но в переписке рисунок передан только словесными пояснениями.</li>\n<li><strong>Вселенная в окне w0043 не объявлена</strong> — принадлежность к «7 островам» проставлена по дате.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0021--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0104.html\">Нуар</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0033.html\">Рыба-люди</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0021--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-03</td>\n<td>194812–194817</td>\n<td>w0041</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-03</td>\n<td>194827–194835</td>\n<td>w0041</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-03</td>\n<td>194919–194922</td>\n<td>w0041</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-04</td>\n<td>196694–196735</td>\n<td>w0043</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-04</td>\n<td>196736–196753</td>\n<td>w0043</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-04</td>\n<td>196744–196777</td>\n<td>w0043</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-04</td>\n<td>196778–196808</td>\n<td>w0043</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-04</td>\n<td>196805–196833</td>\n<td>w0043</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-04</td>\n<td>196834–197035</td>\n<td>w0043</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-04</td>\n<td>197036–197107</td>\n<td>w0043</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0021-ostrov-nuara-podvodnyy.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0021--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0021.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["MR-0021-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/MR-0021/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Самая дорогая незакрытая нить здесь — не про сам остров, а про то, что случилось с темой мусора после него. Идея «Конфликт из-за вывоза мусора» (<code>ID-0085</code>) так и не стала статьёй, хотя на неё уже ссылаются две готовые: <code>GR-0036</code> (Межостровная корпорация по вывозу мусора) и <code>VS-0001</code> (мир «7 островов», причём дважды — и в тексте, и в своде связей). Обе цитируют один и тот же снятый в последнюю минуту конфликт — страны, «которые захотят оборвать вывоз мусора из хороших стран, союзников к стране нуара» — и обе указывают на отсутствующую статью как на то место, где это должно проясниться. При этом сам <code>MR-0021</code>, откуда родилась вся эта ветка (мусор, утилизатор у дриады, межостровная корпорация), в своём разделе «Связи» не ссылается ни на <code>GR-0036</code>, ни на мир утилизации мусора — три статьи держат один и тот же кусок мира порознь.</p>\n<h3>С чего начать</h3>\n<p>Копать архив не нужно — материал уже в базе. Разговор про конфликт из-за перекрытия вывоза зафиксирован в статье <code>GR-0036</code>, тем же вечером 2024-07-04, id 197117–197136 — то самое окно w0044, где разбирался и остров Нуара. Дело за тем, чтобы вытащить его в отдельную статью <code>ID-0085</code> и связать все причастные записи (<code>MR-0021</code>, <code>GR-0036</code>, <code>VS-0001</code>) друг с другом.</p>\n<h3>Как развивалось</h3>\n<p>Схема труб внутри острова прошла путь предложения и возврата в один и тот же день. 2024-07-04 сначала согласовали двухтрубную схему (id 196922) — трубы для выхода в океан и трубы для воздуха и переноса. Затем Слава предложил расширить её до четырёх видов, под отдельные функции: кислород, углекислый газ, люди, выход в океан (id 196914, 196927). Автор острова эту версию отклонил («так», «нет», id 196929–196930) с аргументом, что собеседник сам не понимает, насколько сложной уже стала система. Итоговая формулировка (id 197032, подтверждена id 197034–197035) — снова двухтрубная схема, только уточнённая через образ тьмы-вакуума.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для обычных жителей прописано правило прохода через барьер: давление поднимается плавно, через трубы (id 196770, 196836), а прямой выход наружу смертелен (id 196744, 196757). Рыба-люди при этом описаны как рождающиеся «уже по ебейшим весом», с плавным погружением от рождения (id 196752–196753) — то есть как раса, для которой резкий перепад давления не проблема по собственной физиологии. Правило о трубах сформулировано для тех, кому переход опасен; для расы, которой он не опасен по природе, отдельно не сказано, обязаны ли рыба-люди пользоваться той же системой труб или выходят иначе.</p>\n<h3>Отклик</h3>\n<p>Сильнее всего здесь работает не одна деталь, а то, как долго держится образ тьмы как чего-то, что «сосёт» — сначала барьер, потом фильтрация воздуха, потом мусор, потом даже сжигание ради солнца — один и тот же глагол по всей механике острова, ни разу не поставленный под сомнение. Редко когда черновой спор двух людей в чате выстраивает термин настолько ровно.</p></div>", "r": []}];</script>
