<script>const BASE="";const DOCNAME="Стенд Славы";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0114-S01", "SP-0114--mehanika"], "h": "<p>Стенд Славы придумал Миколай и описал его Славе прямо в переписке (2024-09-04, id 227709–227741). Первое, что названо, — носитель способности: «у тебя вместо трусов свиток». На этом свитке «ты можешь создавать что угодно, но с разной степенью реализации».</p>\n<p>То есть создать можно любой предмет, но получившееся будет разного качества: реализация «не стабильная и зависит от создателя, желания, проработки и другого». Что именно входит в «другое», в переписке не расшифровано.</p>\n<p>Отдельно оговорено, что стенд создаёт не только предметы, но и целый мир: «там есть отсылка на 7 остров», «это крч мир который может создать твой стенд». Мир работает не как отдельное пространство, а «как расширенная территория, хах» — с прямым сравнением: «как в мире магической битвы».</p>\n<p>Следующей репликой идёт «или деньги» (id 227728). К чему относится эта реплика — к перечню того, что можно создать свитком, или к чему-то ещё, — в переписке не сказано.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0114-S02", "SP-0114--ogranicheniya-i-cena"], "h": "<p>Ограничение по количеству: «можно реализовать токо один предмет» — одновременно реализуется только один объект.</p>\n<p>Ограничение по качеству: реализация нестабильна и зависит от создателя, его желания и проработки.</p>\n<p>Цена сформулирована так: «кнш ты жертвуешь самым ценным ресурсом» — и следом отдельным сообщением: «временем». Ни размер платы, ни то, как именно она списывается (за создание, за поддержание предмета, за разворачивание мира), в переписке не оговорены.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0114-S03", "SP-0114--nositeli"], "h": "<p>Слава. В базе стенд отнесён к Славе как часть персонажа. Придумал его Миколай, но сам стенд Миколая не касается — у того свой (<a href=\"SP-0113.html\">Стенд Миколая</a>).</p>", "r": [["Стенд Миколая", "SP-0113.html"]]}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0114-S04", "SP-0114--kak-menyalas-po-versiyam"], "h": "<p>Версия одна.</p>\n<p><strong>2024-09-04 (id 227709–227741), окно w0056.</strong> Первое и единственное описание: свиток вместо трусов, создание чего угодно с разной степенью реализации, один предмет одновременно, зависимость стабильности от создателя, желания и проработки, мир «7 остров» как расширенная территория, плата временем.</p>\n<p>Разговор оборвался: на описание Слава ответил «Фэнтезий монстрый», Миколай переспросил «что?», ответа не последовало — Слава ушёл есть («Я кушать», «Если что пиши»). После этого к стенду в переписке не возвращались.</p>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S05", "SP-0114-S05", "SP-0114--otklonennye-varianty"], "h": "<p>Прямых отклонённых вариантов стенда Славы в переписке нет, но зафиксирован сам процесс подбора. Миколай рассказывает, сколько времени потратил на придумывание: «когда я думал о том какой бы тебе стенд придумать я думал час», «даже 4» (id 227686–227687). Итог этих часов — список набросков, который он приводит целиком (id 227690):</p>\n<div class=\"q\"><p>экшен, нянька, фантазии, создание миров, деньги, рисунки, раздражение, вопросы, ненависть к пиздаболам</p></div>\n<p>И оценка результата: «это всё», «хотя я обычно дохуя текста пишу», «мне не о чем говорить типа» (id 227691–227694). Который из пунктов списка стал свитком и стали ли остальные чем-либо, в переписке не сказано; из списка узнаваемо перекликаются с итоговым описанием «создание миров» и «деньги».</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S06", "SP-0114-S06", "SP-0114--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Парная разработка со стендом Миколая (<a href=\"SP-0113.html\">Стенд Миколая</a>): в том же разговоре сначала Слава формулирует, что делает стенд Коли (щупальца, телефон, глаз), а сразу за этим Миколай отвечает придумыванием стенда Славе. Реплика-переход — «а знаешь что у тебя за стенд?» (id 227709). Механики у двух стендов не пересекаются: у Коли — сохранение и дублирование, у Славы — создание с нуля.</p>\n<p>Связан с миром «7 остров» — стенд способен его создать. Отношение «7 острова» к остальной вселенной по этому фрагменту не определяется.</p>", "r": [["Стенд Миколая", "SP-0113.html"]]}, {"t": "Пробелы", "a": ["S07", "SP-0114-S07", "SP-0114--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вселенная в самом разговоре не названа; отнесение к «монстрам» в базе сделано по дате объявления.</li>\n<li>Реплика Славы «Фэнтезий монстрый» осталась без пояснения — Миколай переспросил, ответа не было.</li>\n<li>Разговор оборван уходом Славы; описание стенда так и осталось односторонним, Слава его не подтверждал и не дополнял.</li>\n<li>Реплика «или деньги» (id 227728) повисает — к чему она относится, не сказано.</li>\n<li>Не сказано, сколько времени стоит создание и за что именно оно списывается.</li>\n<li>Не сказано, что происходит с реализованным предметом, если создать второй.</li>\n<li>В навигационной сводке базы указано, что Миколай отталкивался от своего рисунка, но в самих сообщениях рисунок не упоминается — только «там есть отсылка на 7 остров».</li>\n<li>Возможности «7 острова» как расширенной территории не описаны, кроме сравнения «как в мире магической битвы».</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0114--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0113.html\">Стенд Миколая</a></li>\n<li><strong>Упомянут в способностях:</strong> <a href=\"SP-0113.html\">Стенд Миколая</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0114--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-09-04</td>\n<td>227709–227741</td>\n<td>w0056</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0114-stend-slavy.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0114--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0114.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
