const CH=[{"t": "Происхождение", "a": ["S01", "PS-0254-S01", "PS-0254--proishozhdenie"], "h": "<p>Имя «Гриша» появляется один раз — в потоке мыслей Миколая (2025-04-01, id 314962, окно w0087), оформленном как список набросков в фигурных скобках вперемешку со свободным текстом. Запись сделана в рамках вселенной, объявленной в тот же день (2025-04-01, id 314966), — имени в переписке ей не дали.</p>", "r": []}, {"t": "Характер", "a": ["S02", "PS-0254-S02", "PS-0254--harakter"], "h": "<p>Единственная характеристика — восприятие облаков в пасмурную погоду: «бесят облака в пасмурную погоду/ а Грише это монстры». То есть там, где рассказчика облака в пасмурную погоду просто раздражают, Гриша видит в них монстров.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S03", "PS-0254-S03", "PS-0254--kak-menyalsya"], "h": "<h3>2025-04-01 (id 314962, окно w0087)</h3>\n<p>Единственное упоминание. Дальнейших версий, уточнений или возвращений к персонажу в переписке нет.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S04", "PS-0254-S04", "PS-0254--chto-s-nim-stalo"], "h": "<p>Больше нигде не встречается — ни в этом окне, ни позже.</p>", "r": []}, {"t": "Пробелы — чего в переписке нет", "a": ["S05", "PS-0254-S05", "PS-0254--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Кто такой Гриша и какое место он занимает в задумке — не сказано.</li>\n<li>Связь с другими персонажами или с миром — не названа.</li>\n<li>Внешность, способности, происхождение как персонажа (помимо самой пометки) — в переписке не сказано.</li>\n<li>Вселенная объявлена 2025-04-01 (id 314966), имени в переписке ей не дали.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["PS-0254--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-04-01</td>\n<td>314962–314962</td>\n<td>
