<script>const BASE="";const DOCNAME="Старик-арбетар";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0224-S01", "PS-0224--proishozhdenie"], "h": "<p>Персонаж вселенной «Апостол», разрабатывался 2025-03-13 — 2025-03-14 (окна w0080, w0081, сообщения 301805–302848). Имени в переписке не получил: авторы называют его «старик», «дед», «старик-арбетар», «чужемирец», «рассказчик».</p>\n<p>Биографию персонаж излагает сам, в монологе перед связанным Антоном Смирновым (2025-03-13, id 301805–301807). Изложена она сказовым складом, от третьего лица, как история про «мальчика»:</p>\n<div class=\"q\"><p>«когда-то давным-давно жил мальчик. Жил он с пьяницей отцом и с слабохарактерный матерью, жил он плох, его били, некормили, ругали, а мать выплескивала на нём эмоций от побоев отца.»</p></div>\n<p>Мать не уходила из-за слабохарактерности, «да и некуда ей была»: единственным имуществом семьи был дом в деревне «и ни-че-го более». Деревня названа отдельно и отделена от места действия обряда — «этот дом не в деревне Лихой, а в деревне Ливия, ближе Санкт-Петербург».</p>\n<p>В деревню пришёл Арбетар. Тут же в тексте даётся расшифровка слова — «Арбетар(швецский; на русском трудяга)». Арбетар «начал там всё крушить и поглащать жизнь человеческий и начал он из них делать чудищь словно из картины шизофриника». Мальчик пытался отбиваться, «но плохо выходила»; Арбетар «увидил он в его глазах желания жить» и взял его в ученики. Мотив учителя назван прямо: «Ведь он стар, хоть души людей и питательные, но на них вечность прожить не выйдет».</p>\n<p>Дальше — пятьдесят лет поручений: «Принести то, убить того, сожрать это, защитить того, провести ритуал. И так далее. И жил он так 50 годков». За это время ученик перестал быть ребёнком, а учитель за те же полвека изменился мало — «был таким же, но слегка лишь поседев». Только после этого учитель рассказал ему про способ стать Арбетаром «И кинул его в свободное плавание».</p>\n<p>С этого момента персонаж собирает материалы для собственного ритуала. Перечень материалов он называет сам: проводник (Антон), «пару чужемирцов», «ещё один благословенный» и «самая сложная альфа».</p>\n<p>Порядок трудности добычи расписан:</p>\n<ul>\n<li>Благословенного «убить было легко» — по его объяснению, потому что благословенные «не могут использовать благословенния долга, поэтому можно просто неожидано напасть и убить и всё».</li>\n<li>Чужемирцы — «Ну это так цветочки».</li>\n<li>Альфа — самое трудное. Причина: «у альфа и арбетатов похожий силый. Они как и мы может использовать свою силу 24/7 без риска повредить мозг. А если сила всегда активна и его защищает, то просто неожиданная атака, на нём не проканает».</li>\n<li>Способ добыть альфу — дождаться чужой работы: «пришлось ждать пока какой-нибудь апостол упустить альфю. При этом доведя его до полусмерти. И это было долго».</li>\n</ul>\n<p>Отдельно оговорено, что чужемирцем является сам рассказчик. Подтверждено прямым вопросом Миколая и ответом Славы (2025-03-14, id 302582–302584): «в истории защитника рассказчик чужемирец?» — «Да».</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0224-S02", "PS-0224--vneshnost"], "h": "<p>Описан глазами Антона в момент первой встречи (2025-03-13, id 301805): «я заметил как сука элеганский он одет. С бородкой как у бизнесменов, с чёрными волосами, одет в смокинг».</p>\n<p>При этом воспринимается собеседником как «старик», «дед» — возраст и элегантность даны вместе, без объяснения, как одно совмещается с другим. После обряда его внешность не описывается: во второй истории (2025-03-14, id 302378–302380) он сам рассказчик, себя не видит.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0224-S03", "PS-0224--harakter"], "h": "<p>Разговорчив, ведёт длинный монолог перед жертвой и получает от этого удовольствие. О деревне Лихой говорит «радостно словно ребёнок». Объясняя, зачем Антон здесь, произносит «с уважением»: «всё же для меня ты сделаешь невероятную услугу». Начиная рассказ, спрашивает воодушевлённо: «а давай сначала, как мы пришли к настоящему?»</p>\n<p>Требует к себе почтения по возрасту. На крик Антона «Почему я материал?» отвечает: «перебиват плохо, тем более старших. Ясно!»</p>\n<p>Считывает состояние собеседника: на неуместную шутку Антона про кота реагирует «хм уже шутишь, значит готов» и ухмыляется.</p>\n<p>Ненавидит апостолов — это названо самой сильной его нелюбовью и выделено вопросом-ответом внутри монолога: «И знаешь кого среди них я ненавижу больше? — нет не знаешь, Апостолов». Обоснование:</p>\n<div class=\"q\"><p>«Эти апостолы не пойми кем себя возомнили и везде понаставили свои порядки, на чужой силе»</p></div>\n<p>Благословенных в целом презирает по тому же признаку — сила у них не своя: «Ведь по правде говоря вся их сила, и не их вообще. Жалкий благословенный получивший силу лишь потому что понравились правителем, но сами они эту силу не добывали. Лишь мелкий пизжоны».</p>\n<p>При этом отдаёт апостолам должное в работе: «как бы я ненавидел апостолов. Но не могу не признать, что свою работу они выполняють слишком идеально. Ну даже в идеальной системе есть единичные пробои».</p>\n<p>Идёт на риск сознательно и до конца. На попытку Антона отговорить его («ты можешь сдохнуть может не надо так рисковать») отвечает: «уже поздно если бы у меня были сомнения, то я бы ещё на Альфе остановился. Начнём же». Свои шансы он знает и озвучивает вслух: без души проводника «шанс моего удачного поглощения составляет 0%», с Антоном — «подрастёт на 8%». Сам же комментирует: «Мало думаешь да. Тоже так думаю. Но если я выживу тогда я буду имеет силу. Это того стоит».</p>\n<p>Собирает досье на жертву. Антону, отпирающемуся («я не без грешник... Я калечил людей. Я пил. Я курю»), выкладывает его биографию: одиночка, воспитан бабушкой, не закончил колледж после драки, работал в ресторанах и курьером, нигде не задержался из-за драк, бежал из города. Вывод формулирует так: «Ты человек возомнивший себя героем, а на самом деле ты человек у которого ничего нет... Ты праведник, и как бы ты не противился всё твои поступки говорят об этом. Ты глупый правидник».</p>\n<p>После обряда (2025-03-14, id 302378) характер даётся изнутри: самоуверенность и трезвая оценка вперемешку. «Я чувствую, что могу свернуть горы. Что я словно бедствия природы, который обычным людям ни за что не остановить» — и тут же: «Но признаться честно. Сила ещё не сформировалась».</p>\n<p>Мстительность и склонность к издевательству: перед боем он раскапывает могилы жены и дочери Защитника и уносит тела — «я уже подготовил ему там подарочек». Ждёт из тени именно ради реакции: «Я хотел увидеть его лицо. И мы уже вот-вот подходим». В бою бьёт «конечно щадя, чтобы моя игрушка так быстро не закончилась».</p>\n<p>Когда бой поворачивается против него, самооценка меняется: «Зачем я решил пойди в драку? Ненаучившишь нормально пользоваться энергий. Я даже не дал телу привыкнуть к данной силе. И вот итог». И дальше — прямой страх: «Мне страшно. Я не хочу умирать. Я только получил силу. Почему я должен умирать лишь из-за одной ошибки?»</p>\n<p>Со стороны Антона характеристика дана в самом конце окна w0081 (id 302380): «одного старого и до ужаса лицемерного старика».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0224-S04", "PS-0224--sposobnosti"], "h": "<p>До обряда способности персонажа не описаны. Он ученик Арбетара, полвека выполнявший поручения, включая «провести ритуал», но какой силой при этом располагал — в переписке не сказано.</p>\n<p>Свойство арбетаров названо в его же монологе, при сравнении с альфой: «у альфа и арбетатов похожий силый. Они как и мы может использовать свою силу 24/7 без риска повредить мозг».</p>\n<p>Устройство обряда он излагает сам (2025-03-13, id 301807):</p>\n<div class=\"q\"><p>«я использую мозг благословенного, чтобы он начал собирать силу. И тело Альфы дабы он его пресовал. А всё остальные компоненты служат активаторами. И после того как вся это сила от прессуется она пройдёт через тебя. Нет. Точнее ты станешь для неё сосудом. Она будет накапливаться в тебе. Пока выдерживает твоей тела. А после твоя душа покроет эту силу. Сделав еë более безопасная для меня.»</p></div>\n<p>Требование к проводнику — чистота души: «С чистой душой. Ну конечно не прям 100% чистой душой, а где-то на 80% плюс минус». Обычная практика — дети: «Для этого всё арбетаты чаще всего используют детей лет от 3 до 12, где-то». Антон предпочтительнее ребёнка, потому что «через тело и душу ребёнка проходить мало силы, а вот через тебя. Со взрослым телом и крепкой душой пройдёт куда больше силы». Чистота души Антона названа числом — 89%. Ожидание от результата: «Я наверное буду сильнейшем арбетатом в этом поколения, если используя тебя».</p>\n<p>Сам обряд, как его видит связанный Антон (id 301807): кровь на траве, символика, мозг на алтаре, в центре тело «какой-то анатомический неправильной», старик что-то читает; «Словно ветер подул, и искажения воздуха идет, как на кастром. Но здесь нет огня, нет тепла»; мозг светится и шевелится, тело в центре начинает двигаться, «Словно зарядом тока его бьют».</p>\n<p>После обряда (2025-03-14, id 302378) состояние силы описано так:</p>\n<ul>\n<li>сила «большая и мощная. Могущественная», сравнение — «словно бедствия природы»;</li>\n<li>сила ещё не сформировалась: «использовать еë кроме как для усиления или пару простых заклинаний, можно только было»;</li>\n<li>тело не адаптировано: «моё тело ещё не до конца адаптировалась к новой силе».</li>\n</ul>\n<p>Конкретные применения в бою с Защитником:</p>\n<ul>\n<li>усиление тела (удар «ровно по темечку», сбивающий противника с ног, рывки на сближение);</li>\n<li>материализация сгустка: «собрав энергию в ладонь, матерелизовал еë, в сгусток темноты. И кинул»;</li>\n<li>перегруз руки энергией: «Влил в руку куда больше энергий, чем она могла выдержать и нанёс размашистый удар» — удар, по его оценке, должен был «пройти сквозь него»;</li>\n<li>взрыв энергии внутри себя как средство разорвать дистанцию: «собрав энергию. Я взрываю еë внутри меня. Отталкивая защитника. И бегу».</li>\n</ul>\n<p>Ограничение, которое он обнаруживает прямо по ходу боя и формулирует сам: «только сейчас я придал значения тому, что не способен использовать усиления и защиту энергий одновременно».</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Как развивалось — не материал авторов</b>\n<p>2025-03-13, 13:21 — выложили целиком: похищение, монолог, биография, обряд, больница. 13:29, через восемь минут — выложили заново, дорастив начало спереди; остальное дословно то же. Ограничения поставлены в тот же день и самим персонажем: 0% без проводника, +8 с Антоном, «с апостолами ещё рано», «с благословенными может. Хотя нет я ещё не научился пользоваться силю». Тем же днём, id 301923–301947, обсуждают следующую историю, и задача формулируется не про персонажа, а про ремесло: «В этой истории я хочу сделать упор на драку». 2025-03-14 — бой написан, и там же ограничения проверены на деле: «не способен использовать усиления и защиту энергий одновременно». Вечером того же дня — уточнение «рассказчик чужемирец? — Да», и следом служебный разговор о составе героев, после которого персонажа отставляют решением, а не забыванием: «Харе жалких», «Ну конечно не харе, но пока отступим в сторонку».</p></div>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0224-S05", "PS-0224--svyazi-s-drugimi"], "h": "<p><strong>Учитель-Арбетар.</strong> Уничтожил его деревню и семью, забрал в ученики ради собственного продления, полвека гонял поручениями, потом рассказал способ стать Арбетаром и «кинул его в свободное плавание». Что стало с учителем дальше и жив ли он — в переписке не сказано.</p>\n<p><strong>Антон Смирнов.</strong> Материал обряда, проводник. Похищен из элитного ресторана, куда сам въехал на фургоне в три часа ночи (2025-03-13, id 301820), очнулся связанным в металлическом ящике в деревне Лихой. Старик обливает его водой, приводит в чувство, беспокоится о его состоянии («Пацан с тобой всё в порядке?»), потом использует. Изначально старик ждал в ресторане ребёнка — «И ждал ребенка, чтобы использовать его как проводник. Но как удачно появился ты».</p>\n<p><strong>Брат Антона.</strong> Вторая душа в одном теле с Антоном, которую тот принимал за «альтро-эго». По объяснению Дмитрия Рутковского (id 301824), во время обряда «больший урон получила душа твоего брата, а после его забрал старик». Таким образом старик забрал душу брата — это последнее, что о ней сказано.</p>\n<p><strong>Дмитрий Рутковский, «Агрегат», апостол.</strong> Прямо противопоставлен старику в тексте: он засёк «огромный сплеск энергии», нашёл деревню и тело Антона, «подлатал физический». Представляется Антону как «тот самый, которого по твоим словам ненавидит старик». Со стариком лично в переписке не пересекается.</p>\n<p><strong>Защитник (Александр Лукашенко).</strong> Выбран стариком как «манекен» для проверки силы. Описание выбора (id 301807): «Аа точно, защитник. Недавно появившаяся охотник за чужемирцами. Он вроде бы сильный. Будет не плохим манекеном для проверки мой новый силы». В бою (id 302378–302380) старик проигрывает. Он раскапывает могилы жены и дочери Защитника и уносит тела, а в конце спасается ложью: «ТЕЛА ТВОЙ ЖЕНЫ и ДОЧЕРИ. Я СКИНУЛ В БЛИЖАЙШИЮ РЕКУ. ЕсЛИ ТЫ НЕ ПОТОРОПИСЯ ТО ОНИ УПЛЫВут!» Защитник останавливается, кричит «ТЫ СДОХНЕШЬ!» и уходит к реке. Куда старик дел тела на самом деле — не сказано.</p>\n<p><strong>Пустынник.</strong> Выпрыгивает из кустов с мечом в момент, когда Защитник добивает старика. Одет «в какой-то костюм пустынника», закрывающий всё тело, поверх — маска и плащ; на руке, «где обычно люди режут себе вены», открытая кожа. Сначала дерётся мечом, потом оказывается благословенным — «В его спину ударил поток крови». Уносит старика через плечо. Мотив назван предположением самого старика: «Ведь пустырнику я, явно нужен живой». Кто такой пустынник, откуда взялся и зачем спасал — не объяснено.</p>\n<p><strong>Апостолы.</strong> Объект главной ненависти. Отдельно оговорено, что от встречи с апостолом старик уклоняется по срокам: тест-драйв «уж точно не с апостолами. С ними ещё рано».</p>\n<p><strong>Благословенные.</strong> Рассматривались как вариант для тест-драйва и отпали по причине неумения: «С благословенными может. Хотя нет я ещё не научился пользоваться силю».</p>", "r": []}, {"t": "Как менялся", "a": ["S06", "PS-0224-S06", "PS-0224--kak-menyalsya"], "h": "<p><strong>2025-03-13, id 301805–301809 (версия 1, окно w0080).</strong> Первая выкладка целиком: похищение Антона, монолог с биографией и составом материалов, ненависть к апостолам, объяснение устройства обряда, сам обряд, реплика про тест-драйв на Защитнике, и следом — сцена в больнице с Дмитрием Рутковским, где Антону объясняют про брата и предлагают два пути.</p>\n<p><strong>2025-03-13, id 301820–301824 (версия 2, окно w0080).</strong> Тот же текст выложен повторно в полном виде. Добавлено начало, которого не было в первой выкладке: разговор Антона с «альтро-эго» о том, как атаковать ресторан (базука, ракета, «вообще можно ядерку» — всё отброшено как шутка), решение врезаться в ресторан машиной ближе к ночи, взятые перед этим «взаймы и кредиты», и строка «Фургон в 3 часа ночи въехал в один из элитных ресторанов». Остальное совпадает дословно.</p>\n<p><strong>2025-03-13, id 301923–301947 (версия 3, окно w0080).</strong> Обсуждение следующей истории. Миколай перебирает варианты: «о деятельности организации апостолов?» либо «или о злодеяниях старика арбетара?». Слава отвечает: «О встречи старика и защитника. Старик же в конце сказал, что хочет провести тест-драйв», и позже уточняет, что одно другому не мешает — «Ну так о злодеяних и будет старика». Задача, поставленная на эту историю, названа прямо: «В этой истории я хочу сделать упор на драку. Ведь у меня всё развивается диалоги, описание персонажи, сюжет, а вот описание драки полная говно». Тут же Слава оценивает начало первой истории: «Ну начал только плохо. Но там я сам виноват. Слишком много переключений с персонажа на персонажа и т. П».</p>\n<p><strong>2025-03-14, id 302378–302380 (версия 4, окно w0081).</strong> Обещанная история написана. Здесь старик — рассказчик от первого лица. Новое по сравнению с версией 1: состояние силы после ритуала (огромная, но несформированная, тело не адаптировано); имя Защитника — Александр Лукашенко, с комментарием «Имя пряма не подходящия к нему»; раскопанные могилы; подробный ход проигранного боя; ограничение «не способен использовать усиления и защиту энергий одновременно»; появление пустынника; получение Защитником благословения «не обычная, а от бога» в момент, когда он должен был умереть; побег и ложь про реку. Заканчивается решением: «Я должен стать сильней, чтобы защитить себя. Я должен восстановиться и начать тренировки. Больше не каких тест-драйвов». Тем же куском закрывается линия Антона: он выписывается из больницы в Санкт-Петербурге, «просто пытался услышать голос внутри себя», и получает свою цель — «Научиться пользоваться, той одарённой его силой. Чтобы убить одного старого и до ужаса лицемерного старика».</p>\n<p><strong>2025-03-14, id 302582–302584 (версия 5, окно w0081).</strong> Уточнение по вопросу Миколая: рассказчик истории про Защитника — чужемирец. Ответ Славы: «Да».</p>\n<p><strong>2025-03-14, id 302830–302848 (версия 6, окно w0081).</strong> Служебное обсуждение состава персонажей. Слава описывает своих героев: «два мститель, нече не помниший апостол, и один с ушедший с ума чужемирец» — последнее относится к этому персонажу. Там же контекст: у Славы «истории одного человека. Одного маленького иногда жалкого человека». Миколай замечает: «пока у тебя истории жалких человечков». Слава на это отвечает, что персонажи не жалкие, «Ну если смотреть со стороны психи, то конечно жалкий», и делает вывод для дальнейшей работы: «Ладно у меня как раз были две илей. И я не мог определиться какая лучше будет. Но ты поставил точку», «Харе жалких», «Ну конечно не харе, но пока отступим в сторонку», «Ну я понимаю, что нужно тоже расбовлять». Миколай оговаривается: «не то что мне не нравится если что, просто наблюдение)».</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0224-S07", "PS-0224--chto-s-nim-stalo"], "h": "<p>Обряд он пережил — при заявленных им же 8% шансах. Тест-драйв на Защитнике проиграл: избит, ранен ножом в ногу, спасён пустынником и унесён им с поля боя. Уходит с решением: «Больше не каких тест-драйвов», восстановиться и начать тренировки, чтобы «стать сильней, чтобы защитить себя».</p>\n<p>На этом состоянии его линия в переписке обрывается. Против него на этот момент заявлены двое: Защитник («ТЫ СДОХНЕШЬ!») и Антон, который стал агентом организации апостолов ради мести за брата.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0224-S08", "PS-0224--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имени у персонажа нет. В окне w0080 оно не называется; дальше тоже.</li>\n<li>В окне w0081 нигде не сказано прямо, что рассказчик истории про Защитника и старик-арбетар из истории про Антона — одно лицо; связь читается по контексту и по левому краю окна.</li>\n<li>Что такое Арбетар как явление (существо, должность, состояние) — не определено; дано только слово и перевод «швецский; на русском трудяга».</li>\n<li>Что стало с учителем-Арбетаром после того, как он «кинул его в свободное плавание», — не сказано.</li>\n<li>Как именно проходит превращение в Арбетара при «удачном поглощении» и что было бы при неудаче — не расписано, кроме процентов.</li>\n<li>«Пару чужемирцов» и второй благословенный из состава материалов никак не описаны: кто они, где взяты — не сказано.</li>\n<li>Собственные способности старика до обряда не описаны вообще.</li>\n<li>Кто такой пустынник, зачем ему нужен старик живым и что было после того, как он унёс его, — не объяснено. Предположение о мотиве принадлежит самому старику.</li>\n<li>Куда старик дел тела жены и дочери Защитника — не сказано; фраза про реку в тексте подана как отчаянная выдумка ради спасения.</li>\n<li>Дальнейшая судьба души брата Антона, которую «забрал старик», осталась нерешённой.</li>\n<li>Обещанные истории «о деятельности организации апостолов» и отдельно «о злодеяниях старика арбетара» в этих окнах не написаны; вторая частично поглощена историей боя.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0224--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0017.html\">Арбетары</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0017.html\">Арбетары</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0224--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-03-13</td>\n<td>301805–301809</td>\n<td>w0080</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-13</td>\n<td>301820–301824</td>\n<td>w0080</td>\n<td>Апостол (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2025-03-13</td>\n<td>301923–301947</td>\n<td>w0080</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-14</td>\n<td>302378–302380</td>\n<td>w0081</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-14</td>\n<td>302582–302584</td>\n<td>w0081</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-14</td>\n<td>302830–302848</td>\n<td>w0081</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0224-starik-arbetar.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0224--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0224.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0224-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0224/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Самая дорогая дыра — Защитник. Персонажа, с которым старик дерётся весь второй эпизод и который его чуть не убивает, в справочнике нет ни в каком виде. Есть история <code>IS-0017</code> «Защитник» — 139 029 знаков базы, крупнейшая история вселенной, две ссылки. Есть проза <code>PR-0049</code> (22 661) и <code>PR-0059</code> (21 039). Есть даже статья о его семье — <code>PS-0196</code> «Семья Защитника (жена и дочь)», 37 618, ссылок ноль. А карточки человека, чьи могилы жены и дочери старик раскапывает, нет. Из-за этого повисает половина того, чем эта статья заканчивается: имя «Александр Лукашенко», благословение «не обычная, а от бога», «ТЫ СДОХНЕШЬ!» — всё это некуда пришить, и ссылается на всё это только <code>PS-0224</code>.</p>\n<p>Вторая по цене — учитель. Сущности нет вовсе: ни персонажа, ни группы, ни строки в реестрах. При этом на него опираются сразу две статьи: здесь — пятьдесят лет ученичества, знание про деревню Лихой и сам способ стать Арбетаром; в <code>PS-0220</code> — единственный описанный механизм появления новых арбетаров помимо «сцапать кусок силы». Обе цепляются, обеим не за что.</p>\n<p>Третье, дешёвое: пустынник числится здесь необъяснённым, а статья <code>PS-0225</code> «Пустынник» есть (8 637, одна ссылка), плюс <code>SP-0200</code> «Поток крови» (8 175, ссылок ноль). Там сказано то, чего нет тут: он благословенный, и это не догадка, а ответ Славы в разборе того же вечера. Источники <code>PS-0224</code> этот кусок просто не захватывают.</p>\n<p>Отдельно — две деревни. <code>MN-0015</code> «Деревня Лихая» (32 900, ссылок ноль, окна w0078–w0079, война, братская могила) и <code>MN-0016</code> «Деревня Лихой» (24 413, ссылок ноль, w0080, обряд). Названия почти совпадают, обе по нулю входящих ссылок, и нигде не сказано, одно это место или разные.</p>\n<h3>С чего начать</h3>\n<p>Почти всё в базе.</p>\n<ul>\n<li>Пустынник: id 302766–302781, 2025-03-14, окно w0081 — источник <code>PS-0225</code>, в источниках этой статьи его нет. Там снимается версия «это Бессмертный» и ставится «благословенный».</li>\n<li>Деревня: id 301840–301846, 2025-03-13 — источник <code>MN-0016</code>, тоже мимо. Там прямой вопрос Миколая «деревня лихой в России? или в Германии?» и ответ «В Росси».</li>\n<li>Бой дословно: <code>PR-0059</code> «Битва (в чате также „история защитника\", тест-драйв старика)» — 21 039, ссылок ноль. Привязку сделали позже и в другой записи: <code>IS-0057</code> «Битва Защитника и арбетара» (3 039), 2025-05-15, где Слава пересылает ссылку на 302378 и подтверждает, о чём это.</li>\n<li>Сила после обряда: <code>SP-0201</code> (21 913, ссылок ноль). Обряд: <code>SP-0198</code> (48 879, две ссылки), <code>SP-0199</code> «Проводник» (39 325, ссылок ноль).</li>\n<li>Душа брата, которую старик забрал: <code>PS-0222</code> «Альтер-эго Антона (брат)» — 72 757, ссылок ноль, и <code>SP-0196</code> «Заготовки» — 48 534, ссылок ноль.</li>\n<li>Куда линия арбетаров ушла дальше: <code>PS-0281</code> (2025-05-31) и <code>PS-0226</code> (окна w0104–w0106, до 2025-10-18).</li>\n</ul>\n<p>В архив — только за именем. Его нет ни в одной записи ветки, и это не потеря сборки, а состояние переписки: 2025-03-14, id 302830–302848, Слава перечисляет собственных героев вовсе без имён — «два мститель, нече не помниший апостол, и один с ушедший с ума чужемирец». Если имя где-то и появилось, то позже марта; ориентиры — окно w0099 (конец мая, вселенная перебиралась целиком) и w0104–w0105 (сентябрь).</p>\n<h3>Как развивалось</h3>\n<p>2025-03-13, 13:21 — выложили целиком: похищение, монолог, биография, обряд, больница. 13:29, через восемь минут — выложили заново, дорастив начало спереди; остальное дословно то же. Ограничения поставлены в тот же день и самим персонажем: 0% без проводника, +8 с Антоном, «с апостолами ещё рано», «с благословенными может. Хотя нет я ещё не научился пользоваться силю». Тем же днём, id 301923–301947, обсуждают следующую историю, и задача формулируется не про персонажа, а про ремесло: «В этой истории я хочу сделать упор на драку». 2025-03-14 — бой написан, и там же ограничения проверены на деле: «не способен использовать усиления и защиту энергий одновременно». Вечером того же дня — уточнение «рассказчик чужемирец? — Да», и следом служебный разговор о составе героев, после которого персонажа отставляют решением, а не забыванием: «Харе жалких», «Ну конечно не харе, но пока отступим в сторонку».</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для силы старика цена расписана до чисел: 0 и 8 процентов, пятьдесят лет ученичества, ожидание чужой ошибки ради альфы, несформировавшаяся сила, неадаптированное тело, запрет на усиление и защиту одновременно. В той же сцене, в том же бою, второму участнику сила приходит даром: «В момент, когда он должен был умереть. Он получил благословение. И не обычная, а от бога». Цена этого не названа никакая. Правило «за силу платят, и вот прайс» проговорено для арбетара; для того, кто этой силой его тут же бьёт, того же порядка правила нет. Место показываю, дальше не иду.</p>\n<h3>Отклик</h3>\n<p>Зацепило, что он выигрывает невозможное и сразу проигрывает простое. Восемь процентов на обряд — прошёл. Драка с одним человеком, которого сам выбрал как манекен, — проиграл начисто, и объясняет это сам, по пунктам, прямо посреди боя: «Ненаучившишь нормально пользоваться энергий. Я даже не дал телу привыкнуть к данной силе. И вот итог». Персонаж, который полвека всё рассчитывал, гибнет от нетерпения, и первым это замечает он же. Второе — как он спасается. Не силой: он выкрикивает врагу ложь про тела его жены и дочери, сброшенные в реку, и та работает, потому что он один знает, чем этого человека можно остановить. Могилы он раскопал заранее, «подарочек», ради выражения лица. То есть единственное его настоящее оружие — то, что он изучает людей, и это же он делал с Антоном: выложил ему биографию и доказал, что тот праведник, против его собственных возражений. А самая живая строчка тут вообще не про силу: «Мне страшно. Я не хочу умирать. Я только получил силу. Почему я должен умирать лишь из-за одной ошибки?» Обиженная интонация, а не героическая, — и от неё он становится куда понятнее, чем от всего монолога до.</p></div>", "r": []}];</script>
