<script>const BASE="";const DOCNAME="Подарок внутри монстра";
const LEAD="";
const CH=[{"t": "Содержание", "a": ["S01", "IS-0035-S01", "IS-0035--soderzhanie"], "h": "<p>Единый кусок текста, выложенный Славой одним сообщением (2025-02-12, id 288545, окно w0075). Повествование идёт от первого лица от монстра, который лежит искалеченный рядом с потерявшим сознание Защитником и рассказывает его историю. Название сущности взято по последним строкам — по подарку, который рассказчик приготовил внутри себя.</p>\n<p>Начало куска: мужчина пьян и слышит, как кто-то кого-то жуёт — «Ну может быть собаку кошку жуёт или наоборот, какая к чёрту разница». Мнение меняется, когда он видит «тощий силуэт покрытой шерстью»: он мгновенно трезвеет, «его мысль стали четками и ясными, как никогда», и начинает красться к силуэту. Силуэт его слышит и бросается первым. Мужчина перехватывает поудобнее бутылку и бьёт ею по морде; пока зверь хватается за нос, Защитник «снова почувствовав гнев» начинает тыкать розочкой «этого обратная во всё места». Когда тело не подаёт признаков жизни, он тащит труп к себе домой — «Словно пытаясь так принести какой-то ритуал». Дотащив, ложится на кровать и вырубается.</p>\n<p>Проснувшись, он сначала в порыве гнева хочет сжечь этот дом, но видит труп — «труп обратная, настоящего обратная». После этого «Всё сразу стала на свои места. И он понял, что надо сделать».</p>\n<p>Дальше идут два года подготовки: он записывается «во всё возможное спорт клубы», выливает весь алкоголь и спиртные напитки в раковину, смывает в унитазе «все колёса», снова начинает работать. Несколько спортклубов даются тяжело, «ещё он сам давно не мальчик, поэтому тренировки давались вдвойне тяжелее», но он не останавливается и «не щадил свой организм, свой тело, возможно внутренний виня и свой тело тоже». Так он живёт «лишь тренировками и работой на протяжении 2-х лет». За это время он убирается в доме, закапывает труп в подвале дома, ставит фотографии «своих дорогих девушек», зарабатывает «кругленькую сумму», покупает огнестрельное и холодное оружие, приводит себя в хорошую физическую форму.</p>\n<p>Затем — «полномасштабная охота на нас», то есть на тех, к кому принадлежит рассказчик. Сначала он просто гуляет ночью в попытках встретить их — рассказчик тут же комментирует: «дурак». В этих прогулках он чаще избивает «недо бандитов и мелких хулиганов и насильников», причём «ему от частей была по-барабану на всех их»: избивает он их от раздражения, что не может найти нужных.</p>\n<p>Второй способ поиска — отслеживание полицейских звонков и приезд первым туда, «где что-то явно странная». На это уходит много денег («Ой сколько денег он на это потратил»), но способ срабатывает: через неделю-другую он слышит «такое долгожданная слова монстр», выбегает из дома и едет на машине, «нарушая всё возможные дорожный правила».</p>\n<p>На месте он застаёт «Шесте рукой чудовище, который душила мужчину». Он выхватывает из-под кофты армейский нож — «острый он проверял», — режет лапу существа, «заставляя решится равновесия», а потом начинает потрошить его конечность. «Этот паучок ничего не мог сделать, против быстрого ломающего его защитника». Защитник его не убивает: отрывает все конечности, грузит в машину и уже дома пытается узнать у него информацию. «Тот паучок знать-то ничего не знал, но защитник ломал его психологический и физический».</p>\n<p>После этого у Защитника появляется способность: «он начал как то инстинктивно понимать, где находиться чужимирцы словно благословенный. Но он им не был». Так он однажды натыкается на группу рассказчика и «порешал есть сам конечно получив тяжёлый ранения».</p>\n<p>Дальше рассказчик отвечает на собственный вопрос — почему он не убьёт Защитника, раз тот сейчас без сознания. Первая причина физическая: «он переломал мне всё конечности и не только». Вторая — по выбору: «Но если бы я даже мог бы, я бы ни за что этого не сделал ведь он должен жить узнать о чужемирцов, о благословенных, о артефактах он должен страдать и быть снова счастливым».</p>\n<p>Рассказчик благодарен Защитнику за бой: «Я ему уже благодарен тем, что мне даль вкуснейший пир перед смертью, не каждый из моего мира хотя бы раз в жизни так вкусно и сытно питался».</p>\n<p>Отдельно названо сожаление рассказчика — он не увидит дальнейшую жизнь Защитника, «не его страдания, не боли, не счастья» и «не смогу увидеть всё растущую вину». Вина при этом различается на две: не та вина, «что не смог уберечь свою семью, вот она по размеру с гневом рядом с ним», а «чувством вины за убийство не виновных чужемирцов». Про вторую сказано: «Хотя сейчас она маленькая, но она растет».</p>\n<p>Финал куска — заявка на подарок. Защитник приходит в себя, и рассказчик говорит: «я уже подготовил для него подарок, нет не пакость, а настоящее подарок, он находится внутри меня и когда защитник будет рвать меня он получит этот подарок». Текст обрывается репликой «Эх ладно пок....» и строкой «В лесу пронеся хруст ломающий черепушки».</p>", "r": []}, {"t": "Персонажи", "a": ["S02", "IS-0035-S02", "IS-0035--personazhi"], "h": "<ul>\n<li><strong>Защитник</strong> — мужчина, «давно не мальчик», в начале куска пьяный, с «колёсами» в доме; после встречи с оборотнем два года готовится и переходит к охоте. Названы его гнев («снова почувствовав гнев»), вина за то, что «не смог уберечь свою семью», фотографии «своих дорогих девушек» в доме, армейский нож, огнестрельное и холодное оружие, дом с подвалом, куда закопан труп. К концу куска он без сознания и ранен, но живой.</li>\n<li><strong>Рассказчик-монстр</strong> — тот, от чьего лица идёт весь текст. Из «моего мира», ест людей («вкуснейший пир перед смертью»), у него есть группа («нашу группу»). Защитник переломал ему все конечности «и не только»; он ждёт, что его будут рвать, и внутри него лежит подарок. Сущность записана как часть Рассказчика-монстра.</li>\n<li><strong>Оборотень</strong> — «тощий силуэт покрытой шерстью», убитый бутылкой и розочкой; в тексте он же назван «недо обратная», а после — «настоящего обратная». Его труп закопан в подвале дома Защитника.</li>\n<li><strong>Шестирукое чудовище / «паучок»</strong> — существо, душившее мужчину; Защитник отрывает ему все конечности, увозит и допрашивает, ломая «психологический и физический». Информации у него не было.</li>\n<li><strong>Группа рассказчика</strong> — упомянута как «нашу группу», состав не назван.</li>\n<li><strong>Семья Защитника</strong> — названа только через вину «что не смог уберечь свою семью», подробностей в куске нет.</li>\n</ul>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "IS-0035-S03", "IS-0035--mesto-vo-vselennoy"], "h": "<p>Вселенная — Апостол (в записи проставлена по дате объявления), окно w0075.</p>\n<p>В тексте названы термины и сущности вселенной: чужемирцы (в тексте — «чужимирцы», «чужемирцов»), благословенные, артефакты. Способность Защитника «инстинктивно понимать, где находиться чужимирцы» прямо сопоставлена с благословенными: «словно благословенный. Но он им не был».</p>\n<p>Связано с: Артефакты, Защитник, Рассказчик-монстр. Часть чего: Рассказчик-монстр.</p>", "r": []}, {"t": "Состояние", "a": ["S04", "IS-0035-S04", "IS-0035--sostoyanie"], "h": "<p>Одна версия, одна дата: 2025-02-12, id 288545–288546. Продолжения в окне нет.</p>\n<p>Сразу после текста, в 18:17 того же дня, Слава пишет: «Каюсь в конце я сдулся» (id 288546).</p>\n<p>Подарок внутри монстра назван и не раскрыт — ни что это, ни получил ли его Защитник.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "IS-0035-S05", "IS-0035--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Что именно за подарок — не сказано; продолжения в окне нет.</li>\n<li>Разорвал ли Защитник рассказчика и что случилось после строки «В лесу пронеся хруст ломающий черепушки» — в переписке не сказано.</li>\n<li>Состав группы рассказчика не назван.</li>\n<li>Из какого мира рассказчик, кто он видово — не сказано, только «не каждый из моего мира».</li>\n<li>Что именно произошло с семьёй Защитника и кто такие «дорогие девушки» на фотографиях — в этом куске не раскрыто.</li>\n<li>Как соотносятся «недо обратная» и «настоящего обратная» — в тексте оба слова относятся к одному трупу, различие не пояснено.</li>\n<li>Откуда у Защитника взялось чутьё на чужемирцев, если он не благословенный, — названо как факт, объяснения нет.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["IS-0035--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-02-12</td>\n<td>288545–288546</td>\n<td>w0075</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/istorii/IS-0035-podarok-vnutri-monstra.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["IS-0035--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/IS-0035.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
