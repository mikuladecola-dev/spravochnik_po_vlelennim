<script>const BASE="";const DOCNAME="Волнистый удар";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0130-S01", "SP-0130--mehanika"], "h": "<p>Удар, от которого «структура» цели начинает колебаться. Из-за этого колебания отменяются все действующие в данный момент способности. Пример, которым Слава объясняет действие: «ты запустил огненный шар и держишь его где то в воздухе по после того как тебя ударили этот огненный шар исчезает».</p>\n<p>Отмена мгновенная и не длящаяся: «но после удара ты сразу сможешь использовать способность». То есть удар снимает уже работающие эффекты, но не блокирует применение способностей дальше.</p>\n<p>Приём описан в общем списке способностей Имитатора одним заходом (2024-12-13, id 269866, окно w0066).</p>\n<p>Основа, на которой держится приём, — понятие «структуры». В том же сообщении структура описана как то, что даёт способности, и как то, что бывает предметным: «структура воды ты можешь без каких проблем создать воду». Волнистый удар работает не по телу и не по энергии, а именно по структуре.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0130-S02", "SP-0130--ogranicheniya-i-cena"], "h": "<p>Цена волнистого удара в переписке не названа. Это отличает его от соседнего приёма того же носителя — «Удара разрушающего структуру», для которого цена расписана прямо: «чтобы использовать этот удар тебе надо полностью отказаться от защиты да и плюсом твой мозг будет по тихонько сгорать если попытается его использовать».</p>\n<p>Косвенное ограничение следует из свойств самого носителя. У Имитатора «так и не смогла сформироваться структура дающий способности ( у него вместо него частицы)», а у частиц названы минусы: «плохой контроль; слабая способность накопления ( маленькая количество энергий)». Распространяется ли это на волнистый удар отдельно — в переписке не сказано.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0130-S03", "SP-0130--nositeli"], "h": "<p>Имитатор — мужчина, «Владелец глаз». Волнистый удар назван в его списке способностей. Других носителей в переписке нет.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0130-S04", "SP-0130--kak-menyalas-po-versiyam"], "h": "<p>Одна версия, одно сообщение.</p>\n<p><strong>2024-12-13 (id 269866, окно w0066).</strong> Первое и единственное описание. Приём появляется сразу в готовом виде, внутри перечня из шести пунктов, которым Слава задаёт Имитатора целиком. Правок, уточнений и возвратов к нему в дальнейшем нет.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0130-S05", "SP-0130--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Волнистый удар — часть набора Имитатора. В том же сообщении (2024-12-13, id 269866) названы остальные пункты набора:</p>\n<ul>\n<li><strong>Особая усиления</strong> — «когда другие усиливают просто часть тела или все тела имитатор усиливает каждую волокна мышцы каждый кость из за этого его усиления раза 10 больше чем у обычных людей».</li>\n<li><strong>«Я не умру пока не кончится энергия»</strong> — формулировка приведена как название, комментарий Славы: «но здесь понятно».</li>\n<li><strong>Материализация</strong> — «он может из частиц энергий создать любой не живой предмет но энергий тратится дофига»; с оговоркой, что материализовать могут и обычные носители, но только по своей структуре: «если что обычный тоже так могут но то к чему относится структура например структура воды ты можешь без каких проблем создать воду».</li>\n<li><strong>Удар разрушающий структуру</strong> — парный волнистому и более тяжёлый: «сам удар разрушает структуру на время дела оппонента чуть ли не простым человеком». Разница между двумя ударами по тексту: волнистый отменяет уже действующие способности и отпускает сразу, разрушающий на время лишает противника структуры вообще.</li>\n<li><strong>Глаза</strong> — «его глазки способны видеть чужую структуры и так как у него самого нет структуры то он может с помощью частиц сформировать чужую структуру опять же на время да и структура которую имитируют в разы несовершенной по сравнений с оригиналом».</li>\n</ul>\n<p>Прямая связка волнистого удара с каким-либо из этих приёмов (например, применяется ли он в связке с глазами или с разрушающим ударом) в переписке не проговорена.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "SP-0130-S06", "SP-0130--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Цена и расход энергии не названы.</li>\n<li>Радиус, дальность и способ нанесения не описаны: сказано только «удар», контактный он или нет — в переписке не сказано.</li>\n<li>Действует ли удар на способности самого бьющего, а не только цели, — не сказано.</li>\n<li>Есть ли защита от волнистого удара, можно ли ему противостоять — не обсуждалось.</li>\n<li>Как «колебание структуры» соотносится с тем, что у самого Имитатора структуры нет (вместо неё частицы), — не проговорено.</li>\n<li>Приём не проверялся ни в одной сцене: применений в переписке нет.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["SP-0130--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-12-13</td>\n<td>269866–269866</td>\n<td>w0066</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0130-volnistyy-udar.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0130--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0130.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
