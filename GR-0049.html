<script>const BASE="";const DOCNAME="Команда Миколая (10 персонажей игры бога)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0049-S01", "GR-0049--chto-eto"], "h": "<p>Одна из двух команд-сторон внутри самой «игры бога» — набор из десяти персонажей, которых Миколай сделал по правилу, поставленному Славой.</p>\n<p>Правило набора задано Славой сразу при объявлении вселенной (2024-04-02, id 153140–153141, 153146): «От тебя 10 человека любых можешь взять из своего окружения и превратить в персонажа желательно», «И также их способности что бы подходили под характер ну хотя бы чуть чуть и чтобы не были прям нарушающий баланс», и отдельным сообщением — «Так же фотки людей которых ты брал персонажа». Ответ Миколая — «Оке, собираю команду» (153142).</p>\n<p>Сама рамка, в которую команда вставлена: «20 человек оказались на какой-то территории и их поделили на 2 группы и т.п», «То бишь соревнование и испытания. То бишь игра бога», «И у всех них есть способности» (2024-04-02, id 153133–153135).</p>\n<p>Отдельного имени у команды в переписке нет. Она называется родовыми словами — «команда», «своя команда», «2 группы»; в справочнике заведена по этому родовому названию.</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0049-S02", "GR-0049--sostav"], "h": "<p>Ровно десять карточек, все выложены одним блоком 2024-04-02 в 23:02 (id 153325–153334):</p>\n<ul>\n<li><a href=\"PS-0037.html\">Дядон Гомбевский</a> — Дядон Гомбевский (153325)</li>\n<li><a href=\"PS-0038.html\">Ояш Бичевский</a> — Ояш Бичевский (153326)</li>\n<li><a href=\"PS-0039.html\">Адам Тихой</a> — Адам Тихой (153327)</li>\n<li><a href=\"PS-0040.html\">Нерадио Попов</a> — Нерадио Попов (153328)</li>\n<li><a href=\"PS-0041.html\">Пил Пончик</a> — Пил Пончик (153329)</li>\n<li><a href=\"PS-0042.html\">Войс Патина</a> — Войс Патина (153330)</li>\n<li><a href=\"PS-0043.html\">Нат Магнов</a> — Нат Магнов (153331)</li>\n<li><a href=\"PS-0044.html\">Терор Мачилович</a> — Терор Мачилович (153332)</li>\n<li><a href=\"PS-0045.html\">Каваи Навалов</a> — Каваи Навалов (153333)</li>\n<li><a href=\"PS-0046.html\">Перо Кладович</a> — Перо Кладович (153334)</li>\n</ul>", "r": [["Дядон Гомбевский", "PS-0037.html"], ["Ояш Бичевский", "PS-0038.html"], ["Адам Тихой", "PS-0039.html"], ["Нерадио Попов", "PS-0040.html"], ["Пил Пончик", "PS-0041.html"], ["Войс Патина", "PS-0042.html"], ["Нат Магнов", "PS-0043.html"], ["Терор Мачилович", "PS-0044.html"], ["Каваи Навалов", "PS-0045.html"], ["Перо Кладович", "PS-0046.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0049-S03", "GR-0049--obschie-sposobnosti-gruppy"], "h": "<p>Общего у участников три вещи, и все три заданы правилом набора, а не самими карточками.</p>\n<p>Первое: у каждого есть способность — это условие вселенной, «И у всех них есть способности» (153135). Оговорка: у Войс Патины (<a href=\"PS-0042.html\">Войс Патина</a>) отдельной строки со способностью в карточке нет, есть только описание — «Делает всё и во всём успевает, со всеми могёт и короче летает, 33 года» (153330); входит ли «летает» в описание характера или это и есть сила, в переписке не сказано.</p>\n<p>Второе: способность подобрана под характер персонажа — «что бы подходили под характер ну хотя бы чуть чуть» (153141).</p>\n<p>Третье: способности ограничены балансом — «чтобы не были прям нарушающий баланс» (153141).</p>\n<p>Кроме того, все десять — переработанные люди из окружения Миколая, и к ним по требованию Славы полагались фотографии прототипов (153140, 153146).</p>\n<p>Ни общей способности в смысле одной силы на всю команду, ни общего происхождения внутри мира игры в переписке не названо.</p>", "r": [["Войс Патина", "PS-0042.html"]]}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0049-S04", "GR-0049--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p>Карточки различаются по возрасту, характеру, роли и механике способности. Дословные описания из карточек:</p>\n<p><strong>Дядон Гомбевский (<a href=\"PS-0037.html\">Дядон Гомбевский</a>)</strong> — «Среднего роста и крупного телосложения мужчина 45 лет». Единственный в команде с двумя способностями: «превращать руки в медвежьи и направлять туды всю массу», и вторая — «невидимость если слышит больше 3 голосов».</p>\n<p><strong>Ояш Бичевский (<a href=\"PS-0038.html\">Ояш Бичевский</a>)</strong> — «Обычный тихий, пожилой 54 года, общительный». Способность работает от обратного: «Чем слабее удар, тем больше урона, вреда тому что/кого он ударил».</p>\n<p><strong>Адам Тихой (<a href=\"PS-0039.html\">Адам Тихой</a>)</strong> — «Неуравновешенный но талантливый мужчина лет 25». Способность срабатывает не от его действия, а от чужой реакции: «За каждый ответ на его подъебку тот кто ответил получает адскую головную боль».</p>\n<p><strong>Нерадио Попов (<a href=\"PS-0040.html\">Нерадио Попов</a>)</strong> — «Слабый по здоровью человек, наркоман и нарко диллер, любит шутки о суициде говоря о том что не достоин жить делая те ужасы которые может, пытается казаться сильным и крутым 20 годиков». Самая подробно расписанная механика в команде: «при прикосновении поглощает душу, в месяц одна. Если раз коснётся за 1 месяц, то добытая душа уйдёт, если 3 раз то его уже душа уйдёт. Души можно добавлять в наркотики и всякий кто их употребит на 20 минут будет во власти души хранящейся в наркотике. Если отдал душу наркоте, то смерть будет уже от 2 прикосновения, а не 3».</p>\n<p><strong>Пил Пончик (<a href=\"PS-0041.html\">Пил Пончик</a>)</strong> — «Максимально серьёзный, но выходки делает смешные, 16 лет», самый младший в команде. Способность: «кто услышит его игру на гитаре перестаёт двигаться».</p>\n<p><strong>Войс Патина (<a href=\"PS-0042.html\">Войс Патина</a>)</strong> — «Делает всё и во всём успевает, со всеми могёт и короче летает, 33 года». Единственная карточка без отдельно выписанной способности.</p>\n<p><strong>Нат Магнов (<a href=\"PS-0043.html\">Нат Магнов</a>)</strong> — «Лидер группы, хороший оратор с широким спектром знаний, 28 лет». Способность: «создание прохода в секретный подземный бункер». Единственный, у кого роль указана прямо в карточке.</p>\n<p><strong>Терор Мачилович (<a href=\"PS-0044.html\">Терор Мачилович</a>)</strong> — «Спокойный и уравновешенный стратег, казначей, 30 лет». Способность: «для самого себя делать людей или предметы не существующими» — то есть действует на его собственное восприятие, а не на мир.</p>\n<p><strong>Каваи Навалов (<a href=\"PS-0045.html\">Каваи Навалов</a>)</strong> — «Для него все конкуренты или ступени для возвышения по лестнице успеха, 28 лет». Способность: «слова буквально имеют вес, чем больше говорит, тем тяжелее удары».</p>\n<p><strong>Перо Кладович (<a href=\"PS-0046.html\">Перо Кладович</a>)</strong> — «Ну так, чисто кабанчик на побегушках, 698 лет», на порядки старше остальных. Способность копирования: «копия способностей и использование 1 раз без людей, потом чтобы снова использовать надо увидеть в реальности этого человека и повторить процесс». Формулировка «использование 1 раз без людей» в карточке неоднозначна.</p>", "r": [["Дядон Гомбевский", "PS-0037.html"], ["Ояш Бичевский", "PS-0038.html"], ["Адам Тихой", "PS-0039.html"], ["Нерадио Попов", "PS-0040.html"], ["Пил Пончик", "PS-0041.html"], ["Войс Патина", "PS-0042.html"], ["Нат Магнов", "PS-0043.html"], ["Терор Мачилович", "PS-0044.html"], ["Каваи Навалов", "PS-0045.html"], ["Перо Кладович", "PS-0046.html"]]}, {"t": "Иерархия", "a": ["S05", "GR-0049-S05", "GR-0049--ierarhiya"], "h": "<p>Задача прописать иерархию поставлена Миколаем 2024-04-03 (id 153457–153458): «Мы должны прописать взаимоотношения в своей команде», «Кто главный кто баласт и т.д». Порядок работ он задал так: сначала отношения внутри команды, потом соревнование — «А потом будут они соревноваться» (153459). Позже он же торопит: «Так что начинай отношения прописывать пораньше», «И я начну» (153494–153495).</p>\n<p>Из иерархии в переписке зафиксировано только то, что стоит прямо в карточках от 2024-04-02:</p>\n<ul>\n<li>Нат Магнов (<a href=\"PS-0043.html\">Нат Магнов</a>) — «Лидер группы»;</li>\n<li>Терор Мачилович (<a href=\"PS-0044.html\">Терор Мачилович</a>) — «стратег, казначей»;</li>\n<li>Перо Кладович (<a href=\"PS-0046.html\">Перо Кладович</a>) — «чисто кабанчик на побегушках».</li>\n</ul>\n<p>Кто «балласт», где остальные семеро в порядке подчинения и какие между ними отношения — не прописано. Сами взаимоотношения внутри команды так и остались невыполненной задачей: «Ни отношения в командах, ни сам турнир в окне так и не прописаны».</p>", "r": [["Нат Магнов", "PS-0043.html"], ["Терор Мачилович", "PS-0044.html"], ["Перо Кладович", "PS-0046.html"]]}, {"t": "Отношения с другими группами", "a": ["S06", "GR-0049-S06", "GR-0049--otnosheniya-s-drugimi-gruppami"], "h": "<p>Вторая сторона задана условием вселенной: 20 человек делятся на 2 группы (153133), вторые 10 персонажей набирает Слава по тому же правилу. Отношение между группами — соревнование и испытания (153134).</p>\n<p>Форма столкновения — турнир (Турнир <em>(статьи ещё нет — <a href=\"kb/ID-0041-turnir.html\">исходник</a>)</em>, 2024-04-03, id 153481–153506). Механизм: авторы придумывают турнир и прописывают идею, отдают её нейронке, каждый пишет ход своей команды, а нейронка расписывает исход, действия и победителя — «Мы идею турнира кидаем нейронке», «А потом прописываем наш ход», «И потом в контексте тура пишем нейронке», «Она сама пропишет исход», «И действия», «И типо кто и как победит».</p>\n<p>Приз — лист Шакоропаля: «А приз, лист Шакоропаля», «По сути это будет макгафин», «Только тсс», «Участникам об этом знать не нужно» (153497–153504).</p>\n<p>Сама идея турнира, его правила и испытания в переписке не придуманы. Ни одного столкновения команды со второй группой не описано. Состав второй команды в записях по этой группе не назван.</p>", "r": [["Турнир", "kb/ID-0041-turnir.html"]]}, {"t": "Как менялась — по датам", "a": ["S07", "GR-0049-S07", "GR-0049--kak-menyalas"], "h": "<p><strong>2024-04-02, id 153126–153148.</strong> Слава закрывает предыдущую вселенную («Сносим вселенную») и объявляет новую: 20 человек, 2 группы, соревнование и испытания, способности у всех. Тут же ставит правило набора: 10 человек из своего окружения, способности под характер и без нарушения баланса, плюс фотографии прототипов. Миколай отвечает «Оке, собираю команду» (153142). Состава ещё нет.</p>\n<p><strong>2024-04-02, 23:02, id 153325–153334.</strong> Команда выложена целиком — десять карточек подряд, одним заходом. Каждая карточка: имя, короткое описание характера и возраста, строка способности. В этот же момент в текст карточек попадают две роли — «Лидер группы» у Ната Магнова и «стратег, казначей» у Терора Мачиловича. Дальше состав не менялся: у всех десяти карточек по одной версии, даты начала и конца совпадают — 2024-04-02.</p>\n<p><strong>2024-04-03, id 153406–153420.</strong> Слава спрашивает, что делать после того, как персонажи названы: «Кстати и что дальше вот мы про всех персов рассказам и что дальше», и поясняет: «Я та про игру сказал в полусонном состояния когда спать ложился поэтому не знаю что дальше». Отдельным сообщением (153417) предлагает вариант и сам его не продолжает: «Просто как идея ( можно на друг друга скидывать монстров с характеристиками и способностями, а другая .......) я не знаю чё дальше». Вариант остался без развития.</p>\n<p><strong>2024-04-03, 12:30–12:45, id 153452–153506.</strong> Миколай задаёт порядок: «Мы придумали персов», «И теперь», «Началась игра бога», «Мы должны прописать взаимоотношения в своей команде», «Кто главный кто баласт и т.д», «А потом будут они соревноваться». На вопрос, как именно они будут соревноваться, отвечает сам себе: «А как», «Я хезе», «Но идея есть». Дальше — схема турнира через нейронку как арбитра и приз-макгафин. На этом работа по команде в окне заканчивается.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "GR-0049-S08", "GR-0049--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Взаимоотношения внутри команды — прямо поставленная задача (153457–153458), которая осталась невыполненной. Кто «балласт», не названо ни для кого.</li>\n<li>Иерархия за пределами трёх подписей в карточках («Лидер группы», «стратег, казначей», «кабанчик на побегушках») не прописана.</li>\n<li>У Войс Патины (<a href=\"PS-0042.html\">Войс Патина</a>) способность не выписана отдельной строкой; неясно, «летает» — это характеристика или сила.</li>\n<li>Формулировка способности Перо Кладовича «использование 1 раз без людей» неоднозначна и не разъяснена.</li>\n<li>Идея турнира, его правила и испытания не придуманы: «Правил, испытаний и содержания турнира нет».</li>\n<li>Ни одного хода, тура или столкновения со второй командой не сыграно и не описано.</li>\n<li>Названия у команды нет.</li>\n<li>Состав второй группы в этих записях не назван.</li>\n<li>Фотографии прототипов Слава запросил (153146), Миколай согласился («Оке оке», 153148) — были ли они присланы, из переписки не видно.</li>\n<li>Что такое лист Шакоропаля по существу, не раскрыто и по замыслу раскрываться не должно: «По сути это будет макгафин».</li>\n</ul></div>", "r": [["Войс Патина", "PS-0042.html"]]}, {"t": "Связи — всё вместе", "a": ["GR-0049--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0037.html\">Дядон Гомбевский</a>, <a href=\"PS-0038.html\">Ояш Бичевский</a>, <a href=\"PS-0039.html\">Адам Тихой</a>, <a href=\"PS-0040.html\">Нерадио Попов</a>, <a href=\"PS-0041.html\">Пил Пончик</a>, <a href=\"PS-0042.html\">Войс Патина</a>, <a href=\"PS-0043.html\">Нат Магнов</a>, <a href=\"PS-0044.html\">Терор Мачилович</a>, <a href=\"PS-0045.html\">Каваи Навалов</a>, <a href=\"PS-0046.html\">Перо Кладович</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0049--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0049.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0049-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0049/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым чинить <code>ID-0041</code> «Турнир»: три входящие ссылки, статьи нет, 4,1 КБ. Это единственная точка, где две команды вообще встречаются. На него ссылаются обе группы и сама «Игра бога» — и пока его нет, у <code>GR-0049</code> и <code>GR-0050</code> не существует ничего, кроме списков карточек. Соревнование заявлено как суть вселенной первой же фразой («то бишь соревнование и испытания. То бишь игра бога»), а в справочнике его нет ни в одном виде. Рядом <code>ID-0042</code> «Лист Шакоропаля» — одна ссылка, статьи нет, 2,9 КБ: приз турнира описан, сам турнир — нет.</p>\n<p>Второе — асимметрия между командами, которая в статье выглядит дырой, а на деле дыра только наполовину. Здесь сказано «состав второй группы в этих записях не назван»; на самом деле он назван на пять человек из десяти и лежит в соседней статье <code>GR-0050</code>: Аполлон, Максим, Кирилл, Дима, Саша (<code>PS-0047</code>–<code>PS-0051</code>), все выложены 2024-04-03. То есть у одной команды десять карточек, у другой пять, и это не отсутствие материала, а незакрытый набор. У обеих групп при этом собственной базы 0.</p>\n<p>Третье — размер самих карточек: 1,3–2,6 КБ на человека, и это весь материал, который вообще есть. Ни у одного из десяти нет второй версии: даты начала и конца совпадают. Отношения внутри команды, поставленные отдельной задачей, не имеют под собой ни одного байта.</p>\n<h3>С чего начать</h3>\n<p>Всё в базе, окно w0029, 2024-04-02 — 2024-04-03.</p>\n<p><code>ID-0041</code> и <code>ID-0042</code> — оба нарезаны, оба без статей, оба из этого окна. <code>IS-0012</code> «Игра бога» (10,2 КБ, три ссылки) и <code>VS-0014</code> (17,5 КБ) — там общая рамка, из них надо тянуть условие «20 человек, 2 группы», а не переписывать его в каждой из двух статей о командах.</p>\n<p>Взаимоотношения внутри команды искать в w0029 после 153506. Задача поставлена там дважды и в один день — «Мы должны прописать взаимоотношения в своей команде», «Кто главный кто баласт и т.д», потом «Так что начинай отношения прописывать пораньше / И я начну». Прежде чем считать это дырой, надо проверить окна после 2024-04-03: сделал ли кто-то из двоих обещанное позже, отдельно от игры. В базе по этой вселенной ничего датированного позже нет, но проверять надо по архиву, а не по нарезке.</p>\n<p>В архив идти за одним — за фотографиями прототипов. Требование стоит в 153146, согласие в 153148, дальше следа нет. Если фото присылались, они в архиве вложениями, а не текстом, и в нарезку по определению не попали.</p>\n<h3>Как развивалось</h3>\n<p>2024-04-02 вечером заявили: предыдущую вселенную сносят, новая — 20 человек, две группы, соревнование, у всех способности. Тем же сообщением ограничили: брать из своего окружения, способность подбирать под характер, «чтобы не были прям нарушающий баланс», плюс фотографии прототипов. В 23:02 того же дня команда выложена целиком — десять карточек подряд, за один заход, и после этого состав не менялся никогда. 2024-04-03 утром Слава сам спрашивает, что дальше, и объясняет почему: «Я та про игру сказал в полусонном состояния когда спать ложился поэтому не знаю что дальше»; предлагает вариант со скидыванием монстров и обрывает себя на «я не знаю чё дальше». Днём Миколай задаёт порядок работ — сначала отношения, потом соревнование — и на вопрос, как именно соревноваться, отвечает «Я хезе. Но идея есть». Идея оказывается схемой с нейросетью-арбитром и призом-макгафином. На этом окно кончается. Ни отношений, ни турнира.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Правило баланса задано для содержания способностей: «чтобы не были прям нарушающий баланс». Оно сформулировано как единственное ограничение набора и адресовано обеим сторонам.</p>\n<p>Для количества способностей на человека правила такого же рода нет. У Дядона Гомбевского их две — руки в медвежьи и невидимость при трёх голосах; у восьмерых по одной; у Войс Патины отдельной строкой нет ни одной, есть только «со всеми могёт и короче летает». Три разных нормы внутри одного блока, выложенного за одну минуту, и ни одна из них не проговорена как норма. Считается ли вторая способность нарушением того самого баланса, и считается ли нарушением её отсутствие, не сказано. Место — 153141 против 153325 и 153330.</p>\n<h3>Отклик</h3>\n<p>Карточки. Возрасты идут ровно: 45, 54, 25, 20, 16, 33, 28, 30, 28 — и 698. Шестьсот девяносто восемь лет у того, кто «чисто кабанчик на побегушках». Никто это не комментирует, ни тогда, ни потом.</p>\n<p>И почти все способности здесь устроены наоборот, чем обычно бывает. Чем слабее удар — тем больше урона. Головную боль получает не тот, кого подъебали, а тот, кто ответил. Слова буквально имеют вес, и чем больше говоришь, тем тяжелее бьёшь. Терор делает людей несуществующими не для мира, а только для себя — то есть его сила бьёт по нему же. Это не набор суперсил, это набор правил игры, и каждое второе наказывает своего носителя за неправильное применение. Самая расписанная — душа в наркотике: одна в месяц, третье касание за месяц убивает тебя самого, а если душу уже отдал наркоте, смерть наступает со второго. Двадцать минут чужой власти над тем, кто это употребил.</p>\n<p>За десять карточек, выложенных подряд за считанные минуты, здесь механики больше, чем во многих доведённых до конца вселенных. И всё это уходит в ноль на фразе «Я хезе». Отдельно смешное: «Только тсс / Участникам об этом знать не нужно» — про приз-макгафин. Участников здесь двое, и оба уже знают.</p></div>", "r": []}];</script>
