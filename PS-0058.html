<script>const BASE="";const DOCNAME="Керагуар";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0058-S01", "PS-0058--proishozhdenie"], "h": "<p>Керагуар появился 2024-04-06 в окне w0030 как карточка, принесённая Миколаем (id 154485). Первым сообщением он назван «Название пришельца: Керагуар», через два сообщения уточнено — «Название вида пришельцев» (id 154488). То есть Керагуар с самого начала подан не как одиночный персонаж, а как вид.</p>\n<p>Имя собрано из «кератин» и «ягуар». Слава на первую карточку отреагировал вопросом «Что такое керагуар», потом сам вспомнил: «Кератин», «Перепутал» (id 154487–154490). Миколай пояснил: «Это типо вещество из которого состоят наши ногти или волосы» (id 154491).</p>\n<p>Замысел Миколай объяснил через уже известные типы персонажей: «Типо есть персы которые бьют землю и из неё вырастают глыбы камня», «Или персы из железа чет создают», «А у него тоже самое, ток из кератина» (id 154494–154496). Отдельно назван мотив выбора именно кератина — уход от алмаза: «А то алмаз», «Да каждый третий о нем говорит и делает его», «Не люблю то что все юзают», «Чет новое принёс» (id 154524–154527). Свою карточку Миколай выделил особо: «Это главная идея, обрати внимание» (id 154486).</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0058-S02", "PS-0058--vneshnost"], "h": "<p>Внешность за одно окно переписывалась дважды, поэтому ниже приводятся оба состояния.</p>\n<p><strong>Первое описание (2024-04-06, id 154485).</strong> Антропоморфное телосложение с мускулистым торсом и конечностями. Кожа покрыта гибким хитиновым экзоскелетом тёмно-зелёного цвета с чёрными полосами, «напоминающими окрас ягуара». Две пары рук с острыми когтями и две пары ног, «напоминающих конечности сколопендры». Голова с кошачьими чертами: вытянутая морда, острые клыки, вертикальные зрачки. Вдоль позвоночника и на голове — острые кератиновые пластины.</p>\n<p><strong>Переделка Славы (2024-04-06, id 154529).</strong> Слава сам переписал облик: «берём основу человек убираем волосы делаем его более серым черным покроем панцирем мышцы То бишь как доспехи. И в спине и в кистях будут отверстия откуда будет появляться жидкой вещество которой будет становится твердым, упругим, или также жидким». Здесь же решается вопрос, откуда лезет кератин, — через отверстия в спине и в кистях.</p>\n<p><strong>Цвет вещества (2024-04-06, id 154588–154595).</strong> По артам Миколая Слава сказал, что получившееся «больше туман». Миколай возразил: «Тебе кажется», «Он бесформенный», «Его трудно контролировать». Слава предложил: «Ну лучше пусть мы приставим что она черная». Миколай согласился — «Мм, оке». Таким образом выделяемое вещество считается чёрным.</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0058-S03", "PS-0058--sposobnosti"], "h": "<p>Из первой карточки (id 154485), характеристики:</p>\n<ul>\n<li>Сверхчеловеческая сила, скорость, ловкость и рефлексы</li>\n<li>Повышенная регенерация тканей</li>\n<li>Острое зрение, слух и обоняние</li>\n<li>Способность передвигаться по вертикальным поверхностям</li>\n<li>Ядовитый укус, вызывающий паралич</li>\n</ul>\n<p>Способности:</p>\n<ul>\n<li><strong>Управление кератином</strong> — «может по желанию выделять кератин и манипулировать его формой и твёрдостью, создавая оружие, доспехи, инструменты или сооружения. Он может менять агрегатное состояние кератина от твёрдого до жидкого».</li>\n<li><strong>Маскировка</strong> — менять цвет и текстуру экзоскелета, сливаясь с окружением.</li>\n<li><strong>Ночное зрение</strong> — видеть в полной темноте.</li>\n<li><strong>Паралитический взгляд</strong> — на короткое время парализовать жертву взглядом мерцающих глаз.</li>\n</ul>\n<p>Уточнения, добавленные в обсуждении:</p>\n<ul>\n<li>На вопрос Славы, откуда именно берётся кератин, Миколай ответил: «Он может управлять агрегатным состоянием кератина, он может сделать жидкие ногти и выделить нужное количество кератина» (id 154507).</li>\n<li>Нити: «Нити из кератина тоже пиздец прочные» (id 154589).</li>\n<li>Кератиновый блок (id 154596) — назван, без пояснения механики.</li>\n<li>Применение как гарпуна: «Он может крч так юзать, как гарпун», «тут он в действии почти оплёл небоскрёб» (id 154597–154598). Оплетение небоскрёба зафиксировано как то, что на арте, а не как событие сюжета.</li>\n</ul>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0058-S04", "PS-0058--svyazi-s-drugimi"], "h": "<ul>\n<li>В карточке сущности указана связь с Тардибовином, многоликим и способностью «управление кератином».</li>\n<li>Внешность первой версии Слава забраковал в том числе потому, что персонаж «монолитний нашего силача» (id 154497) — то есть сливается с уже существующим силачом.</li>\n<li>Алмазный персонаж проходит как точка сравнения: «Типо алмаз он весь из алмазов и может делать алмаз из себя. А здесь чёт даже не понятно» (id 154509–154510). В переписке он назван только как пример, отдельного разбора нет.</li>\n</ul>", "r": []}, {"t": "Как менялся", "a": ["S05", "PS-0058-S05", "PS-0058--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2024-04-06 (id 154484–154496).</strong> Первая карточка: хитиновый экзоскелет под ягуара, две пары рук, две пары ног как у сколопендры, кошачья морда, кератиновые пластины; сверхсила, регенерация, острые чувства, хождение по вертикали, ядовитый парализующий укус; управление кератином, маскировка, ночное зрение, паралитический взгляд.</p>\n<p><strong>Версия 2 — 2024-04-06 (id 154497–154528).</strong> Разбор Славы. Общая оценка — «Вообще нравится вот только как кератин будет выглядеть». Претензии: «Слишком насекомный» (id 154501), Миколай сам соглашается — «Правда от ягуара ничего не осталось 😢», «Согласен». Вторая претензия — сходство с силачом. Третья — непонятно, откуда появляется кератин: «И вообще этот кератин будет появляться из отверстий или от куда», «Типо если из его рук появится это херня это будет как та глупо» (id 154505–154506). Итог Славы: «Ну надо внешку изменить пол способность» (id 154511).</p>\n<p>Здесь же возникает шуточное имя. Миколай: «Ну чел из кератина». Слава: «Герой ноготь» (id 154512–154513). Слава формулирует суть претензии: «Типо все его обличие были страшными и паранормальными а здесь вдруг ноготь» (id 154516). Миколай защищается: «Это тоже жутко камон», «Чекни описание», «Имба же» (id 154521–154523) и переспрашивает: «Че всё-таки на алмазе стоишь?» (id 154528).</p>\n<p><strong>Версия 3 — 2024-04-06 (id 154529–154532).</strong> Слава переписывает внешность целиком (человеческая основа, без волос, серо-чёрный, панцирь поверх мышц как доспехи, отверстия в спине и кистях) и просит прогнать через нейросеть: «Можешь в нейросети скинуть», «Просто охота увидеть как выглядит будет». Миколай — «Оке».</p>\n<p><strong>Версия 4 — 2024-04-06 (id 154585–154598).</strong> Доводка по полученным артам: спор о том, туман это или кератин, решение считать вещество чёрным, прочные нити, кератиновый блок, применение как гарпуна.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S06", "PS-0058-S06", "PS-0058--chto-s-nim-stalo"], "h": "<p>Вся работа над персонажем уместилась в один день, 2024-04-06, внутри окна w0030 (id 154484–154598). Дальнейших упоминаний в переписке нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0058-S07", "PS-0058--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Характер в переписке не обсуждался вообще: ни поведения, ни мотивов, ни роли в сюжете.</li>\n<li>После переделки внешности неясно, остаётся ли от ягуара хоть что-то и остаётся ли имя. Вопрос ставился («Правда от ягуара ничего не осталось»), но решения нет.</li>\n<li>Керагуар назван видом пришельцев, но сколько их, где обитают и есть ли у вида отдельные представители — в переписке не сказано.</li>\n<li>Механика «кератинового блока» названа одним словом и не раскрыта.</li>\n<li>Слава сказал «надо внешку изменить пол способность» (id 154511), однако какая именно половина способностей должна была измениться, не уточнено; правки коснулись только внешности и вопроса о выделении кератина.</li>\n<li>Соотношение первого описания (хитиновый экзоскелет, две пары конечностей) и переделки Славы (человеческая основа) прямо не проговорено: старая карточка не отменена словами, но и не подтверждена.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0058--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0014.html\">игра бога</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0058--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-04-06</td>\n<td>154484–154496</td>\n<td>w0030</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-04-06</td>\n<td>154497–154528</td>\n<td>w0030</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-04-06</td>\n<td>154529–154532</td>\n<td>w0030</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-04-06</td>\n<td>154585–154598</td>\n<td>w0030</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0058-keraguar.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0058--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0058.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
