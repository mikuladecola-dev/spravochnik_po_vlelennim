<script>const BASE="";const DOCNAME="Система сил (сосуд)";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0086-S01", "SP-0086--mehanika"], "h": "<p>Общее правило мира, а не отдельная способность: то, откуда у мета-людей берётся сила и почему её нельзя тратить бесконечно. Изложено Славой 2024-07-05 (окно w0044, id 197911–197931).</p>\n<p>Формулировка целиком (197927): «Мета люди с рождения получают силу из в нее, и они её использует. Энергия не бесконечная так как сосуд поглощает энергию который дадут и он заполняется и им надо его опустошить иначе сосуд лопнет».</p>\n<p>То есть: сила приходит «из вне», с рождения; у носителя есть сосуд; сосуд поглощает выданную энергию и заполняется; опустошать его обязан сам носитель; при переполнении сосуд лопается. Короткая формула того же — «Сила из в нее» (197923).</p>\n<p>Размер сосуда — величина индивидуальная. Когда Слава спросил «Откуда у нуара столько энергии что бы 24/7 держать барьер» (197929), Миколай ответил: «ну он невьеьено большой сосуд» (197930) и «тем более он не один» (197931).</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0086-S02", "SP-0086--ogranicheniya-i-cena"], "h": "<ul>\n<li>Энергия не бесконечная.</li>\n<li>Сосуд заполняется от получаемой энергии, и его надо опустошать.</li>\n<li>Невыполнение этого условия названо прямо: «иначе сосуд лопнет» (197927). Что именно происходит с носителем при разрыве сосуда, в переписке не сказано.</li>\n</ul>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0086-S03", "SP-0086--nositeli"], "h": "<p>Правило распространяется на всех мета-людей: силу «с рождения» получают все.</p>\n<p>Отдельно названы: Нуар — как случай очень большого сосуда, обеспечивающего круглосуточный барьер (197929–197931). В том же куске переписки рядом идут реплики про Грань и про изменение веществ (способность защитника Асгарда): «Он не может изменить явления чужих способностей. То бишь в него запустят огонь он его не изменят так как он состоит из энергий. Так же и кости если в него стрельнуть» (197914) и обмен «не объём, а именно заряд» (197915) — «Нет» (197916, 197917), «Как и все» (197919). Как эти реплики соотносятся с правилом сосуда, в переписке не проговорено.</p>\n<p>Здесь же Миколай описывает отдельный источник энергии: «энергию он естественно будет получать с верующих» (197912), «с каждой молитвой её количество увеличится» (197913). Согласование этого источника с правилом «сила из вне с рождения» в переписке не сделано.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0086-S04", "SP-0086--kak-menyalas-po-versiyam"], "h": "<p><strong>2024-07-05, id 197911–197931.</strong> Единственное записанное изложение. Слава подаёт его как повтор: «Я же тебе вроде объяснял систему сил ?» (197921). Миколай отвечает «нет врд» (197924). Из правила сразу выводится вопрос про энергию Нуара и ответ про «невьеьено большой сосуд».</p>\n<p>Более ранняя версия объяснения в этом файле не приведена.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0086-S05", "SP-0086--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Правило приложено к тьме Нуара (<a href=\"SP-0076.html\">Тьма Нуара</a>): круглосуточный барьер объясняется размером сосуда носителя, а не отдельным механизмом.</p>", "r": [["Тьма Нуара", "SP-0076.html"]]}, {"t": "Пробелы", "a": ["S06", "SP-0086-S06", "SP-0086--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Слава говорит, что объяснял систему раньше — оригинал должен быть в более раннем окне, здесь его нет.</li>\n<li>«Из вне» — откуда именно, не названо.</li>\n<li>Как опустошают сосуд, помимо использования способности, не описано.</li>\n<li>Что происходит при разрыве сосуда, не сказано.</li>\n<li>Реплика «тем более он не один» (197931) не раскрыта: кто ещё держит барьер и как это устроено, не обсуждалось.</li>\n<li>Совместимость энергии «с верующих и молитв» (197912–197913) с системой сосуда осталась нерешённой.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0086--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0076.html\">Тьма Нуара</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0104.html\">Нуар</a></li>\n<li><strong>Упомянут в способностях:</strong> <a href=\"SP-0076.html\">Тьма Нуара</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0086--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-05</td>\n<td>197911–197931</td>\n<td>w0044</td>\n<td>7 островов (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0086-sistema-sil-sosud.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0086--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0086.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
