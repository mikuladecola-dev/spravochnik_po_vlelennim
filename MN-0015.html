<script>const BASE="";const DOCNAME="Деревня Лихая";
const LEAD="";
const CH=[{"t": "Где находится — в каком мире и в каком его месте", "a": ["S01", "MN-0015-S01", "MN-0015--gde-nahoditsya"], "h": "<p>Деревня в мире вселенной «Апостол». Отряду её положение известно как единственной точки в округе: «Ясно же, с деревни Лихой, здесь она одна на ближайшие 40 км» — так капитан объясняет, откуда мог взяться мальчик (2025-03-03, id 297461).</p>\n<p>Отряд идёт к ней от места, где стояли танки: сначала поле, где встретили мальчика, затем дорога с танками и трупами, затем тропинка. «Идя по трапинке, держа в уха остро. Они шли, шли не долго, быстра дойдя» (2025-03-03, id 297461). Рядом лес, из которого потом выскакивает эльф, и где-то «глубоко в лесу» находится стрелок, чей хлопок попадает эльфу в голову (2025-03-03, id 297462).</p>\n<p>Время действия — Вторая мировая война. В разборе 2025-03-10 Слава настаивает, что это выводится из самого текста: «Разве нельзя сложить 2+и понять что это 2 мировая война» (id 300777). Миколай отвечает, что понял это только после прямого пояснения: «ну про вторую мировую и ты потом сказал» (id 300778), «да и я догадался бы» (id 300780).</p>\n<p>Чья деревня — прямо не названо. Миколай в своём пересказе фиксирует это как незнание: «деревня немцев или русских не знаю» (2025-03-10, id 300761); отдельного ответа на этот пункт в переписке нет.</p>", "r": []}, {"t": "Что собой представляет", "a": ["S02", "MN-0015-S02", "MN-0015--chto-soboy-predstavlyaet"], "h": "<p>Мёртвая деревня. «И увидели они, мёртвую деревню, тихую Лихую, как кладбище, нет, это и было кладбище» (2025-03-03, id 297461).</p>\n<p>Главный объект в ней — братская могила: «Ведь долго не ходя они увидили братскую могилу. Полный трупов, но помимо этого они увидели след крови, из этой самой могилой» (2025-03-03, id 297461). Кровавый след ведёт из могилы наружу — по нему отряд и достраивает, что оттуда кто-то вышел.</p>\n<p>Ту же могилу изнутри описывает мальчик, у которого нет слов для увиденного: «Я лежал в цистерне наполненой крови, нет это не цистерна, у цистерн нет такой трубы, да и она не круглая. Я вылез и видел трупы» (2025-03-03, id 297460). Старик передаёт этот рассказ отряду в том же виде: «Видел, он цистерну с трубой, наполненой кровью и трупами» (id 297461) — и отряд принимает это за бред: «Ладно, уже понятно что у мальчика с головой не всё ладно».</p>\n<p>Название деревни в переписке отмечено как отдельная странность, но не объяснено. Рыжеволосый: «Хм, Лихая и кто дал название такое» (2025-03-03, id 297461) — ответа на этот вопрос нет.</p>", "r": []}, {"t": "Что с ним связано — предметы, механики, силы", "a": ["S03", "MN-0015-S03", "MN-0015--chto-s-nim-svyazano"], "h": "<p><strong>Братская могила как точка пробуждения.</strong> Именно в ней очнулся Бессмертный. Версия 2025-03-10: «Деревню лихую заехали немцы и всех поубивали, а Бессмертного убили пистолетом, который потом им пахнет» (id 300765). Пробуждение сопровождается полной потерей памяти: первое, что мальчик формулирует после выхода из могилы, — «Где я? Кто я?» (2025-03-03, id 297460), а старик после разговора с ним докладывает: «Ничего о себе не знает ни возраст, ни имя, ни где живёт, ни кто родители» (id 297461).</p>\n<p><strong>Три улики, которые Слава закладывал в текст</strong> и перечисляет прямо (2025-03-10, id 300775): «Немцы, железная которая пахнет бессмертным, сами немцы который пахнут трупами, и братская могила». Логика связи, по словам Славы: «Трупы в которых проснулся Бессмертный и немецкий солдаты пахлий этими трупами» (id 300821), «Трупы лежали в деревне, а значит их можно назвать трупами жителей» (id 300829), «И это всё сложить и получиться что немцы напали на деревню» (id 300783). Железо, пахнущее Бессмертным, — это пистолет, из которого его убили (id 300765).</p>\n<p><strong>Силы Бессмертного, проявившиеся вокруг деревни.</strong> Управление кровью и частями тела: из спины вырываются пять красных паучьих лап, кровь на поле сковывает ноги эльфа, из руки делается копьё, кровь из раны образует руки (2025-03-03, id 297462). Ранее, у танков — красные щупальца, проникающие через щели, и способность становиться «больше шире и длинее», заполняя весь танк (id 297460). Раны заживают мгновенно.</p>\n<p><strong>Постоянно активное благословение.</strong> Причина белых светящихся глаз и вытекающего мозга: «Глаза у него всегда белые потому что, у него благословение всегда активно, вот поэтому у него иногда мозг вытекает, но с помощью своей силы он может его восстанавливать, но всё забывает» (2025-03-10, id 300765).</p>\n<p><strong>Боль и гнев как переключатель.</strong> Формулировка Миколая, не опровергнутая в ответе: «ему не нравится боль и она заставляет его вспоминать гнев, который активирует способности» (2025-03-10, id 300761). В прозе это выглядит так: «Единственно, что он понимал это боль... но гнев настоль обычный и привычный начал итди сквозь него. Передо мной враг» (2025-03-03, id 297462).</p>\n<p><strong>Хлопки.</strong> Мальчик называет так выстрелы: «это боль иная, в разы страшней и выше... не та боль от хлопков» (id 297460). Атака эльфа на дистанции — тоже хлопок, но «хлопок не людей, а этого субьекта», от которого в груди образуется дыра, и эта рана не заживает (id 297462). Финальный хлопок из леса — «почти такой же как и у них но другой».</p>", "r": []}, {"t": "Персонажи и события", "a": ["S04", "MN-0015-S04", "MN-0015--personazhi-i-sobytiya"], "h": "<p><strong>Отряд из четырёх русских солдат:</strong> Капитан (он же командир), Старик, Рыжий (рыжеволосый, «не старший 30»), Доктор (Док). Их принадлежность уточнена отдельно: «Старик, рыжий, Доктор и капитан русский солдаты, вот поэтому он их понимает» (2025-03-10, id 300765).</p>\n<p><strong>Задача отряда</strong> — разведка: «Как и по заданию, мы узнали обстановку и доложим в штаб» (2025-03-03, id 297462).</p>\n<p><strong>Ход событий (2025-03-03, id 297460–297462):</strong></p>\n<ol>\n<li>До деревни мальчик уничтожает танковую группу: пролезает в щель танка, разрывая собственную плоть, «он словно жидкость проникал в железный замок», раздавливает экипаж, затем красными щупальцами из люка обволакивает два соседних танка. После этого у него начинается головная боль иного рода, из носа идёт густая кровь, и он теряет себя.</li>\n<li>Отряд встречает мальчика в поле — черноволосого, полностью в крови, с белыми светящимися глазами, глядящего в небо. Док сразу отмечает: «Да не ранен он, смотри не одной раны. Это не его кровь». Рыжий спрашивает Дока про «болезнь или мутация при котором глаза светятся и белый словно у слепого, при этом он всё видет» — Док отвечает: «Не знаю, впервые вижу подобная, да и слышу тоже».</li>\n<li>Привал по инициативе старика, мальчик засыпает с ложкой во рту, отряд ночует.</li>\n<li>Утром отряд видит танки, «наполненый по самый края, кровью», и трупы на дороге. Док: «Раны резаный, а в танке, словно бомбу взорвали». Отряд обходит эту сцену — «обойдя сценку безумного Бога».</li>\n<li>Приход в Лихую, братская могила, кровавый след из неё.</li>\n<li>Разговор капитана со стариком в стороне. Капитан: «Я конечно не верующий, но здесь сложить 2+2, и будет ясно, что этот паренёк из могилы этой вылез и закончил жизнь наших недругов» — и предлагает: «нам бы наверное, не помешало бы его устранить». Старик отказывает двумя доводами: «Вон смотри, его танки не взяли, думаешь мы сможем» и «тем более если бы он захотел нас убить то давно бы убил бы».</li>\n<li>Капитан решает доложить штабу увиденное, а про мальчика умолчать: «а про мальца говорить. Наверное не надо, ведь ещё не факт, что он причастен, да и провоцировать его тоже не охота».</li>\n<li>На обратной дороге мальчик замечает в лесу «кого-то странного» с «длинной железной палкой», которого никто из отряда не видит. Из леса выскакивает эльф.</li>\n</ol>\n<p><strong>Эльф.</strong> Ростом «по 2 метра», худой «словно ветка», в одеянии «по типу полуплатия и полудоспехов», длинные оранжевые волосы, вытянутые острые уши, глаз не видно — их закрывает железная маска, «не пойми как держашия». Атакует старика мечом, мальчик закрывает старика собой. Реплика эльфа — единственная: «Что-то, не верится, что ты апостол, тот самый легендарный, тем кем наш пугали старший, тех кого боялись сильнейший и те кто могут убить даже существо, ты явно не заслуживаешь эту силу» (id 297462). Смысла её не понимает никто, включая мальчика.</p>\n<p><strong>Бой и смерть мальчика.</strong> Эльф уклоняется от лап, его окружает нечто вроде невидимой защиты: кровавые руки «в момент прикосновения изменили свою траекторию», пули отряда — тоже. Мальчик падает, у него из рта, носа и ушей течёт мозг, и он умирает. Эльфа сбивает выстрел в голову из глубины леса.</p>\n<p><strong>Мотив эльфа</strong> уточнён позже и отделён от деревни: «Эльф попав в наш мир почувствовал апостола и решил его убить, и всё эльф вообще не причастен к становлению апостолом» (2025-03-10, id 300765).</p>", "r": []}, {"t": "Как менялся по версиям — по датам", "a": ["S05", "MN-0015-S05", "MN-0015--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-03-03 (id 297460–297462).</strong> Деревня вводится внутри прозы: как локация задания отряда и как источник происхождения героя. Кто вырезал деревню — в самом тексте прямо не сказано; сказано только, что она мертва, что в ней братская могила и что из могилы тянется кровавый след.</p>\n<p><strong>Версия 2 — 2025-03-10 (id 300761–300765).</strong> Миколай выписывает своё прочтение: «есть деревня Лихая. там всех убил эльф и в этой деревне образовалась могила яма с солдатами». Слава отвечает односложно: «Нет» (id 300762) — и даёт правку: деревню вырезали немцы, а Бессмертного убили из пистолета. Эльф из причин смерти жителей убирается полностью.</p>\n<p>В том же пересказе Миколая забракованы или остались без ответа несколько пунктов:</p>\n<ul>\n<li>«эльф это чужестранец, а дед с шрамами слезами кто-то из апостолов» — отдельного ответа на часть про деда со шрамами-слезами в переписке нет;</li>\n<li>«немцы некоторые знают этого мальчика, некоторые понимают его речь (старик вроде понимает)» — отклонено: понимает его русский отряд, потому что он говорит по-русски;</li>\n<li>«у кого-то есть ремень или брелок связанная с мальчиком» — ответа нет;</li>\n<li>«этот эльф пробудил способности гг» (id 300763) — отклонено прямо: эльф «вообще не причастен к становлению апостолом».</li>\n</ul>\n<p><strong>Версия 3 — 2025-03-10 (id 300775–300829).</strong> Не изменение фактуры, а разбор того, читается ли авторство немцев из уже написанного. Слава перечисляет улики (id 300775) и настаивает, что связь показана: «Я же достаточно точно показал связь между трупами жителей и солдатами Немцов» (id 300809). Миколай отвечает, что улику пропустил: «конкретно на такое я не обратил внимание» (id 300803), «не совместил с деревней» (id 300805), «для меня жители = люди» (id 300807).</p>\n<p>Внутри этого спора уточняется, какие слова в тексте были: Слава — «Там же только солдаты и солдаты, я нигде не использовал слова люди или не добавлял» (id 300813) и «Жителей я тоже не использовал, я сказал трупы» (id 300818). Итоговая формулировка связи: «Трупы лежали в деревне, а значит их можно назвать трупами жителей» (id 300829).</p>\n<p>Отдельно проговаривается, кем был «монстр», которого опасался отряд. Миколай: «я что-то прочел что был монстр которого команда старика боялась» и «типа это эльф я решил» (id 300790, 300792). Слава: «Монстр это Бессмертный» (id 300793). Миколай отмечает, что опасение читалось слабо: «ну ток рыжий опасался бесмертного» (id 300798), «да и то что имено его боятся не особо понятно» (id 300799), «типа я подумал че им ребенка бояться» (id 300800).</p>\n<p>Позиция Миколая по методу изложения: «сложность истории по другому можно создать, а так для начала лучше писать ясно то что в голове» (id 300776) и «сейчас бы не советовал заниматься математикой в историях, отражать мысли разжевывая неприятно и я сам никогда к такому не стремился но думаю сейчас важнее» (id 300785).</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "MN-0015-S06", "MN-0015--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Кто дал деревне название и что оно значит — вопрос задан в тексте рыжеволосым, ответа в переписке нет.</li>\n<li>Чья деревня по населению (русская или немецкая) — прямо не названо; Миколай зафиксировал это как непонятое, отдельного ответа не последовало.</li>\n<li>Размер деревни, число жителей, число тел в братской могиле — не названы.</li>\n<li>Кем и когда вырыта братская могила — не сказано.</li>\n<li>Что стало с деревней после ухода отряда — в переписке не сказано.</li>\n<li>Кто стрелял из глубины леса и попал эльфу в голову — на этом кусок прозы обрывается, продолжения в материале нет.</li>\n<li>«Дед с шрамами слезами» — упомянут только в пересказе Миколая как предположение об апостоле; кто это и связан ли он с деревней, осталось нерешённым.</li>\n<li>«Ремень или брелок связанная с мальчиком» — предположение Миколая, ответа нет.</li>\n<li>Как именно немцы убили Бессмертного до его первого пробуждения и почему он оказался в общей могиле с жителями — не разобрано; сказано только, что убили из пистолета, который потом им пахнет.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["MN-0015--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-03-03</td>\n<td>297460–297462</td>\n<td>w0078</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-10</td>\n<td>300761–300765</td>\n<td>w0079</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-10</td>\n<td>300775–300829</td>\n<td>w0079</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/monumenty/MN-0015-derevnya-lihaya.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MN-0015--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MN-
