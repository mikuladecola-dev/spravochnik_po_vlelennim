<script>const BASE="";const DOCNAME="Алто";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0205-S01", "PS-0205--proishozhdenie"], "h": "<p>Алто — тёмный эльф, одна из жертв Альгиза. Материал чужой: Миколай пересказывает вселенную из другого чата, где у Альгиза «я ДАЖЕ ДЛЯ КАЖДОЙ ЖЕРТВЫ ПРЕДЫСТОРИЮ ПРИДУМАЛА ЖОСКУЮ». Предыстория самого Алто при этом не изложена — назван только его талант и его гибель.</p>", "r": []}, {"t": "Характер", "a": ["S02", "PS-0205-S02", "PS-0205--harakter"], "h": "<p>Одна черта: «А он же как котёнок, когда на виду – даже не пискнет».</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0205-S03", "PS-0205--sposobnosti"], "h": "<p>Талант — «всегда выигрывать в любых азартных играх, так что он мог обыграть само время». Масштаб задан отдельной фразой: «Пантеоны богов склонялись перед его мастерством».</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0205-S04", "PS-0205--svyazi-s-drugimi"], "h": "<p>Альгиз — убийца Алто. Альгиз был проклят: брошенный им нож перед лицом врага оборачивается и никого не задевает; он пытался разрушить это проклятие, «убивая чужими руками всё больше людец», и был при этом «мозгом, в конце концов, а остальные – типа пешками».</p>", "r": []}, {"t": "Что с ним стало", "a": ["S05", "PS-0205-S05", "PS-0205--chto-s-nim-stalo"], "h": "<p>Убит Альгизом: «Но даже того он убил». Цели своей Альгиз этим не достиг — «Короче, он не получил той мощи, зато его почти убили мои другие персонажи».</p>", "r": []}, {"t": "Как менялся", "a": ["S06", "PS-0205-S06", "PS-0205--kak-menyalsya"], "h": "<p><strong>2025-02-25 (id 295496–295501).</strong> Единственная версия. Алто назван сразу с талантом и с фактом собственной гибели от руки Альгиза.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0205-S07", "PS-0205--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Чужой материал, пересланный из другого чата.</li>\n<li>Внешность не описана, кроме того, что он тёмный эльф.</li>\n<li>«Жоская предыстория», которая, по словам автора исходной вселенной, была придумана для каждой жертвы, для Алто не пересказана.</li>\n<li>Не сказано, какую именно «мощь» Альгиз рассчитывал получить с убийства Алто и почему не получил.</li>\n<li>Обстоятельства убийства не описаны.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["PS-0205--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-02-25</td>\n<td>295496–295501</td>\n<td>w0077</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0205-alto.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0205--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0205.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0205-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0205/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым чинить надо не пробел, а расхождение. Реплика «А он же как котёнок, когда на виду – даже не пискнет» стоит в двух статьях сразу и отнесена к двум разным персонажам: здесь она весь раздел «Характер» Алто, а в <code>PS-0204</code> тем же куском описан характер Альгиза («На виду ведёт себя тихо и не сопротивляется»). Диапазоны перекрываются — <code>PS-0205</code> это 295496–295501, <code>PS-0204</code> это 295465–295507, — то есть одна и та же реплика разобрана дважды с разной атрибуцией. Одна из двух неверна, и это единственная черта характера Алто вообще.</p>\n<p>Дальше по стоимости — не сам Алто (2 734 знака статьи при 2 712 базы: вынуто всё, что было), а класс, к которому он приписан. Заявлено, что предыстория придумана для каждой жертвы; названа одна жертва. Записи под жертв Альгиза как класс нет, у остальных нет даже имён. Весь корпус, о котором сказано «для КАЖДОЙ», представлен единственным образцом на 2,7 КБ.</p>\n<p>Третье: <code>SP-0189</code> «Талант Алто» — отдельная статья на 4 156 знаков, то есть больше самого носителя, и ссылок на неё ноль. Талант живёт отдельно от персонажа, сшивки нет ни с одной стороны.</p>\n<p>Отдельно проверить <code>PS-0176</code> «Тёмный эльф»: 23 231 знак базы, статьи нет, вселенная не определена, ссылок ноль (рядом <code>SP-0155</code> «Заклинания тёмного эльфа», 6 414, тоже без статьи). Алто назван тёмным эльфом. Та же это порода или совпадение слова — нигде не сверено; если та, это самый дешёвый способ дать ему хоть какую-то внешность.</p>\n<h3>С чего начать</h3>\n<p>В базе. Диапазон 295496–295501 целиком сидит внутри <code>PS-0204</code> (295465–295507), и там те же реплики приведены полнее — включая масштаб («Пантеоны богов склонялись перед его мастерством») и итог («Короче, он не получил той мощи»). Начинать с этой сверки, а не с поиска.</p>\n<p>За «жоской предысторией» — в архив. Ориентир: 25 февраля 2025, окно w0077, после 295522 (там кончается <code>PS-0209</code>, дальше в базе по этой вселенной пусто), плюс обещанные там же рисунки. Ключ искать не по «Алто», а по «жертва», «предыстория», «дневник» — материал восстанавливается по старому дневнику рассказчицы, и если предыстории где-то записаны, они идут через это слово.</p>\n<h3>Как развивалось</h3>\n<p>Одна дата, 2025-02-25, одна версия. Заявка и отмена стоят в одном предложении: талант назван — «мог обыграть само время», «пантеоны богов склонялись» — и тут же снят: «Но даже того он убил». Ограничение приходит раньше развития, масштаб существует ровно одну реплику. Возврата не было.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Талант задан предельно широко: выигрывать в любых азартных играх, вплоть до выигрыша у самого времени. Граница у него по факту есть — от Альгиза он не выигрывает, — но что считается игрой, а что нет, нигде не проговорено. Для проклятия Альгиза условия перечислены подробно: с любого расстояния, любыми способами, даже случайно. Для таланта того же порядка охвата такого перечня нет.</p>\n<h3>Отклик</h3>\n<p>Сильная рифма, скорее всего незапланированная: человек, обыгравший время, погибает от того, кто вообще не способен убить. Один не может проиграть, другой не может нанести вред — и встреча двух абсолютных запретов кончается смертью того, кто выигрывал. И следом сухое «он не получил той мощи»: убийство лучшего игрока в мире не даёт ничего, даже сюжетной награды. Жаль, что от Алто осталось три предложения — из них два держат всю конструкцию.</p></div>", "r": []}];</script>
