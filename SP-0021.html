<script>const BASE="";const DOCNAME="Пламенный";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0021-S01", "SP-0021--mehanika"], "h": "<p><a href=\"SP-0021.html\">Пламенный</a> существует в двух несведённых наборах: раннем (2023, вселенная «Бен 10», форма Ультиматрекса) и позднем (2024, вселенная «монстры», разбор пришельца). Старый набор не отменялся.</p>\n<p><strong>Набор 2023 года</strong> (2023-05-24, id 42146; повторён дословно 2023-05-31, id 43085). Пламенный стоит первым пунктом списка Ультиматрекса из одиннадцати форм. Способности перечислены так:</p>\n<ul>\n<li>регенерация;</li>\n<li>«он второй по физической силе»;</li>\n<li>«пускать огненный шары( что бы могли ломать блоки )»;</li>\n<li>«управлять растением»;</li>\n<li>«выпускать дымовую замесу с эффектами».</li>\n</ul>\n<p>Ультиформа Пламенного: «все также только синяя пламя и что бы она могла быть более разрушительная».</p>\n<p>Требование «что бы могли ломать блоки» и упоминание блоков в соседних пунктах списка задают отсчёт в блоках; чем именно измеряется «второй по физической силе», в переписке не сказано. В том же списке под №2 значится Гумангозавр — «самый сильный(что бы он мог ломать почти любой блоки )»; прямой связки «Пламенный второй после Гумангозавра» авторы не проговаривали.</p>\n<p><strong>Набор 2024 года</strong> (2024-11-17, id 259058), формулировка Славы целиком:</p>\n<div class=\"q\"><p>«Пламенный<br>Бессмертный, мгновенно регенерирует<br>Управляет огнем, газами, и растениями,<br>Сверх сильный<br>И способен передвигаться в земля<br>( Мой любимый пришелец )»</p></div>\n<p>Здесь регенерация усилена до «бессмертный, мгновенно регенерирует», управление растениями сохранилось, дымовая завеса превратилась в управление газами, добавилось передвижение в земле, а «второй по физической силе» стало просто «сверх сильный». Огненные шары в поздней формулировке отдельно не названы — вместо них общее «управляет огнем». Ультиформа во второй версии не упоминается.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0021-S02", "SP-0021--ogranicheniya-i-cena"], "h": "<p>Ограничений у способности не зафиксировано ни в одной версии. Прямая формулировка Славы (2024-11-17, id 259059): «По сути у него нет слабости».</p>\n<p>Именно отсутствие слабости вызвало спор. Миколай о наборе целиком: «какой-то неподходящий», «сложно», «нет, всё вместе это чит» (id 259060, 259061, 259068). Слава ответил, что «все по отдельности они какие то слабый» (id 259069), с чем Миколай согласился — «да», «слабые», «но полезные» (id 259070–259072).</p>\n<p>Цена или расход на применение не обсуждались.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0021-S03", "SP-0021--nositeli"], "h": "<ul>\n<li>Форма №1 Ультиматрекса — в списке 2023 года (id 42146, 43085).</li>\n<li>Пришелец Бен 10, второй по счёту из разобранных в окне w0064 (2024-11-17). Помечен Славой как «Мой любимый пришелец» (id 259058).</li>\n</ul>\n<p>Отдельного персонажа-носителя во вселенной «монстры» у способности нет: разбор до встраивания не дошёл.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0021-S04", "SP-0021--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2023-05-24 (id 42145–42148, окно w0013), вселенная «Бен 10».</strong> Слава выкладывает список Ультиматрекса из одиннадцати форм, Пламенный — пункт 1: регенерация, второй по физической силе, огненные шары, ломающие блоки, управление растением, дымовая завеса с эффектами; ультиформа — то же самое, но синее пламя и разрушительнее. Тем же вечером (id 42148): «Отсюда можно сбагрить способность остановка времени и ускорение времени» — реплика относится к списку в целом, к какому именно пункту, не уточнено.</p>\n<p><strong>Версия 2 — 2023-05-25 (id 42175–42178, окно w0013).</strong> Слава кидает ссылку на ролик (https://youtu.be/MzT-WuNJ94M) и пишет: «Отсюда можно способность огня». Следом — вторая ссылка (https://youtu.be/5KrJbIfMg1U) и отдельно «И текстуру пришельца часов». Это указание на источник, откуда предполагалось брать реализацию огня; содержание роликов в переписке не пересказано.</p>\n<p><strong>Версия 3 — 2023-05-31 (id 43084–43086, окно w0014).</strong> Миколай выкладывает тот же список Ультиматрекса дословно, без правок (id 43085). Пункт про Пламенного совпадает с версией 1 буква в букву. Следующая реплика Славы — «Когда ролик будешь делать».</p>\n<p><strong>Версия 4 — 2024-11-17 (id 259056–259059, окно w0064), вселенная «монстры».</strong> Миколай: «следующего пришельца припарируем?», «пламеный тогды». Слава даёт новый набор: бессмертие с мгновенной регенерацией, управление огнём, газами и растениями, сверхсила, передвижение в земле. Отдельной репликой — отсутствие слабости.</p>\n<p><strong>Версия 5 — 2024-11-17 (id 259060–259077, окно w0064).</strong> Спор о том, что делать с набором. Миколай предлагает разбить на отдельные кубики, Слава отказывается. Разговор упирается в тупик и заканчивается репликами Миколая про баланс: «ты че», «хочешь баланс нахуй послать?», «я то непротив», «но на тебя не похоже», «ты точно тот слава которого я знаю?» (id 259073–259077). Решения нет.</p>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S05", "SP-0021-S05", "SP-0021--otklonennye-varianty"], "h": "<p><strong>Разбиение на разные кубики (2024-11-17, id 259062–259067).</strong> Миколай предложил не делать Пламенного одной сущностью, а разнести набор по отдельным кубикам: «один реген», «другой управление огр», «еще сила», «и ещё передвижение в земле».</p>\n<p>Слава отказался: «Нет типо разделять способности который изначально были вмести как глупо» (id 259067). Второй его довод — «Да и плюсом все по отдельности они какие то слабый» (id 259069).</p>\n<p>Ни один из вариантов не принят: разбиение Слава забраковал, целый набор Миколай считает читом. Итог не выбран.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S06", "SP-0021-S06", "SP-0021--svyaz-s-drugimi-sposobnostyami"], "h": "<ul>\n<li><strong>Ультиформа</strong> — усиленное состояние формы; для Пламенного описано только в наборе 2023 года (синее пламя, разрушительнее). В списке ультиформы прописаны также для Гумангозавра, Эхо-эхо, Обезьяны-паука и Крылатого; у Жиле, Лучистого, Граваттака, Часов, Алмаза и Краба ультиформа не указана.</li>\n<li><strong>Ультиматрекс</strong> — набор форм, куда Пламенный входит первым пунктом.</li>\n<li><strong>Разные кубики под разные способности</strong> — предложенный и отклонённый способ разложить набор Пламенного.</li>\n<li><strong>Чёрный ящик</strong> — Пламенный числится частью Чёрного ящика, но встроен в него не был.</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S07", "SP-0021-S07", "SP-0021--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Итог спора 2024-11-17 не выбран, способность в Чёрный ящик так и не встроена (окно w0064).</li>\n<li>Как соотносятся ранний набор 2023 года и поздний 2024-го — заменяет ли второй первый или это разные состояния — в переписке не сказано.</li>\n<li>Механика передвижения в земле не описана: скорость, глубина, оставляет ли след.</li>\n<li>Что за «эффекты» у дымовой завесы, не расшифровано.</li>\n<li>Соотношение «бессмертный» и «мгновенно регенерирует» не разведено: неизвестно, это два свойства или одно, сформулированное дважды.</li>\n<li>Кто первый по физической силе, если Пламенный второй, прямо не назван.</li>\n<li>Управление газами: какими именно, только ли дым, не сказано.</li>\n<li>Ультиформа в наборе 2024 года не упоминается — отменена она или просто не проговорена, осталось нерешённым.</li>\n<li>Содержание роликов, названных источником способности огня и текстуры, в переписке не изложено.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0021--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0021--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2023-05-24</td>\n<td>42145–42148</td>\n<td>w0013</td>\n<td>Бен 10 (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2023-05-25</td>\n<td>42175–42178</td>\n<td>w0013</td>\n<td>Бен 10 (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2023-05-31</td>\n<td>43084–43086</td>\n<td>w0014</td>\n<td>Бен 10 (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-11-17</td>\n<td>259056–259059</td>\n<td>w0064</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-11-17</td>\n<td>259060–259077</td>\n<td>w0064</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0021-plamennyy.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0021--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0021.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
