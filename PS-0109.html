<script>const BASE="";const DOCNAME="Юкиона";
const LEAD="<p>Персонаж вселенной «7 островов». Варианты имени — «Юкиона с миниганом», «юкиона». Три версии, все за один день (2024-07-03), окно w0041.</p>";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0109-S01", "PS-0109--proishozhdenie"], "h": "<p>Появляется в списке защитников, который Миколай выкладывает одним сообщением (2024-07-03, id 194785):</p>\n<div class=\"q\"><p>1. блуждающий огненный гриб<br>2. дриада великан<br>3. тот пламенный перс<br>4. юкиона с миниганом в котором снаряд сосульки</p></div>\n<p>То есть четвёртый защитник, предложенный Миколаем. Слава переспрашивает: «Юкиона ?» — и Миколай объясняет, откуда взято: «японская девушка из мифов, надо бы почитать про неё, ну короче типо снегурочки, ток опасная». Слава отвечает «Ну надо подумать»; прямого согласия в этот момент нет.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0109-S02", "PS-0109--vneshnost"], "h": "<p>Развёрнутое описание дано Миколаем в тот же вечер (id 194802), в общем блоке описаний по списку защитников:</p>\n<div class=\"q\"><p>«Юкиона - это снежная дева из японского фольклора, но в этой версии она вооружена футуристическим миниганом. У неё бледная кожа, длинные белые волосы и голубые глаза. Одета в традиционное кимоно, но дополненное современными элементами брони. Её миниган стреляет острыми ледяными сосульками с невероятной скоростью, замораживая всё на своём пути. Юкиона сочетает в себе традиционную японскую мифологию и современные технологии.»</p></div>\n<p>Сразу после этого Миколай оговаривает происхождение текста: «хз, нейронка быстро набросала» (id 194804). То есть описание сгенерировано, а не написано соавтором, и подано с этой оговоркой. Реакции Славы на описание в записи нет.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0109-S03", "PS-0109--harakter"], "h": "<p>В том же вечере, при раздаче «грехов» островам, Миколай формулирует её так: «ебнутая женщина с миниганом убивать всех ослушивающихся» (id 194924). Других черт характера не названо.</p>\n<p>Исходная опора образа — «типо снегурочки, ток опасная».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0109-S04", "PS-0109--sposobnosti"], "h": "<p>Оружие — миниган, «в котором снаряд сосульки»; в развёрнутом описании — «футуристический миниган», стреляющий «острыми ледяными сосульками с невероятной скоростью, замораживая всё на своём пути». Миниган с сосульками проходит как отдельная связанная сущность.</p>\n<p>Собственных способностей помимо оружия (магии холода, снежной природы и т. п.) в переписке не приписано, хотя происхождение образа — снежная дева из японского фольклора.</p>", "r": []}, {"t": "Место и роль", "a": ["S05", "PS-0109-S05", "PS-0109--mesto-i-rol"], "h": "<p>Поставлена на айсберг — остров Юкионы. Ей отдаётся «грех» тоталитаризма: «на айсбергах будет тотальный контроль» (id 194923), а сама она убивает всех ослушивающихся.</p>", "r": []}, {"t": "Связи с другими", "a": ["S06", "PS-0109-S06", "PS-0109--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>7 островов</strong> — вселенная, к которой относится; Юкиона входит в число защитников.</li>\n<li><strong>Айсберг (остров Юкионы)</strong> — её место; на нём тотальный контроль.</li>\n<li><strong>Миниган с сосульками</strong> — её оружие.</li>\n<li><strong>Прочие защитники из списка</strong> — блуждающий огненный гриб, дриада великан, «тот пламенный перс». Связей между ними и Юкионой в переписке не проговорено, они просто перечислены рядом.</li>\n<li><strong>Нуар</strong> — упомянут в том же разговоре как первый кандидат на тоталитаризм; после отказа от этого варианта грех перешёл к Юкионе.</li>\n</ul>", "r": []}, {"t": "Как менялась — состояния по датам", "a": ["S07", "PS-0109-S07", "PS-0109--kak-menyalas"], "h": "<p><strong>Версия 1 — 2024-07-03, 19:06–19:09 (id 194785–194797).</strong> Названа в списке защитников как «юкиона с миниганом в котором снаряд сосульки». Миколай поясняет, кто такая юкиона в японских мифах. Слава берёт на подумать: «Ну надо подумать».</p>\n<p><strong>Версия 2 — 2024-07-03, 19:11–19:12 (id 194802–194804).</strong> Развёрнутое описание: бледная кожа, длинные белые волосы, голубые глаза, традиционное кимоно с современными элементами брони, футуристический миниган со снарядами-сосульками. Помечено самим Миколаем как сгенерированное нейронкой.</p>\n<p><strong>Версия 3 — 2024-07-03, 19:52–19:54 (id 194917–194924).</strong> Ей отдаётся «грех» тоталитаризма: тотальный контроль на айсбергах, «ебнутая женщина с миниганом убивать всех ослушивающихся». Так персонаж получает место (айсберг) и функцию в устройстве мира.</p>", "r": []}, {"t": "Отклонённые варианты", "a": ["S08", "PS-0109-S08", "PS-0109--otklonennye-varianty"], "h": "<ul>\n<li><strong>Тоталитаризм — Нуару</strong> (id 194917–194922). Миколай спрашивает «как думаешь, будем пихать тоталитаризм?» и предлагает «нуару например». Слава отводит: «Ну нуар хороший челик / А вообще можно одному из островов». Миколай соглашается — «тогда у него будет Федеративная республика», «ну тогда дам этот грех женщине». То есть Нуару вместо тоталитаризма достаётся федеративная республика, а тоталитаризм уходит Юкионе.</li>\n</ul>", "r": []}, {"t": "Что с ней стало", "a": ["S09", "PS-0109-S09", "PS-0109--chto-s-ney-stalo"], "h": "<p>Материала после 2024-07-03 нет. Все три версии — один вечер; дальше персонаж в записанной переписке не возвращается.</p>", "r": []}, {"t": "Пробелы", "a": ["S10", "PS-0109-S10", "PS-0109--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Согласие Славы на самого персонажа проговорено только как «Ну надо подумать»; окончательного «да» в переписке нет.</li>\n<li>На развёрнутое описание (версия 2) реакции Славы нет вообще.</li>\n<li>Имя собственное отсутствует: «юкиона» — это название существа из мифов, а не личное имя. Личного имени персонажу не давали.</li>\n<li>Способности снежной девы за пределами минигана не названы.</li>\n<li>Как именно устроен тотальный контроль на айсберге, кто ей подчиняется, есть ли у неё аппарат — не сказано.</li>\n<li>От кого и от чего она «защитник» — в этом фрагменте не объяснено.</li>\n<li>Реплики Славы между списком и вопросом про Юкиону — «Или ты про сталкера ?», «Ну можно, ну он уже наемник хотя можно» (id 194792–194794) — относятся к другому пункту списка; к Юкионе они по тексту не привязаны.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0109--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0030.html\">Защитники островов</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0030.html\">Защитники островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0109--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-03</td>\n<td>194785–194797</td>\n<td>w0041</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-03</td>\n<td>194802–194804</td>\n<td>w0041</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-03</td>\n<td>194917–194924</td>\n<td>w0041</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0109-yukiona.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0109--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0109.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
