<script>const BASE="";const DOCNAME="Земова";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0208-S01", "PS-0208--proishozhdenie"], "h": "<p>Земова упоминается в переписке один раз — 2025-02-25 (окно w0077, сообщения 295507–295510). Материал чужой: Миколай пересылает фрагмент из другого чата. Земова — основной отыгрываемый персонаж девочки с конкурса: «среди них была Земова – тип моя основная, за которую я ролила».</p>\n<p>Появляется она в рассказе о сбежавшей дочери Альгиза: «Короче я помню, как она сбежала...» — и дальше о персонажах, которые «пожалели её». Земова названа в числе этих персонажей.</p>", "r": []}, {"t": "Связи с другими", "a": ["S02", "PS-0208-S02", "PS-0208--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Альгиз</strong> — Земова входит в число персонажей, пожалевших сбежавшую дочь Альгиза. Никакого другого отношения к нему не названо.</li>\n<li><strong>Серп</strong> (<a href=\"PS-0207.html\">Серп</a>) — назван в том же перечислении, сразу после неё: «Ну ещё Серп – местный супергерой». Характер связи между Земовой и Серпом в переписке не описан.</li>\n</ul>", "r": [["Серп", "PS-0207.html"]]}, {"t": "Как менялся — состояния по датам", "a": ["S03", "PS-0208-S03", "PS-0208--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2025-02-25</strong> (окно w0077, сообщения 295507–295510). Единственное состояние: Земова названа как главный отыгрываемый персонаж и как участница сцены с сбежавшей девочкой. Версий больше нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S04", "PS-0208-S04", "PS-0208--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Внешность не описана.</li>\n<li>Характер не описан.</li>\n<li>Способности не названы.</li>\n<li>Пол, возраст, положение во вселенной не указаны.</li>\n<li>Кроме роли «основная, за которую ролила» ничего не сказано; материал чужой, переслан из другого чата.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0208--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0207.html\">Серп</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0207.html\">Серп</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0208--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-02-25</td>\n<td>295507–295510</td>\n<td>w0077</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0208-zemova.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0208--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0208.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0208-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0208/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Здесь дыра не в том, что чего-то нет, а в том, что целый куст висит ни на чём. Земова — часть блока из семи записей, собранных из одного пересланного куска: <code>MR-0112</code> «вселенная девочки с конкурса» (3 736), <code>PS-0204</code> «Альгиз» (7 314), <code>PS-0206</code> «Приёмная дочь Альгиза» (2 192), <code>PS-0207</code> «Серп» (1 789), <code>PS-0208</code>, <code>PS-0209</code> «Серафима» (2 914), <code>PS-0210</code> «Дрршмармшасьз» (5 077). У всех, кроме Серпа, ноль входящих ссылок. Это самый изолированный участок из тех, что мне попадались: семь статей, которые ссылаются только друг на друга и больше никуда, и при этом все помечены вселенной «Апостол».</p>\n<p>Дороже всего чинить не персонажа, а происхождение блока: <code>SL-0112</code> «Конкурс \"Чертова дюжина 2025\"» — статьи нет, база 6 329, вселенная «неясно». Это единственный след того, откуда взялась девочка и её вселенная. Пока он не разобран, семь записей стоят без объяснения, почему они вообще в справочнике.</p>\n<p>Отдельно стоит проверить, не слиплись ли имена: <code>PS-0209</code> «Серафима» — приёмная дочь Серпа из чужой вселенной, а рядом лежат <code>SP-0187</code> «Силы Серафима» (одна ссылка, 4 303) и <code>SP-0225</code> «Способности Серафима» (3 861). Одно ли это лицо или два разных, из карточек не видно.</p>\n<h3>С чего начать</h3>\n<p>В архив идти незачем. Весь материал — один сплошной кусок 2025-02-25, окно w0077, примерно id 295448–295512, и он уже в базе целиком. Задача не в поиске, а в разметке: этот непрерывный кусок нарезан на семь записей внахлёст, и Земова сидит ровно на шве. Её диапазон 295507–295510 перекрывается с <code>PS-0206</code> (295503–295510) и с <code>PS-0207</code> (295508–295512), а всё вместе продолжает <code>PS-0204</code> (295465–295507), который сам начинается там же, где кончается <code>MR-0112</code> (295448–295465). Четыре сообщения Земовой поделены между тремя карточками, и её собственных среди них, по сути, одно.</p>\n<p>Второе место, куда смотреть, — сама статья не связана с теми, кто в ней назван. В тексте стоят Альгиз и его сбежавшая дочь, а в разделе «Связи» — только Серп. <code>PS-0204</code> и <code>PS-0206</code> существуют, ссылок туда нет.</p>\n<h3>Как развивалось</h3>\n<p>Тут нечего развивать, и это само по себе наблюдение. Земова названа один раз, 2025-02-25, внутри чужого пересказа, придаточным предложением: «среди них была Земова – тип моя основная, за которую я ролила». Ни ограничения, ни уточнения, ни возврата — ни в тот день, ни позже. Движение в окне было, но не вокруг неё: на Альгиза в том же разговоре ушло около сорока сообщений, на Земову — четыре, и три из них она делит с соседями. Заявили в перечислении и прошли мимо.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для мира правило отнесения проговорено прямо. В <code>MR-0112</code> отдельным абзацем сказано: запись отнесена к «Апостолу» по дате объявления, но по содержанию это посторонняя вселенная, и связь с «Апостолом» в переписке не проговорена. То есть для контейнера оговорка сделана и сделана явно. Для его содержимого — нет: Земова, Альгиз, Серп, Серафима, Дрршмармшасьз стоят с «вселенные: [\"Апостол\"]» в шапке, и такой же оговорки у них в статье не появляется, только пометка «материал чужой». Для мира правило названо, для персонажей того же мира — нет.</p>\n<h3>Отклик</h3>\n<p>Честно — цепляться почти не за что, материала тут на одну фразу. Единственное, что задело, — само положение записи. Чья-то основная героиня, за которую человек отыгрывал пять лет собственной вселенной, доехала до чужого справочника в виде одного придаточного предложения и списка из пяти пунктов «не описано». И сохранилась при этом лучше, чем если бы её не переслали вовсе. Ещё нравится, что рядом, в <code>MR-0112</code>, уцелела причина, по которой всё это вообще прозвучало: рассказ отцу на четыре часа, отец засыпает, вывод отца — «что со мной не всё в порядке... Раз я помню так много деталей ИЗ СВОЕЙ ВСЕЛЕННОЙ». Вот это в справочнике на месте, а Земова — нет.</p></div>", "r": []}];</script>
