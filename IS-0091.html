<script>const BASE="";const DOCNAME="Слом Изб";
const LEAD="";
const CH=[{"t": "Содержание", "a": ["S01", "IS-0091-S01", "IS-0091--soderzhanie"], "h": "<p>Сюжетная арка, поставленная 2026-06-02 (id 487062–487081, окно w0120). Открывается заявкой Славы: «Я хочу его сломать».</p>\n<p><strong>Исходная посылка.</strong> «Среди столпов героя. Самым уязвимым будет Изб, потому что он самый неопытный и юные.» Поэтому злодеи «захотят либо переманить его либо либо разрушить психически дабы он не преставля угрозы».</p>\n<p><strong>Постановка сцены.</strong> «В одной из стен после убийства 20 преобразованных. Злодей соберут в одном месте хейторов Изб.» Изб «там появится из-за какого задания». Толпу «подогревает ещё злодеими». Толпа начинает его обвинять и «кидаться разным мусором». Семьи перевоплощённых «начнут полностью критиковать Изб». Всю эту критику злодеи контролируют так, «чтобы толпа кричала что Изба злодей».</p>\n<p><strong>Вопрос, ради которого сцена ставится.</strong> «И тогда станет вопрос, что станет если Изб поверит, что он злодей, как его способность на это отреагирует.» Названы два исхода:</p>\n<ul>\n<li>«Либо никак, но сам Изб получит психическую травму.»</li>\n<li>«Либо его способность повлияет на самого Изб и злодей получат невероятно сильного союзника.»</li>\n</ul>\n<p><strong>Примечание про фан-базу.</strong> «У Изб есть своя преданная фанатка база которой защищает его от критики. Даже после инцидента с вирусом.» В этом же инциденте, «где собрались хейтеры просто не было фанатов Изб». Узнав, что происходит, они «начали выдвигаться табы поддержать Изб». «Ну даже так Изб всё равно получил травму.» Пояснение автора к примечанию: «ну как бы не всё просто возненавидили Изб из-за одной ошибки. У него есть своя преданная фан база, которой было больно смотреть трансляцию где хейтеры критиковали Изб».</p>\n<p><strong>Три пути и выбор.</strong> Поставлен вопрос — «как мне дальше развивать Изб». Перечислены три:</p>\n<ol>\n<li>«Сделать его злодем».</li>\n<li>«Сделать духовные рост Изб. Ну то есть он преадаливает эту критику и растёт дальше».</li>\n<li>«Либо сломать его».</li>\n</ol>\n<p>Выбран третий: «И вот я выбрал путь сломать Изб». Первые два в этом окне остались отклонёнными вариантами — обсуждения их последствий нет.</p>\n<p><strong>Что происходит при сломе.</strong> «Его идеалы падут. Он падёт с небес потеряв способность летать. У него пойдёт кровь из-за брошенного камня хейтером. Его обкидают грязью. И ему придётся в этом состоянии сразится с злодеем.»</p>\n<p><strong>Исход.</strong> «Конечно он выживет и дальше преодолеть эти кризисы. Но долгое время будет недееспособным.» Причина названа прямо, как авторская задача: «потому-что мне просто нужно убрать такого имбаласного перса на какое-то промежуток времени».</p>\n<p><strong>Реакция соавтора.</strong> Миколай: «круто», «мне нравится». На вопрос «Не жалко тебе его» — «конечно жалко», «но вообще-то для него это будет плюсом», «это сильный опыт», «он повлияет на характер», «на взгляды и мышление», «по мне неплохо это», «особенно если он вернётся». Заключение: «правда каким вернётся хз».</p>", "r": []}, {"t": "Персонажи", "a": ["S02", "IS-0091-S02", "IS-0091--personazhi"], "h": "<ul>\n<li><strong>Изб</strong> — объект арки. Самый неопытный и юный из столпов героев, самый уязвимый. Теряет способность летать, получает кровь из-за брошенного камня, дерётся в таком состоянии со злодеем, выживает, надолго становится недееспособным.</li>\n<li><strong>Злодеи</strong> — собирают хейтеров в одном месте, подогревают толпу и контролируют критику так, чтобы толпа кричала, что Изб злодей. Их альтернативная цель — переманить Изба. В карточке связей значатся «Шесть столпов злодеев».</li>\n<li><strong>Хейтеры Изб</strong> — толпа, обвиняющая и кидающая мусор; один из них бросает камень.</li>\n<li><strong>Семьи перевоплощённых</strong> — критикуют Изба после убийства 20 преобразованных.</li>\n<li><strong>Фан-база Изб</strong> — преданная, защищает его от критики, в том числе после инцидента с вирусом; на этой сцене её не было, потом выдвинулась поддерживать; смотрела трансляцию.</li>\n<li><strong>Злодей, с которым идёт бой в конце</strong>, — не назван.</li>\n</ul>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "IS-0091-S03", "IS-0091--mesto-vo-vselennoy"], "h": "<p>Арка привязана к линии Изба и следует за инцидентом с вирусом Нимба (<a href=\"IS-0090.html\">Инцидент с вирусом Нимба</a>): и «убийство 20 преобразованных», и упоминание «инцидента с вирусом» отсылают к нему. В карточке связей: Изб, Инцидент с вирусом Нимба, Фан-база Изб, Шесть столпов злодеев.</p>\n<p>Функция арки внутри общей конструкции названа автором открыто — временно убрать со сцены персонажа, которого он считает несбалансированным.</p>\n<p>Сцена транслируется: фан-база «смотрела трансляцию где хейтеры критиковали Изб».</p>", "r": [["Инцидент с вирусом Нимба", "IS-0090.html"]]}, {"t": "Состояние", "a": ["S04", "IS-0091-S04", "IS-0091--sostoyanie"], "h": "<p>Одна версия, 2026-06-02, окно w0120, сообщения 487062–487081. Постановка целиком принадлежит Славе, реакция и оценка последствий — Миколаю. Переписываний в окне нет. Из трёх заявленных путей развития выбран один, два остались неразвёрнутыми.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "IS-0091-S05", "IS-0091--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Каким Изб вернётся после слома — «правда каким вернётся хз»; оба автора говорят, что не знают.</li>\n<li>Место сцены: «в одной из стен» — так в переписке; что означает «стена» в этом контексте, не пояснено.</li>\n<li>Какое задание приводит Изба на сцену — не сказано.</li>\n<li>Кто конкретно из злодеев организует толпу и кто именно дерётся с Избом — не назван.</li>\n<li>Как долго длится недееспособность — только «долгое время», «на какое-то промежуток времени».</li>\n<li>Который из двух исходов реализуется — «никак, но психическая травма» или «способность повлияет на самого Изб» — прямо не выбран; выбран путь «сломать», но соотнесение его с этими двумя вариантами в переписке не сделано.</li>\n<li>Что именно происходит со способностью Изба в момент, когда он поверил, что он злодей, — не описано, кроме потери полёта.</li>\n<li>Последствия для фан-базы и для отношения города к Избу после слома не обсуждались.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["IS-0091--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает истории:</strong> <a href=\"IS-0090.html\">Инцидент с вирусом Нимба</a></li>\n<li><strong>Упомянут в историях:</strong> <a href=\"IS-0090.html\">Инцидент с вирусом Нимба</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["IS-0091--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-06-02</td>\n<td>487062–487081</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/istorii/IS-0091-slom-izb.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["IS-0091--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/IS-0091.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
