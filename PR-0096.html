<script>const BASE="";const DOCNAME="Зима";
const LEAD="";
const CH=[{"t": "Об этом тексте", "a": ["S01", "PR-0096-S01", "PR-0096--ob-etom-tekste"], "h": "<ul>\n<li>Дата: 2025-11-21</li>\n<li>Сообщения: 387578–387578</li>\n<li>Состояние: брошено на середине (обрывается на неловкой тишине у печи)</li>\n<li>Действующие лица: рассказчик (я, безымянный), Дима, Максим</li>\n</ul>", "r": []}, {"t": "Текст", "a": ["S02", "PR-0096-S02", "PR-0096--tekst"], "h": "<p>Зима</p>\n<p>Я никогда не думал, что после весёлого, сытого и тёплого и конечно семейной встречи нового года. Я окажусь от дома на расстоянии десяти тысяч километров. В деревянной халупе, в вокруг который ветер, снег и деревья. До ближайшего населённого пункта километра четыре. Вроде бы не далеко, но из-за ветра, что дует в твоей незащищённой лицо, и из-за рыхлого снега, в который ноги так и намеревают провалиться. Это растояние становиться для тебя в раза три длинней<br>Я же здесь, в продуваемой халупе пытаюсь затопить печь кремнем и камням, потому что один особо одарённый решил, что мы будем топить печь по старинке и выкинув спички и зажигалку. Он грандиозна вручил мне огниво и кремень. И вот сейчас я пытаюсь разжечь огонь, с помощью метода удара камня о кремень.<br>Непонятной чувство, вроде руки потихоньку теряет чуствительность, но при этом жутко болять и горят от сотого попытки затопить печ. Раздражения всё росло после каждой бесполезной искры, что не попадает на газету, либо попадает, но быстро тухнет. Кого же я обманываю, почему я до сих пор здесь корчюсь. Ведь уже после десятый попытки было ясно, ничего у меня не выйдет. С другой стороны моя внутренняя гордость не позволяет пойти Максиму и сказать о своё никчёмность. Потому что я прекрасно понимаю, что он с первого раза ражет огонь.<br>Резкий и громкий шум прервал мои мысли, а после дом строгнул. Из потолка посыпалась пыль и опилки. Я замер и уставился в окно с деревянной рамкой. Окно уже покрылось иней, и единственное, что я видел это красивые узоры мороза и холода. Всё это время после шума падения чего-то большого была тишина, что не прерывал не я, не кто либо еще. Но вот послышался резущий слух скрип двери и  мне в спину подул холодный воздух. Изгибаясь холод, минует мою куртку и косается моей вспотевший спины.<br>Я оглядываюсь и вижу как дверь закрывает плечистый мужчина. Инстинктивно жимая полена. И вглядываясь в спину. Я был готов дать бой.<br>Но он повернулся ко мне лицом и я понял это Дима. Высокий, плечистый Дима, что имел натуральный чёрный цвет глаз, что устало глядели на меня, и чёрные волосы, который сейчас были покрыти инейм, а его любимая чёрная одежда. Сейчас его чёрная куртка была осыпана снегом и щепками от дерева, а его чёрные штаны  затверденели и не сгибались.<br>Он устала пошёл оставляя за собой белый следы снега. Дойдя до скамейке, что было рядом с печкой, он присел....Нет он упал на ней и с него посыпался снег. Устала дыша, Дима снима шапку и перчатки тяжёлой дышал.<br>Минуту понаблюдав за ним, я вернулся к своему делу. Но всё же решил спросить<br>- а где Максим?- Дима поднял взгляд на меня и ответил.<br>-да там дерево распиливает, который мы повалили-<br>-ааа- констатировал я. Внутренний давай себе ответ на этот громкий шум.<br>Неловкая тишина, что перебивала лишь мои не умелый попытки разжечь печь.<br>&lt;/content&gt;</p>", "r": []}, {"t": "Примечания и поправки", "a": ["PR-0096--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PR-0096.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
