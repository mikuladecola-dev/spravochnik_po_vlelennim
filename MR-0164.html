<script>const BASE="";const DOCNAME="Оам";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0164-S01", "MR-0164--ustroystvo"], "h": "<p>Оам — одновременно название вселенной и название энергии-вещества, от которого она получила имя. Слово было выбрано перебором вариантов 2025-10-20 (id 376201–376256), когда Слава попросил «Рандомная названия для энергии»: «Позже напишу новую систему сил. Вообще-то уже пишу и мне нужно название для энергии». Остановились на «Оам» с оговоркой «Даваай пока оам» (376250), Миколай ответил «ну норм».</p>\n<h3>Происхождение Оам</h3>\n<p>Полная механика изложена одним большим сообщением 2025-10-20 (id 376401). Действие отнесено в далёкое прошлое: «Когда то давным давно во времена, когда были ещё племена по всему миру, а не государство. На землю приземлились метеориты. Словно гнев самих богов по всему миру послышались взрывы и земля задрожала. И из этих небесных тел выпустились в воздух, триллион неизвестных частиц. Невидимых и неосязаемых также как и заряженный частицы, но они есть».</p>\n<p>Частицы заполонили весь мир, воздух был пропитан ими, и всё живое, что их вдыхало, «быстро утухала»: «Лёгкие заполнялось Оам и медленно разрывались на куски. Люди гибли, также как и животные. Лишь некоторый были способны прожить хотябы 30 лет, а после умерали». Поколения сменяли поколения, пока у людей — как и у других животных — не возник иммунитет «во время эволюции и адаптации». Уже после этого частицы, «вылетевший из небесных тел и погубивший миллиарды жизни», назвали Оам.</p>\n<p>Пережив «кризисный момент в истории», люди заинтересовались, «откуда появилась проклятия бога», и начали исследовать территорию. На местах приземления метеоритов «окружающая среда и жирность мутировали под активным воздействием Оам». Оказавшись там, люди, вдохнув или испив насыщенной Оам жидкость или воздух, умирали, «как их давний предки». Но некоторые выживали «и могли творить чудо. По их словам они начали чувствовать внутреннюю энергию».</p>\n<p>Итоговая формулировка природы вещества: «В воздухе и в некоторых водоёмах стали насыщенный Оам неизвестной частицей, что может вырабатывать энергию в огромных количествах. Долго время для живых организмов была токсичной. Но после адаптации они стали нейтральными».</p>\n<h3>Как выглядит и как ведёт себя</h3>\n<p>Изначально описано только как невидимые и неосязаемые частицы (376401). 2025-11-05 (id 382103–382110) Миколай спросил, не туманность ли это: «ну оам это че, я чет помню он как туман распространялся». Слава сначала отверг связь («Они же не как не связаны с туманнам»), затем дал уточнение: «Это мелкий крупицы летающий в воздухе» (382109). Миколай: «ладно пока так будем звать».</p>\n<h3>Поглощение, ёмкость, выброс</h3>\n<p>Механика обмена с телом (376401):</p>\n<ul>\n<li>«Человек вдыхает Оам ( то есть поглощает, также поглощения может идти просто и через кожу, но более быстрый и способ но который мы можем хоть как-то повлиять)».</li>\n<li>Дальше Оам «по кровеносной системе вместе с кислородом проходит через всё тело, где-то оседая зависима от человека».</li>\n<li>«зависимо от человека в нём накапливается определенное количества Оам.то есть у каждого человека своя ёмкость Оам».</li>\n<li>Если накапливается больше, чем предусматривает ёмкость, «то Оам выходит через споры, с выдохом и просто через кожу либо другие способы выделением».</li>\n<li>«Выпуск лишний Оам происходит чуть быстрее чем поглащения».</li>\n</ul>\n<p>Базовое положение: «В каждым человеке есть Оам но использовать его не как нельзя. Но есть способ».</p>\n<h3>Обуздание</h3>\n<p>Способ один: человек должен поглотить что-то с большой концентрацией Оам — «воду либо вздохнет воздух с большими концентрациями Оам», — так, чтобы тело «просто не успевает выпускать Оам». Дальше «у человека два итого может быть»:</p>\n<ul>\n<li>«Первый: Либо из-за большого количества Оам его лёгкий или сосуд лопаются, либо Оам просто остановит сердца либо Оам из-за своей токсичности убьет человека».</li>\n<li>«Второй: человеку удаётся почувствовать и обуздать Оам. Сдерживая Оам, чтобы он не навредил телу. Сдерживать до тех пор пока избытки Оам не выйдут естественным путём. И после когда избытки выйдут. Человек сможет пользоваться Оам ведь он уже почувствовал и сдерживал Оам».</li>\n</ul>\n<p>Оговорка: «Опять же это касается только людей. У животных это происходит более инстинктивно. Поэтому шанс выживаемости у них больше чем у людей. Но они не могут раскрыть весь потенциал».</p>\n<p>2025-10-20 в 15:05 (id 376429) добавлено уточнение о контроле: «Некоторые существа способны контролировать Oам, впитывая его и выделяя по своему желанию. Это одна из самых редких и ценных способностей. Все могут поглощать Оам при вдохе и выделять его при выдохе». Слава оценил текущее состояние системы как «Нынешний норм».</p>\n<h3>Мутации</h3>\n<p>Общее правило вселенной названо 2025-10-22 (id 377629–377635): «Все монстры это мутированный под воздействием Оам» (377634). Разговор шёл о конкретном существе, породившем апостолов: «21 от неизвестного мутировшего существо», «Так вот это существо мутировал из-за воздействием Оам». В самом первом описании механики (376401) уже сказано: «Также есть мутанты это животное и люди, у которых под воздействием Оам изменилось их физиология. А также есть некоторый окружающей среды что под воздействием Оам обрели какой-либо воздействия на живых существ».</p>\n<h3>Места и предметы, завязанные на Оам</h3>\n<p>Добавлены 2025-10-20 (id 376413–376417):</p>\n<ul>\n<li>Чёрные озёра — «Чёрная озера, что превращает людей в монстров стоит им туда нырнуть. Это места куда упала один из метеоритов».</li>\n<li>Артефакты — «предметы созданный из материалов, который находились близко к метеоритом, либо из осколков самого метеорита».</li>\n<li>Камень желания — «пропитанное большим количеством оам кристаллы. Что при разрушение способны попадать в живой организм делая его сильнее быстрее и д. т. Но медленно превращая его в камень желания».</li>\n</ul>\n<h3>Время действия</h3>\n<p>«История будет происходит в современном мире, где давно забыли о существовании Оам. Лишь некоторый люди знают о нём и исследуют» (376417, 2025-10-20).</p>\n<p>Есть также упоминание тёмной изнанки: из-за апостолов «по итогу в современном мире раскроется существования тёмный изнанки но это будет в будущем в будущем» (385768, 2025-11-17). Что такое тёмная изнанка, в переписке не раскрыто.</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0164-S02", "MR-0164--naselenie"], "h": "<h3>Иерархия сил</h3>\n<p>Выложена Славой 2025-11-17 (id 385768–385779) одним сообщением.</p>\n<p>Сверху — коты: «Коты. Их 9.они сильнеший ( уникальный особенности, я для них не придумал помоги) и вот они есть в каждую эпоху. Если один кот умрёт родиться новый и всегда их будет 9. Они вообще никуда не вмешиваться».</p>\n<p>Вторые — апостолы: «Апостолы 21 вторая по силе раса на земле (опять раса, в мире есть просто индивиды который могут быть сильными). Апостолы очень часто устраивают без порядок разрушая укорененый баланс между всеми».</p>\n<p>Ниже: «Ну и дальше расы и организации который равны по силе с друг другом».</p>\n<p>Перечислены в этом равном слое:</p>\n<ul>\n<li>Дети мирового древа — «Живут в мести которой мутировала от Оам».</li>\n<li>«Проротой каменный челике. Владеют преступное организацию. Некий союз с апостолами».</li>\n<li>Азуриэль — «Как народ что прячется от цивилизации. Но некоторый всё же живут среди людей».</li>\n<li>Группировка сестры — «который теперь будет дочерью Имитатора. И я не знаю какие у неё будет цель».</li>\n<li>Правительственная организация «по контролю всех этих. Сильнейшая там девченка что может изменять мир волнами».</li>\n<li>Церковь с паладинами — «мёртвыми рыцарями которых оживил один челик, для верующих»; «паладины до хрена сильный но их ней движения предсказуемый. Они больше как роботы с повторяющими движениями».</li>\n<li>Организация Виктора — «Организация челика который и оживил паладинов. Давай челика назовём Виктор. Ну и Виктор верит в красный ток что оживляет людей. И он многих оживил, но разум так и не смог в них оживить».</li>\n<li>Пернатые — «(Серафим, Пераги и кто-нибуть ещё)».</li>\n<li>Орден: «Так же появиться орден предназначеный для убийства котов».</li>\n<li>Вампиры — «просто аристократы».</li>\n<li>Аскизы — «Матка Аскизов стало предметом веры для какой-то верологий». Отдельным сообщением: «Ну и Аскизы. Я не знаю где они живут» (385769).</li>\n</ul>\n<p>Тогда же уточнено про котов: «Кстати нуар один из котов», «Помнишь нуара. Сильнеший из 7 островов», «Ну здесь он будет влиять на мир подобно волнами» (385774–385779). Миколай подтвердил, что помнит персонажа.</p>\n<h3>Расы и мутанты (описания от 2025-10-20, id 376401–376402)</h3>\n<p><strong>Апостолы.</strong> «это люди, у которых в утробе матери мутировало нервную систему мозг и глаза. Из-за этого их ней пять чувств, работоспособность мозга, реакция, точность выше чем у обычного человека в несколько раз». Обуздать Оам могут без поглощения огромного количества: «Им достаточно пережить одну эмоциональную ситуацию, и они неосознанно воспользуются Оам. И дальше они могут пользоваться им без проблем». Также «они могут использовать белый глаза направив туда Оам». После активации белых глаз «для них время замедляется ( но они не становятся быстрее) и всех их чувства в улучшаются и они становятся сверх чувствительными. Зрения слух осязания запах и вкус». Продолжение: «Из-за и боль они ощущают больнее. Но зато у них словно всё на ладони они ощущать и видят всё что находиться вокруг. И способны словно предсказывать движение противников по слуху или зрению. И становятся невероятно точными. Как ясно они у них лучший контроль Оам».</p>\n<p><strong>Аскизы.</strong> «Маток Аскизы была просто Аксолотлой. Но после в водоём, где она жила упал метеорит и под огромным воздействием Оам она мутировала и начала производить Оам». Сами аскизы — «Навечно Дети лет 7-10 на вид с белоснежной кожей,с розовыми оттенками ( или другими оттенками) и с чертами аксолотлы». Они не стареют, у них быстрая регенерация «а также зверский аппетит. Они могут съесть человека целиком за пару минут. У них инстинкт голода выше разума. Они не чувствуют боли. И разумом они всегда как дети». Матка «выделяет их из яиц подобное муравьиной матки», «большая ростом 4 местра и в ширину такая же. Она больше похожая на червя с огромными количествами лапок. Но с такой же белоснежное кожей». Способ рождения аскизов прямо помечен как непридуманный: «Как они рождаются я ещё не придумал».</p>\n<p><strong>Дети мирового древа.</strong> «Произошли от мутировшого дерева из-за Большого количества Оам. Это гуманноидный деревянный существо с оранжевой сердцевинной, в котором как раз и хранится Оам. Они могут изменить образ на человеческий». Прочность: «Так как они из дерева мирового древа. Хрен ты их пробьешь, не кто из апостоловы не сможет нормально их ранить, а если ранят они будут регенерировать. Ну и они сверхсильный (сильнейший наверное в физическом плане)». Могут «передвигаться в земле и внутри деревьях». Огонь им не вредит: «Сам огонь на них тухнет». Дерутся корнями: «они могут выпускать корни туда сюда ими драться».</p>\n<p><strong>Азуриэль.</strong> Описание начато Славой словами «Давай я его опишу»: «Гуманоид человеческого роста синий кожей( не точно может розовый) с острыми ушами как у эльфа. Также на лице красивый узоры разного цвета, который могут меняться в зависимости от эмоций. Одежда зимняя. Сам он гибкий. Эмпатия. Прекрасно ощущать намерения». Дальше в том же сообщении идёт помета «Слава дондоков:» и уточнённая формулировка: «Азуриэль: Нейро-сканер. Его способность это не эзотерическая эмпатия, а гиперразвитое чувство, позволяющее напрямую считывать и интерпретировать биоэлектрическую активность нервной системы других существ». Ограничение: «находясь в толпе он теряется и не может сконцетрироваться». Происхождение: «Это было группа лиц, чей дети мутировали полностью превратившись Азуриэль. Они с рождения могут использовать Оам и скорость поглощения и выделения Оам у них выше чем у кого либо».</p>\n<p><strong>Поротай.</strong> «Это мутировавший жук если его съесть человек то у него 3 варианта»:</p>\n<ol>\n<li>«смерть , все твои внутренности превращаются в камень и отказывают».</li>\n<li>«превращаются в низший Поротай (горбатого двух ликого, полукаменного-полуплоти , и ты теряешь личностей и слушаешь высшего Поротая ) способности крепкость, реген, сверхсила».</li>\n<li>«превращается высшего Поротая сохраняешь свой человеческий образ и личность. Способности реген, контроль над низшими, превращать части тела в твердый камень , сверхчеловеческая сила».</li>\n</ol>\n<p>Дебафф: «у тебя появляется вторая личность жестокая, кровожадная , алчная и т.д. И она составляет чаще всего становится жестоким кровожадным и т.д».</p>\n<p><strong>Вампиры.</strong> «Это люди у которых мутировала кровь и пищевая система под воздействием Оам. Из-за этого если они испьют кровь. То способны почуствовать Оам и так по итогу научиться его контролировать. И также выпивая кровь они могут пополнять запасы Оам. Их мутировшая кровь легко контролируемая подобно конечности».</p>\n<p>Блок расписан за один заход, закрыт репликой «Пока что так» (376403). Реакция Миколая на следующий день того же окна: «мне новые нравятся» (376428).</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0164-S03", "MR-0164--mesto-vo-vselennoy"], "h": "<p>Оам — первая вселенная соавторов. Это зафиксировано 2025-12-09 (id 394734–394736), когда Слава выбирал имя для новой: «Как назвать вторую Вселенную. Первая Оам. Ещё есть семь островов И правитель. А эту как назвать?» Следом «Вай Вай вай», на что Миколай ответил «та к и назовём». Помимо Оам, названы «семь островов» и «правитель».</p>\n<p>Персонаж Нуар пришёл именно из семи островов — «Сильнеший из 7 островов» — и во вселенной Оам стал одним из девяти котов, который «будет влиять на мир подобно волнами» (385774–385779, 2025-11-17).</p>\n<p>Сравнение вселенных дано 2025-12-09 (id 394757). О новой вселенной: «Вообще это Вселенная появилась лишь потому что я пытался тот образ гг сделать в настоящим. А после она просто стало лёгкая вселенная. То есть сверх силы там слабее. И в теории даже обычные человек способен победить сверхчеловека. Из-за легче развивать отношения людей». И, для контраста, об Оам: «Просто в Оам все чё-то слишком сильный. Да и Оам Вселенная большая как боевик».</p>\n<p>По вселенной ведётся отдельный документ, в чат он не выкладывался. 2025-11-17 Миколай вспомнил о нём: «бля, документ, точно», «когда-то я продолжу его делать» (386174–386177).</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0164-S04", "MR-0164--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-10-20 (id 376201–376256).</strong> Перебор названий для энергии новой системы сил. Слава задал рамку: нужно «лёгкое название», которое он запомнит. Отклонённые варианты: гугу, обезьяна паук, куздра, бляжка, фортепомп, взла, жжа, хда, хжы, хбр, истс, вонь, прай, оми, мэж, шог, баб, скал, ори, фоц, цоч, уам, ояг, оич, фэи, гло, асле, бузга, кузди, маро, гарсо. Про «фортепомп» Миколай сказал «это прям ахуенно», Слава отверг: «Это прям сложно», «Я не запомню». Про «фоц»: «Такие таблетки вроде есть». Выбрано «Оам» — «Даваай пока оам».</p>\n<p><strong>Версия 2 — 2025-10-20 (id 376399–376403).</strong> Большим сообщением 376401 выложена вся механика: метеориты и гибель поколений, иммунитет, поглощение через вдох и кожу, кровеносная система, индивидуальная ёмкость, выброс излишков, два исхода при передозировке, инстинктивное поведение животных, мутанты. Тем же блоком заданы расы: апостолы, аскизы, дети мирового древа, азуриэль, поротай, вампиры. Закрыто словами «Пока что так».</p>\n<p><strong>Версия 3 — 2025-10-20 (id 376413–376418).</strong> Добавлены места и предметы, завязанные на Оам: чёрные озёра, артефакты, камень желания. Действие вынесено в современный мир, где об Оам забыли.</p>\n<p><strong>Версия 4 — 2025-10-20 (id 376428–376431).</strong> Уточнение: поглощать при вдохе и выделять при выдохе могут все, а осознанный контроль — впитывать и выделять по желанию — «одна из самых редких и ценных способностей». В том же куске Слава высказался про наименование категорий: «Че за Эпические. Звучит хреново. Лучше бы была опасность примерный» (376431); о чём именно шла речь — какой перечень содержал «Эпические» — в переписке не сказано.</p>\n<p><strong>Версия 5 — 2025-10-22 (id 377629–377635).</strong> Установлено общее правило: «Все монстры это мутированный под воздействием Оам». Сюда же отнесено неизвестное мутировавшее существо, от которого пошёл 21 апостол.</p>\n<p><strong>Версия 6 — 2025-11-05 (id 382103–382110).</strong> Уточнение природы вещества после вопроса Миколая про туман: «Это мелкий крупицы летающий в воздухе». Прежнее описание (невидимые и неосязаемые частицы) не отменялось. В этом же куске сообщением 382108 Слава заново вставил ранее написанный блок про апостолов, аскизов, детей мирового древа, азуриэль, поротай и вампиров — текст повторяет версию 2 без изменений.</p>\n<p><strong>Версия 7 — 2025-11-16 (id 385704–385713).</strong> Слава: «Хочу придумать уникальную деталь для системы силы Оам», «Типо территорий или воли и т. Д.», «Ну я не знаю какую мысль взять», «Идею». Миколай через полчаса ответил «подумаю». Деталь не придумана.</p>\n<p><strong>Версия 8 — 2025-11-17 (id 385768–385779).</strong> Выстроена иерархия сил: девять котов сверху, 21 апостол вторыми, дальше равные между собой расы и организации. Перечислены дети мирового древа, поротай (как каменные, владеющие преступной организацией), азуриэль, группировка сестры, правительственная организация, церковь с паладинами, организация Виктора, пернатые, орден по убийству котов, вампиры, аскизы. Уточнено, что Нуар — один из котов.</p>\n<p><strong>Версия 9 — 2025-11-17 (id 386174–386177).</strong> Упомянут рабочий документ по вселенной, который Миколай обещал когда-нибудь продолжить.</p>\n<p><strong>Версия 10 — 2025-12-09 (id 394574–394580).</strong> Слава спросил идеи «насчет злодеев. Ну точнее их планы?» именно для Оам. Миколай: «пока нет идей», «но я думаю».</p>\n<p><strong>Версия 11 — 2025-12-09 (id 394734–394736).</strong> Оам названа первой вселенной при выборе имени для второй.</p>\n<p><strong>Версия 12 — 2025-12-09 (id 394757).</strong> Описание Оам через сравнение: «в Оам все чё-то слишком сильный», «Оам Вселенная большая как боевик».</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0164-S05", "MR-0164--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Уникальная деталь системы силы Оам — «Типо территорий или воли» — так и не придумана (2025-11-16, id 385707–385713). Осталось нерешённым.</li>\n<li>Уникальные особенности девяти котов не придуманы: «уникальный особенности, я для них не придумал помоги» (385768).</li>\n<li>Как рождаются аскизы — «Как они рождаются я ещё не придумал» (376401). Где живут аскизы — «Я не знаю где они живут» (385769).</li>\n<li>Цель группировки сестры не определена: «И я не знаю какие у неё будет цель» (385768).</li>\n<li>Злодеи вселенной и их планы: идей нет на 2025-12-09 («пока нет идей»).</li>\n<li>Название «Оам» принято как временное: «Даваай пока оам». Уточнение про крупицы тоже принято с оговоркой Миколая «ладно пока так будем звать».</li>\n<li>Цвет кожи Азуриэль не закреплён: «синий кожей( не точно может розовый)».</li>\n<li>Рабочий документ по вселенной в чат не попадал; его содержание неизвестно.</li>\n<li>В сообщении 376429 буква «O» в слове «Oам» — латинская; возможно, кусок скопирован с сайта, который собирал Миколай. В переписке это не обсуждалось.</li>\n<li>Что такое тёмная изнанка и как именно её раскроют апостолы — не сказано, отнесено «в будущем в будущем».</li>\n<li>Кто такой Имитатор, чьей дочерью становится «сестра», в переписке не пояснено.</li>\n<li>Что за «красный ток», в который верит Виктор, кроме того что он «оживляет людей», не раскрыто.</li>\n<li>Состав пернатых не назван до конца: «(Серафим, Пераги и кто-нибуть ещё)».</li>\n<li>В перечне связанных сущностей файла значатся Амофцы, Феня и «Мир Оам», однако в сохранённых кусках переписки по вселенной они не встречаются — связь с ними здесь не зафиксирована.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0164--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0104.html\">Нуар</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0056.html\">Апостолы (21 апостол; «насекомые»)</a>, <a href=\"GR-0057.html\">Коты (девять котов)</a>, <a href=\"GR-0072.html\">Амофцы</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0008.html\">Оам</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0164--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-10-20</td>\n<td>376201–376256</td>\n<td>w0107</td>\n<td>Оам (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-10-20</td>\n<td>376399–376403</td>\n<td>w0107</td>\n<td>Оам (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-10-20</td>\n<td>376413–376418</td>\n<td>w0107</td>\n<td>Оам (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-10-20</td>\n<td>376428–376431</td>\n<td>w0107</td>\n<td>Оам (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-10-22</td>\n<td>377629–377635</td>\n<td>w0108</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-11-05</td>\n<td>382103–382110</td>\n<td>w0108</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-11-16</td>\n<td>385704–385713</td>\n<td>w0109</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-11-17</td>\n<td>385768–385779</td>\n<td>w0109</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-11-17</td>\n<td>386174–386177</td>\n<td>w0109</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-09</td>\n<td>394574–394580</td>\n<td>w0113</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-09</td>\n<td>394734–394736</td>\n<td>w0113</td>\n<td>Оам (объявлено)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2025-12-09</td>\n<td>394757–394757</td>\n<td>w0113</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0164-oam.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0164--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0164.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["MR-0164-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/MR-0164/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Самая дорогая дыра во всей базе висит прямо под этой статьёй: <code>SL-0054</code> «Список 12 апостолов» — семь ссылающихся сущностей, статьи нет, а материала 234052 знака. Это крупнейший необработанный кусок из всего, что есть, и одна из вселенных, к которым он привязан, — Оам. При этом в статье апостолов 21. Пока <code>SL-0054</code> не разобран, непонятно даже, 12 их или 21, а на апостолах стоит вся вторая ступень иерархии сил.</p>\n<p>Рядом — четыре записи, где материал про Оам есть, а вселенная не проставлена и статьи нет: <code>MR-0198</code> «Программа в голове (конструкция Оам)» — 12666, <code>SP-0277</code> «Кукловод (Я не умру, пока не кончится Оам)» — 8279, <code>SP-0264</code> «Белые глаза апостолов» — 2260 (при том что <code>SP-0238</code> «Белые глаза» со статьёй и 26418 уже есть, то есть это разъехавшийся дубль), <code>PS-0294</code> и <code>PS-0295</code> «Низший/Высший Поротай» — по три с небольшим тысячи, тогда как <code>PS-0036</code> «Поротай» со статьёй и 38750 существует. Названия говорят «Оам» открытым текстом, а числятся эти записи как «неясно» и «вне вселенной».</p>\n<h3>С чего начать</h3>\n<p>Всё в базе. <code>SL-0054</code> читать прямо там — 234 тысячи знаков, и расхождение «12 против 21» разрешается по нему же, в архив за этим идти не надо. Дубли — <code>SP-0264</code> к <code>SP-0238</code>, <code>PS-0294</code>/<code>PS-0295</code> к <code>PS-0036</code>, <code>SP-0219</code> «Эмпатия (Азуриэль)» к <code>MR-0129</code> (51589) — сводятся сверкой двух записей. Одна операция приписки к Оам закрывает часть пробелов статьи без единого обращения к переписке.</p>\n<p>Чего в базе нет и не будет: уникальная деталь системы силы и особенности девяти котов. Они не придуманы, а не потеряны — 2025-11-16, id 385704–385713, Миколай ответил «подумаю» и не вернулся; 2025-11-17, id 385768, «уникальный особенности, я для них не придумал помоги». Смотреть тут можно только одно: не всплыло ли это позже в окнах w0109–w0113 под другим названием. Отдельный источник, которого нет ни в базе, ни в архиве, — рабочий документ по вселенной, упомянутый 2025-11-17 (id 386174–386177) и в чат никогда не выкладывавшийся.</p>\n<h3>Как развивалось</h3>\n<p>2025-10-20 — за один день версии с первой по четвёртую: перебор из трёх десятков названий, вся механика Оам одним сообщением, места и предметы, уточнение про осознанный контроль. 2025-10-22 — добавлено общее правило: все монстры мутировали под Оам. 2025-11-05 — уточнение природы вещества после вопроса про туман и повторная вставка того же блока рас, слово в слово, без изменений. 2025-11-16 — запрос уникальной детали, «подумаю», ничего. 2025-11-17 — построена иерархия сил, и в том же сообщении признание, что особенности верхней ступени не придуманы; тогда же вспомнили про заброшенный документ. 2025-12-09 — запрос про злодеев и их планы, «пока нет идей»; в тот же день Оам названа первой вселенной и описана уже через сравнение со второй: «в Оам все чё-то слишком сильный».</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для трёх рас назван свой путь к Оам, и каждый раз — как отдельное правило. Апостолам достаточно одной эмоциональной ситуации, и дальше они пользуются им без проблем. Азуриэль могут использовать Оам с рождения, и скорость поглощения и выделения у них выше, чем у кого-либо. Вампиры чувствуют Оам через выпитую кровь и ею же пополняют запас. Для аскизов, детей мирового древа и поротай правила того же рода нет: сказано, откуда они взялись и что они умеют, но не сказано, как они получают доступ к Оам — при том что базовое положение системы общее для всех: «В каждым человеке есть Оам но использовать его не как нельзя. Но есть способ».</p>\n<p>Отдельно, помельче: для людей два исхода при передозировке расписаны подробно. Для животных сказано только, что «происходит более инстинктивно» и шанс выживаемости выше, — какие у них два исхода, не названо.</p>\n<h3>Отклик</h3>\n<p>Лучшее место — перебор названий. Тридцать с лишним вариантов подряд, от «гугу» до «бузга», и критерий отбора, который Слава называет прямо: «Я не запомню». «Фортепомп» получает от Миколая «это прям ахуенно» и отвергается ровно за то, за что похвален — «Это прям сложно». Название вселенной выбрано не по красоте, а по тому, влезет ли оно в собственную голову. Про «фоц»: «Такие таблетки вроде есть». А то, что победитель принят с оговоркой «Даваай пока оам» и с тех пор так и стоит уже год — это смешнее любого специального сюжета.</p></div>", "r": []}];</script>
