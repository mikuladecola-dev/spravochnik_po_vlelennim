<script>const BASE="";const DOCNAME="Тёмная магия";
const LEAD="<p>Спорное понятие, введённое Миколаем 2024-12-23 (id 273515–273550) и в тот же вечер оспоренное Славой. Содержание не определено. Вселенная в переписке не названа.</p>";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0148-S01", "SP-0148--mehanika"], "h": "<p>Тёмная магия не является отдельным видом магии. По формулировке Миколая (id 273521), это «обобщеное название для магии которая может использоваться скрытно или явно плохо».</p>\n<p>Развёрнутое объяснение дано в споре (id 273540–273544): «а нету холериков, меланхоликов и сонгвиников но эту хуету люди юзают», «и в этом мире тоже», «это так обзывают набор определённой магии», «категорию», «могут не называть». То есть это обиходное слово внутри мира, которым люди называют некоторый набор магии, а не самостоятельная магическая система; в мире существует как название, а не как механика.</p>\n<p>Какой именно набор магии так называют, не сказано. На прямой вопрос Славы «И какую же магию ?» (id 273545) ответа по существу нет: «просто чтобы дохуя не расписыватт», «вот и подумаю потом,, я имею представление но не знаю как описать сейчас», «лан надо ещё подумать» (id 273546–273550).</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S02", "SP-0148-S02", "SP-0148--nositeli"], "h": "<p>Названо одно владение — тёмный эльф, персонаж Миколая. Основание дано через происхождение (id 273515): «он кстати не просто эльф а темный эльф, поэтому темная магия развита хорошо».</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S03", "SP-0148-S03", "SP-0148--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-12-23 (id 273515–273521).</strong> Тёмная магия появляется одной строкой внутри большого описания персонажа: тёмный эльф, «поэтому темная магия развита хорошо». Слава задаёт по этому описанию три вопроса подряд (id 273517–273520): «Джинсы в средневековье», «А не дохуя ли у него способность», «И как понимать темной магии ?», «И про листок клевера ты походу там слова попутал ниче не ясна». Ответ Миколая по тёмной магии (id 273521) начинается с признания неопределённости: «сам хз, думаю это обобщеное название для магии которая может использоваться скрытно или явно плохо».</p>\n<p><strong>Версия 2 — 2024-12-23 (id 273525–273550).</strong> Спор. Слава заходит с двух сторон: «Так магия види некромантии считается благословением» (id 273525) и «Про какую темную магий ты говоришь» (id 273526). Миколай в ответ разбирает не тёмную магию, а бумагу из клевера (id 273527), после чего заявляет: «я не знаю как это описать я не думал», «потом» (id 273528–273530). На вопрос Славы «Тогда зачем писал» отвечает: «чтобы потом раскрыть естественно» (id 273531–273533).</p>\n<p>Далее Слава формулирует своё отрицание (id 273534): «В моем преставление так таковой темной магии и нету». Миколай с этим соглашается по существу и настаивает, что говорил ровно об этом (id 273535–273537): «я тебе и говорю», «нету». Слава добавляет два довода (id 273538–273539): «Так ты да же сам не понимаешь что такая темная магия» и «Плюсом у твоего эльфа уже есть благословение виде усиление». Дальше идёт сравнение с темпераментами — что названия нет, но термином пользуются, — и отказ описывать конкретный состав сейчас с обещанием подумать позже.</p>\n<p>Итог на конец переписки: обе стороны сходятся на том, что тёмной магии как отдельной магии нет; расхождение осталось в том, существует ли она хотя бы как обиходное название категории. Содержание категории не раскрыто.</p>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S04", "SP-0148-S04", "SP-0148--otklonennye-varianty"], "h": "<ul>\n<li>Тёмная магия как самостоятельная магия — отвергнута обеими сторонами: Слава «В моем преставление так таковой темной магии и нету», Миколай «нету».</li>\n<li>Некромантия как содержимое тёмной магии — снята Славой сразу: некромантия проходит по благословениям (<a href=\"SP-0147.html\">Магия контроля (благословения)</a>), а не по тёмной магии.</li>\n<li>Описание конкретного состава категории — отложено самим автором: «вот и подумаю потом», «надо ещё подумать».</li>\n</ul>", "r": [["Магия контроля (благословения)", "SP-0147.html"]]}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0148-S05", "SP-0148--svyaz-s-drugimi-sposobnostyami"], "h": "<ul>\n<li><a href=\"SP-0147.html\">Магия контроля (благословения)</a> (Магия контроля, благословения) — довод Славы против тёмной магии строится на благословениях: некромантия уже отнесена к ним, а усиление у эльфа Миколая — тоже благословение.</li>\n<li>Тёмный эльф (персонаж Миколая) — единственный носитель; связь установлена через расу.</li>\n</ul>", "r": [["Магия контроля (благословения)", "SP-0147.html"]]}, {"t": "Пробелы", "a": ["S06", "SP-0148-S06", "SP-0148--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Содержание не определено. Автор прямо сказал, что не думал и опишет позже.</li>\n<li>Какой именно набор магии в мире зовут тёмной магией — не названо.</li>\n<li>Статус понятия остался спорным: у Славы её нет вовсе, у Миколая она есть только как обиходное название.</li>\n<li>Обещание «потом раскрыть» в переписке не исполнено.</li>\n<li>Вселенная не названа.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0148--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0147.html\">Магия контроля (благословения)</a></li>\n<li><strong>Упомянут в способностях:</strong> <a href=\"SP-0145.html\">Магия (система магии мира)</a>, <a href=\"SP-0147.html\">Магия контроля (благословения)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0148--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-12-23</td>\n<td>273515–273521</td>\n<td>w0068</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-23</td>\n<td>273525–273550</td>\n<td>w0068</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0148-temnaya-magiya.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0148--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0148.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
