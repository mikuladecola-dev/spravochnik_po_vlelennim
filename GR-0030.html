<script>const BASE="";const DOCNAME="Защитники островов";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0030-S01", "GR-0030--chto-eto"], "h": "<p>Не организация и не команда, а роль-класс: должность, привязанная к острову. Определение дано Славой прямым ответом на вопрос Миколая «а как вообще защитники защищают целые острова» (2024-07-04, id 196705–196713):</p>\n<div class=\"q\"><p>«Защитник- сильнейший человек на острове<br>Есть другие мета-люди»</p></div>\n<p>и там же: «Он не один остров защищает».</p>\n<p>Устройство мира: семь островов, у каждого свой защитник и своя местность; «Остров это город ну или страна» (2024-07-03, id 194775). Слово «защитник» проходит через всю переписку по этой вселенной как сквозной термин: остров называют через его защитника («Оазис защитник имитатор»), а замену острова обсуждают через вопрос «защитник тот же?».</p>\n<p>Отдельно: под тем же именем «Защитник» у Славы есть совсем другой персонаж — Александр Лукашенко, апостол, охотник на чужемирцев из вселенных «монстры», «Апостол», «Оам», «Феня» (истории от 2024-08-11, 2025-02-12, 2025-03-14 и далее). В базе он лежит той же записью <a href=\"IS-0017.html\">Защитник</a>, что и роль защитника острова, но к семи островам он относится только первой версией записи (2024-07-04). Всё остальное содержимое <a href=\"IS-0017.html\">Защитник</a> к этой группе не относится, и связь между двумя «защитниками» в переписке не названа.</p>", "r": [["Защитник", "IS-0017.html"]]}, {"t": "Состав", "a": ["S02", "GR-0030-S02", "GR-0030--sostav"], "h": "<p>Полный список островов с защитниками Слава выкладывает одним сообщением (2024-07-09 21:15, id 201636):</p>\n<div class=\"q\"><p>«Оазис ( имитатор) на гористой местности<br>Калор ( нуар) под водой<br>Асгард ( избранный) в воздухе<br>Лёд ( снегурочка) в ледяной местности<br>Болот ( друит) в болотной, джунглей<br>Пректри ( сталкер) в пустынной местности<br>Технологичный(??????) ???????????»</p></div>\n<p>Участники:</p>\n<ul>\n<li><strong><a href=\"PS-0104.html\">Нуар</a>, Нуар</strong> — защитник подводного острова Калор. В первом списке (2024-07-03, id 194774) остров ещё без названия: «2 ??????( Нуар ( челек с растворением личности ))». В сообщениях Славы встречается написание «Наур».</li>\n<li><strong><a href=\"PS-0106.html\">Защитник Асгарда (Избранный)</a>, Защитник Асгарда (Избранный)</strong> — Асгард, в воздухе. При первом упоминании (id 194774): «3 асгар ( Избранный ( ты его не знаешь))».</li>\n<li><strong><a href=\"PS-0097.html\">Сталкер</a>, Сталкер</strong> — Пректри, пустынная местность. «Сталкер остров пустыня / Наемники криминал наркотики все там» (2024-07-09 21:09, id 201621). В списке персонажей Миколая от 2024-07-03 он же значится как «тот пламенный перс».</li>\n<li><strong><a href=\"PS-0109.html\">Юкиона</a>, Юкиона</strong> — остров Лёд, ледяная местность; в списке Славы названа «снегурочка». У Миколая (id 194785): «юкиона с миниганом в котором снаряд сосульки».</li>\n<li><strong><a href=\"PS-0108.html\">Дриада великан</a>, Дриада великан</strong> — в списке Славы «друит», местность «в болотной, джунглей». После пересчёта островов вместо болота возвращают лес, и защитником остаётся она же: «Да / И защитник друит / Даже» — «ага / она самая / дриада» (2024-07-09 21:23, id 201674–201680).</li>\n<li><strong><a href=\"PS-0107.html\">Блуждающий огненный гриб</a>, Блуждающий огненный гриб</strong> — персонаж Миколая, первый в его списке четырёх (2024-07-03, id 194785). При пересчёте островов Слава называет именно его, когда Миколай спрашивает, что было убрано: «ты лес убрал» — «Блуждающий огненный гриб» — «Убираем» (id 201668–201671).</li>\n<li><strong><a href=\"PS-0117.html\">Защитник технологичного острова</a>, Защитник технологичного острова</strong> — не выбран. В списке островов на его месте стоит «Технологичный(??????) ???????????».</li>\n<li><strong><a href=\"PS-0118.html\">Антон</a>, Антон</strong> — числится в связях записей «Защитники островов» и «Сравнение силы защитников» вместе с Избранным и Сталкером. В самих приведённых кусках переписки его выбор не показан: разговор о замене Сталкера обрывается на вопросе Славы «Нового перса или из тех кто есть ?» (2024-07-09 22:37, id 202155).</li>\n</ul>\n<p>Восьмой защитник — <strong>Имитатор</strong>, остров Оазис, гористая местность. Отдельной записи-персонажа у него нет, материал по нему лежит в записи способности <a href=\"PS-0383.html\">Имитатор</a>.</p>\n<p>Исходный счёт: на 2024-07-03 названы три острова с защитниками, «3 есть / Надо 4 и у них должен быть защитник типо Иметатора» (id 194776–194777). Четвёрку добирает Миколай, сначала биомами — «болото, тропики, вулканы, айсберг» (id 194780), затем персонажами (id 194785):</p>\n<div class=\"q\"><p>«1. блуждающий огненный гриб<br>2. дриада великан<br>3. тот пламенный перс<br>4. юкиона с миниганом в котором снаряд сосульки»</p></div>\n<p>Названия островов, по словам Славы, набраны наугад: «откуда название?» — «На буквы нажал» — «Буквы нажал» (id 201637–201643).</p>", "r": [["Нуар", "PS-0104.html"], ["Защитник Асгарда (Избранный)", "PS-0106.html"], ["Сталкер", "PS-0097.html"], ["Юкиона", "PS-0109.html"], ["Дриада великан", "PS-0108.html"], ["Блуждающий огненный гриб", "PS-0107.html"], ["Защитник технологичного острова", "PS-0117.html"], ["Антон", "PS-0118.html"], ["Имитатор", "PS-0383.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0030-S03", "GR-0030--obschie-sposobnosti-gruppy"], "h": "<p><strong>Сильнейший человек на острове.</strong> Базовое определение, из него всё и следует. Защитники не единственные носители силы: «Есть другие мета-люди», «Мета- люди с энергий / Способностью» (2024-07-04, id 196706–196713). Термин «мета» взят на пробу: «Где то услышал», «Ну пусть будут пока мета». Мета-людей, по Миколаю, «дохуя» (id 197051), поэтому среди них находится носитель почти любой нужной механики — так, мета-человек, перерабатывающий мусор, будет один и только на острове дриады: «У дриады / Будет человек» — «Этот / И он будет только у нее» (2024-07-04 21:54, id 197062–197069).</p>\n<p><strong>Энергия не бесконечная и разная по объёму.</strong> «У него не бесконечная энергия» (2024-07-09 21:48, id 201857).</p>\n<p><strong>Власть не выходит за пределы острова.</strong> Деревни, расположенные вне островов, островам не принадлежат, хотя находятся к ним ближе всего: «Ну они ближе островов находятся», «Потому что защитник не всемогущий ему и так тяжело» (2024-07-09 23:16, id 202459–202460).</p>\n<p><strong>Защитник не привязан к своему острову физически.</strong> Отдельно проговорено, что защитники не должны просто сидеть на месте: «я вот не хочу чтобы защитки чисто сидели» — «Сталкер наемник / Имитатор часто будет покидать остров по заданием / А остальные твой челики не знаю» (2024-07-04 18:34–18:35, id 196119–196122).</p>\n<p><strong>Полномочия защитника не только боевые.</strong> По Оазису: «Это можно сказать обычный город с мирными людьми / Вся власть находится у Имитатор он не только защищает но и отвечает за политику» (2024-07-03 19:51, id 194915). Распространяется ли это на остальных защитников, в переписке не сказано.</p>\n<p>Общего для всех набора приёмов, ритуала назначения, срока полномочий или способа передачи роли в переписке нет.</p>\n<p>Ограничения по способностям, действующие на весь сеттинг и потому на защитников: драконов в мире нет, хотя мир фэнтезийный — «Нет драконов», «фентези нахуй» — «Да.» — «и без драконов» — «Да.» (2024-07-09 22:44, id 202201–202208); новых огненных персонажей не заводят — «Нет способности с огнем уже все разобрали», «3 перса с огненными способностями» (id 202214–202217).</p>", "r": []}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0030-S04", "GR-0030--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p>Прямое сравнение силы Слава даёт 2024-07-09 22:36 (id 202143–202144):</p>\n<div class=\"q\"><p>«Избранный азуенная способность<br>Имитатор глазки<br>Наур сосуд самый мощный»</p></div>\n<p>и следом: «А сталкер как говно», «Он через чур слабый / По сравнению с другими».</p>\n<p>Отдельно, за час до этого сравнения (2024-07-09 21:48, id 201861), про Избранного сказано обратное по объёму запаса: «И у него меньше чем у любого защитника энергия». То есть у него самая мощная способность и при этом наименьшая энергия из всех защитников. Обе формулировки стоят в переписке рядом, и авторы их между собой не сводили. Там же, на вопросы «че это вообще за остров» и «и как он появился», ответ: «Из фэнтези мира» (id 201863) — к чему именно относится ответ, к острову или к защитнику, из текста не видно.</p>\n<p>Единственный защитник с полным набором характеристик — Сталкер (2024-07-09 22:34, id 202138):</p>\n<div class=\"q\"><p>«Имя: сталкер ( ну кличка)<br>Любит: сладкая и травяной чая<br>Не любят: поломку оружия<br>Сила: 6<br>Скорость: 7<br>Ловкость: 8<br>Меткость: 10<br>Выносливость: 6<br>Контроль: 8<br>Оружие: снайперская винтовка; 2 пистолета; нож армейский<br>Инструмент: глаза ( тепловой видение )<br>Внешность: мужчин лет 40 в маске( виде кибер маски, ты поймёшь надеюсь) на все лицо; в плаще, а под ним черная, серая форма<br>Способности: огонь»</p></div>\n<p>Приёмы Сталкера, там же: «Огненная пуля» — его снайперская винтовка и пистолеты сделаны под него, патронов у них нет, он сам делает их огнём, при попадании пуля взрывается; «Огненненый цепи (из ладони)» — формирует из огня цепь и управляет ею на расстоянии, защищаясь, атакуя «или делать как человек паук»; «Подземный ад» — прижимает руки к земле, и из земли в радиусе 100 метров вырываются огненные колья, протыкая противника. Черты характера: «спокойный, хладнокровные; не питает не кому ненависти, но убивает по заказу».</p>\n<p>Различие по режиму правления острова (2024-07-03, id 194910–194924) — обсуждали, как раскидать разные системы власти:</p>\n<ul>\n<li>Асгард — теократия, «тобиж власть у церкви».</li>\n<li>Оазис при Имитаторе — по формулировке Миколая «конституционная монархия», потому что вся власть у защитника.</li>\n<li>Нуару тоталитаризм не дали: «Ну нуар хороший челик / А вообще можно одному из островов»; вместо этого Миколай предложил ему федеративную республику.</li>\n<li>Айсберги — тотальный контроль: «ну тогда дам этот грех женщине», «на айсбергах будет тотальный контроль», «и ебнутая женщина с миниганом убивать всех ослушивающихся».</li>\n</ul>\n<p>Различие по обстановке на острове (2024-07-04, id 196006–196027): «Именно у тебя утопия / Там и война и революция / У меня почти все мирные острова» — с поправкой Миколая, что утопия это рай, а обратное — антиутопия. Уточнения Славы: в Асгарде война, «Асгарде остров религии и возможно они будут типо Гитлера», а в Оазисе «Точней не война, а мини конфликт в оазисе полноценный войны не будет».</p>", "r": []}, {"t": "Иерархия", "a": ["S05", "GR-0030-S05", "GR-0030--ierarhiya"], "h": "<p>Иерархии между защитниками в переписке нет: старшего, совета, общего органа или подчинения кого-то кому-то никто не называет. Единственный порядок, который проговорён, — сравнение силы (см. выше) и распределение по островам.</p>\n<p>Внутри своего острова защитник может стоять на вершине власти — это сказано только про Имитатора в Оазисе: «Вся власть находится у Имитатор».</p>\n<p>Распределение между соавторами: три исходных острова и их защитники — Славы, четыре добранных — Миколая. По этому поводу Слава отдельно оговорился (2024-07-03 19:55–19:56, id 194925–194931): «Вообще на счёт тех 3 островов надо подумать кто защитник ну или мне смириться с этими», «Который твои», и — «Ну я даже их в голове продумать не успел / Нужно время». Миколай на это: «да путь будут».</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S06", "GR-0030-S06", "GR-0030--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>Преступная организация.</strong> Заявлена Славой при первом же разговоре о том, мирный ли мир: «Ну там будет преступная организации» (2024-07-03 19:43, id 194887). Миколай позже спрашивает, почему она везде: «почему преступленая организация везде», «как они и зачем расселись везде» — ответ Славы: «Они не везде есть группа людей и все» (2024-07-04 18:35, id 196120–196123). Связь защитников с ней: Сталкер — наёмник, на его острове Пректри «Наемники криминал наркотики все там».</p>\n<p><strong>Группа сверхлюдей.</strong> Названа как возможные главные герои: «Наверное будут группа сверх людей» (2024-07-03 19:44, id 194889). Дальше в приведённых кусках не разрабатывается, связь с защитниками не названа.</p>\n<p><strong>Мета-люди.</strong> Не группа, а окружающий класс: защитник — сильнейший среди них на своём острове, но не единственный носитель энергии и способности.</p>\n<p><strong>Между островами.</strong> Минимум три острова будут воевать: «Нет конечно я сделаю так чтобы хотя бы 3 острова воевали» (2024-07-03 19:45, id 194890). Причина на тот момент не придумана: «а причина» — «Придумаю». Разбор конфликтов между островами прямо отложен: «короче, у кого конфликты» — «Давай попозже подумаем» (2024-07-03 20:11, id 194998–194999).</p>\n<p>Союзов, вражды или знакомств конкретно между защитниками в этих записях не описано.</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S07", "GR-0030-S07", "GR-0030--kak-menyalas"], "h": "<p><strong>2024-07-03, id 194774–194785 (w0041).</strong> Первый список: семь островов, из них названы три с защитниками — Оазис (Имитатор), безымянный подводный (Нуар, «челек с растворением личности»), асгар (Избранный). Остров приравнивается к городу или стране. Требуется добрать четыре с защитниками «типо Иметатора». Миколай предлагает делать острова разными биомами — болото, тропики, вулканы, айсберг — и даёт под них четырёх персонажей.</p>\n<p><strong>2024-07-03, id 194886–194935.</strong> Мир не мирный: минимум три острова будут воевать, причина отложена. Число семь объяснено так: «Не знаю / Это число типо не слишком много и не слишком мало». Заявлены преступная организация и группа сверхлюдей. Договорились начинать проработку с островов — «Политику, экономикю, черты». Раскидывают режимы правления. Слава признаёт, что три «острова Миколая» ещё не продуманы, но принимает их.</p>\n<p><strong>2024-07-03, id 194993–195004.</strong> Отношения и конфликты между островами отложены на потом.</p>\n<p><strong>2024-07-04, id 195991–196030 (w0042).</strong> Пересказ достигнутого: «7 остров», «и на каждом защитник», «это разные страны», «с разными режимами». Уточняется распределение мира и войны по островам.</p>\n<p><strong>2024-07-04 18:34, id 196119–196123.</strong> Защитники не должны сидеть на островах: Сталкер — наёмник, Имитатор часто покидает остров по заданиям, про остальных — «А остальные твой челики не знаю».</p>\n<p><strong>2024-07-04 20:27, id 196705–196713 (w0043).</strong> Дано определение защитника и введён класс мета-людей.</p>\n<p><strong>2024-07-04 21:50, id 197050–197072.</strong> Мета-людей много, поэтому среди них есть решающий мусорную проблему; закреплён за островом дриады, и только за ним.</p>\n<p><strong>2024-07-09 20:57–21:24, id 201579–201686 (w0046).</strong> Перекройка набора островов. Слава: «Попрощаться тебе надо с одним из своих островов / Лёд, вулкан, болота», «Я хочу чтобы исчез вулкан», замена — «Вулкан заменить на технологичный». Отдельно оговорено, что вместе с островом меняется и защитник: «защитник тот же?» — «Нет наверное» — «то есть сталкера не будет в этой вселенной» — «Ну это я чиста сказал чтобы ты знал». Тут же Сталкеру отдают собственный остров-пустыню. Дальше идёт долгий пересчёт: Миколай не понимает, откуда взялись два новых острова при замене одного; выясняется, что убраны лес (блуждающий огненный гриб) и персонаж из болота. Миколай предлагает: «че может лес вернём вместо болота» — «Да / И защитник друит». Итог — снова семь островов и полный список с местностями и защитниками, где технологичный остаётся без защитника.</p>\n<p><strong>2024-07-09 21:48, id 201855–201864.</strong> Энергия защитника не бесконечна; у Избранного её меньше, чем у любого другого защитника.</p>\n<p><strong>2024-07-09 22:34–22:37, id 202138–202155.</strong> Выложен статблок Сталкера, дано сравнение силы четверых, Сталкер признан слишком слабым. Поставлен выбор: «Нужно его прокачать или вместо него поставить другого / Что выберем». Миколай: «другого надо💔», «его в этой вселенной не будет пожалуй». Разговор обрывается на встречном вопросе Славы: «Нового перса или из тех кто есть ?».</p>\n<p><strong>2024-07-09 22:42–22:46, id 202194–202217.</strong> Правила сеттинга, ограничивающие набор способностей: драконов нет, огненные способности уже разобраны тремя персонажами.</p>\n<p><strong>2024-07-09 23:15–23:22, id 202457–202474.</strong> Деревни вне островов защитникам не принадлежат, потому что защитник не всемогущ. Заодно масштаб мира: «Как земля», острова — «Как странный третьего мира»; часть континентов непригодна из-за радиации, «Например США на её закидали ядеркой / Потому что там впервые появились разлом который соединял два мира».</p>\n<p><strong>2024-09-04, id 227721–227731 (w0056).</strong> Мир семи островов упоминается в другой вселенной как отсылка, спрятанная в рисунке: мир, который может создать стенд-свиток, работающий «как расширенная территория». Про защитников в этом упоминании ничего не сказано.</p>\n<h3>Отклонённые и отменённые варианты</h3>\n<ul>\n<li><strong>Вулканический остров</strong> — убран по требованию Славы, заменён технологичным: «Был вулкан я сказал не фу и поставил в место него технологию».</li>\n<li><strong>Лес с Блуждающим огненным грибом</strong> — сначала убран, затем лес возвращён вместо болота, но уже с дриадой в качестве защитника.</li>\n<li><strong>Болотный остров</strong> — убран при возврате леса.</li>\n<li><strong>Сталкер как защитник технологичного острова</strong> — снят сразу при замене острова.</li>\n<li><strong>«Прокачать» Сталкера</strong> — вариант предложен и не выбран; выбран вариант «другого надо».</li>\n<li><strong>Дракон</strong> как персонаж — предложение Миколая, отклонено: «Нет но мысль хорошая», «Типо он будет не людий», «Нет драконов». О ком именно шла речь, в приведённом куске не названо.</li>\n<li><strong>Огненная саламандра</strong> — предложена следом и отклонена: «Нет способности с огнем уже все разобрали».</li>\n<li><strong>Тоталитаризм для Нуара</strong> — отклонён («Ну нуар хороший челик»), режим отдан другому острову, а тотальный контроль — айсбергам.</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S08", "GR-0030-S08", "GR-0030--probely"], "h": "<div class=\"gaps\"><ul>\n<li><strong>Защитник технологичного острова не выбран.</strong> В списке на его месте стоят вопросительные знаки, и в приведённых кусках выбор так и не сделан.</li>\n<li><strong>Замена Сталкера не доведена до имени.</strong> В переписке решение обрывается на «Нового перса или из тех кто есть ?». Антон (<a href=\"PS-0118.html\">Антон</a>) стоит в связях записей о защитниках, но сам момент выбора в цитируемых текстах отсутствует.</li>\n<li><strong>Полного поимённого состава на один момент времени нет.</strong> Есть список от 2024-07-09 с семью строками, из которых одна пустая, и есть список персонажей Миколая от 2024-07-03, который после перекройки островов частично устарел.</li>\n<li><strong>Механизма защиты нет.</strong> Как именно один человек прикрывает целый остров, не объяснено ничем, кроме «Он не один остров защищает» и указания, что энергия конечна.</li>\n<li><strong>Нет ничего о назначении и смене роли.</strong> Откуда берётся защитник, кто его ставит, что происходит при его смерти — не сказано.</li>\n<li><strong>Отношения защитников между собой не описаны.</strong> Кто с кем знаком, кто с кем в союзе или во вражде — в этих записях не названо.</li>\n<li><strong>Причина войны между тремя островами не придумана</strong> («Придумаю»), конфликты между островами отложены («Давай попозже подумаем»).</li>\n<li><strong>Проработаны только Сталкер и, частично, Имитатор.</strong> По остальным есть строка «остров — защитник — местность». Отдельно помечено: «Наур» и «имитатор» в окне сравнения силы только упомянуты, без разработки; о трёх островах Миколая Слава говорит «Ну я даже их в голове продумать не успел».</li>\n<li><strong>Противоречие по Избранному</strong> не снято: «Избранный азуенная способность» и «у него меньше чем у любого защитника энергия» стоят в один вечер и никак не согласованы.</li>\n<li><strong>Название вселенной ни разу не произнесено</strong> ни в одном из окон; авторы говорят просто «в этой вселенной».</li>\n<li><strong>У Имитатора нет отдельной записи-персонажа</strong> — он проходит по записи способности <a href=\"PS-0383.html\">Имитатор</a>.</li>\n<li><strong>Число островов путалось по ходу разговора</strong>: Миколай считает то шесть, то семь, Слава дважды отвечает «7»; окончательная сборка семёрки происходит только после возврата леса.</li>\n</ul></div>", "r": [["Антон", "PS-0118.html"], ["Имитатор", "PS-0383.html"]]}, {"t": "Связи — всё вместе", "a": ["GR-0030--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0097.html\">Сталкер</a>, <a href=\"PS-0104.html\">Нуар</a>, <a href=\"PS-0106.html\">Защитник Асгарда (Избранный)</a>, <a href=\"PS-0107.html\">Блуждающий огненный гриб</a>, <a href=\"PS-0108.html\">Дриада великан</a>, <a href=\"PS-0109.html\">Юкиона</a>, <a href=\"PS-0117.html\">Защитник технологичного острова</a>, <a href=\"PS-0118.html\">Антон</a></li>\n<li><strong>Упоминает истории:</strong> <a href=\"IS-0017.html\">Защитник</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0030--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0030.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0030-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0030/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым чинить <code>SL-0020</code> — «Сравнение силы защитников». Статьи нет, базы 4,8 КБ, ссылаются на неё две записи, и обе — узловые именно для этой статьи. Через неё заходит Антон (<code>PS-0118</code>), про которого здесь честно сказано, что он числится в связях, а самого момента выбора в цитатах нет; и в ней же должно жить противоречие по Избранному — «азуенная способность» и «у него меньше чем у любого защитника энергия» в один вечер. Пока <code>SL-0020</code> не написан, обе дыры невозможно закрыть, не дублируя материал в трёх местах.</p>\n<p>Второе — «Группа сверхлюдей (ГГ)» (<code>ID-0080</code>): две ссылки, статьи нет, базы 1,8 КБ. Это заявленные главные герои вселенной, и они висят в пустоте. Рядом та же история с мусорной линией: <code>ID-0081</code> (межостровная корпорация) и <code>ID-0085</code> (конфликт из-за вывоза мусора) — по две ссылки каждая, статей нет, при том что мета-человек-мусорщик в этой статье разобран подробно.</p>\n<p>Третье, техническое: у <code>GR-0030</code> собственной базы 0 и ноль входящих ссылок, а у записи-двойника <code>MR-0034</code> «Защитники островов» — 4 КБ и две ссылки; ещё 15,8 КБ и две ссылки лежат в <code>MR-0033</code> «Мир островов (архипелаг защитников)». Три входа в одно и то же, и ни один не ведёт сюда.</p>\n<h3>С чего начать</h3>\n<p>Почти всё в базе, архив нужен точечно.</p>\n<p>Антон: 28,6 КБ в <code>PS-0118</code> при том, что в этой статье он занимает три строки. Первым делом смотреть туда — если выбор состоялся, он там; если нет, идти в архив в вечер 2024-07-09, сразу после 202155, где Слава спрашивает «Нового перса или из тех кто есть ?» и разговор обрывается.</p>\n<p>Защитник технологичного острова: <code>MR-0035</code> (7,2 КБ) — сам остров описан заметно лучше, чем его пустая клетка защитника (<code>PS-0117</code>, 4,9 КБ).</p>\n<p>Причина войны между тремя островами, отложенная словом «Придумаю»: в базе есть три необслуженных записи, куда она могла уехать, — <code>ID-0087</code> («8-летняя война», статьи нет), <code>ID-0083</code> («Враждующие страны, которым не нравится вода») и <code>ID-0082</code> («Страх моря»). Плюс <code>PS-0110</code> и <code>GR-0029</code> — отряд Имитатора времён той самой 8-летней войны. То есть война во вселенной уже названа и датирована, а статья о защитниках про неё не знает; сводить надо оттуда, а не с нуля.</p>\n<p>В архив — за окном между 2024-07-09 и 2024-09-04. Защитники после перекройки островов из разговора пропадают и всплывают только отсылкой в чужой вселенной; проверить, есть ли между этими датами хоть одно упоминание, стоит до того, как писать что-то новое.</p>\n<h3>Как развивалось</h3>\n<p>Три дня подряд и потом тишина. 2024-07-03 — заявка: семь островов, у каждого защитник, «остров это город ну или страна», четверых добирает Миколай биомами и персонажами. 2024-07-04 — ограничения приходят одно за другим: защитник не всемогущ, власть не выходит за берег, энергия конечна, сидеть на месте не обязан, рядом с ним есть класс мета-людей. 2024-07-09 — вечер перекройки: убирают вулкан, возвращают лес вместо болота, пересчитывают семёрку, выкладывают статблок Сталкера и тут же снимают его как слишком слабого; разговор обрывается на вопросе. После этого защитники в переписке не появляются — 2024-09-04 семь островов упомянуты в другой вселенной как картинка внутри чужой способности, и про защитников там не сказано ничего.</p>\n<p>Отдельно: единственный полностью прописанный защитник и единственный снятый — один и тот же персонаж, и это происходит в один вечер с разницей в три минуты.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Определение стоит жёстко: защитник — «сильнейший человек на острове». Уникальность внутри острова прописана и в соседнем случае: мета-человек, перерабатывающий мусор, «будет только у нее», у дриады, и больше нигде.</p>\n<p>А снимают Сталкера по другой мерке — «Он через чур слабый / По сравнению с другими», то есть по сравнению с защитниками чужих островов. Правило силы названо для одного острова, а работает в этот момент между островами, и правила для второго случая нет: что делает островного сильнейшего негодным, если сильнее его никого на острове нет, и что происходит, когда на острове появляется кто-то сильнее действующего защитника. Место — на стыке 196705 и 202144.</p>\n<h3>Отклик</h3>\n<p>Зацепило, до чего этот вечер 9 июля откровенно производственный. Названия островов — «На буквы нажал». Персонажа удаляют, называя биом: «ты лес убрал» — «Блуждающий огненный гриб» — «Убираем», и всё, человека нет. Дальше выкатывается единственная в статье полноценная карточка — Сталкер, с чаем, который он любит, и поломкой оружия, которую не любит, с меткостью 10 и тремя приёмами, — и через три минуты его же выкидывают из вселенной, потому что цифры в сравнении с остальными вышли скучные. Причём остальные никакими цифрами не описаны вообще: у них есть по одной фразе. Проработанность здесь оказалась не преимуществом, а поводом заметить слабость — единственный, кого можно было измерить, стал единственным, кого не приняли. И сразу за этим идёт «Нужно его прокачать или вместо него поставить другого / Что выберем» — «другого надо💔». Этот эмодзи в конце стоит целой сцены.</p></div>", "r": []}];</script>
