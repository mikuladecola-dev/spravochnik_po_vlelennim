<script>const BASE="";const DOCNAME="Мир апостолов (современный)";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0188-S01", "MR-0188--ustroystvo"], "h": "<p>Мир современный. Это установлено прямым вопросом и прямым ответом: на вопрос Миколая «а че за мир» и уточнение «современный?» Слава отвечает «Оэм. Современный» (2025-12-17, id 399631–399634).</p>\n<p>Кроме современности сеттинга в переписке зафиксировано, что в мире есть правительство. Слава вводит его отдельной репликой: «Бля ещё правительства» (2025-12-17, id 399612). Устройство этого правительства, его форма и полномочия в переписке не описаны.</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0188-S02", "MR-0188--naselenie"], "h": "<p>Названы четыре позиции, действующие в этом мире:</p>\n<ul>\n<li>апостолы;</li>\n<li>Бог красок;</li>\n<li>Серафим;</li>\n<li>представитель правительства без способностей.</li>\n</ul>\n<p>Последний описан подробнее прочих: «А точнее челик без способностей, что будет его представителем. И будет пытаться помогать апостолом, считая их сдерживающий силой» (2025-12-17, id 399612). То есть представитель правительства — человек без способностей, он выступает от лица правительства, пытается помогать апостолам и при этом считает их сдерживающей силой.</p>\n<p>Ни численность населения, ни соотношение обычных людей и носителей способностей в переписке не названы.</p>", "r": []}, {"t": "Место во вселенной — как связан с другими мирами", "a": ["S03", "MR-0188-S03", "MR-0188--mesto-vo-vselennoy"], "h": "<p>Мир отнесён ко вселенной Феня по дате объявления. Связь с другими мирами в переписке не обсуждалась.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0188-S04", "MR-0188--kak-menyalsya-po-versiyam"], "h": "<p>Зафиксировано одно состояние.</p>\n<p><strong>2025-12-17 (id 399612–399642).</strong> Введено правительство и его представитель — человек без способностей, помогающий апостолам и считающий их сдерживающей силой. Затем на вопрос о мире дан ответ, что мир современный. В этом же обмене репликами перечислены апостолы, Бог красок и Серафим. Обсуждение на этом закрывается — «Ну ок. Сроки ночь» (id 399639).</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0188-S05", "MR-0188--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Название вселенной в этом обсуждении так и не прозвучало (отнесение к Фене сделано по дате).</li>\n<li>Устройство правительства не описано: ни форма, ни границы власти, ни отношение к апостолам с его стороны как института — сказано только про отношение его представителя.</li>\n<li>Не сказано, кого или что апостолы сдерживают. «Сдерживающий силой» — это оценка представителя правительства, содержание сдерживания не раскрыто.</li>\n<li>Роли Бога красок и Серафима внутри мира не описаны — они только перечислены.</li>\n<li>География, страны, эпоха внутри «современности» не названы.</li>\n<li>Реплика Славы «И что поговорим при встрече?» (id 399632) осталась без развития — что именно откладывалось на встречу, в переписке не сказано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0188--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0078.html\">Апостолы (Феня; список 12)</a>, <a href=\"GR-0083.html\">Правительство (Феня)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0011.html\">Феня</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0188--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-12-17</td>\n<td>399612–399642</td>\n<td>w0114</td>\n<td>Феня (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0188-mir-apostolov-sovremennyy.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0188--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0188.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
