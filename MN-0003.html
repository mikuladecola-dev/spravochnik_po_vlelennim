<script>const BASE="";const DOCNAME="Грибница";
const LEAD="";
const CH=[{"t": "Где находится — в каком мире и в каком его месте", "a": ["S01", "MN-0003-S01", "MN-0003--gde-nahoditsya"], "h": "<p>Вселенная не определена: в карточке стоит «неясно». По принадлежности грибница отнесена к апокалипсису — карточка числит её частью «апокалипсис (новая вселенная)».</p>\n<p>Место названо прямо: «В Антарктиде какая та пещера из непонятного вещества ( грибница или как это называется)» (2024-07-31, id 214223).</p>\n<p>Дальше — расширение: грибница не осталась в Антарктиде. «ну, она уже весь мир заполонила» (М), «Ну она тихо заполняла и когда люди опомнились была уже поздно» (С).</p>", "r": []}, {"t": "Что собой представляет", "a": ["S02", "MN-0003-S02", "MN-0003--chto-soboy-predstavlyaet"], "h": "<p>Пещера из непонятного вещества, и пещера живая. Цель у неё одна: «её цель кушать».</p>\n<p>Название обсуждалось отдельно. Миколай поправил: «гробница по идее»; Слава ответил «Серьезно не знал», затем «Гробница это пирамида». Миколай снял вопрос: «а, я пон». В карточке закреплены варианты имени «грибницы» и «пещера».</p>\n<p>Разряд явления определялся в начале разговора и остался нерешённым. Версии, названные подряд: «это мутации будут, да?» (М) — «Вирус» (С) — «это не монстр», «это даже не живая хуета», «на белке паразитирует», «или клетках» (М). После описания пещеры Миколай дал ей другой разряд: «мистика».</p>", "r": []}, {"t": "Что с ним связано — предметы, механики, силы", "a": ["S03", "MN-0003-S03", "MN-0003--chto-s-nim-svyazano"], "h": "<p>Заражение и захват разума. «И она заразила людей и захватила разум и дала одну цель есть» (id 214235). То есть заражённые получают ту же единственную цель, что и сама грибница.</p>\n<p>Размножение делением. «Самая первая грибница заставила перенести часть себя чтобы размножиться путем деления» — то есть перенос части себя выполняют заражённые, по принуждению первой грибницы.</p>\n<p>Кормление. «И в эти грибницы монстры будут таскать жрать» — монстры носят еду в грибницы.</p>\n<p>Карточка связывает грибницу с заражением через глубокие ранения и с монстрами; механика самого заражения через ранения в приведённых кусках переписки не раскрыта.</p>", "r": []}, {"t": "Персонажи и события — кто с ним связан и что там происходило", "a": ["S04", "MN-0003-S04", "MN-0003--personazhi-i-sobytiya"], "h": "<p>Заражённые люди — те, чей разум захвачен и кому дана цель есть. Монстры — те, кто таскает в грибницы жратву. Связь между этими двумя категориями (одно ли это, разное ли) в переписке не проговорена.</p>\n<p>Люди как таковые: «когда люди опомнились была уже поздно». На вопрос «что с ними» ответ короткий — «Сдохли».</p>\n<p>Главный герой. Последняя реплика окна — предположение Миколая: «гг это шизофреник, верно?». Ответа на него в приведённом куске нет.</p>\n<p>Отдельно зафиксирован способ работы: придумывалось на ходу. «Не знаю», «Я только сейчас находу придумываю» (С, id 214244–214245).</p>", "r": []}, {"t": "Как менялся по версиям — по датам", "a": ["S05", "MN-0003-S05", "MN-0003--kak-menyalsya-po-versiyam"], "h": "<p>Всё три версии — один день, 2024-07-31, окно w0049.</p>\n<p>Версия 1 (id 214206–214224). Первое описание: в Антарктиде пещера из непонятного вещества (грибница), пещера живая, её цель — кушать. До этого перебирались разряды — мутации, вирус, паразит на белке или клетках; Миколай в итоге называет это мистикой.</p>\n<p>Версия 2 (id 214235–214243). Добавлены заражение людей и захват разума с единой целью «есть», размножение делением через перенос части себя, кормление монстрами. Сюда же спор о слове «гробница/грибница».</p>\n<p>Версия 3 (id 214243–214255). Обсуждается количество. Миколай: «есть 7 основных самых больших грибниц» и «множество маленьких». Слава: «Одна основная». Здесь же — что грибница заполняла мир тихо, что люди опомнились поздно и «Сдохли».</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "MN-0003-S06", "MN-0003--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Расхождение по количеству не снято: 7 больших грибниц (Миколай) против одной основной (Слава).</li>\n<li>Разряд явления не определён: вирус, паразит, мутация или мистика — сошлись только на том, что пещера живая.</li>\n<li>Из чего состоит грибница — «непонятное вещество», состав не назван.</li>\n<li>Как именно происходит заражение — в этих кусках не описано, хотя карточка связывает грибницу с заражением через глубокие ранения.</li>\n<li>Различие между заражёнными людьми и монстрами не проведено.</li>\n<li>Вопрос «гг это шизофреник, верно?» оставлен без ответа.</li>\n<li>Вселенная не определена.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["MN-0003--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-31</td>\n<td>214206–214224</td>\n<td>w0049</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-31</td>\n<td>214235–214243</td>\n<td>w0049</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-31</td>\n<td>214243–214255</td>\n<td>w0049</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/monumenty/MN-0003-gribnica.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MN-0003--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MN-0003.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
