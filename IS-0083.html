<script>const BASE="";const DOCNAME="Фанатик";
const LEAD="";
const CH=[{"t": "Содержание", "a": ["S01", "IS-0083-S01", "IS-0083--soderzhanie"], "h": "<p>История Славы в жанре исекай, писавшаяся с 2025-12-09 по 2025-12-17 (id 394616–399690, окна w0113 и w0114). Название названо 2025-12-11: «Фанатик» (id 395757). У выложенного в чат текста есть подзаголовок «Фанатик (обычный мир)» (id 397758).</p>\n<p>Жанр обозначен самим автором: «Вообще обычный исекай», «То есть исекай в мир фэнтези» (2025-12-09, id 394657, 394659). Позже, 2025-12-17, жанр переспрошен и подтверждён отдельно: на вопрос Миколая «не иссекай?» — «Иссекай» (id 399662, 399664).</p>\n<h3>Текст первой главы (2025-12-14, id 397758–397761)</h3>\n<p>Слава скинул в чат целиком тот вариант, который к тому моменту забросил. Повествование от первого лица.</p>\n<p>Начало — рассуждение героя о том, кто мечтает попасть в другой мир: «Чаще всего об этом мечтают неудачники», и «Смелость и воля не появится просто по волшебству». Сам он «никогда не мечтал о побеге. Тем более в другой мир», был готов жить нынешней жизнью.</p>\n<p>Его прежняя жизнь: он один ухаживает за отцом и матерью, которые в тексте описаны как «эти», «вот эти куски плоти, когда-то были моей семье», «Уважаемые отец и миловидная мать». Бросить их он не мог — «как никак раньше они меня любили, да и воспитали». Цикл жизни: «Работа, дом и уход за этими. Тем больше проходила времени, чем больше я желал им смерти». Работал на нескольких работах, наплевав на «своё светлое будущее, что вещали мне учителя»; тяжелее всего — недосып, потому что «эти» всю ночь вопят, кричат и стукаются телами. Он моет «эти разлагающие изнутри тела, которая дергаются каждый раз, когда я 'случайно' сильно на давлю», кормит их и натягивает улыбку, когда они выплёвывают еду.</p>\n<p>Отдушиной в этой жизни стали книги — сказки, «Легкий, с простой моралью». Формулировка в тексте: «чем глубже ты во тьме, чем ярчее даже самый тусклый свет». Одна книга — о герое справедливости, что побеждает всё зло: «Легко, просто и предсказуема, но да безумия запало в душу. Мой милый лучик света. Мой герой».</p>\n<p>Дальше — уже попадание. Герой стоит у зеркала и рассматривает незнакомое лицо: мужчина за 20, чёрные волосы, которые были бы абсолютно чёрными, если не седина, острые черты лица, измученные красные глаза. Мысль «Я попал в другое мир» не нужно было формулировать. Волнение сравнивается с ожиданием перед открытием подарка на новый год.</p>\n<p>Он зовёт служанку — фигуру, скрытую во тьме комнаты, «Просто тьма во тьме», чёрные глаза с чёрными волосами. Спрашивает у неё, как его зовут, сколько ему лет и какое сегодня число. Ответ: «вы Дионис Бэлут старший сын графа Бэлута. В этом году вам исполнилась 23 года. Сегодняшняя дата 28 июня 1417 год». Ни имя, ни семья Бэлут герою не знакомы; про дату он думает, что она ничего не даёт, «Вообще в романах очень редко пишут даты. Потому что авторы сами бояться в них запутаться». Остаётся самому расследовать, что это за мир.</p>\n<p>Экскурсия по особняку. Служанка перечисляет семью: граф Эдгар Бэлут — отец, графиня Виктория Бэлут — мачеха, есть младший брат и младшая сестра от графини Виктории. Реакция героя: «Что мачеха. Я прочитал достаточно рассказов, чтобы понимать мачеха не сулит ничего хорошего», и дальше — «Это плоха, очень плоха», потому что политической борьбы он не хочет: «Единственно, что я хотел это понаблюдать за главным героем. В независимости в каком я романе».</p>\n<p>Интерьер средневековый, «Разные узоры, где попало и не экономия пространства», единственный большой плюс — ковры. Служанка рассказывает упрощённый вариант истории королевства Пиор, и этой информации хватает, чтобы понять, что это за мир. Узнавание — узловой момент главы: «Удивительно, нет- это восхитительно. Я лютый грешник попал в тот самый лучик света. В ту б сказку о герой справедливости, что борется со всем злом на свете». Он едва сдерживает возбуждение; «Даже если это сон, даже если это бред. Нужно увидеть героя».</p>\n<p>Дальше — ужин. Герой пытается отказаться, сославшись на самочувствие, но служанка уже сообщила графу через дворецкого, что у господина «за долгое время хорошее настроение», и граф потребовал его присутствия. Герой понимает, что служанка служит графине. Перед дверью он говорит ей: сначала — «будь конкурс лучшей служанки. Ты бы заняла первое место», потом, перед входом в зал, — «знаешь теперь я думаю. Ты займешь последнее место».</p>\n<p>За столом: граф — его копия, только крупнее, с более суровым лицом и бородой; графиня с шелковистыми зелёными волосами; двое черноволосых детей. Граф замечает хорошее настроение, герой отвечает, что сегодня было его «духовное рождение», и объясняет свой путь: «мой путь мне виден с множество знакомств, а также наблюдением за невероятными событиями, что изменят историю», а на переспрос «наблюдать?» — «да наблюдать. Ну и возможно немного контралировать, чтобы события были именно таким, каким должны быть». Граф улыбается. Лицо графини становится холодным и напряжённым.</p>\n<p>Отдельная линия сцены — обращение «мачеха». Виктория требует не разводить формальностей за столом; герой переходит на «мачеха», и лицо её становится ещё грубее. Он не понимает, что не так. Позже в коридоре младший брат Лукас (10 лет) спрашивает: «а почему ты маму, мачехой назвал?», младшая сестра Алиса (7 лет) добавляет: «Ты маму называл мамой», а Лукас — «Иногда матушкой или матерью». Реакция героя внутри: «\"Чё\" Единственное мысль. Это какое новый способ контроля». Заканчивается выложенный кусок словами Лукаса: «мама наверное очень сильно расстроилась».</p>\n<p>До этого в коридоре есть сцена с прикосновением: младший брат предполагает, что старший брат странно себя ведёт, и что «существует несколько болезней, что искажают восприятия». Герой просит дать руку, приседает и прижимает ладонь ребёнка ко лбу — проверяет реальность: «Даже если это все нереально, зато чувство здесь реальны». Уточняется, что раньше он здесь никого не касался и на его руках всегда были белоснежные перчатки. Потом то же самое просит сестра, и он испытывает внутреннее тепло.</p>\n<p>Сквозная физическая привычка героя через всю главу — он постоянно отряхивает пыль с груди и плеча, в том числе «невидимую пыль».</p>\n<h3>Дальнейший сюжет (2025-12-17, id 399669)</h3>\n<p>Выложен пунктами, одним сообщением: «Фанатик ( убийства ведьмы) ( инцидент в деревне) ( психическая нестабильность) ( неспособность убить) ( принципы)». Тут же сказано: «В принципе это весь дальнейший сюжет. Дальше я хер знает что». Содержание самих пунктов в переписке не раскрыто.</p>", "r": []}, {"t": "Персонажи", "a": ["S02", "IS-0083-S02", "IS-0083--personazhi"], "h": "<ul>\n<li><strong>Дионис Бэлут</strong> — тело, в которое попадает главный герой; старший сын графа Бэлута, 23 года, чёрные волосы с сединой, острые черты лица, красные глаза. Прежний Дионис вёл себя иначе — по крайней мере, называл графиню Викторию мамой, матушкой или матерью, и обычно бывал не в хорошем настроении.</li>\n<li><strong>Главный герой</strong> (попаданец, имени в прежнем мире в тексте нет) — человек 21 века, ухаживал за родителями, превратившимися в «эти», работал на нескольких работах, читал сказки. Сам о себе: «Я лютый грешник». Цель после попадания — увидеть героя справедливости, наблюдать за ним и «возможно немного контралировать» события.</li>\n<li><strong>Служанка</strong> — черноволосая, черноглазая, безлицая («Просто тьма во тьме»), появляется из тьмы комнаты, воду достаёт «из неоткуда», действует на опережение приказов. Служит графине Виктории. Имени в тексте нет.</li>\n<li><strong>Граф Эдгар Бэлут</strong> — отец, крупнее сына, суровое лицо, борода, красные глаза.</li>\n<li><strong>Графиня Виктория Бэлут</strong> — мачеха героя, мать Лукаса и Алисы, шелковистые зелёные волосы. На обращение «мачеха» реагирует холодно.</li>\n<li><strong>Лукас</strong> — младший брат, 10 лет, черноволосый, глаза ярко-зелёные, «словно нефрит».</li>\n<li><strong>Алиса</strong> — младшая сестра, 7 лет, черноволосая, красноглазая.</li>\n</ul>\n<p>В списке связей записи также значится <strong>Страх</strong> — как именно он связан с историей, в приведённых кусках переписки не сказано.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "IS-0083-S03", "IS-0083--mesto-vo-vselennoy"], "h": "<p>Действие происходит в королевстве Пиор — мире фэнтези, куда попадает герой; это тот самый мир книги про героя справедливости, которую герой читал в своём мире.</p>\n<p>Вселенная в переписке не объявлена ни в одном из окон. Запись отнесена к Фене по дате объявления. Связь с Феней проходит только через образ гг: 2025-12-09 Слава сказал, что «Вообще этот образ гг был впихнут во вторую Вселенную» (id 394664), и что «есть образ гг. И этот образ отчасти можно оправдать лишь исекаем. Ну и тем что гг долбоеб» (id 394645–394646). Связь с миром апостолов не заявлена. В связях записи назван «Образ бессмертного гг».</p>", "r": []}, {"t": "Состояние", "a": ["S04", "IS-0083-S04", "IS-0083--sostoyanie"], "h": "<p><strong>2025-12-09 (id 394616–394664).</strong> Слава спрашивает: «Ты не против исекая???». Причина вопроса — «Просто это как-то в моей голове считалось деградация в плане истории». Миколай против не был: «а, да вообще нет», «ну исекай можно интересным сделать, просто другой жанр». В том же разговоре Слава сообщает, что бросил другую историю: «Сдайся. Я кинул эту историю. Потому что не понял гг», а про новую — «Но вот эту историю я точно до концу». Миколай отмечает: «ты никогда так не поступал с персами». Договорились, что Слава скинет текст, когда напишет, а Миколай будет спрашивать и подгонять: «Спрашивай. Подгоняй меня».</p>\n<p><strong>2025-12-10 (id 395529–395546).</strong> На вопрос «как история» — «Пишется». Отмечена одна доработка: «Но описания его предыдущий жизнь надо улучшить. Просто один элемент». Что за элемент — не сказано. Миколай в этом же разговоре заявляет, что тоже хочет написать исекай.</p>\n<p><strong>2025-12-11 (id 395749–395757).</strong> Образ гг признан не тем: «Блять мой образ гг. Он не тот. Нет в нём есть частичка того образа которого я хотел. Но он не тот». При этом автор героя понимает — перечислено, что именно: «Его привычка, его ненависть к определенным словам, его действия, который иногда кажутся хаотичным, его недоверия к тому что как бы вызывает доверия», и отдельным сообщением — «Ну ещё его гнев, восхищение и возбуждение». Решение: «Ну все равно буду продолжать». Тут же названо название истории: «Фанатик».</p>\n<p><strong>2025-12-11, позже (id 396062–396064).</strong> Миколай переформулирует проблему: «типа как ты его пишешь он не живёт так как ты хотел» — «Ну да».</p>\n<p><strong>2025-12-13 (id 397182–397183).</strong> Третье переписывание, изначальный образ отброшен: «Ладно не жди образа гг который я изначально задумывал. Чем больше я деталей вписывал, чем дальше он был от образ гг и чем больше он не подходил для некоторых сцен. И здесь я вспомнил о другом образе героя со своими сценками и теперь третьи раз я буду переписывать». И следом: «То есть я заново переписываю истории с новым гг».</p>\n<p><strong>2025-12-14 (id 397744–397761).</strong> По просьбе Миколая («ну вот то скинь раз забросил») заброшенный вариант выложен в чат целиком — текст первой главы под заголовком «Фанатик (обычный мир)».</p>\n<p><strong>2025-12-17 (id 399649–399668).</strong> Слава объявляет: «Я продолжу писать фанатик. Изменив некоторый детали» — а именно «Некоторые его момент в характере гг». На вопрос Миколая, понял ли он смысл «Фанатика», Миколай отвечает «не»; Слава: «Ну прочитаешь поймешь». В этом окне Миколай читает текст, выложенный в предыдущем окне, и к концу разговора не дочитал: «я не дочитал если че».</p>\n<p><strong>2025-12-17, позже (id 399669–399690).</strong> Выложен скелет дальнейшего сюжета пунктами. Про сроки: «Ты чё блин думаешь это быстро будет. У меня сейчас зачеты. Плюсом эти события достаточное длинные. Возможно если я допишу эти события это будет длинейшей истории». Миколай: «дописывай в своем темпе».</p>\n<p>Итог на 2025-12-17: история не дописана. Существующий текст — первая глава варианта, который сам автор считает заброшенным (третье переписывание). Продолжение объявлено с правкой характера гг, но в переписке не выложено.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "IS-0083-S05", "IS-0083--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Смысл названия «Фанатик» в переписке не объяснён. На прямой вопрос ответ был: «Ну прочитаешь поймешь».</li>\n<li>Не сказано, что за «один элемент» в описании предыдущей жизни гг требовалось улучшить (2025-12-10).</li>\n<li>Не сказано, чем новый образ гг (после третьего переписывания, 2025-12-13) отличается от прежнего, и какие именно «моменты в характере гг» меняются при продолжении (2025-12-17).</li>\n<li>Пункты дальнейшего сюжета — «убийства ведьмы», «инцидент в деревне», «психическая нестабильность», «неспособность убить», «принципы» — не раскрыты. Что за ведьма, что за деревня, чьи принципы — не сказано. Дальше этих пунктов автор сам не знает: «Дальше я хер знает что».</li>\n<li>«Герой справедливости», ради которого гг хочет остаться наблюдателем, в выложенном тексте не появляется; кто он — не названо.</li>\n<li>Имя гг в его прежнем мире не названо. Не сказано, как он попал в тело Диониса и что стало с прежним Дионисом.</li>\n<li>Название истории, которую Слава бросил ранее («Я кинул эту историю. Потому что не понял гг», 2025-12-09), не названо.</li>\n<li>Вселенная не объявлена ни в w0113, ни в w0114; связь с Феней — только через образ гг. Связь с миром апостолов не заявлена.</li>\n<li>Как связан со «Страхом» — в переписке не сказано.</li>\n</ul></div>\n<div class=\"mnote\"><b>⚙ машинная заметка · С чего начать — не материал авторов</b>\n<p>Частично — прямо в соседней статье, без архива. Собственный пробел этой записи «название истории, которую Слава бросил ранее, не названо» закрывается без похода в чат: это <code>IS-0082</code> «Страх», брошенная в id 394634–394648 — внутри того же диапазона 394616–394664, которым открывается «Фанатик». Материал для будущей статьи <code>GR-0081</code> тоже уже в базе, просто разъехался по соседям: состав семьи Бэлут (граф Эдгар, графиня Виктория, Лукас, Алиса) целиком лежит внутри <code>PS-0334</code> «Семья Бэлут», рядом — <code>PS-0332</code> Дионис Бэлут и <code>PS-0335</code> черноволосая служанка. Собирать заново не нужно, нужно только свести. А вот за настоящими пробелами — смысл названия «Фанатик», какой именно «один элемент» описания прежней жизни гг требовалось улучшить (2025-12-10), что изменилось в образе гг после третьего переписывания (2025-12-13) — придётся идти в архив: окна вокруг id 395529–395546 и 397182–397183.</p></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["IS-0083--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0081.html\">Семья Бэлут</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["IS-0083--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-12-09</td>\n<td>394616–394664</td>\n<td>w0113</td>\n<td>Феня (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-10</td>\n<td>395529–395546</td>\n<td>w0113</td>\n<td>Феня (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-11</td>\n<td>395749–395757</td>\n<td>w0113</td>\n<td>Феня (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-11</td>\n<td>396062–396064</td>\n<td>w0113</td>\n<td>Феня (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2025-12-13</td>\n<td>397182–397183</td>\n<td>w0113</td>\n<td>Феня (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-14</td>\n<td>397744–397761</td>\n<td>w0113</td>\n<td>Феня (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-17</td>\n<td>399649–399668</td>\n<td>w0114</td>\n<td>Феня (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-17</td>\n<td>399669–399690</td>\n<td>w0114</td>\n<td>Феня (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/istorii/IS-0083-fanatik.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["IS-0083--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/IS-0083.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["IS-0083-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/IS-0083/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Самая дешёвая по объёму и самая дорогая по связности дыра — <code>GR-0081</code> «Семья Бэлут»: <code>est_statya: false</code>, <code>razmer_bazy: 0</code>. Счётчик <code>ssylok_na_nego</code> в <code>blockers.json</code> по ней показывает 0, но это отстаёт от факта: сама эта статья прямо на неё ссылается (раздел «Связи — всё вместе»: «статьи ещё нет»), и, по плановому файлу группы, её ждут ещё пять записей — <code>PS-0334</code>, <code>PS-0332</code>, <code>PR-0105</code>, <code>MR-0187</code>, <code>PS-0335</code>. Группа нужна минимум шести записям, а в реестре не значится ни разу.</p>\n<h3>С чего начать</h3>\n<p>Частично — прямо в соседней статье, без архива. Собственный пробел этой записи «название истории, которую Слава бросил ранее, не названо» закрывается без похода в чат: это <code>IS-0082</code> «Страх», брошенная в id 394634–394648 — внутри того же диапазона 394616–394664, которым открывается «Фанатик». Материал для будущей статьи <code>GR-0081</code> тоже уже в базе, просто разъехался по соседям: состав семьи Бэлут (граф Эдгар, графиня Виктория, Лукас, Алиса) целиком лежит внутри <code>PS-0334</code> «Семья Бэлут», рядом — <code>PS-0332</code> Дионис Бэлут и <code>PS-0335</code> черноволосая служанка. Собирать заново не нужно, нужно только свести. А вот за настоящими пробелами — смысл названия «Фанатик», какой именно «один элемент» описания прежней жизни гг требовалось улучшить (2025-12-10), что изменилось в образе гг после третьего переписывания (2025-12-13) — придётся идти в архив: окна вокруг id 395529–395546 и 397182–397183.</p>\n<h3>Как развивалось</h3>\n<p>2025-12-09 — заявили: «Вообще этот исекай», решение довести до конца в отличие от только что брошенного «Страха». 2025-12-11 — тут же ограничили и усомнились в собственном ограничении: образ гг «не тот», но «Ну все равно буду продолжать». 2025-12-13 — фактически забросили и второй вариант: «теперь третьи раз я буду переписывать». 2025-12-14 — заброшенный первый вариант всплывает не по инициативе автора, а по прямой просьбе Миколая: «ну вот то скинь раз забросил». 2025-12-17 — вернулись: «Я продолжу писать фанатик. Изменив некоторый детали», и тем же днём выложен скелет дальнейшего сюжета пятью пунктами.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для «Страха» Миколай называет и применяет правило: «название это сильная позиция любой работы... значит буду это учитывать всю историю» — и действительно сверяет «Страх» с этим правилом вслух («страшно челу», «для одного эпизода»). Для «Фанатика» такой проверки нет: на прямой вопрос, понял ли он смысл названия, ответ — «не», и разбор заканчивается репликой «Ну прочитаешь поймешь», без встречной попытки применить тот же принцип.</p>\n<h3>Отклик</h3>\n<p>Сильнее всего здесь не текст первой главы, а то, с какой прямотой автор описывает собственную неудачу с гг: «Он не тот. Нет в нём есть частичка того образа которого я хотел. Но он не тот» — и следом «Ну все равно буду продолжать», без попытки выдать это за нормальный этап работы. Три переписывания подряд, и при этом ни одно не отменяет предыдущее полностью — заброшенный вариант всплывает по чужой просьбе и оказывается вполне цельным текстом с сильным образом («вот эти куски плоти, когда-то были моей семье» про уход за разлагающимися заживо родителями). Зацепило именно это: черновик, который автор сам считает промежуточным, читается плотнее, чем многие «финальные» тексты в этом своде.</p></div>", "r": []}];</script>
