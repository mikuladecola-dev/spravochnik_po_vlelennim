<script>const BASE="";const DOCNAME="Босое приключение";
const LEAD="";
const CH=[{"t": "Содержание", "a": ["S01", "IS-0015-S01", "IS-0015--soderzhanie"], "h": "<p>История о том, как Миколай потерял тапки при переходе реки Уда и три часа шёл босиком до дома по берегу и по Ключевской, собирая себе обувь из подручного мусора. В переписке рассказана в три захода за два дня (2024-06-22 — 2024-06-23, окно w0039), причём заходы идут не в хронологическом порядке событий: сначала перечень обуви, потом общий рассказ, потом самое начало и самая опасная часть — переход реки вплавь.</p>\n<p><strong>Заход первый (2024-06-22, id 185850–185851).</strong> Начинается не с события, а с инвентаря: «Хех, мне так нравится набор моей обуви в босом приключении». Дальше список того, что было сделано и найдено по дороге:</p>\n<ul>\n<li>тапки из трубного утеплителя и огородительной ленты;</li>\n<li>тапки из паралона и веток;</li>\n<li>кроссовки из коробки от пиццы и тряпичной ленты;</li>\n<li>«потом я нашел один тапок настоящий»;</li>\n<li>«а после нашел пару белых носков, в один из которых засунул паралон для удобства».</li>\n</ul>\n<p>Именно из этого сообщения берётся второе название истории — «набор моей обуви».</p>\n<p><strong>Заход второй (2024-06-23, id 185904–185942).</strong> На следующий день Слава переспрашивает, о каком приключении речь, и Миколай пересказывает целиком: «Всё супер, я сегодня в Уде посеял тапки и пришлось 3 часа идти босиком до дома по берегу и Ключевской». (Слово «сегодня» здесь относится ко вчерашнему дню — событие было 22-го.) Способ передвижения он описывает так: «Я тупо шёл и создавал обувь», «Из всего что вижу». Слава на это отвечает одним словом — «Майнкрафт», и Миколай соглашается: «Дадада». Причина, по которой обувь приходилось делать на ходу, названа прямо: «Иначе очень больно было» — по дороге он «около 45 мест прошёл, где было разбито стекло».</p>\n<p>Дальше — выход к людям: «А вообще прикольно, я же реально потом в город вышел», «И шел типо в людном месте с одним тапком и носком с паралоном». Там он пел песни — «Некоторым понравилось как пою». После этого «успел попаркурить, забрался на гаражи», немного походил по ним.</p>\n<p>Своё положение он подытоживает так: «Я ведь я всего лишь хотел пешком в тапках перейти уду и домой пойти» — «Наверное это кара такая». И тут же добавляет предысторию: перед этим он сидел возле кладбища, где стояла вышка с интернетом и лежали бетонные плиты; он на них забрался и «решил по пользоваться быстрым интернетом». Слава уточняет про плиты, Миколай объясняет через сравнение: «Ну в общем как этот забор, только лежачие и тоньше и больше по количеству вверх» (с каким именно забором сравнивается — в переписке не видно, речь идёт о картинке или предыдущем сообщении).</p>\n<p>Заканчивается заход сном: «После такого конченого приключения и сны соответствующие». Содержание сна Миколай не помнит, но записал последнюю фразу — «Если ты дунул, держи при себе по возможности нож». Оговаривается: «Хотя там вообще другой контекст был, какое-то соревнование». Эта сон-фраза числится отдельной связанной сущностью.</p>\n<p><strong>Заход третий (2024-06-23, id 186056–186079).</strong> Здесь появляется то, с чего всё началось, и самая опасная часть. Миколай говорит: «Я вот умел плавать год назад» — «А вчера чуть не утонул». На вопрос «Как ?» отвечает подробно: «Ну так до середины уды в тапках дошёл, дальше уже плыть надо, тапки уплывать начали, я за ними и не догоняю, хотел встать а дна нет». Состояние в этот момент описано его словами: «я вроде спокоен, но дна нет страшно, нади жить». Дальше — «И я там бултыхаюсь», «Не могу просто продвинуться», после чего он всё же «сумел проплыть какой-то конченой техникой метр», достал ногами дно и пошёл дальше: «Чисто аккуратно против течения иду вперёд». Отдельно отмечено, что помощи ждать было неоткуда: «А там же сука людей можно сказать нет», «Никто нахуй не спасёт».</p>\n<p>В самом конце захода Миколай присылает фото: «Кстати вот это место с интернет вышкой на кладбище» (2024-06-23, id 186079).</p>", "r": []}, {"t": "Персонажи", "a": ["S02", "IS-0015-S02", "IS-0015--personazhi"], "h": "<p><strong>Миколай</strong> — единственный участник событий и рассказчик. Действует один: переходит реку, теряет тапки, чуть не тонет, три часа идёт босиком, изготавливает обувь из мусора, выходит в людное место в одном тапке и носке с паралоном, поёт, лазит по гаражам, сидит на бетонных плитах у кладбища ради быстрого интернета.</p>\n<p><strong>Слава</strong> — слушатель. Его вклад в историю — короткие реплики: переспрос «Какого приключения», сравнение «Майнкрафт», уточняющий вопрос про плиты, вопросы «Как ?» и «Как встал». Оценок событию не даёт.</p>\n<p>Других людей в истории двое типов, и оба безымянные: те, кому «понравилось как пою» в городе, и отсутствующие — «людей можно сказать нет» на реке. Разговор по ходу рассказа прерывается на бытовое (экзамен Славы: консультация завтра, экзамен послезавтра; «В сентябре сравним рисунки»; «Ладно я кушать») — к самой истории это не относится.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "IS-0015-S03", "IS-0015--mesto-vo-vselennoy"], "h": "<p>В шапке записи вселенная проставлена как «7 островов» по дате объявления, но в самой переписке никакой связи с вселенной нет. В неясностях исходника это оговорено прямо: «Это рассказ о реальном событии из жизни Миколая, а не выдуманный сюжет; вселенной не имеет. Сохранено как связная история — авторы сами подают это как „приключение“».</p>\n<p>Место действия — реальная география: река Уда, улица Ключевская, кладбище с интернет-вышкой и бетонными плитами, гаражи, «людное место» в городе. Ни один из этих объектов не описан как монумент вселенной.</p>\n<p>Единственная зафиксированная связь — сон-фраза «Если ты дунул, держи при себе по возможности нож», приснившаяся в ту же ночь и записанная Миколаем отдельно.</p>", "r": []}, {"t": "Состояние", "a": ["S04", "IS-0015-S04", "IS-0015--sostoyanie"], "h": "<p>Рассказана целиком в чат за два дня, тремя заходами, в письменной форме отдельного текста не существует. Не переписывалась и не дорабатывалась: каждый следующий заход добавляет к предыдущему новый кусок событий, ничего не отменяя. Название «босое приключение» дано самим Миколаем в первом же сообщении (2024-06-22, id 185850), там же и вариант «набор моей обуви».</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "IS-0015-S05", "IS-0015--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Зачем понадобилось переходить Уду вплавь — не сказано; названо только намерение «пешком в тапках перейти уду и домой пойти».</li>\n<li>Догнал ли Миколай уплывшие тапки — не сказано; из третьего захода следует, что нет, но прямо это не проговорено.</li>\n<li>Порядок изготовления обуви (что сделал раньше — утеплитель, паралон или коробку от пиццы) не назван, список дан без хронологии.</li>\n<li>Что стало с самодельной обувью после возвращения домой — в переписке не сказано.</li>\n<li>Какие песни он пел в людном месте — не названо.</li>\n<li>Полное содержание сна Миколай сам не помнит: «Я не помню полное содержание»; известна только последняя фраза и то, что «там вообще другой контекст был, какое-то соревнование».</li>\n<li>С каким забором сравниваются бетонные плиты — в тексте не восстанавливается.</li>\n<li>Фото места с интернет-вышкой на кладбище прислано (id 186079), но что на нём — не описано.</li>\n<li>Использовалась ли эта история дальше как материал для вселенной — в переписке не сказано.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["IS-0015--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-06-22</td>\n<td>185850–185851</td>\n<td>w0039</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-06-23</td>\n<td>185904–185943</td>\n<td>w0039</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-06-23</td>\n<td>186056–186079</td>\n<td>w0039</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/istorii/IS-0015-bosoe-priklyuchenie.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["IS-0015--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/IS-0015.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
