<script>const BASE="";const DOCNAME="Волк";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0079-S01", "PS-0079--proishozhdenie"], "h": "<p>Волк — один из результатов эксперимента по превращению бесцветного в цветного. Слава (2024-05-25, id 173165): «Вообще в этом эксперименте только 3 удачных экземпляра / Это командир, волк, Тен( многоликий) / За все 30-50 лет».</p>\n<p>Масштаб неудач назван тут же. Миколай: «А неудачные умерли?» Слава: «Да больше миллиона умерло», «Или не в состояний двигаться» (id 173166–173168).</p>\n<p>Впервые Волк появляется в перечне персонажей, который Слава выписывает по памяти (2024-05-25, id 173128): «Энергет, прятки, закон, петля, феникс, Тен, волк, дракон, ци, имитатор, спартанец, вампир, драгоценность, бессмерт, жук, лёд, Дилан, граница, солнце».</p>", "r": []}, {"t": "Способности", "a": ["S02", "PS-0079-S02", "PS-0079--sposobnosti"], "h": "<p>Первая формулировка — «с способностю как у волка» (2024-05-25, id 173132).</p>\n<p>Миколай уточняет предположением: «Способности волка: когти, клыки, вой?» (id 173134). Слава отвечает своим набором: «Когти скорость инстинкты регенерация» (id 173135). То есть когти подтверждены, клыки и вой в ответ не вошли, добавлены скорость, инстинкты и регенерация.</p>", "r": []}, {"t": "Связи с другими", "a": ["S03", "PS-0079-S03", "PS-0079--svyazi-s-drugimi"], "h": "<ul>\n<li>Тен (<a href=\"PS-0078.html\">Тен</a>) — «Волк командир команды тена с способностю как у волка» (2024-05-25, id 173132). Волк командует командой Тена. Состав команды, кроме этих двоих, не назван.</li>\n<li>Эксперименты по превращению бесцветного в цветного — Волк один из трёх удачных экземпляров (id 173165).</li>\n</ul>", "r": [["Тен", "PS-0078.html"]]}, {"t": "Как менялся", "a": ["S04", "PS-0079-S04", "PS-0079--kak-menyalsya"], "h": "<p><strong>2024-05-25, id 173128–173136 (окно w0035).</strong> Появление в списке персонажей и расшифровка при вопросе Миколая «Кто такие»: командир команды Тена, способность «как у волка». Затем уточнение способностей через вопрос Миколая и ответ Славы: когти, скорость, инстинкты, регенерация. В этом же обмене расшифровываются соседние персонажи — Тен («Тен 10 форм»), Дракон («женщина способна превращаться в дракона частично или полностью»), Ци («владелец не контролирующий энергий использует посых для контроля»).</p>\n<p><strong>2024-05-25, id 173163–173168 (окно w0035).</strong> Добавлено: один из трёх удачных экземпляров эксперимента за 30–50 лет.</p>", "r": []}, {"t": "Отклонённые варианты", "a": ["S05", "PS-0079-S05", "PS-0079--otklonennye-varianty"], "h": "<p>Набор «когти, клыки, вой», предложенный Миколаем как догадка о волчьих способностях (id 173134), в ответе Славы не подтверждён целиком: из трёх пунктов остались только когти (id 173135).</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0079-S06", "PS-0079--probely"], "h": "<div class=\"gaps\"><ul>\n<li>В списке трёх удачных экземпляров названы «командир, волк, Тен» — при том что сам Волк описан как командир команды Тена. Одно ли это лицо («командир» и «волк») или два разных, в переписке не проговорено.</li>\n<li>Внешность не описана: превращается ли Волк физически, частично или полностью — не сказано (в отличие от Дракона, где превращение «частично или полностью» проговорено прямо).</li>\n<li>Характер не описан.</li>\n<li>Имя персонажа не названо; «Волк» — обозначение по способности.</li>\n<li>Состав команды Тена не назван.</li>\n<li>Что с Волком стало по сюжету — не сказано; сюжета на момент этих сообщений нет.</li>\n<li>Был ли Волк до эксперимента бесцветным и как в него попал — не сказано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0079--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0089.html\">Команда Тена</a>, <a href=\"GR-0090.html\">Бесцветные и Цветные</a></li>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0078.html\">Тен</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0077.html\">Командир</a>, <a href=\"PS-0078.html\">Тен</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0089.html\">Команда Тена</a>, <a href=\"GR-0090.html\">Бесцветные и Цветные</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0079--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-05-25</td>\n<td>173128–173136</td>\n<td>w0035</td>\n<td>Цветной мир (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-05-25</td>\n<td>173163–173168</td>\n<td>w0035</td>\n<td>Цветной мир (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0079-volk.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0079--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0079.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
