<script>const BASE="";const DOCNAME="Похоть";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0188-S01", "PS-0188--proishozhdenie"], "h": "<p>Один из семи грехов вселенной «Апостол». Появляется в окне w0072 при общей раскладке грехов: 2025-01-23 Слава объявляет группу — «7 грехов и божество ( помнишь его)» (id 284175) — и следующим сообщением расписывает способности по каждому греху, начиная с Похоти (id 284176).</p>\n<p>Уровень силы задан для всей группы разом: «Будет слабей главы этой организации но сильней благословенного» (2025-01-23, id 284175). Похоть стоит на этом уровне вместе с остальными грехами и Божеством (<a href=\"PS-0193.html\">Божество</a>). Что за организация и кто её глава — не названо.</p>", "r": [["Божество", "PS-0193.html"]]}, {"t": "Внешность", "a": ["S02", "PS-0188-S02", "PS-0188--vneshnost"], "h": "<p>Не описана. Единственная зафиксированная примета — эмодзи-метка в каталоге: «Похоть 😵‍💫» (2025-01-24, id 284278).</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0188-S03", "PS-0188--harakter"], "h": "<p>Не описан. Из текста прямо следует только пол: Слава говорит о персонаже в женском роде — «она может повысить какое то чувство» (2025-01-23, id 284176). Похоть — женский персонаж.</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0188-S04", "PS-0188--sposobnosti"], "h": "<p>Контроль разума с ограничением. Дословно (2025-01-23, id 284176):</p>\n<div class=\"q\"><p>«Похоть:<br>Контроль разума с ограничением. То бишь она может повысить какое то чувство или вызвать галлюцинаций или наоборот понизить какой то чувство»</p></div>\n<p>Ограничение состоит в том, что контроль работает не как прямая команда, а через чувства и восприятие. Названы три действия:</p>\n<ul>\n<li>повысить какое-то чувство;</li>\n<li>вызвать галлюцинации;</li>\n<li>понизить какое-то чувство.</li>\n</ul>\n<p>Такая же конструкция «с ограничением» стоит у Гордыни в той же раскладке: «Гордыня: Слово закон с ограничением». В чём состоит ограничение у Гордыни, там не расписано; у Похоти — расписано.</p>\n<p>В каталоге от 2025-01-24 (id 284278) способность сжата до пометки: «Похоть 😵‍💫(контроль разума)». Оговорка «с ограничением» в каталоге не повторена, но и не отменена — версия от 2025-01-23 остаётся в силе.</p>\n<p>Какие именно чувства имеются в виду (эмоции, органы чувств или и то и другое), в переписке не уточняется — сказано просто «какое то чувство».</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0188-S05", "PS-0188--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Семь грехов</strong> — Похоть входит в группу из семи. Способности соседей в той же раскладке (2025-01-23, id 284176): Чревоугодие — «ок» без пояснения; Алчность — «способности поглощений чужой манный или объектов»; Лень — телекинез, «типа лень чё то делать вот и телекинез», плюс «в придачу владений магий ветра, как никак они связаны»; Гнев — «ну ок»; Зависть (<a href=\"PS-0191.html\">Зависть (грех)</a>) — полное перевоплощение в того, кому завидуешь; Гордыня — «Слово закон с ограничением».</li>\n<li><strong>Божество (<a href=\"PS-0193.html\">Божество</a>)</strong> — того же уровня силы, объявлено с грехами одной репликой.</li>\n<li><strong>Благословенные</strong> — слабее семи грехов, значит и слабее Похоти.</li>\n</ul>", "r": [["Зависть (грех)", "PS-0191.html"], ["Божество", "PS-0193.html"]]}, {"t": "Как менялся — состояния по датам, старое не затирается", "a": ["S06", "PS-0188-S06", "PS-0188--kak-menyalsya"], "h": "<h3>2025-01-23 (id 284175–284177) — введена со способностью контроля разума</h3>\n<p>Развёрнутая формулировка: контроль разума с ограничением, работающий через повышение чувства, понижение чувства и галлюцинации.</p>\n<h3>2025-01-24 (id 284278–284279) — в сводном каталоге</h3>\n<p>Похоть попадает в каталог персонажей, где семь грехов вынесены отдельным блоком после списков «Благословенный:» и «Враг:»:</p>\n<div class=\"q\"><p>Семь грехов:<br>Гнев 😡( сила)<br>Похоть 😵‍💫(контроль разума)<br>Зависть 👹👹( полной копирование)<br>Алчность ♾(всё моей)<br>Гордыня 👑<br>Чероугодия ◼️( поглощения)<br>Лень😴( контроль территории)</p></div>\n<p>Здесь у нескольких грехов пометки изменились относительно 2025-01-23: у Лени вместо телекинеза и магии ветра стоит «контроль территории», у Алчности вместо поглощения чужой маны и объектов — «всё моей», у Гнева появляется «сила», у Чревоугодия — «поглощения», Гордыня остаётся без пометки. У Похоти пометка сохраняет прежний смысл — «контроль разума», только короче.</p>\n<p>Тем же блоком в каталоге идёт «Идей: Чёрный ящик, озеро перерождения, корень желаний». Каталог закрывается репликой «Ну да» (Слава, id 284279).</p>", "r": []}, {"t": "Пробелы — чего в переписке нет", "a": ["S07", "PS-0188-S07", "PS-0188--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Внешность не описана; есть только метка 😵‍💫.</li>\n<li>Характер не описан.</li>\n<li>Имя, происхождение, биография отсутствуют.</li>\n<li>Ограничения способности заданы только по типу воздействия. Не сказано: сколько целей одновременно, на какой дистанции, нужен ли зрительный контакт, как долго держится, есть ли сопротивление у сильных целей.</li>\n<li>Не сказано, что именно значит «чувство» — эмоция или восприятие.</li>\n<li>Не сказано, как семь грехов соотносятся с блоками «Благословенный» и «Враг» в каталоге: грехи вынесены отдельно, связь между блоками в переписке не названа.</li>\n<li>Что с персонажем стало дальше — в переписке не сказано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0188--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0002.html\">Семь грехов</a></li>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0191.html\">Зависть (грех)</a>, <a href=\"PS-0193.html\">Божество</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0191.html\">Зависть (грех)</a>, <a href=\"PS-0193.html\">Божество</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0002.html\">Семь грехов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0188--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-01-23</td>\n<td>284175–284177</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-24</td>\n<td>284278–284279</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0188-pohot.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0188--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0188.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0188-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0188/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дороже всего — <code>SP-0157</code> «Похоть (грех)»: статьи нет, ссылок ноль, вселенная «неясно», база 7 256, то есть почти вдвое больше базы самой <code>PS-0188</code> (4 054). Там декабрьский заход, и там же лежит ровно то, чего статья не находит, — что значит «чувство». Плюс несовпадение по дате: реплика, которую статья считает первой (id 284176, 2025-01-23), лежит в <code>SP-0157</code> версией 2 под id 273920 от 2024-12-24, слово в слово. Первая версия Похоти на месяц старше, чем указано, и хранится в записи без статьи и без вселенной.</p>\n<p>Тем же порядком рядом стоит весь декабрьский разбор грехов, и ни у одной записи нет статьи, у всех вселенная «неясно»: <code>SP-0156</code> (11 757), <code>SP-0158</code> (7 117), <code>SP-0160</code> (8 291), <code>SP-0161</code> (8 056), <code>SP-0162</code> (7 454). Около сорока пяти килобайт материала, на который никто не ссылается.</p>\n<p>Второе — каталоги <code>SL-0051</code> (шесть ссылок, статьи нет, 9 834) и <code>SL-0053</code> (шесть ссылок, статьи нет, 20 313): из них взята строка «Похоть 😵‍💫(контроль разума)», и в них же лежат все последующие редакции блока грехов.</p>\n<p>Третье, мелкое: <code>SP-0169</code> «Контроль разума с ограничением» — отдельная запись ровно по этой способности (статья есть, база 4 264, две ссылки), и из <code>PS-0188</code> на неё нет ни одной ссылки, хотя это тот же текст под другим типом.</p>\n<h3>С чего начать</h3>\n<p>В базе.</p>\n<p><code>SP-0157</code>, окно w0068, id 273904–273921, 2024-12-24. Версия 1 — вариант Миколая: «если одна способность, то это определённо афродизиак… либо ты создаёшь туман с веществом и оно на человека влияет. либо ты влияешь на человека»; как набор — «к афродизиака контроль серотонина(решает кто кого любит по научному), отключает стыд регулирующий соц поведение». Это прямой заход на пробел «эмоция или восприятие»: у Миколая речь про нейрохимию и про снятие социального торможения, органы чувств не при чём. Версия 2 (id 273920) — встречный вариант Славы, тот самый «контроль разума с ограничением».</p>\n<p>Дальше <code>SP-0156</code> (11 757): разбор всей семёрки как задачи, id 273906, 273920, 274462–274472. Если где-то сказано, обязана ли способность выводиться из имени греха, то там.</p>\n<p>В архив — за одним куском и точечно: 2024-12-24, окно w0068, начиная с id 273921. В базе версия обрывается на полуторачасовой паузе и слове «привет», и не видно, отвечал ли Миколай на «контроль разума с ограничением» — то есть принят вариант Славы или просто перебит паузой.</p>\n<h3>Как развивалось</h3>\n<p>2024-12-24 — заявили дважды за день: сначала афродизиак, серотонин и стыд у Миколая, через полчаса встречный контроль разума через чувства и галлюцинации у Славы. 2025-01-23 — вариант Славы выложен заново, уже не как предложение, а как решение, вместе с уровнем силы для всей группы; декабрьский вариант Миколая при переносе не упомянут. 2025-01-24 — сжали: в каталоге от трёхчастной формулировки остались два слова «контроль разума», оговорка «с ограничением» не перенесена. Возврата в этих окнах нет — последнее состояние Похоти это строка в списке.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>В том же перечне от 2025-01-23 у Зависти граница проведена явно: «полной копирование сил, магии, одежды, внешность но не характера» — сказано, что именно не берётся. У Похоти перечислено три действия — повысить чувство, понизить, вызвать галлюцинации, — и ни одного исключения; фразы «но не такое-то» нет. Для одной способности перечня исключение названо, для соседней того же устройства — нет.</p>\n<h3>Отклик</h3>\n<p>Сильное здесь — что ограничение встроено в саму формулировку, а не приделано снаружи. «Контроль разума» обычно означает кнопку «делай что скажу»; Слава сразу отрезал прямую команду и оставил регулятор чувств — вышла не власть, а подкрутка. И в декабре Миколай пришёл к тому же с другой стороны: серотонин и отключение стыда — это тот же отказ от приказа, только через биологию. Два человека независимо решили, что похоть не должна уметь командовать, и оба придумали, как влиять, не приказывая. Тем обиднее, что в каталоге от всего этого осталось «(контроль разума)» — ровно та кнопка, которую оба обходили.</p></div>", "r": []}];</script>
