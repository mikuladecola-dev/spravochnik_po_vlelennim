<script>const BASE="";const DOCNAME="Сумасшедший где-то?";
const LEAD="<h1>Сумасшедший где-то?</h1>";
const CH=[{"t": "Об этом тексте", "a": ["S01", "PR-0123-S01", "PR-0123--ob-etom-tekste"], "h": "<ul>\n<li>Дата: 2026-02-20</li>\n<li>Сообщения: 435083–435085</li>\n<li>Состояние: брошено на середине — глава 1 целиком, глава 2 обрывается на первых строках</li>\n<li>Действующие лица: Дариус Баллив, Ден, Клар, Джек, Карен; черноволосый мальчик с красными глазами; жена и дочь/сын Дена (упоминаются)</li>\n</ul>", "r": []}, {"t": "Текст", "a": ["S02", "PR-0123-S02", "PR-0123--tekst"], "h": "<p>Сумасшедший где-то?</p>\n<p>Глава 1</p>\n<p>Ранним утром. Среди обгоревших обломков домов. Стояло семь людей, у каждого из них было скрыто лицо повязками и лишь глаза были видны.</p>\n<p>Неподалеку от них, спрятанные покосившиеся домом стоял статный юноша лет 20. Это был Дариус Баллив старший сын дворянской семьи Баллив.Он без тольки сомнения двинулся в их сторону.</p>\n<p>- Ден! - крикнул Дариус, обращаясь высокому мужчине в маске.</p>\n<p>Группа отреагировала. Схватившись за оружие и наблюдая за действиями странного человека.</p>\n<p>- кто ты? - спросил Ден выйдя вперёд.</p>\n<p>&quot;Молодец&quot; Промелькнула позвала в мыслях Дариуса.</p>\n<p>-посланик Божией- ответил Дариус. Широко улыбаясь, ведь он правда был посланником Божьим, только не их Бога.</p>\n<p>- а теперь давайте на коленки- вежливо попросил их Дариус.</p>\n<p>Группа замерла. Явно не понимая, что делать.</p>\n<p>Дариус лишь шире улыбнулся и подумал &quot;Давай думай Ден, соображай и делай правильный выводы.&quot;</p>\n<p>Ден же думал и складывал пазл &quot;он вышел один и он знает моё имя. При этом так бесцеремонно командует. Возможно это блеф. Но лучше перестраховаться&quot;</p>\n<p>- Всем сесть на колени! - приказал Ден и первым сел на колени. Подавая пример своим подчинённым</p>\n<p>- молодчина Ден. Всё же не просто так стал командиром этого отряда- сказал Дариус широко улыбаясь, а Ден лишь больше убедился, что это вышестоящее.</p>\n<p>-что же скажу честно. Я здесь по двум причинам- решил честно сказать Дариус .</p>\n<p>-первая. Не могли бы вы показать, сколько успели собрать-</p>\n<p>На этой Ден лишь кивнул и порывшись в карманах. Осторожно передал Дариусу стеклянную пробирку, украшенную железными узорами.внутри этой пробирки была чёрно- красная жидкость.</p>\n<p>Дариус демонстративно потряс пробирку и подняв её повыше, начал оценивать количество этой жидкости. Пробирка была заполнена на одну треть.<br>&quot;В принципе не плохо. С такой маленькой деревни собрать такое большое количество горечи, страха и отчаяния.&quot;</p>\n<p>- Молодцы.- похвалил их Дариус, попутно похлопав по плечу Дена- С этим вы справились очень хорошо, но-</p>\n<p>Дариус отошёл от Дена и уставился на трёх членов этой группы. Ден же замер, ведь теперь не было сомнения, что он от руководства и теперь он сказал &#x27;но&#x27;</p>\n<p>- как вы могли допустить, что сбежало аж два человека- трое, что покорно сидели, вздрогнули поняв, что это претензия направлена на них.</p>\n<p>- пожалуйста извините господин но - начал говорить один из этой тройки, поняв, что молчание может быть опасным -сбежавший были лишь дети.... Так что думаю-</p>\n<p>-а разве вы должны думать- перебил его Дариус гордо подняв голову - у вас было лишь одна задача, и вы с ней не справились-</p>\n<p>- Да но это лишь дети- начал продолжать он</p>\n<p>-Конечно Клар это лишь дети - Клар вздрогнул и поднял свою голову. Уставился на Дариуса своими зелёными глазами</p>\n<p>-что? - удивлено уставился Дариус в ответ на него - имя перепутал? Ну прости, вы все в масках, вас очень сложно отличить Клар-</p>\n<p>&quot;Что-то мы ушли от темы&quot; Подумал Дариус и церемонно кашлянув в кулак.</p>\n<p>- и так Ден, так как ты командир этой группы. Ты должен их наказать- произнёс Дариус, кинув нож перед Деном. Тот лишь здрогнув и в тот же момент припал ещё ниже к земле и заговорил</p>\n<p>-Приношу свои искренние извинения господин! - крикнул он , от чего в ушах Дариуса со звенела.</p>\n<p>- Могу ли я принять наказание вместо моих подчиненых - Сказав это он припал ещё ниже к земле. От чего очень удивил сына дворянской семьи.</p>\n<p>-кхм. Кхм.. Ладно Ден раз это ты- произнёс Дариус, мило улыбаясь Дену</p>\n<p>&quot; Жаль Ден не видит мою улыбку &quot; Разочарованной подумал Дариус. Ведь это было одной из его лучших улыбок</p>\n<p>- Большое спасибо- поблагодарил Ден ударившись об землю головой. Его же подчинённые начали ерзать. Наверное обдумывая, как бы помочь командиру.</p>\n<p>-конечно Ден, что же направляемся в деревню Ликней- лицо Ден, до этого благодарная, побледнела и искажилась страхам.</p>\n<p>-з-зачем? -</p>\n<p>-как зачем? Наказать тебя -сказав это добродушно. Дариус развернулся и собирался уходить</p>\n<p>-Стойте.. Пожалуйста объясните?!! - снова крикнул ден. От чего Дариус поморщился и сказал про себя - да уж крикун-</p>\n<p>- я же сказал наказать - раздраженно повторил Дариус</p>\n<p>-но причём здесь деревня Ликней- непонимал Ден. Ну или хотел понимать.</p>\n<p>- там же проживают твоя жена и дочь?- искренне удивлëнно спросил Дариус. Ден же покрылся мурашками и больше не задавал вопросов боясь получить ответ. Дариус взглянул на него и его улыбки слегка дрогнула, но попутно замечая, как пробирка стала чуть тяжелее.</p>\n<p>-ты должен будешь убить одного члена своей семьи. Это и есть твоё наказание-</p>\n<p>- прошу прощения. Но это черезчур суровое наказание- вмешался Клар, до это молчавший</p>\n<p>-тем более это лишь дети и они не представляют опасности- подхватил другой член этой группы.</p>\n<p>- да вы абсолютно правы- быстро согласился Дариус, от чего удивил всех присутствующих.</p>\n<p>-но если бы выжили только они- проронил Дариус показывая пальцем на обгоревшие развалины.</p>\n<p>- не чуствуюте? Прожигающий взгляд, что пытается запомнить каждую деталь вашей внешности- группа удивлённо уставилась на место которое показывал Дариус. Их сердца забились сильнее ведь под грудой обгоревших досок, на них смотрели два красных глаза.</p>\n<p>- это! - прикрикнул Ден понимая, что в лёгком задания совершила две ошибки.</p>\n<p>-и теперь ты - сказал Дариус указывая пальцем на Дена.</p>\n<p>- должен выбрать, кому умирать. Этим троим, что позволили сбежать двум очевидцам и плохо проверили места преступления... -</p>\n<p>Дариус замолчал и упустил голову словно что-то вспоминал, а после ухмынувшись продолжил.</p>\n<p>-или твой жене, что начала пробовать готовить блюда севера. Ну или сынишки, что хочет стать таким же сильным, как ты. Решать тебе.- Ден же лишь уставился на нож лежавший у его ног.</p>\n<p>-взглотнув... Ладно моя семья господин. Но те трое сильнейший в нашей группе и их потери может быть..-</p>\n<p>-не тебе решать, что может быть значимой потери для нас- твёрдо отрезал Дариус.</p>\n<p>-решай быстрее иначе я просто прикизу убить и твою жену и сына- произнести уставшим голосом Дариус</p>\n<p>Ден же замер, он боялся шевельнуться. Ден прикусил губу и пытался принять решение.</p>\n<p>- командир сделайте это. Только безболезненно- проронил Клар, Дену. Но взгляд его уставился на Дариуса.  Дариус лишь махнул рукой словно соглашаясь.</p>\n<p>- командир сделайте это бесполезнено- попросил второй.</p>\n<p>Их принятия было очевидна. Не у кого из них не было семьи, кроме Дена. Да и именно Ден пригласил большинство из них суда и дал вторую жизнь. &quot;Поэтому хотя бы так оплатить командиру&quot; Интересно кому принадлежит эти мысли?</p>\n<p>Ден лишь дрожащими руками взял нож и направился в их сторону. Тройка не желая вызывать ещё большую вину опустила голова, чтобы их глаза не пересеклись, что за трогательная сцена... для убийц.</p>\n<p>Ден сделал это быстро и чисто, не дав товарищии ощутить боль. Он повернулся лицом к Дариусу. Дариус, как всегда улыбнулся и произнёс - Карен-</p>\n<p>Из слепой зоны для группы вылетели ножи. Не успев отреагировать двое из них падают за мертво. Ден же успевает среагировать, но нож всё равно попадает ему в плечо, также как и одному из его соратников.</p>\n<p>Стоявший ближе всего к Дариусу член этой группы Джек. Легко увернулся, словно ожидая подобного. Он быстрым рывком двинулся к Дариусу.</p>\n<p>Неожидавший это Дариус не успел ничего сделать, как в его сердце оказался металл, а на груде начала расплываться красное пятно портя дорогую одежду. Джек предвкушал победу, он понимал, что есть ещё враг, но самый опасный по его мнению был устранён. Но что-то было не так. Джек почуствовал, как вокруг пронзоного сердца Дариусу собралась мана виде оков и сердце Дариусу снова забилась.</p>\n<p>-Всё же Джек ты самый смышлёный из этой семёрки- спокойно произнёс Дариус- жаль только, что слабый-</p>\n<p>Не успел Джек осознать ситуацию, как его голова была перевёрнутая на 180 градусов.</p>\n<p>Дариус обтряхнулся и вынув нож из своей груди, огляделся. Ден и его соратник тоже хотевший накинуться на Дариуса замерли. Не из-за страха, а из-за того, что их мышцы горели, а нейрная система сошла с ума. Из-за этого температура их нех тел повысилась, а чувствительность обострилась &quot; Ножи отравлены, они долго не протянут. Карен должен справится, как никак тройка сильнейших в этой группе уже убита. Поэтому можно перейти к главному блюду&quot; Дариус направился к обгоревшим бревнам, откуда были видны красные глаза. Но услышал.</p>\n<p>-Да ...к-о т-ы та-ко?- прорычал Ден, чеи глаза набухли и вываливались, через обирты.</p>\n<p>- Ден я же говорил уже - Дариус улыбнулся и развернувшись к Дену распахнул руки<br>- Посланик Божьей- сказав это Дариус развернулся и продолжил своё движение.</p>\n<p>Дариус замер перед обломками и начал лихорадочно поправлять одежду и пытаться убрать стереть платком красное пятно, но быстро поняв, что это бесполезное. Решил напоследок отряхнуть пыль с плеча, он начал осторожно убирать обломки.</p>\n<p>В убежище построенными хаосам. Сидел бледный мальчик лет двенадцати, с чёрными волосами и с алой красными глазами.</p>\n<p>Дариус радостно улыбнулся и поклонившись сказал - здравствуйте юный герой-</p>\n<p>Глава 2</p>\n<p>По неровной дороге, ехала роскошная карета украшеная золотыми узорами. Внутри этой трясующий кареты сидела два человека.</p>\n<p>Черноволосый мальчик, что уставился в пол и слегка подпрыгивал из-за скачки кареты, и мужчина, что не сводил глаз с мальчика.</p>", "r": []}, {"t": "Связи — всё вместе", "a": ["PR-0123--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0084.html\">Отряд Дена (семеро в масках, сборщики)</a>, <a href=\"GR-0085.html\">Дворянская семья Баллив</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["PR-0123--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PR-0123.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
