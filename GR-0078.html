<script>const BASE="";const DOCNAME="Апостолы (Феня; список 12)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0078-S01", "GR-0078--chto-eto"], "h": "<p>Класс (он же сообщество) сильнейших носителей силы во вселенной «Феня». Разведка определила запись как группу, и это подтверждается: в переписке апостолы всё время идут во множественном числе, как множество лиц с общей природой, общим источником силы и общим самоназванием — они «братья».</p>\n<p>При этом внутри Фени апостолы существуют главным образом в двух видах:</p>\n<ol>\n<li>Как <strong>нумерованный список прозвищ</strong> — рабочий перечень позиций, который Слава выкладывает целиком (2026-01-31, id 426512). В списке 12 номеров, 10 из них с именами, две строки пустые.</li>\n<li>Как <strong>несколько высказываний о классе в целом</strong> — что они не люди, что у них есть семя, что их пугает смерть одного из них, что правительство считает их сдерживающей силой.</li>\n</ol>\n<p>Своих отдельных записей во вселенной «Феня» из позиций списка не имеет почти никто: разведаны только Защитник (<a href=\"IS-0017.html\">Защитник</a>) и безымянный апостол, ставший чудовищем (<a href=\"PS-0336.html\">Апостол, ставший чудовищем</a>). Остальные восемь названных позиций — Имитатор, Агрегат, Бессмертный выродок, Граф, Вибрация, Масочник, Звездачет, Небесная, Палач — в Фене присутствуют только как строки списка.</p>\n<p>Апостолы других вселенных («Апостол», «Оам» и прочие) заведены отдельно — <a href=\"GR-0001.html\">Апостолы (организация апостолов, «благословенные Богом»)</a> и <a href=\"GR-0056.html\">Апостолы (21 апостол; «насекомые»)</a>. Расхождение чисел 12 и 21 между периодами работы разобрано в отдельном файле <code>sluzhebnoe/APOSTOLY-DVA-PERIODA.md</code>; здесь оно не сводится.</p>\n<p>Мир, в котором апостолы действуют (<a href=\"MR-0188.html\">Мир апостолов (современный)</a>), на прямой вопрос Миколая «а че за мир» описан одним словом: «современный» (2025-12-17, id 399631–399634). Кроме апостолов в нём есть правительство, Бог красок и Серафим.</p>", "r": [["Апостолы (организация апостолов, «благословенные Богом»)", "GR-0001.html"], ["Апостолы (21 апостол; «насекомые»)", "GR-0056.html"], ["Апостол, ставший чудовищем", "PS-0336.html"], ["Мир апостолов (современный)", "MR-0188.html"], ["Защитник", "IS-0017.html"]]}, {"t": "Состав", "a": ["S02", "GR-0078-S02", "GR-0078--sostav"], "h": "<p>В справочнике по Фене за апостолами закреплены две записи:</p>\n<ul>\n<li><strong><a href=\"IS-0017.html\">Защитник</a></strong> — Защитник, «Защитник (один из апостолов)» (2025-12-17, id 399521).</li>\n<li><strong><a href=\"PS-0336.html\">Апостол, ставший чудовищем</a></strong> — безымянный апостол, ставший чудовищем (2025-12-17, id 399522).</li>\n</ul>\n<p>Кроме них — список позиций от 2026-01-31 (id 426512), выложенный Славой ровно в таком виде:</p>\n<pre><code>Апостолы:\n1.Имитатор \n2.Агрегат\n3.Защитник \n4.Бессмертный выродок\n5.Граф \n6.Вибрация \n7.Масочник \n8.Звездачет \n9.Небесная \n10. Палач\n11.\n12.\n</code></pre>\n<p>Позиции 11 и 12 — номер есть, имени нет. Ни для одной из восьми позиций, кроме Защитника, в окнах Фени не сказано ни способности, ни биографии, ни характера: это голые прозвища.</p>\n<p>Отдельно упоминается <strong>граф</strong>, которого находит умирающий апостол и на которого тот нападает (2025-12-17, id 399522). Написан со строчной буквы; совпадает ли он с «5.Граф» из списка, в переписке не сказано. По записи <a href=\"PS-0336.html\">Апостол, ставший чудовищем</a> помечено прямо: «граф, которого он атакует, в окне больше нигде не разработан».</p>", "r": [["Апостол, ставший чудовищем", "PS-0336.html"], ["Защитник", "IS-0017.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0078-S03", "GR-0078--obschie-sposobnosti-gruppy"], "h": "<p><strong>Апостолы — не люди.</strong> Формулировка Славы повторена в окне дважды: «И кто теперь будет апостолами. Типо они и так не люди» (id 399514) и «Апостолы не люди» (id 399521). Что именно они такое вместо людей, в окне не сказано.</p>\n<p><strong>Семя</strong> (<a href=\"SP-0092.html\">Семя</a>) — то, чем апостол силён. Слава вводит его сразу с оговоркой о собственном непонимании: «теряет семя ( я так и сам не до конца понял, что это за семя. Ну можешь считать это источником их силы и быстрое адаптации)» (2025-12-17, id 399522). То есть семя даёт два свойства: силу и быструю адаптацию.</p>\n<p><strong>Апостол переживает то, что человека убивает.</strong> Один из апостолов «выжен пламенем Серафима. После это конечно он выживает, но теряет семя» (id 399522). Выживание названо как само собой разумеющееся — «конечно он выживает»; смертельной оказывается не сама атака, а потеря семени.</p>\n<p><strong>Смерть апостола, скорее всего, не окончательна.</strong> Слава ставит это вопросом и сам же даёт рабочий ответ: «А что произойдет если апостол умрет. Умретли он просто или переродится чем то иным». Дальше — сюжет: апостол «умирает в домике в лесу. И становится чем-то другими. Чудовищем» (id 399522). Как общее правило для всех апостолов это в окне не утверждено — описан один случай.</p>\n<p><strong>Жизненный цикл и родитель не придуманы.</strong> «Их ней цикл жизни я не придумал» (id 399521), «А их него родителя я так и не придумал» (id 399514). В том же вечере это попадает в список дел: «Придумать жизненные цикл апостолов и придумать кто их родитель» (id 399583).</p>\n<p>Телепатии, белых глаз, регенерации и прочей механики, которая есть у апостолов других вселенных, в окнах Фени не названо.</p>", "r": [["Семя", "SP-0092.html"]]}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0078-S04", "GR-0078--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p>Позиции списка различаются прозвищами-функциями: Имитатор, Агрегат, Защитник, Бессмертный выродок, Граф, Вибрация, Масочник, Звездачет, Небесная, Палач. Что за каждым прозвищем стоит, в окнах Фени не раскрыто.</p>\n<p>Разведаны по существу двое, и различаются они прямо противоположным движением:</p>\n<p><strong>Защитник (<a href=\"IS-0017.html\">Защитник</a>)</strong> — тот, у кого человечность ещё есть и кому предстоит от неё отказаться. Слава: «Защитник (один из апостолов) должен будет отказаться от человечность ( что плачет в нём и чувствует вину, что не уберёг семью) но что произойдет когда он откажется от человечности» (2025-12-17, id 399521). Вопрос поставлен и оставлен без ответа: последствия отказа не придуманы.</p>\n<p><strong>Безымянный апостол, ставший чудовищем (<a href=\"PS-0336.html\">Апостол, ставший чудовищем</a>)</strong> — тот, кто теряет семя и перестаёт быть апостолом. Его линия целиком: выжжен пламенем Серафима, выживает, теряет семя, уходит от своих, умирает в домике в лесу, становится чудовищем, нападает на нашедшего его графа и пытается его сожрать (id 399522). Миколай уточняет форму подачи: «то есть сразу в сюжете будет монстром» (id 399545) — то есть в сюжет он входит уже чудовищем, а не апостолом.</p>\n<p>Выбор этого апостола объяснён механикой работы, а не сюжетом: «Как бы их 21 один и я не всех придумал. И вот из этих какого я не придумал будет моей маленькой жертвой» (id 399540). То есть жертвой назначен один из ненаписанных.</p>\n<p><strong>Масочник</strong> — единственная позиция списка, рядом с которой в окне Фени идёт разработка предмета и способности, но связь при этом не проговорена. В w0115 Слава ставит задачу: «Есть маска. Чёрная маска с оранжевыми узорами. Без отверстие», нужна способность «Не атакующая», «чтобы перс с этой маской смог проникнуть в защищённая места. И убить группу вооружённых людей. При этом защищая мирных людей. При этом у этого персонажа нет сверх силы» (2026-01-25, id 423805–423808). Дальше: «Будет шесть масок, с разными цветами и узорами» (2026-01-27, id 424732). Решение Слава формулирует сам: «Ну я как бы уже придумал. Люди просто тяжело его заметить в этой маске. А в толпе они инстикттвно будут считать его своим» (2026-01-30, id 426075). Миколай сравнивает: «типа как супермена в очках?» — «Ну типа» (id 426081, 426086) и предлагает раскладку цветов: «го 3 с белым 3 с черным и плюсуем: фиолетовый, оранжевый, зелёный, красный, синий, серый» (id 426076). Что носитель маски — это Масочник из списка апостолов, в переписке не сказано; имени носителя тоже нет.</p>", "r": [["Апостол, ставший чудовищем", "PS-0336.html"], ["Защитник", "IS-0017.html"]]}, {"t": "Иерархия", "a": ["S05", "GR-0078-S05", "GR-0078--ierarhiya"], "h": "<p>Внутренней иерархии в окнах Фени не названо: ни главы, ни рангов, ни ролей. Единственное, что сказано про устройство отношений внутри группы, — самоназвание: апостол «уходит от Апостолов ( точнее сбегает не желая чтобы его братья видели, как он умирает.)» (2025-12-17, id 399522). То есть друг другу они братья, и умирающий уходит именно для того, чтобы братья не видели.</p>\n<p>Порядок номеров в списке (1.Имитатор … 10.Палач) как ранг нигде не оговорён — это порядок записи.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S06", "GR-0078-S06", "GR-0078--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>Правительство.</strong> Заведён отдельный персонаж (<a href=\"PS-0341.html\">Представитель правительства без способностей</a>) — «челик без способностей, что будет его представителем. И будет пытаться помогать апостолом, считая их сдерживающий силой» (2025-12-17, id 399612). Помощь идёт по расчёту: апостолы для него — сдерживающая сила. Имени у представителя нет.</p>\n<p><strong>Серафим.</strong> Именно его пламенем выжжен апостол, ставший чудовищем (id 399522). Про самого Серафима в окне: «у Серафима уже понятно цель. Перезапустите человечества» (id 399530). Слава при этом ещё не решил, кем Серафим будет: «И какую теперь роль будет играть Серафим?», «Может ли Серафим стать главным злодеем» (id 399513, 399515).</p>\n<p><strong>Бог красок и Пастыри.</strong> В том же окне заводится Бог красок с четырьмя главными последователями: «К Богу красок я хотел подставить 4 главных последователя ( как их назвать?) Они будут одарены его благословением и будут чудовищна сильные» (id 399534). Имена даёт Миколай — «триколор радуга градиент монохром» (id 399541), общее название предлагает Слава: «Пастери» (id 399587), Миколай подхватывает: «ну го пастыри» (id 399598). Отношений между апостолами и Пастырями в переписке не названо — они просто соседи по миру и по вечеру разработки. Слава считает злодеев: «Ну это уже интересно 3 злодея. Двое из которых это иной уровень сил» (id 399533).</p>\n<p><strong>Граф.</strong> Апостол-чудовище нападает на графа и пытается его сожрать (id 399522). Больше об этом графе ничего.</p>\n<p>Отношений с какими-либо организациями (АЗИП и т. п.) в окнах Фени нет.</p>", "r": [["Представитель правительства без способностей", "PS-0341.html"]]}, {"t": "Как менялась — по датам", "a": ["S07", "GR-0078-S07", "GR-0078--kak-menyalas"], "h": "<p><strong>2025-12-17, вечер (id 399512–399562).</strong> Слава переносит апостолов в новый мир и первым делом фиксирует пробелы, а не свойства: кто такие апостолы теперь, кто их родитель, каков жизненный цикл. Числом на этот момент остаётся 21: «Как бы их 21 один и я не всех придумал» (id 399540). Миколай спрашивает прямо: «и кстати почему их 21?» (id 399546). Ответ Славы: «Не знаю. Все же хоть как-то его прописать надо же», «Я хуй знает» (id 399547–399548). Тогда же вводятся семя, смерть апостола с перерождением в чудовище, задача Защитника отказаться от человечности.</p>\n<p><strong>2025-12-17, там же (id 399552–399560).</strong> Число урезано с 21 до 12. Предложение — Миколая: «мб урезать?», «12 как по базе?». Слава переспрашивает: «Какая база», «Ты просто перевернул число». Миколай объясняет: «ну было ж 12 апостолов у бога». Слава соглашается и называет причину: «Ну давай. А то мне в падлу придумывать всех 21». Сразу за этим идёт неоконченный обмен числами — «если че бог любит все че на 3 делится и чем меньше частное тем больше нравится» (М, id 399562), «Три», «Не сука», «4 мне нравится больше», «Все четыре» (С), «12», «там частное 4», «лан», «как хочешь» (М). К чему относится этот счёт — к апостолам или к четвёрке последователей Бога красок, которую обсуждают рядом, — из текста не следует; итог не зафиксирован.</p>\n<p><strong>2025-12-17, позже (id 399583, 399603–399642).</strong> Апостолы попадают в план дальнейшей работы («Придумать жизненные цикл апостолов и придумать кто их родитель»). Заводится линия правительства с представителем-союзником. Мир объявлен современным.</p>\n<p><strong>2026-01-25 — 2026-01-30 (id 423805–426089).</strong> Разрабатывается маска и её способность (см. раздел о различиях). Апостолы в этих сообщениях по имени не названы.</p>\n<p><strong>2026-01-31 (id 426512).</strong> Впервые выложен поимённый список: 12 номеров, 10 заполнено, строки 11 и 12 пустые.</p>\n<p><strong>2026-01-31, через два с лишним часа (id 426535–426563).</strong> Попытка добить пустые позиции. Миколай кидает два слова: «липкий иссушающий». Слава переспрашивает: «Че за липкий» (id 426554). Через полтора часа Миколай отвечает: «хм», «придумаю позже», «пока как заполнение» (id 426561–426563). На этом разговор глохнет. Как утверждённые имена позиций 11 и 12 эти слова не приняты.</p>\n<p><em>Сноска о более позднем состоянии списка.</em> Тот же список пересобран 2026-02-09 (id 430400): позиция 7 (Масочник) опустела, а 11 и 12 заполнены — «Кура» и «Избранный». Это окно (w0116) объявлено под другой вселенной («7 островов»), к Фене авторами не отнесено; приводится, чтобы состояние списка не выглядело окончательным.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "GR-0078-S08", "GR-0078--probely"], "h": "<div class=\"gaps\"><ul>\n<li><strong>Родитель апостолов не придуман.</strong> «А их него родителя я так и не придумал» (id 399514).</li>\n<li><strong>Жизненный цикл не придуман.</strong> «Их ней цикл жизни я не придумал» (id 399521).</li>\n<li><strong>Кто такие апостолы, если не люди, — не сказано.</strong> Заявлено только отрицание: «они и так не люди», «Апостолы не люди».</li>\n<li><strong>Природа семени не определена самим автором.</strong> «я так и сам не до конца понял, что это за семя» (id 399522).</li>\n<li><strong>Число не сведено.</strong> В окне звучит и 21 (id 399540), и 12 (id 399552–399560). Почему 21 — «Я хуй знает» (id 399548). Отдельно разобрано в <code>sluzhebnoe/APOSTOLY-DVA-PERIODA.md</code>.</li>\n<li><strong>Позиции 11 и 12 списка пусты.</strong> «липкий» и «иссушающий» помечены самим предложившим как «пока как заполнение».</li>\n<li><strong>Восемь из десяти названных позиций — только прозвища.</strong> Ни способностей, ни характеров, ни биографий в окнах Фени нет; своих записей по Фене у них тоже нет.</li>\n<li><strong>Последствия отказа Защитника от человечности не придуманы.</strong> Вопрос поставлен Славой и оставлен: «но что произойдет когда он откажется от человечности» (id 399521).</li>\n<li><strong>Апостол, ставший чудовищем, безымянен.</strong></li>\n<li><strong>Иерархии нет.</strong> Ни главы, ни рангов; известно только, что они зовут друг друга братьями.</li>\n<li><strong>Носитель маски не назван по имени, и его связь с Масочником из списка прямо не проговорена.</strong></li>\n<li><strong>Граф из сцены с чудовищем и «5.Граф» из списка авторами не отождествлены.</strong></li>\n<li><strong>Отношения апостолов с Пастырями и с Богом красок не названы.</strong></li>\n<li><strong>Название вселенной в окне так и не прозвучало</strong> (помечено по <a href=\"MR-0188.html\">Мир апостолов (современный)</a>).</li>\n</ul></div>", "r": [["Мир апостолов (современный)", "MR-0188.html"]]}, {"t": "Связи — всё вместе", "a": ["GR-0078--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0336.html\">Апостол, ставший чудовищем</a>, <a href=\"PS-0341.html\">Представитель правительства без способностей</a></li>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0092.html\">Семя</a></li>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0188.html\">Мир апостолов (современный)</a></li>\n<li><strong>Упоминает группы:</strong> <a href=\"GR-0001.html\">Апостолы (организация апостолов, «благословенные Богом»)</a>, <a href=\"GR-0056.html\">Апостолы (21 апостол; «насекомые»)</a></li>\n<li><strong>Упоминает истории:</strong> <a href=\"IS-0017.html\">Защитник</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0078--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0078.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0078-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0078/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дыра номер один здесь та же, что во всём массиве апостолов: нет статьи о «Списке 12 апостолов» (<code>SL-0054</code>) — 234 КБ базы, семь входящих ссылок, четыре вселенные («7 островов», «Апостол», «Оам», «Феня»). Эта статья целиком построена вокруг одного состояния списка от 2026-01-31 и вынуждена сама держать сноску про другое состояние от 2026-02-09, потому что держать его больше негде. Пока <code>SL-0054</code> не написан, каждая пересборка списка расходится по нескольким статьям сразу.</p>\n<p>Вторая дыра специфична именно для Фени: почти все имена из списка уже разработаны — но по другим вселенным, и с Феней не связаны ничем. Палач (<code>PS-0171</code>) — восемь ссылок, 39 КБ, вселенные «7 островов», «Апостол», «Оам». Имитатор (<code>PS-0383</code>) — пять ссылок, 137 КБ. Агрегат (<code>PS-0182</code>) — шесть ссылок, 13,8 КБ. Бессмертный выродок (<code>PS-0184</code>) — четыре ссылки, 10,7 КБ. Граф (<code>PS-0323</code>) — четыре ссылки, 7,9 КБ. Масочник (<code>PS-0195</code>) — три ссылки, 6 КБ. Ни одна из этих записей не числится по Фене. То есть статья честно пишет «это голые прозвища», а на деле за шестью из десяти прозвищ стоит по десять-сто килобайт материала под другими вселенными. Это дороже всего остального: шесть точек, где связь не проведена и где ссылки уже висят.</p>\n<p>Третье — те, за кем действительно ничего нет. Вибрация (<code>SP-0278</code>): статьи нет, ноль ссылок, 8,3 КБ базы, вселенная проставлена «неясно». Звездочёт (<code>PS-0298</code>): статьи нет, ноль ссылок, 1,9 КБ, тоже «неясно». Небесной в базе не нашлось вовсе.</p>\n<h3>С чего начать</h3>\n<p>По шести именам — только база, архив не нужен. Идти по <code>PS-0171</code>, <code>PS-0383</code>, <code>PS-0182</code>, <code>PS-0184</code>, <code>PS-0323</code>, <code>PS-0195</code> и решать по каждому один вопрос: это тот же персонаж, попавший в феневский список, или совпадение прозвища. Для Графа этот вопрос статья уже ставит сама (граф из сцены с чудовищем против «5.Граф» из списка) — но <code>PS-0323</code> при этом стоит по «Оам», и его в паре даже не рассматривают.</p>\n<p>По Вибрации и Звездочёту материал в базе есть, но вселенная у обоих «неясно» — её придётся решать вручную, автоматика их к Фене не притянет.</p>\n<p>В архив — за двумя вещами. Первое: Небесная. В базе её нет ни под каким видом, значит идти в окно 2026-01-31 вокруг id 426512 и смотреть, не сказано ли о ней хоть что-то рядом со списком. Второе: пересборка от 2026-02-09, id 430400, где позиция 7 пустеет, а 11 и 12 становятся «Кура» и «Избранный». Окно объявлено под «7 островами», и на этом основании к Фене не отнесено — но именно там список меняется, и стоит проверить, к чему относится «Избранный» (в базе под этим словом уже есть <code>PS-0106</code>, «Защитник Асгарда (Избранный)», пять ссылок, 16,7 КБ, «7 островов»). Отождествлять на глаз нельзя, но проверить надо — иначе состояние списка так и останется двумя несведёнными версиями.</p>\n<h3>Как развивалось</h3>\n<p>2025-12-17 вечером апостолов перенесли в новый мир, и первым делом были зафиксированы не свойства, а дыры: кто они теперь, кто их родитель, каков жизненный цикл. Тем же вечером ввели семя, смерть с перерождением в чудовище и задачу Защитника отказаться от человечности. Через несколько сообщений — сокращение: 21 урезали до 12, причина названа вслух и она производственная («А то мне в падлу придумывать всех 21»), а обоснование подтянуто задним числом («ну было ж 12 апостолов у бога»).</p>\n<p>Потом полтора месяца не про них: 2026-01-25 — 2026-01-30 разрабатывается маска и её способность, апостолы в этих сообщениях по имени не названы ни разу.</p>\n<p>2026-01-31 вернулись — сразу списком, 10 позиций из 12. Через два с лишним часа попытка добить пустые строки: два слова, переспрос, полтора часа тишины и «пока как заполнение». На этом обрыв. 2026-02-09 список пересобран уже под другой вселенной.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Способов перестать быть апостолом в окне названо два, и оба поставлены как вопрос самим автором. Первый — потеря семени: описан до конца, есть цепочка (выжжен пламенем, выживает, теряет семя, уходит, умирает, становится чудовищем, нападает на графа). Второй — отказ от человечности: поставлен ровно в той же форме, «но что произойдет когда он откажется от человечности», и оставлен без ответа. Для первого пути исход прописан по шагам, для второго, того же рода, — нет вообще ничего. При этом второй путь висит на разведанном персонаже, у которого своя запись, а первый — на безымянном.</p>\n<h3>Отклик</h3>\n<p>Зацепила одна фраза: апостол «уходит от Апостолов ( точнее сбегает не желая чтобы его братья видели, как он умирает.)». Про группу из двенадцати прозвищ она говорит больше, чем весь список: у них есть слово «братья», и есть стыд умирать при них. Это единственное место, где апостолы перестают быть строчками с номерами. И рядом — вторая честная вещь, уже про работу, а не про мир: жертвой назначен тот, кого не успели придумать («из этих какого я не придумал будет моей маленькой жертвой»). Производственный дефицит превращён в сюжетный ход, причём без попытки это спрятать. Дальше, впрочем, всё уходит в перечисление, и попытка добить позиции 11 и 12 двумя случайными словами с пометкой «пока как заполнение» — самое честное описание состояния этой группы на сегодня.</p></div>", "r": []}];</script>
