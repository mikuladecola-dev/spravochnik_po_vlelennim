<script>const BASE="";const DOCNAME="Дурак";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0028-S01", "PS-0028--proishozhdenie"], "h": "<p>Не единичный персонаж, а фигура антагониста, придуманная Миколаем 2024-01-30 (окно w0023, id 101953–101997). В переписке проходит как «Дурак», «дураки», «тупой враг», «Дурак как собирательный образ пороков».</p>\n<p>Появился как ответ на затруднение Славы. Разговор начался с реплик Миколая о человеке: «Человек» — «Самый красивый и опасный монстр» (id 101953–101954). Слава ответил, что сделать человека врагом ему тяжело (id 101955): «только это будет сложно человек все же не тупой там должна быть коррупция власть контроль и другая хуйня которая мне даётся не легко».</p>\n<p>Миколай зашёл с поговорки: «Лучше умный враг, чем тупой друг» (id 101957–101958) — и предложил перевернуть задачу: «Может ты не будешь заморачивать. А сделаешь кого-то тупого. Настолько тупого. Что будет творить хуйню» (id 101959–101962).</p>", "r": []}, {"t": "Характер", "a": ["S02", "PS-0028-S02", "PS-0028--harakter"], "h": "<p>Стержень фигуры — тупость, которая работает как сила, а не как слабость. Формулировки Миколая (id 101963–101969):</p>\n<ul>\n<li>«От гения до безумца один шаг»</li>\n<li>«Может его тупость будет чем то гениальна»</li>\n<li>«Или он будет как собирательный образ всех пороков человечества»</li>\n<li>«Бессовестный предатель»</li>\n<li>«Которому скучно жить»</li>\n<li>«В голове он гениален»</li>\n<li>«Со стороны дебил»</li>\n</ul>\n<p>Мотив действия — скука и развлечение, а не выгода и не идея. Дураки ломают чужую работу «Чтобы тупо повеселиться» (id 101980).</p>\n<p>Отношение к жизни: «Им не важна жизнь. Ни своя ни чужая» (id 101982–101983).</p>\n<p>Непредсказуемость названа отдельным свойством: «А из действий еще не предсказать. Кто знаешь что на уме у дураков» (id 101994–101995).</p>\n<p>При этом на полное расчеловечивание фигуры Миколай не пошёл, оговорив в самом конце: «Ну опять таки. Что-то человеческое должно быть» (id 101996–101997). Что именно должно остаться человеческого, не уточнено.</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0028-S03", "PS-0028--sposobnosti"], "h": "<p>Привязка к механике мира сделана в третьем заходе (id 101993): «пускай у них изначально будет гармония с энергией и они будут сеить страх». То есть гармония с энергией дана дуракам как исходное состояние, не как достижение.</p>\n<p>Никаких других способностей не названо.</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0028-S04", "PS-0028--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Мир с поглощением энергии</strong> — мир, для которого фигура придумывалась; гармония с энергией даётся дуракам оттуда.</li>\n<li><strong>Поглощение энергии и связь</strong> — механика, к которой дураки привязаны через «гармонию с энергией».</li>\n<li><strong>Энтропия как замысел вселенной</strong> — сущность, с которой Дурак связан в базе.</li>\n<li><strong>«Ответственные и идейные личности»</strong> — противопоставленная сторона: дураки существуют как то, что ломает их планы (id 101979).</li>\n<li><strong>Тот, кто их объединит</strong> — фигура, названная, но не раскрытая: «А потом может их объединит кто-то» (id 101975). Кто это, не сказано.</li>\n</ul>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S05", "PS-0028-S05", "PS-0028--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2024-01-30, 13:45–13:50 (id 101953–101969).</strong> Первая форма — один антагонист. Вместо умного врага предлагается «настолько тупого, что будет творить хуйню». Тезисы: «от гения до безумца один шаг», «может его тупость будет чем то гениальна». Дальше фигура сразу расширяется до «собирательного образа всех пороков человечества»: бессовестный предатель, которому скучно жить, «в голове он гениален, со стороны дебил».</p>\n<p><strong>Версия 2 — 2024-01-30, 13:50–13:52 (id 101970–101983).</strong> Расширение с одного врага до общества. Слава возразил: «Но у меня же не будет чисто один тупой враг» (id 101970). Ответ Миколая (id 101972–101974): «Общество. Можно в каждом заселить пороки. И сказать что везде такие есть». Затем — объединение: «А потом может их объединит кто-то» (id 101975).</p>\n<p>Здесь же перевёрнута ещё одна поговорка (id 101976–101978): «И 2 головы хорошо, 3 лучше. Но с дураками это работает в плохом смысле. Они все испортят» — а именно «Все планы ответственных и идейных личностей. Чтобы тупо повеселиться».</p>\n<p><strong>Версия 3 — 2024-01-30, 14:23–14:24 (id 101993–101997).</strong> Привязка к механике мира: изначальная гармония с энергией, сеют страх, непредсказуемы. Замыкается оговоркой «Что-то человеческое должно быть».</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0028-S06", "PS-0028--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Ни у одного дурака нет имени; отдельного персонажа из фигуры не выделено.</li>\n<li>Вселенная в самой переписке не названа; отнесение к «Падениям небес» дано по дате объявления.</li>\n<li>Реакции Славы на версии 2 и 3, кроме возражения «Но у меня же не будет чисто один тупой враг», в переписке нет. Принял он предложение или нет — не сказано.</li>\n<li>Кто объединяет дураков — не названо. «Может их объединит кто-то» осталось нераскрытым.</li>\n<li>Что значит «гармония с энергией» применительно к дуракам и почему она у них изначальная, не объяснено.</li>\n<li>Что именно должно остаться в них человеческого — не уточнено.</li>\n<li>Как «собирательный образ всех пороков человечества» соотносится с обществом, где «в каждом заселить пороки», — одна ли это фигура и её среда или два разных решения, в переписке не разведено.</li>\n<li>Исходное затруднение Славы — «там должна быть коррупция власть контроль» — так и не разобрано: разговор ушёл в сторону тупости вместо этого, но нигде не сказано, что коррупция и власть из замысла убраны.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0028--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0009.html\">Падения небес</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0028--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-01-30</td>\n<td>101953–101969</td>\n<td>w0023</td>\n<td>Падения небес (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-01-30</td>\n<td>101970–101983</td>\n<td>w0023</td>\n<td>Падения небес (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-01-30</td>\n<td>101993–101997</td>\n<td>w0023</td>\n<td>Падения небес (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0028-durak.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0028--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0028.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
