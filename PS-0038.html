<script>const BASE="";const DOCNAME="Ояш Бичевский";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0038-S01", "PS-0038--proishozhdenie"], "h": "<p>Персонаж вселенной «игра бога», карточку составил Миколай (2024-04-02, id 153326, окно w0029). Появляется одним сообщением, сразу готовой карточкой; предыстории персонажа внутри мира в переписке нет.</p>\n<p>Имя записано с ударением — «Ояш Би́чевский»; встречается и написание без знака ударения — «Ояш Бичевский».</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0038-S02", "PS-0038--vneshnost"], "h": "<p>Пожилой мужчина, 54 года. Других черт внешности в карточке нет.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0038-S03", "PS-0038--harakter"], "h": "<p>«Обычный тихий, пожилой 54 года, общительный». То есть одновременно тихий и общительный — обе черты названы в одной строке. Больше о характере ничего не сказано.</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0038-S04", "PS-0038--sposobnosti"], "h": "<p>Способность обратной силы удара. Формулировка Миколая дословно: «Чем слабее удар, тем больше урона, вреда тому что/кого он ударил».</p>\n<p>Существенное в формулировке:</p>\n<ul>\n<li>Зависимость обратная: слабый удар даёт больше урона, чем сильный.</li>\n<li>Действие направлено на цель удара — «тому что/кого он ударил», то есть работает не только по людям, но и по предметам («что»).</li>\n<li>Урон и вред названы отдельно («урона, вреда») — разграничение в переписке не пояснялось.</li>\n</ul>\n<p>Нижнего и верхнего предела не названо: не сказано, что происходит при максимально слабом прикосновении и работает ли способность при ударе в полную силу. Цены за применение не указано.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S05", "PS-0038-S05", "PS-0038--kak-menyalsya"], "h": "<ul>\n<li><strong>2024-04-02 (id 153326, окно w0029)</strong> — единственное состояние. Полная карточка: имя, возраст 54, «обычный тихий», «общительный», способность обратной силы удара. Переработок и отклонённых вариантов в переписке нет.</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0038-S06", "PS-0038--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Происхождение персонажа и его место в сюжете не описаны.</li>\n<li>Связи с другими персонажами не названы.</li>\n<li>Дальнейшая судьба персонажа в переписке не появляется.</li>\n<li>Нижняя и верхняя граница действия способности не определены, как и разница между «уроном» и «вредом».</li>\n<li>Не сказано, действует ли способность только на удары рукой или на любое приложенное усилие, и распространяется ли она на оружие.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0038--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0049.html\">Команда Миколая (10 персонажей игры бога)</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0049.html\">Команда Миколая (10 персонажей игры бога)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0014.html\">игра бога</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0038--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-04-02</td>\n<td>153326–153326</td>\n<td>w0029</td>\n<td>игра бога (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0038-oyash-bichevskiy.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0038--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0038.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
