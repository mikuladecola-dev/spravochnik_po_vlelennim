<script>const BASE="";const DOCNAME="Аскизы";
const LEAD="<p>Аскизы — раса вечных детей с чертами аксолотля, один из видов мутантов вселенной Оам. Разрабатывались с 2025-10-20 по 2025-12-06 (id 376399–393467), автор описаний — Слава. Второе встречающееся название — «Матка Аскизов».</p>";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0300-S01", "PS-0300--proishozhdenie"], "h": "<p>Аскизы отнесены к мутантам — той категории, которую автор в том же сообщении определяет так: «Также есть мутанты это животное и люди, у которых под воздействием Оам изменилось их физиология» (2025-10-20, id 376401).</p>\n<p>Исходная точка расы — одно животное. «Маток Аскизы была просто Аксолотлой. Но после в водоём, где она жила упал метеорит и под огромным воздействием Оам она мутировала и начала производить Оам» (2025-10-20, id 376401).</p>\n<p>Это встраивается в общую историю мира, изложенную в том же сообщении: когда-то на землю приземлились метеориты, из небесных тел вылетели неизвестные частицы, которые позже назвали Оам; на местах приземления метеоритов «окружающая среда и жирность мутировали под активным воздействием Оам», а водоёмы там стали насыщены Оам. Водоём аксолотля — один из таких мест падения.</p>\n<p>Способ появления самих аскизов описан через матку: «Матка, что выделяет их из яиц подобное муравьиной матки» (2025-10-20, id 376401). При этом в том же сообщении, строкой выше, автор пишет: «Как они рождаются я ещё не придумал». Оба утверждения стоят рядом и не сведены между собой — как именно яйца соотносятся с непридуманным механизмом рождения, в переписке не сказано.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0300-S02", "PS-0300--vneshnost"], "h": "<p>«Навечно Дети лет 7-10 на вид с белоснежной кожей,с розовыми оттенками ( или другими оттенками) и с чертами аксолотлы» (2025-10-20, id 376401). Оттенок кожи оставлен незакреплённым — розовый назван основным вариантом, но со скобкой «или другими оттенками».</p>\n<p>Матка описана отдельно и выглядит иначе, чем её дети: «Матка большая ростом 4 местра и в ширину такая же. Она больше похожая на червя с огромными количествами лапок. Но с такой же белоснежное кожей» (2025-10-20, id 376401). То есть от детей ей досталась только белоснежная кожа; форма — червеобразная, с большим числом лапок, размер 4 метра в высоту и столько же в ширину.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0300-S03", "PS-0300--harakter"], "h": "<p>Собственного характера у отдельных аскизов в переписке не описано — вместо этого заданы два свойства расы целиком.</p>\n<p>Первое — вечная детскость сознания: «И разумом они всегда как дети» (2025-10-20, id 376401). Второе — приоритет голода над мышлением: «У них инстинкт голода выше разума» (2025-10-20, id 376401). Аппетит назван «зверским», и он реализуется прямо на людях: «Они могут съесть человека целиком за пару минут».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0300-S04", "PS-0300--sposobnosti"], "h": "<p>Перечислены в первом же описании (2025-10-20, id 376401) и дальше не менялись:</p>\n<ul>\n<li>не стареют («И вот эти дети не стареют»);</li>\n<li>быстрая регенерация;</li>\n<li>зверский аппетит, позволяющий съесть человека целиком за пару минут;</li>\n<li>не чувствуют боли.</li>\n</ul>\n<p>Отдельно у матки: она «начала производить Оам» — то есть является источником Оам, а не только его носителем. Это единственное упомянутое активное свойство матки помимо откладывания яиц.</p>\n<p>Работа аскизов с Оам как со способностью (поглощение, ёмкость, обуздание) отдельно не разбиралась. В общем описании механики Оам из того же сообщения сказано, что у животных обуздание Оам «происходит более инстинктивно», поэтому «шанс выживаемости у них больше чем у людей. Но они не могут раскрыть весь потенциал», — но напрямую к аскизам автор это правило не применял.</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0300-S05", "PS-0300--svyazi-s-drugimi"], "h": "<p>Аскизы описаны в одном перечне мутантов вместе с Апостолами, Детьми мирового древа, Азуриэлем, Поротаями и Вампирами (2025-10-20, id 376401). Никакого взаимодействия между ними в этом месте не задано — это список видов, а не отношений.</p>\n<p>В более позднем расписании сил (2025-11-17, id 385768; повторено 2025-12-06, id 393287) Аскизы стоят в блоке, который автор открывает словами: «Ну и дальше расы и организации который равны по силе с друг другом». Над этим блоком — Коты (девять, сильнейшие) и Апостолы («21 вторая по силе раса на земле»). Таким образом, Аскизы отнесены к третьему уровню — к тем, кто равен между собой по силе. В том же блоке перечислены Дети мирового древа, Поротаи, Азуриэли, группировка сестры, правительская организация, Церковь с паладинами, организация Виктора, Пернатые, орден для убийства котов и Вампиры.</p>\n<p>Религиозная связь появляется там же: «Аскизы. Матка Аскизов стало предметом веры для какой-то верологий» (2025-11-17, id 385768). Позже уточнено: «Матка. Находиться в церкви. И люди им поклоняются, а детей маток считают святыми» (2025-12-06, id 393465). Какая именно церковь и какая вера — не названо; «какой-то верологий» так и осталось неопределённым. Связь с Церковью с паладинами, которая перечислена в том же списке сил, в переписке не проговорена.</p>\n<p>Обратим внимание на формулировку последнего уточнения: там сказано «детей маток» во множественном числе, тогда как всё раннее описание говорит об одной матке — той самой мутировавшей аксолотли. Сколько маток у расы, в переписке не сказано.</p>\n<p>Раса входит в состав вселенной Оам.</p>", "r": []}, {"t": "Как менялся", "a": ["S06", "PS-0300-S06", "PS-0300--kak-menyalsya"], "h": "<p><strong>2025-10-20 (id 376399–376403, окно w0107).</strong> Полное первое описание: происхождение от аксолотли, в чей водоём упал метеорит; внешность вечных детей 7–10 лет; неcтарение, регенерация, зверский аппетит, нечувствительность к боли, вечно детский разум, инстинкт голода выше разума; матка-червь 4 метра, откладывающая яйца подобно муравьиной; прямое указание «Как они рождаются я ещё не придумал».</p>\n<p><strong>2025-11-05 (id 382108, окно w0108).</strong> Описание повторено дословно, без единого изменения — тот же текст об аксолотле, метеорите, вечных детях и матке. Новых деталей нет.</p>\n<p><strong>2025-11-17 (id 385768–385769, окно w0109).</strong> Раса помещена в общую иерархию сил мира — в блок равных по силе рас и организаций. Добавлено единственное новое: «Матка Аскизов стало предметом веры для какой-то верологий». Тут же отдельным сообщением зафиксирован пробел: «Ну и Аскизы. Я не знаю где они живут» (id 385769).</p>\n<p><strong>2025-12-06 (id 393286–393290, окно w0112).</strong> Список сил повторён дословно, включая строку про матку как предмет веры и отдельную реплику «Ну и Аскизы. Я не знаю где они живут» (id 393288). Новых сведений об аскизах нет.</p>\n<p><strong>2025-12-06, вечер (id 393464–393467, окно w0112).</strong> Религиозный мотив уточнён: матка находится в церкви, люди ей поклоняются, детей маток считают святыми (id 393465). Это последнее состояние.</p>\n<p>Ни одно из ранних свойств за все пять версий не отменялось и не переписывалось — материал только добавлялся.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0300-S07", "PS-0300--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Как рождаются аскизы — прямо оставлено непридуманным: «Как они рождаются я ещё не придумал» (2025-10-20, id 376401). Пометка повторяется в разборах версий w0107 и w0108.</li>\n<li>Где живут аскизы — не придумано: «Ну и Аскизы. Я не знаю где они живут» (2025-11-17, id 385769; повторено 2025-12-06, id 393288).</li>\n<li>Какая именно религия почитает матку — не названо, автор написал «какой-то верологий». Название церкви, в которой находится матка, тоже не дано.</li>\n<li>Отношение аскизов к другим расам и организациям не описано: они помещены в список равных по силе, но ни союзов, ни конфликтов не названо.</li>\n<li>Отдельные персонажи-аскизы не выделены — раса нигде не сведена к конкретному существу, кроме матки.</li>\n<li>Сколько маток существует, в переписке не сказано: раннее описание говорит об одной, позднее уточнение — о «детях маток».</li>\n<li>Как аскизы обращаются с Оам (кроме того, что матка его производит), не разобрано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0300--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0066.html\">Аскизы</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0008.html\">Оам</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0300--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-10-20</td>\n<td>376399–376403</td>\n<td>w0107</td>\n<td>Оам (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-11-05</td>\n<td>382108–382108</td>\n<td>w0108</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-11-17</td>\n<td>385768–385769</td>\n<td>w0109</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-06</td>\n<td>393286–393290</td>\n<td>w0112</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-06</td>\n<td>393464–393467</td>\n<td>w0112</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0300-askizy.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0300--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0300.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
