<script>const BASE="";const DOCNAME="Обратные";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0176-S01", "MR-0176--ustroystvo"], "h": "<p>Мир построен по мотивам сна Славы, пересказанного 2025-11-18 (id 386292–386296). Слава описывает его так: «Мне приснился сон и по его основам я пытаюсь создать маленькую вселенную что заброшу потом».</p>\n<p>Ключевое ощущение, заявленное как ядро настроения мира, — клаустрофобия на открытой местности: «Вообще в этом сне я испытал чувство клаустрофобии. Хотя и был в открытой местности. Словно меня всё завели в тупик, окружили и шанс выбраться нету (хотя я знал что как минимум я буду жить, то есть убивать меня никто не собирался...)». Дальше в этом же окне переписки клаустрофобия отдельно не разрабатывается.</p>\n<p>В мире фигурируют: море или океан, по которому плывёт деревянный плот с людьми; ракета, взорвавшая плот (выжило трое, включая Славу); деревянный домик без окон, дверей и трубы — «просто стенка стенка потолок и пол, сделаный не из брёвен, а из досок»; позади домика — «странный механизм, шестерёнки, какие-то геометрические фигуры и что-то похожее на пушке», из которого с невероятной скоростью что-то вылетает (не попало, но подняло воду на метра три). Внутри домика — дед с уставшим лицом и стеклянными глазами.</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0176-S02", "MR-0176--naselenie"], "h": "<p>Основное население — обратные: существа, внешне неотличимые от людей, захватившие мир, так что «обычных людей остаються единицы». Формула мира, данная Славой: «Выживания в мире психов (обратных), что создают какую-ту хуйню для разных целей. При этом они эмоциональный и у них есть чувство, и они не люди».</p>\n<p>Обратные обладают всеми качествами человека — «смеются улыбаются, грустят ленятся и привязываются», — но при этом не люди. Названы два конкретных отличия:</p>\n<ul>\n<li>азарт в характере — «у них был некий азарт»;</li>\n<li>глаза — «тусклые что-ли», «стеклянные»; сам Слава уточняет, что «мёртвыми» их назвать было бы перебором — «они где-то на уровне живых и мёртвых, это я про глаза».</li>\n</ul>\n<p>Каждый обратный строит что-то своё и непонятное: «И нет, не машину для убийства всех и чего подобного. Каждый из них словно строили что-то своё, что-то непонятное». Общей цели или единого плана обратных в переписке не названо — Слава прямо говорит: «Ну не это главная».</p>\n<p>Отдельно от обратных: сам Слава — скрывающийся среди них выживший («вот например я скрывающий среди этих обратных, каким чудом выживаю»); ещё двое выживших с плота, вместе с ним доплывших до домика; дед со стеклянными глазами внутри домика — по описанию глаз он ближе к обратным, но прямо так в переписке не назван.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0176-S03", "MR-0176--mesto-vo-vselennoy"], "h": "<p>Вселенная объявлена 2025-11-18 (id 386292), имени в переписке ей не дали. В карточке этой рассылки она фигурирует как «маленькая вселенная по мотивам сна (обратные)».</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0176-S04", "MR-0176--kak-menyalsya-po-versiyam"], "h": "<h3>Версия 1 — 2025-11-18 (id 386292–386296)</h3>\n<p>Первое изложение сна и концепции целиком: клаустрофобия как исходное ощущение, обратные как захватчики мира, каждый строит своё, домик с механизмом, гибель плота от ракеты, встреча с дедом со стеклянными глазами. Слава сам не до конца понимает, почему обратные не люди: «И я не понимаю почему они не люди. В моих глазах всё конечно ясно, я же видел сон... Но было два отличия ими но в характере... азарт... и второй глаза что были тусклыми что-ли».</p>\n<h3>Версия 2 — 2025-11-20 (id 387232–387241)</h3>\n<p>Слава возвращается к теме и спрашивает Миколая: «Кстати, а что насчёт концепций из сна?» Оценка своей же концепции: «Я считаю её крутой. Хотя я не до конца понимаю суть обратных». Тут же признаёт, что в присланном тексте много лишнего: «Большинство там конечно вода... Который просто описывали мои эмоции во сне». Миколай к этому моменту текст ещё не прочитал: «ну вот я хочу прочитать и спросить кое че... но пока как-то не могу настроить себя», откладывает на утро («эх, спокойной ночи, утром прочту, а то поздно (не убегаю, реально поздно)»). Дальнейшего обсуждения в переписке нет — реакция Миколая на концепцию не зафиксирована.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0176-S05", "MR-0176--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Чем именно обратные перестали быть людьми (что «поменялось»), кроме азарта и стеклянных глаз, — не сформулировано самим автором: «И я честно даже не знаю, что именно поменялось».</li>\n<li>Что именно строит каждый обратный и с какой целью — не названо («что-то своё, что-то непонятное»).</li>\n<li>Судьба и статус деда со стеклянными глазами в домике — не раскрыты, сон обрывается сразу после встречи с ним.</li>\n<li>Назначение механизма за домиком (шестерёнки, геометрические фигуры, «что-то похожее на пушке») — не объяснено.</li>\n<li>Реакция Миколая на концепцию после прочтения в переписке отсутствует.</li>\n<li>Имя вселенной в переписке не появляется.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["MR-0176--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-11-18</td>\n<td>386292–386296</td>\n<td>w0109</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-11-20</td>\n<td>387232–387241</td>\n<td>w0109</td>\n<td>неясно (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0176-obratnye.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0176--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0176.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
