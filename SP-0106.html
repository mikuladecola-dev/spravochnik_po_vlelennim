<script>const BASE="";const DOCNAME="жук-галлюциноген";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0106-S01", "SP-0106--mehanika"], "h": "<p>Способность применяется не самим носителем напрямую, а через жука: спасатель «с помощью какого-то жука заставил увидеть галлюцинацию» персонажа Миколая (2024-08-20, id 220669–220677). То есть жук выступает инструментом, через который на человека наводится галлюцинация.</p>\n<p>Единственный названный в переписке случай применения — на персонаже Миколая. Как именно жук вызывает галлюцинацию (укус, контакт, вещество, присутствие рядом), в переписке не сказано; вид жука тоже не назван — сказано «какого-то жука».</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0106-S02", "SP-0106--ogranicheniya-i-cena"], "h": "<p>В переписке не обсуждались.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0106-S03", "SP-0106--nositeli"], "h": "<p>Жук. Применяет его спасатель — персонаж Славы, которого Миколай в том же разговоре предложил «сделать ублюдком»: «он использует монстров в своих целях для спасения людей» (2024-08-20, id 220671). Жук в этой схеме — один из монстров, которых спасатель использует.</p>\n<p>В карточке способности среди связанных значится также Захар Авгур; чем именно он связан с механикой, в приведённых кусках переписки не сказано.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0106-S04", "SP-0106--kak-menyalas-po-versiyam"], "h": "<p>Зафиксировано одно состояние.</p>\n<p><strong>2024-08-20 (id 220669–220677).</strong> Названа сама механика: жук как средство навести галлюцинацию. Развить её не успели — Слава оборвал разговор: «Стопэ», «Не надо слишком больших сполеров» (id 220673, 220675). Миколай согласился: «без проблем» (id 220677).</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0106-S05", "SP-0106--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Способность входит в общий приём спасателя — использование монстров в своих целях для спасения людей (2024-08-20, id 220671). Жук здесь — частный случай этого приёма.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "SP-0106-S06", "SP-0106--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Как жук вызывает галлюцинацию — не сказано.</li>\n<li>Что именно увидел персонаж Миколая в галлюцинации — не сказано.</li>\n<li>Зачем спасателю понадобилась галлюцинация, чего он этим добивался — не сказано.</li>\n<li>Есть ли ограничения, длительность, последствия — не обсуждалось.</li>\n<li>Вид и внешность жука не описаны.</li>\n<li>Разговор обрублен на просьбе не спойлерить, поэтому деталей нет вообще.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0106--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0106--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-20</td>\n<td>220669–220677</td>\n<td>w0054</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0106-zhuk-gallyucinogen.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0106--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0106.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
