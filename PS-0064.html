<script>const BASE="";const DOCNAME="Призрак";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0064-S01", "PS-0064--proishozhdenie"], "h": "<p>Персонаж Миколая, придуманный под отряд — под «Отряд сильнейших» (2024-05-07, id 166762–166785, окно w0032). Идея возникла сразу после того, как Слава отказался от предыдущего варианта: «Не оставляю ( не знаю почему, просто как то не подходит)» (id 166762). Следом Миколай пишет: «Есть идея о призраке» (id 166764).</p>\n<p>Позже, когда Слава сказал, что «все это как то не то», Миколай отметил происхождение персонажа прямо: «Ну бля, я под эту идею его и создавал» (id 166781) — то есть призрак делался именно под отряд, а не отдельно.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0064-S02", "PS-0064--vneshnost"], "h": "<p>В переписке не описана. Ни роста, ни лица, ни одежды, ни степени прозрачности — ничего этого нет.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0064-S03", "PS-0064--harakter"], "h": "<p>В переписке не сказано. Обсуждались только способность и способ его убить.</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0064-S04", "PS-0064--sposobnosti"], "h": "<p>Основная способность — «локальное управление осязания» (id 166764). Миколай раскрывает её так: «Ну тобиж он может проходить сквозь всё, и может контролировать какая часть его тела будет доступна для прикосновения. Даже если это маленькие участки или участки внутри тела» (id 166764).</p>\n<p>Отдельно оговорено, что управление работает не только по поверхности, но и в объёме: «Если он может в объёме контролировать осязание внутри тела, то он например может сделать иглы из костей осязаемыми и ими зарезать других» (id 166766). То есть внутренние структуры тела — кости — можно избирательно делать осязаемыми и использовать как оружие.</p>\n<p>Второй слой способностей — рукопашный: «Ну и ещё он будет обладать мощным боевым искусством» (id 166765).</p>\n<p>Уязвимость названа автором сразу, вместе со способностью: «Ну и логично как его победить, просто атаковать осязаемую часть тела» (id 166767). То есть цена неосязаемости — в том, что любая часть, включённая в осязание для атаки, в этот момент открыта для ответного удара.</p>\n<p>Тут же, в том же окне, Миколай приводит рядом с персонажем определение ловкости: «Оказывается ловкость имбовая штука» (id 166772), и следом — определение Н. А. Бернштейна: «способность двигательно выйти из любого положения, то есть способность справиться с любой возникшей двигательной задачей: правильно (адекватно и точно), быстро (то есть, скоро и споро), рационально (целесообразно и экономично), находчиво (изворотливо и инициативно)» (id 166773). Источник указан: «Из фандома взял» (id 166774). Приписана ли ловкость самому призраку как отдельная характеристика — в переписке не сказано, реплика идёт следом за его разработкой без прямой привязки.</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0064-S05", "PS-0064--svyazi-s-drugimi"], "h": "<p>Связан с «Отрядом сильнейших» — под него и создавался. Связан со способностью «локальное управление осязания».</p>\n<p>Других связей — с конкретными персонажами, врагами, союзниками — в переписке нет.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0064-S06", "PS-0064--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2024-05-07 (id 166762–166775).</strong> Полный набор: призрак, проходит сквозь всё, локально управляет осязанием, в том числе внутри тела; сверху мощное боевое искусство; способ убить — атаковать осязаемую часть тела. На вопрос Миколая «Норм?» (id 166770) Слава отвечает «Да» (id 166771).</p>\n<p><strong>Версия 2 — 2024-05-07 (id 166776–166785).</strong> Через час Слава пересматривает решение по всей подборке: «Но все это как то не то» (id 166776). На уточняющее «Призрак?» (id 166778) отвечает: «Не ну призрак можно ещё куда нибудь запихать» (id 166779) и обрывает себя на «Но» (id 166780). Сама механика персонажа при этом не меняется — меняется только его место: из отряда он выводится, но не отменяется. Миколай закрывает разговор: «Ладненько придумаю ещё что-нибудь» (id 166782).</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0064-S07", "PS-0064--chto-s-nim-stalo"], "h": "<p>Из отряда сильнейших не взят, но и не отброшен: оставлен как персонаж, которого «можно ещё куда нибудь запихать» (id 166779). Куда именно — осталось нерешённым; в окне w0032 к нему больше не возвращаются.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0064-S08", "PS-0064--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имени, кроме слова «призрак», нет.</li>\n<li>Внешность не описана вообще.</li>\n<li>Характер, биография, происхождение самого призрака внутри мира (кем был, как стал призраком) — в переписке не сказано.</li>\n<li>Вселенная в самой переписке не названа; отнесение к «игре бога» сделано по дате объявления.</li>\n<li>Куда персонажа «запихать» после вывода из отряда — осталось нерешённым.</li>\n<li>Связь реплики про ловкость (id 166772–166774) с призраком прямо не проговорена.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0064--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0048.html\">Отряд сильнейших (команда «А»)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0014.html\">игра бога</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0064--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-05-07</td>\n<td>166762–166775</td>\n<td>w0032</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-05-07</td>\n<td>166776–166785</td>\n<td>w0032</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0064-prizrak.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0064--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0064.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
