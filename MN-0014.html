<script>const BASE="";const DOCNAME="Перимутский треугольник";
const LEAD="";
const CH=[{"t": "Где находится", "a": ["S01", "MN-0014-S01", "MN-0014--gde-nahoditsya"], "h": "<p>Вселенная «Апостол». Точная привязка к местности в переписке не дана — названо только само место, «перимутский треугольник» (2025-01-27, id 284856). Отдельная пометка источника: «Похоже на Бермудский треугольник в авторском написании, но прямо это не сказано» (w0073).</p>", "r": []}, {"t": "Что собой представляет", "a": ["S02", "MN-0014-S02", "MN-0014--chto-soboy-predstavlyaet"], "h": "<p>Место, где спит одна из сущностей. Упомянуто одной строкой внутри разговора о сущностях: «И один из этих существ живёт и спит в перимутский треугольник» (id 284856). Ничего о размере, границах, виде или свойствах самого места не сказано.</p>", "r": []}, {"t": "Что с ним связано", "a": ["S03", "MN-0014-S03", "MN-0014--chto-s-nim-svyazano"], "h": "<p>Сущности и два их возможных исхода при появлении в человеческом мире. Слава описывает их так: «И эти сущность как стихийная катастрофа, как цунами, ураган, вулкан» (id 284855). Дальше: «И вот они иногда покидают минимиры и прилетають к нам и есть два исхода либо они начинают буйствовать и благословеный их толпой гасят. И второй когда они просто уходят в спячку» (id 284856).</p>\n<p>Перимутский треугольник относится ко второму исходу — к спячке, а не к буйству.</p>\n<p>Про первый исход сказано отдельно: «И вот как раз в первом случае когда они буйствует и мы их убиваем, то это сказывается на их родном мире из-за этого благословенных бояться и знають что они существуют» (id 284857). Сказывается ли на родном мире спячка — в переписке не сказано.</p>\n<p>По разметке источника монумент связан с сущностью и входит в её состав («Часть чего: Сущность»).</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MN-0014-S04", "MN-0014--kak-menyalsya-po-versiyam"], "h": "<p>Версия 1 — 2025-01-27, окно w0073, id 284855–284857. Единственное упоминание. Других версий и правок в материале нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MN-0014-S05", "MN-0014--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Не названо, в каком мире и в каком его месте находится треугольник.</li>\n<li>Не названа сама спящая сущность: какая именно из существ там спит, осталось нерешённым.</li>\n<li>Не сказано, можно ли её разбудить, что происходит с людьми или кораблями в этом месте, есть ли у спячки срок.</li>\n<li>Сходство с Бермудским треугольником прямо не заявлено — только предположение по написанию.</li>\n<li>Не сказано, есть ли другие места спячки для других сущностей.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["MN-0014--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-01-27</td>\n<td>284855–284857</td>\n<td>w0073</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/monumenty/MN-0014-perimutskiy-treugolnik.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MN-0014--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MN-0014.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
