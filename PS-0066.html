<script>const BASE="";const DOCNAME="Пришельцы (ростер 1–6)";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0066-S01", "PS-0066--proishozhdenie"], "h": "<p>Ростер из шести пришельцев, перечисленный Славой одним списком (2024-05-10, id 167446–167450, окно w0033). Список подаётся как повтор уже согласованного: номера идут подряд, каждый с кратким набором способностей, без пояснений и без обсуждения — как сводка того, что уже есть. Самой разработки этих шести в соседних окнах нет.</p>\n<p>Тем же сообщением задаётся объём набора: «И надо ещё 4 пришельца» (id 167450) — то есть шесть перечисленных составляют часть десятки.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0066-S02", "PS-0066--vneshnost"], "h": "<p>Образы прописаны неполно и только там, где они входят в описание способности.</p>\n<ul>\n<li><strong>1</strong> — козёл.</li>\n<li><strong>2</strong> — «молния типо Флэша» (id 167448).</li>\n<li><strong>3</strong> — летающий, «с щупальцами из плеч» (id 167448).</li>\n<li><strong>4</strong> — шарик.</li>\n<li><strong>5</strong> — кольцо; кольца выходят из спины.</li>\n<li><strong>6</strong> — образа нет: «6 образ не смог приставить» (id 167449). Для него задано только направление: «Он должен быть жутким страшными» (id 167449), и способ получения образа — «Запихай в нейронку для картинок» (id 167449).</li>\n</ul>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0066-S03", "PS-0066--sposobnosti"], "h": "<p>Дословно по списку (id 167448–167449):</p>\n<ul>\n<li><strong>1 козёл</strong> — «сильный физический выносливый и дохуя живучий».</li>\n<li><strong>2 молния</strong> — «типо Флэша с контролем электричества и взрывом атомов».</li>\n<li><strong>3</strong> — «летающий с щупальцами из плеч».</li>\n<li><strong>4 шарик</strong> — «бессмертие, не осязаемость не прибиваемость, мгновенное восстановление, также 0 атака но 100 защита». То есть чистый защитный профиль: полностью нулевая атака при предельной защите.</li>\n<li><strong>5 кольцо</strong> — «может делать кольцо из спины который могут стрелять взрываться ликвидировать, изменять форму».</li>\n<li><strong>6</strong> — «контроль разума, иллюзия, может залезть в голову видит чужие воспоминания».</li>\n</ul>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0066-S04", "PS-0066--svyazi-s-drugimi"], "h": "<p>Ростер связан с добором до десятки — с «Пришельцами 7–10 (второй вариант)».</p>\n<p>В окружении числятся Металлоид, Нейроглиф, Омниграф, Пироманта, Псиклон, Хроматер. Кто из них соответствует какому номеру из шести и соответствует ли вообще — в переписке не сказано.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S05", "PS-0066-S05", "PS-0066--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2024-05-10 (id 167446–167450).</strong> Единственное зафиксированное состояние: шесть номеров с наборами способностей плюс задача добрать ещё четверых. Изменений внутри окна нет.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S06", "PS-0066-S06", "PS-0066--chto-s-nim-stalo"], "h": "<p>Список остаётся открытым: шестёрка зафиксирована, четверо не придуманы, у шестого нет образа и поставлена задача сгенерировать его нейросетью. Выполнена ли эта задача — в переписке не сказано.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0066-S07", "PS-0066--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имён ни у одного из шести нет — только номера и краткие образы.</li>\n<li>Разработки этих шести в соседних окнах нет, они поданы как уже готовые.</li>\n<li>У номера 6 нет образа.</li>\n<li>У номера 3 не названо ничего, кроме полёта и щупалец из плеч, — ни образа целиком, ни отдельных способностей.</li>\n<li>Как шестёрка соотносится с именованными пришельцами из списка связей — не сказано.</li>\n<li>Ограничения, слабости и способы победить кого-либо из шести не обсуждаются; у номера 4 бессмертие и «не прибиваемость» даны без оговорок.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0066--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0014.html\">игра бога</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0066--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-05-10</td>\n<td>167446–167450</td>\n<td>w0033</td>\n<td>игра бога (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0066-prishelcy-roster-1-6.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0066--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0066.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
