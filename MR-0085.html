<script>const BASE="";const DOCNAME="Маги в обществе";
const LEAD="<p>Ветка о том, где и как живут маги в средневековом мире (<a href=\"MR-0084.html\">Средневековый мир</a>): школы, улицы, казармы, отношение власти и церкви. Обсуждалась 21 декабря 2024 года двумя кусками — днём и вечером (2024-12-21, id 272249–272577, окно w0067).</p>";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0085-S01", "MR-0085--ustroystvo"], "h": "<p>Магия в этом мире не привилегия узкой группы. На вопрос Славы «А и маги владеть будут все не только маги дальнего боя?» (id 272254) Миколай ответил: «ну магия разная будет», «все ли маги», «ну думаю да» (id 272256–272258).</p>\n<p>Маги разделены не по силе, а по укладу жизни. Миколай: «одни будут учиться в школе», «другие раздолбаи в улицах суету наводят» (id 272259–272260). Слава добавил третью группу: «Другие в казармах» (id 272261). Миколай уточнил — «типа армия?», «ок», «с 5 в армию» (id 272262–272264); Слава на возраст ответил «Не знаю» (id 272265), то есть «с 5» осталось предложением Миколая, не подтверждённым.</p>\n<p>Власть с уличными обходится жёстко: «власть будет этих ебанутых публично сжигать» (id 272266), «или чет ещё делать» (id 272268). Что именно «ещё» — не названо.</p>\n<p>Положение магов относительно церкви на момент обсуждения сильное. Слава: «Сейчас маги имеет большой влияний в королевстве и магии обучают даже солдат поэтому церковь ничего не может сделать» (id 272372). Миколай при этом описывал общую средневековую расстановку — «церковь имеет власть», «и сильнее государство» (id 272371, 272373) — и из расхождения сделал вывод, что религия в мире должна быть другой: «и это отражено в религии», «она другая», «100%» (id 272374–272376). Слава согласился: «Да» (id 272377). Подробнее — в <a href=\"MR-0086.html\">Религия и церковь</a>.</p>", "r": [["Религия и церковь", "MR-0086.html"]]}, {"t": "Население", "a": ["S02", "MR-0085-S02", "MR-0085--naselenie"], "h": "<p>Кто именно считается магом — вопрос, по которому соавторы разошлись и не сошлись.</p>\n<p>Слава спросил: «Кто такие маги именно маги с бородой ?» (id 272570). Миколай: «я думал все маги» (id 272571), и дальше перечислил, где лежат книги: «типа в школах есть эти книги», «в церквях», «у рыцарей», «у наёмников» (id 272572–272575). То есть доступ к магии у Миколая распределён по всем сословиям через книги.</p>\n<p>Слава на это ответил двумя репликами. Сначала об оговорке к идее: «Вообще идейка нормальная / Но такие руны будут стоить дорого да и должны быть ухудшения виде огненный шар из руины в разу слабее огненного шара который делает сам человек» (id 272576) — то есть магия через руны платная и заведомо слабее собственной. Затем — своя формулировка, кто такие маги: «Маги это учёный» (id 272577).</p>\n<p>Две позиции («все маги» с книгами и рунами против «маги это учёный») в окне не сведены.</p>\n<p>Отдельно в начале ветки Слава поднял вопрос о рыцарях: «А чё с рыцарями сделать ?», «Так оставить или че та дать ?» (id 272249–272250). Миколай переспросил, о ком речь: «че за рыцари?», «из средневековья?», «мои твои персы?» (id 272251–272253) — ответа на переспрос в окне нет, разговор ушёл к магам.</p>", "r": []}, {"t": "Место во вселенной — как связан с другими мирами", "a": ["S03", "MR-0085-S03", "MR-0085--mesto-vo-vselennoy"], "h": "<p>Часть средневекового мира <a href=\"MR-0084.html\">Средневековый мир</a>. Напрямую связана с религией и церковью (<a href=\"MR-0086.html\">Религия и церковь</a>): именно влияние магов в королевстве стало доводом за то, что религия в мире должна отличаться от реальной. Также в окне названы Магия и Рыцари.</p>", "r": [["Средневековый мир", "MR-0084.html"], ["Религия и церковь", "MR-0086.html"]]}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0085-S04", "MR-0085--kak-menyalsya-po-versiyam"], "h": "<p><strong>2024-12-21, день (id 272249–272269).</strong> Магией владеют все маги, магия «разная». Три уклада: школа, улица, казармы (армия). Вариант «с 5 в армию» предложен Миколаем, Слава — «Не знаю». Власть публично сжигает уличных. Здесь же Слава упомянул вопрос про самоусиления: «Вообще в другом вопрос будут само усиления» (id 272267), «Ну средневековья да» (id 272269) — развития в окне нет.</p>\n<p><strong>2024-12-21, вечер, 16:32 (id 272371–272377).</strong> Маги имеют большое влияние в королевстве, магии обучают даже солдат, церковь ничего не может сделать. Вывод: религия другая.</p>\n<p><strong>2024-12-21, вечер, 20:19 (id 272570–272577).</strong> Спор о том, кто такие маги. Миколай — все, книги в школах, церквях, у рыцарей, у наёмников. Слава — «Маги это учёный», а руны дороги и слабее собственной магии.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0085-S05", "MR-0085--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Кто такие маги, осталось нерешённым: «все маги» (Миколай) и «Маги это учёный» (Слава) в окне не сведены.</li>\n<li>Возраст призыва «с 5 в армию» не подтверждён — Слава ответил «Не знаю».</li>\n<li>Что власть делает с уличными магами помимо публичного сжигания («или чет ещё делать»), не названо.</li>\n<li>Судьба рыцарей: вопрос «Так оставить или че та дать ?» задан, переспрос Миколая («мои твои персы?») без ответа, тема не закрыта.</li>\n<li>Самоусиления упомянуты одной репликой и не разобраны.</li>\n<li>Как устроены школы, улицы и казармы изнутри, в переписке не сказано.</li>\n<li>Цена рун и величина ослабления («в разу слабее») названы качественно, чисел нет.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0085--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0084.html\">Средневековый мир</a>, <a href=\"MR-0086.html\">Религия и церковь</a></li>\n<li><strong>Упомянут в способностях:</strong> <a href=\"SP-0137.html\">Магия</a></li>\n<li><strong>Упомянут в мирах:</strong> <a href=\"MR-0084.html\">Средневековый мир</a>, <a href=\"MR-0086.html\">Религия и церковь</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0085--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-12-21</td>\n<td>272249–272269</td>\n<td>w0067</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-21</td>\n<td>272371–272377</td>\n<td>w0067</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-21</td>\n<td>272570–272577</td>\n<td>w0067</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0085-magi-v-obschestve.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0085--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0085.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
