<script>const BASE="";const DOCNAME="история про ледяной ад";
const LEAD="";
const CH=[{"t": "Содержание", "a": ["S01", "IS-0087-S01", "IS-0087--soderzhanie"], "h": "<p>История Миколая, существующая на 2026-02-16 в виде плана (окно w0117, id 433110–433130 и 433454–433474). Собственного названия у неё нет; в переписке она называется по месту действия — «ледяной ад», «ледяной мир».</p>\n<p>Сюжет по плану (id 433473):</p>\n<p>Летом жарко, главный герой бухает, обливается алкоголем, хочет охладиться и засыпает под плакучей ивой. На вопрос, умер ли он, автор отвечает сам себе: «сдох? нет ну это скучно». Ива — «особое место», она исполнила его мечту. Герой попадает в ледяной мир — «ледяной ад который он не идентифицирует как ад, ад для него дар».</p>\n<p>Отдельно оговорено, чем ад отличается от рая: «но это не рай, рай другое. рай это другие». В обычном мире у героя есть близкие, которые его ждут, к которым он хочет, какие-то планы.</p>\n<p>В ледяном мире он ходит и разговаривает с застывшим миром. Механика взаимодействия: «касаясь ничего не происходит. но сильно взаимодействуя он согревает что-то, но выходит резко, не равномерно, рука например тает, но все остальное замороженное, он тянет и отрывает и всё в кровяке».</p>\n<p>Дальше по плану герой, возможно, согреет какую-то территорию, будет стараться, «а потом такой а зачем мне это». И просто замёрзнет — «надолго замёрзнет полностью во льдах». Потом, когда ива вытянется, на него упадут лучи солнца, и он проснётся. Финальная реплика героя: «вот почему зимой все летят в тёплые страны, а летом на Антарктиду не летают. я так хорошо отдохнул. покупайте билеты». Сам автор тут же оговаривается: «насчёт рекламы я не уверен».</p>\n<p>К плану приписан отдельный каламбур, не привязанный к месту в сюжете: «густая кровь течёт по кровле. может именно из за этого она так называется? кровля».</p>\n<h3>Рабочие пункты к плану</h3>\n<p>В том же сообщении (id 433473) Миколай перечислил десять пунктов — что нужно сделать в тексте:</p>\n<ol>\n<li>надо показать как жарко летом</li>\n<li>именно показать от лица персонажа</li>\n<li>нужно использовать алкоголь с умом</li>\n<li>скорее всего у персонажа частный дом и он там какой нибудь сарай чинил, умаялся</li>\n<li>возможно его жёстко пилила жена тёща кто то такое</li>\n<li>так же довело дилемма которую он не мог решить видимо так же связанное с сараем и тем что он в нем делает</li>\n<li>кстати очень круто я подметил алкоголь и его горячительные свойства</li>\n<li>на улице итак жарко, а он ещё сосуды расширяет</li>\n<li>ужасно противно, страшно</li>\n<li>он ещё и без футболки, солнце палит, кожа с высохшим потом, красная</li>\n</ol>\n<p>Пункты 4, 5 и 6 сформулированы как предположения самого автора («скорее всего», «возможно»), а не как решённое.</p>", "r": []}, {"t": "Персонажи", "a": ["S02", "IS-0087-S02", "IS-0087--personazhi"], "h": "<p>Единственный названный персонаж — главный герой, без имени. Известно о нём только то, что перечислено в плане и рабочих пунктах: летом пьёт, обливается алкоголем, у него есть близкие, которые его ждут, и планы; предположительно частный дом, чинимый сарай, пилящая жена или тёща и нерешённая дилемма, связанная с сараем.</p>\n<p>В переписке 2026-02-16 в 11:49 (id 433129–433130) Миколай задаёт вопрос «это кто говорит / персонаж?» — вопрос остался без ответа в пределах записи.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "IS-0087-S03", "IS-0087--mesto-vo-vselennoy"], "h": "<p>Вселенная в переписке не объявлена; в базе история отнесена к Иссекаю по дате объявления.</p>\n<p>Связь с другими сущностями, названная в переписке: Миколай говорит, что у него «такая же идея», как в «Любимом городе» Славы, и не уверен, откуда она взялась — «мб по забыл и украл / мб спи додумался» (id 433111–433112). В чём именно совпадение, в переписке не сказано.</p>\n<p>По базе история связана с сущностями: Ледяной мир, Любимый город, Плакучая ива, План истории про ледяной ад, Согревание застывшего мира, кровля от крови.</p>", "r": []}, {"t": "Состояние", "a": ["S04", "IS-0087-S04", "IS-0087--sostoyanie"], "h": "<p>Не написана. На 2026-02-16 существует только план.</p>\n<p>Ход работы по датам:</p>\n<ul>\n<li>2026-02-16, 11:45–11:49 (id 433110–433130). Миколай сообщает, что планирует историю и уже писал план. Оценка перспектив: «будет либо хуйня либо очень круто». На вопрос Славы про мотивацию отвечает: «думаю да / такая история должна быть написана / она очень крутая / мощно / но страшно».</li>\n<li>2026-02-16, 21:29–21:32 (id 433454–433474). Миколай сначала отказывается кидать план — «я план не кину / наверное / или а то спойлеры ты тож не любишь», добавляя «но я не написал ещё» и «и не дочитал». Слава давит: «Кидай, а то снова будешь говорить о великих эпопех, а по итогу не сможешь даже докончить», и напоминает про прошлый случай — «А я ведь купился с этими облаками». Миколай соглашается («ну ок»), формулирует «у текста должна быть идея» и выкладывает план целиком.</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S05", "IS-0087-S05", "IS-0087--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Названия у истории нет.</li>\n<li>Вселенная не объявлена.</li>\n<li>Самого текста нет — только план и десять рабочих пунктов.</li>\n<li>Имени главного героя нет; кто он и чем занят до истории — только предположения самого автора («скорее всего», «возможно»).</li>\n<li>Вопрос «это кто говорит / персонаж?» (id 433129–433130) остался без ответа.</li>\n<li>В чём именно состоит совпадение с «Любимым городом», не сказано.</li>\n<li>Автор не решил, оставлять ли концовку с рекламой: «насчёт рекламы я не уверен».</li>\n<li>Каламбур про кровлю и кровь не привязан к месту в сюжете.</li>\n<li>Как именно устроен ледяной мир помимо механики согревания, откуда он и почему ива переносит туда — в переписке не сказано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["IS-0087--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0005.html\">Иссекай</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["IS-0087--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-02-16</td>\n<td>433110–433130</td>\n<td>w0117</td>\n<td>Иссекай (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-02-16</td>\n<td>433454–433474</td>\n<td>w0117</td>\n<td>Иссекай (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/istorii/IS-0087-istoriya-pro-ledyanoy-ad.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["IS-0087--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/IS-0087.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
