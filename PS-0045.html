<script>const BASE="";const DOCNAME="Каваи Навалов";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0045-S01", "PS-0045--proishozhdenie"], "h": "<p>Персонаж вселенной «игра бога». Появляется одним сообщением Миколая (2024-04-02, id 153333) готовой карточкой: имя, характеристика, возраст, способность. Обсуждения до карточки и повода для её появления в переписке нет.</p>\n<p>Карточка — третья и последняя из серии подряд идущих (id 153331–153333, окно w0029): <a href=\"PS-0043.html\">Нат Магнов</a> (Нат Магнов), <a href=\"PS-0044.html\">Терор Мачилович</a> (Терор Мачилович), <a href=\"PS-0045.html\">Каваи Навалов</a> (Каваи Навалов). Все три от одного автора, в одну минуту, по одному шаблону.</p>\n<p>Возраст — 28 лет.</p>", "r": [["Нат Магнов", "PS-0043.html"], ["Терор Мачилович", "PS-0044.html"]]}, {"t": "Характер", "a": ["S02", "PS-0045-S02", "PS-0045--harakter"], "h": "<p>Описан строкой: «Для него все конкуренты или ступени для возвышения по лестнице успеха, 28 лет».</p>\n<p>Всё описание характера сводится к этому отношению к окружающим: люди делятся для него на два разряда — конкуренты и ступени. Иных черт, привычек, манеры поведения в переписке не названо. Роль внутри какой-либо группы, в отличие от <a href=\"PS-0043.html\">Нат Магнов</a> (лидер) и <a href=\"PS-0044.html\">Терор Мачилович</a> (казначей, стратег), у него не указана.</p>", "r": [["Нат Магнов", "PS-0043.html"], ["Терор Мачилович", "PS-0044.html"]]}, {"t": "Способности", "a": ["S03", "PS-0045-S03", "PS-0045--sposobnosti"], "h": "<p>«Способность: слова буквально имеют вес, чем больше говорит, тем тяжелее удары».</p>\n<p>Механика связывает речь и силу удара напрямую: чем больше персонаж говорит, тем тяжелее бьёт. Слова названы имеющими вес «буквально».</p>\n<p>Не сказано: копится ли эффект внутри одного разговора или сбрасывается, есть ли верхний предел, считается ли любая речь или только сказанное вслух при противнике, важно ли содержание сказанного или только количество, есть ли обратный ход — слабеет ли он от молчания. Цена способности не названа.</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0045-S04", "PS-0045--svyazi-s-drugimi"], "h": "<p>Отдельных связей в переписке не названо. Из его характеристики следует только общее отношение к окружающим («все конкуренты или ступени»), без конкретных имён.</p>\n<p>Зафиксирована принадлежность к вселенной «игра бога». Соседство с карточками <a href=\"PS-0043.html\">Нат Магнов</a> и <a href=\"PS-0044.html\">Терор Мачилович</a> в одной серии сообщений прямо в текст не переведено — общая группа для этих троих в переписке не объявлена.</p>", "r": [["Нат Магнов", "PS-0043.html"], ["Терор Мачилович", "PS-0044.html"]]}, {"t": "Как менялся — состояния по датам", "a": ["S05", "PS-0045-S05", "PS-0045--kak-menyalsya"], "h": "<p><strong>2024-04-02 (id 153333, окно w0029)</strong> — единственная версия. Полная карточка: для него все конкуренты или ступени для возвышения по лестнице успеха, 28 лет, способность — слова буквально имеют вес, чем больше говорит, тем тяжелее удары.</p>\n<p>Возвратов к персонажу, правок и других версий в переписке нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0045-S06", "PS-0045--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Внешность не описана вообще.</li>\n<li>Происхождение и биография — в переписке не сказано.</li>\n<li>Роль в группе не указана, в отличие от двух соседних карточек.</li>\n<li>Механика способности не разобрана: накопление, сброс, предел, цена, зависимость от содержания речи.</li>\n<li>Дальнейшая судьба персонажа не прописана: появляется один раз и больше не возникает.</li>\n<li>Связь с <a href=\"PS-0043.html\">Нат Магнов</a> и <a href=\"PS-0044.html\">Терор Мачилович</a> прямо не заявлена, осталась нерешённой.</li>\n</ul></div>", "r": [["Нат Магнов", "PS-0043.html"], ["Терор Мачилович", "PS-0044.html"]]}, {"t": "Связи — всё вместе", "a": ["PS-0045--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0049.html\">Команда Миколая (10 персонажей игры бога)</a></li>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0043.html\">Нат Магнов</a>, <a href=\"PS-0044.html\">Терор Мачилович</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0043.html\">Нат Магнов</a>, <a href=\"PS-0044.html\">Терор Мачилович</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0049.html\">Команда Миколая (10 персонажей игры бога)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0014.html\">игра бога</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0045--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-04-02</td>\n<td>153333–153333</td>\n<td>w0029</td>\n<td>игра бога (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0045-kavai-navalov.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0045--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0045.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
