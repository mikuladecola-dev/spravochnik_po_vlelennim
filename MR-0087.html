<script>const BASE="";const DOCNAME="Рыцари";
const LEAD="<p>Сословие бойцов средневеково-фэнтезийного мира <a href=\"MR-0092.html\">Мир (безымянный средневеково-фэнтезийный мир с магией)</a>. Обсуждалось в двух окнах: 2024-12-21 (id 272249–272333, окно w0067) и 2024-12-23 (id 273211–273292, окно w0068).</p>";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0087-S01", "MR-0087--ustroystvo"], "h": "<p><strong>Исходный вопрос.</strong> Слава открывает тему: «А чё с рыцарями сделать?», «Так оставить или че та дать?» (2024-12-21, id 272249–272250). Миколай переспрашивает, о ком речь: «че за рыцари? из средневековья? мои твои персы?» (id 272251–272253) — то есть уточняется, что рыцари здесь сословие мира, а не конкретные персонажи. В окне w0067 ответа на исходный вопрос («что им дать») так и не прозвучало, обсуждение продолжилось 23 декабря.</p>\n<p><strong>Справочная база.</strong> 2024-12-21 (id 272330–272333) Миколай выкладывает определения, взятые как отправная точка:</p>\n<ul>\n<li>«Рыцарь - это тяжеловооруженный конный воин средневековой Европы (примерно VIII-XVI века)»;</li>\n<li>«Термин \"рыцарь\" происходит от немецкого \"Ritter\" (всадник)»;</li>\n<li>«Наследственный титул»;</li>\n<li>и отдельно про придворный этикет: «система правил поведения при дворе или набор качеств, которыми должен был обладать придворный в Средние века».</li>\n</ul>\n<p><strong>Рыцари и магия.</strong> 2024-12-23 Слава разводит рыцарей и магов: «Магии это магий. Рыцарь просто будут качаться или обучаться боевым стилем либо имеет артефакт» (id 273212). То есть три источника силы рыцаря: прокачка, обучение боевому стилю, артефакт. Магии среди них нет.</p>\n<p><strong>Метка бога.</strong> «Плюсом у некоторых рыцарей может быть метка дарованная богом и дающий способность» (2024-12-23, id 273215) — единственное исключение, дающее рыцарю способность.</p>\n<p><strong>Сила.</strong> Общий физический потолок мира: «В этом мире предел физических возможностей людей в разы выше» (id 273214). Конкретно про рыцаря: «То бишь один среднестечический рыцарь в разы сильнее сильнейшего физически в нашем мире» (id 273244). Миколай уточняет, идёт ли речь только о драке — «именно в плане пиздить кого-то или что-то», «а не в ловкости прыжках скорости» (id 273246–273247). Ответ Славы: «Во всех физических характеристиках. Реакция, скорость, ловкость, сила, выносливость» (id 273250).</p>\n<p><strong>Доспехи.</strong> На вопрос «у них разные доспехи?» — «Чаще всего одинаковый» (id 273249, 273251). На «из чего?» Слава отвечает «Не знаю» (id 273252–273255). Материал доспехов не назван.</p>\n<p><strong>Служба.</strong> «рыцари принадлежат одному королю?» — «Да» (id 273256–273257). Есть и служащие не королю: на вопрос, есть ли те, кто служит девушкам, Слава отвечает «Баронам или дворянина. есть» (id 273258, 273260). Кони рыцарей — вопрос Миколая «че за кони у них» (id 273259) остался без ответа. (Позже в мире правит не король, а королева — см. <a href=\"MR-0092.html\">Мир (безымянный средневеково-фэнтезийный мир с магией)</a>, 2024-12-23, id 273499–273500.)</p>\n<p><strong>Три типа по королевствам.</strong> Миколай предлагает: «3 королевства 3 разных типов рыцарей», «ну культурно отличаются» (id 273261–273262). Слава сдвигает приоритет: «Во первых сначала надо разделить сильных и слабых» (id 273263). Что именно культурно различает три типа — не проработано.</p>\n<p><strong>Деление на сильных и слабых.</strong> Слава: «И вот сейчас я хочу разделить сильных рыцарей от средних» (id 273254). Предложение Миколая: «ну у слабых доспехи легкие и тонкие относительно» и «и слабых половина от остальных» (id 273264–273265).</p>\n<p><strong>Итоговое деление.</strong> 2024-12-23 (id 273279) Слава переформулирует: «Тогда для начала рыцарь это пик. А все остальные просто воины или новобранцы или т.п». То есть рыцарь — верхняя планка, ниже — просто воины и новобранцы. Кто такие просто воины: на вопрос Миколая «просто воины это че такое» и «как они выглядят» Слава отвечает: «Просто массовка который гибнуть» (id 273289, 273291–273292).</p>\n<p><strong>Рыцарь с клятвой и свободный рыцарь.</strong> «Потому что будет и свободных рыцарей который не дали клятву, и они тоже должны быть сильными» (id 273277). Итог: «И так будут рыцарь с клятвой. И свободный рыцарь» (id 273280). Разница по силе: «А ладно пофиг просто и без клятвы рыцарь дохуя сильный а с клятвой просто становяться чутка сильнее» (id 273283).</p>\n<p><strong>Наёмники.</strong> Миколай: «ваще в средние века были наёмники» (id 273286). Слава: «Ну наемники вообще другая история» (id 273287) — тема отведена в сторону и в этом окне не развита.</p>", "r": [["Мир (безымянный средневеково-фэнтезийный мир с магией)", "MR-0092.html"]]}, {"t": "Население", "a": ["S02", "MR-0087-S02", "MR-0087--naselenie"], "h": "<p>Рыцарское сословие устроено так (по состоянию на 2024-12-23):</p>\n<ul>\n<li>рыцари — пик, среди них деление на сильных и средних/слабых, у слабых доспехи «легкие и тонкие относительно», слабых предложено считать половиной от остальных;</li>\n<li>по клятве: рыцарь с клятвой и свободный рыцарь (без клятвы) — свободный сильный и без неё, с клятвой становится «чутка сильнее»;</li>\n<li>по службе: королю (позже — королеве), баронам, дворянам;</li>\n<li>ниже рыцарей — просто воины и новобранцы, «массовка который гибнуть»;</li>\n<li>часть рыцарей носит метку, дарованную богом и дающую способность;</li>\n<li>наёмники объявлены отдельной историей.</li>\n</ul>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0087-S03", "MR-0087--mesto-vo-vselennoy"], "h": "<p>Часть мира <a href=\"MR-0092.html\">Мир (безымянный средневеково-фэнтезийный мир с магией)</a>. В переписке рыцари связываются также с магами в обществе, с магией клятвы и со средневековым миром.</p>", "r": [["Мир (безымянный средневеково-фэнтезийный мир с магией)", "MR-0092.html"]]}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0087-S04", "MR-0087--kak-menyalsya-po-versiyam"], "h": "<ul>\n<li><strong>2024-12-21, id 272249–272253.</strong> Поставлен вопрос: рыцарей оставить как есть или что-то им дать. Уточнено, что речь о рыцарях средневековья, а не о персонажах авторов. Решения нет.</li>\n<li><strong>2024-12-21, id 272330–272333.</strong> Справочные выписки: рыцарь — тяжеловооружённый конный воин средневековой Европы (VIII–XVI века), от немецкого Ritter (всадник), титул наследственный; плюс определение придворного этикета и качеств придворного.</li>\n<li><strong>2024-12-23, id 273211–273215.</strong> Рыцари магией не владеют: качаются, обучаются боевому стилю либо имеют артефакт. Плюсом у некоторых — метка от бога, дающая способность.</li>\n<li><strong>2024-12-23, id 273244–273265.</strong> Средний рыцарь в разы сильнее сильнейшего физически человека нашего мира — по всем характеристикам. Доспехи чаще всего одинаковые, материал не назван. Служба королю, баронам, дворянам. Слава хочет разделить сильных и средних; Миколай предлагает делить по лёгким/тонким доспехам и класть долю слабых в половину. Предложение Миколая про 3 королевства и 3 культурно разных типа рыцарей отложено в пользу деления сильные/слабые.</li>\n<li><strong>2024-12-23, id 273277–273292.</strong> Итог деления: рыцарь — пик, все остальные просто воины/новобранцы («массовка который гибнуть»). Рыцари бывают с клятвой и свободные; без клятвы уже очень сильный, с клятвой «чутка сильнее». Наёмники — «вообще другая история».</li>\n</ul>", "r": []}, {"t": "Отклонённые и неразвитые варианты", "a": ["S05", "MR-0087-S05", "MR-0087--otklonennye-i-nerazvitye-varianty"], "h": "<ul>\n<li>Миколай возражал против названия «рыцарь» для тех, кто не служит: «ммм, ну их тяжело назвать рыцарями без службы», «пусть тогда они патриоты будут» (id 273281–273282). Слава на это не согласился, оставив термин «свободный рыцарь»: «А ладно пофиг…» (id 273283). Название «патриоты» не прижилось.</li>\n<li>Миколай предлагал выводить свободных рыцарей «из семей рыцарей которых отделили от семьи» (id 273284) и сам же засомневался: «ну хз хз» (id 273285). Происхождение свободных рыцарей осталось нерешённым.</li>\n<li>Предложение о 3 культурно разных типах рыцарей по 3 королевствам (id 273261–273262) не было ни принято, ни отвергнуто — Слава перевёл разговор на деление по силе.</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S06", "MR-0087-S06", "MR-0087--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Исходный вопрос w0067 — «что дать рыцарям» — в том окне ответа не получил; выписки id 272330–272333 выглядят скопированными из справочника.</li>\n<li>Материал доспехов не назван («Не знаю»).</li>\n<li>Кони рыцарей: вопрос «че за кони у них» остался без ответа.</li>\n<li>Что именно культурно различает рыцарей трёх королевств — не проработано.</li>\n<li>Клятва: что она собой представляет и кому даётся, здесь не описано; сказано только, что с ней рыцарь «чутка сильнее».</li>\n<li>Наёмники в этом обсуждении не раскрыты — отведены как «другая история».</li>\n<li>Как выглядят просто воины — на прямой вопрос ответ дан только через роль («массовка который гибнуть»), не через внешность.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0087--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0092.html\">Мир (безымянный средневеково-фэнтезийный мир с магией)</a></li>\n<li><strong>Упомянут в способностях:</strong> <a href=\"SP-0145.html\">Магия (система магии мира)</a></li>\n<li><strong>Упомянут в мирах:</strong> <a href=\"MR-0092.html\">Мир (безымянный средневеково-фэнтезийный мир с магией)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0087--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-12-21</td>\n<td>272249–272253</td>\n<td>w0067</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-21</td>\n<td>272330–272333</td>\n<td>w0067</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-23</td>\n<td>273211–273215</td>\n<td>w0068</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-23</td>\n<td>273244–273265</td>\n<td>w0068</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-23</td>\n<td>273277–273292</td>\n<td>w0068</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0087-rycari.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0087--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0087.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
