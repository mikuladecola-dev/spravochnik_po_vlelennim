<script>const BASE="";const DOCNAME="Минимиры";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0094-S01", "MR-0094--ustroystvo"], "h": "<p>Минимиры — множество малых миров, существующих помимо нашего. Введены Славой 2025-01-06 в первом же изложении устройства вселенной (id 278852), вместе с раем и адом.</p>\n<p>Размер. У каждого минимира свой: «Ну есть мир который по размеру как дом, а есть мир который как город и т.д.» (278863). Для сравнения: наш мир объявлен бесконечным, рай и ад — на втором месте по размеру.</p>\n<p>Край. У минимира есть конец, и его можно увидеть. На вопрос М «а типа я на краю города могу стоять? он шарик или листок? я упаду на краю?» (278869) ответ: «Ты можешь увидеть конец мира. Если ты упадешь то просто попадешь в другой мир. Он просто кусок нашего мира» (278873). Край работает как переход: упавший на краю попадает в другой мир.</p>\n<p>Характер. «И вот чаще всего эти минимиры темный жуткий жестокий все существо там опасный» (278852).</p>\n<p>Копирование. Минимиры чаще всего пытаются копировать наш мир, причём копируют конкретные места: «Копировать например кладбище, именной какой-то место в нашем мире» (278867). Зачем — объяснено в 278894: «Правитель минимиров могут наблюдать за нашем, вот и изменять свой пытаясь копировать наш чтобы хоть чуть-чуть приблизится к могуществу \"существа\"». И повторно в 278912: «Ну большинство правитель пытаются достигнуть нашего правителя из за этого пытаются везде его копировать».</p>\n<p>Правители. «И вообще почти во всех мирах есть правитель( существо правящий этим миров )» (278852). Их свойства (278903): «У них нет облика они могут принять любой, контролирует полностью свой мир изменяя пространства». На уточняющие вопросы М о границах их власти С отвечает отрицательно: дождь — не их работа, «это экологией, круговорот» (278905); войны, ссоры, упавший хлеб — «Нет, это наша работа» (278904). Появились правители «просто в пустоте. По итогу создавая землю воду и т.д.» (278909).</p>\n<p>Благословение. Правители могут дать своё благословение, но «они могут дать свой благословений только людям из нашего мира» (278852).</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Отклик — не материал авторов</b>\n<p>Зацепил мотив копирования. Минимиры копируют не идею и не устройство, а конкретное место — «например кладбище», — и делают это, потому что их правители смотрят на нашего и хотят приблизиться. То есть в основании этой космологии лежит не замысел и не борьба, а зависть, причём с плохим вкусом: не украсть силу, а перерисовать чужой двор у себя. Отсюда естественно получается, что все земные чудища — драконы, оборотни, леший — жители плохих копий, забредшие в оригинал. Это компактно и держится само.</p></div>", "r": []}, {"t": "Население", "a": ["S02", "MR-0094-S02", "MR-0094--naselenie"], "h": "<p>Существа минимиров. «И иногда случается так что существа из минимиров выбираются в нас и творят бесчинства, и все те мистический монстры( драконы, упырь, оборотни, леший, и т.д) это существа из минимиров» (278852). То есть вся земная мифология в этой конструкции — обитатели минимиров, прорвавшиеся к нам.</p>\n<p>Души умерших. После смерти человек отправляется в рай или ад, «ну или в минимирок ну это случается крайне редко» (278852). Механика: «из за \"смерти\" она после нашей кончины не даёт остаться в нашем мире и вечно отправлять нам куда-то»; «Смерть таскает наши души в других миры» (278875).</p>\n<p>В файле среди связанных сущностей значатся Грехи с пометкой «существа минимиров». В приведённых кусках переписки этого окна грехи не обсуждаются — связь зафиксирована навигацией, но не текстом сообщений.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0094-S03", "MR-0094--mesto-vo-vselennoy"], "h": "<p>Все миры связаны с нашим, и связь с ним самая крепкая: «Вообще все миры будь то \"рай\" или \"ад\" или минимиры всегда связаны с нашем миров так как наш мир появился первым и является самым большим» (278852). Развёрнуто в 278908: «Самая крепкая связь с нашем миров так как он первый и по суть на основе него строились и другие миры. Между всеми мирами есть связь но самый сильной только с нашем».</p>\n<p>Переход односторонний. Из минимира к нам попасть можно — через край своего мира: «поэтому случается так что они могут попасть в наш через край своего мира». В обратную сторону при жизни нельзя: «Мы же пока живы не можем попасть в другой мир» (278878). Живого человека в другой мир не пускает — умершего уносит Смерть.</p>\n<p>Счёт миров на 2025-01-06: три мира плюс много минимиров. М спрашивает: «3 мира и много минимиров или будут потенциально ещё миры но мы молчим?» (278895). Ответ: «Ну это надо подумать» (278896), затем «Ну пока 3 мира» (278897).</p>\n<p>См. <a href=\"MR-0093.html\">Вселенная (наш мир)</a> — наш мир, оригинал, с которого копируют.</p>", "r": [["Вселенная (наш мир)", "MR-0093.html"]]}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0094-S04", "MR-0094--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-01-06, 14:17–14:21 (id 278852–278863).</strong> Введение. Минимиры названы среди миров помимо нашего; они тёмные, жуткие, жестокие, все существа там опасные; их обитатели прорываются к нам и известны как драконы, упыри, оборотни, леший. Изредка в минимир попадает и душа умершего. Размер задан диапазоном «от дома до города».</p>\n<p><strong>Версия 2 — 2025-01-06, 14:22–14:26 (id 278867–278878).</strong> Уточнение, что именно копируется — конкретные места нашего мира, например кладбище. Прописан механизм перехода: край мира, падение с края, попадание в другой мир. Прописано ограничение: живой человек уйти не может. М в этот момент предлагает вариант «порталы?» (278874) — вариант не подхвачен, вместо него дан ответ про Смерть, которая таскает души.</p>\n<p><strong>Версия 3 — 2025-01-06, 14:29–14:38 (id 278891–278912).</strong> Мотив копирования: правители минимиров наблюдают за нашим миром и переделывают свой, чтобы приблизиться к могуществу «существа». Здесь же уточняются свойства правителей (нет облика, могут принять любой, полностью контролируют свой мир, изменяя пространство) и то, чего они не делают (погода, войны, бытовые мелочи). М ставит вопрос о цене такой конструкции: «тобиж что-то новое в новых мирах вообще не ценится? развитие которые идет другим путём не естественно? бывает?» (278910) — ответ на него в переписке не дан, С отвечает только про стремление правителей достичь нашего.</p>\n<p><strong>Версия 4 — 2025-01-06, 15:24–15:26 (id 279045–279051).</strong> Озеро перерождения вписывают в конструкцию: «А насчёт озера перерождения. Запихаем сюда. Как минимирок который теперь в нашем мире» (279047). М уточняет: «но его нет в нашем мире? это че то оригинальное, не копия?» (279048) — подтверждено: «Да» (279050). То есть Озеро перерождения — минимир, который оказался в нашем мире и при этом оригинален, а не скопирован с нашего.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0094-S05", "MR-0094--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Как именно создаются минимиры — вопрос задан прямо (278893: «как создаются минимиры или они всегда есть/были?»), ответ отложен: «Ну это надо подумать». Про правителей сказано, что они «просто появились в пустоте», про сами минимиры — нет.</li>\n<li>Останется ли миров три или их станет больше — «пока 3 мира», решение отложено (278895–278897).</li>\n<li>Вопрос М о трёх связях у одного минимира с разными мирами (278906: «а вот в каком-то мини мире будет 3 связи с разными мирами, это реально?») остался без ответа — С ответил только про крепость связи с нашим миром.</li>\n<li>Вопрос, знают ли об этом люди и животные (278911), ответа не получил.</li>\n<li>Вопросы М о Смерти — «ей платят за это? нахуя она это делает? вредная привычка?» (278877) — остались без ответа.</li>\n<li>Связь минимиров с Грехами обозначена в навигации файла, но в самих сообщениях этого окна не проговорена.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0094--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0093.html\">Вселенная (наш мир)</a></li>\n<li><strong>Упомянут в мирах:</strong> <a href=\"MR-0093.html\">Вселенная (наш мир)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0094--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-01-06</td>\n<td>278852–278863</td>\n<td>w0070</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-06</td>\n<td>278867–278878</td>\n<td>w0070</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-06</td>\n<td>278891–278912</td>\n<td>w0070</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-06</td>\n<td>279045–279051</td>\n<td>w0070</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0094-minimiry.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0094--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0094.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["MR-0094-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/MR-0094/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — грехи. Это единственная связь записи, которая в статье честно помечена как навигационная и текстом не подтверждённая, и при этом она несущая: грехи объявлены существами минимиров, то есть должны замыкать всю линию «мифические монстры — это выходцы отсюда». Материал в наборе есть, но разложен неровно: <code>MR-0101</code> «Грехи (существа минимиров)» — статья 4.5 КБ при 4.6 КБ базы, одна ссылка; <code>PS-0187</code> «Семь грехов» — статья 13.2 КБ, две ссылки; а вот <code>SP-0156</code> «Семь грехов (магия по грехам)» — 11.8 КБ базы, статьи нет, вселенная не проставлена («неясно»), ссылок ноль; <code>ID-0111</code> «Добродетели и грехи как основа благословений» — 5.4 КБ, статьи нет, одна ссылка. Пока у половины линии нет статьи, а у самого объёмного куска ещё и не проставлена вселенная, связь с минимирами сшить нечем — она физически не к чему прицепиться.</p>\n<p>Второе — реестры: <code>SL-0053</code> (20.3 КБ базы, шесть ссылок, статьи нет) и <code>SL-0051</code> (9.8 КБ, шесть ссылок, статьи нет). Это две самые цитируемые сущности набора без статьи, и обе — списки категорий, куда должны попадать «Существа» и «Семь грехов». Минимиры — поставщик этой категории, и без разобранного реестра поставка идёт в пустоту.</p>\n<p>Третье, дешёвое: <code>PS-0178</code> «Смерть». Статья есть, 5.7 КБ, ссылок на неё ноль. Смерть здесь — единственный работающий транспорт душ в минимиры, она же создание существа в <code>MR-0068</code>, она же отправляет в рай и ад в <code>MR-0095</code>. Три статьи описывают её работу, и ни одна на неё не ссылается.</p>\n<h3>С чего начать</h3>\n<p>В архив, но не сразу. Своя база выбрана почти целиком — статья 11.3 КБ при 12.5 КБ базы, дочитывать нечего.</p>\n<p>Сначала соседи, там материал разъехался. Правители: <code>MR-0103</code> «Правители минимиров» — 3.8 КБ базы, самая тощая запись рода, тогда как <code>MR-0120</code> «Правитель» — 35.0 КБ, <code>PS-0278</code> «Правители» — 26.8 КБ, <code>MR-0097</code> «Правители миров» — 9.6 КБ, <code>GR-0023</code> — 44.1 КБ статьи. Свойства «нет облика, контролируют пространство, появились в пустоте» почти наверняка повторены и уточнены там, и уточнение про минимирских правителей надо забирать оттуда, а не искать заново.</p>\n<p>Озеро перерождения, вписанное сюда версией 4 (279045–279051), лежит двумя записями в разных вселенных: <code>MN-0009</code> «Озеро перерождения» (Апостол и монстры, 22.6 КБ базы при статье 16.3) и <code>MR-0067</code> «Озеро перерождения» (7 островов, 6.7 КБ). Прежде чем что-то делать со статусом «минимир внутри нашего мира», надо решить, одно это озеро или два.</p>\n<p>В архив — за созданием минимиров. Вопрос задан прямо (278893) и отложен словами «надо подумать»; в w0070 ответа нет и быть не может. Ориентиры, где Слава заново раскладывал устройство миров: w0079 (2025-03-10, чужемирцы и виды), w0083 (2025-03-19, порядок миров переписан), w0106 (2025-10-18, свод правил с перечнем способов покинуть мир). Там же смотреть, вырос ли счёт миров сверх трёх.</p>\n<h3>Как развивалось</h3>\n<p>Вся запись — один день, 2025-01-06, четыре версии за 69 минут: 14:17, 14:22, 14:29, 15:24. Заявили минимиры вместе со всем мироустройством; тут же ограничили — размер от дома до города, край как выход, живому уйти нельзя; на третьем шаге дали мотив копирования (правители тянутся к могуществу существа) и сразу очертили, чего правители не делают; на четвёртом пристегнули Озеро перерождения как готовый объект. Ограничения приходят в том же часе, что и заявка, включая служебные: «ну это надо подумать», «пока 3 мира».</p>\n<p>Дальше не возвращались ни разу. При этом материал продолжает работать: в <code>MR-0095</code> версия 6 от 2025-10-18 правители минимиров всё ещё держат своё место в системе благословений — девять месяцев спустя, без единой правки в самой записи.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для минимиров граница описана до конца и физически: у мира есть край, край видно, упавший с края попадает в другой мир, и именно так существа минимиров попадают к нам. Обратно — нельзя, для живого прописан запрет. В той же реплике 278852 сказано, что из ада сбегают грешники. Как они это делают, не сказано ни здесь, ни в <code>MR-0096</code>: у одного мира выход — устройство, у соседнего того же ряда выход — просто факт. Для минимиров назван и механизм, и запрет для встречного направления; для ада — ни того, ни другого.</p>\n<h3>Отклик</h3>\n<p>Зацепил мотив копирования. Минимиры копируют не идею и не устройство, а конкретное место — «например кладбище», — и делают это, потому что их правители смотрят на нашего и хотят приблизиться. То есть в основании этой космологии лежит не замысел и не борьба, а зависть, причём с плохим вкусом: не украсть силу, а перерисовать чужой двор у себя. Отсюда естественно получается, что все земные чудища — драконы, оборотни, леший — жители плохих копий, забредшие в оригинал. Это компактно и держится само.</p>\n<p>И отдельно — вопрос Миколая в 278910: если все копируют наш мир, то новое в новых мирах вообще не ценится, развитие другим путём не бывает? Он бьёт ровно в дно конструкции, и ответа на него в окне нет. Самая интересная реплика этого часа осталась висеть.</p></div>", "r": []}];</script>
