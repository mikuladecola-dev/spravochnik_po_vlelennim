<script>const BASE="";const DOCNAME="Виро (V:R0) — Ален и Нилла";
const LEAD="<h1>Виро (V:R0) — Ален и Нилла</h1>";
const CH=[{"t": "Об этом тексте", "a": ["S01", "PR-0055-S01", "PR-0055--ob-etom-tekste"], "h": "<ul>\n<li>Дата: 2025-02-25</li>\n<li>Сообщения: 295349–295350</li>\n<li>Состояние: обрывается — вторая часть кончается репликой «Почему папа меня не любит?», продолжения в чате нет</li>\n<li>Действующие лица: Ален (рассказчик), Нилла — его дочь, Роберт, Нэн, Мэйя, Барни, журналист-интервьюер</li>\n</ul>", "r": []}, {"t": "Текст", "a": ["S02", "PR-0055-S02", "PR-0055--tekst"], "h": "<p>Я уткнулся в экран с безэмоциональной, тупой рожей. Казалось, мои пальцы одеревенели, я стал бездушным и слепым к своим ощущениям.<br>  Через весь свой карьерный и жизненный путь я пронёс идею величия разума над чувством, превосходство холодного суда над горячим спором, но так и не понял природу происхождения человеческой логики. Я был беспредельно глуп, или Нилла была безвольно подвержена влиянию своих больных на голову сверстников.<br>  Роберт опять подходил ко мне с наглыми вопросами о состоянии Ниллы, на что я грубо, но при этом соблюдая угрюмое спокойствие в голосе, отвечал: &quot;Это не мои проблемы, а безрассудные выходки этой твари!&quot;<br>  Да, она любила меня задирать, выставлять меня полным дураком перед коллегами, выводить меня на крик, и всё это из-за ненависти ко мне. Я уверен, что её подговорили эти малолетние преступники, что это не её самовольные решения, как бы она ни старалась не приплетать своих бескультурных приятелей.</p>\n<p>  V:R0 – программа для хладнокровной и объективной оценки жизненной ситуации человека, что создавалась для замены ненужным в наших реалиях психологам (я хотел сказать, мешкам с кишками, что одобряли хаотичную сторону человека). Вместо официального названия обыватели использовали в своей речи сленг &quot;виро&quot;, что существенно сокращало время произношения и написания. Я, как один из создателей виро, имел полное право на управление нашей аналитической новаторской разработкой, так что вполне мог бы обеспечить свою семью на сотни лет с одних вкладов крупных предприятий в этот проект.<br>  На момент официального релиза виро нашей демоверсией пользовалось более десяти миллионов человек, а через месяц мы набрали первую сотню с последующими покупками дополнительных функций. Я был самым богатым человеком в мире, и говорю я отнюдь не про денежные суммы, а про суммы благословений, одобрений и положительных комментариев к моему приложению.<br>  Виро развивался вместе с нейросетями, и мы становились всё озолочённей на слова. Но с каждым годом, далее с каждым месяцем, далее с каждым днём работа в виро превращалась в рутину, которая приносила нашей фирме большие доходы в виде довольных пользователей и довольных копеек, но наши довольные лица превращала в гримасы боли.<br>  Вот, эта фотография, смотрите! На ней я с Робертом, Нэн, Мэйей и Барни. Мы с ребятами улыбаемся, пытаясь изобразить из себя тех самых успешных бизнесменов и бизнесвумен с обложек журналов, прям сияем глянцем и сахарной пудрой от напускного счастья. Внутри мы не были пусты или разбиты, как могло показаться; нам просто было чудовищно скучно. Даже с виро на плечах мы хотели стать большим, чем просто очередной фирмой с развивающимся проектом.<br>  Вот, следующая фотография. Тут от деловых костюмов и улыбок нас избавило рабочее место: мы сидим за компьютерами; на большом экране за нами выводятся цифры, коды, диалоги, говорящие лица, голоса безликих, лица безголосых; в глазах наших отражаются гигансткие системы из различных кодовых материалов, которые склеиваем раз за разом мы в стандартное обновление; всё серьёзно, рутинно и скучно.<br>  Вот ещё одна. Девочка на моих коленях держит в своих хрупких ручонках наш первый интерактивный куб &quot;MetaV:RO&quot; для работы с маленькими и &quot;необычными&quot; пациентами. Девочка улыбается не наигранно, поэтому данная реклама обошлась нам дороже, чем все предыдущие.</p>\n<p>  Я зашёл в пустую комнату, облепленную зелёными и голубыми плакатами, которые, уже в свою очередь, были обклеены разноцветными стикерами на любой вкус. Её беспощадность по отношению к дизайнерскому мастерству меня не на шутку бесила и раздражала, порой доходило до слёз. Конечно же моих, а с какой ещё эмоцией я могу сдирать это со стен СВОЕЙ комнаты?<br>  Может, я бы любил этот кусок дерьма по-своему, если б не ненавидел всей душой её тонкие, дребезжащие ручки, её по-старушечьи серьёзный взгляд и её по-детски глупые, притворные эмоции...<br>  Фу.</p>\n<p>  Мне нужно было услышать эти слова раскаяния, жизненно необходимо узнать, что она стоит на коленях и рыдает, как последняя мразь.</p>\n<p>– Нилла, если ты, блять, не выйдешь...</p>\n<p>Я слегка замялся, не подавая и грамма неуверенности и скорее оставляя угрожающую паузу между преступлением и наказанием. В ответ я услышал бросок чего-то тяжёлого, может даже бетонного в бедную грузную дубовую дверцу, от чего моя грозная рука пошатнулась и откатила свой супер-удар на второй ход.</p>\n<p>– Ален, если ты, сука, не отойдёшь...</p>\n<p>  Сказать, что я уже давно был глубоко разочарован поведением своей дочери – отрезать себе язык. Я стоял в коридоре в домашней розовой пижаме и читал очередной научный журнал, пролистывая неактуальную информацию.<br>  Учёные опять открыли планету и назвали её в честь какого-то придурка. Неужели они настолько закрытые от новых мыслей? Пора бы отбросить всё ненужное. Пора бы забыть многие традиции и искоренить необразованность. Вкладываться в это бесполезно, это нужно делать своими руками. Для чего я создал виро?</p>\n<p>  Ещё пара ударов, и дверь пошатнулась от второго... тяжёлого предмета.</p>\n<p>– ...сука! – послышался равнодушный голос с нотками печали. Неужели меня жалеет?</p>\n<p>– Нилла, – сказал я примиряющим голосом, хоть и знал, что она не поверит. – Давай ты используешь виро и найдёшь выход из наших разногласий! Вместе работать гораздо лучше, верно?</p>\n<p>  Молчание. Мёртвое. Могильное. Безмятежное, но гнойное, блевотное, вязкое. Я знал, что она бы меня пристрелила, будь у неё ружьё в руках, поэтому говорю я с ней не в других комнатах, где повсюду спрятаны орудия &quot;самозащиты&quot; на случай вооружённого нападения, а здесь, у входа в её милую, безрукую спаленку.</p>\n<p>  – Пошёл я к чёрту? ...да, мразь?! – я ударил по стене в порыве гнева и на глазах проступили скупые крокодильи слёзы.</p>\n<p>  Виро стала популярна и в других странах, нам предлагали всё больше дельных идей для обновлений, повсеместно использовали только нашу аналитическую программу, и именно сегодня пришли журналисты в наш скромный уголок гениев-разработчиков, когда часть команды разбрелась из главных офисов. Они застали меня врасплох... Хотя нет, это было наигранное удивление, ведь для камеры нужно быть более &quot;искренним&quot;.<br>  Я вспомнил заготовленный заранее текст, знал, в какие места нужно пройти, каким работникам задавать вопросы, какие ответы я должен слышать и к чему приступать далее.</p>\n<p>– Насчёт мета виро, сэр. На фотографии в центре, у вас на коленях... ваша дочь? – и я был готов вылезти из кожи, переодеться в бомжа и ушагать со своей тележкой покорять сердца помоек.</p>\n<p>– А с чего вы взяли, что у меня есть дети? – хихикнул я, прикрывая нотки ненависти смехом. – Если бы я был отцом, то дети бы во мне не нуждались. Конечно же потому, что я слишком хорош для них! – опять издевательский смешок на несколько кадров подряд.</p>\n<p>– Они не отличают плохого от хорошего. Как бы вы...</p>\n<p>– Как бы я научил их адаптироваться к современным реалиям? Никогда бы не показал то, что творится на улице. Город, деревня, поселение – детей портят люди вокруг, и нет разницы, где ты живёшь. – беру мета виро, переминаюсь с ноги на ногу и кручу кубик в руках. – А вот мета виро есть разница. Он не только проанализирует психику вашего ребёнка, но и поможет ему расставить приоритеты ориентируясь на возраст и интересы. Работает даже с самыми травмированными малышами!</p>\n<p>  Я улыбнулся и начал отвечать на вопросы о прочем бреде, постепенно вставляя неуместную рекламу. Вообще, неуместными были только самые неожиданные вопросы интервьюера, которые я попросил всё же не вставлять в репортаж. Ну не мог бы я испортить своё чадо, если бы оно у меня было, конечно. Просто я ненавижу крысиное людское любопытство.</p>\n<p>– Ну что, Роберт? Как прогресс? – с натяжной ухмылкой спросил я, разжёвывая бутерброд, невинно согревающийся в моих ладонях. – Как её результаты?</p>\n<p>– Почему, Ален?</p>\n<p>Всё.<br>Что.<br>Было.<br>В её.<br>Голове.<br>Это.</p>\n<p>&quot;Почему папа меня не любит?&quot;</p>", "r": []}, {"t": "Примечания и поправки", "a": ["PR-0055--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PR-0055.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
