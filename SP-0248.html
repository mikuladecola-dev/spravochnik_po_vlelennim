<script>const BASE="";const DOCNAME="Красный ток";
const LEAD="<p>Способность (принцип оживления) из мира Оам. Появляется дважды — 2025-11-17 (окно w0109) и 2025-12-06 (окно w0112), обе версии внутри одного и того же перечня рас и организаций мира, повторённого почти дословно.</p>";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0248-S01", "SP-0248--mehanika"], "h": "<p>Красный ток — то, во что верит Виктор, и то, чем он оживляет мёртвых. Формулировка одна и та же в обеих версиях (2025-11-17, id 385768; 2025-12-06, id 393287): «Ну и Виктор верит в красный ток что оживляет людей. И он многих оживил, но разум так и не смог в них оживить».</p>\n<p>Способность заявлена именно через веру носителя («верит в красный ток что оживляет людей»), а не как объективно описанный закон мира. При этом результат назван как состоявшийся: Виктор «многих оживил».</p>\n<p>Природа самого «тока» не объяснена ни в одной из версий.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0248-S02", "SP-0248--ogranicheniya-i-cena"], "h": "<p>Ограничение одно и оно жёсткое: ток работает на теле, но не на разуме. «Он многих оживил, но разум так и не смог в них оживить». Оживлённые остаются без разума.</p>\n<p>Прямое следствие видно на паладинах — мёртвых рыцарях, которых Виктор оживил для верующих: «паладины до хрена сильный но их ней движения предсказуемый. Они больше как роботы с повторяющими движениями» (2025-11-17, id 385768; повторено 2025-12-06, id 393287). То есть оживление даёт большую силу, но поведение получается механическим и предсказуемым.</p>\n<p>Цена оживления для самого Виктора, расход чего-либо, условия применения — в переписке не названы.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0248-S03", "SP-0248--nositeli"], "h": "<p>Единственный носитель — Виктор. Он введён в том же перечне и назван по ходу разговора: «Церковь с паладинами ( мёртвыми рыцарями которых оживил один челик, для верующих)... Организация челика который и оживил паладинов. Давай челика назовём Виктор». То есть сначала появляется безымянный «челик», ожививший паладинов, и уже в той же реплике ему даётся имя.</p>\n<p>У Виктора есть собственная организация — «Организация челика который и оживил паладинов», стоящая в перечне отдельно от Церкви с паладинами.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0248-S04", "SP-0248--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-11-17 (окно w0109, id 385768–385769), вселенная Оам.</strong> Красный ток заведён одной фразой внутри большого перечня сил мира — рядом с котами (их девять, всегда девять), апостолами (их 21), детьми мирового древа, каменным человеком с преступной организацией, азуриэлями, группировкой сестры, правительской организацией, Церковью с паладинами, пернатыми, орденом для убийства котов, вампирами-аристократами и аскизами. Задан сразу с ограничением: тело оживает, разум нет.</p>\n<p><strong>Версия 2 — 2025-12-06 (окно w0112, id 393286–393290), вселенная Оам.</strong> Тот же перечень повторён почти дословно, включая формулировку про красный ток. Ничего нового о способности не добавлено. После перечня Слава пишет: «Давай вспомним» и «В нашем мире Оэм уже существует много сторон для конфликта» (id 393289–393290) — то есть повтор сделан как напоминание расстановки сил перед новым разговором, а не как переработка.</p>\n<p>Между двумя версиями способность не менялась.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0248-S05", "SP-0248--svyaz-s-drugimi-sposobnostyami"], "h": "<ul>\n<li><strong>Церковь с паладинами</strong> — прямое применение красного тока: паладины это «мёртвые рыцари, которых оживил один челик, для верующих». Их предсказуемость и механичность движений — следствие того, что разум оживить не удалось.</li>\n<li>Связей с другими способностями в переписке не названо. В обоих окнах красный ток стоит в одном перечне с прочими силами мира, но взаимодействие с ними не описано.</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S06", "SP-0248-S06", "SP-0248--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Природа «тока» не объяснена ни в одной версии: не сказано, электричество это, вещество, энергия или что-то ещё, и почему он красный.</li>\n<li>Не сказано, работает ли красный ток на самом деле или это только вера Виктора. Формулировка «верит в красный ток что оживляет людей» соседствует с утверждением, что он «многих оживил», и в чём тут разница — не разобрано.</li>\n<li>Не сказано, связан ли красный ток с Оам, метеоритами или какой-либо другой механикой мира.</li>\n<li>Не описано, как выглядит процесс оживления, что для него нужно, есть ли ограничение по времени с момента смерти.</li>\n<li>Не сказано, продолжает ли Виктор искать способ оживить разум и есть ли у него на это гипотеза.</li>\n<li>Цели Виктора и его организации не названы.</li>\n<li>Не сказано, все ли оживлённые Виктором — паладины, или паладины лишь часть оживлённых.</li>\n<li>Между 2025-11-17 и 2025-12-06 способность не развивалась: второе появление — дословный повтор.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0248--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0061.html\">Церковь с паладинами</a>, <a href=\"GR-0062.html\">Паладины</a>, <a href=\"GR-0063.html\">Организация Виктора</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0248--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-11-17</td>\n<td>385768–385769</td>\n<td>w0109</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-06</td>\n<td>393286–393290</td>\n<td>w0112</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0248-krasnyy-tok.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0248--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0248.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
