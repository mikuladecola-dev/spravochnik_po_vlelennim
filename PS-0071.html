<script>const BASE="";const DOCNAME="Пироманта";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0071-S01", "PS-0071--proishozhdenie"], "h": "<p>Пироманта (Pyromanta) появилась в добранной четвёрке пришельцев 2024-05-10 (окно w0033). Толчком послужила фраза Славы «И надо ещё 4 пришельца» (id 167450). В ответ Миколай выдал список предложений, сгенерированных нейросетями: «2 мощные нейронки сгенерировали предложения пока что» (id 167454).</p>\n<p>В первом списке (id 167451) Пироманта идёт под номером 10, между Металлоидом (номер 9) и Нейроглифом (номер 11). Параллельно был показан второй список (id 167452) с другим набором — Изменяющий форму, Телекинетик, Мастер времени, Энергетический вампир — в котором Пироманты нет.</p>\n<p>Варианты имени, зафиксированные в материале: «9 пиромат» (запись Славы при отборе) и латинское «Pyromanta».</p>", "r": []}, {"t": "Способности", "a": ["S02", "PS-0071-S02", "PS-0071--sposobnosti"], "h": "<p>Заявленный набор из трёх способностей (id 167451):</p>\n<ul>\n<li><strong>Пирокинез</strong>: «Управляет огнем и плазмой, создавая огненные сферы, взрывы или огненные вихри».</li>\n<li><strong>Плазменная форма</strong>: «Может принимать форму плазменного облака, становясь неосязаемой и невидимой для обычных глаз».</li>\n<li><strong>Тепловое видение</strong>: «Видит в инфракрасном спектре, обнаруживая врагов через стены или в темноте».</li>\n</ul>\n<p>Этот набор в переписке не менялся и не оспаривался.</p>", "r": []}, {"t": "Внешность", "a": ["S03", "PS-0071-S03", "PS-0071--vneshnost"], "h": "<p>Внешность в переписке не описана. При отборе в основной набор Слава прямо запросил облик: «Как будут выглядеть» (id 167465), «?» (id 167466), Миколай ответил: «Ок, сейчас сделаю» (id 167467). Результата этого обещания в материале по данному персонажу нет; после отбора пошёл отдельный поиск нетривиального огненного образа.</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0071-S04", "PS-0071--svyazi-s-drugimi"], "h": "<ul>\n<li>Отобрана в один заход с двумя другими пришельцами: «7 изменять форму / 8 звук / 9 пиромат» (id 167464) — то есть вместе с Изменяющим форму и звуковым пришельцем (Омниграф в списке id 167451).</li>\n<li>Входит в ростер пришельцев 1–6 с дополнением; заявка на добор шла сразу после заявки на Псиклона (<a href=\"PS-0067.html\">Псиклон</a>, id 167449–167450).</li>\n<li>В материале с ней связаны также «Огненный пришелец — каменный чел с магмой» и «Пиромант Эшер». Как именно связаны — в переписке в пределах этого окна не сказано.</li>\n</ul>", "r": [["Псиклон", "PS-0067.html"]]}, {"t": "Как менялась — состояния по датам", "a": ["S05", "PS-0071-S05", "PS-0071--kak-menyalas"], "h": "<p><strong>2024-05-10, 08:46, id 167450–167455 (версия 1).</strong> Пироманта заявлена под номером 10 в сгенерированном списке новых пришельцев, с тремя способностями. В этот же момент существует альтернативный список (id 167452) с другими четырьмя вариантами.</p>\n<p><strong>2024-05-10, 08:57, id 167464–167467 (версия 2).</strong> Слава отбирает её в основной набор и присваивает номер 9: «9 пиромат». Номер сменился с 10 на 9 — при отборе нумерация идёт по своему, укороченному списку. Тут же запрашивается облик.</p>", "r": []}, {"t": "Отклонённые варианты", "a": ["S06", "PS-0071-S06", "PS-0071--otklonennye-varianty"], "h": "<p>Из двух предложенных четвёрок в основной набор пошли позиции первого списка (id 167451). Второй список (id 167452) — Изменяющий форму (7), Телекинетик (8), Мастер времени (9), Энергетический вампир (10) — в отборе Славы отражён только частично: под номером 7 он взял «изменять форму». Телекинетик, Мастер времени и Энергетический вампир в набор не попали. Также не попали Металлоид и Нейроглиф из первого списка.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0071-S07", "PS-0071--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Написание «пиромат» у Славы — похоже, сокращение от Пироманты, но прямо это не сказано.</li>\n<li>Внешность не описана; обещанные изображения в текстовом архиве отсутствуют.</li>\n<li>Пол персонажа. Имя и формулировки способностей даны в женском роде («становясь неосязаемой и невидимой»), но отдельно это не обсуждалось.</li>\n<li>Характер, происхождение, биография, роль в сюжете не обсуждались.</li>\n<li>Связь с «Огненным пришельцем — каменным челом с магмой» и с «Пиромантом Эшером» в переписке не раскрыта.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0071--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0067.html\">Псиклон</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0067.html\">Псиклон</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0014.html\">игра бога</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0071--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-05-10</td>\n<td>167450–167455</td>\n<td>w0033</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-05-10</td>\n<td>167464–167467</td>\n<td>w0033</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0071-piromanta.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0071--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0071.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
