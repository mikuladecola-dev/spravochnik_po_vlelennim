<script>const BASE="";const DOCNAME="Отряд: Старик, Рыжий, Доктор, Капитан";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0016-S01", "GR-0016--chto-eto"], "h": "<p>Отряд из четырёх солдат, который в истории про Бессмертного подбирает мальчика, вылезшего из братской могилы, и сопровождает его. В переписке отряд ни разу не назван по имени как соединение — соавторы перечисляют его через прозвища участников: «Старик, рыжий, Доктор и капитан» (2025-03-10, id 300765). Миколай в том же окне называет их «команда старика» (2025-03-10, id 300790).</p>\n<p>Отряд появляется внутри большой прозы Славы от 2025-03-03 (id 297458–297463), в её второй половине: первая половина — это столкновение мальчика с немцами, а солдаты выходят на сцену уже после того, как мальчик умер, очнулся заново в братской могиле и пошёл по полю (id 297460).</p>\n<p>Изначально Миколай понял их как немцев: «немцы некоторые знают этого мальчика, некоторые понимают его речь (старик вроде понимает)» (2025-03-10, id 300761). Слава ответил «Нет» (id 300762) и поправил: «Старик, рыжий, Доктор и капитан русский солдаты, вот поэтому он их понимает» (id 300765). То есть национальность отряда — не деталь фона, а объяснение того, почему мальчик понимает их речь и не понимал немцев.</p>\n<p>Отдельной записи в базе ни на одного из четверых нет — они существуют только внутри записи об отряде, записи о Бессмертном и записи о деревне Лихой.</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0016-S02", "GR-0016--sostav"], "h": "<p>Четыре человека. Собственных id у участников в базе нет — они не заведены как отдельные персонажи, поэтому ниже даны их прозвища в том виде, в каком они звучат в переписке.</p>\n<ul>\n<li><strong>Капитан</strong> — он же «командир». Оба слова употребляются в прозе для одного и того же человека («Сказал капитан», «Сказал командир», id 297460–297462). При первом появлении описан как «мужчина, явно повидавший много» (id 297460).</li>\n<li><strong>Старик</strong> — «самый старший среди них» (id 297460). Также «старый» в обращении командира: «Эй старый давайте отойдем» (id 297461).</li>\n<li><strong>Рыжий</strong> — он же «рыжеволосый», он же «рыжий паренек, не старший 30» (id 297460).</li>\n<li><strong>Док</strong> — он же «доктор», «их него единственного доктора» (id 297461).</li>\n</ul>\n<p>Имён (не прозвищ) ни у кого из четверых в переписке нет. Званий, кроме «капитан», тоже нет.</p>", "r": []}, {"t": "Общие способности группы", "a": ["S03", "GR-0016-S03", "GR-0016--obschie-sposobnosti-gruppy"], "h": "<p>Никаких сверхъестественных способностей у отряда не названо. Это обычные солдаты военного времени. Что за ними числится по тексту:</p>\n<ul>\n<li><strong>Русская речь.</strong> Ключевое общее свойство, названное прямо: они русские солдаты, «вот поэтому он их понимает» (2025-03-10, id 300765). Немцев мальчик до этого не понимал: «те люди что-то кричали, на каком-то странном языке» (id 297458).</li>\n<li><strong>Вооружение и готовность к бою.</strong> У старика автомат («уже выставля автомат вперёд в лес», id 297461); в сцене с апостолом на пришедшего направлены «четыре ствола» (id 297463). Против эльфа они стреляют, но безуспешно: «как и кровавый руки, их ней пули просто изменяли траекторию» (id 297461).</li>\n<li><strong>Задание разведки.</strong> Отряд идёт в деревню Лихую по заданию: «Как и по заданию, мы узнали обстановку и доложим в штаб» (id 297462). До того капитан формулирует то же самое: «Прибыли мы сюда лишь, для получения информации и все» (id 297461).</li>\n</ul>", "r": []}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0016-S04", "GR-0016--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p><strong>Капитан (командир).</strong> Отдаёт распоряжения: «Ладно давайте привал», «Ну это не сегодня… Ладно, переночуем», «ВСЁ закругляимся!!», «Пойдём в деревню Лихую, как и задумывали» (id 297460–297462). Он же первым связывает мальчика с побоищем: «Я конечно не верующий, но здесь сложить 2+2, и будет ясно, что этот паренёк из могилы этой вылез и закончил жизнь наших недругов» (id 297461). Он же предлагает убить мальчика: «И это, нам бы наверное, не помешало бы его устранить». В той же сцене за ним закреплён внутренний монолог о том, что докладывать штабу: «у нас возможный зомби и кто он я не знаю, ну это почти, что факт… а про мальца говорить. Наверное не надо, ведь ещё не факт, что он причастен, да и провоцировать его тоже не охота» (id 297461). Ему же в бою с эльфом принадлежит мысль о ране в груди мальчика: «Идеальный круг, но не посередине ТЦ обид..» (id 297461).</p>\n<p><strong>Старик.</strong> Самый старший и советник командира: «Хоть он и был командиром, но он часто полагался как на советника, старика, у которого был большой опыт и знания» (id 297461). Он первый предлагает подойти к мальчику («Пошлите подойдем, чтоли»), он же осаживает остальных: «Да отойти, вы от него. Словно бараны на новый ворота смотрите. Видите он и слова проронить не может, пока перед ним, четыре взрослых дылды с оружиям стоять» (id 297460). Он кормит мальчика («Эй кушать хочешь? Хотя че я спрашиваю, конечно хочешь»), он же пытается его расспросить и потом докладывает капитану, что ничего не вышло: «Как, как, никак!. Ничего о себе не знает ни возраст, ни имя, ни где живёт, ни кто родители» (id 297460–297461). Он же прикрывает ребёнку глаза на месте побоища: закрывал глаза мальчику, «хотя он уже и понимал, что мальчик это уже видел, но всё же закрыл. „Не зачем ещё больше травм для ребёнка“ Подумал он» (id 297461). Он же отговаривает командира убивать мальчика двумя доводами: «Вон смотри, его танки не взяли, думаешь мы сможем» и «Да и лучше не предринемать попыток, а то кто знает, как может закончиться, да и тем более если бы он захотел нас убить то давно бы убил бы» (id 297461). В сцене нападения эльфа меч летит именно в старика, и мальчик отталкивает его, приняв удар на себя (id 297461). После ухода апостола именно старик первым приходит в себя: «Чуть ли не на руках понёс своих товарищи в противоположную сторону» (id 297463).</p>\n<p><strong>Рыжий (рыжеволосый).</strong> Самый молодой — «не старший 30» (id 297460). За ним закреплены вопросы: он первым замечает мальчика («Эй капитан, смотри там пацан идёт»), спрашивает про глаза («Ты лучшее посмотри на глаза его, он что слепой?»), спрашивает Дока про диагноз («Док, а что за болезнь или мутация при котором глаза светятся и белый словно у слепого, при этом он всё видет?»), спрашивает, откуда мальчик, переспрашивает про цистерну с трупами, спрашивает, что делать с пацаном (id 297460–297461). Он же ухмыляется названию деревни: «Хм, Лихая и кто дал название такое» (id 297461). Утром при виде залитых кровью танков реагирует он: «Вот тебе на!» — и он же не хочет там оставаться: «И что делать будем?» Спросил рыжеволосый, явно не желая, здесь оставаться» (id 297461).</p>\n<p><strong>Док (доктор).</strong> Молчит дольше всех: «А Док молчал. Ему не нравилась, это вся картина» (id 297460). Его реплики — экспертные заключения. Про кровь на мальчике: «Да не ранен он, смотри не одной раны. Это не его кровь» (id 297460). Про глаза: «Не знаю, впервые вижу подобная, да и слышу тоже» (id 297461). Про голову мальчика: «Ладно, уже понятно что у мальчика с головой не всё ладно» (id 297461). Про раны на немцах: «Раны резаный, а в танке, словно бомбу взорвали… но здесь прям месиво словно медведь, не, что-то другое» и «Я не знаю, чем их так могли, да и кто мог, я не слышал, чтобы у нас новая оружия создавали, а если это оружия Немцов, то нафиг они сами себя так» (id 297461). Недоверие к мальчику показано через него: «Спросил док, поглядывая на мальца, явно пытаясь показать, что не доверяет ему» (id 297462).</p>\n<p><strong>Отдельно — кто именно опасался мальчика.</strong> В переписке 2025-03-10 это стало предметом спора. Слава: «Там же в тексте было сказано их ней подозрения насчёт Бессмертного» (id 300796). Миколай: «ну ток рыжий опасался бесмертного» (id 300797) и «да и то что имено его боятся не особо понятно» (id 300798), «типа я подумал че им ребенка бояться» (id 300800), «но да было чет про опасение» (id 300801). Расхождение осталось нерешённым: Слава считает подозрения отряда прописанными, Миколай вычитал опасение только у рыжего.</p>", "r": []}, {"t": "Иерархия", "a": ["S05", "GR-0016-S05", "GR-0016--ierarhiya"], "h": "<p>Двухслойная и названа прямо.</p>\n<p>Формально командует капитан — он объявляет привал, ночёвку, выход, конец работы (id 297460–297462).</p>\n<p>Фактически решения он проверяет на старике: «Хоть он и был командиром, но он часто полагался как на советника, старика, у которого был большой опыт и знания» (id 297461). Оба разговора, где что-то решается всерьёз, — разговоры капитана со стариком наедине, в стороне от остальных: «Эй старый давайте отойдем» (id 297461). Когда старик высказал возражение против убийства мальчика, он не стал ждать ответа: «Закончил свою тераду старик и пошёл к парнишки, давая время подумать командиру» (id 297461). Решение убивать мальчика не было принято.</p>\n<p>Старик обозначен и как старший по возрасту — «Прикрикнул самый старший среди них» (id 297460), — и его окрик на всех троих остальных проходит без возражений.</p>\n<p>Док — единственный медик в отряде, «их него единственного доктора», и вопросы медицинского и опознавательного характера капитан адресует ему (id 297461).</p>\n<p>Рыжий в этой иерархии — младший: он задаёт вопросы, но ничего не решает.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S06", "GR-0016-S06", "GR-0016--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>Немцы.</strong> Противник. Прямых боевых сцен между отрядом и немцами в переписке нет — отряд видит только результат: «танки наполненый по самый края, кровью. И трупы раскинутые на дороге» (id 297461). Немцев уничтожил Бессмертный. Капитан говорит о них «наших недругов» (id 297461).</p>\n<p><strong>Бессмертный (мальчик из братской могилы, <a href=\"PS-0211.html\">Мальчик из братской могилы (Бессмертный)</a>).</strong> Отряд подбирает его, кормит и ведёт с собой; в планах — «оставив его, где нибудь в населёном пункте, где наши» (id 297460). Параллельно у отряда копятся подозрения. После деревни Лихой капитан ставит вопрос об устранении, старик его снимает (id 297461). В бою с эльфом мальчик спасает старика, приняв удар меча на себя (id 297461). Заканчивается связь тем, что мальчика уносит апостол.</p>\n<p><strong>Эльф с ветряным мечом.</strong> Нападает на отряд из леса — первым его замечает мальчик: «А там кто-то странный», «у него длинная железная палка», «Один» (id 297461). Отряд стреляет, пули меняют траекторию. Слова эльфа отряду непонятны: «Ни кто из отряда не понял смысла его слове» (id 297461).</p>\n<p><strong>Апостол (мужчина со шрамами-слезами).</strong> Убивает эльфа и выходит из леса с трупом. На него направлены «четыре ствола», он их игнорирует. Отряду он ставит условие: «Вы ничего не видите и не слышали, а если попытаетесь кому-то рассказать, я первый об этом узнаю» — сказано «приказным тоном, словно мы только что, составили контракт с дьяволом» (id 297463). После этого он забирает тело мальчика и уходит. В разборе 2025-03-10 Миколай называет этого персонажа «дед с шрамами слезами кто-то из апостолов» (id 300761); отдельно в том окне он не разъяснён.</p>\n<p><strong>Штаб.</strong> Задание отряда — разведка обстановки и доклад. Про мальчика докладывать капитан решает не докладывать: «а про мальца говорить. Наверное не надо» (id 297461). Чем кончился доклад — в переписке не сказано.</p>", "r": [["Мальчик из братской могилы (Бессмертный)", "PS-0211.html"]]}, {"t": "Как менялась — по датам", "a": ["S07", "GR-0016-S07", "GR-0016--kak-menyalas"], "h": "<p><strong>2025-03-03 (id 297458–297463).</strong> Отряд появляется в прозе Славы в готовом виде: четыре человека, прозвища, роли, иерархия, встреча с мальчиком, деревня Лихая, бой с эльфом, появление апостола. Национальность в самой прозе не проговаривается отдельным заявлением — она читается из речи персонажей и из противопоставления немцам.</p>\n<p><strong>2025-03-10 (id 300761–300765).</strong> Правка национальности. Миколай изложил своё понимание: отряд — немцы, часть из которых знает мальчика и понимает его речь, и у кого-то из них «есть ремень или брелок связанная с мальчиком» (id 300761). Слава ответил «Нет» (id 300762) и переформулировал: «Старик, рыжий, Доктор и капитан русский солдаты, вот поэтому он их понимает» (id 300765). Отклонённые в этом обмене варианты: немецкая принадлежность отряда; знание кем-то из отряда мальчика заранее; предмет (ремень или брелок), связывающий кого-то из отряда с мальчиком. Пахнущий Бессмертным предмет в истории есть, но он у немца, а не у этого отряда: «Бессмертного убили пистолетом, который потом им пахнет» (id 300765), в прозе — «железная штука, который висит у него на бедре» (id 297459).</p>\n<p><strong>2025-03-10 (id 300775–300829).</strong> Разбор того, что в тексте прочитывается, а что нет. Слава перечисляет улики: «Немцы, железная которая пахнет бессмертным, сами немцы который пахнут трупами, и братская могила» (id 300775). Миколай возражает против такого способа подачи: «сейчас бы не советовал заниматься математикой в историях, отражать мысли разжевывая неприятно и я сам никогда к такому не стремился но думаю сейчас важнее» (id 300785) и раньше — «сложность истории по другому можно создать, а так для начала лучше писать ясно то что в голове» (id 300776). В том же разборе Миколай сообщает, что принял за монстра, которого боится «команда старика», эльфа; Слава поправляет: «Монстр это Бессмертный» (id 300790–300793).</p>\n<p>Изменений в составе, прозвищах или ролях после 2025-03-03 в переписке нет — правился только вопрос о том, чьи это солдаты, и вопрос о том, кого и насколько отряд опасался.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "GR-0016-S08", "GR-0016--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имён участников нет — только прозвища «старик, рыжий, Доктор и капитан».</li>\n<li>Званий, кроме «капитан», нет; кто такой Док по должности точнее «единственный доктор» — не сказано.</li>\n<li>Номера, названия части и рода войск отряда в переписке нет.</li>\n<li>Возраст назван только у рыжего («не старший 30») и относительно — у старика («самый старший среди них»).</li>\n<li>Внешность описана только у рыжего (по цвету волос). Как выглядят капитан, старик и Док — не сказано; про капитана есть только «явно повидавший много».</li>\n<li>Что было с отрядом после ухода апостола с телом мальчика — не сказано. Известно только, что старик увёл товарищей в противоположную сторону.</li>\n<li>Выполнили ли они приказ апостола молчать и что доложили в штаб — не сказано.</li>\n<li>Отдельных записей в базе ни на одного из четверых нет; поле участников в плане группы пустое.</li>\n<li>Расхождение по опасениям отряда (все подозревали мальчика или опасался только рыжий) осталось нерешённым.</li>\n<li>Кто такой «дед с шрамами слезами», которого Миколай отнёс к апостолам, в окне 2025-03-10 отдельно не разъяснён.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0016--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0211.html\">Мальчик из братской могилы (Бессмертный)</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0016--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0016.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0016-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0016/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>По числам этот отряд почти ничего не блокирует: на <code>PS-0219</code> одна ссылка, у самой группы ноль, база под ней 7 997 знаков. Имена четверых — дыра дешёвая, её можно не чинить вовсе.</p>\n<p>Дорогая дыра здесь одна, и она названа в статье последней строкой пробелов: «дед с шрамами слезами» не опознан. При этом в базе он лежит — <code>PS-0272</code> «Шрамы-слёзы на лице Александра», статья есть, база 15 938 знаков, и ноль ссылок на неё. Пятнадцать килобайт материала стоят несвязанными, а статья про отряд заканчивается тем, что персонаж неизвестен.</p>\n<p>Второе по цене — <code>PS-0211</code> «Мальчик из братской могилы»: три ссылки, статья 36 542 при базе 58 295. Это единственная сущность, на которой отряд действительно висит, и в базе под ней почти вдвое больше, чем попало в статью.</p>\n<h3>С чего начать</h3>\n<p>В базе, искать в архиве почти нечего. Свести <code>PS-0272</code> с финальной сценой (id 297463) и посмотреть, сходится ли Александр с апостолом, который выходит из леса с трупом эльфа. Рядом — <code>PS-0212</code> «Эльф с ветряным мечом», 41 260 знаков базы: сцена нападения расписана там подробнее, чем в статье про отряд, и часть непонятного («слова его никто не понял») может закрываться оттуда.</p>\n<p>По самим четверым отдельных записей нет ни одной — ни капитана, ни старика, ни рыжего, ни дока. Значит либо заводить их из уже разобранной прозы 2025-03-03 (id 297458–297463), либо признать, что отдельных карточек им не нужно. В архив стоит сходить только за одним: чем кончился доклад в штаб и что было с отрядом дальше — смотреть окна после 2025-03-10, начиная с id 300829, и дальше по датам разбора истории про Бессмертного (до id 302886).</p>\n<h3>Как развивалось</h3>\n<p>Здесь другая форма, чем обычно: не заявили и потом наполнили, а сразу выложили целиком. 2025-03-03 отряд появляется в прозе готовым — четыре человека, прозвища, роли, двухслойная иерархия, сцены. Дальше единственная правка 2025-03-10, и она не про отряд, а про то, как его прочитали: Миколай понял солдат как немцев, Слава ответил «Нет» и объяснил национальность через понимание речи. В том же окне возник спор о том, кто именно опасался мальчика, и он не закрыт. После 2025-03-10 к отряду не возвращались ни разу.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Язык здесь введён как рабочий барьер и проговорён дважды: мальчик не понимает немцев («на каком-то странном языке»), и не понимает эльфа («ни кто из отряда не понял смысла его слове»). Отряд понятен именно потому, что русские, и это сказано прямым текстом как объяснение. Для апостола, который выходит из леса и ставит отряду условие, вопрос языка не возникает вообще — его слова просто поняты и переданы. Правило названо для двух случаев из трёх, для соседнего такого же — нет.</p>\n<h3>Отклик</h3>\n<p>Сильнее всего тут один жест: старик закрывает мальчику глаза на месте побоища, понимая, что тот всё это уже видел, и всё равно закрывает — «не зачем ещё больше травм для ребёнка». Действие бессмысленное по факту и точное по человеку, и оно стоит в тексте без объяснения. Рядом работает капитан, который решает не докладывать про мальчика в штаб не из жалости, а по расчёту: «ещё не факт, что он причастен, да и провоцировать его тоже не охота». Отряд вообще держится на том, что четверо взрослых мужчин не знают, что делать с ребёнком, и обсуждают его убийство ровно так, как обсуждали бы любую другую неопределённость на задании. Зацепило и то, что вся сцена с эльфом и апостолом дана глазами людей, которые ничего не понимают в происходящем и просто держат стволы — редкий для этого материала ракурс снизу.</p></div>", "r": []}];</script>
