<script>const BASE="";const DOCNAME="Сквозной удар";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0166-S01", "SP-0166--mehanika"], "h": "<p>Удар, проходящий сквозь мягкое и застревающий в твёрдом. Формулировка Миколая: «сквозной удар хз, уходящий в твёрдое игнорирующий мягкое» (2025-01-06, id 279015). Дальше он уточнил адресность урона: «тобиж урон доспехам и костям мб» (id 279016), «коже и мышцам нет» (id 279017).</p>\n<p>То есть доспехи и кости получают урон, кожа и мышцы — нет.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S02", "SP-0166-S02", "SP-0166--nositeli"], "h": "<p>Не назначен никому. Предлагался как кандидат на роль пятого базового умения благословённых дьявола.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S03", "SP-0166-S03", "SP-0166--kak-menyalas-po-versiyam"], "h": "<p>Одна версия, 2025-01-06 (окно w0070, сообщения 279015–279021). Описан в трёх сообщениях подряд, после чего сам автор от него отказался в том же разговоре.</p>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S04", "SP-0166-S04", "SP-0166--otklonennye-varianty"], "h": "<p>Отклонён целиком. Сразу после описания Миколай отступил от собственного предложения: «а если серьёзно я хз» (id 279018), «реально» (id 279019), «кроме яда ниче уместнее не могу найти» (id 279020). Слава закрыл вопрос: «Ладно пока просто выкинем» (id 279021).</p>\n<p>Из этого же куска видно, что в качестве альтернативы на ту же позицию рассматривался яд — как единственное, что Миколай счёл уместным.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0166-S05", "SP-0166--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Часть базовых умений благословённых дьявола — как незанятая пятая позиция в наборе.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "SP-0166-S06", "SP-0166--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Что происходит с ударом после того, как он «уходит в твёрдое», не описано.</li>\n<li>Дальность, форма, источник удара не названы.</li>\n<li>Слово «пока» в «пока просто выкинем» оставляет вопрос о возвращении к варианту открытым — к нему в материале не возвращались.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["SP-0166--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-01-06</td>\n<td>279015–279021</td>\n<td>w0070</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0166-skvoznoy-udar.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0166--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0166.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["SP-0166-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/SP-0166/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первое — яда нет как записи. Он назван на ту же самую позицию, что и сквозной удар, отвергнут односложным «Не» и при этом до конца разговора остаётся у Миколая эталоном уместности: «кроме яда ниче уместнее не могу найти». Записи с таким именем в наборе нет ни одной — ни статьи, ни базы. Ближайшее по смыслу — <code>SP-0140</code> «Скверна (ядовитая мана)»: 6 563 знака базы, статьи нет, вселенная «неясно», ноль ссылок; связан ли он с тем ядом, неизвестно, потому что читать некому. Главный конкурент этой способности не заведён вообще.</p>\n<p>Второе — поздние версии базовых наборов лежат вне вселенной. <code>SP-0241</code> «Четыре основные способности благословенных» — 9 573 знака базы, статьи нет, вселенная «неясно»; <code>SP-0240</code> «Благословение правителя» — 9 835, тоже без статьи; <code>SP-0147</code> «Магия контроля (благословения)» — 9 406, без статьи. Почти тридцать тысяч знаков про устройство наборов, помеченных «неясно». Пятая позиция, ради которой сквозной удар и придуман, скорее всего решается именно там — и обратите внимание, что поздняя запись называется «четыре основные», а не пять.</p>\n<p>Третье — статья не подцеплена. <code>SP-0165</code> «Базовые умения благословенных дьявола» (статья 10 079 при 5 226 базы, одна ссылка) прямо называет сквозной удар вариантом пятого умения, а в обратную сторону ссылки нет: у <code>SP-0166</code> ноль ссылающихся при том, что он появился ровно в том разговоре и больше нигде. Чинится одной строкой в блоке связей.</p>\n<h3>С чего начать</h3>\n<p>В базе. Первым — <code>SP-0241</code>, <code>SP-0240</code>, <code>SP-0147</code>: там поздние формулировки наборов, и по ним видно, вернулись ли к пятой позиции или набор ужался до четырёх. Затем <code>ID-0143</code> «Благословенный дьяволом» — 3 149 знаков, 2025-05-14 — 2025-05-15, статьи нет: единственное касание темы через четыре месяца после этого разговора.</p>\n<p>В архив — за словом «пока». «Ладно пока просто выкинем» подразумевает возврат, а материала о возврате нет. Смотреть окно w0070, 2025-01-06, правее id 279021 и до конца дня, дальше ближайшие дни и начало w0071 (2025-01-13). Второй ориентир — левая граница: id 278982–278996, где перечисляется божий набор и Миколай впервые предлагает яд и глаза; статья начинает историю с 279015, но конкурс на эту позицию идёт с самого начала разговора.</p>\n<h3>Как развивалось</h3>\n<p>Одна дата — 2025-01-06, окно w0070, семь сообщений. Заявили тремя репликами подряд: сквозной удар, урон доспехам и костям, коже и мышцам нет (279015–279017). Ограничили сразу и сами: в следующей же реплике «а если серьёзно я хз», «реально», «кроме яда ниче уместнее не могу найти» — то есть автор снял собственное предложение через одну строку после того, как его закончил. Закрыли снаружи: «Ладно пока просто выкинем» (279021). Забывания как отдельного этапа не было — вариант умер быстрее, чем успел забыться; возврата тоже нет. От всей способности осталось единственное содержательное различение — по материалу цели.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>У сквозного удара названо, по чему он действует и по чему нет: твёрдое — да, мягкое — нет. Это единственная способность в наборе, у которой адресность вообще проговорена. Рядом в том же наборе стоят аура и умение чувствовать намерения людей — на кого они действуют, а на кого не действуют, не сказано ни одним словом; про регенерацию и усиление то же самое. Для отклонённого варианта различение цели названо, для четырёх принятых, лежащих в том же перечислении, — нет.</p>\n<h3>Отклик</h3>\n<p>Хороша сама картинка, и она перевёрнута относительно привычного: обычно броня держит, а мясо разрубается. Здесь наоборот — кожа и мышцы удара не замечают, а ломается то, на чём человек стоит: доспех и кость. Раненого нет, есть человек, который просто складывается. Это страшнее прямого урона и придумано в одной строке из четырёх слов — «уходящий в твёрдое игнорирующий мягкое». И тем заметнее, что автор бросил его через реплику: не потому, что плохо, а потому что не подошло к позиции, куда его пытались всунуть. Запись короткая, но в ней хорошо видно, как удачная деталь гибнет не от критики, а от неподходящей вакансии.</p></div>", "r": []}];</script>
