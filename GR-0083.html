<script>const BASE="";const DOCNAME="Правительство (Феня)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0083-S01", "GR-0083--chto-eto"], "h": "<p>Правительство — организация современного мира апостолов вселенной «Феня». Заявлено одной репликой Славы (2025-12-17, id 399612): «Бля ещё правительства. А точнее челик без способностей, что будет его представителем. И будет пытаться помогать апостолом, считая их сдерживающий силой».</p>\n<p>Из этой формулировки видно, что правительство названо сразу вместе со своим представителем и что дальше разговор идёт уже про представителя, а не про саму организацию: «А точнее челик без способностей, что будет его представителем». Как устроено само правительство, из кого состоит, чем занимается и как относится к апостолам как ведомство — в переписке не сказано ничего.</p>\n<p>Правительство упомянуто в перечне того, что есть в мире апостолов (<a href=\"MR-0188.html\">Мир апостолов (современный)</a>): мир современный, и в нём есть правительство, апостолы, Бог красок и Серафим. Мир уточняли отдельным вопросом: Миколай спросил «а че за мир», предположил «современный?», Слава подтвердил — «Оэм. Современный» (2025-12-17, id 399631–399634).</p>", "r": [["Мир апостолов (современный)", "MR-0188.html"]]}, {"t": "Состав", "a": ["S02", "GR-0083-S02", "GR-0083--sostav"], "h": "<ul>\n<li><a href=\"PS-0341.html\">Представитель правительства без способностей</a> — представитель правительства без способностей. Единственный названный участник. Имени у него нет.</li>\n</ul>\n<p>Больше никого в состав не назвали. Поимённого состава правительства нет; сказано только, что у него есть представитель.</p>", "r": [["Представитель правительства без способностей", "PS-0341.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0083-S03", "GR-0083--obschie-sposobnosti-gruppy"], "h": "<p>У единственного названного участника способностей нет — это прямо заявленный признак: «челик без способностей». Есть ли способности у кого-то ещё в правительстве, в переписке не сказано.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S04", "GR-0083-S04", "GR-0083--otnosheniya-s-drugimi-gruppami"], "h": "<p>С апостолами. Представитель правительства «будет пытаться помогать апостолом, считая их сдерживающий силой» (2025-12-17, id 399612). Помощь описана как попытка — «будет пытаться помогать», — а мотив назван прямо: апостолы для него сдерживающая сила.</p>\n<p>Отношение самого правительства как организации к апостолам не названо: сказано только про представителя. Знают ли апостолы о нём, принимают ли помощь, осталось нерешённым.</p>\n<p>С Богом красок и Серафимом правительство связей не имеет — они просто перечислены рядом с ним как то, что есть в этом мире (<a href=\"MR-0188.html\">Мир апостолов (современный)</a>).</p>", "r": [["Мир апостолов (современный)", "MR-0188.html"]]}, {"t": "Как менялась — по датам", "a": ["S05", "GR-0083-S05", "GR-0083--kak-menyalas"], "h": "<p><strong>2025-12-17, окно w0114, id 399603–399642.</strong> Единственный заход. Слава вводит правительство и тут же сводит его к представителю — человеку без способностей, помогающему апостолам из расчёта на них как на сдерживающую силу (id 399612). Миколай уточняет мир, получает ответ «современный» (id 399631–399634). На этом обсуждение обрывается: сам Слава откладывает продолжение — «И что поговорим при встрече?» (id 399632), — и вечер закрывается.</p>\n<p>К правительству больше не возвращались; версия одна.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "GR-0083-S06", "GR-0083--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Названия у организации, кроме слова «правительство», нет.</li>\n<li>Поимённого состава нет; кроме представителя, никто не назван.</li>\n<li>Имени у представителя нет.</li>\n<li>Чем правительство занимается, какими средствами располагает и есть ли у него структура — в переписке не сказано.</li>\n<li>Иерархии нет: кто отправил представителя, перед кем он отчитывается и говорит ли он от лица правительства официально или сам по себе — не сказано.</li>\n<li>Отличий между участниками нет — участник назван один.</li>\n<li>Позиция правительства по отношению к апостолам не заявлена: заявлена только личная позиция представителя.</li>\n<li>Отклонённых вариантов нет — обсуждения, в котором что-то могли забраковать, не было.</li>\n<li>Название вселенной в этом окне так и не прозвучало (отмечено в <a href=\"MR-0188.html\">Мир апостолов (современный)</a>).</li>\n<li>Продолжение разговора отложено до личной встречи и в переписке не зафиксировано.</li>\n</ul></div>", "r": [["Мир апостолов (современный)", "MR-0188.html"]]}, {"t": "Связи — всё вместе", "a": ["GR-0083--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0341.html\">Представитель правительства без способностей</a></li>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0188.html\">Мир апостолов (современный)</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0083--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0083.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0083-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0083/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>В самой записи дорогой дыры нет: на <code>GR-0083</code> не ссылается никто (0 входящих), а обе сущности, на которые она ссылается, — <code>PS-0341</code> Представитель правительства без способностей (2 ссылки, 2539 знаков базы) и <code>MR-0188</code> Мир апостолов современный (3 ссылки, 2409 знаков) — статьи имеют. Настоящая дыра лежит на шаг вбок, в том же кусте «мира апостолов». Первым стоит чинить <code>SL-0054</code> «Список 12 апостолов»: на него ссылаются семь статей, статьи у него нет, а в базе лежат 234 052 знака — это крупнейший неразобранный кусок во всём реестре, и он держит именно апостолов, рядом с которыми правительство и заявлено. Вторым — <code>SL-0129</code> «Список того, что надо придумать по миру» (Феня): три ссылки, статьи нет, 4085 знаков. Это собственный перечень авторов о том, чего в мире не хватает; пока он не развёрнут, каждая тонкая запись вроде этой висит без опоры.</p>\n<p>Отдельно стоит отметить перекос: <code>MR-0188</code> при трёх входящих ссылках держится на 2409 знаках базы. Три статьи опираются на запись, у которой материала меньше, чем у любой из них.</p>\n<h3>С чего начать</h3>\n<p>Не в архиве. Разговор про правительство ушёл в оффлайн — Слава сам его закрыл: «И что поговорим при встрече?» (id 399632). Всё, что вообще было сказано, укладывается в id 399612 и 399631–399634 одного вечера, окно w0114, 2025-12-17.</p>\n<p>Материал, который может к нему относиться, разъехался по соседям того же вечера: <code>PS-0341</code> (2539), <code>MR-0188</code> (2409). Обе записи тонкие и из того же окна — вместе они дадут не больше, чем уже есть в статье. Реальный смысл имеет только <code>SL-0129</code> (4085 знаков базы, статьи нет): если правительство где-то расписано списком, то там. И <code>SL-0054</code> — 234 052 знака по апостолам, разбор которых покажет, есть ли в мире вообще место для ведомства.</p>\n<p>Если всё-таки идти в архив, ориентир такой: интервал от id 399642 до конца отрезка «Фени» — 2025-12-09 … 2026-02-06 (закрывается возвратом к Семи островам, id 429361). Искать слово «правительство» в связке с апостолами и «сдерживающей силой». По статье возврата не было, так что вероятнее подтвердить пустоту, чем что-то найти.</p>\n<h3>Как развивалось</h3>\n<p>Заявили и ограничили в одной реплике: «Бля ещё правительства. А точнее челик без способностей, что будет его представителем» (id 399612). Полфразы на организацию, дальше уже только про человека. Затем уточняли не её, а соседнее — Миколай спросил про мир, получил «Оэм. Современный» (id 399631–399634). Потом отложили: «поговорим при встрече» (id 399632). Не вернулись — ни в оставшиеся полтора месяца отрезка «Фени», ни позже. Стадии «забыли» здесь нет, потому что нет и стадии, где вещь успела бы пожить: заявка и отсрочка стоят в одном окне.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>В этом же окне уточняющий вопрос был задан — и сработал: Миколай спросил «а че за мир», предположил «современный?», получил подтверждение. Мир после этого перестал быть неопределённым. Правительство названо в той же реплике, что и мир, и такого же рода вопроса — что это за правительство, чьё оно, страна это или что-то другое — никто не задал. Для одной сущности приём применён, для соседней, введённой той же фразой, — нет.</p>\n<h3>Отклик</h3>\n<p>Зацепило, как реплика съедает сама себя на ходу. Названа организация — и через четыре слова от неё остаётся один человек без способностей: «А точнее челик без способностей». Это не пробел, это движение мысли, которое видно прямо в тексте: сначала институт, потом сразу конкретное лицо, потому что писать интересно про лицо. И мотив у этого лица не тёплый — он помогает апостолам не из симпатии, а «считая их сдерживающий силой». Человек без сил держится за тех, кто силён, как за тормоз. Из одной строки это довольно много. За её пределами в записи, честно говоря, нет ничего.</p></div>", "r": []}];</script>
