<script>const BASE="";const DOCNAME="Агент АЗИП";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0277-S01", "PS-0277--proishozhdenie"], "h": "<p>Агент АЗИП — не одно лицо, а категория действующих лиц. Определение дано 2025-05-28: «Агент- это люди или чужемирцы, которых завербовали в организацию АЗИП. И их главная цель уничтожения опасных существ. Буть то люди или чужемирцы» (id 330909).</p>\n<p>Агентом становятся по контракту: «у них есть контракт», «по которому их завербовали» (Миколай, id 330935–330936).</p>\n<p><strong>Путь кандидата</strong> (2025-05-29, id 331072, Пункт 1). «Кандидат, будь то человек или чужемирец, обязаны будете пройти 6 месяцовую подготовку. И по завершению подготовке обязаны пройти тест». Если тест не пройден — ещё три месяца подготовки и повторная попытка экзамена. «Если уже и в этот раз у вас ничего не вышло. То вы обязаны покинуть АЗИП и не применять полученный знаний и умения». За нарушение этого пункта следует наказание, «в зависимости от нарушения, который будут указана в Приложении 1». Сдавшему тест выдаётся основное снаряжение, открывается ограниченный доступ к информации АЗИП и появляется право выполнять миссии.</p>\n<p><strong>Выход из организации.</strong> На вопрос Миколая «они могу выйти из неё выйти? или это пожизненно?» (id 330938–330939) ответ был: «Желательно да. Но если вы всё же решите покинуть организацию АЗИП. То вы обязаны подписать документы. О том, что не будете применять знания и умения, который получили в организации. А также не раскрывать информацию о том, что не следует знать гражданским. При случае нарушения контракта вы будете наказаны» (id 330940).</p>", "r": []}, {"t": "Способности", "a": ["S02", "PS-0277-S02", "PS-0277--sposobnosti"], "h": "<p><strong>Физическая сила.</strong> Агент по умолчанию сильнее обычного человека, это прямо оговорено в тексте контракта как причина запрета: «Агент не забывайте, что вы физически куда сильнее обычного гражданского» (id 331072, Пункт 2).</p>\n<p><strong>Права.</strong> Организация АЗИП «не является государственной. Но в каком либо месте у нас равный или даже превосходящий права. А вы как сотрудник организации тоже получается превосходящий права, чем гражданский». Перечислено три пункта (id 331072):</p>\n<ul>\n<li>«Во первых ваша юридическая защита».</li>\n<li>«Во вторых доступ во всё возможные места. Будь то даже частная собственность или территория».</li>\n<li>«В третьих права на убийство. И права нарушать некоторые законы. При условии, что это закон нарушен был при выполнения миссии или содержания агрессивной аномалии».</li>\n</ul>\n<p>Более ранняя, короткая формулировка того же от Миколая: «имеют право уничтожать всех кто входит в категорию опасных существ», «обязаны писать отчёт по каждому акту уничтожения» (2025-05-28, id 330929).</p>\n<p><strong>Обязанности.</strong> «Вы будете обязаны встречать чужемирцов, который по какой-либо причины покинули свой мир. И либо зарегистрировать его, либо устранить если он проявит агрессию на вас». Кроме чужемирцев агент устраняет «лиц, который имеют особенность и нарушающий закон»; особенностью может быть благословение или артефакт, «и также есть лица, который получают силу непосредственно самого себя Арбетар и фантазеры». Порядок действий: «По мере возможности вам нужно будет их устранить. Либо захватить и превести в штаб, которому вы привязаны» (id 331072).</p>\n<p>Запрет по Пункту 2: «Нельзя вредить гражданским и применять против них грубую силу». Отчётность: «во избежание устранения невинных существ. Вы обязаны писать отчёт, какое существо и при каких обстоятельствах вы его уничтожили».</p>\n<p><strong>Предписанная фраза при встрече чужемирца.</strong> «И не забывайте. Не всё чужемирцы опасны и хотят кому-то навредить. Поэтому встретив чужемирцы у пространственной аномалии. Используете эту фразу \" Здравствуйте я представитель организаций АЗИП и мы не хотим вам навредить. Я знаю, что вы не понимаете, что происходит. Но попрошу последовать за мной, что бы вас зарегистрировали\"». Дальше: «Если на это чужемирец проявит агрессию. Постарайтесь его успокоить. Но если вашей жизни грозит опасность. То можете применить грубую силу» (id 331072).</p>\n<p><strong>Снаряжение.</strong> Пункт 3: «Не забывайте, что полученная вами собственность в организации АЗИП. Хоть и зафиксировано за вами. Но всё ещё принадлежит организации АЗИП».</p>\n<p><strong>Выплаты</strong> (Пункт 4). Во время подготовки — ежемесячно 200 000 рублей; при повторном прохождении подготовки выплата не начисляется. Ставшему агентом полагается еженедельная выплата в зависимости от выполненных миссий, с ремаркой в скобках: «постарайтесь не вредить себе из за выбора сложной миссии». Минимальная выплата — 70 000, «а максимальная зависит уже от ваших достижений. Также будет надбавка если вам выдали не верную информацию».</p>\n<p><strong>Страховка и завещание</strong> (Пункт 5). «Ваша жизнь застрахована и покрывает всё медицинский расходы. Если вы получили психологическую травму. Вам будет выписан отпуск. И предоставлен сеанс с психологом из организаций АЗИП». При гибели на миссии выплату получает семья или лицо, записанное в завещании, которое пишется при вступлении в организацию; «Если по каким либо причинам нет лица, который должен получить выплату. То это выплата будет отправленная на благотворительность с вашего имени».</p>", "r": []}, {"t": "Связи с другими", "a": ["S03", "PS-0277-S03", "PS-0277--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>АЗИП</strong> — организация, которая вербует агентов и которой они подчинены; не государственная, но с равными или превосходящими правами.</li>\n<li><strong>Штаб</strong> — агент привязан к конкретному штабу, куда доставляет захваченных.</li>\n<li><strong>Чужемирцы</strong> — и материал для вербовки (агентом может быть чужемирец), и основной объект работы: регистрация либо устранение.</li>\n<li><strong>Носители особенностей</strong> — благословенные, владельцы артефактов, а также Арбитр и фантазёры как «лица, который получают силу непосредственно самого себя»; при нарушении закона подлежат устранению или захвату.</li>\n<li><strong>Гражданские</strong> — категория, которой агент не должен вредить и от которой закрыта часть информации.</li>\n<li><strong>Контракт и правила агента АЗИП</strong> — документ, задающий всё вышеперечисленное.</li>\n<li>В карточке записи в связанных значится также <strong>Кура</strong>; в приведённых кусках переписки этот персонаж не упоминается, характер связи не назван.</li>\n</ul>", "r": []}, {"t": "Как менялся", "a": ["S04", "PS-0277-S04", "PS-0277--kak-menyalsya"], "h": "<p><strong>2025-05-28, id 330906–330940 (окно w0099). Определение и первый набор прав.</strong></p>\n<p>Слава задал вопрос «Права и обязанности агента ?» и попросил накидать вариантов; Миколай уточнил «агента чего», после чего было записано определение агента (id 330909). Предложения Миколая в этом заходе: право уничтожать всех, кто входит в категорию опасных существ, и обязанность писать отчёт по каждому акту уничтожения (id 330929); наличие контракта, по которому агента завербовали (id 330935–330936); вопрос о пожизненности контракта (id 330938–330939), на который тут же был дан ответ про порядок выхода.</p>\n<p>В навигационной справке к записи за этим же окном названы ещё два предложения Миколая, которых нет в приведённых кусках переписки: доска с существами от глав организации и обязанность иметь устройство связи и отвечать на каждый звонок, а также право на защиту от существ. Их обсуждение в приведённом тексте не сохранилось.</p>\n<p><strong>2025-05-29, id 331071–331075 (окно w0099). Полный текст контракта.</strong></p>\n<p>На следующее утро Слава выложил сводный документ «Контракт и правила» (id 331072) — общие обязанности и права плюс Пункты 1–5. Текст обрывается строкой «Пункт 6.» без содержания. Реакция Миколая: «ну пипец», «а когда тогда получится...», ответ — «Не знаю» (id 331073–331075).</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "PS-0277-S05", "PS-0277--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Пункт 6 контракта объявлен, но не написан — текст заканчивается на его номере (id 331072).</li>\n<li>Приложение 1, к которому контракт отсылает за перечнем наказаний, не составлено.</li>\n<li>Внешность, форма, знаки различия агентов не описаны.</li>\n<li>Состав «основного снаряжения» не назван.</li>\n<li>Содержание шестимесячной подготовки и экзамена не описано.</li>\n<li>Что такое «ограниченный доступ к информации АЗИП» и где проходит граница — не сказано.</li>\n<li>Ранги, звания, внутренняя иерархия агентов не описаны; упомянуты только «главы организации» (в навигации к окну) и штабы.</li>\n<li>Не сказано, чем именно агент физически сильнее гражданского и откуда эта сила берётся — усиление ли это, отбор ли при вербовке.</li>\n<li>Что означает «наказаны» при нарушении контракта — не раскрыто.</li>\n<li>Конкретные агенты как персонажи в этом окне не названы; статья описывает категорию.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0277--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0004.html\">АЗИП («Апостол закон и права»)</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0004.html\">АЗИП («Апостол закон и права»)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0277--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-05-28</td>\n<td>330906–330940</td>\n<td>w0099</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-05-29</td>\n<td>331071–331075</td>\n<td>w0099</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0277-agent-azip.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0277--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0277.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0277-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0277/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дороже всего — Кура. Сущности с таким именем в реестре нет: ни id, ни статьи, ни собственной записи. При этом в связанных он стоит у десятка записей сразу — здесь, у <code>MR-0138</code>, <code>PS-0179</code>, <code>PS-0281</code>, <code>IS-0013</code>, <code>SL-0054</code>, и три записи способностей (<code>SP-0230</code>, <code>SP-0231</code>, <code>SP-0232</code>) прямо помечены как «часть чего: Кура». Это единственный названный по имени агент АЗИП во всём материале, и статья честно пишет, что «характер связи не назван» и что «конкретные агенты как персонажи в этом окне не названы». Оба пробела закрываются одним заведением сущности — материал под неё уже есть и лежит в том же окне w0099.</p>\n<p>Второе — <code>SL-0054</code> «Список 12 апостолов»: 234 052 знака базы, статьи нет, ссылок три. Именно там лежит ответ на вопрос Миколая «кто является основателем» (331237): в окне w0099 к апостолам добавлены роль основателей и заказчиков АЗИП и двое, сидящих на Северном полюсе. Без статьи этот ответ ниоткуда не виден, а на нём висит вся конструкция «негосударственная организация с превосходящими правами».</p>\n<p>Ещё одно, попроще: <code>GR-0005</code> «Агенты (организация вербовки)» — статья на 23 945 знаков, ссылок ноль, базы ноль. Эта статья привязана к <code>GR-0004</code>, а не к ней, и группа стоит пустой.</p>\n<h3>С чего начать</h3>\n<p>В базе. В архив идти не надо — всё прочитано, просто разложено по соседям.</p>\n<p><code>SP-0230</code>, id 331639, 2025-05-31, окно w0099 — Кура целиком. Внешность (маска курицы с красным гребнем, зелёно-оранжевый плащ, рост 185), характер, три способности и служебная биография: «Некоторая время был начальник одного из дополнительного филиала АЗИП. Но был отстранён из-за проявления своего безумия и игривого характера. В нынешней время является агентом и приближенным Апостола (Бессмертного)». Заголовок сообщения при этом — «Способности Куры (Арбетара)», а в списке от 2026-02-09 (id 430400) Кура стоит одиннадцатым апостолом; это два разных положения одного лица, и свести их пока нечем.</p>\n<p><code>MR-0139</code>, версии 3 и 4: id 331230–331247 и 331442–331461, 2025-05-30. Целый день разбора, которого в источниках этой статьи нет вовсе, а он идёт ровно по её пробелам. Миколай: ТНК, сколько сотрудников и филиалов, кто основатель, откуда у негосударственной компании такие права, на каком языке произносится предписанная фраза чужемирцу, «получается рубли и язык русский.... мде». Слава: контракт российский (331443), 21 главный филиал со своими подфилиалами (331444), сотрудники делятся на агентов и работников компаний (331445), число — 700 000 000 при 8 225 048 831 населения (331448–331450), и главное для Пункта 1: провалившего кандидата нельзя просто убить — «Чтобы потом другие агенты могли бы начать восстание. Тем более это именно мы их завербовали и несем за них ответственность» (331459).</p>\n<p><code>MR-0138</code>, версия 2: id 330952–330991. Расшифровка «Апостол закон и права» (330991) и публичное прикрытие — сеть бизнесов, «хотя бы один его из магазинов» в каждом городе (330967–330968). Там же дословно лежат те два предложения Миколая, про которые статья пишет, что в приведённых кусках их нет: доска, где главы организации размещают существ (330959), обязанность иметь устройство связи и отвечать на каждый звонок (330960), право получить защиту от существ (330961).</p>\n<p><code>MR-0138</code>, версия 5: id 359681–359686, 2025-08-30 — «нерушимая организация Азип, которой уже более сотней лет».</p>\n<h3>Как развивалось</h3>\n<p>2025-05-28, 12:36 — заявлено вопросом «Права и обязанности агента ?» и просьбой накидать вариантов; через две минуты записано определение агента. К вечеру того же дня — расшифровка аббревиатуры и бизнес-прикрытие. 2025-05-29, 08:38 — весь документ разом, пункты 1–5, и обрыв на строке «Пункт 6.»; реакция «ну пипец», «а когда тогда получится...» — «Не знаю». 2025-05-30, 05:17 — Миколай ставит документ под юридический и бытовой вопрос, от масштаба до столовой; к 11:15 Слава отвечает на большую часть и на двух местах останавливается сам: «Ну об этом стоит подумать», «Вот здесь да придумать надо чтото». Дальше три месяца тишины. 2025-08-30 АЗИП возвращается уже не как предмет разработки, а как фон: организация, которой более ста лет, нерушимая, и вопрос стоит о злодее, который её пересилит. Пункт 6 и Приложение 1 в прочитанных окнах не возвращались.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для встречи с чужемирцем протокол первого контакта выписан до буквы: сначала оговорка «не всё чужемирцы опасны и хотят кому-то навредить», потом дословная фраза в кавычках, потом «постарайтесь его успокоить» и только затем разрешение на грубую силу. Вторая половина той же обязанности — носители особенности: благословенные, владельцы артефактов, арбетары, фантазёры, «который имеют особенность и нарушающий закон». Порядок действий для них дан одной строкой: «По мере возможности вам нужно будет их устранить. Либо захватить и превести в штаб». Ни фразы, ни требования сначала заговорить, ни оговорки, что не все из них опасны, — при том что признак у них ровно такой же внешний, как у чужемирца у аномалии, и ошибиться в нём так же легко. Для одной категории протокол обращения проговорён дословно, для соседней в том же абзаце — нет.</p>\n<h3>Отклик</h3>\n<p>Хорошо здесь то, что документ написан не автором мира, а отделом кадров этого мира. Скобка «постарайтесь не вредить себе из за выбора сложной миссии» посреди тарифной сетки, отдельный пункт про то, что снаряжение хоть и «зафиксировано за вами», но принадлежит организации, психолог и отпуск после психологической травмы, завещание при вступлении и благотворительность с вашего имени, если получателя не нашлось. Это интонация трудового договора, и она делает организацию с правом на убийство куда убедительнее, чем любое описание её мощи. Оттуда же лучшая деталь всего окна — ответ на следующий день, почему провалившего кандидата не убивают: не потому, что это плохо, а потому что «другие агенты могли бы начать восстание» и «это именно мы их завербовали и несем за них ответственность». И на этом фоне «Пункт 6.» без единого слова после него — самая выразительная строка контракта; жаль, что она не нарочно.</p></div>", "r": []}];</script>
