<script>const BASE="";const DOCNAME="Водяные";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0035-S01", "GR-0035--chto-eto"], "h": "<p>Название нечисти из незаконченной истории Славы «Чёрное озеро» (вселенная «7 островов»). В переписке слово звучит ровно один раз — во множественном числе, в финальной реплике выложенного куска (2026-02-08, id 430013): «ты меня с водеными перепутал кажись?». Написание авторское — «водеными».</p>\n<p>Как группа водяные не разрабатывались: это одно упоминание, а не сообщество с описанным составом и свойствами. Ни одной реплики о том, кто они, сколько их, как выглядят и что умеют, в переписке нет. Разведка помечает их как «раса-сообщество нечисти», но в самом окне такого определения не звучит — есть только имя во множественном числе.</p>\n<p>Обстановка, в которой название произносится, описана подробно, и на этом текст обрывается. Рассказчик Сергей, со сломанной ногой, лежит в яме, куда его сбросил и забросал землёй Васька, спасая от чудовища. Утром его находит незнакомец — «высокий и подтянутый мужчина в делай рубашке и в чёрных джинсах», «явно не с деревни» (см. <a href=\"PS-0349.html\">Мужчина в белой рубашке</a>). Мужчина предлагает наложить шину, Сергей отмахивается веткой и требует: «отвечай кто ты. Ты же не из местных, а значит замаскировался сука!» Мужчина сперва наклоняет голову, будто не понимает, потом что-то вспоминает, и «лес до этого поглативший только крики отчаяния и рёв монстра, погладил смех». Отсмеявшись и вытерев слёзы, он и произносит фразу про водяных. На этой реплике выложенный кусок кончается (id 430013), следующим сообщением Слава уже говорит о другой задумке — истории с названием «виновен?» (id 430014).</p>\n<p>То есть слово произносит не рассказчик, а персонаж, который, судя по реплике, о водяных знает и себя к ним не относит. Обвинение в том, что собеседник «замаскировался», мужчина прочитывает как то, что его приняли за водяного; связывают ли водяных с маскировкой под человека — прямо не сказано.</p>", "r": [["Мужчина в белой рубашке", "PS-0349.html"]]}, {"t": "Как менялась — по датам", "a": ["S02", "GR-0035-S02", "GR-0035--kak-menyalas"], "h": "<ul>\n<li><strong>2026-02-08 (id 430013).</strong> Первое и единственное появление, в третьем из трёх подряд выложенных сообщений «Чёрного озера» (id 430010–430013). Дальше в окне w0116 не разворачивается.</li>\n<li><strong>2026-02-08, чуть позже (id 430040–430070).</strong> Миколай читает выложенный текст по ходу и комментирует: «на кого они охотятся», «охота на бесов», «страшно», «я прочитал полностью», «круто написана история», «герой очень живой», «все живые», «и описания сцен красивые». Отдельно отмечает: «пока про озеро ничего не было». Слово «водяные» в его репликах не появляется — обсуждения этой нечисти не было.</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S03", "GR-0035-S03", "GR-0035--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет: список участников пуст, ни одного водяного по отдельности не названо.</li>\n<li>Не сказано, кто такие водяные: облик, свойства, где живут, чем занимаются — ничего этого в переписке нет.</li>\n<li>Не сказано, группа ли это вообще в смысле сообщества, или просто вид/порода нечисти. В тексте только слово во множественном числе.</li>\n<li>Иерархия, различия между отдельными водяными, общие способности — не обсуждались ни разу.</li>\n<li>Связь с чудовищем из леса (двухметровое существо в чёрной шерсти с горящими оранжевым глазами) не названа: неизвестно, водяной оно, другая нечисть или что-то третье.</li>\n<li>Кто такой мужчина в белой рубашке и почему он про водяных знает — не раскрыто; имени у него нет.</li>\n<li>Связь водяных с самим Чёрным озером в тексте не отыграна — про озеро в выложенном куске вообще ничего не было, это отмечает и Миколай (id 430069).</li>\n<li>Продолжения не последовало: история объявлена незаконченной, а следующая задумка Славы («виновен?») с водяными в переписке не связывается.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0035--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0349.html\">Мужчина в белой рубашке</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0035--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0035.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0035-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0035/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>По самим водяным дорогих дыр нет и быть не может: на них никто не ссылается, материала одна реплика. Дорогое рядом.</p>\n<p>Первое — расщепление «Чёрного озера» на четыре записи, из которых ни одна не главная. <code>IS-0084</code> (история) — 27,5 КБ базы, <code>PR-0107</code> (проза) — 23,8 КБ, плюс <code>PS-0345</code> (Сергей, 24,2 КБ), <code>PS-0346</code> (Васька, 17,1 КБ), <code>PS-0348</code> (Чудовище из леса, 16,1 КБ), <code>PS-0349</code> (Мужчина в белой рубашке, 10,1 КБ). Текста в базе больше ста килобайт, и он разложен по персонажам и по двум параллельным записям самой истории. Водяные — единственный элемент этого куста, у которого базы 0 при 6,1 КБ статьи; вся дословность по ним сидит в <code>PS-0350</code> (2,8 КБ базы), заведённом как персонаж. Одна сущность, две записи, ноль ссылок между уровнями.</p>\n<p>Второе, и это скорее предупреждение: <code>MN-0011</code> («Чёрное озеро в густом лесу») — вселенная «монстры», 2024-11-13, отдельное озеро из другой истории. Названия совпадают почти дословно, записи ничем не разведены, и при следующей сборке их спутают.</p>\n<p>Третье — <code>ID-0165</code> («Виновен?»): статьи нет, база 2,8 КБ, одна входящая. Это то, куда автор ушёл следующим же сообщением, id 430014. Пока этой записи нет, обрыв «Чёрного озера» выглядит беспричинным.</p>\n<h3>С чего начать</h3>\n<p>Целиком в базе, в архив пока не нужно. Свести <code>GR-0035</code> и <code>PS-0350</code> — это одна и та же фраза 430013, описанная дважды. Потом <code>IS-0084</code> и <code>PR-0107</code>: там полный выложенный текст, и если слово «водеными» встречается в нём ещё раз, оно найдётся именно там, а не в чате. Отдельно <code>PS-0349</code> — мужчина в белой рубашке единственный, кто про водяных вообще знает, и всё, что можно про них вывести, выводится через него.</p>\n<p>В архив идти только вперёд, не назад: окно w0116, 2026-02-08, разобрано по id 430010–430013 и 430040–430070. Смотреть надо после 430070 — вся февральская переписка 2026 года и всё, что относится к задумке «виновен?». Назад смотреть незачем: 430013 — первое появление слова, до него истории просто нет.</p>\n<h3>Как развивалось</h3>\n<p>2026-02-08: заявлено и в той же реплике брошено. Три сообщения подряд с текстом, водяные звучат в последней фразе третьего, и на этой фразе текст обрывается. Ограничение приходит немедленно и не обсуждением, а сменой темы: следующим сообщением, 430014, Слава говорит о другой задумке — «виновен?». Чуть позже, id 430040–430070, Миколай читает выложенное и подробно откликается — «круто написана история», «герой очень живой», «все живые», «и описания сцен красивые», отдельно «пока про озеро ничего не было». Слово «водяные» у него не появляется ни разу. Возврата не было.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Со стороны мужчины в белой рубашке правило названо: он знает, кто такие водяные, себя к ним не относит и слышит в обвинении именно эту подстановку — отсюда смех. То есть в мире есть тот, кто различает породы нечисти изнутри. Со стороны Сергея того же не проговорено. Он деревенский, со сломанной ногой, и он уже владеет готовым различением — «Ты же не из местных, а значит замаскировался сука!» — то есть у него есть представление, что нечисть может ходить под человека. Откуда оно у него, поверье это в деревне или личный опыт этой ночи, не сказано. Правило узнавания названо со стороны того, кого узнают, и не названо со стороны того, кто узнаёт.</p>\n<h3>Отклик</h3>\n<p>Вот здесь зацепило по-настоящему, и не водяными. «Лес до этого поглативший только крики отчаяния и рёв монстра, погладил смех» — фраза с опечаткой, но с точным устройством: лес как сосуд, который до сих пор принимал только один сорт звука, и вдруг получает другой. И смех этот не злодейский, а именно человеческий, до слёз, от нелепости обвинения. Мужчина сначала наклоняет голову, будто не понимает, потом что-то вспоминает — и только тогда смеётся. То есть он узнаёт не ситуацию, а какую-то свою старую историю про водяных, которой мы не увидим. Реплика «ты меня с водеными перепутал кажись?» держится ровно на этом: она предполагает целый пласт, где эта путаница — обидная или смешная, и где у нечисти есть репутации. Ничего из пласта не написано, и текст обрывается ровно на том слове, с которого он мог бы начаться. Обидно, что дальше автор ушёл на «виновен?» — но это уже не про статью.</p></div>", "r": []}];</script>
