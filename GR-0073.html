<script>const BASE="";const DOCNAME="Бригада лесорубов";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0073-S01", "GR-0073--chto-eto"], "h": "<p>Рабочая бригада лесорубов — восемь человек, валящих лес в тайге. Разведка базы завела её как «персонажа» <a href=\"GR-0073.html\">Бригада лесорубов</a>, но это группа: восемь человек, лагерь с палаткой, машиной, аптечкой и двумя двустволками. Слова «бригада» и «бригадир» идут через весь текст истории.</p>\n<p>Написана Славой одним куском 2025-05-02 (id 323364–323370) — семь сообщений подряд, отправленных одной минутой. Рассказ идёт от первого лица от одного из участников, Ивана Васильевича, и обращён к читателю: «Здравствуйте дорогие читатели».</p>\n<p>Работа бригады описана так: «Я же был с бригадой. Мы вместе рубили лес. И не подумайте, всё законное. Мы не какие-то там браконьеры или вроде того». Выезд — осенью, «где то в октябре», в тайгу, на «небольшой такой участок, который находился рядом с горой, а в это горе было много пещер». Пещеры считаются природными по одному признаку: «Ну я не увидел там опор, поэтому посчитал эту пещеру природной».</p>\n<p>Численность названа прямо: «Наш-то в бригаде было 8 человек».</p>\n<p>Быт и снаряжение лагеря, как они всплывают по ходу: палатка, машина (в решающий момент оказывается закрытой на замок — «Кто сука мать его закрывает машину среди леса»), аптечка, стол, за которым едят все вместе, дежурные, которые «ушли готовить кушать», фонарик, «который валялся в машине фиг пойми сколько» и у которого садятся батарейки, и две двустволки. Про ружья оговорено отдельно: «И повторюсь мы не браконьеры. Оружия у нас законно. Ведь кто знает, что может в лесу случиться. Поэтому у нас они валяются. Два оружия для охоты».</p>\n<p>Вселенная в самой переписке не объявлена; в базе она проставлена по дате и помечена как неясность — «Вселенная нигде не названа».</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0073-S02", "GR-0073--sostav"], "h": "<p>Названы поимённо пятеро из восьми:</p>\n<ul>\n<li><a href=\"PS-0261.html\">Иван Васильевич</a> — Иван Васильевич (Ваня, Иван, дровосек, лесоруб), рассказчик. «Мужик уже за тридцать, который пол жизни отдал работе лесоруба».</li>\n<li><a href=\"PS-0263.html\">Бригадир</a> — Бригадир, начальник бригады. Имени нет, только должность. Возраст: «словно не 50 летний мужик, а малец какой».</li>\n<li><a href=\"PS-0264.html\">Тоха</a> — Тоха, он же Григорий («Первым пошёл Тоха ну для вас Григорий»). «Был нашим навигатором».</li>\n<li><a href=\"PS-0234.html\">Михаил</a> — Михаил (Миша, Мишка). «Был парням крепким и самым крупным в бригаде».</li>\n<li><a href=\"PS-0240.html\">Игорь</a> — Игорь (Игорёшка). «Самый младший из нас».</li>\n</ul>\n<p>Оставшиеся трое безымянны — они проходят в тексте как «остальные», «наши», «мужики» и различаются только по ранениям. Поимённого состава на все восемь мест в переписке нет.</p>", "r": [["Иван Васильевич", "PS-0261.html"], ["Бригадир", "PS-0263.html"], ["Тоха", "PS-0264.html"], ["Михаил", "PS-0234.html"], ["Игорь", "PS-0240.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0073-S03", "GR-0073--obschie-sposobnosti-gruppy"], "h": "<p>Никакой сверхъестественной способности, общей для всех участников, в переписке не названо. Бригада — обычные рабочие люди; единственная «удивительная особенность» принадлежит одному человеку, Тохе, и отмечена именно как его личная.</p>\n<p>Что умеют все:</p>\n<ul>\n<li>Валить лес. Умение всплывает косвенно, через сравнение с тварью: она «своим лбом буквально рубит деревья, как почти что мы. Только сильнее быстрее и вертикально».</li>\n<li>Оказывать первую помощь на месте: «Да и они тоже пытались подлатать себя. Аптечка конечно есть. Всё же не новички какие-нибудь». Иван сам вытаскивает из плеча ветку, заливает антисептик и бинтует; вправлять вылетевший из сустава сустав бригада не берётся — «Мы его не трогали страшно всё таки. Может как не правильно вставим и всю жизнь ему испортим».</li>\n<li>Обращаться с охотничьими двустволками — ружья законные, стреляют из них разные участники (Михаил, Иван, а в финале двое сразу).</li>\n<li>Быстро и высоко лазать по деревьям. В обеих панических сценах дерево оказывается общим способом спастись; на деревья лезут Иван, Игорь, Михаил, бригадир и другие.</li>\n<li>Держаться в тяжёлых условиях. Про себя Иван пишет: «Привыкший, каким либо невзгодам, плохой погоди, холоду зимой на столь сильному, что аж кости дрожать. Или жизнь в бедности, когда едва хватает денег на хлеб».</li>\n<li>Держать слово. Обещание Игорю сходить в пещеру исполняют назавтра: «Мы то слова держим, поэтому быстро пообедав».</li>\n</ul>\n<p>Отдельно про то, чего бригада не умеет: «Всё же не богатырей из сказок, который могут и днём и ночью сторожить».</p>", "r": []}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0073-S04", "GR-0073--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p><strong>Иван Васильевич (<a href=\"PS-0261.html\">Иван Васильевич</a>).</strong> Мужик за тридцать. Главным своим качеством считает хладнокровие: «я всегда выбирался из этих бед благодаря моему самому главному, как по мне качеству хладнокровию». В лагере это качество с него слетает без причины — «И вот сейчас это хладнокровия слетела с меня. Моей самое главное качество в жизни просто исчезла. Просто так, без какой-то либо причины». Первым чувствует опасность в лагере, стесняется этого страха и скрывает его: товарищи решают, что он болеет, он отмахивается. Не показывает слабости — на дереве молчит перед бригадиром, хотя тот допытывается: «Да и чтобы я ему сказал, что мы увидели что-то в пещере и убежали, как дети какие-то». Потом сам называет это гордыней и виной: «Конечно же ничего бригадиру я не сказал баран. Возможно если бы я отодвинул на второй план свою гордыню. И сказал всё как есть. То бригадир бы послушал бы меня. И мы бы уехали оттуда. Возможно, но не точно».</p>\n<p>В пещеру лезет третьим, «в полуприседи». При бегстве бежит последним, ощущая «дыхания в спину», и выпинывает застрявшую в лазе кучу товарищей ногами. При скатывании по склону получает ветку насквозь в плечо, камни по рёбрам и голове. Ветку вытаскивает себе сам и называет её «ветка падла» — «А падла она потому что не прямая ветка, а с изгибами. Поэтому больнее вытаскивать было». Именно на его травму бригадир указывает как на довод: раз есть рана, надо вызывать помощь.</p>\n<p>В бою: проверяет пульс у Тохи и не находит, выхватывает ружьё из рук Тохи, стреляет твари в голову, убегает через крышу машины, падает от бессилия, получает удар в руку — «Разрывая плоть и ломая кости. Она вывихнула мне руку. И содрала с неë коже с плотью». В финале истории руку ампутируют.</p>\n<p>Смысл, который он сам приписывает своему тексту: «Прошлой до сих пор живёт во мне и потихоньку словно паразит вытягивает из меня жизнь. И это текст нужен именно для того, что закинуть этого паразита сюда, а самому возродиться подобное Фениксу ха».</p>\n<p><strong>Бригадир (<a href=\"PS-0263.html\">Бригадир</a>).</strong> Начальник, около пятидесяти. Определение, которое даёт ему рассказчик: «бригадир всегда был таким человеком, который хочет потушить угли нежели потом тушить пожар. Хороший мужик». Строг по части ответственности за людей: «ты если болеешь езжай домой. Лучше сразу езжай нежели с тобой, что здесь случиться. Потом же мне отвечать».</p>\n<p>Первым — раньше самих участников — формулирует, что не так с местом: «место здесь странная. Гнетущая какая-то. Вот тебя, как подкосила… не только тебя подкосила оглянись все, как не в себе. Вот я и подумал может вам развёлся надо. Всё же лучше эту проблему сразу устранить. Нежели потом расхлебывать». Поэтому и поддерживает поход Игоря в пещеру, чем удивляет бригаду.</p>\n<p>Сам в пещеру не идёт: «Бригадир остался, следить чтобы ничего не украли или ещё чего». Когда бригада прибегает окровавленная, решает, что за ними медведь, и мгновенно оказывается на дереве. С дерева не видит угрозы и держится скепсиса: «вы серьёзно зверька кого-то испугались. Туда наверняка какая нибудь белка залезла или лиса. А вы как дети малый испугались», «Может пранкер какой. Нынче сейчас же это модное».</p>\n<p>Дальше действует как руководитель: посылает Ивана собирать людей, звонит, считает целых, назначает дежурства, распределяет ружья. Его реакция на общий разгром — про репутацию: «как вы так то. Здоровый мужики об ехавших матушку Россию не один раз и где только не побывали и вот так всём в больничку отлететь. Кто узнаёт на смех поднимут».</p>\n<p>В финале держит на дереве падающего Ивана («Он удержал мою тушу от падения. И упëр на ветку»), а потом спрыгивает с дерева и уводит тварь на себя: «Но бригадир спрыгнул. Просто взял и спрыгнул. И начал с матюками бежать к другому дереву. При этом махая руками, как видимо пытаясь привлечь это паскуду».</p>\n<p><strong>Тоха, он же Григорий (<a href=\"PS-0264.html\">Тоха</a>).</strong> Штатный «навигатор» бригады. Его способность заведена отдельной сущностью <a href=\"SP-0224.html\">Географическая память Тохи</a> и описана рассказчиком так: «имеет удивительные особенности. Одно из них его географическая память, он может легко ориентироваться в новом городе или лесу». Прочие «особенности» из этой формулировки не перечислены — названа только одна.</p>\n<p>Пример, который даёт рассказчик: однажды одному из бригады показалось, что в лесу один ребёнок, он побежал к нему, ребёнок стал удирать, бригада побежала следом и загнала себя до одышки, а ребёнка никто, кроме него, так и не увидел. Обвинить его во вранье не смогли: «Сколько лет работаем. Знаем что он мужик не любящий подобный юмор». Обратную дорогу никто не понял — «Стояли так репу чесали. Как Тоха живо нас всех сориентировал. И мы обратно выбрались ещё более коротким маршрутом». (Кто именно бежал за ребёнком и что это было — в переписке не сказано.)</p>\n<p>В пещере идёт первым — «Первым не из гибкого желания, а от того что имеет удивительные особенности». Первым замечает тварь: встаёт как вкопанный и говорит «там что-то двигается»; внятно описать не может — «То тьма, то нога, то тень, какая тень во тьме». При бегстве из пещеры «протолкнуться вперёд всех и начал координировать наш в бег. Если бы не он разбежались бы мы по этой пещере и забывая как звали».</p>\n<p>Единственный, кто спустился со склона на ногах: «ну Тоха как единственный правильный по видимому. Скатился на ногах, а не как мы всем телом то». Ночью на дежурстве снова первым отшатывается от пещеры и бежит. Гибнет от удара твари в спину, у самого лагеря, в шаге от Ивана.</p>\n<p><strong>Михаил (<a href=\"PS-0234.html\">Михаил</a>).</strong> Самый крупный в бригаде — из-за этого не пролезает нормально в лаз, кофта цепляется и рвётся насовсем. Реакция характерная: «И нет он не начал гнать на Игорь. Миша вообще был парням винящий в первую очередь себя. Это вроде бы хорошо, но в некоторых ситуациях не является хорошей стороной. Ну мы конечно этим не пользовались Мишу-то всё уважали за его характер и доброту».</p>\n<p>При спуске со склона не пострадал: «Для Мишка то подобная неверная как массаж вот и целый». Отказывается дежурить в одиночку. В бою — единственный, кто не побежал: «Только Мишка встал и прицеливался в эту тварь». Рассказчик тут же пересматривает своё прежнее мнение о нём: «Мишка всё же оклеветал я тебя за зря. Зря говорил что он не способен дать сдачи. Вот дает. Смелее чем кто либо в бригаде. Хладнокровен чем кто либо в бригаде». Попадает твари в бок, видит, что толку нет, выбрасывает двустволку и лезет на дерево. Позже спрыгивает с дерева вместе с раненым в ногу и заряжает ружья для второго залпа.</p>\n<p>Иван предпочёл бы дежурить с ним: «Хотя я всё же хотел пойти с Мишой с ним как-то надёжнее».</p>\n<p><strong>Игорь (<a href=\"PS-0240.html\">Игорь</a>).</strong> Самый младший. «Молодой шибко, залезть куда желает. Да и по выносливее нас будет». Он затевает весь поход — «а может давайте в пещеру сгоняем» — и продавливает его в споре, перебирая варианты (ночью → днём → на обеде), пока бригадир не поддерживает. Наутро сам напоминает об обещании, не дождавшись конца обеда.</p>\n<p>В пещеру лезет первым, при бегстве бежит первым и выводит остальных к выходу: «Не могу нарадоваться что Игорь первый бежал. Он нас быстро к выходу вывел». В пещере притихает вместе со всеми: «Даже Игорь слегка приутих».</p>\n<p>На дерево забирается «чуть ли не на самой верхушки» и, в отличие от Ивана, не слезает после разговора с бригадиром. Именно он выкладывает бригадиру всё: «Он то сразу всё выпалил. Сбивчиво запинаясь и яркая жестикулируя». Его версия увиденного — «это человек был наверное». Отказывается дежурить в одиночку.</p>\n<p>В финале прыгает с дерева прямо на тварь: «Черт да что он творит возникла мысль у всех наверное. Но он как-то извернулся и подломил еë коленки». С этого начинается общая свалка, в которой тварь добивают.</p>\n<p><strong>Трое безымянных.</strong> Различаются только по ранениям, полученным при скатывании со склона: «троим досталось ой мамо не горюй. Один ногу вспорол. Мы его конечно перебинтовали… А ещё у одного рука из сустава вылетела… Ещё у одного ключица кажись сломана. Рукой пошевелить не может». Того, кто вспорол ногу «до кости» (артерия не задета), Иван нёс до палатки на руках; он же потом спрыгивает с дерева вместе с Мишкой и берётся за ружьё. Кто из них кто и как их зовут — не сказано.</p>", "r": [["Иван Васильевич", "PS-0261.html"], ["Бригадир", "PS-0263.html"], ["Тоха", "PS-0264.html"], ["Михаил", "PS-0234.html"], ["Игорь", "PS-0240.html"], ["Географическая память Тохи", "SP-0224.html"]]}, {"t": "Иерархия", "a": ["S05", "GR-0073-S05", "GR-0073--ierarhiya"], "h": "<p>Бригадир — единственная названная должность и единственная фигура власти. Его решение переворачивает уже проигранный спор о походе: «-да ладно вы. Поедите быстро да и сходите- решил бригадир подержать Игорь. Тогда мы всё как удивились», и ответ бригады — «ну раз даже бригадир предлагает, грех уже будет не сходить». Он же отвечает за людей перед кем-то вовне («Потом же мне отвечать»), остаётся сторожить лагерь, звонит вызывать помощь, ведёт счёт целых и раненых, назначает дежурства и делит оружие.</p>\n<p>Иван Васильевич в должности не назван, но фактически работает связным между бригадиром и остальными: с ним бригадир курит и говорит наедине, ему поручено собрать разбежавшихся, он же докладывает список раненых и получает информацию о звонке. Заместителем его никто не называет.</p>\n<p>Тоха главенствует не по должности, а по функции: в незнакомом пространстве его пускают вперёд и идут за ним — и в лесу, и в пещере, и при бегстве из пещеры.</p>\n<p>Власть бригадира не абсолютна. Дежурить он сначала хотел ставить по одному, но «получив категорический отказ от Игоря и Мишы. Решил пойти на компромисс и выставил двух дежурных». Распределение вышло: Иван и Тоха — одна пара, Игорь и Михаил — другая, смена каждый час, по одному ружью на пару. Изначальный вариант — всё оружие дежурным у пещеры — отклонили сами: «Но стало страшно, что может в лагере случится, где всё раненные».</p>\n<p>Ещё выше бригадира стоит инстанция, которой звонят («вызову какого надо»): её распоряжения бригадир передаёт как приказ и сам над ними усмехается — не спускаться в пещеру, не искать «возможного затерявшего туриста», но «постоять у входа в пещеру да и по орать. Наверное чтобы турист услышал и сам пришел». Как эта инстанция называется — МЧС, скорая, полиция названы только как варианты вызова — в переписке не уточнено.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S06", "GR-0073-S06", "GR-0073--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>Тварь из пещеры (<a href=\"PS-0265.html\">Тварь из пещеры</a>)</strong> — противник. Четвероногая, похожа на большую чёрную худую собаку, тело и лапы отдают человеческим, вместо морды — лезвие ото лба до носа, «Представьте топор и эту острую часть сняли с топора и нацепили на морду собаки». Крик — «словно рёв зверя и человека который только что понял, что оказался в ситуаций хуже смерти». Столкновений два: в пещере (тварь замечена, бригада бежит) и в лагере ночью (гибнет Тоха, тварь забита насмерть всей бригадой палками и всем, что подвернулось). Бригада полагала, что тварь не может покинуть пещеру, — «Тогда не думали, что тварь то та вылезет из пещеры. Подумали, что не может она покинуть пещеру». После её смерти со стороны горы отзываются другие: «Не один их было множество. Десятки если не сотни тварей там кричала». От них бригада уезжает — «И на удивление быстро смогли уехать без потерей».</p>\n<p><strong>Полиция.</strong> После отъезда бригада звонит в полицию и говорит всё как есть: «Они это за всерьёз не восприняли сначала».</p>\n<p><strong>Фармацевтическая компания (<a href=\"GR-0075.html\">Фармацевтическая компания (из истории про лесорубов)</a>, <a href=\"MR-0135.html\">Фармацевтическая компания</a>).</strong> Перезванивает вместо полиции. Приезжает лично ко всем участникам, берёт показания, даёт подписать бумагу о неразглашении с «моральными выплатами, как мои 6 зарплат», оплачивает похороны Тохи и медицинские расходы. Своих препаратов не даёт, хотя, по словам рассказчика, «их ней препараты могут и конечность отрастить. Но они решили не тратить на нас это. Поэтому мне и ампутировали руку». Названия у компании нет. Связь с организацией «Нимб» из прошлой истории Славы в переписке не заявлена. Роль компании автор назвал позже, отвечая на прямой вопрос (2025-05-15, id 326310–326314): «Биологическая оружия».</p>\n<p>Помощь после звонка бригадира прибывает не раньше следующего дня: «позвонил я. Но эти прибудут только завтра. Тайна все же. Удачей будет если в радиусе 100км есть населённый пункты».</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Дорогая дыра здесь другого рода: одно и то же заведено дважды, и ссылки уходят в меньшую половину. Бригада есть и как группа (<code>GR-0073</code>, статья ~37 КБ, в базе 0), и как персонаж (<code>PS-0262</code>, статья ~34 КБ, в базе 83 КБ) — статья сама это отмечает в первом же абзаце, но развода не происходит: два полных текста об одной бригаде, а весь исходный материал числится за второй. Ровно то же с фармкомпанией: <code>MR-0135</code> (4 ссылки, статья ~8 КБ) и <code>GR-0075</code> (1 ссылка, статья ~15 КБ) — ссылаются на меньшую, читать надо большую. И с чернышами из соседнего куска той же вселенной: <code>PS-0256</code> (3 ссылки, статья ~4 КБ) против <code>GR-0076</code> (0 ссылок, статья ~10 КБ).</p></div>", "r": [["Фармацевтическая компания (из истории про лесорубов)", "GR-0075.html"], ["Тварь из пещеры", "PS-0265.html"], ["Фармацевтическая компания", "MR-0135.html"]]}, {"t": "Как менялась — по датам", "a": ["S07", "GR-0073-S07", "GR-0073--kak-menyalas"], "h": "<p><strong>2025-03-21 (id 306748–306765).</strong> Раньше всего остального. Слава говорит: «В новая история не связана с моей вселенной», и отдельно: «Там просто есть Михаил но это не тот Михаил который \"медведь\"». База отнесла эту реплику к тому же Михаилу, что и в бригаде (<a href=\"PS-0234.html\">Михаил</a>, версия 1, «вне вселенной»). Что именно за «новая история» имелась в виду и та ли это история про лесорубов — в переписке не сказано.</p>\n<p><strong>2025-05-02 (id 323364–323370).</strong> История выложена целиком, в семи сообщениях подряд одной минутой: вступление-обращение к читателям, представление рассказчика, приезд в тайгу, гнетущее чувство, спор о походе, разговор Ивана с бригадиром вечером, поход в пещеру, встреча с тварью, бегство и скатывание со склона, разбор раненых, дежурства с двустволками, ночная гибель Тохи, бой в лагере, отъезд и эпилог про фармкомпанию. Всё, что известно о бригаде, задано здесь; в дальнейшем ни одна деталь не переписывалась.</p>\n<p><strong>2025-05-03 – 2025-05-04 (id 323575–323583, 323673–323686).</strong> Миколай читает по частям. Отмечает для себя вопросы, на которые ждёт ответа по ходу: «че за атмосфера леса и как она влияет и че будет с бригадиром интересно / для себя пока отметил / ещё Игорек подозрительный». 4 мая чтение откладывается: «попозже немного лесоруба».</p>\n<p><strong>2025-05-05 (id 323801–323808).</strong> Продолжение чтения. Отклик на сцену боя: «и собака показала как правильно колоть деревья проф бригаде дровосеков».</p>\n<p><strong>2025-05-07 (id 324096–324166).</strong> Дочитано до конца. Отдельно всплывает фраза в тексте, происхождение которой автор не помнит: на вопрос «че нейронка чтоли писала» Слава отвечает «Не», «Возможно я хотел что-то сказать но забыл», «Либо Т9 это изменила а я не заметил» — какая именно это была фраза, из переписки не восстанавливается. Итог чтения и договорённость: «кидать в нейронку?» — «Давай».</p>\n<p><strong>2025-05-07 (id 324211–324215).</strong> В переписку возвращается пересланный разбор фрагментов 13–18, внутри которого авторский текст идёт цитатами. Цитаты совпадают с текстом от 2 мая: осмотр после паники, ветка из плеча, дежурство у пещеры с двустволками, второй побег, гибель Тохи, начало описания твари. Обрывается на середине описания твари. Новых состояний бригады этот заход не вносит.</p>\n<p><strong>2025-05-15 (id 326303–326318).</strong> Автору задают пять вопросов по истории, он отвечает четырьмя строчками: роль фарм-корпорации — «Биологическая оружия»; цель истории — «Напугать»; судьба Ивана после событий — «На свободе но параноит»; про внешность существа — «Чем меньше» (то есть целиком не показывать). Вопрос про приём «$не допустила модерация$» остался без ответа.</p>\n<p>Отклонённые по ходу истории варианты (то, что предлагалось и не прошло):</p>\n<ul>\n<li>идти в пещеру вечером — отклонено бригадой: «да куда мы ночью то пойдем. Споткнемся пока будем на гору залазить и всё каюк нам»;</li>\n<li>дежурить по одному — отклонено Игорем и Мишей;</li>\n<li>отдать оба ружья дежурной паре у пещеры — отклонено в пользу «одно ружьё у пещеры, одно в лагере при раненых»;</li>\n<li>объяснения увиденного, предложенные бригадиром и отклонённые ходом событий: белка, лиса, «зверёк», пранкер, застрявший турист; версия Игоря «это человек был наверное»;</li>\n<li>стрельба как способ убить тварь: попадания в бок и в голову результата не дают, Михаил выбрасывает двустволку «из-за её бесполезности»; сработал приём Игоря — «Оказывается без разгона она не столь страшна. И если держать его голову на виду то справиться с ним будет достаточно легко».</li>\n</ul>", "r": [["Михаил", "PS-0234.html"]]}, {"t": "Пробелы", "a": ["S08", "GR-0073-S08", "GR-0073--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава на восемь человек нет: названы пятеро, остальные трое безымянны и различаются только ранениями. Кто из троих вспорол ногу, у кого вылетел сустав, у кого сломана ключица — не сказано.</li>\n<li>У Тохи «удивительные особенности» названы во множественном числе, но перечислена только одна — географическая память. Остальные не названы.</li>\n<li>Эпизод с ребёнком в лесу оставлен без объяснения: кто из бригады за ним побежал, что это было и связано ли это с тварью — в переписке не сказано.</li>\n<li>Гнетущее чувство, накрывшее весь лагерь до похода, ни с чем не связано напрямую: причина его не названа, связь с пещерой и тварью не заявлена. Вопрос Миколая «че за атмосфера леса и как она влияет» ответа в переписке не получил.</li>\n<li>Пометка Миколая «ещё Игорек подозрительный» осталась без продолжения — подозрения ничем не подтверждены и не опровергнуты.</li>\n<li>Судьба бригады после подписки о неразглашении не описана ни для кого, кроме Ивана («на свободе но параноит») и Тохи (погиб). Что стало с бригадиром, Михаилом, Игорем и тремя безымянными — не сказано.</li>\n<li>Что за инстанция принимает звонок бригадира и отдаёт распоряжения, у бригады нет названия; полиция, МЧС и скорая упоминаются только как варианты вызова.</li>\n<li>Название бригады, наниматель, конкретное место в тайге, год — не названы.</li>\n<li>Десятки или сотни тварей, отозвавшихся от горы, остались нераскрытыми: сколько их, что они и что было в пещере дальше — осталось нерешённым. Показывать существо целиком автор не планирует.</li>\n<li>Вселенная в самой переписке не объявлена; в базе отмечено дважды — «Вселенная нигде не названа» и «история идёт отдельно от благословенных».</li>\n<li>Фраза в тексте, которую автор не смог опознать («Возможно я хотел что-то сказать но забыл. Либо Т9 это изменила а я не заметил»), в переписке не приведена — какое место истории имелось в виду, восстановить нельзя.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0073--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0234.html\">Михаил</a>, <a href=\"PS-0240.html\">Игорь</a>, <a href=\"PS-0261.html\">Иван Васильевич</a>, <a href=\"GR-0073.html\">Бригада лесорубов</a>, <a href=\"PS-0263.html\">Бригадир</a>, <a href=\"PS-0264.html\">Тоха</a>, <a href=\"PS-0265.html\">Тварь из пещеры</a></li>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0224.html\">Географическая память Тохи</a></li>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0135.html\">Фармацевтическая компания</a></li>\n<li><strong>Упоминает группы:</strong> <a href=\"GR-0075.html\">Фармацевтическая компания (из истории про лесорубов)</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0073--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0073.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0073-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0073/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>По ссылкам чинить нечего: всё, на что эта статья ссылается — Иван Васильевич, бригадир, Тоха, Михаил, Игорь, тварь, географическая память, фармкомпания, — уже написано. Случай для справочника редкий.</p>\n<p>Дорогая дыра здесь другого рода: одно и то же заведено дважды, и ссылки уходят в меньшую половину. Бригада есть и как группа (<code>GR-0073</code>, статья ~37 КБ, в базе 0), и как персонаж (<code>PS-0262</code>, статья ~34 КБ, в базе 83 КБ) — статья сама это отмечает в первом же абзаце, но развода не происходит: два полных текста об одной бригаде, а весь исходный материал числится за второй. Ровно то же с фармкомпанией: <code>MR-0135</code> (4 ссылки, статья ~8 КБ) и <code>GR-0075</code> (1 ссылка, статья ~15 КБ) — ссылаются на меньшую, читать надо большую. И с чернышами из соседнего куска той же вселенной: <code>PS-0256</code> (3 ссылки, статья ~4 КБ) против <code>GR-0076</code> (0 ссылок, статья ~10 КБ).</p>\n<p>Это не пробел мира, это пробел разметки, но чинить его надо раньше содержательных: пока он есть, любое дополнение по бригаде придётся вписывать в два места.</p>\n<h3>С чего начать</h3>\n<p>В базу, и конкретно в <code>PS-0262</code> — там 83 КБ, то есть весь материал бригады. Плюс проза: <code>PR-0070</code> (~50 КБ, история про тварь в пещере целиком) и <code>PR-0075</code> (~33 КБ, фрагменты 13–18). Истории <code>IS-0054</code> и <code>IS-0056</code> — это разбор и обвязка, ~23 КБ на двоих.</p>\n<p>В архив идти почти некуда, и это надо сказать прямо. Текст написан одним куском 2025-05-02, id 323364–323370, семь сообщений одной минутой, и с тех пор ни одна деталь не переписывалась — трое безымянных так и останутся безымянными, потому что второго захода не было. Единственное окно, где ещё есть что поднять, — 2025-05-15, id 326303–326318: пять вопросов, четыре ответа, пятый (про приём «не допустила модерация») повис. Там же лежит и всё, что известно о судьбе Ивана после событий.</p>\n<p>Ещё одно место стоит проверить руками: 2025-03-21, id 306748–306765, реплика «Там просто есть Михаил но это не тот Михаил который \"медведь\"». База отнесла её к тому же Михаилу, что и в бригаде. Если это другая история, атрибуция ошибочна, и проверяется это только по окну.</p>\n<h3>Как развивалось</h3>\n<p>Заявили целиком и сразу: не по кускам, не через обсуждение, а готовым текстом за одну минуту. Дальше читали — 3, 5 и 7 мая, по частям, с пометками на будущее («ещё Игорек подозрительный»). 7 мая прогнали через нейросеть и вернули в чат разбор фрагментов 13–18, где авторский текст идёт цитатами; новых состояний это не внесло. 15 мая закрыли пятью вопросами и четырьмя ответами по строчке каждый. После этого не возвращались ни разу.</p>\n<p>Отдельно: пометка «Игорек подозрительный» так и осталась висеть, а вопрос «че за атмосфера леса и как она влияет» ответа не получил — при том что гнетущее чувство в тексте появляется раньше твари и работает как завязка.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>У Тохи «удивительные особенности» названы во множественном числе, одна из них расписана, и она вынесена в отдельную сущность — географическая память стала способностью со своей карточкой. У Ивана рядом устроено то же самое: хладнокровие названо «моим самым главным качеством», оно дважды разыгрывается в тексте и один раз отказывает — «И вот сейчас это хладнокровия слетела с меня… Просто так, без какой-то либо причины». Это единственный признак, по которому место названо гнетущим ещё до появления твари. Для особенности Тохи место в мире нашлось, для отказавшего качества Ивана — нет: ни как свойство человека, ни как свойство места.</p>\n<h3>Отклик</h3>\n<p>Сильнее всего тут бригадир. Всю историю он держится скепсиса — белка, лиса, пранкер, «кто узнаёт на смех поднимут», — а в конце просто спрыгивает с дерева и с матюками бежит к другому, размахивая руками, чтобы увести тварь на себя. Никакого объяснения, никакой подготовки, и именно поэтому работает. И вообще эта вещь держится на бытовых мелочах, а не на монстре: «Кто сука мать его закрывает машину среди леса», фонарик с садящимися батарейками, сустав, который боятся вправлять — «может как не правильно вставим и всю жизнь ему испортим». Финал честный до неприятного: выжили, подписали бумагу, получили шесть зарплат, и рассказчику ампутировали руку, хотя у тех, кто платил, есть препараты, отращивающие конечности. Про то, что они «решили не тратить на нас это», сказано ровно один раз и без нажима — и это лучшее место в эпилоге.</p></div>", "r": []}];</script>
