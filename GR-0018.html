<script>const BASE="";const DOCNAME="Альфы";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0018-S01", "GR-0018--chto-eto"], "h": "<p>Альфы — не организация и не отряд с поимённым списком, а класс существ вселенной «Апостол»: одна из категорий носителей силы, наравне с благословенными, арбетарами, чужемирцами, владельцами артефактов и фантазёрами. Разведка помечает их как «группу», но в переписке это раса/класс, входящий в состав другой структуры — организации злодеев. Ни одного альфы по имени за всё время не названо.</p>\n<p>Определение вводит Слава при постановке задачи для Миколая (2025-01-22, id 283835–283842). Миколай спрашивает «альфы?», и ответ звучит одной строкой:</p>\n<div class=\"q\"><p>«Альфы сильнейший существа в своём мире»</p></div>\n<p>Позже (2025-03-10, id 300889–300892) альфы оказываются одним из трёх видов чужемирцев — «существ других миров, который сбегают в наш по разным причинам». Деление такое: обычные чужемирцы с разной анатомией; Существа; Альфы.</p>\n<p>Развёрнутое определение (2025-03-10, id 300898):</p>\n<div class=\"q\"><p>«Альфы это субъекты своего мира, который смогли сцапать кусочек силы своего мира, с помощью ритуала или ещё чего, и вот получив кусочек силы своего мира, они зародилил в себе ядро, которая и вырабатывает энергию, у них нет связи, их нея сила только их нея, а из-за отсутствия связи напряжения на мозг исчезает, так как через мозг больше ничего не проходит, и теперь они по-сути могут использовать свою силу 24/7».</p></div>\n<p>В более поздней версии (2025-05-31, id 331636) альфа приравнивается к арбетару: это «одни те же существа», различаются только происхождением — «в первом случае это люди из кильке, а во втором это чужемирцы». Способ получения силы там же назван насильственным: «существа, который насильственно вырвали кусок силы своего мира… А после посели его в себе и заставили выделять силу».</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0018-S02", "GR-0018--sostav"], "h": "<p>Поимённого состава нет — в файле группы список участников пуст, и в переписке ни один альфа не назван по имени.</p>\n<p>Единственный конкретный альфа, фигурирующий в тексте, — безымянный: тот, чьё тело старик-арбетар добыл как материал для ритуала становления Арбетаром (2025-03-13, id 301806–301807; повтор 301821). Он проходит по тексту как «самая сложная альфа» и «тела альфа», без имени, пола (в тексте и «альфа», и «альфю»), внешности и биографии.</p>", "r": []}, {"t": "Общие способности группы", "a": ["S03", "GR-0018-S03", "GR-0018--obschie-sposobnosti-gruppy"], "h": "<p>Механика силы у всех альф одна и описывается так (2025-03-10, id 300898; 2025-05-31, id 331636):</p>\n<ul>\n<li>Внутри альфы зарождено <strong>ядро</strong>, которое вырабатывает энергию. Ядро появляется после того, как существо «сцапало» кусочек силы собственного мира.</li>\n<li><strong>Связи нет.</strong> Сила не приходит извне, а находится внутри: «их нея сила только их нея». Из-за отсутствия связи через мозг ничего не проходит, напряжение на мозг исчезает.</li>\n<li>Отсюда — <strong>работа 24/7</strong>: «они по-сути могут использовать свою силу 24/7» без риска повредить мозг. Позже формулировка повторяется как «они могут использовать его без ограничений… Виде перегрузки мозга».</li>\n<li><strong>Понятия «отключение» нет вообще</strong>: «Им не зачем отключат способность. У них даже нету такого понятия, как отключения».</li>\n<li>Так как сила своя, а не сторонняя, альфа <strong>может лечить и баффать не только себя</strong>, а последствия применения силы не исчезают сами: «огонь которым они устроили пожар не исчезнет пока его не потушить или пока альфа не умрёт». В версии 2025-05-31 то же самое: «если они подожгут лес он будет гореть пока весь не выгореть. Либо его не потушат».</li>\n<li><strong>Сила всегда активна и постоянно защищает носителя.</strong> Отсюда прямое боевое следствие (2025-03-13, id 301806): «если сила всегда активна и его защищает, то просто неожиданная атака, на нём не проканает».</li>\n</ul>\n<p>Базовый набор умений назван списком (2025-05-31, id 331636), общий с арбетарами:</p>\n<ul>\n<li>усиленная регенерация — «регенерация чаще всего превосходит благословенных»;</li>\n<li>усиление тела и чувств;</li>\n<li>аура;</li>\n<li>сенсорика.</li>\n</ul>\n<p>Сверх базового набора каждый получает <strong>уникальную способность</strong>.</p>\n<p>Отдельно оговорено ограничение: альфы, как и благословенные, арбетары и фантазёры, <strong>не способны раскрыть всю мощь артефакта</strong> — «Так как уже сами переполненный силой. Лучшего всего мощь артефакта способен раскрыть обычный человек». Артефакты с символикой не раскрываются смертными и на 3%.</p>", "r": []}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0018-S04", "GR-0018--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p>Уникальная способность у каждого своя, и совпадение источника силы этого не отменяет (2025-05-31, id 331636):</p>\n<div class=\"q\"><p>«И также получают уникальную способность. Даже если они сцапали один и тот же кусок силы. У них она всё равно будет разная. Так как этот кусок начинает формироваться подобно апостолом. Из-за этого они получают уникальную способность».</p></div>\n<p>Второе различие — по происхождению, оно же различие названий: альфа — чужемирец, арбетар — человек из кильки, «в остальном одно и то же».</p>\n<p>Каких-то разрядов, рангов или подвидов внутри самих альф в переписке не заведено.</p>", "r": []}, {"t": "Иерархия", "a": ["S05", "GR-0018-S05", "GR-0018--ierarhiya"], "h": "<p>Внутри самих альф иерархии не описано.</p>\n<p>Внешняя рамка задана через организацию злодеев (2025-01-22, id 283835; 2025-01-23, id 284170–284176):</p>\n<ul>\n<li>В организации состоят Альфы и благословенные.</li>\n<li>Глава организации — «единственный благословенный правителем нашего мира», то есть «грубо говоря сильнейшей».</li>\n<li>Семь грехов и божество «будет слабей главы этой организации но сильней благословенного».</li>\n</ul>\n<p>Где в этой лестнице стоят альфы — в переписке не сказано: их положение относительно главы, семи грехов и божества не оговорено ни разу.</p>\n<p>Общемировая рамка сил меняется по датам:</p>\n<ul>\n<li>2025-05-10 (id 324539–324541) — рабочий перечень из шести строк: Благословенный, Арбетары, Альфы, Чужемирцы, Владельцы артефактов, Фантазёры. Альфы и арбетары ещё стоят отдельными строками.</li>\n<li>2025-05-31 (id 331636) — «Фантазёр на данный момент сильнейший существа», при этом фантазёры могут просто исчезнуть, потеряв связь с нашим миром, «из-за этого их очень мало».</li>\n<li>2025-08-30 (id 359697–359711) — перечень уже из трёх сил, альфы слиты с арбетарами в одну строку: «Благословенный / Арбетаров и Альфы / Творцы (фантазёры)». Перечень понадобился, чтобы определить, какой по счёту будет новая придумываемая сила — Слава уточняет: «То есть четвёртую».</li>\n</ul>", "r": []}, {"t": "Отношения с другими группами", "a": ["S06", "GR-0018-S06", "GR-0018--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>Арбетары.</strong> С 2025-05-31 (id 331636) — те же самые существа под другим названием, разница только в мире происхождения. Ранее, 2025-03-13 (id 301806), связь была мягче: «у альфа и арбетатов похожий силый. Они как и мы может использовать свою силу 24/7 без риска повредить мозг».</p>\n<p><strong>Благословенные.</strong> Противопоставление сквозное. У благословенных сила сторонняя, идёт по связи и нагружает мозг; у альф — своя, внутри, без связи. Регенерация альфы «чаще всего превосходит благословенных». Обратное различие тоже названо: альфы «должны будут учиться вырабатывать энергию и научиться использовать способность и контролировать энергию. Когда у благословенным это выходит автоматический». В организации злодеев альфы и благословенные состоят вместе. В речи старика-арбетара (2025-03-13, id 301806) благословенные обесцениваются: «вся их сила, и не их вообще… сами они эту силу не добывали. Лишь мелкий пизжоны», и убить благословенного «было легко» — он не может использовать благословение долго, поэтому достаточно неожиданного нападения.</p>\n<p><strong>Апостолы.</strong> Единственный названный способ добраться до альфы. Раз внезапная атака не проходит, старику пришлось «ждать пока какой-нибудь апостол упустить альфю. При этом доведя его до полусмерти. И это было долго». Там же оценка апостолов от арбетара: «свою работу они выполняють слишком идеально. Ну даже в идеальной системе есть единичные пробои».</p>\n<p><strong>Чужемирцы.</strong> Альфы — один из трёх видов чужемирцев (2025-03-10, id 300889–300892). При этом чужемирцы как отдельная категория идут в перечне сил отдельной строкой от альф (2025-05-10, id 324541).</p>\n<p><strong>Ритуал становления Арбетаром.</strong> Тело альфы — материал обряда, и по тексту самый труднодобываемый: «Самым сложным, как я уже говорил был альфа». В обряде «мозг благословенного» собирает силу, а «тело Альфы дабы он его пресовал» — прессует её; пара чужемирцев и прочие компоненты служат активаторами. Реплика старика перед началом обряда: «уже поздно если бы у меня были сомнения, то я бы ещё на Альфе остановился». На месте обряда тело альфы описано как лежащее в центре «какой-то анатомический неправильной» и начинающее двигаться, «словно зарядом тока его бьют».</p>\n<p><strong>Фантазёры (творцы), владельцы артефактов.</strong> Стоят рядом с альфами в перечнях сил; прямого взаимодействия с альфами в переписке нет.</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S07", "GR-0018-S07", "GR-0018--kak-menyalas"], "h": "<p><strong>2025-01-22 (id 283835–283842).</strong> Первое появление. Слава задаёт Миколаю направление — мотивы организации злодеев — и сообщает, что в организации есть Альфы и благословенные. На вопрос «альфы?» отвечает: «Альфы сильнейший существа в своём мире». Больше в этот день об альфах ничего.</p>\n<p><strong>2025-01-23 (id 284170–284176).</strong> Достраивается организация вокруг них: глава — единственная благословлённая правителем нашего мира, семь грехов и божество слабее главы, но сильнее благословенного. Сами альфы не уточняются.</p>\n<p><strong>2025-03-10 (id 300889–300892).</strong> Альфы вписаны в чужемирцев как один из трёх видов.</p>\n<p><strong>2025-03-10 (id 300892–300895) — отменённое определение.</strong> Слава сам помечает старую формулировку как прошедшую: «Альфы раньше означали сильнейшей разумной субъекты в своём мире, которая имеет, что-то похоже на благословенния». Дальше — «И я думал что это похожее на благословения? И теперь я допер». То есть версия «альфа = существо с чем-то вроде благословения» отброшена автором в пользу версии с ядром.</p>\n<p><strong>2025-03-10 (id 300896–300907).</strong> Полная механика: ядро, отсутствие связи, снятие нагрузки с мозга, работа 24/7, лечение и баффы не только на себя, неисчезающий огонь. Сразу после описания идёт отдельная реплика Славы «Ну бессмертным» (id 300899) — к чему именно она относится, из переписки не восстанавливается.</p>\n<p><strong>2025-03-13 (id 301806–301807; повтор в id 301821).</strong> Альфа входит в сюжетный текст как материал ритуала. Здесь же — боевая сторона: сила всегда активна и защищает, внезапная атака не проходит, добыть тело удалось только после того, как апостол довёл альфу до полусмерти. Тело альфы названо самым сложным из материалов.</p>\n<p><strong>2025-05-10 (id 324539–324541).</strong> Альфы — третья строка в перечне из шести категорий сил, отдельно от арбетаров.</p>\n<p><strong>2025-05-31 (id 331636).</strong> Крупная перестройка: альфы и арбетары объявлены одними и теми же существами, разница только в происхождении. Добавлены базовый набор из четырёх умений, уникальная способность, формирующаяся «подобно апостолом», отсутствие понятия отключения, обязанность учиться вырабатывать энергию и контролировать её, невозможность раскрыть артефакт. Способ получения силы переформулирован как насильственный: «насильственно вырвали кусок силы своего мира». Ритуал при этом помечен вопросительными знаками как недоделанный.</p>\n<p><strong>2025-08-30 (id 359697–359711).</strong> В перечне сил мира альфы уже не отдельная строка, а половина второй: «Арбетаров и Альфы». Перечень служебный — Слава считает, какой по счёту будет новая сила. Разработки альф в этом окне нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "GR-0018-S08", "GR-0018--probely"], "h": "<div class=\"gaps\"><ul>\n<li><strong>Поимённого состава нет.</strong> Ни одного альфы по имени не названо ни разу, за всё время с 2025-01-22 по 2025-08-30. Единственный конкретный альфа — безымянное тело, использованное в ритуале.</li>\n<li><strong>Ритуал, которым альфа получает свой кусок силы, не доработан.</strong> Автор помечает это прямо (2025-05-31, id 331636): «с помощью ритуала??? Которой я ещё не доработал». В ранней версии способ описан ещё расплывчатее: «с помощью ритуала или ещё чего».</li>\n<li><strong>Мотивы организации злодеев, ради которых альфы вообще были введены, так и не сформулированы.</strong> Тема объявлена 2025-01-22, Миколай дважды откладывает ответ («я позже отвечу», id 284174).</li>\n<li><strong>Место альф в иерархии организации злодеев не определено.</strong> Известно только, что они в ней состоят вместе с благословенными.</li>\n<li><strong>Уникальные способности альф не расписаны.</strong> Сказано, что они есть и что у каждого своя, но ни одного примера конкретной способности альфы в переписке нет — примеры даны только для семи грехов и для фантазёров.</li>\n<li><strong>Не сказано, чем альфы отличаются от «Существ»</strong> — второго вида чужемирцев из того же деления.</li>\n<li><strong>Реплика «Ну бессмертным» (2025-03-10, id 300899) осталась нерасшифрованной</strong>: относится ли она к альфам, к их огню или к чему-то ещё, в переписке не сказано.</li>\n<li><strong>Внешности, анатомии, численности и родного мира альф нет.</strong> Известно только, что каждый — субъект «своего мира», и что тело одного из них «анатомический неправильной».</li>\n</ul></div>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0018--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0018.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0018-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0018/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дыр в статье перечислено много, но блокирует не отсутствие имён. Блокируют реестры, к которым альфы пристёгнуты и у которых нет своих статей.</p>\n<p><code>SL-0053</code> — шесть ссылающихся статей, статьи нет, в базе 20 313 знаков. <code>SL-0051</code> — тоже шесть ссылок, статьи нет, 9 834 знака. <code>SL-0089</code> (тот самый перечень из шести категорий за 2025-05-10, на который статья опирается прямо) — четыре ссылки, статьи нет, а в базе всего 1 753 знака. <code>SL-0090</code> — четыре ссылки, 5 492. Это самые дорогие точки во всём наборе по числу ссылок: на них держится классификация сил, а собственного текста у них нет ни у одной.</p>\n<p>Вторая по цене — «Существа», второй вид чужемирцев из деления 2025-03-10. Отдельной записи в базе нет вообще: слово живёт только как раздел внутри <code>SL-0053</code> и <code>SL-0090</code>. Пока его нет, деление чужемирцев на три вида нечем закрыть, а на него ссылаются и эта статья, и <code>MR-0117</code>, и <code>MR-0100</code>.</p>\n<p>Место альф в организации злодеев — дыра настоящая, но дешёвая по последствиям: <code>MR-0105</code> и <code>PS-0185</code> статьи имеют, и в базе под ними 4 924 и 3 050 знаков. Материала там просто мало.</p>\n<h3>С чего начать</h3>\n<p>В базе, и материал разъехался. По самим альфам он лежит в четырёх соседних записях: <code>MR-0106</code> (28 881 знак базы против 14 074 в статье), <code>PS-0281</code> (7 646), <code>PS-0226</code> (20 681), <code>PS-0220</code> (38 531). Конкретный безымянный альфа из ритуала — в <code>SP-0198</code> (48 879) и <code>PS-0224</code> (90 651), там же вся сцена с телом.</p>\n<p>В архив идти за двумя вещами. Первое — окно 2025-01-22/23 (id 283835–283842, 284170–284176): организацию злодеев объявили там, Миколай дважды отложил ответ, и материала в базе под неё почти нет — значит он либо не проговорён, либо остался в соседних сообщениях тех же двух дней. Второе — id 300899, реплика «Ну бессмертным»: смотреть надо не саму реплику, а два-три сообщения до и после неё в том же окне 2025-03-10.</p>\n<h3>Как развивалось</h3>\n<p>2025-01-22 — заявили одной строкой: сильнейшие существа своего мира. 2025-03-10 — переопределили через ядро и в том же окне сами отменили первую версию вслух («и теперь я допер»). 2025-03-13 — использовали, но не как класс, а как материал: тело альфы в ритуале. 2025-05-10 — отдельная строка перечня. 2025-05-31 — слили с арбетарами, разница осталась только в происхождении. 2025-08-30 — уже полстроки в перечне из трёх, и перечень нужен не ради альф, а чтобы посчитать, какой по счёту будет новая сила.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Обучение объявлено обязательным для класса целиком: альфы и арбетары «должны будут учиться вырабатывать энергию», в отличие от благословенных. Для арбетаров институт обучения расписан — учитель, 50 лет ученичества, способ становления передаётся в конце. Для альф, объявленных теми же существами, того же рода правила нет: кто учит альфу, есть ли у них ученичество, откуда вообще берётся знание о ритуале.</p>\n<h3>Отклик</h3>\n<p>Сильное здесь — то, как ограничение сформулировано через отсутствие понятия, а не через предел: «Им не зачем отключат способность. У них даже нету такого понятия, как отключения». Это не «не может выключить» — это «выключение не входит в устройство мира». Отсюда и лес, который горит, пока не выгорит, и огонь, который держится жизнью поджёгшего. Зацепило ещё, что в записи осталась отменённая версия: автор прямым текстом помечает старое определение как прошедшее и объясняет, чем оно его перестало устраивать. Обычно такое затирают. А слабое место видно в том же тексте — категория держится целиком на механике и ни разу не получила лица: за восемь месяцев ни одного имени, а единственный конкретный альфа лежит в центре обряда и «анатомический неправильной».</p></div>", "r": []}];</script>
