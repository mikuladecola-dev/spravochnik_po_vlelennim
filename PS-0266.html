<script>const BASE="";const DOCNAME="Алексей";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0266-S01", "PS-0266--proishozhdenie"], "h": "<p>Алексей (варианты имени: «Алексей выживший», «Леха», «Лёха») появляется 2025-05-04 (id 323659–323662, окно w0090) сразу как рассказчик — не как персонаж, о котором рассказывают, а как голос, обращающийся к читателю напрямую. Первая же его реплика — вопрос к аудитории: «Скажите вы мне честно. Не надо врать или лицемерить. Это лишь вопрос. Вы ценили то время в котором жили мы? Хотя ответ я и так прекрасно знаю. Нет.»</p>\n<p>Он говорит из положения «после». Мир, в котором он жил, назван собранным порядком: «Мы жили в том порядке, который наши предки собрали за миллионы лет истории. Но ничто не вечно. И весь порядок собранный так долго, тщательно, был разрушен в один миг.» Своё положение рассказчика он оговаривает отдельно и снижает ожидания: «Хотите знать, что же было и что прошло? Я отвечу честно. Не буду врать или искажать историю. Ведь ты, вы обязаны знать. Но не ждите чудо, пафоса и интриги. Я обычный человек. Держите это в голове.»</p>\n<p>Представляется он формулой «Я Алексей выживший». Довоенная биография в первой версии дана коротко: «В том мире, в котором жиле мы до инцидента я был просто офисный сотрудник.» Детей нет, девушки нет — сказано прямо: «У самого детей или хотя бы подружки у меня нету. Не сложилась как-то.» Есть сестра, которая «уже в 20 вышла замуж и родила мне племяшку», и сама племяшка, к которой он относится хорошо («Я хорошо относился к племяшки»).</p>\n<p>Вторая биография — из версии 2025-11-21 (id 387581–387582, окно w0110), текст «Место и ты». Здесь Алексей рассказывает о детстве психологу, на девятой встрече. Отец назван как «религиозный пьянеца, вроде как мой отец», который окунал маленького Алексея в холодную воду: «Вода до дрожи холодная, от который сводили мышцы, которая мелкими холодными иглами, протыкали пухленькое лицо ребёнка и уходил в глубины тела и оставаясь там.» К этому же периоду отнесены пьянки неизвестных людей в соседней комнате и побои: «одеяла не способный остановить даже звуки пьянки неизвестных людей в соседней комнате, не будет способна остановить приближающие галдешь, а после удара армейским ремнём или рукой, сложно было предсказать, чем именно меня могут ударить».</p>\n<p>Как две биографии — офисный сотрудник из пролога и клиент психолога с этим детством — соотносятся между собой, в переписке не сказано.</p>", "r": []}, {"t": "Характер", "a": ["S02", "PS-0266-S02", "PS-0266--harakter"], "h": "<p>Характер прописан в основном во второй и третьей версиях и держится на одном заявленном самим Алексеем противоречии.</p>\n<p>Открывается «Место и ты» обращением к читателю, устроенным так же, как пролог, — с вопросом и с уже готовым ответом за собеседника: «Скажите у вас не возникала мысли ударить, мимо проходящего человека. Нет он ничего вам не сделал, вы в первые его видите. Но почему-то всё же проскальзывает едкая чувство, хорошенько его долбануть.» Он не верит в отрицание: «Ха. Я не поверю в эти невинные глаза, что отводят взгляд, и запинаясь пытаются убедить меня, что не за чтобы это не сделали. КАЖДЫЙ хоть раз в жизни об этом думал.»</p>\n<p>Дальше он проговаривает, что было бы, если бы все так делали: «то начнётся хаос. Кровь мучения и страх смешаються в одну политру и станут единным, и тогда не будет психов. Ведь в мире психов нету психа.» И тут же объясняет, почему этого не происходит: «Законы, запреты, наказания и конечно же совесть, так сильно засели в человеческой натуре.»</p>\n<p>Позже в том же разговоре он сам снимает это утверждение: «в самом начале своего монолога я соврал &lt;...&gt; не КАЖДЫЙ об этом думает. Точнее сказать я надеюсь, что не каждый об этом думает. Хотя бы не та миловидная бабуля, что подкармливала меня.»</p>\n<p>Детские эпизоды, которые он перечисляет как воспоминания:</p>\n<ul>\n<li>насекомые: «отрывал ножки насекомым и следил за ними. Думая когда же он умрёт и сколько можно нанести ему вреда, чтобы он был ещё живой»;</li>\n<li>одеяло: «дрожал побитый времени комок оделяла, которым я укрылся в надежде на защиту»;</li>\n<li>белый кот: «белый кот, что не хотел со мной ласкаться и вечно убегал. Больше не мог ходить, ведь его лапы были сломаны разваливающим молотком. И я был рад, теперь он мой и он нуждался во мне, и кот он был таким жалким. Я прекрасно понимал что его жизнь в моих руках.»</li>\n</ul>\n<p>Итог он подводит сам, и это ключевая формулировка персонажа: «Я ненавидел людей, который доминировали или приченяли мне вред. Но при этом до безумия любил доминировать и приченять вред.» И сразу задаёт вопрос к этому: «Это выглядит с одной стороны глупо, разве я, который испытал всю боль жертвы, не должен был ненавидеть насилия?» Вопрос остаётся без ответа: на реплику психолога «это был вопрос Алексей?» он отвечает «Нет» и добавляет, что на этот вопрос психолог уже отвечал.</p>\n<p>О себе в момент падения мира он говорит: «И я считавший себя хищником среди стадо баранов не понимающий собственных желаний. Выключился от непонимания происходящего.»</p>\n<p>Отдельная черта, показанная бытовой сценой в прологе: он не кладёт трубку первым. «Сам же я редко ложу трубку первым. А племяшка такая же. Поэтому ещё минуты две мы просто молча ждали, кто первый бросит трубку. И конечно же выиграл я.» Выигрыш обеспечен сестрой, которая забрала телефон, — «Привыкла она к нашим противостоянием».</p>\n<p>Ещё одна — законопослушность в мелочи, показанная прямо перед ударом: улица пустая, но «Я решил, что не зачем нарушать закон» и остановился на светофоре.</p>\n<p>В версии 3 характер показан действием: проснувшись в разрушенном мире рядом с существом, он не кричит и не бежит. «Я спокойно встал, попытался вытереть жидкость кухонным полотенцем, что было у меня в руках. Поняв, что это бесполезно, решил медленно наматать полотенце на кулак.» Дальше он методично оценивает инвентарь: кухонный нож отвергнут как непригодный — «Он хлипкий и тонкий и легко сгибается, ранить им конечно можно, но не убить, да и застрять он может. Поэтому я искал что-то более увесистое.» Мотив вскрытия черепа назван через сравнение с ребёнком: «Моей трепещало от интереса, что же там внутри него. Словно я ребёнок, что так и жаждет раскрыть подарок.»</p>\n<p>Он же способен на самоиронию и на трезвую оценку собственной паники: обнаружив, что пожара нет, а есть только включённая плита, он подводит итог: «\"Да уж герой спас от переплаты\" Подумал про себя выключая плиту.»</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Отклик — не материал авторов</b>\n<p>Меня зацепил молоток. В детской сцене белому коту ломают лапы «разваливающим молотком», а взрослый Алексей, перебрав кухонный нож и отвергнув его как хлипкий, берёт молоток для отбивки мяса и сам это комментирует: «Идеально молоток для куска мяса». Никто на связь не указывает, ни рассказчик, ни психолог, и она от этого только сильнее. И вторая вещь — телефонная сцена в прологе: двое ждут, кто первый бросит трубку, выигрывает он, но выигрывает потому, что сестра забрала у дочери телефон. Человек, который считает себя хищником среди стада баранов, выигрывает свои противостояния чужими руками, и это сказано за две минуты бытового молчания в трубке, без единого слова о характере. Этот текст держится не концепцией, а деталью, и деталь его держит.</p></div>", "r": []}, {"t": "Связи с другими", "a": ["S03", "PS-0266-S03", "PS-0266--svyazi-s-drugimi"], "h": "<p><strong>Племяшка Алексея.</strong> Дочь сестры. Ей он ехал за подарком в день инцидента, у неё в тот день день рождения. Разговаривает «Словно пулемёт, а не ребёнок»: звонит будить дядю по маминой просьбе, тут же от этой просьбы открещивается («вы же поможете в готовке маме. Если что это не она попросила спросить»), перечисляет, кто придёт — «сегодня ещё приедет моя подруга Катя и Лера. У них очень красивые куклы и домик даже для кукол есть», и «а ещё щеночек, такой пушистый и милый». Алексей ей врёт дважды: сначала что не проспал («а да-да шутка — начал я врать родной племяннице»), потом что уже садится за руль — чтобы прервать монолог.</p>\n<p><strong>Сестра.</strong> Вышла замуж в 20, мать племяшки. В прологе появляется один раз — забирает у дочери телефон и кладёт трубку.</p>\n<p><strong>Отец.</strong> Назван «религиозный пьянеца, вроде как мой отец». Окунал в холодную воду. Бил ремнём или рукой.</p>\n<p><strong>Психолог.</strong> Ведёт Алексея; описанная встреча — девятая. Черкает ручкой, пока клиент говорит. Задаёт вопрос, ради которого, судя по тексту, ждал девять встреч: «Вот знаете, что мне интересно Алексей. По какой причине вы не стали пьянецей, убийцей или кем либо ещё в криминальном обществе?» — и в его глазах «так и читалась \" Или стал? \"». Автор отмечает его тактику: «Доктор явно ждал продолжение, но боялся словом спугнуть душевный разказ своего клиента, который в первые за 9 встреч дошёл, до того почему клиент не стал тем кем должен был стать.» Он же прописал Алексею ходить к нему пешком «для улучшения психологической стабильности или чего-то там» — за что Алексей его костерит на бегу («Чёртов психолог»). Прощание — «встретимся в пятницу Алексей».</p>\n<p><strong>Бабуля.</strong> Названа один раз, как исключение из его же утверждения: «та миловидная бабуля, что подкармливала меня».</p>\n<p><strong>Вадим, сосед.</strong> Живёт через стенку, этаж четвёртый. Звонит с криком «Леха дом горит!», объясняет: «Моя горит квартира. Катька кастрюлю на плите оставила.» У Алексея есть запасной ключ от его квартиры — взятый с собой, потому что он собирался после психолога покормить кота. Отношение Алексея к соседской квартире названо прямо: «Нет, на квартиру соседа было от части наплевать. Вот только он сосед через стенку и если начнётся пожар, то гореть начнёт и моя квартира.»</p>\n<p><strong>Катя (Катька), девушка Вадима.</strong> Названа как та, кто оставила кастрюлю на плите. Алексей её не вспоминает сразу: «я пытался вспомнить приятеля, у которого была девушка Катя».</p>\n<p><strong>Кот Вадима.</strong> Жирный рыжий кот, которого Алексей должен был покормить. Сбивает Алексея с ног при вбегании — «Споткнувшись от кота, что весом был больше меня. Я рестекся на полу, чувствуя как в нос наливаеться красная густая жидкость.» Во время тряски прыгает к нему под стол «с расширенными глазами, и больно вцепившись в руку прижимался ко мне, словно хотел стать меньше». Кот назван и как индикатор: «да и кот если всетаки, что-то горела таким беспечным не был бы». В версии 3 он «рыжий котяра» и «любимый котяра», поднимающийся в воздух вместе со столом и посудой. Соотношение этого кота с белым котом из детства в переписке не оговорено.</p>\n<p><strong>Существо без кожи («кусок мяса»).</strong> Описано как «кем то не перижованый кусок мяса с хрящами», «чём-то похожий на тень человека», с глазами-бусинами и с отверстием на пузе, из которого оно испускает жёлтую густую жидкость и которым булькает, пытаясь, возможно, что-то сказать: «Возможно она хотела, что-то сказать, но не могла.» Оно же удивлено встречей не меньше Алексея. Алексей его избивает — кулаком в полотенце, потом ботинком в живот, потом десятками пинков; существо «вертелся как таракан упавший на спину» и издавало «знакомый звук визга жертвы»: «Да это звук легко узнать хоть у человека, животного и насекомого они разные, но интонация одна и та-же.» Оказавшись живучим, оно заставляет Алексея взять молоток для отбивки мяса — «Идеально молоток для куска мяса». Пять ударов показывают, что череп есть: «\"Так ты всё же человек. Ну или был им когда-то\" не знаю почему возникла эта мысль. Ну я не отрицал эту мысль.»</p>\n<p><strong>Инцидент (ядерный удар).</strong> См. ниже.</p>", "r": []}, {"t": "Как менялся — состояния по датам, старое не затирается", "a": ["S04", "PS-0266-S04", "PS-0266--kak-menyalsya"], "h": "<h3>2025-05-04, id 323659–323662, окно w0090 — пролог про апокалипсис</h3>\n<p>Первое появление. Алексей — выживший, ведущий рассказ уже после катастрофы, обращающийся к читателям напрямую. Внутри пролога развёрнут один день: будильник («От такого самого Би Би Би. Ха такой бесячий звон, который наверное всё ненавидят. Но я скучаю»), выходной, звонок племяшки в 8:23, обещание приехать к 11, бутерброд с майонезом и колбасой, поиск детского магазина в телефоне, дорога.</p>\n<p>Дорога дана как нарастающая неправильность: «Заметил что на улице очень мало людей. Ну это не удивительно. Утро субботы, кто вообще встанет.» И следом: «Ехал я так. Почти по пустой дороги и думал \"что-то не так\" Не знаю почему. Просто эта мысль въелось в голову и не исчезала. Мой разум, что-то понял. Заметил мелкую размытую причину этой мысли. Но осознать еë не мог.»</p>\n<p>Сам удар: остановка на светофоре, он лёг на сиденье с закрытыми глазами, а подняв взгляд, увидел небо — «Линий в воздухе, как от самолёта. Вот только их было сотни если не тысячи. Словно всё страны мира решили разом запустить всё имеющий боеголовки.» Отдельно оговорено отсутствие предупреждения: «Не было сигнала или голоса, который говорил бы о запуске ракеты на нас. Не было паники, истерики. Была просто тишина. Пока не прогремел ударь.» Дальше — сотрясение земли, гул зданий, волна, трещащие окна и зеркала, обрушение. Конец эпизода: «Я ещё был в сознаний, когда здания упала на мою машину. А после тьма и тишина. Словно умер я и лежу в могиле.»</p>\n<p>Вселенная в этом окне не названа; отнесение к «Нимбу» дано по дате объявления.</p>\n<p><strong>Реплика соавтора.</strong> 2025-05-04 (id 323661) Миколай пишет: «мне второй больше нравится, поэтому предлагаю продолжить первый». Что именно сопоставлялось как «первый» и «второй» и какой из вариантов был отвергнут — из приведённого куска переписки не следует. Сообщение id 323662, входящее в объявленный диапазон версии, в выписке отсутствует.</p>\n<h3>2025-11-21, id 387581–387582, окно w0110 — «Место и ты», версия 2</h3>\n<p>Отнесение к вселенной в записи помечено как неясное (по дате объявления).</p>\n<p>Другая отправная точка: не пролог после катастрофы, а кабинет психолога до неё. Алексей здесь клиент, девятая встреча, монолог о прошлом «о чувствах и мыслях в те времена» (по его словам, тема задана самим психологом). Открывающее рассуждение — про желание ударить прохожего, про мир без психов и про то, что удерживает: законы, запреты, наказания, совесть.</p>\n<p>Воспоминания разделены им на две категории: «плохие и хорошие, лишь именно эти воспоминания оставляються с нами на веки». Перечислены четыре: холодная вода и отец; насекомые; одеяло и побои; белый кот с перебитыми молотком лапами. Итог — формула про ненависть к доминированию над собой и любовь к доминированию самому.</p>\n<p>Дальше — ответ на вопрос психолога о том, почему он не стал пьяницей или убийцей: сначала признание, что он соврал насчёт «КАЖДЫЙ», потом «После кота я совсем сорвался. И перешёл уже на сверстников и детей по младшие. Начал их бить, унижать и придераться. Я также начал часто драться и к сожалению не всегда выигравал». Фраза обрывается звонком телефона.</p>\n<p>Вторая половина версии — бытовой забег: звонок Вадима, куртка, выход из кабинета мимо «встретимся в пятницу Алексей», бег по улице против ветра, домофон, четвёртый этаж, ключ с первой попытки, кот, разбитый нос, отсутствие пожара, невымытая кастрюля и включённая электрическая плита.</p>\n<p>Конец версии — начало катастрофы, но уже в другой форме, чем в прологе. Сначала — то, чего он не успел осознать: «Я посмотрел на окно без всякой мысли. Без цели, что-то там увидеть. Но что-то было, что-то показалось мне. Лишь на долю секунды, нееет меньше чем на долю секунды. &lt;...&gt; И даже описать не могу, что я видел, ведь это было слишком быстро. \"Я шизофриник\" Возникла мысль, но не успела быть обдуманно.» Затем — тряска: стеклопакет, посуда, он под столом («Вспоминая множеств моментов из фильмов, где деревянный хрупкий стол спасал людей от движения гиганстких земных плит»), кот у него на руке.</p>\n<p>Версия землетрясения им же отвергнута: «Ведь не бывает таких длинных землетрясений, тем более в нашей-то стране, где все природные явления если, и проявляють себя то слабо.» И заключение эпизода: «Вдруг резко без следствий всё остановилась. Словно природа матушка всё же решила жалуется над разумом жалкого человека. Но нет это была не наша любимая матушка природа. Это было что-то иное, что-то более хитрое и понимающие человеческий разум.»</p>\n<p>Таким образом на 2025-11-21 катастрофа перестала быть только ядерным ударом извне: у неё появился субъект, «более хитрое и понимающие человеческий разум». Вариант с боеголовками из версии 1 при этом не отменён в тексте — оба состояния сосуществуют.</p>\n<h3>2025-11-21, id 387583–387584, окно w0110 — продолжение, версия 3</h3>\n<p>Отнесение к вселенной также помечено как неясное.</p>\n<p>Прямое продолжение предыдущего. Пауза оказалась паузой: «Она остановилась лишь на мгновения, чтобы я выдохнул и резкими и дрожащими движениями начал искать пачку сигарет. &lt;...&gt; А после она решила уронить этот мир.» Падение мира он опознаёт не прямо, а по следствию: «он был способен осознать, что поднявшийся в воздух стол, посуда и конешно же любимый котяра. Не просто так всё в воздухе.» Дальше — отключение сознания, сформулированное с иронией: «И после мой разум принял самое правильное решения. Верный ответ он нашёл и сделав правильный вывод он отключился.»</p>\n<p>Пробуждение: «Не знаю сколько прошло времени. Мне снилось сны очень яркий и непонятный, но такие приятные. Я не хотел просыпаться, я и дальше хотел быть во сне думая, что сон это ряльность, а всё остальное бред бредовой собаки.» Из сна его вынимает существо — способ описан как «Обоссал он меня короче, хотя я не уверен, что это было моча. Но мой мозг, что перебирал всю информацию, именно так ощутил жидкость, что лелась на моей тела.»</p>\n<p>Дальше — сцена с существом целиком (см. «Связи с другими»): полотенце на кулак, удар, ботинок, пинки, оценка кухонного ножа как непригодного, молоток для отбивки мяса, пять ударов, вскрытый под слоем плоти череп и вывод «Так ты всё же человек. Ну или был им когда-то».</p>\n<p>Здесь черта, заявленная в версии 2 как детская (насекомые, кот, интерес к тому, сколько вреда можно нанести, чтобы жертва была ещё живой), показана уже во взрослом действии, без объяснений и без комментария рассказчика.</p>\n<p>Сообщение id 387584 — служебная пометка «Третье».</p>", "r": []}, {"t": "Что с ним стало", "a": ["S05", "PS-0266-S05", "PS-0266--chto-s-nim-stalo"], "h": "<p>Не решено. В версии 1 (2025-05-04) он выживает — это следует из самой рамки пролога: рассказ ведётся уже после инцидента, из положения выжившего, а сцена с обрушившимся на машину зданием заканчивается «тьмой и тишиной». В версиях 2–3 (2025-11-21) он переживает падение мира в квартире соседа и после пробуждения убивает существо. Что происходит дальше, в переписке нет — версия 3 обрывается на мысли про череп.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0266-S06", "PS-0266--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вселенная для окна w0090 не названа; для версий 2 и 3 (окно w0110) отнесение к вселенной помечено как неясное. Привязка к «Нимбу» в обоих случаях — по дате объявления, а не по тексту.</li>\n<li>Как соотносятся две биографии — офисный сотрудник с сестрой и племяшкой из пролога и клиент психолога с отцом-пьяницей, белым котом и битыми сверстниками — не сказано. Одна и та же это линия или две версии одного персонажа, из переписки не следует.</li>\n<li>Не сказано, как соотносятся ядерный удар из версии 1 («сотни если не тысячи» линий боеголовок) и падение мира из версий 2–3, у которого есть субъект — «что-то иное, что-то более хитрое и понимающие человеческий разум». Один это инцидент, поданный по-разному, или разные события, осталось нерешённым.</li>\n<li>Что мелькнуло в окне на долю секунды перед началом тряски, не названо — прямо оговорено, что рассказчик не может это описать.</li>\n<li>Природа существа без кожи не объяснена. Откуда оно, сколько их, что означает жёлтая жидкость и отверстие на пузе, было ли оно человеком — не сказано; вывод «Так ты всё же человек. Ну или был им когда-то» дан как мысль Алексея, не как факт.</li>\n<li>Судьба племяшки, сестры, Вадима, Кати и кота после катастрофы не упомянута.</li>\n<li>Внешность Алексея нигде не описана. Возраст не назван.</li>\n<li>Способностей у него в переписке не заявлено.</li>\n<li>Что именно сопоставлялось в реплике Миколая «мне второй больше нравится, поэтому предлагаю продолжить первый» (2025-05-04, id 323661) и какой вариант был отклонён, из выписки не восстанавливается. Сообщение id 323662 в выписке отсутствует.</li>\n<li>Промежуток между версией 1 и версиями 2–3 — с 2025-05-04 по 2025-11-21 — записями по этому персонажу не заполнен.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["PS-0266--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-05-04</td>\n<td>323659–323662</td>\n<td>w0090</td>\n<td>Нимб (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-11-21</td>\n<td>387581–387582</td>\n<td>w0110</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-11-21</td>\n<td>387583–387584</td>\n<td>w0110</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0266-aleksey.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0266--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0266.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0266-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0266/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Чинить первым надо «Место и ты» — текст, из которого взяты две трети статьи. В базе он лежит двумя записями: <code>IS-0078</code> «Место и ты» — 22031 знак, статьи нет, вселенная «вне вселенной»; <code>PR-0097</code> «Место и ты» — 20718 знаков, статьи нет, вселенная «неясно». Ни ссылок, ни статьи, ни привязки. Для сравнения, пролог обеспечен полностью: <code>IS-0053</code> «Пролог про апокалипсис» — две ссылки, статья есть, 20091 знак, Нимб; <code>PR-0072</code> — статья есть, 10849, Нимб. Один и тот же персонаж: одна его половина стоит в мире, другая висит нигде. Отсюда, я думаю, и главный нерешённый вопрос статьи — как соотносятся офисный сотрудник с племяшкой и клиент психолога с отцом-пьяницей. Они не сведены, потому что не сведён источник.</p>\n<p>Второе — <code>PS-0310</code> «Существа без кожи (куски мяса)»: 24898 знаков, статьи нет, вселенная «вне вселенной», ссылок ноль. Двадцать пять тысяч знаков про существо, которым версия 3 заканчивается и природа которого в статье помечена как необъяснённая.</p>\n<p>Отдельно замечу: на самого Алексея (<code>PS-0266</code>, 33676 знаков) не ссылается ни одна статья. На племяшку (<code>PS-0267</code>, 11516) — тоже ни одной. Целая линия стоит в справочнике изолированно.</p>\n<h3>С чего начать</h3>\n<p>В базе, за одним исключением. <code>IS-0078</code> и <code>PR-0097</code> почти наверняка один и тот же текст в двух записях — объёмы отличаются на тысячу знаков; сверить, свести и осознанно решить вопрос со вселенной, а не оставлять «неясно» и «вне вселенной» на двух половинах одного файла. Дальше <code>PS-0310</code> — там, вероятно, лежит то, чего в статье нет: сколько их и откуда. Вадима, Кати, психолога и рыжего кота как отдельных сущностей в базе нет вообще — они существуют только внутри этих двух кусков; если они нужны, их заводить с нуля, а не искать.</p>\n<p>В архив идти ровно за одним: сообщение id 323662 (2025-05-04, окно w0090) числится в диапазоне версии, но в выписке отсутствует, а рядом с ним, в id 323661, стоит реплика Миколая «мне второй больше нравится, поэтому предлагаю продолжить первый». Без этого сообщения не восстановить, что вообще сравнивалось и что было отклонено. Второе окно для архива шире: промежуток между 2025-05-04 и 2025-11-21 по этому персонажу пуст — полгода, окна с w0090 по w0110.</p>\n<h3>Как развивалось</h3>\n<p>2025-05-04 заявлен пролог: рассказчик уже после катастрофы, ядерный удар, тысячи следов в небе, здание на машине. В тот же день соавтор выбирает между двумя вариантами, и что выбрано — из выписки не следует. Дальше полгода без записей. 2025-11-21 возвращаются — но не продолжением, а другой отправной точкой: кабинет психолога до катастрофы, другое детство, другая механика конца, где у катастрофы появляется субъект, «что-то более хитрое и понимающие человеческий разум». В тот же день, id 387583–387584, дописано продолжение с пометкой «Третье». После 2025-11-21 записей нет. Первая версия при этом не отменена — оба состояния стоят рядом.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>В версии 1 отдельно и специально сказано, чего перед ударом не было: «Не было сигнала или голоса, который говорил бы о запуске ракеты на нас. Не было паники, истерики. Была просто тишина.» Отсутствие предупреждения названо как правило, оно и делает сцену.</p>\n<p>В версиях 2–3 у катастрофы появляется субъект — «более хитрое и понимающие человеческий разум». Вещь того же рода про него не проговорена: предупреждал он или нет. И то, что мелькнуло в окне «меньше чем на долю секунды» перед началом тряски, поставлено ровно на место, где в первой версии стоят следы в небе, — но было ли это предупреждением, не сказано ни да, ни нет. Для удара извне правило названо, для того, у кого есть намерение, — нет.</p>\n<h3>Отклик</h3>\n<p>Меня зацепил молоток. В детской сцене белому коту ломают лапы «разваливающим молотком», а взрослый Алексей, перебрав кухонный нож и отвергнув его как хлипкий, берёт молоток для отбивки мяса и сам это комментирует: «Идеально молоток для куска мяса». Никто на связь не указывает, ни рассказчик, ни психолог, и она от этого только сильнее. И вторая вещь — телефонная сцена в прологе: двое ждут, кто первый бросит трубку, выигрывает он, но выигрывает потому, что сестра забрала у дочери телефон. Человек, который считает себя хищником среди стада баранов, выигрывает свои противостояния чужими руками, и это сказано за две минуты бытового молчания в трубке, без единого слова о характере. Этот текст держится не концепцией, а деталью, и деталь его держит.</p></div>", "r": []}];</script>
