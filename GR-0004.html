<script>const BASE="";const DOCNAME="АЗИП («Апостол закон и права»)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0004-S01", "GR-0004--chto-eto"], "h": "<p>АЗИП — организация вселенной «Апостол», придуманная Славой. В базе она проходит как «Организация Славы, вербующая агентов для уничтожения опасных существ и чужемирцев» (<a href=\"MR-0138.html\">АЗИП</a>).</p>\n<p>Аббревиатура расшифровывается «Апостол закон и права». Расшифровку Слава дал не сразу: Миколай спросил «азип / это аббревиатура? / что означает» (2025-05-28, id 330952–330954), Слава ответил только вечером того же дня — «Не знаю», а следом «Апостол закон и права» (2025-05-28, id 330990–330991).</p>\n<p>Определение агента, данное Славой в первый же день разработки: «Агент- это люди или чужемирцы, которых завербовали в организацию АЗИП. И их главная цель уничтожения опасных существ. Буть то люди или чужемирцы» (2025-05-28, id 330909).</p>\n<p>Для внешнего мира организация выглядит не как организация: «Для всего мира организация АЗИП это невероятной большой количество бизнесов. По типу торговлю одежды, машины, еды и оказания каких либо услуг», причём «Везде. В каждом городе. Хотя бы один его из магазинов будет» (2025-05-28, id 330967–330968).</p>\n<p>К августу 2025 добавлена давность и оценка прочности: «у них есть нерушимая организация Азип, которой уже более сотней лет» (2025-08-30, id 359681).</p>\n<p>Разведка не ошиблась — это действительно организация, а не персонаж и не рубрика каталога. Но в списке участников стоит один id, <a href=\"PS-0277.html\">Агент АЗИП</a> «Агент АЗИП», и это не отдельный персонаж, а категория действующих лиц: любой завербованный человек или чужемирец. Поимённого состава организации в переписке нет.</p>", "r": [["Агент АЗИП", "PS-0277.html"], ["АЗИП", "MR-0138.html"]]}, {"t": "Состав", "a": ["S02", "GR-0004-S02", "GR-0004--sostav"], "h": "<ul>\n<li><a href=\"PS-0277.html\">Агент АЗИП</a> — Агент АЗИП. Не конкретное лицо, а категория: завербованные люди или чужемирцы, физически сильнее гражданских, привязаны к штабу, выполняют миссии по устранению и содержанию аномалий.</li>\n</ul>\n<p>Сотрудников Слава разделил на две части: «Сотрудники делятся на агентов и простых сотрудников, который работают в компаниях. Например создание машин и типо того» (2025-05-30, id 331445).</p>\n<p>Общее число сотрудников автор не знает и сказал об этом прямо: «Сколько всего сотрудников я не знаю / Могу вкинуть рандомной число / 700 000 000 / Если всего людей в мире 8 225 048 831 / То это число принципе ок / Но это сотрудники только люди» (2025-05-30, id 331446–331451). То есть 700 000 000 — названное самим автором случайное число, и оно относится только к сотрудникам-людям.</p>\n<p>Основатели и заказчики — апостолы. На вопрос Миколая «кто является основателем / зачем и на кого она работает» (2025-05-30, id 331237–331238) Слава ответил «Апостолы» и «На апостолов. Для защиты порядка» (2025-05-30, id 331454, 331456). Апостолов 21 человек, получивший благословение от правителя рая; двое из них «На Северном полюсе два апостола сидят» (2025-05-30, id 331453).</p>\n<p>В более ранних кусках текста (март 2025) показаны отдельные лица, работающие внутри такой системы, но там организация по имени АЗИП не названа — говорится «наша организация», «агент», «организация апостолов»:</p>\n<ul>\n<li>Дмитрий Рутковский, кодовое прозвище «Агрегат», апостол — он находит Антона Смирнова и предлагает ему выбор: жить обычной жизнью под слежкой либо «стать агентом нашей организаций. И защищать сон мирных людей. Но при этом рискуя своей жизнью» (2025-03-13, id 301809).</li>\n<li>Имитатор — апостол, который в другой сцене вербует рассказчика тем же способом: «Второй- ты становишься агентом и сразаешься с подобными тварями, как сегодняшний. Выбор за тобой. Я не буду говорить плюс и минус» (2025-03-18, id 305116).</li>\n<li>Михаил Саакашвили, кодовое прозвище «Медведь» — куратор набора, «по два метра ростом, в плечах почти также», «был суров, но справедливым». Там же дана норма нагрузки: «Каждый агент может быть куратором только для 10 людей» (2025-03-18, id 305116).</li>\n</ul>\n<p>Связь этих сцен с АЗИП в переписке прямо не проведена — название организации там не звучит.</p>", "r": [["Агент АЗИП", "PS-0277.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0004-S03", "GR-0004--obschie-sposobnosti-gruppy"], "h": "<p>Что есть у агента как у агента (полный текст контракта, 2025-05-29, id 331072):</p>\n<ul>\n<li>Физическое превосходство над гражданским. В пункте 2 контракта это записано как напоминание самому агенту: «Агент не забывайте, что вы физически куда сильнее обычного гражданского».</li>\n<li>Правовое превосходство. «Организация АЗИП не является государственной. Но в каком либо месте у нас равный или даже превосходящий права. А вы как сотрудник организации тоже получается превосходящий права, чем гражданский». Перечислено три пункта: «Во первых ваша юридическая защита. Во вторых доступ во всё возможные места. Будь то даже частная собственность или территория. В третьих права на убийство. И права нарушать некоторые законы. При условии, что это закон нарушен был при выполнения миссии или содержания агрессивной аномалии».</li>\n<li>Право уничтожения. Первая формулировка Миколая: «имеют право уничтожать всех кто входит в категорию опасных существ» (2025-05-28, id 330929).</li>\n<li>Доступ к информации АЗИП — ограниченный, выдаётся после сдачи теста вместе с основным снаряжением и правом выполнять миссии.</li>\n<li>Обязанность отчёта. «обязаны писать отчёт по каждому акту уничтожения» (2025-05-28, id 330929); в контракте это же обосновано целью: «во избежание устранения невинных существ. Вы обязаны писать отчёт, какое существо и при каких обстоятельствах вы его уничтожили».</li>\n<li>Запрет вредить гражданским и применять против них грубую силу (пункт 2).</li>\n<li>Обязательная фраза при встрече чужемирца у пространственной аномалии, дословно: «Здравствуйте я представитель организаций АЗИП и мы не хотим вам навредить. Я знаю, что вы не понимаете, что происходит. Но попрошу последовать за мной, что бы вас зарегистрировали». Если чужемирец проявит агрессию — «Постарайтесь его успокоить. Но если вашей жизни грозит опасность. То можете применить грубую силу».</li>\n<li>Собственность. Пункт 3: «полученная вами собственность в организации АЗИП. Хоть и зафиксировано за вами. Но всё ещё принадлежит организации АЗИП».</li>\n<li>Деньги. Пункт 4: во время подготовки ежемесячная выплата 200 000 рублей; при повторной подготовке выплаты нет. У агента выплата еженедельная, зависит от выполненных миссий, минимум 70 000, максимум «зависит уже от ваших достижений». Отдельно оговорена надбавка, «если вам выдали не верную информацию».</li>\n<li>Страховка и социальное. Пункт 5: жизнь застрахована, покрываются все медицинские расходы; при психологической травме — отпуск и сеанс с психологом от организации; при гибели на миссии выплата идёт семье или лицу из завещания (завещание пишется при вступлении), а если такого лица нет — «выплата будет отправленная на благотворительность с вашего имени».</li>\n</ul>\n<p>Что обязан делать агент (общая часть контракта, 2025-05-29, id 331072): встречать чужемирцев, покинувших свой мир, и либо регистрировать их, либо устранять при агрессии; уничтожать не только чужемирцев, но и «лиц, который имеют особенность и нарушающий закон» — особенностью может быть благословение или артефакт, отдельно названы Арбетар и фантазёры, получающие силу «непосредственно самого себя». По мере возможности их нужно устранить «Либо захватить и превести в штаб, которому вы привязаны».</p>\n<p>Как входят и как выходят:</p>\n<ul>\n<li>Пункт 1: кандидат, человек или чужемирец, проходит 6-месячную подготовку и тест. Провалил — ещё 3 месяца подготовки и повторный экзамен. Провалил снова — «вы обязаны покинуть АЗИП и не применять полученный знаний и умения», наказание за нарушение указано в Приложении 1. Сдал — выдают основное снаряжение, ограниченный доступ к информации и право выполнять миссии.</li>\n<li>Выход из организации возможен. На вопрос Миколая «они могу выйти из неё выйти? / или это пожизненно?» (2025-05-28, id 330938–330939) Слава ответил: «Желательно да. Но если вы всё же решите покинуть организацию АЗИП. То вы обязаны подписать документы. О том, что не будете применять знания и умения, который получили в организации. А также не раскрывать информацию о том, что не следует знать гражданским. При случае нарушения контракта вы будете наказаны» (2025-05-28, id 330940).</li>\n</ul>\n<p>Способности апостолов — основателей и заказчиков — описаны отдельно и на агентов не распространяются (2025-05-31, id 331635): четыре базовых способности любого благословенного (усиленная регенерация; усиление тела и всех чувств; аура; сенсорика), плюс уникальная у каждого — «правитель рая. Посылает им лишь сгустки чистой и необработанной силы, который формируется во что уже только внутри Апостолов», плюс дополнительная общая для них способность — телепатия между собой, в том числе всем вместе, с возможностью отказаться от разговора и прервать его. «Всё же апостолы всё равно чаще всего сильнее любого другого благословенного».</p>", "r": []}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0004-S04", "GR-0004--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<ul>\n<li>Агенты и простые сотрудники. Простые работают в компаниях прикрытия — например «создание машин и типо того» (2025-05-30, id 331445). Агент — тот, кто подписал контракт и прошёл подготовку.</li>\n<li>Агент и куратор. Куратор ведёт набор: «Каждый агент может быть куратором только для 10 людей» (2025-03-18, id 305116).</li>\n<li>Кандидат и агент. До сдачи теста человек получает выплату 200 000 в месяц и не имеет ни снаряжения, ни доступа к информации, ни права выполнять миссии; после — получает всё три.</li>\n<li>Люди и чужемирцы. Пункт 1 контракта прямо уравнивает их на входе: «Кандидат, будь то человек или чужемирец».</li>\n<li>Апостолы стоят над агентами как отдельный класс. В базе это зафиксировано так: «Класс сильных носителей силы, стоящий над агентами» (Список 12 апостолов <em>(статьи ещё нет — <a href=\"kb/SL-0054-spisok-12-apostolov.html\">исходник</a>)</em>, окно w0082).</li>\n<li>Размер выплаты агента различает агентов между собой: минимум 70 000 еженедельно, «А максимальная зависит уже от ваших достижений».</li>\n</ul>", "r": [["Список 12 апостолов", "kb/SL-0054-spisok-12-apostolov.html"]]}, {"t": "Иерархия", "a": ["S05", "GR-0004-S05", "GR-0004--ierarhiya"], "h": "<p>Наверху — апостолы: основатели и заказчики, организация работает «На апостолов. Для защиты порядка» (2025-05-30, id 331456). Обоснование их положения: «Типо апостолы с давних времён защищали мир. И во всё времена государство о них знала» (2025-05-30, id 331455).</p>\n<p>Филиальная структура: «Ну у неё 21 главных филиалов. У каждого филиала ещё есть свои филиалы. На их ней территории. А также на всех их ней территорий разный компаний» (2025-05-30, id 331444).</p>\n<p>Агент привязан к штабу — захваченных нужно «превести в штаб, которому вы привязаны» (2025-05-29, id 331072).</p>\n<p>Организация несёт ответственность за завербованных. Это Слава сформулировал, отказываясь от идеи убивать провалившего кандидата: «Тем более это именно мы их завербовали и несем за них ответственность» (2025-05-30, id 331459).</p>\n<p>Миколай предложил ещё один элемент устройства — «есть доска где главы организации размещают этих существ» (2025-05-28, id 330959). Ответа на это предложение в переписке нет; «главы организации» помимо апостолов нигде не названы.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S06", "GR-0004-S06", "GR-0004--otnosheniya-s-drugimi-gruppami"], "h": "<ul>\n<li>Апостолы. Основатели и заказчики; АЗИП — их организация. В окне 2025-08-30 организация описана как их опора: апостолы — «Сильнейший среди благословенных. Людей, что лишь своё силой и авторитетом поддерживают мир» (id 359681).</li>\n<li>Чужемирцы. Основной объект работы: их встречают у пространственных аномалий, регистрируют или устраняют. В контракте отдельно оговорено: «Не всё чужемирцы опасны и хотят кому-то навредить».</li>\n<li>Носители особенностей: благословенные, владельцы артефактов, Арбетары, фантазёры. Подлежат устранению или захвату, если имеют особенность и нарушают закон.</li>\n<li>Государства. Организация «не является государственной», но имеет равные или превосходящие права. На вопрос Миколая «она не привязана к законодательству конкретного государства / это как минимум транснациональная компания ТНК» (2025-05-30, id 331231–331232) Слава ответил только про контракт: «Ну типо контракт России» (2025-05-30, id 331443).</li>\n<li>Арбетары. Отношение с их стороны показано изнутри текста, монологом старика-арбетара: «Эти апостолы не пойми кем себя возомнили и везде понаставили свои порядки, на чужой силе»; и там же признание — «не могу не признать, что свою работу они выполняють слишком идеально. Ну даже в идеальной системе есть единичные пробои» (2025-03-13, id 301806). Организация по имени АЗИП в этом фрагменте не названа.</li>\n<li>Сестра, благословенная правителем Кильке, и её подручные. В окне 2025-08-30 Слава разбирает их как кандидатов на противника, способного пробить АЗИП, и признаёт, что не тянут: «Да она сильнее одного апостола. Но дальше че. Это не та сила, что поставит на колени весь мир. А её подручный всё слабее апостолов. Каждый из них один на один против апостолов продует. При этом у них не такая большая группировка» (id 359684). Итог: «Нет сестра так и останется ключевым злодеем. Но кто в её команде должен быть настолько сильном что перевернёт хот битвы» (id 359688).</li>\n<li>Серафим. Отклонён как постоянный противник: «Есть Серафим. Но это одноразовый босс. Что появится, когда будет война с раем» (2025-08-30, id 359686).</li>\n<li>Существа из рая. Тоже отклонены: «существа из рая не подходят на злодеев. Во первых нет так таковой цели, кроме мести. Во вторых не какой группироаонной работы не будет их же в разный места раскидает» (2025-08-30, id 359687).</li>\n</ul>", "r": []}, {"t": "Как менялась — по датам", "a": ["S07", "GR-0004-S07", "GR-0004--kak-menyalas"], "h": "<p><strong>2025-03-13 (id 301806–301809), до появления названия.</strong> Внутри художественного текста описан приём в агенты: апостол Дмитрий Рутковский («Агрегат») даёт Антону Смирнову выбор между жизнью под слежкой и службой, три дня на раздумье и отказывается принять ответ, данный сразу. Организация названа только «наша организация».</p>\n<p><strong>2025-03-18 (id 305116–305117, 305329–305341).</strong> Тот же приём показан со второго лица: вербовка на месте, звонок через три дня, лагерь на 6 месяцев подготовки, куратор Михаил «Медведь», группа из 10 человек на куратора, норма «Каждый агент может быть куратором только для 10 людей». Рассказчик отучился 3 недели вместо 6 месяцев, так как «я был в идеальном физической форме». Там же оговорено, что запись с рассказом об устройстве мира была удалена Михаилом через 7 минут, «А его отправитель был наказан». Миколай замечает систему: «я про то что у этих апостолов такая система получается / интересно че они с этими агентами делают / и сколько уже таких агентов / ваще удобная система»; Слава отвечает «Дохера» и «Отправляют сражаться» (id 305333–305339).</p>\n<p><strong>2025-05-28, день (id 330906–330940).</strong> Слава просит «Права и обязанности агента ?» и «Под накидай вариантиков». Даёт определение агента. Миколай выдаёт первую пару: право уничтожать всех из категории опасных существ и обязанность отчёта по каждому акту уничтожения. Появляется контракт как механизм вербовки и порядок выхода из организации с подпиской о неразглашении и неприменении знаний.</p>\n<p><strong>2025-05-28, вечер (id 330952–330991).</strong> Миколай задаёт блок вопросов: аббревиатура и её значение; «имеют ли право сообщать где состоят?»; «где можно найти информацию об этой организации в том мире?». Слава отвечает про прикрытие — сеть бизнесов во всех городах — и даёт расшифровку «Апостол закон и права».</p>\n<p><strong>2025-05-29 (id 331071–331075).</strong> Слава выкладывает полный текст контракта: общая часть про обязанности и превосходящие права, пункты 1–6. Пункт 6 обрывается на номере. Миколай отвечает «ну пипец» и «а когда тогда получится...»; Слава — «Не знаю».</p>\n<p><strong>2025-05-30, утро (id 331230–331247).</strong> Разбор Миколая на достоверность. Названо, что организация не привязана к законодательству конкретного государства и это как минимум ТНК, но «масштаб мне не ясен / как будто бы она маленькая». Вопросы: сколько сотрудников и филиалов, где расположены, кто основатель, зачем и на кого работает, «каким образом не государственная компания имеет право выдавать подобные права». Предложен вариант обоснования: «возможно был когда-то совет 300+ государств о создании и поддержании такой организации?». Отдельно про язык обязательной фразы: «а на каком языке это сказано? как чел из абсолютно другого мира поймёт речь одного из 300+ языков». И про пункт 3 о собственности: «даже то что я поел у вас в столовой?». Итог реплики Миколая: «получается рубли и язык русский.... мде».</p>\n<p><strong>2025-05-30, день (id 331442–331461).</strong> Ответы Славы: контракт российский; 21 главный филиал с подфилиалами и компаниями на их территориях; деление сотрудников на агентов и простых; случайное число 700 000 000 только по людям; филиалы по всему миру, двое апостолов на Северном полюсе; апостолы как основатели и заказчики, цель — защита порядка. Про совет государств — «Ну об этом стоит подумать». Про еду из столовой — «Еда разве является имуществом».</p>\n<p><strong>2025-05-31 (id 331635–331636).</strong> Прописана природа апостолов: 21 человек с благословением правителя рая (21 — максимум для правителя рая), телепатия между собой, уникальные способности из-за необработанного сгустка силы.</p>\n<p><strong>2025-08-30 (id 359681–359692).</strong> Организации задан возраст и характеристика: существует более сотни лет, «нерушимая». Ставится задача найти противника, под которого эта прочность сломается: «И как придумать злодея, чтобы люди осушители страх. О том что апостол не справится и Азип не вывозит». Наперёд объявлен исход: «В конце всё истории и в последнее битве апостолы продуют. Большинство апостолов сдохнуть. Поэтому нужна сила что позволит это сделать». Разговор оборвался — Миколай отложил: «на кровать установят, я отдохну и потом покумекаю, ок?».</p>\n<h3>Предложенное и не принятое</h3>\n<ul>\n<li>Обязанность уничтожать определённых существ по списку с доски, которую ведут главы организации (2025-05-28, id 330957–330959) — предложение Миколая, ответа нет.</li>\n<li>Обязанность иметь устройство связи и отвечать на каждый звонок (2025-05-28, id 330960) — предложение Миколая, ответа нет.</li>\n<li>Право получить защиту от существ (2025-05-28, id 330961) — предложение Миколая, ответа нет.</li>\n<li>Совет 300+ государств как источник полномочий негосударственной организации (2025-05-30, id 331241) — ответ Славы «Ну об этом стоит подумать», решения нет.</li>\n<li>Убивать кандидата, дважды провалившего экзамен, вместо исключения (2025-05-30, id 331244: «смешно, лучше просто убейте») — отклонено: «Так просто убить. Чтобы потом другие агенты могли бы начать восстание. Тем более это именно мы их завербовали и несем за них ответственность» (id 331459). Вместо убийства Миколай предложил переподготовку (id 331243).</li>\n<li>Сестра и её подручные как сила, ломающая АЗИП (2025-08-30, id 359684) — отклонено по недостатку силы, но сама Сестра осталась ключевым злодеем.</li>\n<li>Серафим (id 359686) и существа из рая (id 359687) — отклонены как противники такого масштаба.</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S08", "GR-0004-S08", "GR-0004--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет. В списке участников одна позиция, и та — категория, а не лицо.</li>\n<li>Пункт 6 контракта не дописан: текст обрывается на номере «Пункт 6.» (2025-05-29, id 331072).</li>\n<li>Приложение 1, где по контракту указаны наказания за нарушения, упомянуто, но не написано. За выход с нарушением подписки сказано только «вы будете наказаны», без содержания.</li>\n<li>Общее число сотрудников не определено: «Сколько всего сотрудников я не знаю», 700 000 000 названо самим автором случайным числом и охватывает только людей.</li>\n<li>Число сотрудников-нелюдей не названо.</li>\n<li>Где расположены 21 главный филиал — не сказано; названо только «Во всём мире» и двое апостолов на Северном полюсе. Совпадение числа главных филиалов (21) и числа апостолов (21) в переписке не оговорено.</li>\n<li>Как негосударственная организация получила право на убийство и на нарушение законов — осталось нерешённым. Вариант с советом 300+ государств повис на «Ну об этом стоит подумать».</li>\n<li>На каком языке произносится обязательная фраза-обращение к чужемирцу и как чужемирец из другого мира её понимает — вопрос задан (id 331245), ответа нет.</li>\n<li>Считается ли еда, съеденная в столовой, имуществом организации по пункту 3 — вопрос Миколая (id 331246), встречная реплика Славы «Еда разве является имуществом» (id 331461), решения нет.</li>\n<li>Имеет ли агент право сообщать, где состоит, и где в том мире можно найти информацию об организации — вопросы заданы (id 330955–330956), прямых ответов нет; косвенно отвечает только описание прикрытия.</li>\n<li>Руководство помимо апостолов не описано. «Главы организации» упомянуты один раз в предложении Миколая про доску (id 330959) и больше нигде.</li>\n<li>Кто именно из 21 апостола основывал организацию и когда — не сказано; возраст «более сотни лет» назван без даты основания.</li>\n<li>Названия и специализация 21 главного филиала не даны.</li>\n<li>Связь ранних сцен вербовки (март 2025) с АЗИП по имени не установлена: там организация называется «наша организация» и «организация апостолов».</li>\n<li>Противник, под которым «Азип не вывозит», к концу окна 2025-08-30 не придуман — разговор оборвался на паузе.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0004--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0277.html\">Агент АЗИП</a></li>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0138.html\">АЗИП</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0004--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0004.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0004-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0004/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первое — те, на кого организация работает. <code>SL-0054</code> «Список 12 апостолов»: три ссылки, статьи нет, база 234 052 знака. Самая крупная запись без статьи во всём наборе. Апостолы здесь — основатели, заказчики и верхний этаж иерархии; их 21, и по ним же нарезаны 21 главный филиал. Совпадение чисел статья фиксирует как неоговорённое, а сам список, в котором апостолы перечислены, называется «12 апостолов» и никуда не ведёт. Три расхождения — 12, 21 и число филиалов — сходятся в одной записи, и эта запись нераскрыта.</p>\n<p>Второе — категории, ради устранения которых контракт вообще существует. <code>SL-0089</code> «Список категорий сил (Благословенный, Арбетары, Альфы, Чужемирцы, Владельцы артефактов, Фантазёры)»: четыре ссылки, статьи нет, база 1 753 знака. Здесь дыра другого рода — не «статьи нет при большом материале», а «на неё ссылаются, а материала полторы тысячи знаков». Общая часть контракта перечисляет ровно этот набор как объекты работы агента; перечень есть, разбора за ним нет. Рядом <code>SL-0090</code> «Реестр персонажей и сил» — четыре ссылки, статьи нет, 5 492.</p>\n<p>Третье — противник. <code>PS-0215</code> «Сестра имитатора»: четыре ссылки, статья есть, база 7 906. <code>PS-0217</code> «Правитель Кильки»: две ссылки, статья есть, 14 203. Окно 2025-08-30 ставит задачу — найти силу, под которой АЗИП не выстоит, — и перебирает кандидатов; на четыре ссылки к ключевому злодею приходится восемь тысяч знаков базы. Пробел «противник не придуман» упирается не в архив, а в то, что про уже назначенного злодея материала почти нет.</p>\n<h3>С чего начать</h3>\n<p>В базе:</p>\n<ul>\n<li><code>MR-0139</code> «Контракт и правила агента АЗИП» — 17 145 знаков, статья есть. Первое место, куда идти за оборванным пунктом 6 и за Приложением 1: если продолжение вообще существует, оно тут.</li>\n<li><code>MR-0138</code> «АЗИП» — 15 539. Общая карточка организации; проверять по ней число филиалов и деление сотрудников.</li>\n<li><code>PS-0277</code> «Агент АЗИП» — 11 887 при статье на 14 028. Статья уже длиннее базы — здесь добирать нечего, и это стоит знать заранее.</li>\n<li><code>PS-0279</code> «Правитель рая» — 23 121, и <code>PS-0278</code> «Правители» — 26 811. Обоснование «21 — максимум для правителя рая» проверяется здесь, а не в окне 2025-05-31.</li>\n<li><code>MR-0122</code> «Агенты» — 12 802, и <code>PR-0060</code> «Блог Максима» — 31 165. Мартовские сцены вербовки лежат там; связь с АЗИП надо сначала искать в этих двух записях и только потом объявлять её отсутствующей.</li>\n</ul>\n<p>В архив — за одной точкой и одним промежутком.</p>\n<p>Точка: 2025-05-29, id 331072. Контракт обрывается на «Пункт 6.». Смотреть сообщения непосредственно после 331072 и до 331075 — там же реплика «а когда тогда получится...» и ответ «Не знаю», то есть обрыв замечен обеими сторонами в тот же час.</p>\n<p>Промежуток: после 2025-08-30, id 359692 — «на кровать установят, я отдохну и потом покумекаю, ок?». Разговор о том, кто сломает АЗИП, оборван на паузе с прямым обещанием вернуться. Всё, что идёт дальше по датам — сентябрь и позже, — надо просмотреть именно на предмет этого возврата.</p>\n<h3>Как развивалось</h3>\n<p>2025-05-28 — заявлено: запрос «Права и обязанности агента ?», определение агента, первая пара «право уничтожать / обязанность отчёта», прикрытие в виде сети бизнесов, расшифровка аббревиатуры вечером того же дня. 2025-05-29 — оформлено в документ: полный текст контракта, пункты 1–5, шестой обрывается на номере. 2025-05-30 — ограничено снаружи: разбор на достоверность, вопросы про юрисдикцию, язык, масштаб; в ответ числа — 21 филиал, 700 000 000 сотрудников с оговоркой, что число случайное и только по людям, контракт российский. Часть вопросов уходит в «Ну об этом стоит подумать» и «Еда разве является имуществом». 2025-05-31 — достроен верхний этаж: 21 апостол, телепатия, сгустки необработанной силы. Дальше три месяца тишины. 2025-08-30 — возврат, но с другой стороны: организации задают возраст, называют нерушимой и тут же начинают искать, чем её сломать; заранее объявлен исход — «В конце всё истории и в последнее битве апостолы продуют». Разговор обрывается на «потом покумекаю».</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Правило про провалившего кандидата названо, и названо с обоснованием. Убивать нельзя: «Так просто убить. Чтобы потом другие агенты могли бы начать восстание. Тем более это именно мы их завербовали и несем за них ответственность». Вместо убийства — исключение с подпиской о неприменении знаний и неразглашении, наказание за нарушение — в Приложении 1.</p>\n<p>Пункт 1 контракта уравнивает вход: «Кандидат, будь то человек или чужемирец». То есть чужемирец проходит те же шесть месяцев, тот же тест и может провалить его дважды на тех же основаниях.</p>\n<p>При этом по общей части того же контракта чужемирец — это существо, покинувшее свой мир, которое агент обязан либо зарегистрировать, либо устранить при агрессии. Что происходит с чужемирцем, исключённым из организации, контракт не говорит: подписка о неразглашении для человека означает возвращение к обычной жизни, а для него возвращаться некуда — его собственный статус в этом мире и есть предмет работы АЗИП.</p>\n<p>Для человека правило выхода названо. Для чужемирца, уравненного с ним на входе, правила того же рода нет.</p>\n<h3>Отклик</h3>\n<p>Самое интересное здесь — что документ написан с той стороны, с которой такие документы обычно и пишут. Пункт 5 про страховку: психологическая травма — отпуск и сеанс с психологом; гибель на миссии — выплата семье или лицу из завещания, которое пишется при вступлении; а если такого лица нет — «выплата будет отправленная на благотворительность с вашего имени». Последний пункт совершенно не нужен сюжету и именно поэтому убедителен: кто-то подумал про агента, у которого никого нет. Рядом — пункт 2, начинающийся с «Агент не забывайте, что вы физически куда сильнее обычного гражданского»: не запрет, а напоминание, будто в организации уже случались истории, после которых эту строчку и вписали. И третье, что зацепило: разбор 2025-05-30, где вся конструкция проверяется вопросом «а на каком языке это сказано?» — фраза-обращение к существу из другого мира написана по-русски, зарплата в рублях, контракт российский, и ответом идёт «получается рубли и язык русский.... мде». Организацию строили как всемирную, а споткнулась она о столовую и о язык. Мне нравится, что оба возражения остались в тексте неотвеченными — это честнее, чем задним числом дописать перевод.</p></div>", "r": []}];</script>
