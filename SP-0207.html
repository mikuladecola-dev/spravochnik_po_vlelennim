<script>const BASE="";const DOCNAME="Живучесть упыря";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0207-S01", "SP-0207--mehanika"], "h": "<p>Живучесть — единственная сила упыря. Она описана не через определение, а через перечисление способов убийства, которые не срабатывают (2025-03-19, id 305855):</p>\n<div class=\"q\"><p>«Ты можешь скинуть его с небоскреба. Но он выживет. Ты можешь подорвать его или жечь. Он выживет. Ты можешь продырявить ему черепушки, что аж мозги будут видно. Но он выживет. Ты можешь выпотрошить или утопить его. Но он выживет. И так я могу перечислять до бесконечности.»</p></div>\n<p>Перечисление объявлено принципиально незамкнутым — рассказчик отдельно оговаривает, что список можно продолжать «до бесконечности». Точный предел, то есть способ, которым упыря всё-таки можно убить, в переписке не назван.</p>\n<p>Определение упырей, данное раньше самого перечисления (id 305854): «Это не люди, которых тяжело убить».</p>\n<p>Живучесть покрывает и болевой порог: упырь не умирает от боли. Рассказчик отказывается от обезболивающего при вживлении экзоскелета именно на этом основании — «Я же всё равно не умру от боли. Оставьте лучше для людей». Операция, при которой нужно «отрезать несколько конечности. Вырвать органы и продырявить череп», описана как четырнадцать дней, которые он провёл «словно был пол пытками», — и он их пережил.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0207-S02", "SP-0207--ogranicheniya-i-cena"], "h": "<p>Живучесть не даёт ничего сверх себя. Это оговорено прямо: «Упырь не владеет, какой-то сверхчеловеческой силой или скоростью. Он просто живучий и всё».</p>\n<p>К живучести привязаны два минуса, названные в тексте по номерам.</p>\n<p><strong>Первый минус — каннибализм.</strong> У упырей «невероятный голод». Рассказчик не находит для него сравнения: «Подобно... Не знаю с кем подобно. Это просто был голод, который не как не удовлетворить, что бы они не ели». Голод утихает только от человечины: «Но если они съедят человечину. Этот бесконечный голод утихнет. И они смогут стать счастливы».</p>\n<p>Отдельно оговорено, что сам по себе этот минус жить не мешает: «Будь-то он один. То можно было жить. Ведь пераги это люди. Их можно есть. Жувать. Глотать». То есть заражённые пераги считаются годной пищей, и голод решаем без нападения на выживших людей.</p>\n<p><strong>Второй минус — потеря «я»</strong> (<a href=\"SP-0209.html\">Потеря «я»</a>), деградация личности. Описан как неизбежный итог.</p>", "r": [["Потеря «я»", "SP-0209.html"]]}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0207-S03", "SP-0207--nositeli"], "h": "<p>Упыри. Они начали появляться среди выживших после катастрофы — раскола солнца и последовавшего заражения: «Это где-то 30-40 процентов выживших стали упырями».</p>\n<p>Носитель, показанный изнутри, — упырь-рассказчик, житель технологически развитого мира, защищавший группу из 38 людей и позже надевший экзоскелет.</p>\n<p>Происхождение самих упырей оставлено нерешённым в самом тексте: «От чего вообще взялись упыри. Это заража из рая. Или это попытка правителя спасти людей. Не знаю».</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0207-S04", "SP-0207--kak-menyalas-po-versiyam"], "h": "<p>Одна версия.</p>\n<p><strong>2025-03-19 (id 305854–305855, окно w0083).</strong> Способность введена сразу в готовом виде — сначала определение «не люди, которых тяжело убить», затем перечисление неработающих способов убийства, затем отсечка про отсутствие сверхсилы и сверхскорости, затем два минуса. Позднее в том же массиве добавлена деталь про экзоскелет: живучесть — то, что делает возможным его установку, и после неё упырь «стал сильнее, быстрее», то есть сверхсилу и сверхскорость даёт не способность, а техника.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0207-S05", "SP-0207--svyaz-s-drugimi-sposobnostyami"], "h": "<ul>\n<li><a href=\"SP-0209.html\">Потеря «я»</a> «Потеря \"я\"» — второй минус упыря, идёт с живучестью в одном перечне и в одном сообщении.</li>\n<li>Каннибалистический голод — первый минус, назван в том же месте; отдельной сущностью в переписке не оформлен.</li>\n<li>Благословения (усиления, самоисцеления, энергия и сенсорика как четыре базовых) описаны в соседнем куске того же дня как система первого мира и апостолов. Связь живучести упыря с системой благословений в переписке не проведена: упыри объяснены заражением или действием правителя, не благословением.</li>\n</ul>", "r": [["Потеря «я»", "SP-0209.html"]]}, {"t": "Пробелы", "a": ["S06", "SP-0207-S06", "SP-0207--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Способ, которым упыря всё-таки можно убить, не назван. Перечисление объявлено бесконечным.</li>\n<li>Не сказано, восстанавливаются ли повреждения (регенерация) или упырь просто продолжает существовать повреждённым. Термина для этого в переписке нет.</li>\n<li>Не сказано, обратим ли переход в упыря.</li>\n<li>Не объяснено, почему упырями стали именно 30–40 процентов выживших, а не все.</li>\n<li>Происхождение упырей — «заража из рая» или «попытка правителя спасти людей» — оставлено развилкой, автор внутри текста выбор не делает.</li>\n<li>Отклонённых вариантов в переписке нет: способность появилась и больше не пересматривалась.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0207--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0209.html\">Потеря «я»</a></li>\n<li><strong>Упомянут в способностях:</strong> <a href=\"SP-0209.html\">Потеря «я»</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0021.html\">Упыри</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0207--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-03-19</td>\n<td>305854–305855</td>\n<td>w0083</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0207-zhivuchest-upyrya.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0207--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0207.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["SP-0207-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/SP-0207/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Самое дешёвое и при этом прямо неверное: «Каннибалистический голод — первый минус, назван в том же месте; отдельной сущностью в переписке не оформлен». Оформлен. <code>SP-0208</code> «Голод упыря» — статья есть, база 15 749. Строчка противоречит состоянию справочника и чинится одной ссылкой.</p>\n<p>Дальше — связи вида уходят не туда, где материал. Отсюда есть выход только в <code>GR-0021</code> «Упыри», а группы — производный слой: своего источника в базе нет ни у одной из 25 групп, база у всех 0. Тот же вид лежит в <code>PS-0231</code> «Упыри» (17 407) и в <code>PS-0232</code> «Упырь-рассказчик» (35 190, две ссылки) — на эти две записи отсюда не ведёт ничего. Пятьдесят с лишним тысяч знаков про носителей в двух шагах от статьи о носителях.</p>\n<p>Самая дорогая дыра: мира нет. Ни статьи, ни записи в базе — только заголовок прозы <code>PR-0061</code> (34 415). На безымянном мире висят <code>PS-0232</code>, <code>PS-0231</code>, этот текст (15 808), <code>SP-0208</code> (15 749), <code>SP-0209</code> (15 890), <code>SP-0210</code> (16 871), <code>PS-0233</code> (28 551) — около полутораста тысяч знаков про существ, снаряжение и катастрофу без мира, к которому это всё крепится.</p>\n<h3>С чего начать</h3>\n<p>Главный пробел — способ, которым упыря всё-таки можно убить, — искать в базе, и в одном месте: <code>SP-0185</code> «Бессмертие рассказчика» (2025-02-24, id 293229, окно w0076, база 9 064). Там та же конструкция, что и здесь: перечень неудавшихся смертей — выстрел в челюсть, вены, высота, петля, огонь, — тот же исход («становился упырем я») и та же еда (плоть Перага, которая «не гнила»). Это либо более ранняя версия того же под другим именем, либо ближайший соседний случай; сверять надо в первую очередь её.</p>\n<p>Дальше по базе: <code>PS-0231</code> (17 407) и <code>PS-0232</code> (35 190) — то, чего не хватает в разделе носителей; <code>PR-0061</code> (34 415) — монолог целиком; <code>MR-0123</code> «Раскол солнца» (18 152, ссылок ноль) — катастрофа и 17 процентов выживших, с которыми доля 30–40 не сведена, о чём уже написано в <code>GR-0021</code>.</p>\n<p>В архив идти только за регенерацией: слова для неё в переписке нет, значит смотреть надо, не возникло ли оно при чтении — 2025-03-20, окно w0083, id 306140–306170.</p>\n<h3>Как развивалось</h3>\n<p>Заявили сразу готовым и без обсуждения: 2025-03-19, id 305854 — определение, id 305855 — перечисление неработающих способов убийства. Ограничили в том же сообщении и двумя ходами: отсечка «Упырь не владеет, какой-то сверхчеловеческой силой или скоростью» и два пронумерованных минуса. Дальше в том же массиве живучесть переиспользовали как предусловие — она объясняет, почему возможен экзоскелет и почему сверхсила приходит от техники, а не от вида. 2025-03-20 при чтении разбирали соседей — предохранитель, развитый мир; к живучести не возвращались, и больше она не пересматривалась.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для голода признак назван прямо и работает как правило: годится человечина, и пераги годятся, потому что «пераги это люди» — то есть сказано, по какому свойству тело считается пищей. Для самого перехода в упыря признака нет: есть только доля, «где-то 30-40 процентов выживших». В том же массиве, сообщение 305856, для благословения правило доступа сформулировано положительно и жёстко — получить его может только разумный житель Кильки, первого мира. Кто становится упырём, а кто остаётся в оставшихся шестидесяти-семидесяти процентах, правилом того же рода не описано. Показываю место.</p>\n<h3>Отклик</h3>\n<p>Нравится, что живучесть определена отрицанием и без единого термина. Не «регенерация», не «бессмертие» — список того, что не сработает, и честное «И так я могу перечислять до бесконечности». Читателя ставят в положение того, кто пытается убить и не может, и это работает лучше любой механики. Сразу за этим — «Он просто живучий и всё», отсечка, которая отбирает у вида весь героический потенциал: не сильнее, не быстрее, только не умирает. А потом голод, от которого нельзя закрыться, и оговорка про перагов: «Их можно есть. Жувать. Глотать» — три глагола там, где хватило бы одного. Вот на этой строчке вид перестаёт быть просто выносливым.</p></div>", "r": []}];</script>
