<script>const BASE="";const DOCNAME="Пректри (остров-пустыня)";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0037-S01", "MR-0037--ustroystvo"], "h": "<p>Пректри — остров-пустыня, он же «остров сталкера», «пустыня». Часть архипелага защитников (мир островов).</p>\n<p>Появился при перетасовке островов 2024-07-09 (id 201618–201635): остров-пустыня заменил вулкан, а вулкан ушёл «на технологию». Первое описание Славы: «Сталкер остров пустыня / Наемники криминал наркотики все там» (id 201621).</p>\n<p><strong>Порядок и власть.</strong> Формулировки Миколая (id 202105–202113): «анархия / беззакония / нет власти», «ну там кланов много», «семьи пытаются выживать расти и бороться / однако всем похуй», «там предательство это норма». Слава добавил определение: «Неполноценный остров можно сказать» (id 202110).</p>\n<p>Правительства нет: «Нахуй им там нет правительства сами все добывают с других островов или…» (id 202369). Ресурсы забирают с других островов — Миколай: «они будут их пиздить / из других островов» (id 202366–202367) — или в Ультима Туле. Фраза Славы в переписке обрывается на «или», второй источник назван Миколаем/по контексту как Ультима Туле, дальше тема не развёрнута.</p>\n<p><strong>География и климат</strong> (id 202116–202123):</p>\n<ul>\n<li>река — Нил («Река Нил»);</li>\n<li>«Ночью холодно / Днём жарко»;</li>\n<li>«я вижу так что у них вечно ветрено и пасмурно» (Миколай);</li>\n<li>общий вид Миколай назвал «апокалипсис лютый», Слава подтвердил: «Да».</li>\n</ul>\n<p><strong>Кто выживает.</strong> Миколай: «власть и жизнь там точно у сильного», «там 100% нет слабых и умных / только сильные или сильные и умные» (id 202124–202126). Слава возразил насчёт умных: «Ну про умных можно подумать», «Кланам нужны умный» (id 202127, 202131). Итог, к которому пришли: умные кланам нужны, но подняться не могут — Миколай: «но они не поднимуться», Слава: «да». Про слабых: «но слабого поебать, убъют в любом случае» (id 202134).</p>\n<p><strong>Контакты с внешним миром</strong> есть и идут через наёмников: на вопрос «у них ваще будут контакты с внешним миром» — «Там дохуя наемников ,будут» (id 202345–202346).</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0037-S02", "MR-0037--naselenie"], "h": "<ul>\n<li>Наёмники, криминал, наркотики — заявлено с первого упоминания острова.</li>\n<li>Кланы. Их много, семьи выживают и борются. Состав кланов не назван (см. Пробелы).</li>\n<li>Сталкер живёт здесь. На вопрос «сталкер там живёт?» — «Да» (id 202349–202350). Он одиночка: «Не он одиночка / То бишь просто легенда» (id 202354).</li>\n<li>Температура упоминается рядом со сталкером («И температура тоже», id 202351), но затем отнесён к Пресрогу: «Температура в престог» (id 202358). На вопрос «они оба одиночки?» Слава ответил «Нет».</li>\n<li>Умные — отдельная прослойка: нужны кланам, но не поднимаются.</li>\n</ul>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0037-S03", "MR-0037--mesto-vo-vselennoy"], "h": "<p>Пректри входит в мир островов (архипелаг защитников). В перетасовке островов 2024-07-09 остров-пустыня встал на место вулкана, а вулкан был переведён на технологию (id 201622–201629).</p>\n<p>Отношение к преступной организации Пресрог (<a href=\"MR-0036.html\">Пресрог</a>) проведено разделительно: остров сталкера — не филиал Пресрога, а «просто криминальный остров» (id 201984). При этом «Семена у сталкера» (id 201966). Персонаж Температура относится к Пресрогу, но упомянут в связи с пустыней.</p>\n<p>С внешним миром остров связан через наёмников. Ресурсы добывает на других островах и в Ультима Туле — собственного правительства и хозяйства нет.</p>", "r": [["Пресрог", "MR-0036.html"]]}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0037-S04", "MR-0037--kak-menyalsya-po-versiyam"], "h": "<p>Весь материал — один вечер 2024-07-09 (окно w0046).</p>\n<p><strong>2024-07-09, id 201618–201635.</strong> Введение при перетасовке островов: остров-пустыня вместо вулкана. Наёмники, криминал, наркотики.</p>\n<p><strong>2024-07-09, id 202097–202120.</strong> Анархия, беззаконие, нет власти, много кланов, семьи выживают и борются, предательство — норма. «Неполноценный остров». В конце заходит разговор про реки и климат.</p>\n<p><strong>2024-07-09, id 202114–202135.</strong> География и климат: река Нил, ночью холодно, днём жарко, вечно ветрено и пасмурно, апокалиптический вид. Разбор того, кто выживает: сильные — да, слабых убивают, умные нужны кланам, но не поднимаются.</p>\n<p><strong>2024-07-09, id 202344–202362.</strong> Контакты с внешним миром через наёмников. Сталкер живёт на острове как одиночка-легенда. Температура отнесён к Пресрогу.</p>\n<p><strong>2024-07-09, id 202363–202372.</strong> Правительства нет, ресурсы добывают сами с других островов или в Ультима Туле.</p>\n<p><strong>2024-07-09, id 202475–202496.</strong> Слава поднимает вопрос о кланах: «Какие кланы есть в пустыни», «И сколько их», «Кто глава», «И какая сила» (id 202480–202487). Миколай отшучивается кланами из «Наруто»: «Учиха, Удзумаки, Акацуки» — и предлагает: «че / по стихиям делаем?». Слава: «Говно». На «ваш варик / слушаю» ответ — «Я спать». Разговор обрывается.</p>\n<p><strong>Отклонённые варианты.</strong> Деление кланов по стихиям (Миколай, id 202491) — отклонено Славой одним словом: «Говно». Названия Учиха, Удзумаки, Акацуки прозвучали как шутка и в работу не пошли.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0037-S05", "MR-0037--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Кланы пустыни так и не придуманы: не названы ни их число, ни главы, ни силы — вопросы Славы (id 202480–202487) остались без ответа, разговор оборвался на сон.</li>\n<li>Второй источник ресурсов Слава начал называть и не договорил: реплика обрывается на «или» (id 202369).</li>\n<li>Про «семена у сталкера» (id 201966) больше ничего не сказано.</li>\n<li>Не сказано, как устроен быт острова помимо кланов и наёмников — города, поселения, торговля в переписке не описаны.</li>\n<li>Роль сталкера на острове дальше «живёт здесь, одиночка, легенда» не расписана.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0037--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0036.html\">Пресрог</a></li>\n<li><strong>Упомянут в мирах:</strong> <a href=\"MR-0036.html\">Пресрог</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0037--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-09</td>\n<td>201618–201635</td>\n<td>w0046</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-09</td>\n<td>202097–202120</td>\n<td>w0046</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-09</td>\n<td>202114–202135</td>\n<td>w0046</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-09</td>\n<td>202344–202362</td>\n<td>w0046</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-09</td>\n<td>202363–202372</td>\n<td>w0046</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-09</td>\n<td>202475–202496</td>\n<td>w0046</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0037-prektri-ostrov-pustynya.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0037--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0037.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
