<script>const BASE="";const DOCNAME="Церковь Асгарда";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0027-S01", "GR-0027--chto-eto"], "h": "<p>Церковь Асгарда — религиозная организация, которой принадлежит вся власть на третьем острове, Асгарде. Разведка определила её как группу верно: это не один персонаж, а правящая верхушка из нескольких человек плюс организация вокруг них. Но собственно проработанное лицо в ней одно.</p>\n<p>Строй острова Миколай назвал сразу, при раздаче политических режимов всем семи островам: «допустим Асгард это уже теократия, тобиж власть у церкви» (2024-07-03, id 194910). Позже он повторяет ту же формулу уже как готовый пункт: «власть у церкви, правитель папа Римский» (2024-07-09, id 201808).</p>\n<p>Идеология церкви записана Славой дословно и дважды, одним и тем же текстом — сначала 2024-07-05 (id 198018), потом 2024-07-09 (id 201803):</p>\n<div class=\"q\"><p>«Религия<br>Нам нужно истребить всех тех в кого вселился демон всех тех кого не понимает нашего бога мы должны очистить мир для спасения его»</p></div>\n<p>Бог, от имени которого церковь действует, — Параман (<a href=\"PS-0116.html\">Параман</a>). По задумке Славы это «просто бог которого придумали чтобы оправдать свои действия» (2024-07-09, id 201754). Вера острова устроена двухступенчато: люди верят в бога «и верят что отце может разговаривать с богом» (2024-07-09, id 201821).</p>\n<p>Отдельно оговорено, что церковь на Асгарде исполняет ещё и роль преступной организации. На вопрос Миколая «там тож есть семена преступной организации?» Слава отвечает: «Это церковь» (2024-07-09, id 201964–201965).</p>", "r": [["Параман", "PS-0116.html"]]}, {"t": "Состав", "a": ["S02", "GR-0027-S02", "GR-0027--sostav"], "h": "<p>Поимённого состава в переписке нет ни одного — ни одно лицо церкви не названо по имени. Поэтому список участников пуст, и ниже перечислено то, что о составе сказано.</p>\n<ul>\n<li><strong>Верхушка из трёх человек.</strong> Численность определена Славой и подтверждена Миколаем: «Сколько их будет» / «3 достаточно или больше» — «достаточно» (2024-07-05, id 198019–198021).</li>\n<li><strong>Главный священник, он же святой отец.</strong> Единственный расписанный из трёх: «1 точно главный священник то бишь святой отец» (2024-07-05, id 198022). Он же — «папа Римский» в формулировке Миколая (2024-07-09, id 201808), тот, с кем, по вере острова, разговаривает бог.</li>\n<li><strong>Двое остальных из трёх.</strong> Не придуманы. 2024-07-09 Слава снова ставит это как открытый вопрос: на «Кто именно» он отвечает «Персы» и «И их 3 главных правителей» (id 201809–201811), то есть тройка правителей к тому моменту всё ещё числится неразработанной.</li>\n</ul>\n<p>Рядом с церковью названы, но членами её прямо не объявлены:</p>\n<ul>\n<li><strong>Защитник Асгарда, Избранный (<a href=\"PS-0106.html\">Защитник Асгарда (Избранный)</a>)</strong> — мальчик 14–15 лет, живёт в главной церкви, занят молитвой, «Про него все знают» и «его восхваляют» (2024-07-09, id 201831–201843). Подчинён верхушке: разговор о тройке начался с реплики Миколая «надо бы ещё обозначить че за хуи им дёргают» / «под кем он ходит» (2024-07-05, id 198016–198017). Отдельно уточнено, что защитник и папа римский — разные лица: на «ну папа это этот хуй» / «защитник» Слава отвечает «Нет» (2024-07-09, id 201812–201814). Членом церкви он при этом нигде не назван.</li>\n<li><strong>Отряд белых</strong> — трое: «1. Бесцветная 2. Лев 3. Наблюдатель» (2024-07-04, id 196145). В разговоре они появляются как ответ на вопрос «кто его приближенные», и Миколай подытоживает: «они получается его сподручные» (id 196126, 196148). «Его» здесь — защитника, не церкви. Слава обещал: «Потом как-нибудь расскажу полностью» (id 196146). Связь отряда с церковной верхушкой в переписке не установлена.</li>\n<li><strong>Армия Асгарда</strong> — существует, «Есть конечно они же хотят завоевать весь мир» (2024-07-09, id 201921); служба пожизненная с 16 лет, до этого работа на полях или в пещерах, по выходным молитвы (id 201928–201930). Что армией командует именно церковь, прямо не сказано.</li>\n</ul>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Первым чинить надо не поимённый состав, а <code>MR-0032</code> («Церковная власть Асгарда»). На него ссылаются три записи, а сам он — 3,3 КБ статьи и 2,7 КБ базы, самый тощий узел во всём асгардском кусте. Для сравнения: <code>MR-0022</code> (Асгард) — 26 КБ статьи и 31,5 КБ базы, <code>PS-0106</code> (Защитник Асгарда) — 13,4 КБ при пяти входящих ссылках, <code>MR-0031</code> (Религия Асгарда) — 6,3 КБ. То есть остров разработан, вера разработана, подчинённая фигура разработана, а орган, который всем этим управляет и на который всё это опирается, держит меньше трёх килобайт. Всё, что в этой статье не сказано о верхушке, упирается именно сюда.</p></div>", "r": [["Защитник Асгарда (Избранный)", "PS-0106.html"]]}, {"t": "Иерархия", "a": ["S03", "GR-0027-S03", "GR-0027--ierarhiya"], "h": "<ul>\n<li>Наверху острова — церковь; «власть у церкви, правитель папа Римский» (2024-07-09, id 201808).</li>\n<li>Внутри церкви — трое, из них первый и главный — главный священник, святой отец (2024-07-05, id 198022).</li>\n<li>Ниже — защитник Асгарда: им «дёргают», он «под кем-то ходит» (2024-07-05, id 198016–198017). Слава описывает это как «его с детства приручили что все не верующий одержимы демонами и он их убивает и до сих пор является ребенком Которым играют взрослый дяденкий» (2024-07-05, id 197976).</li>\n<li>Выше церкви формально стоит бог Параман, но по авторской задумке он придуман самими же людьми ради оправдания их действий (2024-07-09, id 201754). Посредник между богом и людьми — «папа римский».</li>\n<li>Порядок и подчинение внутри тройки, кроме того, что первый главный, не расписаны.</li>\n</ul>", "r": []}, {"t": "Отношения с другими группами", "a": ["S04", "GR-0027-S04", "GR-0027--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>С остальными шестью островами.</strong> Враждебные по вероучению: жители Асгарда считают себя посланниками богов, а всех остальных — демонами, и на этом строят воспитание детей — «Типо верить что они посланники богов а все остальные демон так они будут воспитывать детей и т.п.» (2024-07-04, id 196025). Миколай сравнил остров с «типо Гитлера» (формулировка Славы, id 196022) и со «Смертными грехами»: «ну там тож религия ёбу дала» (id 196026, 196028). Практический курс: «Они будут сидеть набирать ресурсы и силы для атаки на все острова» (2024-07-04, id 196127). На момент начала истории нападения ещё не начались: «В момент начала истории они ещё готовились» (2024-07-09, id 201955). Сотрудничества нет — Слава сам ставит это как проблему: «Откуда ресурсы ведь они не с кем не сотрудничает» (2024-07-09, id 201807).</p>\n<p><strong>С внешними пришельцами.</strong> Контакт редкий, и он трёх видов: «Нападения Или для тайного сотрудничества» и «Или просто агенты» (2024-07-09, id 201961–201963).</p>\n<p><strong>Внутри острова.</strong> Есть революционеры — на вопрос, воюют ли меж своих, Слава отвечает «Ну революционеры» (2024-07-09, id 201952). Неверующих не осталось: «Ну так там нет не верующих Всех не верующих убили» (2024-07-05, id 197979).</p>\n<p><strong>С Пресрогом (<a href=\"MR-0036.html\">Пресрог</a>).</strong> Отношение осталось невыясненным. Слава сказал, что преступная организация на Асгарде — это церковь, и тут же — «Семена у сталкера» (2024-07-09, id 201965–201966). Миколай возразил по существу: «у церки цель убивать всех из внешнего мира, не» / «для преступной мировой организации странно» (id 201972–201973), Слава ответил «Да» и «?» (id 201974–201975). Дальше выяснилось, что Пресрог работает «Не на каждом» острове (id 201979), что у сталкера «просто криминальный остров» (id 201984) и что «Преступная организация независит нет от кого» (id 201988). Входит ли асгардская церковь в Пресрог или просто занимает на своём острове ту же нишу — в переписке не сказано. В названный состав Пресрога (Кай, Закон, Мазохистка; позже Температура) никто из церкви не входит, и защитники в организацию тоже не входят (id 202006–202007). Главу Пресрога не выбрали; предложенный Миколаем вариант — «думаю это будет колобок» (id 202015–202016) — развития не получил, к церкви отношения не имеет.</p>", "r": [["Пресрог", "MR-0036.html"]]}, {"t": "Как менялась — по датам", "a": ["S05", "GR-0027-S05", "GR-0027--kak-menyalas"], "h": "<p><strong>2024-06-17 (id 183193–183236) — отклонено, и это другая церковь.</strong> В июньской ветке о происхождении инструментов (<a href=\"MR-0016.html\">Происхождение инструментов</a>) Миколай предложил решение: «Религия» / «Церковь» / «Выдаёт» / «При рождении» / «На ритуале крещения», позже — «Дар серафима всевышнего». Слава отверг: «Нет» / «Их слишком дохуя», «А откуда церковь берет», и закрыл тему словами «Нет богов не будет». К Асгарду и Параману эта ветка не привязана, вопрос происхождения инструментов остался открытым. Записано здесь как первое появление в переписке церкви как элемента мироустройства — и как забракованный вариант.</p>\n<p><strong>2024-07-03 (id 194774–194776, 194841–194843, 194910).</strong> Асгард впервые назван третьим островом со своим защитником — Избранным. Сразу задано, что «Его остров будет в небе и там все будет повязанной на религий», а самого защитника «считает посланником богов». В тот же вечер, при раздаче политических режимов всем островам (<a href=\"MR-0025.html\">Режимы правления островов</a>), Миколай закрепляет строй: теократия, власть у церкви. Самой церкви как организации ещё нет — есть только режим.</p>\n<p><strong>2024-07-04 (id 196011–196029).</strong> Первое раскрытие содержания веры: остров религии, жители «возможно они будут типо Гитлера», верят, что они посланники богов, а все остальные демоны, и так воспитывают детей.</p>\n<p><strong>2024-07-04 (id 196124–196149).</strong> Миколай ставит вопрос прямо: «а че там по начинке азгарда» / «церковь получается у власти» / «кто его приближенные». Слава отвечает целью — копить ресурсы и силы для атаки на все острова, — и называет отряд белых из трёх человек (Бесцветная, Лев, Наблюдатель) как приближённых защитника. О церковной верхушке в этот вечер ничего.</p>\n<p><strong>2024-07-05 (id 197966–198006).</strong> Быт под властью церкви: люди молятся и работают, неверующих не осталось — всех убили. Работа — поля и рудники в небе. Руда — «Золотые церкви строить» и «Да и оружие надо бы». Обоснование, зачем всё это, если бог всё даст: у защитника энергии немного, он ребёнок с не до конца развитой силой, слабее Нуара и Имитатора, «один Избранные не будет же сражаться».</p>\n<p><strong>2024-07-05 (id 198012–198026).</strong> Ключевой вечер для самой организации. Слава: «Давай займёмся религий». Миколай: «надо бы ещё обозначить че за хуи им дёргают» / «под кем он ходит». Слава даёт формулировку веры целиком, потом спрашивает про численность верхушки — «3 достаточно или больше», Миколай: «достаточно», Слава: «1 точно главный священник то бишь святой отец». Остальные двое на этом и остались нерасписанными.</p>\n<p><strong>2024-07-05 (id 198034–198045).</strong> Назван бог — Параман. Отдельно уточнено, что Кай не бог, а человек. Разговор обрывается.</p>\n<p><strong>2024-07-09 (id 201735–201760).</strong> Возврат к Асгарду после перерыва. Параман описан как «Просто бог которого придумали чтобы оправдать свои действия»; Миколай уточняет «а этот хуй папа римский типа» — «Да».</p>\n<p><strong>2024-07-09 (id 201782–201826).</strong> Сведение в пункты: «власть у церкви, правитель папа Римский». Слава повторяет формулировку религии слово в слово и снова помечает правительство как открытый вопрос: «Персы» / «И их 3 главных правителей». Разделены две фигуры: папа римский — не защитник; защитник — «избранный 14 летний мальчик». Механика веры: «В бога и верят что отце может разговаривать с богом».</p>\n<p><strong>2024-07-09 (id 201827–201862).</strong> Защитник помещён в главную церковь, о нём знают и его восхваляют, занятие — молитва. Миколай замечает, что защитник мог бы сам делать ресурсы «в роли римской письки»: «молятся челики» / «он ресы даёт», — но упирается в уже установленное ограничение: энергия у него не бесконечная и меньше, чем у любого другого защитника.</p>\n<p><strong>2024-07-09 (id 201886–201966).</strong> Обстановка вокруг власти церкви: остров неподвижен, висит над гористой местностью; армия есть, потому что хотят завоевать весь мир, служба пожизненная с 16 лет; женщины — «Грубо говоря производители» «Всего орудий детей еды и т.п.»; воюют с революционерами и за защиту территории. Завершается тем, что роль преступной организации на Асгарде отдана самой церкви.</p>", "r": [["Происхождение инструментов", "MR-0016.html"], ["Режимы правления островов", "MR-0025.html"]]}, {"t": "Пробелы", "a": ["S06", "GR-0027-S06", "GR-0027--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава церкви нет вообще. Ни одно лицо не имеет имени: есть только должность — главный священник, святой отец.</li>\n<li>Двое из трёх правителей не придуманы. 2024-07-05 их численность утверждена, 2024-07-09 состав всё ещё числится в открытых вопросах.</li>\n<li>Порядок внутри тройки за пределами «1 точно главный» не описан; кто чем занимается — в переписке не сказано.</li>\n<li>Не сказано, входит ли защитник Асгарда в церковь: он ей подчинён («им дёргают», живёт в главной церкви), но членом прямо не назван.</li>\n<li>Не сказано, командует ли церковь армией острова, хотя армия и цель войны заданы.</li>\n<li>Связь отряда белых (Бесцветная, Лев, Наблюдатель) с церковью не установлена: они названы приближёнными защитника. Слава обещал рассказать о них полностью — в этих окнах не рассказал.</li>\n<li>Отношение церкви к Пресрогу не выяснено: сказано, что на Асгарде роль преступной организации играет церковь, но возражение Миколая («для преступной мировой организации странно») ответа не получило.</li>\n<li>Не сказано, как церковь появилась и как захватила власть; описано только уже сложившееся положение.</li>\n<li>Высота, на которой висит Асгард, осталась без ответа (2024-07-09, id 201893, 201902) — вопрос острова, но задавался в той же ветке про устройство власти.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0027--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0106.html\">Защитник Асгарда (Избранный)</a>, <a href=\"PS-0116.html\">Параман</a></li>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0016.html\">Происхождение инструментов</a>, <a href=\"MR-0025.html\">Режимы правления островов</a>, <a href=\"MR-0036.html\">Пресрог</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0027--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0027.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0027-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0027/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым чинить надо не поимённый состав, а <code>MR-0032</code> («Церковная власть Асгарда»). На него ссылаются три записи, а сам он — 3,3 КБ статьи и 2,7 КБ базы, самый тощий узел во всём асгардском кусте. Для сравнения: <code>MR-0022</code> (Асгард) — 26 КБ статьи и 31,5 КБ базы, <code>PS-0106</code> (Защитник Асгарда) — 13,4 КБ при пяти входящих ссылках, <code>MR-0031</code> (Религия Асгарда) — 6,3 КБ. То есть остров разработан, вера разработана, подчинённая фигура разработана, а орган, который всем этим управляет и на который всё это опирается, держит меньше трёх килобайт. Всё, что в этой статье не сказано о верхушке, упирается именно сюда.</p>\n<p>Вторая по цене — <code>SL-0020</code> («Сравнение силы защитников»): статьи нет, базы 4,8 КБ, две входящие ссылки. На этом сравнении в GR-0027 держится вся экономика острова: поля, рудники, армия и отклонённый вариант «защитник сам даёт ресы» обоснованы тем, что энергии у Избранного меньше, чем у Нуара и Имитатора. Довод используется, а записи под ним нет.</p>\n<p>Третье — отряд белых. <code>GR-0028</code> статью имеет (8,3 КБ), но базы 0 и ноль входящих ссылок, а Бесцветная, Лев и Наблюдатель не заведены как сущности вообще. Дыра дешёвая по блокировке, но именно она делает раздел «Состав» списком должностей.</p>\n<h3>С чего начать</h3>\n<p>В архив за верхушкой — да, но не сразу. Сначала база: раз <code>MR-0022</code> держит 31,5 КБ, а <code>MR-0032</code> — 2,7 КБ, материал о власти почти наверняка разъехался в островную запись и в <code>MR-0031</code>. Проверять надо эти три записи вместе, до похода в переписку.</p>\n<p>По уровню силы защитника — идти в <code>SL-0020</code> и <code>ID-0110</code> («Система оценок сил», статьи нет, база 5,6 КБ). Оба без статей, оба уже в базе.</p>\n<p>В архив — за двумя вещами. Первая: двое из трёх правителей. Оба окна, где тройка обсуждалась (2024-07-05, id 198012–198026, и 2024-07-09, id 201782–201826), в статью вычерпаны, значит смотреть надо за их пределами — промежуток 07-05…07-09 и всё, что после id 202016, где разговор ушёл на Пресрог и оборвался на «колобке». Вторая: отряд белых. Слава прямо обещал «Потом как-нибудь расскажу полностью» 2024-07-04 (id 196146) — искать это обещанное продолжение по именам Бесцветная, Лев, Наблюдатель во всех окнах после 4 июля.</p>\n<h3>Как развивалось</h3>\n<p>2024-06-17 церковь заявлена как механизм раздачи инструментов и в тот же день отклонена: «Нет богов не будет». 2024-07-03 та же идея возвращается с другой стороны — не как механизм, а как политический режим острова, в общей раздаче режимов всем семи. 2024-07-04–07-05 её наполняют: вера, воспитание, быт, потом численность верхушки. Тут же и ограничивают — «3 достаточно», подтверждено, и расписан один из трёх. Дальше пауза в четыре дня. 2024-07-09 возвращаются и первым делом повторяют формулировку религии слово в слово, тем же текстом, что 07-05, а тройку правителей снова помечают как открытый вопрос — то есть за четыре дня по ней не сдвинулось ничего. В тот же вечер церкви добавляют новую функцию (преступная организация острова), и возражение по этой функции остаётся без ответа.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>2024-07-05 правило по неверующим названо предельно жёстко: «там нет не верующих Всех не верующих убили». 2024-07-09, отвечая на вопрос о войнах внутри острова, Слава называет революционеров. Для неверующих правило есть, для революционеров такого же рода — нет: против чего восстают и во что верят люди в мире, где неверующих не осталось, не проговорено. Место видно, обе реплики в статье.</p>\n<h3>Отклик</h3>\n<p>Сильнее всего тут работает двухступенчатость веры: люди верят в бога — и отдельно верят, что отец может с богом говорить. Одной фразой описан весь механизм власти, и не нужно объяснять, почему тройка безымянных мужиков управляет островом. Рядом стоит признание, что Параман «просто бог которого придумали чтобы оправдать свои действия», — и оно не разрушает конструкцию, а делает её злее. И третья деталь, лучшая: Миколай предлагает поставить Избранного качать ресурсы с молитв, и упирается в ограничение, которое сами же ввели несколькими днями раньше. Мир держит удар от собственного автора — это редко видно так наглядно. Мешает при этом одно: вся эта машина не имеет ни одного лица. Мальчик, которым «дёргают», прописан подробно, а те, кто дёргает, — три пустые должности. Читается почти как приём, но по датам это просто недоделанное место.</p></div>", "r": []}];</script>
