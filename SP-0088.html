<script>const BASE="";const DOCNAME="Способность \"Закон\"";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0088-S01", "SP-0088--mehanika"], "h": "<p>Базовая формула — от Миколая: «то шо говорит то и происходит» (2024-07-09, id 202059). Слава уточняет её до вида, который и закрепляется:</p>\n<ul>\n<li>Действие идёт не через слух, а через зону. «Ты не понял закон будет действовать в радиусе 70 метров и там без разницы услышал ты или нет пока не покинул радиус действия способности закон будет действовать» (id 202064).</li>\n<li>Радиус — 70 метров.</li>\n<li>Слышал приказ или нет — неважно.</li>\n<li>Закон держится, пока попавший под него не покинул радиус.</li>\n<li>Содержание закона всегда запретительное: «Нет закон что то запрещает только» (id 202065).</li>\n<li>Подчинение обязательно для всех в зоне: «Любой кто в радиусе 70 метров должен подчиняться закону» (id 202066).</li>\n</ul>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0088-S02", "SP-0088--ogranicheniya-i-cena"], "h": "<ul>\n<li>Закон действует и на самого носителя (id 202068). Исключения для себя нет.</li>\n<li>Мощность закона ограничена сверху жизнью носителя. На вопрос Миколая «насколько мощный закон он может кастануть? умереть?» (id 202069–202070) Слава отвечает «Может» (id 202074) и тут же ставит цену: «Он сам сдохнет» (id 202072). Миколай формулирует то же самое: «он и сам умрёт, но на это похуй» (id 202073).</li>\n</ul>\n<p>Авторство ограничений в переписке приписано Миколаю. Слава: «Так ты её и придумал» — «Про ограничения ты придумал»; Миколай сначала отрицает («не»), потом соглашается, уточняя, о чём речь: «в плане настолько мощно можно использовать способность» (id 202078–202082).</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0088-S03", "SP-0088--nositeli"], "h": "<p>Способность закреплена за персонажем Закон — статья помечена как часть Закона.</p>\n<p>В разговоре также упомянут Пресрог, в связке с репликой Славы «Он бы и не смог его убить или победить» (id 202058). Кто здесь «он» и кто «его», из переписки не следует; связь Пресрога со способностью зафиксирована только как соседство в этом обсуждении.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0088-S04", "SP-0088--kak-menyalas-po-versiyam"], "h": "<p>Версия 1 — 2024-07-09 (id 202056–202068, окно w0046). Помечена как повтор прежней мысли: Слава пересылает старые формулировки — радиус 70 метров, «без разницы услышал ты или нет», действие до выхода из радиуса, только запрет, обязательность для всех в радиусе, действие на самого носителя. Разговор начинается с вопроса Славы «Помнишь способности закона» (id 202056), то есть механика к этому моменту уже существовала; где и когда она была сформулирована впервые, в этом окне не сказано.</p>\n<p>Версия 2 — 2024-07-09 (id 202069–202090, окно w0046). Добавлен верхний предел мощности: закон можно скастовать вплоть до смерти цели, но носитель умирает сам. Прежние условия при этом не отменяются.</p>\n<p>В том же окне Миколай обещает свести материал по персонажам отдельно: «я обязательно всё инфу о персах выведу в отдельный документ» и «пропишу как надо» (id 202063, 202067). Сделано это или нет — в переписке не сказано.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "SP-0088-S05", "SP-0088--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Как формулируется закон вслух и есть ли требования к формулировке — не сказано.</li>\n<li>Сколько законов носитель может держать одновременно и как один закон снимается — не сказано.</li>\n<li>Что происходит с человеком, который вошёл в радиус уже после произнесения закона, — прямо не оговорено; сказано только, что слышал он или нет, неважно, и что действие держится, пока он не покинул радиус.</li>\n<li>Можно ли сопротивляться закону — не сказано.</li>\n<li>Границы «мощности» между обычным запретом и смертельным не описаны: названы только два края.</li>\n<li>Роль Пресрога в обсуждении не раскрыта.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0088--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0088--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-09</td>\n<td>202056–202068</td>\n<td>w0046</td>\n<td>7 островов (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2024-07-09</td>\n<td>202069–202090</td>\n<td>w0046</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0088-sposobnost-zakon.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0088--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0088.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
