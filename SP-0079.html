<script>const BASE="";const DOCNAME="Имитация";
const LEAD="<p>Способность (<a href=\"SP-0079.html\">Имитация</a>), проходящая через вселенные «7 островов» и «Апостол». Шесть зафиксированных версий, от 2024-07-04 до 2026-06-07, окна w0042, w0073, w0083, w0120, w0121. Варианты имени в переписке: «Имитация (способность Имитатора)», «Имитация способностей», «Имитация способности», «Имитация чужого благословения», «имитировать». Носитель во всех версиях один — персонаж Имитатор, в последней версии названный Имет.</p>";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0079-S01", "SP-0079--mehanika"], "h": "<p>Общее ядро, неизменное во всех версиях: носитель воспроизводит чужую способность. Всё остальное — количество копируемого, скорость, источник копии, срок хранения — менялось.</p>\n<p><strong>Исходная формула (2024-07-04, id 196044, 196048).</strong> «Мужчина со способностью имитировать способности ( только 1 )». В карточке персонажа способность записана одним словом: «Способности: имитировать». Ограничение «только 1» — то есть одна чужая способность за раз — задано сразу, вместе с самой идеей.</p>\n<p>Компенсацией названа не механика, а показатель: предельный контроль. В карточке «Контроль:100» при остальных показателях 7–8 (Сила 7, Ловкость 7, Меткость 8, Скорость 7). Миколай на это реагирует: «нихуя себе 100» (id 196050). Обоснование Слава даёт прямым текстом (id 196053): «А ты думаешь как он стал защитником со способностью лишь имитировать ведь не как не победить человека который всю жизнь пользовался свой способностью». То есть высокий контроль объясняет, почему носитель с чужой копией всё-таки побеждает того, кому эта способность принадлежит от рождения.</p>\n<p><strong>Формула с развитием (2025-01-28, id 285363).</strong> «Его способность имитировать способность врага, но лишь одну способность и то ему надо время, но плюс способность в том что он конечно имитирует но способен будет еë развить». Здесь три пункта сразу: одна способность, не мгновенно, но скопированное можно развить дальше оригинала.</p>\n<p><strong>Формула через мастерство (2026-04-19, id 462201).</strong> «А в конце он имитирует способность врага и превосходит его в мастерстве. То есть он буквально втаптывает в грязь всё годовые труды своих противников, который на протяжении многих лет развиваи свои способности». Там же оценка мощности: «Почти любой свой бой он может закончить за мгновение, его силы это позволяют».</p>\n<p><strong>Формула через частицы (2026-06-07, id 488504).</strong> Носитель — «Владелец глаз». «У него так и не смогла сформироваться структура дающий способности ( у него вместо него частицы)». Механика имитации: «его глазки способны видеть чужую структуры и так как у него самого нет структуры то он может с помощью частиц сформировать чужую структуру опять же на время да и структура которую имитируют в разы несовершенной по сравнений с оригиналом». Отсутствие собственной структуры здесь — условие копирования.</p>\n<p><strong>Формула через перестройку конструкции (2026-06-07, id 488545).</strong> Последняя на дату записи. «У него гибкая программа в голове. То есть когда у всех программа способности в голове закоренелая. То у него она податливая и гибкая». Главная способность: «изменения своё конструкции в голове на способность, которой он видит визуально. То есть он не копирует саму программу способности из мозга врага, он создаёт похожую по увиденному. Поэтому он так долго затягивает бой».</p>\n<p>Здесь копирование перестало быть изъятием чужого и стало воспроизведением по образцу. Отсюда два свойства, названные в том же сообщении и не встречавшиеся раньше:</p>\n<ul>\n<li>удержание: «он вполне способен держать в своё голове нужный конструкции сколько понадобится. ( то есть они не слетают обратно к нулю)»;</li>\n<li>запоминание: «он способен запомнить программу которой создал и потом повторить её без примера виде врага. Он способен запоминать программу только если часто её производил, создавал в своё голове. А это большинство способности апостолов, огонь, лёд и холод».</li>\n</ul>\n<p>В той же версии дано определение того, что вообще копируется. «Программа в голове это способность. А точнее это готовая конструкции Оам. По которой мы способны производить способности. Эту готовую и чустую конструкции мы способны навешивать дополнительные штрихи или слегка видо изменять. ( не сильно, ядро конструкции то бишь суть способности всегда остаётся одна и та же). То есть конструкции огня. И мы можем штриховать ее, по типу огненный шар, небесное копьё, прожег пространства. Но ядро всегда остаётся огонь».</p>\n<p><strong>В действии (2025-03-19, id 305857–305858).</strong> Единственное развёрнутое применение имитации в сцене. В финале боя из груди упыря «показались пальцы. И вдруг грудь упырья. Начала надуваться мелкими и большими оранжевыми пузырьками. И БАМ. Упырь взрывается». Реакция защитника, чьё благословение было скопировано: «А в голове защитника про мелькает лишь одна мысль \" Он сымитировал мою способность \" Удивляясь, как можно использовать своей благословенния». Оранжевые пузырьки применяются в той же сцене второй раз, уже против ангела (id 305858): «Образуя рядом с ним оранжевый пузырьки. Прогремел взрыв. Способный снести здания. Но не способные убить ангела».</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0079-S02", "SP-0079--ogranicheniya-i-cena"], "h": "<p><strong>Одна способность за раз.</strong> С первой версии — «( только 1 )» (id 196044) — и подтверждено во второй: «но лишь одну способность» (id 285363). В версиях 2026 года это ограничение прямо не повторяется и прямо не снимается.</p>\n<p><strong>Время на копирование.</strong> «и то ему надо время» (2025-01-28, id 285363). Сколько именно — не сказано. В версии 2026-06-07 (id 488545) то же ограничение переформулировано как последствие механики: раз он создаёт похожую конструкцию по увиденному, а не забирает готовую, «поэтому он так долго затягивает бой».</p>\n<p><strong>Требование увидеть.</strong> В версии 2026-06-07 (id 488545) имитируется способность, «которой он видит визуально». Повторить без примера можно только то, что часто производил сам.</p>\n<p><strong>Качество копии.</strong> Ограничение появляется только в версии 2026-06-07 (id 488504): «структура которую имитируют в разы несовершенной по сравнений с оригиналом». В следующей версии того же вечера (id 488545) этого минуса уже нет — копия там не хуже оригинала, а платой становится затянутый бой.</p>\n<p><strong>Минусы носителя вместо минусов способности</strong> (2026-06-07, id 488504): «Минусы частиц: плохой контроль; слабая способность накопления ( маленькая количество энергий)». Это прямая противоположность первой версии, где у носителя стоял «Контроль:100».</p>\n<p><strong>Живучесть и прочность</strong> (2025-01-28, id 285363): «Самый живучий среди них при этом прочность у него ниже чем у Воительницы».</p>\n<p><strong>Цена усиленного приёма</strong> (2025-03-19, id 305857): про «особый способ усиления имитатор» сказано «Но он поглащает слишком много сил. Да и его нужно ещё готовить».</p>\n<p><strong>Самоограничение носителя</strong> (2026-04-19, id 462201). Не свойство силы, а поведение: «Но нет он даёт противнику использовать всё свои способности, при этом даже не сопротивляесь». Отговорка носителя: «что он упёрся в тупик и таким способом пытается его преодолеть», и оценка этой отговорки в переписке — «звучат хреново».</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0079-S03", "SP-0079--nositeli"], "h": "<p><strong>Имитатор (2024-07-04, id 196043–196048).</strong> Защитник Оазиса — «остров спаситель для беженцев и людей который после 8 летний войны не куда идти, также все лабораторный крысы ( людий) от не куда идти, находят дом в оазисе. При этом имитатор следит чтобы на остров не попали преступники и криминальный люди». Карточка: «Имя: имитатор / Возраст: 32 / Любит: остров и его жителей / Не любит: когда кто-то разрушает его остров и мир на нем / Сила:7 / Ловкость:7 / Меткость:8 / Скорость:7 / Контроль:100 / Инструмент: жидкая массая которая имитирует образ и способности других инструментов / Способности: имитировать / Черты характера: ответственный, и чересчур трудяга». Отдельно: «Человек трудяга и ответственный. Делает все возможная что на его острове был рай».</p>\n<p><strong>Имитатор в команде против Серафима (2025-01-28, id 285363).</strong> Третий из четырёх, рядом с Воительницей, Агрегатом и Палачом. «Оружие у него жидкость который моментально может принять любую форму».</p>\n<p><strong>Имет (2026-06-07, id 488545).</strong> «Имет апостол и фигура старшего брата среди апостолов. Архетип учёного». Материализация в этой версии закреплена за ним одним: «на это способен лишь апостол Имет». Комбинирование особого усиления со способностью — тоже: «Ты не можешь их комбинировать. Никто не может, кроме Имета».</p>\n<p><strong>Инструмент носителя</strong> работает по тому же принципу, но применительно к инструментам: «жидкая массая которая имитирует образ и способности других инструментов» (2024-07-04, id 196048); «жидкость который моментально может принять любую форму» (2025-01-28, id 285363).</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0079-S04", "SP-0079--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-07-04, вселенная «7 островов», окно w0042, id 196043–196057.</strong> Способность копировать чужие способности, только одну. Компенсируется предельным показателем контроля (100). Прямо проговорено, зачем этот показатель нужен: без него защитником с одной лишь имитацией не станешь. Инструмент — жидкая масса, имитирующая образ и способности других инструментов. Разговор шёл в контексте распределения островов и защитников; на вопрос Миколая про преступную организацию Слава отвечает, что она «Не на коком» острове, «не зависит не от одного острова», «Ну может быть везде», «Ну главная там есть верхушка типо сильнейших в той организаций» и «Да, но она может заключать союзы» — к самой способности это не относится, но это тот же обмен сообщениями.</p>\n<p><strong>Версия 2 — 2025-01-28, вселенная «Апостол», окно w0073, id 285353–285369.</strong> Первое описание с оговорками: одна способность врага, не мгновенно, зато скопированное можно развить дальше оригинала. Носитель вписан в команду из четырёх против Серафима. Инструмент переописан как жидкость, мгновенно принимающая любую форму. Показатель контроля не упоминается; вместо него — характеристика по живучести и прочности. Обмен завершается ссылкой Миколая на telegra.ph/boi-01-28 (id 285369).</p>\n<p><strong>Версия 3 — 2025-03-19, вселенная «Апостол», окно w0083, id 305857–305858.</strong> Способность не описана, а показана в бою против упыря и ангела. Имитируется благословение защитника, проявляющееся оранжевыми пузырьками; упырь взрывается изнутри. Позже те же пузырьки применяются против ангела и здания снести могут, а ангела — нет.</p>\n<p>В той же сцене у имитатора есть два приёма, не сведённые в переписке с имитацией:</p>\n<ul>\n<li>«особый способ усиления имитатор» — прыжок и удар по воздуху, попавший по упырю и ангелу, «Разрушая землю и деревья. И откидывая ангела и упырья»; про него сказано, что он поглощает слишком много сил и его нужно ещё готовить. Далее в сцене имитатор применяет «усиленный удар» ещё дважды;</li>\n<li>цепь, которой он сначала стреноживает ангела («образуя цепь и накидавая. Эту цепь на ногу ангела»), а позже обвивает ему шею и притягивает к себе. Откуда берётся цепь — не сказано.</li>\n</ul>\n<p>Косвенно здесь же зафиксировано, что имитатор обучал защитника пользоваться благословением: «Не замечая, что благословения выключалось. Точнее его выключил предохранитель. А имитатор не научил вырубать этот предохранитель».</p>\n<p>Итог сцены: имитатор побеждает ангела, но не убивает — «Ему нужны ответы. Почему жители рая устраивают нападения на другий миры?». Защитник прогрызает ангелу горло раньше, чем имитатор успевает вмешаться.</p>\n<p><strong>Версия 4 — 2026-04-19, вселенная в исходнике помечена как неясная, окно w0120, id 462201–462203.</strong> Версия не про устройство способности, а про то, что она делает с миром. Слава: «Каждая моя вселенная скатывается из-за того что я каждый раз поднимаю уровень сил. И ещё есть закономерность из-за кого это». Перечислены вселенные: «В семи островах / В благословенная / В Оэм». Виновник: «Имитатор, высокомерный черт, что должен будет пройти свой этап перерождения».</p>\n<p>Боевой рисунок: «Он издевается над противниками. Почти любой свой бой он может закончить за мгновение, его силы это позволяют. Но нет он даёт противнику использовать всё свои способности, при этом даже не сопротивляесь. А в конце он имитирует способность врага и превосходит его в мастерстве. То есть он буквально втаптывает в грязь всё годовые труды своих противников, который на протяжении многих лет развиваи свои способности».</p>\n<p>Милосердие носителя оговорено как отягчающее: «При этом даже то что он чаще всего оставляет своих противников в живых. Не делает его хорошим, наоборот добавляет ещё один минус». Итоговая пометка о персонаже: «(Вот такое он персонаж) (при этом он ключевой персонаж)».</p>\n<p>Здесь же описан «акт перерождения» — сюжетный предел, к которому способность приводит носителя: он встречается с сильным противником и проигрывает, получает раны, которые не может залечить, «чаще всего потерю левого глаза, левой руки и правой ноги, и там зависимо от вселенной еще что-то». Дальше — полное ослабление, невыносимая боль, мысли о своих поступках, трагедия (потеря близкого), появление людей другой категории силы, «и именно в этот момент он перерождается буквально в бога». Варианты по вселенным: «В одной вселенной он буквально контролирует и ощущает все, и потсраивает правила мира под себя. В другое он получает силы от существа порядка выше чем кто либо. В Оэм он должен был бы стать Богом красок. То есть буквально Богом что перерисовает мир». Какие именно вселенные стоят за первыми двумя вариантами — не названо.</p>\n<p>Итог версии: «И из-за этого гандона мой мир улетает в жопу», затем «Поэтому Оэм пока отложим» (id 462202) и «Строим новую вселенную без энергии» (id 462203).</p>\n<p><strong>Версия 5 — 2026-06-07, вселенная в исходнике помечена как неясная, окно w0121, id 488504–488506.</strong> В исходнике помечена как повтор прежней мысли и как старый вариант. Носитель — «Имитатор мужчина / Владелец глаз». Механика привязана к отсутствию структуры и работе через частицы; копия заведомо несовершеннее оригинала и держится на время.</p>\n<p>В том же сообщении рядом с имитацией перечислены остальные способности носителя:</p>\n<ul>\n<li><strong>Особая усиления</strong> — «когда другие усиливают просто часть тела или все тела имитатор усиливает каждую волокна мышцы каждый кость из за этого его усиления раза 10 больше чем у обычных людей»;</li>\n<li><strong>«Я не умру пока не кончится энергия»</strong> — расшифровки нет, вместо неё «но здесь понятно»;</li>\n<li><strong>Материализация</strong> — «он может из частиц энергий создать любой не живой предмет но энергий тратится дофига ( если что обычный тоже так могут но то к чему относится структура например структура воды ты можешь без каких проблем создать воду )»;</li>\n<li><strong>Волнистый удар</strong> — «удар составляющий структура колебаться из за этого все действующий способности отменяются например ты запустил огненный шар и держишь его где то в воздухе по после того как тебя ударили этот огненный шар исчезает но после удара ты сразу сможешь использовать способность»;</li>\n<li><strong>Удар разрушающий структуру</strong> — «чтобы использовать этот удар тебе надо полностью отказаться от защиты да и плюсом твой мозг будет по тихонько сгорать если попытается его использовать, сам удар разрушает структуру на время дела оппонента чуть ли не простым человеком».</li>\n</ul>\n<p><strong>Версия 6 — 2026-06-07, вселенная в исходнике помечена как неясная, окно w0121, id 488544–488545.</strong> Переработка, объявленная прямо: «Сука пришлось всё перерабатывать, под новый мир. Всё способности имета» (id 488544). Носитель переименован в Имета и введён в число апостолов.</p>\n<p>Ключевое изменение относительно всех прежних версий — способность перестаёт быть копированием: «он не копирует саму программу способности из мозга врага, он создаёт похожую по увиденному». Основание — гибкость программы в голове: у всех она закоренелая, у Имета податливая и гибкая. Добавлены удержание конструкций без отката к нулю и запоминание часто производимых программ. Вся механика переописана внутри системы Оам.</p>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S05", "SP-0079-S05", "SP-0079--otklonennye-varianty"], "h": "<p><strong>Оэм отложена вместе с перерождением в Бога красок.</strong> 2026-04-19 (id 462201) описан вариант, где носитель в Оэм «должен был бы стать Богом красок. То есть буквально Богом что перерисовает мир». Решение по итогам: «Поэтому Оэм пока отложим» (id 462202), «Строим новую вселенную без энергии» (id 462203). Причина названа общая — рост уровня сил, который тянет за собой этот персонаж.</p>\n<p><strong>Вариант с отсутствующей структурой и частицами</strong> (2026-06-07, id 488504) в исходнике помечен как старый и в тот же вечер заменён вариантом с гибкой программой в голове (id 488545). Что из него ушло: имитация через глаза, видящие чужую структуру; частицы вместо несформировавшейся структуры; заведомая ущербность копии; ограниченность копии по времени; минусы частиц (плохой контроль, слабое накопление); приёмы «Волнистый удар», «Удар разрушающий структуру», «Я не умру пока не кончится энергия». Причина замены названа только общая: «пришлось всё перерабатывать, под новый мир».</p>\n<p><strong>Показатель «Контроль:100»</strong> (2024-07-04, id 196048) в последующих версиях не появляется; прямой отмены в переписке нет. В версии 2026-06-07 (id 488504) у носителя, наоборот, стоит «плохой контроль».</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S06", "SP-0079-S06", "SP-0079--svyaz-s-drugimi-sposobnostyami"], "h": "<p>По устройству способность определена только через чужую: без способности противника ей не на что опереться.</p>\n<p><strong>Благословение защитника, оранжевые пузырьки</strong> (2025-03-19, id 305857–305858) — единственная конкретная способность, имитация которой показана в сцене. Реакция самого защитника, что так его благословение использовать можно, для него самого неожиданна.</p>\n<p><strong>Способности апостолов</strong> (2026-06-07, id 488545) — то, что Имет может воспроизводить без примера, потому что часто их создавал: «А это большинство способности апостолов, огонь, лёд и холод».</p>\n<p><strong>Материализация</strong> (2026-06-07, id 488545). По определению противоположна имитации: «Материализация это создания конструкции Оам с нуля», тогда как имитация перестраивает конструкцию по образцу. «Он способен материализовать объект. Воду, машину, меч, пулемёт и т. Д. Он мателирезует объект без программы в голове». Минусы: «Во первых ошибки, создание какое либо конструкции с нуля, всегда приводят к взрыву, что тебе просто руки оторвёт, или вообще сдохнешь. Высасыванию Оам, то есть вся твоя Оам направляется в окружающую среду неконтролируема.и какие либо другие дефекты. А также худшая откат Оам. Когда Оам что ты выпустил, для создания конструкции. Направляется обратно. То есть вся твоя Оам течёт в одно направление и здесь вдруг появляется Оам что течёт в противоположную сторону, да ты просто разорвешься изнутри. 100 процентная смерть».</p>\n<p>Боевая применимость: «даже зная конструкции, в бою тебе все равно с нуля придётся её создавать. И одна ошибка и бам ты сдох. Поэтому нужна точность и концентрация и время куда больше чем для программы раза в 10, а концентрации в раза 100. И поэтому на это способен лишь апостол Имет». Сложность зависит от объекта: «тем сложнее объект, тем сложнее конструкции». Происхождение навыка: «( фактик. Он тренировался на полотне созидания ( да способность звездочета). Сутью полотна, как это увидел Имет, было сохранять разные конструкции, при этом если конструкции не удаётся то они просто распадаются, а не взрываются и т. Д.)».</p>\n<p>Материализация присутствует и в отклонённом варианте (id 488504), но там она работает от частиц энергии и доступна не только носителю.</p>\n<p><strong>Особая усиления (оу)</strong> (2026-06-07, id 488545). «Если всё представляют усиления как покрыть Оам своё тело. То имет представляет это как покрыть оам, каждую волокну мыщцы и кости, и всё до атомов. Из-за этого усиления куда мощнее чем обычная. Но затрачивает больше оам. И нужные нереальный концентрация и точность». Цена ошибки: «Если ты не покроешь или плохо покроешь какое-то волокно. То то просто взорвётся от напряжения, которой оказывает другие мыщцы покрытые оам нармально. Поэтому покрывать нужно полностью и на это тратиться уйму времени». Прямой конфликт со способностями: «Из-за того что для оу нужная невероятная концентрация, ты просто не сможешь применить свою способность. Ты не можешь их комбинировать. Никто не может, кроме Имета». Износ: «даже если ты покроешь всё ровно. То даже так мыщцы будут получать урон и ты долго не сможешь держать эту оу. Имету на это пофиг он апостол у него реген тела даже без Оам».</p>\n<p>Распространённость обеих: «Большинство апостолы тоже им обучены оу и материализация, но материализация слишком опасная, долгая, и не эффективная и ты так же не можешь использовать её вместе со своей способностью».</p>\n<p>Особое усиление в том же виде («усиливает каждую волокна мышцы каждый кость») присутствует и в отклонённом варианте (id 488504), где даёт усиление «раза 10 больше чем у обычных людей». В боевой сцене 2025-03-19 (id 305857) упомянут «особый способ усиления имитатор», но связь этого приёма с особым усилением версий 2026 года в переписке не проговорена.</p>\n<p><strong>Способности соседей по команде</strong> (2025-01-28, id 285363) названы в том же сообщении, что и имитация, и составляют её ближайший контекст: у Воительницы «контроль над массой, размером и плотностью, но только на себе или на неживых объектов»; у Агрегата — «менять агрегатной состояния неодушевлённых объектов, он может сделать прочным воздух или землю превратить в воду»; у Палача — «сжатия он может жать пространства чтобы приблизится к противнткк, или сжать атаку противника. Он также может сжимать ауру и делать слэш». Имитация кого-либо из них в переписке не обсуждается.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "SP-0079-S07", "SP-0079--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Сколько именно времени нужно на копирование («ему надо время», id 285363) — не сказано.</li>\n<li>Как скопированная способность снимается, переключается на другую и держится ли после боя — в версиях 1–5 не сказано. Свойство удержания появляется только в версии 2026-06-07 (id 488545), и то без указания, сколько конструкций можно держать одновременно.</li>\n<li>Действует ли ограничение «только одна» в версии 2026-06-07 (id 488545) — не сказано: там речь о запоминании нескольких программ и удержании конструкций, но старое ограничение ни подтверждено, ни отменено.</li>\n<li>Шкала, по которой у носителя «Контроль:100» при силе 7 и меткости 8, не названа; сохраняется ли этот показатель после первой версии — не сказано.</li>\n<li>«Особый способ усиления имитатор» (id 305857) не объяснён: ни в чём он состоит, ни как «его нужно ещё готовить», ни связан ли он с особым усилением поздних версий.</li>\n<li>Цепь, которой имитатор действует в бою (id 305857), не объяснена: ни откуда взялась, ни имитация ли это, ни связана ли с жидкой массой.</li>\n<li>Когда и как имитатор увидел благословение защитника, чтобы его воспроизвести, в переписке не сказано — зафиксирован только результат.</li>\n<li>Отношения имитатора и защитника как учителя и ученика упомянуты одной фразой («имитатор не научил вырубать этот предохранитель», id 305857) и не раскрыты.</li>\n<li>В версии 2026-04-19 (id 462201) не названо, какой вселенной соответствует перерождение с контролем правил мира и какой — получение сил от «существа порядка выше чем кто либо»; прямо назван только вариант для Оэм.</li>\n<li>Тождество Имитатора и Имета отдельно не проговорено: имя меняется внутри сообщения о переработке (id 488544–488545), объяснения смены нет.</li>\n<li>В версии 2026-06-07 (id 488504) не сказано, как имитация через частицы сочетается с остальными способностями из того же списка — можно ли применять их одновременно.</li>\n<li>Формулировка «Я не умру пока не кончится энергия» (id 488504) оставлена без расшифровки: «но здесь понятно».</li>\n<li>Вселенная для версий 4, 5 и 6 в исходнике помечена как неясная.</li>\n<li>Судьба инструмента (жидкой массы) в версиях 2026 года не упоминается — ни отменён, ни подтверждён.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0079--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0383.html\">Имитатор</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0008.html\">Команда против Серафима («пати»)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0079--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-04</td>\n<td>196043–196057</td>\n<td>w0042</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-28</td>\n<td>285353–285369</td>\n<td>w0073</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-19</td>\n<td>305857–305858</td>\n<td>w0083</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-04-19</td>\n<td>462201–462203</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-07</td>\n<td>488504–488506</td>\n<td>w0121</td>\n<td>неясно (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2026-06-07</td>\n<td>488544–488545</td>\n<td>w0121</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0079-imitaciya.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0079--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0079.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["SP-0079-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/SP-0079/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Последняя версия имитации целиком стоит на понятии, у которого нет статьи. <code>MR-0198</code> «Программа в голове (конструкция Оам)» — 12 666 знаков базы, статьи нет. Всё определение способности в редакции 2026-06-07 — это определение программы: у всех закоренелая, у него гибкая. Пока программы нет как статьи, имитация описана через неописанное.</p>\n<p>Тем же порядком лежат её соседи по механике, и ни у одного нет статьи: <code>SP-0129</code> «Материализация» (19 549) — вторая половина каждой развёрнутой записи об Имете; <code>SP-0136</code> «Сосудники (сосуд и структура)» (8 325) и <code>SP-0133</code> «Частицы вместо структуры» (6 086) — основание отменённой версии, без которого нельзя понять, что именно отменили; <code>SP-0277</code> «Кукловод» (8 279) и <code>SP-0278</code> «Вибрация (Волнистый удар)» (8 294) — содержимое двух из трёх слотов. Суммарно около 55 килобайт материала, напрямую примыкающего к этой статье и не разобранного.</p>\n<h3>С чего начать</h3>\n<p>В базе, и буквально в соседнем сообщении. Пробел «сохраняется ли лимит в одну способность за раз» закрыт в id 488546: «Ты не забыл сл может владеть тремя программами в голове. У имета три пустый программы. Одну он всегда оставляет чистое. А вот другие. Он заполняет». Диапазон источников этой статьи обрывается на 488545, поэтому сообщение сюда не попало, — но оно целиком разобрано в <code>SP-0127</code>. Там же и содержимое слотов: первый кукловод, второй огонь либо вибрации, третий всегда пустой под имитацию.</p>\n<p>Оттуда же берётся ответ на «что стало с Волнистым ударом и Я не умру пока не кончится энергия»: они не потерялись, а переехали в слоты — <code>SP-0277</code> (8 279) и <code>SP-0278</code> (8 294). Прежде чем писать «не перенесены», эти две записи надо прочесть.</p>\n<p>Единственное, за чем действительно надо в архив, — содержимое ссылки telegra.ph, id 285369, 2025-01-28, окно w0073. В переписку текст боя не перенесён; ориентир — тот же вечер, обмен 285353–285384, где сразу после ссылки идёт итог «Только имитатор умер».</p>\n<h3>Как развивалось</h3>\n<p>Заявили 2024-07-04: одна способность, и сразу компенсация — контроль 100 при остальных 7–8. Ограничили 2025-01-28: одна, нужно время, но скопированное можно развить. Показали в деле 2025-03-19 — единственный раз за всю историю записи. Потом 2026-04-19 разговор ушёл вообще не о механике: способность названа причиной, по которой «каждая моя вселенная скатывается», и из-за неё отложена целая вселенная. И через полтора месяца, 2026-06-07, дважды за один вечер: в 21:54 переслали дословную карточку 2024 года, в 22:58 — «Сука пришлось всё перерабатывать, под новый мир», и основание способности заменено целиком, с «нет структуры» на «гибкая программа». Обвинение апреля при этом ни отменено, ни повторено.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>В той же записи, где введена программа, названо правило её изменения: «Эту готовую и чустую конструкции мы способны навешивать дополнительные штрихи или слегка видо изменять. ( не сильно, ядро конструкции то бишь суть способности всегда остаётся одна и та же)... Но ядро всегда остаётся огонь». Это сказано про обычную, закоренелую программу. Про гибкую программу Имета — которая по определению податлива и вся способность в этом — не сказано, действует ли ограничение ядра на неё: привязан ли он, пока держит чужую конструкцию, к её ядру так же, как её хозяин, или граница «штрихи можно, ядро нельзя» для него проходит в другом месте.</p>\n<h3>Отклик</h3>\n<p>Зацепило, как трижды меняли основание и трижды пришли к одному: он может копировать, потому что у него самого нет своего. Контроль 100 вместо силы, частицы вместо структуры, гибкая программа вместо закоренелой — каждый раз способность выведена из нехватки, а не из избытка. И лучший ход здесь — последний: «он не копирует саму программу способности из мозга врага, он создаёт похожую по увиденному. Поэтому он так долго затягивает бой». Манера, которую полтора года объясняли характером — то жаждой учиться, то высокомерием, — вдруг получила механическую причину: он тянет бой не потому что издевается, а потому что лепит конструкцию с натуры и ему нужно смотреть. Задним числом, но сходится, и это редкий случай, когда перепридуманная механика чинит уже написанную сцену. А рядом лежит фраза 2026 года — «И из-за этого гандона мой мир улетает в жопу» — и это, пожалуй, самое честное во всей статье: автор проиграл спор собственному персонажу и записал это прямым текстом.</p></div>", "r": []}];</script>
