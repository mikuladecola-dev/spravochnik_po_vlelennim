<script>const BASE="";const DOCNAME="Упыри";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0231-S01", "PS-0231--proishozhdenie"], "h": "<p>Упыри появляются в рассказе Славы от первого лица (2025-03-19, id 305854–305855) — монологе жителя технологически развитого мира. Мир этот, по словам рассказчика, ушёл далеко вперёд за счёт того, что «сконцентрировались на проблемах земли, а не о других планетах»: «Ведь какая к чёрту разница на другие планеты. Если собственная умирает». Там установили связь с другими мирами, но связь неполная — «мы могли получать обрывки информации, от разных миров», непостоянная и нестабильная, принцип её до конца не поняли. Из обрывков узнали: первым миром считают «Кильку»; существа других миров способны покидать свой мир, и жители этого мира тоже могут. Покидать не хотели: «большинство миров. О которых мы узнали информацию. Словно ад наяву».</p>\n<p>Дальше по рассказу приходили сведения о разрушении других миров — «у них разбивалось солнце. И начиналось эпидемия неизвестно болезнью». Так произошло в трёх мирах, которые удалось зафиксировать. Была составлена теория, что «все нападения на миры. Были устроены из Рая. Второго мира, который появился после Кильке» — рассказчик отдельно оговаривает, что это «опять же не точно. Лишь теория. Без стопроцентных фактов». Готовились строительством бункеров; рассказчик задним числом называет это «лишь трата ресурсов».</p>\n<p>Примерно через три года солнце начало трескаться «словно стекло» и разбилось на миллиарды светящихся кусочков, накрывших 78% суши и 12% воды. В рассказе приведены расчёты: осколки преодолели 149 597 870 700 метров за 3 минуты и 36 секунд, то есть двигались с постоянной скоростью 694 444,44 км/с, и сбить их системы мира не смогли. На орбите объекты замедлились — «не знаю насколько», предположение рассказчика: раз в 10 или больше, «раз 17% людей все ещё остались живы». Выжившие связывают спасение с возможным вмешательством правителя: «Возможно наш правитель подсобил. Какая уже разница».</p>\n<p>Раскол солнца был «лишь первой волной». После него началось заражение и появление перагов. И уже после катастрофы «среди выживших начали появляется упыри. Это где-то 30-40 процентов выживших стали упырями».</p>\n<p>Происхождение самих упырей в переписке не установлено. Рассказчик даёт две версии и ни одну не выбирает: «От чего вообще взялись упыри. Это заража из рая. Или это попытка правителя спасти людей. Не знаю».</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · С чего начать — не материал авторов</b>\n<p>В базе. Мир, в котором всё это происходит, разъехался с самими упырями по разным карточкам, хотя это одно сообщение. <code>MR-0123</code> «Раскол солнца» — ссылок ноль, статья есть, база 18 152, окна те же (2025-03-19, id 305854–305855, и 2025-03-20, id 306119–306135); там технологический мир, обрывочная связь с другими мирами, три погибших мира, бункеры, расчёты по осколкам и уточнение про сушу и воду «Как у нас». <code>PR-0061</code> «Я житель одного технологического развитого мира» — одна ссылка, статья есть, база 34 415, тот же текст целиком. В самой <code>PS-0231</code> ссылки ни на одну из двух нет, при том что пробел «название мира рассказчика не приводится» стоит именно здесь.</p></div>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0231-S02", "PS-0231--vneshnost"], "h": "<p>Отдельного описания внешности упырей в переписке нет. Есть только самооценка рассказчика-упыря, противопоставляющая его ангелу: «Я уродливый и страшный. Отражения этого тёмного и страшного мира. Защищаю и стараюсь спасти людей. А ангел. Белый и чистый. Лишь убивает». Чем именно упырь отличается внешне от человека — не сказано.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0231-S03", "PS-0231--harakter"], "h": "<p>Определяющая черта — голод. «У них невероятный голод. Подобно... Не знаю с кем подобно. Это просто был голод, который не как не удовлетворить, что бы они не ели». Голод утихает только от человечины: «Но если они съедят человечину. Этот бесконечный голод утихнет. И они смогут стать счастливы». Сам рассказчик называет это первым минусом и обозначает словом «каннибализм».</p>\n<p>Второй минус — потеря себя: «В том что мы теряли своей собственной \"я\". Деградируя». Процесс описан как необратимый в перспективе, но неровный: «Нет кому-то удавалось вернуть своей \" Я\". А кому-то даже продержатся 3 года. Но по итогу всегда всё заканчивалась тем, что они теряли снова или первый раз. Без разницы. Они всë равно теряли своей \"я\"».</p>\n<p>Рассказчик отдельно оговаривает, что один только голод был бы переносим — потому что есть кого есть: «Будь-то он один. То можно было жить. Ведь пераги это люди. Их можно есть. Жувать. Глотать».</p>\n<p>Сам он своё «я» не потерял, и причина названа прямо: «Потому-что у меня была цель. Я должен был защитить тех 38 людей. Они нуждались во мне. Поэтому я не мог дать слабины. И я не давал. Я приносил им еду, одежду и лекарства». Эту цель он позже называет «нить. Держащий меня».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0231-S04", "PS-0231--sposobnosti"], "h": "<p>Упырь — «это не люди, которых тяжело убить». Живучесть перечислена списком:</p>\n<div class=\"q\"><p>«Ты можешь скинуть его с небоскреба. Но он выживет. Ты можешь подорвать его или жечь. Он выживет. Ты можешь продырявить ему черепушки, что аж мозги будут видно. Но он выживет. Ты можешь выпотрошить или утопить его. Но он выживет. И так я могу перечислять до бесконечности».</p></div>\n<p>Живучесть — единственная способность. Прямо оговорено, чего у упыря нет: «Но при этом он. Упырь не владеет, какой-то сверхчеловеческой силой или скоростью. Он просто живучий и всё».</p>\n<p>Живучесть даёт побочную возможность, которой нет у людей: упырь может носить экзоскелет. Шесть учёных собрали его «из всех имеющих ресурсов», экзоскелет «вышел грубым», и чтобы его надеть, «нужно было отрезать несколько конечности. Вырвать органы и продырявить череп. Обычный человек его никогда в жизни не сможет одеть». Рассказчик вызвался сам и отказался от обезболивающего: «Но зачем? Я же всё равно не умру от боли. Оставьте лучше для людей». Процедура описана как четырнадцать дней боли: «Я словно был пол пытками четырнадцать дней». Результат — «И стал сильнее, быстрее. Теперь я стал живым оружием».</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Отклик — не материал авторов</b>\n<p>Самое сильное здесь — экзоскелет. Не сам аппарат, а цена входа: отрезать несколько конечностей, вырвать органы, продырявить череп, четырнадцать дней боли, — и отказ от обезболивающего с формулировкой «Я же всё равно не умру от боли. Оставьте лучше для людей». Живучесть, которую до этого перечисляли как список того, чем упыря не убить, вдруг оказывается не защитой, а расходным материалом: единственное, что у него есть, — способность выдержать то, чего человек не выдержит, и он это тратит. Тут вся конструкция вида срабатывает разом, без объяснений. Рядом ещё одна вещь, которая держит: голод сам по себе назван переносимым — «Будь-то он один. То можно было жить. Ведь пераги это люди. Их можно есть» — то есть каннибализм в этом мире не ужас, а решённый вопрос, ужас в другом. И финал, где нить обрывается не смертью героя, а смертью тех, ради кого он держался, — «Я потерял свою нить. Держащий меня. Теперь и еë нету» — ставит точку ровно там, где надо, и дальше про него уже ничего не сказано. Про упырей вообще-то известно немного, но то, что известно, стоит крепко.</p></div>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0231-S05", "PS-0231--svyazi-s-drugimi"], "h": "<p>Пераги — заражённые люди, обросшие белыми перьями, «словно они состоят из чистого серебра», похожие на ангелов из мифов, «но лишь похожими». Названы «падший ангелы», их цель — «убить всё разумной на планете Земля». Коэффициент — «23 заражённых на одного человека. Где-то так». Для упырей пераги — еда, потому что это люди.</p>\n<p>Ангел — существо, пришедшее в ответ на сопротивление рассказчика: «Но на сопротивление всегда будут отвечать. И рай ответил нам в ответ». Описан как гуманоид, состоящий только из белых перьев, вытянутый, два метра ростом, с двумя парами рук, двумя парами крыльев, одним вертикальным закрытым глазом и нимбом.</p>\n<p>Правитель — фигура, к которой возводится и возможное спасение 17% выживших, и одна из двух версий происхождения упырей, и чёрная дымка в финале.</p>\n<p>Рай — второй мир после Кильки, источник теории о нападениях на миры и одна из двух версий происхождения упырей («заража из рая»).</p>\n<p>Килька — первый мир.</p>\n<p>По базе упыри также связаны с записями «Голод упыря», «Живучесть упыря», «Потеря \"я\"» и «Упырь-рассказчик».</p>", "r": []}, {"t": "Как менялся", "a": ["S06", "PS-0231-S06", "PS-0231--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2025-03-19 (id 305854–305855), вселенная «Апостол», окно w0083.</strong> Упыри введены как вид внутри большого монолога: доля среди выживших (30–40%), живучесть без сверхсилы и сверхскорости, два минуса (голод и потеря «я»), неопределённое происхождение. Здесь же — история конкретного упыря-рассказчика, экзоскелет и встреча с ангелом.</p>\n<p>Текст версии 1 обрывается переходом к другой сцене: разговор защитника и человека по прозвищу «имитатор» о том, во сколько должен появиться чудемирец («Где-то в 21:00-21:30. Точно определить сложно»), и воспоминание защитника — Александра — о том, как он вытаскивал из речки тела жены и дочери. Связь этой сцены с упырями в переписке не проговорена.</p>\n<p><strong>Версия 2 — 2025-03-20 (id 306134–306147), помечена как «вне вселенной», окно w0083.</strong> Это реакция Миколая при чтении, а не изменение задумки. Первая реплика — «круто быть упырём». Затем сравнение: «подобно Гулям из токийского гуля». Вопрос «ты тоже упырь?» и ответ Славы «А я разве терял» — разбор того, что «мы» в монологе принадлежит рассказчику-упырю. Отдельно отмечен экзоскелет: «что они могут позволить себя насиловать чтобы надеть экзоскелет — ну эт прикольно», и мир: «У них же более развитый мир» — «прикольный».</p>\n<p>Между версиями сама конструкция вида не менялась: во второй версии её только читают и комментируют.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0231-S07", "PS-0231--chto-s-nim-stalo"], "h": "<p>Судьба вида после катастрофы в переписке не прослеживается. Прослежена судьба рассказчика.</p>\n<p>За шесть лет из 38 человек, которых он защищал, умерли 19: «Половина. Я слабак. Я должен был их защитить». В экзоскелете он «побеждал», «уничтожал перагов». Вернувшись с вылазки с едой, он застал дома «лишь кровь и боль» и ангела. На этом его удерживающая нить кончилась: «Я потерял свою нить. Держащий меня. Теперь и еë нету. Я перестану быть собой. Я лишь упырь».</p>\n<p>Он бросился на ангела, но его потянуло назад — за спиной была чёрная дымка. Мысль, мелькнувшая при этом: «Это правитель пытается меня спасти. Отправив в другой мир». Он отказался уходить — «Но нет я не сбегу. Я убью или буду убить. Я не уйду» — и держался, не улетая в дымку. Ангел его заметил, влетел в него, и в дымку они влетели вместе. Куда — в переписке не сказано.</p>\n<p>Потерял ли рассказчик своё «я» после этого, не сказано.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0231-S08", "PS-0231--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Механизм превращения выжившего в упыря не описан: почему упырями стали именно 30–40%, а не остальные, — не сказано.</li>\n<li>Происхождение оставлено развилкой из двух версий («заража из рая» или «попытка правителя спасти людей») и не разрешено.</li>\n<li>Внешние отличия упыря от человека не описаны.</li>\n<li>Не сказано, что именно происходит с упырём после полной потери «я»: остаётся ли он подвижен, опасен ли для людей, отличим ли от перага.</li>\n<li>Не сказано, можно ли убить упыря вообще — перечислено только то, что его не убивает.</li>\n<li>Название «упыри» объяснено через каннибализм («я же не просто так назвал их упырями»), но кто и когда дал это название, не сказано.</li>\n<li>Название мира рассказчика не приводится; при этом планета в тексте называется Землёй.</li>\n<li>Куда ведёт чёрная дымка и что стало с рассказчиком и ангелом после того, как они влетели в неё, осталось нерешённым.</li>\n<li>Связь монолога упыря со сценой защитника, имитатора и Александра, идущей следом в том же сообщении, в переписке не проговорена.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0231--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0021.html\">Упыри</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0231--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-03-19</td>\n<td>305854–305855</td>\n<td>w0083</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-20</td>\n<td>306134–306147</td>\n<td>w0083</td>\n<td>вне вселенной (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0231-upyri.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0231--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0231.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0231-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0231/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>По числам это один из самых обеспеченных узлов «Апостола»: всё, на что упыри опираются, статьи уже имеет — <code>SP-0207</code> «Живучесть упыря» (две ссылки, база 15 808), <code>SP-0208</code> «Голод упыря» (одна, 15 749), <code>SP-0209</code> «Потеря \"я\"» (две, 15 890), <code>SP-0210</code> «Экзоскелет» (две, 16 871), <code>PS-0232</code> «Упырь-рассказчик» (две, 35 190), <code>PS-0199</code> «Пераг» (одна, 44 124), <code>MR-0095</code> «Рай» (одна, 54 131), <code>MR-0207</code> «Килька» (одна, 68 896), <code>MR-0124</code> «Чёрная дымка» (одна, 28 831). Пустых ссылок вокруг нет ни одной.</p>\n<p>Кроме одной. <code>VS-0013</code> «вне вселенной»: статьи нет, база 15 911, и на неё завязано пятнадцать статей справочника, включая эту, <code>PS-0233</code>, <code>PS-0199</code>, <code>MR-0095</code>, <code>MR-0123</code>, <code>MR-0124</code>, <code>MR-0207</code>, <code>SP-0060</code>, <code>SP-0210</code>. Здесь под этой пометкой лежит вся вторая версия — то есть весь разговор Миколая с текстом. Чинить надо её первой хотя бы потому, что это единственная дыра в узле и стоит она под пятнадцатью статьями сразу.</p>\n<h3>С чего начать</h3>\n<p>В базе. Мир, в котором всё это происходит, разъехался с самими упырями по разным карточкам, хотя это одно сообщение. <code>MR-0123</code> «Раскол солнца» — ссылок ноль, статья есть, база 18 152, окна те же (2025-03-19, id 305854–305855, и 2025-03-20, id 306119–306135); там технологический мир, обрывочная связь с другими мирами, три погибших мира, бункеры, расчёты по осколкам и уточнение про сушу и воду «Как у нас». <code>PR-0061</code> «Я житель одного технологического развитого мира» — одна ссылка, статья есть, база 34 415, тот же текст целиком. В самой <code>PS-0231</code> ссылки ни на одну из двух нет, при том что пробел «название мира рассказчика не приводится» стоит именно здесь.</p>\n<p>Второй адрес по тому же поводу: <code>MR-0123</code> держит кусок 2025-03-20, id 306119–306135, а <code>PS-0231</code> — 306134–306147. Куски перекрываются на двух сообщениях и разведены по разным карточкам; если название мира где-то и прозвучало, то в этом стыке.</p>\n<p>В архив идти незачем: оба окна разобраны, и то, чего нет, отсутствует в самом тексте, а не потеряно при разборе. Единственное, что имеет смысл посмотреть, — что стало со сценой защитника и имитатора, которой обрывается монолог: она уходит в <code>PS-0271</code> (база 59 077) и <code>SP-0060</code>, и связь её с упырями надо не искать, а решать.</p>\n<h3>Как развивалось</h3>\n<p>19 марта — вид введён целиком и сразу внутри чужого монолога: доля выживших, живучесть без сверхсилы, два минуса, развилка происхождения из двух версий, ни одна не выбрана. 20 марта — не разработка, а чтение: Миколай сравнивает с гулями, спрашивает «ты тоже упырь?», отмечает экзоскелет и мир. После 20 марта к виду не возвращались: правок нет, версий больше нет. Заявили полностью в один заход; ограничения не добавляли отдельно, потому что они встроены в определение с первой минуты; проговорили вслух на следующий день и оставили как есть.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для голода правило названо и оно точное: не утоляется ничем, кроме человечины, и пераги годятся, потому что пераги — люди. Механизм есть, условие есть, исключение есть. Для второго минуса, потери «я», такого правила нет: сказано, что кто-то держался три года, кто-то возвращал себя, но по итогу теряли всегда — это статистика, а не механизм. Что именно расходуется и от чего зависит срок, не проговорено. У рассказчика названа причина держаться — 38 человек, «нить», — но причина не то же, что правило: почему у одного нить работает шесть лет, а у другого не работает вовсе, по вашей же логике для голода сформулировано, а для потери себя нет.</p>\n<h3>Отклик</h3>\n<p>Самое сильное здесь — экзоскелет. Не сам аппарат, а цена входа: отрезать несколько конечностей, вырвать органы, продырявить череп, четырнадцать дней боли, — и отказ от обезболивающего с формулировкой «Я же всё равно не умру от боли. Оставьте лучше для людей». Живучесть, которую до этого перечисляли как список того, чем упыря не убить, вдруг оказывается не защитой, а расходным материалом: единственное, что у него есть, — способность выдержать то, чего человек не выдержит, и он это тратит. Тут вся конструкция вида срабатывает разом, без объяснений. Рядом ещё одна вещь, которая держит: голод сам по себе назван переносимым — «Будь-то он один. То можно было жить. Ведь пераги это люди. Их можно есть» — то есть каннибализм в этом мире не ужас, а решённый вопрос, ужас в другом. И финал, где нить обрывается не смертью героя, а смертью тех, ради кого он держался, — «Я потерял свою нить. Держащий меня. Теперь и еë нету» — ставит точку ровно там, где надо, и дальше про него уже ничего не сказано. Про упырей вообще-то известно немного, но то, что известно, стоит крепко.</p></div>", "r": []}];</script>
