<script>const BASE="";const DOCNAME="Страх";
const LEAD="";
const CH=[{"t": "Об этом тексте", "a": ["S01", "PR-0104-S01", "PR-0104--ob-etom-tekste"], "h": "<ul>\n<li>Дата: 2025-12-09</li>\n<li>Сообщения: 394532–394532</li>\n<li>Состояние: переписывалось — это второй, переписанный черновик того же фрагмента; брошено на середине, текст обрывается на полуслове («Взгляд остановился на г»)</li>\n<li>Действующие лица: Бенжимен Бэнуар (рассказчик), его отец — граф, мачеха (новая супруга графа) и их дети, безымянный командир со шрамами, новобранцы</li>\n</ul>", "r": []}, {"t": "Текст", "a": ["S02", "PR-0104-S02", "PR-0104--tekst"], "h": "<p>Страх</p>\n<p>Да именно страх поглотил моей сознания. Руки дрожали, хоть я пытался это скрыть. Меня отправляли на войну. Меня, сына дворянина. <br>Не куда-то в тыл или в штаб. И даже не на спокойную точку, а на передовую. В одну из самых опасных мест, на передовой. На осаду крепости, где пролилось уже литр крови. <br>Я Бенжимен Бэнуар первенец и ближайшее на замену отцу дворянина. Сейчас еду в трясущиеся карете и едва заметна дрожу держа меч в руках, как оберег. <br>Моей взгляд был устремлён на мешок попыхах забитыми моими вещами , что покачиваясь туда сюда. <br>Бэнжимен потерял счет времени. Для него время было бесконечным и при этом мигом. Весь его мир был в этой карете. Внутрь проникали звуки пение птиц, и звуки насекомых. Но где-то там далеко. <br> В  голове же был лишь один вопрос<br> &quot; Почему??? &quot; Хотя он прекрасно знал ответ. Его отец граф не скрывал неприязнь ко мне. Да и новая супруга графа и их дети, тоже могли сыграть роль. <br>Но он пытался об этом не думать. Ведь это все же его семья.<br>На графа ему было наплевать, также как и графу на него. Он просто надеялся, что мачеха не могла этого сделать. <br>Кто угодно только  не она. Его уверенность с каждой минутой тускнело. Слышав множеств истории, как новый жены избавляется от детей бывших жен. Эта мысль была ужасна. <br>Он бы мог сбежать. Выбить дверь, спрыгнуть с кареты и побежать в сторону леса исчезнув. Но он не мог. Всю жизнь воспитанный, как благородный дворянин, он даже дрожь пытался скрыть. <br>Время же было неумолимо. И вот он стоял в ширинку с другими молодыми парнями. Многие из них дрожали, а некоторые плакали. Этот фронт славился высокой смертностью. <br>Лишь Бенжимен не дрожал. Стоял ровно, а лицо было словно фарфоровая маска, холодное и невозмутимое. Но это лишь внешний. Внутри же он дрожал, кричал и хотел сбежать. <br>&quot;Может все же сбежать&quot; Нет, он отгонял такие мысли. <br>&quot;Уже поздно, я уже здесь и попытка сбежать лишь бы развязала руки всем недругам и солдатам. Отец в теории мог заказать моей убийства даже здесь, как он делал и раньше и единственное, что возможно их сдерживает это свидетели &quot; После этой мысли Бенжимен немного успокоился. Скорее это можно назвать смирением. <br>С палатки вышел грозный мужчина. Его лицо было покрыта шрамами, а глаза были твердыми и холодными. Было видно, что этот мужчина пережил много сражений. И даже сам его вид вызывал тревогу в сердцах новобранцев. <br>Он твердо шагал и рассматривал дрожащих новобранцев. Цокнув про себя он глубоко выдохнул. <br>&quot;Серьезно, нам на помощь зелёный щенков послали, что даже не разу не убивали&quot; Он прекрасно понимал, что сейчас нехватка людей. Но и не мог смириться с тем, что этих новобранцев сюда посылали на убой. Лишь из-за того, что сюда повышают новобранцев, здесь высокая смертность. <br>Все эти мысли бесполезный, сколько он не жаловался. Его никто не слушал. <br>Рассматривая не уверено стоящих юношей, у большинства которых опухли  глаза. Взгляд остановился на г</p>", "r": []}, {"t": "Примечания и поправки", "a": ["PR-0104--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PR-0104.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
