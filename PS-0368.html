<script>const BASE="";const DOCNAME="Безумная девка";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0368-S01", "PS-0368--proishozhdenie"], "h": "<p>Безумная девка названа одной строкой 2026-06-02 (id 487002–487004, окно w0120) при перечислении сторон. Слава сначала описал героическую сторону: «На стороне ассоциации 6 столпов. Тобишь шесть сильнейших Героев. В ней входит граф и нуар, ну ещё челики который я потом расскажу». Затем — зеркальную структуру у злодеев: «Также и у злодеев есть шесть столпов ( так сказать разрушение) я ещё конечно их не придумал. Ну там как минимум будет безумная девка. И старик со способностью гравитации, который бы досканкльно придумали».</p>\n<p>То есть персонаж возник как заявка на минимальный будущий состав столпов злодеев — «как минимум будет». Дальше в переписке не развит.</p>", "r": []}, {"t": "Связи с другими", "a": ["S02", "PS-0368-S02", "PS-0368--svyazi-s-drugimi"], "h": "<p>Входит в Шесть столпов злодеев — шесть сильнейших злодеев, названных в переписке также «так сказать разрушение». На момент упоминания состав столпов злодеев автором ещё не придуман, названы только двое: сама Безумная девка и старик со способностью гравитации.</p>\n<p>Параллельная структура на другой стороне — шесть столпов ассоциации (сильнейшие Герои), куда входят Граф и Нуар. Отдельно упомянуты апостолы, которые держат нейтралитет — «Конечно не все».</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S03", "PS-0368-S03", "PS-0368--kak-menyalsya"], "h": "<p><strong>2026-06-02 (id 487002–487004, окно w0120).</strong> Единственное состояние: упоминание имени как части будущего состава столпов злодеев. Разработки нет, других версий нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S04", "PS-0368-S04", "PS-0368--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Разработки персонажа нет вообще: только имя в перечислении.</li>\n<li>Способность не названа (в отличие от старика со способностью гравитации, упомянутого в той же строке).</li>\n<li>Внешность, характер, происхождение, связи с конкретными персонажами не названы.</li>\n<li>Остальные четыре места в составе столпов злодеев на этот момент не заполнены — автор прямо говорит: «я ещё конечно их не придумал».</li>\n<li>Вселенная в записи помечена как неясная (проставлена по дате объявления).</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["PS-0368--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-06-02</td>\n<td>487002–487004</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0368-bezumnaya-devka.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0368--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0368.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
