<script>const BASE="";const DOCNAME="Мировое древо";
const LEAD="";
const CH=[{"t": "Где находится — в каком мире и в каком его месте", "a": ["S01", "MN-0021-S01", "MN-0021--gde-nahoditsya"], "h": "<p>Вселенная не определена (в базе помечена как «неясно»). Древо названо в перечне того, «кто есть пока что не в сформировавшиеся мире» (2025-10-02, id 370605) — то есть мир, к которому оно относится, на момент разговора сам ещё не был собран. Место древа внутри этого мира не названо.</p>\n<p>Тот же перечень «несформировавшегося мира» включает: «Апостолы с сверхспособностями (насекомые)», «Каменный Поротой», «Азуриэль», «Допустим вампиры который могут контролировать кровь» и «дети мирового древа». Связи древа с первыми четырьмя пунктами в переписке не проговорены — они просто соседи по списку.</p>", "r": []}, {"t": "Что собой представляет", "a": ["S02", "MN-0021-S02", "MN-0021--chto-soboy-predstavlyaet"], "h": "<p>Порождающее начало. Разговор открывается фразой «Существо порождённым мировым древом» (id 370600), и дальше древо раскрывается только через своих детей — самостоятельного описания у него нет: ни размера, ни вида, ни того, одно оно или их много.</p>\n<p>Единственное собственное свойство древа, названное прямо, — его древесина, из которой сделаны дети: «Так как они из дерева мирового древа. Хрен ты их пробьешь».</p>", "r": []}, {"t": "Что с ним связано — предметы, механики, силы", "a": ["S03", "MN-0021-S03", "MN-0021--chto-s-nim-svyazano"], "h": "<p>Дети мирового древа — производное от древа и единственное, через что оно описано (id 370605):</p>\n<ul>\n<li>«гуманноидный деревянный существо с оранжевой сердцевинной»;</li>\n<li>«Они могут изменить образ на человеческий»;</li>\n<li>неуязвимость, прямо выведенная из материала древа: «Так как они из дерева мирового древа. Хрен ты их пробьешь, не кто из апостоловы не сможет нормально их ранить, а если ранят они будут регенерировать»;</li>\n<li>«Ну и они сверхсильный (сильнейший наверное в физическом плане)»;</li>\n<li>«Они могут передвигаться в земле и внутри деревьях»;</li>\n<li>«Огонь их не перед. Сам огонь на них тухнет»;</li>\n<li>«Ну они могут выпускать корни туда сюда ими драться».</li>\n</ul>\n<p>Здесь же зафиксирована обратная связка: неуязвимость детей объясняется именно свойством древесины древа, то есть свойства древа известны только по тому, что они дают детям.</p>", "r": []}, {"t": "Персонажи и события — кто с ним связан и что там происходило", "a": ["S04", "MN-0021-S04", "MN-0021--personazhi-i-sobytiya"], "h": "<p>Событий, происходивших у древа, в переписке нет. Названы только апостолы — как те, кто не может ранить детей древа: «не кто из апостоловы не сможет нормально их ранить».</p>", "r": []}, {"t": "Как менялся по версиям — по датам", "a": ["S05", "MN-0021-S05", "MN-0021--kak-menyalsya-po-versiyam"], "h": "<p>Одна версия. 2025-10-02, окно w0106, id 370600–370613. В том же разговоре Слава предложил дорабатывать: «Если есть идея по их улучшения кидай» (id 370606) и отдельно отметил незакрытую линию: «И по пожиратели богов я не забыл» (id 370607). Ответ Миколая через 2,1 часа — «идеи крутые и ура есть мир» (id 370613); конкретных дополнений он не внёс, предложение об «улучшениях» осталось без ответа.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "MN-0021-S06", "MN-0021--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Самостоятельного описания у древа нет — только через детей.</li>\n<li>Не сказано, к какому миру древо относится: мир на момент разговора назван несформировавшимся.</li>\n<li>Не сказано, как древо порождает детей и порождает ли что-то ещё.</li>\n<li>Не сказано, одно древо или их несколько, и есть ли у него местоположение.</li>\n<li>Связь древа с остальными пунктами перечня (апостолы-насекомые, Каменный Поротой, Азуриэль, вампиры) не названа.</li>\n<li>Предложение дорабатывать детей древа осталось нерешённым.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["MN-0021--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-10-02</td>\n<td>370600–370613</td>\n<td>w0106</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/monumenty/MN-0021-mirovoe-drevo.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MN-0021--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MN-0021.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
