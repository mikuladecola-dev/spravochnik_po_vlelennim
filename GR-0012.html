<script>const BASE="";const DOCNAME="Теневые братья";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0012-S01", "GR-0012--chto-eto"], "h": "<p>Теневые братья — пункт из числа благословенных вселенной «Апостол». Название стоит во множественном числе, и в переписке они всегда упоминаются одной строкой наравне с одиночными персонажами каталога (Имитатор, Палач, Вибрация и т. д.). Сколько их, кто они и группа ли это в строгом смысле — в переписке не сказано. Разведка отнесла запись к группам по форме названия; подтверждения этому в переписке нет, но и опровержения тоже: авторы ни разу не говорят о Теневых братьях в единственном числе и ни разу не называют их одним персонажем.</p>\n<p>Впервые названы Славой 2025-01-22 (id 283706–283710) в перечне родни воплощения гнева. Формулировка авторская: «Братья и сестры это то бишь благословенный одним правителем». То есть «братья и сёстры» — не кровное родство, а общий источник благословения. В том же сообщении (2025-01-22 08:40, id 283707) Слава перечисляет, кто ещё входит в эту родню:</p>\n<div class=\"q\"><p>«Среди его братьев и сестёр есть владельцы способности изменения агрегатного сотояния, / Та кто может изменять плотность массу и размер объектов и себя / Тот у кого есть способность сжатия / Имитация / Бессмертный выродок / Теневые братья»</p></div>\n<p>Здесь у всех прочих перечисленных названа способность или узнаваемое прозвище, а Теневые братья идут просто именем, без пояснения, что они умеют.</p>\n<p>Дальше, на всём протяжении сохранившейся переписки (с 2025-01-24 по 2025-03-06), Теневые братья присутствуют в рабочем реестре Славы, но кроме названия, эмодзи-метки и места в списке о них не сообщается ничего. Собственной разработки — вида, способности, характера — у них в переписке нет.</p>\n<p>Отдельно стоит зафиксировать реплику Славы о степени проработки всего реестра (2025-01-24 16:21, id 284366). На вопрос Миколая «а ты рил всех персов продумал? ну которых написал» Слава отвечает: «Ну только вид и способность и плюс минус характер». Это сказано про список целиком; применительно к Теневым братьям ни вид, ни способность, ни характер в переписку не попали.</p>", "r": []}, {"t": "Иерархия", "a": ["S02", "GR-0012-S02", "GR-0012--ierarhiya"], "h": "<p>Теневые братья входят в число «братьев и сестёр» — благословенных одним правителем (2025-01-22, id 283706).</p>\n<p>С 2025-01-24 (id 284278) они стоят в каталоге не отдельной строкой, а в скобке при другом пункте. Что значит скобка, Слава объяснил позже, 2025-01-28 (id 285537), когда Миколай указал, что «не разделены благословенные и апостолы» (id 285533): «Но там среди благословенных только апостолы а в скобках благословенный». По этому объяснению всё, что стоит в скобках — включая Теневых братьев, — это благословенные, а не апостолы. Само разделение списка на два раздела Слава пообещал сделать («Сделаю сделаю», id 285534), но в последующих редакциях реестра (2025-02-25, id 295559; 2025-03-06, id 298850) список по-прежнему называется одним словом «Благословенный:» и разделения в нём нет.</p>\n<p>Выше благословенных в переписке поставлены Семь грехов. Слава, 2025-01-24 11:11 (id 284276): «Но не забывай 7 грехов сильней благословенный и чтобы убить одного греха в максимум надо 3 благословенных именно Бога / А для остальных благословенных надо будет 5». Отдельно про Теневых братьев это не говорилось — правило сформулировано для благословенных вообще. Позже, 2025-03-06 (id 298854), Слава решил грехи из списка убрать: «Грехи нужно убрать, а то тупо», Миколай добавил: «ну просто в сюжет не совсем входят».</p>\n<p>Внутренней иерархии самих Теневых братьев — кто из них старший, есть ли у них главный — в переписке нет.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S03", "GR-0012-S03", "GR-0012--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>С воплощением гнева.</strong> Теневые братья названы в числе его братьев и сестёр. Сам он описан так (2025-01-22 08:36, id 283706): «Принципиальному, прямолинейному и жестокому / Он воплощения гнева / Прототип защитника только молчиливова / Бэтмен с жестокостью и гневом / Тот кто да мозга костей ненавидит междумирцов / Тот кто оторвёт крылья ангелам, переломает кости своим братьям и сёстрам». Последняя формулировка распространяется на всю родню, то есть и на Теневых братьев тоже; персонально с ними его столкновение нигде не описано.</p>\n<p><strong>С Дитя света ✨.</strong> С 2025-01-24 11:12 по 2025-01-24 12:25 (id 284278, 284300) Теневые братья стоят в каталоге в скобке при Дитя света: «Дитя света ✨(Теневые братья 🌘)». Чем эта связь является — подчинением, свитой, родством, общей линией — в переписке не сказано.</p>\n<p><strong>С Агрегатом 🫥.</strong> С 2025-01-27 (id 284858) и до последней сохранившейся редакции (2025-03-06, id 298850) Теневые братья стоят в скобке при Агрегате: «Агрегат🫥 ( теневые братья 🌑; экстримал ⏳; страдалец 🔪 )». Вместе с ними в этой скобке — Экстримал ⏳ и Страдалец 🔪. Характер связи и здесь не назван; перевод из одной скобки в другую в переписке не обсуждался и не объяснялся.</p>\n<p><strong>С благословенными дьявола.</strong> Прямой связи с Теневыми братьями нет, но их принадлежность к благословенным затрагивает нерешённый вопрос всей системы. Слава, 2025-01-22 08:49 (id 283708): «Вообще благословенный Богом есть общая чёрта виде белых глаз при активаций благословения / И я эти глазами наделил всех тех который должны быть благословений дьяволом, при этом и менять я ничего не хочу потому что мне и так нравится / Поэтому я думаю вообще убрать благословенных дьяволом». Дальше — про численность: «Тогда благословенных будет 21» (id 283709), «Ну конечно можно оставить и 42» (id 283710), «Ну я не знаю» (id 283711), «Как думаешь сколько должно быть благословенных Богом 21 или 42» (id 283712). Ответа Миколая в этом фрагменте нет, вопрос остался нерешённым.</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S04", "GR-0012-S04", "GR-0012--kak-menyalas"], "h": "<p><strong>2025-01-22 (id 283706–283710).</strong> Первое упоминание. Теневые братья названы последним пунктом в перечне братьев и сестёр воплощения гнева — благословенных одним правителем. Никаких пояснений при названии нет.</p>\n<p><strong>2025-01-24, 10:31 (id 284248).</strong> Первая редакция каталога. Теневые братья стоят <strong>первой строкой</strong> раздела «Благословенный:», отдельным пунктом, наравне с остальными: «Теневый братья 🌘». Написание в этой редакции — «Теневый братья». Метка — убывающая луна 🌘. В этой редакции у Дитя света ✨ скобки нет вообще, у Агрегата 🫥 в скобке стоят «волк🐺; экстримал ⏳».</p>\n<p>Реакция Миколая на эту редакцию (id 284251–284254): «если че я на уроке», «красиво кстати», «и пиздец интесно подумать», «но скоро училка придет, задание делаю». Вопрос Славы к этой же редакции — «Угадай кто из врагов чужамириц» (id 284249) — Теневых братьев не касается и ответа в окне не получил.</p>\n<p><strong>2025-01-24, 11:12 (id 284278).</strong> Вторая редакция каталога. Теневые братья убраны с отдельной строки и перенесены в скобку к Дитя света: «Дитя света ✨(Теневые братья 🌘)». Написание исправлено на «Теневые братья», метка прежняя 🌘. В этой же редакции у Агрегата в скобку добавлен страдалец 🔪, у Хулигана — слайм 7️⃣, во врагов добавлен Эльф 🌬, появился отдельный блок «Семь грехов». Перевод Теневых братьев из отдельной строки в скобку в переписке не комментируется — Слава выкладывает список целиком и добавляет только «Ну да» (id 284279).</p>\n<p><strong>2025-01-24, 12:25 (id 284300).</strong> Третья редакция того же дня. Позиция Теневых братьев не меняется: «Дитя света ✨(Теневые братья 🌘)». Изменения этой редакции их не затрагивают (добавлены блоки «Оружие» и «Артефакты», в идеях «корень желаний» заменён на «камень желаний»). Миколай, id 284301–284302: «ебаиь ты работяга», «так много всего придумал».</p>\n<p><strong>2025-01-27, 11:10 (id 284858).</strong> Теневые братья переведены из скобки Дитя света в скобку Агрегата: «Агрегат🫥 ( теневые братья 🌑; экстримал ⏳; страдалец 🔪 )». Они заняли место, где раньше стоял волк 🐺, а сам волк 🐺 в этой редакции переехал в скобку к Дитя света: «Дитя света ✨(военный 🐺)». Одновременно поменялись написание — со строчной буквы, «теневые братья», — и эмодзи-метка: вместо убывающей луны 🌘 стоит новолуние 🌑. Ни перевод, ни смена метки в переписке не обсуждались.</p>\n<p><strong>2025-01-28, 20:17 (id 285522).</strong> Позиция сохраняется без изменений: «Агрегат🫥 ( теневые братья 🌑; экстримал ⏳; страдалец 🔪 )». Изменения этой редакции Теневых братьев не касаются (добавлен Масочник 🎭, в сторонние силы — Провидец и Серафим, артефакт «Цепи окавы», «Ожерелья» переименованы в «Ожерелья света», цепь связи перенесена из артефактов в оружие). Слава предложил Миколаю угадать изменения («Угадай что изменилась 😂», id 285524), часть правок так и не назвал вслух («И ещё один / И ещё одно», id 285541, 285546) — какие именно, из переписки не восстанавливается.</p>\n<p><strong>2025-02-25, 17:44 (id 295559).</strong> Реестр выложен целиком, разделы пронумерованы. Теневые братья на прежнем месте — в скобке при Агрегате 🫥, который идёт вторым номером списка. Раздел благословенных вырос до 14 пунктов (добавлены Сон ✨, Небесная 🚀, Маэстро 🎼), у Палача появилась скобка «( тварь)». Теневых братьев эти изменения не затрагивают.</p>\n<p><strong>2025-03-06, 15:58 (id 298850).</strong> Последняя сохранившаяся редакция. Теневые братья по-прежнему в скобке при Агрегате, в том же написании и с той же меткой 🌑. Разработки за ними так и не появилось.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "GR-0012-S05", "GR-0012--probely"], "h": "<div class=\"gaps\"><ul>\n<li><strong>Поимённого состава нет.</strong> Ни одно имя участника в переписке не названо, ни один участник не описан. Список members в разметке пуст.</li>\n<li><strong>Численность не названа.</strong> Из названия следует множественное число, но сколько именно братьев — двое, трое, больше — в переписке не сказано.</li>\n<li><strong>Способность не названа.</strong> В первом же перечне (2025-01-22, id 283707) у соседних пунктов способности указаны (изменение агрегатного состояния, изменение плотности/массы/размера, сжатие, имитация), у Теневых братьев — нет. Ни в одной из последующих редакций каталога способность к ним не приписана. Слово «теневые» в переписке никак не расшифровывается — связь с тенью как силой нигде не оговорена.</li>\n<li><strong>Вид и характер не названы.</strong> Общая оговорка Славы «Ну только вид и способность и плюс минус характер» (2025-01-24, id 284366) относится к списку целиком; к Теневым братьям ни один из этих трёх пунктов в переписке не привязан.</li>\n<li><strong>Смысл скобки для них не раскрыт.</strong> Пояснение «в скобках благословенный» (2025-01-28, id 285537) объясняет только разряд, но не отношения: почему Теневые братья сначала при Дитя света, потом при Агрегате и что это за подчинение — не сказано. Сам перевод из одной скобки в другую (2025-01-27) остался без комментария.</li>\n<li><strong>Обещанное разделение благословенных и апостолов не сделано.</strong> Миколай указал на него 2025-01-28 (id 285533), Слава ответил «Сделаю сделаю» (id 285534); в редакциях от 2025-02-25 и 2025-03-06 раздел по-прежнему единый.</li>\n<li><strong>Численность благословенных — 21 или 42 — осталась нерешённой</strong> (2025-01-22, id 283709–283712). Ответа Миколая в окне нет.</li>\n<li><strong>Оружия и артефактов за Теневыми братьями не закреплено.</strong> В реестре есть отдельные разделы «Оружие» и «Артефакты», но привязок к конкретным персонажам в них нет; расшифровок оружия и артефактов в окне тоже нет.</li>\n</ul></div>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0012--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0012.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0012-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0012/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Здесь особый случай: дыра не в самих Теневых братьях, а в их соседях по скобке — и эти соседи в справочнике отсутствуют полностью. «Дитя света», «Экстримал», «Страдалец» не заведены ни как записи, ни как статьи: их нет в наборе вообще, ни с каким размером базы. При этом вся статья на две трети состоит из описания того, при ком именно Теневые братья стоят в скобке. Восстанавливать смысл скобки не из чего, пока хотя бы «Дитя света» не заведён — на него скобка висела первые три дня, и это единственная связь, которую можно проверить.</p>\n<p>Второй по цене — сам реестр: <code>SL-0051</code> — шесть ссылок, статьи нет, база 9 834; <code>SL-0053</code> — шесть ссылок, статьи нет, 20 313. Все семь дат в разделе «Как менялась» — это семь редакций этих двух записей, и статьи о них нет ни одной.</p>\n<p>Про саму запись: <code>PS-0183</code> — три ссылки, статья есть, база 5 993. Материала под ней немного, и, судя по содержанию статьи, весь он — те же копии реестра. Единственный работающий сосед — <code>PS-0182</code> «Агрегат»: пять ссылок, база 13 777; это самая ссылаемая фигура в наборе, и Теневые братья к ней прицеплены.</p>\n<h3>С чего начать</h3>\n<p>В базе искать нечего — это надо признать сразу и не тратить проход. Пять тысяч знаков под <code>PS-0183</code> дадут те же строки реестра, которые в статье уже процитированы.</p>\n<p>Идти в архив, и точечно, в два узких промежутка. Первый: 2025-01-24, между 10:31 (id 284248, где Теневые братья стоят первой строкой отдельным пунктом) и 11:12 (id 284278, где они уже в скобке при Дитя света) — сорок минут, за которые кто-то принял решение. Второй: 2025-01-27 около 11:10 (id 284858) — перевод в скобку к Агрегату, одновременная смена написания на строчное и метки с 🌘 на 🌑. Если объяснение вообще произносилось, оно в одном из этих двух мест; в самих выкладках его нет.</p>\n<p>Есть ещё одна зацепка, которую стоит проверить в архиве: 2025-01-28 (id 285524, 285541, 285546) Слава предлагает угадать, что изменилось, и две правки вслух так и не называет. Если одна из них про Теневых братьев, она в этом окне.</p>\n<h3>Как развивалось</h3>\n<p>2025-01-22 — назвали, последним пунктом в чужом перечне, без пояснения. 2025-01-24, 10:31 — поставили первой строкой раздела, отдельно и наравне со всеми. 2025-01-24, 11:12 — через сорок минут убрали в скобку к Дитя света. 2025-01-27 — переставили в скобку к Агрегату, поменяв заодно регистр и эмодзи. 2025-01-28, 2025-02-25, 2025-03-06 — три следующие редакции проезжают мимо них без единого изменения. За всё это время движение было только позиционное: место в списке менялось четыре раза, содержание не появилось ни разу. Возвращения не было.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Про слово «братья» в этом мире правило сказано прямо и рано: «Братья и сестры это то бишь благословенный одним правителем», то есть родство не кровное, а по источнику силы. Рядом, в том же перечне и в том же сообщении, стоит имя того же корня — «Теневые братья», — и для него правило не повторено и не отменено. Братья они в том же смысле, что и вся остальная родня, то есть просто благословенные одним правителем, или это отдельные лица, связанные между собой чем-то ещё, — не сказано. Слово, для которого определение дал сам автор, стоит во втором названии без определения.</p>\n<h3>Отклик</h3>\n<p>Честно: зацепиться тут почти не за что, и это не упрёк, а описание. Единственное живое место — 🌘, сменившаяся на 🌑. Убывающая луна на новолуние, при переезде из одной скобки в другую, без единого слова комментария. Скорее всего это просто промах пальца в списке эмодзи, но выглядит как решение: было ещё немного видно — стало не видно совсем. Для пункта, о котором за полтора месяца не сказано ни слова, кроме названия, это довольно точная автобиография. И ещё: из всего реестра именно Теневые братья единственный раз в жизни стояли первой строкой — сорок минут, утром двадцать четвёртого января.</p></div>", "r": []}];</script>
