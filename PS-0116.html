<script>const BASE="";const DOCNAME="Параман";
const LEAD="<p>Персонаж вселенной «7 островов». Вариант имени — Парамана (в косвенной форме, как названо в переписке). Три версии, 2024-07-05 — 2024-07-09, окна w0044 и w0046. Часть Асгарда.</p>";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0116-S01", "PS-0116--proishozhdenie"], "h": "<p>Имя названо Славой в самом конце ночного разговора 2024-07-05 (id 198034–198045, w0044), в ответ на прямой вопрос Миколая «в кого верят люди». До этого шёл спор о Кае: Миколай сказал «ну он же бог», Слава возразил — «Так он человек», «Где ты взял что он бог». Миколай попробовал совместить: «он типо есть но как бы и нет». Тогда и был задан вопрос о вере, ответ — «Ну Парамана».</p>\n<p>Сразу после ответа разговор обрывается — Миколай уходит на другую тему («короче», «слушай»), и в ту ночь к Параману не возвращаются.</p>", "r": []}, {"t": "Кто он", "a": ["S02", "PS-0116-S02", "PS-0116--kto-on"], "h": "<p>Бог, в которого верят люди Асгарда.</p>\n<p>На вопрос Миколая «что бог из себя представляет на деле» Слава отвечает (2024-07-09, id 201754): «Просто бог которого придумали чтобы оправдать свои действия». То есть выдуманный внутри мира бог, нужный для оправдания собственных действий верующих.</p>", "r": []}, {"t": "Внешность", "a": ["S03", "PS-0116-S03", "PS-0116--vneshnost"], "h": "<p>Не описана. Никакого облика, тела или проявления Параману в переписке не приписано.</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0116-S04", "PS-0116--sposobnosti"], "h": "<p>Прямо не названы. Единственное, что о нём как о действующем лице сказано, — вера в возможность разговора с ним: «В бога и верят что отце может разговаривать с богом» (2024-07-09, id 201821). Разговаривает ли он на самом деле, есть ли он вообще как сущность — не решено; описание «просто бог которого придумали» этому прямо не отвечает.</p>", "r": []}, {"t": "Религия вокруг него", "a": ["S05", "PS-0116-S05", "PS-0116--religiya-vokrug-nego"], "h": "<p>Догма, сформулированная Славой одним куском (2024-07-09, id 201803):</p>\n<div class=\"q\"><p>«Религия<br>Нам нужно истребить всех тех в кого вселился демон всех тех кого не понимает нашего бога мы должны очистить мир для спасения его»</p></div>\n<p>То есть: истребление одержимых демоном и не понимающих бога, очищение мира ради его спасения.</p>\n<p>Миколай на это отвечает «я как психолог себя чувствую», и сам же помечает описание как «поверхностное».</p>", "r": []}, {"t": "Власть при нём", "a": ["S06", "PS-0116-S06", "PS-0116--vlast-pri-nem"], "h": "<p>Устройство власти обсуждается тут же (2024-07-09, id 201805–201821):</p>\n<ul>\n<li>Миколай: «власть у церкви, правитель папа Римский». Ещё раньше в тот же вечер (id 201755) он спрашивал «а этот хуй папа римский типа», и Слава подтвердил — «Да». В навигации это зафиксировано как посредник между богом и людьми — «папа римский».</li>\n<li>Слава на вопрос о том, кто именно правит, называет «Персы» и «И их 3 главных правителей».</li>\n<li>Верят «В бога и верят что отце может разговаривать с богом».</li>\n<li>Отдельный вопрос Славы, оставшийся без ответа: «Откуда ресурсы ведь они не с кем не сотрудничает».</li>\n</ul>", "r": []}, {"t": "Связи с другими", "a": ["S07", "PS-0116-S07", "PS-0116--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Асгард</strong> — мир, чьи люди в него верят; Параман числится частью Асгарда.</li>\n<li><strong>Религия Асгарда</strong> — догма истребления одержимых и очищения мира.</li>\n<li><strong>Кай</strong> — в разговоре 2024-07-05 Миколай принял его за бога, Слава это отверг: «Так он человек». Именно из этого спора вырос вопрос о том, в кого же верят люди, и ответ «Парамана».</li>\n<li><strong>Избранный (защитник Асгарда)</strong> — Миколай предположил, что «папа это этот хуй, защитник»; Слава ответил «Нет» и уточнил: «Защитник избранный 14 летний мальчик». То есть защитник и папа римский — разные фигуры.</li>\n<li><strong>«Папа римский»</strong> — посредник между Параманом и людьми, глава церковной власти. Собственного имени в переписке не получил.</li>\n</ul>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S08", "PS-0116-S08", "PS-0116--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2024-07-05 (id 198034–198045, w0044).</strong> Названо только имя: «Ну Парамана» — бог, в которого верят люди. Никакой разработки; разговор обрывается, потому что Миколай засыпает.</p>\n<p><strong>Версия 2 — 2024-07-09 (id 201744–201760, w0046).</strong> Возвращение к теме через четыре дня, с напоминания Славы: «Параман», «Это бог в которого они верят». На вопрос, что он представляет собой на деле, — «Просто бог которого придумали чтобы оправдать свои действия». Тогда же вводится посредник: «а этот хуй папа римский типа» — «Да».</p>\n<p><strong>Версия 3 — 2024-07-09 (id 201803–201826, w0046).</strong> Через несколько минут после версии 2, в том же окне. Вокруг Парамана выстраивается религиозная догма (истребление одержимых демоном и не понимающих бога, очищение мира ради спасения), устройство власти (церковь, папа римский, «Персы» и их 3 главных правителя) и вера в то, что «отце может разговаривать с богом».</p>", "r": []}, {"t": "Отклонённые варианты", "a": ["S09", "PS-0116-S09", "PS-0116--otklonennye-varianty"], "h": "<ul>\n<li><strong>Кай как бог</strong> (2024-07-05). Миколай: «ну он же бог», «он типо есть но как бы и нет». Слава отверг: «Так он человек», «Где ты взял что он бог».</li>\n<li><strong>Папа римский = защитник</strong> (2024-07-09, id 201812–201818). Миколай: «ну папа это этот хуй», «защитник». Слава: «Нет», защитник — «избранный 14 летний мальчик».</li>\n</ul>", "r": []}, {"t": "Что с ним стало", "a": ["S10", "PS-0116-S10", "PS-0116--chto-s-nim-stalo"], "h": "<p>Дальше 2024-07-09 материала нет. Разработка обрывается на устройстве власти и вопросе о ресурсах.</p>", "r": []}, {"t": "Пробелы", "a": ["S11", "PS-0116-S11", "PS-0116--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Внешность, история, происхождение бога внутри мира — не названы.</li>\n<li>Есть ли Параман в мире на самом деле или он только выдумка верующих — прямо не решено; формулировка «просто бог которого придумали чтобы оправдать свои действия» оставлена без развития.</li>\n<li>Кто такой «папа римский» при нём — имени и биографии нет.</li>\n<li>«Персы» и «их 3 главных правителей» названы, но не объяснены и с Параманом напрямую не связаны.</li>\n<li>Вопрос Славы «Откуда ресурсы ведь они не с кем не сотрудничает» остался без ответа.</li>\n<li>(w0044) Только имя, никакой разработки; неясно, тот ли это персонаж, что раньше в разговоре звался богом, дающим пищу за молитвы.</li>\n<li>Реплика Славы сразу после называния имени — «А те болты сказал» (id 198042) — осталась без объяснения; Миколай переспросил «болты?» и тут же сменил тему.</li>\n<li>Само описание религии Миколай назвал поверхностным; углубления в переписке не последовало.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0116--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в мирах:</strong> <a href=\"MR-0031.html\">Религия Асгарда</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0027.html\">Церковь Асгарда</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0116--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-05</td>\n<td>198034–198045</td>\n<td>w0044</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-09</td>\n<td>201744–201760</td>\n<td>w0046</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-09</td>\n<td>201803–201826</td>\n<td>w0046</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0116-paraman.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0116--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0116.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
