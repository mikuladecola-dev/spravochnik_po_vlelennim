<script>const BASE="";const DOCNAME="Чутьё на чужемирцев";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0182-S01", "SP-0182--mehanika"], "h": "<p>Чутьё на чужемирцев — способность защитника инстинктивно чувствовать, где находятся чужемирцы. Описана одним куском текста от Славы (2025-02-12, id 288545, окно w0075), рассказанным от лица чужемирца, которого защитник убивает.</p>\n<p>Формулировка появления дословно: «После всего этого он начал как то инстинктивно понимать, где находиться чужимирцы словно благословенный. Но он им не был».</p>\n<p>То есть чутьё даёт местоположение чужемирцев и работает само, без усилия и обучения — «инстинктивно». Сравнение идёт с благословенными, но принадлежность к ним отрицается прямо в той же фразе.</p>\n<p>«После всего этого» отсылает к предшествующей цепочке событий, которая в тексте расписана подробно.</p>\n<p>Первый эпизод: пьяный мужчина видит «тощий силуэт покрытой шерстью», мгновенно трезвеет — «его мысль стали четками и ясными, как никогда», крадётся, силуэт бросается на него, он бьёт его бутылкой по морде, а пока зверь хватается за нос, «начал тыкать розочкой этого обратная во всё места». Труп он тащит к себе домой, «словно пытаясь так принести какой-то ритуал», и отключается. Наутро он в порыве гнева собирается сжечь дом, но видит труп: «увидев труп обратная, настоящего обратная. Он всё понял. Всё сразу стала на свои места».</p>\n<p>Дальше — два года подготовки: записался во все возможные спортклубы, вылил спиртное в раковину, «а в унитазе смыл все колёса», снова начал работать. Тренировки давались тяжело — «он сам давно не мальчик», — но «он не остановился он не щадил свой организм, свой тело, возможно внутренний виня и свой тело тоже». За это время убрался в доме, закопал труп в подвале, поставил фотографии «своих дорогих девушек», заработал крупную сумму, купил огнестрельное и холодное оружие, привёл себя в форму.</p>\n<p>Затем охота. Сначала просто ночные прогулки — «дурак, в этих прогулках он чаще избивал недо бандитов и мелких хулиганов и насильников», причём «ему от частей была по-барабану на всех их», избивал он их от раздражения, что не может найти настоящую цель. Потом стал отслеживать полицейские вызовы и приезжать первым: «Ой сколько денег он на это потратил». Через неделю-другую услышал слово «монстр» и приехал на место.</p>\n<p>Ключевой эпизод — шестирукое чудовище, душившее мужчину. Защитник армейским ножом порезал ему лапу, лишив равновесия, «а после начал он потрошить его конечность, это паучок ничего не мог сделать, против быстрого ломающего его защитника». Не убил: оторвал все конечности, погрузил в машину и уже дома пытался получить информацию. «Тот паучок знать-то ничего не знал, но защитник ломал его психологический и физический». Именно после этого возникает чутьё.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0182-S02", "SP-0182--ogranicheniya-i-cena"], "h": "<p>Ограничений и цены в переписке не названо. Не сказано ни про дальность, ни про точность, ни про то, отличает ли чутьё одного чужемирца от другого, ни про то, можно ли его отключить или укрыться от него.</p>\n<p>Что чутьё даёт результат, показано только косвенно: «И так однажды он наткнулся на нашу группу и порешал есть сам конечно получив тяжёлый ранения». То есть группу он нашёл, победил в одиночку и получил тяжёлые ранения.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0182-S03", "SP-0182--nositeli"], "h": "<p>Единственный названный носитель — защитник. Способность числится частью защитника.</p>\n<p>Благословенные упомянуты как те, у кого нечто подобное есть по умолчанию: чутьё сравнивается с их даром — «словно благословенный». При этом сам защитник благословенным не был, и что именно умеют благословенные, в этом куске не расписано.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0182-S04", "SP-0182--kak-menyalas-po-versiyam"], "h": "<p>Версия одна, изменений нет.</p>\n<p><strong>2025-02-12 (id 288545, окно w0075)</strong> — первое и единственное появление: чутьё возникает само после допроса пленного чужемирца, сравнивается с даром благословенных.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0182-S05", "SP-0182--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Единственная названная связь — сравнение с даром благословенных, с прямым отрицанием принадлежности: «словно благословенный. Но он им не был».</p>\n<p>В том же тексте рассказчик-чужемирец перечисляет, о чём защитнику ещё предстоит узнать: «он должен жить узнать о чужемирцов, о благословенных, о артефактах». Артефакты названы, но с чутьём никак не связаны.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "SP-0182-S06", "SP-0182--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Не объяснено, откуда взялось чутьё и связано ли оно с благословением. Отмечено отдельно как неясность окна w0075.</li>\n<li>Не сказано, что именно его вызвало: сам допрос, контакт с шестируким чужемирцем, накопленная охота или что-то ещё. Текст даёт только «после всего этого».</li>\n<li>Не описано, как чутьё ощущается изнутри — есть только «инстинктивно понимать, где находиться».</li>\n<li>Не сказано, что стало с чутьём после боя с группой. Рассказчик отмечает, что защитник переломал ему все конечности «и не только», и объясняет, почему не добивает лежащего без сознания защитника: «он должен страдать и быть снова счастливым». Он говорит и о растущей вине защитника — «А чувством вины за убийство не виновных чужемирцов. Хотя сейчас она маленькая, но она растет», — но с чутьём эту вину не связывает.</li>\n<li>Подарок, который рассказчик оставляет защитнику, не раскрыт: «я уже подготовил для него подарок, нет не пакость, а настоящее подарок, он находится внутри меня и когда защитник будет рвать меня он получит этот подарок». Что это за подарок и связан ли он со способностями — в переписке не сказано. Кусок обрывается на «Эх ладно пок.... В лесу пронеся хруст ломающий черепушки».</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["SP-0182--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-02-12</td>\n<td>288545–288545</td>\n<td>w0075</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0182-chute-na-chuzhemircev.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0182--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0182.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["SP-0182-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/SP-0182/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — обратни. Вся завязка этой способности держится на существе, которое защитник убивает бутылкой и розочкой: «труп обратная, настоящего обратная» — именно с него начинаются два года подготовки, охота и в итоге само чутьё. Записи об этом существе по «Апостолу» нет ни статьи, ни строки в базе. Единственные «Обратные» в справочнике — <code>MR-0176</code>: статьи нет, ссылок ноль, 13.3 КБ базы, вселенная «неясно», и это другое — окно w0109, ноябрь 2025, вселенная, выросшая из сна Славы. Совпадение слов, а не сущности; связь нигде не проговорена. На обратня из «Апостола» опираются три записи — эта, <code>IS-0035</code> и <code>PR-0049</code>, и все три упираются в пустоту.</p>\n<p>Вторая — <code>SL-0089</code> «Список категорий сил (Благословенный, Арбетары, Альфы, Чужемирцы, Владельцы артефактов, Фантазёры)»: четыре ссылки, статьи нет, в базе всего 1.7 КБ. Способность описана через отрицание — «словно благословенный. Но он им не был», — и проверить это отрицание не по чему: рамки категорий в справочнике не существует.</p>\n<h3>С чего начать</h3>\n<p>В базе, архив тут почти не нужен. Вся статья выросла из одного сообщения — id 288545, 2025-02-12, окно w0075, — и это же сообщение разобрано ещё на четыре записи, по которым разъехалось недостающее:</p>\n<ul>\n<li><code>IS-0035</code> «Подарок внутри монстра» (8.9 КБ) — тот самый подарок, который в статье стоит нераскрытым пробелом; запись названа по нему целиком;</li>\n<li><code>PS-0197</code> «Рассказчик-монстр» (26.6 КБ) — кто говорит и почему не добивает;</li>\n<li><code>PS-0196</code> «Семья Защитника (жена и дочь)» (37.6 КБ) — «дорогие девушки» с фотографий и та вина, которая «по размеру с гневом»;</li>\n<li><code>IS-0058</code> и <code>IS-0017</code> «Защитник» (139 КБ базы, сквозная запись по пяти вселенным) — куда этот кусок встаёт в биографии.</li>\n</ul>\n<p>Плюс <code>PR-0049</code> «История защитника (переписанная)» — тот же герой, другой заход.</p>\n<p>В архив — за одним словом. Нужно найти, где «обратень» появляется впервые и что он значит: искать вокруг 2025-02-12 и раньше, до окна w0075. Ноябрьское окно w0109 (<code>MR-0176</code>) при этом не трогать — до выяснения это разные вещи.</p>\n<h3>Как развивалось</h3>\n<p>Дата одна, поэтому смотреть надо внутрь самого текста. Чутьё не объявлено заранее и не вынесено отдельно: оно приходит в конце длинной цепочки одной придаточной фразой — «После всего этого он начал как то инстинктивно понимать» — и в следующем же предложении сразу работает: «И так однажды он наткнулся на нашу группу». После 2025-02-12 к нему не возвращались ни разу, при том что самого защитника переписывали дальше — 2025-03-14 и 2025-03-19. Заявили в придаточном — применили в следующей строке — не вернулись.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для благословенных источник дара расписан вплоть до раздвоения: <code>SP-0163</code> «Благословение», <code>SP-0164</code> «Базовые умения благословенных бога», <code>SP-0165</code> «Базовые умения благословенных дьявола» — то есть правило «откуда способность и что она даёт по умолчанию» для этого случая названо дважды. Есть и общий перечень сил мира (<code>MR-0146</code>, <code>SL-0089</code>). А для случая соседнего рода — дар возник у человека сам, без благословения, «словно благословенный. Но он им не был» — правила нет: ни откуда он берётся, ни к какой из категорий такой носитель относится. Формулировка стоит ровно на границе и границу не переходит.</p>\n<h3>Отклик</h3>\n<p>Это самый живой текст из четвёртки, и держит он не способностью. Держит порядком действий: бутылка, розочка, труп, который тащат домой «словно пытаясь так принести какой-то ритуал», утренний порыв сжечь дом — и отменяющий всё взгляд на тело. Дальше два года, расписанные бытом: спортклубы, алкоголь в раковину, колёса в унитаз, уборка, труп в подвал, фотографии на место, деньги, оружие. Ни одной героической ноты, всё через быт. И чутьё, ради которого статья написана, появляется не как награда, а как побочный след допроса — в придаточном предложении, между делом. Отдельно сильно, что рассказывает всё это жертва, лёжа без конечностей рядом с тем, о ком рассказывает, и не из ненависти: «он должен страдать и быть снова счастливым». Русский там разваливается почти в каждой строке, а сцена собирается всё равно.</p></div>", "r": []}];</script>
