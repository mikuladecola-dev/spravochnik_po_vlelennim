<script>const BASE="";const DOCNAME="Чужемирцы";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0019-S01", "GR-0019--chto-eto"], "h": "<p>Чужемирцы — существа других миров, оказавшиеся в мире действия. Это не организация и не отряд: у группы нет ни устава, ни общей цели, ни поимённого состава. Это категория существ, раса-сообщество, под которую в переписке подводятся все выходцы из других миров, независимо от анатомии и происхождения.</p>\n<p>Первое определение дано 2025-01-06 (id 279029–279038): чужемирцы — существа из других миров, попавшие к нам. В том же разговоре введены и аномальные люди: «Чаще всего это дети простого человека и чужемирца». И те и другие могут входить в организации благословенных наравне с простыми людьми и благословенными от минимиров.</p>\n<p>Развёрнутое определение появилось 2025-03-18 (id 305116): «И вот передем к самому важному чужемирцы. Это существо покинувший свой мир. По каким либо причинам. Чаще всего из-за того, что их ней миры суший ад. Или желанием захвата других миров. Ну грубо говоря почти всё чужемирцы жестокие психи. Для которых убийства это обыденная дело. У них там ещё разделения по видам способностей».</p>\n<p>Тогда же зафиксирована асимметрия переходов: жители первого мира выйти из него не могут, а чужемирцы попадают внутрь свободно — «мы субъекты первого мира. Не модем его пикинуть. Ну вот никак. Ну вот чужемирцы попадають нам за раз плюнуть» (2025-03-18, id 305117). 2025-03-20 (id 306110–306114) Миколай уточнил, могут ли они перемещаться между мирами вообще, не обязательно в Кильку; ответ Славы — «Да».</p>\n<p>К 2025-05-10 (id 324539–324541) чужемирцы стоят строкой в рабочем перечне категорий сил: Благословенный, Арбетары, Альфы, Чужемирцы, Владельцы артефактов, Фантазёры.</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0019-S02", "GR-0019--sostav"], "h": "<ul>\n<li><a href=\"PS-0198.html\">Чужемирцы</a> — Чужемирцы; общая запись самой категории, она же основной источник по группе.</li>\n<li><a href=\"PS-0197.html\">Рассказчик-монстр</a> — Рассказчик-монстр. Чужемирец, от лица которого ведётся история от 2025-02-12. Лежит в лесу с переломанными конечностями рядом с бессознательным защитником, читает его воспоминания и в финале погибает. Имени и вида у него нет.</li>\n<li><a href=\"PS-0202.html\">Чужемирец (герой истории про сломанное солнце)</a> — Чужемирец, главный герой истории про сломанное солнце (2025-02-25, id 295222–295245).</li>\n<li><a href=\"PS-0212.html\">Эльф с ветряным мечом</a> — Эльф с ветряным мечом. Противник в прозе от 2025-03-03 (id 297458–297463).</li>\n<li><a href=\"PS-0218.html\">Эльф (чужемирец)</a> — Эльф (чужемирец). Та же фигура из истории про Бессмертного, разведённая в базе на вторую запись после уточнения 2025-03-10 (id 300761–300766).</li>\n<li><a href=\"PS-0227.html\">Лучница</a> — Лучница. Первый противник Максима, 2025-03-18 (id 305113–305115).</li>\n<li><a href=\"PS-0228.html\">Копейщики</a> — Копейщики. Двое противников Максима в лесном бою, 2025-03-18 (id 305115–305116).</li>\n</ul>\n<p>Кроме поимённо разобранных, в переписке названы существа без имён: мелкие серые карлики, высокие безволосые мускулистые твари с маленькими глазами и когтями, шестирукое чудовище, оборотень, покрытый шерстью (2025-02-12, id 288543–288545). Ещё двое — упырь и ангел — вылетают из чёрной дымки 2025-03-19 (id 305855–305858); имитатор, ожидавший появления «чужемирца», в последний момент засекает, что их будет двое.</p>", "r": [["Чужемирцы", "PS-0198.html"], ["Рассказчик-монстр", "PS-0197.html"], ["Чужемирец (герой истории про сломанное солнце)", "PS-0202.html"], ["Эльф с ветряным мечом", "PS-0212.html"], ["Эльф (чужемирец)", "PS-0218.html"], ["Лучница", "PS-0227.html"], ["Копейщики", "PS-0228.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0019-S03", "GR-0019--obschie-sposobnosti-gruppy"], "h": "<p>Основное правило введено 2025-03-18 (id 305314–305318). Миколай спросил, откуда лучница берёт стрелы, если на ней «юбка и всё». Ответ Славы: «В этом суть этих чудемирцов. Они могут создавать оружия из себя», и сразу же ограничение — «Но трансформировать тело не могут». Тут же Слава отметил, что в самом тексте истории этот момент не прописан: «Но здесь я виноват. Забыл добавить момент».</p>\n<p>Из того же боя видно, как правило работает: у лучницы стрелы «не только чёрная но и наконечник с деревяшкой словно единой», у копейщика после потери копья появляется «не пойми откуда взявшимся у него ещё одним копьем».</p>\n<p>Общее и для лучницы, и для копейщиков — чёрный цвет тела и чёрная кровь (2025-03-18, id 305325: на вопрос о крови ответ «Чёрная»).</p>\n<p>Внутри категории есть «разделения по видам способностей» (2025-03-18, id 305116). Сама эта классификация не расписана: Слава оборвал тему словами «Ну это скука об этом говорить».</p>", "r": []}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0019-S04", "GR-0019--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p>Общей анатомии у чужемирцев нет. В делении от 2025-03-10 (id 300891) первая из трёх строк — «обычных просто чужемирца с разной анатомии».</p>\n<p>В истории от 2025-02-12 (id 288543–288545) показаны сразу несколько несхожих типов:</p>\n<ul>\n<li>мелкие серые карлики — влетают в окна, быстрые; «ничего из себя не представляющей по отдельности», берут числом; один погибает от выстрела из пистолета, второй — от удара головой об пол;</li>\n<li>высокие, мускулистые, без одежды и волос, глаза маленькие, есть когти — ловкие и сильные, удерживают взрослого человека «как тиски»;</li>\n<li>шестирукое чудовище, душившее человека в городе; в тексте названо «паучок»;</li>\n<li>«тощий силуэт покрытой шерстью», оборотень, убит бутылкой и осколком.</li>\n</ul>\n<p>Родство между этими типами не установлено самим рассказчиком: «Если честно сам не могу сказать кем им приходится карлики. Может они родственники, а может просто подчинённый и слуга».</p>\n<p>Отдельно отмечено питание: рассказчик-монстр говорит о съеденной семье как о пире — «не каждый из моего мира хотя бы раз в жизни так вкусно и сытно питался».</p>\n<p>Лучница и копейщики (2025-03-18) различаются между собой по боевым свойствам. Лучница — девушка не старше 20, полностью чёрная, одета «как дикари в джунглях», радужки белые; стреляет чёрными стрелами, умеет пустить две стрелы разом в разные точки, в ближнем бою переходит на два ножа; очень лёгкая — от удара улетает в стену. Копейщики — тёмные мужчины, «хоть не такие ловкий, как лучница. Но более крепкие»: удар, отправивший лучницу в полёт, копейщика не сбивает с ног. Ещё одно отличие зафиксировано в бою: стрела лучницы прошла копейщика насквозь, «даже не ранев его», а Максима, стоявшего за ним, ранила.</p>\n<p>Эльф (<a href=\"PS-0212.html\">Эльф с ветряным мечом</a> / <a href=\"PS-0218.html\">Эльф (чужемирец)</a>) — двухметровый, худой, длинные оранжевые волосы, острые уши, вместо глаз железная маска, одеяние «по типу полуплатия и полудоспехов», меч «словно из средневековья». Бьёт ветряными разрезами и держит ветряную защиту, которая отклоняет пули и кровавые руки Бессмертного; апостол эту защиту пробивает. Мотив у него единственный: «Эльф попав в наш мир почувствовал апостола и решил его убить» (2025-03-10, id 300765).</p>\n<p>Упырь и ангел (2025-03-19, id 305855–305858) — существа из третьего источника. Упырь: не обладает сверхчеловеческой силой или скоростью, «Он просто живучий и всё», при этом каннибал с неутолимым голодом и теряет собственное «я», деградируя; носит грубый экзоскелет, для надевания которого пришлось отрезать несколько конечностей, вырвать органы и продырявить череп. Ангел: гуманоид из белых перьев, два метра ростом, две пары рук, две пары крыльев, один вертикальный закрытый глаз и нимб; стреляет перьями, бьёт струёй огня при открытом глазе, крыло в момент удара «твёрже железа и острей ножа».</p>", "r": [["Эльф с ветряным мечом", "PS-0212.html"], ["Эльф (чужемирец)", "PS-0218.html"]]}, {"t": "Иерархия", "a": ["S05", "GR-0019-S05", "GR-0019--ierarhiya"], "h": "<p>Внутреннее деление введено 2025-03-10 (id 300889–300892). Чужемирцы делятся на три вида:</p>\n<ul>\n<li>обычные — «просто чужемирца с разной анатомии»;</li>\n<li>Существа;</li>\n<li>Альфы.</li>\n</ul>\n<p>Про Альф там же: «Альфы раньше означали сильнейшей разумной субъекты в своём мире, которая имеет, что-то похоже на благословенния».</p>\n<p>2025-05-31 (id 331636) значение Альфы уточнено: «Арбетары и Альфа это одни те же существа. Но в первом случае это люди из кильке, а во втором это чужемирцы». То есть Альфа — это чужемирец, который «насильственно вырвал кусок силы своего мира», поселил его в себе и заставил выделять силу. Такие существа применяют силу без ограничений и без перегрузки мозга, поскольку сила находится внутри них, а не приходит по связи. Базовые умения: усиленная регенерация (чаще всего превосходит благословенных), усиление тела и чувств, аура, сенсорика. Плюс уникальная способность, которая формируется отдельно у каждого — «Даже если они сцапали один и тот же кусок силы. У них она всё равно будет разная». Понятия отключения способности у них нет: «если они подожгут лес он будет гореть пока весь не выгореть. Либо его не потушат». В отличие от благословенных, они обязаны учиться вырабатывать энергию и контролировать её.</p>\n<p>Косвенная шкала силы задана 2025-03-13 (id 301806) через перечень материалов ритуала становления Арбетаром. Благословенного убить было легко, дальше: «Сложнее было убить чужемирцов. Ну это так цветочки. Самым сложным, как я уже говорил был альфа». Причина сложности с альфой названа прямо: «у альфа и арбетатов похожий силый. Они как и мы может использовать свою силу 24/7 без риска повредить мозг».</p>\n<p>Иерархии внутри конкретных стай в переписке нет. Единственное касание темы — реплика рассказчика-монстра о карликах и высоких тварях: «Может они родственники, а может просто подчинённый и слуга», и она оставлена без разрешения. Он же упоминает, что чужемирцы держатся группами: «однажды он наткнулся на нашу группу и порешал есть сам».</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S06", "GR-0019-S06", "GR-0019--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>АЗИП и агенты.</strong> Чужемирцы — основной объект работы агентов. 2025-05-28 (id 330909) агент определён так: «Агент- это люди или чужемирцы, которых завербовали в организацию АЗИП. И их главная цель уничтожения опасных существ. Буть то люди или чужемирцы». То есть чужемирец может стоять по обе стороны.</p>\n<p>2025-05-29 (id 331072) в тексте контракта прописана процедура. Агент обязан «встречать чужемирцов, который по какой-либо причины покинули свой мир. И либо зарегистрировать его, либо устранить если он проявит агрессию на вас». Отдельным абзацем оговорено, что уничтожение не является умолчанием: «И не забывайте. Не всё чужемирцы опасны и хотят кому-то навредить». При встрече у пространственной аномалии положено произнести заготовленную фразу: «Здравствуйте я представитель организаций АЗИП и мы не хотим вам навредить. Я знаю, что вы не понимаете, что происходит. Но попрошу последовать за мной, что бы вас зарегистрировали». Если чужемирец проявит агрессию — сначала пытаться успокоить, грубая сила разрешена только при угрозе жизни. Кандидат в агенты — «будь то человек или чужемирец» — проходит одну и ту же шестимесячную подготовку. Также агент обязан писать отчёт, какое существо и при каких обстоятельствах он уничтожил, «во избежание устранения невинных существ».</p>\n<p><strong>Благословенные.</strong> 2025-01-06 (id 279029) чужемирцы и аномальные люди названы среди тех, кто может входить в организации благословенных.</p>\n<p><strong>Апостолы.</strong> Столкновения показаны в прозе. Имитатор убивает обоих копейщиков и лучницу в лесу (2025-03-18, id 305116): у одного копейщика вокруг головы образуется белая цепь и голова слетает, второй взрывается изнутри. Неназванный апостол со шрамами-слезами убивает эльфа (2025-03-03, id 297463). Имитатор в бою у чёрной дымки (2025-03-19) намеренно не добивает ангела: «Имитатор не собирается убивать его. Ему нужны ответы. Почему жители рая устраивают нападения на другий миры?» — но защитник перегрызает ангелу горло раньше.</p>\n<p><strong>Защитник.</strong> Отдельная линия вражды. Семью защитника убивают чужемирцы (2025-02-12, id 288543–288544), после чего он два года готовится и «начал полномасштабную охоту на нас». Он научился «как то инстинктивно понимать, где находиться чужимирцы словно благословенный. Но он им не был». 2025-03-13 (id 301823) он назван «Недавно появившаяся охотник за чужемирцами». Рассказчик-монстр в свой последний момент говорит о будущем защитника: у того растёт «чувством вины за убийство не виновных чужемирцов. Хотя сейчас она маленькая, но она растет».</p>\n<p><strong>Арбетары.</strong> Чужемирцы — расходный материал ритуала становления Арбетаром: в перечень собираемого входят «пару чужемирцов, и ещё один благословенный и самая сложная альфа» (2025-03-13, id 301806).</p>\n<p><strong>Максим.</strong> Человек, убивший лучницу в заброшенном доме и дравшийся с копейщиками в лесу (2025-03-18, id 305113–305116). После лесного боя его вербует имитатор, и он становится агентом.</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S07", "GR-0019-S07", "GR-0019--kak-menyalas"], "h": "<p><strong>2025-01-06 (id 279029–279038).</strong> Введены как категория, одной строкой с аномальными людьми. Аномальные люди — «чаще всего дети простого человека и чужемирца». Обе категории могут входить в организации благословенных. Вопрос Миколая о потомстве чужемирца от животного закрыт отмахом «Выйдет какая та хуйн[я]» — механика не решена.</p>\n<p><strong>2025-02-12 (id 288543–288545).</strong> Развёрнутое появление в прозе, ещё без термина-определения: показаны четыре типа существ, их повадки, слабость карликов поодиночке, питание людьми, существование группами. От лица одного из них ведётся всё повествование.</p>\n<p><strong>2025-02-25 (id 295222–295245).</strong> Чужемирец впервые становится главным героем, а не противником: в истории про сломанное солнце. На вопрос, почему история посвящена ему, Слава ответил: «Ну этот чужимириц будет работать в организации», добавив, что через него показан вирус перьев, который «в нашем мире он тоже будет. Вместе с серафимом».</p>\n<p><strong>2025-03-03 (id 297458–297463).</strong> Эльф с ветряным мечом появляется в прозе как противник; принадлежность к чужемирцам в самом тексте не названа.</p>\n<p><strong>2025-03-10 (id 300761–300766, 300784–300793).</strong> Эльф отнесён к чужемирцам. Здесь же отклонена реконструкция Миколая: он предположил, что деревню Лихую вырезал эльф и что эльф пробудил способности главного героя. Ответ Славы — «Нет», затем: «Деревню лихую заехали немцы и всех поубивали», «Эльф попав в наш мир почувствовал апостола и решил его убить, и всё эльф вообще не причастен к становлению апостолом», «Этот эльф вообще появился только в конце и слова не сказал, что причастен к смертей жителей деревни», «Монстр это Бессмертный».</p>\n<p><strong>2025-03-10 (id 300889–300892).</strong> Введено деление на три вида: обычные чужемирцы с разной анатомией, Существа, Альфы. Первое определение Альф — сильнейшие разумные субъекты своего мира, имеющие нечто похожее на благословение.</p>\n<p><strong>2025-03-13 (id 301806, 301823).</strong> Чужемирцы вписаны в ритуал становления Арбетаром как материал; выставлена шкала сложности убийства. Защитник назван охотником за чужемирцами.</p>\n<p><strong>2025-03-18 (id 305113–305117).</strong> Лучница и копейщики показаны в бою. Тогда же дано полное определение категории: существо, покинувшее свой мир; причины ухода — «их ней миры суший ад» или желание захвата; «почти всё чужемирцы жестокие психи»; упомянуто деление по видам способностей. Описаны три способа перехода между мирами: достичь границы своего мира (чаще в маленьких, недавно образовавшихся мирах), ритуал с любой из сторон, и самый редкий — когда правитель сам отправляет существо в другой мир.</p>\n<p><strong>2025-03-18 (id 305314–305321).</strong> Введена главная физическая черта: создание оружия из себя, с ограничением — тело трансформировать не могут. Слава признал, что в тексте истории этот момент не прописан.</p>\n<p><strong>2025-03-19 (id 305855–305858).</strong> Чёрная дымка как проход: из неё в чужой мир вылетают существа, и именно их называют чужемирцами. Двое вылетевших — упырь и ангел — принадлежат к разным мирам и дерутся не только с апостолами, но и друг с другом.</p>\n<p><strong>2025-03-20 (id 306109–306120).</strong> Уточнено, что перемещаться можно между любыми мирами, не обязательно в Кильку.</p>\n<p><strong>2025-05-10 (id 324539–324541).</strong> Чужемирцы встают строкой в перечне из шести категорий сил.</p>\n<p><strong>2025-05-28 (id 330909).</strong> Чужемирцы могут быть агентами АЗИП наравне с людьми, и целями уничтожения тоже наравне с людьми.</p>\n<p><strong>2025-05-29 (id 331072).</strong> Регламент обращения: регистрация по умолчанию, устранение при агрессии, заготовленная фраза при первой встрече, отчёт по каждому уничтоженному существу.</p>\n<p><strong>2025-05-30 (id 331245).</strong> Миколай задал вопрос к этой процедуре: «а на каком языке это сказано? как чел из абсолютно другого мира поймёт речь одного из 300+ языков». Вопрос остался нерешённым.</p>\n<p><strong>2025-05-31 (id 331636).</strong> Альфа приравнена к Арбетару: одно и то же существо, различие только в происхождении — Арбетар из кильки, Альфа чужемирец. Расписаны базовые умения и режим применения силы.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "GR-0019-S08", "GR-0019--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава у группы нет и быть не может: это категория, а не объединение. Большинство упомянутых существ безымянны — карлики, высокие твари, шестирукое чудовище, оборотень, копейщики, вторая лучница в кустах.</li>\n<li>Устройство миров, из которых они приходят, не описано. Связь видов между собой не установлена: рассказчик-монстр сам не знает, кем ему приходятся карлики — «Может они родственники, а может просто подчинённый и слуга».</li>\n<li>Разделение чужемирцев по видам способностей названо (2025-03-18, id 305116), но не расписано — тема оборвана словами «Ну это скука об этом говорить».</li>\n<li>Средний из трёх видов — Существа — в разобранных записях назван строкой списка (2025-03-10, id 300891) с отсылкой «про них я говорил», но самого описания в этих источниках нет.</li>\n<li>Языковой вопрос остался нерешённым: на каком языке произносится обязательная фраза агента и как существо из другого мира её поймёт (2025-05-30, id 331245).</li>\n<li>Ритуал, которым Альфа вырывает кусок силы своего мира, автором не доработан и помечен вопросами прямо в тексте: «с помощью ритуала??? Которой я ещё не доработал» (2025-05-31, id 331636).</li>\n<li>Ритуал перехода между мирами не раскрыт внутри самого текста по сюжетной причине: «Мне об этом ритуале не рассказали по понятном причинам» (2025-03-18, id 305117).</li>\n<li>Механика потомства чужемирца от животного не решена (2025-01-06, id 279035–279038).</li>\n<li>Внутренней иерархии в конкретных группах чужемирцев не описано; сказано только, что они существуют группами.</li>\n<li>В записи 2025-02-12 название вселенной не звучит; в записи 2025-02-25 неясно, та ли это организация, о которой шла речь раньше.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0019--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0197.html\">Рассказчик-монстр</a>, <a href=\"PS-0198.html\">Чужемирцы</a>, <a href=\"PS-0202.html\">Чужемирец (герой истории про сломанное солнце)</a>, <a href=\"PS-0212.html\">Эльф с ветряным мечом</a>, <a href=\"PS-0218.html\">Эльф (чужемирец)</a>, <a href=\"PS-0227.html\">Лучница</a>, <a href=\"PS-0228.html\">Копейщики</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0019--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0019.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0019-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0019/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — «Существа». Это средний из трёх видов чужемирцев, введённый 2025-03-10 (id 300891) с отсылкой «про них я говорил». Записи с таким именем в базе нет вообще, а два служебных перечня, где это слово стоит заголовком раздела, оба без статьи: <code>SL-0053</code> — 6 ссылок, 20 313 знаков базы, и <code>SL-0090</code> — 4 ссылки, 5 492. Проверка по ним даёт вещь, которую стоит знать до всякого поиска: во всех пяти редакциях реестра, от 2025-01-27 до 2025-05-14, заголовок «Существа:» стоит пустой — под ним не написано ни одной строки. То есть дыра не в справочнике, а в самом источнике, и держится она с января по май.</p>\n<p>Второе — <code>SL-0089</code>, перечень шести категорий сил. Четыре ссылки, статьи нет, в базе 1 753 знака при одной версии. Это несущая рамка: чужемирцы стоят в ней строкой рядом с благословенными, арбетарами, альфами, владельцами артефактов и фантазёрами, и через неё статья соотносится с <code>PS-0281</code>, <code>MR-0146</code>, <code>PS-0270</code>. Рамка сейчас — самая тонкая запись из всех, кого она держит.</p>\n<p>Третьей идёт классификация «по видам способностей» (2025-03-18, id 305116): она названа и тут же оборвана словами «Ну это скука об этом говорить». Это дешевле первых двух — на неё ничто не опирается, кроме одной фразы определения.</p>\n<h3>С чего начать</h3>\n<p>По «Существам» — в архив, но не наугад. Отсылка «про них я говорил» датирована 2025-03-10, значит искать надо раньше: окно между 2025-01-06 (id 279029, первое введение категории) и 2025-03-10 (id 300889). Ориентир по содержанию — разговоры, где чужемирцы описываются анатомией, а не поведением: проза 2025-02-12 (id 288543–288545) с карликами, шестируким и оборотнем стоит ровно в этом промежутке и может оказаться тем самым «говорил».</p>\n<p>По <code>SL-0089</code> — материал в базе, идти никуда не надо: одно окно w0094, 2025-05-10, id 324539–324541, и продолжение темы там же, в разговоре про чёрный шар. Собирать статью нужно из соседей, у которых база большая: <code>MR-0106</code> (28 881), <code>PS-0281</code> (7 646), <code>PS-0226</code> (20 681).</p>\n<p>По классификации способностей — 2025-03-18, id 305314–305321, и дальше по маю: если Слава к ней возвращался, это будет в тех же окнах, где расписаны альфы (2025-05-31, id 331636).</p>\n<h3>Как развивалось</h3>\n<p>2025-01-06 — заявили одной строкой вместе с аномальными людьми, тут же отмахнулись от первого же вопроса о механике («Выйдет какая та хуйня»). 2025-02-12 — показали в прозе, без термина и без определения: четыре несхожих типа существ и рассказчик из их числа. 2025-03-10 — разделили на три вида и назвали альф. 2025-03-13 — вписали в чужой ритуал как материал. 2025-03-18 — дали полное определение и в тот же день ограничили способность: оружие из себя создавать могут, тело трансформировать не могут; тогда же признали, что в тексте истории это не прописано. Дальше два с лишним месяца без чужемирцев. Вернулись в конце мая, но с другой стороны — не описанием существ, а правилами обращения с ними: контракт агента, обязательная фраза, отчёт по каждому уничтоженному. 2025-05-31 — приравняли альфу к арбетару.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Цена силы в этом мире проговаривается всюду, где о ней заходит речь. Для благословенных названа перегрузка мозга. Для альф прямо сказано, что перегрузки нет, потому что сила внутри, и добавлено ограничение с другой стороны — отключить способность нельзя, лес будет гореть, пока не выгорит. То есть у обеих категорий назван и расход, и предел. У обычных чужемирцев назван только запрет на трансформацию тела: лучница берёт стрелы из себя, копейщик получает новое копьё из ниоткуда — и чем это оплачивается, есть ли предел и что происходит, когда он достигнут, не спрошено ни разу. Правило расхода сформулировано для двух категорий из трёх.</p>\n<h3>Отклик</h3>\n<p>Сильнее всего — контракт агента. Заготовленная фраза, обязанность сначала регистрировать, отдельный абзац «не всё чужемирцы опасны», отчёт по каждому уничтоженному «во избежание устранения невинных существ» — и всё это в мире, где определение той же категории звучит как «почти всё чужемирцы жестокие психи». Бюрократия, которая противоречит собственной энциклопедии, выглядит живее, чем согласованный мир, и вопрос Миколая «а на каком языке это сказано?» попадает ровно в шов между ними. Отдельно зацепило «Ну это скука об этом говорить» — редкая честная пометка о том, где у автора кончается интерес, и она полезнее, чем была бы вымученная классификация.</p></div>", "r": []}];</script>
