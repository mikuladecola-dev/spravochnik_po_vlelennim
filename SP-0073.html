<script>const BASE="";const DOCNAME="Теневые приёмы";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0073-S01", "SP-0073--mehanika"], "h": "<p>Набор приёмов под тьму, накиданный Миколаем в один вечер (2024-06-28, id 190736–190812, окно w0040) и почти целиком отклонённый Славой. Ветка сохраняется как отвергнутая, а не как канон.</p>\n<p>Отправная точка — вопрос Миколая: «В плане тьма», «Это че такое», «Я конечно встречал, но не понимаю». Ответ Славы состоял из одного слова: «Тень» (id 190739).</p>\n<p>То, что из этого обсуждения не было отклонено, сводится к следующему.</p>\n<p><strong>Как тьма проявляется.</strong> На вопрос Миколая, призывает ли носитель тьму и ею атакует, Слава ответил: «Он из него сочится» (id 190773) — то есть тьма не призывается извне, а истекает из самого носителя.</p>\n<p><strong>Регенерация.</strong> «И у него Реген» (id 190774). На уточнение Миколая — «так может если ему руку отхуярить он сможет её восстановить или прилепить?» — Слава выбрал первое: «Восстановить» (id 190777).</p>\n<p><strong>Солнце.</strong> Единственный приём из предложенных Миколаем, который Слава принял. У Миколая он сформулирован как «пожирание солнца внутри человека лишением тени, человек так станет неосязаемым, то есть не нанесёт урон и не возможно будет нанести урон ему, возможно это он в команде будет делать, радиус 5 метров, так челы смогут проходит сквозь препятствия в радиусе действия» (id 190751). Слава сформулировал своё понимание отдельно: «Солнце поглашаеть все положительных чувств ( не действует на сильных духом)» (id 190793). Миколай отметил совпадение задним числом: «А, сука я тоже самое написал другими словами», «Ток щас понял» (id 190798, 190800).</p>\n<p>Обе формулировки зафиксированы как есть; в переписке они не сведены в одну, и какая из них итоговая — не сказано.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0073-S02", "SP-0073--ogranicheniya-i-cena"], "h": "<p>Ограничение солнца названо в скобках самим Славой: «не действует на сильных духом».</p>\n<p>Радиус 5 метров и проходимость сквозь препятствия внутри радиуса — часть формулировки Миколая (id 190751), в отдельную реплику Славой не подтверждена.</p>\n<p>Отдельно наложен запрет как ограничение всей ветки: «И все больше дебаффов не будет» (id 190802).</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0073-S03", "SP-0073--nositeli"], "h": "<p>Носитель по имени не назван. Речь идёт о персонаже с двумя личностями. Слава описал их так (id 190747): «Первая личность лентяй, сонливый, вечно засыпающий, с краткой временной памятью. Вторая убийца получающий удовольствия». Сразу следом уточнено: «У первой личности нет способностей» (id 190748) — то есть тьма принадлежит второй личности.</p>\n<p>Описание второй личности Слава позже поправил (id 190763): «Убийца прости это не правильная описания. Он скорее в открытую нападает показывая ничтожество противника и превращает его в месиво». Миколай на это: «Ну, я так в принципе и думал, также думал что канет и иная интерпретация».</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0073-S04", "SP-0073--kak-menyalas-po-versiyam"], "h": "<p>Версия одна — 2024-06-28 (id 190736–190812, окно w0040). Внутри одного вечера прошла вся последовательность: вопрос → предложения Миколая → отказ Славы → корректировка образа носителя → уточнение способа проявления тьмы → второй заход Миколая с дебаффами → второй отказ → запрет на дебаффы вообще. К способности после этой даты в материале не возвращаются.</p>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S05", "SP-0073-S05", "SP-0073--otklonennye-varianty"], "h": "<p><strong>Отклонено первым блоком</strong> (предложения Миколая, отказ Славы репликой «Все говно кроме солнца», id 190757):</p>\n<ul>\n<li><strong>Захват тенью в духе Шикамару.</strong> «Ну у одной личности будет способность шикимару», «Захват» (id 190740–190741). Отклонено немедленно: «Нет», «Подожди» (id 190742–190743) — ещё до того, как Миколай изложил остальное.</li>\n<li><strong>Сталкинг с падением в тень.</strong> «Возможность сталкерить падая в тень, можно это оригинально раскрыть» (id 190751).</li>\n<li><strong>Телепортация предметов через теневой мир.</strong> «тэпэшка через теневой мир, но не себя а предметов, то есть, может стрелять в свою тень а снаряды из другой вылетают» (id 190751).</li>\n</ul>\n<p>Из этого блока уцелело только солнце.</p>\n<p><strong>Отклонено вторым блоком</strong> (id 190779–190784):</p>\n<ul>\n<li><strong>Проклятие и дебафф всех статов прикосновением.</strong> «Ну тогда он может проклинать противника, дебафить по всем статам лишь прикосновением».</li>\n<li><strong>Издевательство над слабаками.</strong> «И уже над слабаками издеваться», «Кромсать».</li>\n</ul>\n<p>Ответ Славы: «Нет» (id 190782), «Не будет» (id 190784). После этого — общий запрет: «И все больше дебаффов не будет» (id 190802).</p>\n<p><strong>Не отклонено и не подтверждено:</strong></p>\n<ul>\n<li><strong>Баф инструментов тьмой.</strong> «Он бафает себе инструменты, они наделяются тьмой, и ну в общем лучше работают» (id 190806). Прямого ответа на это предложение не последовало — Миколай тут же сам себя перебил («Стоп», «Короче») и перевёл разговор на другое.</li>\n</ul>\n<p><strong>Итоговая формулировка направления.</strong> Миколай свёл требование Славы к одному предложению: «Ты хочешь красивую атаку» (id 190809). Слава: «Ну да наверное» (id 190810). Этой же формулой — «Ну да наверное» — он до этого подтвердил и способ проявления тьмы (id 190775).</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S06", "SP-0073-S06", "SP-0073--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Ветка проходит по разделу «Часть чего» как часть Тьмы. Связана с Солнцем — единственным принятым из предложенного приёмом.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "SP-0073-S07", "SP-0073--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имя носителя не названо.</li>\n<li>Формулировки солнца от Миколая (неосязаемость, радиус 5 метров, проход сквозь препятствия) и от Славы (поглощение положительных чувств, не работает на сильных духом) не сведены; какая действует — в переписке не сказано.</li>\n<li>Судьба бафа инструментов тьмой осталась нерешённой: ни принято, ни отклонено.</li>\n<li>Что такое «красивая атака», которую хочет Слава, не расшифровано — обсуждение обрывается на «Понял» (id 190812).</li>\n<li>Пределы регенерации не заданы: сказано только, что оторванную руку носитель может восстановить.</li>\n<li>Как именно тьма, которая «сочится», наносит урон — не описано.</li>\n<li>Отношения между двумя личностями и переключение между ними не разобраны.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0073--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0073--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-06-28</td>\n<td>190736–190812</td>\n<td>w0040</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0073-tenevye-priemy.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0073--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0073.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
