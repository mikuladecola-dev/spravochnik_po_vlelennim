<script>const BASE="";const DOCNAME="Гордыня (грех)";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0162-S01", "SP-0162--mehanika"], "h": "<p>Гордыня — один из семи грехов в системе «магия по грехам». Разрабатывалась в один заход вместе с остальными шестью грехами (2024-12-24, id 273904–273921), в двух конкурирующих вариантах.</p>\n<p><strong>Вариант Миколая (2024-12-24, id 273904–273908).</strong> Три составляющие:</p>\n<ul>\n<li>«шизофрения как способность, чет ему в голову голос говорит какой он крутой» — то есть голос в голове носителя хвалит его самого;</li>\n<li>«магия света и огня развита хорошо»;</li>\n<li>«магия привлечения внимания».</li>\n</ul>\n<p>Как именно работает магия привлечения внимания — на кого направлена, чьё внимание и к чему привлекает — в переписке не сказано. Про голос не сказано, отдельная ли это сущность, даёт ли он что-то помимо похвалы и слышен ли кому-то, кроме носителя.</p>\n<p><strong>Вариант Славы (2024-12-24, id 273917–273921).</strong> Одна строка: «Слово закон с ограничением». То есть сказанное носителем становится законом, но с каким-то ограничением. В чём состоит ограничение — не расшифровано.</p>\n<p>Про категорию гордыни (в разборе Миколая грехи делятся на «стихию», «благословение» и «проклятье») ничего не сказано ни в одном из вариантов.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0162-S02", "SP-0162--ogranicheniya-i-cena"], "h": "<p>В варианте Славы ограничение заявлено самой формулировкой — «Слово закон с ограничением», — но его содержание не раскрыто. Формулировка построена так же, как его же вариант для похоти (<a href=\"SP-0157.html\">Похоть (грех)</a>): «Контроль разума с ограничением».</p>\n<p>Отдельного проклятья за гордыней не закреплено ни в одном варианте. У некоторых других грехов Миколай проклятье прописывал прямо (алчность — «ты не можешь ничего отдать кому либо»; гнев — потеря способности видеть человеком того, кто поступил несправедливо). У гордыни такой строки нет.</p>\n<p>В том же окне Миколай замечает: «но в грехах это базовое подразумевается, такова природа греха» (2024-12-24, id 273917). К чему именно относится «это», из сохранённого куска переписки не восстанавливается.</p>", "r": [["Похоть (грех)", "SP-0157.html"]]}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0162-S03", "SP-0162--nositeli"], "h": "<p>Носители не названы. Персонаж, у которого есть этот грех, в переписке не появляется.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0162-S04", "SP-0162--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-12-24 (id 273904–273908), Миколай.</strong> Шизофрения как способность (голос хвалит носителя), хорошо развитые магии света и огня, магия привлечения внимания.</p>\n<p><strong>Версия 2 — 2024-12-24 (id 273917–273921), Слава.</strong> Слово-закон с ограничением. Слава проходит по списку грехов Миколая и по гордыне даёт свою замену, не соглашаясь с первым вариантом.</p>\n<p><strong>Версия 3 — 2024-12-25 (id 274470–274474), Миколай.</strong> Миколай отказывается от собственного варианта в пользу варианта Славы: «моя версия мне не нравится», «вот это подходит», «тоже хороший вариант». Никаких дополнений или правок к слову-закону при этом не вносится — принимается ровно та формулировка, что была дана 2024-12-24.</p>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S05", "SP-0162-S05", "SP-0162--otklonennye-varianty"], "h": "<p>Отклонён вариант Миколая от 2024-12-24 (шизофрения-голос, магия света и огня, магия привлечения внимания) — отклонён самим Миколаем 2024-12-25 (id 274470–274472) словами «моя версия мне не нравится». Отклонение не мотивировано: почему именно не нравится, не сказано.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S06", "SP-0162-S06", "SP-0162--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Входит в набор «Семь грехов (магия по грехам)» вместе с похотью (<a href=\"SP-0157.html\">Похоть (грех)</a>), чревоугодием (<a href=\"SP-0158.html\">Чревоугодие</a>), алчностью, ленью, гневом и завистью. Все семь разбирались одним списком в одном сообщении (id 273906) и одним ответным списком (id 273920).</p>\n<p>Прямых механических связей гордыни с другими грехами в переписке не проведено.</p>", "r": [["Похоть (грех)", "SP-0157.html"], ["Чревоугодие", "SP-0158.html"]]}, {"t": "Пробелы", "a": ["S07", "SP-0162-S07", "SP-0162--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Категория гордыни (стихия / благословение / проклятье) не определена ни в одном варианте.</li>\n<li>Содержание «ограничения» в формуле «Слово закон с ограничением» не раскрыто.</li>\n<li>Не сказано, что происходит с магией света и огня и с магией привлечения внимания после того, как Миколай отказался от своего варианта: отпали они вместе с ним или сохраняются рядом со словом-законом — осталось нерешённым.</li>\n<li>Носители не названы.</li>\n<li>Вселенная в исходной записи помечена как неясная: грехи писались 2024-12-24, привязка к средневековой вселенной (объявлена 2024-12-21, id 272184) сделана по дате объявления, а не по прямому указанию в переписке.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0162--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0157.html\">Похоть (грех)</a>, <a href=\"SP-0158.html\">Чревоугодие</a></li>\n<li><strong>Упомянут в способностях:</strong> <a href=\"SP-0157.html\">Похоть (грех)</a>, <a href=\"SP-0158.html\">Чревоугодие</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0162--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-12-24</td>\n<td>273904–273908</td>\n<td>w0068</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-24</td>\n<td>273917–273921</td>\n<td>w0068</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-25</td>\n<td>274470–274474</td>\n<td>w0068</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0162-gordynya-greh.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0162--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0162.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
