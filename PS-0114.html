<script>const BASE="";const DOCNAME="Рыба-люди";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0114-S01", "PS-0114--proishozhdenie"], "h": "<p>Рыба-люди — основное население подводного острова (острова на дне океана, он же сфера). Появляются в переписке 2024-07-04 (окно w0043, id 196747–196777). Тему открывает Слава вопросом «А как рыбы плавают ?», Миколай отвечает «энергией делиться» и добавляет «хороший вопрос». Дальше Слава задаёт основное: «Вообще там по большей части жить будет рыба люди».</p>\n<p>Варианты написания в переписке: «рыба люди», «рыба человек».</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0114-S02", "PS-0114--vneshnost"], "h": "<p>Отдельного описания внешности нет. Единственное, что сказано о телосложении, — следствие давления: «ну ебать они качки там будут все» (id 196774). То есть всё население физически развитое.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0114-S03", "PS-0114--harakter"], "h": "<p>Не обсуждался.</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0114-S04", "PS-0114--sposobnosti"], "h": "<p>Способностей в смысле сверхъестественных умений не названо. Названа физиологическая особенность, вокруг которой строится вся ветка:</p>\n<ul>\n<li>Рыба-люди «рождаются уже по ебейшим весом» (id 196752) — то есть сразу под огромным давлением;</li>\n<li>«из погружение обычно плавное» (id 196753) — привыкание к давлению идёт постепенно.</li>\n</ul>\n<p>В противопоставление этому — что происходит с тем, кто попадает туда иначе: «а тут, тя нахуй давят десятки тонн воды» (id 196757).</p>\n<p>Отсюда режим жизни: «каждый с тренировками как для космонавта» (id 196775).</p>\n<p>Отдельно оговорены дети: «ну детей там к хуям разорвёт» (id 196776), «так что родители будут за этим следить» (id 196777). То есть за плавностью погружения детей следят родители.</p>\n<p>По вопросу Славы «А как рыбы плавают ?» ответ Миколая — «энергией делиться» (id 196748). Как именно это работает, дальше не разбиралось.</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0114-S05", "PS-0114--svyazi-s-drugimi"], "h": "<ul>\n<li>Часть острова на дне океана (сферы) — основное его население.</li>\n<li>Связаны с Солнышком и с трубами сферы.</li>\n<li>Барьер сферы: обсуждается, как рыба-люди проходят сквозь него. Слава ставит задачу: «Тогда как сделать чтобы они плавно выходили через барьер» (id 196758), уточняет направление — «Из барьера в воду» (id 196761). Миколай предлагает: «ну можно реализовать специальные каналы» (id 196762), затем поясняет — «ну тобиж, не напрямую в воду, а как бы в барьере будут подобия труб» (id 196768), и добавляет альтернативу: «или выходить можно через дно» (id 196769). Слава формулирует принцип: «Трубы где ты проходишь через неё давления плавно поднимается» (id 196770). Миколай подтверждает: «наружу естественно по каналам» (id 196771), «да, получается так» (id 196773).</li>\n</ul>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0114-S06", "PS-0114--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2024-07-04 (окно w0043, id 196747–196777).</strong> Задана основа: рыба-люди — по большей части население острова; рождаются под огромным весом, погружение плавное; всё население — качки с тренировками как у космонавтов; детей разорвёт, поэтому за этим следят родители. Тут же придуман механизм выхода наружу — трубы в барьере с плавным подъёмом давления, либо выход через дно.</p>\n<p><strong>Версия 2 — 2024-07-04 (окно w0043, id 197036–197040).</strong> Рыба-люди появляются в новой роли — как внешняя сторона, которая может предъявить претензии за загрязнение океана. Слава: «А рыба люди не чё не скажут / Типо почему загрязняется океан ?». Ответ Миколая: «ну газы в воздух уходят это норм а пыль в естественных количествах уходит» (id 197038). То есть при естественных объёмах выброса претензий нет. Оговорка: «если перебор типо внутри будет война» (id 197039), «тогда да, тогда будет не удобно» (id 197040).</p>\n<p>Здесь рыба-люди фигурируют как те, кто снаружи, — в отличие от версии 1, где они население самой сферы. Как это соотносится, в переписке не проговорено.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0114-S07", "PS-0114--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Внешность не описана: не сказано, насколько они рыбы и насколько люди.</li>\n<li>«Энергией делиться» (ответ на вопрос, как плавают рыбы) не расшифровано.</li>\n<li>Численность, устройство общества, язык, культура — не обсуждались.</li>\n<li>Не сказано, что происходит с рыба-людьми при выходе за пределы барьера в дальнейшем: механизм плавного подъёма давления описан, а что они делают снаружи — нет.</li>\n<li>Противоречие между версиями (рыба-люди как население сферы и рыба-люди как внешняя сторона, предъявляющая за загрязнение) осталось нерешённым.</li>\n<li>Про обычного человека сказано только косвенно — «тя нахуй давят десятки тонн воды»; отдельного разбора того, что бывает с не-рыба-человеком внутри, нет.</li>\n<li>Кто именно загрязняет океан и чем — в этой ветке не названо, кроме упоминания газов и пыли.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0114--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0033.html\">Рыба-люди</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0114--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-04</td>\n<td>196747–196777</td>\n<td>w0043</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-04</td>\n<td>197036–197040</td>\n<td>w0043</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0114-ryba-lyudi.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0114--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0114.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
