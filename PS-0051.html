<script>const BASE="";const DOCNAME="Саша";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0051-S01", "PS-0051--proishozhdenie"], "h": "<p>Персонаж Славы. Появился 2024-04-03 (окно w0029, id 153531) одной карточкой в ряду персонажей вселенной «игра бога»: имя, две черты характера, способность. Больше в этом окне о нём ничего нет.</p>\n<p>Спустя год, 2025-05-04 (окно w0090, id 323655–323659), имя Саша возникает заново — уже не карточкой, а действующим лицом в прологе про Максима, который Слава выложил в чат с условием «Только ты должен будешь сразу ответить» (id 323655). Вселенная в этом окне не названа; в базе окно отнесено к вселенной «Нимб» по дате объявления. Совпадает ли этот Саша с персонажем карточки 2024 года, в переписке не сказано: способность «деление» в прологе не упоминается, а карточные черты с текстом пролога никак не связаны.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0051-S02", "PS-0051--vneshnost"], "h": "<p>Не описана. Единственная физическая характеристика — та, что он даёт себе сам в прологе: атлет, спортсмен. Возраст, лицо, одежда не названы.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0051-S03", "PS-0051--harakter"], "h": "<p><strong>Карточка (2024-04-03, id 153531):</strong> «Умный, разговорчивый».</p>\n<p><strong>Пролог (2025-05-04, id 323658):</strong> Саша ведёт весь диалог с Андреем и говорит о себе как об атлете — «раз сука я атлет за ним не поспевать то ты точно». Он последовательно возражает против того, чтобы брать Максима в поход, и спрашивает «в очередной раз» — то есть тему поднимает не впервые.</p>\n<p>Свою позицию он обосновывает не общими словами, а собственным опытом: сам ходил с Максимом в поход и стёр ноги до крови — «И это не шутка или преувеличения. Я потом ходить нормально не мог месяц».</p>\n<p>Разговаривает с раздражением и иронией: переигрывает друга («Чего такого — явно переигравая своего друга»), протирает рукой между глаз, вздыхает, приподнимает бровь. На тупость собеседника отвечает коротко и грубо: «да блять.», «да я не об этом».</p>\n<p>Объясняет он развёрнуто, с фактурой: почему Максим стал спортсменом («потому что ему было скучно»), как он ведёт себя в походе, чем это грозит спутникам. При этом сам себя проверяет на честности — про съеденную Максимом лису признаётся так: «Живодёр хренов. Но суп всё равно вкусный вышел — честной признался Саша».</p>\n<p>Практический вывод из спора он делает сам, несмотря на все возражения: раз Максима уже пригласили — «Нужно будет его попросить по медленнее двигаться».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0051-S04", "PS-0051--sposobnosti"], "h": "<p>Дана только в карточке 2024-04-03 (id 153531), дословно:</p>\n<div class=\"q\"><p>«Способность: деление( может делить объекты на равный части только неоудешевленный предметы, чем большой объект делить чем больше устаешь)»</p></div>\n<p>То есть: делит объекты на равные части; работает только с неодушевлёнными предметами; чем больший объект делить, тем больше устаёшь.</p>\n<p>В прологе 2025 года способность не упоминается и не применяется.</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0051-S05", "PS-0051--svyazi-s-drugimi"], "h": "<p><strong>Андрей (<a href=\"PS-0132.html\">Андрей</a>)</strong> — собеседник Саши в прологе, его друг. Именно Андрей пригласил Максима в поход. С Максимом Андрей раньше не ходил («ну нет»), про его выходки не знает и по ходу разговора узнаёт, откуда у Максима дома медведь. В конце он обрывает спор: «ну так это же Максим, у него всё идеальное же выходит. Пошли уже. Собираться пора в походе уже».</p>\n<p><strong>Максим</strong> — тот, из-за кого идёт спор. Со слов Саши: спортсмен, «Лучший наверное спортсмен нашего колледжа или даже города»; спортом начал заниматься «потому что ему было скучно»; в походе ему тоже скучно, поэтому «он скакал, как заяц туда сюда», успевая ещё и «в какие-то дырки залазить». В прошлый поход, по перечислению Саши, Максим похитил медвежонка и потом убегал по лесу от его матери, завёл их в пещеру и заблудился, пытался поймать лису — а после съел её, и суп вышел вкусный. Максима уже пригласили в поход, и решение Саши — «Нужно будет его попросить по медленнее двигаться».</p>\n<p><strong>Игра бога</strong> — вселенная, в ряду персонажей которой стоит карточка 2024 года.</p>\n<p><strong>Пролог про Максима</strong> — текст, в котором Саша выступает вторым участником диалога.</p>", "r": [["Андрей", "PS-0132.html"]]}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0051-S06", "PS-0051--kak-menyalsya"], "h": "<p><strong>2024-04-03, окно w0029, id 153531, вселенная «игра бога» (объявлена).</strong> Полная карточка персонажа: «Саша / Умный, разговорчивый / Способность: деление...». Ничего, кроме этих трёх строк, о нём в этом окне нет.</p>\n<p><strong>2025-05-04, окно w0090, id 323655–323659.</strong> Первое появление в художественном тексте — прологе перед походом. Саша здесь атлет, друг Андрея, знакомый Максима по прошлому походу, противник его участия в новом. Ни характеристик карточки, ни способности «деление» текст не повторяет. Вселенная в окне не названа.</p>\n<p>Отдельно: в переписанном прологе от 2025-05-06 (окно w0091), где тот же диалог подан от первого лица, имя Саша не звучит — сторона спора там безымянный рассказчик. Заменён ли Саша рассказчиком или это он же, в переписке не сказано.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0051-S07", "PS-0051--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вселенная окна w0090 в переписке не названа.</li>\n<li>Не сказано, один ли это персонаж в карточке 2024 года и в прологе 2025 года; общего у них только имя.</li>\n<li>В прологе именем Саша подписаны обе стороны диалога (реплики Андрея тоже атрибутированы Саше), так что разделение реплик восстанавливается только по смыслу.</li>\n<li>Фраза «ты так Яра был против того чтобы он пошёл с нами» осталась в тексте как есть; что означает «Яра», из переписки не следует.</li>\n<li>Внешность, возраст, происхождение Саши не описаны. Из косвенного — Максим учится в колледже («нашего колледжа»), про самого Сашу такого прямо не сказано.</li>\n<li>Способность «деление» не разбиралась: не сказано, на сколько частей можно делить, есть ли предел размера, обратимо ли деление, как способность связана с событиями пролога.</li>\n<li>Что с персонажем стало дальше, в переписке не сказано; поход в приведённых кусках не начинается.</li>\n<li>Сообщением сразу после пролога (id 323659) Слава выложил отдельный текст от первого лица — монолог Алексея выжившего о времени до инцидента и о дне рождения племянницы. Саша в этом тексте не появляется, связь двух текстов в переписке не оговорена.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0051--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0050.html\">Команда Славы (персонажи игры бога)</a></li>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0132.html\">Андрей</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0132.html\">Андрей</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0050.html\">Команда Славы (персонажи игры бога)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0014.html\">игра бога</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0051--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-04-03</td>\n<td>153531–153531</td>\n<td>w0029</td>\n<td>игра бога (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-05-04</td>\n<td>323655–323659</td>\n<td>w0090</td>\n<td>Нимб (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0051-sasha.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0051--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0051.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
