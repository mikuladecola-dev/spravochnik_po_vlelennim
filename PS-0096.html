<script>const BASE="";const DOCNAME="Катапира";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0096-S01", "PS-0096--proishozhdenie"], "h": "<p>Персонаж вырос из карточки Славы, у которой сначала не было имени — только обозначение способности. Карточка выложена 2024-06-18 (окно w0038, id 183252) под заголовком «Температура т.п.» и целиком выглядела так:</p>\n<p>«Мужчин лет 17\nСпособности: повышение температуры\nИнструмент: тонкие меч ( он его нагревает до невероятных высот из-за этого, он как будто лазерный меч)( также он использует способности не только для нагревания инструмента но и чтобы убить человека или чтобы расплавить другие предметы( расплавить сверхчеловека будет тяжело или невозможно))\nТакже его фирменный приемы нагревания воздуха до невероятных высот заставляет воздух буквально взрываться ( сам может получить урон)»</p>\n<p>Через три дня, 2024-06-21 (id 185001–185007), Слава пересылает ту же карточку дословно и спрашивает: «Каво выбираешь?». Миколай отвечает: «Попробую температуру». С этого момента персонаж переходит к Миколаю на разработку, и все дальнейшие подробности — его.</p>\n<p>Имя Катапира дано Миколаем в тот же день, 2024-06-21 (id 185046), вместе с полной карточкой. В записи значатся варианты имени «Температура» и «Температура т.п.» — это исходное обозначение до появления имени.</p>", "r": []}, {"t": "Характер", "a": ["S02", "PS-0096-S02", "PS-0096--harakter"], "h": "<p>Полностью задан Миколаем в карточке 2024-06-21 (id 185046) и повторён дословно в пересылке 2026-06-14 (id 489439):</p>\n<p>«любопытный парень, со стороны кажущийся сумасшедшим и не тем что делает странные шумные выходки, а тем, что делает тихие личные эксперименты и прикольчики. Обожает наблюдать за природой и общаться со взрослыми, набираться опыта. Не любит кушать, а если и кушает что-то, то только в сыром виде, все равно он никогда не заболеет и не подхватит паразита, так как в его теле такая температура при которой никто не выживет, да и еда внутри уже готовится»</p>\n<p>То есть еда внутри него готовится сама — это следствие способности, вынесенное в бытовую привычку.</p>\n<p>Отдельными строками карточки:</p>\n<ul>\n<li>Любит: корочки от печной пиццы, волосатых гусениц.</li>\n<li>Не любит: соль/сахар, молодёжь (людей до 25, хотя самому меньше).</li>\n</ul>\n<p>Про молодёжь в самой карточке стоит авторская оговорка «хотя самому меньше» — то есть противоречие с его возрастом замечено сразу и оставлено как есть.</p>\n<p>К характеру относится и то, что вскрылось в споре о статах: «Ему нравится драться» (id 185055). Выносливость 8 объяснена именно этим: «Этот стат я вкачал чтобы его битвы были дохуя длинными» (id 185056).</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0096-S03", "PS-0096--sposobnosti"], "h": "<p><strong>Основное:</strong> повышение температуры.</p>\n<p><strong>Оружие:</strong> тонкий меч. В исходной карточке Славы это «инструмент», и работает он так: «он его нагревает до невероятных высот из-за этого, он как будто лазерный меч». Там же оговорено, что способность применяется не только к мечу: «чтобы убить человека или чтобы расплавить другие предметы», с ограничением — «расплавить сверхчеловека будет тяжело или невозможно».</p>\n<p><strong>Характеристики</strong> (карточка Миколая, id 185046; после спора добавлена скорость):</p>\n<ul>\n<li>Сила: 6</li>\n<li>Ловкость: 5</li>\n<li>Меткость: 9</li>\n<li>Скорость: 7</li>\n<li>Выносливость: 8</li>\n<li>Контроль: 10</li>\n</ul>\n<p><strong>Приёмы</strong> — три, в редакции Миколая:</p>\n<ol>\n<li>«Нагревание воздуха до невероятных высот при которых происходит взрыв этой смеси газов». Это тот же фирменный приём, что был в исходной карточке Славы, где к нему стояла цена: «сам может получить урон».</li>\n<li><strong>Атомарное домино.</strong> «Коснувшись мечем на определённой частоте какой-либо поверхности, она начинает резко передавать температуру по волновому импульсу. Например пол он коснулся, и в сторону противника он начинает отдавать раскалённую волну тепла. Это просто очень горячо ну если не направлять силу. Если направить силу, то под конкретной целью расплавиться поверхность».</li>\n<li><strong>Самовозгорание.</strong> «повышает защиту и атаку. Типо предметы попадающие в его воспламенённую зону сгорают или плавятся, а у оружия появляется наружняя аура добовляющая урон. Не очень затратная на самом деле способность, но зато очень эффективная и выглядит красиво пхех». Про её силу Миколай уточнил отдельно, отвечая на вопрос, не танк ли персонаж: «типо это самовозгорание слабенькое на деле» (id 185048).</li>\n</ol>\n<p><strong>Побочное действие способности на самого носителя:</strong> «в его теле такая температура при которой никто не выживет», из-за чего он не болеет и не подхватывает паразитов, а съеденное сырым готовится внутри.</p>\n<p><strong>Роль в бою.</strong> Прямо оговорена в споре 2024-06-21: не танк, а атакующий. Миколай: «Нет, совсем нет, он атакующий»; на замечание, что выносливость выше всех статов, — «Тогда он хуёвый атакующий», «Но атакующий» (id 185048–185053).</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0096-S04", "PS-0096--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Слава</strong> — автор исходной карточки и способности; <strong>Миколай</strong> — автор имени, характеристик, приёмов и характера. Разделение работы зафиксировано обменом «Каво выбираешь?» — «Попробую температуру» (2024-06-21, id 185003–185007).</li>\n<li><strong>Зурбон</strong> — персонаж, чья карточка переслана следующим сообщением, встык с карточкой Катапиры (2026-06-14, id 489440), и вместе с ней вставлена во вселенную. Прямого сюжетного взаимодействия между ними в переписке не описано — они соседствуют только как две карточки в одной пересылке.</li>\n<li><strong>Система характеристик персонажей</strong> — статблок сила/ловкость/меткость/скорость/выносливость/контроль, по которому расписана карточка. Определения двух статов даны в этом же разговоре, см. раздел ниже.</li>\n<li>В списке «Связано с» самой записи значатся также <strong>Сталкер</strong> и <strong>Текси</strong>, но в приведённых кусках переписки они не упоминаются — характер связи в переписке не назван.</li>\n<li>Способность вынесена отдельными записями «Повышение температуры» и «Повышение температуры (Катапира)».</li>\n</ul>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S05", "PS-0096-S05", "PS-0096--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2024-06-18 (окно w0038, id 183252).</strong> Карточка Славы без имени, под заголовком «Температура т.п.»: мужчина лет 17, повышение температуры, тонкий меч-«лазерник», плавление предметов с оговоркой про сверхчеловека, фирменный приём — нагрев воздуха до взрыва с риском получить урон самому. Ни статов, ни характера, ни привычек здесь ещё нет.</p>\n<p><strong>Версия 2 — 2024-06-21 (окно w0038, id 185001–185007).</strong> Та же карточка переслана дословно, без единого изменения, в ряду других на выбор. Миколай берёт её себе.</p>\n<p><strong>Версия 3 — 2024-06-21, 10:24 (окно w0038, id 185046).</strong> Полная карточка Миколая. Появляются: имя Катапира; список «Любит / Не любит»; статблок из пяти позиций (сила 6, ловкость 5, меткость 9, выносливость 8, контроль 10 — скорости на этом шаге ещё нет); два новых приёма сверх исходного — Атомарное домино и Самовозгорание; развёрнутый характер и бытовая часть про еду. Возраст в этой карточке не указан — он остался только в исходной карточке Славы («лет 17»), и «Не любит» ссылается на него косвенно: «хотя самому меньше».</p>\n<p><strong>Версия 4 — 2024-06-21, 10:26–10:35 (окно w0038, id 185047–185070).</strong> Правка через спор. Слава: «А чё он типа танк ?» — Миколай отвечает, что нет, атакующий, и объясняет высокую выносливость желанием сделать бои длинными. Слава замечает, что ожидал упора на скорость: «Я думал ты сделаешь упор на скорость, у него же типа смертельный атаки и \"лазерный меч\"». Миколай: «Бля есть же ещё скорость 😅». В карточку добавляется скорость 7. Слава заканчивает: «И изменил статы».</p>\n<p><strong>Версия 5 — 2026-06-14 (окно w0121, id 489439–489441).</strong> Слава пересылает карточку Катапиры дословно в том виде, в каком её оставил Миколай в 2024 году — со статами, тремя приёмами и характером, — следом карточку Зурбона, и подводит итог: «Короче я слегка их переделал и запихнул в вселенную». Вселенная в этом окне не названа. Что именно переделано — в переписке не сказано; пересланный текст карточки при этом совпадает с редакцией 2024 года дословно.</p>", "r": []}, {"t": "Отклонённые и оговорённые варианты", "a": ["S06", "PS-0096-S06", "PS-0096--otklonennye-i-ogovorennye-varianty"], "h": "<ul>\n<li><strong>Танк.</strong> Предположение Славы «А чё он типа танк ?» отвергнуто прямо: «Нет, совсем нет, он атакующий».</li>\n<li><strong>Упор на скорость.</strong> Слава ожидал именно этого, Миколай сознательно от этого отказался: «Я не хочу всё-таки его делать очень быстрым», и объяснил причиной баланс на будущее: «Типо ты часто переживаешь за баланс и как по мне в таком случае не стоит в самом начале всех делать имбовыми», «Надо дать им и будущим персам потанцевал». Слава согласился: «Да уловил».</li>\n<li><strong>Ловкость и скорость как один стат.</strong> Слава предположил: «Ну типа ловкость и скорость одно и тоже», «Или не ?», и сам же отказался от этого: «Ладно не ,добавь скорость и я добавлю». Миколай развёл их определениями: «Ловкость это способность уклоняться от препятствий, выбираться из любой хуйни. А скорость ну это то насколько быстро перемещается» — и добавил: «Я должен был это прокомментировать, да.)».</li>\n</ul>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0096-S07", "PS-0096--chto-s-nim-stalo"], "h": "<p>Персонаж не закрыт и не отменён. Последнее состояние — 2026-06-14: карточка перенесена в новую вселенную вместе с Зурбоном («Короче я слегка их переделал и запихнул в вселенную», id 489441). Что он в этой вселенной делает и какое место занимает, в переписке не сказано.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0096-S08", "PS-0096--probely"], "h": "<div class=\"gaps\"><ul>\n<li><strong>Внешности нет вообще ни в одной версии.</strong> У соседней карточки Зурбона внешность расписана подробно (цилиндр, монокль, фрак, татуировки), у Катапиры — ни строки.</li>\n<li><strong>Возраст есть только в исходной карточке Славы</strong> — «Мужчин лет 17». В карточке Миколая строки «Возраст» нет, хотя у Зурбона она есть.</li>\n<li><strong>Происхождение способности не объяснено:</strong> откуда у него повышение температуры, врождённое это или полученное — не сказано.</li>\n<li><strong>Предел нагрева не назван.</strong> Формулировка везде одна — «до невероятных высот», числовых значений нет.</li>\n<li><strong>Цена приёмов расписана неровно.</strong> У приёма с взрывом воздуха она есть с самой первой карточки («сам может получить урон»), у Самовозгорания оценена словами «Не очень затратная на самом деле способность», у Атомарного домино цены не названо.</li>\n<li><strong>Как именно он не сгорает изнутри — не объяснено;</strong> сказано только, что температура внутри него убивает любых паразитов.</li>\n<li><strong>Насколько карточка переделана при переносе в новую вселенную (2026-06-14) — не сказано</strong> (помечено в самой записи, w0121). Вселенная в этом окне тоже не названа.</li>\n<li><strong>Связь со Сталкером и Текси не раскрыта</strong> — они значатся в связях записи, но в приведённых кусках переписки не упоминаются.</li>\n<li><strong>Ни одной сцены с его участием в переписке нет.</strong> Персонаж существует только как карточка и как предмет спора о балансе.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0096--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0026.html\">Пресрог (преступная организация)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0096--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-06-18</td>\n<td>183252–183252</td>\n<td>w0038</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-06-21</td>\n<td>185001–185007</td>\n<td>w0038</td>\n<td>7 островов (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2024-06-21</td>\n<td>185046–185046</td>\n<td>w0038</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-06-21</td>\n<td>185047–185070</td>\n<td>w0038</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-14</td>\n<td>489439–489441</td>\n<td>w0121</td>\n<td>неясно (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0096-katapira.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0096--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0096.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
