<script>const BASE="";const DOCNAME="Чревоугодие";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0189-S01", "PS-0189--proishozhdenie"], "h": "<p>Чревоугодие — один из Семи грехов вселенной «Апостол». Категория вводится Славой 2025-01-23 (id 284175, окно w0072) вместе с уровнем силы для всей группы: «7 грехов и божество ( помнишь его) Будет слабей главы этой организации но сильней благословенного». Имя главы организации в этом сообщении не названо.</p>\n<p>В каталоге от 2025-01-24 записан с опечаткой и знаком: «Чероугодия ◼️».</p>", "r": []}, {"t": "Способности", "a": ["S02", "PS-0189-S02", "PS-0189--sposobnosti"], "h": "<p><strong>На 2025-01-23 (id 284176)</strong> — способность не расписана. В перечне, где Слава по пунктам разбирает грехи, напротив этого стоит только: «Чревоугодие ок». В том же сообщении способность поглощения примеряется к другому греху: «Алчность: Я думал больше о способности поглощений чужой манный или объектов».</p>\n<p><strong>На 2025-01-24 (id 284278)</strong> — в каталоге за Чревоугодием закреплено поглощение: «Чероугодия ◼️( поглощения)». Алчность в том же каталоге записана иначе: «Алчность ♾( всё моей)». То есть поглощение перешло от Алчности к Чревоугодию. Формулировка причины перехода в переписке отсутствует.</p>", "r": []}, {"t": "Связи с другими", "a": ["S03", "PS-0189-S03", "PS-0189--svyazi-s-drugimi"], "h": "<ul>\n<li>Входит в Семь грехов. В каталоге от 2025-01-24 (id 284278) группа записана так: Гнев 😡 (сила), Похоть 😵‍💫 (контроль разума), Зависть 👹👹 (полной копирование), Алчность ♾ (всё моей), Гордыня 👑, Чероугодия ◼️ (поглощения), Лень 😴 (контроль территории) — то есть Лень (<a href=\"PS-0190.html\">Лень</a>).</li>\n<li>Связано с Алчностью через способность поглощения, которая 2025-01-23 приписана Алчности, а 2025-01-24 — Чревоугодию.</li>\n<li>Вся группа Семи грехов помещена по силе между главой организации и благословенным.</li>\n</ul>", "r": [["Лень", "PS-0190.html"]]}, {"t": "Как менялся — состояния по датам", "a": ["S04", "PS-0189-S04", "PS-0189--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2025-01-23 (id 284175–284177, окно w0072).</strong> Оставлен без изменений: «Чревоугодие ок». Никакой способности за ним не закреплено.</p>\n<p><strong>Версия 2 — 2025-01-24 (id 284278–284279, окно w0072).</strong> В каталоге получает поглощение: «Чероугодия ◼️( поглощения)». Обсуждение каталога Слава закрывает репликой «Ну да».</p>\n<p>Позже это же распределение воспроизводится в большом списке от 2025-02-25 (id 295559), где раздел «Семь грехов» повторён в том же виде, включая «Чероугодия ◼️( поглощения)».</p>", "r": []}, {"t": "Пробелы — чего в переписке нет", "a": ["S05", "PS-0189-S05", "PS-0189--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Что именно поглощает Чревоугодие и по каким правилам — не сказано. Формулировка про поглощение чужой маны или объектов относилась к Алчности, а не к Чревоугодию.</li>\n<li>Ограничения способности не названы. У Похоти и Гордыни в том же перечне ограничения оговорены отдельно («с ограничением»), у Чревоугодия — нет.</li>\n<li>Внешность, характер, пол, имя носителя — не описаны.</li>\n<li>Причина, по которой поглощение перешло от Алчности к Чревоугодию, в переписке не проговорена.</li>\n<li>Что стало с персонажем дальше — в этих окнах не сказано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0189--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0002.html\">Семь грехов</a></li>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0190.html\">Лень</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0190.html\">Лень</a>, <a href=\"PS-0203.html\">Одержимый</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0002.html\">Семь грехов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0189--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-01-23</td>\n<td>284175–284177</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-24</td>\n<td>284278–284279</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0189-chrevougodie.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0189--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0189.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0189-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0189/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Самое дорогое здесь — не сам грех, а Алчность. Шесть грехов из семи заведены как персонажи со статьями: <code>PS-0177</code> Гнев, <code>PS-0188</code> Похоть, <code>PS-0189</code>, <code>PS-0190</code> Лень, <code>PS-0191</code> Зависть, <code>PS-0192</code> Гордыня. Алчности среди них нет — она существует только как способность <code>SP-0159</code> (статья есть, база 11 808, одна ссылка). При этом имя «Алчность» встречается в 27 статьях справочника, а вся содержательная часть этой статьи держится именно на ней: 23-го числа поглощение приписано Алчности, 24-го — Чревоугодию. Статья описывает переезд способности от сущности, которой в реестре персонажей не существует.</p>\n<p>Второе — <code>SP-0158</code> «Чревоугодие»: статьи нет, ссылок ноль, вселенная помечена «неясно», база 7 117 — почти вдвое больше базы самой <code>PS-0189</code> (4 175). Там лежит декабрьский заход и там же ответ на первый пробел статьи.</p>\n<p>Третье, общее для всего куста, — каталоги: <code>SL-0051</code> (шесть ссылок, статьи нет, 9 834) и <code>SL-0053</code> (шесть ссылок, статьи нет, 20 313). Из них взята строка «Чероугодия ◼️( поглощения)», и они же самые ссылаемые записи «Апостола» без статьи.</p>\n<h3>С чего начать</h3>\n<p>В базе. В архив идти не надо.</p>\n<p><code>SP-0158</code>, окно w0068, id 273904–273908, 2024-12-24. Там Миколай расписывает Чревоугодие: «способность всё хавать или поглощать, в том числе магию которая меньше облака заклинания, даже чужая магия. это благословение, ибо влияние, а не создание», и отдельно как набор — «поглощение чужих навыков, но не себе. он их поглощает и они исчезают». Правило, которого статья не находит («что именно поглощает и по каким правилам»), там сформулировано целиком: порог — облако заклинания, и поглощённое не присваивается.</p>\n<p>Дальше важнее. Сообщение id 284176, которое статья считает первым появлением (2025-01-23 09:10), дословно совпадает с id 273920 от 2024-12-24 14:26 — тот же текст, включая «Чревоугодие ок»; он лежит в <code>SP-0157</code> как версия 2. Из этого следует, что «ок» — не «способности нет», а согласие с декабрьским разбором, а перестановка поглощения 24 января — возврат к декабрьскому распределению, где воровство было у Алчности, а поглощение у Чревоугодия. Сверять надо по <code>SP-0158</code> и <code>SP-0159</code> (декабрьская Алчность, 11 808), не по январским окнам.</p>\n<p>Остальное рядом: <code>SP-0170</code> «Поглощение» (статья есть, база 4 094, одна ссылка), <code>SP-0156</code> «Семь грехов (магия по грехам)» (11 757, статьи нет, ноль ссылок) — единственное место, где семёрка разбирается как задача.</p>\n<h3>Как развивалось</h3>\n<p>2024-12-24 — заявили: механика расписана Миколаем, Слава отвечает согласием в одно слово. 2025-01-23 — тот же текст выложен заново, теперь как готовая раскладка с уровнем силы для всей группы; при переносе от декабрьской механики не пошло ничего, осталось «Чревоугодие ок». 2025-01-24, на следующие сутки — ограничили до пометки: в каталоге за Чревоугодием встало «поглощения», у Алчности вместо поглощения — «всё моей»; причина перестановки не проговорена, обсуждение закрыто репликой «Ну да». 2025-02-25 — блок воспроизведён дословно, без правок. Всё содержательное движение по персонажу уложилось в одни сутки и состояло в переносе пометки между двумя строками списка.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>В перечне от 2025-01-23 у двух способностей ограничение названо словом: «Контроль разума с ограничением» у Похоти, «Слово закон с ограничением» у Гордыни. У Чревоугодия и у Алчности — двух способностей, которые обе про изъятие чужого, — слово «ограничение» не стоит ни разу. Вопрос «чего нельзя забрать» ровно того же рода, что «чего нельзя приказать», и для одной группы способностей он поставлен, а для другой нет.</p>\n<h3>Отклик</h3>\n<p>Забавно, что это единственный грех, о котором Слава за все три даты не сказал ни одной собственной фразы: сначала «ок», потом перестановка пометки, потом «Ну да». И он же — единственный, чья способность в итоге осталась ровно такой, какой её придумали в декабре: остальным Слава что-нибудь да переписал, а здесь переписывать было нечего, потому что он и не возражал. Молчание сработало как сохранность. Дальше это вышло боком: статья теперь стоит на слове «ок» и честно пишет, что механики нет, — хотя механика есть, просто она в чужой записи и за месяц до того дня, который здесь считается первым.</p></div>", "r": []}];</script>
