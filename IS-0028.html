<script>const BASE="";const DOCNAME="Хоррор с организацией";
const LEAD="";
const CH=[{"t": "Содержание", "a": ["S01", "IS-0028-S01", "IS-0028--soderzhanie"], "h": "<p>Замысел, объявленный Славой одной фразой: «Вообще я хотел создать хоррор с организаций» (2024-11-09, id 255003). Дальше в том же разговоре замысел сразу упирается в устройство сил: «Ну и снова все упирается в систему сил» (id 255005). Слово «снова» указывает, что это повторяющаяся точка затыка, но на что именно оно ссылается раньше — в переписке не сказано.</p>\n<p>Изначальная конструкция изложена одним сообщением (id 255014):</p>\n<div class=\"q\"><p>«Изначально я хотел чтобы монстры появлялись из других миров<br>Которых миллиарды и который делаются на черной белый и серый<br>И вот монстры из черного мира к нам полжуть<br>И люде из нашего мира могут черпать силу из другого мира ( черный маг белый маг серый маг)»</p></div>\n<p>То есть: миров миллиарды, они делятся на чёрные, белые и серые; монстры лезут к людям из чёрного мира; люди своего мира черпают силу из другого мира и по источнику силы называются чёрными, белыми и серыми магами. Отсюда же следует уникальность способностей: «И способности у них всех уникальный так как они черпать силы из разных миллиардом миров» (id 255021) — уникальность обоснована количеством миров-источников, а не чем-то ещё.</p>\n<p>Тут же автор сам фиксирует расхождение замысла и результата: «Сама задумка вроде не плохая но это снова из хоррора превращается в боевик» (id 255022). Миколай отвечает, что хоррор из такого сделать можно, но с потерей: «ну по идее можно и из такого сделать хоррор» / «просто это всё утратит основную идею» (id 255023–255024). Какая именно идея имеется в виду — основная идея хоррора или основная идея славиной конструкции — в переписке не уточнено. Слава соглашается с оговоркой: «Да только мало обещающий» (id 255025).</p>\n<p>Вторая заявленная помеха хоррору — роль главного героя: «И во все у меня в этих мирах гг вообще защитник» (id 255026). Сразу предлагается альтернативный персонаж: «Ну или другой перс который пытается все выкинуть на своем горбу и всегда когда сложно улыбается и пытается подбодрить всех но сам трясется в ужасе» (id 255029).</p>\n<p>В ответ на проблему «как сделать из этого страшно» Миколай выкладывает формулу страха (id 255030), после чего дважды выделяет из неё нужные строки:</p>\n<ul>\n<li>«Угроза + Неопределенность + Отсутствие контроля = Страх» (id 255033)</li>\n<li>«Осознание неизбежности + Чувство беспомощности = Ужас» (id 255041)</li>\n</ul>\n<p>И вычленяет рабочий элемент: «беспомощность» / «вот оно» (id 255043–255044).</p>\n<p>Параллельно Слава добавляет в ту же вселенную два объекта: «Да и в плюсом в этой вселенной существует озеро перерождения ( который превращает монстра )» (id 255042) и «Ну или ещё камень желаний» (id 255047).</p>\n<p>Разговор замыкается на столкновении «защитник» и «беспомощность»: «Защитник да ещё и беспомощный 😂» (id 255048) — сказано как насмешка над сочетанием. Миколай на это отвечает: «слава» / «это че такое» / «ты творчеством занимаешься или где» (id 255049–255051), Слава уступает: «Ладно ладно можно его запихнуть» (id 255052), и Миколай формулирует принцип: «как раз таки творчество это сочетание несочетаемого» (id 255053). Тем самым беспомощный защитник из шутки переводится в допустимый вариант, но дальше 2024-11-09 в переписке не продолжен.</p>", "r": []}, {"t": "Персонажи", "a": ["S02", "IS-0028-S02", "IS-0028--personazhi"], "h": "<ul>\n<li><strong>ГГ-защитник</strong> — главный герой заявленной вселенной. О нём сказано только «И во все у меня в этих мирах гг вообще защитник» (id 255026); подан как препятствие для хоррора. К концу разговора к нему пристёгивается беспомощность.</li>\n<li><strong>Персонаж, который тащит всё на себе</strong> — предложен как замена или дополнение ГГ: «пытается все выкинуть на своем горбу и всегда когда сложно улыбается и пытается подбодрить всех но сам трясется в ужасе» (id 255029). Имени нет, отдельно не разрабатывался.</li>\n<li><strong>Чёрные, белые и серые маги</strong> — люди своего мира, черпающие силу из другого мира; названы только категорией, конкретных носителей в этом разговоре нет.</li>\n<li><strong>Монстры</strong> — приходят из чёрного мира («монстры из черного мира к нам полжуть», id 255014). Никак больше не описаны.</li>\n</ul>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "IS-0028-S03", "IS-0028--mesto-vo-vselennoy"], "h": "<p>Разговор относится ко вселенной «монстры» (по дате объявления). Из него разворачивается связка сущностей, которые дальше существуют самостоятельно: Чёрный, белый и серый миры; Чёрный маг / белый маг / серый маг; ГГ-защитник; Формула страха. Здесь же, в этом разговоре, впервые названы озеро перерождения (превращает монстра) и камень желаний — оба брошены одной фразой без разработки.</p>\n<p>Замысел устроен так, что жанр («хоррор с организацией») и система сил лежат на одном и том же материале и мешают друг другу: система сил тянет в боевик, хоррор требует беспомощности. Организация, вынесенная в само название замысла, в переписке дальше ни разу не упомянута — что это за организация, чем занимается и на чьей стороне, не сказано.</p>", "r": []}, {"t": "Состояние", "a": ["S04", "IS-0028-S04", "IS-0028--sostoyanie"], "h": "<p>Одна версия, один вечер: 2024-11-09, 23:38–23:48, окно w0063, id 255001–255053. Замысел объявлен, разобран на составляющие и оставлен на том, что беспомощного защитника «можно запихнуть». Ни отказа от замысла, ни продолжения в переписке нет. Отдельные части (миры, маги, формула страха) дальше живут как самостоятельные сущности, сам «хоррор с организацией» как история не написан.</p>\n<p>Зафиксированное самим автором изменение внутри разговора: заявлено как хоррор — по ходу описания системы сил превращается в боевик («это снова из хоррора превращается в боевик», id 255022). Отдельным вариантом, признанным малоперспективным, остаётся возвращение в хоррор поверх этой же системы («Да только мало обещающий», id 255025).</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "IS-0028-S05", "IS-0028--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Организация из названия замысла не описана вообще: ни состава, ни задач, ни отношения к монстрам и магам.</li>\n<li>Не сказано, что означает «снова» в «снова все упирается в систему сил» — к каким прежним попыткам это отсылает.</li>\n<li>Не уточнено, какая «основная идея» утратится при переделке в хоррор (id 255024).</li>\n<li>Не решено, ГГ-защитник и «перс, который всё тащит на своём горбу» — один персонаж или два.</li>\n<li>Не сказано, как беспомощность совмещается с ролью защитника практически: принцип «сочетание несочетаемого» назван, применение не показано.</li>\n<li>Озеро перерождения и камень желаний названы, но их устройство, расположение и роль в замысле не описаны; про озеро сказано только «который превращает монстра».</li>\n<li>Не объяснено, как именно люди черпают силу из другого мира и почему миров именно «миллиарды».</li>\n<li>Название вселенной в самом чате не прозвучало (пометка окна w0063).</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["IS-0028--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0045.html\">Чёрные, белые и серые маги</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["IS-0028--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-11-09</td>\n<td>255001–255053</td>\n<td>w0063</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/istorii/IS-0028-horror-s-organizaciey.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["IS-0028--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/IS-0028.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
