<script>const BASE="";const DOCNAME="Семья Бэлут";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0334-S01", "PS-0334--proishozhdenie"], "h": "<p>Семья Бэлут появляется в прозаическом тексте Славы «Фанатик (обычный мир)» (2025-12-14, id 397759–397761, окно w0113) — том же, где вводится черноволосая служанка (<a href=\"PS-0335.html\">Черноволосая служанка</a>). Это семья, в тело старшего сына которой попал герой из обычного мира. Сам он о ней ничего не знает: «Да и семья Бэлут, что-то не припоминаю».</p>\n<p>Состав герой узнаёт от служанки:</p>\n<div class=\"q\"><p>— Граф Эдгар Бэлут ваш отец и графиня Виктория Бэлут ваша мачеха....<br>— у вас также есть младший брат и младшая сестра от графине Виктории</p></div>\n<p>Реакция гг на слово «мачеха» — «Что мачеха. Я прочитал достаточно рассказов, чтобы понимать мачеха не сулит ничего хорошего» и «Это плоха, очень плоха. Мне не хотелось устраивать политическую борьбу».</p>\n<p>Состав семьи на момент записанной части:</p>\n<ul>\n<li><strong>Эдгар Бэлут</strong> — граф, отец Диониса.</li>\n<li><strong>Виктория Бэлут</strong> — графиня, мачеха Диониса, мать Лукаса и Алисы.</li>\n<li><strong>Дионис Бэлут</strong> — старший сын графа, 23 года, тело, в котором оказался гг.</li>\n<li><strong>Лукас</strong> — младший брат, 10 лет.</li>\n<li><strong>Алиса</strong> — младшая сестра, 7 лет.</li>\n</ul>\n<p>Имена младших названы не сразу: сначала они появляются как «два черноволосых детеныша», потом «Лукас. Так звали моего младшего брата» и «Алиса. Моя младшая сестра».</p>\n<p>Отдельно от семьи, но при ней: главный дворецкий. По правилам дома «на ужине присутствует только члены семьи и главный дворецкий, с несколькими своими приближёнными».</p>", "r": [["Черноволосая служанка", "PS-0335.html"]]}, {"t": "Внешность", "a": ["S02", "PS-0334-S02", "PS-0334--vneshnost"], "h": "<p><strong>Граф Эдгар.</strong> Описан через сходство с телом гг: «Второе что меня привлекло был граф. Моя копия, ну или я его копия. Как я только в разы крупней и с более суровым лицом, ну и с барадишкой». Глаза красные — «спросил граф поглядывая на меня своими краснаии глазами». (У самого Диониса, каким гг увидел его в зеркале: чёрные волосы с сединой, острые черты лица, измученные красные глаза.)</p>\n<p><strong>Графиня Виктория.</strong> «Женщина рядом с графом. С шелковистыми и зелёными волосами. Пристойно смотрела на меня».</p>\n<p><strong>Лукас.</strong> Черноволосый, «с ярко зелёными словно нефрит глазами». В тексте он назван «черноволосый мужчина», хотя тут же сказано, что ему 10 лет: «уж не думал, что первым это скажет 10 летний ребенок».</p>\n<p><strong>Алиса.</strong> «черноволосая и красноглазая девочка 7 лет», «резкий детский голосок с боку».</p>\n<p>Цвет волос и глаз распределён так: чёрные волосы у Диониса, Лукаса и Алисы; красные глаза у графа, Диониса и Алисы; зелёное — у Виктории (волосы) и Лукаса (глаза).</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0334-S03", "PS-0334--harakter"], "h": "<p><strong>Граф Эдгар.</strong> Молчит, пока не заговорит первым по делу. Следит за состоянием сына: узнав от служанки через дворецкого, что у Диониса «за долгое время хорошее настроение», потребовал его присутствия на ужине. За столом: «сегодня у тебя на удивление хорошое настроение Дионис. Произошло, что-то хорошое?». На заявление о «духовном рождении» и о пути — наблюдении за событиями, «что изменят историю», — реагирует переспросом «наблюдать?» и хмурится; после ответа «да наблюдать. Ну и возможно немного контралировать, чтобы события были именно таким, каким должны быть» — «Граф же перестал хмурится то ли от вина, то ли от моих слов. А после случилась чудо. Он слегка улыбнулся продолжая есть». Улыбка отмечена гг как «чудо».</p>\n<p><strong>Графиня Виктория.</strong> Держит служанку Диониса при себе (см. <a href=\"PS-0335.html\">Черноволосая служанка</a>). За столом сначала проявляет интерес — «духовное рождение?», — но на разъяснение про путь «Лицо графини слегка стало холодным и напряженым». Требует от Диониса неформального обращения: «-графиня - повторил Виктория - Дионис зачем такие формальности за обеденным столом-. Сказала она строго смотря на меня». На заменяющее его «хорошо мачеха» — «Лицо Виктории нухмурилась и стало еще грубее».</p>\n<p><strong>Лукас.</strong> Первым замечает подмену поведения: «кстати Старший брат , а ты себя хорошое чувствуешь. А то ты сегодня странно себя ведешь» и дальше «я слышал, что существует несколько болезней, что искажают восприятия». Без колебаний кладёт руку на ладонь гг, когда тот просит. Стесняясь, спрашивает про обращение к матери: «а почему ты маму, мачехой назвал?», «ну ты Эм.... Никогда раньше её так не называл». Заканчивает разговор словами «мама наверное очень сильно расстроилась».</p>\n<p><strong>Алиса.</strong> Требует того же, что и брату: «и мою руку». На прикосновение «по детски захихикала». Настойчиво поддакивает: «Да Да ты никогда не называл маму мачехой!!», и объясняет с гордостью: «Нет Нет... Ты маму называл мамой» — «сказал Алиса ярко улыбаясь. Словно ответила на сложнейшие вопрос».</p>\n<p>Общее свойство сцены с младшими: они на гг не злятся и не боятся его. Прикосновение к ним — то, чем гг проверяет реальность мира: «Тепло. Думаю этого должно хватить чтобы понять. Даже если это все нереально, зато чувство здесь реальны. Ранее я никого здесь не касался. Да и на моих руках всегда были белоснежные перчатки».</p>", "r": [["Черноволосая служанка", "PS-0335.html"]]}, {"t": "Связи с другими", "a": ["S04", "PS-0334-S04", "PS-0334--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Дионис Бэлут</strong> — старший сын графа от первой жены (первая жена в тексте не упоминается вовсе, сказано только, что Виктория — мачеха). Настоящий, «прежний» Дионис в записанной части не показан; о нём известно только через чужие реакции: у него редко бывает хорошее настроение, он ведёт себя иначе, и — ключевое — он звал Викторию мамой: «да старший брат. Ты маму всегда называл мамой. Иногда матушкой или матерью». Реакция гг на это: «\"Чё\" Единственное мысль. Это какое новый способ контроля».</li>\n<li><strong>Черноволосая служанка</strong> (<a href=\"PS-0335.html\">Черноволосая служанка</a>) — формально служанка Диониса, на деле служит графине Виктории; через неё и главного дворецкого сведения о Дионисе идут к графу.</li>\n<li><strong>Главный дворецкий</strong> — присутствует на семейном ужине с приближёнными; гг принял его за библиотекаря.</li>\n<li><strong>Королевство Пиор</strong> — государство, в котором стоит особняк; его историю в упрощённом виде гг излагает служанка.</li>\n</ul>", "r": [["Черноволосая служанка", "PS-0335.html"]]}, {"t": "Дом", "a": ["S05", "PS-0334-S05", "PS-0334--dom"], "h": "<p>Особняк описан как лабиринт: «этот идиотский коридор с множеств дверей, когда нибудь закончится?», «снова идти по этому лабиринту называемая особняком, до тошноты не хотелось». Внутри — библиотека, кухня, «пара залов», сад с фарфоровой скульптурой. Интерьер: «Сам интерьер, здесь как и ожидалось был средневековым. Разные узоры, где попало и не экономия пространства». Единственное, что гг понравилось: «Невероятная мягкий ковры». Комната Диониса — тёмная («Темная комнатушка»), окон в описании нет, коридоры при этом «светлые... с большими окнами». Обеденный зал — за «большой дверью украшенный золотыми узорами».</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0334-S06", "PS-0334--kak-menyalsya"], "h": "<p>Обе версии — 2025-12-14, окно w0113; это последовательные куски одного текста, а не переработка.</p>\n<p><strong>Версия 1 (id 397759).</strong> Семья существует только как перечень со слов служанки: отец-граф Эдгар, мачеха-графиня Виктория, младшие брат и сестра от неё. Имена младших не названы, внешность не описана, ни один член семьи не показан лично.</p>\n<p><strong>Версия 2 (id 397760–397761).</strong> Сцена ужина и разговор в коридоре: внешность графа, графини, Лукаса и Алисы; реакция графа на «духовное рождение» и его улыбка; требование Виктории не звать её графиней за столом и её раздражение на «мачеху»; имена и возраст младших; сведение о том, что прежний Дионис звал Викторию мамой.</p>\n<p>Текст обрывается на реплике Лукаса «мама наверное очень сильно расстроилась».</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0334-S07", "PS-0334--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Первая жена графа, мать Диониса, не упомянута ни разу — ни имени, ни того, что с ней стало.</li>\n<li>Отношение семьи к Дионису до подмены прямо не изложено: гг шёл на ужин именно для того, чтобы «узнать отношения семьи Диониса к нему», но в записанной части оценка так и не сформулирована.</li>\n<li>Почему Виктория раздражается на «мачеху» — злоба, обида или что-то ещё — не сказано; гг сам этого не понял: «Да что не так-то».</li>\n<li>Что стоит за фразой прежнего Диониса «мамой, иногда матушкой или матерью» — искренность или, как предполагает гг, «новый способ контроля» — осталось нерешённым.</li>\n<li>Титул, владения, положение семьи в королевстве Пиор не названы.</li>\n<li>Имя главного дворецкого и его приближённых не названо.</li>\n<li>Возраст графа и графини не назван; из младших возраст указан у обоих (10 и 7), у Диониса — 23.</li>\n<li>Обсуждения семьи между соавторами в переписке нет: только проза Славы.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0334--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0335.html\">Черноволосая служанка</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0335.html\">Черноволосая служанка</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0081.html\">Семья Бэлут</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0334--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-12-14</td>\n<td>397759–397759</td>\n<td>w0113</td>\n<td>Феня (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-14</td>\n<td>397760–397761</td>\n<td>w0113</td>\n<td>Феня (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0334-semya-belut.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0334--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0334.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
