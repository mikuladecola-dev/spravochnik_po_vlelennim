<script>const BASE="";const DOCNAME="Сестра имитатора";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0215-S01", "PS-0215--proishozhdenie"], "h": "<p>Сестра имитатора — персонаж вселенной «Апостол», проходящий в переписке также просто как «Сестра» и как «сестра благословенная правителем Кильке». Обсуждалась в двух окнах: 2025-03-06 (id 298826–298841, окно w0079) и 2025-08-30 (id 359684–359691, окно w0103).</p>\n<p>Её сила — благословение, данное правителем Кильке: «Есть сестра благословенная правителем Кильке» (id 359684).</p>\n<p>Чья именно она сестра — в переписке не сказано; имя, кроме «сестра», не названо.</p>", "r": []}, {"t": "Способности", "a": ["S02", "PS-0215-S02", "PS-0215--sposobnosti"], "h": "<p>Прямых описаний способности нет. Уровень задан сравнением: «Да она сильнее одного апостола. Но дальше че. Это не та сила, что поставит на колени весь мир» (id 359684).</p>", "r": []}, {"t": "Связи с другими", "a": ["S03", "PS-0215-S03", "PS-0215--svyazi-s-drugimi"], "h": "<p><strong>Правитель Кильке.</strong> Источник её благословения. В первой версии цель объединения миров приписывалась именно правителю: «конечно главным будет Килька, таким образом наш правитель хочет иметь контроль над другими мирами» (id 298826). Позже Слава переносит роль на сестру.</p>\n<p><strong>Имитатор.</strong> Присутствует только в самом имени персонажа — «сестра имитатора». Родство в переписке не раскрывается.</p>\n<p><strong>Подручные сестры.</strong> Её группировка. Оценка Славы: «А её подручный всё слабее апостолов. Каждый из них один на один против апостолов продует. При этом у них не такая большая группировка» (id 359684).</p>\n<p><strong>Апостолы.</strong> Противостоящая сторона. По плану на конец истории: «В конце всё истории и в последнее битве апостолы продуют. Большинство апостолов сдохнуть» (id 359691).</p>\n<p><strong>Серафим.</strong> Рассматривался как злодейская сила, но отвергнут: «Есть Серафим. Но это одноразовый босс. Что появится, когда будет война с раем» (id 359686).</p>", "r": []}, {"t": "Как менялся", "a": ["S04", "PS-0215-S04", "PS-0215--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2025-03-06 (id 298826–298841, окно w0079).</strong></p>\n<p>Начальная постановка от Славы: «Цель главного злодея объединить всё миры в один, конечно главным будет Килька, таким образом наш правитель хочет иметь контроль над другими мирами». Тут же зафиксирован незакрытый вопрос о её мотиве: «А зачем это сестре имитатора, не знаю но придумаю» (id 298826).</p>\n<p>Главным для Славы на этом этапе был не мотив, а препятствия: «Главным вопрос является, препятствия достижения этой цели, что им надо, что это был за артефакт у агрегата и зачем им благословенный Фениксом» (id 298826).</p>\n<p>Ответ Миколая на препятствия: «ну как минимум это независимость других миров и конкуренция» (id 298827). Там же он предложил сырые трактовки двух названных пунктов:</p>\n<ul>\n<li>Артефакт — «по типу медиатора позволял менять натяжение струн пространства всех миров»; «если играть на правильной частоте то например он мог на увеличенной площади или на далеком расстоянии использовать свою способность передовая по волне струны»; «если этот артефакт использует правитель или может использовать его через какую-то установку можно воздействовать на струнную связь между мирами». Сам он пометил это как заготовку: «я даю щас сырую идею, но я думаю это можно интересно доработать, если нет объясни».</li>\n<li>Благословлённый Фениксом — «имеет способность создавать на вечность большое количество пламени, что можно либо как топливо использовать либо для того чтобы нагреть стены, расшевелить и сделать больше похожими на частицы».</li>\n</ul>\n<p>Оценка Славы: «Да сырая идея, ну можно отталкиваться. Ну нужно ещё препятствия» (id 298834).</p>\n<p>Ключевая правка этого окна — перенос роли объединителя с правителя на сестру: «И вообще мир будет объединять сестра имитатора, а не правитель» (id 298834). Миколай принял правку: «а», «сестра», «пон» (id 298836–298838).</p>\n<p>Дальше Слава ставит открытые вопросы про обряд объединения: «Что им ещё нужно», «Может какие артефакты», «Что нужно для этого обряда», и задаёт объём: «Нужно хотя бы 16 вещей так как сюжет должен быть длинным» (id 298835, 298839–298841). Состав этих шестнадцати вещей в окне не назван.</p>\n<p><strong>Версия 2 — 2025-08-30 (id 359684–359691, окно w0103).</strong></p>\n<p>Слава пересматривает достаточность сестры как злодея. Исходное состояние: сильнее одного апостола, подручные слабее апостолов и проигрывают один на один, группировка небольшая (id 359684). Вывод: «Нужен злодей» (id 359685).</p>\n<p>Перебираются и отбрасываются замены:</p>\n<ul>\n<li>Серафим — «одноразовый босс. Что появится, когда будет война с раем» (id 359686).</li>\n<li>Существа из рая — «я могу запихать разных существ из рая и устроить месива. Но существа из рая не подходят на злодеев. Во первых нет так таковой цели, кроме мести. Во вторых не какой группироаонной работы не будет их же в разный места раскидает» (id 359687).</li>\n</ul>\n<p>Итоговое решение: сестра остаётся на своём месте, а усиливается её команда. «Нет сестра так и останется ключевым злодеем. Но кто в её команде должен быть настолько сильном что перевернёт хот битвы» (id 359688).</p>\n<p>Требование к этой недостающей силе задано через финал: «В конце всё истории и в последнее битве апостолы продуют. Большинство апостолов сдохнуть. Поэтому нужна сила что позволит это сделать» (id 359691).</p>\n<p>Кто именно закрывает эту роль — в окне не решено.</p>\n<p><strong>Версия 3 — 2025-11-17 (id 385768, окно w0109) и 2025-12-06 (id 393287, 393313, окно w0112): переназначение в дочь Имитатора.</strong></p>\n<p>Как «сестра» персонаж дальше не развивается. В перечне организаций мира Оам она возвращается уже с новой ролью: «Группировка сестры ( который теперь будет дочерью Имитатора. И я не знаю какие у неё будет цель)» (id 385768; то же сообщение переслано 2025-12-06, id 393287). Подтверждение через три недели: «Сестра, ну теперь дочь имитатора (Имита). В вселенной правителя её целью было объединить миры и вызвать Апокалипсис. У неё даже есть своя группа злодеев. Ну теперь я не знаю какая у неё цель в мире Оэм» (id 393313).</p>\n<p>То есть «сестра» и «дочь Имитатора» — один и тот же персонаж на разных этапах, а не два родственника. При переносе сохранены прежняя цель (объединение миров) и собственная группировка; родство переопределено, цель в новом мире не придумана. Почему сестру сделали дочерью — в переписке не сказано.</p>", "r": []}, {"t": "Что с ней стало", "a": ["S05", "PS-0215-S05", "PS-0215--chto-s-ney-stalo"], "h": "<p>В роли сестры линия обрывается на 2025-08-30 нерешённым вопросом об усилении её команды. Дальше та же фигура продолжается в мире Оам как дочь Имитатора — <a href=\"PS-0324.html\">Дочь Имитатора</a> (безымянная, 2025-12-06) и <a href=\"PS-0375.html\">Доима (дочь Имета)</a> (Доима, 2026-06-07).</p>", "r": [["Дочь Имитатора", "PS-0324.html"], ["Доима (дочь Имета)", "PS-0375.html"]]}, {"t": "Пробелы", "a": ["S06", "PS-0215-S06", "PS-0215--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Мотив: зачем сестре объединять миры — Слава прямо пишет, что не знает: «А зачем это сестре имитатора, не знаю но придумаю» (id 298826). В окне w0103 к вопросу не возвращаются.</li>\n<li>Имени, кроме «сестра», нет; чья она сестра — не сказано. Связь с имитатором держится только на имени персонажа.</li>\n<li>Внешность не описана.</li>\n<li>Характер не описан.</li>\n<li>Конкретная способность, данная благословением Кильке, не названа — уровень задан только сравнением с апостолом.</li>\n<li>Обряд объединения миров: набор из «хотя бы 16 вещей» объявлен по объёму, но состав не назван.</li>\n<li>Персонаж, который должен войти в команду сестры и «перевернёт хот битвы», на 2025-08-30 не придуман — вопрос остался нерешённым.</li>\n<li>Что с ней стало по итогу истории — не сказано; описан только исход последней битвы для апостолов.</li>\n<li>Переход «сестра → дочь Имитатора» (id 385768, 393313) не объяснён: почему родство переопределено и кем она была для Имитатора раньше — не сформулировано.</li>\n<li>Есть ли у Имитатора настоящая сестра, отдельная от этого персонажа, — в переписке не сказано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0215--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0007.html\">Команда (подручные) сестры</a>, <a href=\"GR-0013.html\">Благословенные</a></li>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0324.html\">Дочь Имитатора</a>, <a href=\"PS-0375.html\">Доима (дочь Имета)</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0324.html\">Дочь Имитатора</a>, <a href=\"PS-0383.html\">Имитатор</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0007.html\">Команда (подручные) сестры</a>, <a href=\"GR-0013.html\">Благословенные</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0215--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-03-06</td>\n<td>298826–298841</td>\n<td>w0079</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-08-30</td>\n<td>359684–359691</td>\n<td>w0103</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0215-sestra-imitatora.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0215--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0215.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0215-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0215/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — хвост линии. <code>PS-0375</code> «Доима (дочь Имета)»: три ссылки, база 9 036, статьи нет, вселенная помечена «неясно». Это тот самый персонаж, в которого сестра превращается после переноса, и статья сама помечает ссылку как «статьи ещё нет». Три входящих ссылки при отсутствующей статье — здесь это самая дорогая дыра: <code>PS-0215</code> обрывается на 2025-08-30 нерешённым вопросом, <code>PS-0324</code> «Дочь Имитатора» (две ссылки, статья есть, 9 403) подхватывает середину, а конец линии лежит в <code>PS-0375</code> без статьи и без вселенной. Три записи об одной фигуре, из которых последняя не собрана.</p>\n<p>Второе — группировка, и там та же картина втроём. <code>GR-0007</code> «Команда (подручные) сестры» (статья есть), <code>PS-0289</code> «Подручные сестры» (одна ссылка, статья есть, 3 008) и <code>MR-0170</code> «Группировка сестры» (Оам, 4 292, статьи нет, ссылок ноль). Пробел «персонаж, который перевернёт ход битвы, не придуман» проверяется по всем трём сразу, а третья из них до справочника не дошла.</p>\n<p>Третье, дешёвое и точечное: «хотя бы 16 вещей» для обряда объединения. Состав в окне не назван, но категория в базе есть — <code>IS-0036</code> «Цель злодеев: объединение всех миров» (одна ссылка, статья есть, база 11 288) и <code>MR-0115</code> «Механизм объединения миров» (статья есть, 2 584, ноль ссылок). Из <code>PS-0215</code> на них не ссылаются, хотя цель персонажа — ровно это.</p>\n<h3>С чего начать</h3>\n<p>База, три адреса.</p>\n<p>Мотив и обряд: <code>IS-0036</code> (11 288) и <code>MR-0115</code> (2 584). Если шестнадцать вещей где-то перечислены хотя бы частично, они там. Туда же <code>SP-0192</code> «Артефакт-медиатор» (4 954, статья есть, ноль ссылок) — сырая версия Миколая заведена отдельной сущностью, и <code>PS-0214</code> «Благословлённый Фениксом» (6 253, статья 7 801, одна ссылка) — второй из двух пунктов, которые Слава назвал главными вопросами в id 298826. Оба пункта в статье помечены как сырые, но записи под них уже есть.</p>\n<p>Источник силы: <code>PS-0217</code> Правитель Кильки (14 203, статья 17 189) и <code>MR-0207</code> Килька. Прежде чем писать, что конкретная способность не названа, эти записи надо прочесть целиком — там материала на порядок больше, чем в двух окнах, по которым собрана статья.</p>\n<p>Финал: <code>IS-0067</code> «Финальная битва и гибель апостолов» (одна ссылка, статья есть, база 1 945). Требование к недостающей силе задано именно через этот финал, и он заведён отдельно.</p>\n<p>В архив — за переходом «сестра → дочь». Окна w0109 (2025-11-17, id 385768) и w0112 (2025-12-06, id 393287, 393313) статья уже цитирует, но объяснения там нет; смотреть надо не сами эти сообщения, а то, что вокруг них — переучёт вселенной Оам шёл сплошным списком организаций, и переопределение родства могло проговариваться при разборе других пунктов того же списка. Второй ориентир — 2026-06-07, id 488439 и 488545: там Доима уже существует как дочь Имета, и Нимб захватывает беременную от Имета женщину. Если у переопределения есть причина, она скорее там, чем в ноябре.</p>\n<h3>Как развивалось</h3>\n<p>2025-03-06 — заявили: цель объединить миры, и тут же ключевая правка — объединять будет не правитель, а сестра. Мотив в ту же минуту помечен как отсутствующий: «А зачем это сестре имитатора, не знаю но придумаю». 2025-08-30 — ограничили, и ограничение оказалось ревизией: сильнее одного апостола, но «это не та сила, что поставит на колени весь мир», подручные проигрывают один на один, группировка небольшая. Забыли ровно то, что было помечено как «придумаю»: между мартом и августом почти шесть месяцев, и в августовском окне к мотиву не возвращаются ни разу — обсуждают только, кого добавить в команду. Вернулись 2025-11-17 и 2025-12-06, но вернулись к другой фигуре: сестра переназначена в дочь Имитатора, группировка и цель объединения перенесены, а вопрос цели обнулён заново — «Ну теперь я не знаю какая у неё цель в мире Оэм».</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для сестры источник силы назван прямо и с адресом: «Есть сестра благословенная правителем Кильке». Для её подручных задан уровень — «А её подручный всё слабее апостолов. Каждый из них один на один против апостолов продует», — то есть их меряют той же шкалой, что и благословенных, но откуда у них сила, кто их благословил и благословлены ли они вообще, не сказано. Правило «сила приходит от конкретного правителя» сформулировано для главы группировки и не сформулировано для тех, кого сравнивают по той же линейке.</p>\n<h3>Отклик</h3>\n<p>Зацепило, как быстро персонаж сдулся под собственной арифметикой. В марте это ещё замысел с размахом: объединить все миры, обряд, «нужно хотя бы 16 вещей так как сюжет должен быть длинным» — требование к сюжету, поставленное вперёд содержания, что само по себе примечательно: сначала объявлена длина, потом под неё ищутся вещи. А в августе тот же автор пересчитывает и получает «Да она сильнее одного апостола. Но дальше че». Пять месяцев, и главный злодей истории оказывается недостаточно сильным для собственного финала. И решение при этом принимается не в её пользу и не против неё — её оставляют на месте и ищут кого-нибудь помощнее ей в команду, то есть должность сохраняют, а функцию отдают. По-моему, это самый выразительный кусок в статье, выразительнее, чем переименование в дочь. Переименование — просто переезд, а вот «Но дальше че» — момент, когда автор смотрит на свою злодейку и видит цифру.</p></div>", "r": []}];</script>
