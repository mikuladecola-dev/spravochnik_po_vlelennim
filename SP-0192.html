<script>const BASE="";const DOCNAME="Артефакт-медиатор";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0192-S01", "SP-0192--mehanika"], "h": "<p>Артефакт, который был у агрегата. Работает по принципу медиатора: «артефакт по типу медиатора позволял менять натяжение струн пространства всех миров» (2025-03-06, id 298827).</p>\n<p>Из этого выводятся два режима применения, названные в одном сообщении Миколая:</p>\n<ol>\n<li><strong>В руках носителя способности.</strong> «если играть на правильной частоте то например он мог на увеличенной площади или на далеком расстоянии использовать свою способность передовая по волне струны». То есть артефакт не даёт своей способности, а разносит уже имеющуюся — по волне струны, на увеличенную площадь или на далёкое расстояние. Условие — правильная частота игры.</li>\n<li><strong>В руках правителя или через установку.</strong> «однако, если этот артефакт использует правитель или может использовать его через какую-то установку можно воздействовать на струнную связь между мирами». Здесь предмет воздействия — не пространство одного мира, а связь между мирами.</li>\n</ol>\n<p>Сам автор помечает описание как незаконченное: «придумаем что он мог делать с помощью этого» и «я даю щас сырую идею, но я думаю это можно интересно доработать, если нет объясни» (id 298827).</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0192-S02", "SP-0192--ogranicheniya-i-cena"], "h": "<p>Цена применения не названа. Единственное названное условие работы — попадание в частоту: эффект возникает, «если играть на правильной частоте». Что происходит при неправильной, в переписке не сказано.</p>\n<p>Второй режим (воздействие на струнную связь между мирами) обусловлен носителем или оснасткой: он привязан либо к правителю, либо к «какой-то установке», состав и устройство которой не назван.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0192-S03", "SP-0192--nositeli"], "h": "<ul>\n<li><strong>Агрегат</strong> — у него артефакт был; сам вопрос сформулирован Славой как «что это был за артефакт у агрегата» (id 298826). Артефакт числится частью агрегата.</li>\n<li><strong>Правитель</strong> — назван как возможный пользователь второго режима.</li>\n<li><strong>Установка</strong> — не носитель, а посредник: через неё артефактом можно воспользоваться. Что это за установка, не сказано.</li>\n</ul>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0192-S04", "SP-0192--kak-menyalas-po-versiyam"], "h": "<h3>Версия 1 — 2025-03-06, id 298826–298835</h3>\n<p>Единственная версия. Разговор начинается с постановки задачи от Славы (id 298826): цель главного злодея — объединить все миры в один, главным при этом будет Килька, «таким образом наш правитель хочет иметь контроль над другими мирами». Мотив сестры имитатора на этот момент не придуман: «А зачем это сестре имитатора, не знаю но придумаю». Открытыми вопросами названы: препятствия достижению цели, что злодеям нужно, «что это был за артефакт у агрегата и зачем им благословенный Фениксом».</p>\n<p>Миколай отвечает по всем трём пунктам (id 298827). По препятствиям: «ну как минимум это независимость других миров и конкуренция». По артефакту — описание медиатора и двух режимов (см. «Механика»). По благословлённому Фениксом — см. «Связь с другими способностями».</p>\n<p>Слава принимает описание как рабочую основу, не снимая пометки о сырости: «Да сырая идея, ну можно отталкиваться» (id 298834). В том же сообщении он меняет ранее сказанное: «И вообще мир будет объединять сестра имитатора, а не правитель» — исполнитель объединения миров переносится с правителя на сестру имитатора. Как это соотносится со вторым режимом артефакта, где пользователем назван именно правитель, в переписке не оговорено.</p>\n<p>Заканчивается версия возвратом к незакрытому: «Ну нужно ещё препятствия», «Что им ещё нужно» (id 298834–298835). Дальше в окне артефакт не дорабатывается.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0192-S05", "SP-0192--svyaz-s-drugimi-sposobnostyami"], "h": "<ul>\n<li><strong>Способность благословлённого Фениксом.</strong> Названа в том же ответе Миколая, как часть плана злодеев: благословлённый Фениксом «имеет способность создавать на вечность большое количество пламени, что можно либо как топливо использовать либо для того чтобы нагреть стены, расшевелить и сделать больше похожими на частицы» (id 298827). Прямой связи с артефактом в тексте не проведено — оба нужны злодеям, но как они работают вместе, не сказано.</li>\n<li><strong>Цель злодеев: объединение всех миров</strong> — задача, ради которой артефакт понадобился.</li>\n<li><strong>Агрегат</strong> — предыдущий держатель артефакта; артефакт числится его частью.</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S06", "SP-0192-S06", "SP-0192--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Конкретный перечень действий артефакта не составлен: «придумаем что он мог делать с помощью этого» — так и осталось нерешённым.</li>\n<li>Не сказано, что такое «правильная частота» и как её находят.</li>\n<li>Установка, через которую артефакт может использовать правитель, не описана — состав не назван.</li>\n<li>Не сказано, как артефакт попал к агрегату и где он находится после.</li>\n<li>После смены исполнителя (объединяет сестра имитатора, а не правитель) привязка второго режима к правителю не пересмотрена — в переписке не сказано.</li>\n<li>Препятствия к цели злодеев остались незакрытым вопросом внутри того же разговора.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["SP-0192--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-03-06</td>\n<td>298826–298835</td>\n<td>w0079</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0192-artefakt-mediator.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0192--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0192.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["SP-0192-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/SP-0192/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первой чинить не артефакт, а сестру имитатора. <code>PS-0215</code>: статья есть, но материала в базе всего 7.9 КБ при четырёх ссылках — на неё опираются <code>PS-0217</code> «Правитель Кильки», <code>PS-0214</code> «Благословлённый Фениксом», <code>PS-0289</code> «Подручные сестры», <code>PS-0324</code> «Дочь Имитатора». Для сравнения: у агрегата <code>PS-0182</code> ссылок пять, но базы 13.8 КБ. То есть самая тонкая из востребованных записей — и именно на неё в этом же окне перевесили роль объединителя миров, а мотив при этом объявлен непридуманным. Пока мотива нет, второй режим артефакта (воздействие на струнную связь между мирами) висит без владельца: в тексте он привязан к правителю, а объединяет теперь не он.</p>\n<p>Вторая по цене — «установка», через которую артефакт может использовать правитель. Её нет вообще: ни статьи, ни записи в <code>blockers.json</code>, ни материала. Это единственный названный посредник второго режима, и он существует одной придаточной фразой.</p>\n<p>Третья дешевле и подождёт: <code>PS-0033</code> «Феникс» — статьи нет, базы 1.9 КБ, вселенная не определена, ссылается на него только <code>PS-0214</code>. Благословлённый Фениксом в этом окне идёт в паре с артефактом как второй инструмент злодеев, а источник его благословения нерасписан.</p>\n<h3>С чего начать</h3>\n<p>В базе. Под самой статьёй 5.0 КБ — это всё, что есть, добавить оттуда нечего. Но история артефакта почти наверняка разъехалась по двум записям об одном и том же лице: <code>PS-0182</code> «Агрегат» (13.8 КБ) и <code>PS-0223</code> «Дмитрий Рутковский („Агрегат“)» (21.9 КБ). Артефакт числится частью агрегата — откуда он у него и что с ним стало после, надо искать там, а не в архиве. Рядом же <code>IS-0036</code> «Цель злодеев: объединение всех миров» (11.3 КБ), <code>MR-0115</code> «Механизм объединения миров» (2.6 КБ) и <code>SP-0212</code> «артефакты апостолов» (2.1 КБ) — последняя тоже тонкая, но это единственное место, где артефакты разбираются как класс.</p>\n<p>В архив — за продолжением. Окно w0079, 2025-03-06, id 298826–298835 закрывается на возврате к незакрытому («Ну нужно ещё препятствия», «Что им ещё нужно»). Смотреть надо не внутри окна, а после него: возвращались ли к «придумаем что он мог делать с помощью этого» в следующих окнах марта 2025 и позже, когда сестра имитатора уже утверждена как исполнитель.</p>\n<h3>Как развивалось</h3>\n<p>Всё за один день, 2025-03-06, за десять сообщений. Слава ставит три вопроса, включая «что это был за артефакт у агрегата». Миколай отвечает описанием медиатора и сам маркирует его как сырьё: «придумаем что он мог делать с помощью этого». Слава принимает, не снимая пометки, и в том же сообщении переносит объединение миров с правителя на сестру имитатора — то есть подтверждает описание и одновременно выбивает из-под него названного пользователя. Разговор уходит на препятствия. К артефакту в окне не возвращаются.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для первого режима правило названо дважды: артефакт не даёт своей способности, а разносит уже имеющуюся, и работает это при попадании в правильную частоту. Для второго режима ни того, ни другого нет — не сказано, нужна ли правителю своя способность, которую артефакт разнесёт, и не сказано, обусловлен ли этот режим частотой тоже. Правило «артефакт усиливает чужое, а не производит своё» проговорено для носителя способности и не проговорено для правителя, хотя предмет один и тот же.</p>\n<h3>Отклик</h3>\n<p>Медиатор — удачно найденный предмет. Не жезл и не камень, а то, чем задают натяжение и частоту: инструмент, который сам ничего не звучит. Из этой одной аналогии сразу выпадают и механика (передавать по волне струны), и ограничение (нужно попасть в частоту), и разница масштабов — струны одного мира против струн между мирами. Хорошо, что статья сохранила обе реплики про сырость: «я даю щас сырую идею» и «Да сырая идея, ну можно отталкиваться». Без них это выглядело бы законом мира, а это пока договорённость двоих. Зацепило другое — что в одном и том же сообщении идея принимается и у неё меняется владелец, и никто этого не замечает. Такие места обычно и оказываются швом, по которому мир потом трещит.</p></div>", "r": []}];</script>
