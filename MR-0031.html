<script>const BASE="";const DOCNAME="Религия Асгарда";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0031-S01", "MR-0031--ustroystvo"], "h": "<p>Идеология острова Асгард (<a href=\"MR-0022.html\">Асгард</a>), сформулированная Славой дословно (2024-07-05, id 198018):</p>\n<div class=\"q\"><p>«Религия<br>Нам нужно истребить всех тех в кого вселился демон всех тех кого не понимает нашего бога мы должны очистить мир для спасения его»</p></div>\n<p>Два основания в одном: неверующий — это тот, в кого вселился демон, и тот, кто «не понимает нашего бога»; истребление подаётся как очищение мира ради его спасения.</p>\n<p>Быт острова расписан коротко и через отсутствие всего остального. Миколай: «не, я про то что там ни дачи нихуя», «вообще делать нечего» (id 197981–197982). Слава на это отвечает двумя словами: «Молиться» и «И работать» (id 197983–197984). Миколай сводит: «тупо молиться, хавать спать, срать» (id 197985).</p>", "r": [["Асгард", "MR-0022.html"]]}, {"t": "Население", "a": ["S02", "MR-0031-S02", "MR-0031--naselenie"], "h": "<p>Неверующих на острове не осталось: «Ну так там нет не верующих. Всех не верующих убили» (Слава, id 197979).</p>\n<p>Отдельная реплика Миколая касается способа, которым неверующие уходят: «тупо прыгаешь с нескольких километров на землёй, звучит весело» — «наверное все неверующие так рано или поздно делают» (id 197970–197971). Из чего именно прыгают и почему высота измеряется километрами, в приведённом фрагменте не поясняется.</p>\n<p>Церковная власть острова (<a href=\"MR-0032.html\">Церковная власть Асгарда</a>) на момент разговора сводится к числу и одной должности: «Сколько их будет. 3 достаточно или больше» — Миколай: «достаточно»; Слава: «1 точно главный священник то бишь святой отец» (id 198019–198022).</p>", "r": [["Церковная власть Асгарда", "MR-0032.html"]]}, {"t": "Место во вселенной", "a": ["S03", "MR-0031-S03", "MR-0031--mesto-vo-vselennoy"], "h": "<p>Часть Асгарда (<a href=\"MR-0022.html\">Асгард</a>) — это религия конкретного острова, а не общая для архипелага. В файле указаны связи с Асгардом (<a href=\"MR-0022.html\">Асгард</a>), защитником Асгарда (Избранным) (<a href=\"PS-0106.html\">Защитник Асгарда (Избранный)</a>), Параманом (<a href=\"PS-0116.html\">Параман</a>) и церковной властью Асгарда (<a href=\"MR-0032.html\">Церковная власть Асгарда</a>).</p>\n<p>Ключевая привязка — защитник острова. На этой вере он выращен: «Ну так его с детства приручили что все не верующий одержимы демонами и он их убивает и до сих пор является ребенком. Которым играют взрослый дяденкий» (Слава, id 197976). Религия здесь — механизм управления защитником, а не только вероучение жителей.</p>\n<p>Оценки сторон разошлись: Слава — «Кстати их него защитника жалко»; Миколай — «жалко их», «мне вот людей больше жалко» (id 197972–197975).</p>", "r": [["Защитник Асгарда (Избранный)", "PS-0106.html"], ["Параман", "PS-0116.html"], ["Асгард", "MR-0022.html"], ["Церковная власть Асгарда", "MR-0032.html"]]}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0031-S04", "MR-0031--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-07-05 (окно w0044, id 197970–197985).</strong> Первое проявление: на острове не осталось неверующих, всех убили; защитника с детства приучили, что все неверующие одержимы демонами, и он их убивает; он «до сих пор является ребенком», которым играют взрослые. На вопрос Миколая «а кто конкретно» Слава отвечает: «Не знаю. Надо придумать» (id 197978, 197980). Занятия на острове — молиться и работать.</p>\n<p><strong>Версия 2 — 2024-07-05 (окно w0044, id 198012–198022).</strong> Слава предлагает: «Давай займёмся религий», Миколай соглашается. Миколай ставит задачу: «надо бы ещё обозначить че за хуи им дёргают», «под кем он ходит» (id 198016–198017). В ответ Слава даёт дословную формулировку символа веры (см. «Устройство») и определяет численность церковной верхушки — три, из них один точно главный священник, «то бишь святой отец».</p>\n<p>Переходу к религии предшествует реплика Славы «Не знаю глупо кажется. Сильный челик да и курить» (id 198012); предмет этой реплики в приведённом фрагменте не назван.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0031-S05", "MR-0031--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Кто конкретно дёргает защитника за ниточки, в версии 1 не названо: «Не знаю. Надо придумать». В версии 2 определены только число (3) и одна роль — главный священник / святой отец; остальные двое не названы.</li>\n<li>Имя бога, обряды, устройство культа, происхождение вероучения в переписке не сказаны.</li>\n<li>Откуда прыгают неверующие «с нескольких километров» — не пояснено.</li>\n<li>Как связан Параман (<a href=\"PS-0116.html\">Параман</a>) с религией, в приведённых фрагментах переписки не сказано — связь стоит только в списке связей.</li>\n</ul></div>", "r": [["Параман", "PS-0116.html"]]}, {"t": "Связи — всё вместе", "a": ["MR-0031--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0106.html\">Защитник Асгарда (Избранный)</a>, <a href=\"PS-0116.html\">Параман</a></li>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0022.html\">Асгард</a>, <a href=\"MR-0032.html\">Церковная власть Асгарда</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0027.html\">Церковь Асгарда</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0031--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-05</td>\n<td>197970–197985</td>\n<td>w0044</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-05</td>\n<td>198012–198022</td>\n<td>w0044</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0031-religiya-asgarda.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0031--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0031.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
