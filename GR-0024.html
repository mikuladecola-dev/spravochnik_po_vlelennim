<script>const BASE="";const DOCNAME="Протобионты (сущности, дети правителей)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0024-S01", "GR-0024--chto-eto"], "h": "<p>Класс существ во вселенной «Апостол», введённый поверх уже существовавших классов. Слава начинает разговор перечислением того, что уже есть, и добавляет к списку новую позицию (2025-01-27, id 284852–284854):</p>\n<div class=\"q\"><p>«Есть Альфы есть грехи есть правитель»<br>«Будут ещё и сущность»<br>«Сущность это дети правитель. У каждого правитель есть выродок»</p></div>\n<p>Это не отдельный персонаж и не рубрика каталога: речь идёт именно о множестве однотипных существ, у каждого правителя — своё. Поимённого состава у группы нет.</p>\n<p>Название менялось. В январе 2025 они называются «сущности», а отдельный экземпляр — «выродок» правителя. В мае 2025 в общем описании правителей Слава даёт им другое имя (2025-05-31, id 331635): «У правителей есть дети, которых зовут Протобионты. Это субъект, который был создан именно правителем, а не из-за особенности мира». Миколай в переписке пишет вариант «пробионты» (2025-05-31, id 331656). Указания на то, что «сущности» и «протобионты» — это одно и то же под разными названиями, в переписке прямо нет; совпадает определение (дети правителей, по одному у каждого правителя) и порядок величины силы.</p>\n<p>Ключевой признак, отличающий их от прочих обитателей миров: способ появления. Протобионт «был создан именно правителем, а не из-за особенности мира» (2025-05-31, id 331635). То есть это не порождение мира, а прямое творение его хозяина.</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0024-S02", "GR-0024--sostav"], "h": "<p>Поимённого состава нет. В плановом файле группы список участников пуст, и в переписке ни один протобионт не назван по имени.</p>\n<p>Единственный индивидуализированный экземпляр — тот, что спит в Перимутском треугольнике (2025-01-27, id 284856): «И один из этих существ живёт и спит в перимутский треугольник». Имени, внешности и происхождения (чей именно это ребёнок) у него нет.</p>\n<p>Численность задана через правителей, и здесь у авторов расхождение:</p>\n<ul>\n<li>2025-01-27 (id 284854): «У каждого правитель есть выродок» — единственное число, один на правителя.</li>\n<li>2025-05-31 (id 331656–331657): Миколай подытоживает — «а, у любого правителя есть пробионты», Слава отвечает «Ну да наверное». Здесь множественное число, и согласие дано неуверенно.</li>\n</ul>\n<p>Какая из двух формулировок действующая, в переписке не решено.</p>", "r": []}, {"t": "Общие способности группы", "a": ["S03", "GR-0024-S03", "GR-0024--obschie-sposobnosti-gruppy"], "h": "<p><strong>Сила.</strong> Общая для всех оценка (2025-05-31, id 331635): «Подобные субъекты имеют огромную силу, которая в теории позволит уничтожить континент».</p>\n<p>Масштаб этой оценки уточняется в тот же день. Миколай разворачивает, что она означает при устройстве вселенной, где килька — это вселенная с миллионом галактик, в галактике миллион солнечных систем, в солнечной системе от 1 до 50 планет, а на планете вроде Земли 6–7 материков: «так вот это существо может уничтожить Евразию 🤯 это огромная сила» (2025-05-31, id 331649). Слава отвечает, что «континент» относился не ко всем (2025-05-31, id 331655): «Я подразумевал существ среднего и малого мира. А вот из нашего то он вполне солнечную систему разрушит».</p>\n<p>То есть после 2025-05-31 сила протобионта зависит от размера родного мира: протобионт малого или среднего мира — континент, протобионт «нашего» мира — солнечная система.</p>\n<p><strong>Действие как стихийное бедствие.</strong> В январской версии (2025-01-27, id 284855): «И эти сущность как стихийная катастрофа, как цунами, ураган, вулкан».</p>\n<p><strong>Перемещение между мирами.</strong> Они «иногда покидают минимиры и прилетають к нам» (2025-01-27, id 284856). При этом в майском описании отмечено: «они очень не любят покидать мир своего родителя» (2025-05-31, id 331635).</p>\n<p><strong>Два исхода после прилёта.</strong> Сформулировано как развилка (2025-01-27, id 284856): «есть два исхода либо они начинают буйствовать и благословеный их толпой гасят. И второй когда они просто уходят в спячку».</p>\n<p><strong>Обратная связь с родным миром.</strong> Гибель протобионта отражается на мире, из которого он пришёл (2025-01-27, id 284857): «И вот как раз в первом случае когда они буйствует и мы их убиваем, то это сказывается на их родном мире из-за этого благословенных бояться и знають что они существуют». Что именно происходит с миром, не расшифровано.</p>\n<p><strong>Обнаружимость.</strong> Протобионты входят в число целей сенсорики благословенных. В списке четырёх основных способностей благословенного (2025-05-31, id 331635) четвёртая — «сенсорика ( позволяет ощущать других благослрвенных и арбетара или Протобионтов)». Отдельной способности «чувствовать друг друга» у самих протобионтов не названо.</p>", "r": []}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0024-S04", "GR-0024--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p>Разница задана двумя параметрами, оба — внешние по отношению к самому существу.</p>\n<p><strong>По родному миру — разная разрушительная сила.</strong> Малый и средний мир даёт протобионта уровня континента, «наш» мир — уровня солнечной системы (2025-05-31, id 331655).</p>\n<p><strong>По поведению — большинство спокойны, меньшинство нет.</strong> Формулировка (2025-05-31, id 331635): «Но большинство существ спокойный и миролюбивый». Соответственно, есть и те, кто буйствует. Январская развилка «буйство или спячка» (2025-01-27, id 284856) описывает то же расхождение в поведении, но без указания долей.</p>\n<p>Отдельно стоит спящий в Перимутском треугольнике — единственный пример второго исхода, названный с местом (2025-01-27, id 284856).</p>\n<p>Чем протобионты отличаются друг от друга внутри одного мира и различаются ли они по способностям, а не только по мощности, в переписке не сказано.</p>", "r": []}, {"t": "Иерархия", "a": ["S05", "GR-0024-S05", "GR-0024--ierarhiya"], "h": "<p>Внутренней иерархии у группы не описано. Есть только вертикаль наружу: правитель — родитель, протобионт — его ребёнок. Протобионты создаются лично правителем (2025-05-31, id 331635) и не любят покидать его мир.</p>\n<p>По силе группа помещена выше Серафима. Когда Миколай спрашивает, почему сущности не появляются, Слава отвечает (2025-01-28, id 285529): «Ну бля их сложная представить ведь в сюжете пока их не будет так как они слишком мощный, мощней Серафима».</p>\n<p>Отношения протобионтов к Альфам и грехам по силе не проговорены — эти классы только перечислены как уже существующие, поверх которых вводится новый (2025-01-27, id 284852–284853).</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S06", "GR-0024-S06", "GR-0024--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>Правители</strong> — родители. Каждый протобионт создан правителем напрямую, и мир правителя — его дом.</p>\n<p><strong>Благословенные</strong> — те, кто их гасит. Буйствующего протобионта благословенные «толпой гасят» (2025-01-27, id 284856), поодиночке — не сказано. Обратный эффект: поскольку убийство сказывается на родном мире протобионта, «благословенных бояться и знають что они существуют» (2025-01-27, id 284857). То есть протобионты — это причина, по которой в других мирах вообще осведомлены о благословенных.</p>\n<p>Кроме того, благословенные способны ощущать протобионтов сенсорикой — наряду с другими благословенными и «арбетаром» (2025-05-31, id 331635).</p>\n<p><strong>Апостолы</strong> — отдельно с протобионтами не сопоставлены; они входят в благословенных как 21 человек, получивший благословение от правителя рая.</p>\n<p><strong>Серафим</strong> — точка отсчёта сверху: протобионты мощнее его (2025-01-28, id 285529).</p>\n<p><strong>Альфы и грехи</strong> — упомянуты только как классы, существовавшие до введения сущностей (2025-01-27, id 284852).</p>\n<p><strong>Перимутский треугольник</strong> — место, где спит один из них (2025-01-27, id 284856). Больше о треугольнике в связи с протобионтами ничего не сказано.</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S07", "GR-0024-S07", "GR-0024--kak-menyalas"], "h": "<p><strong>2025-01-27 (id 284852–284857).</strong> Слава вводит класс под названием «сущности», отдельная особь — «выродок». Задано сразу: дети правителей, по одному на правителя, действуют как стихийная катастрофа («как цунами, ураган, вулкан»), покидают минимиры и прилетают «к нам», два исхода — буйство с последующим уничтожением толпой благословенных или спячка, один спит в Перимутском треугольнике, убийство отражается на родном мире и потому благословенных боятся.</p>\n<p><strong>2025-01-28 (id 285526–285532).</strong> Миколай говорит, что ждал появления сущностей: «ваще я ждал что сущности появятся». Слава отклоняет их ввод в сюжет: «их сложная представить ведь в сюжете пока их не будет так как они слишком мощный, мощней Серафима». Это отложение, а не отмена класса — «пока». В том же обмене проходит вопрос Миколая «цепь связи?» и ответ Славы про то, что она была только в артефактах и после была перенесена в орудия; связь этого с сущностями в переписке не проговорена.</p>\n<p><strong>2025-05-31 (id 331635).</strong> В большом описании правителей появляется имя «Протобионты» и определение через способ создания: «Это субъект, который был создан именно правителем, а не из-за особенности мира». Добавлены: оценка силы «в теории позволит уничтожить континент», нрав («большинство существ спокойный и миролюбивый»), нелюбовь к выходу из родного мира. Здесь же протобионты вписаны в чужую механику — в сенсорику благословенных.</p>\n<p><strong>2025-05-31 (id 331649–331657).</strong> Уточнение по итогам разбора Миколая: «континент» относится к протобионтам малых и средних миров, протобионт «нашего» мира разрушит солнечную систему. Тезис «у любого правителя есть пробионты» проговаривает Миколай, Слава подтверждает с оговоркой: «Ну да наверное». В этом же обмене Слава упоминает, что «В истории было про упыря и битвой с защитником» — что это за история и относится ли она к протобионтам, не пояснено.</p>\n<p><strong>2025-10-18 (id 375843–375852).</strong> Миколай верстает майский текст Славы о правителях (включая абзац о протобионтах) как страницу-набросок и показывает ссылку: «это только по одному твоему сообщению». Текст воспроизведён дословно, без правок содержания. Слава утверждает форму: «Очень круто», «Делай так». Задумка на этой дате не менялась — менялась только подача.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "GR-0024-S08", "GR-0024--probely"], "h": "<div class=\"gaps\"><ul>\n<li><strong>Поимённого состава нет.</strong> Ни один протобионт не назван по имени; в плановом файле список участников пуст.</li>\n<li><strong>Число на правителя не установлено.</strong> «У каждого правитель есть выродок» (единственное число, 2025-01-27) и «у любого правителя есть пробионты» (множественное, подтверждено словами «Ну да наверное», 2025-05-31) не согласованы между собой.</li>\n<li><strong>Тождество «сущности = протобионты» прямо не объявлено.</strong> Переход с одного названия на другое в переписке не отмечен.</li>\n<li><strong>Внешность и облик не описаны</strong> ни у одного экземпляра.</li>\n<li><strong>Способности, кроме разрушительной силы, не перечислены.</strong> Сказано только, на что они способны по масштабу, а не что именно они делают. Как выглядит «буйство» механически — не сказано.</li>\n<li><strong>Что происходит с родным миром после гибели протобионта — не расшифровано.</strong> Сказано только, что «это сказывается на их родном мире».</li>\n<li><strong>Отношение к «минимирам» не проговорено.</strong> Протобионты «покидают минимиры», но связь минимиров с мирами правителей в этом окне не объяснена (помечено как неясность в самом окне w0073).</li>\n<li><strong>Кому принадлежит спящий в Перимутском треугольнике, чей он ребёнок и почему выбрал это место — не сказано.</strong> Написание «перимутский» похоже на авторский вариант «бермудского», но прямо это не заявлено.</li>\n<li><strong>Ввод в сюжет остался нерешённым.</strong> На 2025-01-28 решение — «в сюжете пока их не будет»; появлялись ли они в сюжете позже, в этих записях не отражено.</li>\n<li><strong>Отношение к Альфам и грехам по силе и статусу не сравнивалось.</strong></li>\n<li><strong>Способ перемещения не уточнён.</strong> Общие способы покинуть мир перечислены для существ вообще (ритуал, край мира, пространственная аномалия, выброс самим правителем); каким из них пользуются протобионты — не сказано, они просто «прилетають».</li>\n</ul></div>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0024--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0024.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0024-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0024/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым чинить не поимённый состав, а расщепление класса на три записи.</p>\n<p>Один и тот же класс лежит в базе как <code>PS-0280</code> «Протобионты» (18 920 знаков базы), <code>MR-0108</code> «Сущность» (4 637) и <code>PS-0213</code> «Выродок» (3 299), плюс <code>MN-0014</code> «Перимутский треугольник» (2 436) как место. У самой группы своей базы нет вовсе. Ссылки при этом идут врозь: на <code>PS-0280</code> — две, на <code>MR-0108</code> — одна, на <code>PS-0213</code> — ноль. Пока тождество не объявлено, каждая статья, которая на них ссылается (<code>GR-0023</code>, <code>VS-0002</code>), берёт свою треть класса и не видит остальных.</p>\n<p>Отдельно: у <code>PS-0280</code> в базе 18 920 знаков, а в статье 10 004 — почти половина материала в текст не дошла. Это дешёвая дыра: закрывается чтением, а не архивом.</p>\n<h3>С чего начать</h3>\n<p>В базе. Сверить <code>PS-0280</code>, <code>MR-0108</code>, <code>PS-0213</code> и <code>MN-0014</code> между собой — скорее всего расхождение «один выродок на правителя» против «пробионты во множественном числе» разрешается не в переписке, а в том, что записи резали в разные дни и по разным словам.</p>\n<p>В архив идти за одним: смена названия. Между 2025-01-28 (id 285529, «в сюжете пока их не будет») и 2025-05-31 (id 331635, «которых зовут Протобионты») — четыре месяца, и в этих окнах должен быть момент, где слово поменялось. Второй ориентир — окно w0073, в самой базе помеченное неясностью про минимиры: именно там висит вопрос, откуда протобионты «покидают минимиры», если их родитель — правитель мира.</p>\n<h3>Как развивалось</h3>\n<p>2025-01-27 — заявили целиком за один заход: дети правителей, стихийное бедствие, два исхода, спящий в треугольнике, обратный удар по родному миру. 2025-01-28 — ограничили: «в сюжете пока их не будет так как они слишком мощный, мощней Серафима». Четыре месяца забыли. 2025-05-31 — вернулись под новым именем и в тот же день снова ограничили, теперь масштаб: континент оказался не общей меркой, а меркой малого и среднего мира. 2025-10-18 — вернулись ещё раз, но только вёрсткой: текст воспроизведён дословно, задумка не тронута.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для жителей Кильки правило названо жёстко и дважды: «всё существа кильке не способны покинуть свой мир. Не каким либо образом». Протобионт есть у каждого правителя, значит есть и у правителя Кильки — и при этом протобионты как класс описаны через перемещение, они «прилетають к нам». Распространяется ли запрет на выход из Кильки на ребёнка её правителя, не проговорено ни разу.</p>\n<h3>Отклик</h3>\n<p>Сильное здесь — обратная связь с родным миром. Не «протобионты страшные», а «мы их убиваем, это сказывается на их родном мире, из-за этого благословенных боятся и знают, что они существуют». Репутация приходит не через слух и не через хвастовство, а через ущерб — и заодно объясняет, откуда чужие миры вообще осведомлены о людях с благословением. Такой ход обычно придумывают позже, при сведении концов; здесь он есть сразу, в первом же вечере января. Спящий в Перимутском треугольнике — одна строка без имени и без внешности, и она держится лучше многих расписанных: место занято, объяснять не обязательно.</p></div>", "r": []}];</script>
