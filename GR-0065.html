<script>const BASE="";const DOCNAME="Пернатые (клан крылатых)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0065-S01", "GR-0065--chto-eto"], "h": "<p>Раса (она же клан) крылатых существ мира Оам. В переписке названа двумя способами: «Пернатые» — при перечислении рас и организаций мира (2025-11-17, id 385768; повтор 2025-12-06, id 393287) и «клан крылатых» — при разборе сторон конфликта (2025-12-06, id 393305). Оба названия относятся к одному и тому же, потому что в обоих случаях в скобках стоит Серафим.</p>\n<p>Группа задана открытым списком: «Пернатые (Серафим, Пераги и кто-нибуть ещё)». То есть в самой формулировке зафиксировано, что состав неполный и третий участник ещё не придуман.</p>\n<p>Это именно группа (раса/клан), а не один персонаж: названы как минимум два имени. При этом ни Серафим, ни Пераги отдельными записями во вселенной Оам не заведены — что они такое, кроме принадлежности к пернатым, в переписке не сказано.</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0065-S02", "GR-0065--sostav"], "h": "<p>Поимённого полного состава нет. Названы:</p>\n<ul>\n<li>Серафим — единственный, кого называют дважды; в версии от 2025-12-06 (id 393305) в скобках при «клане крылатых» стоит только он.</li>\n<li>Пераги — назван один раз, в перечне рас (id 385768, повтор 393287).</li>\n<li>«и кто-нибуть ещё» — третий участник обозначен как место, которое надо заполнить, но не заполнен. В разделе неясностей исходной записи это зафиксировано прямо: «Кто ещё входит в пернатых — не решено».</li>\n</ul>\n<p>Отдельных id участников в базе нет — записей на Серафима и Пераги во вселенной Оам не заведено, поэтому список members у группы пуст.</p>", "r": []}, {"t": "Иерархия", "a": ["S03", "GR-0065-S03", "GR-0065--ierarhiya"], "h": "<p>Внутренней иерархии группы в переписке нет: кто из двоих названных главный, соподчинены ли они вообще — не сказано.</p>\n<p>Место группы в общей иерархии сил мира Оам задано (2025-11-17, id 385768; повтор 2025-12-06, id 393287). Расклад такой:</p>\n<ol>\n<li>Коты. Их девять, «они сильнеший», есть в каждую эпоху, «Они вообще никуда не вмешиваться».</li>\n<li>Апостолы — «21 вторая по силе раса на земле».</li>\n<li>Дальше — «расы и организации который равны по силе с друг другом».</li>\n</ol>\n<p>Пернатые стоят в третьем ярусе, в общем перечне равных между собой. Никакого выделения внутри этого яруса им не дано. Там же оговорено, что раса — не единственный способ быть сильным: «в мире есть просто индивиды который могут быть сильными».</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S04", "GR-0065-S04", "GR-0065--otnosheniya-s-drugimi-gruppami"], "h": "<p>Прямых связей — союзов, вражды, договоров — с конкретными группами в переписке не названо ни одной. Есть только позиция в общем раскладе сторон конфликта (2025-12-06, id 393301–393317).</p>\n<p>Сторона: промежуточные злодеи. Дословно: «Вообще промежуточными злодеями будут / Дети мирового древа / И клан крылатых ( Серафим)» (id 393305). Тут же добавлено: «Ну или церкви, да и люди иногда» (id 393306) и «Да еще и Виктор, что воскрешает трупы, ну точнее делает из них марионеток» (id 393308).</p>\n<p>То есть в один разряд с пернатыми попадают: Дети мирового древа, церкви, иногда люди, Виктор.</p>\n<p>Выше по разряду злодейства стоят два основных злодея, названные отдельно (id 393313–393314): сестра, теперь дочь Имитатора (Имита), и человек — Бог красок, который «лишь образ». К пернатым их в переписке никак не привязывают.</p>\n<p>Со стороны добра главными названы апостолы (id 393293–393294). Никакого столкновения пернатых с апостолами или с кем-либо ещё в переписке не описано.</p>\n<p>Соседи по третьему ярусу иерархии, названные в том же перечне, что и пернатые (id 385768, 393287): Дети мирового древа, «Проротой каменный челике», Азуриэль, группировка сестры, «Правителская организации по контролю всех этих», церковь с паладинами, организация Виктора, орден, предназначенный для убийства котов, вампиры, Аскизы. Это соседство по списку, а не заявленные отношения.</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S05", "GR-0065-S05", "GR-0065--kak-menyalas"], "h": "<p><strong>2025-11-17 (id 385768–385769, окно w0109).</strong> Группа появляется одной строкой внутри большого перечня рас и организаций мира Оам: «Пернатые (Серафим, Пераги и кто-нибуть ещё)». Кроме имён — ничего: ни способностей, ни места обитания, ни цели.</p>\n<p><strong>2025-12-06 (id 393287–393290, окно w0112).</strong> Перечень повторён дословно, строка о пернатых — без изменений, тем же составом. Повтор идёт в рамках возврата к миру: «Давай вспомним», «В нашем мире Оэм уже существует много сторон для конфликта».</p>\n<p><strong>2025-12-06 (id 393304–393310, окно w0112).</strong> Появляется второе название и роль в конфликте: «клан крылатых ( Серафим)» отнесён к промежуточным злодеям — вместе с Детьми мирового древа. В скобках на этот раз стоит только Серафим, Пераги не упомянут. Прежнее название и прежний состав при этом не отменяются.</p>\n<p>Позже, в окне w0115 (2026-02-06 — 2026-02-07, id 429348–429816), когда материал по Оэм собирали в отдельный документ через нейросеть, пернатые не всплывают ни разу. Сам сбор оказался неполным: «Че то мало информация оказывается о ОЭМ» (id 429386) — «ой, ч не все чет кинул видимо» (id 429387).</p>\n<p>Отклонённых вариантов — то есть предложенных и забракованных решений по этой группе — в переписке нет: ни одно из сказанного о пернатых не оспаривалось и не переписывалось.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "GR-0065-S06", "GR-0065--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Полного поимённого состава нет. Третий участник объявлен («и кто-нибуть ещё»), но не придуман; в неясностях исходной записи так и помечено: «Кто ещё входит в пернатых — не решено».</li>\n<li>Способностей группы не названо вообще — ни общих, ни чьих-либо отдельных. Единственное, что известно про физику существ, содержится в самих названиях: пернатые, крылатые.</li>\n<li>Чем Серафим отличается от Пераги — не сказано; о них не сказано ничего, кроме имён и принадлежности к группе.</li>\n<li>Внутренней иерархии нет: главный не назван.</li>\n<li>Место обитания не названо.</li>\n<li>Цели и мотивации нет. При этом группа отнесена к промежуточным злодеям — почему именно она злодейская, в переписке не объяснено.</li>\n<li>Отношений с конкретными другими группами не названо ни одного.</li>\n<li>Численность не названа (в отличие от котов, которых девять, и апостолов, которых 21).</li>\n<li>Отдельных записей на Серафима и Пераги во вселенной Оам нет, поэтому проверить их по другим источникам базы нельзя.</li>\n</ul></div>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0065--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0065.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0065-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0065/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым чинить Серафима. Отдельной записи о нём нет вообще — ни в Оам, ни где-либо ещё; в базе он существует только косвенно, через <code>SP-0187</code> «Силы Серафима», <code>SP-0225</code> «Способности Серафима», <code>PS-0209</code> «Серафима» и <code>GR-0008</code> «Команда против Серафима» — и все четыре во вселенной Апостол. При этом на него опираются: эта статья (он единственный, кого называют дважды, и в версии от 2025-12-06 в скобках стоит только он), перечень объектов организации Нимб («Медуза, черныши, серафим,..», 2025-04-08, id 317440) и та самая команда в Апостоле. Одно имя держит три вселенных, и ни в одной нет записи, к которой можно привязать вопрос «это один и тот же Серафим или три разных».</p>\n<p>Второе — Пераги. Тут дыра другого рода: статья есть (<code>GR-0022</code>, 21,3 КБ), но она про группу во вселенной Апостол, базы у неё 0 и входящих ссылок 0. То есть в Оам Пераги назван участником пернатых, а единственный текст с этим именем стоит в стороне и ничем с ним не соединён.</p>\n<p>Третье, на фон: <code>MR-0174</code> «Пернатые» — четыре входящие ссылки при 8,6 КБ базы и статье в 5 КБ. Часть материала базы в статью не пришла. И над всем кластером Оам висит <code>SL-0054</code> «Список 12 апостолов» — семь ссылок, 229 КБ базы, статьи нет; иерархия ярусов, в которой пернатым отведено третье место, без него не проверяется.</p>\n<h3>С чего начать</h3>\n<p>Сначала база, архив потом.</p>\n<p><code>MR-0174</code> — 8,6 КБ против 5 КБ статьи: разница в 3,6 КБ и есть первое, что надо прочитать; она может содержать как раз то, чего в статье нет (среда обитания, способности). Дальше <code>MR-0182</code> «Оэм» — 16 входящих ссылок, 39 КБ базы: это главный узел вселенной, и перечень рас с ярусами живёт там. Потом <code>MR-0164</code> «Оам» и <code>MR-0165</code> «Мир Оам». По Серафиму — сверять <code>SP-0187</code>, <code>SP-0225</code>, <code>PS-0209</code>: задача не перенести их в Оам, а установить, одно это имя или совпадение.</p>\n<p>В архив идти за тремя окнами. w0109, 2025-11-17, id 385768–385769 — первое появление строки. w0112, 2025-12-06, id 393287–393317 — повтор и назначение роли; смотреть промежуток между 393290 и 393304, где перечень заканчивается и начинается разбор сторон. И главное — w0115, 2026-02-06/07, id 429348–429816: там материал по Оэм собирали через нейросеть и сбор вышел неполным по признанию самих авторов («Че то мало информация оказывается о ОЭМ», id 429386; «ой, ч не все чет кинул видимо», id 429387). Если про пернатых где-то говорили и это не доехало до документа, то именно здесь видно, что именно не доехало.</p>\n<h3>Как развивалось</h3>\n<p>Заявили — 2025-11-17, id 385768: одна строка внутри большого перечня рас, «Пернатые (Серафим, Пераги и кто-нибуть ещё)». Ограничение встроено в саму заявку: состав объявлен неполным в момент объявления.</p>\n<p>Забыли — почти три недели без единого упоминания.</p>\n<p>Вернулись — 2025-12-06, id 393287: перечень повторён дословно, строка не изменилась. Возврат оформлен как ревизия («Давай вспомним», «В нашем мире Оэм уже существует много сторон для конфликта») и при этом не добавляет ничего.</p>\n<p>В тот же день, id 393305, — единственное движение: появляется второе название («клан крылатых») и роль (промежуточные злодеи), а в скобках остаётся только Серафим. Пераги из скобок исчезает молча; прежний состав при этом не отменяют.</p>\n<p>2026-02-06/07 — при сборе материала по Оэм в отдельный документ пернатые не всплывают ни разу.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Иерархия сил Оам задана тремя ярусами, и для двух верхних численность названа как обязательный признак: котов девять, апостолов 21 — причём число входит прямо в определение («21 вторая по силе раса на земле»).</p>\n<p>Третий ярус описан как «расы и организации который равны по силе с друг другом», и ни для одной группы этого яруса, включая пернатых, числа нет. Правило «раса определяется в том числе тем, сколько её» проговорено сверху и не проговорено для соседнего случая на уровень ниже — при том что равенство по силе внутри яруса заявлено, а чем оно измеряется, не сказано.</p>\n<h3>Отклик</h3>\n<p>Самое живое здесь — скобка «и кто-нибуть ещё». Она не в заметках на полях, не в списке дел, а в самой формулировке расы, наравне с именами: пустое место записано в мир как элемент мира. Через три недели строка повторяется дословно, вместе с этой скобкой, — то есть пустота пережила ревизию и была утверждена ещё раз. А потом, в том же разговоре, скобка сужается до одного Серафима, и никто этого не проговаривает: Пераги просто не попадает в новый набор. Забавно, что расширенный состав при этом не отменён, и оба варианта теперь существуют параллельно — не потому что так задумано, а потому что никто не заметил расхождения. И поверх всего этого группа получает разряд — «промежуточные злодеи», — не имея ни цели, ни места обитания, ни одной способности. Злодейство здесь приходит раньше, чем содержание, и держится исключительно на том, что рядом в перечне оказались Дети мирового древа.</p></div>", "r": []}];</script>
