<script>const BASE="";const DOCNAME="Палачи (государственные убийцы)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0070-S01", "GR-0070--chto-eto"], "h": "<p>Палачи — «государственный убийцы», закрытая категория ликвидаторов во вселенной Оам. Описаны одним сообщением Славы (2025-11-05, id 382099): «Палачи государственный убийцы. Личность которых засекречена. Они всегда ходят в масках на задание. У них всегда одна и таже цель ликвидации. Если они появятся не кто не выживает. Их вырастили именно для убийства.»</p>\n<p>Это именно группа, а не один персонаж: речь идёт во множественном числе о выращенной и обученной категории людей. При этом в базе они лежат одной карточкой персонажа (<a href=\"PS-0304.html\">Палачи</a>) и в переписке не названы ни поимённо, ни числом.</p>\n<p>Ключевые признаки, названные прямо:</p>\n<ul>\n<li>личности засекречены;</li>\n<li>на задание всегда идут в масках;</li>\n<li>цель всегда одна и та же — ликвидация;</li>\n<li>«Если они появятся не кто не выживает»;</li>\n<li>«Их вырастили именно для убийства» — то есть выращены под задачу, а не набраны.</li>\n</ul>\n<p>Кто именно их растит — какое государство, ведомство или организация, — в переписке не сказано.</p>", "r": [["Палачи", "PS-0304.html"]]}, {"t": "Общие способности группы", "a": ["S02", "GR-0070-S02", "GR-0070--obschie-sposobnosti-gruppy"], "h": "<p>Единственная названная общая черта — боевая подготовка: «они были обучены стилю боя как у Палача ( апостола, который сильнейший в ближнем бою), но опять же это лишь имитация стиля Палача» (2025-11-05, id 382099). Оговорка про имитацию сделана автором дважды в одном сообщении («как у Палача» и «это лишь имитация»), то есть Палачи владеют не самим стилем апостола, а его подобием.</p>\n<p>Собственных способностей, отдельных от этой обученной имитации, у группы не названо. Оружие Палачей не названо (у апостола Палача в его версиях фигурируют катана и цельножелезный топор, но на группу это не переносилось).</p>\n<p>Отдельно зафиксирована отклонённая внутри мира попытка усиления: «Также было проведена попытка обучения особого усиления Имитатора, но из-за большой смертности от неё отказались» (2025-11-05, id 382099). То есть Палачей пробовали обучить особому усилению Имитатора — и от этого отказались из-за большой смертности. Кто отказался и на каком этапе, в переписке не сказано; выжившие обученные этому усилению не упоминаются.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S03", "GR-0070-S03", "GR-0070--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>Апостол Палач (<a href=\"PS-0171.html\">Палач</a>)</strong> — образец стиля, а не член группы. В окне w0108 (2025-11-05, id 382099) он назван апостолом, «который сильнейший в ближнем бою», и упомянут только как тот, чей стиль имитируют. Никакого его участия в обучении, отношения к организации или знания о существовании Палачей в переписке не сказано.</p>\n<p>Для полноты: сам апостол Палач разрабатывался и вне вселенной Оам, и позже, 2026-06-02 (id 487176, вселенная в окне не объявлена), про него сказано: «Палач один из апостолов. Цепной пёс ассоциации. Ну точнее ассоциации так думает. Под цепным псом я имею ввиду убийцу, что убивает тиха всех неугодных ассоциации. И он не герой, ну не числиться. В ближнем бою он почти сильнейший», и «сильнейший апостолы это Граф и Палач». Связь этого описания с группой Палачей в переписке не проводилась.</p>\n<p><strong>Апостолы</strong> — Палач принадлежит к ним, но принадлежности самих Палачей к апостолам не заявлено.</p>\n<p><strong>Имитатор</strong> — упомянут только через «особое усиление Имитатора», которому Палачей пробовали обучить. Участвовал ли Имитатор в этом обучении сам, из текста не следует; в переписке не сказано.</p>", "r": [["Палач", "PS-0171.html"]]}, {"t": "Как менялась — по датам", "a": ["S04", "GR-0070-S04", "GR-0070--kak-menyalas"], "h": "<p><strong>2025-11-05, id 382099 (окно w0108, вселенная Оам объявлена)</strong> — единственное сообщение о группе. В нём сразу даётся весь состав признаков: секретность личностей, маски на задании, единственная цель — ликвидация, «если они появятся не кто не выживает», выращены для убийства, обучены имитации стиля апостола Палача. Тем же сообщением фиксируется отклонённый вариант — обучение особому усилению Имитатора, свёрнутое из-за большой смертности.</p>\n<p>Других версий у группы нет: карточка <a href=\"PS-0304.html\">Палачи</a> имеет одну версию, даты 2025-11-05 — 2025-11-05. Реакции соавтора на это описание в переписке нет.</p>", "r": [["Палачи", "PS-0304.html"]]}, {"t": "Пробелы", "a": ["S05", "GR-0070-S05", "GR-0070--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет: ни одного Палача по имени не названо, численность не названа, состав не назван.</li>\n<li>Не сказано, какое государство или организация их растит.</li>\n<li>Не описано, как их отбирают, откуда берут и с какого возраста растят.</li>\n<li>Иерархия внутри группы не описана: командиров, званий, деления на ранги в переписке нет.</li>\n<li>Различий между отдельными Палачами не названо — они описаны только как однородная категория.</li>\n<li>Не сказано, чем именно имитация стиля Палача отличается от самого стиля апостола, в чём слабее или беднее.</li>\n<li>Оружие и снаряжение не названы; маски описаны только фактом ношения, внешний вид масок не описан.</li>\n<li>Не сказано, кто ставит им цели и как они получают задания.</li>\n<li>Судьба отклонённого обучения особому усилению Имитатора осталась нерешённой: кто его проводил, сколько погибло, остались ли выжившие — не сказано.</li>\n<li>Ни одного эпизода с их участием в переписке нет: только описание категории.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0070--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0171.html\">Палач</a>, <a href=\"PS-0304.html\">Палачи</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0070--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0070.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0070-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0070/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым чинить <code>MR-0194</code> «Ассоциация»: статьи нет, 13,3 КБ базы, одна ссылка, вселенная помечена как неясная. Главный неотвеченный вопрос статьи — кто растит Палачей, какое государство или ведомство за ними стоит. И в базе уже лежит организация, для которой в переписке названа ровно эта функция: апостол Палач, чей стиль имитируют, описан как «Цепной пёс ассоциации... убийцу, что убивает тиха всех неугодных ассоциации» (2026-06-02, id 487176). То есть модель «организация держит закрытых убийц» в материале есть, разобрана она в единственном месте, и это место не написано.</p>\n<p>Второе — <code>SL-0054</code> «Список 12 апостолов»: семь ссылок, 229 КБ базы, статьи нет, вселенные включают Оам. Палачи определены целиком через апостола Палача (<code>PS-0171</code> — восемь ссылок, 38,5 КБ базы), а сам ряд апостолов, из которого он взят, нигде не сведён. Пока <code>SL-0054</code> не написан, утверждение «сильнейший в ближнем бою» не проверяется, а значит не проверяется и то, что именно имитируют Палачи.</p>\n<p>Третье, по цифрам самое скромное, но структурно неприятное: <code>PS-0304</code> «Палачи» — три входящие ссылки при 2,4 КБ базы, и статья (3,5 КБ) уже длиннее базы. Материал исчерпан полностью; дописывать нечего, любое движение — только из соседних записей или из архива.</p>\n<h3>С чего начать</h3>\n<p>В базе — три конкретных адреса.</p>\n<p><code>SP-0127</code> «Особое усиление»: три ссылки, 40 КБ базы, вселенная 7 островов. Здесь ключевое. Отклонённое обучение Палачей — это обучение «особому усилению Имитатора», а особое усиление уже разобрано как отдельная механика, только в другой вселенной. Смотреть надо, есть ли там смертность, порог входа, требования к обучаемому: если в <code>SP-0127</code> сказано, почему усиление вообще может убить, то отказ «из-за большой смертности» перестаёт быть голым фактом.</p>\n<p><code>PS-0171</code> «Палач»: 38,5 КБ базы против 28 КБ статьи — почти 10 КБ не разобрано, и именно там сидит линия ассоциации.</p>\n<p><code>MR-0171</code> «Правительственная организация по контролю» (четыре ссылки, 9,2 КБ базы, Оам) — второй кандидат на «кто их растит», уже внутри нужной вселенной. Проверять до архива: если государственная структура в Оам уже названа, вопрос о нанимателе Палачей может закрыться сведением, а не выдумыванием.</p>\n<p>В архив — за окном w0108 вокруг 2025-11-05, id 382099. Сообщение одно и процитировано целиком, поэтому смотреть надо не его, а рамку: что обсуждали до и после в тот же день и была ли вообще реакция Миколая (статья фиксирует, что реакции нет — это стоит подтвердить). Второй ориентир — 2026-06-02, id 487176, где Палач разворачивается через ассоциацию: проверить, не всплывают ли рядом его подражатели.</p>\n<h3>Как развивалось</h3>\n<p>Здесь нечего разворачивать по датам: всё сказано одним сообщением.</p>\n<p>2025-11-05, id 382099 — заявили и ограничили в одном абзаце. Признаки (секретность, маски, единственная цель, «Если они появятся не кто не выживает», выращены под задачу) и тут же ограничение: имитация стиля, а не сам стиль, оговорённая дважды подряд. В том же абзаце — единственный отклонённый вариант: попытка обучить особому усилению Имитатора, свёрнутая из-за смертности. То есть отказ вошёл в мир одновременно с самим миром.</p>\n<p>Реакции соавтора нет. Версия у карточки одна, даты начала и конца совпадают.</p>\n<p>Не вернулись. Апостол Палач продолжает разрабатываться — 2026-06-02, через семь месяцев, — но группа, названная его именем и обученная его стилю, в этом разговоре не появляется.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Про боевой стиль сказано жёстко и дважды: Палачи владеют не стилем апостола, а его подобием — «но опять же это лишь имитация стиля Палача».</p>\n<p>Особое усиление Имитатора — заимствование того же рода: чужая техника, названная по имени носителя, переносимая на группу. Но тут оговорки про подобие нет вовсе. Не сказано ни что Палачам давали имитацию усиления, ни что настоящее; отказ объяснён смертностью, то есть чисто количественно, и вопрос «а было ли это вообще то самое усиление» не поставлен. Правило «взятое у сильного — всегда лишь копия» названо для одного заимствования из двух, стоящих в одном предложении.</p>\n<h3>Отклик</h3>\n<p>Сильнее всего тут работает вторая оговорка. Автор пишет «обучены стилю боя как у Палача», уже поставив «как», уже застраховавшись, — и всё равно возвращается: «но опять же это лишь имитация стиля Палача». Дважды в одной фразе не дать группе присвоить чужое умение — это не небрежность, это защита персонажа от собственной массовки. Уникальность апостола охраняется прямо в момент, когда придумывается способ её тиражировать. И рядом, в том же сообщении, стоит вещь, которую я не ожидал увидеть в описании такой группы: провал. Не «их усилили», а «попытка была, смертность оказалась большой, отказались». Целый институт, выращивающий людей под убийство, признаётся в неудачном эксперименте на собственном материале — и тут же замолкает: кто отказался, сколько погибло, остались ли выжившие, не сказано ни слова. Двенадцать строк, из которых половина — про то, чего у Палачей нет: нет лиц, нет имён, нет второй цели, нет настоящего стиля, нет усиления. Группа собрана целиком из отрицаний, и это единственное, что делает её страшной.</p></div>", "r": []}];</script>
