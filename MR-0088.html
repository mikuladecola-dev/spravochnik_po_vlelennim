<script>const BASE="";const DOCNAME="Расы";
const LEAD="<p>Подбор рас для средневекового мира и их стихийных особенностей. Всё обсуждение уместилось в один вечер 2024-12-21 (id 272783–272882, окно w0067), идёт сплошным куском в конце окна.</p>";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0088-S01", "MR-0088--ustroystvo"], "h": "<p><strong>Новые расы или существующие.</strong> Слава: «Опять же какие расы будут» (id 272783). Миколай ставит выбор — «новые или уже существующие?» (id 272784), Слава возвращает вопрос: «Не знаю», «Как лучше?» (id 272785–272786). Миколай рассуждает вслух и приходит к взятию готовых: «ну бля, тяжело», «я всегда за новое на самом деле», «но по сути лучше взять существующее», «все равно бы из воздуха их придумаем», «так что норм», «они и так будут новые», «наши» (id 272787–272794). Итог: берутся существующие расы, но переделываются под себя — «они и так будут новые, наши».</p>\n<p><strong>Стихийные особенности.</strong> Раздаются 2024-12-21 (id 272827–272834):</p>\n<ul>\n<li>зимние человечки — лёд. Миколай: «либо природу либо лёд хочется дать» (id 272830), Слава выбирает: «Лёд наверное» (id 272832);</li>\n<li>вампиры — кровь;</li>\n<li>эльфы — растения;</li>\n<li>дворфы — ничего: «Дроф им нахуй ничего не надо» (id 272834).</li>\n</ul>\n<p>Особенности остальных названных рас в переписке не розданы.</p>\n<p><strong>Скверна.</strong> Уточнение по заражению скверной (ядовитой маной): Миколай спрашивает «людей тоже?» — Слава отвечает «Да», «Все расы» (id 272879–272881). То есть скверна берёт все расы без исключений.</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0088-S02", "MR-0088--naselenie"], "h": "<p>Состав, набранный за вечер:</p>\n<ul>\n<li><strong>эльф</strong> (id 272797) — особенность: растения;</li>\n<li><strong>дворф</strong> (id 272798) — особенности не имеет, «им нахуй ничего не надо»;</li>\n<li><strong>гоблин</strong> (id 272799);</li>\n<li><strong>орк</strong> (id 272800);</li>\n<li><strong>вампир</strong> (id 272801) — особенность: кровь;</li>\n<li><strong>дракон</strong> и <strong>драконид</strong> (id 272803–272804) — добавлены Миколаем со знаком неуверенности: «мб дракон»;</li>\n<li><strong>ветреные человечки</strong> — предложены Славой с пометкой «который твой горы» (id 272805);</li>\n<li><strong>оборотни</strong> (id 272806). Миколай уточняет формулу: «волк &lt;=&gt; человек?» (id 272807), Слава: «Ну оборотень», «Ты не знаешь» (id 272808–272809). Миколай: «ну обычно так», «но типа жираф человек», «чем не оборотень» (id 272810–272812). Слава закрывает определением: «Человек + животное» (id 272813), «Ок», «Оборотень» (id 272814–272815);</li>\n<li><strong>зимние человечки</strong> (id 272823) — особенность: лёд. Миколай вспоминает их как оленя: «это олень какой-то», «да?» (id 272825–272826), Слава поправляет: «Больше не олень» (id 272828);</li>\n<li><strong>демоны</strong> — на вопрос «А типо расы типо демонов?» Миколай отвечает «демоны», «всё» (id 272835–272837), Слава: «Ну ок».</li>\n</ul>\n<p>Люди в этом перечислении отдельно не заявлены как раса, но фигурируют в уточнении по скверне («людей тоже?» — «Все расы»).</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0088-S03", "MR-0088--mesto-vo-vselennoy"], "h": "<p>Часть средневекового мира. Расы связаны в переписке с ветреными человечками, демонами, зимними человечками, оборотнями и со скверной (ядовитой маной).</p>\n<p>После раздачи рас Слава подводит черту и намечает следующий шаг: «Ну вроде почти все решилась. Теперь только конструкция мира. Стороны церковь эльфы король и т п» (2024-12-21 22:50, id 272882). Стороны, названные там — церковь, эльфы, король — в этом окне не разобраны.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0088-S04", "MR-0088--kak-menyalsya-po-versiyam"], "h": "<ul>\n<li><strong>2024-12-21, id 272783–272804.</strong> Решение брать существующие расы и переделывать под себя. Первый список: эльф, дворф, гоблин, орк, вампир, возможно дракон и драконид.</li>\n<li><strong>2024-12-21, id 272805–272838.</strong> Добавлены ветреные человечки, оборотни, зимние человечки, демоны. Розданы особенности: зимним — лёд (выбирали между природой и льдом), вампирам — кровь, эльфам — растения, дворфам ничего не надо. Зимние человечки перестают быть оленями.</li>\n<li><strong>2024-12-21, id 272879–272882.</strong> Уточнение по заражению скверной: берёт все расы, включая людей.</li>\n</ul>", "r": []}, {"t": "Отклонённые варианты", "a": ["S05", "MR-0088-S05", "MR-0088--otklonennye-varianty"], "h": "<ul>\n<li>Придумывать расы с нуля. Миколай: «я всегда за новое на самом деле», но выбор сделан в пользу существующих (id 272788–272790).</li>\n<li>Дать зимним человечкам природу вместо льда — из двух вариантов Миколая выбран лёд (id 272830, 272832).</li>\n<li>Зимние человечки как олень — «Больше не олень» (id 272828), прежний облик отменён; чем он заменён, не сказано.</li>\n<li>Расширенное понимание оборотня («но типа жираф человек, чем не оборотень») сведено к формуле «Человек + животное» (id 272811–272813).</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S06", "MR-0088-S06", "MR-0088--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Особенности не розданы: гоблинам, оркам, драконам и драконидам, ветреным человечкам, оборотням, демонам.</li>\n<li>Дракон и драконид добавлены с «мб» — окончательно ли они в списке, не подтверждено.</li>\n<li>Ветреные человечки помечены как «который твой горы» — что за горы и как это связано, в этом куске не раскрыто.</li>\n<li>Чем стали зимние человечки после отмены оленя — не сказано.</li>\n<li>Люди отдельной строкой в список рас не внесены.</li>\n<li>Конструкция мира и стороны (церковь, эльфы, король) названы как следующая задача и в окне не разобраны.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["MR-0088--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-12-21</td>\n<td>272783–272804</td>\n<td>w0067</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-21</td>\n<td>272805–272838</td>\n<td>w0067</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-21</td>\n<td>272879–272882</td>\n<td>w0067</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0088-rasy.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0088--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0088.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
