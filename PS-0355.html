<script>const BASE="";const DOCNAME="Крис";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0355-S01", "PS-0355--proishozhdenie"], "h": "<p>Персонаж истории «Цена жизни», выложенной Славой одним куском (2026-02-16, id 433706–433713, окно w0118). Текст написан за неделю до публикации («На прошлое недели»); авторская оценка сразу после выкладки — «Просто хуйня». Замысел, названный Славой: «Просто я подумал о разногласий», «Точнее чувство виновности и цены жизни».</p>\n<p>Крис появляется в тексте только как погибший — тело в мешке в комнате, «где хранились трупы». Живым он в сцене не показан и ни одной реплики не имеет.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0355-S02", "PS-0355--vneshnost"], "h": "<p>Прямого описания нет. О внешности известно лишь косвенно, через сцену опознания: Ден узнаёт его в лицо, когда Бен открывает мешок, и Бен прижимает голову Дена к голове Криса, «Дабы он лучше разглядел лицо, которой больше не улыбнеться и не заплачет».</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0355-S03", "PS-0355--harakter"], "h": "<p>Материала нет. О самом Крисе как о человеке в тексте сказано только то, что он ребёнок — этот пункт стороны спора не оспаривают: «Это Крис.. И скажи.. Он по-твоему не ребёнок».</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0355-S04", "PS-0355--svyazi-s-drugimi"], "h": "<ul>\n<li>Подросток, о судьбе которого идёт спор, — по словам Бена, он «издевался над ним, лишь из зависти», то есть над Крисом. По имени не назван и в сцене не появляется. Сам характер их прежних отношений в тексте не раскрыт: Бен только говорит, что знает их («а я вот слышал и....видел!»).</li>\n<li>Бен (<a href=\"PS-0354.html\">Бен</a>) — плачет над телом Криса и произносит над ним монолог об отнятом будущем; кем он ему приходился, не сказано.</li>\n<li>Ден (<a href=\"PS-0353.html\">Ден</a>) — опознаёт тело («-....Крис!?»); знал ли он Криса при жизни, не сказано.</li>\n</ul>", "r": [["Бен", "PS-0354.html"], ["Ден", "PS-0353.html"]]}, {"t": "Что с ним стало", "a": ["S05", "PS-0355-S05", "PS-0355--chto-s-nim-stalo"], "h": "<p>Мёртв к началу сцены. Обстоятельства смерти в тексте изложены противоречиво и не сведены:</p>\n<ul>\n<li>версия Дена: «он не желал ему смерть. Это вышло случайно», «Он же говорил, что хотел лишь подшутить», «но он не хотел его убивать. Всё это вышло случайно»;</li>\n<li>Бен эту версию отвергает: «сука по-твоему это случайно!», «скажи мне Ден. По-твоему тот пацан сделал это случайно?»;</li>\n<li>в той же сцене Ден говорит: «Тем более это не он убил Криса».</li>\n</ul>\n<p>Как эти утверждения соотносятся между собой, в переписке не разъяснено.</p>\n<p>Воскрешение в тексте прямо исключено словами Бена: «Всё закончилось и не будет чудесного воскрешения».</p>\n<p>Тело хранится в отдельном здании, в комнате с трупами, в мешке; помещение охраняется — «Охранники лишь встали и поздоровались».</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0355-S06", "PS-0355--kak-menyalsya"], "h": "<p><strong>2026-02-16 (id 433706–433713), версия 1.</strong> Единственное состояние: первое и единственное упоминание, только как погибший. Дальнейших обсуждений персонажа в переписке нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0355-S07", "PS-0355--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Возраст Криса не назван; сказано только, что он ребёнок.</li>\n<li>Внешность, характер, род занятий не описаны.</li>\n<li>Способ смерти не назван.</li>\n<li>Кем он приходился Бену и Дену, не сказано.</li>\n<li>Имя убийцы не названо.</li>\n<li>Слава в тех же сообщениях описывал замысел как историю, где «мстительный дух его всё равно заебыввет» — становится ли Крис этим духом, в переписке не сказано; в написанном тексте он не появляется иначе как труп.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0355--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0353.html\">Ден</a>, <a href=\"PS-0354.html\">Бен</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0353.html\">Ден</a>, <a href=\"PS-0354.html\">Бен</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0086.html\">Совет</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0355--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-02-16</td>\n<td>433706–433713</td>\n<td>w0118</td>\n<td>Иссекай (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0355-kris.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0355--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0355.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
