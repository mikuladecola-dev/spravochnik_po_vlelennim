<script>const BASE="";const DOCNAME="Пастыри";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0079-S01", "GR-0079--chto-eto"], "h": "<p>Четвёрка главных последователей Бога красок во вселенной Феня. Задуманы Славой одним сообщением (2025-12-17, id 399534): «К Богу красок я хотел подставить 4 главных последователя ( как их назвать?) Они будут одарены его благословением и будут чудовищна сильные.» Вся разработка группы укладывается в один вечер, окно w0114, id 399534–399604: имена появились, силы и мотивы — нет.</p>\n<p>Название «Пастыри» — временное. Слава бросил в чат слово «Пастери» (id 399587), Миколай подхватил: «ну го пастыри» (id 399598) и тут же оговорил — «мь потом по другому» (id 399599). На переспрос он пояснил, к чему относится название: «ну типа эту шайку, группу в целом» (id 399601). Другого имени за окно не предложено.</p>\n<p>Группа существует на 2025-12-17 как список из четырёх имён плюс одна закреплённая способность. Двое из четверых — Градиент и Монохром — остались именами без всякого содержания.</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0079-S02", "GR-0079--sostav"], "h": "<p>Названы четверо. Список дал Миколай, дважды и в одном и том же порядке (id 399541 и id 399591):</p>\n<ul>\n<li>триколор</li>\n<li>радуга</li>\n<li>градиент</li>\n<li>монохром</li>\n</ul>\n<p>Из них свои записи в базе есть у двоих:</p>\n<ul>\n<li><a href=\"PS-0339.html\">Триколор</a> — Триколор</li>\n<li><a href=\"PS-0340.html\">Радуга</a> — Радуга</li>\n</ul>\n<p>Градиент и Монохром на 2025-12-17 — только имена из списка; отдельных записей нет, ничего кроме имени про них не сказано.</p>\n<p>Все четыре имени — названия способов работы с цветом, но вслух авторы этого не оговаривали.</p>\n<p>Авторство внутри четвёрки поделено прямо в переписке (id 399592–399597). Миколай: «если они / я буду прилумывать / эти 4 у бога красок». Слава: «Ну по триколор можешь забыть. Её я уже придумал.» и следом «Но все остальное твое». Миколай: «ок». То есть Триколор — за Славой, Радуга, Градиент и Монохром — за Миколаем.</p>", "r": [["Триколор", "PS-0339.html"], ["Радуга", "PS-0340.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0079-S03", "GR-0079--obschie-sposobnosti-gruppy"], "h": "<p>Общее по всей четвёрке названо одно, в самом первом сообщении о них (id 399534): они «одарены его благословением» — благословением Бога красок — и «будут чудовищна сильные». Что даёт благословение, в чём измеряется сила, есть ли у неё общая механика — в переписке не сказано.</p>\n<p>Отдельным пунктом рабочего списка дел Слава записал: «Придумать силы и мотивы 4 последователь» (Список того, что надо придумать по миру <em>(статьи ещё нет — <a href=\"kb/SL-0129-spisok-togo-chto-nado-pridumat-po-miru.html\">исходник</a>)</em>, id 399583). На конец окна пункт не закрыт.</p>\n<p>Мотивы самого Бога красок, к которому четвёрка приделана, на тот же момент тоже не прописаны: первым пунктом того же списка стоит «планы Бога красок и дочер».</p>", "r": [["что надо придумать по миру", "kb/SL-0129-spisok-togo-chto-nado-pridumat-po-miru.html"]]}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0079-S04", "GR-0079--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p><strong>Радуга.</strong> За ней сразу закреплена способность хромакей. Миколай: «и у кого-то способность хромокей» (id 399542), следом сам себе отвечает — «у радуги» (id 399543). Как хромакей работает, не сказано ни здесь, ни дальше (<a href=\"SP-0258.html\">Хромакей</a>).</p>\n<p><strong>Триколор.</strong> Единственная, кого Слава на момент разговора уже придумал: «Ну по триколор можешь забыть. Её я уже придумал.» (id 399595). Содержание того, что придумано, в этом окне не изложено.</p>\n<p>Про огонь связка неполная. Слава сказал раньше, до имён (id 399549): «Вообще одна из них будет управлять огнём. Точка....» — «одна из них», без имени. Ближайшее к этому имя в переписке — ответ Миколая «триколор» (id 399559), и в базе это отмечено как сведение реплики про огонь к Триколор; прямо связка «Триколор управляет огнём» в переписке не проговорена.</p>\n<p><strong>Градиент, Монохром.</strong> Отличий не названо, способностей не названо, ничего не названо.</p>\n<p>К концу той же сцены Миколай написал «то есть сразу в сюжете будет монстром» (id 399545). К кому именно относится реплика, в переписке не уточнено.</p>", "r": [["Хромакей", "SP-0258.html"]]}, {"t": "Иерархия", "a": ["S05", "GR-0079-S05", "GR-0079--ierarhiya"], "h": "<p>Внешняя привязка есть: это последователи Бога красок, и не рядовые, а «4 главных последователя» (id 399534). Благословение идёт от него, и в базе группа проходит как часть Бога красок. Слово «главных» предполагает, что есть и не главные последователи, но кто они и сколько их, не названо.</p>\n<p>В записи Бога красок (<a href=\"PS-0322.html\">Бог красок</a>) он на 2025-12-17 подтверждён как один из трёх злодеев мира наравне с Серафимом и собственной дочерью, причём «двое из которых это иной уровень сил» (id 399533). Кто из троих эти двое, не уточнено.</p>\n<p>Внутренней иерархии у четвёрки нет: старший не назван, порядок в списке (триколор, радуга, градиент, монохром) как ранг нигде не оговорён.</p>", "r": [["Бог красок", "PS-0322.html"]]}, {"t": "Отношения с другими группами", "a": ["S06", "GR-0079-S06", "GR-0079--otnosheniya-s-drugimi-gruppami"], "h": "<p>С Апостолами связь поставлена вопросом и оставлена без ответа. Миколай спросил сразу после заявки на четвёрку: «т появляется новый апостол?» (id 399539). Слава ответил не на это, а про свой счёт апостолов: «Как бы их 21 один и я не всех придумал. И вот из этих какого я не придумал будет моей маленькой жертвой» (id 399540). Прямого «да» или «нет» — считаются ли Пастыри апостолами, пересекается ли четвёрка с 21 — в переписке нет.</p>\n<p>Далее шёл разговор о числе апостолов, не о четвёрке. Миколай: «и кстати почему их 21?» (id 399546). Слава: «Не знаю. Все же хоть как-то его прописать надо же» (id 399547), «Я хуй знает» (id 399548).</p>\n<p>Апостолы при этом сработали как образец для счёта: предлагая урезать число, Миколай сослался на «12 как по базе» и пояснил — «ну было ж 12 апостолов у бога» (id 399553, 399557).</p>\n<p>Отдельно Миколай под конец бросил «котики» (id 399603), Слава ответил «?» (id 399604), пояснения не последовало. К Пастырям это не привязано; Коты в мире идут отдельным нерешённым пунктом списка дел («Роль Котов во всей этой фигней», Список того, что надо придумать по миру <em>(статьи ещё нет — <a href=\"kb/SL-0129-spisok-togo-chto-nado-pridumat-po-miru.html\">исходник</a>)</em>).</p>", "r": [["что надо придумать по миру", "kb/SL-0129-spisok-togo-chto-nado-pridumat-po-miru.html"]]}, {"t": "Как менялась — по датам", "a": ["S07", "GR-0079-S07", "GR-0079--kak-menyalas"], "h": "<p><strong>2025-12-17, 22:17–22:21, id 399534–399545.</strong> Слава заявляет четвёрку главных последователей Бога красок: одарены его благословением, «чудовищна сильные», имён нет — вопрос «как их назвать?» адресован Миколаю. Миколай спрашивает про нового апостола (id 399539), ответа по существу не получает. Дальше Миколай даёт четыре имени списком: «триколор / радуга / градиент / монохром» (id 399541) и тут же вешает на Радугу хромакей (id 399542–399543).</p>\n<p><strong>2025-12-17, 22:22–22:27, id 399549–399579.</strong> Обсуждение количества. Слава фиксирует огонь за неназванной «одной из них» (id 399549) и снова спрашивает «И как их назвать?» (id 399550). Миколай предлагает урезать число: «мб урезать?» (id 399552), «12 как по базе?» (id 399553), обосновывая — «ну было ж 12 апостолов у бога» (id 399557). Слава сначала соглашается («Ну давай», id 399554), мотивируя ленью: «А то мне в падлу придумывать всех 21» (id 399560).</p>\n<p>Тут же Миколай вводит правило про самого бога: «если че бог любит все че на 3 делится и чем меньше частное тем больше нравится» (id 399562). Слава пробует применить — «Три» (id 399565), отказывается — «Не сука» (id 399566) — и останавливается на четырёх: «4 мне нравится больше» (id 399567), «Все четыре» (id 399568). На возражение Миколая «12» (id 399571) Слава отвечает правом автора: «Я Бог в своё вселенной» (id 399572). Миколай указывает, что 12 правилу тоже удовлетворяет — «там частное 4» (id 399573) — и уступает: «лан» (id 399576), «как хочешь» (id 399577). Четыре остаётся.</p>\n<p><strong>2025-12-17, 22:29, id 399583–399586.</strong> Слава диктует рабочий список того, что надо придумать, и просит закрепить его в чате. Пунктом вторым идёт «Придумать силы и мотивы 4 последователь» (Список того, что надо придумать по миру <em>(статьи ещё нет — <a href=\"kb/SL-0129-spisok-togo-chto-nado-pridumat-po-miru.html\">исходник</a>)</em>).</p>\n<p><strong>2025-12-17, 22:31–22:37, id 399587–399604.</strong> Появляется общее название. Слава: «Пастери» (id 399587). Миколай через несколько минут: «ну го пастыри» (id 399598) с оговоркой «мь потом по другому» (id 399599) и пояснением «ну типа эту шайку, группу в целом» (id 399601). В том же куске закрепляется дележ авторства (см. «Состав»). Слава закрывает разговор: «Перечитай занова. Конец» (id 399600).</p>\n<p>К концу окна состояние такое: четыре имени, одна способность у одной участницы, огонь, привязанный к «одной из них», временное название группы и нерешённые силы и мотивы.</p>\n<h3>Отклонённые варианты</h3>\n<ul>\n<li><strong>12 вместо 21.</strong> Предложение Миколая урезать число по образцу двенадцати апостолов (id 399552–399553, 399557). Слава сначала согласился, затем свернул к четырём; Миколай отступил.</li>\n<li><strong>Три.</strong> Слава попробовал число три под правило Бога красок и отказался в следующем же сообщении (id 399565–399566).</li>\n<li><strong>Название «Пастыри».</strong> Не отклонено, но помечено самим Миколаем как временное: «мь потом по другому» (id 399599).</li>\n</ul>", "r": [["что надо придумать по миру", "kb/SL-0129-spisok-togo-chto-nado-pridumat-po-miru.html"]]}, {"t": "Пробелы", "a": ["S08", "GR-0079-S08", "GR-0079--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Силы четвёрки не придуманы. Общее — только «благословение» Бога красок и «чудовищна сильные»; конкретики нет ни у кого, кроме хромакея у Радуги.</li>\n<li>Мотивы четвёрки не придуманы. Стоят отдельным пунктом в списке дел (Список того, что надо придумать по миру <em>(статьи ещё нет — <a href=\"kb/SL-0129-spisok-togo-chto-nado-pridumat-po-miru.html\">исходник</a>)</em>) и на конец окна не закрыты.</li>\n<li>Механика хромакея не раскрыта: способность названа и отдана Радуге, как работает — не сказано (<a href=\"SP-0258.html\">Хромакей</a>).</li>\n<li>Триколор объявлена придуманной («Её я уже придумал»), но что именно придумано — в этом окне не изложено.</li>\n<li>Управление огнём формально висит на неназванной «одной из них»; кто это, прямым текстом не сказано.</li>\n<li>Градиент и Монохром — имена без содержания.</li>\n<li>Вопрос «т появляется новый апостол?» (id 399539) остался без ответа: отношение Пастырей к Апостолам не определено.</li>\n<li>К чему именно относилось число 21, из переписки однозначно не следует; на вопрос «почему их 21?» Слава ответил «Не знаю».</li>\n<li>Сколько всего последователей у Бога красок и кто, кроме этих четверых, не «главные» — не названо.</li>\n<li>Название группы временное, окончательного нет.</li>\n<li>Внутренней иерархии нет: старший, порядок, роли внутри четвёрки не названы.</li>\n<li>К кому относится «то есть сразу в сюжете будет монстром» (id 399545) — не уточнено.</li>\n<li>Реплика «котики» (id 399603) осталась без пояснения.</li>\n</ul></div>", "r": [["что надо придумать по миру", "kb/SL-0129-spisok-togo-chto-nado-pridumat-po-miru.html"], ["Хромакей", "SP-0258.html"]]}, {"t": "Связи — всё вместе", "a": ["GR-0079--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0322.html\">Бог красок</a>, <a href=\"PS-0339.html\">Триколор</a>, <a href=\"PS-0340.html\">Радуга</a></li>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0258.html\">Хромакей</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0079--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0079.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0079-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0079/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Самая дорогая дыра вокруг этой статьи — <code>SL-0054</code> («Список 12 апостолов»): семь входящих ссылок, 234 КБ базы и ни одной статьи. Это единственная запись, которая может закрыть вопрос Миколая «т появляется новый апостол?» (<code>399539</code>), оставшийся без ответа, и заодно объяснить, к чему относилось число 21 и что имелось в виду под «12 как по базе». Пока её не разобрали, отношение Пастырей к Апостолам не определит ни эта статья, ни <code>GR-0078</code>, ни <code>PS-0336</code>.</p>\n<p>Вторая — <code>SL-0129</code> («Список того, что надо придумать по миру»): три входящие ссылки, 4,1 КБ базы, статьи нет. На него в этой статье ссылаются трижды, и именно в нём лежит незакрытый пункт «Придумать силы и мотивы 4 последователь». Дыра тут не в объёме, а в том, что рабочий список мира — единственное место, где видно, что авторы сами считали недоделанным, — существует только как исходник.</p>\n<p>Третья, местная, но самая заметная: Градиент и Монохром. У них нет ни статьи, ни записи в базе — их вообще нет в реестре, только имена внутри чужого текста. Половина группы, которую статья честно описывает как «имена без содержания», не существует нигде. Для сравнения, у двух других участниц записи есть, но тонкие: <code>PS-0340</code> (Радуга) — 1,5 КБ базы при 3,9 КБ статьи, <code>SP-0258</code> (Хромакей) — 1,6 КБ базы. Статьи по ним уже больше, чем материал под ними; выжимать оттуда нечего.</p>\n<h3>С чего начать</h3>\n<p>В базе есть три точки, и все три близко. <code>SL-0129</code> — рабочий список, туда же смотреть за планами Бога красок («планы Бога красок и дочер» стоит там первым пунктом). <code>PS-0322</code> (Бог красок) — 18,1 КБ базы, самая толстая запись ветки; благословение, которым одарены четверо, объясняться должно оттуда, потому что больше неоткуда. <code>PS-0339</code> (Триколор) — 5,8 КБ базы: если то, что Слава «уже придумал», где-то записано, то там; проверить стоит первым делом, потому что это единственное место, где слова «Её я уже придумал» могут оказаться не пустыми.</p>\n<p>За Градиентом и Монохромом идти в архив — в базе их нет. Ориентир узкий: окно w0114, вечер 2025-12-17, <code>399534</code>–<code>399604</code>, всё уложилось в двадцать минут. Смотреть надо после <code>399604</code> — Слава закрыл разговор фразой «Перечитай занова. Конец», и вопрос в том, был ли возврат в следующие дни. Второй ориентир — реплика «котики» (<code>399603</code>) без пояснения: коты в этом мире идут отдельным нерешённым пунктом того же рабочего списка, и если четвёрку куда-то и продолжили, то, вероятно, там же, где обсуждали котов и Бога красок.</p>\n<h3>Как развивалось</h3>\n<p>Заявили в 22:17 — четвёрка главных последователей, благословение, «чудовищна сильные», имён нет. В 22:19 назвали: триколор, радуга, градиент, монохром, и тут же повесили на Радугу хромакей. В 22:22–22:27 ограничили — весь спор о числе: 21, потом 12 «как по базе», потом 3, потом 4. В 22:29 записали в список дел, что силы и мотивы не придуманы. В 22:31–22:37 дали имя группе и сразу пометили его временным: «мь потом по другому». В 22:37 закрыли: «Перечитай занова. Конец». Возврата в материале нет. Заявили, поспорили о количестве, записали недоделку в список — и не вернулись.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Правило для Бога красок названо прямым текстом и в этом же разговоре: «бог любит все че на 3 делится и чем меньше частное тем больше нравится». По нему тут же проверили три варианта — 3 подошло, 12 подошло («там частное 4»), 21 подошло. Остановились на четырёх. Четыре на три не делится, и это нигде не оговорено: ни как исключение, ни как отмена правила, ни как признак того, что четвёрка стоит вне божьего счёта. Для чисел, которые перебирали, соответствие правилу проговорено; для числа, на котором остановились, — нет.</p>\n<h3>Отклик</h3>\n<p>Лучшее здесь — четыре имени. Триколор, радуга, градиент, монохром: это не имена, это четыре способа обращаться с цветом — фиксированный набор, полный спектр, непрерывный переход, отсутствие цвета вовсе. Систему выдали списком за одну минуту, и ни один из двоих вслух её не назвал; она просто есть. При том что силы у четвёрки не придуманы, из одних имён уже видно, чем они будут отличаться, — редкий случай, когда пустые слоты выглядят осмысленнее заполненных. Зацепил и спор о числе: правило про делимость на три придумал Миколай, придумал для чужого бога, в чужой вселенной, и это правило немедленно повернули против его же предложения — а потом сломали ответом «Я Бог в своё вселенной». Двадцать минут, четыре имени, одна способность, одно временное название, которое так и осталось.</p></div>", "r": []}];</script>
