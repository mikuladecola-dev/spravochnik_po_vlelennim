<script>const BASE="";const DOCNAME="Озеро перерождения";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0067-S01", "MR-0067--ustroystvo"], "h": "<p>Озеро перерождения (варианты названия в переписке: «Озеро перерождения (чёрное озеро)», «озера перерождения», «чёрное озеро») предложено Славой как «добавка в новую вселенную» (2024-12-08, id 268675).</p>\n<p>У озера нет постоянного места: «У этого озера нету точного место положения оно может быть везде».</p>\n<p>Попасть в него по собственному решению нельзя — нужно, чтобы сошлись два условия одновременно: сильное желание и сильное чувство.</p>\n<p>Желание — любое, но такой силы, что заполняет человека целиком: «Человек с большим желанием, любым то бишь вернуть умершую дочь, желание отомстить, желание быть успешным любой настолько сильной желаний что только о нем и думаешь и пытаешься сделать все возможной чтобы оно исполнилось». Названные Славой примеры желаний: вернуть умершую дочь, отомстить, быть успешным.</p>\n<p>Чувство — второе, отдельное условие, «но не только с желанием но и с чувством». Пример разобран пошагово: «вот ты мечтаешь 24/7 о повышении и ты работаешь и делаешь всё возможно чтобы его получить но вдруг тебя уволили и ты испытываешь невероятный чувство при этом у тебя все ещё остаётся это желания». То есть желание сохраняется, а поверх него приходит сильное переживание.</p>\n<p>Попадание непроизвольное: «И вот когда будут и чувство и желание ты сможешь попасть в озеро перерождения и ты сам не поймёшь как вдруг оказался там». Человек оказывается у озера, не заметив перехода.</p>\n<p>Результат погружения: «И вот нырнув в озеро перерождения то вынернет уже не ты, а что-то похожей на тебя монстр бог или дьявол». Вынырнувшее существо похоже на прежнего человека, но им не является.</p>\n<p>Необратимость уточнена по прямому вопросу Миколая: «а че с тобой будет?», «это навсегда?» (id 268683–268684). Слава ответил сперва «Наверное», затем «Навсегда» (id 268685–268686); Миколай ответил «ок».</p>\n<p>Что происходит внутри озера и чем определяется, кем именно человек вынырнет, в переписке не сказано.</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0067-S02", "MR-0067--naselenie"], "h": "<p>Не описано. Об обитателях озера и о том, что становится с вышедшими из него дальше, в переписке ничего нет; названы только три категории того, кем человек выныривает: «монстр бог или дьявол».</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0067-S03", "MR-0067--mesto-vo-vselennoy"], "h": "<p>Вселенная на момент первого описания (2024-12-08) неясна — озеро заявлено как добавка «в новую вселенную». По дате объявления второго упоминания (2024-12-10) вселенная — 7 островов.</p>\n<p>Озеро связано с монстрами-богами (лавкрафтовская концепция) и с камнями желаний.</p>\n<p>Монстры-боги названы Славой в одном перечислении с озером, когда он сводит содержание новой вселенной к двум пунктам: «Ну для начала монстры боги которых фиг победишь как это раньше делал спасатель», «И есть озеро перерождения», «Ну и все» (id 268680–268682). Отличие от прежнего подхода задано через сравнение: этих монстров-богов «фиг победишь», в отличие от того, как раньше делал спасатель.</p>\n<p>Камни желаний упомянуты в том же окне, в соседнем сообщении с переносом озера (2024-12-10, id 269207): «Загадаешь сильная желания и камень сломается и превратиться в твой сосуд дав тебе способность накапливать энергий и по итогу получая структуру, Но ты умрёшь где-то через 10 лет, а умрёшь ты превратившись в камень желаний. Круговорот». Обе механики запускаются сильным желанием, но связь между ними в переписке не проговорена.</p>\n<p>В том же окне Слава называет и другое содержание мира, куда переносится озеро: «И кроме людей хотел бы ещё рас добавить», «Да и монстров» (id 269205–269206). Порядок работы задан так: «Ну для начала построим сам мир его историю и т п. А после будем разделать персонажей на то на все» (id 269209).</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0067-S04", "MR-0067--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-12-08 (id 268672–268688), окно w0066.</strong> Вселенная неясна. Здесь дано всё содержание озера: отсутствие постоянного места, двойное условие попадания (желание плюс чувство) с примерами, непроизвольное попадание, выныривание в виде монстра, бога или дьявола, необратимость превращения.</p>\n<p>Контекст появления: разговор начинается с требования Славы выбросить прежнюю концепцию Миколая — «В третьих опять сука твоя концепций по то что монстры из фантазий вылазит, если да то давай выкинем её. давай начинать новой новым» (id 268672). Миколай соглашается: «ну внешне так, но реализация отличается, но я согласен, но выкинем, вообще я изначально хотел твои идеи услышать ибо у меня наработок особо нет даже к новому, решил просто накидать как чувствую, быстренько» (id 268677). Озеро предлагается на место выброшенной концепции. Разговор Слава закрывает вопросом: «И чё когда историю писать будем ?» (id 268688).</p>\n<p><strong>Версия 2 — 2024-12-10 (id 269205–269210), окно w0066</strong> — помечена в базе как повтор прежней мысли. Вселенная — 7 островов. Слава предлагает перенести озеро в перезапущенный мир: «Озеро перерождения сюда можно засунуть конечно слегка изменив» (id 269208). Что именно предполагалось изменить — не сказано. Механика озера здесь не пересказывается и не правится, только переносится.</p>", "r": []}, {"t": "Отклонённые варианты", "a": ["S05", "MR-0067-S05", "MR-0067--otklonennye-varianty"], "h": "<p>Отклонена не сама механика озера, а концепция, на смену которой оно пришло: задумка Миколая, где «монстры из фантазий вылазит». Слава предложил её выбросить, Миколай согласился, отметив, что внешне похоже, «но реализация отличается» (id 268672, 268677). В чём состояла реализация Миколая, в этих сообщениях не раскрыто.</p>\n<p>Отказ от этой концепции самого озера не затронул — при перезапуске его оставили.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "MR-0067-S06", "MR-0067--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Второе упоминание относится уже к другой вселенной, а изменения не расписаны: сказано только «слегка изменив». Что именно менять — осталось нерешённым.</li>\n<li>Не сказано, чем определяется, кем именно вынырнет человек — монстром, богом или дьяволом.</li>\n<li>Не сказано, исполняется ли желание, которое привело человека к озеру, и что происходит с самим желанием после перерождения.</li>\n<li>Не сказано, что происходит внутри озера.</li>\n<li>Не сказано, можно ли не нырнуть, оказавшись у озера, и что будет в этом случае.</li>\n<li>Не сказано, видят ли озеро посторонние и может ли к нему попасть кто-то, кроме несущего желание с чувством.</li>\n<li>Ответ «навсегда» дан после колебания («Наверное» — «Навсегда»); исключения и обходные пути не обсуждались, дальше вопрос не разбирался.</li>\n<li>Связь озера с камнями желаний, названными в соседнем сообщении, не оговорена, хотя обе механики запускаются сильным желанием.</li>\n<li>Насколько часты такие случаи и сколько людей проходит через озеро — не сказано.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["MR-0067--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-12-08</td>\n<td>268672–268688</td>\n<td>w0066</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-10</td>\n<td>269205–269210</td>\n<td>w0066</td>\n<td>7 островов (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0067-ozero-pererozhdeniya.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0067--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0067.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
