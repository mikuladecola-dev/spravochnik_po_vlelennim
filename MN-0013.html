<script>const BASE="";const DOCNAME="Деревня-гигант";
const LEAD="";
const CH=[{"t": "Где находится — в каком мире и в каком его месте", "a": ["S01", "MN-0013-S01", "MN-0013--gde-nahoditsya"], "h": "<p>Деревня-гигант находится в Азии, на горе высотой около 3000 метров. Гора — «не просто гора, а старейший вулкан». Вокруг вулкана земли стабильные, но есть гладкие каменные плоскости; слой земли «крайне маленький по общим меркам и близок к активной магме» (2024-12-11, id 269369).</p>\n<p>Вулкан окружён, «можно сказать», кольцом из гор пониже. Про кольцо сразу сделана оговорка: «кольцо не идеальное и скорее это огооворка, по карте так не скажешь, но функция у него схожа».</p>\n<p>Название дано «из-за площади поселения и количества жителей». В переписке место называют также просто «горой».</p>\n<p>Принадлежность к вселенной прямо не объявлена. Материал писался после решения вернуться к 7 островам и обнулить мир; позже Слава отделяет «твою гору» от 7 островов (id 269851).</p>", "r": []}, {"t": "Что собой представляет", "a": ["S02", "MN-0013-S02", "MN-0013--chto-soboy-predstavlyaet"], "h": "<p><strong>Расслоение по высоте.</strong> «богатые люди живут внизу, ученые в середине, рабочие и бедные на верху» (id 269369).</p>\n<p><strong>Изоляция.</strong> «это относительно изолированное поселение, трудно сказать к какому государству оно принадлежит, но и не тайное. во внешней политике оно не участвует, однако сотрудничает по программе обмена с крупными университетами» (id 269369).</p>\n<p><strong>Облака как главная особенность.</strong> «главная особенность этого места облака. есть наука нефология изучающая облака, так вот для них эти знания бытовая и жизненная необходимость ибо уже не первое тысячелетие они исследуют их и имеют инструменты для использования в повседневной жизни» (id 269369).</p>\n<p><strong>Историческая справка о происхождении поселения</strong> (id 269369, дословно): «было кочевое племя, им было холодно на земле и они полезли к солнцу на гору, а как забрались, поняли что в них \"врезалось\" облако. они первый раз наблюдали за ним в близи, это было интересно. а, как оно прошло их семена(ну овощей всяких) проросли. некоторых хватило недуг. спускать больных не удобно, оставлять жалко и противоречит обычаям. вот и поселились там исследуя облака».</p>\n<p><strong>Система работы с облаками.</strong> «сейчас там уже своя продуманная система: они могут создавать облака, ловить и хранить их».</p>\n<p>Цепочка описана целиком (id 269369):</p>\n<ul>\n<li>давно прорубили канал для реки в деревню — «во первых потому что деревень без воды вблизи не бывает, а она была далеко»;</li>\n<li>установили управляемые дамбы, периодически их открывают;</li>\n<li>вода течёт на «расколенные низменности» и испаряется;</li>\n<li>поверхность настолько горячая, что «до 5 метров действительный пар», после он частично превращается в туман, но продолжает подниматься;</li>\n<li>на высоте 2,5 км туман сталкивается с ветром, «который выходит из-за гор полученный течением»;</li>\n<li>ветер формирует из тумана облака; «из-за четких пропорций, они не вырастают больше 10 метров» и врезаются ближе к вершине;</li>\n<li>там, «на специальных мостиках - бышах», нефители ловят облака «в специальную ткань из специального материала и с особенной фактурой»;</li>\n<li>«используя родовую энергию могут перемещать облака не испортив их».</li>\n</ul>\n<p><strong>Кто что делает с пойманными облаками.</strong> «обычные жители просто поливают огород этими облаками в основном, но ученые от рабочих получают облака, которые те через жерло вулкана кидают на середину горы. а после типа в лабораториях делают различные исследования с облаками. увеличивают плотность, уменьшают, заражатют вирусами и тд» (id 269369).</p>\n<p><strong>Заражённые облака.</strong> «если зараженное облако съест или вдохнет человек естественно он заболеет и причем сильно, а избавится от болезни только выдохнув облако» (id 269369).</p>\n<p>Автор сам обозначает границу проработки: «у них множеств всяких экспериментов с облаками но это я не продумал уже» (id 269369).</p>\n<p><strong>Водоёмы.</strong> На вопрос Славы «Типо где они / И какие» (id 269391–269392) уточнено: «есть реки, но они далеко за горами», «а чтобы деревня функционировала нужна вода», «поэтому они прорыли каналы», «и эту воду пустили по кругу». «а как-раз тем кто на верху не нужны реки / потому что у них есть облака» (id 269393–269398).</p>", "r": []}, {"t": "Что с ним связано — предметы, механики, силы", "a": ["S03", "MN-0013-S03", "MN-0013--chto-s-nim-svyazano"], "h": "<ul>\n<li><strong>Нефология</strong> — наука, изучающая облака; для жителей это «бытовая и жизненная необходимость», исследуют облака «уже не первое тысячелетие».</li>\n<li><strong>Быши</strong> — специальные мостики ближе к вершине, с которых ловят облака.</li>\n<li><strong>Ткань для ловли облаков</strong> — «из специального материала и с особенной фактурой». Состав не назван.</li>\n<li><strong>Родовая энергия</strong> — с её помощью перемещают облака, не испортив их. Как она устроена — в переписке не сказано.</li>\n<li><strong>Управляемые дамбы и прорубленный канал реки</strong> — начало цепочки образования облаков.</li>\n<li><strong>Жерло вулкана</strong> — через него рабочие сверху кидают облака учёным на середину горы.</li>\n<li><strong>Заражённые облака</strong> — результат лабораторных экспериментов; болезнь уходит только через выдох облака.</li>\n<li><strong>Облака как оружие</strong> — «облака это ебать оружие может быть интересное»; «там крч есть действительно интересная технология как делать разные темки с ними». Тут же оговорка: «пока у меня глупая идея и не зрелая» (2024-12-11, id 269423–269426).</li>\n</ul>\n<p><strong>Раса деревни-гиганта (нефители).</strong> Рассказывать о расе Миколай в тот вечер отказался («Как я понял о расе сейчас ты не расскажешь ? — да»), но по просьбе Славы описал признаки (id 269404): «они долгожители, у них темно-синяя кожа(но при этом эти крайняя форма нормальной человеческой), вес небольшой, но легкие большие и ноздри. эти черты больше у обычных жителей и рабочих которые на верху, тобиж в расе есть разные виды, вот ученых от обычных людей почти не отличить».</p>\n<p>Отсюда следствие для обмена с университетами: «поэтому им не сложно уезжать в университет», «из спокойно принимают» (id 269405–269406).</p>\n<p>Обратная сторона обмена: «а вот тех кто приезжает к них они не знакомят с облаками, типа о них просто факт есть, они изучают погоду и всё, сильно о них не распространяются», «кто тоже в метеорологи идет, тут учиться» (id 269407–269408).</p>\n<p><strong>Страхи, связанные с небом.</strong> «есть разные страхи связанные с небом»; «один из них например это монстры которые находятся в небе»; «или например есть страх упасть в небо прикинь», «думаю тоже его использовать», «ну и другое» (id 269382–269388).</p>\n<p><strong>Парейдолия.</strong> В переписку внесена справка: парейдолия — «это психологический феномен, когда человек видит знакомые образы в случайных объектах или узорах». В облаках — животных, лица, предметы; другие частые примеры — лица в розетках, фигуры в пятнах на стенах, образы в узорах на обоях, силуэты в тенях. Явление объясняется тем, что мозг пытается структурировать случайную информацию, ищет знакомые паттерны, стремится придать смысл хаотичным формам. Историческая роль — в создании мифов, религиозных видениях, народных приметах, искусстве (id 269428). Комментарий автора после справки: «есть такая хуйня».</p>\n<p><strong>Облачные монстры.</strong> «пока-что монстров нет», «пока только легенды и божества увиденные в облаках и записаные» (id 269443–269444). «собираясь на эти вайбы можно монстров создавать, но интереснее» (id 269462). Отдельная реплика: «кста, рил облачных монстров пиздец мало придумали» — с уточнением, что речь о том, что «люди пока такое создали, это есть», «а не рил существуют» (id 269464, 269468–269470). Оценка образа: «ага, и страшно и красиво»; «я лично как увидел в апреле, сразу влюбился», «а сейчас раз я близком небом работаю из вспомнил» (id 269475–269479).</p>\n<p><strong>Мифология местности.</strong> «это очень необычная местность», «в которой ещё мизологию никто не писал почти», «можно будет легенды писать представляя их ракурс и пейзажи» (id 269446–269448).</p>", "r": []}, {"t": "Персонажи и события — кто с ним связан и что там происходило", "a": ["S04", "MN-0013-S04", "MN-0013--personazhi-i-sobytiya"], "h": "<p>С монументом связана История про приезжего учителя (названа в связях записи; её содержание в приведённой переписке не изложено).</p>\n<p>Главный герой на момент разработки не придуман: «пока идей конкретно для гг нету» (id 269350); «если ты о гг чет придумал или придумаешь то пиши / ибо у меня нет идей / но я постараюсь тоже придумать» (id 269371–269373). Слава напоминает про заказ: «Я тебе говорил предложить способность который подойдёт к гг» (id 269346) и «Ты только не забывай о концепций силы» (id 269383).</p>\n<p>Слава просит не бросать линию: «Только прошу тебя не забей на это идею», «Про все», «Монстры раса облака», «Не забьешь на ней ?» (id 269430–269438). Ответ: «ну мне она нравится я хочу её развивать», «темочки есть прикольные», «знаю как с этим работать можно», «ладно, не знаю но предполагаю» (id 269439–269442). И далее: «Давай развивай развивай» (id 269449).</p>", "r": []}, {"t": "Как менялся по версиям — по датам", "a": ["S05", "MN-0013-S05", "MN-0013--kak-menyalsya-po-versiyam"], "h": "<p>Вся разработка укладывается в один вечер (2024-12-11, окно w0066) и делится на три состояния.</p>\n<p><strong>Версия 1 — 2024-12-11 (id 269341–269373).</strong> Основное описание одним текстом (id 269369): расположение и вулкан, расслоение по высоте, изоляция и обмен с университетами, историческая справка про кочевое племя и врезавшееся облако, готовая система работы с облаками, заражённые облака.</p>\n<p>Рамка задачи задана заранее: «моя история мне ценнее введением концепции которая развита на определенной территории» (id 269342). Население решено оформить как расу: «ты говорил насчет рас / думаю можно их категоризировать как расу / рассказать о концепции» (id 269343–269345). Почему пишется концепция, а не история: «ну историю сложнее написать чем концепцию / поэтому концепцию хочу написать / я её продумал примерно» (id 269353–269355). Самооценка после публикации текста: «да, не самая сильная и конкретно о расе почти не написал, но вот крч что есть» (id 269370).</p>\n<p><strong>Версия 2 — 2024-12-11 (id 269379–269408).</strong> Дополнения по вопросам Славы. Реакция на текст: «Мне понравилась» (id 269379). Добавлены: страхи, связанные с небом; водоёмы (реки далеко за горами, прорытые каналы, вода пущена по кругу, наверху реки не нужны из-за облаков); признаки расы. Здесь же — «я эти 2 дня люто изучал че такое облака и многое понял» (id 269399).</p>\n<p><strong>Версия 3 — 2024-12-11 (id 269422–269490).</strong> Облака как возможное оружие, справка о парейдолии, легенды и божества, увиденные в облаках, состояние по монстрам («пока-что монстров нет»), заявка на мифологию местности.</p>\n<p>Вечер закрыт так: «короче лан, на сегодня всё / я ещё буду думать / но сказать нечего», «ну типа все мысли что я надумал я высказал и теперь пустой», «ну да, я одну и туже мысль повторил», «но, главное что знаю куда думать / это святое» (id 269480–269487).</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "MN-0013-S06", "MN-0013--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вселенная прямо не названа. Материал писался после решения вернуться к 7 островам и обнулить мир; позже Слава отделяет «твою гору» от 7 островов (id 269851).</li>\n<li>Раса не описана как раса — только признаки. «конкретно о расе почти не написал» (id 269370); прямой отказ раскрывать её в тот вечер (id 269400–269401).</li>\n<li>Эксперименты с облаками не расписаны: «у них множеств всяких экспериментов с облаками но это я не продумал уже» (id 269369).</li>\n<li>Монстров в небе на момент переписки нет — только легенды и божества, увиденные в облаках (id 269443–269444).</li>\n<li>Идея облаков-оружия не доведена: «пока у меня глупая идея и не зрелая» (id 269426).</li>\n<li>Мифология местности не написана: «в которой ещё мизологию никто не писал почти» (id 269447).</li>\n<li>Главный герой и подходящая ему способность не придуманы (id 269350, 269371–269372).</li>\n<li>Государственная принадлежность поселения оставлена неопределённой — «трудно сказать к какому государству оно принадлежит».</li>\n<li>Материал ткани для ловли облаков и природа родовой энергии не названы.</li>\n<li>Страхи, связанные с небом, перечислены двумя примерами (монстры в небе, страх упасть в небо) и закрыты словами «ну и другое» — остальные не названы.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MN-0013--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0034.html\">Нефители (раса деревни-гиганта)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MN-0013--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-12-11</td>\n<td>269341–269373</td>\n<td>w0066</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-11</td>\n<td>269379–269408</td>\n<td>w0066</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-11</td>\n<td>269422–269490</td>\n<td>w0066</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/monumenty/MN-0013-derevnya-gigant.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MN-0013--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MN-0013.md</code> — они переживают пер
