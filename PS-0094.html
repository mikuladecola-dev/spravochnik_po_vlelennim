<script>const BASE="";const DOCNAME="Вика";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0094-S01", "PS-0094--proishozhdenie"], "h": "<p>Появилась 7 июня 2024 года в том же разговоре, что и Ваёль (<a href=\"PS-0093.html\">Ваёль</a>) (2024-06-07, id 176728–176765, окно w0036). Названа по имени только в тексте истории, выложенной на канале Миколая и процитированной Славой (176753). До этого в разговоре обсуждается женская фигура на рисунке Миколая, но именем она там не названа.</p>", "r": [["Ваёль", "PS-0093.html"]]}, {"t": "Внешность", "a": ["S02", "PS-0094-S02", "PS-0094--vneshnost"], "h": "<p>Из обсуждения рисунка (176728–176749). Слава о фигуре: «Только девка которая фоткаться на мужика похож» (176706), на что Миколай ответил «Так и должно быть» (176707).</p>\n<p>Миколай специально добивался полноты: «Кста, получилось её пухленькой сделать?» (176747). Возраст назван косвенно: «Бля, этой тётке за 40, а она такой хуйней страдает» (176742).</p>\n<p>На животе — вырезанное число. Слава: «Типо он пялится на цифру у живота ?» (176730), Миколай: «Эта цифра вырезана лезвием, которая на столе лежит» (176734). Миколай пытался передать глубину надрезов, по его словам, безуспешно (176740–176741). Слава предложил добавить кровь: «Ты б хотя бы красным покрасил или что типо кровь течет ( в цветной версий)» (176737) — Миколай: «Хорошие мысли» (176739). Сделан ли этот вариант, в переписке не сказано.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0094-S03", "PS-0094--harakter"], "h": "<p>Из текста истории (176753).</p>\n<p>Слушательница музыки Ваёля, единственная из его аудитории, кто не выделяет его творчество в отдельный плейлист, а «в каждой подборке оставляет его творчество, ведь его тематика всегда верно передаёт её вайб» (176753).</p>\n<p>Состояние: «И в последнее время она стала говорить, что часто его слушает, да и в чате можно было убедиться. Она постоянно говорила об ужасных желаниях оборвать жизнь» (176753).</p>\n<p>Положение в чате: «Пусть она и в чате, активности по отношению к участникам к сожалению она почти не проявляет, ведь её уже давно игнорируют» (176753).</p>\n<p>Реакция на общение с Ваёлем: «Вике было грустно, но всё-таки Ваёль смог её успокоить» (176753).</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0094-S04", "PS-0094--svyazi-s-drugimi"], "h": "<p><strong>Ваёль (<a href=\"PS-0093.html\">Ваёль</a>)</strong> — её кумир и собеседник. Он заметил её состояние и написал ей в личку под ником юзер764, скрыв, кто он: «Она не знала, что с ней общается кумир» (176753). «Они общаются целую неделю и за это время очень сблизились» (176753).</p>\n<p><strong>Участники музыкального чата</strong> — группа, где обсуждают музыку; фанатов Ваёля там около шести. По отношению к Вике названо только то, что её давно игнорируют.</p>", "r": [["Ваёль", "PS-0093.html"]]}, {"t": "Как менялась", "a": ["S05", "PS-0094-S05", "PS-0094--kak-menyalas"], "h": "<p><strong>Версия 1 — 2024-06-07 (id 176728–176749).</strong> Только изображение: женщина за 40, полная, с вырезанным лезвием числом на животе, само лезвие на столе. Имя не звучит.</p>\n<p><strong>Версия 2 — 2024-06-07 (id 176744–176766).</strong> В тексте начала истории появляется Вика — слушательница Ваёля, участница чата, о которой известны её состояние, её отношение к музыке Ваёля и неделя переписки с ним.</p>\n<p>Обе версии относятся к одному вечеру и не отменяют друг друга.</p>", "r": []}, {"t": "Что с ней стало", "a": ["S06", "PS-0094-S06", "PS-0094--chto-s-ney-stalo"], "h": "<p>Начало истории обрывается на «И всё бы было так вкусно сладко и приторно, пока Ваёль не предложил..» (176753). Что было дальше с Викой, в переписке не изложено; продолжение дано только ссылкой-заголовком «| Продолжение» (176756) с пометкой «У этих работ довольно-таки жуткое содержание».</p>\n<p>В версии 1 описана сцена, где женщину заставили вырезать на себе число и дальше над ней издевались, «чтобы показать людям» (176738) — но что это Вика, в переписке не заявлено.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0094-S07", "PS-0094--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Совпадение Вики из текста и женщины с рисунка прямо не заявлено.</li>\n<li>Возраст Вики в тексте истории не назван; «за 40» относится к фигуре на рисунке.</li>\n<li>Что именно предложил ей Ваёль и чем это кончилось — в переписке не сказано.</li>\n<li>Значение числа, вырезанного на животе, не объяснено.</li>\n<li>Никаких данных о жизни Вики вне чата (работа, окружение, город) в переписке нет.</li>\n<li>Не сказано, узнала ли она, что юзер764 — это Ваёль. В тексте говорится, что «Тосыч узнал с кем имеет дело», а не она.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0094--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0093.html\">Ваёль</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0093.html\">Ваёль</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0007.html\">Новый мир</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0094--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-06-07</td>\n<td>176728–176749</td>\n<td>w0036</td>\n<td>Новый мир (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-06-07</td>\n<td>176744–176766</td>\n<td>w0036</td>\n<td>Новый мир (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0094-vika.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0094--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0094.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
