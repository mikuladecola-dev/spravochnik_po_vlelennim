<script>const BASE="";const DOCNAME="Тоха";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0264-S01", "PS-0264--proishozhdenie"], "h": "<p>Тоха появляется 2025-05-02 в окне w0089 (id 323364–323370) — весь материал о нём выложен Славой одним заходом, в виде рассказа от первого лица. Рассказчик — Иван Васильевич, лесоруб: «Я Иван Васильевич. Простой имя легко запомнить. Я был дровосеком». Свой текст он адресует читателям и объясняет, зачем пишет: «И это текст нужен именно для того, что закинуть этого паразита сюда, а самому возродиться подобное Фениксу».</p>\n<p>Тоха — один из восьми человек бригады лесорубов, в которой работает рассказчик. Работа законная, рубка леса; бригада выезжает в тайгу «как-то осенью… где то в октябре» на небольшой участок рядом с горой, в которой много пещер — «Природный пещеры вроде как. Ну я не увидел там опор, поэтому посчитал эту пещеру природной».</p>\n<p>Второе имя персонажа даётся в момент, когда он впервые называется по ходу похода в пещеру: «Первым пошёл Тоха ну для вас Григорий». То есть Тоха — то, как его зовут в бригаде, Григорий — имя, которое рассказчик сообщает читателям. Фамилия, возраст и что-либо о жизни Тохи вне бригады в переписке не сказано.</p>", "r": []}, {"t": "Характер", "a": ["S02", "PS-0264-S02", "PS-0264--harakter"], "h": "<p>Отдельного описания характера в тексте нет; о Тохе известно только то, что видно по его поведению в двух эпизодах.</p>\n<p>В пещере он идёт первым, и рассказчик отдельно оговаривает, что это не его инициатива: «Первым не из гибкого желания, а от того что имеет удивительные особенности».</p>\n<p>Первым замечает движение во тьме и не может внятно сказать, что именно увидел: «Тот встал как вкопанные и светит куда-то и говорит нам. — там что-то двигается». На расспросы бригады отвечает несвязно: «Он нормально сказать не может. То тьма, то нога, то тень, какая тень во тьме».</p>\n<p>Ночью, на дежурстве у пещеры, Тоха «который уже весь день глазел в пещеру отошёл. Чуть ли не запнулся» и побежал, ничего не сказав. Рассказчик, который в тот раз ничего не увидел и потому боялся слабее, отстал: «И поэтому я не как не мог догнать Тоху, который подгоняемым страхом далеко убежал». В лагере оба смеялись над собой, вспомнив, что бежали от твари с оружием в руках: «Уже когда прибежали в лагере. То вспомнили, что как бы у нас оружия. И даже посмеиваться над собой начали».</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0264-S03", "PS-0264--sposobnosti"], "h": "<p>Основная и единственная названная — географическая память. Формулировка рассказчика: «Одно из них его географическая память, он может легко ориентироваться в новом городе или лесу».</p>\n<p>Оборот «одно из них» означает, что особенностей у Тохи несколько, но остальные в переписке не названы.</p>\n<p>Пример работы способности — эпизод с плутанием в лесу, который рассказчик приводит как отступление. Одному из бригады показалось, что в лесу совсем один ребёнок; он побежал к ребёнку помочь, «а ребёнок удирать то начал». Бригада, не разобравшись, побежала следом за товарищем, бежали долго и догнали его только тогда, когда он сам упал от бессилия. Ребёнка при этом не видел никто, кроме него: «а мы этого ребёнка пока за ним бежали не увидели. Не кто из нас». Обвинять его во вранье не стали — «Сколько лет работаем. Знаем что он мужик не любящий подобный юмор», — и о возможном глюке сказать постеснялись. Отдохнув, бригада двинулась обратно и обнаружила, что никто не понимает куда: «Стояли так репу чесали. Как Тоха живо нас всех сориентировал. И мы обратно выбрались ещё более коротким маршрутом».</p>\n<p>Из-за этой способности Тоха и был в бригаде штатным ведущим: «А вот поэтому то Тоха первый шёл. Был нашим навигатором».</p>\n<p>Второе применение способности — бегство из пещеры: «Благо Тоха протолкнуться вперёд всех и начал координировать наш в бег. Если бы не он разбежались бы мы по этой пещере и забывая как звали».</p>\n<p>Механика способности не объясняется: как именно она работает, есть ли у неё цена или ограничения, врождённая ли она и связана ли с чем-либо ещё во вселенной — в переписке не сказано.</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0264-S04", "PS-0264--svyazi-s-drugimi"], "h": "<p><strong>Бригада лесорубов</strong> — Тоха её часть, всего в бригаде 8 человек. В переписке названы: рассказчик Иван Васильевич, бригадир (пятидесятилетний, «всегда был таким человеком, который хочет потушить угли нежели потом тушить пожар»), Игорь — самый младший, затеявший поход в пещеру, Михаил (Мишка) — самый крупный и «парням винящий в первую очередь себя», и сам Тоха. Остальные трое поимённо не названы.</p>\n<p><strong>Иван Васильевич</strong> — рассказчик. С Тохой стоит в одной паре на дежурстве у пещеры и оказывается рядом в момент его гибели; сам он предпочёл бы дежурить с Михаилом: «Хотя я всё же хотел пойти с Мишой с ним как-то надёжнее». После смерти Тохи Иван проверяет у него пульс и берёт из его рук двустволку, из которой стреляет твари в голову.</p>\n<p><strong>Бригадир</strong> — распределяет дежурство. Изначально хотел ставить по одному, но после категорического отказа Игоря и Михаила поставил по двое: Иван с Тохой и Игорь с Михаилом, смена каждый час, по одной двустволке на группу (вторая остаётся у той группы, что охраняет раненых в лагере).</p>\n<p><strong>Тварь из пещеры</strong> — существо, которое Тоха первым замечает в пещере и от которого гибнет. Описание твари даётся рассказчиком в момент удара: четвероногая, похожая на большую чёрную худую собаку, но тело и лапы «чём-то походили на человеческий», а на морде ото лба до носа — лезвие: «Представьте топор и эту острую часть сняли с топора и нацепили на морду собаки. Только у неё это видимо родной». Кровь у неё не идёт, вместо неё «что-то только черная, как смола».</p>\n<p><strong>Географическая память Тохи</strong> — вынесена в связанные как отдельная сущность.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S05", "PS-0264-S05", "PS-0264--kak-menyalsya"], "h": "<p><strong>2025-05-02 (id 323364–323370)</strong> — единственное состояние. Персонаж появляется, получает имя, способность и гибнет внутри одного текста, выложенного одним заходом. Переработок, версий и отклонённых вариантов в переписке нет.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S06", "PS-0264-S06", "PS-0264--chto-s-nim-stalo"], "h": "<p>Погиб в лагере, в ту же ночь, что и дежурство. Тварь, за которой Тоха и Иван прибежали из-под горы, вышла из пещеры — чего бригада не ожидала: «Тогда не думали, что тварь то та вылезет из пещеры. Подумали, что не может она покинуть пещеру».</p>\n<p>Удар пришёлся в спину: «Когда Тоху в спину врезалась тварь то та. И в этот момент я мог разглядеть еë в полной красе». Тварь ударила лезвием на морде — «И вот этим топором она вонзилась в спину Тохи. Глупо вонзилась тварь то поганая». Иван стоял в шаге и был залит кровью в лицо, на мгновение ослеп и запаниковал.</p>\n<p>Смерть подтверждается тем же Иваном: «Я же всё это время проверял пульс у Тохи и не как не мог еë нащупать». Оружие Тохи Иван забирает и стреляет твари в голову — попадает, но эффекта нет: «Лишь слегка разлетелась та жижа в нём и все».</p>\n<p>Тоха — единственная смерть в бригаде. Тварь позже забили всей бригадой палками и подручным, после чего со стороны горы раздались десятки, «если не сотни» рёвов, и бригада уехала «без потерей».</p>\n<p>После случившегося бригада позвонила в полицию; сначала не восприняли всерьёз, потом перезвонила фармацевтическая компания, лично приехала, взяла показания и дала подписать бумагу о неразглашении с выплатами — у Ивана это «как мои 6 зарплат». Похороны Тохи оплатила та же компания: «Похороны Тохи они также оплатили. И оплатили медицинский расходы». При этом своих препаратов компания не предоставила, хотя, по словам Ивана, «их ней препараты могут и конечность отрастить», — из-за чего ему ампутировали руку.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0264-S07", "PS-0264--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Внешность Тохи не описана вообще — ни роста, ни возраста, ни одежды.</li>\n<li>Фамилия не названа. Как соотносятся имена Тоха и Григорий, кроме реплики «ну для вас Григорий», не поясняется.</li>\n<li>«Одно из них его географическая память» — прямо сказано, что особенностей несколько, но другие в переписке не названы.</li>\n<li>Механика географической памяти не объяснена: происхождение, цена, ограничения, связь со вселенной Нимб — ничего этого нет.</li>\n<li>Текст противоречит себе в том, кто вывел бригаду из пещеры: сначала «Благо Тоха протолкнуться вперёд всех и начал координировать наш в бег», затем в том же сообщении «Не могу нарадоваться что Игорь первый бежал. Он нас быстро к выходу вывел». Противоречие в переписке не разрешено.</li>\n<li>Почему тварь ударила именно Тоху — не сказано. Связи между его способностью и тем, что он первым замечал тварь оба раза, в переписке не проводится.</li>\n<li>Фармацевтическая компания, оплатившая похороны, не названа. Кто она и как связана с тварями — не сказано.</li>\n<li>Ничего о жизни Тохи вне бригады: семья, откуда он, сколько работал с ними.</li>\n<li>Эпизод с ребёнком в лесу остаётся необъяснённым: кто был этот ребёнок и связан ли он с чем-либо ещё — в переписке не сказано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0264--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0073.html\">Бригада лесорубов</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0073.html\">Бригада лесорубов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0264--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-05-02</td>\n<td>323364–323370</td>\n<td>w0089</td>\n<td>Нимб (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0264-toha.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0264--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0264.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
