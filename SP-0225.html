<script>const BASE="";const DOCNAME="Способности Серафима";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0225-S01", "SP-0225--mehanika"], "h": "<p>Набор из четырёх сил, записанных в скобках при Серафиме одной строкой: «Серафим ( манипуляция сознанием; контроль времент; управлений светом; огонь Божий)🪽🪽🪽» (2025-05-14, id 325799). Написание «контроль времент» — авторское, в списке вариантов имени сущности оно сохранено как есть; по смыслу это контроль времени.</p>\n<p>Сами силы в переписке не расписаны: ни одна из четырёх не получила ни описания механики, ни примера применения. Зафиксирован только перечень:</p>\n<ol>\n<li>манипуляция сознанием</li>\n<li>контроль времени</li>\n<li>управление светом</li>\n<li>огонь Божий</li>\n</ol>\n<p>Три пары крыльев в эмодзи при имени (🪽🪽🪽) стоят вместо описания и в тексте никак не оговорены.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0225-S02", "SP-0225--ogranicheniya-i-cena"], "h": "<p>Ограничений и цены в переписке нет — ни для набора целиком, ни для отдельных сил. Не сказано, применяются ли силы одновременно или по одной.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0225-S03", "SP-0225--nositeli"], "h": "<p>Серафим. Он идёт в разделе «Сторонний силы» — не среди Апостолов, не среди Врагов, не среди Церкви и не среди Военных. В том же разделе с ним стоят Породитель и Провидец, у которых способностей в скобках не проставлено.</p>\n<p>Отдельной репликой сразу после списка Слава добавляет про Серафима: «Он жив» (id 325800).</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0225-S04", "SP-0225--kak-menyalas-po-versiyam"], "h": "<p>Одна версия.</p>\n<p><strong>2025-05-14 (окно w0094, id 325798–325801).</strong> Способности появляются не в отдельном обсуждении, а внутри общей ревизии — Слава выкладывает сводный перечень вселенной по разделам: Апостолы (четырнадцать позиций, у большинства в скобках проставлены противники или связанные фигуры), Одержимый, Враг, Церковь, Военный, Сторонний силы, Существа, Аномалий, Оружие, Артефакты, Идей. Четыре силы Серафима — единственная запись во всём списке, где в скобках перечислены именно способности, а не персонажи.</p>\n<p>Сразу за списком Слава помечает: «Ну и нужно исправления» (id 325801) — то есть перечень объявлен черновым им самим. Что именно требует исправления, не уточнено; Миколай на список в этих сообщениях не отвечает.</p>\n<p>Правок этого набора в материале дальше нет.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0225-S05", "SP-0225--svyaz-s-drugimi-sposobnostyami"], "h": "<p>В том же списке (id 325799) в разделе «Оружие» стоят «Крылатый мечи 🪽» и «Крылатый клинки 🪽» — с тем же эмодзи крыла, что и при Серафиме. Принадлежность этого оружия Серафиму в переписке не названа.</p>\n<p>Связей четырёх сил с другими способностями вселенной в окне не проговорено.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "SP-0225-S06", "SP-0225--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Механика ни одной из четырёх сил не описана.</li>\n<li>Не сказано, врождённые это силы, полученные или связанные с природой Серафима.</li>\n<li>Ограничения, цена, взаимодействие сил между собой — ничего не названо.</li>\n<li>«Огонь Божий» никак не пояснён: ни происхождение названия, ни отличие от обычного огня.</li>\n<li>Три пары крыльев при имени не объяснены и со способностями явно не связаны.</li>\n<li>Раздел «Сторонний силы», к которому отнесён Серафим, в этом окне не определён.</li>\n<li>Список объявлен требующим исправлений, но какие правки имелись в виду — осталось нерешённым.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["SP-0225--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-05-14</td>\n<td>325798–325801</td>\n<td>w0094</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0225-sposobnosti-serafima.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0225--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0225.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["SP-0225-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/SP-0225/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — носитель. В базе эта запись помечена как часть Серафима, а сущности «Серафим» не существует: ни статьи, ни строки, ни материала. <code>PS-0209</code> «Серафима» — другой персонаж и другой разговор (2 914 знаков базы, ноль ссылок), <code>GR-0008</code> «Команда против Серафима („пати“)» — статья на 23 140 знаков при нулевой базе, то есть целая группа собрана против того, кого в справочнике нет. Четыре силы висят при имени, у которого нет карточки.</p>\n<p>Вторая — дубль. <code>SP-0187</code> «Силы Серафима»: тот же перечень, та же авторская опечатка «контроль времент», только из февральского реестра — 2025-02-25, id 295559, 4 303 знака базы, одна ссылка. Здесь — 2025-05-14, id 325799, 3 861 знак, ноль ссылок. Две статьи об одной строке из четырёх слов, и каждая утверждает про себя «версия одна». Пока они не сведены, майская перевыкладка списка читается как самостоятельное событие, а не как копия февральской.</p>\n<p>Третья — источник. Строка Серафима нигде не живёт, кроме рабочих реестров, а у реестров статей нет: <code>SL-0053</code> — шесть ссылок, 20 313 знаков базы, редакции до 2025-03-06; <code>SL-0090</code> — четыре ссылки, 5 492, обе редакции 2025-05-14; <code>SL-0051</code> — шесть ссылок, 9 834. Это самые нагруженные бесстатейные записи вокруг всей вселенной, не только этой статьи.</p>\n<p>Четвёртая — соседи по разделу. «Сторонний силы» состоит из трёх позиций: Породитель, Провидец, Серафим. У Провидца (<code>ID-0050</code>) 14 549 знаков базы и нет статьи. «Породитель» не заведён вообще — во всей базе на него нет ни одной записи, хотя в реестре он стоит первой строкой раздела. Раздел, к которому отнесён носитель, пуст на две трети.</p>\n<h3>С чего начать</h3>\n<p>В базе, и один пробел статьи закрывается сразу.</p>\n<p>Статья пишет: «Список объявлен требующим исправлений, но какие правки имелись в виду — осталось нерешённым». Ответ лежит через четыре минуты в том же окне — <code>SL-0090</code>, версия 2, id 325805–325808, 12:34. Миколай: «в чем», «убрать кого-то?», «добавить». Слава: «Добавления организация нимб и фантазеров / И перераспределение сил». Правки названы. Это же единственное место во всём материале, где сказано про «перераспределение сил» — а раздел, где стоит Серафим, называется «Сторонний силы».</p>\n<p>Дальше:</p>\n<ul>\n<li><code>SP-0187</code> и <code>SL-0053</code> — свести февральскую редакцию строки с майской и решить, одна это сущность или две.</li>\n<li>За «манипуляцией сознанием» — <code>SP-0169</code> «Контроль разума с ограничением» (4 264 базы, две ссылки): ближайший описанный аналог, с механикой и ограничением.</li>\n<li>За «контролем времени» — <code>ID-0050</code> «Провидец» (14 549, статьи нет): там отмотка времени расписана с ценой. Первым делом проверить, тот ли это Провидец, что стоит рядом с Серафимом в разделе сторонних сил.</li>\n</ul>\n<p>В архив — за крыльями. Три «🪽🪽🪽» при имени и тот же значок при «Крылатых мечах» и «Крылатых клинках» в одном и том же сообщении 325799. Смотреть окно w0094 около 14 мая и февральское w0077 (2025-02-24 — 2025-02-25) — двое суток, самые плотные по перьевой теме.</p>\n<h3>Как развивалось</h3>\n<p>2025-02-25 — строка появляется внутри большого списка; Миколай отвечает на весь список «я прекрасно помню» и разбора не заводит ни по одной позиции. 2025-05-14, 12:29 — тот же реестр выложен заново, строка Серафима слово в слово та же, вместе с опечаткой; сразу за ней две реплики: «Он жив» и «Ну и нужно исправления». 12:34 — правки названы, но они про Нимб, фантазёров и перераспределение сил; Серафима в них нет. Дальше к четырём силам не возвращались. Выложили — не разобрали — переложили тем же составом — правку объявили мимо этой строки.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для апостолов происхождение силы названо: это люди, получившие благословение от правителя рая, и их 21 на весь мир (<code>SL-0054</code>, окно w0083). Разряд задан источником, и по нему же апостолы отделены от прочих благословенных. В том же реестре шестым номером идёт «Дитя света ✨». Серафим стоит вне апостолов, в «Сторонних силах», и владеет при этом «управлений светом» и «огнём Божьим» — то есть двумя вещами, названными через божественное и через свет. Для апостольского света правило происхождения проговорено; для серафимова — нет, и что вообще значит принадлежность к «Сторонним силам», в этом окне тоже не сказано. Показываю место.</p>\n<h3>Отклик</h3>\n<p>Зацепила реплика сразу после списка: «Он жив». Выложены сто с лишним имён — четырнадцать апостолов, тринадцать врагов, церковь, военные, четырнадцать позиций оружия, одиннадцать артефактов, — и единственное, что автор добавляет от себя, это два слова про одного из них. Не механика, не связи, не «вот тут я поправлю» — а ответ на вопрос, который, судя по всему, висел между ними раньше и сюда просто выпал. Такая реплика показывает, что реестр писался не в архив, а человеку: половина смысла осталась в разговоре, и в списке она видна только по тому, где автор притормозил. И сам способ записи в ту же сторону: контроль времени идёт третьим пунктом в скобках, через точку с запятой, между Породителем и Провидцем, и никто не останавливается. Сначала каталог, механика — если дойдут руки.</p></div>", "r": []}];</script>
