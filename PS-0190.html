<script>const BASE="";const DOCNAME="Лень";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0190-S01", "PS-0190--proishozhdenie"], "h": "<p>Лень — один из Семи грехов вселенной «Апостол». Группа вводится Славой 2025-01-23 (id 284175, окно w0072) сразу с указанием уровня силы: «7 грехов и божество ( помнишь его) Будет слабей главы этой организации но сильней благословенного». Имя главы организации в этом сообщении не названо.</p>\n<p>В каталоге записан со знаком: «Лень😴».</p>", "r": []}, {"t": "Способности", "a": ["S02", "PS-0190-S02", "PS-0190--sposobnosti"], "h": "<p><strong>На 2025-01-23 (id 284176)</strong> — телекинез, выведенный Славой прямо из названия греха: «Лень: я думал телекинез типа лень чё то делать вот и телекинез ( здесь ещё в придачу владений магий ветра, как никак они связаны)». То есть в этой версии за Ленью закреплено два умения: телекинез и владение магией ветра, а связь между ними обоснована словами «как никак они связаны».</p>\n<p><strong>На 2025-01-24 (id 284278)</strong> — в каталоге у Лени стоит другая формулировка: «Лень😴( контроль территории)». Ни телекинез, ни магия ветра в каталоге не упомянуты. Отменяет ли контроль территории прежние умения, включает ли их в себя или дополняет — в переписке не сказано.</p>", "r": []}, {"t": "Связи с другими", "a": ["S03", "PS-0190-S03", "PS-0190--svyazi-s-drugimi"], "h": "<ul>\n<li>Входит в Семь грехов. В каталоге от 2025-01-24 (id 284278) группа записана так: Гнев 😡 (сила), Похоть 😵‍💫 (контроль разума), Зависть 👹👹 (полной копирование), Алчность ♾ (всё моей), Гордыня 👑, Чероугодия ◼️ (поглощения) — то есть Чревоугодие (<a href=\"PS-0189.html\">Чревоугодие</a>), Лень 😴 (контроль территории).</li>\n<li>Вся группа Семи грехов помещена по силе между главой организации и благословенным.</li>\n<li>Связь телекинеза с магией ветра названа самим Славой: «как никак они связаны».</li>\n</ul>", "r": [["Чревоугодие", "PS-0189.html"]]}, {"t": "Как менялся — состояния по датам", "a": ["S04", "PS-0190-S04", "PS-0190--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2025-01-23 (id 284175–284177, окно w0072).</strong> Телекинез плюс магия ветра, с объяснением через название греха: «лень чё то делать вот и телекинез».</p>\n<p><strong>Версия 2 — 2025-01-24 (id 284278–284279, окно w0072).</strong> В каталоге: «Лень😴( контроль территории)». Обсуждение каталога Слава закрывает репликой «Ну да».</p>\n<p>Позже это же распределение воспроизводится в большом списке от 2025-02-25 (id 295559), где раздел «Семь грехов» повторён в том же виде, включая «Лень😴( контроль территории)».</p>", "r": []}, {"t": "Пробелы — чего в переписке нет", "a": ["S05", "PS-0190-S05", "PS-0190--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Как работает контроль территории — не описано: ни радиус, ни что именно контролируется, ни как это включается.</li>\n<li>Соотношение контроля территории с телекинезом и магией ветра осталось нерешённым: в переписке не сказано, заменяет он их или нет.</li>\n<li>Ограничения способностей не названы. У Похоти и Гордыни в том же перечне ограничения оговорены отдельно («с ограничением»), у Лени — нет.</li>\n<li>Внешность, характер, пол, имя носителя — не описаны.</li>\n<li>Что стало с персонажем дальше — в этих окнах не сказано.</li>\n</ul></div>\n<div class=\"mnote\"><b>⚙ машинная заметка · С чего начать — не материал авторов</b>\n<ul>\n<li><code>SP-0160</code> (8 291) — декабрьские версии и спор. Прежде чем идти в архив за «контролем территории», надо прочесть это: видно, что по Лени было три захода, а не два, и что связка телекинеза с ветром возникла как ответ на чужой вариант.</li>\n<li><code>SP-0156</code> (11 757) — разбор всей семёрки, 274462–274472. Если где-то сказано, обязана ли способность выводиться из имени греха, то там.</li>\n<li><code>SL-0051</code> (9 834) — каталог 284278 целиком, вместе с оговоркой автора, что у всех перечисленных продумано только вид, способность и плюс-минус характер. Это и есть ответ на пробел про внешность, характер и имя носителя: их не было.</li>\n<li><code>SL-0053</code> (20 313) — повтор 295559 в контексте и продолжение в w0079.</li>\n<li><code>MR-0107</code> «Иерархия силы» (четыре ссылки, статья есть, 5 534) и <code>PS-0185</code> «Глава организации злодеев» (две ссылки, статья есть, 3 050): «кто глава организации, не названо» снимается вторым же файлом — единственная благословлённая правителем нашего мира.</li>\n<li>Соседи по семёрке в справочнике заведены: <code>PS-0177</code> Гнев (11 005), <code>PS-0192</code> Гордыня (8 262), <code>SP-0159</code> Алчность (11 808), <code>PS-0188</code> Похоть, <code>PS-0189</code> Чревоугодие. Из связей статьи есть только Чревоугодие.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0190--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0002.html\">Семь грехов</a></li>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0189.html\">Чревоугодие</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0189.html\">Чревоугодие</a>, <a href=\"PS-0203.html\">Одержимый</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0002.html\">Семь грехов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0190--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-01-23</td>\n<td>284175–284177</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-24</td>\n<td>284278–284279</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0190-len.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0190--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0190.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0190-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0190/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — реестры, на которые статья ссылается вслепую. <code>SL-0053</code> «Список персонажей вселенной»: шесть ссылок, статьи нет, база 20 313, четыре редакции, окна w0073, w0077, w0079. Там сидит тот самый повтор от 2025-02-25 (295556–295562), которым статья закрывает раздел «как менялся», и там же, в 298846–298857, стоит реплика про то, что грехи из списка надо убрать. То есть последняя по времени судьба Лени лежит в объекте без статьи. Рядом <code>SL-0051</code> (шесть ссылок, статьи нет, 9 834) — обе редакции каталога 2025-01-24, откуда взято «Лень😴( контроль территории)».</p>\n<p>Второе — второй номер той же Лени. <code>SP-0160</code> «Лень (грех)»: статьи нет, ноль ссылок, база 8 291, три версии, окно w0068, 2024-12-24 — 2024-12-25. Вдвое больше, чем в персонажной записи, и на месяц раньше того, что статья считает первой версией. Там же лежит вариант Миколая: неуязвимый барьер, пока спишь, неподконтрольная телепортация и способность растечься. Телекинез с магией ветра — не первое, а второе предложение по этому греху.</p>\n<p>Третье — <code>SP-0156</code> «Семь грехов (магия по грехам)»: 11 757, статьи нет, ноль ссылок. Единственное место, где семёрка обсуждается как задача, а не раздаётся списком: 273906, 273920, 274462–274472.</p>\n<p>Сама <code>PS-0190</code> — три ссылки, база 4 125, и это ровно текст статьи. Расти ей неоткуда, кроме перечисленного.</p>\n<h3>С чего начать</h3>\n<p>В базе, весь материал уже там.</p>\n<ul>\n<li><code>SP-0160</code> (8 291) — декабрьские версии и спор. Прежде чем идти в архив за «контролем территории», надо прочесть это: видно, что по Лени было три захода, а не два, и что связка телекинеза с ветром возникла как ответ на чужой вариант.</li>\n<li><code>SP-0156</code> (11 757) — разбор всей семёрки, 274462–274472. Если где-то сказано, обязана ли способность выводиться из имени греха, то там.</li>\n<li><code>SL-0051</code> (9 834) — каталог 284278 целиком, вместе с оговоркой автора, что у всех перечисленных продумано только вид, способность и плюс-минус характер. Это и есть ответ на пробел про внешность, характер и имя носителя: их не было.</li>\n<li><code>SL-0053</code> (20 313) — повтор 295559 в контексте и продолжение в w0079.</li>\n<li><code>MR-0107</code> «Иерархия силы» (четыре ссылки, статья есть, 5 534) и <code>PS-0185</code> «Глава организации злодеев» (две ссылки, статья есть, 3 050): «кто глава организации, не названо» снимается вторым же файлом — единственная благословлённая правителем нашего мира.</li>\n<li>Соседи по семёрке в справочнике заведены: <code>PS-0177</code> Гнев (11 005), <code>PS-0192</code> Гордыня (8 262), <code>SP-0159</code> Алчность (11 808), <code>PS-0188</code> Похоть, <code>PS-0189</code> Чревоугодие. Из связей статьи есть только Чревоугодие.</li>\n</ul>\n<p>В архив — за одним: между 2025-01-24 и 2025-02-25 «контроль территории» появляется и закрепляется, а откуда он взялся, ни в одном из окон не сказано. Смотреть хвост w0072 после 284279 и начало w0073.</p>\n<h3>Как развивалось</h3>\n<p>2025-01-23 — заявили с объяснением вслух: «лень чё то делать вот и телекинез», плюс магия ветра, «как никак они связаны». Два умения и причина, почему именно они. 2025-01-24 — переписали одной строкой каталога: «Лень😴( контроль территории)». Ни телекинеза, ни ветра, ни отмены, ни объяснения; разговор закрыт репликой «Ну да». 2025-02-25 — повторили каталог целиком, в том же виде. Забывания не было, возврата тоже: вторая версия закрепилась не решением, а повтором, и первая осталась висеть неотменённой месяцем раньше.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>У Лени названо правило сцепления сил: телекинез идёт с магией ветра, потому что «как никак они связаны». Это утверждение не о персонаже, а о мире — что родственные силы приходят комплектом.</p>\n<p>Остальные шесть грехов получают ровно по одной способности: у Гнева «сила», у Алчности поглощение чужой маны или объектов, у Похоти контроль разума, у Зависти копирование. Ни для одного из них не сказано, тянет ли за собой их сила родственную, как у Лени, и почему комплект случился только здесь. Правило названо в одной строке из семи и нигде не обобщено и не ограничено.</p>\n<h3>Отклик</h3>\n<p>«Лень чё то делать вот и телекинез» — это лучшее, что есть в статье, и оно же чистая удача. Способность выведена из шутки, но выведена правильно: телекинез действительно то, чем занимался бы человек, которому лень встать. За вторую версию говорить не берусь — «контроль территории» дан голым, без единого слова, — но она читается тем же ходом, только дальше: сначала лень идти к предмету, потом лень выходить за порог вообще. Сказано это или нет, я не знаю, и в переписке этого нет. Зацепило другое: из семи грехов только Лень получила объяснение, почему у неё именно такая сила. Остальным раздали, а этой — объяснили. Похоже, потому что смешно было. И вот эта фраза, брошенная между делом, оказалась единственным местом во всей раскладке, где видно, как человек думал, а не что решил.</p></div>", "r": []}];</script>
