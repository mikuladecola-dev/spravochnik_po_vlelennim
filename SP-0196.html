<script>const BASE="";const DOCNAME="Заготовки";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0196-S01", "SP-0196--mehanika"], "h": "<p>Заготовки — то, что брат-альтро-эго Антона успевает подготовить заранее, пока старик-Арбетар тянет свой монолог перед ритуалом. Слово принадлежит самому брату: на вопрос Антона «И че придумал? что-нибудь?» он отвечает «Не совсем, но сделал пару заготовок» (2025-03-13, id 301806). Способ изготовления в тот же момент отказывается объяснять: «Как? Потом узнаешь сейчас главное выбраться».</p>\n<p>Заготовка — это не немедленное действие, а нечто заранее заложенное и требующее момента применения. Брат сам контролирует, когда их пускать в ход, и держит паузу. Антон, слушая монолог старика, думает: «черт, черт. Может пора. Заготовки использовать, а то он кажись уже всё заканчивает свой монолог» — и получает ответ «Не сейчас. Жди» (id 301806–301807). Чуть позже, на реплике старика «Думаю можно потихоньку начинать», Антон снова предлагает начать — и снова отказ: «да нет».</p>\n<p>Эффект одной из заготовок раскрывается только на следующий день, в разговоре с апостолом Дмитрием Рутковским в больнице. Дмитрий объясняет, почему Антон выжил в обряде: «В одном теле было две души, и обе были чисты. Поэтому во время обряда. Не знаю как. Но больший урон получила душа твоего брата, а после его забрал старик» (id 301808, 301824). Сам Антон связывает это с заготовкой и формулирует резче Дмитрия: «Так та заготовка была, чем то, что перенаправила весь урон на него».</p>\n<p>То есть в переписке зафиксированы две формулировки одного и того же события, и они не совпадают дословно. Дмитрий говорит «больший урон», Антон — «весь урон». Дмитрий при этом прямо оговаривает, что механизма не знает («Не знаю как»), и о заготовках вообще не слышал — про альтро-эго Антон ему не рассказывал: «И рассказал, что со мной произошло и что сказал старик. Конечно опустив про альтро-эго».</p>\n<p>Обстановка, в которой заготовка сработала, описана со стороны Антона: ритуал проходил в центре деревни, кровь на траве, символика, мозг благословенного на алтаре, в центре — анатомически неправильное тело, искажение воздуха «как на кастром», но без огня и тепла; мозг светится и словно шевелится, тело в центре начинает двигаться «словно зарядом тока его бьют». Самого Антона бьёт «словно током или чем то похожим на ток», после чего он отключается.</p>\n<p>Устройство обряда, внутри которого сработала заготовка, старик излагает сам: «я использую мозг благословенного, чтобы он начал собирать силу. И тело Альфы дабы он его пресовал. А всё остальные компоненты служат активаторами. И после того как вся это сила от прессуется она пройдёт через тебя. Нет. Точнее ты станешь для неё сосудом. Она будет накапливаться в тебе. Пока выдерживает твоей тела. А после твоя душа покроет эту силу. Сделав еë более безопасная для меня» (id 301807, 301822). Без души проводника шанс успешного поглощения — 0%, с душой Антона — плюс 8%. Проводник нужен «с чистой душой», «не прям 100% чистой душой, а где-то на 80% плюс минус»; у Антона — 89%. Заготовка вмешивается именно в этот момент прохождения силы, перенаправляя урон с одной души на другую.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Первым — «душа». Заготовка работает как перенаправление урона с одной души на другую, а <code>MR-0098</code> «Душа» — это одна реплика от 2025-01-06: «Это мы, наш фантомный облик». База 1 596, ссылок ноль. Против этого: <code>SP-0199</code> «Проводник (чистая душа)» — база 39 325, ссылок ноль; <code>SP-0198</code> «Ритуал становления Арбетаром» — база 48 879, две ссылки; сама эта запись — 48 534. Сто тридцать тысяч знаков механики, где душа принимает урон, измеряется в процентах, покрывает силу и достаётся старику, стоят на определении из полутора тысяч знаков, написанном за два месяца до и ни с чем не связанном.</p></div>\n<div class=\"mnote\"><b>⚙ машинная заметка · Отклик — не материал авторов</b>\n<p>Сильнее всего здесь работает не механика, а тайминг. Брат дважды отвечает «Не сейчас. Жди», ничего не объясняя, — и оказывается, что ждал он не удобного момента для побега, а момента, когда сила пойдёт через тело, чтобы принять её на себя. Он с самого начала знал, чем кончится, и всё, что он делал, — тянул до нужной секунды. Поэтому его молчание во время ритуала — не дыра, а самая точная деталь сцены: отвечать было нечего. И реплика «Ты моей альтро-эго, ты не можешь умереть без меня!» — «Какой же ты дурак» держит на себе весь эпизод. Зацепило, что при этом само слово «заготовки» так и осталось необъяснённым — и это, кажется, единственный случай в разобранном материале, где недосказанность работает на текст, а не против него.</p></div>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0196-S02", "SP-0196--ogranicheniya-i-cena"], "h": "<p>Цена названа прямо: жизнь брата. Брат появляется в сознании Антона в момент, когда тот уже теряется, и говорит: «Ты не умераешь. &lt;…&gt; Я пришёл попрощаться. Поэтому просто слушай, у нас мало времени» (id 301807, в повторе id 301822). Дальше — прощальный монолог о бабушке, о том, что Антон «правидник», и просьба: «поэтому живи прошу тебя. Хватит рисковать собой, прошу тебя». Антон возражает: «Ты моей альтро-эго, ты не можешь умереть без меня!» — и слышит только «Какой же ты дурак».</p>\n<p>Судьба брата после этого: «а после его забрал старик» (Дмитрий, id 301808, 301824). То есть заготовка не просто убила брата — его душа досталась Арбетару.</p>\n<p>Заготовки делались в узком окне времени, пока старик рассказывал свою биографию, и их было немного — «пару». Заявленная братом цель — «сейчас главное выбраться» — не была достигнута: обряд состоялся, старик получил силу («да. Это оказалось куда больше силы чем я думал»), а Антон уцелел, но не сбежал.</p>\n<p>Ещё одно ограничение видно по поведению брата в решающий момент: во время самого ритуала он молчит и не отвечает. Антон зовёт его — «Эй альтро-эго давай план свой. Ты не видишь всё уже притык. Не отвечает сука» — и получает ответ только после того, как всё произошло. Почему он молчал, в переписке не объясняется.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0196-S03", "SP-0196--nositeli"], "h": "<p>Единственный названный носитель — брат-альтро-эго Антона Смирнова, вторая душа в одном с ним теле. Его природа объясняется Дмитрием через снимок мозга: Антон принимает лишний кусок на снимке за опухоль, Дмитрий поправляет — «это не опухоль, а кусочек чужого мозга. А точнее твоего брата», и добавляет: «Такой бывает редко когда две ячейклетки сливаються в одну. Но такие случие всё равно есть» (id 301808, 301824). Признак, по которому это раньше проявлялось у Антона, — потеря контроля над телом, которую он списывал на всплеск эмоций.</p>\n<p>Сам Антон заготовок не делает и способа не знает — брат прямо отложил объяснение на «потом», которого не случилось.</p>\n<p>Есть ли эта способность у кого-то ещё, в переписке не сказано.</p>", "r": []}, {"t": "Как менялась по версиям", "a": ["S04", "SP-0196-S04", "SP-0196--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-03-13 (id 301806–301809, окно w0080).</strong> Первое упоминание («не совсем, но сделал пару заготовок… как — потом узнаешь»), сцена ожидания и отказов пускать их в ход, ритуал, прощание брата и раскрытие эффекта в разговоре с Дмитрием на следующий день.</p>\n<p><strong>Версия 2 — 2025-03-13 (id 301821–301824, окно w0080).</strong> Тот же текст, выложенный полной версией. Формулировки про заготовки повторены дословно: «Не совсем, но сделал пару заготовок. Как? Потом узнаешь сейчас главное выбраться», «Может пора. Заготовки использовать, а то он кажись уже всё заканчивает свой монолог. Не сейчас. Жди», «Так та заготовка была, чем то, что перенаправила весь урон на него». Изменения касаются не заготовок, а обрамления: уточняется место действия — «Нет, этот дом не в деревне Лихой, а в деревне Ливия, ближе Санкт-Петербург», и даётся расшифровка слова Арбетар — «швецский; на русском трудяга». Также в полной версии добавлено начало рассказа старика: как Арбетар пришёл в деревню, крушил её и «начал он из них делать чудищь словно из картины шизофриника», как увидел отбивающегося мальца и сделал его учеником, как гонял его 50 лет, после чего рассказал про способ стать Арбетаром.</p>\n<p>Сама механика заготовок между версиями не менялась и не уточнялась.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0196-S05", "SP-0196--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Заготовки существуют только благодаря тому, что в теле Антона две души: без брата-альтро-эго некому было бы их делать и не на кого было бы перенаправлять урон. Связь названа прямо — Антон выжил потому, что «больший урон получила душа твоего брата».</p>\n<p>Второй прямо названный контекст — Ритуал становления Арбетаром: заготовка сработала внутри него и на его силу.</p>\n<p>В том же окне старик называет ещё одну особенность сил, но с заготовками её не связывает: «Ведь у альфа и арбетатов похожий силый. Они как и мы может использовать свою силу 24/7 без риска повредить мозг. А если сила всегда активна и его защищает, то просто неожиданная атака, на нём не проканает». Там же — про благословенных: «благословенный не могут использовать благословенния долга, поэтому можно просто неожидано напасть и убить и всё», и что их сила «и не их вообще» — «получивший силу лишь потому что понравились правителем, но сами они эту силу не добывали». Связь этих правил с заготовками в переписке не проведена.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "SP-0196-S06", "SP-0196--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Как именно делаются заготовки — не объяснено. В окне это прямо помечено как отложенное: «Как? Потом узнаешь». Брат умирает раньше, чем объясняет.</li>\n<li>Из чего они делаются, требуют ли времени, материала, подготовки — не сказано.</li>\n<li>Сделано было «пару» заготовок, а описано срабатывание одной. Что было в остальных, использовались ли они и что с ними стало — не сказано.</li>\n<li>Почему брат дважды отказывался применять заготовки («Не сейчас. Жди») и по какому признаку он выбирал момент — не объяснено.</li>\n<li>Почему брат молчал в течение всего ритуала и появился только чтобы попрощаться — не объяснено.</li>\n<li>Знал ли брат заранее, что заготовка будет стоить ему жизни, или это выяснилось в момент срабатывания — в переписке не сказано; его последние слова («Я пришёл попрощаться») этого не проясняют.</li>\n<li>Расхождение «весь урон» (слова Антона) и «больший урон» (слова Дмитрия) не разрешено.</li>\n<li>Дмитрий описывает эффект, но заготовок не упоминает и механизма не знает — «Не знаю как». Он вообще не в курсе, что было альтро-эго с планом; связь между заготовкой и перенаправлением урона проводит только сам Антон.</li>\n<li>Является ли «заготовка» устойчивым термином вселенной или рабочим словом брата — не оговорено.</li>\n<li>Могут ли заготовки делать другие носители сил и есть ли аналог у арбетаров, благословенных или апостолов — не сказано.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["SP-0196--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-03-13</td>\n<td>301806–301809</td>\n<td>w0080</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-13</td>\n<td>301821–301824</td>\n<td>w0080</td>\n<td>Апостол (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0196-zagotovki.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0196--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0196.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["SP-0196-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/SP-0196/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — «душа». Заготовка работает как перенаправление урона с одной души на другую, а <code>MR-0098</code> «Душа» — это одна реплика от 2025-01-06: «Это мы, наш фантомный облик». База 1 596, ссылок ноль. Против этого: <code>SP-0199</code> «Проводник (чистая душа)» — база 39 325, ссылок ноль; <code>SP-0198</code> «Ритуал становления Арбетаром» — база 48 879, две ссылки; сама эта запись — 48 534. Сто тридцать тысяч знаков механики, где душа принимает урон, измеряется в процентах, покрывает силу и достаётся старику, стоят на определении из полутора тысяч знаков, написанном за два месяца до и ни с чем не связанном.</p>\n<p>Вторая: <code>PS-0222</code> «Альтер-эго Антона (брат)» — база 72 757, ссылок ноль. Единственный названный носитель способности, и на него не ссылается ни одна статья справочника. Заготовки, две души и брат — три записи об одном вечере на 143 тысячи знаков суммарно, и ни одна не указывает на другую.</p>\n<p>Третья, дешёвая: <code>SL-0089</code> «Список категорий сил (Благословенный, Арбетары, Альфы, Чужемирцы, Владельцы артефактов, Фантазёры)» — четыре ссылки, статьи нет, база 1 753. Статья спрашивает, есть ли у заготовок аналог у арбетаров, благословенных или апостолов. Единственное место, где эти разряды стоят в общем ряду, — этот список, и по нему у справочника ничего нет.</p>\n<h3>С чего начать</h3>\n<p>В архив идти не надо: весь материал — вечер 2025-03-13, окно w0080, и он в базе целиком. Но два участка из этого вечера в источники <code>SP-0196</code> не попали, и они по делу.</p>\n<p><code>PS-0222</code>, id 301841–301848: Миколай спрашивает «че значит чистая душа», Слава отвечает — «По настоящему добрых людей». Прямое определение того самого свойства, на котором держится вся арифметика обряда, и в этой статье его нет. Там же 301844 и 301857–301861 — про раздельный разум и «полноценный человек, относительно», то есть про субъектность того, кто заготовки делал.</p>\n<p>Дальше по соседям того же вечера: <code>SP-0199</code> (39 325) держит проценты чистоты, <code>SP-0201</code> «Сила от ритуала (энергия старика)» (21 913, ссылок ноль) — то, что через Антона проходило, <code>PS-0224</code> «Старик-арбетар» (90 651) — монолог, под который заготовки и делались, <code>PR-0058</code> «История про Антона (Антоша)» (68 576) — сплошной текст сцены.</p>\n<p>За чем действительно надо в архив — за словом. Проверить по дням после 2025-03-13, всплывает ли «заготовка» ещё где-нибудь. Если нет — вопрос статьи о том, термин это или рабочее слово брата, решается отрицательно, и решается фактом, а не догадкой.</p>\n<h3>Как развивалось</h3>\n<p>Заявили и отложили в одном сообщении: «Не совсем, но сделал пару заготовок» — «Как? Потом узнаешь». Ограничили сразу же, дважды подряд, отказом применять: «Не сейчас. Жди», потом «да нет». Раскрыли эффект на следующей сцене — и не тот, кто заготовки делал, а посторонний, который о них не знает. Забыли: повтор того же дня (301821–301824) переписал обрамление — деревня Ливия вместо Лихой, расшифровка слова «Арбетар», биография старика, — а заготовки повторил дословно, без единого уточнения. Носитель умер раньше обещанного объяснения, и к слову больше не возвращались.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Обряд оцифрован до процентов: без проводника 0%, с душой Антона плюс 8%, порог чистоты «где-то на 80% плюс минус», у Антона 89%. Правило названо числом. Заготовка вмешивается ровно в эту процедуру и описана двумя несовпадающими словами — «больший урон» у Дмитрия, «весь урон» у Антона, — без единой цифры. Для проводника чистота измерена, для второй души в том же теле сказано только «чиста». Для силы, проходящей через сосуд, есть шкала; для перенаправления той же силы шкалы нет, хотя это одна и та же операция в одном и том же абзаце.</p>\n<h3>Отклик</h3>\n<p>Сильнее всего здесь работает не механика, а тайминг. Брат дважды отвечает «Не сейчас. Жди», ничего не объясняя, — и оказывается, что ждал он не удобного момента для побега, а момента, когда сила пойдёт через тело, чтобы принять её на себя. Он с самого начала знал, чем кончится, и всё, что он делал, — тянул до нужной секунды. Поэтому его молчание во время ритуала — не дыра, а самая точная деталь сцены: отвечать было нечего. И реплика «Ты моей альтро-эго, ты не можешь умереть без меня!» — «Какой же ты дурак» держит на себе весь эпизод. Зацепило, что при этом само слово «заготовки» так и осталось необъяснённым — и это, кажется, единственный случай в разобранном материале, где недосказанность работает на текст, а не против него.</p></div>", "r": []}];</script>
