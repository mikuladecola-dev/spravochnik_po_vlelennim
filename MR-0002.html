<script>const BASE="";const DOCNAME="Падения небес";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0002-S01", "MR-0002--ustroystvo"], "h": "<p>Современный мир со сверхлюдьми, над которым рушится небо. Мир разработан за один заход утром 26 декабря 2023 года (окно w0021, id 65959–66007) и существует в двух несведённых версиях катастрофы.</p>\n<p>Исходная заявка Славы: «Хочу вселенную со сверхлюдьми только там должна быть изюминка только какая?» (2023-12-26 01:28, id 65959), с уточнением: «сама вселенная», «Типо это должно быть в современности но туда на что то ставить» (id 65960–65961). То есть современность и сверхлюди заданы сразу, а «изюминка» — то, чего не хватает и что ищется дальше.</p>\n<p><strong>Завязка Миколая (id 65974–65978).</strong> «Небо падает. Ломается. Когда полностью сломается всё исчезнет. А сверх люди не смогут помочь. И главная миссия найти атланта.» Атлант введён здесь как цель главной миссии; кто он и что даёт его нахождение, в переписке не сказано.</p>\n<p><strong>Версия Славы — метеориты (id 65981).</strong> Именно здесь появляется название: «Падения небес. В один день на землю начали падать метеориты, больше миллиарда метеоритов пала на землю. И этот день стал самым страшным в историй человечества больше 3 миллиардов смертей». Дальше Слава сам спрашивает «И что дальше?» и перечисляет три варианта продолжения (id 65982–65984): «с этих метеоритов начали вылазить монстр», «или эти метеориты начали выпускать споры и заражать людей», «или он просто наделил способностями». Ни один из трёх в окне не выбран.</p>\n<p><strong>Версия Миколая — мир-мыльный-пузырь (id 65985–66007).</strong> «Ну я буквально думал небо трескается и падает. По кусочкам. Типо весь мир это замороженный мыльный пузырь». В этой версии катастрофа буквальна и физична: небо — оболочка, которая трескается и осыпается кусками, а мир целиком — замороженный мыльный пузырь, «шар».</p>\n<p>Ключевой поворот той же версии: сверхспособностей не существует. «Способностей нет на самом деле, носители сами их придумали. На самом деле это спец эффекты на камеру. Фильм. Который смотрят люди. И думают что это правда» (id 65989–65993). «На самом деле в реальности никто не видел их подвигов. И вообще этих людей» (id 65994–65995).</p>\n<p>При этом угроза настоящая: «А угроза разрушения реальная проблема» (id 65996). Механизм гибели мира — вера. «Люди со способностями говорят что все исправят. Зрители в них верят. Мир рушится, а вера людей остаётся» (id 65997–65999). «Ученые тоже верят в сверх людей. Поэтому ничего не делают для спасения мира» (id 66000–66001). Итог: «В итоге почти все люди умерли. Больше не верят героям» (id 66002–66003).</p>\n<p>Развязка вынесена за пределы существования мира: «Когда мира нет, мы узнаем что сверхлюди это обычные люди показывающие эти сцены на камеру возле этого шара. Шара нет, а они продолжают это делать» (id 66004–66006). Съёмочная площадка находится снаружи — «возле этого шара», — и продолжает работать после того, как шара не стало.</p>\n<p>Источник импульса назван Миколаем прямо: «Атака титанов на идею толкнула» (id 66007).</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0002-S02", "MR-0002--naselenie"], "h": "<ul>\n<li>Обычные люди современности. В версии Славы за один день гибнет больше 3 миллиардов. В версии Миколая «почти все люди умерли», причём не от самой катастрофы напрямую, а потому, что верили героям и ничего не предпринимали.</li>\n<li>Сверхлюди. В завязке Миколая они существуют, но бессильны: «сверх люди не смогут помочь». В его же финальной версии их нет вовсе — это «обычные люди показывающие эти сцены на камеру», спецэффекты, фильм; их подвигов и их самих никто в реальности не видел.</li>\n<li>Зрители. Отдельная функция населения: те, кто смотрит и верит. Вера удерживается дольше мира — «Мир рушится, а вера людей остаётся».</li>\n<li>Учёные. Названы отдельно именно потому, что тоже верят в сверхлюдей и поэтому ничего не делают для спасения мира.</li>\n<li>Атлант. Названа только цель — «главная миссия найти атланта». Ни описания, ни того, найден ли он, в переписке нет.</li>\n</ul>", "r": []}, {"t": "Место во вселенной — как связан с другими мирами", "a": ["S03", "MR-0002-S03", "MR-0002--mesto-vo-vselennoy"], "h": "<p>Мир носит то же имя, что и вселенная: название «Падения небес» дано Славой (id 65981) для его метеоритной версии и стало названием вселенной. Варианты имени, встречающиеся в переписке: «Небо падает», «Падение небес».</p>\n<p>Связей с другими мирами вселенной в окне w0021 не названо. Внешняя привязка одна и она нехудожественная — «Атака титанов на идею толкнула».</p>\n<p>Отдельно стоит реплика Миколая после его первой завязки: «Ну походу это другое» (id 65980). Что именно «другое» и с чем сравнивается, в переписке не раскрыто.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0002-S04", "MR-0002--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2023-12-26, ночь и раннее утро (id 65959–65980).</strong> Заявка Славы (сверхлюди, современность, нужна изюминка) и, после паузы в 4,5 часа, первая завязка Миколая в 06:26: небо падает и ломается, при полной поломке всё исчезает, сверхлюди помочь не могут, главная миссия — найти атланта. Завершается репликой «Ну походу это другое».</p>\n<p><strong>Версия 2 — 2023-12-26, 07:00 (id 65981–65984).</strong> Слава даёт название «Падения небес» и свою версию катастрофы: миллиард с лишним метеоритов за один день, больше 3 миллиардов смертей, самый страшный день в истории человечества. Тут же выкладывает три развилки продолжения — монстры из метеоритов, споры и заражение людей, или наделение способностями. Выбор не сделан.</p>\n<p><strong>Версия 3 — 2023-12-26, 07:13 (id 65985–66007).</strong> Финальная версия Миколая. Небо трескается и падает по кусочкам, мир — замороженный мыльный пузырь. Способностей нет, сверхлюди — люди со спецэффектами на камеру, зрители и учёные им верят, из-за этой веры мир никто не спасает, почти все умирают, шара уже нет, а съёмки возле него продолжаются. Указан источник импульса.</p>\n<p>Версии не сведены между собой: метеоритная катастрофа Славы и трескающееся небо-пузырь Миколая существуют параллельно. Прямо не сказано, какая принята.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0002-S05", "MR-0002--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Две несведённые версии катастрофы — метеориты (Слава) и трескающееся небо-пузырь (Миколай); какая из них принята, в переписке не решено.</li>\n<li>Из трёх вариантов продолжения метеоритной версии (монстры / споры и заражение / наделение способностями) не выбран ни один.</li>\n<li>Атлант: сказано только, что его главная миссия — найти. Кто это, чем он связан с падающим небом, находят ли его — не сказано.</li>\n<li>Соотношение двух утверждений о сверхлюдях внутри реплик Миколая (в первой завязке они есть, но бессильны; в третьей версии их не существует) не проговорено.</li>\n<li>Неизвестно, кто снимает фильм и для кого, что находится снаружи шара кроме съёмок и почему съёмки продолжаются после исчезновения мира — сказано только, что продолжаются.</li>\n<li>«Ну походу это другое» (id 65980) осталось без пояснения.</li>\n<li>Изюминка, которую искал Слава в заявке, прямо не объявлена найденной.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0002--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0094.html\">Сверхлюди (мнимые герои «Падения небес»)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0009.html\">Падения небес</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0002--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2023-12-26</td>\n<td>65959–65980</td>\n<td>w0021</td>\n<td>Падения небес (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2023-12-26</td>\n<td>65981–65984</td>\n<td>w0021</td>\n<td>Падения небес (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2023-12-26</td>\n<td>65985–66007</td>\n<td>w0021</td>\n<td>Падения небес (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0002-padeniya-nebes.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0002--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0002.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
