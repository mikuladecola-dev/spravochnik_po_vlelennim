<script>const BASE="";const DOCNAME="Магия клятвы";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0144-S01", "SP-0144--mehanika"], "h": "<p>Магия клятвы — наследуемая магия семьи королевы. Рыцарь даёт клятву, и от этого становится сильнее. Сила прибавки привязана к тому, сколько свободы у рыцаря отнимает клятва: «чем клятва отнимает больше свободы рыцарь тем он сильнее» (2024-12-23, id 273266).</p>\n<p>Формулировка Славы целиком: «Сначала я думал что сильный рыцарь будут те кто даёт клятву самому королеве, а вот семье королеве передается по наследству магии клятвы то бишь рыцарь даёт клятву и становится сильнее и чем клятва отнимает больше свободы рыцарь тем он сильнее» (2024-12-23, id 273266).</p>\n<p>Клятва даётся самой королеве. Магия при этом принадлежит не отдельному носителю, а передаётся по наследству в семье королевы.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0144-S02", "SP-0144--ogranicheniya-i-cena"], "h": "<p>Цена названа прямо и является одновременно источником силы: клятва отнимает у рыцаря свободу. Чем больше отнято, тем сильнее рыцарь. Сколько именно свободы может быть отнято, какие бывают формы клятвы и есть ли предел — в переписке не сказано.</p>\n<p>Во второй версии того же дня (2024-12-23, id 273283) прибавка от клятвы была ослаблена: рыцарь и без клятвы «дохуя сильный», а с клятвой «просто становяться чутка сильнее».</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0144-S03", "SP-0144--nositeli"], "h": "<p>Магия принадлежит семье королевы и передаётся в ней по наследству. Действие направлено на рыцарей, дающих клятву.</p>\n<p>Рыцари в этом обсуждении разделены на две группы (2024-12-23, id 273280):</p>\n<ul>\n<li>рыцарь с клятвой;</li>\n<li>свободный рыцарь — тот, кто клятву не давал.</li>\n</ul>\n<p>Свободные рыцари тоже должны быть сильными (2024-12-23, id 273277), и именно это стало причиной ослабления механики.</p>\n<p>Отдельно шёл разговор о делении рыцарей на сильных и слабых до введения клятвы: у слабых «доспехи легкие и тонкие относительно», и слабых — половина от остальных (2024-12-23, id 273264–273265). Как это деление соотносится с делением на давших и не давших клятву, в переписке не сказано.</p>\n<p>Способность отнесена к сущности «Рыцари» — она часть их устройства.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0144-S04", "SP-0144--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-12-23 (id 273263–273274).</strong> Сильные рыцари — те, кто дал клятву самой королеве. Магия клятвы передаётся по наследству в семье королевы. Сила рыцаря пропорциональна отнятой у него клятвой свободе. Реакция Миколая: «звучит круто» (id 273273).</p>\n<p><strong>Версия 2 — 2024-12-23 (id 273277–273285).</strong> Механика ослаблена. Причина — необходимость оставить сильными и свободных рыцарей: «Потому что будет и свободных рыцарей который не дали клятву, и они тоже должны быть сильными» (id 273277). Вводится ступенчатая структура: «рыцарь это пик, а все остальные просто воины или новобранцы или т.п» (id 273279). Далее — деление на рыцаря с клятвой и свободного рыцаря (id 273280). Итоговая формула прибавки: «и без клятвы рыцарь дохуя сильный а с клятвой просто становяться чутка сильнее» (id 273283).</p>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S05", "SP-0144-S05", "SP-0144--otklonennye-varianty"], "h": "<ul>\n<li><strong>Сильный вариант механики</strong> (версия 1): сила рыцаря целиком строится на клятве, сильные рыцари — это те, кто клятву дал. Забракован тем, что свободные рыцари тоже должны быть сильными. При этом окончательного отказа не прозвучало — см. раздел «Пробелы».</li>\n<li><strong>«Патриоты» вместо свободных рыцарей.</strong> Миколай: «ммм, ну их тяжело назвать рыцарями без службы», «пусть тогда они патриоты будут» (2024-12-23, id 273281–273282). Слава на переименование не пошёл, оставив название «свободный рыцарь». Тут же Миколай добавил про них: «из семей рыцарей которых отделили от семьи» (id 273284) и сам же закончил «ну хз хз» (id 273285) — принято это или нет, в переписке не сказано.</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S06", "SP-0144-S06", "SP-0144--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Окончательно не решено, оставлять ли механику в сильном виде (версия 1) или в ослабленном (версия 2). Обсуждение оборвалось на «ну хз хз».</li>\n<li>Не сказано, как измеряется отнятая свобода и в чём конкретно состоят условия клятвы.</li>\n<li>Не сказано, что происходит при нарушении клятвы.</li>\n<li>Не сказано, как магия, наследуемая семьёй королевы, применяется — кто именно из семьи и каким действием превращает клятву в силу.</li>\n<li>Не сказано, как деление рыцарей на сильных и слабых (по доспехам, id 273264–273265) соотносится с делением на давших клятву и свободных.</li>\n<li>Принадлежность к вселенной в записи помечена как «неясно» (по дате объявления).</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["SP-0144--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-12-23</td>\n<td>273263–273274</td>\n<td>w0068</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-23</td>\n<td>273277–273285</td>\n<td>w0068</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0144-magiya-klyatvy.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0144--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0144.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
