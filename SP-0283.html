<script>const BASE="";const DOCNAME="Железное сердце";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0283-S01", "SP-0283--mehanika"], "h": "<p>Артефакт Заны, третий в перечне его артефактов (2026-06-17, id 491164). Назван «Третий железная сердца, подвеска, с серебряным сердцем». Другие названия, встречающиеся в тексте: «подвеска, похожая на сердце», «серебряная подвеска».</p>\n<p>Действие: «Эффект рандомно телепортирует куда-то». Место назначения не выбирается — телепортация случайна.</p>\n<p><strong>Применение в сцене (2026-06-17, id 491161).</strong> Сцена подана от лица старика, у которого только что оказался чёрный ящик. Зана, до этого союзник, бьёт старика в спину кинжалом волнистой формы, подхватывает выроненный ящик белоснежной и хрупкой рукой и уходит от удара Деби («чей то зверинный крик и на месте где стоял Зана образовалось красная молния, что начила всё крушить»). Дальше он стоит поодаль на разрушенном здании, спиной к солнцу, и «он поднял серебряную подвеску, похожая на сердце из под белой рубашке. И демонстративно показал в нашу сторону» со словами «эй старичок узнаешь». Старик артефакт узнаёт и понимает, «На что способен артефакт который находится у него в руках». На просьбу «стой хватит. Давай договоримся» Зана отвечает специально растянутым «нет~» — «И чёрный ящик исчез».</p>\n<p>То есть в единственном показанном применении артефакт направлен не на носителя, а на предмет: чёрный ящик телепортирован «в рандомной место» (id 491163). Мотив применения там же: «а после с упоением смотрел, как эти высокомерный боги думающие что у них всё получилось, смотрели на него неверующим взглядом и замерли не веря в то что произошло».</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0283-S02", "SP-0283--ogranicheniya-i-cena"], "h": "<p>Названы два ограничения, оба в id 491164.</p>\n<p><strong>Случайность точки выхода как риск для жизни.</strong> «Использует крайне редко. Потому что он телепортирует рандомно. Он может оказаться внутри стены и сдохнуть, он может оказаться воздухе и просто умереть, он может оказаться под глубиной воды и просто захлебнуться и умереть под давлением».</p>\n<p><strong>Перезарядка.</strong> «Ещё минусом у него очень долгая перезарядка 5 часов». Для сравнения там же указана перезарядка очков Заны — 3–4 секунды.</p>\n<p>Следствие из обоих ограничений, сформулированное прямо: артефакт «Использует крайне редко».</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0283-S03", "SP-0283--nositeli"], "h": "<p>Зана — глава организации злодеев Насла. Других владельцев артефакта не названо.</p>\n<p>По самому Зане в том же диапазоне зафиксировано: он «подтянутый блондин, с синими глазами», выглядит «как лис, которому точно нельзя доверять»; вырос в семье аферистов, которых убили за их ложь, то есть «сирота без денег», а организацию собрал «собственным красноречием», из-за чего «всё деньги что у него есть это не его. Но он им пользуется как ему удобно». Он «тот кому нравится видить чужие яркие эмоции», «вампир что питается эмоциями ( конечно в пересном смысле)».</p>\n<p>Обстоятельства применения артефакта — часть его повторяющегося приёма: некоторое время он сотрудничал с Загиком в гонке за чёрным ящиком и предал в решающий момент; «Он так делал и с другими организацими, по типу Нора. Или ассоциации если те вдруг начали доверять ему. Ему нравилось видить эмоции».</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0283-S04", "SP-0283--kak-menyalas-po-versiyam"], "h": "<p>Одна версия, 2026-06-17 (id 491161–491164). Порядок изложения в переписке: сначала артефакт показан в действии в художественной сцене (id 491161, чёрный ящик исчезает), затем, после описания организации Насла и самого Заны, расписана механика — случайная телепортация, риски и перезарядка (id 491164). Позднейших правок в архиве нет.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0283-S05", "SP-0283--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Артефакт входит в набор из четырёх артефактов Заны, перечисленных подряд (2026-06-17, id 491164):</p>\n<ol>\n<li><strong>Клинок тысячи боли.</strong> «Царапина от такого клинка вызовит такую боль словно тебя пырнули. Именно этим клинком он ударил в спину старика».</li>\n<li><strong>Очки.</strong> «Они позволяют телепортироваться в поле своего зрения. Он не способен телепортироваться на Дальний дистанции, а только на те который именно сейчас видит. И если всё накроется туманом он по сути не сможет телепортироваться». Перезарядка 3–4 секунды.</li>\n<li><strong>Железное сердце</strong> — настоящая статья.</li>\n<li><strong>Перчатка, предназначенная для стрельбы.</strong> «Способен призывать серебряный лук, который стреляет стрелами созданный из оам ( лук сам создаёт стрелы из оам)».</li>\n</ol>\n<p>Очки и железное сердце — два телепорта одного носителя, разведённые по параметрам: очки бьют коротко, точно и в пределах видимости, с перезарядкой в секунды; железное сердце — на неизвестное расстояние, случайно и с перезарядкой в 5 часов.</p>\n<p>С артефактом связан <strong>Чёрный ящик</strong> — предмет, ради которого шла гонка организаций и который был выведен из игры именно этим артефактом.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "SP-0283-S06", "SP-0283--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Не сказано, на что именно направлено действие артефакта. В сцене телепортирован предмет (чёрный ящик), а перечень рисков сформулирован про живого человека — «Он может оказаться внутри стены и сдохнуть». Выбирает ли носитель цель, действует ли артефакт и на себя, и на предметы — не сказано.</li>\n<li>Дальность и разброс случайной телепортации не заданы: не сказано, в каких пределах выбрасывает — комната, город, планета.</li>\n<li>Не сказано, можно ли найти телепортированный объект, отслеживается ли точка выхода, обратим ли эффект.</li>\n<li>Происхождение артефакта, его изготовитель и то, как он попал к Зане, не описаны.</li>\n<li>Название артефакта не устоялось: в тексте встречаются «железная сердца», «подвеска, с серебряным сердцем», «серебряная подвеска, похожая на сердце»; при этом сердце названо и железным, и серебряным, расхождение в переписке не разрешено.</li>\n<li>Не сказано, чем железное сердце отличается от очков по механике телепортации, кроме дальности, случайности и времени перезарядки.</li>\n<li>Вселенная в карточке помечена как «неясно».</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["SP-0283--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-06-17</td>\n<td>491161–491164</td>\n<td>w0122</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0283-zheleznoe-serdce.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0283--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0283.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
