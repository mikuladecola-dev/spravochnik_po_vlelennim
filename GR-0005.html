<script>const BASE="";const DOCNAME="Агенты (организация вербовки)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0005-S01", "GR-0005--chto-eto"], "h": "<p>Организация, куда вербуют людей, столкнувшихся с чужемирцем. Собственного названия у неё в переписке нет: апостол Дмитрий Рутковский называет её «нашей организаций» (2025-03-13, id 301809), в блоге Максима она вообще не названа — говорится только о том, что человек «становишься агентом» (2025-03-18, id 305116). Слово «агенты» в переписке употребляется и как название людей, и как название всей системы.</p>\n<p>Строго говоря, это не отряд с поимённым составом, а организация и порядок приёма в неё. В переписке названы трое связанных с ней людей и двое вербовщиков; общего списка агентов нет, численность обозначена одним словом.</p>\n<p>Устройство описано дважды, двумя независимыми выкладками.</p>\n<p>Первый раз — внутри истории про Антона Смирнова (2025-03-13, id 301809). Апостол Дмитрий Рутковский («Агрегат») предлагает очнувшемуся в больнице Антону два пути: «Первый ты восстанавливаясь и живёшь обычный жизнью. Но за тобой будет слежка, так как ты тоже получил кусок силы нашего мира. При этом выжив. За тобой будет слежка, чтобы ты никому не навредили. А второй путь стать агентом нашей организаций. И защищать сон мирных людей. Но при этом рискуя своей жизнью». Вербовщик специально отказывается взвешивать варианты: «Я мог бы сказать плюс, минус, всё описать. Но думаю это не к чему. Не хочу как-то влиять на твой выбор. Ты должен сам решить». Срок на ответ — три дня, и ответ, данный сразу, не принимается: «я не приму этот ответ. Я приду сюда через три дня и тогда ты дашь мне ответ».</p>\n<p>Второй раз — внутри блога Максима (2025-03-18, id 305116–305117). Апостол в белой рубашке и чёрных брюках, подобравший Максима после боя в лесу, произносит то же предложение: «смотри у тебя есть два пути. Первый я подхожу тебя к остановки и ты едешь домой. Забыв обо всём этом и живя обычной жизнью. Второй- ты становишься агентом и сразаешься с подобными тварями, как сегодняшний. Выбор за тобой. Я не буду говорить плюс и минус». В тексте отмечено, что это «явно выученный монолог».</p>\n<p>Дальше в блоге описан сам порядок приёма. Звонит уже не вербовщик, а другой человек — Михаил Саакашвили, причём номера телефона Максим никому не давал. По телефону сказано: «они заедут за мной через три дня, где я должен дать свой точный ответ. Если я также буду согласен. То меня заберут в лагере, где я должен буду прожить 6 месяцов под тренировкам и впитыванием информации». Через три дня Максима забирают.</p>\n<p>Организация стоит под апостолами. В базе апостолы для этого окна описаны как «класс сильных носителей силы, стоящий над агентами». Вербуют именно апостолы: Антона — Агрегат, Максима — имитатор («Имитатор апостол гг всего мира», «Это апостол который появился в конце», 2025-03-18, id 305428–305429).</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0005-S02", "GR-0005--sostav"], "h": "<ul>\n<li><a href=\"PS-0048.html\">Максим</a> — Максим. Новобранец, прошедший лагерь. Рассказчик блога, из которого известна почти вся механика организации.</li>\n<li><a href=\"PS-0229.html\">Михаил \"Медведь\" Саакашвили</a> — Михаил «Медведь» Саакашвили. Куратор Максима в лагере; он же (или человек с таким же именем) звонит Максиму после вербовки.</li>\n<li><a href=\"PS-0221.html\">Антон Смирнов</a> — Антон Смирнов. Согласился стать агентом; сам приём в переписке не показан.</li>\n</ul>\n<p>Не входят в состав, но названы рядом с ней:</p>\n<ul>\n<li><a href=\"PS-0223.html\">Дмитрий Рутковский («Агрегат»)</a> — Дмитрий Рутковский («Агрегат»), апостол, вербующий Антона.</li>\n<li>Имитатор — апостол, вербующий Максима; в момент выкладки истории он назван только описательно (мужчина от 20 до 30 лет, белая рубашка, чёрные брюки, симметричное лицо, белые глаза), имя дано позже в разборе (2025-03-18, id 305428–305429).</li>\n</ul>\n<p>Поимённого состава агентов нет. На вопрос «и сколько уже таких агентов» (2025-03-18, id 305335) ответ дан один: «Дохера» (id 305337). Названа только численность одной учебной группы: «я был там не один нас было 10» (id 305116).</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · С чего начать — не материал авторов</b>\n<ul>\n<li><code>PS-0048</code> «Максим» — 70 202 знака при статье на 33 185. Половина материала о рассказчике в статью не попала.</li>\n<li><code>PR-0060</code> «Блог Максима» — 31 165, статья есть. Первоисточник почти всей механики: лагерь, шесть месяцев, десятка, курс мироустройства.</li>\n<li><code>PS-0221</code> «Антон Смирнов» — 74 390. Самая большая запись из состава. Вопрос «попал ли Антон в лагерь, был ли у него куратор» надо проверять тут прежде всего.</li>\n<li><code>PS-0223</code> «Дмитрий Рутковский (Агрегат)» — 21 902, и <code>MR-0139</code> — 17 145. Пара, по которой сверяется, совпадает ли предложение Агрегата с более поздним контрактом АЗИП дословно или только по смыслу.</li>\n<li><code>SL-0089</code> «Список категорий сил» — четыре ссылки, статьи нет, база всего 1 753. Тут наоборот: ссылок много, а материала почти нет — добирать придётся из переписки.</li>\n</ul></div>", "r": [["Максим", "PS-0048.html"], ["Михаил \"Медведь\" Саакашвили", "PS-0229.html"], ["Антон Смирнов", "PS-0221.html"], ["Дмитрий Рутковский («Агрегат»)", "PS-0223.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0005-S03", "GR-0005--obschie-sposobnosti-gruppy"], "h": "<p>Общих сверхспособностей у агентов в переписке не названо. Наоборот, прямо сказано, что берут обычных людей: «значит они могут выбирать каких-то ебланов обычных кто столкнулся с чужемирцем? // в агенты» (2025-03-18, id 305352–305353). Про Максима отдельно уточнено, что он просто человек, без регенерации и без благословения (2025-03-18, id 305263–305266).</p>\n<p>Общее для всех — то, что даёт организация.</p>\n<p>Лагерь. Срок обучения — 6 месяцев, «под тренировкам и впитыванием информации» (id 305116). Учебная группа — 10 человек. Максим отучился три недели вместо шести месяцев: «Так как я был в идеальном физической форме и мне оставалось только дать информацию и ресурсы и всё».</p>\n<p>Право кураторства. «Каждый агент может быть куратором только для 10 людей» (id 305116). Ограничение сформулировано как общее правило для всех агентов, а не как особенность Михаила.</p>\n<p>Знания. В лагере агенту дают картину мира: в начале не было ничего, потом появился первый мир «Килька» — и это наш мир, потом стали появляться другие миры, в каждом свой бог, которого называют Правителем; миры появляются и по сей день; между всеми мирами есть связь, но с «Килькой» она у всех крепче. Дальше — чужемирцы: «Это существо покинувший свой мир», чаще всего потому, что «их ней миры суший ад», или из желания захвата других миров; «грубо говоря почти всё чужемирцы жестокие психи. Для которых убийства это обыденная дело». Три известных способа попасть в наш мир: дойти до границы своего мира (чаще в маленьких, недавно образовавшихся мирах); ритуал — «как с нашей стороны, как и с их ней»; и самый редкий — когда правитель сам отправляет в другой мир. Отдельно названо ограничение, которое Максим считает главным фактом: «мы субъекты первого мира. Не модем его пикинуть. Ну вот никак. Ну вот чужемирцы попадають нам за раз плюнуть».</p>\n<p>Знания, которые агенту не дают. Про ритуал перехода Максим говорит: «Мне об этом ритуале не рассказали по понятном причинам».</p>\n<p>Назначение. На вопрос, что с агентами делают, ответ короткий: «Отправляют сражаться» (2025-03-18, id 305339). В формулировке Агрегата задача та же с другой стороны: «защищать сон мирных людей. Но при этом рискуя своей жизнью».</p>", "r": []}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0005-S04", "GR-0005--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p>Максим (<a href=\"PS-0048.html\">Максим</a>) — обычный человек без благословения, но с тремя особенностями, которые он перечисляет сам: другое восприятие времени («Для меня все разы медленнее чем вам»), идеальные пять чувств и контроль всех мышц в своём теле. Из-за физической формы прошёл лагерь за три недели вместо шести месяцев. Ведёт блог с разглашением всего, чему его научили, и делает это, по собственным словам, «чисто по приколу. Ну и чтобы возможно позлить Михаила».</p>\n<p>Михаил «Медведь» Саакашвили (<a href=\"PS-0229.html\">Михаил \"Медведь\" Саакашвили</a>) — единственный агент, показанный в роли куратора. Внешность: «По два метра ростом, в плечах почти также. Везде мыщцы и суровым лицом богатыря. Ходил он в кожанном плаще и был суров, но справедливым». Отношение к подопечному описано так: «даже если я его бесил. Он всё равно отметил мои навыки». Он же обладает правом на санкцию: «Через 7 минут эта запись была удалена Михаилом. А его отправитель был наказан».</p>\n<p>Антон Смирнов (<a href=\"PS-0221.html\">Антон Смирнов</a>) — попадает в организацию не через столкновение с чужемирцем, а как выживший в ритуале старика-арбетара: он был проводником, «человек с 89% чистой душой», и после обряда получил, по словам Агрегата, «кусок силы нашего мира». Из-за этого первый путь для него — не «забыть обо всём» (как у Максима), а жизнь под слежкой. Лагерь в его случае не упоминается вообще. Характер зафиксирован отдельной репликой: «главное отметить, что Антоша импульсивный, решительный» (2025-03-13, id 301918).</p>\n<p>Разница в самих предложениях: Максиму предложен выбор «домой или в агенты», Антону — «под слежкой или в агенты». Совпадает в обоих случаях только срок на ответ — три дня.</p>", "r": [["Максим", "PS-0048.html"], ["Михаил \"Медведь\" Саакашвили", "PS-0229.html"], ["Антон Смирнов", "PS-0221.html"]]}, {"t": "Иерархия", "a": ["S05", "GR-0005-S05", "GR-0005--ierarhiya"], "h": "<p>Над агентами стоят апостолы. В обеих историях предложение вступить делает апостол лично: Антону — Агрегат, Максиму — имитатор. Апостолы в этом окне описаны как «класс сильных носителей силы, стоящий над агентами».</p>\n<p>Ниже — агенты. Внутри агентов выделен куратор: агент, который ведёт новобранцев. Ограничение жёсткое и названо числом — не более 10 человек на куратора.</p>\n<p>Ещё ниже — новобранцы, живущие в лагере группой по 10.</p>\n<p>Организационная работа не вся идёт через вербовщика: Максима вербует один апостол, а звонит и назначает срок другой человек, Михаил Саакашвили. Апостол-вербовщик на вопросы не отвечает и ссылается на спешку — ему надо встретиться «с новым апостооом по прозвищу \"защитник\"».</p>\n<p>Право наказывать за разглашение зафиксировано за Михаилом: запись блога удалена через 7 минут после выкладки, отправитель наказан. В чём состояло наказание, не сказано.</p>\n<p>Осталось нерешённым, один ли это персонаж: Михаил Саакашвили, звонящий по телефону, куратор Михаил «Медведь» и Михаил, удаливший запись, — в переписке это не разведено. В базе это записано как неясность окна.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S06", "GR-0005-S06", "GR-0005--otnosheniya-s-drugimi-gruppami"], "h": "<p>Апостолы. Апостолы стоят над агентами, вербуют их и отправляют сражаться. Реакция Миколая на выстроившуюся систему: «я про то что у этих апостолов такая система получается», «ваще удобная система» (2025-03-18, id 305333, 305336).</p>\n<p>Чужемирцы. Противник, ради которого организация существует: агент «сразаешься с подобными тварями, как сегодняшний». Столкновение с чужемирцем — одновременно и повод для вербовки, и её условие.</p>\n<p>Арбетары. Прямого столкновения агентов с арбетарами в этих материалах нет, но старик-арбетар даёт оценку тем, кто стоит над агентами: «Эти апостолы не пойми кем себя возомнили и везде понаставили свои порядки, на чужой силе»; и там же — «не могу не признать, что свою работу они выполняють слишком идеально. Ну даже в идеальной системе есть единичные пробои» (2025-03-13, id 301806).</p>\n<p>АЗИП. Позже (2025-05-30, id 331452–331457) апостолы названы основателями организации АЗИП, которая работает на них «Для защиты порядка»; ещё позже (2025-08-30, id 359681) она названа «нерушимая организация Азип, которой уже более сотней лет». Связь АЗИП с агентами в переписке не названа — это два разных объявления, сделанных в разные месяцы.</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S07", "GR-0005-S07", "GR-0005--kak-menyalas"], "h": "<p>2025-03-13, id 301805–301809 — первое появление, внутри истории про Антона. Организация без названия, только «наша организация». Задача агента — «защищать сон мирных людей». Введены два пути, три дня на ответ, отказ вербовщика оценивать варианты, отказ принять ответ, данный сразу.</p>\n<p>2025-03-13, id 301865–301868 — уточнение по механике, заданное вопросом Миколая («если способность пропадёт то Антон сдохнет?»). Ответ: лечили Антона «Лекарствами и бинтами», потому что «апостолы не способны лечить и влиять на разум», и это верно не только для апостолов: «Благословенный вообще все».</p>\n<p>2025-03-13, id 301925–301934 — Миколай предполагает, что следующая история будет «о деятельности организации апостолов». Вариант не взят: следующая история заявлена о встрече старика и защитника, с упором на драку.</p>\n<p>2025-03-18, id 305116–305117 — вся механика приёма и обучения, изложенная от лица агента: звонок, три дня, лагерь на 6 месяцев, тренировки и «впитывание информации», группа из 10, правило «Каждый агент может быть куратором только для 10 людей», кураторство Медведя, курс мироустройства, умолчание про ритуал, удаление записи и наказание отправителя.</p>\n<p>2025-03-18, id 305202–305206 — Миколай спрашивает, кто такой Михаил и новый ли это персонаж. Ответ отложен: «Дальше», «В конце будет».</p>\n<p>2025-03-18, id 305329–305341 — разбор системы. Вопросы: что с агентами делают и сколько их. Ответы: «Отправляют сражаться», «Дохера». Здесь же подтверждено, что защитник — действительно новый апостол.</p>\n<p>2025-03-18, id 305344–305351 — служебное про имя куратора. Слава: «Мне т2 помогает фамилии придумывать». Миколай просит не менять способ: «мне очень нравятся эти имена и фамилии», «наоборот я расстроюсь если ты по другому как-то делать станешь». Тут же отклонённое предположение Миколая, что Саакашвили — «это Сталин или типа того», «ну приближённый его мб». Спор о происхождении фамилии: Слава — «Саакашвили звучит по немецки», Миколай — «на Википедии пишут что грузинская фамилия».</p>\n<p>2025-03-18, id 305352–305354 — уточнение отбора: в агенты берут обычных людей, столкнувшихся с чужемирцем.</p>\n<p>2025-03-18, id 305424–305437 — назван вербовщик Максима: имитатор, «апостол гг всего мира». Здесь же зафиксировано расхождение замысла и результата: по замыслу он «должен быть весёлым и добрым и в заботливого человека», а на вопрос, каким он вышел в этой истории, Миколай отвечает: «никаким», «он нейтрально показан», «как обычный работник».</p>\n<p>2025-03-21, id 306758–306765 — Михаил «Медведь» упомянут только как точка отсчёта: «Там просто есть Михаил но это не тот Михаил который \"медведь». Разработки организации в этом окне нет.</p>\n<p>2025-05-30, id 331452–331457 и 2025-08-30, id 359681 — вокруг апостолов появляется организация АЗИП, отдельным объявлением, без связи с агентами.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "GR-0005-S08", "GR-0005--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Название организации не произнесено ни разу: только «наша организация» и «агенты».</li>\n<li>Поимённого состава нет. Численность агентов дана одним словом — «Дохера».</li>\n<li>Что агенты делают, кроме как сражаются, не сказано. Вопрос «интересно че они с этими агентами делают» (id 305334) развёрнутого ответа не получил.</li>\n<li>Неизвестно, один ли персонаж Михаил Саакашвили по телефону, куратор Михаил «Медведь» и Михаил, удаливший запись.</li>\n<li>В чём состояло наказание отправителя записи, не сказано.</li>\n<li>Приём Антона после трёх дней в переписке не показан; попал ли он в лагерь, был ли у него куратор — не сказано.</li>\n<li>Что стало с группой из 10 новобранцев, вместе с которой учился Максим, — не сказано; никто из них не назван.</li>\n<li>Как отбирают куратора и кто назначает, чей куратор Михаил, — не сказано.</li>\n<li>Ритуал перехода агентам не рассказывают «по понятном причинам»; на этом изложение обрывается.</li>\n<li>Связь агентов с АЗИП в переписке не названа.</li>\n<li>Неясности окон, отмеченные в базе: в окне w0080 название вселенной ни разу не произнесено; в окне w0084 Михаил «Медведь» только упомянут, разработки нет.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0005--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0048.html\">Максим</a>, <a href=\"PS-0221.html\">Антон Смирнов</a>, <a href=\"PS-0223.html\">Дмитрий Рутковский («Агрегат»)</a>, <a href=\"PS-0229.html\">Михаил \"Медведь\" Саакашвили</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0005--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0005.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0005-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0005/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дороже всего здесь стоит то, что стоит над агентами. <code>SL-0054</code> «Список 12 апостолов» — три ссылки, статьи нет, база 234 052 знака. Это самая большая нераскрытая запись во всём наборе: почти четверть мегабайта материала без статьи. Вся организация в этой статье описана снизу — глазами новобранца и глазами вербуемого; класс, который вербует, назначает и отправляет сражаться, держится на одной строчке «класс сильных носителей силы, стоящий над агентами». При этом в соседнем окне апостолов уже 21, а список называется «12 апостолов», и развести это негде.</p>\n<p>Второе — сама организация раздвоена по номерам. <code>MR-0122</code> «Агенты» — две ссылки, статья есть, база 12 802. <code>MR-0138</code> «АЗИП» — две ссылки, статья есть, 15 539. <code>MR-0139</code> «Контракт и правила агента АЗИП» — две ссылки, статья есть, 17 145. Три записи про одно устройство приёма и службы, разнесённые по разным номерам, и статья честно фиксирует, что связь между мартовскими сценами и майской АЗИП в переписке не проведена. Пробел «названия нет» на самом деле не про название: имя есть, оно просто лежит в другой записи.</p>\n<p>Третье — фигура, на которой висит вопрос тождества. <code>PS-0229</code> «Михаил \"Медведь\" Саакашвили» — одна ссылка, статья есть, база 35 634. Тридцать пять тысяч знаков при том, что в статье он присутствует тремя функциями (звонок, кураторство, удаление записи) и одним абзацем внешности. Разводить трёх Михаилов надо не в архиве, а здесь.</p>\n<h3>С чего начать</h3>\n<p>Всё, кроме одной точки, лежит в базе:</p>\n<ul>\n<li><code>PS-0048</code> «Максим» — 70 202 знака при статье на 33 185. Половина материала о рассказчике в статью не попала.</li>\n<li><code>PR-0060</code> «Блог Максима» — 31 165, статья есть. Первоисточник почти всей механики: лагерь, шесть месяцев, десятка, курс мироустройства.</li>\n<li><code>PS-0221</code> «Антон Смирнов» — 74 390. Самая большая запись из состава. Вопрос «попал ли Антон в лагерь, был ли у него куратор» надо проверять тут прежде всего.</li>\n<li><code>PS-0223</code> «Дмитрий Рутковский (Агрегат)» — 21 902, и <code>MR-0139</code> — 17 145. Пара, по которой сверяется, совпадает ли предложение Агрегата с более поздним контрактом АЗИП дословно или только по смыслу.</li>\n<li><code>SL-0089</code> «Список категорий сил» — четыре ссылки, статьи нет, база всего 1 753. Тут наоборот: ссылок много, а материала почти нет — добирать придётся из переписки.</li>\n</ul>\n<p>В архив — за одним обещанием. 2025-03-18, id 305202–305206: Миколай спрашивает, кто такой Михаил и новый ли это персонаж, ответ — «Дальше», «В конце будет». В окне это не закрыто. Смотреть надо конец истории Максима — то есть продолжение после id 305437 и следующее окно, 2025-03-21 (id 306758–306765), где Михаил «Медведь» уже упомянут как точка отсчёта: «это не тот Михаил который \"медведь». Значит, между 18 и 21 марта появился второй Михаил, и место его появления в статью не попало.</p>\n<p>Вторым заходом — промежуток между 2025-03-21 и 2025-05-28. Именно там организация без имени превращается в АЗИП, и если переход где-то проговорён, то в этом промежутке.</p>\n<h3>Как развивалось</h3>\n<p>2025-03-13 — заявлено изнутри истории: организация без названия, «наша организация», два пути, три дня на ответ. 2025-03-18 — развёрнуто и сразу ограничено числами: шесть месяцев лагеря, группа десять, не больше десяти подопечных на куратора, срок сокращён до трёх недель по физической форме, семь минут до удаления записи. В тот же день на прямой вопрос о численности всей организации ответ дан без числа — «Дохера». 2025-03-21 — упомянуто вскользь, разработки нет. Дальше два месяца тишины. 2025-05-30 и 2025-08-30 — организация вокруг апостолов появляется снова, уже с именем АЗИП, возрастом в сто лет и словом «нерушимая»; про агентов, лагерь, кураторов и десятку в этих окнах речи не идёт.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Правило о разглашении названо, и названо с санкцией: запись Максима удалена через семь минут, «А его отправитель был наказан». Отдельно названо, что часть знаний агенту не выдают вовсе — ритуал перехода, «по понятном причинам». То есть для человека внутри организации граница проговорена дважды: что нельзя знать и что бывает за сказанное.</p>\n<p>Рядом стоит первый путь. Максиму предложено уехать домой, «забыв обо всём этом», после того как он видел бой с чужемирцем. Он отказывается, но сам вариант объявлен равноправным и без единого условия: ни подписки, ни слежки, ни оговорки, что будет, если отказавшийся заговорит. Антону, получившему кусок силы, слежка назначена — и там основание названо прямо: «чтобы ты никому не навредили».</p>\n<p>Для того, кто вступил, правило молчания названо. Для того, кто отказался, — правила того же рода нет, хотя увидел он то же самое.</p>\n<h3>Отклик</h3>\n<p>Зацепило, что вербовщик дважды отказывается продавать. «Я мог бы сказать плюс, минус, всё описать. Но думаю это не к чему. Не хочу как-то влиять на твой выбор» — и следом отказ принять согласие, данное сразу: приду через три дня. Организация, которая набирает людей на смертельную работу, единственное, чего не делает, — не уговаривает. А потом это же оказывается «явно выученным монологом», произнесённым вторым апостолом слово в слово. Отказ от влияния поставлен на конвейер, и текст сам это замечает, не подчёркивая. Хорошо и то, что рассказчик сливает всё это в блог «чисто по приколу. Ну и чтобы возможно позлить Михаила» — вся известная нам механика организации существует только потому, что один агент хотел позлить куратора. Запись удалили через семь минут, но мы её читаем. Кто её сохранил, статья не спрашивает, и правильно делает.</p></div>", "r": []}];</script>
