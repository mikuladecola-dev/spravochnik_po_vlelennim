<script>const BASE="";const DOCNAME="Столпы злодеев";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0196-S01", "MR-0196--ustroystvo"], "h": "<p>Столпы злодеев (встречается и в единственном числе — «столп злодеев») — группа, в которую в переписке зачисляют отдельных сильных злодеев. В сводке записи она описана как группа сильнейших злодеев и зеркало столпов героев; в самих репликах ни определения группы, ни её численности, ни списка состава нет — есть только зачисления конкретных персонажей.</p>\n<p>Механика зачисления в переписке не описана: не сказано, кто присваивает статус, есть ли ограничение по числу мест и что даёт статус его носителю. При этом видно, что место может освободиться: Святая дева убрана из вселенной, и её позицию занимает другой персонаж.</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0196-S02", "MR-0196--naselenie"], "h": "<p>Названы двое:</p>\n<ul>\n<li>Старик, обладатель гравитации (2026-06-02, id 487219–487229). Его способность показана на примере боя в городе: точка гравитации ставится на здание, между стариком и зданием стоит человек с камнем в руке, и «даже кидать не надо, камень сам летит, не падает на землю а с постоянной силой давит».</li>\n<li>Фатик (2026-06-03, id 487531) — «желтоволосая девчушка» со способностями управления фотонами. Занимает место вычеркнутой Святой девы.</li>\n</ul>\n<p>Про Фатик в том же сообщении перечислено: она может создавать зрительные иллюзии, «разукрасить мир в чёрное белые», «может сделать так что ты подумал что вы оказались во дворце»; может перемещаться «на невероятной скорости»; может выпускать «мощные залпы энергии ( ну фотонов с массой, ну которые как бы нарушает законы физики, ну пока допустим)» — выбросы, которыми она, например, защищается от тьмы Нуара; «если постарается её может сделать иллюзии осязаемыми»; «может погладить все факторы устроив минутку тьмы»; может ослепить и запутать в пространстве. Оговорка «ну пока допустим» насчёт фотонов с массой оставлена в переписке как есть — вопрос физической состоятельности признан открытым и отложен.</p>\n<p>Фатик также названа главой секты, «которой покланяется ей как богини в человеческом виде»; секте тут же дано имя — «давай назовём данную секту Фалим». В этой же секте состоит инквизитор с чистой Оам.</p>\n<p>Святая дева — персонаж, ранее занимавший место среди столпов злодеев. В версии от 2026-06-03 она снята полностью: «Святая дева её больше нет как персонаж вообще».</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0196-S03", "MR-0196--mesto-vo-vselennoy"], "h": "<p>Записанное окно связывает столпы злодеев с Ассоциацией и лицом ассоциации, со Стариком (обладателем гравитации) и с Фатик.</p>\n<p>В том же сообщении, где Фатик зачисляется в столпы, идёт соотнесение сил других персонажей: «Нет серафим не сильнее Нуар. Они плюс минус равны по силе, но просто Пламя Серафима представляет опасность. Также у нуара больше всего Оам». Прямо к столпам злодеев эти двое в переписке не отнесены.</p>\n<p>Вселенная в записи помечена как неясная и определяется по дате объявления (безымянная вселенная, объявлена 2026-06-02, id 486999).</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0196-S04", "MR-0196--kak-menyalsya-po-versiyam"], "h": "<p><strong>2026-06-02 (id 487219–487229)</strong> — обсуждается бой в городе с гравитацией старика, и по ходу Слава говорит: «Да и он этот обладатель способность будет как бы столпом злодеев». Миколай отвечает на это двумя репликами: «он должен был быть столпом злодеев» и «или ты сейчас так решил» — то есть переспрашивает, было ли это решено раньше или прямо сейчас. Ответа на переспрос в окне нет.</p>\n<p><strong>2026-06-03 (id 487531)</strong> — Святая дева удаляется как персонаж целиком, и вместо неё одним из столпов злодеев становится Фатик. Здесь же даётся весь набор её способностей, её роль главы секты и имя секты (Фалим).</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0196-S05", "MR-0196--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Полный состав столпов злодеев не назван — в окне зафиксированы только два зачисления.</li>\n<li>Столпы героев, с которыми группа соотносится в сводке записи, в самих репликах окна не упоминаются и не описаны.</li>\n<li>Не сказано, что именно даёт статус столпа злодеев и кто его присваивает.</li>\n<li>Осталось нерешённым, был ли старик с гравитацией столпом злодеев изначально или это решили прямо в разговоре 2026-06-02: переспрос Миколая остался без ответа.</li>\n<li>Причина, по которой Святая дева убрана из вселенной, в переписке не названа.</li>\n<li>Реплика в id 487532 — «Конечно он ебанутый. Он блять каждый Божий день слышат крики о помощи. Его каждую ночь мучуют кошмары» — идёт следом за упоминанием инквизитора с чистой Оам, но о ком именно она, в тексте прямо не сказано.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["MR-0196--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-06-02</td>\n<td>487219–487229</td>\n<td>w0121</td>\n<td>неясно (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2026-06-03</td>\n<td>487531–487532</td>\n<td>w0121</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0196-stolpy-zlodeev.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0196--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0196.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
