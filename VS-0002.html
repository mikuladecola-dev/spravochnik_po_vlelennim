g>Кто кого чувствует.</strong> Сенсорика благословенного «позволяет ощущать других благослрвенных и арбетара или Протобионтов» (331635).</p>\n<p><strong>Кто на кого охотится.</strong> Апостолы и АЗИП — на чужемирцев, на нарушающих закон благословенных и владельцев артефактов, на арбетаров и фантазёров. Арбетары — на благословенных, чужемирцев и альф ради ритуала. Пераги — на всё разумное. Упыри — на людей и перагов.</p>\n<p><strong>Кто ест кого.</strong> Арбетар питается душами людей, но «на них вечность прожить не выйдет». Упырь ест человечину и перагов. Чужемирец-рассказчик 2025-02-12 благодарен защитнику: «он мне даль вкуснейший пир перед смертью, не каждый из моего мира хотя бы раз в жизни так вкусно и сытно питался».</p>", "r": []}, {"t": "Система способностей", "a": ["S05", "VS-0002-S05", "VS-0002--sistema-sposobnostey"], "h": "<h3>Откуда берётся благословение</h3>\n<p>Сила приходит от правителя мира и только от него. Формулировка 2025-03-10 (300888): «Благословенный это люди у которых есть связь с правителем другого мира, и чтобы получить его силу нужно сначала пропустить еë через мозг, из за этого благословенный не могут использовать благословенный 24/7».</p>\n<p>Развёрнуто устами Имитатора, 2025-03-19 (305856): <strong>«в каждом мире есть правитель. И в нашем он тоже есть. И та сила который ты получил называется благословения. Правитель другого мира устанавливает с тобой связь и через эту связь даёт тебе силу. Но каждый правитель может дать ограниченной количество благословение. И к факту. Благословения можеть получать только разумный житель кильке. Первого мира. Не знаю точно с чем это связано. Но это просто факт»</strong>.</p>\n<p>Полная формулировка в своде 2025-05-31 (331635): <strong>«Правители способны давать благословение. То есть настраивать связь с существом живущими в мире (благословения даётся только существами живущими в кильке). Настроив это связь с существом (без его разрешения). Правитель способен передавать свою силу через эту связь к существу (человеком чаще всего). Сама связь устанавливается на мозге. То есть сила или энергия проходит через мозг вредя ему»</strong>.</p>\n<p>Момент получения показан один раз, в прозе про Защитника 2025-03-14 (302380): «В момент, когда он должен был умереть. Он получил благословение. И не обычная, а от бога». В разборе на следующий вечер (302666–302681) Слава уточняет, что до этой сцены Защитник был просто человеком: «Нет ещё, иначе бы я написал бы белый глаза», «Он стал апостолом, когда его атаковали кровью в спину».</p>\n<p><strong>Зачем правителям это нужно</strong> (2025-01-06, 278938–278943). Миколай: «нахуя правителям других миров нашим людям давать благословение чтобы защитить не их мир». Слава: «Опять они вечно наблюдают за нашем миров можно сказать единственное развлечения в их ней бесконечное жизни»; «В раю много добрых людей и бог име проникся из за этого даёт благословение. У дьявола часто сбегают в грешники в наш мир и их надо возвращать поэтому он даёт благословение».</p>\n<p><strong>Зачем это нужно людям</strong> — там же (278932): «Так сука если дракон или ещё какая хуйня вылезет чё делать не палить же ядеркой».</p>\n<h3>Кто раздаёт и сколько человек получило</h3>\n<p>Счёт менялся несколько раз, и переписка это не сглаживает.</p>\n<ul>\n<li>2025-01-06 (278941–278944): «правитель минимиров довольно редко дают свой благословение. Больше все благословенный даёт бог и дьявол»; «И бог и дьявол могут дать свой благословение лишь 21 человеку».</li>\n<li>2025-01-06 (278966–278967): «А их именной сейчас 42 / Благословенный бога и дьявола».</li>\n<li>2025-01-06 (279068): «Всего их 41».</li>\n<li>2025-01-22 (283708–283712): Слава предлагает убрать благословенных дьяволом — «Тогда благословенных будет 21. Ну конечно можно оставить и 42. Ну я не знаю. Как думаешь сколько должно быть благословенных Богом 21 или 42». Миколай отвечает «21» (283747), но сам против удаления дьявольских: «я хочу благословенных дьяволом», «блин», «грустно» (283720–283722). Причина Славы (283730): <strong>«Потому что ничего про них придумать не могу»</strong>.</li>\n<li>2025-02-25 (295556–295557): «Благословенный ада / Которых 9», при списке из 14 позиций следом.</li>\n<li>2025-03-19 (305856) и 2025-05-31 (331635): 21 апостол правителя рая, «Другие же правители дают меньше».</li>\n</ul>\n<h3>Признак включённого благословения</h3>\n<p>2025-01-22 (283708): <strong>«Вообще благословенный Богом есть общая чёрта виде белых глаз при активаций благословения. И я эти глазами наделил всех тех который должны быть благословений дьяволом, при этом и менять я ничего не хочу потому что мне и так нравится»</strong>. Именно из-за этого совпадения и возникла мысль убрать благословенных дьяволом.</p>\n<p>В прозе (305856) признак приписан конкретному правителю: «И его глаза стали белыми. Это был признак использования благословенния правителем рая». В бою белые глаза «светящиеся в темноте» (302380). Отдельно 2025-03-14 (302670) правило проговорено как приём письма: пока в тексте не написаны белые глаза, персонаж не апостол.</p>\n<h3>Активация, временность, расход</h3>\n<ul>\n<li>2025-01-06 (278936): «Это человек получающий силу с другого мира, и это все ещё человек. Вообще благословение надо активировать чтобы его применить».</li>\n<li>2025-01-13 (281379): <strong>«Благословений это временная сила, типа еë нельзя долго сохранять. Например огонь стрельнуть по дереву оно горит, а после отключение благословенной огонь сразу исчезает»</strong>.</li>\n<li>2025-01-13 (281382): «Благословений не может быть активным постоянная, это тратит выносливость».</li>\n<li>2025-05-31 (331635): «например вам дали ьлагословенния и ваша уникальность способность это огонь. Вы можете поджечь лес. Но после отключения благословенния весь огонь исчезнет. Также и с другими способностями, который полученый благословеннием. После отключения благословенния они просто исчезают. Буть то огненный шар или остановка времени они просто отключаться».</li>\n</ul>\n<h3>Базовые умения — три несовпадающих списка</h3>\n<p><strong>2025-01-06 (278985), благословенные бога — пять:</strong> «усиления, регенерация, аура (просто аура), исцеление, глазки способны видеть эмоции». На вопрос Миколая «у каждого все эти» (278986) прямого ответа не прозвучало.</p>\n<p><strong>2025-01-06 (278987), благословенные дьявола — пять, но названо четыре:</strong> «усиления, регенерация, аура, способный чувствовать намерение людей, ????» — и «здесь я не знаю. Помоги».</p>\n<p><strong>2025-03-19 (305856), устами Имитатора — четыре:</strong> «Каждый правитель даёт разный способности. Но четыре базовых есть у всех. Это усиления, самоисцеления, энергия и сенсорика».</p>\n<p><strong>2025-05-31 (331635), свод — четыре, с расшифровками:</strong> усиленная регенерация; усиления тела и всех чувств; аура — «то бишь самая энергия, которая выплескивается и заставляет чувствовать страх е животных и обычных людей. Так же способный влиять на окружающей. При сильном скоплении»; сенсорика — «позволяет ощущать других благослрвенных и арбетара или Протобионтов».</p>\n<h3>Уникальная способность</h3>\n<p>2025-03-19 (305856): «У нас апостолов в отличие от всех. Способность формируется. То бишь у каждого апостола уникальная способность. У других же благословенных одним правителем. Одинаковые способности».</p>\n<p>2025-05-31 (331635), то же с уточнением: «Также у благословенного есть уникальная способность правителя (под уникальным подразумеввется, что у правителя уникальная благословенния дающий отличающий от всех других благословенной способность. НО если правитель, что дал вам благословения. Даст благословения ещё другому человеку. То оно будет такой же, как и у вас)».</p>\n<p>Пример уникальной способности, показанный в тексте, — «оранжевые пузырьки» Защитника (2025-03-19, 305857): руки и ноги становятся оранжевыми, на теле противника «начала надуваться мелкими и большими оранжевыми пузырьками. И БАМ. Упырь взрывается»; в воздухе рядом с ангелом такой взрыв «способный снести здания. Но не способные убить ангела».</p>\n<h3>Уровень силы и равенство</h3>\n<ul>\n<li>2025-01-06 (278932): «Но ты не бойся их Нея сила будет на уровне 10 то бишь они могут сломать деревянный дом не более». Миколай: «почему такие слабые». Слава: «А сильный и не нужный».</li>\n<li>2025-01-13 (281368): «Сразу всё благословенный равны по силе, путь то благословенный Богом, дьяволом, или другими правителем минимиров».</li>\n<li>2025-05-31 (331635): «так как всё благословенный включая апостолов. Получают плюс минус одинаковая количество энергии (силы). Они являются одинаково сильными. Но это не включая индивидуальность людей. Всё же апостолы всё равно чаще всего сильнее любого другого благословенного».</li>\n</ul>\n<p>Разница между противниками проговорена в прозе (302380): «Одно дело это сражаться без благословенния с обычным человеком. Зная, что ты можешь использовать благословенния в любой момент. Другой же дело это сражаться с другим благословенным. Ещё не обычным, а с апостолом».</p>\n<p>Верхняя планка «уровень 10 / деревянный дом» и показанный в тексте взрыв, сносящий здания, в переписке не сведены.</p>\n<h3>Цена: мозг, срок жизни, предохранитель</h3>\n<p>2025-03-19 (305856), на вопрос Защитника «почему после использования благословенния у меня болит голова?»: <strong>«Потому-что связь устанавливается с мозгом. И сила проходит через мозг. Повреждая его. Но не сильно. Именно из-за этого факта мы благословенный не можем использовать благословенния 24/7. И у нас благословенных есть предохранитель в голове. Который при случаи выгорания мозгов отключает благословенния. Но его можно…»</strong> — фраза в тексте обрывается. Миколай на следующий день спрашивает, что «его можно» (306157–306162), Слава договаривает: «Вырубить» (306163). В самой сцене боя предохранитель срабатывает не вовремя: «Не замечая, что благословения выключалось. Точнее его выключил предохранитель. А имитатор не научил вырубать этот предохранитель» (305857).</p>\n<p>2025-05-31 (331635): «Поэтому благословенный не часто используют благословения. Ведь это вредит мозгу. <strong>Средние продолжительность жизнь у благословенного после получения благословения 10 лет</strong>».</p>\n<p>2025-05-31 (331636), три ограничения одним куском: «Правители не как не могут влиять на благословенного или обычного существа (кроме как насильственно давать благословения, даже если само существо этого не хочет) (<strong>благословения даётся только одно. Больше человек не выдержит. И это одно благословения с ним до его смерти. Благословения нельзя разорвать</strong>). При этом правители всевидящий».</p>\n<p>Срок действия задан ещё в первый вечер: 2025-01-06 (278946–278948), Миколай «пока человек не сдохнет?» — Слава «Да».</p>\n<h3>Чего благословение не умеет</h3>\n<p>2025-03-13 (301867–301868): «Я же говорил вроде апостолы не способны лечить и влиять на разум»; «Благословенный вообще все». Реплика возникла из вопроса Миколая, умрёт ли Антон, если способность пропадёт; на вопрос о лечении Слава отвечает «Лекарствами и бинтами» (301866).</p>\n<h3>Связь между благословенными</h3>\n<p>2025-01-06 (279037): «Между благословенный бога есть связь и они в любой момент могут связаться с другими благословенными бога. У благословенными дьявола также. Но при этом благословенный дьявола и бога не могут с друг другом связываться». Миколай: «телепатия?» — Слава: «Ну типа того» (279039–279040). У апостолов телепатия названа отдельной дополнительной способностью (331635).</p>\n<h3>Что отключает благословение: чёрный шар</h3>\n<p>2025-05-14 (325841): «Артефакт — чёрный шар. Способность создаёт зону отчуждения, который решает благословенных благословенний. При этом на артефакты, альфоф и арбитаров никак не действует». Почему не действует (325844): «Так как их ней сила это их нея». Миколай уточняет: «на всегда или пока в зоне обрывает контакт с правителем?» (325847). Ответ (325855): «Зона куда связь не дотягивает, поэтому благословенный не получают силу. И да это временно. Пока ты находишься в это зоне».</p>\n<h3>Артефакты</h3>\n<p>Происхождение обсуждали 2025-01-13. Слава: «Артефакты как добавить, типо откуда они появится» (281370). Миколай дал два варианта подряд: (281371) «ну правители при создании своих миров периодически тратили энергию на создание артефактов в которых заключали идеи»; (281373–281376) «раньше веков 15 назад благословенные были мощее но типа их реже призывали поэтому они оставляли силу потомкам… и заключали её в артефактах», с оговоркой «мб про мощь убрать можно, просто думали что благословенных больше не будет и заботились о будущем». Слава ответил не выбором, а правилом про временность благословений; какой вариант принят — не решено.</p>\n<p>Итоговая версия в своде 2025-05-31 (331636): <strong>«Артефакты это объект, что имеет силу правителя. Из-за того, что. Когда то правитель пытался создать мир. И не в состоянии полностью контролировать этот процесс наделили какой-либо объект через чур большой сил этот самый объект. Примечания: Благословенный; альфа, Арбетары и фантазёры не способны раскрыть всю мощь артефакта. Так как уже сами переполненный силой. Лучшего всего мощь артефакта способен раскрыть обычный человек»</strong>.</p>\n<p>Отдельный класс там же: <strong>«Артефакты с символикой — это артефакт, который не был ни кем создан. Они появились вместе с правителями и имеют невероятную мощь. Но смертным существами некогда не раскрыть хотя бы 3 процентов всей мощи артефакт»</strong>.</p>\n<p>Артефакт-медиатор (2025-03-06, 298827, предложение Миколая, названное им самим сырым): «артефакт по типу медиатора позволял менять натяжение струн пространства всех миров… если играть на правильной частоте то например он мог на увеличенной площади или на далеком расстоянии использовать свою способность передовая по волне струны. однако, если этот артефакт использует правитель или может использовать его через какую-то установку можно воздействовать на струнную связь между мирами». Слава: «Да сырая идея, ну можно отталкиваться» (298834).</p>\n<h3>Ритуал становления Арбетаром</h3>\n<p>Разложен в прозе 2025-03-13 (301806–301809, повтор в полной редакции 301821–301824).</p>\n<p><strong>Материалы:</strong> «И один из этих материалов ты, и пару чужемирцов, и ещё один благословенный и самая сложная альфа». Порядок трудности проговорён прямо: благословенного убить легко (не может пользоваться силой долго), чужемирцев труднее, альфу сложнее всего — пришлось «ждать пока какой-нибудь апостол упустить альфю. При этом доведя его до полусмерти».</p>\n<p><strong>Роли компонентов</strong> (301807): <strong>«я использую мозг благословенного, чтобы он начал собирать силу. И тело Альфы дабы он его пресовал. А всё остальные компоненты служат активаторами. И после того как вся это сила от прессуется она пройдёт через тебя. Нет. Точнее ты станешь для неё сосудом. Она будет накапливаться в тебе. Пока выдерживает твоей тела. А после твоя душа покроет эту силу. Сделав еë более безопасная для меня. Повысив шанс на моей выживания»</strong>.</p>\n<p><strong>Числа:</strong> «Изначально без твой души шанс моего удачного поглощения составляет 0%. Да вот поэтому ты важный компонент, с тобой мой шанс подрастёт на 8%. Мало думаешь да. Тоже так думаю».</p>\n<p><strong>Проводник</strong> (301806): <strong>«В моём обряде нужен проводник. С чистой душой. Ну конечно не прям 100% чистой душой, а где-то на 80% плюс минус. Для этого всё арбетаты чаще всего используют детей лет от 3 до 12, где-то. Но ты человек с 89% чистой душой подходишь лучше чем дети. Как никак через тело и душу ребёнка проходить мало силы, а вот через тебя. Со взрослым телом и крепкой душой пройдёт куда больше силы»</strong>. Что такое чистая душа — спросил Миколай (301842). Ответ Славы (301848): «По настоящему добрых людей». Миколай (301853): «все равно не понятно 😔». Критерий так и остался неразъяснённым.</p>\n<p><strong>Сцена обряда:</strong> кровь на траве, символика, мозг на алтаре, в центре «тело, какой-то анатомический неправильной», старик что-то читает, «Словно ветер подул, и искажения воздуха идет, как на кастром. Но здесь нет огня, нет тепла… Мозг светиться и словно шевелиться».</p>\n<p><strong>Выживание проводника</strong> объяснено отдельным устройством (301808): у Антона в мозге лишний кусок — мозг брата, «Такой бывает редко когда две ячейклетки сливаються в одну». «В одном теле было две души, и обе были чисты. Поэтому во время обряда. Не знаю как. Но больший урон получила душа твоего брата, а после его забрал старик».</p>\n<h3>Отдельные случаи, ломающие общее правило</h3>\n<p><strong>Бессмертный — благословение всегда включено.</strong> 2025-03-10 (300765): «Глаза у него всегда белые потому что, у него благословение всегда активно, вот поэтому у него иногда мозг вытекает, но с помощью своей силы он может его восстанавливать, но всё забывает». Сила — управление кровью и частями тела, запускается через гнев от боли.</p>\n<p><strong>Защитник — чутьё без благословения.</strong> 2025-02-12 (288545): после того как Защитник выпытывал информацию у пойманного шестирукого чудовища, «он начал как то инстинктивно понимать, где находиться чужимирцы словно благословенный. Но он им не был». Как это получилось, в переписке не объясняется.</p>\n<p><strong>Имитация чужого благословения.</strong> 2025-03-19 (305857): Имитатор убивает упыря взрывом оранжевых пузырьков, то есть способностью Защитника, и Защитник это фиксирует: «Он сымитировал мою способность. Удивляясь, как можно использовать своей благословенния». Правило имитации сформулировано отдельно (2025-01-28, 285363): «Его способность имитировать способность врага, но лишь одну способность и то ему надо время, но плюс способность в том что он конечно имитирует но способен будет еë развить».</p>\n<h3>Что было предложено и отклонено</h3>\n<p><strong>Добродетели и грехи как основа благословений</strong> (Миколай, 2025-01-06, 278968–278984). «благославления и заповеди / можно спиздить» → Слава: «Нафига». Миколай переформулировал: «добродели / и грехи / как основа благословения» и вставил список тринадцати добродетелей (воздержание, молчание, порядок, решительность, бережливость, трудолюбие, искренность, справедливость, умеренность, чистота, спокойствие, целомудрие, скромность) с предложением «опираясь на них придумать че нибудь». Слава ответил не по теме — про грехов как существ минимиров, — и к предложению не вернулись.</p>\n<p><strong>Пятое базовое умение благословенных дьявола</strong> (2025-01-06, 278987–279021). Перебрали: отравление и яд («а яд че» — «Не»), глаза, «способны видеть хз, прошлые мысли человека или его прошлое или мысли», разложение — «ну как-то блять склонность к разрушению надо подчеркнуть, по типу разложения», сразу же самим Миколаем забракованное «но тоже перебор», и сквозной удар: «уходящий в твёрдое игнорирующий мягкое, тобиж урон доспехам и костям мб, коже и мышцам нет». Итог Славы (279021): <strong>«Ладно пока просто выкинем»</strong>.</p>\n<p><strong>Убрать благословенных дьяволом</strong> (Слава, 2025-01-22, 283708–283730). Причина — совпадение белых глаз и «Потому что ничего про них придумать не могу». Миколай против. Решение в окне не принято; дальше по материалу благословенные дьяволом не разрабатываются, а 2025-05-14 (325846–325850) Слава бросает название снова и напоминает: «Ты же хотел создать их» — Миколай: «да, было дело».</p>\n<p><strong>Способность воплощению гнева</strong> (2025-01-22, 283703–283802). Отклонено подряд: левитация; неудача — «мб неудача? я бы стал таким если бы меня всегда приследовала неудача»; скорость — «типа вот ему не нравится и он не терпит никогда, он берёт и пиздит тех кто не нравится… и не карают его ибо быстрый», ответ Славы (283728): «Воплощений гнева. Непробиваемому чудовище. Страх всех чужемирцов. Способность скорость не подходит»; вулкан — «типа каменная кожа, внутри из лавы, даже если сломать камень он не упадёт, просто завязнет в лаве», ответ — «🚫» (283745); вариант от нейросети — «Нет» / «Потому что» / «Не хочу», на что Миколай: «если объяснишь будет проще понять в какую сторону двигаться». В каталоге у Гнева в итоге стоит просто «сила».</p>\n<p><strong>«Слово закон» → «выход за предел»</strong> (2025-01-23 — 2025-01-24, 284175, 284255–284275). Исходно у Гордыни было «Слово закон с ограничением». Слава: «Типо слова закон, че то я не могу представить битву». Миколай предложил «выход за предел»: «он гордится силой, отрицая ограничения тела. он легко способен сбросить естественные биологические ограничители, но после такие травмы получить» — и прислал список ограничителей (центральный регулятор усталости, болевые рецепторы, терморегуляция, инстинкты самосохранения). Оценка Славы: «Ну пока звучит плохо». Миколай оставил как запасное: «ну можно как одна из его особенностей но не основная». Итоговый вариант не выбран; у Гордыни в каталогах не проставлена сила ни в одной редакции.</p>\n<p><strong>Поглощение у Алчности</strong> (2024-12-24 — 2025-01-24). Миколай предлагал Алчности воровство вещей в пространственное хранилище плюс «возможность совершить сделку с дьяволом» и проклятье «ты не можешь ничего отдать кому либо» (273906). Слава: «Я думал больше о способности поглощений чужой манный или объектов» (273920). Миколай согласился, что версия Славы лучше, но «мне понравилась идея со сделкой в дьявола» (274462); сделка с дьяволом в дальнейшие каталоги не попала. В каталоге 2025-01-24 (284278) Алчность закреплена как «всё моей», а поглощение ушло к Чревоугодию.</p>\n<p><strong>Ранжирование выпадающих способностей у Чёрного ящика</strong> (Миколай, 2024-11-17, 258926–258937). «они ранжированы? тобиж уникальные, редкие обычные эпичные». Слава: «Нет, каждая способность по своему полезная в разных ситуациях». Миколай: «ну ранг не это определяет, а определяет скорее шанс выпадения». Слава: «Нет / Нету». Повторное предложение через час (259016) осталось без ответа.</p>\n<p><strong>Разные кубики под разные способности</strong> (Миколай, 2024-11-17, 259060–259072). Предложил разбить набор одного персонажа на отдельные кубики — реген, управление огнём, сила, передвижение в земле. Слава: «Нет типо разделять способности который изначально были вмести как глупо», «Да и плюсом все по отдельности они какие то слабый». Миколай: «нет, всё вместе это чит», «слабые, но полезные».</p>\n<p><strong>Слабость «молния + вода»</strong> (Миколай, 2024-11-17, 259049–259053). «ну как будто можно из этого сделать слабость к способносте, типа такое сочетание дебафит или отключает способность или пользователя». Слава: «Ну это потом». К этому не вернулись.</p>\n<h3>Вопросы, оставшиеся без ответа</h3>\n<p>2025-05-31, сразу после свода (331658–331662), Миколай спрашивает: «возможно ты объяснил, но лучше напиши, почему им»; «корову можно?»; «я могу её поглощать? левый чел. это энергия правителя? что он об этом думает? о выпуске энергии. а мозгу так легче, когда энергия во вне текёт? а если бы не лилась?»; «можно бессмертному дать второе?»; «как?». Ответы в окно не попали.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Отклик — не материал авторов</b>\n<p>Самое сильное здесь не устройство мира, а то, как вселенная умирает и не умирает. Монолог 25 марта написан всерьёз — «Была самой целестной», «Но для меня она исчерпала себя», — и адресат в этот момент сидит в очереди на флюорографию и отвечает «ей пиздец». А через несколько часов: «Сука первая что я сделал в голове это перенёс апостолов». Похороны, на которых покойник встаёт до конца дня, — и оба соавтора это спокойно принимают. Второе, что зацепило: контракт агента. Двести тысяч на подготовке, страховка, сеанс с психологом при психотравме и отдельный пункт про то, что делать с выплатой, если у погибшего никого нет — «отправленная на благотворительность с вашего имени». Кто-то додумал бухгалтерию смерти в мире, где главная проблема — как убить существо, способное разнести солнечную систему. И ответ на претензию «получается рубли и язык русский.... мде» — «Вот здесь да придумать надо чтото» — честнее, чем любая заплатка.</p></div>", "r": []}, {"t": "Кончина", "a": ["S06", "VS-0002-S06", "VS-0002--konchina"], "h": "<h3>Отход, 2025-03-20 (w0083, 306559–306601)</h3>\n<p>Слава (306564): <strong>«Ну я сейчас хочу слегка отойти от вселенной. Там страха нет. Везде апостолы, силы, нет смертей нет рисков»</strong>.</p>\n<p>Дальше — постановка задачи для нового текста, дословно: <strong>«Нужно поставить вопрос»</strong>, <strong>«Что ты человек против зла или говна человеческого»</strong>, <strong>«Обычный и ты нихера не получишь благословение или силы»</strong>, <strong>«Тебя не кто не спасет»</strong>, <strong>«Твой враг опасен»</strong>, <strong>«Он убьёт или сделает хуже»</strong>. На вопрос Миколая «кто?» — <strong>«Не знаю. Это лишь задумка»</strong>.</p>\n<p>Уточнение природы врага (306576): <strong>«Ну то бишь там может быть не сверхчеловеческой монстр, а просто человек. Гнилой и мерзкий но всё ещё человек»</strong>. И направление: <strong>«И хочу больше попытаться в психологию усугубляться»</strong>, «И атмосферы». Оговорка: «Но это опять всё задумки. Хер знает, что в итоге будет».</p>\n<p>Название вселенной в этом разговоре не произносится — объявлен только отход от неё. Этой датой закрывается первая полоса жизни вселенной.</p>\n<h3>Отделение новой истории, 2025-03-21 (w0084, 306746–306765)</h3>\n<p>Слава (306750): <strong>«В новая история не связана с моей вселенной»</strong>. Пояснение мотива: «Пытаюсь поймать дзынь» — на переспрос «дзынь или дзен?» отвечает: <strong>«Баланс»</strong>. Разграничение имён (306760): <strong>«Там просто есть Михаил но это не тот Михаил который „медведь“»</strong>.</p>\n<h3>Прощание, 2025-03-25 (w0085, 310843–310931)</h3>\n<p>Монолог Славы, дословно подряд:</p>\n<ul>\n<li><strong>«Пора прощаться»</strong> (310843)</li>\n<li><strong>«Это вселенная (апостолов ) была хорошая»</strong> (310844)</li>\n<li><strong>«Была самой целестной»</strong> (310845)</li>\n<li><strong>«Но для меня она исчерпала себя»</strong> (310846)</li>\n<li><strong>«Конечно пока мы будем придерживаться еë. Пока я не создам новую»</strong> (310847)</li>\n<li><strong>«Ну ей уже можно сказать пока»</strong> (310848)</li>\n<li><strong>«Так как дальше я еë развивать не буду»</strong> (310849)</li>\n</ul>\n<p>Миколай в этот момент в поликлинике («жду очередь в 76 человек на флюорографию», «я в уведах читаю думал у тебя рак»), Слава: «Я здесь такой монолог пишу, а ты не реагируешь». Реакция Миколая, дословно: <strong>«я уве понял что апостолов вселенная»</strong>, «ну», <strong>«ей пиздец»</strong> (310869).</p>\n<p>Слава уточняет статус (310872): <strong>«Пока что нет. Но новая вселенная уже придумается. Так что ей возможно не долго»</strong>. И добавляет (310874): <strong>«Для меня апостолы были самой сбалансированный истории»</strong>. Затем просит: «Скажи пару слов».</p>\n<p>Слова Миколая (310880–310900): <strong>«мне казалось мы прямо жёстко будем её развивать»</strong>, <strong>«ваще не думал что она умрёт»</strong>, «ты развивал её по большей части», <strong>«но она была в принципе сильная»</strong>, <strong>«надо развиваться»</strong>, <strong>«и если идея себя исчерпала»</strong>, <strong>«то почему бы не перейти на другую»</strong>, <strong>«я не буду держаться особенно если для тебя она всё»</strong>, <strong>«это нормально»</strong>.</p>\n<p>Причина от Славы (310886): <strong>«Я не могу. Для меня она всё больше не как»</strong>.</p>\n<p>Что остаётся после (310901): <strong>«Ну перс и артефакты. Возможно останутся. Хотя не факт. Возможно я создам вселенную вообще без сил»</strong>.</p>\n<p>Состояние замены на момент прощания (310922–310927): <strong>«Вообще у меня даже задумки нет»</strong>, <strong>«Я просто захотел новую»</strong>, <strong>«Чистую»</strong>, «Если будут идей подкидывай», «С ноги». Миколай: «хорошо», «но пока нету», «и мне неудобно».</p>\n<p>Отдельно Миколай признаётся, что и у него запал спал: «возможно мне придётся насильно писать», «ибо мне тоже немного настоебенило», «эта идея которую я начал крутая», «но как-то», «хз как работу продолжать», «но я все равно напишу её уже».</p>\n<p>Кончина объявлена как решение автора, но пользоваться вселенной соавторы продолжают до появления новой (310847). Причина названа — исчерпанность для автора, не претензия к устройству мира: оценки самой вселенной в момент прощания положительные.</p>\n<h3>Отдых, 2025-09-12 (w0104, 364757–364761)</h3>\n<ul>\n<li>Слава (364757): «Хотя это просто редактирования старой вселенной»</li>\n<li>(364758): <strong>«Ну вселенную Апостол куда-нибудь в долгий ящик я не убираю. Просто отдохнуть от неё. Да и сама вселенная апостолов достаточно сложная и запутанная. Что даже я забываю кто че»</strong></li>\n<li>(364759): <strong>«Новая вселенная по сути лёгкая пока что. Всё же хуй знает как я замудрю»</strong></li>\n<li>(364760): <strong>«Самая сложная и пугающие для меня там стало это множество миров. Всё же множество миров для меня звучит слишком за мудрено сейчас»</strong></li>\n<li>(364761): <strong>«Новая вселенная более простая»</strong></li>\n</ul>\n<p>Это последнее объявление по вселенной и конец второй полосы её жизни. Здесь же единственный раз в дословных выписках произнесено само название — «вселенную Апостол».</p>\n<h3>Граница: что после 2025-09-12</h3>\n<p>Всё, что после 2025-09-12, в базе идёт уже как другая вселенная, хотя работает с теми же классами. Для полноты границы, без включения в состав «Апостола»: организация Нимб «более не фармавечическая компания это религиозная церковь» (364762); апостолы там — 21 телепатически связанное существо, но не люди, а насекомые из разных коконов (364808, 370732); появляется вражда апостолов с религиозной организацией и публичное раскрытие «тёмной изнанки» с подписанием договора о правах и обязанностях благословенных (364774); заведены одержимые как аналог арбетаров и организации охотников на них (364766–364768); 2025-09-17 (366040) одержимые переименовываются в антиапостолов «С тёмными глазками»; 2026-04-19 (462205) благословенные переопределяются как «люди, что способны чувствовать присутствия когото. Кого именно неизвестно, может бог, может ещё какое-то существо». К вселенной «Апостол» этот материал в базе не отнесён.</p>", "r": []}, {"t": "Возвраты", "a": ["S07", "VS-0002-S07", "VS-0002--vozvraty"], "h": "<h3>2025-03-25, тем же днём (w0085, 311180–311181)</h3>\n<p>Через несколько часов после прощания Слава (311180): <strong>«Сука первая что я сделал в голове это перенёс апостолов и уже придумал им логическая объяснения. Даже не до конца придумав мир»</strong>. И (311181): <strong>«Какой же я гений»</strong>. Похороненная вселенная частично возвращается внутрь новой; что это за «логическое объяснение», в переписке не изложено.</p>\n<h3>2025-05-09 (w0094, 324457–324462)</h3>\n<ul>\n<li>Слава: «Можешь меня поздравить» (324457)</li>\n<li>(324458): <strong>«Я возвращаюсь к благословенным»</strong></li>\n<li>(324459): <strong>«Истории писать именно о вселенной или похую разный истории в разных вселенных. То бишь не ограничивать себя»</strong></li>\n<li>Миколай (324461): <strong>«не ограничивай»</strong></li>\n<li>Миколай (324462): «еее, поздравляю»</li>\n</ul>\n<p>С этого объявления начинается вторая полоса жизни вселенной. Разрыв между полосами — с 2025-03-20 по 2025-05-09; отдельного объявления, объясняющего этот промежуток, в переписке нет.</p>\n<h3>2025-06-10 (w0100, 335356–335362)</h3>\n<ul>\n<li>Слава: «Просто я удивился» (335356)</li>\n<li>(335358): <strong>«Я придумал новую вселенную»</strong></li>\n<li>Миколай: «стой»</li>\n<li>(335360): <strong>«Но главная вселенная всё равно апостол»</strong></li>\n<li>Миколай: «расскажешь при встрече»</li>\n</ul>\n<p>Новая вселенная её не отменяет. Что это за новая вселенная — в переписке не раскрыто; содержания встречи в чате нет.</p>\n<h3>2025-09-12</h3>\n<p>Формально последнее объявление — не о конце, а об отдыхе: «куда-нибудь в долгий ящик я не убираю. Просто отдохнуть от неё» (364758). Сводная таблица карточки формулирует это событие обратным образом — «откладывается „в долгий ящик“»; верной считается формулировка автора.</p>\n<p>Позднее упоминание: 2026-02-06 (w0115, 429334–429347) Миколай кидает сгенерированный нейросетью документ по вселенной; Слава: «Давно не читал про вселенную правитель. Поэтому понравилась». Содержание документа за ссылкой, в переписке его нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "VS-0002-S08", "VS-0002--probely"], "h": "<div class=\"gaps\"><p><strong>О самой вселенной</strong></p>\n<ol>\n<li>Что было до неё. Первая полоса открыта сменой 278841 от 2025-01-06 с цитатой «А и вселенная поменялась ты же не против?», но дословного блока этого сообщения нет, и какая вселенная сменилась на «Апостол» — не названо. Из чего «Апостол» выросла, не сказано.</li>\n<li>Почему содержание вселенной старше её объявления (позиции от 2024-01-30 и далее при отрезке с 2025-01-06) — в переписке не обсуждается.</li>\n<li>Когда и кем вселенная получила имя «Апостол». Название произносится единственный раз, 2025-09-12 (364758); самого акта наименования в переписке нет.</li>\n<li>Названия «Благословенная» в переписке нет вообще. Есть «благословенные» как обозначение вселенной в 324458 и «Благословенный» как класс и раздел реестра.</li>\n<li>Разница между написаниями «Килька» и «Кильке» не оговорена: Слава пишет оба варианта вперемешку, соавторы этого не обсуждают.</li>\n<li>Разграничение слова «апостол» как имени вселенной и как обозначения носителя силы не проводится.</li>\n<li>Разрыв между полосами (2025-03-20 — 2025-05-09) не объяснён отдельным объявлением, кроме реплики 311180 о переносе апостолов в новый мир.</li>\n<li>Что за новая вселенная объявлена 2025-06-10 (335358) — не раскрыто: Миколай отвечает «расскажешь при встрече», содержания встречи в переписке нет.</li>\n<li>Судьба того, что Слава обещал сохранить при прощании — «Ну перс и артефакты. Возможно останутся. Хотя не факт» (310901) — в дальнейших объявлениях не подтверждена и не опровергнута.</li>\n<li>Что за «логическое объяснение» апостолам в новом мире (311180) — заявлено и не изложено.</li>\n<li>Судьба Семи грехов после их удаления 2025-03-06 («Грехи нужно убрать, а то тупо», «в сюжет не совсем входят») — они при этом остаются отдельными позициями в описи вселенной. Отменяет ли удаление из списка их существование в мире, не сказано.</li>\n<li>Обещанная 2025-03-10 история о том, как люди становятся Арбетарами («Моя следующая история, о том как они это делают», 300912) — текста с таким прямым описанием в прозе вселенной не отмечено.</li>\n<li>Замысел, ради которого объявлялся отход 2025-03-20 («не сверхчеловеческой монстр, а просто человек. Гнилой и мерзкий но всё ещё человек») — чем он кончился, не сказано; сам автор оговорился «Но это опять всё задумки. Хер знает, что в итоге будет».</li>\n<li>Нераскрытые термины, перечисленные самим рассказчиком 2025-03-18 (305117): «силы зверя» и «классификация» больше нигде не раскрываются.</li>\n</ol>\n<p><strong>Об устройстве миров</strong></p>\n<ol start=\"15\">\n<li>Точное число миров. На прямой вопрос «3 мира и много минимиров или будут потенциально ещё миры но мы молчим?» — «Ну это надо подумать», «Ну пока 3 мира» (278895–278897). Позже миры «появляются и по сей день», числа нет.</li>\n<li>Ритуал перехода между мирами не придуман: в авторском тексте прямо стоит «С помощью ритуала???» (331635, повтор 375849). На вопрос «жертвенный?» — «Я не знаю», «Я просто это добавил», «Потом придумаю» (305403–305405).</li>\n<li>Мотив уничтожения миров раем. Вопрос Миколая «зачем?» (295214) — без ответа. Внутри самого текста имитатор тоже ответа не получает (305858).</li>\n<li>Как создаются минимиры — вопрос задан 2025-01-06 (278893), ответ отложен: «Ну это надо подумать».</li>\n<li>Судьба Ада после марта 2025: в поздних версиях первым идёт Килька, вторым Рай, ад в перечне не появляется, переопределения нет.</li>\n<li>Могут ли правители менять размер своего мира — вопрос «размеры тоже?» (278882) остался без прямого ответа.</li>\n<li>Как соотносятся Сущности (284854) и Протобионты (331635) — в переписке не проговорено.</li>\n<li>Слово «существо» употребляется в двух значениях — правитель нашего мира и самый сильный из всех (278886–278889) и «ребёнок правителя, который имеет физическую оболочку», один из трёх видов чужемирцев (300760, 300891); переход между ними не объяснён. На прямой вопрос «че такое существо? нахуя и с чего» — «Фиг знает» (331653).</li>\n<li>Что стало со Смертью и с логикой «дьявол возвращает грешников через смерть» после отмены посмертия 2025-01-22 (283827–283828) — не сказано.</li>\n<li>Не сказано прямо, что чёрная дымка — это и есть способ «правитель сам тебя отправляет»; герой это только предполагает (305855).</li>\n<li>Правители минимиров как отдельный класс (281368) в поздних сводках 2025-05-31 и 2025-10-18 не переупоминаются.</li>\n<li>Замечание Миколая, что «рай и ад миры не совсем зависящие от нашего мира» (278945), осталось без ответа.</li>\n<li>Механика скрещивания чужемирца с животным: на вопрос (279035) ответ «Выйдет какая та хуйн» (279038).</li>\n<li>Есть ли протобионты у любого правителя — «Ну да наверное» (331657), твёрдо не закреплено; ни одного именованного протобионта нет.</li>\n</ol>\n<p><strong>О силах</strong></p>\n<ol start=\"29\">\n<li>Численность благословенных: за один вечер 2025-01-06 названы 21+21, потом 42, потом 41. 2025-01-22 Слава спрашивает «21 или 42», Миколай отвечает «21», подтверждения от Славы нет. Отдельно 2025-02-25 «Благословенный ада / Которых 9» при списке из 14 позиций — расхождение не оговорено.</li>\n<li>Судьба благословенных дьяволом: Слава хочет убрать, Миколай против, решения нет; 2025-05-14 название всплывает снова и снова гаснет.</li>\n<li>Как соотносятся ранняя раскладка «бог и дьявол дают благословения» и поздняя «правитель рая даёт 21 апостола» — прямо не сведено.</li>\n<li>Пятое базовое умение благословенных дьявола не выбрано и «пока просто выкинуто» (279021). Три списка базовых умений (пять / четыре / четыре с другими названиями) между собой не сведены; на вопрос «у каждого все эти» (278986) ответа нет.</li>\n<li>«Благословение долга» — термин произнесён 2025-03-13 (301806) и не раскрыт.</li>\n<li>«Чистая душа» — критерий не разъяснён; Миколай прямо говорит «все равно не понятно» (301853).</li>\n<li>Ритуал, которым альфы и арбетары вырывают кусок силы своего мира, — «ритуал???», «Которой я ещё не доработал» (331636).</li>\n<li>Происхождение артефактов: два варианта Миколая (правители заключали идеи при создании миров / благословенные 15 веков назад оставляли силу потомкам) — какой принят, не решено. Противоречие «артефакт хранит силу» против «благословение сохранять нельзя» не закрыто.</li>\n<li>Верхняя планка силы: «уровень 10, сломать деревянный дом, не более» (278932) против взрыва, «способного снести здания» (305858).</li>\n<li>Правило «чтобы убить одного греха в максимум надо 3 благословенных именно Бога. А для остальных благословенных надо будет 5» (284276) читается двояко.</li>\n<li>Как обходить предохранитель, в тексте не показано: фраза оборвана (305856), договорена только служебной репликой «Вырубить» (306163).</li>\n<li>Чутьё Защитника на чужемирцев «словно благословенный, но он им не был» (288545) никак не объяснено.</li>\n<li>Связан ли Чёрный ящик с Чёрным шаром — не выяснено; содержимое Чёрного ящика для этой вселенной не раскрыто, во всех реестрах он стоит только строкой в разделе «Идей».</li>\n<li>У греха Гордыни в каталогах не проставлена сила ни в одной редакции.</li>\n<li>Ни один из вопросов Миколая от 2025-05-31 (почему благословение дают именно этим существам; можно ли благословить корову; можно ли поглощать эту энергию; что правитель думает о выпуске энергии; легче ли мозгу, когда энергия течёт вовне; можно ли дать Бессмертному второе благословение) ответа не получил (331658–331662).</li>\n<li>«Он тоже арбетар пусть и слабый?» — вопрос Миколая (301879) без ответа.</li>\n</ol>\n<p><strong>О населении</strong></p>\n<ol start=\"45\">\n<li>Родство видов чужемирцев между собой оставлено неизвестным внутри самого текста: «Может они родственники, а может просто подчинённый и слуга» (288543). Устройство их мира не описано.</li>\n<li>Кто именно из списка врагов чужемирец — Слава сказал только «где-то 7» и вычеркнул зонтика и лешего; полного ответа нет.</li>\n<li>Происхождение упырей — «Это заража из рая. Или это попытка правителя спасти людей. Не знаю» (305855).</li>\n<li>Происхождение перагов и их связь с расколом солнца в окне 2025-02-24 не сказаны; объяснение через заражение появляется только 2025-03-19.</li>\n<li>Гурман — единственная позиция раздела «Одержимый» в реестре, без раскрытия; чем одержимые отличаются от благословенных, в окне 2025-02-25 не объяснено.</li>\n</ol>\n<p><strong>Об организациях и реестрах</strong></p>\n<ol start=\"50\">\n<li>Пункт 6 контракта АЗИП обрывается на номере — текста нет (331072).</li>\n<li>Общее число сотрудников АЗИП автор не знает: «Могу вкинуть рандомной число» — 700 000 000 (331447–331448).</li>\n<li>Правовое основание полномочий негосударственной организации не придумано; вариант Миколая «совет 300+ государств» (331241) остался без ответа.</li>\n<li>На каком языке агент говорит с чужемирцем — «Вот здесь да придумать надо чтото» (331460). Тот же вопрос задан отдельно 2025-05-30 (331245).</li>\n<li>Считается ли еда имуществом организации — «Еда разве является имуществом» (331461), решения нет.</li>\n<li>Мотивы организации злодеев не сформулированы; имени у главы нет; переходит ли эта организация в группировку сестры — не сказано.</li>\n<li>Зачем сестре объединять миры — «не знаю но придумаю» (298826). Кто в её команде перевернёт ход финальной битвы — открытый вопрос на 2025-08-30 (359688). Чья именно она сестра, в w0103 не сказано.</li>\n<li>Что такое организация Нимб внутри «Апостола» — не сказано (325808); связь двух вселенных, кроме совпадения Масочника и Демона в руководстве Нимба, не заявлена.</li>\n<li>У фармацевтической компании из таёжной истории нет названия; связь с Нимбом не заявлена.</li>\n<li>Церковь, Военный, Сторонние силы — только строки реестра с именами и эмодзи; отношений с АЗИП и апостолами нет, что такое «Церковь» как организация — не сказано.</li>\n<li>Расхождение «21 апостол по лору / 14 позиций в реестре» и совпадение «21 главный филиал АЗИП / 21 апостол» в переписке не обсуждаются.</li>\n<li>Пункт 10 реестра — «Ученица???» — оставлен со знаками вопроса с 2025-01-24 по 2025-05-14 включительно.</li>\n<li>Раздел «Существа» пуст во всех редакциях реестра.</li>\n<li>Воительница и Разрушительница: совпадают эмодзи 💪 и оружейный браслет, имена разные; тождество не подтверждено. Вопрос Миколая «воительница просто прозвище по способности а не по профессии?» (285413) остался без ответа.</li>\n<li>Различие двух сцен вербовки (Антону предлагают жизнь под слежкой, Максиму — просто вернуться домой) в переписке не проговаривается.</li>\n<li>Число «42 человека» из реплики Миколая 279034 не расшифровано.</li>\n</ol>\n<p><strong>Служебное</strong></p>\n<ol start=\"66\">\n<li>В шапке карточки вселенной стоит «отрезков объявлено: 12», а в таблице отрезков жизни две строки; двенадцать соответствует числу событий-объявлений. В переписке это никак не отражено — служебная неточность карточки.</li>\n<li>Внутреннее расхождение карточки за 2025-09-12: сводная строка говорит «откладывается „в долгий ящик“», дословный текст 364758 — «куда-нибудь в долгий ящик я не убираю». Верной считается формулировка автора.</li>\n<li>Расхождение в карточке правителя нашего мира: навигация говорит «Сейчас нейтрален», сама реплика Славы (278868) — «но сейчас он не нейтрален, в сюжете пока его не будет».</li>\n<li>Границы трёх событий поставлены не по прямому объявлению, а служебно: 2025-03-18 (отдельного объявления о смене вселенной в окне нет), 2025-03-20 (название вселенной не произносится, объявлен только отход), 2025-03-21 (оформлено как продолжение отхода).</li>\n<li>Содержание документа, сгенерированного нейросетью 2026-02-06 (429334–429347), в переписке отсутствует — только ссылка и реакция.</li>\n</ol></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["VS-0002--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0047.html\">Артефакты</a></li>\n<li><strong>Упоминает прозу:</strong> <a href=\"PR-0060.html\">Блог Максима (\"Здравствуйте, дорогие слушатели\") — история про агента</a></li>\n<li><strong>Группы:</strong> <a href=\"GR-0001.html\">Апостолы (организация апостолов, «благословенные Богом»)</a>, <a href=\"GR-0002.html\">Семь грехов</a>, <a href=\"GR-0003.html\">Гении (ранее «Аномалия»)</a>, <a href=\"GR-0004.html\">АЗИП («Апостол закон и права»)</a>, <a href=\"GR-0005.html\">Агенты (организация вербовки)</a>, <a href=\"GR-0006.html\">Организация злодеев</a>, <a href=\"GR-0007.html\">Команда (подручные) сестры</a>, <a href=\"GR-0008.html\">Команда против Серафима («пати»)</a>, <a href=\"GR-0009.html\">Организация Нимб (НБО)</a>, <a href=\"GR-0010.html\">Церковь</a>, <a href=\"GR-0011.html\">Братья и сёстры (благословенные одним правителем)</a>, <a href=\"GR-0012.html\">Теневые братья</a>, <a href=\"GR-0013.html\">Благословенные</a>, <a href=\"GR-0014.html\">Одержимые</a>, <a href=\"GR-0015.html\">Отряд сильнейших</a>, <a href=\"GR-0016.html\">Отряд: Старик, Рыжий, Доктор, Капитан</a>, <a href=\"GR-0017.html\">Арбетары</a>, <a href=\"GR-0018.html\">Альфы</a>, <a href=\"GR-0019.html\">Чужемирцы</a>, <a href=\"GR-0020.html\">Междумирцы</a>, <a href=\"GR-0021.html\">Упыри</a>, <a href=\"GR-0022.html\">Пераги</a>, <a href=\"GR-0023.html\">Правители (правители миров, правители минимиров)</a>, <a href=\"GR-0024.html\">Протобионты (сущности, дети правителей)</a>, <a href=\"GR-0025.html\">Фантазёры (творцы)</a></li>\n<li><strong>Персонажи:</strong> <a href=\"PS-0048.html\">Максим</a>, <a href=\"PS-0050.html\">Дима</a>, <a href=\"PS-0383.html\">Имитатор</a>, <a href=\"PS-0118.html\">Антон</a>, <a href=\"PS-0171.html\">Палач</a>, <a href=\"PS-0177.html\">Гнев (грех)</a>, <a href=\"PS-0178.html\">Смерть</a>, <a href=\"PS-0179.html\">Благословенные</a>, 223.html\">Дмитрий Рутковский («Агрегат»)</a>, <a href=\"PS-0224.html\">Старик-арбетар</a>, <a href=\"PS-0225.html\">Пустынник</a>, <a href=\"PS-0226.html\">Арбетары</a>, <a href=\"PS-0227.html\">Лучница</a>, <a href=\"PS-0228.html\">Копейщики</a>, <a href=\"PS-0229.html\">Михаил \"Медведь\" Саакашвили</a>, <a href=\"PS-0230.html\">Человек, на которого упало солнце</a>, <a href=\"PS-0231.html\">Упыри</a>, <a href=\"PS-0232.html\">Упырь-рассказчик</a>, <a href=\"PS-0233.html\">Ангел</a>, <a href=\"PS-0261.html\">Иван Васильевич</a>, <a href=\"PS-0265.html\">Тварь из пещеры</a>, <a href=\"PS-0269.html\">Гурман</a>, <a href=\"PS-0270.html\">Фантазёры</a>, <a href=\"PS-0271.html\">Александр Титовский</a>, <a href=\"PS-0272.html\">Шрамы-слёзы на лице Александра</a>, <a href=\"PS-0273.html\">Сестра Александра</a>, <a href=\"PS-0274.html\">Начальник с завода</a>, <a href=\"PS-0275.html\">Клоуны и левитирующий человек</a>, <a href=\"PS-0276.html\">Шут с огоньками надежды</a>, <a href=\"PS-0277.html\">Агент АЗИП</a>, <a href=\"PS-0278.html\">Правители</a>, <a href=\"PS-0279.html\">Правитель рая</a>, <a href=\"PS-0280.html\">Протобионты</a>, <a href=\"PS-0281.html\">Арбетары и Альфа</a>, <a href=\"PS-0282.html\">начальник (из «Вины»)</a>, <a href=\"PS-0283.html\">Концепция (девушка)</a>, <a href=\"PS-0284.html\">Персонажи романа Елизаветы Пальпация</a>, <a href=\"PS-0285.html\">безэмоциональный персонаж с рисунков Миколая</a>, <a href=\"PS-0286.html\">Свят</a>, <a href=\"PS-0287.html\">Рыжеволосый мальчишка</a>, <a href=\"PS-0288.html\">самый жестокий апостол</a>, <a href=\"PS-0289.html\">Подручные сестры</a>, <a href=\"PS-0291.html\">Герой-рассказчик (Бетонный герой)</a>, <a href=\"PS-0292.html\">Лёха и Андрей</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["VS-0002--primechaniya-i-popravki"], "h": "<p><em>Внесено вручную. При пересборке сохраняется; если противоречит переписке — показаны оба варианта.</em></p>\n<ul>\n<li><strong>Килька не является синонимом названия вселенной.</strong> Уточнение Миколая: сведения\n  «Килька = Апостол» соавторы не делали. Килька — мир внутри одной из версий вселенной про апостолов.\n  В статье ниже, в авто-слое, могли остаться места, где Килька названа именем вселенной, —\n  это ошибка первой сборки, а не слова авторов. Про «Благословенную» вопрос остаётся открытым,\n  её сведение автор пока не отменял.</li>\n</ul>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["VS-0002-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/VS-0002/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первыми чинить реестры. Пять служебных записей несут больше ссылок, чем что-либо ещё во вселенной, и ни у одной нет статьи:</p>\n<ul>\n<li><code>SL-0051</code> — каталог благословенных, врагов, грехов, оружия и артефактов: 6 ссылок, 9 834 знака в базе;</li>\n<li><code>SL-0053</code> — список персонажей по разделам: 6 ссылок, 20 313 знаков;</li>\n<li><code>SL-0090</code> — реестр персонажей и сил: 4 ссылки, 5 492 знака;</li>\n<li><code>SL-0089</code> — перечень категорий сил: 4 ссылки, 1 753 знака;</li>\n<li><code>SL-0054</code> — «Список 12 апостолов»: 3 ссылки, 234 052 знака. Это самая большая запись базы без статьи вообще.</li>\n</ul>\n<p>Раздел «Сводные реестры состава» — единственное место, где видно, кто во вселенной есть, и он целиком стоит на записях, у которых своей статьи нет. Пока их нет, расхождение «21 апостол по лору / 14 позиций в реестре / 12 позиций к 2026 году» нечем проверить: неизвестно, это три разных списка или один, пересчитанный трижды. Всё остальное — ад после марта, ритуал, число миров — дешевле и подождёт.</p>\n<h3>С чего начать</h3>\n<p>В базе. <code>SL-0053</code> и <code>SL-0051</code> — это четыре редакции каталога 24 января и реестра с 27 января по 14 мая, они уже пересказаны в статье, но пересказаны выборочно; сверять построчно. <code>SL-0089</code> держит оба перечня категорий сил — шесть строк 2025-05-10 и три строки 2025-08-30. <code>SL-0054</code> в 234 тысячи знаков читать целиком бессмысленно: судя по вселенным при нём (там сразу четыре, включая «7 островов» и «Феню»), это склейка разных окон, её надо резать, а не читать.</p>\n<p>В архив — за двумя вещами, обе с ориентирами. Первая: сообщение 278841 от 2025-01-06 («А и вселенная поменялась ты же не против?») в дословных выписках отсутствует — идти в окно w0070 и в то, что стоит прямо перед ним, там должна быть предыдущая вселенная. Вторая: акт наименования. Между 2025-05-09 (324458, «Я возвращаюсь к благословенным») и 2025-09-12 (364758, «вселенную Апостол») слово появилось, и в промежуток попадают окна w0094–w0104.</p>\n<h3>Как развивалось</h3>\n<p>2025-01-06 — заявили сменой вселенной. Январь–март ограничивали: убрали посмертие (2025-01-22), убрали семь грехов (2025-03-06), предложили убрать благословенных дьяволом и не решили. 2025-03-20 — 2025-03-25 похоронили: «Пора прощаться», «для меня она исчерпала себя». В тот же день 25 марта вернули частично — «первая что я сделал в голове это перенёс апостолов». 2025-05-09 вернулись объявлением. 2025-06-10 придумали новую вселенную и тут же оставили эту главной. 2025-09-12 отправили отдыхать, оговорив, что не в долгий ящик. 2026-02-06 — упоминание по поводу чужого документа.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>В контракте агента АЗИП для чужемирцев развилка проговорена подробно: встретить, сказать заранее заготовленную фразу, зарегистрировать, применить силу только при агрессии, и отдельно — «не всё чужемирцы опасны и хотят кому-то навредить». Для арбетаров и фантазёров, названных в том же пункте, развилки нет: они сразу в графе «устранить либо захватить». При том что арбетар в этой же вселенной может служить в АЗИП — Кура был начальником филиала. Правило «сначала регистрация» названо для одного рода лиц; для соседнего рода, где известен служащий случай, — нет.</p>\n<h3>Отклик</h3>\n<p>Самое сильное здесь не устройство мира, а то, как вселенная умирает и не умирает. Монолог 25 марта написан всерьёз — «Была самой целестной», «Но для меня она исчерпала себя», — и адресат в этот момент сидит в очереди на флюорографию и отвечает «ей пиздец». А через несколько часов: «Сука первая что я сделал в голове это перенёс апостолов». Похороны, на которых покойник встаёт до конца дня, — и оба соавтора это спокойно принимают. Второе, что зацепило: контракт агента. Двести тысяч на подготовке, страховка, сеанс с психологом при психотравме и отдельный пункт про то, что делать с выплатой, если у погибшего никого нет — «отправленная на благотворительность с вашего имени». Кто-то додумал бухгалтерию смерти в мире, где главная проблема — как убить существо, способное разнести солнечную систему. И ответ на претензию «получается рубли и язык русский.... мде» — «Вот здесь да придумать надо чтото» — честнее, чем любая заплатка.</p></div>", "r": []}];</script>
