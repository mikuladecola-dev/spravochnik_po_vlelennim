<script>const BASE="";const DOCNAME="Апостол";
const LEAD="";
const CH=[{"t": "Зарождение", "a": ["S01", "VS-0002-S01", "VS-0002--zarozhdenie"], "h": "<p>Вселенная объявлена <strong>2025-01-06 (id 278841)</strong> репликой Славы: «А и вселенная поменялась ты же не против?». Дословного текста этого сообщения в карточке вселенной нет — фраза приведена только как основание границы отрезка. Из формулировки следует, что до 2025-01-06 у соавторов была другая вселенная и в этот день она сменилась; <strong>какая именно вселенная была до неё, в переписке не сказано</strong>, и из чего «Апостол» выросла — тоже.</p>\n<p>Название «Апостол» на момент объявления не звучало. Оно закреплено задним числом: единственный раз в дословных выписках оно произнесено <strong>2025-09-12 (364758)</strong> — «вселенную Апостол»; в 335360 то же слово стоит со строчной: «главная вселенная всё равно апостол». Самого акта наименования — кто, когда и почему так назвал — в переписке нет.</p>\n<p>Ведёт вселенную Слава: он её объявляет, меняет, хоронит и возвращает. Миколай реагирует, задаёт вопросы, спорит и правит. Сам Миколай формулирует это при закрытии, 2025-03-25 (310890–310891): <strong>«ты развивал её по большей части»</strong>, <strong>«но она была в принципе сильная»</strong>.</p>\n<h3>Что старше объявления</h3>\n<p>Содержание, приписанное вселенной, старше объявленного отрезка. Самая ранняя позиция описи — способность «Артефакты» (<a href=\"SP-0047.html\">Артефакты</a>) от <strong>2024-01-30</strong>; дальше 2024-04-03 (персонажи Дима, Максим), 2024-05-07 (история «Бессмертный», идея «Провидец», способность «Усиление Имитатора»), 2024-07-04 (история «Защитник», способность «Имитация»), 2024-07-09 (персонаж Антон), осень-зима 2024 (Камень желаний, Озеро перерождения, Чёрный ящик, Палач, Гнев, Алчность). Отсюда и верхняя граница дат в шапке карточки — 2024-01-30. <strong>Как эти вещи попали во вселенную «Апостол» до её объявления, в переписке не сказано.</strong></p>\n<p>Отдельно прослеживается Озеро перерождения. Заявлено 2024-11-09 (255042) ещё до «Апостола»: «Да и в плюсом в этой вселенной существует озеро перерождения ( который превращает монстра )». Развёрнуто 2024-12-08 (268675). В сеттинг «Апостола» перенесено 2025-01-06 (279047): «А насчёт озера перерождения. Запихаем сюда. Как минимирок который теперь в нашем мире»; на уточнение Миколая «но его нет в нашем мире? это че то оригинальное, не копия?» — «Да» (279048–279050).</p>\n<h3>Первый вечер</h3>\n<p>2025-01-06 (w0070, 278852) изложена первая раскладка мира: наш мир, называемый «Вселенной», самый большой; на втором месте по размеру «рай» и «ад»; «Ну и также существует множество минимиров». Тогда же заданы правители, благословения, смерть, утаскивающая души, и мистические монстры как существа из минимиров. Подробности — в разделах «Масштаб» и «Система способностей».</p>\n<h3>Как достраивалось имя и терминология</h3>\n<p><strong>2025-01-28 (285342)</strong> введён термин «апостолы»: «Давай благословенный Богом это апостооы, чтобы различать благословенных Богом и других». Миколай: «хорошая идея».</p>\n<p><strong>2025-03-06 (w0079, 298847–298857)</strong> из списка убраны Семь грехов. Слава выкладывает свой реестр («12 злодеев пока», «Ну в списке моём»), Миколай замечает: «ну рай или ад оставим на последок»; Слава: «Так в конце объединятся только мелкие и некоторый средний миры, а рай и ад останутся наверняка». Затем — <strong>«Грехи нужно убрать, а то тупо»</strong> (298854) и от Миколая <strong>«ну просто в сюжет не совсем входят»</strong> (298856). Обоснование у обоих одно. Закрывается обмен формулировкой про Кильку: «В нашем мире / Не кто из кильке не может, не покинуть его пока не умрёт» (298857).</p>\n<p><strong>2025-03-06 (298864–298886)</strong> разведены два значения слова «аномалия». Слава: «Есть только аномалий, но они в кильке» (298864). Определение: <strong>«Аномалий это мир, который образовался внутри Кильке и конечно правитель кильке не позволяет ему расти»</strong>, «То бишь озера перерождения» (298868–298869). Миколай помнит слово в другом значении — «что типа страные благословенные» (298873). Слава: <strong>«Ну я говорил, только давай теперь таких называть Гениями то бишь, апостол со самой странной способностью, у каждого поколения такой был»</strong> (298875). Миколай: «хорошо». На вопрос, как он их называл до этого, — <strong>«Аномалия»</strong> (298878). Пример Гения: <strong>«Бессмертный»</strong> (298883).</p>\n<p><strong>2025-03-10 (300559–300560)</strong> Слава объявляет, что изменения будут рассказаны: «Тебя нужно покормить информаций, о некоторых изменений вселенной», «Ну это когда ты уже прочтёшь историю».</p>\n<p><strong>2025-03-10 (300882–300921)</strong> изменения выданы. Миколай: «и про вселенную ты хотел дополнить». Слава: «Да» — и называет новое слово: <strong>«Арбетар»</strong> (300884). В этом же куске даны определения благословенных, чужемирцев, переопределены альфы и введены арбетары (см. «Население и классы» и «Система способностей»). Статус идеи назван самим автором (300918): <strong>«Идея ещё не до конца доработана так как я еë только сегодня придумал, ну давай доебись я хочу понять где я не прав»</strong>. Миколай (300920–300921): «ты прав, по идее пока претензий нету», «мне всё нравится». Внутри того же куска — договорённость не о мире, а о языке: Миколай просит не писать «их ней» («такого в русском языке нету, мб ихней хочешь сказать, но говори пж их»), с оговоркой «да говорить можешь как удобно, но это правда сложно воспринимать».</p>\n<p><strong>2025-03-18 (w0082, 305116–305117)</strong> устройство вселенной впервые изложено целиком — внутри прозы, в рассказе от первого лица (блог Максима, <a href=\"PR-0060.html\">Блог Максима (\"Здравствуйте, дорогие слушатели\") — история про агента</a>). Здесь закреплено имя главного мира: <strong>«В начале всего было ничего. Потом появился первый мир „Килька“. И да это наш мир»</strong>. Отдельного объявления о смене вселенной в этом окне нет — карточка ставит границу по самому изложению и по реплике Миколая 305360, где он вслух подтверждает, что вселенная общая: <strong>«я когда мы с той девочкой гуляли, немного о нашем мире рассказал, мы блять качались и на качелях и я такой: у нас есть несколько миров, главный называется Килька, есть и другие»</strong>. Реакция Славы на выбор имени (305363–305366): «Я бы заржал», «Из всех имён Килька?», «Спросил бы я».</p>\n<p>Тут же автор перечисляет то, что специально оставил нераскрытым (305117): <strong>«Всё что я не сказал это альфа, апостолы, благословенный, силы зверя, классификация, арбетары, аномалия, существа и так далее»</strong>.</p>\n<h3>Названия, которые звучали</h3>\n<p><strong>Апостол</strong> — имя вселенной; в дословных выписках произнесено один раз, 2025-09-12 (364758).</p>\n<p><strong>Вселенная апостолов / вселенная (апостолов)</strong> — как её называют в момент прощания и позже: «Это вселенная (апостолов ) была хорошая» (310844), «я уве понял что апостолов вселенная» (310867), «сама вселенная апостолов достаточно сложная и запутанная» (364758).</p>\n<p><strong>Благословенные</strong> — слово, которым Слава называет вселенную при возвращении: <strong>«Я возвращаюсь к благословенным»</strong> (324458). Названия «Благословенная» в переписке не звучит; «Благословенный» — это раздел реестра и класс носителей силы.</p>\n<p><strong>Апостол</strong> как термин внутри мира — не только имя вселенной, но и обозначение носителя силы: «апостол со самой странной способностью» (298875), «новым апостооом по прозвищу „защитник“» (305116), «он же и правда новый апостол» (305338). Эти два употребления в переписке не разграничиваются.</p>\n<p><strong>Килька / Кильке / кильке</strong> — имя главного мира, он же первый, он же наш. Написание у Славы плавает, все три варианта встречаются в одних и тех же сообщениях; соавторы разницу не обсуждают. <strong>Нигде в переписке не сказано, что «Килька» — имя вселенной; это имя мира внутри неё.</strong></p>", "r": [["Артефакты", "SP-0047.html"], ["Блог Максима (\"Здравствуйте, дорогие слушатели\") — история про агента", "PR-0060.html"]]}, {"t": "Масштаб", "a": ["S02", "VS-0002-S02", "VS-0002--masshtab"], "h": "<h3>Сколько миров</h3>\n<p>Точного числа миров в переписке нет ни в одной версии.</p>\n<p>Первая раскладка, 2025-01-06 (278852): «Вот есть наш мир будем называть \"Вселенной\" и этот мир самый большой. И как ты понял есть ещё миры помимо нашего. На втором месте по размеру это \"рай\" и \"ад\". Ну и также существует множество минимиров».</p>\n<p>Миколай задаёт прямой вопрос (278895): «3 мира и много минимиров или будут потенциально ещё миры но мы молчим?» Ответ Славы (278896–278897): «Ну это надо подумать», «Ну пока 3 мира».</p>\n<p>Позднее счёта нет вовсе. 2025-03-18 (305116): «Потом появился первый мир „Килька“. И да это наш мир. А потом начали появляться другие миры. И в каждом этом мире был свой бог. Его называют Правителем. И вот эти миры появляются и по сей день. И между всеми мирами есть некая связь. Но у всех это связь более крепкая с „Килькой“ С первом миром». Верхней границы нет — миры продолжают появляться.</p>\n<p>Отдельно фиксируются погибшие миры (2025-03-19, 305854): «И это уже в трёх мирах произошло. Ну точнее в трёх мирах в которых мы смогли это за фиксировать. Три мира были разрушены».</p>\n<p>Сам Слава 2025-09-12 (364760) называет множество миров самым тяжёлым местом собственной конструкции: <strong>«Самая сложная и пугающие для меня там стало это множество миров. Всё же множество миров для меня звучит слишком за мудрено сейчас»</strong>.</p>\n<h3>Размер и край</h3>\n<p>Наш мир объявлен первым, самым большим и бесконечным. На вопрос «большой это как» (278857) — «Это бесконечный» (278862), и тут же шкала остальных: «Ну есть мир который по размеру как дом, а есть мир который как город и т.д.» (278863). В нашем мире есть планеты, «Вселенная бесконечная» (279024–279031), действие историй идёт на земле.</p>\n<p>Позже размеры делятся на градации — маленький, средний, большой (2025-05-31, 331635; повтор 2025-10-18, 375849). Масштаб уточнён через силу протобионтов (331655): «Я подразумевал существ среднего и малого мира. А вот из нашего то он вполне солнечную систему разрушит» — в ответ на прикидку Миколая (331649), что если килька это вселенная, там миллион галактик, у галактики миллион солнечных систем и так далее.</p>\n<p>У мира есть конец, и он работает буквально. Миколай (278869): «а типа я на краю города могу стоять? он шарик или листок? я упаду на краю?» Ответ (278873): <strong>«Ты можешь увидеть конец мира. Если ты упадешь то просто попадешь в другой мир. Он просто кусок нашего мира»</strong>.</p>\n<h3>Связь между мирами</h3>\n<p>Все миры связаны, и связь с первым миром сильнее всех. 2025-01-06 (278878): «Связь все миры связаны с нашем миров поэтому случается так что они могут попасть в наш через край своего мира». На вопрос, почему связь именно с нашим и бывает ли у минимира три связи с разными мирами (278906), ответ (278908): <strong>«Самая крепкая связь с нашем миров так как он первый и по суть на основе него строились и другие миры. Между всеми мирами есть связь но самый сильной только с нашем»</strong>.</p>\n<p>В поздней версии (2025-05-31, 331635; повтор 2025-10-18, 375849) связь названа неразрываемой: <strong>«между всеми мирами есть связь, которую не может оборвать не один правитель»</strong>. И объяснено, почему беглецы попадают именно в кильку: «чаще всего килькв. Так как существа, что покидають свой мир. Неосознанно перемещаться по связи, а связь с килькой у каждого другого мира сильная».</p>\n<p>Внутримировая техническая версия той же связи — в мире рассказчика-упыря (2025-03-19, 305854): технологически развитая цивилизация «смогли установить связь с другими мирами. Вот только полноценный связи не было. Мы могли получать обрывки информации, от разных миров. С помощью связи нашего мира с другими. Но опять же она не было постоянной и стабильной. Да и мы ещё не до конца поняли принцип связи».</p>\n<h3>Копирование</h3>\n<p>Миры копируют наш. 2025-01-06 (278852): «чаще всего минимиры пытаются копировать нашей мир». Что именно копируют (278867): «Копировать например кладбище, именной какой-то место в нашем мире». Мотив (278894): «Правитель минимиров могут наблюдать за нашем, вот и изменять свой пытаясь копировать наш чтобы хоть чуть-чуть приблизится к могуществу \"существа\"»; и (278912) «Ну большинство правитель пытаются достигнуть нашего правителя из за этого пытаются везде его копировать».</p>\n<p>Население миров, 2025-02-25 (295221): «Там почти в каждом мире есть разумный существа, некоторый похожий на людей некоторый нет».</p>\n<h3>Килька</h3>\n<p>Килька — наш мир, он же первый, в ранних записях «Вселенная». Имя появляется 2025-03-06 (w0079) и закрепляется 2025-03-18 (305116).</p>\n<p>Главный закон Кильки: из неё нельзя выйти. 2025-03-06 (298857): «В нашем мире не кто из кильке не может, не покинуть его пока не умрёт». Миколай переспрашивает про благословенных и трещины (298858–298861), ответ (298862): «Я же говорил это факт не кто, кто уже попал в кильку не сможет еë покинуть, не как и никто». То же в изложении агента (305117): <strong>«И самым главным фактом для меня был, то что мы субъекты первого мира. Не модем его пикинуть. Ну вот никак. Ну вот чужемирцы попадають нам за раз плюнуть»</strong>. И в поздней сводке (331635; 375849): «Любое существо может покинуть свой мир если будет знать способ. Но всё существа кильке не способны покинуть свой мир. Не каким либо образом». Ранняя формулировка того же правила — 2025-01-06 (278878): «Мы же пока живы не можем попасть в другой мир».</p>\n<p>Второе свойство Кильки: только её жители могут получать благословение. 2025-03-19 (305856): «Благословения можеть получать только разумный житель кильке. Первого мира. Не знаю точно с чем это связано. Но это просто факт». Ранняя версия (278852): «эти правитель могут дать свой благословение, но они могут дать свой благословений только людям из нашего мира».</p>\n<p>Отдельно: 2025-03-30 (314479–314485) Миколай приписывает Кильке возраст в 80 миллиардов лет и поглощение существ из других миров; Слава поправляет: «Это не килька», «Это другая вселенная».</p>\n<p>Герой истории про расколотое солнце в конце попадает в Кильку (305396–305398): «В конце его истории он попал в кильку».</p>\n<h3>Рай</h3>\n<p>В первой версии (278852) рай и ад стоят наравне, «на втором месте по размеру». Правитель рая — бог. Оттуда никто не сбегает: «И вот из \"рай\" по понятным причинам не кто не хочет сбегать»; про ангелов отдельно (278954): «Ангела просто незачем сбегать». Почему бог раздаёт благословения (278943): «В раю много добрых людей и бог име проникся из за этого даёт благословение».</p>\n<p>2025-02-25 (295209–295221) установлено, что мир главного героя (средний мир, полная копия Земли) уничтожил рай. Уточнение (295217): «Точнее это были жители рая, сам правитель ничего не сделал». На вопрос Миколая «зачем?» (295214) ответа в окне нет.</p>\n<p>2025-03-19 (305854) рай получает место в порядке миров: он «Второго мира, который появился после Кильке». Там же — теория жителей технологического мира: «Что все нападения на миры. Были устроены из Рая... Хотя это опять же не точно. Лишь теория. Без стопроцентных фактов». Из рая приходят ангелы (описание: гуманоид из белых перьев, вытянутый, два метра ростом, две пары рук, две пары крыльев, один вертикальный закрытый глаз, нимб) и, предположительно, зараза перагов — «От чего вообще взялись упыри. Это заража из рая. Или это попытка правителя спасти людей. Не знаю» (305855). Мотив нападений остаётся неизвестен и внутри самого текста: имитатор не добивает ангела, потому что «Ему нужны ответы. Почему жители рая устраивают нападения на другий миры?» (305858) — ответа он не получает, защитник перегрызает ангелу горло.</p>\n<p>Правитель рая раздаёт благословения апостолам (305856): «Ты и я апостолы. Это люди получивший благословения от правителя рая. То бишь от второго мира появившейся после кильке. Нас апостолов 21 во всём мире».</p>\n<p>Финальная сводка (331635; 375849): <strong>«Первым правителем был правитель кильке. Вторым же был правитель рая. Поэтому их мир в разы больше миров других правителей»</strong>.</p>\n<p>2025-08-30 (359686–359688) обсуждается «война с раем» и разные существа из рая как отдельный пласт; на роль злодеев они не годятся — у них нет цели, кроме мести, они не работают группой, «их же в разный места раскидает».</p>\n<h3>Ад</h3>\n<p>Второй по размеру мир наравне с раем (278852). Правитель — дьявол, и он в этой системе добрый: «и вот сразу дьявол правитель \"ада\" добрый, типо он карает грешников». Из ада сбегают грешники — в наш мир; демоны не сбегают (278954): «А демоны бояться гнева дьявола который и так в бешенстве что сбегают грешники». Зачем дьявол раздаёт благословения (278943): «У дьявола часто сбегают в грешники в наш мир и их надо возвращать поэтому он даёт благословение». Механика возврата (279011, 279014): «Он даёт благословение людям, а эти люди изгоняют грешников из этого мира и отправляют в ад», «Да после смерти грешники опять отправляются в ад».</p>\n<p>В поздних версиях (с марта 2025) ад в перечне миров не фигурирует: первым идёт Килька, вторым — рай, дальше «другие миры». <strong>Переопределения ада в переписке нет.</strong></p>\n<h3>Минимиры</h3>\n<p>Введены 2025-01-06 (278852) вместе с раем и адом: «Ну и также существует множество минимиров». Характеристика: «И вот чаще всего эти минимиры темный жуткий жестокий все существо там опасный». Размер — от дома до города (278863). У каждого есть край, через который можно попасть к нам (278873, 278878).</p>\n<p>Их обитатели — известные мифические монстры: «и все те мистический монстры( драконы, упырь, оборотни, леший, и т.д) это существа из минимиров» (278852).</p>\n<p>Правители минимиров дают благословения редко (278941): «Во вторых правитель минимиров довольно редко дают свой благословение. Больше все благословенный даёт бог и дьявол». При этом сила не зависит от источника (2025-01-13, 281368): «Сразу всё благословенный равны по силе, путь то благословенный Богом, дьяволом, или другими правителем минимиров».</p>\n<p>Грехи — существа из минимиров (278982): «Грехи это существо из минимиров который будут по силе 3 благословенным». Сущности иногда покидают минимиры (2025-01-27, 284856): «И вот они иногда покидают минимиры и прилетають к нам».</p>\n<p>Как именно создаются минимиры — вопрос Миколая (278893) остался без ответа: «Ну это надо подумать».</p>\n<h3>Аномалии — миры внутри Кильки</h3>\n<p>2025-03-06 (298864–298869): «Аномалий это мир, который образовался внутри Кильке и конечно правитель кильке не позволяет ему расти», пример — «То бишь озера перерождения». Позже «пространственная аномалия» названа одним из четырёх способов покинуть свой мир (331635). В реестре Славы «Аномалий» — раздел из двух пунктов: «Камний желаний 🪨» и «Озеро перерождения ⚫️».</p>\n<h3>Озеро перерождения и камни желаний</h3>\n<p>Развёрнутое описание озера — 2024-12-08 (268675): «У этого озера нету точного место положения оно может быть везде. И ты наверное уже понял что оно делает. Человек с большим желанием, любым то бишь вернуть умершую дочь, желание отомстить, желание быть успешным любой настолько сильной желаний что только о нем и думаешь и пытаешься сделать все возможной чтобы оно исполнилось но не только с желанием но и с чувством... И вот когда будут и чувство и желание ты сможешь попасть в озеро перерождения и ты сам не поймёшь как вдруг оказался там. И вот нырнув в озеро перерождения то вынернет уже не ты, а что-то похожей на тебя монстр бог или дьявол». На вопрос «это навсегда?» (268684) — «Навсегда» (268686).</p>\n<p>В каталоге Славы озеро сначала стоит в разделе «Идей» (2025-01-24), 2025-01-27 (284858) переезжает в «Аномалий» и остаётся там на 2025-05-14 (325799).</p>\n<p>Камни желаний (2024-12-10, 269207): «Загадаешь сильная желания и камень сломается и превратиться в твой сосуд дав тебе способность накапливать энергий и по итогу получая структуру, Но ты умрёшь где-то через 10 лет, а умрёшь ты превратившись в камень желаний. Круговорот».</p>\n<h3>Как перемещаются между мирами</h3>\n<p><strong>Ранняя версия, 2025-01-06.</strong> Через край мира (278873); живой человек из нашего мира уйти не может (278878); души после смерти таскает Смерть: «Смерть таскает наши души в других миры» (278875).</p>\n<p><strong>Три способа, 2025-03-18 (305117).</strong> Дословно: «Как они сюда попадають? Есть три способа известный нам. Первый- достигнуть границы своего мира. Часто этот способ используют в маленьких мирах, который только недавно образовались. Опять же относительно \"кильке\". Второй- спомощью ритуал, как с нашей стороны, как и с их ней. Ну здесь я сказать ничего не могу. Мне об этом ритуале не рассказали по понятном причинам. Ну и третий самый редкий. Когда правитель сам тебя отправляет в другой мир». На вопрос Миколая «жертвенный?» (305402) — «Я не знаю», «Я просто это добавил», «Потом придумаю» (305403–305405).</p>\n<p><strong>Четыре способа, 2025-05-31 (331635), дословный повтор 2025-10-18 (375849):</strong>\n«Существа, что живут в мирах могут их покидать:\nС помощью ритуала???;\nМожно дойти до края мира, если ваш мир маленький или средний. И прыгнув за край мир вас перенесёт в другой мир. ( чаще всего килькв. Так как существа, что покидають свой мир. Неосознанно перемещаться по связи, а связь с килькой у каждого другого мира сильная);\nМожно попасть в пространственную аномалию;\nВас может выкинуть сам правитель ( очень очень очень, крайне редко).»\nЗнаки вопроса у ритуала стоят в самом авторском тексте — механика не придумана.</p>\n<p>Направление перемещения уточнено 2025-03-20 (306110–306114). Миколай: «а, то есть и в между мирами могут перемещаться? не обязательно в кильку типа» — Слава: «Да», «Я же говорил».</p>\n<h3>Чёрная дымка</h3>\n<p>Проход между мирами, показанный в художественном тексте (2025-03-19, 305855–305858). Со стороны уходящего: «Но меня начало тянуть обратно. А там за спиной моёй. Была чёрная дымка. Меня тянула к ней. И где-то глубоко в себе. Промелькнула мысль \"Это правитель пытается меня спасти. Отправив в другой мир\"». Рассказчик-упырь сопротивляется, но ангел влетает в него, и они проваливаются в дымку вместе. Со стороны принимающего мира: «Ведь в это же время. Появилась чёрная дымка. И из ней вылетили два существа». Появление предсказуемо по времени и числу: имитатор заранее знает время («Где-то в 21:00-21:30. Точно определить сложно») и «только в последние момент засек, что их будет двое».</p>\n<p>Что чёрная дымка — это и есть способ «правитель сам тебя отправляет», в переписке прямо не сказано; герой это только предполагает.</p>\n<h3>Правители</h3>\n<p>Общее определение (278852): «И вообще почти во всех мирах есть правитель( существо правящий этим миров)». Поздняя версия (305116): «И в каждом этом мире был свой бог. Его называют Правителем».</p>\n<p>Облик и власть. Миколай (278898): «что такое правители? типа блять у них облик вообще есть? или они фактическое деяние собой являют? они могут контролировать всё что в их пространстве происходит? или просто контролируют пространство?» Ответ (278903): <strong>«У них нет облика они могут принять любой, контролирует полностью свой мир изменяя пространства»</strong>; и (278880) «Он может изменять этот мир как хочешь ведь это его мир». На уточнение «размеры тоже?» (278882) прямого ответа нет — следующая реплика уже про Смерть.</p>\n<p>Границы вмешательства проведены явно: дождик — «Нет это экологией, круговорот» (278905), войны — «Нет, это наша работа» (278904).</p>\n<p>Происхождение (278909): «Просто появились в пустоте. По итогу создавая землю воду и т.д.» Поздняя редакция (331635): <strong>«Это не физические существа появившиеся в нигде и в ни чем. Они первыми, что появилось в пустоте. И именно они начали создавать мир. По своему желанию»</strong>.</p>\n<p>Чем заняты (278941): «Опять они вечно наблюдают за нашем миров можно сказать единственное развлечения в их ней бесконечное жизни».</p>\n<p>Пределы влияния (331636): «Правители не как не могут влиять на благословенного или обычного существа ( кроме как насильственно давать благословения, даже если само существо этого не хочет)... При этом правители всевидящий».</p>\n<p>Никто не стоит над всеми мирами. Миколай: «а есть кто-то кто контролирует все миры?» (278887) — Слава: «Нет», «Но самым сильном является \"существо\"» (278888–278889).</p>\n<h3>Правитель нашего мира — «существо»</h3>\n<p>2025-01-06 (278868): «Бог есть в рая он его правитель. Также есть существо в нашем мире который является правителем нашего мира ( но сейчас он не нейтрален, в сюжете пока его не будет)». Он создал Смерть (278883): «Существо являющий правителем нашего мира создала смерть которая таскает души в разный миры». Наш мир он не создавал: на вопрос «а наш кто создал?» (278884) ответ «Нет», затем «Существо» (278885–278886).</p>\n<p>Позже слово «существо» переопределяется. 2025-03-10 (300760): «Существо это ребёнок правителя, который имеет физическую оболочку»; в том же окне (300891) «Существа» идут вторым пунктом в списке видов чужемирцев. Переход между двумя значениями в переписке не объяснён. Ещё позже, 2025-05-31, на вопрос Миколая «че такое существо? нахуя и с чего» (331646–331648) ответ: «Живые люди животные и тп» и «Фиг знает» (331652–331653).</p>\n<h3>Правитель Кильки</h3>\n<p>2025-03-06 (298826) — первая версия сюжета: «Цель главного злодея объединить всё миры в один, конечно главным будет Килька, таким образом наш правитель хочет иметь контроль над другими мирами». Тут же отменено (298834): «И вообще мир будет объединять сестра имитатора, а не правитель». Функция, которая осталась (298868): «правитель кильке не позволяет ему расти» — про мир-аномалию внутри Кильки. 2025-10-18 (375849): первый из появившихся правителей; его мир — килька, с которым у всех прочих миров самая сильная связь.</p>\n<h3>Дети правителей: Протобионты и Сущности</h3>\n<p><strong>Протобионты</strong>, 2025-05-31 (331635; повтор 375849): «У правителей есть дети, которых зовут Протобионты. Это субъект, который был создан именно правителем, а не из-за особенности мира. Подобные субъекты имеют огромную силу, которая в теории позволит уничтожить континент. Но большинство существ спокойный и миролюбивый. При этом они очень не любят покидать мир своего родителя». На вопрос «а, у любого правителя есть пробионты» (331656) — «Ну да наверное» (331657).</p>\n<p><strong>Сущности</strong> — более ранний вариант той же идеи, 2025-01-27 (284852–284857): «Есть Альфы есть грехи есть правитель», «Будут ещё и сущность», «Сущность это дети правитель. У каждого правитель есть выродок». Далее: «И эти сущность как стихийная катастрофа, как цунами, ураган, вулкан». Механика: «И вот они иногда покидают минимиры и прилетають к нам и есть два исхода либо они начинают буйствовать и благословеный их толпой гасят. И второй когда они просто уходят в спячку. И один из этих существ живёт и спит в перимутский треугольник». Последствие убийства: «И вот как раз в первом случае когда они буйствует и мы их убиваем, то это сказывается на их родном мире из-за этого благословенных бояться и знають что они существуют». Статус (2025-01-28, 285529): «Ну бля их сложная представить ведь в сюжете пока их не будет так как они слишком мощный, мощней Серафима».</p>\n<p>Как соотносятся Сущности и Протобионты — в переписке не сказано.</p>\n<h3>Душа, смерть и пустота</h3>\n<p>Ранняя версия, 2025-01-06. Душа (278892): «Это мы, наш фантомный облик». Смерть (278852): «из за \"смерти\" она после нашей кончины не даёт остаться в нашем мире и вечно отправлять нам куда-то». После смерти человек попадает в рай, ад или, крайне редко, в минимирок.</p>\n<p>Отмена, 2025-01-22 (283827): <strong>«Раньше после смерти ты попадал в рай или ад или в другой мир, сейчас приставив у себя в голове весь сюжет, я понял что это хуйня так как она грубо говоря обесценивает смерть. Поэтому после смерти наши души улетает в пустоту. Пустота между мирами, пустота это ничто и попадая в ней душа становится тоже ничем за ничем невозможно наблюдать ведь это ничто»</strong>. И (283828): «И не только наши души но и в всех существ попадает в пустоту».</p>\n<p>Что после этой отмены остаётся от Смерти как персонажа и от логики «правитель ада возвращает грешников через смерть» — в переписке не сказано.</p>\n<h3>Как уничтожают миры: раскол солнца</h3>\n<p>2025-03-19 (305854). Схема: солнце трескается как стекло и разлетается на миллиарды светящихся кусочков, следом идёт эпидемия. «У них разбивалось солнце. И начиналось эпидемия неизвестно болезнью в их нём мире. И это уже в трёх мирах произошло».</p>\n<p>Цифры по миру рассказчика: осколки охватили «78% всей суши земли. И 12% воды на планете»; расстояние от солнца до земли 149 597 870 700 метров пройдено за 3 минуты 36 секунд, то есть при постоянной скорости 694 444,44 км/с; выжило 17% людей. Дальше — заражение и пераги: «Это люди, который обрастают белыми перьями. Словно они состоят из чистого серебра... Коэффициент этих зараженных. 23 заражённых на одного человека». И упыри: «Это где-то 30-40 процентов выживших стали упырями».</p>\n<p>Тот же сеттинг раньше, без объяснений — «Мир без солнца» (2025-02-24, 293226–293229): солнце на глазах разваливается на миллиарды осколков, дальше вечная тьма, светят только луна и звёзды, людей нигде нет, по руинам бродят пераги; в конце герой доходит до места, где луна светлее и звёзды другие.</p>\n<h3>Прочие названные миры и локации</h3>\n<p><strong>Средний мир</strong> (2025-02-25, 295209): «Это средний мир, который полностью скопировал землю». Место действия истории про сломанное солнце; уничтожен жителями рая.</p>\n<p><strong>Деревня Лихая</strong> (2025-03-03, 297460–297462; 2025-03-10, 300761–300829): единственная деревня на 40 км вокруг, найдена мёртвой, «тихую Лихую, как кладбище, нет, это и было кладбище», с братской могилой, из которой тянется кровавый след. Время действия — Вторая мировая, в деревню заехали немцы и всех перебили.</p>\n<p><strong>Деревня Лихой</strong> (2025-03-13, 301805–301846): глухая деревня, которую старик еле нашёл; в её центре проводится обряд становления Арбетаром. Отдельно названа деревня Ливия ближе к Санкт-Петербургу — родная деревня старика, уничтоженная Арбетаром: «В деревню решил заглянуть Арбетар(швецский; на русском трудяга). И начал Арбетар там всё крушить и поглащать жизнь человеческий и начал он из них делать чудищь словно из картины шизофриника».</p>\n<p><strong>Бетонный мир</strong> (2025-09-08, 362528–362531): бесконечный город из голого бетона, здания без окон и дверей, лестницы без перил, вместо неба сплошной бетонный потолок, с которого сыплется пыль; всюду лампы с тусклым жёлтым светом, абсолютная тишина, застоявшийся сухой воздух без ветра. Описан как жалкая имитация родного мира героя.</p>\n<p><strong>Мир Бетонного героя</strong> (2025-08-08, 354014–354016): люди давно покинули Землю по скрытой причине, живут на бетоне среди заводов, кислород даёт техника, неба нет. Правят выродившиеся «герои» с лозунгом про работу для всех, есть «старшики», помнящие Землю по рассказам.</p>\n<p><strong>Перимутский треугольник</strong> (2025-01-27, 284855–284857) — место, где спит одна из сущностей, ушедших в спячку. Одна строка, дальше не разворачивается.</p>\n<p><strong>Механизм объединения миров</strong> (2025-03-06, 298843, идея Миколая): «какое-то крупное сооружение размером с гору, какой-то механизм, который можно объединить собрав артефакты разных миров и запитав огнём благословенного фенриром, ибо он самый мощный и есть ещё какая-то особенность».</p>\n<h3>Знание о мирах внутри вселенной</h3>\n<p>2025-01-06 (278915–278922). Общество нашего мира не знает: «Общество не знает». Мифы знает и не верит: «Знает о мифов но не верят». Драконов общество не видело (278965). Благословенные «имеют большую власть у верхушки и может многой».</p>\n<p>Существа других миров о чужих мирах знают (278917–278919): «Да знают», «Знают что есть, но покинуть свой мир не могут», «Лишь наблюдать» — это ранняя версия, позже способы покинуть мир перечислены явно.</p>", "r": []}, {"t": "Организации и сообщества", "a": ["S03", "VS-0002-S03", "VS-0002--organizacii-i-soobschestva"], "h": "<h3>Почему организации вообще существуют</h3>\n<p>Самая ранняя формулировка — 2025-01-06 (279021–279033). У каждого благословенного своя территория: «Благословенный и дьявола и бога / У каждого из них своя территория где они должны убивать грешником либо чудемирцов» (279023). Отсюда прямо выводится необходимость организаций: <strong>«Чаще всего эти благословенный создают какую-то организацию, так как в одиночку это просто не возможно»</strong> (279029). Состав: «В этой организаций могут быть как и простые люди как и благословенный (от минимиров), а также аномальный люди или даже чужемирцый» (279029).</p>\n<p>Внутри группы благословенных есть связь (279037): «Между благословенный бога есть связь и они в любой момент могут связаться с другими благословенными бога / У благословенными дьявола также / Но при этом благословенный дьявола и бога не могут с друг другом связываться». Миколай называет это телепатией, Слава: «Ну типа того». Отношения: «Они чувствуют себя как братья и сестры» (279042), «Хотя и редко видятся в живую» (279043). То же 2025-01-22 (283706): «Братья и сестры это то бишь благословенный одним правителем».</p>\n<h3>АЗИП</h3>\n<p>Основная организация вселенной. Развёрнута 2025-05-28 — 2025-05-31 (w0099) и ещё раз затронута 2025-08-30 (w0103). До 28 мая организация в переписке существует, но без имени: в прозе 13 и 18 марта она называется просто «наша организация», «организация» (301809, 305116); словосочетание «организация апостолов» произносит Миколай (301925).</p>\n<p>Расшифровка дана 2025-05-28: на вопрос «азип / это аббревиатура? / что означает» (330952–330954) — <strong>«Апостол закон и права»</strong> (330991).</p>\n<p><strong>Чем занимается.</strong> Определение агента (330909): <strong>«Агент — это люди или чужемирцы, которых завербовали в организацию АЗИП. И их главная цель уничтожения опасных существ. Буть то люди или чужемирцы»</strong>. Из текста контракта (331072) обязанности шире: встречать чужемирцев, покинувших свой мир, и либо зарегистрировать, либо устранить при агрессии; уничтожать «лиц, который имеют особенность и нарушающий закон» — особенность может быть благословением или артефактом, отдельно названы «Арбетары и фантазёры» как «лица, который получают силу непосредственно самого себя»; «По мере возможности вам нужно будет их устранить. Либо захватить и превести в штаб, которому вы привязаны».</p>\n<p>2025-08-30 (359681): «Ты же знаешь кто такие апостол. Сильнейший среди благословенных. Людей, что лишь своё силой и авторитетом поддерживают мир и у них есть <strong>нерушимая организация Азип, которой уже более сотней лет</strong>». Тут же сюжетная задача: «И как придумать злодея, чтобы люди осушители страх. О том что апостол не справится и Азип не вывозит» (359683).</p>\n<p><strong>Публичное прикрытие и масштаб.</strong> 2025-05-28 (330967–330968): «Да. Для всего мира организация АЗИП это невероятной большой количество бизнесов. По типу торговлю одежды, машины, еды и оказания каких либо услуг», «Везде. В каждом городе. Хотя бы один его из магазинов будет».</p>\n<p>2025-05-30 Миколай разбирает это на достоверность (331230–331241): организация «не привязана к законодательству конкретного государства», «это как минимум транснациональная компания ТНК», «но при этом масштаб мне не ясен», «как будто бы она маленькая»; спрашивает про число сотрудников и филиалов, их расположение, основателя, «зачем и на кого она работает», «каким образом не государственная компания имеет право выдавать подобные права», и предлагает вариант — «возможно был когда-то совет 300+ государств о создании и поддержании такой организации?».</p>\n<p>Ответы Славы (331443–331457): «Ну типо контракт России»; «Ну у неё <strong>21 главных филиалов</strong>. У каждого филиала ещё есть свои филиалы. На их ней территории. А также на всех их ней территорий разный компаний»; «Сотрудники делятся на агентов и простых сотрудников, который работают в компаниях. Например создание машин и типо того»; о числе сотрудников — «Сколько всего сотрудников я не знаю», «Могу вкинуть рандомной число», «700 000 000», «Если всего людей в мире 8 225 048 831», «То это число принципе ок», «Но это сотрудники только люди»; филиалы «Во всём мире», отдельной строкой — «На Северном полюсе два апостола сидят». Про основателей и заказчиков: «На апостолов. Для защиты порядка» (331456), «Типо апостолы с давних времён защищали мир. И во всё времена государство о них знала» (331455). Сам Слава оговаривает: «Ну об этом стоит подумать» (331457).</p>\n<p>Число 21 у филиалов совпадает с числом апостолов; <strong>в переписке это совпадение нигде не оговорено</strong>.</p>\n<p><strong>Права.</strong> Из контракта (331072): «Организация АЗИП не является государственной. Но в каком либо месте у нас равный или даже превосходящий права. А вы как сотрудник организации тоже получается превосходящий права, чем гражданский». Три названных права: юридическая защита; «доступ во всё возможные места. Будь то даже частная собственность или территория»; «права на убийство. И права нарушать некоторые законы. При условии, что это закон нарушен был при выполнения миссии или содержания агрессивной аномалии».</p>\n<p><strong>Контракт агента, пункты 1–6</strong> (331072, 2025-05-29). Первый набросок прав и обязанностей дал Миколай днём раньше (330929): «имеют право уничтожать всех кто входит в категорию опасных существ / обязаны писать отчёт по каждому акту уничтожения». Его же варианты, не вошедшие в текст (330957–330961): доска, где главы организации размещают существ; обязанность иметь устройство связи и отвечать на каждый звонок; право получить защиту от существ.</p>\n<ul>\n<li><strong>1.</strong> Кандидат, человек или чужемирец, проходит 6-месячную подготовку и тест. Провалил — ещё 3 месяца и повторный экзамен. Провалил второй раз — «вы обязаны покинуть АЗИП и не применять полученный знаний и умения», наказание по Приложению 1. Сдал — основное снаряжение, ограниченный доступ к информации АЗИП и право выполнять миссии.</li>\n<li><strong>2.</strong> Нельзя вредить гражданским и применять против них грубую силу — «(Агент не забывайте, что вы физически куда сильнее обычного гражданского)». Обязателен отчёт: «какое существо и при каких обстоятельствах вы его уничтожили». Отдельно оговорено: «И не забывайте. Не всё чужемирцы опасны и хотят кому-то навредить». Дана дословная фраза при встрече чужемирца у пространственной аномалии: <strong>«Здравствуйте я представитель организаций АЗИП и мы не хотим вам навредить. Я знаю, что вы не понимаете, что происходит. Но попрошу последовать за мной, что бы вас зарегистрировали»</strong>. При агрессии — успокоить; при угрозе жизни можно применить грубую силу.</li>\n<li><strong>3.</strong> Снаряжение зафиксировано за агентом, но остаётся собственностью АЗИП.</li>\n<li><strong>4.</strong> Во время подготовки — 200 000 рублей ежемесячно; при повторной подготовке выплата не начисляется. Агенту — еженедельная выплата в зависимости от выполненных миссий, «(постарайтесь не вредить себе из за выбора сложной миссии)». Минимальная выплата 70 000, максимальная зависит от достижений; есть надбавка, «если вам выдали не верную информацию».</li>\n<li><strong>5.</strong> Жизнь застрахована, покрываются все медицинские расходы. При психологической травме — отпуск и сеанс с психологом организации. При гибели на миссии выплата идёт семье или лицу из завещания (пишется при вступлении); если такого лица нет — «то это выплата будет отправленная на благотворительность с вашего имени».</li>\n<li><strong>6.</strong> Обрывается на номере — текста нет.</li>\n</ul>\n<p>Выход из организации (330938–330940). Миколай: «они могу выйти из неё выйти? или это пожизненно?» Слава: «Желательно да. Но если вы всё же решите покинуть организацию АЗИП. То вы обязаны подписать документы. О том, что не будете применять знания и умения, который получили в организации. А также не раскрывать информацию о том, что не следует знать гражданским. При случае нарушения контракта вы будете наказаны».</p>\n<p><strong>Претензии Миколая к контракту</strong> (2025-05-30, 331242–331247): про повторную попытку — «тоже как агент? / тогда уже переподготовку»; на пункт об исключении — «смешно, лучше просто убейте»; про язык — «а на каком языке это сказано? как чел из абсолютно другого мира поймёт речь одного из 300+ языков»; про имущество — «даже то что я поел у вас в столовой?»; итог — «получается рубли и язык русский.... мде». Ответы Славы (331459–331461): «Аха. Так просто убить. Чтобы потом другие агенты могли бы начать восстание. Тем более это именно мы их завербовали и <strong>несем за них ответственность</strong>»; про язык — «Вот здесь да придумать надо чтото»; про еду — «Еда разве является имуществом».</p>\n<p><strong>Вербовка и обучение до появления имени АЗИП.</strong> 2025-03-18 (305116–305117), изнутри прозы: вербовщик-имитатор предлагает выбор из двух путей — «Первый я подхожу тебя к остановки и ты едешь домой. Забыв обо всём этом и живя обычной жизнью. Второй — ты становишься агентом и сразаешься с подобными тварями, как сегодняшний. Выбор за тобой. Я не буду говорить плюс и минус». Монолог назван «явно выученным». Звонит потом не он, а <strong>Михаил Саакашвили</strong>: заедут через три дня, тогда нужен точный ответ; при согласии — лагерь, «где я должен буду прожить 6 месяцов под тренировкам и впитыванием информации». Максим отучился три недели вместо шести месяцев, «так как я был в идеальном физической форме и мне оставалось только дать информацию и ресурсы». Куратор — «Михаил с кодовым прозвищем \"Медведь\"», около двух метров, в плечах почти столько же, кожаный плащ, «суров, но справедливым». Группа — 10 человек: «И кстати я был там не один нас было 10. Как я понял потом. <strong>Каждый агент может быть куратором только для 10 людей</strong>». Запись Максима заканчивается: «Через 7 минут эта запись была удалена Михаилом. А его отправитель был наказан». Фамилию куратора автор брал через нейросеть: «Мне т2 помогает фамилии придумывать» (305344).</p>\n<p>Обсуждение в чате в тот же день (305333–305354): Миколай — «я про то что у этих апостолов такая система получается», «интересно че они с этими агентами делают», «и сколько уже таких агентов», «ваще удобная система». Слава: «Дохера», «Отправляют сражаться».</p>\n<p>Второй случай вербовки — 2025-03-13 (301809): апостол <strong>Дмитрий Рутковский, кодовое прозвище «агрегат»</strong>, предлагает Антону Смирнову два пути: «Первый ты восстанавливаясь и живёшь обычный жизнью. Но за тобой будет слежка, так как ты тоже получил кусок силы нашего мира. При этом выжив. За тобой будет слежка, чтобы ты никому не навредили. А второй путь стать агентом нашей организаций. И защищать сон мирных людей. Но при этом рискуя своей жизнью». Три дня на ответ; Антон отвечает сразу, ответ не принимают: «Я не приму этот ответ. Я приду сюда через три дня и тогда ты дашь мне ответ». Различие двух сцен (у Антона первый путь — жизнь под слежкой, у Максима — просто вернуться домой) в переписке не проговаривается.</p>\n<h3>Апостолы как организация</h3>\n<p>Апостолы — основатели и заказчики АЗИП (331456), «нерушимая организация Азип» существует «более сотней лет» (359681), двое апостолов сидят на Северном полюсе (331453), «апостолы с давних времён защищали мир. И во всё времена государство о них знала» (331455).</p>\n<p>Как их видит противник — монолог старика-арбетара, 2025-03-13 (301806): <strong>«Эти апостолы не пойми кем себя возомнили и везде понаставили свои порядки, на чужой силе»</strong>; и тут же признание: <strong>«как бы я ненавидел апостолов. Но не могу не признать, что свою работу они выполняють слишком идеально. Ну даже в идеальной системе есть единичные пробои»</strong>. Эльф-чужемирец, 2025-03-03 (297463): «Что-то, не верится, что ты апостол, тот самый легендарный, тем кем наш пугали старший, тех кого боялись сильнейший и те кто могут убить даже существо, ты явно не заслуживаешь эту силу».</p>\n<p>Финал, задуманный для организации, 2025-08-30 (359691): <strong>«В конце всё истории и в последнее битве апостолы продуют. Большинство апостолов сдохнуть. Поэтому нужна сила что позволит это сделать»</strong>.</p>\n<h3>Организация злодеев</h3>\n<p>2025-01-22 — 2025-01-23 (w0072). Слава задаёт направление: «Мотивы организаций злодеев / В их ней организаций есть Альфы и благословенный» (283835). Альфы тут же определены: «Альфы сильнейший существа в своём мире» (283839).</p>\n<p>Глава, 2025-01-23 (284170–284171): «При этом глава этой организации будет единственный благословенный правителем нашего мира», «То бишь она будет грубо говоря сильнейшей». Персонаж женский, имени в переписке нет.</p>\n<p>Иерархия: «7 грехов и божество (помнишь его) / Будет слабей главы этой организации но сильней благословенного» (284175). На следующий день добавлено числовое правило (284276): «Но не забывай 7 грехов сильней благословенный и чтобы убить одного греха в максимум надо <strong>3 благословенных именно Бога</strong> / А для остальных благословенных надо будет <strong>5</strong>». Формулировка «а для остальных» читается двояко — про других грехов или про других благословенных.</p>\n<p>Мотивы организации так и не сформулированы: Миколай дважды откладывает ответ («я позже отвечу», 284174).</p>\n<h3>Сестра и её группировка</h3>\n<p>Роль главного злодея переходит к сестре имитатора. 2025-03-06 (298834): «И вообще мир будет объединять сестра имитатора, а не правитель». Цель (298826): «Цель главного злодея объединить всё миры в один, конечно главным будет Килька... А зачем это сестре имитатора, не знаю но придумаю». Для обряда «Нужно хотя бы 16 вещей так как сюжет должен быть длинным» (298841). Финальная битва — у озера, «наверное это будет что-то из средних миров» (298845–298846); «в конце объединятся только мелкие и некоторый средний миры, а рай и ад останутся наверняка» (298853).</p>\n<p>Состояние группировки на 2025-08-30 (359684): «Есть сестра благословенная правителем Кильке. Да она сильнее одного апостола. Но дальше че. Это не та сила, что поставит на колени весь мир. А её подручный всё слабее апостолов. <strong>Каждый из них один на один против апостолов продует. При этом у них не такая большая группировка</strong>». Решение (359688): «Нет сестра так и останется ключевым злодеем. Но кто в её команде должен быть настолько сильном что перевернёт хот битвы». Существа из рая как кандидаты в злодеи отсечены (359687): «Во первых нет так таковой цели, кроме мести. Во вторых не какой группироаонной работы не будет их же в разный места раскидает». Серафим — «одноразовый босс. Что появится, когда будет война с раем» (359686).</p>\n<p>Переходит ли организация злодеев (январь 2025) в группировку сестры — в переписке не сказано.</p>\n<h3>Нимб</h3>\n<p>Во вселенной «Апостол» Нимб назван <strong>один раз</strong>, 2025-05-14 (325808): на вопрос, что менять в реестре, Слава отвечает — «Добавления организация нимб и фантазеров / И перераспределение сил». Что это за организация, в окне не сказано; в реестр она так и не попала. Развёрнутый Нимб (фармацевтическая компания, объекты, отделы) относится к отдельной вселенной «Нимб», заявленной 2025-04-08.</p>\n<p>Единственное пересечение: 2025-04-08 (317515–317517) Слава называет злодеями «Демон и масочник», Миколай спрашивает «это челы другого мира или директора нимба или всё вместе?» — «И то и другой». Масочник при этом стоит в списке апостолов «Апостола» с 2025-01-28 (285522). <strong>Как связаны две вселенные помимо этого совпадения, в переписке не сказано.</strong></p>\n<h3>Фармацевтическая компания без названия</h3>\n<p>Из эпилога таёжной истории Ивана Васильевича, 2025-05-02 (323370): «После мы позвонили полиции. И сказали всё как есть. Они это за всерьёз не восприняли сначала. Но после нам перезвонили. Нет не полицая, а фармацевтическая компания. После они даже к нам ко всем. Лично приехали и взяли показание. А после попросили подписать бумажке о неразглашении. Конечно же с моральными выплатами, как мои 6 зарплат. А после уехали. Похороны Тохи они также оплатили. И оплатили медицинский расходы. Но при этом сами не предоставили свои препараты. Я то знаю. Да нет всё знают, что их ней препараты могут и конечность отрастить. Но они решили не тратить на нас это. Поэтому мне и ампутировали руку».</p>\n<p>2025-05-15 Миколай спрашивает: «Какова роль фарм-корпорации? Это эксперименты, биологическое оружие или они „пылесосят аномалии“?» (326310). Ответ (326314) — «Биологическая оружия». Названия у компании нет; связь с «Нимбом» не заявлена.</p>\n<h3>Церковь, Военные, Сторонние силы</h3>\n<p>Это разделы сквозного реестра, а не разработанные организации. Всё, что о них есть, — строки с именами и эмодзи:</p>\n<ul>\n<li><strong>Церковь:</strong> Священнослужитель ⚪️, Многоглазый 👁‍🗨. Появились в редакции 2025-01-27 (284858) и не менялись до последней редакции 2025-05-14 (325799).</li>\n<li><strong>Военный:</strong> раздел заведён пустым 2025-01-27 и 2025-01-28; заполнен к 2025-02-25 (295559) — Зеркальный 🪞, Очкарик.</li>\n<li><strong>Сторонний силы:</strong> 2025-01-27 — только Породитель 😈; 2025-01-28 добавлены Провидец 🤡 и Серафим («манипуляция сознанием; контроль времент; управлений светом; огонь Божий» 🪽🪽🪽).</li>\n</ul>\n<p>Что такое «Церковь» как организация, кому подчиняется, как относится к апостолам и к АЗИП — в переписке не сказано.</p>\n<p>Орденов во вселенной «Апостол» нет: единственный «орден» в базе — Орден по убийству котов — относится к вселенной «Оам».</p>\n<h3>Сводные реестры состава</h3>\n<p><strong>Каталог 2025-01-24 (284248, 284278, 284300).</strong> Слава трижды за день переписывает свод. Первая редакция, раздел «Благословенный»: Теневые братья 🌘 отдельной строкой, Имитатор 🗡 (ветреной 🌬; электро ⚡️; птичка 🔈), Агрегат 🫥 (волк 🐺; экстримал ⏳), Разрушительнитца 💪 (огненная 💥), Палач ☠️, Защитник 🤬 (ангел 👼), Дитя света ✨, Бессмертный выродок 🤪, Хулиган 💎, Вибрация 🫨, Ученица???. Раздел «Враг»: Доспехи 🏳️, Козлиха 🪓, Сестра 🚺, Огненный снайпер 🔥, Охотник 🔪, Божество 😵, Убийца 🩸, Зонтик 🩸, Леший 🌳, Пар 💨, Садистка ✂️, Насекомое 😡, Старик ➡️⬅️. Раздел «Идей»: Чёрный ящик, озеро перерождения, корень желаний.</p>\n<p>Вторая редакция того же дня: Теневые братья переехали в скобку к Дитя света; к Агрегату добавлен страдалец 🔪, к Хулигану — слайм 7️⃣; во врагов добавлен Эльф 🌬; заведён блок «Семь грехов» — Гнев 😡 (сила), Похоть 😵‍💫 (контроль разума), Зависть 👹👹 (полной копирование), Алчность ♾ (всё моей), Гордыня 👑, Чероугодия ◼️ (поглощения), Лень 😴 (контроль территории). Третья редакция: заведены блоки «Оружие» (Ветреной меч 🌬, Молот 🫨, Оружейный браслет 💪, Посох и два шара ⚪️, Большой топор 🐐, Парный топары 🔪, Меч палача ☠️, Крылатый мечи 🪽, Крылатый клинки 🪽, Меч/клинки с меткой ⬅️, Кровавый меч 🩸, Сломанный железный рукавицы 🤕) и «Артефакты» (Бусы сохранения, Меч сохранения, Громиносец ⚡️, Всё 🗡🪓⛏🏳️, Ожерелья ☀️, Мобильный посох 🧙‍♂️, Цепь связи ⛓); «корень желаний» заменён на «камень желаний».</p>\n<p>Степень проработки названа прямо: на вопрос Миколая «а ты рил всех персов продумал?» (284364) Слава отвечает — <strong>«Ну только вид и способность и плюс минус характер»</strong> (284366).</p>\n<p><strong>Реестр вселенной, четыре редакции: 284858 (2025-01-27), 285522 (2025-01-28), 295559 (2025-02-25), 298850 (2025-03-06).</strong> 27.01 заведены разделы «Церковь», «Военный», «Сторонний силы», «Существа» (пустой) и «Аномалий» — озеро перерождения и камни желаний переехали туда из «Идей», в «Идей» остался только Чёрный ящик. 28.01 добавлен Масочник 🎭, Провидец и Серафим; цепь связи перенесена из артефактов в оружие, что обсуждается прямо: Миколай «цепь связи?» (285528), Слава «Ну была только в артефактах, я еë после перенёс в орудий» (285531).</p>\n<p>Тут же — структурное замечание. Миколай: «не разделены благословенные и апостолы» (285533). Слава: «Сделаю сделаю» (285534) и поясняет устройство списка: <strong>«Но там среди благословенных только апостолы а в скобках благословенный»</strong> (285537) — то есть строка списка это апостол, а в скобках при нём привязанные благословенные и спутники.</p>\n<p>25.02 список пронумерован и вырос до 14 позиций — добавлены Сон ✨, Небесная 🚀, Маэстро 🎼; у Палача появилась скобка (тварь); заполнен «Военный»; в артефакты добавлены Уродливая маска 😭, Шлем истины 🪖, Бесконечное лето ➿. 06.03 список выложен без изменений, и сразу за ним — «12 злодеев пока», «Ну в списке моём» и решение убрать грехи.</p>\n<p><strong>Реестр 2025-05-14 (325799).</strong> Та же таблица, но заголовок первого раздела уже не «Благословенный», а <strong>«Апостолы:»</strong> — обещание разделить апостолов и благословенных выполнено переименованием раздела. Состав 14 позиций: 1. Имитатор 🗡 (ветреной 🌬; электро ⚡️; птичка 🔈), 2. Агрегат 🫥 (теневые братья 🌑; экстримал ⏳; страдалец 🔪), 3. Разрушительница 💪 (огненная 💥), 4. Палач ☠️ (тварь), 5. Защитник 🤬 (ангел 👼), 6. Дитя света ✨ (военный 🐺), 7. Бессмертный выродок 🤪, 8. Хулиган 💎 (слайм 7️⃣), 9. Вибрация 🫨, 10. Ученица???, 11. Масочник 🎭, 12. Сон ✨, 13. Небесная 🚀, 14. Маэстро 🎼. Из врагов пропал Зонтик 🩸 — осталось 13 имён. Раздел «Семь грехов» из реестра исчез. «Существа» по-прежнему пуст, в «Идей» — только Чёрный ящик. Сразу после: «Он жив» (325800), «Ну и нужно исправления» (325801), и на уточнение — «Добавления организация нимб и фантазеров / И перераспределение сил» (325808).</p>\n<p>Расхождение: апостолов по лору 21 (305856, 331635), в реестре 14 позиций. В переписке это нигде не оговаривается. Пункт 10 «Ученица???» автор оставил нерешённым со дня появления списка.</p>\n<p>Отдельно 2025-02-25 Слава напоминает про ещё одну группу — «Благословенный ада» (295556), «Которых 9» (295557), при списке из 14 позиций под этим. Кто в неё входит, не перечислено.</p>\n<p>К 2026-01-31 (426512, 426535) и 2026-02-09 (430400) список апостолов сокращён до 12 позиций: Имитатор, Агрегат, Защитник, Бессмертный выродок, Граф, Вибрация, (пусто), Звездачет, Небесная, Палач, Кура, Избранный. Пустые позиции Миколай затыкает рабочими названиями «липкий» и «иссушающий»; на вопрос Славы «Че за липкий» отвечает: «придумаю позже», «пока как заполнение» (426561–426563).</p>\n<p><strong>Перечень категорий сил.</strong> 2025-05-10 (324541), шесть строк: Благословенный / Арбетары / Альфы / Чужемирцы / Владельцы артефактов / Фантазёры. 2025-08-30 (359706) — три строки: Благословенный / Арбетаров и Альфы / Творцы (фантазёры). Список нужен, чтобы посчитать, какая по счёту будет новая сила: Слава спрашивает «Можно придумать третью силу. Наподобие благословенных?» (359697), Миколай — «а вторая какая?», после перечня Слава поправляется: «То есть четвёртую» (359707). Разница между двумя перечнями в переписке не объясняется; обоснование слияния арбетаров и альф лежит рядом, 2025-05-31 (331636).</p>\n<p><strong>Команда против Серафима</strong>, 2025-01-28 (285363) — пати из четырёх:</p>\n<ol>\n<li><strong>Воительнтца</strong> — огромная физическая сила, очень крепка, скорость средняя; способность — контроль над массой, размером и плотностью, «но только на себе или на неживых объектов»; оружие — оружейный браслет, «браслет на котором висят разный холодный орудия, которая она сможет увеличить и сделать плотней».</li>\n<li><strong>Агрегат</strong> — средние показатели, но быстрее Воительницы; способность — менять агрегатное состояние неодушевлённых объектов, «он может сделать прочным воздух или землю превратить в воду»; оружия нет, создаёт его из воздуха, «за счёт этого оно почти невидимая».</li>\n<li><strong>Имитатор</strong> — самый живучий, прочность ниже, чем у Воительницы; способность — имитировать способность врага, «но лишь одну способность и то ему надо время», плюс в том, что «он конечно имитирует но способен будет еë развить»; оружие — жидкость, мгновенно принимающая любую форму.</li>\n<li><strong>Палач</strong> — быстрейший в пати, «его всё атаки нацеленый на жизненный важный точки противника»; способность — сжатие: «он может жать пространства чтобы приблизится к противнткк, или сжать атаку противника. Он также может сжимать ауру и делать слэш»; оружие — катана.</li>\n</ol>\n<p>Тут же оговорка: «Вообще против Серафима по сюжету должны были драться совсем другие перс которых я ещё не придумал» (285405). Про Воительницу уточнено: она апостол, «Апостол у которогой есть дочь» (285411–285412). Вопрос Миколая «воительница просто прозвище по способности а не по профессии?» (285413) остался без ответа. Соотношение Воительницы и «Разрушительнитцы 💪» из реестра в чате не проговорено.</p>\n<p><strong>Состав собственных персонажей</strong>, 2025-03-14 (302836). Миколай: «пока у тебя истории жалких человечков». Слава: «Это я просто решил рифмитический описать. А так персонажи не жалкий. Ну если смотреть со стороны психи, то конечно жалкий, <strong>два мститель, нече не помниший апостол, и один с ушедший с ума чужемирец</strong>», и добавляет: «Ну Агрегат уравновешенный хоть второстепенный перс» (302839). Отсюда решение: «Харе жалких» (302845), «Ну конечно не харе, но пока отступим в сторонку» (302847). Причина неполноты раскрытия названа сразу: <strong>«В этом и суть. Я ещё не до конца построил мир. Поэтому прям раскрытия всего не даю»</strong> (302853).</p>\n<h3>Как организации соотносятся между собой</h3>\n<p>Что названо прямо: апостолы основали АЗИП и стоят за ней; агенты вербуются апостолами лично, обучаются в лагере и привязаны к штабу, «именно мы их завербовали и несем за них ответственность»; чужемирцев АЗИП либо регистрирует, либо устраняет; арбетары и фантазёры названы объектом устранения в контракте; апостолы охотятся на альф — старик-арбетар ждёт, «пока какой-нибудь апостол упустить альфю»; в организацию злодеев входят альфы и благословенные, её глава сильнее всех, ниже семь грехов и божество, ещё ниже обычный благословенный; у сестры каждый подручный слабее апостола и группировка небольшая.</p>\n<p>Чего в переписке нет: отношений АЗИП с государствами, кроме «во всё времена государство о них знала» и «контракт России» (вариант Миколая про «совет 300+ государств» остался без ответа); отношений АЗИП с Церковью, Военными и Сторонними силами из реестра; отношений АЗИП и Нимба.</p>", "r": []}, {"t": "Население и классы", "a": ["S04", "VS-0002-S04", "VS-0002--naselenie-i-klassy"], "h": "<h3>Апостолы</h3>\n<p>Термин заведён 2025-01-28 (285342): «Давай благословенный Богом это апостооы, чтобы различать благословенных Богом и других».</p>\n<p><strong>Кто они.</strong> 2025-03-19 (305856), устами имитатора: «Ты и я апостолы. Это люди получивший благословения от правителя рая. То бишь от второго мира появившейся после кильке. Нас апостолов 21 во всём мире. Нас, именно нас благословенных правителем рая. Больше чем других благословенных другими правителями». 2025-05-31 (331635): <strong>«Апостолы это 21 человек получивший благословен от правителя рая. ( 21 это максимальное число благословения, который способен давать правитель рая. Другие же правители дают меньше)»</strong>.</p>\n<p><strong>Чем отличаются от прочих благословенных.</strong> У благословенных одного правителя способность одна и та же на всех; у апостолов — уникальная у каждого: «правитель рая. Посылает им лишь сгустки чистой и необработанной силы, который формируется во что уже только внутри Апостолов. Даруя им уникальные способности» (331635). Плюс общая только для них телепатия: «они способны разговаривать. На расстоянии и также всем мести. Они также могут отказаться от телепатического общения и прервать разговор».</p>\n<p><strong>Признак.</strong> Белые светящиеся глаза при активации благословения (см. «Система способностей»).</p>\n<p><strong>Сила относительно других</strong> (331635): «так как всё благословенный включая апостолов. Получают плюс минус одинаковая количество энергии ( силы). Они являются одинаково сильными. Но это не включая индивидуальность людей. Всё же апостолы всё равно чаще всего сильнее любого другого благословенного».</p>\n<p>Первое появление класса в прозе — 2025-03-03 (297463), репликой эльфа-чужемирца. В той же сцене показан апостол по прозвищу «плакса»: мужчина в форме, «более раскошно, что-ли, и элегантно», со шрамами — «Шрамы! словно он плачет, две полосы вниз, словно он роняет слезы» — и белыми блестящими глазами; стреляет из винтовки, парирует меч штыком, добивает эльфа. Забирая мальчика, говорит: «Похоже ты будешь аномалий нашего поколения».</p>\n<p><strong>Гении.</strong> 2025-03-06 (298875) апостолы с самой странной способностью, раньше называвшиеся «Аномалия», названы Гениями: «у каждого поколения такой был». Пример — Бессмертный.</p>\n<h3>Благословенные</h3>\n<p><strong>Механика.</strong> 2025-03-10 (300888): <strong>«Благословенный это люди у которых есть связь с правителем другого мира, и чтобы получить его силу нужно сначала пропустить еë через мозг, из за этого благословенный не могут использовать благословенный 24/7»</strong>. Полная версия — в разделе «Система способностей».</p>\n<p><strong>Кем благословлены.</strong> 2025-01-06: правители минимиров дают редко, больше всех бог и дьявол — по 21 человеку каждый; в том же вечере названы числа 42 и 41. 2025-01-22 (283709–283712) Слава предлагает убрать благословенных дьяволом и спрашивает, 21 или 42; Миколай отвечает «21». Позже вводится третий источник — благословение правителем нашего мира (2025-01-23, 284170): «глава этой организации будет единственный благословенный правителем нашего мира». 2025-08-30 (359684): «Есть сестра благословенная правителем Кильке. Да она сильнее одного апостола».</p>\n<p><strong>Отношения внутри класса</strong> (279042–279043): «Они чувствуют себя как братья и сестры», «Хотя и редко видятся в живую».</p>\n<p><strong>Взгляд врага</strong>, 2025-03-13 (301806): <strong>«Ведь по правде говоря вся их сила, и не их вообще. Жалкий благословенный получивший силу лишь потому что понравились правителем, но сами они эту силу не добывали. Лишь мелкий пизжоны»</strong>. И про уязвимость: «благословенный не могут использовать благословенния долга, поэтому можно просто неожидано напасть и убить и всё».</p>\n<p><strong>Прошлое класса</strong> — предложение Миколая 2025-01-13 (281373–281376): «раньше веков 15 назад благословенные были мощее но типа их реже призывали поэтому они оставляли силу потомкам», «и заключали её в артефактах», «просто думали что благословенных больше не будет и заботились о будущем». Слава переключился на другое; принято ли предложение, из переписки не видно.</p>\n<h3>Аномальные люди</h3>\n<p>2025-01-06 (279033): «Чаще всего это дети простого человека и чужемирца». Могут входить в организации благословенных (279029).</p>\n<h3>Чужемирцы (они же междумирцы)</h3>\n<p><strong>Определение.</strong> 2025-03-10 (300890): «Существа других миров, который сбегают в наш по разным причинам». Развёрнуто 2025-03-18 (305116): <strong>«Это существо покинувший свой мир. По каким либо причинам. Чаще всего из-за того, что их ней миры суший ад. Или желанием захвата других миров. Ну грубо говоря почти всё чужемирцы жестокие психи. Для которых убийства это обыденная дело. У них там ещё разделения по видам способностей. Ну это скука об этом говорить»</strong>.</p>\n<p><strong>Внутреннее деление</strong>, 2025-03-10 (300891): «Чужамирцы делятся на: обычных просто чужемирца с разной анатомии / Существа про них я говорил / Альфы».</p>\n<p><strong>Как выглядят.</strong> Показаны в прозе 2025-02-12 (288543–288545), от лица самого чужемирца: мелкие серые карлики, залетающие в окно, «ничего из себя не представляющей по отдельности», быстрые, живут и нападают группой; «высокий, мускулистый, без одежды и волос, глаза у них были маленькие», ловкие, с когтями; шестирукое чудовище, которое рассказчик называет «паучок»; оборотень, «тощий силуэт покрытой шерстью». Родство между видами рассказчик сам не знает: «Если честно сам не могу сказать кем им приходится карлики. Может они родственники, а может просто подчинённый и слуга».</p>\n<p><strong>Физика тела</strong>, 2025-03-18 (305316–305317), в ответ на вопрос Миколая, откуда у лучницы стрелы, если «у неё юбка и всё»: «В этом суть этих чудемирцов. Они могут создавать оружия из себя», «Но трансформировать тело не могут». Слава тут же признаёт: «Но здесь я виноват. Забыл добавить момент».</p>\n<p><strong>Статус в мире.</strong> Чужемирец может быть и целью, и сотрудником: «Агент- это люди или чужемирцы, которых завербовали в организацию АЗИП» (330909). По контракту (331072) агент обязан встретить чужемирца, покинувшего свой мир, и либо зарегистрировать, либо устранить при агрессии, «не забывайте. Не всё чужемирцы опасны и хотят кому-то навредить».</p>\n<p><strong>Второе имя</strong> — «междумирцы», 2025-01-22 (283706): воплощение гнева — «Тот кто да мозга костей ненавидит междумирцов». 2025-01-24 (284249, 284287–284291) Слава загадывает, кто из списка врагов чужемирец: «Их там больше», «Где-то 7», «Не считал». Миколай перебирает: насекомое, козлиха, божество, зонтик, эльф, доспехи; Слава вычёркивает зонтика и лешего (284361–284363). Полного ответа в окне нет.</p>\n<p><strong>Эльф-чужемирец</strong> (2025-03-10): попал в наш мир, почуял апостола и решил его убить; к гибели жителей деревни непричастен.</p>\n<h3>Арбетары и Альфы</h3>\n<p><strong>Альфы.</strong> Первое определение, 2025-01-22 (283839): «Альфы сильнейший существа в своём мире». Старое понимание, названное самим Славой отменённым, 2025-03-10 (300892–300894): «Альфы раньше означали сильнейшей разумной субъекты в своём мире, которая имеет, что-то похоже на благословенния» — «И я думал что это похожее на благословения? / И теперь я допер».</p>\n<p>Новое определение, 2025-03-10 (300898): <strong>«Альфы это субъекты своего мира, который смогли сцапать кусочек силы своего мира, с помощью ритуала или ещё чего, и вот получив кусочек силы своего мира, они зародилил в себе ядро, которая и вырабатывает энергию, у них нет связи, их нея сила только их нея, а из-за отсутствия связи напряжения на мозг исчезает, так как через мозг больше ничего не проходит, и теперь они по-сути могут использовать свою силу 24/7. И так как это их нея сила, а не сторонняя, они могут лечить и баффеть не только себя, а огонь которым они устроили пожар не исчезнет пока его не потушить или пока альфа не умрёт»</strong>.</p>\n<p><strong>Арбетары</strong> введены тут же (300910–300912): <strong>«Я подумал раз так могут альфа, так значит так могут и люди, сцапать кусок силы своего мира»</strong>, <strong>«И вот люди, который сцапали кусок силы своего мира называют Арбетар»</strong>, «Моя следующая история, о том как они это делают».</p>\n<p><strong>Цена перехода</strong> (300913): <strong>«И кстати люди и чужемирцы сцапав кусок силы своего мира, их ней шанс на выживания 7 процентов. Чаще всего идёт отторжения и они могут сойти с ума, их ней тела могут начать гнить, или взорваться. Или они могут стать монстрами ведомый только инстинктами»</strong>.</p>\n<p><strong>Имя</strong>, 2025-03-13 (301805): «В деревню решил заглянуть Арбетар(швецский; на русском трудяга)».</p>\n<p><strong>Повадки.</strong> Там же: «И начал Арбетар там всё крушить и поглащать жизнь человеческий и начал он из них делать чудищь словно из картины шизофриника». Арбетары стары и берут учеников, потому что (301806) «хоть души людей и питательные, но на них вечность прожить не выйдет». Ученичество старика длилось 50 лет: «Принести то, убить того, сожрать это, защитить того, провести ритуал»; за это время он вырос, «а его учитель был таким же, но слегка лишь поседев».</p>\n<p><strong>Сводное определение</strong>, 2025-05-31 (331636): <strong>«Арбетары и Альфа это одни те же существа. Но в первом случае это люди из кильке, а во втором это чужемирцы. Если их описывать то это существа, который насильственно вырвали кусок силы своего мира( с помощью ритуала??? Которой я ещё не доработал). А после посели его в себе и заставили выделять силу. Из-за того, что грубо говоря это их сила ( внутри них). Они могут использовать его без ограничений. ( по сути это благословенния только не через связь. А именно это сила находиться внутри их) Виде перегрузки мозга»</strong>. Базовые умения те же четыре, что у благословенных, «регенерация чаще всего превосходит благословенных». Уникальная способность есть и у них: «Даже если они сцапали один и тот же кусок силы. У них она всё равно будет разная. Так как этот кусок начинает формироваться подобно апостолом». Разница в эксплуатации: «если они подожгут лес он будет гореть пока весь не выгореть. Либо его не потушат. Им не зачем отключат способность. У них даже нету такого понятия, как отключения. Но они должны будут учиться вырабатывать энергию и научиться использовать способность и контролировать энергию. Когда у благословенным это выходит автоматический».</p>\n<p>Со стороны боя (301806): «Ведь у альфа и арбетатов похожий силый. Они как и мы может использовать свою силу 24/7 без риска повредить мозг. А если сила всегда активна и его защищает, то просто неожиданная атака, на нём не проканает».</p>\n<p><strong>Именованный арбетар.</strong> Кура (331639, 2025-05-31): мужчина, выглядит на 30, рост 185, маска курицы с красным гребнем, зелёно-оранжевый плащ; был начальником одного из дополнительных филиалов АЗИП, отстранён «из-за проявления своего безумия и игривого характера», ныне агент и приближённый Апостола (Бессмертного). То есть арбетар в этой вселенной может служить в организации апостолов.</p>\n<h3>Пераги</h3>\n<p>Класс появляется внутри прозы про мир без солнца. <strong>Появление и имя</strong>, 2025-02-24 (293227): герой придумывает термин по ходу рассказа — «Думаю не помешало бы, дать им название для ясности ума, давайте например \"пераг\"». Описание: «Это был, когда-то человек, хотя ручаться я не стану. И был он весь в крови, но даже в этом красном месиве, я видел чётко, перья белый как снег, не они ещё белее, белее чем душа младенца. И эти перья вылазили из недор тела, стремясь в наружу. Но больше всех, этих перье были в голове».</p>\n<p><strong>Свойства</strong> (293227–293229): пули — «всё пули, который попадали в перья отскакивали, а если попал просто тело то они прошибали»; оружие — «с руки его вылазить огромное и длинное перо, словно меч»; огонь — погибший пераг горит, «И всё горела, кроме перьев белых. И даже в красно-оранжевым огне, эти перье были белые»; мёртвая плоть — «его плоть не гнила и была вкусна», герой ест её, выбираясь из-под завала; речь — герой связывает живого перага и разговаривает с ним, «и слышал он ответ», а следом сам себе не верит: «они ведь не говорил со мной это всё в мой голове. Я псих, я сошёл с ума».</p>\n<p><strong>Происхождение</strong>, версия 2025-03-19 (305854): пераги — вторая волна катастрофы после раскола солнца. «После началось заражение и появление этих зараженных, которых в других мирах называют Пераг. Это люди, который обрастают белыми перьями. Словно они состоят из чистого серебра. Они становятся похожими на ангелов из мифов. Но лишь похожими. На деле это были чудища. Монстры у которых главная цель убить всё разумной на планете Земля. Падший ангелы. Коэффициент этих зараженных. 23 заражённых на одного человека. Где-то так».</p>\n<p><strong>Чем они не являются.</strong> 2025-03-20 (306126–306131) Миколай: «я думал пераг это ангел», «чел из рая». Слава: «Н-не», «Это заражённый».</p>\n<h3>Упыри</h3>\n<p>Введены 2025-03-19 (305854–305855) в той же прозе. <strong>Доля:</strong> «После катастрофы. Среди выживших начали появляется упыри. Это где-то 30-40 процентов выживших стали упырями».</p>\n<p><strong>Что это:</strong> «Кто такие упыри? Это не люди, которых тяжело убить». Далее: «Ты можешь скинуть его с небоскреба. Но он выживет. Ты можешь подорвать его или жечь. Он выживет. Ты можешь продырявить ему черепушки, что аж мозги будут видно. Но он выживет. Ты можешь выпотрошить или утопить его. Но он выживет». И оговорка: <strong>«Упырь не владеет, какой-то сверхчеловеческой силой или скоростью. Он просто живучий и всё»</strong>.</p>\n<p><strong>Минус первый — голод:</strong> «Каннибализм. У них невероятный голод... Это просто был голод, который не как не удовлетворить, что бы они не ели. Но если они съедят человечину. Этот бесконечный голод утихнет. И они смогут стать счастливы».</p>\n<p><strong>Минус второй — потеря «я»:</strong> «В том что мы теряли своей собственной \"я\". Деградируя. Нет кому-то удавалось вернуть своей \" Я\". А кому-то даже продержатся 3 года. Но по итогу всегда всё заканчивалась тем, что они теряли снова или первый раз. Без разницы. Они всë равно теряли своей \"я\"».</p>\n<p><strong>Происхождение не решено внутри самого текста:</strong> «От чего вообще взялись упыри. Это заража из рая. Или это попытка правителя спасти людей. Не знаю».</p>\n<p><strong>Исключение</strong> — рассказчик-упырь, не потерявший себя, «Потому-что у меня была цель. Я должен был защитить тех 38 людей». За шесть лет из них умерло 19. Позже он надел экзоскелет, для чего «нужно было отрезать несколько конечности. Вырвать органы и продырявить череп», терпел четырнадцать дней без обезболивающего — «Оставьте лучше для людей».</p>\n<p>Упыри едят перагов, потому что «Ведь пераги это люди. Их можно есть. Жувать. Глотать» (305855). Съев плоть перага, рассказчик первой истории перестаёт умирать и постепенно превращается в упыря.</p>\n<p>Реакция Миколая, 2025-03-20 (306134–306147): «круто быть упырём», «подобно Гулям из токийского гуля», «что они могут позволить себя насиловать чтобы надеть экзоскелет / ну эт прикольно».</p>\n<h3>Протобионты</h3>\n<p>2025-05-31 (331635): дети правителей, «Это субъект, который был создан именно правителем, а не из-за особенности мира. Подобные субъекты имеют огромную силу, которая в теории позволит уничтожить континент. Но большинство существ спокойный и миролюбивый. При этом они очень не любят покидать мир своего родителя». Уточнение масштаба (331655): «Я подразумевал существ среднего и малого мира. А вот из нашего то он вполне солнечную систему разрушит». Протобионтов, наравне с благословенными и арбетарами, чувствует сенсорика благословенного. Ни одного именованного протобионта в переписке нет.</p>\n<h3>Фантазёры (Творцы)</h3>\n<p>Названы 2025-05-10 (324541) последней строкой в перечне категорий сил. Раскрыты 2025-05-31 (331636): <strong>«Фантазеры это можно сказать правитель с маленькой буквой. Они создали свой мир в голове. Из-за этого даже глядя на наш мир ( то бишь мир в котором находиться их физическая оболочка). Они видят его по другому»</strong>. Пример: «фантазёр, что видит мир виде линей, колебаний. Глядя на стенку он видит лишь большо миллиона движущих линий, который за, что-то отвечают. Из-за этого он способен влиять на наш мир. По законам своего. То есть он может изменить колебания волны ( нитки). И стена может стать воздухом или водой или взорваться в зависимости. Какую нитку потянули и как на неё повлияли».</p>\n<p>Место в иерархии и слабое место: <strong>«Фантазёр на данный момент сильнейший существа. Но они могут просто исчезнуть. Потерять связь с нашим мирам и полностью окунуться свой. Исчезая. Из-за этого их очень мало. Ведь нет не одной причины жить в мире правителя. Если ты можешь попасть в свой»</strong>.</p>\n<p>Вопрос Миколая «а в мир фантазёра можно попасть?» (331663) — ответ Славы: «Нет» (331667).</p>\n<p>По контракту агента АЗИП фантазёры вместе с арбетарами перечислены как «лица, который получают силу непосредственно самого себя», подлежащие устранению или захвату.</p>\n<h3>Одержимые</h3>\n<p>Как отдельная категория рядом с благословенными названы 2025-02-25 (295553–295559): Слава напоминает «Одержимый», «Ты не забыл», и в реестре под заголовком «Одержимый:» стоит одно имя — Гурман, без раскрытия.</p>\n<p>Содержание появляется только 2025-09-12 (364766), уже в переработанной вселенной, за границей отрезков «Апостола»: «Одержимые это люди одержимые демоном. И этого одержимого либо убивают либо изгоняют демона... Одержимый это аналог Арбетара ( я даже в иногда буду называть их так) то есть у него такие же силы. Но ему не надо обучаться. Он сразу сильный. И в чаще всего сильнее благословенных (поэтому на убийства одержимого они ходят группой разного количества)».</p>\n<h3>Агенты — служебная категория, не раса</h3>\n<p>2025-05-28 (330909): «Агент- это люди или чужемирцы, которых завербовали в организацию АЗИП. И их главная цель уничтожения опасных существ. Буть то люди или чужемирцы». Подготовка, выплаты, страховка и правила — в разделе «Организации и сообщества».</p>\n<h3>Как классы соотносятся между собой</h3>\n<p><strong>По источнику силы.</strong> Три способа получить силу, названные прямо:</p>\n<ol>\n<li>Сила приходит извне по связи с правителем — благословенные, апостолы среди них. Проходит через мозг, вредит ему, работает не круглосуточно, после отключения все её следы исчезают.</li>\n<li>Сила вырвана у собственного мира и поселена внутри — арбетары (люди из кильки) и альфы (чужемирцы). Связи нет, мозг не нагружается, отключения не существует, зажжённый огонь горит, пока не потушат. Шанс выжить при захвате — 7 процентов.</li>\n<li>Сила из собственного придуманного мира — фантазёры (творцы), «правитель с маленькой буквой».\nПлюс четвёртая категория — не сила, а вещь: владельцы артефактов, причём «Лучшего всего мощь артефакта способен раскрыть обычный человек».</li>\n</ol>\n<p><strong>По происхождению существа.</strong> Уроженцы Кильки (люди; только они могут получить благословение; покинуть Кильку не могут) — уроженцы других миров (чужемирцы; попадают в Кильку легко) — дети правителей (протобионты) — сами правители.</p>\n<p><strong>По силе, как это проговорено.</strong> Все благословенные, включая апостолов, «являются одинаково сильными», но «апостолы всё равно чаще всего сильнее любого другого благословенного» (331635). Регенерация арбетаров и альф «чаще всего превосходит благословенных» (331636). «Фантазёр на данный момент сильнейший существа» (331636). Ранняя иерархия 2025-01-23/24: глава организации злодеев &gt; семь грехов и божество &gt; благословенный, числом — «чтобы убить одного греха в максимум надо 3 благословенных именно Бога. А для остальных благословенных надо будет 5». 2025-08-30 (359684): сестра, благословлённая правителем Кильке, «сильнее одного апостола», но «Это не та сила, что поставит на колени весь мир». Убить благословенного легко внезапной атакой, альфу — нельзя (301806).</p>\n<p><stron
