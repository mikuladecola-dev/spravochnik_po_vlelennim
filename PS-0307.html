<script>const BASE="";const DOCNAME="Коты";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0307-S01", "PS-0307--proishozhdenie"], "h": "<p>Коты — раса (группа) из девяти существ, введённая Славой в перечне рас и организаций вселенной Оам (2025-11-17, id 385768). В первой же реплике заданы их основные свойства: «Коты. Их 9.они сильнеший ( уникальный особенности, я для них не придумал помоги) и вот они есть в каждую эпоху. Если один кот умрёт родиться новый и всегда их будет 9. Они вообще никуда не вмешиваться».</p>\n<p>Они поставлены на вершину силовой иерархии мира: в том же перечне апостолы названы «вторая по силе раса на земле», то есть коты — первая.</p>\n<p>Позднее (2025-12-04, id 392486) появляется объяснение их природы: «Коты наверное буду типо духами. Будут чисто из Оэм состоять».</p>\n<p>Откуда они взялись, кто их создал и как именно происходит рождение нового кота взамен умершего — в переписке не сказано.</p>", "r": []}, {"t": "Характер", "a": ["S02", "PS-0307-S02", "PS-0307--harakter"], "h": "<p>Единственная названная черта поведения — невмешательство: «Они вообще никуда не вмешиваться» (2025-11-17, id 385768; повторено 2025-12-06, id 393287). Отдельных характеров у котов не прописано, кроме того, что известно про Нуара как отдельного персонажа.</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0307-S03", "PS-0307--sposobnosti"], "h": "<p>Коты названы сильнейшими, но конкретные способности не придуманы. Слава прямо просит помощи в той же строке, где их вводит: «( уникальный особенности, я для них не придумал помоги)» (2025-11-17, id 385768). Просьба повторена дословно 2025-12-06 (id 393287). Ответа Миколая на эту просьбу в окнах нет.</p>\n<p>Что про них известно по силе:</p>\n<ul>\n<li>Постоянное число и перерождение: «Если один кот умрёт родиться новый и всегда их будет 9». Умирать они, следовательно, могут.</li>\n<li>Присутствие в каждой эпохе: «вот они есть в каждую эпоху».</li>\n<li>Природа духов из Оэм (2025-12-04, id 392486, 392489): «Будут чисто из Оэм состоять», «Поэтому запас и понимания Оэм у них больше всех».</li>\n<li>Повтор и уточнение той же мысли (2025-12-06, id 393315): «Кстати коты будут типо, что-то духов. То бишь они будут состоять из Оэм. Из-за этого понимания, объём и контроль Оэм у них выше чем у любого». Здесь к «пониманию» и «объёму» добавлен «контроль».</li>\n</ul>\n<p>Также в окне w0112 котам отданы глаза-черви — связь зафиксирована в перечне связей записи; развёрнутого объяснения этой связи в приведённых кусках переписки нет.</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0307-S04", "PS-0307--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Нуар</strong> — один из котов. Заявлено 2025-11-17 (id 385774): «Кстати нуар один из котов». Тут же Слава напоминает, о ком речь: «Помнишь нуара. Сильнеший из 7 островов», и добавляет (id 385779): «Ну здесь он будет влиять на мир подобно волнами».</li>\n<li><strong>Орден для убийства котов</strong> — в том же перечне (2025-11-17, id 385768): «Так же появиться орден предназначеный для убийства котов». Состав, происхождение и мотивы ордена не названы. В индексе связей запись фигурирует в двух написаниях — «Орден для убийства котов» и «Орден по убийству котов».</li>\n<li><strong>Апостолы 21</strong> — не связь напрямую, но соседняя ступень иерархии: «вторая по силе раса на земле».</li>\n<li><strong>Оэм</strong> — материал, из которого коты состоят.</li>\n<li><strong>Мир апостолов (современный)</strong> и <strong>Оам</strong> — миры, к которым коты отнесены.</li>\n<li>В том же сообщении-перечне, где заведены коты, введены и другие фигуры мира: дочь Имитатора <a href=\"PS-0324.html\">Дочь Имитатора</a> («Группировка сестры ( который теперь будет дочерью Имитатора»), Виктор <a href=\"PS-0308.html\">Виктор</a>. Прямой связи котов с ними в переписке не названо.</li>\n</ul>", "r": [["Дочь Имитатора", "PS-0324.html"], ["Виктор", "PS-0308.html"]]}, {"t": "Как менялся", "a": ["S05", "PS-0307-S05", "PS-0307--kak-menyalsya"], "h": "<p><strong>2025-11-17 (окно w0109, id 385768–385779).</strong> Введены в общем перечне рас и организаций Оам как сильнейшие: девять, постоянное число, перерождение при смерти одного, присутствие в каждую эпоху, невмешательство. Уникальные особенности не придуманы, помощь запрошена. В этот же день выясняется, что Нуар — один из котов, и что появится орден, предназначенный для их убийства.</p>\n<p><strong>2025-12-04 (окно w0112, id 392486–392489).</strong> Придумана их природа: духи, состоящие целиком из Оэм; отсюда — наибольшие запас и понимание Оэм.</p>\n<p><strong>2025-12-06 (окно w0112, id 393287–393292).</strong> Дословный повтор исходного описания из перечня, включая просьбу о помощи с уникальными особенностями. В этом же куске Слава переходит к разбору сторон конфликта: «В нашем мире Оэм уже существует много сторон для конфликта», «Ну нам нужный главные злодей», «Во первых сначала с добрых».</p>\n<p><strong>2025-12-06, позже (окно w0112, id 393314–393318).</strong> Повтор мысли о духах с добавлением «контроля»: «понимания, объём и контроль Оэм у них выше чем у любого». Миколай отвечает, что прочёл всё и примерно понял. Здесь же на реплику Миколая «котов?» (id 393310) в соседнем разговоре речь шла о двух основных злодеях — сами коты злодеями не назначены.</p>\n<p><strong>2025-12-17 (окно w0114, id 399583–399586).</strong> Коты упомянуты одной строкой в списке того, что предстоит придумать: «Роль Котов во всей этой фигней». Разработки в окне нет. Окно объявлено по вселенной Феня.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S06", "PS-0307-S06", "PS-0307--chto-s-nim-stalo"], "h": "<p>На последней зафиксированной дате (2025-12-17) роль котов в сюжете остаётся невыясненной задачей в списке Славы, наряду с планами Бога красок и дочери, силами и мотивами четырёх последователей, жизненным циклом апостолов и мотивами трёх сильнейших. Слава просит закрепить список и продолжить разговор при встрече: «Можешь закрепить. Поговорим когда ты приедешь?»</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0307-S07", "PS-0307--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Уникальные особенности котов не придуманы. Помощь запрошена дважды (2025-11-17 и 2025-12-06), ответа в окнах нет.</li>\n<li>Роль котов в сюжете осталась нерешённой — вынесена в список задач 2025-12-17.</li>\n<li>Как именно рождается новый кот взамен умершего, где он появляется и помнит ли что-то — не сказано.</li>\n<li>Имена и различия остальных восьми котов не названы; поимённо известен только Нуар.</li>\n<li>Кто такие коты, в окне w0114 не объясняется — там они идут как уже известная линия из более ранних окон.</li>\n<li>Внешность котов, их размер и то, коты ли они буквально, в переписке не описаны.</li>\n<li>Связь котов с глазами-червями зафиксирована как связь, но в приведённых кусках переписки не раскрыта.</li>\n<li>Орден для убийства котов: состав, происхождение, мотивы и результаты его действий не названы.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0307--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0308.html\">Виктор</a>, <a href=\"PS-0324.html\">Дочь Имитатора</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0104.html\">Нуар</a>, <a href=\"PS-0308.html\">Виктор</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0057.html\">Коты (девять котов)</a>, <a href=\"GR-0058.html\">Орден по убийству котов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0307--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-11-17</td>\n<td>385768–385779</td>\n<td>w0109</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-04</td>\n<td>392484–392492</td>\n<td>w0112</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-06</td>\n<td>393287–393292</td>\n<td>w0112</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-06</td>\n<td>393314–393318</td>\n<td>w0112</td>\n<td>Оам (объявлено)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2025-12-17</td>\n<td>399583–399586</td>\n<td>w0114</td>\n<td>Феня (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0307-koty.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0307--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0307.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
