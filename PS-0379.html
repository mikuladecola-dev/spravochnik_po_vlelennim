<script>const BASE="";const DOCNAME="Зана";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0379-S01", "PS-0379--proishozhdenie"], "h": "<p>Весь материал по Зане уложен в один вечер 2026-06-17 (id 491161–491165). Варианты написания имени в переписке: «Зана», «Зан», «зан».</p>\n<p>Происхождение названо прямо (2026-06-17, id 491164): «Вообще он не из богатой семьи. Он вырос в семье аферистов которых по итогу убили за их ложь. Поэтому он по сути сирота без денег. Но он смог собрать организацию и собственным красноречием получить множественную поддержку, поэтому всё деньги что у него есть это не его. Но он им пользуется как ему удобно».</p>\n<p>Он — глава организации злодеев Насла и, по тексту, тот, кто её «возвёл» (id 491162).</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0379-S02", "PS-0379--vneshnost"], "h": "<p>Из разбора (2026-06-17, id 491164): «Он подтянутый блондин, с синими глазами. Он выглядеть как лис, которому точно нельзя доверять, его хитрая хищная лицо потверждает это».</p>\n<p>Дальше (id 491165): «У Зана белоснежная чистая кожа. Не как у больного а как у красивого человека. Он немного худощавый поэтому на вид его можно посчитать хрупким».</p>\n<p>Костюм: «Он ходит в белой рубашке с приоткрытом воротником, и засученными рукавами до локтя. Ходит он в очках с цепочкой ( артефакт) и на его правой руке вечно перчатка для стрельбы. Подвеска спрятанная за рубашкой чёрный штаны».</p>\n<p>В сцене предательства (id 491161) он показан со стороны старика: «белоснежная и хрупкая рука», «задорным голосом мальчишка», постоянная улыбка — «а он лишь улыбался своей привычной улыбкой, но теперь и глаза скрытые прозрачными глазами тоже улыбались» (в тексте именно «прозрачными глазами»). Серебряная подвеска в виде сердца поднимается «из под белой рубашке».</p>\n<p>Быт (id 491165): «У него кнопочный дешёвый телефон, чтобы быстро и без сожаление его быстро выбросить. Также у него есть дорогой телефон, на котором вообще нет контактов или что-либо связанные с его работой».</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0379-S03", "PS-0379--harakter"], "h": "<p>Основа характера — питание чужими эмоциями (2026-06-17, id 491164): «Он тот кому нравится видить чужие яркие эмоции. Буде то радость победы или гнев и неверия проигрышу. Он вампир что питается эмоциями ( конечно в пересном смысле)».</p>\n<p>Его личный мотив отделён от идеологии его же организации. Идеология Насла — что «сл и всё кто контролирует оам зло. Абсолютное зло». Сам Зана так не считает (id 491162): «По его мнению даже без сл, был бо множество войны, множество плохих людей, множество смертей и несчастье». Причина, по которой он всё же возглавляет организацию с такими идеалами, дана прямой речью:</p>\n<p>«Разве у вас никогда не проявлялась желание растоптать Бога, замирать его, увидеть его жалкий вид. Подорвать ему крылья и с упоением смотреть на эти отчаяный глаза» — «если нет то вы соврети. Разве у вас просто не промелькала мысль увидеть как например звезда что строила свой образ на протяжении всей жизни вдруг падёт, разве это неинтересно, разве это не просто человеческая желания».</p>\n<p>И дальше: «И кто же в нашем мире бог, конечно сл. И их ними падениями я буду восхищаться. но прежде чем пасть нужно сначала дать им подняться а после собвстенными руками поджечь им крылья и смотреть как крылья начинают разваливаться, как их уверенно лицо, изменяется гримассой страха». Отдельной строкой в тексте: «Главный фанат сл».</p>\n<p>Какое именно падение ему нужно, оговорено: «Вообще он хочет падения не как он сражался против сильного злодея и проиграл. А то где обычный человек, простолюдина топчит бога, дворянина. Где он побеждает даже Бога».</p>\n<p>Границы его злодейства обозначены отдельно (id 491163): «При этом его нельзя назвать худшим злодеем. Он часто не убивает, у него нет цели уничтожить или перестроить мир. Он просто получает удовольствие именно в данный момент».</p>\n<p>Механика его доверия описана как приём (id 491164): «Но видя как он чуть ли не рушит собственную организацию, рискуете собственной жизнью дабы добиться вашего доверия, то ты сам того не понимая начинаешь доверять ему».</p>\n<p>Названы три вещи, которые он не предаст (id 491165): «Свою организация, союз с Бэмом ( большая часть ресурсов оттуда как бы. Поэтому это глупо ради мимолётно радости, решать себя постоянной радости) И всул».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0379-S04", "PS-0379--sposobnosti"], "h": "<p>Собственных способностей у него нет: в Насла «лишь обычный люди там нету сл или ис» (id 491162), и сам он в переписке нигде не назван обладателем способности. Всё, чем он действует, — артефакты (id 491163):</p>\n<p><strong>Клинок тысячи боли.</strong> «Царапина от такого клинка вызовит такую боль словно тебя пырнули. Именно этим клинком он ударил в спину старика». В сцене 491161 клинок описан как кинжал волнистой формы.</p>\n<p><strong>Очки.</strong> «Они позволяют телепортироваться в поле своего зрения. Он не способен телепортироваться на Дальний дистанции, а только на те который именно сейчас видит. И если всё накроется туманом он по сути не сможет телепортироваться». Перезарядка 3–4 секунды. Носит их с цепочкой.</p>\n<p><strong>Железное сердце</strong> — «подвеска, с серебряным сердцем. Эффект рандомно телепортирует куда-то. Использует крайне редко. Потому что он телепортирует рандомно. Он может оказаться внутри стены и сдохнуть, он может оказаться воздухе и просто умереть, он может оказаться под глубиной воды и просто захлебнуться и умереть под давлением». Перезарядка — 5 часов. Именно этой подвеской в сцене 491161 он телепортирует чёрный ящик.</p>\n<p><strong>Перчатка, предназначенная для стрельбы.</strong> Носится на правой руке. «Способен призывать серебряный лук, который стреляет стрелами созданный из оам ( лук сам создаёт стрелы из оам)».</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0379-S05", "PS-0379--svyazi-s-drugimi"], "h": "<p><strong>Насла.</strong> Его организация. Состоит только из обычных людей, без сл и ис. В неё «также вступила и секта что считает сл демонами вылезший из ада». Цель организации — «уничтожить всех сл или подчинить их под строгие правила»; сам Зана эту идеологию не разделяет.</p>\n<p><strong>Старик.</strong> Главная зафиксированная сцена (id 491161) — предательство старика в момент, когда чёрный ящик оказался у того в руках. Зана бьёт его в бок клинком, поднимает выпавший ящик и телепортирует его подвеской. Реплики: «эй старичок узнаешь», «узнал! Ты ведь и знаешь что он может», «нет~ — специально растянул он. И чёрный ящик исчез». Старик до этого считал его союзником: «Ведь он союзник он доказал что не предаст нас, а значит чёрный ящик в безопасности». В переписке не сказано, тот ли это старик, что обладатель гравитации (<a href=\"PS-0369.html\">Старик (обладатель гравитации)</a>).</p>\n<p><strong>Загик.</strong> «Некоторая время сотрудничал с загик в гонке за чёрным ящиком» — и предал в решающий момент (id 491163). Что такое «загик», в переписке не раскрыто.</p>\n<p><strong>Нора и ассоциация.</strong> «Он так делал и с другими организацими, по типу Нора. Или ассоциации если те вдруг начали доверять ему. Ему нравилось видить эмоции».</p>\n<p><strong>Деби.</strong> В сцене предательства (id 491161): «Вдруг чей то зверинный крик и на месте где стоял Зана образовалось красная молния, что начила всё крушить. Это была Деби. Но уже поздно его здесь не было».</p>\n<p><strong>Всул.</strong> Один из трёх, кого Зана не предаст. В концовке того же вечера (id 491165) короткая сцена после предательства: «— всул видил их морды. Ха-ха — говорит зан валяешь на полу. Всул же летал рядом и обеспокоена смотрел на него. — ты бы видел как лицо того старика скорчилась. Этот сухарь думающий что всегда сможет держать голову холодной». Из текста следует только, что Всул летает; кто он и что он — не сказано.</p>\n<p><strong>Бэм.</strong> «У него союз с Бэмом. Реальный. Он не сообщем дурак. Он готов к верному сотруднечеству зная что это в будущем принесёт больше эмоции и даст ему ресурс для его преставления». Условия: «Бэм спонсирует его, а он веселит его преставоениеми и устраняет тех на кого покажет Бэм».</p>\n<p><strong>Изб (<a href=\"PS-0370.html\">Изб</a>).</strong> Прямой связи в сценах нет, но падение Изб — предмет его оценки: «Кстати ему не понравилось падения изб, он посчитал что слишком рано и что слишком быстро подослали злодей не дав насладиться эмоциями Изб» (id 491162).</p>\n<p><strong>Чёрный ящик.</strong> Предмет гонки, в которой Зана участвовал через сотрудничество с загик. Что это такое и почему опасно, если им «кто-то завладевет», в разобранном куске не объяснено — сказано только, что старик знал, «На что способен артефакт», имея в виду подвеску Заны.</p>", "r": [["Старик (обладатель гравитации)", "PS-0369.html"], ["Изб", "PS-0370.html"]]}, {"t": "Как менялся", "a": ["S06", "PS-0379-S06", "PS-0379--kak-menyalsya"], "h": "<p>Материал не переписывался: он выложен сплошным блоком 2026-06-17 за час с небольшим и разбит по темам, а не по версиям.</p>\n<p><strong>2026-06-17, id 491161.</strong> Первое появление — сценой от первого лица со стороны старика: предательство, удар волнистым кинжалом в бок, отобранный и телепортированный чёрный ящик, смех в лицо.</p>\n<p><strong>2026-06-17, id 491162.</strong> Раскрыт как глава Насла; разведены идеология организации и его личный мотив; дана оценка падения Изб.</p>\n<p><strong>2026-06-17, id 491163.</strong> Схема его предательств (сотрудничество ради чёрного ящика и удар в спину в решающий момент — с загик, с Нора, с ассоциацией), оговорка, что он не худший злодей, список из четырёх артефактов.</p>\n<p><strong>2026-06-17, id 491164.</strong> «Вампир что питается эмоциями»; внешность; происхождение из семьи аферистов.</p>\n<p><strong>2026-06-17, id 491165.</strong> Костюм и быт, два телефона, союз с Бэмом и его условия, три вещи, которые он не предаст, сцена с Всулом.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0379-S07", "PS-0379--chto-s-nim-stalo"], "h": "<p>Последнее по времени состояние — сразу после успешного предательства старика: чёрный ящик телепортирован в случайное место, сам Зана на полу смеётся, рядом Всул. Что было дальше и чем кончилась гонка за чёрным ящиком — в переписке не сказано.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0379-S08", "PS-0379--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вселенная в окне ни разу не названа.</li>\n<li>Возраст не назван. В сцене он «мальчишка» с «задорным голосом», в разборе — подтянутый блондин; цифры нет.</li>\n<li>Не сказано, тот ли это старик, что <a href=\"PS-0369.html\">Старик (обладатель гравитации)</a> (обладатель гравитации).</li>\n<li>Кто такой Всул — не объяснено; из текста известно только, что он летает и беспокоится за Зану.</li>\n<li>«Загик» упомянут только как организация, с которой было сотрудничество; ни состав, ни природа не названы.</li>\n<li>Чёрный ящик не описан: не сказано, что он делает и почему за ним гонка.</li>\n<li>Насла: численность, структура, кто ещё входит, кроме секты — не названо.</li>\n<li>Не сказано, откуда у Заны, сироты без денег, взялись четыре артефакта.</li>\n<li>Не описано, как выглядит и чем занимается Бэм в этом союзе, кроме спонсирования и указаний на цели.</li>\n<li>Падение Изб, которое он оценивает, в переписке не расписано.</li>\n</ul></div>", "r": [["Старик (обладатель гравитации)", "PS-0369.html"]]}, {"t": "Связи — всё вместе", "a": ["PS-0379--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0369.html\">Старик (обладатель гравитации)</a>, <a href=\"PS-0370.html\">Изб</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0370.html\">Изб</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0379--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-06-17</td>\n<td>491161–491161</td>\n<td>w0122</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-17</td>\n<td>491162–491162</td>\n<td>w0122</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-17</td>\n<td>491163–491164</td>\n<td>w0122</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-17</td>\n<td>491165–491165</td>\n<td>w0122</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0379-zana.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0379--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0379.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
