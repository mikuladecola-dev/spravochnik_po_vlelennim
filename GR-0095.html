<script>const BASE="";const DOCNAME="Организация, ковавшая героев (из истории нового гг)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0095-S01", "GR-0095--chto-eto"], "h": "<p>Организация, которая покупает детей у родителей и растит из них героев. Появляется в биографии нового главного героя (<a href=\"PS-0027.html\">Новый главный герой</a>) — Слава изложил эту биографию одним длинным сообщением (2024-01-18, id 92316), и всё, что известно об организации, содержится в этом сообщении.</p>\n<p>Собственного имени у организации нет: в переписке она названа только словом «организация» — «продал[и] в организацию где его воспитывали как героя» и «он решил уничтожить организацию» (92316). Как объединение заведена только потому, что прямо названа организацией; ни устройства, ни численности, ни того, кто ею руководит, в переписке нет.</p>\n<p>Способ приобретения воспитанников назван прямо: «обычный мальчик который собственный родитель продали в организацию». То есть детей организация получает по сделке с родителями.</p>\n<p>Методы воспитания перечислены Славой списком в скобках, дословно: «сразу нет с ним там не сусукались его избивали , тренировали сутками напролет за каждую ошибку строго наказывали и промывали мозги». К этому добавляется то, что происходит с воспитанником уже после выпуска и что тоже исходит от организации: «его посылали в самую жопу где он чуть не полыхал терял команду», «ему не давали передышку и даже спать он мог неделями не спать».</p>\n<p>Результат воспитания сформулирован так: «так он вырос и наконец-то вышел на сцену ( то бишь в мир ) там он сам себя убедил что быть героем хорошо». Убеждение в правильности геройства приписано не организации напрямую, а самому герою — «он сам себя убедил».</p>\n<p>Важен для устройства организации один пункт из конца биографии: воспитанник у неё не один. «И вот он узнал что его не одного воспитывали по той методики и он решил уничтожить организацию» (92316). Это единственное указание на масштаб: воспитанников много, методика применяется не к одному человеку. Ни числа их, ни имён, ни того, откуда герой это узнал, в переписке нет.</p>", "r": [["Новый главный герой", "PS-0027.html"]]}, {"t": "Состав", "a": ["S02", "GR-0095-S02", "GR-0095--sostav"], "h": "<ul>\n<li><a href=\"PS-0027.html\">Новый главный герой</a> — новый главный герой. Единственный названный человек, связанный с организацией: продан ей родителями ребёнком, выращен как герой, впоследствии решил её уничтожить.</li>\n</ul>\n<p>Других участников — ни воспитателей, ни руководителей, ни прочих воспитанников — в переписке не названо. О прочих воспитанниках известно только, что они есть («его не одного воспитывали по той методики»).</p>", "r": [["Новый главный герой", "PS-0027.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0095-S03", "GR-0095--obschie-sposobnosti-gruppy"], "h": "<p>Что умеют воспитанники организации, в переписке не сказано. Про самого героя названы не способности, а последствия воспитания: он выдерживает работу без передышки и может «неделями не спать»; у него остались травмы — «ну у него до сих пор есть травмы». Никаких сил, умений или свойств, общих для всех прошедших методику, не описано.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S04", "GR-0095-S04", "GR-0095--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>Команды, которыми командовал герой.</strong> Организация «посылала [его] в самую жопу», и там он «терял команду». К моменту пресс-конференции счёт потерям идёт так: журналисты «пытаются его обвинить в гибели уже 10 команды» (92316). Ни одна из этих команд не названа и никак не описана — их состав, принадлежность и отношение к организации в переписке отсутствуют; отдельными группами они не заводятся.</p>\n<p><strong>Журналисты.</strong> Выступают на пресс-конференции и предъявляют герою обвинение в гибели десятой команды. Мотив им приписан прямо: «ведь журналистом нужна сенсация» (92316). Как объединение журналисты не описаны, к организации их отношение не названо. С этой пресс-конференции начинается срыв: «гг со от недосыпа и непонимания почему с ним так и от накопившего стресса срывается и устраивает резну после уходя в закат». Кого именно герой убил во время резни и была ли она направлена против организации, в переписке не сказано.</p>\n<p><strong>Женщина, говорившая о свободе.</strong> Отдельный человек, не группа. «Он встречается с человеком который говорит быть свободным но после он её убил так как она заразилась чем-то или типо того» (92316). Связана ли она с организацией, в переписке не сказано; чем именно она заразилась — тоже: формулировка Славы «чем-то или типо того» осталась неуточнённой.</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S05", "GR-0095-S05", "GR-0095--kak-menyalas"], "h": "<p><strong>2024-01-18 (id 92316).</strong> Первое и единственное изложение. Одним сообщением Слава даёт всю биографию героя: продажа родителями в организацию, побои, тренировки сутками, наказания за ошибки, промывка мозгов, выход «на сцену ( то бишь в мир )», отправка в тяжелейшие точки, потеря команд, лишение сна, встреча с женщиной, говорившей о свободе, и её убийство, пресс-конференция с обвинением в гибели десятой команды, срыв и резня, уход. Затем вторая половина жизни героя: высокомерие («он стал высокомерным ( так как считает людей лицемерами из за прошлого)»), «чсв», стремление нарушить все правила — «ведь раньше ему все запрещали», спасение людей под отговорки «типо меня просто раздражала или из-за этого могло что-то произойти». Финальный пункт — узнав, что воспитывали не его одного, «он решил уничтожить организацию». Дальнейших правок биографии в переписке нет.</p>\n<p><strong>2024-01-18, 16:34–16:37 (id 92337–92338).</strong> Уточнена подача, а не содержание. Миколай спрашивает: «в самой работе (произведении) он уже взрослый и просто потом покажешь его прошлое вкратце или будет проходить этап взросления?». Слава отвечает одним словом: «Флэшбек». Это значит, что организация в произведении показывается не по ходу действия, а в прошлом героя, которое даётся флэшбеком; сам герой в произведении с самого начала взрослый.</p>\n<p><strong>Оценка Миколая (id 92337).</strong> Персонаж, по его словам, «хорошо проработан», «интересный, но чуток заурядный», при этом менять его он не предлагает: «однако пусть такой и останется, все норм, так и должно быть». Никаких вариантов переделки предложено и, соответственно, забраковано не было.</p>\n<p><strong>Место в проекте.</strong> Герой и его история относятся к комиксу Славы (<a href=\"IS-0009.html\">Комикс Славы</a>). 30 января 2024 (id 101911–101936) выясняется, что главных персонажей в истории шесть; Миколай сначала предложил «трех слить в первой главе» или «вообще в другую вселенную потом вставить», но, поняв, что речь о собственной истории Славы, отказался от предложения: «6 норм». К организации это обсуждение напрямую не относится — ни один из шести персонажей с ней не связан в переписке, кроме <a href=\"PS-0027.html\">Новый главный герой</a>.</p>", "r": [["Новый главный герой", "PS-0027.html"], ["Комикс Славы", "IS-0009.html"]]}, {"t": "Пробелы", "a": ["S06", "GR-0095-S06", "GR-0095--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Названия у организации нет. Она фигурирует только как «организация»; собственное имя не прозвучало.</li>\n<li>Поимённого состава нет. Кроме <a href=\"PS-0027.html\">Новый главный герой</a>, ни одного участника — ни воспитателя, ни начальника, ни другого воспитанника — не названо.</li>\n<li>Иерархия не описана: кто отдаёт приказы, кто ведёт тренировки, кто заключает сделки с родителями — в переписке не сказано.</li>\n<li>Не сказано, чего организация добивается: зачем ей герои, кому она их поставляет, кто «посылал» героя в тяжёлые точки — она сама или кто-то ещё.</li>\n<li>Численность воспитанников не названа. Известно только, что герой «не один».</li>\n<li>Не сказано, как герой узнал, что воспитывали не его одного.</li>\n<li>Не сказано, чем закончилось намерение уничтожить организацию: названо только решение — «он решил уничтожить организацию».</li>\n<li>Команды, которые герой терял (счёт идёт до десятой), не названы и не описаны; неясно, входили ли они в организацию.</li>\n<li>Связь женщины, говорившей о свободе, с организацией не названа. Чем она заразилась, осталось нерешённым: «заразилась чем-то или типо того».</li>\n<li>Против кого была направлена резня после пресс-конференции, не сказано.</li>\n<li>Вселенная в этом окне прямо не названа; отнесение к «Падениям небес» — по дате объявления. Также осталось неясным, тот ли это герой, для которого позже (2024-01-30) искали мир с поглощением энергии, и как он связан с прежним гг из предыдущего окна.</li>\n</ul></div>\n<div class=\"mnote\"><b>⚙ машинная заметка · С чего начать — не материал авторов</b>\n<p>Вопрос, который статья сама вынесла в пробелы — тот ли это герой, для которого 30 января искали мир с поглощением энергии, — решается сведением трёх записей базы, без чтения архива: <code>PS-0027</code> (8 025), <code>MR-0004</code> «Мир с поглощением энергии» (12 427) и <code>SP-0046</code> «Поглощение энергии и связь» (4 922). Все три — 30 января 2024, то же окно, тот же разговор; материал просто разъехался по трём карточкам.</p></div>", "r": [["Новый главный герой", "PS-0027.html"]]}, {"t": "Связи — всё вместе", "a": ["GR-0095--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0027.html\">Новый главный герой</a></li>\n<li><strong>Упоминает истории:</strong> <a href=\"IS-0009.html\">Комикс Славы</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0095--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0095.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0095-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0095/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Наружу у этой статьи дыр нет: оба соседа со статьями и с материалом — <code>PS-0027</code> (статья 9 750, база 8 025) и <code>IS-0009</code> (9 080 / 7 731). Чинить здесь надо не соседа, а саму запись: <code>GR-0095</code> — ноль входящих ссылок при статье 13 246. Причина названа в первом же абзаце — у организации нет имени. Пока её зовут словом «организация», на неё нечем сослаться из чужого текста, и она остаётся описанием внутри биографии одного персонажа, а не сущностью, на которую что-то опирается.</p>\n<p>Если чинить по числам в пределах «Падений небес», то дороже всего сейчас две записи, к этой статье прямо не относящиеся: <code>ID-0025</code> «Атлант» — статьи нет, база 2 181, две ссылки; и <code>SL-0008</code> «Проект разборов аниме» — статьи нет, база 28 853 при одной ссылке. Второе — самая крупная бесстатейная запись этой вселенной: 28 килобайт материала, который никуда не подключён.</p>\n<h3>С чего начать</h3>\n<p>В архив идти незачем: всё в базе и всё в одном окне. И 92316, и 101911–101936 лежат в w0023 (2024-01-09 — 2024-02-02, id 84317–103353); других вхождений 92316 в архиве нет — повторного захода к биографии не было ни разу.</p>\n<p>Вопрос, который статья сама вынесла в пробелы — тот ли это герой, для которого 30 января искали мир с поглощением энергии, — решается сведением трёх записей базы, без чтения архива: <code>PS-0027</code> (8 025), <code>MR-0004</code> «Мир с поглощением энергии» (12 427) и <code>SP-0046</code> «Поглощение энергии и связь» (4 922). Все три — 30 января 2024, то же окно, тот же разговор; материал просто разъехался по трём карточкам.</p>\n<p>Туда же <code>IS-0009</code> (7 731): там перечень шести главных персонажей комикса. Проверять надо, не совпадает ли кто-то из шести с теми, кого «воспитывали по той методики» — это единственный шанс закрыть численность воспитанников, не выдумывая её.</p>\n<h3>Как развивалось</h3>\n<p>Выложили целиком — 2024-01-18, id 92316: одним сообщением вся биография, от продажи родителями до решения уничтожить организацию.</p>\n<p>Уточнили подачу — в тот же день, 16:34–16:37, id 92337–92338. Миколай спрашивает не про содержание, а про порядок показа; ответ в одно слово — «Флэшбек». Там же оценка и там же отказ от правок: «пусть такой и останется».</p>\n<p>Не тронули — 30 января, id 101911–101936. Разговор о шести главных персонажах комикса, предложение слить троих, отказ от предложения. Организация в этом разговоре не всплывает.</p>\n<p>Не вернулись. За всё время в биографию не внесено ни одной правки; единственное изменение касается не того, что произошло, а того, в каком месте произведения это показывают.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Авторство результата. Про одно убеждение сказано прямо, чьё оно: «он сам себя убедил что быть героем хорошо». Для остального, что вышло из той же методики — травмы, неделями без сна, высокомерие, «считает людей лицемерами из за прошлого», — такого же указания нет: это описано как последствия, но не сказано, вложено оно или он к нему пришёл сам. При этом в списке методов организации стоит «промывали мозги». Для одного пункта граница между вложенным и своим проведена вручную, для соседних того же рода — не проговорена.</p>\n<h3>Отклик</h3>\n<p>Сильнее всего тут не сюжет, а то, как он записан. «Наконец-то вышел на сцену ( то бишь в мир )» — человек пишет метафору, слышит, что она читается двусмысленно, и тут же поправляется в скобках; и поправка выходит точнее самого текста, потому что мир для этого героя и есть сцена, и дальше он именно на ней и сорвётся, перед журналистами. То же со скобкой про высокомерие: «( так как считает людей лицемерами из за прошлого)» — причина приписана прямо к черте, как будто автор боится, что иначе черта повиснет.</p>\n<p>Зацепило и «она заразилась чем-то или типо того». Это единственное место, где рассказчик вслух признаёт, что не придумал: убийство уже есть, оправдание уже нужно, а чем именно она заразилась — ещё нет. Обычно такие места замазывают, а тут оно осталось стоять как есть, и вся биография от этого честнее. И реакция на другой стороне под стать: «интересный, но чуток заурядный, однако пусть такой и останется, все норм» — редкий случай, когда рецензент договаривает вслух и сам себя останавливает.</p></div>", "r": []}];</script>
