<script>const BASE="";const DOCNAME="Препараты Нимба";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0221-S01", "SP-0221--mehanika"], "h": "<p>Препараты — продукт организации Нимб; в базе способность стоит как часть Нимба. Цепочка производства описана Славой коротко и в два захода.</p>\n<p>Первый заход (2025-04-08, id 317479–317484): «Че они просто исследует объекты и иногда исследование дают результаты и они создают препараты». То есть исследуются пойманные (или иным образом полученные) объекты, результат получается не всегда — «иногда исследование дают результаты», — и уже из результата делается препарат.</p>\n<p>Второй заход — про сырьё. На вопрос Миколая, что в данном случае исследование, Слава отвечает «Медуза» (id 317486). Миколай возражает: «это наблюдение и анализ» (id 317487). Слава уточняет: «Нет крови» (id 317488) и следом — «Биологический жидкости» (id 317490). На вопрос «почему именно жидкости а не строение» (id 317495) ответ: «именно для препаратов» (id 317496).</p>\n<p>Итого сырьё — биологические жидкости и кровь объектов, не строение тела.</p>\n<p>Мотив производства назван прямо и отдельно: «Для получение денег» (id 317497). Развёрнуто — «Им не хватает денег налогоплательщиков» (id 317503). Формальный статус организации при этом двойной: «Хотя формально они правительства организация, но на деле они свободная организация» (id 317249).</p>\n<p><strong>Что препараты делают.</strong> В первой версии (id 317244–317247):</p>\n<ul>\n<li>«Известно своими качественными товарами и услугами»;</li>\n<li>«Способны излечить даже рак»;</li>\n<li>«Или отрастить конечность»;</li>\n<li>«Что бы полечиться в нимбе к нам ездять даже иностранцы».</li>\n</ul>\n<p>Лечебным дело не ограничивается. На вопрос «лекарственных?» — ответ «Не только» (id 317498, 317500).</p>\n<p><strong>Армейская линия.</strong> Контракт с армией назван уже в первой версии: «И у них также контракт с армии» (id 317248). Во второй версии сказано, как он возник и на что: «У них есть контракт с армии после того как их ней препараты начали показываться хороший результаты» (id 317505), и — «Контракт на создания препаратов который могут усилить (типо супер солдат)» (id 317507).</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S02", "SP-0221-S02", "SP-0221--nositeli"], "h": "<p>Препараты — не личная способность, а изделие. Стороны, названные в переписке:</p>\n<ul>\n<li><strong>Нимб</strong> — организация, которая исследует объекты и производит препараты;</li>\n<li><strong>Медуза</strong> — названа Славой в ответ на вопрос, что именно является объектом исследования;</li>\n<li><strong>иностранцы</strong> — приезжают лечиться;</li>\n<li><strong>армия</strong> — заказчик усиливающих препаратов по контракту.</li>\n</ul>\n<p>В поле «связано с» базы указаны Медуза, Нимб и Черныши. В приведённых кусках переписки Черныши не упоминаются.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S03", "SP-0221-S03", "SP-0221--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-04-08, дневная (окно w0087, id 317244–317249).</strong> Задан эффект и репутация: качественные товары и услуги, лечение рака, отращивание конечностей, медицинский туризм иностранцев, контракт с армией, формально государственная — фактически свободная организация. Откуда препараты берутся, здесь не сказано.</p>\n<p><strong>Версия 2 — 2025-04-08, вечерняя (окно w0087, id 317479–317507).</strong> Достроена механика: исследование объектов → результат → препарат; сырьё — биологические жидкости и кровь, а не строение; мотив — деньги, потому что налогоплательщиков не хватает; армейский контракт уточнён как контракт именно на усиление, на супер-солдат, и как следствие хороших результатов препаратов.</p>\n<p>Первая версия второй не отменяется: лечебное действие и медицинский туризм остаются, к ним добавляется не лекарственная линия.</p>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S04", "SP-0221-S04", "SP-0221--otklonennye-varianty"], "h": "<ul>\n<li><strong>Аналогия со змеиным ядом.</strong> Миколай: «типа как йод получают из яда змей?» (id 317480). Слава сначала не принял ход вопроса: «К чему ты это. Я даже не придумал откуда они берутся?» (id 317481). Миколай пояснил, зачем спрашивал: «к тому что можно придумать существ опираясь на удивительные свойства крови» (id 317483) — то есть предложил конструировать существ от свойств их крови, а не наоборот. Прямого согласия или отказа на это предложение в переписке нет.</li>\n<li><strong>Строение вместо жидкостей.</strong> Миколай: «почему именно жидкости а не строение» (id 317495). Вариант со строением не выбран, оставлены жидкости.</li>\n<li><strong>Убийственные препараты.</strong> Миколай перебирает: «убийственных?», «усиливающих?» (id 317501, 317502). Усиливающие подтверждаются контрактом с армией. Про убийственные ответа не последовало — ни подтверждения, ни отказа.</li>\n<li><strong>Исследование как наблюдение и анализ.</strong> Миколай на «Медуза» отвечает «это наблюдение и анализ» (id 317487), то есть возражает против такого понимания слова «исследование». Слава переводит разговор на кровь и биологические жидкости; спор прямо не закрыт.</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S05", "SP-0221-S05", "SP-0221--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Откуда берутся сами объекты, Славой на тот момент не придумано — сказано прямо: «Я даже не придумал откуда они берутся?» (id 317481). К чему относится «они» — к препаратам или к объектам, — из реплики не однозначно.</li>\n<li>Состав препаратов не назван.</li>\n<li>Не сказано, есть ли у препаратов цена, побочные эффекты или ограничения — ни для лечебных, ни для усиливающих.</li>\n<li>Не сказано, как именно получают жидкости у объектов и что при этом с объектами происходит.</li>\n<li>Не сказано, что за препараты помимо лечебных и усиливающих входят в «не только».</li>\n<li>Связь с другими способностями вселенной не проводится.</li>\n<li>Реплика Миколая «кто гг» (id 317506) осталась без ответа — линия главного героя здесь не открыта.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0221--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0009.html\">Организация Нимб (НБО)</a>, <a href=\"GR-0076.html\">Черныши</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0221--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-04-08</td>\n<td>317244–317249</td>\n<td>w0087</td>\n<td>Нимб (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-04-08</td>\n<td>317479–317507</td>\n<td>w0087</td>\n<td>Нимб (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0221-preparaty-nimba.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0221--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0221.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
