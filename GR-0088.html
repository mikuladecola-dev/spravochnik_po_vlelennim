<script>const BASE="";const DOCNAME="Сильнейший отряд (отряд Командира)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0088-S01", "GR-0088--chto-eto"], "h": "<p>Боевой отряд вселенной «Цветной мир», названный в переписке только описательно — «в той вселенной командир сильнейшего отряда» (2024-05-25, id 173147). Собственного имени соединению не давали.</p>\n<p>Как самостоятельная группа отряд не разрабатывался: он существует в переписке исключительно как факт биографии одного персонажа — Командира (<a href=\"PS-0077.html\">Командир</a>). К моменту разговора отряд уже распался: «После развала команды построил приют для детей в отшибе от людей и жил там поживал» (173147), «Так он и так живёт отшельником после распада отряда» (173239). Весь разговор идёт про самого Командира и про то, какую ему дать способность; отряд в нём — прошлое, к которому не возвращаются.</p>\n<p>Не путать с «Отрядом сильнейших» вселенных «Апостол» (<a href=\"GR-0015.html\">Отряд сильнейших</a>) и «игра бога» (<a href=\"GR-0048.html\">Отряд сильнейших (команда «А»)</a>) — другая вселенная и другой разговор.</p>", "r": [["Отряд сильнейших", "GR-0015.html"], ["Отряд сильнейших (команда «А»)", "GR-0048.html"], ["Командир", "PS-0077.html"]]}, {"t": "Состав", "a": ["S02", "GR-0088-S02", "GR-0088--sostav"], "h": "<ul>\n<li><a href=\"PS-0077.html\">Командир</a> — Командир, глава отряда.</li>\n</ul>\n<p>Больше никого поимённо не названо. Числа бойцов в переписке нет, состав не назван.</p>\n<p>Отдельно: в том же разговоре Слава перечисляет тройку «удачных экземпляров» эксперимента по превращению бесцветного в цветного — «Это командир, волк, Тен( многоликий)» (173165). Это перечисление относится к эксперименту, а не к отряду; принадлежность Волка и Тена к отряду в переписке не сказана.</p>", "r": [["Командир", "PS-0077.html"]]}, {"t": "Иерархия", "a": ["S03", "GR-0088-S03", "GR-0088--ierarhiya"], "h": "<p>Единственная названная позиция — командир, её занимает Командир (<a href=\"PS-0077.html\">Командир</a>). Никакой другой структуры, званий или подразделений в переписке нет.</p>\n<p>Косвенно про силу главы отряда сказано следующее: «И он в теорий сильнейший» (173147), «Имитатор слабей командира» (173231) — при том, что до этого Миколай назвал Имитатора «одним из сильнейших существ в той вселенной» (173225). На вопрос, человек ли Командир, Слава отвечает «Человек», «Там все люди», «Пока что» (173227–173230). Как это соотносится с остальным отрядом, не обсуждалось.</p>", "r": [["Командир", "PS-0077.html"]]}, {"t": "Как менялась — по датам", "a": ["S04", "GR-0088-S04", "GR-0088--kak-menyalas"], "h": "<p>Весь материал — один день, 2024-05-25, окно w0035.</p>\n<p><strong>2024-05-25, id 173147–173148.</strong> Первое и основное упоминание. Отряд назван как «сильнейший», Командир — как его командир; отряд уже распался, после развала команды Командир построил приют для детей на отшибе от людей. Тут же сказано, что Командир — «первый удачный эксперимент для превращение бесцветного в цветной» (173148). Дальше разговор уходит в поиск способности Командира и к отряду не возвращается.</p>\n<p><strong>2024-05-25, id 173175.</strong> К биографии добавлено: «ко крастоки этот командир остановил войну между людьми и со сверхлюдми». Участвовал ли в этом отряд и было ли это до распада или после — не сказано.</p>\n<p><strong>2024-05-25, id 173239–173242.</strong> При подведении итогов Слава повторяет исходное: «Так он и так живёт отшельником после распада отряда», и перечисляет, что есть по персонажу: «Он плод эксперимента, любит детей раз построил приют, он сильнейший, он значит лишь добро и справедливость», «И он свободен» (173241–173242). Отряд здесь фигурирует только как то, что распалось.</p>\n<p><strong>2024-05-25, id 173324–173326.</strong> Уточнена роль Командира в сюжете: на вопрос «Он гг?» — «Нет», «Он будет редко появляться». Отряд, соответственно, остаётся фоном биографии редко появляющегося персонажа.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "GR-0088-S05", "GR-0088--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет — назван только сам Командир.</li>\n<li>Численность отряда не названа.</li>\n<li>Причина распада не обсуждалась, дата распада тоже.</li>\n<li>Не сказано, чем отряд занимался, против кого воевал и был ли он частью какой-то более крупной структуры.</li>\n<li>Не сказано, участвовал ли отряд в остановке войны между людьми и сверхлюдьми — эта заслуга приписана лично Командиру (173175).</li>\n<li>Общих способностей участников отряда в переписке нет вообще; способность даже самого Командира к концу окна так и не выбрана — весь блок 173147–173271 это её поиск, и заканчивается он словами Миколая «Тогда, мои полномочия всё. Сейчас точно ничего не скажу дельного. Лучше взять паузу тогда» (173271). Осталось нерешённым.</li>\n<li>Отличий участников друг от друга нет — сравнивать не с кем.</li>\n<li>Отношений с другими группами не описано.</li>\n<li>Не сказано, состоял ли отряд из людей, из цветных, из результатов эксперимента или из смеси.</li>\n<li>Судьба остальных бойцов после распада не упоминается.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0088--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0077.html\">Командир</a></li>\n<li><strong>Упоминает группы:</strong> <a href=\"GR-0015.html\">Отряд сильнейших</a>, <a href=\"GR-0048.html\">Отряд сильнейших (команда «А»)</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0088--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0088.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0088-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0088/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Сама группа по числам пустая: входящих ссылок ноль, собственной базы ноль — статья целиком собрана из чужих записей. Поэтому чинить надо не её, а то, на чём она стоит.</p>\n<p>Первым — <code>ID-0062</code>, «Деконструкция образа командира»: статьи нет, 4,4 КБ базы, одна входящая ссылка (<code>VS-0012</code>). Главный нерешённый узел этой статьи — способность Командира, поиск которой обрывается на «мои полномочия всё» (173271). Но разговор после 173271 не кончился: в <code>ID-0062</code> лежат 173272–173291, где Миколай объясняет, почему образ казался плоским («Я на слове командор зациклился»), и где всплывает возраст — выглядит на 30, на деле 56. Без статьи об этой записи пробел выглядит тупиком, хотя это единственное место, где авторы к образу вернулись.</p>\n<p>Второе — <code>ID-0063</code>, «Гнуть вселенную под способность»: статьи нет, 2,4 КБ, одна ссылка. Приём произнесён прямо посреди поиска способности (173176), между ценой эксперимента и «он будет означать добро реальной добро». То есть на вопрос «какую дать способность» в переписке есть метод ответа, и он нигде не выложен.</p>\n<p>Третье — не запись, а её отсутствие: сущности «сверхлюди» в «Цветном мире» нет вообще ни одной строки, при том что война людей и сверхлюдей названа здесь (173175), в <code>GR-0090</code>, <code>PS-0077</code> и <code>PS-0085</code>. Дыра без адреса: ссылаться не на что, потому что записи не существует.</p>\n<p>Для порядка: самая дорогая по числам дыра вселенной — <code>SL-0013</code> («Список персонажей Славы», 10 КБ, четыре ссылки, статьи нет), но ни отряда, ни Командира в том списке нет; к этой статье он не ведёт.</p>\n<h3>С чего начать</h3>\n<p>В базе весь материал по отряду — это <code>PS-0077</code> (16 КБ, версии 1–5, 173145–173327) и <code>PS-0085</code> (8,6 КБ, 173183–173216). Больше нигде слово «отряд» применительно к этой вселенной не звучит: в окне w0035 оно встречается ровно дважды — 173147 и 173239.</p>\n<p>Значит, архив, и идти в него надо влево от 25 мая: отряд подан как уже распавшийся и заранее известный, то есть придуман раньше окна. Ближайший ориентир — 2024-05-07, окно w0032, id 166880: «просто кидать сильных персонажей в один отряд глупо тем более если их ний силы друг другу не подходят». Это единственная реплика Славы о том, как он вообще собирает отряды, и лежит она сейчас в <code>PS-0383</code>. Дальше влево — w0030 (2024-04-05/07), где он выкладывает персонажей.</p>\n<p>Вправо смотреть почти нечего: после 2024-05-25 вселенная не обсуждается до 2024-07-31, когда её откладывают (<code>VS-0012</code>, id 213577). Упоминание «канала по цветному миру» 2024-05-30 (id 174233) — ложный след, ответ «Нет», канал не по нему.</p>\n<p>Отдельно про ловушку поиска по словам. Формула «отряд распался» встречается и 2024-07-04 (w0042, id 196162): «у них был отряд бессмер, провидец и ещё КаВО нибудь / Но после войны отряд распался / А так сейчас у него есть помощник». Это Имитатор в островной линии — мотив тот же, вселенная другая. Там же, id 196142–196145, звучит «бесцветная», и это тоже не отсюда: имя персонажа в «отряде белых».</p>\n<h3>Как развивалось</h3>\n<p>Заявили сразу в прошедшем времени. 14:09, 173147 — отряд появляется уже распавшимся, одной строкой, и в той же реплике интерес переводится на способность главы. Ограничили в ту же минуту: всё, что дальше, — про Командира лично. 14:20, 173175 — к биографии добавлена остановленная война, и заслуга приписана человеку, отряд не упомянут. 14:50, 173239 — при подведении итогов Слава повторяет исходную формулу дословно: «Так он и так живёт отшельником после распада отряда»; за сорок минут разговора об отряде не прибавилось ни слова. 15:06 — поиск способности закрыт паузой. 15:24 — зафиксировано, что персонаж не главный герой и будет появляться редко. Не возвращались: ни 2024-09-24, ни 2026-06-09, когда список персонажей вселенной перечитывали заново.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Приют. Через тринадцать минут после Командира Слава рассказывает его двойника из другой вселенной (<code>PS-0085</code>, 173188) и там мотив назван прямым текстом: «И кстати приют он построил ко крастоки из за чувство вины». Там же названа и постоянная роль — «он был гарантом между сверхлюдми и людьми», то есть посредничество не разовое, а работа. У Командира то же действие стоит вовсе без причины — «После развала команды построил приют для детей в отшибе от людей и жил там поживал», — а посредничество сжато в один поступок: остановил войну. Для соседнего персонажа того же покроя правило «почему сильнейший строит приют и чем он занят между подвигами» проговорено. Для исходного — нет.</p>\n<h3>Отклик</h3>\n<p>Зацепила интонация 173147. Человек рассказывает про сильнейшего бойца распавшегося отряда и вдруг сваливается в сказочную формулу: «построил приют для детей в отшибе от людей и жил там поживал». Жил-поживал. В одной строке — и боевое прошлое, и то, что оно кончилось, и то, что рассказчику интереснее вторая половина. Отряд тут не забыт по недосмотру, он отработан: он нужен ровно затем, чтобы было от чего уйти.</p>\n<p>Второе — 173271. «Тогда, мои полномочия всё. Сейчас точно ничего не скажу дельного. Лучше взять паузу тогда. Хотел по ходу дела чет придумать, но мысли не те идут». Час перебора способностей, всё отвергнуто, и вместо того чтобы дожать что попало, человек честно объявляет, что кончился. А через минуту возвращается с деконструкцией — и там выясняется, что мешало слово «командор», которого в тексте вообще не было. Редко видно так отчётливо, как чужая оговорка в собственной голове полтора часа держала персонажа плоским.</p></div>", "r": []}];</script>
