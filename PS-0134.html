<script>const BASE="";const DOCNAME="Беркут";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0134-S01", "PS-0134--proishozhdenie"], "h": "<p>Беркут — монстр вселенной «монстры», материализовавшийся из желания шестилетнего мальчика Кирилла. Введён Миколаем целиком, одним куском истории (2024-08-10, id 217234–217240): «если что пишу новую», «прям сейчас придумываю».</p>\n<p>Исходно Беркут — легендарный игровой персонаж мобильной «шутер мобы (MOBA)», который выпал Кириллу из ящика: «его радости не было предела, как только ему выпал из ящика долгожданный и любимый легендарный персонаж \"Беркут\"». Кирилл «прочёл весь фандом той игры и очень влюбился в Беркута, знает все его особенности наизусть».</p>\n<p>Позже (2024-08-11, id 217692–217693) Миколай назвал прообраз прямо: «кстати, Кирилл играл в альтернативную для своей вселенной версию бравл старса, а беркут это пародия на ворона». То есть игра — альтернативная для вселенной Кирилла версия Brawl Stars, а сам Беркут — пародия на Ворона из этой игры.</p>\n<p>Второй слой происхождения — увлечения самого Кирилла. Он фанат субкультуры териан, и его «смущает, что нету не одного териана орнитотропа, как минимум летающего». Кирилл относил себя к терианам и «считал себя птицей» (2024-08-11, id 217729–217732). Он хотел летать: «Он хочет летать, познать всё величие этой вечно лазурной пелены небесной характерной для его региона», и в парке каждый раз при виде самолёта кричал «самолёт».</p>\n<p>Механика появления описана так: «конечно такое сильное желание встретиться с ним не могло не материализовывать это существо». Материализованный Беркут — не копия игрового персонажа, а синтез: «так как мальчик не только в игре изучал его, синтез его видения в реальной жизни отличался, этот монстр был характерными для териана чертами, но настоящими крыльями и головой, даже точный видовой киль имеется».</p>\n<p>Дальше образ укреплялся слухами. Сначала Кирилл распространял их «в своей подгруппе на занятиях», «мол видел он его, хотя очевидно это ложь». Из подгруппы слух разнесли дальше: «его облик на мгновение уже могли видеть психически маленькие носители информации и своей уверенностью и широким распространением создавали более сильный и чёткий образ монстра, естественно добавляя ему негативных коннотаций». При этом «пока его все боялись, поэтому никто не связывался с иным миром через него», а Кирилл «был единственный, кто не боится его и хочет встретить».</p>\n<p>Отдельно зафиксировано, как монстра придумывал автор (2024-08-11, id 217763–217777). Миколай выбирал «чет из интересов и увлечений детей нашего времени» и «ваще в ступоре был», собирался «либо на улице подойти и узнать или тебе писать», «но потом как-то сам пришёл». Слава в этот момент предложил «Бравл Старс».</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0134-S02", "PS-0134--vneshnost"], "h": "<p>В самой истории (2024-08-10) внешность монстра не описана — на это указал Слава (2024-08-11, id 217695): «Я думаю все как выглядит беркут ведь ты в свой истории его даже не описал». Слава до проверки в интернете представлял его иначе: «Я изначально думал что это бегемот с крыльями».</p>\n<p>Что есть по тексту истории: у монстра «характерные для териана черты, но настоящие крылья и головой, даже точный видовой киль имеется». Крылья огромные — при появлении на перилах он «так элегантно свернув свои огромные крылья».</p>\n<p>Уточнение от 2024-08-11 (id 217737): «и поэтому беркут был частично похож на человека, который с оперением на голове». Уточнение выведено из того, что Кирилл относил себя к терианам и считал себя птицей.</p>\n<p>Внешний прообраз назван в том же разговоре (2024-08-11, id 217700–217703). Миколай: «ты видел у нас в городе большую статую птицы?» — «это он». Речь о большой статуе птицы в городе авторов. (Слава сначала не расслышал: «Стаю», «Я подумал стаю».)</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0134-S03", "PS-0134--harakter"], "h": "<p>Игровой характер персонажа автором не раскрыт: «но их объединяет то что он из одной игры, а игровой характер я не раскрыл» (2024-08-11, id 217810).</p>\n<p>Характер материализации задан желаниями Кирилла: «это существо переняла его желания, в частности любов к нему». Мотив — научить летать. С Кириллом Беркут ведёт себя дружелюбно: зовёт с собой, обещает, что тот не разобьётся, если будет держаться крепко, и что научит его искусству полёта; во время полёта отвечает на вопросы — «он задаёт миллионы вопросов и получает ответы».</p>\n<p>Говорит Беркут голосом игрового персонажа: «и вдруг эта птичка голосом персонажа начинает звать его с собой, летать».</p>\n<p>После гибели Кирилла характер меняется полностью: «а вот этот монстр остался и конечно все приписывали ему ответственность за случившееся, ещё больше боялись, нет человека дарующего хоть малейшей позитивной коннотации его существования, вот тогда он стал чистым злом». Дальше — «ему надо же реализовать свою суть, поэтому он в любых условиях старался воспроизводить тот сценарий с теми кто его видит, пусть уже насильно, ему мало было полетать».</p>\n<p>Отдельно сформулировано общее правило, приложенное к нему (2024-08-11, id 217868): «одно убийство делает дух злым».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0134-S04", "PS-0134--sposobnosti"], "h": "<p><strong>Полёт.</strong> Обязательное свойство именно этой материализации: «в нашем случае он не может не летать» (2024-08-10, id 217239; повторено 2024-08-11, id 217802).</p>\n<p><strong>Увод души.</strong> Основной сценарий: Беркут даёт ребёнку крылья и уводит его душу в полёт, тело при этом остаётся. Кирилл коснулся его руки, «почувствовал её, посмотрел назад и увидел на свое спине крылья», встал на перила и полетел — «не просто вниз, он возвышается, он держится за руку Беркута и не падает, тот учит его летать». Пока душа летает, «его физическая оболочка в бардовой субстанции и окружённая преисполнеными ужасом родителями потерявших почти самое святое что у них есть, отправляется в реанимацию». Возврат невозможен, потому что душа не знает о случившемся: «на там понятно его уже не вернуть, ведь его душа даже не подозревает, что его больше не увидят родные, а значит не сможет вовремя вернуться в тело».</p>\n<p>Это опирается на общее правило вселенной, изложенное в начале истории: «дети и животные могут видеть мистических существ, а до 4 лет психического возраста их душа способна взаимодействовать с иным миром напрямую, поэтому если недоглядеть за ними их за руку могут увести монстры в мир иной и с вами останется лишь их физическая оболочка».</p>\n<p><strong>Насильное сбрасывание.</strong> После превращения в чистое зло он воспроизводит тот же сценарий насильно. К моменту схватки эта способность у него уже почти пропала: «то что он насильно может скинуть людей, ну сейчас он даже ребенка бы не скинул» (2024-08-11, id 217867).</p>\n<p><strong>Сила от веры.</strong> Сила Беркута — производная от веры в него: «сила веры и количество верующих определяет силу монстра» (2024-08-11, id 217841). В него «верил весь город и кто-то из интернета» (id 217843); после случая «о нем знал весь интернет».</p>\n<p>Ограничения, названные в том же разговоре (2024-08-11, id 217852–217862): «монстров вера не сразу поражает», «не всегда даже при негативных мыслях они взаимодействуют с миром», «они могут и не родиться от веры», «они могут умереть даже если в них верят», «могут заново родиться». И: «у монстра есть один родитель», «чем больше других людей разделяют веру в него тем могущественнее он становится».</p>\n<p>Вера при этом не защищает от смерти: «ну так она определяет силу его материализации не более», «если ты взаимодействуешь с этой материализацией, ты можешь её убить» (2024-08-11, id 217917–217918).</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0134-S05", "PS-0134--svyazi-s-drugimi"], "h": "<p><strong>Кирилл</strong> — «родитель» монстра. Мальчик шести лет, «почти 4 психических», «довольно спокойный и умный ребёнок». Семья: «в семье нашего главного героя всё под контролем, не было ещё такого, чтобы родители ругали ребёнка, а он разочаровывал их своим поведением», из-за чего «мама и папа почти не беспокоится за него и у них есть приличное количество времени на работу и личные дела». Он квадробер (2024-08-11, id 217746) — на уточняющий вопрос Миколай объяснил: «это терианы которые не всегда себя так ведут», «это типо спорт». Логика его согласия на полёт (2024-08-11, id 217739–217762): «он не имеет крыльев», «и не мог даже с земли взлететь», «он искал способ полететь», «он не видел примера где кто-то так делал», «ни одной птицы квадробера нет», «поэтому он в основном изучал их, чтобы потом практиковаться», «и тут удачная возможность — появился пример, появились крылья, хули не попробовать».</p>\n<p><strong>Паша (Пашка)</strong> — друг Кирилла по парте, с которым тот играл в MOBA по сети. После смерти Кирилла «захотел избавиться от него, отомстить за товарища и остальных. он нашёл открытый балкон и пришёл туда и украденным оружием отца и солью. как только увидел это существо начал обороняться. но его мощь доминировала». Чья именно мощь доминировала, в тексте однозначно не сказано.</p>\n<p><strong>Защитник</strong> — тот, кто убил Беркута. Судьба монстра дописывается в другой истории, в окне w0051, — «в истории С \"Я защитник\"». Про схватку сказано (2024-08-11, id 217863–217866): «защитник не слабак», «а вот монстр к тому моменту порядком ослабел», «защитник его смог убить ибо как минимум он его может коснуться», «а об оружии его не говорилось».</p>\n<p><strong>Захар Авгур</strong> — писатель, автор книги «Память забытому», претендент на Пулитцеровскую премию. В его тексте (2024-08-20, id 220649) Беркут появляется как чужая байка: «в общем, он помешан на всяких мистических существах и я как-то ему рассказал известную байку о неком монстре, вроде Беркут звать. с ним была какая-то тёмная история связана».</p>\n<p><strong>Спасатель</strong> — знакомый Захара, «уличный парень», «темный злой силуэт в капюшоне», «помешан на всяких мистических существах». Услышав байку, «он пошёл весь в ярости и с улыбкой до ушей в тот город где обитает это существо». Позже утверждает, «что изгнал этого монстра. спас детей того города и будущее теперь под его защитой». Захар в это не верит: «да если бы он реально был героем, то о его подвигах знали бы все».</p>\n<p><strong>Другие Беркуты.</strong> Этот Беркут не единственный: «понятное дело он не первый и не единственный, кто о Беркуте думает, так что это не уникальная материализация, точнее субъективное представление разное у всех, но так это не единственный в своём роде \"Беркут\" из той же игры, того же авторства». Их «по миру много», «они абсолютно разные», объединяет их только то, «что он из одной игры».</p>\n<p><strong>Автор игры</strong> — создатель исходного персонажа, в отличие от Кирилла как «родителя» материализации. Различение проговорено в машинной вставке (2024-08-12, id 218503): «автор игры — оригинальный создатель Беркута, а Кирилл — \"родитель\" его материализованной версии в рамках этой конкретной истории».</p>\n<p><strong>«Знающие»</strong> — дети, разносившие слух. По машинной вставке (2024-08-12, id 218501–218502), друзья Кирилла и их друзья «родителями» не становятся: «Они способствуют усилению материализации, но не являются её источником», «\"Родитель\" определяет базовые характеристики монстра. \"Знающие\" влияют на силу материализации и могут вносить поверхностные изменения». Оговорка там же: если кто-то из детей создаст «совершенно новый, уникальный образ монстра, основанный на их собственном воображении и желаниях, то они могут стать \"родителем\" для этого нового существа».</p>", "r": []}, {"t": "Как менялся", "a": ["S06", "PS-0134-S06", "PS-0134--kak-menyalsya"], "h": "<p><strong>2024-08-10, id 217234–217240 (окно w0050).</strong> Персонаж введён целиком внутри истории: происхождение из игры и фандома, синтез с чертами териана, манера, механика увода души, превращение в чистое зло, попытка Пашки, финал через три года: «прошло 3 года и ничего не изменилось, правда теперь дети видят вместо лазурного неба кисло-пурпурное..». Внешность в тексте не описана.</p>\n<p><strong>2024-08-11, id 217692–217710 (окно w0051).</strong> Раскрыт замысел: игра — альтернативная версия Brawl Stars, Беркут — пародия на Ворона. Внешний прообраз — большая статуя птицы в городе авторов. Миколай о собственном тексте: «ну я тож написал по тупому», «мог иначе».</p>\n<p><strong>2024-08-11, id 217729–217762 (окно w0051).</strong> Облик уточнён: «частично похож на человека, который с оперением на голове». Разъяснена логика Кирилла-квадробера: не было крыльев и примера — «появился пример, появились крылья».</p>\n<p><strong>2024-08-11, id 217763–217777 (окно w0051).</strong> Зафиксирован процесс придумывания и отклонённые варианты (см. ниже).</p>\n<p><strong>2024-08-11, id 217799–217815 (окно w0051).</strong> Установлено, что Беркутов много и они разные; что этот конкретный не воскреснет; что он не может не летать; что игровой характер не раскрыт.</p>\n<p><strong>2024-08-11, id 217841–217868 (окно w0051).</strong> Введена и приложена к нему механика веры: сила от числа верующих, один родитель, ослабление к моменту схватки, «одно убийство делает дух злым».</p>\n<p><strong>2024-08-11, id 217911–217923 (окно w0051).</strong> Объяснено, почему монстр пережил Кирилла: «так не один Кирилл в него верит, родители в плане тот кто определяет его характер», «его внешность и суть». Вера определяет только силу материализации, а материализацию можно убить.</p>\n<p><strong>2024-08-12, id 218496–218505 (окно w0052).</strong> Повторное проговаривание «родительства» Кирилла. В этом окне имя Беркут встречается только внутри машинных разборов, вставленных в чат (id 218500–218503); авторская часть разговора идёт про Кирилла и его друзей. Про количество монстров в мире здесь сказано иначе, чем 2024-08-11: «по сути в мире их приличное количество», «но они не разнообразные» (id 218497–218498) — при том, что накануне было «они абсолютно разные».</p>\n<p><strong>2024-08-20, id 220649–220650 (окно w0054).</strong> Беркут появляется извне — как «известная байка» в рассказе Захара Авгура, с городом обитания, «какой-то тёмной историей» и изгнанием, о котором заявляет спасатель.</p>\n<h3>Отклонённые варианты</h3>\n<ul>\n<li><strong>Скибиди туалет и сигма</strong> как основа монстра (2024-08-11, id 217771–217772): «я хотел скибиди туалет или сигму, но для балкона первый не подходит, второе долбоебизм». Тут же оговорка Миколая: «ну хотя лан, можно чет и с этим придумать».</li>\n<li><strong>Регулярное возвращение и повторные убийства.</strong> Слава предложил (2024-08-11, id 217808): «Ну давай так он появится через 3 месяца защитник о нем узнает и снова убьет поняв что эту тварь надо убивать каждый 3 месяца». Отклонено ранее сказанным: «нет, этого беркута больше не будет», «он порождение желаний Кирилла». Вместо этого Миколай предложил свой вариант (id 217815): «он увидет другого беркута и подумает что тот всё ещё жив и убьёт его, а это был мирный дух».</li>\n<li><strong>Особая игра как источник монстров.</strong> Слава (2024-08-11, id 217814): «Играя может быть особенный, что бы типо с только с ней могли появляться монстры». Развития в переписке не получило.</li>\n</ul>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0134-S07", "PS-0134--chto-s-nim-stalo"], "h": "<p>Кирилл после полётов вернулся домой, где никого не было, ходил на занятия, где все плакали и молчали, «на занятиях он слышал краем уха какую-то недавнюю жуткую ситуацию, но больше пытался добиться внимания скучных лиц в кабинете». Затем «от этой ерунды он ушел гулять с Беркутом и как только получил ответы на все вопросы его душа ушла на небеса, Кирилл всё понял, да уже поздно было».</p>\n<p>Монстр остался и стал чистым злом, воспроизводя сценарий насильно. Ответ города: «тогда на балконы массово стали ставить ограждения от детей, но не все могли это позволить».</p>\n<p>Попытка Пашки с украденным у отца оружием и солью закончилась тем, что «его мощь доминировала».</p>\n<p>К моменту схватки с Защитником Беркут ослабел не от исчезновения веры, а от исчезновения ужаса: «о нем знали мб помнили, но он уже не вызывал ужаса, почти на всех балконах защита, родители детей не подпускают детей к балконам». Защитник смог его коснуться и убил.</p>\n<p>Воскрешение исключено: «нет, этого беркута больше не будет», «он порождение желаний Кирилла». Возрождение было бы возможно только при живом родителе: «и если бы Кирилл был жив была бы возможность возродится». Дополнительно высказано предположение (2024-08-11, id 217922–217923): «возможно при смерти этой материальной сущности после смерти родителя, умирают и воспоминания у людей об этой сущности», «ну и вера бывает разная».</p>\n<p>Итог истории через три года: «прошло 3 года и ничего не изменилось, правда теперь дети видят вместо лазурного неба кисло-пурпурное..».</p>\n<p>Отдельно, в тексте Захара Авгура (2024-08-20) о судьбе Беркута говорит спасатель: он «изгнал этого монстра», «спас детей того города и будущее теперь под его защитой». Как это соотносится с убийством Защитником, в переписке не сказано.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0134-S08", "PS-0134--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Внешность в самой истории не описана; уточнения («частично похож на человека с оперением на голове», статуя птицы в городе авторов) даны только в переписке, в текст истории не внесены.</li>\n<li>Игровой характер персонажа не раскрыт: «а игровой характер я не раскрыл».</li>\n<li>«Тёмная история», связанная с Беркутом в байке Захара (2024-08-20, окно w0054), не раскрыта.</li>\n<li>Судьба Беркута дописывается не в исходной истории, а в w0051, в истории «Я защитник».</li>\n<li>Оружие Защитника не названо: «а об оружии его не говорилось».</li>\n<li>Чем закончилась схватка Пашки с монстром для самого Пашки, не сказано; фраза «но его мощь доминировала» не уточняет, о чьей мощи речь.</li>\n<li>Соотношение «изгнания» спасателем (w0054) и убийства Защитником (w0051) в переписке не установлено.</li>\n<li>Количество и разнообразие других Беркутов описаны противоречиво: 2024-08-11 — «они абсолютно разные», 2024-08-12 — «но они не разнообразные». Противоречие в переписке не обсуждалось.</li>\n<li>Название игры внутри вселенной не дано — только указание, что это «альтернативная для своей вселенной версия бравл старса».</li>\n<li>Название города, где обитает монстр, не дано.</li>\n<li>Реплика «родители в плане тот кто определяет его характер» (id 217913) — про роль «родителя» монстра, а не про родителей Кирилла; в переписке это отдельно не прояснялось.</li>\n<li>Вставки id 218500–218503 — машинные разборы, скопированные в чат, а не формулировки авторов; авторская часть того разговора идёт про Кирилла и его друзей.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0134--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0046.html\">Терианы (квадроберы)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0134--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-10</td>\n<td>217234–217240</td>\n<td>w0050</td>\n<td>монстры (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-08-11</td>\n<td>217692–217710</td>\n<td>w0051</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-08-11</td>\n<td>217729–217762</td>\n<td>w0051</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-08-11</td>\n<td>217763–217777</td>\n<td>w0051</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-08-11</td>\n<td>217799–217815</td>\n<td>w0051</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-08-11</td>\n<td>217841–217868</td>\n<td>w0051</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-08-11</td>\n<td>217911–217923</td>\n<td>w0051</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-08-12</td>\n<td>218496–218505</td>\n<td>w0052</td>\n<td>монстры (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2024-08-20</td>\n<td>220649–220650</td>\n<td>w0054</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0134-berkut.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0134--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0134.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0134-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0134/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Внешняя дыра здесь — не отсутствие статьи, а непроставленная связь между двумя уже существующими. «Спасатель» из рассказа Захара Авгура описан в этой статье по id 220649 — и тот же самый id 220649 фигурирует в статье о персонаже <code>PS-0144</code> («спасатель», вселенная «монстры», 39178 знаков статьи, 51054 в базе): там прямым текстом «он изгнал этого монстра... беркута... спас детей того города». Это один и тот же человек, но <code>PS-0134</code> на <code>PS-0144</code> не ссылается, и наоборот. Из-за этого читатель, дошедший до вопроса «а правда ли спасатель кого-то спас», не узнаёт, что ответ (пусть частичный — сам Захар этому не верит) уже расписан в соседней статье.</p>\n<h3>С чего начать</h3>\n<p>Не архив — база. Сначала <code>PS-0144</code>, разделы «Происхождение» и «Как менялся» (окна w0053–w0055, 2024-08-17 — 2024-08-29): там задача происхождения имени, внешности и мотивов «спасателя» решена подробнее, чем в одной фразе здесь. Отдельно: оружие Защитника и точные обстоятельства убийства Беркута («об оружии его не говорилось») стоит поискать в базе <code>IS-0017</code> («Защитник») — там 139029 знаков материала против 52780, вошедших в саму статью; разница может содержать нужную деталь, прежде чем лезть в архив переписки.</p>\n<h3>Как развивалось</h3>\n<p>10 августа — заявлен целиком, одним куском, вместе с уже готовым финалом («прошло 3 года и ничего не изменилось»). 11 августа — тут же ограничен: назван прообраз (пародия на Ворона из альтернативного Brawl Stars), введены рамки силы («сила веры... не более»), проговорены пределы способностей и явно отклонены два боковых варианта развития. 12 августа — почти пропадает: имя встречается только в машинных вставках, авторский разговор идёт о другом, и в тот же день характеристика монстров тихо меняется («абсолютно разные» превращается в «не разнообразные») без обсуждения. 20 августа — возвращается, но не как персонаж авторов, а как чужая легенда внутри текста другого их персонажа, с версией финала, которая рассказчику этой версии (Захару) самому не кажется правдой.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для этого конкретного Беркута правило «одно убийство делает дух злым» названо прямо и привязано к событию. Для «других Беркутов» — той же игры, того же авторства, но с другими «родителями», которые в статье упомянуты как существующие «по миру» — не сказано, действует ли на них то же правило превращения в зло после смерти родителя или причастности к убийству. Правило сформулировано один раз, для одного экземпляра — а не как свойство класса существ, которым эти Беркуты вроде бы являются.</p>\n<h3>Отклик</h3>\n<p>Зацепила механика с двойным слоем прообраза — не просто «монстр из игры», а синтез игрового персонажа с террианскими фантазиями конкретного мальчика, вплоть до того, что внешний вид взят с реальной городской статуи. Это работает точнее, чем обычная материализация страха: тут материализуется не ужас, а любовь и желание летать, и только потом, после смерти ребёнка, оно прокисает в злость. Финальная деталь про «кисло-пурпурное» небо вместо лазурного — единственное место, где текст сам, без объяснений, показывает, что что-то в мире необратимо испортилось.</p></div>", "r": []}];</script>
