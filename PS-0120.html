<script>const BASE="";const DOCNAME="Первый придуманный ГГ";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0120-S01", "PS-0120--proishozhdenie"], "h": "<p>Самый первый главный герой, придуманный соавторами. В переписке появляется 2024-07-10 (окно w0047, сообщения 202758–202787, вселенная «7 островов» по дате объявления) не как новая разработка, а через пересланные старые сообщения — то есть как отсылка к уже существующему материалу.</p>\n<p>Повод — разговор о лукизме. Миколай пояснил задним числом: «ну мы обсуждали лукизм, а я говорил о персонаже похожем на гг оттуда, но немного другом, ты подумал я о каком то персонаже из аниме а это наш первый придуманный гг» (202784). Там же признал промах в формулировке: «ты ошибся» (202785), «я не уточнил» (202786), «как то так» (202787).</p>\n<p>Отдельно оговорено, что персонаж свой, а не заимствованный из аниме, — на переспрос «Че за аниме» ответ был «Мы только-что придумали» (202771–202772, оба в пересланном куске).</p>", "r": []}, {"t": "Характер", "a": ["S02", "PS-0120-S02", "PS-0120--harakter"], "h": "<p>Отдельно не описан. Из старого куска зафиксирована только цель.</p>", "r": []}, {"t": "Цель", "a": ["S03", "PS-0120-S03", "PS-0120--cel"], "h": "<p>Дана в пересланных сообщениях вопросом и ответом:</p>\n<div class=\"q\"><p>«И какая цель будет у гг ?» (202761–202762)<br>«Стать Хокаге» (202763)</p></div>\n<p>Больше о персонаже в этом окне ничего не сказано.</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0120-S04", "PS-0120--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Хронология наших идей</strong> — единственная связь, названная в исходнике. Персонаж проходит по ней как первая точка: первый придуманный главный герой.</li>\n<li>Персонаж, обсуждавшийся в разговоре о лукизме, — «похожий на гг оттуда, но немного другой» (202784). Кто это и чем именно отличается, не сказано.</li>\n</ul>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S05", "PS-0120-S05", "PS-0120--kak-menyalsya"], "h": "<p><strong>2024-07-10, окно w0047, id 202758–202787</strong> (помечено как повтор прежней мысли). Единственное состояние в переписке. Персонаж не разрабатывается, а вспоминается: приведена его цель и уточнён его статус — свой, первый, не из аниме.</p>\n<p>Более ранних сообщений, где персонажа придумывали, в базе под этим id нет — есть только пересланный фрагмент внутри окна w0047.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0120-S06", "PS-0120--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имени у персонажа нет.</li>\n<li>Вселенная, к которой он относился, не названа.</li>\n<li>Внешность, способности, окружение не описаны.</li>\n<li>Что значит «Хокаге» в их собственной вселенной и переносилось ли это понятие как есть — не оговорено.</li>\n<li>Не сказано, чем «немного другой» персонаж из разговора о лукизме отличается от этого гг.</li>\n<li>Дата первоначальной выдумки в окне не указана.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0120--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0120--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-10</td>\n<td>202758–202787</td>\n<td>w0047</td>\n<td>7 островов (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0120-pervyy-pridumannyy-gg.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0120--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0120.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
