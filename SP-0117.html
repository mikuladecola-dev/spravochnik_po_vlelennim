<script>const BASE="";const DOCNAME="слово «пожалуйста»";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0117-S01", "SP-0117--mehanika"], "h": "<p>Механика истории про Крима: произнесённое слово «пожалуйста» заставляет окружающих отдать всё, что просят.</p>\n<p>При этом на разобранном этапе (2024-09-18, id 232680–232700, окно w0058) слово объявлено не магическим. На прямой вопрос «Оно реально там волшебной ?» ответ: «сейчас оно не волшебное, просто ебанутые взрослые решили подыграть», «а он поверил», «и как тебе не нравится», «вера порадила монстра».</p>\n<p>То есть эффект на этом этапе держится не на магии, а на связке из трёх звеньев: взрослые подыгрывают → герой верит → вера порождает «монстра». Что это за монстр, автор раскрывать отказался: на вопрос «Какого монстра от слова пожалуйста» — «увидишь».</p>\n<p>Отдельно зафиксировано место слова в истории. Слово названо главным элементом — важнее самого главного героя: «а вообще пока самое главное в истории даже не гг», «а слово \"пожалуйста\"», — но с двумя оговорками: «и то только сейчас» и «но опять-таки это не главный элемент всего сюжета».</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0117-S02", "SP-0117--ogranicheniya-i-cena"], "h": "<p>Главное ограничение на этом этапе — слово работает не само по себе. Оно действует ровно постольку, поскольку взрослые вокруг решили подыграть. Цена не названа; названо только следствие — «вера порадила монстра».</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0117-S03", "SP-0117--nositeli"], "h": "<p>Крим — герой истории, который верит в волшебное слово и им пользуется. Способность привязана к истории про Крима и волшебное слово «пожалуйста».</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0117-S04", "SP-0117--kak-menyalas-po-versiyam"], "h": "<p>Версия 1 — 2024-09-18 (id 232680–232700, окно w0058). Единственное зафиксированное состояние: слово объявлено НЕ магическим на данном этапе, эффект объяснён подыгрыванием взрослых и верой героя, «монстр» от веры обещан к раскрытию позже. Формулировки «и то только сейчас», «пока самое главное» прямо помечают это состояние как временное, но следующего состояния в переписке нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "SP-0117-S05", "SP-0117--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Что за «монстр», порождённый верой, — не раскрыто, автор отвечает «увидишь».</li>\n<li>Станет ли слово волшебным по-настоящему дальше — не сказано; сказано только, что «сейчас оно не волшебное».</li>\n<li>Кто именно из взрослых подыгрывает и почему — не названо.</li>\n<li>Вопрос «Взрослые 16 лет человек уже взрослый?» прямого ответа не получил; ближайшая по порядку реплика — «ну дети тоже ебанутые хули», но к какому из двух заданных вопросов она относится, из переписки не следует.</li>\n<li>Что будет, если кто-то откажется подыгрывать, — не проговорено.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0117--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0117--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-09-18</td>\n<td>232680–232700</td>\n<td>w0058</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0117-slovo-pozhaluysta.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0117--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0117.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
