<script>const BASE="";const DOCNAME="Мир без солнца";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0110-S01", "MR-0110--ustroystvo"], "h": "<p>Мир без солнца — сеттинг рассказа Славы от первого лица (2025-02-24, id 293226–293229, окно w0076). До катастрофы это обычный современный мир: города, высотные здания, полиция, музеи, магазины, «дядя Стёпа» и «оборотни в погонах» как расхожие присказки.</p>\n<p><strong>Катастрофа.</strong> Начинается летним днём, «светила солнце и было жарко, но терпима». Сначала становится нестерпимо светло: «внезапно не стало так светло, что и слепое бы удивился бы». Затем солнце разрушается: «видел тоже я, как солнце разрушается на тысячи, нет, миллард сотен своих кусков. И всё уж эти, осколки солнца направились на нашу землю». Осколки падают на города — на родной город рассказчика их летят «сотний».</p>\n<p><strong>После.</strong> Наступает вечная тьма. Солнца больше нет и, по словам рассказчика, не будет: «хотел бы я сейчас сказать уж к 'свету', но света больше не была и вряд ли будет». Светят только луна и звёзды. Из-за отсутствия солнца холодно — это отдельно названо как практическая причина искать одежду: «Да и холодно, ведь солнце нет».</p>\n<p><strong>Состояние городов.</strong> Разрушение неполное и неровное. Часть зданий обвалилась в обломки (полицейский участок, здание, под которым очнулся герой), но многие постройки целы: магазин с продуктами, магазин туристического снаряжения, старый музей (сгорел уже в ходе действия). Товар на месте — крупы, мука, лапша, консервы, фрукты, овощи, шоколад, вода, сухофрукты, специи, соль, сахар; в туристическом — фонарик, верёвка, лопата, рюкзак, палатки, газовая плита, сухпайки. Мародёрства нет, потому что мародёрствовать некому.</p>\n<p>Между зданиями — пыль и следы: «Везде была лишь пыль да пару пятен крови».</p>\n<p><strong>Тишина и пустота.</strong> Отдельная черта мира — отсутствие любого живого звука и любого движения: «И снова тихо, словно я один, словно нету здесь ни животных, ни людей, ни перагов. И так страшнее было».</p>\n<p><strong>Неумираемость.</strong> В этом мире герой не может умереть. Он перечисляет попытки: «я шёл и резал вены, я шел и падал с высоты, я шел и вешался, я шел и пытался жечь себя, и после каждой той попытке я не умирал, но становился куда страшнее Перагов». Выстрел из автомата в челюсть тоже не убивает: «Но нет я не умер в том лесу. Я жив, очнулся в том же доме». Причина в переписке не названа; сам герой объясняет это по-своему: «потому что я единственный на свете, остался разумным».</p>\n<p><strong>Другое небо.</strong> В конце герой доходит до места, где небо меняется: «Луна стала светлее. И звезды новый появились и лес не тот в котором был я». Там же оказывается человек. Что это за место — отдельная область того же мира, другой мир или что-то ещё — в переписке не сказано.</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0110-S02", "MR-0110--naselenie"], "h": "<p><strong>Людей нет.</strong> Это самая настойчивая черта мира. Герой ищет их больше месяца, ходит из города в город и не находит никого: «Да, да, да людей та нету вот прям исчезли, словно спрятались всё от меня, словно я чудовище. И в этом одиноком, черном мире я был один». Один раз ему кажется, что он слышит человеческий голос, — но в здании оказывается Пераг, и здание обрушивается.</p>\n<p><strong>Пераги.</strong> Название придумывает сам рассказчик по ходу текста, чтобы было чем называть: «Думаю не помешало бы, дать им название для ясности ума, давайте например \"пераг\"». Это бывшие люди, из тел которых лезут белые перья: «Это был, когда-то человек, хотя ручаться я не стану. И был он весь в крови, но даже в этом красном месиве, я видел чётко, перья белый как снег, не они ещё белее, белее чем душа младенца. И эти перья вылазили из недор тела, стремясь в наружу. Но больше всех, этих перье были в голове».</p>\n<p>Свойства Перагов, названные в тексте:</p>\n<ul>\n<li>Перья держат пули: «всё пули, который попадали в перья отскакивали, а если попал просто тело то они прошибали».</li>\n<li>Из руки может вырастать длинное перо-меч: «с руки его вылазить огромное и длинное перо, словно меч».</li>\n<li>Перья не горят: у сгоревшего Перага «всё горела, кроме перьев белых. И даже в красно-оранжевым огне, эти перье были белые».</li>\n<li>Убить их можно — придавленный обрушившимся музеем Пераг гибнет.</li>\n<li>Плоть Перага съедобна и не гниёт: «его плоть не гнила и была вкусна».</li>\n<li>Речь: герой утверждает, что Пераг говорил с ним на человеческом, и он с ним разговаривал, держа связанным. Позже он сам это отменяет: «они ведь не говорил со мной это всё в мой голове. Я псих, я сошёл с ума».</li>\n</ul>\n<p><strong>Упыри.</strong> Упомянуты как состояние, в которое герой боится скатиться: «становился упырем я. Но я не хотел вот так становится упырем безмозглым, жрущий Перагов». Существуют ли упыри в мире отдельно от него самого — из текста не следует. В том же куске сказано: «И это чудище пошло куда-то, как сотни чудовище и шло оно слыша крики чудище, нннееееттт это были не крики а голоса», то есть крики тут же переопределяются как голоса в голове.</p>\n<p><strong>Человек в финале.</strong> В месте с другой луной герой встречает «человека без перьев, человек с белыми светящимися глазами». Тот смотрит угрожающе, но подходит и обнимает. Кто он — не сказано.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0110-S03", "MR-0110--mesto-vo-vselennoy"], "h": "<p>Вселенная в окне не объявлена, названа только в следующем окне (отмечено в самой записи). Мир связан с сущностями Пераг и Рассказчик истории про Перагов.</p>\n<p>Место действия — Россия по косвенным признакам речи («дядю Степу», «оборотней в погонах», «героя из древней русских сказак», автомат, который герой не опознаёт: «может быть калаш, ксюша или что там ещё»). Город не назван; известно только, что герой прожил в нём 32 года: «Как никак уже как 32 года здесь живу».</p>\n<p>Как мир без солнца соотносится с прочими мирами вселенной «Апостол», в этом окне не проговорено.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0110-S04", "MR-0110--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-02-24, id 293226–293227 (10:04).</strong> Разрушение солнца, гибель города, пробуждение под обломками. Первая встреча с Перагом и придумывание им названия. Раскопки полицейского участка, автомат с трупа, три магазина по 30 патронов и один заряженный. Стрельба по Перагу и наблюдение, что перья держат пулю, а тело нет.</p>\n<p><strong>Версия 2 — 2025-02-24, id 293228–293229 (10:04).</strong> Продолжение того же текста, без переписывания предыдущего. Здесь добавляется устройство мира после катастрофы: холод из-за отсутствия солнца, целые магазины при разрушенных зданиях, полное отсутствие людей. Побег от Перага в горящий музей и обрушение здания на преследователя. Сборы (еда, одежда, оружие, палатка, рюкзак), уход из города, больше месяца скитаний. Обвал, погребение под плитой, людоедство, превращение во внешнее чудовище: «его лицо была лишь плоть без кожы и век и волос, можно была даже череп увидеть у него». Голоса, жизнь с привязанным Перагом, попытки самоубийства и невозможность умереть. Финал — смена неба: другая луна, новые звёзды, другой лес, человек со светящимися глазами.</p>\n<p>Правок и отката прежних состояний в записи нет: вторая версия дописывает первую.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0110-S05", "MR-0110--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Почему разрушилось солнце — не сказано. Ни причины, ни виновника.</li>\n<li>Куда делись люди — не объяснено. Тел, кроме отдельных трупов под обломками и «пары пятен крови», нет; герой констатирует исчезновение и не находит объяснения.</li>\n<li>Откуда берутся Пераги и как человек в них превращается — не сказано. Что перья означают и почему они белые — тоже.</li>\n<li>Говорят Пераги или нет — оставлено нерешённым внутри самого текста: сначала герой утверждает, что говорят, потом объявляет это галлюцинацией.</li>\n<li>Почему герой не может умереть — не сказано; его собственное объяснение («я единственный на свете, остался разумным») в тексте никем не подтверждено.</li>\n<li>Что за место с более светлой луной и другими звёздами, куда он дошёл, — не раскрыто.</li>\n<li>Кто такой человек с белыми светящимися глазами — не назван.</li>\n<li>Имя рассказчика и название города в тексте не звучат.</li>\n<li>Отдельно отмечено в записи: вселенная в окне w0076 не объявлена.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0110--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0022.html\">Пераги</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0110--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-02-24</td>\n<td>293226–293227</td>\n<td>w0076</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-02-24</td>\n<td>293228–293229</td>\n<td>w0076</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0110-mir-bez-solnca.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0110--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0110.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["MR-0110-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/MR-0110/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Здесь дорога не отсутствующая статья, а несведённость. Почти всё, что в статье помечено как непрояснённое, уже лежит в базе под своими записями со своими статьями: <code>MR-0123</code> «Раскол солнца» (18 КБ) — ровно про то, почему разрушилось солнце; <code>PS-0201</code> «Человек с белыми светящимися глазами» (8.6 КБ) — тот самый человек из финала; <code>PS-0231</code> «Упыри» (17.4 КБ) — упыри как отдельная сущность, а не только страх героя. При этом в связях <code>MR-0110</code> стоит одна группа <code>GR-0022</code>. Статья ссылается сама на себя же в других разрезах и не знает об этом.</p>\n<p>Из настоящих дыр самая дорогая — признак «белые светящиеся глаза». Записи о нём как о признаке нет: <code>SP-0264</code> «Белые глаза апостолов» — 2.3 КБ базы, статьи нет, вселенная не определена; <code>SP-0238</code> «Белые глаза» — 26 КБ базы, статьи нет, отнесено к другой вселенной. А признак связывает финального человека отсюда, мальчика из братской могилы и апостола-«плаксу» из <code>MR-0113</code>. Пока его никто не держит, три записи смотрят друг на друга и не соединяются.</p>\n<h3>С чего начать</h3>\n<p>В архив идти почти не нужно. Сшивать в базе: <code>MR-0123</code> (солнце), <code>PS-0199</code> Пераг (44 КБ), <code>SP-0183</code> перья (15.7 КБ), <code>SP-0184</code> перо-меч (8.3 КБ), <code>PS-0200</code> рассказчик (24.6 КБ), <code>SP-0185</code> бессмертие рассказчика (9 КБ), <code>PS-0231</code>, <code>SP-0207</code> живучесть упыря (15.8 КБ), <code>SP-0208</code> голод упыря (15.7 КБ), <code>PS-0232</code> упырь-рассказчик (35 КБ), <code>PS-0201</code>, <code>PS-0202</code> «Чужемирец (герой истории про сломанное солнце)» (5.5 КБ), <code>PS-0230</code> «Человек, на которого упало солнце», сам текст — <code>PR-0052</code> (22 КБ). Отдельно проверить, не один ли это герой: <code>PS-0200</code>, <code>PS-0202</code> и <code>PS-0232</code> описывают человека с очень похожей биографией.</p>\n<p>В архив — только за одним: вселенная в окне w0076 не объявлена. Смотреть первое окно после 2025-02-24, где название прозвучало, чтобы приписка перестала быть догадкой по дате.</p>\n<h3>Как развивалось</h3>\n<p>Одно окно, 2025-02-24, две записи в один и тот же час, вторая дописывает первую без переписывания. Возвратов нет. Зато отмена случилась внутри самого текста: сначала заявлено, что Пераг говорил с героем на человеческом и герой с ним разговаривал, потом это снято — «они ведь не говорил со мной это всё в мой голове». Заявили и отменили в пределах одной версии, третьей реплики не последовало.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Про Перагов сказано, откуда они берутся по факту (бывшие люди) и что их можно убить — придавленный музеем гибнет. Про самого героя, который по своим же словам «становился куда страшнее Перагов» и дошёл до лица без кожи и век, не сказано, отделён он от них или нет: правило превращения человека названо для всех остальных, для рассказчика того же вида — не проговорено.</p>\n<h3>Отклик</h3>\n<p>Магазины. Вот что тут сильное — не солнце и не перья, а то, что в разрушенном городе целы магазин с крупами и магазин туристического снаряжения, и мародёрствовать некому. Список товара идёт длинный, подробный, с сухофруктами и специями, и от этой хозяйственной обстоятельности пусто становится сильнее, чем от описаний тьмы. Плюс мир держится на одном ощущении — не на страхе, а на тишине: «словно нету здесь ни животных, ни людей, ни перагов. И так страшнее было». И то, как герой сам придумывает слово «пераг», просто чтобы было чем называть, — это честнее любой авторской терминологии, потому что видно, зачем название понадобилось. Финальное объятие человека со светящимися глазами после месяца одиночества я, признаться, не ожидал.</p></div>", "r": []}];</script>
