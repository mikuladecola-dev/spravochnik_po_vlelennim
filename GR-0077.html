<script>const BASE="";const DOCNAME="Компания Игоря (школьная группа с завода имени Попова)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0077-S01", "GR-0077--chto-eto"], "h": "<p>Компания подростков из одного класса, сложившаяся вокруг Игоря. Собственного имени у компании нет: в переписке она называется только нарицательно — «их группа», «наша группа», «группа молодых ребят». Игорь прямо назван «главарём их ней группы».</p>\n<p>Компания существует в истории окна w0085, написанной Славой одним заходом 2025-03-25 (сообщения 311072–311078, все с меткой 13:28). Это школьная компания старшеклассников (Миша, которого в неё затаскивают, «спокойной заканчивал десятый класс»), которая ночью ходит на заброшенный завод имени Попова. После этой вылазки на всех участников садится проклятие, и с этого момента компания действует уже как группа проклятых: собирается вместе, обсуждает симптомы и возвращается на завод.</p>\n<p>История обрывается на середине — на сообщении 311078, где группа заперта в подвале завода. Чем всё кончилось, в переписке не сказано.</p>\n<p>Записи в базе есть только у Игоря (<a href=\"PS-0240.html\">Игорь</a>). Остальные участники названы по именам внутри его текста, отдельных записей у них нет.</p>", "r": [["Игорь", "PS-0240.html"]]}, {"t": "Состав", "a": ["S02", "GR-0077-S02", "GR-0077--sostav"], "h": "<ul>\n<li><strong><a href=\"PS-0240.html\">Игорь</a> — Игорь.</strong> «Самый крутой парень в классе, который был лидером всего класса». Прямо назван главарём группы. «Хоть он не показывал себя со стороны хулиганым. Но его подколы и дружба с хулиганами. Не вызывала в Мише доверия к данному индивиду».</li>\n<li><strong>Ваня.</strong> «Главный озорник и генератор приколов». Рассказчик легенды о заводе. Записи в базе нет.</li>\n<li><strong>Костя.</strong> «Двухметровый парень, спортсмен, вполне серьёзные но любищие поржать с друзьями». Записи в базе нет.</li>\n<li><strong>Катя.</strong> «Миловидная Катя, которая являлась главной сплетни цой в школе». Записи в базе нет.</li>\n<li><strong>Миша.</strong> Не член группы. Игорь силком приводит его на вылазку, дальше Миша ходит с компанией, но сам себя к ней не относит: «понимал, что никаким боком сюда, как член группы не вписывается». Отдельной записи у этого Миши в базе нет; <a href=\"PS-0234.html\">Михаил</a> «Михаил» — лесоруб из другого окна и к этой компании отношения не имеет.</li>\n</ul>\n<p>Численность Игорь называет сам, когда зовёт Мишу: «с нами будут ещё трой». То есть основной состав — четверо (Игорь, Ваня, Костя, Катя), Миша — пятый, приведённый.</p>", "r": [["Игорь", "PS-0240.html"], ["Михаил", "PS-0234.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0077-S03", "GR-0077--obschie-sposobnosti-gruppy"], "h": "<p>Способностей в смысле умений у компании нет — это обычные школьники. Общее у всех участников появляется только после завода, и это проклятие.</p>\n<p><strong>Проклятие после завода.</strong> Через день после вылазки выясняется, что оно село на всех сразу. Формулировка Игоря: «похоже у нас у всех какой то проклятия стоит». У каждого проклятие проявляется по-своему (см. следующий раздел), но само наличие — общее.</p>\n<p><strong>Чудища сторонятся проклятых.</strong> На втором походе на завод — уже днём — группа проходит весь путь без помех, и объясняется это так: «Шли они стараясь не замечать, как тускнет солнце, как кто говорит, как тень направилась к ним. Как чудища живущий здесь. Сторонились их. Ведь проклятых нельзя им трогать. Тем более проклятый заряжен. Они поэтому смогли пройти тот путь спокойно». Что означает «проклятый заряжен» — в переписке не объяснено.</p>\n<p><strong>Продолжительность на момент обрыва</strong> — двое суток: Миша называет происходящее «этот двух дневный хаус и психоз».</p>", "r": []}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0077-S04", "GR-0077--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p>Отличаются в первую очередь тем, как у кого проявляется проклятие. Признания идут подряд, на берегу реки, после того как Костя вытащил Мишу из воды:</p>\n<ul>\n<li><strong>Катя:</strong> «я тоже начала странно себя чувствовать. Я как бы слышу шёпот после того дня».</li>\n<li><strong>Ваня:</strong> «я тоже. У меня тени не тени кажется».</li>\n<li><strong>Костя:</strong> «у меня просто отражение обманывает и стекло» — сказал, отведя взгляд.</li>\n<li><strong>Миша:</strong> у него самое тяжёлое проявление. Он видит в людях «худых тварей кричащих, что-то», слышит за спиной «не тот шаг обычного человека, а шаг мученика», а во дворе школы его накрывает полная тьма, в которой исчезают шумы, свет и зрение; в этой тьме он тонет, хотя на деле бежит и ныряет в реку.</li>\n<li><strong>Игорь:</strong> своё проявление он не назвал. «Не желая говорите своей недомогания. Ну никто и не допрашивался». То, что недомогание у него есть, из текста следует; какое именно — в переписке не сказано.</li>\n</ul>\n<p>Отличия по роли и характеру:</p>\n<ul>\n<li><strong>Игорь</strong> решает за всех и не даёт отказаться — и Мише в самом начале, и всей группе потом.</li>\n<li><strong>Ваня</strong> — рассказчик. Именно он берёт на себя легенду о заводе, подыгрывает мимикой («явно пытаясь пародировать кота из Шрека»), и он же пересказывает случай на реке, когда Костя не в состоянии говорить. Про его ораторство сказано: «закончил Ваня. Явно гордясь своими ораторскими способностями». При этом на завод он идти боялся: «Ну пошёл лишь по тому что была надежда».</li>\n<li><strong>Костя</strong> — физическая сила группы. Он ныряет за Мишей и вытаскивает его на берег, хотя Миша «начал брыкаться, царапаться, кусаться и на дно тянуться», и он же в подвале встаёт у прохода «словно дверь» и не выпускает Катю.</li>\n<li><strong>Катя</strong> — единственная, кто пытается выйти из происходящего: в подвале она пробует уйти, «кричали и истерила», но её не выпускают.</li>\n<li><strong>Миша</strong> — посторонний. Идёт в стороне от компании, слышит их хохот и ждёт подвоха; в строю его ставят в середину, и он отмечает, что именно поэтому не может повернуть назад: «Будь он в конце он бы убежал. Но в конце стоит огромный Костя».</li>\n</ul>", "r": []}, {"t": "Иерархия", "a": ["S05", "GR-0077-S05", "GR-0077--ierarhiya"], "h": "<p>Иерархия названа прямо: Игорь — «главарём их ней группы», и он же «был лидером всего класса».</p>\n<p>Как это выглядит на практике:</p>\n<ul>\n<li><strong>Решение за другого.</strong> Мишу он не приглашает, а ставит перед фактом: «ай-да с нами на заброшку ночью», а на отказ отвечает «ты чево. Не бойся, с нами будут ещё трой. Поэтому всё ок» и быстро уходит, «Не давая Мише, как либо отказаться». Когда Миша сбегает, Игорь приходит к нему домой и держит дверь так, чтобы её нельзя было закрыть.</li>\n<li><strong>Маршрут знает только он.</strong> Группа идёт час, прежде чем Миша спрашивает, куда; выясняется, что Игорь просто не сказал: «а я не говорил что-ли, куда мы идём?».</li>\n<li><strong>Решение за группу после проклятия.</strong> На вопрос Кати «и что нам делать?» Игорь отвечает «кажется только одно», Костя уточняет «идти на заброшку?», и Игорь закрывает вопрос: «тогда мы должны идти все. Сегодня пойдём же!» — «Не давая уже никому и шанса уйти».</li>\n<li><strong>Идёт первым.</strong> «Они шли чуть-ли не шеренгой. Впереди который был Игорь».</li>\n<li><strong>Удержание в подвале.</strong> «по дождём здесь, когда он придёт — слегка содрогнулся от своих же слов Игорь. Не кому это не понравилась. Но всё остались». Решение Игоря непопулярно у всех, но исполняется; физически его обеспечивает Костя, перекрывший выход.</li>\n<li><strong>Контроль над Мишей.</strong> Когда Миша встаёт в темноте, Игорь встаёт следом и держит его за плечо. Зачем — текст оставляет открытым: «Возможно чтобы не убежал. Возможно чтобы не утащили».</li>\n</ul>\n<p>При этом Игорь не изображается как тот, кто бьёт. Получив от Миши по носу и разбитый нос, он не отвечает, а спрашивает, где тот был вчера, — и подаёт руку: «давай вставай. Скоро уроки». Мотив своего беспокойства он оставляет двойным, и текст его не разрешает: «Он и правда боялся, что Миша мог умереть. Но боялся он этого потому-что полицая могла выйти на них или нет?»</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Отклик — не материал авторов</b>\n<p>Сильнее всего сделан строй. Игорь впереди, Миша в середине, Костя замыкает — и Миша сам объясняет, почему не может повернуть: «Будь он в конце он бы убежал. Но в конце стоит огромный Костя». Иерархия здесь не объявлена, а расставлена по местам, и то же самое повторяется в подвале, где Костя встаёт у прохода «словно дверь». Дважды одна и та же мысль показана телами, а не словами. Второе, что зацепило, — текст отказывается разрешать мотив Игоря: «Он и правда боялся, что Миша мог умереть. Но боялся он этого потому-что полицая могла выйти на них или нет?» Вопрос оставлен висеть, и это работает лучше любого ответа. И финал: подвал открыт настежь, монстра нет, в углу кровь и плоть, будто кто-то пытался пробить выход головой изнутри. Пустая комната страшнее занятой. Обидно ровно одно — что всё это существует одним куском на семь сообщений и обрывается на середине.</p></div>", "r": []}, {"t": "Отношения с другими группами", "a": ["S06", "GR-0077-S06", "GR-0077--otnosheniya-s-drugimi-gruppami"], "h": "<ul>\n<li><strong>С хулиганами школы.</strong> Прямая связь через Игоря: «его подколы и дружба с хулиганами». Отдельной группой хулиганы в переписке не описаны, состав не назван.</li>\n<li><strong>С классом.</strong> Игорь — «лидер всего класса», то есть компания стоит внутри класса на верхней позиции. Как класс относится к компании, не описано.</li>\n<li><strong>С Мишей как посторонним.</strong> Компания не принимает и не отталкивает его — она его втягивает. Миша всё время ждёт, что над ним будут издеваться («Миша думал они говорят о том как бы с подручней поиздеваться над Мишей»), но в тексте этого не происходит ни разу.</li>\n<li><strong>С чудищами завода.</strong> Односторонне: чудища сторонятся проклятых, «Ведь проклятых нельзя им трогать». Никакого контакта или переговоров нет.</li>\n<li><strong>С монстром из подвала.</strong> Монстра группа ищет специально и не находит: подвал открыт настежь, в углу «кровь и плоть. На полу и на стене. Словно кто-то пытался головой пробить отсуда выход», а самого чудища там нет. Последнее, что видит Игорь, — «на двери изгибы. Который соединялись в лицо».</li>\n</ul>", "r": []}, {"t": "Как менялась — по датам", "a": ["S07", "GR-0077-S07", "GR-0077--kak-menyalas"], "h": "<p>Вся история написана в один день, 2025-03-25 (окно w0085, сообщения 311072–311078). Состояния группы внутри неё:</p>\n<p><strong>Состояние 1 — до завода (311072–311073).</strong> Обычная школьная компания: Игорь, Ваня, Костя, Катя. Собираются на детской площадке. Ночная вылазка на заброшку — их обычное развлечение; легенда о заводе у Вани явно заготовлена, Миша отмечает, что слышал её «уже сотний раз», и что Ваня «лишь пересказал один из сотней слухов того места». Легенда, как её рассказывает Ваня: металлургический завод, названный «в честь того кто придумал радио»; ещё при СССР — слухи о шумах из подвала одного цеха, о двери «из десяти метровой чистой стали», в которую кто-то бьётся каждый день, днём неслышно из-за работы, а ночью слышно даже соседям; потом бунт (причина точно не известна — «Наверное работникам не выдавали зарплату или были плохие условия работы. А возможно это из-за влияние существа в подвале»); начальник открывает подвал своим единственным ключом и видит «Монстра по пять метров ростом и два метра в плечах. Полностью волосатого и с красными глазами»; монстр выходит, наступив на ногу самому начальнику, и «Он был готов нести смерть и страх».</p>\n<p><strong>Сама ночная вылазка</strong> (проход к дырке в заборе, раздача фонариков, спуск в подвал, попытка сдвинуть дверь) в приведённых кусках переписки отсутствует — сообщения 311074–311075 в записи не приведены. О ней известно только по обратным ссылкам из следующих сообщений: дверь они «едва не сдвинули в прошлый раз», причём сдвигали её Костя с Игорем вдвоём и «ели сдвинули еë вместе»; Миша «последний выбегал»; у группы есть фонарики.</p>\n<p><strong>Состояние 2 — на следующий день, обнаружение проклятия (311076–311077).</strong> Компания перестаёт быть компанией по интересам и становится группой пострадавших. Здесь появляются: драка Миши с Игорем по недоразумению, эпизод на реке (Костя вытаскивает Мишу, Ваня рассказывает, что было), поимённое перечисление симптомов у Кати, Вани, Кости и Миши, отказ Игоря говорить о своём, вывод Игоря о проклятии и его решение идти на завод сегодня же. Мотивация группы формулируется через Мишу: «Надо с этим закончить. Закончить этот двух дневный хаус и психоз».</p>\n<p><strong>Состояние 3 — второй поход, днём (311077–311078).</strong> Группа идёт строем, Игорь впереди, Миша в середине, Костя замыкает. Чудища на пути их не трогают. В подвале дверь открыта настежь, монстра нет, в углу кровь и плоть. Игорь решает ждать. Костя перекрывает выход и не выпускает Катю. Все выключают фонарики, «чтобы не разряжать по чем зря», сидят по углам, Костя стоит. Миша перестаёт слышать Костю; когда он с Игорем доходит до выхода, двери нет, а на двери проступают изгибы, складывающиеся в лицо. Текст обрывается вопросом «Они здесь умрут?».</p>\n<p>Дальнейших версий у этой группы нет: в записи Игоря версии 3 (2025-04-21, w0088) и 4 (2025-05-02, w0089) относятся к другим историям и другим персонажам с тем же именем.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "GR-0077-S08", "GR-0077--probely"], "h": "<div class=\"gaps\"><ul>\n<li><strong>У группы нет собственного имени.</strong> Только «их группа». Как её называть, авторы не обсуждали.</li>\n<li><strong>Поимённый состав есть, но записей нет.</strong> У Вани, Кости, Кати и этого Миши отдельных записей в базе нет, в members группы только <a href=\"PS-0240.html\">Игорь</a>. Фамилии, возраст, внешность (кроме роста Кости и «миловидности» Кати) не названы.</li>\n<li><strong>Проявление проклятия у Игоря не названо.</strong> Он его прямо скрывает, и никто не переспрашивает.</li>\n<li><strong>Откуда Игорь знает адрес Миши.</strong> Миша спрашивает прямо: «откуда ты знаешь где я живу?» — ответа в переписке нет, разговор обрывается вопросом матери из квартиры.</li>\n<li><strong>Сама ночная вылазка на завод не приведена</strong> — сообщения 311074–311075 в записи отсутствуют. Что именно группа делала в подвале в первый раз и что там на них село, восстанавливается только по обмолвкам.</li>\n<li><strong>Что значит «проклятый заряжен»</strong> — не объяснено нигде.</li>\n<li><strong>Что стало с Костей</strong> в подвале — осталось нерешённым. Миша просто перестаёт его слышать, история дальше не идёт.</li>\n<li><strong>Финал.</strong> История обрывается на 311078; чем кончилось для группы, не написано.</li>\n<li><strong>Город и школа не названы.</strong> Известно только, что «Каждый в городе знал о этом заводе и инциденти произошедший там».</li>\n<li><strong>Совпадение имён.</strong> Имя Игорь встречается ещё в двух других историях Славы — у клерка на корабле (w0088) и у младшего в бригаде лесорубов (w0089). Связь с этой компанией не установлена: «совпадение или нет, неясно».</li>\n</ul></div>", "r": [["Игорь", "PS-0240.html"]]}, {"t": "Связи — всё вместе", "a": ["GR-0077--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0234.html\">Михаил</a>, <a href=\"PS-0240.html\">Игорь</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0077--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0077.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0077-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0077/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первое и главное — не дыра в замысле, а дыра в реестре. В статье сказано, что записей у Вани, Кости, Кати и этого Миши в базе нет. Записи есть. Просто без статей и без единой входящей ссылки: <code>PS-0237</code> Миша (79 519 знаков базы), <code>PR-0062</code> — та же история прозой (54 799), <code>IS-0044</code> (55 559), <code>PS-0241</code> Костя (33 195), <code>PS-0238</code> мать Миши (30 933), <code>PS-0243</code> Катя (25 564), <code>PS-0242</code> Ваня (23 647), <code>SP-0213</code> «проклятие завода» (19 295), <code>PS-0244</code> «худая фигура в подвале» (18 780), <code>IS-0045</code> «легенда о монстре в подвале» (16 647), <code>SP-0216</code> «ложные отражения» (16 176), <code>SP-0215</code> «шёпот» (16 067), <code>SP-0217</code> «тени» (15 971). У всех тринадцати <code>est_statya</code> — нет, у всех ноль ссылок, у всех вселенная «вне вселенной» или «неясно», тогда как сама группа отнесена к «Нимбу». Похоже, весь куст w0085 не прошёл в реестр по вселенной, а не по объёму: суммарно там больше четырёхсот тысяч знаков (с перекрытием — это один и тот же текст, разложенный по записям). Это блокирует не одну статью, а всю ветку.</p>\n<p>Второе: <code>MN-0018</code> «завод имени Попова» — статья есть (23 031), база 41 617, входящих ссылок ноль. Статья о группе целиком про этот завод и на него не ссылается. Одна связь закрывает разрыв.</p>\n<h3>С чего начать</h3>\n<p>Не в архив — всё в базе. Сообщения 311074–311075, про которые в статье сказано «в записи не приведены», лежат дословно в <code>PR-0062</code>, <code>IS-0044</code>, <code>PS-0237</code>, <code>PS-0241</code>, <code>PS-0242</code>, <code>PS-0243</code> и в исходном окне w0085. Это ровно тот кусок, которого не хватает разделу «Как менялась»: путь вдоль забора, дырка в заборе, застрявший Костя с порванной толстовкой, раздача фонариков — Игорь берёт фонарик и для Миши, и Миша именно на этом не может свести концы, — вход в тёмный цех. То есть первая вылазка не потеряна, она просто не подключена.</p>\n<p>Проявления проклятия разъехались по трём отдельным записям — <code>SP-0215</code>, <code>SP-0216</code>, <code>SP-0217</code>, — каждая примерно по 16 тысяч знаков, ни одной ссылки. Раздел «Чем участники отличаются» и эти три записи описывают одно и то же.</p>\n<p>За фигурой из подвала идти в <code>PS-0244</code> (18 780) — там же, вероятно, и то, чего в статье нет: кровь, плоть и «словно кто-то пытался головой пробить отсуда выход» разобраны отдельно от группы.</p>\n<h3>Как развивалось</h3>\n<p>Здесь другая форма, чем обычно. Заявили и оборвали внутри одного захода: вся история написана 2025-03-25, все сообщения с одной меткой 13:28, от 311072 до 311078. Ни ограничения, ни возврата не было — текст кончается вопросом «Они здесь умрут?» и продолжения нет. Единственное, что происходит дальше, — имя: Игорь появляется 2025-04-21 и 2025-05-02 в других историях и с этой компанией не связан. То есть группа не забыта после обсуждения, она не обсуждалась вообще ни разу.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для чудищ завода правило названо прямо и работает как объяснение: «проклятых нельзя им трогать», поэтому второй проход, уже днём, обошёлся без помех. Для монстра из подвала — жителя того же завода, ради которого группа и вернулась, — правила того же рода нет. Распространяется ли на него запрет, не сказано ни словом, хотя весь смысл второго похода в том, чтобы с ним встретиться. Рядом висит условие, при котором запрет назван, — «тем более проклятый заряжен», — и оно тоже не раскрыто.</p>\n<h3>Отклик</h3>\n<p>Сильнее всего сделан строй. Игорь впереди, Миша в середине, Костя замыкает — и Миша сам объясняет, почему не может повернуть: «Будь он в конце он бы убежал. Но в конце стоит огромный Костя». Иерархия здесь не объявлена, а расставлена по местам, и то же самое повторяется в подвале, где Костя встаёт у прохода «словно дверь». Дважды одна и та же мысль показана телами, а не словами. Второе, что зацепило, — текст отказывается разрешать мотив Игоря: «Он и правда боялся, что Миша мог умереть. Но боялся он этого потому-что полицая могла выйти на них или нет?» Вопрос оставлен висеть, и это работает лучше любого ответа. И финал: подвал открыт настежь, монстра нет, в углу кровь и плоть, будто кто-то пытался пробить выход головой изнутри. Пустая комната страшнее занятой. Обидно ровно одно — что всё это существует одним куском на семь сообщений и обрывается на середине.</p></div>", "r": []}];</script>
