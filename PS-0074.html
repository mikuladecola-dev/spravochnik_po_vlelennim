<script>const BASE="";const DOCNAME="Пиромант Эшер";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0074-S01", "PS-0074--proishozhdenie"], "h": "<p>Пиромант Эшер — гуманоидное существо, управляющее огнём, предложенное 10 мая 2024 года (окно w0033, сообщения 167514–167518). Полное описание выложено Миколаем одним сообщением (2024-05-10, id 167516) с пометкой источника: «Нейронка предложила» (id 167517).</p>\n<p>Задача, под которую составлялось описание, сформулирована в самом тексте: «создание уникального гуманоидного существа, управляющего огнём, без использования тривиальных образов и символов пламени», для чего предлагалось «обратить внимание на более тонкие и метафорические аспекты огня».</p>\n<p>Персонаж заявлен как вариант огненного образа через управление теплом, а не пламенем, и связан в базе с Пиромантой и с огненным пришельцем — «каменным челом с магмой».</p>\n<p>В переписке встречается сокращённое имя — Эшер.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0074-S02", "PS-0074--vneshnost"], "h": "<p>Описание 2024-05-10 (id 167516), пять пунктов:</p>\n<ol>\n<li>\n<p><strong>Кожа.</strong> «Глубокий, землисто-красный оттенок, словно окрашенная минералами из глубин земли, где тлеет магма». На коже узоры, «напоминающие трещины в сухой земле, через которые виднеется светло-оранжевый свет, подобный тлеющему углю».</p>\n</li>\n<li>\n<p><strong>Волосы.</strong> Длинные, «плавно перетекают в цвета, напоминающие закат: от тёмно-красного до золотого». «Они постоянно колышутся, как будто на них дует лёгкий, невидимый ветерок».</p>\n</li>\n<li>\n<p><strong>Глаза.</strong> Глубокого оранжевого цвета с янтарным блеском. Зрачки вертикальные, «как у кошек, что придаёт его взгляду пронзительность и загадочность».</p>\n</li>\n<li>\n<p><strong>Одежда.</strong> Из ткани, «напоминающей базальтовую породу, но при этом удивительно мягкой и гибкой». Покрыта тонкими золотистыми и медными нитями, «создающими иллюзию внутреннего света и тепла».</p>\n</li>\n<li>\n<p><strong>Аксессуары.</strong> Украшения из вулканического стекла и редких минералов, которые «изредка искрятся тёплым светом». На поясе — амулет в форме солнца, изготовленный из меди и обрамлённый янтарём.</p>\n</li>\n</ol>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0074-S03", "PS-0074--harakter"], "h": "<p>Четыре черты (2024-05-10, id 167516):</p>\n<ol>\n<li>\n<p><strong>Мудрость.</strong> «Обладает глубокой мудростью и знанием о природе огня и тепла. Он философски относится к жизни и видит в огне метафору вечного преобразования».</p>\n</li>\n<li>\n<p><strong>Спокойствие.</strong> «В отличие от стереотипных \"огненных\" персонажей, Эшер ведёт себя спокойно и сдержанно, его страсть горит внутри, не выходя наружу».</p>\n</li>\n<li>\n<p><strong>Осознанность.</strong> «Существо понимает мощь и опасность огня, поэтому использует свои способности осмысленно и с уважением к живому».</p>\n</li>\n<li>\n<p><strong>Защитник.</strong> «Эшер видит свою миссию в защите и сохранении жизни, используя свои способности, чтобы предотвратить разрушение и войны».</p>\n</li>\n</ol>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0074-S04", "PS-0074--sposobnosti"], "h": "<p>Пять способностей (2024-05-10, id 167516):</p>\n<ol>\n<li>\n<p><strong>Контроль тепла.</strong> «Может управлять теплом вокруг себя, позволяя ему создавать и рассеивать тепловые волны, обогревать или охлаждать объекты без открытого пламени».</p>\n</li>\n<li>\n<p><strong>Тепловое зрение.</strong> «Способен видеть в инфракрасном спектре, обнаруживая источники тепла на большие расстояния и через преграды».</p>\n</li>\n<li>\n<p><strong>Пирокинез.</strong> «Может вызывать внутреннее возгорание объектов, не используя открытый огонь, а управляя молекулярной энергией веществ».</p>\n</li>\n<li>\n<p><strong>Тепловой щит.</strong> «Создаёт вокруг себя защитное поле, которое отражает тепловую и энергетическую атаки».</p>\n</li>\n<li>\n<p><strong>Факел разума.</strong> «Может зажигать свет в умах других, пробуждая идеи и страсти, или наоборот, затмевая сознание, вызывая забвение».</p>\n</li>\n</ol>\n<p>Общий принцип, вокруг которого собран набор, назван в заключении описания: образ «переосмысливает классическое представление о существе, управляющем огнём, представляя его через призму управления теплом и тепловой энергией».</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0074-S05", "PS-0074--svyazi-s-drugimi"], "h": "<p>В базе персонаж связан с Пиромантой — описание предложено как заготовка для неё — и с огненным пришельцем, «каменным челом с магмой».</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0074-S06", "PS-0074--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2024-05-10 (id 167514–167518).</strong> Единственная версия: полное описание внешности из пяти пунктов, пяти способностей и четырёх черт характера. Изменений и правок к этому тексту в переписке нет.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0074-S07", "PS-0074--chto-s-nim-stalo"], "h": "<p>После публикации описания Миколай написал «Слава» (id 167518) — вызов соавтора к обсуждению. Ответной реакции в прочитанном материале нет: текст помечен самим Миколаем как предложение нейронки, принят соавтором он не был.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0074-S08", "PS-0074--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Соавторской реакции на описание в переписке нет — ни принятия, ни отклонения.</li>\n<li>Не сказано, стал ли Эшер отдельным персонажем или только материалом для Пироманты.</li>\n<li>Происхождение, раса, место в мире, история персонажа не описаны.</li>\n<li>Как именно устроена связь с «каменным челом с магмой», в переписке не сказано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0074--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0014.html\">игра бога</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0074--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-05-10</td>\n<td>167514–167518</td>\n<td>w0033</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0074-piromant-esher.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0074--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0074.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
