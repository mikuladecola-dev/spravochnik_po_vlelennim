<script>const BASE="";const DOCNAME="Святой огонь";
const LEAD="";
const CH=[{"t": "Механика", "a": ["S01", "SP-0176-S01", "SP-0176--mehanika"], "h": "<p>Одна из сил Серафима, названная в общем перечне его способностей (2025-01-28, id 285333). Работает в две стороны: «Святой огонь способен исцелить его или жечи всё своих противников» — то есть исцеляет самого носителя и жжёт тех, кто ему противостоит. Вариант имени, зафиксированный в базе, — «огонь Божий».</p>\n<p>Больше механика нигде не расписана: как огонь вызывается, чем выглядит, есть ли у него дальность или форма (пламя, вспышка, поток) — в переписке не сказано.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0176-S02", "SP-0176--ogranicheniya-i-cena"], "h": "<p>Не названы. Ограничений, расхода, отката или условий применения в переписке нет.</p>", "r": []}, {"t": "Носители", "a": ["S03", "SP-0176-S03", "SP-0176--nositeli"], "h": "<p>Серафим — единственный названный носитель. Способность перечислена как часть его набора сил, рядом с контролем времени (замедление, остановка, иногда предсказание будущего), светом (световое оружие, шары, ослепление противника, перемещение со скоростью, приближенной к световой), манипуляциями сознанием (открыв один глаз, он заставляет жертву «утонуть в собственных воспоминаниях») и телекинезом («контроль над всеми объектами»).</p>\n<p>Передавался ли святой огонь кому-то ещё — в переписке не сказано.</p>", "r": []}, {"t": "Как менялась по версиям", "a": ["S04", "SP-0176-S04", "SP-0176--kak-menyalas-po-versiyam"], "h": "<p>Версия одна.</p>\n<p><strong>2025-01-28 (id 285333–285334, окно w0073).</strong> Способность появляется сразу в готовом виде, внутри списка сил Серафима, который Слава выкладывает под вопросом «Как победить Серафима». Реакция Миколая на весь набор — «тяжело». Отдельного обсуждения самого огня после этого не было.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0176-S05", "SP-0176--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Входит в общий набор сил Серафима вместе с контролем времени, светом, манипуляциями сознанием и телекинезом. Как эти силы соотносятся между собой, комбинируются ли, есть ли между ними иерархия — в переписке не сказано.</p>\n<p>Отдельно стоит отметить соседство святого огня со светом: обе силы связаны с одним персонажем и обе имеют боевое применение, но в переписке они разведены как разные пункты списка и нигде не сводятся вместе.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "SP-0176-S06", "SP-0176--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Как способность вызывается и как выглядит — не сказано.</li>\n<li>Ограничения, цена, откат — не названы.</li>\n<li>Насколько сильно исцеляет: раны, усталость, смертельные повреждения — не сказано.</li>\n<li>Работает ли исцеление и поджог одновременно или это два разных режима — не сказано.</li>\n<li>Кто ещё, кроме Серафима, может владеть святым огнём — не сказано.</li>\n<li>Исходный вопрос «Как победить Серафима» в переписке ответа не получил; роль святого огня в возможном поражении Серафима осталась нерешённой.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["SP-0176--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-01-28</td>\n<td>285333–285334</td>\n<td>w0073</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0176-svyatoy-ogon.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0176--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0176.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["SP-0176-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/SP-0176/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — сам Серафим. Персонажа с таким именем в справочнике нет вообще: ни статьи, ни записи в базе, ни строки в реестре. Ближайшее по имени — <code>PS-0209</code> «Серафима», и это совсем другой человек (кошкодевочка из пересланной чужой вселенной, окно w0077). При этом на Серафима опираются восемь записей напрямую — <code>SP-0174</code>, <code>SP-0175</code>, <code>SP-0176</code>, <code>SP-0177</code>, <code>SP-0178</code> (пять его сил, каждая отдельной статьёй), сводные <code>SP-0187</code> и <code>SP-0225</code>, и группа <code>GR-0008</code> «Команда против Серафима», собранная под него целиком. Имя встречается в 49 статьях справочника. Дороже этой дыры в окрестностях статьи нет: пять способностей описаны, носитель — нет.</p>\n<p>Вторая — реестры, из которых эти силы взяты. <code>SL-0053</code> «Список персонажей вселенной» (шесть ссылок, 20 КБ базы, статьи нет) и <code>SL-0051</code> «Каталог: благословенные, враги, грехи, оружие, артефакты» (тоже шесть ссылок, статьи нет). Раздел «Сторонние силы», в котором стоит Серафим, существует только внутри них.</p>\n<h3>С чего начать</h3>\n<p>В базе. Досье на Серафима собирается из уже разобранного материала, в архив за ним идти пока не нужно.</p>\n<p>Три точки. Первая — w0073, 2025-01-28: перечень пяти сил (id 285333) и реакция «тяжело» (id 285334), а рядом, в том же вечере, контекст — <code>GR-0008</code>, id 285353–285405, где Слава сначала собирает против него четвёрку апостолов, а через двадцать минут снимает её сюжетный статус: «Вообще против Серафима по сюжету должны были драться совсем другие перс которых я ещё не придумал» (id 285405). Вторая — <code>SP-0187</code>, 2025-02-25, id 295556–295560: строка Серафима в разделе «Сторонние силы» с тремя крыльями. Третья — <code>SP-0225</code>, 2025-05-14, id 325798–325801, где после списка стоит отдельная реплика «Он жив» (id 325800) и следом «Ну и нужно исправления» (id 325801).</p>\n<p>В архив — только за одним: откуда Серафим взялся до 28 января 2025. В справочнике он появляется сразу вопросом «Как победить Серафима», то есть как уже известная обоим фигура. Искать раньше окна w0073.</p>\n<h3>Как развивалось</h3>\n<p>2025-01-28 — огонь заявлен с механикой, в две стороны: «способен исцелить его или жечи всё своих противников», внутри набора из пяти сил. 2025-02-25 — тот же огонь стоит в списке уже как одно имя, «огонь Божий», без описания, и набор сокращён до четырёх. 2025-05-14 — та же четвёрка повторена слово в слово, включая опечатку «контроль времент», плюс «Он жив» и «нужно исправления». Заявили с механикой — свернули в имя — трижды перенесли имя из списка в список, не разворачивая.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для семи грехов уровень силы задан прямым текстом и один раз на всю группу: «7 грехов и божество ( помнишь его) Будет слабей главы этой организации но сильней благословенного» (2025-01-23, id 284175 — цитата стоит в <code>SP-0169</code> и <code>SP-0171</code>). Серафим сидит в соседнем разделе того же реестра, «Сторонние силы», и для этого раздела уровня не названо ни группового, ни личного — при том что вопрос «Как победить Серафима» поставлен вслух и с него всё началось.</p>\n<h3>Отклик</h3>\n<p>Зацепила одна строка: огонь, который лечит своего и жжёт чужих, — это не про огонь, это про сторону. Из пяти сил Серафима только у этой есть направление, остальные описаны как действия (замедлить, ослепить, контролировать), а эта — как принадлежность. И на фоне этого особенно хорошо смотрится вся сцена: человек выкладывает набор сил, спрашивает «как победить», получает в ответ «тяжело» — и на этом разговор кончается навсегда, а через четыре месяца тот же набор просто переезжает в новый список без единой правки. Вопрос был задан всерьёз, ответ — «тяжело», и он оказался окончательным.</p></div>", "r": []}];</script>
