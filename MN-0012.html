<script>const BASE="";const DOCNAME="Камни желаний";
const LEAD="";
const CH=[{"t": "Где находится — в каком мире и в каком его месте", "a": ["S01", "MN-0012-S01", "MN-0012--gde-nahoditsya"], "h": "<p>Камни желаний числятся за двумя вселенными: «7 островов» (объявлено, окно w0066, 2024-12-10) и «Апостол» (объявлено, окно w0094, 2025-05-14). В записи они отнесены к части «Благословенные».</p>\n<p>Место внутри мира не названо: где находятся камни, сколько их, как их находят — в переписке не сказано.</p>\n<p>Первое упоминание идёт в перечне того, что планируется добавить в мир: «И кроме людей хотел бы ещё рас добавить», «Да и монстров», и следом — «На заметку там будут камни желаний» (2024-12-10, id 269205–269207).</p>", "r": []}, {"t": "Что собой представляет", "a": ["S02", "MN-0012-S02", "MN-0012--chto-soboy-predstavlyaet"], "h": "<p>Механика описана Славой одним куском (2024-12-10, id 269207, дословно):</p>\n<div class=\"q\"><p>«Загадаешь сильная желания и камень сломается и превратиться в твой сосуд дав тебе способность накапливать энергий и по итогу получая структуру, Но ты умрёшь где-то через 10 лет, а умрёшь ты превратившись в камень желаний. Круговорот»</p></div>\n<p>Разбор по шагам, как это сказано:</p>\n<ul>\n<li>загадывается сильное желание;</li>\n<li>камень ломается;</li>\n<li>камень превращается в сосуд загадавшего;</li>\n<li>сосуд даёт способность накапливать энергию «и по итогу получая структуру»;</li>\n<li>носитель умирает где-то через 10 лет;</li>\n<li>смерть происходит через превращение в камень желаний;</li>\n<li>цикл замыкается — «Круговорот».</li>\n</ul>\n<p>Во второй версии камни желаний названы в реестре персонажей и сил — в разделе «Существа / Аномалий», одной из двух позиций: «Камни желаний 🪨», «Озеро перерождения ⚫️» (2025-05-14, id 325799). Механика в этом окне не повторяется и не уточняется.</p>", "r": []}, {"t": "Что с ним связано — предметы, механики, силы", "a": ["S03", "MN-0012-S03", "MN-0012--chto-s-nim-svyazano"], "h": "<ul>\n<li><strong>Сосуд и структура</strong> — камень становится сосудом, сосуд даёт накопление энергии и в итоге структуру. Связь с Сосудниками зафиксирована в записи; в приведённых кусках переписки термины даны без пояснения.</li>\n<li><strong>Озеро перерождения (чёрное озеро)</strong> — упомянуто рядом с камнями сразу же: «Озеро перерождения сюда можно засунуть конечно слегка изменив» (id 269208). Во второй версии озеро стоит рядом с камнями в том же разделе аномалий реестра.</li>\n<li><strong>Реестр персонажей и сил</strong> — список, где камни занимают место в разделе «Существа / Аномалий». Соседние разделы реестра: Апостолы, Одержимый, Враг, Церковь, Военный, Сторонние силы, Существа, Аномалии, Оружие, Артефакты, Идеи.</li>\n</ul>", "r": []}, {"t": "Персонажи и события — кто с ним связан и что там происходило", "a": ["S04", "MN-0012-S04", "MN-0012--personazhi-i-sobytiya"], "h": "<p>Конкретные носители не названы ни в одной версии. Кто ломал камень, кто превратился в камень — в переписке не сказано.</p>\n<p>Замечание Славы после реестра: «Он жив», «Ну и нужно исправления» (id 325800–325801).</p>", "r": []}, {"t": "Как менялся по версиям — по датам", "a": ["S05", "MN-0012-S05", "MN-0012--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-12-10, вселенная «7 островов», окно w0066 (id 269205–269210).</strong> Первое описание механики и круговорота. Помечено самим автором как «На заметку». В той же связке — предложение «Озеро перерождения сюда можно засунуть конечно слегка изменив» (id 269208) и порядок работы: «Ну для начала построим сам мир его историю и т п. / А после будем разделать персонажей на то на все» (id 269209).</p>\n<p><strong>Версия 2 — 2025-05-14, вселенная «Апостол», окно w0094 (id 325798–325801).</strong> Камни желаний названы в реестре как одна из двух аномалий. Описание механики не повторяется, не отменяется и не меняется. Сам реестр помечен как требующий доработки: «Ну и нужно исправления».</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "MN-0012-S06", "MN-0012--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Как работают камни во второй версии (вселенная «Апостол») — в окне не раскрыто, дана только строка реестра.</li>\n<li>Место, количество и происхождение камней не названы.</li>\n<li>Что такое сосуд и структура в этой механике — в приведённых кусках не объяснено.</li>\n<li>Что считается «сильным желанием» и исполняется ли само желание — не сказано.</li>\n<li>Срок «где-то через 10 лет» дан приблизительно, от чего он зависит — не сказано.</li>\n<li>Носителей нет: ни одного конкретного персонажа с камнем в переписке не названо.</li>\n<li>Как именно предполагалось «слегка изменить» Озеро перерождения при переносе — осталось нерешённым.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MN-0012--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0032.html\">Сосудники</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MN-0012--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-12-10</td>\n<td>269205–269210</td>\n<td>w0066</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-05-14</td>\n<td>325798–325801</td>\n<td>w0094</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/monumenty/MN-0012-kamni-zhelaniy.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MN-0012--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MN-0012.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
