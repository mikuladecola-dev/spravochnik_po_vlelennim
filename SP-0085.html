<script>const BASE="";const DOCNAME="Изменение веществ";
const LEAD="<p>Способность обсуждалась в один вечер (2024-07-05, id 197880–197918, окно w0044). Разбор идёт диалогом: Миколай перебирает случаи — «а вот так можно?», — Слава отвечает «может» или «не может». Варианты имени в базе: «Изменение веществ (способность защитника Асгарда)», «че он с атомами творит».</p>";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0085-S01", "SP-0085--mehanika"], "h": "<p>Способность работать с атомами. Миколай сразу разделяет два возможных режима: «именно состояние меняет типо твёрдость» или «может заменять полностью вещество» (id 197886, 197888). По ответам Славы работает и то и другое.</p>\n<p>Названные Славой примеры (id 197884):</p>\n<ul>\n<li>камень «может сделать жидким»;</li>\n<li>воздух — «прочными что хуй пробъешь»;</li>\n<li>«Воду в железо».</li>\n</ul>\n<p>На уточнение Миколая про смену состояния Слава отвечает «Нет ещё» и снова повторяет «Воду в железо» (id 197887) — то есть замена вещества добавляется к смене состояния, а не заменяет её.</p>\n<p>Отдельная формула Славы для носителя: «Философские камень ходячий» (id 197885).</p>\n<p>Дополнительно к работе с веществом назван телекинез (id 197889).</p>\n<p>Разобранные в переписке частные случаи:</p>\n<ul>\n<li>дерево в золото — «Может / Только в зависимости от количества энергий» (id 197890, 197892);</li>\n<li>воздух в бетон — «Может» (id 197899, 197901);</li>\n<li>трупы — «Может», обоснование Славы: «Они же не живый» (id 197904–197906);</li>\n<li>еда из салфеток — «Да», и на вопрос, будет ли она вкусной, ответ «Допустим пока да» (id 197907–197910).</li>\n</ul>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0085-S02", "SP-0085--ogranicheniya-i-cena"], "h": "<p>Энергия. «Она у него не бесконечная» (id 197893). Превращение возможно «в зависимости от количества энергий» (id 197892).</p>\n<p>Живое. Людей превращать не может (id 197894–197895). Комаров — тоже нет, ограничение распространяется на «других живых организмов» (id 197896–197897). Трупы под запрет не попадают, поскольку «не живый».</p>\n<p>Чужие способности. Сформулировано Славой дословно: «Он не может изменить явления чужих способностей / То бишь в него запустят огонь он его не изменят так как он состоит из энергий / Так же и кости если в него стрельнуть» (id 197914). То есть то, что состоит из энергии чужой способности, изменению не поддаётся.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0085-S03", "SP-0085--nositeli"], "h": "<p>По полю «Часть чего» способность закреплена за Защитником Асгарда (Избранным). В самой переписке носитель по имени не назван — говорят «он». Также в связях указаны Асгард и Система сил (сосуд).</p>\n<p>Реплика Славы «И правда полубог» (id 197891) относится к носителю.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0085-S04", "SP-0085--kak-menyalas-po-versiyam"], "h": "<p>Все три состояния приходятся на один разговор 2024-07-05, окно w0044.</p>\n<p><strong>Версия 1 (2024-07-05, id 197880–197893).</strong> Базовый набор: камень в жидкость, воздух в непробиваемый, вода в железо, дерево в золото, плюс телекинез. Введено ограничение по энергии — она не бесконечная, превращение зависит от её количества.</p>\n<p><strong>Версия 2 (2024-07-05, id 197893–197911).</strong> Добавлены границы по живому: люди и другие живые организмы — нельзя, трупы — можно. Подтверждены воздух в бетон и еда из салфеток.</p>\n<p><strong>Версия 3 (2024-07-05, id 197911–197918).</strong> Добавлено ограничение по чужим способностям: явления чужих способностей не изменяются, потому что состоят из энергии.</p>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S05", "SP-0085-S05", "SP-0085--otklonennye-varianty"], "h": "<p>Питание энергией от верующих. Миколай: «энергию он естественно будет получать с верующих / с каждой молитвой её количество увеличится» (id 197912–197913). Слава на это отвечает описанием ограничения по чужим способностям, а на уточнение Миколая «не объём, а именно заряд» отвечает дважды «Нет» (id 197915–197917). Миколай переспрашивает «а как» (id 197918) — на этом фрагмент обрывается, ответа в переписке нет.</p>\n<p>Отдельно от этой способности идея силы от веры разрабатывалась Миколаем позже — см. <a href=\"SP-0091.html\">Вера как источник силы</a>.</p>", "r": [["Вера как источник силы", "SP-0091.html"]]}, {"t": "Пробелы", "a": ["S06", "SP-0085-S06", "SP-0085--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Носитель не назван по имени; из-за путаницы с Каем принадлежность части реплик неточная (помечено в исходнике как неясность окна w0044).</li>\n<li>Откуда берётся энергия — не сказано. Вариант «с верующих» отвергнут, замена не названа: на вопрос «а как» ответа нет.</li>\n<li>Не сказано, сколько энергии стоит какое превращение — есть только зависимость «в зависимости от количества энергий» без шкалы.</li>\n<li>Не сказано, обратимы ли превращения и держатся ли они после того, как носитель перестал их поддерживать.</li>\n<li>Про еду из салфеток: «Допустим пока да» — вкус помечен самим Славой как временное решение, окончательного нет.</li>\n<li>Не сказано, работает ли телекинез отдельно от работы с атомами или это часть той же способности.</li>\n<li>Не сказано, распространяется ли запрет на живое на растения — обсуждались только люди и комары («другие живые организмы» не расшифровано).</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0085--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0091.html\">Вера как источник силы</a></li>\n<li><strong>Упомянут в способностях:</strong> <a href=\"SP-0091.html\">Вера как источник силы</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0085--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-05</td>\n<td>197880–197893</td>\n<td>w0044</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-05</td>\n<td>197893–197911</td>\n<td>w0044</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-05</td>\n<td>197911–197918</td>\n<td>w0044</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0085-izmenenie-veschestv.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0085--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0085.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
