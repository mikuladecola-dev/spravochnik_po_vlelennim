<script>const BASE="";const DOCNAME="Лиомат";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0059-S01", "SP-0059--mehanika"], "h": "<p>Лиомат — название энергии, от которой зависят сверхспособности. Разрабатывался 2024-05-07 — 2024-05-09 (id 166913–167324).</p>\n<p>Название придумано Миколаем (2024-05-07, id 166918). Этимология названа сразу же: «Объединение конечных частей слов означающих солнце и кровь на греческом» (id 166921). Разговор начался с вопроса Славы «А название энергий ?» при прямом отказе от названия для самой сверхспособности: «Похую на название сверхспособности» (id 166915–166916).</p>\n<p>Базовая постановка задачи от Славы (2024-05-07, id 166922): «я хочу что бы это энергий была у Геростратов и типо они это энергий используют способности. При этом там будут насильно пробужденый обычный людий которых заставили пробудить данную энергию, при этом самой сверхсилый у них не будет, а только усиленный за счёт этой энергий».</p>\n<p>Устройство на 2024-05-07 (id 166937–166973):</p>\n<ul>\n<li>Источник — не орган, а железа: «крч может новую железу им вывести пихнём и какую-то удалим», затем уточнение «Железу. Не орган» (id 166937, 166942–166943).</li>\n<li>Энергия по природе гормональная: «И эта энергия по сути гормоны» (id 166944).</li>\n<li>Работает не на выработке из ничего, а на переработке. Аналогия — адреналин: «Ну вот есть например адреналин. Если его прям много. Человек может делать невероятное» (id 166953–166955). Миколай сначала формулирует «они не вырабатывают энергию. Они её перерабатывают» и тут же поправляется «Или нет. Направляют в нужное русло» (id 166956–166959); Слава возражает: «Они сами вырабатывают» (id 166960).</li>\n<li>Итоговая схема цепочки (id 166963–166973): «Вот пища. Разлагаясь. На микроэлементы. Даёт энергию через кровь. А тут. Кров будет поступать в эту железу. И энергия будет преобразовываться в другую которая отвечает за способности. А также генерироваться или увеличиваться».</li>\n<li>Хранилище: «Ну и у этой железы будет сфинктер. Он будет как батарейка. Хранить энергию» (id 166971–166973).</li>\n</ul>\n<p>Сведённая формулировка (2024-05-09, id 167303): «есть у человека два вида энергии обычная которая получается от калорий и энергия от которой зависит сверх способность, пусть называется \"лиомат\". Так вот, лиомат это трансформированная обычная энергия, вырабатываемая в новой железе \"абакра\" и хранящаяся в сфинктере этой железы».</p>\n<p>Во втором варианте (2024-05-09, id 167322) в цепочку добавлена биохимия: преобразование идёт «посредством выработки гелиогормонов синтезируемых макросоединением иденоновой кислоты и циркулирующих в ангиолиях(сосудов с атф но, которая не активна без гормонов)». Точка получения энергии названа прямо: «соединение гелиогормонов с АТФ и приводит к появлению лиомата».</p>\n<p>Историческая часть механики: раньше железа работала постоянно, потому что среда этого требовала. В первом варианте — «300000 лет назад эта железа постоянно генерировала гелиогормоны, ибо были такие условия при которых человеку жизненно необходимо использовать сверхспособность» (id 167303). Во втором — 150000 лет и перечень условий: «вечный холод, макрофауна, озоновые дыры, общее состояние климата и состав воздуха отличались, постоянный стресс уже в первые годы рождения приводил к состоянию близкому птср» (id 167322). Дальше в обоих вариантах: «как только атмосфера земли стала комфортнее, а жизненные условия пригоднее для мирной жизни, гелиогормоны перестали вырабатываться и железа осталась рудиментом».</p>\n<p>Носитель самой способности — не энергия, а генетический код клеток. Первый вариант: люди «могут контролировать способность установленную генетическим кодом клеток» (id 167303). Второй вариант разворачивает это (id 167322): «У человека с рождения есть клетки с генкодом отвечающим за сверх способности, но без лиомата они не работают». Определение конкретной способности задаётся тем, что человек ел и о чём мечтал: «Этот генкод в режиме инкубации каждое поколение революционировал и способность определялась тем что человек ел, в том числе в контексте информации, а так же сами мечты человека до 5 лет влияют на предрасположенность к способности». При работе способности «клетки постепенно совершают метаморфозу и принимают нужную форму, а лиомат соответственно расходуется».</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0059-S02", "SP-0059--ogranicheniya-i-cena"], "h": "<ul>\n<li>Расход: лиомат тратится при использовании способности (2024-05-09, id 167322).</li>\n<li>У большинства людей энергия не производится. Объяснение через депрессию (2024-05-07, id 166947–166950): «есть же депрессия, при которой у человека не вырабатываются некоторые гормоны и он навыки некоторые теряет. И тут тоже самое но сильнее. То бишь у большинства эти гормоны не вырабатываются». Отсюда вывод Славы: «И нужен особой препараты» (id 166951).</li>\n<li>Условие запуска синтеза (2024-05-09, id 167322): «Гелиогормоны начинают синтез при стимуляции симпатической нервной системы и сейчас достаточная стимуляция для ежедневного использования знакома только людям пережившим ситуации при которых можно заработать крайнюю форму птср, ну конечно без самого птср, при птср не возможно». То есть требуется околоПТСР-состояние, а само ПТСР способность блокирует.</li>\n<li>Срок годности клеток: без использования сверхгенкод «после 30 лет полностью исчезают» (id 167322).</li>\n<li>Насильно пробуждённые: у них «самой сверхсилый у них не будет, а только усиленный за счёт этой энергий» (2024-05-07, id 166922).</li>\n</ul>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0059-S03", "SP-0059--nositeli"], "h": "<ul>\n<li>Геростраты — по постановке Славы, энергия есть именно у них и через неё они используют способности (2024-05-07, id 166922).</li>\n<li>Насильно пробуждённые обычные люди — отдельная категория: сверхсилы нет, есть только усиление (id 166922).</li>\n<li>Военные организации. Первый вариант (id 167303): «есть множество военных организаций с безумцами умеющими управлять гормональным фоном и стимулировать выработку гелиогормонов в этой железе». Второй вариант меняет формулировку (id 167322): «есть множество военных организаций где логично птср не редкость проводящих эксперименты над людьми со сверхспособностями».</li>\n<li>Железа есть у всех людей как рудимент; вопрос о её назначении в науке открыт: «Многие учёные гадали зачем она использовалась, но ответ так и не был зафиксирован в научном мире» (id 167303), во втором варианте — «не был зафиксирован в научном мире открыто» (id 167322).</li>\n</ul>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0059-S04", "SP-0059--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-05-07 (окно w0032, id 166913–166921).</strong> Названа энергия: «Лиомат». Расшифровка — соединение конечных частей греческих слов, означающих солнце и кровь.</p>\n<p><strong>Версия 2 — 2024-05-07 (окно w0032, id 166922–166936).</strong> Поставлена задача: энергия у Геростратов, отдельно — насильно пробуждённые обычные люди. Открыт вопрос «И вопрос откуда берется энергия ?» (id 166923). Варианты Миколая — солнце, еда; вариант Славы — желудок. Разграничение Миколая: «У нас с тобой так. А вот у них. Хз» (id 166930–166932). На вопрос, определился ли Слава, ответ — «Нет» (id 166936).</p>\n<p><strong>Версия 3 — 2024-05-07 (окно w0032, id 166937–166978).</strong> Решено: железа, а не орган; железа была всегда — «Тогда можно сказать что он был всегда» (id 166939), это ответ на возражение Славы «можно специальный орган но только как тогда насильной пробужденый вырабатывают эту энергию» (id 166938). Энергия — гормоны; у большинства не вырабатываются; нужны особые препараты. Цепочка кровь → железа → преобразование и генерация; сфинктер железы как батарейка-хранилище. Разговор обрывается на ночь (id 166974).</p>\n<p><strong>Версия 4 — 2024-05-09 (окно w0033, id 167300–167306).</strong> Миколай приносит сведённый текст: «Я короче концепцию энергии и способностей придумал систематизировал и написал» (id 167302). В этом варианте: два вида энергии у человека, лиомат как трансформированная обычная энергия, железа получает имя «абакра», введены гелиогормоны, срок — 300000 лет, военные организации с «безумцами умеющими управлять гормональным фоном», способность задана генетическим кодом клеток. Пометка автора: «Ну это пока первый вариант. Хотя надеюсь что последний)» (id 167304–167305).</p>\n<p><strong>Версия 5 — 2024-05-09 (окно w0033, id 167321–167324).</strong> Второй вариант, о котором автор говорит: «Некоторые недочёты и пробелы я заполнил» (id 167323). Добавлены иденоновая кислота как основа синтеза гелиогормонов и ангиолии — «сосудов с атф но, которая не активна без гормонов»; лиомат появляется от соединения гелиогормонов с АТФ; введено условие запуска через симпатическую нервную систему и околоПТСР-состояние; срок изменён с 300000 на 150000 лет; расписаны условия древней среды; введены сверхгенкод, его исчезновение после 30 лет без использования, зависимость способности от съеденного и от мечт до 5 лет, метаморфоза клеток при использовании и расход лиомата. Формулировка про военные организации заменена: вместо «безумцев, управляющих гормональным фоном» — организации, «где логично птср не редкость проводящих эксперименты над людьми со сверхспособностями».</p>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S05", "SP-0059-S05", "SP-0059--otklonennye-varianty"], "h": "<ul>\n<li>Источник энергии «из солнца» и «из еды» (Миколай, 2024-05-07, id 166925–166926) и «из желудка» (Слава, id 166929) — отвергнуты как описание обычного человека: «У нас с тобой так. А вот у них. Хз» (id 166930–166932).</li>\n<li>Специальный орган (предложение Славы, id 166938) — заменён на железу: «Железу. Не орган» (id 166942–166943).</li>\n<li>Формулировка «они её перерабатывают» / «Направляют в нужное русло» (Миколай, id 166957–166959) — снята возражением Славы «Они сами вырабатывают» (id 166960); итоговая версия совмещает оба: энергия и преобразовывается, и «генерироваться или увеличиваться» (id 166970).</li>\n<li>Срок 300000 лет из первого варианта (id 167303) заменён на 150000 лет во втором (id 167322).</li>\n</ul>", "r": []}, {"t": "Связь с другими способностями", "a": ["S06", "SP-0059-S06", "SP-0059--svyaz-s-drugimi-sposobnostyami"], "h": "<p>В файле как связанные перечислены: Абакра, Герострат, Мифы как летописи людей с активной абакрой, Отряд сильнейших, Провидец. Внутри самих цитат переписки из них названы только Геростраты (id 166922) и абакра (id 167303, 167322); характер связи с остальными в приведённых кусках не раскрыт.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "SP-0059-S07", "SP-0059--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вселенная в обоих окнах не названа прямо. В w0032 рядом с этой же разработкой звучало «Геростраты», но объявления смены или названия вселенной нет; в w0033 вселенная в самом окне тоже не названа.</li>\n<li>Какая железа «удаляется» взамен новой — не сказано. Реплика «может новую железу им вывести пихнём и какую-то удалим» (id 166937) продолжения не получила.</li>\n<li>«Особой препараты» (id 166951) не описаны: состав, происхождение, кто их делает — не названо.</li>\n<li>Не сказано, как именно военные организации стимулируют выработку в первом варианте помимо формулировки «управлять гормональным фоном»; во втором варианте этот механизм заменён на эксперименты и не расписан.</li>\n<li>Не сказано, чем насильно пробуждённые отличаются в биологии от Геростратов — только то, что сверхсилы у них нет.</li>\n<li>Иденоновая кислота и ангиолии введены во втором варианте одной фразой; откуда берётся кислота и где расположены ангиолии, не сказано.</li>\n<li>Реакции Славы на оба сведённых варианта (id 167303, 167322) в файле нет — переписка обрывается на репликах Миколая.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0059--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0048.html\">Отряд сильнейших (команда «А»)</a>, <a href=\"GR-0052.html\">Геростраты</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0012.html\">Цветной мир</a>, <a href=\"VS-0014.html\">игра бога</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0059--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-05-07</td>\n<td>166913–166921</td>\n<td>w0032</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-05-07</td>\n<td>166922–166936</td>\n<td>w0032</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-05-07</td>\n<td>166937–166978</td>\n<td>w0032</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-05-09</td>\n<td>167300–167306</td>\n<td>w0033</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-05-09</td>\n<td>167321–167324</td>\n<td>w0033</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0059-liomat.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0059--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0059.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
