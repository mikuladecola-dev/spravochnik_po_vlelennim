<script>const BASE="";const DOCNAME="Серые странники";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0090-S01", "PS-0090--proishozhdenie"], "h": "<p>Существа вселенной «Новый мир». Появились 4 июня 2024 года (2024-06-04, id 175845–175866) как один пункт из большого списка вариантов существ, который Миколай прислал в сообщении 175848. Список был разбит на три части — тёмная сторона, светлая сторона, «смешанные или нейтральные персонажи». Серые странники стояли первым пунктом в третьей части.</p>\n<p>Из всего списка в мир вошли только они. Слава, вернувшись к переписке через пять с лишним часов, ответил: «Чёт ничего не понравилась кроме серых странников» (2024-06-04 07:00, id 175863). Тем самым отбор был явный: одна позиция принята, четырнадцать остальных отвергнуты.</p>\n<p>Формулировка списка помечена в исходнике как машинная вставка, принятая автором, — материал берётся с этой оговоркой.</p>", "r": []}, {"t": "Характер и положение в мире", "a": ["S02", "PS-0090-S02", "PS-0090--harakter-i-polozhenie-v-mire"], "h": "<p>Единственное описание, данное в переписке (175848): «Серые странники - загадочные существа, не принадлежащие ни к одной из сторон и преследующие свои собственные цели».</p>\n<p>То есть в конфликте тёмной и светлой энергии они не на чьей стороне, и мотив у них свой.</p>", "r": []}, {"t": "Связи с другими", "a": ["S03", "PS-0090-S03", "PS-0090--svyazi-s-drugimi"], "h": "<p>Прямых связей с конкретными персонажами в переписке не названо. Категориально они относятся к третьей группе — смешанные или нейтральные, — рядом с которой в том же списке стояли стихийные духи, механические конструкты, космические сущности и полукровки; все эти пункты Слава отверг.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S04", "PS-0090-S04", "PS-0090--kak-menyalsya"], "h": "<p><strong>2024-06-04 (id 175845–175866).</strong> Единственная версия. Существа названы, описаны одной строкой и приняты в мир.</p>\n<p>Изменений после этой даты в переписке нет.</p>", "r": []}, {"t": "Отклонённые варианты из того же списка", "a": ["S05", "PS-0090-S05", "PS-0090--otklonennye-varianty-iz-togo-zhe-spiska"], "h": "<p>Всё, что Слава не принял в 175863, — материал того же разговора и фиксируется как забракованное.</p>\n<p>Тёмная сторона (175848):</p>\n<ol>\n<li>Тенеморфы — «существа, созданные темными колдунами, которые могут принимать облик теней и проникать в самые защищенные места».</li>\n<li>Кошмарные твари — «порождения страхов и негативных эмоций, вызывающие ужас и отчаяние у своих жертв».</li>\n<li>Некромантские слуги — «оживленные трупы или скелеты, подчиняющиеся воле своих создателей».</li>\n<li>Энергетические вампиры — «существа, питающиеся жизненной силой и эмоциями других, ослабляя их».</li>\n<li>Тёмные шифтеры — «оборотни или метаморфы, способные принимать облик других существ для обмана и проникновения».</li>\n</ol>\n<p>Светлая сторона:</p>\n<ol>\n<li>Целители — «существа с мощными способностями к исцелению и восстановлению, помогающие раненым и больным».</li>\n<li>Светящиеся стражи — «создания из чистой светлой энергии, защищающие невинных и борющиеся со злом».</li>\n<li>Мудрые древни — «древовидные существа, обладающие глубокими знаниями и способные давать советы и наставления».</li>\n<li>Звёздные духи — «эфемерные создания, связанные с небесными телами и помогающие в навигации и предсказаниях».</li>\n<li>Животные-компаньоны — «звери с повышенным интеллектом и способностями, служащие верными спутниками и помощниками».</li>\n</ol>\n<p>Смешанные или нейтральные, кроме серых странников:</p>\n<ol start=\"2\">\n<li>Стихийные духи — «воплощения природных сил (огонь, вода, земля, воздух), чье отношение зависит от обстоятельств и окружения».</li>\n<li>Механические конструкты — «искусственные создания, наделенные разумом и свободой воли, выбирающие свой путь».</li>\n<li>Космические сущности — «древние и могущественные создания, чьи мотивы и действия не всегда понятны смертным».</li>\n<li>Полукровки — «существа, рожденные от союза представителей разных рас или носителей разных энергий, вынужденные искать баланс внутри себя».</li>\n</ol>", "r": []}, {"t": "Что рядом", "a": ["S06", "PS-0090-S06", "PS-0090--chto-ryadom"], "h": "<p>Сразу после отбора Слава в том же сообщении-паре предложил другой вид, уже не из списка (175864): провидцы, «ещё один вид в сторону добра», «вымирающий вид ( потому что они сходят с ума из за своей способности и по итогу чаще всего заканчиваются суицидом )», со способностью «петля времени». К серым странникам это отношения не имеет, зафиксировано как соседний по времени материал.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0090-S07", "PS-0090--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Как выглядят серые странники — в переписке не сказано.</li>\n<li>Какие именно «свои собственные цели» они преследуют — не названо.</li>\n<li>Есть ли у них связь с серыми людьми и колдунами из других разговоров — не обсуждалось.</li>\n<li>Численность, места обитания, способности — не описаны.</li>\n<li>Отдельных персонажей-странников с именами нет.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0090--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0098.html\">Серые странники</a>, <a href=\"GR-0099.html\">Провидцы</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0007.html\">Новый мир</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0090--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-06-04</td>\n<td>175845–175866</td>\n<td>w0036</td>\n<td>Новый мир (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0090-serye-stranniki.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0090--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0090.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
