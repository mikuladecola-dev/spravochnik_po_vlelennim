<script>const BASE="";const DOCNAME="Антон Смирнов";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0221-S01", "PS-0221--proishozhdenie"], "h": "<p>Антон Смирнов (в переписке также Антоша, Антошка, Тоха) — главный герой истории, выложенной Славой 13 марта 2025 года (2025-03-13, id 301805–301810 и полная выкладка 301819–301824, окно w0080). Человек без способностей на момент начала истории; вся его биография известна из монолога старика-арбетара, который перед ритуалом перечисляет Антону, что о нём выяснил.</p>\n<p>По этому монологу: «Во-первых ты одиночка у тебя нет родных, не друзей , тебя воспитала бабушка. Ты не закончил колледж из-за, инцидента. Ну как инцидента ты избил одного избалованного паренька, который пытался затащить в кровать девочку, которая явно этого не хотела. После ты работал в ресторанах, курьером. Но не где долго не задержался, потому-что устраивал драки. И последния драка, где ты пытался защитить паренька которого пресуют. Кончилась тем, что того кого ты избил, была крыша. Серьёзна крыша. И тебе пришлось бежать». После этого Антон сменил несколько городов, нигде долго не задерживаясь. Итог, который подводит старик: «Ты человек возомнивший себя героем, а на самом деле ты человек у которого ничего нет, не образования, не работы, не семьи, не дома, не друзей. Ты всю жизнь бежал всём помогать не думая о себе».</p>\n<p>Единственный близкий человек — бабушка. По словам альтро-эго, она была «По настоящему добрый человек, переживающий о других. Желающий помочь и помогающий. И единственный для нас дорогой человек». Именно её советы Антон стремится выполнять, и именно поэтому он «праведник». Главный её совет, который Антон, по словам альтро-эго, забыл, — «заботиться о себе». Отдельно упоминается книжка, которую бабушка читала Антону; альтро-эго связывает с ней его склонность считать себя «героям в сияющих доспехах». Что за книжка — в переписке не сказано.</p>\n<p>В теле Антона с рождения находится вторая душа — его брат. Объяснение даёт апостол Дмитрий Рутковский: «Такой бывает редко когда две ячейклетки сливаються в одну. Но такие случие всё равно есть». На снимке мозга Антона виден участок, которого нет на снимке обычного человека; Антон принимает его за опухоль, Дмитрий поправляет: «это не опухоль, а кусочек чужого мозга. А точнее твоего брата». Сам Антон до этого разговора считал этот голос своим альтро-эго и списывал случаи потери контроля над телом на всплески эмоций — «Мне не кто не объяснял, что это не правильно, не нормально».</p>\n<p>Чистота души Антона — 89%. По словам старика, для обряда нужен проводник с чистой душой, «Ну конечно не прям 100% чистой душой, а где-то на 80% плюс минус», и обычно арбетары берут для этого детей от 3 до 12 лет. Антон подходит лучше ребёнка: «через тело и душу ребёнка проходить мало силы, а вот через тебя. Со взрослым телом и крепкой душой пройдёт куда больше силы».</p>\n<p>События, приведшие Антона к старику, описаны в полной выкладке (id 301819–301820). Антон увидел, как «какой-то жилистый мудин» заталкивает в свой фургон мальчика-беспризорника, и вмешался: запихнул мужика пинком в его же фургон и начал бить по затылку. Мальчик тем временем сбежал. Антон нашёл у похитителя ключи, отвёз его в лес и привязал к дереву. Причина, по которой он не прошёл мимо, названа им самим: «Потому- что я знаю этих детей, я же и подкармливал». Затем Антон пытал похитителя: бил молотком по коленным чашечкам, ломал пальцы, загонял деревяшки под ногти. Пленный молчал «даже когда наступил утро, а потом день» и заговорил только тогда, когда Антон стянул с него штаны и прицелился молотком в промежность. Признание: он доставляет детей в один из элитнейших ресторанов, где едят человечину; сам он «всего лишь шестерка», а среди посетителей ресторана — начальник полиции, поэтому что-либо предпринимать бесполезно.</p>\n<p>Плана у Антона не было: ни оружия, ни телефона, ни денег. Альтро-эго в шутку предлагало базуку, ракету и «вообще можно ядерку»; всерьёз был выбран вариант «можно машиной туда врезаться, ближе к ночи». Перед этим они взяли «взаймы и кредиты» и нормально поели. В 3:00 фургон въехал в ресторан. Что именно произошло дальше в самом ресторане, в переписке не показано — следующая сцена начинается уже в железном ящике.</p>\n<p>В версии 4 (id 301918) Слава фиксирует важный узел этой сцены: «в ресторане ганибалов был дед ждущий мальчика, которого должен был похитить жирный мужик». То есть похищенный мальчик предназначался старику как проводник, и Антон, сорвав похищение и приехав в ресторан сам, занял его место. Старик формулирует это так: «И ждал ребенка, чтобы использовать его как проводник. Но как удачно появился ты».</p>", "r": []}, {"t": "Характер", "a": ["S02", "PS-0221-S02", "PS-0221--harakter"], "h": "<p>Сформулировано Славой при разборе (2025-03-13, id 301918): «главное отметить, что Антоша импульсивный, решительный».</p>\n<p>Праведник — определение, которое в тексте применяют к Антону и старик, и альтро-эго, и он сам. Старик: «Ты праведник , и как бы ты не противился всё твои поступки говорят об этом. Ты глупый правидник». Альтро-эго: «Ну да, ты же правидник сука. Ну почему я должен быть именно твоим альтро-эго?». Сам Антон, объясняя свой выбор стать агентом: «Я же праведник сука».</p>\n<p>Себя он при этом праведником не считает и пытается этим отговорить старика от ритуала: «эй нет, ты кажись попутал, я не без грешник. и за мной есть грехи. Да сука я почти что суицидник. Я калечил людей. Я пил. Я курю. Я вообще говножуй. Я явно не тот кого ты ищешь».</p>\n<p>Клаустрофобия. В железном ящике Антон впадает в панику: орёт, бьётся головой о железную стенку, теряет ориентацию — «Я потерялся в пространстве и не понимал где вверх? Где вниз ? Где права? Где лева?». Паника не прекращается ни когда его выпускают, ни когда выбрасывают на деревянный пол; он приходит в себя только после вылитого на голову ведра холодной воды.</p>\n<p>Внутренний диалог с альтро-эго идёт постоянно и параллельно внешнему разговору: альтро-эго требует не орать на старших, тянуть время, слушать и не отвлекаться, обещает придумать план. Отдельно отмечено, что альтро-эго считает Антона и старика похожими: «да, вы бы с ним лучшее ужились, вы же с ним на одной волне».</p>\n<p>В пытке похитителя Антон доводит начатое до конца по принципу «Раз уж начали то надо доделывать» — реплика принадлежит внутреннему голосу, который в этой сцене спорит сам с собой и пугает пленного тем, что тот принимает его за шизофреника.</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0221-S03", "PS-0221--sposobnosti"], "h": "<p>Своих способностей у Антона до ритуала нет. Что есть:</p>\n<ul>\n<li><strong>Вторая душа в одном теле</strong> — брат, воспринимаемый Антоном как альтро-эго. Обе души, по словам Дмитрия, были чисты: «В одном теле было две души, и обе были чисты». Проявления — внутренний собеседник и эпизодическая потеря контроля над телом.</li>\n<li><strong>89% чистой души</strong>, что делает его материалом высшего качества для роли проводника в обряде арбетара — лучше, чем дети, которых берут обычно.</li>\n<li><strong>Роль сосуда</strong> в самом обряде. Механика по объяснению старика: «я использую мозг благословенного, чтобы он начал собирать силу. И тело Альфы дабы он его пресовал. А всё остальные компоненты служат активаторами. И после того как вся это сила от прессуется она пройдёт через тебя. Нет. Точнее ты станешь для неё сосудом. Она будет накапливаться в тебе. Пока выдерживает твоей тела. А после твоя душа покроет эту силу. Сделав еë более безопасная для меня». Без души проводника шанс успешного поглощения у старика — 0%; с Антоном он вырастает на 8%.</li>\n<li><strong>Кусок силы после обряда.</strong> Дмитрий говорит, что Антон «тоже получил кусок силы нашего мира. При этом выжив» — именно поэтому за ним в любом случае будет слежка. Что это за сила, в каком объёме и что Антон может с ней делать, в переписке не сказано.</li>\n</ul>\n<p>Состав материалов обряда, в число которых Антон входит: он сам, «пару чужемирцов», ещё один благословенный и «самая сложная альфа».</p>\n<p>Отдельная линия — «заготовки» альтро-эго. По ходу монолога старика альтро-эго сообщает, что придумало «не совсем» план, но «сделал пару заготовок»; на вопрос «Как?» отвечает «Потом узнаешь сейчас главное выбраться». Прямого объяснения в переписке нет; после разговора с Дмитрием Антон сам делает вывод: «Так та заготовка была, чем то, что перенаправила весь урон на него».</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0221-S04", "PS-0221--svyazi-s-drugimi"], "h": "<p><strong>Брат (альтро-эго).</strong> Вторая душа в теле Антона, кусочек чужого мозга на снимке. До больницы Антон считает его собственным альтро-эго и от старика этот факт скрывает — Дмитрию он тоже сначала рассказывает всё, «Конечно опустив про альтро-эго». Во время обряда брат приходит попрощаться: просит перестать быть праведником, напоминает про совет бабушки «заботиться о себе» и говорит: «Ведь когда меня не станет, больше не кто тебя не отговорить, и не спасёт, поэтому живи прошу тебя. Хватит рисковать собой, прошу тебя». По объяснению Дмитрия, во время обряда «больший урон получила душа твоего брата, а после его забрал старик». Имя брата не названо.</p>\n<p><strong>Старик-арбетар.</strong> Похититель и заказчик обряда, для которого Антон — проводник. Одет элегантно: смокинг, чёрные волосы, «С бородкой как у бизнесменов». Разговаривает доброжелательно и радостно, «радостно словно ребёнок». Его собственная биография изложена им же как сказка про мальчика: жил с пьяницей-отцом и слабохарактерной матерью в деревне Ливия под Санкт-Петербургом, деревню разорил Арбетар («швецский; на русском трудяга»), который увидел в глазах мальчика «желания жить» и взял в ученики; ученичество длилось 50 лет, после чего учитель рассказал ему способ стать Арбетаром и «кинул его в свободное плавание». Обряд проводится в деревне Лихой, которую старик, по его словам, «сам еë ели ели нашёл, если бы не учитель, вообще не знал бы о такой». Ненавидит апостолов больше всех, при этом признаёт: «свою работу они выполняють слишком идеально. Ну даже в идеальной системе есть единичные пробои». После обряда старик выживает и забирает душу брата; его реплика — «да. Это оказалось куда больше силы чем я думал». Имя старика не названо.</p>\n<p><strong>Дмитрий Рутковский, кодовое прозвище «агрегат».</strong> Апостол, тот самый, которого, по словам Антона, ненавидит старик. Именно он засёк «огромный сплеск энергии», нашёл деревню и тело Антона и «подлатал физический». Внешность в восприятии Антона: атлетически сложен, мышцы видны сквозь одежду, кожаная куртка байкерского типа, перчатки без пальцев, чёрные джинсы; лицо симметричное, с острыми углами, ровные брови, «Глаза словно у хищника острый», короткая стрижка «словно только с армией», чёрные волосы. Говорит спокойным нежным голосом, улыбается доброжелательно — улыбка похожа на бабушкину. Антон отмечает, что не испугался его при пробуждении, и не может решить, дело в глазах Дмитрия или это «чёрта всех благословенный». Почему прозвище «Агрегат» — Антон спрашивает про себя, вслух спросить стесняется; ответа в переписке нет.</p>\n<p><strong>Апостолы.</strong> Организация, к которой принадлежит Дмитрий и в агенты которой Антон соглашается идти. Задача агента сформулирована Дмитрием: «защищать сон мирных людей. Но при этом рискуя своей жизнью».</p>\n<p><strong>Защитник.</strong> Прямо с Антоном не пересекается. Упомянут дважды: как цель «тест-драйва» старика сразу после обряда — «защитник. Недавно появившаяся охотник за чужемирцами. Он вроде бы сильный. Будет не плохим манекеном для проверки мой новый силы»; и в разборе 13.03 (id 301886), где Слава ставит Защитника и Антошу в один ряд как героев, которые мстят.</p>\n<p><strong>Похититель детей</strong> («жирный мужик», шестёрка при ресторане каннибалов). Антон отбил у него мальчика, пытал его в лесу и оставил привязанным к дереву: «Да оставь его, всё равно некуда не уйдёт». Дальнейшая его судьба в переписке не описана.</p>", "r": []}, {"t": "Как менялся", "a": ["S05", "PS-0221-S05", "PS-0221--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2025-03-13, 13:21 (id 301805–301810).</strong> Первая, неполная выкладка истории: начинается сразу с фразы «Фургон в 3 часа ночи въехал в один из элитных ресторанов......» и пробуждения в железном ящике. Дальше — монолог старика, биография Антона, 89% чистой души, обряд, прощание брата, пробуждение в больнице, разговор с Дмитрием и выбор стать агентом. Единственная реакция Миколая в этой версии (id 301810): «спасибо за человеческое имя».</p>\n<p><strong>Версия 2 — 2025-03-13, 13:29 (id 301819–301824).</strong> Полная выкладка с самого начала. Добавлено то, чего не было в первой: сцена с похитителем и мальчиком, пытка в лесу, признание про ресторан каннибалов и начальника полиции, обсуждение плана с альтро-эго (базука, ракета, ядерка — отвергнуто; таран фургоном ближе к ночи — принято), кредиты и еда перед смертью. Дальше текст первой выкладки повторён без изменений. Старая версия не отменена — это то же самое, дописанное спереди.</p>\n<p><strong>Версия 3 — 2025-03-13, 14:47–14:48 (id 301883–301893).</strong> Миколай замечает, что в историях Славы «частенько тема мести». Слава раскладывает: «Бессмертный мстить не собирается / Чужемирец тоже не собирается / Только защитник / Ну Антоша». То есть Антон определён как один из двух мстящих героев. Тогда же обсуждается, о чём будет следующая история; Миколай предлагает «об антоше», Слава отвечает: «Для начала».</p>\n<p><strong>Версия 4 — 2025-03-13, 14:58–15:02 (id 301909–301924).</strong> При разборе Слава фиксирует то, что считает обязательным к запоминанию из начала истории: «главное отметить, что Антоша импульсивный, решительный, и что в ресторане ганибалов был дед ждущий мальчика, которого должен был похитить жирный мужик». Миколай отмечает, что начало из-за большого количества диалогов читается тяжело, и предлагает поставить в начало «чет незначительное или имено как начало» — правка касается подачи истории, к устройству персонажа отношения не имеет и в переписке дальше не доводится.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S06", "PS-0221-S06", "PS-0221--chto-s-nim-stalo"], "h": "<p>Обряд Антон пережил. Урон, который должен был получить он, принял на себя брат; душу брата забрал старик. Физически Антона восстановил Дмитрий Рутковский, очнулся Антон на следующее утро в больнице.</p>\n<p>Дмитрий предложил ему два пути и подчеркнул, что больше дать не может: восстановиться и жить обычной жизнью, но под слежкой (поскольку Антон получил «кусок силы нашего мира» и выжил), либо стать агентом организации апостолов. От разъяснения плюсов и минусов Дмитрий отказался: «Не хочу как-то влиять на твой выбор. Ты должен сам решить».</p>\n<p>Антон выкрикнул ответ ему в спину: «я стану агентом!». Мотив изложен тут же: «Я отомщю за брата. Я убью его. Да и я не смогу нормально спать если буду знать, что кого то, мог спасти. Но не сделал этого. Я же праведник сука». Дмитрий ответ не принял — «я не приму этот ответ. Я приду сюда через три дня и тогда ты дашь мне ответ», — и ушёл. История заканчивается фразой: «Но я знал, что через три дня мой ответ не изменится». Сам разговор через три дня в переписке не написан.</p>\n<p>Дальнейшая линия персонажа обозначена только планом: следующая история — про Антошу, «Для начала» (id 301891–301893).</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0221-S07", "PS-0221--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Внешность Антона не описана нигде. Подробно описаны внешности старика и Дмитрия Рутковского — глазами Антона, но сам он остаётся без описания.</li>\n<li>Возраст Антона не назван. Известно только, что он взрослый и что старик противопоставляет его детям 3–12 лет.</li>\n<li>Имя брата не названо; неизвестно, знал ли брат сам, что он брат, а не альтро-эго.</li>\n<li>Имя старика-арбетара не названо, как не назван и его учитель.</li>\n<li>Что за «заготовки» сделало альтро-эго и как — не объяснено. Прямой ответ отложен репликой «Потом узнаешь», и в переписке к нему не возвращаются; версия про перенаправление урона — догадка самого Антона.</li>\n<li>Что произошло в ресторане после тарана и как Антон оказался в железном ящике — не показано, сцена обрывается.</li>\n<li>Судьба ресторана каннибалов, начальника полиции и привязанного к дереву похитителя — не описана.</li>\n<li>Что именно за силу получил Антон, в каком объёме и на что она годна — не сказано; Дмитрий только констатирует факт «куска силы».</li>\n<li>Чем кончился «тест-драйв» старика на Защитнике — в этом окне не сказано.</li>\n<li>Разговор с Дмитрием через три дня не написан; формальное вступление Антона в организацию апостолов остаётся за границей текста.</li>\n<li>Название вселенной в окне w0080 ни разу не произнесено — принадлежность к «Апостолу» проставлена по дате.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0221--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0005.html\">Агенты (организация вербовки)</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0005.html\">Агенты (организация вербовки)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0221--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-03-13</td>\n<td>301805–301810</td>\n<td>w0080</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-13</td>\n<td>301819–301824</td>\n<td>w0080</td>\n<td>Апостол (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2025-03-13</td>\n<td>301883–301893</td>\n<td>w0080</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-13</td>\n<td>301909–301924</td>\n<td>w0080</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0221-anton-smirnov.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0221--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0221.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0221-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0221/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первое чинится переносом, а не поиском. Источники статьи обрываются на 301924, 13 марта, и оттуда же берётся вывод, что линия персонажа «обозначена только планом». Финал Антона написан на следующий день: 2025-03-14, id 302378–302380, окно w0081 — выписка из больницы в Санкт-Петербурге, «просто пытался услышать голос внутри себя», и цель: «Научиться пользоваться, той одарённой его силой. Чтобы убить одного старого и до ужаса лицемерного старика». Тот же кусок закрывает и пробел «чем кончился тест-драйв старика». Он уже в базе и уже процитирован — в <code>PS-0224</code> и в <code>PR-0059</code> (21 039, ссылок ноль).</p>\n<p>Дальше по цене — брат. В статье «заготовки» стоят как необъяснённые, а в базе на них заведена отдельная запись: <code>SP-0196</code> «Заготовки», 48 534 знака, ссылок ноль. Рядом <code>PS-0222</code> «Альтер-эго Антона (брат)» — 72 757, ссылок ноль, и <code>SP-0197</code> «Две души в одном теле» — 21 778, ссылок ноль. Сто сорок тысяч знаков про того, кто Антона спас и за кого он идёт мстить, не держит ни одной входящей ссылки. У самого Антона входящая ссылка одна.</p>\n<p>Третье — организация. «Я стану агентом» сказано 13 марта, а что такое агент и по каким правилам он работает, придумано через два с половиной месяца: <code>MR-0139</code> «Контракт и правила агента АЗИП» (17 145, две ссылки, окно w0099, 2025-05-28 — 30), <code>PS-0277</code> «Агент АЗИП» (11 887, одна ссылка), <code>MR-0122</code> «Агенты» (12 802, две ссылки). Пробел «формальное вступление остаётся за границей текста» упирается не в архив, а в непроведённую связь между мартом и концом мая.</p>\n<h3>С чего начать</h3>\n<p>Всё в базе.</p>\n<ul>\n<li>Финал линии: id 302378–302380, 2025-03-14, w0081 — по источникам <code>PS-0224</code> и <code>PR-0059</code>.</li>\n<li>«Заготовки»: <code>SP-0196</code>, источники 301806–301809 и повтор 301821–301824. То есть ответ был в тех самых сообщениях, из которых собрана эта статья, — он просто ушёл в другую запись.</li>\n<li>Брат: <code>PS-0222</code>, диапазоны 301811–301818, 301841–301848, 301857–301861 — трёх этих участков в источниках <code>PS-0221</code> нет вовсе. Плюс <code>SP-0197</code>.</li>\n<li>Ресторан и его судьба: <code>MN-0017</code> «Элитный ресторан с человечиной» (17 799, ссылок ноль) и <code>ID-0155</code> «Мини-рассказ по сцене в ресторане» (1 485, статьи нет) — там же след того, что сцену собирались дописывать отдельно.</li>\n<li>Агентство: <code>MR-0139</code>, <code>PS-0277</code>, <code>MR-0122</code>, окно w0099.</li>\n<li>Разбор и правка про начало: <code>SL-0066</code> «Разбор истории про Антона» (8 664, статьи нет) и <code>ID-0120</code> «Незначительное начало для раскачки читателя» (3 097, статьи нет).</li>\n</ul>\n<p>В архив — за возрастом и внешностью. Ни того ни другого нет ни в одной записи ветки, при том что внешности старика и Дмитрия описаны подробно. Ориентир: 2025-03-13, окно w0080, участок 301883–301924, где авторы вслух проговаривают, что в персонаже «главное отметить»; и вечер 2025-03-14, w0081, id 302830–302848, где Слава перечисляет своих героев. Если возраст называли, то там.</p>\n<h3>Как развивалось</h3>\n<p>13:21 — выложили историю с середины, прямо с тарана. 13:29, через восемь минут — выложили заново, дописав спереди похищенного мальчика, пытку в лесу и ресторан каннибалов; старое не отменили, просто нарастили начало. 14:47 — Миколай замечает, что у Славы «частенько тема мести», и Антона тут же определяют как одного из двух мстящих. 14:58 — Слава фиксирует, что надо запомнить: «импульсивный, решительный» и узел с мальчиком, которого ждал дед. Тогда же Миколай предлагает переставить начало — обсудили и не довели. 2025-03-14 — линия закрывается, но уже в чужой истории, где Антон не главный и появляется одним абзацем в конце. Дальше к нему не возвращались.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для одной души правило названо количественно: чистота меряется процентом, порог «где-то на 80% плюс минус», у Антона 89, и прямо сказано, что перечисленные им грехи — пил, курит, калечил людей, «почти что суицидник» — этой цифры не роняют. Рядом, в той же истории, стоит соседний случай того же рода: в одном теле две души, и обе, по словам Дмитрия, чистые. Чья цифра эти 89, считаются ли души по отдельности, складываются ли, что было бы, будь вторая грязной, — не проговорено, хотя обряд построен именно на проходящей через душу силе. Правило для одной души есть, для двух в одном теле — нет. Показываю место.</p>\n<h3>Отклик</h3>\n<p>Тут отлично работает механика, которую никто не проговаривает вслух: он отбивает мальчика у похитителя и ровно этим занимает его место на алтаре. Спас ребёнка — стал материалом вместо ребёнка, и старик, увидев его, буквально радуется апгрейду: «И ждал ребенка, чтобы использовать его как проводник. Но как удачно появился ты». Праведность здесь не награждается и не наказывается, она просто подставляет. И то же самое второй раз: брат перед исчезновением просит его прекратить, «Хватит рисковать собой, прошу тебя», а Антон в ответ идёт наниматься в организацию, где рисковать собой — должностная обязанность. Просьбу он выполняет наоборот и даже не замечает. Ещё зацепила первая реакция Миколая на всё это — «спасибо за человеческое имя». После истории с пыткой молотком, каннибалами и мозгом на алтаре читателя больше всего порадовало, что героя зовут Антон Смирнов. Смешно и, кажется, честно.</p></div>", "r": []}];</script>
