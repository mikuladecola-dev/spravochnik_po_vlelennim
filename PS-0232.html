<script>const BASE="";const DOCNAME="Упырь-рассказчик";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0232-S01", "PS-0232--proishozhdenie"], "h": "<p>Персонаж Славы, изложен целиком за один заход (2025-03-19, id 305854–305858, окно w0083). Первая часть истории ведётся от его первого лица — он и рассказчик, и герой. Во второй части повествование переходит к другим персонажам, и он появляется уже снаружи, под словом «чужемирец» (в одном месте написано «чудемирец»).</p>\n<p>Родом он из технологически развитого мира. Мир этот, по его словам, «смогли уйти далеко вперед. За счёт того, что сконцентрировались на проблемах земли, а не о других планетах. Ведь какая к чёрту разница на другие планеты. Если собственная умирает». Именно из этих рассуждений и вышло их продвижение.</p>\n<p>Мир сумел установить связь с другими мирами, но связь была неполноценной: «Мы могли получать обрывки информации, от разных миров. С помощью связи нашего мира с другими. Но опять же она не было постоянной и стабильной». Принцип связи до конца не поняли. Успели узнать: первым миром считают «кильку»; существа других миров способны покидать свой мир, и жители его мира тоже могут покинуть свой. Но не хотели: «большинство миров. О которых мы узнали информацию. Словно ад наяву. Поэтому мы лучше поживём в своём мире».</p>\n<p>Дальше пошли сообщения о разрушении других миров: «У них разбивалось солнце. И начиналось эпидемия неизвестно болезнью в их нём мире». Так произошло в трёх мирах — точнее, в трёх мирах, где это удалось зафиксировать. Отсюда страх, что их мир следующий. Готовиться толком не умели, смогли только «состряпать теорию. Что все нападения на миры. Были устроены из Рая. Второго мира, который появился после Кильке». Теория без стопроцентных фактов. Практическая подготовка свелась к строительству бункеров: «Просто почти все начили строить бункер. Сейчас я прекрасно понимаю, что это не поможет. Лишь трата ресурсов».</p>\n<h3>Катастрофа</h3>\n<p>Примерно через три года после того, как узнали о разрушении других миров, «в тот момент, когда мы уже как-то расслабились», солнце начало трескаться — «Словно стекло. Это по всем законам физике невозможно. Но это было». Не прошло и пары минут, как оно разбилось на миллиарды светящихся кусочков, направившихся на все населённые территории. Осколки накрыли 78% всей суши земли и 12% воды на планете.</p>\n<p>Цифры даны в тексте подробно: осколки преодолели расстояние от солнца до земли в 149 597 870 700 метров за 3 минуты и 36 секунд, то есть двигались с постоянной скоростью 694.444,44 км/с. Сбить их было невозможно — «наший самый технологические сбиватели ракет. Не смогли попасть в осколки». Отдельно оговорено: объект такой скорости даже массой в 1 кг «всё равно бы снесла бы всю нашу планету нахер», но, заходя на орбиту, осколки замедлились. Насколько — рассказчик не знает («в тот промежуток времени мы все в панике бегали туда сюда»), предполагает, что раз в 10 или больше, раз 17% людей остались живы. Про это выживание он говорит: «Не знаю, каким чудом. Возможно наш правитель подсобил».</p>\n<p>Раскол солнца был лишь первой волной. После началось заражение и появление заражённых, «которых в других мирах называют Пераг». Пераги — люди, обрастающие белыми перьями, «Словно они состоят из чистого серебра». Они становятся похожи на ангелов из мифов, «Но лишь похожими. На деле это были чудища. Монстры у которых главная цель убить всё разумной на планете Земля. Падший ангелы». Их соотношение к людям — «23 заражённых на одного человека. Где-то так».</p>\n<h3>Обращение в упыря</h3>\n<p>После катастрофы среди выживших начали появляться упыри — «где-то 30-40 процентов выживших стали упырями». Определение дано прямо: «Это не люди, которых тяжело убить». Дальше идёт перечисление: «Ты можешь скинуть его с небоскреба. Но он выживет. Ты можешь подорвать его или жечь. Он выживет. Ты можешь продырявить ему черепушки, что аж мозги будут видно. Но он выживет. Ты можешь выпотрошить или утопить его. Но он выживет».</p>\n<p>Откуда взялись упыри — не решено самим рассказчиком: «Это заража из рая. Или это попытка правителя спасти людей. Не знаю».</p>\n<p>Рассказчик — упырь. Он подчёркивает, что своё «я» не терял, и объясняет почему: «Потому-что у меня была цель. Я должен был защитить тех 38 людей. Они нуждались во мне. Поэтому я не мог дать слабины».</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Отклик — не материал авторов</b>\n<p>Сильнее всего тут сделан не сюжет, а перемена голоса. Первую половину он рассказывает сам — с оговорками, с извинениями за сбивчивость («Я забыл упомянуть. Мысли скопканы»), со счётом потерь, который ведёт против себя: «за 6 лет умерла из них 19. Половина. Я слабак». Во второй половине он не рассказывает ничего. Его называют «туша», он не произносит ни слова, действует «подобное зверью» и погибает. Про потерю «я» в тексте нет ни одного утверждения — она просто происходит с повествованием, а не с героем. Это сильный ход, и, судя по всему, не отрефлексированный: в пробелах честно записано, что сохранил ли он себя, прямо не сказано. Ещё зацепила арифметика солнца — 149 597 870 700 метров за 3 минуты 36 секунд, 78% суши и 12% воды, — которую человек в панике зачем-то запомнил до последней цифры; и отказ от обезболивающего, объяснённый не героизмом, а расчётом: «Я же всё равно не умру от боли. Оставьте лучше для людей». Персонаж, у которого нет ни имени, ни возраста, ни лица, ни мира с названием, всё равно узнаётся — по тому, как он считает. И то, что он погибает от собственного удара, сымитированного чужой способностью, — самая аккуратная деталь во всём заходе.</p></div>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0232-S02", "PS-0232--vneshnost"], "h": "<p>Собственную внешность он описывает одной характеристикой, в противопоставлении ангелу: «Я уродливый и страшный. Отражения этого тёмного и страшного мира. Защищаю и стараюсь спасти людей. А ангел. Белый и чистый. Лишь убивает». Других черт внешности в переписке не дано.</p>\n<p>Основная описанная деталь облика — экзоскелет, в котором он находится со второй половины первой части и до конца. Экзоскелет «вышел грубым», собран шестью учёными «Из всех имеющих ресурсов». Тело под ним изменено при надевании: отрезано несколько конечностей, вырваны органы, продырявлен череп (см. раздел «Способности»). В бою экзоскелет скрипит при предельном усилии: удар по вбитому в скалу защитнику наносится, «Рвя мышцы и заставля скрипеть экзоскелет».</p>\n<p>Во второй части его называют «туша» — при появлении из чёрной дымки имитатор «принимает эти две туши на себя».</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0232-S03", "PS-0232--harakter"], "h": "<p>Держится на цели и на счёте потерь. Собственную живучесть он не считает силой: подчёркивает, что упырь «не владеет, какой-то сверхчеловеческой силой или скоростью. Он просто живучий и всё».</p>\n<p>Отношение к 38 подопечным: «Я приносил им еду, одежду и лекарства. Я помогал». Отношение к результату: «Но я не всесилен. И за 6 лет умерла из них 19. Половина. Я слабак. Я должен был их защитить. Ааа...»</p>\n<p>Отказ от обезболивающего при надевании экзоскелета сформулирован как расчёт, а не как поза: «Они хотели. Использовать обезбаливающее. Но зачем? Я же всё равно не умру от боли. Оставьте лучше для людей. Для тех кто выжил. А я смогу и так».</p>\n<p>Отношение к перагам и Раю: «Нет раз уж эти твари заявились сюда. То они получат достойнный отпор. Хотя бы от меня».</p>\n<p>Отказ от бегства через чёрную дымку — сознательный, при том что он сам догадывается, что дымка спасает: «Но нет я не сбегу. Я убью или буду убить. Я не уйду. Я стоял, держался. Не улитая в эту дымку».</p>\n<p>Собственную речь он один раз комментирует как сбивчивую: «Я забыл упомянуть. Мысли скопканы».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0232-S04", "PS-0232--sposobnosti"], "h": "<h3>Живучесть упыря</h3>\n<p>Базовое свойство — не сила и не скорость, а нечувствительность к повреждениям: падение с небоскрёба, подрыв, огонь, пробитый череп «что аж мозги будут видно», потрошение, утопление — всё это упырь переживает. Список в переписке оборван словами «И так я могу перечислять до бесконечности».</p>\n<p>Цена свойства — два «минуса», названные в тексте именно так.</p>\n<p>Первый минус — каннибализм: «У них невероятный голод. Подобно... Не знаю с кем подобно. Это просто был голод, который не как не удовлетворить, что бы они не ели. Но если они съедят человечину. Этот бесконечный голод утихнет. И они смогут стать счастливы». Отдельно оговорено, что этот минус сам по себе был бы переносим, потому что «пераги это люди. Их можно есть. Жувать. Глотать».</p>\n<p>Второй минус — потеря «я»: «В том что мы теряли своей собственной \"я\". Деградируя. Нет кому-то удавалось вернуть своей \" Я\". А кому-то даже продержатся 3 года. Но по итогу всегда всё заканчивалась тем, что они теряли снова или первый раз. Без разницы. Они всë равно теряли своей \"я\"».</p>\n<p>Рассказчик — исключение, удерживающее «я» целью защиты 38 людей.</p>\n<h3>Экзоскелет</h3>\n<p>Экзоскелет собран шестью учёными из всех имеющихся ресурсов, грубый. Условие надевания: «Нужно было отрезать несколько конечности. Вырвать органы и продырявить череп. Обычный человек его никогда в жизни не сможет одеть». Он вызвался сам, потому что мог. Обезболивающее отверг.</p>\n<p>Процесс: «Было больно да. Я словно был пол пытками четырнадцать дней. Ну я смог. Я вытерпел и не потерял себя».</p>\n<p>Результат: «И стал сильнее, быстрее. Теперь я стал живым оружием». В экзоскелете он побеждал и уничтожал перагов — это и стало причиной ответа Рая.</p>\n<p>В бою второй части его удары описаны как ощутимые даже для благословенных: удар по защитнику назван «сильный и мощный ударь. А главное неожиданным», а серия ударов почти вырубает защитника. Он способен схватить противника за челюсть, использовать как щит и бежать вперёд, пробивая деревья, пока не останавливает скала.</p>\n<p>Устойчивость в бою: усиленный благословением удар защитника по челюсти даёт результат — «У упырья пошла кровь не более. Он не пошатнулся или даже не закрыл глаза». Удар по повреждённому месту на спине — «упырь даже не скрикнул». Прямое попадание всех перьев ангела, «особый способ усиления» имитатора, разрушающий землю и деревья, — всё это его отбрасывает, но не останавливает.</p>\n<p>Никакого благословения у него нет: благословения, по объяснению имитатора, может получать «только разумный житель кильке. Первого мира», а он — чужемирец.</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0232-S05", "PS-0232--svyazi-s-drugimi"], "h": "<p><strong>38 подопечных.</strong> Люди, которых он защищал шесть лет. Из них 19 умерли — «Половина». Кто они, как собрались вместе и как погибли оставшиеся, в переписке не сказано; известно только, что в конце дома он застал «лишь кровь и боль» и ангела.</p>\n<p><strong>Шесть учёных.</strong> Собрали для него экзоскелет из всех имеющихся ресурсов. Больше о них ничего не сказано, их судьба не названа.</p>\n<p><strong>Ангел.</strong> Тот, кто уничтожил его дом и подопечных. Описан подробно: «Гуманоид, состоящий только из белых перьев. Он был вытянутым. По два метра ростом. У него было две пары рук и две пары крыльев. И вертикальный глаз один. Но он был закрыть». И — «и нимб у него был. Как в сказках. Ну что за бред». Ангел стреляет перьями из крыльев, при открытии глаза бьёт струёй огня и создаёт вокруг себя пламя, крыло в момент удара «твёрже железа и острей ножа». Именно ангел, влетев в рассказчика, утащил его вместе с собой в чёрную дымку. В бою второй части они оказываются на одной стороне не по союзу, а по совпадению: перья ангела попадают по упырю, а упырь, разогнанный ударом имитатора, врезается в ангела и валит его вместе с собой.</p>\n<p><strong>Чёрная дымка.</strong> Средство перехода между мирами. Появилась у него за спиной и тянула к себе. Его собственное объяснение — догадка: «Это правитель пытается меня спасти. Отправив в другой мир». Подтверждения этой догадке в переписке нет.</p>\n<p><strong>Правитель его мира.</strong> Упомянут трижды и всякий раз предположительно: как возможная причина того, что 17% выжили («Возможно наш правитель подсобил»), как возможный источник упырей («попытка правителя спасти людей»), как возможный отправитель дымки. Ни одно предположение не подтверждено.</p>\n<p><strong>Имитатор.</strong> Апостол, мужчина «лет 20-30. В белой рубашке и в тёмных брюках», настоящего имени не называет никому («Да и помни ли он сам его. Спорный вопрос»). Заранее знал о появлении чужемирца, ждал его к 21:00–21:30 и только в последний момент засёк, что их будет двое. Именно он убивает упыря.</p>\n<p><strong>Защитник (Александр).</strong> Апостол, потерявший жену и дочь. Ждал чужемирца, чтобы убить его: «я не уйду. Здесь появиться чужемирец и я его убью. Чего бы мне это не стоило». Основной противник упыря в бою второй части.</p>\n<p><strong>Апостолы, благословения, миры.</strong> Через разговор имитатора с защитником, вставленный воспоминанием, задана рамка мира, в который упырь попал: в каждом мире есть правитель; сила, которую получает человек, называется благословением; правитель другого мира устанавливает связь и через неё даёт силу; каждый правитель может дать ограниченное количество благословений; благословение может получить только разумный житель Кильки, первого мира; апостолы — люди, получившие благословение от правителя Рая, второго мира, появившегося после Кильки, и их 21 во всём мире. Четыре базовых способности есть у всех благословенных: «усиления, самоисцеления, энергия и сенсорика». У апостолов, в отличие от прочих, способность формируется уникально у каждого, у благословенных одним правителем способности одинаковые. Связь устанавливается с мозгом, сила проходит через мозг и повреждает его, поэтому благословение нельзя использовать 24/7; в голове есть предохранитель, который при выгорании мозгов отключает благословение. Фраза имитатора «Но его можно» обрывается на середине.</p>", "r": []}, {"t": "Как менялся", "a": ["S06", "PS-0232-S06", "PS-0232--kak-menyalsya"], "h": "<p>Версия одна. Весь материал изложен в один день (2025-03-19, id 305854–305858), задумка внутри этого захода не пересматривалась, отклонённых вариантов в переписке нет. Ниже — путь персонажа внутри самой истории.</p>\n<p><strong>Житель технологического мира.</strong> До катастрофы — один из тех, кто знал о других мирах обрывками и предпочитал в них не соваться, строил бункер вместе со всеми.</p>\n<p><strong>После раскола солнца.</strong> Один из 17% выживших, затем один из тех 30–40% выживших, кто стал упырём. Держит «я» за счёт цели — 38 подопечных.</p>\n<p><strong>Шесть лет защиты.</strong> Носит еду, одежду и лекарства. Теряет 19 из 38.</p>\n<p><strong>После экзоскелета.</strong> Четырнадцать дней боли, отрезанные конечности, вырванные органы, продырявленный череп. «Стал сильнее, быстрее», «живым оружием», уничтожает перагов, побеждает.</p>\n<p><strong>После гибели подопечных.</strong> Возвращается с вылазки с едой, застаёт кровь и ангела. Утрата опоры сформулирована прямо: «Я потерял свою нить. Держащий меня. Теперь и еë нету. Я перестану быть собой. Я лишь упырь. Я заревел. Подобное зверью».</p>\n<p><strong>После перехода.</strong> В новом мире он уже не рассказывает — только действует. Ведёт себя как зверь: срывается на защитника «подобное зверью», атакует имитатора, «Считая его врагом». Разговоров с его стороны в бою нет ни одного. Сохранил ли он «я» после дымки — в переписке не сказано.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0232-S07", "PS-0232--chto-s-nim-stalo"], "h": "<p>Погиб в бою во втором мире, куда его утащила чёрная дымка вместе с ангелом.</p>\n<p>Ход боя: имитатор принимает обоих на себя, отталкивая защитника. Упырь пытается атаковать имитатора, тот уходит от ударов и заходит за спину; в упыря попадают все перья ангела; удар имитатора по спине разгоняет упыря так, что он врезается в ангела и валит его. Затем «особый способ усиления» имитатора — удар по воздуху, разрушающий землю и деревья, — отбрасывает обоих.</p>\n<p>Дальше упырь бьётся с защитником. Усиленный благословением удар по челюсти даёт только кровь. Защитник бьёт по следу от удара имитатора на спине — упырь не вскрикивает. Вернувшийся имитатор отбрасывает упыря усиленным ударом далеко в чащу. Оттуда упырь выпрыгивает, наотмашь бьёт защитника, наносит череду ударов, хватает за челюсть, использует как щит, пробивает деревья, впечатывает защитника в скалу и наносит «возможно свой сильнейший удар. Рвя мышцы и заставля скрипеть экзоскелет». Скала разлетается.</p>\n<p>Защитник приходит в себя от воспоминания о дне, когда он никого не смог защитить, и бьёт — руки и ноги у него становятся оранжевыми. Ломает упырю нос, кость, рвёт мышцы, сбивает с ног, садится сверху и продолжает бить, пока не ломаются пальцы и не рвётся кожа, пока не бьёт «уже не кулаком, а культяпкой». Благословение отключает предохранитель. Упырь, заметив слабину, бьёт наотмашь — удар стал слабее, «Но всё также опасным» — и защитник отлетает к дереву.</p>\n<p>Убивает упыря имитатор. «Упырь встаёт. На двигаясь к защитнику. Как вдруг из его груди. Показались пальцы. И вдруг грудь упырья. Начала надуваться мелкими и большими оранжевыми пузырьками. И БАМ. Упырь взрывается». Мысль защитника: «Он сымитировал мою способность».</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0232-S08", "PS-0232--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имя не названо. Он проходит как рассказчик, как упырь и как «чужемирец»; во второй части один раз — «чудемирец».</li>\n<li>Внешность вне экзоскелета не описана, кроме самооценки «Я уродливый и страшный».</li>\n<li>Возраст, профессия, семья, положение до катастрофы — ничего не сказано. Неизвестно даже, был ли он кем-то до катастрофы, кроме «житель одного технологического развитого мира».</li>\n<li>Кто такие 38 подопечных, как они собрались вокруг него и как погибли 19 за шесть лет — не сказано. Как погибли оставшиеся 19 в день прихода ангела — тоже: он застаёт «лишь кровь и боль».</li>\n<li>Ел ли он человечину, глушил ли голод и как жил с ним шесть лет — в переписке не сказано ни разу.</li>\n<li>Название его мира не дано. Он говорит про «планету Земля» и «земли», но собственного имени мира нет.</li>\n<li>Кто такой «наш правитель» и что он в действительности сделал — не решено внутри самого текста: все три упоминания даны как догадки самого рассказчика.</li>\n<li>Природа упырей осталась нерешённой прямым авторским текстом: «Это заража из рая. Или это попытка правителя спасти людей. Не знаю».</li>\n<li>Механика чёрной дымки, кто её открывает и по какому принципу, не объяснена. Почему её ожидали в конкретном мире к 21:00–21:30 и откуда имитатор об этом знал — не сказано.</li>\n<li>Сохранил ли упырь после перехода своё «я» — прямо не сказано; в бою он не говорит и действует «подобное зверью», но утверждения о потере «я» в тексте нет.</li>\n<li>Взаимодействие упыря и ангела после перехода не объяснено: они бьются в одной свалке, но союзниками не названы и между собой не сталкиваются намеренно.</li>\n<li>Фраза имитатора о предохранителе оборвана на «Но его можно» — как именно его отключать, не досказано; позже упомянуто только, что «имитатор не научил вырубать этот предохранитель».</li>\n<li>Дальнейшая роль персонажа не задана: он погибает в конце единственного захода, продолжения в переписке нет.</li>\n</ul></div>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Второе — февральский слой. <code>PS-0202</code> «Чужемирец (герой истории про сломанное солнце)» (5 489, статья есть, одна ссылка, дата 2025-02-25) — это, судя по всему, он же, за месяц до самой истории, и там ему прямо назначена дальнейшая роль: «Ну этот чужимириц будет работать в организации», плюс «Плюсом я хотел показать вирус перьев», «Вместе с серафимом». Статья <code>PS-0232</code> при этом держит пробел «Дальнейшая роль персонажа не задана: он погибает в конце единственного захода, продолжения в переписке нет». Либо это два разных чужемирца, либо пробел закрывается чужой записью — проверить надо до всего прочего, потому что от ответа зависит, финал это или пролог.</p></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0232--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0021.html\">Упыри</a></li>\n<li><strong>Упомянут в мирах:</strong> <a href=\"MR-0124.html\">Чёрная дымка</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0021.html\">Упыри</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0232--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-03-19</td>\n<td>305854–305858</td>\n<td>w0083</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0232-upyr-rasskazchik.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0232--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0232.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0232-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0232/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дыра здесь не в отсутствующих статьях — всё, что персонаж называет, статьи имеет: <code>PS-0233</code> Ангел (28 551), <code>PS-0199</code> Пераг (44 124), <code>MR-0124</code> Чёрная дымка (28 831), <code>SP-0210</code> Экзоскелет (16 871), <code>SP-0204</code> Предохранитель (17 153), <code>SP-0207</code> Живучесть упыря (15 808), <code>SP-0208</code> Голод упыря (15 749), <code>PS-0231</code> Упыри (17 407), <code>IS-0017</code> Защитник (139 029), <code>PS-0271</code> Александр Титовский (59 077). Дыра в том, что его собственная катастрофа осиротела.</p>\n<p><code>MR-0123</code> «Раскол солнца» — 18 152 знака, статья есть, ссылок ноль. На неё не ссылается никто во всём справочнике, включая эту статью, при том что раскол солнца — центральное событие его жизни и половина его текста. То же с <code>MR-0110</code> «Мир без солнца» (23 565, статья есть, ноль входящих). Это чинится первым: не писать, а связать.</p>\n<p>Второе — февральский слой. <code>PS-0202</code> «Чужемирец (герой истории про сломанное солнце)» (5 489, статья есть, одна ссылка, дата 2025-02-25) — это, судя по всему, он же, за месяц до самой истории, и там ему прямо назначена дальнейшая роль: «Ну этот чужимириц будет работать в организации», плюс «Плюсом я хотел показать вирус перьев», «Вместе с серафимом». Статья <code>PS-0232</code> при этом держит пробел «Дальнейшая роль персонажа не задана: он погибает в конце единственного захода, продолжения в переписке нет». Либо это два разных чужемирца, либо пробел закрывается чужой записью — проверить надо до всего прочего, потому что от ответа зависит, финал это или пролог.</p>\n<p>Третье: его мира и его правителя в базе нет вообще. Ни статьи, ни исходника, ни кода. «Наш правитель» упомянут в тексте трижды и все три раза догадкой, название мира не дано — и завести под это нечего, сущность не заведена. Это самая дешёвая по материалу и самая безнадёжная по содержанию дыра из трёх.</p>\n<h3>С чего начать</h3>\n<p>В базе — три записи, лежащие вплотную и не сведённые.</p>\n<p><code>MR-0123</code> «Раскол солнца» покрывает 2025-03-19 и 2025-03-20, id 306119–306135. У <code>PS-0232</code> таблица источников кончается на 305858, то есть весь разговор следующего дня в статью не попал. А там существенное: разбор цифр при чтении, вопрос про соотношение суши и воды («Как у нас»), «чет вычисления странные», «в че тогда так много суши захватило, как будто специально» — и ответ Славы, что осколки шли в населённые территории намеренно. В статье проценты стоят, намеренности нет. Это правится напрямую из базы.</p>\n<p><code>PS-0202</code> (295222–295245, окно w0077) и <code>MR-0110</code> (2025-02-24) — февральская подводка. Туда же <code>SL-0063</code> «Три рассказа: Защитник, Чужемирец, Бессмертный» (2 438, статьи нет, ноль ссылок): запись, которая ставит его историю в один ряд с двумя другими, то есть предполагает цикл.</p>\n<p>Смежное, тоже готовое и не подцепленное с этой стороны: <code>SP-0210</code> Экзоскелет — на него ссылаются <code>SP-0204</code>, <code>SP-0205</code> и <code>GR-0021</code>, а он у этого персонажа основной облик и главное действие, и в «Связях» его нет; <code>PS-0198</code> Чужемирцы (58 680) — категория, под которую он попадает во второй части; <code>PR-0061</code> (34 415) — та же проза, из которой всё собрано.</p>\n<p>В архив идти за одним и, скорее всего, впустую: 38 подопечных, шесть учёных и название мира. По всем трём в базе пусто, а окно w0083 у истории одно. Ориентир, если искать: февраль 2025, w0077, вокруг 295222–295245 — там обсуждалось, зачем эта история вообще нужна, и если про мир что-то говорилось, то там.</p>\n<h3>Как развивалось</h3>\n<p>Заявили и исчерпали в один день: 2025-03-19, id 305854–305858. Внутри захода нет ни одной правки и ни одного отклонённого варианта — текст идёт подряд и заканчивается смертью героя. Ограничили тем же текстом и изнутри: упырь «не владеет, какой-то сверхчеловеческой силой или скоростью. Он просто живучий и всё», благословения у него быть не может, потому что чужемирец. Следующий день, 2025-03-20, — разбор арифметики, но не персонажа: считали осколки, не его. Дальше не возвращались ни разу. Зато материал разошёлся: из этих пяти сообщений собраны ангел, пераги, экзоскелет, предохранитель, живучесть, голод, упыри, раскол солнца и чёрная дымка — девять записей, и все живут дальше без него. Если <code>PS-0202</code> — это он, то ход у линии обратный обычному: сначала, в феврале, персонажу назначили работу в организации и функцию показать вирус перьев, а через месяц написали историю, в которой он погибает.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>В этом мире у каждой силы названа цена, и названа дважды. У благословения: связь садится на мозг, сила идёт через мозг и вредит ему, поэтому пользоваться круглосуточно нельзя, в голове стоит предохранитель. У живучести упыря: два минуса, названные прямо так, — неутолимый голод и потеря «я». У экзоскелета названа только цена входа: четырнадцать дней боли, отрезанные конечности, вырванные органы, продырявленный череп, обычному человеку не надеть. Цены использования нет. Он в нём «стал сильнее, быстрее», «живым оружием», при предельном ударе экзоскелет скрипит, а сам он рвёт себе мышцы — но берёт ли эта сила что-то постоянно, как благословение берёт мозг, а упыризм берёт «я», не сказано. Для двух источников силы правило «сила берёт своё» проговорено, для третьего, стоящего в том же ряду, — нет.</p>\n<h3>Отклик</h3>\n<p>Сильнее всего тут сделан не сюжет, а перемена голоса. Первую половину он рассказывает сам — с оговорками, с извинениями за сбивчивость («Я забыл упомянуть. Мысли скопканы»), со счётом потерь, который ведёт против себя: «за 6 лет умерла из них 19. Половина. Я слабак». Во второй половине он не рассказывает ничего. Его называют «туша», он не произносит ни слова, действует «подобное зверью» и погибает. Про потерю «я» в тексте нет ни одного утверждения — она просто происходит с повествованием, а не с героем. Это сильный ход, и, судя по всему, не отрефлексированный: в пробелах честно записано, что сохранил ли он себя, прямо не сказано. Ещё зацепила арифметика солнца — 149 597 870 700 метров за 3 минуты 36 секунд, 78% суши и 12% воды, — которую человек в панике зачем-то запомнил до последней цифры; и отказ от обезболивающего, объяснённый не героизмом, а расчётом: «Я же всё равно не умру от боли. Оставьте лучше для людей». Персонаж, у которого нет ни имени, ни возраста, ни лица, ни мира с названием, всё равно узнаётся — по тому, как он считает. И то, что он погибает от собственного удара, сымитированного чужой способностью, — самая аккуратная деталь во всём заходе.</p></div>", "r": []}];</script>
