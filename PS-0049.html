<script>const BASE="";const DOCNAME="Кирилл";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0049-S01", "PS-0049--proishozhdenie"], "h": "<p>Персонаж существует в переписке в двух несведённых видах, под одним именем.</p>\n<p>Первый — карточка Славы во вселенной «игра бога» (2024-04-03, окно w0029, id 153368): имя, три строки свойств и одна способность, без биографии и без окружения. Это самая ранняя запись о нём, и дальше эта версия нигде не развивается.</p>\n<p>Второй — мальчик из вселенной «монстры», введённый Миколаем 2024-08-10 (окно w0050, id 217239–217240) сразу целиком, вместе со всей своей историей: от привычек до смерти. Именно этот Кирилл разрабатывается дальше на протяжении трёх окон (w0050, w0051, w0052) и служит разбираемым примером механики материализации.</p>\n<p>Связь между карточкой из «игры бога» и мальчиком из «монстров» в переписке не оговорена: нигде не сказано, что это один персонаж, и нигде не сказано, что это разные. Обе версии зафиксированы ниже как есть.</p>\n<p>Внутри вселенной «монстры» текст о Кирилле начинается с правила мира: «дети и животные могут видеть мистических существ, а до 4 лет психического возраста их душа способна взаимодействовать с иным миром напрямую, поэтому если недоглядеть за ними их за руку могут увести монстры в мир иной и с вами останется лишь их физическая оболочка, так что нужно быть внимательнее». Кирилл — тот, на ком это правило показано.</p>\n<p>Ему 6 лет, психических «почти 4» — то есть он на самой границе названного возраста. Семья благополучная: «в семье нашего главного героя всё под контролем, не было ещё такого, чтобы родители ругали ребёнка, а он разочаровывал их своим поведением». Родители за него почти не беспокоятся, и у них «есть приличное количество времени на работу и личные дела».</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0049-S02", "PS-0049--vneshnost"], "h": "<p>Внешность в переписке не описана — ни в одной из версий. Названы только возраст (6 лет) и психический возраст («почти 4»).</p>\n<p>Косвенно к облику относится момент на балконе: Кирилл коснулся руки Беркута, «посмотрел назад и увидел на свое спине крылья» (2024-08-10, id 217239). Как эти крылья выглядели и были ли они видны кому-то ещё, не сказано.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0049-S03", "PS-0049--harakter"], "h": "<p>По карточке «игры бога» (2024-04-03, id 153368): «Спокойный, тихий. Спортивный».</p>\n<p>По тексту вселенной «монстры» (2024-08-10, id 217239) — «довольно спокойный и умный ребёнок». Как только к нему в руки попал планшет, «Кирилл сразу увлёкся этим гаджетом, мог часами в нем сидеть не отрываясь». Каждый раз, приходя из заведения дошкольной программы, он шёл в свою комнату и писал другу по парте Паше, чтобы поиграть по сети в популярную нынче шутер-мобу (MOBA).</p>\n<p>Отдельная черта — увлечения, доведённые до предела. Он «прочёл весь фандом той игры и очень влюбился в Беркута, знает все его особенности наизусть». Он фанат субкультуры териан, листает короткие видео о них, и его смущает, «что нету не одного териана орнитотропа, как минимум летающего».</p>\n<p>Главное в нём — желание летать: «вот сидит этот парень в парке на скамейке с родителями и каждый раз как видит самолёт в небе кричит \"самолёт\". Он хочет летать, познать всё величие этой вечно лазурной пелены небесной характерной для его региона. неудивительно, что Кирилл так восхищается этими грациозными созданиями».</p>\n<p>Названа и черта, которая отличает его от всех остальных: когда Беркута уже боялись все, Кирилл «был единственный, кто не боится его и хочет встретить».</p>\n<p>В момент, когда он уже летает, его состояние описано так: «астрал Кирилла наполнен любознательностью, он задаёт миллионы вопросов и получает ответы».</p>", "r": []}, {"t": "Терианство и происхождение Беркута", "a": ["S04", "PS-0049-S04", "PS-0049--terianstvo-i-proishozhdenie-berkuta"], "h": "<p>Разбор 2024-08-11 (окно w0051, id 217727–217762) уточняет, кем именно Кирилл себя считал. Териане «так прям живут»; «кирил к ним относил себя»; «но он считал себя птицей». Отсюда и облик монстра: «поэтому беркут был частично похож на человека, который с оперением на голове».</p>\n<p>Слава задал серию возражений подряд: «Почему самого начал не выпрыгнул с окна», «Почему разговаривал», «Почему не ел червей», «Почему разетку не вставлял», «Почему не издавал звука полнта» (id 217734–217736, 217747, 217749). Ответ Миколая: «он не имеет крыльев», «и не мог даже с земли взлететь», «он искал способ полететь» (id 217739–217741). Дальше формулировка меняется на другую: «тогда иначе выражусь», «он был квадробером», «это терианы которые не всегда себя так ведут», «это типо спорт» (id 217745–217748, 217752).</p>\n<p>Причина, по которой Кирилл не вёл себя как птица постоянно: «он не видел примера где кто-то так делал», «ни одной птицы квадробера нет», «поэтому он в основном изучал их», «чтобы потом практиковаться» (id 217754–217757). И дальше — «удачная возможность», «появился пример», «появились крылья», «хули не попробовать» (id 217759–217762).</p>\n<p>Происхождение самого Беркута уточнено 2024-08-11 (id 217693): «кстати, Кирилл играл в альтернативную для своей вселенной версию бравл старса, а беркут это пародия на ворона». Реакция Славы: «А так бы сразу сказал» (id 217694). Легендарный персонаж «Беркут» выпал Кириллу из ящика — «его радости не было предела»; после нескольких каток он «с горящими глазами, пусть и утомлённый мечтал о том, как бы встретить его в реальной жизни».</p>\n<p>Материализация описана с оговорками (id 217239): «конечно такое сильное желание встретиться с ним не могло не материализовывать это существо (понятное дело он не первый и не единственный, кто о Беркуте думает, так что это не уникальная материализация, точнее субъективное представление разное у всех, но так это не единственный в своём роде \"Беркут\" из той же игры, того же авторства. в нашем случае он не может не летать)». Поскольку мальчик изучал его не только в игре, «синтез его видения в реальной жизни отличался»: у монстра были характерные для териана черты, «но настоящими крыльями и головой, даже точный видовой киль имеется».</p>\n<p>Дальше работает распространение. Сначала — слухи, которые Кирилл распространял в своей подгруппе на занятиях, «мол видел он его, хотя очевидно это ложь». Из подгруппы слух разнесли дальше: «его облик на мгновение уже могли видеть психически маленькие носители информации и своей уверенностью и широким распространением создавали более сильный и чёткий образ монстра, естественно добавляя ему негативных коннотаций». При этом «пока его все боялись, поэтому никто не связывался с иным миром через него», и «пока ещё Кирилл его не видел».</p>", "r": []}, {"t": "Способности", "a": ["S05", "PS-0049-S05", "PS-0049--sposobnosti"], "h": "<p><strong>Во вселенной «игра бога»</strong> (2024-04-03, id 153368): «Способность: телепортировать 1 человека, которого он видел он способен телепортировать его только рядом собой. То бишь он может призвать врага или наоборот если его окружат будет способен телепортировать друга».</p>\n<p>То есть телепортация одного человека, которого Кирилл видел, и только к себе. В карточке сразу даны два способа применения: притянуть врага и вытащить друга, если Кирилла окружат.</p>\n<p><strong>Во вселенной «монстры»</strong> собственных способностей у Кирилла нет. Его место в механике другое — он родитель монстра.</p>\n<p>Роль родителя разобрана 2024-08-11 (id 217911–217921). На вопрос Славы «И почему монстр не умер, если Кирилл сдох» (id 217912) ответ: «так не один Кирилл в него верит, родители в плане тот кто определяет его характер», «его внешность и суть» (id 217913, 217915). Вера при этом «определяет силу его материализации не более» (id 217917). Убить материализацию можно: «если ты взаимодействуешь с этой материализацией, ты можешь её убить», «он может умереть» (id 217918–217919). И отдельно: «и если бы Кирилл был жив была бы возможность возродится» (id 217920). Реплика Славы на это — «Но вера осталась» (id 217921); ответа в переписке нет.</p>\n<p>2024-08-12 (окно w0052, id 218471–218498) Кирилл разбирается как показательный случай. Слава: «Откуда люди могут верить монстра про которого рассказал родитель», «Это же не реально», «Как его друзья в это поверили» (id 218471–218472, 218476). Ответ: «реально но сложно» (id 218473), «в бога же кто-то верит» (id 218477) — и главное: «а ничего что его друзья дети?» (id 218482). То есть вера у друзей Кирилла возникла именно потому, что они дети.</p>\n<p>Возражение Славы про механику веры: «Так это разная вера в бога создавалось очень долго и это было в трудные времена в которых кроме веры ничего не оставалось» (id 218479). Отдельно он спрашивает, не расплодятся ли монстры, если поверившие расскажут ещё десяти друзьям (id 218478, 218488). Ответ: «у одного родителя один», «знающие его усиливают» (id 218489–218490); «по сути в мире их приличное количество», «но они не разнообразные» (id 218497–218498). Кирилл здесь — пример того, почему его друзья остаются знающими, а не становятся родителями.</p>", "r": []}, {"t": "Связи с другими", "a": ["S06", "PS-0049-S06", "PS-0049--svyazi-s-drugimi"], "h": "<p><strong>Беркут</strong> — монстр, родителем которого Кирилл является. Связь двойная: Кирилл создал его своим представлением (и потому Беркут в его версии «не может не летать» и частично похож на человека с оперением на голове) и он же стал его первой жертвой. Беркут «переняла его желания, в частности любов к нему».</p>\n<p><strong>Паша (Пашка)</strong> — друг по парте, с которым Кирилл играл по сети. После смерти Кирилла Пашка «захотел избавиться от него, отомстить за товарища и остальных»: нашёл открытый балкон и пришёл туда «с украденным оружием отца и солью». Как только увидел существо, начал обороняться, «но его мощь доминировала» (id 217240).</p>\n<p><strong>Родители</strong> — до катастрофы почти не действуют: заняты работой и личными делами, «что-то обсуждают на кухне», когда всё происходит, и не слышат его крика. После — «преисполненые ужасом родители потерявших почти самое святое что у них есть». Потом Кирилл, ещё не понимая, что мёртв, едет с ними в школу, и они «странно вели себя, всё время плакали и молчали».</p>\n<p><strong>Друзья по подгруппе на занятиях</strong> — первое звено распространения слуха о Беркуте; на них же разбирается разница между родителем и знающими (id 218482, 218489–218490).</p>", "r": []}, {"t": "Как менялся", "a": ["S07", "PS-0049-S07", "PS-0049--kak-menyalsya"], "h": "<p><strong>2024-04-03, окно w0029, id 153368 — вселенная «игра бога».</strong> Карточка персонажа Славы: спокойный, тихий, спортивный; способность — телепортировать к себе одного человека, которого видел, с двумя примерами тактического применения. Дальше эта версия не развивается.</p>\n<p><strong>2024-08-10, окно w0050, id 217239–217240 — вселенная «монстры».</strong> Персонаж введён целиком вместе с историей: 6 лет, почти 4 психических, спокойный и умный, планшет, друг Паша, шутер-моба, выпавший из ящика легендарный «Беркут», фанатство по терианам, отсутствие среди них летающих, крик «самолёт» в парке, материализация Беркута через желание встретиться, слухи в подгруппе, встреча на балконе, полёт, смерть тела, уход души.</p>\n<p><strong>2024-08-11, окно w0051, id 217692–217694.</strong> Уточнение источника: Кирилл играл в альтернативную для своей вселенной версию Brawl Stars, Беркут — пародия на Ворона.</p>\n<p><strong>2024-08-11, окно w0051, id 217727–217762.</strong> Разобрано терианство: относил себя к терианам, считал себя птицей, но крыльев не имел и не мог взлететь даже с земли. По ходу разбора формулировка меняется с «териан» на «квадробер» («тогда иначе выражусь») и добавляется, что это «типо спорт». Изучал птиц, чтобы потом практиковаться, ждал живого примера.</p>\n<p><strong>2024-08-11, окно w0051, id 217911–217921.</strong> Зафиксирована роль в механике: Кирилл — родитель монстра, определяющий его внешность и суть; вера определяет силу материализации; будь он жив, у Беркута была бы возможность возродиться.</p>\n<p><strong>2024-08-12, окно w0052, id 218471–218498.</strong> Кирилл разбирается как показательный пример работы механики: почему его друзья поверили (они дети), почему они остаются знающими, а не родителями, и почему у одного родителя один монстр.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S08", "PS-0049-S08", "PS-0049--chto-s-nim-stalo"], "h": "<p>Погиб. Финал прописан 2024-08-10 (id 217239–217240) в том же сообщении, где персонаж вводится.</p>\n<p>Накануне, пока родители что-то обсуждали на кухне, Кирилл услышал самолёт и побежал на балкон полюбоваться. Снизу на перила подпрыгнуло существо, «так элегантно свернув свои огромные крылья», село и «пялится в душу». Кирилл испугался — «не то слово», отпрыгнул к двери и закричал, но родители его не услышали. Потом он понял, кто перед ним, встал и молча смотрел на Беркута в шоке. Тот голосом персонажа начал звать его с собой, летать; он сказал, что Кирилл сможет летать. Кирилл коснулся его руки, почувствовал её, посмотрел назад и увидел на своей спине крылья. Беркут схватил его крепче и позвал «постигать прекрасные необъятные просторы неба», утверждая, что «наш герой не разобьётся если будет держаться крепко, тот научит его искусству полёта». Отказаться Кирилл не мог: предложение сказано кумиром, которого можно коснуться и чьи возможности уже видел.</p>\n<p>Ему было страшно, но с поддержкой Беркута он встал на перила, «ужасаясь от высоты», ступил дальше — и полетел: «не просто вниз, он возвышается, он держится за руку Беркута и не падает, тот учит его летать». Пока они седьмой час изучали небеса и Кирилл задавал миллионы вопросов, его физическая оболочка «в бардовой субстанции и окружённая преисполнеными ужасом родителями потерявших почти самое святое что у них есть, отправляется в реанимацию». «А там понятно его уже не вернуть, ведь его душа даже не подозревает, что его больше не увидят родные, а значит не сможет вовремя вернуться в тело».</p>\n<p>Дальше он какое-то время не понимал, что произошло: наигравшись, пришёл домой, а там никого, сидел в планшете; ехал с родителями в школу, а они плакали и молчали; на занятиях слышал краем уха «какую-то недавнюю жуткую ситуацию», но «больше пытался добиться внимания скучных лиц в кабинете». В конце концов «от этой ерунды он ушел гулять с Беркутом и как только получил ответы на все вопросы его душа ушла на небеса, Кирилл всё понял, да уже поздно было».</p>\n<p>Последствия для мира. Монстр остался, ответственность за случившееся приписали ему, бояться стали ещё сильнее: «нет человека дарующего хоть малейшей позитивной коннотации его существования, вот тогда он стал чистым злом, о нем знал весь интернет после того случая». Беркуту «надо же реализовать свою суть, поэтому он в любых условиях старался воспроизводить тот сценарий с теми кто его видит, пусть уже насильно, ему мало было полетать». На балконы массово стали ставить ограждения от детей, «но не все могли это позволить». Пашка попытался отомстить и не смог. «Прошло 3 года и ничего не изменилось, правда теперь дети видят вместо лазурного неба кисло-пурпурное..»</p>", "r": []}, {"t": "Пробелы", "a": ["S09", "PS-0049-S09", "PS-0049--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Связь между Кириллом из «игры бога» (2024-04-03) и Кириллом из «монстров» (2024-08-10) в переписке не проводится: одно имя, разные вселенные, разные наборы черт, общее — только «спокойный». Один это персонаж или два, не сказано.</li>\n<li>Внешность не описана ни в одной версии.</li>\n<li>Способность телепортации из карточки «игры бога» больше нигде не упоминается и во вселенной «монстры» не действует. Отменена она или относится к другому персонажу — не сказано.</li>\n<li>Название игры внутри вселенной не даётся, только через сравнение: «альтернативная для своей вселенной версия бравл старса».</li>\n<li>Реплика Славы «Но вера осталась» (id 217921) осталась без ответа: как соотносятся сохранившаяся вера и невозможность возрождения после смерти родителя, не разобрано.</li>\n<li>Судьба Пашки после стычки с Беркутом не названа — сказано только, что «его мощь доминировала».</li>\n<li>Что стало с родителями Кирилла дальше, не сказано.</li>\n<li>Почему небо стало «кисло-пурпурным» и что это значит механически, не объяснено.</li>\n<li>Фамилия, регион, город, название дошкольного заведения не названы; «характерная для его региона» лазурь неба — единственное указание на место.</li>\n<li>В файле отмечено (окно w0052): персонаж введён в предыдущем окне; часть разбора о нём в этом окне — машинная вставка.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0049--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0046.html\">Терианы (квадроберы)</a>, <a href=\"GR-0050.html\">Команда Славы (персонажи игры бога)</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0046.html\">Терианы (квадроберы)</a>, <a href=\"GR-0050.html\">Команда Славы (персонажи игры бога)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0014.html\">игра бога</a>, <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0049--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-04-03</td>\n<td>153368–153368</td>\n<td>w0029</td>\n<td>игра бога (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-08-10</td>\n<td>217239–217240</td>\n<td>w0050</td>\n<td>монстры (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-08-11</td>\n<td>217692–217694</td>\n<td>w0051</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-08-11</td>\n<td>217727–217762</td>\n<td>w0051</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-08-11</td>\n<td>217911–217921</td>\n<td>w0051</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-08-12</td>\n<td>218471–218498</td>\n<td>w0052</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0049-kirill.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0049--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0049.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0049-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0049/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Прямых внешних блокеров на Кирилла нет — все, с кем он связан (Беркут <code>PS-0134</code>, Паша <code>PS-0135</code>), уже описаны отдельными статьями. Дороже другое: правило, объясняющее, почему друзья Кирилла поверили в Беркута — «а ничего что его друзья дети?» (id 218482) — сформулировано только для одного слоя свидетелей. Соседний слой — взрослые, до которых дошли слухи о случившемся, — остался без ответа на тот же вопрос: считаются ли они «знающими», которые усиливают монстра (правило id 218489–218490), или сила материализации привязана именно к детскому психическому возрасту и на взрослых не распространяется.</p>\n<h3>С чего начать</h3>\n<p>Материал не в архиве — он уже в базе и уже вошёл в статью <code>PS-0049</code>, просто раскидан по трём последовательным окнам одной вселенной: id 217911–217921 (роль родителя), 218471–218488 (почему поверили именно дети) и 218489–218498 (кто усиливает монстра). Вопрос «а как со взрослыми» в них просто не был задан.</p>\n<h3>Как развивалось</h3>\n<p>Кирилл появляется дважды под одним именем в разных мирах. Заявили: 2024-04-03, в мире «игра бога» — карточка со способностью телепортации, без биографии. Дальше эта версия нигде не возвращается. 2024-08-10, четыре месяца спустя, в мире «монстры» появляется другой Кирилл — сразу вместе с полной историей и смертью. Связь между двумя версиями не оговорена ни в одну, ни в другую сторону.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Правило про силу веры сформулировано для двух ролей: родитель определяет характер и внешность монстра, а «знающие» — те, кто просто в курсе, — усиливают его (id 218489–218490). Для родителя отдельно сказано: жив родитель — есть шанс на возрождение монстра после его смерти (id 217920). А для «знающих» симметричного правила нет: если кто-то из знающих Беркута перестанет верить или забудет о нём, ослабляет ли это монстра так же, как смерть родителя повышает риск его исчезновения? Правило прописано только с одной стороны прироста силы.</p>\n<h3>Отклик</h3>\n<p>Самое цепляющее — не механика монстров, а то, что Кирилл до самого конца не понимает, что мёртв: сидит в планшете, едет в школу с плачущими родителями, слушает вполуха про «жуткую ситуацию» — и только когда у Беркута заканчиваются ответы на вопросы, до него доходит. Редко когда смерть ребёнка в такой истории обходится без единого патетического слова.</p></div>", "r": []}];</script>
