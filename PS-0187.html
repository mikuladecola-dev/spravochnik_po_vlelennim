<script>const BASE="";const DOCNAME="Семь грехов";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0187-S01", "PS-0187--proishozhdenie"], "h": "<p>Группа из семи персонажей, названных по семи смертным грехам: Похоть, Чревоугодие, Алчность, Лень, Гнев, Зависть, Гордыня. Введены Славой в переписке 2025-01-23 (id 284174–284177) одним блоком — сразу семёркой, вместе с божеством: «7 грехов и божество ( помнишь его)». Формулировка «помнишь его» относится к божеству, то есть божество к этому моменту уже существовало в разработке; про самих грехов такой отсылки нет.</p>\n<p>Как группа появились они внутри организации злодеев — глава этой организации назван как отдельная и более сильная фигура. Откуда они взялись, кто их собрал, связаны ли они между собой родством или подчинением — в переписке не сказано.</p>", "r": []}, {"t": "Характер", "a": ["S02", "PS-0187-S02", "PS-0187--harakter"], "h": "<p>Индивидуальных характеров у семерых не разобрано. Единственное, что о характере сказано, относится к Гордыне и идёт через способность: «он гордится силой, отрицая ограничения тела» (Миколай, 2025-01-24, id 284271). Про остальных шестерых характерные черты не названы.</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0187-S03", "PS-0187--sposobnosti"], "h": "<p>Способности раздавал Слава, затем часть распределения переигрывалась. Ниже — состав по версии 1 (2025-01-23, id 284176), формулировки авторские:</p>\n<ul>\n<li><strong>Похоть</strong> — «Контроль разума с ограничением. То бишь она может повысить какое то чувство или вызвать галлюцинаций или наоборот понизить какой то чувство». Похоть здесь названа в женском роде.</li>\n<li><strong>Чревоугодие</strong> — «Чревоугодие ок», то есть принят вариант, обсуждавшийся ранее; какой именно, в этом сообщении не расшифровано.</li>\n<li><strong>Алчность</strong> — «Я думал больше о способности поглощений чужой манный или объектов».</li>\n<li><strong>Лень</strong> — «телекинез типа лень чё то делать вот и телекинез ( здесь ещё в придачу владений магий ветра, как никак они связаны)».</li>\n<li><strong>Гнев</strong> — «Гнев ну ок», вариант принят без расшифровки.</li>\n<li><strong>Зависть</strong> — «Полной перевоплощение тому кого завидуешь, под полный подразумевается полной копирование сил, магии, одежды, внешность но не характера». Оговорка про характер сделана прямо: копируется всё, кроме характера.</li>\n<li><strong>Гордыня</strong> — «Слово закон с ограничением».</li>\n</ul>\n<h3>Иерархия и правило убийства</h3>\n<p>Семь грехов вместе с божеством стоят в иерархии силы ниже главы организации злодеев и выше благословенного: «Будет слабей главы этой организации но сильней благословенного» (2025-01-23, id 284175).</p>\n<p>Отдельно задано, сколько нужно противников, чтобы убить одного греха (2025-01-24, id 284276): «чтобы убить одного греха в максимум надо 3 благословенных именно Бога / А для остальных благословенных надо будет 5». То есть разделение идёт по источнику благословения: благословенные Бога считаются сильнее — их достаточно трёх, прочих нужно пять.</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0187-S04", "PS-0187--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Божество</strong> — названо в одной связке с семёркой при первом же упоминании и разделяет с ней место в иерархии. В каталоге благословенных и врагов (id 284278) Божество стоит в списке «Враг» отдельной строкой — «Божество😵», то есть в состав семёрки оно не входит.</li>\n<li><strong>Глава организации злодеев</strong> — сильнее семёрки и божества.</li>\n<li><strong>Благословенные</strong> — слабее любого из грехов; в каталоге перечислены отдельным списком.</li>\n<li><strong>Благословение Бога и дьявола</strong> — правило убийства греха разводит благословенных именно по этому признаку.</li>\n</ul>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S05", "PS-0187-S05", "PS-0187--kak-menyalsya"], "h": "<h3>2025-01-23 (id 284174–284177) — первая раздача</h3>\n<p>Полное распределение способностей по всем семи грехам, как приведено выше. Задана иерархия: слабее главы организации, сильнее благословенного.</p>\n<h3>2025-01-24 (id 284255–284279) — доработка Гордыни и переигранный каталог</h3>\n<p>Слава возвращается к Гордыне: «Греху гордыни какая способность», «Типо слова закон, че то я не могу представить битву» (id 284255–284256). То есть исходный вариант «слово закон с ограничением» не снимается прямо, но признаётся неудобным для боевых сцен.</p>\n<p>Миколай предлагает: «выход за предел» (id 284257), затем раскрывает: «типа он гордится силой, отрицая ограничения тела. он легко способен сбросить естественные биологические ограничители, но после такие травмы получить» (id 284271). Обещает найти и прислать список этих ограничителей (id 284272) и присылает его (id 284274):</p>\n<div class=\"q\"><p>«1. Центральный регулятор усталости — мозг останавливает усилие до реального истощения мышц, защищая от травм.<br>2. Болевые рецепторы — сигнализируют о повреждениях, заставляя снизить нагрузку.<br>3. Терморегуляция — потовые железы и дыхание предотвращают перегрев.<br>4. Инстинкты самосохранения — страх/дискомфорт ограничивают рискованные действия.<br>Тренировки и адаптация могут «обмануть» эти системы, повышая выносливость, но с риском перегрузок.»</p></div>\n<p>Слава на предложение отвечает: «Ну пока звучит плохо» (id 284273). Миколай сам сводит идею к второстепенной: «ну можно как одна из его особенностей но не основная» (id 284275). Основная способность Гордыни на этом обсуждении так и не выбрана — в каталоге того же дня напротив Гордыни стоит только «👑», без формулировки.</p>\n<p>По остальным шести Миколай спрашивает: «остальные грехи сейчас норм?» (id 284277), Слава отвечает «Ну да» (id 284279), приведя перед этим каталог.</p>\n<p>Каталожные формулировки на 2025-01-24 (id 284278):</p>\n<pre><code>Гнев 😡( сила)\nПохоть 😵‍💫(контроль разума)\nЗависть 👹👹( полной копирование)\nАлчность ♾(всё моей)\nГордыня 👑\nЧероугодия ◼️( поглощения)\nЛень😴( контроль территории)\n</code></pre>\n<p>Здесь часть распределения отличается от версии от 2025-01-23, старое при этом не отменялось словами:</p>\n<ul>\n<li>«поглощения» стоит теперь у <strong>Чревоугодия</strong>, тогда как накануне поглощение чужой манны или объектов было у Алчности;</li>\n<li>у <strong>Алчности</strong> появляется формулировка «всё моей»;</li>\n<li>у <strong>Лени</strong> вместо телекинеза с магией ветра — «контроль территории»;</li>\n<li>у <strong>Гнева</strong> появляется «сила» (накануне было только «Гнев ну ок»).</li>\n</ul>\n<h3>2025-01-24, позже (id 284300–284302) — повтор каталога</h3>\n<p>Слава выкладывает расширенный каталог (id 284300), где блок «Семь грехов» повторён слово в слово в том же виде, что и в id 284278, включая пустую Гордыню. К каталогу добавлены разделы «Оружие» и «Артефакты», которых в предыдущей версии не было. В строке идей «корень желаний» из id 284278 заменён на «камень желаний».</p>", "r": []}, {"t": "Отклонённые и повисшие варианты", "a": ["S06", "PS-0187-S06", "PS-0187--otklonennye-i-povisshie-varianty"], "h": "<ul>\n<li><strong>Гордыня, «слово закон с ограничением»</strong> (2025-01-23) — не отвергнуто прямо, но вызвало возражение «че то я не могу представить битву».</li>\n<li><strong>Гордыня, «выход за предел» / сброс биологических ограничителей</strong> (2025-01-24) — реакция Славы «Ну пока звучит плохо», автор предложения сам понизил вариант до «одна из его особенностей но не основная».</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0187-S07", "PS-0187--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имён у грехов, кроме названий самих грехов, нет; внешность не описана ни у одного из семерых.</li>\n<li>Пол указан косвенно и только для двоих: Похоть — «она может повысить», Гордыня — «он гордится».</li>\n<li>Основная способность Гордыни осталась нерешённой: в каталоге напротив неё пустое место.</li>\n<li>Что стоит за «Чревоугодие ок» и «Гнев ну ок» в версии от 2025-01-23 — то есть какой ранее обсуждавшийся вариант этим принимается — в переписке не расшифровано.</li>\n<li>Расхождение между раздачей от 2025-01-23 и каталогом от 2025-01-24 (поглощение у Алчности против поглощения у Чревоугодия, телекинез с ветром у Лени против контроля территории) не проговорено: перераспределение просто появилось в каталоге.</li>\n<li>Формулировки «контроль территории» и «всё моей» не раскрыты — что именно они означают механически, не сказано.</li>\n<li>Ограничение у Похоти («контроль разума с ограничением») названо, но в чём оно состоит — не сказано; то же с ограничением у первого варианта Гордыни.</li>\n<li>Отношения грехов между собой, их подчинение главе организации, роль божества рядом с ними — не описаны.</li>\n<li>Что с семёркой стало дальше по сюжету, участвовала ли она в каких-либо сценах — в переписке нет.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0187--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0006.html\">Организация злодеев</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0002.html\">Семь грехов</a>, <a href=\"GR-0006.html\">Организация злодеев</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0187--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-01-23</td>\n<td>284174–284177</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-24</td>\n<td>284255–284279</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-24</td>\n<td>284300–284302</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0187-sem-grehov.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0187--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0187.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0187-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0187/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым надо чинить не Гордыню, а декабрьский слой грехов. Он весь лежит в базе и весь без статей: <code>SP-0156</code> «Семь грехов (магия по грехам)» — 11 757 знаков, статьи нет; <code>SP-0157</code> Похоть — 7 256; <code>SP-0158</code> Чревоугодие — 7 117; <code>SP-0160</code> Лень — 8 291; <code>SP-0161</code> Зависть — 8 056; <code>SP-0162</code> Гордыня — 7 454. Из семи до статьи доведены только двое: <code>SP-0159</code> Алчность и <code>PS-0177</code> Гнев. При этом персонажные статьи <code>PS-0188</code>–<code>PS-0192</code> стоят на базе по четыре тысячи знаков каждая — то есть тонкий январский слой описан, а толстый декабрьский, на который январь прямо ссылается словом «ок», не описан вовсе. Пока он не разобран, половина этой статьи нечитаема: и «Чревоугодие ок», и «Гнев ну ок», и расхождение раздачи с каталогом упираются в одно и то же место.</p>\n<p>Второе по цене — сам каталог. <code>SL-0051</code> (шесть ссылок, статьи нет, база 9 834) и <code>SL-0053</code> (шесть ссылок, статьи нет, 20 313) — самые ссылаемые записи «Апостола» без статьи; на <code>SL-0051</code> опираются группы <code>GR-0001</code>, <code>GR-0002</code>, <code>GR-0011</code>, <code>GR-0012</code>, <code>GR-0013</code>, <code>GR-0020</code>. Блок «Семь грехов», который здесь цитируется дважды, — это его кусок.</p>\n<h3>С чего начать</h3>\n<p>В базе, в архив идти не нужно. Окно w0068, 2024-12-24 — 2024-12-25: ответ Миколая целиком в 273906, встречный вариант Славы в 273920, разбор — 274462–274472.</p>\n<p>Там прямо лежит то, что статья числит нерасшифрованным. У Чревоугодия (<code>SP-0158</code>) — «поглощение всего, включая чужую магию меньше облака заклинания», и Слава принял без правок; отсюда видно, почему в каталоге 2025-01-24 «поглощения» стоит у Чревоугодия, а не у Алчности — оно там и было с декабря, а январская реплика про поглощение маны у Алчности (<code>SP-0159</code>) — это второй, наложившийся вариант. У Гнева (<code>PS-0177</code>) — берсерк при несправедливости, рост мышечной массы, магия взрыва; отсюда каталожное «сила». У Лени (<code>SP-0160</code>) — барьер во сне, телепортация, растекание, и уже потом телекинез с ветром. У Гордыни (<code>SP-0162</code>) две декабрьские версии: шизофрения-голос у Миколая и слово-закон у Славы — январский тупик с «выходом за предел» это третий заход, а не первый.</p>\n<h3>Как развивалось</h3>\n<p>2024-12-24–25 — способности разобраны поштучно, с вариантами от обоих. 2025-01-23 — Слава пересобирает всё одним блоком, часть позиций закрывает словом «ок», не повторяя содержания. 2025-01-24, первая половина — возвращаются к одной Гордыне, предложение отклонено, место в каталоге остаётся пустым, по остальным шести — «остальные грехи сейчас норм?» / «Ну да». 2025-01-24, позже — каталог выложен заново слово в слово, с той же пустой Гордыней; при этом четыре подписи из семи отличаются от вчерашней раздачи, и отмены вчерашнего нигде нет.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Правило, переводящее разницу в силе в количество, названо: чтобы убить одного греха, нужно три благословенных Бога или пять остальных. Божество поставлено с грехами на одну ступень той же репликой — «7 грехов и божество будет слабей главы этой организации но сильней благословенного». Для него такого числа нет. Для главы организации, стоящей выше обоих, тоже нет. Правило есть ровно для одной строки иерархии из трёх.</p>\n<h3>Отклик</h3>\n<p>Зацепило «Чревоугодие ок». Два знака, за которыми стоит месячной давности разговор, — и они работают: соавтор понял, о чём речь, спорить не стал. Это очень плотная форма договорённости, она держится только на общей памяти двоих и рассыпается для любого третьего ровно в тот момент, когда его сюда пускают. И рядом — пустая клетка Гордыни, которую переписали дважды за сорок минут и оба раза оставили пустой. Не забыли: каталог перебирали вручную, строку видели, корону поставили, слова не поставили. Отказ придумывать при полностью сохранённой рамке — редкая вещь, обычно дырку затыкают чем угодно. Здесь её оставили открытой, и через семь месяцев она всё ещё открыта.</p></div>", "r": []}];</script>
