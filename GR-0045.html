<script>const BASE="";const DOCNAME="Чёрные, белые и серые маги";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0045-S01", "GR-0045--chto-eto"], "h": "<p>Не организация и не отряд, а деление магов по миру-источнику силы: чёрный маг, белый маг, серый маг. Разведка занесла это в группы, но поимённого состава у «группы» нет и не было: за всё время переписки ни один чёрный, белый или серый маг не назван — ни именем, ни прозвищем, ни как персонаж. Фактически это класс носителей силы внутри системы сил вселенной «монстры», рубрика, а не сообщество.</p>\n<p>Заявлено Славой одним развёрнутым сообщением 2024-11-09 (id 255014), внутри разговора о том, как устроить «хоррор с организацией» (<a href=\"IS-0028.html\">Хоррор с организацией</a>). Разговор начинается с того, что вся задумка упирается в систему сил: «Ну и снова все упирается в систему сил» (id 255005, 2024-11-09 23:38).</p>\n<p>Устройство изложено так: «Изначально я хотел чтобы монстры появлялись из других миров / Которых миллиарды и который делаются на черной белый и серый / И вот монстры из черного мира к нам полжуть / И люде из нашего мира могут черпать силу из другого мира ( черный маг белый маг серый маг)» (id 255014, 2024-11-09 23:41).</p>\n<p>То есть маги — это люди нашего мира; тип мага задаётся тем миром, из которого человек черпает силу. Сами миры (МР — «Чёрный, белый и серый миры», <a href=\"MR-0066.html\">Чёрный, белый и серый миры</a>) существуют отдельно от магов и делятся на те же три разряда.</p>", "r": [["Чёрный, белый и серый миры", "MR-0066.html"], ["Хоррор с организацией", "IS-0028.html"]]}, {"t": "Общие способности группы", "a": ["S02", "GR-0045-S02", "GR-0045--obschie-sposobnosti-gruppy"], "h": "<p>Общее у всех — сам механизм: человек нашего мира черпает силу из другого мира. Из этого черпания и берётся принадлежность к чёрным, белым или серым.</p>\n<p>Как именно происходит черпание, есть ли у него ограничения, цена, условия доступа к конкретному миру — в переписке не сказано.</p>", "r": []}, {"t": "Чем участники отличаются друг от друга", "a": ["S03", "GR-0045-S03", "GR-0045--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p>Различие двойное.</p>\n<p>Первое — разряд мира-источника: чёрный, белый, серый. Третьего признака, кроме цвета мира, у разряда не названо; что означает «серый» и чем он отличается от «белого» по существу, в переписке не сказано.</p>\n<p>Второе — уникальность способностей у каждого: «И способности у них всех уникальный так как они черпать силы из разных миллиардом миров» (id 255021, 2024-11-09 23:42). Уникальность объясняется прямо количеством миров: миров миллиарды, источников миллиарды, поэтому совпадений не бывает. Соотношение между цветом мира и характером способности не описано — не сказано, задаёт ли чёрный мир какой-то общий тип силы, или цвет и способность независимы.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S04", "GR-0045-S04", "GR-0045--otnosheniya-s-drugimi-gruppami"], "h": "<p>Названо только одно соседство: монстры. Монстры приходят из чёрного мира — «И вот монстры из черного мира к нам полжуть» (id 255014). Маги и монстры при этом оказываются связаны с одним и тем же чёрным миром, но воюют ли маги с монстрами, охотятся ли на них, используют ли — в переписке не сказано.</p>\n<p>Вокруг этой системы в тот же вечер стоят:</p>\n<ul>\n<li>«Хоррор с организацией» (<a href=\"IS-0028.html\">Хоррор с организацией</a>) — замысел, из которого система выросла: «Вообще я хотел создать хоррор с организаций» (id 255003, 2024-11-09 23:38). Сама организация названия так и не получила, состав её не назван, отношения магов с ней не оговорены.</li>\n<li>ГГ-защитник (<a href=\"PS-0163.html\">ГГ-защитник</a>) — «И во все у меня в этих мирах гг вообще защитник» (id 255026, 2024-11-09 23:44). Герой помещён в эти же миры, но магом его никто не называет; связь ГГ с системой чёрных/белых/серых магов в переписке не проведена.</li>\n<li>Озеро перерождения — «Да и в плюсом в этой вселенной существует озеро перерождения ( который превращает монстра )» (id 255042, 2024-11-09 23:46), и следом камень желаний (id 255047). Оба объекта заявлены как принадлежащие той же вселенной, но к магам не привязаны.</li>\n</ul>", "r": [["ГГ-защитник", "PS-0163.html"], ["Хоррор с организацией", "IS-0028.html"]]}, {"t": "Как менялась — по датам", "a": ["S05", "GR-0045-S05", "GR-0045--kak-menyalas"], "h": "<p><strong>2024-11-09, id 255005–255025 (окно w0063).</strong> Единственное изложение системы. Всё, что известно про чёрных, белых и серых магов, сказано здесь и больше не повторялось и не дополнялось. Формулировка подана как воспоминание о первоначальном замысле: «Изначально я хотел…».</p>\n<p>В том же разговоре Слава сразу оценивает жанровые последствия: «Сама задумка вроде не плохая но это снова из хоррора превращается в боевик» (id 255022, 23:42). Миколай отвечает, что хоррор из этого сделать можно: «ну по идее можно и из такого сделать хоррор» (id 255023), но с оговоркой «просто это всё утратит основную идею» (id 255024). Слава закрывает тему: «Да только мало обещающий» (id 255025, 23:43).</p>\n<p>После этого разговор в тот же вечер уходит от магов: Миколай переключается на формулу страха (id 255027 и далее), Слава — на озеро перерождения и камень желаний. К делению магов ни один из соавторов больше не возвращается.</p>\n<p><strong>2024-11-10 — 2024-11-14 (id 255073–257180, окна w0063–w0064).</strong> Разрабатывается ГГ-защитник: предыстория, школа, существо, чёрное озеро, сцена с задирой, разбор логики. Ни чёрные, ни белые, ни серые маги в этих разговорах не упоминаются ни разу.</p>\n<h3>Отложенное и отклонённое</h3>\n<ul>\n<li>Систему трёх миров как основу задумки Слава сам оценил как ведущую не туда — «из хоррора превращается в боевик», «мало обещающий». Прямого отказа от неё в переписке нет, но и продолжения нет.</li>\n<li>Предложение Миколая всё-таки сделать из этого хоррор осталось без развития, вместе с его же возражением, что тогда «всё утратит основную идею».</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S06", "GR-0045-S06", "GR-0045--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет: ни одного чёрного, белого или серого мага не названо.</li>\n<li>Не сказано, как происходит черпание силы и есть ли у него ограничения (помечено как неясность в <a href=\"SP-0119.html\">Чёрный маг / белый маг / серый маг</a>).</li>\n<li>Не объяснено, чем чёрный, белый и серый разряды отличаются друг от друга по существу, кроме названия мира-источника.</li>\n<li>Иерархии внутри магов не обсуждали вовсе: ни старших/младших, ни сильных/слабых, ни того, знают ли маги друг о друге.</li>\n<li>Не сказано, сколько магов вообще есть, редкость это или массовое явление, и как человек узнаёт, что он маг.</li>\n<li>Отношения магов с монстрами из чёрного мира не описаны.</li>\n<li>Организация из замысла «хоррор с организацией» названия не получила, состав её не назван, связь с магами не проведена.</li>\n<li>Не сказано, маг ли ГГ-защитник; связь ГГ с системой миров в переписке прямо не проведена. Вселенная в чате тоже не названа (помечено как неясность в <a href=\"MR-0066.html\">Чёрный, белый и серый миры</a> и <a href=\"IS-0028.html\">Хоррор с организацией</a>).</li>\n</ul></div>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Из того, у чего коды есть, первым чинить <code>SP-0119</code> «Чёрный маг / белый маг / серый маг»: 2 ссылки, статья 5 181, база 2 993. Это единственный сустав системы — черпание. Пока в нём три тысячи знаков, к нему нечем крепить ни <code>MR-0066</code> (2 ссылки, база 3 297), ни монстров из того же чёрного мира, ни <code>PS-0163</code>. Весь узел замкнут сам на себя: на <code>SP-0119</code>, <code>MR-0066</code> и <code>IS-0028</code> (2 ссылки, база 7 759) ссылаются ровно два файла — эта статья и <code>VS-0015</code>. Рядом, в тот же вечер и в ту же вселенную, объявлены вещи на порядок толще: <code>PS-0163</code> ГГ-защитник — 4 ссылки, база 37 127; <code>MN-0009</code> Озеро перерождения — 3 ссылки, 22 625; <code>MN-0010</code> Камень желаний — 11 361. Разрыв между магами и соседями по вечеру — двенадцатикратный.</p></div>", "r": [["Чёрный маг / белый маг / серый маг", "SP-0119.html"], ["Чёрный, белый и серый миры", "MR-0066.html"], ["Хоррор с организацией", "IS-0028.html"]]}, {"t": "Связи — всё вместе", "a": ["GR-0045--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0163.html\">ГГ-защитник</a></li>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0119.html\">Чёрный маг / белый маг / серый маг</a></li>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0066.html\">Чёрный, белый и серый миры</a></li>\n<li><strong>Упоминает истории:</strong> <a href=\"IS-0028.html\">Хоррор с организацией</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0045--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0045.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0045-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0045/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Самая дорогая дыра здесь вообще без кода: организация, ради которой всё затевалось («Вообще я хотел создать хоррор с организаций», id 255003), не названа — значит, записи у неё нет, сослаться не на что, и в числах её не видно. Она держит <code>IS-0028</code> и всю конструкцию сверху.</p>\n<p>Из того, у чего коды есть, первым чинить <code>SP-0119</code> «Чёрный маг / белый маг / серый маг»: 2 ссылки, статья 5 181, база 2 993. Это единственный сустав системы — черпание. Пока в нём три тысячи знаков, к нему нечем крепить ни <code>MR-0066</code> (2 ссылки, база 3 297), ни монстров из того же чёрного мира, ни <code>PS-0163</code>. Весь узел замкнут сам на себя: на <code>SP-0119</code>, <code>MR-0066</code> и <code>IS-0028</code> (2 ссылки, база 7 759) ссылаются ровно два файла — эта статья и <code>VS-0015</code>. Рядом, в тот же вечер и в ту же вселенную, объявлены вещи на порядок толще: <code>PS-0163</code> ГГ-защитник — 4 ссылки, база 37 127; <code>MN-0009</code> Озеро перерождения — 3 ссылки, 22 625; <code>MN-0010</code> Камень желаний — 11 361. Разрыв между магами и соседями по вечеру — двенадцатикратный.</p>\n<h3>С чего начать</h3>\n<p>В базе, и рядом. <code>SL-0043</code> «Формула страха» — 1 ссылка, статьи нет, 11 730 знаков, то же окно w0063, две версии; туда разговор ушёл сразу после магов (id 255027 и дальше), и там же видно, что именно авторы взяли вместо системы миров. <code>MN-0009</code> и <code>MN-0010</code> — записи объектов, заявленных в тех же пяти минутах (id 255042, 255047), обе развитые; сверить, не притянута ли к ним попутно и логика миров-источников.</p>\n<p>В архив — за формулировкой «Изначально я хотел чтобы монстры появлялись из других миров». Это пересказ по памяти, то есть первый разговор про миры-источники лежит раньше 2024-11-09 и в собранное не попал. Ориентир: окна до w0063 и записи о происхождении монстров, где мир-источник мог обсуждаться впервые, — <code>MR-0055</code> «Типы зарождения монстров» (база 9 067), <code>MR-0051</code> «Материализация монстров из желаний и веры» (14 373), <code>MR-0060</code> «монстры как домен живых существ» (11 412). Вторая точка — промежуток id 255073–257180 (10–14 ноября): окна там собраны вокруг ГГ, и стоит убедиться, что маги в них действительно ни разу не всплывают, а не выпали при нарезке.</p>\n<h3>Как развивалось</h3>\n<p>Всё в пятнадцати минутах одного вечера. 23:38 — упёрлись: «снова все упирается в систему сил». 23:41 — заявили устройство: миллиарды миров, три разряда, человек черпает силу. 23:42 — уточнили и сразу же ограничили: уникальность объяснена количеством миров, и в ту же минуту Слава сужает жанрово — «из хоррора превращается в боевик». 23:43 — закрыл: «мало обещающий». 23:44–23:46 — к тем же мирам прикрепляют ГГ, озеро перерождения, камень желаний; маги в этих репликах не названы. Дальше вечер уходит в формулу страха. Возврата нет ни разу: 10–14 ноября разрабатывается ГГ, магов нет. Для сравнения — озеро, объявленное на пять минут позже магов, возвращалось в w0070, w0072, w0073 и w0094 и набрало восемь версий.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для магов правило названо дважды и оба раза через источник: разряд задаётся миром, из которого черпают, а уникальность способности — количеством миров («миров миллиарды», id 255021). Монстры в той же реплике приходят из чёрного мира, то есть питаются от той же системы, — но ни одно из двух правил для них не проговорено. Не сказано, из скольких чёрных миров они лезут, и не сказано, уникален ли каждый монстр так же, как уникален каждый маг. Место — стык id 255014 и 255021, две реплики подряд.</p>\n<h3>Отклик</h3>\n<p>Одно предложение здесь держит всю задумку: сила у каждого своя, потому что миров миллиарды. Это объяснение, которое не описывает, а считает, — редкая вещь в такой ранней стадии, и оно закрывает вопрос «почему у всех разное» без единого исключения. Зацепило другое: автор сам разобрал свою конструкцию через минуту после того, как её выложил, и разобрал точно — «из хоррора превращается в боевик». Диагноз верный, и он же оказался приговором: три мира, из которых можно было вырастить что угодно, остались лежать как заготовка, а из вечера выжили озеро и камень — вещи меньшего калибра, но с картинкой. Забавно и то, что монстры и маги в этой системе кормятся с одного и того же чёрного мира, стоят в двух соседних строках и так и не встретились.</p></div>", "r": []}];</script>
