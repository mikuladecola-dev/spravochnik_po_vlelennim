<script>const BASE="";const DOCNAME="Сверхлюди-актёры";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0032-S01", "SP-0032--mehanika"], "h": "<p>Это не способность в обычном смысле, а устройство «способностей» целиком в мире Падения небес. Формулировка Миколая (2023-12-26, id 65988–65993): «Способностей нет на самом деле, носители сами их придумали», «На самом деле это спец эффекты на камеру», «Фильм», «Который смотрят люди», «И думают что это правда».</p>\n<p>Рамка, в которой это сказано: «Типо весь мир это замороженный мыльный пузырь» (id 65988). Далее по тексту этот мир называется шаром — сцены снимают «возле этого шара» (id 66005).</p>\n<p>Дальше механика такая. Подвигов сверхлюдей в реальности никто не видел, и самих этих людей тоже: «На самом деле в реальности никто не видел их подвигов», «И вообще этих людей» (id 65994–65995). При этом угроза разрушения мира настоящая — «А угроза разрушения реальная проблема» (id 65996). Люди со способностями говорят, что всё исправят, зрители в них верят (id 65997–65998).</p>\n<p>Итог: «Мир рушится, а вера людей остаётся» (id 65999). Учёные тоже верят в сверхлюдей — «Поэтому ничего не делают для спасения мира» (id 66000–66001). То есть работает способность не на угрозу, а на тех, кто мог бы угрозу устранить: вера в героев отменяет всякую попытку спасения.</p>\n<p>Финал версии: «В итоге почти все люди умерли», «Больше не верят героям», «Когда мира нет» — и тогда «Мы узнаем что сверхлюди это обычные люди показывающие эти сцены на камеру возле этого шара» (id 66002–66005). Последняя реплика: «Шара нет, а они продолжают это делать» (id 66006).</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0032-S02", "SP-0032--ogranicheniya-i-cena"], "h": "<p>Прямо ограничения не перечислены, но из текста следуют два свойства.</p>\n<p>Первое: сила существует только пока в неё верят зрители. Вера здесь названа отдельно от мира и переживает мир — «Мир рушится, а вера людей остаётся» (id 65999); вера прекращается только когда «мира нет»: «Больше не верят героям», «Когда мира нет» (id 66003–66004).</p>\n<p>Второе: цену платят не носители, а зрители и учёные. Именно из-за веры «ничего не делают для спасения мира» (id 66001), и следствие этого — «почти все люди умерли» (id 66002).</p>\n<p>Съёмка носителей от гибели мира не зависит: «Шара нет, а они продолжают это делать» (id 66006).</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0032-S03", "SP-0032--nositeli"], "h": "<p>Носители — обычные люди. «Мы узнаем что сверхлюди это обычные люди показывающие эти сцены на камеру возле этого шара» (id 66005). Поимённо никто не назван, число носителей не названо.</p>\n<p>Отдельная группа, участвующая в механике — зрители и учёные. Зрители верят (id 65998), учёные верят и потому бездействуют (id 66000–66001).</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0032-S04", "SP-0032--kak-menyalas-po-versiyam"], "h": "<p>Версия одна.</p>\n<p><strong>Версия 1 — 2023-12-26 (окно w0021, id 65988–66006).</strong> Всё изложенное выше сказано в один заход, одной репликой за репликой, одним автором — Миколаем. Это первая и единственная формулировка. Возражений, уточнений и правок в переписке за этой версией не следует.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0032-S05", "SP-0032--svyaz-s-drugimi-sposobnostyami"], "h": "<p>В исходнике связь указана с «Карма как вера» и с вселенной Падения небес. Как именно эти две вещи соединены — в переписке не сказано; в самом фрагменте (id 65988–66006) «карма» не упоминается, там речь идёт о вере зрителей.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "SP-0032-S06", "SP-0032--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Кто снимает и зачем — не сказано. Есть только «показывающие эти сцены на камеру» (id 66005), заказчик и цель съёмки не названы.</li>\n<li>Что за угроза разрушения мира — не сказано. Она названа реальной (id 65996), природа её не раскрыта.</li>\n<li>Кому «мы узнаем» (id 66005) — то есть чья это точка зрения и в какой момент повествования происходит раскрытие, не оговорено.</li>\n<li>Кто смотрит фильм, если мир — это тот самый шар, возле которого идёт съёмка, а зрители внутри мира — в переписке не разбирается.</li>\n<li>Как сверхлюди уцелели после гибели мира и где они находятся, продолжая съёмку («Шара нет, а они продолжают это делать», id 66006) — не объяснено.</li>\n<li>Как эта конструкция стыкуется с прочими способностями Падений небес — не обсуждалось.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0032--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0094.html\">Сверхлюди (мнимые герои «Падения небес»)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0009.html\">Падения небес</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0032--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2023-12-26</td>\n<td>65988–66006</td>\n<td>w0021</td>\n<td>Падения небес (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0032-sverhlyudi-aktery.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0032--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0032.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
