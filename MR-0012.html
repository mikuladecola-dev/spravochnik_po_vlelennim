<script>const BASE="";const DOCNAME="Новый мир";
const LEAD="<p>Мир, объявленный Славой 3 июня 2024 года (2024-06-03, id 175718–175770) и разрабатывавшийся до 6 июня 2024 (2024-06-06, id 176469–176477). В переписке встречается под двумя обозначениями: Слава называет его «Новый мир», Миколай — «чёрно белый мир» (2024-06-05, id 176191).</p>\n<p>Жанр Слава определил сразу: «Типо страшилка с приземленными силами» (2024-06-03, id 175764).</p>";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0012-S01", "MR-0012--ustroystvo"], "h": "<p>Основа мира — три энергии. Формулировка Славы дословно (2024-06-03, id 175763):</p>\n<div class=\"q\"><p>3 энергии:<br>Темная<br>Светлая<br>Природная( животным и растениям )</p>\n<p>Темная и светлая всю жизнь борется в человеке и в некоторых существ</p></div>\n<p>Распределение энергий по носителям уточнено позже (2024-06-03, id 175790): «У любого существо способный думать будет либо смесь либо темная или светлая. А если существо не способная думать то у него будет природная типо растения животный». То есть признак, по которому энергия достаётся существу, — способность думать: мыслящие получают тёмную, светлую или смесь, немыслящие (растения, животные) — природную.</p>\n<p>Миколай сопоставил конструкцию с инь и ян (2024-06-03, id 175765) и сразу задал два вопроса: «А как происходит доминация, за счет чего» и как именно происходит борьба энергий внутри человека, «под какой призмой на всё это смотреть» (2024-06-03, id 175776).</p>\n<p>Ответ Славы про людей (2024-06-03, id 175777): «У людей это борьба зависит именно от них самих типо ты не с рождения псих маньяк ты гнида стал таким лишь и за себя». Доминация одной энергии над другой у обычного человека — результат его собственных поступков, не врождённое свойство.</p>\n<p>Для колдунов действует отдельное правило чистоты (2024-06-03, id 175777): «Колдуны чтобы полностью владеть энергий должны отдаться одному типу энергий». Полное владение энергией требует отказа от смеси.</p>\n<p>Из правила чистоты следует различительная способность колдунов (2024-06-03, id 175778): «По этому колдуны могут сражу понять что за человек перед ним». Миколай уточнил, почувствовать ли — Слава ответил «Типо увидеть» (2024-06-03, id 175779–175780). На вопрос «Прям увидеть силу отклонения от своего типа энергии?» — «Типо увидеть цвет серый, серая белый, темная серый» (2024-06-03, id 175781–175782). Человек виден колдуну как цвет, и цвета эти промежуточные, между чёрным и белым.</p>\n<p>Отдельно Миколай предложил призму, через которую следует смотреть на поведение носителей тёмной и светлой энергии (2024-06-03, id 175795):</p>\n<div class=\"q\"><p>Типа утилитарная теория не моя, но к ней я пришел сам из-за ситуации внешней. В общем потрахаться лучше чем убить или умереть. Типо лучше больше людей или столько же, чем меньше или самому умереть(в любом случае меньше). Естественно в первом случае отвергается любое противозаконное действие. А второе в любом случае идёт против законов.</p>\n<p>Ну и с этой призмы светлые будут стараться завести семью и распространить здоровые принципы, а вот темные будут стараться либо убить как можно больше, либо умереть как можно быстрее, возможно будут манипулировать серыми и делать их колдунами с нужными качествами. И всё это будет ярко отражаться на их жизни ибо они этим дышат</p></div>\n<p>Отдельного отклика Славы на эту призму в переписке нет.</p>\n<p>Завязка сюжета мира сформулирована в первой версии (2024-06-03, id 175768): «Ну типо тварь у которых темная энергия доминирует нападают на обычного гг и после этого весь мир гг переворачивается». Миколай предложил «в формате копипасты наработать тогда сюжетик» (2024-06-03, id 175767).</p>\n<p>Ад в мире существует: главный герой «После свой смерть он отправится в ад вместе с темными» (2024-06-06, id 176473). Устройство ада не описано.</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0012-S02", "MR-0012--naselenie"], "h": "<p><strong>Люди.</strong> Обычные носители смеси тёмной и светлой энергии; борьба этих энергий идёт в них всю жизнь и зависит от них самих. Колдуну видны как цвета — «серый, серая белый, темная серый».</p>\n<p><strong>Колдуны.</strong> Введены во второй версии (2024-06-03, id 175772–175775). Дословно: «Будут темный и светлый колдуны ( ну который будут мега сильный не все но именно они будут двигать сюжет создавая новых существ или т.п)». Их немного, но они способны управлять энергией. Иерархия: «Будут низший и также вышей». Новых существ создают именно тёмные колдуны (2024-06-03, id 175773). Для полного владения энергией колдун должен отдаться одному её типу; отсюда способность видеть цвет человека. Тёмные колдуны, по призме Миколая, «возможно будут манипулировать серыми и делать их колдунами с нужными качествами» (2024-06-03, id 175795).</p>\n<p><strong>Ночные охотники.</strong> Описаны Славой дословно (2024-06-03, id 175797):</p>\n<div class=\"q\"><p>Ночные охотники существо сотканный из темный энергий ( выглядят по разному ) питается людьми и страхами и болью<br>У них особо каких либо сверх сил сил не будет чисто физическая сила и уникальный строения тела типо крылья, многорукий, многоногий, большой рот и т.п<br>Часто прислуживают темным колдунам<br>Бояться света ( он их не убивает а лишь причиняет невыносимую боль )<br>Поэтому часто скрываться в заброшенных домах или в нелюдных местах</p></div>\n<p>Миколай отозвался: «О, вот подпитка идея классная» (2024-06-03, id 175798). Сразу после этого Слава написал «Чёт мне это идея не нравится» (2024-06-03, id 175799), Миколай ответил «Ну, так и думал» и «Ну тогда забыли» (2024-06-03, id 175800–175803). Что именно из сказанного не понравилось — сами ночные охотники или конкретно подпитка страхом и болью — в переписке не уточнено. При этом в шестой версии ночные охотники вернулись как часть роли главного героя (2024-06-06, id 176473), то есть из мира они не исчезли.</p>\n<p><strong>Поротай (каменные существа).</strong> Слава напомнил про них 2024-06-03 (id 175807, 175810), Миколай сначала не вспомнил, потом вспомнил (id 175808, 175813). Описание дословно:</p>\n<div class=\"q\"><p>Придумал один вид Поротай<br>Короче есть жуг ты его съедаеш и у тебя 3 варианта<br>1) смерть , все твои внутренности превращаются в камень и отказывают<br>2) превращаются в низший Поротай (горбатого двух лицого, полукаменного-полуплоти , и ты теряешь личностей и слушаещя высшего Поротая ) способности крепкость, реген, сверхсила<br>3) превращается высшего Поротая сохраняешь свой человеческий образ и личность. Способности реген, контроль над низшими, превращать части тела в твердый камень , сверхчеловеческая сила<br>Дебафф у тебя появляется вторая личность жестокая, кровожадная , алочная и т.д.<br>И она составляет чаще всего становится жестоким кровожадным и т.д</p></div>\n<p>Поротай — не раса, а результат съедения «жуга»: три исхода на выбор судьбы, из них один смертельный. Что такое «жуг», в переписке не объяснено.</p>\n<p><strong>Переосмысленные вампиры.</strong> Слава спросил, каких существ добавить, «типо вампиров или оборотней только видео измененный концепт» (2024-06-03, id 175804). Миколай предложил (2024-06-03, id 175805): «Ну вампиры например охотятся на живых и сосут кровь, а эти только на свежих мёртвых, потому что хрупкие, и кровь пить будут отрывая конечности и делать это прилюдно чтобы была подпитка мощная». Отличие от обычных вампиров: питаются только свежими мёртвыми из-за собственной хрупкости, кровь пьют, отрывая конечности, и делают это прилюдно ради мощной подпитки.</p>\n<p><strong>Существа, похожие на людей, растущие от светлой стороны.</strong> Предложение Миколая (2024-06-03, id 175806): «И ещё похожих на обычных людей добавить можно, живущих в обществе, но если к ним люди проявят светлую сторону, они увеличатся и станут похожими на медведя». Отдельного названия им не дано, реакции Славы в переписке нет.</p>\n<p><strong>Серые странники.</strong> Единственный из предложенного Миколаем списка вариант, который Слава принял (2024-06-04, id 175863): «Чёт ничего не понравилась кроме серых странников». В списке они описаны как «загадочные существа, не принадлежащие ни к одной из сторон и преследующие свои собственные цели» (2024-06-04, id 175848), в разделе смешанных или нейтральных.</p>\n<p><strong>Провидцы.</strong> Добавлены Славой на светлую сторону (2024-06-04, id 175864): «Ещё один вид в сторону добра провидцы вымирающий вид ( потому что они сходят с ума из за своей способности и по итогу чаще всего заканчиваются суицидом ). Их способность петля времени ( надеюсь ты не забыл )». Вымирание провидцев — прямое следствие их же способности: она сводит их с ума, и чаще всего дело кончается суицидом.</p>\n<p><strong>Главный герой.</strong> В первой версии — «обычный гг», на которого нападают твари с доминирующей тёмной энергией, после чего его мир переворачивается (2024-06-03, id 175768). В шестой версии его роль определена (2024-06-06, id 176473):</p>\n<div class=\"q\"><p>Он станет хранилищем темных охотником и других существ с темной энергии ( потому что владелец темный энергий перерождаться или в некоторым роде бессмертный, ну то бишь как проклятий в магичке)<br>И он будет страдать поглощая их<br>После свой смерть он отправится в ад вместе с темными</p></div>\n<p>Причина, по которой существ надо куда-то складывать: владелец тёмной энергии перерождается или в некотором роде бессмертен — то есть уничтожить его нельзя, можно только вместить. Ориентир, названный Славой прямо, — проклятия в «магичке».</p>\n<p>Отдельно 2024-06-03 (id 175718–175749) обсуждался персонаж, которого Миколай нарисовал и презентовал. Слава оценил: «Ну норм вроде. Не особо выделяющийся и не особо приукрашенные» (id 175743). Миколай о замысле: «Вообще планирую его таким уебаном сделать», «Конченым человеком просто» (id 175744–175745). На вопрос, что значит «конченым» (id 175747): «Ну тут больше по характеру и поступкам. Те вещи сделает, за которые моя авторская позиция его максимально осудит и не простит» (id 175748), «А подробности в сюжете появятся» (id 175749). Связан ли этот персонаж с главным героем мира, в переписке не сказано.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0012-S03", "MR-0012--mesto-vo-vselennoy"], "h": "<p>Мир даёт название вселенной «Новый мир». Связей с другими мирами в переписке не названо. Ад упомянут как посмертное направление для главного героя и тёмных существ (2024-06-06, id 176473), устройство и статус ада — отдельный ли это мир или часть этого — не описаны.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0012-S04", "MR-0012--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-06-03 (id 175718–175770).</strong> Первое разворачивание. Слава дважды написал «Новый мир» (id 175722, 175759), прежде чем Миколай попросил подробностей: «А тут подробнее. Ты уже второй раз пишешь» (id 175761–175762). Заданы три энергии, борьба тёмной и светлой в человеке и в некоторых существах, жанр «страшилка с приземленными силами», завязка с тварями и обычным ГГ. В конце версии остаётся открытый вопрос Славы: «Вот только какие именно твари темной энергий» (id 175770).</p>\n<p><strong>Версия 2 — 2024-06-03 (id 175770–175796).</strong> Добавлены колдуны — тёмные и светлые, низшие и высшие; правило чистоты энергии для колдунов; способность колдуна видеть цвет человека; уточнение о том, что энергия зависит от способности думать. Миколай предложил утилитарную призму для поведения светлых и тёмных. Слава сформулировал текущую задачу: «И здесь вопрос каких существ запихать в темную сторону или светлую или как людей смесь», «Типо надо существ придумывать» (id 175783–175784). Миколай уточнил, о чём речь — о внешности или о характеристиках; Слава: «Ну вообще и про внешку и про особенный черты» (id 175785–175786).</p>\n<p><strong>Версия 3 — 2024-06-03 (id 175795–175813).</strong> Наполнение бестиарием: ночные охотники (и последующий отказ Славы от идеи), переосмысленные вампиры, существа, растущие от проявленной к ним светлой стороны, каменные существа Поротай. Вечер закончился на «Я спать» (id 175811).</p>\n<p><strong>Версия 4 — 2024-06-04 (id 175845–175866).</strong> Миколай выложил структурированный список существ по трём категориям (id 175848). Слава ответил через пять с лишним часов: «Чёт ничего не понравилась кроме серых странников» (07:00, id 175863). Тогда же добавлены провидцы со способностью «петля времени».</p>\n<p><strong>Версия 5 — 2024-06-05 (id 176188–176194).</strong> Миколай спросил: «А в чёрно белом мире придумал что-то ещё?» (id 176191). Ответа на этот вопрос в переписке нет — разговор ушёл в сторону. Единственное содержательное для мира: здесь он назван «чёрно белым».</p>\n<p><strong>Версия 6 — 2024-06-06 (id 176469–176477).</strong> Определена роль главного героя как хранилища тёмных охотников и других существ тёмной энергии, страдание от поглощения, посмертное отправление в ад вместе с тёмными. На этом разработка в имеющейся переписке заканчивается.</p>", "r": []}, {"t": "Отклонённые варианты", "a": ["S05", "MR-0012-S05", "MR-0012--otklonennye-varianty"], "h": "<p>Список существ, предложенный Миколаем 2024-06-04 (id 175848), Слава забраковал целиком, кроме серых странников. Полный состав списка:</p>\n<p>Тёмная сторона:</p>\n<ol>\n<li>Тенеморфы — существа, созданные тёмными колдунами, которые могут принимать облик теней и проникать в самые защищённые места.</li>\n<li>Кошмарные твари — порождения страхов и негативных эмоций, вызывающие ужас и отчаяние у своих жертв.</li>\n<li>Некромантские слуги — оживлённые трупы или скелеты, подчиняющиеся воле своих создателей.</li>\n<li>Энергетические вампиры — существа, питающиеся жизненной силой и эмоциями других, ослабляя их.</li>\n<li>Тёмные шифтеры — оборотни или метаморфы, способные принимать облик других существ для обмана и проникновения.</li>\n</ol>\n<p>Светлая сторона:</p>\n<ol>\n<li>Целители — существа с мощными способностями к исцелению и восстановлению.</li>\n<li>Светящиеся стражи — создания из чистой светлой энергии, защищающие невинных.</li>\n<li>Мудрые древни — древовидные существа с глубокими знаниями, дающие советы и наставления.</li>\n<li>Звёздные духи — эфемерные создания, связанные с небесными телами, помогающие в навигации и предсказаниях.</li>\n<li>Животные-компаньоны — звери с повышенным интеллектом и способностями.</li>\n</ol>\n<p>Смешанные или нейтральные:</p>\n<ol>\n<li>Серые странники — <strong>принято</strong>.</li>\n<li>Стихийные духи — воплощения природных сил (огонь, вода, земля, воздух), чьё отношение зависит от обстоятельств и окружения.</li>\n<li>Механические конструкты — искусственные создания, наделённые разумом и свободой воли.</li>\n<li>Космические сущности — древние и могущественные создания, чьи мотивы не всегда понятны смертным.</li>\n<li>Полукровки — существа, рождённые от союза представителей разных рас или носителей разных энергий, вынужденные искать баланс внутри себя.</li>\n</ol>\n<p>Отдельно отклонена (или частично отклонена) идея ночных охотников: сразу после похвалы Миколая подпитке страхом и болью Слава написал «Чёт мне это идея не нравится» (2024-06-03, id 175799). Что именно отклонялось, не уточнено; ночные охотники продолжают фигурировать в шестой версии.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "MR-0012-S06", "MR-0012--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Собственного названия у мира в чате нет. Слава зовёт его просто «Новый мир», Миколай — «чёрно белый мир». Совпадение этих обозначений прямо не подтверждено.</li>\n<li>Механика самой борьбы тёмной и светлой энергии внутри человека не разобрана. Миколай прямо просил «для начала стоит разобраться как эта борьба происходит» и «как идёт доминация одной силы над другой» (2024-06-03, id 175776); ответ Славы указал только на причину (человек сам), но не на механику.</li>\n<li>Что такое «жуг», съедение которого превращает человека в Поротая, в переписке не объяснено.</li>\n<li>Соотношение вероятностей трёх исходов при съедении жуга не названо.</li>\n<li>Как устроена способность провидцев «петля времени», не объяснено. Слава сослался на прежний разговор — «надеюсь ты не забыл» — но самого объяснения в этой переписке нет.</li>\n<li>Отклик Славы на утилитарную призму Миколая (2024-06-03, id 175795) отсутствует; принята она или нет — не сказано.</li>\n<li>Что именно Славе не понравилось в идее ночных охотников (2024-06-03, id 175799), не уточнено.</li>\n<li>Существа, «похожие на обычных людей», которые увеличиваются и становятся похожими на медведя от проявленной к ним светлой стороны (2024-06-03, id 175806), не получили ни названия, ни отклика Славы.</li>\n<li>Реакция Славы на переосмысленных вампиров (2024-06-03, id 175805) в переписке не зафиксирована.</li>\n<li>На вопрос «А в чёрно белом мире придумал что-то ещё?» (2024-06-05, id 176191) ответа нет.</li>\n<li>Связь презентованного 2024-06-03 нарисованного персонажа-«уебана» с главным героем мира не установлена.</li>\n<li>Роль светлых колдунов в сюжете не раскрыта: сказано только, что создавать новых существ будут именно тёмные.</li>\n<li>Устройство ада и его отношение к остальному миру не описаны.</li>\n<li>Обещанный Миколаем формат работы — «Можно в формате копипасты наработать тогда сюжетик» (2024-06-03, id 175767) — до связного сюжета в этой переписке не доведён.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0012--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0051.html\">Поротаи (низшие и высшие)</a>, <a href=\"GR-0096.html\">Колдуны (тёмные и светлые)</a>, <a href=\"GR-0097.html\">Ночные охотники (они же «тёмные охотники»)</a>, <a href=\"GR-0098.html\">Серые странники</a>, <a href=\"GR-0099.html\">Провидцы</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0007.html\">Новый мир</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0012--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-06-03</td>\n<td>175718–175770</td>\n<td>w0036</td>\n<td>Новый мир (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-06-03</td>\n<td>175770–175796</td>\n<td>w0036</td>\n<td>Новый мир (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-06-03</td>\n<td>175795–175813</td>\n<td>w0036</td>\n<td>Новый мир (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-06-04</td>\n<td>175845–175866</td>\n<td>w0036</td>\n<td>Новый мир (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-06-05</td>\n<td>176188–176194</td>\n<td>w0036</td>\n<td>Новый мир (объявлено)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2024-06-06</td>\n<td>176469–176477</td>\n<td>w0036</td>\n<td>Новый мир (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0012-novyy-mir.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0012--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0012.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["MR-0012-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/MR-0012/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Самая дорогая дыра тут не в тексте статьи, а под ней: у вселенной «Новый мир» (<code>VS-0007</code>) до сих пор нет своей статьи, хотя от неё уже зависят минимум шесть готовых карточек — сам этот мир (<code>MR-0012</code>), «Три энергии» (<code>MR-0013</code>), Поротай, Ночные охотники, Провидцы, Серые странники. Материала на неё уже накоплено 18593 знака в базе — больше, чем у многих существующих статей. Чинить в первую очередь стоит именно эту дыру: без вводной статьи о вселенной все перечисленные карточки повисают без общей рамки.</p>\n<h3>С чего начать</h3>\n<p>В архив лезть не нужно — материал уже собран в базе, исходник указан прямо в шапке статьи: <code>kb/vselennye/VS-0007-novyy-mir.md</code>. Работа сводится к тому, чтобы превратить эти 18593 знака в статью, а не искать материал заново в переписке.</p>\n<h3>Как развивалось</h3>\n<p>Мир объявлен 3 июня 2024 (id 175718) и активно разрабатывался четыре дня подряд, с паузой на 2024-06-05, когда Миколай спросил «А в чёрно белом мире придумал что-то ещё?» и не получил ответа. Внутри этих же четырёх дней — своя мини-дуга: ночные охотники введены Славой, тут же похвалены Миколаем, тут же самим Славой забракованы («Чёт мне это идея не нравится» — «Ну тогда забыли», 2024-06-03), а через три дня без каких-либо объяснений вернулись как часть роли главного героя (2024-06-06, id 176473).</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для людей прямо названо правило, откуда берётся их природа: доминирование тёмной или светлой энергии — результат собственных поступков, «ты не с рождения псих маньяк». Для существ того же тёмного толка — Поротай, ночных охотников — аналогичного правила нет: Поротай становится таким случайным исходом поедания жуга (один из трёх вариантов), ночные охотники «сотканы» из тьмы сразу. Наделены ли они той же моральной ответственностью, что и люди, или их природа — просто данность без выбора, не проговорено ни разу.</p>\n<h3>Отклик</h3>\n<p>Зацепил контраст между тем, как аккуратно прописана моральная механика для людей (цвет, чистота энергии, личная ответственность), и тем, как небрежно, почти со смехом, придуман Поротай — три исхода от одного «жуга», один из которых смерть, а среди выживших — гарантированная вторая, кровожадная личность. Это два разных регистра придумывания в одном мире, и именно на стыке между ними — самое интересное необъяснённое место.</p></div>", "r": []}];</script>
