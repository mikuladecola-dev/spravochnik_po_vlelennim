<script>const BASE="";const DOCNAME="Петля";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0051-S01", "SP-0051--mehanika"], "h": "<p>Петля — перемотка времени. Слава описывает её в скобках прямо при первом упоминании: «петлю ( то бишь перемотка времени на 10 секунд 10000 раз)» (2024-04-02, id 151858). То есть шаг перемотки — 10 секунд, число доступных перемоток — 10000.</p>\n<p>Как именно происходит перемотка (возвращается ли только носитель или весь мир, помнит ли носитель прошлые витки), в переписке не сказано.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0051-S02", "SP-0051--ogranicheniya-i-cena"], "h": "<p>Единственная названная граница — число повторов: 10000 раз. Цены, отката, условий срабатывания в переписке нет.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0051-S03", "SP-0051--nositeli"], "h": "<p>Носитель не назван. Петля упоминается только как сила, которую собираются «закинуть»/«вбухать» во вселенную, — без привязки к персонажу.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0051-S04", "SP-0051--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-04-02 (id 151856–151860, окно w0029).</strong> Первое описание. Слава перечисляет, что хочет закинуть в новую вселенную: «Вообще я хочу туда закидать петлю ( то бишь перемотка времени на 10 секунд 10000 раз) / Также люди берущий свою силу от животных то бишь агенты среди людей / Также туда можно и закон закидать» (id 151858). Петля идёт первым пунктом списка, рядом с агентами, берущими силу от животных, и с законом.</p>\n<p><strong>Версия 2 — 2024-04-02, вечер (id 152590–152600, окно w0029).</strong> Повтор прежней мысли, новых деталей о самой петле нет. Слава переформулирует концепцию мира и называет петлю в числе сверхсил, которые надо туда поместить: «Лучшей будет создать концепцию scp только вбухать туда и сверхсила типо петли и закона, и экспериментах на людях / И другую расу которая будет нам помогать / Вообще концепция охота на аномалий» (id 152594). Миколай в ответ сомневается в самой надобности добавления: «Ты точно чет хочешь добавить у Поротая как по мне и так много способностей, а концепцию ты придумал, в чем вопрос не пон» (id 152599).</p>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S05", "SP-0051-S05", "SP-0051--otklonennye-varianty"], "h": "<p>Отклонён не вариант самой петли, а рамка, в которую её предполагалось поместить. Изначальная концепция мира — «организация которая борется с злом то бишь добро и зло» — забракована автором в тот же день: «но сейчас думая мне как то не нравится» (id 152594). Взамен предложена концепция scp / «охота на аномалий», и петля переезжает в неё.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S06", "SP-0051-S06", "SP-0051--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Петля названа в одном ряду с законом — оба раза они перечисляются вместе как сверхсилы, которые надо поместить в мир (id 151858, 152594). Характер связи не описан, только соседство в списке.</p>\n<p>Также в связях записи значатся: концепция scp / охота на аномалий, организация, ловящая обнаглевших существ. Из того же перечня — люди, берущие свою силу от животных, «то бишь агенты среди людей», и «другая раса которая будет нам помогать», и эксперименты на людях; как петля соотносится с ними, в переписке не сказано.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "SP-0051-S07", "SP-0051--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Не сказано, кто носитель петли.</li>\n<li>Не сказано, есть ли ограничения кроме числа повторов.</li>\n<li>Не сказано, что происходит при исчерпании 10000 повторов.</li>\n<li>Не описано, на что распространяется перемотка — на носителя, окружение или мир целиком.</li>\n<li>Ответа на вопрос Миколая, зачем добавлять петлю, если способностей и так много (id 152599), в окне нет; вопрос остался нерешённым.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0051--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0053.html\">Организация, ловящая обнаглевших существ</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0007.html\">Новый мир</a>, <a href=\"VS-0014.html\">игра бога</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0051--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-04-02</td>\n<td>151856–151860</td>\n<td>w0029</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-04-02</td>\n<td>152590–152600</td>\n<td>w0029</td>\n<td>игра бога (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0051-petlya.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0051--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0051.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
