<script>const BASE="";const DOCNAME="Правитель Кильки";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0217-S01", "PS-0217--proishozhdenie"], "h": "<p>Правитель Кильки — один из Правителей, и в переписке он назван первым из них. Развёрнутое определение того, что такое правители вообще, дано в тексте от 2025-10-18 (id 375849): «Это не физические существа появившиеся в нигде и в ни чем. Они первыми, что появилось в пустоте. И именно они начали создавать мир. По своему желанию». Там же оговорено, что «между всеми мирами есть связь, которую не может оборвать не один правитель».</p>\n<p>Порядок появления правителей задан прямо: «Первым правителем был правитель кильке. Вторым же был правитель рая. Поэтому их мир в разы больше миров других правителей» (2025-10-18, id 375849). То есть размер мира связан с очерёдностью появления его правителя, и Килька с Раем по этой причине крупнее прочих миров.</p>\n<p>Мир, который он создал и которым правит, — Килька. Связь Кильки с остальными мирами описана как самая сильная: существа, покидающие свой мир, «неосознанно перемещаться по связи, а связь с килькой у каждого другого мира сильная», поэтому чаще всего они попадают именно в Кильку (2025-10-18, id 375849).</p>", "r": []}, {"t": "Способности", "a": ["S02", "PS-0217-S02", "PS-0217--sposobnosti"], "h": "<p><strong>Сдерживание аномалии.</strong> Внутри Кильки образовался мир — аномалия, и «конечно правитель кильке не позволяет ему расти» (2025-03-06, id 298868). Уточнение в следующем сообщении: «То бишь озера перерождения» (id 298869).</p>\n<p><strong>Право выбрасывать существ из мира.</strong> В перечне способов, которыми существо может покинуть свой мир, четвёртым пунктом стоит: «Вас может выкинуть сам правитель ( очень очень очень, крайне редко)» (2025-10-18, id 375849).</p>\n<p><strong>Замкнутость Кильки на выход.</strong> Общее правило «Любое существо может покинуть свой мир если будет знать способ» для его мира не работает: «Но всё существа кильке не способны покинуть свой мир. Не каким либо образом» (2025-10-18, id 375849).</p>\n<p><strong>Благословение.</strong> Правители способны давать благословение — «то есть настраивать связь с существом живущими в мире ( благословения даётся только существами живущими в кильке)». Связь настраивается без разрешения существа и устанавливается на мозге; через неё правитель передаёт свою силу существу, «человеку чаще всего». Сила проходит через мозг, вредя ему, поэтому благословенные редко пользуются благословением; «средние продолжительность жизнь у благословенного после получения благословения 10 лет» (2025-10-18, id 375849).</p>\n<p>У всех благословенных при активации есть четыре основных способности: усиленная регенерация; усиление тела и всех чувств; аура («то бишь самая энергия, которая выплескивается и заставляет чувствовать страх е животных и обычных людей. Так же способный влиять на окружающей. При сильном скоплении»); сенсорика (позволяет ощущать других благословенных, арбитра или Протобионтов). Сверх этого есть уникальная способность правителя: «у правителя уникальная благословенния дающий отличающий от всех других благословенной способность. НО если правитель, что дал вам благословения. Даст благословения ещё другому человеку. То оно будет такой же, как и у вас». Всё, полученное благословением, исчезает при его отключении — «буть то огненный шар или остановка времени они просто отключаться» (2025-10-18, id 375849).</p>\n<p>Число благословений ограничено и у разных правителей разное: «21 это максимальное число благословения, который способен давать правитель рая. Другие же правители дают меньше» (2025-10-18, id 375849). Сколько благословений способен дать правитель Кильки — в переписке не сказано.</p>\n<p><strong>Дети-Протобионты.</strong> «У правителей есть дети, которых зовут Протобионты. Это субъект, который был создан именно правителем, а не из-за особенности мира. Подобные субъекты имеют огромную силу, которая в теории позволит уничтожить континент. Но большинство существ спокойный и миролюбивый. При этом они очень не любят покидать мир своего родителя» (2025-10-18, id 375849). Есть ли Протобионты конкретно у правителя Кильки и кто они — в переписке не сказано.</p>\n<p><strong>Артефакт и струны (обсуждалось как возможность).</strong> В разговоре про артефакт, бывший у Агрегата (<a href=\"PS-0182.html\">Агрегат</a>), Миколай описал его как «по типу медиатора»: он «позволял менять натяжение струн пространства всех миров», и «если играть на правильной частоте то например он мог на увеличенной площади или на далеком расстоянии использовать свою способность передовая по волне струны». Отдельно оговорено применение артефакта правителем: «однако, если этот артефакт использует правитель или может использовать его через какую-то установку можно воздействовать на струнную связь между мирами» (2025-03-06, id 298827). Сам Миколай назвал это сырой идеей, Слава согласился: «Да сырая идея, ну можно отталкиваться» (id 298834). Дальше эта линия в приведённых окнах не развита.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Сообщение 375849 от 2025-10-18 содержит устройство правителей, порядок их появления, способы покинуть мир, механику благословения, число 21, протобионтов. В базе оно нарезано на записи, у которых нет ни статей, ни входящих ссылок: <code>SP-0240</code> «Благословение правителя» — 9 835, <code>SP-0241</code> «Четыре основные способности благословенных» — 9 573, <code>SP-0242</code> «Уникальная способность правителя» — 9 592. Почти 29 тысяч знаков основы мира, ноль ссылок на всё. Эта статья пересказывает их своими словами, и так же поступит любая следующая — пока не решено, где эти правила живут, они будут переписываться заново в каждой карточке.</p></div>\n<div class=\"mnote\"><b>⚙ машинная заметка · Что не сформулировано по вашей же логике — не материал авторов</b>\n<p>Про выход правило названо с обеих сторон: существо может покинуть мир, если знает способ; правитель может выкинуть существо сам, очень редко; существа Кильки не могут выйти никаким образом. Про вход правила нет. Сказано, что покинувшие свой мир «неосознанно перемещаются по связи» и чаще всего попадают именно в Кильку — то есть вход происходит сам собой, самотёком. Участвует ли в нём правитель принимающего мира, может ли он не пустить, при том что выкинуть может, — не проговорено. Для двери наружу хозяин назван, для двери внутрь того же рода — нет.</p></div>", "r": [["Агрегат", "PS-0182.html"]]}, {"t": "Связи с другими", "a": ["S03", "PS-0217-S03", "PS-0217--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Килька</strong> — его мир, часть которого он и есть. Килька связана со всеми прочими мирами сильнее, чем они между собой.</li>\n<li><strong>Правители</strong> — категория, к которой он принадлежит и в которой он первый.</li>\n<li><strong>Правитель рая</strong> — второй появившийся правитель; из-за очерёдности мир Рая тоже «в разы больше миров других правителей». Апостолы — 21 человек, получивший благословение именно от правителя рая, а не от правителя Кильки (2025-10-18, id 375849).</li>\n<li><strong>Сестра имитатора</strong> — в первой версии сюжета цель объединения миров принадлежала правителю, затем была передана ей (2025-03-06, id 298834).</li>\n<li><strong>Аномалия внутри Кильки / озеро перерождения</strong> — то, чему он не позволяет расти.</li>\n<li><strong>Благословенный Фениксом</strong> — упомянут в том же разговоре о препятствиях и о том, что нужно злодеям: он «имеет способность создавать на вечность большое количество пламени, что можно либо как топливо использовать либо для того чтобы нагреть стены, расшевелить и сделать больше похожими на частицы» (2025-03-06, id 298827). Прямая связь с правителем Кильки в переписке не названа.</li>\n</ul>", "r": []}, {"t": "Как менялся", "a": ["S04", "PS-0217-S04", "PS-0217--kak-menyalsya"], "h": "<p><strong>2025-03-06, id 298826–298838 (окно w0079). Правитель как главный злодей — версия отменена в тот же день.</strong></p>\n<p>Исходная постановка Славы: «Цель главного злодея объединить всё миры в один, конечно главным будет Килька, таким образом наш правитель хочет иметь контроль над другими мирами». Тут же он отметил незакрытое место: «А зачем это сестре имитатора, не знаю но придумаю». И сформулировал главный вопрос как «препятствия достижения этой цели, что им надо, что это был за артефакт у агрегата и зачем им благословенный Фениксом» (id 298826).</p>\n<p>Миколай ответил про препятствия: «ну как минимум это независимость других миров и конкуренция» (id 298827).</p>\n<p>Через полчаса замысел был переписан: «И вообще мир будет объединять сестра имитатора, а не правитель» (id 298834). Миколай принял («сестра / пон», id 298836–298838). Таким образом роль инициатора объединения миров у правителя Кильки отобрана и передана сестре имитатора.</p>\n<p><strong>2025-03-06, id 298866–298871 (окно w0079). Сдерживание аномалии.</strong></p>\n<p>Слава напомнил: «Аномалий это мир, который образовался внутри Кильке и конечно правитель кильке не позволяет ему расти», и уточнил — «То бишь озера перерождения».</p>\n<p><strong>2025-10-18, id 375843–375852 (окно w0106). Первый правитель, устройство правителей и благословений.</strong></p>\n<p>Миколай прислал набросок (ссылка на codepen) и текст, написанный, по его словам, «только по одному твоему сообщению» (id 375848). В этом тексте правитель Кильки впервые назван первым из появившихся правителей, описаны природа правителей, способы покидания мира, замкнутость Кильки, Протобионты, механика благословения, апостолы. Слава принял целиком: «Очень круто» / «Делай так» (id 375851–375852).</p>\n<p>Версии не отменяют друг друга, кроме прямо отменённой роли объединителя миров: сдерживание аномалии (март) и первенство среди правителей (октябрь) сосуществуют.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "PS-0217-S05", "PS-0217--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Внешность не описана. Про правителей сказано только, что они «не физические существа».</li>\n<li>Характер, речь, манера не описаны.</li>\n<li>Личное имя не названо — он проходит как «правитель кильке», «наш правитель».</li>\n<li>Зачем объединение миров сестре имитатора после передачи ей этой цели — осталось нерешённым: «не знаю но придумаю» (id 298826); в приведённых окнах ответа нет.</li>\n<li>Препятствия к объединению миров названы только одним пунктом («независимость других миров и конкуренция»), остальные не придуманы: «Ну нужно ещё препятствия», «Что им ещё нужно» (id 298834–298835) — ответа в окне нет.</li>\n<li>Что именно делал артефакт-медиатор — «придумаем что он мог делать с помощью этого» (id 298827); не придумано в приведённых окнах.</li>\n<li>Ритуал как способ покинуть мир помечен самим автором текста как нерешённый: «С помощью ритуала???» (id 375849).</li>\n<li>Сколько благословений может дать правитель Кильки — не названо; сказано только, что у правителя рая максимум 21, а «другие же правители дают меньше».</li>\n<li>Есть ли у правителя Кильки Протобионты и кто они — не сказано.</li>\n<li>Судьба персонажа, его участие в событиях после отмены злодейской роли — в переписке не описано.</li>\n</ul></div>", "r": []}, {"t": "Дополнение: упоминание 2025-08-30 (id 359684–359685, окно w0103)", "a": ["S06", "PS-0217-S06", "PS-0217--dopolnenie-upominanie-2025-08-30-id-3596"], "h": "<p><em>Материал перенесён из ошибочно заведённой записи «Кильке». В реплике «Есть сестра благословенная\nправителем Кильке» слово «Кильке» — склонение имени мира, а не имя отдельного персонажа;\nречь идёт об этом же правителе. Уточнено автором: «Кильке», «Кильки» — склонения одного слова.</em></p>\n<p>Упомянут Славой один раз, внутри рассуждения о том, что имеющихся сил не хватает и «Нужен злодей».\nНазван как правитель, дающий благословение: «Есть сестра благословенная правителем Кильке.»</p>\n<p>Благословлённая им сестра, по оценке Славы, «сильнее одного апостола» — но этого мало:\n«Но дальше че. Это не та сила, что поставит на колени весь мир.»\nМеханика благословения в окне не описана — только сам факт, что правитель им наделяет,\nи уровень силы, который оно даёт.</p>\n<p>Про окружение сестры сказано: «А её подручный всё слабее апостолов. Каждый из них один на один\nпротив апостолов продует. При этом у них не такая большая группировка».\nОтношения правителя с сестрой, с её группировкой и с апостолами в переписке не описаны.</p>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0217--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0023.html\">Правители (правители миров, правители минимиров)</a></li>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0182.html\">Агрегат</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0182.html\">Агрегат</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0023.html\">Правители (правители миров, правители минимиров)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0217--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-03-06</td>\n<td>298826–298838</td>\n<td>w0079</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-06</td>\n<td>298866–298871</td>\n<td>w0079</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-10-18</td>\n<td>375843–375852</td>\n<td>w0106</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0217-pravitel-kilki.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0217--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0217.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0217-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0217/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Самое дорогое здесь — то, что вся космология вселенной висит на одном сообщении и ни у одного её куска нет хозяина.</p>\n<p>Сообщение 375849 от 2025-10-18 содержит устройство правителей, порядок их появления, способы покинуть мир, механику благословения, число 21, протобионтов. В базе оно нарезано на записи, у которых нет ни статей, ни входящих ссылок: <code>SP-0240</code> «Благословение правителя» — 9 835, <code>SP-0241</code> «Четыре основные способности благословенных» — 9 573, <code>SP-0242</code> «Уникальная способность правителя» — 9 592. Почти 29 тысяч знаков основы мира, ноль ссылок на всё. Эта статья пересказывает их своими словами, и так же поступит любая следующая — пока не решено, где эти правила живут, они будут переписываться заново в каждой карточке.</p>\n<p>Второе — сам «правитель» как понятие. <code>MR-0120</code> «Правитель» — 35 010 базы, одна ссылка. <code>PS-0278</code> «Правители» — 26 811, одна ссылка. <code>MR-0097</code> «Правители миров» — 9 624, одна. <code>MR-0103</code> «Правители минимиров» — 3 793, одна. <code>GR-0023</code> — ноль. <code>VS-0010</code> «Правитель» — вселенная, 648, статьи нет. Шесть записей об одном, ни одна не собирает больше одной входящей ссылки, а у первого из правителей — этой статьи — базы 14 203, меньше, чем у любой из них. Определение, которое статья цитирует в первом абзаце, лежит не здесь.</p>\n<p>Третье, точечное: <code>SP-0192</code> «Артефакт-медиатор» — статья 8 249, база 4 954, ноль входящих ссылок. Пробел «что именно делал артефакт» стоит в списке нерешённых, а запись под него уже заведена, и отсюда на неё не ведёт ничего.</p>\n<h3>С чего начать</h3>\n<p>В базе.</p>\n<p>Артефакт — <code>SP-0192</code>, плюс <code>SP-0047</code> «Артефакты» (24 897, статья 16 873) и <code>SP-0212</code> «артефакты апостолов» (2 060).</p>\n<p>Отменённая злодейская линия и вопрос «зачем это сестре имитатора» — <code>PS-0215</code> «Сестра имитатора»: четыре входящие ссылки, статья 12 299, база 7 906; <code>IS-0036</code> «Цель злодеев: объединение всех миров» — статья 14 718, база 11 288; <code>GR-0007</code> «Команда (подручные) сестры» — статья 11 757; <code>PS-0289</code> «Подручные сестры» — 3 008; <code>MR-0170</code> «Группировка сестры» — 4 292, статьи нет. Роль передали, и вместе с ней уехал весь материал: у сестры четыре ссылки, у правителя две.</p>\n<p>Аномалия внутри Кильки и озеро перерождения — <code>MR-0116</code> «Аномалия (мир внутри Кильки)» (статья 4 399, база 2 088) и <code>MN-0009</code> «Озеро перерождения» (статья 16 268, база 22 625). У обеих ноль входящих ссылок, при том что единственное действие правителя в марте — не давать этому расти.</p>\n<p>Сколько благословений он даёт и есть ли у него протобионты — сравнивать с <code>PS-0279</code> «Правитель рая» (23 121, две ссылки) и <code>PS-0280</code> «Протобионты» (18 920, две ссылки); сам мир — <code>MR-0207</code> «Килька», 68 896 базы при одной входящей ссылке.</p>\n<p>В архив — за двумя вещами. Первая: 2025-03-06, окно w0079, промежуток 298838–298866. Между «сестра / пон» и возвратом к аномалии полчаса, и именно там роль главного злодея была переиграна; в приведённых кусках видно решение, но не разговор. Вторая — не текст: набросок на codepen, присланный Миколаем 2025-10-18 (id 375848). Он лежит внешней ссылкой, в базе его нет, а Слава принял именно его — «Очень круто», «Делай так».</p>\n<h3>Как развивалось</h3>\n<p>2025-03-06 — заявили как главного злодея с целью объединить все миры под Килькой. В тот же день, через полчаса, отобрали: цель передана сестре имитатора, Миколай принял двумя словами. Тем же днём добавили единственное собственное действие — сдерживание аномалии. Дальше семь месяцев ничего. 2025-10-18 — вернулись, но с другой стороны: Миколай написал сводный текст «только по одному твоему сообщению», и в нём правитель Кильки впервые стал первым из появившихся правителей. Слава принял целиком, не правя.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Про выход правило названо с обеих сторон: существо может покинуть мир, если знает способ; правитель может выкинуть существо сам, очень редко; существа Кильки не могут выйти никаким образом. Про вход правила нет. Сказано, что покинувшие свой мир «неосознанно перемещаются по связи» и чаще всего попадают именно в Кильку — то есть вход происходит сам собой, самотёком. Участвует ли в нём правитель принимающего мира, может ли он не пустить, при том что выкинуть может, — не проговорено. Для двери наружу хозяин назван, для двери внутрь того же рода — нет.</p>\n<h3>Отклик</h3>\n<p>Зацепила одна механика: очерёдность появления определяет размер мира. Кто пришёл в пустоту первым, у того мир больше — старшинство, измеренное в площади. Из этого само собой выпадает всё остальное: связь с Килькой у каждого мира сильнее, чем между собой, значит потерявшийся попадает туда, значит первый мир работает стоком, куда сливается чужое. И тут же обратное — свои из него не выйдут никаким образом. Мир-воронка: всё внутрь, ничего наружу. Правитель при этом не сделан большим, наоборот: единственное, что он в переписке делает, — держит, чтобы не росло то, что завелось у него внутри. Первый из всех, самый большой мир, и вся работа — не пускать аномалию. Отдельно понравилось, как быстро с него сняли злодейство: полчаса, «И вообще мир будет объединять сестра имитатора», ответ «сестра / пон». Персонажа разжаловали в двух репликах, и после этого он семь месяцев не существовал.</p></div>", "r": []}];</script>
