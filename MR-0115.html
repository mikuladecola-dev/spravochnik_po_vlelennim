<script>const BASE="";const DOCNAME="Механизм объединения миров";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0115-S01", "MR-0115--ustroystvo"], "h": "<p>Механизм объединения миров — сооружение, придуманное Миколаем 2025-03-06 (id 298843) в ответ на вопрос Славы о том, как будет проводиться обряд объединения миров.</p>\n<p>Дословно: «я вижу что какое-то крупное сооружение размером с гору, какой-то механизм, который можно объединить собрав артефакты 🤔 разных миров и запитав огнём благословенного фенриром, ибо он самый мощный и есть ещё какая-то особенность».</p>\n<p>Отсюда складывается устройство:</p>\n<ul>\n<li>крупное сооружение размером с гору;</li>\n<li>собирается («объединить») из артефактов разных миров;</li>\n<li>запитывается огнём благословенного — в реплике сказано «благословенного фенриром», в реестре сущность связана с «Благословлённый Фениксом»; какое из двух имён верное, из переписки не следует;</li>\n<li>обоснование выбора носителя: «ибо он самый мощный»;</li>\n<li>«есть ещё какая-то особенность» — какая именно, не названо.</li>\n</ul>\n<p>Формулировка Миколая на всём протяжении неопределённая: «какое-то крупное сооружение», «какой-то механизм», «какая-то особенность». Точных характеристик — материала, принципа работы, вида — в переписке нет.</p>\n<p>Количество артефактов задано отдельной репликой Славы и по внесюжетной причине: «Нужно хотя бы 16 вещей так как сюжет должен быть длинным» (id 298841). То есть 16 — это нижняя граница, поставленная ради длины сюжета.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S02", "MR-0115-S02", "MR-0115--mesto-vo-vselennoy"], "h": "<p>Механизм — часть темы «Цель злодеев: объединение всех миров»: он и есть инструмент, которым эта цель достигается. Вопрос Славы, с которого начинается кусок, — «Что нужно для этого обряда» (id 298840).</p>\n<p>Расположение механизма прямо не названо. Названо место последней битвы, и то предположительно: на вопрос «Где будет последняя битва» (id 298844) Миколай отвечает «у озера будет красиво» (id 298845) и следом «ну наверное это будет что-то из средних миров» (id 298846). Слово «наверное» оставлено как есть — привязка к средним мирам не утверждена.</p>\n<p>Из устройства следует связь с разными мирами вообще: артефакты для сборки берутся из них.</p>", "r": []}, {"t": "Население", "a": ["S03", "MR-0115-S03", "MR-0115--naselenie"], "h": "<p>Не описано.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0115-S04", "MR-0115--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-03-06 (окно w0079, id 298840–298847).</strong> Единственная версия. Первое и единственное описание механизма и способа его запитать.</p>\n<p>В том же куске Слава фиксирует счёт противников: «12 злодеев пока» (id 298847). Слово «пока» указывает, что число не окончательное.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0115-S05", "MR-0115--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Что за «ещё какая-то особенность» у благословенного, чьим огнём запитывается механизм, — не сказано.</li>\n<li>Имя носителя расходится: в реплике «фенриром», в связях реестра «Благословлённый Фениксом». В переписке расхождение не разрешено.</li>\n<li>Какие именно артефакты нужны, из каких миров и что они собой представляют — не названо. Названо только их минимальное количество: «хотя бы 16».</li>\n<li>Как механизм строится, кем и где — не сказано.</li>\n<li>Что происходит с мирами после объединения — в этом куске не обсуждается.</li>\n<li>Место самого механизма не названо; предположение про озеро и средние миры относится к последней битве и оставлено неутверждённым.</li>\n<li>Число злодеев (12) помечено самим автором как предварительное.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["MR-0115--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-03-06</td>\n<td>298840–298847</td>\n<td>w0079</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0115-mehanizm-obedineniya-mirov.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0115--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0115.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
