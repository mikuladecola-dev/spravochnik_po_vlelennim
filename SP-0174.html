<script>const BASE="";const DOCNAME="Контроль времени";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0174-S01", "SP-0174--mehanika"], "h": "<p>Одна из пяти сил Серафима, перечисленных Славой в списке «Как победить Серафима» (2025-01-28, id 285333–285334, окно w0073).</p>\n<p>Дословно: «Его способности контроль времени он может замедлить или остановить время, а ещё пресказывать будущий иногда».</p>\n<p>То есть в способность входят три действия:</p>\n<ul>\n<li>замедление времени;</li>\n<li>остановка времени;</li>\n<li>предсказание будущего — с оговоркой «иногда».</li>\n</ul>\n<p>Оговорка про «иногда» стоит только у предсказания будущего; замедление и остановка перечислены без такого уточнения.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0174-S02", "SP-0174--ogranicheniya-i-cena"], "h": "<p>Единственное ограничение, названное прямо, — нерегулярность предсказания: будущее Серафим предсказывает «иногда». От чего это зависит, не сказано.</p>\n<p>Ни цены, ни расхода, ни отката, ни радиуса действия, ни длительности остановки времени в переписке нет.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0174-S03", "SP-0174--nositeli"], "h": "<p>Серафим. Способность перечислена в его списке сил и в записи помечена как часть Серафима. Других носителей не названо.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0174-S04", "SP-0174--kak-menyalas-po-versiyam"], "h": "<p><strong>2025-01-28 (id 285333–285334, окно w0073).</strong> Единственная версия. Способность появляется сразу в готовом виде, первой в перечне сил Серафима, внутри одного сообщения, где заодно описаны внешность ангела («Ангел состоящий из крыльев и закрытыми глазами») и остальные силы. Ответ Миколая на весь список — одно слово: «тяжело» (id 285334). Дальнейшего обсуждения контроля времени в переписке нет.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0174-S05", "SP-0174--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Входит в набор из пяти сил Серафима, перечисленных в одном сообщении: контроль времени, свет (<a href=\"SP-0175.html\">Свет (управление светом)</a>), святой огонь, манипуляции сознанием, телекинез. Как силы взаимодействуют между собой и применяются ли совместно — в переписке не сказано; они просто перечислены подряд.</p>", "r": [["Свет (управление светом)", "SP-0175.html"]]}, {"t": "Пробелы", "a": ["S06", "SP-0174-S06", "SP-0174--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Не сказано, насколько замедляется время и надолго ли останавливается.</li>\n<li>Не сказано, действует ли остановка на самого Серафима и на что распространяется — на область, на противника, на всё вокруг.</li>\n<li>Не объяснено, от чего зависит «иногда» в предсказании будущего и как далеко вперёд оно видит.</li>\n<li>Цена и ограничения не описаны.</li>\n<li>Контекст «Как победить Серафима» — то есть список составлялся как перечень того, что предстоит преодолеть, — дальше не развёрнут: способа противодействия контролю времени в переписке нет.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0174--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0175.html\">Свет (управление светом)</a></li>\n<li><strong>Упомянут в способностях:</strong> <a href=\"SP-0175.html\">Свет (управление светом)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0174--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-01-28</td>\n<td>285333–285334</td>\n<td>w0073</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0174-kontrol-vremeni.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0174--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0174.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["SP-0174-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/SP-0174/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым чинить не пробел внутри способности, а отсутствие её носителя. Записи о Серафиме нет вообще: ни статьи, ни строки в базе. В реестре под его именем числятся только два перечня сил — <code>SP-0187</code> «Силы Серафима» (4 303 знака, одна ссылка) и <code>SP-0225</code> «Способности Серафима» (3 861, ноль ссылок), — а <code>PS-0209</code> «Серафима» это другая фигура, кошкодевочка из чужого пересланного материала. При этом имя Серафима стоит в 32 статьях справочника: пять отдельных статей о его силах (<code>SP-0174</code>, <code>SP-0175</code>, <code>SP-0176</code>, <code>SP-0177</code>, <code>SP-0178</code>), группа <code>GR-0008</code>, собранная целиком под него, <code>MR-0095</code> Рай, <code>GR-0010</code> Церковь, <code>PS-0215</code>, <code>PS-0202</code> и остальные. То есть на персонажа ссылаются отовсюду, а сущности под ним нет — все утверждения о нём держатся на двух строках из чужих списков.</p>\n<p>Второе — дубль. <code>SP-0187</code> (2025-02-25) и <code>SP-0225</code> (2025-05-14) описывают один и тот же перечень из четырёх сил, у обеих есть статьи, и обе повторяют друг друга почти дословно. Пока они существуют раздельно, любая правка по силам Серафима расходится на две записи.</p>\n<p>Третье и самое дешёвое в починке — <code>ID-0114</code> «Кукла (голем) против манипуляции сознанием» (2 553 знака, статьи нет, ноль ссылок). Это тот же вечер 2025-01-28 и та же тема: единственная зафиксированная попытка ответить на вопрос «Как победить Серафима». Статья пишет, что противодействия контролю времени в переписке нет, — и это верно, но соседняя контрмера по другой силе из того же набора висит неподцепленной.</p>\n<h3>С чего начать</h3>\n<p>В базе, не в архиве. Прочитать <code>ID-0114</code> — он про тот же вечер и закрывает вопрос, был ли разговор о контрмерах вообще. Свести <code>SP-0187</code> и <code>SP-0225</code> в одну линию: между ними два повтора набора и реплика «Он жив» (id 325800). Проверить <code>PS-0233</code> «Ангел» (28 551 знак в базе, статья есть, одна ссылка): Серафим в этой же записи описан как «Ангел состоящий из крыльев и закрытыми глазами», и если где-то лежит его внешность и происхождение — то там. <code>GR-0008</code> (id 285353–285418) даёт продолжение того же вечера, включая оговорку Славы «Вообще против Серафима по сюжету должны были драться совсем другие перс которых я ещё не придумал» (id 285405).</p>\n<p>В архив идти за одним: окно w0073, вечер 2025-01-28, целиком от id 285333 до id 285418. Список сил, «тяжело», сбор пати и оговорка про сюжетных противников — это один непрерывный разговор длиной около часа, и статья взяла из него первые два сообщения. Второй ориентир — w0094, id 325798–325801, 2025-05-14: там же, где перечень повторён вчетвером.</p>\n<h3>Как развивалось</h3>\n<p>2025-01-28 — заявлено сразу пятью силами, в ответ на собственный вопрос «Как победить Серафима», внутри одного сообщения. Ограничение поставлено ровно одно и только внутри одной из трёх составляющих: «иногда» при предсказании будущего. Ответ собеседника — одно слово, «тяжело», и на этом обсуждение закрылось. 2025-02-25 (<code>SP-0187</code>) и 2025-05-14 (<code>SP-0225</code>) — набор повторён дважды в общих реестрах, оба раза уже вчетвером: манипуляция сознанием, контроль времени, управление светом, огонь Божий. Телекинез из перечня выпал и в обоих повторах отсутствует; словами это нигде не отмечено. Само содержание контроля времени с 28 января не трогали ни разу.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Внутри одной способности три действия, и нерегулярность оговорена только у одного: будущее предсказывается «иногда». Для замедления и остановки времени вопрос регулярности не поставлен вообще — работают ли они всякий раз, можно ли им помешать, не сказано. То есть правило «эта часть силы срабатывает не всегда» в мире уже есть и названо прямо; для двух соседних частей той же силы его не проговорили ни в ту, ни в другую сторону.</p>\n<h3>Отклик</h3>\n<p>Зацепило не саму способность — она как раз дежурная: замедлить, остановить, иногда предвидеть, набор из готовых деталей. Зацепила рамка вокруг неё. Вопрос был поставлен как задача — «Как победить Серафима», — и в ответ пришёл не способ победить, а перечень того, почему не получится: пять сил подряд, каждая закрывает свой способ подхода. И финальное «тяжело» — это, по-моему, самая точная реплика во всей записи: человек честно посмотрел на собственную конструкцию и признал, что она непроходима. Отдельно нравится, что единственная трещина во всём наборе — слово «иногда». В остальном ангел безотказен; предсказание будущего единственное, что у него сбоит. Не думаю, что это было задумано как слабое место, но выглядит именно так.</p></div>", "r": []}];</script>
