<script>const BASE="";const DOCNAME="Новая вселенная";
const LEAD="<p>Заход на сеттинг, сделанный за один вечер (2024-06-17, id 183016–183240, окно w0038). Слава открывает его словами: «И давай какой раз переобуваемся», «Новая вселенная» (id 183017–183020). Имя вселенной в чате не названо — только «новая вселенная».</p>";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0014-S01", "MR-0014--ustroystvo"], "h": "<p>Первое описание даётся Славой одним куском (id 183022):</p>\n<div class=\"q\"><p>«Говно но мне пойдет. Мир вообще современный но там нет небоскребов там участки земли города и чё нибудь дальше придумаю. И сверх люди из за которых земля стала такой воюет друг против друга . Также снова артефакты только в большем количестве и специальными опилками под пользователя ( вот только кто из делает) вообще изначально хотел чтобы это был один человек но который для некоторых делает личной орудий но передумал так как там будут и гниды не достойный жизни и у них тоже будут артефакт под стать их ним способностям»</p></div>\n<p>То есть: мир современный, небоскрёбов нет, есть участки земли и города; земля стала такой из-за сверхлюдей, которые воюют друг против друга; в мире много артефактов, подстроенных под пользователя «специальными опилками».</p>\n<p>Правила, установленные по ходу вечера:</p>\n<ul>\n<li>Магии нет (id 183136, реплика Миколая, оставленная без возражений; там же «Без б»).</li>\n<li>Богов нет: «Нет богов не будет» (id 183233).</li>\n<li>Огнестрел есть — пистолеты и автоматы. Сверхлюди при этом «который могут уклоняться или отражать» (id 183129).</li>\n<li>Оружие «ну почти уникальная» и «Зависит от носителч» (id 183129, 183138).</li>\n<li>Драконов и прочих фэнтезийных существ как источника материала для инструментов в списке Миколая упоминались, но были сведены Славой к трём категориям (см. ниже).</li>\n</ul>\n<p>Итоговая формулировка концепции, данная Славой в конце вечера (id 183238):</p>\n<div class=\"q\"><p>«Более полная концепция<br>Сила разрушает хозяина а инструмент останавливает это разрушение»</p></div>\n<p>Слава добавляет: «В своем прошлом предложение было слишком но а сейчас из стало поменьше» (id 183240).</p>\n<h3>Артефакты и инструменты</h3>\n<p>Терминологическое разграничение вводит Миколай (id 183027–183029): «Артефакты не могут создаваться в настоящем / Иначе они таковыми не считаются / То есть это просто будет ну орудие , может сильное. Инструмент, но не артефакт». Слава принимает: «Ну инструмент» (id 183030).</p>\n<p>Миколай приводит список возможных форм инструментов (id 183032): оружие (мечи, кинжалы, посохи, луки, доспехи), украшения (кольца, амулеты, ожерелья, диадемы), предметы быта (чаши, кубки, вазы, сундуки, свитки), магические книги и свитки, «свитые из драконьих чешуек», реликвии (части тела мифических существ, осколки древних артефактов), артефакты-существа (живые големы, драконы, феи, духи), архитектурные сооружения (древние башни, руины, подземные храмы). Слава сводит всё к трём: «Аксессуары, холодное оружие, огнестрельное» (id 183034).</p>\n<p>Вопрос о том, кто изготавливает инструменты, поставлен Славой в первом же сообщении — «вот только кто из делает» — и остался нерешённым. Изначальный вариант с единственным мастером Слава отверг сам: раз в мире есть и «гниды не достойный жизни», у которых тоже будут инструменты под их способности, единый мастер не подходит.</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0014-S02", "MR-0014--naselenie"], "h": "<p>Сверхлюди — воюющая друг с другом сила, из-за которой «земля стала такой». Способности есть не у всех: «И понимания сверх людей там будет меньше. Некоторый просто оружием хорошо махають» (id 183023). Отдельно оговорено, что в мире будут «гниды не достойный жизни», и у них тоже есть инструменты под стать их способностям.</p>\n<p>Мир связан с записями: Зурбон, Инструменты, Катапира, Сталкер, Текси.</p>", "r": []}, {"t": "Масштаб повествования", "a": ["S03", "MR-0014-S03", "MR-0014--masshtab-povestvovaniya"], "h": "<p>Миколай ставит вопрос прямо (id 183096): «Ты хочешь прям эпосный сюжет? Типа брать страны или даже коалиции? Я конечно извиняюсь, как по мне это не драматично, а значит не интересно / Или ты хочешь взять по 3 героя с каждой стороны и их нормально раскрыть и заставить драться?» Слава: «Ну ближе ко 2» (id 183104). На просьбу расписать подробнее — «Не представляю ещё» (id 183110).</p>", "r": []}, {"t": "Источник", "a": ["S04", "MR-0014-S04", "MR-0014--istochnik"], "h": "<p>Толчком послужило видео на YouTube (ссылка приведена в id 183051, канал в тот момент начал перезапуск, и это было первое видео перезапуска). Слава описывает механику появления идеи (id 183060–183061): «Ну я увидел рельсы и сразу представил постапокалипсис, увидев оружия сразу подумал о огнестрелье» и «И инструментов».</p>\n<p>Миколай в качестве ориентира называет аниме «нет игры нет жизни» — «где боги тож хуету наделали» (id 183033).</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S05", "MR-0014-S05", "MR-0014--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-06-17 (id 183016–183024).</strong> Первое объявление мира: современность без небоскрёбов, участки земли и города, воюющие сверхлюди, артефакты в большом количестве со специальными опилками под пользователя. Идея единственного мастера-изготовителя отвергнута сразу же. Слава заключает: «И надо как то из всего этого собрать конфетку» (id 183024).</p>\n<p><strong>Версия 2 — 2024-06-17 (id 183025–183035).</strong> Уточняются термины: артефакт не может быть создан в настоящем, иначе это инструмент. Список возможных форм инструментов сводится к аксессуарам, холодному и огнестрельному оружию. Миколай отмечает, что до этого предполагал, будто артефакты «остались от прошлого, где были небоскрёбы» (id 183031).</p>\n<p><strong>Версия 3 — 2024-06-17 (id 183051–183061).</strong> Назван источник вдохновения — видео с рельсами и оружием. Миколай излагает свой отвергнутый вариант происхождения артефактов (id 183052): «Я вообще хотел чтобы один человек был изначально, он сдох в прошлом но оставил артефакты, а их спиздили челы со способностями в его бурдж халифе».</p>\n<p><strong>Версия 4 — 2024-06-17 (id 183096–183111).</strong> Установлен камерный масштаб сюжета: не страны и коалиции, а по три героя с каждой стороны с нормальным раскрытием. Конкретики у Славы пока нет.</p>\n<p><strong>Версия 5 — 2024-06-17 (id 183113–183147).</strong> Уточнения: магии нет, огнестрел — пистолеты и автоматы, сверхлюди умеют уклоняться и отражать, оружие почти уникальное и зависит от носителя. Миколай ставит под сомнение оригинальность связки: «Апокалипсис / Магия / Оружие / Баян же?» (id 183119–183122) и задаёт вопрос «Тогда зачем способности?» (id 183125). Развёрнутого ответа в окне не последовало — Слава пообещал описать позже.</p>\n<p><strong>Версия 6 — 2024-06-17 (id 183231–183240).</strong> Богов в мире не будет. Миколай предлагал вариант с богом, сдерживающим силу «таких неполноценных» с рождения, чтобы мир не был уничтожен (id 183231–183234) — отклонён. Взамен Слава даёт итоговую формулу: «Сила разрушает хозяина а инструмент останавливает это разрушение».</p>", "r": []}, {"t": "Отклонённые варианты", "a": ["S06", "MR-0014-S06", "MR-0014--otklonennye-varianty"], "h": "<ul>\n<li>Единственный мастер, изготавливающий персональные орудия. Отвергнут самим Славой на первом же шаге, потому что инструменты нужны и «гнидам».</li>\n<li>Версия Миколая: мастер умер в прошлом, оставил артефакты, а их «спиздили челы со способностями в его бурдж халифе» (id 183052). Развития не получила.</li>\n<li>Артефакты как наследие прошлого, «где были небоскрёбы» (id 183031) — снято после разграничения артефакта и инструмента.</li>\n<li>Широкий список форм инструментов (реликвии, артефакты-существа, архитектурные сооружения и прочее) — сведён к трём категориям.</li>\n<li>Эпосный сюжет со странами и коалициями — отклонён в пользу камерного.</li>\n<li>Бог, с рождения сдерживающий силу неполноценных, — отклонён вместе с богами вообще.</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S07", "MR-0014-S07", "MR-0014--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имя вселенной в чате не названо.</li>\n<li>Кто изготавливает инструменты — вопрос поставлен и остался без ответа.</li>\n<li>Что такое «специальные опилки под пользователя» — не объяснено.</li>\n<li>Как именно сверхлюди довели землю до нынешнего состояния и что это была за война — не сказано.</li>\n<li>На вопрос «Тогда зачем способности?» при наличии огнестрела ответа в окне нет.</li>\n<li>Устройство камерного сюжета («по 3 героя с каждой стороны») Слава на момент окна не представлял.</li>\n<li>Соотношение этой заготовки с прочими мирами вселенной в переписке не проговорено.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0014--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0014--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-06-17</td>\n<td>183016–183024</td>\n<td>w0038</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-06-17</td>\n<td>183025–183035</td>\n<td>w0038</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-06-17</td>\n<td>183051–183061</td>\n<td>w0038</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-06-17</td>\n<td>183096–183111</td>\n<td>w0038</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-06-17</td>\n<td>183113–183147</td>\n<td>w0038</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-06-17</td>\n<td>183231–183240</td>\n<td>w0038</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0014-novaya-vselennaya.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0014--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0014.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
