<script>const BASE="";const DOCNAME="Поротаи (низшие и высшие)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0051-S01", "GR-0051--chto-eto"], "h": "<p>Поротаи — вид, придуманный Славой 2024-04-02 (id 152575), первым блоком вселенной «игра бога». Это люди, съевшие жуг: «Короче есть жуг ты его съедаеш и у тебя 3 варианта». Из трёх исходов поедания два дают живое существо — низшего Поротая и высшего Поротая, третий даёт смерть.</p>\n<p>Как группу это держит только внутреннее деление: низшие подчиняются высшим («ты теряешь личностей и слушаещя высшего Поротая»), у высшего в списке способностей стоит «контроль над низшими». То есть подчинение задано прямо внутри описания вида, а не появляется потом как организация.</p>\n<p>Оговорка по типу записи: это не отряд, не команда и не организация с именами. Это вид (в «игре бога» авторы говорят именно «вид»: «Придумал один вид Поротай»). Отдельных, поимённо названных Поротаев в переписке нет вообще — ни одного персонажа-Поротая не заведено. В базе вся конструкция лежит как персонаж <a href=\"PS-0036.html\">Поротай</a>. Словом «раса» Поротаев называют позже и уже в другом контексте: 2025-09-18 (id 366586) Слава перечисляет «Кто у нас как раса есть Поротой Азуриэль Апостолы Одержимый»; в «игре бога» слово «раса» к ним не применялось.</p>\n<p>В «Новом мире» вид не изобретается заново. 2024-06-03 (id 175807, 175810) Слава напоминает про него Миколаю посреди набора существ для мира и пересылает то же самое описание слово в слово. То есть по «Новому миру» это тот же вид, а не новое объявление; отдельной группы под «Новый мир» не заводится.</p>\n<p>Название у авторов гуляет в написании: «Поротай», «Поротая», «Поротой», «Поротаи». Кроме того, у вида есть побочное обозначение, идущее от реплики Славы 2024-06-03 (id 175807) «Помнишь про каменных существ» — каменные существа.</p>\n<p>Что такое сам жуг — существо, гриб, предмет, плод — в переписке не сказано ни в «игре бога», ни в «Новом мире». Жуг заведён отдельной записью (<a href=\"SP-0052.html\">Жуг</a>) и во всех окнах описан только через свою роль: то, от съедения чего человек становится Поротаем либо умирает.</p>", "r": [["Поротай", "PS-0036.html"], ["Жуг", "SP-0052.html"]]}, {"t": "Состав", "a": ["S02", "GR-0051-S02", "GR-0051--sostav"], "h": "<p>Поимённого состава нет. Список участников группы пуст: в переписке не названо ни одного конкретного Поротая — ни высшего, ни низшего. Есть только две категории:</p>\n<ul>\n<li>низшие Поротаи;</li>\n<li>высшие Поротаи.</li>\n</ul>\n<p>Численность вида, соотношение низших и высших, сколько низших приходится на одного высшего — в переписке не сказано.</p>", "r": []}, {"t": "Общие способности группы", "a": ["S03", "GR-0051-S03", "GR-0051--obschie-sposobnosti-gruppy"], "h": "<p>Общее у обеих категорий по описанию 2024-04-02 (id 152575), повторённому без изменений в «Новом мире» 2024-06-03 (id 175810):</p>\n<ul>\n<li>регенерация («реген») — стоит в списке и у низшего, и у высшего;</li>\n<li>сила выше человеческой: у низшего «сверхсила», у высшего «сверхчеловеческая сила»;</li>\n<li>связь с камнем: у низшего это «крепкость» и само тело, «полукаменного-полуплоти»; у высшего — «превращать части тела в твердый камень».</li>\n</ul>\n<p>Близость наборов оговорена самими авторами. 2024-04-02 (id 152603) Слава формулирует это прямо: «Поротая низший владеет почти идентичными способностями Поротая высшего вот поэтому я думал может ещё че добавить».</p>\n<p>Камень же является формой гибели третьего, невыжившего исхода: «смерть , все твои внутренности превращаются в камень и отказывают».</p>\n<p>Общее происхождение у всех Поротаев одно — поедание жуга. Никакого другого способа стать Поротаем в переписке не названо.</p>", "r": []}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0051-S04", "GR-0051--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p><strong>Низший Поротай.</strong> Облик меняется полностью: «горбатого двух лицого, полукаменного-полуплоти». Личность утрачивается — «ты теряешь личностей». Подчинён: «слушаещя высшего Поротая». Способности: «крепкость, реген, сверхсила».</p>\n<p><strong>Высший Поротай.</strong> Облик и личность остаются: «сохраняешь свой человеческий образ и личность». Способности: «реген, контроль над низшими, превращать части тела в твердый камень , сверхчеловеческая сила».</p>\n<p><strong>Дебафф — только у высшего.</strong> «Дебафф у тебя появляется вторая личность жестокая, кровожадная , алочная и т.д. И она составляет чаще всего становится жестоким кровожадным и т.д». То есть вторая личность не просто присутствует, а чаще всего берёт верх. У низшего дебафф не назван — у него личности нет вовсе.</p>\n<p>Итог различий: низший теряет тело и личность, но получает подчинение; высший сохраняет и тело, и личность, но получает вторую личность внутрь. Отдельно: «крепкость» стоит только в списке низшего, «контроль над низшими» и обращение частей тела в камень — только в списке высшего.</p>\n<p>От чего зависит, какой из трёх исходов достанется съевшему, — в переписке не сказано. Вероятности исходов не названы (в отличие от Апостолов, где 2025-09-17 в id 366034 названы 13 процентов выживания).</p>", "r": []}, {"t": "Иерархия", "a": ["S05", "GR-0051-S05", "GR-0051--ierarhiya"], "h": "<p>Иерархия двухступенчатая и жёсткая, задана в самом первом описании:</p>\n<ul>\n<li>высший Поротай владеет способностью «контроль над низшими»;</li>\n<li>низший Поротай «теряешь личностей и слушаещя высшего Поротая».</li>\n</ul>\n<p>Подчинение записано с обеих сторон сразу: у низшего — как часть его состояния, наравне с потерей личности, у высшего — как строка в списке способностей.</p>\n<p>Больше уровней нет. Вождя, старшего над высшими, совета, столицы, общего имени организации — в переписке нет. Не сказано и:</p>\n<ul>\n<li>слушается ли низший любого высшего или только своего;</li>\n<li>может ли высший потерять контроль;</li>\n<li>что происходит с низшим, если его высший погибает;</li>\n<li>есть ли иерархия среди самих высших.</li>\n</ul>", "r": []}, {"t": "Отношения с другими группами", "a": ["S06", "GR-0051-S06", "GR-0051--otnosheniya-s-drugimi-gruppami"], "h": "<p>Единственная прямая расстановка сил дана 2025-09-17 (id 366175–366177), в разговоре про Апостолов и Азуриэля:</p>\n<ul>\n<li>«Но апостолы сильнее поротоя» — прямое сравнение по силе;</li>\n<li>Азуриэль, чья способность работает по нервной системе, назван «природным охотником Апостолов», и тут же оговорено: «При этом против Поротой они не так эффективны». То есть против Поротаев Азуриэль работает слабо. Почему именно против Поротаев — не объяснено; со свойством Поротаев каменеть это в переписке не связано.</li>\n</ul>\n<p>На вопрос Миколая «природным?» (id 366178) ответа в записи нет.</p>\n<p>2025-09-18 (id 366586) Поротай перечислен в одном ряду с Азуриэлем, Апостолами и Одержимым как раса вселенной; никакого содержания отношений в этом перечне не задано, только соседство в списке.</p>\n<p>В больших сводках 2025-10-20 (id 376401) и 2025-11-05 (id 382108) Поротай стоит в перечне мутантов рядом с Апостолами, Аскизами, Детьми мирового древа, Азуриэлем и Вампирами. Отношений между ними в этих сводках не описано — только описания каждого по отдельности.</p>\n<p>С населением «Нового мира» Поротаи не связаны ничем. В том же окне (2024-06-03, w0036) Слава и Миколай заводят колдунов (тёмных и светлых, низших и высших), ночных охотников, переосмысленных вампиров, серых странников, провидцев — но Поротаи ни с кем из них не сведены. К какой из трёх энергий вид относится — тёмной, светлой, природной или к смеси, — не сказано, хотя вопрос «И здесь вопрос каких существ запихать в темную сторону или светлую или как людей смесь» (id 175783) задан в том же разговоре, за четверть часа до напоминания про Поротаев.</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S07", "GR-0051-S07", "GR-0051--kak-menyalas"], "h": "<p><strong>2024-04-02 (id 152572–152578), «игра бога».</strong> Первое и полное описание, единственное подробное за всю историю вида. Слава: «Придумал один вид Поротай». Заданы жуг, три исхода, оба набора способностей и дебафф второй личности. Тут же (id 152576) Слава задаёт вопрос: «Какую ещё способность добавить к выше Поротаем».</p>\n<p><strong>2024-04-02, вечер того же дня (id 152599–152603).</strong> Миколай отвечает не поддержкой, а возражением: «Ты точно чет хочешь добавить у Поротая как по мне и так много способностей, а концепцию ты придумал, в чем вопрос не пон». Слава объясняет мотив — низший почти не отличается по способностям от высшего (id 152603) — и передаёт инициативу: «Концепцию та я придумал ну ты можешь туда что нибудь добавить типо объект или вид или способность или т.д». Дальше в базе никакой добавленной способности не появляется: четвёртая способность высшего так и осталась нерешённой, а предложение добавить её повисло на возражении Миколая.</p>\n<p><strong>2024-06-03 (id 175805–175813), объявлена вселенная «Новый мир».</strong> Разговор идёт про набор существ для мира; Миколай перед этим предлагает своё: вампиров, которые пьют кровь не у живых, а «только на свежих мёртвых, потому что хрупкие», отрывая конечности и делая это прилюдно «чтобы была подпитка мощная» (id 175805), и существ, похожих на обычных людей и живущих в обществе, но увеличивающихся до медвежьего вида, «если к ним люди проявят светлую сторону» (id 175806). Следом Слава спрашивает: «Помнишь про каменных существ» (id 175807). Миколай не помнит: «Неа» (id 175808), «Напомнишь?» (id 175809). Слава пересылает ту же карточку дословно (id 175810) и уходит спать. Миколай отвечает «Ааа, вспомнил» (id 175813). Ничего не меняется и ничего не добавляется; обсуждения после напоминания не было. Переносится ли Поротай именно в «Новый мир» с тремя энергиями или просто вспоминается как старая наработка — из окна не следует.</p>\n<p><strong>2025-03-26 (id 311278–311280), вне вселенной.</strong> Слава: «Я уже сказку составляю о новом мире», снова пересылает ту же карточку дословно и добавляет: «Как долго я их искал». Текст описания не изменён.</p>\n<p><strong>2025-09-17 (id 366034–366036).</strong> Та же карточка ещё раз, теперь в потоке разговора про Апостолов и насекомых как источник сил. Рядом задан вопрос: «И сейчас вопрос. Откуда взялись эти насекомые и монстры».</p>\n<p><strong>2025-09-17 (id 366175–366178).</strong> Появляется расстановка сил: апостолы сильнее Поротаев, Азуриэль против Поротаев малоэффективен.</p>\n<p><strong>2025-09-18 (id 366583–366586).</strong> Слава предлагает добавить насекомых, в списке — «Каменный жук», «Белая бабочка или гусеница», «Чёрный червь». В следующем сообщении Поротай назван в перечне рас вселенной. Прямо в переписке каменный жук с жугом не отождествлён.</p>\n<p><strong>2025-10-20 (id 376401–376403), вселенная Оам.</strong> Поротай входит в большую сводку мутантов мира Оам. Здесь текст описания впервые меняется: вместо «есть жуг» стоит «Это мутировавший жук если его съесть человек то у него 3 варианта». Низший назван «двух ликого» (было «двух лицого»), «слушаешь высшего Поротая», в дебаффе «алчная» вместо «алочная». Остальное — три исхода, оба набора способностей, дебафф — воспроизведено без изменений. Слава заканчивает сводку: «Пока что так».</p>\n<p><strong>2025-11-05 (id 382108), вселенная Оам.</strong> Тот же текст сводки повторён ещё раз, описание Поротая в нём не изменено.</p>\n<p>Общий ход: содержание вида задано целиком в один вечер 2024-04-02 и за полтора года не менялось ни в одном пункте. Менялось только окружение — вселенная, к которой вид приписан («игра бога», «Новый мир», вне вселенной, Оам), — и происхождение триггера: жуг превратился в «мутировавший жук» к 2025-10-20.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "GR-0051-S08", "GR-0051--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет: ни один конкретный Поротай не назван и не описан.</li>\n<li>Что такое жуг сам по себе — существо, гриб, предмет, плод — не сказано ни в «игре бога», ни в «Новом мире». Пояснение «мутировавший жук» появляется только 2025-10-20, во вселенной Оам.</li>\n<li>Не сказано, что определяет исход поедания и с какой вероятностью выпадает каждый из трёх вариантов.</li>\n<li>Четвёртая способность высшего Поротая, о которой Слава спросил 2024-04-02 (id 152576), осталась нерешённой: Миколай возразил, что способностей и так много, и ничего добавлено не было.</li>\n<li>Предложение Славы «ты можешь туда что нибудь добавить типо объект или вид или способность» (id 152603) осталось без результата.</li>\n<li>Устройство иерархии дальше пары «высший — низший» не описано: старшинства среди высших, привязки конкретного низшего к конкретному высшему, потери контроля, судьбы низшего при гибели высшего — в переписке нет.</li>\n<li>Численность вида и соотношение низших к высшим не названы.</li>\n<li>Не сказано, есть ли у Поротаев общество, территория, язык, самоназвание — говорится только о виде и подчинении.</li>\n<li>Место Поротаев в «Новом мире» не определено: к какой из трёх энергий они относятся и встречаются ли с колдунами, ночными охотниками, серыми странниками, провидцами — в переписке не сказано. Вид только вспомнили и пересказали, в устройство мира не встроили.</li>\n<li>Отношения описаны только с Апостолами и Азуриэлем, и только через сравнение силы; с остальными расами перечня (Одержимый, Аскизы, Дети мирового древа, Вампиры) отношений не задано.</li>\n<li>К «игре бога» вид приписан по дате объявления; сама вселенная в момент придумывания прямо не названа, концепция вселенной в этот момент менялась.</li>\n<li>Отождествление жуга с «каменным жуком» из списка насекомых 2025-09-18 (id 366585) в переписке не сделано.</li>\n<li>Рядом в справочнике стоит <a href=\"GR-0064.html\">Пророки каменные («Проротой каменный челике», Поротаи)</a> «Пророки каменные» по вселенной «Оам»; тождество или родство с Поротаями авторами не проговорено.</li>\n</ul></div>", "r": [["Пророки каменные («Проротой каменный челике», Поротаи)", "GR-0064.html"]]}, {"t": "Связи — всё вместе", "a": ["GR-0051--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0036.html\">Поротай</a></li>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0052.html\">Жуг</a></li>\n<li><strong>Упоминает группы:</strong> <a href=\"GR-0064.html\">Пророки каменные («Проротой каменный челике», Поротаи)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0007.html\">Новый мир</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0051--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0051.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0051-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0051/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дорогая дыра здесь не в описании вида, а в том, что вид заведён дважды и мостика между записями нет. В «игре бога» это <code>GR-0051</code>, а в Оам та же конструкция лежит отдельно: <code>MR-0169</code> («Пророки каменные», 8328 знаков базы), на который ссылаются <code>MR-0171</code>, <code>MR-0174</code> и <code>VS-0008</code>, плюс собранная по нему статья <code>GR-0064</code> — в её имени прямо стоит «Поротаи». Ещё рядом <code>SP-0246</code> («Превращение через поедание Поротая», 7753 знака базы) — то есть ядро этой статьи, механика поедания, заведено вторым номером в другой вселенной. <code>GR-0051</code> ни на что из этого не ссылается, и наоборот. Чинить надо это: пока непонятно, одна это запись или две, всё, что дописывается в одном месте, не доезжает до другого.</p>\n<p>Второе: обе половины вида в базе без статей. <code>PS-0294</code> («Низший Поротай», 3195 знаков) и <code>PS-0295</code> («Высший Поротай», 3221) — статей нет, ссылок нет, вселенная «неясно». Весь раздел «Чем участники отличаются» держится на паре, у которой ни одна из сторон не оформлена.</p>\n<h3>С чего начать</h3>\n<p>Целиком в базе, в архив идти незачем. Порядок: <code>PS-0294</code> и <code>PS-0295</code> — свести с <code>PS-0036</code> («Поротай», 38750 знаков базы против 22555 в статье, то есть треть материала в статью не вошла); затем решить, <code>MR-0169</code>/<code>GR-0064</code> — это тот же вид или другой; затем <code>SP-0246</code> — не там ли лежит недостающий ответ про то, от чего зависит исход поедания. Отдельно <code>ID-0160</code> («Каменный Поротой», 2859 знаков, без статьи, вселенная «неясно») — это ровно та строка из перечня 2025-09-18, про которую статья говорит, что с жугом её не отождествляли; проверять надо запись, а не чат.</p>\n<p>В архив — за одним куском: 2024-04-02, вечер, id 152599–152603. Там вопрос о четвёртой способности упёрся в возражение и оборвался; смотреть надо, не вернулись ли к нему в том же окне после id 152603.</p>\n<h3>Как развивалось</h3>\n<p>2024-04-02, днём — заявили целиком: жуг, три исхода, оба набора, дебафф. Тем же вечером — ограничили: «и так много способностей», вопрос о четвёртой способности закрылся возражением. 2024-06-03 — забыли: «Неа», «Напомнишь?». Дальше карточку пересылают дословно — 2024-06-03, 2025-03-26, 2025-09-17 — не меняя ни слова. 2025-10-20 — вернулись, и единственное, что изменилось за полтора года, это происхождение триггера: «есть жуг» стало «мутировавший жук». Менялось не содержание, а вселенная, к которой карточка приписана.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Подчинение внутри вида записано как свойство биологии: «контроль над низшими» стоит в списке способностей высшего, утрата личности — в описании низшего. Для соседнего вида того же рода — Аскизов, где структура тоже биологическая, матка и выведенные ею дети, — подчинение не записано ни с одной стороны: сравнение с муравьиной маткой касается только способа размножения. Оба вида стоят в одном перечне мутантов от 2025-10-20; для одного правило подчинения названо, для другого — нет.</p>\n<h3>Отклик</h3>\n<p>Понравилась асимметрия трёх исходов: обе выживших ветки — не «повезло больше» и «повезло меньше», а две разные потери. Низший теряет тело и личность, но получает место в порядке. Высший сохраняет всё и получает вторую личность внутрь — и оговорка «чаще всего становится жестоким» превращает сохранённую личность в проигрывающую сторону. Это заметно интереснее, чем обычная лестница «слабый — сильный». И отдельно любопытен вечер 2024-04-02: Слава хотел добавить четвёртую способность, потому что низший и высший слишком похожи, а Миколай ответил «концепцию ты придумал, в чем вопрос не пон» — при том что вопрос был не про количество способностей, а про то, что различие между ступенями плохо читается. Разговор разошёлся на этом и больше не сошёлся; полтора года карточка ездит по вселенным ровно в том виде, в каком её тогда оставили.</p></div>", "r": []}];</script>
