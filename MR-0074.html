<script>const BASE="";const DOCNAME="Затравка";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0074-S01", "MR-0074--ustroystvo"], "h": "<p>Затравка — условие, при котором энергия вообще способна кристаллизоваться. Формулировка Миколая: «при рождении она появляется и благодаря ней появляется возможность кристаллизовать энергию через опыт» (2024-11-30, id 263727).</p>\n<p>Устройство, внутри которого затравка работает, описано так. Энергия в сосуде «жидкая с рождения и всегда», но «конкретно до 7 лет кристаллизуется часть энергии». На этом кристалле «написаны данные отраженные в опыте и определяющие способность». То есть структура способности — это закристаллизовавшаяся часть энергии, а её содержание задано опытом.</p>\n<p>Процесс объяснён через выращивание настоящих кристаллов: «для выращивания настоящих кристаллов есть свой алгоритм, но это процесс обратимый, однако в разных кристаллах сложность разная, например процессоры это монокристаллы и информацией и их не целесообразно и не практично плавить и кристализировать заново, после записывая информацию, проще чистое вещество взять». Отсюда общее правило для людей: «поэтому никто из людей не может менять свою структуру, это невероятно сложно».</p>\n<p>Затравка — то, чем ограничена обратимость. Даже если кристалл структуры расплавить, обычный человек «не создаст его заново не за что ибо для формирования нужна так называемая затравка». Без затравки расплавленный кристалл не восстановить ничем.</p>\n<p>Отдельно Миколай оговорил, что способность не назначается кем-то: «я тогда забыл то что не просто кто-то пишет способность а это результат опыта» (id 263728).</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0074-S02", "MR-0074--naselenie"], "h": "<p>Отдельно от остальных людей стоит семья с наследственной структурой. Её отличия названы два.</p>\n<p>Первое — механизм смены агрегатного состояния: «у них есть структура наследственная, с механизмом упрощающим этот процесс, которых для других невозможен изв сложности. они в течении 2 дней могут давить в определённую точку для изменения агрегатного состояния структуры способности». Результат: «расплавив они лишаются структуры способности и по сути становятся как новорождённые».</p>\n<p>Второе — «у этой семьи наследственная структура имеет возможность создать искусственно затравку». Это и есть то, чем они отличаются от всех прочих: у остальных затравка бывает только та, что появилась при рождении.</p>\n<p>Цена перезапуска названа прямо: «для кристаллизации новой структуры им нужно то же время что и с момента рождения и она также будет неразвита». Сравнение «как новорождённые» дано не как образ, а как срок.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0074-S03", "MR-0074--mesto-vo-vselennoy"], "h": "<p>Затравка отнесена к кристаллизации энергии — она часть этого устройства, а не отдельное явление. Рядом названы наследственный механизм смены структуры и семья.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0074-S04", "MR-0074--kak-menyalsya-po-versiyam"], "h": "<p>Одно состояние.</p>\n<p>2024-11-30 (id 263727–263728, окно w0065) — Миколай вводит понятие затравки внутри уже названной им ранее модели («как я раньше обозвал твою структуру - кристаллы»), объясняет, почему люди не могут менять структуру, и чем семья отличается от остальных. Следующим сообщением добавляет оговорку про опыт.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0074-S05", "MR-0074--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Разброс внутри семьи заявлен, но не проработан: «у разных членов семьи разное допущение с разными параметрами поиграть может будет». Что за допущение и какие параметры — в переписке не сказано, осталось нерешённым.</li>\n<li>Что это за семья, кто в неё входит, откуда взялась наследственная структура — в переписке не сказано.</li>\n<li>Почему граница кристаллизации проходит именно по семи годам — не объяснено.</li>\n<li>Что происходит с энергией, если структура расплавлена, а новая ещё не выросла (кроме сравнения с новорождённым) — не описано.</li>\n<li>Реплики только от Миколая; реакции второго соавтора в этом окне нет.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0074--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0040.html\">Семья</a>, <a href=\"GR-0042.html\">Сверхлюди (люди с сосудом)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0074--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-11-30</td>\n<td>263727–263728</td>\n<td>w0065</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0074-zatravka.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0074--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0074.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
