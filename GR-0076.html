<script>const BASE="";const DOCNAME="Черныши";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0076-S01", "GR-0076--chto-eto"], "h": "<p>Черныши — название, названное в чате во множественном числе как один из видов аномальных объектов, которые ловит организация Нимб. Разведка завела карточку как на группу, по образцу уже существующих групп-видов, но по переписке это не объединение персонажей с составом и иерархией, а строчка в перечне объектов: имя произнесено дважды и ни разу не раскрыто.</p>\n<p>Всё, что о них сказано, укладывается в две реплики Славы (2025-04-08, id 317252–317253 и id 317440):</p>\n<ul>\n<li>«Ловят разный объекты виде чернышей и медузы»</li>\n<li>«И на основе их ней крови или чего-нибудь другого создають разный препараты»</li>\n<li>«Медуза, черныши, серафим,..»</li>\n</ul>\n<p>Что они собой представляют — как выглядят, сколько их, одно это существо или порода — в переписке не сказано. Слово «черныши» стоит во множественном числе с самого первого употребления, из-за чего запись и заведена как группа-вид; но прямо как о виде, породе или классе о них никто не говорил.</p>\n<p>Название нигде не объясняется: откуда взялось слово и что в нём значит, в переписке не сказано.</p>\n<p>Черныши названы в один день с введением самой организации Нимб (2025-04-08, id 317240–317258) — как часть первого развёрнутого описания того, чем Нимб занимается. Слава определяет организацию так: «Они типа сцп» (id 317251) и «Грубо говоря это организация сцп только измененая под мои рамки» (id 317258).</p>", "r": []}, {"t": "Общие способности группы", "a": ["S02", "GR-0076-S02", "GR-0076--obschie-sposobnosti-gruppy"], "h": "<p>Способностей, свойств или поведения чернышей в переписке не названо ни одного. Единственное, что о них известно функционально: они — сырьё. Из «их ней крови или чего-нибудь другого» Нимб создаёт препараты (id 317253).</p>\n<p>Отдельно надо отметить, что уточнение про сырьё, сделанное вечером того же дня (2025-04-08, id 317486–317490), относится к медузе, а не к чернышам: на реплику Миколая Слава отвечает «Нет крови» и «Биологический жидкости» именно про медузу. К чернышам это уточнение не привязано — они на тот момент упомянуты только в формулировке «крови или чего-нибудь другого».</p>\n<p>Откуда объекты вообще берутся, не придумано: «К чему ты это. Я даже не придумал откуда они берутся?» (id 317481).</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S03", "GR-0076-S03", "GR-0076--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>Нимб.</strong> Черныши существуют в переписке только в связке с организацией: Нимб их ловит и перерабатывает. Механика со стороны Нимба описана как «Че они просто исследует объекты и иногда исследование дают результаты и они создают препараты» (id 317479). Мотив назван прямо: «именно для препаратов», «Для получение денег», «Им не хватает денег налогоплательщиков» (id 317496–317503). Часть препаратов идёт по контракту с армией — «Контракт на создания препаратов который могут усилить (типо супер солдат)» (id 317507).</p>\n<p><strong>Медуза.</strong> Всегда названа рядом: в первом упоминании — «в виде чернышей и медузы» (id 317252), в списке — «Медуза, черныши, серафим,..» (id 317440). Медуза при этом разработана дальше: у неё есть свойство внепространственности — «Чисто формально, но тела его в нашем мире, но законы физике действуют на него по правилам пространства другого мира» (id 317536). У чернышей аналога такому свойству не названо, и связь между ними и медузой, кроме соседства в перечне, в переписке не проведена.</p>\n<p><strong>Серафим.</strong> Третий в том же перечне (id 317440). Как объект Нимба он больше не разворачивается; развитие Серафима идёт по другой линии и с чернышами нигде не пересекается.</p>\n<p><strong>Статус объектов в целом.</strong> На реплику Миколая «это аномалии, объескиы сцп» (id 317446) Слава отвечает: «Нет», «Мои», «Личные», «Хотя они могут быть похоже», «Ведь в сцп их там дохуя» (id 317448–317454).</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S04", "GR-0076-S04", "GR-0076--kak-menyalas"], "h": "<p><strong>2025-04-08, день (id 317251–317253).</strong> Первое и единственное содержательное упоминание. Черныши названы в паре с медузами как основной улов Нимба, из их крови «или чего-нибудь другого» делают препараты.</p>\n<p><strong>2025-04-08, вечер (id 317392–317454).</strong> Слава отсекает от сеттинга апокалипсис и вирус: «Апокалипсиса и вируса нету» (id 317430), «Есть только нимб и объекты» (id 317432), действие — в современном мире. Черныши повторно перечислены в списке объектов: «Медуза, черныши, серафим,..» (id 317440). Новых сведений о них реплика не добавляет.</p>\n<p><strong>2025-04-08, вечер (id 317459–317512).</strong> Разговор об объектах продолжается, но черныши в нём уже не всплывают. Здесь же Слава признаёт, что мир не додуман: «Пока я ещё не до конца придумал мир, пусть пока будет так» (id 317512).</p>\n<p>После 2025-04-08 черныши в переписке не появляются.</p>\n<h3>Отклонённые и не принятые предложения</h3>\n<p><strong>Кровь как основа для конструирования существ (Миколай, 2025-04-08, id 317475–317483).</strong> Миколай предлагал строить объекты от свойств крови: «то что она у разных существ из разных металлов в разработке не поможет...», «например к древних не железо преобладало, а медь», «поэтому она была синяя», и далее — «к тому что можно придумать существ опираясь на удивительные свойства крови». Слава на это отвечает «К чему ты это. Я даже не придумал откуда они берутся?» и возвращается к своей формулировке «Исследует и получают результат» (id 317484). Предложение не принято.</p>\n<p><strong>Разбор состава крови (Миколай, 2025-04-08, id 317304–317309).</strong> Раньше в тот же день Миколай предлагал: «мне покопаться в кровяке?», «да, я могу узнать составы крови и особенности чтобы применить в создании чего-то». Слава откладывает: «Ну только позде», «Я занят» (id 317310–317311). К чернышам этот разбор так и не вернулся.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "GR-0076-S05", "GR-0076--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет. Ни одного отдельного черныша в переписке не назвали.</li>\n<li>Внешнего вида, размера, поведения, среды обитания нет — «Что они собой представляют — не описано».</li>\n<li>Не сказано, черныши — это вид, порода, класс или один объект во множественном числе; форма слова множественная, но статуса ей никто не назначал.</li>\n<li>Численность не названа.</li>\n<li>Иерархии, устройства, внутренних отличий между чернышами нет — их и не могло быть, отдельных особей не вводили.</li>\n<li>Что именно из чернышей извлекают, осталось нерешённым: сказано только «крови или чего-нибудь другого». Уточнение «Биологический жидкости» дано про медузу.</li>\n<li>Какие препараты делают именно из чернышей — не сказано.</li>\n<li>Происхождение объектов не придумано, о чём Слава говорит прямо (id 317481).</li>\n<li>Что означает само название, в переписке не сказано.</li>\n</ul></div>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0076--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0076.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0076-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0076/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дорогая дыра здесь одна и она в самих чернышах: <code>PS-0256</code> — три входящие ссылки при 1,8 КБ базы. Это худшее соотношение во всём кластере Нимба. Для сравнения: <code>PS-0255</code> «Медуза» — те же три ссылки, но 3,9 КБ базы и вдвое более длинная статья; <code>SP-0221</code> «Препараты Нимба» — две ссылки, 5,1 КБ. На чернышей ссылаются медуза, препараты и сама организация, а внутри — две строчки перечня.</p>\n<p>Практически это блокирует <code>SP-0221</code>. Препараты по переписке делаются из чернышей и медузы, но что именно берут из чернышей, не сказано — единственное уточнение про сырьё («Биологический жидкости») ушло к медузе. Значит статья о препаратах стоит на одной ноге из двух и достроить её без чернышей нельзя.</p>\n<p>Отдельно к проверке: <code>IS-0090</code> «Инцидент с вирусом Нимба» — статьи нет, 5,5 КБ базы, вселенная помечена как неясная, ссылок ноль. Материал про вирус Нимба лежит в базе, а в этом же дне Слава вирус отменяет: «Апокалипсиса и вируса нету» (id 317430). До или после — по цифрам не видно, и пока это не разведено, непонятно, живой это материал или снятый.</p>\n<h3>С чего начать</h3>\n<p>Базы по чернышам нет — 1,8 КБ, и они в статье выбраны досуха. Материал надо искать у соседей, и он там есть: <code>MR-0132</code> «Нимб» — 86,6 КБ базы при статье 36,6 КБ, то есть больше половины ещё не разобрано; <code>VS-0006</code> — 20,8 КБ базы; <code>MR-0133</code> «Отделы Нимба» — 1,5 КБ; <code>GR-0009</code> «Организация Нимб (НБО)» — статья есть, вселенных две (Апостол и Нимб). Порядок такой: сначала <code>MR-0132</code>, там ищется всё про улов и переработку; потом <code>SP-0221</code> и <code>PS-0255</code> — на предмет того, где уточнения про медузу могли поглотить чернышей; потом <code>IS-0090</code> — на предмет статуса вируса.</p>\n<p>Архив нужен точечно и в одном месте: 2025-04-08, окно с id 317240 по 317540. Весь материал про чернышей — один день, три захода (день id 317251–317253, вечер id 317392–317454, вечер id 317459–317512). Смотреть стоит не сами реплики про чернышей — они процитированы, — а промежутки между заходами: между 317253 и 317392, и между 317454 и 317459. Второй ориентир — id 317481 («Я даже не придумал откуда они берутся?») и id 317512 («Пока я ещё не до конца придумал мир»): если объекты где-то и получают происхождение, то в разговорах после этих двух признаний.</p>\n<h3>Как развивалось</h3>\n<p>Весь цикл уместился в один день, 2025-04-08.</p>\n<p>Заявили — днём, id 317251–317253: черныши и медузы как улов Нимба, из их крови «или чего-нибудь другого» делают препараты.</p>\n<p>Ограничили — вечером того же дня: из мира вынимают апокалипсис и вирус (id 317430), остаётся «только нимб и объекты» (id 317432), место действия — современность. Тогда же отсекается чужая рамка: на «это аномалии, объескиы сцп» — «Нет», «Мои», «Личные» (id 317448–317454).</p>\n<p>Забыли — сразу после: в третьем заходе того же вечера (id 317459–317512) объекты обсуждают дальше, а черныши в разговоре уже не появляются; уточнение про сырьё получает медуза, не они.</p>\n<p>Не вернулись: после 2025-04-08 черныши в переписке не встречаются.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Медуза и черныши введены одной строкой, в одной роли и в одном перечне. Дальше для медузы проговорены обе вещи, которых требует эта роль: что из неё берут («Нет крови», «Биологический жидкости») и чем она аномальна («тела его в нашем мире, но законы физике действуют на него по правилам пространства другого мира»).</p>\n<p>Для чернышей — соседа по той же строке и по той же функции — не названо ни первого, ни второго. При этом вопрос был задан того же рода и в тот же вечер; ответ просто адресовали одному из двух. Место — стык id 317486–317490 и 317536.</p>\n<h3>Отклик</h3>\n<p>Сильное здесь — id 317481: «К чему ты это. Я даже не придумал откуда они берутся?». Миколай в этот момент заходит с настоящей материальной идеей — кровь у разных существ на разных металлах, у древних медь, поэтому синяя, отсюда можно строить существ, — и получает ответ, который не спорит, а сообщает, что фундамента для такого разговора ещё нет. Не отказ по существу и не «плохо придумано»: просто здание строится не с той стороны, с какой пришли. И через полчаса, в id 317512, то же самое сказано уже прямо и без раздражения: «Пока я ещё не до конца придумал мир, пусть пока будет так». Черныши — ровно продукт этого состояния: слово во множественном числе, поставленное в список, чтобы список не был пустым. Оно ни разу не раскрывается, и при этом ни разу не мешает — Нимб отлично работает и с непрозрачным уловом. Любопытно, что название единственное, что о них есть, а объяснить его никто не пытался ни разу; для мира, который автор настойчиво отделяет от SCP («Мои», «Личные»), безымянная порода с говорящей кличкой — довольно точная находка.</p></div>", "r": []}];</script>
