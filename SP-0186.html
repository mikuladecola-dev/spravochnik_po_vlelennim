<script>const BASE="";const DOCNAME="вирус перьев";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0186-S01", "SP-0186--mehanika"], "h": "<p>Механика в переписке не расписана. Явление названо «вирус перьев» (2025-02-25, id 295234); в обсуждении фигурирует и под словами «крылья» и «перья».</p>\n<p>Единственная содержательная реплика о его состоянии — оценка степени раскрытия, а не устройства: «но думаю крылья ещё не полностью раскрыты, только на интриге пока» (Миколай, 2025-02-25, id 295239). То есть на момент разговора вирус существует как удерживаемая интрига, и как он действует — ни в истории, ни в переписке не объяснено.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S02", "SP-0186-S02", "SP-0186--nositeli"], "h": "<p>Прямо названа связка с Серафимом: вирус перьев есть и в основном мире, и там он идёт вместе с ним — «Так как в нашем мире он тоже будет» (id 295235), «Вместе с серафимом» (id 295236).</p>\n<p>Вирус показан в истории про Чужемирца — Слава пишет её в том числе ради этого: «Плюсом я хотел показать вирус перьев» (id 295234). Является ли при этом сам Чужемирец носителем вируса — в переписке не сказано; сказано только, что «этот чужимириц будет работать в организации» (id 295234).</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S03", "SP-0186-S03", "SP-0186--kak-menyalas-po-versiyam"], "h": "<p>Одна версия.</p>\n<p><strong>2025-02-25 (окно w0077, id 295232–295243).</strong> Разговор начинается с вопроса Миколая о том, зачем отдельная история про Чужемирца при большом числе основных персонажей и «как она влияет на основной сюжет» (id 295232–295233). В ответ Слава называет две причины: Чужемирец будет работать в организации, и через историю показывается вирус перьев, поскольку в основном мире он тоже будет — вместе с серафимом (id 295234–295236). Дальше Миколай подтверждает, что дочитал историю и прокомментировал, и отмечает нераскрытость крыльев (id 295239–295243).</p>\n<p>Изменений механики или отклонённых вариантов в материале нет — описывать было ещё нечего.</p>", "r": []}, {"t": "Пробелы", "a": ["S04", "SP-0186-S04", "SP-0186--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Механика вируса не расписана: как заражает, что даёт, что делает с носителем — ничего из этого в окне нет.</li>\n<li>Слово «вирус» не разъяснено: передаётся ли он, от кого к кому, и является ли заражение обратимым — не сказано.</li>\n<li>Характер связи с Серафимом не назван. Сказано только, что в основном мире вирус будет «вместе с серафимом»; источник он, носитель или что-то третье — не уточнено.</li>\n<li>Отношение Чужемирца к вирусу не названо.</li>\n<li>Организация, в которой будет работать Чужемирец, не названа.</li>\n<li>Отдельно зафиксировано самими авторами, что раскрытие крыльев отложено и держится на интриге, — то есть пробел на этот момент намеренный.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0186--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0022.html\">Пераги</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0186--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-02-25</td>\n<td>295232–295243</td>\n<td>w0077</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0186-virus-perev.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0186--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0186.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["SP-0186-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/SP-0186/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — Серафим. Вирус привязан к нему единственной содержательной репликой о его месте в мире («Вместе с серафимом», id 295236), а статьи о Серафиме нет и записи в базе нет. <code>PS-0209</code> «Серафима» — другой персонаж: кошкодевочка, приёмная дочь Серпа, 2 914 знаков, ноль ссылок; это тёзка. На несуществующего Серафима опираются <code>SP-0187</code> «Силы Серафима», <code>SP-0225</code> «Способности Серафима» и группа <code>GR-0008</code> «Команда против Серафима». Пока его нет, единственная связь этой записи с основным миром висит в пустоте.</p>\n<p>Вторая — перья. <code>SP-0183</code> «Перья Перага» — 15 757 знаков базы, статья есть, одна ссылка, датировано 2025-02-24, за сутки до этого разговора: перья описаны как проверяемое свойство тела, пули от них отскакивают, попадания в открытое тело проходят, в огне не горят и не темнеют. Рядом <code>PS-0199</code> «Пераг» — 44 124. Это единственный разобранный перьевой узел вселенной, и с «вирусом перьев» он не связан ни в одну сторону, хотя стоит в соседних сутках.</p>\n<p>Третья — организация. Сказано «этот чужимириц будет работать в организации», имя не названо. Кандидаты с материалом: <code>MR-0105</code> «Организация злодеев» — четыре ссылки, 4 924; <code>MR-0137</code> «Организация Нимб» — две ссылки, 2 927, и там же зафиксировано переопределение 2025-09-12, когда Нимб перестал быть фармкомпанией и стал церковью. Пока не выбрано, <code>PS-0202</code> висит без принадлежности, а с ним и весь смысл его отдельной истории.</p>\n<h3>С чего начать</h3>\n<p>В базе, и почти всё уже там. История, ради которой вирус и писался, лежит целиком: <code>PR-0052</code> — сам текст, 2025-02-24, id 293229, окно w0076, 22 285 знаков; <code>PS-0200</code> «Рассказчик истории про Перагов» — 24 602, ноль ссылок. И в <code>PS-0200</code> есть прямая зацепка: в следующем окне Слава называет этого рассказчика Чужимирицем. То есть «история про Чужемирца», которую обсуждают 2025-02-25 в id 295232–295243, и история про Перагов от 2025-02-24 — с высокой вероятностью один текст, а <code>PS-0202</code> «Чужемирец (герой истории про сломанное солнце)» (5 489, одна ссылка) — тот же герой под третьим названием. Свести <code>PS-0200</code>, <code>PS-0202</code> и <code>PR-0052</code> — и вопрос «носитель ли Чужемирец» перестаёт быть вопросом о неизвестном тексте: текст известен, его надо просто прочитать на предмет перьев.</p>\n<p>Туда же <code>IS-0037</code> «Чужемирец (история)» — 6 791, статья есть, ноль ссылок, упоминания 2025-03-13–16: к истории возвращаются, к вирусу — нет.</p>\n<p>В архив — за раскрытием крыльев, о котором Миколай говорит, что оно отложено. Смотреть после w0077, март 2025: 2025-03-03 Слава выкладывает большую прозу (<code>PS-0211</code>, 58 295), 2025-03-19 — историю с ангелом (<code>PR-0061</code>, 34 415, и <code>PS-0233</code> «Ангел», 28 551). Это два ближайших места, где крылатое появляется вне линии Перагов.</p>\n<h3>Как развивалось</h3>\n<p>Заявили и в том же разговоре ограничили. 2025-02-25, id 295232–295243: Миколай спрашивает, зачем отдельная история при таком количестве основных персонажей, Слава называет две причины, и вторая — «Плюсом я хотел показать вирус перьев», сразу с объяснением, зачем это нужно основному сюжету: «Так как в нашем мире он тоже будет», «Вместе с серафимом». Через несколько сообщений предел ставит не автор, а читатель: «но думаю крылья ещё не полностью раскрыты, только на интриге пока». Дальше в датах статьи пусто — одна версия, один день. В базе возврат есть к самой истории (<code>IS-0037</code>, 2025-03-13–16), к вирусу возврата нет.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Сутками раньше, 2025-02-24, для перьев Перага правила названы и они проверяемые: что отскакивает, что проходит, что делает огонь. Для «вируса перьев» — явления, названного через те же перья, — не названо ни одного свойства, которое можно проверить в сцене. Для одних перьев физика посчитана, для соседних того же рода — нет. И второе, того же порядка: месяцем позже для упырей вопрос происхождения задан вслух и с вариантами — «либо зараза из Рая, либо попытка правителя спасти людей» (<code>PS-0231</code>). Здесь заражение стоит прямо в названии, и вопроса, от кого к кому оно идёт, никто не задаёт.</p>\n<h3>Отклик</h3>\n<p>Тут сильна сама ситуация: явление существует только как обещание, и оба это знают. Слава пишет отдельную историю ради того, чтобы показать вирус, — и в самой истории его не объясняет; Миколай ловит это и называет вслух, спокойно, без претензии: «только на интриге пока». Никто не притворяется, что механика есть. Это редкая честность в рабочем разговоре, и она читается лучше, чем если бы механику сочинили на месте. Второе, что зацепило, — словосочетание. «Вирус перьев» ставит рядом заразу и оперение: то, что в любой другой книге было бы знаком ангела, здесь заводится как болезнь, и одно слово делает всю работу, которую могла бы делать страница описания. Если из этого что-то вырастет, вырастет, похоже, именно отсюда, а не из четырёх сил Серафима.</p></div>", "r": []}];</script>
