<script>const BASE="";const DOCNAME="Матка Аскизы";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0301-S01", "PS-0301--proishozhdenie"], "h": "<p>Матка Аскизы — мутант, появившийся из обычного животного под воздействием Оам. Описана Славой в общем перечне мутантов (2025-10-20, id 376399–376403), в разделе «Аскизы»:</p>\n<div class=\"q\"><p>«Маток Аскизы была просто Аксолотлой. Но после в водоём, где она жила упал метеорит и под огромным воздействием Оам она мутировала и начала производить Оам.»</p></div>\n<p>Описание дано внутри большого текста о происхождении Оам. По этому тексту: во времена, когда «были ещё племена по всему миру, а не государство», на землю приземлились метеориты, и из небесных тел «выпустились в воздух, триллион неизвестных частиц» — невидимых и неосязаемых, но существующих. Частицы заполонили весь мир, живое, вдыхавшее их, гибло: «Лёгкие заполнялось Оам и медленно разрывались на куски». После смены поколений у людей и животных выработался иммунитет, а частицы назвали Оам. На местах приземления метеоритов «окружающая среда и жирность мутировали под активным воздействием Оам». Водоём, где жила будущая матка, — один из таких мест: метеорит упал прямо в него.</p>\n<p>Матка перечислена среди мутантов наравне с Апостолами, Детьми мирового древа, Азуриэлями, Поротаями и вампирами — то есть теми, у кого «под воздействием Оам изменилось их физиология».</p>\n<p>Имя матки не даётся: в переписке она называется только по роли — «Матка», «Маток Аскизы».</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0301-S02", "PS-0301--vneshnost"], "h": "<p>Дословно (id 376402, повторено 2025-11-05 в id 382108):</p>\n<div class=\"q\"><p>«Матка большая ростом 4 местра и в ширину такая же. Она больше похожая на червя с огромными количествами лапок. Но с такой же белоснежное кожей.»</p></div>\n<p>Четыре метра в длину и столько же в ширину; форма ближе к червю, множество лапок; кожа белоснежная — «такая же», как у выводимых ею детей-аскизов. Черт аксолотля у самой матки отдельно не названо, хотя у её детей они есть.</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0301-S03", "PS-0301--sposobnosti"], "h": "<p>Две функции, обе названы прямо:</p>\n<ol>\n<li>Производство Оам. После мутации она «начала производить Оам» — то есть сама является источником частиц, а не только их носителем. Как именно она их производит и в каком количестве, в переписке не сказано.</li>\n<li>Вывод аскизов. «Матка, что выделяет их из яиц подобное муравьиной матки.» Сравнение с муравьиной маткой — единственное объяснение механики размножения, которое дано.</li>\n</ol>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0301-S04", "PS-0301--svyazi-s-drugimi"], "h": "<p><strong>Аскизы</strong> — её дети, ради которых она и описана. Запись отнесена к аскизам как «часть чего». Их описание в том же сообщении:</p>\n<div class=\"q\"><p>«Навечно Дети лет 7-10 на вид с белоснежной кожей, с розовыми оттенками ( или другими оттенками) и с чертами аксолотлы.»</p></div>\n<p>Дальше: дети не стареют, у них быстрая регенерация и «зверский аппетит» — «Они могут съесть человека целиком за пару минут». У них «инстинкт голода выше разума», они не чувствуют боли, «и разумом они всегда как дети».</p>\n<p><strong>Оам</strong> — вещество, вызвавшее мутацию, и то, что матка производит.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S05", "PS-0301-S05", "PS-0301--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2025-10-20 (окно w0107, id 376399–376403).</strong> Первое и единственное содержательное описание. Дано внутри длинного текста Слава о происхождении Оам и обо всех видах мутантов; блок «Аскизы» идёт вторым, после Апостолов. Здесь сказано всё: происхождение из аксолотля, метеорит в водоём, производство Оам, вывод детей из яиц по образцу муравьиной матки, размеры 4 на 4 метра, червеобразная форма, множество лапок, белоснежная кожа. Сообщение заканчивается ремаркой «Пока что так» (id 376403).</p>\n<p><strong>Версия 2 — 2025-11-05 (окно w0108, id 382108).</strong> Текст об аскизах и матке приведён повторно, дословно, без единого изменения — те же формулировки о росте 4 метра, червеобразной форме, лапках и белоснежной коже, то же «выделяет их из яиц подобное муравьиной матки». Новых деталей в этой версии нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0301-S06", "PS-0301--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Как рождаются аскизы, автор прямо оставил нерешённым: «Как они рождаются я ещё не придумал» (id 376402, повторено 2025-11-05). Сравнение с муравьиной маткой и «выделяет их из яиц» — единственное, что есть, механика не назвала.</li>\n<li>Собственного имени у матки нет, только роль. В записи зафиксированы варианты написания: «Матка Аскиз», «Маток Аскизы», «матка».</li>\n<li>Характер, разумность, поведение матки не описаны вообще. Про её детей сказано, что «разумом они всегда как дети», про саму матку — ничего.</li>\n<li>Где она находится после мутации, назван ли водоём, жива ли она, одна ли она такая — в переписке не сказано.</li>\n<li>Сколько аскизов она выводит, как часто, зависят ли они от неё — не сказано.</li>\n<li>Не сказано, есть ли у неё черты аксолотля во внешности; они названы только у детей.</li>\n<li>В переписке от 2025-12-06 (id 393465), в разговоре о другом персонаже, есть отдельная реплика: «Матка. Находиться в церкви. И люди им поклоняются, а детей маток считают святыми». Связь этой реплики с Маткой Аскизы в переписке не названа, и в версии записи она не входит; здесь фиксируется как есть.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0301--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0066.html\">Аскизы</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0061.html\">Церковь с паладинами</a>, <a href=\"GR-0066.html\">Аскизы</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0008.html\">Оам</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0301--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-10-20</td>\n<td>376399–376403</td>\n<td>w0107</td>\n<td>Оам (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-11-05</td>\n<td>382108–382108</td>\n<td>w0108</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0301-matka-askizy.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0301--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0301.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
