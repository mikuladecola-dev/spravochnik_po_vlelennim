<script>const BASE="";const DOCNAME="Потеря «я»";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0209-S01", "SP-0209--mehanika"], "h": "<p>Второй минус упыря — деградация личности, названная в переписке потерей «своей \"я\"» (2025-03-19, id 305855). Это не способность, которой пользуются, а процесс, который идёт с носителем сам.</p>\n<p>Формулировка автора: «Второй минус. В том что мы теряли своей собственной \"я\". Деградируя».</p>\n<p>Процесс описан как неизбежный, но не мгновенный и не одноразовый. Он допускает откат назад и повторное срабатывание:</p>\n<div class=\"q\"><p>«Нет кому-то удавалось вернуть своей &quot;Я&quot;. А кому-то даже продержатся 3 года. Но по итогу всегда всё заканчивалась тем, что они теряли снова или первый раз. Без разницы. Они всë равно теряли своей &quot;я&quot;.»</p></div>\n<p>То есть в переписке зафиксированы три исхода — вернуть «я» после потери, продержаться до трёх лет без потери, потерять сразу — и один общий итог для всех трёх: потеря всё равно происходит. Срок в три года дан как отмеченный максимум удержания, а не как правило.</p>\n<p>Что именно остаётся вместо личности, описано через самоопределение рассказчика в момент, когда он считает, что удержание кончилось: «Я перестану быть собой. Я лишь упырь». Дальше следует «Я заревел. Подобное зверью» — единственное указание на поведение потерявшего себя, и относится оно к моменту срыва, а не к устоявшемуся состоянию.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0209-S02", "SP-0209--ogranicheniya-i-cena"], "h": "<p>Единственный названный способ удержания — цель.</p>\n<div class=\"q\"><p>«Но вы наверное уже поняли. Я упырь. Но нет. Я не терял своей &quot;Я&quot;. Почему же? Потому-что у меня была цель.»</p></div>\n<p>Цель у рассказчика конкретная: защитить группу из 38 людей. Механизм удержания он описывает как обязанность не давать слабины — «Они нуждались во мне. Поэтому я не мог дать слабины. И я не давал». В другом месте того же массива цель названа образно: «Я потерял свою нить. Держащий меня».</p>\n<p>Из этого следует и цена: удержание держится не на самом упыре, а на внешнем объекте. Когда группа гибнет — приходит ангел, и рассказчик, вернувшись с вылазки, «увидел лишь кровь и боль», — нить исчезает вместе с ней, и удержание кончается сразу же: «Теперь и еë нету. Я перестану быть собой».</p>\n<p>Отдельно оговорено, что боль и увечья удержанию не мешают. Установку экзоскелета — «отрезать несколько конечности. Вырвать органы и продырявить череп», четырнадцать дней «словно был пол пытками», без обезболивающего — рассказчик проходит с прямой оговоркой: «Я вытерпел и не потерял себя».</p>\n<p>Из 38 защищаемых за 6 лет умерло 19. Это указано как факт, на удержание рассказчика оно не повлияло — нить оборвалась не постепенно, а одним событием.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0209-S03", "SP-0209--nositeli"], "h": "<p>Все упыри. Потеря «я» описана как второй из двух общих минусов упыря, а не как черта отдельных особей. Упырями стали «где-то 30-40 процентов выживших» после катастрофы.</p>\n<p>Упырь-рассказчик — единственный носитель, показанный изнутри, и единственный названный по имени случай удержания на момент рассказа. Безымянные упыри, которым «удавалось вернуть своей \"Я\"» и которые продержались три года, названы, но не описаны.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0209-S04", "SP-0209--kak-menyalas-po-versiyam"], "h": "<p>Одна версия.</p>\n<p><strong>2025-03-19 (id 305855–305856, окно w0083).</strong> Способность введена сразу как неизбежный итог для упыря, вместе с оговоркой про удержание через цель. В том же сообщении приведён и пример удержания (рассказчик, 38 людей, экзоскелет), и момент его обрыва (гибель группы, ангел, чёрная дымка).</p>\n<p>К концу сообщения 305856 рассказчик как персонаж уже действует в состоянии после обрыва: попав через дымку в первый мир, он атакует имитатора, «считая его врагом», получает залп перьев от ангела и врезается в ангела. Отдельно про его «я» в этой сцене ничего не сказано — переписка обрывается на столкновении.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0209-S05", "SP-0209--svyaz-s-drugimi-sposobnostyami"], "h": "<ul>\n<li><a href=\"SP-0207.html\">Живучесть упыря</a> «Живучесть упыря» — первая и единственная сила упыря; потеря «я» идёт как второй её минус, в одном перечислении и в одном сообщении.</li>\n<li>Каннибалистический голод — первый минус, назван там же. Связь между голодом и деградацией личности в переписке не проведена.</li>\n<li>Благословения апостолов, описанные имитатором в соседнем куске (2025-03-19, id 305856), имеют собственный механизм износа: связь устанавливается с мозгом, «И сила проходит через мозг. Повреждая его», из-за чего благословение нельзя использовать 24/7, а в голове благословенного стоит «предохранитель», отключающий благословение при выгорании мозгов. Никакой связи между этим повреждением мозга и потерей «я» у упырей в переписке не названо — это разные системы, оказавшиеся в одном сообщении.</li>\n</ul>", "r": [["Живучесть упыря", "SP-0207.html"]]}, {"t": "Пробелы", "a": ["S06", "SP-0209-S06", "SP-0209--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Не сказано, сколько времени занимает потеря «я» без удержания.</li>\n<li>Не сказано, что представляет собой упырь после потери — есть только «Я лишь упырь» и рёв «подобное зверью».</li>\n<li>Механизм возврата «я» у тех, кому «удавалось вернуть», не описан вообще.</li>\n<li>Не сказано, годится ли любая цель или нужна цель определённого рода; в единственном примере это защита конкретных людей.</li>\n<li>Не сказано, можно ли удержаться повторно, найдя новую нить после обрыва старой.</li>\n<li>Судьба «я» самого рассказчика после перехода в первый мир осталась нерешённой: переписка заканчивается на драке.</li>\n<li>Отклонённых вариантов в переписке нет.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0209--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0207.html\">Живучесть упыря</a></li>\n<li><strong>Упомянут в способностях:</strong> <a href=\"SP-0207.html\">Живучесть упыря</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0021.html\">Упыри</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0209--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-03-19</td>\n<td>305855–305856</td>\n<td>w0083</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0209-poterya-ya.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0209--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0209.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["SP-0209-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/SP-0209/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Чинить первым — <code>SP-0185</code> «Бессмертие рассказчика» (2025-02-24, id 293229, окно w0076, база 9 064, ссылок на неё одна). Там пошагово описано ровно то, что здесь стоит в пробелах: порядок утрат — «забывал кем я был и забывал язык и забывал я даже мыслить и становился упырем я», — и срок, за который это происходит, и вид носителя после. Статья при этом говорит «Одна версия» и знает только 2025-03-19. Материал не отсутствует: он лежит в соседней записи на три с половиной недели раньше. Место уже замечено с другой стороны — в <code>GR-0021</code> записано, что прямой связи между тем фрагментом и видом из монолога 19 марта не проведено. Замечено дважды, сведено ноль раз.</p>\n<p>Дороже и медленнее: у мира упырей нет сущности вообще. На нём висят <code>PS-0232</code> «Упырь-рассказчик» (35 190, две ссылки), <code>PS-0231</code> «Упыри» (17 407), <code>SP-0207</code> (15 808), <code>SP-0208</code> (15 749), <code>SP-0210</code> (16 871), <code>PS-0233</code> «Ангел» (28 551) и сам этот текст (15 890). Единственный след мира в справочнике — заголовок прозы <code>PR-0061</code> (34 415).</p>\n<p>Мелочь на одну строку: первый минус упомянут здесь словами и без ссылки, а <code>SP-0208</code> «Голод упыря» существует — статья есть, база 15 749.</p>\n<h3>С чего начать</h3>\n<p>В базе, за одним исключением.</p>\n<ul>\n<li><code>SP-0185</code>, id 293229, окно w0076 — содержание и порядок деградации.</li>\n<li><code>PS-0232</code> (35 190) — вся история нити: 38 человек, 19 смертей за 6 лет, экзоскелет.</li>\n<li><code>PR-0061</code> (34 415) — монолог целиком, включая место обрыва.</li>\n<li><code>PS-0233</code> «Ангел» (28 551) и <code>MR-0124</code> «Чёрная дымка» (28 831) — событие, которое рвёт нить, и переход, на котором текст обрывается.</li>\n<li><code>MR-0123</code> «Раскол солнца» (18 152, ссылок ноль) — катастрофа, после которой упырями стали 30–40 процентов.</li>\n</ul>\n<p>В архив — за одним: разбор при чтении 2025-03-20, окно w0083, id 306140–306170. В этих же границах лежат вторая версия <code>SP-0204</code> и объяснение про развитый мир, то есть массив читали и обсуждали. Смотреть надо, спрашивал ли Миколай про потерю «я». Если спрашивал — у статьи появится вторая версия; если нет — «одна версия» подтверждена, и вопрос закрыт.</p>\n<h3>Как развивалось</h3>\n<p>Заявили и ограничили одним ходом: 2025-03-19, сообщение 305855 — неизбежность, три исхода и тут же оговорка про удержание целью, всё в одном абзаце. Оборвали в тот же день: 305856 — гибель группы, ангел, «Теперь и еë нету», и дальше рассказчик действует уже за чертой, а про его «я» в этой сцене не сказано ничего. На следующий день, 2025-03-20, при чтении разбирали соседние куски того же массива — предохранитель, экзоскелет; к потере «я» не возвращались. Раньше всего этого, 2025-02-24, тот же процесс уже был описан в другом фрагменте и под другим именем.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>В том же сообщении 305856 износ носителя у благословлённых расписан целиком: причина — сила идёт через мозг, повреждая его; следствие — нельзя пользоваться 24/7; и отдельно механизм-стоп — предохранитель, который сам отключает силу при риске выгорания. У упыря износ носителя тоже назван, и назван как свойство самой его природы, — но ни порога, ни отсечки, ни механизма у него нет: сказано только, что «всё равно теряли». Правило «у износа есть встроенный стоп» проговорено для одной половины сообщения и не проговорено для другой. Показываю место.</p>\n<h3>Отклик</h3>\n<p>Сильнее всего здесь арифметика. Не «он держался ради людей», а: 38 человек, 6 лет, 19 умерли — и удержание всё это время работает. Держит при этом не воля, а внешний предмет: «Я потерял свою нить. Держащий меня» — нить снаружи, и когда снаружи не осталось ничего, всё кончается мгновенно, без угасания. Вернулся с вылазки, «увидел лишь кровь и боль» — и счётчик обнулился. Отдельно цепляет, что четырнадцать дней резки без обезболивающего в эту систему вообще не входят: боль угрозой для «я» не считается, а пустой дом считается. И единственное, что осталось от человека после обрыва, — рёв «подобное зверью», поставленный ровно в момент срыва. Того, что наступает потом, в тексте просто нет, и это здесь читается не как недоделка, а как то, где рассказчик перестал вести рассказ.</p></div>", "r": []}];</script>
