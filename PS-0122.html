<script>const BASE="";const DOCNAME="ГГ-шизофреник";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0122-S01", "PS-0122--proishozhdenie"], "h": "<p>Персонаж принадлежит вселенной, объявленной 2024-07-31 (id 214143); имени в переписке ей не дали — в чате она называется просто «новый» / «новая» и характеризуется как апокалиптическая.</p>\n<p>Впервые появляется 2024-07-31 (id 213677–213696, окно w0049). Слава анонсирует новую задумку: «Новый», «Гг шизофреник». Миколай реагирует: «классика, ну окэй» — и уточняет, будут ли персонажи старыми или «с чистого». Слава просит не спешить и уточняет направление: «Я хочу больше отталкиваться на перепад настроение», «И агрессивность», «Но да классика». На вопрос Миколая, зачем главный герой «ебанашка», а не «обычный чел семьянин» — «дабы сделать красочные бои? интересные сцены» — Слава отвечает коротко: «Просто».</p>\n<p>По ходу дальнейшего обсуждения (214319–214345) выясняется, что ГГ занимает в команде из пяти человек (<a href=\"PS-0123.html\">Команда гиг (5 человек)</a>) роль «больного»: сперва Миколай предлагает профессию «кондитер», но Слава меняет на «фермер» («Больной-фермер»), Миколай соглашается («да»). Возраст — 28 лет.</p>", "r": [["Команда гиг (5 человек)", "PS-0123.html"]]}, {"t": "Характер", "a": ["S02", "PS-0122-S02", "PS-0122--harakter"], "h": "<p>Заявленные Славой черты — перепады настроения и агрессивность («Я хочу больше отталкиваться на перепад настроение», «И агрессивность»). Диагноз обозначен прямо: «гг это шизофреник, верно?» (Миколай) — подтверждается репликой Славы «Главный герой=гг, Главные герои=гиг», из которой следует, что «гг» — это единичный персонаж, а «гиг» — обозначение команды целиком.</p>\n<p>2024-08-03 (id 215004–215016) Слава возвращается к персонажу репликой «Гг», на что Миколай отвечает «выглядит мощно» — судя по всему, реакция на присланный референс, сам референс в текстовом виде переписки не сохранился. Далее Слава формулирует ориентир: «Вот он идеал Реального сумасшедшего», Миколай отвечает: «я понял теперь к чему ты стремишься».</p>\n<p>В этот же день (id 215052–215055) Миколай присылает пространный машинно сгенерированный текст (см. ai_inserts) — справочный материал о симптомах шизофрении, распространённых мифах о ней («Все шизофреники опасны и агрессивны» — миф; «Шизофрения — это раздвоение личности» — миф), о расстройствах, с которыми её путают (биполярное расстройство, шизоаффективное расстройство, ОКР, ПТСР, деменция, расстройство множественной личности), о состояниях, чаще связанных с агрессией (антисоциальное расстройство личности, пограничное расстройство личности, биполярное расстройство в маниакальной фазе, ПТСР, интоксикация психоактивными веществами, интермиттирующее эксплозивное расстройство), и о разговорном значении слова «сумасшедший». Это справочная фактура, собранная под персонажа; в переписке не сказано, какие из перечисленных пунктов авторы решили использовать напрямую.</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0122-S03", "PS-0122--sposobnosti"], "h": "<p>В переписке не упомянуты.</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0122-S04", "PS-0122--svyazi-s-drugimi"], "h": "<p>Часть пятёрки главных героев — <a href=\"PS-0123.html\">Команда гиг (5 человек)</a> «Команда гиг (5 человек)», где занимает роль «больного». В этой же пятёрке фигурирует «Дерзкий друг гг» — персонаж, введённый Славой 2024-07-31 как замена «бомжу» («Друг который друг по вине», «Он чувствует вину за то что сделал с гг в детстве поэтому и дружит с ним»); отдельный id для него в задании не выдан. Действие происходит в апокалиптической вселенной (см. Происхождение).</p>", "r": [["Команда гиг (5 человек)", "PS-0123.html"]]}, {"t": "Как менялся", "a": ["S05", "PS-0122-S05", "PS-0122--kak-menyalsya"], "h": "<p><strong>2024-07-31, версия 1 (id 213677–213696):</strong> первое объявление — «гг шизофреник», Слава задаёт направление через перепады настроения и агрессивность.</p>\n<p><strong>2024-07-31, версия 2 (id 214253–214272):</strong> подтверждение диагноза («гг это шизофреник, верно?»); уточнение терминологии — «гг» единственное число, «гиг» — команда; отмечено, что «гг» как ролевая позиция «будет меняться», но «гг везде будет».</p>\n<p><strong>2024-07-31, версия 3 (id 214319–214345):</strong> ГГ закрепляется как «больной» в пятёрке; профессия — сначала «кондитер» (отклонено), затем «фермер» (принято); возраст 28 лет.</p>\n<p><strong>2024-08-03, версия 4 (id 215004–215016):</strong> Слава присылает референс-ориентир — «идеал реального сумасшедшего»; Миколай подтверждает понимание направления.</p>\n<p><strong>2024-08-03, версия 5 (id 215052–215055):</strong> Миколай собирает справочный (машинный) материал о шизофрении, мифах о ней и смежных расстройствах — как фактурную базу для персонажа.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S06", "PS-0122-S06", "PS-0122--chto-s-nim-stalo"], "h": "<p>Дальнейшая судьба персонажа после 2024-08-03 в материале не описана.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0122-S07", "PS-0122--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имени у персонажа нет — на всём протяжении переписки он называется только «гг», «больной», «главный герой».</li>\n<li>Не сказано, шизофрения ли это в итоге как точный диагноз или «сумасшедший» используется лишь как общий ориентир.</li>\n<li>Внешность персонажа не описана.</li>\n<li>Референс, присланный Славой 2024-08-03 («идеал реального сумасшедшего»), в текстовой переписке не сохранился — неясно, что именно на нём было.</li>\n<li>Не сказано, какие пункты из собранной Миколаем справки о шизофрении и агрессии авторы решили закрепить за персонажем.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0122--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0123.html\">Команда гиг (5 человек)</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0123.html\">Команда гиг (5 человек)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0122--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-31</td>\n<td>213677–213696</td>\n<td>w0049</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-31</td>\n<td>214253–214272</td>\n<td>w0049</td>\n<td>неясно (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2024-07-31</td>\n<td>214319–214345</td>\n<td>w0049</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-08-03</td>\n<td>215004–215016</td>\n<td>w0049</td>\n<td>неясно (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2024-08-03</td>\n<td>215052–215055</td>\n<td>w0049</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0122-gg-shizofrenik.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0122--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0122.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
