<script>const BASE="";const DOCNAME="Дочь Имитатора";
const LEAD="<p>Дочь Имитатора (Имета) — один из двух главных злодеев мира Оам/Оэм. Появилась 2025-11-17 не как новый персонаж, а как переназначение прежней «сестры имитатора» (<a href=\"PS-0215.html\">Сестра имитатора</a>). Имени в записях 2025 года не получила; имя «Доима» дано только 2026-06-07, вместе с полностью новой биографией под новый мир — это состояние вынесено в отдельную запись <a href=\"PS-0375.html\">Доима (дочь Имета)</a>.</p>";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0324-S01", "PS-0324--proishozhdenie"], "h": "<p><strong>Редакция 2025.</strong> О том, как и от кого она родилась, не сказано ничего. Есть только её прежняя принадлежность к другой вселенной: «В вселенной правителя её целью было объединить миры и вызвать Апокалипсис» (393313, 2025-12-06). В мир Оам она перенесена вместе с отцом.</p>\n<p>Прямо зафиксировано, что она не апостол: «Дети апостолов не являются апостолыми. Они обычные люди» (393468, 2025-12-06). Этой репликой отклонён нейросетевой вариант «Апостол: унаследовала статус» (393460).</p>\n<p><strong>Редакция 2026-06-07 (488439).</strong> Появляется полная предыстория: «У имитатора в подростковом возрасте была мелкая интрижка о которой он забыл. Он и не знал, что та девушка забеременила, поэтому он без беспокойство покинул данный город». Дальше — «Нимб захватили девушку которая была беремена от Имета. Им было интересно унаследует ли ребёнок апостола его способности». Мать умерла при родах, над ребёнком ставили эксперименты; «когда ей исполнилось восемь лет, ученный сдались и больше не тестировали её», и Нимб «просто решили взрастить сотрудника, у них и так нехватка кадрова была». Имени матери в переписке нет.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0324-S02", "PS-0324--vneshnost"], "h": "<p>Не описана ни в одной редакции. Единственное телесное свойство, названное прямо, — она стареет, в отличие от отца (393473, 2025-12-06).</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0324-S03", "PS-0324--harakter"], "h": "<p><strong>2025-12-06 (393313).</strong> Носит грех Чревоугодия — «то бишь голодная для знания», и это прямо названо наследством от отца: «как её отец ( имитатора)».</p>\n<p><strong>2025-12-06 (393473).</strong> Любит отца — «Она любит отца». Её страх сформулирован через него: боится, что он заметит её старение, и что ему придётся её хоронить.</p>\n<p><strong>2025-12-06 (393476–393477).</strong> Пользуется отношением апостолов к себе: «Апостолы также относятся к ней дружелюбно так как она дочь Имита. И она иногда будет этим пользоваться» / «Для плана».</p>\n<p><strong>2026-06-07 (488439).</strong> «Но она так и осталась ребёнком, что мечтает о нормальной семьи. Она всё ещё та маленькая девочка что была заперта в белой комнате, читая книжки и мечтая о семье». «Она любит Имета считая его единственным дорогим и родным человеком».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0324-S04", "PS-0324--sposobnosti"], "h": "<p>Собственных способностей в записях 2025 года не названо; сказано только, что она обычный человек (393468). В редакции 2026-06-07 — «она и до камня желания была сл», и в ходе своей линии «поглотили камень желания» (488440), от которого отец ищет лекарство.</p>", "r": []}, {"t": "Связи", "a": ["S05", "PS-0324-S05", "PS-0324--svyazi"], "h": "<ul>\n<li><strong>Имитатор (Имит/Имет)</strong> — отец. «Сам Имит тоже любит свою дочь. Также сильна как и своих братьев и сестёр апостолов» (393476).</li>\n<li><strong>Своя группировка злодеев</strong> (385768, 393313). Босс группировки — обычный человек, «хитрым и уверенным», который «Попытается наладить связь с Имитам» (393479), потому что «для правительства. Представитель Апостоловы именно Имит» (393480).</li>\n<li><strong>Апостолы</strong> — относятся к ней дружелюбно как к дочери Имита (393477).</li>\n<li><strong>Бог красок</strong> — второй из двух главных злодеев Оэм (393314).</li>\n<li><strong>Защитник</strong> — не связь, а пример: она вспоминает апостола, который «по сути сошёл с ума когда умер его ребенок», и потому боится оставить отца хоронить себя (393473).</li>\n<li><strong>Нимб</strong> (редакция 2026-06-07) — организация, захватившая её беременную мать, вырастившая её и сделавшая своей сотрудницей; о её собственной организации Нимбу неизвестно (488439).</li>\n</ul>", "r": []}, {"t": "Как менялась", "a": ["S06", "PS-0324-S06", "PS-0324--kak-menyalas"], "h": "<p><strong>2025-11-17 (385768).</strong> Появление одной строкой в перечне организаций мира Оам: «Группировка сестры ( который теперь будет дочерью Имитатора. И я не знаю какие у неё будет цель)». То же сообщение переслано 2025-12-06 (393287).</p>\n<p><strong>2025-12-06 (393313).</strong> Развёрнута как один из двух главных злодеев: прежняя цель (объединить миры и вызвать Апокалипсис) осталась в «Вселенной правителя», новая не придумана — «Ну теперь я не знаю какая у неё цель в мире Оэм». Тут же (393316) Слава ставит себе задачу вслух: «Так мне нужна цель и мотивация двух сильнейших за мир / И цель и мотивация двух сильнейших злодеев».</p>\n<p><strong>2025-12-06 (393449–393460).</strong> Нейросеть в сводке Миколая предлагает варианты: она апостол / полукровка / не апостол; мотивации — закончить дело отца, месть за отца, предательство апостолов. Отклонено целиком: «Хуйня. Имитатор жив» (393468).</p>\n<p><strong>2025-12-06 (393473).</strong> Закреплено, что ушла и скрывается она сама, а не отец исчез.</p>\n<p><strong>2026-06-07 (488437–488440).</strong> Полная перезапись под новый мир: имя «Доима», история с Нимбом, мотивация — «воплотить свой мир. С родителями», эксперимент с фантазёром и дырой между мирами в центре города, союз с отцом. Слава помечает это как решённую задачу: «Я наконец-то смог придумать нормальную мотивацию дочери имет. При этом не разрушив их отношения» (488437). Подробности — <a href=\"PS-0375.html\">Доима (дочь Имета)</a>.</p>", "r": [["Доима (дочь Имета)", "PS-0375.html"]]}, {"t": "Что с ней стало", "a": ["S07", "PS-0324-S07", "PS-0324--chto-s-ney-stalo"], "h": "<p><strong>Состояние на 2025-12-06.</strong> Ушла от отца и скрывается: «Это дочь ушла от него. И скрывалась. ( так как её пугал факт своего старения, когда её отец не старел ни на день. Она боялась что он почувствует если увидит что она стареет а он нет, а также боялась что он почувствуете хороня своего ребенка…)» (393473). Ведёт свою группировку. Чем заканчивается линия — не сказано.</p>\n<p><strong>Состояние на 2026-06-07.</strong> Сотрудница Нимба со своей тайной организацией; провела эксперимент по объединению миров — схватила фантазёра на грани провала в свой мир и артефактом открыла дыру между мирами в центре города; отражали все столпы. «Суть этого эксперимента была, можно ли объединить миры. Хотя он и не удался, доима осталась довольной результатом» (488439). Поглотила камень желания; отец защищает её и ищет лекарство, «Доима же от заботы и беспокойство отца лишь больше утверждается изменить этот мир, чтобы отец был всегда рядом, как сейчас и чтобы у неё была мама» (488440). Финала линии в записях нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0324-S08", "PS-0324--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имя в редакции 2025 года не придумано: «А имя его дочери я не придумал» (393475). Вариант «Имита», ходивший по документам (393313, 393449), относится к отцу — «Имит это Имитатор. Только сокращена» (393474).</li>\n<li>Цель и мотивация в мире Оэм не решены: «Ну теперь я не знаю какая у неё цель в мире Оэм» (393313); то же отмечено в неясностях записи.</li>\n<li>Внешность не описана ни разу.</li>\n<li>Возраст не назван; известно только, что она стареет.</li>\n<li>Мать: до 2026-06-07 не упоминается вовсе, после — только как «та девушка», без имени.</li>\n<li>Состав и численность её группировки не описаны; в редакции 2026-06-07 — «там просто несколько сл и ис» (488439).</li>\n<li>Как она стала главой группировки и что связывает её с боссом-человеком, кроме плана выйти через неё на Имита, — в переписке не сказано.</li>\n<li>Общая механика новой вселенной «дети апостолов… всегда после 18 лет захотят убить родителя» (466548, 2026-04-25) на неё нигде не переносится.</li>\n<li>Чем закончилась линия — ни в одной редакции не сказано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0324--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0060.html\">Группировка сестры (она же группа злодеев дочери Имитатора)</a></li>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0215.html\">Сестра имитатора</a>, <a href=\"PS-0375.html\">Доима (дочь Имета)</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0215.html\">Сестра имитатора</a>, <a href=\"PS-0307.html\">Коты</a>, <a href=\"PS-0308.html\">Виктор</a>, <a href=\"PS-0383.html\">Имитатор</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0060.html\">Группировка сестры (она же группа злодеев дочери Имитатора)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0324--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-12-06</td>\n<td>393286–393290</td>\n<td>w0112</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-06</td>\n<td>393312–393317</td>\n<td>w0112</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-06</td>\n<td>393468–393477</td>\n<td>w0112</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0324-doch-imitatora.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0324--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0324.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0324-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0324/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Чинить первой надо <code>PS-0375</code> «Доима (дочь Имета)». На неё ссылаются три статьи — эта, <code>PS-0383</code> Имитатор и <code>PS-0215</code> Сестра имитатора, — статьи у неё нет, а в базе лежит 9 036 знаков. Это ровно та дыра, из-за которой нынешняя статья обрывается на середине: вся редакция 2026-06-07, то есть имя, мать, Нимб, эксперимент с дырой между мирами и мотивация, ради которой Слава и переписывал персонажа, лежит по ту сторону несуществующей записи. Три отсылки на пустое место, и во всех трёх случаях именно там продолжение линии.</p>\n<p>Второе по цене — вселенная. <code>VS-0008</code> Оам: статьи нет, в базе 38 856 знаков, и на неё ссылаются восемь статей — <code>PS-0182</code> Агрегат, <code>PS-0171</code> Палач, <code>PS-0383</code> Имитатор, <code>IS-0017</code> Защитник, <code>SP-0047</code> Артефакты, <code>SP-0060</code> Усиление Имитатора, <code>MN-0022</code> Чёрные озёра и эта. Каждая из восьми начинается со строки «вселенная: Оам (статьи ещё нет)». Пробел «не знаю какая у неё цель в мире Оэм» без описанного Оэма и не может закрыться.</p>\n<p>Третье — то, что статья называет прямо, а базе неоткуда взять: <code>PS-0322</code> Бог красок (18 056 знаков, статьи нет) назван здесь вторым из двух главных злодеев мира, и на него из справочника не ссылается никто; <code>SP-0244</code> Камень желания (4 161, статьи нет) — предмет, вокруг которого держится вся линия 2026 года; <code>PS-0364</code> Дети апостолов (3 521, статьи нет) — общее правило, о непереносе которого статья сама и пишет. Все три заведены, материал есть, статей нет.</p>\n<h3>С чего начать</h3>\n<p>Не в архив — сначала в базу и в собственную таблицу источников.</p>\n<p>Таблица «Источники» кончается на 2025-12-06 и перечисляет три диапазона: 393286–393290, 393312–393317, 393468–393477. В теле при этом цитируются 385768 (2025-11-17), 393479–393480, 393449–393460 и весь блок 488437–488440 (2026-06-07). То есть две трети статьи стоят на сообщениях, которых в её же реестре источников нет. Это правится за один заход и до всего остального.</p>\n<p>Дальше по базе, всё лежит готовым и не подцеплено: <code>PS-0375</code> (9 036) — редакция 2026 года; <code>SL-0125</code> «Список нерешённых вопросов по миру Оэм» (3 899) — туда стоит заглянуть прежде, чем повторно записывать «цель не придумана», вопрос мог быть уже занесён в список; <code>SP-0244</code> Камень желания (4 161); <code>PS-0322</code> Бог красок (18 056); <code>PS-0364</code> Дети апостолов (3 521) — под пробел про правило 466548; <code>PS-0367</code> Шесть столпов злодеев (3 270) и <code>PS-0366</code> Шесть столпов героев (6 416) — в редакции 2026 года эксперимент отражали «все столпы», обе записи без статей. <code>MR-0137</code> «Организация Нимб» статья имеет, но она про вселенную «Апостол» и на 2 927 знаков — с Нимбом из редакции 2026 года её никто не сводил; сам <code>VS-0006</code> Нимб (21 285) без статьи.</p>\n<p>В архив идти за одним: 2026-04-25, id 466548 — механика «дети апостолов после 18 лет захотят убить родителя». Смотреть окно вокруг этого id целиком: правило заявлено за полтора месяца до перезаписи дочери, и стоит проверить, не обсуждалось ли оно там применительно к ней. Второе окно — вокруг 488437–488440 (2026-06-07): в статью попали четыре сообщения, а решение Слава помечает как итог долгой работы, подводка могла лежать выше.</p>\n<h3>Как развивалось</h3>\n<p>2025-11-17, 385768 — заявили, и заявили экономно: не новый персонаж, а переназначение сестры, одной строкой в перечне организаций, сразу с оговоркой «и я не знаю какие у неё будет цель». 2025-12-06 — ограничили за один день и в основном отрицаниями: не апостол («Дети апостолов не являются апостолыми»), не она исчезла — она сама ушла, не «Имита» (это отец), нейросетевые варианты отклонены целиком одной репликой «Хуйня. Имитатор жив». В тот же день закреплено положительное: грех Чревоугодия, любовь к отцу, старение. Цель осталась пустой. Забыли на полгода: между 2025-12-06 и 2026-06-07 в источниках нет ничего. Вернулись 2026-06-07 — полной перезаписью: имя, мать, Нимб, восемь лет экспериментов, новая мотивация. Возврат при этом ушёл не сюда: результат вынесен в отдельную запись <code>PS-0375</code>, а эта статья осталась стоять на редакции 2025 года и ссылаться на продолжение вовне.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для неё отношение апостолов названо прямо: «Апостолы также относятся к ней дружелюбно так как она дочь Имита» (393477), и это работающее правило — она им пользуется, «Для плана». Для детей других апостолов такого правила нет. Случай того же рода в статье назван тут же, рядом: Защитник, апостол, «по сути сошёл с ума когда умер его ребенок» (393473) — то есть дети у других апостолов есть и в этих же сообщениях упомянуты. Как апостолы относятся к детям своих братьев и сестёр вообще, распространяется ли дружелюбие на всех или дело именно в Имите как представителе перед правительством, — не проговорено.</p>\n<h3>Отклик</h3>\n<p>Зацепило 393473 — то, как устроен её страх. Она боится не смерти, не разоблачения и не отца; она боится, что отец увидит, как она стареет, и что ему придётся её хоронить. Из этого сделан весь сюжетный ход: скрывается не преследуемая, а любящая, и уходит она сама. Пугает не то, что бессмертный переживёт тебя, а то, что ему придётся при этом присутствовать. Рядом стоит сухая реплика «А имя его дочери я не придумал» — у персонажа с полностью собранной внутренней механикой полгода нет имени, и это как-то честнее, чем если бы имя было. И ещё одна вещь, уже не про мир: 2026-06-07 Слава пишет «Я наконец-то смог придумать нормальную мотивацию дочери имет. При этом не разрушив их отношения». Между «не знаю какая у неё цель» и этой фразой — шесть месяцев, и видно, что всё это время условие было не «придумать мотивацию», а «придумать такую, чтобы они всё ещё любили друг друга». Ограничение автор себе поставил жёсткое и держал его молча.</p></div>", "r": []}];</script>
