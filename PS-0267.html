<script>const BASE="";const DOCNAME="Племяшка Алексея";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0267-S01", "PS-0267--proishozhdenie"], "h": "<p>Персонаж появляется однократно, в тексте от первого лица, который Слава выложил 2025-05-04 (id 323659–323660, окно w0090). Рассказчик этого текста — Алексей: «Я Алексей выживший. В том мире, в котором жиле мы до инцидента я был просто офисный сотрудник». Племяшка вводится через объяснение, зачем Алексей завёл будильник в выходной: «Лишь по одной причине. День рождения у племяшки».</p>\n<p>Родство названо прямо и подробно: «Сразу вас скажу. У самого детей или хотя бы подружки у меня нету. Не сложилась как-то. Но сестра уже в 20 вышла замуж и родила мне племяшку. Как вы поняли по моим словам. Я хорошо относился к племяшки. Поэтому и выключил будильник и дальше лег я спать». То есть её мать — сестра Алексея, вышедшая замуж и родившая в 20 лет.</p>\n<p>День рождения племяшки приходится на день катастрофы — на ту субботу, в которую в небе появляются «Линий в воздухе, как от самолёта. Вот только их было сотни если не тысячи», и город рушится. Утро этого дня начинается с её звонка.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0267-S02", "PS-0267--vneshnost"], "h": "<p>Не описана. В тексте есть только звучание: «детский голос», «детский писклявый голос», а речь сравнивается с очередью — «протараторила племяшка. Словно пулемёт, а не ребёнок».</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0267-S03", "PS-0267--harakter"], "h": "<p>Весь материал по характеру — один телефонный разговор, начатый ею самой в начале девятого утра (Алексей смотрит на время и видит 8:23).</p>\n<p>Настойчивость и напор. Звонок начинается сразу с монолога: «дядя! Вы проснулись? Мама сказала позвонить, иначе вы не проснетесь. Но ведь это же не правда. Вы же и без меня проснулись. Вы же не могли проспать мой день рождения». Она сама выдаёт поручение матери и тут же сама его опровергает.</p>\n<p>Обращение к дяде — на «вы».</p>\n<p>Реакция на сонное «кто это?» — крик: «ДяДЯ!! Вы же шутите!». Алексей описывает последствие: «Из-за этого я чуть ли не подпрыгнул с кровати. И именно этот писклявый голос заставил мой мозг работать».</p>\n<p>Готовность принять неправду, если её предложить. На вранье Алексея («а да-да шутка») она отвечает уже тише: «точно шутка».</p>\n<p>Торг о времени. На «Ждите меня ближе к 12» она отвечает «в 11» — «с едва обидчивым тоном», и Алексей соглашается: «хорошо постараюсь к 11».</p>\n<p>Передача материнской просьбы с оговоркой: «вы же поможете в готовке маме. Если что это не она попросила спросить». Алексей про себя отмечает: «А в моём голове пронеслось \"Да-да не она попросила\"».</p>\n<p>Непрерывный монолог о празднике: «сегодня ещё приедет моя подруга Катя и Лера. У них очень красивые куклы и домик даже для кукол есть», следом — «а ещё щеночек, такой пушистый и милый». Монолог обрывается только ложью Алексея «я сейчас за руль сажусь», после которой она «быстро успокоилась» и переходит к делу: «а это позвонить, когда подъезжать будете?».</p>\n<p>Отдельно зафиксирована общая с дядей привычка: «Сам же я редко ложу трубку первым. А племяшка такая же. Поэтому ещё минуты две мы просто молча ждали, кто первый бросит трубку. И конечно же выиграл я. Не без помощи сестры конечно. Сестра увидев как племяшка моя просто стоит молча с телефоном. Просто забрала телефон и отключилась. Привыкла она к нашим противостоянием». Молчаливое противостояние — повторяющееся, к нему привыкли в семье.</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0267-S04", "PS-0267--svyazi-s-drugimi"], "h": "<p>Алексей — дядя, рассказчик текста. Отношение с его стороны названо прямо: «Я хорошо относился к племяшки». Ради её дня рождения он заводит будильник в выходной, врёт ей дважды (что проспать не мог и что уже садится за руль), едет за подарком в детский магазин.</p>\n<p>Сестра Алексея — её мать. Вышла замуж и родила в 20. По ходу разговора она дважды присутствует опосредованно: сначала как та, кто велел звонить («Мама сказала позвонить»), потом как та, кто прекращает молчаливое противостояние, забрав у дочери телефон.</p>\n<p>Катя и Лера — подруги, которые должны приехать на день рождения. Про них сказано только то, что говорит сама племяшка: «У них очень красивые куклы и домик даже для кукол есть».</p>\n<p>Щеночек — упомянут в её монологе одной фразой: «а ещё щеночек, такой пушистый и милый». Чей он и приедет ли он, не сказано.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S05", "PS-0267-S05", "PS-0267--kak-menyalsya"], "h": "<p>2025-05-04, id 323659–323660, окно w0090. Единственное состояние, одна версия. Персонаж вводится, отрабатывает телефонную сцену и больше в этом куске не появляется. Изменений между версиями нет — версия одна.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S06", "PS-0267-S06", "PS-0267--chto-s-nim-stalo"], "h": "<p>В переписке не сказано. После разговора текст следует за Алексеем: он завтракает, вбивает в телефон запрос «детский магазин», едет по почти пустому городу, останавливается на светофоре и видит в небе линии; дальше удар, волна, обрушение зданий, здание падает на его машину — «А после тьма и тишина. Словно умер я и лежу в могиле». Где в этот момент находится племяшка, что с ней и с её матерью, дошёл ли подарок — ничего из этого в тексте нет. Известно только, что Алексей — «выживший», то есть повествование ведётся уже после катастрофы.</p>\n<p>Состоялся ли день рождения, осталось нерешённым.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0267-S07", "PS-0267--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имя не названо.</li>\n<li>Возраст не назван; о нём косвенно говорит только «детский голос», куклы и то, что за неё решает мать.</li>\n<li>Внешность не описана.</li>\n<li>Сколько ей исполняется лет в этот день рождения — не сказано.</li>\n<li>Отец не упомянут вовсе: названо только замужество сестры в 20 лет, муж в тексте не появляется.</li>\n<li>Судьба после удара не названа.</li>\n<li>Имя сестры Алексея не названо.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["PS-0267--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-05-04</td>\n<td>323659–323660</td>\n<td>w0090</td>\n<td>Нимб (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0267-plemyashka-alekseya.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0267--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0267.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
