<script>const BASE="";const DOCNAME="Ультима туле";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0038-S01", "MR-0038--ustroystvo"], "h": "<p>Ультима туле — название территорий, где люди не живут. Название придумано и принято за один вечер (2024-07-09, id 202369–202443).</p>\n<p>Определение дано через противопоставление острову. Слава спросил: «Как будет называться территории где нет островов», и уточнил: «Вот территория где живут много людей называется остров а территория где не живут люди как называется» (id 202373, 202380). Миколай ответил «ультима туле» и настоял на названии: «это обосновано», «так оно и должно называться», «никак иначе» (id 202383–202387). Слава принял: «Ну тогда ок» (id 202400).</p>\n<p>Содержание территории описал Слава: «Опасная местность где то с радиацией где то с монстрами где то с мертвое землёй» (id 202416). До этого Миколай представлял её иначе — «а я думал там нормальный мир» (id 202418).</p>\n<p>В ультима туле добывают ресурсы: «Или в ультима Туле добывать ресурсы» (id 202406).</p>\n<p>Признак, по которому территория определяется как остров, — «Много людей» (id 202436). Переход между островом и ультима туле не плавный: на вопрос Миколая «там плавный переход» / «или резкие границы» Слава ответил «Резкая граница» (id 202434–202440).</p>\n<p>Ультима туле — то, чем острова отделены друг от друга. На вопрос Миколая «как как разделены острова меж собой» / «этой землёй?» Слава ответил «Ультима туле» (id 202430–202433).</p>\n<p>Океана как разделителя нет: на вопрос Миколая, находятся ли острова в океане, Слава ответил «Нет, только у нуара» (id 202426–202428).</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0038-S02", "MR-0038--naselenie"], "h": "<p>Людей на территории нет — это исходный признак, по которому она отделена от острова. Из живого в переписке названы только монстры, и то как одна из характеристик местности («где то с монстрами»). Никто конкретный там не поселён.</p>", "r": []}, {"t": "Место во вселенной — как связан с другими мирами", "a": ["S03", "MR-0038-S03", "MR-0038--mesto-vo-vselennoy"], "h": "<p>Все острова вместе называются Ойкумена: «а все остова вместе это ойкумена» (id 202388). Ультима туле — всё, что вне их, и одновременно то, что их разделяет.</p>\n<p>В карточке ультима туле указана как часть Мира островов (архипелаг защитников) и связана с Деревнями и Ойкуменой.</p>\n<p>Разговор о названии начинается сразу после реплики Славы «Нахуй им там нет правительства сами все добывают с других островов или» (id 202369) — чьё именно правительство и какой остров имеется в виду, в этом фрагменте не сказано.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0038-S04", "MR-0038--kak-menyalsya-po-versiyam"], "h": "<p><strong>2024-07-09, версия 1 (id 202369–202400).</strong> Появляется само название. Обсуждается только оно: Слава спрашивает, как называется территория без людей, Миколай даёт «ультима туле» и тут же — «ойкумена» для всех островов вместе. Никакого содержания у территории на этом шаге ещё нет.</p>\n<p><strong>2024-07-09, версия 2 (id 202406–202443), тот же вечер.</strong> Наполняется содержанием: добыча ресурсов, радиация, монстры, мёртвая земля; острова определяются по большому числу людей; граница резкая; океан есть только у нуара. Здесь же расходятся представления соавторов — Миколай думал, что за островами «нормальный мир», Слава описал опасную местность.</p>\n<p>Отклонённый вариант: на вопрос Миколая «ты как это место видишь?» Слава сначала ответил «Преступный сброд» (id 202413), Миколай уточнил «не пустыню» / «ультима туле» (id 202414–202415), и следующая же реплика Славы заменила ответ на описание опасной местности. Вариант с преступным сбродом дальше не развивался.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0038-S05", "MR-0038--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Размеры и география ультима туле не описаны: сколько её, как она устроена, есть ли внутри что-то, кроме перечисленных опасностей.</li>\n<li>Откуда радиация и что за монстры — в переписке не сказано.</li>\n<li>Кто добывает там ресурсы и какие — не названо. Реплика про добычу оставлена без развития.</li>\n<li>Что означает «только у нуара» про океан — есть ли океан у одного острова или только вокруг него, в переписке не разъяснено.</li>\n<li>Как соотносятся «мёртвая земля» внутри ультима туле и сама ультима туле — отдельная это зона или её общее свойство, не сказано.</li>\n<li>Разговор второй версии обрывается на репликах Миколая «эм» / «а» / «ааа» (id 202441–202443) — согласование того, как устроены границы, осталось нерешённым.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0038--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0038--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-09</td>\n<td>202369–202400</td>\n<td>w0046</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-09</td>\n<td>202406–202443</td>\n<td>w0046</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0038-ultima-tule.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0038--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0038.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
