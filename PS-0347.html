<script>const BASE="";const DOCNAME="Мишка";
const LEAD="<p>Персонаж вселенной «7 островов». Вариант имени — Миша. Одна версия, одна дата (2026-02-08, id 430010), окно w0116. Входит в состав «Чёрного озера».</p>";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0347-S01", "PS-0347--proishozhdenie"], "h": "<p>Появляется внутри прозаического текста Славы «Чёрное озеро» (2026-02-08, id 430010). Обозначен как «близкий приятель в этой деревне» рассказчика — Сергея. Рассказчик в деревне «недавно обосновался», Мишка же в ней свой и владеет местными новостями; кто он такой помимо этого, откуда взялся и как давно живёт в деревне — в переписке не сказано.</p>\n<p>Функция при вводе — источник экспозиции: через диалог с ним подаётся завязка (отсутствие света и связи, уехавшие в город и не вернувшиеся мужики, раненый внук Любки).</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0347-S02", "PS-0347--vneshnost"], "h": "<p>Не описана. Из действий: «потирая подбородок», «глотая слюну в засохшем горле», «трясётся и оглядывается на любой шорох».</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0347-S03", "PS-0347--harakter"], "h": "<p>Разговаривает с рассказчиком коротко и встречными вопросами: «а Сергей ты чтоль?», «а ты не знаешь что-ли?», «слушай у тебя дома свет есть?», «а связь ловит?». На вопрос о том, что происходит, «искренне удивляется», что Сергей не в курсе, потом «вздыхает».</p>\n<p>Сам объяснения не имеет: «да блять. Хрен знает, что происходит». Ту часть, которую знает, излагает по порядку — сначала свет и связь, потом уехавшие мужики, потом нападение.</p>\n<p>В лесу нервничает: «Да и Мишка чё-то нервный. трясется и оглядывается на любой шолох». Рассказчик отмечает это в ряду наблюдений о том, что вся толпа идёт не так уверенно, как ему показалось сначала.</p>\n<p>К словам пострадавшего мальчика о нападавшем относится с той же оговоркой, что и остальные: «пацан то этот говорит, что чудовищя какой. Ну ему конечно некто не поверил. В шоке пацан просто. Ну всё же, кто его так полоснул».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0347-S04", "PS-0347--sposobnosti"], "h": "<p>Не названы.</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0347-S05", "PS-0347--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Сергей</strong> — рассказчик, «близкий приятель в этой деревне». Весь материал о Мишке — это их разговор в идущей по лесу толпе. Сергей подходит к нему, специально «проверяя чтобы нас никто не подслушал».</li>\n<li><strong>Мужики деревни</strong> — идёт вместе с ними в лес, с вилами, топорами, фонариками; у местного охотника двустволка. Что несёт сам Мишка — не сказано.</li>\n<li><strong>Внук Любки</strong> — пострадавший, о котором Мишка рассказывает. Лично с ним Мишка в тексте не связан.</li>\n<li><strong>Володя</strong> — бинтовал руку раненому; Мишка пересказывает его слова о том, что «нервы задела и пацан больше не сможет, как прежде рукой махать».</li>\n<li><strong>Васька</strong> — идёт в той же толпе, «как видимо успевший притронуться к рюмке», спотыкается и кряхтит. С Мишкой напрямую не связан.</li>\n<li><strong>Чёрное озеро</strong> — текст, частью которого Мишка является.</li>\n</ul>", "r": []}, {"t": "Что рассказывает", "a": ["S06", "PS-0347-S06", "PS-0347--chto-rasskazyvaet"], "h": "<p>Сведения, которые Мишка сообщает Сергею (id 430010):</p>\n<ul>\n<li>у всей деревни нет света и не ловит связь; электричество отключилось «с двух часов дня»;</li>\n<li>«Мужики у кого есть машина, в город поехали узнать почему электричество выключили. Так до сих пор не приехали»;</li>\n<li>«на внука Любки, Кто-то напал и руку полоснул»; крови было много;</li>\n<li>Володя, бинтовавший руку, сказал, что «нервы задела и пацан больше не сможет, как прежде рукой махать»;</li>\n<li>кто напал — неизвестно; «Знают только, что в лес убежал».</li>\n</ul>\n<p>Разговор заканчивается тем, что Мишка ускоряет шаг.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S07", "PS-0347-S07", "PS-0347--kak-menyalsya"], "h": "<p><strong>2026-02-08 (id 430010, w0116)</strong> — единственная версия. Введён как источник экспозиции в тексте «Чёрное озеро». Других состояний нет: версия одна, дата открытия и закрытия совпадают.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S08", "PS-0347-S08", "PS-0347--chto-s-nim-stalo"], "h": "<p>Не сказано. Текст на записанном фрагменте обрывается на том, что толпа идёт по лесу; дальнейшая судьба Мишки в переписке не появляется.</p>", "r": []}, {"t": "Пробелы", "a": ["S09", "PS-0347-S09", "PS-0347--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Внешность, возраст, род занятий, семья — не названы.</li>\n<li>Чем вооружён и вооружён ли — не сказано, хотя перечислено оружие остальных.</li>\n<li>Откуда Мишка знает то, что рассказывает, и от кого — не сказано.</li>\n<li>Почему он нервный больше остальных, знает ли что-то сверх сказанного — не раскрыто.</li>\n<li>Дальнейшая роль в сюжете «Чёрного озера» — отсутствует, дальше единственного фрагмента персонаж не разработан.</li>\n<li>Второй соавтор (Миколай) в материале по Мишке не участвует: обсуждения персонажа в переписке нет, есть только сам прозаический текст.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0347--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0347--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-02-08</td>\n<td>430010–430010</td>\n<td>w0116</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0347-mishka.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0347--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0347.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
