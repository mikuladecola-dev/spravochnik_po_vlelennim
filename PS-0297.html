<script>const BASE="";const DOCNAME="Шаркань";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0297-S01", "PS-0297--proishozhdenie"], "h": "<p>Материал относится к вселенной, объявленной репликой «Разрушаем вселенную» (2025-09-17, id 366030); собственного названия эта вселенная в переписке не получила.</p>\n<p>Шаркань — единственное существо из «копилки» мифологических монстров, которое Слава прямо взял в работу (2025-09-17, id 366243–366247, окно w0105). Слава переслал легенду: Шаркань был человеком, который решил выпить драконью кровь, потому что по легенде это дарует бессмертие. Но вместо бессмертия человек «превратился в отвратительного дракона — Шарканя».</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0297-S02", "PS-0297--vneshnost"], "h": "<p>«По ранним легендам, Шаркань был поход на обычного ядовитого змея, но потом его переделали в многоголового крылатого дракона». Часто Шаркань «ездит на чёрным коне по лесу ночью».</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0297-S03", "PS-0297--harakter"], "h": "<p>Шаркань действительно бессмертен, но его жизнь — «настоящий ад». Дракон вынужден вечно искать жертв «на растерзание демонам», а сам при этом испытывает «постоянный, неутолимый голод».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0297-S04", "PS-0297--sposobnosti"], "h": "<p>Бессмертие, приобретённое через питьё драконьей крови. Способность неограниченно охотиться на жертв по ночам. Отмечен как кандидат в «ядовитых чудищ» — связь с ядом идёт от ранней версии легенды, где Шаркань был обычным ядовитым змеем.</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0297-S05", "PS-0297--svyazi-s-drugimi"], "h": "<p>Часть «копилки» монстров из мифологии — общего списка существ, из которого Слава пересылал материал Миколаю. В том же сообщении (id 366247), сразу после Шарканя, Слава переслал ещё одну легенду — про Атцыса, своеобразный вид вампиров, охотящихся по ночам на одиноких путников и притворяющихся копной сена или стогом. Прямой связи между Шарканем и Атцысом в переписке не проведено — они просто оказались в одной подборке.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0297-S06", "PS-0297--kak-menyalsya"], "h": "<h3>2025-09-17 (id 366243–366247, окно w0105)</h3>\n<p>Единственная зафиксированная версия. Слава пересылает легенду о Шаркане целиком, затем сразу даёт оценку: «Мне нравится» (id 366245) и предложение: «Можно добавить как ядовитого чудища» (id 366246).</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0297-S07", "PS-0297--chto-s-nim-stalo"], "h": "<p>На 2025-09-17 Шаркань помечен как кандидат в ядовитые чудища. Дальнейшая судьба персонажа — принят ли он окончательно в работу, дорабатывался ли дальше — в переписке не отражена.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0297-S08", "PS-0297--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вселенная, к которой привязан персонаж, не названа — только «неясно» / период, объявленный 2025-09-17.</li>\n<li>В зафиксированном фрагменте реплики Миколая нет — решение («нравится», «можно добавить») высказано только Славой; согласился ли Миколай, не сказано.</li>\n<li>Что значит «добавить как ядовитого чудища» в смысле правил вселенной — не раскрыто.</li>\n<li>Связь с Атцысом, упомянутым в том же сообщении, не прописана — состав «копилки» и то, как соотносятся между собой её персонажи, не назван.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["PS-0297--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-09-17</td>\n<td>366243–366247</td>\n<td>w0105</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0297-sharkan.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0297--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0297.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
