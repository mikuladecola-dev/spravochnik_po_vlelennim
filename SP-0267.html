<script>const BASE="";const DOCNAME="Молния";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0267-S01", "SP-0267--mehanika"], "h": "<p>Способность названа один раз, в перечне способностей Нуара (2026-06-02, id 487010). Описание целиком укладывается в одну строку:</p>\n<div class=\"q\"><p>«Молния. Ну здесь говорить особого не чево просто плюс разрушительный навык.»</p></div>\n<p>То есть на момент упоминания Молния зафиксирована двумя признаками: это «разрушительный навык» и это «плюс» — добавка к остальному набору Нуара. Никакого другого описания механики в переписке нет, и автор оговаривает это прямо: говорить особо нечего.</p>\n<p>Молния стоит в перечне третьей, между Словами и Тьмой. Порядок в перечне (id 487010): управление собственной кровью → Слова → Молния → Тьма.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S02", "SP-0267-S02", "SP-0267--nositeli"], "h": "<p>Нуар. В базе способность записана как часть Нуара.</p>\n<p>В том же перечне (id 487010) у Нуара названы:</p>\n<ul>\n<li><strong>управление собственной кровью</strong> — «Может управлять собственное кровью, а из-за регенерация он может вырабатывать эту кровь дофига»;</li>\n<li><strong>Слова</strong> — «Он может отдавать приказы и люди повинуются. Не особо действительно против сильных противников. Да и он не может сказать убить себя или навредить себе, инстинкт самосохранения просто не даст этого сделать»;</li>\n<li><strong>Молния</strong>;</li>\n<li><strong>Тьма</strong> — пропитывание тьмой воздуха, земли, воды и всего, что «не имеет инстинктов или разума», с радиусом области «примерно 3 км».</li>\n</ul>\n<p>Отдельно, до перечня способностей, названы общие особенности (id 487009): «У Нуара и апостолов есть особенности. Они не стареют, у них невероятное быстрая регенерация тела. И их тела очень адаптивные. Ну ещё несколько особенностей которых я прям здесь не скажу». Есть ли Молния у апостолов — не сказано; в переписке она приписана только Нуару.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S03", "SP-0267-S03", "SP-0267--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2026-06-02 (окно w0120, id 487009–487011).</strong> Первое и единственное упоминание. Способность введена одной строкой внутри общего разбора Нуара, без подробностей. Других версий в базе нет; диапазон дат записи — 2026-06-02 — 2026-06-02.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S04", "SP-0267-S04", "SP-0267--svyaz-s-drugimi-sposobnostyami"], "h": "<ul>\n<li><strong>Тьма.</strong> Про область тьмы Нуара сказано: «И кстати в области тьмы способности нуар становяться мощнее, а способности противников слабее» (id 487010). Сказано про способности Нуара в целом; Молния отдельно в этой оговорке не названа.</li>\n<li><strong>Регенерация и адаптивность тела</strong> (id 487009) относятся к Нуару и апостолам как общие особенности, а не к Молнии.</li>\n<li>Реплика следом (id 487011) переходит к Графу и его способности «власть»: «Я говорил что его способность власть ну толком не описал ее. Ты наверное думал что это просто телекинез. И сейчас я тебе всё объясню». К Молнии это отношения не имеет — просто следующий пункт разговора.</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S05", "SP-0267-S05", "SP-0267--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Механика не описана вообще: не сказано, как способность применяется, на какой дистанции, чем ограничена.</li>\n<li>Не сказано, электрическая ли природа способности — имя «Молния» единственное, что на это указывает, но в переписке это не раскрыто.</li>\n<li>Ограничения и цена не названы. У соседней способности (Слова) ограничения проговорены подробно, у Молнии — нет.</li>\n<li>Не сказано, что именно «разрушительный навык» разрушает: живое, неживое, площадь или единичную цель.</li>\n<li>Не сказано, есть ли Молния у апостолов и вообще у кого-либо кроме Нуара.</li>\n<li>«Ещё несколько особенностей которых я прям здесь не скажу» (id 487009) остались нераскрытыми.</li>\n<li>Вселенная записи в базе помечена как «неясно» — привязка проставлена по дате объявления.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0267--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0104.html\">Нуар</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0267--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-06-02</td>\n<td>487009–487011</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0267-molniya.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0267--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0267.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
