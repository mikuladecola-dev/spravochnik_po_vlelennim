<script>const BASE="";const DOCNAME="Сверхлюди (Феня)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0080-S01", "GR-0080--chto-eto"], "h": "<p>Сверхлюди — раса-сообщество вселенной «Феня»: люди со сверхсилами, живущие во всей вселенной. Разрабатывались Славой и Миколаем в один заход (2025-12-09, окно w0113, id 394730–394847).</p>\n<p>Именно от них вселенная получила имя. Миколай предложил слово «феня» как название языка: «феня это язык торговли, где всех наёбывали и придумали слово лох» (394749, 2025-12-09 15:33). Слава принял название и связал его со сверхлюдьми: «Феня. Идеально описывает всех сверхлюдей. Их наебали» (394753, 15:34). То есть имя вселенной — характеристика этой группы, а не географии или сюжета.</p>\n<p>Кто их наебал — их Отец (<a href=\"PS-0330.html\">Отец</a>), «духовный отец», «папа приёмный» и создатель сверхлюдей. Механика обмана — контракт на «души» (<a href=\"SP-0256.html\">Контракт на «души»</a>), условия которого Отец «просто не выполняет» (394817).</p>\n<p>Ни один сверхчеловек Фени поимённо в этих сообщениях не назван.</p>\n<p>В каталоге справочника группа отделена от <a href=\"GR-0042.html\">Сверхлюди (люди с сосудом)</a> «Сверхлюди (люди с сосудом)» вселенной «монстры» — там другая механика. Это пометка каталога, в переписке двух этих групп не сопоставляли.</p>", "r": [["Сверхлюди (люди с сосудом)", "GR-0042.html"], ["Отец", "PS-0330.html"], ["Контракт на «души»", "SP-0256.html"]]}, {"t": "Состав", "a": ["S02", "GR-0080-S02", "GR-0080--sostav"], "h": "<p>Поимённого состава нет. В переписке не назван ни один конкретный сверхчеловек Фени — ни имени, ни прозвища, ни числа участников. Группа описана только целиком, как «все сверхлюди».</p>\n<p>Отдельно: главный герой вселенной Фени существует («Гг бессмертный», 394741), и вселенная выросла из попытки Славы «тот образ гг сделать в настоящим» (394757), но сказано ли, что гг — сверхчеловек, в переписке нет. Связь не проведена.</p>", "r": []}, {"t": "Общие способности группы", "a": ["S03", "GR-0080-S03", "GR-0080--obschie-sposobnosti-gruppy"], "h": "<p>Сверхсилы. Какие конкретно — не названо ни одной; список способностей в этих окнах не обсуждался.</p>\n<p>Главное свойство системы сил — намеренная слабость. Слава: «сверх силы там слабее. И в теории даже обычные человек способен победить сверхчеловека» (394757, 15:36). Причина названа прямо и она авторская, а не внутримировая: «Из-за легче развивать отношения людей. Просто в Оам все чё-то слишком сильный. Да и Оам Вселенная большая как боевик» (394757). Позже Слава повторил ту же мысль: «По сути Вселенная лёгкая я же её придумал для развития персонажей, чтобы не заморачиваться над системы силы» (394839, 15:49).</p>\n<p>Биологически они люди. На прямой вопрос Миколая «они полу люди или люди мутанты» (394799) Слава ответил: «Они люди» (394808). Не полулюди и не мутанты.</p>\n<p>Потомство между собой иметь могут — это ответ на вопрос «а они меж собой могут иметь потомство» (394798). Передаются ли сверхсилы потомству, в переписке не сказано.</p>\n<p>Психика у них при этом в порядке. Слава подчёркивает это как отдельное свойство, вместе с фактом обмана: «Всех сверхлюдей. У которых психика все еще Окей» (394766, 15:38).</p>\n<p>Душа сверхчеловека неотчуждаема — как и у всякого человека этой вселенной: «Душа всегда принадлежит человека. Её нельзя отнять или купить» (394843, 15:50). Это правило мира, распространяющееся и на них.</p>", "r": []}, {"t": "Иерархия", "a": ["S04", "GR-0080-S04", "GR-0080--ierarhiya"], "h": "<p>Внутренней иерархии между сверхлюдьми не описано: ни вождей, ни рангов, ни делений на группы.</p>\n<p>Над ними стоит одна фигура — Отец (<a href=\"PS-0330.html\">Отец</a>). Он назван их создателем (в вопросе Миколая «а кто их отец / создатель / сверхлюдей», 394795–394797) и охарактеризован Славой как «духовные отец. Папа приёмный» (394803, 15:44). При этом он не бог: «Боги конечно есть, но они будут появляться изредка. А их отец не Бог» (394784, 15:41). Кто он такой на самом деле — сознательно не раскрыто: «Он вроде как человек, но не человек. Потом скажу при встрече» (394837, 15:49).</p>\n<p>Отношение группы к Отцу задано через обман. Он заключил с ними контракт на «души» (кавычки в записи важны — Слава отдельно на них указал: «Видишь кавычки 😏», 394833) и не выполняет его условия (394817). Что является предметом контракта вместо душ — не сказано. Реальные души предметом сделки быть не могут по правилу мира: «Даже Бог на такое не способен. Что говорить уже о Отце» (394846–394847).</p>\n<p>Есть также реплика Славы «Отец уважает отца» (394809, 15:45) — сказано в ответ на слова Миколая о том, что религия воспитывает уважать отца, «сам Отец так говорит» (394804). Уточнение Славы: «В смысле он говорит» (394810). Что это значит для устройства группы, в переписке не развёрнуто.</p>", "r": [["Отец", "PS-0330.html"]]}, {"t": "Отношения с другими группами", "a": ["S05", "GR-0080-S05", "GR-0080--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>Обычные люди.</strong> Прямо оговорено, что сверхлюди не непобедимы: «в теории даже обычные человек способен победить сверхчеловека» (394757). Никаких других отношений с обычными людьми — вражды, скрытности, законов — не описано.</p>\n<p><strong>Боги (<a href=\"MR-0185.html\">Боги во вселенной Феня</a>).</strong> Боги в Фене есть, но «они будут появляться изредка» (394784). Отец к ним не относится. Взаимодействия сверхлюдей с богами в переписке нет.</p>\n<p><strong>Сверхлюди Оам.</strong> Сравнение идёт по силе, и только по силе: в Оам «все чё-то слишком сильный», Оам — «Вселенная большая как боевик» (394757). Оам противопоставлена Фене как тяжёлая вселенная лёгкой. Прямых контактов между вселенными не упомянуто.</p>", "r": [["Боги во вселенной Феня", "MR-0185.html"]]}, {"t": "Как менялась — по датам", "a": ["S06", "GR-0080-S06", "GR-0080--kak-menyalas"], "h": "<p>Вся разработка — 2025-12-09, окно w0113, за примерно двадцать минут (15:30–15:50). Состояния идут в таком порядке:</p>\n<p><strong>15:30–15:34, id 394730–394753 — имя.</strong> Обсуждается название второй вселенной. Отклонённые варианты: «Вторая» (394738), «Вай» / «Вайчеслав» — предложение Миколая назвать вселенную именем Славы (394732–394739). Принят вариант «феня» (394745, 394751). Обоснование Славы связывает название именно со сверхлюдьми: их наебали.</p>\n<p><strong>15:36, id 394757 — система сил.</strong> Заданы происхождение вселенной (попытка сделать образ гг настоящим) и слабость сверхсил с авторским обоснованием — легче развивать отношения людей.</p>\n<p><strong>15:38–15:41, id 394766–394784 — обманщик.</strong> Появляется Отец. Одновременно фиксируется, что психика сверхлюдей «все еще Окей». Уточнено, что Отец не Бог, и что боги в мире существуют отдельно от него.</p>\n<p><strong>15:43–15:45, id 394795–394809 — природа сверхлюдей.</strong> Отвечено на вопросы о потомстве и о том, кто они: могут иметь потомство между собой, «Они люди». Отец назван духовным и приёмным отцом, создателем.</p>\n<p><strong>15:45–15:48, id 394812–394833 — механика обмана.</strong> Введён контракт на «души»; обман сводится к невыполнению условий. Отклонена трактовка Миколая «типа как демоны?» (394829) — Слава отправил его перечитывать и указал на кавычки.</p>\n<p><strong>15:49–15:50, id 394839–394847 — предел.</strong> Правило мира: душу нельзя отнять или купить, это не под силу даже Богу, тем более Отцу. Повторено, что вселенная лёгкая и придумана для развития персонажей.</p>\n<p>Внутри окна ни одно из этих положений не отменялось и не переписывалось — материал только добавлялся.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "GR-0080-S07", "GR-0080--probely"], "h": "<div class=\"gaps\"><ul>\n<li><strong>Поимённого состава нет.</strong> Ни один сверхчеловек Фени не назван. Численность группы, её расселение, организация — не обсуждались.</li>\n<li><strong>Конкретных сверхсил не названо ни одной.</strong> Сказано только, что силы слабее, чем в Оам. Есть ли у разных сверхлюдей разные способности, различаются ли они по силе между собой — в переписке не сказано, поэтому раздел «Чем участники отличаются друг от друга» здесь пуст.</li>\n<li><strong>Предмет контракта не назван.</strong> Кавычки в слове «души» подчёркнуты автором как ключевые, но что стоит за ними вместо душ — осталось нерешённым.</li>\n<li><strong>Что именно Отец не выполняет</strong> и что сверхлюди должны были получить по контракту — не сказано.</li>\n<li><strong>Кто такой Отец</strong> — сознательно отложено: «Потом скажу при встрече» (394837).</li>\n<li><strong>Наследуются ли силы.</strong> Потомство между сверхлюдьми возможно, но что рождается у такой пары, не обсуждалось.</li>\n<li><strong>Происхождение группы.</strong> Отец назван создателем сверхлюдей, но как он их создал и когда — не описано.</li>\n<li><strong>Знают ли сами сверхлюди об обмане</strong> — в переписке не сказано.</li>\n<li><strong>Связь сверхлюдей с бессмертным гг</strong> вселенной не проведена.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0080--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0330.html\">Отец</a></li>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0256.html\">Контракт на «души»</a></li>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0185.html\">Боги во вселенной Феня</a></li>\n<li><strong>Упоминает группы:</strong> <a href=\"GR-0042.html\">Сверхлюди (люди с сосудом)</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0080--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0080.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0080-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0080/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дорогая дыра здесь одна — Отец (<code>PS-0330</code>). На нём висит вся конструкция этой статьи: он создатель группы, он же вторая сторона контракта, он же определён отрицательно в статье о богах («Отец не Бог»). То есть на него завязаны <code>GR-0080</code>, <code>SP-0256</code> и <code>MR-0185</code>, а материала о нём в базе всего 6717 знаков, и главный ответ — кто он такой — вынесен автором за пределы чата: «Он вроде как человек, но не человек. Потом скажу при встрече» (394837). Пока эта фраза не раскрыта, три статьи описывают отношение к пустому месту.</p>\n<p>Вторая по цене — не «нет поимённого состава» (это не чинится, состава просто не придумывали), а раздвоение самой группы. У <code>GR-0080</code> собственной записи в базе нет вообще (<code>razmer_bazy: 0</code>), а рядом лежит <code>SP-0257</code> «Сверхлюди Фени» (способность, 4142 знака, 2 ссылки) — с тем же материалом: слабость сил, «Они люди», потомство, психика. Одна сущность заведена дважды, в разных типах, и статья группы на <code>SP-0257</code> не ссылается ни разу.</p>\n<h3>С чего начать</h3>\n<p>В базе, не в архиве — почти всё уже есть, просто разъехалось. Система сил и природа носителей — <code>SP-0257</code>; механика обмана — <code>SP-0256</code>; фигура Отца — <code>PS-0330</code>; фон с богами — <code>MR-0185</code>. Отдельно стоит посмотреть <code>PS-0331</code> «Бессмертный главный герой» (5567 знаков): пробел «связь сверхлюдей с бессмертным гг не проведена» закрывается или снимается прямо оттуда — там та же дата и то же окно, id 394640–394664 и 394737–394757, то есть разговор про гг идёт за пятнадцать минут до разговора про сверхлюдей, в одном заходе.</p>\n<p>В архив идти надо ровно за одним — за тем, чем Отец кончился. Ориентир: всё, что после 2025-12-09 15:50 (конец окна w0113), и заходы, где Феня возвращается — 2025-12-11, 2025-12-14, 2025-12-17. Если в них Отец не всплывает, дыра не архивная: обещание «скажу при встрече» означает, что материал был проговорён устно и в переписке его нет в принципе. Это стоит зафиксировать явно, чтобы не искать дважды.</p>\n<h3>Как развивалось</h3>\n<p>Заявили — имя вселенной выведено из состояния группы (15:34, «Их наебали»). Ограничили — сначала силы («сверх силы там слабее», 15:36), потом природу («Они люди», не полулюди и не мутанты, 15:44), потом трактовку (отклонено «типа как демоны?», 15:47). Отложили — на вопрос, кто такой Отец, ответ вынесен из чата (15:49). Закрыли верхнюю границу — душу нельзя отнять или купить, «даже Бог на такое не способен» (15:50). Всё это двадцать минут одного дня; ни одно положение внутри окна не переписано. В следующие заходы (12-11, 12-14, 12-17) Феня возвращается регулярно, но уже через «Фанатика» и пришельцев — к сверхлюдям разговор не возвращается ни разу.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для души правило названо жёстко и с указанием предела: её нельзя отнять или купить, это не под силу даже Богу. Для сверхсилы — вещи того же рода, тоже данной Отцом и тоже предположительно предмет сделки — такого правила нет. Можно ли силу отнять, вернуть, передать по контракту, наследуется ли она детям, про которых отдельно сказано, что они возможны, — не проговорено. Место видно, решения не предлагаю.</p>\n<h3>Отклик</h3>\n<p>Зацепил ход, которым имя вселенной получилось из свойства группы, а не наоборот: сначала слово про язык торговли, где всех обманывали, потом «Феня. Идеально описывает всех сверхлюдей. Их наебали» — и вселенная называется по тому, что с её людьми сделали. Второе — «У которых психика все еще Окей». Обычно обманутые сверхлюди — это повод для сломанных персонажей, и отказ от этого повода сделан одной репликой, мимоходом, как техническая пометка. И третье, самое честное место во всём окне: система сил объясняется не изнутри мира, а прямо — «я же её придумал для развития персонажей, чтобы не заморачиваться над системы силы». Автор не притворяется, что мир существует помимо его удобства.</p></div>", "r": []}];</script>
