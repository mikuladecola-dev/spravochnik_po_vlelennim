<script>const BASE="";const DOCNAME="дочка спасателя";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0152-S01", "PS-0152--proishozhdenie"], "h": "<p>Дочка спасателя появляется 2024-08-29 (id 226088–226095, окно w0055) внутри одного большого монолога, написанного Миколаем от лица спасателя. Отдельной сцены с ней нет — она названа только в его словах. Это первое появление семьи спасателя как мотива.</p>\n<p>Сам монолог Миколай обозначил как «один из повседневности спасателя» и добавил: «хотел характер раскрыть».</p>", "r": []}, {"t": "Характер", "a": ["S02", "PS-0152-S02", "PS-0152--harakter"], "h": "<p>Прямых черт дочери в переписке нет. Про неё сказано только то, что говорит о ней спасатель:</p>\n<p>«я. я хочу увидеть дочку. я устал видеть эти мерзкие лица, устал каждого уничтожать. я хочу жить счастливо и размеренно со своей семьёй. эти изверги, я ненавижу их. их не останется ни одного.»</p>\n<p>Функция дочери и семьи в тексте — то, ради чего спасатель терпит охоту.</p>", "r": []}, {"t": "Связи с другими", "a": ["S03", "PS-0152-S03", "PS-0152--svyazi-s-drugimi"], "h": "<p>Спасатель — отец. Дочь проходит как часть спасателя, отдельно от его линии в переписке не разрабатывалась.</p>\n<p>Остальной монолог, в котором она названа, идёт про другое: спасатель встречает собеседника, ведёт показывать склад, шутит про его рост («сколько рост? ну 165 в 27 лет это забавно конечно»), извиняется за отбитое плечо — «это уже инстинктивно получилось»; собирается «в Хойя-Бачу монстров на монстров порыбачу»; говорит про «векторную тварь», которая «очень сподручна для перемещения», и что её «буду истреблять последней. хотя нет всех и сразу»; ищет эхолокатора; шёл за рыбочеловеком до Ньюса ради супа и данных — «после 56 тестов я смогу с уверенностью определить его возможности, его днк и другие данные»; упоминает паренька, который займётся вычислениями, и спор с ним о том, что люди и монстры не связаны и что ауры не существует; в конце давит векторный шар. Дочь названа в этом же потоке, между хозяйственными делами и ненавистью к монстрам.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S04", "PS-0152-S04", "PS-0152--kak-menyalsya"], "h": "<p>Одно состояние, 2024-08-29 (id 226088–226095). Дальнейших версий в переписке нет.</p>\n<p>Сразу после монолога Миколай пишет: «боже», «прости», «я не могу», «я не умею писать», «я не знаю что мне делать» — то есть монолог остаётся в переписке вместе с недовольством автора собственным текстом.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "PS-0152-S05", "PS-0152--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Жива ли дочь и где она — не сказано.</li>\n<li>Имя, возраст, внешность не названы.</li>\n<li>Семья упомянута одним словом, состав не назван; мать не упоминается.</li>\n<li>Видел ли спасатель дочь с начала охоты и что мешает ему её увидеть — в переписке не сказано.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["PS-0152--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-29</td>\n<td>226088–226095</td>\n<td>w0055</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0152-dochka-spasatelya.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0152--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0152.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
