<script>const BASE="";const DOCNAME="Гордыня";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0192-S01", "PS-0192--proishozhdenie"], "h": "<p>Один из Семи грехов — группы персонажей, заданной Славой 2025-01-23 (окно w0072, id 284175). Там же задан её уровень силы: «7 грехов и божество ( помнишь его) Будет слабей главы этой организации но сильней благословенного».</p>\n<p>Гордыня появляется в списке способностей грехов сразу с закреплённой за ней способностью (284176) и дальше обсуждается отдельно — единственный из грехов, чью способность переигрывали.</p>\n<p>В каталоге персонажей проходит как «Гордыня 👑» (284278).</p>", "r": []}, {"t": "Способности", "a": ["S02", "PS-0192-S02", "PS-0192--sposobnosti"], "h": "<p><strong>Первый вариант (2025-01-23, id 284176):</strong> «Гордыня: Слово закон с ограничением». Что именно за ограничение — не раскрыто. Формулировка построена по тому же образцу, что и у Похоти в том же сообщении: «Контроль разума с ограничением».</p>\n<p><strong>Второй вариант (2025-01-24, id 284257, 284271):</strong> «выход за предел». Миколай раскрыл его так: «типа он гордится силой, отрицая ограничения тела. он легко способен сбросить естественные биологические ограничители, но после такие травмы получить».</p>\n<p>Под естественными биологическими ограничителями Миколай прислал список (284274):</p>\n<ol>\n<li>Центральный регулятор усталости — мозг останавливает усилие до реального истощения мышц, защищая от травм.</li>\n<li>Болевые рецепторы — сигнализируют о повреждениях, заставляя снизить нагрузку.</li>\n<li>Терморегуляция — потовые железы и дыхание предотвращают перегрев.</li>\n<li>Инстинкты самосохранения — страх/дискомфорт ограничивают рискованные действия.</li>\n</ol>\n<p>С припиской: «Тренировки и адаптация могут \"обмануть\" эти системы, повышая выносливость, но с риском перегрузок».</p>\n<p>Цена способности названа сразу вместе с ней: «но после такие травмы получить».</p>\n<p>Ни один из двух вариантов не утверждён. В каталоге (284278) у Гордыни, единственной из семи грехов, в скобках не стоит ничего — только 👑, тогда как у остальных способность подписана: Гнев (сила), Похоть (контроль разума), Зависть (полной копирование), Алчность (всё моей), Чревоугодие (поглощения), Лень (контроль территории).</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Дороже всего — каталоги: <code>SL-0051</code> «Каталог: благословенные, враги, грехи, оружие, артефакты» (шесть ссылок, статьи нет, 9 834) и <code>SL-0053</code> «Список персонажей вселенной» (шесть ссылок, статьи нет, 20 313). Статья кончается 2025-01-24 пустым местом в скобках — а строка «Гордыня 👑» после этого переезжает из редакции в редакцию ещё четыре раза, дословно и без способности: 2025-01-27 (284858), 2025-01-28 (285519–285551), 2025-02-25 (295556), 2025-03-06 (298846). И в последней из них, id 298854, Слава пишет: «Грехи нужно убрать, а то тупо», Миколай следом: «ну просто в сюжет не совсем входят». То есть вопрос не просто остался открытым — через полтора месяца семёрку сняли с доски целиком, и ни одна статья грехов об этом решении не знает. На <code>SL-0051</code> ссылаются статьи о Похоти, Чревоугодии, Лени, Зависти, Семи грехах и Божестве; <code>PS-0192</code> на каталог не ссылается, хотя единственное свидетельство о пустом месте взято именно оттуда.</p></div>\n<div class=\"mnote\"><b>⚙ машинная заметка · Что не сформулировано по вашей же логике — не материал авторов</b>\n<p>Цена. У Гордыни она названа в одной фразе со способностью: «он легко способен сбросить естественные биологические ограничители, но после такие травмы получить». У остальных шести в обоих списках — и в 284176, и в каталоге 284278 — способность стоит без всякой платы: сила, контроль разума, поглощение, полное копирование, телекинез, «всё моей». Сказано ли, что у них цены нет, или её просто не проговорили, — нигде. При этом мера силы посчитана подробно и с числами: три благословенных Бога на одного греха, пять обычных. Меры расплаты нет ни у кого, кроме единственного греха, у которого нет способности.</p></div>\n<div class=\"mnote\"><b>⚙ машинная заметка · Отклик — не материал авторов</b>\n<p>Зацепило пустое место в каталоге. Шесть строк со скобками — и одна «Гордыня 👑», корона без содержимого. Из всех способов записать «мы не договорились» этот самый выразительный, и вышел он случайно. Ещё в двух репликах хорошо виден рабочий критерий: Слава отвергает «слово закон» не потому, что скучно звучит, а потому, что «не могу представить битву» — требование конкретное, проверяемое и, судя по остальным грехам, работающее постоянно. А второй вариант любопытен ровно тем, чем не подошёл: «выход за предел» — единственная заявка в семёрке, которая ничего не добавляет носителю, а только снимает у него предохранители, и платит он собой. Для греха гордыни это точнее всего, что стоит в скобках у остальных шести; человек, придумавший это, отступил от собственной идеи через полчаса, не дожидаясь спора.</p></div>", "r": []}, {"t": "Связи с другими", "a": ["S03", "PS-0192-S03", "PS-0192--svyazi-s-drugimi"], "h": "<p>Часть Семи грехов. Остальные шесть, с их способностями по состоянию на 2025-01-23 (284176) и на каталог 2025-01-24 (284278): Похоть — контроль разума с ограничением, то есть повысить какое-то чувство, вызвать галлюцинации или наоборот понизить какое-то чувство; Чревоугодие — поглощение; Алчность — «поглощений чужой манный или объектов», в каталоге «всё моей»; Лень — телекинез («типа лень чё то делать вот и телекинез») плюс владение магией ветра, «как никак они связаны», в каталоге «контроль территории»; Гнев — сила; Зависть — «Полной перевоплощение тому кого завидуешь, под полный подразумевается полной копирование сил, магии, одежды, внешность но не характера».</p>\n<p>Соотношение сил с благословенными задано Славой в конце разбора (284276): «Но не забывай 7 грехов сильней благословенный и чтобы убить одного греха в максимум надо 3 благословенных именно Бога А для остальных благословенных надо будет 5».</p>\n<p>Выше грехов стоит глава организации: грехи «слабей главы этой организации» (284175). Рядом с грехами в той же реплике названо божество.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S04", "PS-0192-S04", "PS-0192--kak-menyalsya"], "h": "<p><strong>2025-01-23 (id 284175–284177).</strong> Гордыня заведена в общем списке грехов со способностью «слово закон с ограничением».</p>\n<p><strong>2025-01-24, утро (id 284255–284276).</strong> Слава открывает вопрос заново: «Греху гордыни какая способность» (284255) — и объясняет, чем его не устраивает прежний вариант: «Типо слова закон, че то я не могу представить битву» (284256). Миколай отвечает «выход за предел» (284257) и обещает объяснить позже (284259). Через несколько минут раскрывает: гордость силой, отрицание ограничений тела, сброс биологических ограничителей ценой последующих травм (284271), обещает найти и прислать список ограничителей (284272) и присылает его (284274).</p>\n<p>Слава оценивает: «Ну пока звучит плохо» (284273). Миколай после этого сам понижает статус предложения: «ну можно как одна из его особенностей но не основная» (284275).</p>\n<p><strong>2025-01-24, id 284278.</strong> Каталог персонажей — благословенные, враги, семь грехов. Гордыня стоит строкой «Гордыня 👑», без способности в скобках. То есть к моменту сведения каталога вопрос так и не был закрыт.</p>", "r": []}, {"t": "Отклонённые и незакреплённые варианты", "a": ["S05", "PS-0192-S05", "PS-0192--otklonennye-i-nezakreplennye-varianty"], "h": "<ul>\n<li>«Слово закон с ограничением» — первый вариант, забракован Славой по причине «че то я не могу представить битву».</li>\n<li>«Выход за предел» / сброс биологических ограничителей — второй вариант, оценён как «пока звучит плохо» и самим Миколаем переведён в статус «одна из его особенностей но не основная».</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0192-S06", "PS-0192--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Основная способность Гордыни так и не выбрана: оба предложенных варианта отклонены или понижены в статусе, в каталоге место пустое.</li>\n<li>Что означало «с ограничением» в формулировке «слово закон с ограничением» — не объяснено.</li>\n<li>Как именно должен работать «выход за предел» в бою, какова длительность и насколько тяжелы «такие травмы» — не проговорено.</li>\n<li>Внешность, характер, происхождение, имя персонажа отдельно от названия греха — в переписке нет.</li>\n<li>Что за «глава этой организации», слабее которого грехи, и что за «божество», названное рядом с ними («помнишь его»), в этих сообщениях не раскрывается.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0192--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0002.html\">Семь грехов</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0002.html\">Семь грехов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0192--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-01-23</td>\n<td>284175–284177</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-24</td>\n<td>284255–284276</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-24</td>\n<td>284278–284279</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0192-gordynya.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0192--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0192.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0192-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0192/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дороже всего — каталоги: <code>SL-0051</code> «Каталог: благословенные, враги, грехи, оружие, артефакты» (шесть ссылок, статьи нет, 9 834) и <code>SL-0053</code> «Список персонажей вселенной» (шесть ссылок, статьи нет, 20 313). Статья кончается 2025-01-24 пустым местом в скобках — а строка «Гордыня 👑» после этого переезжает из редакции в редакцию ещё четыре раза, дословно и без способности: 2025-01-27 (284858), 2025-01-28 (285519–285551), 2025-02-25 (295556), 2025-03-06 (298846). И в последней из них, id 298854, Слава пишет: «Грехи нужно убрать, а то тупо», Миколай следом: «ну просто в сюжет не совсем входят». То есть вопрос не просто остался открытым — через полтора месяца семёрку сняли с доски целиком, и ни одна статья грехов об этом решении не знает. На <code>SL-0051</code> ссылаются статьи о Похоти, Чревоугодии, Лени, Зависти, Семи грехах и Божестве; <code>PS-0192</code> на каталог не ссылается, хотя единственное свидетельство о пустом месте взято именно оттуда.</p>\n<p>Второе — <code>SP-0162</code> «Гордыня (грех)»: 7 454 знака базы, статьи нет, ноль ссылок. У остальных шести способность вынесена в собственную статью — <code>SP-0169</code> «Контроль разума с ограничением», <code>SP-0170</code> «Поглощение», <code>SP-0171</code> «Телекинез и контроль территории», <code>SP-0172</code> «Полное перевоплощение», <code>SP-0159</code> «Алчность». У Гордыни такой статьи нет, и это прямое следствие того, что способность не выбрана: разносить нечего. Но 7 454 знака под записью лежат и не прочитаны нигде.</p>\n<p>Третье — <code>PS-0193</code> «Божество» (три ссылки, статья 6 192 при базе 4 074) и <code>PS-0185</code> «Глава организации злодеев» (две ссылки, 5 212 при 3 050). Обе фигуры названы в той же реплике 284175, которая задаёт уровень силы грехов, и у обеих база уже вычерпана до дна — статья длиннее исходного куска. За ними только архив.</p>\n<h3>С чего начать</h3>\n<p>В базе по самой Гордыне брать нечего: статья 8 885 при базе 8 262. Адреса два.</p>\n<p>Первый — <code>SP-0162</code> (7 454, статьи нет): единственный непрочитанный кусок про этот грех.</p>\n<p>Второй — архив, в обе стороны от окна w0072. Назад: Слава пишет «7 грехов и божество ( помнишь его)» — значит божество вводилось раньше 2025-01-23 и в другом разговоре; искать до 284175, и заодно там же должна найтись «эта организация», чей глава сильнее грехов. Вперёд: между 284279 и 298857 строка про Гордыню перекладывается четырежды, и смотреть надо не сами списки (они в базе есть), а разговор вокруг каждой перекладки в w0073, w0077 и w0079 — не всплывала ли способность там.</p>\n<h3>Как развивалось</h3>\n<p>Заявили 2025-01-23 (284176) одной строкой в общем списке: «слово закон с ограничением». Через сутки сами и забраковали, с причиной: «Типо слова закон, че то я не могу представить битву» (284256). В тот же час заменили — «выход за предел» (284257), раскрыли через сброс биологических ограничителей, прислали список ограничителей из четырёх пунктов (284271, 284274). Ещё через несколько минут оценили: «Ну пока звучит плохо» (284273), и автор предложения сам понизил его в статусе: «ну можно как одна из его особенностей но не основная» (284275). В тот же день свели каталог (284278) и оставили место пустым. Не возвращались: в четырёх следующих редакциях строка переносится неизменной, а 2025-03-06 весь блок грехов убирают. Весь цикл — двое суток; всё, что после, — перенос одной и той же незаполненной строки.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Цена. У Гордыни она названа в одной фразе со способностью: «он легко способен сбросить естественные биологические ограничители, но после такие травмы получить». У остальных шести в обоих списках — и в 284176, и в каталоге 284278 — способность стоит без всякой платы: сила, контроль разума, поглощение, полное копирование, телекинез, «всё моей». Сказано ли, что у них цены нет, или её просто не проговорили, — нигде. При этом мера силы посчитана подробно и с числами: три благословенных Бога на одного греха, пять обычных. Меры расплаты нет ни у кого, кроме единственного греха, у которого нет способности.</p>\n<h3>Отклик</h3>\n<p>Зацепило пустое место в каталоге. Шесть строк со скобками — и одна «Гордыня 👑», корона без содержимого. Из всех способов записать «мы не договорились» этот самый выразительный, и вышел он случайно. Ещё в двух репликах хорошо виден рабочий критерий: Слава отвергает «слово закон» не потому, что скучно звучит, а потому, что «не могу представить битву» — требование конкретное, проверяемое и, судя по остальным грехам, работающее постоянно. А второй вариант любопытен ровно тем, чем не подошёл: «выход за предел» — единственная заявка в семёрке, которая ничего не добавляет носителю, а только снимает у него предохранители, и платит он собой. Для греха гордыни это точнее всего, что стоит в скобках у остальных шести; человек, придумавший это, отступил от собственной идеи через полчаса, не дожидаясь спора.</p></div>", "r": []}];</script>
