<script>const BASE="";const DOCNAME="Сергей";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0345-S01", "PS-0345--proishozhdenie"], "h": "<p>Персонаж введён 2026-02-08 (окно w0116, сообщения 430010–430013) сразу вместе с текстом истории «Чёрное озеро», которую Слава выложил четырьмя сообщениями подряд. Отдельного обсуждения персонажа до текста или после текста в переписке нет: имя, положение в деревне, характер и травма появляются внутри самой прозы. Версия одна.</p>\n<p>Сергей — рассказчик «Чёрного озера»; повествование идёт от первого лица, и всё, что о нём известно, известно из его собственной речи. Имя названо не автором, а другим персонажем — Мишкой, в диалоге: «а Сергей ты чтоль?» (id 430010).</p>\n<p>В деревне он человек новый. Это сказано трижды, разными поводами: «Не со всеми успел познакомиться» — о мужике, который остановил толпу; «я так как недавно здесь обоснавался не привык к лесу этому»; «Я конечно не всех там знаю, но такого там явно не было» — об утреннем незнакомце. Откуда он переехал и что именно делает — не сказано; сказано только, что он весь день работал: «Устал же я всё же, пока весь день работал».</p>\n<p>Начало истории застаёт его после рабочего дня, с одним желанием: «Знаете после работы под летним жарким солнцем. Мне нужно просто отдохнуть. Окунуться в холодную воду, чтобы холод колол мою кожу, заставил горячую голову шуметь. Чтобы наконец-то прийти в себя и воскреснуть».</p>\n<p>Вместо этого он идёт в лес с толпой мужиков, вооружённых вилами, топорами и фонариками (у местного охотника — двустволка); у самого Сергея в руках «увесистый топорик». Причина, по которой он там оказался, названа прямо и без героики: «И они просто толпой мимо моего забора прошли и начали созывать и выкрикивать дружной толпой разные слова, что хрень пойми, о чем они. Ну и я дурак подался коллективному помешательству и пошёл за ними». Он и сам понимает, что мог не идти: «Да уж получается я мог не идти. Думаю, чтобы преступника поймать этой толпы хватит вполне себе». Удерживает его только неловкость: «Сейчас уже поварачивать назад по-дурацки будет».</p>\n<p>Обстоятельств происходящего он не знает и узнаёт их по ходу, расспрашивая Мишку: в деревне с двух часов дня нет электричества и не ловит связь, уехавшие в город мужики не вернулись, а на внука Любки кто-то напал и полоснул руку — по словам Володи, который бинтовал, задеты нервы и «пацан больше не сможет, как прежде рукой махать». Нападавший неизвестен, известно только, что «в лес убежал»; сам пострадавший говорит, «что чудовищя какой», и ему никто не поверил. Реакция Сергея на всё это: «А я задумался, как так-то. На кого-то напали, а я только сейчас узнаю».</p>", "r": []}, {"t": "Характер", "a": ["S02", "PS-0345-S02", "PS-0345--harakter"], "h": "<p>Голодный и уставший. Голод проговаривается прямо посреди похода: «а я мог остаться и чай попить, у меня же там ещё и сладости завалялись, и бутерброд можно было бы сделать добавив больше колбасы.... Сука есть охота».</p>\n<p>Неуклюжий в лесу и знающий это за собой: «И раза четыре спотыкался и мордой в землю падаю. Ещё эти блять ветки, который впереди идущий натягивают и отпускають прям мне в лицо». Отдельно фиксируется, что чужая неуклюжесть его успокаивает: «Возможно будь я единственным таким неуклюжим моя бы самооценка упала бы. Но благо я такой не один».</p>\n<p>Лес он отчётливо не любит, и это сказано два раза подряд: «После этого с рублю этот лес нахрен» и «Да уж отношения с лесом у меня точно будут плохими». Описание леса даётся через сравнение с деревней: «Густой, что даже яркий звезды закрывает. А в деревне звезды горят в разы ярчее, чем в городах».</p>\n<p>Наблюдательный: сначала ему кажется, что мужики идут уверенно — «А мужиком хотьбы хны. Идут деловита обступая корни деревьев», — но, приглядевшись, он замечает обратное: «Да и если приглядеться всё здесь не так уверенно идут, как мне показалось изначально. Устали видимо, как и я». Он же отмечает, что Васька «как видимо успевший притронуться к рюмке», а Мишка «чё-то нервный. трясется и оглядывается на любой шолох».</p>\n<p>Решение толпы возвращаться домой он встречает без возражений: «Я же лишь внутренний ликовала».</p>\n<p>В опасности его первая реакция — замереть и не выдать себя. При виде чудовища: «Я же замер с толпой и даже моёй дыхания остановилась, я боялся хоть малейшим писком оборвать такой хрупкий мир». Во время бегства он не зовёт на помощь, хотя знает, какими словами звал бы: «Можно было бы крикнуть \" Эй мужики суки меня подождите\" Но сука страшная. Страшная выдать себя, а ещё в горле мерзкая липкая субстанция, что не даёт издать звуков».</p>\n<p>Думает о вариантах спасения по ходу бега и сам их отбраковывает: «Можетъ на дерева залесть. Нет он его лёгким движением повалит». Про бег: «надо что-то делать если продолжу бежать просто вы бьюсь из сил и заплутаю».</p>\n<p>Ирония у него не пропадает даже в самые тяжёлые моменты. На собственную сломанную ногу: «Где-то я гнида слышал, что боль помогает прийти в себя. Ну блять идти те суда давайте это обсудим. Насколько же боль может привести в себя». На толпу, с которой шёл: «проклинай весь это недоотряд героем мать его».</p>\n<p>Отдельно прописан внутренний монолог, когда он лежит закопанный и успокаивается. Он дан списком коротких мыслей в кавычках: «Это вообще рельно?», «Чудовище в лесу», «Хруст и чавканье», «Может..», «Если предположить», «Я что сошёл с ума», «Или это плата за грехи», «Но я же не виновен?», «Я не хотел», «И что дальше», «Как я со сломанной ногой дойду до деревни?». За что именно могла бы быть «плата за грехи» и в чём он «не виновен» — в переписке не сказано.</p>\n<p>Утром, когда рядом оказывается незнакомый человек, Сергей ведёт себя как загнанный: хватает ветку и машет ею вокруг себя с мыслью «может это чудовищя», требует «отвечай кто ты. Ты же не из местных, а значит замаскировался сука!».</p>", "r": []}, {"t": "Связи с другими", "a": ["S03", "PS-0345-S03", "PS-0345--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Мишка</strong> — «близкому приятелю в этой деревне». Через него Сергей узнаёт, что вообще происходит: свет, связь, уехавшие в город, раненый внук Любки. Мишка в лесу нервничает больше остальных: «дрожащий словно осиновый листь Мишка». Что с ним стало после появления чудовища — не сказано.</li>\n<li><strong>Васька (<a href=\"PS-0346.html\">Васька</a>)</strong> — пьяный старый мужик, о котором Сергей знает только, что у него «вроде как не всё дома в голове». Именно Васька его вытаскивает: тащит за руку, скидывает в ямку и забрасывает землёй, травой и ветками. При этом Сергей, услышав чей-то топот, надеялся на кого угодно другого: «Блять кто бы ты не был сука помоги. Спасибо. Мои молитвы услышали» — и, разглядев Ваську, реагирует так: «И блять нет, не услышали меня боги».</li>\n<li><strong>Старый охотник с двустволкой</strong> — единственный, кто действует при встрече с чудовищем: «Это был старый охотник, что перекинув ружьё стрельно прямо в морду чудовищу. А дальше начался хаос». Имени в тексте нет, только «старик с ружьём».</li>\n<li><strong>Чудовище</strong> — «существо под два метра ростом и также в ширене. Покрытой черной шерстью. Он был без шее. То есть голова и сразу плечи. Глаза его горели оранжоаым огнем. А в своей массивной руке он держал раздавленную голову». Прямой выстрел в голову ему нипочём. С Сергеем оно не сталкивается напрямую — Сергей от него бежит.</li>\n<li><strong>Незнакомый мужчина</strong> — «высокий и подтянутый мужчина в делай рубашке и в чёрных джинсах. Явно не с деревни». Утром мочится на закопанного Сергея, не заметив его, потом предлагает сделать шину: «эй! Не знаю, что произошло но тебе лучше шину сделать. Нога у тебя кажись сломанная». На обвинение в маскировке искренне хохочет и говорит последнюю реплику текста: «ты меня с водеными перепутал кажись?». Имени не получает.</li>\n<li><strong>Внук Любки, Володя</strong> — упоминаются только в пересказе Мишки, с Сергеем не встречаются.</li>\n<li>Сергей числится частью истории <strong>«Чёрное озеро»</strong>.</li>\n</ul>", "r": [["Васька", "PS-0346.html"]]}, {"t": "Как менялся — состояния по датам", "a": ["S04", "PS-0345-S04", "PS-0345--kak-menyalsya"], "h": "<p><strong>2026-02-08 (id 430010–430013), окно w0116.</strong> Единственная версия. Персонаж введён целиком за один заход, внутри текста истории: имя, положение новичка в деревне, усталость и голод, мотив «пошёл по инерции», поведение при встрече с чудовищем, перелом ноги, прокушенная рука, ночь в яме, утренняя встреча с незнакомцем. Переработок, споров о нём или альтернативных вариантов в переписке нет.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S05", "PS-0345-S05", "PS-0345--chto-s-nim-stalo"], "h": "<p>К концу выложенного текста Сергей жив. Состояние на утро: левая нога сломана — он провалился в яму на бегу, услышав «сука знакомый звук.... Хруст..»; нога после этого «бессильно висит словно культяпка», крови он не заметил («Ну крове вроде нет. Хотя я хрень знает, не видна не зги»). За ночь она не зажила: «И конечно же нога не исцелилась, каким то образом за ночь. И боль прошибло мою макушку. Из-за чего я упал и схватившись за ногу начал даже не орать, а стонать».</p>\n<p>Вторая травма — своя собственная: чтобы не закричать, пока Васька его тащит, он кусает себе свободную руку: «Крепко я вцепился зубами в кисть, что через мгновения в рот полелась горячая жидкость. Но я этого не заметил продолжая кусать себя». До этого он один раз всё-таки сорвался на крик — «СУКА Стой!» — и сам счёл, что этим их выдал: «Но блять поздно, всё спалили нас 100 процента».</p>\n<p>Ночь он проводит закопанным в ямке под землёй, травой и ветками, замерзая («до этого незамечаемый холод начал просачиваться через одежду»), и засыпает от усталости. Ничего за эту ночь не происходит.</p>\n<p>Текст обрывается на реплике незнакомца «ты меня с водеными перепутал кажись?». Продолжения в переписке нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0345-S06", "PS-0345--probely"], "h": "<div class=\"gaps\"><ul>\n<li><strong>Внешность не описана вообще.</strong> Ни возраста, ни роста, ни одежды, ни лица. Всё, что есть, — что он неуклюж в лесу и что комары «Всю шею искусали и как будто даже волосы».</li>\n<li><strong>Фамилии нет.</strong></li>\n<li><strong>Профессия не названа.</strong> Сказано только, что он весь день работал под солнцем.</li>\n<li><strong>Откуда он переехал в деревню и когда именно — не сказано,</strong> только «недавно здесь обоснавался».</li>\n<li><strong>Семьи, дома, прошлого нет.</strong> Из его быта названы забор, чай, сладости и колбаса на бутерброд.</li>\n<li><strong>«Плата за грехи» и «я не виновен?»</strong> — мысли брошены без пояснения; за что он мог бы платить, в переписке не сказано.</li>\n<li><strong>Само Чёрное озеро в тексте не появляется.</strong> Оно есть в заголовке и в привязке персонажа, но в выложенных сообщениях озера нет.</li>\n<li><strong>Кто такие «водяные»,</strong> за которых незнакомец предположительно принят, — не объяснено; текст обрывается на этой фразе.</li>\n<li><strong>Судьба после утренней сцены неизвестна,</strong> продолжения истории в переписке нет.</li>\n<li><strong>Способностей у него не описано</strong> — ни одной; в выложенном тексте он обычный человек.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0345--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0346.html\">Васька</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0346.html\">Васька</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0345--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-02-08</td>\n<td>430010–430013</td>\n<td>w0116</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0345-sergey.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0345--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0345.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
