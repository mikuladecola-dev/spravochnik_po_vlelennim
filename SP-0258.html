<script>const BASE="";const DOCNAME="Хромакей";
const LEAD="";
const CH=[{"t": "Носители", "a": ["S01", "SP-0258-S01", "SP-0258--nositeli"], "h": "<p>Способность закреплена за Радугой — одним из Пастырей. Названа она была в тот же заход, что и сами имена Пастырей: Миколай перечислил «триколор / радуга / градиент / монохром», а следующей репликой добавил «и у кого-то способность хромокей», после чего сам же ответил на свой вопрос — «у радуги» (2025-12-17, id 399541–399543).</p>\n<p>Написание имени способности в переписке — «хромокей»; в карточке сущности оно зафиксировано как «Хромакей», второе написание отмечено как вариант имени.</p>\n<p>Кроме Радуги носители не названы. Из формулировки «и у кого-то способность хромокей» видно, что изначально носитель не был определён и подбирался на месте.</p>", "r": []}, {"t": "Как менялась по версиям", "a": ["S02", "SP-0258-S02", "SP-0258--kak-menyalas-po-versiyam"], "h": "<p>Версия одна.</p>\n<p><strong>2025-12-17 (id 399541–399545, окно w0114).</strong> Способность названа и отдана Радуге. Тем же заходом идёт реплика «то есть сразу в сюжете будет монстром» (id 399545) — к кому или к чему она относится и что означает применительно к хромакею, в переписке не объяснено.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S03", "SP-0258-S03", "SP-0258--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Хромакей возник внутри перечня имён Пастырей — «триколор / радуга / градиент / монохром». Связей с другими конкретными способностями в переписке не названо.</p>", "r": []}, {"t": "Пробелы", "a": ["S04", "SP-0258-S04", "SP-0258--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Механика не раскрыта: как именно работает хромакей — не сказано.</li>\n<li>Ограничения и цена не обсуждались.</li>\n<li>Реплика «то есть сразу в сюжете будет монстром» осталась без пояснения — связь с хромакеем не проговорена.</li>\n<li>Разночтение «хромакей / хромокей» в переписке не разбиралось, окончательное написание не выбрано.</li>\n<li>К способности возвращались один раз, за одну минуту разговора; продолжения нет.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0258--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0079.html\">Пастыри</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0258--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-12-17</td>\n<td>399541–399545</td>\n<td>w0114</td>\n<td>Феня (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0258-hromakey.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0258--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0258.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
