<script>const BASE="";const DOCNAME="История про мотылька";
const LEAD="";
const CH=[{"t": "Содержание", "a": ["S01", "IS-0022-S01", "IS-0022--soderzhanie"], "h": "<p>История про мотылька — один из текстов, написанных Миколаем к 2024-08-08. Самого текста в переписке нет; есть упоминание о его существовании и короткий обмен о жанре (окно w0050).</p>\n<p>О содержании известно только одно: на реакцию Славы, что история звучит страшно, Миколай отвечает — «романтика, ахахах» (2024-08-08, id 215938).</p>", "r": []}, {"t": "Персонажи", "a": ["S02", "IS-0022-S02", "IS-0022--personazhi"], "h": "<p>В переписке не названы. Мотылёк упоминается только в названии истории, персонажем он назван не был.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "IS-0022-S03", "IS-0022--mesto-vo-vselennoy"], "h": "<p>Отнесена ко вселенной «монстры» по дате объявления. Упомянута в одном ряду с историей про трубадура — обе названы Миколаем как недавно написанные (id 215933–215934).</p>", "r": []}, {"t": "Состояние", "a": ["S04", "IS-0022-S04", "IS-0022--sostoyanie"], "h": "<p>На 2024-08-08 история существует как написанный текст. Дважды за один вечер она попадает в разговор.</p>\n<p><strong>2024-08-08, вечер, id 215933–215943.</strong> Миколай перечисляет недавно написанное: «и ещё историю про трубадура написал», «и про мотылька». Слава реагирует: «Вот его надо страшно звучит». Миколай: «романтика, ахахах». Дальше в этом же куске идут реплики Славы «0», «Самое страшное что есть на свете», «Нулевой». Разговор здесь идёт двумя переплетёнными линиями — параллельно Миколай спрашивает «как у тебя с арсом общение», и какие из этих коротких реплик относятся к историям, а какие к вопросу про общение, из текста однозначно не следует.</p>\n<p><strong>2024-08-08, 21:32–21:33, id 216076–216082.</strong> Миколай предлагает почитать свои истории — «ну которые те», «о которых говорил». Слава из предложенных выбирает одну: «Мотылек».</p>\n<p>Прочитал ли Слава историю и что сказал после — в переписке не сказано.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "IS-0022-S05", "IS-0022--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Текста истории в окне нет.</li>\n<li>Сюжет не изложен вообще: известен только жанр со слов автора («романтика») и первая реакция на название («страшно звучит»).</li>\n<li>Персонажи не названы.</li>\n<li>Не сказано, чем история связана с историей про трубадура, кроме того что обе упомянуты подряд как недавно написанные.</li>\n<li>Реакция Славы после чтения осталась незафиксированной.</li>\n<li>Соотношение реплик «0» / «Самое страшное что есть на свете» / «Нулевой» с историей про мотылька и с вопросом про общение осталось нерешённым.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["IS-0022--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в историях:</strong> <a href=\"IS-0020.html\">История про цветы, воспитание и романтику</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["IS-0022--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-08</td>\n<td>215933–215943</td>\n<td>w0050</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-08-08</td>\n<td>216076–216082</td>\n<td>w0050</td>\n<td>монстры (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/istorii/IS-0022-istoriya-pro-motylka.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["IS-0022--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/IS-0022.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
