<script>const BASE="";const DOCNAME="Орден по убийству котов";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0058-S01", "GR-0058--chto-eto"], "h": "<p>Орден по убийству котов — организация вселенной Оам, заявленная Славой одной строкой: «Так же появиться орден предназначеный для убийства котов» (2025-11-17, id 385768). Строка стоит внутри длинного перечня рас и организаций мира и произнесена дословно ещё раз почти через три недели (2025-12-06, id 393287) — тем же списком, без единого изменения.</p>\n<p>Название в справочнике — рабочее, собранное из самой строки. В переписке орден собственного имени не имеет; встречаются варианты записи «Орден для убийства котов» и «орден предназначеный для убийства котов».</p>\n<p>Это группа по замыслу — именно орден, то есть объединение людей или существ, а не отдельный персонаж. Но всё, что о нём известно, — цель и время появления. Ни одного участника, основателя, численности, базы, ни одной способности в переписке не названо. Соавторы к строке ни разу не возвращались: в обоих окнах она проходит мимо и не обсуждается, Миколай на неё не отвечает.</p>\n<p>Отдельно стоит отметить время глагола: орден описан не как существующий, а как тот, который «появиться». На момент обеих реплик в мире его ещё нет — это будущая структура вселенной, заявка на события, которых в переписке ещё не было.</p>\n<p>В базе запись проходит по виду «мир» (<a href=\"MR-0175.html\">Орден по убийству котов</a>), хотя по содержанию это организация.</p>", "r": [["Орден по убийству котов", "MR-0175.html"]]}, {"t": "Отношения с другими группами", "a": ["S02", "GR-0058-S02", "GR-0058--otnosheniya-s-drugimi-gruppami"], "h": "<p>Единственное названное отношение — цель. Орден предназначен для убийства Котов (<a href=\"PS-0307.html\">Коты</a>).</p>\n<p>Коты в той же реплике описаны так: «Коты. Их 9.они сильнеший ( уникальный особенности, я для них не придумал помоги) и вот они есть в каждую эпоху. Если один кот умрёт родиться новый и всегда их будет 9. Они вообще никуда не вмешиваться» (2025-11-17, id 385768; дословно повторено 2025-12-06, id 393287). То есть орден нацелен на верхушку силовой иерархии мира — на тех, кто сильнее всех остальных и при этом ни во что не вмешивается.</p>\n<p>Позже Коты дополняются, но орден при этом не упоминается:</p>\n<ul>\n<li>(2025-12-04, id 392486, 392489) «Коты наверное буду типо духами. Будут чисто из Оэм состоять.» и «Поэтому запас и понимания Оэм у них больше всех».</li>\n<li>(2025-12-06, id 393315) повтор той же мысли: «Кстати коты будут типо, что-то духов. То бишь они будут состоять из Оэм. Из-за этого понимания, объём и контроль Оэм у них выше чем у любого.»</li>\n<li>(2025-11-17, id 385774–385775) «Кстати нуар один из котов», «Помнишь нуара. Сильнеший из 7 островов». Значит, среди мишеней ордена — Нуар. В переписке это нигде не сведено вместе: что орден охотится в том числе на Нуара, авторы не проговаривают.</li>\n</ul>\n<p>Место ордена в иерархии сил мира задано только положением строки в перечне. Список построен так: сначала Коты — сильнейшие; затем «Апостолы 21 вторая по силе раса на земле»; затем «Ну и дальше расы и организации который равны по силе с друг другом» — и уже после этой фразы идёт перечисление, в котором находится и орден. Рядом с ним в том же ряду перечислены Дети мирового древа, «Проротой каменный челике», Азуриэль, группировка сестры (дочери Имитатора), «Правителская организации по контролю всех этих», церковь с паладинами, организация Виктора, Пернатые, вампиры-аристократы, Аскизы. Прямо о силе ордена не сказано ничего — только то, что он стоит в общем ряду равных по силе.</p>\n<p>Союзов, конфликтов и связей ордена с любой из этих организаций в переписке нет. Кто орден создал и кто ему противостоит — не сказано.</p>", "r": [["Коты", "PS-0307.html"]]}, {"t": "Как менялась — по датам", "a": ["S03", "GR-0058-S03", "GR-0058--kak-menyalas"], "h": "<p><strong>2025-11-17, окно w0109 (id 385768–385769).</strong> Орден появляется в перечне рас и организаций мира одной строкой: «Так же появиться орден предназначеный для убийства котов». Никаких подробностей. Миколай в этом месте не отвечает — разговор идёт дальше по списку (следующая реплика Славы: «Ну и Аскизы. Я не знаю где они живут»).</p>\n<p><strong>2025-12-06, окно w0112 (id 393286–393290).</strong> Слава заново скидывает тот же список целиком — дословно, включая строку об ордене, без правок и без добавлений. За списком идёт «Давай вспомним» и «В нашем мире Оэм уже существует много сторон для конфликта». То есть на второй заход список подан как сводка уже придуманного, орден в ней — одна из «сторон для конфликта», но и здесь он не разворачивается.</p>\n<p>Дальше в этом же окне разговор уходит в разбор злодеев (id 393301–393316): промежуточные злодеи — Дети мирового древа, клан крылатых, церкви, иногда люди, Виктор; два основных — дочь Имитатора (Имита) и Бог красок. Орден среди злодеев не назван и вообще не упоминается. На вопрос Миколая «котов?» и «червивоглазых?» (id 393310, 393312) Слава отвечает про сестру и Бога красок — то есть Коты в злодеи не идут, и вопрос об их противниках не поднимается.</p>\n<p><strong>2025-12-17, окно w0114 (id 399583).</strong> В списке того, что предстоит придумать, Слава пишет: «Роль Котов во всей этой фигней». Роль Котов на эту дату остаётся незакрытой задачей; орден в списке задач не упомянут.</p>\n<p><strong>2026-02-06 — 2026-02-07, окно w0115.</strong> Миколай собирает по ОЭМ документ через нейросеть (id 429348, 429804–429809). В сводку, которая приводится в переписке (id 429376–429377), попадает материал по вселенной «Семь островов», а не по Оэм; Слава замечает: «Че то мало информация оказывается о ОЭМ» (id 429386), Миколай отвечает «ой, ч не все чет кинул видимо» (id 429387) и позже «я еще пару раз лоханулся и не скинул всё прям» (id 429807). Орден в сводке не фигурирует.</p>\n<p>Итог по версиям: за всё время задумка не менялась. Есть одна формулировка и её дословный повтор. Отклонённых вариантов тоже нет — предлагать было нечего.</p>", "r": []}, {"t": "Пробелы", "a": ["S04", "GR-0058-S04", "GR-0058--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет. Ни одного участника не названо, список members пуст.</li>\n<li>Основатель не назван. Кто создал орден и по чьей инициативе — в переписке не сказано.</li>\n<li>Численность не названа.</li>\n<li>База, местоположение, эпоха появления — не названы. Сказано только, что орден «появиться», то есть на момент реплики его ещё нет; когда именно — не уточняется.</li>\n<li>Общих способностей группы в переписке нет. Чем орден собирается убивать существ, которые описаны как сильнейшие в мире, не обсуждается.</li>\n<li>Различий между участниками нет — участников нет.</li>\n<li>Внутренней иерархии нет: ни главы, ни рангов, ни степеней.</li>\n<li>Мотив не назван. Почему орден хочет убить Котов — при том что Коты «вообще никуда не вмешиваться» — не объяснено.</li>\n<li>Не обсуждается, как задача ордена соотносится с правилом «Если один кот умрёт родиться новый и всегда их будет 9».</li>\n<li>Не сказано, знает ли орден, что Нуар — один из Котов, и вообще связаны ли эти две линии.</li>\n<li>Отношений с другими организациями мира нет: ни союзов, ни врагов, ни упоминания ордена кем-либо ещё.</li>\n<li>Уникальные особенности самих Котов — цели ордена — тоже не придуманы. Слава дважды помечает это прямо в тексте: «уникальный особенности, я для них не придумал помоги». Ответа на просьбу в окнах нет.</li>\n<li>Реакции Миколая на орден нет ни в одном из двух окон.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0058--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0307.html\">Коты</a></li>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0175.html\">Орден по убийству котов</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0058--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0058.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0058-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0058/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — <code>PS-0307</code> Коты. Четыре ссылки (<code>PS-0324</code>, <code>PS-0308</code>, <code>PS-0104</code>, эта статья), статья 9 943, база 13 340 — и внутри прямое признание, что середины нет: «уникальный особенности, я для них не придумал помоги», повторённое дословно через три недели. Пока у Котов нет особенностей, у ордена нет описуемой задачи, у <code>PS-0104</code> Нуара (3 ссылки, база 49 571) висит незакрытая принадлежность к девятке, а <code>GR-0057</code> нечем отличать от <code>PS-0307</code>. Одна незаполненная скобка держит четыре статьи.</p>\n<p>Второе — двойник. Тот же орден лежит вторым кодом <code>MR-0175</code>, по виду «мир»: 4 ссылки, статья 5 819, база 8 026. Ссылаются на него <code>MR-0170</code>, <code>GR-0057</code> и эта статья — то есть все входящие собрались на записи, которая по содержанию организацией не является. У одной строки переписки два кода и две статьи, и ни в одной нет ничего сверх этой строки.</p>\n<p>Третье, крупнейшее во вселенной вообще: <code>SL-0054</code> «Список 12 апостолов» — 7 ссылок, статьи нет, 234 052 знака базы. Это самый дорогой незакрытый узел Оама; ордена он не касается напрямую, но соседей ордена по перечню — касается всех.</p>\n<h3>С чего начать</h3>\n<p>В базе. Материал ордена лежит не под орденом: <code>MR-0175</code> (8 026) — это целиком перечень рас и организаций от 2025-11-17, где орден одна строка из полутора десятков. Вторая запись — <code>SL-0125</code> «Список нерешённых вопросов по миру Оэм»: 1 ссылка, статьи нет, 3 899 знаков, окно w0112. Там лежит заявка Славы «мне нужна цель и мотивация двух сильнейших за мир и цель и мотивация двух сильнейших злодеев» (id 393316) и обещание Миколая «напишу в 19 примерно чет придумал или нет» (id 393320). Проверять надо, чем это кончилось: id после 393490, тот же вечер.</p>\n<p>В архив — за двумя окнами. 2025-12-17, w0114, id 399583 и дальше: в списке задач стоит «Роль Котов во всей этой фигней», и там же должно быть видно, попала ли туда цель ордена или её сознательно не записали. И 2026-02-06/07, w0115: Миколай признаёт, что скинул нейросети не весь материал — «я еще пару раз лоханулся и не скинул всё прям» (id 429807), Слава замечает «Че то мало информация оказывается о ОЭМ» (id 429386). Что именно не дошло — ищется там, и это единственное место, где может обнаружиться ещё один заход на перечень.</p>\n<h3>Как развивалось</h3>\n<p>Заявили 2025-11-17 одной строкой внутри перечня; ответа не последовало. Повторили 2025-12-06 дословно, без единой правки, уже как сводку «сторон для конфликта». Ограничивать не пришлось — ограничивать нечего. Не возвращались ни разу: в разборе злодеев того же окна (id 393301–393316) ордена нет, в списке задач 2025-12-17 нет, в февральской сводке 2026 нет. При этом цель ордена за то же время дополнялась трижды — Коты как духи из Оэм (id 392486, 392489, 393315), — и ни в одной из трёх реплик орден не назван.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>В перечне от 2025-11-17 сила Котов объяснена устройством: они состоят из Оэм, поэтому «понимания, объём и контроль Оэм у них выше чем у любого». Это причина, а не место в таблице. Для соседних позиций того же перечня причина не названа ни разу. Апостолы объявлены «вторая по силе раса на земле» — откуда сила, не сказано; всё, что ниже, задано одной фразой «расы и организации который равны по силе с друг другом», то есть рангом. Правило «сила есть отношение к Оэм» проговорено ровно для верхней строки списка и не проговорено ни для одной из следующих, включая ту, в которой стоит орден.</p>\n<h3>Отклик</h3>\n<p>Сильное здесь одно, и оно, похоже, вышло случайно: орден описан будущим временем. Не «есть орден», а «появиться орден» — в перечне, где всё остальное перечислено как данность, единственная строка смотрит вперёд. Мир целиком уже стоит, а эта штука ещё только собирается случиться, и от этого она читается не как справочная запись, а как обещание. Зацепило и другое: внутри торжественного списка мироустройства дважды, слово в слово, стоит «я для них не придумал помоги» — просьба о помощи, вклеенная прямо в канон и оба раза оставшаяся без ответа. И совсем отдельно — сама идея ордена, который собирается убивать девятерых, ни во что не вмешивающихся и восполняющихся; это не проработано ни на строчку, но как жест оно смешное и мрачное одновременно.</p></div>", "r": []}];</script>
