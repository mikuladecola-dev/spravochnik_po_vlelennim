<script>const BASE="";const DOCNAME="Слияние двух измерений";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0027-S01", "MR-0027--ustroystvo"], "h": "<p>Основание мира: «ну тут я сказал что 2 измерения объединились» (Миколай, 2024-07-04, id 196070). Слияние — не фон, а событие, на которое «он на этом акцент сделал» (id 196071).</p>\n<p>За слиянием последовала война. Её срок назван Славой: «8 лет война шла» (id 196087). Миколай сначала счёл этот срок недостаточным для того, чтобы люди успели свыкнуться: «8 лет срок маленький» (id 196086) — но речь шла о разном, и Слава уточнил отсчёт: «После войны прошло 10лет» (id 196093). Миколай принял: «норм тогда», «тогда пон». Тут же добавлена оговорка: «Ну или меньше потом решим» (id 196097) — то есть 10 лет закреплены как рабочая цифра, а не как окончательная.</p>\n<p>К моменту действия порядок уже устоялся: «Там уже грубо говоря страны построены и все живут так» (id 196079), общества двух миров «вроде уже как то уживаются» (id 196069).</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0027-S02", "MR-0027--naselenie"], "h": "<p>Два происхождения жителей — современное и фэнтезийное; прямо это проговорено через состав верхушки преступной организации: «Ну это верхушка прес огр будет состоять как из современных как из фэнтези» (id 196076).</p>\n<p>Отдельно назван возраст части населения: «некоторым наверняка лет по 200» (id 196088), и следствие из этого — «они уже привыкли к одному, ма такая смена вообще не кайф» (id 196089). Слава отреагировал на это: «Ну это тоже звучит говнисто» (id 196090); Миколай ответил «но я понял о чем ты» и переспросил «поч». Прямого отказа от долгожителей в переписке нет, но и подтверждения тоже — реплика осталась с оценкой Славы и без развития.</p>\n<p>Мотивы тех, кто хочет обратить слияние, разбираются отдельно. Слава ставит вопрос: «А нафиг им повторять слияния или обратная его делать. Когда обществом 2 миров вроде уже как то уживаются». Миколай даёт три варианта:</p>\n<ul>\n<li>«может у кого-то есть чисто научный интерес» (id 196072);</li>\n<li>«может у кого-то есть отвращение к челам из иного измерения» (id 196073);</li>\n<li>«эта ненависть просто подпитывает их интерес» — «к тому чтобы обратить процесс» (id 196075, 196077).</li>\n</ul>\n<p>И общий довод про людей как таковых: «ну это же люди», «они ёбнутые», «из истории легко пронаблюдать», «царя нет, а они его ищут», «им не удобно» (id 196081–196085).</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0027-S03", "MR-0027--mesto-vo-vselennoy"], "h": "<p>Слияние — лор основания мира «7 островов». В файле указаны связи с «7 островов и их защитники», с Оазисом (<a href=\"MR-0020.html\">Оазис</a>) и с преступной организацией (<a href=\"MR-0026.html\">Преступная организация</a>).</p>\n<p>Цели преступной организации выводятся прямо из слияния: «Ну как я думал. Узнать или возможно повторить слияния. Либо сверхсущество» (id 196068). Вариант со сверхсуществом Миколай подхватывает: «тогда сверх существо» (id 196080). Верхушка организации — смешанная, из современных и из фэнтези (id 196076).</p>\n<p>Слияние заявлено и как предмет сюжетного раскрытия: «Да-да гг будет об этом узнавать как и зрителей» (id 196074) — то есть главный герой узнаёт лор одновременно со зрителем.</p>", "r": [["Оазис", "MR-0020.html"], ["Преступная организация", "MR-0026.html"]]}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0027-S04", "MR-0027--kak-menyalsya-po-versiyam"], "h": "<p>Одна версия — 2024-07-04, окно w0042, id 196068–196098. Внутри неё таймлайн уточнялся по ходу: сначала прозвучало «8 лет» (Миколай понял это как срок после слияния и назвал его маленьким), затем Слава уточнил, что 8 лет — это длительность войны, а после войны прошло 10 лет, и тут же оставил цифру открытой: «Ну или меньше потом решим».</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0027-S05", "MR-0027--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Точный срок после войны авторы решили определить позже: «Ну или меньше потом решим».</li>\n<li>Цель преступной организации не названа — обсуждение обрывается репликой «И их нея цель» (id 196098).</li>\n<li>Долгожители «лет по 200» получили оценку «звучит говнисто» и дальше не разрабатывались; отменены они или нет — в переписке не сказано.</li>\n<li>Как именно произошло слияние, кто в войне с кем воевал и чем она кончилась — в приведённом фрагменте не сказано.</li>\n<li>«Сверхсущество» названо как вариант и не раскрыто.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0027--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0020.html\">Оазис</a>, <a href=\"MR-0026.html\">Преступная организация</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0027--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-04</td>\n<td>196068–196098</td>\n<td>w0042</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0027-sliyanie-dvuh-izmereniy.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0027--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0027.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
