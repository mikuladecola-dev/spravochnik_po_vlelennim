<script>const BASE="";const DOCNAME="Гурман";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0269-S01", "PS-0269--proishozhdenie"], "h": "<p>Гурман появляется в переписке один раз — в общем реестре персонажей и сил вселенной «Апостол», который Слава выкладывает списком (2025-05-14, id 325798–325801). Реестр разбит на разделы: Апостолы, Одержимый, Враг, Церковь, Военный, Сторонние силы, Существа, Аномалии, Оружие, Артефакты, Идеи. Гурман — единственная позиция раздела «Одержимый»:</p>\n<div class=\"q\"><p>Одержимый:<br>Гурман</p></div>\n<p>Ничего, кроме имени и раздела, в переписке о нём не сказано. Ни описания, ни способностей, ни принадлежности к сюжету.</p>\n<p>Реплике со списком предшествует замечание Миколая: «ну обычно так и называют это 🌚» (id 325798) — оно относится к обсуждению перед списком, а не к Гурману.</p>", "r": []}, {"t": "Связи с другими", "a": ["S02", "PS-0269-S02", "PS-0269--svyazi-s-drugimi"], "h": "<p>По разметке базы Гурман отнесён к Благословенным. В самом тексте переписки это отнесение не проговаривается — в списке он стоит под заголовком «Одержимый».</p>\n<p>Соседние разделы реестра того же сообщения содержат четырнадцать Апостолов (среди них «Бессмертный выродок 🤪»), тринадцать позиций раздела «Враг», двух представителей Церкви, двух Военных, трёх в «Сторонних силах», пустой раздел «Существа», две Аномалии, списки Оружия и Артефактов и раздел «Идей» с единственной строкой «Чёрный ящик». Как Гурман соотносится с любой из этих позиций, в переписке не сказано.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S03", "PS-0269-S03", "PS-0269--kak-menyalsya"], "h": "<p><strong>2025-05-14 (id 325798–325801)</strong> — единственное состояние. Имя внесено в реестр в раздел «Одержимый», раскрытия нет.</p>\n<p>После списка Слава добавляет: «Он жив» (id 325800) и «Ну и нужно исправления» (id 325801). К кому относится «он», из переписки не следует; правки, о которых говорит Слава, в дальнейшем в этом окне не вносятся.</p>", "r": []}, {"t": "Пробелы", "a": ["S04", "PS-0269-S04", "PS-0269--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Кто такой Гурман, в переписке не раскрыто.</li>\n<li>Что означает раздел «Одержимый» и чем одержимый отличается от Апостола, Врага и прочих категорий реестра, не объяснено.</li>\n<li>Способности не названы.</li>\n<li>Внешность, характер, происхождение — не описаны.</li>\n<li>Связь имени «Гурман» с чревоугодием или с семью грехами в переписке не проговаривается; такое сближение было бы достройкой.</li>\n<li>Почему раздел «Одержимый» назван в единственном числе и предполагались ли в нём другие позиции — осталось нерешённым.</li>\n<li>Отнесение к Благословенным есть только в разметке, в переписке не подтверждено.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0269--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0014.html\">Одержимые</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0014.html\">Одержимые</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0269--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-05-14</td>\n<td>325798–325801</td>\n<td>w0094</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0269-gurman.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0269--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0269.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0269-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0269/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Гурман целиком висит на одной сущности: в базе у него ровно одна связь, и это <code>SL-0090</code> «Реестр персонажей и сил» — четыре ссылки, статьи нет, база 5 492. Рядом две другие копии того же каталога: <code>SL-0053</code> «Список персонажей вселенной» (шесть ссылок, статьи нет, 20 313) и <code>SL-0051</code> «Каталог: благословенные, враги, грехи, оружие, артефакты» (шесть ссылок, статьи нет, 9 834). Шестнадцать ссылок на три реестра, и ни у одного нет статьи. Это самая дорогая дыра в узле: пока реестр не описан как объект — что в нём за разделы, откуда они взялись и что значит попасть в такой раздел, — Гурман остаётся строкой без рубрики, а рубрика «Одержимый» — заголовком без определения.</p>\n<p>Второе — само слово «одержимый». Определение к нему в базе есть, и немаленькое: <code>SP-0234</code> «Одержимые» (ссылок ноль, статьи нет, база 6 663), <code>MR-0149</code> «Организации охотников на одержимых» (ноль, нет, 6 390), <code>PS-0250</code> «Одержимый с чёрными слезами» (ноль, нет, 5 605), <code>PS-0296</code> «Антиапостолы / Одержимые» (ноль, нет, 3 643). Больше двадцати двух тысяч знаков про одержимых не имеют ни одной статьи, при том что статья <code>PS-0203</code> «Одержимый» существует и материала под ней всего 4 874.</p>\n<h3>С чего начать</h3>\n<p>В базе. Три вещи, за которыми не надо в архив.</p>\n<p>Первое — счёт появлений. Статья говорит, что Гурман появляется в переписке один раз, 2025-05-14. По <code>GR-0014</code> та же двухстрочная рубрика «Одержимый: / Гурман» стоит ещё в двух копиях реестра: 2025-02-25 (id 295559) и 2025-03-06 (id 298850). То есть окон не одно, а три, и первое — w0077, а не w0094. Сверять с <code>PS-0203</code> (2025-02-25, id 295552–295560), где вокруг этой строки есть хоть какой-то разговор: «Одержимый», «Ты не забыл», «Благословенный ада», «Которых 9».</p>\n<p>Второе — определение категории. Оно в <code>SP-0234</code>, окно w0104, 2025-09-12, id 364764–364768: одержимый как аналог арбетара, сила без обучения, чаще сильнее благословенных, убийство или экзорцизм. <code>GR-0014</code> этот кусок уже перенёс и честно оговорил, что вселенная там помечена «неясно», Слава называет её просто «новая вселенная», и с «Апостолом» она в переписке не сшита. Искать нечего — надо решать, переносится ли определение на февральскую рубрику.</p>\n<p>Третье и единственное для архива: «Он жив» (id 325800). К кому относится «он», из текста не следует, а стоит эта реплика сразу после списка. Смотреть окно w0094 вокруг 325798–325810 — там же рядом «Ну и нужно исправления», и правки, о которых говорит Слава, в этом окне не появляются.</p>\n<h3>Как развивалось</h3>\n<p>25 февраля — категория объявлена отдельными репликами и в тот же вечер получает единственное имя в реестре. 6 марта и 14 мая — реестр перевыкладывается, рубрика копируется слово в слово, ничего не добавляется. 12 сентября — категория «одержимые» разворачивается полностью, с механикой, законом и организациями, но уже в переработанной вселенной, у которой нет имени, и имя Гурмана туда не переносится. Заявили — трижды скопировали без изменений — оставили — вернулись к рубрике, но не к тому, кто в ней стоял.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>В том же реестре, соседними строками, для благословенных источник силы назван прямо: сила получена от благословения. Для одержимых, стоящих следующим разделом, источник в «Апостоле» не назван ни разу — ни 25 февраля, ни 6 марта, ни 14 мая. Правило «у категории есть то, откуда взялась сила» проговорено для одного раздела и не проговорено для стоящего вплотную к нему второго. Сентябрьский демон эту дырку не закрывает: он из другой вселенной и к «Апостолу» не отнесён.</p>\n<h3>Отклик</h3>\n<p>Зацепило не самим Гурманом — про него сказать нечего, одно слово в списке, — а тем, как статья с этим словом обошлась. Имя «Гурман» под заголовком «Одержимый», а через несколько строк в том же каталоге живёт раздел «Семь грехов» с Чревоугодием: сближение напрашивается само, руки тянутся дописать. Статья руки убрала и написала прямым текстом, что такое сближение было бы достройкой. Это неудобное и правильное место — редкое, потому что удержаться тут труднее, чем в любом развёрнутом описании. И рядом ещё одна честная пустота: «Он жив», сказанное сразу после списка, повисает без адресата, и его тоже никому не приписали. Персонажа здесь нет, а вот дисциплина видна хорошо.</p></div>", "r": []}];</script>
