<script>const BASE="";const DOCNAME="Аскизы";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0066-S01", "GR-0066--chto-eto"], "h": "<p>Аскизы — раса мутантов вселенной Оам: сообщество вечных детей с чертами аксолотля, выведенных из яиц одной маткой. Разведка описывает их как «расу-сообщество вечных детей-аксолотлей вокруг матки, выводящей их из яиц подобно муравьиной», и это описание переписке соответствует.</p>\n<p>Строго говоря, «группой» в смысле организации Аскизы не являются: это раса (в переписке Слава разносит по одному перечню «расы и организации», и Аскизы стоят там наравне с Детьми мирового древа, Поротаями, Азуриэль и вампирами). Внутри неё в базе заведён ровно один поимённо названный участник — матка. Остальные — безымянное множество детей, о котором известны только общие свойства.</p>\n<p>Аскизы появились в переписке внутри большого блока о мутантах Оам (2025-10-20, id 376399–376403). Блок открывается общей рамкой: «Также есть мутанты это животное и люди, у которых под воздействием Оам изменилось их физиология». Аскизы — один из пунктов этого перечня, наряду с Апостолами, Детьми мирового древа, Азуриэль, Поротаями и вампирами.</p>\n<p>Происхождение расы названо: «Маток Аскизы была просто Аксолотлой. Но после в водоём, где она жила упал метеорит и под огромным воздействием Оам она мутировала и начала производить Оам» (376401, 2025-10-20). То есть вся раса выведена из одного мутировавшего животного.</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0066-S02", "GR-0066--sostav"], "h": "<ul>\n<li><strong><a href=\"PS-0301.html\">Матка Аскизы</a> — Матка Аскизы</strong> (в переписке также «Матка Аскизов», «Маток Аскизы», просто «матка»). Бывший аксолотль, мутировавший от упавшего в её водоём метеорита. Единственный названный участник.</li>\n<li><strong>Дети (сами Аскизы)</strong> — множество, выведенное маткой из яиц. Поимённого состава нет, численность не названа.</li>\n</ul>", "r": [["Матка Аскизы", "PS-0301.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0066-S03", "GR-0066--obschie-sposobnosti-gruppy"], "h": "<p>Общие свойства детей перечислены одним списком (376401, 2025-10-20; дословно повторено 2025-11-05, id 382108):</p>\n<ul>\n<li><strong>Не стареют.</strong> «Навечно Дети лет 7-10 на вид». Возраст зафиксирован не только внешне: «разумом они всегда как дети».</li>\n<li><strong>Быстрая регенерация.</strong></li>\n<li><strong>Зверский аппетит.</strong> «Они могут съесть человека целиком за пару минут».</li>\n<li><strong>Инстинкт голода выше разума</strong> — формулировка авторская, дана именно так.</li>\n<li><strong>Не чувствуют боли.</strong></li>\n</ul>\n<p>Отдельно у матки названо свойство, которого нет у других мутантов вселенной: она не просто поглощает Оам, а «начала производить Оам». Производит ли Оам потомство — в переписке не сказано.</p>\n<p>Внешность общая для расы: белоснежная кожа «с розовыми оттенками ( или другими оттенками)» и черты аксолотля. Оттенок оставлен нежёстким прямо в исходной формулировке. У матки кожа названа «с такой же белоснежное кожей», то есть общая с детьми.</p>", "r": []}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0066-S04", "GR-0066--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p>Различие в переписке проведено ровно одно — между маткой и детьми. Между самими детьми различий не проводится: они описаны как однородное множество.</p>\n<p><strong>Матка (<a href=\"PS-0301.html\">Матка Аскизы</a>):</strong></p>\n<ul>\n<li>рост 4 метра и «в ширину такая же»;</li>\n<li>«больше похожая на червя с огромными количествами лапок»;</li>\n<li>белоснежная кожа — общая с детьми черта;</li>\n<li>функция: «Матка, что выделяет их из яиц подобное муравьиной матки»;</li>\n<li>производит Оам;</li>\n<li>была отдельным существом до мутации — обычным аксолотлем.</li>\n</ul>\n<p><strong>Дети:</strong></p>\n<ul>\n<li>на вид 7–10 лет, гуманоидные, с чертами аксолотля;</li>\n<li>разум навсегда детский;</li>\n<li>свойства из раздела выше (регенерация, аппетит, нечувствительность к боли, голод выше разума).</li>\n</ul>\n<p>Есть ли у детей разделение на роли, касты или ранги — в переписке не сказано. Умеют ли дети пользоваться Оам, как остальные мутанты вселенной, тоже не сказано: в их списке свойств Оам не упомянут вообще.</p>", "r": [["Матка Аскизы", "PS-0301.html"]]}, {"t": "Иерархия", "a": ["S05", "GR-0066-S05", "GR-0066--ierarhiya"], "h": "<p>Внутренняя иерархия расы прямо не разбиралась, но структура заявлена биологическая и однонаправленная: матка выводит детей из яиц «подобное муравьиной матки». Сравнение с муравьиной маткой — единственное указание на устройство сообщества. Подчиняются ли дети матке, управляет ли она ими — в переписке не сказано; сравнение остаётся сравнением по способу размножения.</p>\n<p>Место расы в иерархии сил мира задано в общем разборе (2025-11-17, id 385768; повторено 2025-12-06, id 393287):</p>\n<ul>\n<li>сильнейшие — коты, их девять, «они вообще никуда не вмешиваться»;</li>\n<li>вторая по силе раса — Апостолы, их 21;</li>\n<li>«Ну и дальше расы и организации который равны по силе с друг другом» — и в этот третий ярус попадают Аскизы вместе с Детьми мирового древа, Поротаями, Азуриэль, группировкой сестры, правительской организацией, церковью с паладинами, организацией Виктора, Пернатыми, орденом для убийства котов и вампирами.</li>\n</ul>\n<p>То есть Аскизы отнесены к слою рас и организаций, равных по силе между собой, ниже котов и Апостолов.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S06", "GR-0066-S06", "GR-0066--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>Культ вокруг матки.</strong> Единственная названная связь Аскизов с кем-либо за пределами расы. Формулировка от 2025-11-17 (id 385768): «Аскизы. Матка Аскизов стало предметом веры для какой-то верологий». Дословно повторена 2025-12-06 (id 393287).</p>\n<p>Уточнение от 2025-12-06 (id 393465): «Матка. Находиться в церкви. И люди им поклоняются, а детей маток считают святыми».</p>\n<p>Из этого следует: матка физически находится в церкви, поклоняются ей люди, а потомство расы имеет в этом культе статус святых. Само вероучение имени не получило («какой-то верологий» — так и осталось), отдельной группой в базе не заведено. Как матка оказалась в церкви, добровольно ли она там, кто её туда поместил — в переписке не сказано.</p>\n<p><strong>Церковь с паладинами.</strong> В том же перечне мира отдельным пунктом идёт «Церковь с паладинами ( мёртвыми рыцарями которых оживил один челик, для верующих)», а рядом — «Организация челика который и оживил паладинов. Давай челика назовём Виктор». Является ли церковь, в которой стоит матка, той же самой церковью с паладинами, в переписке не сказано. Связь не проговорена и здесь не достраивается.</p>\n<p><strong>Прочее.</strong> Столкновений, союзов или вражды Аскизов с другими расами и организациями в переписке нет. В разбор сторон конфликта (2025-12-06, id 393301–393317: добро — Апостолы главные; промежуточные злодеи — Дети мирового древа, клан крылатых, церкви, иногда люди, Виктор; основные злодеи — Имита и Бог красок) Аскизы не попали ни на одну сторону.</p>\n<p><strong>Часть чего.</strong> Раса относится к миру Оам (в переписке мир пишется и «Оам», и «Оэм»).</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S07", "GR-0066-S07", "GR-0066--kak-menyalas"], "h": "<p><strong>2025-10-20 (id 376399–376403).</strong> Первое и самое подробное описание, внутри общего блока о мутантах. Заданы: происхождение от аксолотля, в чей водоём упал метеорит; производство Оам маткой; облик детей (7–10 лет, белоснежная кожа с розовыми или другими оттенками, черты аксолотля); свойства детей (не стареют, регенерация, зверский аппетит, съедают человека целиком за пару минут, инстинкт голода выше разума, не чувствуют боли, разум навсегда детский); функция матки — выводить детей из яиц подобно муравьиной; габариты матки — 4 метра в высоту и столько же в ширину, вид червя с огромным количеством лапок, белоснежная кожа. Тут же прямо оставлено непридуманным: «Как они рождаются я ещё не придумал». Блок закрыт репликой «Пока что так» (376403).</p>\n<p><strong>2025-11-05 (id 382108).</strong> Описание повторено дословно, без изменений и дополнений. Новых свойств не появилось.</p>\n<p><strong>2025-11-17 (id 385768–385769).</strong> Раса включена в общий разбор сил мира. Добавлено: «Аскизы. Матка Аскизов стало предметом веры для какой-то верологий». Тут же отдельным сообщением: «Ну и Аскизы. Я не знаю где они живут» (385769) — место обитания оставлено открытым.</p>\n<p><strong>2025-12-06, вечер (id 393286–393290).</strong> Перечень сил мира повторён дословно, включая обе реплики про Аскизов: формулировку про верологию (393287) и «Ну и Аскизы. Я не знаю где они живут» (393288). Ничего нового про расу не добавлено.</p>\n<p><strong>2025-12-06, 21:44 (id 393464–393467).</strong> Культ уточнён: «Матка. Находиться в церкви. И люди им поклоняются, а детей маток считают святыми» (393465). Это последнее изменение по расе в имеющемся материале.</p>\n<p>Отклонённых вариантов, то есть предложенных и забракованных решений по Аскизам, в переписке нет — от версии к версии описание только дополнялось.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "GR-0066-S08", "GR-0066--probely"], "h": "<div class=\"gaps\"><ul>\n<li><strong>Способ рождения не придуман.</strong> Прямая авторская пометка: «Как они рождаются я ещё не придумал» (376401, 2025-10-20). При этом в том же сообщении сказано, что матка «выделяет их из яиц подобное муравьиной матки». Как эти два утверждения соотносятся — неизвестно; вероятно, непридуманной осталась именно механика, а не общая схема, но в переписке это не проговорено. Пометка не снята ни в одной из последующих версий.</li>\n<li><strong>Где живут — неизвестно.</strong> «Ну и Аскизы. Я не знаю где они живут» (385769, 2025-11-17; повторено 393288, 2025-12-06). Место обитания расы не назначено. При этом матка, по версии от 2025-12-06, находится в церкви — где при этом находятся дети, не сказано.</li>\n<li><strong>Поимённого состава нет.</strong> Ни один Аскиз, кроме матки, не назван по имени. Численность расы не названа.</li>\n<li><strong>Вера без имени.</strong> «Верология», сделавшая матку предметом поклонения, имени не получила, отдельной группой не заведена, её устройство, жрецы и цели не описаны.</li>\n<li><strong>Не сказано, та ли это церковь.</strong> Связь между церковью, в которой находится матка, и «церковью с паладинами» из перечня сил мира в переписке не установлена.</li>\n<li><strong>Отношение Аскизов к Оам не описано.</strong> Матка Оам производит; умеют ли дети поглощать, контролировать или выделять Оам — в их списке свойств не сказано ничего.</li>\n<li><strong>Внутреннее устройство сообщества.</strong> Есть ли у детей роли или подчинение матке, что происходит с расой в случае гибели матки, — не разбиралось.</li>\n<li><strong>Роль в конфликте не назначена.</strong> При разборе сторон конфликта мира (2025-12-06) Аскизы не отнесены ни к добру, ни к промежуточным, ни к основным злодеям.</li>\n<li><strong>Написание мира.</strong> В переписке параллельно используются «Оам» и «Оэм»; какое основное, не оговорено.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0066--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0301.html\">Матка Аскизы</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0066--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0066.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0066-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0066/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым чинить культ. «Верология», сделавшая матку предметом поклонения, не заведена вообще ничем — ни статьи, ни записи в базе, ни номера. При этом на ней держится единственная внешняя связь расы, и через неё Аскизы цепляются к <code>MR-0172</code> и <code>GR-0061</code> («Церковь с паладинами», 13504 знака базы, три ссылки) — а вопрос «та ли это церковь» остаётся открытым именно потому, что связывающего звена нет. Пока культ безымянный и незаведённый, ни одна сторона стыка не может на него сослаться.</p>\n<p>Второе, дешевле в починке и дороже по объёму: <code>PS-0300</code> («Аскизы») — 33757 знаков базы против 12608 в статье, и <code>GR-0066</code> на него не ссылается вовсе, только на матку <code>PS-0301</code> (21301 базы против 8245 в статье). То есть основной массив по расе лежит в двух записях, из которых группа видит одну и меньше чем наполовину.</p>\n<h3>С чего начать</h3>\n<p>Не в архиве. Открыть <code>PS-0300</code> — там в базе почти втрое больше, чем в статье, и вопросы «где живут» и «умеют ли дети пользоваться Оам» вероятнее всего решаются оттуда, а не новой вычиткой чата. Затем <code>PS-0301</code>: разрыв между базой и статьёй тот же порядок. Для культа ближайшее, что есть в базе, — общие записи <code>SL-0147</code> («Религия», 6137 знаков) и <code>MR-0086</code> («Религия и церковь», 5459), обе без статьи и с вселенной «неясно»; сначала проверить, не туда ли ушла эта верология, и только потом заводить новую сущность.</p>\n<p>В архив идти только за стыком с церковью: 2025-12-06, 21:44, id 393464–393467. Реплика про матку в церкви стоит там вплотную к репликам про босса группировки сестры и про образ — надо смотреть окно целиком, чтобы понять, о какой церкви шла речь в этот момент разговора. Второй ориентир — 2025-11-17, id 385768–385769, где верология названа впервые и тут же рядом стоит «Я не знаю где они живут».</p>\n<h3>Как развивалось</h3>\n<p>2025-10-20 — заявили сразу целиком и подробно, и в том же сообщении поставили пометку «Как они рождаются я ещё не придумал». 2025-11-05 — повторили дословно, вместе с пометкой. 2025-11-17 — добавили верологию и вторую пометку, «Я не знаю где они живут». 2025-12-06 — повторили обе пометки слово в слово. 21:44 того же дня — дописали церковь. Особенность хода: непридуманное здесь не забывается, а переносится дальше как часть карточки, наравне с придуманным.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для котов прямо сказано, почему сильнейшие не участвуют: «они вообще никуда не вмешиваться». Невмешательство названо как свойство, а не как пропуск. Аскизы при разборе сторон 2025-12-06 тоже не попали ни на добро, ни к промежуточным, ни к основным злодеям — но у них это молчание, а не правило: причины не названо. Для одной непричастной силы объяснение проговорено, для соседней того же рода — нет.</p>\n<h3>Отклик</h3>\n<p>Сильное — сочетание, которое авторы поставили рядом и не стали смягчать: вечные дети семи-десяти лет, у которых инстинкт голода выше разума и которые съедают человека целиком за пару минут, — и они же святые, а мать их стоит в церкви, и ей поклоняются. Из этого нормально растёт целая религия, и ни одного слова объяснений не требуется. Матка тоже хороша: четыре метра, червь с огромным количеством лапок, а до метеорита — просто аксолотль в водоёме. И отдельно понравилось, что «Как они рождаются я ещё не придумал» стоит в одном сообщении с «выделяет их из яиц подобное муравьиной матки»: человек уже знает, как это выглядит, и честно отмечает, что не знает, как это устроено.</p></div>", "r": []}];</script>
