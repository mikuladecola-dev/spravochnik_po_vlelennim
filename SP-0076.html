<script>const BASE="";const DOCNAME="Тьма Нуара";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0076-S01", "SP-0076--mehanika"], "h": "<p>Тьма — рабочая среда Нуара. Разрабатывалась 2024-07-03 (окно w0041, id 194812–194832) при обсуждении того, куда поселить Нуара.</p>\n<p>Отправная точка Миколая: «может нуара под воду пошлём? там темноты дохуя» (194812), с обоснованием «а то хули в небе есть кто-то, а ниже уровня земли нету никого» (194813).</p>\n<p>Главная функция названа Славой: «И тьма будет держать воду как барьер» (194815). Миколай согласился. То есть тьма над подводным островом удерживает толщу воды, образуя барьер.</p>\n<p>Отдельно обсуждался вопрос, действует ли тьма на людей. Миколай: «важный вопрос, а вот тьма это миазмы?» (194818), уточнил — «ну типо проклятие» (194822). Слава: «Нет он не может проклинать» (194823). Миколай переформулировал: «ну я скорее про эффект воздействия тьмы на обычных людей» (194824), «возможно врагов» (194825).</p>\n<p>Решение по обычным людям: «ну если в обычном состоянии ваще не действует это даже хорошо» (194827). Обоснование — «ибо всё равно нужны порты коммуникации с внешним миром» (194828), «транспорт, все дела, хавать ведь надо чето, а без солнца еды норм не будет» (194829). То есть в обычном состоянии тьма на людей не действует.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0076-S02", "SP-0076--ogranicheniya-i-cena"], "h": "<p>Тьма завязана на жизнь носителя. Слава: «Вот только если он сдохнет будет пиздец острову» (194817). Смерть Нуара — гибель острова, поскольку барьер держится его тьмой.</p>\n<p>Проклинать носитель не может (194823).</p>\n<p>Отдельно в системе сил (<a href=\"SP-0086.html\">Система сил (сосуд)</a>) поднят вопрос, откуда у Нуара берётся энергия на круглосуточное удержание барьера; см. соответствующую статью.</p>", "r": [["Система сил (сосуд)", "SP-0086.html"]]}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0076-S03", "SP-0076--nositeli"], "h": "<p>Носитель — Нуар; тьма записана как его часть.</p>\n<p>Миколай допустил, что носитель не единственный: «возможно он не один такой» (194821). Реплика сказана в контексте вопроса про миазмы и дальше не развита.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0076-S04", "SP-0076--kak-menyalas-po-versiyam"], "h": "<p><strong>2024-07-03, id 194812–194819.</strong> Тьма помещается под воду, держит воду как барьер. Зафиксирована зависимость: смерть Нуара — конец острову. Задан вопрос про миазмы.</p>\n<p><strong>2024-07-03, id 194818–194832 (продолжение того же разговора).</strong> Разобран вопрос воздействия. Проклятия отменены, воздействие на обычных людей в обычном состоянии отменено ради возможности портов и связи с внешним миром. Вопрос про врагов оставлен открытым.</p>\n<p>Более ранний кусок разработки — «тьма осязаемая» — относится к концу окна w0040 и в этом файле не приводится.</p>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S05", "SP-0076-S05", "SP-0076--otklonennye-varianty"], "h": "<ul>\n<li>Тьма как миазмы в смысле проклятия (Миколай, 194818, 194822). Отклонено Славой: «Нет он не может проклинать» (194823).</li>\n<li>Постоянное воздействие тьмы на обычных людей. Отклонено по бытовой причине: без этого возможны порты, транспорт и снабжение (194827–194829).</li>\n</ul>", "r": []}, {"t": "Связь с другими способностями", "a": ["S06", "SP-0076-S06", "SP-0076--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Здесь же возникает способность солнца (<a href=\"SP-0083.html\">Солнце (способность Солнышка)</a>). Слава, отвечая на «без солнца еды норм не будет»: «Ну может там будет жить человек со способностью солнца или типо того» (194830), «Или он будет помощником» (194831). Миколай: «о, неплохая идея» (194832).</p>\n<p>В разговоре про кислород на подводном острове (<a href=\"SP-0083.html\">Солнце (способность Солнышка)</a>, 196740) тьме приписана ещё одна работа: «а тьма сосёт его и фильтрует меж дном и атмосферой».</p>", "r": [["Солнце (способность Солнышка)", "SP-0083.html"]]}, {"t": "Пробелы", "a": ["S07", "SP-0076-S07", "SP-0076--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Действие тьмы на врагов оставлено нерешённым: «Ну надо подумать» (194826).</li>\n<li>Формулировка «в обычном состоянии не действует» подразумевает необычное состояние, но что это за состояние и что тогда происходит — в переписке не сказано.</li>\n<li>Реплика «возможно он не один такой» (194821) не развита: другие носители тьмы не названы.</li>\n<li>Как именно тьма удерживает воду и что происходит с барьером при ослаблении носителя (кроме смерти) — не обсуждалось.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0076--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0083.html\">Солнце (способность Солнышка)</a>, <a href=\"SP-0086.html\">Система сил (сосуд)</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0104.html\">Нуар</a></li>\n<li><strong>Упомянут в способностях:</strong> <a href=\"SP-0083.html\">Солнце (способность Солнышка)</a>, <a href=\"SP-0086.html\">Система сил (сосуд)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0076--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-03</td>\n<td>194812–194819</td>\n<td>w0041</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-03</td>\n<td>194818–194832</td>\n<td>w0041</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0076-tma-nuara.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0076--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0076.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
