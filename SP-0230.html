<script>const BASE="";const DOCNAME="Водоворот событий";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0230-S01", "SP-0230--mehanika"], "h": "<p>Способность Куры, арбетара, описана Славой одним сообщением (2025-05-31, id 331639) вместе с двумя другими его способностями — «Чтением воспоминания» (<a href=\"SP-0231.html\">Чтение воспоминания</a>) и «Реконструкцией».</p>\n<p>«Водоворот событий создаёт вокруг владельца водоворот воды, радиусом 15 метров». Водоворот затягивает ближайших противников, и силы у него хватает на существ высокого порядка: «водоворот достаточной сильный, чтобы затянуть апостола или арбетара».</p>\n<p>Дальше водоворот схлопывается. При схлопывании «физический тела владельца и затянутых противников» исчезают, а их разум переносится «в рандомное события владельца или полученного им воспоминания». То есть событие берётся не только из личной биографии Куры, но и из чужих воспоминаний, которые он получил своей второй способностью.</p>\n<p>Попав внутрь события, затянутый видит его чужими глазами: «Ты будешь видеть это события, как видел его владелец. И с теми же чувством». При этом он не наблюдатель — «ты будешь участником этого события». Изменить ход событий можно пытаться, но результат зафиксирован: «Ты можешь попытаться его изменить. Но итог события всегда будет один и тот же».</p>\n<p>Проживание идёт совместно: «так ты будешь проживать события вместе с владельцем пока водоворот не остановится».</p>\n<p>Когда водоворот останавливается, «вас и владельца выталкивает от туда водой. Туда от куда вы были втянуты в сам водоворот событий» — то есть выброс происходит в исходную точку захвата.</p>", "r": [["Чтение воспоминания", "SP-0231.html"]]}, {"t": "Ограничения и цена", "a": ["S02", "SP-0230-S02", "SP-0230--ogranicheniya-i-cena"], "h": "<ul>\n<li>Радиус фиксирован — 15 метров.</li>\n<li>Событие, в которое переносит, владелец не выбирает: оно «рандомное».</li>\n<li>Итог прожитого события неизменяем, попытки вмешаться ни к чему не приводят.</li>\n<li>Владелец не управляет завершением: «Владелец не может контролировать остановку водоворота событий. Он останавливается в рандомной время».</li>\n<li>Внутри нельзя погибнуть: «В водовороте событий нельзя умереть. Даже если ты попал в событий, где итог умереть. Ты просто переключается на другое события». Смертельный исход внутри события работает как переключатель на следующее событие, а не как гибель.</li>\n</ul>\n<p>Отдельной платы за применение — усталости, износа, расхода ресурса — в переписке не названо. Владелец сам оказывается внутри водоворота наравне с затянутыми и так же не контролирует выход.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0230-S03", "SP-0230--nositeli"], "h": "<p>Кура, арбетар. Мужчина, выглядящий на тридцать лет, точный возраст неизвестен, рост 185. Некоторое время был начальником одного из дополнительных филиалов АЗИП, отстранён «из-за проявления своего безумия и игривого характера», на момент описания — «агентом и приближенным Апостола (Бессмертного)».</p>\n<p>Других носителей в переписке не названо.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0230-S04", "SP-0230--kak-menyalas-po-versiyam"], "h": "<p>Версия одна, правок нет: 2025-05-31, окно w0099, id 331639. Способность изложена сразу целиком и больше не пересматривалась.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0230-S05", "SP-0230--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Прямо связана с «Чтением воспоминания» (<a href=\"SP-0231.html\">Чтение воспоминания</a>): водоворот переносит не только в события самого владельца, но и в «полученного им воспоминания», а воспоминания эти Кура получает именно чтением. Одна способность наполняет материалом другую.</p>\n<p>В том же сообщении описана третья способность Куры — «Реконструкция», превращающая опыт и воспоминания в зелёную энергию. С водоворотом она в переписке напрямую не связана.</p>", "r": [["Чтение воспоминания", "SP-0231.html"]]}, {"t": "Пробелы", "a": ["S06", "SP-0230-S06", "SP-0230--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Не сказано, как часто способность применима и есть ли перезарядка.</li>\n<li>Не сказано, сколько времени проходит снаружи, пока внутри проживаются события.</li>\n<li>Не сказано, что происходит с телами, пока они «исчезли», и можно ли на них воздействовать извне.</li>\n<li>Не сказано, помнят ли затянутые прожитое после выброса и остаётся ли у них доступ к увиденным воспоминаниям владельца.</li>\n<li>Не сказано, можно ли применить водоворот к союзникам или добровольно войти в него.</li>\n<li>Не сказано, есть ли предел числа затянутых.</li>\n<li>Не названа цена для самого владельца.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0230--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0231.html\">Чтение воспоминания</a></li>\n<li><strong>Упомянут в способностях:</strong> <a href=\"SP-0231.html\">Чтение воспоминания</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0230--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-05-31</td>\n<td>331639–331639</td>\n<td>w0099</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0230-vodovorot-sobytiy.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0230--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0230.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["SP-0230-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/SP-0230/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Кура. Сущности с таким именем в наборе нет вообще — ни статьи, ни записи в базе, ни кода. При этом он единственный носитель трёх способностей подряд: этой, <code>SP-0231</code> «Чтение воспоминания» (7 126) и <code>SP-0232</code> «Реконструкция» (8 768), — и все три описаны одним сообщением. Кроме них на него опираются <code>IS-0013</code> «Бессмертный» (три ссылки, 44 010) — там он единственная привязка Бессмертного к чему-либо живому в окне 2025-05-31, <code>PS-0179</code> «Благословенные» (78 161), где под него отведён целый раздел, и <code>PS-0277</code> «Агент АЗИП» (11 887), где он стоит в связанных, а в тексте не появляется вовсе — карточка сама это и отмечает. Пять статей ссылаются на персонажа, которого в реестре нет.</p>\n<p>Дорого это ещё и потому, что Кура сидит на стыке двух категорий сил. В карточке он «Арбетар» — а в списке апостолов 2026-02-09 он же стоит под номером 11 (<code>PS-0179</code>). Для арбетаров правило входа расписано: <code>SP-0198</code> «Ритуал становления Арбетаром» (две ссылки, 48 879). Для апостолов — благословение от правителя рая. Свести это можно только там, где Куры нет.</p>\n<p>Второе, попутно: <code>SL-0054</code> «Список 12 апостолов» — 234 052 знака базы, статьи нет, три ссылки. Самая большая запись без статьи во всём наборе, и позиция 11 в списке ведёт ровно сюда.</p>\n<h3>С чего начать</h3>\n<p>В базе, и всё в одном месте. Полная карточка Куры уже переписана — она лежит в <code>PS-0179</code>, раздел «Кура»: внешность (маска курицы с красным гребнем, зелёно-оранжевый плащ, зелёный короткий меч), характер («игривым и импульсивным»), положение (начальник дополнительного филиала АЗИП, отстранён), все три способности и реакция Миколая. Оттуда же тянутся <code>SP-0231</code> и <code>SP-0232</code>. Источник у всего один: 2025-05-31, id 331639, окно w0099. Собрать персонажа можно, не выходя из базы, — материал не отсутствует, он расписан по способностям вместо носителя.</p>\n<p>В архив идти за двумя вещами. Первое: w0099 после 331639 — реакция Миколая (331664–331665) состоит из «хочу» и «ну в целом крайне интересно», и на этом всё; вопросов по механике водоворота он не задал ни одного, а обычно задаёт. Стоит проверить, оборвался ли разговор или продолжение просто не выписано. Второе: 2026-02-09, id 430400, окно w0116 — там имя вернулось строкой в списке апостолов; смотреть надо весь этот день, потому что между маем 2025-го и февралём 2026-го по Куре в базе пусто.</p>\n<p>Отдельно: «дополнительные филиалы АЗИП», начальником одного из которых он был, — это <code>MR-0138</code> (15 539) и <code>GR-0004</code>. Ни в одной из них Кура как бывший начальник не числится.</p>\n<h3>Как развивалось</h3>\n<p>2025-05-30, id 331465–331468 — заход был не с водоворота: «Я снова застрял», «Не знаю, что писать», затем «Хочу придумать способность с накоплением опыта». Это про Реконструкцию. 2025-05-31, id 331639 — выдана готовая карточка целиком: персонаж, три способности, ограничения. Водоворот в ней первый, хотя разгон шёл про третью. Дальше — восемь месяцев ничего. 2026-02-09, id 430400 — имя возвращается, но уже без способностей: строка номер 11 в списке апостолов, где раньше позиция была пустой. Заявили через соседнюю способность, выдали разом, забыли, вернули как имя в списке.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Последствия чужой памяти для того, кто её носит. Для Чтения воспоминания цена названа, причём не механикой, а прямо через личность: «Из-за частого чтения чужих воспоминаний. Он сомневается, что нынешний он это он. И в попытках доказать себе, что он прежний он творит разные безумные вещи пытаясь удержать своё я». Водоворот делает с затянутыми ровно то же самое, только жёстче: событие проживается «как видел его владелец. И с теми же чувством», участником, а не зрителем, и не единожды — при смертельном исходе идёт переключение на следующее. Для владельца, читающего память пальцами, правило износа «я» проговорено. Для того, кого протащили через чужие события изнутри, правила того же рода нет — ни для затянутых, ни для самого Куры, который проживает всё это вместе с ними.</p>\n<h3>Отклик</h3>\n<p>Сильнее всего здесь одна строчка: «В водовороте событий нельзя умереть. Даже если ты попал в событий, где итог умереть. Ты просто переключается на другое события». Смерть переделана в переключатель — не отменена, не смягчена, а низведена до способа перейти к следующему. Рядом стоит «Ты можешь попытаться его изменить. Но итог события всегда будет один и тот же», и вместе это даёт довольно жестокую конструкцию: тебе оставляют и волю, и полную бесполезность воли, и не дают выйти через смерть. Водой затянуло, водой и выплюнуло в ту же точку — ничего не изменилось, кроме того, что ты теперь помнишь чужую жизнь. И то, что владелец не контролирует ни выбор события, ни момент остановки, делает его не хозяином приёма, а таким же попавшим. Для способности, у которой не названа цена, она выглядит на редкость дорого.</p></div>", "r": []}];</script>
