<script>const BASE="";const DOCNAME="Насла";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0204-S01", "MR-0204--ustroystvo"], "h": "<p>Насла — организация злодеев (2026-06-17, id 491162). Вариант написания имени, встречающийся в переписке, — «Организация Насла».</p>\n<p>Состав организации задан через отрицание: «В этой организации злодеев лишь обычный люди там нету сл или ис». То есть ни сверхлюдей (сл), ни искусственных сверхлюдей (ИС, <a href=\"MR-0195.html\">Искусственные сверхлюди (ИС)</a>) в ней нет — только обычные люди.</p>\n<p>Идеология организации сформулирована так: «сл и всё кто контролирует оам зло. Абсолютное зло. Дети что получили в руку ядерную бомбу. Монстры что не понимают собственной силы и ответственности». Под действие идеологии подпадают не только сверхлюди как таковые, а все, кто контролирует оам.</p>\n<p>Цель, вытекающая из идеологии: «их цель уничтожить всех сл или подчинить их под строгие правила» — то есть два допустимых исхода, полное уничтожение либо жёсткая регламентация.</p>\n<p>Внутрь организации влилась секта: «В данной организации также вступила и секта что считает сл демонами вылезший из ада». Название секты в переписке не дано, её состав и численность не названы.</p>\n<p>Отдельно зафиксировано расхождение между заявленной идеологией организации и позицией её главы. Глава — Зана. Его собственная позиция противоположна идеологии, которую он возглавляет: «Сам же глава насла так не считает. По его мнению даже без сл, был бо множество войны, множество плохих людей, множество смертей и несчастье».</p>\n<p>Мотив, по которому Зана тем не менее «возвёл и командует такой организации», изложен его прямой речью: «Разве у вас никогда не проявлялась желание растоптать Бога, замирать его, увидеть его жалкий вид. Подорвать ему крылья и с упоением смотреть на эти отчаяный глаза» — «если нет то вы соврети». Далее тот же мотив разворачивается через пример: «Разве у вас просто не промелькала мысль увидеть как например звезда что строила свой образ на протяжении всей жизни вдруг падёт, разве это неинтересно, разве это не просто человеческая желания».</p>\n<p>Подстановка, замыкающая мотив на сверхлюдей: «И кто же в нашем мире бог, конечно сл. И их ними падениями я буду восхищаться». Здесь же задана последовательность, которой он придерживается: «но прежде чем пасть нужно сначала дать им подняться а после собвстенными руками поджечь им крылья и смотреть как крылья начинают разваливаться, как их уверенно лицо, изменяется гримассой страха».</p>\n<p>Отдельным определением Зана назван «Главный фанат сл».</p>\n<p>Оговорено, какое именно падение его устраивает: «Вообще он хочет падения не как он сражался против сильного злодея и проиграл. А то где обычный человек, простолюдина топчит бога, дворянина. Где он побеждает даже Бога». Это соединяет личный мотив главы с составом организации — только обычные люди.</p>\n<p>Как пример неудовлетворившего его результата приведено падение Изб: «ему не понравилось падения изб, он посчитал что слишком рано и что слишком быстро подослали злодей не дав насладиться эмоциями Изб».</p>", "r": [["Искусственные сверхлюди (ИС)", "MR-0195.html"]]}, {"t": "Население", "a": ["S02", "MR-0204-S02", "MR-0204--naselenie"], "h": "<p>Названные лица — только глава, Зана. Ни один рядовой член организации в переписке не назван. Организация делится на две составляющие: собственно злодеи из обычных людей и влившаяся в неё секта, считающая сверхлюдей демонами из ада.</p>\n<p>Вокруг Заны названы ещё двое, но как внешние по отношению к организации фигуры:</p>\n<ul>\n<li>Бэм — с ним у Заны союз (2026-06-17, id 491165). Союз охарактеризован как настоящий: «У него союз с Бэмом. Реальный. Он не сообщем дурак. Он готов к верному сотруднечеству зная что это в будущем принесёт больше эмоции и даст ему ресурс для его преставления». Условия союза: «Бэм спонсирует его, а он веселит его преставоениеми и устраняет тех на кого покажет Бэм».</li>\n<li>Всул — существо, летающее рядом с Заной. В приведённой сцене: «всул видил их морды. Ха-ха- говорит зан валяешь на полу. Всул же летал рядом и обеспокоена смотрел на него», и далее реплика Заны: «ты бы видел как лицо того старика скорчилась. Этот сухарь думающий что всегда сможет держать голову холодной».</li>\n</ul>\n<p>Названы три вещи, которые Зана не предаст: «Свою организация, союз с Бэмом ( большая часть ресурсов оттуда как бы. Поэтому это глупо ради мимолётно радости, решать себя постоянной радости) И всул».</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0204-S03", "MR-0204--mesto-vo-vselennoy"], "h": "<p>Насла противопоставлена сверхлюдям и «всем, кто контролирует оам» — то есть носителям центральной механики этого мира. Организация относится к стороне злодеев, при этом сама не содержит носителей сверхспособностей.</p>\n<p>Ресурсная привязка: большая часть ресурсов организации идёт от союза с Бэмом — это оговорено прямо, как причина, по которой союз не будет предан.</p>\n<p>Вселенная, к которой относится Насла, в карточке помечена как неясная и определена по дате объявления.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0204-S04", "MR-0204--kak-menyalsya-po-versiyam"], "h": "<p>Версия 1 — 2026-06-17 (id 491162). Объявление организации целиком: состав (только обычные люди), идеология (сл и все контролирующие оам — абсолютное зло, «дети с ядерной бомбой»), цель (уничтожить или подчинить строгим правилам), вошедшая в организацию секта (сл — демоны из ада), расхождение между идеологией и личной позицией главы, мотив Заны (желание увидеть падение бога), подстановка «бог = сл», формула «Главный фанат сл», требуемый характер падения (простолюдин топчет дворянина, а не поражение в бою сильному злодею), недовольство падением Изб.</p>\n<p>Версия 2 — 2026-06-17 (id 491165), помечена как повтор прежней мысли. Организация здесь названа одной из трёх вещей, которые Зана не предаст, наравне с союзом с Бэмом и всулом. Основной объём этого сообщения относится не к организации, а к самому Зане: описание внешности (белоснежная чистая кожа «не как у больного а как у красивого человека», худощавость, из-за которой «на вид его можно посчитать хрупким», белая рубашка с приоткрытым воротником и засученными до локтя рукавами, очки с цепочкой — артефакт, вечная перчатка для стрельбы на правой руке, подвеска, спрятанная за рубашкой, чёрные штаны), два телефона (кнопочный дешёвый — «чтобы быстро и без сожаление его быстро выбросить» — и дорогой, на котором «вообще нет контактов или что-либо связанные с его работой»), союз с Бэмом и сцена со всулом.</p>\n<p>Между двумя версиями идеология, состав и цель организации не менялись; второе сообщение добавляет союз с Бэмом и ставит организацию в список непредаваемого.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0204-S05", "MR-0204--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Кроме главы, ни один член организации не назван.</li>\n<li>Название секты, влившейся в Наслу, не дано; её состав и численность не названы. Не сказано, как секта соотносится с остальной организацией — подчинена, автономна, как разделены полномочия.</li>\n<li>Не сказано, знает ли кто-либо в организации, что глава не разделяет её идеологию.</li>\n<li>Не сказано, кто такой Бэм, к какой стороне он относится и какими ресурсами располагает; союз описан только со стороны условий.</li>\n<li>Не сказано, кто или что такое всул; из текста следует только, что он летает и находится при Зане.</li>\n<li>Изб упомянут как уже павший, но обстоятельства падения, кроме недовольства Заны его скоростью, в этой карточке не изложены.</li>\n<li>Численность, структура, база, методы работы организации не описаны.</li>\n<li>Принадлежность к вселенной помечена как «неясно» — привязка сделана только по дате объявления.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0204--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0195.html\">Искусственные сверхлюди (ИС)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0204--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-06-17</td>\n<td>491162–491162</td>\n<td>w0122</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-17</td>\n<td>491165–491165</td>\n<td>w0122</td>\n<td>неясно (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0204-nasla.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0204--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0204.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
