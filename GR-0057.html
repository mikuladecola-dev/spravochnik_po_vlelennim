<script>const BASE="";const DOCNAME="Коты (девять котов)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0057-S01", "GR-0057--chto-eto"], "h": "<p>Коты — раса-верхушка мира Оам (в записях Славы чаще «Оэм»): девять существ, стоящих на первом месте в силовой иерархии вселенной. Разведка не ошиблась: это именно группа с постоянной численностью, а не одиночный персонаж и не рубрика каталога.</p>\n<p>Первое и основное определение дано Славой в перечне рас и организаций вселенной (2025-11-17, id 385768) и через две с половиной недели повторено дословно, слово в слово (2025-12-06, id 393287):</p>\n<p>«Коты. Их 9.они сильнеший ( уникальный особенности, я для них не придумал помоги) и вот они есть в каждую эпоху. Если один кот умрёт родиться новый и всегда их будет 9. Они вообще никуда не вмешиваться».</p>\n<p>В этой формулировке заложено сразу пять свойств: их девять; они сильнейшие; они есть в каждую эпоху; при смерти одного рождается новый, так что число всегда остаётся девять; они ни во что не вмешиваются. Тут же, в скобках, — прямая просьба к соавтору: уникальные особенности для них Слава не придумал и просит помочь.</p>\n<p>Словом «раса» в переписке названы апостолы — «Апостолы 21 вторая по силе раса на земле». Коты стоят в том же перечне первой строкой, но самим словом «раса» не названы.</p>\n<p>Природа котов уточнена позже (2025-12-04, id 392486): «Коты наверное буду типо духами. Будут чисто из Оэм состоять». Оэм (он же Оам) в этой вселенной — и мир, и субстанция: мелкие крупицы, летающие в воздухе, прилетевшие на Землю с метеоритами и ставшие первопричиной всех мутаций. Коты, в отличие от остальных рас, которые Оам поглощают и накапливают, состоят из него целиком.</p>\n<p>Названия в переписке: «Коты», «9 котов», «коты», у Миколая один раз «котики» (2025-12-17, id 399603). Один раз Миколай назвал их «червивоглазыми» (2025-12-06, id 393312) — по их глазам-червям.</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0057-S02", "GR-0057--sostav"], "h": "<ul>\n<li><a href=\"PS-0104.html\">Нуар</a> — Нуар. Единственный кот, названный поимённо.</li>\n</ul>\n<p>Привязка сделана одной репликой (2025-11-17, id 385774): «Кстати нуар один из котов». Дальше Слава уточняет, о ком речь: «Помнишь нуара. Сильнеший из 7 островов» (id 385775), Миколай подтверждает: «да да» (id 385776). Речь о персонаже из более ранней вселенной соавторов, который здесь встроен в новую иерархию.</p>\n<p>Остальные восемь котов в переписке не названы — ни именами, ни описаниями, ни признаками. Поимённого состава нет. В окне по вселенной Феня (2025-12-17, w0114) поимённо тоже никто из котов не назван.</p>", "r": [["Нуар", "PS-0104.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0057-S03", "GR-0057--obschie-sposobnosti-gruppy"], "h": "<p><strong>Сила.</strong> Коты — сильнейшие в мире Оам. Это первая строка иерархии, выше апостолов и всех остальных рас и организаций (2025-11-17, id 385768; 2025-12-06, id 393287).</p>\n<p><strong>Постоянное число и перерождение.</strong> «Если один кот умрёт родиться новый и всегда их будет 9». Механика перерождения — как именно и где рождается новый кот, помнит ли он что-либо — в переписке не описана.</p>\n<p><strong>Присутствие в каждую эпоху.</strong> «И вот они есть в каждую эпоху».</p>\n<p><strong>Невмешательство.</strong> «Они вообще никуда не вмешиваться». Причина невмешательства не названа.</p>\n<p><strong>Состав тела — чистый Оэм.</strong> Из этого прямо выведена их главная механическая особенность. Первая формулировка (2025-12-04, id 392486, 392489): «Коты наверное буду типо духами. Будут чисто из Оэм состоять» — «Поэтому запас и понимания Оэм у них больше всех». Вторая, через два дня, с расширенным перечнем (2025-12-06, id 393315): «Кстати коты будут типо, что-то духов. То бишь они будут состоять из Оэм. Из-за этого понимания, объём и контроль Оэм у них выше чем у любого». Во второй версии к «запасу и пониманию» добавлены «объём» и «контроль», и сравнение из «больше всех» превращается в «выше чем у любого».</p>\n<p><strong>Глаза-черви (<a href=\"SP-0254.html\">Глаза-черви</a>).</strong> Коты — единственные носители этого типа глаз. Способность заведена внутри системы трёх пар глаз (2025-12-04, id 392478): «Глаза черви. Зрачки у них будут словно состоять из тысячи маленьких червячков и вечно двигаться вызывая отвращения и страх ( будет у котов)».</p>\n<p>Вечером того же дня, в ответ на вопрос Миколая, как персонаж это реализует, Слава разворачивает картинку (id 392663, 392667, 392670): «Нет. Потому что в моей голове эти глаза страшные. Страшнее просто белых или радужных» — «Типа это вроде нормальный зрачок. Но если пригляделся то там словно движутся черви. Из-за возникает чувство отвращения, ну и чувство жути» — «Словно это что-то не понятное». То есть глаз при беглом взгляде выглядит нормальным, и жуть возникает только при разглядывании.</p>\n<p>Место котов в системе трёх пар глаз (<a href=\"SP-0253.html\">Три пары глаз</a>, 2025-12-04, id 392478):</p>\n<ul>\n<li>белые глаза — у апостолов, «Способны видеть оэм ну ещё чего-нибудь»;</li>\n<li>глаза-черви — у котов;</li>\n<li>радужные глаза — «только для одного челика».</li>\n</ul>\n<p>Что именно, кроме Оэм, видят белые глаза апостолов, не решено; видят ли что-то особенное глаза-черви и вообще являются ли они способностью, а не только внешним признаком, в переписке не сказано.</p>\n<p><strong>Уникальные особенности не придуманы.</strong> Это отдельное свойство статьи, а не пробел по недосмотру: просьба «уникальный особенности, я для них не придумал помоги» стоит внутри самого определения котов и повторена дословно вместе с ним 2025-12-06. Ответа Миколая на эту просьбу в окнах нет.</p>", "r": [["Глаза-черви", "SP-0254.html"], ["Три пары глаз", "SP-0253.html"]]}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0057-S04", "GR-0057--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p>Материала на этот раздел почти нет, потому что из девяти котов индивидуализирован один.</p>\n<p><strong>Нуар (<a href=\"PS-0104.html\">Нуар</a>).</strong> Отличается тем, что у него есть предыстория в другой вселенной («Сильнеший из 7 островов») и заявленный способ воздействия на мир: «Ну здесь он будет влиять на мир подобно волнами» (2025-11-17, id 385779). Слово «здесь» отделяет его роль в Оам от прежней роли в «Семи островах». Отдельно он назван в списке сильнейших существ мира Оэм — первым из трёх (2025-12-06, id 393297): «1 это нуар из котов, он один из сильнейших. Вообще грубо говоря будет 3 сильнейших. И вот нуар один из них. Как и в семи островав, так и здесь я не смог придумать ему характер. Поможешь?» Двое других сильнейших к котам не относятся: апостол Граф и девушка на стороне людей.</p>\n<p>Здесь возникает точка, которая в переписке не разобрана: коты объявлены сильнейшими все девять, а в списке трёх сильнейших мира от котов стоит один Нуар. Как это соотносится, авторы не обсуждали. Так же не сведены между собой правило «Они вообще никуда не вмешиваться» и заявление, что Нуар «будет влиять на мир подобно волнами»: оба сказаны в одном окне и в одно утро, но вместе не обсуждаются.</p>\n<p>Остальные восемь котов друг от друга ничем не отличаются — просто потому, что о них ничего не сказано.</p>", "r": [["Нуар", "PS-0104.html"]]}, {"t": "Иерархия", "a": ["S05", "GR-0057-S05", "GR-0057--ierarhiya"], "h": "<p>Внутренняя иерархия котов — есть ли среди девяти старший, равны ли они между собой — в переписке не описана.</p>\n<p>Место котов во внешней иерархии описано чётко (2025-11-17, id 385768; повтор 2025-12-06, id 393287):</p>\n<ol>\n<li>Коты — «сильнеший», девять.</li>\n<li>Апостолы, 21 — «вторая по силе раса на земле (опять раса, в мире есть просто индивиды который могут быть сильными)».</li>\n<li>«Ну и дальше расы и организации который равны по силе с друг другом» — дети мирового древа, Поротай (каменные), Азуриэль, группировка сестры (дочери Имитатора), правительственная организация по контролю, церковь с паладинами, организация Виктора, пернатые, орден по убийству котов, вампиры, аскизы.</li>\n</ol>\n<p>Отдельно оговорено, что помимо рас в мире есть просто сильные индивиды.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S06", "GR-0057-S06", "GR-0057--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>Со всеми — невмешательство.</strong> «Они вообще никуда не вмешиваться» — единственная формулировка их позиции по отношению к остальному миру.</p>\n<p><strong>Орден по убийству котов (<a href=\"MR-0175.html\">Орден по убийству котов</a>).</strong> Единственная структура, заведённая специально против них. В перечне рас и организаций (2025-11-17, id 385768; повтор 2025-12-06, id 393287) стоит одной строкой: «Так же появиться орден предназначеный для убийства котов». Больше про орден не сказано ничего: ни кто в нём, ни зачем ему убивать котов, ни когда он появится, ни как убийство соотносится с тем, что на месте убитого кота рождается новый.</p>\n<p><strong>Апостолы.</strong> Стоят в иерархии сразу под котами и владеют белыми глазами из той же системы трёх пар глаз. Прямых отношений между котами и апостолами в переписке нет.</p>\n<p><strong>Отклонённый вариант: коты как главные злодеи.</strong> 2025-12-06, при разборе сторон конфликта, Слава говорит: «Ну вот у меня в голове два основных злодея» (id 393309). Миколай предполагает котов (id 393310–393312): «котов?» — «😼» — «червивоглазых?». Слава называет других: дочь Имитатора (Имита) и Бога красок (id 393313–393314). Вариант с котами в роли основных злодеев не принят и больше не поднимался.</p>\n<p><strong>«Семь островов».</strong> Через Нуара группа привязана к более раннему материалу соавторов: «Сильнеший из 7 островов» (id 385775). Сама вселенная в этом окне только упомянута, без описания.</p>", "r": [["Орден по убийству котов", "MR-0175.html"]]}, {"t": "Как менялась — по датам", "a": ["S07", "GR-0057-S07", "GR-0057--kak-menyalas"], "h": "<p><strong>2025-11-17 (id 385768–385779, окно w0109).</strong> Коты заведены в общем перечне рас и организаций вселенной Оам, сразу первой строкой. Даны: число девять, сильнейшие, присутствие в каждую эпоху, перерождение с сохранением числа, невмешательство. Тут же — просьба придумать им уникальные особенности. В том же перечне заявлен орден для их убийства. Через двадцать минут Нуар объявлен одним из котов (id 385774) и назван его способ воздействия на мир — волнами.</p>\n<p><strong>2025-12-04, день (id 392478, окно w0112).</strong> Внутри системы трёх пар глаз котам отданы глаза-черви: зрачки из тысячи маленьких вечно движущихся червячков, вызывающие отвращение и страх.</p>\n<p><strong>2025-12-04, день (id 392486–392489).</strong> Названа природа: коты «типо духами», состоят чисто из Оэм, «Поэтому запас и понимания Оэм у них больше всех».</p>\n<p><strong>2025-12-04, вечер (id 392649–392670).</strong> Глаза-черви развёрнуты: внешне нормальный зрачок, черви видны при разглядывании, ощущение — отвращение и жуть, «Словно это что-то не понятное»; страшнее белых и радужных.</p>\n<p><strong>2025-12-06 (id 393287–393295).</strong> Весь перечень рас, включая определение котов, повторён дословно, без изменений. Следом Слава раскладывает стороны конфликта мира Оэм.</p>\n<p><strong>2025-12-06 (id 393297).</strong> Нуар назван первым из трёх сильнейших мира; отмечено, что характер ему не придуман ни в «Семи островах», ни здесь, и запрошена помощь.</p>\n<p><strong>2025-12-06 (id 393309–393314).</strong> Миколай предполагает, что основные злодеи — коты; Слава называет вместо них дочь Имитатора и Бога красок.</p>\n<p><strong>2025-12-06 (id 393315).</strong> Мысль о духовной природе повторена с расширением: «понимания, объём и контроль Оэм у них выше чем у любого». Миколай в конце окна отвечает по всему разом: «ну, я прочёл всё», «примерно понял» (id 393317–393318).</p>\n<p><strong>2025-12-17 (id 399583–399603, окно w0114, вселенная Феня).</strong> Коты названы последним, шестым пунктом в рабочей памятке Славы о том, что предстоит придумать: «Роль Котов во всей этой фигней». Слава просит эту памятку закрепить в чате. При обсуждении списка Миколай отзывается о них одним словом — «котики» (id 399603). Никакой разработки в этом окне нет: роль котов не определена, поимённо никто не назван, и кто такие Коты, в самом окне не объясняется. Своего материала по Фене у группы нет.</p>\n<p><strong>Позже (окна w0120–w0121, 2026-06-02 — 2026-06-09, id 487001–488828).</strong> Нуар разработан заново — как первый искусственный сверхчеловек организации Нимб, один из шести столпов героев, со способностями кровь, слова, молния и тьма. Коты в этих окнах не упоминаются, и связь этой версии Нуара с котами в переписке не названа.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "GR-0057-S08", "GR-0057--probely"], "h": "<div class=\"gaps\"><ul>\n<li><strong>Уникальные особенности котов не придуманы.</strong> Просьба «уникальный особенности, я для них не придумал помоги» прозвучала дважды — 2025-11-17 (id 385768) и 2025-12-06 (id 393287). Ответа Миколая по существу в переписке нет.</li>\n<li><strong>Поимённого состава нет.</strong> Из девяти назван один — Нуар. Остальные восемь не названы и не описаны.</li>\n<li><strong>Роль котов в истории осталась нерешённой.</strong> 2025-12-17 (id 399583) она стоит в списке задач: «Роль Котов во всей этой фигней».</li>\n<li><strong>Механика перерождения не описана.</strong> Сказано только, что при смерти одного рождается новый и что их всегда девять; как, где и в каком виде — в переписке не сказано.</li>\n<li><strong>Причина невмешательства не названа</strong>, как и то, что могло бы заставить их вмешаться.</li>\n<li><strong>Невмешательство и волны Нуара не сведены.</strong> Оба утверждения сказаны 2025-11-17 с разницей в двадцать минут, вместе не обсуждаются.</li>\n<li><strong>Внешность, кроме глаз, не описана.</strong> Почему они «коты», выглядят ли они как коты, как выглядят духи из Оэм — в переписке не сказано.</li>\n<li><strong>Внутренняя иерархия не описана.</strong> Есть ли старший среди девяти, равны ли они, знают ли друг друга — не сказано.</li>\n<li><strong>Орден по убийству котов дан одной строкой.</strong> Ни состава, ни мотива, ни того, как убийство кота сочетается с рождением нового.</li>\n<li><strong>Соотношение «девять сильнейших» и «три сильнейших мира» не разобрано.</strong> В списке трёх сильнейших от котов стоит только Нуар.</li>\n<li><strong>Характер Нуара не придуман</strong> — прямо сказано автором (2025-12-06, id 393297).</li>\n<li><strong>Написание Оэм/Оам не унифицировано.</strong> Слава пишет «Оэм», Миколай и нейросеть — «Оам»; природа субстанции в самом чате отдельно не объясняется.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0057--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0104.html\">Нуар</a></li>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0253.html\">Три пары глаз</a>, <a href=\"SP-0254.html\">Глаза-черви</a></li>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0175.html\">Орден по убийству котов</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0057--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0057.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0057-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0057/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Самая дорогая дыра — <code>SL-0129</code> «Список того, что надо придумать по миру»: три ссылки, статьи нет, 4 085 знаков базы. Это памятка Славы из шести пунктов от 2025-12-17, которую он просил закрепить в чате, и один из пунктов — «Роль Котов во всей этой фигней». То есть главный открытый вопрос этой статьи не висит в воздухе, он лежит записью — и на той же записи висят ещё пять пунктов, тянущих Апостолов, Бога красок, Пастырей и Серафима. Одна запись без статьи держит сразу несколько статей.</p>\n<p>Второе — <code>PS-0375</code> «Доима (дочь Имета)»: четыре ссылки, статьи нет, 9 036 знаков, вселенная «неясно». Среди ссылающихся — <code>PS-0104</code> Нуар, единственный названный поимённо кот.</p>\n<p>Третье — не отсутствие статьи, а тонкий материал там, где ссылок много. <code>MR-0175</code> «Орден по убийству котов»: четыре ссылки (<code>GR-0057</code>, <code>GR-0058</code>, <code>MR-0170</code>, <code>VS-0008</code>), а базы 8 026 знаков, и это дважды повторённый один и тот же перечень — фактически одно предложение. Единственная структура, заведённая против котов, держит четыре записи одной строкой. Для сравнения по соседству: <code>SP-0238</code> «Белые глаза» апостолов — 26 418 знаков базы, <code>SP-0254</code> «Глаза-черви» котов — 4 815.</p>\n<h3>С чего начать</h3>\n<p>Сначала база. Коты заведены дважды: эта статья и <code>PS-0307</code> «Коты» (четыре ссылки, 13 340 знаков) — та же сущность, только как персонаж. Орден тоже дважды: <code>GR-0058</code> и <code>MR-0175</code>. Сведение этих пар — работа без архива.</p>\n<p>Дальше — окно w0121 (2026-06-03 — 2026-06-09), которого в статье нет вовсе: она обрывается на 2025-12-17. Там Нуар действует в живом сюжете, и весь пласт лежит без статей и с вселенной «неясно»: <code>PS-0374</code> Фатик (6 604), <code>MR-0203</code> Инквизиторы (6 057), <code>MR-0197</code> «Секта Фалим» (3 282), проза <code>PR-0125</code> «После битвы с Фатикой (Нуар и отряд инквизиторов)» (3 022). Если этот пласт относится к Оам, линия единственного названного кота продлевается на полгода, и вопрос про «трёх сильнейших» решается там, а не в декабре.</p>\n<p>В архив идти за одним — за ответом на просьбу придумать котам уникальные особенности. Просьба стоит внутри id 385768 (2025-11-17, окно w0109) и повторена дословно в id 393287 (2025-12-06). Смотреть надо не эти сообщения, а ленту после них: после 385779 и после 393315. В собранном материале ответа нет ни разу, при том что просьба — единственное место, где автор прямо передаёт соавтору кусок работы.</p>\n<h3>Как развивалось</h3>\n<p>Заявили сразу целиком: 2025-11-17 в одном сообщении даны число, ранг, вечность, механика перерождения и невмешательство — пять свойств за раз, и тут же просьба о помощи. Через две с половиной недели ограничили не свойствами, а веществом: 2025-12-04 коты становятся духами из чистого Оэм, и превосходство выводится уже не декларацией, а составом тела; тогда же им отданы глаза-черви. 2025-12-06 весь блок повторён слово в слово, без единой правки, и в тот же день предложение Миколая сделать котов основными злодеями отклонено — роль ушла к дочери Имитатора и Богу красок. 2025-12-17 коты стоят одной строкой в списке задач. От пяти свойств в одном сообщении до пункта в памятке — за месяц.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для котов правило восполнения названо прямо: «Если один кот умрёт родиться новый и всегда их будет 9». Апостолы устроены по тому же принципу — фиксированное число 21, общий источник, все вылезли из разных коконов и родились одновременно. Что происходит с числом, когда апостол умирает, не сказано; 2025-12-17 вопрос прозвучал вслух — «А что произойдет если апостол умрет. Умретли он просто или переродится чем то иным» — и остался открытым. Для первой ступени иерархии правило сохранения числа проговорено, для второй, устроенной так же, — нет.</p>\n<h3>Отклик</h3>\n<p>Зацепило сочетание, которое авторы, кажется, поставили рядом не нарочно: раса, которая ни во что не вмешивается и которую нельзя убить насовсем, — и орден, заведённый специально для её убийства. Одна строка в перечне, ни мотива, ни состава, а внутри неё уже сидит целая история про людей, которые организовались против того, что их не трогает и не кончается. Хорошо сделаны и глаза-черви: страх помещён не в глаз, а в разглядывание — «вроде нормальный зрачок. Но если пригляделся». Это работает, и это дешевле любого описания чудовища. И отдельно — просьба «уникальный особенности, я для них не придумал помоги», которая стоит не в комментарии, а внутри самого определения расы и потом переезжает вместе с ним при дословном повторе. Сильнейшие существа мира описаны через то, чего у них нет, и это единственная их черта, которая точно не изменится.</p></div>", "r": []}];</script>
