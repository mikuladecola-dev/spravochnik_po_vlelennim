<script>const BASE="";const DOCNAME="Бригадир";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0263-S01", "PS-0263--proishozhdenie"], "h": "<p>Персонаж появляется в единственной версии — сплошным текстом Славы (2025-05-02, id 323364–323370, окно w0089), вселенная Нимб. Текст написан как монолог от первого лица: рассказчик — Иван Васильевич, бывший дровосек, а Бригадир проходит через весь рассказ как его начальник. Собственного имени у Бригадира в тексте нет ни разу, он назван только по должности.</p>\n<p>Рассказчик описывает исходную обстановку так: бригада лесорубов из 8 человек, законная рубка леса, выезд в тайгу «как-то осенью», «где то в октябре», участок рядом с горой, «а в это горе было много пещер. Природный пещеры вроде как». Бригадир — начальник этой бригады, он же тот, кто отвечает за людей перед кем-то выше: «Лучше сразу езжай нежели с тобой, что здесь случиться. Потом же мне отвечать».</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0263-S02", "PS-0263--vneshnost"], "h": "<p>Прямого описания внешности нет. Единственная деталь — возраст, названный косвенно, в сцене бегства к лагерю: он забирается на дерево «быстро так словно не 50 летний мужик, а малец какой» (id 323366). Отсюда и его определение как мужика около пятидесяти.</p>\n<p>Курит: в двух сценах он берёт сигарету и закуривает — в разговоре с Иваном Васильевичем вечером перед походом (id 323365) и в разговоре после возвращения бригады, когда считает пострадавших (id 323367).</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0263-S03", "PS-0263--harakter"], "h": "<p>Основная формулировка рассказчика, объясняющая всё поведение Бригадира: «да бригадир всегда был таким человеком, который хочет потушить угли нежели потом тушить пожар. Хороший мужик» (id 323365).</p>\n<p>Из этого же принципа объясняется его неожиданная поддержка похода в пещеру. Когда Игорь, самый младший в бригаде, предлагает сходить в пещеру и остальные отказываются, Бригадир вдруг встаёт на его сторону: «да ладно вы. Поедите быстро да и сходите». Бригада удивилась — «С чего это вдруг наш бригадир такой предлагает». На прямой вопрос Ивана Васильевича вечером он отвечает:</p>\n<div class=\"q\"><p>«место здесь странная. Гнетущая какая-то. Вот тебя, как подкосила»</p></div>\n<div class=\"q\"><p>«не перебивая слушай не только тебя подкосила оглянись все, как не в себе. Вот я и подумал может вам развёлся надо. Всё же лучше эту проблему сразу устранить. Нежели потом расхлебывать»</p></div>\n<p>То есть он замечает состояние всей бригады раньше, чем это заметили сами люди, и поддерживает поход именно как способ снять напряжение заранее.</p>\n<p>Строгий в рабочем разговоре: заметив, что с Иваном Васильевичем что-то не так, он сразу говорит «ты если болеешь езжай домой». Ответ про усталость и возраст его удовлетворил, и он «пошёл своими делами заниматься».</p>\n<p>Скептичен к рассказу о твари. Выслушав сбивчивый пересказ Игоря, не перебивая, он говорит: «вы серьёзно зверька кого-то испугались. Туда наверняка какая нибудь белка залезла или лиса. А вы как дети малый испугались». На возражение Игоря, что там был человек, отвечает рационально: «и что. Человека испугалась. Может пранкер какой. Нынче сейчас же это модное. А если там кто-то застрял и потерялся то надо вызывать МЧС и скорую возможно и полицию». Рассказчик отмечает эффект этого тона на себе: «Всё же после его рационального говора. Мне стало легче».</p>\n<p>Себя в пострадавшие не записывает и не паникует. При построении бригады на дежурство и при бегстве Тохи и Ивана Васильевича в лагерь ночью перепугались все, «Кроме конечно бригадира» (id 323367).</p>\n<p>Считает потери в первую очередь как позор для взрослых мужиков: «как вы так то. Здоровый мужики об ехавших матушку Россию не один раз и где только не побывали и вот так всём в больничку отлететь. Кто узнаёт на смех поднимут».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0263-S04", "PS-0263--sposobnosti"], "h": "<p>Ничего сверхъестественного за ним не закреплено. Единственное отмеченное умение — физическое: он взбирается на дерево быстрее, чем ожидаешь от человека его возраста (id 323366), и в финале спрыгивает с дерева и снова запрыгивает на другое под преследованием твари (id 323370).</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0263-S05", "PS-0263--svyazi-s-drugimi"], "h": "<p><strong>Иван Васильевич</strong> — рассказчик, работник его бригады. Отношения рабочие и при этом доверительные: они вдвоём курят и обсуждают состояние людей, Иван Васильевич докладывает ему список пострадавших. При этом Иван Васильевич сознательно скрывает от Бригадира главное — свой страх, — и сам же на этом настаивает как на своей вине: «Конечно же ничего бригадиру я не сказал баран. Возможно если бы я отодвинул на второй план свою гордыню. И сказал всё как есть. То бригадир бы послушал бы меня. И мы бы уехали оттуда. Возможно, но не точно» (id 323368).</p>\n<p><strong>Игорь</strong> — самый младший в бригаде, инициатор похода в пещеру; Бригадир поддерживает его предложение. После возвращения бригады Игорь единственный внятно докладывает Бригадиру о случившемся, «Сбивчиво запинаясь и яркая жестикулируя», и Бригадир слушает его не перебивая. Игорь же вместе с Мишей отказывается от одиночных дежурств.</p>\n<p><strong>Тоха (Григорий)</strong> — навигатор бригады, у него географическая память: «он может легко ориентироваться в новом городе или лесу». Бригадир ставит его в одну смену с Иваном Васильевичем. Тоха гибнет первым, когда тварь выходит из пещеры к лагерю.</p>\n<p><strong>Миша (Михаил)</strong> — самый крупный в бригаде, «парням винящий в первую очередь себя». Вместе с Игорем отказывается дежурить в одиночку. В бою стреляет в тварь первым.</p>\n<p><strong>Бригада лесорубов</strong> — целое, частью которого Бригадир является; в исходной раскладке 8 человек.</p>\n<p><strong>Фармацевтическая компания</strong> — появляется после событий, звонит бригаде вместо полиции, приезжает лично, берёт показания, даёт подписку о неразглашении с выплатами «как мои 6 зарплат», оплачивает похороны Тохи и медицинские расходы. Связана ли она напрямую с Бригадиром лично — в переписке не сказано, взаимодействие описано от лица рассказчика и про всю бригаду сразу.</p>", "r": []}, {"t": "Что он делает по ходу событий", "a": ["S06", "PS-0263-S06", "PS-0263--chto-on-delaet-po-hodu-sobytiy"], "h": "<p>Порядок действий, как он изложен в тексте:</p>\n<ol>\n<li>Замечает подавленное состояние бригады и поддерживает поход в пещеру как способ «сразу устранить» проблему (id 323364–323365).</li>\n<li>В сам поход не идёт: «Бригадир остался, следить чтобы ничего не украли или ещё чего» (id 323365). Из-за этого он единственный, кто не видел тварь в пещере.</li>\n<li>Когда бригада скатывается с горы и бежит к нему в крови и с криком, он не разбирается, а действует: решает, что за ними бежит настоящий медведь, и запрыгивает на дерево. Уже с дерева пристально смотрит в сторону, откуда прибежали, и допытывается у Ивана Васильевича, что случилось (id 323366–323367).</li>\n<li>Слезает с дерева, отправляет Ивана Васильевича собирать разбежавшихся и вызывает службы. Итог звонка: «позвонил я. Но эти прибудут только завтра. Тайна все же. Удачей будет если в радиусе 100км есть населённый пункты» (id 323367).</li>\n<li>Принимает переданный ему запрет: «вообще то сказали больше не спускаться в пещеру и не искать возможного затерявшего туриста ха». По его словам, запрет мог быть вызван его собственным докладом: «возможно если бы я не сказал, как вы филигранно спустились с горы. То они бы возможно сказали бы нам искать туриста». При этом остаётся указание постоять у входа в пещеру и покричать (id 323367–323368).</li>\n<li>Считает наличные силы. Из восьмерых ходячих пятеро, но себя и Ивана Васильевича он считает иначе: на «пятеро» отвечает «а ну-ка. Четверо. Посмотри на себя. Да у тебя же не одного живого места нет. Да и рана на плече. Сейчас чего-нибудь подцепишь и пиши пропала. Со всеми в больницу поедешь». Итоговая формулировка его же: «так выходит из всей бригады, относительно целых осталось 4 человека» (id 323367).</li>\n<li>Назначает дежурство у пещеры. Сначала хочет ставить по одному, но, получив категорический отказ от Игоря и Миши, идёт на компромисс и ставит по двое: Иван Васильевич с Тохой, Игорь с Михаилом, смена каждый час. Пока одна пара дежурит, вторая охраняет раненых в лагере. Две законные двустволки делятся по одной на группу — изначально хотели отдать всё оружие дежурным, но побоялись оставлять раненых (id 323368).</li>\n<li>В финальной схватке: когда тварь долбит лбом дерево, на котором сидят Иван Васильевич и он сам, и в стволе уже появляется отверстие, Бригадир сначала удерживает падающего Ивана Васильевича — «Он удержал мою тушу от падения. И упëр на ветку». Затем «бригадир спрыгнул. Просто взял и спрыгнул. И начал с матюками бежать к другому дереву. При этом махая руками, как видимо пытаясь привлечь это паскуду». Тварь переключается на него, он успевает запрыгнуть на дерево, и в этот момент по твари бьют из двух двустволок (id 323370).</li>\n</ol>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0263-S07", "PS-0263--chto-s-nim-stalo"], "h": "<p>Выживает. Погибает в этих событиях только Тоха. Твари в итоге ломают все кости всей толпой, после её крика со стороны горы отвечают десятки, «если не сотни тварей», и бригада уезжает — «на удивление быстро смогли уехать без потерей».</p>\n<p>Что с Бригадиром было дальше, после отъезда, подписки о неразглашении и выплат, в тексте не сказано. Рассказ ведётся Иваном Васильевичем спустя время, ему уже ампутировали руку, и о судьбе Бригадира он не говорит.</p>", "r": []}, {"t": "Как менялся", "a": ["S08", "PS-0263-S08", "PS-0263--kak-menyalsya"], "h": "<p>Версия одна, состояние одно: 2025-05-02, id 323364–323370. Между версиями персонаж не переписывался, отклонённых вариантов в переписке нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S09", "PS-0263-S09", "PS-0263--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имя и фамилия не названы — только должность «бригадир».</li>\n<li>Внешность не описана вообще, кроме косвенного «не 50 летний мужик».</li>\n<li>Прошлое, семья, откуда он в бригаде — не сказано.</li>\n<li>Кому именно он «потом отвечать» будет за пострадавшего работника — организация не названа.</li>\n<li>Куда именно он звонил («вызову какого надо», «эти прибудут только завтра») — конкретная служба не названа; названы только МЧС, скорая и полиция как варианты, которые он перечислял вслух.</li>\n<li>Каких-либо сверхъестественных способностей за ним не закреплено; относится ли он к какой-либо системе способностей вселенной — в переписке не сказано.</li>\n<li>Его собственная реакция на тварь после того, как он её увидел вживую, отдельно не описана — он показан только в действиях.</li>\n<li>Дальнейшая судьба после отъезда из тайги осталась нерешённой.</li>\n<li>Иван Васильевич, Игорь, Тоха (Григорий), Миша (Михаил) и бригада лесорубов в исходнике идут без id — только по именам.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0263--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0073.html\">Бригада лесорубов</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0073.html\">Бригада лесорубов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0263--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-05-02</td>\n<td>323364–323370</td>\n<td>w0089</td>\n<td>Нимб (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0263-brigadir.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0263--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0263.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
