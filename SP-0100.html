<script>const BASE="";const DOCNAME="знающий";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0100-S01", "SP-0100--mehanika"], "h": "<p>«Знающий» — одна из двух ролей в списке «принципы материализации и её продуктов», выложенном Миколаем целиком одним сообщением (2024-08-12, id 218392). Вторая роль — родитель. Родитель задаёт монстра, знающий его материализует.</p>\n<p>Условия, при которых человек считается знающим, даны в списке дословно так:</p>\n<ul>\n<li>«1.2.1. знает от родителя о монстре и верит что он существует»</li>\n<li>«1.2.2. испытывает сильную эмоцию при мыслях о монстре(КПТ на полную)»</li>\n<li>«1.2.3. описывает галлюцинации связанные с монстром»</li>\n</ul>\n<p>Роль знающего сформулирована отдельной строкой: «напрямую материализует в мистическом пространстве монстра посредством накопления образов из галлюцинаций. может влиять на характер и образ монстра, но на поверхностном уровне».</p>\n<p>Для сравнения, роль родителя в том же списке: «определяет внешность, мотивы, характер и иные характеристики монстра на фундаментальном уровне». Разделение проведено по глубине: родитель — фундаментальный уровень, знающий — поверхностный.</p>\n<p>Сила материализации разделена на количество и качество знающих.</p>\n<p>Количество (пункт 2.1, при выполнении всех условий пункта 1):</p>\n<ul>\n<li>«2.1.1. чем больше знающих, тем больше возможностей для взаимодействия с материальным и духовным миром есть у монстра.»</li>\n<li>«2.1.2. при минимальных условиях, что чаще всего, монстр минимально может взаимодействовать с миром духов при 10 знающих»</li>\n<li>Комментарий к разделу: «всегда идет стремление к идеалу. в идеале монстр может полностью взаимодействовать в духовным и реальным миром, а также совершать манипуляции различного характера на всех уровнях соответствующие его мотивам»</li>\n</ul>\n<p>Качество (пункт 2.2):</p>\n<ul>\n<li>«2.2.1. сила реализации мотивов геометрически пропорциональна силе вклада знающих»</li>\n<li>«2.2.2. сила способностей геометрически пропорциональна эмоциям знающих»</li>\n</ul>\n<p>То есть мотивы монстра питаются вкладом знающих, а способности — их эмоциями; зависимость в обоих случаях названа геометрической.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0100-S02", "SP-0100--ogranicheniya-i-cena"], "h": "<ul>\n<li>Порог: до десяти знающих монстр, при минимальных условиях, не взаимодействует даже с миром духов. Оговорка «что чаще всего» стоит в оригинале — то есть минимальные условия считаются обычным случаем.</li>\n<li>Главное ограничение — обнуление вклада: «качество вклада знающего обнуляется если он начинает рационализировать силу своих и чужих влияний». Правило приведено в списке отдельной строкой-комментарием и позже повторено Миколаем дословно в споре (id 218424) как ответ на попытку накрутить веру.</li>\n<li>Знающие не поддерживают жизнь монстра сами по себе — она держится на родителе: «жизнь существа поддерживается родителем, если его не будет или он изменит мотивы, монстр навсегда исчезнет если развеять форму даже если остались знающие».</li>\n<li>При этом отсутствие знающих тоже смертельно: «при отсутствии знающий жизнь также перестаёт поддерживаться». (В исходном списке этот пункт имеет тот же номер 4.4, что и предыдущий.)</li>\n<li>Материализованный монстр в принципе слабый, и это оговорено как свойство типа: «тип материализованых монстров слабый, я не хочу с этим ебаться, ты мя зачмырил за силу, их сильными сделать тяжело», «ты же понимаешь что он слабый», «они всегда слабые» (2024-08-12, id 218417–218423).</li>\n<li>Монстра нельзя показать через технику: на вопрос, видят ли его камеры, ответ прямой — «ты серьёзно думаешь камеры его видят», «нет», «нихуя» (id 218404–218407).</li>\n</ul>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0100-S03", "SP-0100--nositeli"], "h": "<p>Роль знающего носит человек, а не монстр. Конкретные знающие в переписке не названы — ни одного имени.</p>\n<p>Названы только категории, попавшие в разговор по касательной: «или взрослые в чью жизнь вмешался злой дух» (id 218412) — реплика брошена посреди спора и не развёрнута.</p>\n<p>Сопряжённая роль — родитель, требования к которому в том же списке: обладает представлением о монстре (характеристики, характер, история), имеет в воображении его образ (внешность, способности, ограничения), «имеет желание которое не может реализовать», «хочет встретить это существо».</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0100-S04", "SP-0100--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-08-12 (id 218383–218396).</strong> Выложен полный список «принципы материализации и её продуктов» (id 218392, 16:54). В нём определена роль знающего, порог в десять знающих для взаимодействия с миром духов, геометрическая зависимость мотивов от вклада и способностей от эмоций, обнуление вклада при рационализации. Тут же вокруг знающего лежат общие определения: материализованный монстр — «дух действующий в соответствии с один мотивом и сценарием сформированным консенсусом хаоса», «существо создание коллективным бессознательным»; злым дух становится «после первого нарушения одной заповеди» и реализует мотивацию родителя аморальными методами.</p>\n<p>Первая реакция Славы — сразу против ключевого элемента: «Во всех этих правилах мне не нравится именно вера других людей» (id 218394). Его довод: «Типо злой челик решит показать своего монстра по телеку или Ютуб и все начнут в него верить», «И моснстор сразу может стать бог» (id 218395–218396).</p>\n<p><strong>Версия 2 — 2024-08-12, 17:02–17:08 (id 218398–218430).</strong> Спор о накрутке веры. Слава предлагает способы разогнать число знающих: «Показать монстра в центре большого города или прямой эфир», «Или пусть он разрушит город», «Поймать он материален, и показать», «Ну показать в центре города он станет сильней и сможет уничтожить город». Аргумент опирается на материальность: «Он материален ты сам писал».</p>\n<p>Миколай отбивается двумя ходами: монстра не видят камеры, и — повтором правила про обнуление: «опять всё упирается в качество», «качество вклада знающего обнуляется если он начинает рационализировать силу своих и чужих влияний» (id 218399, 218424). Сама формулировка правила при этом не менялась — она процитирована из версии 1 без изменений.</p>\n<p><strong>Версия 3 — 2024-08-12, 17:08–17:10 (id 218426–218438).</strong> Слава заходит с другой стороны: убрать веру целиком. «Ну тогда давай веру уберем, что бы они не были слишком сильными», «Что бы сила зависла от родителя» (id 218426, 218430). Миколай отказывается: «нужна зависимость от других людей» (id 218433). Довод против: «че каждый мелкий еблан создаст себе убийцу вселенной и всё», «залупа это». Итоговая позиция на конец обсуждения — «надо всё усложнить» (id 218438).</p>\n<p>В этой же версии (id 218431) Миколай выкладывает развёрнутый текст с предложением заменить термин: вместо «веры» — «принятие идеи» или «интеграция образа», где знающие не верят в традиционном смысле, а «Воспринимать идею о монстре как возможную реальность», «Интегрировать образ монстра в свою картину мира», «Эмоционально реагировать на концепцию монстра», «Активно обдумывать и обсуждать идею монстра». Акцент по этому тексту смещается «с религиозной или мистической веры на психологический процесс принятия и интеграции новой информации». Текст оформлен как ответ на чужое беспокойство («Я понимаю ваше беспокойство по поводу использования термина \"вера\"») и по стилю выбивается из переписки. Слава на содержание не отвечает, реагирует на другое: «Так ты сам говоришь что не хочешь заморачиваться». Принята эта замена или нет — в переписке не сказано; в дальнейших репликах Миколай продолжает говорить «вера».</p>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S05", "SP-0100-S05", "SP-0100--otklonennye-varianty"], "h": "<ul>\n<li><strong>Убрать веру знающих вовсе, оставить зависимость силы только от родителя</strong> (Слава, id 218426, 218430). Отклонено Миколаем: «нужна зависимость от других людей», иначе «каждый мелкий еблан создаст себе убийцу вселенной».</li>\n<li><strong>Убрать ограничение видимости</strong> — «Давай нафиг уберем в ограничений видения» (Слава, id 218415). Не принято; Миколай остаётся на том, что камеры монстра не видят и что монстры «всегда слабые».</li>\n<li><strong>Разгон числа знающих через прямой эфир, телевидение, YouTube, разрушение города на публике</strong> (Слава, id 218395, 218400–218401, 218411, 218422). Отклонено двумя правилами сразу: монстр не попадает в камеру, а вклад обнуляется при рационализации.</li>\n<li><strong>Замена термина «вера» на «принятие идеи» / «интеграцию образа»</strong> (Миколай, id 218431). Предложена, ответа по существу не получила, в списке правил не закреплена.</li>\n</ul>", "r": []}, {"t": "Связь с другими способностями", "a": ["S06", "SP-0100-S06", "SP-0100--svyaz-s-drugimi-sposobnostyami"], "h": "<ul>\n<li>Знающий — часть «принципов материализации и её продуктов»; отдельно от этого списка роль не существует.</li>\n<li>Родитель — вторая роль в том же списке. Разделение: родитель задаёт монстра на фундаментальном уровне и держит его жизнь, знающий материализует и влияет поверхностно. Без родителя знающие бесполезны — монстр исчезнет навсегда, «даже если остались знающие».</li>\n<li>Злой дух — состояние монстра после «первого нарушения одной заповеди»; к роли знающего в переписке напрямую не привязано, кроме брошенной реплики про «взрослых в чью жизнь вмешался злой дух».</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S07", "SP-0100-S07", "SP-0100--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Ни один знающий по имени не назван.</li>\n<li>«Заповеди», нарушение которых делает духа злым, не перечислены — ни одна.</li>\n<li>Не сказано, что такое «сила вклада» знающего и чем она измеряется, в отличие от эмоций.</li>\n<li>«Геометрически пропорциональна» не расшифровано: ни основания, ни шкалы.</li>\n<li>Не сказано, что происходит между 1 и 10 знающими — есть ли у монстра что-то до порога.</li>\n<li>Не сказано, как обнуление вклада отменяется и обратимо ли оно: если знающий однажды начал рационализировать, может ли он вернуться.</li>\n<li>Не сказано, как знающий узнаёт, что галлюцинации связаны именно с этим монстром, и чем описание галлюцинаций отличается от простого рассказа.</li>\n<li>Не сказано, может ли знающий стать родителем и наоборот.</li>\n<li>Не объяснено, почему монстра не видят камеры, если он материален. Возражение Славы «Он материален ты сам писал» осталось без разбора.</li>\n<li>Двойная нумерация 4.4 в исходном списке не исправлялась.</li>\n<li>Замена «веры» на «принятие идеи» осталась нерешённой; спор оборван на «надо всё усложнить».</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["SP-0100--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-12</td>\n<td>218383–218396</td>\n<td>w0052</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-08-12</td>\n<td>218398–218430</td>\n<td>w0052</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-08-12</td>\n<td>218426–218438</td>\n<td>w0052</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0100-znayuschiy.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0100--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0100.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
