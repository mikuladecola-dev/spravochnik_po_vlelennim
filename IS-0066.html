<script>const BASE="";const DOCNAME="Бетонный герой";
const LEAD="";
const CH=[{"t": "Содержание", "a": ["S01", "IS-0066-S01", "IS-0066--soderzhanie"], "h": "<p>Под названием «Бетонный герой» в переписке существуют два разных текста Славы, написанных с промежутком почти в месяц. Первый (2025-08-08, id 354014–354018) — набросок про мир после ухода людей с Земли; второй (2025-09-04 — 2025-09-15, id 361477–365421) — история про человека, который просыпается с похмелья в мире из сплошного бетона. Второй текст носит подзаголовок «Глава пробуждения» и в шапке записи зафиксирован как вариант имени. Прямой связи между двумя текстами в переписке не проведено — Слава только говорит после первого наброска: «Ну скоро на эту тему будет другой набросок а может и полноценная история» (id 354018).</p>\n<h3>Набросок 2025-08-08</h3>\n<p>Вступление: «Много лет назад людям пришлось покинуть землю. Причины неизвестные или их скрывают». Причины скрывают из страха, что народ, узнав правду, «Больше не будут их восхвалять, как спаситель. Как героев, что однажды спасли множество жизни». Раньше эти герои «и правда выглядели мужественно и устрашали своим видом все проблемы», но спустя много поколений «Герои стали большее похожие на жирных свиней, что раздают всем указания». Их любимая фраза — «Работа найдётся для всех», при этом о зарплате не говорится, а работа для неумехи — «стать пушечным мясом, который самовозглашают себя защитниками. Хотя защищают они лишь толстый задницы героев».</p>\n<p>Глава 1. Двое беспризорных мальчишек стоят у ржавых перил и смотрят вверх. Худощавый синеглазый мальчишка говорит: «говорят небо красивое», ссылаясь на «старрршшшиков». Рыжеволосый друг отвечает скучающе — ему безразличны небо и земля, его занимает только пустой желудок, который «скручивался, давил выжимал кислоты и продолжил переваривать самого себя». Синеглазый пересказывает: «они говорили небо было синим, а рядом с ним летали белые, как ангелы облака», — и тянется вперёд через перила, высматривая синеву в сером от туч и дыма небе. Рыжеволосый обрывает: «ну дурак и ты серьезно им поверил. Они даже не родились на земли, откуда им знать, как было раньше».</p>\n<p>Мир вокруг: заводы «на каждом шаге», от которых не убежать, они дымят и отравляют «и так убитую планету», но без них и без технологий, производящих кислород, человечество здесь жить не смогло бы. Пол везде бетонный.</p>\n<p>Синеглазый перевешивается через перила и едва не падает; рыжеволосый успевает подхватить его за талию и втянуть обратно, при этом собственное тело плохо держит его от голода. Оба падают на холодный пол. Из разговора выясняется имя: Святослав, которого «конечно же не кто не звал» полным именем — «Просто Свят и все, что нужно для брошенного ребёнка». Рыжеволосый закрывает тему словами: «какой нахрен небо. Мы с тобой не на Земле. Так что забудь уже. Лучше пошли поесть найдём, а то помираю».</p>\n<p>Дальше — сцена погони: мальчишки крадут с прилавка кусок хлеба, торговец («жилистый мужчина», он же «жирдяй») с криком «ЛОВИТе ВОРА!» гонится за ними через толпу, улицы сужаются, спрятаться негде. Он уже тянет руку к рыжеволосому, но его опережает «Неизвестная мозолистая рука», которая хватает мальца, а торговец падает и катится по бетонному полу. На этом набросок обрывается: «Это набросок, который я не продолжу» (id 354016).</p>\n<h3>История 2025-09-08 (четыре главы)</h3>\n<p>Повествование от первого лица.</p>\n<p><strong>Глава пробуждения.</strong> Рассказчик приходит в себя с тяжёлого похмелья на сухом бетонном полу: «Голова раскалывалось словно я не напился, а получил удар молотком не единожды, а в горле засуха с привкусом прогнившего языка». Вслепую ищет, что выпить, ничего не находит. Открыв глаза, видит не окно, а «просто отверстия, в котором должно было быть окно» — «просто пробел из которого светила ярким светом». Помещение пустое: только бетонные стены и проёмы без окон и дверей, «Словно я находился на заброшке, либо стройке». Первая мысль — что их сюда привёл Дима, школьный друг и любитель заброшек.</p>\n<p>Встать после похмелья тяжело; рассказчик отмечает, что раньше никогда не доходило до того, чтобы наутро не мочь нормально ходить и ничего не помнить. Выйдя в коридор, он не находит ни вёдер, ни инструментов, ни мусора, ни граффити, ни шприцев — ничего, что указывало бы на стройку или заброшенность: «здесь до ужаса чисто и ничего нет». Пыль при этом лежит везде несколькими слоями, будто здесь никого не было «наверное несколько десятков лет», — и только в комнате, где он очнулся, пыли нет. Воздух «за стоявшим и абсолютно сухим, мёртвым без влаги, словно ветер не как не мог суда попасть». Жажда нарастает, цель — выбраться и купить воды. Лестница бетонная, пыльная, без перил. Спускается быстро: этаж оказывается всего третьим.</p>\n<p>Выйдя наружу, он видит бетонные здания без окон и дверей, покрытые многолетней пылью, ни лавочек, ни травы, ни зелени. Главное — неба нет: «Была лишь бетонный потолок. Он закрыл всё, абсолютно все». Свет дают лампы, торчащие везде — на потолке, на бетонных сооружениях, даже в полу: «Словно создателю было без разницы». И та странность, которую он раньше не мог назвать, — тишина: «Абсолютная и всепоглощающая тишина. Здесь не было никакого звука абсолютно. Не было песни птиц, звук машин, шаги людей».</p>\n<p><strong>Глава страх.</strong> Первая реакция — версия про пранк, за которую он хватается «словно ухватился за спасательную соломинку», и тут же сам её отбрасывает: никто столько не потратится, и здесь нет ни одной камеры. Начинается паническая атака: воздух «словно стал ещё плотнее, ещё твёрже, как будто бы кисель», сердце бьётся так, будто ловушкой для него стала собственная плоть, которую оно пытается пробить. Голова кружится, мир плывёт, он падает на пол. Из густых неясных мыслей ловит одну ясную — «надо успокоиться», — переворачивается на спину, закрывает глаза и выравнивает дыхание: «Вдох...выдох..вдох...выдох».</p>\n<p>Придя в себя, вспоминает: в пятницу собрались у Димы с Димой и Лёхой и начали пить. Дальше — провал: «Я после первой бутылки ничего не помню - это же ненормально. До этого я пил ещё больше и при этом всё до мелочей помнил. Так почему меня вырубила?» Разглядывая потолок, край которого не виден, думает, что если он упадёт, то разрушит здесь всё, и вспоминает предсказания гадалок про 2000 год и падение неба: сейчас это было бы кстати — «тогда я увижу свободу». Ставит себе цель: подняться на верх здания и осмотреться, поискать стену или выход и заодно поискать друзей. «Когда передо бой стоит чёткая цель и направления. То паника и ужас от безвыходности. Нет не пропадает, но ослабляется».</p>\n<p><strong>Глава неба.</strong> Подъём по очень длинной лестнице, с обходом каждого этажа в поисках друзей. Крикнуть он не решается: «кричать в абсолютной тишине было, как-то страшно и странно. Словно я нарушу, какую ту гармонию, порядок, который нарушать не стоила». Мимоходом отмечает странность самих зданий: в его мире дом не бывает чисто из бетона, должна торчать проводка или лежать кирпичи. Тело сдаёт: ноги забиваются, желудок скручивает от голода, но главное — жажда, горло засохло и стало шершавым. Он прикидывает, что без воды живут около трёх дней, а он после пьянки продержится меньше, и не знает, сколько пролежал в комнате — «день или месяц». Один раз он вскрикивает сам себе «Так стоп!» громче, чем ожидал, замирает и прислушивается — ни эха, ни ответа: «Словно это место просто поглотила моей звук». На последних этажах поиски друзей бросает.</p>\n<p>На крыше — ничего. Тот же бетон, ни ветерка, тот же застоявшийся воздух. Вывод: «Словно кто-то попытался повторить мой мир. Мир в котором я жил. Но это лишь имитация. Жалкая поганная попытка создать мой мир». У этой пародии нет конца: бетонные столбы с сияющими отверстиями, свет, «что поглотил, всё что не смог поглотить бетон», горизонт серый и жёлтый, «словно детский рисунок ребёнка». Потолок, до которого не дотягивается ни один столб, сопоставляется с представлением предков о небе «как о слое. Как о чем то твёрдом и физическим» — в его реальности это было не так, а здесь бетонный потолок, с которого пыль сыплется, как снег, «был настоящим». Глава заканчивается вопросом: «Что же делать в этом безграничном мире ?»</p>\n<p><strong>Глава надежда?</strong> Выхода нет, он видел это своими глазами. Мелькает мысль, что надо было спрыгнуть с крыши, — сейчас у него уже не хватит сил снова подняться. Он идёт по бетонным улицам, «словно не выходил из здания», чувствует, как организм сохнет изнутри, ноги в стёртых мозолях. Садится отдохнуть, отказываясь сдаваться: «Нет я не сдамся, как минимум не сейчас». Бетонный мир навевает воспоминания о детстве, и он уходит в них.</p>\n<p>Воспоминание: до школы он гулял с друзьями с одной площадки — четыре квартиры, четыре ребёнка, все одного возраста: Дима, Лёха, Андрей и он сам. Друг от друга особо не отличались: «Как никак в детстве особо характер ещё не сформировался. Были лишь желания и инстинкты. В детстве больше всего были похоже на зверей». Уже тогда у Димы было пристрастие к заброшкам, и он нашёл заброшенный дом, «большое и бетонные ха-ха». Рассказчик замечает совпадение: «В этом напрочь бетонным мире. Воспоминания только о таком же сером бетоне. Ну и ладно, ну и пусть». На этом присланный текст обрывается.</p>", "r": []}, {"t": "Персонажи", "a": ["S02", "IS-0066-S02", "IS-0066--personazhi"], "h": "<h3>Набросок 2025-08-08</h3>\n<ul>\n<li><strong>Свят (Святослав)</strong> — худощавый мальчишка с «красиво синими» глазами и волосами «мусорная коричневый» цвета. Беспризорник. Верит рассказам старших про синее небо и белые облака, тянется через перила высматривать небо. Полным именем его никто не зовёт: «Просто Свят и все, что нужно для брошенного ребёнка».</li>\n<li><strong>Рыжеволосый мальчишка</strong> — имя в тексте не названо. Второй беспризорник, единственный друг Свята. Ему безразличны небо и красота, занят только голодом. Злится на друга, понимая, что гнев вызван не наивностью друга, а болью в желудке. Спасает Свята от падения. Обрывает разговор о небе фразой «Мы с тобой не на Земле».</li>\n<li><strong>Старшики</strong> — те, кто рассказывает детям про синее небо; по словам рыжеволосого, сами на Земле не родились.</li>\n<li><strong>Торговец</strong> — жилистый мужчина, гонящийся за мальчишками из-за куска хлеба; сравнивается со свиньёй и кабаном.</li>\n<li><strong>Обладатель «неизвестной мозолистой руки»</strong> — некто, кто перехватывает рыжеволосого раньше торговца. Кто это, в наброске не сказано: текст обрывается на этом месте.</li>\n<li><strong>«Герои»</strong> — правящие потомки тех, кто вывел людей с Земли. Как персонажи не выведены, описаны только во вступлении.</li>\n</ul>\n<h3>История сентября 2025</h3>\n<ul>\n<li><strong>Герой-рассказчик</strong> — имя не названо. Повествование от первого лица. Просыпается с похмелья, страдает от жажды и голода, переживает паническую атаку и справляется с ней дыханием, ставит себе цели, чтобы не поддаваться ужасу. Из его биографии известно: школьный друг Дима, компания четырёх детей с одной площадки в детстве, привычка выпивать (раньше пил больше и всё помнил).</li>\n<li><strong>Дима</strong> — друг ещё со школы и с детской площадки, «любитель подобных мест. Заброшек я имею ввиду». У него в пятницу собирались пить. В детстве нашёл большой бетонный заброшенный дом.</li>\n<li><strong>Лёха</strong> — друг с той же площадки, один из троих, с кем герой пил в пятницу.</li>\n<li><strong>Андрей</strong> — четвёртый ребёнок с площадки. В сцене с выпивкой не упомянут: в пятницу были Дима, Лёха и рассказчик.</li>\n</ul>\n<p>Ни Дима, ни Лёха, ни Андрей в самом бетонном мире не появляются — герой ищет их по этажам и не находит.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "IS-0066-S03", "IS-0066--mesto-vo-vselennoy"], "h": "<p>В шапке записи вселенная указана как «Апостол», но это проставлено по дате объявления, а не по словам авторов. В переписке вселенная не называется ни разу, и в неясностях зафиксировано по всем трём окнам: «вселенная нигде не названа; неясно, связана ли история с чем-то ранее придуманным» (w0102), «Вселенная не объявлена; похоже на отдельную историю без мира» (w0103), «вселенная не объявлена; друзья героя Дима, Лёха, Андрей — только внутри текста» (w0104). У версии 4 вселенная помечена как «неясно».</p>\n<p>Связь между августовским наброском и сентябрьской историей прямо не установлена. Общее в них — бетон как материал всего окружения и мотив отсутствующего или подменённого неба, но в переписке это соответствие не проговорено ни Славой, ни Миколаем.</p>\n<p>Как отдельные сущности к истории привязаны: Бетонный мир, Мир Бетонного героя, Герой-рассказчик (Бетонный герой), Дима, Лёха и Андрей, Рыжеволосый мальчишка, Свят.</p>", "r": []}, {"t": "Состояние", "a": ["S04", "IS-0066-S04", "IS-0066--sostoyanie"], "h": "<p>Оба текста брошены незаконченными, и оба раза автор сказал об этом сам.</p>\n<p><strong>2025-08-08 (id 354014–354032).</strong> Слава скидывает набросок двумя сообщениями и сразу помечает: «Это набросок, который я не продолжу» (id 354016). Спрашивает: «Просто скажи я лучше начал писать?» (id 354017) и обещает: «Ну скоро на эту тему будет другой набросок а может и полноценная история» (id 354018). Реакция Миколая (id 354029): «грамматических ошибок стало меньше стиль стал богаче и интереснее, впрочем, ты всегда писал довольно интереснее, но сейчас выходят насыщенные и красивые, пусть и несколько пустые(чисто для количества, а не сюжета. хотя может для описания окружения они справедливы) описания. я прочитал всё, но понял не много. всё ещё трудно воспринимать текста. но, мне нравится». Далее — «Спасибо» / «и тебе спасибо, что делишься».</p>\n<p><strong>2025-09-04 (id 361477–361479).</strong> Анонс: «Пишу историю», «Я и не знаю она будет длинная или короткая», «Бетонный герой». Название закреплено, объём на этот момент неизвестен.</p>\n<p><strong>2025-09-08 (id 362520–362532).</strong> Слава сообщает: «Не могу закончить историю», «Че делать», «Начал хорошо», «Но дальше лень». Спрашивает, кидать ли черновик, Миколай отвечает «кидай я на паре». Черновик приходит четырьмя сообщениями (id 362528–362531) и содержит четыре главы: «Глава пробуждения», «Глава страх», «Глава неба», «Глава надежда?». Вопрос «Че делать» остался без ответа по существу — обсуждение сразу уходит в сторону (id 362532: «Кстати мне это китайская Нейра не нравится»).</p>\n<p><strong>2025-09-15 (id 365401–365421).</strong> Тот же текст пересылается заново, теперь четырьмя сообщениями от Миколая (id 365401–365404) — «так удобнее будет». Первичная публикация текста при этом остаётся за 2025-09-08. Миколай замечает: «будто нейронка пишет но красиво» (id 365406). Слава реагирует резко: «Идти нахуй я сам написал», «Всё там я написал», «Без редакции нейресети» (id 365407–365409). Миколай отвечает: «круто», «я знаю», «я в этом более чем уверен», «серьёзно, абсолютно не сомневаюсь», «просто я от нейронки испытывал такое чувство при прочтении образов» (id 365410–365414). Слава: «Знаешь когда ты так говоришь несколько раз у меня возникает сомнения в твоё уверенности» (id 365415). Разговор закрывается смехом и «расслабься». Отдельное замечание Миколая по темпу: «как же перс медленно всё делает» (id 365418), на что Слава: «А ты че хотел у него похмелья» (id 365419), и Миколай: «ну да», «и круто что так» (id 365420–365421).</p>\n<p>Продолжения после 2025-09-15 в переписке нет. Записанных версий — четыре, диапазон дат 2025-08-08 — 2025-09-15, окна w0102, w0103, w0104.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "IS-0066-S05", "IS-0066--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вселенная нигде не объявлена. Отнесение к «Апостолу» стоит по дате, а не по словам авторов; у версии 4 вселенная помечена как «неясно».</li>\n<li>Связь августовского наброска и сентябрьской истории в переписке не проговорена. Обещанные «другой набросок а может и полноценная история» на ту же тему прямо ни с чем не отождествлены.</li>\n<li>Имя героя-рассказчика не названо.</li>\n<li>Имя рыжеволосого мальчишки из наброска не названо.</li>\n<li>Кто такой обладатель «неизвестной мозолистой руки», перехвативший рыжеволосого, — не сказано, набросок обрывается на этой фразе.</li>\n<li>Причина, по которой люди покинули Землю, в наброске обозначена как неизвестная или скрываемая; чем она была на самом деле, не раскрыто.</li>\n<li>Где происходит действие наброска — какой это мир, если «Мы с тобой не на Земле», — не сказано.</li>\n<li>Природа бетонного мира не объяснена: кто его создал, зачем, откуда там лампы и пыль. В тексте есть только догадка героя, что это «имитация», «Жалкая поганная попытка создать мой мир», и упоминание некоего «создателя», которому «было без разницы», где ставить лампы.</li>\n<li>Почему герой отключился после первой бутылки и как попал в бетонный мир — не объяснено, вопрос поставлен внутри текста и оставлен без ответа.</li>\n<li>Почему в комнате пробуждения нет пыли, хотя везде она лежит слоями, — отмечено самим героем («Но что это даёт ни-че-го») и не объяснено.</li>\n<li>Судьба Димы, Лёхи и Андрея в бетонном мире не выяснена: герой их ищет и не находит, поиски бросает.</li>\n<li>Дальнейшая судьба героя не написана: текст обрывается на воспоминании о детстве. Как автор собирался заканчивать — не сказано; вопрос «Не могу закончить историю. Че делать» остался нерешённым.</li>\n<li>Отклонённых вариантов, обсуждений устройства мира или планов на продолжение в переписке нет — обсуждение обеих версий свелось к оценке стиля и к спору о том, не нейросеть ли это писала.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["IS-0066--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-08-08</td>\n<td>354014–354032</td>\n<td>w0102</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-09-04</td>\n<td>361477–361479</td>\n<td>w0103</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-09-08</td>\n<td>362520–362532</td>\n<td>w0103</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-09-15</td>\n<td>365401–365421</td>\n<td>w0104</td>\n<td>неясно (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/istorii/IS-0066-betonnyy-geroy.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["IS-0066--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/IS-0066.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["IS-0066-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/IS-0066/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>По цифрам здесь чинить нечего вовне. На саму статью никто не ссылается (ssylok_na_nego = 0), и все, кто в ней действует — Свят (<code>PS-0286</code>), рыжеволосый мальчишка (<code>PS-0287</code>), Дима (<code>PS-0050</code>), Лёха с Андреем (<code>PS-0292</code>), сам безымянный рассказчик (<code>PS-0291</code>) — уже получили свои статьи. Это тупиковый узел базы, не блокирующий ничего вокруг себя; если выбирать, куда вложиться в первую очередь во всём справочнике, — не сюда.</p>\n<h3>С чего начать</h3>\n<p>И архив, и база тут, судя по всему, выбраны до дна. Продолжения после 15 сентября в переписке нет, это в статье уже проверено и зафиксировано. Единственное, что теоретически можно свериться — материал у <code>PS-0291</code> и <code>PS-0292</code> (24015 и 23963 знаков) сам по себе не крупнее того, что уже вошло в эту статью, так что нового там вряд ли найдётся. Реального адреса для поиска недостающего — нет.</p>\n<h3>Как развивалось</h3>\n<p>8 августа набросок заявлен и в тот же день брошен: «Это набросок, который я не продолжу», с обещанием — «скоро на эту тему будет другой набросок а может и полноценная история». 4 сентября — новое заявление под тем же названием, без единого слова о том, продолжение ли это обещанного. 8 сентября — текст написан и снова брошен: «Не могу закончить историю. Че делать». 15 сентября — не продолжение, а пересылка того же куска заново, и вместо ответа на вопрос «че делать» — спор о том, не нейросеть ли это писала.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>В наброске названа причина, по которой правители скрывают правду об уходе с Земли, — страх потерять почёт: «больше не будут их восхвалять, как спаситель». В истории про бетонный мир герой упирается в аналогичный по типу вопрос — кто построил этот мир и зачем — и даже формулирует догадку («имитация», «жалкая попытка создать мой мир», «создателю было без разницы»), но мотив создателя, в отличие от мотива правителей в наброске, никак не сформулирован — ни как факт, ни как гипотеза героя.</p>\n<h3>Отклик</h3>\n<p>Зацепил контраст: похмелье, паническая атака, счёт вдохов и выдохов — это написано плотно и узнаваемо, как реальное тело в реальном ужасе, а вокруг — абсолютно абстрактный бетонный мир без единой зацепки за причину. Именно от этого столкновения бытового и необъяснимого текст держится, а не от самого бетона.</p></div>", "r": []}];</script>
