<script>const BASE="";const DOCNAME="Чёрная изнанка";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0150-S01", "MR-0150--ustroystvo"], "h": "<p>Чёрная изнанка — скрытая от обычных людей сторона мира, внутри которой существуют благословенные, одержимые и организации, охотящиеся на одержимых (<a href=\"MR-0149.html\">Организации охотников на одержимых</a>). Название в переписке плавает: в одном сообщении она «чёрная изнанка», в другом, того же дня, — «тёмная изнанка». Оба варианта употреблены автором, ни один не отменён.</p>\n<p>Основное её свойство до определённого момента — секретность: «И всё это держалось в секрете от людей» (2025-09-12, id 364774). Под «всем этим» имеется в виду разобранное перед этим: одержимые, благословенные, охота на одержимых, организации и их финансирование.</p>\n<p>Секретность закончилась одним событием. Апостолы «устроили охоту на одну религиозную организацию по всему миру», причём демонстративно: «И делали они это особо не скрываясь. Да какой там скрываться. Они могли в центре города разнести церковь или многоэтажку которая принадлежал той организации. Апостола ещё могли публично устроить казнь десятков а то и сотни людей ( работников этой организации)».</p>\n<p>Масштаб огласки объясняется масштабом жертвы: «А так как организации было одной из самых крупных организации связанный с благословенными. То апостол знатно пошумели на весь мир. Раскрыв существование тёмной изнанки».</p>\n<p>Немедленные последствия раскрытия перечислены: «Конечно началась паника, массовая истерия, гражданский войны и множеств других пагубных вещей».</p>\n<p>Долгие последствия — нет. Мир вернулся в норму: «Ну по итогу всё устаканилось и всё продолжили жить как жили. Изменилось только три вещи.»</p>\n<p>Три изменения:</p>\n<ol>\n<li>Договор: «было подписан публичный договор обозначающий права и обязанности благословенных. А также их не я, не участия в военных конфликтах». Оборот «их не я» в исходнике сбит и не расшифрован.</li>\n<li>Публичность организаций: «большинство организации раскрылись то бишь о них уже знает мир и могут их даже нанимать для убийства одержимого ( ну это бесплатно. Не благословенный получают деньги за убийство одержимого. Просто именно для родственников одержимого это бесплатно), а вот платно это изгнания демона».</li>\n<li>Открытый набор: «теперь в данный организации можно в ступить».</li>\n</ol>\n<p>Там же зафиксировано, что после раскрытия столкновения перестали быть чем-то из ряда вон: «схватки одержимых и благословенных стали уже обыкновенными».</p>", "r": [["Организации охотников на одержимых", "MR-0149.html"]]}, {"t": "Население", "a": ["S02", "MR-0150-S02", "MR-0150--naselenie"], "h": "<p>Обитатели изнанки, названные в переписке: благословенные, одержимые и апостолы.</p>\n<p>Одержимые — «люди одержимые демоном». С одержимым поступают одним из двух способов: «либо убивают либо изгоняют демона», причём изгнание редко, «ведь это муторно и опасно. Легче просто убить». По силе одержимый задан как «аналог Арбетара ( я даже в иногда буду называть их так)» — те же силы, но без обучения: «Но ему не надо обучаться. Он сразу сильный. И в чаще всего сильнее благословенных».</p>\n<p>Апостолы — сила, способная разносить здания в центре города и устраивать публичные казни сотнями; именно их действия и вскрыли изнанку.</p>\n<p>Обычные люди после раскрытия перестали быть просто зрителями: «Большое количество людей начало их защищать» (одержимых). При этом законность охоты сохранилась: «Но их не я убийства все равно разрешено законным».</p>", "r": []}, {"t": "Место во вселенной — как связан с другими мирами", "a": ["S03", "MR-0150-S03", "MR-0150--mesto-vo-vselennoy"], "h": "<p>Чёрная изнанка разбирается в рамках новой, облегчённой переработки вселенной «Апостол» (<a href=\"MR-0148.html\">Новая вселенная (безымянная, переработка «Апостола»)</a>), в разговоре 2025-09-12, окно w0104.</p>\n<p>Это не отдельный мир и не другое измерение: изнанка находится в том же мире, что и обычные люди, — церкви и многоэтажки, которые разносят апостолы, стоят в центрах обычных городов. Разделение между изнанкой и обычным миром — не пространственное, а по осведомлённости: до раскрытия люди о ней не знали, после — знают.</p>\n<p>С организациями охотников (<a href=\"MR-0149.html\">Организации охотников на одержимых</a>) изнанка связана напрямую: раскрытие изнанки — то самое событие, после которого организации стали публичными.</p>", "r": [["Новая вселенная (безымянная, переработка «Апостола»)", "MR-0148.html"], ["Организации охотников на одержимых", "MR-0149.html"]]}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0150-S04", "MR-0150--kak-menyalsya-po-versiyam"], "h": "<p>Версия 1 — 2025-09-12 (id 364766–364780). Единственная зафиксированная версия. В ней изнанка введена сразу целиком: как секрет, как событие раскрытия (охота апостолов на религиозную организацию), как набор последствий — паника, массовая истерия, гражданские войны — и как три устойчивых изменения, оставшиеся после того, как «всё устаканилось».</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0150-S05", "MR-0150--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Название не устоялось: «чёрная изнанка» и «тёмная изнанка» употреблены как одно и то же, выбор между ними не сделан.</li>\n<li>Религиозная организация, на которую охотились апостолы, не названа. В переписке она проходит только как «одна религиозная организация», «одна из самых крупных организации связанный с благословенными».</li>\n<li>Не сказано, почему апостолы устроили эту охоту.</li>\n<li>Не сказано, когда это произошло относительно остальных событий вселенной.</li>\n<li>Не сказано, чем закончилась охота и что стало с той организацией.</li>\n<li>Механика экзорцизма не придумана: «Как будет проводиться экзорцизм я ещё не придумал» (id 364767).</li>\n<li>Не сказано, кто именно подписывал публичный договор и кто следит за его соблюдением.</li>\n<li>Гражданские войны названы одним словом в списке последствий; ни участники, ни исход не разобраны.</li>\n<li>Не разобрано, как устроена изнанка до раскрытия: кто и как поддерживал секретность в мире, где благословенные и одержимые дерутся.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0150--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0148.html\">Новая вселенная (безымянная, переработка «Апостола»)</a>, <a href=\"MR-0149.html\">Организации охотников на одержимых</a></li>\n<li><strong>Упомянут в мирах:</strong> <a href=\"MR-0148.html\">Новая вселенная (безымянная, переработка «Апостола»)</a>, <a href=\"MR-0149.html\">Организации охотников на одержимых</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0150--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-09-12</td>\n<td>364766–364780</td>\n<td>w0104</td>\n<td>Апостол (разбор «неясно»)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0150-chernaya-iznanka.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0150--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0150.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
