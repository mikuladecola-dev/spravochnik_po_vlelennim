<script>const BASE="";const DOCNAME="Шут в костюме";
const LEAD="";
const CH=[{"t": "Об этом тексте", "a": ["S01", "PR-0100-S01", "PR-0100--ob-etom-tekste"], "h": "<ul>\n<li>Дата: 2025-11-21</li>\n<li>Сообщения: 387591–387591</li>\n<li>Состояние: брошено на середине (обрывается на полуслове); прямое продолжение той же истории — <a href=\"PR-0101.html\">Шут в костюме</a></li>\n<li>Действующие лица: ведущий, его двойник-клон, зрители в костюмах XIX века</li>\n</ul>", "r": [["Шут в костюме", "PR-0101.html"]]}, {"t": "Текст", "a": ["S02", "PR-0100-S02", "PR-0100--tekst"], "h": "<p>Шут в костюме<br>Дамы и джентльмены. На сцене ведущий.<br>-благодарю, что вы всё здесь собрались ради меня. И прошу прощения, что предоставил вам такой плохую сцену- сказал мужчина разводя руками. Одет он был в костюме 19 века и имеющие на голове колпак.<br>-да брость вы. Мы очень рады, что хоть на этой сцене увидели вас- заголосили зрителей в один тон. Всё они тоже были одеты в костюмы 19 века и пахли слегка тухла.<br>-как же я польщён- нагнувшись в знак приветствия или благодарности. Произнес мужчина.<br>-ну не будем уходить в сентиментальности. Нас ждёт куда более интересный вещи- бодра и радостно произнёс мужчина. Расхаживая на сцене. И делая вид задумчивого человека.<br>Публика ждала. Дети пискляво кричали, чтобы представлений скорее началось. Женщины охали в нетерпении. Мужчины же сидели с угрожающим видом. Но глазами тожа прощая быстрее начать- это представления. На котором всё они собрались. Всё были в ожидании. А ведущий словно про себя говорил<br>-так, так, какой бы вам представить выступления-<br>Не выдержавшая зритель. Начали кричать свои предложения. Но ведущего зацепила лишь один из них. А именно от маленькой девочки, что пыталась перекричать всех- Расскажите о себе- возможно девичий голос так и не было бы услышан. Если бы зритель не подхватили идею и не продолжали еë кричать уже все вместе.<br>-хм- нахмурился ведущий смотря на потолок.<br>-а что? Можно. Но дорогие зрители не ждите захватывающий истории. Хотя я все-таки постараюсь подать её в красивую обёртку- сказал ведущий улыбаясь белыми зубами.<br>-что же начнём- разведя руками произнёс ведущий. И на сцене словно из не откуда появился дым, который заполонил всё и зрительский зал, и всю сцену. Хотя дым был больше схожее на туман. Но на это не кто не обратил внимания. Дым был густом, что видеть дальше вытянутой руки было сложно. Зритель всё вглядывались в дым. В надежде увидеть что-то? Они сами не знали, что там разглядывают.<br>Вдруг дым начал кружиться словно водоворот. Зрители сначала испугались и схватившись за головные уборы. А женщины за платья. Но они быстро поняли, что ветра нет. И лишь дым движется так быстро. От неведомой силы.<br>Зритель из дыма, что всё кружился. Услышали грохот. Женщины воскликнули, а мужчины схватились за трость. И лишь дети весело завизжали.<br>Дым вре продолжал крутиться. Но теперь он не охватывал зрительский зал. Он всё уменьшался и уменьшался. Сам же центром водоворота был центр сцены.<br>Когда дым достаточно уменьшался. Зритель увидели в центре водоворота. Ведущего, что слов на схватив большую ложку. Начал, что-то размешивать. Но в руках у него ничего не было. Да и со стороны казалось, что именно он крутил весь этот дым.<br>Водоворот дыма всё уменьшался. Оттуда так и слышалось грохот.<br>В конце концов дым уменьшался и завис. Остановился и больше не двигался. Был он выше чем ведущий.<br>Ведущий обойдя этот столп дыма. Повернулся лицом к испуганным зрителем. И как видимо довольным от того, что сделал. Начал говорить<br>-Что же извольте. Вам показать моё творение- зритель слегка неуверенно, а потом всё живее. Начали просить ведущего показать, что же там. Ведущий же слегка усмехнувшись. Развёл руками. И столп дыма разлетелся. Зритель  содрогнулись испугавшись. Но после успокоившись и изумленое лицезрели. Второго ведущего. Хотя нет.<br>Они конечно было похожи словно близнецы. Но клон из дыма выглядит младший. И был одет в другую одежду. В простую белую футболку и чёрный мешковатый штаны. Но было одно самое главное их отличия. У клона был уставший вид. Словно он только из похорон. А настоящий ведущий так и светил радостью и удовольствием своей работы<br>Ведущий подошёл к своему клону и схватив того за плечи сказал<br>-это прошлый я . Ну или бывший я, как кому нравится - отпустив руки с плеч двойника. Ведущий опрокинул их на грудь. Он приподнял их и потянувшись к лицу двойника. Продолжил своё повествования<br>&lt;/content&gt;</p>", "r": []}, {"t": "Связи — всё вместе", "a": ["PR-0100--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает прозу:</strong> <a href=\"PR-0101.html\">Шут в костюме</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["PR-0100--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PR-0100.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
