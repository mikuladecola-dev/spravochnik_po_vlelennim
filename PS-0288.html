<script>const BASE="";const DOCNAME="самый жестокий апостол";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0288-S01", "PS-0288--proishozhdenie"], "h": "<p>Персонаж поставлен Славой как задача Миколаю 2025-08-10 (id 355186, окно w0102): нужны варианты способности для «самого жестокого апостола». Имени у персонажа в переписке нет, он обозначается по этому описанию и как «апостол». Из какой истории апостолы и сколько их — не сказано.</p>", "r": []}, {"t": "Характер", "a": ["S02", "PS-0288-S02", "PS-0288--harakter"], "h": "<p>Задан Славой одной репликой (id 355186, 2025-08-10 19:45): «И накинь вариантов способность для самого жестокого апостола. Точне самого мерзкого лицемерного. Живущего лишь ради себя и наплевавший на всех. Он урод без только чего-то хорошего. И он не хитрый не умный просто ублюдок жестокий».</p>\n<p>Отсюда разбирается набор свойств:</p>\n<ul>\n<li>самый жестокий и одновременно самый мерзкий и лицемерный из апостолов;</li>\n<li>живёт только ради себя, на всех остальных наплевал;</li>\n<li>«урод без только чего-то хорошего» — без единой хорошей черты;</li>\n<li>отдельно оговорено, чем он НЕ является: «не хитрый не умный». Жестокость здесь не инструмент замысла — «просто ублюдок жестокий».</li>\n</ul>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0288-S03", "PS-0288--sposobnosti"], "h": "<p>На момент окна способность не выбрана, есть только предложенные варианты (2025-08-11 15:42–15:43, id 355798–355800):</p>\n<ol>\n<li>«бог у которого 2 лица», «типа такого». Отсылает к сущности «Два лица», с которой персонаж связан.</li>\n<li>«или давать качества лицемерия другим».</li>\n</ol>\n<p>Какой из вариантов принят, в переписке не сказано.</p>", "r": []}, {"t": "Оружие", "a": ["S04", "PS-0288-S04", "PS-0288--oruzhie"], "h": "<p>Параллельно с запросом способности Слава спрашивает про оружие (id 355184–355185, 2025-08-10 19:43): «Самая жестокая холодная оружия? Которая причиняет много боли».</p>\n<p>Ответ Миколая пришёл в тот же вечер (id 355604, 355637, 22:59–23:09): «если честно дохера таких, даже не знаю что более жестокое», затем — «тот же молоток». На молотке разговор об оружии в этом окне заканчивается; закреплено ли оно за персонажем, не сказано.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Отклик — не материал авторов</b>\n<p>Реплика Славы читается на одном выдохе и держится на отрицаниях. «Он урод без только чего-то хорошего» — грамматически сломано, но понятно с первого раза, и переписывать это было бы хуже. Самое интересное там — «не хитрый не умный»: кто-то потрудился отнять у жестокого персонажа ум, хотя обычно ум выдают злодеям бесплатно, в комплекте с жестокостью, чтобы было с кем разговаривать. Тут наоборот: жестокость без замысла, просто свойство, как рост. Ещё понравился ответ про оружие. Вопрос был громкий — «Самая жестокая холодная оружия? Которая причиняет много боли», — а ответ пришёл сначала честный («дохера таких, даже не знаю что более жестокое»), потом бытовой: молоток. Не клинок с историей, не что-нибудь ветвистое, а инструмент из кладовки. По-моему, это лучший из возможных ответов, и жаль, что он повис: за персонажем его так и не закрепили.</p></div>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0288-S05", "PS-0288--svyazi-s-drugimi"], "h": "<p>Связан с «Два лица» — через предложенный вариант способности «бог у которого 2 лица».</p>\n<p>Второй вариант способности («давать качества лицемерия другим») связывает персонажа с окружающими его лицами, но кто это конкретно, не названо.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0288-S06", "PS-0288--kak-menyalsya"], "h": "<p><strong>2025-08-10 (id 355184–355210).</strong> Постановка задачи: характер апостола описан целиком одной репликой, рядом задан вопрос про жестокое холодное оружие. Ответа в этот момент нет — разговор уходит в сторону (Миколай ждёт от Славы список историй и вопрос, с какой начинать; Слава отвечает из поезда).</p>\n<p><strong>2025-08-10, вечер (id 355604–355648).</strong> Ответ по оружию: молоток. Способности отложены до утра — «я утром подумаю».</p>\n<p><strong>2025-08-11 (id 355798–355800).</strong> Предложены два варианта способности: бог с двумя лицами и раздача качеств лицемерия другим.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0288-S07", "PS-0288--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имени у персонажа нет.</li>\n<li>Вселенная не названа.</li>\n<li>Неясно, из какой истории апостолы и сколько их всего.</li>\n<li>Способность не выбрана — только два предложенных варианта, реакции Славы на них в окне нет.</li>\n<li>Внешность не описана.</li>\n<li>Происхождение, роль в сюжете, судьба — в переписке не сказано.</li>\n<li>Связь молотка с этим персонажем прямо не проведена: вопрос про оружие и вопрос про способность заданы подряд, но закрепления оружия за апостолом нет.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0288--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0001.html\">Апостолы (организация апостолов, «благословенные Богом»)</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0001.html\">Апостолы (организация апостолов, «благословенные Богом»)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0288--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-08-10</td>\n<td>355184–355210</td>\n<td>w0102</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-08-10</td>\n<td>355604–355648</td>\n<td>w0102</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-08-11</td>\n<td>355798–355800</td>\n<td>w0102</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0288-samyy-zhestokiy-apostol.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0288--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0288.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0288-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0288/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Из перечисленных в статье пробелов самый дорогой — «неясно, из какой истории апостолы и сколько их всего», и он не местный. <code>SL-0054</code> «Список 12 апостолов» — три ссылки, статьи нет, база 234 052 знака. Это самая крупная непереваренная запись в справочнике, и она отвечает ровно на этот вопрос: сколько их и кто. Рядом <code>SL-0053</code> (шесть ссылок, статьи нет, 20 313), <code>SL-0051</code> (шесть ссылок, статьи нет, 9 834), <code>SL-0090</code> (четыре ссылки, статьи нет, 5 492), <code>SL-0089</code> (четыре ссылки, статьи нет, 1 753). Пять служебных списков держат двадцать три входящих ссылки и ни одной статьи. Пока их нет, у безымянного апостола негде получить место в составе: вопрос решается в каталоге, а не в карточке.</p>\n<p>Второе, дешёвое и локальное: <code>SP-0233</code> «Два лица» — статья есть, база 4 306, ссылок ноль. Вариант способности «бог у которого 2 лица» назван в тексте статьи, в разделе про связи он упомянут словами, а в связях его нет. Одна ссылка убирает единственный ноль в этом узле.</p>\n<p>Третье: оружия как сущности нет вовсе. Молоток в справочнике не заведён ни под каким видом; «Оружие» существует только как рубрика внутри <code>SL-0053</code>, <code>SL-0051</code> и <code>SL-0090</code> — тех самых, у которых нет статей. Поэтому пробел «связь молотка с персонажем не проведена» сейчас нельзя ни закрыть, ни даже правильно записать: вешать не на что.</p>\n<h3>С чего начать</h3>\n<p>В базе — <code>SL-0054</code> (234 052). Оттуда же берётся ответ на «вселенная не названа»: запись проходит по четырём вселенным сразу («7 островов», «Апостол», «Оам», «Феня»), то есть апостолы кочуют, и разметка этой карточки по «Апостолу» сделана по дате объявления, а не по содержанию. Под пробел «роль в сюжете» — <code>SL-0058</code> «Мини-истории апостолов» (одна ссылка, статьи нет, 2 662).</p>\n<p>В архив — за одним: принят ли вариант способности. Окно w0102 обрывается на id 355800 (2025-08-11, 15:43), реакции Славы в нём нет. Смотреть надо после 355800 — вторую половину дня 2025-08-11 и ближайшие дни, вокруг слов «два лица» и «лицемерие». Там же проверяется, вернулся ли молоток: в окне он назван один раз вечером 2025-08-10 (id 355604, 355637) и больше не всплывает.</p>\n<h3>Как развивалось</h3>\n<p>2025-08-10, 19:43 — спросили про оружие. 19:45, через две минуты — поставили задачу на способность и одной репликой целиком задали характер, больше к характеру не возвращались ни разу. Дальше разговор ушёл в сторону: списки историй, с какой начинать, Слава отвечает из поезда. 22:59–23:09 того же дня — вернулись, но только к оружию: «если честно дохера таких, даже не знаю что более жестокое», потом «тот же молоток»; способность отложена словами «я утром подумаю». 2025-08-11, 15:42–15:43 — два варианта способности пришли. Реакции на них нет, тема закрывается. Заявили — отложили — вернулись наполовину — не закрыли.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Про этого апостола отдельно оговорено, чем он не является: «И он не хитрый не умный просто ублюдок жестокий». Это редкая вещь — в описании злодея прямо отнята сообразительность, и отнята намеренно, отдельным предложением. Второй предложенный ему вариант способности — «давать качества лицемерия другим» — предполагает выбор, кому и когда это качество дать, то есть работу с людьми на расчёт. Правило «он не хитрый и не умный» названо; для способности, которую тут же ему подбирают, оно не проговорено. Место показываю, дальше не иду.</p>\n<h3>Отклик</h3>\n<p>Реплика Славы читается на одном выдохе и держится на отрицаниях. «Он урод без только чего-то хорошего» — грамматически сломано, но понятно с первого раза, и переписывать это было бы хуже. Самое интересное там — «не хитрый не умный»: кто-то потрудился отнять у жестокого персонажа ум, хотя обычно ум выдают злодеям бесплатно, в комплекте с жестокостью, чтобы было с кем разговаривать. Тут наоборот: жестокость без замысла, просто свойство, как рост. Ещё понравился ответ про оружие. Вопрос был громкий — «Самая жестокая холодная оружия? Которая причиняет много боли», — а ответ пришёл сначала честный («дохера таких, даже не знаю что более жестокое»), потом бытовой: молоток. Не клинок с историей, не что-нибудь ветвистое, а инструмент из кладовки. По-моему, это лучший из возможных ответов, и жаль, что он повис: за персонажем его так и не закрепили.</p></div>", "r": []}];</script>
