<script>const BASE="";const DOCNAME="Огонь";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0069-S01", "SP-0069--mehanika"], "h": "<p>Способность Сталкера, названная одним словом: «Огонь» (2024-06-21, id 185086). Общая механика стихии не расписывается — вместо этого сразу даются три приёма (2024-06-21, id 185093):</p>\n<p><strong>1. Огненная пуля.</strong> «его снайперская винтовка и пистолеты особой оружея под него у них нет патронов, он сам делает их с помощью огня и стреляет ими из оружия при попадания взрывается». То есть оружие сделано специально под него и работает без боеприпаса: патрон создаётся огнём в момент выстрела, попадание даёт взрыв.</p>\n<p><strong>2. Огненные цепи (из ладони).</strong> «может из огня сформулировать цепь и контролировать его на расстояний, защищаясь ими или атакуя, или делать как человек паук». Три назначения у одного приёма: защита, атака и перемещение.</p>\n<p><strong>3. Подземный ад.</strong> «прижимает руки к землёй, и из земли в радиусе 100 метров вырывается огненненый колы, протыкая противника». Единственный приём с указанным радиусом — 100 метров.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0069-S02", "SP-0069--ogranicheniya-i-cena"], "h": "<p>В переписке не названы. Расход, откат, предел по количеству огня и последствия для носителя не обсуждались.</p>\n<p>Косвенно с приёмами связана характеристика «Контроль: 8» из карточки Сталкера, но как именно контроль ограничивает огонь — не сказано.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0069-S03", "SP-0069--nositeli"], "h": "<p><strong>Сталкер</strong> — единственный носитель. Имя дано как кличка: «Имя: сталкер ( ну кличка)». Карточка, в которой огонь стоит в графе «Способности», задана в том же сообщении (2024-06-21, id 185093):</p>\n<ul>\n<li>Сила: 6, Скорость: 7, Ловкость: 8, Меткость: 10, Выносливость: 6, Контроль: 8.</li>\n<li>Оружие: «снайперская винтовка; 2 пистолета; нож армейский».</li>\n<li>Инструмент: «глаза ( тепловой видение )».</li>\n<li>Внешность: «мужчин лет 40 в маске( виде кибер маски, ты поймёшь надеюсь) на все лицо; в плаще, а под ним черная, серая форма».</li>\n<li>Характер: «спокойный, хладнокровные; не питает не кому ненависти, но убивает по заказу».</li>\n</ul>\n<p>Меткость 10 — максимум среди его характеристик, и сама графа «меткость» была добавлена в набор характеристик прямо перед составлением карточки: «Добавим ещё один стать меткость» (2024-06-21, id 185092).</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0069-S04", "SP-0069--kak-menyalas-po-versiyam"], "h": "<p>Одна версия.</p>\n<p><strong>2024-06-21, окно w0038 (id 185086–185093).</strong> Слава объявляет за собой огонь («Огонь» — «У тебя?» — «Да»). В том же обмене Миколай объявляет за себя другую стихию: «У меня будет костяной». Дальше добавляется характеристика меткости, и через пятнадцать минут Слава выкладывает готовую карточку Сталкера с тремя приёмами. К способности после этого не возвращались.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0069-S05", "SP-0069--svyaz-s-drugimi-sposobnostyami"], "h": "<p>В том же обмене Миколай называет свою стихию — костяной (2024-06-21, id 185089). Огонь и костяной здесь выбираются параллельно, как способности двух персонажей, которых авторы делают одновременно. Взаимодействия между ними не описано.</p>\n<p>Внутри самого огня приёмы связаны носителем и его снаряжением: «Огненная пуля» работает только через его личное оружие («особой оружея под него»), «Огненные цепи» и «Подземный ад» — напрямую от рук.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "SP-0069-S06", "SP-0069--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Общая механика огня не описана — есть только три приёма.</li>\n<li>Цена, расход и ограничения не названы.</li>\n<li>Не сказано, откуда способность у Сталкера и как она получена.</li>\n<li>Как «тепловое видение» глаз соотносится с огнём — не проговорено, глаза числятся отдельной графой «Инструмент».</li>\n<li>Дальность «Огненной пули» и «Огненных цепей» не указана; радиус назван только у «Подземного ада».</li>\n<li>Способность в сценах не применялась.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["SP-0069--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-06-21</td>\n<td>185086–185093</td>\n<td>w0038</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0069-ogon.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0069--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0069.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
