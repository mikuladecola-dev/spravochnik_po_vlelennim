<script>const BASE="";const DOCNAME="Боги (пантеон мира богов и аватаров)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0092-S01", "GR-0092--chto-eto"], "h": "<p>Боги — высшие существа мира богов и аватаров (<a href=\"MR-0003.html\">мир богов и аватаров</a>), мира Славы: «обычный современный» мир, в котором, как формулирует Слава, «боги решили устроить месиво и начали выбирать аватаров ( то бишь людей) давая им силы» (2024-01-03, id 75665). Пантеон как таковой обсуждается двумя соавторами 3 и 4 января 2024 года; сначала разбирается сама система богов и аватаров и её баланс, потом — из какой мифологии брать имена.</p>\n<p>Группа здесь — именно сообщество богов, а не один персонаж: боги перечисляются поимённо, у них есть общие функции (раздача сил, выбор аватаров, выпуск монстров, поручения аватарам) и внутренняя иерархия («бог на статус всех выше»). Но отдельных записей в базе у большинства из названных богов нет: заведены только «Гермес» (Гермес <em>(статьи ещё нет — <a href=\"kb/ID-0028-germes.html\">исходник</a>)</em>) и «Сатурн и Хронос» (Сатурн и Хронос <em>(статьи ещё нет — <a href=\"kb/ID-0029-saturn-i-hronos.html\">исходник</a>)</em>), поэтому список участников в базе неполный по сравнению с тем, что названо в переписке.</p>\n<p>Отправная точка группы — реплика Славы «Тогда кидай богов с разными именами» (2024-01-03, id 75656), после которой Миколай начинает перечислять имена.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · С чего начать — не материал авторов</b>\n<p><code>ID-0028</code> (3 475) и <code>ID-0029</code> (2 308) читать до всякого архива: там сидят обе развёрнутые богословские ветки этого мира — разбор Гермеса и идея развести Сатурна с Хроносом. Обе статьи-заглушки, обе с двумя ссылками. Следом <code>MR-0003</code> (31 443 знака базы) — самая толстая запись по этому миру, и именно в ней должен лежать контекст, которого статье не хватает: кем боги приходятся миру, а не аватарам.</p></div>", "r": [["Гермес", "kb/ID-0028-germes.html"], ["Сатурн и Хронос", "kb/ID-0029-saturn-i-hronos.html"], ["мир богов и аватаров", "MR-0003.html"]]}, {"t": "Состав", "a": ["S02", "GR-0092-S02", "GR-0092--sostav"], "h": "<p>В базе заведены записи:</p>\n<ul>\n<li>Гермес <em>(статьи ещё нет — <a href=\"kb/ID-0028-germes.html\">исходник</a>)</em> — Гермес</li>\n<li>Сатурн и Хронос <em>(статьи ещё нет — <a href=\"kb/ID-0029-saturn-i-hronos.html\">исходник</a>)</em> — Сатурн и Хронос</li>\n</ul>\n<p>Поимённо в переписке названы (в порядке появления, 2024-01-03, id 75661–75995): Аматерасу, Один, Перун, Шива, Хронос (у Славы — «хронус», id 75668), Зевс, Посейдон, бог плодородия (у Миколая — «Приамп», id 75682; в другой ветке 2024-01-04 у него же «богиня плодородия», id 77258), Сатурн, Гермес, Идзанами.</p>\n<p>Феникс упоминается Славой отдельной репликой «Феникс есть» (2024-01-03, id 75677) — в каком качестве он входит в мир и бог ли это, в переписке не сказано.</p>\n<p>Окончательный состав пантеона не утверждён: соавторы обсуждают, из каких мифологий брать богов, но списка «вот эти боги в мире» не составляют. Сколько богов всего — не названо.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Самое дорогое здесь — не то, что пантеон не утверждён, а то, что из одиннадцати названных богов в базе есть ровно два, и у обоих нет статьи. <code>ID-0028</code> Гермес — две ссылки, база 3 475, статьи нет. <code>ID-0029</code> Сатурн и Хронос — две ссылки, база 2 308, статьи нет. Ссылаются на них эта статья, <code>MR-0003</code> «мир богов и аватаров» (статья 26 994, база 31 443, три ссылки) и <code>VS-0009</code> «Падения небес» (статья 129 875). То есть весь поимённый состав пантеона, на который опирается мир и вселенная, держится на двух записях без статей общим объёмом меньше шести килобайт. Разобрать их первыми — единственный ход, который двигает сразу три статьи.</p></div>", "r": [["Гермес", "kb/ID-0028-germes.html"], ["Сатурн и Хронос", "kb/ID-0029-saturn-i-hronos.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0092-S03", "GR-0092--obschie-sposobnosti-gruppy"], "h": "<p>Что делают боги — по репликам обоих соавторов:</p>\n<ul>\n<li>Выбирают аватаров среди людей и дают им силы. «боги решили устроить месиво и начали выбирать аватаров ( то бишь людей) давая им силы» (2024-01-03, id 75665).</li>\n<li>Аватар получает не весь набор сразу: «давая самого начало лишь основный способность , но со временем человек может открывать другие способности данного бога , и при этом может качать и старый» (Слава, 2024-01-03, id 75746).</li>\n<li>Привязывают аватара к своей теме: «аватар может качать способности только связанные со своим богом» (Слава, 2024-01-03, id 75665). Пример там же: «бог времени ( хронус )» — и аватар со способностями времени (id 75668). По классике Зевсу — «Молнии качать» (Миколай, id 75670).</li>\n<li>Выпускают монстров ради зрелища: «что бы было большей зрелище что бы людишки шевелились они начали выпускать дута монстров ( но там нет квестов там просто монстры и все )» (Слава, 2024-01-03, id 75746).</li>\n<li>Призывают персонажей из других миров: «Плюсом персонажей из других миров Который боги призвали на землю ради Хауса» (Слава, 2024-01-04, id 76396).</li>\n<li>Дают новые способности по просьбе или за поступок: «боги будут давать способности только при просьбе или когда аватар сделает что то что им понравится» (Слава, 2024-01-03, id 75775). Раньше в той же реплике зафиксирован и более ранний вариант Славы — «либо надо тренироваться либо выполнить просьбу бога когда он попросит» (id 75764); от тренировок отказались после возражения Миколая «Ну тренировки просто скучно», «А вот поручение бога / Норм» (id 75766–75768).</li>\n<li>Владеют карманными измерениями. У главного героя (<a href=\"PS-0024.html\">Главный герой мира богов и аватаров</a>) способность телепортироваться в «карманная измерения ( бога )» (2024-01-04, id 76201), то есть пространство принадлежит богу, а не аватару. На вопрос Миколая «Его ему подарил его бог / Да ?» (id 76197–76199) Слава отвечает этой формулировкой.</li>\n<li>Хотят зрелища и не против бедствий: «Это и есть высшее существа И они хотят зрелища поэтому им только в кайф если будут беды» (Слава, 2024-01-03, id 75799).</li>\n<li>Раздают силы без разбора. Слава: «боги раздали способности не только добрякам но и психом террористом и подобной мразоть» (2024-01-03, id 75727) — это для него условие хаоса в мире.</li>\n</ul>\n<p>Ограничения самих богов. Слава: «у богов должны тоже быть ограничение что бы они просто так способности не раздавали» (2024-01-03, id 75775). Миколай предлагает механизм: «Бог не сможет увидеть результат который выйдет после раздачи способности, точнее наоборот увидит только последствия и за эти последствия будет наказан богом на статус всех выше» (id 75780), и разворачивает: «если бог норм, то не будет давать ему возможность натворить бед, так как вышестоящее существо покарает за что-то тяжёлое» (id 75792). Слава на это возражает, что высшие существа сами хотят зрелища (id 75799), и Миколай спрашивает: «Ну тогда ограничения нахуя им» (id 75813). Ответ Славы: «Это жалкий людишки конечно они не смогут в полной мере использовать силы богов» (id 75814) — то есть ограничение переносится на людей, а не на богов. Отдельным решением это в переписке не закрепляется.</p>", "r": [["Главный герой мира богов и аватаров", "PS-0024.html"]]}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0092-S04", "GR-0092--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p>Различие богов задаётся темой, к которой привязан аватар, и разбирается только на нескольких примерах.</p>\n<p>Бог времени — Хронос (у Славы «хронус»), 2024-01-03, id 75668. К этой же теме относится собранный Славой ночью 3 января список временных способностей (<a href=\"SP-0035.html\">Способности, связанные со временем (список Славы)</a>, 2024-01-03, id 73567): «1) остановка 2) видеть будущее 3) временной клон 4) ускорения ( то бишь ускорения времени для себя или объектов ) 5) замедление ( то бишь как 4) 6) обмотка времени». К какому миру собирался список, там не названо; позже, 2024-07-10 (id 202840), Слава подтверждает: «Я тогда ещё богов в мифологий искал». Аватар бога времени считается ослабленным: «и так ослаблу аватара бога времени поэтому проблем нету» (Слава, 2024-01-03, id 75708).</p>\n<p>Сатурн и Хронос — предложение Миколая при выборе пантеона (Сатурн и Хронос <em>(статьи ещё нет — <a href=\"kb/ID-0029-saturn-i-hronos.html\">исходник</a>)</em>, 2024-01-03, id 75984): «Сатурн и Хронос, это прикольно можно обоих использовать, но разные способности присвоить». Слава: «Вот идеально» (id 75986). Миколай сравнивает: «Это как Аматерасу и Идзанами» (id 75989). Дальше эта пара не разворачивается. В архиве отсутствуют ответы на сообщения 75982 и 75985, поэтому контекст неполный.</p>\n<p>Зевс — молнии, «по классике» (Миколай, 2024-01-03, id 75669–75670).</p>\n<p>Бог плодородия, у Миколая «Приамп» (2024-01-03, id 75682; имя, по пометке базы, искажено, вероятно Приап). Слава сначала переспрашивает «Посейдон? / или че» (id 75684), Миколай отвечает: «Ну его тоже можно / Но это другое» (id 75686–75687), то есть Посейдон в перечень при этом попадает, но как отдельный бог. Способности аватара бога плодородия (<a href=\"SP-0040.html\">аватар бога плодородия</a>): «всеобщее повышение либидо» и «роста растений» (id 75695, 75697), плюс механика самого аватара — «Его сила повышается с его повышением либидо», «Если красивую девочку увидит / Сильнее становится» (id 75702–75705). 2024-01-04 (id 77258–77264) Миколай возвращается к мотиву уже как к «богине плодородия», которая «даст возможность создавать например афродизиак», а афродизиак «можно контролировать влюблённых / Давать им приказы», вплоть до «попросить умереть человека ради него и он себя убивал во имя любви». Это относится к персонажу-психу, не к главному герою.</p>\n<p>Гермес (Гермес <em>(статьи ещё нет — <a href=\"kb/ID-0028-germes.html\">исходник</a>)</em>, 2024-01-03, id 75995–76019). Слава спрашивает Миколая, кто это «в твоём преставлении без инета». Миколай: «Чет наверное в черным с воронами и молниями ассоциируется», «Ну и характер плохой». Слава ожидал ответа «бегун» и приводит свою версию: «в некоторых источника, вор и торговец и типо у него дохуя артефактов», и оценивает: «Идеальная для одного персонажа» — уточняя, что персонаж этот и есть бог (id 76011–76013). Для какого именно персонажа — в переписке не сказано. Миколай в конце: «Просто вор обычно с плохим характером только / Разное бывает получается».</p>\n<p>Аматерасу, Один, Перун, Шива, Посейдон, Идзанами названы, но их темы и способности в переписке не расписаны.</p>", "r": [["Сатурн и Хронос", "kb/ID-0029-saturn-i-hronos.html"], ["Гермес", "kb/ID-0028-germes.html"], ["Способности, связанные со временем (список Славы)", "SP-0035.html"], ["аватар бога плодородия", "SP-0040.html"]]}, {"t": "Иерархия", "a": ["S05", "GR-0092-S05", "GR-0092--ierarhiya"], "h": "<p>Внутри пантеона иерархия названа один раз и только Миколаем: над обычным богом стоит «бог на статус всех выше», который карает за последствия неудачной раздачи силы (2024-01-03, id 75780), он же — «вышестоящее существо покарает за что-то тяжёлое» (id 75792). Слава эту вертикаль не принимает и сводит всё к одному уровню: «Это и есть высшее существа И они хотят зрелища» (id 75799). Кто именно занимает верхний статус и есть ли он вообще в итоговой версии — осталось нерешённым.</p>\n<p>Отношение богов к людям задано сверху вниз: у Славы люди — «людишки» (id 75746), «жалкий людишки» (id 75814), они «не смогут в полной мере использовать силы богов».</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S06", "GR-0092-S06", "GR-0092--otnosheniya-s-drugimi-gruppami"], "h": "<p>Аватары — люди, выбранные богами; каждый привязан к своему богу и качает только его способности (2024-01-03, id 75665). Изначально аватары равны между собой: «И все они изначально равны ( я про аватаров )» (Слава, id 75747). Миколай возражает: «Способности все разные / И развиваться должны не равномерно / Чтобы дольше балан шел» (id 75752–75754).</p>\n<p>Возможность конфликта аватаров со своими богами Миколай ставит вопросом: «А если народу похуй / На своего бога / Пойдут против» (2024-01-03, id 75769–75772). Ответа в переписке нет.</p>\n<p>Монстры — выпущены богами ради зрелища, квестов при них нет (id 75746).</p>\n<p>Персонажи из других миров — призваны богами «ради Хауса» (2024-01-04, id 76396). У Славы «одна тройка уже есть И один мега гач» (id 76397); поимённо они не названы. Миколай в той же ветке рекомендует «сделать 12 персонажей по 3 человека в группе» (id 76394).</p>\n<p>Главный герой мира богов и аватаров (<a href=\"PS-0024.html\">Главный герой мира богов и аватаров</a>) — аватар: «и вот гг стал избранном» (id 75746), у него карманное измерение бога (id 76201). Слава: «гг у меня будет уродом» (2024-01-03, id 75987).</p>", "r": [["Главный герой мира богов и аватаров", "PS-0024.html"]]}, {"t": "Как менялась — по датам", "a": ["S07", "GR-0092-S07", "GR-0092--kak-menyalas"], "h": "<p><strong>2024-01-03, id 75650–75722.</strong> Первое объявление системы. Слава просит: «Тогда кидай богов с разными именами» (id 75656). Миколай перечисляет: Аматерасу, Один, Перун, Шива (id 75661–75664), затем Зевс (id 75669), бог плодородия «Приамп» (id 75682); Слава добавляет Посейдона (id 75684) и Хроноса как бога времени (id 75668). Тогда же задан принцип привязки аватара к богу и поставлен вопрос баланса — «что бы каждый аватары были более менее равны по силе» (id 75714), «Ну как почти что в Джоджо», «остановка времени максимум 5 секунд и подобной хуеты» (id 75718–75719).</p>\n<p><strong>2024-01-03, id 75714–75745.</strong> Обсуждение ограничений. Варианты Миколая: ограничение только во время поединка, а вне поединка — «за какую то валюту, не обязательно деньги» (id 75722, 75724); «способности некоторых работают только утром а некоторых только ночью» (id 75728); «Максимум можно юзать 45 минут в день» (id 75731). Слава отклоняет: «Ограничений не такого плана» (id 75730), «ну типа ограничение выносливость и типо того» (id 75734), и объясняет отказ от временных ограничений тем, что хочет хаос: «Я хочу что бы в мире был Хаус Ведь боги раздали способности не только добрякам но и психом террористом и подобной мразоть» (id 75727), «Это будет Хаус будет смерти конец экономике» (id 75729).</p>\n<p><strong>2024-01-03, id 75742–75775.</strong> Развёрнутая формулировка мира от Славы (id 75746–75747): современный мир, аватар получает сначала только основную способность и со временем открывает другие способности своего бога, старые тоже качаются; боги выпускают монстров ради зрелища; аватары изначально равны. Возражение Миколая о неравномерном развитии (id 75752–75754). Здесь же — вопрос, как открываются новые способности: у Миколая жертвоприношение (<a href=\"SP-0041.html\">жертвоприношение богу</a>), у Славы — тренировка или просьба бога (id 75764).</p>\n<p><strong>2024-01-03, id 75764–75814.</strong> Мотивация и ограничения богов. Слава отказывается от тренировок: «боги будут давать способности только при просьбе или когда аватар сделает что то что им понравится», и требует ограничений для самих богов (id 75775). Миколай предлагает наказание вышестоящим существом (id 75780, 75792). Слава сводит богов к высшим существам, которые хотят зрелища (id 75799). Мотив аватара, по Славе: «интерес до скольки я смогу прокачаться интересно какие ещё будут способности интересно Ая сам смогу стать богом» (id 75779) — то есть аватар в принципе может метить в боги. Миколай на это: «Тат на интересе все завязано / А не на психологии» (id 75785–75786).</p>\n<p><strong>2024-01-03, id 75970–76019.</strong> Выбор пантеона. Слава: «Каких богов брать Вообще я хочу из славянской мифология Так как она все же ближе плюсом мне достало что везде есть древнегреческая, египетская , мусульманская , скандиданская» (id 75973). Миколай: «древнегреческая топ» (id 75974), «в синтоизме 8 миллионов различных богов, должно хватить думаю» (id 75975), «Из язычества тоже было бы здорово» (id 75976), «Скандинавия вообще в моем сердечке» (id 75977), «Египетская тоже ничего» (id 75979). Мусульманская отклонена: «мне кажется это монотеистическая религия / Думаю не пойдёт» (id 75980–75981). Тут же — предложение по Сатурну и Хроносу (id 75984) и разбор Гермеса (id 75995–76019). Какая мифология выбрана в итоге — не сказано; ни один из вариантов, кроме монотеистического, не отвергнут.</p>\n<p><strong>2024-01-04, id 76393–76415.</strong> Структура состава вокруг богов: рекомендация Миколая о 12 персонажах по 3 в группе (id 76394), персонажи из других миров, призванные богами (id 76396–76397). Слава объясняет приоритет: «Сейчас главная мир нормально создать а то опять фигня получится» (id 76403), «Для меня самая важная» (id 76409), «персонажей в свою голове у меня вроде норм плюс способности потихоньку по маленьку тоже норм Но мир у меня всегда говном был» (id 76413).</p>\n<p><strong>2024-01-04, id 77257–77265.</strong> Возврат к богу плодородия в женском варианте — «богиня плодородия», афродизиак, контроль влюблённых.</p>\n<h3>Отклонённые и непринятые варианты</h3>\n<ul>\n<li>Наследственная прокачка способности (<a href=\"SP-0042.html\">наследственная прокачка способности</a>, 2024-01-03, id 75736): «способность нельзя никак улучшить, она изначально слаба и почти бесполезна, не все есть возможности, можно её улучшить только по наследству, с каждым поколением способность сильнее», плюс «чем больше человек думает о боге в момент зачатия тем лучше повлияет на улучшение» (id 75738). Слава отклоняет: «Ты написал нельзя никак улучшать И так же в моём мире не будет потом нового поколения» (id 75755). Миколай соглашается: «А / Ок» (id 75756–75757).</li>\n<li>Жертвоприношение богу (<a href=\"SP-0041.html\">жертвоприношение богу</a>, 2024-01-03, id 75760–75763): «Чем важнее для аватара вещь будет дана в жертву богу, тем сильнее способность он получит», «Важность может ещё определяется сложностью получения», «Убить целый спальный район ради жертвы не хухры мухры». Прямо не отклонено, но Слава сразу переходит на свою систему (тренировка или просьба бога); принята ли механика в его мир — не сказано.</li>\n<li>Временные ограничения аватаров (только утром/ночью, 45 минут в день, за валюту вне поединка) — отклонены Славой (id 75726, 75730, 75734).</li>\n<li>Мусульманская мифология — отклонена Миколаем как монотеистическая (id 75980–75981).</li>\n<li>Тренировки как способ открывать новые способности — начальный вариант Славы (id 75764), от которого он отказался после реплики Миколая «Ну тренировки просто скучно» (id 75766): «Кстати на счёт тренировок прав» (id 75775).</li>\n<li>Цель главного героя «забрать все способности у всех» по образцу Все За Одно (Миколай, 2024-01-04, id 77267–77268) — отклонена Славой: «Да ты прав я не соглашусь Тогда тот баланс который я так сильно хочу создать разрушится» (id 77272).</li>\n</ul>", "r": [["жертвоприношение богу", "SP-0041.html"], ["наследственная прокачка способности", "SP-0042.html"]]}, {"t": "Пробелы", "a": ["S08", "GR-0092-S08", "GR-0092--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Итоговый состав пантеона не назван. Названы одиннадцать имён, но какие боги входят в мир, а какие остались перебором вариантов, не решено.</li>\n<li>Из какой мифологии в итоге берутся боги — не решено. Слава хочет славянскую, Миколай называет греческую, синтоизм, язычество, скандинавскую, египетскую; отвергнута только монотеистическая.</li>\n<li>Отдельных записей в базе у большинства названных богов нет — только Гермес (Гермес <em>(статьи ещё нет — <a href=\"kb/ID-0028-germes.html\">исходник</a>)</em>) и «Сатурн и Хронос» (Сатурн и Хронос <em>(статьи ещё нет — <a href=\"kb/ID-0029-saturn-i-hronos.html\">исходник</a>)</em>). Поэтому список участников группы неполный.</li>\n<li>Темы и способности Аматерасу, Одина, Перуна, Шивы, Посейдона, Идзанами не расписаны.</li>\n<li>Разные ли способности у Сатурна и Хроноса и какие именно — не сказано, идея дальше не разворачивается.</li>\n<li>Для какого персонажа предназначался Гермес — не сказано.</li>\n<li>Верхний уровень иерархии («бог на статус всех выше») предложен одним соавтором и оспорен другим; остался нерешённым.</li>\n<li>Есть ли у богов действующие ограничения — осталось нерешённым: на вопрос «Ну тогда ограничения нахуя им» прямого ответа про богов нет, ответ перенесён на людей.</li>\n<li>Пойдут ли аватары против своих богов («А если народу похуй / На своего бога / Пойдут против») — ответа в переписке нет.</li>\n<li>Бог главного героя не назван по имени: сказано только, что карманное измерение принадлежит богу.</li>\n<li>Может ли аватар «сам стать богом» — прозвучало как мотив интереса, но как механика не решено.</li>\n<li>Феникс упомянут одной репликой, статус не определён.</li>\n<li>Вселенная в исходных сообщениях нигде не названа, говорится только «мой мир»; отнесение к «Падениям небес» сделано по дате объявления.</li>\n<li>Персонажи из других миров, призванные богами, поимённо не названы: у Славы «одна тройка» и «один мега гач», состав не назван.</li>\n</ul></div>", "r": [["Гермес", "kb/ID-0028-germes.html"], ["Сатурн и Хронос", "kb/ID-0029-saturn-i-hronos.html"]]}, {"t": "Связи — всё вместе", "a": ["GR-0092--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0024.html\">Главный герой мира богов и аватаров</a></li>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0035.html\">Способности, связанные со временем (список Славы)</a>, <a href=\"SP-0040.html\">аватар бога плодородия</a>, <a href=\"SP-0041.html\">жертвоприношение богу</a>, <a href=\"SP-0042.html\">наследственная прокачка способности</a></li>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0003.html\">мир богов и аватаров</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0092--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0092.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0092-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0092/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Самое дорогое здесь — не то, что пантеон не утверждён, а то, что из одиннадцати названных богов в базе есть ровно два, и у обоих нет статьи. <code>ID-0028</code> Гермес — две ссылки, база 3 475, статьи нет. <code>ID-0029</code> Сатурн и Хронос — две ссылки, база 2 308, статьи нет. Ссылаются на них эта статья, <code>MR-0003</code> «мир богов и аватаров» (статья 26 994, база 31 443, три ссылки) и <code>VS-0009</code> «Падения небес» (статья 129 875). То есть весь поимённый состав пантеона, на который опирается мир и вселенная, держится на двух записях без статей общим объёмом меньше шести килобайт. Разобрать их первыми — единственный ход, который двигает сразу три статьи.</p>\n<p>Дальше — то, чего в базе нет вовсе. Зевс, Аматерасу, Один, Перун, Шива, Посейдон, Идзанами названы поимённо и не заведены никак: ни статьи, ни исходника. Феникс упомянут одной репликой — и при этом в справочнике есть <code>PS-0033</code> Феникс (статья есть, база 1 961, вселенная помечена «неясно», две ссылки, все из «Апостола»); тот ли это Феникс — вопрос к разбору, а не факт. Отдельно стоит проверить <code>ID-0025</code> Атлант («Падения небес», база 2 181, две ссылки, статьи нет): он висит не на пантеоне, а на <code>GR-0094</code>, хотя по имени просится в этот же перечень.</p>\n<p>Проверка на неполноту связей: <code>GR-0092</code> — ноль входящих ссылок при статье в 28 537 знаков.</p>\n<h3>С чего начать</h3>\n<p>Начинать с базы, она уже есть и лежит близко.</p>\n<p><code>ID-0028</code> (3 475) и <code>ID-0029</code> (2 308) читать до всякого архива: там сидят обе развёрнутые богословские ветки этого мира — разбор Гермеса и идея развести Сатурна с Хроносом. Обе статьи-заглушки, обе с двумя ссылками. Следом <code>MR-0003</code> (31 443 знака базы) — самая толстая запись по этому миру, и именно в ней должен лежать контекст, которого статье не хватает: кем боги приходятся миру, а не аватарам.</p>\n<p>В архив идти за тремя вещами. Первое — 2024-01-03, id 75982 и 75985: статья сама отмечает, что ответов на эти сообщения в архиве нет, а стоят они ровно посередине разбора Сатурна и Хроноса; без них непонятно, на что именно Слава сказал «Вот идеально». Второе — окно 2024-01-03, id 75970–76019, целиком: выбор мифологии обрывается без решения, и стоит убедиться, что решение не пришло чуть позже той же ночью. Третье и самое перспективное — 2024-07-10, id 202840, реплика «Я тогда ещё богов в мифологий искал». Это единственный след возврата к теме через полгода; окно вокруг неё в статье не разобрано вообще.</p>\n<h3>Как развивалось</h3>\n<p>2024-01-03, день — заявили: боги решили устроить месиво, выбирают аватаров, раздают силы; тут же посыпались имена.</p>\n<p>2024-01-03, вечер — ограничили, причём дважды и с разных сторон. Сначала ограничили аватаров (баланс, выносливость, «как почти что в Джоджо»), потом Слава потребовал ограничений и для самих богов, а Миколай построил под это вертикаль с наказанием сверху. Вертикаль тут же и снесли: «Это и есть высшее существа И они хотят зрелища».</p>\n<p>2024-01-03, поздний вечер — выбор мифологии: шесть вариантов названы, отвергнут один, решение не принято.</p>\n<p>2024-01-04 — забыли: день уходит на способность главного героя и на структуру состава, о богах только вскользь (карманное измерение принадлежит богу, боги призвали персонажей из других миров). Приоритет назван вслух: «Сейчас главная мир нормально создать».</p>\n<p>2024-01-04, поздний вечер — вернулись на один заход, к богу плодородия, уже в женском варианте. После этого к пантеону не возвращаются; следующее и последнее упоминание — 2024-07-10, задним числом.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Правило про Сатурна и Хроноса названо прямо и принято: два имени одного божества можно развести на двух разных богов и присвоить им разные способности — «Вот идеально». В следующей же реплике под это правило подводится вторая пара: «Это как Аматерасу и Идзанами». Но применяется ли к ней то же самое — что это два бога, а не один, и что способности у них разные — не сказано ни одним из соавторов. Правило сформулировано для одного случая, соседний случай назван и оставлен без правила.</p>\n<h3>Отклик</h3>\n<p>Сильнее всего здесь тот кусок, где Миколай выстраивает целую конструкцию — бог не видит результата раздачи силы, видит только последствия, и за последствия его карает бог статусом выше, — а Слава сносит её одной фразой: высшие существа сами хотят зрелища, им беды в кайф. И дальше Миколай спрашивает прямо, почти раздражённо: «Ну тогда ограничения нахуя им», — и получает ответ не про богов, а про людей: «Это жалкий людишки конечно они не смогут в полной мере использовать силы богов». Разговор на этом не ломается, он просто съезжает этажом ниже, и никто этого не замечает. Меня зацепило, что вопрос про ограничения так и остался без ответа не потому, что его не задали, а потому, что задали и ответили не туда. Получившийся мир — где ограничена только смертная сторона, а верх ничем не связан и ничего не хочет, кроме зрелища, — вышел жёстче, чем любой из двух задуманных, и вышел он побочным продуктом того, что двое не договорили.</p></div>", "r": []}];</script>
