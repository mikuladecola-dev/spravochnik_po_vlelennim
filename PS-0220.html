<script>const BASE="";const DOCNAME="Арбетар";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0220-S01", "PS-0220--proishozhdenie"], "h": "<p>Арбетар — класс, введённый Славой 2025-03-10 (id 300882–300912) в ходе дополнения вселенной «Апостол». Появился как продолжение уже существовавшей у авторов лестницы: благословенные, чужемирцы, а внутри чужемирцев — обычные чужемирцы «с разной анатомии», существа и альфы.</p>\n<p>Логика введения названа автором прямо: «Я подумал раз так могут альфа, так значит так могут и люди, сцапать кусок силы своего мира» (300910). И далее определение: «И вот люди, который сцапали кусок силы своего мира называют Арбетар» (300911).</p>\n<p>Чтобы это работало, в том же разговоре Слава заново разложил механику соседних классов:</p>\n<ul>\n<li>Благословенные — «люди у которых есть связь с правителем другого мира, и чтобы получить его силу нужно сначала пропустить еë через мозг, из за этого благословенный не могут использовать благословенный 24/7» (300888).</li>\n<li>Альфы — «раньше означали сильнейшей разумной субъекты в своём мире, которая имеет, что-то похоже на благословенния» (300892), но затем уточнено: «Альфы это субъекты своего мира, который смогли сцапать кусочек силы своего мира, с помощью ритуала или ещё чего, и вот получив кусочек силы своего мира, они зародилил в себе ядро, которая и вырабатывает энергию, у них нет связи, их [...] сила только их [...], а из-за отсутствия связи напряжения на мозг исчезает, так как через мозг больше ничего не проходит, и теперь они по-сути могут использовать свою силу 24/7. И так как это их [...] сила, а не сторонняя, они могут лечить и баффеть не только себя, а огонь которым они устроили пожар не исчезнет пока его не потушить или пока альфа не умрёт» (300898).</li>\n</ul>\n<p>Арбетар — тот же приём, применённый людьми. Сразу после введения класса Слава объявил: «Моя следующая история, о том как они это делают» (300912).</p>\n<p>Название дано на шведском и объяснено в самой прозе: «Арбетар(швецский; на русском трудяга)» (301805, повтор в 301821).</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Что не сформулировано по вашей же логике — не материал авторов</b>\n<p>Для благословенных цена названа механически и до конца: сила чужая, идёт через мозг, мозг от этого нагружается, поэтому пользоваться ею круглосуточно нельзя. Для арбетаров названа только цена входа — 7 процентов, отторжение, гниение, взрыв, безумие. Цена владения не названа: сила внутри, мозг не грузится, отключать не надо, понятия отключения нет. Но одна строка ей противоречит и стоит в этой же статье — «души людей и питательные, но на них вечность прожить не выйдет»: значит, арбетар всё-таки платит, и платит постоянно, чужими душами. Сколько, как часто, что происходит, если перестать, — не проговорено. Для класса, у которого нет ограничения по мозгу, второе ограничение названо одной фразой и не развёрнуто, хотя для соседнего класса такое же развёрнуто полностью. Место показываю.</p></div>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0220-S02", "PS-0220--vneshnost"], "h": "<p>Общего описания вида в переписке нет. Описан только один конкретный арбетар — старик из истории 2025-03-13 (id 301805): он «сука элеганский» одет, «С бородкой как у бизнесменов, с чёрными волосами, одет в смокинг». Рассказчик называет его «дед», «старик», хотя волосы чёрные.</p>\n<p>Отдельно зафиксировано, что арбетары почти не стареют внешне: за 50 лет ученичества мальчик успел перестать быть ребёнком, «а его учитель был таким же, но слегка лишь поседев» (301806).</p>\n<p>Что арбетар делает с чужой внешностью: приходя в деревню, он «начал он из них делать чудищь словно из картины шизофриника» (301805).</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0220-S03", "PS-0220--harakter"], "h": "<p>Черты, зафиксированные на примере старика-арбетара (2025-03-13, id 301805–301806, повтор 301820–301821):</p>\n<ul>\n<li>Разговорчивость и потребность рассказать всё с начала: «а давай сначала, как мы пришли к настоящему?».</li>\n<li>Отношение к возрасту и этикету: обрывает рассказчика замечанием «перебиват плохо, тем более старших».</li>\n<li>Презрение к благословенным как к держателям чужой силы: «Ведь по правде говоря вся их сила, и не их вообще. Жалкий благословенный получивший силу лишь потому что понравились правителем, но сами они эту силу не добывали. Лишь мелкий пизжоны».</li>\n<li>Ненависть к апостолам, названная сильнейшей: «нет не знаешь, Апостолов. Эти апостолы не пойми кем себя возомнили и везде понаставили свои порядки, на чужой силе». При этом признаёт их работу: «Но не могу не признать, что свою работу они выполняють слишком идеально. Ну даже в идеальной системе есть единичные пробои».</li>\n<li>Расчёт и подготовка: перед ритуалом собирал материал годами, ждал, «пока какой-нибудь апостол упустить альфю. При этом доведя его до полусмерти».</li>\n<li>Амбиция: «Я наверное буду сильнейшем арбетатом в этом поколения, если используя тебя».</li>\n<li>Осведомлённость: перед похищением изучил биографию будущего проводника — отсутствие родных и друзей, воспитание бабушкой, незаконченный колледж, драки, бегство из города.</li>\n</ul>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0220-S04", "PS-0220--sposobnosti"], "h": "<p><strong>Питание жизнью и душами.</strong> Арбетар приходит в деревню и «начал он там всё крушить и поглащать жизнь человеческий» (301805). Души людей питательны, но конечны в смысле срока: «Ведь он стар, хоть души людей и питательные, но на них вечность прожить не выйдет» (301806). Именно поэтому арбетар берёт ученика.</p>\n<p><strong>Превращение людей в чудищ.</strong> «начал он из них делать чудищь словно из картины шизофриника» (301805). Как именно — в переписке не сказано.</p>\n<p><strong>Постоянно активная сила.</strong> Устройство силы арбетара названо сходным с альфьим: «Ведь у альфа и арбетатов похожий силый. Они как и мы может использовать свою силу 24/7 без риска повредить мозг. А если сила всегда активна и его защищает, то просто неожиданная атака, на нём не проканает» (301806). То есть сила арбетара работает как пассивная защита, из-за чего внезапное нападение против него не проходит.</p>\n<p><strong>Долголетие.</strong> Прямо словом «бессмертие» арбетары не названы; про альф Слава добавил «Ну бессмертным» (300899). Для арбетаров зафиксировано: сила поддерживается душами, вечности на них не хватает, старение сильно замедлено (50 лет — «слегка лишь поседев»).</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S05", "PS-0220-S05", "PS-0220--ogranicheniya-i-cena"], "h": "<p>Сформулированы 2025-03-10 (id 300913): «И кстати люди и чужемирцы сцапав кусок силы своего мира, их [...] шанс на выживания 7 процентов. Чаще всего идёт отторжения и они могут сойти с ума, их [...] тела могут начать гнить, или взорваться. Или они могут стать монстрами ведомый только инстинктами».</p>\n<p>То есть исходов при захвате куска силы своего мира названо четыре: выживание (7 процентов), сумасшествие, гниение или взрыв тела, превращение в монстра, ведомого инстинктами. Ограничение распространено не только на людей, но и на чужемирцев.</p>", "r": []}, {"t": "Ритуал становления арбетаром", "a": ["S06", "PS-0220-S06", "PS-0220--ritual-stanovleniya-arbetarom"], "h": "<p>Описан 2025-03-13 (id 301806, повтор 301821) со слов старика.</p>\n<p>Путь к нему: арбетар берёт ученика, гоняет его — «Принести то, убить того, сожрать это, защитить того, провести ритуал. И так далее». Ученичество длилось 50 лет, и только после этого «учитель рассказал ему про способ стать Арбетаром. И кинул его в свободное плавание».</p>\n<p>Материалы, названные стариком:</p>\n<ul>\n<li>проводник — человек с чистой душой;</li>\n<li>«пару чужемирцов»;</li>\n<li>«ещё один благословенный»;</li>\n<li>альфа — «самая сложная».</li>\n</ul>\n<p>Сложность добычи материалов ранжирована: благословенного убить легко, потому что он не может пользоваться силой долго и на него можно неожиданно напасть; чужемирцы сложнее, но «это так цветочки»; альфа сложнее всех, потому что его сила активна постоянно и защищает его.</p>\n<p>Требования к проводнику: «В моём обряде нужен проводник. С чистой душой. Ну конечно не прям 100% чистой душой, а где-то на 80% плюс минус. Для этого всё арбетаты чаще всего используют детей лет от 3 до 12, где-то». Взрослый проводник предпочтительнее, если подходит по чистоте души: «Как никак через тело и душу ребёнка проходить мало силы, а вот через тебя. Со взрослым телом и крепкой душой пройдёт куда больше силы». Чистота души рассказчика названа числом — 89 процентов, и этого достаточно, несмотря на его собственный перечень грехов (пил, курит, калечил людей, «почти что суицидник»).</p>\n<p>Сам порядок обряда в переписке не описан.</p>", "r": []}, {"t": "Связи с другими", "a": ["S07", "PS-0220-S07", "PS-0220--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Альфы.</strong> Прямой источник идеи: арбетары — люди, сделавшие то же, что альфы. Сила устроена похоже, обе группы используют её 24/7 без риска повредить мозг. Альфа при этом ещё и материал для ритуала.</li>\n<li><strong>Благословенные.</strong> Противопоставление по механике (у благословенных сила чужая и идёт через мозг, поэтому не круглосуточная) и объект презрения. Благословенный — один из материалов ритуала.</li>\n<li><strong>Чужемирцы.</strong> Названы наравне с людьми как те, кто может «сцапать кусок силы своего мира» с тем же семипроцентным шансом. Также материал ритуала («пару чужемирцов»).</li>\n<li><strong>Апостолы.</strong> Ненавидимы арбетаром; их работа признаётся идеальной. Арбетар пользуется их работой — ждёт, пока апостол доведёт альфу до полусмерти и упустит её.</li>\n<li><strong>Старик-арбетар.</strong> Единственный показанный представитель класса; учитель, ученик другого арбетара, готовит собственный ритуал.</li>\n<li><strong>Антон («Антоша») и его альтер-эго.</strong> Похищенный проводник и голос в его голове. Альтер-эго во время рассказа старика молчит, что рассказчик отмечает как необычное: «Иногда его хер заткнешь, а сейчас молчит». К концу зафиксированного фрагмента альтер-эго сообщает, что «сделал пару заготовок», но не объясняет какие.</li>\n<li><strong>Деревня Лихой</strong> — место, где заперт проводник; старик говорит, что сам её «ели ели нашёл, если бы не учитель, вообще не знал бы о такой».</li>\n<li><strong>Деревня Ливия</strong> «ближе Санкт-Петербург» — деревня, где жил мальчик, ставший учеником; туда пришёл арбетар.</li>\n</ul>", "r": []}, {"t": "Как менялся", "a": ["S08", "PS-0220-S08", "PS-0220--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2025-03-10 (id 300882–300912).</strong> Введение класса. Арбетар — люди, «сцапавшие кусок силы своего мира», по образцу альф. Ничего, кроме определения и обещания следующей истории, не сказано.</p>\n<p><strong>Версия 2 — 2025-03-10 (id 300913–300921).</strong> Добавлена цена: 7 процентов выживания, отторжение с четырьмя исходами. Автор сам помечает состояние идеи: «Идея ещё не до конца доработана так как я еë только сегодня придумал, ну давай доебись я хочу понять где я не прав» (300918). Миколай на разбор ответил, что претензий нет (300920–300921).</p>\n<p><strong>Версия 3 — 2025-03-13 (id 301805–301806).</strong> Арбетар появляется внутри прозы как вид существ, действующий в мире истории. Здесь впервые: шведское название и перевод «трудяга»; разорение деревни и превращение людей в чудищ; питание душами и их недостаточность для вечности; ученичество длиной 50 лет; ритуал и его материалы; требования к проводнику; отношение арбетаров к благословенным и апостолам; постоянно активная сила, из-за которой внезапная атака не работает.</p>\n<p><strong>Версия 4 — 2025-03-13 (id 301820–301821).</strong> Повтор того же текста в более полном виде, с добавленным началом — сценой обсуждения нападения на ресторан («Возми базуку и стрелни в этот ресторан, или запусти туда ракету, или вообще можно ядерку», фургон в 3 часа ночи) и с чуть иным местом обрыва. Содержательно новых сведений об арбетарах не добавляет.</p>\n<p>Версии не отменяют друг друга: определение из 2025-03-10 (люди, взявшие кусок силы своего мира, 7 процентов выживания) и описание из 2025-03-13 (вид существ, разоряющих деревни, с учениками и ритуалом на материалах) в переписке нигде не сведены вместе.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S09", "PS-0220-S09", "PS-0220--chto-s-nim-stalo"], "h": "<p>На последних зафиксированных сообщениях (2025-03-13) старик-арбетар держит проводника в деревне Лихой, материалы для ритуала собраны, сам ритуал не проведён. Рассказчик связан и ищет способ выбраться, альтер-эго говорит: «Не совсем, но сделал пару заготовок. Как? Потом узнаешь сейчас главное выбраться». Продолжения в переписке нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S10", "PS-0220-S10", "PS-0220--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Автор сам отмечает, что идея не доработана (300918).</li>\n<li>Вопрос Миколая «он тоже арбетар пусть и слабый?» (301879) остался без ответа.</li>\n<li>Как соотносятся два способа стать арбетаром — «сцапать кусок силы своего мира» с 7 процентами выживания (2025-03-10) и ритуал на четырёх видах материалов (2025-03-13) — в переписке не сказано; одно ли это и то же, не оговорено.</li>\n<li>Порядок и содержание самого ритуала не описаны.</li>\n<li>Что происходит с проводником после ритуала — не сказано.</li>\n<li>Как арбетар делает из людей чудищ и что это за чудища — не сказано.</li>\n<li>Имя старика-арбетара не названо; имя его учителя тоже.</li>\n<li>Внешность и анатомия арбетаров как вида не описаны — есть только один персонаж в смокинге.</li>\n<li>Не сказано, чем арбетар отличается от альфы, кроме происхождения (человек против субъекта своего мира).</li>\n<li>Не сказано, сколько всего арбетаров и как они относятся друг к другу, кроме связки учитель–ученик.</li>\n<li>Механика «чистоты души» в процентах нигде не объяснена: как измеряется, откуда взяты 89 процентов, почему грехи рассказчика её не понижают.</li>\n<li>Способности арбетара за пределами поглощения жизней, превращения людей в чудищ и постоянной защиты не перечислены.</li>\n<li>Объявленная 2025-03-10 «следующая история, о том как они это делают» (300912) и проза от 2025-03-13 в переписке прямо не связаны.</li>\n</ul></div>\n<div class=\"mnote\"><b>⚙ машинная заметка · С чего начать — не материал авторов</b>\n<ul>\n<li><code>PS-0281</code>, 2025-05-31, окно w0099: тождество с альфами, четыре базовых умения, уникальная способность, обязательное обучение, отсутствие самого понятия «отключить силу». Там же автор снова помечает обряд как незакрытый — «с помощью ритуала??? Которой я ещё не доработал», то есть замечание из 300918 повторено через восемьдесят два дня почти теми же словами.</li>\n<li><code>PS-0226</code>, окна w0104–w0106, 2025-09-12 — 2025-10-18: там арбетар перестаёт быть темой и становится единицей измерения для другого — «Одержимый это аналог Арбетара», апостолы новой вселенной «как арбетары», сенсорика благословенных ощущает «благослрвенных и арбетара или Протобионтов».</li>\n<li>Обряд подробно: <code>SP-0198</code> (48 879, две ссылки), <code>SP-0199</code> «Проводник» (39 325, ссылок ноль), <code>SP-0201</code> «Сила от ритуала» (21 913, ссылок ноль) — последняя закрывает пробел «порядок и содержание самого ритуала не описаны» с той стороны, где результат уже виден.</li>\n<li>Соседние классы, чтобы проверить, держится ли семипроцентное правило: <code>MR-0106</code> «Альфы» (28 881), <code>PS-0179</code> «Благословенные» (78 161), <code>PS-0198</code> «Чужемирцы» (58 680), <code>MR-0146</code> (2 460, три ссылки).</li>\n<li>Вопрос Миколая «он тоже арбетар пусть и слабый?» (301879), оставшийся без ответа: смотреть <code>PS-0222</code> и <code>SP-0196</code>, чьи источники накрывают 301841–301848 и 301857–301861 — тот же участок разговора, куда этот вопрос попал.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0220--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0017.html\">Арбетары</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0017.html\">Арбетары</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0220--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-03-10</td>\n<td>300882–300912</td>\n<td>w0079</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-10</td>\n<td>300913–300921</td>\n<td>w0079</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-13</td>\n<td>301805–301806</td>\n<td>w0080</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-13</td>\n<td>301820–301821</td>\n<td>w0080</td>\n<td>Апостол (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0220-arbetar.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0220--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0220.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0220-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0220/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дыра здесь не в отсутствующем, а в том, что арбетары разложены на четыре записи, которые никто не сводил. <code>PS-0220</code> — 38 531, одна ссылка, март 2025. <code>PS-0226</code> «Арбетары» — 20 681, две ссылки, март плюс сентябрь–октябрь. <code>PS-0281</code> «Арбетары и Альфа» — 7 646, три ссылки, 2025-05-31. <code>GR-0017</code> «Арбетары» — группа, база ноль. Плюс <code>SL-0089</code> «Список категорий сил (Благословенный, Арбетары, Альфы, Чужемирцы, Владельцы артефактов, Фантазёры)» — четыре ссылки, статьи нет, база 1 753: единственная запись, где арбетары стоят в общем ряду категорий, и по ней у справочника ничего нет. Статья честно пишет, что два определения «нигде не сведены вместе». Их не два, а четыре, и трёх из них она не видит.</p>\n<p>Практический выход из этого один и он крупный. Пробел «не сказано, чем арбетар отличается от альфы, кроме происхождения» закрыт в базе прямым ответом: <code>PS-0281</code>, 2025-05-31, id 331636 — «Арбетары и Альфа это одни те же существа. Но в первом случае это люди из кильке, а во втором это чужемирцы». Ровно тот вопрос, ровно тот ответ, лежит два с половиной месяца спустя и в другой записи.</p>\n<p>Вторая по цене — учитель. Сущности нет вовсе: ни персонажа, ни группы, ни строки в реестрах. При этом ученичество — единственный описанный способ, которым знание об обряде вообще передаётся; без него у арбетаров нет преемственности, а есть только одиночки с семипроцентным шансом. На него опираются и эта статья, и <code>PS-0224</code>.</p>\n<h3>С чего начать</h3>\n<p>В базе.</p>\n<ul>\n<li><code>PS-0281</code>, 2025-05-31, окно w0099: тождество с альфами, четыре базовых умения, уникальная способность, обязательное обучение, отсутствие самого понятия «отключить силу». Там же автор снова помечает обряд как незакрытый — «с помощью ритуала??? Которой я ещё не доработал», то есть замечание из 300918 повторено через восемьдесят два дня почти теми же словами.</li>\n<li><code>PS-0226</code>, окна w0104–w0106, 2025-09-12 — 2025-10-18: там арбетар перестаёт быть темой и становится единицей измерения для другого — «Одержимый это аналог Арбетара», апостолы новой вселенной «как арбетары», сенсорика благословенных ощущает «благослрвенных и арбетара или Протобионтов».</li>\n<li>Обряд подробно: <code>SP-0198</code> (48 879, две ссылки), <code>SP-0199</code> «Проводник» (39 325, ссылок ноль), <code>SP-0201</code> «Сила от ритуала» (21 913, ссылок ноль) — последняя закрывает пробел «порядок и содержание самого ритуала не описаны» с той стороны, где результат уже виден.</li>\n<li>Соседние классы, чтобы проверить, держится ли семипроцентное правило: <code>MR-0106</code> «Альфы» (28 881), <code>PS-0179</code> «Благословенные» (78 161), <code>PS-0198</code> «Чужемирцы» (58 680), <code>MR-0146</code> (2 460, три ссылки).</li>\n<li>Вопрос Миколая «он тоже арбетар пусть и слабый?» (301879), оставшийся без ответа: смотреть <code>PS-0222</code> и <code>SP-0196</code>, чьи источники накрывают 301841–301848 и 301857–301861 — тот же участок разговора, куда этот вопрос попал.</li>\n</ul>\n<p>В архив — за одним: сколько арбетаров всего и как они друг с другом, кроме связки учитель–ученик. Этого нет ни в одной записи. Ориентиры: окно w0099, конец мая 2025 (330906–331461, 331636), где вселенная перебиралась целиком, и w0105, 2025-09-17, где Слава решает, оставлять ли арбетаров «как тёмных магов», и сам себе отвечает «ну о нем я ещё думаю».</p>\n<h3>Как развивалось</h3>\n<p>2025-03-10 — заявили одним шагом рассуждения: «раз так могут альфа, так значит так могут и люди», и сразу же анонс — «Моя следующая история, о том как они это делают». В тот же день ограничили: 7 процентов выживания, четыре исхода отторжения, и автор сам пометил идею сырой — «давай доебись я хочу понять где я не прав». 2025-03-13 — вместо обещанной истории «как они это делают» пришла проза, где арбетар уже действует готовым: деревня, чудища, ученик, обряд на четырёх материалах. Заявленное и написанное в переписке не сведены. Дальше два с половиной месяца тишины. 2025-05-31 — вернулись и переопределили класс целиком, ритуал по-прежнему помечен недоработанным. Сентябрь–октябрь — вернулись ещё раз, но уже не к арбетарам, а через них: ими стали объяснять одержимых и апостолов другой вселенной.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для благословенных цена названа механически и до конца: сила чужая, идёт через мозг, мозг от этого нагружается, поэтому пользоваться ею круглосуточно нельзя. Для арбетаров названа только цена входа — 7 процентов, отторжение, гниение, взрыв, безумие. Цена владения не названа: сила внутри, мозг не грузится, отключать не надо, понятия отключения нет. Но одна строка ей противоречит и стоит в этой же статье — «души людей и питательные, но на них вечность прожить не выйдет»: значит, арбетар всё-таки платит, и платит постоянно, чужими душами. Сколько, как часто, что происходит, если перестать, — не проговорено. Для класса, у которого нет ограничения по мозгу, второе ограничение названо одной фразой и не развёрнуто, хотя для соседнего класса такое же развёрнуто полностью. Место показываю.</p>\n<h3>Отклик</h3>\n<p>Лучшее здесь — как класс появился. Не из образа и не из сцены, а из одного логического хода: альфы умеют вот так, люди устроены не хуже, значит и люди могут. Из этого сразу же вырос семипроцентный шанс и четыре способа не пережить попытку. Такие вещи обычно придумывают ради красивого монстра, а тут монстр вышел побочным продуктом честного рассуждения. И название под стать: существо, которое жрёт деревни и держит ученика полвека, называется «трудяга» — на шведском, с переводом, данным прямо в тексте, будто сноска в учебнике. Кто-то посмотрел на людей, вырывающих у мира кусок силы, и решил, что это рабочая специальность. Ещё нравится реплика «давай доебись я хочу понять где я не прав» — автор, который приносит идею и просит по ней ударить, а не похвалить. И то, что через восемьдесят два дня он сам же снова написал «Которой я ещё не доработал», по-моему, не провал, а признак того же честного отношения: не стал делать вид, что закрыл.</p></div>", "r": []}];</script>
