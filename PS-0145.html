<script>const BASE="";const DOCNAME="рыболюди";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0145-S01", "PS-0145--proishozhdenie"], "h": "<p>Рыболюди — раса монстров, впервые появившаяся 2024-08-17 в тексте Славы про узника (2024-08-17, id 220168, окно w0053). Появление не через описание расы, а через еду: на десятый день заточения узнику вместо каши приносят большую накрытую тарелку, и под крышкой оказывается голова.</p>\n<p>Дословно: «Поднял крышку, а там сука бошка, нет не башка человека или какого либо животного. А бышка рыба человека».</p>\n<p>Именно эта голова меняет представление узника о том, кто его держит: «И здесь я уже начал понимать что это не просто псих а какое то охотник на нечисть сука или как это можно назвать. Какой то человек убивающий монстров с психологическими проблемами запер меня здесь и заставляет есть хуй пойми чей».</p>\n<p>Название расы как таковое в чате не закреплено: она встречается только через словосочетания — «рыба человек», «рыболюди», «рыбочеловек», «рыбомонстр».</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0145-S02", "PS-0145--vneshnost"], "h": "<p>Целостного описания нет. Известны только части тела, которые попадали в кадр:</p>\n<ul>\n<li>голова, отделённая и поданная на тарелке (id 220168) — по ней узник опознаёт, что это не человек и не животное;</li>\n<li>тушка, которую собираются нарезать: «пойдём уже нарежем тушку рыбомонстра» (2024-08-26, id 224940).</li>\n</ul>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0145-S03", "PS-0145--harakter"], "h": "<p>Про характер и разум расы в переписке ничего не сказано. Единственное, что приписано им как коллективное действие, — знание о носителе их генов: «чел родился с генами, рыбалюди об этом знают» (id 220213). Как именно они узнают и что предпринимают — не сказано.</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0145-S04", "PS-0145--sposobnosti"], "h": "<p><strong>Регенерация.</strong> Названа в версии от 2024-08-29 (id 226088): «постоянная гипермедленная регенерация даже в варёном состоянии». То есть регенерация не прерывается ни смертью, ни разделкой, ни варкой; спасатель называет это «райское наслаждение для моих очей».</p>\n<p><strong>Питание другими существами.</strong> «и то, как эта ошибка природы питается этими существами так расслабляет» (id 226088). Какими именно существами — не уточнено.</p>\n<p><strong>Передача генов человеку.</strong> Механику 2024-08-17 предложил Миколай (id 220213), разбирая, кем может быть узник. Исходный вариант — зачатие — был тут же отклонён как несовместимый со вселенной Славы, и заменён укусом:</p>\n<p>«типа, его отец плавал в месте где обитают рыболюди, кто-то из них кончил, но это в твоей вселенной кринж, ток что укусил отца этого чела в ключицу, ну и в семяпроводе через кровь или молочные железы проникли гены рыбочеловека».</p>\n<p>Оговорка автора о правдоподобии тут же: «мне похуй насколько это реалистично, такой концепт интересен и можно его запихнуть сюда, ты сможешь доработать может если не нравится».</p>\n<p>Из носительства генов, по этому же предложению, следуют каннибализм и физические способности — именно за ними охотник наблюдает: «начал над ним опыты проводить и наблюдать за каннибализмом и физическими способностями».</p>\n<p><strong>Пищевые свойства.</strong> «суп из него такой ароматный» (id 226088). Голову подают узнику как еду (id 220168).</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0145-S05", "PS-0145--svyazi-s-drugimi"], "h": "<p><strong>Спасатель</strong> — он же охотник и похититель. Тождество установлено прямым вопросом и ответом: Слава — «Кто похититель ?», Миколай — «а, бля», «ясен хуй спасатель» (id 220214–220216). По версии от 2024-08-17 цепочка его действий такая: «охотник пытался чет допросить одного такого монстра, узнал историю и начал охоту уже на человека». В версии от 2024-08-29 он говорит от первого лица: «я же вообще за рыбочеловеком шел до Ньюса», и планирует 56 тестов, после которых «смогу с уверенностью определить его возможности, его днк и другие данные».</p>\n<p><strong>Узник</strong> — тот, кому подали голову на тарелке. Он готов на всё ради освобождения, включая «хоть полностью сожрать того рыба человека. Да сука хоть человека».</p>\n<p><strong>Чел с генами рыбочеловека</strong> — версия личности узника, предложенная Миколаем 2024-08-17 (id 220213). Отец этого человека плавал там, где обитают рыболюди, и был укушен в ключицу.</p>\n<p><strong>Ньюс</strong> — место, до которого спасатель шёл за рыбочеловеком (id 226088).</p>\n<p><strong>Монстры как домен живых существ</strong> — общая рамка, изложенная в id 224940: «монстры - один из доменов живых существ. в ряду с бактериями, археями или эукариотами. у каждого типа свои особенности, появления, поведения. в общем целая наука». Там же в конце реплики звучит замечание про осетра: «ну осётр своего рода монстр, но он же из домена эукариотов» — сказано о рыбе, не о рыболюдях.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0145-S06", "PS-0145--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2024-08-17 (id 220168, окно w0053).</strong> Существование расы вводится одной деталью — головой на тарелке. Ни места обитания, ни свойств, ни отношения к людям ещё нет. Функция в тексте — сигнал узнику, что его держит охотник на нечисть.</p>\n<p><strong>Версия 2 — 2024-08-17 (id 220213–220216, окно w0053).</strong> Миколай достраивает расу до чего-то с ареалом и связями: у рыболюдей есть «место где обитают рыболюди», их гены могут попасть к человеку, и они знают о таком носителе. Здесь же зафиксирован отклонённый вариант передачи генов (зачатие — «в твоей вселенной кринж») и принятый (укус в ключицу, проникновение генов «в семяпроводе через кровь или молочные железы»). Здесь же охотник получает мотив: допрос одного из рыболюдей приводит его к охоте на человека-носителя.</p>\n<p><strong>Версия 3 — 2024-08-26 (id 224940, окно w0055).</strong> Рыбомонстр появляется как расходный материал в быту лаборатории: реплика, которой обрывается спор о природе монстров, — «пойдём уже нарежем тушку рыбомонстра и телефон парню зарядим, посмотрим, что сегодня напишет». В этой же реплике излагается доменная классификация монстров и говорится о существе с синей кровью, гемоцианином, — но связь этого существа с рыболюдьми в переписке не названа.</p>\n<p><strong>Версия 4 — 2024-08-29 (id 226088, окно w0055).</strong> Раскрываются свойства: ароматный суп, постоянная гипермедленная регенерация даже в варёном состоянии, питание другими существами. Появляется маршрут — «за рыбочеловеком шел до Ньюса» — и исследовательская программа: после 56 тестов спасатель рассчитывает определить возможности и ДНК. Вычислениями займётся «тот паренёк», «пока не надоест», деньги на исследование он «сможет с глубин интернета собрать».</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0145-S07", "PS-0145--chto-s-nim-stalo"], "h": "<p>Отдельные особи оказываются в положении добычи и материала: одну допрашивал охотник (2024-08-17), одна голова подана узнику на тарелке (2024-08-17), тушку собираются нарезать (2024-08-26), над одним ведётся серия тестов с целью установить ДНК и возможности (2024-08-29). Судьба расы в целом в переписке не описана.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0145-S08", "PS-0145--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Название расы как таковое не закреплено — только словосочетания.</li>\n<li>Место обитания названо, но не названо: «место где обитают рыболюди». Ньюс упомянут как точка маршрута спасателя, а не как их ареал.</li>\n<li>Внешность целиком не описана; известны только голова и тушка.</li>\n<li>Разум, речь, численность, устройство сообщества — не сказано ничего. При этом охотник кого-то из них «пытался чет допросить», а результата допроса как реплики в переписке нет.</li>\n<li>Как рыболюди узнают о носителе своих генов — не сказано.</li>\n<li>Чем именно они питаются — «этими существами», без уточнения.</li>\n<li>Синяя кровь и гемоцианин (id 224940) с рыболюдьми в переписке напрямую не связаны.</li>\n<li>Предложение Миколая про гены оставлено открытым для переработки — «ты сможешь доработать может если не нравится»; доработки в переписке нет.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0145--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0038.html\">Рыболюди</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0145--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-17</td>\n<td>220168–220168</td>\n<td>w0053</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-08-17</td>\n<td>220213–220216</td>\n<td>w0053</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-08-26</td>\n<td>224940–224940</td>\n<td>w0055</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-08-29</td>\n<td>226088–226088</td>\n<td>w0055</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0145-rybolyudi.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0145--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0145.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
