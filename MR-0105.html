<script>const BASE="";const DOCNAME="Организация злодеев";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0105-S01", "MR-0105--ustroystvo"], "h": "<p>Организация злодеев (в переписке пишется также «организаций злодеев») — объединение во вселенной «Апостол», появившееся в окне w0072 (2025-01-22 — 2025-01-23) как заданное Славой направление работы.</p>\n<p>Разговор начинается с прямого вопроса Миколая: «окей, в какую мне сторону думать?» (2025-01-22, id 283833). Ответ Славы — «Мотивы организаций злодеев» (id 283835). То есть организация возникает не как описанная структура, а как поставленная задача: придумать её мотивы.</p>\n<p>Тем же сообщением задан состав: «В их ней организаций есть Альфы и благословенный» (id 283835).</p>\n<p>Глава организации определена на следующий день: «При этом глава этой организации будет единственный благословенный правителем нашего мира» (2025-01-23, id 284170), и сразу же — «То бишь она будет грубо говоря сильнейшей» (id 284171). Глава — женщина, и её первенство держится не на должности, а на источнике благословения: правитель нашего мира благословил только её.</p>\n<p>Расстановка сил вокруг организации (<a href=\"MR-0107.html\">Иерархия силы</a>): глава сильнее всех, «7 грехов и божество ( помнишь его) Будет слабей главы этой организации но сильней благословенного» (id 284175).</p>\n<p>Сами мотивы организации — то, ради чего разговор и был начат, — в окне так и не сформулированы.</p>", "r": [["Иерархия силы", "MR-0107.html"]]}, {"t": "Население", "a": ["S02", "MR-0105-S02", "MR-0105--naselenie"], "h": "<p>Названы две категории состоящих в организации: <strong>Альфы</strong> и <strong>благословенные</strong>.</p>\n<p>На вопрос Миколая «альфы?» (id 283836) Слава отвечает определением: «Альфы сильнейший существа в своём мире» (id 283839). Определение привязано к миру: альфа — сильнейший в своём мире, а не вообще.</p>\n<p>Глава организации — единственная благословлённая правителем нашего мира.</p>\n<p>Семь грехов и божество названы в связи с организацией — они вписаны в иерархию под главой, — но членами организации в переписке прямо не объявлены.</p>\n<p>Поимённого состава организации нет: кто из благословенных и кто из Альф в неё входит, не перечислено.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0105-S03", "MR-0105--mesto-vo-vselennoy"], "h": "<p>В том же обмене Миколай задаёт два вопроса об устройстве вселенной, и оба получают короткие ответы:</p>\n<ul>\n<li>«а дьявол существует?» (id 283837) — «Возможно» (id 283841). Существование дьявола на этот момент не подтверждено и не отвергнуто.</li>\n<li>«миры разные всё ещё есть?» (id 283838) — «Да» (id 283840). Множественность миров подтверждена, и на неё же опирается определение Альф («сильнейший существа в своём мире») и статус главы («правителем нашего мира»).</li>\n</ul>\n<p>На этом Миколай отвечает «хорошо» (id 283842), и обсуждение состава прекращается.</p>\n<p>Записи, с которыми связана организация: Альфы, Благословение Бога и дьявола, Глава организации злодеев, Иерархия силы (<a href=\"MR-0107.html\">Иерархия силы</a>), Семь грехов.</p>", "r": [["Иерархия силы", "MR-0107.html"]]}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0105-S04", "MR-0105--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-01-22</strong> (окно w0072, id 283833–283842).</p>\n<p>Объявлена тема — мотивы организации злодеев. Задан состав: Альфы и благословенные. Дано определение Альф. Подтверждено, что разные миры всё ещё есть; про дьявола сказано «Возможно».</p>\n<p><strong>Версия 2 — 2025-01-23</strong> (окно w0072, id 284147–284176).</p>\n<p>Появляется глава: единственная благословлённая правителем нашего мира, сильнейшая. Под ней в иерархию вписаны семь грехов и божество — слабее главы, но сильнее благословенного. Далее Слава переходит к разбору способностей семи грехов (id 284176), и разговор об организации как таковой в этом окне заканчивается.</p>\n<p>Ход обмена во второй версии: Слава пишет «?» (id 284147), после чего идёт пауза 1.7 часа; затем Слава сам добавляет описание главы и ещё раз ставит «?» (id 284172); Миколай отвечает «я позже отвечу» (id 284174). Обе развилки — состав и мотивы — остаются за Славой.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0105-S05", "MR-0105--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Сами мотивы организации так и не сформулированы, хотя именно они были поставлены как задача. Миколай дважды откладывает ответ («я позже отвечу», а перед этим просто «хорошо»).</li>\n<li>Название организации не дано — она называется описательно, «организация злодеев».</li>\n<li>Поимённый состав не назван.</li>\n<li>Не сказано, входят ли семь грехов и божество в организацию или только сопоставлены с ней по силе.</li>\n<li>Существование дьявола оставлено на «Возможно».</li>\n<li>Кто такой «правитель нашего мира» и чем его благословение отличается от прочих — не раскрыто.</li>\n<li>Сколько всего Альф в организации и из каких они миров — не сказано.</li>\n<li>Против кого действует организация и как соотносится с Церковью, Военными и прочими разделами реестра — в окне не обсуждалось.</li>\n</ul></div>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Дороже всего здесь стоят не пробелы внутри статьи, а реестры, на которые она опирается снаружи. <code>SL-0053</code> «Список персонажей вселенной (Благословенные / Враг / Церковь / Военный / Сторонние силы / Семь грехов / Существа / Аномалии / Оружие / Артефакты / Идеи)» — шесть ссылок, статьи нет, в базе 20 313 знаков. <code>SL-0051</code> «Каталог: благословенные, враги, грехи, оружие, артефакты» — тоже шесть ссылок, статьи нет, 9 834. Следом <code>SL-0090</code> (четыре ссылки, 5 492) и <code>SL-0089</code> (четыре ссылки, 1 753). На четверых — ни одной статьи и почти 37 килобайт неразобранного. Последний пробел статьи — «против кого действует организация и как соотносится с Церковью, Военными и прочими разделами реестра» — упирается ровно в них: разделы, с которыми надо соотносить, существуют только внутри этих четырёх записей.</p></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0105--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0107.html\">Иерархия силы</a></li>\n<li><strong>Упомянут в мирах:</strong> <a href=\"MR-0107.html\">Иерархия силы</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0002.html\">Семь грехов</a>, <a href=\"GR-0006.html\">Организация злодеев</a>, <a href=\"GR-0018.html\">Альфы</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0105--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-01-22</td>\n<td>283833–283842</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-23</td>\n<td>284147–284176</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0105-organizaciya-zlodeev.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0105--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0105.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["MR-0105-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/MR-0105/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дороже всего здесь стоят не пробелы внутри статьи, а реестры, на которые она опирается снаружи. <code>SL-0053</code> «Список персонажей вселенной (Благословенные / Враг / Церковь / Военный / Сторонние силы / Семь грехов / Существа / Аномалии / Оружие / Артефакты / Идеи)» — шесть ссылок, статьи нет, в базе 20 313 знаков. <code>SL-0051</code> «Каталог: благословенные, враги, грехи, оружие, артефакты» — тоже шесть ссылок, статьи нет, 9 834. Следом <code>SL-0090</code> (четыре ссылки, 5 492) и <code>SL-0089</code> (четыре ссылки, 1 753). На четверых — ни одной статьи и почти 37 килобайт неразобранного. Последний пробел статьи — «против кого действует организация и как соотносится с Церковью, Военными и прочими разделами реестра» — упирается ровно в них: разделы, с которыми надо соотносить, существуют только внутри этих четырёх записей.</p>\n<p>Вторая по цене — <code>PS-0185</code> «Глава организации злодеев». Статья есть, но в базе под ней 3 050 знаков, меньше, чем у любой другой опорной фигуры этого узла (<code>PS-0187</code> Семь грехов — 10 426, <code>MR-0106</code> Альфы — 28 881, <code>PS-0179</code> Благословенные — 78 161). При этом на главе держится вся расстановка: <code>MR-0107</code> «Иерархия силы» (четыре ссылки) считает силу от неё вниз. Вершина иерархии — самая пустая запись в иерархии.</p>\n<h3>С чего начать</h3>\n<p>В базе, не в архиве. Мотивы, ради которых разговор и был начат, в соседней записи есть: <code>IS-0036</code> «Цель злодеев: объединение всех миров», 2025-03-06, окно w0079, id 298826–298857, 11 288 знаков базы. Там названо и чего злодеи хотят (слить все миры в один обрядом, собрав артефакты), и кто именно этого хочет — сначала правитель Кильки, потом, в той же переписке, сестра имитатора. Слово «организация» там не звучит ни разу, поэтому запись и не подцепилась; свести её с этой статьёй — первое действие.</p>\n<p>Туда же: <code>ID-0111</code> «Добродетели и грехи как основа благословений» (5 419, статьи нет, одна ссылка) — под вопрос, как семь грехов оказались вписаны в иерархию благословений. И <code>SP-0165</code> «Базовые умения благословенных дьявола» (2025-01-06, id 278987) — на две с половиной недели раньше этого окна.</p>\n<p>В архив идти за одним: за паузой 2025-01-23. Слава ставит «?» (id 284147), 1.7 часа тишины, потом сам дописывает про главу и ставит «?» ещё раз (id 284172). Посмотреть, что было в эти 1.7 часа в других окнах того же дня — не ушёл ли разговор о мотивах в сторону.</p>\n<h3>Как развивалось</h3>\n<p>2025-01-22 — заявили как задачу, не как объект: «в какую мне сторону думать?» — «Мотивы организаций злодеев». Тем же сообщением задан состав. 2025-01-23 — ограничили сверху: появилась глава, единственная благословлённая правителем нашего мира, и под неё подстроилась иерархия — семь грехов и божество слабее её, но сильнее благословенного. Забыли в тот же день: id 284176, Слава переходит к способностям семи грехов, Миколай отвечает «я позже отвечу», и мотивы — то единственное, ради чего тема открывалась, — остаются ненаписанными. Вернулись через полтора месяца и мимо: 2025-03-06 цель злодеев формулируется целиком, но уже без слова «организация» и с другим носителем цели.</p>\n<p>Отдельно по датам: 2025-01-06, за шестнадцать дней до этого окна, благословенные дьявола уже расписаны отдельным набором из пяти умений (<code>SP-0165</code>). 2025-01-22 на вопрос «а дьявол существует?» ответ — «Возможно».</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для правителя нашего мира число благословлённых названо точно — один, и на этой единственности держится первенство главы. Тут же подтверждено, что «миры разные всё ещё есть», то есть правителей больше одного. Сколько благословлённых даёт правитель вообще — единственность это свойство именно нашего правителя или общее правило для всех — не проговорено. Правило посчитано для одного случая и не распространено на соседний, хотя соседний в том же обмене и подтверждён.</p>\n<h3>Отклик</h3>\n<p>Зацепила форма, в которой эта организация существует: она вся состоит из ответов на вопросы и ни одного собственного утверждения о себе не содержит. Название описательное, состава нет, мотивов нет, но иерархия вокруг неё выстроена до последней ступеньки — кто кого сильнее, известно точнее, чем кто это вообще. И главная — не по должности, а потому что кто-то один раз выбрал именно её и больше никого; должность тут вообще не при чём, первенство держится на чужом жесте. Сильнее всего кончается окно: «?», полтора часа тишины, ещё раз «?», «я позже отвечу». Задача, поставленная вопросом, закрывается вопросом. Организация злодеев — единственное место в этом куске мира, где ничего не решено и при этом всё расставлено по местам.</p></div>", "r": []}];</script>
