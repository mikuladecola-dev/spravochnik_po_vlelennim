<script>const BASE="";const DOCNAME="Правители";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0278-S01", "PS-0278--proishozhdenie"], "h": "<p>Правители — «не физические существа появившиеся в нигде и в ни чем». Они первое, что появилось в пустоте, и именно они начали создавать мир — «по своему желанию» (2025-05-31, id 331635).</p>\n<p>Порядок появления задан прямо: «Первым правителем был правитель кильке. Вторым же был правитель рая». Из этого порядка выводится масштаб их владений — «Поэтому их мир в разы больше миров других правителей».</p>\n<p>Между всеми мирами есть связь, «которую не может оборвать не один правитель» — формулировка дана в скобках сразу после утверждения о создании миров и повторяется без изменений во всех фиксациях материала.</p>\n<p>На вопросы Миколая «нахуя и с чего» (2025-05-31, id 331648) — то есть зачем и откуда взялись правители — Слава отвечает «Фиг знает» (id 331653) и добавляет отсылку: «В истории было про упыря и битвой с защитником» (id 331654). Само происхождение правителей дальше не разбирается.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0278-S02", "PS-0278--vneshnost"], "h": "<p>Правители нефизические. Никакого описания облика, формы или проявления в переписке нет.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0278-S03", "PS-0278--harakter"], "h": "<p>Прямых характеристик правителей как личностей в переписке нет. Косвенно зафиксировано следующее:</p>\n<ul>\n<li>Миры они создают «по своему желанию».</li>\n<li>Правители всевидящие (2025-05-31, id 331636).</li>\n<li>Они «не как не могут влиять на благословенного или обычного существа» — единственное исключение оговорено тут же: «кроме как насильственно давать благословения, даже если само существо этого не хочет».</li>\n<li>Правитель может выкинуть существо из своего мира, но это происходит «очень очень очень, крайне редко».</li>\n</ul>\n<p>О детях-Протобионтах сказано, что «большинство существ спокойный и миролюбивый» — это характеристика детей, не самих правителей.</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0278-S04", "PS-0278--sposobnosti"], "h": "<h3>Создание миров</h3>\n<p>Правители создают миры. Процесс не всегда им подконтролен: «Когда то правитель пытался создать мир. И не в состоянии полностью контролировать этот процесс наделили какой-либо объект через чур большой сил этот самый объект». Так появляются артефакты — объекты, имеющие силу правителя.</p>\n<p>Отдельно выделены артефакты с символикой — «артефакт, который не был ни кем создан. Они появились вместе с правителями и имеют невероятную мощь». Смертным существам «некогда не раскрыть хотя бы 3 процентов всей мощи артефакт».</p>\n<p>Оговорено, кто лучше всего пользуется артефактами: «Благословенный; альфа, Арбетары и фантазёры не способны раскрыть всю мощь артефакта. Так как уже сами переполненный силой. Лучшего всего мощь артефакта способен раскрыть обычный человек».</p>\n<h3>Всевидение</h3>\n<p>«При этом правители всевидящий» (id 331636). Границы этого свойства не разбираются.</p>\n<h3>Благословение</h3>\n<p>Правители способны давать благословение — «то есть настраивать связь с существом живущими в мире». В скобках стоит ограничение: «благословения даётся только существами живущими в кильке».</p>\n<p>Механика, как она изложена (2025-05-31, id 331635):</p>\n<ul>\n<li>Связь настраивается «без его разрешения» — согласие существа не требуется.</li>\n<li>Через связь правитель передаёт свою силу существу, «человеку чаще всего».</li>\n<li>«Сама связь устанавливается на мозге. То есть сила или энергия проходит через мозг вредя ему».</li>\n<li>Из-за вреда мозгу «благословенный не часто используют благословения».</li>\n<li>«Средние продолжительность жизнь у благословенного после получения благословения 10 лет».</li>\n</ul>\n<p>Ограничения на количество (id 331636): «благословения даётся только одно. Больше человек не выдержит. И это одно благословения с ним до его смерти. Благословения нельзя разорвать».</p>\n<p>Что даёт благословение. При активации, «то есть пропускания энергий через мозг», у всех благословенных есть четыре основных способности:</p>\n<ol>\n<li>усиленная регенерация;</li>\n<li>усиление тела и всех чувств;</li>\n<li>аура — «то бишь самая энергия, которая выплескивается и заставляет чувствовать страх е животных и обычных людей. Так же способный влиять на окружающей. При сильном скоплении»;</li>\n<li>сенсорика — «позволяет ощущать других благослрвенных и арбетара или Протобионтов».</li>\n</ol>\n<p>Сверх четырёх базовых есть «уникальная способность правителя». Уникальность здесь принадлежит правителю, а не благословенному: «под уникальным подразумеввется, что у правителя уникальная благословенния дающий отличающий от всех других благословенной способность. НО если правитель, что дал вам благословения. Даст благословения ещё другому человеку. То оно будет такой же, как и у вас».</p>\n<p>Все эффекты благословения обратимы и исчезают при отключении: «например вам дали ьлагословенния и ваша уникальность способность это огонь. Вы можете поджечь лес. Но после отключения благословенния весь огонь исчезнет. &lt;…&gt; Буть то огненный шар или остановка времени они просто отключаться».</p>\n<p>Уравнивание по силе: «так как всё благословенный включая апостолов. Получают плюс минус одинаковая количество энергии ( силы). Они являются одинаково сильными. Но это не включая индивидуальность людей. Всё же апостолы всё равно чаще всего сильнее любого другого благословенного».</p>\n<h3>Ограничение числа благословений</h3>\n<p>Число благословений у правителя ограничено, и предел разный: «21 это максимальное число благословения, который способен давать правитель рая. Другие же правители дают меньше». Пределы других правителей не названы.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>И отдельно — октябрьский перепост разъехался на три записи без статей и без вселенной: <code>SP-0240</code> «Благословение правителя» (9 835, вселенная «неясно», ссылок 0), <code>SP-0241</code> «Четыре основные способности благословенных» (9 573, «неясно», 0), <code>SP-0242</code> «Уникальная способность правителя» (9 592, «неясно», 0). Это тот же текст 331635, что здесь уже разобран. Пробел «в версии от 2025-10-18 вселенная не названа» существует не в одном месте, а в четырёх сразу.</p></div>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0278-S05", "PS-0278--svyazi-s-drugimi"], "h": "<h3>Правитель кильке</h3>\n<p>Первый появившийся правитель. Его мир — Килька — «в разы больше миров других правителей». Существа кильке не могут покинуть свой мир: «всё существа кильке не способны покинуть свой мир. Не каким либо образом». При этом связь кильки с каждым другим миром сильная, поэтому существа, покидающие свой мир, «неосознанно перемещаться по связи» и чаще всего попадают именно в кильку. Благословение даётся только существам, живущим в кильке.</p>\n<h3>Правитель рая</h3>\n<p>Второй появившийся правитель, его мир также «в разы больше миров других правителей». Даёт максимум 21 благословение — это Апостолы. Работает не так, как остальные правители: «правитель рая. Посылает им лишь сгустки чистой и необработанной силы, который формируется во что уже только внутри Апостолов. Даруя им уникальные способности». Поэтому у благословенных правителя рая способности разные, тогда как «у всех благословенных одного правителя одна и та же способность».</p>\n<h3>Апостолы</h3>\n<p>«21 человек получивший благословен от правителя рая». Сверх четырёх базовых способностей и уникальной у них есть дополнительная — телепатия между собой: «они способны разговаривать. На расстоянии и также всем мести. Они также могут отказаться от телепатического общения и прервать разговор».</p>\n<h3>Протобионты</h3>\n<p>Дети правителей. «Это субъект, который был создан именно правителем, а не из-за особенности мира». Сила: «имеют огромную силу, которая в теории позволит уничтожить континент». Характер: «большинство существ спокойный и миролюбивый». Поведение: «они очень не любят покидать мир своего родителя».</p>\n<p>Миколай пересчитывает масштаб этой силы (2025-05-31, id 331649): если килька — вселенная с миллионом галактик, в галактике миллион солнечных систем, в системе от 1 до 50 планет, а на планете вроде Земли 6–7 материков, то существо, уничтожающее континент, уничтожает Евразию. Слава уточняет масштаб (id 331655): «Я подразумевал существ среднего и малого мира. А вот из нашего то он вполне солнечную систему разрушит».</p>\n<p>На вопрос Миколая, есть ли протобионты у любого правителя (id 331656), Слава отвечает «Ну да наверное» (id 331657) — ответ не твёрдый.</p>\n<h3>Арбетары и Альфа</h3>\n<p>Правители к ним прямого отношения не имеют, но их сила — того же происхождения. «Арбетары и Альфа это одни те же существа. Но в первом случае это люди из кильке, а во втором это чужемирцы». Это существа, «который насильственно вырвали кусок силы своего мира (с помощью ритуала??? Которой я ещё не доработал). А после посели его в себе и заставили выделять силу».</p>\n<p>Отличие от благословенных: сила у них внутри, а не через связь — «по сути это благословенния только не через связь. А именно это сила находиться внутри их», в виде перегрузки мозга. Пользуются они ей «без ограничений». Базовые умения те же четыре, но «регенерация чаще всего превосходит благословенных». Уникальная способность у них индивидуальна даже при одинаковом источнике: «Даже если они сцапали один и тот же кусок силы. У них она всё равно будет разная. Так как этот кусок начинает формироваться подобно апостолом».</p>\n<p>Их эффекты необратимы: «если они подожгут лес он будет гореть пока весь не выгореть. Либо его не потушат. Им не зачем отключат способность. У них даже нету такого понятия, как отключения». Но плата другая: «они должны будут учиться вырабатывать энергию и научиться использовать способность и контролировать энергию. Когда у благословенным это выходит автоматический».</p>\n<h3>Фантазёры</h3>\n<p>«Фантазеры это можно сказать правитель с маленькой буквой. Они создали свой мир в голове». Из-за этого «даже глядя на наш мир (то бишь мир в котором находиться их физическая оболочка). Они видят его по другому». Пример: фантазёр, «что видит мир виде линей, колебаний. Глядя на стенку он видит лишь большо миллиона движущих линий, который за, что-то отвечают».</p>\n<p>Отсюда способ воздействия: «он способен влиять на наш мир. По законам своего. То есть он может изменить колебания волны (нитки). И стена может стать воздухом или водой или взорваться в зависимости. Какую нитку потянули и как на неё повлияли».</p>\n<p>Статус и уязвимость: «Фантазёр на данный момент сильнейший существа. Но они могут просто исчезнуть. Потерять связь с нашим мирам и полностью окунуться свой. Исчезая. Из-за этого их очень мало. Ведь нет не одной причины жить в мире правителя. Если ты можешь попасть в свой».</p>\n<h3>Выход из миров правителя</h3>\n<p>Способы покинуть мир перечислены списком, первый — с вопросительными знаками автора:</p>\n<ul>\n<li>«С помощью ритуала???»;</li>\n<li>дойти до края мира, «если ваш мир маленький или средний. И прыгнув за край мир вас перенесёт в другой мир»;</li>\n<li>«Можно попасть в пространственную аномалию»;</li>\n<li>«Вас может выкинуть сам правитель (очень очень очень, крайне редко)».</li>\n</ul>\n<p>Общее правило: «Любое существо может покинуть свой мир если будет знать способ». Исключение — килька.</p>", "r": []}, {"t": "Как менялся", "a": ["S06", "PS-0278-S06", "PS-0278--kak-menyalsya"], "h": "<h3>2025-05-31, id 331635–331638 — первое развёрнутое описание</h3>\n<p>Слава выкладывает большой лор-дамп двумя сообщениями. Первое (id 331635) — правители, порядок их появления, связь миров, способы покинуть мир, Протобионты, механика благословения, четыре базовые способности, уникальная способность правителя, обратимость эффектов, Апостолы и их телепатия. Второе (id 331636) — невмешательство правителей и правило одного неразрывного благословения, всевидение, Арбетары и Альфа, Фантазёры, артефакты и артефакты с символикой.</p>\n<p>Заканчивает Слава двумя репликами о самом факте написанного: «Не знаю зачем я это сделал» (id 331637), «Но пусть будет» (id 331638).</p>\n<h3>2025-05-31, id 331646–331662 — разбор вопросами</h3>\n<p>Миколай разбирает выложенное вопросами. Часть получает ответы:</p>\n<ul>\n<li>«че такое существо?» (id 331646) → «Живые люди животные и тп» (id 331652);</li>\n<li>«нахуя и с чего» (id 331648) → «Фиг знает» (id 331653), «В истории было про упыря и битвой с защитником» (id 331654);</li>\n<li>пересчёт масштаба силы Протобионтов (id 331649) → уточнение про средний и малый мир против нашего (id 331655);</li>\n<li>«а, у любого правителя есть пробионты» (id 331656) → «Ну да наверное» (id 331657).</li>\n</ul>\n<p>Часть вопросов на краю окна ответа не получает:</p>\n<ul>\n<li>«возможно ты объяснил, но лучше напиши, почему им» (id 331658);</li>\n<li>«корову можно?» (id 331659) — можно ли благословить корову;</li>\n<li>«я могу её поглощать? левый чел. это энергия правителя? что он об этом думает? о выпуске энергии. а мозгу так легче, когда энергия во вне текёт? а если бы не лилась?» (id 331660);</li>\n<li>«можно бессмертному дать второе?» (id 331661) и «как?» (id 331662).</li>\n</ul>\n<h3>2025-10-18, id 375843–375852 — возврат к тексту</h3>\n<p>Миколай приносит ссылку на набросок страницы (codepen, id 375843) со словами «что если так?», «ваще простенький набросок», «это только по одному твоему сообщению» (id 375844–375848). Затем воспроизводит текст правителей (id 375849) — дословно сообщение 331635 от 2025-05-31, без изменений. Второе майское сообщение (331636 — невмешательство, всевидение, Арбетары, Фантазёры, артефакты) в этот перепост не входит.</p>\n<p>Слава отвечает: «Очень круто» (id 375851), «Делай так» (id 375852).</p>\n<p>Содержательных правок между майской и октябрьской фиксациями нет: текст перенесён без изменений и одобрен.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0278-S07", "PS-0278--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Зачем и с чего появились правители — прямо оставлено нерешённым: «Фиг знает». Отсылка к «истории про упыря и битвой с защитником» не раскрыта.</li>\n<li>Ритуал, которым можно покинуть мир, в тексте помечен самим автором вопросительными знаками: «С помощью ритуала???». Тот же ритуал упомянут для Арбетаров и Альф с оговоркой «Которой я ещё не доработал».</li>\n<li>Есть ли Протобионты у любого правителя — ответ «Ну да наверное», твёрдого решения нет.</li>\n<li>Просьба Миколая объяснить, почему Протобионты не любят покидать мир родителя («лучше напиши, почему им», id 331658), ответа не получила.</li>\n<li>Можно ли благословить корову (id 331659) — в переписке не сказано.</li>\n<li>Блок вопросов о поглощении энергии благословенного посторонним человеком, о том, чья это энергия, что об этом думает правитель, легче ли мозгу при выходе энергии вовне и что было бы, если бы она не выливалась (id 331660) — ответов нет.</li>\n<li>Можно ли дать второе благословение Бессмертному и как (id 331661–331662) — ответа нет, при том что в тексте стоит жёсткое «благословения даётся только одно».</li>\n<li>Внешность и любая форма проявления правителей не описаны.</li>\n<li>Максимальное число благословений названо только для правителя рая (21); для остальных сказано лишь «Другие же правители дают меньше» — конкретные числа не названы.</li>\n<li>Общее количество правителей и их перечень не названы: поимённо есть только правитель кильке и правитель рая.</li>\n<li>В версии от 2025-10-18 вселенная не названа; неясно, тот ли это мир, что обсуждался 2 октября.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0278--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0023.html\">Правители (правители миров, правители минимиров)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0278--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-05-31</td>\n<td>331634–331638</td>\n<td>w0099</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-05-31</td>\n<td>331646–331662</td>\n<td>w0099</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-10-18</td>\n<td>375843–375852</td>\n<td>w0106</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0278-praviteli.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0278--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0278.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0278-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0278/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дороже всего — <code>SL-0054</code> «Список 12 апостолов»: 234 052 знака базы, 44 версии, статьи нет, ссылок три. Апостолы у вас — единственная поимённо определённая порода благословенных, на них в этой статье стоит отдельный раздел и вся арифметика правителя рая («21 это максимальное число благословения»). Проверить эту двадцать одну штуку негде: реестр, где апостолы перечислены поимённо, статьи не имеет, а называется он списком двенадцати — в фиксации от 2026-02-09, id 430400, там ровно двенадцать позиций, одна из них пустая. Двадцать один и двенадцать в справочнике нигде не сведены, потому что вторую сторону сводить не с чем.</p>\n<p>Рядом — три служебных каталога, на которые ссылаются, а статей нет: <code>SL-0089</code> «Список категорий сил» (четыре ссылки, база всего 1 753), <code>SL-0090</code> «Реестр персонажей и сил» (четыре ссылки, 5 492), <code>SL-0053</code> (шесть ссылок, 20 313). <code>SL-0089</code> — это ровно тот перечень шести категорий (благословенные, арбетары, альфы, чужемирцы, владельцы артефактов, фантазёры), который эта статья расписывает по механикам; четыре статьи в него тычутся, и там 1 753 знака.</p>\n<p>И отдельно — октябрьский перепост разъехался на три записи без статей и без вселенной: <code>SP-0240</code> «Благословение правителя» (9 835, вселенная «неясно», ссылок 0), <code>SP-0241</code> «Четыре основные способности благословенных» (9 573, «неясно», 0), <code>SP-0242</code> «Уникальная способность правителя» (9 592, «неясно», 0). Это тот же текст 331635, что здесь уже разобран. Пробел «в версии от 2025-10-18 вселенная не названа» существует не в одном месте, а в четырёх сразу.</p>\n<h3>С чего начать</h3>\n<p>В базе, не в архиве. Три адреса.</p>\n<p><code>SP-0198</code> «Ритуал становления Арбетаром» — 48 879 знаков базы, статья есть, две ссылки, 2025-03-13, окно w0080. Ритуал, помеченный в майском тексте вопросительными знаками и словами «Которой я ещё не доработал», расписан за два с половиной месяца до этого и довольно подробно: мозг благословенного собирает силу, тело альфы её прессует, пара чужемирцев и прочие активаторы, проводник, через которого сила проходит, — без проводника шанс удачного поглощения 0 %, с названным человеком подрастает на 8 %. Продолжение — <code>SP-0201</code> (21 913) и <code>PS-0224</code> «Старик-арбетар» (90 651).</p>\n<p><code>SP-0240</code>, <code>SP-0241</code>, <code>SP-0242</code>, id 375843–375852 — октябрьская половина. Смотреть надо все три сразу: текст один, а разложен по трём записям, и ни у одной вселенная не проставлена.</p>\n<p><code>SP-0230</code>, id 331639, 2025-05-31 — следующее сообщение сразу после лор-дампа. Там Кура, конкретный арбетар: внешность, характер, три способности и служба в АЗИП. То есть через сорок минут после того, как категории описаны абстрактно, автор собрал по ним живое лицо; в этой статье этого шага не видно.</p>\n<p>В архив за ответами на брошенные вопросы идти бесполезно, и это уже проверено: разбор упирается в край окна на 331667, что зафиксировано в <code>sluzhebnoe/poteri_i_neyasnosti.md</code>, а в w0100 вселенная только упомянута (335360). «Корову можно?», второе благословение Бессмертному и блок про поглощение энергии — не потеряны, а не отвечены.</p>\n<p>Отсылка «В истории было про упыря и битвой с защитником» (331654) ближе всего ложится на <code>PR-0061</code> (34 415), <code>PS-0232</code> «Упырь-рассказчик» (35 190) и <code>IS-0017</code> «Защитник» (139 029) — но самим автором это отождествление нигде не сделано.</p>\n<h3>Как развивалось</h3>\n<p>2025-03-13 — ритуал разобран по составу и процентам. 2025-05-31, 08:00 — большой лор-дамп двумя сообщениями; в нём тот же ритуал стоит уже как «С помощью ритуала???» и «Которой я ещё не доработал», а само происхождение правителей закрыто на «Фиг знает». То есть в майском тексте механика сузилась до вопросительных знаков относительно того, что было в марте. Через сорок минут, id 331639, из этих категорий собран Кура. Днём Миколай разбирает выложенное по пунктам: часть получает ответы, часть — четыре вопроса подряд — упирается в край окна и остаётся без ответа. Дальше четыре с половиной месяца ничего. 2025-10-18 текст возвращается — Миколай перепечатывает 331635 дословно, без единой правки, под ссылку на вёрстку страницы; Слава отвечает «Очень круто», «Делай так». Возвращается только первое из двух майских сообщений: невмешательство, всевидение, арбетары, фантазёры и артефакты в перепост не входят.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Цена за силу для благословенных названа числом: связь ставится на мозг, «сила или энергия проходит через мозг вредя ему», поэтому пользуются редко, и «средние продолжительность жизнь у благословенного после получения благословения 10 лет». Про арбетаров и альф в том же сравнении сказано, что у них «по сути это благословенния только не через связь», сила сидит внутри в виде перегрузки мозга, и пользуются они ей «без ограничений». Мозг тот же, перегрузка та же, ограничений меньше — а срока жизни для них не названо вовсе. Сравнение авторское и идёт по пунктам: базовые умения сравнили, регенерацию сравнили, обратимость сравнили, автоматизм против обучения сравнили. Плату посчитали только у одной стороны.</p>\n<h3>Отклик</h3>\n<p>Сильнее всего тут то, что цена вшита в устройство дара, а не приделана к нему моралью. Связь ставится на мозг, энергия идёт через мозг и его портит — значит, благословенный сам не хочет включать благословение, и десять лет средней жизни получаются не наказанием, а арифметикой. Из одного технического решения сразу следует поведение всех носителей. Второе — переворот с артефактами: благословенные, альфы, арбетары и фантазёры раскрыть их не могут, потому что «уже сами переполненный силой», а лучше всех справляется обычный человек. Это редкий случай, когда сила в системе оказывается помехой, и он не объявлен как красивая идея, а просто положен в список наравне с прочим. И совсем отдельно — две реплики в конце дампа: «Не знаю зачем я это сделал», «Но пусть будет». Устройство мира на два сообщения, написанное без адресата и без плана, с прямо проговорённым непониманием, зачем. Через четыре с половиной месяца этот же текст перепечатали дословно и поставили на страницу.</p></div>", "r": []}];</script>
