<script>const BASE="";const DOCNAME="Изменение сосуда";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0122-S01", "SP-0122--mehanika"], "h": "<p>Способность возникает как комбинация двух из трёх элементов системы. Слава заявляет сами элементы: «Есть три элемента / Сосуд тело структура» (2024-11-30, id 263677). Дальше он же расписывает комбинации: «Структура+тела=глазки / Сосуд+тело=изменяющую сосуд» (id 263680). То есть изменение сосуда — это связка «сосуд+тело».</p>\n<p>Носитель способности — семья, у которой она врождённая: «Есть семья / У них с рождения сосуд который они способны по прихоти изменить» (id 263684). Изменение происходит «по прихоти» — то есть по желанию носителя, без указанных в переписке условий или подготовки.</p>\n<p>Что даёт изменение сосуда, перечислено списком: «Изменять сосуд даёт такие вишки как невероятный большой объем сосуд для накопления энергия, идеальная тело с высокими физическими показателями и развитыми всеми чувствами и ещё что нибудь придумаю» (id 263684). Итого три названных бонуса:</p>\n<ul>\n<li>очень большой объём сосуда под накопление энергии;</li>\n<li>идеальное тело с высокими физическими показателями;</li>\n<li>все развитые чувства.</li>\n</ul>\n<p>Список оставлен открытым — «и ещё что нибудь придумаю». Дополнений в переписке не последовало.</p>\n<p>Верхняя точка способности — превращение сосуда в структуру: «Ну пик это когда они могут изменить сосуд на структура то бишь сделать сосуд идентичный с структурой что приведет резонансу с сосудом и структурой и повышает все характеристики и т п. Типо новый прием там» (id 263684). Этот приём вынесен в отдельную статью — <a href=\"SP-0123.html\">Резонанс сосуда и структуры</a>.</p>", "r": [["Резонанс сосуда и структуры", "SP-0123.html"]]}, {"t": "Ограничения и цена", "a": ["S02", "SP-0122-S02", "SP-0122--ogranicheniya-i-cena"], "h": "<p>Ограничение названо одно, прямо в скобках при первом описании: «( но не слишком сильно потому что сосуд может не выдержать)» (id 263684). То есть менять сосуд можно, но не слишком сильно — иначе сосуд может не выдержать.</p>\n<p>Что именно значит «не выдержать» и что происходит с носителем в этом случае, в переписке не сказано. Порог, за которым сосуд не выдерживает, не назван. Как это ограничение соотносится с «пиком» — превращением сосуда в структуру, то есть с очень сильным изменением, — не обсуждалось.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0122-S03", "SP-0122--nositeli"], "h": "<p>Семья. Названа именно как «семья», без имени и без числа членов. Способность у неё врождённая — «с рождения».</p>\n<p>В той же реплике Миколаю передаётся задача: «И третий семью должен ты покинуть идею» (id 263686). Реплика записана как есть; из неё следует, что семей предполагалось несколько и третью придумывает Миколай, но состав, названия и связь между семьями в переписке не даны.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0122-S04", "SP-0122--kak-menyalas-po-versiyam"], "h": "<p>Одна версия, один вечер.</p>\n<p><strong>2024-11-30 (id 263677–263686).</strong> Слава заявляет три элемента — сосуд, тело, структура. Миколай добавляет: «и некоторые наследственые структуры по типу глаз», тут же сам решает: «но это можно в структуру кинуть лан» (id 263678–263679). Слава расписывает комбинации, включая «Сосуд+тело=изменяющую сосуд». Миколай не понимает: «сосуд плюс тело я не понял / че эта комбинация даёт» (id 263681–263682). В ответ Слава даёт развёрнутое описание — семья, врождённый изменяемый сосуд, ограничение по силе изменения, список бонусов, пик с резонансом (id 263684).</p>\n<p>Позже способность не пересматривалась.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0122-S05", "SP-0122--svyaz-s-drugimi-sposobnostyami"], "h": "<ul>\n<li><a href=\"SP-0123.html\">Резонанс сосуда и структуры</a> «Резонанс сосуда и структуры» — пик изменения сосуда, назван Славой как «новый прием» в той же реплике. Изменение сосуда — часть, из которой резонанс вырастает.</li>\n<li>Комбинация «структура+тело» даёт «глазки» (id 263680) — параллельная комбинация в той же системе. Из неё выросли «наследственые структуры по типу глаз», которые Миколай предложил и сам же убрал в структуру.</li>\n<li>Система трёх элементов — сосуд, тело, структура — рамка, внутри которой способность определена.</li>\n</ul>", "r": [["Резонанс сосуда и структуры", "SP-0123.html"]]}, {"t": "Пробелы", "a": ["S06", "SP-0122-S06", "SP-0122--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Не сказано, как технически происходит изменение сосуда — только что оно «по прихоти».</li>\n<li>Порог «не слишком сильно» не задан; последствия того, что сосуд «не выдержит», не описаны.</li>\n<li>Список бонусов оставлен незакрытым автором: «и ещё что нибудь придумаю».</li>\n<li>Семья не названа по имени, её состав не назван.</li>\n<li>Третья семья оставлена Миколаю как задача (id 263686) — результата в переписке нет.</li>\n<li>Противоречие между ограничением «не слишком сильно» и «пиком» (полным превращением сосуда в структуру) не разбиралось.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0122--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0123.html\">Резонанс сосуда и структуры</a></li>\n<li><strong>Упомянут в способностях:</strong> <a href=\"SP-0123.html\">Резонанс сосуда и структуры</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0040.html\">Семья</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0122--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-11-30</td>\n<td>263677–263686</td>\n<td>w0065</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0122-izmenenie-sosuda.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0122--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0122.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
