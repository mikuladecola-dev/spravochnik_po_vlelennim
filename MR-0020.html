<script>const BASE="";const DOCNAME="Оазис";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0020-S01", "MR-0020--ustroystvo"], "h": "<p>Оазис — первый остров из списка семи (<a href=\"MR-0018.html\">7 островов</a>), названный в переписке. Защитник острова — Имитатор. Остров расположен «на земле обычной» (2024-07-03, id 194843) — в отличие от Асгара, который небесный, и от острова на дне океана.</p>\n<p>Остров = город или страна: «Остров это город ну или страна» (2024-07-03, id 194775). Позже уточнено, что Оазис — именно страна, а внутри неё округа: «не, оазис это типо страна и внутри этой страны есть округа, это типо США, где дохуя штатов» (2024-07-04, id 196194).</p>\n<p><strong>Что значит слово «оазис» для авторов.</strong> Спрашивал Миколай, отвечал Слава (2024-07-04, id 196200–196212):</p>\n<ul>\n<li>Слава: «Мирное место», «Рай».</li>\n<li>Слава: «Ну постапокалипсис часто смотрю и слушаю и там оазис вроде безопасного место».</li>\n<li>Миколай: «в моём понимании это вода на суше», затем — «а, я понял, это Скандинавия».</li>\n</ul>\n<p>Миколай, работая над климатом, формулирует прямо: «это я рай создаю», «я его так вижу» (id 196227–196228).</p>\n<p><strong>Назначение острова.</strong> Оазис — «остров спаситель для беженцев и людей который после 8 летний войны не куда идти, также все лабораторный крысы ( людий) от не куда идти, находят дом в оазисе. При этом имитатор следит чтобы на остров не попали преступники и криминальный люди» (2024-07-04, id 196043).</p>\n<p><strong>География и ландшафт</strong> (2024-07-04, id 196213–196233, формулировки Миколая):</p>\n<ul>\n<li>гор много, лесов тоже много;</li>\n<li>горы окружают остров по берегу;</li>\n<li>есть 4 выхода;</li>\n<li>реки в каждом городе, города небольшие.</li>\n</ul>\n<p><strong>Климат.</strong> Первая формулировка — «холодно летом, тепло зимой» (id 196224); Слава отвечает «Не». Тогда Миколай переформулирует: «даже не так там такая влажность, в которой холод не чувствуется» — и то же самое про жару (id 196226, 196229). То есть влажность, при которой не чувствуется ни холод, ни жара.</p>\n<p><strong>Технологии и застройка.</strong> «в основном там современные технологии», «уже много зданий отстроенно», «поэтому строители отдыхают» (2024-07-04, id 196234–196236).</p>\n<p><strong>Развлечения.</strong> «есть развлечения некие», «например любят смотреть как пиздятся люди и монстры», «или цирки там всякие» (2024-07-04, id 196237–196239).</p>\n<p><strong>Экономика.</strong> «каждый работает и кайфует», «ну а значит у них развитая экономика» (id 196217–196218). При этом: «возможно у них недостаточно газа и нефти или других ресурсов поэтому они сотрудничают с другими странами» (id 196219). Есть рыба (id 196247).</p>\n<p><strong>Форма правления — см. раздел о версиях</strong>: она менялась дважды.</p>", "r": [["7 островов", "MR-0018.html"]]}, {"t": "Население", "a": ["S02", "MR-0020-S02", "MR-0020--naselenie"], "h": "<p>Мирные жители. Первое описание: «Это можно сказать обычный город с мирными людьми» (2024-07-03, id 194915).</p>\n<p>Отдельно названы категории тех, кто на острове оказывается: беженцы и люди, которым после 8-летней войны некуда идти, и «лабораторный крысы ( людий)» — подопытные люди, которые «находят дом в оазисе» (id 196043). Преступников и криминальных людей на остров не пускают — за этим следит Имитатор.</p>\n<p>Про конфликт: «Я говорил что в оазисе мире среди гражданских» (id 196024), и сразу уточнение — «Точней не война, а мини конфликт в оазисе полноценный войны не будет» (id 196027). Причина мини-конфликтов: «Мини конфликты из за сбежавшиеся подоботных который други острова хотят вернуть» (id 196043).</p>", "r": []}, {"t": "Место во вселенной — как связан с другими мирами", "a": ["S03", "MR-0020-S03", "MR-0020--mesto-vo-vselennoy"], "h": "<p>Оазис — один из семи островов (<a href=\"MR-0018.html\">7 островов</a>), первый в списке Славы: «1 оазис ( Имитатор )» (2024-07-03, id 194774).</p>\n<p>Оазис относится к островам Славы. По распределению 2024-07-04: у Славы «почти все мирные острова», у Миколая — война и революция (id 196006). Про Оазис Слава говорит, что полноценной войны там не будет, только мини-конфликт.</p>\n<p><strong>Отношения с подводным островом</strong> (2024-07-04, id 196779–196808). У острова на дне океана своих ресурсов нет: «все ресурсы они берут с оазиса» — «по типу железа, газа, нефти хз». Итог: «ну короче, они в очень развитых отношениях экономических и ресурсных с оазисом».</p>\n<p>Защитник Оазиса не сидит на острове безвылазно: «Имитатор часто будет покидать остров по заданием» (2024-07-04, id 196122).</p>\n<p>Порядок работы: авторы договорились строить острова по одному, и первым — Оазис. Слава: «Давай будем сначала один остров потом другой. Типо один полностью построить а потом другие», «1 оазисе», «Так как там любимый имитатор» (2024-07-04, id 196191–196193).</p>", "r": [["7 островов", "MR-0018.html"]]}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0020-S04", "MR-0020--kak-menyalsya-po-versiyam"], "h": "<p><strong>2024-07-03 (id 194774–194776).</strong> Оазис назван первым в списке семи островов, защитник — Имитатор. Остров определён как город или страна.</p>\n<p><strong>2024-07-03 (id 194843).</strong> Уточнение: «У имитатор остров на земле обычной».</p>\n<p><strong>2024-07-03 (id 194911–194917).</strong> Обычный город с мирными людьми. Вся власть у Имитатора: «Вся власть находится у Имитатор он не только защищает но и отвечает за политику». Миколай определяет строй: «понятно, конституционная монархия».</p>\n<p><strong>2024-07-04 (id 196012–196043).</strong> Появляется назначение острова — остров-спаситель для беженцев и подопытных после 8-летней войны; Имитатор фильтрует въезд, не пуская преступников. Появляются мини-конфликты из-за сбежавших подопытных, которых хотят вернуть другие острова. Отдельно оговорено, что это не полноценная война.</p>\n<p><strong>2024-07-04 (id 196174–196194).</strong> Форма правления переписана. Миколай: «я ему ебанул федеративную республику», «это означает, что в него есть несколько мини государств в стране». Слава: «Вроде же монархию». Миколай: «потом поменял» — потому что «он добрый чел», «его любит народ», «и сам его выбирает». Дальше: «тобиж он президент, хоть и нет никого сильнее его, а так то президент переизбирается», «ну в пизду логику», «он будет как путин». Внутри страны 6 округов, в каждом свой правитель. Слава: «Ну пусть это будет».</p>\n<p>Таким образом порядок состояний по форме правления: конституционная монархия (2024-07-03) → федеративная республика с 6 округами и переизбираемым защитником-президентом (2024-07-04). Старый вариант не отменён задним числом, а именно заменён по ходу: Слава помнил монархию, Миколай ответил, что поменял.</p>\n<p><strong>2024-07-04 (id 196195–196221).</strong> Разобрано, что для авторов значит слово «оазис» (мирное место, рай, безопасное место как в постапокалипсисе), задана география — горы, леса, реки в каждом городе, небольшие города — и экономика: развитая, но с нехваткой газа/нефти, отсюда сотрудничество с другими странами.</p>\n<p><strong>2024-07-04 (id 196222–196250).</strong> Климат (влажность, при которой не чувствуется ни холод, ни жара), ландшафт (горы по берегу, 4 выхода), современные технологии, много отстроенных зданий, отдыхающие строители, развлечения — бои людей и монстров, цирки. В конце Слава добавляет: «Ну у них есть рыба».</p>\n<p><strong>2024-07-04 (id 196779–196808).</strong> Оазис становится ресурсной базой подводного острова; фиксируются «очень развитые» экономические и ресурсные отношения между ними.</p>\n<p><strong>Отклонённые варианты.</strong> Климат «холодно летом, тепло зимой» (id 196224) Слава отклонил («Не»), после чего появилась версия про влажность.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0020-S05", "MR-0020--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Офис или резиденцию защитника решили придумать позже — в переписке этого не сделано (2024-07-04, id 196173).</li>\n<li>Названия шести округов, их устройство и правители не названы — сказано только, что округов 6 и «в каждом свой правитель».</li>\n<li>Не сказано, куда ведут 4 выхода и что они собой представляют.</li>\n<li>Столица или главный город не назван.</li>\n<li>Численность населения не названа.</li>\n<li>Не сказано, откуда именно Оазис берёт недостающие газ и нефть и с какими конкретно странами сотрудничает; при этом сам Оазис отдаёт железо, газ и нефть подводному острову — как это сочетается с собственной нехваткой, в переписке не разобрано.</li>\n<li>Не описано, чем закончились мини-конфликты из-за сбежавших подопытных и какие острова требуют их вернуть.</li>\n<li>Реплика Миколая «как думаешь, будем пихать тоталитаризм?» (2024-07-03, id 194917) к Оазису не привязана и ответа в этом месте не получила.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0020--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0018.html\">7 островов</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0104.html\">Нуар</a></li>\n<li><strong>Упомянут в мирах:</strong> <a href=\"MR-0027.html\">Слияние двух измерений</a>, <a href=\"MR-0042.html\">Концепция появления силы</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0020--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-03</td>\n<td>194774–194776</td>\n<td>w0041</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-03</td>\n<td>194843–194844</td>\n<td>w0041</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-03</td>\n<td>194911–194918</td>\n<td>w0041</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-04</td>\n<td>196012–196043</td>\n<td>w0042</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-04</td>\n<td>196174–196194</td>\n<td>w0042</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-04</td>\n<td>196195–196221</td>\n<td>w0042</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-04</td>\n<td>196222–196250</td>\n<td>w0042</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-04</td>\n<td>196779–196808</td>\n<td>w0043</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0020-oazis.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0020--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0020.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
