<script>const BASE="";const DOCNAME="Игорь";
const LEAD="<p>Персонаж по имени Игорь появляется в трёх разных историях Славы, не связанных между собой сюжетно: в истории про Мишу и завод имени Попова (2025-03-25, окно w0085), в брошенной истории про корабль (2025-04-21, окно w0088) и в истории про бригаду лесорубов и пещеру (2025-05-02, окно w0089). Всего в записи четыре версии, даты 2025-03-25 — 2025-05-02. Вариант имени — «Игорешка» (так его называет Иван Васильевич в версии 4). В самой записи отмечено: «Имя Игорь встречалось и в прошлой брошенной истории Славы про корабль (w0088) — совпадение или нет, неясно». То есть тождество трёх Игорей в переписке не установлено, и ниже они описаны по отдельности.</p>";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0240-S01", "PS-0240--proishozhdenie"], "h": "<p><strong>Игорь из истории про завод (w0085, 2025-03-25).</strong> Одноклассник Миши в школе, куда Миша перевёлся и доучивался до десятого класса. Описан как «Самый крутой парень в классе, который был лидером всего класса». Про него сказано: «Хоть он не показывал себя со стороны хулиганым. Но его подколы и дружба с хулиганами. Не вызывала в Мише доверия к данному индивиду». Откуда он, кто его семья, чем занимается вне школы — в переписке не сказано.</p>\n<p><strong>Игорь с корабля (w0088, 2025-04-21).</strong> Один из людей, пришедших 11 июня в полночь к заброшенному кораблю размером «как гора», чтобы попасть к тому, кто исполняет желания. Повествование в этой истории идёт от лица другого персонажа — не Игоря. В толпе собравшихся рассказчик перечисляет «Студентка, клерк, старик, красотка, бандит, бизнесмен и так далее» и добавляет: «Все это были разный люди, из разных слоев. Хм миров». Игорь — тот самый клерк. О месте он узнал так: «я как бы письмо получил. Там в этом письме об этом месте и говорилось». Письмо пришло от организации «Нимб» — это Игорь и называет вслух: «от организации \"нимб\"?». Что именно он желал и зачем шёл на корабль — в переписке не сказано.</p>\n<p><strong>Игорь из бригады лесорубов (w0089, 2025-05-02).</strong> Самый младший в бригаде из восьми человек, работающей на законной вырубке в тайге в октябре, на участке рядом с горой с природными пещерами. Рассказчик — Иван Васильевич, лесоруб «уже за тридцать». Представлен фразой: «И здесь внезапно заговорил самый младший из нас \"Игорь\"». Возраст, фамилия, откуда пришёл в бригаду — не названы.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0240-S02", "PS-0240--vneshnost"], "h": "<p>Подробное описание есть только у Игоря с корабля (320984, 2025-04-21). Рассказчик видит троих, с кем закрывается в комнате, и описывает второго: «Второй высокий мужчина в очках, одетый в пиджак. Не смотря на длинный рост был худым». В перечислении людей на берегу он же обозначен как «клерк».</p>\n<p>У Игоря из истории про завод внешность не описана. Косвенно из текста: он достаточно крепок, чтобы вместе с двухметровым Костей едва сдвинуть дверь подвала («Ведь Костя с Игорем ели сдвинули её вместе»); после удара локтем Миши у него идёт кровь из носа, и он «встал разминая шею».</p>\n<p>У Игоря из бригады лесорубов внешность не описана. Сказано только, что он «Молодой шибко, залезть куда желает. Да и по выносливее нас будет», и что он пролезает в узкий лаз пещеры первым.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0240-S03", "PS-0240--harakter"], "h": "<p><strong>Игорь из истории про завод.</strong> Решает за других и не оставляет им выхода. Зовёт Мишу на заброшку так: «ай-да с нами на заброшку ночью», и когда Миша пытается отказаться — «про-ссти. Но я не смогу ночью» — отвечает «ты чево. Не бойся, с нами будут ещё трой. Поэтому всё ок» и быстро уходит, «Не давая Мише, как либо отказаться». Про этот момент прямо сказано: «Игорь кажется всё уже решил за Мишу».</p>\n<p>Когда Миша сбегает и не приходит, Игорь является к нему домой вечером, держит дверь, чтобы её нельзя было закрыть: «здорова. Ты каво ушёл. Мы тебя ждали». Мотив своего прихода он объясняет сам: «ладно. Я думал сдох. Ты же последний выбегал. Поэтому струхнул, что может ты правда того. А идти к тебе домой как-то ну не то». Текст добавляет двойное толкование, не выбирая одного: «Он и правда боялся, что Миша мог умереть. Но боялся он этого потому-что полицая могла выйти на них или нет?».</p>\n<p>После того как Миша со страху разбивает ему нос, Игорь не отвечает ударом: он спрашивает, где Миша был вчера, а потом «подошёл к Мише и протянул руку» со словами «давай вставай. Скоро уроки». Вопрос про вчерашнее прямо назван более важным для него, чем травма: «задал он вопрос, который волновал его больше чем разбитый нос».</p>\n<p>Скрывает собственное состояние. Когда вся компания по очереди признаётся в своих проявлениях проклятия, он подводит итог за всех — «похоже у нас у всех какой то проклятия стоит» — и при этом «Не желая говорите своей недомогания. Ну никто и не допрашивался».</p>\n<p>Ставит точку в решениях группы: «кажется только одно» и «тогда мы должны идти все. Сегодня пойдём же!», причём «Не давая уже никому и шанса уйти». Идёт впереди шеренги. В подвале, когда Ваня кричит, что делать дальше, отвечает «по дождём здесь, когда он придёт» — и тут же «слегка содрогнулся от своих же слов»; решение никому не нравится, но остаются все.</p>\n<p><strong>Игорь с корабля.</strong> Гасит ссоры и переводит разговор на нейтральное. При стычке рассказчика с Никой вмешивается: «тиха, тиха. Давайте все успокоимся», «нам не зачем ругаться. Давайте, что нибудь другой обсудим. Например как нас зовут. Меня зовут Игорь» — он первым называет своё имя в группе. Спорит с Никой о виновности организации: «ты хочешь сказать, что организация \" Нимб\" Во всём этом виновата?». Склонен к разбору и планированию: «я не знаю. Но давайте подумаем. Мы находимся на корабле, где может быть исполняющий желания», и в ответ на упрёк Ники — «ну я хоть, что-то предлагаю,а не просто ходить по коридорам». Рассказчик называет этот спор «сценка устной битвой. Бессмысленной и глупой».</p>\n<p>Настаивает на привалах: «давайте остановимся», обосновывая так: «ну потому что. Если мы продолжим так без разумно шагать. То можем и умереть, а если мы умрём мы не исполним желания». Рассказчик признаёт правоту («И он был прав»), а сам Игорь удивляется быстрому согласию.</p>\n<p>Действует напролом физически, без результата: когда комнату начинает заливать водой, «Игорь с разбегу врезается в дверь. Он кажется думал, что сможет выбить железную дверь своей тушой. Ну хотя бы упорство ему не занимать. Вот до сих пор пытается её выбить».</p>\n<p>Шуток рассказчика не принимает: после розыгрыша с фонариком говорит «знаешь шутки твои мне вообще не подушей». Держится в стороне от неприятного: у выпотрошенного тела в коридоре он стоит «под одоль», и рассказчик замечает, что это «вполне понятная реакция».</p>\n<p>Его предложение по укрытию: «тогда можно поискать комнату без окон».</p>\n<p><strong>Игорь из бригады лесорубов.</strong> Затейщик похода. Он один хочет в пещеру, когда все устали: «а может давайте в пещеру сгоняем». На возражение «да чего туда соваться, обвалится ещё» и на довод про темноту отвечает «тогда вы согласны. Но боитесь ночью. Ну не че днём пойдем», а на возражение про рабочий день — «на обеде можно». Про него сказано: «Кроме конечно Игорь. Молодой шибко, залезть куда желает. Да и по выносливее нас будет. Поэтому всё глаголил, что надо туда, когда ещё шанс выпадет». На следующий день торопит бригаду за обедом: «ну вы че дайте быстрее» — за сорок минут до конца перерыва.</p>\n<p>В пещере притихает вместе со всеми: «Даже Игорь слегка приутих».</p>\n<p>После бегства из пещеры лезет на дерево «чуть ли не на самой верхушки» и остаётся там дольше остальных: Иван Васильевич слезает вслед за бригадиром, «а вот Игорь так и остался на дереве». Рассказывает бригадиру всё сам, в отличие от Ивана Васильевича, который молчит из гордости: «Он то сразу всё выпалил. Сбивчиво запинаясь и яркая жестикулируя». На слова бригадира, что они испугались белки или лисы, возражает «Нет», но под взглядом бригадира продолжает тише: «это человек был наверное».</p>\n<p>Отказывается дежурить в одиночку: бригадир «сначала хотел по одному выставлять. Но получив категорический отказ от Игоря и Мишы. Решил пойти на компромисс и выставил двух дежурных».</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Отклик — не материал авторов</b>\n<p>Больше всего зацепило, что при трёх совершенно разных ролях — вожак, миротворец, отчаянный младший — Игорь везде один и тот же по функции: он решает за других и не оставляет им выхода отказаться, будь то поход на завод, привал на корабле или вылазка в пещеру. Это не тождество личности, но тождество характера, которое возникло, кажется, случайно — и от этого интереснее, чем если бы было задумано.</p></div>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0240-S04", "PS-0240--sposobnosti"], "h": "<p>Никаких сверхъестественных способностей ни у одного из трёх Игорей в переписке не названо.</p>\n<p>У Игоря из истории про завод есть непоименованное проявление проклятия. После вылазки на завод каждый из компании называет своё: Катя слышит шёпот, Ваня — «у меня тени не тени кажется», Костя — «у меня просто отражение обманывает и стекло», Миша проваливается в темноту и тонет в реке. Игорь подводит итог — «похоже у нас у всех какой то проклятия стоит» — но своё не называет. В записи это отмечено отдельно: «Своё проявление проклятия он прямо не называет».</p>\n<p>В подвале завода Игорь оказывается тем, кто первым понимает, что произошло: «Игорь понял. Когда увидел на двери изгибы. Который соединялись в лицо».</p>\n<p>У Игоря из бригады лесорубов способность сугубо физическая: выносливость и лёгкость на подъём («по выносливее нас будет»), а в финале — прыжок с дерева прямо на тварь: «И здесь с дерева спрыгивает прям на эту собаку Игорь. Черт да что он творит возникла мысль у всех наверное. Но он как-то извернулся и подломил её коленки». Именно из этого бригада выводит правило боя с тварью: «Оказывается без разгона она не столь страшна. И если держать его голову на виду то справиться с ним будет достаточно легко».</p>\n<p>Игорь с корабля попыток выбить железную дверь тушей не доводит до результата; дверь в итоге вылетает от давления воды и от того, что рассказчик прыгает на ней ногами.</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0240-S05", "PS-0240--svyazi-s-drugimi"], "h": "<p><strong>Миша (история про завод).</strong> Игорь зовёт его на заброшку, приходит за ним домой, ведёт его в группе. Миша ему не доверяет и заранее ждёт побоев. После вылазки Миша со страху бьёт Игоря локтем в лицо и накидывается на него, приняв за преследователя; Игорь его останавливает криком «ты че совсем Миша. Это я», а потом подаёт руку. В подвале, когда Миша встаёт, Игорь встаёт следом и идёт за ним, держа за плечо — «Возможно чтобы не убежал. Возможно чтобы не утащили».</p>\n<p><strong>Ваня, Костя, Катя (история про завод).</strong> Компания, ждавшая Мишу на детской площадке. Ваня — «главный озорник и генератор приколов», Костя — «двухметровый парень, спортсмен», Катя — «миловидная», «главной сплетни цой в школе». Про положение Игоря сказано прямо: «Ну и Игорь, который вышел вместе с Мишое. Был главарём их ней группы». Он один принимает за них решение вернуться на завод; Катя пытается уйти, но её не выпускает Костя.</p>\n<p><strong>Ника, Паша, безымянный рассказчик (история про корабль).</strong> Четвёрка, закрывшаяся в одной комнате. Ника — студентка «одетая в джинсы и в рубашку», с крашеными волосами «желто-розовый или как то так»; Паша — школьник, самый низкий из них. Игорь первым представляется, спорит с Никой об организации «Нимб» и о том, куда идти, и спорит с рассказчиком о привалах. Рассказчик относится к нему без симпатии, прикидывает группу как отвлекающий манёвр для медведеподобного существа: «Ну они могут быть отвлекающим маневром. В полне. Пока медведь будет их есть. Я смогу быстро свалить».</p>\n<p><strong>Организация «Нимб» (история про корабль).</strong> Игорь получил от неё письмо и он же произносит её название. Дальше об этой связи в приведённых кусках ничего нет.</p>\n<p><strong>Иван Васильевич, бригадир, Тоха, Миша/Михаил, бригада лесорубов (история про пещеру).</strong> Игорь — самый младший в бригаде из восьми человек. Бригадир неожиданно поддерживает его идею идти в пещеру: «да ладно вы. Поедите быстро да и сходите». Причину бригадир объясняет Ивану Васильевичу отдельно: «место здесь странная. Гнетущая какая-то», «не только тебя подкосила оглянись все, как не в себе. Вот я и подумал может вам развёлся надо. Всё же лучше эту проблему сразу устранить. Нежели потом расхлебывать». Иван Васильевич называет его «Игорешка» именно в этом разговоре: «с чего это ты так резко нашего Игорешку решил подержать».</p>\n<p>В пещеру Игорь лезет первым; при бегстве он бежит первым и выводит бригаду: «Не могу нарадоваться что Игорь первый бежал. Он нас быстро к выходу вывел». По итогу спуска с горы Игорь попадает в число уцелевших: «А Игорь удачно покатился». Из восьми человек относительно целыми бригадир насчитывает четверых. Дежурство у входа в пещеру делится на пары: «Я и Тоха. И Игорь с Михаилом», с оружием — по одной двустволке на группу.</p>", "r": []}, {"t": "Как менялся — состояния по датам, старое не затирается", "a": ["S06", "PS-0240-S06", "PS-0240--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2025-03-25 (окно w0085, сообщения 311072–311073), вселенная по дате объявления неясна.</strong> Введение персонажа: самый крутой парень класса и лидер класса, дружащий с хулиганами; зовёт Мишу на заброшку, приходит за ним домой вечером, тянет его к выходу из многоэтажки, приводит к компании на детской площадке и ведёт группу к заводу имени Попова. По описанию версии, он также «ведёт группу к дырке в заборе, раздаёт фонарики (в том числе Мише)» — приведённый в записи кусок переписки обрывается раньше, на легенде Вани про завод, монстра в подвале и десятиметровую стальную дверь.</p>\n<p><strong>Версия 2 — 2025-03-25 (окно w0085, сообщения 311076–311078).</strong> Та же история после вылазки. Игорь получает по носу от Миши и подаёт ему руку; при разговоре у реки скрывает своё недомогание и формулирует общий диагноз про проклятие; решает вернуться на завод в тот же день, ведёт группу впереди шеренги; в подвале предлагает ждать монстра; в финале первым понимает, что выхода нет, увидев на двери изгибы, складывающиеся в лицо. Версия обрывается вопросом «Они здесь умрут?».</p>\n<p><strong>Версия 3 — 2025-04-21 (окно w0088, сообщения 320983–320988), вселенная Нимб (объявлено).</strong> Совсем другая история и другой Игорь: клерк на заброшенном корабле. Введён и раскрыт в пределах одного окна — получил письмо от организации «Нимб», первым представляется, спорит с Никой о виновности «Нимба», бьётся в железную дверь, предлагает привалы и комнату без окон, анализирует, где искать исполнителя желаний. Единственная реплика Миколая в этом окне — «спасибо что скинул» (320988); обсуждения самого текста в переписке нет.</p>\n<p><strong>Версия 4 — 2025-05-02 (окно w0089, сообщения 323364–323370), вселенная Нимб (по дате объявления).</strong> Третий Игорь: самый младший в бригаде лесорубов. Первое появление и вся линия персонажа в одном окне — от предложения «а может давайте в пещеру сгоняем» до прыжка с дерева на тварь и слома её коленей. Здесь же возникает вариант имени «Игорешка».</p>\n<p>Ни одна из версий не отменяет предыдущую: это три разных персонажа с одним именем в трёх разных историях, и вопрос об их тождестве в переписке оставлен открытым.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0240-S07", "PS-0240--chto-s-nim-stalo"], "h": "<p><strong>История про завод (w0085).</strong> Не разрешено. Последнее состояние: Игорь заперт вместе с Мишей, Ваней и Катей в подвале завода имени Попова, выхода нет, Костя пропал за дверью, на двери проступает лицо. Текст обрывается на «Они здесь умрут?». Что было дальше — в переписке нет.</p>\n<p><strong>История про корабль (w0088).</strong> Не разрешено, история брошена. Последнее упоминание: рассказчик приходит в себя в комнате без окон и видит, что чёрный гуманоид тащит Нику, а Игоря и Паши рядом нет. Вывод рассказчика: «Получается их это существо утащил во мрак корабля, а я здесь». Дальше про Игоря ничего не сказано. Рассказчик убивает гуманоида ножом, Ника без сознания, на этом кусок кончается.</p>\n<p><strong>История про пещеру (w0089).</strong> Игорь выживает. После боя с тварью бригада слышит со стороны горы «Не один их было множество. Десятки если не сотни тварей там кричала» и уезжает: «И на удивление быстро смогли уехать без потерей». Погиб только Тоха — раньше, от удара твари в спину. Из бригады Игорь входит в число тех, кого бригадир считает относительно целыми, и кого при этом должны проверить врачи: «Да и Игорь с Михаилом врачи проверят, и если хоть что-то там выяснит тоже живо поедут в больницу». Что с ним после приезда фармацевтической компании, снятия показаний и подписки о неразглашении — в переписке не сказано; текст ведётся от лица Ивана Васильевича, которому ампутировали руку.</p>", "r": []}, {"t": "Пробелы — чего в переписке нет", "a": ["S08", "PS-0240-S08", "PS-0240--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Тождество трёх Игорей не установлено. В записи прямо отмечено: имя встречалось и в брошенной истории про корабль, «совпадение или нет, неясно».</li>\n<li>Своё проявление проклятия Игорь из истории про завод не называет — отмечено в записи отдельно. Остальные четверо своё называют, он нет.</li>\n<li>Мотив прихода Игоря к Мише домой оставлен двойным и неразрешённым: боялся, что Миша умер, «Но боялся он этого потому-что полицая могла выйти на них или нет?».</li>\n<li>Внешность Игоря из истории про завод и Игоря из бригады лесорубов не описана.</li>\n<li>Желание, ради которого Игорь с корабля пришёл к нему в полночь 11 июня, не названо. Содержание письма от организации «Нимб» тоже не приведено — только факт письма и её название.</li>\n<li>Судьба Игоря с корабля после того, как его утащил гуманоид, не сказана; история брошена.</li>\n<li>Финал истории про завод не написан.</li>\n<li>Возраст, фамилия и биография Игоря из бригады лесорубов не названы, кроме того, что он самый младший из восьми.</li>\n<li>В списке связей записи числится Артём, но в приведённых кусках это имя не встречается; проводник бригады назван «Тоха ну для вас Григорий», и связь между этими именами в переписке не проведена.</li>\n<li>Обсуждения этих текстов между соавторами в записи нет: все четыре версии — сплошной текст Славы, единственная реплика Миколая — «спасибо что скинул».</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0240--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0073.html\">Бригада лесорубов</a>, <a href=\"GR-0074.html\">Четверо на корабле («супер группа»)</a>, <a href=\"GR-0077.html\">Компания Игоря (школьная группа с завода имени Попова)</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0009.html\">Организация Нимб (НБО)</a>, <a href=\"GR-0073.html\">Бригада лесорубов</a>, <a href=\"GR-0074.html\">Четверо на корабле («супер группа»)</a>, <a href=\"GR-0077.html\">Компания Игоря (школьная группа с завода имени Попова)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0240--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-03-25</td>\n<td>311072–311073</td>\n<td>w0085</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-25</td>\n<td>311076–311078</td>\n<td>w0085</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-04-21</td>\n<td>320983–320988</td>\n<td>w0088</td>\n<td>Нимб (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-05-02</td>\n<td>323364–323370</td>\n<td>w0089</td>\n<td>Нимб (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0240-igor.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0240--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0240.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0240-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0240/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Самая дорогая дыра — не про Игоря, а про Мишу из истории про завод. <code>PS-0237</code> («Миша») существует как сущность в базе — 79519 знаков материала, больше, чем в самой статье об Игоре (29909) — но статьи нет вообще. Та же судьба у Кости (<code>PS-0241</code>, 33195), Вани (<code>PS-0242</code>, 23647) и Кати (<code>PS-0243</code>, 25564). Статья о компании (<code>GR-0077</code>) это прямо признаёт: «Отдельной записи у этого Миши в базе нет... У Вани, Кости, Кати и этого Миши отдельных записей в базе нет». Проблема в том, что вся сюжетная линия завода имени Попова держится на Мише — Игорь в ней вспомогательный, ведущий, но не главный герой, — а прочитать её целиком без обходного пути через карточку Игоря сейчас нельзя.</p>\n<h3>С чего начать</h3>\n<p>Не архив — база, уже собранная и просто не сведённая в статьи. Записи <code>PS-0237</code>, <code>PS-0241</code>, <code>PS-0242</code>, <code>PS-0243</code> физически существуют (см. пути в <code>kb/sushnosti/personazhi/</code>), нужно только собрать их в карточки тем же способом, каким собрана эта. Заодно там же, в этом пласте базы, скорее всего лежит и материал по проклятиям Вани и Кати (шёпот, тени) — их способности в статье об Игоре тоже названы, но не расписаны отдельно.</p>\n<h3>Как развивалось</h3>\n<p>Три раза подряд имя «Игорь» заявляется заново, с нуля, без ссылки на предыдущее использование: 25 марта — лидер школьной компании, история обрывается на «Они здесь умрут?»; 21 апреля — совсем другой Игорь, клерк на корабле, введён и полностью раскрыт в одном окне, единственная реакция Миколая — «спасибо что скинул»; 2 мая — третий Игорь, самый младший в бригаде лесорубов, единственный из трёх с завершённой сюжетной линией. Ни ограничения, ни забвения, ни возврата к старому Игорю тут нет — есть три параллельных заявления одного имени, ни разу не сверенных друг с другом.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для другого повторяющегося имени в этой же карточке — Михаила — тождество явно разведено: в статье о компании прямо сказано, что «Михаил» — лесоруб из другого окна «и к этой компании отношения не имеет». То есть, столкнувшись с совпадением имён, вы это один раз проговорили и закрыли вопрос. Для трёх Игорей та же по типу ситуация — совпадение имени в разных, не связанных историях — осталась открытой: «совпадение или нет, неясно». Правило для одного случая есть, для соседнего того же рода — нет.</p>\n<h3>Отклик</h3>\n<p>Больше всего зацепило, что при трёх совершенно разных ролях — вожак, миротворец, отчаянный младший — Игорь везде один и тот же по функции: он решает за других и не оставляет им выхода отказаться, будь то поход на завод, привал на корабле или вылазка в пещеру. Это не тождество личности, но тождество характера, которое возникло, кажется, случайно — и от этого интереснее, чем если бы было задумано.</p></div>", "r": []}];</script>
