<script>const BASE="";const DOCNAME="Горгона";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0138-S01", "PS-0138--proishozhdenie"], "h": "<p>Появилась внутри истории, написанной Миколаем и присланной 2024-08-11 (id 218119–218123, окно w0052). Истории предшествует одна реплика: «я написал историю». Рассказ ведётся от первого лица, рассказчик — влюблённый в Асешу человек, и он же главный герой («рассказчик это гг»).</p>\n<p>Имя в тексте звучит один раз, как узнавание: «когда я понял что это горгона попытался её догнать». В обсуждении на следующий день Миколай уточняет, откуда взялось само слово: «ну они это так называли», «ибо тупые». В переписке имя встречается в двух написаниях — «горгона» и «гаргона».</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0138-S02", "PS-0138--vneshnost"], "h": "<p>Описана в момент, когда она проходит мимо, одним куском: «мимо прошла женщина с дредами в виде змей в белым брюхом, в может это и правда были змеи, как то странно они шевелились, была она ещё очень странно одета, но почему-то шла с опущенной головой, что совсем подходило её образу».</p>\n<p>То есть: женщина; дреды в виде змей с белым брюхом; сам рассказчик не уверен, дреды это или настоящие змеи — «может это и правда были змеи», основание для сомнения одно: «как то странно они шевелились»; очень странно одета; идёт с опущенной головой.</p>\n<p>Отдельно, уже в разборе, Миколай формулирует главное про её внешность — она не выделяется: «ну так выглядит она как обычная женщина» (2024-08-12, id 218219). Этим объясняется, почему прохожие в городе на неё не реагируют.</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0138-S03", "PS-0138--sposobnosti"], "h": "<p>Обращает людей в камень. В самой истории механика не объясняется: Асеша прощается, поворачивается, рассказчик смотрит ей вслед — «а она стала камнем, а после мимо прошла женщина с дредами». Ни взгляда, ни слов, ни жеста, ни касания в тексте не названо; сама Горгона в момент окаменения ещё только идёт мимо.</p>\n<p>Каменное состояние жертвы описано физически: это «каменная статуя которая весит не одну сотню килограмм», и рассказчик поднять её не может. Оговаривается и обратное свойство камня — по нему идут глубокие трещины при обработке составом, и есть риск, что жертва рассыплется.</p>\n<p><strong>Снятие окаменения.</strong> Способ найден рассказчиком по ходу дела и описан подробно. Основа — гуано (фекалии летучих мышей): «в фекалиях летучих мышей(далее гуано) очень высокое содержание нитратов которые способствуют разложению при контакте с неорганикой и увеличению энергии в контакте с органикой». Условие места — пещера: «воздух пещеры самый насыщенный по содержанию азота, поэтому прямой контакт с ним способствует более активному насыщено, тем более окислительный слой конкретно его фекалий способствует ускоренной ферментации». Обязательная добавка — спирт: «мне нужно уменьшить концентрацию иных веществ в гуано, поэтому нужно его развести со спиртом», в дело пошло принесённое с собой вино. Пропорции взяты «на глаз», по картинкам из книги в коллекции вампира Ник-Хана: «я наспех осматривал книги в коллекции Хана и увидел в картинках процесс избавления от окоменения, а после откопал состав той жидкости».</p>\n<p>Способ применения тоже описан: сначала поливали статую сверху и по ней пошли глубокие трещины; затем жертву положили в небольшую купальню, залитую водой, а смесь вылили сверху — «так как плотность это смеси ниже она держалась на поверхности, мы аккуратно подняли статую и она всей площадью покрылась этим составом». Результат: «весь камень отпал, она живая, мона дышит и тёплая», после чего от неё остаётся сырость и неприятный запах.</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0138-S04", "PS-0138--svyazi-s-drugimi"], "h": "<p><strong>Асеша.</strong> Единственная жертва Горгоны в истории. Девушка, в которую влюблён рассказчик; окаменела на улице сразу после того, как согласилась встретиться с ним на следующий день. Была расколдована и вернулась к подруге; свидание в итоге состоялось — подруга после случившегося твердила, что рассказчик ужасен, «она была с ней не согласна и сказала, что хочет попробовать встретиться».</p>\n<p><strong>Рассказчик истории про Горгону.</strong> Главный герой. Он единственный, кто увидел Горгону и опознал её, пытался догнать, но не догнал. Он же нашёл способ снять окаменение.</p>\n<p><strong>Ник-Хан.</strong> Знакомый вампир рассказчика, живёт в пещере за 2 тысячи километров от города, прибыл на место за 1 минуту 34 секунды. Его гуано в форме летучей мыши и его пещера — обязательные условия расколдовывания. С Горгоной напрямую не связан. В разборе Миколай отвёл ему роль прямо: «его роль срать красиво», «не более».</p>\n<p><strong>Подруга Асеши.</strong> Отсутствовала в момент окаменения — зашла в магазин за водой и задержалась на 28 минут, встретив давнюю знакомую. Горгону не видела, о случившемся не знает; вернувшуюся мокрую Асешу забрала у рассказчика, дала ему пощёчину и запретила приближаться.</p>", "r": []}, {"t": "Как менялась по версиям", "a": ["S05", "PS-0138-S05", "PS-0138--kak-menyalas-po-versiyam"], "h": "<p><strong>2024-08-11, id 218119–218123, окно w0052.</strong> Первое и единственное появление в тексте: внешность, шевелящиеся дреды-змеи, опущенная голова, окаменение Асеши, попытка догнать, исчезновение из виду. Больше в истории она не появляется — весь остальной объём занимает расколдовывание.</p>\n<p><strong>2024-08-12, id 218210–218256, окно w0052.</strong> Разбор истории в споре. Ничего нового о самой Горгоне не добавлено, зато проговорено, что и не должно быть добавлено: «ну епта по сюжету дальше будет известно кто такая гаргона и Асеша», «бож, про Горгону вообще ничего не известно», «не известно многое про остальных персов», «ваще маленький эпизод показан». То есть неизвестность о ней — заявленное состояние, а не пропуск.</p>\n<p>Претензии Славы и ответы на них в этом же обмене:</p>\n<ul>\n<li>«Какого хуя по городу хочется Горгона а всем насрать» — ответ: «ну так выглядит она как обычная женщина».</li>\n<li>«А хули полицию не вызвал раз это повседневка» — ответ: «че полиция сделает».</li>\n<li>«И снова же вампир обычный», «я про то что твой вампир ничем не выделяется» — ответ: «нет это не так, конкретно у нашего героя есть знакомый вампир, хули», «монстр понятие растяжимое», «он более сильный».</li>\n<li>«Ну не знаю у тебя так написано словно каждый второй монстор и все они живут в мире», «Так ты же добавил новый вид монстров в эту вселенную» — прямого ответа на вопрос о численности монстров в мире в этом обмене нет.</li>\n<li>О жанре: Слава требует «Ужастик», «Трагедия», «Но сука не как повседневка», «Монстр страшный и ужасный», добавляя, что «до этого 3 истории явно не отсылали к будущей повседневка». Миколай настаивает на трагедии в лёгкой подаче: «ну епта это трагедия, герой всё тянул с приглашением на свидание и вдруг эта залупа превращает в камень эту девушку. разве не страшно», «ну там есть элемент трагедии но подано в легкой форме».</li>\n<li>Об умысле: на вопрос «Скажи серьезно это истории ты написал по приколу» ответ — «сука ну да, это угар был, но ты сам сказал что главное чтобы был монстр хули не нравится», и отдельно: «это уже после мы начали делать такие работы».</li>\n<li>Общая оценка Славы: «Со всем уважением это говно», «Сука это даже не комедия», «Или точней дешёвая комедия пытающия зацепить тупыми шутками», «Ты пытался рассмешить говном».</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0138-S06", "PS-0138--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Механика окаменения не описана: как именно Горгона обращает в камень, в переписке не сказано. Взгляд, слова, касание, расстояние — ничего не названо, окаменение происходит, пока она проходит мимо.</li>\n<li>Кто она такая, намеренно не раскрыто: «про Горгону вообще ничего не известно», раскрытие отложено на дальнейший сюжет, которого в переписке нет.</li>\n<li>Мотив выбора жертвы не назван. Почему окаменела именно Асеша — не сказано.</li>\n<li>Что с ней стало после — не сказано: «попытался её догнать, но она скрылась из виду», больше она не появляется.</li>\n<li>Речи у неё нет, характера нет, имени собственного нет — «Горгона» это то, как её называют люди.</li>\n<li>Обратимость окаменения известна рассказчику только из картинок в чужой книге; ни автор состава, ни книга, ни её точное содержание не названы, пропорции определены на глаз.</li>\n<li>Отношение Горгоны к остальным монстрам вселенной не установлено. Спор о том, много ли в мире монстров и живут ли они рядом с людьми, в этом окне остался нерешённым.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0138--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0138--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-11</td>\n<td>218119–218123</td>\n<td>w0052</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-08-12</td>\n<td>218210–218256</td>\n<td>w0052</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0138-gorgona.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0138--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0138.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
