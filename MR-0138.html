<script>const BASE="";const DOCNAME="АЗИП";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0138-S01", "MR-0138--ustroystvo"], "h": "<p>АЗИП — организация вселенной «Апостол», вербующая агентов для уничтожения опасных существ и работы с чужемирцами. Придумана Славой, разбиралась и достраивалась вопросами Миколая. В переписке пишется и как «Азип», и как «организация АЗИП».</p>\n<p><strong>Название.</strong> Аббревиатура расшифровывается как «Апостол закон и права» (2025-05-28, id 330991). Расшифровка дана после прямых вопросов Миколая «это аббревиатура?», «что означает».</p>\n<p><strong>Публичное прикрытие.</strong> «Для всего мира организация АЗИП это невероятной большой количество бизнесов. По типу торговлю одежды, машины, еды и оказания каких либо услуг» (2025-05-28, id 330967). Присутствие сплошное: «Везде. В каждом городе. Хотя бы один его из магазинов будет» (id 330968).</p>\n<p><strong>Структура.</strong> «у неё 21 главных филиалов. У каждого филиала ещё есть свои филиалы. На их ней территории. А также на всех их ней территорий разный компаний» (2025-05-30, id 331444). Филиалы расположены «Во всём мире» (id 331452), в том числе «На Северном полюсе два апостола сидят» (id 331453).</p>\n<p><strong>Правовой статус.</strong> Организация не государственная, но «в каком либо месте у нас равный или даже превосходящий права» — формулировка из контракта (<a href=\"MR-0139.html\">Контракт и правила агента АЗИП</a>). Миколай определяет её как «как минимум транснациональная компания ТНК» и отмечает, что она «не привязана к законодательству конкретного государства» (2025-05-30, id 331231–331232). Контракт агента при этом российский: «Ну типо контракт России» (id 331443).</p>\n<p><strong>Основатели и заказчики.</strong> На вопросы «кто является основателем» и «зачем и на кого она работает» ответ один — «Апостолы» (2025-05-30, id 331454), работает организация «На апостолов. Для защиты порядка» (id 331456). Обоснование через историю: «Типо апостолы с давних времён защищали мир. И во всё времена государство о них знала» (id 331455).</p>\n<p><strong>Возраст и репутация.</strong> По состоянию на 2025-08-30 (id 359681) АЗИП — «нерушимая организация Азип, которой уже более сотней лет», принадлежащая апостолам, то есть «Сильнейший среди благословенных. Людей, что лишь своё силой и авторитетом поддерживают мир».</p>\n<p><strong>Функции агентов</strong> прописаны в отдельном документе — контракте и правилах агента (<a href=\"MR-0139.html\">Контракт и правила агента АЗИП</a>): встреча и регистрация чужемирцев либо их устранение при агрессии, устранение или захват носителей особенностей, нарушающих закон (благословение, артефакт, арбетары, фантазёры), обязательный отчёт по каждому акту уничтожения, юридическая защита, доступ в любые места, право на убийство.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Как развивалось — не материал авторов</b>\n<p>2025-05-28 — заявили: агент, права и обязанности, контракт вербовки, публичное прикрытие сетью бизнесов, расшифровка аббревиатуры. 2025-05-30 — ограничили под вопросами Миколая: не государственная, но ТНК; контракт российский; 21 главный филиал; 700 000 000 сотрудников; апостолы как основатели и заказчики. Тогда же часть вопросов закрыта отсрочкой — «Ну об этом стоит подумать», «Вот здесь да придумать надо чтото». 2025-05-31 — работа продолжилась, но в соседней линии: сводный документ про правителей и благословение, где апостолы получают число и телепатию, а АЗИП не упомянут ни разу. Дальше три месяца ничего. 2025-08-30 — вернулись, но уже не к устройству: организация в этом окне работает как мерка, которую должен перешагнуть будущий злодей.</p></div>", "r": [["Контракт и правила агента АЗИП", "MR-0139.html"]]}, {"t": "Население", "a": ["S02", "MR-0138-S02", "MR-0138--naselenie"], "h": "<p><strong>Сотрудники делятся на две категории:</strong> «Сотрудники делятся на агентов и простых сотрудников, который работают в компаниях. Например создание машин и типо того» (2025-05-30, id 331445).</p>\n<p><strong>Численность не установлена.</strong> Слава прямо говорит: «Сколько всего сотрудников я не знаю», «Могу вкинуть рандомной число» — и называет 700 000 000 (id 331446–331448). Число обосновано прикидкой: «Если всего людей в мире 8 225 048 831», «То это число принципе ок» (id 331449–331450). Отдельно оговорено: «Но это сотрудники только люди» (id 331451). То есть цифра зафиксирована самим автором как случайная, а не как решение.</p>\n<p><strong>Агенты</strong> — «люди или чужемирцы, которых завербовали в организацию АЗИП. И их главная цель уничтожения опасных существ. Буть то люди или чужемирцы» (2025-05-28, id 330909).</p>\n<p><strong>Апостолы</strong> стоят над организацией: они её основатели и заказчики. Двое находятся на Северном полюсе.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Отклик — не материал авторов</b>\n<p>Понравилось, как Слава обращается с собственным «рандомным числом»: назвал 700 000 000, сам пометил, что оно случайное, — и тут же полез сверять его с населением, 8 225 048 831, чтобы убедиться, что «то это число принципе ок». Это не выдумывание, это проверка выдумки на прочность, и она честнее, чем если бы число подали как решение. Из той же породы «Везде. В каждом городе. Хотя бы один его из магазинов будет» — прикрытие, которое работает не секретностью, а избыточностью. И отдельно — «На Северном полюсе два апостола сидят»: фраза ничего не объясняет, никуда не ведёт, но после неё организация впервые перестаёт быть схемой. К августу она уже настолько своя, что становится единицей измерения страха: не «злодей сильный», а «Азип не вывозит».</p></div>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0138-S03", "MR-0138--mesto-vo-vselennoy"], "h": "<p>АЗИП завязан на апостолов и благословенных: апостолы — «Сильнейший среди благословенных», организация принадлежит им и работает на них ради защиты порядка. При этом благословенные, нарушающие закон, входят в число тех, кого агенты обязаны устранять или захватывать, — то есть организация обращена и вовне, и внутрь этого круга.</p>\n<p>Вторая точка соприкосновения — чужемирцы и пространственные аномалии: агенты встречают вышедших из своего мира и либо регистрируют, либо устраняют.</p>\n<p>Отдельный документ организации — контракт и правила агента (<a href=\"MR-0139.html\">Контракт и правила агента АЗИП</a>).</p>\n<p>Через прикрытие в виде сети бизнесов организация встроена в обычный мир: одежда, машины, еда, услуги, магазин в каждом городе.</p>\n<p>В окне 2025-08-30 АЗИП работает как мера прочности мира при обсуждении будущего злодея: Слава ищет фигуру, от которой «люди осушители страх. О том что апостол не справится и Азип не вывозит» (id 359683). Разобранные там кандидаты и причины отказа:</p>\n<ul>\n<li>«сестра благословенная правителем Кильке» — «Да она сильнее одного апостола. Но дальше че. Это не та сила, что поставит на колени весь мир. А её подручный всё слабее апостолов. Каждый из них один на один против апостолов продует. При этом у них не такая большая группировка» (id 359684);</li>\n<li>Серафим — «это одноразовый босс. Что появится, когда будет война с раем» (id 359686).</li>\n</ul>\n<p>Итог обсуждения: «Нужен злодей» (id 359685). Кто им стал, в этом окне не сказано.</p>", "r": [["Контракт и правила агента АЗИП", "MR-0139.html"]]}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0138-S04", "MR-0138--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-05-28 (id 330906–330940).</strong> Заход через вопрос Славы «Права и обязанности агента ?» и уточнение Миколая «агента чего». Слава даёт определение агента. Миколай накидывает первые правила: «имеют право уничтожать всех кто входит в категорию опасных существ / обязаны писать отчёт по каждому акту уничтожения». Вводится контракт вербовки и порядок выхода из организации через подписку о неприменении знаний и неразглашении.</p>\n<p>В этом же окне Миколай накидывал варианты, к которым в дальнейшем не возвращались: доска, «где главы организации размещают этих существ» (id 330959); обязанность «иметь устройство связи и отвечать на каждый звонок» (id 330960); право «получить защиту от существ» (id 330961). Ни принятия, ни отказа по ним в переписке нет.</p>\n<p><strong>Версия 2 — 2025-05-28 (id 330952–330991).</strong> Вопросы Миколая о том, как организация выглядит снаружи: «имеют ли право сообщать где состоят?», «где можно найти информацию об этой организации в том мире?». Ответ Славы — публичное прикрытие в виде сети бизнесов и магазин в каждом городе. Здесь же дана расшифровка аббревиатуры: «Апостол закон и права». Вопрос «имеют ли право сообщать где состоят» отдельного ответа не получил.</p>\n<p><strong>Версия 3 — 2025-05-30 (id 331230–331247).</strong> Разбор Миколая: статус ТНК, непонятный масштаб («как будто бы она маленькая»), вопросы о числе сотрудников и филиалов, их расположении, основателе, заказчике, источнике полномочий негосударственной компании; предположение о «совете 300+ государств о создании и поддержании такой организации»; замечания про рубли и русский язык — «получается рубли и язык русский.... мде».</p>\n<p><strong>Версия 4 — 2025-05-30 (id 331442–331461).</strong> Ответы Славы: российский контракт, 21 главный филиал с подфилиалами и компаниями, деление сотрудников на агентов и работников компаний, условные 700 000 000 сотрудников-людей, филиалы по всему миру, два апостола на Северном полюсе, апостолы как основатели и заказчики, цель — защита порядка. По ряду вопросов ответа нет: «Ну об этом стоит подумать» (id 331457), «Вот здесь да придумать надо чтото» (id 331460).</p>\n<p><strong>Версия 5 — 2025-08-30 (id 359681–359686).</strong> Организация описана как «нерушимая» и существующая «более сотней лет», принадлежащая апостолам. Здесь АЗИП фигурирует уже не как разрабатываемая структура, а как порог, который должен перешагнуть будущий злодей.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0138-S05", "MR-0138--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Общее число сотрудников не установлено: названное 700 000 000 сам автор пометил как «рандомной число».</li>\n<li>Число сотрудников-нелюдей не названо вообще — оговорено только, что 700 000 000 «это сотрудники только люди».</li>\n<li>Где именно расположен 21 главный филиал, не перечислено; названа только точка на Северном полюсе.</li>\n<li>Источник полномочий негосударственной организации не установлен. Версия с «советом 300+ государств» предложена Миколаем и оставлена без решения.</li>\n<li>Не решено, на каком языке организация говорит с чужемирцами из других миров.</li>\n<li>Не сказано, имеют ли агенты право сообщать о своём членстве в организации, хотя вопрос был задан прямо (id 330955).</li>\n<li>Идеи с доской заданий, обязательным устройством связи и правом на защиту от существ выдвинуты и не отработаны.</li>\n<li>Вселенная в окнах w0099 и w0103 не переобъявлена: в w0099 отнесение сделано по содержанию (апостолы, благословения, арбетары), в w0103 вселенная не объявлена.</li>\n<li>Как соотносятся АЗИП и государства на практике — кроме фразы, что «во всё времена государство о них знала», — не описано.</li>\n<li>Злодей, способный создать ситуацию «Азип не вывозит», к концу обсуждения не выбран.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0138--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0139.html\">Контракт и правила агента АЗИП</a></li>\n<li><strong>Упомянут в мирах:</strong> <a href=\"MR-0139.html\">Контракт и правила агента АЗИП</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0004.html\">АЗИП («Апостол закон и права»)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0138--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-05-28</td>\n<td>330906–330940</td>\n<td>w0099</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-05-28</td>\n<td>330952–330991</td>\n<td>w0099</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-05-30</td>\n<td>331230–331247</td>\n<td>w0099</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-05-30</td>\n<td>331442–331461</td>\n<td>w0099</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-08-30</td>\n<td>359681–359686</td>\n<td>w0103</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0138-azip.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0138--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0138.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["MR-0138-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/MR-0138/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Апостолы. Организация им принадлежит, ими основана, на них работает и их именем названа — «Апостол закон и права», — а сущности «апостолы» со статьёй в справочнике нет. Весь материал лежит в служебной записи <code>SL-0054</code> «Список 12 апостолов»: 234 052 знака базы, статьи нет, ссылок по счётчику три. По тексту на неё опираются <code>PS-0211</code>, <code>PS-0279</code>, <code>PS-0183</code>, <code>IS-0013</code>, <code>SP-0127</code> и сводные статьи по апостолам, АЗИП, агентам и благословенным. Это самая большая запись без статьи во всём наборе. В блоке «Связано с» самой <code>MR-0138</code> стоит «Апостолы» — указатель, который ведёт в пустоту.</p>\n<p>Второе — служебные перечни, на которых держится определение того, кого агент обязан устранять: <code>SL-0089</code> «Список категорий сил» (1 753, статьи нет, четыре ссылки) и <code>SL-0090</code> (5 492, статьи нет, четыре ссылки), рядом <code>SL-0051</code> и <code>SL-0053</code> (по шесть ссылок, статей нет). На них ссылается десяток статей вселенной, включая обе сводки по АЗИП и по агентам, а разобрать их не на чем.</p>\n<h3>С чего начать</h3>\n<p>В базе, и близко. <code>SL-0054</code>, id 331635, 2025-05-31 — на следующий день после ответов про филиалы Слава выдал сводный документ по устройству мира, и там апостолы наконец определены числом: «Апостолы это 21 человек получивший благословен от правителя рая. ( 21 это максимальное число благословения, который способен давать правитель рая. Другие же правители дают меньше)», плюс общая для них телепатия. Накануне, 331444, в самой АЗИП: «у неё 21 главных филиалов». Два «21» стоят в соседних записях с разницей в сутки и нигде не сведены. Это первое, что надо сверить: одно это число или совпадение.</p>\n<p>Там же (331635–331636) лежит механика, к которой привязан статус апостолов, — связь на мозге, четыре базовые способности, уникальная способность от правителя. Она разошлась по <code>SP-0163</code> (статья есть, 41 683), <code>SL-0054</code>, <code>PS-0278</code>, <code>PS-0279</code>, <code>PS-0280</code>, <code>MR-0140</code>, <code>MR-0207</code> — и ни одной ниткой не заходит в <code>MR-0138</code>, хотя вопрос Миколая про источник полномочий негосударственной конторы стоит именно здесь.</p>\n<p>В архив — за двумя вещами. Первое: окно w0099 обрывается на 331667, разбор лора (правители, благословение, арбетары, фантазёры, Кура) не закончен, часть вопросов Миколая осталась без ответа — продолжение искать правее 2025-05-31. Второе: окно w0103 открывается с середины разговора, с фразы «Ты же знаешь кто такие апостол», то есть разгон линии остался левее — в хвосте w0102, около 355186 (способность для самого жестокого апостола, ответ Миколая 355798–355800). Оттуда пришли и «нерушимая организация», и «более сотней лет».</p>\n<h3>Как развивалось</h3>\n<p>2025-05-28 — заявили: агент, права и обязанности, контракт вербовки, публичное прикрытие сетью бизнесов, расшифровка аббревиатуры. 2025-05-30 — ограничили под вопросами Миколая: не государственная, но ТНК; контракт российский; 21 главный филиал; 700 000 000 сотрудников; апостолы как основатели и заказчики. Тогда же часть вопросов закрыта отсрочкой — «Ну об этом стоит подумать», «Вот здесь да придумать надо чтото». 2025-05-31 — работа продолжилась, но в соседней линии: сводный документ про правителей и благословение, где апостолы получают число и телепатию, а АЗИП не упомянут ни разу. Дальше три месяца ничего. 2025-08-30 — вернулись, но уже не к устройству: организация в этом окне работает как мерка, которую должен перешагнуть будущий злодей.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Выход из организации. Для агентов порядок назван: подписка о неприменении полученных знаний и о неразглашении, при нарушении — наказание. При этом штат разделён надвое ещё до этого: «Сотрудники делятся на агентов и простых сотрудников, который работают в компаниях» (331445), и 700 000 000 — это про весь штат, то есть про вторую половину в первую очередь. Для неё ничего того же рода не сказано: ни как берут, ни что человеку известно про то, где он на самом деле работает, ни что происходит при уходе. Для одной категории сотрудников правило выхода проговорено, для соседней — нет.</p>\n<h3>Отклик</h3>\n<p>Понравилось, как Слава обращается с собственным «рандомным числом»: назвал 700 000 000, сам пометил, что оно случайное, — и тут же полез сверять его с населением, 8 225 048 831, чтобы убедиться, что «то это число принципе ок». Это не выдумывание, это проверка выдумки на прочность, и она честнее, чем если бы число подали как решение. Из той же породы «Везде. В каждом городе. Хотя бы один его из магазинов будет» — прикрытие, которое работает не секретностью, а избыточностью. И отдельно — «На Северном полюсе два апостола сидят»: фраза ничего не объясняет, никуда не ведёт, но после неё организация впервые перестаёт быть схемой. К августу она уже настолько своя, что становится единицей измерения страха: не «злодей сильный», а «Азип не вывозит».</p></div>", "r": []}];</script>
