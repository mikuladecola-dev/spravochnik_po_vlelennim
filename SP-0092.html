<script>const BASE="";const DOCNAME="Семя";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0092-S01", "SP-0092--mehanika"], "h": "<p>«Семя» — название, которое Слава дал системе происхождения способностей (2024-07-21, id 207717: «Семя есть»). Термин появился раньше содержания: на вопрос Миколая «какое семя» и «что это значит» Слава сначала ответил односложно («Это»), а разбор выдал отдельным сообщением через несколько минут.</p>\n<p>Система в версии 1 (2024-07-21, id 207736) состоит из двух частей — происхождение силы и тип энергии.</p>\n<p><strong>Происхождение силы</strong>, два пункта:</p>\n<ol>\n<li>врождённый</li>\n<li>контракт</li>\n</ol>\n<p>Пояснения даны отдельными репликами. Контракт — «То бишь та недавних типо сосуд и сила из вне» (id 207739). Врождённый — «Врождённый орган» (id 207743). То есть врождённая сила — это орган в теле носителя, а контракт — внешняя сила, помещённая в носителя как в сосуд.</p>\n<p><strong>Тип энергии</strong>, четыре пункта (id 207736):</p>\n<ul>\n<li>Внутренний — «усиления, трансформация, регенерация и т.п.»</li>\n<li>Внешний — «вайрбол, лазеры из глаз, ледяный шипы и т.п»</li>\n<li>Смещенный — без пояснения</li>\n<li>Особенный — «петля, имитация и т.п.»</li>\n</ul>\n<p>Что вся эта конструкция и есть семя, подтверждено прямым вопросом и ответом: Миколай — «это типо семя», Слава — «Типо да» (id 207747–207748).</p>\n<p>В версии 2 (2025-12-17, id 399522) семя описано иначе — уже не как схема классификации, а как объект внутри апостола: «можешь считать это источником их силы и быстрое адаптации». Здесь семя — то, что даёт апостолам силу и способность быстро адаптироваться.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0092-S02", "SP-0092--ogranicheniya-i-cena"], "h": "<p>Ограничения в версии 1 не проговорены — там только классификация.</p>\n<p>В версии 2 названо последствие утраты (2025-12-17, id 399522). Один из апостолов оказывается «выженым пламенем Серафима», выживает, но теряет семя. После этого он уходит от Апостолов — «точнее сбегает не желая чтобы его братья видели, как он умирает». Умирает в домике в лесу и «становится чем-то другими. Чудовищем». Затем нападает на графа, который его нашёл, и пытается его сожрать.</p>\n<p>Сама постановка вопроса у Славы: «А что произойдет если апостол умрет. Умретли он просто или переродится чем то иным». Потеря семени в этой идее ведёт не к простой смерти, а к перерождению в чудовище.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0092-S03", "SP-0092--nositeli"], "h": "<p>В версии 1 носители не названы: система подана как общее устройство появления силы, без привязки к персонажам.</p>\n<p>В версии 2 семя привязано к апостолам. Про них сказано: «Апостолы не люди. Их ней цикл жизни я не придумал» (id 399521). Отдельно упомянут Защитник — «один из апостолов», который «должен будет отказаться от человечность ( что плачет в нём и чувствует вину, что не уберёг семью)»; что произойдёт после отказа, Слава ставит как открытый вопрос, а не как ответ.</p>\n<p>Теряет семя другой, неназванный по имени апостол — тот, кого сжигает пламя Серафима.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0092-S04", "SP-0092--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-07-21 (id 207712–207748, окно w0048), вселенная «7 островов».</strong> Семя — система: два происхождения силы (врождённый / контракт) и четыре типа энергии (внутренний, внешний, смещённый, особенный). Слово «семя» вызвало у Миколая отдельную реакцию — «сперма?», «а то меня от этого слова чуток тошнит», но термин остался.</p>\n<p><strong>Версия 2 — 2025-12-17 (id 399521–399527, окно w0114), вселенная «Феня».</strong> Семя — источник силы и быстрой адаптации апостола, физически теряемый. Слава прямо оговаривает, что не владеет определением: «я так и сам не до конца понял, что это за семя». Формулировка «можешь считать это источником их силы и быстрое адаптации» подана именно как рабочее допущение, а не как определение.</p>\n<p>Между версиями полтора года и смена вселенной (7 островов → Феня). Как соотносятся классификационное семя 2024 года и семя-орган апостолов 2025 года, в переписке не сказано — связь между двумя состояниями нигде не проводится, старое не отменяется и не подтверждается.</p>\n<p>Реакция Миколая на версию 2 — «спокойно да может» (id 399527).</p>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S05", "SP-0092-S05", "SP-0092--otklonennye-varianty"], "h": "<p>Отклонённых вариантов в материале нет. Версия 2 подана Славой как «пара идей», то есть как предположение, а не как утверждённое устройство, но ни одна из них в переписке не отвергнута.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S06", "SP-0092-S06", "SP-0092--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Семя связано с концепцией появления силы — оно и есть её часть (по разметке записи: «Часть чего — Концепция появления силы»). Кроме того, запись связана с: Апостолы, Апостол-чудовище, Серафим, Базовые приёмы, Правило: способности не у всех.</p>\n<p>Пламя Серафима выступает как то, что способно лишить апостола семени. Апостол-чудовище — результат утраты семени и смерти.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "SP-0092-S07", "SP-0092--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Тип энергии «смещенный» назван в списке и не пояснён ничем: ни определения, ни примера (2024-07-21, id 207736). Остальные три типа снабжены примерами.</li>\n<li>Природа семени во второй версии не определена самим автором: «я так и сам не до конца понял, что это за семя».</li>\n<li>Цикл жизни апостолов не придуман — сказано прямо: «Их ней цикл жизни я не придумал».</li>\n<li>Что произойдёт с Защитником после отказа от человечности — поставлено вопросом и оставлено без ответа.</li>\n<li>Связь между версией 1 (система из двух происхождений и четырёх типов энергии) и версией 2 (орган апостола) не проведена.</li>\n<li>Не сказано, есть ли семя у людей или только у апостолов; в версии 1 речь идёт о силе вообще, в версии 2 — только об апостолах.</li>\n<li>Как именно семя обеспечивает «быструю адаптацию» и к чему адаптацию — не раскрыто.</li>\n<li>Реакция Миколая на версию 2 ограничивается одной репликой; обсуждения не последовало.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0092--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0078.html\">Апостолы (Феня; список 12)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0092--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-21</td>\n<td>207712–207748</td>\n<td>w0048</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-17</td>\n<td>399521–399527</td>\n<td>w0114</td>\n<td>Феня (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0092-semya.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0092--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0092.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
