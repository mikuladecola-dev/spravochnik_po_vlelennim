<script>const BASE="";const DOCNAME="Типы зарождения монстров";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0055-S01", "MR-0055--ustroystvo"], "h": "<p>Запись фиксирует, каким способом монстры могут зарождаться. Материал устроен как четыре перечня возможных способов появления, сброшенных Миколаем в чат подряд 2024-08-11 (id 217891–217911), и два его выбора внутри этих перечней.</p>\n<p>Происхождение самих перечней Миколай называет прямо (217911): «если про рождение, эт просто примеры разнообразия хз, захотел у нейронки узнать и заодно кинул сюда». То есть списки машинные, авторским является выбор пунктов и комментарии к ним.</p>\n<p>Свой тип зарождения Миколай определяет однозначно. После первого списка из 12 пунктов он пишет (217894): «у меня 10» — то есть пункт 10 того списка, «Порождение коллективным бессознательным».</p>\n<p>Второй выбор — пометка на пункте 12 третьего списка (217900): «12 прикольная идея». Это пункт «Сущности, являющиеся воплощением нереализованных путей эволюции». Он отмечен как идея, а не как принятый тип; заявления, что этот способ действует во вселенной, в переписке нет.</p>\n<p>Отдельно стоит отметить, что мотив коллективного бессознательного встречается и в других перечнях, помимо выбранного: во втором списке пункт 12 — «Проявление коллективного подсознания группы людей», в третьем пункт 6 — «Монстры как проявление коллективного бессознательного целой планеты». Какой именно масштаб имеется в виду в авторском варианте — группа людей, целая планета или что-то иное, — в переписке не оговорено; выбран пункт из первого списка без уточнения масштаба.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S02", "MR-0055-S02", "MR-0055--mesto-vo-vselennoy"], "h": "<p>Запись входит в состав сущности «Монстры и вера» и связана с записью «Что такое монстр».</p>\n<p>Выбранный тип — порождение коллективным бессознательным — согласуется с тем, как в этой вселенной вообще появляются монстры: через веру и представление людей. Механизм здесь не описан, назван только тип.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S03", "MR-0055-S03", "MR-0055--kak-menyalsya-po-versiyam"], "h": "<p>Все три версии относятся к одному дню, 2024-08-11, окно w0051. Менялся не замысел, а перебираемый материал: списки идут один за другим, от нейтрально-жанрового к предельно абстрактному и затем к бытовому-шуточному.</p>\n<h3>Версия 1 — 2024-08-11, сообщения 217891–217894</h3>\n<p>Первый список, 12 пунктов, введён репликой «вот список» (217892):</p>\n<ol>\n<li>Естественное размножение</li>\n<li>Магическое создание или заклинание</li>\n<li>Научный эксперимент</li>\n<li>Мутация из-за радиации или токсинов</li>\n<li>Проклятие или трансформация человека</li>\n<li>Скрещивание разных видов</li>\n<li>Оживление неживой материи (големы, зомби)</li>\n<li>Порождение богами или демонами</li>\n<li>Пришельцы из других миров</li>\n<li>Порождение коллективным бессознательным</li>\n<li>Эволюция или адаптация к экстремальным условиям</li>\n<li>Искусственный интеллект, вышедший из-под контроля</li>\n</ol>\n<p>Комментарий Миколая (217894): «у меня 10».</p>\n<h3>Версия 2 — 2024-08-11, сообщения 217896–217900</h3>\n<p>Второй список, 15 пунктов (217896):</p>\n<ol>\n<li>Воплощение абстрактных концепций или идей</li>\n<li>Материализация из снов или кошмаров</li>\n<li>Временные парадоксы или искажения реальности</li>\n<li>Слияние разных существ или сущностей</li>\n<li>Побочный эффект магических ритуалов</li>\n<li>Эманация сильных эмоций или психической энергии</li>\n<li>Искажение природных законов в определенных местах</li>\n<li>Симбиоз с паразитическими формами жизни</li>\n<li>Квантовые флуктуации или многомировая интерпретация</li>\n<li>Развитие из спор или семян внеземного происхождения</li>\n<li>Пробуждение дремлющих древних существ</li>\n<li>Проявление коллективного подсознания группы людей</li>\n<li>Побочный эффект технологических катастроф</li>\n<li>Трансформация из-за воздействия неизвестных космических сил</li>\n<li>Результат алхимических экспериментов</li>\n</ol>\n<p>После него — «ещё» (217897) и третий список, 12 пунктов (217899):</p>\n<ol>\n<li>Существа, возникающие из-за квантовой декогеренции сознания</li>\n<li>Монстры как побочный продукт межпространственных складок реальности</li>\n<li>Сущности, рождающиеся из парадоксов логики или математики</li>\n<li>Создания, являющиеся воплощением нереализованных вероятностей</li>\n<li>Существа, возникающие в результате обратной причинности</li>\n<li>Монстры как проявление коллективного бессознательного целой планеты</li>\n<li>Сущности, рождающиеся из информационных потоков и данных</li>\n<li>Создания, появляющиеся из-за искажения законов термодинамики</li>\n<li>Существа, возникающие на стыке параллельных вселенных</li>\n<li>Монстры как результат самоорганизации хаоса на квантовом уровне</li>\n<li>Создания, рождающиеся из-за нарушения симметрии фундаментальных сил</li>\n<li>Сущности, являющиеся воплощением нереализованных путей эволюции</li>\n</ol>\n<p>Комментарий Миколая (217900): «12 прикольная идея».</p>\n<h3>Версия 3 — 2024-08-11, сообщения 217902–217911</h3>\n<p>Четвёртый список, бытовой-шуточный, 12 пунктов (217902):</p>\n<ol>\n<li>Существа, рождающиеся из забытых вещей на чердаках и в подвалах</li>\n<li>Монстры, появляющиеся из-за неправильно прочитанных рецептов</li>\n<li>Создания, возникающие из несделанных домашних заданий</li>\n<li>Сущности, рождающиеся из неотвеченных писем и сообщений</li>\n<li>Монстры, появляющиеся из-за неправильно собранной мебели</li>\n<li>Существа, возникающие из потерянных носков в стиральной машине</li>\n<li>Создания, рождающиеся из заброшенных хобби и нереализованных идей</li>\n<li>Монстры, появляющиеся из-за неправильно припаркованных автомобилей</li>\n<li>Сущности, возникающие из непонятых шуток и каламбуров</li>\n<li>Существа, рождающиеся из неотмеченных дней рождения</li>\n<li>Монстры, появляющиеся из-за неправильно настроенных будильников</li>\n<li>Создания, возникающие из недоеденных обедов и просроченных продуктов</li>\n</ol>\n<p>Отмеченных пунктов в этом списке нет.</p>\n<p>Реакция Славы (217906): «Ты как то все замудрил». Миколай переспрашивает, понятно ли всё, и предлагает пояснить: «ну ты всё пон или нет?», «как по мне всё норм», «что не понятно», «всё поясню» (217907–217910). Пояснение сводится к указанию на источник и назначение списков (217911): «если про рождение, эт просто примеры разнообразия хз, захотел у нейронки узнать и заодно кинул сюда».</p>", "r": []}, {"t": "Пробелы", "a": ["S04", "MR-0055-S04", "MR-0055--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Перечни машинные, не авторские; авторским материалом являются только выбор пунктов («у меня 10») и комментарий «12 прикольная идея».</li>\n<li>Что именно значит «Порождение коллективным бессознательным» в этой вселенной — механизм, участники, условия — в перечне не раскрыто, а в этих сообщениях не обсуждалось.</li>\n<li>Масштаб коллективного бессознательного не назван: между «группой людей» и «целой планетой» выбор не сделан.</li>\n<li>Пункт про нереализованные пути эволюции отмечен как «прикольная идея», но принят он или нет, осталось нерешённым.</li>\n<li>Из остальных пунктов четырёх списков ни один не отмечен и не отвергнут явно — они не откомментированы вовсе.</li>\n<li>Претензия Славы «Ты как то все замудрил» не снята: разбора по пунктам не последовало, Миколай ограничился объяснением, откуда взялись списки.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0055--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0055--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-11</td>\n<td>217891–217894</td>\n<td>w0051</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-08-11</td>\n<td>217896–217900</td>\n<td>w0051</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-08-11</td>\n<td>217902–217911</td>\n<td>w0051</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0055-tipy-zarozhdeniya-monstrov.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0055--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0055.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
