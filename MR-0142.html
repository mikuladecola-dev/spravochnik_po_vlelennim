<script>const BASE="";const DOCNAME="Мир Бетонного героя";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0142-S01", "MR-0142--ustroystvo"], "h": "<p>Мир из наброска «Бетонный герой» (2025-08-08, id 354014–354016). Собственного названия у мира в переписке нет — заголовок статьи служебный.</p>\n<p>Исходное событие: «Много лет назад людям пришлось покинуть землю. Причины неизвестные или их скрывают». Скрывают именно из страха, что народ, «узнав ту правду», перестанет восхвалять героев «как спаситель. Как героев, что однажды спасли множество жизни».</p>\n<p>Где живут люди после ухода — не сказано; названо только то, что это не Земля. Рыжеволосый мальчишка формулирует это прямо: «Мы с тобой не на Земле. Так что забудь уже».</p>\n<p>Физическое устройство того места, где живут люди:</p>\n<ul>\n<li>Пол везде бетонный. Упасть с высоты значит «разбиться о бетонной пол, что был везде».</li>\n<li>Заводы «были на каждом шаге. От которых не убежать». Они «дымили своими горячими парами отравляли и так убитую планету».</li>\n<li>Заводы при этом обязательны для жизни: «без них, человечество не смог бы, здесь жить. Как и без технологии, что производят кислород». То есть кислород даёт техника.</li>\n<li>Неба в привычном виде нет: вверху «серое неба», «серый плывущий комок», серость «от туч и дыми». Синеву «безбожно спрятали комки».</li>\n<li>Есть многоуровневая застройка с ржавыми перилами и пропастью за ними, улицы, толпа, прилавки торговцев, мусорки.</li>\n</ul>\n<p>Небо как оно было на Земле известно только по чужим рассказам: «они говорили небо было синим, а рядом с ним летали белые, как ангелы облака».</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0142-S02", "MR-0142--naselenie"], "h": "<p><strong>Герои — правящее сословие.</strong> «Если подумать, то раньше эти герои и правда выглядели мужественно и устрашали своим видом все проблемы. Но сейчас спустя так много времени. Так много поколений. Герои стали большее похожие на жирных свиней, что раздают всем указания». Их фирменная фраза — «Работа найдётся для всех», при этом «там не говориться о зарплате». Работа для неумехи — «это стать пушечным мясом, который самовозглашают себя защитниками. Хотя защищают они лишь толстый задницы героев». Прошло «так много поколений» — то есть нынешние герои наследники тех, что «однажды спасли множество жизни».</p>\n<p><strong>Старшики.</strong> Отдельная группа, от которой идут рассказы про синее небо и облака. Рыжеволосый мальчишка их авторитет отрицает: «ну дурак и ты серьезно им поверил. Они даже не родились на земли, откуда им знать, как было раньше». Также от старшиков в принципе можно чего-то ожидать в смысле еды или вещей — рыжий спрашивает Свята: «Тебе.. Что-то старшики дали?», на что Свят отвечает: «да они, как будто дадут хоть, что-то».</p>\n<p><strong>Брошенные дети.</strong> Двое главных — Свят (Святослав; «Святославом его конечно же не кто не звал. Просто Свят и все, что нужно для брошенного ребёнка») и рыжеволосый мальчишка, имя которого не названо. Свят худощавый, глаза «красиво синими», волосы «мусорная коричневый». Оба истощены, живут голодом: желудок рыжего «скручивался, давил выжимал кислоты и продолжил переваривать самого себя», тело «плохо удерживало своего хозяина в равновесии» от истощения. Еду они добывают воровством — крадут с прилавка «всего-лишь хлеб. Кусочек даже».</p>\n<p><strong>Торговцы.</strong> Жилистый (он же описан как жирный) мужчина с прилавком, который гонится за детьми через толпу с криком «ЛОВИТе ВОРА!». Про его отношение к собственности сказано: «ему было без разницы ведь даже кусок хлебы баль его. Лишь его и не кто не смейте даже смотреть на его вещи».</p>\n<p><strong>Неизвестный.</strong> На последнем шаге наброска рыжеволосого перехватывает третья сторона: «Неизвестная мозолистая рука схватила мальца». Кто это — в переписке не сказано, набросок обрывается здесь.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0142-S03", "MR-0142--mesto-vo-vselennoy"], "h": "<p>Отнесён к вселенной «Апостол» по дате объявления. В базе связан с сущностями: Бетонный герой, Рыжеволосый мальчишка, Свят; сам мир числится частью «Бетонного героя». Связей с другими мирами вселенной в переписке не проводится.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0142-S04", "MR-0142--kak-menyalsya-po-versiyam"], "h": "<p>Версия одна (2025-08-08, id 354014–354016), сразу за ней — авторская пометка Славы: «Это набросок, который я не продолжу» (id 354016). Правок и пересмотров нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0142-S05", "MR-0142--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Название мира не дано.</li>\n<li>Причина ухода с Земли не названа — она «неизвестные или их скрывают». Правда, которую скрывают герои, в переписке не раскрыта.</li>\n<li>Где именно живут люди — другая планета, станция, что-то ещё — не сказано. Названо только «здесь жить» и «мы с тобой не на Земле». При этом заводы «отравляли и так убитую планету», то есть планета есть, но какая — не уточняется.</li>\n<li>Кто такие герои по происхождению, от кого и как они спасали людей, как устроена их власть — не описано.</li>\n<li>Кто такие старшики — не объяснено; про них известно только, что они рассказывают о Земле и что на Земле они не родились.</li>\n<li>Имя рыжеволосого мальчишки не названо.</li>\n<li>Что стало с детьми и кому принадлежит «мозолистая рука» — осталось нерешённым, набросок прекращён автором.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["MR-0142--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-08-08</td>\n<td>354014–354016</td>\n<td>w0102</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0142-mir-betonnogo-geroya.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0142--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0142.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
