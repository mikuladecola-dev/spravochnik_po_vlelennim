<script>const BASE="";const DOCNAME="Похоть (грех)";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0157-S01", "SP-0157--mehanika"], "h": "<p>Похоть (в вариантах имени также «luxuria») — один из семи грехов в системе «магия по грехам». Разбиралась вместе с остальными шестью грехами в одном заходе (2024-12-24, id 273904–273921), в двух вариантах.</p>\n<p><strong>Вариант Миколая (2024-12-24, id 273904–273908).</strong> Даётся в двух режимах — «если одна способность» и «если набор».</p>\n<p>Если одна способность — «это определённо афродизиак». Афродизиак Миколай предлагает определять двояко: «можно по разному определить его: как стихию и как благословение. типа: либо ты создаёшь туман с веществом и оно на человека влияет. либо ты влияешь на человека». То есть стихийный режим — создание тумана с веществом, которое действует на человека; режим благословения — прямое влияние на человека.</p>\n<p>Если набор — к афродизиаку добавляются:</p>\n<ul>\n<li>«контроль серотонина(решает кто кого любит по научному)» — то есть носитель определяет, кто кого любит;</li>\n<li>«отключает стыд регулирующий соц поведение».</li>\n</ul>\n<p>Категорию Миколай оставил неопределённой прямо в исходном сообщении: «в третьих: категорию хз как определить».</p>\n<p><strong>Вариант Славы (2024-12-24, id 273917–273921).</strong> «Контроль разума с ограничением. То бишь она может повысить какое то чувство или вызвать галлюцинаций или наоборот понизить какой то чувство». Три действия: повысить чувство, понизить чувство, вызвать галлюцинации. Слава говорит о носителе в женском роде («она может») — кто имеется в виду, не уточнено.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0157-S02", "SP-0157--ogranicheniya-i-cena"], "h": "<p>В варианте Славы ограничение объявлено в самой формулировке — «Контроль разума с ограничением», — но в чём оно состоит, не расшифровано. Та же конструкция у него для гордыни (<a href=\"SP-0162.html\">Гордыня (грех)</a>): «Слово закон с ограничением».</p>\n<p>Отдельного проклятья за похотью не закреплено ни в одном варианте — в отличие от алчности («ты не можешь ничего отдать кому либо») и гнева, где Миколай проклятья прописал.</p>\n<p>В том же окне Миколай замечает: «но в грехах это базовое подразумевается, такова природа греха» (2024-12-24, id 273917). К чему относится «это», из сохранённого куска не восстанавливается.</p>", "r": [["Гордыня (грех)", "SP-0162.html"]]}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0157-S03", "SP-0157--nositeli"], "h": "<p>Носители не названы. Слава говорит «она может повысить какое то чувство», но кто эта «она» — носительница или сама способность — в переписке не сказано.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0157-S04", "SP-0157--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-12-24 (id 273904–273908), Миколай.</strong> Афродизиак как единственная способность, с двумя возможными определениями (стихия — туман с веществом; благословение — прямое влияние на человека). В варианте набора к нему добавляются контроль серотонина и отключение стыда. Категория не определена.</p>\n<p><strong>Версия 2 — 2024-12-24 (id 273917–273921), Слава.</strong> Контроль разума с ограничением: повышение или понижение какого-либо чувства, либо вызов галлюцинаций. Слава проходит по списку Миколая и по похоти даёт замену, а не правку.</p>\n<p>Дальнейших версий у похоти нет. В отличие от гордыни, где 2024-12-25 (id 274470–274474) Миколай прямо отказался от своей версии в пользу Славиной, по похоти выбор между двумя вариантами в переписке не сделан — осталось нерешённым.</p>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S05", "SP-0157-S05", "SP-0157--otklonennye-varianty"], "h": "<p>Формально отклонённых вариантов нет: Слава не отверг предложение Миколая словами, а дал своё взамен. Оба варианта остались в переписке рядом, без разрешения.</p>\n<p>Внутри самого варианта Миколая есть нерешённая развилка: афродизиак «можно по разному определить» — как стихию (туман с веществом) или как благословение (влияние на человека); ни один из двух способов определения не выбран.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S06", "SP-0157-S06", "SP-0157--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Входит в набор «Семь грехов (магия по грехам)» вместе с гордыней (<a href=\"SP-0162.html\">Гордыня (грех)</a>), чревоугодием (<a href=\"SP-0158.html\">Чревоугодие</a>), алчностью, ленью, гневом и завистью. Все семь разбирались одним списком в сообщении id 273906 и одним ответным списком в id 273920; похоть в обоих списках стоит первой.</p>\n<p>Разделение способностей на «стихию», «благословение» и «проклятье», которым Миколай пользуется при разборе похоти, применяется и к другим грехам: чревоугодие (<a href=\"SP-0158.html\">Чревоугодие</a>) он относит к благословениям — «ибо влияние, а не создание». Для похоти этот же критерий даёт двойственность, из-за которой категория и осталась неопределённой.</p>", "r": [["Гордыня (грех)", "SP-0162.html"], ["Чревоугодие", "SP-0158.html"]]}, {"t": "Пробелы", "a": ["S07", "SP-0157-S07", "SP-0157--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Категория похоти не определена: «категорию хз как определить».</li>\n<li>Не выбрано, одна это способность (афродизиак) или набор (афродизиак плюс контроль серотонина плюс отключение стыда).</li>\n<li>Не выбрано между вариантом Миколая и вариантом Славы.</li>\n<li>Содержание «ограничения» в формуле «Контроль разума с ограничением» не раскрыто.</li>\n<li>Не сказано, чем состав тумана с веществом является — состав не назван.</li>\n<li>Носители не названы.</li>\n<li>Вселенная в исходной записи помечена как неясная: привязка к средневековой вселенной (объявлена 2024-12-21, id 272184) сделана по дате объявления, а не по прямому указанию в переписке.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0157--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0158.html\">Чревоугодие</a>, <a href=\"SP-0162.html\">Гордыня (грех)</a></li>\n<li><strong>Упомянут в способностях:</strong> <a href=\"SP-0158.html\">Чревоугодие</a>, <a href=\"SP-0162.html\">Гордыня (грех)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0157--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-12-24</td>\n<td>273904–273908</td>\n<td>w0068</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-24</td>\n<td>273917–273921</td>\n<td>w0068</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0157-pohot-greh.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0157--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0157.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
