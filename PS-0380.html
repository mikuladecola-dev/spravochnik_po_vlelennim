<script>const BASE="";const DOCNAME="Люля и Эвир";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0380-S01", "PS-0380--proishozhdenie"], "h": "<p>Люля и Эвир (вариант написания в переписке — «Люля и эвир») появились одним сообщением 2026-06-17 (id 491174–491178, окно w0122). Слава назвал источник задумки прямо: «Мой бредовый сон где я влюбился в скелет». Из этого сна пара и выведена — автор описывает переход от сна к сюжетной функции так: «По итогу я просто сделал романтическую линию второстепенных персонажей, который изб встретит в своём путешествие».</p>\n<p>Кто из двоих — скелет из сна и есть ли скелет среди них вообще, в переписке не сказано.</p>", "r": []}, {"t": "Связи с другими", "a": ["S02", "PS-0380-S02", "PS-0380--svyazi-s-drugimi"], "h": "<p>Пара привязана к Изб: они — те, кого Изб встретит в своём путешествии. Это единственная названная связь.</p>\n<p>Между собой Люля и Эвир связаны романтической линией — они и есть «романтическая линия второстепенных персонажей».</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S03", "PS-0380-S03", "PS-0380--kak-menyalsya"], "h": "<p><strong>2026-06-17 (id 491174–491178, окно w0122).</strong> Единственное состояние. Зафиксировано происхождение задумки (сон про влюблённость в скелет) и её функция в сюжете — романтическая линия второстепенных персонажей на пути Изб. Других версий нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S04", "PS-0380-S04", "PS-0380--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Сами персонажи не описаны: в переписке есть только происхождение линии и её место в сюжете. Внешность, характер, способности не названы.</li>\n<li>Не сказано, кто из пары Люля, а кто Эвир, и кому какая роль в романтической линии.</li>\n<li>Связь со скелетом из сна не проговорена: назван только источник задумки, а не то, что кто-то из пары — скелет.</li>\n<li>Вселенная в записи помечена как неясная (проставлена по дате объявления).</li>\n<li>Что с ними стало дальше — в переписке нет, задумка осталась на одном сообщении.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["PS-0380--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-06-17</td>\n<td>491174–491178</td>\n<td>w0122</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0380-lyulya-i-evir.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0380--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0380.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
