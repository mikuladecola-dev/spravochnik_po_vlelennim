<script>const BASE="";const DOCNAME="Группа сверхлюдей (ГГ)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0037-S01", "GR-0037--chto-eto"], "h": "<p>Предполагаемые главные герои вселенной «7 островов»: группа сверхлюдей. Запись очень тонкая — идея прозвучала один раз, в одну реплику, и дальше не развивалась.</p>\n<p>Появилась она так: Миколай спросил «так а кто гг вообще», Слава ответил «Не знаю», затем добавил «Ну там будет преступная организации». Миколай уточнил, что имел в виду другое — воюют острова сейчас или там мирно. И уже следом Слава сказал: «Наверное будут группа сверх людей» (2024-07-03, id 194885–194891).</p>\n<p>Слово «наверное» здесь авторское: на момент реплики это предположение, а не решение. Ни названия у группы, ни состава, ни численности, ни того, что именно означает «сверхлюди» в этом мире, не прозвучало.</p>\n<p>Отдельно стоит отметить, что во вселенной «7 островов» уже есть отдельная линия защитников островов и линия персонажей со способностями и инструментами; связывать их с этой группой в переписке никто не стал — такой связи не сказано.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S02", "GR-0037-S02", "GR-0037--otnosheniya-s-drugimi-gruppami"], "h": "<p>Единственное, что можно зафиксировать, — соседство в разговоре. На один и тот же вопрос «кто гг вообще» Слава дал два ответа подряд: сначала «Ну там будет преступная организации», потом «Наверное будут группа сверх людей» (2024-07-03, id 194885–194891). То есть группа сверхлюдей и преступная организация вброшены в одном обмене репликами, как ответы на один вопрос. Что между ними за отношения — противостояние, пересечение или ничего — в переписке не сказано.</p>\n<p>Преступная организация дальше прорабатывалась подробно, уже в следующем окне (2024-07-04, id 195996–196123): она «не зависит не от одного острова», «может быть везде», у неё «есть верхушка типо сильнейших в той организаций», она «не зависит не от одного защитника», «но она может заключать союзы», а к концу разговора Слава уточнил: «Они не везде есть группа людей и все». Верхушку решили делать смешанной: «Ну это верхушка прес огр будет состоять как из современных как из фэнтези». Цель организации так и не выбрали. Группа сверхлюдей в этой проработке ни разу не упоминается — параллельно с ней организация развивалась сама по себе.</p>\n<p>Единственное касание главных героев в том разговоре — реплика Славы про слияние двух измерений: «Да-да гг будет об этом узнавать как и зрителей / Вот только прест огр зачем» (2024-07-04, id 196074). Здесь сказано «гг» тем же сокращением, но связь этой реплики именно с группой сверхлюдей прямо не названа — речь идёт о том, что главные герои узнают о слиянии двух измерений одновременно со зрителем.</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S03", "GR-0037-S03", "GR-0037--kak-menyalas"], "h": "<p><strong>2024-07-03 (id 194885–194891).</strong> Идея названа и брошена. Реплика Славы: «Наверное будут группа сверх людей». Тут же рядом — «Ну там будет преступная организации» и «Нет конечно я сделаю так чтобы хотя бы 3 острова воевали». Миколай ответил «понял», и разговор ушёл дальше.</p>\n<p>Других версий нет. К идее не возвращались.</p>", "r": []}, {"t": "Пробелы", "a": ["S04", "GR-0037-S04", "GR-0037--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет: участники не названы, их количество не названо.</li>\n<li>Название группы не придумано; «Группа сверхлюдей (ГГ)» — это описание из реплики, а не имя.</li>\n<li>Что такое «сверхлюди» в этом мире и чем они отличаются от защитников островов и от персонажей со способностями — в переписке не сказано.</li>\n<li>Общих способностей группы нет — не обсуждались.</li>\n<li>Различий между участниками нет — участников нет.</li>\n<li>Иерархии нет — не обсуждалась.</li>\n<li>Отношение к преступной организации осталось нерешённым: обе вещи названы в одном обмене репликами, но связь между ними не проговорена.</li>\n<li>Принадлежность к островам не названа: на каком острове или островах эта группа, не сказано.</li>\n<li>Кто из соавторов ведёт этих персонажей, не распределялось.</li>\n<li>Идея не получила ни одной последующей версии: после 2024-07-03 к ней не возвращались.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0037--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0037--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0037.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0037-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0037/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Самая дорогая дыра здесь — слово «сверхлюди». На него в разных видах ссылаются, а записи, которая говорила бы, кто это, во вселенной «7 островов» нет ни одной. <code>MR-0195</code> («Искусственные сверхлюди»): статьи нет, база 6,0 КБ, одна входящая. <code>SP-0272</code> («Плёнка сверхлюдей»): статьи нет, 3,9 КБ. <code>MR-0199</code> и <code>MR-0205</code> — тоже без статей. Все четыре висят во вселенной «неясно». Единственное развёрнутое определение сверхлюдей — <code>GR-0042</code> («Сверхлюди (люди с сосудом)»), 27 КБ, но это вселенная «монстры». То есть термин, которым названы предполагаемые главные герои, определён в чужом мире и не определён в этом. Пока так, статья не может ответить на собственный первый вопрос — чем сверхлюди отличаются от защитников островов.</p>\n<p>Вторая дыра дешевле, но чинится за один заход: <code>ID-0080</code> («Группа сверхлюдей (ГГ)») — две входящие ссылки, статьи нет, база 1,8 КБ. При этом у <code>GR-0037</code> база нулевая. Весь дословный материал лежит в записи-идее, а статья написана поверх пересказа.</p>\n<p>Для сравнения, чтобы масштаб был виден: <code>MR-0026</code> («Преступная организация») — 12,8 КБ базы, 12,2 КБ статьи, четыре входящие ссылки, плюс отдельная групповая запись <code>GR-0026</code> («Пресрог») на 24,6 КБ. Обе вещи названы в одном обмене репликами. Одна получила сорок килобайт, вторая — полторы тысячи знаков.</p>\n<h3>С чего начать</h3>\n<p>В базу, не в архив. Сначала <code>ID-0080</code>: там лежат сами реплики 194885–194891, здесь их только пересказ. Потом <code>MR-0026</code> и <code>GR-0026</code> — разработка преступной организации 2024-07-04 (id 195996–196123) шла подряд с этим обменом, и если про сверхлюдей что-то ещё говорилось, оно осело туда. Заодно проверить реплику 196074 («гг будет об этом узнавать как и зрителей»): в статье она справедливо помечена как несвязанная, но лежит она в <code>MR-0026</code>, и обе записи трактуют сокращение «гг» по-разному.</p>\n<p>В архив идти за одним: окно 2024-07-03 вычерпано только по узкому диапазону 194885–194891. Смотреть надо шире — что было до вопроса «так а кто гг вообще» (почему он вообще возник) и что после «понял», до конца окна. Это единственный разговор, где авторы прямо обсуждали главных героев вселенной, и обрезан он по пяти сообщениям.</p>\n<h3>Как развивалось</h3>\n<p>2024-07-03: заявлено — одной репликой, со словом «наверное», в ответ на вопрос, который был про другое. В том же обмене рядом заявлена преступная организация и введено ограничение по войне («хотя бы 3 острова воевали»). Дальше — расхождение: 2024-07-04 преступная организация разрабатывается на сто с лишним сообщений, ограничивается («не зависит не от одного острова», «не зависит не от одного защитника», потом сужение «Они не везде есть группа людей и все»), обрастает верхушкой и остаётся без цели. Группа сверхлюдей в этой проработке не всплывает ни разу. Возврата нет: после 2024-07-03 идея не упоминается.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для преступной организации правило принадлежности проговорено с нажимом и дважды: «не зависит не от одного острова», «не зависит не от одного защитника», и отдельно оговорено исключение — «но она может заключать союзы». Для группы сверхлюдей, названной в том же обмене на тот же вопрос, правило того же рода не названо вообще: чья она, островная или межостровная, подчинена защитникам или нет. Вопрос был задан один — «кто гг», — ответа дано два, и к одному из них привязка к островам приложена явно, ко второму никак.</p>\n<h3>Отклик</h3>\n<p>Честно — зацепиться почти не за что, и это не претензия к статье, а свойство материала: одна реплика с «наверное» и всё. Но одна вещь тут всё-таки любопытная, и она не в сверхлюдях. Слава на вопрос «кто гг» сначала отвечает «Не знаю», потом называет преступную организацию, потом — группу сверхлюдей. То есть на вопрос о героях он дважды подряд отвечает не персонажами, а структурами: организация, группа. Человек, который строит мир снизу от институтов, а не сверху от лица, — и дальнейшая история это подтверждает: организацию он разработал за сутки, а героев так и не завёл. Слово «наверное» в реплике оставлено в статье правильно, оно тут держит весь смысл записи.</p></div>", "r": []}];</script>
