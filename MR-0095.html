<script>const BASE="";const DOCNAME="Рай";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0095-S01", "MR-0095--ustroystvo"], "h": "<p>Рай — один из миров вселенной «Апостол». Проходит по переписке с 2025-01-06 по 2025-10-18, шесть версий, окна w0070, w0077, w0083, w0106.</p>\n<p><strong>Размер и место в порядке появления.</strong> В первом же описании мироустройства (2025-01-06, id 278852) Слава задаёт шкалу: «Вот есть наш мир будем называть \"Вселенной\" и этот мир самый большой», а «На втором месте по размеру это \"рай\" и \"ад\"». Кроме этих трёх существует «множество минимиров». Размер миров понимается буквально, как физический объём: «Ну есть мир который по размеру как дом, а есть мир который как город и т.д.» (id 278863). Наш мир при этом назван бесконечным (id 278862).</p>\n<p>Позже порядок и обоснование размера меняются. В версии 4 (2025-03-19, id 305854) Рай назван «Вторым миром, который появился после Кильке». В версии 6 (2025-10-18, id 375849) размер прямо выведен из очерёдности появления правителей: «Первым правителем был правитель кильке. Вторым же был правитель рая. Поэтому их мир в разы больше миров других правителей».</p>\n<p><strong>Правитель.</strong> Правитель Рая — бог. Прямой ответ на вопрос Миколая «бог есть?» (id 278865) звучит так: «Бог есть в рая он его правитель» (id 278868). Правители, по объяснению версии 1, есть почти во всех мирах — это «существо правящий этим миров», и они могут дать своё благословение, но только людям из нашего мира (id 278852). В версии 6 (id 375849) правители описаны как «не физические существа появившиеся в нигде и в ни чем», первыми появившиеся в пустоте и начавшие создавать миры «По своему желанию».</p>\n<p><strong>Куда попадают мёртвые.</strong> Рай — одно из мест назначения после смерти: «вот смотри мы умираем и отправляемся в рай или ад, ну или в минимирок ну это случается крайне редко» (id 278852). Причина такого перемещения названа отдельно: «из за \"смерти\" она после нашей кончины не даёт остаться в нашем мире и вечно отправлять нам куда-то».</p>\n<p><strong>Утечки наружу.</strong> Из Рая не сбегают. В версии 1 это сформулировано через сравнение с Адом: «и вот из \"рай\" по понятным причинам не кто не хочет сбегать, а вот с \"ад\" грешники сбегают» (id 278852). В версии 2 Миколай отдельно спрашивает про ангелов и демонов (id 278945), и на уточняющий вопрос «почему не сбегают» ответ даётся раздельно по двум мирам: «Ангела просто незачем сбегать. А демоны бояться гнева дьявола который и так в бешенстве что сбегают грешники» (id 278954).</p>\n<p><strong>Благословения.</strong> Правитель Рая — один из двух самых щедрых на благословения: «Больше все благословенный даёт бог и дьявол» (id 278941), в отличие от правителей минимиров, которые «довольно редко дают свой благословение». Мотив назван прямо: «В раю много добрых людей и бог име проникся из за этого даёт благословение» (id 278943). Лимит на 2025-01-06: «И бог и дьявол могут дать свой благословение лишь 21 человеку» (id 278944).</p>\n<p>К версии 4 (2025-03-19, id 305856, реплика имитатора) лимит закреплён за Раем как за источником апостолов: «Ты и я апостолы. Это люди получивший благословения от правителя рая. То бишь от второго мира появившейся после кильке. Нас апостолов 21 во всём мире. Нас, именно нас благословенных правителем рая. Больше чем других благословенных другими правителями». Там же — отличие благословений Рая от прочих: «У нас апостолов в отличие от всех. Способность формируется. То бишь у каждого апостола уникальная способность. У других же благословенных одним правителем. Одинаковые способности».</p>\n<p>В версии 6 (id 375849) механизм этого отличия объяснён: «у благословенных правителя рая. Они разные. Так как правитель рая. Посылает им лишь сгустки чистой и необработанной силы, который формируется во что уже только внутри Апостолов. Даруя им уникальные способности». Там же 21 назван потолком: «21 это максимальное число благословения, который способен давать правитель рая. Другие же правители дают меньше».</p>\n<p>Внешний признак использования благословения от правителя Рая — белые глаза: «И его глаза стали белыми. Это был признак использования благословенния правителем рая» (id 305856).</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0095-S02", "MR-0095--naselenie"], "h": "<p><strong>Люди.</strong> «В раю много добрых людей» (id 278943) — это люди, попавшие туда после смерти. В версии 3 Миколай спрашивает, откуда в мирах люди, «способные мыслить», и получает общий ответ: «Там почти в каждом мире есть разумный существа, некоторый похожий на людей некоторый нет» (id 295221).</p>\n<p><strong>Ангелы.</strong> Ангелы названы жителями Рая уже в версии 2 (id 278945, 278954) — в контексте того, что им незачем сбегать. Развёрнутое описание ангела появляется в версии 4 (2025-03-19, id 305855): «Гуманоид, состоящий только из белых перьев. Он был вытянутым. По два метра ростом. У него было две пары рук и две пары крыльев. И вертикальный глаз один. Но он был закрыть. Хаха и нимб у него был. Как в сказках». Боевые свойства из той же версии (id 305856–305858): стреляет перьями из крыльев; при открытии глаза бьёт струёй огня и создаёт вокруг себя пламя, выжигающее всё в радиусе 23 метров; крыло «в этот момент был твёрже железа и острей ножа»; переносит взрыв, «Способный снести здания», но не гибнет от него; крылья при этом отрываются руками, после чего ангел падает и уже ничего не может сделать.</p>\n<p>Оценка ангела дана глазами упыря-рассказчика: «Я уродливый и страшный. Отражения этого тёмного и страшного мира. Защищаю и стараюсь спасти людей. А ангел. Белый и чистый. Лишь убивает» (id 305855).</p>\n<p><strong>Правитель как отдельная сторона.</strong> В версии 3 жители Рая и его правитель разведены: уничтожение мира сделали жители, «сам правитель ничего не сделал» (id 295217).</p>", "r": []}, {"t": "Место во вселенной — как связан с другими мирами", "a": ["S03", "MR-0095-S03", "MR-0095--mesto-vo-vselennoy"], "h": "<p><strong>Общая связь миров.</strong> «Вообще все миры будь то \"рай\" или \"ад\" или минимиры всегда связаны с нашем миров так как наш мир появился первым и является самым большим» (id 278852). В версии 6 связь описана как неотменяемая: «между всеми мирами есть связь, которую не может оборвать не один правитель» (id 375849).</p>\n<p><strong>Наблюдение за нашим миром.</strong> «Опять они вечно наблюдают за нашем миров можно сказать единственное развлечения в их ней бесконечное жизни» (id 278941) — сказано про правителей в целом, включая бога.</p>\n<p><strong>Уничтожение среднего мира.</strong> Версия 3 (2025-02-25, id 295209–295221). Слава спрашивает: «И какой мир уничтожил тот в котором наш гг?», Миколай предполагает «рай?», ответ — «Да» (id 295210–295213). Сразу следует уточнение: «Точнее это были жители рая, сам правитель ничего не сделал» (id 295217). Речь идёт о среднем мире, «который полностью скопировал землю» (id 295209).</p>\n<p><strong>Теория о нападениях.</strong> В версии 4 (2025-03-19, id 305854) от лица жителя технологически развитого мира изложено, что миры разрушаются по одной схеме: «У них разбивалось солнце. И начиналось эпидемия неизвестно болезнью в их нём мире. И это уже в трёх мирах произошло». Отсюда вывод, который в тексте прямо помечен как ненадёжный: «Лишь смогли состряпать теорию. Что все нападения на миры. Были устроены из Рая. Второго мира, который появился после Кильке. Хотя это опять же не точно. Лишь теория. Без стопроцентных фактов».</p>\n<p>Далее в той же версии описано, как это выглядит изнутри: солнце трескается «Словно стекло» и разбивается на миллиарды светящихся кусочков, накрывших 78% суши и 12% воды; осколки шли со скоростью порядка 694 444,44 км/с и замедлились, войдя на орбиту; выжило 17% людей. Затем — вторая волна: «После началось заражение и появление этих зараженных, которых в других мирах называют Пераг».</p>\n<p><strong>Связь Рая с перагами и упырями.</strong> Пераги описаны как «люди, который обрастают белыми перьями. Словно они состоят из чистого серебра. Они становятся похожими на ангелов из мифов. Но лишь похожими. На деле это были чудища. Монстры у которых главная цель убить всё разумной на планете Земля. Падший ангелы» (id 305854). Коэффициент — «23 заражённых на одного человека».</p>\n<p>Про происхождение упырей (это отдельная от перагов группа, «30-40 процентов выживших») сказано двумя равноправными версиями без выбора: «От чего вообще взялись упыри. Это заража из рая. Или это попытка правителя спасти людей. Не знаю» (id 305855) — говорит сам рассказчик-упырь. Какой правитель имеется в виду во втором варианте, в тексте не уточнено; ниже, в сцене с чёрной дымкой, рассказчик думает про правителя своего мира: «Это правитель пытается меня спасти. Отправив в другой мир» (id 305855).</p>\n<p><strong>Ответный удар Рая.</strong> После того как рассказчик в экзоскелете начал уничтожать перагов, «на сопротивление всегда будут отвечать. И рай ответил нам в ответ» (id 305855) — в его дом пришёл ангел и убил тех, кого он защищал.</p>\n<p><strong>Вопрос, ради которого ангела оставляли в живых.</strong> В конце боя (id 305858) имитатор не собирается убивать ангела: «Ему нужны ответы. Почему жители рая устраивают нападения на другий миры?» Ответа он не получает: защитник прогрызает ангелу горло зубами.</p>\n<p><strong>Килька.</strong> Килька названа первым миром (id 305854: «Первым миров считают \"кильку\"»), Рай — вторым. Благословение, по версии 4, доступно только жителям Кильки: «Благословения можеть получать только разумный житель кильке. Первого мира. Не знаю точно с чем это связано. Но это просто факт». В версии 6 то же ограничение повторено, и добавлено, что «всё существа кильке не способны покинуть свой мир. Не каким либо образом», тогда как существа других миров свой мир покинуть могут — ритуалом, прыжком за край мира (для маленьких и средних миров), через пространственную аномалию либо будучи выброшенными самим правителем (id 375849).</p>\n<p><strong>Ад.</strong> Рай и Ад всё время идут парой: вторые по размеру миры (версия 1), два самых щедрых на благословения правителя с одинаковым лимитом в 21 человека (версия 2), два посмертных направления. Отличие — в утечках: из Ада грешники сбегают, из Рая нет.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0095-S04", "MR-0095--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-01-06, окно w0070, id 278852–278868.</strong> Рай вводится вместе со всей картиной миров. Самый большой и первый мир — наш; Рай и Ад — вторые по размеру; ниже — минимиры, которые «чаще всего пытаются копировать нашей мир». На вопрос Миколая «копировать че как и зачем? размеры, культуру, механизмы?» (id 278864) ответ дан не в терминах системы, а примером: «Копировать например кладбище, именной какой-то место в нашем мире» (id 278867). Правитель Рая — бог. Здесь же — правило, что благословение даётся только людям из нашего мира.</p>\n<p><strong>Версия 2 — 2025-01-06, окно w0070, id 278941–278954.</strong> Добавлены мотив и количество: бог проникся добрыми людьми, поэтому раздаёт благословения; лимит — 21 человек, столько же у дьявола. Зафиксировано, что ангелы в наш мир не сбегают, причём по причине, отличной от демонской: им незачем. Миколай в id 278945 высказывает предположение, что «рай и ад миры не совсем зависящие от нашего мира раз там по целый стать худшей или лучшей версией», и после серии коротких ответов Слава помечает: «Первой мимо» (id 278950) — то есть промахом назван первый из вопросов Миколая. Какой именно из его тезисов при этом принят, а какой отклонён, из окна однозначно не вычитывается.</p>\n<p><strong>Версия 3 — 2025-02-25, окно w0077, id 295209–295221.</strong> Рай получает роль в сюжете: именно он уничтожил средний мир, полную копию Земли, — мир, из которого происходит главный герой. Тут же вводится разделение ответственности: сделали это жители Рая, правитель не участвовал. Миколай спрашивает «зачем?» (id 295214) — прямого ответа в окне нет.</p>\n<p><strong>Версия 4 — 2025-03-19, окно w0083, id 305854–305858.</strong> Крупнейшее по объёму состояние. Порядок миров переписан: первый — Килька, Рай — второй, появившийся после неё (прежняя формулировка «наш мир первый и самый большой» при этом сохраняется в речи имитатора, id 305856, и в тексте не снимается). Появляется теория о том, что все нападения на миры устроены из Рая, с прямой пометкой, что это лишь теория. Даётся схема разрушения мира: раскол солнца, затем эпидемия и пераги. Даётся описание ангела как боевой единицы. Устанавливается, что апостолы — это 21 благословлённый правителем Рая, и что благословения Рая, в отличие от прочих, формируются в уникальные способности. Ограничение на получателей благословения переносится с «людей из нашего мира» на «разумного жителя кильке».</p>\n<p><strong>Версия 5 — 2025-03-20, окно w0083, id 306126–306135.</strong> Уточнение по ходу чтения. Миколай: «я думал пераг это ангел», «чел из рая» (id 306127–306128). Слава поправляет: «Н-не. Это заражённый» (id 306130–306131). То есть пераг — не житель Рая, а заражённый человек; сходство с ангелом остаётся внешним. Окно помечено вселенной «вне вселенной».</p>\n<p><strong>Версия 6 — 2025-10-18, окно w0106, id 375843–375852.</strong> Миколай присылает свод правил по мирам и благословениям (id 375849), собранный, по его словам, «только по одному твоему сообщению». Рай здесь фигурирует через своего правителя: правитель Рая — второй появившийся, «Поэтому их мир в разы больше миров других правителей». Добавлены протобионты — дети правителей, созданные самим правителем, а не особенностью мира, с силой, «которая в теории позволит уничтожить континент», при этом «большинство существ спокойный и миролюбивый» и не любят покидать мир родителя; отдельно про детей правителя Рая ничего не сказано. Средняя продолжительность жизни благословенного после получения благословения — 10 лет. Четыре базовых способности всех благословенных: усиленная регенерация, усиление тела и чувств, аура, сенсорика. Апостолам добавлена телепатия между собой. Слава отвечает: «Очень круто», «Делай так» (id 375851–375852). Вселенная окна помечена как «неясно».</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0095-S05", "MR-0095--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Мотив уничтожения среднего мира не объяснён. Вопрос Миколая «зачем?» (id 295214) остался без ответа в окне; тот же вопрос ставит имитатор внутри текста — «Почему жители рая устраивают нападения на другий миры?» (id 305858) — и ответа не получает, потому что ангела убивают до допроса.</li>\n<li>Не сказано, почему жители Рая действуют против других миров помимо воли правителя и знает ли правитель об этом. Расхождение зафиксировано (id 295217), но не разобрано.</li>\n<li>Происхождение упырей оставлено с двумя вариантами и прямым «Не знаю» рассказчика (id 305855): либо «заража из рая», либо попытка правителя спасти людей. Выбор не сделан. Какой правитель имеется в виду во втором варианте, не названо.</li>\n<li>Про источник самой заразы перагов прямого утверждения в переписке нет: в версии 4 заражение идёт второй волной после раскола солнца, а всё вместе связывается с Раем только через теорию, помеченную как неточную.</li>\n<li>Внутреннее устройство Рая — ландшафт, города, быт, как там живут попавшие туда мёртвые — нигде не описано. В окне w0106 отдельного описания устройства мира нет.</li>\n<li>Соотношение «нашего мира» и Кильки не проговорено. В версии 1 первым и самым большим назван наш мир, в версии 4 первым миром названа Килька, причём обе формулировки звучат в одной речи имитатора (id 305856), и прямого приравнивания в переписке не сделано.</li>\n<li>Как именно Рай оказался «вторым по размеру» в версии 1 и «в разы больше миров других правителей» в версии 6 — соотносятся ли эти две шкалы, не обсуждалось.</li>\n<li>Не сказано, что происходит с раздачей благословений после смерти или замены благословлённого: лимит 21 назван, механика освобождения места — нет.</li>\n<li>Серафим числится в списке связанных сущностей, но в приведённых кусках переписки не упоминается ни разу.</li>\n<li>В версии 2 непонятно, какие именно тезисы Миколая приняты: ответ «Первой мимо» (id 278950) относится к первому вопросу, разбора остальных в окне нет.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0095--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0023.html\">Правители (правители миров, правители минимиров)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0095--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-01-06</td>\n<td>278852–278868</td>\n<td>w0070</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-06</td>\n<td>278941–278954</td>\n<td>w0070</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-02-25</td>\n<td>295209–295221</td>\n<td>w0077</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-19</td>\n<td>305854–305858</td>\n<td>w0083</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-20</td>\n<td>306126–306135</td>\n<td>w0083</td>\n<td>вне вселенной (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-10-18</td>\n<td>375843–375852</td>\n<td>w0106</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0095-ray.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0095--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0095.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["MR-0095-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/MR-0095/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — апостолы. Статья делает Рай источником ровно одной вещи, которая работает во всей вселенной: двадцать одного благословлённого с уникальными способностями. Записи под это в наборе нет. Есть <code>SL-0054</code> «Список 12 апостолов» — 234.1 КБ базы, три ссылки, статьи ноль. Это самая большая база во всём наборе и одна из самых цитируемых сущностей без статьи; плюс само имя расходится с числом из статьи (21 против 12), и пока список не разобран, непонятно даже, о том ли счёте речь. Рядом того же рода <code>SL-0053</code> (20.3 КБ, шесть ссылок, статьи нет) и <code>SL-0051</code> (9.8 КБ, шесть ссылок, статьи нет) — реестры, где «Существа» и прочие категории стоят строчками.</p>\n<p>Второе — Серафим. В статье он честно помечен как висящая связь: в приведённых кусках не упоминается ни разу. При этом фигура в наборе собрана, только развалена на четыре части: <code>PS-0209</code> «Серафима» (статья 2.7 КБ), <code>SP-0187</code> «Силы Серафима» (5.2 КБ, одна ссылка), <code>SP-0225</code> «Способности Серафима» (5.1 КБ), <code>GR-0008</code> «Команда против Серафима» (23.1 КБ статьи, базы ноль). Против него собирают пати на 23 КБ, а сам он — самая тощая запись из четырёх.</p>\n<p>Третье, дешёвое: <code>MR-0123</code> «Раскол солнца» — статья 17.2 КБ, ссылок ноль. Схема уничтожения мира (треснувшее солнце, эпидемия, пераги) — главный сюжетный вклад Рая, и на неё отсюда никто не ссылается.</p>\n<h3>С чего начать</h3>\n<p>Не в архив. Своя база выбрана наполовину: статья 26.3 КБ при 54.1 КБ в <code>kb/sushnosti/miry/MR-0095-ray.md</code>. Сначала дочитать собственный исходник — там почти столько же материала, сколько уже перенесено.</p>\n<p>Дальше по соседям, по конкретным записям. Противоречие «наш мир первый и самый большой» против «первой была Килька» разводится не здесь: <code>MR-0207</code> «Килька» (статья 32.3 КБ при 68.9 КБ базы — половина не перенесена) и <code>PS-0217</code> «Правитель Кильки» (14.2 КБ). Механика благословений и что стало с числом 21 — <code>SP-0163</code> «Благословение» (86.8 КБ базы). Правитель отдельно от мира — <code>PS-0279</code> «Правитель рая» (23.1 КБ базы при статье 14.0). Ангел как боевая единица — <code>PS-0233</code> (28.6 КБ базы при статье 16.0). Версия 4 целиком лежит прозой в <code>PR-0061</code> (34.4 КБ), пераги — <code>PS-0199</code> (44.1 КБ базы при статье 19.0), упыри — <code>PS-0231</code> и <code>PS-0232</code>.</p>\n<p>В архив — ровно за двумя вещами. Первое: внутреннее устройство Рая. В шести окнах его нет, и ждать его в базе неоткуда; искать в разрыве между w0083 (март 2025) и w0106 (октябрь 2025) — семь месяцев без единого окна по этому миру. Второе, точечное: в id 375849 Миколай говорит, что собрал весь свод правил «только по одному твоему сообщению». Этого исходного сообщения Славы в источниках статьи нет. Оно должно лежать в архиве до 2025-10-18, и по объёму свода — это большая реплика про мироустройство.</p>\n<h3>Как развивалось</h3>\n<p>2025-01-06 — заявили шкалой: наш мир, потом Рай и Ад, потом минимиры; бог-правитель, благословение только людям нашего мира, лимит 21. В тот же день ограничили: почему из Рая не сбегают, почему ангелам незачем. 2025-02-25 — дали сюжетную роль (Рай уничтожил средний мир) и тут же её ограничили в соседней реплике: сделали жители, правитель не участвовал. 2025-03-19 — переписали основание: первой стала Килька, ограничение по благословению переехало с «людей нашего мира» на «разумного жителя Кильки», нападения приписаны Раю теорией, помеченной как ненадёжная. 2025-03-20 — поправка на полях: пераг не житель Рая. Дальше семь месяцев тишины. 2025-10-18 — вернулись, но не к миру: размер Рая выведен из очерёдности появления правителей, а сам Рай в своде фигурирует только через своего правителя.</p>\n<p>Через все шесть версий держатся ровно две вещи — правитель и число благословлённых. Описание самого мира не приросло ни в одной.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>В версии 6 перечислены способы покинуть мир: ритуал, прыжок за край (оговорено — для маленьких и средних миров), пространственная аномалия, выброс правителем. Для Кильки там же назван прямой запрет: её существа не могут выйти никаким образом. Рай — второй по величине, то есть не маленький и не средний, и оговорка про край его не покрывает; при этом его жители, по версии 3, ходят уничтожать другие миры, а ангел в версии 4 приходит в чужой мир лично. Для Кильки правило выхода названо запретом, для Рая — не названо ни запретом, ни способом.</p>\n<p>Второе место того же рода: для благословения Рая механизм объяснён до конца — правитель шлёт сгустки необработанной силы, форма возникает уже внутри апостола. Для остальных правителей назван только результат: у их благословлённых способности одинаковые. Чем именно они шлют, если не сгустками, — не сказано.</p>\n<h3>Отклик</h3>\n<p>Сильное здесь — «жители рая уничтожили, сам правитель ничего не сделал». Одной репликой мир перестаёт быть монолитом со своим богом наверху: у него появляются граждане с собственной внешней политикой, и бог либо не в курсе, либо не вмешивается — и то, и другое интереснее злодея-бога. Дальше это подпирается тем, что теория о нападениях прямо помечена изнутри как теория: «Без стопроцентных фактов». Автор отказался подтверждать собственный сюжетный поворот — редкий и хороший ход, особенно в тексте, где всё остальное сообщается утвердительно. И хорошо, что вопрос «зачем?» задан дважды, снаружи Миколаем и внутри имитатором, и оба раза не получает ответа: во втором случае потому, что свидетеля убивает союзник. Ангел, у которого один вертикальный глаз, и он закрыт, — тоже точная деталь: пока глаз закрыт, это ещё не бой. И реплика упыря про то, что уродливый защищает, а белый и чистый лишь убивает, работает без нажима, потому что произнесена тем, кого только что чуть не сожгли.</p></div>", "r": []}];</script>
