<script>const BASE="";const DOCNAME="Правители минимиров";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0103-S01", "MR-0103--ustroystvo"], "h": "<p>Минимиры — миры, создаваемые правителями. Помимо Бога и дьявола есть другие правители минимиров, и все они выступают источниками благословений наравне (2025-01-13, id 281365–281379).</p>\n<p>Ключевое утверждение о равенстве: «Сразу всё благословенный равны по силе, путь то благословенный Богом, дьяволом, или другими правителем минимиров» (id 281368). То есть происхождение благословения не влияет на его силу.</p>\n<p>Создание мира стоит энергии, и часть этой энергии правители расходовали на артефакты: «ну правители при создании своих миров периодически тратили энергию на создание артефактов в которых заключали идеи» (id 281371). В артефактах заключены именно идеи.</p>\n<p>Отдельно оговорено свойство благословения: «Благословений это временная сила, типа её нельзя долго сохранять. Например огонь стрельнуть по дереву оно горит, а после отключение благословенной огонь сразу исчезает» (id 281379).</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0103-S02", "MR-0103--naselenie"], "h": "<p>Названы только правители минимиров — как категория, наравне с Богом и дьяволом. Кто они, сколько их и как соотносятся между собой, в переписке не сказано. Устройство самих минимиров дальше не раскрывается.</p>", "r": []}, {"t": "Место во вселенной — как связан с другими мирами", "a": ["S03", "MR-0103-S03", "MR-0103--mesto-vo-vselennoy"], "h": "<p>Запись отнесена к вселенной «Апостол» (по дате объявления), но в самой переписке вселенная не названа. Связана с сущностями «Артефакты», «Благословение», «Благословенные».</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0103-S04", "MR-0103--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-01-13 (окно w0071, id 281365–281379).</strong> Единственное состояние. Разговор начался с вопроса Славы: «А и вот как добавить артефакты в мир?» (id 281365), затем «Артефакты как добавить, типо откуда они появится» (id 281370). Ответом стало объяснение через траты энергии правителей на создание миров.</p>\n<h3>Отклонённый вариант происхождения артефактов</h3>\n<p>Миколай предложил второй вариант через «ИЛИ» (id 281372): «раньше веков 15 назад благословенные были мощее но типа их реже призывали поэтому они оставляли силу потомкам» и «заключали её в артефактах» (id 281373–281374). Тут же сам смягчил: «ну мб про мощь убрать можно» (id 281375), и переформулировал мотив: «просто думали что благословенных больше не будет и заботились о будущем» (id 281376), закончив «хз» (id 281377).</p>\n<p>Прямого выбора между двумя версиями в переписке нет. В навигационную сводку записи вошёл первый вариант (энергия правителей), второй остался предложением.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0103-S05", "MR-0103--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вселенная в переписке не названа.</li>\n<li>Устройство минимиров дальше не раскрывается: как выглядят, чем отличаются друг от друга, сколько их — не сказано.</li>\n<li>Не сказано, кто такие «другие правители минимиров» помимо Бога и дьявола.</li>\n<li>Не сказано, что такое «идеи», заключённые в артефактах, и как они из артефакта извлекаются.</li>\n<li>Второй вариант происхождения артефактов (наследие благословенных 15 веков назад) не принят и не отвергнут явно — осталось нерешённым.</li>\n<li>Как временность благословения (id 281379) соотносится с артефактами, в которых сила заключена надолго, не обсуждалось.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0103--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0023.html\">Правители (правители миров, правители минимиров)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0103--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-01-13</td>\n<td>281365–281379</td>\n<td>w0071</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0103-praviteli-minimirov.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0103--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0103.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["MR-0103-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/MR-0103/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — «идеи». Вся конструкция записи держится на том, что правители тратили энергию и заключали в артефакты именно идеи, а под самим этим словом записи нет. Оно фигурирует замыкающим пунктом сразу в трёх служебных реестрах, и все три — без статьи, при самой высокой цитируемости во всём наборе: <code>SL-0051</code> (шесть ссылок, 9.8 КБ), <code>SL-0053</code> (шесть ссылок, 20.3 КБ), <code>SL-0090</code> (четыре ссылки, 5.5 КБ). Ни одна другая незакрытая сущность столько ссылок не собирает. Пока «идеи» не расписаны, ключевое утверждение этой статьи остаётся словом без содержания.</p>\n<p>Вторая по цене — правитель как источник силы. <code>SP-0240</code> «Благословение правителя» (9.8 КБ) и <code>SP-0242</code> «Уникальная способность правителя» (9.6 КБ) — материал есть, статей нет, вселенная у обеих не определена. Это ровно те две записи, на которых должно стоять утверждение о равенстве благословений.</p>\n<p>Третье, помельче: сам счёт правителей нигде не сведён — <code>MR-0120</code> (35 КБ), <code>PS-0278</code> (26.8 КБ), <code>MR-0097</code> (9.6 КБ) говорят об одном, а «сколько их» не сказано ни в одной.</p>\n<h3>С чего начать</h3>\n<p>В базе. Артефакты разъехались на четыре записи со статьями: <code>SP-0047</code> «Артефакты» (24.9 КБ) — основная, плюс <code>SP-0192</code> «Артефакт-медиатор», <code>SP-0229</code> «Артефакты с символикой», <code>SP-0212</code> «артефакты апостолов». Про временность силы — <code>SP-0163</code> «Благословение», 86.8 КБ, самая толстая запись по теме; там же, скорее всего, лежит и то, чего не хватает про соотношение временного благословения с постоянным артефактом. Минимиры — <code>MR-0094</code> (12.5 КБ).</p>\n<p>В архив — за отклонённым вариантом. Второй вариант происхождения артефактов оборван на «хз» в id 281377, и в этом же окне w0071 надо смотреть, не всплыл ли он позже: январь 2025, диапазон id 281365–281379 и всё, что идёт после него в том же окне. Заодно там же ищется объявление вселенной — в самой переписке она не названа.</p>\n<h3>Как развивалось</h3>\n<p>2025-01-13, одно окно, и внутри него весь ход. Заявили в ответ на прямой вопрос «как добавить артефакты в мир» — через траты энергии правителей. Тут же в том же окне возник второй вариант через «ИЛИ», и автор предложения сам его ограничил («ну мб про мощь убрать можно»), переформулировал мотив и свернул на «хз». Выбора между версиями не произошло; в сводку вошла первая. Возвратов к теме в материале записи нет.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Равенство названо на нижнем уровне: благословенные равны по силе, кто бы их ни благословил — Бог, дьявол или другой правитель. Про сам верхний уровень такого правила нет: равны ли между собой правители, стоят ли Бог и дьявол наравне с прочими или просто перечислены рядом. Для производной силы правило равенства сформулировано, для источников — нет.</p>\n<h3>Отклик</h3>\n<p>Мне нравится, что весь мир здесь вырос из бухгалтерского вопроса «откуда взялись артефакты». Ответ получился неожиданно скупой и хороший: артефакт — это не награда и не реликвия, а остаток от расхода, побочный продукт стройки. Правитель делал мир, потратился, и то, что осталось от траты, лежит теперь предметом. И вторая деталь — в артефакт заключают идею, а не силу; сила, как сказано отдельно, вообще не хранится, огонь гаснет вместе с благословением. Получается, единственное, что в этом мире умеет длиться, — идея. Не думаю, что это было задумано как система, но оно сложилось. Оборванное «хз» на втором варианте тоже, кстати, оставлено в статье, и правильно: видно, где мысль кончилась.</p></div>", "r": []}];</script>
