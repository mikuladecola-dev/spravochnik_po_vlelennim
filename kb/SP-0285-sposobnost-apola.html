колай: я ща с ещё гляну\n```\n\n### Версия 4 — 2026-07-14\n\nвселенная: неясно (по дате объявления) · окно w0122 · сообщения 502785–502799\n\n*что здесь: Финальное решение автора: концепция души — за Аполом вечно следуют верные души его питомцев, а он создаёт им тела. М согласился, что этого достаточно.*\n\n\n\n```chat\n[502785] 2026-07-14 15:03 Слава: Нихуя себе да он сильнейшего в современности отпиздил без способности.\n[502786] 2026-07-14 15:03 Миколай: Так это легко развести — сделай Апола принципиальной противоположностью этих троих:\n\nОни творцы, Апол — завоеватель. Био-реконструкция делает жизнь из мёртвого/неживого — армия из ничего. Апол же *ничего не создаёт с нуля*. Он работает только с тем, что уже живёт. Его сила — не творение, а власть над живым. Убери из его набора «создание» как отдельную способность — сшивание химер оставь, но подай это не как создание жизни, а как *переплавку уже покорённых* (он не даёт жизнь, он распоряжается чужой).\n\nТогда контраст становится фишкой мира:\n- Те трое штампуют армию быстро и из мусора — но их твари безликие, новорождённые, без опыта.\n- Апол собирает армию медленно, каждый зверь — завоёванный лично. Зато его звери — ветераны с историей, прокачанные, уникальные. Качество против количества.\n\nИ можно добавить жёсткое правило, которое их разводит окончательно: Апол не властен над созданной жизнью. Тварей био-реконструкции он приручить не может — они «фальшивые», в них нет дикой души. А те трое не могут воспроизвести его зверей — потому что нельзя реконструировать тысячелетний опыт и верность.\n\nПолучается даже готовый конфликт: армия творцов против армии пастыря, и ни один не может украсть силу другого. При встрече это война двух философий — «жизнь можно сделать» против «жизнь можно только взять».\n\nТак похожесть превращается в зеркальность, а это уже не плагиат, а дизайн. Норм направление, или у друга те трое — союзники Апола и конфликт не нужен?\n[502787] 2026-07-14 15:04 Слава: Так я не просто так называю его Богом прошлого\n[502788] 2026-07-14 15:05 Миколай: Ааа, окей, тогда я недооценил масштаб — беру слова назад. Если он голыми руками избил сильнейшего современности, то баланс через «слабого пастыря» вообще не подходит.\n\nТогда логика переворачивается, и это даже круче: звери Аполу не нужны для силы — они нужны, потому что он завоеватель по природе. Его армия — не костыль, а коллекция трофеев Бога прошлого. Каждый зверь — памятник победе. Дракон — не транспорт и не щит, а знамя.\n\nИ тогда баланс надо искать не в слабости, а в другом месте:\n\nЦена эпохи. Он Бог *прошлого*. Его легендарные звери — существа вымерших эпох, и новых таких уже не появится. Каждая потраченная на химеру душа, каждая безвозвратная ставка — это невосполнимо. Он сильнейший, но его сила конечна как музей: разграбить можно, пополнить — нечем. Современный мир мельче, и приручать в нём почти нечего достойного.\n\nОграничение по оам. Раз призыв и воскрешение зверей жрут оам — вот честный лимит. Сам он может быть непобедим в кулачном бою, но развернуть всю армию Бога прошлого разом — расход, который даже он не тянет долго.\n\nТо есть формула: лично — почти непобедим, армия — абсолютна, но невосполнима и дорога в развёртке. Он не боится проиграть бой, он «боится» тратить вечное на смертных — отсюда и его безразличие, и то, почему он не стирает всё подряд.\n\nКстати, это красиво стыкуется с «отпиздил без способности»: ему *западло* тратить трофеи тысячелетий на современников. Звери выходят только против того, кого он признал достойным. Такой выход армии — сам по себе высшая честь и приговор одновременно.\n[502789] 2026-07-14 15:05 Слава: Можно реализовать концепцию души, типа за ним вечно следует верный души его там питомца и питомца и он просто способен будет создавать им тела.\n[502790] 2026-07-14 15:05 Слава: ?\n[502791] 2026-07-14 15:05 Слава: Норм?\n[502792] 2026-07-14 15:05 Миколай: да, более чем\n[502793] 2026-07-14 15:06 Миколай: если считаешь что достаточно то норм\n[502794] 2026-07-14 15:0
