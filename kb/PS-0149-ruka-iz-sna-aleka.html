<script>const BASE="../";const DOCNAME="Рука из сна Алека";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Рука из сна Алека\n\n*персонаж* · вселенные: монстры\n\n## Навигация\n\n- (w0054) Преследователь из сна Алека: в непроглядной темноте за ним гонится рука. Её касание не причиняет боли, а ощущается как холодное прикосновение прямо к сердцу; во сне время идёт как наяву, усталость и одышка настоящие.\n\n## Связано с\n\nАлек\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-08-21\n\nвселенная: монстры (по дате объявления) · окно w0054 · сообщения 222143–222143\n\n*что здесь: Появление и правила: образ возник подсознательно, касание вне кожи, реальное течение времени и физическое истощение во сне.*\n\n\n\n```chat\n[222143] 2024-08-21 22:00 Слава: Здравствуйте ну или привет, а блин ладно здорова. Я чел которому не повезло или наоборот повезло это как смотреть. Ну ладно звать меня Алек. Студент 4 курса. Живущий в свое однокомнатной квартире. Парень я вроде не плохой. Жил не тужил до одного дня. Решил я передохнуть от учебы в субботу. Ну на голодной желудок как то не отдыхается. И решил сходить в ресторанчик рядом с моим домом. Ну пошел, заказал  какой-то супчик, честно слово не помню, у нее какой то названия странная. Ладно не суть. Вот сижу хаваю. Как замечаю что на меня кто то зырит, вот буквально зырит, пожирает взглядом. Смотрю, а там ниче себе модможелей, ну на 20. И как бы чё делать как да на тебе красивая баба смотрит. Не знаете. Вот и я не знаю, и как еблан продолжил кушать. Сижу почевкаю супом, как вдруг эта модмажель подсел ко мне.  Ну здесь я вообще полностью приболдел. Ну быстро успокоившись, начал активничить. Ну и вот мы разговорились как она предлагает пойди ко мне домой. Ну здесь мне слегка сыкотной стало, как бы ко мне подсела красивая деваха и предлагает пойди ко мне домой, ну как бы не пойдут ли случайно снами какие нибудь анбалы. Ну она так играла на эмоциях, что я согласился. Да-да глупо, и не буду оправдываться я ебучий кретин не понимающие ситуаций. Ладно вот пришли ко мне, и вот здесь странность произошла когда я дверь открывал и здесь темень, не не то бишь в глазах, а в памяти не фига не помнил. Очнулся голым на кровать, а на тумбочки записка с извинением и о оповещения что она выбросила мусор. И конечно же я не совсем дебил, и понимал, что здесь что то не так. Ну как бы так не бывает что ты без алкоголя без наркоты вдруг теряищи воспоминания. Я сразу начал проверять все ли на месте, ну вроде бы все кроме мусора. Ну блинон который были на столе. После всей этой проверки я по настоящему испугался типо может что со мной не так, как бы люди просто так не теряют память. Ну и поэтому я прошёлся по некоторым докторам. Когда все сказали что со мной всей окей, забил на это, как бы а чё париться, раз сам врач говорит, что все ок. Ну  и вроде бы все было хорошо пару дней. Пока на 10 ночью после потери памяти. Мне не приснился сон, где я в непроглядной темноте бегу от руки. Ну вроде бы сон как сон. Но нет, я понял что это не сон когда это ручищя дотронулась до меня. Нет я не почувствовал боли. Я почувствовал, что куда странней, это ощущалась не как прикосновения к кожи, это сука ощущалась как та не понятно. Но при этом пугающий. Словно холодной рукой притронулись к моему сердцу. Это сука не романтично. Это страшно, что каждую клетка моего тела тряслась. И конечно же я стартонул как олимпиец. И вот ещё одно доказательство, что это не просто сон после 8 минут такого бега я был готов лёгкий выплюнуть. Я задыхался дыша. Вот вообще не приятно чувство тем более во сне. Но перекупить мне не дали, и вот рука снова близка и мне нужно снова бежать. Откуда я вообще взял что это рука не знаю, как то подсознательно представил этот образ. Вот бегу я всю ночь, и вот ещё одно доказательство во сне время шло как не во сне. То бишь для меня это длилась и правду всю ночь. Проснувшись весь в поту, и еле дыша побежал на кухню, что бы хлебнуть такой долгожданной водицы, а после ванну умываться. Вот сейчас стою и думаю и что дальше ведь это явно не сон, да и я совсем не тупорылый и понимаю, что это не сон, где со мной ничего не будет.\n```\n\n## Неясности\n\n- (w0054) Природа существа и связь с потерей памяти не раскрыты.</div>"}];</script>
