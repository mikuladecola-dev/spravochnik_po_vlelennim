<script>const BASE="../";const DOCNAME="Гигантский младенец";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Гигантский младенец\n\n*персонаж* · вселенные: неясно\n\n## Навигация\n\n- (w0111) Младенец невероятных размеров, который проплывает над лесом и смотрит на Софию усталым, знакомым и одновременно далёким взглядом. [387597–387599].\n\n## Связано с\n\nВедущий, Отец ведущего, София\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-11-21\n\nвселенная: неясно (по дате объявления) · окно w0111 · сообщения 387597–387599\n\n*что здесь: Появление на поляне в конце череды воспоминаний; после него мир рассыпается в дым, а из тьмы вылезает огромный рот, говорящий голосом ведущего.*\n\n\n\n```chat\n[387597] 2025-11-21 18:19 Слава: И вновь отворив глаза. Она поняла, что находится в больничной палате. На койке для пациента лежала женщина. А рядом стоял мужчина, который считал себя военным. Он что-то нежно держал у себя в руках. На лице его выступали слезы. Но они слезами радости. Его губы дрожали. И он крепко, но нежно держал свёрток. Оранжевый свет заката пробивался через окно и ложился на мужчину. И это картина была красивой, нежной и изысканной. \nСофия же чуствовало, как в груди чтото разрывается, ломается на маленький кусочки. Она дрожала всём телом. В таком биению безумного сердца. Она начала задыхаться и схватившись за грудь. Едва сдерживала приступающий слезы. Не слезы радости подобный слезам, что ронял мужчина. Это были слезы обиды, отчаяния и неверия. \nВ её горле засел ком. Он застрял и не давал выдавить слова. \nСвёрток начал издавать звуки. Сначала неуверенный. Но с каждой секундой всё более громкий. Это был детский крик. У мужчины не сдвинулась не одна скула. Он лишь нежно улыбнулся и спокойно и медленно начал покачивать свёрток. \nСофия же захотела блевануть. Не как такая картина не складывалось у неё. \nДа и она ожидала, что получит здесь избиения или ей снова придеться бежать. Но она не готовилась тому, что сердца взорваться от горечи. А лёгкий заполнит обида. А в голове будет маленькая никчёмная желания. От которой ей самой становиться противно. &quot;Я хочу тоже так&quot; &quot; Почуствовать отцовскую любовь&quot;\nОна пыталась их гнать. Но они засели словно паразиты и разьедали разум Софии. \nСофия упала и начало ползти назад. Она не желала здесь больше быть. Не желала этого видеть. Оно отвернула голову зажмурив глаза. Пытаясь так попасть на новую сцену ужаса. Но ничего не выходила. Она до сих пор чуствовало холодный пол. И запах хлорки. А свет до сих пор  бил по закрытам глазам. \nСофия прикусила губу. И начало считать до десяти. Она вспоминала песни, стихи. Лишь бы забыть. \nНо кто резко холодными руками схватил голову девочке и повернул в сторону мужчины. А после последовал холодный шёпот. Холод этого шёпота София ощущала физически\n-открой глаза- говорил ведущий. Но София не хотела его случаться. Не хотела отворять глаза. Но глаза предали ее. И отворились. София пыталась их снова закрыть. Но не выоходила.София ощутила свою бессилия и её глаза начали облеваться слезами. Они заревела из-за отчаяния и бессилия. \n-зачем... К чему это всё? - недоумевал София. Она правда не понимала зачем всё это? \nВедущий устало вздохнул. Его явно что-то бессила. Но он не говорил что. \n-ты правда не понимаешь?- спросил он Софию. Развернув её лицо к себе. Та же покачали головой влево и вправо. Давая понять, что она ничего не понимает. \nВедущий отпустил её голову и отошёл. Хоть он ничего не сказал. Но София ощутила некая разочарование на лице ведущего. \n- ты так и не спешишь оправдать своё имя- то ли спросил, то ли сказал ведущий. \n-сколько ещё мне надо показать, чтобы ты всё поняла! - вдруг сорвался ведущий. Топая ногой от пол. Он быстрым шагом подошёл к мужчине. И ударил его. Тот же просто разлетелся как дым. Ведущий выдохнул и продолжил \n-ну да ладно. В конце вы всё всё равно всё понимаете- сказал ведущий. Подходя к Софии и дотронувшись лба девочки. Развернулся \nА вот у Софии всё поплыло перед глазами. Нет это сам мир поплыл. И всё краски превращались в одну политру. Словно старался и собирался снова. Оранжевый свет солнца. Сгустил в прямоугольный предмет. Белый стены стали похожи на цвета. А цвета громатского мужчины и женщины. Сконцентрировались на образе мальчика лет пяти. Но что-то странное было в этом образе. Какой то цвет нарушал всю картину. \nЭто был яркой красный цвет. Цвет, что был на оранжевым прямоугольники. И на голове мальчика, который лежал без движения. Зелёная травка шевелилось такт ветру. И лишь сейчас София поняла, что кирпич в крови. Кирпич, который держат она своими руками. А сам мир давно перестал плыть. Это зрения девочки помутилось из-за слез. И мальчик, что лежал без движения на траве. Был похож, чуть ли не копии мужчины, что бил её. Ком, что застрял в горле. Вдруг стал мягким и податливам. И выскочил вместе жидкостию из желудка.\n[387598] 2025-11-21 18:19 Слава: София упала на колени и не могла сдержать накотившую рвоту. А в мыслях у неё была каша. Из непонятных воспоминаниях и чувств. Она уже не знала, где правда, а где лишь жалкая иллюзия. Да если бы знала. То точно содрогнулась бы. \nВдруг эхом раздался треботельное слова -беги-беги-беги-беги- раздавалось эхом, как будто бы в голове Софии\nСофия не выдержала и поднявшись побежала. Она бежала без оглядки. И почему то до сих пор держа в руке кирпич. Она бежала сквозь лес. Сквозь тьму. Ветки били в глаза желая остановить девочку, а земля дрожала. Но она до сих пор чуствовало тела. Поэтому бежала, как можно дальше от яркой красной политры. \nБред пожелал её, а разум пытался защититься. Она бежала словно в лихорадки. Она видела, как проносились воспоминания, мечты и желания. Горечь, одиночества и мысли. Они словно врезались в бежавшую Софию. Проникая в разум и занимая там место. Она вопила или это было в воспоминаниях. Дышатли она и это воспоминания. Она не знала. Она даже не знала бежит ли она до сих пор. Или это иллюзия или прожитая события. \nОна не понимала. Пока над головой не проплыло, что-то большое. София поняла, что это не может быть воспоминаниям. Не может же быть в воспоминаниях, что-то такой огромное. \nСофия попыталось остановится. Но из-за инерции не смогла устоять на ногах. Она быстра покатилось по земле. А палки и камни безпощадно втыкались в маленькое тельца. Вызывая у Софии не произвольные слезы. \nДевочка катилось. Пока не остановилась на полянке. Она лежала на спине и прекрасно видела. Младенца с невероятными размерами. Он смотрел на Софию. Хоть взгляд его был уставший. Но в этом взгляде читалось. Что-то еще. Что-то знакомое, но при этом далёкая. \nСофия прищурилась. Пытаясь понять, что же понял разум, что не поняла она. \nСофия так была увлечена этим деянием. Что только сейчас заметила, как земля, деревья и даже превращались в дым. Медленно, словно давая девочки попытаться побороться. \nНо девочке не шевельнулось. Даже не вздрогнула. Она лежала и желал лишь одного не слышать. Этот смех безумца. Что доноситься сейчас. Но почему то этот смех не был похож на ведущего. Смех был более писклявым что-ли? \nДевочка завертела глазами. Она желала увидеть смеющего над ней ведущего. Но его не было. \nАбсолютно нигде. София задрожала. &quot; Откуда тогда этот смех? &quot; Проносились в мысле, в голове. Но София знала ответ. Он был очевиден. \nЭто был её смех. Смех безумного человека, который уже устал, и в конце концов запутлся в том, что здесь происходит. \nЭтот смех был искреннен. Возможно самый искренний за всю её жизнь. Коль такова была вообще. \n-тише..... Тише. Успокойся. Нам ещё далеко до безумия- произнёс ведущий успокаивающим голосом. И софия злилось на, то что голос ведущего её правда успокаивал. \nМир померк в темноте. И можно лишь гадать из-за чего мир померк. То ли от усталости Софии, то ли ведущий опять сотворил чудо. \n\nИ в этой тьме. Вылез рот, огромный. Он был бы способен поглотить Софию. Но он лишь сказал \n- и так моя без именная София. Дашь ли ты мне ответ или снова заставишь разочароваться. Я устал с тебе показывать. Устал с того, что ты так и не поняла. Так скажи- прорычал рот в лицо Софии. А София даже не сдрогнула. И отвечать она также не собирается. Пусть страдает ей, то что. \n-София- прорычал голос ведущего. И София отворив глаза. Снова почуствовали своё тело. Настоящее тело. Она чуть не прыгнула от радости. Но почуствовал на лице маску. Резким движением сняла ее. И кинула в сторону. \nВедущий опять появившийся из не откуда. Ловко поймал маску. \nНа лице ведущего не было улыбки или гнева. Лишь разочарование. \nСофия отпрыгнула от неожиданно появившегося ведущего. \nОна уже встала в оборонительную стойку. Готовая биться даже на смерть. \n- я дам тебе две подсказки- сказал ведущий смотря на маску. \n- нет мне не надо. Себе оставь- протороторилп София \nНо ведущий её словно не услышал и начал говорить. \n- знаешь есть много того, чего я могу сделать. Легче будет перечислить, того чего я не могу. А не могу я контролировать чувства и эмоции, а также влиять на эмоций или воспоминания в твоей голове-\n[387599] 2025-11-21 18:19 Слава: Пятая\n```\n\n## Часть чего\n\nВедущий\n\n## Неясности\n\n- (w0111) Связь с младенцем из больничной палаты и с убитым кирпичом мальчиком напрашивается, но прямо не сказана.</div>"}];</script>
