покойствия. Конечно даже в нашем мире есть момент где вера показана плоха. Но там больше людей используют религию в своих корыстных целях. Или религия слишком сильная. Ну то есть например фрукты, овощи, сладости это неплохие вещи, ничего в мире нет плохо если это в меру. Но вот если обожраться морковкой, яблоками, шоколада, по нескольким килограммам за раз то конечно это плохо повлияет на организм. И здесь и про религию, религия хорошо в меру, как и все другое.\n```\n\n### Версия 2 — 2026-07-26\n\nвселенная: неясно (по дате объявления) · окно w0122 · сообщения 511428–511463\n\n*что здесь: Ответ М и уточнение: имя персонажа тут ни при чём, речь про персону/образ религии.*\n\n\n\n```chat\n[511428] 2026-07-26 12:16 Миколай: я тоже не особо верю\n[511429] 2026-07-26 12:17 Слава: .\n[511430] 2026-07-26 12:17 Миколай: но такого я не думаю\n[511431] 2026-07-26 12:17 Миколай: мне не особо надо\n[511432] 2026-07-26 12:17 Слава: Вау кто здесь живой\n[511433] 2026-07-26 12:18 Миколай: ну в такое тоже не сказать что верю сейчас, но какое-то время назад было\n[511434] 2026-07-26 12:18 Миколай: сейчас на чистом интересе иду, нежели на вере\n[511435] 2026-07-26 12:18 Миколай: ну может\n[511442] 2026-07-26 12:19 Слава: Смотри какой худой\n[511447] 2026-07-26 12:19 Миколай: ...\n[511449] 2026-07-26 12:19 Миколай: капец\n[511455] 2026-07-26 12:21 Миколай: это да, это есть\n[511456] 2026-07-26 12:21 Миколай: это да\n[511457] 2026-07-26 12:22 Миколай: персону?\n[511459] 2026-07-26 12:22 Миколай: у тебя перса зовут религия?\n[511461] 2026-07-26 12:23 Слава: .\n[511462] 2026-07-26 12:23 Слава: Нет\n[511463] 2026-07-26 12:23 Слава: Персона\n```\n\n## Неясности\n\n- (w0122) Неясно, идёт речь о фракции, о персонифицированном образе или просто о теме в материале: обмен 511457-511463 отрицает, что это имя персонажа, но чем именно является «персона», не поясняет.</div>"}];</script>
