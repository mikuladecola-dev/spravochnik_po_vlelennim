88] 2024-06-21 10:37 Слава: Да\n[185089] 2024-06-21 10:37 Миколай: У меня будет костяной\n[185090] 2024-06-21 10:37 Миколай: Эм\n[185091] 2024-06-21 10:38 Миколай: Да\n[185092] 2024-06-21 10:38 Слава: Добавим ещё один стать меткость\n[185093] 2024-06-21 10:52 Слава: Имя: сталкер ( ну кличка)\nЛюбит: сладкая и травяной чая \nНе любят:  поломку оружия \nСила: 6\nСкорость: 7\nЛовкость: 8\nМеткость: 10\nВыносливость: 6\nКонтроль: 8\nОружие: снайперская винтовка; 2 пистолета; нож армейский \nИнструмент: глаза ( тепловой видение ) \nВнешность: мужчин лет 40 в маске( виде кибер маски, ты поймёшь надеюсь) на все лицо; в плаще, а под ним черная, серая форма \nСпособности: огонь \nПриемы:\n1. Огненная пуля: его снайперская винтовка и пистолеты особой оружея под него у них нет патронов, он сам делает их с помощью огня и стреляет ими из оружия при попадания взрывается \n2. Огненненый цепи (из ладони) : может из огня сформулировать цепь и контролировать его на расстояний, защищаясь ими или атакуя, или делать как\n человек паук \n3. Подземный ад: прижимает руки к землёй, и из земли в радиусе 100 метров вырывается огненненый колы, протыкая противника \nЧерты характера; спокойный, хладнокровные; не питает не кому ненависти, но убивает по заказу\n[185094] 2024-06-21 10:52 Слава: Внешность\n[185095] 2024-06-21 10:52 Слава: Добавь\n```\n\n### Версия 2 — 2024-07-03\n\nвселенная: 7 островов (объявлено) · окно w0041 · сообщения 194785–194794\n\n*что здесь: Третьим в списке защитников от М идёт «тот пламенный перс»; С уточняет, что речь про сталкера, и что он уже наёмник.*\n\n\n\n```chat\n[194785] 2024-07-03 19:06 Миколай: 1. блуждающий огненный гриб\n2. дриада великан\n3. тот пламенный перс\n4. юкиона с миниганом в котором снаряд сосульки\n[194791] 2024-07-03 19:08 Слава: А\n[194792] 2024-07-03 19:08 Слава: Или ты про сталкера ?\n[194793] 2024-07-03 19:08 Миколай: ага\n[194794] 2024-07-03 19:08 Слава: Ну можно, ну он уже наемник хотя можно\n```\n\n### Версия 3 — 2024-07-03\n\nвселенная:
