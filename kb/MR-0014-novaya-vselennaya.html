-06-17 19:13 Слава: И понимания сверх людей там будет меньше. Некоторый просто оружием хорошо махають\n[183024] 2024-06-17 19:14 Слава: И надо как то из всего этого собрать конфетку\n```\n\n### Версия 2 — 2024-06-17\n\nвселенная: 7 островов (по дате объявления) · окно w0038 · сообщения 183025–183035\n\n*что здесь: уточнение терминов: артефакт не может быть создан в настоящем, иначе это просто инструмент/орудие; список форм инструментов (оружие, украшения, предметы быта, книги, реликвии, артефакты-существа, сооружения), Слава сводит к аксессуарам, холодному и огнестрельному оружию*\n\n\n\n```chat\n[183025] 2024-06-17 19:34 Миколай: Так\n[183026] 2024-06-17 19:34 Миколай: Короче\n[183027] 2024-06-17 19:34 Миколай: Артефакты не могут создаваться в настоящем\n[183028] 2024-06-17 19:34 Миколай: Иначе они таковыми не считаются\n[183029] 2024-06-17 19:35 Миколай: То есть это просто будет ну орудие , может сильное. Инструмент, но не артефакт\n[183030] 2024-06-17 19:36 Слава: Ну инструмент\n[183031] 2024-06-17 19:37 Миколай: Ок, а то я предполагал что они остались от прошлого, где были небоскрёбы\n[183032] 2024-06-17 19:39 Миколай: Ну для начала идеи форм этих инструментов(не обращай что написано артефакты):\n\nОружие (мечи, кинжалы, посохи, луки, доспехи и т.д.)\n\nУкрашения (кольца, амулеты, ожерелья, диадемы)\n\nПредметы быта (чаши, кубки, вазы, сундуки, свитки)\n\nМагические книги, свитки, свитые из драконьих чешуек\n\nРеликвии (части тела мифических существ, осколки древних артефактов)\n\nАртефакты-существа (живые големы, драконы, феи, духи)\n\nАрхитектурные сооружения (древние башни, руины, подземные храмы)\n[183033] 2024-06-17 19:41 Миколай: Ну как я понял мир похож на мир вселенной аниме &quot;нет игры нет жизни&quot; где боги тож хуету наделали\n[183034] 2024-06-17 19:42 Слава: Аксессуары, холодное оружие, огнестрельное\n[183035] 2024-06-17 19:42 Миколай: Ок\n```\n\n### Версия 3 — 2024-06-17\n\nвселенная: 7 островов (по дате объявления) · окно w0038 · сообщения 1830  (по дате объявления) · окно w0038 · сообщения 183113–183147\n\n*что здесь: уточнения: магии нет, огнестрел, сверхлюди умеют уклоняться и отражать, оружие почти уникальное и зависит от носителя; сомнение про баянистость связки апокалипсис+магия+оружие*\n\n\n\n```chat\n[183113] 2024-06-17 20:26 Миколай: Я поиграл с самим собой в стрелялки в ограде\n[183114] 2024-06-17 20:26 Миколай: Это прикольно\n[183115] 2024-06-17 20:26 Миколай: Но чет хз даже, это для сюжета то скучно будет\n[183116] 2024-06-17 20:27 Миколай: Ибо ну часто такую концепцию юзали, не?\n[183117] 2024-06-17 20:27 Слава: Я вообще не понял\n[183118] 2024-06-17 20:27 Миколай: Типа\n[183119] 2024-06-17 20:27 Миколай: Апокалипсис\n[183120] 2024-06-17 20:27 Миколай: Магия\n[183121] 2024-06-17 20:28 Миколай: Оружие\n[183122] 2024-06-17 20:28 Миколай: Баян же?\n[183123] 2024-06-17 20:28 Миколай: Типо огнестрел это пистолеты и автоматы?\n[183124] 2024-06-17 20:28 Миколай: Или ты о другом?\n[183125] 2024-06-17 20:28 Миколай: Тогда зачем способности?\n[183126] 2024-06-17 20:29 Миколай: А оружие единственное в своём роде, подстроенное под носителя\n[183127] 2024-06-17 20:29 Миколай: Я так понял\n[183128] 2024-06-17 20:29 Миколай: Так как оно выглядит. Оно типа настоящее или с элементами магии\n[183129] 2024-06-17 20:30 Слава: Сверхлюди который могут уклоняться или отражать \nОружие ну почти уникальная\n[183130] 2024-06-17 20:30 Миколай: Мол стреляет способностью\n[183131] 2024-06-17 20:30 Миколай: Почти\n[183132] 2024-06-17 20:30 Миколай: Хмм\n[183133] 2024-06-17 20:30 Слава: Бля\n[183134] 2024-06-17 20:30 Миколай: Ааа, пон про людей\n[183135] 2024-06-17 20:30 Слава: Подожди пять сек\n[183136] 2024-06-17 20:30 Миколай: Магии нет\n[183137] 2024-06-17 20:30 Миколай: Без б\n[183138] 2024-06-17 20:30 Слава: Зависит от носителч\n[183139] 2024-06-17 20:31 Миколай: Так наху\n[183140] 2024-06-17 20:31 Миколай: Типа\n[183141] 2024-06-17 20:31 Миколай: Я понимаю что сложно\n[183142] 2024-06-17 20:31 Миколай: Но попробуй\n[183143] 2024-06-17 20:31 Миколай: Объяснить\n[183144] 2024-06-17 20:31 Миколай: Хотя б одного носителя\n[183145] 2024-06-17 20:32 Слава: Сейчас попозже опишу я сейчас картошку чишу\n[183146] 2024-06-17 20:32 Миколай: Хорошо, без проблем\n[183147] 2024-06-17 20:32 Миколай: Я ещё покумекаю\n```\n\n### Версия 6 — 2024-06-17\n\nвселенная: 7 островов (по дате объявления) · окно w0038 · сообщения 183231–183240\n\n*что здесь: богов во вселенной не будет; способности есть не у всех людей*\n\n\n\n```chat\n[183231] 2024-06-17 21:52 Миколай: Ну или бога\n[183232] 2024-06-17 21:52 Миколай: Типа это богу на пользу\n[183233] 2024-06-17 21:52 Слава: Нет богов не будет\n[183234] 2024-06-17 21:53 Миколай: Он не хочет чтобы мир был уничтожен, поэтому с рождения сдерживает силу таких неполноценных\n[183235] 2024-06-17 21:53 Миколай: Ну\n[183236] 2024-06-17 21:53 Миколай: Ладно\n[183237] 2024-06-17 21:53 Слава: Все\n[183238] 2024-06-17 21:54 Слава: Более полная концепция \nСила разрушает хозяина а инструмент останавливает это разрушение\n[183239] 2024-06-17 21:54 Слава: Вот\n[183240] 2024-06-17 21:55 Слава: В своем прошлом предложение было слишком но а сейчас из стало поменьше\n```\n\n## Неясности\n\n- (w0038) имя вселенной в чате не названо — только «новая вселенная»</div>"}];</script>
