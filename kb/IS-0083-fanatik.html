<script>const BASE="../";const DOCNAME="Фанатик";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Фанатик\n\n*история* · вселенные: Феня\n\n## Навигация\n\n- (w0113) Исекай про современного человека, попавшего в тело старшего сына графа. В окне: решение писать исекай, мучения с образом гг, название, третье переписывание и, наконец, сам текст первой главы.\n- (w0114) История Славы в жанре исекай, которую Миколай начал читать в этом окне (сам текст — в предыдущем окне). Слава объявляет, что продолжит её, поправив характер главного героя, и выкладывает скелет дальнейшего сюжета.\n\n## Связано с\n\nДионис Бэлут, Королевство Пиор, Образ бессмертного гг, Страх\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-12-09\n\nвселенная: Феня (по дате объявления) · окно w0113 · сообщения 394616–394664\n\n*что здесь: решение писать исекай (обычный исекай в мир фэнтези); Слава боялся, что исекай — деградация, Миколай не против; образ гг оправдывается только исекаем*\n\n\n\n```chat\n[394616] 2025-12-09 14:23 Слава: Ты не против исекая???\n[394623] 2025-12-09 15:15 Миколай: почему ты мне пишешь когда я единственный раз в несколько месяцев решаю поспать днём\n[394624] 2025-12-09 15:15 Миколай: я реально редко днём сплю, но ты всегда пишешь когда так засыпаю\n[394625] 2025-12-09 15:15 Слава: Это почему ты спишь днем именно когда я тебе пишу\n[394626] 2025-12-09 15:16 Миколай: ни разу я не просыпался, чтоб ты не писал\n[394627] 2025-12-09 15:16 Миколай: ...\n[394628] 2025-12-09 15:16 Слава: Итак чё?\n[394629] 2025-12-09 15:16 Миколай: а в чем проблема\n[394630] 2025-12-09 15:16 Миколай: я когда-то был против?\n[394631] 2025-12-09 15:16 Слава: Не знаю. \nПросто это как-то в моей голове считалось деградация в плане истории\n[394632] 2025-12-09 15:16 Миколай: а, да вообще нет\n[394634] 2025-12-09 15:17 Миколай: а это иссекай?\n[394636] 2025-12-09 15:17 Слава: Это нет\n[394637] 2025-12-09 15:17 Слава: Другой будет\n[394638] 2025-12-09 15:17 Миколай: а\n[394640] 2025-12-09 15:17 Слава: Сдайся. Я кинул эту историю. Потому что не понял гг\n[394641] 2025-12-09 15:17 Миколай: ну исекай можно интересным сделать, просто другой жанр\n[394642] 2025-12-09 15:17 Слава: Но вот эту историю я точно до концу\n[394643] 2025-12-09 15:17 Миколай: ок\n[394644] 2025-12-09 15:18 Миколай: жаль кнш, ну понимаю\n[394645] 2025-12-09 15:18 Слава: Просто есть образ гг. \nИ этот образ отчасти можно оправдать лишь исекаем\n[394646] 2025-12-09 15:18 Слава: Ну и тем что гг долбоеб\n[394647] 2025-12-09 15:19 Миколай: ты никогда так не поступал с персами\n[394648] 2025-12-09 15:19 Миколай: мне интересно\n[394649] 2025-12-09 15:19 Слава: Ок\n[394650] 2025-12-09 15:19 Слава: Скину как напишу.\n[394651] 2025-12-09 15:19 Миколай: получается не спрашивать?\n[394652] 2025-12-09 15:20 Слава: Либо когда у меня будут момент переживаний\n[394653] 2025-12-09 15:20 Слава: Что именно\n[394654] 2025-12-09 15:20 Слава: ?\n[394655] 2025-12-09 15:20 Миколай: про историю\n[394656] 2025-12-09 15:20 Слава: Спрашивай\n[394657] 2025-12-09 15:20 Слава: Вообще обычный исекай\n[394658] 2025-12-09 15:20 Миколай: не я имел в виду, завтра/через неделю\n[394659] 2025-12-09 15:20 Слава: То есть исекай в мир фэнтези\n[394660] 2025-12-09 15:20 Миколай: написал ли ты\n[394661] 2025-12-09 15:21 Слава: Спрашивай. Подгоняй меня\n[394662] 2025-12-09 15:21 Миколай: ну хотя про саму идею тоже буду спрашивать это интересно\n[394663] 2025-12-09 15:22 Миколай: успехов, а че нибудь поем а то проснулся и хочу жевать\n[394664] 2025-12-09 15:22 Слава: Вообще этот образ гг был впихнут во вторую Вселенную\n```\n\n### Версия 2 — 2025-12-10\n\nвселенная: Феня (по дате объявления) · окно w0113 · сообщения 395529–395546\n\n*что здесь: история пишется, предыдущая жизнь гг требует доработки*\n\n\n\n```chat\n[395529] 2025-12-10 20:25 Миколай: как история\n[395530] 2025-12-10 20:26 Слава: Пишется\n[395531] 2025-12-10 20:26 Слава: Чё тебе сказать\n[395533] 2025-12-10 20:27 Миколай: хм\n[395534] 2025-12-10 20:28 Миколай: он сдох уже?\n[395535] 2025-12-10 20:28 Слава: Кто\n[395536] 2025-12-10 20:28 Миколай: я тоже иссекай хочу кстати написать\n[395537] 2025-12-10 20:28 Слава: Гг\n[395538] 2025-12-10 20:28 Слава: Давай\n[395539] 2025-12-10 20:28 Слава: Вперед\n[395540] 2025-12-10 20:28 Слава: И скидывай\n[395541] 2025-12-10 20:28 Слава: Чтобы завтра уже была\n[395544] 2025-12-10 20:30 Миколай: э\n[395545] 2025-12-10 20:30 Миколай: да\n[395546] 2025-12-10 20:31 Слава: Ну в принципе да. Но описания его предыдущий жизнь надо улучшить. Просто один элемент\n```\n\n### Версия 3 — 2025-12-11\n\nвселенная: Феня (по дате объявления) · окно w0113 · сообщения 395749–395757\n\n*что здесь: образ гг вышел не тем, но автор его понимает: привычки, ненависть к определённым словам, хаотичные действия, недоверие к вызывающему доверие, гнев, восхищение, возбуждение. Здесь же названо название — Фанатик*\n\n\n\n```chat\n[395749] 2025-12-11 17:00 Слава: Блять мой образ гг\n[395750] 2025-12-11 17:00 Слава: Он не тот. Нет в нём есть частичка того образа которого я хотел\n[395751] 2025-12-11 17:00 Слава: Но он не тот\n[395753] 2025-12-11 17:02 Слава: Но при этом я до сих пор понимаю гг. Его привычка, его ненависть к определенным словам, его действия, который иногда кажутся хаотичным, его недоверия к тому что как бы вызывает доверия\n[395754] 2025-12-11 17:02 Слава: Но он не тот\n[395755] 2025-12-11 17:02 Слава: Ну все равно буду продолжать\n[395756] 2025-12-11 17:03 Слава: Ну ещё его гнев, восхищение и возбуждение\n[395757] 2025-12-11 17:03 Слава: Кстати названия истории \nФанатик\n```\n\n### Версия 4 — 2025-12-11 · повтор прежней мысли\n\nвселенная: Феня (по дате объявления) · окно w0113 · сообщения 396062–396064\n\n*что здесь: уточнение проблемы: гг живёт не так, как хотел автор*\n\n\n\n```chat\n[396062] 2025-12-11 21:50 Миколай: типа как ты его пишешь он не живёт так как ты хотел\n[396064] 2025-12-11 21:50 Слава: Ну да\n```\n\n### Версия 5 — 2025-12-13\n\nвселенная: Феня (по дате объявления) · окно w0113 · сообщения 397182–397183\n\n*что здесь: третье переписывание: изначальный образ гг отброшен, история переписывается заново с новым гг*\n\n\n\n```chat\n[397182] 2025-12-13 21:36 Слава: Ладно не жди образа гг который я изначально задумывал. \nЧем больше я деталей вписывал, чем дальше он был от образ гг и чем больше он не подходил для некоторых сцен. \nИ здесь я вспомнил о другом образе героя со своими сценками и теперь третьи раз я буду переписывать. \nДа вот такой я жопожуй😌\n[397183] 2025-12-13 21:36 Слава: То есть я заново переписываю истории с новым гг\n```\n\n### Версия 6 — 2025-12-14\n\nвселенная: Феня (по дате объявления) · окно w0113 · сообщения 397744–397761\n\n*что здесь: заброшенный вариант скинут в чат целиком: подзаголовок «обычный мир», гг — Дионис Бэлут*\n\n\n\n```chat\n[397744] 2025-12-14 22:00 Миколай: ну вот то скинь раз забросил\n[397758] 2025-12-14 22:10 Слава: Фанатик (обычный мир) \n\nНаверное многие мечтали попасть другое мир\nЧаще всего об этом мечтают неудачники. \nПочему-то в их голове возникла мысль. \nЧто в другом мире они будут лучше, станут смелее и воля их пробьет небеса. Ну что за бред. Они как и останутся неудачником в настоящим, так и в другом мире име будут. Смелость и воля не появится просто по волшебству. Тем более воля у людей, который всю жизнь просиживали дома. Прячешь от людей. \nЯ же никогда не мечтал о побеге. Тем более в другой мир.  Был готов жить нынешнее жизнью. Один на один с этой.... семье. \nХа-ха-ха семья даже звучит смешно, вот эти куски плоти, когда-то были моей семье. Уважаемые отец и миловидная мать. Сейчас не более чем.... - \n\nТак и жил с этими. Бросить их я не мог, как никак раньше они меня любили, да и воспитали. И бросить их будет неправильно. \nВот и пошли циклы моей жизни. Работа, дом и уход за этими. Тем б
