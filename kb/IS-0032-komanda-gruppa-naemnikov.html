тренный разрез ну здесь понятно \nВетренный толчок \nИ вот заклинание который есть но он применяет их медленно \nВетреной взрыв ( создаёт шар ветра который может взрываться)\nВетренная стрела \nИ магий материализации\n```\n\n### Версия 2 — 2024-12-23\n\nвселенная: неясно (по дате объявления) · окно w0068 · сообщения 273290–273322\n\n*что здесь: Решено: гильдии нет, это группа наёмников, работают на всех, кто даст работу; обычные наёмники берут заказы с доски объявлений, а их персонажам задания приносит учитель; состав — 4 человека, 2 Славы и 2 Миколая; магию давать всем не обязательно, есть артефакты*\n\n\n\n```chat\n[273290] 2024-12-23 14:57 Слава: И так по сюжету у нас будут команда?\n[273291] 2024-12-23 14:57 Миколай: как они выглядят\n[273292] 2024-12-23 14:57 Слава: Просто массовка который гибнуть\n[273293] 2024-12-23 14:58 Миколай: мы будем эльфами\n[273294] 2024-12-23 14:58 Миколай: которые решили стать королями\n[273295] 2024-12-23 14:58 Слава: Кто мы ?\n[273296] 2024-12-23 14:58 Миколай: ой\n[273297] 2024-12-23 14:58 Миколай: перс эльф\n[273298] 2024-12-23 14:58 Слава: И его способность?\n[273299] 2024-12-23 14:59 Слава: И сколько вообще в команде будут людей\n[273300] 2024-12-23 14:59 Слава: Мой перс человек \nИ твой эльф ещё сколько надо\n[273301] 2024-12-23 14:59 Слава: И если что магии наделять всех не надо\n[273302] 2024-12-23 14:59 Миколай: будет гильдия?\n[273303] 2024-12-23 14:59 Слава: Есть ещё артефакты\n[273304] 2024-12-23 14:59 Слава: Нет\n[273305] 2024-12-23 14:59 Миколай: нуу хз\n[273306] 2024-12-23 14:59 Миколай: а как тогда\n[273307] 2024-12-23 15:00 Слава: Че как просто группа наемников\n[273308] 2024-12-23 15:02 Миколай: а\n[273309] 2024-12-23 15:02 Миколай: а на кого работают?\n[273310] 2024-12-23 15:02 Слава: На всех\n[273311] 2024-12-23 15:02 Слава: Кто работу даст\n[273312] 2024-12-23 15:02 Слава: А нет\n[273313] 2024-12-23 15:02 Миколай: это на доске объявления?\n[273314] 2024-12-23 15:03 Слава: Вообще у моего перс есть учитель которы
