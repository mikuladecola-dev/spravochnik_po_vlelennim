<script>const BASE="../";const DOCNAME="Призрак";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Призрак\n\n*персонаж* · вселенные: игра бога\n\n## Навигация\n\n- (w0032) Персонаж Миколая под отряд: призрак с управляемым осязанием и боевым искусством. Идёт с 166764 до 166782, там же реакция Славы.\n\n## Связано с\n\nЛокальное управление осязания, Отряд сильнейших\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-05-07\n\nвселенная: игра бога (по дате объявления) · окно w0032 · сообщения 166762–166775\n\n*что здесь: Придуман: призрак, проходит сквозь всё, локально управляет осязанием; сверху — мощное боевое искусство; способ убить — атаковать осязаемую часть тела.*\n\n\n\n```chat\n[166762] 2024-05-07 15:45 Слава: Не оставляю ( не знаю почему, просто как то не подходит)\n[166763] 2024-05-07 15:46 Миколай: Окей\n[166764] 2024-05-07 15:49 Миколай: Есть идея о призраке. И способность его будет: локальное управление осязания. Ну тобиж он может проходить сквозь всё, и может контролировать какая часть его тела будет доступна для прикосновения. Даже если это маленькие участки или участки внутри тела\n[166765] 2024-05-07 15:50 Миколай: Ну и ещё он будет обладать мощным боевым искусством\n[166766] 2024-05-07 15:51 Миколай: Если он может в объёме контролировать осязание внутри тела, то он например может сделать иглы из костей осязаемыми и ими зарезать других\n[166767] 2024-05-07 15:52 Миколай: Ну и логично как его победить, просто атаковать осязаемую часть тела\n[166770] 2024-05-07 15:58 Миколай: Норм?\n[166771] 2024-05-07 15:58 Слава: Да\n[166772] 2024-05-07 16:02 Миколай: Оказывается ловкость имбовая штука\n[166773] 2024-05-07 16:02 Миколай: Ловкость — (определение, данное Н. А. Бернштейном) — способность двигательно выйти из любого положения, то есть способность справиться с любой возникшей двигательной задачей:\n\nправильно (адекватно и точно),\nбыстро (то есть, скоро и споро),\nрационально (целесообразно и экономично),\nнаходчиво (изворотливо и инициативно).\n[166774] 2024-05-07 16:02 Миколай: Из фандома взял\n```\n\n### Версия 2 — 2024-05-07\n\nвселенная: игра бога (по дате объявления) · окно w0032 · сообщения 166776–166785\n\n*что здесь: Слава: «не то» для отряда, но призрака можно ещё куда-нибудь запихать; Миколай замечает, что делал его именно под эту идею.*\n\n\n\n```chat\n[166776] 2024-05-07 17:06 Слава: Но все это как то не то\n[166778] 2024-05-07 17:06 Миколай: Призрак?\n[166779] 2024-05-07 17:07 Слава: Не ну призрак можно ещё куда нибудь запихать\n[166780] 2024-05-07 17:07 Слава: Но\n[166781] 2024-05-07 17:08 Миколай: Ну бля, я под эту идею его и создавал 😅\n[166782] 2024-05-07 17:08 Миколай: Ладненько придумаю ещё что-нибудь\n```\n\n## Неясности\n\n- (w0032) Вселенная не названа; куда именно персонажа «запихать», не решено.</div>"}];</script>
