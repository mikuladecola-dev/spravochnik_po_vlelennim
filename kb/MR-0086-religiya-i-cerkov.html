024-12-21 16:31 Миколай: в средневековье магов жгли и если читать почему\n[272364] 2024-12-21 16:31 Миколай: одна из тем обвинения\n[272365] 2024-12-21 16:31 Миколай: язычество\n[272366] 2024-12-21 16:31 Миколай: многобожество то есть\n[272367] 2024-12-21 16:31 Миколай: типа\n[272368] 2024-12-21 16:32 Миколай: у тих в религии богов много\n[272369] 2024-12-21 16:32 Миколай: хотя повсеместно популярно христианство\n[272370] 2024-12-21 16:32 Миколай: и один бог\n[272371] 2024-12-21 16:32 Миколай: церковь имеет власть\n[272372] 2024-12-21 16:32 Слава: Сейчас маги имеет большой влияний в королевстве и магии обучают даже солдат поэтому церковь ничего не может сделать\n[272373] 2024-12-21 16:32 Миколай: и сильнее государство\n[272374] 2024-12-21 16:33 Миколай: и это отражено в религии\n[272375] 2024-12-21 16:33 Миколай: она другая\n[272376] 2024-12-21 16:33 Миколай: 100%\n[272377] 2024-12-21 16:33 Слава: Да\n```\n\n### Версия 3 — 2024-12-21\n\nвселенная: неясно (по дате объявления) · окно w0067 · сообщения 272451–272514\n\n*что здесь: Вопрос Миколая «а бог вообще есть, а может его убили» — Слава: бог есть, не убивали, он в небесах.*\n\n\n\n```chat\n[272451] 2024-12-21 19:24 Миколай: а бог вообще есть?\n[272452] 2024-12-21 19:24 Миколай: а может его убили?\n[272453] 2024-12-21 19:24 Миколай: ну да примитивно но интересно че ты думаешь\n[272508] 2024-12-21 19:56 Миколай: Табу - это запреты, направленные на защиту маны и предотвращение ее загрязнения или утечки\n[272509] 2024-12-21 19:57 Слава: Есть\n[272510] 2024-12-21 19:57 Миколай: тогда помимо магии будет скверна\n[272511] 2024-12-21 19:57 Слава: Нет\n[272512] 2024-12-21 19:57 Миколай: а где он?\n[272513] 2024-12-21 19:57 Слава: В небесах\n[272514] 2024-12-21 19:57 Слава: Нет\n```\n\n## Часть чего\n\nСредневековый мир</div>"}];</script>
