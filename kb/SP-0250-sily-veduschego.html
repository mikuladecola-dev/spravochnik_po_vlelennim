<script>const BASE="../";const DOCNAME="Силы ведущего";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Силы ведущего\n\n*способность* · вселенные: вне вселенной\n\n## Навигация\n\n- (w0111) Набор возможностей хозяина сцены и явно проговорённая граница этих возможностей. Разбросано по [387591–387599].\n\n## Связано с\n\nВедущий, Клон ведущего, Маска ведущего\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-11-21\n\nвселенная: вне вселенной (разбор «неясно») · окно w0111 · сообщения 387591–387594\n\n*что здесь: Создаёт из дыма клона себя прошлого, схлопывает клона обратно в дым и превращает в маску; поднимает чудиков из-под пола; заставляет пол исчезнуть, превратив его в дым, и восстанавливает обратно.*\n\n\n\n```chat\n[387591] 2025-11-21 18:19 Слава: Шут в костюме \nДамы и джентльмены. На сцене ведущий. \n-благодарю, что вы всё здесь собрались ради меня. И прошу прощения, что предоставил вам такой плохую сцену- сказал мужчина разводя руками. Одет он был в костюме 19 века и имеющие на голове колпак. \n-да брость вы. Мы очень рады, что хоть на этой сцене увидели вас- заголосили зрителей в один тон. Всё они тоже были одеты в костюмы 19 века и пахли слегка тухла. \n-как же я польщён- нагнувшись в знак приветствия или благодарности. Произнес мужчина. \n-ну не будем уходить в сентиментальности. Нас ждёт куда более интересный вещи- бодра и радостно произнёс мужчина. Расхаживая на сцене. И делая вид задумчивого человека. \nПублика ждала. Дети пискляво кричали, чтобы представлений скорее началось. Женщины охали в нетерпении. Мужчины же сидели с угрожающим видом. Но глазами тожа прощая быстрее начать- это представления. На котором всё они собрались. Всё были в ожидании. А ведущий словно про себя говорил \n-так, так, какой бы вам представить выступления-\nНе выдержавшая зритель. Начали кричать свои предложения. Но ведущего зацепила лишь один из них. А именно от маленькой девочки, что пыталась перекричать всех- Расскажите о себе- возможно девичий голос так и не было бы услышан. Если бы зритель не подхватили идею и не продолжали еë кричать уже все вместе. \n-хм- нахмурился ведущий смотря на потолок. \n-а что? Можно. Но дорогие зрители не ждите захватывающий истории. Хотя я все-таки постараюсь подать её в красивую обёртку- сказал ведущий улыбаясь белыми зубами. \n-что же начнём- разведя руками произнёс ведущий. И на сцене словно из не откуда появился дым, который заполонил всё и зрительский зал, и всю сцену. Хотя дым был больше схожее на туман. Но на это не кто не обратил внимания. Дым был густом, что видеть дальше вытянутой руки было сложно. Зритель всё вглядывались в дым. В надежде увидеть что-то? Они сами не знали, что там разглядывают. \nВдруг дым начал кружиться словно водоворот. Зрители сначала испугались и схватившись за головные уборы. А женщины за платья. Но они быстро поняли, что ветра нет. И лишь дым движется так быстро. От неведомой силы. \nЗритель из дыма, что всё кружился. Услышали грохот. Женщины воскликнули, а мужчины схватились за трость. И лишь дети весело завизжали. \nДым вре продолжал крутиться. Но теперь он не охватывал зрительский зал. Он всё уменьшался и уменьшался. Сам же центром водоворота был центр сцены. \nКогда дым достаточно уменьшался. Зритель увидели в центре водоворота. Ведущего, что слов на схватив большую ложку. Начал, что-то размешивать. Но в руках у него ничего не было. Да и со стороны казалось, что именно он крутил весь этот дым. \nВодоворот дыма всё уменьшался. Оттуда так и слышалось грохот. \nВ конце концов дым уменьшался и завис. Остановился и больше не двигался. Был он выше чем ведущий. \nВедущий обойдя этот столп дыма. Повернулся лицом к испуганным зрителем. И как видимо довольным от того, что сделал. Начал говорить \n-Что же извольте. Вам показать моё творение- зритель слегка неуверенно, а потом всё живее. Начали просить ведущего показать, что же там. Ведущий же слегка усмехнувшись. Развёл руками. И столп дыма разлетелся. Зритель  содрогнулись испугавшись. Но после успокоившись и изумленое лицезрели. Второго ведущего. Хотя нет. \nОни конечно было похожи словно близнецы. Но клон из дыма выглядит младший. И был одет в другую одежду. В простую белую футболку и чёрный мешковатый штаны. Но было одно самое главное их отличия. У клона был уставший вид. Словно он только из похорон. А настоящий ведущий так и светил радостью и удовольствием своей работы\nВедущий подошёл к своему клону и схватив того за плечи сказал \n-это прошлый я . Ну или бывший я, как кому нравится - отпустив руки с плеч двойника. Ведущий опрокинул их на грудь. Он приподнял их и потянувшись к лицу двойника. Продолжил своё повествования\n[387592] 2025-11-21 18:19 Слава: -и не смотреть вы так. Хоть он и тухлый и невзрачные снаружи. Внутри то он куда больше интригует- ведущий резко засунул свои пальцы в глазницы клона. Зритель заохали и с отвращением продолжали смотреть. Но кровь они там и не увидели. Пальцы ведущего прошли словно, что крови не потекло. Ведущий хищная улыбнулся. И потянул руки, в разный стороны. На удивление всех голова клона открылась. Словно шкатулка и оттуда. Вылетели летающий монстры. Похожий с виду на новорождённых детей. А после от туда последовал строй солдат. У солдат дрожали руки. Словно они идут на смертный приговор. И даже зритель почувствовали некоторое недомогание. Увидев дрожащих солдат, что всё равно шли. Но в след за ними вы плавали из толщей воды рыбы, что были больше любых наших. И этот карнавал безумия всё продолжал идти. Пока ведущий не закрыл шкатулку именуемая головой. Он злорадно ухмыльнулся. Видя, что зритель хотели ещё наблюдать за этим карнавалом безумия. \nВедущий разведя руками и с торжественным лицом сказал \n- что же. Не будем больше задерживаться. Начнём мой повествования. Но для этого мне нужный помощники. Что вы зритель увидели интересную картину. - Зритель на столь резко и импульсивно подняли руки. Что даже ведущий слегка содрогнулся. \n- ой простите. У меня уже есть помощники и я уже хотел их пригласить - виновато произнёс ведущий. Зритель грустно опустили руки. Но ведущий слегка поколебавшись. Гордо произнёс \n- ну раз вы хотите участвовать. Я всё уступлю вам, часть моей сцены. Но лишь для одного человека. И думаю вы будете не против если на сцене будет именно та, что предложила мне поведать свою историю- ведущий внимательно посмотрел на зритель. Те конечно были против. Ведь на сцену хотели именно они. Но приняв факт, что им туда не попасть. Всё же согласились с предложением ведущего. \nВедущий получив согласия. Подошёл к девочке, что первая крикнула о желание послушать историю. \nА девочка, что крикнула об этом. Жалась в стул. Молясь, чтобы он не ошибся. А когда тот пошёл в ее сторону. Едва смогла удержаться от крика. Ещё крепче держяс за стул. А ведущий всё подходил. Пристально смотря на девочку. И наконец-то он подошёл и протянул одну руку отводя , а вторую убрал за спину . Ведущий ждал, когда та примет предложение, о выступление. Девочка огляделась, как будто бы по считая, что он ошибиться. А после встав со стула медленно словно перо. Положила на руку ведущего. И быстро обернувшись назад. Чтобы, как видимо получить согласия родителей. \nУвидела слегка улыбающегося отца, что был явно горд за то, что именно его дочь идёт на эту сцену. И мать что пыталась держать вид строгой матери. Но глаза явно выдавали крик души. Поэтому девочка спокойно пошла за ведущим и встав рядом с клоном. Начала его разглядывать и начал подмечать, что сходство с ведущим всё меньше. Чем казалось ей. \nВедущий же встав рядом с девочкой задал вопрос\n- Юная леди. Не соизволите сказать своё имя?- \n-а да- заволновалась девочка. И перестав разглядывать клона. Сказала деловита. \n- меня зовут София- ведущий улыбнулся и сказал \n- приятно познакомиться София- и ведущий слегка нагнувшись вперёд. В знак приветствия. И здесь дево
