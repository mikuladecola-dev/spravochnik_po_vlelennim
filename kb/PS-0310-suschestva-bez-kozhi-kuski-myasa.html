<script>const BASE="../";const DOCNAME="Существа без кожи («куски мяса»)";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Существа без кожи («куски мяса»)\n\n*персонаж* · вселенные: вне вселенной\n\n## Навигация\n\n- (w0110) Тварь, похожая на непережёванный кусок мяса с хрящами и на тень человека: глаза-бусины, отверстие на пузе, из которого льётся густая жёлтая жидкость и идёт бульканье. Живучая, после десятков ударов только мычит; под слоем плоти прячется череп. Такие же существа без кожи действуют в «Закате» (уже за краем окна).\n- (w0111) Жилистые безкожие человекоподобные твари, у которых вместо носа и рта отверстие с вытекающей жёлтой жидкостью. В окне — в «Закате» [387600–387601]; такое же существо было раньше, в «Место и ты» в w0110 [387583–387584].\n\n## Связано с\n\nАлексей, Деревня в «Закате», Место и ты, Рассказчик «Заката»\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-11-21\n\nвселенная: вне вселенной (объявлено) · окно w0110 · сообщения 387583–387584\n\n*что здесь: Первое появление, в «Месте и ты»: облило героя жидкостью, било, добито молотком для мяса — под плотью обнаружен череп*\n\n\n\n```chat\n[387583] 2025-11-21 18:16 Слава: Она остановилась лишь на мгновения, чтобы я выдохнул и резкими и дрожащими движениями начал искать пачку сигарет. Попутна ощущая, как ноет рука, в который цепился рыжий котяра. \nА после она решила уронить этот мир. Да здания, или даже весь мир начал падать. Если честно я бы не понял, что мир падает, не был бы моей обескоенный разум ощутить это. Но он был способен осознать, что поднявшийся в воздух стол, посуда и конешно же любимый котяра. Не просто так всё в воздухе. \nИ после мой разум принял самое правильное решения. Верный ответ он нашёл и сделав правильный вывод он отключился. Отключился и я. Ну это понятное дело. И я считавший себя хищником среди стадо баранов не понимающий собственных желаний. Выключился от непонимания происходящего. \n\nНе знаю сколько прошло времени. Мне снилось сны очень яркий и непонятный, но такие приятные. Я не хотел просыпаться, я и дальше хотел быть во сне думая, что сон это ряльность, а всё остальное бред бредовой собаки. Но новый мир решил не ждать моего естественного пробуждения и не ждать пока я не перекурю чем то похожим на белку. Он вытянул меня из защитного крепости, мерзким и отвратильным способом. Обоссал он меня короче, хотя я не уверен, что это было моча. Но мой мозг, что перебирал всю информацию, именно так ощутил жидкость, что лелась на моей тела. \nЯ открыл глаза и увидел, кем то не перижованый кусок мяса с хрящами. И это кусок мяса чём-то похожий на тень человека, испустил из своего отверстия, которая находилось на пузе, жёлтую густую жидкость. \nНа удивление как видимо не только меня, так как это существо удивлённое глядело на меня своими глазами бусинами. Я спокойно встал, попытался вытереть жидкость кухонным полотенцем, что было у меня в руках. Поняв, что это бесполезно, решил медленно наматать полотенце на кулак. \nЭто существо, что-то булькало своим отверстиям у пуза. Возможно она хотела, что-то сказать, но не могла. Но было уже поздно удар в лицо и это существо пошатнулась и пошла назад. Не успел он не отойди, не прийти в себя, как мой ботинок впечатался в пуза этого... Этого, как ещё его можно назвать. \nОн упал быстро и тяжело, и вертелся как таракан упавший на спину. Каждый моей пинок по его туши. Он издавал знакомый звук визга жертвы. Да это звук легко узнать хоть у человека, животного и насекомого они разные, но интонация одна и та-же.\nЭто существо оказалось живучим после десятков моих ударов, когда я уже начал давать заднию. Он всё мычал, и сложно было понять по куску мяса, нанёс я ему вред или нет. \nЯ решил бросить это дела, ведь это бесмысленно. Хотя я же на кухне. Я быстро огляделся и увидел стелажи и столики. Ножницы, ложки, тарелки и тому подобной бытовой фигни.\nДа нож тоже фигня,  ведь это кухонный нож. Он хлипкий и тонкий и легко сгибается, ранить им конечно можно, но не убить, да и застрять он может. Поэтому я искал что-то более увесистое. \nОткрывая очередной шкафчик и опустив туда руку я почувствовал что-то холодной и достаточное тяжёлое. Достав я понял, что это молот для обивки мяса. Идеально молоток для куска мяса. \nМоей трепещало от интереса, что же там внутри него. Словно я ребёнок, что так и жаждет раскрыть подарок. И конечно же я его раскрыл. Пять именно пять ударов молотком дало понять, что череп у него всё же есть. Но спрятанный под обилием плоти. \n&quot;Так ты всё же человек. Ну или был им когда-то &quot;не знаю почему возникла эта мысль. Ну я  не отрицал эту мысль.\n[387584] 2025-11-21 18:16 Слава: Третье\n```\n\n### Версия 2 — 2025-11-21 · повтор прежней мысли\n\nвселенная: вне вселенной (разбор «неясно») · окно w0111 · сообщения 387600–387601\n\n*что здесь: Развёрнутая механика: кухонный нож об них гнётся, вместо крови из глазниц бьёт жёлтая липкая тягучая струя с вкусом прокисшего молока, задушить руками невозможно, добиваются сковородкой — голова лопается, брызжут кровь и розовые куски; на полу извиваются как червяк; ими кишит вся деревня.*\n\n\n\n```chat\n[387600] 2025-11-21 18:19 Слава: Закат\nКакой же красивый закат в деревне. Когда небо не закрывает дым или многоэтажки. Ха называю красивым то, что давно перестали все называть красивым. Не знаю почему. Но в стихах и в книгах. Я давно перестал видеть строки о красивом закате. Закат все равно красивый. Словно горизонт горит, ярко-красным со смесью оранжевого огня. \nИ всю эту картину портит булькающие дыхание, этого куска мяса. Почему же он так дышит и почему он выглядит, как кусок мяса. \nДа всё просто. Потому что этот жилистый мужчина, как понятно по его гениталиям. Не имеет кожи, носа и ушей. Вот поэтому это просто кусок мяса или жира, как ходите. И из его отверстие, который находится в том месте, где обычно находиться нос и рот. Вытекает, какая-то жидкость. То рывками, то медленно. Типо вдох и течёт меньше, а выдох и вся это жидкость, словно под давлением вылетает. \nСхватив на кухни, что первая попалось. Чтобы наконец-то заткнуть это недоразумение.\n Первая, что я схватил. Оказался кухонный нож. И это не джекпот. Если вдруг, кто не знал. Кухонный нож делают тонким. Поэтому если попытаться ударить человека. То он просто прогнëтся. &quot; Ну и пофиг&quot; Промелькнула у меня в голове. \nА этот кусок мяса. Всё мнется у порога кухни. И вот он наконец собрал весь свой жировой дух. Бежит ко мне. Но его выпад. На столь вялый и медленный,  на что я медленно просто отхожу. И он врезается в кухонную мебель. Ну эти столики и гарнитуры, в которых хранится посуда. \nОн разворачивается и ищет меня взглядом. А я вот, как тут. Хватаю его за руку и начал бить ножом в глаза. Молясь, чтобы хотя бы от этого он не сломался. Но он молодец держался и не ломался, как и этот кусок мяса. Я бил точно по глазам. Бил и бил. Пока в меня из этого месиво, в место глаз. Стрельнула струя жира? Ну это точно не кровь. Кровь красная. Иногда разных оттенков. Но красная. А то, что стрельнуло в меня было жёлтым и словно сопли липкими и тягучий.\nИ вот эта струя зарядили мне ровно в лицо. Больше часть попало именно рот. И я почувствовал кислый и с прикусом прокисшего молока вкус. Что застрял, словно прилип к моему языку и горлю. Я начал задыхаться. И еле сдержавшись, чтобы не блевануть. Я начал яростно бить его ножом.\nПопутно приложившись на него всём своим весом. И я чувствовал, как руки тонут в это склизкой и фу, блять тёплой субстанций. \nПовалив его. И так, лёжа на нём продолжил бить. \nПерестал бить только, когда едва протирел  глаза и вижу нож прогнут. Отбросив это бесполезный кусок металла. Я попытался его задушить. Схватив руками его шею. И понял ещё один интересный факт. Невозможно задушить человека, вот так. Ведь он как бы не бездушная кукла. Он будет рыпаться, облеваться потом и вот так держа па
