const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># ГГ-защитник\n\n*персонаж* · вселенные: монстры\n\n## Навигация\n\n- (w0063) Главный герой хоррор-задумки: в этих мирах он защитник. Дальше через сутки Слава пишет его предысторию (переезд, сестра, встреча с существом), а ещё через сутки — сцену в школе с задирой. Повествование во второй прозе идёт от первого лица.\n- (w0064) Подросток, переехавший с сестрой в новый город; родители вечно на работе и холодны к детям, школа с плохой репутацией. Дерётся без страха перед людьми, но панически боится встреченного существа; эмоции выплёскивает, разрезая себе кожу.\n\n## Связано с\n\nЗдоровяк (толстый задира), Озеро перерождения, Перс, тащащий всё на своём горбу, Сестра ГГ, Сестра гг, Существо, Существо с длинными руками, Толстяк-задира, Чёрное озеро в густом лесу\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-11-09\n\nвселенная: монстры (по дате объявления) · окно w0063 · сообщения 255024–255053\n\n*что здесь: заявлено, что ГГ в этих мирах — защитник; М цепляется за формулу ужаса и предлагает беспомощность, Слава смеётся «защитник да ещё и беспомощный»*\n\n\n\n```chat\n[255024] 2024-11-09 23:43 Миколай: просто это всё утратит основную идею\n[255025] 2024-11-09 23:43 Слава: Да только мало обещающий\n[255026] 2024-11-09 23:44 Слава: И во все у меня в этих мирах гг вообще защитник\n[255027] 2024-11-09 23:44 Миколай: ну вообще я знаю формулу страха\n[255028] 2024-11-09 23:44 Миколай: ща\n[255029] 2024-11-09 23:45 Слава: Ну или другой перс который пытается все выкинуть на своем горбу и всегда когда сложно улыбается и пытается подбодрить всех но сам трясется в ужасе\n[255030] 2024-11-09 23:45 Миколай: Природа, принципы и формула страха, отвращения и ужаса - это
