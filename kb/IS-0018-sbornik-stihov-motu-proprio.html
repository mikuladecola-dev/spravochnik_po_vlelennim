24-07-08 19:24 Миколай: ага\n[200458] 2024-07-08 19:24 Слава: Странный голос\n[200459] 2024-07-08 19:24 Миколай: я старался\n[200460] 2024-07-08 19:26 Миколай: старался показать всё на что способен мой голос, мой мозг\n```\n\n### Версия 2 — 2024-07-09\n\nвселенная: 7 островов (по дате объявления) · окно w0045 · сообщения 200619–200913\n\n*что здесь: С прослушал: отзыв про голос и его смену от раза к разу, содержание не оценивал; М напоминает, что вставлял тексты специально для него*\n\n\n\n```chat\n[200619] 2024-07-09 11:47 Миколай: чекал?\n--- пауза 3.1 ч ---\n[200899] 2024-07-09 14:52 Слава: Да\n[200901] 2024-07-09 14:53 Миколай: и как?\n[200902] 2024-07-09 14:53 Миколай: капец интернет хуйня\n[200903] 2024-07-09 14:53 Слава: Ну красава \nГолос красивей стал \nИ ты его стараешься каждый раз менять\n[200905] 2024-07-09 14:54 Миколай: а по содержанию?\n[200907] 2024-07-09 14:55 Слава: А по содержанию я честно о собо не вслушивался \n😉( Ты сам в курсе что музыку я особо не слушаю, поэтому и оценить нормально не могу ) \nНу всё равно круто\n[200908] 2024-07-09 14:56 Миколай: понятно 😁\n[200909] 2024-07-09 14:56 Миколай: ну мог бы и почитать\n[200910] 2024-07-09 14:56 Миколай: ахахах\n[200911] 2024-07-09 14:56 Миколай: для тебя текста вставлял\n[200912] 2024-07-09 14:56 Слава: Где?\n[200913] 2024-07-09 14:56 Миколай: .\n```\n\n### Версия 3 — 2024-07-09\n\nвселенная: 7 островов (по дате объявления) · окно w0045 · сообщения 200983–201004\n\n*что здесь: М рассказывает, как читал эти стихи вслух двум вожатым спортивного лагеря и просил их мнения*\n\n\n\n```chat\n[200983] 2024-07-09 15:09 Миколай: ну короче, я кстати когда гулял\n[200984] 2024-07-09 15:10 Миколай: встретил двух вожатых\n[200985] 2024-07-09 15:10 Миколай: спортивного лагеря\n[200986] 2024-07-09 15:10 Миколай: мальчика и девочку\n[200987] 2024-07-09 15:10 Миколай: они ко мне подошли и заговорили\n[200988] 2024-07-09 15:10 Миколай: 17 и 19 лет\n[200989] 2024-07-09 15:10 Миколай: этот хуй\n[200990] 2024-07-09 1
