<script>const BASE="../";const DOCNAME="СЛ (люди со способностями)";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># СЛ (люди со способностями)\n\n*мир* · вселенные: неясно\n\n## Навигация\n\n- (w0122) Сквозной термин мира: люди со способностями (расшифровку подтверждает переспрос М в 509176). Рядом фигурируют «ис» и «оам»; в идеологии Насла сл названы контролирующими оам, сектой — демонами из ада, а Заной — богами этого мира.\n\n## Связано с\n\nИспользование сл государствами в войнах, Насла, оам\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2026-06-17 · повтор прежней мысли\n\nвселенная: неясно (по дате объявления) · окно w0122 · сообщения 491162–491162\n\n*что здесь: Употребление: в организации Насла нет ни сл, ни ис; сл — те, кто контролирует оам, и «боги» мира.*\n\n\n\n```chat\n[491162] 2026-06-17 19:58 Слава: Организация Насла. В этой организации злодеев лишь обычный люди там нету сл или ис. \nИдеология данной организации сл и всё кто контролирует оам зло. Абсолютное зло. Дети что получили в руку ядерную бомбу. Монстры что не понимают собственной силы и ответственности. И их цель уничтожить всех сл или подчинить их под строгие правила. В данной организации также вступила и секта что считает сл демонами вылезший из ада. \nСам же глава насла так не считает. По его мнению даже без сл, был бо множество войны, множество плохих людей, множество смертей и несчастье. Тогда почему он возвёл и командует такой организации. Почему он Зана продолжает быть лидером данных идеалов. Всё просто &quot; Разве у вас никогда не проявлялась желание растоптать Бога, замирать его, увидеть его жалкий вид. Подорвать ему крылья и с упоением смотреть на эти отчаяный глаза&quot;если нет то вы соврети. Разве у вас просто не промелькала мысль увидеть как например звезда что строила свой образ на протяжении всей жизни вдруг падёт, разве это неинтересно, разве это не просто человеческая желания.\nИ кто же в нашем мире бог, конечно сл. И их ними падениями я буду восхищаться.но прежде чем пасть нужно сначала дать им подняться а после собвстенными руками поджечь им крылья и смотреть как крылья начинают разваливаться, как их уверенно лицо, изменяется гримассой страха. \nГлавный фанат сл. \nКстати ему не понравилось падения изб, он посчитал что слишком рано и что слишком быстро подослали злодей не дав насладиться эмоциями Изб. \nВообще он хочет  падения не как он сражался против сильного злодея и проиграл. А то где обычный человек, простолюдина топчит бога, дворянина. Где он побеждает даже Бога.\n```\n\n### Версия 2 — 2026-07-23\n\nвселенная: неясно (по дате объявления) · окно w0122 · сообщения 509170–509176\n\n*что здесь: Уточнение в переписке: сл — это люди со способностями.*\n\n\n\n```chat\n[509170] 2026-07-23 14:48 Слава: назови мне причину почему государства не будут использовать сл в своих  войнах? \nЛадно там типо если вы используете то и мы используем и по этому ими не пользуется, но если какую-то страну там прям зажали то конечно она воспользуется этим и там уже чистый ад начнется.\n[509171] 2026-07-23 14:50 Слава: Я и правда отвык от переписки и забыл что ты получасовая гнида что долго отвечает\n--- пауза 1.7 ч ---\n[509175] 2026-07-23 16:34 Миколай: че использовать\n[509176] 2026-07-23 16:34 Миколай: людей со способностями?\n```\n\n## Неясности\n\n- (w0122) Что такое «ис», в окне не объясняется; полная расшифровка сокращений отсутствует.</div>"}];</script>
