<script>const BASE="../";const DOCNAME="Сильнейший человек без способностей (прототип командира)";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Сильнейший человек без способностей (прототип командира)\n\n*персонаж* · вселенные: Цветной мир\n\n## Навигация\n\n- (w0035) Персонаж, которого Слава создавал «на подобие командира», но в другой вселенной. Сильнейший только за счёт физической силы, способностями не владеет. Построил приют для сверхдетей, которых спасал из лабораторий, был гарантом между людьми и сверхлюдьми (уничтожал лаборатории, убивал нарушивших закон сверхлюдей — «полицейский для всех»). С детства его ненавидел и избивал отец; став звездой мира, завёл семью, которую отец уничтожил — дочь убил, жену оставил вечным калекой. Из чувства вины ходит к ненавидящей его жене и даёт себя избивать; из чувства вины же построил приют.\n\n## Связано с\n\nКомандир, Отец-реинкарнатор\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-05-25\n\nвселенная: Цветной мир (по дате объявления) · окно w0035 · сообщения 173183–173191\n\n*что здесь: Биография рассказана целиком одним куском; в конце Слава задаёт загадку — почему отец его так ненавидит.*\n\n\n\n```chat\n[173183] 2024-05-25 14:22 Слава: Не знаю ещё не продумал его до такой мелочи\n[173184] 2024-05-25 14:23 Слава: Вообще я создавал персонажа на подобие командира\nХочешь послушать?\n[173185] 2024-05-25 14:23 Миколай: Да\n[173186] 2024-05-25 14:23 Миколай: Расскажи\n[173188] 2024-05-25 14:29 Слава: Сильнейший человек который только благодаря физической силой стал одним из сильнейших сам он не владеет способностями\nОн построил приют для сверхдетей над которыми ставили опыты и которых он благополучно спасал \nИ он был гарантом между сверхлюдми и людьми ( поэтому он уничтожал лабораторий убивал сверхлюдей нарувшийшя закон то бишь он типо полицейский для всех)\nИ вот его история его с детства ненавидил отец избивал, мучал и т.п. и вот он вырос и стал звездой всего мира и зовел семью которую его отец уничтожил ( он убил дочь, а жену оставил навечно калекой ) \nИ вот наш гг когда чувство вины пересиливает его ходит к жене которая его ненавидит, и он даёт себя избивать \nИ кстати приют он построил ко крастоки из за чувство вины\n[173189] 2024-05-25 14:29 Слава: Почитай сейчас ещё добавлю\n[173190] 2024-05-25 14:30 Слава: И вопрос почему отец его так сильно ненавидит ?\n[173191] 2024-05-25 14:30 Слава: ( если что я знаю ответ )\n```\n\n### Версия 2 — 2024-05-25\n\nвселенная: Цветной мир (по дате объявления) · окно w0035 · сообщения 173203–173216\n\n*что здесь: Разгадка: в прошлой жизни это был реинкарнирующий злодей; в 7 лет ребёнок убил свою мать, память ему запечатали. Отсюда же объясняется физическая сила — мышечная память сохранилась, хотя воспоминаний нет.*\n\n\n\n```chat\n[173203] 2024-05-25 14:41 Миколай: На канале утопии был ролик где мама убивала детей после рождения. Она в дневнике записывала как ненавидит их. \n\nПочему? Да просто заебали орать и заботиться не хочется. Вообще-то у неё своя жизнь есть и нет цели заботиться о жизни других. Ну на деле она только так думала. Они ни кого не убивала, её подставил муж.\n\nЛадно, к чему это. Может быть у отца была полуактивная абакра. И способность реализовать негатив нанося вред врагу тем самым. Сначала он просто заебался от его криков. Потом заметил что от злости ему больнее и ему понравилось. Он раз в месяц приходил домой и вымещал злость. Он увлёкся и не заметил как это вошло в привычку, он его бил и не навидел чтобы успокоиться\n[173204] 2024-05-25 14:41 Слава: Поэтому-что у него была способности реинкарнация ( каждый раз как он умирал он оказался в новом теле и так на протяжении 1000 лет и так реинкарнируясь он сохранял способности получены в каждом теле и стал типо злодеим ) по итогу у одной пары родился странный ребенок и после 7 лет этот ребенок убил свою мать и собирался убить и отца но его воспоминания запечатали и дальше ты знаешь историю \nИ кок крастоки отвечает на вопрос как он стал сильнейшим благодаря только физической силой потому что хоть он ничего не помнить но все равно есть мышечная память которая сохраняется с ним\n[173205] 2024-05-25 14:42 Миколай: Командир убил мать получается\n[173206] 2024-05-25 14:43 Миколай: А батя ненавидел его\n[173207] 2024-05-25 14:43 Миколай: И бил\n[173208] 2024-05-25 14:43 Миколай: И жену убил и дочь батя\n[173209] 2024-05-25 14:43 Миколай: Или как\n[173210] 2024-05-25 14:43 Слава: Да , но так и не смог найти силы что бы убить свой собственной дитя\n[173211] 2024-05-25 14:44 Миколай: Так он его ненавидит из чувства мести получается?\n[173212] 2024-05-25 14:44 Миколай: А ребёнок не помнит что сделал и думает что буллинг от отца\n[173213] 2024-05-25 14:44 Слава: Его отец убил его дочь а жену убить не смог так как она сверхчеловек\n[173214] 2024-05-25 14:45 Слава: Да\n[173215] 2024-05-25 14:45 Слава: Но этой совсем другая вселенная\n[173216] 2024-05-25 14:46 Слава: Перейдем к нашей\n```\n\n## Неясности\n\n- (w0035) Вселенная не названа, помечена только как «совсем другая».</div>"}];</script>
