сивый, а типо бледный больной, так сказать серовато бледный) он плохо жил в приюте. Над ним издевались, да и он был отстраненым, словно не в этом мире.\nИ так он доживает до 10 лет, всё такоё же бледный, хиленький и больной и не являющийся сл. И уже познавший неприятную сторону человечества. И он впервые проваливается. \nКак это происходит его тело и сознание изчезает из нашего мира и оказывается на первом слое мира его матери. Первый слой мира его матери представляет собой пустой чёрной пространство, наполненной синими молниями, неизвестной ранее энергии, это не оам и не ток, это совершенно новая энергия. Ядовитая для живых существ, но для Энига она оказалась безвредной. Он смог поглотить её часть и потом снова провалился но уже в обратно в настоящее, на 2 метра от того места, на котором он изчез.\nИ теперь его способности он способен проваливаться в мир матери. И после возвращаться обратно. При этом он сам может выбрать точку появления. ( в радиусе 50 метров от места где он провалился). Проваливается он на 2 секунды, ну по меркам нашего мира, а вот по меркам того мира. То он в той пустоте наполненой неизвестной энергии может быть 2 минуты, а после насильно возращается обратная. \nТакже он способен заставить провалится объекты не наполненные оам. ( это я к тому что он не может составить провалится артефакты, людей и живые организмы ( во всех живых организмов есть оам) )\nЛюбые объекты могут быть там 1 секунд для нашего мира, и одну минуту для того мира. После они возвращаются и Эниг способен также контролировать где они появится ( в радиусе 30 метров от места их исчезновения, так-же он не может заставить появиться объект внутри другого объекта, если он попытается так сделать, то объект просто рандомном месте появиться ну в радиусе 30 метров.) и после того как они появились, они эти объекты пропитываются это странное особое энергии ( СОЭ). И Эниг может контролировать эти объекты, пока в них находится СОЭ ( ну типо телекинез). А также он способен из этих объектов собирать СОЭ. Зачем он это делает из-за того, что он не может без остановочная сам проваливается, так сказать перезарядка, которая занимает 3 минуты, нашего времени. Поэтому он так делает если ему нужна СОЭ. \nКак он использует СОЭ. Во первых у него нет программы поэтому использовать прям креативно он не может, да и он ещё юный, на момент начала сюжета ему 17 лет. Он использует её для усиления. Просто покрывает себя этими синими молниями и увеличивает свои физически характеристики. Также СОЭ имеет очень хорошо восстанавливает тела, ну то бишь с помощью СОЭ можно хорошо регенерировать лучше чем от оам. Его удары достаточна мощный так как СОЭ для всех ядовит, то удар пропитанной СОЭ является очень болючим, и сложно восстанавливаемым. То есть после этого удара восстановиться с помощью оам очень сложная. Плюсом если ты прям будешь впитывать удары СОЭ то по-тихоньку тебе будет всё хреновее так как СОЭ распостраняется по телу и тебе будет хреновее. Очень сложно вывести с помощью оам. Ещё он может стрелять этой СОЭ как молнии. Но он косой и поэтому часто не попадает. Также он может выпустить заряд СОЭ в разные стороны.\n[488785] 2026-06-09 08:55 Слава: И по сути у него способности это телепортация на малый расстояние ( провалы то есть). Телекинез пропитаных  СОЭ объектов. Усиление, опасный удары, косой выстрел молнии. Ну и просто выпуск накопившиеся СОЭ в разные стороны. \nСОЭ хоть и не ядовита для него вызывает чувство эфория, посылает дофамина дофига. И мутить сознание. Делая тебе словно пьяным и ты творишь всякую дичь. Убиваешь прохожего. Убиваешь всех в приюти. Купаясь в ванне кого-то богача и т. Д. Можно сказать он наркоман, а его наркотик это СОЭ. \nИ также он злодей, но не принадлежит не какой организаций. И он любит по драться и давить врагов.\n[488786] 2026-06-09 09:03 Слава: Энергет, прятки, закон, петля, феникс, Тен, волк, дракон, ци, имитатор, спартанец, вампир, драгоценность, бессмерт, жук, лёд, Дилан, граница, солнце\n```</div>"}];</script>
