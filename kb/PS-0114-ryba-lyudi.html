const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Рыба-люди\n\n*персонаж* · вселенные: 7 островов\n\n## Навигация\n\n- (w0043) Основное население подводного острова. Рождаются уже под огромным весом, погружаются плавно, поэтому всё население физически развитое; за пределами барьера обычного человека раздавит.\n\n## Связано с\n\nОстров на дне океана (сфера), Солнышко, Трубы сферы\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-07-04\n\nвселенная: 7 островов (по дате объявления) · окно w0043 · сообщения 196747–196777\n\n*что здесь: по большей части остров населяют рыба-люди; рождаются под ебейшим весом, погружение плавное; все качки, тренировки как у космонавтов, детей разорвёт, поэтому родители следят*\n\n\n\n```chat\n[196747] 2024-07-04 20:36 Слава: А как рыбы плавают ?\n[196748] 2024-07-04 20:36 Миколай: энергией делиться\n[196749] 2024-07-04 20:36 Миколай: хороший вопрос\n[196751] 2024-07-04 20:37 Слава: Вообще там по большей части жить будет рыба люди\n[196752] 2024-07-04 20:37 Миколай: ну они рождаются уже по ебейшим весом\n[196753] 2024-07-04 20:37 Миколай: и из погружение обычно плавное\n[196757] 2024-07-04 20:38 Миколай: а тут, тя нахуй давят десятки тонн воды\n[196758] 2024-07-04 20:38 Слава: Тогда как сделать чтобы они плавно выходили через барьер\n[196760] 2024-07-04 20:39 Миколай: или наружу?\n[196761] 2024-07-04 20:39 Слава: Из барьера в воду\n[196762] 2024-07-04 20:39 Миколай: ну можно реализовать специальные каналы\n[196763] 2024-07-04 20:39 Слава: Чево\n[196766] 2024-07-04 20:39 Миколай: а я твои\n[196767] 2024-07-04 20:40 Миколай: шок\n[196768] 2024-07-04 20:40 Миколай: ну тобиж, не напрямую в воду, а как бы в барьере будут подобия труб\n[196769] 2024-07-04 20:40 Миколай: или выход
