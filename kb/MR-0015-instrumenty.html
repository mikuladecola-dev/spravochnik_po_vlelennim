<script>const BASE="../";const DOCNAME="Инструменты";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Инструменты\n\n*мир* · вселенные: 7 островов\n\n## Навигация\n\n- (w0038) Центральная механика мира: люди рождаются с силой, но не могут её контролировать, сила разрушает носителя изнутри; инструмент останавливает саморазрушение, помогает направлять и развивать силу. Формулировка переписывалась несколько раз.\n\n## Связано с\n\nДух выбирает носителя, Неизлечимые раны от перенапряжения силы, Новая вселенная, Откуда берутся инструменты\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-06-17\n\nвселенная: 7 островов (по дате объявления) · окно w0038 · сообщения 183157–183169\n\n*что здесь: концепция Тора: бог грома может драться и без молота, но молот направляет силу; люди рождаются с силами, не способны их контролировать, помогают инструменты; упомянуты исключения — способности петли и прятки*\n\n\n\n```chat\n[183157] 2024-06-17 21:31 Миколай: Ну если серьёзно, то\n[183158] 2024-06-17 21:31 Миколай: Виды способностей. Сосредоточиться на физических и ментальных усилениях - сверхсила, скорость, регенерация, телепатия, телекинез и т.д. Разные комбинации и уровни развития способностей у людей.\n[183159] 2024-06-17 21:31 Миколай: Вот норм идея врд\n[183160] 2024-06-17 21:31 Миколай: Ну я хз\n[183161] 2024-06-17 21:31 Миколай: Развить как-то надо\n[183162] 2024-06-17 21:32 Слава: Концепций Тора бог грома который и без молота может сражаться но молот помогает направлять силу, вот и здесь люди рождаются с силами но не способны их контролировать и в помощь инструменты ( вот только они берутся, надо придумать )\nТакже есть исключения виде способности петли и прятки\n[183163] 2024-06-17 21:32 Миколай: Ооо\n[183164] 2024-06-17 21:33 Миколай: Опачатский\n[183165] 2024-06-17 21:33 Миколай: Ща\n[183169] 2024-06-17 21:34 Миколай: Это надолго😐😐😐\n```\n\n### Версия 2 — 2024-06-17\n\nвселенная: 7 островов (по дате объявления) · окно w0038 · сообщения 183170–183187\n\n*что здесь: аналогия с «проклятыми»: они тоже не контролируют силу с рождения, там помогло заклинание/тату, а нам нужен именно инструмент; предложено позаимствовать у них недостатки и поведение силы без оружия*\n\n\n\n```chat\n[183170] 2024-06-17 21:36 Миколай: Посмотри на эти ножки\n[183171] 2024-06-17 21:36 Слава: Читал\n[183172] 2024-06-17 21:37 Слава: Здесь рисую девочку ну говорят мальчика\n[183173] 2024-06-17 21:37 Миколай: Так вот\n[183174] 2024-06-17 21:37 Миколай: Так есть эти\n[183175] 2024-06-17 21:37 Миколай: Проклятые\n[183176] 2024-06-17 21:37 Миколай: Или как их\n[183177] 2024-06-17 21:37 Слава: Ну и\n[183178] 2024-06-17 21:38 Миколай: Они тоже не умеют контролировать способности с рождения\n[183179] 2024-06-17 21:38 Миколай: И там законтрить это помогла тату\n[183180] 2024-06-17 21:38 Миколай: Мы же хотим инструмент\n[183181] 2024-06-17 21:38 Миколай: Так вот\n[183182] 2024-06-17 21:38 Миколай: Это всё\n[183183] 2024-06-17 21:38 Миколай: Сори\n[183184] 2024-06-17 21:38 Миколай: Я думал ещё чет придумаю\n[183185] 2024-06-17 21:39 Миколай: Не тату, а заклинание, ну да ладно\n[183186] 2024-06-17 21:42 Миколай: А, ну недостатки у этих проклятых спиздить можно, вот че хотел сказать\n[183187] 2024-06-17 21:43 Миколай: Поведение там без оружия. Поведение способностей\n```\n\n### Версия 3 — 2024-06-17\n\nвселенная: 7 островов (по дате объявления) · окно w0038 · сообщения 183188–183192\n\n*что здесь: развёрнутая механика: большая сила + инструмент сильнее маленькой силы; сила подсознательно ограничивается, иначе смерть в любом возрасте; без инструмента применение силы наносит урон самому носителю; с инструментом сила помаленьку контролируется и развивается; полное применение силы даже с инструментом — мгновенная смерть // образ: люди — слишком маленький бокал, сила их уничтожает, инструмент останавливает саморазрушение*\n\n\n\n```chat\n[183188] 2024-06-17 21:43 Слава: Сила большая + инструмент &gt;&gt;&gt;&gt;&gt;сила маленькая \nИ вот получив огромную силу с рождения она допустим ограничивается подсознательно потому что ты сдохнешь в любом возрасте если будешь использовать её полностью \nИ если ты будешь использовать силу без инструмент ты вредишь самому себе так как хоть ты подсознательно его сдерживает но этого не хватает и ты получаешь урон \nА вот с инструментом который помогает контролировать силу помаленьку он также помогает её развивать \nИ сразу если они используют всю свою силу даже с инструментом они мгновенно сдохнут не успев применить и половины\n[183189] 2024-06-17 21:45 Слава: Так сказать люди слишком маленькие бокал и поэтому сила их уничтожает а вот инструмент помогает остановить это саморазрушение\n[183190] 2024-06-17 21:46 Миколай: Ага, я понял куда ты клонишь. Где-то такой концепт я уже видел. Я так понял ты на нём хочешь сосредоточиться\n[183191] 2024-06-17 21:46 Миколай: Окей\n[183192] 2024-06-17 21:46 Миколай: Сильная идея в принципе\n```\n\n### Версия 4 — 2024-06-17 · повтор прежней мысли\n\nвселенная: 7 островов (по дате объявления) · окно w0038 · сообщения 183237–183244\n\n*что здесь: сжатая финальная формулировка дня: сила разрушает хозяина, инструмент останавливает это разрушение*\n\n\n\n```chat\n[183237] 2024-06-17 21:53 Слава: Все\n[183238] 2024-06-17 21:54 Слава: Более полная концепция \nСила разрушает хозяина а инструмент останавливает это разрушение\n[183239] 2024-06-17 21:54 Слава: Вот\n[183240] 2024-06-17 21:55 Слава: В своем прошлом предложение было слишком но а сейчас из стало поменьше\n[183241] 2024-06-17 21:55 Слава: И все я спать мне учиться\n[183242] 2024-06-17 21:55 Слава: Спокойной ночи\n[183243] 2024-06-17 21:55 Слава: Пиши если хочешь но отвечу я завтра\n[183244] 2024-06-17 21:56 Миколай: Добрых снов\n```\n\n### Версия 5 — 2024-06-19\n\nвселенная: 7 островов (по дате объявления) · окно w0038 · сообщения 184081–184081\n\n*что здесь: изменение концепции: инструмент не столько сдерживает, сколько позволяет использовать большую силу — человек маленький кран, инструмент большой (больший выброс энергии); долго без инструмента — сосуд ломается, потому что сила идёт, а выпускается мало*\n\n\n\n```chat\n[184081] 2024-06-19 17:49 Слава: Изменения концепций оружие помогает использовать больший силы \nПример человек маленький кран а инструмент большой ( то бишь большой выброс энергий)\nЕсли они долго будут без инструмента то сосуд будет ломаться так как сила идёт а выпускается мало\n```\n\n## Часть чего\n\nНовая вселенная\n\n## Неясности\n\n- (w0038) «способности петли и прятки» названы как исключения из правила, но нигде не раскрыты</div>"}];</script>
