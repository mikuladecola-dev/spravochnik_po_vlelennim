1-10\n\nвселенная: монстры (по дате объявления) · окно w0063 · сообщения 255096–255096\n\n*что здесь: в прозе появляется чёрное озеро в густом лесу, из которого ГГ пьёт — прямая связь с озером перерождения не оговорена*\n\n\n\n```chat\n[255096] 2024-11-10 00:15 Слава: Гг переезжает в ной город с сестрой из за родителей \nРодителей вечно на работе и почему то не питают ни каких чувств к свои отбрыском \nА гг думает что родители его вообще ненавидят \nПотому что каждый раз посылают его в школу с плохой репутации\nДа и в праздники они вместе не обмечяють \nНу гг привык к такой непостоянной жизни его больше волновала состояния его сестры который ещё ребенок который хочет получать внимание \nГг конечно старается уделить её достаточной внимание, но внимание 2 родителей даже иногда не хватает не говоря уже о внимание только брата \nИ вот гг пошел в новую школу с наигранной улыбкой\nОн уже был готов к драке и не боялся получать ему это казалось естественным как вращение земли \nНо что ему показалось необычным так это его ступор  посреди дороги когда он уже возвращался домой \nСтупор ты странным, гг давно привык  к страху тренируемых все это время в драках или точней он так думал \nНа самом деле он переборол страх \nОн стоял в ступоре затылком понимая что-то идёт. Что-то большее настолько что ему было бы не возможно прятаться в центре города к котором они находились \nПока гг стоял в попытках хоть дернуться существо уже подошло к нему и положила свой длиннющий руки на плече гг. Его руки были длины как и пальцы, а когти были настолько что без каких либо усилий давали одежду гг и в момент когда на его голову уже капнула слюна и в тот же момент когти существо прибили кожу гг давай ему контроль над телом и гг бежал не обращай ни на что внимания.\nВедь мозг кричал только и одном бежать бежать бежать бежать бежать \nИ пришел он в себя только в густом лесу, настолько густым что словно казалось сейчас ночь но как бы не была темная ночь темнее всего в этом месте был озеро настолько черный что казалось там не вода а нефть залитоми литрами\nИ выпив от туда у гг сразу проскакивает мысль а как же сестра, она же совсем одна в доме, а что если этот монстр\nГг рванул с места   даже не успеем отдышаться или прийти в себя он снова бежал только в этот раз не ради себя а ради такой близкой и бесконечно любимый сестры, он был готов перевернуть сами небеса дабы с ней все было в порядке \nОн бежал даже не зная дороги но каким то чудом добежал до дома \nНо боявшишь  открыть дверь и увидит окровавленный труп свой сестры или вообще не увидит её дома или решений рассудком и обвинявший его о опоздание сестру \nНо открыв дверь он увидел лишь коридор и услышишь топот ножек и увидит ту самую, целую и невредимую сестру \nОн хотел закричать расплакаться или потерять сознания, да все было хорошо, нов чё было слишком быстро и много \nНо он не закричал не расплакался и не потерял сознания он лишь когда всегда лучезарная улыбался и побежал за сестрой дабы поймать её и зашикатить, пряча за этим все те эмоции который переполнили его за этим жалких 20 мину \nПосле он удалился в туалет и начал резать руку нет невены не артерий а просто кожу и плоть, это единственный способ который он знал дабы выплеснуть эмоции\n```\n\n### Версия 3 — 2025-01-06 · повтор прежней мысли\n\nвселенная: Апостол (по дате объявления) · окно w0070 · сообщения 279044–279052\n\n*что здесь: Возврат к старой сущности и её привязка к новой вселенной*\n\n\n\n```chat\n[279044] 2025-01-06 15:24 Миколай: окей\n[279045] 2025-01-06 15:24 Миколай: ещё есть идеи\n[279046] 2025-01-06 15:24 Миколай: ?\n[279047] 2025-01-06 15:25 Слава: А насчёт озера перерождения \nЗапихаем сюда \nКак минимирок который теперь в нашем мире\n[279048] 2025-01-06 15:25 Миколай: но его нет в нашем мире? это че то оригинальное, не копия?\n[279049] 2025-01-06 15:26 Миколай: ну\n[279050] 2025-01-06 15:26 Слава: Да\n[279051] 2025-01-06 15:26 Миколай: в мире существа\n[279052] 2025-01-06 15:27 Миколай: ладно, короче я пока утомился\n```\n\n###
