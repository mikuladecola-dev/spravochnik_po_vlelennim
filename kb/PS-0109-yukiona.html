<script>const BASE="../";const DOCNAME="Юкиона";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Юкиона\n\n*персонаж* · вселенные: 7 островов\n\n## Навигация\n\n- (w0041) Четвёртый защитник от М — японская снежная дева из мифов («типо снегурочки, только опасная») с миниганом, стреляющим сосульками. Ставится на айсберг, где будет держать тотальный контроль.\n\n## Связано с\n\n7 островов, Айсберг (остров Юкионы), Миниган с сосульками\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-07-03\n\nвселенная: 7 островов (объявлено) · окно w0041 · сообщения 194785–194797\n\n*что здесь: Названа в списке защитников: юкиона с миниганом, в котором снаряд — сосульки; М поясняет, кто такая юкиона в японских мифах, С берёт на подумать.*\n\n\n\n```chat\n[194785] 2024-07-03 19:06 Миколай: 1. блуждающий огненный гриб\n2. дриада великан\n3. тот пламенный перс\n4. юкиона с миниганом в котором снаряд сосульки\n[194791] 2024-07-03 19:08 Слава: А\n[194792] 2024-07-03 19:08 Слава: Или ты про сталкера ?\n[194793] 2024-07-03 19:08 Миколай: ага\n[194794] 2024-07-03 19:08 Слава: Ну можно, ну он уже наемник хотя можно\n[194795] 2024-07-03 19:08 Слава: Юкиона ?\n[194796] 2024-07-03 19:09 Миколай: японская девушка из мифов, надо бы почитать про неё, ну короче типо снегурочки, ток опасная\n[194797] 2024-07-03 19:09 Слава: Ну надо подумать\n```\n\n### Версия 2 — 2024-07-03\n\nвселенная: 7 островов (объявлено) · окно w0041 · сообщения 194802–194804\n\n*что здесь: Развёрнутое описание (кимоно с элементами брони, футуристический миниган) — сгенерировано нейронкой по признанию М.*\n\n\n\n```chat\n[194802] 2024-07-03 19:11 Миколай: 1. Блуждающий огненный гриб:\nЭто существо представляет собой гигантский гриб с ярко-красной шляпкой, покрытой светящимися оранжевыми пятнами. Его ножка излучает тепло и мягкое свечение. Гриб способен медленно передвигаться, оставляя за собой след из тлеющих углей. В темноте он выглядит как движущийся факел, привлекая и завораживая путников.\n\n2. Дриада великан:\nЭта могучая лесная нимфа достигает высоты 10 метров. Её кожа покрыта корой и мхом, а волосы напоминают ветви с листьями. Глаза светятся мягким зелёным светом. Дриада обладает невероятной силой и способна управлять растениями вокруг себя. Она является хранительницей леса и защищает его от незваных гостей.\n\n\n\n4. Юкиона с миниганом, в котором снаряды-сосульки:\nЮкиона - это снежная дева из японского фольклора, но в этой версии она вооружена футуристическим миниганом. У неё бледная кожа, длинные белые волосы и голубые глаза. Одета в традиционное кимоно, но дополненное современными элементами брони. Её миниган стреляет острыми ледяными сосульками с невероятной скоростью, замораживая всё на своём пути. Юкиона сочетает в себе традиционную японскую мифологию и современные технологии.\n[194804] 2024-07-03 19:12 Миколай: хз, нейронка быстро набросала\n```\n\n### Версия 3 — 2024-07-03\n\nвселенная: 7 островов (объявлено) · окно w0041 · сообщения 194917–194924\n\n*что здесь: Ей отдают «грех» тоталитаризма: на айсбергах тотальный контроль, а она — ебнутая женщина с миниганом, убивающая всех ослушивающихся.*\n\n\n\n```chat\n[194917] 2024-07-03 19:52 Миколай: как думаешь, будем пихать тоталитаризм?\n[194919] 2024-07-03 19:52 Миколай: нуару например\n[194920] 2024-07-03 19:53 Слава: Ну нуар хороший челик \nА вообще можно одному из островов\n[194921] 2024-07-03 19:53 Миколай: тогда у него будет Федеративная республика\n[194922] 2024-07-03 19:53 Миколай: ну тогда дам этот грех женщине\n[194923] 2024-07-03 19:54 Миколай: на айсбергах будет тотальный контроль\n[194924] 2024-07-03 19:54 Миколай: и ебнутая женщина с миниганом убивать всех ослушивающихся\n```</div>"}];</script>
