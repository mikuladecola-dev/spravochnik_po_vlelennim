<script>const BASE="../";const DOCNAME="История про последнего человека";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># История про последнего человека\n\n*история* · вселенные: вне вселенной\n\n## Навигация\n\n- (w0108) Сюжет Славы вне вселенных: современность, манна-система, разломы с монстрами. ГГ остался единственным человеком, дерётся инстинктивно, пока высшее существо не отправляет его в прошлое.\n\n## Связано с\n\nПоследний человек, Существо-Бог\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-11-01\n\nвселенная: вне вселенной (по дате объявления) · окно w0108 · сообщения 381300–381305\n\n*что здесь: Завязка целиком: ГГ безэмоционально бьётся с ордами, его калечат, лишают глаз, ломают кости, он встаёт не из воли, а потому что иначе не может; существо-Бог наблюдает, мучается и молит его умереть; не выдержав, вмешивается и отправляет ГГ в прошлое, само попадая в НИЧТО; ГГ просыпается, видит в окне живой город, а поверх ложатся воспоминания о залитом кровью городе. Слава ставит вопрос, что ГГ должен почувствовать, и сам предполагает: в живых людях будет мерещиться их изуродованные тела, ГГ вырвет и он придёт в ужас*\n\n\n\n```chat\n[381300] 2025-11-01 20:58 Слава: Давай подумаем\n[381301] 2025-11-01 20:59 Слава: Всё просто. Я крутил сюжет в голове не связанный со вселенной. Просто простенький мирок, современность манна система и разломы откуда приходят монстры. Клише среди клишей\n[381303] 2025-11-01 21:13 Слава: И вот гг осталься единственным человеком. \nОн безэмоциональной словно больше инстинктивно сражаться с ордами чудищ. Не видя не надежды, не победы, он просто сражается как работ у которого одна цель перебить чудовищь\nЕдинственное что он слышит вокруг это мерзкий звуки издаваемый монстрами. Его ранят его рубят. В нём прорастають, его лишают глаз выпив их. Ему ломают кости руки ноги. Всё что можно, но он встаёт не из-за воли, а лишь потому что не может по другому. И где-то далеко существо выше всех являющий по сути Богом плачет. Существу жаль и больно смотреть на попытки последнего человека подняться. Его душа разрывается но оно бессильно и может лишь наблюдать, как один мир поглощает другой. Поэтому он молит, чтобы человек сдался и принял смерть, ведь для него и для человека это легче. Там больше не из-за чего сражаться всё умерли, не кого больше не ту. Лишь Орды чудовишь что желають тебе смерти, так что пожалуйста умри быстрее и бесполезно\nНо по итогу существо не выдерживает и вмешивается отправля гг  в прошлое, а само попадая в НИЧТО. \nГг просыпается и видео в окно целый город, людей и в его голове всё накладывается на те воспоминания, где город залит кровью людей \n( что вообще в этой ситуации должен почуствовать гг, он убивал монстров не из-за мести, а лишь потому что по другому не мог. Ка робот он просто убивал их. И да он будет желать всех спасти ценой себя самого, наплевав на мнение близких. Но что он почуствовает, когда вернётся в прошлое.\n[381305] 2025-11-01 21:17 Слава: Лично мне кажется, что во время просмотра в окно. Он будет смотреть на людей и в его глазах будет мерещиться их ней мёртвый изуродованный тела. И в конце он блуваенет и будет в панике даже в ужасе\n```\n\n### Версия 2 — 2025-11-02\n\nвселенная: вне вселенной (по дате объявления) · окно w0108 · сообщения 381354–381370\n\n*что здесь: Версия Миколая на реакцию ГГ: сначала шок, потом догадка про прошлое, радость что люди живы и что можно всё изменить, желание увидеть тех, кого потерял, слёзы и боль, желание сказать людям, чтобы не откладывали задуманное. Вариант с мерещащимися трупами он не принимает, но допускает как приём*\n\n\n\n```chat\n[381354] 2025-11-02 10:09 Миколай: сначала он в ахуе\n[381355] 2025-11-02 10:09 Миколай: насчёт мерещится, я никогда не рассматривал подобные сценарии и представить не могу\n[381356] 2025-11-02 10:10 Миколай: он возможно подумает, а где он\n[381357] 2025-11-02 10:10 Миколай: ага он там где был\n[381358] 2025-11-02 10:10 Миколай: но люди появились\n[381359] 2025-11-02 10:10 Миколай: может это другое время\n[381360] 2025-11-02 10:10 Миколай: прошлое\n[381361] 2025-11-02 10:10 Миколай: о я могу всё изменить\n[381362] 2025-11-02 10:11 Миколай: о как же круто, что люди живы\n[381363] 2025-11-02 10:11 Миколай: я могу с ними общаться, пусть и не знаю о чем\n[381364] 2025-11-02 10:11 Миколай: увидеть тех кого хотел\n[381365] 2025-11-02 10:12 Миколай: да он будет видеть тех кто умер, а такие все\n[381366] 2025-11-02 10:12 Миколай: и он будет плакать и ему будет больно\n[381367] 2025-11-02 10:12 Миколай: он захочет сказать им чтобы они не откладывали то, что хотели сделать в будущем\n[381368] 2025-11-02 10:13 Миколай: я такого не видел\n[381369] 2025-11-02 10:13 Миколай: я в это не поверю\n[381370] 2025-11-02 10:13 Миколай: но это можно придумать и по своему использовать\n```\n\n### Версия 3 — 2025-11-02\n\nвселенная: вне вселенной (по дате объявления) · окно w0108 · сообщения 381372–381401\n\n*что здесь: Слава добавляет главный узел: ответственность. ГГ в конце сдался, убивал без гнева, механически, а проснувшись понимает, что спасение мира скинули именно на него, и боится не справиться и повторить всё заново*\n\n\n\n```chat\n[381372] 2025-11-02 11:33 Слава: Отвественность. Гг сдался в конце но убивал он монстров больше мышеннальна и инстинктивно. При битве не было у него гнева или ярости. \nИ вот гг сдался и вот он просыпается и понимает что именно ему надо спасти мир. Именно на него скинули отвественность по спасению всему миру. И он боиться что не справиться,, боиться повторения. Он сдался но на него скинули отвественность\n--- пауза 1.7 ч ---\n[381399] 2025-11-02 13:13 Миколай: аааа\n[381400] 2025-11-02 13:13 Миколай: ну кстати да\n[381401] 2025-11-02 13:13 Миколай: это больно и тяжело\n```\n\n## Неясности\n\n- (w0108) Вселенной у истории нет по прямому заявлению автора
