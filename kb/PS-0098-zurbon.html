бер маски, ты поймёшь надеюсь) на все лицо; в плаще, а под ним черная, серая форма \nСпособности: огонь \nПриемы:\n1. Огненная пуля: его снайперская винтовка и пистолеты особой оружея под него у них нет патронов, он сам делает их с помощью огня и стреляет ими из оружия при попадания взрывается \n2. Огненненый цепи (из ладони) : может из огня сформулировать цепь и контролировать его на расстояний, защищаясь ими или атакуя, или делать как\n человек паук \n3. Подземный ад: прижимает руки к землёй, и из земли в радиусе 100 метров вырывается огненненый колы, протыкая противника \nЧерты характера; спокойный, хладнокровные; не питает не кому ненависти, но убивает по заказу\n[185094] 2024-06-21 10:52 Слава: Внешность\n[185095] 2024-06-21 10:52 Слава: Добавь\n[185096] 2024-06-21 11:04 Миколай: Имя: Зурбон\n\nВозраст: 34\n\nЛюбит: морских губок, стимпанк и  технарей\n\nНе любит: романтику, птиц (в том числе в еде)\n\nСила: 7\n\nЛовкость: 10\n\nМеткость: 3\n\nСкорость: 5\n\nКонтроль: 7\n\nОружие: маленькая секира размером с предплечье \n\nИнструмент: мешок с инвентарём на пол гектара вместимостью \n\n\nСпособности: контроль и созидание костей\n\nПриёмы:\n\n1. Костная мука: дробление костей в муку и последующее разпыление на растения увеличивает их способность к росту. Иногда они превосходят свои возможности вырастая за секунду до колоссальных размеров, что помогает ему в бою или для поднятия на высоту\n\n2. Суставная связка: созданные кости он может соединять между собой суставами для создания неких цепей или может так кости приклеивать к чему либо например к секире.\n\n3. Манипуляция собственными костями: увеличение, уменьшение, улучшение гибкости. Может как росомаха когти сделать пхех\n\nЧерты характера: очень добрый и отзывчивый, любит помогать людям, особенно тем кто шарит за технику. В бою немного конченый, цветы блять выращивает чтобы на них похоронить противника.\n\nЦилиндр на голове, медный монокль на левом глазу. Одет в чёрный фрак, галстук в стиле стимпанк, на руках
