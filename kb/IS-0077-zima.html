<script>const BASE="../";const DOCNAME="Зима";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Зима\n\n*история* · вселенные: вне вселенной\n\n## Навигация\n\n- (w0110) Рассказ С: герой после Нового года оказывается за десять тысяч километров от дома, в продуваемой деревянной халупе, и безуспешно пытается разжечь печь огнивом. Снаружи грохот упавшего дерева, входит замёрзший Дима. Обрывается на неловкой тишине.\n\n## Связано с\n\nДима, Максим, Нумерация присланных историй (Первый, Второе, Третье, Четвёртое, Пятая)\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-11-21\n\nвселенная: вне вселенной (разбор «неясно») · окно w0110 · сообщения 387578–387579\n\n*что здесь: Текст целиком одним сообщением, помечен маркером «Первый»*\n\n\n\n```chat\n[387578] 2025-11-21 18:16 Слава: Зима \n\n\nЯ никогда не думал, что после весёлого, сытого и тёплого и конечно семейной встречи нового года. Я окажусь от дома на расстоянии десяти тысяч километров. В деревянной халупе, в вокруг который ветер, снег и деревья. До ближайшего населённого пункта километра четыре. Вроде бы не далеко, но из-за ветра, что дует в твоей незащищённой лицо, и из-за рыхлого снега, в который ноги так и намеревают провалиться. Это растояние становиться для тебя в раза три длинней \nЯ же здесь, в продуваемой халупе пытаюсь затопить печь кремнем и камням, потому что один особо одарённый решил, что мы будем топить печь по старинке и выкинув спички и зажигалку. Он грандиозна вручил мне огниво и кремень. И вот сейчас я пытаюсь разжечь огонь, с помощью метода удара камня о кремень. \nНепонятной чувство, вроде руки потихоньку теряет чуствительность, но при этом жутко болять и горят от сотого попытки затопить печ. Раздражения всё росло после каждой бесполезной искры, что не попадает на газету, либо попадает, но быстро тухнет. Кого же я обманываю, почему я до сих пор здесь корчюсь. Ведь уже после десятый попытки было ясно, ничего у меня не выйдет. С другой стороны моя внутренняя гордость не позволяет пойти Максиму и сказать о своё никчёмность. Потому что я прекрасно понимаю, что он с первого раза ражет огонь. \nРезкий и громкий шум прервал мои мысли, а после дом строгнул. Из потолка посыпалась пыль и опилки. Я замер и уставился в окно с деревянной рамкой. Окно уже покрылось иней, и единственное, что я видел это красивые узоры мороза и холода. Всё это время после шума падения чего-то большого была тишина, что не прерывал не я, не кто либо еще. Но вот послышался резущий слух скрип двери и  мне в спину подул холодный воздух. Изгибаясь холод, минует мою куртку и косается моей вспотевший спины. \nЯ оглядываюсь и вижу как дверь закрывает плечистый мужчина. Инстинктивно жимая полена. И вглядываясь в спину. Я был готов дать бой. \nНо он повернулся ко мне лицом и я понял это Дима. Высокий, плечистый Дима, что имел натуральный чёрный цвет глаз, что устало глядели на меня, и чёрные волосы, который сейчас были покрыти инейм, а его любимая чёрная одежда. Сейчас его чёрная куртка была осыпана снегом и щепками от дерева, а его чёрные штаны  затверденели и не сгибались. \nОн устала пошёл оставляя за собой белый следы снега. Дойдя до скамейке, что было рядом с печкой, он присел....Нет он упал на ней и с него посыпался снег. Устала дыша, Дима снима шапку и перчатки тяжёлой дышал. \nМинуту понаблюдав за ним, я вернулся к своему делу. Но всё же решил спросить\n- а где Максим?- Дима поднял взгляд на меня и ответил. \n-да там дерево распиливает, который мы повалили-\n-ааа- констатировал я. Внутренний давай себе ответ на этот громкий шум. \nНеловкая тишина, что перебивала лишь мои не умелый попытки разжечь печь.\n[387579] 2025-11-21 18:16 Слава: Второе\n```\n\n## Неясности\n\n- (w0110) Вселенная не названа</div>"}];</script>
