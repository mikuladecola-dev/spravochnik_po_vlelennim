<script>const BASE="../";const DOCNAME="Деревня в «Закате»";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Деревня в «Закате»\n\n*монумент* · вселенные: неясно\n\n## Навигация\n\n- (w0111) Деревенский участок героя (баня, огород, топор, забор) и за забором — деревня, захваченная безкожими существами. [387600–387602].\n\n## Связано с\n\nРассказчик «Заката», Существа без кожи («куски мяса»)\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-11-21\n\nвселенная: неясно (по дате объявления) · окно w0111 · сообщения 387600–387602\n\n*что здесь: Закат над деревней без дыма и многоэтажек; жара до 40 градусов; за нерушимым забором хаос, трупы деревенских и неутихающий общий крик, который «режет не тела, а что-то первобытное»; герой берёт топор и идёт к калитке.*\n\n\n\n```chat\n[387600] 2025-11-21 18:19 Слава: Закат\nКакой же красивый закат в деревне. Когда небо не закрывает дым или многоэтажки. Ха называю красивым то, что давно перестали все называть красивым. Не знаю почему. Но в стихах и в книгах. Я давно перестал видеть строки о красивом закате. Закат все равно красивый. Словно горизонт горит, ярко-красным со смесью оранжевого огня. \nИ всю эту картину портит булькающие дыхание, этого куска мяса. Почему же он так дышит и почему он выглядит, как кусок мяса. \nДа всё просто. Потому что этот жилистый мужчина, как понятно по его гениталиям. Не имеет кожи, носа и ушей. Вот поэтому это просто кусок мяса или жира, как ходите. И из его отверстие, который находится в том месте, где обычно находиться нос и рот. Вытекает, какая-то жидкость. То рывками, то медленно. Типо вдох и течёт меньше, а выдох и вся это жидкость, словно под давлением вылетает. \nСхватив на кухни, что первая попалось. Чтобы наконец-то заткнуть это недоразумение.\n Первая, что я схватил. Оказался кухонный нож. И это не джекпот. Если вдруг, кто не знал. Кухонный нож делают тонким. Поэтому если попытаться ударить человека. То он просто прогнëтся. &quot; Ну и пофиг&quot; Промелькнула у меня в голове. \nА этот кусок мяса. Всё мнется у порога кухни. И вот он наконец собрал весь свой жировой дух. Бежит ко мне. Но его выпад. На столь вялый и медленный,  на что я медленно просто отхожу. И он врезается в кухонную мебель. Ну эти столики и гарнитуры, в которых хранится посуда. \nОн разворачивается и ищет меня взглядом. А я вот, как тут. Хватаю его за руку и начал бить ножом в глаза. Молясь, чтобы хотя бы от этого он не сломался. Но он молодец держался и не ломался, как и этот кусок мяса. Я бил точно по глазам. Бил и бил. Пока в меня из этого месиво, в место глаз. Стрельнула струя жира? Ну это точно не кровь. Кровь красная. Иногда разных оттенков. Но красная. А то, что стрельнуло в меня было жёлтым и словно сопли липкими и тягучий.\nИ вот эта струя зарядили мне ровно в лицо. Больше часть попало именно рот. И я почувствовал кислый и с прикусом прокисшего молока вкус. Что застрял, словно прилип к моему языку и горлю. Я начал задыхаться. И еле сдержавшись, чтобы не блевануть. Я начал яростно бить его ножом.\nПопутно приложившись на него всём своим весом. И я чувствовал, как руки тонут в это склизкой и фу, блять тёплой субстанций. \nПовалив его. И так, лёжа на нём продолжил бить. \nПерестал бить только, когда едва протирел  глаза и вижу нож прогнут. Отбросив это бесполезный кусок металла. Я попытался его задушить. Схватив руками его шею. И понял ещё один интересный факт. Невозможно задушить человека, вот так. Ведь он как бы не бездушная кукла. Он будет рыпаться, облеваться потом и вот так держа пальца на его шей. Ты его не задушишь. И это я понял, когда меня толчком откинули на кухонный гарнитур. Боль в спине от удара. Хоть и незначительная, но попробуй скажи это спине, которая начала уже изгибаться. Словно это поможет избавиться от боли. \nКусок мяса. Уже вскочил и почему-то начал оглядываться. &quot;Ты долбоеб. Тебе нечем оглядываться.&quot; Выругался я в голове. Хватая сковородку. И на бесшумно подхожу. К вертящиму туда сюда куску мяса. И замахнувшись. Ударяю прям в затылок. Он теряет равновесия падает. \nНа полу он начинает извиватьс  словно червяк. Из-за было сложней попасть по нему. \nНо прижав его к полу ногой. Он перестал вертеться. Вот только кроссовки точно выкидывать. \nЯ прицелился по голове и замахнувшись, как можно сильнее. Ударил его сковородкой. Его голова словна лопнула. От моего удара. И оттуда во всё стороны брызнула кровь и розовый куски. Я убрал ногу с него и отошел. \nВедь он, ну наверное помер. Его пульс проверят фуу........ Не буду.  Хотя сам уже весь в его жире и крови. Но жира здесь всё равно больше. И до сих пор вкус жира во рту. \nЯ устало вздохнул. И именно сейчас на меня навалило усталость. И дыхания стало прерывистом.\n[387601] 2025-11-21 18:19 Слава: Как не странно. Но мне захотелось встать у костра, вместе с кружкой тёплого и сладкого чая. \nЯ повертел головой. Ну эти мысли. Я подошёл к окну, у которого недавно стоял и наблюдал за красивым закатом. Солнце до сих пор медленно садилось. Но теперь горизонт был больше ало-красным. \nЯ окинул взглядом весь домик и остановившись на трупе. Подумал &quot;завтра будет жарка. Он же точно начнёт вонять и я вроде слышал, что трупы. От жары надуваются и лопаются&quot; \nЯ торопливо вышел из кухни. Не хватало мне еще, чтобы он взорвался. \nОказавшись на крыльце дома. Я нервно похлопал по карманным. Ищья сигареты. \n- да блять- выругался я. Не найдя ничего в карманах. \nНе конечно там был телефон, ключи, кошелёк и конфеты с мятой. Но здесь не было сигарет. И я вспомнил, что, как бы начал бросать курить. \nКак же невовремя, я это начал. Промелькнуло в голове. Пока я пытался открыть фантик конфетки. Но руки дрожали, словно у пьяницы. И я забив на это. Просто кинул конфетку себе в рот.\nВсё равно бумажный фантик. Перевариться, как нибудь. \nЯ начал оглядывать двор. Попутно пытаясь открыть фантик уже во рту. \nДвор, как двор. Деревянная баня, трава, которая уже по колено. Огородик, на котором росли кусты и сорняки. И сиротливый топор, который лежал на траве, а вокруг него пару дровишек. Это я днём хотел баню затопить и начал рубить дрова. Но дрова особо не нарубишь, когда в твой затылок прожигает солнце. Да была жара, который днём почти достигала 40 градусов. \nКак и говорил двор,  как двор. А вот за двором, за нерушимом забором была не просто деревня. Там был хаус, страх и ужас. \nБыло слышно множества криков, что переплетались в один. Этот крик был неутихаем. И вряд ли он утихнет. Пока всё живой, не погибнете в этой деревне. \nЕсли честно. Эти месива без кожи, что бегали по всей деревне и даже трупы деревенских. Не были так страшны, как крики. Что резали словно нож. И резали они не тела, а что-то первобытное. Что-то, что осталось у каждого человека от предков. \nНо вот у меня, он вызывал лишь раздражения. Ведь я хотел успокоить организм, а этот крик словно гром, бьёт точно по нервам. \nЯ торопливой походкой пошёл калитки. Но слегка остановившись у топора. Взял его, и вместе с ним уже пошёл к выходу из моего участка.\n[387602] 2025-11-21 18:19 Слава: Черновики\n```\n\n## Часть чего\n\nЗакат\n\n## Неясности\n\n- (w0111) Откуда взялись существа и что происходит в деревне — не объяснено.</div>"}];</script>
