тановления энергии.\n\n9. Металлоид (Metalloid):\n- Способности: \n  - Металломорфизм: Может превращать части своего тела в различные металлы, от легких и гибких до тяжелых и прочных.\n  - Металлический контроль: Управляет металлами, создавая оружие, щиты или ловушки.\n  - Формирование и восстановление: Способен быстро восстанавливать повреждения или менять форму своего тела для адаптации к ситуации.\n\n10. Пироманта (Pyromanta):\n- Способности: \n  - Пирокинез: Управляет огнем и плазмой, создавая огненные сферы, взрывы или огненные вихри.\n  - Плазменная форма: Может принимать форму плазменного облака, становясь неосязаемой и невидимой для обычных глаз.\n  - Тепловое видение: Видит в инфракрасном спектре, обнаруживая врагов через стены или в темноте.\n\n11. Нейроглиф (Neuroglyph):\n- Способности: \n  - Нейропрограммирование: Может записывать и стирать воспоминания, управляя эмоциями и поведением жертвы.\n  - Гипноз: Вводит цель в транс, заставляя выполнять команды.\n  - Ментальная связь: Создает ментальную сеть с союзниками, позволяя им обмениваться мыслями и чувствами мгновенно.\n[167452] 2024-05-10 08:46 Миколай: 7. Изменяющий форму: Пришелец, способный изменять свою форму и внешность по желанию. Может имитировать внешний вид любого живого существа или предмета, что позволяет ему быть невероятно адаптивным и непредсказуемым в боевых и разведывательных ситуациях.\n\n8. Телекинетик: Пришелец обладает способностью перемещать предметы силой мысли. Эта сила может быть настолько сильной, что позволяет ему поднимать тяжелые объекты, создавать защитные барьеры из окружающего пространства или даже манипулировать элементами окружающей среды.\n\n9. Мастер времени: Пришелец с возможностью замедлять или ускорять время вокруг себя или в определенной локации. Это дает ему преимущество в бою и возможность избегать опасностей, а также может использоваться для стратегических маневров и решения сложных задач.\n\n10. Энергетический вампир: Пришелец, который питается энергией других  от глубоких синих и фиолетовых оттенков до светящихся золотых и красных.\n   - *Блики и отражения:* Эффект переливающихся бликов, меняющихся в такт вибрациям.\n\n### Символы и визуальные элементы:\n1. Гармонические резонаторы:\n   - *Резонаторы на теле:* Внешние элементы на теле могут напоминать резонаторы или динамические эквалайзеры, визуально вибрирующие.\n   - *Звуковые круги:* От тела исходят круги или волны, как от капли, падающей в воду.\n\n2. Инструменты контроля звука:\n   - *Звуковые камертонные антенны:* Специфические антенные структуры на голове или плечах, похожие на камертоны или тюнинг-форки.\n   - *Динамические перчатки:* Перчатки с резонаторными узорами, позволяющие влиять на вибрации материалов.\n\n### Черты лица и выражения:\n1. Лицо как динамик:\n   - *Губы-резонатор:* Губы или рот могут выглядеть как динамик, из которого исходят звуковые волны.\n   - *Глаза-эквалайзеры:* Глаза отображают спектр звука или меняют цвет в зависимости от частоты волн.\n\n2. Экспрессия вибраций:\n   - *Мимика:* Лицо меняет форму и структуру в зависимости от интенсивности звука, создавая иллюзию вибрации.\n\n### Одежда и аксессуары:\n1. Звуковой костюм:\n   - *Пульсирующий костюм:* Костюм, который визуально пульсирует или вибрирует вместе с телом.\n   - *Звуковые узоры:* Узоры на костюме меняются в зависимости от использованных способностей.\n\n2. Резонансный плащ:\n   - *Плащ, реагирующий на вибрации:* Плащ, изменяющий форму при вибрациях, создавая эффект волнообразного движения.\n\n### Особенности движения:\n1. Перемещения звуковыми волнами:\n   - *Звуковой телепорт:* Омниграф может исчезнуть в одном месте и появиться в другом, словно передаваясь через звуковую волну.\n   - *Полет на вибрациях:* Летает, создавая под собой вибрационные волны, которые визуально напоминают звук.\n\n### Примеры визуальных символов и деталей:\n1. Звуковые кольца:\n   - Вокруг персонажа постоянно формируются кольца звуковых волн, которые усиливаются при использовании способностей.\n\n2. Р
