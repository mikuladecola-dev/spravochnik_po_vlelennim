const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Артефакты\n\n*способность* · вселенные: Апостол, Оам, Падения небес\n\n## Навигация\n\n- (w0023) Слава спрашивает, как встроить в энергетический мир артефакты, и перечисляет пять предметов: посох, меч-палку, копьё, костюм и маску. На следующий день Миколай переспрашивает, в чём именно затык.\n- (w0071) Слава спрашивает, как добавить артефакты в мир и откуда они там берутся. Миколай предлагает подряд два варианта происхождения артефактов, Слава в ответ уточняет правила благословений.\n- (w0075) Упомянуты одним словом в перечислении рассказчика: защитник должен узнать о чужемирцах, о благословенных, об артефактах. Разработки в окне нет.\n- (w0099) Объекты, несущие силу правителя. Раскрыть их мощь лучше всего способен обычный человек, а не носитель силы.\n- (w0107) Предметы, сделанные из материалов, лежавших близко к метеориту, либо из осколков самого метеорита.\n\n## Связано с\n\nАртефакты с символикой, Благословение, Благословенные, Защитник, Камень желания, Контракт и правила агента АЗИП, Мир Оам, Мир с поглощением энергии, Оам, Поглощение энергии и связь, Правители, Правители минимиров, Чужемирцы\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-01-30\n\nвселенная: Падения небес (по дате объявления) · окно w0023 · сообщения 101998–102001\n\n*что здесь: перечислены пять артефактов: посох для лучшего контроля энергии; «меч» — круглая палка с переходом до рукояти, вибрацией уничтожающая всё, чего коснётся; копьё, режущее и контролирующее любую энергию; костюм со сменой вида, хорошей защитой и кинетическим выстрелом; маска всевидения, дающая невидимость и иллюзии*\n\n\n\n```chat\n[101998] 2024-01-30 14:25 Слава: А и как туда ещё запихать артефакты а то у меня есть очень хороший персонажи который пользуется артефактами\n[101999] 2024-01-30 14:25 Миколай: По типу\n[102000] 2024-01-30 14:25 Миколай: Какие\n[102001] 2024-01-30 14:29 Слава: Посох который способен помогать владельцу лучше контролировать энергию\nМеч ( не совсем меч просто круглая палка с переходом до рукоятия ) способен вибраций уничтожить все к чему прикоснуться \nКопей которая способная разрезать контролировать любую энергию \nКостюм который может менять вид имеет хорошую защиту и кинетический выстрел \nМаска все видения способная видеть все объекты который захочет и делать владельцу невидимым или делать иллюзию\n```\n\n### Версия 2 — 2024-01-31 · повтор прежней мысли\n\nвселенная: Падения небес (по дате объявления) · окно w0023 · сообщения 102320–102325\n\n*что здесь: возврат: Миколай уточняет, что именно не получается встроить; продолжения в окне нет*\n\n\n\n```chat\n[102320] 2024-01-31 13:17 Миколай: Так\n[102321] 2024-01-31 13:18 Миколай: Ну а в чем собственно проблема не пон\n[102322] 2024-01-31 13:18 Миколай: Что не можешь запихать\n[102324] 2024-01-31 13:18 Миколай: Поч не можешь\n[102325] 2024-01-31 13:27 Миколай: От этого мои покумекалки уже будут более конкретизированными\n```\n\n### Версия 3 — 2025-01-13\n\nвселенная: Апостол (по дате объявления) · окно w0071 · сообщения 281363–281372\n\n*что здесь: первый вариант происхождения: правители при создании своих миров периодически тратили энергию на создание артефактов, в которые заключали идеи*\n\n\n\n```chat\n[281365] 2025-01-13 18:21 Слава: А и вот как добавить артефакты в мир?\n[281366] 2025-01-13 18:22 Миколай: давай обманем систему нахуй суициднемся тогда всё будет проще и лучше, не позволим ей судьбу контролировать\n[281367] 2025-01-13 18:22 Миколай: типа\n[281368] 2025-01-13 18:22 Слава: Сразу всё благословенный равны по силе, путь то благословенный Богом, дьяволом, или другими правителем минимиров\n[281369] 2025-01-13 18:23 Слава: Гениально\n[281370] 2025-01-13 18:23 Слава: Артефакты как добавить, типо откуда они появится\n[281371] 2025-01-13 18:24 Миколай: ну правители при создании своих миров периодически тратили энергию на создание артефактов в которых заключали идеи\n[281372] 2025-01-13 18:24 Миколай: ИЛИ\n```\n\n### Версия 4 — 2025-01-13\n\nвселенная: Апостол (по дате объявления) · окно w0071 · сообщения 281372–281386\n\n*что здесь: второй вариант («ИЛИ»): около 15 веков назад благословенные были мощнее, но их реже призывали, поэтому они оставляли силу потомкам и заключали её в артефактах; тут же оговорка, что про мощь можно убрать, а мотив оставить заботой о будущем*\n\n\n\n```chat\n[281372] 2025-01-13 18:24 Миколай: ИЛИ\n[281373] 2025-01-13 18:26 Миколай: раньше веков 15 назад благословенные были мощее но типа их реже призывали поэтому они оставляли силу потомкам\n[281374] 2025-01-13 18:26 Миколай: и заключали её в артефактах\n[281375] 2025-01-13 18:26 Миколай: ну мб про мощь убрать можно\n[281376] 2025-01-13 18:26 Миколай: просто думали что благословенных больше не будет и заботились о будущем\n[281377] 2025-01-13 18:26 Миколай: хз\n[281378] 2025-01-13 18:27 Миколай: вижу тебе понравилось\n[281379] 2025-01-13 18:28 Слава: Благословений это временная сила, типа еë нельзя долго сохранять \nНапример огонь стрельнуть по дереву оно горит, а после отключение благословенной огонь сразу исчезает\n[281380] 2025-01-13 18:28 Миколай: ну мб раньше был способ\n[281381] 2025-01-13 18:28 Миколай: ну ладно\n[281382] 2025-01-13 18:28 Слава: Благословений не может быть активным постоянная, это тратит выносливость\n[281383] 2025-01-13 18:29 Слава: Че по персу?\n[281384] 2025-01-13 18:29 Миколай: 🌚\n[281385] 2025-01-13 18:30 Слава: Вообще я вроде как 5 придумал ну расскажу при встрече\n[281386] 2025-01-13 18:30 Миколай: а я\n```\n\n### Версия 5 — 2025-02-12\n\nвселенная: Апостол (по дате объявления) · окно w0075 · сообщения 288545–288545\n\n*что здесь: Первое упоминание артефактов в перечне того, что защитнику предстоит узнать*\n\n\n\n```chat\n[288545] 2025-02-12 17:28 Слава: Ну может быть собаку кошку жуёт или наоборот, какая к чёрту разница. Но его мнения изменилась, когда он увидел тощий силуэт покрытой шерстью. Он мгновенно протрезвел, его мысль стали четками и ясными, как никогда. Он начал красться к силуэту. Но силуэт услышал его. Обернувшись он мгновенно кинулся на мужчину. А наш мужчина, перехватив поудобнее бутылку вмазал ею по морде недо обратная. И пока зверь хватался за нос. Защитник снова почувствовав гнев, начал тыкать розочкой этого обратная во всё места. И когда оборотень не подавал признаков жизни, вдруг решил потащить этот труп в свой дом. Словно пытаясь так принести какой-то ритуал. Ну и до таща это то  тело кое как. Он лёг на кровать и сразу вырубился. Спал он крепко, как не всё той время. Проснувшись и поняв, что находится здесь, он в порыве гнева решает жечь этот дом, но увидев труп обратная, настоящего обратная. Он всё понял. Всё сразу стала на свои места. И он понял, что надо сделать. Сначала он записался во всё возможное спорт клубы, потом вылил весь алкоголь или какие ещё спиртные напитки в раковину, а в унитазе смыл все колёса. Он снова начал работать. Вообще ему было тяжело посещать несколько спорт клубов ещё он сам давно не мальчик, поэтому тренировки давались вдвойне тяжелее. Но он не остановился он не щадил свой организм, свой тело, возможно внутренний виня и свой тело тоже. И жил от так лишь тренировками и работой на протяжении 2-х лет. За этой время он убрался в своём доме и закопал труп в подвале дома, поставил фотки своих дорогих девушек, заработал кругленькую сумму. Купил огнестрельное и холодное оружие. Смог привести себя в хорошую физическую форму. И начал полномасштабную охоту на нас. Сначала он просто гулял ночью в попытках встретить нас, дурак, в этих прогулках он чаще избивал недо бандитов и мелких хулиганов и насильников если честно ему от частей была по-барабану на всех их. Но у него было раздражение, что он не мог найти нас, поэтому он и избивал их. Потом он решил отслеживать
