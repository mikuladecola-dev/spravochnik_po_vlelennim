нако, Потас заметив её чувства решил поддержать. Он написал ей в личку. Она не знала, что с ней общается кумир. Ваёль записал себя как юзер764\n\nИ все же когда они более менее стали хорошо общаться, Тосыч узнал с кем имеет дело и был удивлён, и интересовался почему именно с ним он решил общаться\n\nВике было грустно, но всё-таки Ваёль смог её успокоить. Они общаются целую неделю и за это время очень сблизились. И всё бы было так вкусно сладко и приторно, пока Ваёль не предложил..\n\n\nНо, прежде чем узнать, что он предложил, предложу ознакомиться с тем какие примерно композиции Ваёля слушает Вика, чтобы понять, какой до сих пор вайб сохраняется в её жизни. Тобиж, для ознакомительных целей\n[176754] 2024-06-07 19:07 Слава: Это\n[176755] 2024-06-07 19:07 Миколай: Это начало истории\n[176756] 2024-06-07 19:07 Миколай: Внимание!! Ниже представлено продолжение истории с Тосычем и Ваёлем, а так же материал для вдохновения. У этих работ довольно-таки жуткое содержание:\n\n| Продолжение\n| Вдохновение\n[176757] 2024-06-07 19:08 Миколай: Продолжение и видео от куда я полностью всю идею спиздил\n[176758] 2024-06-07 19:11 Слава: Бля я только это видео видел\n[176759] 2024-06-07 19:11 Миколай: ?\n[176760] 2024-06-07 19:11 Миколай: Недавно посмотрел?\n[176761] 2024-06-07 19:11 Слава: Вдохновение твой\n[176762] 2024-06-07 19:11 Слава: Видел\n[176763] 2024-06-07 19:12 Слава: Не смотрел\n[176764] 2024-06-07 19:12 Миколай: Ааа, понял\n[176765] 2024-06-07 19:12 Миколай: Ну вот, история основана на его сюжете\n```\n\n## Неясности\n\n- (w0036) Совпадение Вики из текста и женщины с рисунка прямо не заявлено</div>"}];</script>
