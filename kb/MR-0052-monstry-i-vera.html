И он же умер\n[217843] 2024-08-11 16:54 Миколай: в этого верил весь город и кто-то из интернета\n[217844] 2024-08-11 16:55 Миколай: да\n[217845] 2024-08-11 16:55 Миколай: его убили\n[217846] 2024-08-11 16:55 Миколай: но когда\n[217847] 2024-08-11 16:55 Слава: И как он умер, вираже осталась\n```\n\n### Версия 2 — 2024-08-11\n\nвселенная: монстры (по дате объявления) · окно w0051 · сообщения 217847–217870\n\n*что здесь: Оговорки к правилу: вера действует не сразу и не всегда взаимодействует с миром даже при негативных мыслях; монстр может не родиться от веры, может умереть, даже если в него верят, может родиться заново. У монстра один родитель, чем больше людей разделяют веру, тем он могущественнее. Одно убийство делает духа злым.*\n\n\n\n```chat\n[217847] 2024-08-11 16:55 Слава: И как он умер, вираже осталась\n[217848] 2024-08-11 16:56 Миколай: о нем знали мб помнили, но он уже не вызывал ужаса, почти на всех балконах защита, родители детей не подпускают к балконам\n[217849] 2024-08-11 16:56 Слава: Вера\n[217850] 2024-08-11 16:56 Слава: Так в него же все равно верят\n[217851] 2024-08-11 16:57 Миколай: крч\n[217852] 2024-08-11 16:57 Миколай: монстров вера не сразу поражает\n[217853] 2024-08-11 16:57 Слава: Пиши\n[217854] 2024-08-11 16:57 Миколай: не всегда даже при негативных мыслях они взаимодействуют с с миром\n[217855] 2024-08-11 16:57 Слава: Я пока ем\n[217856] 2024-08-11 16:57 Миколай: приятного аппетита\n[217857] 2024-08-11 16:58 Миколай: они могут и не родиться от веры\n[217858] 2024-08-11 16:58 Миколай: они могут умереть\n[217859] 2024-08-11 16:58 Миколай: даже если в них верят\n[217860] 2024-08-11 16:59 Миколай: могут заново родиться\n[217861] 2024-08-11 16:59 Миколай: у монстра есть один родитель\n[217862] 2024-08-11 16:59 Миколай: чем больше других людей разделяют веру в него тем могущественнее он становится\n[217863] 2024-08-11 17:00 Миколай: защитник не слабак\n[217864] 2024-08-11 17:00 Миколай: а вот монстр к тому моменту порядком ослабел\n[217865] 2024-08-11 17:00 Миколай: защитник его смог убить ибо как минимум он его может коснуться\n[217866] 2024-08-11 17:01 Миколай: а об оружии его не говорилось\n[217867] 2024-08-11 17:02 Миколай: то что он насильно может скинуть людей, ну сейчас он даже ребенка бы не скинул\n[217868] 2024-08-11 17:02 Миколай: одно убийство делает дух злым\n[217869] 2024-08-11 17:02 Миколай: ииии\n[217870] 2024-08-11 17:02 Миколай: самое главное\n```\n\n### Версия 3 — 2024-08-11\n\nвселенная: монстры (по дате объявления) · окно w0051 · сообщения 217911–217946\n\n*что здесь: Разбор смерти: вера определяет только силу материализации, а не бессмертие; материализацию можно убить при взаимодействии с ней. Версия про стирание памяти о существе после смерти родителя выдвинута и тут же отменена под возражением Славы про СМИ. Итог: остаётся не вера, а легенда, которую форсят копипасты; истинная вера только у родителя, без него существо может трансформироваться, но прежним не станет. Механизм материализации сложный, автор говорит, что придётся писать целое эссе.*\n\n\n\n```chat\n[217911] 2024-08-11 17:23 Миколай: если про рождение, эт просто примеры разнообразия хз, захотел у нейронки узнать и заодно кинул сюда\n[217912] 2024-08-11 17:24 Слава: И почему монстр не умер, если Кирилл сдох\n[217913] 2024-08-11 17:26 Миколай: так не один Кирилл в него верит, родители в плане тот кто определяет его характер\n[217914] 2024-08-11 17:26 Слава: И в каком смысле он умирает если вера\n[217915] 2024-08-11 17:26 Миколай: его внешность и суть\n[217916] 2024-08-11 17:26 Слава: Осталась\n[217917] 2024-08-11 17:26 Миколай: ну так она определяет силу его материализации не более\n[217918] 2024-08-11 17:27 Миколай: если ты взаимодействуешь с этой материализацией, ты можешь её убить\n[217919] 2024-08-11 17:27 Миколай: он может умереть\n[217920] 2024-08-11 17:28 Миколай: и если бы Кирилл был жив была бы возможность возродится\n[217921] 2024-08-11 17:28 Слава: Но вера осталась\n[217922] 2024-08-11 17:29 Миколай: возможно при смерти этой материальной сущности после смерти родителя, умирают и воспоминания у людей об этой сущности\n[217923] 2024-08-11 17:29 Миколай: ну и вера бывает разная\n[217924] 2024-08-11 17:29 Миколай: ало\n[217925] 2024-08-11 17:29 Слава: Тогда массовая потеря памяти\n[217926] 2024-08-11 17:29 Миколай: но\n[217927] 2024-08-11 17:29 Слава: Это глупо\n[217928] 2024-08-11 17:29 Миколай: почему\n[217929] 2024-08-11 17:30 Миколай: просто стирается существование этого существа\n[217930] 2024-08-11 17:31 Слава: Массовая потеря памяти и даже СМИ который все это записывали и снимали все забыли\n[217931] 2024-08-11 17:31 Миколай: так\n[217932] 2024-08-11 17:31 Миколай: погоди тогда\n[217933] 2024-08-11 17:31 Миколай: ну епта, нет массовой потери памяти тогда\n[217934] 2024-08-11 17:32 Миколай: вера осталась\n[217935] 2024-08-11 17:32 Миколай: но это не надо конкретно верой называть\n[217936] 2024-08-11 17:32 Миколай: просто вот мол легенда епт\n[217937] 2024-08-11 17:32 Миколай: это форсят копипасты\n[217938] 2024-08-11 17:32 Слава: Вера осталась значит монстр жив\n[217939] 2024-08-11 17:32 Миколай: истинная вера только у родителя\n[217940] 2024-08-11 17:33 Миколай: никто не знает существо также как родитель\n[217941] 2024-08-11 17:33 Миколай: без него оно может трансформироваться\n[217942] 2024-08-11 17:33 Миколай: но оно не станет таким же\n[217943] 2024-08-11 17:33 Миколай: механизм материализации сложный\n[217944] 2024-08-11 17:34 Миколай: походу придётся целое эссе писать\n[217945] 2024-08-11 17:34 Миколай: есть ещё вопросы\n[217946] 2024-08-11 17:34 Миколай: ?\n```\n\n### Версия 4 — 2024-08-11\n\nвселенная: монстры (по дате объявления) · окно w0051 · сообщения 217983–217990\n\n*что здесь: Дополнение: основное желание родителя отражается на монстре (Кирилл хотел просто полетать); монстр становится злым от страха окружающих, потому что страх — сильная эмоция; вера у всех влияет на материализацию одинаково, разное только качество.*\n\n\n\n```chat\n[217983] 2024-08-11 17:53 Слава: Это причем\n[217984] 2024-08-11 17:53 Миколай: основное желание родителя отражается на монстре\n[217985] 2024-08-11 17:53 Слава: И почему вообще монстр стал злым ведь вера обычного народа влиять на него слабо\n[217986] 2024-08-11 17:54 Миколай: его боялись, страх это сильная эмоция\n[217987] 2024-08-11 17:54 Слава: Я про то что ты написал что родитель 100 суицидник\n[217988] 2024-08-11 17:54 Миколай: у всех вера влияет одинаково на материализацию\n[217989] 2024-08-11 17:54 Миколай: качество разное\n[217990] 2024-08-11 17:55 Слава: Тогда он должен быть бессмертным если вера влиять одинаково\n```\n\n## Неясности\n\n- (w0051) Вселенная нигде не названа. Обсуждение обрывается на вопросах Славы и продолжается в следующем окне.</div>"}];</script>
