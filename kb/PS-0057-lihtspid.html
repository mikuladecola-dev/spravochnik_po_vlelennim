<script>const BASE="../";const DOCNAME="Лихтспид";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Лихтспид\n\n*персонаж* · вселенные: игра бога\n\n## Навигация\n\n- (w0030) Скоростной электрический пришелец с узорами Лихтенберга по чёрному телу. Вырос из запроса С на элемент «молния» и на перса типа Флэша; после правок по балансу С называет его самым лучшим из набора и относит к одобренным.\n\n## Связано с\n\nТорфолихт, многоликий, щекотание атомов\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-04-06\n\nвселенная: игра бога (по дате объявления) · окно w0030 · сообщения 154436–154450\n\n*что здесь: Досостояние: сначала предлагался перс, создающий и управляющий блуждающим огнём и поглощающий молнию, чтобы заряжать эти огни. С отклоняет — лучше чисто молния, тип Флэша, сразу видно бегун; прежнее описание объявляется неактуальным.*\n\n\n\n```chat\n[154436] 2024-04-06 18:17 Слава: Ну или элемент то бишь огонь молния\n[154439] 2024-04-06 18:49 Миколай: Крч\n[154440] 2024-04-06 18:49 Миколай: Его способность создавать и управлять блуждающим огнём\n[154441] 2024-04-06 18:50 Миколай: Но он умеет поглощать молнию и заряжать эти огни\n[154442] 2024-04-06 18:51 Слава: Не лучше наверное чисто молния\n[154443] 2024-04-06 18:51 Слава: Наверное будет типо Флэша\n[154444] 2024-04-06 18:52 Миколай: Ммм\n[154445] 2024-04-06 18:52 Слава: Типо посмотри на его изображения\n[154446] 2024-04-06 18:52 Слава: Сразу видно бегун\n[154447] 2024-04-06 18:52 Миколай: А если так\n[154448] 2024-04-06 18:52 Миколай: Ну ладно\n[154449] 2024-04-06 18:52 Слава: Нееееееет\n[154450] 2024-04-06 18:52 Слава: Верни старого\n```\n\n### Версия 2 — 2024-04-06\n\nвселенная: игра бога (по дате объявления) · окно w0030 · сообщения 154457–154472\n\n*что здесь: Карточка Лихтспида: стройный гуманоид с полностью чёрным телом и светящимися фигурами Лихтенберга, планета с постоянными разрядами, язык из очень быстрых щелчков и треска, быстрый метаболизм. Механика — резкая смена упругости тела. Атаки: Шторм Лихтенберга, Резонансный взрыв, Молния Лихтенберга (парализует), ЭМИ-импульс; трюки: Молниеносный рывок, Грозовой прыжок, сжатие до крошечных размеров, смена формы тела на обтекаемую, отталкивание от стен как упругий мяч.*\n\n\n\n```chat\n[154457] 2024-04-06 19:06 Миколай: Тогда все это описание не актуально\n[154458] 2024-04-06 19:07 Миколай: Вот всё что я смог выцепить у нейронки пока она не крашнулась\n[154459] 2024-04-06 19:07 Миколай: Представляю вашему вниманию пришельца под названием Лихтспид.\n\nВнешне Лихтспид выглядит как стройный гуманоид с полностью черным телом, покрытым светящимся узором в виде фигур Лихтенберга. Его тело гибкое и приспособлено для быстрого передвижения.\n\nЛихтспиды обитают на планете с уникальной атмосферой, в которой постоянно происходят электрические разряды и другие необычные явления. Они способны заряжать окружающую среду узорами Лихтенберга, создавая таким образом красивые и завораживающие картины.\n\nГлавная особенность Лихтспидов - их невероятная скорость. Они могут резко менять упругость своего тела, что позволяет им совершать молниеносные рывки и маневры. В естественной среде они используют это для охоты и избегания опасностей.\n\nЛихтспиды разумны и обладают быстрым метаболизмом. Они постоянно находятся в движении и любят скорость. Их язык - серия очень быстрых щелчков и треском, напоминающих электрические разряды.\n\nВстреча с Лихтспидом - это всегда яркое и волнующее событие. Их скорость и способность &quot;рисовать&quot; электричеством никого не оставят равнодушным. Это поистине дети скорости и энергии, воплощение динамики и силы.\n\nЛихтспид способен совершать поистине эпичные и разрушительные атаки, используя свою способность управлять разрядами Лихтенберга и щекотать атомы.\n\nОдна из его фирменных атак - Шторм Лихтенберга. Лихтспид создает вокруг себя бушующую электрическую бурю, наполненную хаотичными разрядами в виде прекрасных узоров. Эта буря поражает всех врагов в радиусе действия, нанося им серьезный урон.\n\nДругая впечатляющая способность - Резонансный взрыв. Лихтспид щекочет атомы цели на их резонансной частоте, вызывая мощный взрыв изнутри. Это очень эффектная и опустошительная атака, способная уничтожить даже крупных и хорошо защищенных противников.\n\nЛихтспид также может сфокусировать разряды в направленный луч, создавая атаку Молния Лихтенберга. Этот луч не только наносит урон, но и временно парализует цель красивыми узорами электричества.\n\nДля борьбы с техникой врагов у Лихтспида есть ЭМИ-импульс - мощный электромагнитный импульс, выводящий из строя электронику и механизмы в большом радиусе.\n\nКомбинируя эти атаки в связки, Лихтспид становится по-настоящему грозным противником. Он может, например, ослепить врагов вспышкой, затем поразить их Штормом Лихтенберга, и добить парализованных Резонансным взрывом. Сражаться с ним - все равно что попасть в эпицентр грозы, полной первозданной мощи и завораживающей красоты электрических разрядов.\n\nСпособность менять упругость тела в сочетании с контролем над электричеством позволяет Лихтспиду совершать поистине впечатляющие трюки и маневры.\n\nОдним из его коронных приемов является Молниеносный рывок. Лихтспид резко меняет упругость своих мышц, многократно увеличивая их силу, и совершает невероятно быстрый бросок в любом направлении. Со стороны это выглядит как мгновенное исчезновение и появление в другом месте, сопровождаемое электрическим треском.\n\nНе менее эффектен трюк Грозовой прыжок. Лихтспид накапливает энергию в своем теле, сжимаясь подобно пружине, а затем резко высвобождает ее, взмывая на огромную высоту. В верхней точке он иногда создает красивые электрические узоры, зависая на мгновение в воздухе.\n\nЛихтспид способен сжиматься до невероятно малых размеров, протискиваясь сквозь крошечные щели и отверстия. Это позволяет ему проникать практически куда угодно и застигать врагов врасплох.\n\nВ бою Лихтспид постоянно находится в движении, отталкиваясь от стен, потолка и других поверхностей. Его тело при этом работает как идеальный упругий мяч, позволяя совершать немыслимые маневры на огромной скорости.\n\nЛихтспид также может менять форму своего тела, делая его более обтекаемым для уменьшения сопротивления воздуха. Соединяя это с электрической тягой, он способен развивать просто фантастическую скорость.\n[154460] 2024-04-06 19:07 Слава: Ну оно даёт почву для размышления\n[154461] 2024-04-06 19:07 Миколай: Ага\n[154463] 2024-04-06 19:07 Миколай: Нейронка смогла с помощью этого что-то придумать\n[154472] 2024-04-06 19:09 Миколай: Тут я написал крч и описание и способности и трюки\n```\n\n### Версия 3 — 2024-04-06\n\nвселенная: игра бога (по дате объявления) · окно w0030 · сообщения 154473–154484\n\n*что здесь: Правка баланса: С считает щекотание атомов имбой; М объясняет, что имел в виду природу молнии, а резонанс придумала нейронка. Решение — резонанс не убирать, но ослабить: на людей действует слабее, на сильного противника ещё слабее; атаки он делает на дистанции. С: «а так самый лучший».*\n\n\n\n```chat\n[154473] 2024-04-06 19:14 Слава: Да же какой то через чур инбаласный \nЩекотать атомы\n[154474] 2024-04-06 19:15 Миколай: Это я придумал\n[154475] 2024-04-06 19:15 Миколай: Ну он не совсем верно понял\n[154476] 2024-04-06 19:15 Миколай: Я имел ввиду именно молния создаётся в атмосфере из-за того что атомы щекочат\n[154477] 2024-04-06 19:15 Миколай: Я так это понимаю\n[154478] 2024-04-06 19:16 Миколай: А тут он придумал делать резонанс\n[154479] 2024-04-06 19:16 Миколай: Это прикольно но для баланса можно убрать или ослабить\n[154480] 2024-04-06 19:17 Слава: Ну можно что бы на людей он действовал слабей и если противник сильный то ещё слабее\n[154481] 2024-04-06 19:17 Миколай: А так норм?\n[154482] 2024-04-06 19:18 Миколай: И врд на дистанции он атаки делает\n[154483] 2024-04-06 19:18 Слава: А так самый лучший\n```</div>"}];</script>
