 сразу закрыли. Вооружившись все тем можно ( ножами). Ждали держась подальше от окон.\nИ как вдруг в окно влетает этот тварь и встав в стойку прыжка прыгает на самого большого, пытаясь попасть зубами по шей, но качок не промах и смог увернуться, но все равно упал вместе с ним на землю. Второй пацан долго не стоял и начал тыкать тварь куда только можно, а там уже все про соединились, и убили тварь. Пацан который спал днём сразу начал хватать вещи и в машину садиться, чтобы уехать. Ну всё тоже начали собираться, только садиться начинают как из озера ещё штук 30 твари вылазит научила. Ну они уехали\n[215836] 2024-08-08 18:29 Слава: И\n[215837] 2024-08-08 18:29 Слава: Норм ?\n[215838] 2024-08-08 18:30 Миколай: прости я не читал ещё\n[215839] 2024-08-08 18:30 Миколай: сейчас начинаю\n[215841] 2024-08-08 18:33 Миколай: норм\n[215842] 2024-08-08 18:33 Миколай: с первой попытки?\n[215843] 2024-08-08 18:33 Миколай: или это не первый вариант истории?\n[215844] 2024-08-08 18:33 Слава: Ну в голове с третий\n[215845] 2024-08-08 18:34 Миколай: неплохо\n[215846] 2024-08-08 18:34 Миколай: и\n[215847] 2024-08-08 18:34 Миколай: хочешь прорабатывать?\n[215848] 2024-08-08 18:35 Слава: Если что я дом крашу поэтому в эти пару дней не буду нормально отвечать\n[215849] 2024-08-08 18:35 Слава: Не просто\n[215850] 2024-08-08 18:35 Миколай: понимаю\n[215851] 2024-08-08 18:35 Слава: Ну вообще да\n[215852] 2024-08-08 18:35 Слава: Смотри\n[215853] 2024-08-08 18:35 Миколай: всм\n[215854] 2024-08-08 18:35 Слава: Не пиши\n[215855] 2024-08-08 18:36 Слава: Я хочу построить вселенную на из мини истории\n[215857] 2024-08-08 18:36 Слава: То бишь вот это история \nПотом другая связанная с первой но другая\n[215858] 2024-08-08 18:37 Слава: У нас есть первый монстр \nТварь\n[215859] 2024-08-08 18:38 Миколай: так\n[215860] 2024-08-08 18:38 Миколай: их же дохуя, не\n[215861] 2024-08-08 18:38 Миколай: ?\n[215862] 2024-08-08 18:38 Миколай: че за тварь\n[215863] 2024-08-08 18:38 Слава: Какого ?\n[215864] 2024-0
