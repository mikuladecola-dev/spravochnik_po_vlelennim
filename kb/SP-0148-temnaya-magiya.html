const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Тёмная магия\n\n*способность* · вселенные: неясно\n\n## Навигация\n\n- (w0068) Спорное понятие Миколая: не отдельная магия, а обиходное название категории магии, применяемой скрытно или во зло. Слава отрицает её существование.\n\n## Связано с\n\nМагия контроля (благословения), Тёмный эльф (персонаж Миколая)\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-12-23\n\nвселенная: неясно (по дате объявления) · окно w0068 · сообщения 273515–273521\n\n*что здесь: Заявлено при описании персонажа: он тёмный эльф, поэтому тёмная магия развита хорошо; на вопрос Славы Миколай отвечает, что это обобщённое название магии, которую можно использовать скрытно или явно плохо*\n\n\n\n```chat\n[273515] 2024-12-23 19:01 Миколай: цель открытая: стать королём\n\nполная цель изменить государство ибо делать нехуй, в 207 лет\n\nобычно он использует стихию огня и усиливает человека, ваще он работает на команду и на поддержку справляется хорошо, всё что использует дополняет команду\n\nему важно чтобы развивалась команда, поэтому вкидывает идеи каждому лично и они там пытаются своему найти и сделать\n\nда и команда эта у него не одна он типа ш.... общительный. так он в народе ракрепояет имя хотя относительно в тени, но репутация надёжная\n\nон кстати не просто эльф а темный эльф, поэтому темная магия развита хорошо\n\nу него есть листок бумаги из клевера, он может написать заклинание и сложить листок в оригами, тогда поимеет свой и материализует относительно функции формы\n\nесть ещё линза удачи, он видит с её помощью удачу людей\n\nда он по характеру и внешне и внутренне добрый и эмпатичный\n\nпогладив по голове кого-то и если тот участвует в процессе он может узнать опыт этого человека и изучить его даже относительно прожить, но чревато потерями навыков или памяти, ну относительно кнш.\n\nзаклинания разные, шар огня, мини ураган с ладонь по размеру, водяной луч(режет хорошо твёрдое а мягкое не может), ослепление, усыпление\n\nну это базовый набор который онираскрывает разным людям, не весь кнш\n\nу него коричневые джинсы, рубаха желтовая из плотной ткани, плащ синеватый, уши естественно эльфийские но кожа грубоватая, но он привлекательный\n[273517] 2024-12-23 19:03 Слава: Джинсы в средневековье\n[273518] 2024-12-23 19:03 Слава: А не дохуя ли у него способность\n[273519] 2024-12-23 19:04 Слава: И как понимать темной магии ?\n[273520] 2024-12-23 19:05 Слава: И про листок клевера ты походу там слова попутал ниче не ясна\n[273521] 2024-12-23 19:05 Миколай: сам хз, думаю это обобщеное название для магии которая может использоваться скрытно или явно плохо\n```\n\n### Версия 2 — 2024-12-23\n\nвселенная: неясно (по дате объявления) · окно w0068 · сообщения 273525–273550\n\n*что здесь: Спор: Слава говорит, что некромантия — благословение и тёмной магии в его представлении нет; Миколай сравнивает с холериками/меланхоликами — названия нет, но люди так обзывают набор магии, категорию; описать конкретно отказывается, обещает раскрыть потом*\n\n\n\n```chat\n[273525] 2024-12-23 19:05 Слава: Так магия види некромантии считается благословением\n[273526] 2024-12-23 19:06 Слава: Про какую темную магий ты говоришь\n[273527] 2024-12-23 19:07 Миколай: есть бумага которую сделали из клевера, на ней может написать заклинание и после например самолётик сложить, это заклинание активируется и вот он сложил самолётик за этой формой оригами есть какая-то функция и он её активирует\n[273528] 2024-12-23 19:08 Миколай: я не знаю как это описать я не думал\n[273530] 2024-12-23 19:08 Миколай: потом\n[273531] 2024-12-23 19:08 Слава: Тогда зачем писал\n[273532] 2024-12-23 19:08 Миколай: тц\n[273533] 2024-12-23 19:08 Миколай: чтобы потом раскрыть естественно\n[273534] 2024-12-23 19:08 Слава: В моем преставление так таковой темной магии и нету\n[273535] 2024-12-23 19:09 Миколай: сука\n[273536] 2024-12-23 19:09 Миколай: я тебе и говорю\n[273537] 2024-12-23 19:09 Миколай: нету\n[273538] 2024-12-23 19:09 Слава: Так ты да же сам не понимаешь что такая темная магия\n[273539] 2024-12-23 19:09 Слава: Плюсом у твоего эльфа уже есть благословение виде усиление\n[273540] 2024-12-23 19:10 Миколай: а нету холериков, меланхоликов и сонгвиников но эту хуету люди юзают\n[273541] 2024-12-23 19:10 Миколай: и в этом мире тоже\n[273542] 2024-12-23 19:10 Миколай: это так обзывают набор определённой магии\n[273543] 2024-12-23 19:10 Миколай: категорию\n[273544] 2024-12-23 19:10 Миколай: могут не называть\n[273545] 2024-12-23 19:11 Слава: И какую же магию ?\n[273546] 2024-12-23 19:11 Миколай: просто чтобы дохуя не расписыватт\n[273547] 2024-12-23 19:11 Миколай: вот и подумаю потом,, я имею представление но не знаю как описать сейчас\n[273548] 2024-12-23 19:11 Миколай: ну\n[273549] 2024-12-23 19:11 Миколай: ..\n[273550] 2024-12-23 19:11 Миколай: лан надо ещё подумать\n```\n\n## Часть чего\n\nМагия (система магии мира)\n\n## Неясности\n\n- (w0068) Содержание так и не определено, автор сам сказал, что не думал и опишет позже</div>"}];</script>
