<script>const BASE="../";const DOCNAME="Торфолихт";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Торфолихт\n\n*персонаж* · вселенные: игра бога\n\n## Навигация\n\n- (w0030) Газово-огненный пришелец: скопление зелёных шаров на реактивной тяге, с болотной планеты. Похоже, это доведённая до карточки та самая идея блуждающего огня, которую С отклонил в пользу чистой молнии, но прямо это не сказано.\n\n## Связано с\n\nЛихтспид, многоликий\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-04-06\n\nвселенная: игра бога (по дате объявления) · окно w0030 · сообщения 154436–154441\n\n*что здесь: Досостояние (если это он): способность создавать и управлять блуждающим огнём, плюс поглощать молнию и заряжать ею эти огни.*\n\n\n\n```chat\n[154436] 2024-04-06 18:17 Слава: Ну или элемент то бишь огонь молния\n[154439] 2024-04-06 18:49 Миколай: Крч\n[154440] 2024-04-06 18:49 Миколай: Его способность создавать и управлять блуждающим огнём\n[154441] 2024-04-06 18:50 Миколай: Но он умеет поглощать молнию и заряжать эти огни\n```\n\n### Версия 2 — 2024-04-06\n\nвселенная: игра бога (по дате объявления) · окно w0030 · сообщения 154598–154601\n\n*что здесь: Карточка: скопление зелёных шаров, передвижение на реактивной тяге; планета с обширными торфяными болотами, богатыми метаном; питаются растительностью и поглощают газы; разумны, язык из щелчков и свистов, живут небольшими сообществами, строят хижины, культура основана на поклонении огню и газам. Способность — создавать вокруг себя самовоспламеняющиеся газовые пузыри.*\n\n\n\n```chat\n[154598] 2024-04-06 21:02 Миколай: тут он в действии почти оплёл небоскрёб\n[154599] 2024-04-06 21:12 Миколай: Тогда Торфолихт будет выглядеть так и иметь такое описание. \n\nВнешне Торфолихт напоминает скопление зелёных шаров. Передвигается на реактивной тяге.\n\nТорфолихты обитают на планете с обширными торфяными болотами, богатыми метаном и другими газами. Торфолихты используют это для защиты, охоты и ритуалов. Они питаются растительностью и поглощают газы из атмосферы.\n\nТорфолихты разумны, у них есть свой язык, напоминающий серию щелчков и свистов. Они живут небольшими сообществами на болотах, строят хижины из местных материалов. У них сложная социальная структура и своеобразная культура, основанная на поклонении огню и газам.\n\nВстреча с Торфолихтом однозначно произведет неизгладимое впечатление на любого землянина.\n\nСпособность: Они способны создавать вокруг себя пузыри из газов, которые могут самовоспламеняться.\n[154600] 2024-04-06 21:16 Миколай: Всего 8 пришельцев из которых точно одобрено 3\n[154601] 2024-04-06 21:16 Миколай: Я в спячку пока-что\n```\n\n## Неясности\n\n- (w0030) Прямой связи между отвергнутым «блуждающим огнём» и Торфолихтом в тексте нет — склейка версий предположительная. Также на 154670 С называет его «пузырь», путая с быком.</div>"}];</script>
