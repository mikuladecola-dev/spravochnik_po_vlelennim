<script>const BASE="../";const DOCNAME="Всем привет, меня зовут Вячеслав, мне 15 лет (монолог для ролика)";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Всем привет, меня зовут Вячеслав, мне 15 лет (монолог для ролика)\n\n*2022-09-25 · неясно · Цельный текст Миколая одним сообщением (16967), после него правка Славы про желание вернуться в изолятор*\n\n---\n\n\n\n```chat\n[16962] 2022-09-25 17:02 Миколай: В итоге получается ты в садике месяц пробыл?\n[16963] 2022-09-25 17:02 Слава: Да\n[16964] 2022-09-25 17:02 Миколай: Ок\n[16967] 2022-09-25 17:48 Миколай: Всем привет, меня зовут Вячеслав, мне 15 лет, и как вы поняли по названию ролика, я сейчас нахожусь в садике, и нет, я тут не работаю, а живу вместе с детьми и прохожу тут обучение.\nНачну с того что я уже находился в этом садике до школы, как обычные дети. Этот садик формально для людей с ограниченными возможностями, я бы не приписал себя к данной касте людей, но я болею туберкулёзом, и для изоляции меня от общества не нашлось в моём городе другого места, кроме как этот детский сад. \nПервую неделю прибывания в этом садике я провел в изоляторе, совершенно один, без людей, синие стены, белый потолок, маленький унитаз, маленькая низкая раковина, точнее две раковины,  слава Богу был телевизор, окно, и на минуточку был телефон с розеткой возле кровати. Для кого-то эти условия покажутся райскими, да и мне по началу было достаточно комфортно, но через 3-4 дня я начал понимать, что чувствовали люди из тех фильмов и историй где они были совсем одни в запертой комнате по целым дням и неделям, у меня от такой атмосферы голова болела, не чувствуя ход времени я мог спать по 16 часов, для меня, а точнее для моего организма эти изменения были слишком резки и я понемногу сходил с ума, старался заниматься спортом, и развлекался как мог, пока не пережил эту неделю и не увидел людей, но об этом позже, в изоляторе врачи мне приносили поесть, ел я 5 раз в день, еда не то что не вкусная, но и вкусной её называть тяжело, главное что не голодаю, кстати когда врачи для анализов брали у меня кровь я испугался даже, они наполнили 4 колбочки моей кровью, и я почувствовал истощение, больше такого не было. Неделя эта была очень тяжёлая, и когда я вышел из изолятора мне стало очень легко и было так хорошо увидеть людей, но эта лёгкость продлилась не долго, в общении с ними у меня было много проблем, ну и основная проблема это разница в возрасте, интересах и ценностях. Вот именно тогда я непосредственно находился в садике, и помимо рабочего персонала я являюсь самым старшим в нём, поэтому мне было не очень комфортно. В основном все мальчики тут младше 10 лет, а самые старшие девочки, младше меня на год, общаться с ними сложно, у них очень навязчивое поведение, они слишком шумные, и энергичные. В отличии от меня, ведь я привык жить размеренной жизнью. Воспитатель за нами следит, даёт задания, приходят учителя к нам, дают уроки, но я почти не слышу из-за постоянного шума детей и плохого слуха, раз в день можно выходить на площадку которая располагается, на территории школы, есть мяч, мы пытаемся убить время играя с ним. Тут садике есть двух годовалый ребёнок, он часто плакал, на него часто орали, мне было за него очень обидно, у меня есть брат, ему 3 года, и мне казалось как будто они орут на него это очень  раздражало. Кровати все расположены в одной комнате, благо они нормального размера. Кстати ещё здесь, в первые я встретил настоящего человека болеющего синдромом дауна, он показывал прямо в лицо пальцем и смеялся очень жутко. \n На этом моменте сегодня я заканчиваю историю о моём прибывании в детском садике, и когда выйдет этот ролик скорее всего я уже буду в другом городе для лечения и буду накапливать опыт чтобы рассказать вам новую историю.\n[16968] 2022-09-25 17:52 Слава: В другом городе ?\n[16969] 2022-09-25 17:52 Слава: Стеклазовод это не город\n[16970] 2022-09-25 17:53 Миколай: Ну типа я в начале сказал что в  нашем городе больше ничего другого кроме садика не было\n[16971] 2022-09-25 17:53 Миколай: Поэтому пришлось написать так, чтобы вопросы отпали\n[16972] 2022-09-25 17:53 Слава: Ясно\n[16973] 2022-09-25 17:54 Слава: Ну норм\n[16974] 2022-09-25 17:54 Слава: Только когда я попал к ко всем я хотел обратно в изолятор\n[16975] 2022-09-25 17:54 Миколай: Ок\n[16976] 2022-09-25 17:54 Миколай: Я упомяну это\n[16977] 2022-09-25 17:55 Слава: Ок\n```</div>"}];</script>
