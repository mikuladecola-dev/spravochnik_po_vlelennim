<script>const BASE="../";const DOCNAME="Поиск людей по имени со стены";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Поиск людей по имени со стены\n\n*история* · вселенные: Новый мир\n\n## Навигация\n\n- (w0037) Сюжетная задумка Миколая без сеттинга и сверхспособностей: парень предлагает другу искать людей с тем же именем, что написано на стене здания; счёт находок, отметки по отличительным чертам, всё более редкие имена, блог, челленджи и конкурсы найти тёзку в другом городе и стране, подсчёт статистики, а затем известность оборачивается боком — имена начинают писать по приколу. Задумана как повод показать интересные места города и приключения ребят или одиночки. Слава уточняет, что это повседневность без ужасов и сверхспособностей, и говорит, что звучит интересно; Миколай хочет реализовать сам.\n\n## Связано с\n\nРоли в соавторстве\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-06-14\n\nвселенная: Новый мир (по дате объявления) · окно w0037 · сообщения 179979–180006\n\n*что здесь: первое и единственное изложение задумки целиком, включая финальный поворот с известностью*\n\n\n\n```chat\n[179979] 2024-06-14 19:47 Миколай: Идея приземлённая не как тебе нравится. Но я только что придумал совершенно случайно и по приколу но мне понравилась звучит интересно\n[179980] 2024-06-14 19:47 Миколай: Идея для сюжета. Чел по приколу предложил другу искать людей с таким же именем какое написано на стене здания. Сначало были часто узнаваемые их количество они стакали ну одинаковых и людей с одинаковыми именами отмечали с отличительными чертами. Потом стало всё сложнее искать людей со сложными именами, редкими. Но интереснее. Они даже блог начали вести изначально и даже кидали людям челленджи, конкурсы кто найдёт например даже не том же городе, а в другой стране человека с таким именем. Пошёл лютый подсчёт статистики. Но потом известность обернулась боком и люди по приколу часто писали имена. Во общем сейчас это всё. Но развить можно мощно и интересно сюжет. А сама идея больше показать интересные места города и приключения ребят ну или одиночки хз\n[179990] 2024-06-14 19:51 Слава: Это типо повседневность \nТипо здесь нет ужасов не сверхспособности ?\n[179991] 2024-06-14 19:51 Миколай: Да, я же говорил те не интересно будет 🙂\n[179996] 2024-06-14 19:52 Слава: Но нет, интересной звучит\n[179999] 2024-06-14 19:53 Миколай: Ага, но ни будет ничего интереснее реализации\n[180000] 2024-06-14 19:53 Миколай: Посмотреть на такое я бы хотел\n[180001] 2024-06-14 19:55 Слава: У меня не хватит фантазий \nЯ же чисто лор и основну всегда придумывал а сому историю не двигал\n[180002] 2024-06-14 19:55 Миколай: Понимаю\n[180003] 2024-06-14 19:56 Миколай: Я так чисто поделился идеей\n[180004] 2024-06-14 19:56 Миколай: Реализовал то сам хочу\n[180005] 2024-06-14 19:56 Слава: А ты где ?\n[180006] 2024-06-14 19:56 Миколай: Просто если деже тебе понравится.. То значит не хуйня\n```\n\n## Неясности\n\n- (w0037) вселенная не объявлена, мира вокруг нет; неясно, один герой или двое — автор сам оставляет вариант</div>"}];</script>
