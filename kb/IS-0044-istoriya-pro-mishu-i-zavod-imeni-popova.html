ет чувств. То, кто конечно боится их. Но не умоляет отстать. Не смотрит взглядом неудачника. И не кричит от боли. Пробуждала в них некий гнев &quot;как этот неудачника посмел&quot;. И вот такие мысли были у каждого из них. Поэтому одним из днём. Они подождали его возле школы, а после заведя его в переулок. Порвав на нём рубашку и сняв футболку. И доставь нож. Начали оставлять на нём свои инициалы. Мише было больно. Он кричал и просил остановиться. Чем только заводил их. И они начали глубже резать. И лишь когда четверо из них оставили на его груди и животе. Свои инициалы. Они отпустили его. В тот день Миша прибежал домой в слезах и в крови. Закрывшись у себя в комнате. Он плакал и ревел. А после начал отмывать одежду от крови. Боясь, что мама увидит. Но мать не дура. Она всё понила увидев Мишю. Она не стала силой получать ответы от него. Лишь спросила слегка не уверена\n-давай переведемся в другую школу? - Миша лишь слегка кивнул. Боясь выдать все те эмоций бурлящей в нём. А маме Мишей было больно. Что единственный сын не может ей доверится. И также понимал своей бессилие. Даже если сын довериться ей, что она сможет сделать. Она всего-лишь медсестра и всё. Да и тот случай в прошлой школе, где она не смогла принять сторону сына.\n[311072] 2025-03-25 13:28 Слава: Боясь, что переведясь в другую школу. Этот учитель составить плохую характеристику Мишей. И это очень сильно било по ней. И по итогу эти два человека жили вместе пытаясь скрыть эмоций друг от друга . Боясь этим ранить друг друга. \nМиша перевелся. Ну и там не было ему покоя. Схемы было одна. Его никто не дрогал в первой время, а потом мелкий издёвки и до момента уже настоящего насилия. А потом новая школа. И снова это же схемы. Лишь в десятом классе его никто не трогал. Потому-что времена изменились. И социальный организаций начали активную борьбу с буллингом. Но это только на словах. Но для детей, которым скоро писать экзамены и начинать думать о своём будущем. Эти слова были действующими. Поэтому Миша спокой
