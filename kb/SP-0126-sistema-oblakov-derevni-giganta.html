<script>const BASE="../";const DOCNAME="Система облаков деревни-гиганта";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Система облаков деревни-гиганта\n\n*способность* · вселенные: 7 островов\n\n## Навигация\n\n- (w0066) Они умеют создавать, ловить и хранить облака: управляемые дамбы периодически сбрасывают воду на раскалённые низменности, до 5 метров идёт пар, выше туман, на 2,5 км его ловит ветер из-за гор и формирует облака не больше 10 метров, которые врезаются у вершины. На мостиках-бышах нефители ловят их в ткань из особого материала и перемещают родовой энергией. Жители поливают облаками огород, рабочие кидают их учёным через жерло вулкана, те меняют плотность и ставят опыты.\n\n## Связано с\n\nДеревня-гигант, Заражённые облака\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-12-11\n\nвселенная: 7 островов (объявлено) · окно w0066 · сообщения 269369–269370\n\n*что здесь: полное описание цикла: дамбы, пар, ветер, ловля, распределение между слоями деревни, лаборатории*\n\n\n\n```chat\n[269369] 2024-12-11 19:08 Миколай: есть в Азии &quot;деревня-гигант&quot;(так обозвали из-за площади поселения и количества жителей), она находится на горе около 3000 метров высотой. богатые люди живут внизу, ученые в середине, рабочие и бедные на верху. это не просто гора, а старейший вулкан. зепокруг него земли стабильные, но есть гладкие каменные плоскости, слой земли крайне маленький по общим меркам и близок к активной магме. этот вулкан окружён можно сказать кольцом из гор пониже (кольцо не идеальное и скорее это огороворка, по карте так не скажешь, но функция у него схожа).\nслово о народе: это относительно изолированное поселение, трудно сказать к какому государству оно принадлежит, но и не тайное. во внешней политике оно не участвует, однако сотрудничает по программе обмена с крупными университетами. \nглавная особенность этого места облака. есть наука нефология изучающая облака, так вот для них эти знания бытовая и жизненная необходимость ибо уже не первое тысячелетие они исследуют их и имеют инструменты для использования в повседневной жизни.\nпо порядку с исторической справки: было кочевое племя, им было холодно на земле и они полезли к солнцу на гору, а как забрались, поняли что в них &quot;врезалось&quot; облако. они первый раз наблюдали за ним в близи, это было интересно. а, как оно прошло их семена(ну овощей всяких) проросли. некоторых хватило недуг. спускать больных не удобно, оставлять жалко и противоречит обычаям. вот и поселились там исследуя облака.\nсейчас там уже своя продуманная система: они могут создавать облака, ловить и хранить их. \nони прорубли давно канал для реки в деревню (во первых потому что деревень без воды вблизи не бывает, а она была далеко) и также установили управляемые дамбы. периодично они их открывают. вода течёт на расколенные низменности и испаряется. причем настолько горячая поверхность, что до 5 метров действительный пар, после он превращается частично в туман, но продолжает подниматься, а на высоте 2,5 км сталкивается с ветром, который выходит из-за гор полученный течением. ветер формирует из тумана облака, из-за четких пропорций, они не вырастают больше 10 метров и врезаются ближе к вершине, где на специальных мостиках - бышах нефители ловят облака, в специальную ткань из специального материала и с особенной фактурой, используя родовую энергию могут перемещать облака не испортив их. обычные жители просто поливают огород этими облаками в основном, но ученые от рабочих получают облака, которые те через жерло вулкана кидают на середину горы. а после типа в лабораториях делают различные исследования с облаками. увеличивают плотность, уменьшают, заражатют вирусами и тд. \nесли зараженное облако съест или вдохнет человек естественно он заболеет и причем сильно, а избавится от болезни только выдохнув облако.\nу них множеств всяких экспериментов с облаками но это я не продумал уже\n[269370] 2024-12-11 19:08 Миколай: да, не самая сильная и конкретно о расе почти не написал, но вот крч что есть\n```\n\n### Версия 2 — 2024-12-11\n\nвселенная: 7 островов (объявлено) · окно w0066 · сообщения 269389–269399\n\n*что здесь: уточнение про воду: реки далеко, каналы, вода по кругу; наверху обходятся облаками; М говорит, что два дня изучал, что такое облака*\n\n\n\n```chat\n[269389] 2024-12-11 19:23 Слава: А я не пал насчёт водоемов\n[269390] 2024-12-11 19:23 Миколай: типа\n[269391] 2024-12-11 19:23 Слава: Типо где они\n[269392] 2024-12-11 19:23 Слава: И какие\n[269393] 2024-12-11 19:23 Миколай: есть реки, но они далеко за горами\n[269394] 2024-12-11 19:24 Миколай: а чтобы деревня функционировала нужна вода\n[269395] 2024-12-11 19:24 Миколай: поэтому они прорыли каналы\n[269396] 2024-12-11 19:24 Миколай: и эту воду пустили по кругу\n[269397] 2024-12-11 19:24 Миколай: а как-раз тем кто на верху не нужны реки\n[269398] 2024-12-11 19:24 Миколай: потому что у них есть облака\n[269399] 2024-12-11 19:25 Миколай: я эти 2 дня люто изучал че такое облака и многое понял\n```\n\n### Версия 3 — 2024-12-11\n\nвселенная: 7 островов (объявлено) · окно w0066 · сообщения 269422–269427\n\n*что здесь: облака как оружие: «есть действительно интересная технология», конкретика не расписана*\n\n\n\n```chat\n[269422] 2024-12-11 19:32 Миколай: я к чему\n[269423] 2024-12-11 19:33 Миколай: облака это ебать оружие может быть интересное\n[269424] 2024-12-11 19:33 Слава: А монстры типо в небе есть\n[269425] 2024-12-11 19:33 Миколай: там крч есть действительно интересная технология как делать разные темки с ними\n[269426] 2024-12-11 19:33 Миколай: пока у меня глупая идея и не зрелая\n[269427] 2024-12-11 19:34 Миколай: я ща кое че найду и потом опишу\n```\n\n## Часть чего\n\nДеревня-гигант\n\n## Неясности\n\n- (w0066) автор сам пишет, что множество экспериментов с облаками не продумано</div>"}];</script>
