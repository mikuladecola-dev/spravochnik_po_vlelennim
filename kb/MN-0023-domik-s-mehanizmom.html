<script>const BASE="../";const DOCNAME="Домик с механизмом";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Домик с механизмом\n\n*монумент* · вселенные: неясно\n\n## Навигация\n\n- (w0109) Образ из сна: деревянный домик без окон, дверей и трубы, из досок; сзади механизм из шестерёнок, геометрических фигур и чего-то похожего на пушку, которая стреляет так, что вода поднимается метра на три. Внутри/наверху — дед с уставшим лицом и стеклянными глазами.\n\n## Связано с\n\nОбратные, Сон про плот и домик с механизмом\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-11-18\n\nвселенная: неясно (по дате объявления) · окно w0109 · сообщения 386293–386296\n\n*что здесь: Заведён как ключевой объект сна — пример &#x27;непонятной постройки&#x27; обратных.*\n\n\n\n```chat\n[386293] 2025-11-18 16:21 Слава: Вообще в этом сне я испытал чувство клаустрофобии. Хотя и был в открытой местности\nСловно меня всё завели в тупик, окружили и шанс выбраться нету (хотя я знал что как минимум  я буду жить, то есть убивать меня никто не собирался (говорю я после того как во сне на меня скинули ракету.\n[386294] 2025-11-18 16:33 Слава: Вообще суть достаточно просто. \nЛюди больше не люди. И я честно даже не знаю, что именно поменялось. Но сука чуствовалось, что этот не человек, глаза были стеклянными что-ли, ну они могли веселиться и смеяться и убивать людей, который не как они ( назовём их обратные) \nЭти обратные по итогу захватывают мир и обычных людей остаються единицы. \nНу не это главная. Обратные что-то строили. И нет, не машину для убийства всех и чего подобного. Каждый из них словно строили что-то своё, что-то непонятное. \n\nИ вот например я скрывающий среди этих обратных, каким чудом выживаю и в какой-то момент оказываюсь на плоту с другими людьми. И мы просто плывём толи в океане, то ли в море. Плывём мы такие, я в водички купаюсь ( плот деревянным был) и здесь я чувствую что-то не так и ныряю под плот. Ну и плот взрывается когда на него скинули ракету. И по итогу выжило трое считая меня. \nМы что-то плывём по этому морю непонятно что делать. И как вдруг словно мир прогрузился и я вижу деревяный домов без окон дверей и трубы. Просто стенка стенка потолок и пол, сделаный не из брёвен, а из досок. И сзади этого домика странный механизм, шестерёнки, Какие-то геометрические фигуры и что-то похожее на пушке. И как в нас вдруг именно из домик, что-то с невероятной скоростью влетает. Благо не попал, но воды от столкновении с ним поднялась на метра 3.\nНу и я конечно &quot; Всё валим нахер&quot;.ну эти двое решили поплыть к этому домику, фиг знает зачем и я на кое черт с ними поплыл. \nПо итогу залезли мы на этот домик, а там дед с уставшим лицом, но стеклянными глазами. Ну и всё я проснулся\n[386295] 2025-11-18 16:42 Слава: По сути концепция ясна. Выживания в мире психов ( обратных), что создают какую-ту хуйню для разных целей. При этом они эмоциональный и у них есть чувство, и они не люди\n[386296] 2025-11-18 16:46 Слава: И я не понимаю почему они не люди. В моих глазах всё конечно ясно, я же видел сон. И там они вроде как люди смеються улыбаются, грустять ленятся и привязываются. Но было два отличия ими но в характере ( ну то есть не считая что они создают какую-ту фигню) азарт, у них был некий азарт, и второй глаза что были тусклыми что-ли. Ну я смотрю на них и сразу понимаю, что они что-то не такое, что-то чужое. Явно не человек, ну при этом владеет всеми качествами человека. И как это абсурдно звучит у них есть некий азарт но глаза у них стеклянный ( назвать их мёртвыми был бо перебор, они где-то на уровне живых и мертвых, это я про глаза)\n```\n\n## Часть чего\n\nОбратные\n\n## Неясности\n\n- (w0109) Назначение механизма не объяснено.</div>"}];</script>
