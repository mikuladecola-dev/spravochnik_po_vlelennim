const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Максим\n\n*персонаж* · вселенные: Апостол, Нимб, игра бога\n\n## Навигация\n\n- (w0029) Карточка персонажа Славы: высокого роста, лидер. Способность «власть» — любой в радиусе 70 метров обязан подчиняться любому закону, произнесённому Максимом, минус в том, что и сам Максим обязан ему подчиняться.\n- (w0082) Главный герой и рассказчик истории-блога 305113-305117: 19 лет, &quot;лучший среди людей&quot;, страдает от скуки, ищет драк в неблагополучном районе, убивает чёрную лучницу, потом сталкивается с копьещиками и соглашается стать агентом. Дальше обсуждается в диалоге М и С 305202-305306 и 305422-305423.\n- (w0090) Герой, о котором спорят Андрей и Саша перед походом в прологе от 2025-05-04 (323658). Лучший спортсмен колледжа или города, спортом занялся от скуки, в походе носится как заяц, залезает в дырки и пещеры.\n- (w0091) Персонаж, вокруг которого строится история; в новом прологе описан со стороны рассказчика как невероятно выносливый и неугомонный участник походов. Рассказчик отговаривает Андрея брать его в поход.\n- (w0110) Третий в зимовке из «Зимы»: решил, что печь топят по старинке, выкинул спички и зажигалку и торжественно вручил рассказчику огниво с кремнем. Сам разжигает огонь с первого раза; в кадре не появляется, пилит поваленное дерево.\n- (w0120) Седьмой благословенный, сверхчеловек: ускоренное восприятие (все люди, машины, самолёты для него медленные), точность движений через ощущение каждой клетки тела. Нечто ощущает через сердцебиение — идёт по зову сердца, иначе сердце больно екает и становится холодно.\n\n## Связано с\n\nАгенты, Андрей, Благословенные, Дима, Закон, Зима, Игра бога, Имитатор, Истории про Максима, Килька, Копьещики, Лучница, Михаил &quot;Медведь&quot; Саакашвили, Пролог про Максима, Рассказчик историй про Максима, Саша\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-04-03\n\nвселенная: игра бога (объявлено) · окно w0029 · сообщения 153366–153366\n\n*что здесь: полная карточка со способностью и её минусом*\n\n\n\n```chat\n[153366] 2024-04-03 05:49 Слава: Максим \nВысокого роста, лидер \nСпособность: власть ( любой кто находится в 70 м должен подчиняться любому закону сказанная Максимам, минус в том что Максиму тоже надо подчиняться закону )\n```\n\n### Версия 2 — 2025-03-18\n\nвселенная: Апостол (по дате объявления) · окно w0082 · сообщения 305113–305117\n\n*что здесь: первое появление: три факта о себе, скука гения, бой с лучницей, бой в лесу, вербовка, три недели вместо шести месяцев обучения, куратор Медведь*\n\n\n\n```chat\n[305113] 2025-03-18 13:22 Слава: Здравствуйте, дорогие слушатели. Ой простите. Конечно же читатели. Этот блог я пишу чисто по приколу. Ну и чтобы возможно позлить Михаила. В этой записи будет моя история переплетающиеся с другими историями, других людей. \nИ вот начнём. С чего бы начать. Наверное как меня зовут? И кто я вообще такой? \nЯ Максим. Лучший среди людей. И нет это не пустый слова. У меня есть некоторые факты, которые доказывають мои слова. Всего их три. Первый- у меня другое  восприятия времени. Для меня все разы медленнее чем вам. И от этого факта идёт два других. Второй- у меня обострённые все пять чувств. Нет. Точнее  будет сказать. Они у меня идеальный. Я могу слышать за километры, и видить  детально и лучше чем вы. И третей- я контролирую все мышцы в своём теле. Из-за того,  что у меня восприятие времени замедлено. При хотьбе я контролирую куда наступать, как дышать. Я чувствую какие мышцы напрягаются. Да я чуствовал как переносится моя же кровь в венах и артериях. Я чуствовал как бьётся моей сердце. И для меня лишь моргания эта тьма, на достаточно не малый промежуток времени. Я живу так и я к этому привык. Но вот мне стала скучна. \nЯ пробовал себя везде. Почти что во всех видов спорта в учебе, в музыки. И всё давалось мне относительно легкой. Ведь в учебе. Просто слушай и запоминай. И для меня, который контролирует дажа то как он сидит. Не было напряга учиться хорошо. В спорте да легкотня. Ведь я чуствовал какие мышцы напрягаются в том или ином упражнении. Поэтому мог идеально делать какие-то упражнения и прекрасно понимал, какие тренировки бесполезный,а какие хорошие. Я мог контролировать своё дыхание и выносливость. По этому при беге на длинных дистанциях я был лучшим. А при  коротких. Я мог сразу выдать максимум и опять же был лучшим. В музыке, с моим идеальном слухом я был как рыба в воде. Конечно учить все эти ноты было та ещё скука. И когда мне стукнула 19. Я был преспективном спортсменом с красным дипломом и также преспективным музыкантом и актёром. Я мог пойти куда угодно и мне везде бы с руками оторвали. \nНу мне было скучно. Простите это проблема всех гениях. Скука. Я зная, что я безграничный. И такому безграничному мне, нужно было двигаться вперед и встречаться с препятствиями. Но нет их. Этих препятствий. И поэтому мне скучно. \nВ ту ночь я гулял в неблагоприятном районе. Ладно подловили. Я не гулял, а искал с тем кем мог подраться. Ну сейчас, когда я уже вторую неделю суда хожу. Никого нет. Они все испугались. И поэтому я просто гулял в тёмном районе. Который находился в окраине города и где много заброшенных домов. И шёл я так. Думая чем бы мне ещё заняться. Пока не услышал. Натягивание тетивы. Я знаю этот звук очень хорошо. У меня друг профессиональный лучник. Да и я там пробовал себя. \nПоднимаю свою голову, которая все это время смотрела вниз. Поднимая голову, я уже точно понимал откуда стреляли. Из заброшенного двухэтажного дома. Девушка. Хотя это не точно. Но по слуху это девушка молодая лет до 20. Лёгкая, быстрая и ловкая. И всё это я понял. Пока поднимал голову к звуку выстрела. \nКогда я поднял голову. Я сначала не понял, а где стрела? А суть то было в том, что стрела была полностью темной. И поэтому разглядеть его в темноте, даже с моим идеальном зрением было сложно. Но по итогу я смог еë разглядеть. Подметил две вещи. Первый- это лучница явно профессионал. Ведь стрела летела ровно в голову. А второй- то что стрела странная . Она не только чёрная но и наконечник с деревяшкой словно единой. Интересно, где она такие стрелы купила. Думал я пока поварачивал голову на бок. Дабы стрела пролетела мимо. И да она пролетела мимо. Даже не задев щеку. А я в это же время улыбнулся. Интересная игра. В которой мне надо преодолеть дистанцию между тем где я стою и домом. А после пробраться на второй этаж и схватить врага. При этом уклоняясь от стрел. Интригует.\n[305114] 2025-03-18 13:22 Слава: И я стартовал. И слышал как натягивается новая стрела. И оп. Отошёл в бок и стрела промазала. И снова промазала. Да для меня, который по слуху может определить куда целится его противник. Раз плюнуть уклониться от выстрела. Даже не поднимая головы. Но я слышу, что-то странное. Два звука разрезающий воздух. Она стрельнула двумя стрелами. И эти две стрелы летели в разный точки. Первая в левой плечо. А второй в правой бедро. И попытаясь я отклониться в влево, то стрела попадёт в правой плечо. А если попытаться уйти в право, то получу по левому бедру.  Поэтому пришлось подпрыгнуть и изогнуться в букву С. А после приземлившись. И словно получил второй дыхания от возбуждения решённой задачки. Я стартовал куда быстрее чем в прошлый раз. И уже с ноги выбил, эти старый деревянный двери. Быстра обведя взглядом помещения. Я замечаю лестницу и бегу к ней. Прекрасно понимая, что лучница наверника уже целится в сторону лестницы. Поэтому, когда моя голова оказалась уже на втором этаже. Я услышал выстрел. И просто нагнул голову вниз. А после чуть-ли не на четвереньках прыгаю. И оказываюсь на втором этаже. Врезаясь в стенку. И от не отскакивая бегу к лучнице. И замираю. Точнее мысли замирають. Но тела всё ещё движется . А мысли замерли у меня от увиденного. \nДа это была де
