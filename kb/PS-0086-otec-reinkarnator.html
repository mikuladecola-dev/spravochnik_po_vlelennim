const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Отец-реинкарнатор\n\n*персонаж* · вселенные: Цветной мир\n\n## Навигация\n\n- (w0035) Отец главного героя альтернативной вселенной. Способность — реинкарнация: умирая, оказывается в новом теле, так 1000 лет, сохраняя способности всех прежних тел; стал злодеем. У одной пары родился странным ребёнком, в 7 лет убил свою мать и собирался убить отца, но ему запечатали воспоминания. Позже убил дочь героя, жену убить не смог — она сверхчеловек. Собственное дитя убить сил не нашёл, ненавидит его из мести.\n\n## Связано с\n\nСильнейший человек без способностей (прототип командира), абакра\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-05-25\n\nвселенная: Цветной мир (по дате объявления) · окно w0035 · сообщения 173189–173202\n\n*что здесь: Загадка «почему отец его ненавидит»; версии Миколая: мальчик увидел мужика и решил стать таким же, а у отца были свои планы.*\n\n\n\n```chat\n[173189] 2024-05-25 14:29 Слава: Почитай сейчас ещё добавлю\n[173190] 2024-05-25 14:30 Слава: И вопрос почему отец его так сильно ненавидит ?\n[173191] 2024-05-25 14:30 Слава: ( если что я знаю ответ )\n[173192] 2024-05-25 14:32 Миколай: Потому что он осетинец\n[173193] 2024-05-25 14:32 Миколай: Таска, угораю\n[173194] 2024-05-25 14:33 Миколай: Ну крч, просто мальчик как-то увидел одного мужика\n[173195] 2024-05-25 14:33 Миколай: Он этом мужик сказал чем занимается\n[173196] 2024-05-25 14:33 Миколай: И мальчик решил что будет таким же\n[173197] 2024-05-25 14:33 Миколай: А у отца были свои планы на мальчика\n[173198] 2024-05-25 14:33 Слава: Нет\n[173199] 2024-05-25 14:34 Миколай: Ок\n[173200] 2024-05-25 14:34 Миколай: Он единственный ребёнок в семье?\n[173201] 2024-05-25 14:34 Миколай: Щас появилась интересная идея\n```\n\n### Версия 2 — 2024-05-25\n\nвселенная: Цветной мир (по дате объявления) · окно w0035 · сообщения 173203–173204\n\n*что здесь: Альтернативная версия Миколая: у отца была полуактивная абакра — способность реализовать негатив, нанося вред врагу; он заводился от криков младенца, заметил, что от злости бьёт больнее, втянулся и приходил раз в месяц вымещать злость. Параллельно Слава даёт свою каноничную версию — реинкарнация и убитая мать.*\n\n\n\n```chat\n[173203] 2024-05-25 14:41 Миколай: На канале утопии был ролик где мама убивала детей после рождения. Она в дневнике записывала как ненавидит их. \n\nПочему? Да просто заебали орать и заботиться не хочется. Вообще-то у неё своя жизнь есть и нет цели заботиться о жизни других. Ну на деле она только так думала. Они ни кого не убивала, её подставил муж.\n\nЛадно, к чему это. Может быть у отца была полуактивная абакра. И способность реализовать негатив нанося вред врагу тем самым. Сначала он просто заебался от его криков. Потом заметил что от злости ему больнее и ему понравилось. Он раз в месяц приходил домой и вымещал злость. Он увлёкся и не заметил как это вошло в привычку, он его бил и не навидел чтобы успокоиться\n[173204] 2024-05-25 14:41 Слава: Поэтому-что у него была способности реинкарнация ( каждый раз как он умирал он оказался в новом теле и так на протяжении 1000 лет и так реинкарнируясь он сохранял способности получены в каждом теле и стал типо злодеим ) по итогу у одной пары родился странный ребенок и после 7 лет этот ребенок убил свою мать и собирался убить и отца но его воспоминания запечатали и дальше ты знаешь историю \nИ кок крастоки отвечает на вопрос как он стал сильнейшим благодаря только физической силой потому что хоть он ничего не помнить но все равно есть мышечная память которая сохраняется с ним\n```\n\n### Версия 3 — 2024-05-25\n\nвселенная: Цветной мир (по дате объявления) · окно w0035 · сообщения 173205–173216\n\n*что здесь: Уточнения по ходу разбора: от
