 только не через связь. А именно это сила находиться внутри их) Виде перегрузки мозга. Их ней базовый умений: усиленная регенерация( регенерация чаще всего превосходит благословенных) ; усиление тела и чувств; аура; сенсорика. \nИ также получают уникальную способность. Даже если они сцапали один и тот же кусок силы. У них она всё равно будет разная. Так как этот кусок начинает формироваться подобно апостолом. Из-за этого они получают уникальную способность. При этом если они подожгут лес он будет гореть пока весь не выгореть. Либо его не потушат. Им не зачем отключат  способность. У них даже нету такого понятия,  как отключения. Но они должны будут учиться вырабатывать энергию и научиться использовать способность и контролировать энергию. Когда у благословенным это выходит автоматический. \n\nФантазеры это можно сказать правитель с маленькой буквой. Они создали свой мир в голове. Из-за этого даже глядя на наш мир ( то бишь мир в котором находиться их физическая оболочка). Они видят его по другому \nПример фантазёр, что видит мир виде линей, колебаний. Глядя на стенку он видит лишь большо миллиона движущих линий, который за, что-то отвечают. \nИз-за этого он способен влиять на наш мир. По законам своего. То есть он может изменить колебания волны ( нитки). И стена может стать воздухом или водой или взорваться в зависимости. Какую нитку потянули и как на неё повлияли. \nФантазёр на данный момент сильнейший существа. Но они могут просто исчезнуть. Потерять связь с нашим мирам и полностью окунуться свой. Исчезая. Из-за этого их очень мало. Ведь нет не одной причины жить в мире правителя. Если ты можешь попасть в свой. \n\nАртефакты это объект, что имеет силу правителя. Из-за того, что. Когда то правитель пытался создать мир. И не в состоянии полностью контролировать этот процесс наделили какой-либо объект через чур большой сил этот самый объект. Примечания: Благословенный; альфа, Арбетары и фантазёры не способны раскрыть всю мощь артефакта. Так как уже сами переполненный
