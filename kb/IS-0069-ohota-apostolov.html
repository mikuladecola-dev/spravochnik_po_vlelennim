жили жить как жили. Изменилось только три вещи. \nПервая было подписан публичный договор обозначающий права и обязанности благословенных. А также их не я, не участия в военных конфликтах \nВторое большинство организации раскрылись то бишь о них уже знает мир и могут их даже нанимать для убийства одержимого ( ну это бесплатно. Не благословенный получают деньги за убийство одержимого. Просто именно для родственников одержимого это бесплатно), а вот платно это изгнания демона. \nДа и схватки одержимых и благословенных стали уже обыкновенными \nТретья теперь в данный организации можно в ступить\n[364780] 2025-09-12 11:30 Миколай: спать хочу\n[364782] 2025-09-12 11:31 Миколай: после пар поеду\n```\n\n### Версия 2 — 2025-09-12\n\nвселенная: Апостол (разбор «неясно») · окно w0104 · сообщения 364808–364815\n\n*что здесь: названа причина охоты: та организация убила семью одного апостола и разгромила детский приют другого; остальные апостолы начали истреблять всех, включая просто приходивших молиться*\n\n\n\n```chat\n[364808] 2025-09-12 11:49 Слава: Апостол в данной вселенной это опять группа лиц из 21 человека телепатически связанный друг с другом. Но это не люди, это насекомые. \nВсё двадцать один апостол вылезли из разных коконов. И по своё природе не являются людьми. Хоть и очень на них похоже. \nИзменения они всё такие же как и в другой вселенной. Только теперь у них замедленная старения ( точнее они словно замерзают в каком-то возрасте( в рандомные возраст ). И они как арбетары. Если сжечь лес он будет гореть не переставая. То есть их ний силы постоянные ( конечно с некоторыми условностями) но они могут сами вырубить огонь. \nИ во вторых теперь у них не по одной способности. Так как они по сути могут сами придумать новую способность. Но всё же они стараються делать упор в определённый способности. Ну не считая Имита\nЗдесь апостолы дорожат друг другом больше всех. Как раз таки из-за того что  та организации убила семью одного из апостолов и разгромила детский приют друг
