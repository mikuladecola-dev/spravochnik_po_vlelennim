<script>const BASE="../";const DOCNAME="Демон";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Демон\n\n*персонаж* · вселенные: Нимб\n\n## Навигация\n\n- (w0011) Слава придумывает 17-летнего в белой маске с нарисованной улыбкой и чёрном плаще, который в прямом эфире убивает сверхлюдей-грешников; кличка — Демон, чаще всего пользуется пистолетом. Весь вечер 27 марта соавторы набирают ему шесть способностей, дошли до четырёх.\n- (w0087) На вопрос «кто злодей» Слава называет Демона и Масочника; на уточнение, челы это другого мира или директора Нимба, отвечает «и то и другое». Рядом Миколай тянет параллель с демоном из «Мастера и Маргариты» — сущностью вне времени.\n\n## Связано с\n\nДуша грешника, Клон грешника, Контроль грешников, Контроль интернета, Контроль тела, Короткая невидимость, Лечение и приведение в сознание, Масочник, Напарники Демона, Нимб, Отнятие способности при убийстве, Телекинез для камеры, Ускорение\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2023-03-27\n\nвселенная: неясно (не определено) · окно w0011 · сообщения 37529–37546\n\n*что здесь: Первое описание: возраст, белая маска с улыбкой, чёрный плащ, убийства грешников в прямом эфире, пистолет, заявлено 6 способностей, первая — контроль грешников; Миколай накидывает варианты остальных // Объяснено, откуда кличка Демон и зачем ему столько способностей — &#x27;надо было дать изюминку&#x27;*\n\n\n\n```chat\n[37529] 2023-03-27 16:13 Миколай: Делай ролик как можно лучше и интереснее, чтобы не было скучно на протяжении всех 12 минут, перерывы каждые 4-3 минуты.\n--- пауза 1.6 ч ---\n[37532] 2023-03-27 17:48 Слава: 17 летние нормального телосложения ходит в белой маски где нарисовано улыбка черный плащ \nУбивает в прямом эфире сверхлюдей который делали грехи на подобие безмысленного убийство или каких ещё грехов у него должно быть 6 способности первая способности контроли грешнико( тем грешней человек тем лучше контролирует он их )\n[37533] 2023-03-27 17:50 Слава: И какий ещё 5 способность ему дать?\n[37534] 2023-03-27 17:50 Слава: Чаще всего он пользуется пистолетом\n[37535] 2023-03-27 17:59 Миколай: Короткая невидимость, когда полиция находит место убийства грешников, для того чтобы он успел скрыться\n[37536] 2023-03-27 18:01 Миколай: Зачем так много способностей блин\n[37537] 2023-03-27 18:02 Миколай: Способность приводить человека в сознание если тот отключился\n[37538] 2023-03-27 18:02 Миколай: Способность лечить других людей\n[37539] 2023-03-27 18:03 Миколай: Телекинез, чтобы камеру для прямого эфира переносить\n[37540] 2023-03-27 18:03 Миколай: Ну или если хочешь от первого лица\n[37541] 2023-03-27 18:04 Миколай: То способность создавать камеру на лбу\n[37542] 2023-03-27 18:05 Миколай: Способность контролировать радиоволны чтобы его видео транслировались на всех каналах в мире\n[37543] 2023-03-27 18:08 Слава: Потому что его кличка демон\n[37544] 2023-03-27 18:08 Слава: И надо было дать изюминку\n[37545] 2023-03-27 18:08 Миколай: Пон\n[37546] 2023-03-27 18:08 Миколай: Как тебе способности?\n```\n\n### Версия 2 — 2023-03-27\n\nвселенная: неясно (не определено) · окно w0011 · сообщения 37546–37572\n\n*что здесь: Спор о жестокости героя (лечить и приводить в сознание, чтобы бить дальше) и решение, что часть способностей уйдёт напарникам, а самому Демону нужна боевая*\n\n\n\n```chat\n[37546] 2023-03-27 18:08 Миколай: Как тебе способности?\n[37547] 2023-03-27 18:09 Слава: Первая контроль грешника вторая контроль интернета\n[37548] 2023-03-27 18:09 Слава: И ещё 4\n[37549] 2023-03-27 18:09 Слава: Надо\n[37550] 2023-03-27 18:10 Слава: Ну регенерация\n[37551] 2023-03-27 18:10 Слава: Так да 3\n[37552] 2023-03-27 18:10 Слава: Надо\n[37553] 2023-03-27 18:12 Миколай: А как же способность лечить других и способность других приводить в сознание\n[37554] \n\n### Версия 4 — 2023-03-27\n\nвселенная: неясно (не определено) · окно w0011 · сообщения 37582–37598\n\n*что здесь: Миколай предлагает пятую и шестую (клон грешника, отнятие способности при убийстве), Слава обе отклоняет — &#x27;может другую&#x27;; разговор на этом обрывается*\n\n\n\n```chat\n[37582] 2023-03-27 18:56 Миколай: Способность создать клон грешника, который будет сражаться с грешником, отвлекать его\n[37583] 2023-03-27 18:57 Миколай: А ты ролик делай, машинист\n[37585] 2023-03-27 19:03 Миколай: Ну и способность отнимать способность при убийстве\n[37588] 2023-03-27 19:14 Миколай: Самая первая фотография, которую я нашёл, сделана 21 сентября 2021 года\n[37589] 2023-03-27 19:15 Слава: Вообще не изменился\n[37590] 2023-03-27 19:17 Миколай: Есть такое\n[37593] 2023-03-27 19:20 Миколай: 17 марта 2022 года\n[37594] 2023-03-27 19:20 Слава: Усатый\n[37595] 2023-03-27 19:33 Слава: Может другую\n[37596] 2023-03-27 19:33 Слава: Может другую\n[37597] 2023-03-27 19:33 Миколай: Может, сам или завтра?\n[37598] 2023-03-27 19:33 Миколай: Я пошёл смотреть избраный богами 2 сезон 11 серия\n```\n\n### Версия 5 — 2025-04-08\n\nвселенная: Нимб (объявлено) · окно w0087 · сообщения 317506–317527\n\n*что здесь: Заявлен как антагонист двойной природы.*\n\n\n\n```chat\n[317506] 2025-04-08 21:27 Миколай: кто гг\n[317507] 2025-04-08 21:27 Слава: Контракт на создания препаратов который могут усилить (типо супер солдат)\n[317508] 2025-04-08 21:27 Миколай: кто хуйло\n[317509] 2025-04-08 21:27 Слава: Не кто\n[317510] 2025-04-08 21:27 Миколай: о чем история?\n[317511] 2025-04-08 21:28 Миколай: в плане злодей кто\n[317512] 2025-04-08 21:28 Слава: Ну будут мини истории о некоторых объектов , будней нимба и т. П. \nПока я ещё не до конца придумал мир, пусть пока будет так\n[317513] 2025-04-08 21:29 Слава: Ааааааааааааааааааааааааааааааа\n[317514] 2025-04-08 21:29 Миколай: че\n[317515] 2025-04-08 21:29 Слава: Демон и масочник\n[317516] 2025-04-08 21:29 Миколай: это челы другого мира или дир
