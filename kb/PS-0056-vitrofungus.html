<script>const BASE="../";const DOCNAME="Витрофунгус";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Витрофунгус\n\n*персонаж* · вселенные: игра бога\n\n## Навигация\n\n- (w0030) «Стеклогриб» — гуманоид с грибницей вместо кожи и стеклянными костями. С отклоняет его как форму многоликого (паразитирование слишком жёстко для героя), но признаёт крутым как отдельного персонажа.\n\n## Связано с\n\nмноголикий, перевоплощение в 10 разных существ\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-04-06\n\nвселенная: игра бога (по дате объявления) · окно w0030 · сообщения 154415–154419\n\n*что здесь: Карточка: вытянутое тело, кожа в грибных нитях хитридиомицетов, прозрачные стекловидные кости и череп, стеклянные когти и зубы, большие чёрные глаза; паразитирует корнями-присосками, передвигается рывками на четырёх, тело хрупкое, рассыпается осколками, режущими до глубоких ран.*\n\n\n\n```chat\n[154417] 2024-04-06 17:26 Миколай: Витрофунгус (Vitrofungus), что можно перевести как &quot;стеклогриб&quot;. \n\nЭто гуманоидные существа с вытянутым телом и конечностями. Их кожа покрыта сетью грибных нитей, напоминающих грибницу хитридиомицетов. Кости и череп состоят из прозрачного стекловидного материала, просвечивающего изнутри. Пальцы на руках и ногах заканчиваются острыми стеклянными когтями. \n\nУ них большие черные глаза без видимых белков и зрачков. Рот усеян острыми стеклянными зубами. Витрофунгусы питаются, паразитируя на других живых существах - присасываются к ним специальными корнями-присосками и высасывают питательные вещества.\n\nПередвигаются они быстрыми рывками, опираясь на все четыре конечности. Их тела хрупкие, но осколки стекла, на которые они рассыпаются, могут наносить глубокие раны. \n\nВстреча с витрофунгусом не сулит ничего хорошего - это опасный хищник и паразит, чуждый земной природе. Его облик сочетает черты гуманоида, гриба, амфибии и стекла, что делает его очень странным и пугающим созданием.\n[154418] 2024-04-06 17:28 Слава: Ну как отдельный персонаж крутой \nА как часть способности человека , как та не подходит\n[154419] 2024-04-06 17:29 Миколай: Ну так-то, да\n```\n\n### Версия 2 — 2024-04-06\n\nвселенная: игра бога (по дате объявления) · окно w0030 · сообщения 154423–154427\n\n*что здесь: Доработка задумки М: прикол в стеклянных костях — резня жёсткая, но стекло хрупкое; грибы живут в симбиозе на костях и паразитируют уже на жертве при попадании, лишая её важных для жизни штук.*\n\n\n\n```chat\n[154423] 2024-04-06 17:31 Слава: Но что бы паразитировать на ком то для него слишком жёстко\n[154424] 2024-04-06 17:31 Миколай: Тут просто прикол в том, что кости из стекла, а значит типо резня жёсткая, и может оставлять грибы и они лишают важных для жизни штук, но в тоже время стекло хрупкое, как-то так\n[154425] 2024-04-06 17:32 Миколай: Сами грибы живущие в симбиозе на костях паразитируют при попадании на жертву\n[154426] 2024-04-06 17:33 Миколай: Ааааааааа\n[154427] 2024-04-06 17:33 Миколай: Я понял\n```\n\n## Неясности\n\n- (w0030) Оставлен «как отдельный персонаж» без вселенной и без продолжения.</div>"}];</script>
