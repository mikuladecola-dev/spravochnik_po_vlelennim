<script>const BASE="../";const DOCNAME="щекотание атомов";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># щекотание атомов\n\n*способность* · вселенные: игра бога\n\n## Навигация\n\n- (w0030) Способность Лихтспида, из-за которой был единственный в окне спор о балансе: изначально авторская трактовка природы молнии, у нейронки превратилась в резонансный взрыв изнутри цели.\n\n## Связано с\n\nЛихтспид\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-04-06\n\nвселенная: игра бога (по дате объявления) · окно w0030 · сообщения 154458–154463\n\n*что здесь: В карточке: Лихтспид щекочет атомы цели на резонансной частоте, вызывая мощный взрыв изнутри, способный уничтожить даже крупных и защищённых противников.*\n\n\n\n```chat\n[154458] 2024-04-06 19:07 Миколай: Вот всё что я смог выцепить у нейронки пока она не крашнулась\n[154459] 2024-04-06 19:07 Миколай: Представляю вашему вниманию пришельца под названием Лихтспид.\n\nВнешне Лихтспид выглядит как стройный гуманоид с полностью черным телом, покрытым светящимся узором в виде фигур Лихтенберга. Его тело гибкое и приспособлено для быстрого передвижения.\n\nЛихтспиды обитают на планете с уникальной атмосферой, в которой постоянно происходят электрические разряды и другие необычные явления. Они способны заряжать окружающую среду узорами Лихтенберга, создавая таким образом красивые и завораживающие картины.\n\nГлавная особенность Лихтспидов - их невероятная скорость. Они могут резко менять упругость своего тела, что позволяет им совершать молниеносные рывки и маневры. В естественной среде они используют это для охоты и избегания опасностей.\n\nЛихтспиды разумны и обладают быстрым метаболизмом. Они постоянно находятся в движении и любят скорость. Их язык - серия очень быстрых щелчков и треском, напоминающих электрические разряды.\n\nВстреча с Лихтспидом - это всегда яркое и волнующее событие. Их скорость и способность &quot;рисовать&quot; электричеством никого не оставят равнодушным. Это поистине дети скорости и энергии, воплощение динамики и силы.\n\nЛихтспид способен совершать поистине эпичные и разрушительные атаки, используя свою способность управлять разрядами Лихтенберга и щекотать атомы.\n\nОдна из его фирменных атак - Шторм Лихтенберга. Лихтспид создает вокруг себя бушующую электрическую бурю, наполненную хаотичными разрядами в виде прекрасных узоров. Эта буря поражает всех врагов в радиусе действия, нанося им серьезный урон.\n\nДругая впечатляющая способность - Резонансный взрыв. Лихтспид щекочет атомы цели на их резонансной частоте, вызывая мощный взрыв изнутри. Это очень эффектная и опустошительная атака, способная уничтожить даже крупных и хорошо защищенных противников.\n\nЛихтспид также может сфокусировать разряды в направленный луч, создавая атаку Молния Лихтенберга. Этот луч не только наносит урон, но и временно парализует цель красивыми узорами электричества.\n\nДля борьбы с техникой врагов у Лихтспида есть ЭМИ-импульс - мощный электромагнитный импульс, выводящий из строя электронику и механизмы в большом радиусе.\n\nКомбинируя эти атаки в связки, Лихтспид становится по-настоящему грозным противником. Он может, например, ослепить врагов вспышкой, затем поразить их Штормом Лихтенберга, и добить парализованных Резонансным взрывом. Сражаться с ним - все равно что попасть в эпицентр грозы, полной первозданной мощи и завораживающей красоты электрических разрядов.\n\nСпособность менять упругость тела в сочетании с контролем над электричеством позволяет Лихтспиду совершать поистине впечатляющие трюки и маневры.\n\nОдним из его коронных приемов является Молниеносный рывок. Лихтспид резко меняет упругость своих мышц, многократно увеличивая их силу, и совершает невероятно быстрый бросок в любом направлении. Со стороны это выглядит как мгновенное исчезновение и появление в другом месте, сопровождаемое электрическим треском.\n\nНе менее эффектен трюк Грозовой прыжок. Лихтспид накапливает энергию в своем теле, сжимаясь подобно пружине, а затем резко высвобождает ее, взмывая на огромную высоту. В верхней точке он иногда создает красивые электрические узоры, зависая на мгновение в воздухе.\n\nЛихтспид способен сжиматься до невероятно малых размеров, протискиваясь сквозь крошечные щели и отверстия. Это позволяет ему проникать практически куда угодно и застигать врагов врасплох.\n\nВ бою Лихтспид постоянно находится в движении, отталкиваясь от стен, потолка и других поверхностей. Его тело при этом работает как идеальный упругий мяч, позволяя совершать немыслимые маневры на огромной скорости.\n\nЛихтспид также может менять форму своего тела, делая его более обтекаемым для уменьшения сопротивления воздуха. Соединяя это с электрической тягой, он способен развивать просто фантастическую скорость.\n[154460] 2024-04-06 19:07 Слава: Ну оно даёт почву для размышления\n[154461] 2024-04-06 19:07 Миколай: Ага\n[154463] 2024-04-06 19:07 Миколай: Нейронка смогла с помощью этого что-то придумать\n```\n\n### Версия 2 — 2024-04-06\n\nвселенная: игра бога (по дате объявления) · окно w0030 · сообщения 154473–154479\n\n*что здесь: Авторское уточнение М: идея щекотания атомов его, но имелось в виду, что молния в атмосфере возникает от щекотания атомов; резонансный взрыв — уже интерпретация нейронки, прикольно, но для баланса можно убрать или ослабить.*\n\n\n\n```chat\n[154473] 2024-04-06 19:14 Слава: Да же какой то через чур инбаласный \nЩекотать атомы\n[154474] 2024-04-06 19:15 Миколай: Это я придумал\n[154475] 2024-04-06 19:15 Миколай: Ну он не совсем верно понял\n[154476] 2024-04-06 19:15 Миколай: Я имел ввиду именно молния создаётся в атмосфере из-за того что атомы щекочат\n[154477] 2024-04-06 19:15 Миколай: Я так это понимаю\n[154478] 2024-04-06 19:16 Миколай: А тут он придумал делать резонанс\n[154479] 2024-04-06 19:16 Миколай: Это прикольно но для баланса можно убрать или ослабить\n```\n\n### Версия 3 — 2024-04-06\n\nвселенная: игра бога (по дате объявления) · окно w0030 · сообщения 154480–154484\n\n*что здесь: Правило ослабления от С: на людей действует слабее, а если противник сильный — ещё слабее.*\n\n\n\n```chat\n[154480] 2024-04-06 19:17 Слава: Ну можно что бы на людей он действовал слабей и если противник сильный то ещё слабее\n[154481] 2024-04-06 19:17 Миколай: А так норм?\n[154482] 2024-04-06 19:18 Миколай: И врд на дистанции он атаки делает\n[154483] 2024-04-06 19:18 Слава: А так самый лучший\n```\n\n## Часть чего\n\nЛихтспид</div>"}];</script>
