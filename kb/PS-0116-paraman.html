лай: че последняя тема была\n[201746] 2024-07-09 21:31 Слава: Параман\n[201747] 2024-07-09 21:31 Слава: Это бог в которого они верят\n[201748] 2024-07-09 21:31 Миколай: а\n[201749] 2024-07-09 21:31 Миколай: так\n[201750] 2024-07-09 21:32 Миколай: и что это такое\n[201751] 2024-07-09 21:32 Слава: Что именно\n[201752] 2024-07-09 21:32 Миколай: что бог из себя представляет\n[201753] 2024-07-09 21:32 Миколай: на деле\n[201754] 2024-07-09 21:33 Слава: Просто бог которого придумали чтобы оправдать свои действия\n[201755] 2024-07-09 21:33 Миколай: а этот хуй папа римский типа\n[201756] 2024-07-09 21:33 Слава: Да\n[201758] 2024-07-09 21:34 Миколай: блячя\n[201759] 2024-07-09 21:34 Миколай: бляя\n[201760] 2024-07-09 21:34 Миколай: брат\n```\n\n### Версия 3 — 2024-07-09\n\nвселенная: 7 островов (по дате объявления) · окно w0046 · сообщения 201803–201826\n\n*что здесь: религиозная догма вокруг него: очищение мира от одержимых демоном и непонимающих бога; вера в то, что отец может с ним разговаривать*\n\n\n\n```chat\n[201803] 2024-07-09 21:39 Слава: Религия \nНам нужно истребить всех тех в кого вселился демон всех тех кого не понимает нашего бога мы должны очистить мир для спасения его\n[201804] 2024-07-09 21:39 Миколай: я как психолог себя чувствую\n[201805] 2024-07-09 21:39 Слава: Правительство\n[201806] 2024-07-09 21:40 Миколай: ну это то я пон. просто поверхностное описание, ну лан\n[201807] 2024-07-09 21:40 Слава: Откуда ресурсы ведь они не с кем не сотрудничает\n[201808] 2024-07-09 21:40 Миколай: власть у церкви, правитель папа Римский\n[201809] 2024-07-09 21:40 Слава: Кто именно\n[201810] 2024-07-09 21:40 Слава: Персы\n[201811] 2024-07-09 21:41 Слава: И их 3 главных правителей\n[201812] 2024-07-09 21:41 Миколай: ну папа это этот хуй\n[201813] 2024-07-09 21:41 Миколай: защитник\n[201814] 2024-07-09 21:41 Слава: Нет\n[201815] 2024-07-09 21:41 Миколай: они конкретно в него верят\n[201816] 2024-07-09 21:41 Миколай: че\n[201817] 2024-07-09 21:41 Миколай: ну бога но и него\n[2
