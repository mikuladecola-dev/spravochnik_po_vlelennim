const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Разбор истории Славы по пунктам (части 1 и 2)\n\n*служебное* · вселенные: монстры\n\n## Навигация\n\n- (w0064) Рабочая заметка Миколая: он разложил обе части истории Славы на короткие строки-факты, чтобы разобрать логику и потом дать комментарии. Служебная схема, а не сам материал.\n\n## Связано с\n\nгг (главный герой истории про существо)\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-11-13\n\nвселенная: монстры (по дате объявления) · окно w0064 · сообщения 256967–256968\n\n*что здесь: Полный пофразовый конспект части 1 и части 2*\n\n\n\n```chat\n[256967] 2024-11-13 22:03 Миколай: часть 1.\nгг с сестрой переезжает в родной город.\nиз-за родителей.\nродители:\nвечно на работе\nне питают чувств к детям.\nгг думает, что они его ненавидят.\nу его новой школы плохая репутация.\nпраздники они не отмечают вместе.\nавтор описывает ситуацию гг как &quot;непостоянная жизнь&quot;\nгг привык к ней.\nу его сестры есть ребёнок требующий внимания.\nгг волнует состояние сестры.\nстарается уделить ей достаточно внимания.\nно этого не хватает.\nс наигранной улыбкой пошел в школу.\nготов к драке.\nне боялся ударов.\nэто для него естественно как вращение земли.\nпо возвращении домой, по среди дороги у него был ступор.\nон посчитал это необычным.\nступор был странным.\nгг думал что привык к страху тренеруясь в драках.\nпо факту переборол страх.\nтак что в ступоре просто стоял.\nпонимал что кто-то идёт.\nнечто большое, настолько что в центре города негде спрятаться существу.\nгг стоял и пытался дёрнуться.\nпараллельно существо подошло к нему.\nположило длинные руки на плечи гг.\nу с.: \nдлинные руки\nпальцы\nострые когти.\nмомент:\nслюна с. капнула на гг\nкогти прибили кожу.\nгг получил контроль над телом.\nбежал бесцельно.\nмозг кричал БЕЖАТЬ.\nпришел в себя в густом лесу.\nв лесу будто ночь.\nчерное озеро будто нефть а не вода.\nгг выпил оттуда.\nвспомнил о сестре.\nпереживал что она одна дома.\nвдруг монстр что-то сделает.\nпобежал не восстановившись.\nради сестры, а не себя.\nдля него она близкая и бесконечно любимая.\nготов перевернуть небеса, ради её безопасности.\nне зная дороги добежал до дома.(чудом)\nбоялся открыть дверь и увидеть трагедию.\nлибо труп сестры, либо её отсутствие.\nвозможно лишился рассудка об опоздании спасти сестру.\nвсё-таки открыл дверь.\nувидел лишь коридор.\nуслышал топот ножек.\nувидел сестру.\nона цела и невредима.\nон хотел:\nкричать\nплакать\nпотерять сознание.\nслишком много эмоций быстро утихло.\nон не:\nкричал\nплакал\nтерял сознание.\nгг лучезарно улыбался.\nпобежал за сестрой дабы обнять и защекотить.\nскрывая за этим 20 минутную бурю эмоций.\nпосле в туалете резал кожу и плоть.\nэто его способ выразить эмоции\n\n___\nчасть 2.\n\nгг проснулся.\nчувствует себя разбитым.\nтело болит.\nглаза закрываются.\nнет желания встать и идти в школу.\nрассказывает убеждение: \nучится для себя\nне для родителей (которых не бывает дома)\nне для учителей (которые часто меняются).\nради себя через физическую боль встал.\nтело болело после вчерашней пробежки.\nпошел в ванну:\nумыться\nприйти в себя.\nво время мытья болела рука.\nне обращал внимания.\nназвал это ключом.\nоделся.\nпроверил что сестра не спит.\nпошел в школу.\nпо пути улицы были пусты.\nэто волновало его.\nволнения не оправдались, всё обошлось.\nдошел до школы.\nна крыльце встретил &quot;здоровяка&quot;\nон ждал его после вчерашнего.\nвчера гг разбил ему нос .\nтогда же &quot;здоровяк&quot; ждал гг после уроков на заднем дворе с бандой.\nз. и банда отмудохали гг вчера.\nпосле случившегося вчера, гг не боится з..\nтеперь видит з. как незначительного.\nударил з. по лицу.\nдраться:\nприятно\nчтобы забыть обо всём\nпросто бить толстого задиру\nпопы
