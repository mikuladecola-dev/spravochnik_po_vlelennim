21 20:53 Миколай: ну бля\n[272674] 2024-12-21 20:54 Миколай: на то и было время до средневековья\n[272675] 2024-12-21 20:54 Миколай: были люди\n[272676] 2024-12-21 20:54 Миколай: мыслители великие\n[272677] 2024-12-21 20:54 Слава: И чё\n[272678] 2024-12-21 20:54 Миколай: сука\n[272679] 2024-12-21 20:54 Миколай: пидр конченый\n[272680] 2024-12-21 20:54 Миколай: ебло завали\n[272681] 2024-12-21 20:54 Миколай: я объясняю\n[272682] 2024-12-21 20:55 Миколай: они выдвигали идеи, участвовали широко в общественной жизни\n[272683] 2024-12-21 20:55 Миколай: поличили много опыта\n[272684] 2024-12-21 20:55 Миколай: работали с разными магами\n[272685] 2024-12-21 20:55 Миколай: и поняли основные принципы\n[272686] 2024-12-21 20:56 Миколай: в своих книгах они изложили эти мысли\n[272687] 2024-12-21 20:56 Миколай: наука\n[272688] 2024-12-21 20:56 Миколай: это то\n[272689] 2024-12-21 20:56 Миколай: что не понимается по разному\n[272690] 2024-12-21 20:56 Слава: Философия не точная наука\n[272691] 2024-12-21 20:56 Миколай: они имеет одно значение\n[272692] 2024-12-21 20:56 Миколай: ротик офни\n[272693] 2024-12-21 20:57 Миколай: люди на основе этих идей смогли написать учебники\n[272694] 2024-12-21 20:57 Миколай: опираясь на знания написанные в этих учебниках\n[272695] 2024-12-21 20:58 Миколай: можно написать свои мысли\n[272696] 2024-12-21 20:58 Миколай: и материализовать через вливание маны\n[272697] 2024-12-21 20:58 Миколай: обучение идет не содержательной части\n[272698] 2024-12-21 20:58 Миколай: естественно у всех она разная\n[272699] 2024-12-21 20:58 Миколай: их обучают форме\n[272700] 2024-12-21 20:59 Миколай: то каким образом работает та или иная структура гримуара\n[272701] 2024-12-21 20:59 Слава: Зачем\n[272702] 2024-12-21 21:06 Миколай: есть магия которую ты используешь в голове и типа да круто все дела\n\nты можешь её понять кастуя и восстанавливая ману\n\nты можешь использовать гримуар, в котором есть заклинание и питать его маной:\n\nзачем? во первых это облегчит тебе про
