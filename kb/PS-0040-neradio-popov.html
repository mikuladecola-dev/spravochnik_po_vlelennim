<script>const BASE="../";const DOCNAME="Нерадио Попов";

const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Нерадио Попов\n\n*персонаж* · вселенные: игра бога\n\n## Навигация\n\n- (w0029) Карточка персонажа Миколая: слабый здоровьем наркоман и наркодилер 20 лет, шутит про суицид, пытается казаться крутым. Способность поглощения душ прикосновением с жёсткой механикой счётчика касаний и с возможностью заряжать душами наркотики.\n\n## Связано с\n\nИгра бога\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-04-02\n\nвселенная: игра бога (объявлено) · окно w0029 · сообщения 153328–153328\n\n*что здесь: полная карточка: одна душа в месяц, второе касание за месяц уводит добытую душу, третье — его собственную; душа в наркотике даёт 20 минут власти над употребившим; отдав душу наркоте, гибнет уже со второго касания*\n\n\n\n```chat\n[153328] 2024-04-02 23:02 Миколай: Нерадио Попов\n\nСлабый по здоровью человек, наркоман и нарко диллер, любит шутки о суициде говоря о том что не достоин жить делая те ужасы которые может, пытается казаться сильным и крутым 20 годиков\n\nСпособность: при прикосновении поглощает душу, в месяц одна\nЕсли раз коснётся за 1 месяц, то добытая душа уйдёт, если 3 раз то его уже душа уйдёт.\nДуши можно добавлять в наркотики и всякий кто их употребит на 20 минут будет во власти души хранящейся в наркотике.\nЕсли отдал душу наркоте, то смерть будет уже от 2 прикосновения, а не 3\n```</div>"}];</script>
