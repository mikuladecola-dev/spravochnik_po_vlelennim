<script>const BASE="../";const DOCNAME="Анализ «Бессмертного»";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Анализ «Бессмертного»\n\n*служебное* · вселенные: вне вселенной\n\n## Навигация\n\n- (w0083) Рабочие заметки Миколая, которые он писал неделю, пока читал историю «бессмертный»: последовательный разбор по шагам, что понял и чего не понял в тексте соавтора. Выложены двумя длинными сообщениями.\n\n## Связано с\n\nМальчик (Бессмертный)\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-03-20\n\nвселенная: вне вселенной (по дате объявления) · окно w0083 · сообщения 306602–306614\n\n*что здесь: сам текст заметок и пояснение, что это его собственный анализ, писавшийся неделю*\n\n\n\n```chat\n[306602] 2025-03-20 20:31 Миколай: так\n[306603] 2025-03-20 20:31 Миколай: а я пока пошел анализ сделаю\n[306605] 2025-03-20 20:38 Миколай: перс: не понял где он и кто он. \n\nописывает сцену где на нём лежат трупы. \n\nдалее рассуждает, что значит быть трупом.\n\nтруп = человек истекающий кровью. такая посылка. она не помогла. он сказал что на нем лежат трупы, определил что трупы истекают кровью, на людях что на нем лежат крови не было. получавется это не трупы. \n\nон забросил мысль.\n\nпологаю он вылез из &quot;ямы смерти&quot;\n\nно он не знает что такое смерть\n\nна большой територии он чувствовал запах трупов, но видимо далеко от него, но он уверен что верно определил источник запаха. пахло в могиле на большое растояние\n\n&gt; *полагаю он вылез из &quot;ямы смерти&quot;*\n\n  оказывается это братская могила времён 2й мировой\n\nон пытается определить дальнейшую деятельность\n\nне знает как его зовут\n\nон начал чуять свой запах, это послужило тригером принятия решения о дальнейшей деятельности.\n\nначал куда-то передвигаться, возможно бегом, но он не может дать понятие этому определению, так что предположение о беге интуитивное. \n\nон ничего не помнит\n\nпонял что действительно бежал. это также интуитивное понимание. он никогда так быстро не бегал как сейчас\n\nсравнивает свою скорость с птицей прорывающей клювом воздух\n\nон кого-то обогнал, возможно птиц. из текста не ясно.\n\nв него врезалось что-то железное и стекляное, прозваное махиной. \n\nему было больно. он вспомнил быстро что это такое. это чувствовала голова, будто в неё камень бросили но быстро, быстрее чем взрослые или дети. не совсем понял причем тут взрослые и дети.\n\nвидимо когда в него врезалась махина он упал. а теперь шатаясь встаёт. и резко ему полегчало, боли и воспоминаний не стало. \n\nкакие-то люди что-то кричали. какие те? те трупы о которых шла речь? он не понимал их язык\n\nон задумался. возможно он не понимает их речь потому что сам после пробуждения не сказал ни слова\n\nхотел сказать привет. но не успев пологаю в него выстрелили\n\nему снова больно, он был готов заплакать\n\nзадаёт вопрос: как так можно? почему?\n\nутверждает что родился в боли, помнил только боль \n\nон простил людей за то что в него врезались\n\nне чувствует благодарности которой ожидал\n\nвместо блогодарности получил боль\n\nон отказывается далее прощать\n\nон побежал в сторону людей, в него чаще стреляли\n\nему стало больнее\n\nподумал о длинных руках и это материализовалось\n\nони стали длинее шире и массивнее, видимо его способность\n\nсхватил одного человека. у него из-за рта и других мест пошла кровь. он не ожидал этого ибо счтал что взял легонько, не расчитывал что умрет тот. он отреагировал как: чего он сразу умирать\n\nкогда вертел его рукой ещё 4 человек придавил о машину. странная сцена.\n\nэти люди лопнули как шарики наполненые водой\n\nмашина на него поехала на него, а он не понял как она смогла передвигаться учитывая размер. хотя она и в него врезалась\n\nпока он думал она на него наехала\n\nиз под неё начала течь кровь которая начала сжимать машину?\n\nводитель этого авто не мог ничего сделать, только высказал отчаяние и испуг на немецком языке. он не боялся замкнутых пространств, но не в этом случае, рассказчик говорит любой бы тоже самое чувствовал. \n\nа, там был ещё пассажир\n\nводитель думал как выбраться, он был испуган но не в отчаянии, а вот пассажир был в отчаянии и сдался\n\nмашина схлопнулась \n\nсолдаты смотрели на это. описываемая жидкость описана как чудовище и нечить. стояли не в состоянии сделать что-то. их вера в исключительность их расы пошатнулась но не пропала\n\nон говорит это его рук дело. после вылез из под машины или прямо из машины и удивился увидев двух людей, он так говорил словно может помимо людей ещё кто то стоять\n\nкогда они его заметили они не стреляли а убежали.\n\nтогда он подумал почему сам не убежал когда в него стреляли\n\nони ему казались медлеными, не ему было сложно стравнить, но пологаю относительно него, ведь он их быстро догнал\n\nодного ударил по ноге, а она странно выгнулась\n\nэтот человек закричал и гг посчитал крик мерзким и бесил его\n\nтогда он спросил: зачем кричишь. но тот продолжал орать\n\nвторого рукой захотел остановить поставив перед ним и тот в воздухе закрутился и захрипел\n\nблаго не орал..\n\nкричащий имел запах гг, а в глазах его тот видел своё отражение\n[306606] 2025-03-20 20:38 Миколай: себя он видит как: ребенка испачнканого в крови и с ярко белыми глазами, сравнивая со слепым. улыбающийся но не от доброжелательности. таков был и кричащий\n\nно важнее запах гг исходящий из железного предмета кричащего который у него на бедре\n\nзахотел задать вопрос но вспомнил что его не понимают\n\nрешил показать на себя потом на него\n\nон хотел услышать своё имя, но тот сказал чтото непонятное.\n\nтогда гг испытал недоверие отвращение и удивление\n\nон подумал что тот назвал своё имя, но ему это не надо\n\nон повторил жест\n\nно тот не понял что от него хочет это чудище\n\nв и даже когда в глазах была осмысленость тот ничего не сказал и стыдясь опустил лицо\n\nтак и не понял знает ли он имя, но склонялся к тому что да, тот что-то должен знать о гг\n\nно когда тот молчал гг понял что имя тот не помнит но явно знал\n\nон его сильно избив не понимая как можно забыть того кого убил\n\nон снова перестал понимать что делает и что с ним\n\nу него заболела голова и он оттуда ушел\n\nа тот солдат со сломаной ногой продолжал лежать и плакать, возможно читая молитву\n\nгг пытался вспомнить всё что забыл, как он говорит открыть шкатулку с воспоминаниями. \n\nоднако попытки не успешны. предпологает что эта коробочка пуста, из-за того что воспоминания кто-то силой вытащил\n\nон не знает что с этим делать. \n\nдалее не понятная метафора. он погрузился в себя как будто нырнул в пустую бездну где изначально ничего не было. а ну хотя может и понятно, тобиж как в бассейн нырнул а думал что море где на дне можно найти хотя бы камни, но видел только пол\n\nв этой тьме он пытался что-то найти, но кроме воспоминаний о боли ничего\n\nкакой то вопрос о боли\n\nу него болела нога но выстрел он не слышал, значит я понимаю что в него сейчас ктото выстрелил\n\nэтот ктото смеялся, их несколько. точнее 12 с 3 танками: железная махина без стекла с трубой. домик\n\nв них смеялись, он не понял почему смеются когда ему больно\n\nтогда он разгневался. люди дарят боль ему, вместо множества других чувств что-то столь не приятное\n\nтогда ему хотелось их разорвать и зачем то пустить их души из оболочки\n\nсолдатам смешно наблюдать за мальчиком который ничего не может\n\nтакая реакция не каждому по душе\n\nу других тоже дети и боль другого ребенка тяжело видеть\n\nа ведь ничего с этим не поделать так как командир с садизмом\n\nс ним не могли или не хотели ничего делать\n\nно они увидели &quot;кару божию&quot;\n\nмальчик с блестящими как у хищника глазами. из него чтото вылетело, не все заметили а кто заметил перестал притворяться что смешно.\n\nа командир не верующий стал таким когда было поздно\n\nне успели среагировать и как будто демоническая, удлиненая рука одстая
