<script>const BASE="../";const DOCNAME="Изб";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Изб\n\n*персонаж* · вселенные: неясно\n\n## Навигация\n\n- (w0120) Новый персонаж, сокращение от Избранный. Задуман просто как летающий персонаж, потом засунут в столпы героев и дособран, чтобы не выглядеть ущербно рядом с Графом и Нуаром. Юноша-новичок, хочет быть героем из телевизора, любит, когда его боготворят, плохо переносит критику, серая мораль, стремится к идеалам.\n- (w0121) В окне назначается главным героем и получает уточнение по неуязвимости, а позже противопоставляется Бэму как идеалист, чьи идеалы падут.\n\n## Связано с\n\nАссоциация и лицо ассоциации, Бэм, Влияние на реальность, Герой, Инцидент с вирусом Нимба, Мерцание (Изб), Неуязвимость, Полёт, Праведник, Сверхчеловеческая сила, Слом Изб, Фан-база Изб, Шесть столпов героев\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2026-06-02\n\nвселенная: неясно (по дате объявления) · окно w0120 · сообщения 487006–487008\n\n*что здесь: введён в список персонажей на разбор вместе с Графом и Нуаром*\n\n\n\n```chat\n[487006] 2026-06-02 08:56 Слава: Кстати до этого ИС. Ну до Нуара. Были тоже в принципе не плохие. Ну большинство из них теряли рассудок или у них появлялись дефекты тела или они умирали. Превращались в жижу ну и т. Д. \nНуар первый ИС кто сохранил разум и получил способности без каких либо дефектов.\n[487007] 2026-06-02 08:57 Слава: Итак у меня есть три персонажа которых надо разобрать \nГраф \nНуар \nИзб\n[487008] 2026-06-02 08:58 Слава: Ну начнём с Нуара. Ведь я просто добавил пару способности и улучшил тьму.\n```\n\n### Версия 2 — 2026-06-02\n\nвселенная: неясно (по дате объявления) · окно w0120 · сообщения 487017–487018\n\n*что здесь: происхождение замысла: летающий персонаж, дособр жество людей умрут. \nНу здесь вопрос как он убил этих перевоплощенных людей. Он таранил их своим телом улыбаясь. И не потому что ему это нравилось, а потому что для него героя тот кто всегда улыбается. \nПосле этого инцидента было множество критики в сторону Изб. Что ментально на нём сказалось. Он ещё юноша и новичок. Хотя и имеет сильнейшую способность\n[487021] 2026-06-02 10:10 Слава: По характеру. \nГраф высокомерный и часто раздражённые из-за боли в голове. \n\nИзб новичок который стремится к идеалами.\n```\n\n### Версия 4 — 2026-06-02\n\nвселенная: неясно (по дате объявления) · окно w0120 · сообщения 487042–487048\n\n*что здесь: расшифровка имени — от «Избранные»*\n\n\n\n```chat\n[487042] 2026-06-02 10:55 Миколай: прям Изб\n[487043] 2026-06-02 10:55 Миколай: ?\n[487044] 2026-06-02 10:55 Слава: Ну типа Избранные\n[487045] 2026-06-02 10:56 Слава: Изб\n[487046] 2026-06-02 10:57 Миколай: не описал но чувствуешь что есть ещё что-то?\n\nили при встрече хочешь\n[487047] 2026-06-02 10:57 Миколай: а\n[487048] 2026-06-02 10:57 Слава: Чувствую\n```\n\n### Версия 5 — 2026-06-03\n\nвселенная: неясно (по дате объявления) · окно w0121 · сообщения 487514–487516\n\n*что здесь: не стал лицом ассоциации, потому что неустойчив; в инциденте его спасает Праведник*\n\n\n\n```chat\n[487514] 2026-06-03 12:17 Слава: Герой лицо ассоциации. Давай назовём его &quot;Праведник&quot;.\nСпособность праведника слышать мольбы, воскрешения и маломальская видения будущего. Но также дополнительная он будет способен видить картинку будущего, точнее картинку инцидента где умрут множество людей, так отголосок он увидит во сне. \nВо первых у него нет боевых способностей. Он просто будет усилять себя с помощью Оам. И ц него самая плотная плёнка, Из-за того, что-то как бы является на полшишечки коллективным разумом. Ну его разум открыт для других разумов поэтому он растёт вместе с тем разумом который но вырос. \nВ инциденте Изб. Он спасёт его от злодея. А после на глазах всех людей будет давить и ломать кости злодея. И скажет что ему без разницы что будут делать злодей, ведь итог один он их убьёт и ему без разницы мнения общества или предыстория злодей, а также его цель он просто убьёт их. \nТакже он предсказал инцидент где апостол устроят геноцид. И они попытался им мешать. Очень сильно мешал. Но всё равно апостолы сделали своё дело, хотя и не так полноценно как сами того хотели. \nПочему именно праведник лицо ассоциации. Потому что он всегда героет, он всегда придёт на помощь даже когда злодей будут действовать скрытно. Также он не плохая пропаганда. Вот героем номер один может стать даже человек без атакующей способность. А также он устойчив. \nПочему другие не стали лицом ассоциации. \nИзб не устойчив\nГраф часто раздражённый \nНуар просто не хотел светиться, и напоминать людям о том что ИС такое сильные \nСвятая дева ( девушка с золотыми волосами. Её способность свет, она может ускоряться и формировать свет. Она боец ближнего боя и у неё свой стиль мяча основанный на её способности. &quot;Боится Нуара, так как тот, когда та ещё стремилась занят места столпа, была сильная им избита в тренировочном бою. Нуар переборщил потому что ему было интересно, как свет противостоит тьме. Но она после этого сильна выросла, потому что у неё появилась мотивация) она в полне себе конкурировала за роль лица ассоциации. Но по итогу проиграла. Не хватило голосов. Возможно в будущем будет заменой праведника.\n--- пауза 1.4 ч ---\n[487516] 2026-06-03 13:39 Миколай: пока-что круто\n```\n\n### Версия 6 — 2026-06-07\n\nвселенная: неясно (по дате объявления) · окно w0121 · сообщения 488439–488440\n\n*что здесь: участвует в инциденте с дырой: летает, спасает людей, бьётся с чудовищами*\n\n\n\n```chat\n[488439] 2026-06-07 19:14 Слава: Давай изменим возраст апостолов теперь им за 40.\nЗвездочёт живёт отдельно от родителей, да и под бинтами не особо видно изменение. Не видно старый он или нет. \nАгрегат уехать путешествовать. Но когда будет возвращаться домой. То будет отшучиваться, типа гены у него хорошие. Родителем граф вобще пофиг ( только они желают что бы он поскорее дал потомство из-за его способности) \nДочь имета. (Доима) \nУ имитатора в подростковом возрасте была мелкая интрижка о которой он забыл. Он и не знал, что та девушка забеременила, поэтому он без беспокойство покинул данный город. \nНимб захватили девушку которая  была беремена от Имета. Им было интересно унаследует ли ребёнок апостола его способности. Время шло ребёнок родился. А мать к сожалению умерла. А над ребёнком начали проводить всяческий эксперименты дабы выявить если у неё особенности апостолов. По итогу когда ей исполнилось восемь лет, ученный сдались и больше не тестировали её. Но и девочку нужно было куда-то девать. Возраст уже вышел и проводить над ней эксперименты бесполезно. Поэтому они просто решили взрастить сотрудника, у них и так нехватка кадрова была. \nОна выросла и является сотрудничей Нимба. Но она так и осталась ребёнком, что мечтает о нормальной семьи. Она всё ещё та маленькая девочка что была заперта в белой комнате, читая книжки и мечтая о семье. И при этом весь этот мир ей кажется отвратным.\nПоэтому её цель воплотить свой мир. С родителями. Она любит Имета считая его единственным дорогим и родным человеком. \nУ неё своя организация ( это конечно громко сказано, там просто несколько сл и ис), о которой нимба неизвестно. \nТакже она произвела один эксперимент. Схватив одного фантазера, что был на грани провалиться в свой мир. Она использовав артефакт. Открыла путь из мира фантазера в наш. И открыла она его в центре города ( ей не нравится этот мир) и со своей группой защищала фантазера, что был ключом, что держит дыру открытой. Пока столпы героев пытались вывести людей и сражались существами, что вылезли из другого мира ( некоторый из этих существ были очень сильными, и их также была десятки тысячи) поэтому в тот день сначала поглотила тьма нуара. (Которой с помощью тьмы спасал граждан, убивал монстров и помогал другим героем, в радиусе 3 км, при этом и сам сражался с достаточно сильным существом и также пытался убить фантазера, которого очень сильно защищали ) после мир окрасился черно белый и Карен начала вести ещё большую поддержку. Там вообще всё столпы участвовали. Там и Изб летал, спасал людей и бился с разными чудовищами. И праведник был, и Клед с графом. \nСуть этого эксперимента была, можно ли объединить миры. Хотя он и не удался, доима осталась довольной результатом. После она также будет проводить мелкие и большие эксперименты. А в конце ну ты знаешь что будет.\n[488440] 2026-06-07 19:14 Слава: Имет кода узнаете что у него дочь. Он не будет с ней драться или мешать ей он просто поговорить с ней по душам. \nПо итогу Доима предложит имет стать союзникам, и создать тот мир где они вместе с матерью будут вместе, как и должно быть. Имет сперва отказывается ему это не особо интересно. Но узнав что Доима поглотили камень желания ( она и до камня желания была сл) помогает. Точнее делает всё возможное чтобы её никто не убил попутно исследуя её организм и ищет лекарство против камня желания. Доима же от заботы и беспокойство отца лишь больше утверждается изменить этот мир, чтобы отец был всегда рядом, как сейчас и чтобы у неё была мама.\n```\n\n### Версия 7 — 2026-06-14\n\nвселенная: неясно (по дате объявления) · окно w0121 · сообщения 489571–489584\n\n*что здесь: теперь главный герой; неуязвим из-за Мерцания — у него никогда не идёт кровь, но синяки, переломы и внутренние повреждения возможны, потому что он идеологически считает, что у героя кровь не идёт*\n\n\n\n```chat\n[489571] 2026-06-14 20:24 Слава: Кстати гг теперь Изб\n[489572] 2026-06-14 20:25 Слава: И тебе ещё дохуя чего там наверху прочитать надо\n[489573] 2026-06-14 20:26 Слава: И изб неуязвим из-за мерцание у него никогда не пойдёт кровь. Но синики и переломы и внутренние повреждения могут быть. \nНо крови никогда, это из-за того что он идеологически думает, что у героя не будет идти кровь\n[489574] 2026-06-14 20:29 Миколай: ну ты посмотри как вышло\n[489575] 2026-06-14 20:29 Миколай: нейросети стали лучше с того времени\n[489576] 2026-06-14 20:29 Миколай: так что\n[489577] 2026-06-14 20:29 Миколай: кто знает\n[489578] 2026-06-14 20:29 Миколай: может и получится тебе что-то круто сделать\n[489579] 2026-06-14 20:30 Миколай: тут кидать или через макс лучше?\n[489580] 2026-06-14 20:30 Слава: Здесь\n[489581] 2026-06-14 20:30 Слава: Я пока дома\n[489582] 2026-06-14 20:30 Слава: И здесь сеть Оке\n[489583] 2026-06-14 20:30 Миколай: нифига\n[489584] 2026-06-14 20:31 Миколай: круто\n```\n\n### Версия 8 — 2026-06-14\n\nвселенная: неясно (по дате объявления) · окно w0121 · сообщения 489826–489851\n\n*что здесь: противопоставлен Бэму: Изб идеалист, и его идеалы в итоге падут*\n\n\n\n```chat\n[489826] 2026-06-14 21:15 Миколай: это изб?\n[489827] 2026-06-14 21:16 Слава: Высокомерный\n[489828] 2026-06-14 21:16 Слава: Эго его больше всего мира\n[489829] 2026-06-14 21:16 Слава: Он ленивыц\n[489830] 2026-06-14 21:16 Слава: Подросток\n[489831] 2026-06-14 21:16 Слава: Что не понимает ценности чего либо\n[489832] 2026-06-14 21:16 Слава: И он мой любимый персонаж\n[489840] 2026-06-14 21:17 Слава: Не изб идеалист и его идеалы в итоге падут\n[489846] 2026-06-14 21:18 Слава: А бэм думающий что весь мир вертится вокруг него. Его идеалы никогда не падут.\n[489847] 2026-06-14 21:18 Слава: Это я как бог заявляю\n[489849] 2026-06-14 21:18 Миколай: а он будет в этой вселенной?\n[489850] 2026-06-14 21:18 Слава: Его идеалы не падут\n[489851] 2026-06-14 21:19 Слава: Конечно\n```</div>"}];</script>
