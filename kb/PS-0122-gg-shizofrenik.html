<script>const BASE="../";const DOCNAME="ГГ-шизофреник";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># ГГ-шизофреник\n\n*персонаж* · вселенные: неясно\n\n## Навигация\n\n- (w0049) Главный герой новой апокалиптической вселенной — шизофреник с перепадами настроения и агрессивностью. По ходу разговора он же оказывается «больным» из пятёрки героев, 28 лет, по профессии фермер.\n\n## Связано с\n\nДерзкий друг гг, Команда гиг (5 человек), апокалипсис (новая вселенная)\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-07-31\n\nвселенная: неясно (по дате объявления) · окно w0049 · сообщения 213677–213696\n\n*что здесь: Первое объявление: гг шизофреник, «классика»; С хочет отталкиваться от перепадов настроения и агрессивности, М спрашивает почему не обычный семьянин — ради красочных боёв и интересных сцен*\n\n\n\n```chat\n[213677] 2024-07-31 19:20 Миколай: который\n[213678] 2024-07-31 19:20 Миколай: новый?\n[213679] 2024-07-31 19:20 Миколай: или где\n[213680] 2024-07-31 19:20 Слава: Новый\n[213681] 2024-07-31 19:20 Слава: Гг шизофреник\n[213682] 2024-07-31 19:21 Миколай: классика, ну окэй\n[213683] 2024-07-31 19:21 Миколай: персы старые\n[213685] 2024-07-31 19:21 Миколай: или с чистого\n[213686] 2024-07-31 19:21 Слава: Нет жди\n[213687] 2024-07-31 19:22 Слава: Я хочу больше отталкиваться на перепад настроение\n[213688] 2024-07-31 19:22 Слава: И агрессивность\n[213689] 2024-07-31 19:22 Слава: Но да классика\n[213690] 2024-07-31 19:22 Миколай: а почему гг ебанашка а не обычный чел семьянин?\n[213691] 2024-07-31 19:23 Миколай: дабы сделать красочные бои?\n[213692] 2024-07-31 19:23 Слава: А чё ?\n[213693] 2024-07-31 19:23 Миколай: интересные сцены\n[213694] 2024-07-31 19:23 Миколай: не я вообще всеми руками за\n[213695] 2024-07-31 19:23 Миколай: просто интересно почему\n[213696] 2024-07-31 19:23 Слава: Просто\n```\n\n### Версия 2 — 2024-07-31 · повтор прежней мысли\n\nвселенная: неясно (по дате объявления) · окно w0049 · сообщения 214253–214272\n\n*что здесь: Подтверждение, что гг — шизофреник; уточняется, что гг будут меняться, но гг есть везде, и это команда*\n\n\n\n```chat\n[214253] 2024-07-31 21:25 Миколай: что с ними\n[214254] 2024-07-31 21:25 Слава: Сдохли\n[214255] 2024-07-31 21:25 Миколай: гг это шизофреник, верно?\n[214256] 2024-07-31 21:26 Миколай: а как они заражают цель?\n[214257] 2024-07-31 21:26 Миколай: их же ещё много бл\n[214258] 2024-07-31 21:27 Слава: Не знаю\n[214259] 2024-07-31 21:27 Слава: Кого шизофреников ?\n[214260] 2024-07-31 21:27 Миколай: прикосновение с кожей? или конкретно проникновение в нервные клетки?\n[214261] 2024-07-31 21:27 Миколай: гг\n[214262] 2024-07-31 21:28 Слава: Аааааа\n[214263] 2024-07-31 21:28 Миколай: эт не вопрос\n[214264] 2024-07-31 21:28 Миколай: это ахуй\n[214265] 2024-07-31 21:28 Слава: Главный герой=гг\nГлавный герои=гиг\n[214266] 2024-07-31 21:28 Слава: Ок\n[214267] 2024-07-31 21:28 Миколай: ок\n[214268] 2024-07-31 21:28 Слава: Ну они будут меняться\n[214269] 2024-07-31 21:29 Слава: Ну гг везде будет\n[214270] 2024-07-31 21:29 Миколай: а, это не команда?\n[214271] 2024-07-31 21:29 Слава: Это команда\n[214272] 2024-07-31 21:29 Миколай: ок\n```\n\n### Версия 3 — 2024-07-31\n\nвселенная: неясно (по дате объявления) · окно w0049 · сообщения 214319–214345\n\n*что здесь: Гг занимает в пятёрке роль «больного»; сначала предложен кондитер, принято — фермер; возраст 28*\n\n\n\n```chat\n[214319] 2024-07-31 21:36 Слава: Механик\n[214320] 2024-07-31 21:36 Слава: И та.\n[214321] 2024-07-31 21:36 Миколай: ты уже решил получается?\n[214322] 2024-07-31 21:37 Миколай: ну больной, врач, военный, механик и подросток\n[214323] 2024-07-31 21:37 Миколай: больной - кондитер\n[214324] 2024-07-31 21:38 Слава: Больной-фермер\n[214325] 2024-07-31 21:38 Миколай: да\n[214326] 2024-07-31 21:38 Слава: Вот\n[214327] 2024-07-31 21:38 Слава: Нет\n[214328] 2024-07-31 21:38 Миколай: бл\n[214329] 2024-07-31 21:38 Слава: Слишком идеально\n[214330] 2024-07-31 21:38 Слава: Механик минус\n[214331] 2024-07-31 21:38 Миколай: бомж\n[214332] 2024-07-31 21:38 Слава: Вместо него да бомж\n[214333] 2024-07-31 21:39 Миколай: журналист бывший\n[214334] 2024-07-31 21:39 Миколай: чья профессия нахуй не всралась\n[214335] 2024-07-31 21:39 Слава: Вово\n[214336] 2024-07-31 21:40 Миколай: ну подростку 13\n[214337] 2024-07-31 21:40 Слава: Говно\n[214338] 2024-07-31 21:40 Миколай: 17\n[214339] 2024-07-31 21:41 Миколай: бомжу 34, врачу 45, больному 28\n[214340] 2024-07-31 21:41 Миколай: военному 50\n[214341] 2024-07-31 21:41 Миколай: позавчера исполнилось\n[214342] 2024-07-31 21:42 Миколай: эмм\n[214343] 2024-07-31 21:42 Миколай: это ещё не всё\n[214344] 2024-07-31 21:42 Миколай: журналист увлекается животным миром\n[214345] 2024-07-31 21:43 Миколай: врач криминальные истории смотрит по вечерам\n```\n\n### Версия 4 — 2024-08-03 · повтор прежней мысли\n\nвселенная: неясно (по дате объявления) · окно w0049 · сообщения 215004–215016\n\n*что здесь: С возвращается к гг и кидает ориентир — «вот он идеал реального сумасшедшего»; М отвечает, что понял, к чему тот стремится*\n\n\n\n```chat\n[215004] 2024-08-03 00:25 Слава: Гг\n[215005] 2024-08-03 00:26 Миколай: выглядит мощно\n[215015] 2024-08-03 00:29 Слава: Вот он идеал \nРеального сумасшедшего\n[215016] 2024-08-03 00:33 Миколай: я понял теперь к чему ты стремишься\n```\n\n### Версия 5 — 2024-08-03\n\nвселенная: неясно (по дате объявления) · окно w0049 · сообщения 215052–215055\n\n*что здесь: М собирает фактуру по шизофрении/агрессии/термину «сумасшедший» под этого персонажа (текст машинный, см. ai_inserts)*\n\n\n\n```chat\n[215052] 2024-08-03 18:44 Миколай: Шизофрения - это серьезное психическое расстройство, которое часто неправильно понимается в обществе. Давайте рассмотрим основные аспекты:\n\nОсобенности поведения шизофреника:\n\n1. Галлюцинации (слуховые, зрительные и др.)\n2. Бредовые идеи\n3. Дезорганизованное мышление и речь\n4. Нарушение эмоциональных реакций\n5. Социальная изоляция\n6. Снижение мотивации и инициативы\n7. Когнитивные нарушения (проблемы с памятью, вниманием)\n\nМифы и романтизация в обществе:\n\n1. Миф: Все шизофреники опасны и агрессивны.\n   Реальность: Большинство людей с шизофренией не представляют угрозы для окружающих.\n\n2. Миф: Шизофрения - это раздвоение личности.\n   Реальность: Это разные расстройства. Шизофрения не связана с множественными личностями.\n\n3. Миф: Люди с шизофренией обладают творческим гением.\n   Реальность: Хотя некоторые творческие люди страдали шизофренией, это не является правилом.\n\n4. Миф: Шизофрения неизлечима.\n   Реальность: При правильном лечении многие пациенты могут вести нормальную жизнь.\n\n5. Романтизация: Шизофрения часто изображается в искусстве как источник уникального видения мира.\n   Реальность: Это серьезное заболевание, которое значительно ухудшает качество жизни.\n\nИные расстройства, с которыми путают шизофрению:\n\n1. Биполярное расстройство: Характеризуется чередованием маниакальных и депрессивных эпизодов.\n\n2. Шизоаффективное расстройство: Сочетает симптомы шизофрении и аффективных расстройств.\n\n3. Обсессивно-компульсивное расстройство (ОКР): Характеризуется навязчивыми мыслями и действиями.\n\n4. Посттравматическое стрессовое расстройство (ПТСР): Может вызывать симптомы, похожие на психоз.\n\n5. Расстройство личности: Некоторые типы, например, шизоидное расстройство личности, могут иметь схожие черты.\n\n6. Деменция: В некоторых случаях может проявляться психотическими симптомами.\n\n7. Расстройство множественной личности: Часто путают с шизофренией из-за неправильного понимания обоих заболеваний.\n\nВажно помнить, что шизофрения - это сложное заболевание, которое требует профессиональной диагностики и лечения. Стигматизация и неправильное понимание этого расстройства могут усугубить проблемы людей, страдающих шизофренией, и затруднить их социальную адаптацию. Образование общества и распространение достоверной информации о психических заболеваниях крайне важны для улучшения качества жизни людей с такими диагнозами.\n[215054] 2024-08-03 18:45 Миколай: Давайте рассмотрим, какие состояния чаще ассоциируются с повышенным риском агрессивного поведения:\n\n1. Антисоциальное расстройство личности:\n   - Характеризуется пренебрежением к правам других\n   - Отсутствие эмпатии и раскаяния\n   - Импульсивность и агрессивность\n\n2. Пограничное расстройство личности:\n   - Нестабильность в межличностных отношениях\n   - Интенсивные вспышки гнева\n   - Импульсивное поведение\n\n3. Биполярное расстройство (в маниакальной фазе):\n   - Повышенная раздражительность\n   - Импульсивность\n   - Агрессивное поведение при сильном возбуждении\n\n4. Посттравматическое стрессовое расстройство (ПТСР):\n   - Повышенная возбудимость\n   - Вспышки гнева\n   - Агрессивные реакции на триггеры\n\n5. Расстройства, связанные с употреблением психоактивных веществ:\n   - Алкогольная или наркотическая интоксикация может вызывать агрессию\n   - Синдром отмены также может сопровождаться агрессивным поведением\n\n6. Интермиттирующее эксплозивное расстройство:\n   - Характеризуется периодическими вспышками агрессии\n   - Неспособность контролировать агрессивные импульсы\n\n7. Некоторые формы деменции:\n   - Могут сопровождаться агрессивным поведением из-за изменений в мозге\n\nВажно отметить:\n1. Наличие психического расстройства не означает автоматически, что человек опасен.\n2. Большинство людей с психическими расстройствами не проявляют агрессии.\n3. Риск агрессивного поведения повышается при отсутствии лечения и поддержки.\n4. Социальные факторы, стресс и окружающая среда играют важную роль в проявлении агрессии.\n\nСтигматизация людей с психическими расстройствами как опасных вредна и неоправданна. Правильное лечение и поддержка значительно снижают риски агрессивного поведения.\n[215055] 2024-08-03 18:48 Миколай: Вы правы, &quot;сумасшедший&quot; - это не медицинский диагноз, а разговорный термин, который часто используется некорректно. Вот что обычно подразумевается под этим словом:\n\n1. Психотические состояния:\n   - Острые психозы\n   - Шизофрения\n   - Биполярное расстройство в маниакальной фазе\n\n2. Тяжелые формы других психических расстройств:\n   - Тяжелая депрессия\n   - Обсессивно-компульсивное расстройство\n   - Посттравматическое стрессовое расстройство\n\n3. Неврологические заболевания:\n   - Некоторые формы деменции\n   - Делирий\n\n4. Поведение, отклоняющееся от социальных норм:\n   - Эксцентричность\n   - Нестандартное мышление или поведение\n\n5. Временные состояния измененного сознания:\n   - Алкогольное или наркотическое опьянение\n   - Сильный эмоциональный стресс\n\nВажно понимать:\n\n1. Использование термина &quot;сумасшедший&quot; стигматизирует людей с психическими расстройствами.\n2. Это слово не отражает реальной природы психических заболеваний.\n3. Его употребление может препятствовать обращению за профессиональной помощью.\n4. В медицине и психологии используются точные диагнозы, а не обобщенные ярлыки.\n\nВместо использования таких терминов лучше обращаться к конкретным диагнозам или описывать наблюдаемое поведение без оценочных суждений. Это способствует более точному пониманию ситуации и уменьшает стигматизацию людей с психическими расстройствами.\n```\n\n## Неясности\n\n- (w0049) Имени у персонажа нет; неясно, шизофрения ли это в итоге или просто «сумасшедший» как ориентир</div>"}];</script>
