<script>const BASE="../";const DOCNAME="АЗИП";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># АЗИП\n\n*мир* · вселенные: Апостол\n\n## Навигация\n\n- (w0099) Организация Славы, вербующая агентов для уничтожения опасных существ и чужемирцев. В окне впервые раскрыты расшифровка аббревиатуры, публичное прикрытие (сеть бизнесов), масштаб и основатели.\n- (w0103) Нерушимая организация апостолов/благословенных, существует более сотни лет. Слава ищет злодея, от которого людям будет страшно, что &#x27;Азип не вывозит&#x27;.\n\n## Связано с\n\nАгент АЗИП, Апостолы, Благословенные, Контракт и правила агента АЗИП, Кура, Чужемирцы\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-05-28\n\nвселенная: Апостол (объявлено) · окно w0099 · сообщения 330906–330940\n\n*что здесь: определение агента (люди или чужемирцы, завербованные ради уничтожения опасных существ); права и обязанности — право уничтожать, обязанность писать отчёт; контракт, из которого можно выйти, подписав документы о неразглашении, иначе наказание*\n\n\n\n```chat\n[330906] 2025-05-28 12:36 Слава: Права и обязанности агента ?\n[330907] 2025-05-28 12:37 Миколай: агента чего\n[330908] 2025-05-28 12:37 Слава: Под накидай вариантиков\n[330909] 2025-05-28 12:38 Слава: Агент- это люди или чужемирцы, которых завербовали в организацию АЗИП. \nИ их главная цель уничтожения опасных существ. Буть то люди или чужемирцы\n[330910] 2025-05-28 12:39 Слава: ..\n[330911] 2025-05-28 12:39 Слава: Гав\n[330912] 2025-05-28 12:40 Слава: Ээ\n[330914] 2025-05-28 12:41 Миколай: я Нике подарок дарил\n[330915] 2025-05-28 12:41 Миколай: ща\n[330916] 2025-05-28 12:41 Слава: Какой?\n[330917] 2025-05-28 12:41 Миколай: девушке\n[330918] 2025-05-28 12:41 Миколай: стихи\n[330919] 2025-05-28 12:41 Миколай: думал твоему персонажу 05:19 Миколай: зачем и на кого она работает\n[331240] 2025-05-30 05:21 Миколай: каким образом не государственная компания имеет право выдавать подобные права\n[331241] 2025-05-30 05:21 Миколай: возможно был когда-то совет 300+ государств о создании и поддержании такой организации?\n[331242] 2025-05-30 05:22 Миколай: тоже как агент?\n[331243] 2025-05-30 05:23 Миколай: тогда уже переподготовку\n[331244] 2025-05-30 05:23 Миколай: смешно, лучше просто убейте\n[331245] 2025-05-30 05:26 Миколай: а на каком языке это сказано? как чел из абсолютно другого мира поймёт речь одного из 300+ языков\n[331246] 2025-05-30 05:27 Миколай: даже то что я поел у вас в столовой?\n[331247] 2025-05-30 05:28 Миколай: получается рубли и язык русский.... мде\n```\n\n### Версия 4 — 2025-05-30\n\nвселенная: Апостол (объявлено) · окно w0099 · сообщения 331442–331461\n\n*что здесь: ответы Славы: контракт российский; 21 главный филиал, у каждого свои подфилиалы и разные компании; сотрудники делятся на агентов и обычных работников компаний; условно 700 000 000 сотрудников-людей; филиалы по всему миру, на Северном полюсе сидят два апостола; основатели и заказчики организации — апостолы, цель — защита порядка*\n\n\n\n```chat\n[331442] 2025-05-30 10:56 Слава: У меня снова гепотит С\n[331443] 2025-05-30 10:56 Слава: Ну типо контракт России\n[331444] 2025-05-30 10:59 Слава: Ну у неё 21 главных филиалов. У каждого филиала ещё есть свои филиалы. На их ней территории. А также на всех их ней территорий разный компаний.\n[331445] 2025-05-30 10:59 Слава: Сотрудники делятся на агентов и простых сотрудников, который работают в компаниях. Например создание машин и типо того\n[331446] 2025-05-30 11:03 Слава: Сколько всего сотрудников я не знаю\n[331447] 2025-05-30 11:03 Слава: Могу вкинуть рандомной число\n[331448] 2025-05-30 11:04 Слава: 700 000 000\n[331449] 2025-05-30 11:05 Слава: Если всего людей в мире  8 225 048 831\n[331450] 2025-05-30 11:05 Слава: То это число принципе ок\n[331451] 2025-05-30 11:06 Слава:
