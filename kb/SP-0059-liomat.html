<script>const BASE="../";const DOCNAME="Лиомат";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Лиомат\n\n*способность* · вселенные: игра бога\n\n## Навигация\n\n- (w0032) Название энергии сверхспособностей и её механика: откуда берётся, где хранится, почему не у всех. Начало в 166915-166921 (название и этимология), механика 166922-166973, дальше уходит в следующее окно.\n- (w0033) Сквозная система энергии сверхспособностей: лиомат — трансформированная обычная энергия, вырабатываемая новой железой «абакра» и хранимая в её сфинктере. В окне Миколай выкладывает два последовательных варианта готового текста концепции (167302–167305 и 167321–167323).\n\n## Связано с\n\nАбакра, Герострат, Мифы как летописи людей с активной абакрой, Отряд сильнейших, Провидец\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-05-07\n\nвселенная: игра бога (по дате объявления) · окно w0032 · сообщения 166913–166921\n\n*что здесь: Энергия названа «Лиомат»; расшифровка — объединение конечных частей греческих слов, означающих солнце и кровь.*\n\n\n\n```chat\n[166913] 2024-05-07 21:25 Миколай: Хотя\n[166914] 2024-05-07 21:25 Миколай: Не мне понравилось\n[166915] 2024-05-07 21:25 Слава: А название энергий ?\n[166916] 2024-05-07 21:26 Слава: Похую на название сверхспособности\n[166917] 2024-05-07 21:26 Миколай: Оке, ща\n[166918] 2024-05-07 21:27 Миколай: Лиомат\n[166919] 2024-05-07 21:27 Миколай: Хех\n[166920] 2024-05-07 21:27 Миколай: У этого даже смысл есть\n[166921] 2024-05-07 21:28 Миколай: Объединение конечных частей слов означающих солнце и кровь на греческом\n```\n\n### Версия 2 — 2024-05-07\n\nвселенная: игра бога (по дате объявления) · окно w0032 · сообщения 166922–166936\n\n*что здесь: Постановка задачи от Славы: энергия есть у Геростратов, через неё они и используют способности; отдельно вводятся насильно пробуждённые обычные люди — сверхсилы у них нет, они лишь усилены этой энергией. Открытый вопрос: откуда энергия берётся (варианты — солнце, еда, желудок).*\n\n\n\n```chat\n[166922] 2024-05-07 21:29 Слава: Вообще смотри я хочу что бы это энергий была у Геростратов и типо они это энергий используют способности\nПри этом там будут насильно пробужденый обычный людий которых заставили пробудить данную энергию, при этом самой сверхсилый у них не будет, а только усиленный за счёт этой энергий\n[166923] 2024-05-07 21:30 Слава: И вопрос откуда берется энергия ?\n[166924] 2024-05-07 21:30 Миколай: Ну в обычном мире\n[166925] 2024-05-07 21:30 Миколай: Из солнца\n[166926] 2024-05-07 21:31 Миколай: Или из еды\n[166927] 2024-05-07 21:31 Миколай: Ну в щас без шуток\n[166928] 2024-05-07 21:31 Слава: Ненее\n[166929] 2024-05-07 21:31 Слава: Из желудка\n[166930] 2024-05-07 21:31 Миколай: У нас с тобой так\n[166931] 2024-05-07 21:31 Миколай: А вот у них\n[166932] 2024-05-07 21:31 Миколай: Хз\n[166933] 2024-05-07 21:31 Миколай: Так\n[166934] 2024-05-07 21:32 Миколай: Получается ты определился\n[166935] 2024-05-07 21:32 Миколай: Или наоборот\n[166936] 2024-05-07 21:32 Слава: Нет\n```\n\n### Версия 3 — 2024-05-07\n\nвселенная: игра бога (по дате объявления) · окно w0032 · сообщения 166937–166978\n\n*что здесь: Решение: не орган, а железа, которая была всегда (иначе не объяснить насильно пробуждённых); энергия — по сути гормоны, у большинства не вырабатываются, как при депрессии, отсюда нужны особые препараты. Кровь с микроэлементами от пищи поступает в железу, там обычная энергия преобразуется в энергию способностей и дополнительно генерируется; у железы есть сфинктер, работающий как батарейка-хранилище.*\n\n\n\n```chat\n[166937] 2024-05-07 21:32 Миколай: Ну крч может новую железу им вывести пихнём и какую-то удалим\n[166938] 2024-05-07 21:32 Слава: Вообще можно специальный орган но только как тогда насильной пробужденый вырабатывают эту энергию\n[166939] 2024-05-07 21:33 Миколай: Тогда можно сказать что он был всегда\n[166940] 2024-05-07 21:33 Миколай: Аа\n[166941] 2024-05-07 21:33 Миколай: Не всё, как я и сказал\n[166942] 2024-05-07 21:33 Миколай: Железу\n[166943] 2024-05-07 21:33 Миколай: Не орган\n[166944] 2024-05-07 21:33 Миколай: И эта энергия по сути гормоны\n[166945] 2024-05-07 21:34 Слава: Тогда почему некоторый сами пробуждаться а некоторый нет\n[166947] 2024-05-07 21:34 Миколай: И есть же депрессия, при которой у человека не вырабатываются некоторые гормоны и он навыки некоторые теряет\n[166948] 2024-05-07 21:34 Миколай: И тут тоже самое но сильнее\n[166950] 2024-05-07 21:35 Миколай: То бишь у большинства эти гормоны не вырабатываются\n[166951] 2024-05-07 21:35 Слава: И нужен особой препараты\n[166952] 2024-05-07 21:36 Слава: Только как гормоны вырабатывают энергию\n[166953] 2024-05-07 21:36 Миколай: Ну вот есть например адреналин\n[166954] 2024-05-07 21:36 Миколай: Если его прям много\n[166955] 2024-05-07 21:37 Миколай: Человек может делать невероятное\n[166956] 2024-05-07 21:37 Миколай: Тобиж они не вырабатывают энергию\n[166957] 2024-05-07 21:37 Миколай: Они её перерабатывают\n[166958] 2024-05-07 21:37 Миколай: Или нет\n[166959] 2024-05-07 21:37 Миколай: Направляют в нужное русло\n[166960] 2024-05-07 21:37 Слава: Они сами вырабатывают\n[166961] 2024-05-07 21:38 Миколай: А, всё\n[166962] 2024-05-07 21:38 Миколай: Крч\n[166963] 2024-05-07 21:38 Миколай: Вот пища\n[166964] 2024-05-07 21:38 Миколай: Разлагаясь\n[166965] 2024-05-07 21:38 Миколай: На микроэлементы\n[166966] 2024-05-07 21:38 Миколай: Даёт энергию через кровь\n[166967] 2024-05-07 21:38 Миколай: А тут\n[166968] 2024-05-07 21:38 Миколай: Кров будет поступать в эту железу\n[166969] 2024-05-07 21:39 Миколай: И энергия будет преобразовываться в другую которая отвечает за способности\n[166970] 2024-05-07 21:39 Миколай: А также генерироваться или увеличиваться\n[166971] 2024-05-07 21:40 Миколай: Ну и у этой железы будет сфинктер\n[166972] 2024-05-07 21:40 Миколай: Он будет как батарейка\n[166973] 2024-05-07 21:40 Миколай: Хранить энергию\n[166974] 2024-05-07 21:40 Слава: Ладно спокойной ночи\n[166975] 2024-05-07 21:41 Миколай: Добрых снов\n[166976] 2024-05-07 21:41 Миколай: Хорошей защиты проекта\n[166977] 2024-05-07 21:41 Миколай: Постарайся там\n[166978] 2024-05-07 21:41 Миколай: Надеюсь ты готов\n```\n\n### Версия 4 — 2024-05-09\n\nвселенная: игра бога (по дате объявления) · окно w0033 · сообщения 167300–167306\n\n*что здесь: Первый вариант целиком: два вида энергии у человека, лиомат, железа абакра и её сфинктер-хранилище, гелиогормоны, 300000 лет назад железа работала постоянно из-за условий среды, потом стала рудиментом; военные организации умеют стимулировать её работу, способность задана генетическим кодом клеток.*\n\n\n\n```chat\n[167300] 2024-05-09 12:41 Миколай: Привет\n[167301] 2024-05-09 12:41 Миколай: С праздником\n[167302] 2024-05-09 12:41 Миколай: Я короче концепцию энергии и способностей придумал систематизировал и написал\n[167303] 2024-05-09 12:41 Миколай: есть у человека два вида энергии обычная которая получается от калорий и энергия от которой зависит сверх способность, пусть называется &quot;лиомат&quot;. Так вот, лиомат это трансформированная обычная энергия, вырабатываемая в новой железе &quot;абакра&quot; и хранящаяся в сфинктере этой железы. Раньше, 300000 лет назад эта железа постоянно генерировала гелиогормоны, ибо были такие условия при которых человеку жизненно необходимо использовать сверхспособность. Но как только атмосфера земли стала комфортнее, а жизненные условия пригоднее для мирной жизни, гелиогормоны перестали вырабатываться и железа осталась рудиментом. Многие учёные гадали зачем она использовалась, но ответ так и не был зафиксирован в научном мире. Однако есть множество военных организаций с безумцами умеющими управлять гормональным фоном и стимулировать выработку гелиогормонов в этой железе и тогда люди могут контролировать способность установленную  генетическим кодом клеток.\n[167304] 2024-05-09 12:41 Миколай: Ну это пока первый вариант\n[167305] 2024-05-09 12:42 Миколай: Хотя надеюсь что последний)\n```\n\n### Версия 5 — 2024-05-09\n\nвселенная: игра бога (по дате объявления) · окно w0033 · сообщения 167321–167324\n\n*что здесь: Второй вариант, автор сам говорит, что заполнил пробелы: добавлены иденоновая кислота как основа синтеза гелиогормонов, ангиолии (сосуды с неактивной АТФ), соединение гормонов с АТФ даёт лиомат; запуск синтеза через симпатическую нервную систему и околоПТСР-состояние, при самом ПТСР невозможно; срок 150000 лет вместо 300000; сверхгенкод в клетках, исчезающий после 30 лет без использования, зависимость способности от того, что человек ел и о чём мечтал до 5 лет, метаморфоза клеток при использовании.*\n\n\n\n```chat\n[167321] 2024-05-09 14:19 Миколай: 2 вариант\n[167322] 2024-05-09 14:19 Миколай: есть у человека два вида энергии обычная которая получается от калорий и энергия от которой зависит сверх способность она называется &quot;лиомат&quot;. Так вот, лиомат это трансформированная обычная энергия, вырабатываемая в новой железе &quot;абакра&quot; и хранящаяся в сфинктере этой железы. Преобразование происходит посредством выработки гелиогормонов синтезируемых макросоединением иденоновой кислоты и циркулирующих в ангиолиях(сосудов с атф но, которая не активна без гормонов). Если конкретнее соединение гелиогормонов с АТФ и приводит к появлению лиомата.\nГелиогормоны начинают синтез при стимуляции симпатической нервной системы и сейчас достаточная стимуляция для ежедневного использования знакома только людям пережившим ситуации при которых можно заработать крайнюю форму птср, ну конечно без самого птср, при птср не возможно.\nУ человека с рождения есть клетки с генкодом отвечающим за сверх способности, но без лиомата они не работают, а после 30 лет полностью исчезают без использования. Этот генкод в режиме инкубации каждое поколение революционировал и способность определялась тем что человек ел, в том числе в контексте информации, а так же сами мечты человека до 5 лет влияют на предрасположенность к способности. При использовании способности клетки постепенно совершают метаморфозу и принимают нужную форму, а лиомат соответственно расходуется.\n Раньше, 150000 лет назад абакра постоянно генерировала гелиогормоны, ибо были такие условия при которых человеку жизненно необходимо использовать сверхспособность: вечный холод, макрофауна, озоновые дыры, общее состояние климата и состав воздуха отличались, постоянный стресс уже в первые годы рождения приводил к состоянию близкому птср. Но как только атмосфера земли стала комфортнее, а жизненные условия пригоднее для мирной жизни, гелиогормоны перестали вырабатываться и железа осталась рудиментом. Многие учёные гадали зачем она использовалась, но ответ так и не был зафиксирован в научном мире открыто. Однако есть множество военных организаций где логично птср не редкость проводящих эксперименты над людьми со сверхспособностями.\n[167323] 2024-05-09 14:20 Миколай: Некоторые недочёты и пробелы я заполнил\n```\n\n## Неясности\n\n- (w0032) Вселенная не названа. Разговор обрывается на ночь, сведённая версия появляется уже в w0033.\n- (w0033) Вселенная в самом окне не названа; в w0032 рядом с этой же разработкой звучало «Геростраты», но объявления смены/названия вселенной здесь нет.</div>"}];</script>
