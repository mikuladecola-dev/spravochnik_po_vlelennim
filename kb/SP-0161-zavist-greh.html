const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Зависть (грех)\n\n*способность* · вселенные: неясно\n\n## Навигация\n\n- (w0068) Версия Миколая — стирание родословной объекта у всех и навязывание желаемого статуса, объект забывает желания, развита магия льда; версия Славы — полное перевоплощение в того, кому завидуешь.\n\n## Связано с\n\nСемь грехов (магия по грехам)\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-12-24\n\nвселенная: неясно (по дате объявления) · окно w0068 · сообщения 273904–273908\n\n*что здесь: Вариант Миколая: способность заставить забыть человека и всех, кто его знает, его родословную, навязав желаемый статус; объект зависти забывает желания; развита магия льда*\n\n\n\n```chat\n[273904] 2024-12-24 13:29 Миколай: продолжаю грехи писатт\n[273905] 2024-12-24 13:31 Слава: 🌝\n[273906] 2024-12-24 13:57 Миколай: похоть:\nво первых: если одна способность, то это определённо афродизиак. можно по разному определить его: как стихию и как благословение. типа: либо ты создаёшь туман с веществом и оно на человека влияет. либо ты влияешь на человека\n\nво вторых: если набор то к афродизиака контроль серотонина(решает кто кого любит по научному), отключает стыд регулирующий соц поведение.\n\nв третьих: категорию хз как определить\n\n___\n\nчревоугодие:\nво первых: способность всё хавать или поглощать, в том числе магию которая меньше облака заклинания, даже чужая магия. это благословение, ибо влияние, а не создание\n\nкак набор: \nпоглощение чужих навыков, но не себе. он их поглощает и они исчезают\n\n__\n\nалчность:\nестественно: воровство, конкретно вещей, любых, можно с нескольких вещей одновременно и даже больших, они хранятся в пространстве\n\nтакже возможность совершить сделку с дьяволом\n\nпроклятье: ты не можешь ничего отдать кому либо\n\n__\n\n\nлень:\nбарьер неуязвимый пока тебе лень. хотя, пока ты спиш.\n\nтелепортация неподкондрольная, ну типа хочется куда то, туда и появляешься, но лень должно быть))))\n\nспособность растечься, но не двигаться\n\n__\n\nгнев\n\nпо характеру чувствительность к тому что считаешь несправедливым\n\nпри несправедливом ты в режиме берсерка, повышается мышечная масса, тобиж в размерах меняешься, сила возрастает, контроль уходит и ты разрушаешь то что не справедливо (справедливость всегда субъективна, но субъективная не всегда глупая)\n\nмагия взрыва развита\n\nвес ног увеличен\n\nпроклятье: теряешь способность видеть человеком того кто поступил не справедливо(ну личность не видишь, это просто груша с маркером ненависти ты видишь чувство)\n\n___\n\nзависть\n\nспособность заставить, забыть человека и всех кто его знает его родословную навязав желаемый статус\n\nобъект зависти забывает желания\n\nмагия льда развита\n\n___\n\nгордыня\n\nшизофрения как способность, чет ему в голову голос говорит какой он крутой\n\nмагия света и огня развита хорошо\n\nмагия привлечения внимания\n[273907] 2024-12-24 13:57 Миколай: ну ладно\n[273908] 2024-12-24 13:57 Миколай: как тебе\n```\n\n### Версия 2 — 2024-12-24\n\nвселенная: неясно (по дате объявления) · окно w0068 · сообщения 273917–273921\n\n*что здесь: Вариант Славы: полное перевоплощение в того, кому завидуешь — копирование сил, магии, одежды, внешности, но не характера*\n\n\n\n```chat\n[273917] 2024-12-24 14:23 Миколай: но в грехах это базовое подразумевается, такова природа греха\n[273920] 2024-12-24 14:26 Слава: Похоть:\nКонтроль разума с ограничением. То бишь она может повысить какое то чувство или вызвать галлюцинаций или наоборот понизить какой то чувство \nЧревоугодие ок \nАлчность:\nЯ думал больше о способности поглощений чужой манный или объектов \nЛень: я думал телекинез типа лень чё то делать вот и телекинез ( здесь ещё в придачу владений магий ветра, как никак они
