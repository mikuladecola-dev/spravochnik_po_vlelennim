const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Трубы сферы\n\n*монумент* · вселенные: 7 островов\n\n## Навигация\n\n- (w0043) Система каналов, связывающая внутренность сферы с океаном и с поверхностью. Центральный предмет спора всего окна: сколько видов труб и что через какую идёт.\n\n## Связано с\n\nНуар, Остров на дне океана (сфера), Тьма\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-07-04\n\nвселенная: 7 островов (по дате объявления) · окно w0043 · сообщения 196758–196777\n\n*что здесь: первое появление: не напрямую в воду, а подобия труб в самом барьере (или выход через дно), внутри которых давление поднимается плавно*\n\n\n\n```chat\n[196758] 2024-07-04 20:38 Слава: Тогда как сделать чтобы они плавно выходили через барьер\n[196760] 2024-07-04 20:39 Миколай: или наружу?\n[196761] 2024-07-04 20:39 Слава: Из барьера в воду\n[196762] 2024-07-04 20:39 Миколай: ну можно реализовать специальные каналы\n[196763] 2024-07-04 20:39 Слава: Чево\n[196766] 2024-07-04 20:39 Миколай: а я твои\n[196767] 2024-07-04 20:40 Миколай: шок\n[196768] 2024-07-04 20:40 Миколай: ну тобиж, не напрямую в воду, а как бы в барьере будут подобия труб\n[196769] 2024-07-04 20:40 Миколай: или выходить можно через дно\n[196770] 2024-07-04 20:41 Слава: Трубы где ты проходишь через неё давления плавно поднимается\n[196771] 2024-07-04 20:41 Миколай: наружу естественно по каналам\n[196772] 2024-07-04 20:41 Миколай: бля, а кстати\n[196773] 2024-07-04 20:41 Миколай: да, получается так\n[196774] 2024-07-04 20:42 Миколай: ну ебать они качки там будут все\n[196775] 2024-07-04 20:42 Миколай: каждый с тренировками как для космонавта\n[196776] 2024-07-04 20:42 Миколай: ну детей там к хуям разорвёт\n[196777] 2024-07-04 20:42 Миколай: так что родители будут за этим следить\n```\n\n### Версия 2 — 2024-07-04\n\nвселенная: 7 островов (по дате объявления) · окно w0043 · сообщения 196820–196842\n\n*что здесь: трубы, направленные внутрь, — выход в океан с нормальным переходом давления; идущие вверх «как дым» — сплошные большие каналы для фильтрации и переноса воздуха, а также транспортировки людей и ресурсов*\n\n\n\n```chat\n[196820] 2024-07-04 20:53 Слава: На дне океана будет сфера с множество трубами\n[196821] 2024-07-04 20:53 Слава: Черными трубами\n[196822] 2024-07-04 20:53 Миколай: ага\n[196823] 2024-07-04 20:53 Миколай: ну про те трубы для выхода в воду\n[196824] 2024-07-04 20:53 Миколай: они внутрь направлены\n[196825] 2024-07-04 20:54 Миколай: то есть вода внутри сферы удерживается\n[196826] 2024-07-04 20:54 Миколай: а наружу типо как дым\n[196827] 2024-07-04 20:54 Миколай: идут каналы\n[196828] 2024-07-04 20:55 Миколай: я так это вижу\n[196829] 2024-07-04 20:55 Слава: то есть вода внутри сферы удерживается\n[196830] 2024-07-04 20:55 Слава: а наружу типо как дым\n[196831] 2024-07-04 20:55 Слава: Я не понял\n[196832] 2024-07-04 20:55 Миколай: ща\n[196833] 2024-07-04 20:55 Миколай: нарисую\n[196834] 2024-07-04 20:57 Миколай: ебать я художник прям\n[196835] 2024-07-04 20:57 Миколай: те труды что внутри, они идут на выход в воду\n[196836] 2024-07-04 20:57 Миколай: с нормальным переходом давления\n[196837] 2024-07-04 20:58 Миколай: а дым идущий наверх, таких много\n[196838] 2024-07-04 20:58 Миколай: это сплошнве большие каналы\n[196839] 2024-07-04 20:58 Миколай: для фильтрации и переноса воздуха\n[196840] 2024-07-04 20:58 Слава: Чё это\n[196841] 2024-07-04 20:59 Миколай: ахахпх\n[196842] 2024-07-04 20:59 Миколай: и транспортировки людей, ресурсов\n```\n\n### Версия 3 — 2024-07-04\n\nвселенная: 7 островов (по дате объявления) · окно w0043 · сообщения 196858–196900\n\n*что здесь: уточнение: дым — это и есть тьма, только выглядит так; барьер — концентрированная тьма, которую нуар удерживает в форме, а в трубах концентрация меньше и форма не требуется, только курс, иначе он сдохнет*\n\n\n\n```chat\n[196858] 2024-07-04 21:02 Слава: И\n[196859] 2024-07-04 21:02 Миколай: че\n[196860] 2024-07-04 21:02 Слава: Это трубы для переноса углекислого газа и кислорода и также дыма от костров\n[196861] 2024-07-04 21:02 Миколай: и самих людей\n[196862] 2024-07-04 21:02 Слава: Нужны ещё отдельные трубы для людей и ресурсов\n[196863] 2024-07-04 21:03 Миколай: это буквально тьма\n[196864] 2024-07-04 21:03 Слава: Как они же в небо\n[196865] 2024-07-04 21:03 Миколай: как внутри барьера\n[196866] 2024-07-04 21:03 Слава: Не давая отдельный трубы\n[196867] 2024-07-04 21:03 Слава: Еще\n[196868] 2024-07-04 21:03 Миколай: не наружу океана\n[196869] 2024-07-04 21:03 Миколай: хуй те\n[196870] 2024-07-04 21:03 Слава: А чё\n[196871] 2024-07-04 21:04 Миколай: ну так блять,\n[196872] 2024-07-04 21:04 Миколай: это и есть трубы\n[196873] 2024-07-04 21:04 Слава: И что там через откуда проходит кислород для всех будут вылетать люди\n[196874] 2024-07-04 21:04 Миколай: тьма\n[196875] 2024-07-04 21:04 Миколай: без солнца\n[196876] 2024-07-04 21:04 Слава: Там есть солнца\n[196877] 2024-07-04 21:04 Миколай: ну так сама тьма поглощает газ\n[196878] 2024-07-04 21:04 Миколай: в трубах нету\n[196879] 2024-07-04 21:05 Слава: И куда тьма девать газ\n[196880] 2024-07-04 21:05 Слава: Легче чтобы они вылетали\n[196881] 2024-07-04 21:05 Миколай: в сферу\n[196882] 2024-07-04 21:05 Миколай: и из неё\n[196883] 2024-07-04 21:05 Слава: Кислород в сферу \nУглекислый газ и дым в небо\n[196884] 2024-07-04 21:06 Миколай: неч ну ебаный роть\n[196885] 2024-07-04 21:06 Миколай: не понимаешь ещё\n[196886] 2024-07-04 21:06 Миколай: дым тут это тоже самое что и тьма\n[196887] 2024-07-04 21:06 Миколай: просто выглядит так\n[196888] 2024-07-04 21:06 Миколай: это уже барьер\n[196889] 2024-07-04 21:07 Миколай: от воды\n[196890] 2024-07-04 21:07 Миколай: он сам фильтрует че каво\n[196891] 2024-07-04 21:07 Слава: Барьер это дым ?\n[196892] 2024-07-04 21:07 Миколай: просто нет такой концентрации\n[196893] 2024-07-04 21:07 Миколай: нет\n[196894] 2024-07-04 21:07 Миколай: да\n[196895] 2024-07-04 21:07 Миколай: но концентрированный крч\n[196896] 2024-07-04 21:07 Миколай: он его удерживает в форме\n[196897] 2024-07-04 21:08 Миколай: а там, он просто его выделяет, там форма не требуется\n[196898] 2024-07-04 21:08 Миколай: лишь курс\n[196899] 2024-07-04 21:08 Миколай: иначе он сдохнет\n[196900] 2024-07-04 21:08 Миколай: это очень сложно\n```\n\n### Версия 4 — 2024-07-04\n\nвселенная: 7 островов (по дате объявления) · окно w0043 · сообщения 196909–196921\n\n*что здесь: вариант Славы: четыре вида труб — для поглощения кислорода, для выброса углекислого газа, для людей, для выхода в океан*\n\n\n\n```chat\n[196909] 2024-07-04 21:10 Слава: То бишь давая занова\n[196910] 2024-07-04 21:10 Миколай: ?\n[196911] 2024-07-04 21:10 Миколай: так\n[196912] 2024-07-04 21:10 Слава: Сейчас\n[196913] 2024-07-04 21:10 Слава: Я скажу\n[196914] 2024-07-04 21:12 Слава: Есть сфера в на дне океана из него выходит четыре вида трубы \n1) для поглощения  кислорода \n2 для выкидывания углекислого газа \n3 для людей\n4 для выхода в океан\n[196915] 2024-07-04 21:12 Миколай: ты так решил\n[196916] 2024-07-04 21:12 Миколай: ?\n[196917] 2024-07-04 21:13 Слава: Ну для начала объясни свою теорию\n[196918] 2024-07-04 21:13 Слава: Так легко как я\n[196919] 2024-07-04 21:13 Слава: Без сложности\n[196920] 2024-07-04 21:13 Слава: Основу\n```\n\n### Версия 5 — 2024-07-04\n\nвселенная: 7 островов (по дате объявления) · окно w0043 · сообщения 196922–196922\n\n*что здесь: вариант Миколая: два вида труб — внутрь для выхода в океан из сферы и наружу из чистой хаотичной тьмы (она сосёт и фильтрует воздух и позволяет ресурсам и людям перемещаться между сферой и внешним миром)*\n\n\n\n```chat\n[196922] 2024-07-04 21:16 Миколай: так есть 2 вида труб:\n\n1) внутрь для выхода в сам океан из сферы\n\n2) из чистой, хаотичной тьмы, она:\nа) сосёт воздух и фил
