<script>const BASE="../";const DOCNAME="Прежняя жизнь гг «Фанатика»";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Прежняя жизнь гг «Фанатика»\n\n*персонаж* · вселенные: Феня\n\n## Навигация\n\n- (w0113) Происхождение героя до попадания: работал на нескольких работах и ухаживал за родителями, превратившимися в разлагающиеся вопящие тела; желал им смерти, отдушиной были сказки, особенно книга о герое справедливости.\n\n## Связано с\n\nДионис Бэлут, Фанатик\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-12-14\n\nвселенная: Феня (по дате объявления) · окно w0113 · сообщения 397758–397758\n\n*что здесь: первое и единственное изложение в прозе*\n\n\n\n```chat\n[397758] 2025-12-14 22:10 Слава: Фанатик (обычный мир) \n\nНаверное многие мечтали попасть другое мир\nЧаще всего об этом мечтают неудачники. \nПочему-то в их голове возникла мысль. \nЧто в другом мире они будут лучше, станут смелее и воля их пробьет небеса. Ну что за бред. Они как и останутся неудачником в настоящим, так и в другом мире име будут. Смелость и воля не появится просто по волшебству. Тем более воля у людей, который всю жизнь просиживали дома. Прячешь от людей. \nЯ же никогда не мечтал о побеге. Тем более в другой мир.  Был готов жить нынешнее жизнью. Один на один с этой.... семье. \nХа-ха-ха семья даже звучит смешно, вот эти куски плоти, когда-то были моей семье. Уважаемые отец и миловидная мать. Сейчас не более чем.... - \n\nТак и жил с этими. Бросить их я не мог, как никак раньше они меня любили, да и воспитали. И бросить их будет неправильно. \nВот и пошли циклы моей жизни. Работа, дом и уход за этими. Тем больше проходила времени, чем больше я желал им смерти. \n\nНе выдерживая. Каждый день работая, для содержания моей семьи уходила много денег. Приходилось работать на нескольких работах. Наплевав на своё светлое будущее, что вещали мне  учителя. С этим я ещё мог справиться, но недосып, от того, что эти всю ночь вопили. Они всегда вопят. Вот только ночью они словно сходят с ума. Кричат, вопят и стукаются своими тушами. \nМыть эти разлагающие изнутри тела, которая дергаются каждый раз, когда я &#x27;случайно&#x27; сильно на давлю. Кормите и каждый раз натягивать улыбку, когда они выплёвывают еду. \n\nИ в этой мерзкой реальности моей отдушиной стали книги. Сказки. Легкий, с простой моралью. Они нравились мне - человеку, что жил в гнилое реальности. Вроде кто-то говорил, чем глубже ты во тьме, чем ярчее даже самый тусклый свет. Этим светом стали книги. \nОдна книга о герой справедливости, что побеждает все зло. Легко, просто и предсказуема, но да безумия запало в душу. Мой милый лучик света. Мой герой. \n\nИ сейчас я стою у зеркала и рассматриваю  незнакомое лицо. Лицо была мужчины за 20 лет. Чёрные волосы, что были бы абсолютно чёрными если не седина. Острые черты лицо, с измученными красными глазами. И неподелная улыбка. \n- Хаааха- ну что за бред былой кабылы. Но как же это волнительно. Мои руки слегка заметная дрожаля. Пока я окуратно поглаживали &#x27;свое&#x27; лицо. &quot;Я попал в другое мир&quot; Четкая мысль, которое даже не нужно было формировать. Вот только какое? Лицо, что я сейчас вижу. Вроде как не описывалась в романах, которых я читал. &quot;Чёрные волосы с сединой&quot; Такой бы запомнилась. Но это сейчас слабо волновала. Волнительные чувство, как перед открытием подарка на новый год. Прошибла все мои мозги и думать о таких мелочах было сложно.\n\n-Эй! - поправляла одежду крикнул я в сторону. \n-да господин- приглушенная ответила фигура горничные, что скрывалась во тьме комнаты. Особо выдающим лицо её не было. Просто тьма во тьме. Чёрные глаза, с чёрными волосами скрытый в углу комнаты, как же приторно. \n- Скажи-ка моя дорогая служанка, как же звать меня? Сколько мне лет? И какое сейчас число? - спросил я. Глубоко в душе переживая, что она явно, что-то заподозрет. Но я был настолько в хорошем настроении, что и не думал об этом. \nСлужанка же слегка кивнула головой. \n- вы Дионис Бэлут старший сын графа Бэлута. В этом году вам исполнилась 23 года.  Сегодняшняя дата 28 июня 1417 год- без колебаний ответила служанка. Словно только ждала когда я задам этот вопрос. \n&quot;Хм &#x27;Дионис&#x27; впервые слышу это имя. Да и семья Бэлут, что-то не припоминаю. 23 года примерно столько я ожидал. Хотя седина на волосах немного беспокоит ну ладно... Дата мне ничего не даёт. Вообще в романах очень редко пишут даты. Потому что авторы сами бояться в них запутаться &quot; Буря мысли, что ни к чему не привели. \nОстаётся лишь одно. Самому расследовать, что же это за мир. \n-пошли-  сказал я подзывая её рукой. \nМы удачно вышли из темное комнаты в светлые коридоры с большими окнами.\n```\n\n## Часть чего\n\nДионис Бэлут\n\n## Неясности\n\n- (w0113) что именно случилось с родителями и почему они в таком состоянии — в тексте не объяснено</div>"}];</script>
