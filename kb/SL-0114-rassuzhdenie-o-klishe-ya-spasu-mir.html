const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Рассуждение о клише «Я спасу мир»\n\n*служебное* · вселенные: вне вселенной\n\n## Навигация\n\n- (w0108) Рабочий спор соавторов о затасканной фразе героев: что именно спасают и почему формулировка неверна.\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-11-04\n\nвселенная: вне вселенной (по дате объявления) · окно w0108 · сообщения 381969–381969\n\n*что здесь: Слава: фраза тупая, ГГ хочет спасти человечество или конкретное существо, а не мир; мир не живой, не исчезнет, ему безразлично, кто на нём живёт, изменится лишь содержимое; ГГ высокомерны, раз считают спасение человечества спасением мира*\n\n\n\n```chat\n[381969] 2025-11-04 15:34 Слава: Тебя не бесила это фраза гг &quot; Я спасу мир&quot; Ну или типо того. Смысал один и тот же. \nЭто же тупо. Ведь гг не когда не хотел спасать мир, он хотел спасти человечества или другой живой существо но не мир. \nМир вообще не нужно спасать. Он не живой. И он не изчезнит, ему вообще будет похуй кто на нём живёт демоны или люди или монстры. Или земля вообще за рвётся без разницы, мир всё равно будет жить. Измениться лишь его содержимое. \nГг в этих истории на столь высокомерный что считают что спасения человечества равно спасения мира\n```\n\n### Версия 2 — 2025-11-09\n\nвселенная: вне вселенной (по дате объявления) · окно w0108 · сообщения 383314–383325\n\n*что здесь: Ответ Миколая: согласен, но «мир» может значить разное; под «спасу» завуалировано «сохраню для нас»; по словарю спасти значит избавить от чего-то; определяет оборот как метонимию и синекдоху (парус вместо корабля, очаг вместо дома) — человечество подменяется миром; фраза не бесит, но сухая и скучная, использовал бы её только из лени*\n\n\n\n```
