зал он. А я не понял. Лишь махнул головой и всё. Он подал мне руку. Я встал и потопол за ним. Не знаю зачем. Просто это было интересно. . \nМы сели в дорогую машину. Хотя я в них и не разбираюсь. \n-смотри у тебя есть два пути. Первый я подхожу тебя к остановки и ты едешь домой. Забыв обо всём этом и живя обычной жизнью. Второй- ты становишься агентом и сразаешься с подобными тварями, как сегодняшний. Выбор за тобой. Я не буду говорить плюс и минус- закончил он свой явно выученный монолог. А я в голове у себя уже давно всё решил. Вся моя жизнь стремилась к этому моменту. К моменту веселья и риска. Я силён, а значит можно попробовать \n-я стану агентом- твердо произнес я. Не скрывая улыбки. \nОн улыбнулся. А после высадил меня на остановке и сказал, что перезвонит. Хотя я не говорил свой номер телефона. На мои вопросы, он отнекивался. И ссылался тем, что он спешит. Ведь ему надо встретиться с новым апостооом по прозвищу &quot;защитник&quot;. И уехал. Ну че я. Пошёл домой и спать лег. А с утра мне и правда перезвонили. Только не он. А какой-то Михаил Саакашвили. Пфу. Еле выговорил фамилию. Там по телефону. Он сказал, что они заедут за мной через три дня, где я должен дать свой точный ответ. Если я также буду согласен. То меня заберут в лагере, где я должен буду прожить 6 месяцов под тренировкам и впитыванием информации. \nПо итогу через 3 дня меня забрали. Но отучился я только 3 недель. Так как я был в идеальном физической форме и мне оставалось только дать информацию и ресурсы и всё. Кстати моим куратором был Михаил с кодовым прозвищем &quot;Медведь&quot;. Он и правда был похож на медведя. По два метра ростом, в плечах почти также. Везде мыщцы и суровым лицом богатыря. Ходил он в кожанном плаще и был суров, но справедливым . Поэтому даже если я его бесил. Он всё равно отметил мои навыки. И кстати я был там не один нас было 10. Как я понял потом. Каждый агент может быть куратором только для 10 людей. \nПока я там учился. Я многое узнал. Ждёшь объяснение? Ладно давай о
