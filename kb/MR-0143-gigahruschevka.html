const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Гигахрущевка\n\n*мир* · вселенные: Гигахрущевка\n\n## Навигация\n\n- (w0102) Слава пересказывает вселенную из скачанных книг: бесконечные этажи с комнатами, ни неба, ни земли, ни травы, никто не дошёл ни до низа, ни до верха, неизвестно откуда вода и электричество и куда уходят отходы. Миколай отвечает, что вдохновляет.\n\n## Связано с\n\nСамосбор\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-08-07\n\nвселенная: Гигахрущевка (объявлено) · окно w0102 · сообщения 353580–353620\n\n*что здесь: пересказ устройства мира, реакция Миколая*\n\n\n\n```chat\n[353580] 2025-08-07 11:55 Слава: Нужно скачать ещё книги\n[353582] 2025-08-07 11:56 Миколай: давай\n[353583] 2025-08-07 11:56 Миколай: а какие кстати прочел?\n[353586] 2025-08-07 11:56 Слава: Вселенная гигохрущевка\n[353587] 2025-08-07 11:56 Слава: Ну или самосбор\n[353590] 2025-08-07 11:56 Слава: Не знаю как она называется\n[353593] 2025-08-07 11:57 Слава: Про эту вселенную 4 книги прочёл\n[353598] 2025-08-07 11:59 Слава: Гигахрущевка это бесконечный( по ка не менее в рассказах не кто так и не дошёл до самого низа или самого верха) этажи. В которых находится комнаты. Там нет неба или земли и травы. Не кому из гигахрущевки неизвестно откуда берётся вода и электричество, а также куда попадают отходы\n[353599] 2025-08-07 11:59 Миколай: оо\n[353600] 2025-08-07 11:59 Миколай: интересно\n[353604] 2025-08-07 12:00 Слава: Ещё раз\n[353605] 2025-08-07 12:00 Слава: Прочти\n[353607] 2025-08-07 12:01 Миколай: вдохновляет\n[353608] 2025-08-07 12:03 Слава: Самосбор- это неизвестная явления, которая пагубная влияет на организм человека. Он может превратить его в лужу ( чаще всего это случаются) либо в какую-то нечист
