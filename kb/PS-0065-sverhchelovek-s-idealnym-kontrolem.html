<script>const BASE="../";const DOCNAME="Сверхчеловек с идеальным контролем";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Сверхчеловек с идеальным контролем\n\n*персонаж* · вселенные: игра бога\n\n## Навигация\n\n- (w0032) Возникает как единственное условие смерти Бессмертного (166507), затем Слава просит придумать его отдельно и заодно переименовать. 166890-166909.\n\n## Связано с\n\nБессмертный, Герострат, Отряд сильнейших\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-05-07\n\nвселенная: игра бога (по дате объявления) · окно w0032 · сообщения 166505–166510\n\n*что здесь: Введён как ограничение Бессмертного: убить его может только сверхчеловек с идеальным контролем.*\n\n\n\n```chat\n[166505] 2024-05-07 07:33 Миколай: Или меняющий размер по желанию\n[166507] 2024-05-07 07:54 Слава: Для понятности Провидец имеет способность отматывать время но при этом отматывая время превращается в петлю времени где он обязан 10 000 прожить один и тот же промежуток времени ( безумец,  ни разу не проигравший в рукопашном бою или в стрельбе)\nБессмертный бессмертный которого может убить лишь сверхчеловек с идеальном контролям, он способен не просто регенерировать повреждённый части, а изменять структуру своего тела или стрелять костями или с помощью плоти создавать разных существ ( на любой дистанции хорош на дальнее и средней он может стрелять костями, создавать костенной сад, или чудовище, а на ближней дистанции неплохо сражаться и использует свой бессмертие на все сто)\n```\n\n### Версия 2 — 2024-05-07\n\nвселенная: игра бога (по дате объявления) · окно w0032 · сообщения 166890–166910\n\n*что здесь: Слава просит идеи сверхчеловека и другое название для него и для сверхспособностей; Миколай предлагает искать через греческий и латынь, критерий — чтобы звучало прикольно; итогом становится «Герострат».*\n\n\n\n```chat\n[166890] 2024-05-07 21:13 Слава: Не я про то что не могу приставать командную работу против одного бойца\n[166891] 2024-05-07 21:13 Миколай: Вообще, Шекспир великий драматург не чурался подглядывать чужие работы, современные авторы пиздят идеи у Шекспира. А изначально все пиздили из летописей и реального мира. В общем ты и не представишь ничего, то что ты хочешь надо подглядеть в имеющихся реализованных ситуациях\n[166893] 2024-05-07 21:14 Миколай: Хорошо, давайте рассмотрим, как команда &quot;А&quot; может справиться с одним сверхмощным противником.\n\nПредположим, что их оппонентом будет Сверхчеловек с идеальным контролем, который теоретически может убить бессмертного бойца команды &quot;А&quot;.\n\nНачало боя:\nСверхчеловек выходит на поле боя, демонстрируя свою невероятную физическую силу, скорость и выносливость. Он готов к схватке с бессмертным бойцом команды &quot;А&quot;.\n\nХод боя:\n1. Бессмертный боец начинает атаковать Сверхчеловека, используя свои дальнобойные способности - стрельбу костями и призыв существ. Однако Сверхчеловек с легкостью уклоняется от этих атак и приближается к бессмертному.\n\n2. Видя, что дальнобойные атаки не приносят результата, бессмертный боец переходит к ближнему бою, пытаясь использовать свою регенерацию и трансформацию тела, чтобы одолеть Сверхчеловека. Но тот демонстрирует невероятную силу и скорость, нанося сокрушительные удары.\n\n3. Провидец команды &quot;А&quot; активирует свою способность отматывания времени, чтобы предугадывать ходы Сверхчеловека и помогать бессмертному бойцу. Однако даже это не дает им решающего преимущества.\n\n4. Понимая, что в прямом противостоянии они не могут одолеть Сверхчеловека, бессмертный боец и провидец начинают действовать сообща, используя свои способности в комплексе. Они пытаются запутать, дезориентировать и измотать противника, используя все доступные им тактики.\n\nИсход боя:\nНесмотря на все усилия команды &quot;А&quot;, Сверхчеловек в конечном итоге одерживает победу. Его идеальный контроль и подавляющая физическая мощь оказываются слишком велики для бессмертного бойца и провидца. Даже их уникальные способности не могут переломить ход битвы.\n\nДанный сценарий показывает, что даже такая мощная команда, как &quot;А&quot;, может быть побеждена, если им противостоит исключительный противник, обладающий сверхчеловеческими возможностями и идеальным контролем. Их доминирование не является абсолютным, и они могут встретить достойного соперника.\n[166895] 2024-05-07 21:16 Миколай: В общем. Тогда надо попробовать через время ещё раз представить. Возможно ты решишь полностью отряд переформировать если считаешь что они сейчас не совместимы\n[166896] 2024-05-07 21:19 Слава: Ну все равно скидывай идей сверхчеловека\n[166897] 2024-05-07 21:20 Миколай: Хорошо\n[166898] 2024-05-07 21:20 Слава: Кстати а какой можно дать другой название сверхчеловека\n[166899] 2024-05-07 21:20 Слава: Ну или сверх способностям\n[166900] 2024-05-07 21:20 Слава: Типо я много думал ну не придумал\n[166901] 2024-05-07 21:20 Миколай: Хмм\n[166902] 2024-05-07 21:21 Миколай: Ну я бы щас побежал к греческому переводу\n[166903] 2024-05-07 21:21 Миколай: Или латинскому\n[166904] 2024-05-07 21:21 Миколай: Но лучше так подумаю пока\n[166905] 2024-05-07 21:22 Миколай: Тебе обязательно нужна логика\n[166906] 2024-05-07 21:22 Миколай: Или главное чтоб звучало прикольно?\n[166907] 2024-05-07 21:23 Слава: Звучала прикольная\n[166908] 2024-05-07 21:23 Миколай: Тогда чел со сверх способностями это Герострат\n[166909] 2024-05-07 21:24 Миколай: Похуй на изначальную коннотацию имени, это будет нарицательное для человека со способностями\n[166910] 2024-05-07 21:24 Миколай: А вот для способностей за чет интересное ищу\n```\n\n## Неясности\n\n- (w0032) Сам персонаж так и не придуман в окне.</div>"}];</script>
