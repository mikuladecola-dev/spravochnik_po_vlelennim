3 Слава: Что там по стрессу\n[21668] 2022-11-17 18:34 Миколай: Мм, да, с слишком много думаю про одноклассников и людей, поэтому хочу отказаться от общения с людьми вообще, с психологом решил поговорить и теперь вообще ничего не понимаю\n[21669] 2022-11-17 18:34 Миколай: Ну, я только сегодня понял что она меня чем-то интересует\n[21670] 2022-11-17 18:34 Слава: И что психолог сказал\n[21671] 2022-11-17 18:35 Слава: ?\n[21672] 2022-11-17 18:35 Миколай: Кста, у нас новый психолог, она слушала меня много, а я выговаривался. Ну как я понял она говорила о том что с людьми нужно общаться\n[21673] 2022-11-17 18:36 Слава: И что будешь делать\n[21674] 2022-11-17 18:36 Слава: ?\n[21675] 2022-11-17 18:36 Миколай: Я так сказать абстрагируюсь от мыслей, потому что страшно и непонятно\n[21676] 2022-11-17 18:37 Миколай: Крч в аниме ушёл\n[21677] 2022-11-17 18:37 Миколай: Хочу много, но скорее всего опять ничего не сделаю, так сказать делаю все в параллельном мире, а на этот времени нет\n[21678] 2022-11-17 18:38 Слава: Ну я также\n[21679] 2022-11-17 18:38 Миколай: И поэтому страшно\n[21680] 2022-11-17 18:38 Миколай: Параллельный мир интереснее и понятнее и добрее\n[21681] 2022-11-17 18:39 Миколай: А от этого мира который реальный зависит будущее\n[21682] 2022-11-17 18:40 Слава: Экология разрушается и мы все умрем\n[21683] 2022-11-17 18:40 Миколай: Хах, звучит весело\n[21684] 2022-11-17 18:40 Миколай: Но мы не успеем\n[21685] 2022-11-17 18:40 Миколай: Ну типа да\n```\n\n## Неясности\n\n- (w0008) не объявлено, относится ли это к какой-либо вселенной — сказано как про личную привычку фантазировать</div>"}];</script>
