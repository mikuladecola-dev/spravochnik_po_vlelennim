n[48453] 2023-08-19 20:40 Слава: 👋\n```\n\n### Версия 2 — 2023-09-22 · повтор прежней мысли\n\nвселенная: неясно (не определено) · окно w0018 · сообщения 51176–51186\n\n*что здесь: служебно: возврат к теме — Слава напоминает про обещание скинуть «Сюжет», Миколай отвечает, что в планах и скоро, причина задержки — учёба и режим*\n\n\n\n```chat\n[51176] 2023-09-22 19:09 Миколай: Я тебя не забуду\n[51178] 2023-09-22 19:10 Слава: Кстати а что с Сюжетом\n[51179] 2023-09-22 19:10 Миколай: В планах\n[51180] 2023-09-22 19:10 Слава: Ты сказал что скинешь\n[51181] 2023-09-22 19:10 Миколай: Уже скоро наверное\n[51182] 2023-09-22 19:10 Миколай: Надеюсь\n[51183] 2023-09-22 19:11 Миколай: Я просто ещё домашку не научился делать после школы\n[51184] 2023-09-22 19:11 Миколай: Утром из под пизды достаю\n[51185] 2023-09-22 19:11 Миколай: Будильник на 3-4 часа блять\n[51186] 2023-09-22 19:11 Слава: Ты чё мало спишь?\n```\n\n## Неясности\n\n- (w0018) вселенная не названа; содержание самой истории в окне не раскрывается — только факт её существования и работы над ней</div>"}];</script>
