<script>const BASE="../";const DOCNAME="Подарок внутри монстра";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Подарок внутри монстра\n\n*история* · вселенные: Апостол\n\n## Навигация\n\n- (w0075) Перед смертью рассказчик говорит, что приготовил защитнику настоящий подарок, который находится внутри него и достанется защитнику, когда тот его разорвёт. Названо и не раскрыто.\n\n## Связано с\n\nАртефакты, Защитник, Рассказчик-монстр\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-02-12\n\nвселенная: Апостол (по дате объявления) · окно w0075 · сообщения 288545–288546\n\n*что здесь: Заявка на подарок внутри тела монстра в последних строках текста*\n\n\n\n```chat\n[288545] 2025-02-12 17:28 Слава: Ну может быть собаку кошку жуёт или наоборот, какая к чёрту разница. Но его мнения изменилась, когда он увидел тощий силуэт покрытой шерстью. Он мгновенно протрезвел, его мысль стали четками и ясными, как никогда. Он начал красться к силуэту. Но силуэт услышал его. Обернувшись он мгновенно кинулся на мужчину. А наш мужчина, перехватив поудобнее бутылку вмазал ею по морде недо обратная. И пока зверь хватался за нос. Защитник снова почувствовав гнев, начал тыкать розочкой этого обратная во всё места. И когда оборотень не подавал признаков жизни, вдруг решил потащить этот труп в свой дом. Словно пытаясь так принести какой-то ритуал. Ну и до таща это то  тело кое как. Он лёг на кровать и сразу вырубился. Спал он крепко, как не всё той время. Проснувшись и поняв, что находится здесь, он в порыве гнева решает жечь этот дом, но увидев труп обратная, настоящего обратная. Он всё понял. Всё сразу стала на свои места. И он понял, что надо сделать. Сначала он записался во всё возможное спорт клубы, потом вылил весь алкоголь или какие ещё спиртные напитки в раковину, а в унитазе смыл все колёса. Он снова начал работать. Вообще ему было тяжело посещать несколько спорт клубов ещё он сам давно не мальчик, поэтому тренировки давались вдвойне тяжелее. Но он не остановился он не щадил свой организм, свой тело, возможно внутренний виня и свой тело тоже. И жил от так лишь тренировками и работой на протяжении 2-х лет. За этой время он убрался в своём доме и закопал труп в подвале дома, поставил фотки своих дорогих девушек, заработал кругленькую сумму. Купил огнестрельное и холодное оружие. Смог привести себя в хорошую физическую форму. И начал полномасштабную охоту на нас. Сначала он просто гулял ночью в попытках встретить нас, дурак, в этих прогулках он чаще избивал недо бандитов и мелких хулиганов и насильников если честно ему от частей была по-барабану на всех их. Но у него было раздражение, что он не мог найти нас, поэтому он и избивал их. Потом он решил отслеживать звонок полицейских и первые приезжать туда, где что-то явно странная. Ой сколько денег он на это потратил. Но был успех он ловил звонок и слушал их и через недельку другую, он услышал такое долгожданная слова монстр. И сразу же выбежал из дома и поехал на машине нарушая всё возможные дорожный правила. Он приехал и застал. Шесте рукой чудовище, который душила мужчину. Выхватив из пол кофты нож армейский, острый он проверял. Порезал он лапу этого существа, заставляя решится равновесия. А после начал он потрошить его конечность, это паучок ничего не мог сделать, против быстрого ломающего его защитника. И нет он не убил его лишь оторвал всё конечности, погрузил в машину и уже в доме пытался узнать у него информацию, тот паучок знать-то ничего не знал, но защитник ломал его психологический и физический. После всего этого он начал как то инстинктивно понимать, где находиться чужимирцы словно благословенный. Но он им не был. И так однажды он наткнулся на нашу группу и порешал есть сам конечно получив тяжёлый ранения. И вот вопрос почему я его не убью раз он сейчас без сознания. Ответ просто он переломал мне всё конечности и не только. Но если бы я даже мог бы, я бы ни за что этого не сделал ведь он должен жить узнать о чужемирцов, о благословенных, о артефактах он должен страдать и быть снова счастливым. Я ему уже благодарен тем, что мне даль вкуснейший пир перед смертью, не каждый из моего мира хотя бы раз в жизни так вкусно и сытно питался. Но всё же у меня есть сожаления, то что я не смогу увидеть дальше жизнь защитника  не его страдания, не боли, не счастья и не смогу увидеть всё растущую вину. Нет не ту вину, что не смог уберечь свою семью, вот она по размеру с гневом рядом с ним. А чувством вины за убийство не виновных чужемирцов. Хотя сейчас она маленькая, но она растет. Ах как жаль. Но защитник уже отчухивается, и я уже подготовил для него подарок, нет не пакость, а настоящее подарок, он находится внутри меня и когда защитник будет рвать меня он получит этот подарок. Эх ладно пок.... В лесу пронеся хруст ломающий черепушки\n[288546] 2025-02-12 18:17 Слава: Каюсь в конце я сдулся\n```\n\n## Часть чего\n\nРассказчик-монстр\n\n## Неясности\n\n- (w0075) Что именно за подарок — не сказано; продолжения в окне нет</div>"}];</script>
