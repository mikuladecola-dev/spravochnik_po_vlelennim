<script>const BASE="../";const DOCNAME="Восстановление после смертельных повреждений";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Восстановление после смертельных повреждений\n\n*способность* · вселенные: монстры\n\n## Навигация\n\n- (w0062) Способность девушки из рассказа: тело не умирает и всегда восстанавливается, время восстановления меняется от случая к случаю.\n\n## Связано с\n\nДевушка, отринувшая смерть, Смерть — это право, смерть — это навык\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-10-20\n\nвселенная: монстры (по дате объявления) · окно w0062 · сообщения 247842–247843\n\n*что здесь: служебно: тело без сердцебиения и холодное, но живое; после расстрела шестнадцатью солдатами из узи восстановилась за час, тогда как раньше восстанавливалась за 7 минут; в антарктических льдах организм сам начал прогревать себя после 13-й минуты, утонуть и остановить мозг не вышло*\n\n\n\n```chat\n[247842] 2024-10-20 09:28 Миколай: люди смертны и это так потрясающе! ещё с древности идут разговоры об экзистенциальных вопросах, по типу мементо мори, тобиж напутствие &quot;помни о смерти&quot;, которое прямо указывает, знать что ты смертный. тривиальное &quot;быть или не быть&quot; это не самый свободный выбор, ведь ты не сможешь быть вечно. религии гласят о перерождении, о рае и аде. существо в низу распоряжаться твоей душой и твоим фатумом. даже если ты не верующий. некоторые действительно попадают куда-то, некоторые исчезают на всегда, но только после смерти. смерть это не просто награда, это право, которое отнять не возможно. и важно его защищать. но кто будет этим заниматься и точно ли это целесообразное утверждение? неужели кто-то может его отнять? ну, это хороший вопрос, чтобы его раскрыть я расскажу вам историю.\n\nоколо четырёхсот дней назад, я встретил девочку. у неё были яркие, но глубокие голубые глаза, пылающие красные волосы, нет, буквально пламенные, крайне плотная джинсовая куртка, черная юбка и стандартные массовые розовые колготки, обуви не было. она рисовала на песке и я решил присоединиться. вместе бы нарисовали триптих Босха и как кронос пожирает своих детей. причём как я люблю отмечать такие моменты, инициатива в выборе работ для перерисовки была не за мной, а сей юной леди, что меня не удивило. и я вовсе не чёрствый, это действительно впечатляет, однако сие событие было крайне обычным в сравнении с тем, что она была единственным живим существом в той степи. ну по крайней мере я так думал ибо женщина чью кожу с левой лопатки жевала девочка, возможно являвшаяся матерью не подавала признаки жизни. хотя прозвучало оскорбительно, женщиной её точно звать не стоит это вполне молодая девушка, двадцати лет. \n\nпростите я остановлюсь. мне было жутко, страшно. но я знаю, что о детях важно заботиться и я не подавал виду, как минимум её воспитание не моя ответственность, хотя полицию и скорую я вызывал, но меня забрали с девочкой, а женщину они трогать не стали и не возвращались потом к ней, что довольно странно. и сколько я бы о ней не спрашивал они игнорировали темы связанные с ней. девочку увезли в скорую из-за пищевого отравления, а меня домой.\n\nда, со мной вообще не говорили всю дорогу, лишь в конце попросили не поднимать эту тему в разговорах. и всё. ну конечно мне интересно и я решил разобраться, ушёл в ту степь, среди которой много руин, трупов, черепов, гнилых растений. я искал остатки той женщины которую жевала девочка. \n\nя ошибся. хотя нет. она ошибка. ладно, ты не понял о чем я, ща поясню. девочка тогда была не одна по среди этого адского места, живой. эта девушка тоже жива. но, у неё не билось сердце, я тогда проверял. она была бездыханна и холодна. а сейчас сидит и избивает могилу какого-то парня. \n\nкакая мерзость, девушка не имеет права на смерть. конечно. можете сказать что я спешу в этом заключении, но нет. даже
