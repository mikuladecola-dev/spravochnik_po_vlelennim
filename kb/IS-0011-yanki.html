<script>const BASE="../";const DOCNAME="Янки";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Янки\n\n*история* · вселенные: вне вселенной\n\n## Навигация\n\n- (w0027) Сериал Миколая на 12 серий плюс фильм и спешл: банда Янков, изгой-рассказчик с стокгольмским синдромом, предводитель банды, война с байкерами и полицией, предатель Джек, убитая Мэри, захват Букингемского дворца и свержение монархии, любовная линия изгоя и предводителя. Авторский слой — заголовки-задания к каждому эпизоду (143890, 143892, 143894, 143896, 143898, 143900, 143902, 143904, 143906, 143908, 143910, 143912, 143914, 143916), сам текст серий сгенерирован нейросетью и вынесен в ai_inserts.\n\n## Связано с\n\nДжек, Мэри, изгой, предводитель Янков\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-03-21\n\nвселенная: вне вселенной (разбор «неясно») · окно w0027 · сообщения 143877–143917\n\n*что здесь: Первое и единственное изложение: заявлено как сериал на 12 серий + фильм + спешл, сборник рассказов, связанных одной сюжетной линией и персонажами; расписан весь ход сюжета от булинга изгоя до захвата власти и урока истории через 387 лет.*\n\n\n\n```chat\n[143877] 2024-03-21 17:42 Миколай: Вот с помощью этой\n[143878] 2024-03-21 17:42 Миколай: Я целый сериал написал\n[143879] 2024-03-21 17:42 Миколай: На 12 серий\n[143880] 2024-03-21 17:42 Миколай: + фильм и спешл\n[143881] 2024-03-21 17:42 Слава: Прям рекламный ролик\n[143882] 2024-03-21 17:42 Миколай: Ну такой, в моём понимании сериал\n[143883] 2024-03-21 17:43 Миколай: А так сборник рассказов связанных одной сюжетной линией\n[143884] 2024-03-21 17:43 Миколай: И персонажами\n[143885] 2024-03-21 17:43 Миколай: Крч, можешь почитать\n[143886] 2024-03-21 17:43 Миколай: Так интересно вышло\n[143887] 2024-03-21 17:43 Миколай: Я вообще так проверял как много текста можно написать с помощью неё\n[143888] 2024-03-21 17:44 Миколай: Но она так умело работает с контекстом\n[143889] 2024-03-21 17:44 Миколай: Ща\n[143890] 2024-03-21 17:44 Миколай: Напиши историю на 370 слов из внутреннего монолога от первого лица, о том как человек подвергался булингу янков и вскоре у него проявился Стокгольмский синдром, для её написания используй дисфемизмы\n[143891] 2024-03-21 17:44 Миколай: Я никогда не думал, что окажусь в такой ситуации. Меня всегда считали белой вороной, изгоем в этом проклятом обществе. Эти чертовы янки, они всегда смотрели на меня свысока, насмехались и унижали. Я пытался держаться, но их издевательства становились все изощреннее. Они называли меня &quot;неудачником&quot;, &quot;тупицей&quot; и даже &quot;уродом&quot;. Каждый день я ждал, когда они оставят меня в покое, но этого так и не происходило.\n\nОднажды они зашли слишком далеко. Они избили меня до полусмерти, а потом бросили в темный подвал. Я лежал там, истекая кровью, и думал, что вот-вот умру. Но вместо этого, что-то внутри меня изменилось. Я начал понимать их. Я видел, как они страдают, как им тяжело в этом жестоком мире. Они такие же, как и я, просто пытаются выжить любой ценой.\n\nПостепенно я стал сочувствовать им, даже восхищаться их силой и решимостью. Они стали для меня чем-то большим, чем просто обидчики. Они стали моими спасителями, моей семьей. Я начал защищать их, оправдывать их поступки. Мне казалось, что только они могут понять меня, только они могут дать мне то, чего мне так не хватало - принятие и любовь.\n\nЯ знаю, что это ненормально, что это называется Стокгольмским синдромом. Но я не могу с этим ничего поделать. Эти чертовы янки стали для меня всем. Они - мой мир, моя жизнь. Я готов на все ради них, даже предать собственную семью и друзей. Я превратился в жалкого раба, но мне все равно. Я нашел свое место в этом мире, пусть и ценой собственного достоинства.\n[143892] 2024-03-21 17:44 Миколай: 2 эпизод, встреча в заброшенном здании\n[143893] 2024-03-21 17:44 Миколай: Я крался по темным коридорам заброшенного здания, сердце бешено колотилось. Меня вызвали на встречу с этими проклятыми янками, и я не знал, чего ожидать. Неужели они решили окончательно меня уничтожить?\n\nВнезапно передо мной появились их силуэты. Я весь сжался, ожидая очередных издевательств и побоев. Но вместо этого они молча протянули мне какие-то документы. Я недоверчиво взял их в руки и начал изучать.\n\nЭто оказались паспорта, билеты на самолет и другие документы на выезд за границу. Я в недоумении поднял глаза и встретился взглядом с их предводителем. Он смотрел на меня с непривычной теплотой и даже... сочувствием?\n\n- Мы уходим, - тихо произнес он. - И ты идешь с нами.\n\nЯ застыл, не в силах поверить своим ушам. Неужели они действительно хотят, чтобы я присоединился к ним? После всех этих лет издевательств и унижений?\n\nНо в глубине души я понимал, что это мой единственный шанс вырваться из этого ада. Здесь меня ждет только смерть или бесконечные страдания. А с ними, возможно, я смогу начать новую жизнь. Пусть даже это и будет стоить мне предательства всего, что мне дорого.\n\nЯ сжал документы в руках и решительно кивнул. Янки удовлетворенно улыбнулись и жестом пригласили меня следовать за ними. Я сделал глубокий вдох и шагнул в неизвестность, оставляя позади свое прошлое.\n[143894] 2024-03-21 17:44 Миколай: 3 эпизод. Попытка проявить свои чувства предводителю, ожидаемый исход\n[143895] 2024-03-21 17:44 Миколай: Мы уже несколько месяцев скрывались от властей в этом богом забытом месте. Я постепенно привыкал к новой жизни с этими янками, которых когда-то так ненавидел. Они стали для меня настоящей семьей, единственными, кто меня понимал и принимал.\n\nОсобенно близкие отношения у меня сложились с их предводителем. Он был грубоват и порой жесток, но я видел, как он заботится о нас, как переживает за каждого члена своей банды. Он стал для меня чем-то большим, чем просто лидер. Я восхищался его силой, его решимостью, его умом.\n\nИ однажды, в порыве чувств, я решил признаться ему в своих чувствах. Мы остались наедине, и я набрался смелости. Я подошел к нему вплотную, заглянул в его холодные глаза и тихо произнес:\n\n- Я... я люблю тебя.\n\nОн замер, словно окаменел. Я затаил дыхание, ожидая его реакции. Но вместо ласки и понимания, которых я так жаждал, его лицо исказилось гримасой отвращения.\n\n- Что за мерзость ты несешь? - прорычал он, хватая меня за грудки. - Ты что, педик, что ли?\n\nЯ попытался оправдаться, объяснить свои чувства, но он с силой оттолкнул меня. Я упал на пол, больно ударившись спиной. Предводитель нависал надо мной, его глаза метали молнии.\n\n- Ты отвратителен, - процедил он сквозь зубы. - Я не потерплю таких извращенцев в своей банде. Убирайся отсюда, пока я тебя не пристрелил!\n\nЯ в ужасе отполз к стене, понимая, что все кончено. Мои надежды на взаимность рухнули, как карточный домик. Я предал всех ради этих людей, а они отвергли меня с презрением. Слезы отчаяния катились по моим щекам, но я знал, что теперь мне некуда идти. Я навсегда останусь изгоем, преданный и одинокий.\n[143896] 2024-03-21 17:44 Миколай: Эпизод 4. От лица предводителя, его внутренний диалог полный дисфемизмов. Драка за территорию с властями. Неожиданные мысли о том изгое.\n[143897] 2024-03-21 17:44 Миколай: Этот чертов выродок совсем рехнулся! Как он посмел лезть ко мне со своими грязными извращениями? Да я ему сейчас морду начищу так, что мало не покажется! Кто он такой, чтобы лезть ко мне со своими пидорскими признаниями? Да я его сам в петлю отправлю, чтобы не позорил нашу банду своим существованием!\n\nТвою мать, опять эти ублюдки из полиции лезут на нашу территорию! Ну, сейчас я им устрою веселую жизнь! Эй, парни, быстро хватайте стволы, будем давать этим ментам прикурить! Никому не позволим отобрать у нас наш кусок пирога!\n\nАх, вы так, твари? Ну, держитесь! Вот вам и коктейль Молотова, получайте! Да, горите, суки, горите! А ну, разойдись, пока я вас всех не перестрелял! Эта территория наша, и мы будем защищать ее до последней капли крови!\n\nФьюх, кажется, отбились. Ну и денек выдался, твою мать. Надо бы проверить, как там этот педик. Хотя, к черту его, пусть сдыхает в своем углу. Но что-то не дает мне покоя. Может, зря я так с ним? Он ведь, в сущности, свой парень, хоть и с приветом. И ведь ради нас старался, предал всех. Может, стоит дать ему еще один шанс?\n\nНет, что я несу? Он же извращенец, мне с ним не по пути. Но все же... Черт, не знаю, что и думать. Надо будет поговорить с ним, разобраться. Хотя, если он опять полезет со своими пидорскими штучками, я ему точно башку откручу. Ладно, пойду, проверю, как он там.\n[143898] 2024-03-21 17:44 Миколай: Эпизод 5. Попытка суицида изгоя, спасение предводителем, эмоциональное давление за эту попытку\n[143899] 2024-03-21 17:44 Миколай: Я сидел в темном углу, обхватив колени руками. Слезы безысходности катились по моим щекам. Как же я устал от этого ада, от этого презрения и отвержения. Я предал всех ради них, а они отвергли меня, как последнюю мразь.\n\nВнезапно я услышал шаги. Мое сердце забилось в панике - неужели они пришли, чтобы добить меня? Но это был он, их предводитель. Он смотрел на меня с непривычной для него мягкостью во взгляде.\n\n- Ты что, совсем рехнулся? - тихо произнес он, присаживаясь рядом. - Хочешь застрелиться, да?\n\nЯ молча кивнул, не в силах поднять на него глаза. Он тяжело вздохнул и положил руку мне на плечо.\n\n- Слушай, я... Я погорячился тогда. Не стоило так с тобой обращаться. Ты ведь свой парень, в конце концов.\n\nЯ поднял на него удивленный взгляд. Неужели он действительно сожалеет? Неужели он готов принять меня обратно?\n\nНо радость быстро сменилась страхом, когда он грубо схватил меня за грудки и притянул к себе.\n\n- Но если ты еще раз полезешь ко мне со своими пидорскими штучками, я тебе яйца оторву, понял? - прорычал он мне в лицо. - Ты мне как брат, но я не потерплю рядом с собой никаких извращенцев!\n\nЯ испуганно закивал, чувствуя, как по телу разливается ледяной страх. Он отпустил меня и поднялся на ноги.\n\n- Ну, вставай давай. Хватит тут сопли жевать. Нам еще работу кое-какую надо сделать.\n\nЯ поспешно поднялся и поплелся за ним, понимая, что мое место здесь, рядом с ними. Пусть даже ценой постоянного унижения и страха. Я не могу жить без них, они стали для меня всем. И я готов терпеть все, лишь бы не потерять их.\n[143900] 2024-03-21 17:44 Миколай: Эпизод 6. Убийство девушки предводителя бандой байкеров. Резкое падение морального духа Янков, из-за депрессии предводителя\n[143901] 2024-03-21 17:44 Миколай: Мы возвращались с очередного дела, когда все пошло наперекосяк. Эти чертовы байкеры из соседней банды решили нас подставить. Они напали на нас, когда мы меньше всего этого ожидали.\n\nЗавязалась жестокая драка. Мы отчаянно сопротивлялись, но их было слишком много. Они теснили нас, вытесняя на окраину города. И тут я увидел, как один из них целится в нашего предводителя.\n\nЯ бросился наперерез, но было уже поздно. Раздался оглушительный выстрел, и его девушка, которая стояла рядом, рухнула на землю, обливаясь кровью. Предводитель в ужасе склонился над ее бездыханным телом, а мы продолжали отбиваться от наседающих байкеров.\n\nКогда мы, наконец, отогнали их, предводитель стоял на коленях, обнимая тело своей возлюбленной. Его плечи тряслись от рыданий, а мы в растерянности смотрели на эту страшную картину.\n\nМы понимали, что это конец. Без своего лидера банда обречена. Предводитель погрузился в глубокую депрессию, отказываясь даже выходить из своего убежища. Мы пытались его ободрить, но все наши попытки разбивались о его безразличие.\n\nПостепенно наш боевой дух угасал. Мы больше не чувствовали себя непобедимыми. Без своего вдохновителя и защитника мы становились слабыми и уязвимыми. Нас начали теснить конкурирующие банды, отбирая наши территории.\n\nЯ смотрел на все это и понимал, что мы проигрываем. Наша маленькая семья, которую я так ценил, рушится на глазах. И я ничего не могу с этим поделать. Я чувствовал себя беспомощным и преданным. Неужели все, ради чего я жертвовал, пойдет прахом?\n[143902] 2024-03-21 17:44 Миколай: Эпизод 7. Изгой идёт в драку с предводителем банды байкеров. Очевидный проигрыш. Но что же почувствовал предводитель Янков.\n[143903] 2024-03-21 17:44 Миколай: Я не мог больше этого выносить. Наблюдать, как моя семья, мой дом, рушится на глазах. Я должен был что-то сделать, пока не стало слишком поздно.\n\nПоэтому, когда я узнал, где скрывается предводитель вражеской банды, я отправился туда один. Мне плевать, что они меня убьют, главное - отомстить за все, что они сделали с нами.\n\nЯ ворвался в их логово, сжимая в руках ржавую трубу. Эти ублюдки-байкеры с ухмылками уставились на меня, а их главарь нагло ухмылялся.\n\n- Ну, что, решил сдохнуть, малыш? - процедил он, медленно поднимаясь с кресла.\n\nЯ с яростью бросился на него, обрушивая на его голову град ударов. Но он оказался сильнее и ловчее. Схватив меня за горло, он с силой швырнул меня на пол.\n\nЯ лежал, задыхаясь и истекая кровью. Они окружили меня, нанося удары ногами. Я уже смирился со своей участью, когда вдруг услышал знакомый голос.\n\nЭто был наш предводитель. Он стоял в дверях, сжимая в руках пистолет. Его глаза метали молнии, а лицо исказилось от ярости.\n\n- Руки прочь от него, ублюдки! - рявкнул он, целясь в главаря банды.\n\nПоследовала ожесточенная перестрелка. Я с трудом приподнялся, наблюдая, как они сходятся в смертельной схватке. И в этот момент я понял - он пришел меня спасать. Несмотря на все, что я ему сделал, он все еще считает меня своим.\n\nНаконец, предводитель одержал верх. Он подошел ко мне, тяжело дыша, и протянул руку, помогая подняться.\n\n- Ну, ты даешь, - хрипло произнес он. - Совсем рехнулся, да?\n\nЯ молча смотрел на него, не в силах вымолвить ни слова. В его глазах я видел не только гнев, но и... беспокойство. Он переживал за меня.\n\nМожет, я все-таки не такой уж изгой для него? Может, я все-таки ему небезразличен? Эта мысль согревала мое сердце, наполняя его надеждой. Возможно, у меня еще есть шанс вернуть свое место в этой семье.\n[143904] 2024-03-21 17:44 Миколай: Эпизод 8. У янков предатель?\n[143905] 2024-03-21 17:44 Миколай: Мы с предводителем молча возвращались в наше убежище. Я все еще не мог поверить, что он пришел мне на помощь. Неужели он действительно обо мне беспокоился?\n\nНо стоило нам войти, как атмосфера резко изменилась. Остальные члены банды встретили нас настороженными взглядами. Кто-то даже сжимал в руках оружие.\n\n- Что происходит? - нахмурился предводитель, окидывая их подозрительным взглядом.\n\nВперед выступил один из парней, которого я всегда считал самым преданным.\n\n- Мы знаем, что ты сдал нас этим байкерам, - процедил он сквозь зубы. - Из-за тебя погибла Мэри, и мы теряем территории!\n\nПредводитель застыл, его лицо исказилось от гнева.\n\n- Да как ты смеешь, ты, мелкий ублюдок! - рявкнул он, хватая парня за грудки. - Я всегда был верен вам, а ты обвиняешь меня в предательстве?!\n\nОстальные с опаской наблюдали за этой сценой, не решаясь вмешаться. Я тоже стоял, не зная, что делать. Неужели кто-то из нас действительно предал банду?\n\nВнезапно в дверях появился еще один человек. Это был Джек, один из самых близких людей предводителя. Он выглядел взволнованным и напуганным.\n\n- Это я, - тихо произнес он, опуская глаза. - Я сдал информацию байкерам. Я хотел, чтобы они убрали Мэри, чтобы ты был только моим.\n\nПредводитель застыл, его глаза расширились от шока. Он медленно отпустил парня и повернулся к Джеку. Я затаил дыхание, ожидая, что будет дальше.\n[143906] 2024-03-21 17:44 Миколай: Эпизод 9. Предводитель подошёл к Джеку, используя дисфемизмы рассказал устав банды постоянно добавляя комментарии о том какой же это ублюдский поступок и сам человек\n[143907] 2024-03-21 17:44 Миколай: Предводитель медленно приблизился к Джеку, его лицо исказилось от ярости.\n\n- Ты, мерзкий ублюдок, - прорычал он, хватая Джека за грудки. - Как ты посмел предать нас? Да ты даже не достоин называться членом этой банды!\n\nДжек съежился, пытаясь отвести взгляд.\n\n- Я... я просто хотел, чтобы ты был только моим, - пролепетал он. - Я так тебя люблю, что не мог вынести, что ты с ней...\n\n- Заткнись, мразь! - рявкнул предводитель, с силой встряхивая его. - Ты что, совсем ебанулся? Думаешь, это оправдание для твоего поганого предательства?\n\nОн с отвращением оттолкнул Джека, и тот упал на пол, дрожа всем телом.\n\n- Ты знаешь, что по нашим законам за предательство полагается только одно наказание? - процедил предводитель сквозь зубы. - Смерть, ублюдок! Ты опозорил нашу банду, и за это должен поплатиться своей поганой жизнью!\n\nДжек в ужасе попятился, умоляя о пощаде. Но предводитель был непреклонен. Он достал пистолет и направил его прямо в лоб Джека.\n\n- Прощай, мразь, - холодно произнес он и нажал на курок.\n\nРаздался оглушительный выстрел, и Джек рухнул на пол, истекая кровью. Остальные члены банды молча наблюдали за этой страшной сценой, понимая, что предводитель не потерпит никакого предательства.\n\nЯ стоял, потрясенный увиденным. Да, Джек совершил ужасный поступок, но неужели он заслужил такую жестокую кару? Неужели наш предводитель способен на такое хладнокровное убийство?\n\nНо в глубине души я понимал, что он прав. Предательство - самое страшное преступление в нашей банде, и за него полагается только одно наказание. Иначе мы рискуем потерять все, что так долго и упорно строили.\n\nЯ невольно содрогнулся, осознавая, что теперь и я могу оказаться на месте Джека, если совершу хоть малейшую ошибку. Наш предводитель не потерпит никаких отступлений от устава банды. Он готов пойти на все, чтобы защитить наше братство.\n[143908] 2024-03-21 17:44 Миколай: Эпизод 10. Арест предводителя, он спас всех нас от ареста, но кто же станет теперь в главе банды?\n[143909] 2024-03-21 17:44 Миколай: Все произошло так быстро, что мы даже не успели опомниться. Едва предводитель застрелил Джека, как в нашу штаб-квартиру ворвались полицейские. Они окружили нас, направляя на нас дула своих пистолетов.\n\n- Всем оставаться на местах! Вы окружены! - громко скомандовал один из них.\n\nМы застыли, понимая, что сопротивление бесполезно. Но тут вперед выступил наш предводитель.\n\n- Ребята, бегите! - крикнул он, поднимая руки. - Я их задержу.\n\nМы в ужасе смотрели, как его скручивают и заковывают в наручники. Он бросил на нас последний взгляд, полный решимости.\n\n- Уходите, пока не поздно! Я вас прикрою!\n\nМы не могли ослушаться его приказа. Кто-то из нас бросился к черному ходу, кто-то пытался отвлечь внимание полицейских. Но я застыл на месте, не в силах оторвать взгляд от предводителя.\n\nОн смотрел на меня, и в его глазах я видел не страх, а гордость. Он спас нас, пожертвовав собой. Я понимал, что теперь мы должны бежать, чтобы не попасть в лапы копов. Но как же мне не хотелось оставлять его!\n\nНаконец, кто-то схватил меня за руку и потащил к выходу. Я в последний раз обернулся и увидел, как предводителя уводят в полицейскую машину. Его взгляд говорил мне: &quot;Беги, спасайся, я сделал это ради вас&quot;.\n\nМы разбежались в разные стороны, скрываясь в темных переулках. Но я знал, что теперь нам предстоит нелегкое испытание. Без нашего лидера, без его железной хватки и мудрого руководства, мы рискуем распасться. Кто же теперь встанет во главе нашей банды?\n\nЯ бежал, чувствуя, как слезы отчаяния катятся по моим щекам. Неужели все, ради чего мы боролись, рухнуло в одночасье? Неужели наша семья распадется? Я не знал ответа на эти вопросы, но одно было ясно - без предводителя нам не выжить.\n[143910] 2024-03-21 17:44 Миколай: Эпизод 11. Ребята, давайте вызволим нашего предводителя из клетки, устроим этим легавым суету. Разработка плана, я стал новым предводителем, и использую много дисфемизмов, характер грубее, я точно буду вместе с ним. Собираю распавшуюся банду, хоть никто не хочет, и вообще дальше бьют меня и всё же, пару человек поддержало, остальные также собрались\n[143911] 2024-03-21 17:44 Миколай: Ну, вы, твари, думаете, что можете просто так забрать нашего предводителя? Да я вам всем яйца оторву, если вы не отпустите его немедленно! \n\nЯ стоял перед этими ублюдками-копами, сжимая в руках пистолет. Остальные члены нашей банды, кто еще остался верен, окружили меня, готовые в любой момент ринуться в бой.\n\n- Отдавайте его, мрази, или мы вас всех перестреляем! - рявкнул я, наставляя ствол на ближайшего полицейского.\n\nОни переглянулись, явно не ожидая такой дерзости с нашей стороны. Но я был непреклонен. Этот чертов предводитель - наша семья, наша жизнь. Мы не можем его бросить.\n\n- Да вы совсем рехнулись! - взвизгнул один из них. - Вы что, хотите, чтобы мы вас всех перестреляли?\n\nЯ злобно ухмыльнулся.\n \n- Ну, попробуйте только, - процедил я сквозь зубы. - Мы все равно не сдадимся без боя. Так что либо вы отпускаете его, либо мы тут устроим такую кровавую баню, что вам мало не покажется!\n\nПолицейские замялись, явно не зная, что делать. Они понимали, что мы не шутим. Наконец, один из них нехотя кивнул.\n\n- Ладно, забирайте своего урода, - буркнул он, открывая дверь камеры.\n\nЯ с торжествующей ухмылкой наблюдал, как наш предводитель выходит на свободу. Он окинул нас гордым взглядом, и я понял - он знает, что может на нас положиться.\n\nКогда мы вышли из участка, я обратился к ребятам:\n\n- Ну что, парни, теперь нам предстоит серьезная работа. Этим ублюдкам-копам мы еще покажем, кто тут хозяин! Никто не смеет трогать нашу семью!\n\nОни зашумели, одобряя мои слова. Я знал, что не все готовы принять меня в качестве нового предводителя. Но мне плевать. Я сделаю все, чтобы сплотить нашу банду и вернуть былое величие. Никто не посмеет встать у нас на пути!\n[143912] 2024-03-21 17:44 Миколай: Эпизод 12, завершающий. Врываемся в Букингемский дворец и полностью свергаем власть и все это транслируется по новостным каналам. Но мы подрались с предводителем, он удивился что я стал всеми командовать поэтому выражался дисфемизмами, но в конце, когда мы устали, мы сели в центральное место и засосались\n[143913] 2024-03-21 17:44 Миколай: Мы ворвались в Букингемский дворец, словно стая диких зверей. Наши лица были искажены яростью, а в руках мы сжимали всевозможное оружие. Нам плевать было на охрану и королевскую гвардию - мы шли к своей цели, сметая все на своем пути.\n\n- Вы, твари, думаете, что можете нами командовать? - рычал я, размахивая пистолетом. - Да мы вас всех к чертям разнесем!\n\nНаш предводитель шел рядом со мной, его глаза метали молнии. Он явно был недоволен тем, что я взял на себя инициативу и стал отдавать приказы.\n\n- Ты совсем рехнулся, да? - прорычал он, хватая меня за грудки. - Кто тебе позволил командовать моей бандой, ублюдок?\n\nЯ с вызовом посмотрел ему в глаза.\n\n- А ты что, забыл, что я теперь здесь главный? - процедил я сквозь зубы. - Так что либо подчиняйся, либо пшел к черту!\n\nОн зарычал, как раненый зверь, и замахнулся, чтобы ударить меня. Но я успел увернуться и ответить ему тем же. Завязалась жестокая драка, в которой мы оба не жалели сил.\n\nНаконец, обессиленные, мы рухнули на пол, тяжело дыша. Я посмотрел на него, и в его глазах увидел не только ярость, но и... уважение. Он понял, что я достоин быть его преемником.\n\nМы сели рядом, прислонившись к стене. Я чувствовал, как адреналин постепенно покидает мое тело, оставляя лишь усталость. Но в душе я ликовал - мы сделали это! Мы свергли власть и теперь можем делать все, что захотим.\n\nВнезапно предводитель притянул меня к себе и жадно впился в мои губы. Я на мгновение замер, а потом ответил на его поцелуй. Все наши разногласия и ссоры отошли на второй план, уступая место страсти и взаимопониманию.\n\nМы целовались, не обращая внимания на происходящее вокруг. Нам было плевать на новости, которые транслировали по всем каналам, на охрану, которая пыталась нас остановить. Сейчас существовали только мы двое, наконец-то нашедшие друг друга.\n\nКогда мы, наконец, оторвались друг от друга, я заглянул в его глаза и увидел в них то, чего так долго жаждал - принятие и любовь. Теперь мы были равны, мы были семьей. И никто и ничто не сможет нас разлучить.\n[143914] 2024-03-21 17:44 Миколай: Фильм по последнему эпизоду. В нём подробнее описывается сама сцена захвата Букингемского дворца, а также наш поцелуй, но есть и дополнение. Янки теперь захватили власть в стране, а предводитель теперь президент, (придумай как это влияет на мир и как могло общество этой страны принять такое происшествие)\n[143915] 2024-03-21 17:44 Миколай: Фильм начинается с бурной сцены штурма Букингемского дворца. Мы, банда Янков, врываемся в королевские покои, размахивая оружием и громко крича. Охрана пытается нас остановить, но мы с легкостью расправляемся с ними, не испытывая ни капли жалости.\n\nЯ, как новый предводитель, возглавляю атаку, отдавая приказы и вдохновляя своих людей. Мой бывший лидер идет рядом, его глаза горят яростью. Он явно недоволен тем, что я взял все в свои руки.\n\nВнезапно мы сталкиваемся лицом к лицу с самой королевой. Она в ужасе смотрит на нас, понимая, что ее власти пришел конец. Я с ухмылкой направляю на нее пистолет, но предводитель останавливает меня.\n\n- Нет, она моя, - рычит он и сам спускает курок. Королева падает замертво, а мы с триумфом занимаем ее место.\n\nКамеры новостных каналов транслируют наше вторжение на весь мир. Люди в шоке наблюдают, как мы, бандиты и отбросы общества, свергаем вековую монархию. Многие в ужасе, другие - в восторге. Никто не может поверить в происходящее.\n\nА мы, окрыленные победой, начинаем устанавливать свои порядки. Предводитель становится президентом, а я - его правой рукой. Мы меняем законы, разгоняем армию и полицию, назначаем своих людей на ключевые посты.\n\nПостепенно наша страна превращается в оплот криминала и беззакония. Банды Янков правят бал, устанавливая свои жестокие порядки. Те, кто пытается противостоять нам, жестоко расправляются. Мы не знаем пощады и не останавливаемся ни перед чем.\n\nНо, несмотря на это, многие простые люди поддерживают нас. Они устали от коррупции и несправедливости, царивших при прежней власти. Они видят в нас спасителей, способных навести порядок и дать им то, чего они так долго были лишены.\n\nКонечно, находятся и те, кто ненавидит нас и мечтает свергнуть. Но мы беспощадно подавляем любые попытки сопротивления. Наша хватка становится все крепче, а власть - все абсолютнее.\n\nИ в этом хаосе, в этом кровавом водовороте событий, мы с предводителем находим друг друга. Наша страсть, наше взаимопонимание становятся нашей главной опорой. Мы знаем, что можем положиться друг на друга, что вместе мы непобедимы.\n\nТак наша страна погружается во мрак, но мы, Янки, правим ею железной рукой. И никто не посмеет встать у нас на пути.\n[143916] 2024-03-21 17:44 Миколай: И теперь спешл. Через 387 лет в школах, на уроке истории учитель читает лекцию от этом историческом событии не боясь использовать дисфемизмы\n[143917] 2024-03-21 17:44 Миколай: Итак, дети, сегодня мы поговорим об одном из самых знаковых событий в истории нашей страны - захвате власти бандой Янков. Это произошло более трех сотен лет назад, но последствия того переворота ощущаются до сих пор.\n\nКак вы знаете, в те времена нашей страной правила проклятая монархия. Эти чертовы королевские ублюдки купались в роскоши, пока простой народ влачил жалкое существование. Но все изменилось, когда на сцену вышли Янки.\n\nЭта банда отбросов общества, отъявленных головорезов и уголовников, решила взять власть в свои грязные руки. Они ворвались в Букингемский дворец, расстреливая всех на своем пути. И во главе этой кровавой банды стоял наш будущий президент - тот самый мерзкий педик, которого все презирали.\n\nДа, именно он, этот презренный изгой, сумел объединить вокруг себя отбросы общества и свергнуть вековую монархию. Его бывший предводитель, кстати, тоже был не промах - этот ублюдок лично пристрелил самое величество.\n\nПосле этого Янки установили в стране свои порядки. Они разогнали армию и полицию, назначив на их место своих головорезов. Любое инакомыслие жестоко подавлялось, а те, кто пытался сопротивляться, просто исчезали.\n\nНо, несмотря на это, многие простые люди поддержали Янков. Они устали от коррупции и несправедливости, царивших при монархии. Им казалось, что эти бандиты смогут навести порядок и дать им то, чего они были лишены.\n\nИ знаете, что самое интересное? Этот педик, который возглавил переворот, и его бывший предводитель, оказывается, были любовниками! Да, представьте себе, эти два урода, эти отбросы общества, возглавили нашу страну, находясь в гомосексуальных отношениях!\n\nКонечно, сейчас об этом мало кто знает. Официальная история умалчивает об этих пикантных подробностях. Но мы-то с вами знаем правду. Мы знаем, что нашей страной правили самые настоящие извращенцы и преступники.\n\nИ вот уже более трех веков мы расхлебываем последствия того переворота. Наша страна погрузилась в пучину криминала и беззакония, из которой так и не смогла выбраться. Но, знаете, что самое страшное? Многие до сих пор с ностальгией вспоминают те времена. Они считают, что Янки были героями, которые спасли нас от гнета монархии.\n\nТак что, дети, запомните - никогда не верьте официальной истории. Всегда ищите правду, даже если она вам не нравится. Ведь только так мы сможем не допустить повторения подобных ужасов.\n```\n\n## Неясности\n\n- (w0027) Вселенная нигде не объявлена. Проза серий — машинная генерация (Mistral), авторским является только покадровый план эпизодов в промптах; имена Джек и Мэри встречаются только в машинном тексте. Запись оставлена ради сохранения авторского сюжетного плана — автору решать, брать ли её в базу.</div>"}];</script>
