<script>const BASE="../";const DOCNAME="Пролог про Максима";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Пролог про Максима\n\n*история* · вселенные: Нимб\n\n## Навигация\n\n- (w0090) Одна из трёх историй, начатых Славой (323651). Пролог - диалог Андрея и Саши перед выходом в поход, весь на характеристике Максима. Скинут 2025-05-04 в 323658, М выбрал именно её для продолжения (323661, 323667).\n\n## Связано с\n\nАндрей, Максим, Саша, Три начатых пролога\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-05-04\n\nвселенная: Нимб (по дате объявления) · окно w0090 · сообщения 323648–323672\n\n*что здесь: Пролог написан и показан соавтору; М объясняет выбор: интересно, во что это выльется, и диалоги развивать сложнее, уважает выбор в сторону усложнения.*\n\n\n\n```chat\n[323648] 2025-05-04 11:32 Слава: Я написал три пролога. Ну или начало 3 истории\n[323649] 2025-05-04 11:32 Слава: Вот только я не могу сконцентрироваться на одном. Так как думаю о других\n[323650] 2025-05-04 11:33 Слава: Поэтому делаю выбор, который возможно не как не повлияет. Но очень важен для меня\n[323651] 2025-05-04 11:34 Слава: 1) апокалипсис ( всё же решил попробовать ещё раз) \n2) максим \n3) автопилот\n[323652] 2025-05-04 11:35 Слава: Вообще я могу скинуть два пролога и ты решишь какой лучше продолжить первым?\n[323653] 2025-05-04 11:39 Миколай: есть ты как существо биологическое совершающее движение, чисто математически  движение это перемещение объекта без изменения формы и размера. у тебя есть психологическое я и эмоциональное. конкретно сейчас это я испытывает одну эмоцию и будет реагировать соответственно, через час это будет другая эмоция. далее, ты сейчас делаешь одно, получаешь определённый неповторимый опыт. но, твой мозг держит то что отпечаталось в нейронах, твоё тело держит то что с тобой происходило.\n\nв целом есть &quot;я&quot;. некий организм с личностью, опытом и другими штуками\nи есть я в состоянии чего-то, с набором навыков и тд\n\nты это ты, но важно явно проводить грань между настоящим, будущим и прошлым. то что ты хотел вчера ты не хочешь сейчас, это не повод обесценивать его желания, но важно с этими людьми строить отношения и любовь. например с заботой относиться к себе в будущем и в настоящем что-то сделать, чтобы ты в будущем имел больше возможностей. или уважать желания &quot;я&quot; из прошлого давать им развитие откладывая желания настоящего, для того чтобы у будущего было больше навыков.\n\nда я смотрел на это с практической точки зрения, но есть и другие взгляды, если найдёшь предлагай\n[323654] 2025-05-04 11:39 Миколай: давай\n[323655] 2025-05-04 11:40 Слава: Только ты должен будешь сразу ответить\n[323656] 2025-05-04 11:40 Слава: Ок?\n[323657] 2025-05-04 11:40 Миколай: да давай\n[323658] 2025-05-04 11:40 Слава: Пролог:\n-Андрей, а нам точно нужно брать его собой? - спросил Саша в очередной раз. \n-а че такого-то?- явное не понимая негодование друга спросил Саша\n-Чего такого-явно переигравая своего друга произнёс Саша\n-ты вообще ходил с ним раньше в поход? -спросил Саша, пристально смотря на Андрея\n-ну нет- ответил честно Андрей \n-что и требовалось доказать-\n-да скажи уже прямо, что такого не так? - произнёс Андрей начиная уже явно злится\n-а в том что я с ним ходил в поход. И когда я с ним в последний раз ходил то стёр ноги до крови. И это не шутка или преувеличения. Я потом ходить нормально не мог месяц-\n-че, ты серьёзно что-ли- \n-да блять.-\n-а почему ноги стёр? - так и не поняв произнёс Андрей. А Саша протирая рукой между глаз. Выдохнув сказал. \n-ты реально не в курсе? - спросил Саша приподняв бровь. Андрей лишь слегка кивнул. \n-вздох... Ладно слушай. Максим у нас спортсмен. Лучший наверное спортсмен нашего колледжа или даже города. Это ты наверное знаешь и без меня. Но знаешь ли ты почему он начил заниматься спортом- не дожидаясь ответа друга, Саша продолжил- потому что ему было скучно. И в похода ему скучно, поэтому он скакал, как заяц туда сюда. Я еле за ним поспевать успевал. И при всём этом он успел ещё какие-то дырки залазить. Скажи мне друг сможешь ты за его темпом поспевать? -\n-ну не знаю-\n-нет не успеешь, раз сука я атлет за ним не поспевать то ты точно-\n-ну мы же его уже пригласили в поход-\n-это да. Нужно будет его попросить по медленнее двигаться-\n-и все. И только из-за того что двигается быстро ты так Яра был против того чтобы он пошёл с нами- усмехнулся Андрей \n-да да друг только из-за этого. Не из-за того, что он похитил медвежонка, а после по всему лесу убегал от его матери. Не из-за того, что он нас в пещеру повел, а потом заблудился. Не из-за того что он пытался лисю поймать сука-\n-а так вот откуда у него медведь дома, а лису я не видел- уставился Андрей на Сашу\n-да я не об этом, а о том что нам пиздец будет в походе. А лису он съел в лесу. Живодёр хренов. Но суп всё равно вкусный вышел- честной признался Саша. А друг схватив его за плечо сказал \n-ну так это же Максим, у него всё идеальное же выходит. Пошли уже. Собираться пора в походе уже.\n[323659] 2025-05-04 11:41 Слава: Скажите вы мне честно. Не надо врать или лицемерить. Это лишь вопрос. Вы ценили то время в котором жили мы? Хотя ответ я и так прекрасно знаю. Нет. \nМы не ценили то время, где могли учиться, развиваться и мечтать. То время, где хаус и неразбериху. Упорядочил порядок и закон. Где ясно было где плохой, а где хороший. Где ты мог стать хоть кем угодно. И не надо этих восклицание. Вроде &quot;мы не могли стать кем хотели&quot;. Ведь это бред. Мы могли стать кем угодно, если бы возжелали этого. Да даже президентом стать могли. А также мы могли мечтать и надеяться на лучшей. \nМы жили в том порядке,  который наши предки собрали за миллионы лет истории. Но ничто не вечно. И весь порядок собранный так долго, тщательно, был разрушен в один миг. \nХотите знать, что же было и что прошло? Я отвечу честно. Не буду врать или искажать историю. Ведь ты, вы обязаны знать. Но не ждите чудо, пафоса и интриги. Я обычный человек. Держите это в голове. Ладно начнем. \nЯ Алексей выживший. В том мире, в котором жиле мы до инцидента я был просто офисный сотрудник. И в тот день, я как обычно проснулся от звона будильника. От такого самого Би Би Би. Ха такой бесячий звон, который наверное всё ненавидят. Но я скучаю. \nЯ проснулся раздраженным. Ну как проснулся. Открыл глаза, а мозг спал. Не желал он просыпаться. Ведь кто желает просыпаться выходной. Да выходной. У вас наверное возник вопрос. Зачем будильник я завёл? . Лишь по одной причине. День рождения у племяшки. \nСразу вас скажу. У самого детей или хотя бы подружки у меня нету. Не сложилась как-то. Но сестра уже в 20 вышла замуж и родила мне племяшку. Как вы поняли по моим словам. Я хорошо относился к племяшки. Поэтому и выключил будильник и дальше лег я спать.\nНо не долго спал я. Мне начали звонить. Племяшка трезвонила мне на телефон. \nБыстро схватив телефон, который лежал на тумбочки. Я ответил и услышал детский голос. \n-дядя! Вы проснулись? Мама сказала позвонить, иначе вы не проснетесь. Но ведь это же не правда. Вы же и без меня проснулись. Вы же не могли проспать мой день рождения- протараторила племяшка. Словно пулемёт, а не ребёнок. \nПока я пытался собрать мысли. И понять, кто и зачем же звонят мне? \n-кто это? - ответил сонным голосом я \n-ДяДЯ!! Вы же шутите! - проорал детский писклявый голос в трубку моего телефона. Из-за этого я чуть ли не подпрыгнул с кровати. И именно этот писклявый голос заставил мой мозг работать. Собирать пазл из моих воспоминаниях. И наступило осознания, который ударил как булавой по затылку. \n-а да-да шутка- начал я врать родной племяннице. \n-точно шутка- более тихим голосом произнесла племяшка. \n-конечно, как же я мог проспать твой день рождения- говорил я смотря на время. И увидев там 8:23. Вздохнул про себя. \n-сейчас уже за подарком еду. Ждите меня ближе к 12- сказал я. После того как примерно посчитал. Сколько займёт времени туда и сюда. \n-в 11- сказал племяшка с едва обидчивым тоном \n-хорошо постараюсь к 11- сказал я протирая глаза. \n-вы же поможете в готовке маме. Если что это не она попросила спросить- сказала она. А в моём голове пронеслось &quot;Да-да не она попросила&quot;\n-сегодня ещё приедет моя подруга Катя и Лера. У них очень красивые куклы и домик даже для кукол есть- продолжала она свой монолог. Пока я пытался найти взглядом свои штаны. \n-а ещё щеночек, такой пушистый и милый-\n-я сейчас за руль сажусь- соврал я чтобы перебить еë монолог. \n-а хорошо. А это позвонить, когда подъезжать будете? - быстро успокоилась племяшка \n-да-да- сказал я пока натягивал джинсы и ожидая пока она бросит трубку. Сам же я редко ложу трубку первым. А племяшка такая же. Поэтому ещё минуты две мы просто молча ждали, кто первый бросит трубку. И конечно же выиграл я. Не без помощи сестры конечно. Сестра увидев как племяшка моя просто стоит молча с телефоном. Просто забрала телефон и отключилась. Привыкла она к нашим противостоянием.\n[323660] 2025-05-04 11:41 Слава: Я наконец-то натянув штаны. Вбиваю в телефон запрос &quot;детский магазин&quot;. После кладу его в карман. И надевая уже футболку с кофтой. Иду на кухни. Ставлю там чайник. И доставая из холодильника хлеб, майонез и колбасу. Быстренько кушаю. И сажусь в машину. Доставая свой телефон. Смотрю на адрес и думаю, как  туда доехать. По тупив пару минут. Всё же строю карту в голове. И выключив телефон еду в магазин детских товаров. \nКатаясь по городу. Заметил что на улице очень мало людей. Ну это не удивительно. Утро субботы, кто вообще встанет. \nЕхал я так. Почти по пустой дороги и думал &quot;что-то не так&quot; Не знаю почему. Просто эта мысль въелось в голову и не исчезала. Мой разум, что-то понял. Заметил мелкую размытую причину этой мысли. Но осознать еë не мог. Поэтому осталось лишь далёкой мыслью.\nВижу дальше по дороге светофор горит желтым, а скоро станет красным. Хотя людей и не было. Я решил, что не зачем нарушать закон. И остановившись. Я отпустил руль. И полностью лёг на сидения. Закрыв глаза. Услышав знакомый звук светофора. Я глянул на него. И в небе увидел странную картину. Линий в воздухе, как от самолёта. Вот только их было сотни если не тысячи. Словно всё страны мира решили разом запустить всё имеющий боеголовки. А я лишь сейчас заметил эти линии. Как я раньше не заметил искренние удивлялся я смотря на небо. \nНе было сигнала или голоса, который говорил бы о запуске ракеты на нас. Не было паники, истерики. Была просто тишина. Пока не прогремел ударь. А после сотряслась земля. И начали гудеть все здания. Потом пошла волна. Заставив трещать окна и зеркала. Волна которая обронила здания. Всё начало рушится. \nЯ ещё был в сознаний, когда здания упала на мою машину. А после тьма и тишина. Словно умер я и лежу в могиле.\n[323661] 2025-05-04 11:42 Миколай: мне второй больше нравится, поэтому предлагаю продолжить первый\n[323663] 2025-05-04 11:47 Миколай: че\n[323664] 2025-05-04 11:47 Слава: Почему?\n[323667] 2025-05-04 11:50 Миколай: почему нравится? я просканировал и чувствую что я буду это читать и мне будет легко, кажется такое сложно поддерживать долго.\nпочему предлагаю продолжить первый? мне интересно во что в конечном итоге это выйдет. и кажется диалоги развивать сложнее, а я уважаю выбор в сторону усложнения. ммм, имею ввиду я не пробовал писать диалоги, поэтому хочу увидеть как можно с этим работать\n[323668] 2025-05-04 11:51 Слава: Ок\n[323669] 2025-05-04 11:51 Слава: Спасибо\n[323672] 2025-05-04 11:55 Миколай: справедливости ради и во втором есть диалоги, но впечатление я дал по началу, как одно и как другое зацепило\n```\n\n## Неясности\n\n- (w0090) Вселенная не объявлена. В w0091 (323926-323934) Слава сообщает, что удалил историю и переписал пролог заново.</div>"}];</script>
