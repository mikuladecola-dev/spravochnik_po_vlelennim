еть энергий должны отдаться одному типу энергий \nУ людей это борьба зависит именно от них самих  типо ты не с рождения псих маньяк ты гнида стал таким лишь и за себя\n[175778] 2024-06-03 22:37 Слава: По этому колдуны могут сражу понять что за человек перед ним\n[175779] 2024-06-03 22:37 Миколай: Типо почувствовать?\n[175780] 2024-06-03 22:38 Слава: Типо увидеть\n[175781] 2024-06-03 22:38 Миколай: Прям увидеть силу отклонения от своего типа энергии?\n[175782] 2024-06-03 22:39 Слава: Типо увидеть цвет серый, серая белый, темная серый\n[175783] 2024-06-03 22:39 Слава: И здесь вопрос каких существ запихать в темную сторону или светлую или как людей смесь\n[175784] 2024-06-03 22:40 Слава: Типо надо существ придумывать\n```\n\n### Версия 2 — 2024-06-03\n\nвселенная: Новый мир (объявлено) · окно w0036 · сообщения 175795–175799\n\n*что здесь: Тёмным колдунам часто прислуживают ночные охотники*\n\n\n\n```chat\n[175795] 2024-06-03 22:50 Миколай: Типа утилитарная теория не моя, но к ней я пришел сам из-за ситуации внешней. В общем потрахаться лучше чем убить или умереть. Типо лучше больше людей или столько же, чем меньше или самому умереть(в любом случае меньше). Естественно в первом случае отвергается любое противозаконное действие. А второе в любом случае идёт против законов.\n\nНу и с этой призмы светлые будут стараться завести семью и распространить здоровые принципы, а вот темные будут стараться либо убить как можно больше, либо умереть как можно быстрее, возможно будут манипулировать серыми и делать их колдунами с нужными качествами. И всё это будет ярко отражаться на их жизни ибо они этим дышат\n[175797] 2024-06-03 22:51 Слава: Ночные охотники существо сотканный из темный энергий ( выглядят по разному ) питается людьми и страхами и  болью \nУ них особо каких либо  сверх сил сил не будет чисто физическая сила и уникальный строения тела типо крылья, многорукий, многоногий, большой рот и т.п\nЧасто прислуживают темным колдунам \nБояться света ( он их не убивает а лишь при
