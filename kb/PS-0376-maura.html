 Именно что способность что уже применена. Но враг может быстро применить опять способность, всё же у него готовый шаблон. Он чаще всего использует вибрацию потомучто это прикольне. Он также научил этому стилю Мауру ( уродливая маска апостол со способностью вибрация) \nНу вроде все, если ничего не забыл. Ну фактик оу не способны использовать сл, нет способны просто у них потом будет много разорваных мыщцы даже при правильном применения и у них нет той же регенерации как у ис. \nНаур также владеет оу. Но не применяет так как у него итак четыре способности который он способен использовать одновременно. Также оу нельзя применить с комбинации с чем либо, с какой либо способностью.\n```\n\n## Неясности\n\n- (w0121) Кроме маски и вибрации, ничего не сказано.</div>"}];</script>
