const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Правитель Кильки\n\n*персонаж* · вселенные: Апостол\n\n## Навигация\n\n- (w0079) Правитель мира; в первой версии сюжета сам хотел объединить миры ради контроля, потом эта роль ушла сестре имитатора. Не позволяет расти аномалии внутри Кильки.\n- (w0106) Первый из появившихся правителей; его мир — килька, с которым у всех прочих миров самая сильная связь.\n\n## Связано с\n\nКилька, Правители, Сестра имитатора, Существо\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-03-06\n\nвселенная: Апостол (по дате объявления) · окно w0079 · сообщения 298826–298838\n\n*что здесь: Первая версия: объединение миров — его замысел; затем отменено в пользу сестры имитатора*\n\n\n\n```chat\n[298826] 2025-03-06 14:44 Слава: Цель главного злодея объединить всё миры в один, конечно главным будет Килька, таким образом наш правитель хочет иметь контроль над другими мирами \nА зачем это сестре имитатора, не знаю но придумаю \nГлавным вопрос является, препятствия достижения этой цели, что им надо, что это был за артефакт у агрегата и зачем им благословенный Фениксом\n[298827] 2025-03-06 15:12 Миколай: ну как минимум это независимость других миров и конкуренция. в плане препятствий\n\nартефакт по типу медиатора позволял менять натяжение струн пространства всех миров, придумаем что он мог делать с помощью этого. если играть на правильной частоте то например он мог на увеличенной площади или на далеком расстоянии использовать свою способность передовая по волне струны. однако, если этот артефакт использует правитель или может использовать его через какую-то установку можно воздействовать на струнную связь между мирами.\nя даю щас сырую идею, но я думаю это можно интересно доработать, если нет объясни\n\nблагословлённый фениксом имеет способность создавать на вечность большое количество пламени, что можно либо как топливо использовать либо для того чтобы нагреть стены, расшевелить и сделать больше похожими на частицы\n[298828] 2025-03-06 15:14 Миколай: я когда анализировал ахахах блять записал\n\nрусский мальчик стал немцем\n[298829] 2025-03-06 15:15 Миколай: блять ну я до сих пор только там\n[298830] 2025-03-06 15:15 Миколай: лучше бы просто провел\n[298831] 2025-03-06 15:15 Миколай: ну пох\n[298832] 2025-03-06 15:15 Миколай: кстати первые 2 дня тему для истории придумать не мог, но сейчас как минимум 5 уже есть которые мне зашли\n[298834] 2025-03-06 15:52 Слава: Да сырая идея, ну можно отталкиваться\nНу нужно ещё препятствия\nИ вообще мир будет объединять сестра имитатора, а не правитель\n[298835] 2025-03-06 15:53 Слава: Что им ещё нужно\n[298836] 2025-03-06 15:53 Миколай: а\n[298837] 2025-03-06 15:53 Миколай: сестра\n[298838] 2025-03-06 15:53 Миколай: пон\n```\n\n### Версия 2 — 2025-03-06\n\nвселенная: Апостол (по дате объявления) · окно w0079 · сообщения 298866–298871\n\n*что здесь: Сдерживает рост аномалии внутри Кильки*\n\n\n\n```chat\n[298866] 2025-03-06 16:03 Миколай: ммм, бля недано же ты говорил....\n[298867] 2025-03-06 16:04 Миколай: я забыл..\n[298868] 2025-03-06 16:05 Слава: Аномалий это мир, который образовался внутри Кильке и конечно правитель кильке не позволяет ему расти\n[298869] 2025-03-06 16:05 Слава: То бишь озера перерождения\n[298870] 2025-03-06 16:05 Миколай: а, нихуя\n[298871] 2025-03-06 16:05 Миколай: теперь пон\n```\n\n### Версия 3 — 2025-10-18\n\nвселенная: неясно (по дате объявления) · окно w0106 · сообщения 375843–375852\n\n*что здесь: назван первым правителем; через связь с его миром неосознанно перемещаются существа, покинувшие свой мир*\n\n\n\n```chat\n[375843] 2025-10-18 18:02 Миколай: https://codepen.io/Pitator-the-flexboxer/full/yyepXbQ\n[375844] 2025-10-18 18:03 Миколай: что если так?\n[375845] 2025-10-18 вения. Ведь это вредит мозгу. Средние продолжительность жизнь у благословенного после получения благословения 10 лет. \nСпособность благословенных. При активации благословения ( то есть пропускания энергий через мозг). У всех благословенных есть четыре основных способности: усиленная регенерация; усиления тела и всех чуств; аура( то бишь самая энергия, которая выплескивается и заставляет чувствовать страх е животных и обычных людей. Так же способный влиять на окружающей. При сильном скоплении) ; сенсорика ( позволяет ощущать других благослрвенных и арбетара или Протобионтов). \nТакже у благословенного есть уникальная способность правителя (под уникальным подразумеввется, что у правителя уникальная благословенния дающий отличающий от всех других благословенной способность. НО если правитель, что дал вам благословения. Даст благословения ещё другому человеку. То оно будет такой же, как и у вас). Примечания: например вам дали ьлагословенния и ваша уникальность способность это огонь. Вы можете поджечь лес. Но после отключения благословенния весь огонь исчезнет. Также и с другими способностями, который полученый благословеннием. После отключения благословенния они просто исчезают. Буть то огненный шар или остановка времени они просто отключаться. \nПримечание: так как всё благословенный включая апостолов. Получают плюс минус одинаковая количество энергии ( силы). Они являются одинаково сильными. Но это не включая индивидуальность людей. Всё же апостолы всё равно чаще всего сильнее любого другого благословенного. \n\nПримечания: Апостолы это 21 человек получивший благословен от правителя рая. ( 21 это максимальное число благословения, который способен давать правитель рая. Другие же правители дают меньше). У апостолов есть дополнительная способность.  Телепатия между ними. ( они способны разговаривать. На расстоянии и также всем мести. Они также могут отказаться от телепатического общения и прервать разговор). Когда у всех благословенных одного правителя одна и та же способность. То у благословенных правителя рая. Они разные. Так как правитель рая. Посылает им лишь сгустки чистой и необработанной силы, который формируется во что уже только внутри Апостолов. Даруя им уникальные способности.\n[375850] 2025-10-18 18:03 Миколай: по этому\n[375851] 2025-10-18 18:04 Слава: Очень круто\n[375852] 2025-10-18 18:04 Слава: Делай  так\n```\n\n## Часть чего\n\nКилька, Правители</div>"}];</script>
