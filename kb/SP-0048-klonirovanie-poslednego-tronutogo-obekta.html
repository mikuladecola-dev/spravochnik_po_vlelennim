87] 2024-02-05 14:28 Миколай: Вообще идея о там как сверхчеловек очень тупо спалился и попал в организацию по изучению таких\n[104388] 2024-02-05 14:28 Миколай: А это пример реализации идеи\n```\n\n### Версия 2 — 2024-02-05\n\nвселенная: неясно (по дате объявления) · окно w0024 · сообщения 104391–104396\n\n*что здесь: формулировка закреплена как первая способность первого поколения: по желанию клонировать последний тронутый объект, остальные — потом*\n\n\n\n```chat\n[104391] 2024-02-05 14:30 Миколай: Так что сам подумай как вклеить идею и если её правильно подать, потребители твоей истории очень оценят такой момент\n[104392] 2024-02-05 14:31 Миколай: Ну первая способность по желанию клонировать последний тронутый объект, остальные потом\n[104393] 2024-02-05 14:32 Миколай: Я ухожу\n[104394] 2024-02-05 14:32 Миколай: На долго\n[104395] 2024-02-05 14:32 Миколай: Максимум до завтра\n[104396] 2024-02-05 14:32 Слава: Куда\n```\n\n## Неясности\n\n- (w0024) не оговорены ограничения: сколько копий, как долго живут, что с живыми объектами</div>"}];</script>
