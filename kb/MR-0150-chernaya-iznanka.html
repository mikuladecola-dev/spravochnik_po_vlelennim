<script>const BASE="../";const DOCNAME="Чёрная изнанка";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Чёрная изнанка\n\n*мир* · вселенные: Апостол\n\n## Навигация\n\n- (w0104) 2025-09-12 скрытая от людей сторона мира; её существование держали в секрете, пока апостолы не устроили публичную охоту. Автор называет её то чёрной, то тёмной изнанкой.\n\n## Связано с\n\nАпостолы, Благословенные, Одержимые\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-09-12\n\nвселенная: Апостол (разбор «неясно») · окно w0104 · сообщения 364766–364780\n\n*что здесь: введена как секрет, раскрытый охотой апостолов; следствия — паника, массовая истерия, гражданские войны*\n\n\n\n```chat\n[364766] 2025-09-12 11:07 Слава: Одержимые это люди одержимые демоном. И этого одержимого либо убивают либо изгоняют демона. Изменения демона производится редко ведь это муторно и опасно. Легче просто убить\n\nОдержимый это аналог Арбетара ( я даже в иногда буду называть их так) то есть у него такие же силы. Но ему не надо обучаться. Он сразу сильный. И в чаще всего сильнее благословенных ( поэтому на убийства одержимого они ходят группой разного количества). \nИ у одержимых есть собственный организаций, а также после раскрытия существования чёрной изнанки. Большое количество людей начало их защищать. \nНо их не я убийства все равно разрешено законным. \nПросто у них есть такие же больший организации как и у благословенных.\n[364767] 2025-09-12 11:07 Слава: Как будет проводиться экзорцизм я ещё не придумал\n[364768] 2025-09-12 11:08 Слава: И вот есть множество организации занимающие убийством одержимых  и получающие деньги от правительство и благотворительности. Хотя некоторые организации нанимают чтобы убить человека либо другого благословенного\n[364774] 2025-09-12 11:28 Слава: И всё это держалось  в секрете от людей.\nДержалось. Но когда апостолы устроили охоту на одну религиозную организацию по всему миру. И делали они это особо не скрываясь. Да какой там скрываться. Они могли в центре города разнести церковь или многоэтажку которая принадлежал той организации. \nАпостола ещё могли публично устроить казнь десятков а то и сотни людей ( работников этой организации) \nА так как организации было одной из самых крупных организации связанный с благословенными. То апостол знатно пошумели на весь мир. Раскрыв существование тёмной изнанки. Конечно началась паника, массовая истерия, гражданский войны и множеств других пагубных вещей \nНу по итогу всё устаканилось и всё продолжили жить как жили. Изменилось только три вещи. \nПервая было подписан публичный договор обозначающий права и обязанности благословенных. А также их не я, не участия в военных конфликтах \nВторое большинство организации раскрылись то бишь о них уже знает мир и могут их даже нанимать для убийства одержимого ( ну это бесплатно. Не благословенный получают деньги за убийство одержимого. Просто именно для родственников одержимого это бесплатно), а вот платно это изгнания демона. \nДа и схватки одержимых и благословенных стали уже обыкновенными \nТретья теперь в данный организации можно в ступить\n[364780] 2025-09-12 11:30 Миколай: спать хочу\n```</div>"}];</script>
