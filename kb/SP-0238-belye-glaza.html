\nИ из этих небесных тел выпустились в воздух, триллион неизвестных частиц. Невидимых и неосязаемых также как и заряженный частицы, но они есть. \nНеизвестный частицы заполонили весь мир. Весь воздух был пропитан ими, и всё живое, что  вдыхала это быстро утухала. Лёгкие заполнялось Оам и медленно разрывались на куски. Люди гибли, также как и животные. Лишь некоторый были способны прожить хотябы 30 лет, а после умерали.  И поколения сменяла поколения. Пока у людей не возник иммунитет во время эволюции и адаптации, как и у других животных. \nПозже частицы вылетевший из небесных тел и погубивший миллиарды жизни назвали Оам. \nЛюди пережив кризисный момент в истории. Заинтересовались откуда появилась проклятия бога. И начали исследовать территорию. И на местах приземления метеоритов, откуда появились Оам окружающая среда и жирность мутировали под активным воздействием Оам. Оказавшись там люди, вдохнув или испив насыщенной Оам жидкость или воздух. Умирали, как их давний предки. Но с исключением некоторый люди выживали и могли творить чудо. По их словам они начали чувствовать внутреннюю энергию. \n\nВот и все. \nИ вот объяснения. В воздухе и в некоторых водоёмах стали насыщенный Оам неизвестной частицей, что может вырабатывать энергию в огромных количествах. Долго время для живых организмов была токсичной.  Но после адаптации они стали нейтральными. \nЧеловек вдыхает Оам ( то есть поглощает, также поглощения может идти просто и через кожу, но более быстрый и способ но который мы можем хоть как-то повлиять). И дальше он по кровеносной системе вместе с кислородом проходит через всё тело, где-то оседая зависима от человека. И также зависимо от человека в нём накапливается определенное количества Оам.то есть у каждого человека своя ёмкость Оам. Если же у человека накапливается больше Оам, чем предусматривает его ёмкость. То Оам выходит через споры, с выдохом и просто через кожу либо другие способы выделением. Выпуск лишний Оам происходит чуть быстрее чем поглащения. \nВ каждым человеке есть Оам но использовать его не как нельзя. Но есть способ. \nЕсли человек поглотит, что-то с большой концентрации( воду либо вздохнет воздух с большими концентрациями Оам) Оам. Его тело просто не успевает выпускать Оам. И у человека два итого может быть. \nПервый: Либо из-за большого количества Оам его лёгкий или сосуд лопаются, либо Оам просто остановит сердца либо Оам из-за своей токсичности убьет человека. \nВторой: человеку удаётся почувствовать и обуздать Оам. Сдерживая Оам, чтобы он не навредил телу. Сдерживать до тех пор пока избытки Оам не выйдут естественным путём. И после когда избытки выйдут. Человек сможет пользоваться Оам ведь он уже почувствовал и сдерживал Оам. \nОпять же это касается только людей. У животных это происходит более инстинктивно. Поэтому шанс выживаемости у них больше чем у людей. Но они не могут раскрыть весь потенциал. \nТакже есть мутанты это животное и люди, у которых под воздействием Оам изменилось их физиология. А также есть некоторый окружающей среды что под воздействием Оам обрели какой-либо воздействия на живых существ. \n\n\nМутанты \nАпостолы- это люди, у которых в утробе матери мутировало нервную систему мозг и глаза. Из-за этого их ней пять чувств, работоспособность мозга, реакция, точность выше чем у обычного человека в несколько раз. \nОбуздать Оам они могут без поглощения огромного количества Оам. Им достаточно пережить одну эмоциональную ситуацию, и они неосознанно воспользуются Оам. И дальше они могут пользоваться им без проблем. Также они могут использовать белый глаза направив туда Оам. \nПосле активации белых глаз то для них время замедляется ( но они не становятся быстрее) и всех их чувства в  улучшаются и они становятся сверх чувствительными. Зрения слух осязания запах и вкус.\n[376402] 2025-10-20 14:29 Слава: Из-за и боль они ощущают больнее.\nНо зато у них словно всё на ладони они ощущать и видят всё что находиться вокруг. И способны словно предсказывать движение противников по слуху или зрению. \nИ становятся невероятно точными. \nКак  ясно они у них лучший контроль Оам. \n\nАскизы\nМаток Аскизы была просто Аксолотлой. Но после в водоём, где она жила упал метеорит и под огромным воздействием Оам она мутировала и начала производить Оам. \nНавечно Дети лет 7-10 на вид с белоснежной кожей,с розовыми оттенками ( или другими оттенками) и с чертами аксолотлы. Как они рождаются я ещё не придумал. \nИ вот эти дети не стареют. И у них быстрая регенерация, а также зверский аппетит. Они могут съесть человека целиком за пару минут. У них инстинкт голода выше разума. Они не чувствуют боли.  И разумом они всегда как дети. \nМатка, что выделяет их из яиц подобное муравьиной матки. \nМатка большая ростом 4 местра и в ширину такая же. Она больше похожая на червя с огромными количествами лапок. Но с такой же белоснежное кожей. \n\nДети мирового древа \nПроизошли от мутировшого дерева из-за Большого количества Оам. \nЭто гуманноидный деревянный существо с оранжевой сердцевинной, в котором как раз и хранится Оам. Они могут изменить образ на человеческий. \nТак как они из дерева мирового древа. Хрен ты их пробьешь, не кто из апостоловы не сможет нормально их ранить, а если ранят они будут регенерировать. Ну и они сверхсильный (сильнейший наверное в физическом плане) \nОни могут передвигаться в земле и внутри деревьях. \nОгонь им не вредит. Сам огонь на них тухнет. Ну они могут выпускать корни туда сюда ими драться.\n\nАзуриэль\nДавай я его опишу \nГуманоид человеческого роста синий кожей( не точно может розовый) с острыми ушами как у эльфа \nТакже на лице красивый узоры разного цвета, который могут меняться в зависимости от эмоций\nОдежда зимняя \nСам он гибкий\nЭмпатия\nПрекрасно ощущать намерения\nСлава дондоков:\nАзуриэль: Нейро-сканер\nЕго способность это не эзотерическая эмпатия, а гиперразвитое чувство, позволяющее напрямую считывать и интерпретировать биоэлектрическую активность нервной системы других существ.\nнаходясь в толпе он теряется и не может сконцетрироваться\nЭто б
