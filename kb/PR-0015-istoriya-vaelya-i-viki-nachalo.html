const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># История Ваёля и Вики (начало)\n\n*2024-06-07 · Новый мир · Начало истории переслано в чат постом из канала (176753); в 176756 анонсировано продолжение и материал-вдохновение ссылками — самого текста продолжения в окне нет*\n\n---\n\n\n\n```chat\n[176744] 2024-06-07 19:00 Миколай: Вот референс кст\n[176745] 2024-06-07 19:00 Миколай: Чекнешь историю\n[176746] 2024-06-07 19:00 Миколай: ?\n[176747] 2024-06-07 19:01 Миколай: Кста, получилось её пухленькой сделать?\n[176748] 2024-06-07 19:02 Миколай: Вообще чел с фиолетовыми волосами смотрит в тёмной комнате в экран телефона на фотку\n[176749] 2024-06-07 19:03 Миколай: Поэтому такой покрас\n[176750] 2024-06-07 19:05 Слава: История которая на твоём канале\n[176751] 2024-06-07 19:06 Миколай: Да\n[176753] 2024-06-07 19:07 Слава: Не бейте за примитивность, вся суть в сюжете, а тут только начало 😅\n\nВ общем, Ваёль, как обычно сидел в группе, где все обсуждают музыку. И многих участников он хорошо знает. В частности, та музыка которую они слушают подтверждает их характер. И у него в планах было познакомиться с фанатом его музыки. Их там не так уж и много, около 6. Но, большинство выделяют для его творчества отдельный плейлист. А вот Вика, в каждой подборке оставляет его творчество, ведь его тематика всегда верно передаёт её вайб\n\nИ в последнее время она стала говорить, что часто его слушает, да и в чате можно было убедиться. Она постоянно говорила об ужасных желаниях оборвать жизнь \n\nПусть она и в чате, активности по отношению к участникам к сожалению она почти не проявляет, ведь её уже давно игнорируют\n\nОднако, Потас заметив её чувства решил поддержать. Он написал ей в личку. Она не знала, что с ней общается кумир. Ваёль записал себя как юзер764\n\nИ все же когда они более менее стали хорошо общаться, Тосыч узнал с кем имеет дело и был удивлён, и интересовался почему именно с ним он решил общаться\n\nВике было грустно, но всё-таки Ваёль смог её успокоить. Они общаются целую неделю и за это время очень сблизились. И всё бы было так вкусно сладко и приторно, пока Ваёль не предложил..\n\n\nНо, прежде чем узнать, что он предложил, предложу ознакомиться с тем какие примерно композиции Ваёля слушает Вика, чтобы понять, какой до сих пор вайб сохраняется в её жизни. Тобиж, для ознакомительных целей\n[176754] 2024-06-07 19:07 Слава: Это\n[176755] 2024-06-07 19:07 Миколай: Это начало истории\n[176756] 2024-06-07 19:07 Миколай: Внимание!! Ниже представлено продолжение истории с Тосычем и Ваёлем, а так же материал для вдохновения. У этих работ довольно-таки жуткое содержание:\n\n| Продолжение\n| Вдохновение\n[176757] 2024-06-07 19:08 Миколай: Продолжение и видео от куда я полностью всю идею спиздил\n[176758] 2024-06-07 19:11 Слава: Бля я только это видео видел\n[176759] 2024-06-07 19:11 Миколай: ?\n[176760] 2024-06-07 19:11 Миколай: Недавно посмотрел?\n[176761] 2024-06-07 19:11 Слава: Вдохновение твой\n[176762] 2024-06-07 19:11 Слава: Видел\n[176763] 2024-06-07 19:12 Слава: Не смотрел\n[176764] 2024-06-07 19:12 Миколай: Ааа, понял\n[176765] 2024-06-07 19:12 Миколай: Ну вот, история основана на его сюжете\n```</div>"}];</script>
