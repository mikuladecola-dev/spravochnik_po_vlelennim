const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Бессмертный\n\n*история* · вселенные: 7 островов, Апостол, игра бога\n\n## Навигация\n\n- (w0032) Второй боец отряда у Славы: бессмертие плюс работа с плотью и костями на всех дистанциях. Объявлен в 166481, развёрнут в 166507, условие бессмертия уточняется в 166753-166757.\n- (w0048) Слава уличает Миколая в противоречии по бессмеру, Миколай отвечает. Само появление персонажа в это окно не попало — здесь только спор о его репродуктивных органах и дочери.\n- (w0079) Герой первой законченной истории Славы. В окне идёт разбор канона: Миколай пересказывает, как понял, Слава правит. Он же &#x27;монстр&#x27;, которого опасался отряд, и он же пример Гения.\n- (w0080) Ранее написанная история, служит мерилом объёма: новая примерно на 100 слов короче. Действие целиком в России, время — Вторая мировая (отсюда немцы). Её герой мстить не собирается.\n- (w0081) Одна из ранее написанных историй автора; в окне упоминается как ассоциация с кровью (302772) и в списке центральных идей (302863).\n- (w0099) Апостол, к которому приближён Кура. В окне только назван — по имени и в вопросе о втором благословении.\n- (w0115) В пересланных самому себе сообщениях С разбирает претензии по канону: третий пункт про Бессмертного — М якобы сказал, что бессмеру отрезали репродуктивные органы и что у него есть дочь; С отрицает: дочери нет и ничего не отрезали.\n\n## Связано с\n\nАпостолы, Благословение, Благословение / апостол, Всегда активное благословение Бессмертного, Гении, Деревня Лихая, Защитник, Кура, Отряд сильнейших, Отряд: Старик, Рыжий, Доктор, Капитан, Поток крови, Провидец, Пустынник, Сверхчеловек с идеальным контролем, Семь островов, Чужемирец (история), Эльф (чужемирец)\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-05-07\n\nвселенная: игра бога (по дате объявления) · окно w0032 · сообщения 166473–166510\n\n*что здесь: Убить может лишь сверхчеловек с идеальным контролем; не просто регенерация, а изменение структуры тела, стрельба костями, костяной сад, создание существ из плоти; хорош на всех дистанциях.*\n\n\n\n```chat\n[166473] 2024-05-06 23:32 Слава: Сделал\n--- пауза 7.9 ч ---\n[166480] 2024-05-07 07:28 Слава: Отряд сильнейших\n[166481] 2024-05-07 07:28 Слава: Провидец; бессмертный\n[166482] 2024-05-07 07:29 Слава: И за пихая туда кого-нибудь\n[166501] 2024-05-07 07:33 Миколай: Несоразмерный\n[166504] 2024-05-07 07:33 Миколай: Крч пиздец большой\n[166505] 2024-05-07 07:33 Миколай: Или меняющий размер по желанию\n[166507] 2024-05-07 07:54 Слава: Для понятности Провидец имеет способность отматывать время но при этом отматывая время превращается в петлю времени где он обязан 10 000 прожить один и тот же промежуток времени ( безумец,  ни разу не проигравший в рукопашном бою или в стрельбе)\nБессмертный бессмертный которого может убить лишь сверхчеловек с идеальном контролям, он способен не просто регенерировать повреждённый части, а изменять структуру своего тела или стрелять костями или с помощью плоти создавать разных существ ( на любой дистанции хорош на дальнее и средней он может стрелять костями, создавать костенной сад, или чудовище, а на ближней дистанции неплохо сражаться и использует свой бессмертие на все сто)\n```\n\n### Версия 2 — 2024-05-07\n\nвселенная: игра бога (по дате объявления) · окно w0032 · сообщения 166750–166762\n\n*что здесь: Миколай приносит фандомную классификацию условий бессмертия, Слава выбирает тип «4».*\n\n\n\n```chat\n[166753] 2024-05-07 15:41 Миколай: Так какое условие бессмертности?\n[166754] 2024-05-07 15:41 Миколай: https://anime-characters-fight.fandom.com/ru/wiki/%D0%91%D0%B5%D1%81%D1%81%D0%BC%D0%B5%D1%80%D1%82%D0%B8%D0%B5\n[166755] 2024-05-07 15:42 Миколай: Тут все возможные условия пропи 10\n\nвселенная: Апостол (по дате объявления) · окно w0079 · сообщения 300757–300764\n\n*что здесь: Пересказ Миколая (что он вынес из текста): очнулся в братской могиле в деревне Лихой, управляет кровью и частями тела, после смерти всё забывает, боль будит гнев, который включает способности; предположение, что способности пробудил эльф*\n\n\n\n```chat\n[300757] 2025-03-10 18:05 Миколай: кстати вопрос пока-что\n[300758] 2025-03-10 18:05 Миколай: что такое существо\n[300759] 2025-03-10 18:05 Миколай: я забыл\n[300760] 2025-03-10 18:05 Слава: Существо это ребёнок правителя, который имеет физическую оболочку\n[300761] 2025-03-10 18:15 Миколай: короче, для себя напишу а ты скажешь правильно я понял или нет\n\nесть деревня Лихая. там всех убил эльф и в этой деревне образовалась могила яма с солдатами. деревня немцев или русских не знаю\n\nимено там очнулся бессмертный чел. его способности управлять кровью и частями тела. он всё забывает после смерти, ему не нравится боль и она заставляет его вспоминать гнев, который активирует способности.\n\nа че глазки у него всегда белые?\n\nкак я понял эльф это чужестранец, а дед с шрамами слезами кто-то из апостолов\n\nнемцы некоторые знают этого мальчика, некоторые понимают его речь (старик вроде понимает)\nу кого-то есть ремень или брелок связанная с мальчиком\n[300762] 2025-03-10 18:16 Слава: Нет\n[300763] 2025-03-10 18:17 Миколай: и крч этот эльф пробудил способности гг\n[300764] 2025-03-10 18:17 Миколай: пока я так пон крч\n```\n\n### Версия 6 — 2025-03-10\n\nвселенная: Апостол (по дате объявления) · окно w0079 · сообщения 300765–300770\n\n*что здесь: Правка автора: деревню Лихую вырезали приехавшие немцы, Бессмертного убили из пистолета, который потом им пахнет; эльф к его становлению апостолом непричастен*\n\n\n\n```chat\n[300765] 2025-03-10 18:21 Слава: Деревню лихую заехали немцы и всех поубивали, а Бессмертного убили пистолетом, который потом им пахнет\nГлаза у него всегда белые потому что, у него благословение всегда актив
