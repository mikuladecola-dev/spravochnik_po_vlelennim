запустил все пули в опору. Я вылетел, пробив собой горящию дверь. И как только вылетел я. Здания обрушилась. Я слышал крик, да и видел я его придавленного и горящего. Музей, прошлой спасло меня от настоящего чудовища. А я лежал и слушал, как горит огонь и крики чудищь. И как бы не было бы странно, но я почти заснул. Но быстро понял, что спать на улице уж точно мне не надо. Поэтому сначала сел. Поседел и понял, что крик утих. Сначала я сменил пустой магазин, на полный.  Встал и подошёл к горящиму прошлому. И видел я горящего Перага, он был мертв. И всё горела, кроме перьев белых. И даже в красно-оранжевым огне, эти перье были белые. И я ушёл оттуда. И шёл я в полной темноте, не веря, что это правда, до сих пор, я словно глупая машина до сих пор не мог признать, что это правда и истина теперь. И ладно. Пришёл я в магазин, который был, хотя бы был цел внутри. Зайдя туда, нашёл я там коморку. Закрыл я дверь и спать улекся. Не знаю долго спал я или всего часок. Проснулся, опять я в темноте, опять не помнил, что же был и опять я вспомнил всё. И я собрался наконец-то. Решил поставить цели. Еда, одежда, подумали наверное глупо,зачем одежда! , а я скажу зачем. Затем чтобы бегать мне нормально. Ведь попробуйте побегать в пиджаке и в туфлях. Да и холодно, ведь солнце нет. И так еда, одежда, оружие, палатка и возможно ещё чего нибудь. Поэтому сначала,  обыскал я магазин, в котором я уснул. Собрал муку и крупы, лапшу и зерны, консервый разный, пару фруктов, овощей и шоколадки все  закинул, воды и сухофруктов, и специй разных, и соль и сахар и ещё помелачи. И только тогда я понял, дурак, у меня же даже рукзака нет. А совсем, что я хотел взять мне точно нужный походный. Пошёл на его поиски. Конечно взяве автомат. Было страшно бродить во тьме,  и при этом знать, что здесь водится. Я просто шёл и шел. И на удивление, я быстро нашёл магазин, для тех кто ходит в поход. Как никак уже как 32 года здесь живу. Зайдя туда, я переоделся, взять фонарик, верёвку и лопату, которая часто была в
