о чревато потерями навыков или памяти, ну относительно кнш.\n\nзаклинания разные, шар огня, мини ураган с ладонь по размеру, водяной луч(режет хорошо твёрдое а мягкое не может), ослепление, усыпление\n\nну это базовый набор который онираскрывает разным людям, не весь кнш\n\nу него коричневые джинсы, рубаха желтовая из плотной ткани, плащ синеватый, уши естественно эльфийские но кожа грубоватая, но он привлекательный\n[273517] 2024-12-23 19:03 Слава: Джинсы в средневековье\n[273518] 2024-12-23 19:03 Слава: А не дохуя ли у него способность\n```\n\n### Версия 2 — 2024-12-23\n\nвселенная: неясно (по дате объявления) · окно w0068 · сообщения 273551–273556\n\n*что здесь: Слава указывает, что усыпление — это уже второе благословение, так нельзя; Миколай соглашается переделать*\n\n\n\n```chat\n[273551] 2024-12-23 19:12 Слава: Усыпления это чё второе благословение \nТы там берега не путый\n[273552] 2024-12-23 19:12 Миколай: эх\n[273553] 2024-12-23 19:12 Миколай: ладно\n[273554] 2024-12-23 19:12 Миколай: переделаю\n[273555] 2024-12-23 19:12 Миколай: но потом мне уже лен\n[273556] 2024-12-23 19:13 Миколай: слава\n```\n\n### Версия 3 — 2024-12-25\n\nвселенная: неясно (по дате объявления) · окно w0068 · сообщения 274525–274534\n\n*что здесь: Требование ослабить заклинания и разделить их на мгновенные и с задержкой; водяной луч назван слишком сильным*\n\n\n\n```chat\n[274525] 2024-12-25 09:19 Слава: И ослабь его магический заклинание\n[274526] 2024-12-25 09:19 Миколай: типа\n[274527] 2024-12-25 09:19 Миколай: и это я не понял прости\n[274528] 2024-12-25 09:20 Слава: Ты типо прочти моего перса он не сильный но и не слабый у него нет заклинание который супер супер по типу твоего водяного\n[274529] 2024-12-25 09:20 Слава: Т9\n[274530] 2024-12-25 09:20 Слава: Снова прочти\n[274531] 2024-12-25 09:26 Миколай: мне надо разделить заклинания на мгновенные и с задержкой\n[274532] 2024-12-25 09:26 Миколай: ?\n[274533] 2024-12-25 09:26 Миколай: верно\n[274534] 2024-12-25 09:26 Слава: Типо то
