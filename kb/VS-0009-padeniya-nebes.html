 06:26 Миколай: Небо падает\n[65975] 2023-12-26 06:26 Миколай: Ломается\n[65976] 2023-12-26 06:26 Миколай: Когда полностью сломается всё исчезнет\n[65977] 2023-12-26 06:26 Миколай: А сверх люди не смогут помочь\n[65978] 2023-12-26 06:27 Миколай: И главная миссия найти атланта\n[65980] 2023-12-26 06:28 Миколай: Ну походу это другое\n[65981] 2023-12-26 07:00 Слава: Падения небес \nВ один день на землю начали падать метеориты , больше миллиарда метеоритов пала на землю \nИ этот день стал самым страшным в историй человечества больше 3 миллиардов смертей\n[65982] 2023-12-26 07:00 Слава: И что дальше?\n[65983] 2023-12-26 07:02 Слава: По типу с этих метеоритов начали вылазить монстр или эти метеориты начали выпускать споры и заражать людей\n[65984] 2023-12-26 07:02 Слава: Или он просто наделил способностями\n[65985] 2023-12-26 07:13 Миколай: Так\n[65986] 2023-12-26 07:13 Миколай: Ну я буквально думал небо трескается и падает\n[65987] 2023-12-26 07:13 Миколай: По кусочкам\n[65988] 2023-12-26 07:14 Миколай: Типо весь мир это замороженный мыльный пузырь\n[65989] 2023-12-26 07:14 Миколай: Способностей нет на самом деле, носители сами их придумали\n[65990] 2023-12-26 07:15 Миколай: На самом деле это спец эффекты на камеру\n[65991] 2023-12-26 07:15 Миколай: Фильм\n[65992] 2023-12-26 07:15 Миколай: Который смотрят люди\n[65993] 2023-12-26 07:15 Миколай: И думают что это правда\n[65994] 2023-12-26 07:15 Миколай: На самом деле в реальности никто не видел их подвигов\n[65995] 2023-12-26 07:16 Миколай: И вообще этих людей\n[65996] 2023-12-26 07:16 Миколай: А угроза разрушения реальная проблема\n[65997] 2023-12-26 07:16 Миколай: Люди со способностями говорят что все исправят\n[65998] 2023-12-26 07:16 Миколай: Зрители в них верят\n[65999] 2023-12-26 07:16 Миколай: Мир рушится, а вера людей остаётся\n[66000] 2023-12-26 07:17 Миколай: Ученые тоже верят в сверх людей\n[66001] 2023-12-26 07:17 Миколай: Поэтому ничего не делают для спасения мира\n[66002] 2023-12-26 07:18 Миколай: В итоге по
