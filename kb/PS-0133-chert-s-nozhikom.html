const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Чёрт с ножиком\n\n*персонаж* · вселенные: монстры\n\n## Навигация\n\n- (w0050) Невидимый для обычных людей небольшой чёрт с ножиком, легко и быстро перемещается. Приходит к тому, кто взялся хранить чужой секрет: пока человек хранит секрет, монстр «хранит» его самого и изредка выполняет его просьбы.\n\n## Связано с\n\nБуквальное исполнение желаний, которое нельзя отменить, вселенная из мини историй / наша книга монстров («Некрономикон наш»)\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-08-09\n\nвселенная: монстры (объявлено) · окно w0050 · сообщения 216956–216960\n\n*что здесь: монстр введён целиком вместе с наброском сцены; далее в обсуждении М называет это только идеей и наброском*\n\n\n\n```chat\n[216956] 2024-08-09 12:44 Миколай: короче\n[216957] 2024-08-09 12:44 Миколай: такая идея\n[216958] 2024-08-09 12:44 Миколай: был разговор и вот человек говорит мол секрет расскажет, а с этим секретом к тому кто выбрал держать секрет приходит и этот монстр, пока тот хранит секрет тот монстр хранит и его, хотя и изредка даже выполняет просьбы парня, думая что он его видит и с ним общается\n\nпосле неловкой ситуации гг говорит: такой стыд, убейте меня.. {Он уже начинает замахиваться...} хотя нет не меня, давай кого-нибудь другого... {Он капец закатывает глаза и те 360 градусов по вертикали проехали ему очень не нравится такая смена идей, злой и раздражённый убивает объект мыслей того парня} хотя ладно никого не надо убивать.. {но тут уже поздно, после начала реализации действие желания нельзя отменить, и начинаются на глазах главного героя массовые гибели, каждому он ре*ет сонную артерию и дождь из их крови окрашивает всю улицу в красный, самого героя и д
