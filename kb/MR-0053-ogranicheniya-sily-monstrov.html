ов верой не создать или это потребует огромных усилий. Рациональное мышление о монстре останавливает его развитие — это прерогатива иррациональных мыслей и сильных эмоций; у суицидников нет сильных эмоций, только желание.*\n\n\n\n```chat\n[217966] 2024-08-11 17:41 Миколай: я подумаю\n[217967] 2024-08-11 17:47 Слава: Так долго думаешь\n[217968] 2024-08-11 17:47 Миколай: ну так во первых родитель должен быть суицидником 100%, он информацию о нём должен распространять на соответствующих форумах, однако столь сильной эмоции они не добьются, у мира просто нет ну настолько большого количества людей. да и даже если 19 миллиардов людей было как они все поверят в одно существо, эффект сломанного телефона просто мне даст настоящую веру одному существу в лучшем случае, да и вера не будет такой сильной у всех\n[217969] 2024-08-11 17:48 Миколай: сильных монстров верой не создать\n[217970] 2024-08-11 17:48 Миколай: ну точнее это потребует очень больших усилий\n[217971] 2024-08-11 17:49 Миколай: да и если перейти в рациональное мышление когда думаешь о монстрах то он не станет развиваться\n[217972] 2024-08-11 17:49 Миколай: это прерогатива иррациональных мыслей\n[217973] 2024-08-11 17:49 Миколай: и сильных эмоций\n[217974] 2024-08-11 17:49 Миколай: у суицидников нет столь сильных эмоций, как минимум страха смерти\n[217975] 2024-08-11 17:49 Миколай: ток желание\n[217976] 2024-08-11 17:50 Миколай: но чтоб для всего мира\n[217977] 2024-08-11 17:50 Миколай: хз\n[217978] 2024-08-11 17:50 Миколай: не знаю таких\n[217979] 2024-08-11 17:52 Слава: А теперь логический объясни, почему родитель суицидник\n[217980] 2024-08-11 17:52 Слава: Ведь Кирилл не был суицидником\n[217981] 2024-08-11 17:52 Миколай: так он и не хотел уничтожить мир\n[217982] 2024-08-11 17:53 Миколай: просто полетать\n```\n\n### Версия 3 — 2024-08-11\n\nвселенная: монстры (по дате объявления) · окно w0051 · сообщения 217996–218014\n\n*что здесь: Спор продолжается: желание апокалипсиса у обычного человека слишком незначител
