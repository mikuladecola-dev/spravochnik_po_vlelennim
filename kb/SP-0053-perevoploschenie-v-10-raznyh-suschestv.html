ате объявления) · окно w0030 · сообщения 154417–154425\n\n*что здесь: Введён критерий отбора формы: годная как отдельный персонаж форма может не годиться как «часть способности человека» (случай Витрофунгуса).*\n\n\n\n```chat\n[154417] 2024-04-06 17:26 Миколай: Витрофунгус (Vitrofungus), что можно перевести как &quot;стеклогриб&quot;. \n\nЭто гуманоидные существа с вытянутым телом и конечностями. Их кожа покрыта сетью грибных нитей, напоминающих грибницу хитридиомицетов. Кости и череп состоят из прозрачного стекловидного материала, просвечивающего изнутри. Пальцы на руках и ногах заканчиваются острыми стеклянными когтями. \n\nУ них большие черные глаза без видимых белков и зрачков. Рот усеян острыми стеклянными зубами. Витрофунгусы питаются, паразитируя на других живых существах - присасываются к ним специальными корнями-присосками и высасывают питательные вещества.\n\nПередвигаются они быстрыми рывками, опираясь на все четыре конечности. Их тела хрупкие, но осколки стекла, на которые они рассыпаются, могут наносить глубокие раны. \n\nВстреча с витрофунгусом не сулит ничего хорошего - это опасный хищник и паразит, чуждый земной природе. Его облик сочетает черты гуманоида, гриба, амфибии и стекла, что делает его очень странным и пугающим созданием.\n[154418] 2024-04-06 17:28 Слава: Ну как отдельный персонаж крутой \nА как часть способности человека , как та не подходит\n[154419] 2024-04-06 17:29 Миколай: Ну так-то, да\n[154420] 2024-04-06 17:29 Миколай: Тогда, ммм подскажи че да как к челику там должно быть\n[154421] 2024-04-06 17:30 Миколай: Ну то есть чтобы я понимал что лучше добавить к персу, чтобы гармонично было\n[154422] 2024-04-06 17:31 Слава: Кратко типо Бен 10 только более взрослый характер ( но также игривый, издевательский, недотёпа в некоторых местах, с юмором )\n[154423] 2024-04-06 17:31 Слава: Но что бы паразитировать на ком то для него слишком жёстко\n[154424] 2024-04-06 17:31 Миколай: Тут просто прикол в том, что кости из стекла, а значит типо резня
