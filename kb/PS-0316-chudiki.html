n- что же. Не будем больше задерживаться. Начнём мой повествования. Но для этого мне нужный помощники. Что вы зритель увидели интересную картину. - Зритель на столь резко и импульсивно подняли руки. Что даже ведущий слегка содрогнулся. \n- ой простите. У меня уже есть помощники и я уже хотел их пригласить - виновато произнёс ведущий. Зритель грустно опустили руки. Но ведущий слегка поколебавшись. Гордо произнёс \n- ну раз вы хотите участвовать. Я всё уступлю вам, часть моей сцены. Но лишь для одного человека. И думаю вы будете не против если на сцене будет именно та, что предложила мне поведать свою историю- ведущий внимательно посмотрел на зритель. Те конечно были против. Ведь на сцену хотели именно они. Но приняв факт, что им туда не попасть. Всё же согласились с предложением ведущего. \nВедущий получив согласия. Подошёл к девочке, что первая крикнула о желание послушать историю. \nА девочка, что крикнула об этом. Жалась в стул. Молясь, чтобы он не ошибся. А когда тот пошёл в ее сторону. Едва смогла удержаться от крика. Ещё крепче держяс за стул. А ведущий всё подходил. Пристально смотря на девочку. И наконец-то он подошёл и протянул одну руку отводя , а вторую убрал за спину . Ведущий ждал, когда та примет предложение, о выступление. Девочка огляделась, как будто бы по считая, что он ошибиться. А после встав со стула медленно словно перо. Положила на руку ведущего. И быстро обернувшись назад. Чтобы, как видимо получить согласия родителей. \nУвидела слегка улыбающегося отца, что был явно горд за то, что именно его дочь идёт на эту сцену. И мать что пыталась держать вид строгой матери. Но глаза явно выдавали крик души. Поэтому девочка спокойно пошла за ведущим и встав рядом с клоном. Начала его разглядывать и начал подмечать, что сходство с ведущим всё меньше. Чем казалось ей. \nВедущий же встав рядом с девочкой задал вопрос\n- Юная леди. Не соизволите сказать своё имя?- \n-а да- заволновалась девочка. И перестав разглядывать клона. Сказала деловита. \n- меня зовут
