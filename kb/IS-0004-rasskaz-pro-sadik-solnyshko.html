<script>const BASE="../";const DOCNAME="Рассказ про садик «Солнышко»";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Рассказ про садик «Солнышко»\n\n*история* · вселенные: вне вселенной\n\n## Навигация\n\n- (w0005) История без мира: пребывание пятнадцатилетнего Славы в детском саду для детей с ограниченными возможностями из-за туберкулёза. Сначала сырой рассказ Славы с расспросами Миколая, потом переписанный Миколаем монолог от первого лица для ролика.\n\n## Связано с\n\nSad истории (канал грустных историй)\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2022-09-24\n\nвселенная: вне вселенной (разбор «неясно») · окно w0005 · сообщения 16751–16811\n\n*что здесь: Черновик Славы: изолятор первую неделю, всё маленькое, двухлетний ребёнок, на которого орут, наглые девочки; по вопросам Миколая добавлены одиночество и гудящая голова, встреча с человеком с синдромом Дауна, четыре колбочки крови, воспитатель и врачи, плохой слух на фоне детского шума*\n\n\n\n```chat\n[16751] 2022-09-24 16:07 Слава: Ок\n--- пауза 1.7 ч ---\n[16753] 2022-09-24 17:52 Слава: Это мой рассказ про садик солнышко я здесь был раньше когда мне было 6 лет и нечего не помню а вот этот раз я сюда попал в 15 лет из-за клеток туберкулёза первую неделю я был в изоляторе и мне было норм но потом меня отправили ко всем здесь мне сразу не понравилось не знаю почему первой что мне не нравилось это то что здесь все маленькой даже туалет ну кровать хотя бы нормальная \nА второй то что здесь есть ребенок 2 лет и на него часто орали из за того что он ничего не понимал а обидно мне было из за того что у меня есть братик 3 лет и я приставил что бы была быть он здесь и это меня бесила\nТретий то что здесь очень наглый девочки наверное из за того что ино были старше всех кроме меня\n[16754] 2022-09-24 17:57 Миколай: Можешь про изолятор подробнее немного\n[16755] 2022-09-24 17:58 Миколай: И про маленьких\n[16756] 2022-09-24 17:58 Слава: А что там говорить я там просто валялся\n[16757] 2022-09-24 17:58 Миколай: Ну какие мысли тебя посещали\n[16758] 2022-09-24 17:58 Миколай: Эмоции\n[16759] 2022-09-24 17:58 Миколай: Преукрась\n[16760] 2022-09-24 17:59 Миколай: Повспоминай\n[16761] 2022-09-24 18:02 Слава: з найти когда в фильмах от одиночества сума сходят я когда на это смотреть мне казалось это бредовой но когда я сам оказался в такой ситуаций то голова начинает гудети и вдруг что-то охота делать и наоборот нечего не охото делать просто валяться\n[16762] 2022-09-24 18:03 Слава: Ещё здесь я впервые в жизни встретил дауна настоящего не когда не думал что хоть когда-нибудь их встречу ну вдруг встретил ну даун это тот который показывает на тебя пальцем и ржёт как лошадь\n[16763] 2022-09-24 18:04 Миколай: Вау, классный опыт\n[16764] 2022-09-24 18:04 Слава: Не особо\n[16765] 2022-09-24 18:05 Миколай: Я видел место где много даунов учится\n[16766] 2022-09-24 18:05 Миколай: Школа 28\n[16767] 2022-09-24 18:05 Миколай: Таска\n[16768] 2022-09-24 18:05 Миколай: Настоящие\n[16769] 2022-09-24 18:05 Слава: Аа подумал\n[16770] 2022-09-24 18:05 Слава: И где\n[16771] 2022-09-24 18:06 Миколай: Не помню, но там короче мероприятие было, и там много даунов там смотрело на него\n[16772] 2022-09-24 18:06 Миколай: Было давно уже\n[16773] 2022-09-24 18:06 Миколай: Не помню где\n[16774] 2022-09-24 18:06 Слава: На кого смотрели\n[16775] 2022-09-24 18:07 Миколай: А про них можешь дополнить?\n[16776] 2022-09-24 18:07 Миколай: Шоу какое-то\n[16777] 2022-09-24 18:07 Слава: Маленький ну нет нечего\n[16778] 2022-09-24 18:08 Миколай: А про то как со взрослыми происходит общение\n[16779] 2022-09-24 18:08 Миколай: С воспитателями\n[16780] 2022-09-24 18:08 Миколай: И др\n[16781] 2022-09-24 18:09 Слава: День рождения ни у кого ещё не была поэтому я не знаю\n[16782] 2022-09-24 18:09 Слава: Тихо мы же не только один ролик выпустим нужна ище истории\n[16783] 2022-09-24 18:09 Миколай: Там какие-то задания же дают по типу здорового сердца рисовать, про другие расскажи\n[16784] 2022-09-24 18:09 Миколай: Ну да\n[16785] 2022-09-24 18:09 Миколай: Ок\n[16786] 2022-09-24 18:09 Миколай: Ладна\n[16787] 2022-09-24 18:10 Слава: Ну меня не к чему не принуждали\n[16788] 2022-09-24 18:10 Миколай: Типа там взрослых вообще нет только ты и дети младше\n[16789] 2022-09-24 18:10 Миколай: А работники\n[16790] 2022-09-24 18:10 Слава: Есть\n[16791] 2022-09-24 18:11 Слава: Воспитатель\n[16792] 2022-09-24 18:11 Миколай: Понятно\n[16793] 2022-09-24 18:11 Слава: Врачи\n[16794] 2022-09-24 18:11 Миколай: Как с этими людьми происходит общение, я про это тогда спрашивал\n[16795] 2022-09-24 18:11 Слава: Однажды пока я был в изоляторе умения взял кровь целых четыре колбочки я испугался\n[16796] 2022-09-24 18:12 Миколай: Офигеть\n[16797] 2022-09-24 18:12 Слава: Нормально только иза своего слуха и шума детей я иногда нечего не слышал что они говорили\n[16798] 2022-09-24 18:13 Миколай: Понятно\n[16799] 2022-09-24 18:13 Миколай: Головой об проходы бился?\n[16800] 2022-09-24 18:13 Слава: Нет\n[16801] 2022-09-24 18:13 Миколай: Ок\n[16802] 2022-09-24 18:14 Слава: Следующий раз будет твоя история\n[16803] 2022-09-24 18:14 Слава: Ок\n[16804] 2022-09-24 18:14 Миколай: Ладно, пока что с этим поработаю, буду фото ждать\n[16805] 2022-09-24 18:14 Слава: Ок\n[16806] 2022-09-24 18:14 Миколай: От 5 до 10 с разных локаций\n[16807] 2022-09-24 18:14 Миколай: Ок\n[16808] 2022-09-24 18:15 Слава: Ты же в курсе что я так себе фотографии\n[16809] 2022-09-24 18:15 Слава: Поэтому много не жди\n[16810] 2022-09-24 18:15 Миколай: Ну ты постарайся\n[16811] 2022-09-24 18:15 Миколай: Ты постарайся сделать много, чтобы из них выбрать норм\n```\n\n### Версия 2 — 2022-09-25\n\nвселенная: вне вселенной (разбор «неясно») · окно w0005 · сообщения 16894–16897\n\n*что здесь: Уточнение детали: в изоляторе питался пять раз*\n\n\n\n```chat\n[16894] 2022-09-25 15:57 Миколай: Сколько раз в изоляторе ты питался?\n[16895] 2022-09-25 15:58 Миколай: Как тебе ава? Может изменить?\n[16896] 2022-09-25 15:58 Слава: 5 раз\n[16897] 2022-09-25 15:58 Миколай: Круто\n```\n\n### Версия 3 — 2022-09-25\n\nвселенная: вне вселенной (разбор «неясно») · окно w0005 · сообщения 16962–16977\n\n*что здесь: Литературная версия Миколая — цельный монолог для ролика; правки Славы: он хотел обратно в изолятор, обещано упомянуть*\n\n\n\n```chat\n[16962] 2022-09-25 17:02 Миколай: В итоге получается ты в садике месяц пробыл?\n[16963] 2022-09-25 17:02 Слава: Да\n[16964] 2022-09-25 17:02 Миколай: Ок\n[16967] 2022-09-25 17:48 Миколай: Всем привет, меня зовут Вячеслав, мне 15 лет, и как вы поняли по названию ролика, я сейчас нахожусь в садике, и нет, я тут не работаю, а живу вместе с детьми и прохожу тут обучение.\nНачну с того что я уже находился в этом садике до школы, как обычные дети. Этот садик формально для людей с ограниченными возможностями, я бы не приписал себя к данной касте людей, но я болею туберкулёзом, и для изоляции меня от общества не нашлось в моём городе другого места, кроме как этот детский сад. \nПервую неделю прибывания в этом садике я провел в изоляторе, совершенно один, без людей, синие стены, белый потолок, маленький унитаз, маленькая низкая раковина, точнее две раковины,  слава Богу был телевизор, окно, и на минуточку был телефон с розеткой возле кровати. Для кого-то эти условия покажутся райскими, да и мне по началу было достаточно комфортно, но через 3-4 дня я начал понимать, что чувствовали люди из тех фильмов и историй где они были совсем одни в запертой комнате по целым дням и неделям, у меня от такой атмосферы голова болела, не чувствуя ход времени я мог спать по 16 часов, для меня, а точнее для моего организма эти изменения были слишком резки и я понемногу сходил с ума, старался заниматься спортом, и развлекался как мог, пока не пережил эту неделю и не увидел людей, но об этом позже, в изоляторе врачи мне приносили поесть, ел я 5 раз в день, еда не то что не вкусная, но и вкусной её называть тяжело, главное что не голодаю, кстати когда врачи для анализов брали у меня кровь я испугался даже, они наполнили 4 колбочки моей кровью, и я почувствовал истощение, больше такого не было. Неделя эта была очень тяжёлая, и когда я вышел из изолятора мне стало очень легко и было так хорошо увидеть людей, но эта лёгкость продлилась не долго, в общении с ними у меня было много проблем, ну и основная проблема это разница в возрасте, интересах и ценностях. Вот именно тогда я непосредственно находился в садике, и помимо рабочего персонала я являюсь самым старшим в нём, поэтому мне было не очень комфортно. В основном все мальчики тут младше 10 лет, а самые старшие девочки, младше меня на год, общаться с ними сложно, у них очень навязчивое поведение, они слишком шумные, и энергичные. В отличии от меня, ведь я привык жить размеренной жизнью. Воспитатель за нами следит, даёт задания, приходят учителя к нам, дают уроки, но я почти не слышу из-за постоянного шума детей и плохого слуха, раз в день можно выходить на площадку которая располагается, на территории школы, есть мяч, мы пытаемся убить время играя с ним. Тут садике есть двух годовалый ребёнок, он часто плакал, на него часто орали, мне было за него очень обидно, у меня есть брат, ему 3 года, и мне казалось как будто они орут на него это очень  раздражало. Кровати все расположены в одной комнате, благо они нормального размера. Кстати ещё здесь, в первые я встретил настоящего человека болеющего синдромом дауна, он показывал прямо в лицо пальцем и смеялся очень жутко. \n На этом моменте сегодня я заканчиваю историю о моём прибывании в детском садике, и когда выйдет этот ролик скорее всего я уже буду в другом городе для лечения и буду накапливать опыт чтобы рассказать вам новую историю.\n[16968] 2022-09-25 17:52 Слава: В другом городе ?\n[16969] 2022-09-25 17:52 Слава: Стеклазовод это не город\n[16970] 2022-09-25 17:53 Миколай: Ну типа я в начале сказал что в  нашем городе больше ничего другого кроме садика не было\n[16971] 2022-09-25 17:53 Миколай: Поэтому пришлось написать так, чтобы вопросы отпали\n[16972] 2022-09-25 17:53 Слава: Ясно\n[16973] 2022-09-25 17:54 Слава: Ну норм\n[16974] 2022-09-25 17:54 Слава: Только когда я попал к ко всем я хотел обратно в изолятор\n[16975] 2022-09-25 17:54 Миколай: Ок\n[16976] 2022-09-25 17:54 Миколай: Я упомяну это\n[16977] 2022-09-25 17:55 Слава: Ок\n```\n\n## Неясности\n\n- (w0005) Обещана следующая история («следующий раз будет твоя история», «расскажу вам новую историю») — в окне её нет</div>"}];</script>
