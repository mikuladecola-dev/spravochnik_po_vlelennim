иколай: Раньше отправлял\n[4985] 2022-04-19 20:47 Слава: Ок\n[4986] 2022-04-19 20:48 Слава: Это выучу\n[4987] 2022-04-19 20:48 Миколай: Ок\n```\n\n### Версия 2 — 2022-04-20\n\nвселенная: неясно (не определено) · окно w0002 · сообщения 5027–5031\n\n*что здесь: Переделанная версия (М: «Переделал»): добавлены хрип и стоны змея, тело выносит волнами на берег, оно смердит на вкус и запах, герой немой идёт копать на 6 футов вглубь, чтобы змей не начал разлагаться*\n\n\n\n```chat\n[5027] 2022-04-20 19:03 Миколай: Норм, или хуйня?\n[5028] 2022-04-20 19:05 Слава: Норм\n[5030] 2022-04-20 19:41 Миколай: О, как же красен день в аду,\nЯ всё иду, иду, иду\nПройдя все 9 этажей\nПередо мной рогатый змей\nС лицом козла.\n\nУроборосом звался он,\nПо глупости кусал свой хвост\nИ это было так смешно\nЯ не сдержался и заржал\n\nОт несдержанья моего\nПроклятие змея снизошло,\nМоим устам не суждено открыться вновь\nУ змея покосилась бровь.\nОн стал без удедержно хрипеть, стонать.\n\nТак, умер он, упав в кипящий ад\nСварился, волны привели его на берег\nНа вкус ужасен он, на запах, жуть\nИ я без слов нужду имею\nЗакопать его сейчас скорее.\n\nНачнёт он разлагаться,\nВесь ад, будет как ад\nЯ так прожить нормально не смогу\nПойду 6 футов вглубь копать.\n[5031] 2022-04-20 19:41 Миколай: Переделал\n```\n\n### Версия 3 — 2023-07-25\n\nвселенная: неясно (не определено) · окно w0016 · сообщения 47404–47411\n\n*что здесь: Первое и единственное появление — внутри текста стихотворения.*\n\n\n\n```chat\n[47404] 2023-07-25 20:23 Слава: Помнишь стих про девять этажей\n[47405] 2023-07-25 20:23 Миколай: Ага\n[47406] 2023-07-25 20:23 Миколай: О, как же красен день в аду,\nЯ всё иду, иду, иду\nПройдя все 9 этажей\nПередо мной рогатый змей\nС лицом козла.\n\nУроборосом звался он,\nПо глупости кусал свой хвост\nИ это было так смешно\nЯ не сдержался и заржал\n\nОт несдержанья моего\nПроклятие змея снизошло,\nМоим устам не суждено открыться вновь\nУ змея покосилась бровь.\nОн стал без удедержно хрипеть, стонат
