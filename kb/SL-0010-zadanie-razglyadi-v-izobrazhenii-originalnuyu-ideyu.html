нт реализации и объясняет замысел*\n\n\n\n```chat\n[155686] 2024-04-10 13:27 Миколай: Че будешь творить с этой штукой\n[155696] 2024-04-10 13:59 Миколай: Здравствуй, Коля! Очень рада ,что ты написал\n[155697] 2024-04-10 13:59 Миколай: Спасибо, что помнишь!\n[155698] 2024-04-10 13:59 Миколай: Завтра у нас диспут по буллингу. Поэтому, у нас не будет времени и возможности с вами поговорить. А вообще хотелось бы конечно встретиться\n[155699] 2024-04-10 13:59 Миколай: А вы не можете поделиться своим опытом сдачи экзамена, продолжения учебы, поступления?\n[155700] 2024-04-10 13:59 Миколай: Вы , наверное , после обеда можете. Может договоримся\n[155701] 2024-04-10 13:59 Миколай: Забил не хочешь? Или стесняешься, а может идей нет?\n[155702] 2024-04-10 14:00 Слава: Говорить будешь ты\n[155704] 2024-04-10 14:01 Миколай: Оке оке, но ты про поступление пару слов тож скажешь\n[155705] 2024-04-10 14:01 Миколай: Ну или мне сначала с я за тебя 😑\n[155706] 2024-04-10 14:01 Миколай: Ну таке шо\n[155707] 2024-04-10 14:01 Слава: Забил\n[155708] 2024-04-10 14:01 Слава: Не хочу\n[155710] 2024-04-10 14:02 Слава: Как то не охото\n[155711] 2024-04-10 14:02 Миколай: Оке\n[155712] 2024-04-10 14:02 Миколай: Тогда я кидаю свою идею\n[155713] 2024-04-10 14:02 Слава: Кидай\n[155714] 2024-04-10 14:02 Миколай: Напиши че понял из того что я намалякал\n[155716] 2024-04-10 14:03 Миколай: А то думаю трудно для понимания нарисовал\n[155717] 2024-04-10 14:03 Слава: Извини я вообще ничего не понял\n[155718] 2024-04-10 14:04 Слава: Типо метеорит падает\n[155719] 2024-04-10 14:07 Миколай: Да, я так и думал, просто я на многих деталях остановился и в итоге ничего не раскрыл. \n\nПо сути пейзаж такой: девушка поднимает ткань с дороги и держит над головой чтобы пройти под ней. На периферии 2 камня(вместо носков) дальше идёт линия горизонта по середине, линия перспективы сводится к большому дереву за которым расположена гора. На левой стороне от дерева огромное облако, на правой летучий змей)\n\nАххахахахах\n[1
