<script>const BASE="../";const DOCNAME="пристав";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># пристав\n\n*персонаж* · вселенные: игра бога\n\n## Навигация\n\n- (w0030) Персонаж С: пристав — богатый, наглый, высокомерный. С спрашивает, какая у него должна быть способность, М пишет свой разбор двух типов богатства, а потом С сообщает уже готовое решение: окаменение и заражение, а третью способность добавит позже по сюжету.\n\n## Связано с\n\nбанкротство по желанию, окаменение и заражение\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-04-05\n\nвселенная: игра бога (по дате объявления) · окно w0030 · сообщения 154291–154291\n\n*что здесь: Заявка: пристав богатый, наглый, высокомерный — вопрос о подходящей способности.*\n\n\n\n```chat\n[154291] 2024-04-05 22:38 Слава: Вот пристав богатый наглый высокомерный \nИ какая у него должна быть способность\n```\n\n### Версия 2 — 2024-04-06\n\nвселенная: игра бога (по дате объявления) · окно w0030 · сообщения 154298–154300\n\n*что здесь: Разбор М (сделан им самим, не нейронкой): два варианта богатства — заработал сам или мажор. В первом случае идёт по головам, имеет непреложные принципы, горд достигнутым статусом, ничего не боится, потому что защищён деньгами и способностью сразу; лучшая защита — нападение, поэтому способность может делать человека банкротом по желанию, причём она давно обнародована и её боятся. Во втором случае способность к характеру не относится: передача мыслей кому хочет или мгновенный реген гематом и мелких ссадин.*\n\n\n\n```chat\n[154298] 2024-04-06 09:37 Миколай: Ну есть 2 варианта его богатства:\n\n1. Он сам всё заработал\n\n2. Он мажор и деньги ему легко достались и были с рождения\n\nВ первом случае причина наглости в том, что он идёт по головам чтобы сохранить своё состояние и расширить его, у него есть свои принципы и убеждения, которые он ни за, что не нарушит и не позволит другим. Ещё он высокомерный и как я понял причина в его приобретённых филках и статусе, он горд тем что смог добиться этого положения. Он может себе позволить подобное поведение, ибо не переживает за последствия а значит он чувствует себя под защитой либо денег, либо способности, но пускай будет всё сразу. Лучшая защита это нападение, может тогда его способность будет ну допустим делать человека банкротом по желанию(я хотел написать убивать по желанию😅) и он уже давно обнародовал эту способность, о ней все знают и боятся этого.\n\nА, с другим типом богатства способность точно не придаёт ему этих фич, поэтому мож быть совершенно любая, ну пускай будет передача мыслей кому хочет или реген мгновенный, от гематом и других садин небольших\n[154299] 2024-04-06 09:37 Миколай: Попробовал провести анализ\n[154300] 2024-04-06 09:37 Миколай: А то не особо умею я способности давать кому-то учитывая критерии\n```\n\n### Версия 3 — 2024-04-06\n\nвселенная: игра бога (по дате объявления) · окно w0030 · сообщения 154331–154338\n\n*что здесь: Решение С: у персонажа окаменение (усиление себя и повышение защиты) и заражение (заражать окаменением и контролировать заражённых); дальше по сюжету добавится ещё одна способность, необязательно сочетающаяся с окаменением.*\n\n\n\n```chat\n[154331] 2024-04-06 14:28 Слава: Вообще этот персонаж будет иметь способность окаменения( то бишь усиливать себя и повышать защиту ) и заражения ( то бишь заражать окаменением и контролировать их) но дальше по сюжету я хочу дать ему ещё способность не обязательно что бы она сочеталось с окаменением\n[154332] 2024-04-06 14:29 Миколай: Слушай\n[154333] 2024-04-06 14:29 Миколай: А можно\n[154334] 2024-04-06 14:30 Миколай: Я снова попробую в нейронку кинуть?\n[154335] 2024-04-06 14:30 Миколай: А то идей нету\n[154337] 2024-04-06 14:30 Слава: Да можешь пожалуйста\n[154338] 2024-04-06 14:31 Миколай: &lt;мысли&gt;\nУчитывая, что персонаж уже обладает способностями окаменения и заражения, дополнительная суперспособность может быть выбрана исходя из следующих соображений:\n\n1. Усиление существующих способностей. Новая способность может дополнять или усиливать окаменение и заражение, открывая новые возможности для их применения.\n\n2. Контраст и баланс. Способность может быть противоположна или отличаться по природе от окаменения, создавая интересную динамику и внутренний конфликт персонажа.\n\n3. Расширение возможностей персонажа. Новая способность может давать персонажу преимущества в других областях, не связанных напрямую с окаменением и заражением.\n\n4. Развитие сюжета и темы. Способность может быть связана с основными темами и идеями истории, добавляя глубины и смысла в развитие персонажа.\n\nПринимая во внимание высокомерие и наглость персонажа, а также его богатство, я думаю, что подходящей дополнительной способностью может быть телекинетическое управление драгоценными камнями и металлами. Это отразит его одержимость богатством и статусом, а также добавит новые тактические возможности в бою.\n&lt;/мысли&gt;\n\n&lt;ответ&gt;\nСуперспособность: Кристаллокинез (Crystallokinesis)\n\nОпределение: Способность телекинетически манипулировать кристаллическими структурами, такими как драгоценные камни и металлы. Персонаж может контролировать движение и форму кристаллов, создавать из них конструкции и использовать как оружие. Например, он может создать барьер из алмазов, выпустить шквал рубиновых снарядов или обездвижить противника, покрыв его тело слоем золота.\nЭта способность тематически перекликается с окаменением и отражает одержимость персонажа богатством и статусом. Однако, в отличие от защитной природы окаменения, кристаллокинез более агрессивен и позволяет активно нападать и контролировать поле боя.\nПотенциальным недостатком этой способности может быть её зависимость от наличия кристаллических материалов поблизости. Персонаж должен либо носить с собой запас драгоценных камней, либо искать их в окружении. Это добавляет элемент стратегии и ограничений в использовании силы.\n&lt;/ответ&gt;\n```\n\n## Неясности\n\n- (w0030) Вселенная не названа; неясно, из той ли он серии персонажей, что шла в w0029. Третья способность обещана, но не названа.</div>"}];</script>
