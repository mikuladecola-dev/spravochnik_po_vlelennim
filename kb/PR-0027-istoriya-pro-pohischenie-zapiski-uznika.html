<script>const BASE="../";const DOCNAME="История про похищение (записки узника)";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># История про похищение (записки узника)\n\n*2024-08-17 · монстры · Целиком в двух сообщениях подряд, от первого лица. Начало — похищение фургоном, конец — обращение узника к похитителю через найденный телефон. Обсуждение и разбор идут дальше отдельно*\n\n---\n\n\n\n```chat\n[220167] 2024-08-17 22:20 Слава: Я не плохой человек. Ну или как минимум не настолько плох чтобы все это заслужить. \n\nВ один день который был как всегда. Возвращаясь с работы, кем я работаю не важно, так вот возвращался я с работы пешком. Машине у меня не было как не как только недавно на работу пошел, а на микрике ездить, ну нет лучше свежим воздухом подышать нежели, как в консервный банке торчать в микрике. Иду я уже ночью, ну то бишь людей поблизости нету. Как вдруг из не откуда выезжает фургон. Ну я сразу понял, что ничего хорошо это не претвращает и ускорил шаг. И здесь я сам не заметил как они близко подъехали. Схватили, мешок на голову, телефон в окно, укол в шею. Именно с такой скоростью для меня все произошло. Очнулся я уже в темной комнате 5 на 5 метров, без дверей и окон, высота метра 4, и как я понял на потолке какая та крышка или люк. Как только очнулся конечно я начал кричать, что то  про меня будут искать, и кто вы? И все в этом духе. Про орав примерно 2 часа, ну по моим под счётом, определить время в этом вечно темным помещения невозможно. И конечно же я выдохся и от без прорывных 2-х часовых криков и от стресса. И меня начал клонить в сон. На удивления я быстро уснул, хотя там было прохладно да и на полу спать вот вообще не камельво. Проснулся я в яркой белой комнате, в которой казалось, что свет бьёт со всех сторон . Ну и конечно же я проведя в темноте 2 часа, мягко говоря офигел от резкого света в глаза. Как вы уже догадались я был связан, привязали меня к стулу который кажись, был бит в пол, потому что сколько я не скакал на нем он ни миллиметр не двинулся, как я вообще был связан? Связан были ноги туловища и голова с одной рукой. И нет связан я был накрепко и свой изнеможенной рукой ничего бы сделать не смог. Сука даже голову не повернуть, ну даже так я затылком чувствовал, что сзади кто то стоит. А и кстати впереди меня стол. С стаканом воды и каким-то супом. Я не до конца понял так как не хавал. А что же я делал. Ну попробуй те догадятесьсе . Ну догадались. И правильно наверное догадались. Я кричал и угрожал и пытался себя распутать и пытался скакать и брал стакан с тарелкой и кидаль в зад себя. Правда не знаю попадали или нет. Надеюсь да. Ну меня такого буйного сразу усыпили укол в шею.  Блин после этого у меня вся шея в дырках был как у наркомана рука, даже сейчас болит.и в итоге я снова проснулся в темной комнате, где ничего нет, и кажется в этот раз они меня скинули иначе почему все тело болит словно с падения 4 метров. Очухавшишь я начал по маленькую мыслить и думать. Почему я? Что я сделал? Кто они такие? Один ли я ? Будит ли меня искать ? И т.п. И как бы что мне дальше делать, ну вот что я подосмыслел, какая нафиг разница почему я, что я сделал, с большой вероятностью я просто случайно попал сюда, просто увидел вон паренька гуляющего ночью один так почему бы не схватить. А вот кто они, или что им надо было интересная поразмыслить. Ну конечно ответа Я так не нашел так как ничего и не знал, поэтому я ждал пока меня снова увидят в ту комнату, что бы я мог задать интересующий меня вопросы. И сука снова вырубился под мысли в полной темноте. И снова очутился в белой комнате со столом. Ну здесь я не растерялся и начал задавать корректный вопрос, ну они словно глухие не слушали меня. Стояли сзади ну или стоял. Я не знаю сколько их там было. И что мне делать они не отвечают. Ну здесь как бы еда передо мной, а я между прочим по ощущением 2 дня ничего не жрал. Ну решил попробовать. Вода как вода, а о менеджер, где в контактах был только один человек и это ты . И вот сука я сейчас все суда записываю, для чего спросишь ты для того что бы собраться с мыслями, ну и успокоиться. Я уже понимаю кому пишу, это ведь ты запер меня здесь не так ли. И нет не надо ни на что отвечать просто выпусти и для полиция я придумаю какую нибудь отговорку. Ничто не связанной с тобой. Просто прошу выпусти. Я большого не прошу. Я продолжу писать даже если ты не ответишь ведь я вижу ты читаешь. Надеюсь мы поймём друг друга и ты пожалуйста отпустишь меня. Я готов на все хоть полностью сожрать того рыба человека. Да сука хоть человека. Я СДЕЛАЮ ВСЕ\n```</div>"}];</script>
