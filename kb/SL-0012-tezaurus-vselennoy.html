73113] 2024-05-25 13:51 Слава: Но можно\n```\n\n### Версия 2 — 2024-05-25\n\nвселенная: Цветной мир (объявлено) · окно w0035 · сообщения 173114–173129\n\n*что здесь: Определяются с опорой: берут концепцию Миколая (абакра); Слава просит закрепить сообщение со списком персонажей, чтобы не забывать.*\n\n\n\n```chat\n[173114] 2024-05-25 13:52 Миколай: И вот ещё вопрос\n[173115] 2024-05-25 13:52 Миколай: На что в таком случае опираться\n[173116] 2024-05-25 13:52 Миколай: На какую концепцию\n[173117] 2024-05-25 13:52 Миколай: Ну типа ты перечислял разные типы способностей\n[173118] 2024-05-25 13:52 Миколай: Мы получается мою берём?\n[173119] 2024-05-25 13:53 Миколай: Где абакра, все дела\n[173120] 2024-05-25 13:53 Слава: Дадада\n[173121] 2024-05-25 13:53 Миколай: .\n[173122] 2024-05-25 13:53 Миколай: Кстати, знаешь как я это название придумал?\n[173123] 2024-05-25 13:53 Слава: Возможно будущем изменим но пока оставим\n[173124] 2024-05-25 13:54 Слава: Название\n[173125] 2024-05-25 13:54 Миколай: Да, ошибся\n[173126] 2024-05-25 13:55 Слава: И как придумал\n[173127] 2024-05-25 13:56 Миколай: Я короче в одном тгк пока думал о концепции увидел пост про крабовые чипсы. Быстро начал говорить, мол хочу краба. Много раз. Краба, краба, краба, абакр, абакр, абакра. Абакра, да так и назову\n[173128] 2024-05-25 13:58 Слава: Энергет, прятки, закон, петля, феникс, Тен, волк, дракон, ци, имитатор, спартанец, вампир, драгоценность, бессмерт, жук, лёд, Дилан, граница, солнце\n[173129] 2024-05-25 13:58 Слава: Надо потихоньку записывать а то я по тихонько забываю\n```\n\n## Неясности\n\n- (w0035) Сам тезаурус в окне так и не составлен.</div>"}];</script>
