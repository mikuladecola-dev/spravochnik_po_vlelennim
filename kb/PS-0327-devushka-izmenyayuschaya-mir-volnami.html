<script>const BASE="../";const DOCNAME="Девушка, изменяющая мир волнами";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Девушка, изменяющая мир волнами\n\n*персонаж* · вселенные: Оам\n\n## Навигация\n\n- (w0112) Третья из трёх сильнейших, на стороне людей: сильнейшая в правительской организации, её способность — волны (та же, что у &#x27;фантазёра с волнами&#x27;), одна из немногих, кто может изменять законы мира.\n\n## Связано с\n\nПравителская организация\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-12-06\n\nвселенная: Оам (объявлено) · окно w0112 · сообщения 393286–393290\n\n*что здесь: В перечне организаций: сильнейшая в правительской организации — девчонка, которая может изменять мир волнами*\n\n\n\n```chat\n[393287] 2025-12-06 17:36 Слава: Коты. Их 9.они сильнеший ( уникальный особенности, я для них не придумал помоги) и вот они есть в каждую эпоху. Если один кот умрёт родиться новый и всегда их будет 9. Они вообще никуда не вмешиваться \n\nАпостолы 21 вторая по силе раса на земле (опять раса, в мире есть просто индивиды который могут быть сильными). Апостолы очень часто устраивают без порядок разрушая укорененый баланс между всеми. Из-за них по итогу в современном мире раскроется существования тёмный изнанки но это будет в будущем в будущем \n\nНу и дальше расы и организации который равны по силе с друг другом. \n\nДети мирового древа. Живут в мести которой мутировала от Оам. \n\nПроротой каменный челике. Владеют преступное организацию. Некий союз с апостолами \n\nАзуриэль. Как народ что прячется от цивилизации. Но некоторый всё же живут среди людей \n\nГруппировка сестры ( который теперь будет дочерью Имитатора. И я не знаю какие у неё будет цель)\n\nПравителская организации по контролю всех этих. Сильнейшая там девченка что может изменять мир волнами. \n\nЦерковь с паладинами ( мёртвыми рыцарями которых оживил один челик, для верующих) паладины до хрена сильный но их ней движения предсказуемый. Они больше как роботы с повторяющими движениями. \n\nОрганизация челика который и оживил паладинов. Давай челика назовём Виктор. Ну и Виктор верит в красный ток что оживляет людей. И он многих оживил, но разум так и не смог в них оживить \n\nПернатые (Серафим, Пераги и кто-нибуть ещё) \n\nТак же появиться орден предназначеный для убийства котов.\n\nВампиры просто аристократы. \n\nАскизы. Матка Аскизов стало предметом веры для какой-то верологий.\n[393288] 2025-12-06 17:36 Слава: Ну и Аскизы. Я не знаю где они живут\n[393289] 2025-12-06 17:36 Слава: Давай вспомним\n[393290] 2025-12-06 17:36 Слава: В нашем мире Оэм уже существует много сторон для конфликта\n```\n\n### Версия 2 — 2025-12-06\n\nвселенная: Оам (объявлено) · окно w0112 · сообщения 393299–393302\n\n*что здесь: Названа третьей из трёх сильнейших, на стороне людей; способность взята у &#x27;фантазёра с волнами&#x27;; может изменять законы мира; сама она не продумана*\n\n\n\n```chat\n[393299] 2025-12-06 17:46 Слава: И также в будущем у него появиться девушка для стабилизации его нарцисцеческого характера\n[393300] 2025-12-06 17:48 Слава: 3\nи  на стороне людей девушка. Опять же я ее не продумал. Помнишь фантазера с волнами. Вот её способность. По сути она одна из немногих, что может изменять законы мира.\n[393301] 2025-12-06 17:48 Слава: А теперь злодей\n```\n\n## Часть чего\n\nПравителская организация\n\n## Неясности\n\n- (w0112) Имя и характер не придуманы</div>"}];</script>
