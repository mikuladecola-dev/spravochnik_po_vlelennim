const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Власть\n\n*способность* · вселенные: Оам\n\n## Навигация\n\n- (w0112) Способность апостола Графа: контроль всего, что находится в определённом радиусе.\n- (w0120) Не телекинез: область, в которой Граф контролирует абсолютно всё, вплоть до температуры. Дефект — вместе с контролем он получает всю информацию об области до атома, что плавит мозг и не даёт держать власть долго. Отсюда три способа применения.\n\n## Связано с\n\nГраф, Плёнка сверхлюдей\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-12-06\n\nвселенная: Оам (объявлено) · окно w0112 · сообщения 393297–393300\n\n*что здесь: Заявлена: власть — контроль всего в радиусе, силы хватает, чтобы разнести гору*\n\n\n\n```chat\n[393297] 2025-12-06 17:42 Слава: 1 это нуар из котов, он один из сильнейших\nВообще грубо говоря будет 3 сильнейших. \nИ вот нуар один из них. Как и в семи островав, так и здесь я не смог придумать ему характер. Поможешь?\n[393298] 2025-12-06 17:45 Слава: 2 это апостол Граф (опять отсылка на семь островов) \nОн высокомерный и беспечный апостол, что веселиться. \nУ него своя банда ( просто для развлечения) грубо говоря он король преступного мира \nЕго способность власть. Контроль всего, что есть в определенном радиусе. Достаточно силён, чтобы разнести гору, плюсом он быстрейший апостол ( хотя этот титул носит другой Апостол. Ну по факту он быстрее)\n[393299] 2025-12-06 17:46 Слава: И также в будущем у него появиться девушка для стабилизации его нарцисцеческого характера\n[393300] 2025-12-06 17:48 Слава: 3\nи  на стороне людей девушка. Опять же я ее не продумал. Помнишь фантазера с волнами. Вот её способность. По сути она одна из немногих, что может изменять законы мира.\n```\n\n### Версия 2 — 2026-06-02\n\nвселенная: неясно (по дате объявления) · окно w0120 · сообщения 487010–487012\n\n*что здесь: объяснение сути и дефекта — информационная перегрузка, ограничение по времени удержания*\n\n\n\n```chat\n[487010] 2026-06-02 09:12 Слава: Короче Нуар. \nМожет управлять собственное кровью, а из-за регенерация он может вырабатывать эту кровь дофига. \nСлова. Он может отдавать приказы и люди повинуются. Не особо действительно против сильных противников. Да и он не может сказать убить себя или навредить себе, инстинкт самосохранения просто не даст этого сделать. \nМолния. Ну здесь говорить особого не чево просто плюс разрушительный навык. \n\nТьма. Ну он просто пропитывает всё своё тьмой. Всё воздух, землю, воду. Всё что не имеет инстинктов или разума попадають под воздействия тьмы  ( то есть даже деревья и трава превращается во тьму). И эту тьму Наур может полностью контролировать и перемещаться в ней. \nРадиус его области тьмы примерно 3 км. \nИ кстати в области тьмы способности нуар становяться мощнее, а способности противников слабее. Ну и всё.\n[487011] 2026-06-02 09:13 Слава: Граф. Я говорил что его способность власть ну толком не описал ее. Ты наверное думал что это просто телекинез. И сейчас я тебе всё объясню\n[487012] 2026-06-02 09:18 Слава: Во первых под властью имеется виду область, в который Граф всё контролирует. Абсолютно все. \nИ так сказать дефект. В данное область где Граф использует власть. Он также получает всю информацию. Информацию до атома, до мельчайшего движения он получает абсолютно всю информацию о данное области. Представляешь как это напрягает мозг. Поэтому он не способен использовать власть очень долго. Потому что у него просто мозги расплавиться. Поэтому у него есть три способа использования власти.\n```\n\n### Версия 3 — 2026-06-02\n\nвселенная: неясно (по дате объявления) · окно w0120 · сообщения 487013–487013\n\n*что здесь: первый способ: область около 10 метров, полный контроль всего внутри, включая температуру; удерживать очень сложно*\n\n\n\n```chat\n[487013] 2026-06-02 09:20 Слава: Первый \nПросто покрыть область властью. Область примерно 10 метров. Ну и все. В данное области он абсолютно всё контролирует. Даже температуру. Ну и он также получает дохрена информацие. Данные способ удерживать очень сложно.\n```\n\n### Версия 4 — 2026-06-02\n\nвселенная: неясно (по дате объявления) · окно w0120 · сообщения 487014–487014\n\n*что здесь: второй способ: власть плёнкой поверх собственного тела — усиление силы и полёт, меньше информации, но плохая защита от быстрых атак*\n\n\n\n```chat\n[487014] 2026-06-02 09:25 Слава: Второе \nЭто просто покрыть властью своё тело плёнкой. То бишь он получает всю информацию о своём теле. И так же поверх получает физическая увеличения силы и полета. Потому что он полностью контролирует своё тело и может составить его летать или усилить властью. \nИ вроде бы хорошо. Дохрена силы и информацию получаемые куда меньше. \nНо данные способ является плох именно в защите. Потому что ты просто можешь не успеть защититься если атака будет быстрое. \nНо если власть у тебя будет областью 10 метров то ты успеш остановить атаку. Схватить человека не давая ему вообще двигаться. Или просто уклониться от атаки.\n```\n\n### Версия 5 — 2026-06-02\n\nвселенная: неясно (по дате объявления) · окно w0120 · сообщения 487015–487016\n\n*что здесь: третий способ как дополнение: область власти 1 метр, отделённая от себя, на расстоянии до 1 км; сам Граф в это время беззащитен, поэтому только в комбинации*\n\n\n\n```chat\n[487015] 2026-06-02 09:28 Слава: Третий  способ это просто дополнение которое используется в комбинации с первым или со вторым.\nЭто создания обсласти власти отдельно от себя. Создать область власти 1 метр. Но на расстоянии от себя на 1 км. И контролировать всё что находиться в этой власти. Ну и также получать информацию об о всем в данное области. \nПочему его используют как дополнение. Потому что сам Граф в это время останется беззащитным. И поэтому его надо совмещать с другим вариантам.\n[487016] 2026-06-02 09:29 Слава: Ну изб\n```\n\n### Версия 6 — 2026-06-02\n\nвселенная: неясно (по дате объявления) · окно w0120 · сообщения 487170–487175\n\n*что здесь: ограничение условностью: из-за плёнки сверхлюдей Граф не может просто раздавить сильного противника или остановить ему сердце*\n\n\n\n```chat\n[487170] 2026-06-02 12:01 Слава: Условности \nНаур больше не превращает воздух во тьму. Он превращает только твёрдые и жидкие вещества. \nУ сверхлюдей есть как бы плёнка что защищает от воздействия других способности. Чем сильнее сверхчеловек тем больше плёнка. \nПоэтому граф против особо сильных не может раздавить их просто или остановить сердца.\n[487171] 2026-06-02 12:02 Слава: Это я нейри кинул\n[487172] 2026-06-02 12:02 Слава: Ну ты тоже почитай\n[487173] 2026-06-02 12:03 Миколай: https://telegra.ph/balans-06-02-3\n[487174] 2026-06-02 12:04 Слава: Плёнка есть у всех и развивается она с возрастом. То есть с психическом росте. Ну это у обычных людей. \nУ сверхлюдей способные её чувствовать. И поэтому они прокачивають её с помощью тренировок, а не психического роста\n[487175] 2026-06-02 12:06 Слава: Ну это не плохая пищя для размышлений. Придумаю способность и тебе скину. И ты идей кидай. Ок?\n```\n\n## Часть чего\n\nГраф\n\n## Неясности\n\n- (w0112) Радиус и ограничения не заданы</div>"}];</script>
