const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Оазис\n\n*мир* · вселенные: 7 островов\n\n## Навигация\n\n- (w0041) Остров-город Имитатора на обычной земле: мирные жители, вся власть у защитника, он же отвечает за политику. М подписывает ему режим конституционной монархии.\n- (w0042) Остров-убежище, защитник — Имитатор. В окне прорабатывается подробно: назначение острова, форма правления, география, климат, экономика, развлечения. Авторы договариваются строить острова по одному, начиная с Оазиса.\n- (w0043) В этом окне — источник ресурсов для подводного острова: своих ресурсов на дне нет, железо, газ, нефть и прочее берут с оазиса, отношения очень развитые экономические и ресурсные.\n\n## Связано с\n\n7 островов, 7 островов и их защитники, Имитатор, Остров на дне океана (сфера), Режимы правления островов, Слияние двух измерений\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-07-03\n\nвселенная: 7 островов (объявлено) · окно w0041 · сообщения 194774–194776\n\n*что здесь: Назван первым в списке островов, защитник — Имитатор.*\n\n\n\n```chat\n[194774] 2024-07-03 18:58 Слава: 7 островов \n1 оазис ( Имитатор )\n2 ??????( Нуар ( челек с растворением личности ))\n3 асгар ( Избранный ( ты его не знаешь))\n[194775] 2024-07-03 18:59 Слава: Остров это город ну или страна\n[194776] 2024-07-03 18:59 Слава: 3 есть\n```\n\n### Версия 2 — 2024-07-03\n\nвселенная: 7 островов (объявлено) · окно w0041 · сообщения 194843–194844\n\n*что здесь: Уточнение: остров Имитатора расположен на обычной земле (в отличие от небесного Асгара).*\n\n\n\n```chat\n[194843] 2024-07-03 19:28 Слава: У имитатор остров на земле обычной\n[194844] 2024-07-03 19:29 Миколай: это че за острава\n```\n\n### Версия 3 — 2024-07-03\n\nвселенная: 7 185] 2024-07-04 18:49 Миколай: ну в пизду логику\n[196186] 2024-07-04 18:49 Миколай: он будет как путин\n[196187] 2024-07-04 18:50 Миколай: в общем, там будет 6 округов\n[196188] 2024-07-04 18:50 Миколай: в каждом свой правитель\n[196189] 2024-07-04 18:50 Слава: Щя подожди\n[196190] 2024-07-04 18:50 Миколай: оке\n[196191] 2024-07-04 18:51 Слава: Давай будем сначала один остров потом другой \nТипо один полностью построить а потом другие\n[196192] 2024-07-04 18:51 Слава: 1 оазисе\n[196193] 2024-07-04 18:51 Слава: Так как там любимый имитатор\n[196194] 2024-07-04 18:52 Миколай: не, оазис это типо страна и внутри этой страны есть округа, это типо США, где дохуя штатов\n```\n\n### Версия 6 — 2024-07-04\n\nвселенная: 7 островов (по дате объявления) · окно w0042 · сообщения 196195–196221\n\n*что здесь: смысл слова оазис для авторов (мирное место, рай, как в постапокалипсисе); география: много гор и лесов, реки в каждом городе, города небольшие; развитая экономика, но не хватает газа/нефти, поэтому сотрудничают с другими странами*\n\n\n\n```chat\n[196195] 2024-07-04 18:53 Миколай: ну в общем так, щас вопрос, мы работаем дальше по оазису?\n[196196] 2024-07-04 18:53 Миколай: а то чуток недопон\n[196197] 2024-07-04 18:53 Миколай: пон\n[196198] 2024-07-04 18:53 Слава: Да\n[196199] 2024-07-04 18:53 Миколай: чтоож\n[196200] 2024-07-04 18:54 Миколай: че вообще в твоём понимании оазис\n[196201] 2024-07-04 18:54 Миколай: как остров\n[196202] 2024-07-04 18:54 Миколай: как территория\n[196203] 2024-07-04 18:54 Слава: Оазисис\n[196204] 2024-07-04 18:54 Миколай: его примерная география\n[196205] 2024-07-04 18:54 Миколай: ну епта, я не знаю что такое оазис\n[196206] 2024-07-04 18:55 Слава: Мирное место\n[196207] 2024-07-04 18:55 Слава: Рай\n[196208] 2024-07-04 18:55 Миколай: в моём понимании это вода на суше\n[196209] 2024-07-04 18:55 Слава: И т.п.\n[196210] 2024-07-04 18:55 Миколай: а, я понял, это Скандинавия\n[196211] 2024-07-04 18:55 Слава: Ну постапокалипсис часто смотрю и слушаю и
