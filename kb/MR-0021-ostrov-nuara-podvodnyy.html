const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Остров Нуара (подводный)\n\n*мир* · вселенные: 7 островов\n\n## Навигация\n\n- (w0041) Остров под водой: тьма Нуара держит воду барьером. Разбирается снабжение — нужны порты связи с внешним миром, транспорт и еда, а без солнца еды не будет.\n- (w0043) Подводный остров Нуара: сфера на дне океана в глубокой яме, внутри воздух и вода, снаружи — толща океана. Всё окно занято разработкой его устройства: воздух, давление, барьер, трубы, ресурсы, мусор.\n\n## Связано с\n\nЗащитник, Мета-люди, Нуар, Оазис, Режимы правления островов, Рыба-люди, Солнышко, Трубы сферы, Тьма, Тьма Нуара, Человек со способностью солнца\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-07-03\n\nвселенная: 7 островов (объявлено) · окно w0041 · сообщения 194812–194817\n\n*что здесь: Идея М: отправить Нуара под воду, потому что в небе кто-то есть, а ниже уровня земли никого. С подхватывает: тьма держит воду как барьер, гибель защитника = конец острова.*\n\n\n\n```chat\n[194812] 2024-07-03 19:18 Миколай: может нуара под воду пошлём? там темноты дохуя\n[194813] 2024-07-03 19:19 Миколай: а то хули в небе есть кто-то, а ниже уровня земли нету никого\n[194814] 2024-07-03 19:19 Слава: Вообще интересная идея\n[194815] 2024-07-03 19:20 Слава: И тьма будет держать воду как барьер\n[194816] 2024-07-03 19:20 Миколай: ага\n[194817] 2024-07-03 19:20 Слава: Вот только если он сдохнет будет пиздец острову\n```\n\n### Версия 2 — 2024-07-03\n\nвселенная: 7 островов (объявлено) · окно w0041 · сообщения 194827–194835\n\n*что здесь: Экономика острова: тьма не мешает обычным людям, нужны порты, транспорт, еда; без солнца еды нормальной не будет — отсюда персонаж со способностью солнца.*\n\n\n\n```chat\n[194827] 2024-07-03 19:22 Миколай: ну если в обычном состоянии ваще не действует это даже хорошо\n[194828] 2024-07-03 19:22 Миколай: ибо всё равно нужны порты коммуникации с внешним миром\n[194829] 2024-07-03 19:23 Миколай: транспорт, все дела, хавать ведь надо чето, а без солнца еды норм не будет\n[194830] 2024-07-03 19:23 Слава: Ну может там будет жить человек со способностью солнца или типо того\n[194831] 2024-07-03 19:23 Слава: Или он будет помощником\n[194832] 2024-07-03 19:24 Миколай: о, неплохая идея\n[194833] 2024-07-03 19:24 Слава: У имитатор помощник есть\n[194834] 2024-07-03 19:24 Миколай: да, типо когда чел пойдёт по своим делам наёмника, солнышко останется\n[194835] 2024-07-03 19:24 Миколай: кто\n```\n\n### Версия 3 — 2024-07-03\n\nвселенная: 7 островов (объявлено) · окно w0041 · сообщения 194919–194922\n\n*что здесь: Режим — федеративная республика (тоталитаризм Нуару не отдали).*\n\n\n\n```chat\n[194919] 2024-07-03 19:52 Миколай: нуару например\n[194920] 2024-07-03 19:53 Слава: Ну нуар хороший челик \nА вообще можно одному из островов\n[194921] 2024-07-03 19:53 Миколай: тогда у него будет Федеративная республика\n[194922] 2024-07-03 19:53 Миколай: ну тогда дам этот грех женщине\n```\n\n### Версия 4 — 2024-07-04\n\nвселенная: 7 островов (по дате объявления) · окно w0043 · сообщения 196694–196735\n\n*что здесь: остров в воде, конституционная монархия; солнышко — император/императорша и рыба-человек; отношения неофициальные, «симбиоз»; на острове тихо, есть и воздух и вода*\n\n\n\n```chat\n[196694] 2024-07-04 20:25 Слава: А у тебя я уже знаю\n[196695] 2024-07-04 20:25 Миколай: ага\n[196696] 2024-07-04 20:25 Слава: Остров ?\n[196697] 2024-07-04 20:25 Миколай: давай остров\n[196698] 2024-07-04 20:25 Слава: Вода\n[196699] 2024-07-04 20:25 Миколай: да\n[196700] 2024-07-04 20:25 Миколай: так ща\n[196701] 2024-07-04 20:26 Миколай: мммм\n[196702] 2024-07-04 20:26 Миколай: как это назвать\n[196703] 2024-07-04 20:26 Миколай: бля\n[196704] 2024-07-04 20:26 Миколай:
