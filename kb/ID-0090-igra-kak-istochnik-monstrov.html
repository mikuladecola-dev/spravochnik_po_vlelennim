-11 16:51 Миколай: у нас это по жанру mobs\n[217828] 2024-08-11 16:52 Слава: Тогда автор этой игры создал ещё игры\n[217829] 2024-08-11 16:52 Миколай: ну я понимаю твою задумку, но как по мне это баян\n[217830] 2024-08-11 16:52 Миколай: ща и идея была у меня взяла из бездомного бога\n[217831] 2024-08-11 16:52 Слава: Он создал более 100 игар\n[217832] 2024-08-11 16:52 Миколай: ну\n[217833] 2024-08-11 16:52 Миколай: лан\n```\n\n### Версия 2 — 2024-08-11 · повтор прежней мысли\n\nвселенная: монстры (по дате объявления) · окно w0051 · сообщения 217880–217888\n\n*что здесь: Возврат к идее: Миколай говорит, что прописать тему с автором игры может и знает, как она будет работать, но ему это скучно, получится посредственно; возможно реализует необычным образом.*\n\n\n\n```chat\n[217881] 2024-08-11 17:08 Миколай: а значит всё это даёт большую свободу и спектр возможностей\n[217882] 2024-08-11 17:09 Миколай: а прописать могу эту тему с автором игры но для меня это кажется скучной идеей\n[217883] 2024-08-11 17:09 Миколай: я знаю как это будет работать\n[217884] 2024-08-11 17:09 Миколай: но я буду это делать без огня в глазах\n[217885] 2024-08-11 17:09 Миколай: получится посредственно\n[217886] 2024-08-11 17:10 Миколай: а мы хотим конфетку\n[217887] 2024-08-11 17:10 Миколай: я может эту идею реализую, но вообще необычным образом\n[217888] 2024-08-11 17:12 Миколай: за убийство мирного духа на него падёт проклятие, точнее общее презрение всех монстров поэтому ему жить будет опаснее, он будет постоянно защищаться и убивать, что уже сделает его самого ужасным монстром\n```\n\n## Неясности\n\n- (w0051) Отложена без реализации.</div>"}];</script>
