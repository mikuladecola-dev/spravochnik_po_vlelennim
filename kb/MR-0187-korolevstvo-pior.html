<script>const BASE="../";const DOCNAME="Королевство Пиор";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Королевство Пиор\n\n*мир* · вселенные: Феня\n\n## Навигация\n\n- (w0113) Мир, в который попал герой: средневековое королевство Пиор, интерьеры с узорами и коврами. Оказывается тем самым миром из сказки о герое справедливости, которую гг читал в прошлой жизни.\n\n## Связано с\n\nДионис Бэлут, Фанатик\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-12-14\n\nвселенная: Феня (по дате объявления) · окно w0113 · сообщения 397759–397759\n\n*что здесь: упрощённая история королевства от служанки; гг понимает, в какой именно роман попал; средневековый интерьер*\n\n\n\n```chat\n[397759] 2025-12-14 22:10 Слава: - покажи мне особняк и раскажика мне о моей сем... - слова застряла в горле. Хотелось выплюнуть его, как гнилой ком, но не получалась. \n- хорошо господин- также бесстрастно ответила служанка начиная идти впереди меня прокладывая дорогу. \n- что именно вас интересует в семье господин? - спросила она пока мы шли по длинейшему на свете коридору. \n-кто вообще есть семья? - сказал я отряхивая пыль на груди. Горничная кивнула и начала рассказывать. \n- Граф Эдгар Бэлут ваш отец и графиня Виктория Бэлут ваша мачеха.... \n&quot;Что мачеха&quot; Я прочитал достаточно рассказов, чтобы понимать мачеха не сулит ничего хорошего. Продолжая отряхивать пыль уже с плеча я продолжил слушать. \n-у вас также есть младший брат и младшая сестра от графине Виктории-\n&quot;Это плоха, очень плоха&quot; Мне не хотелось устраивать политическую борьбу. Единственно, что я хотел это понаблюдать за главным героем. В независимости в каком я романе. \nГлупа. Глупа. Глупа. Мысль о том что это бред моего сознания на почве стресса или сон. Никуда не ушли. Хоть и ослабли после того, как я потрогал и ощутил своё новое лицо. И этот идиотский коридор с множеств дверей, когда нибудь закончится? \n***\nДальше особо ни-че-го интересного не было. Мы бродили по коридорам иногда посещая некоторые комнаты. Например библиотеку, кухню и пару залов. Сам интерьер, здесь как и ожидалось был средневековым. Разные узоры, где попало и не экономия пространства. Был только один большой плюс. Невероятная мягкий ковры. Мне захотелось снять обувь и пройтись по этим коврам. Ну я как достойный человек сдержался. Я и так уже веду себя подозрительно. \nМоя черноволосая служанка по моей просьбе рассказала упрощённый вариант истории королевства Пиор. \nЭтой информации мне хватило, чтобы понять, что это за мир. \nУдивительно, нет- это восхитительно. Я лютый грешник попал в тот самый лучик света. В ту б сказку о герой справедливости, что борется со всем злом на свете. \nЯ едва сдержал возбуждение. Даже если это сон, даже если это бред. Нужно увидеть героя. \nСамая мысль о том, что я его увижу, того самого. Заставляло моей сердце биться сильнее. \nДержась за колотишься сердце в саду. Я одной рукой опирался на фарфоровую скульптуру. \nСлужанка же стоял рядом со мной. Держа в руках стакан воды, который она достала из неоткуда. \n- да ты нечто - переводя дух продолжил я. \n- будь конкурс лучшей служанки. Ты бы заняла первое место- служанка на все мои пышные комплименты лишь кивнула головой. \n-господин скоро будет ужин- \nЯ посмотрел на небо. И правда Солнца уже садиться. И я до сих пор не проснулся. Хорошая новость. \nНо снова идти по этому лабиринту называемая особняком, до тошноты не хотелось. \nТемная комнатушка уже казалось куда более заманчивой. \n-тогда принеси ужин в мою ком.....в мои покои- махнул рукой отвечая. Служанка не ответила, заколебалась что-ли ? \n-извините господин. Но вы ужинает вместе с графом и графиней- \n&quot; Нет я собирался так рано встречать графа и графиню&quot; Я же даже не знаю каким был Дионис. \n-скажи, что я не важно себя чувствую- выпалил я не раздумывая. \n- простите господин. Но я уже сообщил графу, что сегодня у вас за долгое время хорошее настроение. Граф потребовал, чтобы вы сегодня были на ужине- негодования. Вот единственная эмоция, что я мог проявить сейчас. \n- когда ты успела? - не понимал я. \n-я сообщил через дворецкого, когда мы были в библиотеке- дворецкий я думал это был библиотекарь. \nВздох..  Ладно зачем уже паниковать. Нужно быть оптимистом - это единственный способ пережить что-то тяжелое. \nВо-первых я узнаю отношения семьи Диониса к нему. \nВо-вторых я увижу графа и возможно пойму, что это за семья такая. \nВ-третьих же рано и поздно мне все равно пришлось бы их увидеть. \nНо густое и неприятная чувство. Сильно резал из-за того, что только недавно ощущал приятные эмоции.\n-больше не делай что-либо без моего приказа. Ты же моя служанка? -сказал я отряхивая грудь от пыли. \n- да господин я ваша служанка. Больше такого не повторится- сказала она низко наклонившись. \nИ вправду говорят &quot; Прощения получить легче, чем разрешение &quot;\n```\n\n## Часть чего\n\nФанатик\n\n## Неясности\n\n- (w0113) устройство мира кроме названия и «сказки о герое справедливости» не раскрыто</div>"}];</script>
