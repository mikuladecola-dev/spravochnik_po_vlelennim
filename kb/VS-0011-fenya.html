49] 2025-12-09 15:33 Миколай: феня это язык торговли, где всех наёбывали и придумали слово лох\n[394750] 2025-12-09 15:33 Миколай: жопа\n[394751] 2025-12-09 15:33 Слава: Тогда феня\n[394752] 2025-12-09 15:33 Миколай: паххахмхахмхм, Павла Воли чтоли\n[394753] 2025-12-09 15:34 Слава: Феня. Идеально описывает всех сверхлюдей. Их наебали\n[394754] 2025-12-09 15:34 Миколай: а когда появилась это вселенная?\n[394755] 2025-12-09 15:34 Миколай: сегодня ты первый раз о ней написал?\n[394756] 2025-12-09 15:36 Миколай: Что это за унизительно остановки речь. \nОна предназначена для подавления воли?\n[394757] 2025-12-09 15:36 Слава: Давненько. \nВообще это Вселенная появилась лишь потому что я пытался тот образ гг сделать в настоящим. \nА после она просто стало лёгкая вселенная\nТо есть сверх силы там слабее. И в теории даже обычные человек способен победить сверхчеловека. \nИз-за легче развивать отношения людей. \nПросто в Оам все чё-то слишком сильный. Да и Оам Вселенная большая как боевик\n```\n\n## Что внутри\n\n| Вид | Название | Версий | С даты | Файл |\n|---|---|---|---|---|\n| идея | [История про Апокалипсис](../sushnosti/idei/ID-0163-istoriya-pro-apokalipsis.md) | 1 | 2025-12-11 | `sushnosti/idei/ID-0163-istoriya-pro-apokalipsis.md` |\n| история | [Защитник](../sushnosti/istorii/IS-0017-zaschitnik.md) | 21 | 2024-07-04 | `sushnosti/istorii/IS-0017-zaschitnik.md` |\n| история | [Страх](../sushnosti/istorii/IS-0082-strah.md) | 4 | 2025-12-09 | `sushnosti/istorii/IS-0082-strah.md` |\n| история | [Фанатик](../sushnosti/istorii/IS-0083-fanatik.md) | 8 | 2025-12-09 | `sushnosti/istorii/IS-0083-fanatik.md` |\n| мир | [Боги во вселенной Феня](../sushnosti/miry/MR-0185-bogi-vo-vselennoy-fenya.md) | 2 | 2025-12-09 | `sushnosti/miry/MR-0185-bogi-vo-vselennoy-fenya.md` |\n| мир | [Королевство Пиор](../sushnosti/miry/MR-0187-korolevstvo-pior.md) | 1 | 2025-12-14 | `sushnosti/miry/MR-0187-korolevstvo-pior.md` |\n| мир | [Мир апостолов (современный)](../sushnosti/miry/MR-0188-mir-apos
