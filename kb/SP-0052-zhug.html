оким кровожадным и т.д\n[152576] 2024-04-02 18:52 Слава: Какую ещё способность добавить к выше Поротаем\n```\n\n### Версия 2 — 2024-06-03 · повтор прежней мысли\n\nвселенная: Новый мир (объявлено) · окно w0036 · сообщения 175808–175813\n\n*что здесь: Съедание жуга даёт один из трёх исходов — смерть, низший или высший Поротай*\n\n\n\n```chat\n[175808] 2024-06-03 22:58 Миколай: Неа😅\n[175809] 2024-06-03 23:00 Миколай: Напомнишь?\n[175810] 2024-06-03 23:08 Слава: Потом ответишь \nПридумал один вид Поротай \nКороче есть жуг ты его съедаеш и у тебя 3 варианта \n1) смерть , все твои внутренности превращаются в камень и отказывают\n2)  превращаются  в низший Поротай (горбатого двух лицого, полукаменного-полуплоти , и ты теряешь личностей и  слушаещя высшего Поротая  ) способности крепкость, реген, сверхсила \n3) превращается высшего Поротая сохраняешь свой человеческий образ и личность. Способности реген, контроль над низшими, превращать части тела в твердый камень , сверхчеловеческая сила\nДебафф у тебя появляется вторая личность жестокая, кровожадная , алочная и т.д.\nИ она составляет чаще всего становится жестоким кровожадным и т.д\n[175811] 2024-06-03 23:08 Слава: Я спать\n[175812] 2024-06-03 23:08 Миколай: Окей, добрых снов\n[175813] 2024-06-03 23:08 Миколай: Ааа, вспомнил\n```\n\n### Версия 3 — 2025-03-26\n\nвселенная: вне вселенной (по дате объявления) · окно w0086 · сообщения 311278–311281\n\n*что здесь: Заявлены сам жуг и три исхода его поедания*\n\n\n\n```chat\n[311278] 2025-03-26 08:20 Слава: Я уже сказку составляю о новом мире\n[311279] 2025-03-26 08:29 Слава: Потом ответишь \nПридумал один вид Поротай \nКороче есть жуг ты его съедаеш и у тебя 3 варианта \n1) смерть , все твои внутренности превращаются в камень и отказывают\n2)  превращаются  в низший Поротай (горбатого двух лицого, полукаменного-полуплоти , и ты теряешь личностей и  слушаещя высшего Поротая  ) способности крепкость, реген, сверхсила \n3) превращается высшего Поротая сохраняешь свой человечески
