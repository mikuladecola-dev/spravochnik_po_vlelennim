<script>const BASE="../";const DOCNAME="Магнетизм";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Магнетизм\n\n*способность* · вселенные: 7 островов\n\n## Навигация\n\n- (w0038) Способность Текси: управление железом. Через инструмент-меч — полёт и метание; через железо в перчатках и обуви — усиление ударов; приёмы включают разгон ножа через кольцо из пальцев и защиту из железа собственной крови.\n\n## Связано с\n\nТекси\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-06-18\n\nвселенная: 7 островов (по дате объявления) · окно w0038 · сообщения 183250–183250\n\n*что здесь: базовое описание и фирменный приём: сложить пальцы кругом и пустить через них нож с огромным ускорением, минус — плохая меткость, только вблизи*\n\n\n\n```chat\n[183250] 2024-06-18 06:43 Слава: Магнетик т.п.\nМужчина 20 лет способности магнетизм \nИнструмент: большой железный меч ( как у берсерка) ему его легко контролировать пулять его и летайте на нем \nОружие: 10 клинки  он использует их для отвлечения или если много слабых целей, так как скорость и убойность у них в разы меньше инструмента \nМеч на поясе лёгкий и тонкие что бы им сражаться так как свой инструмент он почти всегда держит воздухе \nЖелезный перчатки и ботинки с помощью магнетизма усиливает их из-за этого удара в разы сильней\nФирменный прием: сложить пальцы круг и через него пустить нож давая ему невероятной ускорения ( минус он очень не меткий поэтому прием использует лишь в ближе )\n```\n\n### Версия 2 — 2024-06-21\n\nвселенная: 7 островов (по дате объявления) · окно w0038 · сообщения 185045–185046\n\n*что здесь: три названных приёма: магнитное поле (разгон ножа), железная кожа (пускает себе кровь и покрывается железом из крови, риск большой кровопотери), град железа (запуск 10 ножей для отвлечения или добивания слабых)*\n\n\n\n```chat\n[185045] 2024-06-21 10:07 Слава: Имя: Текси \nЛюбит: яблоки, брата( как брата) \nНе любит: толпы людей, жару  \nСила 10\nСкорость 5,5\nЛовкость 6\nВыносливость 8\nКонтроль 5 \nОружие: 10 ножей; одноручный меч; железный перчатки и обувь \nИнструмент: огромные меч ( легче контролировать и легко запускать воздух  или летать на нем , самый убойный среди всех орудий)\nСпособности: магнетизм \nПриемы: 1) магнитная поля, складывает пальцы круг и через них запускать нож с невероятной скоростью, но меткость хромает как и контроль из за этого использует только в ближе \n2) железная кожа, пускает себя кровь и из железа в крови, покрываеть  себя защищаясь и усиливая себя ( слишком рискованно использовать на постоянной основе; большая потеря кровь)\n3) грать желаза, запуск 10 ножей для отвлечения внимания или чтобы убить слабых противников \nЧерта характера: спокойный, интроверт( то бишь держит все проблемы и со мнения внутри себя), с опаская относится к людям\n[185046] 2024-06-21 10:24 Миколай: Имя: Катапира\n\nЛюбит: корочки от печной пиццы, волосатых гусениц\n\nНе любит: соль/сахар, молодёжь (людей до 25, хотя самому меньше)\n\nСила: 6\n\nЛовкость: 5\n\nМеткость: 9\n\nСкорость: 7\n\nВыносливость: 8\n\nКонтроль: 10\n\nОружие: тонкий меч \n\nСпособности: повышение температуры\n\nПриёмы:\n\n1. Нагревание воздуха до невероятных высот при которых происходит взрыв этой смеси газов\n\n2. Атомарное домино: Коснувшись мечем на определённой частоте какой-либо поверхности, она начинает резко передавать температуру по волновому импульсу. Например пол он коснулся, и в сторону противника он начинает отдавать раскалённую волну тепла. Это просто очень горячо ну если не направлять силу. Если направить силу, то под конкретной целью расплавиться поверхность\n\n3. Самовозгорание: повышает защиту и атаку. Типо предметы попадающие в его воспламенённую зону сгорают или плавятся, а у оружия появляется наружняя аура добовляющая урон. Не очень затратная на самом деле способность, но зато очень эффективная и выглядит красиво пхех\n\nЧерта характера: любопытный парень, со стороны кажущийся сумасшедшим и не тем что делает странные шумные выходки, а тем, что делает тихие личные эксперименты и прикольчики. Обожает наблюдать за природой и общаться со взрослыми, набираться опыта. Не любит кушать, а если и кушает что-то, то только в сыром виде, все равно он никогда не заболеет и не подхватит паразита, так как в его теле такая температура при которой никто не выживет, да и еда внутри уже готовится\n```\n\n## Часть чего\n\nТекси</div>"}];</script>
