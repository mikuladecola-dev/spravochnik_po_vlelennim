<script>const BASE="../";const DOCNAME="Рассказчик «Любимого города»";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Рассказчик «Любимого города»\n\n*персонаж* · вселенные: Иссекай\n\n## Навигация\n\n- (w0117) Безымянный герой-рассказчик: пьющий, курящий, невезучий по собственной оценке, но считающий себя везунчиком; действует по принципу «бей, беги, замри» и выбирает бег. В пустом городе первым делом ищет воду, потом уходит в запой и дебоширит в магазине.\n\n## Связано с\n\nЖених, Любимый город\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2026-02-14\n\nвселенная: Иссекай (объявлено) · окно w0117 · сообщения 432538–432541\n\n*что здесь: Первое появление: биография в прологе, голос и характер заданы сразу.*\n\n\n\n```chat\n[432538] 2026-02-14 09:26 Слава: Любимый город \n\nНе назвать мою жизнь удачной. К сожалению. \n\nУ меня не было великих свершений. Было лишь пару горячительных напитков и интересные таблеточки, конечно и сигареты, как без них-то. Зато в азартные игры не играл, потому что чаще всего выигравал. Так же не был сердцеедом , потому что болела голова от попыток угодить другому человеку.  Ну и в принципе вся моя биография. \n\nВозможно всё бы закончилась тем, что моё тело бы сказало гудбай и я помер. Ну нет, случился момент в мой жизни, который что-то возможно изменил. Точнее это не момент, а места. \n\n---------\n\nЗнаете просыпаться скрючившись в калачик после ночной гулянки всегда тяжёлая задача. Во первых всё тело ломит, а в горле вся влажность испарилась и стало так сухо, что ты чувствуешь как отваливаються какие-то куски с твоего горла. Во-вторых, похмелье, что двоечкой пробивает твою черепушку, а когда ещё солнце без пощады светит в опухшее лицо становится в двойне хуже.\n&quot; Почему солнце так ярко бьёт по глазам? &quot; Ответ очевиден. Я на открытом воздухе. Поэтому тело продувает и на коже образовались маленькие пупырышки. \n\nЛадно если бы я просто отрубился, где-нибудь на улице. Но нет. В моей запоздало проснувшийся мозг ударили нейроны, отвечающие за телесное ощущение, и я чётко ощутил, что-то колючее, но при этом податливое. Трава. \n\nВ городе- в тем более в моём- травы на его улицах хрень найдешь, а значит я где-то в лесу. Ну или могу быть в парке, который недавно подожгли, какие-то подростки. \n\nНачинаю потихоньку подниматься, как в глазах до этого видевший красный круги потемнело. В животе вся смесь моих питательных веществ очень настойчиво постучались  по зубам. Едва сдержав  рвоту, я всё же восстанавливаю зрение и.... Блять \n\nНет, чудесней этого слова &quot;блять&quot;. Описывает всё и то что я лежу на какой-то лужайке строго постриженная, словно прическа солдата. И то что это лужайка находится на долбаной крыше пятиэтажки. Ну и конечно же как изюминка, на этой лужайке ещё шесть человек, старики и дети, женщины и мужчины. Мужчина средних лет с обручальным кольцом на пальце, пацан лет десяти, ну и подросток. Также молодая женщина в отключки, старичок, да и девчуля подросток. Идеальная команда для семейного конкурса. Всё такие ухоженные и единственный я белая ворона или как там говрилась? \n\n&quot; Прикольно приколист решил пьяных людей сюда притащить&quot;- подумал бы я. Если бы здесь не было десятилетнего мальчика, который, также как и остальные был в отключке. \n\nЧто же. В ситуациях, когда ты не знаешь как действовать. Ты будешь действовать по инстинкту трёх принципов &quot; Бей, беги, замри&quot;. \n\nУгадайте какой выбрал я. Бег. Кроме инстинктивного понятия того, что мне мясоеду не место на зелёной лужайке. Я также понимал что оставаться в группе, в которой я очнулся первым, и в которой я самый подозрительный, не лучшая идея. \n\nНаконец-то встав, я впервые нормально огляделся. Я находился на крыше, без бортиков, то есть, кто нибудь из этих спящих бедолаг в принципе мог перевернуться и выпасть. Кроме зелёный травы, здесь была бетонное сооружение с железной дверью. &quot;Выход с крыши&quot;.Бьет очередной запоздавший нейрон по голове. \n\nДолго не думая. Я покачиваясь начал приближаться к двери. \n\nДойдя до двери. Я схватился за приятно прохладную ручку двери. И сам не заметив прижался лбом к двери. Голова до этого хаотично пульсирующая, наконец-то начала успокаиваться. Но сейчас не до этого. \n\nЯ дергаю дверь. И о чуда она открылась, обдавая меня застоявшимся воздухом. Долго не думая я начал спускаться и попутно подметил две детали. \n\nПервое: бежать в помещении, в котором застоялся воздух. Охренеть как приятное, когда вдыхаешь пыльный и вонючий воздух,  и чувствуешь как пылинки оседают в твоих лёгких. При этом душно до ужаса. \n\nВторое: это кажись заброшка. Нет здесь людей, вещей которые бы обозначали, что здесь живут. В принципе логично. Вряд ли бы нас кто на жилое здание поперл бы. \n\nМедленно спускаясь по лестнице, конечно же крепко держась за перила. Я уже начал думать, как я куплю прохладную водичку и буду глотать его большими глотками... Из-за этих мысли в горле стало ещё суше. \n\nБам\n[432539] 2026-02-14 09:26 Слава: Звук захлопнувшейся двери разнёсся сверху. Я замер не понимая, как действовать, но стоял я не долго. \n\nТоп-топ\n\nПослышались быстрые шаги сверху. И подавшись принципу трёх инстинктов. Я побежал по лестнице не оглядываясь, и забыв о больной голове и о пустыне в горле. \n\nЯ бежал пытаясь держаться за перилы, а чей-то топот лишь приближался. \n\nПослав своё самочувствие как можно дальше. Я начал буквально прыгать со ступенек, больно отбивая ноги, но продолжая скакать. Из-за этого шум бега за спиной начал отдаляться \n\nПрыгая ещё раз я не правильно рассчитал расстояние своей пульсирующей головой до слудующей ступенки. И потеряв равновесие начал падать. Отбивая все силы от углов ступенек. В конце громко шлепнушись о бетонный пол. \n\nВ глазах начало мутиться , а жидкость с желудка до этого сдерживаемая начала выходить через рот, царапая моё нëбо. \n\nТоп-топ\n\nЧей то быстрый бег лишь приближался. Не давая мне времени подумать или принять решения. \n\nШаги уже начали приближаться, а я лишь смог от ползти в угол и пытаться притвориться стеной. \n\nТоп-топ\n\nИ вот перед моими мутными глазами появился силуэт мужчины в чёрной кофте, что быстро спускался по лестнице. Он увидев меня и на мгновение остановился тяжело дыша, но быстро потеряв ко мне интерес побежал дальше вниз. \n\nЯ сразу понял, что это за мужчина. Жених. Ну мужчина с обручальным кольцом. \n\n&quot; И куда он так целеустремленно несётся &quot;- появление это мысли обозначало бы, что Жених что-то знает. Ну или он психанул, когда очнулся на крыше и просто начал бежать. Вот только лицо его выглядили уж слишком собраным и полным надежд. Вау как я умело могу читать людей. Надеюсь. \n\n-блять! -\n\nОпять это великое слова &quot; Блять&quot;. Прекрасно описывает, то что оказывается я блеванул не на пыльные бетон, а на свои пыльные штаны. Да ещё и адреналин начал от меня убегать, а боль начала догонять. Из-за этого руки, которыми я прикрывал руку при падения начали ныть, рёбра который я не прикрыл. И конечно ещё, как будто мы мозг набух и давит на черепушку, ещё этот поганный кислый вкус. \n\nБыло бы неплохая идея позванить в больницу. Вот только я не знаю где я, а телефон у меня кирпич. Поэтому узнать свою геолокацию я не смогу вроде как. Если честно то я просто не как да не пробовал. Нет точное нет. В армию же можно с кирпичем, а значит он не показывает геолокацию. \n\nЯ начал стават опираясь на стену. Двигаться вообще не хотелось, но ещё больше мне не хотелось оставаться в этом здании. \n\nБлаго расстояния до выхода было мизерным. Поэтому я быстро дошёл до открытой двери. \n\nПриятный ветерок обдул моё лицо. Наконец-то вздохнув полную грудью. Я простоял с закрытыми глазами пару минут, приходя в себя. \n\nОткрыв глаза я огляделся и... Нифига. Никого не было. Ни взглядов отвращения из-за грязных штанов. Ни гула машин. Ни даже песни наших младших пернатых братьев. Ничего. \n\nИ в мою опухшую голову начали проникать вполне очевидный мысли:\n&quot;Что это за город? &quot;\n&quot; Почему здесь никого нет? &quot;\n&quot;Как я здесь оказался? &quot;\nВсе эти мысли были по своему важны. Но были мысли куда более важные &quot; Где мне найти воду? &quot;. Каким бы не был ты героем, ты не сможешь совершать великий подвиги не утолив свои билогический хателки.\n\nПоэтому я начал бродить по пустым улицам. Было ой, как непривычно. Я человек прожившие в городе, где на каждом шагу есть человек, а сейчас пусто и тихо. Настолько тихо, что звенит в ушах или это потому что я всё же плохо прикрыл голову и стукнулся. \n\nБез разницы. Моя прогулка было недолгой. Я быстро заметил надписи маленького магазина &quot;магазин 24&quot;.\n\nДойдя до магазина. Я с надёжной дёрнул железную дверь и... Почему то на двери мне сегодня везёт. Хотя я всегда был везунчиком. \n\nЗайдя в тёмный магазинчик. Магазин как магазин, стеклянный витрины за которым разная продукции и здесь даже воздух не застоявшийся. Подойдя к прилавку, я кое как перелез через прилавок. \n\nИ быстро открыв бутылку с водой. Начал большими глотками глотать воду. Да именно глотать, а не пить. Быстро опустошив бутылку, я взялся за другую и продолжал пить.\n[432540] 2026-02-14 09:26 Слава: Я почуствовал разочарование. Просто в моих фантазиях вкус воды был таким приятным, а на деле просто безвкусная вода. И здесь мой взгляд остановился на холодильнике для напитков. \n\nТам были горячительные напитки, что прям спецально вызывающие выглядили. \n\nЯ словно начал слышать\n&quot; Эй дружек выпей нас. Тебе сразу полегчает &quot; Я же человек не привыкшей отказываться от просьбы. Открыл холодильник и взяв холодную банку пива. \n\nЯ открыл железную крышку и начал пить. В голове начало приятно шуметь, а более потихоньку отпускать, а чем дальше уходила боль, чем больше пустых банок вылялось на полу. Через какое-то время на полу также начали валяться и стеклянные бутылки. При этом воспоминания начали тускнеть, и то что произошло дальше, лишь кадроми проносятся в голове. \n\nЯ вроде как начал дебоширить. Бить ветрины, разбивать бутылки, а после мне захотелось в туалет и я сходил прямо в магазине. И ещё пару моментов, где я просто напивал какую-ту песню. \n\n****\n\nМоё сознание начало приходить лишь в ночном переулке. В луже теплое жидкости. Первая мысль \n&quot;Че я за свинья под себя сходил&quot;, а вторая &quot; Бок...болит&quot; Эти две абсолютно разный мысли начали соединяться. И в мою пьяную голову ударила другая мысль &quot;кровь?! &quot;\n\nЯ схватился за бок и начал отползать от лужы. В темноте города, что не давали пробиться луному цвету, не было видно цвет жидкости. Но в моёй голове цвет уже был ярко красным.\n[432541] 2026-02-14 09:29 Слава: Я снова вернулся к Иссекаю\n```\n\n### Версия 2 — 2026-02-16\n\nвселенная: Иссекай (объявлено) · окно w0117 · сообщения 433129–433145\n\n*что здесь: М разбирает голос рассказчика: спрашивает, кто это говорит и зачем персонаж так говорит, не верит ему.*\n\n\n\n```chat\n[433129] 2026-02-16 11:49 Миколай: это кто говорит\n[433130] 2026-02-16 11:49 Миколай: персонаж?\n[433131] 2026-02-16 11:49 Миколай: а зачем он так говорит\n[433132] 2026-02-16 11:49 Миколай: ты пытаешься красиво описать?\n[433133] 2026-02-16 11:49 Миколай: для чего эти детали?\n[433134] 2026-02-16 11:49 Миколай: почувствовать?\n[433135] 2026-02-16 11:49 Миколай: чувствую\n[433136] 2026-02-16 11:49 Миколай: но это чей-то голос\n[433137] 2026-02-16 11:50 Миколай: так персонаж говорит?\n[433138] 2026-02-16 11:50 Миколай: я ему не верю\n[433139] 2026-02-16 11:50 Миколай: ну зачем он так говорит\n[433140] 2026-02-16 11:51 Миколай: ну да, тут в целом другая идея\n[433141] 2026-02-16 11:51 Миколай: она работает на себя\n[433142] 2026-02-16 11:51 Миколай: так что нахуй претензию\n[433143] 2026-02-16 11:51 Миколай: просто это другое\n[433144] 2026-02-16 11:52 Миколай: красиво\n[433145] 2026-02-16 11:52 Миколай: красиво\n```\n\n
