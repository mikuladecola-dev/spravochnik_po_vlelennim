ава: Норм что змея \nНу я хочу что бы большей половины были гуманноидыми\n[154391] 2024-04-06 16:00 Слава: А способность я не до конца понял то бишь увеличивается ?\n[154392] 2024-04-06 16:00 Миколай: Да, увеличивается\n```\n\n### Версия 2 — 2024-04-06\n\nвселенная: игра бога (по дате объявления) · окно w0030 · сообщения 154418–154427\n\n*что здесь: Уточнён характер носителя: как Бен 10, но взрослее — игривый, издевательский, недотёпа местами, с юмором; паразитирование на ком-то для него слишком жёстко (потому Витрофунгус не подошёл как форма).*\n\n\n\n```chat\n[154418] 2024-04-06 17:28 Слава: Ну как отдельный персонаж крутой \nА как часть способности человека , как та не подходит\n[154419] 2024-04-06 17:29 Миколай: Ну так-то, да\n[154420] 2024-04-06 17:29 Миколай: Тогда, ммм подскажи че да как к челику там должно быть\n[154421] 2024-04-06 17:30 Миколай: Ну то есть чтобы я понимал что лучше добавить к персу, чтобы гармонично было\n[154422] 2024-04-06 17:31 Слава: Кратко типо Бен 10 только более взрослый характер ( но также игривый, издевательский, недотёпа в некоторых местах, с юмором )\n[154423] 2024-04-06 17:31 Слава: Но что бы паразитировать на ком то для него слишком жёстко\n[154424] 2024-04-06 17:31 Миколай: Тут просто прикол в том, что кости из стекла, а значит типо резня жёсткая, и может оставлять грибы и они лишают важных для жизни штук, но в тоже время стекло хрупкое, как-то так\n[154425] 2024-04-06 17:32 Миколай: Сами грибы живущие в симбиозе на костях паразитируют при попадании на жертву\n[154426] 2024-04-06 17:33 Миколай: Ааааааааа\n[154427] 2024-04-06 17:33 Миколай: Я понял\n```\n\n### Версия 3 — 2024-04-06\n\nвселенная: игра бога (по дате объявления) · окно w0030 · сообщения 154434–154436\n\n*что здесь: Правило набора форм: не повторяться — качок уже есть, нужен кто-то с дальней атакой или с элементом (огонь, молния).*\n\n\n\n```chat\n[154434] 2024-04-06 18:17 Слава: Ну по сути я не хотел повторяться \nТам же у нас уже есть качок\n[154435] 2024-04-06 18:17 Слава: Может сейчас кого с дальний атакой\n[154436] 2024-04-06 18:17 Слава: Ну или элемент то бишь огонь молния\n```\n\n### Версия 4 — 2024-04-07\n\nвселенная: игра бога (по дате объявления) · окно w0030 · сообщения 154664–154678\n\n*что здесь: Подсчёт: из 8 пришельцев одобрено 3 — быстрый с узорами молний, бык/козёл и лягуха с крыльями. Остальные С видит как отдельные виды-расы, а не как формы человека.*\n\n\n\n```chat\n[154664] 2024-04-07 11:26 Слава: Три это быстрый с узорами молний, бык или козел; а третий кто\n[154665] 2024-04-07 11:27 Миколай: Ну я подумал что лягуху с крыльями ты тож одобрил\n[154666] 2024-04-07 11:27 Миколай: А мне лично все понравились\n[154667] 2024-04-07 11:27 Слава: Ну мне тоже ну там чисто как отдельный виды расы а не часть челика\n[154668] 2024-04-07 11:28 Миколай: Вообще прикол быка не в силе, а выносливости, он может выдержать экстремальные условия, большой холод или наоборот мощное пламя, или даже атомный взрыв\n[154669] 2024-04-07 11:28 Слава: Это кто\n[154670] 2024-04-07 11:28 Слава: Пузырь\n[154671] 2024-04-07 11:29 Миколай: Он\n[154672] 2024-04-07 11:29 Миколай: .\n[154673] 2024-04-07 11:29 Миколай: Такие способности ему достались от скрещивания с тихоходкой\n[154674] 2024-04-07 11:30 Слава: Аааа ну туда можно ещё и силу кинуть с ловкостью\n[154675] 2024-04-07 11:30 Миколай: Ну думаю он не про ловкость\n[154676] 2024-04-07 11:30 Миколай: Он как танк будет скорее\n[154677] 2024-04-07 11:30 Миколай: Маленький но танк\n[154678] 2024-04-07 11:30 Миколай: А вот силу да, силу можно\n```\n\n## Неясности\n\n- (w0030) Вселенная не названа; имени у персонажа нет, только обозначение «многоликий». Не сказано, связан ли он с более ранней серией персонажей и турниром из w0029.</div>"}];</script>
