const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Бесцветные и Цветные\n\n*мир* · вселенные: Цветной мир\n\n## Навигация\n\n- (w0035) Базовое деление носителей абакры. Бесцветные — владельцы абакры без эксклюзивной абилки, умеют только усиливать тело; Цветные — с абилкой. Абилка хранится в особых клетках, у бесцветных их нет, и самих бесцветных больше.\n\n## Связано с\n\nГГ — мальчик без имени, Командир, Эксперименты по превращению бесцветного в цветного, абакра\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-05-25\n\nвселенная: Цветной мир (объявлено) · окно w0035 · сообщения 173145–173164\n\n*что здесь: Первое определение обеих категорий и обсуждение носителя абилки на клеточном уровне; вывод, что бесцветных численно больше.*\n\n\n\n```chat\n[173145] 2024-05-25 14:07 Слава: И кстати раз пошли суда то ещё вопрос\n[173146] 2024-05-25 14:09 Миколай: По идее норм концепция, можно дополнить или объединить с другой\n[173147] 2024-05-25 14:09 Слава: В той вселенной командир сильнейшего отряда\nПосле развала команды построил приют для детей в отшибе от людей и жил там поживал \nИ он в теорий сильнейший\nИ какую ему дать способность ?\n[173148] 2024-05-25 14:10 Слава: Также он первый удачный эксперимент для превращение бесцветного в цветной\n[173149] 2024-05-25 14:11 Миколай: Ясен хуй дыра черная\n[173150] 2024-05-25 14:11 Миколай: Фольга мятая\n[173151] 2024-05-25 14:11 Миколай: Первые ассоциации\n[173152] 2024-05-25 14:11 Слава: Бесцветный ( владельцы абакра но без эксклюзивный абилки ) \nЦветный ( владельцы абакра но с абилкой\n[173153] 2024-05-25 14:12 Слава: То бишь бесцветный могут только усиливать тело и все\n[173154] 2024-05-25 14:13 Миколай: Так\n[173155] 2024-05-25 14:13 Миколай: Абилка во перв
