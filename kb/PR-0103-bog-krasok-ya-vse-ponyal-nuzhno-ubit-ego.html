оторые растаял. И сестра его тоже таяла. Её лицо превратилась в смазанную картину. Он схватил её пытаясь удержать. \nНо она все истекала, он не мог её ухватить. \nВ слезах он видел как его весь мир просто растекался. Все что ему дорого, все что он знал просто исчезала. \nОн почувствовал руку на своем плече и вздрогнул. \nМедленно он поднял голову. Увидел радужные глаза, он хотел молить о пощаде, о спасении. Но не мог выдавить из себя слова. \nЛишь мог смотреть как рука медленно опускалась на его лицо. \n\n\nВ палатку забежал юнец. \n- главнокомандующий там... Это.. - не мог выдавить юный воин. \nСобравшись он всё же выдавил. \n- на нас напали. Есть труп, но там это странная.. - \n- что там странного? - спросил черноглазые мужчина. \n- там это. Голова трупа словно просто растаяла. Словно на картине просто перемещали краски. И ещё он словно из неоткуда появился. Пряма на ногах его сестры- юноша дрожал. Ведь все это больше походила на бред.\n```</div>"}];</script>
