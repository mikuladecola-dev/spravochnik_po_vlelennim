ирового древа вообще гуманноидный деревянный существо с оранжевой сердцевинной. Они могут изменить образ на человеческий. \nТак как они из дерева мирового древа. Хрен ты их пробьешь, не кто из апостоловы не сможет нормально их ранить, а если ранят они будут регенерировать. Ну и они сверхсильный (сильнейший наверное в физическом плане) \nОни могут передвигаться в земле и внутри деревьях. \nОгонь их не перед. Сам огонь на них тухнет. Ну они могут выпускать корни туда сюда ими драться.\n[370606] 2025-10-02 19:20 Слава: Если есть идея по их улучшения кидай\n[370607] 2025-10-02 19:20 Слава: И по пожиратели богов я не забыл\n--- пауза 2.1 ч ---\n[370613] 2025-10-02 21:28 Миколай: идеи крутые и ура есть мир\n```\n\n### Версия 2 — 2025-10-20\n\nвселенная: Оам (по дате объявления) · окно w0107 · сообщения 376399–376403\n\n*что здесь: Первое описание расы и её сил.*\n\n\n\n```chat\n[376401] 2025-10-20 14:29 Слава: Когда то давным давно во времена, когда были ещё племена по всему миру, а не государство. \nНа землю приземлились метеориты. Словно гнев самих богов по всему миру послышались взрывы и земля задрожала. \nИ из этих небесных тел выпустились в воздух, триллион неизвестных частиц. Невидимых и неосязаемых также как и заряженный частицы, но они есть. \nНеизвестный частицы заполонили весь мир. Весь воздух был пропитан ими, и всё живое, что  вдыхала это быстро утухала. Лёгкие заполнялось Оам и медленно разрывались на куски. Люди гибли, также как и животные. Лишь некоторый были способны прожить хотябы 30 лет, а после умерали.  И поколения сменяла поколения. Пока у людей не возник иммунитет во время эволюции и адаптации, как и у других животных. \nПозже частицы вылетевший из небесных тел и погубивший миллиарды жизни назвали Оам. \nЛюди пережив кризисный момент в истории. Заинтересовались откуда появилась проклятия бога. И начали исследовать территорию. И на местах приземления метеоритов, откуда появились Оам окружающая среда и жирность мутировали под активным воздействием Оам. Оказавшись там люди, вдохнув или испив насыщенной Оам жидкость или воздух. Умирали, как их давний предки. Но с исключением некоторый люди выживали и могли творить чудо. По их словам они начали чувствовать внутреннюю энергию. \n\nВот и все. \nИ вот объяснения. В воздухе и в некоторых водоёмах стали насыщенный Оам неизвестной частицей, что может вырабатывать энергию в огромных количествах. Долго время для живых организмов была токсичной.  Но после адаптации они стали нейтральными. \nЧеловек вдыхает Оам ( то есть поглощает, также поглощения может идти просто и через кожу, но более быстрый и способ но который мы можем хоть как-то повлиять). И дальше он по кровеносной системе вместе с кислородом проходит через всё тело, где-то оседая зависима от человека. И также зависимо от человека в нём накапливается определенное количества Оам.то есть у каждого человека своя ёмкость Оам. Если же у человека накапливается больше Оам, чем предусматривает его ёмкость. То Оам выходит через споры, с выдохом и просто через кожу либо другие способы выделением. Выпуск лишний Оам происходит чуть быстрее чем поглащения. \nВ каждым человеке есть Оам но использовать его не как нельзя. Но есть способ. \nЕсли человек поглотит, что-то с большой концентрации( воду либо вздохнет воздух с большими концентрациями Оам) Оам. Его тело просто не успевает выпускать Оам. И у человека два итого может быть. \nПервый: Либо из-за большого количества Оам его лёгкий или сосуд лопаются, либо Оам просто остановит сердца либо Оам из-за своей токсичности убьет человека. \nВторой: человеку удаётся почувствовать и обуздать Оам. Сдерживая Оам, чтобы он не навредил телу. Сдерживать до тех пор пока избытки Оам не выйдут естественным путём. И после когда избытки выйдут. Человек сможет пользоваться Оам ведь он уже почувствовал и сдерживал Оам. \nОпять же это касается только людей. У животных это происходит более инстинктивно. Поэтому шанс выживаемости у них больше чем у людей. Но они не могут раскрыть весь потенциал. \nТакже
