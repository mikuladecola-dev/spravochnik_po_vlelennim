<script>const BASE="../";const DOCNAME="Отыгрыш персонажей";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Отыгрыш персонажей\n\n*служебное* · вселенные: Апостол\n\n## Навигация\n\n- (w0077) Рабочая практика, перенятая у девочки с конкурса: жить неделю как персонаж, повторять за ним. Слава предлагает Миколаю быть Защитником, себе берёт Выродка, потом решают начать с любимых чужих персонажей — Слава Бена 10, Миколай перебирает Сайки Кусуо, Шинпачи, Кагуру, Таню.\n\n## Связано с\n\nБессмертный выродок, Защитник\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-02-25\n\nвселенная: Апостол (по дате объявления) · окно w0077 · сообщения 295561–295584\n\n*что здесь: Практика описана и сразу распределены роли: Миколай — Защитник, Слава — Бессмертный выродок.*\n\n\n\n```chat\n[295561] 2025-02-25 17:45 Миколай: но она немного выше\n[295562] 2025-02-25 17:45 Миколай: нас\n[295563] 2025-02-25 17:45 Миколай: не просто так\n[295564] 2025-02-25 17:45 Миколай: она ролеплеела персов\n[295565] 2025-02-25 17:45 Миколай: типа\n[295566] 2025-02-25 17:46 Миколай: жила так же как они\n[295567] 2025-02-25 17:46 Миколай: повторяла за ними целый день\n[295568] 2025-02-25 17:46 Миколай: неделю\n[295569] 2025-02-25 17:46 Миколай: представляла себя персонажем\n[295570] 2025-02-25 17:46 Миколай: еще до своей вселенной\n[295571] 2025-02-25 17:46 Миколай: чужих играла\n[295572] 2025-02-25 17:47 Слава: Начинай представлять себя как защитник\n[295573] 2025-02-25 17:47 Слава: Ты\n[295574] 2025-02-25 17:47 Слава: А я выродок\n[295575] 2025-02-25 17:47 Миколай: тот кого я убил или кто это😳\n[295576] 2025-02-25 17:47 Слава: Как рас про него историю писать буду\n[295577] 2025-02-25 17:47 Слава: Апостол\n[295578] 2025-02-25 17:47 Слава: Бессмертный\n[295579] 2025-02-25 17:47 Миколай: а\n[295580] 2025-02-25 17:48 Слава: И че будешь?\n[295581] 2025-02-25 17:48 Миколай: ну хорошо, буду вживаться эту неделю в роль\n[295582] 2025-02-25 17:48 Миколай: и жить\n[295583] 2025-02-25 17:48 Миколай: ну типа понимать\n[295584] 2025-02-25 17:48 Миколай: а дальше чисто жить\n```\n\n### Версия 2 — 2025-02-25\n\nвселенная: Апостол (по дате объявления) · окно w0077 · сообщения 295589–295629\n\n*что здесь: Порядок меняют: сначала отыгрывают любимых готовых персонажей, апостолов потом; выбраны Бен 10 и Шинпачи, Таня отвергнута Миколаем как не своё.*\n\n\n\n```chat\n[295589] 2025-02-25 17:51 Слава: Какой твой любимый перс?\n[295590] 2025-02-25 17:51 Слава: ?\n[295591] 2025-02-25 17:52 Слава: Давай сначала любимых персов отыграем, а не до конца доробатаных  персонажей\n[295592] 2025-02-25 17:52 Слава: А потом уже апостолов\n[295593] 2025-02-25 17:52 Слава: Ну у меня очевидно\n[295594] 2025-02-25 17:52 Слава: Бенжимен Кирби Теннисан\n[295595] 2025-02-25 17:53 Миколай: ааа\n[295596] 2025-02-25 17:53 Миколай: прям так\n[295597] 2025-02-25 17:53 Слава: То бишь Бен 10\n[295598] 2025-02-25 17:53 Слава: А ты как придумал\n[295599] 2025-02-25 17:53 Слава: ?\n[295600] 2025-02-25 17:53 Миколай: тогда у меня много персов любимых блин\n[295601] 2025-02-25 17:54 Миколай: первым в голову сайки кусуо пришёл\n[295602] 2025-02-25 17:54 Миколай: но он не самый активный и не думаю что лучший варик для обыгрывания\n[295603] 2025-02-25 17:54 Миколай: потом пришел в голову аквас или как его из Бакуган\n[295604] 2025-02-25 17:55 Миколай: ну тоже хз, он слишком яркий\n[295605] 2025-02-25 17:55 Слава: Характер персонажа Бена Теннисона из «Бен-10 Омниверс» характеризуется как избалованный, высокомерный, раздражающий и незрелый. Он шутит даже в бою, гордится собой, завышая свои заслуги и принижая чужие, реагирует на славу как на должное и ведёт себя как эгоист. 1\n\nНесмотря на это, Бен мужественный, заботливый и в целом добродушный. Он всегда готов спасти других в любое время, даже если это ставит миссию под провал. 1\n\nПри необходимости Бен проявляет смекалку, проницательность и хитрость, которые не раз выручали его из опасных ситуаций, особенно когда невозможно активировать Омнитрикс и превратиться в одного из супергероев. 3\n\nУ Бена есть и жестокая, агрессивная сторона: когда ему не удаётся спасти кого-то, он беспокоится о благополучии своих близких или если люди страдают из-за его неудачи, он злится и набрасывается даже на людей, которые ему небезразличны.\n[295606] 2025-02-25 17:55 Миколай: короче, тола я буду играть того кто у меня прямо сейчас на аве\n[295607] 2025-02-25 17:55 Миколай: хотяя\n[295608] 2025-02-25 17:55 Миколай: он тоже близос моему характеру\n[295609] 2025-02-25 17:56 Миколай: поэтому\n[295610] 2025-02-25 17:56 Миколай: я решил\n[295611] 2025-02-25 17:56 Миколай: буду играть шимпачи из гинтамы\n[295612] 2025-02-25 17:57 Миколай: Шинпачи является самым серьезным героем, показанным в Гинтаме. Шинпачи весьма добрый и спокойный персонаж, однако иногда нелогичность Гин-сана или других персонажей настолько его выбешивает, что он становится чрезмерно эмоциональным, крикливым, легко впадает в истерику. Например, в 584 главе, когда Гинтоки, стукнувшись лбом с Умибозу, сказал, что теперь он стал сильнейшим, Шинпачи завопил: «Чёрта с два! Каким местом?! Ты же себя покалечил!»\n\nПри этом нужно сказать, что Шинпачи на пару с Ямазаки являются самыми скучными персонажами Гинтамы, у них даже соревнование по этому поводу было в 99 серии\n[295613] 2025-02-25 17:57 Миколай: норм?\n[295614] 2025-02-25 17:57 Миколай: тоже как-то не ярко\n[295615] 2025-02-25 17:58 Миколай: эх\n[295616] 2025-02-25 17:59 Слава: Ну такой себе\n[295617] 2025-02-25 17:59 Слава: Это же типо на тебя похоже\n[295618] 2025-02-25 18:00 Миколай: В отношении характера, Кагура - гордая и жесткая воительница, которая не боится говорить откровенно. Она остроумна и часто придумывает креативные решения проблем. Несмотря на свою крепкую внешность, Кагура добра и заботлива по отношению к своим друзьям, особенно к главному герою сериала, Гинтоки. Хотя она имеет склонность к насилию, это часто играется в шутку и не является настоящей угрозой для ее друзей.\n[295619] 2025-02-25 18:00 Миколай: бля, как будто все на меня похожи\n[295620] 2025-02-25 18:03 Миколай: Таня — очень сложный персонаж. В своей прошлой жизни Таня описывала себя как человека со множеством комплексов, а себя — как извращенца. У нее есть как комплексы превосходства, так и комплексы неполноценности, что видно по тому, как она сравнивала себя с настоящими гениями, с которыми не могла конкурировать, и в то же время желала быть выше других.\n\nПсихопат\nУ Тани много социопатических черт: холодная, расчетливая, и часто видит в других людях объекты, которые она может использовать в своих интересах. Это позволило ей быстро подняться по карьерной лестнице в обеих жизнях.\n\nТаня верит в цифры, следуя Чикагской школе экономики , которая утверждает, что все имеет свою цену. Это видно по тому, как эффективно она подбирает и повышает своих подчиненных, чтобы они стали ценным человеческим ресурсом, который она может использовать. Это также позволяет ей стать очень эффективным командиром, поскольку она является и решительным стратегом, и хитрым тактиком, которому не мешают эмоции.\n\nТаня также видит себя как прибыльный человеческий ресурс, делая все, чтобы повысить свою ценность в глазах начальства, что заставляет ее строить из себя идеального солдата с момента ее вербовки. Это впечатляет и одновременно нервирует ее товарищей, особенно Эриха фон Реругена , который считает ее психопаткой за ее беспощадность.\n\nИногда эта черта становится для нее недостатком, например, из-за отсутствия эмпатии, которая не позволяет ей ставить себя на место других людей. В частности, из-за отсутствия понимания того, что люди, которых она оскорбила своими бессердечными пренебрежениями, могут отомстить ей.\n\nЛибертарианец\nОна также является либертарианкой, как можно увидеть из ее монолога о свободе воли и цели для комфортной жизни в тылу. То, чего она искала и в прошлой жизни. Эта черта личности также является источником ее разочарования тем, как Имперская армия относится к своим солдатам, в которой миссия является абсолютом, и она не могла не подчиниться даже самоубийственным миссиям. Вот почему Таня также ненавидит Being-X за неуважение к ее свободе и намерение обратить ее даже против ее воли.\n\nПарагон\nБлагодаря своей вере в теорию сигнализации Таня надевает маску идеального солдата. На первый взгляд, Таня — это то, к чему должен стремиться имперский солдат. Суровый сторонник дисциплины, который все еще заботится о жизни и безопасности своих солдат. Невероятно сильный и жестокий воин, который все еще придерживается международных законов. Человек с острым тактическим умом, непоколебимой храбростью и несомненной преданностью своей стране. Офицер, который тем не менее остается скромным и уважительным даже к унтер-офицерам. Набожная верующая, которая часто призывает Бога благословить свою страну. Все это делает ее вдохновляющей фигурой, тот факт, что она молодая девушка, только заставляет взрослых вокруг нее обещать работать усерднее.\n\nУ Тани железная вера в свою идеологию и методологию, поэтому она также не замечает, что то, что она делала в прошлой жизни, не дало того же результата в ее нынешней карьере и графике. Чаще всего она предполагала, что другие солдаты разделяют ее образ мышления, например, отказываются подавать заявку на опасное задание, что приводит ее к серии неудач в достижении цели. Хотя она и заметила, что не получила желаемых результатов, Таня упрямо верит, что ее метод не является причиной.\n\nАниме-версия\n[295621] 2025-02-25 18:03 Миколай: это думаю ваще не моё\n[295622] 2025-02-25 18:04 Миколай: норм?\n[295623] 2025-02-25 18:04 Слава: Твой\n[295624] 2025-02-25 18:04 Миколай: ?\n[295625] 2025-02-25 18:04 Слава: Только че за таня\n[295626] 2025-02-25 18:04 Слава: Да\n[295628] 2025-02-25 18:05 Миколай: военная хроника маленькой девочки\n[295629] 2025-02-25 18:05 Слава: Ну вперед и с песней катюша\n```</div>"}];</script>
