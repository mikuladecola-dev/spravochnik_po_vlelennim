] 2025-10-18 14:20 Миколай: ты скинут 1701 фото видео гифку в сумме\n[375786] 2025-10-18 14:21 Миколай: а ты?\n[375787] 2025-10-18 14:21 Миколай: а, ну и там 3000 которые ответ на сообщение\n[375788] 2025-10-18 14:22 Слава: Нет\n[375789] 2025-10-18 14:22 Слава: Идеи перебираю\n[375790] 2025-10-18 14:23 Миколай: я пока не начал и это\n[375791] 2025-10-18 14:23 Миколай: но надо бы\n```\n\n### Версия 5 — 2025-10-18\n\nвселенная: вне вселенной (разбор «неясно») · окно w0106 · сообщения 375843–375852\n\n*что здесь: первый codepen-набросок справочника, собранный из одного сообщения Славы про правителей; Слава одобряет формат*\n\n\n\n```chat\n[375843] 2025-10-18 18:02 Миколай: https://codepen.io/Pitator-the-flexboxer/full/yyepXbQ\n[375844] 2025-10-18 18:03 Миколай: что если так?\n[375845] 2025-10-18 18:03 Миколай: ну примерно\n[375846] 2025-10-18 18:03 Миколай: ваще простенький набросок, но вот если так будет\n[375847] 2025-10-18 18:03 Миколай: почитай\n[375848] 2025-10-18 18:03 Миколай: это только по одному твоему сообщению\n[375849] 2025-10-18 18:03 Миколай: Правители \nЭто не физические существа появившиеся в нигде и в ни чем. Они первыми, что появилось в пустоте. И именно они начали создавать мир. По своему желанию.( между всеми мирами есть связь, которую не может оборвать не один правитель) \nПервым правителем был правитель кильке. Вторым же был правитель рая. Поэтому их мир в разы больше миров других правителей. \nСущества, что живут в мирах могут их покидать:\nС помощью ритуала???;\nМожно дойти до края мира, если ваш мир маленький или средний. И прыгнув за край мир вас перенесёт в другой мир. ( чаще всего килькв. Так как существа, что покидають свой мир. Неосознанно перемещаться по связи, а связь с килькой у каждого другого мира сильная);\nМожно попасть в пространственную аномалию;\nВас может выкинуть сам правитель ( очень очень очень, крайне редко). \n\nЛюбое существо может покинуть свой мир если будет знать способ. Но всё существа кильке не способны покинуть свой мир. Не каким либо образом. \nУ правителей есть дети, которых зовут Протобионты . Это субъект, который был создан именно правителем, а не из-за особенности мира. Подобные субъекты имеют огромную силу, которая в теории позволит уничтожить континент. Но большинство существ спокойный и миролюбивый. При этом они очень не любят покидать мир своего родителя. \n\nПравители способны давать благословение. То есть настраивать связь с существом живущими в мире ( благословения даётся только существами живущими в кильке). Настроив это связь с существом ( без его разрешения). Правитель способен передавать свою силу через эту связь к существу( человеку чаще всего). Сама связь устанавливается на мозге. То есть сила или энергия проходит через мозг вредя ему. Поэтому благословенный не часто используют благословения. Ведь это вредит мозгу. Средние продолжительность жизнь у благословенного после получения благословения 10 лет. \nСпособность благословенных. При активации благословения ( то есть пропускания энергий через мозг). У всех благословенных есть четыре основных способности: усиленная регенерация; усиления тела и всех чуств; аура( то бишь самая энергия, которая выплескивается и заставляет чувствовать страх е животных и обычных людей. Так же способный влиять на окружающей. При сильном скоплении) ; сенсорика ( позволяет ощущать других благослрвенных и арбетара или Протобионтов). \nТакже у благословенного есть уникальная способность правителя (под уникальным подразумеввется, что у правителя уникальная благословенния дающий отличающий от всех других благословенной способность. НО если правитель, что дал вам благословения. Даст благословения ещё другому человеку. То оно будет такой же, как и у вас). Примечания: например вам дали ьлагословенния и ваша уникальность способность это огонь. Вы можете поджечь лес. Но после отключения благословенния весь огонь исчезнет. Также и с другими способностями, который полученый благословеннием. После отключения благословенния они просто исчезают. Буть то огненный шар или остановка времени они просто отключаться. \nПримечание: так как всё благословенный включая апостолов. Получают плюс минус одинаковая количество энергии ( силы). Они являются одинаково сильными. Но это не включая индивидуальность людей. Всё же апостолы всё равно чаще всего сильнее любого другого благословенного. \n\nПримечания: Апостолы это 21 человек получивший благословен от правителя рая. ( 21 это максимальное число благословения, который способен давать правитель рая. Другие же правители дают меньше). У апостолов есть дополнительная способность.  Телепатия между ними. ( они способны разговаривать. На расстоянии и также всем мести. Они также могут отказаться от телепатического общения и прервать разговор). Когда у всех благословенных одного правителя одна и та же способность. То у благословенных правителя рая. Они разные. Так как правитель рая. Посылает им лишь сгустки чистой и необработанной силы, который формируется во что уже только внутри Апостолов. Даруя им уникальные способности.\n[375850] 2025-10-18 18:03 Миколай: по этому\n[375851] 2025-10-18 18:04 Слава: Очень круто\n[375852] 2025-10-18 18:04 Слава: Делай  так\n```\n\n### Версия 6 — 2025-10-18\n\nвселенная: вне вселенной (разбор «неясно») · окно w0106 · сообщения 375859–375886\n\n*что здесь: второй, улучшенный вариант со ссылками-кликами по подчёркнутым словам; Слава сначала не видит разницы, потом признаёт, что так лучше*\n\n\n\n```chat\n[375859] 2025-10-18 19:19 Миколай: Untitled\nhttps://codepen.io/Pitator-the-flexboxer/full/RNrxZNQ\n[375860] 2025-10-18 19:19 Миколай: посмотри ещё такое\n[375861] 2025-10-18 19:19 Миколай: немного попробовал улучшить\n[375871] 2025-10-18 19:38 Слава: Прости я не замечаю различия\n[375872] 2025-10-18 19:40 Миколай: а, ну ты можешь кликать на подчеркнутые слова\n[375877] 2025-10-18 20:23 Миколай: че как это лучше?\n[375886] 2025-10-18 20:51 Слава: Да это лучше\n```\n\n## Неясности\n\n- (w0106) содержимое codepen-страниц в архиве отсутствует — только
