<script>const BASE="../";const DOCNAME="Серые странники";

const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Серые странники\n\n*персонаж* · вселенные: Новый мир\n\n## Навигация\n\n- (w0036) Единственный пункт из большого списка существ (175848), который Славе понравился и который тем самым вошёл в мир.\n\n## Связано с\n\nНовый мир\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-06-04\n\nвселенная: Новый мир (объявлено) · окно w0036 · сообщения 175845–175866\n\n*что здесь: Загадочные существа, не принадлежащие ни к одной из сторон и преследующие свои цели; Слава прямо отбирает их из списка, отвергая остальное*\n\n\n\n```chat\n[175848] 2024-06-04 01:49 Миколай: Для темной, светлой стороны и смешанных персонажей можно предложить следующие варианты существ:\n\nТемная сторона:\n1. Тенеморфы - существа, созданные темными колдунами, которые могут принимать облик теней и проникать в самые защищенные места.\n2. Кошмарные твари - порождения страхов и негативных эмоций, вызывающие ужас и отчаяние у своих жертв.\n3. Некромантские слуги - оживленные трупы или скелеты, подчиняющиеся воле своих создателей.\n4. Энергетические вампиры - существа, питающиеся жизненной силой и эмоциями других, ослабляя их.\n5. Темные шифтеры - оборотни или метаморфы, способные принимать облик других существ для обмана и проникновения.\n\nСветлая сторона:\n1. Целители - существа с мощными способностями к исцелению и восстановлению, помогающие раненым и больным.\n2. Светящиеся стражи - создания из чистой светлой энергии, защищающие невинных и борющиеся со злом.\n3. Мудрые древни - древовидные существа, обладающие глубокими знаниями и способные давать советы и наставления.\n4. Звездные духи - эфемерные создания, связанные с небесными телами и помогающие в навигации и предсказаниях.\n5. Животные-компаньоны - звери с повышенным интеллектом и способностями, служащие верными спутниками и помощниками.\n\nСмешанные или нейтральные персонажи:\n1. Серые странники - загадочные существа, не принадлежащие ни к одной из сторон и преследующие свои собственные цели.\n2. Стихийные духи - воплощения природных сил (огонь, вода, земля, воздух), чье отношение зависит от обстоятельств и окружения.\n3. Механические конструкты - искусственные создания, наделенные разумом и свободой воли, выбирающие свой путь.\n4. Космические сущности - древние и могущественные создания, чьи мотивы и действия не всегда понятны смертным.\n5. Полукровки - существа, рожденные от союза представителей разных рас или носителей разных энергий, вынужденные искать баланс внутри себя.\n\nЭти варианты могут быть отправной точкой для создания разнообразных персонажей и существ в вашем мире. Вы можете комбинировать, модифицировать или добавлять новые идеи в соответствии с вашим видением и потребностями сюжета. Главное - сохранить внутреннюю логику и последовательность в описании этих существ и их роли в конфликте между темной и светлой энергиями.\n--- пауза 5.2 ч ---\n[175863] 2024-06-04 07:00 Слава: Чёт ничего не понравилась кроме серых странников\n[175864] 2024-06-04 07:01 Слава: Ещё один вид в сторону добра провидцы вымирающий вид ( потому что они сходят с ума из за своей способности и по итогу чаще всего заканчиваются суицидом ) \nИх способность петля времени ( надеюсь ты не забыл )\n```\n\n## Неясности\n\n- (w0036) Формулировка пришла из машинной вставки 175848, но принята автором в 175863 — берём как материал с оговоркой</div>"}];</script>
