ира, из за &quot;смерти&quot; она после нашей кончины не даёт остаться в нашем мире и вечно отправлять нам куда-то \nИ вообще почти во всех мирах есть правитель( существо правящий этим миров )\nИ вот эти правитель могут дать свой благословение, но они могут дать свой благословений только людям из нашего мира\n```\n\n### Версия 2 — 2025-01-06\n\nвселенная: Апостол (по дате объявления) · окно w0070 · сообщения 278875–278892\n\n*что здесь: Смерть таскает души в другие миры; её создало существо, правящее нашим миром*\n\n\n\n```chat\n[278875] 2025-01-06 14:25 Слава: Смерть таскает наши души в других миры\n[278876] 2025-01-06 14:26 Миколай: как он правит? у всех миров есть правители?\n[278877] 2025-01-06 14:26 Миколай: ей платят за это? нахуя она это делает? вредная привычка?\n[278878] 2025-01-06 14:26 Слава: Связь все миры связаны с нашем миров поэтому случается так что они могут попасть в наш через край своего мира \nМы же пока живы не можем попасть в другой мир\n[278879] 2025-01-06 14:26 Слава: Да\n[278880] 2025-01-06 14:27 Слава: Он может изменять этот мир как хочешь ведь это его мир\n[278881] 2025-01-06 14:27 Миколай: я прочел, ты писал, ок\n[278882] 2025-01-06 14:27 Миколай: размеры тоже?\n[278883] 2025-01-06 14:27 Слава: Существо являющий правителем нашего мира создала смерть которая таскает души в разный миры\n[278884] 2025-01-06 14:27 Миколай: а наш кто создал?\n[278885] 2025-01-06 14:27 Слава: Нет\n[278886] 2025-01-06 14:28 Слава: Существо\n[278887] 2025-01-06 14:28 Миколай: а есть кто-то кто контролирует все миры?\n[278888] 2025-01-06 14:28 Слава: Нет\n[278889] 2025-01-06 14:28 Слава: Но самым сильном является &quot; существо&quot;\n[278890] 2025-01-06 14:29 Миколай: че такое душа\n[278891] 2025-01-06 14:29 Миколай: как они копируют наш мир\n[278892] 2025-01-06 14:29 Слава: Это мы, наш фантомный облик\n```</div>"}];</script>
