я писать. Поэтому ИС) . И конечно это ни чем не кончилось. Правительство не могло разрешить проведение подобных экспериментов. А если бы разрешили. То сверхлюди конечно пошли против и это ни чем хорошим не кончилась. Но на заметку после нуар лишь ещё один проект по созданию ИС удался. Проект апостолов. 12 созданных ИС. Но его уже на публику не раскрывали. \nКульт всё ясно. Просто ебланы который верит во что-то ( у меня всегда с верующими проблема, я никогда ничего нормального придумать не могу) ну 4 епископа.\n[487002] 2026-06-02 08:51 Слава: На стороне ассоциации 6 столпов. Тобишь шесть сильнейших Героев. В ней входит граф и нуар, ну ещё челики который я потом расскажу\n[487003] 2026-06-02 08:52 Слава: Также и у злодеев есть шесть столпов ( так сказать разрушение) я ещё конечно их не придумал. Ну там как минимум будет безумная девка. И старик со способностью гравитации, который бы досканкльно придумали\n[487004] 2026-06-02 08:53 Слава: Ну и апостолы которые держут нейтралитет. Конечно не все. Вот Граф один из столпов героев\n[487005] 2026-06-02 08:54 Слава: Ну и получается \n6 героев, 6 злодеев, 4 ахрепископа, 12 апостолов, ну и кто-нибудь из Нимба\n[487006] 2026-06-02 08:56 Слава: Кстати до этого ИС. Ну до Нуара. Были тоже в принципе не плохие. Ну большинство из них теряли рассудок или у них появлялись дефекты тела или они умирали. Превращались в жижу ну и т. Д. \nНуар первый ИС кто сохранил разум и получил способности без каких либо дефектов.\n```\n\n## Часть чего\n\nВселенная героев и злодеев</div>"}];</script>
