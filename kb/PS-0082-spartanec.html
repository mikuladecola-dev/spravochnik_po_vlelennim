const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Спартанец\n\n*персонаж* · вселенные: Цветной мир\n\n## Навигация\n\n- (w0035) Напарник имитатора. Ходит полностью голым — только железные ботинки, трусы и шлем. Способность обсуждается: варианты про мышцы (увеличение как в МГА, либо мышцы размером с остров, спрятанные в маленьком теле, как у Оливы в «Баки»).\n\n## Связано с\n\nИмитатор\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-05-25\n\nвселенная: Цветной мир (объявлено) · окно w0035 · сообщения 173135–173147\n\n*что здесь: Появление и внешность; Миколай предлагает две известные концепции мышечной силы, Слава оставляет вопрос открытым.*\n\n\n\n```chat\n[173135] 2024-05-25 14:01 Слава: Когти скорость инстинкты регенерация\n[173136] 2024-05-25 14:02 Миколай: А спартанец?\n[173137] 2024-05-25 14:03 Слава: Кстати спартанец напарник имитатор ( имитатор один из сильнейших существ в той вселенной ) и вот какую дать способности спартанцу \nОн будет ходить полностью голый только в железных ботинках, трусах и в шлеме\n[173138] 2024-05-25 14:04 Слава: ⁉\n[173139] 2024-05-25 14:04 Миколай: Ну\n[173140] 2024-05-25 14:05 Миколай: Есть 2 концепции известные\n[173141] 2024-05-25 14:05 Миколай: 1 даже в той вселенной выдумка\n[173142] 2024-05-25 14:05 Миколай: Или как Мга мышцы увеличивать\n[173144] 2024-05-25 14:06 Миколай: Или как в баки бесквит Оливер мышцы размером с остров прячет в маленьком теле\n[173145] 2024-05-25 14:07 Слава: И кстати раз пошли суда то ещё вопрос\n[173146] 2024-05-25 14:09 Миколай: По идее норм концепция, можно дополнить или объединить с другой\n[173147] 2024-05-25 14:09 Слава: В той вселенной командир сильнейшего отряда\nПосле развала команды построил приют для детей в отшибе от люде
