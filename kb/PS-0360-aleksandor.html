const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Александор\n\n*персонаж* · вселенные: неясно\n\n## Навигация\n\n- (w0120) Мистер белая рубашка. Невероятно везучий: при риске выигрывает десять из десяти (промажут, споткнётся, пистолет заклинит). Дебафф — если не рискует, еда не удерживается, словно чья-то рука лезет в горло и выворачивает желудок.\n\n## Связано с\n\nБлагословенные\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2026-04-19\n\nвселенная: неясно (по дате объявления) · окно w0120 · сообщения 462204–462206\n\n*что здесь: первое описание удачи и её обратной стороны*\n\n\n\n```chat\n[462204] 2026-04-19 13:31 Слава: И пока что основой послужат благословенный, одарённый, и т. Д. Щя скину тебе кто они\n[462205] 2026-04-19 13:31 Слава: Допустим есть благословенный. \nБлагословенный это люди, что способны чувствовать присутствия когото. Кого именно неизвестно, может бог, может ещё какое-то существо. \nИ вот три персонажа который благословенный. \nПервый Герой. Он способен слышать его шёпот.который говорит &quot;герой молю спаси... &quot;&quot; Герой помоги&quot;&quot; Герой, герой герой&quot; Ну и таму подобная. Он слышат это когда людям нужна помощь и так они внутренние обращаються к нему. Пот помощью подразумевается материальная, физическая и духовна. А так же этот шёпот в некотором роде предсказывает будущее. То есть если человека должа сбить машина, то Герой заранее услышат мольбу о помощи.  Минус в том что если он не спасёт тех кто молил о помощи. То ему будут сниться кошмары, настоль страшный, что просто думать о с ней будет пугать Героя. Ну и при этом у него также есть плюс. Он каждый раз когда присмерти, ну там ему голову пристрелили или машина сбила или он упал с десяти этажки. Он вырубается и слышат голос &quot;герой пора вставать&quot; Ну и он просыпается в больнице живой. А врачи диву даются. \n\nМистер белая рубашка, ну то есть Александор. Он же невероятно везучий. Например если его попытаться застрелить то либо промажуть, либо Саша сам как-то споткнеться, либо пистолет заклинит и даст осечку. Подобная удача, где он десять из десяти выигрывает. Но если он не рискует. То если он попытается поесть, в его горло словно че я та рука залезет и спуститься в желудок, и начнёт его выворачивать. И Сашу конечно стошнит. \n\nЮра. Он тоже вроде Героя в каком-то роде может будущее предсказывать. Вот он видит две белый точки, то бишь глаза не понятного существа, а это означает что сейчас будет опасна. Ну и так он способен предсказывать опасность. Ну и он как и в тех двух случаях как-то не способен умереть. Ну он заранее знает о опасности и может её избежать. А если всё же попадёт в неё то как-то спасется, иногда опасность самая может устранить себя. То есть в случае опасности он тоже удачлив, конечно не так как Саша, ну вполне достаточно чтобы выжить. \n\nИ вот четвёртый. Он чувствует запах его. Этот запах чём-то напоминаете дом. То есть вот долго жил в своём доме и вдруг ты оттуда надолго уходишь. А когда возвращаясь то чувствуешь вроде привычный но словно незнакомый запах, но он тебя всё равно успокаивает. Вот подобном запах он ощущает. Он может изменяться. Он как бы по запаху может определить ждёт их хорошая или плохое. И в независимость плохое будет или хорошое он должен будет идти за ним иначе запах станет смердящим. Настолько что его будет тошнит и он будет вырубаться. \n\nПятый азуриэль. Он способен чувствовать эмоции людей. А иногда он способен чётко ощутить эмоции нечто, который опять же его куда-то ведут. Если он не пойдёт  то его способности умиляться и он более отчётливо начнёт осушать чужие чувствовать, а так как их много он начнёт сходить с ума от этого. \n\nСедьмой Максим. Он сверхчеловек. Его восприятия ускорения. То есть для него всё люди мед
