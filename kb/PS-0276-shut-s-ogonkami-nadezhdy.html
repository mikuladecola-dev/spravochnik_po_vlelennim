о перемотал вперёд.\nЯ пытался жить, честно. Смешно оправдываюсь перед самим собой. Но всё же я пытался продолжить жить. Пошёл на работу, в котором начальник поинтересовался моим самочувствием и сказал, что вполне может дать мне выходный. И ещё на удивление. Не списал меня, как работника завода. А сделал оплачиваемый больничный. А сам же он. Начальник выглядел слегка уставшим. Словно только вчера напился. \nРаботал я, как никогда. Я хотел утонуть в работе, чтобы не думать, не помнить. Но мысль всё лезли и лезли. И я всё слышал этот неприятный звук таскания топора об бетон. И прекрасно знал, что это мой палач. Мой личный.\n И даже тогда, когда я уходил последний с работы и приходил первым. Даже работая на убой, что даже ложку было тяжело держать. Что я вообще вырубался стоя. Но даже так. Мысли и воспоминания всё лезли. Погружали меня в пучину гнева и ярость на самого себя. Я держался. Ведь нельзя. Ведь если я начну пить или хоть что-то принимать. То я же там погрязну и уже не вылезу.\n```\n\n## Неясности\n\n- (w0097) Неясно, самостоятельная фигура или только образ внутри галлюцинации</div>"}];</script>
