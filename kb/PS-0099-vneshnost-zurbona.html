вает чтобы на них похоронить противника.\n\nЦилиндр на голове, медный монокль на левом глазу. Одет в чёрный фрак, галстук в стиле стимпанк, на руках множество перстней и браслетов с реальным механическим функционалом, брюки подвернуты и выглядят как шорты, на икрах татуировки дырок вы коже, которые трипофобов люто пугают\n```\n\n### Версия 2 — 2024-06-21\n\nвселенная: 7 островов (по дате объявления) · окно w0038 · сообщения 185194–185201\n\n*что здесь: рисунки внешности и тату, обсуждение того, насколько передан возраст*\n\n\n\n```chat\n[185194] 2024-06-21 15:05 Миколай: Такая примерно у него внешка\n[185195] 2024-06-21 15:05 Миколай: Такое тату\n[185196] 2024-06-21 15:06 Миколай: Много попыток было, единственная норм\n[185197] 2024-06-21 15:06 Слава: Я думал старик с длинными усами\n[185198] 2024-06-21 15:06 Миколай: Ну ему 34\n[185199] 2024-06-21 15:06 Миколай: Норм, ещё молодой\n[185200] 2024-06-21 15:07 Миколай: На скорее тогда так\n[185201] 2024-06-21 15:07 Миколай: Тут уже возраст хорошо передан\n```\n\n## Часть чего\n\nЗурбон</div>"}];</script>
