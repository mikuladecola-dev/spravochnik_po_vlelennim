<script>const BASE="../";const DOCNAME="Черновики Славы";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Черновики Славы\n\n*служебное* · вселенные: вне вселенной\n\n## Навигация\n\n- (w0109) Авторская рабочая сводка о собственных текстах: начинал четыре истории, дописал до середины и забросил; всего скопилось штук 7 черновиков, которые собирается прогнать через нейросеть.\n\n## Связано с\n\nАтцыс (белогзазый выродок)\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-11-20\n\nвселенная: вне вселенной (разбор «неясно») · окно w0109 · сообщения 387130–387165\n\n*что здесь: Зафиксирован состав задумок и самооценка: взаимодействие людей прописано хорошо, замысел слабоват, концовка глупая; не хватает навыка работы со словом.*\n\n\n\n```chat\n[387130] 2025-11-20 00:22 Слава: Вообще я начинал писать где-то четыре истории и дописал до середины но после забросил\n[387131] 2025-11-20 00:23 Миколай: но он и старше тебя на 3 года\n[387132] 2025-11-20 00:23 Миколай: он тоже забросил\n[387133] 2025-11-20 00:23 Миколай: это норм\n[387134] 2025-11-20 00:24 Миколай: если хочешь могу туда кинуть что-нибудь, вдруг не получается открыть. вину например кину или чет другое\n[387135] 2025-11-20 00:24 Слава: Не в одной история я прям так хорошо прописал взаимодействие людей, но сам замысел истори  был слабоват и даже глупая концовка должна было её ожидать\n[387136] 2025-11-20 00:24 Миколай: ну так ты же учишься\n[387137] 2025-11-20 00:24 Миколай: ты не можешь уметь всё сразу\n[387138] 2025-11-20 00:24 Слава: Атцыс ( белогзазый выродок) \n\n- Дядя Серёга а мы точно идём, а то как бы болота начинается - сказал взволнованный Арсений лет 18.Он впервые пошёл за грибами в местный лес. Да и не пошёл бы он если бабушка не настоял бы на этом. Отказать её он не мог. \n- да не бойся ты. Правильно идем, да придётся к болоту подойди. Но грибы там вот таки - начал дядя Сергей руками показывать невероятный размеры грибов.  У Арсения же не возникло не какое мотивации. Ему бы хватило и мелких грибов или возможно даже поганок. \nСолнце всё продолжало прожигать панаму, что было на голове Арсения. Да и по хлипкой и чавкующий земле было идти тяжело. Ведь ноги прилипали, словно Арсений муха прилипший скотчу наклеенными злыми людьми. Хотя был всё же один плюс воздух был достаточно прохладным и влажным, что придавало хоть, какие-то силы. Но даже этот плюс не спасал от мысли просто уйти. И он возможно правда бы ушёл  знай он дороги, и если бы не бабушку, которой он был до безумство благодарен. \nАрсений устал взглянул на третьего участника их  похода за грибами. \nЭто был достаточно пожилой старик, что также как и Арсений и Сергей нёс тяжёлый рюкзак. Ну по лицу не скажешь, что устал хотя бы на половину как Арсений. Словно старик, как и дядя Сергей не замечали пылающие солнца и липкую землю, а также тяжёлый рюкзак, что придавливал к земле. \nВдруг Арсений почувствовал некий стыд. Да чего это он правда разнылся вот старик идёт и слова не скажет, лишь целеустремлённая смотрит вперед. \nАрсений громко выдохнул и смотря на своё грязный кроссовки потопал вперёд уже молча. \n\n\nНаконец-то дойдя до долгожданное полянки. Арсений сбросив рюкзак присел на него. Пока дядя Сергей словно в нечем не бывало уже начал собирать грибы. Старик же всё привстал поэтому решил в рюкзаке поискать воды. \n-смотри во- дядя Сергей сунул в лицо отдыхающего юные большой гриб по его мнению. По мнению же Арсения гриб не был уж таким большим, чтобы делать весь этот путь. Но он решил ничего не говорит, лишь покачал головой. \nПосидев  ещё минут пять. Юноша всё же собрался силами и начал выполнять цель данного похода. Старик же всё рылся в огромном рюкзаке, что-то проговаривая про себя. \nНемного погодя к нему подошёл Сергей, который уже знатно так собрал грибов. \n-помочь! ? - громко спросил высокий и плечистый мужчина. Старик глянул на него и ответил. \n-тьфу тебя, как ты рюкзак складываешь. Не найти ничего - отругал старик огромного мужчину. \n-так что искали то - продолжил Сергей. \n- да воду - процедил старик уже не смотря на Сергея. \nСергей же спустил рюкзак, который всё это время был на нём и нырнув туда рукой сразу же достал 2 литровую бутылку воды. \nСтарик даже слегка изумился тому, как быстро Сергей нашёл воду в этих лабиринтах вещей построенным им же. \nСергей протянул воду старику. Тот же взял воду и начал жадно пить. \nСергей внимательно посмотрев на жадно пьющего старика. Оглянулся ищя взглядом самое сухое место. Наконец-то найдя его. Он крикнул махнув рукой. \n-Эй Арсений идти суда привал! - Арсений, что задумчиво собирал грибы. Подпрыгнул от резкого возгласа дяди Сергея. Он огляделся и заметил махающего руками дядю Сергея выдохнув про себя он встал. Колени стрельнули от резкого подъёма юноши. Арсений даже слегка зашатался, но всё же пошёл к сухому островку на котором уже раскладывал вещи дядя Сергей. \n\n- и сколько мы здесь будем? - спросил Арсений набивая себе рот вкуснейшими в его жизни бутербродами. \n-дайка подумать - сказал Сергей почесывая щетину. \n-ну час ещё грибы по собираем и пойдем-\nОбразовалось неприятная тишина. Даже птиц, что щебетали всю дорогу до сюда примолкли. \n\n- а вы слышали легенду- вдруг начал старик. \n-нет- решил поддержать его Арсений, потому что ему не нравилось сидеть в полной тишине. \n\n- во время Второй мировой войны в нашем посёлке еды не было, всё собрали эти вояки - Арсений слегка удивился ведь он ожидал легенду, а это уже похожа на историю. А Сергей слегка нахмурился словно вспоминал рассказы своего деда\n[387139] 2025-11-20 00:24 Слава: - Так вот был я тогда щеглом младшее тебя Арсений. Хотя о чем это я - махнул рукой старик - - мне тогда едва стукнуло десять лет. Голод был лютый. Люди буквально умирали пока шли куда-то, а хранить их сил не у кого не было. Наверняка много у кого были мысли о каннибализме - Арсений подавился бутербродом от удивления. Он конечно знал что каннибализм был во время второй мировой. Но он не ожидал, что и их нём посёлке такой могло быть. \nСергей подал крышку от термоса, в которой был залит тёплый чай. Арсений с благодарностью принял. Старик лишь слегка усмехнулся и продолжил\n-не было у нас каннибализма. Как жрать друг друга, когда каждого в лицо знаешь, когда ты нянчился с их детьми или когда они помогали тебе там забор сделать, крышу починить. Так что голод голодом, а человечность всегда должна быть кхм- старик закашлялся. Он быстро взял бутылку воды и выпил одну треть одним залпом. \n- да всё же уже не как раньше могу балаболить. Ну и вот лес был для нас спасением. Всё же там ягоды,  и грибочки собирать, да и животные никуда не делись. Хотя сам я так не одного животного не поймал. Меня вообще не допускали к этому. Нам детей посылали вместе с женщинами грибы да ягоды собирать. Поэтому старики нынешней это лес знают, как свои пальцев. Как никак в детстве его облазили. Так к чему это- призадумался старик. Поняв, что ушёл в не ту сторону воспоминаний. \n- кхм и так сестра моя однажды очень страшное заболело- Арсений сразу начал вспоминать видели он, когда сестру старик. Ужаснулся поняв, что сестру старик он за всю свою жизнь не видел. Хотя может быть она от старости умерла. Пытался обмануть себя Арсений -  ну и понятное дело лекарств не было. Откуда им взяться то. И в одну из ночей лёжа с ней в одной комнате. Так как спать больше не где было. \nУснуть было невозможно под стоны и кряхтение сестры. Да и сердца кровью обливалось от бессилия - старик жал руку на груди. Его взгляд стал грозным и даже страшным\n- и что дальше - спросил Сергей всё это время молчавший. Арсений был ему благодарен,ведь он хотел услышать до конца. Но боялся спросить. \nСтарик выдохнул и продолжил - сбежал я тогда из дома. Не знаю зачем? И куда? Помню было в мыслях какую-нибудь траву найти и принести. Может лекарство будет. Всё же я хотел хоть что-то сделать. Хотя бы по попытаться. Но найти какую нибудь полезную траву не разбираясь вообще в этих травах. Нет я конечно знал, что есть можно, что нельзя. Но что может быть полезно я знать не знал. Сейчас конечно уже знаю  - усмехнулся старик \n-гулял по сути я тогда просто по лесу. Во тьме, да и под эмоциями убежал я близ болота. Даже и не помню, как я там оказался если честно. Но очень чётко помню, каким болота было красивым. Хотя каким было, оно и сейчас наверное такое. \nВыбежал я, к болоту в грязной обуви. И начал пытаться отдышаться. И вижу эту красоту. Луна отражается от водной глади освещая всё вокруг, а светлячки летали, здесь словно звезды. И всё камыши и кувшинки под луным светом стали очаровательными.- Арсений представил и это картина и правда показалось ему красивой. Сергей же лишь почесал щетину. Ему явно не хватало фантазии - \nМеня это успокоило и породило, что-то тёплой в груди - поладил уже расслабленную руку на грудь старик мягко улыбнулся. Но после помрачнел. Словно вспомнил что-то -\nТогда я просто сидел там и отдыхал просто морально и физически. Мне тогда был необходим этот отдых, хотя бы чуть-чуть. \nСидел я тогда закрыв глаза, а вокруг меня летали светлячки и воздух был приятно влажным, хотя и пованивал слегка. И возможно я уже засыпал. Не помню точно. \nНо вдруг я услышал вспелк воды. Да не простой, а словно человек упал. Но то есть громкие всплеск был. Точно не лягушка какая-нибудь. Я открыл глаза, а светляки сразу разлетелись, а тучи закрыли полную луну. Сразу стало как-то не уютно. Страшно даже. \nОглядываюсь я значит, а ничего не вижу. Источников света же нету. Встал я, и сразу почуствовал вонючий запах болота, что заполнял легкий. И как намокли штаны от сидения на мокрое земле. И что земля здесь не приятно влажная, а просто липкая и тягучая. Словно кишки, что пытается тебя удержать.\n[387140] 2025-11-20 00:24 Слава: И честно побежал бы я куда глаза глядят. Но мы маленькая часть здравого смысла шептала мне &quot; Здесь болото. Побегу точно застряну и никто меня не найдёт &quot; \nНачал я осторожно шагать сам не зная куда. Прощупывая землю ногой, чтобы в болото не нырнуть. И так словно ёжик в тумане я шёл - &quot;ха, что за сравнения&quot; Недогодовал Арсений. Сергей же лишь ухмыльнулся и начал улыбаться, одобря данное сравнения.-\nИду я так, и всё больше сомневаюсь правильные путь то я выбрал. Ни одного дерева не увидел пока крался. Встал я, и уже думаю в другую сторону идти, а точно в болото булькнусь. \nТолько начал разворачиваться, как вдруг свет появился. И я как полный дуренн обрадовался этому. Не замечая, что свет этот зелёный. Такой ярко зелёный свет бил из болота.\n[387141] 2025-11-20 00:24 Слава: Скинь это\n[387142] 2025-11-20 00:25 Миколай: но то что ты видишь это(недочёты), это круто\n[387143] 2025-11-20 00:25 Слава: Это недоконченный\n[387150] 2025-11-20 00:25 Миколай: новая?\n[387151] 2025-11-20 00:25 Слава: Не забыть скинуть ответ нейра\n[387153] 2025-11-20 00:25 Слава: Да нет из всех четырёх задумок самая старая\n[387154] 2025-11-20 00:26 Миколай: ааа\n[387155] 2025-11-20 00:33 Миколай: бля он реально хорош\n[387156] 2025-11-20 00:33 Миколай: ну ты щас тоже это решишь\n[387158] 2025-11-20 00:34 Миколай: https://telegra.ph/kak-tebe-11-19\n[387159] 2025-11-20 00:38 Слава: не хватает навыка работы со слово\n[387160] 2025-11-20 00:39 Слава: И как это исправить\n[387161] 2025-11-20 00:39 Слава: Типо было сказано прочитать в слух\n[387162] 2025-11-20 00:39 Слава: Ну я вроде так делаю\n[387163] 2025-11-20 00:39 Слава: Ладно я так не делал\n[387164] 2025-11-20 00:40 Слава: Нейросеть да крутая\n[387165] 2025-11-20 00:40 Слава: У меня этих черновиков штук 7 собралось, ей скину потом\n```\n\n## Неясности\n\n- (w0109) Сами четыре истории и семь черновиков в этом окне не выложены.</div>"}];</script>
