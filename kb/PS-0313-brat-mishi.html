<script>const BASE="../";const DOCNAME="Брат Миши";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Брат Миши\n\n*персонаж* · вселенные: вне вселенной\n\n## Навигация\n\n- (w0110) Приезжает после двух лет разлуки, вытаскивает Мишу за грудки с края перрона, везёт в больницу и спит там же на соседней койке в одежде. Говорит с ним по-матерински хлопотливо.\n\n## Связано с\n\nМиша, Улыбка\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-11-21\n\nвселенная: вне вселенной (разбор «неясно») · окно w0110 · сообщения 387588–387589\n\n*что здесь: Спасение на перроне и разговор в палате*\n\n\n\n```chat\n[387588] 2025-11-21 18:19 Слава: Кое как собравшись. Никак не мог завязать шнурки. Они словно змеи двигалась и не давали себя схватить, а когда удавалось, то они брыкались. Словно я их убивать собираюсь. А когда я еле-еле, как завязывал. Они прям на глазах у меня распутывались, как будто бы правда живые. В конце концов я всё же победил. И крепко, на крепко их завязал. \nЛадно перейдем к сути. \nЖдал я своего брата. На перрони захудалого вокзала, который был старшей всех в этом городе. \nВдруг послышалось шум старого поезда, что тянул за собой несколько тонный вагоны. Пыхтел и кашлял поезд. Словно сейчас развалится. Но не на понятной силе держался. Принеся он передо мной. И я даже слегка удивился. Нет, не тому, что он докатился до меня. А от того, что вагоны выглядели новенькими, чистыми, как будто вот только, что их сделали. С электрическими дверями и тому подобное. \nСмотрел я, как эти вагоны проносили передо мной всё медленнее и медленнее. И вспоминал &quot;какой же у него вагон. Вроде, как он писал, а вроде и нет&quot;\nВ этой бы ситуации лучше, что можно сделать- это просто достать телефон. Но я забыл его дома, на кровати. Поэтому я начал  просто вглядываться в окна вагонов, чтобы увидеть лицо своего друга.\nК сожалению вместо лица своего брата. Я увидел, на долю секунды. Улыбающийся лицо и этот взгляд. Пронзающий словно душу, этот взгляд говорит об бесполезности всего. Я сразу отскочил в сторону и наступив на свои развязывающий шнурки. \nЯ не смог удержать равновесия. И всей массой своего тела ударился от бетонные перрон. В голове сразу загудела, зазвенела, а в глазах начали мерцать звёздочки. Голова пульсировало, в неё словно залили горячую воду и она вот-вот хлынет наружу. Горячее всего было на затылке и пульсировало там словно одна большая вена, что порвалась и из неë вытекает горячая жидкость по голове. \nНа трясущихся ногах. Я кое-как встал. В глазах всё мутила и плыло. Из-за этого закружилась голова и я чуть снова не упал. Но смог удержаться. \nЯ услышал хохот. &quot;Чево серьёзно им смешно, что я чуть не упал&quot; Подумал я поднимаю голову. В глазах до сих пор всё плыло. Но даже так я увидел, как толпа вокруг меня улыбаються. Смеются и осторожно, выступив руки вперёд подходят ко мне. Я прикрикнул, и от этого в голове пронеся эхом мой же голос. Он ударялся об стенке черепа и возвращался причиняя боль. \nЯ  прикусил губу, чтобы снова не завыть, а они смеялись и походили. Эти расплывчатый фигуры. С натянутой улыбкой. Всё приближались. Я отступал от них. Неуверенно, неспеша я отходил от этих уродов. Помогите, хоть кто-нибудь. Хоть кто. \nТелефон, где он, где он!!! \nНа моём лице выступили едва видимый слезы отчаяния. Да, что здесь происходит. \nВдруг из толпы резко, кто-то выпрыгнул и быстрым шагом направился ко мне. Я испуганно сделал пару шагов назад. И ещё один шаг. Но теперь я не ощутил бетонного перрона. Там был просто провал. Тела уже начало наклоняться в сторону  и я начал падать. Я за жмурил глаза со всей силы, что заставило голову лишь больше пульсировать. Я уже был готов удариться об поезде или полностью провалиться в яму. \nНо крепкая мужская рука схватила меня за грудки и потянула на себя. На столь резко, что я и моё спаситель плюхнулась на бетон. \nЯ начал отворять веки. Но свет мне мешал их полностью открыть. Кто-то резко схватил меня за плечи. \n-Эй, эй ты меня слышишь Миша. С тобою всё хорошо. Ай да о чем это я. Вставай поехали в больницу- быстро пролепетал знакомый голос. В моей горячей голове сразу возник образ обладатель того голоса. Брат, кто же ещё мог словно мать так лепетать вокруг взрослого мужчины. Хоть и раненого. \nОн грубо подхватил меня за подмышки, что вызвало у меня гологружения. Словно боялся, что я снова попытаюсь спрыгнуть с перрона, либо убежать. Дальше я особо ничего и не помню. \nПомню, как мы сели в машину. А дальше всё пустота. Как сказал брат позднее. Я просто отрубился. Благо снов никаких не было, а то ещё не хватало бы. Хотя вообще бывают сны после потери сознание. Нет наверное.\n[387589] 2025-11-21 18:19 Слава: Очнулся я уже в больнице. С сотрясением мозга. Ну и с гудящей головой. Благо болело уже не так сильно. А то я бы точно не выдержал. \nОчуховшись немного. Я впал ступор слегка. На соседней койке спал мой брат. Вот прям в одежде уснул и всё. Надеюсь он с этой койки не кого не выгнал. Ха. Голову пронзила боль от моего мелкого смешка. \nНа это же проснулся мой брат. \n- че смеёшься? - сказал он сонным голосом. Попутно протирая глаза. \n-да думаю. Не выгнали ты кого с койки- признался я честно. \n-о себе лучше подумай. На ровном месте упал. Ещё так сильно- произнёс брат вставая и подтягиваясь. \n-голова не болит?- спросил он. \n-да нет уже- слегка соврал я. \n-ладно. Тебе кофей взять? - спросил брат выходя из палаты.\n```\n\n## Часть чего\n\nМиша</div>"}];</script>
