ни и вот какой нибудь вампир начал гасить людей , а не питаться мертвыми \nИ это организация обязана его устранить и вот они посылают человека или вампира или оборотня ну кто есть \nВот и все \nЭто не та вселенная которой я хочу здесь чисто принцип\n[150671] 2024-04-01 09:56 Миколай: 🤡\n```\n\n### Версия 2 — 2024-04-02\n\nвселенная: игра бога (по дате объявления) · окно w0029 · сообщения 152590–152605\n\n*что здесь: Слава отказывается от концепции добро/зло в пользу scp-подобной; организация переосмысляется как охота на аномалии*\n\n\n\n```chat\n[152590] 2024-04-02 19:44 Миколай: Дз ща напишу и чекну\n[152591] 2024-04-02 19:44 Миколай: Ток домой пришёл\n[152593] 2024-04-02 19:44 Миколай: Ну вот когда прочитал тогда пришёл\n[152594] 2024-04-02 19:46 Слава: Вообще какую концепцию туда вбахать вообще изначально я хотел что была организация которая борется с злом то бишь добро и зло но сейчас думая мне как то не нравится \nЛучшей будет создать концепцию scp  только вбухать туда и сверхсила типо петли и закона, и экспериментах на людях \nИ другую расу которая будет нам помогать \nВообще концепция охота на аномалий\n[152599] 2024-04-02 20:13 Миколай: Ну ммм, эмм. Тут не совсем опять пон. Ты точно чет хочешь добавить у Поротая как по мне и так много способностей, а концепцию ты придумал, в чем вопрос не пон🤔\nНадеюсь ничего что я так долго не отвечаю, во первых если честно не особо удобно сейчас думать, а во вторых как то я в растерянности, мне прям штурмануть на часика 3 надо мозг, чтобы понимать, что хочу и как. Просто ну ты меня знаешь, если я за что-то берусь, ну мне нужно как-то подзаебаться и выдать чет интересное, ну по крайней мере, чтобы я сам был доволен, а тут мне прям время нужно, так что ты там уточни несколько моментов, которые я попросил выше и напиши как по срочности, чтобы я ну как-то чувствовал рамочки\n[152600] 2024-04-02 20:16 Миколай: Эти 2 дня после каникул прям суета какая-то, не поспеваю\n[152603] 2024-04-02 20:18 Слава: Поротая низший владеет почти
