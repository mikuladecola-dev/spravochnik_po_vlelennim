<script>const BASE="../";const DOCNAME="Два рассказчика";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Два рассказчика\n\n*персонаж* · вселенные: монстры\n\n## Навигация\n\n- (w0062) Две безымянные фигуры, от лица которых идёт рассказ: первый нашёл девочку в степи и объявил девушку монстром, второй возражает и называет её другом.\n\n## Связано с\n\nДевушка, отринувшая смерть, люди смертны и это так потрясающе\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-10-20\n\nвселенная: монстры (по дате объявления) · окно w0062 · сообщения 247842–247843\n\n*что здесь: служебно: в тексте — первый рассказчик ведёт монолог и историю про степь, второй перебивает репликой, что смерть это навык, и рассказывает про расстрел и Антарктиду*\n\n\n\n```chat\n[247842] 2024-10-20 09:28 Миколай: люди смертны и это так потрясающе! ещё с древности идут разговоры об экзистенциальных вопросах, по типу мементо мори, тобиж напутствие &quot;помни о смерти&quot;, которое прямо указывает, знать что ты смертный. тривиальное &quot;быть или не быть&quot; это не самый свободный выбор, ведь ты не сможешь быть вечно. религии гласят о перерождении, о рае и аде. существо в низу распоряжаться твоей душой и твоим фатумом. даже если ты не верующий. некоторые действительно попадают куда-то, некоторые исчезают на всегда, но только после смерти. смерть это не просто награда, это право, которое отнять не возможно. и важно его защищать. но кто будет этим заниматься и точно ли это целесообразное утверждение? неужели кто-то может его отнять? ну, это хороший вопрос, чтобы его раскрыть я расскажу вам историю.\n\nоколо четырёхсот дней назад, я встретил девочку. у неё были яркие, но глубокие голубые глаза, пылающие красные волосы, нет, буквально пламенные, крайне плотная джинсовая куртка, черная юбка и стандартные массовые розовые колготки, обуви не было. она рисовала на песке и я решил присоединиться. вместе бы нарисовали триптих Босха и как кронос пожирает своих детей. причём как я люблю отмечать такие моменты, инициатива в выборе работ для перерисовки была не за мной, а сей юной леди, что меня не удивило. и я вовсе не чёрствый, это действительно впечатляет, однако сие событие было крайне обычным в сравнении с тем, что она была единственным живим существом в той степи. ну по крайней мере я так думал ибо женщина чью кожу с левой лопатки жевала девочка, возможно являвшаяся матерью не подавала признаки жизни. хотя прозвучало оскорбительно, женщиной её точно звать не стоит это вполне молодая девушка, двадцати лет. \n\nпростите я остановлюсь. мне было жутко, страшно. но я знаю, что о детях важно заботиться и я не подавал виду, как минимум её воспитание не моя ответственность, хотя полицию и скорую я вызывал, но меня забрали с девочкой, а женщину они трогать не стали и не возвращались потом к ней, что довольно странно. и сколько я бы о ней не спрашивал они игнорировали темы связанные с ней. девочку увезли в скорую из-за пищевого отравления, а меня домой.\n\nда, со мной вообще не говорили всю дорогу, лишь в конце попросили не поднимать эту тему в разговорах. и всё. ну конечно мне интересно и я решил разобраться, ушёл в ту степь, среди которой много руин, трупов, черепов, гнилых растений. я искал остатки той женщины которую жевала девочка. \n\nя ошибся. хотя нет. она ошибка. ладно, ты не понял о чем я, ща поясню. девочка тогда была не одна по среди этого адского места, живой. эта девушка тоже жива. но, у неё не билось сердце, я тогда проверял. она была бездыханна и холодна. а сейчас сидит и избивает могилу какого-то парня. \n\nкакая мерзость, девушка не имеет права на смерть. конечно. можете сказать что я спешу в этом заключении, но нет. даже этот случай громко говорит о том, что она отринула смерть. она не способна умереть и это страшно, её нельзя допускать до общества.\n\nиз этой истории, я хотел показать, что бывают случаи, когда кто-то лишается этого права и больше не является человеком. она монстр и нельзя этому существу быть среди людей. важно защищать право смерти. но кто это будет делать?\n\n[другой рассказчик]\nну ты и параноик. в смысле смерть это право? ты вообще ничего не понял после встречи с той девчонкой. смерть это навык понятное дело. она пытается обучиться и достичь цели, а ты на неё ярлыки вешаешь, мол она монстр. ты просто в голове себе надумал возможные сценарии, даже не поработав с ней.\nя лично знаком с ней, мы друзья. и я всегда готов её поддержать. умирать не просто и это делать куда приятнее когда рядом есть близкий и понимающий человек который тебя ценит. смерть она не испытывала, но она способна на смерть. помню её расстреляли с узи 16 вооружённых солдат как только она проходила мимо их територии, потом она восстановилась пришла ко мне, в слезах но с улыбкой. это был действительно прекрасный момент. ведь в этот раз она восстановилась за час, а не за 7 минут как раньше.\n[247843] 2024-10-20 09:28 Миколай: ещё она однажды пошла плавать во льдах Антарктиды в микро бикини. думала что её парализует, она утонет, мозг перестанет работать и восстановится не получится. но её организм зачал прогревать себя после 13 минуты это было скучно, поэтому она пошла ко мне за поддержкой.\nя готов быть рядом с ней и помочь научиться умирать и не позволю кому-то считать её монстром.\n```\n\n### Версия 2 — 2024-10-21\n\nвселенная: монстры (по дате объявления) · окно w0062 · сообщения 248119–248145\n\n*что здесь: служебно: уточнение — рассказчики левые типы, не главные герои; внешне спокоен, но на деле перепуган и не подаёт виду ради девочки; со вторым они скорее враги и не знакомы, второй начал комментировать рассказ через 20 лет, будто в диалоге; кто он — автор не решал*\n\n\n\n```chat\n[248119] 2024-10-21 15:16 Миколай: ваще левые типы\n[248120] 2024-10-21 15:17 Слава: А чё сука такой спокойный\n[248121] 2024-10-21 15:17 Миколай: так\n[248122] 2024-10-21 15:17 Миколай: стой\n[248123] 2024-10-21 15:17 Миколай: гг девушка\n[248124] 2024-10-21 15:17 Миколай: а это можно сказать авторы\n[248125] 2024-10-21 15:17 Слава: Рассказчик\n[248126] 2024-10-21 15:17 Миколай: расказчики\n[248127] 2024-10-21 15:17 Слава: Ну и чё он спокойный\n[248128] 2024-10-21 15:18 Слава: ?\n[248129] 2024-10-21 15:18 Миколай: ну он добряк просто\n[248130] 2024-10-21 15:18 Слава: И\n[248131] 2024-10-21 15:18 Миколай: на самом деле он перепуган до ужаса\n[248132] 2024-10-21 15:18 Миколай: но да\n[248133] 2024-10-21 15:18 Миколай: надо было прописать лучше\n[248134] 2024-10-21 15:18 Миколай: во первых\n[248135] 2024-10-21 15:18 Миколай: это он пересказывает\n[248136] 2024-10-21 15:19 Миколай: естественно он может эмоции отпустить\n[248137] 2024-10-21 15:19 Миколай: и ну он делал вид что ему норм\n[248138] 2024-10-21 15:19 Слава: И это не меняет того что он так спокойно подошёл к девчонки\n[248139] 2024-10-21 15:19 Миколай: чтобы не травмировать девочку\n[248140] 2024-10-21 15:19 Слава: А что за друг который видел как девчонку застрелили\n[248141] 2024-10-21 15:21 Миколай: во первых в девушку, во вторых уточняю что с первым рассказчиком они скорее враги и вообще не знают друг друга, он просто через 20 лет начал комментировать его рассказ, будто в диалоге\n[248142] 2024-10-21 15:21 Миколай: и я хз кто это\n[248143] 2024-10-21 15:21 Миколай: я ваще не заморачивался\n[248144] 2024-10-21 15:21 Миколай: ибо понял что вообще не правильно всё сделал с рассказом с самого начала\n[248145] 2024-10-21 15:21 Слава: Ну тогда надо было чётче писать\n```\n\n## Часть чего\n\nлюди смертны и это так потрясающе\n\n## Неясности\n\n- (w0062) личность второго рассказчика автором сознательно не определена</div>"}];</script>
