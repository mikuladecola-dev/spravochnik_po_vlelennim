я бессмертными\n[314465] 2025-03-30 10:57 Миколай: https://anime-characters-fight.fandom.com/ru/wiki/%D0%91%D0%B5%D1%81%D1%81%D0%BC%D0%B5%D1%80%D1%82%D0%B8%D0%B5\n[314466] 2025-03-30 10:57 Миколай: из такого есть идеи?\n[314467] 2025-03-30 10:58 Миколай: посмотри разные виды которые тут\n[314468] 2025-03-30 10:58 Миколай: пж\n[314469] 2025-03-30 10:58 Миколай: мб это важно\n```\n\n### Версия 2 — 2025-03-30\n\nвселенная: неясно (по дате объявления) · окно w0086 · сообщения 314494–314512\n\n*что здесь: М настаивает, что от старости умирать надо, иначе нелогично; С обещает почитать и подумать; М берётся сделать исследование возраста*\n\n\n\n```chat\n[314494] 2025-03-30 11:03 Миколай: да почему? мне кажется что умерать от старости надо\n[314495] 2025-03-30 11:03 Миколай: это не логично\n[314496] 2025-03-30 11:03 Слава: Ну я подумаю\n[314497] 2025-03-30 11:03 Слава: Почитаю\n[314498] 2025-03-30 11:03 Слава: И подумаю\n[314499] 2025-03-30 11:03 Миколай: исследование возраста делать?\n[314500] 2025-03-30 11:04 Слава: Просто если эти существа буду невосприимчивы к урону. Они там всех загасят\n[314501] 2025-03-30 11:04 Слава: Ну давай\n[314502] 2025-03-30 11:04 Миколай: не, конечно и так тоже восприимчивы\n[314503] 2025-03-30 11:04 Миколай: но есть нюансы\n[314504] 2025-03-30 11:04 Слава: Вообще это раса который мы говорим сильнейшая\n[314512] 2025-03-30 11:07 Миколай: ну а пока смотри что я с 4 аккаунтов сегодня насоздавал с новой нейронкой\n```\n\n## Неясности\n\n- (w0086) Обещанное исследование в архиве не появилось</div>"}];</script>
