<script>const BASE="../";const DOCNAME="Обмен на здоровые нейроны";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Обмен на здоровые нейроны\n\n*способность* · вселенные: вне вселенной\n\n## Навигация\n\n- (w0087) Одержимый может выполнить что-то для человека, забрав взамен здоровые нейроны; у старика забрана только эмпатия, в остальном тот остаётся полноценным человеком.\n\n## Связано с\n\nОдержимый с чёрными слезами, Старик-исследователь облаков\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-04-01\n\nвселенная: вне вселенной (разбор «неясно») · окно w0087 · сообщения 314960–314960\n\n*что здесь: Правило сформулировано вместе с оговоркой про избирательность потери.*\n\n\n\n```chat\n[314960] 2025-04-01 18:58 Миколай: основная идея боль потери близкого сердцу. потеря дома и невозможность его найти. попытка закрыть глаза. чувство как в садике оставили с другими без родителей без дома игрушек и другого, в последствии привычка с пониманием что заберут домой обратно\n\nидея такая:\n\nвступление: автор (я) говорит читателю &quot;хотелось бы с самого начала подговорить тебя к концу&quot; и далее идёт эта подготовка и несколько раз в сюжете будет плавная подготовка к концу\n\nсначала идет биография чела, в ней его вечные переключения внимания(одно из которой когда все кричат самолет он видит его но переключается на облака и взглядом по ним скачет описывая), жалкое тело, лучше пишет чем другие\n\nсидит на конференции и думает а че на улице все серое скудное, наверняка это важно (заметьте на конференции а не на улице)\n\nпробует себя в публикации произведения\n\nдалее текст произведения для понимания идеи\n\nбыли и другие публикации, о них быстро пробежаться можно (например &quot;Неведомая дичь сделанная своими руками&quot; название серии книг, изначально это название было у другого автора, на гг право выкупил для себя)\n\nпервая публикация изначально и на долго стала известной {серость посвящена девушке встречной на утренней прогулке, стыд за тело вызван ей}\n\nодин из взрослых(исследователь облаков в молодости и кстати именно его деревня и поменялась) смотря обзор на эту историю (можно обзор проиллюстрировать с реакцией) понял кое че, а времени с публикации прилично прошло\n\nодержимый с черными слезами повлиял на старика. то есть они встретились когда старику нужна была сила. одержимый может выполнить что-то для человека в обмен на здоровые нейроны. и у старика он забрал эмпатию. (и он лишается только эмпатии, в остальном он полноценный такой же человек как и все остальные)\n\nбыл сложный вопрос а есть ли семья у него из-за чего я теперь представляю что есть и как она будет реагировать на это как и что он скажет то семье сложный вопрос, надо подумать\n\nавтор первый гг в истории рассматривал ценность серости мира\n\nа во время взрослого молодёжи многое можно\n\nв это время они возрадили и преобразовали культуру граффити и ярких цветов (игра в имена)\n\nстарик понял что надо исправлять и автор предсказал это и так же говорил автор обзора\n\nна деле же мужик ошибся, но получил миссианский комплекс и решил изменить мир, доделаем\n\nего одолеет повелитель салфеток\n```\n\n### Версия 2 — 2025-04-01\n\nвселенная: вне вселенной (разбор «неясно») · окно w0087 · сообщения 314969–314969\n\n*что здесь: Уточнение авторской трактовки: лишение эмпатии показывать как лишение действенности; следствие — герой не воспринимает жену и дочь как личностей, диалогов с ними не будет.*\n\n\n\n```chat\n[314969] 2025-04-01 19:00 Миколай: {если существуют золотые облака, будет и золотой дождь}\n\n{в других странах по типу китая запрещено вмешиваться в судьбы людей, какая чушь. не останавливать преступление значит участвовать в преступлении. я должен изменить это общество которое сошло с ума, правильно говорил Дмитрий в своей поэме, что мир должен быть серым, а молодёжь с этим граффити уничтожает улицы. государство вместо пресечения поддерживает идею, как же отвратительно.}\n\n{лешение эмпатии показать как лишение действенности. я ебанутый}\n\n{в настоящим времени будет говорить о настоящем когда действия пойдут} \n\n{важно заметить что диалога в этом случае не будет с девочкой и женой ибо он не может их полноценно воспринимать как личность}\n\n{его жена студентка по обмену, об этом мало людей знает. после обзора он их не воспринимает и прзерает, перестал понимать. эм ей тогда в отношениях было 19. но возможно они были знакомы ранее и она им восхищалась, была его аудиторией благодарной, он в ней видел мудрую и осознанную девушку, коей она и являлась, а ещё она являлась крайне молодой}\n```\n\n## Часть чего\n\nОдержимый с чёрными слезами</div>"}];</script>
