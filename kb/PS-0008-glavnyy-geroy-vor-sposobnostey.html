n[34414] 2023-02-22 15:39 Миколай: У него в старшем классе сын\n[34415] 2023-02-22 15:39 Миколай: Не его правда\n[34416] 2023-02-22 15:39 Миколай: Ну да пох\n[34417] 2023-02-22 15:39 Миколай: Ошибки молодости\n[34418] 2023-02-22 15:40 Миколай: А у злодея семьи не было, он хотел её и завидовал гг. А го наоборот от семьи заебался и хочет быть один, но цель не позволяет, он завидует злодею\n[34419] 2023-02-22 15:41 Миколай: Вот и мотивация драться\n[34420] 2023-02-22 15:42 Слава: А давай лучше так что бы у гг была сестра старшее его , и у этой сестра есть сын но потом сестра умирает и этот сын достается гг\n[34421] 2023-02-22 15:42 Слава: ?\n[34422] 2023-02-22 15:42 Миколай: Ага\n[34423] 2023-02-22 15:43 Миколай: А потом все узнают что его папа гг\n[34424] 2023-02-22 15:43 Слава: Типа отчим ты имел виду\n[34425] 2023-02-22 15:43 Миколай: Родной\n[34428] 2023-02-22 15:44 Миколай: Инцест дело семейное как говорится\n```\n\n## Неясности\n\n- (w0010) имени нет; вселенная не объявлена; противоречие о происхождении сына не разрешено</div>"}];</script>
