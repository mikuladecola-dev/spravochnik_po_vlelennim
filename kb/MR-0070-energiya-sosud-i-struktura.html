т \nЭнергий не просто накапливается, типо если её слишком много сосуд выпускают ту которую не может удержать\n```\n\n### Версия 2 — 2024-11-17\n\nвселенная: монстры (по дате объявления) · окно w0064 · сообщения 258986–259005\n\n*что здесь: Уточнение: способность = структура; чёрный ящик — структура, хранящая в себе другие структуры; поглощение энергии восполняет сосуд*\n\n\n\n```chat\n[258986] 2024-11-17 13:42 Миколай: так\n[258987] 2024-11-17 13:42 Миколай: прочел\n[258988] 2024-11-17 13:42 Миколай: понял\n[258989] 2024-11-17 13:42 Миколай: и теперь\n[258990] 2024-11-17 13:42 Миколай: не понял\n[258991] 2024-11-17 13:42 Миколай: как\n[258992] 2024-11-17 13:42 Миколай: он может получать эти структуры\n[258993] 2024-11-17 13:42 Слава: Кто ?\n[258994] 2024-11-17 13:43 Миколай: они изначально есть в способности?\n[258995] 2024-11-17 13:43 Миколай: .\n[258996] 2024-11-17 13:43 Слава: ?\n[258997] 2024-11-17 13:44 Слава: Черный ящик это структура \nИ черный ящик поверх свой структуры образует хранящую внутри него структуру \nВ черном ящики может хранится фиг знает сколько структур\n[258998] 2024-11-17 13:45 Миколай: хорошо\n[258999] 2024-11-17 13:45 Миколай: теперь понимаю примерно\n[259000] 2024-11-17 13:45 Миколай: так\n[259001] 2024-11-17 13:45 Миколай: ща\n[259002] 2024-11-17 13:46 Миколай: кристал собирает энергию\n[259003] 2024-11-17 13:46 Миколай: это одна из структур\n[259004] 2024-11-17 13:46 Миколай: и она может быть в ящике\n[259005] 2024-11-17 13:46 Миколай: восполняет сосуд\n```\n\n## Часть чего\n\nМир сект и сбежавших сверхлюдей\n\n## Неясности\n\n- (w0064) Названия у системы в чате нет; сам Слава называет это «концепт силы». Это повтор ранее обсуждавшейся мысли — оригинал где-то раньше в архиве</div>"}];</script>
