const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># новый мир (сказка о новом мире)\n\n*мир* · вселенные: вне вселенной\n\n## Навигация\n\n- (w0086) Вселенная, которую С строит взамен вселенной апостолов; названия в окне не звучит. Пояснение лора он собирается подать сказкой в начале — как в Shadow Fight 2 или «Аватаре». Ключевое правило: никакой концепции силы (энергии) в этом мире не будет, «там будет другое». Основа всего — Ом. Населён Поротаями, Азуриэлем и малочисленной расой, связанной с ангелами.\n\n## Связано с\n\nАзуриэль, Килька, Ом, Поротай, раса, связанная с ангелами\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-03-26\n\nвселенная: вне вселенной (по дате объявления) · окно w0086 · сообщения 311277–311279\n\n*что здесь: «Я уже сказку составляю о новом мире» — первое упоминание работы над новым миром в этом окне*\n\n\n\n```chat\n[311277] 2025-03-26 06:57 Слава: Ну и ладно потом объясню\n--- пауза 1.4 ч ---\n[311278] 2025-03-26 08:20 Слава: Я уже сказку составляю о новом мире\n[311279] 2025-03-26 08:29 Слава: Потом ответишь \nПридумал один вид Поротай \nКороче есть жуг ты его съедаеш и у тебя 3 варианта \n1) смерть , все твои внутренности превращаются в камень и отказывают\n2)  превращаются  в низший Поротай (горбатого двух лицого, полукаменного-полуплоти , и ты теряешь личностей и  слушаещя высшего Поротая  ) способности крепкость, реген, сверхсила \n3) превращается высшего Поротая сохраняешь свой человеческий образ и личность. Способности реген, контроль над низшими, превращать части тела в твердый камень , сверхчеловеческая сила\nДебафф у тебя появляется вторая личность жестокая, кровожадная , алочная и т.д.\nИ она составляет чаще всего становится жестоким кровожадным и т.д\n```\n\n### Версия 2 — 2025-03-26\n\nвселенная: вне вселенной (по дате объявления) · окно w0086 · сообщения 311425–311429\n\n*что здесь: Правило мира: концепции силы (энергии) не будет — «там будет другое»; причина: С всегда слишком сильно развивает энергию и забивает на остальное. Что именно будет вместо — «при встрече»*\n\n\n\n```chat\n[311425] 2025-03-26 13:19 Слава: Нет идти ты в жопу \nТам не будет не какой концепций силы( энергий) там будут другое\n[311426] 2025-03-26 13:20 Миколай: а\n[311427] 2025-03-26 13:20 Миколай: что другое\n[311428] 2025-03-26 13:20 Слава: Я просто всегда слишком сильно стараюсь развить эту энергию и забиваю на всё остальные\n[311429] 2025-03-26 13:20 Слава: При встрече\n```\n\n### Версия 3 — 2025-03-26\n\nвселенная: вне вселенной (по дате объявления) · окно w0086 · сообщения 311432–311445\n\n*что здесь: Уточнение жанра: сказка — не жанр работы, а вводное пояснение лора вселенной, «чтобы быстро всё понять», как в играх или как в начале «Аватара»*\n\n\n\n```chat\n[311432] 2025-03-26 13:21 Миколай: кстати\n[311433] 2025-03-26 13:21 Миколай: сказка?\n[311434] 2025-03-26 13:22 Миколай: в этом жанре теперь работаем?\n[311435] 2025-03-26 13:22 Слава: Не это о вселенной сказка та бы быстро всё понять\n[311436] 2025-03-26 13:23 Миколай: а, типа как в играх, по типу шадоуфайт 2, пояснение лора\n[311437] 2025-03-26 13:23 Миколай: ?\n[311438] 2025-03-26 13:23 Слава: Ну типа\n[311439] 2025-03-26 13:23 Слава: А не типа аватар \nГде там сказка в начале было\n[311440] 2025-03-26 13:23 Миколай: а эти штуки как-то помогли?\n[311441] 2025-03-26 13:23 Слава: Вроде\n[311442] 2025-03-26 13:23 Миколай: или не читал?\n[311443] 2025-03-26 13:23 Слава: Да очень\n[311444] 2025-03-26 13:24 Слава: Читал\n[311445] 2025-03-26 13:24 Миколай: я не смотрел 😅\n```\n\n### Версия 4 — 2025-03-27\n\nвселенная: вне вселенной (по дате объявления) · окно w0086 · сообщения 313125–313127\n\n*что здесь: С забил на перечитку своей истории, потому что хочет проработать сказку*\n\n\n\n```chat\n[313125] 2025-03-27 10:04 Слава: Я чето забил на повторной прочтения \nПотому что хочу сказку проработать и при этом эту историю я тоже хотел написать побыстрей\n[313126] 2025-03-27 10:04 Миколай: я то понял, так чисто отметил что нейронка может запутаться и вообще забавно что тут такое слово\n[313127] 2025-03-27 10:13 Миколай: 🌚\n```\n\n### Версия 5 — 2025-03-30\n\nвселенная: неясно (по дате объявления) · окно w0086 · сообщения 314483–314504\n\n*что здесь: «И основой всего является Ом» (не связано с физикой, не сопротивление); «Жди сказку»; в мире есть сильнейшая раса, связанная с ангелами*\n\n\n\n```chat\n[314483] 2025-03-30 11:01 Слава: Это другая вселенная\n[314484] 2025-03-30 11:01 Миколай: а сука\n[314485] 2025-03-30 11:01 Миколай: точняк\n[314486] 2025-03-30 11:01 Слава: И основой всего является Ом\n[314487] 2025-03-30 11:01 Миколай: я забыл\n[314488] 2025-03-30 11:02 Миколай: типа\n[314489] 2025-03-30 11:02 Миколай: че\n[314490] 2025-03-30 11:02 Миколай: напряжение\n[314491] 2025-03-30 11:02 Слава: Жди сказку\n[314492] 2025-03-30 11:02 Слава: Вообще то Ом это величина сопротивления\n[314493] 2025-03-30 11:03 Слава: Ну вообще нет это не связанно с физикой\n[314494] 2025-03-30 11:03 Миколай: да почему? мне кажется что умерать от старости надо\n[314495] 2025-03-30 11:03 Миколай: это не логично\n[314496] 2025-03-30 11:03 Слава: Ну я подумаю\n[314497] 2025-03-30 11:03 Слава: Почитаю\n[314498] 2025-03-30 11:03 Слава: И подумаю\n[314499] 2025-03-30 11:03 Миколай: исследование возраста делать?\n[314500] 2025-03-30 11:04 Слава: Просто если эти существа буду невосприимчивы к урону. Они там всех загасят\n[314501] 2025-03-30 11:04 Слава: Ну давай\n[314502] 2025-03-30 11:04 Миколай: не, конечно и так тоже восприимчивы\n[314503] 2025-03-30 11:04 Миколай: но есть нюансы\n[314504] 2025-03-30 11:04 Слава: Вообще это раса который мы говорим сильнейшая\n```\n\n## Грани этой сущности\n\n_Названо вокруг неё, самостоятельной единицей не является._\n\n### Ом\n\n*«И основой всего
