<script>const BASE="../";const DOCNAME="Арбетары";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Арбетары\n\n*персонаж* · вселенные: Апостол\n\n## Навигация\n\n- (w0081) Название группы/сущностей вселенной, в окне только упомянуто: центральная идея истории «Антоша» — раскрыть Арбетаров (302863).\n- (w0104) 2025-09-12 сила арбетара названа образцом, по которому работают одержимые; отдельно оговорено, что сами демоны в наш мир попасть не могут без сложного обряда, а демоны в разы сильнее одержимых.\n- (w0105) Тёмные маги, единственное возможное исключение из запрета на энергию. 2025-09-17 названы трижды и трижды отложены — что с ними делать, так и не решено.\n- (w0106) Термин используется дважды как уже известный: апостолы «как арбетары» (постоянно действующие силы) и сенсорика позволяет ощущать «арбетара или Протобионтов». Пояснения в окне нет.\n\n## Связано с\n\nАнтон, Апостолы, Демоны, Запрет на творцов, артефакты, ауру и энергию, Одержимые, Протобионты, Старик-арбетар (рассказчик-чужемирец), Четыре основные способности благословенных, новая вселенная (безымянная, «Разрушаем вселенную»)\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-03-14\n\nвселенная: Апостол (по дате объявления) · окно w0081 · сообщения 302859–302886\n\n*что здесь: Упомянуты как то, что предстоит раскрыть.*\n\n\n\n```chat\n[302859] 2025-03-14 23:20 Миколай: и вообще у истории должна быть центральная идея\n[302860] 2025-03-14 23:20 Миколай: вот назови пж центральные идеи каждой своей истории\n[302861] 2025-03-14 23:21 Миколай: если знаешь\n[302862] 2025-03-14 23:21 Слава: Если помню\n[302863] 2025-03-14 23:24 Слава: Ну \nЗащитник. Идея создать машину для убийства. По настоящему жестого и страшного человека \nЧужемиреу. Идея по экспеминтировать, и проверять себя в нагнетаний атмосферы. И рифм\nБессмертный. Внести апостола \nАнтоша. Идея раскрыть Арбетаров \nБитва потренироваться описанию боëв\n[302865] 2025-03-14 23:24 Слава: Ну и всю\n[302866] 2025-03-14 23:24 Слава: Идей были раскрыты\n[302867] 2025-03-14 23:24 Миколай: ну да\n[302868] 2025-03-14 23:25 Миколай: я просто когда планировал свою историю\n[302869] 2025-03-14 23:25 Миколай: и с ии немного говорил\n[302870] 2025-03-14 23:25 Миколай: она сказала истории нужна центральная идея\n[302871] 2025-03-14 23:25 Миколай: я тогда пиздец ахуел че мне делать\n[302872] 2025-03-14 23:25 Миколай: ибо таковой не было\n[302874] 2025-03-14 23:26 Миколай: поэтому я решил поделить\n[302875] 2025-03-14 23:26 Миколай: в итоге вышла небольшая вселенная\n[302876] 2025-03-14 23:26 Слава: Ладно прости\n[302877] 2025-03-14 23:26 Миколай: серия рассказов\n[302879] 2025-03-14 23:26 Слава: Но в каждой истории есть идей\n[302880] 2025-03-14 23:27 Слава: Даже если ты еë забыл\n[302881] 2025-03-14 23:27 Миколай: ну да, у моей были идеи, но не одна не центральная\n[302882] 2025-03-14 23:27 Слава: А в некоторых может быть паутин этих идей\n[302883] 2025-03-14 23:28 Слава: Ну возми просто одну лидирующую и поверх ней сделай раскрытия других идей\n[302884] 2025-03-14 23:28 Миколай: спасибо\n[302885] 2025-03-14 23:28 Слава: Я так делал. Ну хотя там было только две идей\n[302886] 2025-03-14 23:28 Миколай: но я уже пофиксил)\n```\n\n### Версия 2 — 2025-09-12\n\nвселенная: неясно (по дате объявления) · окно w0104 · сообщения 364766–364766\n\n*что здесь: одержимый объявлен аналогом арбетара, автор допускает называть их так же*\n\n\n\n```chat\n[364766] 2025-09-12 11:07 Слава: Одержимые это люди одержимые демоном. И этого одержимого либо убивают либо изгоняют демона. Изменения демона производится редко ведь это муторно и опасно. Легче просто убить\n\nОдержимый это аналог Арбетара ( я даже в иногда буду называть их так) то есть у него такие же силы. Но ему не надо обучаться. Он сразу сильный. И в чаще всего сильнее благословенных ( поэтому на убийства одержимого они ходят группой разного количества). \nИ у одержимых есть собственный организаций, а также после раскрытия существования чёрной изнанки. Большое количество людей начало их защищать. \nНо их не я убийства все равно разрешено законным. \nПросто у них есть такие же больший организации как и у благословенных.\n```\n\n### Версия 3 — 2025-09-12\n\nвселенная: неясно (по дате объявления) · окно w0104 · сообщения 364787–364797\n\n*что здесь: уточнение: демоны/арбетары не могут попасть в мир напрямую, нужен сложный обряд (не придуман); демоны в разы сильнее одержимых*\n\n\n\n```chat\n[364787] 2025-09-12 11:33 Слава: .\n[364788] 2025-09-12 11:33 Миколай: сейчас пара\n[364797] 2025-09-12 11:36 Слава: Плюсом арбетары. Точнее демоны не могут попасть в наш мир. Точнее могут но там надо какой-нибудь сложный обряд придумать. \nДемоны в разы сильнее одержимых.\n```\n\n### Версия 4 — 2025-09-17\n\nвселенная: неясно (по дате объявления) · окно w0105 · сообщения 366037–366039\n\n*что здесь: заявлены: хочу добавить арбетаров как тёмных магов*\n\n\n\n```chat\n[366037] 2025-09-17 07:49 Слава: Также хочу добавить арбетаров как тёмных магов\n[366038] 2025-09-17 07:49 Слава: Ну сначала надо с этим разобраться\n[366039] 2025-09-17 07:50 Слава: Артефактов и творцов точно не будет\n```\n\n### Версия 5 — 2025-09-17 · повтор прежней мысли\n\nвселенная: неясно (по дате объявления) · окно w0105 · сообщения 366097–366098\n\n*что здесь: оговорка: энергии и ауры не будет ни у кого, кроме, возможно, арбетаров — над ними ещё думает*\n\n\n\n```chat\n[366097] 2025-09-17 10:46 Слава: И ещё без ауры или энергии. Вообще без них. Ну не считая апбетаров (ну о нем я ещё думаю\n[366098] 2025-09-17 10:46 Слава: Как варианты всё монстры и жуки могли произойти из воды. Ну как всё живое на земле\n```\n\n### Версия 6 — 2025-09-17 · повтор прежней мысли\n\nвселенная: неясно (по дате объявления) · окно w0105 · сообщения 366200–366203\n\n*что здесь: прямой вопрос Миколаю «что появившиеся в нигде и в ни чем. Они первыми, что появилось в пустоте. И именно они начали создавать мир. По своему желанию.( между всеми мирами есть связь, которую не может оборвать не один правитель) \nПервым правителем был правитель кильке. Вторым же был правитель рая. Поэтому их мир в разы больше миров других правителей. \nСущества, что живут в мирах могут их покидать:\nС помощью ритуала???;\nМожно дойти до края мира, если ваш мир маленький или средний. И прыгнув за край мир вас перенесёт в другой мир. ( чаще всего килькв. Так как существа, что покидають свой мир. Неосознанно перемещаться по связи, а связь с килькой у каждого другого мира сильная);\nМожно попасть в пространственную аномалию;\nВас может выкинуть сам правитель ( очень очень очень, крайне редко). \n\nЛюбое существо может покинуть свой мир если будет знать способ. Но всё существа кильке не способны покинуть свой мир. Не каким либо образом. \nУ правителей есть дети, которых зовут Протобионты . Это субъект, который был создан именно правителем, а не из-за особенности мира. Подобные субъекты имеют огромную силу, которая в теории позволит уничтожить континент. Но большинство существ спокойный и миролюбивый. При этом они очень не любят покидать мир своего родителя. \n\nПравители способны давать благословение. То есть настраивать связь с существом живущими в мире ( благословения даётся только существами живущими в кильке). Настроив это связь с существом ( без его разрешения). Правитель способен передавать свою силу через эту связь к существу( человеку чаще всего). Сама связь устанавливается на мозге. То есть сила или энергия проходит через мозг вредя ему. Поэтому благословенный не часто используют благословения. Ведь это вредит мозгу. Средние продолжительность жизнь у благословенного после получения благословения 10 лет. \nСпособность благословенных. При активации благословения ( то есть пропускания энергий через мозг). У всех благословенных есть четыре основных способности: усиленная регенерация; усиления тела и всех чуств; аура( то бишь самая энергия, которая выплескивается и заставляет чувствовать страх е животных и обычных людей. Так же способный влиять на окружающей. При сильном скоплении) ; сенсорика ( позволяет ощущать других благослрвенных и арбетара или Протобионтов). \nТакже у благословенного есть уникальная способность правителя (под уникальным подразумеввется, что у правителя уникальная благословенния дающий отличающий от всех других благословенной способность. НО если правитель, что дал вам благословения. Даст благословения ещё другому человеку. То оно будет такой же, как и у вас). Примечания: например вам дали ьлагословенния и ваша уникальность способность это огонь. Вы можете поджечь лес. Но после отключения благословенния весь огонь исчезнет. Также и с другими способностями, который полученый благословеннием. После отключения благословенния они просто исчезают. Буть то огненный шар или остановка времени они просто отключаться. \nПримечание: так как всё благословенный включая апостолов. Получают плюс минус одинаковая количество энергии ( силы). Они являются одинаково сильными. Но это не включая индивидуальность людей. Всё же апостолы всё равно чаще всего сильнее любого другого благословенного. \n\nПримечания: Апостолы это 21 человек получивший благословен от правителя рая. ( 21 это максимальное число благословения, который способен давать правитель рая. Другие же правители дают меньше). У апостолов есть дополнительная способность.  Телепатия между ними. ( они способны разговаривать. На расстоянии и также всем мести. Они также могут отказаться от телепатического общения и прервать разговор). Когда у всех благословенных одного правителя одна и та же способность. То у благословенных правителя рая. Они разные. Так как правитель рая. Посылает им лишь сгустки чистой и необработанной силы, который формируется во что уже только внутри Апостолов. Даруя им уникальные способности.\n[375850] 2025-10-18 18:03 Миколай: по этому\n[375851] 2025-10-18 18:04 Слава: Очень круто\n[375852] 2025-10-18 18:04 Слава: Делай  так\n```\n\n## Неясности\n\n- (w0081) В этом окне разработки нет — только название; сама разработка лежит за краями окна.\n- (w0104) непонятно, арбетары и демоны — одно и то же или разные; в сообщении 364797 автор поправляет сам себя\n- (w0105) содержания у арбетаров в этом окне так и не появилось — только ярлык «тёмные маги»\n- (w0106) кто такие арбетары — в окне не объясняется</div>"}];</script>
