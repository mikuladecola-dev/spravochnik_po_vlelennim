const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Отряд сильнейших\n\n*персонаж* · вселенные: игра бога\n\n## Навигация\n\n- (w0032) Слава объявляет сборку отряда и начинает набирать в него персонажей; дальше несколько дней идёт подбор состава, споры о балансе и переопределение самого названия отряда. Ищи с 166480 до конца дня 166896.\n\n## Связано с\n\nБессмертный, Герострат, Имитатор, Лиомат, Несоразмерный, Призрак, Провидец, Сверхчеловек с идеальным контролем\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-05-07\n\nвселенная: игра бога (по дате объявления) · окно w0032 · сообщения 166473–166510\n\n*что здесь: Объявлен отряд, первые двое: Провидец и Бессмертный; Миколай предлагает третьего — Несоразмерного; Слава разворачивает описания обоих своих бойцов.*\n\n\n\n```chat\n[166473] 2024-05-06 23:32 Слава: Сделал\n--- пауза 7.9 ч ---\n[166480] 2024-05-07 07:28 Слава: Отряд сильнейших\n[166481] 2024-05-07 07:28 Слава: Провидец; бессмертный\n[166482] 2024-05-07 07:29 Слава: И за пихая туда кого-нибудь\n[166501] 2024-05-07 07:33 Миколай: Несоразмерный\n[166504] 2024-05-07 07:33 Миколай: Крч пиздец большой\n[166505] 2024-05-07 07:33 Миколай: Или меняющий размер по желанию\n[166507] 2024-05-07 07:54 Слава: Для понятности Провидец имеет способность отматывать время но при этом отматывая время превращается в петлю времени где он обязан 10 000 прожить один и тот же промежуток времени ( безумец,  ни разу не проигравший в рукопашном бою или в стрельбе)\nБессмертный бессмертный которого может убить лишь сверхчеловек с идеальном контролям, он способен не просто регенерировать повреждённый части, а изменять структуру своего тела или стрелять костями или с помощью плоти создавать разных существ ( на любой дистанции хорош на дальнее и средней он может стрелять костями, создавать костенной сад, или чудовище, а на ближней дистанции неплохо сражаться и использует свой бессмертие на все сто)\n```\n\n### Версия 2 — 2024-05-07\n\nвселенная: игра бога (по дате объявления) · окно w0032 · сообщения 166753–166783\n\n*что здесь: Слава отказывается от варианта Миколая; Миколай предлагает Призрака, тот тоже «не то», но откладывается «куда-нибудь запихать».*\n\n\n\n```chat\n[166753] 2024-05-07 15:41 Миколай: Так какое условие бессмертности?\n[166754] 2024-05-07 15:41 Миколай: https://anime-characters-fight.fandom.com/ru/wiki/%D0%91%D0%B5%D1%81%D1%81%D0%BC%D0%B5%D1%80%D1%82%D0%B8%D0%B5\n[166755] 2024-05-07 15:42 Миколай: Тут все возможные условия прописаны\n[166756] 2024-05-07 15:42 Миколай: Может у тебя чет отличающиеся\n[166757] 2024-05-07 15:43 Слава: 4\n[166758] 2024-05-07 15:43 Миколай: Ну в общем\n[166759] 2024-05-07 15:44 Миколай: Я вот врд разобрался с персами\n[166760] 2024-05-07 15:44 Миколай: Но чет не вдупляю ч писать\n[166761] 2024-05-07 15:44 Миколай: Просто я не определился ты оставляешь мой вариант, мне его доработать или чет другое придумать\n[166762] 2024-05-07 15:45 Слава: Не оставляю ( не знаю почему, просто как то не подходит)\n[166763] 2024-05-07 15:46 Миколай: Окей\n[166764] 2024-05-07 15:49 Миколай: Есть идея о призраке. И способность его будет: локальное управление осязания. Ну тобиж он может проходить сквозь всё, и может контролировать какая часть его тела будет доступна для прикосновения. Даже если это маленькие участки или участки внутри тела\n[166765] 2024-05-07 15:50 Миколай: Ну и ещё он будет обладать мощным боевым искусством\n[166766] 2024-05-07 15:51 Миколай: Если он может в объёме контролировать осязание внутри тела, то он например может сделать иглы из костей осязаемыми и ими зарезать других\n[166767] 2024-05-07 15:52 Миколай: Ну и логично как его победить, просто атаковать осязаемую часть тела\n[166770] 2024-05-07 15:58 Миколай: Норм?\n[166771] 2024-05-07 15:58 Слава: Да\n[166772] 2024-05-07 16:02 Миколай: Оказывается ловкость имбовая штука\n[166773] 2024-05-07 16:02 Миколай: Ловкость — (определение, данное Н. А. Бернштейном) — способность двигательно выйти из любого положения, то есть способность справиться с любой возникшей двигательной задачей:\n\nправильно (адекватно и точно),\nбыстро (то есть, скоро и споро),\nрационально (целесообразно и экономично),\nнаходчиво (изворотливо и инициативно).\n[166774] 2024-05-07 16:02 Миколай: Из фандома взял\n--- пауза 1.1 ч ---\n[166776] 2024-05-07 17:06 Слава: Но все это как то не то\n[166778] 2024-05-07 17:06 Миколай: Призрак?\n[166779] 2024-05-07 17:07 Слава: Не ну призрак можно ещё куда нибудь запихать\n[166780] 2024-05-07 17:07 Слава: Но\n[166781] 2024-05-07 17:08 Миколай: Ну бля, я под эту идею его и создавал 😅\n[166782] 2024-05-07 17:08 Миколай: Ладненько придумаю ещё что-нибудь\n```\n\n### Версия 3 — 2024-05-07\n\nвселенная: игра бога (по дате объявления) · окно w0032 · сообщения 166814–166845\n\n*что здесь: Слава задаёт рамку: это военный отряд, врагов ещё придумывать, поэтому без имбаланса или с ограничениями; есть другие отряды, равные им по силе; мери-сью не делать.*\n\n\n\n```chat\n[166816] 2024-05-07 19:51 Миколай: Логос номос - чел слова которого имеют вес, ну тобиж как чел из магичеки говорящий морепродуктами. Например скажет умри и чел умрёт, скажет дереву вырасти и оно вырастет. Ну а ограничение попробуй сам придумать интересное, а я пока съедусь с мысли чтобы прийти со свежей головой.\n[166817] 2024-05-07 19:52 Миколай: Ток сразу пиши хуйня или нет\n[166818] 2024-05-07 19:52 Миколай: Это &quot;слово - закон&quot; по гречески если что\n[166819] 2024-05-07 19:52 Слава: Ну чёт я хотел более новой\n[166820] 2024-05-07 19:52 Миколай: Понимаю\n[166821] 2024-05-07 19:53 Миколай: Но можно условия добавить\n[166822] 2024-05-07 19:53 Миколай: Особенные\n[166823] 2024-05-07 19:53 Миколай: И ограничения новые\n[166824] 2024-05-07 19:53 Миколай: И тогда сойдёт за новую\n[166825] 2024-05-07 19:53 Миколай: А то ты не первый о бессмертии заговорил\n[166827] 2024-05-07 19:54 Слава: Ну можно, ну ты ещё чего-нибудь подкинь\n[166828] 2024-05-07 19:54 Миколай: Вщ есть божественные способности\n[166829] 2024-05-07 19:54 Миколай: 3 основные\n[166831] 2024-05-07 19:54 Миколай: Дать статьи?\n[166832] 2024-05-07 19:55 Слава: Нет и так ясно\n[166833] 2024-05-07 19:55 Миколай: Ну оке\n[166834] 2024-05-07 19:55 Миколай: Вот, ими крч бог обладает, а раз эти челики будут сильнейшие значит будут близки к Богу\n[166835] 2024-05-07 19:55 Миколай: Ну такая была идейка\n[166836] 2024-05-07 19:56 Миколай: Ну бог это образно. Просто сильнейшее существо\n[166837] 2024-05-07 19:57 Слава: Ну представь военный отряд которым ещё врагов надо придумывать поэтому через чур инбаласный не надо ( ну или надо только с ограничением )\n[166838] 2024-05-07 19:58 Слава: Их типо считают сильнейшими но будут и другие отряд равный им по силе\n[166839] 2024-05-07 19:58 Миколай: Оке пон, мери сьюшек не делать\n[166840] 2024-05-07 19:58 Миколай: Учту\n[166841] 2024-05-07 20:00 Миколай: Бля, просто подкину идею, я её из онгоинга про монстра спиздил. Чел получает способности того кого / чего хавает\n[166842] 2024-05-07 20:01 Миколай: Потом с этим работать можно\n[166843] 2024-05-07 20:01 Миколай: Отталкиваться хз\n[166844] 2024-05-07 20:01 Миколай: Просто написал пока\n```\n\n### Версия 4 — 2024-05-07\n\nвселенная: игра бога (по дате объявления) · окно w0032 · сообщения 166850–166866\n\n*что здесь: Переопределение названия: Миколай спрашивает, с чего они «сильнейшие», если есть равные; Слава соглашается — не сильнейшие, а «отряд довольно сильных людей, с которыми справляются единицы».*\n\n\n\n```chat\n[166852] 2024-05-07 20:48 Миколай: А с хуяли они сильнейшее\n[166853] 2024-05-07 20:49 Миколай: Типа почему так называется отряд\n[166854] 2024-05-07 20:49 Миколай: Кто его так назвал\n[166855] 2024-05-07 20:49 Миколай: Почему они сильнейшие если у них есть равные\n[166856] 2024-
