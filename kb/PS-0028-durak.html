5] 2024-01-30 13:49 Миколай: Или он будет как собирательный образ всех пороков человечества\n[101966] 2024-01-30 13:49 Миколай: Бессовестный предатель\n[101967] 2024-01-30 13:49 Миколай: Которому скучно жить\n[101968] 2024-01-30 13:49 Миколай: В голове он гениален\n[101969] 2024-01-30 13:50 Миколай: Со стороны дебил\n```\n\n### Версия 2 — 2024-01-30\n\nвселенная: Падения небес (по дате объявления) · окно w0023 · сообщения 101970–101983\n\n*что здесь: расширение: врагов не один — пороки заселены в каждого и есть везде; потом их кто-то объединяет; дураки рушат планы ответственных и идейных ради развлечения, им не важна ни своя, ни чужая жизнь*\n\n\n\n```chat\n[101970] 2024-01-30 13:50 Слава: Но у меня же не будет чисто один тупой враг\n[101971] 2024-01-30 13:50 Миколай: Ну\n[101972] 2024-01-30 13:50 Миколай: Общество\n[101973] 2024-01-30 13:50 Миколай: Можно в каждом заселить пороки\n[101974] 2024-01-30 13:50 Миколай: И сказать что везде такие есть\n[101975] 2024-01-30 13:51 Миколай: А потом может их объединит кто-то\n[101976] 2024-01-30 13:51 Миколай: И 2 головы хорошо, 3 лучше\n[101977] 2024-01-30 13:51 Миколай: Но с дураками это работает в плохом смысле\n[101978] 2024-01-30 13:51 Миколай: Они все испортят\n[101979] 2024-01-30 13:52 Миколай: Все планы ответственных и идейных личностей\n[101980] 2024-01-30 13:52 Миколай: Чтобы тупо повеселиться\n[101982] 2024-01-30 13:52 Миколай: Им не важна жизнь\n[101983] 2024-01-30 13:52 Миколай: Ни своя ни чужая\n```\n\n### Версия 3 — 2024-01-30\n\nвселенная: Падения небес (по дате объявления) · окно w0023 · сообщения 101993–101997\n\n*что здесь: привязка к механике мира: изначальная гармония с энергией, сеют страх, непредсказуемы, но что-то человеческое должно быть*\n\n\n\n```chat\n[101993] 2024-01-30 14:23 Миколай: Тогда пускай у них изначально будет гармония с энергией и они будут сеить страх\n[101994] 2024-01-30 14:23 Миколай: А из действий еще не предсказать\n[101995] 2024-01-30 14:23 Миколай: Кто знаешь что на уме у дураков
