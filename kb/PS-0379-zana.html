<script>const BASE="../";const DOCNAME="Зана";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Зана\n\n*персонаж* · вселенные: неясно\n\n## Навигация\n\n- (w0122) Глава организации злодеев Насла, обычный человек без способностей, который питается чужими яркими эмоциями и охотится за падением «богов» — сл. Разворачивается сплошным блоком 491161-491165: сцена предательства, идеология, характер и происхождение, артефакты, внешность и союзы.\n\n## Связано с\n\nБэм, Всул, Деби, Железное сердце, Изб, Клинок тысячи боли, Насла, Очки Заны, Перчатка для стрельбы, Старик, Чёрный ящик\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2026-06-17\n\nвселенная: неясно (по дате объявления) · окно w0122 · сообщения 491161–491161\n\n*что здесь: Первое появление в сцене: предаёт старика в момент победы, бьёт волнистым кинжалом в бок, забирает чёрный ящик и телепортирует его подвеской-сердцем; описан как мальчишка в белой рубашке, в очках, с постоянной улыбкой.*\n\n\n\n```chat\n[491161] 2026-06-17 19:38 Слава: Момент. Наконец-то настал, теперь чёрный ящик в моих руках. наконец-то можно не волноваться о том что может случиться если им кто-то завладевет. \n-да у нас получилось - только и успел сказать как я невыносимая боль пронзила бок. Я испытывал множество разных страданий и боли. Но это заставило меня скорчится и выронить чёрный ящик. Вдруг чёрный ящик что лежал совсем рядом, только руку подай. Подняла белоснежная и хрупкая рука. Это был Зана. И только я хотел выдохнуть с облегчением. Ведь он союзник он доказал что не предаст нас, а значит чёрный ящик в безопасности. Но я увидел в его второй руке кинжал волнистой формы, от которого капала кровь. \n- Что. нет нет нет. НЕТ!- кричал я жимая зубы. А он лишь улыбался своей привычной улыбкой, но теперь и глаза скрытые прозрачными глазами тоже улыбались. Он стоял и смотрель на меня явно наслаждаешь. Вдруг чей то зверинный крик и на месте где стоял Зана образовалось красная молния,  что начила всё крушить. Это была Деби. Но уже поздно его здесь не было. \nЯ огляделся и заметил как он стоит поодаль на разрушенном здания. Спиной солнцу. Было тяжело смотреть пока боль не прекращалась и свет солнца мешал видеть нормально заставляя щуриться. Но даже так я понимал улыбка всё ещё была на нём. \nОн пришёл в движении, он поднял серебряную подвеску, похожая на сердце из под белой рубашке. И демонстративно показал в нашу сторону. \n- эй старичок узнаешь- сказал задорным голосом мальчишка. Я громко сглотнул ведь я знал что это. На что способен артефакт который находится у него в руках. \nКажется его улыбка стала ещё больше. Или мне просто показалась. Нельзя было точно увидеть так как солнца светила прямо глаза, а его лицо было скрыто тенью. \n- узнал! Ты ведь и знаешь что он может- \n- нет нет, ты не посмеешь - вырывались из моего рта глупый слова. Я был растерян я просто не мог соображать здравая. Ведь только недавно я думал что я победил. \nДа мои слова были бессмысленные. Зана медленно подносил подвеску. Наслаждаешь моментом. \n- стой хватит. Давай договоримся- наконец-то я хоть немножко  смог взять себя в руки. \n- нет~ - специально растянул он. И чёрный ящик исчез. А я рухнул без сил. Некая пустота заполнила меня. Я не понимал что мне делать. А зан лишь громко смеялся смотря мне в лицо.\n```\n\n### Версия 2 — 2026-06-17\n\nвселенная: неясно (по дате объявления) · окно w0122 · сообщения 491162–491162\n\n*что здесь: Раскрыт как основатель и лидер организации Насла; его личный мотив отделён от идеологии организации — не ненависть к сл, а желание видеть, как «бог» поднимается и падает от рук простолюдина; недоволен тем, что падение Изб устроили слишком рано и быстро.*\n\n\n\n```chat\n[491162] 2026-06-17 19:58 Слава: Организация Насла. В этой организации злодеев лишь обычный люди там нету сл или ис. \nИдеология данной организации сл и всё кто контролирует оам зло. Абсолютное зло. Дети что получили в руку ядерную бомбу. Монстры что не понимают собственной силы и ответственности. И их цель уничтожить всех сл или подчинить их под строгие правила. В данной организации также вступила и секта что считает сл демонами вылезший из ада. \nСам же глава насла так не считает. По его мнению даже без сл, был бо множество войны, множество плохих людей, множество смертей и несчастье. Тогда почему он возвёл и командует такой организации. Почему он Зана продолжает быть лидером данных идеалов. Всё просто &quot; Разве у вас никогда не проявлялась желание растоптать Бога, замирать его, увидеть его жалкий вид. Подорвать ему крылья и с упоением смотреть на эти отчаяный глаза&quot;если нет то вы соврети. Разве у вас просто не промелькала мысль увидеть как например звезда что строила свой образ на протяжении всей жизни вдруг падёт, разве это неинтересно, разве это не просто человеческая желания.\nИ кто же в нашем мире бог, конечно сл. И их ними падениями я буду восхищаться.но прежде чем пасть нужно сначала дать им подняться а после собвстенными руками поджечь им крылья и смотреть как крылья начинают разваливаться, как их уверенно лицо, изменяется гримассой страха. \nГлавный фанат сл. \nКстати ему не понравилось падения изб, он посчитал что слишком рано и что слишком быстро подослали злодей не дав насладиться эмоциями Изб. \nВообще он хочет  падения не как он сражался против сильного злодея и проиграл. А то где обычный человек, простолюдина топчит бога, дворянина. Где он побеждает даже Бога.\n```\n\n### Версия 3 — 2026-06-17\n\nвселенная: неясно (по дате объявления) · окно w0122 · сообщения 491163–491164\n\n*что здесь: Схема его предательств (сотрудничает с организациями в гонке за чёрным ящиком и бьёт в спину в решающий момент — так же поступал с Норой и ассоциацией); не считается худшим злодеем, редко убивает, не хочет менять мир, живёт моментом. Внешность: подтянутый блондин с синими глазами, лисье хищное лицо. Происхождение: вырос в семье аферистов, которых убили за ложь, сирота без денег, организацию и чужие деньги собрал красноречием. Перечислены четыре артефакта.*\n\n\n\n```chat\n[491163] 2026-06-17 19:59 Слава: Некоторая время сотрудничал с загик в гонке за чёрным ящиком. Но в решающей момент когда чёрный ящик был в руках старика. Он предал его ударив в спину и отобрав чёрный ящик, а после воспользовался артефактом чтобы телепортировать чёрный ящик в рандомной место. А после с упоением смотрел, как эти высокомерный боги думающие что у них всё получилось, смотрели на него неверующим взглядом и замерли не веря в то что произошло. \nОн так делал и с другими организацими, по типу Нора. Или ассоциации если те вдруг начали доверять ему. Ему нравилось видить эмоции. \nПри этом его нельзя назвать худшим злодеем. Он часто не убивает, у него нет цели уничтожить или перестроить мир. Он просто получает удовольствие именно в данный момент.\n[491164] 2026-06-17 19:59 Слава: Он тот кому нравится видить чужие яркие эмоции. Буде то радость победы или гнев и неверия проигрышу. Он вампир что питается эмоциями (  конечно в пересном смысле). \nОн подтянутый блондин, с синими глазами. Он выглядеть как лис, которому точно нельзя доверять, его хитрая хищная лицо потверждает это. Но видя как он чуть ли не рушит собственную организацию, рискуете собственной жизнью дабы добиться вашего доверия, то ты сам того не понимая начинаешь доверять ему. \nВообще он не из богатой семьи. Он вырос в семье аферистов которых по итогу убили за их ложь. Поэтому он по сути сирота без денег. Но он смог собрать организацию и собственным красноречием получить множественную поддержку, поэтому всё деньги что у него есть это не его. Но он им пользуется как ему удобно. \nОн владеет нескольками артефактами. \nПервый клинок тысячи боли. Царапина от такого клинка вызовит такую боль словно тебя пырнули. Именно этим клинком он ударил в спину старика. \nВторой очки. Они позволяют телепортироваться в поле своего зрения. Он не способен телепортироваться на Дальний дистанции, а только на те который именно сейчас видит. И если всё накроется туманом он по сути не сможет телепортироваться. \nТретий железная сердца, подвеска, с серебряным сердцем. Эффект рандомно телепортирует куда-то. Использует крайне редко. Потому что он телепортирует рандомно. Он может оказаться внутри стены и сдохнуть, он может оказаться  воздухе и просто умереть, он может оказаться под глубиной воды и просто захлебнуться и умереть под давлением. Ещё минусом у него очень долгая перезарядка 5 часов, у очков перезарядка 3-4 секунды.\nЧетвертый перчатка предназначеная для стрельбы. Способен призывать серебряный лук, который стреляет стрелами созданный из оам ( лук сам создаёт стрелы из оам).\n```\n\n### Версия 4 — 2026-06-17\n\nвселенная: неясно (по дате объявления) · окно w0122 · сообщения 491165–491165\n\n*что здесь: Костюм и быт: белоснежная кожа, белая рубашка с приоткрытым воротом и засученными рукавами, очки с цепочкой, перчатка для стрельбы на правой руке, подвеска под рубашкой, чёрные штаны; два телефона — дешёвый кнопочный на выброс и дорогой без единого рабочего контакта. Названы три вещи, которые он не предаст: своя организация, союз с Бэмом и Всул. В конце — короткий диалог с Всулом после предательства старика.*\n\n\n\n```chat\n[491165] 2026-06-17 19:59 Слава: У Зана белоснежная чистая кожа. Не как у больного а как у красивого человека. Он немного худощавый поэтому на вид его можно посчитать хрупким. Он ходит в белой рубашке с приоткрытом воротником, и засученными рукавами до локтя. Ходит он в очках с цепочкой ( артефакт) и на его правой руке вечно перчатка для стрельбы. Подвеска спрятанная за рубашкой чёрный штаны. \nУ него кнопочный дешёвый телефон, чтобы быстро и без сожаление его быстро выбросить. Также у него есть дорогой телефон, на котором вообще нет контактов или что-либо связанные с его работой. \nУ него союз с Бэмом. Реальный. Он не сообщем дурак. Он готов к верному сотруднечеству зная что это в будущем принесёт больше эмоции и даст ему ресурс для его преставления. \nСоюз таков. Бэм спонсирует его, а он веселит его преставоениеми и устраняет тех на кого покажет Бэм. \nМожно сказать есть три вещи которые он не предаст. Свою организация, союз с Бэмом ( большая часть ресурсов оттуда как бы. Поэтому это глупо ради мимолётно радости, решать себя постоянной радости) \nИ всул. \n- всул видил их морды. Ха-ха- говорит зан валяешь на полу. Всул же  летал рядом и обеспокоена смотрел на него. \n- ты бы видел как лицо того старика скорчилась. Этот сухарь думающий что всегда сможет держать голову холодной\n```\n\n## Неясности\n\n- (w0122) Вселенная в окне ни разу не названа. Организации Нора, ассоциация и «загик» (491163) только упомянуты.</div>"}];</script>
