<script>const BASE="../";const DOCNAME="Сестра гг";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Сестра гг\n\n*персонаж* · вселенные: монстры\n\n## Навигация\n\n- (w0063) Младшая сестра героя, ещё ребёнок, которой не хватает родительского внимания; ради неё ГГ бежит через лес домой и ради её безопасности готов убить существо.\n- (w0064) Младшая сестра гг, ребёнок, требующий внимания; ради неё гг бежит через лес домой. Позже, по словам Славы, сошла с ума, увидев монстра, и обвиняла брата.\n\n## Связано с\n\nГГ-защитник, Существо, гг (главный герой истории про существо)\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-11-10\n\nвселенная: монстры (по дате объявления) · окно w0063 · сообщения 255096–255096\n\n*что здесь: введена в предыстории: ребёнок, хочет внимания, ГГ старается его дать; в финале выбегает навстречу целая и невредимая*\n\n\n\n```chat\n[255096] 2024-11-10 00:15 Слава: Гг переезжает в ной город с сестрой из за родителей \nРодителей вечно на работе и почему то не питают ни каких чувств к свои отбрыском \nА гг думает что родители его вообще ненавидят \nПотому что каждый раз посылают его в школу с плохой репутации\nДа и в праздники они вместе не обмечяють \nНу гг привык к такой непостоянной жизни его больше волновала состояния его сестры который ещё ребенок который хочет получать внимание \nГг конечно старается уделить её достаточной внимание, но внимание 2 родителей даже иногда не хватает не говоря уже о внимание только брата \nИ вот гг пошел в новую школу с наигранной улыбкой\nОн уже был готов к драке и не боялся получать ему это казалось естественным как вращение земли \nНо что ему показалось необычным так это его ступор  посреди дороги когда он уже возвращался домой \nСтупор ты странным, гг давно привык  к страху тренируемых все это время в драках или точней он так думал \nНа самом деле он переборол страх \nОн стоял в ступоре затылком понимая что-то идёт. Что-то большее настолько что ему было бы не возможно прятаться в центре города к котором они находились \nПока гг стоял в попытках хоть дернуться существо уже подошло к нему и положила свой длиннющий руки на плече гг. Его руки были длины как и пальцы, а когти были настолько что без каких либо усилий давали одежду гг и в момент когда на его голову уже капнула слюна и в тот же момент когти существо прибили кожу гг давай ему контроль над телом и гг бежал не обращай ни на что внимания.\nВедь мозг кричал только и одном бежать бежать бежать бежать бежать \nИ пришел он в себя только в густом лесу, настолько густым что словно казалось сейчас ночь но как бы не была темная ночь темнее всего в этом месте был озеро настолько черный что казалось там не вода а нефть залитоми литрами\nИ выпив от туда у гг сразу проскакивает мысль а как же сестра, она же совсем одна в доме, а что если этот монстр\nГг рванул с места   даже не успеем отдышаться или прийти в себя он снова бежал только в этот раз не ради себя а ради такой близкой и бесконечно любимый сестры, он был готов перевернуть сами небеса дабы с ней все было в порядке \nОн бежал даже не зная дороги но каким то чудом добежал до дома \nНо боявшишь  открыть дверь и увидит окровавленный труп свой сестры или вообще не увидит её дома или решений рассудком и обвинявший его о опоздание сестру \nНо открыв дверь он увидел лишь коридор и услышишь топот ножек и увидит ту самую, целую и невредимую сестру \nОн хотел закричать расплакаться или потерять сознания, да все было хорошо, нов чё было слишком быстро и много \nНо он не закричал не расплакался и не потерял сознания он лишь когда всегда лучезарная улыбался и побежал за сестрой дабы поймать её и зашикатить, пряча за этим все те эмоции который переполнили его за этим жалких 20 мину \nПосле он удалился в туалет и начал резать руку нет невены не артерий а просто кожу и плоть, это единственный способ который он знал дабы выплеснуть эмоции\n```\n\n### Версия 2 — 2024-11-11\n\nвселенная: монстры (по дате объявления) · окно w0063 · сообщения 255795–255805\n\n*что здесь: упомянута спящей утром; названа как причина решимости убить существо*\n\n\n\n```chat\n[255795] 2024-11-11 14:45 Слава: Проснувшись с утра я чувство себя разбитым все тело болела, а глаза намеревались закрыться. У меня не было ни малейшего желания вставать и идти в школу. Но я уже давно понял что учусь только для себя, не для родителей которых не бывают дома, не для учителей который меняются так часто, что я не успевал запоминать имена. \nПоэтому я встал было тяжело все тело ныло после вчерашний пробежке.\nЯ пошел ванну чтобы умыться и прийти в себя, рука болела пока я умывался но я не обращал на это внимание ведь это ключ \nОдевшись и проверял что сестра спит я пошел в школу.\nПока я шел, улицы были пусты, вызывая у меня волнения, но все обошлось и я спокойно дошел до школы, где на крыльце меня ожидал здоровяк которому я вчера нос разбил и который после уроков ожидал меня на заднем дворе, где меня очевидно отмутохали.\nНо мне было наплевать я не боялся его стоявшим на крыльце, он казался мне незначительном после вчерашнего.\nИ я с весельем и наслаждением снова зарядил ему в лицо, было приятно просто подраться, забыть обо всем и просто бить толстого задиру. Пытаясь забыть, пытаясь выплеснуть все те эмоции который не давай мне успокоиться. И да возможно он снова придет со свой недо бандой ну и без разницы. Пусть придут, пусть побюуть пусть сломать руку, пусть ломают физически как хотят. Я не боялся людей, ведь это глупо человек боится человека если это и будет так то наша общество не крепче картонной коробке, а я верил что нашей общество крепкая, поэтому я не боялся, но чего я действительно боялся это то невообразимое существо который в любой момент может взять и убить я боюсь его настолько что мое страх перерастает в гнев а из гнева в решимость убить эту тварь, ради безопасности сестры, ради мой безопасности, ради безопасности этого толстяка которого я сейчас бью. И с чего я вообще взял что это не человек. Я же его не видел, да он был большим, а руки длинный и острый ногти но это вполне мог быть человек, а если это человек то и бояться его не надо.\nЯ с благодарностью взглянул на  окровавленной лицо толстяка. Он дал мне решимость и почти что решил страх. Я благодарен ему и его лицу.\n--- пауза 4.0 ч ---\n[255803] 2024-11-11 18:45 Миколай: так как я решил что буду читать и думать\n[255804] 2024-11-11 18:45 Миколай: я хуй его знает когда прочту\n[255805] 2024-11-11 18:45 Миколай: но хорошо что ты написал\n```\n\n### Версия 3 — 2024-11-13\n\nвселенная: монстры (по дате объявления) · окно w0064 · сообщения 256858–256858\n\n*что здесь: Первое развёрнутое появление: гг боится найти её труп, находит целой, ловит и щекочет*\n\n\n\n```chat\n[256858] 2024-11-13 20:20 Слава: Гг переезжает в ной город с сестрой из за родителей \nРодителей вечно на работе и почему то не питают ни каких чувств к свои отбрыском \nА гг думает что родители его вообще ненавидят \nПотому что каждый раз посылают его в школу с плохой репутации\nДа и в праздники они вместе не обмечяють \nНу гг привык к такой непостоянной жизни его больше волновала состояния его сестры который ещё ребенок который хочет получать внимание \nГг конечно старается уделить её достаточной внимание, но внимание 2 родителей даже иногда не хватает не говоря уже о внимание только брата \nИ вот гг пошел в новую школу с наигранной улыбкой\nОн уже был готов к драке и не боялся получать ему это казалось естественным как вращение земли \nНо что ему показалось необычным так это его ступор  посреди дороги когда он уже возвращался домой \nСтупор ты странным, гг давно привык  к страху тренируемых все это время в драках или точней он так думал \nНа самом деле он переборол страх \nОн стоял в ступоре затылком понимая что-то идёт. Что-то большее настолько что ему было бы не возможно прятаться в центре город
