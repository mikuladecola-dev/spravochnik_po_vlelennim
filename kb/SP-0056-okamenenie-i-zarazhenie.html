<script>const BASE="../";const DOCNAME="окаменение и заражение";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># окаменение и заражение\n\n*способность* · вселенные: игра бога\n\n## Навигация\n\n- (w0030) Пара способностей пристава, объявленная С одной репликой: окаменение усиливает и защищает носителя, заражение превращает других в окаменевших и подчиняет их.\n\n## Связано с\n\nпристав\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-04-06\n\nвселенная: игра бога (по дате объявления) · окно w0030 · сообщения 154331–154338\n\n*что здесь: Единственное состояние: окаменение — усиление себя и повышение защиты; заражение — заражать окаменением и контролировать заражённых.*\n\n\n\n```chat\n[154331] 2024-04-06 14:28 Слава: Вообще этот персонаж будет иметь способность окаменения( то бишь усиливать себя и повышать защиту ) и заражения ( то бишь заражать окаменением и контролировать их) но дальше по сюжету я хочу дать ему ещё способность не обязательно что бы она сочеталось с окаменением\n[154332] 2024-04-06 14:29 Миколай: Слушай\n[154333] 2024-04-06 14:29 Миколай: А можно\n[154334] 2024-04-06 14:30 Миколай: Я снова попробую в нейронку кинуть?\n[154335] 2024-04-06 14:30 Миколай: А то идей нету\n[154337] 2024-04-06 14:30 Слава: Да можешь пожалуйста\n[154338] 2024-04-06 14:31 Миколай: &lt;мысли&gt;\nУчитывая, что персонаж уже обладает способностями окаменения и заражения, дополнительная суперспособность может быть выбрана исходя из следующих соображений:\n\n1. Усиление существующих способностей. Новая способность может дополнять или усиливать окаменение и заражение, открывая новые возможности для их применения.\n\n2. Контраст и баланс. Способность может быть противоположна или отличаться по природе от окаменения, создавая интересную динамику и внутренний конфликт персонажа.\n\n3. Расширение возможностей персонажа. Новая способность может давать персонажу преимущества в других областях, не связанных напрямую с окаменением и заражением.\n\n4. Развитие сюжета и темы. Способность может быть связана с основными темами и идеями истории, добавляя глубины и смысла в развитие персонажа.\n\nПринимая во внимание высокомерие и наглость персонажа, а также его богатство, я думаю, что подходящей дополнительной способностью может быть телекинетическое управление драгоценными камнями и металлами. Это отразит его одержимость богатством и статусом, а также добавит новые тактические возможности в бою.\n&lt;/мысли&gt;\n\n&lt;ответ&gt;\nСуперспособность: Кристаллокинез (Crystallokinesis)\n\nОпределение: Способность телекинетически манипулировать кристаллическими структурами, такими как драгоценные камни и металлы. Персонаж может контролировать движение и форму кристаллов, создавать из них конструкции и использовать как оружие. Например, он может создать барьер из алмазов, выпустить шквал рубиновых снарядов или обездвижить противника, покрыв его тело слоем золота.\nЭта способность тематически перекликается с окаменением и отражает одержимость персонажа богатством и статусом. Однако, в отличие от защитной природы окаменения, кристаллокинез более агрессивен и позволяет активно нападать и контролировать поле боя.\nПотенциальным недостатком этой способности может быть её зависимость от наличия кристаллических материалов поблизости. Персонаж должен либо носить с собой запас драгоценных камней, либо искать их в окружении. Это добавляет элемент стратегии и ограничений в использовании силы.\n&lt;/ответ&gt;\n```\n\n## Часть чего\n\nПристав\n\n## Неясности\n\n- (w0030) Не сказано, распространяется ли заражение дальше по цепочке и обратимо ли оно.</div>"}];</script>
