о после того как тебя ударили этот огненный шар исчезает но после удара ты сразу сможешь использовать способность \nУдар разрушающий структуру- чтобы использовать этот удар тебе надо полностью отказаться от защиты да и плюсом твой мозг будет по тихонько сгорать если попытается его использовать, сам удар разрушает структуру на время дела оппонента чуть ли не простым человеком \nНу и его глазки способны видеть чужую структуры и так как у него самого нет структуры то он может с помощью частиц сформировать чужую структуру опять же на время да и структура которую имитируют в разы несовершенной  по сравнений с оригиналом\n```\n\n### Версия 2 — 2024-12-13\n\nвселенная: 7 островов (объявлено) · окно w0066 · сообщения 269881–269883\n\n*что здесь: уточнение: сильнейший владелец глаз, лучше всех их использует*\n\n\n\n```chat\n[269881] 2024-12-13 18:52 Слава: Во первых он самый живучий из за &quot;Я не умру пока не кончится энергия&quot;\nВо вторых в плане усилений он опять же сильнейший \nВ третьих у него идеальный контроль \nВ четвёртых сильнейший владелец глаз( то бишь лучший всех их использует) \nВ битве он всегда хочет научится чего то новому поэтому почти некогда не сражается на все 100 в самом начале он ждёт когда его противник раскроет все карты чтобы чего нибудь научится, в большинство битвах он получает серьезный урон всего тела из за того что не сражается на все 100 в самом начале но даже так он один из сильнейших\n[269882] 2024-12-13 18:52 Миколай: сильные же имеют такие возможности, которые разрушают некоторые системы или контролируют их, но это просто слова, я не знаю как точно описать\n[269883] 2024-12-13 18:53 Слава: А ясно \nВот его удар с особым усилением способен уничтожить многоэтажку\n```\n\n### Версия 3 — 2026-06-07 · повтор прежней мысли\n\nвселенная: неясно (по дате объявления) · окно w0121 · сообщения 488504–488506\n\n*что здесь: из старой карточки, вместе с минусами частиц: плохой контроль и малое накопление энергии*\n\n\n\n```chat\n[488504] 2026-06-07
