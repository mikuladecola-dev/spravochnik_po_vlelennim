ый чувство при этом у тебя все ещё остаётся это желания \nИ вот когда будут и чувство и желание ты сможешь попасть в озеро перерождения и ты сам не поймёшь как вдруг оказался там\nИ вот нырнув в озеро перерождения то вынернет уже  не ты, а что-то похожей на тебя монстр бог или дьявол\n[268677] 2024-12-08 20:21 Миколай: ну внешне так, но реализация отличается, но я согласен, но выкинем, вообще я изначально хотел твои идеи услышать ибо у меня наработок особо нет даже к новому, решил просто накидать как чувствую, быстренько\n[268680] 2024-12-08 20:22 Слава: Ну для начала монстры боги которых фиг победишь как это раньше делал спасатель\n[268681] 2024-12-08 20:22 Слава: И есть озеро перерождения\n[268682] 2024-12-08 20:22 Слава: Ну и все\n[268683] 2024-12-08 20:22 Миколай: а че с тобой будет?\n[268684] 2024-12-08 20:23 Миколай: это навсегда?\n[268685] 2024-12-08 20:23 Слава: Наверное\n[268686] 2024-12-08 20:23 Слава: Навсегда\n[268687] 2024-12-08 20:23 Миколай: ок\n[268688] 2024-12-08 20:23 Слава: И чё когда историю писать будем ?\n```\n\n### Версия 2 — 2024-12-10 · повтор прежней мысли\n\nвселенная: 7 островов (по дате объявления) · окно w0066 · сообщения 269205–269210\n\n*что здесь: предложено перенести озеро в перезапущенные 7 островов, «слегка изменив»; чем именно — не сказано*\n\n\n\n```chat\n[269205] 2024-12-10 21:52 Слава: И кроме людей хотел бы ещё рас добавить\n[269206] 2024-12-10 21:52 Слава: Да и монстров\n[269207] 2024-12-10 21:54 Слава: На заметку там будут камни желаний \nЗагадаешь сильная желания и камень сломается и превратиться в твой сосуд дав тебе способность накапливать энергий и по итогу получая структуру, Но ты умрёшь где-то через 10 лет, а умрёшь ты превратившись в камень желаний. Круговорот\n[269208] 2024-12-10 21:55 Слава: Озеро перерождения сюда можно засунуть конечно слегка изменив\n[269209] 2024-12-10 21:58 Слава: Ну для начала построим сам мир его историю и т п. \nА после будем разделать персонажей на то на все\n```\n\n## Часть чего\n\nБлагос
