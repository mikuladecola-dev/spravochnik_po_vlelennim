льная описания \nОн скорее в открытую нападает показывая ничтожество противника и превращает его в месиво\n[190767] 2024-06-28 22:31 Миколай: Ну, я так в принципе и думал, также думал что канет и иная интерпретация\n[190768] 2024-06-28 22:31 Миколай: Ок\n[190769] 2024-06-28 22:32 Миколай: Ты вообще как видишь\n[190770] 2024-06-28 22:32 Миколай: Типо он тьму призывает\n[190771] 2024-06-28 22:32 Миколай: И ей атакует\n[190773] 2024-06-28 22:32 Слава: Он из него сочится\n[190774] 2024-06-28 22:32 Слава: И у него Реген\n[190775] 2024-06-28 22:33 Слава: Ну да наверное\n[190776] 2024-06-28 22:33 Миколай: А, так может если ему руку отхуярить он сможет её восстановить или прилепить?\n[190777] 2024-06-28 22:33 Слава: Восстановить\n[190779] 2024-06-28 22:34 Миколай: Ну тогда он может проклинать противника, дебафить по всем статам лишь прикосновением\n[190780] 2024-06-28 22:34 Миколай: И уже над слабаками издеваться\n[190781] 2024-06-28 22:34 Миколай: Кромсать\n[190782] 2024-06-28 22:34 Слава: Нет\n[190784] 2024-06-28 22:35 Слава: Не будет\n[190791] 2024-06-28 22:35 Миколай: Понял\n[190793] 2024-06-28 22:35 Слава: Солнце поглашаеть все положительных чувств ( не действует на сильных духом)\n[190796] 2024-06-28 22:36 Миколай: Ага\n[190798] 2024-06-28 22:36 Миколай: А, сука я тоже самое написал другими словами\n[190800] 2024-06-28 22:36 Миколай: Ток щас понял\n[190802] 2024-06-28 22:36 Слава: И все больше дебаффов не будет\n[190806] 2024-06-28 22:37 Миколай: Пон, короче. Он бафает себе инструменты, они наделяются тьмой, и ну в общем лучше работают\n```\n\n## Часть чего\n\nТьма</div>"}];</script>
