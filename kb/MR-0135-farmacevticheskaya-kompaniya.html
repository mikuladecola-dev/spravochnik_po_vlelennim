<script>const BASE="../";const DOCNAME="Фармацевтическая компания";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Фармацевтическая компания\n\n*мир* · вселенные: Апостол, Нимб\n\n## Навигация\n\n- (w0089) Организация, которая приезжает к бригаде вместо полиции: берёт показания, даёт подписку о неразглашении, платит компенсации и оплачивает похороны. Её препараты, по словам рассказчика, умеют отращивать конечности, но на пострадавших их не потратили.\n- (w0094) Организация, которая приезжает вместо полиции, берёт показания, даёт подписку о неразглашении и откупные. 15 мая автор отвечает на прямой вопрос о её роли: биологическое оружие.\n\n## Связано с\n\nИван Васильевич, Тварь из пещеры\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-05-02\n\nвселенная: Нимб (по дате объявления) · окно w0089 · сообщения 323370–323370\n\n*что здесь: Появляется в эпилоге — единственный намёк на устройство мира вокруг истории*\n\n\n\n```chat\n[323370] 2025-05-02 10:34 Слава: Инстинкт выживания человек не позволит ему умереть просто так. Но он тоже не всесилен. И когда я собрался уже достаточно высоко. Силы начали покидать меня. И я ей богу свалился бы. И как же хорошо, что на дереве был бригадир. Он удержал мою тушу от падения. И упëр на ветку. И после этого дерева пошатнулось. Та тварь до сих пор пыталась меня поймать. Оно было злой. Ведь било куда сильнее нежели в той дерево, где висел Миша. И после нескольких таких ударов. В створе дерева уже появилась отверстия. Он бил и бил. И добился бы. Но бригадир спрыгнул. Просто взял и спрыгнул. И начал с матюками бежать к другому дереву. При этом махая руками, как видимо пытаясь привлечь это паскуду. Паскуда это заметила бригадира нашего и за ним. А я на дереве ору. Также пытаясь привлечь монстра. В такт к нашим ором. Голосить начали все, кто ругать, кто громко песню петь, кто молитву. Всё начали орать. А Мишка с тем кем ещё ногу повредил спрыгнул с деревьев. И оружия хватать начали. Быстро заряжая его. И как только бригадир запрыгнул на дерево. Прогремела два выстрела. И оба попали. Тварь то получив с двух двухстволок отлетала аж до другого дерева. Но всё ещё была жива. И начала она подниматься. А наши ещё подзарядиться не успели. Мы кричим, но это ходу дело не помогает. И здесь с дерева спрыгивает прям на эту собаку Игорь. Черт да что он творит возникла мысль у всех наверное. Но он как-то извернулся и подломил еë коленки. Оказывается без разгона она не столь страшна. И если держать его голову на виду то справиться  с ним будет достаточно легко. Поняв это мужики скопом накинулись на тварь. И я тоже больно спрыгнул да и побежал к тварюги. Схватив по пути палку. Все остальные тоже что-то похватали и начали бить эту тварь. И так били его до изнеможении. Когда от неё осталось лишь мокрая места. Оно как то было ещё живо. Как?. Это же нереально. Мы же переломали ей всё кости. А она до сих пор жива. Но не долго она была жива. Лишь издала крик настолько сильный, что мы всё по закрывали уши и на землю попадали. И ней дай бог она дальше бы крича. Мы бы точно там все бы оглохли бы. Но благо она прекратила орать и вообще прекратила подавать, какие либо признаки жизни. Мы все даже расслабились как то. Пока со стороны горы не услышали рёв. Не один их было множество. Десятки если не сотни тварей там кричала. И мы всё как то сразу ноги в руки да и по машинам. И на удивление быстро смогли уехать без потерей. \nПосле мы позвонили полиции. И сказали всё как есть. Они это за всерьёз не восприняли сначала. Но после нам перезвонили. Нет не полицая, а фармацевтическая компания. После они даже к нам ко всем. Лично приехали и взяли показание. А после попросили подписать бумажке о неразглашении. Конечно же с моральными выплатами, как мои 6 зарплат. А после уехали. Похороны Тохи они также оплатили. И оплатили медицинский расходы. Но при этом сами не предоставили свои препараты. Я то знаю. Да нет всё знают, что их ней препараты могут и конечность отрастить. Но они решили не тратить на нас это. Поэтому мне и ампутировали руку. Если бы они помогли то всё было бы иначе. Хотя это всё равно не посмертной письмо. Вряд ли из-за этого они решат меня убить. Надеюсь.\n```\n\n### Версия 2 — 2025-05-15\n\nвселенная: Апостол (по дате объявления) · окно w0094 · сообщения 326310–326315\n\n*что здесь: роль корпорации определена автором: биологическое оружие*\n\n\n\n```chat\n[326310] 2025-05-15 13:02 Миколай: Конкретные вопросы автору\nКакова роль фарм-корпорации? Это эксперименты, биологическое оружие или они «пылесосят аномалии»?\nПочему вы выбрали приём «$не допустила модерация$»? Это мета-шутка над цензурой или часть внутреннего мира (досье замазано)?\nЦель истории — напугать, разоблачить «заговор», исследовать мужскую психику на пределе? Что из этого главное?\nКакова судьба Ивана после событий? (Вы в начале даёте намёк на психушку — герой действительно в больнице, пишет исповедь? Или свободен, но параноит?)\nПланируете ли показать внешность существа целиком или оставить «чем меньше знаем, тем страшнее»?\n[326311] 2025-05-15 13:02 Миколай: отвечай\n[326314] 2025-05-15 13:04 Слава: Биологическая оружия \nНапугать\nНа свободе но параноит \nЧем меньше\n[326315] 2025-05-15 13:08 Миколай: https://codepen.io/jsqiaacs-the-sans/full/xbbMewx\n```\n\n## Часть чего\n\nИван Васильевич\n\n## Неясности\n\n- (w0089) Названия у компании нет; связь с организацией «Нимб» из прошлой истории Славы не заявлена\n- (w0094) Сам эпизод с компанией лежит в предыдущем окне, здесь только авторское уточнение</div>"}];</script>
