<script>const BASE="../";const DOCNAME="Толстяк-задира";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Толстяк-задира\n\n*персонаж* · вселенные: монстры\n\n## Навигация\n\n- (w0063) Здоровяк из новой школы, которому ГГ накануне разбил нос и который избил его на заднем дворе; наутро ждёт на крыльце и снова получает в лицо. Ходит со «своей недобандой».\n\n## Связано с\n\nГГ-защитник\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-11-11\n\nвселенная: монстры (по дате объявления) · окно w0063 · сообщения 255795–255805\n\n*что здесь: введён в прозе; служит герою способом выплеснуть эмоции и, по итогу, источником решимости — ГГ его за это благодарит*\n\n\n\n```chat\n[255795] 2024-11-11 14:45 Слава: Проснувшись с утра я чувство себя разбитым все тело болела, а глаза намеревались закрыться. У меня не было ни малейшего желания вставать и идти в школу. Но я уже давно понял что учусь только для себя, не для родителей которых не бывают дома, не для учителей который меняются так часто, что я не успевал запоминать имена. \nПоэтому я встал было тяжело все тело ныло после вчерашний пробежке.\nЯ пошел ванну чтобы умыться и прийти в себя, рука болела пока я умывался но я не обращал на это внимание ведь это ключ \nОдевшись и проверял что сестра спит я пошел в школу.\nПока я шел, улицы были пусты, вызывая у меня волнения, но все обошлось и я спокойно дошел до школы, где на крыльце меня ожидал здоровяк которому я вчера нос разбил и который после уроков ожидал меня на заднем дворе, где меня очевидно отмутохали.\nНо мне было наплевать я не боялся его стоявшим на крыльце, он казался мне незначительном после вчерашнего.\nИ я с весельем и наслаждением снова зарядил ему в лицо, было приятно просто подраться, забыть обо всем и просто бить толстого задиру. Пытаясь забыть, пытаясь выплеснуть все те эмоции который не давай мне успокоиться. И да возможно он снова придет со свой недо бандой ну и без разницы. Пусть придут, пусть побюуть пусть сломать руку, пусть ломают физически как хотят. Я не боялся людей, ведь это глупо человек боится человека если это и будет так то наша общество не крепче картонной коробке, а я верил что нашей общество крепкая, поэтому я не боялся, но чего я действительно боялся это то невообразимое существо который в любой момент может взять и убить я боюсь его настолько что мое страх перерастает в гнев а из гнева в решимость убить эту тварь, ради безопасности сестры, ради мой безопасности, ради безопасности этого толстяка которого я сейчас бью. И с чего я вообще взял что это не человек. Я же его не видел, да он был большим, а руки длинный и острый ногти но это вполне мог быть человек, а если это человек то и бояться его не надо.\nЯ с благодарностью взглянул на  окровавленной лицо толстяка. Он дал мне решимость и почти что решил страх. Я благодарен ему и его лицу.\n--- пауза 4.0 ч ---\n[255803] 2024-11-11 18:45 Миколай: так как я решил что буду читать и думать\n[255804] 2024-11-11 18:45 Миколай: я хуй его знает когда прочту\n[255805] 2024-11-11 18:45 Миколай: но хорошо что ты написал\n```\n\n## Неясности\n\n- (w0063) имени нет</div>"}];</script>
