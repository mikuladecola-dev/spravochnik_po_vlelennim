5-05-18 22:35 Миколай: .это я про молнию если че, че то ты проигнорировал.\nзнай теперь\n```\n\n### Версия 6 — 2025-05-19\n\nвселенная: Апостол (по дате объявления) · окно w0097 · сообщения 328106–328128\n\n*что здесь: Первая и единственная присылка текста целиком, плюс отклик Миколая на название и на тему вины*\n\n\n\n```chat\n[328106] 2025-05-19 11:16 Слава: Ну всё он сделан\n[328107] 2025-05-19 11:16 Слава: Но грамматика говно как всегда\n[328108] 2025-05-19 11:16 Миколай: ура\n[328109] 2025-05-19 11:16 Слава: Скидывать?\n[328110] 2025-05-19 11:17 Миколай: да, кидай, но я прочту не сразу, но постараюсь сегодня\n[328111] 2025-05-19 11:17 Слава: Вина \nЧто может быть страшней вины? Да можно привести пример физическую боль или потерю, какого-то близкого. Но физическая боль никогда не сравниться с самокопанием.  А потеря кого-то близкого возможно конечно сравниться. Но ты подумай, какие чувство ты испытываешь. Боль, непринятия, отрицания, гнев, жалость, ВИНА. Даже если ты не виноват. То всё равно отхватишь, это чувство вины. Словно ты мог, что-то сделать, чтобы предотвратить это. Но не сделал. Если бы я.......Если бы он.......если бы. И эти мысли и чувство будет тебя разъедать. Разрушать твой стержень. И не факт, что ты снова сможешь собраться. Да и не факт, что собравшись ты будешь тем кем был. \nЯ тот кто разрушился. И так не собрался. Мне не хватило духа продолжить жить. Зная, что я мог всё исправить, что я мог помочь. Не отвернуться тогда. Не побояться. Но то что было то не вернуть. Нельзя вернуться в прошлое и что-то исправить. Поэтому остаётся лишь одной напиться в стельку. \n\nЯ закупил водки. Придя домой, я сразу пошёл к аптечке. Там у меня лежали антидепрессанты. \nВскрыв пачку. Я без раздумий хватаю горстку таблеток. И запихиваю в рот. Запивая водкой. Сумасшедший коктейль, который бьёт по мозгам. Который делает мысли тягучими, липкими. А также делает тебя более открытым. Потому что ты даже не можешь обдумать мысль, как уже что-то сделал. И нет этот напиток t;отомсти&quot;. И палач начинает выбираться наружу. Из внутреннего мучителя — в реального. Раньше он казнил только Сашу, теперь у него появляются новые цели. И вот тут я хочу сказать кое-что непопулярное. Мне не кажется, что это &quot;исцеление&quot;. Это не &quot;он нашёл цель и начал жить&quot;. Это перенаправление саморазрушения. Механизм тот же — палач, казнь, приговор без суда. Просто теперь направлен наружу. Саша не перестал себя казнить — он добавил других к списку. И начальник это понимает, текст это прямо говорит: &quot;Прекрасно понимая, что сейчас возможно создаёт убийцу.&quot; Это мрачная концовка, даже если она выглядит как &quot;герой нашёл смысл&quot;. Смысл, построенный на мести — это та же вина, вывернутая наизнанку. &quot;Я виноват что не спас&quot; превращается в &quot;они виноваты что убили&quot;. Но структура одна — кто-то должен быть наказан. Раньше он наказывал себя. Теперь будет других. Но палач — один и тот же. --- И ещё одно. Мелкая деталь, но она меня зацепила. Шрамы на щеках, которые &quot;напоминали слёзы&quot;. Они остаются после возвращения из бреда. Всё остальное исчезло — а шрамы остались. Как будто тело решило зафиксировать то, что он внутри себя переживал. Вина буквально вырезала себя на его лице. Он больше не может её скрыть — она видна всем. --- Если говорить о самом тексте — видно что писал человек, который что-то чувствует и пытается это передать. Местами сырой, местами повторяется, местами грамматика рассыпается — но в этом есть своя правда. Это не причёсанный текст. Он написан так, как думает человек в таком состоянии — рвано, кругами, с провалами. Не знаю, намеренно это или нет, но работает. Образ с опарышами на теле сестры — это сильно.\n[430032] 2026-02-08 13:07 Миколай: Жестоко, физиологично, невозможно развидеть. И то, что он видит не тело сестры, а &quot;мясо, кости, мышцы&quot; — там даже нечего опознать, кроме цепочки. Человека уже нет. Есть только вещь, которая когда-то принадлежала человеку.\n```\n\n## Грани этой с
