едителем был пустырник. Как никак защитник ранен. Да ещё и только получил благословенния. Но даже так он продолжал бежать за нами. Хотя и понимал, что не догонит. В вокруг нас в это же время. Словно взрываись деревья. Но пустырник легко от них уклонялся. И когда между нами и защитникам. Расстояния была уже, где-то 150 метров. Я увидел, что в той темноте, где блестели белый глаза. Засветилась нога. В ярко оранжевый. И рывок. И он уже сократил с нами дистанцию на 147 метров. И он дышал мне в лицо. И в спину пустырник. И сам не поняв почему? И как, я вот до этого додумался . Я прокричал \n-ТЕЛА ТВОЙ ЖЕНЫ и ДОЧЕРИ. Я СКИНУЛ В БЛИЖАЙШИЮ РЕКУ. ЕсЛИ ТЫ НЕ ПОТОРОПИСЯ ТО ОНИ УПЛЫВут! - кричал я во всю глотку. Словно это был единственный шанс спастись. И он помог. Он остановился. И словно зверь прокричал \n-ТЫ СДОХНЕШЬ! - а после направился в сторону реки. А я выдохнуть не мог. Страх сковал мои мысли и тела.&quot; Он убьёт меня&quot;. Билось в голове. И даже когда он перестал за нами гнаться. Я трясся. Эта-то молчаливая машина для убийства. Которая даже, когда его избивали и резали. Не проронила даже писка. Прокричал что &quot; Убьёт меня&quot;. Я должен стать сильней, чтобы защитить себя. Я должен восстановиться и начать тренировки. Больше не каких тест-драйвов. \n\nВ это же время в больнице. Находившийся в Санкт-Петербурге. Парень собирал свои вещи с палаты. Если честно, там и вещей его и не было. Он просто пытался услышать голос внутри себя. \n-Антон с тобой всё хорошо?- нежно мягким тонном. Произнёс мужчина стоящий в в дверях -Может лучше ещё в больнице побудешь? \n-Нет. Физические я полностью восстановился. Просто как то тихо в голове- слегка грусно произнёс Антон. Ему было грустно. Ведь он чувствовал, что у него нету больше, чего-то важного. И эта осознания. Давала решимость. Научиться пользоваться, той одарённой его силой. Чтобы убить одного старого и до ужаса лицемерного старика\n[302381] 2025-03-14 16:30 Слава: Это будет первая места\n```\n\n### Версия 2 — 2025-03-14
