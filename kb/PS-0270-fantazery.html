const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Фантазёры\n\n*персонаж* · вселенные: Апостол\n\n## Навигация\n\n- (w0094) Категория носителей сил: сначала последней строкой в перечне категорий 10 мая, затем 14 мая — среди того, что надо добавить в реестр.\n- (w0099) Правители с маленькой буквы: создали свой мир в голове и потому видят наш иначе и влияют на него по законам своего. Сильнейшие существа, но склонны исчезать.\n\n## Связано с\n\nАЗИП, Артефакты, Благословенные, Организация нимб, Правители\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-05-10\n\nвселенная: Апостол (объявлено) · окно w0094 · сообщения 324539–324541\n\n*что здесь: названы в перечне категорий сил*\n\n\n\n```chat\n[324539] 2025-05-10 08:57 Миколай: но я не был уверен что этот норм\n[324541] 2025-05-10 09:29 Слава: Благословенный \nАрбетары\nАльфы \nЧужемирцы \nВладельцы артефактов \nФантазёры\n```\n\n### Версия 2 — 2025-05-14 · повтор прежней мысли\n\nвселенная: Апостол (объявлено) · окно w0094 · сообщения 325805–325808\n\n*что здесь: повторно названы как то, что надо добавить в реестр*\n\n\n\n```chat\n[325805] 2025-05-14 12:34 Миколай: в чем\n[325806] 2025-05-14 12:34 Миколай: убрать кого-то?\n[325807] 2025-05-14 12:34 Миколай: добавить\n[325808] 2025-05-14 12:34 Слава: Добавления организация нимб и фантазеров \nИ перераспределение сил\n```\n\n### Версия 3 — 2025-05-31\n\nвселенная: Апостол (объявлено) · окно w0099 · сообщения 331636–331636\n\n*что здесь: создали мир в голове, из-за чего видят мир своей физической оболочки по-другому; пример — фантазёр, видящий стену как миллионы движущихся линий-колебаний, и способный, потянув нитку, превратить стену в воздух, воду или взорвать её; на данный момент сильнейшие существа, но могут потерять связь с нашим миром и полностью уйти в свой, исчезнув, поэтому их очень мало*\n\n\n\n```chat\n[331636] 2025-05-31 08:00 Слава: Правители не как не могут влиять на благословенного или обычного существа ( кроме как насильственно давать благословения, даже если само существо этого не хочет) (благословения даётся только одно. Больше человек не выдержит. И это одно благословения с ним до его смерти. Благословения нельзя разорвать). \nПри этом правители всевидящий. \n\nАрбетары и Альфа это одни те же существа. Но в первом случае это люди из кильке, а во втором это чужемирцы. Если их описывать то это существа, который насильственно вырвали кусок силы своего мира( с помощью ритуала??? Которой я ещё не доработал). А после посели его в себе и заставили выделять силу. Из-за того, что грубо говоря это их сила ( внутри них). Они могут использовать его без ограничений. ( по сути это благословенния только не через связь. А именно это сила находиться внутри их) Виде перегрузки мозга. Их ней базовый умений: усиленная регенерация( регенерация чаще всего превосходит благословенных) ; усиление тела и чувств; аура; сенсорика. \nИ также получают уникальную способность. Даже если они сцапали один и тот же кусок силы. У них она всё равно будет разная. Так как этот кусок начинает формироваться подобно апостолом. Из-за этого они получают уникальную способность. При этом если они подожгут лес он будет гореть пока весь не выгореть. Либо его не потушат. Им не зачем отключат  способность. У них даже нету такого понятия,  как отключения. Но они должны будут учиться вырабатывать энергию и научиться использовать способность и контролировать энергию. Когда у благословенным это выходит автоматический. \n\nФантазеры это можно сказать правитель с маленькой буквой. Они создали свой мир в голове. Из-за этого даже глядя на наш мир ( то бишь мир в котором находиться их физическая оболочка). Они видят его по другому \nПример фантазёр, что видит мир виде линей, колебаний. Глядя на стенку он видит лишь большо миллиона движущих линий, который за, что-то отвечают. \nИз-за этого он способен влиять на наш мир. По законам своего. То есть он может изменить колебания волны ( нитки). И стена может стать воздухом или водой или взорваться в зависимости. Какую нитку потянули и как на неё повлияли. \nФантазёр на данный момент сильнейший существа. Но они могут просто исчезнуть. Потерять связь с нашим мирам и полностью окунуться свой. Исчезая. Из-за этого их очень мало. Ведь нет не одной причины жить в мире правителя. Если ты можешь попасть в свой. \n\nАртефакты это объект, что имеет силу правителя. Из-за того, что. Когда то правитель пытался создать мир. И не в состоянии полностью контролировать этот процесс наделили какой-либо объект через чур большой сил этот самый объект. Примечания: Благословенный; альфа, Арбетары и фантазёры не способны раскрыть всю мощь артефакта. Так как уже сами переполненный силой. Лучшего всего мощь артефакта способен раскрыть обычный человек. \n\nАртефакты с символикой- это артефакт, который не был ни кем создан. Они появились вместе с правителями и имеют невероятную мощь. Но смертным существами некогда не раскрыть хотя бы 3 процентов всей мощи артефакт.\n```\n\n### Версия 4 — 2025-05-31\n\nвселенная: Апостол (объявлено) · окно w0099 · сообщения 331663–331667\n\n*что здесь: вопрос Миколая, можно ли попасть в мир фантазёра — ответ Славы: нет*\n\n\n\n```chat\n[331663] 2025-05-31 09:47 Миколай: а в мир фантазёра можно попасть?\n[331664] 2025-05-31 09:51 Миколай: хочу\n[331665] 2025-05-31 09:54 Миколай: ну в целом крайне интересно\n[331667] 2025-05-31 09:55 Слава: Нет\n```\n\n## Часть чего\n\nБлагословенные\n\n## Неясности\n\n- (w0094) Устройство категории не раскрыто</div>"}];</script>
