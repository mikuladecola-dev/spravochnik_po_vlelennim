<script>const BASE="../";const DOCNAME="Клаустрофобия";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Клаустрофобия\n\n*история* · вселенные: неясно\n\n## Навигация\n\n- (w0110) Рассказ С: герой приезжает в полуразрушенный ресторан советской постройки в пяти километрах от посёлка, где его ждёт нервный друг Саша с разговором о странностях вокруг. Обрывается на том, что рассказчик уходит.\n\n## Связано с\n\nНумерация присланных историй (Первый, Второе, Третье, Четвёртое, Пятая), Саша (Саня)\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-11-21\n\nвселенная: неясно (по дате объявления) · окно w0110 · сообщения 387575–387576\n\n*что здесь: Текст целиком одним сообщением, первый из присланной пачки*\n\n\n\n```chat\n[387575] 2025-11-21 18:16 Слава: Клаустрофобия\n\nЗайдя в плохое сохранийвшиеся ресторан, что был возведён ещё наверное в союзе. И был от населённого пункта пять километров. \nМой взгляд быстро уцепился за фигуру нервное курящие в угле данного заведения. Я быстро понял, что это фигура мой друг, что как раз и пригласил меня побеседовать на темы неизвестные мне. \nДруг тоже заметил меня и нервно замахал мне. Со стороны это могло показаться словно у него припадок. \nБыстро подойдя до друга и сойдясь на деревянные стул. Я спросил своего друга о цели нашей встречи. \n- Серёга ты не замечал ничего странного? - вместо ответа задал вопрос друг. \n-Нет - сказал слишко агрессивно. Но моя агрессия была оправдана. Ведь Саша в свет не заря, начал мне названивать, а когда я ответил, заставил тащится в этое богом забытое место. \n- что вообще должен был я заметить- добавил я. \n- ну... - неуверенно протянул Саша\n- может вокруг тебя люди странно себя начали вести или... - он сделал паузу, так и не подобрав слова. \n-единственной кто странно себя ведет. Так это только ты- мой друг отвёл взгляд и даже немного съежился. Здесь и слепой бы понял, что Сашу что-то беспокоит и очень сильно. Почуствовал себя слегка виноватым перед ним я спросил. \n-ладно, что именно странного я должен был увидеть- Саня взбодрился и начал поливать без вязаные мысли, как будто ему в голове всё блендером перемещали. \n-мёртвые глаза, как у рыбы, а ещё они что мастерят, и в новостях по кримильном хроником говорилось, что число смертей возросло, а ещё... - продолжал друг не замечая, как я на него смотрю, как умалишенного. \nНет, Сергей и раньше был слегка параноиком, что любил расказывать о теориях заговора. Но он не когда не рассказывал о этом всерьёз, так просто как о интересной вещи, как о сериале. \nЯ оглянулся в  ресторане, неизвестно на каких людей предназначеные. Пусто, здесь было пусто, не одного человека. Мне стало как то не по себе. \n- ты меня слушаешь?!- прикрикнул Саня\n- а знаешь давай попозже поговорим, у меня там дела- сказал в лоб я ему. Уж такой я человек, что не умеет отмазываться. Возможно поэтому он и начал расказывать это именно мне.\n[387576] 2025-11-21 18:16 Слава: Первый\n```\n\n## Неясности\n\n- (w0110) Вселенная не названа; имя рассказчика внутри текста скачет — Серёга/Сергей</div>"}];</script>
