<script>const BASE="../";const DOCNAME="Омнитрикс";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Омнитрикс\n\n*идея* · вселенные: Бен 10\n\n## Навигация\n\n- (w0006) Упомянут Славой как предмет желания («душу продам ради Омнитрикса рабочего») в том же монологе 21 октября; тут же отброшен в пользу способности создавать предметы. Своей разработки вокруг него в окне нет.\n- (w0014) 2023-06-03 разворачивается целая линия: как игрок получает Омнитрикс в аддоне. Сначала философский вопрос &#x27;создать или дар небес&#x27;, затем четыре разных механики выдачи предмета.\n- (w0015) Ключевой предмет-способность в аддоне по Бен 10: превращение в пришельцев. В окне трижды: как визуальный образ для генерации видео (синяя голограмма в лесу), как механика аддона (меню выбора пришельца) и как объект, который нейросеть не смогла нарисовать.\n\n## Связано с\n\nАддон «Бен 10» для Minecraft, Аддон по Бен 10 (для Майнкрафта), Гвен, Ультиматрекс, Эндер дракон, пришельцы, способность создавать любой предмет\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2022-10-21\n\nвселенная: неясно (не определено) · окно w0006 · сообщения 19529–19534\n\n*что здесь: единственное упоминание: рабочий Омнитрикс как желаемый артефакт, условие — продажа души и жизнь минимум год, максимум десять лет*\n\n\n\n```chat\n[19529] 2022-10-21 21:04 Слава: Ты был хорошим другом не много странным но все равно хорошим\n[19530] 2022-10-21 21:06 Слава: Если ты в раю ну или в аду скажи им что я готов душу продать ради Омнитрикса рабочего и чтобы после этого я прожил ну как минимум 1год а как максимум 10лет\n[19531] 2022-10-21 21:08 Слава: Ну если что возьми на заметку\n[19532] 2022-10-21 21:09 Слава: Что такое душа душа это внутренности тела а без внутренности не кто не сможет жить\n[19533] 2022-10-21 21:09 Слава: Привет\n[19534] 2022-10-21 21:12 Слава: Нет я хочу способность создавать любой предмет по типу лазерного меча или деньги который будут настоящими или часы который останавливает время\n```\n\n### Версия 2 — 2023-06-03\n\nвселенная: Бен 10 (объявлено) · окно w0014 · сообщения 43530–43539\n\n*что здесь: Исходная посылка: Омнитрикс нельзя скрафтить, это дар небес — он должен упасть с неба, как Тетрадь смерти.*\n\n\n\n```chat\n[43530] 2023-06-03 11:02 Миколай: Привет\n[43531] 2023-06-03 11:02 Миколай: Как думаешь\n[43532] 2023-06-03 11:02 Миколай: Омнитрикс создать можно?\n[43533] 2023-06-03 11:02 Миколай: Или это дар небес?\n[43534] 2023-06-03 11:53 Слава: Дар небес\n[43535] 2023-06-03 12:28 Миколай: Ты понимаешь что это значит?\n[43536] 2023-06-03 12:28 Слава: Да\n[43537] 2023-06-03 12:28 Слава: Омнитрикс упадет с небес\n[43538] 2023-06-03 12:29 Миколай: Как Тетрадь смерти?\n[43539] 2023-06-03 12:29 Миколай: Крч\n```\n\n### Версия 3 — 2023-06-03\n\nвселенная: Бен 10 (объявлено) · окно w0014 · сообщения 43540–43553\n\n*что здесь: Механика первая: Эндер дракон при смерти взлетает вверх и выбрасывает опыт — теперь он вдобавок роняет Омнитрикс, то есть тот буквально падает с небес. Возражение Славы: он не сможет убить дракона.*\n\n\n\n```chat\n[43540] 2023-06-03 12:30 Миколай: По моей задумке, я должен был тебе написать следующее &quot;хуй теперь ты скрафтишь Омнитрикс&quot;\n[43541] 2023-06-03 12:31 Миколай: И у меня появилась идея\n[43542] 2023-06-03 12:31 Миколай: Прямо сейчас\n[43543] 2023-06-03 12:31 Миколай: Как ты его получишь\n[43544] 2023-06-03 12:32 Миколай: Крч, когда умирает Эндер дракон, он поднимается вверх и выбрасывает опыт\n[43545] 2023-06-03 12:33 Миколай: Теперь он уронит Омнитрикс ещё\n[43546] 2023-06-03 12:33 Миколай: При смерти дракон взлетает вверх же врд\n[43547] 2023-06-03 12:33 Миколай: Поэтому Омнитрикс упадёт с небес\n[43548] 2023-06-03 12:33 Слава: Ты думаешь я смогу убить дракона\n[43549] 2023-06-03 12:33 Миколай: Конечно нет\n[43550] 2023-06-03 12:34 Миколай: Че ты тогда предлагаешь\n[43551] 2023-06-03 12:34 Слава: Тогда зачем\n[43552] 2023-06-03 12:34 Слава: Конечно нет\n[43553] 2023-06-03 12:34 Миколай: Ну бл, идея то хорошая\n```\n\n### Версия 4 — 2023-06-03\n\nвселенная: Бен 10 (объявлено) · окно w0014 · сообщения 43551–43556\n\n*что здесь: Механика вторая, предложение Славы: специальное устройство, которое призывает Омнитрикс с неба.*\n\n\n\n```chat\n[43551] 2023-06-03 12:34 Слава: Тогда зачем\n[43552] 2023-06-03 12:34 Слава: Конечно нет\n[43553] 2023-06-03 12:34 Миколай: Ну бл, идея то хорошая\n[43554] 2023-06-03 12:35 Слава: Что бы была специальная устройство который бы призывала бы омнитрикс с неба\n[43555] 2023-06-03 12:35 Миколай: Крч есть ещё идея\n[43556] 2023-06-03 12:36 Миколай: Но сначала вопрос\n```\n\n### Версия 5 — 2023-06-03\n\nвселенная: Бен 10 (объявлено) · окно w0014 · сообщения 43555–43567\n\n*что здесь: Механика третья: поставить стойки для брони и назвать их именами родителей Бена (папа, мама) — игра поймёт, что ты Бен 10, и с неба упадёт Омнитрикс. Слава называет её лучшей. Побочно выясняется, что имена родителей Бена существуют, но собеседники их не помнят.*\n\n\n\n```chat\n[43555] 2023-06-03 12:35 Миколай: Крч есть ещё идея\n[43556] 2023-06-03 12:36 Миколай: Но сначала вопрос\n[43557] 2023-06-03 12:36 Миколай: У Бена есть родители?\n[43558] 2023-06-03 12:36 Слава: Да\n[43559] 2023-06-03 12:36 Миколай: Известны их имена?\n[43560] 2023-06-03 12:36 Слава: Я не помню имен\n[43561] 2023-06-03 12:37 Миколай: Но они есть?\n[43562] 2023-06-03 12:37 Миколай: Имена\n[43563] 2023-06-03 12:37 Слава: Да\n[43564] 2023-06-03 12:37 Миколай: Крч\n[43565] 2023-06-03 12:38 Миколай: Можно будет стойки для брони поставить и назвать их именем родителей. допустим папа, мама. И если ты это сделаешь, то игра поймёт что ты бен10 и с неба упадёт Омнитрикс\n[43566] 2023-06-03 12:39 Слава: Это лучший\n[43567] 2023-06-03 12:39 Миколай: Согл\n```\n\n### Версия 6 — 2023-06-03\n\nвселенная: Бен 10 (объявлено) · окно w0014 · сообщения 43568–43575\n\n*что здесь: Механика четвёртая, &#x27;проще но скучнее&#x27;: Омнитрикс падает с неба сразу при первом входе в мир с аддоном; плата за это — нельзя терять вещи при смерти.*\n\n\n\n```chat\n[43568] 2023-06-03 12:40 Миколай: Ну есть ещё одна идея\n[43569] 2023-06-03 12:40 Миколай: Она проще но скучнее\n[43570] 2023-06-03 12:41 Миколай: Как только ты добавишь аддон и войдёшь в мир, с неба сразу упадёт Омнитрикс\n[43571] 2023-06-03 12:42 Слава: Вот это да\n[43573] 2023-06-03 12:42 Миколай: Но ты не сможешь терять вещи при смерти\n[43574] 2023-06-03 12:43 Миколай: Пойду идею испробую\n```\n\n### Версия 7 — 2023-06-09\n\nвселенная: Бен 10 (объявлено) · окно w0015 · сообщения 44373–44396\n\n*что здесь: Визуальный образ: Бен 10 использует Омнитрикс в лесу, появляется синяя голограмма, объект в фокусе, кинематографично — формулировка запроса к нейросети для видео.*\n\n\n\n```chat\n[44373] 2023-06-09 17:19 Миколай: Попросил нейросеть создать видео на тему &quot;бен 10 в Майнкрафт&quot;\n[44374] 2023-06-09 17:20 Слава: Не похожа\n[44375] 2023-06-09 17:21 Миколай: Но, нейросеть плохо справилась\n--- пауза 1.6 ч ---\n[44383] 2023-06-09 18:57 Миколай: Теперь я написал &quot;Бен 10 использует Омнитрикс в лесу, появляется синяя голограмма, объект в фокусе, красивый, кинематографичный&quot;, ну получилось неплохо\n[44384] 2023-06-09 18:57 Миколай: Надо учитывать что это только начало\n[44385] 2023-06-09 18:57 Миколай: Раньше такое вообще невозможно было сделать\n[44386] 2023-06-09 18:58 Миколай: Можно сказать что эта нейросеть только родилась\n[44387] 2023-06-09 19:03 Миколай: А вот так даже лучше\n[44395] 2023-06-09 19:44 Миколай: Нейросеть заменила стиль этого видео, на стиль бен 10\n```\n\n### Версия 8 — 2023-06-12\n\nвселенная: Бен 10 (объявлено) · окно w0015 · сообщения 44781–44824\n\n*что здесь: Механика в аддоне: отказ от отдельных предметов-пришельцев (надевать на голову как в Мстителях), только Омнитрикс — открываешь, выбираешь пришельца, нажимаешь, превращаешься; аддон при этом легче. Отдельно обсуждаются способности, модели и крафт предметов.*\n\n\n\n```chat\n[44781] 2023-06-12 17:59 Миколай: На сколько я понял ты хочешь управление похожее то что в видео?\n[44782] 2023-06-12 17:59 Слава: Нет способности\n[44783] 2023-06-12 17:59 Миколай: А бля\n[44784] 2023-06-12 17:59 Слава: И возможно модели\n[44785] 2023-06-12 17:59 Миколай: Способности и модели хуйня\n[44786] 2023-06-12 18:00 Миколай: Точнее расплюнуть\n[44787] 2023-06-12 18:00 Слава: Ну я его ещё не нашел\n[44788] 2023-06-12 18:00 Миколай: Я тут уже с GUI ебаться начал\n[44789] 2023-06-12 18:00 Миколай: Найдёшь и можно сказать способности у тебя\n[44790] 2023-06-12 18:01 Слава: А модели\n[44791] 2023-06-12 18:01 Слава: ?\n[44792] 2023-06-12 18:01 Миколай: И модели тоже\n[44793] 2023-06-12 18:01 Миколай: А вот кнопки не получишь\n[44794] 2023-06-12 18:01 Миколай: Я попробую другое управление ебануть\n[44795] 2023-06-12 18:02 Миколай: Кнш трудновато, но удобно\n[44796] 2023-06-12 18:02 Миколай: И ещё один вопрос\n[44797] 2023-06-12 18:03 Миколай: Добавить пришельцев в виде предметов\n[44798] 2023-06-12 18:03 Миколай: Типа как в Мстителях на голову чтобы надевать?\n[44799] 2023-06-12 18:03 Миколай: И так превращатся\n[44800] 2023-06-12 18:03 Слава: А омнитрикс\n[44801] 2023-06-12 18:03 Миколай: Вот именно\n[44802] 2023-06-12 18:03 Миколай: Думаю нахуй все это\n[44803] 2023-06-12 18:04 Миколай: Так и аддон меньше весить будет\n[44804] 2023-06-12 18:04 Слава: Омнитрикс\n[44805] 2023-06-12 18:04 Миколай: Но\n[44806] 2023-06-12 18:04 Слава: Омнитрикс\n[44807] 2023-06-12 18:04 Миколай: Чисто Омнитрикс\n[44808] 2023-06-12 18:04 Миколай: Без отдельных предметов\n[44809] 2023-06-12 18:04 Миколай: Ну крс\n[44810] 2023-06-12 18:04 Миколай: Крч\n[44811] 2023-06-12 18:04 Миколай: Ты\n[44812] 2023-06-12 18:04 Миколай: Расскажи как он работать будет\n[44813] 2023-06-12 18:05 Миколай: Может у меня хуйня идея\n[44815] 2023-06-12 18:06 Слава: Омнитрикс и там выбираешь пришельца нажимаешь и превращается\n[44816] 2023-06-12 18:06 Миколай: Во\n[44817] 2023-06-12 18:06 Миколай: Так и собирался\n[44818] 2023-06-12 18:07 Миколай: А какие-то предметы крафтить не хочешь?\n[44819] 2023-06-12 18:07 Слава: Ну можно\n[44820] 2023-06-12 18:07 Миколай: Типа статую Гвен в полный рост\n[44821] 2023-06-12 18:07 Миколай: Я думаю в пизду эту машину, да\n[44822] 2023-06-12 18:07 Слава: ?\n[44823] 2023-06-12 18:08 Миколай: Ну у дяти есть\n[44824] 2023-06-12 18:08 Миколай: На маршрутку похожа\n```\n\n### Версия 9 — 2023-06-15 · повтор прежней мысли\n\nвселенная: Бен 10 (объявлено) · окно w0015 · сообщения 45403–45416\n\n*что здесь: Попытка сгенерировать изображение Омнитрикса нейросетью: вышло непохоже, сеть не знает, что такое Омнитрикс.*\n\n\n\n```chat\n[45403] 2023-06-15 23:17 Миколай: Красиво?\n[45404] 2023-06-15 23:17 Миколай: Но, блять они не работают\n[45405] 2023-06-15 23:18 Миколай: Что красивые картинки\n[45406] 2023-06-15 23:18 Слава: Да\n[45407] 2023-06-15 23:18 Миколай: Я хотел написать чисто красивые картинки\n[45409] 2023-06-15 23:19 Миколай: Это я пытался Омнитрикс создать\n[45410] 2023-06-15 23:19 Слава: Ну не особо похоже\n[45411] 2023-06-15 23:19 Миколай: Но\n[45412] 2023-06-15 23:19 Миколай: Вщ не понимает нейросеть, что такое Омнитрикс\n[45413] 2023-06-15 23:19 Миколай: Че её не учат\n[45414] 2023-06-15 23:20 Миколай: Че не спишь\n[45415] 2023-06-15 23:20 Слава: Спокойной ночи\n[45416] 2023-06-15 23:20 Миколай: Спокойной ночи\n```\n\n## Неясности\n\n- (w0006) заимствование из мультсериала «Бен 10», собственной переработки в окне не видно</div>"}];</script>
