const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Алексей\n\n*персонаж* · вселенные: Нимб\n\n## Навигация\n\n- (w0090) Рассказчик пролога про апокалипсис (323659-323660), обращается к читателям напрямую. До инцидента - обычный офисный сотрудник, ни детей, ни девушки; в день удара ехал за подарком племяннице.\n- (w0110) Рассказчик «Места и ты», клиент психолога, девятая встреча. Биография: отец — религиозный пьяница, окунавший его в холодную воду; отрывал лапки насекомым; перебил молотком лапы белому коту; бил и унижал сверстников. Формулирует себя как того, кто ненавидит доминирование над собой и любит доминировать сам.\n\n## Связано с\n\nИнцидент (ядерный удар), Место и ты, Племяшка Алексея, Пролог про апокалипсис, Существо без кожи («кусок мяса»)\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-05-04\n\nвселенная: Нимб (по дате объявления) · окно w0090 · сообщения 323659–323662\n\n*что здесь: Первое появление. Заявлен как выживший, ведущий рассказ уже после катастрофы; сам подчёркивает, что он обычный человек и чуда с пафосом не будет. По ходу пролога проснулся по будильнику в выходной, поговорил с племяшкой, поехал в магазин и попал под удар: здание обрушилось на его машину.*\n\n\n\n```chat\n[323659] 2025-05-04 11:41 Слава: Скажите вы мне честно. Не надо врать или лицемерить. Это лишь вопрос. Вы ценили то время в котором жили мы? Хотя ответ я и так прекрасно знаю. Нет. \nМы не ценили то время, где могли учиться, развиваться и мечтать. То время, где хаус и неразбериху. Упорядочил порядок и закон. Где ясно было где плохой, а где хороший. Где ты мог стать хоть кем угодно. И не надо этих восклицание. Вроде &quot;мы не могли стать кем хотели&quot;. Ведь это бред. Мы могли стать кем угодно, если бы возжелали этого. Да даже президентом стать могли. А также мы могли мечтать и надеяться на лучшей. \nМы жили в том порядке,  который наши предки собрали за миллионы лет истории. Но ничто не вечно. И весь порядок собранный так долго, тщательно, был разрушен в один миг. \nХотите знать, что же было и что прошло? Я отвечу честно. Не буду врать или искажать историю. Ведь ты, вы обязаны знать. Но не ждите чудо, пафоса и интриги. Я обычный человек. Держите это в голове. Ладно начнем. \nЯ Алексей выживший. В том мире, в котором жиле мы до инцидента я был просто офисный сотрудник. И в тот день, я как обычно проснулся от звона будильника. От такого самого Би Би Би. Ха такой бесячий звон, который наверное всё ненавидят. Но я скучаю. \nЯ проснулся раздраженным. Ну как проснулся. Открыл глаза, а мозг спал. Не желал он просыпаться. Ведь кто желает просыпаться выходной. Да выходной. У вас наверное возник вопрос. Зачем будильник я завёл? . Лишь по одной причине. День рождения у племяшки. \nСразу вас скажу. У самого детей или хотя бы подружки у меня нету. Не сложилась как-то. Но сестра уже в 20 вышла замуж и родила мне племяшку. Как вы поняли по моим словам. Я хорошо относился к племяшки. Поэтому и выключил будильник и дальше лег я спать.\nНо не долго спал я. Мне начали звонить. Племяшка трезвонила мне на телефон. \nБыстро схватив телефон, который лежал на тумбочки. Я ответил и услышал детский голос. \n-дядя! Вы проснулись? Мама сказала позвонить, иначе вы не проснетесь. Но ведь это же не правда. Вы же и без меня проснулись. Вы же не могли проспать мой день рождения- протараторила племяшка. Словно пулемёт, а не ребёнок. \nПока я пытался собрать мысли. И понять, кто и зачем же звонят мне? \n-кто это? - ответил сонным голосом я \n-ДяДЯ!! Вы же шутите! - проорал детский писклявый голос в трубку моего телефона. Из-за этого я чуть ли не подпрыгнул с кровати. И именно этот писклявый голос заставил мой мозг работать. Собирать пазл из моих воспоминаниях. И наступило осознания, который ударил как булавой по затылку. \n-а да-да шутка- начал я врать родной племяннице. \n-точно шутка- более тихим голосом произнесла племяшка. \n-конечно, как же я мог проспать твой день рождения- говорил я смотря на время. И увидев там 8:23. Вздохнул про себя. \n-сейчас уже за подарком еду. Ждите меня ближе к 12- сказал я. После того как примерно посчитал. Сколько займёт времени туда и сюда. \n-в 11- сказал племяшка с едва обидчивым тоном \n-хорошо постараюсь к 11- сказал я протирая глаза. \n-вы же поможете в готовке маме. Если что это не она попросила спросить- сказала она. А в моём голове пронеслось &quot;Да-да не она попросила&quot;\n-сегодня ещё приедет моя подруга Катя и Лера. У них очень красивые куклы и домик даже для кукол есть- продолжала она свой монолог. Пока я пытался найти взглядом свои штаны. \n-а ещё щеночек, такой пушистый и милый-\n-я сейчас за руль сажусь- соврал я чтобы перебить еë монолог. \n-а хорошо. А это позвонить, когда подъезжать будете? - быстро успокоилась племяшка \n-да-да- сказал я пока натягивал джинсы и ожидая пока она бросит трубку. Сам же я редко ложу трубку первым. А племяшка такая же. Поэтому ещё минуты две мы просто молча ждали, кто первый бросит трубку. И конечно же выиграл я. Не без помощи сестры конечно. Сестра увидев как племяшка моя просто стоит молча с телефоном. Просто забрала телефон и отключилась. Привыкла она к нашим противостоянием.\n[323660] 2025-05-04 11:41 Слава: Я наконец-то натянув штаны. Вбиваю в телефон запрос &quot;детский магазин&quot;. После кладу его в карман. И надевая уже футболку с кофтой. Иду на кухни. Ставлю там чайник. И доставая из холодильника хлеб, майонез и колбасу. Быстренько кушаю. И сажусь в машину. Доставая свой телефон. Смотрю на адрес и думаю, как  туда доехать. По тупив пару минут. Всё же строю карту в голове. И выключив телефон еду в магазин детских товаров. \nКатаясь по городу. Заметил что на улице очень мало людей. Ну это не удивительно. Утро субботы, кто вообще встанет. \nЕхал я так. Почти по пустой дороги и думал &quot;что-то не так&quot; Не знаю почему. Просто эта мысль въелось в голову и не исчезала. Мой разум, что-то понял. Заметил мелкую размытую причину этой мысли. Но осознать еë не мог. Поэтому осталось лишь далёкой мыслью.\nВижу дальше по дороге светофор горит желтым, а скоро станет красным. Хотя людей и не было. Я решил, что не зачем нарушать закон. И остановившись. Я отпустил руль. И полностью лёг на сидения. Закрыв глаза. Услышав знакомый звук светофора. Я глянул на него. И в небе увидел странную картину. Линий в воздухе, как от самолёта. Вот только их было сотни если не тысячи. Словно всё страны мира решили разом запустить всё имеющий боеголовки. А я лишь сейчас заметил эти линии. Как я раньше не заметил искренние удивлялся я смотря на небо. \nНе было сигнала или голоса, который говорил бы о запуске ракеты на нас. Не было паники, истерики. Была просто тишина. Пока не прогремел ударь. А после сотряслась земля. И начали гудеть все здания. Потом пошла волна. Заставив трещать окна и зеркала. Волна которая обронила здания. Всё начало рушится. \nЯ ещё был в сознаний, когда здания упала на мою машину. А после тьма и тишина. Словно умер я и лежу в могиле.\n[323661] 2025-05-04 11:42 Миколай: мне второй больше нравится, поэтому предлагаю продолжить первый\n```\n\n### Версия 2 — 2025-11-21\n\nвселенная: неясно (по дате объявления) · окно w0110 · сообщения 387581–387582\n\n*что здесь: Монолог у психолога, воспоминания, звонок соседа Вадима*\n\n\n\n```chat\n[387581] 2025-11-21 18:16 Слава: Место и ты \n \nСкажите у вас не возникала мысли ударить, мимо проходящего человека. Нет он ничего вам не сделал, вы в первые его видите. Но почему-то всё же проскальзывает едкая чувство, хорошенько его долбануть. \nХа. Я не поверю в эти невинные глаза, что отводят взгляд, и запинаясь пытаются убедить меня, что не за чтобы это не сделали. \nКАЖДЫЙ хоть раз в жизни об этом думал. И сразу же возникают плохие мысли, о том что же произойдёт в мире, если все вдруг рельно это сдел
