\n\n*что здесь: разбор выполненного: Вилгакс, сумасшедший (Слава ждал смирительную робу), прыжок*\n\n\n\n```chat\n[178749] 2024-06-11 09:07 Миколай: А ещё мне интересно как те скетчи?\n[178750] 2024-06-11 09:08 Слава: Пара\n[178751] 2024-06-11 09:08 Миколай: Понял\n[178757] 2024-06-11 09:40 Миколай: Твоя реакция?\n[178758] 2024-06-11 09:40 Миколай: В тгк\n[178759] 2024-06-11 09:41 Миколай: Ща\n[178760] 2024-06-11 09:46 Миколай: Совпадают эти критерии со мной, не прям идеально, но я лично определил себя так сейчас\n[178761] 2024-06-11 09:47 Миколай: Я не истеричка и не всё так глубоко как могло быть\n[178762] 2024-06-11 09:47 Миколай: Но всё-таки есть общие черты с описываемыми пунктами\n[178763] 2024-06-11 09:47 Миколай: Там не обязательно логика в том что человек истерику заводит\n[178764] 2024-06-11 09:48 Миколай: Вполне нормальным может казаться\n[178765] 2024-06-11 09:48 Слава: Вилгакс классный но только как будто из перезапуска \nСумасшедший норм но я ожидал ты его полностью на рисуешь в смирительной робе \nПрыжок норм но как то простенькой\n[178766] 2024-06-11 09:49 Миколай: А ты кто какого сумасшедшего?\n[178767] 2024-06-11 09:49 Миколай: Про двух ёбнутых?\n[178768] 2024-06-11 09:50 Миколай: Про конченого с любовью к жизни\n[178769] 2024-06-11 09:50 Миколай: Или про чела с гитарой?\n[178770] 2024-06-11 09:50 Слава: Который один\n[178771] 2024-06-11 09:50 Миколай: Если что он вполне нормальный\n[178772] 2024-06-11 09:51 Миколай: Эти сумасшедшие по задумке\n[178773] 2024-06-11 09:51 Слава: А снизу с самой большой головой\n[178774] 2024-06-11 09:52 Миколай: Это девушка которая увидела больного на голову человека\n[178775] 2024-06-11 09:52 Миколай: Она ужаснулась с него\n[178776] 2024-06-11 09:52 Миколай: Он же псих конченый\n[178777] 2024-06-11 09:52 Миколай: Жить любит\n[178778] 2024-06-11 09:52 Миколай: Ну такая идея была\n```</div>"}];</script>
