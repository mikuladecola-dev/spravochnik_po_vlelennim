лавить и кристализировать заново, после записывая информацию, проще чистое вещество взять. поэтому никто из людей не может менять свою структуру, это невероятно сложно. \n\nа в этой семье такая особенность, у них есть структура наследственная, с механизмом упрощающим этот процесс, которых для других невозможен изв сложности. они в течении 2 дней могут давить в определённую точку для изменения агрегатного состояния структуры способности. расплавив они лишаются структуры способности и по сути становятся как новорождённые. однако ещё одно отличие от других, даже если другие расплавят этот кристал они не создадут его заново не за что ибо для формирования нужна так называемая затравка. при рождении она появляется и благодаря ней появляется возможность кристаллизовать энергию через опыт. так вот у этой семьи наследственная структура имеет возможность создать искусственно затравку.\n\nя, не просто так сказал что они как новорождённые. для кристаллизации новой структуры им нужно то же время что и с момента рождения и она также будет неразвита. \n\nу разных членов семьи разное допущение с разными параметрами поиграть может будет\n[263728] 2024-11-30 21:32 Миколай: я тогда забыл то что не просто кто-то пишет способность а это результат опыта\n```\n\n### Версия 2 — 2024-11-30\n\nвселенная: монстры (по дате объявления) · окно w0065 · сообщения 263733–263735\n\n*что здесь: Дополнение: детский опыт мистический, но не всегда сильный; способности, созданные после обучения в осознанном возрасте, могут быть сложнее врождённых*\n\n\n\n```chat\n[263733] 2024-11-30 21:33 Миколай: они невъебено могучая\n[263734] 2024-11-30 21:38 Миколай: детский опыт довольно мистический, но не всегда сильный, в осознанном возрасте они могут пройти традиционное семейное обучение 2 года, а после развиваться так как пожелают, что позволит создать способности намного сложнее тех что появляются с рождения. \n\nи ваще не хочу я делать их имбалансными. это обычные люди со способностями, не обязательно семейник
