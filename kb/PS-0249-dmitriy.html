я: вне вселенной (разбор «неясно») · окно w0087 · сообщения 314969–314969\n\n*что здесь: В пометке: «правильно говорил Дмитрий в своей поэме, что мир должен быть серым».*\n\n\n\n```chat\n[314969] 2025-04-01 19:00 Миколай: {если существуют золотые облака, будет и золотой дождь}\n\n{в других странах по типу китая запрещено вмешиваться в судьбы людей, какая чушь. не останавливать преступление значит участвовать в преступлении. я должен изменить это общество которое сошло с ума, правильно говорил Дмитрий в своей поэме, что мир должен быть серым, а молодёжь с этим граффити уничтожает улицы. государство вместо пресечения поддерживает идею, как же отвратительно.}\n\n{лешение эмпатии показать как лишение действенности. я ебанутый}\n\n{в настоящим времени будет говорить о настоящем когда действия пойдут} \n\n{важно заметить что диалога в этом случае не будет с девочкой и женой ибо он не может их полноценно воспринимать как личность}\n\n{его жена студентка по обмену, об этом мало людей знает. после обзора он их не воспринимает и прзерает, перестал понимать. эм ей тогда в отношениях было 19. но возможно они были знакомы ранее и она им восхищалась, была его аудиторией благодарной, он в ней видел мудрую и осознанную девушку, коей она и являлась, а ещё она являлась крайне молодой}\n```\n\n## Неясности\n\n- (w0087) Не до конца ясно, Дмитрий ли — тот самый первый ГГ-автор из плана или отдельное лицо.</div>"}];</script>
