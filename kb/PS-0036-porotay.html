<script>const BASE="../";const DOCNAME="Поротай";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Поротай\n\n*персонаж* · вселенные: Новый мир, Оам, вне вселенной, игра бога\n\n## Навигация\n\n- (w0029) Придуманный Славой вид: съевший жуга человек получает один из трёх исходов — смерть, низший Поротай или высший Поротай. Низший — горбатый двуликий полукаменный, без личности, подчиняется высшему. Высший сохраняет облик и личность, но получает вторую жестокую личность как дебафф.\n- (w0036) Каменные существа: Слава напоминает про них (175807), Миколай не помнит, Слава пересылает старое описание в 175810. Повтор ранее придуманного (окно w0029).\n- (w0086) Вид, придуманный С для нового мира: человек съедает жуг и либо умирает, либо становится низшим, либо высшим Поротаем. Низший — горбатый двулицый, полукаменный-полуплотяной, без личности, подчиняется высшему; высший сохраняет человеческий облик и личность, но получает вторую жестокую личность.\n- (w0105) Раса, возникающая от съедения жука (позже — каменного жука): три исхода, из них два дают низшего и высшего Поротая. Придумана 2025-09-17 первым же блоком, дальше только упоминается в расстановке сил и в перечне рас.\n- (w0107) Мутировавший жук: съевшего его ждёт один из трёх исходов — смерть с окаменением внутренностей, превращение в низшего поротая (горбатый двуликий полукаменный, без личности, подчинён высшему) или в высшего (сохраняет облик и личность, регенерация, контроль над низшими, окаменение частей тела, сверхсила). Дебафф высшего — вторая жестокая личность.\n- (w0108) Мутировавший жук; делится на низших (горбатые двуликие полукаменные-полуплотяные, без личности, подчиняются высшему) и высших (сохраняют человеческий образ и личность).\n\n## Связано с\n\nАзуриэль, Апостолы, Высший Поротай, Жуг, Насекомые (источник сил), Низший Поротай, Новый мир, Оам, Организация, лов 😅\n[175809] 2024-06-03 23:00 Миколай: Напомнишь?\n[175810] 2024-06-03 23:08 Слава: Потом ответишь \nПридумал один вид Поротай \nКороче есть жуг ты его съедаеш и у тебя 3 варианта \n1) смерть , все твои внутренности превращаются в камень и отказывают\n2)  превращаются  в низший Поротай (горбатого двух лицого, полукаменного-полуплоти , и ты теряешь личностей и  слушаещя высшего Поротая  ) способности крепкость, реген, сверхсила \n3) превращается высшего Поротая сохраняешь свой человеческий образ и личность. Способности реген, контроль над низшими, превращать части тела в твердый камень , сверхчеловеческая сила\nДебафф у тебя появляется вторая личность жестокая, кровожадная , алочная и т.д.\nИ она составляет чаще всего становится жестоким кровожадным и т.д\n[175811] 2024-06-03 23:08 Слава: Я спать\n[175812] 2024-06-03 23:08 Миколай: Окей, добрых снов\n[175813] 2024-06-03 23:08 Миколай: Ааа, вспомнил\n```\n\n### Версия 4 — 2025-03-26\n\nвселенная: вне вселенной (по дате объявления) · окно w0086 · сообщения 311278–311281\n\n*что здесь: Первое и единственное развёрнутое описание вида: жуг, три исхода (смерть с окаменением внутренностей, низший, высший), способности каждого, дебафф второй личности*\n\n\n\n```chat\n[311278] 2025-03-26 08:20 Слава: Я уже сказку составляю о новом мире\n[311279] 2025-03-26 08:29 Слава: Потом ответишь \nПридумал один вид Поротай \nКороче есть жуг ты его съедаеш и у тебя 3 варианта \n1) смерть , все твои внутренности превращаются в камень и отказывают\n2)  превращаются  в низший Поротай (горбатого двух лицого, полукаменного-полуплоти , и ты теряешь личностей и  слушаещя высшего Поротая  ) способности крепкость, реген, сверхсила \n3) превращается высшего Поротая сохраняешь свой человеческий образ и личность. Способности реген, контроль над низшими, превращать части тела в твердый камень , сверхчеловеческая сила\nДебафф у тебя появляется вторая личность жестокая, кровожадная , алочная и т.д.\nИ она составляет чаще всего становится жестоким кровожа
