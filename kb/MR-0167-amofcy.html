<script>const BASE="../";const DOCNAME="Амофцы";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Амофцы\n\n*мир* · вселенные: Оам\n\n## Навигация\n\n- (w0108) Подбор общего названия для существ, способных пользоваться Оам. Перебираются варианты, в итоге договариваются пока остановиться на этом.\n\n## Связано с\n\nОам\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-11-05\n\nвселенная: Оам (объявлено) · окно w0108 · сообщения 382099–382110\n\n*что здесь: Слава ставит вопрос и предлагает «Оамовцы»; Миколай предлагает «туманности», Слава возражает, что с туманом они не связаны; договариваются пока звать оамовцами*\n\n\n\n```chat\n[382099] 2025-11-05 09:56 Слава: Палачи государственный убийцы. Личность которых засекречена. Они всегда ходят в масках на задание. У них всегда одна и таже цель ликвидации. Если они появятся не кто не выживает. Их вырастили именно для убийства. И они были обучены стилю боя как у Палача ( апостола, который сильнейший в ближнем бою), но опять же это лишь имитация стиля Палача. Также было проведена попытка обучения особого усиления Имитатора, но из-за большой смертности от неё отказались.\n[382100] 2025-11-05 09:59 Слава: Как вообще называть существ что могут пользоваться Оам?\n[382101] 2025-11-05 10:00 Слава: Оамовцы\n[382102] 2025-11-05 10:00 Слава: ?\n[382103] 2025-11-05 10:01 Миколай: мб туманности?\n[382104] 2025-11-05 10:01 Слава: Почему?\n[382105] 2025-11-05 10:01 Слава: Они же не как не связаны с туманнам\n[382106] 2025-11-05 10:02 Миколай: ну оам это че, я чет помню он как туман распространялся\n[382107] 2025-11-05 10:02 Миколай: не?\n[382108] 2025-11-05 10:03 Слава: Из-за и боль они ощущают больнее.\nНо зато у них словно всё на ладони они ощущать и видят всё что находиться вокруг. И способны словно предсказывать движение противников по слуху или зрению. \nИ становятся невероятно точными. \nКак  ясно они у них лучший контроль Оам. \n\nАскизы\nМаток Аскизы была просто Аксолотлой. Но после в водоём, где она жила упал метеорит и под огромным воздействием Оам она мутировала и начала производить Оам. \nНавечно Дети лет 7-10 на вид с белоснежной кожей,с розовыми оттенками ( или другими оттенками) и с чертами аксолотлы. Как они рождаются я ещё не придумал. \nИ вот эти дети не стареют. И у них быстрая регенерация, а также зверский аппетит. Они могут съесть человека целиком за пару минут. У них инстинкт голода выше разума. Они не чувствуют боли.  И разумом они всегда как дети. \nМатка, что выделяет их из яиц подобное муравьиной матки. \nМатка большая ростом 4 местра и в ширину такая же. Она больше похожая на червя с огромными количествами лапок. Но с такой же белоснежное кожей. \n\nДети мирового древа \nПроизошли от мутировшого дерева из-за Большого количества Оам. \nЭто гуманноидный деревянный существо с оранжевой сердцевинной, в котором как раз и хранится Оам. Они могут изменить образ на человеческий. \nТак как они из дерева мирового древа. Хрен ты их пробьешь, не кто из апостоловы не сможет нормально их ранить, а если ранят они будут регенерировать. Ну и они сверхсильный (сильнейший наверное в физическом плане) \nОни могут передвигаться в земле и внутри деревьях. \nОгонь им не вредит. Сам огонь на них тухнет. Ну они могут выпускать корни туда сюда ими драться.\n\nАзуриэль\nДавай я его опишу \nГуманоид человеческого роста синий кожей( не точно может розовый) с острыми ушами как у эльфа \nТакже на лице красивый узоры разного цвета, который могут меняться в зависимости от эмоций\nОдежда зимняя \nСам он гибкий\nЭмпатия\nПрекрасно ощущать намерения\nСлава дондоков:\nАзуриэль: Нейро-сканер\nЕго способность это не эзотерическая эмпатия, а гиперразвитое чувство, позволяющее напрямую считывать и интерпретировать биоэлектрическую активность нервной системы других существ.\nнаходясь в толпе он теряется и не может сконцетрироваться\nЭто было группа лиц, чей дети мутировали полностью превратившись Азуриэль. Они с рождения могут использовать Оам и скорость поглощения и выделения Оам у них выше чем у кого либо. \n\n Поротай \nЭто мутировавший жук если его съесть человек то у него  3 варианта \n1) смерть , все твои внутренности превращаются в камень и отказывают\n2)  превращаются  в низший Поротай (горбатого двух ликого, полукаменного-полуплоти , и ты теряешь личностей и  слушаешь высшего Поротая  ) способности крепкость, реген, сверхсила \n3) превращается высшего Поротая сохраняешь свой человеческий образ и личность. Способности реген, контроль над низшими, превращать части тела в твердый камень , сверхчеловеческая сила\nДебафф у тебя появляется вторая личность жестокая, кровожадная , алчная и т.д.\nИ она составляет чаще всего становится жестоким кровожадным и т.д\n\nВампиры \nЭто люди у которых мутировала кровь и пищевая система под воздействием Оам. Из-за этого если они испьют кровь. То способны почуствовать Оам и так по итогу научиться его контролировать. \nИ также выпивая кровь они могут пополнять запасы Оам. \nИх мутировшая кровь легко контролируемая подобно конечности.\n[382109] 2025-11-05 10:03 Слава: Это мелкий крупицы летающий в воздухе\n[382110] 2025-11-05 10:08 Миколай: ладно пока так будем звать\n```\n\n### Версия 2 — 2025-11-05\n\nвселенная: Оам (объявлено) · окно w0108 · сообщения 382117–382222\n\n*что здесь: Новые варианты Славы: Амов, Амифцы, Амифиц; Миколай выбирает «амофцы» (писать «амовцы», читать «амофцы»), Слава говорит, что звучит как спецназ; отвергнуты суспензы, нуары, тросы; решение — оставить пока прежнее*\n\n\n\n```chat\n[382117] 2025-11-05 10:56 Слава: Амов\n[382118] 2025-11-05 10:56 Слава: Амифцы\n[382119] 2025-11-05 10:56 Слава: Амифиц\n--- пауза 6.5 ч ---\n[382211] 2025-11-05 17:24 Миколай: амофцы\n[382212] 2025-11-05 17:24 Миколай: мне это больше нравится\n[382213] 2025-11-05 17:24 Миколай: а писать амовцы\n[382214] 2025-11-05 17:24 Миколай: а так читать\n[382215] 2025-11-05 17:24 Слава: Ну звучит как какой-то спецназ\n[382216] 2025-11-05 17:25 Миколай: хмм\n[382217] 2025-11-05 17:25 Миколай: ок\n[382218] 2025-11-05 17:30 Миколай: суспензы?\nнуары?\nтросы?\n[382219] 2025-11-05 17:30 Миколай: не?\n[382220] 2025-11-05 17:30 Слава: Не\n[382221] 2025-11-05 17:30 Миколай: если че и это норм врд\n[382222] 2025-11-05 17:30 Слава: Ну давай пока это\n```\n\n## Часть чего\n\nОам\n\n## Неясности\n\n- (w0108) Финальное написание так и не зафиксировано — «ну давай пока это»</div>"}];</script>
