тёмное и мощное. Я решил, что если мир не хочет меня счастливым, то я найду способ заполнить эту пустоту.\n\nНаша школа всегда казалась мне местом возможностей и радости. Но теперь она была моей ареной. Я начал с того, что внедрил в систему школы вирус, который дал мне полный контроль над электроникой и замками. Все входы и выходы были заблокированы, а камеры слежения теперь работали для меня. Я был готов к своему последнему акту в этой трагедии.\n\n&quot;Слушайте меня внимательно,&quot; — начал я, используя школьную радиосистему, чтобы обратиться к каждому уголку здания. &quot;Я контролирую школу. Сегодня каждый из вас станет частью моего исцеления.&quot;\n\nЯ видел, как учителя и ученики в панике бегали к дверям, пытаясь их открыть. Но было поздно. Моё сердце, погружённое в тень, уже не знало жалости.\n\nЯ начал с кафетерия, где установил экраны, транслирующие моё обращение. &quot;Вы все здесь, потому что мир несправедлив. Он разбил меня, и теперь я научу вас всем, что такое настоящая боль.&quot;\n\nКогда я шёл по пустому коридору, моя тень казалась живой, словно она подпитывалась моим гневом. В каждом классе я оставлял послание, написанное чёрными маркерами на досках. &quot;Любовь — это ложь,&quot; — гласили они.\n\nМоя цель была не просто запугать, но и заставить их почувствовать ту же самую пустоту, что и я. Я использовал школьные компьютеры, чтобы взломать соцсети и отправить от имени школы сообщения о том, что здесь теперь правлю я, и что этот день станет уроком для всех.\n\nКогда я дошёл до кабинета директора, мои руки дрожали, но не от страха — от возбуждения. Я взломал его компьютер и нашёл личные файлы каждого ученика и учителя. &quot;Теперь я знаю все ваши секреты,&quot; — прошептал я, разглядывая информацию. &quot;И я использую их, чтобы научить вас истине.&quot;\n\nМоя месть была проста: я хотел, чтобы каждый ощутил то же самое чувство предательства и одиночества, которое испытывал я каждый день. Я отправил всем ученикам и учителям их самые сокровенные
