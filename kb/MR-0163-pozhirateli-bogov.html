олай: думал об этом сегодня\n[370615] 2025-10-02 21:28 Миколай: и вчера\n[370616] 2025-10-02 21:28 Миколай: частенько думаю\n[370617] 2025-10-02 21:28 Миколай: хочу прям норм выделить время как-нибудь\n[370618] 2025-10-02 21:29 Миколай: эх\n[370619] 2025-10-02 21:29 Миколай: ты чаще конкретно работаешь над историей\n[370620] 2025-10-02 21:29 Миколай: я пока чет вообще не помогаю\n[370621] 2025-10-02 21:29 Миколай: да ладно, почти никогда не помогал\n[370622] 2025-10-02 21:29 Слава: Так я больше думаю о деталях нежели о самом мире\n[370623] 2025-10-02 21:29 Слава: И тема про пожирания богов мне зашла\n[370624] 2025-10-02 21:30 Миколай: а, я вспомнил\n[370625] 2025-10-02 21:30 Миколай: я забыл, что это моя идея\n[370626] 2025-10-02 21:30 Слава: Хочу сделать её первоисточником возникновения всë этой мистической штуки\n[370627] 2025-10-02 21:31 Слава: Ну пока не сильно думаю. Думаю больше о деталях\n[370628] 2025-10-02 21:31 Слава: Ну точнее только о апостолах\n[370629] 2025-10-02 21:31 Слава: Нравится мне они\n[370630] 2025-10-02 21:33 Миколай: эт круто\n```\n\n## Неясности\n\n- (w0106) как именно пожирание богов связано с апостолами и мировым древом, в окне не сказано</div>"}];</script>
