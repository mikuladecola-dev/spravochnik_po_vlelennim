const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Чёрный ящик\n\n*способность* · вселенные: Апостол, Нимб, монстры\n\n## Навигация\n\n- (w0064) Способность, выдающая владельцу случайные другие способности. Развивалась в разговоре 2024-11-17 от одной строчки до механики с кубиками, таймером и хранением структур.\n- (w0072) Название стоит в строке «Идей» рабочего каталога и повторяется во всех трёх редакциях; никакого раскрытия нет.\n- (w0073) Единственное, что осталось в разделе «Идей» реестра в обеих редакциях окна. Только название.\n- (w0088) Артефакт-устройство, записывающее знания, параметры и характеристики вселенной (Бытия); придуман Славой 18 апреля и разобран в диалоге с Миколаем, id 320032-320135. Миколай задаёт вопросы про владельца, местонахождение и происхождение, Слава отвечает и достраивает механику.\n- (w0094) Последняя строка реестра, помещённая автором в отдельный раздел «Идей:». Названо и не развёрнуто.\n- (w0121) Вещь, для которой понадобился надёжный владелец — им стал Бэм. М просит напомнить, что это, но С отказывается описывать («лень, спать хочу»).\n- (w0122) Предмет, за который идёт гонка между организациями; в окне он оказывается в руках старика, Зана отбирает его ударом в спину и телепортирует в случайное место. Что именно ящик даёт, в этом окне не объясняется.\n\n## Связано с\n\nБэм, Владелец чёрного ящика, Зана, Запрос к чёрному ящику, Каталог: благословенные, враги, грехи, оружие, артефакты, Кристал, Пламенный, Разные кубики под разные способности, Система ранжирования способностей, Слабость молния + вода, Список персонажей вселенной (Благословенные / Враг / Церковь / Военный / Сторонние силы / Семь грехов / Существа / Аномалии / Оружие / Артефакты / Идеи), Старик, Чёрный шар, Энергия, сосуд и структура\n\n## История по версиям\n\n_Ниже — дословные
