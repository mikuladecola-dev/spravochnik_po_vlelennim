вия будт каждый раз меняться и я уже походу буду придумывать условия. Для нового уровня\n[457508] 2026-04-11 09:25 Слава: Но система прокачки?\n[457509] 2026-04-11 09:25 Слава: Ах ты гнида\n```\n\n### Версия 2 — 2026-04-11\n\nвселенная: Иссекай (по дате объявления) · окно w0119 · сообщения 457546–457576\n\n*что здесь: Устройство мира уточнено в ответах на вопросы Миколая: внешнего мира нет, города внутри данжа нет, данж один общий, но комнаты у каждого свои, «первого уровня» не существует — подземелья подбираются под текущее состояние идущего.*\n\n\n\n```chat\n[457546] 2026-04-11 09:37 Миколай: почему деньги?\n[457547] 2026-04-11 09:37 Миколай: ну данж это подземка\n[457548] 2026-04-11 09:37 Миколай: там есть внешний мир?\n[457549] 2026-04-11 09:38 Миколай: обычные люди идут от туда\n[457550] 2026-04-11 09:38 Миколай: а гг?\n[457551] 2026-04-11 09:38 Слава: Вообще типо за прохождения уровня получаешь допустим ОЭм и можешь купить навыки \nПассивный который всегда усиливают \nИ активный типо огненный шар.\n[457552] 2026-04-11 09:38 Миколай: он может в обычный мир попасть\n[457553] 2026-04-11 09:38 Миколай: или город есть внутри данжа\n[457554] 2026-04-11 09:38 Слава: Купить у таинственного торговца\n[457555] 2026-04-11 09:38 Слава: Нет\n[457556] 2026-04-11 09:38 Слава: Нет\n[457557] 2026-04-11 09:38 Миколай: но обычный мир существует?\n[457558] 2026-04-11 09:38 Слава: Нет\n[457559] 2026-04-11 09:39 Слава: Просто бесконечный данж\n[457560] 2026-04-11 09:39 Слава: И всё\n[457561] 2026-04-11 09:39 Миколай: а другие люди умирающие откуда появляются?\n[457562] 2026-04-11 09:39 Миколай: спавн?\n[457563] 2026-04-11 09:39 Миколай: ок\n[457564] 2026-04-11 09:39 Слава: Они не помнят\n[457565] 2026-04-11 09:39 Миколай: хорошо\n[457566] 2026-04-11 09:40 Слава: Смысли, ну начальная комната в которой выдаются базовое оружие \nУ каждого начальная комната своя\n[457567] 2026-04-11 09:40 Слава: Другие люди навсегда умирают если что\n[457568] 2026-04-11 09:40 Миколай: они начинают с пе
