солнцу на гору, а как забрались, поняли что в них &quot;врезалось&quot; облако. они первый раз наблюдали за ним в близи, это было интересно. а, как оно прошло их семена(ну овощей всяких) проросли. некоторых хватило недуг. спускать больных не удобно, оставлять жалко и противоречит обычаям. вот и поселились там исследуя облака.\nсейчас там уже своя продуманная система: они могут создавать облака, ловить и хранить их. \nони прорубли давно канал для реки в деревню (во первых потому что деревень без воды вблизи не бывает, а она была далеко) и также установили управляемые дамбы. периодично они их открывают. вода течёт на расколенные низменности и испаряется. причем настолько горячая поверхность, что до 5 метров действительный пар, после он превращается частично в туман, но продолжает подниматься, а на высоте 2,5 км сталкивается с ветром, который выходит из-за гор полученный течением. ветер формирует из тумана облака, из-за четких пропорций, они не вырастают больше 10 метров и врезаются ближе к вершине, где на специальных мостиках - бышах нефители ловят облака, в специальную ткань из специального материала и с особенной фактурой, используя родовую энергию могут перемещать облака не испортив их. обычные жители просто поливают огород этими облаками в основном, но ученые от рабочих получают облака, которые те через жерло вулкана кидают на середину горы. а после типа в лабораториях делают различные исследования с облаками. увеличивают плотность, уменьшают, заражатют вирусами и тд. \nесли зараженное облако съест или вдохнет человек естественно он заболеет и причем сильно, а избавится от болезни только выдохнув облако.\nу них множеств всяких экспериментов с облаками но это я не продумал уже\n[269370] 2024-12-11 19:08 Миколай: да, не самая сильная и конкретно о расе почти не написал, но вот крч что есть\n[269371] 2024-12-11 19:09 Миколай: если ты о гг чет придумал или придумаешь то пиши\n```\n\n## Часть чего\n\nДеревня-гигант</div>"}];</script>
