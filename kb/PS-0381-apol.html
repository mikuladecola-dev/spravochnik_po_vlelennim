<script>const BASE="../";const DOCNAME="Апол";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Апол\n\n*персонаж* · вселенные: неясно\n\n## Навигация\n\n- (w0122) Белоглазое чудище, «Бог прошлого», прилетающее на трёхголовом драконе; в сказке пожирает короля вместе с троном. Не спаситель и не каратель — голод, который не утолить. По словам автора, избил сильнейшего в современности вообще без способности.\n\n## Связано с\n\nБио реконструкция, Способность Апола, Трёхголовый дракон Апола, оам\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2026-07-14\n\nвселенная: неясно (по дате объявления) · окно w0122 · сообщения 502717–502719\n\n*что здесь: Появление через сказку: белоглазое чудище на трёхголовом драконе, сшитом из разной плоти; пожирает возомнившего себя богом короля; Апола нельзя будить.*\n\n\n\n```chat\n[502717] 2026-07-14 11:47 Слава: Короче я изначально написал сказку про апола, и сейчас попросил её отредактировать нейросеть.\n[502718] 2026-07-14 11:47 Слава: Вот отредактированная легенда о короле, который боялся свержения. Она обрела плоть и стала тем, чем должна быть — страшной сказкой, которую шепотом рассказывают в твоем мире.\n\n---\n\nСказка о Короле, Который Боялся Свержения\n\nЖил некогда муж, что был правой рукой короля. День за днем он видел бесчеловечность его правления. Видел горы трупов, что вырастали на площадях. Видел реки нищеты, что текли по улицам. И видел сотни тысяч глаз, что гасли просто так, по одной лишь прихоти безумца на троне. И однажды в его голове пронеслась мысль: «Я был бы лучшим королем».\n\nЭта мысль пустила корни, налилась злобой и уверенностью, и вскоре вокруг мужа собрались те, чьи сердца были недовольны. Он возглавил их, вломился в тронный зал, где восседал безумный король, и двинулся к нему медленным шагом. Он знал, что никто не придет спасать тирана.\n\nКороль же, чье сердце было пустым, смотрел на него безразлично. Он не верил, что какой-то смертный, пыль под его ногами, осмелится поднять меч против помазанника божьего. Но брызнувшая кровь стала доказательством его неправоты.\n\nМертвое тело скатилось с трона, и муж занял его место, провозгласив себя новым королем.\n\nШло время, и однажды в ночи новому королю приснился сон. Ему привиделось, как преданные товарищи обнажают клинки против него, как они занимают его место. Проснувшись, он пришел в ярость. Страх поселился в его груди, и он приказал убить всех, кто хоть потенциально мог занять его трон. Он сжег церкви, оставив лишь себя высшей властью. Он приказал убить всех своих приближенных, ибо они были точь-в-точь как он прежде. И в конце, ослепленный ужасом, он приказал убить собственного сына, увидев в нем соперника.\n\nЗа глупой жестокостью король пытался скрыть парадоксальный страх, что сжирал его изнутри. И больше не осталось никого, кому он мог бы поведать о своей боли — лишь трупы.\n\nЛюд был недоволен королем, что возомнил себя Богом. Недовольство росло, а тех, кто был предан королю, становилось всё меньше. И однажды толпа ворвалась во дворец, чтобы свергнуть его. Король отправил против них войска. Началась бессмысленная бойня, где каждый пытался что-то доказать.\n\nИ когда дым рассеялся, на удивление даже богам, единственным выжившим во дворце оказался сам король. Он безразлично восседал на троне, смотря вдаль пустыми глазами.\n\nНа этом история и закончилась бы.\n\nНо в разбитые врата дворца ворвался трехголовый дракон, сшитый из разной плоти. И страшен был не он, а то, что восседало на нем.\n\nБелоглазое чудище. Апол.\n\nОно сошло с дракона, и король, который возомнил себя Богом, наконец увидел истину. Апол не стал судить его. Он просто сожрал короля вместе с троном. А после улетел на своем верном сыне, оставив после себя лишь пустой дворец и кровь.\n\nТак гласит легенда. И те, кто слышит ее, понимают: Апола нельзя будить. Ибо он — не спаситель и не каратель. Он — голод, который не утолить.\n[502719] 2026-07-14 11:48 Слава: И теперь думай какую дать ему способность\n```\n\n### Версия 2 — 2026-07-14\n\nвселенная: неясно (по дате объявления) · окно w0122 · сообщения 502785–502799\n\n*что здесь: Уточнение масштаба: он не просто сильный, а Бог прошлого — победил сильнейшего в современности без применения способности; поверх звериной способности у него есть отдельная способность на контроль оам, которую автор обещал описать позже.*\n\n\n\n```chat\n[502785] 2026-07-14 15:03 Слава: Нихуя себе да он сильнейшего в современности отпиздил без способности.\n[502786] 2026-07-14 15:03 Миколай: Так это легко развести — сделай Апола принципиальной противоположностью этих троих:\n\nОни творцы, Апол — завоеватель. Био-реконструкция делает жизнь из мёртвого/неживого — армия из ничего. Апол же *ничего не создаёт с нуля*. Он работает только с тем, что уже живёт. Его сила — не творение, а власть над живым. Убери из его набора «создание» как отдельную способность — сшивание химер оставь, но подай это не как создание жизни, а как *переплавку уже покорённых* (он не даёт жизнь, он распоряжается чужой).\n\nТогда контраст становится фишкой мира:\n- Те трое штампуют армию быстро и из мусора — но их твари безликие, новорождённые, без опыта.\n- Апол собирает армию медленно, каждый зверь — завоёванный лично. Зато его звери — ветераны с историей, прокачанные, уникальные. Качество против количества.\n\nИ можно добавить жёсткое правило, которое их разводит окончательно: Апол не властен над созданной жизнью. Тварей био-реконструкции он приручить не может — они «фальшивые», в них нет дикой души. А те трое не могут воспроизвести его зверей — потому что нельзя реконструировать тысячелетний опыт и верность.\n\nПолучается даже готовый конфликт: армия творцов против армии пастыря, и ни один не может украсть силу другого. При встрече это война двух философий — «жизнь можно сделать» против «жизнь можно только взять».\n\nТак похожесть превращается в зеркальность, а это уже не плагиат, а дизайн. Норм направление, или у друга те трое — союзники Апола и конфликт не нужен?\n[502787] 2026-07-14 15:04 Слава: Так я не просто так называю его Богом прошлого\n[502788] 2026-07-14 15:05 Миколай: Ааа, окей, тогда я недооценил масштаб — беру слова назад. Если он голыми руками избил сильнейшего современности, то баланс через «слабого пастыря» вообще не подходит.\n\nТогда логика переворачивается, и это даже круче: звери Аполу не нужны для силы — они нужны, потому что он завоеватель по природе. Его армия — не костыль, а коллекция трофеев Бога прошлого. Каждый зверь — памятник победе. Дракон — не транспорт и не щит, а знамя.\n\nИ тогда баланс надо искать не в слабости, а в другом месте:\n\nЦена эпохи. Он Бог *прошлого*. Его легендарные звери — существа вымерших эпох, и новых таких уже не появится. Каждая потраченная на химеру душа, каждая безвозвратная ставка — это невосполнимо. Он сильнейший, но его сила конечна как музей: разграбить можно, пополнить — нечем. Современный мир мельче, и приручать в нём почти нечего достойного.\n\nОграничение по оам. Раз призыв и воскрешение зверей жрут оам — вот честный лимит. Сам он может быть непобедим в кулачном бою, но развернуть всю армию Бога прошлого разом — расход, который даже он не тянет долго.\n\nТо есть формула: лично — почти непобедим, армия — абсолютна, но невосполнима и дорога в развёртке. Он не боится проиграть бой, он «боится» тратить вечное на смертных — отсюда и его безразличие, и то, почему он не стирает всё подряд.\n\nКстати, это красиво стыкуется с «отпиздил без способности»: ему *западло* тратить трофеи тысячелетий на современников. Звери выходят только против того, кого он признал достойным. Такой выход армии — сам по себе высшая честь и приговор одновременно.\n[502789] 2026-07-14 15:05 Слава: Можно реализовать концепцию души, типа за ним вечно следует верный души его там питомца и питомца и он просто способен будет создавать им тела.\n[502790] 2026-07-14 15:05 Слава: ?\n[502791] 2026-07-14 15:05 Слава: Норм?\n[502792] 2026-07-14 15:05 Миколай: да, более чем\n[502793] 2026-07-14 15:06 Миколай: если считаешь что достаточно то норм\n[502794] 2026-07-14 15:06 Слава: Так у него поверх ещё способность связаны именно с контролем оам, о которых я тебе позже расскажу\n[502796] 2026-07-14 15:07 Миколай: а, ну я так и думал\n[502797] 2026-07-14 15:07 Миколай: ну точнее\n[502799] 2026-07-14 15:07 Миколай: ты примерно это и сказал\n```\n\n## Неясности\n\n- (w0122) Вселенная не названа; обещанная способность на контроль оам в архиве не появляется (окно — конец архива).</div>"}];</script>
