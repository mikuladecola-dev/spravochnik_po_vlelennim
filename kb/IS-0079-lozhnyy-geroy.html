const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Ложный герой\n\n*история* · вселенные: вне вселенной\n\n## Навигация\n\n- (w0110) Рассказ С: звёздная ночь в деревне, из окна дома на окраине вылетает человек с закрытым лицом, за ним лезет рогатое существо. Драка, у человека ломается череп, существо утаскивает его в лес, оставив в доме мать с ребёнком и убитого отца семейства.\n\n## Связано с\n\nДима, Нумерация присланных историй (Первый, Второе, Третье, Четвёртое, Пятая), Рогатое существо\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-11-21\n\nвселенная: вне вселенной (разбор «неясно») · окно w0110 · сообщения 387585–387586\n\n*что здесь: Текст целиком одним сообщением, помечен маркером «Третье»; в финальной строке героем оказывается Дима*\n\n\n\n```chat\n[387585] 2025-11-21 18:17 Слава: Ложный герой\n\n\nБыла прекрасная ночь. На небе без облачка и можно было увидеть луну, во всей её красе. В деревне, без многоэтажных зданий, что закрывали неба, без дыма выпускаемым бетонным организмам. Небо полный звёзд, что светили куда приятнее солнца, и тишина. В деревне всё люди уже ложились спать, им не был удивительным такой пейзаж, как звёздная неба. Но как видимо не всё готовились ко сну. В одном доме на окраине было слышно шум вызываемая разрушением, и огни в этой доме всё ещё горели в окнах.... \nОкно разбилось под натиском человеческого тела кинутый в окно. Человек подозрительно одетый в тусклую одету, и закрытым лицом. Уже успел приземлиться у деревянных ворот. Мужчина долго не думав вскочил и пристально посмотрел, в разбитое окно. Из окна вылазил что-то не подходящий к небесному пейзажу, и неподходящий к миру реалиста. \nЭто было на удивление жилистым, упругим, рост его был метра 2 если не выше. С виду оно было похоже на человека, но сероватой кожей и с отсутствующимся гениталиями, ну и с рогами, не в том положении, в которым мы привыкли преставоять их нахождения, а в достаточном странном месте. Один из них был вместо уха, другой же спустился чуть ниже уха. \nИ этой громадина было сложно прочесть в разбитое окошечка, через который мужчина пролетел на ура. \nМужчина нагнулся и раставил ноги готовый в любую секунду отскочить. Существо же, кое-как смогла выйти через окно, и не теряя времени рывком сократила дистанцию с мужчиной. Оно размашистой замахнулась, и словно плетью ударил по деревяному забору, забор не выдержав натиска неведонного существа сломался на шепки. Человек же который удачно увернулся от удара чудовища, пнул в подколенную ямку. Оно не смогло удержать равновесия присела на колено, и получила точный удар в челюсть. Но даже не строгнула, атаковала в ответ. Из того положения, в котором атаковало существо, атака было читаемой и мужчина отойдя вбок избежал удара. Мужчина решил опрокинуть существо пинком вбок, но оно лишь слегка пошатнулась, схватила его за ногу кинула его так легко, словно мужчина ничего не весил. Человек больно ударился спиной об стену дома, ему показалось, что-то хрустнула. Он надеялся хоть бы не спина, не хватала ему ещё этого. Благо ноги руки он чувствовал, хотя спина всё же жутко болела. Мужчина попытался встать, но был остановлен звонким ударом об его голову. Удар был достаточным, чтобы череп мужчины сломался, как греческий орех. На удивление мужчина не умер, и даже не потерял сознание. Хотя двигаться он всё же мог, лишь кряхтеть и думать &quot;что же дальше? &quot;\nА дальше существо схватила мужчину за ногу и печально посмотрев в целой окно, в котором мать сильно обнимали своё плачущие дитя, а рядом с ними лежал окрававленое тело главы семейства. Существо развернулась и направилась в густой тёмный лес, которой даже Луны свет не мог разверить, а за собой оно тащила мужчину. \n\n\n&quot;Погеройствовал блять Дима&quot; Именно так
