<script>const BASE="../";const DOCNAME="Сордекваксус";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Сордекваксус\n\n*персонаж* · вселенные: игра бога\n\n## Навигация\n\n- (w0030) Летающий пришелец, собранный М «солянкой» по запросу С («забей пришельца с крыльями, нужен летающий»): птеродактиль сордес + древесная лягушка + щупальца-гектокотиль осьминога. Позже входит в тройку одобренных как «лягуха с крыльями».\n\n## Связано с\n\nмноголикий\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-04-06\n\nвселенная: игра бога (по дате объявления) · окно w0030 · сообщения 154409–154413\n\n*что здесь: Карточка: прямоходящий гуманоид с крыльями птеродактиля, удлинённая голова с клювом с зубами и лягушачьими глазами, перепонки между пальцами, перепончатые лапы, щупальца на предплечьях, кожа под кору дерева со сменой цвета; полёт, лазание, маскировка, манипуляция щупальцами, ядовитые парализующие плевки, острые чувства; живёт в лесах на деревьях, агрессивен на своей территории.*\n\n\n\n```chat\n[154409] 2024-04-06 16:31 Слава: Можешь там забить пришелец с крыльями \nА то нужен ещё летающий\n[154410] 2024-04-06 16:32 Миколай: А, тогда я щас там солянку устрою\n[154412] 2024-04-06 16:45 Миколай: Встречайте пришельца по имени Сордекваксус! \n\nВнешний вид:\n- Прямоходящий гуманоид с крыльями птеродактиля сордес за спиной\n- Удлиненная голова с чертами птеродактиля (клюв с зубами) и лягушки (большие глаза, растягивающийся рот)  \n- Две руки с длинными цепкими пальцами и перепонками между ними\n- Мускулистые ноги с перепончатыми лапами древесной лягушки\n- На предплечьях имеются щупальца, напоминающие гектокотиль осьминогов\n- Кожа покрыта узором, имитирующим кору деревьев, и может менять цвет для маскировки\n\nСпособности:\n- Полет на большие расстояния с помощью крыльев\n- Лазание по деревьям и скалам с помощью цепких конечностей\n- Маскировка под окружающую среду за счет изменения окраски кожи  \n- Хватание и манипулирование предметами гибкими щупальцами на руках\n- Плевки ядовитой слюной, парализующей жертву\n- Острое зрение, слух и обоняние для охоты и ориентирования\n\nСордекваксусы обитают в лесах на деревьях, охотясь на мелких животных. Также способны планировать над открытыми пространствами в поисках добычи. Встреча с сордекваксусом может быть опасна для человека из-за его ядовитых плевков и агрессивного нрава при вторжении на его территорию.\n```\n\n### Версия 2 — 2024-04-06\n\nвселенная: игра бога (по дате объявления) · окно w0030 · сообщения 154413–154415\n\n*что здесь: Уточнение по арту: щупальца спрятаны в плечах и вылезают оттуда.*\n\n\n\n```chat\n[154414] 2024-04-06 16:51 Миколай: По логике этого арта, щупальца у этого пришельца спрятаны в плечах из плеч они могут вылазить\n```\n\n### Версия 3 — 2024-04-07 · повтор прежней мысли\n\nвселенная: игра бога (по дате объявления) · окно w0030 · сообщения 154664–154667\n\n*что здесь: Зачтён третьим одобренным пришельцем набора.*\n\n\n\n```chat\n[154664] 2024-04-07 11:26 Слава: Три это быстрый с узорами молний, бык или козел; а третий кто\n[154665] 2024-04-07 11:27 Миколай: Ну я подумал что лягуху с крыльями ты тож одобрил\n[154666] 2024-04-07 11:27 Миколай: А мне лично все понравились\n[154667] 2024-04-07 11:27 Слава: Ну мне тоже ну там чисто как отдельный виды расы а не часть челика\n```</div>"}];</script>
