const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Грань\n\n*способность* · вселенные: 7 островов\n\n## Навигация\n\n- (w0044) Механика перехода: когда сосуд достаточно силён, носитель на некоторое время черпает куда больше силы, видоизменяя и способность, и себя. Доступна только людям с сильным сосудом, после использования способность отваливается примерно на неделю.\n\n## Связано с\n\nИмитатор, Кай, Нуар, Система сил (сосуд)\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-07-05\n\nвселенная: 7 островов (по дате объявления) · окно w0044 · сообщения 197932–197940\n\n*что здесь: Введение понятия: грань — временное черпание большей силы с видоизменением способности и носителя, доступна только сильным сосудам. У Нуара сосуд развит с рождения, а вторая личность и есть его грань.*\n\n\n\n```chat\n[197932] 2024-07-05 00:29 Слава: Аааааааа\n[197933] 2024-07-05 00:29 Слава: Жди\n[197934] 2024-07-05 00:29 Слава: Я не рассказывал\n[197935] 2024-07-05 00:29 Миколай: у него две личности\n[197936] 2024-07-05 00:29 Миколай: так\n[197937] 2024-07-05 00:29 Миколай: слушаю\n[197938] 2024-07-05 00:31 Слава: Что есть грань \nКогда сосуд становится достаточно сильным он может на некоторой время черпать куда большей силы видо изменяй и способность и носителя \nТак могут лишь люди сильным сосудом \nА у Нуара изначально был развить сосуд и 2 личность грань, это видео измененный он\n[197939] 2024-07-05 00:32 Слава: Неплохо\n[197940] 2024-07-05 00:32 Слава: Кстати грань может пользоваться и кай и Имитатор\n```\n\n### Версия 2 — 2024-07-05\n\nвселенная: 7 островов (по дате объявления) · окно w0044 · сообщения 197940–197949\n\n*что здесь: Кто ещё может: Кай и Имитатор. Кай сейчас гранью пользоваться не умеет, по сюжету научится.*\n\n\n\n```chat\n[197940] 2024-07-05 00:32 Слава: Кстати грань может пользоваться и кай и Имитатор\n[197941] 2024-07-05 00:33 Слава: Имитатор видо изменяет способности \nВместо имитация, создания множество других способностей, то бишь он может сам придумывать способности \nА внешка как серафим\n[197942] 2024-07-05 00:33 Слава: Ну не полноценный серафим\n[197943] 2024-07-05 00:34 Слава: Кай \nВнешка как рогатый демон\n[197944] 2024-07-05 00:34 Миколай: чтоо\n[197945] 2024-07-05 00:34 Миколай: и его считают богом\n[197946] 2024-07-05 00:34 Миколай: круто\n[197948] 2024-07-05 00:35 Слава: Он по сюжету научиться делать грань\n[197949] 2024-07-05 00:35 Слава: А так который сейчас не может использовать грань\n```\n\n### Версия 3 — 2024-07-05\n\nвселенная: 7 островов (по дате объявления) · окно w0044 · сообщения 197956–197965\n\n*что здесь: Цена: после грани неделю нельзя пользоваться способностью. Правило обходит только Нуар — он с рождения с сильным сосудом, и если он на неделю останется без сил, острову конец.*\n\n\n\n```chat\n[197956] 2024-07-05 00:36 Миколай: ты о нем сейчас?\n[197957] 2024-07-05 00:37 Слава: Кстати после использования грани ты не можешь пользоваться способностью некоторая время неделю наверное\n[197958] 2024-07-05 00:37 Слава: Нет\n[197959] 2024-07-05 00:37 Слава: Я про имитатора говорил\n[197960] 2024-07-05 00:37 Миколай: а\n[197961] 2024-07-05 00:38 Слава: Это правила обходить только Нуар\n[197962] 2024-07-05 00:38 Миколай: почему\n[197963] 2024-07-05 00:38 Слава: Так он с рождения со сильном сосудом \nИ если он на неделю потерять способности \nМинус остров\n[197964] 2024-07-05 00:39 Миколай: ага\n[197965] 2024-07-05 00:39 Миколай: ну тогда понятно\n```</div>"}];</script>
