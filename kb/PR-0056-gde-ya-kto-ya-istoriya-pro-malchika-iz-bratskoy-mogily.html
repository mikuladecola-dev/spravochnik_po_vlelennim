<script>const BASE="../";const DOCNAME="«Где я? Кто я?» — история про мальчика из братской могилы";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># «Где я? Кто я?» — история про мальчика из братской могилы\n\n*2025-03-03 · Апостол · Служебно: выложена Славой целиком за один заход шестью длинными сообщениями. Реакция и разбор Миколая — 297467–297471, 297529–297536, 297549–297556, 298557–298565, продолжение разбора уходит в следующее окно*\n\n---\n\n\n\n```chat\n[297458] 2025-03-03 18:47 Слава: Где я? Кто я? Я лежал и на мне лежали людий, нет трупы, но почему трупы? Что значит быть трупом? Это значит истекать кровью? Так они не истекают кровью.Не знаю. Я вылез из этой ямый смерть? Не знаю, что значит смерть. Но я прекрасно чувствовал запах, пахли этими трупами, где то далеко, там среди лесов и дорог.  И что мне делать? Я же даже не знаю как меня зовут. Решения была принята, когда я почуял свой запах. Я побежал или нет, вроде бег, а вроде что-то другое, я так никогда не бегал или бегал, откуда я знаю, я ведь ничего не помню. Теперь я понял, я просто бежал быстрей, чем когда либо, понял я это как то мышенально.я неся как птица прорывающий воздух своим клювом. Я обогнал их и выскочел у них на пути, это было легко. И желазная-стеклянная махина врезалась меня. Мне было больно, и я вспомнил боль, просто взял и вспомнил боль в голове, словно в неë кинули камень только куда быстрей, чем это делают дети или взрослый. Я встал шатаясь, но быстро стало, как то легко и больше не было не больи, не воспоминание. Когда я встал, те люди что-то кричали, на каком-то странном языке. Но почему я ничего не понимал? А ведь если подумать то когда я проснулся, я ни разу ничего не сказал, может поэтому я их не понимаю. Только хотел им сказать &quot;привет&quot;, как услышал хлопок и боль, где то в животе и дым у них в руках. Я чуть не заплакал, как так можно. Почему? Я ведь родился в больи, и помнил только боль, и сейчас, когда я вас простил, за то что вы в меня врезались. Такпочему, вы не были мне благодарны, вместо этого причинили мне снова боль. И больше вас прощать я не намерен. Я побежал на них, и вдруг хлопков стало больше и боль стало куда большее. Если бы только у меня были бы руки подлинее, подумал я, но руки правда стали длинее и шире и выше и массивней. Я дотянулся до одного, схватил его, но почему то у него изо рта и не только кровь пошла. Я же вроде как легонько взял так чего он сразу умирать. Слегка поверьтев рукой, я случайно ещё 4 придавил о железной-стеклянный  махину, они лопнули как шарики наполненой водой. А железка поехала на меня, я удивился ведь как такая тяжёлая вещь, могла сдвинуться. Хотя она же в меня в начале врезалась. Пока я думал об этом она наехала на меня.... Из под машины хлынули потоки крови, обвивь машину словно в тески, она начала прижимать машину со всех сторон. Машина начила жиматься, стекло трескалас, обшивка изгибалась и гнулось словно машина была сделана не из железа, а из картона. Видивший это всё водитель и пассажир, ничего не могли сделать. Ведь дверь обвита этой Красной жижой и проход в окне уже настолько сузилась, что пролезть в него преставлялась невозможным. &quot; Черт, черт, черт, что делать?!! &quot; Сказал по-немецки водитель ему было страшно. Он конечно не был клаустрофобом, но сейчас когда машина сжимается со всех сторон и ты в ней. То здесь у любого клаустрофобия начнеться. Пока водитель думал как выбраться. Пассажир просто плакал, он уже сдался ведь выбраться от сюда они всё равно не смогут. Когда последняя опора в машине изогнулась. Пассажирский места схлопнулись и прогремел хлапок. Двое оставшихся в живых солдат с изумлением смотрели как немецкая  машина, гнётся под натиском чудовища, нечисть. Они стояли и смотрели с открытыми ртами, не в состояний смотреть но что либо ещё. Их ней верий в вышести их расы пошатнулась, нет она исчезла полностью. \nПосле того как я придавил эту ненавистную груду железа и тех кто там находился.  Я вылез из машины и увидел двоих стоящих людей, странно, говорю так словно здесь может стоять ещё кто-то помимо людей.Они стояли так, пока не заметили меня и нет они не начали хлопать, они по бежали. Подумав об этом я задумался, а почему я не убежал, когда они начали хлопать. Хотя я им и дал фору, они была медленными, как..... Кто? Не знаю. Я быстро их догнал. И легонько ударил по ноге одному, а та как то странно выгнулась. И тот упал и закричал, крик был мерзким и бесячим. &quot;Зачем орешь?&quot;Прикрикнул я. А он всё ещё орал, странно. Второго я решил остановить рукой. Просто поставил перед ним рукой. А тот всё равно закручился в воздухе и начал хрипеть. Ну хотя бы не орёт.\n[297459] 2025-03-03 18:47 Слава: Подошёл я к тому, который упал, ведь именно от него пахла мной. В его глазах я видел свой отражение, ребенка испачканый в крови и ярко горящими белыми глазами, словно у слепого, улыбающего, но это не та доброжилательная, ну мне это было не важно, главное запах, который исходит от него. Точнее, мной пахло, железная штука, который висит у него на бедре. Я приблизился к нему, и думал как бы мне задать вопрос. Они же меня не понимают. Слегка подумав, я указал пальцам на себя, а потом на него. Ожидая что он скажет имя моей. &quot;УлЬрихИ&quot; Произнес он. Я состроил лицо удивление и неверие, и почему то с капелькой отвращения. Ну нет это явно не мой имя, а значит он произнёс своё. Ну зачем мне его имя? Я повторил этот жесть только теперь указав на него произнёс его имя, а потом указал на себя. Он с удивлением смотрел, явно не понимая, что от него хочет это чудищя. Но потом в его глазах появилась осмысленность. Но он так ничего и не сказал, лишь опустив лицо, словно стыдясь. Я не понимал, так он знает моё имя или нет. Ну наверное должен знать ведь от него пахло мной, а значит он должен, что-то знать. Но молчал, стараясь не смотреть на меня и я понял.Он не помнил моей имя. Но он точно знал его. И я разозлился, почему он не помнит, я вот запомнил его имя, а он нет. Я ударил, и снова ударил, я бил его и разрывал такую ненадежную оболочку души его, ведь как так можно, просто взять и забыть имя токо кого убиль, убиль?  Кто? Про что я? Что со мной такое?  Не знаю, голова болит. Я ушёл отуда. А на дороге до сих пор воляется солдат со сломанной ногой, плачевший и читавший, что-то, возможно молитву, а возможно просто вымыливал спасения. \nЯ думал, точнее пытался вспомнить, открыть шкатулку в которой мои воспоминания. Но не выходят, словно это шкатулка пуста, как будто, кто-то вынул оттуда силой мои воспоминания. И что мне делать? Я так ушёл в себя, словно нырнул в бездну, пустую, ведь там изначально и не было ничего. Но я там рылься, копался в тьме и вспоминал лишь боль, словно больше ничего и не было. Боль!? Нога болела, я не услышал хлопок людей. Они всё начили смеяться. Их было двенадцать, но у них было три железных махины, не нета которая ещё стеклянная, вот эти махины были с трубой и кажется в этих домиках тоже кто-то сидел и смеялся. Ну зачем смеяться, мне же больно. Я не как не мог понять. И гнев опутал меня, ну зачем они смеються, зачем они мне, дарять боль, ведь в мире так много чувств, так зачем дарить мне именно такую мерзкую и неприятную боль. Я хотел их разорвать, освободить их души от этих мягких тел. \nХа-ха-ха смеялись солдаты им было смешно наблюдать за мальчиком, который ничего не мог, но не всём им было так смешно, не каждому это было по душе. Ведь у них ведь тоже дети, им было сложно смотреть на боль другого дитя. Но и поделать ничего они и не могли, ведь их ний командир, был садистом, это каждый понимал. Понимал, но сделать ничего не мог, а может и не хотель. Ну какая уже разница, ведь то что они увидели, вполне можно бы назвать карой божей. Им изначально показалась, что мальчик этот странный. Глаза блистели словно у хищника. Но их ней командир уж явно верущим не был, а когда стал уже было поздно. Ведь из мальчика,  что-то вылетела, не каждый солдат вообще смог это заметить, а кто заметили
