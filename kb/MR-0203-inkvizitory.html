. Конечно он ебанутый\n```\n\n### Версия 2 — 2026-06-09\n\nвселенная: неясно (по дате объявления) · окно w0121 · сообщения 488828–488828\n\n*что здесь: отряд инквизиторов атакует истощённого Нуара, ослепляет его и лишает чувств; внутри его тьмы не работает Оам, все убиты*\n\n\n\n```chat\n[488828] 2026-06-09 15:57 Слава: После битвы с Фатикой, нуар побеждает но не убивает. Оставляет её в живых и уходит. Уставший и потративший много оам, больше чем когда либа. Он в раздумий уходит от места битвы, но не успел он далеко отойти, как отряд инквизиторов атакует нуара. Нуар ослабленый и не успевший восстановится пытается отбиваться, но по итогу его ослепляют, лишают зрения и чувство, он в полной тьме. И к нему проиходит озарение он использует тьму. Область тьма маленькая, по сравнению какой он делал её раньше, но люди попав в эту тьму не видели света, не слышали звуков, они не были даже уверены стоят ли они или лежат, и идут. Пытаюсь использовать оам, он просто чём-то поглащался. Но вдруг наконец-то один из инквизиторов услышал звук и не поняв что это, с облегчением побежал на звук звук чавканья, липкий звук хруста. Но инквизитор не замечает этого бежит и видит. Слепой существо жадно поедает его товарища. Инквизиторов пытается использовать оам, но не получается, что-то его поглощает. Инквизитор начал потихоньку отступать, не дыша, он боялся издать хоть малейшее звук. Но голова во вся крови повернула голову в его сторону и смотрит слепыми глазами. \n(Всё инквизиторы были убиты.) ( почему нуар так поступил, он испугался впервые за долгое время он ощутил страх смерти и его знания помутнилась)\n```</div>"}];</script>
