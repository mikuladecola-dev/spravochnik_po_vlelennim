ны\n[175774] 2024-06-03 22:33 Слава: И вот эти колдуны способный управлять энергий их будет немного но они будут\n[175775] 2024-06-03 22:34 Слава: Будут низший и также вышей\n[175776] 2024-06-03 22:34 Миколай: Ну ты говоришь что в человеке борятся две энергии внутри и как по мне для начала стоит разобраться как эта борьба происходит и под какой призмой на всё это смотреть. И как идёт доминация одной силы над другой.\nТы ещё определяешь многих чистыми цветами. Тобиж они не имеют другого типа энергии? Это люди? Колдуны - люди?\n[175777] 2024-06-03 22:36 Слава: Колдуны чтобы полностью владеть энергий должны отдаться одному типу энергий \nУ людей это борьба зависит именно от них самих  типо ты не с рождения псих маньяк ты гнида стал таким лишь и за себя\n[175778] 2024-06-03 22:37 Слава: По этому колдуны могут сражу понять что за человек перед ним\n[175779] 2024-06-03 22:37 Миколай: Типо почувствовать?\n[175780] 2024-06-03 22:38 Слава: Типо увидеть\n[175781] 2024-06-03 22:38 Миколай: Прям увидеть силу отклонения от своего типа энергии?\n[175782] 2024-06-03 22:39 Слава: Типо увидеть цвет серый, серая белый, темная серый\n[175783] 2024-06-03 22:39 Слава: И здесь вопрос каких существ запихать в темную сторону или светлую или как людей смесь\n[175784] 2024-06-03 22:40 Слава: Типо надо существ придумывать\n[175785] 2024-06-03 22:41 Миколай: Какое-то такое чудо, но более страшное внешка, хорорнаяю иль ты по их характеристики спрашиваешь?\n[175786] 2024-06-03 22:41 Слава: Ну вообще и про внешку и про особенный черты\n[175787] 2024-06-03 22:42 Миколай: Ну а вот они будут думать или тупо машины?\n[175788] 2024-06-03 22:42 Миколай: А вообще представляю ному из мга\n[175790] 2024-06-03 22:43 Слава: У любого существо способный думать будет\n либо смесь либо темная или светлая \nА если существо не способная думать то у него будет природная типо растения животный\n[175791] 2024-06-03 22:44 Миколай: А\n[175792] 2024-06-03 22:44 Миколай: Пон\n[175793] 2024-06-03 22:45 Миколай: А можно я
