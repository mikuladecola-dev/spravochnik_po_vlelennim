стр\nГг рванул с места   даже не успеем отдышаться или прийти в себя он снова бежал только в этот раз не ради себя а ради такой близкой и бесконечно любимый сестры, он был готов перевернуть сами небеса дабы с ней все было в порядке \nОн бежал даже не зная дороги но каким то чудом добежал до дома \nНо боявшишь  открыть дверь и увидит окровавленный труп свой сестры или вообще не увидит её дома или решений рассудком и обвинявший его о опоздание сестру \nНо открыв дверь он увидел лишь коридор и услышишь топот ножек и увидит ту самую, целую и невредимую сестру \nОн хотел закричать расплакаться или потерять сознания, да все было хорошо, нов чё было слишком быстро и много \nНо он не закричал не расплакался и не потерял сознания он лишь когда всегда лучезарная улыбался и побежал за сестрой дабы поймать её и зашикатить, пряча за этим все те эмоции который переполнили его за этим жалких 20 мину \nПосле он удалился в туалет и начал резать руку нет невены не артерий а просто кожу и плоть, это единственный способ который он знал дабы выплеснуть эмоции\n```\n\n### Версия 3 — 2024-11-14\n\nвселенная: монстры (по дате объявления) · окно w0064 · сообщения 257159–257162\n\n*что здесь: Уточнение: когти не «прибили», а поцарапали кожу; механика контроля откладывается на 3-ю часть*\n\n\n\n```chat\n[257159] 2024-11-14 09:39 Слава: В 3 часть расскажу\n[257160] 2024-11-14 09:39 Слава: Поцарапал\n[257161] 2024-11-14 09:40 Слава: Решений рассудка и обвинявший его сестру \nТипо сестра сума сошла когда увидел монстра\n[257162] 2024-11-14 09:40 Слава: То бишь просто драки\n```\n\n### Версия 4 — 2025-01-06\n\nвселенная: Апостол (по дате объявления) · окно w0070 · сообщения 278865–278889\n\n*что здесь: Введение: правитель нашего мира, сейчас нейтрален и в сюжете его не будет; он же создал наш мир и Смерть; самый сильный, но всеми мирами не управляет*\n\n\n\n```chat\n[278865] 2025-01-06 14:21 Миколай: бог есть?\n[278866] 2025-01-06 14:22 Миколай: всё дальше читаю\n[278867] 2025-01-06 14:22 Слава:
