сать в понятной форме и делать подобные примечания\n```\n\n### Версия 2 — 2024-08-29\n\nвселенная: монстры (по дате объявления) · окно w0055 · сообщения 226097–226120\n\n*что здесь: второе правило: если добавляешь существо — надо его хотя бы описать, «а то нехуя не ясно»; плюс претензия к формату «снова мини мини история»*\n\n\n\n```chat\n[226097] 2024-08-29 17:55 Слава: Векторный шар\n[226098] 2024-08-29 17:55 Слава: ?\n[226099] 2024-08-29 17:55 Слава: Пролетал над холмом ?\n[226100] 2024-08-29 17:56 Миколай: это монстр которого ты бросаешь, но не отпуская и в ту сторону к которую идёт инерция он бесконечно тебя уносит\n[226101] 2024-08-29 17:57 Миколай: обычно всегда в небо, а после если ты достаточно высоко он отпускает и бьёт током чтобы ты разбился\n[226102] 2024-08-29 17:57 Миколай: мелкий хуй\n[226103] 2024-08-29 17:57 Слава: Серьезно \nИ ты даже его не описал не сказал \nА просто хоп\n[226104] 2024-08-29 17:58 Миколай: аххахахах\n[226105] 2024-08-29 17:58 Миколай: ну это всё потом\n[226106] 2024-08-29 17:58 Миколай: сейчас всё как надо\n[226107] 2024-08-29 17:58 Миколай: не всё сразу же но\n[226108] 2024-08-29 17:58 Слава: Если добавляеш надо хотя бы описывать \nА то нехуя не ясна\n[226109] 2024-08-29 17:59 Миколай: я писал с одной целью и и её выполнил\n[226110] 2024-08-29 17:59 Миколай: а\n[226111] 2024-08-29 17:59 Миколай: бля\n[226112] 2024-08-29 17:59 Миколай: я забыл\n[226113] 2024-08-29 17:59 Миколай: да\n[226114] 2024-08-29 17:59 Миколай: ок\n[226115] 2024-08-29 17:59 Миколай: буду понятнее делать\n[226116] 2024-08-29 17:59 Миколай: сори\n[226117] 2024-08-29 17:59 Слава: Ты серьезно\n[226118] 2024-08-29 17:59 Слава: Снова мини мини история\n[226119] 2024-08-29 18:00 Миколай: я те говорю, вообще нихуя не идёт\n[226120] 2024-08-29 18:00 Миколай: в голове каша\n```</div>"}];</script>
