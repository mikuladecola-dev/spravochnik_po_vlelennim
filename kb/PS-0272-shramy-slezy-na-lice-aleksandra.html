const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Шрамы-слёзы на лице Александра\n\n*персонаж* · вселенные: Апостол\n\n## Навигация\n\n- (w0097) Два шрама по щекам и глазам, похожие на следы слёз; появились в деревне неизвестно как, герой связывает их с ударом топора Палача. Единственное, что переносится через смерть и откат (328115, 328117).\n\n## Связано с\n\nАлександр Титовский, Возвращение в прошлое после клинической смерти, Палач\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-05-19\n\nвселенная: Апостол (по дате объявления) · окно w0097 · сообщения 328115–328115\n\n*что здесь: Появление: замечены после психбольницы, происхождение неизвестно, увязаны с казнью от Палача*\n\n\n\n```chat\n[328115] 2025-05-19 11:17 Слава: А дальше началось безумия. Не то что описали в фильмах, не то что написана в книгах. А реальная, субъективная. \nНе, не подумайте. Не пришёл, какой-то убийца. Не появился демон. Или из земли не начали лезть упыри. Безумия началось лишь в моём разуме. Круговорот событий проносился в моей голове. Всё смешивалось. Прошлое, будущее и настоящая. Я проживал всё разом. И вспоминал. Как я буянил в школе, и как я забирал сестру из садика, как я готовил кушать, потому-что родители уезжали. А следующий слайд, как я не взял эту чёртову трубку, как я не приехал. Как я лёг и думал, что я самый бедный человек. Не думая, что сестре сейчас ещё хуже. И следующий слайд плоть и кровь. И черви, что танцевали в лёгком вальсе. Перед моим то взором предстали монстры, краски, кровь и плоть. И пляски, танцы. Танцевали все эти тени. А на полу  котором танцевали они всё булькала. Да булькала. Там были  люди с лицами козлов, мышей. Словно маски нацепили. Краски, краски. Красная, жёлтая, оранжевая. Они словн поглощал меня.&quot; А если я не успею&quot;. Но он всё ещё было мелким. Я гнал и биль по рулю. Словно ругал машину. &quot; Почему ты такая медленная&quot;. Я ехал, а уже начинало темнеть. Мой разум был опьянен возможностью спасти сестру. И я был готов сделать всё возможное. Я гнал по ночной дороге. А тьма сгущалась, что даже фары не помогали. И я услышал неприятный звук таскания чего-то тяжелого и железного по бетону. И в лесу увидел фигуру. Большую массивную. Державшийся топор в руке. Отвернувшись и начиная приходить в себя, я увидел крутой поворот, который нужно было снести давным давно. НО НАШи политике думают по другому. Я слетел, не успев затормозить. Моя машина пролетела несколько метров. И жёстко ударилось об землю. И снова отскочив. Полетел еще. А я же без ремня был. Но вылететь мне не давал бампер, который вошёл внутрь салона. Придавив мои ноги до хруста костей. Не успел я осмыслить эту боль, как следующие столкновения с землёй. Вырубает меня. \n\n\nОчнулся я в больнице. Я ненавидел этот запах лекарств и хлорки. От него меня уже тошнило. \nЗачем они делают больнице белыми. Они хотят чтобы мы всё сошли с ума. Делают из нас психов. \nПытался я отвлечь себя этим. Но слезы текли. Я пытался закрыть их рукой. Что это было. Отчаяния? Страх? Ужас? Вина? Я едва их чувствовал. Словно после пьянки. И появилась мысль, что ударил мне по голове. Я не чувствую боли в ногах. Их что ампутировали. Ну разве не нужно соглашение. Я медленно убрал руку. И начал опускать свой взгляд. И увидел.... Они целый? Какого. И вторая мысль, что ударила сильнее прошлой. &quot; Так это сценка палача была, где он опять казнил меня&quot; Опять эти новый сценки, что дают надежду, а после разрушает их. Ему нравится это. Он же палач.\nЯ хотел наверное смеяться. Но не мог. И даже не знал радоваться или грустить или вообще ничего не чувствовать. Ведь моё типо возвращение в прошлое. Лишь глюк. Это бред, мой бред. Придуманный моим рассудком. Что бы я перед смертью не чувствовал вину. Да наверное это
