17 18:11 Миколай: он задает вопрос почему\n[366412] 2025-09-17 18:11 Миколай: но ответ : потому что бог грома гневается\n[366413] 2025-09-17 18:12 Слава: Так это долбоебская объяснения что гром ругается на нас без логики\n[366414] 2025-09-17 18:12 Миколай: ок\n[366415] 2025-09-17 18:12 Слава: Ясно просто раньше кроме религии ничего не было\n[366416] 2025-09-17 18:12 Миколай: у нас на следующем занятии тоже лекция\n[366417] 2025-09-17 18:12 Миколай: я так и скажу\n[366418] 2025-09-17 18:12 Слава: А всех учёных жигали на костре\n[366419] 2025-09-17 18:13 Миколай: потом тебе перескажу что препод ответит\n[366420] 2025-09-17 18:13 Миколай: раньше религии не было\n[366421] 2025-09-17 18:13 Слава: Как раз из-за мифологического воспрития мы так долго развивались\n[366422] 2025-09-17 18:13 Миколай: миф это не религия\n[366423] 2025-09-17 18:13 Миколай: до неё ещё тысячи лет\n[366424] 2025-09-17 18:14 Слава: Миф это вера в нелогическую но более лёгкое объяснения не имеющий над собой никакого основания\n[366425] 2025-09-17 18:14 Миколай: не вера\n[366426] 2025-09-17 18:14 Слава: А что. Тогда\n[366427] 2025-09-17 18:14 Миколай: восприятие\n[366428] 2025-09-17 18:14 Миколай: бля\n[366429] 2025-09-17 18:14 Миколай: жди\n[366430] 2025-09-17 18:15 Слава: Здесь ты четка написал что они обьясняють всё без логики а всё что не имеет логики и фактов является просто верой\n[366431] 2025-09-17 18:28 Миколай: Отлично, давай разложим всё по полочкам специально для Славы.\n\n### 1. Что такое миф (понятно и коротко для Славы)\n\nСлава, представь, что мозг — это компьютер, а восприятие мира — это его операционная система.\n\n*   У тебя и у меня установлена система &quot;Логика 21 века&quot;. Её главные правила: &quot;Докажи&quot;, &quot;Проверь&quot;, &quot;Найди механизм&quot;. Если что-то нельзя измерить и потрогать, мы считаем это фантазией или верой.\n\n*   У древнего человека была установлена система &quot;Миф 1.0&quot;. У неё совершенно другие правила:\n    1.  Что чувствую, то и есть. Нет разницы между сном, мыслью и реальностью. Приснился умерший дед — значит, он приходил. Почудилось, что в лесу леший — значит, он там есть.\n    2.  Главный вопрос не &quot;КАК?&quot;, а &quot;КТО?&quot;. Гром гремит не *потому что* разряд электричества. Гром гремит, *потому что КТО-ТО* (бог, дух) злится. Для них весь мир — это не набор объектов, а набор личностей.\n    3.  Нет абстрактных категорий. Нет слова &quot;одежда&quot;. Есть &quot;штаны, чтобы ходить&quot; и &quot;шлем, чтобы драться&quot;. Это разные вещи для разных ситуаций, как для тебя молоток и телефон. Ты же не объединяешь их в категорию &quot;предметы в руке&quot;?\n\nМиф — это не сказка, которую они рассказывали. Это их &quot;заводская прошивка&quot; мозга, их операционная система, которая обрабатывала реальность вот по таким правилам.\n\n---\n\n### 2. &quot;Они объясняют всё без логики, а это просто вера&quot;. Согласен?\n\nНет, не согласен. И вот почему.\n\nЭто самая главная ошибка, которую ты делаешь. Ты пытаешься судить их операционку &quot;Миф 1.0&quot; по правилам нашей системы &quot;Логика 21 века&quot;.\n\n*   Про логику: У них БЫЛА логика, просто она ДРУГАЯ.\n    *   Наша логика: Причина -&gt; Следствие (Разряд молнии -&gt; Нагрев воздуха -&gt; Звуковая волна).\n    *   Их логика: Событие -&gt; Действующее лицо (Гром -&gt; Гнев бога).\n    В их системе мира объяснение &quot;Бог грома гневается&quot; — абсолютно логично и последовательно. Это для нас оно кажется &quot;долбоебским&quot;, потому что у нас другие базовые аксиомы.\n\n*   Про веру: Это не было верой. Вера — это когда ты допускаешь, что что-то есть, но прямых доказательств у тебя нет (&quot;я верю в инопланетян&quot;).\n    А для них это было знанием, реальностью.\n    Ты же не &quot;веришь&quot; в то, что стол твердый? Ты это *знаешь*, ты это чувствуешь. Вот и они так же *знали*, что река — это живое божество, а гром — это его голос. Они в этом жили, а не верили в это.\n\n---\n\n### 3. Они дауны, шизофреники, имбецилы?\n\nНет
