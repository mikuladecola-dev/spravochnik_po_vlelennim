рети. Разве у вас просто не промелькала мысль увидеть как например звезда что строила свой образ на протяжении всей жизни вдруг падёт, разве это неинтересно, разве это не просто человеческая желания.\nИ кто же в нашем мире бог, конечно сл. И их ними падениями я буду восхищаться.но прежде чем пасть нужно сначала дать им подняться а после собвстенными руками поджечь им крылья и смотреть как крылья начинают разваливаться, как их уверенно лицо, изменяется гримассой страха. \nГлавный фанат сл. \nКстати ему не понравилось падения изб, он посчитал что слишком рано и что слишком быстро подослали злодей не дав насладиться эмоциями Изб. \nВообще он хочет  падения не как он сражался против сильного злодея и проиграл. А то где обычный человек, простолюдина топчит бога, дворянина. Где он побеждает даже Бога.\n```\n\n### Версия 2 — 2026-06-17 · повтор прежней мысли\n\nвселенная: неясно (по дате объявления) · окно w0122 · сообщения 491165–491165\n\n*что здесь: Повтор-уточнение: собственная организация названа одной из трёх вещей, которые Зана не предаст.*\n\n\n\n```chat\n[491165] 2026-06-17 19:59 Слава: У Зана белоснежная чистая кожа. Не как у больного а как у красивого человека. Он немного худощавый поэтому на вид его можно посчитать хрупким. Он ходит в белой рубашке с приоткрытом воротником, и засученными рукавами до локтя. Ходит он в очках с цепочкой ( артефакт) и на его правой руке вечно перчатка для стрельбы. Подвеска спрятанная за рубашкой чёрный штаны. \nУ него кнопочный дешёвый телефон, чтобы быстро и без сожаление его быстро выбросить. Также у него есть дорогой телефон, на котором вообще нет контактов или что-либо связанные с его работой. \nУ него союз с Бэмом. Реальный. Он не сообщем дурак. Он готов к верному сотруднечеству зная что это в будущем принесёт больше эмоции и даст ему ресурс для его преставления. \nСоюз таков. Бэм спонсирует его, а он веселит его преставоениеми и устраняет тех на кого покажет Бэм. \nМожно сказать есть три вещи которые он не предаст. Свою организация, союз с Бэмом ( большая часть ресурсов оттуда как бы. Поэтому это глупо ради мимолётно радости, решать себя постоянной радости) \nИ всул. \n- всул видил их морды. Ха-ха- говорит зан валяешь на полу. Всул же  летал рядом и обеспокоена смотрел на него. \n- ты бы видел как лицо того старика скорчилась. Этот сухарь думающий что всегда сможет держать голову холодной\n```\n\n## Неясности\n\n- (w0122) Кроме главы, ни один член организации не назван.</div>"}];</script>
