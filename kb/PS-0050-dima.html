<script>const BASE="../";const DOCNAME="Дима";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Дима\n\n*персонаж* · вселенные: Апостол, игра бога\n\n## Навигация\n\n- (w0029) Карточка персонажа Славы: разговорчивый, приставучий. Способность «кровавый палец» — стрельба кровью из пальца, максимум 3 раза.\n- (w0103) Друг рассказчика ещё со школы и с детской площадки, любитель заброшек — первая мысль героя, что это Дима их сюда привёл. В детстве нашёл большой заброшенный бетонный дом.\n- (w0110) Сквозной персонаж двух историй окна. В «Зиме» — высокий плечистый мужчина с натуральным чёрным цветом глаз, чёрными волосами и неизменной чёрной одеждой, приходит с мороза весь в снегу и щепках. В «Ложном герое» — избитый существом мужчина, которого утаскивают в лес, и по финальной реплике становится ясно, что это он.\n\n## Связано с\n\nБетонный герой, Герой-рассказчик (Бетонный герой), Зима, Игра бога, Ложный герой, Лёха и Андрей, Максим, Рогатое существо\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-04-03\n\nвселенная: игра бога (объявлено) · окно w0029 · сообщения 153530–153530\n\n*что здесь: полная карточка*\n\n\n\n```chat\n[153530] 2024-04-03 13:56 Слава: Дима \nРазговорчивый, приставучий \nСпособность: кровавая палец ( может стрелять кровью из пальца 3 раза максимум)\n```\n\n### Версия 2 — 2025-09-08\n\nвселенная: Апостол (по дате объявления) · окно w0103 · сообщения 362528–362531\n\n*что здесь: Введён как друг-любитель заброшенных зданий, с ним же пили в пятницу перед провалом.*\n\n\n\n```chat\n[362528] 2025-09-08 09:24 Слава: Бетонный герой \nГлава пробуждения\n\nГолова раскалывалось словно  я не напился, а получил удар молотком не единожды, а в горле засуха с привкусом прогнившего языка. Всё же не стоило так много пить. \nРазвалившись на  сухом, даже не на прохладным или тёплым полу, я в слепую пытался найти хоть что-то. Что можно выпить залпом. Но мои ещё не до конца трезвый перевороты и поиски не к чему не привели. Хотя привели к окну из которого ярко светила в мои закрытый глаза. Я прищурился и набравшись духа всё же решил открыть глаза, и лицезреть чужую квартиру. \nЯ открыл глаза и увидел окно, а точнее просто отверстия, в котором должно было быть окно. Но это просто пробел из которого светила ярким светом. Приподнявшись на руках я огляделся. И это было просто комната. Хотя лучше бы звучала помещение. В этом помещении ничего не было. Абсолютно ничего, лишь бетонные стены и отверстия, в которых должны быть окна и двери. Словно я находился на заброшке, либо стройке. \nПервая мысль, что пришла в голову- Дима блять.наверника это он нас сюда привел-  Дима мой друг ещё со школы. И он любитель подобных мест. Заброшек я имею ввиду. \nС такой мыслью я начал вставать с бетонного пола. \nКак и ожидалось такая вещь, как встать после похмелья. Для меня оказалось затруднительно. Хотя я встал, но не мог устоять ровно. И конечно я был в шоке, как же сильно я вчера нажрался. Я конечно и до этого выпивал. Но не разу не доходило до того, что на завтрашней день я не мог нормально ходить и при этом ничего не помнил.\nДавай себе обещания, что больше никогда в жизни не буду пить, я пошёл к дверному проходу и вышел из помещения. Но там меня не ждала ничего нового. Всё такое же бетонное помещение без признаков жизни или какой-либо активности. Я имею ввиду там ведра, инструменты или хотя бы мусор, гравити, блять даже шприцы. Хоть что то, что напоминало бы стройку или заброшенность этого здания. Но здесь до ужаса чисто и ничего нет. \nПопытка сглотнуть ком образовавшийся в горле. Привела лишь сухому вызывающие лишь раздражения в горло, кашлю ведь собрать достаточным влаги во рту не как не выходила. \n&quot;Надо поскорее выбираться и купить воды. Иначе я так реально могу и помереть, а друзья? Наверное ещё вчера ушли в пьяном угаре бросив меня&quot;  Поставив для себя цель. Всё же неуверенно пошёл. Не только из-за шатающихся ног. Но из-за какой-то странности, которой я не как не мог осмыслить внутри опухшей головы. \nЯ шёл медленно опираясь на удивление на пыльную бетонную стену, а ведь в комнате, в которой я очнулся не было пыли. А здесь пыль лежала везде несколькими слоями, как будто бы здесь давным давно не кого не было. Под давным давно я говорю не про неделю или месяц, а наверное несколько десятков лет. \n&quot; Что же это за здания такое&quot; Всё витала у меня в голове. И была ещё одна мысль - где Дима с Лёхой? - ведь именно с ними я вчера и выпил. \nНо эти мысли каждый раз перебивались моим сухим и болящим горлом. Поэтому я просто шёл марая свою руку, что опирались на стены. \nТолько сейчас начал замечать воздух здесь был каким-то за стоявшим и абсолютно сухим, мёртвым без влаги, словно ветер не как не мог суда попасть. Это вызывало лишь больше раздражения. У меня и так всё болит и я дико хочу пить, а здесь даже воздух сухой. \nЯ шёл и пытался не думать. Не раздражаться лишний раз.\nЛестница всё такая же бетонная и пыльная вела вниз. &quot; А ведь точно. Я ведь так не глянул в окно без окна. Я даже не знаю на каком я этаже&quot; Ну и ладно просто пойду вниз и дойду до конца. Не было не какого желания идти обратно в комнату. \nЛестница была без перил. Просто бетонные ступени и всё. Я спускался по ним уже более бодра. Ощущая, что наконец-то покину эту за брошку, а после найду магазин и куплю холодную, освежающий горло водичку и больше никогда не буду пить алкоголь. \nНа удивление быстро спустившись по лестнице. Оказывается я не был так высоко. Всего лишь на третьем этаже.\n[362529] 2025-09-08 09:24 Слава: Я увидел проход из которого выбирался яркий свет. И он свет был странным. Проснувшись в комнате я не придал этому значению. Хотя я вообще наверное не замечал. Но сейчас свет, как будто неестественный странно. \nХотя без разница, вот улица, вот выхода, чего я ещё хотел. Я быстром шагом приблизился к выходу. И зажмурив глаза от яркого света. Я вышел наружу. \nСвет был ярким, но я всё же открыл глаза и огляделся и.. \nБетонный здания без окон и дверей с пылью, что десяток лет копилось на них окружили меня. Здесь больше ничего не было. Лишь бетонный здания без лавочек, травки и зелени. Просто бетон. Но даже не это напугало меня, а то что небо не была. Там на вверху, где должны были быть облака и неба, а возможно яркий звезды. Была лишь бетонный потолок. Он закрыл всё, абсолютно все. Весь мой мир он закрыл его и запер меня где? А этот грёбаный свет от лампы, который торчали везде. На потолке на бетонных сооружениях. Да даже в полу. Они просто были везде. Словно создателю было без разницы.\n Ну кроме всего этого. Та самая странность, что я откинул. Я понял, что это за странность. Это тишина. Абсолютная и всепоглощающая тишина. Здесь не было никакого звука абсолютно. Не было песни птиц, звук машин, шаги людей. Была просто тишина. Словно я здесь один. \n\nГлава страх \n-Что !!Что!!Что !!Что здесь происходит. Где я? что я здесь делаю?Это  пранк. Это же явно создали люди. Да-да это пранк- я засмеялся словно ухватился за спасательную соломинку. Но оглядевшись подумал &quot; Какой черт побери пранк? Какое человек настолько потратиться и здесь не одной чертовой камеры. Здесь только бетонный здания и потолок с лампами, что светят тускло жёлтым светом и всё &quot;  \nМне начало не хватать кислорода. Воздух словно стал ещё плотнее, ещё твёрже, как будто бы кисель. Я не как не мог его вздохнуть, а если и выходила, то этот вдох царапал мои лёгкие и горло. А после оседал внутри давя на легкий. А сердце наоборот словно бешенная начало биться, как будто бы подобно мне испугалось бетонное ловушке. Но для сердца ловушкой стало плоть. Моя плоть, и она всеми силами пыталось её пробить. Пройти сквозь плоть и кожу, и освободиться от бреного тела. \nГолова закружилась из-за недостатка кислорода. Весь бетонный мир начал плавать. Искажаться и сужаться. Я потерял равновеси
