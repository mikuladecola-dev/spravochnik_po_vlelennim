<script>const BASE="../";const DOCNAME="Главный герой мира богов и аватаров";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Главный герой мира богов и аватаров\n\n*персонаж* · вселенные: Падения небес\n\n## Навигация\n\n- (w0022) Главный герой мира богов и аватаров у Славы: избранный богом, урод внешне, чсв и эгоист. Разбирается 3-4 января: сначала внешность, потом подбор способности, потом характер и вопрос мотивации.\n\n## Связано с\n\nмир богов и аватаров, телепортация в карманное измерение\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-01-03\n\nвселенная: Падения небес (по дате объявления) · окно w0022 · сообщения 75746–75750\n\n*что здесь: гг стал избранным (аватаром) в современном мире, куда боги выпустили монстров*\n\n\n\n```chat\n[75746] 2024-01-03 15:37 Слава: Смотри вот мир обычный современный и вдруг боги решили устроить месиво и начали выбирать аватаров ( давая самого начало лишь основный способность , но со временем человек может открывать другие способности данного бога , и при этом может качать и старый ) и вот гг стал избранном \nНо это не все что бы было большей зрелище что бы людишки шевелились они начали выпускать дута монстров ( но там нет квестов там просто монстры и все )\n[75747] 2024-01-03 15:38 Слава: И все они изначально равны ( я про аватаров )\n[75748] 2024-01-03 15:39 Миколай: Ну, знаешь\n[75749] 2024-01-03 15:39 Миколай: Это идея врд норм ложится\n[75750] 2024-01-03 15:39 Миколай: Не?\n```\n\n### Версия 2 — 2024-01-03\n\nвселенная: Падения небес (по дате объявления) · окно w0022 · сообщения 75986–75989\n\n*что здесь: гг будет уродом*\n\n\n\n```chat\n[75986] 2024-01-03 19:51 Слава: Вот идеально\n[75987] 2024-01-03 19:51 Слава: Тем более гг у меня будет уродом\n[75988] 2024-01-03 19:52 Миколай: Хах, прикольно, мне нравится\n[75989] 2024-01-03 19:53 Миколай: Это как Аматерасу и Идзанами\n```\n\n### Версия 3 — 2024-01-04\n\nвселенная: Падения небес (по дате объявления) · окно w0022 · сообщения 76034–76070\n\n*что здесь: подбор способности для гг: С сначала хотел время, но передумал; М предлагает варианты; С хочет что-то в духе Акселератора, но своё*\n\n\n\n```chat\n[76034] 2024-01-04 13:03 Слава: Какую способность дать гг \nИзначально я хотел время но передумал ( потому что как то так себе )\n[76035] 2024-01-04 13:05 Миколай: Спонтанное самовозгорание самоподжигание объектов вокруг\n[76036] 2024-01-04 13:05 Слава: Не\n[76037] 2024-01-04 13:05 Миколай: И типо с прокачкой он больше контролирует её\n[76038] 2024-01-04 13:05 Миколай: Хочешь чего-то необычного?\n[76039] 2024-01-04 13:06 Слава: Ну допустим\n[76040] 2024-01-04 13:08 Миколай: Ну допустим многого хочешь, хоть обычное можно просто необычно развивать, а необычное надо сначала раскрыть, обуздать и работать с чем-то необычным труднее\n[76041] 2024-01-04 13:08 Миколай: Так уж и быть попробую придумать\n[76043] 2024-01-04 13:14 Миколай: Ну так, влияние и стимуляция отдельных органов выработка гормонов по желанию для того, чтобы получить нужный эффект, например не чувствовать боль, чувствовать себя сильнее, с этим можно интересно поиграться и многое придумать. Даже в аниме герой щита какую-то тупую защиту так обыграли, так что думаю можно из любой фигни интересный сюжет высосать\n[76044] 2024-01-04 13:15 Миколай: Ну или если обычная то телепорт, это круто\n[76045] 2024-01-04 13:15 Миколай: И удобно\n[76046] 2024-01-04 13:19 Слава: А ещё ?\n[76047] 2024-01-04 13:21 Слава: Акселлелятор\n[76048] 2024-01-04 13:21 Слава: Знаешь его\n[76049] 2024-01-04 13:21 Слава: ?\n[76050] 2024-01-04 13:23 Миколай: Только из твоих слов\n[76051] 2024-01-04 13:23 Миколай: Умение ломать систему. Системы разные бывают не обязательно механические. У него удача всегда направлена на то что какую-то деталь в системе он сломает уберёт, а как мы знаем, хоть одну деталь убрать из сис де все\n[76172] 2024-01-04 15:46 Слава: Нечего если честно не нашел\n[76174] 2024-01-04 15:48 Миколай: Эта энергия\n[76175] 2024-01-04 15:48 Миколай: Что это\n[76176] 2024-01-04 15:48 Миколай: От куда она\n[76178] 2024-01-04 15:49 Слава: Из его карманного измерения\n[76196] 2024-01-04 15:56 Миколай: Ммм\n[76197] 2024-01-04 15:56 Миколай: Его ему подарил его бог\n[76198] 2024-01-04 15:56 Миколай: Да\n[76199] 2024-01-04 15:56 Миколай: ?\n[76201] 2024-01-04 15:57 Слава: Это его способность телепортироваться карманная измерения ( бога )\n```\n\n### Версия 5 — 2024-01-04\n\nвселенная: Падения небес (по дате объявления) · окно w0022 · сообщения 77262–77279\n\n*что здесь: характер и мотивация: чсв, эгоистичный, не прочь убить, считает себя избранным, но мораль есть; в начале сюжета просто веселится, набивая всем морду, дальнейшая цель не найдена; М предлагает цель забрать все способности (как Все За Одно), С отказывается ради баланса; решают сначала построить мир, потом дать гг мотивацию*\n\n\n\n```chat\n[77262] 2024-01-04 21:38 Миколай: Например там можно было попросить умереть человека ради него и он себя убивал во имя любви\n[77263] 2024-01-04 21:39 Слава: Сейчас думаю а какая мотивация у гг ( вообще он чсв, эгоистичный , не прочь убить и считает себя избранным но у него все ровно есть мораль ) изначально в сюжете он просто веселиться набивая всем морду но дальше нужная какая то цель ?\n[77264] 2024-01-04 21:39 Миколай: И типо, он будет использовать афродизиак на людях, смотреть их половые акты и заставлять убивать друг друга\n[77265] 2024-01-04 21:39 Миколай: Хахах\n[77266] 2024-01-04 21:39 Слава: Он человек обычный\n[77267] 2024-01-04 21:42 Миколай: Знаешь, а может, ну хотя скорее ты не согласишься, тип в мга есть все за одно, типо чел который забирает все способности и может ими управлять, может его цель забрать всё\n[77268] 2024-01-04 21:42 Миколай: Все способности у всех\n[77269] 2024-01-04 21:42 Миколай: Ну а вдруг\n[77270] 2024-01-04 21:42 Миколай: Эт весело\n[77
