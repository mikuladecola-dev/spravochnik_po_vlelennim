const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Закон\n\n*персонаж* · вселенные: 7 островов, игра бога\n\n## Навигация\n\n- (w0026) Способность Славы: носитель произносит закон, и в радиусе 70 метров его обязаны выполнять, за нарушение следует наказание. Дальше идёт совместный поиск слабостей и ограничений: Миколай предлагает условие слышимости, Слава его отклоняет, оговариваются рамки действия.\n- (w0029) Названа Славой в одном ряду с петлёй и агентами-животными как то, что надо «закидать» во вселенную; никакой механики в этом окне не расписано. Возможно, из этой заготовки позже вырос персонаж Максим со способностью «власть» через закон.\n- (w0046) Участник Пресрога, обычный человек, расист: считает иные расы рабами, но не всегда убивает; членов организации не трогает и всё равно не смог бы одолеть Кая.\n\n## Связано с\n\nКай, Максим, Петля, Пресрог, Способность &quot;Закон&quot;, Феникс, Чел манипулирующий объектами, Чел с абсолютным нулём\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-03-12\n\nвселенная: неясно (по дате объявления) · окно w0026 · сообщения 138166–138172\n\n*что здесь: первая формулировка Славы: радиус 70 метров, можно произнести любой закон, он обязателен к исполнению, за нарушение наказание (примеры: прыгнешь — вес +1 тонна; нападёшь с намерением убить — не сможешь двигаться какое-то время); заявлено, что способности нужны слабости*\n\n\n\n```chat\n[138166] 2024-03-12 15:10 Слава: Есть способности \nЗакон ( в радиусе 70 метром может сказать любой законны и его обязательно выполнять ( то бишь не убивать , не прыгать и т.д) а если нет будет наказание ( не прыгать если прыгнешь твой весь увеличиться на 1 тонну плюс минус ; не убивать за хочешь убить и нападешь то не сможешь дв бности, разработка на этом обрывается*\n\n\n\n```chat\n[138218] 2024-03-12 15:44 Миколай: Слава, я не буду погружаться и усложнять, все гениальное просто, если хочешь, что-то более конкретное учись давать более релевантное задание, да и вообще это по жизни пригодится))\n```\n\n### Версия 5 — 2024-04-02\n\nвселенная: игра бога (по дате объявления) · окно w0029 · сообщения 151856–151860\n\n*что здесь: название прозвучало без раскрытия*\n\n\n\n```chat\n[151858] 2024-04-02 06:58 Слава: Вообще я хочу туда закидать петлю ( то бишь перемотка времени на 10 секунд 10000 раз) \nТакже люди берущий  свою силу от животных то бишь агенты среди людей\nТакже туда можно и закон закидать\n```\n\n### Версия 6 — 2024-04-02 · повтор прежней мысли\n\nвселенная: игра бога (по дате объявления) · окно w0029 · сообщения 152590–152600\n\n*что здесь: повторное упоминание в связке «петля и закон» уже внутри scp-концепции*\n\n\n\n```chat\n[152590] 2024-04-02 19:44 Миколай: Дз ща напишу и чекну\n[152591] 2024-04-02 19:44 Миколай: Ток домой пришёл\n[152593] 2024-04-02 19:44 Миколай: Ну вот когда прочитал тогда пришёл\n[152594] 2024-04-02 19:46 Слава: Вообще какую концепцию туда вбахать вообще изначально я хотел что была организация которая борется с злом то бишь добро и зло но сейчас думая мне как то не нравится \nЛучшей будет создать концепцию scp  только вбухать туда и сверхсила типо петли и закона, и экспериментах на людях \nИ другую расу которая будет нам помогать \nВообще концепция охота на аномалий\n[152599] 2024-04-02 20:13 Миколай: Ну ммм, эмм. Тут не совсем опять пон. Ты точно чет хочешь добавить у Поротая как по мне и так много способностей, а концепцию ты придумал, в чем вопрос не пон🤔\nНадеюсь ничего что я так долго не отвечаю, во первых если честно не особо удобно сейчас думать, а во вторых как то я в растерянности, мне прям штурмануть на часика 3 надо мозг, чтобы понимать, что хочу и как. Просто ну ты меня знаешь, если я за что-то берусь, ну мне нужно как-то подзаебаться и выдать чет
