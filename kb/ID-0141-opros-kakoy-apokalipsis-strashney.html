const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Опрос: какой апокалипсис страшней\n\n*идея* · вселенные: Нимб\n\n## Навигация\n\n- (w0090) Вопрос Славы с двумя вариантами - апокалипсис по вине людей против апокалипсиса от внешних факторов (323375, повторён в 323403). Своей разработки в чат не вылилось: М прогнал вопрос через несколько нейросетей и на этом бросил (323455-323459, итог 323488 - поровну).\n\n## Связано с\n\nИнцидент (ядерный удар), Пролог про апокалипсис\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-05-02\n\nвселенная: Нимб (по дате объявления) · окно w0090 · сообщения 323375–323378\n\n*что здесь: Формулировка вопроса и двух вариантов: 1) по вине людей - ядерная война, катаклизмы от небрежения природой, созданный вирус; 2) внешние факторы - пришельцы, метеорит, вирус не по вине людей, спящие в пещере твари, причина неизвестна.*\n\n\n\n```chat\n[323375] 2025-05-02 11:12 Слава: Вопрос\n\nКакой апокалипсис или постапокалипсис страшней?\n\nВарианты ответа\n\n1.Который возник по вине людей (ядерная война; катаклизмы от того, что мы не ценили природу; создания какого либо вируса)\n\n\n2. Который произошёл из-за внешних факторов ( пришельцы; метеорит; новый вирус, который возник не по вине людей; спящий в пещере твари и т. д.) и мы как правило не знаем об этом ничего. Неизвестная причина, который разрушила наш мир\n[323376] 2025-05-02 11:13 Слава: Ответ\n[323377] 2025-05-02 11:13 Слава: Ты можешь сделать его виде опроса\n[323378] 2025-05-02 11:14 Слава: Я пытался но там показывали что слишком много букв\n```\n\n### Версия 2 — 2025-05-02 · повтор прежней мысли\n\nвселенная: Нимб (по дате объявления) · окно w0090 · сообщения 323403–323406\n\n*что здесь: Слава повторяет тот же вопрос дослов рироду; создания какого либо вируса)\n\n\n2. Который произошёл из-за внешних факторов ( пришельцы; метеорит; новый вирус, который возник не по вине людей; спящий в пещере твари и т. д.) и мы как правило не знаем об этом ничего. Неизвестная причина, который разрушила наш мир\n[323434] 2025-05-02 11:28 Миколай: о, я не заметил\n[323435] 2025-05-02 11:28 Миколай: ты историю скинул\n[323436] 2025-05-02 11:31 Миколай: Я считаю, что апокалипсис по вине людей страшнее.\n\nАпокалипсис, вызванный человеческими действиями, несет в себе особый трагизм из-за осознания, что мы сами стали причиной собственной гибели. Это добавляет к физическим страданиям еще и глубокую моральную травму — чувство вины, сожаления и бессмысленности произошедшего. \n\nПредставьте выживших после ядерной войны, которые знают, что их страдания — результат человеческой гордыни, жадности или просто ошибки. Это создает особенно тяжелую психологическую нагрузку: мы могли предотвратить катастрофу, но не сделали этого.\n\nВ случае внешних факторов (метеорит, пришельцы) есть определенное утешение в том, что это была неизбежная судьба, против которой мы боролись как вид. Такой апокалипсис может даже объединить выживших общей целью и врагом.\n\nКроме того, апокалипсис по вине людей подрывает веру в человечество и его будущее — если мы уже однажды уничтожили себя, что помешает повторить эту ошибку при восстановлении цивилизации?\n[323437] 2025-05-02 11:34 Миколай: Ответ: Апокалипсис, возникший из-за внешних факторов, страшнее, чем вызванный людьми. Вот почему:\n\n1. Неизвестность и отсутствие контроля  \n   Внешние угрозы (метеорит, инопланетная инфекция, древние твари) часто не поддаются предсказанию и не имеют очевидного решения. Люди лишены возможности подготовиться или противостоять им, что порождает хаос и бессилие. Например, неизвестный вирус может мутировать быстрее, чем наука успеет разработать лекарство, а метеорит станет неожиданной фатальной катастрофой. В отличие от человеческих ошибок, где хотя бы понятны причины (например, экологическое разрушение), внешние факторы ставят перед лицом космической или природной случайности, против которой бессильны даже лучшие умы.\n\n2. Психологический ужас перед непознанным  \n   Страх перед инопланетной жизнью или древними существами усиливается тем, что мы не знаем их мотивов, слабостей или возможностей. Например, инопланетные технологии могут быть настолько продвинутыми, что любое сопротивление будет бессмысленным, как попытка человека победить танк. Это разрушает иллюзию человеческого превосходства и вызывает экзистенциальный ужас.\n\n3. Отсутствие «виноватых» для искупления  \n   В случае антропогенного апокалипсиса (ядерная война, экокризис) есть возможность осознания вины, коллективной ответственности и даже символического «искупления» через выживание. Во внешнем апокалипсисе вина бессмысленна: мир рушится не из-за человеческой глупости, а просто потому, что так случилось. Это делает катастрофу абсурдной и бессмысленной, что усиливает трагизм.\n\n4. Примеры из культуры и истории  \n   В литературе и кино («Контакт», «Армагеддон», «Холодное пламя») внешние угрозы часто изображаются как испытание для человечества, где ключевой проблемой становится адаптация к неизвестному. Исторически эпидемии чумы или метеоритные дожди вызывали панику именно из-за непонимания их природы. Люди предпочитают бояться того, что могут объяснить (как экологические проблемы), но неизвестное пугает сильнее.\n\nИсключения и нюансы:  \nЕсли человеку проще принять катастрофу как следствие своих действий (например, экологическую катастрофу как «карму»), то внутренний апокалипсис может быть психологически тяжелее. Однако в массовом сознании страх перед космосом, инфекцией или древним злом остаётся более универсальным и первобытным, ведь он касается базового инстинкта выживания перед лицом неизвестного.\n\nВывод:  \nВнешний апокалипсис страшнее, потому что он лишает человека контроля, знаний и надежды на справедливость, превращая выживание в борьбу с хаосом, а не с последствиями собственных ошибок.\n[323438] 2025-05-02 11:39 Миколай: 🗹 2. Который произошёл из-за внешних факторов  \n\n*(Интервью после голосования)*  \n\n— Почему вы выбрали именно этот вариант?  \n\nПотому что неизвестность пугает больше, чем даже наша собственная глупость. Если мир рухнул из-за людей – это хоть как-то понятно. Мы знаем врага: жадность, войны, халатность. Но если всё разрушило *что-то извне* – метеорит, пришельцы, древний вирус – это абсолютный ужас.  \n\n— Но разве не страшно осознавать, что человечество само себя погубило?  \n\nСтрашно, но это хоть объяснимо. А вот если на нас свалилось нечто, о чём мы даже не подозревали… Это как жить в доме, который внезапно рухнул не из-за ветхости, а потому что из-под земли выполз гигантский червь. Ты не мог этого предвидеть, не мог подготовиться – и теперь даже не понимаешь, какие ещё сюрпризы ждут.  \n\n— А как же надежда на восстановление?  \n\nПосле человеческих ошибок шанс есть – мы хотя бы знаем, что делать. Не строить больше ядерные бункеры, не ковырять опасные вирусы. А если мир уничтожил метеорит – кто сказал, что завтра не прилетит второй? Если проснулись древние твари – откуда знать, что они не заполонят всю планету? Это как игра в рулетку, где вместо пули – вся Вселенная.  \n\n— И последнее: какой апокалипсис, на ваш взгляд, более реален?  \n\nУвы, первый. Люди – мастера самоуничтожения. Но *страшнее* всё равно второй. Потому что в нём нет даже иллюзии контроля.\n[323439] 2025-05-02 11:46 Миколай: Какой глубокий и философский вопрос! Оба варианта рисуют мрачные картины будущего, но действительно, один из них может быть психологически и эмоционально страшнее другого. Давайте погрузимся в анализ.\n\nВариант 1: Апокалипсис по вине людей (антропогенный)\n\nТакой сценарий включает в себя катастрофы, вызванные деятельностью человека: ядерная война, экологические катастрофы (например, изменение климата, загрязнение окружающей среды), пандемии созданных вирусов (случайно или намеренно) и т.п. В этом случае:\n\nСтрашное в этом варианте:\n1. Осознание вины: Люди понимают, что всё произошло по их собственной вине. Мысли о том, что &quot;мы сами всё разрушили&quot;, &quot;мы знали, что так будет, но не остановились&quot; или &quot;мы могли предотвратить, но поленились&quot; порождают коллективное чувство вины, стыда и отчаяния. Это как если бы человечество осознало, что оно — собственный палач.\n2. Ослабляет моральный дух: Если крах мира произошёл из-за ошибок людей, оставшиеся в живых постоянно будут упрекать себя, правительство, науку, друг друга. Депрессия, конфликты и распад социальных связей станут частью нового &quot;бытия&quot;. Люди будут думать: &quot;Мы загубили будущее наших детей, наш мир, нашу цивилизацию...&quot;.\n3. Нет &quot;героического&quot; оправдания: В случае техногенной катастрофы невозможно сказать: &quot;Нас наказала природа&quot; или &quot;Это был злой рок&quot;. Нет внешней силы, на которую можно возложить ответственность. Остаётся лишь горькое: &quot;Мы сами дураки и нас самих же и постигла заслуженная кара&quot;.\n4. Разрушение веры в прогресс: Человечество последние столетия верило, что развитие науки и технологий = улучшение жизни. И вдруг выясняется, что именно эти достижения ведут к гибели. Это крах концепции &quot;мы можем всё контролировать&quot; и &quot;прогресс нас спасёт&quot;.\n\nПример: Фильмы &quot;На следующий день&quot; (1983, ядерная война), &quot;Дорога&quot; (2009, экологическая катастрофа), &quot;Станция «Фрэнсис»&quot; (2015, пандемия). В них отчаяние героев подчёркнуто именно тем, что они знают: это сделали мы сами.\n\nВариант 2: Апокалипсис от внешних сил (природный/космический/непрогнозируемый)\n\nЗдесь речь о событиях, которые не зависят от воли человека: падение астероида, нашествие пришельцев, внезапная вспышка неизвестного вируса из глубин океана, пробуждение древних монстров, солнечная супер-вспышка и т. д. Ключевой момент — мы не могли этому помешать.\n\nСтрашное в этом варианте:\n1. Непредсказуемость и беспомощность: Человек любит контролировать мир (пусть иллюзорно), а тут вдруг: БАХ! — и из космоса, глубин Земли или параллельного мира приходит нечто, против чего наука, армии и правительства бессильны. Это как ребёнок, которого ударила невидимая рука вселенной.\n2. Необъяснимость = страх неизвестности: Когда причина не в нас, мозг начинает дорисовывать худшие сценарии: &quot;Что, если это только начало?&quot;, &quot;Что, если они вернутся?&quot;, &quot;Что это за сила, которая даже не замечает нас?&quot;. Страх неизвестности порой хуже страха заслуженного наказания.\n3. Абсурдность происходящего: Представьте: вы живёте, работаете, мечтаете, а потом — метеорит, чёрная дыра или зелёные щупальца из параллельного мира. Это как если бы куклам в детской вдруг сказали: &quot;Игра окончена. Вы никто. Вас даже не заметили&quot;.\n4. Отсутствие логики в происходящем: В варианте &quot;мы сами виноваты&quot; есть хотя бы причинно-следственная связь (&quot;перегрели планету — получили потоп&quot;). А здесь логика ломается полностью: &quot;Просто так случилось. Просто не повезло&quot;. Это разрушает саму идею &quot;справедливости мироздания&quot;.\n\nПример: Фильмы &quot;Война миров&quot; (2005, пришельцы), &quot;2012&quot; (2009, планетарная катастрофа), сериал &quot;Противостояние&quot; (2020, неизвестный вирус). Люди там кричат: &quot;Почему это случилось с нами?!&quot;, но ответа нет.\n\nТак что же страшнее?\n\nПсихологи утверждают: именно второй вариант (внешний, непрогнозируемый апокалипсис) для большинства людей страшнее и травматичнее****. Почему?\n[323440] 2025-05-02 11:46 Миколай: 1. Отсутствие &quot;заслуженности&quot;: Когда катастрофу вызвали мы сами, в глубине сознания остаётся мысль: &quot;Окей, мы получили по заслугам&quot;. Пусть это ужасно, но подсознательно человек находит некое &quot;равновесие справедливости&quot;. Здесь работает принцип: &quot;Что посеешь, то и пожнёшь&quot;.\n2. Внешний апокалипсис унижает человека: Эволюция сделала Homo Sapiens венцом природы, а тут вдруг: бух! — и мы оказываемся такими же беззащитными, как динозавры перед астероидом. Это разрушает антропоцентризм (идею &quot;человек — центр Вселенной&quot;). Мы перестаём быть хозяевами своей судьбы, становясь просто биологическим видом № 5837, который раздавили случайным нажатием кнопки в космическом симуляторе.\n3. Нет &quot;терапии вины&quot;: В случае антропогенной катастрофы люди хотя бы теоретически могут сказать: &quot;Ладно, мы облажались, но в следующий раз исправимся&quot;. Здесь есть урок, шанс на исправление (пусть и для будущих цивилизаций). Но если конец пришёл ниоткуда, это означает, что никакого урока нет. Просто &quot;так устроен мир&quot;, а ты — песчинка, которую может смыть волной в любой миг.\n\nВывод:\n- Если вам страшно от мысли &quot;мы сами всё испортили&quot;, то это про потерю достоинства и надежды на искупление.\n- Если вас ужасает &quot;просто так случилось, без нашей вины&quot;, это про абсолютную беспомощность, неизвестность и бессмысленность существования.\n\nВторой сценарий (внешний апокалипсис) видится более экзистенциально страшным, потому что:\n1. Лишает человека иллюзии контроля.\n2. Не оставляет надежды на &quot;мы могли бы иначе&quot;.\n3. Показывает, что мир абсолютно равнодушен к нашим жизням, планам и достижениям.\n\nВ итоге, страх не в самом апокалипсисе, а в том, что́ он говорит о нашем месте во Вселенной:\n- Первый вариант говорит: &quot;Вы плохо играли по правилам — вас наказали&quot;.\n- Второй вариант шепчет: &quot;Игры нет. Правил нет. Вас просто нет в сценарии мира&quot;.\n\nP.S. Если вы поклонник философии, то второй вариант — это чистая экзистенциальная драма в духе Альбера Камю (&quot;Миф о Сизифе&quot;) или Ницше (&quot;Бог умер, теперь всё дозволено... и бессмысленно&quot;). Первый же ближе к библейскому &quot;Бог покарал нас за грехи&quot;. Как видите, выбор сценария апокалипсиса = выбор философии страха. А что страшнее лично вам? :)\n[323441] 2025-05-02 11:51 Миколай: ▼ САМ ВОПРОС  \n«Что страшнее — апокалипсис, который мы устроили сами, или тот, что прилетел откуда-то снаружи?»  \n\nОтвет, как водится, зависит от того, что именно мы называем «страхом». Давайте разложим на несколько плоскостей.\n\n---\n\n## 1. Психология страха\n\n| Критерий | «Мы виноваты» (вариант 1) | «Мы бессильны» (вариант 2) |\n|----------|---------------------------|----------------------------|\n| Контроль | Есть ощущение, что могли предотвратить, значит, грызёт вина. | Полное отсутствие контроля: «это свалилось на голову». |\n| Постижимость | Понятны механизмы: ракеты, парниковые газы, лаборатории. | Неизвестность, туман причин: пришельцы? древний вирус? космический импульс? |\n| Надежда | Пока есть мы — есть шанс починить. | Труднее выстроить план спасения, не зная, с чем борешься. |\n| Экзистенциальный ужас | «Мы сами нажали кнопку». Страх = самоосуждение. | «Вселенная равнодушна». Страх = космическая холодность. |\n\nПсихологи отмечают, что чувство бессилия + неизвестность усиливает тревогу сильнее, чем даже вина. С этой точки зрения второе выглядит страшнее.\n\n---\n\n## 2. Культурные архетипы\n\n• Человеческая вина  \n  – «Мёртвая зона» Кинга (ядерные коды в голове сумасшедшего)  \n  – «Безумный Макс» (ресурсы кончились, люди озверели)  \n\n• Внешний фактор  \n  – «Прибытие» (да, здесь без апокалипсиса, но страх общения с непонятным)  \n  – «Страшные сказки матушки Лавкрафта» (древние боги проснутся)  \n  – «Меланхолия» фон Триера (планета сталкивается с Землёй)\n\nУ Лавкрафта и фон Триера главный нерв — беспомощность: ты ничего не можешь сделать, даже не понимаешь, как это работает.\n\n---\n\n## 3. Социальные последствия\n\n1) Наш косяк  \n   • Возможен социальный раскол: одни ищут виноватых, другие пытаются «чинить».  \n   • Но есть мотивация объединиться: «разгрести то, что натворили».  \n\n2) Их/его/того косяк  \n   • Паника + конспирология: «кто понял больше — тот в бункере».  \n   • Может произойти паралич воли: «что толку бороться, если метеорит размером с Луну?».\n\n---\n\n## 4. Реальная статистика рисков\n\n• Ядерная зима, климатический коллапс и лабораторные патогены — ТОП-3 в отчётах Global Catastrophic Risk.  \n• Вспышки гамма-излучения, крупные астероиды и вторжение E.T. оцениваются ниже по вероятности, но последствия при успехе — тотальные.\n\nТаким образом, «наш» апокалипсис более вероятен, а «их» апокалипсис менее вероятен, но по ощущениям непостижимее.\n\n---\n\n## 5. Чисто субъективно\n\nЛюди обычно боятся не самой смерти, а:\n1) неизвестности,  \n2) боли/медленных мучений,  \n3) ответственности («я подвёл близких»).\n\nЕсли поставить галочки:\n• Вариант 1 закрывает пункты 2 и 3.  \n• Вариант 2 — 1 и 2.  \n\nБольшинство исследований по тревожным расстройствам говорит: неизвестность (п. 1) бьёт сильнее. Поэтому среднестатистический мозг обычно сильнее пугается сценария № 2.\n\n---\n\n### Короткий вывод\n\nСтрашнее тот апокалипсис, где:\n\n• мы ничего не понимаем,  \n• не знаем, как защититься,  \n• и не можем никого призвать к ответу.\n\nТо есть, психологически № 2 выглядит холоднее, чужероднее и потому ужасней.  \nНо прагматически, если говорить о шансах реально «словить» конец света, № 1 куда ближе и оттого тоже делает нервным. 😊\n\n---\n\nА вы сами к чему склоняетесь: тревожнее жить с мыслью «мы нажмём на красную кнопку» или с ощущением «а вдруг завтра с неба упадёт что-то, о чём мы даже теории не построили»?\n[323442] 2025-05-02 11:56 Миколай: вообще типо если не твоя вина в человеческом Апокалипсисе и тв не знаешь как это исправить, нет большой разницы со вторым вариантом, для тебя как индивидуума и то и то страшно\n```\n\n## Неясности\n\n- (w0090) Не привязано явно ни к какой вселенной, хотя через два дня Слава берётся именно за пролог про апокалипсис.</div>"}];</script>
