<script>const BASE="../";const DOCNAME="Стенд по характеру и страху (свой, не из ДжоДжо)";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Стенд по характеру и страху (свой, не из ДжоДжо)\n\n*идея* · вселенные: вне вселенной\n\n## Навигация\n\n- (w0016) Слава просит Миколая придумать себе не готовый стенд из ДжоДжо, а собственный — реализованный на его характере, страхе или стремлении; Миколай отшучивается («Зе Ворлд») и предлагает строить на страхе. Подготовкой служит разговор о страхах тем же вечером (импотенция, арахнофобия у Миколая, темнота у Славы).\n\n## Связано с\n\nЗе Ворлд, Ролик-реакция по ДжоДжо\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2023-07-25\n\nвселенная: вне вселенной (разбор «неясно») · окно w0016 · сообщения 47319–47330\n\n*что здесь: Заготовка: Слава спрашивает про самый большой страх и что больше всего любишь; Миколай называет импотенцию и арахнофобию, Слава — темноту.*\n\n\n\n```chat\n[47319] 2023-07-25 17:33 Слава: Чего боишься?\nЧто больше всего любишь ?\n[47320] 2023-07-25 17:34 Слава: Твой самый большой страх\n--- пауза 2.5 ч ---\n[47322] 2023-07-25 20:06 Миколай: Импотенция\n[47323] 2023-07-25 20:06 Миколай: Арахнофобия\n[47324] 2023-07-25 20:06 Миколай: Ну и всё наверное\n[47325] 2023-07-25 20:06 Миколай: А ты\n[47326] 2023-07-25 20:06 Миколай: У тебя\n[47327] 2023-07-25 20:07 Слава: Темноты\n[47328] 2023-07-25 20:07 Миколай: Че поступил?\n[47329] 2023-07-25 20:08 Слава: Нет ещё\n[47330] 2023-07-25 20:08 Миколай: Понятно\n```\n\n### Версия 2 — 2023-07-25\n\nвселенная: вне вселенной (разбор «неясно») · окно w0016 · сообщения 47450–47477\n\n*что здесь: Постановка задачи: какой стенд был бы у Миколая с его характером, страхом и стремлением; условие — не из вселенной ДжоДжо, а придуманный свой, с указанием, на каком страхе или стремлении реализована способность. Ответа-конструкции в окне нет, Миколай отвечает «Зе Ворлд» и «попробуй на страхе».*\n\n\n\n```chat\n[47450] 2023-07-25 20:45 Миколай: Он в садике\n[47451] 2023-07-25 20:45 Миколай: .\n[47452] 2023-07-25 20:45 Миколай: И ещё кое что тебе отправлял\n[47453] 2023-07-25 20:45 Миколай: Повсюду челюсти, бараньи челюсти, длинные челюсти, гнилые челюсти, хожу по улице и вижу челюсти, жутко, в дрожь берёт, и я в растерянности.\n Вдруг меня убьют или я убью, так жутко, не могу пошевелится, у меня есть 2 лица, бесчувственный, весёлый. Прихожу домой, весь на ве-селе, уже все забыл, жаль пол не помыл, и встречают грубо, да я провинился, но зачем всё портить, так не врозумился.\nЯ опять всё вспомнил, выхожу из дома. Бегу под машину, но не успеваю, снова вижу зубы, чужой мёртвой псины и мне стало легче, почему - не знаю. Похуй. \nПрохожу бараки, вижу трупаки, птенцов, кошаков и дворовых псин, вроде сильно жутко, но лучше чем дома. Я хожу по трубам, но не вижу трупов. Падаю в крапиву, очень больно, тут и посплю, пусть меня поищут. Если не найдут и я не буду дома, значит поглумился надо мною вурдалак.\n[47454] 2023-07-25 20:47 Слава: Смотри у меня вдруг вопрос появился какой бы у тебя был бы стэнд с какой способностю\n[47455] 2023-07-25 20:47 Слава: ?\n[47456] 2023-07-25 20:48 Миколай: Зе ворлд кнш\n[47457] 2023-07-25 20:49 Слава: А если честней с твоим характером с твоим страхом с твоим стремлением какой бы у тебя был бы стэнд\n[47458] 2023-07-25 20:49 Миколай: Подсказка в студию\n[47459] 2023-07-25 20:50 Миколай: Звонок другу\n[47460] 2023-07-25 20:50 Миколай: Ало\n[47461] 2023-07-25 20:50 Миколай: Слава\n[47462] 2023-07-25 20:50 Миколай: Приает\n[47463] 2023-07-25 20:50 Миколай: Такой вопрос\n[47464] 2023-07-25 20:50 Миколай: А если честней с моим характером с моим страхом с моим стремлением какой бы у меня был бы стэнд\n[47465] 2023-07-25 20:50 Слава: Не из вселенной джоджо а именно твой\n[47466] 2023-07-25 20:50 Слава: Придумай\n[47467] 2023-07-25 20:51 Слава: Какая у него
