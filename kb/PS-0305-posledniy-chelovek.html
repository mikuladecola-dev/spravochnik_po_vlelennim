в окно целый город, людей и в его голове всё накладывается на те воспоминания, где город залит кровью людей \n( что вообще в этой ситуации должен почуствовать гг, он убивал монстров не из-за мести, а лишь потому что по другому не мог. Ка робот он просто убивал их. И да он будет желать всех спасти ценой себя самого, наплевав на мнение близких. Но что он почуствовает, когда вернётся в прошлое.\n[381305] 2025-11-01 21:17 Слава: Лично мне кажется, что во время просмотра в окно. Он будет смотреть на людей и в его глазах будет мерещиться их ней мёртвый изуродованный тела. И в конце он блуваенет и будет в панике даже в ужасе\n```\n\n### Версия 2 — 2025-11-02\n\nвселенная: вне вселенной (по дате объявления) · окно w0108 · сообщения 381354–381401\n\n*что здесь: Внутренняя линия после возврата в прошлое: шок, радость, боль, страх ответственности за повторение*\n\n\n\n```chat\n[381354] 2025-11-02 10:09 Миколай: сначала он в ахуе\n[381355] 2025-11-02 10:09 Миколай: насчёт мерещится, я никогда не рассматривал подобные сценарии и представить не могу\n[381356] 2025-11-02 10:10 Миколай: он возможно подумает, а где он\n[381357] 2025-11-02 10:10 Миколай: ага он там где был\n[381358] 2025-11-02 10:10 Миколай: но люди появились\n[381359] 2025-11-02 10:10 Миколай: может это другое время\n[381360] 2025-11-02 10:10 Миколай: прошлое\n[381361] 2025-11-02 10:10 Миколай: о я могу всё изменить\n[381362] 2025-11-02 10:11 Миколай: о как же круто, что люди живы\n[381363] 2025-11-02 10:11 Миколай: я могу с ними общаться, пусть и не знаю о чем\n[381364] 2025-11-02 10:11 Миколай: увидеть тех кого хотел\n[381365] 2025-11-02 10:12 Миколай: да он будет видеть тех кто умер, а такие все\n[381366] 2025-11-02 10:12 Миколай: и он будет плакать и ему будет больно\n[381367] 2025-11-02 10:12 Миколай: он захочет сказать им чтобы они не откладывали то, что хотели сделать в будущем\n[381368] 2025-11-02 10:13 Миколай: я такого не видел\n[381369] 2025-11-02 10:13 Миколай: я в это не поверю\n[381370] 2025-11-02 10:1
