const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># принципы материализации и её продуктов\n\n*мир* · вселенные: монстры\n\n## Навигация\n\n- (w0052) Свод правил, по которым в мире рождаются монстры: условия появления (родитель и знающие), сила материализации через количество и качество веры, определение материализованного монстра, чем поддерживается его жизнь, превращение в злого духа. Дальше почти весь день идёт спор Славы и Миколая, который правила уточняет и ломает.\n\n## Связано с\n\nБеркут, Кирилл, злой дух, знающий, ограничение видения монстров, родитель\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-08-11 · повтор прежней мысли\n\nвселенная: монстры (по дате объявления) · окно w0052 · сообщения 218110–218114\n\n*что здесь: повтор возражения из предыдущего окна: хотение и вера — разные вещи, суицидники мир разрушить хотят, но верить в это не будут; ответа сразу не последовало*\n\n\n\n```chat\n[218110] 2024-08-11 22:22 Слава: Ну так не я один хочу чтобы мир разрушился или случился апокалипсис \nТе кто хочет этого миллярды\n[218111] 2024-08-11 22:22 Слава: Да и суицидники если и хотят чтобы мир разрушался, все равно в это верить не будут\n[218112] 2024-08-11 22:22 Слава: Хотение и вера разные вещи\n[218113] 2024-08-11 22:22 Слава: А потом ответь на это\n[218114] 2024-08-11 22:22 Миколай: ок\n```\n\n### Версия 2 — 2024-08-12\n\nвселенная: монстры (по дате объявления) · окно w0052 · сообщения 218383–218396\n\n*что здесь: полный свод в пяти разделах с нумерацией и пометками «роль»: условия появления, сила материализации (количество и качество), что такое материализованный монстр, из чего состоит его жизнь, злой дух*\n\n\n\n```chat\n[218383] 2024-08-12 14:55 Миколай: аххахахахахха\n--- пауза 2.0 ч ---\n[218392] 2024-08-12 16:54 Миколай: принципы материализации и её продуктов:\n1. для появления \n1.1. должен имеется родитель который:\n1.1.1. обладает представлением о монстре(характеристики, характер, история) \n1.1.2. имеет в воображении его образ(внешность, способности, ограничения)\n1.1.3. имеет желание которое не может реализовать\n1.1.4. хочет встретить это существо\n## роль: определяет внешность, мотивы, характер и иные характеристики монстра на фундаментальном уровне\n1.2. должен иметься знающий:\n1.2.1. знает от родителя о монстре и верит что он существует\n1.2.2. испытывает сильную эмоцию при мыслях о монстре(КПТ на полную)\n1.2.3. описывает галлюцинации связанные с монстром\n## роль: напрямую материализует в мистическом пространстве монстра посредством накопления образов из галлюцинаций. может влиять на характер и образ монстра, но на поверхностном уровне\n2. сила материализации\n2.1. влияние количества(при выполнении всех условий пункта 1.)\n2.1.1. чем больше знающих, тем больше возможностей для взаимодействия с материальным и духовным миром есть у монстра.\n2.1.2. при минимальных условиях, что чаще всего, монстр минимально может взаимодействовать с миром духов при 10 знающих\n## всегда идет стремление к идеалу. в идеале монстр может полностью взаимодействовать в духовным и реальным миром, а также совершать манипуляции различного характера на всех уровнях соответствующие его мотивам\n2.2. влияние качества\n2.2.1. сила реализации мотивов геометрически пропорциональна силе вклада знающих\n2.2.2. сила способностей геометрически пропорциональна эмоциям знающих\n## качество вклада знающего обнуляется если он начинает рационализировать силу своих и чужих влияний \n3. что такое материализованый монстр\n3.1. дух действующий в соответствии с один мотивом и сценарием сформированным консенсусом хаоса\n3.2. существо создание коллективным бессознательным\n4. из чего состоит жизнь материализации\n4.1. изменения под влиянием представления\n4.2. стремление воплотить мотивы родителя\n4.3. его материализация это духовное тело с которым можно взаимодействовать на духовном уровне\n4.4. жизнь существа поддерживается родителем, если его не будет или он изменит мотивы, монстр навсегда исчезнет если развеять форму даже если остались знающие\n4.4. при отсутствии знающий жизнь также перестаёт поддерживаться\n5. злой дух\n5.1. после первого нарушения одной заповеди дух становится злым\n5.2. злой дух реализует мотивацию родителя через аморальные методы\n[218394] 2024-08-12 16:57 Слава: Во всех этих правилах мне не нравится именно вера других людей\n[218395] 2024-08-12 16:58 Слава: Типо злой челик решит показать своего монстра по телеку или Ютуб и все начнут в него верить\n[218396] 2024-08-12 16:59 Слава: И  моснстор сразу может стать бог\n```\n\n### Версия 3 — 2024-08-12\n\nвселенная: монстры (по дате объявления) · окно w0052 · сообщения 218398–218430\n\n*что здесь: спор об усилении через массовую огласку: монстра нельзя показать по телевизору, тип материализованных монстров принципиально слабый, вклад знающего обнуляется при рационализации*\n\n\n\n```chat\n[218398] 2024-08-12 17:02 Миколай: и\n[218399] 2024-08-12 17:02 Миколай: опять всё упирается в качество\n[218400] 2024-08-12 17:02 Слава: Показать монстра в центре большого города или прямой эфир\n[218401] 2024-08-12 17:02 Слава: Или пусть он разрушит город\n[218402] 2024-08-12 17:02 Миколай: как ты его покажешь\n[218403] 2024-08-12 17:02 Слава: В каком смысле\n[218404] 2024-08-12 17:03 Миколай: ты серьёзно думаешь камеры его видят\n[218405] 2024-08-12 17:03 Слава: Да\n[218406] 2024-08-12 17:03 Миколай: нет\n[218407] 2024-08-12 17:03 Миколай: нихуя\n[218408] 2024-08-12 17:03 Слава: Он материален ты сам писал\n[218409] 2024-08-12 17:03 Слава: Почему\n[218410] 2024-08-12 17:03 Миколай: .\n[218411] 2024-08-12 17:04 Слава: Ну или на худой конец заставить разрушить город показать перед толпой людей\n[218412] 2024-08-12 17:04 Миколай: или взрослые в чью жизнь вмешался злой дух\n[218413] 2024-08-12 17:04 Миколай: ну как\n[218414] 2024-08-12 17:04 Миколай: епта\n[218415] 2024-08-12 17:04 Слава: Давай нафиг уберем в ограничений видения\n[218416] 2024-08-12 17:05 Слава: В каком смысле как\n[218417] 2024-08-12 17:05 Миколай: ты же понимаешь что он слабый\n[218418] 2024-08-12 17:05 Миколай: они всегда слабые\n[218419] 2024-08-12 17:05 Слава: Поймать он материален, и показать\n[218420] 2024-08-12 17:05 Слава: Ты что хочешь чисто слабых что ли\n[218421] 2024-08-12 17:05 Слава: ?\n[218422] 2024-08-12 17:06 Слава: Ну показать в центре города он станет сильней и сможет уничтожить город\n[218423] 2024-08-12 17:07 Миколай: тип материализованых монстров слабый, я не хочу с этим ебаться, ты мя зачмырил за силу, их сильными сделать тяжело\n[218424] 2024-08-12 17:07 Миколай: качество вклада знающего обнуляется если он начинает рационализировать силу своих и чужих влияний\n[218425] 2024-08-12 17:08 Миколай: ты читаешь вообще или где епта?\n[218426] 2024-08-12 17:08 Слава: Ну тогда давай веру уберем, что бы они не были слишком сильными\n[218427] 2024-08-12 17:08 Слава: А\n[218428] 2024-08-12 17:08 Слава: ?\n[218429] 2024-08-12 17:08 Миколай: динах\n[218430] 2024-08-12 17:08 Слава: Что бы сила зависла от родителя\n```\n\n### Версия 4 — 2024-08-12\n\nвселенная: монстры (по дате объявления) · окно w0052 · сообщения 218432–218445\n\n*что здесь: Слава предлагает убрать веру и завязать силу только на родителя; Миколай настаивает на зависимости от других людей, иначе каждый создаст убийцу вселенной; Слава возражает, что детальность воображения родителя недостижима*\n\n\n\n```chat\n[218432] 2024-08-12 17:09 Слава: Так ты сам говоришь что не хочешь заморачиваться\n[218433] 2024-08-12 17:09 Миколай: нужна зависимость от других людей\n[218434] 2024-08-12 17:09 Миколай: сука\n[218435] 2024-08-12 17:09 Слава: Нафиг\n[218436] 2024-08-12 17:10 Миколай: че каждый мелкий еблан создаст себе убийцу вселенной и всё\n[218437] 2024-08-12 17:10 Миколай: залупа это\n[218438] 2024-08-12 17:10 М
