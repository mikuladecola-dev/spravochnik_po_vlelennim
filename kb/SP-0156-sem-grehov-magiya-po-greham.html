const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Семь грехов (магия по грехам)\n\n*способность* · вселенные: неясно\n\n## Навигация\n\n- (w0068) Заданная Славой задача: подобрать магию или способность каждому из семи смертных грехов. Ответ Миколая целиком в 273906, встречный вариант Славы в 273920, разбор — 274462-274472.\n\n## Связано с\n\nАлчность (грех), Гнев (грех), Гордыня (грех), Зависть (грех), Лень (грех), Похоть (грех), Чревоугодие (грех)\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-12-24\n\nвселенная: неясно (по дате объявления) · окно w0068 · сообщения 273735–273750\n\n*что здесь: Постановка задачи и список грехов (похоть, чревоугодие, алчность, лень, гнев, зависть, гордыня); можно давать одну способность, набор или категорию*\n\n\n\n```chat\n[273735] 2024-12-24 10:40 Слава: Какую магии или способность ты дал бы каждому из грехов\n[273736] 2024-12-24 10:40 Слава: Похоть (лат. luxuria).\nЧревоугодие (лат. gula).\nАлчность (лат. avaritia).\nЛень или апатия (лат. accedia).\nГнев (лат. ira).\nЗависть (лат. invidia).\nГордость или гордыня (лат. superbia).\n[273737] 2024-12-24 10:42 Слава: Бля я только сейчас узнал что такое алчность\n[273739] 2024-12-24 11:30 Миколай: че это\n[273740] 2024-12-24 11:30 Миколай: ммм\n[273741] 2024-12-24 11:30 Миколай: ща\n[273742] 2024-12-24 11:31 Слава: Это жадность и желание получить все\n[273743] 2024-12-24 11:31 Миколай: крч\n[273744] 2024-12-24 11:31 Миколай: я позже\n[273745] 2024-12-24 11:31 Миколай: скамейки убирать и хавать\n[273746] 2024-12-24 11:33 Миколай: одну способность\n[273747] 2024-12-24 11:33 Миколай: или категорию\n[273748] 2024-12-24 11:33 Миколай: или набор\n[273749] 2024-12-24 11:33 Слава: Как хочешь\n[273750] 2024-12-24 11:33 Слава: Можешь и так и так\n```\n\n### Версия 2 — 2024-12-24\n\nвселенная: неясно (по дате объявления) · окно w0068 · сообщения 273903–273908\n\n*что здесь: Полный ответ Миколая по всем семи грехам с механиками, наборами и проклятьями*\n\n\n\n```chat\n[273903] 2024-12-24 13:29 Миколай: крч\n[273904] 2024-12-24 13:29 Миколай: продолжаю грехи писатт\n[273905] 2024-12-24 13:31 Слава: 🌝\n[273906] 2024-12-24 13:57 Миколай: похоть:\nво первых: если одна способность, то это определённо афродизиак. можно по разному определить его: как стихию и как благословение. типа: либо ты создаёшь туман с веществом и оно на человека влияет. либо ты влияешь на человека\n\nво вторых: если набор то к афродизиака контроль серотонина(решает кто кого любит по научному), отключает стыд регулирующий соц поведение.\n\nв третьих: категорию хз как определить\n\n___\n\nчревоугодие:\nво первых: способность всё хавать или поглощать, в том числе магию которая меньше облака заклинания, даже чужая магия. это благословение, ибо влияние, а не создание\n\nкак набор: \nпоглощение чужих навыков, но не себе. он их поглощает и они исчезают\n\n__\n\nалчность:\nестественно: воровство, конкретно вещей, любых, можно с нескольких вещей одновременно и даже больших, они хранятся в пространстве\n\nтакже возможность совершить сделку с дьяволом\n\nпроклятье: ты не можешь ничего отдать кому либо\n\n__\n\n\nлень:\nбарьер неуязвимый пока тебе лень. хотя, пока ты спиш.\n\nтелепортация неподкондрольная, ну типа хочется куда то, туда и появляешься, но лень должно быть))))\n\nспособность растечься, но не двигаться\n\n__\n\nгнев\n\nпо характеру чувствительность к тому что считаешь несправедливым\n\nпри несправедливом ты в режиме берсерка, повышается мышечная масса, тобиж в размерах меняешься, сила возрастает, контроль уходит и ты разрушаешь то что не справедливо (справедливость всегда субъективна, но субъективная не всегда глупая)\n\nмагия взрыва развита\n\nвес ног увеличен\n\nпроклятье: теряешь способность видеть человеком того кто поступил не справедливо(ну личность не видишь, это просто груша с маркером ненависти ты видишь чувство)\n\n___\n\nзависть\n\nспособность заставить, забыть человека и всех кто его знает его родословную навязав желаемый статус\n\nобъект зависти забывает желания\n\nмагия льда развита\n\n___\n\nгордыня\n\nшизофрения как способность, чет ему в голову голос говорит какой он крутой\n\nмагия света и огня развита хорошо\n\nмагия привлечения внимания\n[273907] 2024-12-24 13:57 Миколай: ну ладно\n[273908] 2024-12-24 13:57 Миколай: как тебе\n```\n\n### Версия 3 — 2024-12-24\n\nвселенная: неясно (по дате объявления) · окно w0068 · сообщения 273912–273921\n\n*что здесь: Встречный вариант Славы по спорным грехам и оговорка Миколая, что в грехах базовая стихийная подразумевается сама собой — такова природа греха*\n\n\n\n```chat\n[273912] 2024-12-24 14:18 Миколай: а\n[273913] 2024-12-24 14:18 Слава: Ладно\n[273914] 2024-12-24 14:18 Слава: Для начала\n[273915] 2024-12-24 14:20 Слава: Базовый стихий это владением одной из 4 стихий \nИ после только изучение одной из базовой стихий мы можешь изучить другйи отвлетленние магии \nТипо ты не можешь сразу начать учиться магий дерева для тебя сначала надо научиться магии земле а потом только магии дерева \nНу то бишь как в аватаре\n[273916] 2024-12-24 14:23 Миколай: ок\n[273917] 2024-12-24 14:23 Миколай: но в грехах это базовое подразумевается, такова природа греха\n[273920] 2024-12-24 14:26 Слава: Похоть:\nКонтроль разума с ограничением. То бишь она может повысить какое то чувство или вызвать галлюцинаций или наоборот понизить какой то чувство \nЧревоугодие ок \nАлчность:\nЯ думал больше о способности поглощений чужой манный или объектов \nЛень: я думал телекинез типа лень чё то делать вот и телекинез ( здесь ещё в придачу владений магий ветра, как никак они связаны)\nГнев ну ок \nЗависть: \nПолной перевоплощение тому кого завидуешь, под полный подразумевается полной копирование сил, магии, одежды, внешность но не характера \nГордыня:\nСлово закон с ограничением\n--- пауза 1.5 ч ---\n[273921] 2024-12-24 15:55 Миколай: привет\n```\n\n### Версия 4 — 2024-12-25\n\nвселенная: неясно (по дате объявления) · окно w0068 · сообщения 274459–274472\n\n*что здесь: Разбор Миколая по пунктам Славы: где вариант Славы лучше, где жалко терять сделку с дьяволом, где не понял связь телекинеза и ветра*\n\n\n\n```chat\n[274459] 2024-12-25 07:12 Миколай: я твой коммент разбираю пока\n[274460] 2024-12-25 07:12 Миколай: потом перса делаю\n[274462] 2024-12-25 07:23 Миколай: нуу думаю это получше, но мне понравилась идея со сделкой в дьявола\n[274463] 2024-12-25 07:26 Миколай: согл звучит уместнее, просто было воровство, а я повторятся не хотел, если убрать, но очень хорошо подходит, я тоже хотел\n[274464] 2024-12-25 07:27 Миколай: хз, я не думал, так что не особо понимаю про ветер\n[274465] 2024-12-25 07:28 Слава: Не типа магия телекинез и магия ветра они же похожий в чем то\n[274466] 2024-12-25 07:28 Миколай: а\n[274467] 2024-12-25 07:28 Слава: Ну не прям копия но есть похожие черты\n[274468] 2024-12-25 07:30 Миколай: дадада\n[274469] 2024-12-25 07:30 Миколай: это лучше\n[274470] 2024-12-25 07:30 Миколай: моя версия мне не нравится\n[274471] 2024-12-25 07:30 Миколай: вот это подходит\n[274472] 2024-12-25 07:31 Миколай: тоже хороший вариант\n```\n\n## Часть чего\n\nСемь грехов\n\n## Неясности\n\n- (w0068) Неясно, для этого ли мира грехи или это отдельная задумка — вселенная не названа</div>"}];</script>
