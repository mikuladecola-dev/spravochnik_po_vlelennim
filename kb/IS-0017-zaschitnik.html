<script>const BASE="../";const DOCNAME="Защитник";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Защитник\n\n*история* · вселенные: 7 островов, Апостол, Оам, Феня, монстры\n\n## Навигация\n\n- (w0043) Роль в сеттинге: сильнейший человек на острове, защищает не один остров. В окне определение даётся в ответ на вопрос, как защитники вообще прикрывают целые острова.\n- (w0051) Персонаж Славы: бывший офисный работник 34 лет, у которого гоблины убили жену и похитили дочь, после чего он год готовился и начал охоту на монстров. Полный текст его истории — в 217605–217606, дальше по окну идут уточнения (возраст, цель, чем он смог убить Беркута, последствия убийства мирного духа).\n- (w0074) В самом конце окна Слава объявляет, что хочет исправить и слегка переписать оригинальную историю Защитника; Миколай уточняет, будет ли это тот же сюжет в более качественной форме или отдельные поправки. Самого текста в окне нет.\n- (w0075) Мужчина лет 40, бывший трудоголик и семьянин: на отдыхе в частном доме на его семью напали чужемирцы, дочь погибла, жена ослеплена, сам он попал в больницу и несколько месяцев спивался. После случайной встречи с оборотнем два года тренировался, купил оружие и начал охоту на монстров; в начале и в конце текста лежит израненный в лесу рядом с перебитой группой тварей.\n- (w0077) Пятый в списке благословенных с пометкой «ангел»; Слава предлагает Миколаю представлять себя защитником и отыгрывать его, Миколай соглашается вживаться в роль неделю.\n- (w0080) Ранее написанная история и её герой — недавно появившийся охотник за чужемирцами. Старик выбирает его как манекен для тест-драйва новой силы; следующая история заявлена как их встреча. По оценке М, история про Антона идёт на втором месте после «Защитника».\n- (w0081) Противник рассказчика в истории «Битва»: молчаливый мститель, которого выслеживает старик-арбетар. В ходе боя из человека становится апостолом. Полное имя названо в 302378, обсуждение статуса — 302666-302681.\n- (w0082) Упоминается в 305116 как новый апостол по прозвищу &quot;защитник&quot;, к которому спешит имитатор; в рейтинге историй С стоит третьим (305098). Подтверждение статуса — 305338-305340.\n- (w0083) Апостол по имени Александр; вытащил из речки сгнившие тела жены и дочери, живёт гневом и ждёт появления чужемирца, чтобы убить. В бою вырубает себя до культяпок и в конце перегрызает ангелу горло зубами.\n- (w0112) Апостол, который сошёл с ума, когда умер его ребёнок, и в какой-то момент полностью откажется от своей человеческой натуры. Именно его судьба пугает дочь Имитатора.\n- (w0114) Один из апостолов. По задумке должен отказаться от человечности, которая в нём плачет и чувствует вину за неспасённую семью.\n\n## Связано с\n\nАгрегат, Ангел, Апостол, Апостолы, Артефакты, Беркут, Бессмертный, Битва, Благословение, Благословенные, Благословенный, Брошенные дети (гоблины), Граф, Дочь Имитатора, Имитатор, История о двух мирах (рассказ от первого лица), Мета-люди, Монстры и вера, Нуар, Отыгрыш персонажей, Предохранитель, Презрение монстров к убийце мирного духа, Пустынник, Рассказчик-монстр, Семья Защитника, Семья защитника, Старик-арбетар, Старик-арбетар (рассказчик-чужемирец), Упырь-рассказчик, Чужемирцы, Чутьё на чужемирцев\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-07-04\n\nвселенная: 7 островов (по дате объявления) · окно w0043 · сообщения 196705–196713\n\n*что здесь: определение: защитник — сильнейший человек на острове, защищает не один остров, кроме него есть другие мета-люди*\n\n\n\n```chat\n[196705] 2024-07-04 20:27 Миколай: а как вообще защитники защищают целые острова\n[196706] 2024-07-04 20:27 Слава: Защитник- сильнейший человек на острове \nЕсть другие мета-люди\n[196707] 2024-07-04 20:27 Миколай: мета люди\n[196708] 2024-07-04 20:27 Миколай: ?\n[196709] 2024-07-04 20:27 Слава: Он не один остров защищает\n[196710] 2024-07-04 20:28 Слава: Где то услышал\n[196711] 2024-07-04 20:28 Слава: Ну пусть будут пока мета\n[196712] 2024-07-04 20:28 Слава: Мета- люди с энергий\n[196713] 2024-07-04 20:28 Слава: Способностью\n```\n\n### Версия 2 — 2024-08-11\n\nвселенная: монстры (по дате объявления) · окно w0051 · сообщения 217599–217614\n\n*что здесь: Первое появление персонажа: монолог-биография от первого лица — нападение гоблинов, гибель жены, пропажа дочери, год тренировок, покупка ружья, тренировочные драки в неблагополучных районах, охота на Беркута и его убийство с балкона.*\n\n\n\n```chat\n[217599] 2024-08-11 14:17 Миколай: она готова 5000 оплатить чтобы с челом который её не любит поехать на Байкал\n--- пауза 1.4 ч ---\n[217605] 2024-08-11 15:39 Слава: Я защитник. Вы спросите защитник чего, и я вам отвечу защитник благополучия и семейного очага. И как же я им стал ну давайте поведаю.\nБыл я обычным офисным сотрудников ну не прям обычным ну суть вы уловили, жил я в частном доме, в большом доме с огородом, прям как в деревне. И вместе со мной жили прекрасная жёнушка которая с годами становится только красивее, и дочь которая в моем сознания была милейшим созданием и как вы понял я их очень обожал. Да мы тот самый 1 из 1.000 у которых счастливый брак и я рад этому. Моя жизнь шла стабильно и размерено, можно сказать лучше некуда. Я жил в идеальном зоне комфорта, пока меня от туда не выпнули, схватили за волосы и вытащили из моего такого любимого и давно забытого круга комфорта. И вам интересная что за паскуда, точней паскуды вытащили, вынесли меня от туда. Вот сейчас я вам и расскажу. Этот день был обычным таким же как вчера или после вчера или год назад. Все прекрасная, даже смог пораньше уйди с работы и прийти к любимым. Смог поиграть с дочуркой, смог поговорить с женой. И вот сели мы ужинать, как сука неожиданно окно, своим телом разбил сука карлик. Сука как это существо ещё можно назвать карлик серым оттенка кожи, при этом Галина имеет длинный когти на руках, и острый зубы, при этом одеты как бомжи . И как мне по-вашему реагировать на это в мой в дом ,в окно вламываются бомжеватый карлик с каким-то заболеванием кожи. Ну я как бы схватил то что первое попалась на руку и швырнул паскуде прямо в морду, а швырнул я тарелку супа, поэтому карлик особо не пострадал но стал злей. На что я резко встал схватил стул и начал вертеть им вокруг до около. А жене кричу бегите в комнату  и вызывайте полицию ,ну они побежали. А я все махаю этим стулом, а карлики не подходят бояться паскуды, как вдруг сверху, ну то бишь как видимо с потолка, дал мне по затылку и я сразу упал. Нет я не потерял сознания просто упал от неожиданного удара прям по затылку. Лежу прихожув себя, а эти карлики к двери в, котором была моя дочь и жена  посеменили всей толпой. И долго не думая схватил одного за ногу и как начал долбить его по лицу. И как бы друзья его долго просто так не стояли а как на прыгнули и начали кромсать лицо, грудь и руки, даже глаз мне выкалили. Но что характерно в шею не одна паскуда мне не поцарапала, словно просто хотели причинить боль не убивая. И конечно же я вырубился, да здесь сука любой вырубится. Проснулся я уже в больнице, как видимо жена всё-таки успел вызвать полицию. Оглядываясь и здесь заходит полицейский, и сразу начал спрашивать, что с женой и дочкой, поймали ли они карликов, не понравились ли дочка и жена и все в том духе. Полицейский на все ответил, лучше бы не отвечал, лучше бы я вообще умер в тот день. А рассказал он мне вот что.позвонили им в дежурку и заявили о нападении, так они сразу табильная похватали и поехали по адресу. Видят все стекла выбиты, а дверь цела, ну они долгой не думая зашли видят сначала меня изуродованного, и дверь расцарапаную  и открытую, а там боже упаси. Невероятная месива вся комната кровью облита, и в центре комнаты женщина без пол головы, и ещё выпотрошенная. Не одного внутреннего органа не было внутри так и в доме. Ну они ещё раз весь дом обошли провери
