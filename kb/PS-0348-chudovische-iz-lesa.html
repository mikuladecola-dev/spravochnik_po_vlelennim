<script>const BASE="../";const DOCNAME="Чудовище из леса";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Чудовище из леса\n\n*персонаж* · вселенные: 7 островов\n\n## Навигация\n\n- (w0116) Тварь из «Чёрного озера»: около двух метров ростом и в ширину, чёрная шерсть, без шеи, оранжевые горящие глаза, в руке раздавленная голова. Прямой выстрел в морду из двустволки ей нипочём, передвигается бесшумно.\n\n## Связано с\n\nВодяные, Чёрное озеро\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2026-02-08\n\nвселенная: 7 островов (по дате объявления) · окно w0116 · сообщения 430011–430012\n\n*что здесь: появление и полное описание; выстрел охотника не действует*\n\n\n\n```chat\n[430011] 2026-02-08 13:00 Слава: -эй народ! - остановившись прикрикнул запыхавшийся мужик. Имени я его не знаю. Не со всеми успел познакомиться. \n\nКогда всё остановились и посмотрели на мужика. Он продолжил \n- мы что так и будем здесь всю ночь бродите?- \n- ну и что предлагаешью- спросил старик с ружьём. \n-  да обратно идти, что здесь предлагать. Устали уже все. Да и если дальше идти по ночи то и заблудиться можно. Потом хрен от чуда выйдем- сказал мужик. И толпа быстро начало соглашаться. \n- да и если бы. Был кто-то уже нашли. \n-убежал это уже наверное далековато. Так что да лучше домой идти. \n- хорошая идея. Мне ещё свиней кормить надо\n- а точно правильно так отступать. \nБыли конечно те кто хотел продолжить. Ну их было меньшество. Да и они тоже устали и начали согласиться, что всё закругляться надо. \n\nЯ же лишь внутренний ликовала. Пока толпа ещё гудела. Я уже развернулся в обратную сторону, чтобы просто осмотреться. Увидел же я лишь темноту и редко различимый ветки. Как ни странно преставля путь назад ноги загудели. Не куда уже не хотелось идти. Можно просто лечь здесь и поспать. \n\nХрусть... \n\nГромкий и отчётливый звук чего-то хрустнощего, который просто бробирает до костей заставля иснтиктивно по ежится. Я же рефлекторно начал смотреть туда же куда смотреть вглядываясь.  Пока не услышал чавкающий звук сзади. \n\nПовернувшись мужикам я лицезрел картину. Лучи фонаря отчётливо дали увидеть этого. Массивного лохматого зверя стоящий на двух ногах. Нет... Ну он... Как бы.. Я не знаю\n\nКароче это было существо под два метра ростом и также в ширене. Покрытой черной шерстью. Он был без шее. То есть голова и сразу плечи. Глаза его горели оранжоаым огнем. А в своей массивной руке он держал раздавленную голову. И блять всё эти звуки хруста и чавканье от раздавленный головы. \n\nВсё замерло, как будто даже время остановилась в этот блядский миг. Все мужики, который до этого рвались наказать преступника замерли и единственное, что могли это держать лучь фонаря на чудище. Боясь потерять его из виду. Я же замер с толпой и даже моёй дыхания остановилась, я боялся хоть малейшим писком оборвать такой хрупкий мир. \n\nПервым разрушил этот хрупкий и блаженный момент был не пьяный Васька. Не дрожащий словно осиновый листь Мишка. Ни даже чудовища, что изучала нас своими глазами бусинками. Это был старый охотник, что перекинув ружьё стрельно прямо в морду чудовищу. А дальше начался хаос. \n\nЧудовище взревело, давай понять , что даже прямой выстрел голову ему нипочём. И именно его крик стал для нас сигналом. И мы побежали, кто куда без разницы. Мы бежали сбросив фонарики, топоры и вилы. \n\n Я бежал следом за какой то группой мужиков. Но сука я отставал, потому что спотыкался на эти корни. Я падал и сразу вставал и бежал. Шагов чудовища не было слышно, но это ни капельки не радовало. Ведь он также тиха пробрался к нам не издав не звука. Мне было в разы легче когда я его видел и мог хоть как-то понимать, что он будет делать, а сейчас нихрена не ясна. \n\nСпины мужиков всё отдаляються, а в этой густой тьме леса. Я сам вряд ли выбирусь. Можно было бы крикнуть &quot; Эй мужики суки меня подождите&quot; Но сука страшная. Страшная выдать себя, а ещё в горле мерзкая липкая субстанция, что не даёт издать звуков. \n\nБежать бежать бежать. Нет, надо что-то делать если продолжу бежать просто вы бьюсь из сил и заплутаю. Спину мужиков не видать. И звуки бужавших позади тоже не слыхать. Сука. Сука почему я? \n\nЧто делать? Что делать? Можетъ на дерева залесть. Нет он его лёгким движением повалит. Что мне сделать? \n\nПеребирая множества вариантов спасения. Я не почувствовал опоры в ноге и нырнув левой ногой кудато. Я по инерции двинулся вперёд услышав сука знакомый звук.... Хруст.. \n\nСукаа. Больно больно. Настолько больно, что крик просто не может сорваться. В глазах образовались слезы. А ногу жгло и болела. Я не мог собраться, не мог вынуть ногу из этой ямы. Не мог хотя бы восстановить дыхания. \n\nГде-то я гнида слышал, что боль помогает прийти в себя. Ну блять идти те суда давайте это обсудим. Насколько же боль может привести в себя.\n[430012] 2026-02-08 13:00 Слава: Кое-как собравшись глубоко дыша и проклинай весь это недоотряд героем мать его. Я закусив губу достаю ногу. Она же бессильно висит словно культяпка. Ну крове вроде нет. Хотя я хрень знает, не видна не зги. \n\nЯ услышал топот. Чей-то блять громкий топот. Я начал пользти в сторону топота. Взяв ещё по пути плотную ветку. \n\nБлять кто бы ты не был сука помоги. \n\nСпасибо. Мои молитвы услышали бежавший споткнулся и громко стукнулся от дерева. Стона он начал потирать голову. Я же взяв в руки в ноги поползь изо всех сил. И блять нет, не услышали меня боги. Этот бежавший был пьяный, старый Васька, у которого вроде как не всё дома в голове. \n\nВаська услышав шелест травы вызванный моим тасканий своей туши обернулся. Его глаза до этого и так большие, стали ещё больше и чуть не выпали из орбиты. \n\nОн подпрыгнул с места и подбежал ко мне. Схватил меня за руку и бесцеремонно начал тащить за собой. Из-за резкого рывка моя нога до этого находившийся в состоянии покоя извернулась И сотряслась на ветках. Вызывая горячую боль, что волнами разливалась по всему телу. Но это боль была уровня ниже до этого из-за этого крикнул\n- СУКА Стой! - не ожидавший от самого себя крика. Я прикрыл рот рукой. Но блять поздно, всё спалили нас 100 процента. Васька же замер явно не понимая, что же делать. Оглядевшись он всё же принимает какой решений, которым не спешил делиться со мной. А лишь крепче схватил мою руку и начал тащить. \n\nЯ закусил свооболную руку боясь вновь крикнуть. Крепко я вцепился зубами в кисть, что через мгновения в рот полелась горячая жидкость. Но я этого не заметил продолжая кусать себя. \n\nНаконец-то Васька остановился у какой то ямки. И не долго думая скинул меня туда. Не ожидавший это, не выдержал и крикнул. \n\nВаська же не обратив на этой внимание начал забрасывать меня землёй, травой и ветками. Закидав меня он встал отряхнулся, посмотрел на меня и кивнув побежал куда-то. \n\nИ что мне делать? Лежать не двигаться. Легко сказать, а на деле лёжа в неудобной позе. Плюсом до этого незамечаемый холод начал просачиваться через одежду, ну и конечно боль, которая конечно ослабла но не куда неизчезла. \n\nКонечно всё это люто исчезает перед страхом того, что тебя найдёт Это. Ну секунда за секундой, минутой за минутой. Ничего не происходила и разум уже уставший от выброса эмоции начал успокаиваться. \n\nИ так лёжа уже продолжительное время. Ты успокаиваешь и начинаешь думать. \n&quot;Это вообще рельно? &quot;\n&quot;Чудовище в лесу&quot;\n&quot;Хруст и чавканье&quot;\n&quot;Может.. &quot;\n&quot;Если предположить&quot;\n&quot;Я что сошёл с ума&quot;\n&quot;Или это плата за грехи&quot;\n&quot;Но я же не виновен? &quot;\n&quot;Я не хотел &quot;\n&quot;И что дальше&quot;\n&quot;Как я со сломанной ногой дойду до деревни? &quot;\nТысячи мысли, от мала до велика. Начали заполнять голову. \n\nКогда приходит успокоения. Адреналин отступает и да этого отставший от меня &quot;усталость&quot;. С разбегу врезается в моём остывший тела и лишь глубже погружает голову в мысли, чтобы самому не заметить, как сон подкрался и уже давно тебя увёл \n\n........... \n\nКакой прекрасное утро. Птицы поют, а солнце освещает даже этот густой лес. Тёплый лучи солнце согревают и лечат всю усталость. И жёлтая жидкость...... Чего? \n-Какого хрена!!!- выкрикиваю я, поднимая верхную часть тела. \n\nМужчина до этого испражнявшися  на меня, от удивления отскачил и начал застёгивать штаны. \n\n-прости, прости не заметил- начал он говорить. Обезоружена подняв руки. \n\nСкидывая с лица прилипшую землю и листья. Я мелком рассматриваю мужчину. \n\nЭто был высокий и подтянутый мужчина в делай рубашке и в чёрных джинсах. Явно не с деревни. Я конечно не всех там знаю, но такого там явно не было. \n\nЗабыв обо всем, что происходило вчера я попытался встать. И конечно же нога не исцелилась, каким то образом за ночь. И боль прошибло мою макушку. Из-за чего я упал и схватившись за ногу начал даже не орать, а стонать. \n\nМужчина увидевший это. Огляделся и после отойдя подальше подхватил пару крепких веток. \n\n- эй! Не знаю, что произошло но тебе лучше шину сделать. Нога у тебя кажись сломанная- сказал он медленно начал подходит, словно боясь спугнуть. \n\nЯ же схватил ветку и начал махать вокруг себя. С мыслью &quot;может это чудовищя&quot;\n```\n\n## Часть чего\n\nЧёрное озеро\n\n## Неясности\n\n- (w0116) Природа твари не названа; связь с водяными только подразумевается финальной репликой.</div>"}];</script>
