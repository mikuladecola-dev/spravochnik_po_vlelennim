й теперь будет дочерью Имитатора. И я не знаю какие у неё будет цель)\n\nПравителская организации по контролю всех этих. Сильнейшая там девченка что может изменять мир волнами. \n\nЦерковь с паладинами ( мёртвыми рыцарями которых оживил один челик, для верующих) паладины до хрена сильный но их ней движения предсказуемый. Они больше как роботы с повторяющими движениями. \n\nОрганизация челика который и оживил паладинов. Давай челика назовём Виктор. Ну и Виктор верит в красный ток что оживляет людей. И он многих оживил, но разум так и не смог в них оживить \n\nПернатые (Серафим, Пераги и кто-нибуть ещё) \n\nТак же появиться орден предназначеный для убийства котов.\n\nВампиры просто аристократы. \n\nАскизы. Матка Аскизов стало предметом веры для какой-то верологий.\n[385769] 2025-11-17 09:52 Слава: Ну и Аскизы. Я не знаю где они живут\n```\n\n### Версия 2 — 2025-12-06\n\nвселенная: Оам (объявлено) · окно w0112 · сообщения 393286–393290\n\n*что здесь: Введена: паладины — мёртвые рыцари, оживлённые для верующих, сильные, но предсказуемые, как роботы*\n\n\n\n```chat\n[393287] 2025-12-06 17:36 Слава: Коты. Их 9.они сильнеший ( уникальный особенности, я для них не придумал помоги) и вот они есть в каждую эпоху. Если один кот умрёт родиться новый и всегда их будет 9. Они вообще никуда не вмешиваться \n\nАпостолы 21 вторая по силе раса на земле (опять раса, в мире есть просто индивиды который могут быть сильными). Апостолы очень часто устраивают без порядок разрушая укорененый баланс между всеми. Из-за них по итогу в современном мире раскроется существования тёмный изнанки но это будет в будущем в будущем \n\nНу и дальше расы и организации который равны по силе с друг другом. \n\nДети мирового древа. Живут в мести которой мутировала от Оам. \n\nПроротой каменный челике. Владеют преступное организацию. Некий союз с апостолами \n\nАзуриэль. Как народ что прячется от цивилизации. Но некоторый всё же живут среди людей \n\nГруппировка сестры ( который теперь будет дочерью Имитатор
