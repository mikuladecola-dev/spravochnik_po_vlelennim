<script>const BASE="../";const DOCNAME="Эксперимент Доимы: дыра между мирами";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Эксперимент Доимы: дыра между мирами\n\n*история* · вселенные: неясно\n\n## Навигация\n\n- (w0121) Доима хватает фантазёра на грани провала и артефактом открывает из его мира дыру в центр города, охраняя его как ключ; столпы эвакуируют людей и бьются с десятками тысяч существ. Цель — проверить, можно ли объединить миры.\n\n## Связано с\n\nДоима (дочь Имета), Изб, Нуар, Фантазёры и провал в свой мир\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2026-06-07\n\nвселенная: неясно (по дате объявления) · окно w0121 · сообщения 488439–488440\n\n*что здесь: описан ход инцидента: тьма Нуара на 3 км, затем чёрно-белый мир, участие Изба, Праведника, Кледа и Графа; эксперимент не удался, но Доима довольна и продолжит опыты*\n\n\n\n```chat\n[488439] 2026-06-07 19:14 Слава: Давай изменим возраст апостолов теперь им за 40.\nЗвездочёт живёт отдельно от родителей, да и под бинтами не особо видно изменение. Не видно старый он или нет. \nАгрегат уехать путешествовать. Но когда будет возвращаться домой. То будет отшучиваться, типа гены у него хорошие. Родителем граф вобще пофиг ( только они желают что бы он поскорее дал потомство из-за его способности) \nДочь имета. (Доима) \nУ имитатора в подростковом возрасте была мелкая интрижка о которой он забыл. Он и не знал, что та девушка забеременила, поэтому он без беспокойство покинул данный город. \nНимб захватили девушку которая  была беремена от Имета. Им было интересно унаследует ли ребёнок апостола его способности. Время шло ребёнок родился. А мать к сожалению умерла. А над ребёнком начали проводить всяческий эксперименты дабы выявить если у неё особенности апостолов. По итогу когда ей исполнилось восемь лет, ученный сдались и больше не тестировали её. Но и девочку нужно было куда-то девать. Возраст уже вышел и проводить над ней эксперименты бесполезно. Поэтому они просто решили взрастить сотрудника, у них и так нехватка кадрова была. \nОна выросла и является сотрудничей Нимба. Но она так и осталась ребёнком, что мечтает о нормальной семьи. Она всё ещё та маленькая девочка что была заперта в белой комнате, читая книжки и мечтая о семье. И при этом весь этот мир ей кажется отвратным.\nПоэтому её цель воплотить свой мир. С родителями. Она любит Имета считая его единственным дорогим и родным человеком. \nУ неё своя организация ( это конечно громко сказано, там просто несколько сл и ис), о которой нимба неизвестно. \nТакже она произвела один эксперимент. Схватив одного фантазера, что был на грани провалиться в свой мир. Она использовав артефакт. Открыла путь из мира фантазера в наш. И открыла она его в центре города ( ей не нравится этот мир) и со своей группой защищала фантазера, что был ключом, что держит дыру открытой. Пока столпы героев пытались вывести людей и сражались существами, что вылезли из другого мира ( некоторый из этих существ были очень сильными, и их также была десятки тысячи) поэтому в тот день сначала поглотила тьма нуара. (Которой с помощью тьмы спасал граждан, убивал монстров и помогал другим героем, в радиусе 3 км, при этом и сам сражался с достаточно сильным существом и также пытался убить фантазера, которого очень сильно защищали ) после мир окрасился черно белый и Карен начала вести ещё большую поддержку. Там вообще всё столпы участвовали. Там и Изб летал, спасал людей и бился с разными чудовищами. И праведник был, и Клед с графом. \nСуть этого эксперимента была, можно ли объединить миры. Хотя он и не удался, доима осталась довольной результатом. После она также будет проводить мелкие и большие эксперименты. А в конце ну ты знаешь что будет.\n[488440] 2026-06-07 19:14 Слава: Имет кода узнаете что у него дочь. Он не будет с ней драться или мешать ей он просто поговорить с ней по душам. \nПо итогу Доима предложит имет стать союзникам, и создать тот мир где они вместе с матерью будут вместе, как и должно быть. Имет сперва отказывается ему это не особо интересно. Но узнав что Доима поглотили камень желания ( она и до камня желания была сл) помогает. Точнее делает всё возможное чтобы её никто не убил попутно исследуя её организм и ищет лекарство против камня желания. Доима же от заботы и беспокойство отца лишь больше утверждается изменить этот мир, чтобы отец был всегда рядом, как сейчас и чтобы у неё была мама.\n```\n\n## Часть чего\n\nДоима (дочь Имета)\n\n## Неясности\n\n- (w0121) Клед и Карен названы вскользь, отдельного описания в окне нет.</div>"}];</script>
