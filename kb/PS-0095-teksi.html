ма восстанавливается либо это рано остаётся навсегда\n```\n\n### Версия 2 — 2024-06-21 · повтор прежней мысли\n\nвселенная: 7 островов (по дате объявления) · окно w0038 · сообщения 184996–185003\n\n*что здесь: карточка переслана заново для разбора по новым категориям*\n\n\n\n```chat\n[184996] 2024-06-21 09:46 Слава: Хочешь можем разобрать под этим категорий 2 персов\n[184997] 2024-06-21 09:46 Слава: ?\n[184998] 2024-06-21 09:47 Миколай: Го\n[185000] 2024-06-21 09:47 Слава: Магнетик т.п.\nМужчина 20 лет способности магнетизм \nИнструмент: большой железный меч ( как у берсерка) ему его легко контролировать пулять его и летайте на нем \nОружие: 10 клинки  он использует их для отвлечения или если много слабых целей, так как скорость и убойность у них в разы меньше инструмента \nМеч на поясе лёгкий и тонкие что бы им сражаться так как свой инструмент он почти всегда держит воздухе \nЖелезный перчатки и ботинки с помощью магнетизма усиливает их из-за этого удара в разы сильней\nФирменный прием: сложить пальцы круг и через него пустить нож давая ему невероятной ускорения ( минус он очень не меткий поэтому прием использует лишь в ближе )\n[185001] 2024-06-21 09:47 Слава: Температура т.п.\nМужчин лет 17 \nСпособности: повышение температуры \nИнструмент: тонкие меч ( он его нагревает до невероятных высот из-за этого, он как будто лазерный меч)( также он использует способности не только для нагревания инструмента но и чтобы убить человека или чтобы расплавить другие предметы( расплавить сверхчеловека будет тяжело или невозможно))\nТакже его фирменный приемы нагревания воздуха до невероятных высот заставляет воздух буквально взрываться ( сам может получить урон)\n[185003] 2024-06-21 09:47 Слава: Каво выбираешь?\n```\n\n### Версия 3 — 2024-06-21\n\nвселенная: 7 островов (по дате объявления) · окно w0038 · сообщения 185040–185046\n\n*что здесь: полная карточка: имя Текси, любит яблоки и брата (как брата), не любит толпы и жару, статы (сила 10, скорость 5,5, ловкость 6, выносливос нённую зону сгорают или плавятся, а у оружия появляется наружняя аура добовляющая урон. Не очень затратная на самом деле способность, но зато очень эффективная и выглядит красиво пхех\n\nЧерта характера: любопытный парень, со стороны кажущийся сумасшедшим и не тем что делает странные шумные выходки, а тем, что делает тихие личные эксперименты и прикольчики. Обожает наблюдать за природой и общаться со взрослыми, набираться опыта. Не любит кушать, а если и кушает что-то, то только в сыром виде, все равно он никогда не заболеет и не подхватит паразита, так как в его теле такая температура при которой никто не выживет, да и еда внутри уже готовится\n```\n\n### Версия 4 — 2024-06-21\n\nвселенная: 7 островов (по дате объявления) · окно w0038 · сообщения 185057–185079\n\n*что здесь: правка статов после спора про скорость и ловкость*\n\n\n\n```chat\n[185057] 2024-06-21 10:30 Слава: Я думал ты сделаешь упор на скорость, у него же типа смертельный атаки и &quot;лазерный меч&quot;\n[185058] 2024-06-21 10:31 Миколай: Бля есть же ещё скорость 😅\n[185060] 2024-06-21 10:31 Слава: Ну типа ловкость и скорость одно и тоже\n[185061] 2024-06-21 10:31 Слава: Или не ?\n[185062] 2024-06-21 10:32 Слава: Ладно не ,добавь скорость и я добавлю\n[185063] 2024-06-21 10:32 Миколай: Ну я считаю иначе. Ловкость это способность уклоняться от препятствий, выбираться из любой хуйни. А скорость ну это то насколько быстро перемещается\n\n\nЯ должен был это прокомментировать, да.)\n[185064] 2024-06-21 10:33 Слава: 7\n[185065] 2024-06-21 10:33 Миколай: Да\n[185066] 2024-06-21 10:34 Миколай: Я не хочу всё-таки его делать очень быстрым\n[185067] 2024-06-21 10:34 Миколай: Типо ты часто переживаешь за баланс и как по мне в таком случае не стоит в самом начале всех делать имбовыми\n[185068] 2024-06-21 10:35 Миколай: Надо дать им и будущим персам потанцевал\n[185069] 2024-06-21 10:35 Слава: Да уловил\n[185070] 2024-06-21 10:35 Слава: И изменил статы\n[185071] 2024-06-21 10:35 Миколай: Что?\n[185072] 2024-06-21
