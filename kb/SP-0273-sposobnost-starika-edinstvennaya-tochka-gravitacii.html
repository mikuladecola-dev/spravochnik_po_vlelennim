const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Способность старика: единственная точка гравитации\n\n*способность* · вселенные: неясно\n\n## Навигация\n\n- (w0121) Сначала М восстанавливает её как «менять массу объектов», С поправляет: суть в том, что для объекта существует лишь одна точка гравитации. Дальше разбираются сценарии привязки камня к человеку, к зданию и к пёрышку.\n\n## Связано с\n\nСтарик (обладатель гравитации)\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2026-06-02 · повтор прежней мысли\n\nвселенная: неясно (по дате объявления) · окно w0121 · сообщения 487194–487209\n\n*что здесь: первый вариант по памяти: изменение массы объекта (увеличение до плотности горы, обнуление, отрицательная масса)*\n\n\n\n```chat\n[487194] 2026-06-02 12:52 Слава: Можешь описать его способность?\n[487195] 2026-06-02 12:52 Слава: А то я под забыл и нигде даже не написал\n[487196] 2026-06-02 12:53 Миколай: так\n[487197] 2026-06-02 12:53 Миколай: я тоже подзабыл\n[487198] 2026-06-02 12:53 Миколай: нахуй\n[487199] 2026-06-02 12:53 Миколай: щас\n[487200] 2026-06-02 12:53 Миколай: бля нет не знаю\n[487201] 2026-06-02 12:53 Миколай: помню мы долго изучали\n[487202] 2026-06-02 12:55 Миколай: так\n[487203] 2026-06-02 12:55 Миколай: способность менять массу объектов\n[487204] 2026-06-02 12:56 Миколай: щас уточню\n[487205] 2026-06-02 12:58 Миколай: Вы увеличиваете массу камня до огромных значений: Если сделать обычный булыжник тяжелее целой горы (при тех же размерах), он станет невероятно плотным. Он начнет заметно притягивать вас и все предметы в комнате к себе. Если вы бросите его, он не просто упадет, а пробьет пол, фундамент и устремится к центру Земли, сокрушая всё на своем пути.\n[487206] 2026-06-02 12:58 Ми  Если вы стоите неподвижно рядом, камень зависнет в воздухе, как в невесомости на МКС.\n​Включается ваша гравитация. Вы весите условные 70–80 кг. Ваша гравитация невероятно слаба, но теперь она — единственное, что управляет камнем.\n​Медленное сближение: Камень, висящий в воздухе, начнет едва заметно, со скоростью долей миллиметра в час, дрейфовать в вашу сторону. Через несколько часов или дней (если вокруг нет ветра, который его сдует) он мягко прилипнет к вашей ноге или руке.\n​Вы — его Солнце: Если вы начнете бегать вокруг него, камень будет оставаться на месте (ведь сила Земли на него не действует), но ваши гравитационные волны будут плавно разворачивать его в вашу сторону. Вы станете для него центром его личной Вселенной.\n[487214] 2026-06-02 13:03 Миколай: если например он станет точкой гравитации для камня\n[487215] 2026-06-02 13:03 Слава: Красавчик\n[487217] 2026-06-02 13:05 Миколай: Вы выделяете камень и настраиваете в редакторе: «Игнорировать гравитацию Земли, Солнца и всего космоса. Притягиваться ТОЛЬКО к этому конкретному зданию».\n​Вот как это будет выглядеть:\n​«Вертикально» станет «горизонтально»: Поскольку Земля больше не тянет камень вниз, для него понятие «низ» исчезает. Зато колоссальная масса бетонного или кирпичного здания (скажем, тысяч 50 тонн) станет для камня новой «Землей».\n​Камень «упадет» на стену: Если вы держите камень в руках в 10 метрах от стены и отпустите, он не упадет на асфальт. Он полетит вбок и с глухим стуком врежется в стену здания.\n​Катание по стенам: Если вы положите камень на крышу, он покатится к тому краю, где под ним больше всего массы здания. Если вы бросите его под углом, он будет «падать» вдоль стены дома, пока не застрянет в каком-нибудь архитектурном выступе.\n​Сила удара: Вес здания всё же намного меньше веса планеты Земля. Поэтому камень полетит к стене не со скоростью пушечного ядра, а довольно лениво и плавно (ускорение будет крошечным), но траектория будет строго горизонтальной — прямиком к бетону.\n[487218] 2026-06-02 13:05 Миколай: вот это круто\n[487219] 2026-06-02 13:05 Миколай: типа условно бой в городе\n[487220] 2026-06-02 13:05 Миколай: точка гравитации здание\n[487221] 2026-06-02 13:05 Миколай: между стариком и зданием чел какой-то, в руке камень\n[487223] 2026-06-02 13:05 Слава: Да и он этот обладатель способность будет как бы столпом злодеев\n[487225] 2026-06-02 13:06 Миколай: даже кидать не надо, камень сам летит, не падает на землю а с постоянной силой давит\n[487227] 2026-06-02 13:06 Миколай: он должен был быть столпом злодеев\n[487229] 2026-06-02 13:06 Миколай: или ты сейчас так решил\n[487233] 2026-06-02 13:09 Миколай: Сценарий 2: Камень привязан к пёрышку (как к единственной точке опоры)\n​Это самый экстремальный вариант. Вы настраиваете булыжник так, что его притягивает только маленькое пёрышко, летящее рядом в воздухе. Вес пёрышка — сотая доля грамма. Вес камня — например, 5 килограмм.\n​В этот момент в игру вступает Третий закон Ньютона (действие равно противодействию) и концепция центра масс.\n​Кто кого притянет? Гравитация — штука взаимная. Камень притягивает пёрышко, а пёрышко притягивает камень с абсолютно одинаковой силой. Но поскольку камень весит в миллионы раза больше, пёрышку гораздо легче сдвинуться с места.\n​Мгновенный полет перышка: Пёрышко буквально «катапультируется» в сторону камня и прилипнет к нему за долю секунды.\n​Что произойдет с камнем? Поскольку Земля на камень больше не действует, он зависнет в воздухе (невесомость). Крошечная гравитация пёрышка потянет 5-килограммовый камень на себя, но эта сила настолько мизерная, что камень сдвинется в сторону пёрышка всего на нанометры.\n[487234] 2026-06-02 13:09 Миколай: как вариант можно так\n[487235] 2026-06-02 13:09 Миколай: Да, именно так! Для вас этот пятикилограммовый камень стал бы абсолютно невесомым.\n​Если бы вы подошли к нему, пока он висит в воздухе, вы смогли бы сдвинуть его с места легким щелчком пальца или просто подув на него. Для вашей руки он ощущался бы как пустой возду
