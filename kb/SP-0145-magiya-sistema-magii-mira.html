8] 2024-12-23 15:27 Миколай: еще нагия света сука\n[273399] 2024-12-23 15:27 Миколай: тогда тьса\n[273400] 2024-12-23 15:27 Миколай: да\n[273401] 2024-12-23 15:27 Слава: Так он не сам её не использует это артефакт просто светиться и все\n[273402] 2024-12-23 15:28 Миколай: ну типа и свет и земля мощные а остальные средние\n[273403] 2024-12-23 15:28 Миколай: он у меня такой\n[273404] 2024-12-23 15:28 Миколай: имбаланстный\n[273405] 2024-12-23 15:28 Слава: То бишь он вообще всеми базовыми элементами владеет\n[273406] 2024-12-23 15:32 Слава: Кстати магии света дофига редкая так как принцип света в той время не кто не знал\n```\n\n### Версия 4 — 2024-12-24\n\nвселенная: неясно (по дате объявления) · окно w0068 · сообщения 273913–273917\n\n*что здесь: Порядок обучения: сначала одна из базовых стихий, только потом её ответвления — магии дерева нельзя учиться, не выучив магию земли, «как в аватаре»*\n\n\n\n```chat\n[273913] 2024-12-24 14:18 Слава: Ладно\n[273914] 2024-12-24 14:18 Слава: Для начала\n[273915] 2024-12-24 14:20 Слава: Базовый стихий это владением одной из 4 стихий \nИ после только изучение одной из базовой стихий мы можешь изучить другйи отвлетленние магии \nТипо ты не можешь сразу начать учиться магий дерева для тебя сначала надо научиться магии земле а потом только магии дерева \nНу то бишь как в аватаре\n[273916] 2024-12-24 14:23 Миколай: ок\n[273917] 2024-12-24 14:23 Миколай: но в грехах это базовое подразумевается, такова природа греха\n```\n\n### Версия 5 — 2024-12-25\n\nвселенная: неясно (по дате объявления) · окно w0068 · сообщения 274518–274526\n\n*что здесь: Жёсткие ограничения при балансировке: благословение у человека бывает только одно; нельзя давать персонажу много базовых стихий; заклинания делятся на почти мгновенные и требующие времени*\n\n\n\n```chat\n[274518] 2024-12-25 09:17 Слава: Лучше вообще с нуля начать\n[274519] 2024-12-25 09:17 Слава: Во первых благословения бывает только одно у человека\n[274520] 2024-12-25 09:18 Миколай: он эльф\n[2
