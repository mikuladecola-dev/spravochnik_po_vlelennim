Никуда не ушли. Хоть и ослабли после того, как я потрогал и ощутил своё новое лицо. И этот идиотский коридор с множеств дверей, когда нибудь закончится? \n***\nДальше особо ни-че-го интересного не было. Мы бродили по коридорам иногда посещая некоторые комнаты. Например библиотеку, кухню и пару залов. Сам интерьер, здесь как и ожидалось был средневековым. Разные узоры, где попало и не экономия пространства. Был только один большой плюс. Невероятная мягкий ковры. Мне захотелось снять обувь и пройтись по этим коврам. Ну я как достойный человек сдержался. Я и так уже веду себя подозрительно. \nМоя черноволосая служанка по моей просьбе рассказала упрощённый вариант истории королевства Пиор. \nЭтой информации мне хватило, чтобы понять, что это за мир. \nУдивительно, нет- это восхитительно. Я лютый грешник попал в тот самый лучик света. В ту б сказку о герой справедливости, что борется со всем злом на свете. \nЯ едва сдержал возбуждение. Даже если это сон, даже если это бред. Нужно увидеть героя. \nСамая мысль о том, что я его увижу, того самого. Заставляло моей сердце биться сильнее. \nДержась за колотишься сердце в саду. Я одной рукой опирался на фарфоровую скульптуру. \nСлужанка же стоял рядом со мной. Держа в руках стакан воды, который она достала из неоткуда. \n- да ты нечто - переводя дух продолжил я. \n- будь конкурс лучшей служанки. Ты бы заняла первое место- служанка на все мои пышные комплименты лишь кивнула головой. \n-господин скоро будет ужин- \nЯ посмотрел на небо. И правда Солнца уже садиться. И я до сих пор не проснулся. Хорошая новость. \nНо снова идти по этому лабиринту называемая особняком, до тошноты не хотелось. \nТемная комнатушка уже казалось куда более заманчивой. \n-тогда принеси ужин в мою ком.....в мои покои- махнул рукой отвечая. Служанка не ответила, заколебалась что-ли ? \n-извините господин. Но вы ужинает вместе с графом и графиней- \n&quot; Нет я собирался так рано встречать графа и графиню&quot; Я же даже не знаю каким был Дионис. \n-скажи,
