<script>const BASE="../";const DOCNAME="Страх";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Страх\n\n*2025-12-09 · Феня · второй, переписанный черновик того же фрагмента; обрывается на том же месте*\n\n---\n\n\n\n```chat\n[394532] 2025-12-09 09:55 Слава: Страх\n\n\nДа именно страх поглотил моей сознания. Руки дрожали, хоть я пытался это скрыть. Меня отправляли на войну. Меня, сына дворянина. \nНе куда-то в тыл или в штаб. И даже не на спокойную точку, а на передовую. В одну из самых опасных мест, на передовой. На осаду крепости, где пролилось уже литр крови. \nЯ Бенжимен Бэнуар первенец и ближайшее на замену отцу дворянина. Сейчас еду в трясущиеся карете и едва заметна дрожу держа меч в руках, как оберег. \nМоей взгляд был устремлён на мешок попыхах забитыми моими вещами , что покачиваясь туда сюда. \nБэнжимен потерял счет времени. Для него время было бесконечным и при этом мигом. Весь его мир был в этой карете. Внутрь проникали звуки пение птиц, и звуки насекомых. Но где-то там далеко. \n В  голове же был лишь один вопрос\n &quot; Почему??? &quot; Хотя он прекрасно знал ответ. Его отец граф не скрывал неприязнь ко мне. Да и новая супруга графа и их дети, тоже могли сыграть роль. \nНо он пытался об этом не думать. Ведь это все же его семья.\nНа графа ему было наплевать, также как и графу на него. Он просто надеялся, что мачеха не могла этого сделать. \nКто угодно только  не она. Его уверенность с каждой минутой тускнело. Слышав множеств истории, как новый жены избавляется от детей бывших жен. Эта мысль была ужасна. \nОн бы мог сбежать. Выбить дверь, спрыгнуть с кареты и побежать в сторону леса исчезнув. Но он не мог. Всю жизнь воспитанный, как благородный дворянин, он даже дрожь пытался скрыть. \nВремя же было неумолимо. И вот он стоял в ширинку с другими молодыми парнями. Многие из них дрожали, а некоторые плакали. Этот фронт славился высокой смертностью. \nЛишь Бенжимен не дрожал. Стоял ровно, а лицо было словно фарфоровая маска, холодное и невозмутимое. Но это лишь внешний. Внутри же он дрожал, кричал и хотел сбежать. \n&quot;Может все же сбежать&quot; Нет, он отгонял такие мысли. \n&quot;Уже поздно, я уже здесь и попытка сбежать лишь бы развязала руки всем недругам и солдатам. Отец в теории мог заказать моей убийства даже здесь, как он делал и раньше и единственное, что возможно их сдерживает это свидетели &quot; После этой мысли Бенжимен немного успокоился. Скорее это можно назвать смирением. \nС палатки вышел грозный мужчина. Его лицо было покрыта шрамами, а глаза были твердыми и холодными. Было видно, что этот мужчина пережил много сражений. И даже сам его вид вызывал тревогу в сердцах новобранцев. \nОн твердо шагал и рассматривал дрожащих новобранцев. Цокнув про себя он глубоко выдохнул. \n&quot;Серьезно, нам на помощь зелёный щенков послали, что даже не разу не убивали&quot; Он прекрасно понимал, что сейчас нехватка людей. Но и не мог смириться с тем, что этих новобранцев сюда посылали на убой. Лишь из-за того, что сюда повышают новобранцев, здесь высокая смертность. \nВсе эти мысли бесполезный, сколько он не жаловался. Его никто не слушал. \nРассматривая не уверено стоящих юношей, у большинства которых опухли  глаза. Взгляд остановился на г\n```</div>"}];</script>
