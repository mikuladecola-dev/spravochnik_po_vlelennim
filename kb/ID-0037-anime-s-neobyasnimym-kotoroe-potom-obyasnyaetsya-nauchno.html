const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Аниме с необъяснимым, которое потом объясняется научно\n\n*идея* · вселенные: неясно\n\n## Навигация\n\n- (w0026) Замысел Миколая на фоне разговора о вере и науке: создать в аниме нечто неизвестное, несуществующее и необъяснимое, вырастить вокруг этого субкультуру и фанатиков, а потом разом объяснить всё научно. Слава отвечает, что под это нужен крутой сюжет; дальше разговор уходит в разговоры о практике и лагере.\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-02-29\n\nвселенная: неясно (по дате объявления) · окно w0026 · сообщения 121919–121946\n\n*что здесь: идея названа целиком: неизвестный феномен в аниме, субкультура фанатиков вокруг него, финальное научное объяснение как розыгрыш над зрителем*\n\n\n\n```chat\n[121919] 2024-02-29 17:45 Слава: Ты веришь что в мире есть что никогда нельзя объяснить наукой\n[121920] 2024-02-29 17:45 Миколай: Не верю\n[121921] 2024-02-29 17:45 Миколай: Верю в то что все можно объяснить с научной точки зрения\n[121922] 2024-02-29 17:45 Миколай: Типа, так интереснее\n[121923] 2024-02-29 17:45 Миколай: Хех\n[121924] 2024-02-29 17:46 Миколай: А ты?\n[121925] 2024-02-29 17:46 Слава: Тоже самое\n[121926] 2024-02-29 17:46 Миколай: Однако хочется создать\n[121927] 2024-02-29 17:46 Миколай: Что-то необъяснимое\n[121928] 2024-02-29 17:46 Слава: В каком смысле\n[121929] 2024-02-29 17:46 Миколай: Поэтому лезу в стезю аниме\n[121930] 2024-02-29 17:46 Миколай: Хочу крч такой прикол\n[121931] 2024-02-29 17:47 Миколай: Типа создать в аниме нечто неизвестное\n[121932] 2024-02-29 17:47 Миколай: Не существующее и необъяснимое\n[121933] 2024-02-29 17:47 Миколай: И типа субкультуру наплодить\n[121934] 2024-02-29 17:47 Миколай: Фанатиков\n[121935] 2024-02-29 17:47 Миколай: А потом бац\n[121936] 2024-02-29 17:48 Миколай: И объяснить все научно\n[121937] 2024-02-29 17:48 Миколай: Бугага\n[121938] 2024-02-29 17:48 Миколай: Угарно звучит\n[121939] 2024-02-29 17:48 Миколай: Люблю такие эксперименты\n[121940] 2024-02-29 17:48 Слава: Но там сюжет нужно крутой сделать\n[121941] 2024-02-29 17:48 Миколай: Ну, все гениальное просто\n[121942] 2024-02-29 17:49 Миколай: Главное сейчас блин практиковаться\n[121943] 2024-02-29 17:49 Миколай: Чтобы руку набить\n[121944] 2024-02-29 17:49 Миколай: Чтобы на практике уметь идеи воплощать\n[121945] 2024-02-29 17:50 Миколай: А то я многое будто знаю и умею, но когда дело приходит действовать я оказывается обычный смертный и даже хуже\n[121946] 2024-02-29 17:50 Миколай: Надо блин заниматься мне\n```\n\n## Неясности\n\n- (w0026) прозвучало и заглохло: ни сюжета, ни мира, ни персонажей вокруг не появилось</div>"}];</script>
