<script>const BASE="../";const DOCNAME="Дмитрий Рутковский («Агрегат»)";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Дмитрий Рутковский («Агрегат»)\n\n*персонаж* · вселенные: Апостол\n\n## Навигация\n\n- (w0080) Апостол с кодовым прозвищем «Агрегат». Засёк всплеск энергии, нашёл деревню и тело Антона, физически подлатал его, объяснил про брата и предложил два пути: обычная жизнь под слежкой или служба агентом. Подробное описание внешности и хищного взгляда дано глазами Антона.\n\n## Связано с\n\nАнтон Смирнов, Апостолы, Благословенные\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-03-13\n\nвселенная: Апостол (по дате объявления) · окно w0080 · сообщения 301808–301809\n\n*что здесь: Появление: внешность, представление, снимки мозга, выбор из двух путей, три дня на ответ*\n\n\n\n```chat\n[301808] 2025-03-13 13:21 Слава: -оу ты как? -сказал мужчина сидящий на стуле. Придя в себя я пригляделся к нему. И сука красивый гнида. Атлетическая сложенная тела. Даже сквозь одежду видны мышцы. Одет в кожуху, который байкеры носят. А ещё перчатки без пальцев и в джинсах черных. А лицо симметрический правильная, с острыми углами. Губы нежный и при этом притигательный, а брови ровный. Глаза словно у хищника острый. Причёска короткая словно только с армией, волосы черный. Но даже так гнида красивая. А взгляд. Это нечто. Смотрит так словно выебыть готов, таким с хищным взглядом, что в дрожь бросает. А ты не против если он тебя выебет или убьёт вообще. И с таким, с спокойном нежном голосом говорит\n-не волнуйся. Я тебе всё объясню. Только сначала ответь на вопрос, что ты помнишь, а я потом дополню. Хорошо?- улыбнулся,  нежно улыбкой. Похожая была у бабушки. \n-Ладно? -как то нерешительно ответил я. И рассказал, что со мной произошло и что сказал старик. Конечно опустив про альтро-эго. И он внимательная меня слушал, не отвлекаясь. Мне даже стало стыдно, что я так неточно и заикась на каждом слове. И в конце я спросил его. \n-а вы вообще кто? -слегка нерешительно спросил я \n-а прости забыл преставиться. Я Дмитрий Рутковский или можно просто Дима. Кодовая прозвище &quot;агрегат&quot;. И я апостол, тот самый, которого по твоим словам ненавидит старик-сказал Дима. А у меня в голове летала лишь одна мысль. Почему &quot; Агрегат&quot;? И сука интересно стало почему? Но спрашивать как-то стыдно. \n-а ты у нас Антон Смирнов. Правильно? - продолжил Дима. А я испугался. Откуда он знает. \n-да- как то нерешительно ответил я\n-тогда во-первых. Именно я засек, огромный сплеск энергии, и обнаружив в деревню и твоё тело. Я его подлатал физический. Поэтому меня не надо бояться или дрожать. Хорошо? -улыбнулся доброжелательной улыбкой. А у меня возник вопрос. Почему проснувшишь я его не испугался? Это из-за его чарующих глазок. Или эта чёрта всех благословенный. \n-и во-вторых у тебя наверняка возник вопрос,  как ты выжил? - сказал он. А я понял, что об этом даже не думал\n-у тебя же наверное есть альтро-эго, не так ли? - сказал он и увидив мой удивленой лицо пропродолжил\n-смотри- протягивал мне снимок мозга.\n-а простите конечно, но я не врач и не понимаю, что здесь- честно ответил я\n-тогда вот посмотри на этот снимок нормального человека и сравни со своим- протягивает второй снимок. Я посмотрел пытаясь найти отличие. И я испугался. Я увидел на своём снимки какой-то кусок, которого нет на другом снимке и чутли не прокричав сказал\n-у меня опухоль!? - он улыбнулся, и мягким тоном сказал\n-быстро ты нашёл. Мог бы итди на врача учиться. Но нет,это не опухоль, а кусочек чужого мозга. А точнее твоего брата- я задрожал, какого хера, здесь блять творится \n-КАК! - крикнул я \n-спокойне я всё объясню. Такой бывает редко когда две ячейклетки сливаються в одну. Но такие случие всё равно есть. Скажи ты когда-нибудь терял контроль над телом? - я пытался вспомнить, и да
