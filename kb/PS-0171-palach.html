<script>const BASE="../";const DOCNAME="Палач";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Палач\n\n*персонаж* · вселенные: 7 островов, Апостол, Оам\n\n## Навигация\n\n- (w0066) Упомянут в перечне сильнейших вместе с Имитатором, Нуаром и Смотрящим — С спрашивает, какой у них уровень силы. В этом окне не раскрыт.\n- (w0073) Четвёртый номер команды против Серафима, ранее числился в реестре благословенных. Быстрейший в пати, бьёт по жизненно важным точкам, оружие — катана.\n- (w0097) Осколок сознания Александра, ставший самостоятельным. Впервые появляется в видении безумия (328115), потом преследует героя всю историю и в финале начинает выбираться в реальный мир (328132–328133).\n- (w0108) Апостол, названный сильнейшим в ближнем бою; упомянут как образец стиля, который имитируют государственные Палачи.\n- (w0120) Один из апостолов, цепной пёс Ассоциации — точнее, Ассоциация так думает. Тихо убивает всех неугодных, героем не числится. В ближнем бою почти сильнейший. Вместе с Графом — сильнейший из апостолов.\n\n## Связано с\n\nАгрегат, Александр Титовский, Апостолы, Ассоциация, Воительница, Граф, Звук таскания топора по бетону, Имитатор, Нуар, Палачи, Серафим, Смотрящий, Уровни сил 1-10, Шут с огоньками надежды\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-12-13\n\nвселенная: 7 островов (объявлено) · окно w0066 · сообщения 269818–269824\n\n*что здесь: имя названо в списке сильнейших*\n\n\n\n```chat\n[269818] 2024-12-13 18:18 Слава: А и вопрос какой уровень сил ты представляешь у среднетического персонажа\n[269819] 2024-12-13 18:19 Миколай: а женщина это человек?\n[269820] 2024-12-13 18:19 Слава: И сильнейшего виде Имитатора и Палача, Нуара, смотрящего \nКакой уровень силы у них по твоему\n[269821] 2024-12-13 18:19 Слава: Да 😉\n[269822] 2024-12-13 18:20 Миколай: ну вводить четкие уровни силы идея сложная кнш\n[269823] 2024-12-13 18:20 Слава: Не примерно\n[269824] 2024-12-13 18:20 Слава: Да ито она наверное не раз смениться\n```\n\n### Версия 2 — 2025-01-28\n\nвселенная: Апостол (по дате объявления) · окно w0073 · сообщения 285353–285369\n\n*что здесь: Расписан: быстрейший, все атаки нацелены на жизненно важные точки; способность — сжатие (сжимает пространство, чтобы сократить дистанцию, сжимает атаку противника, сжимает ауру и делает слэш); оружие — катана.*\n\n\n\n```chat\n[285353] 2025-01-28 19:01 Слава: Ладно сейчас я запишу персонажей который будут противостоять ему ты в нейрону скинушь?\n[285354] 2025-01-28 19:02 Миколай: хорошо давай\n[285363] 2025-01-28 19:29 Слава: Они будут сражаться командой против Серафима \n1) Воительнтца. Имеет огромную физическую силу и очень крепка, но скорость  на среднем уровни \nЕë способность контроль над массой, размером и плотностью, но только на себе или на неживых объектов \nУ неё есть оружие оружейный браслет- это браслет на котором висят разный холодный орудия, которая она сможет увеличить и сделать плотней \n2) Агрегат. Имеет средний показатель, но достаточно быстрые Воительницы \nЕго способность менять агрегатной состояния неодушевлённых объектов, он может сделать прочным воздух или землю превратить в воду \nНе имеет орудия, точнее сам его создаёт из воздуха за счёт этого оно почти невидимая \n3) Имитатор. Самый живучий среди них при этом прочность у него ниже чем у Воительницы. \nЕго способность имитировать способность врага, но лишь одну способность и то ему надо время, но плюс способность в том что он конечно имитирует но способен будет еë развить \nОружие у него жидкость который моментально может принять любую форму \n4) Палач. Быстрейший в этой пати, его всё атаки нацеленый на жизненный важный точки противника \nЕго способность сжатия он может жать пространства чтобы приблизится к противнткк, или сжать атаку противника. Он также может сжимать ауру и делать слэш \nЕго орудия катана\n[285369] 2025-01-28 19:35 Миколай: https://telegra.ph/boi-01-28\n```\n\n### Версия 3 — 2025-05-19\n\nвселенная: Апостол (по дате объявления) · окно w0097 · сообщения 328114–328115\n\n*что здесь: Первое описание: высокий плечистый человек в тесной чёрной коже, лицо без кожи и без носа, острые наросты из щёк, лысый, огромный цельножелезный топор; рубит головы монстрам и людям в масках, идёт медленно, зная, что жертва не убежит*\n\n\n\n```chat\n[328114] 2025-05-19 11:17 Слава: Ладно знаешь. Просто лежать, не напрягая что либо. Вроде клёво. Но из-за этого работал мозг и подкидывал воспоминания. Как вот сейчас, я сижу на диване расслабленный. А мозг подкидывает воспоминания. \nТогда же, мой мозг подкинул. Воспоминания из детства. Когда мы всей семьёй поехали в лес. Просто отдохнуть от городской суеты. Тогда сестра была ещё такой маленькой. Едва ли научилась ходить тогда. А из-за того что она ещё маленькая. А я старший брат. То родители частенько скидывли сидения с сестрой на меня. А я что. Ребёнок ещё полной энергии и интересов. И одним из интересов было это реакция ещё маленькой сестры. Она на всё реагировала. Очень эмоционально и это было приятное. Словно я вместе с ней, что-то открываю новое. \nТогда мы развели костёр. А отец суп сварил. Не вкусный правда. Но чай в вечерней мгле леса. Когда звезды были, как будто так близко. Словно протянув руку я смогу их достать...... Звон. Звон... Звон. Все мои тёплый воспоминания, обрушил звонок сестры . Она звонила наверное,  чтобы спросить, когда приеду? Или тому подобное. Но я был не в состоянии ответит. Я был выжить. И устал. И даже немного раздражён, что сестра прервала, такие тёплый воспоминания. Какой же жалкой ничтожества. Лишь думал, как плохо себе. А не подумал, как плохо сейчас сестре. От незнания, от того что она ещё ребёнок. От того, что она сейчас одна. \nЖалкий эгоист, который не отвечал на звонки и не смотрел на сообщения. Я ведь мог помочь, мог.......\nЯ встал и взял аптечку. Наугад схватил ещё горстку неизвестных таблеток и запихал в рот. Запивая водкой. Пошёл обратно к креслу с аптечкой в руках.  Положил рядом аптечку и сам сел. Слыша всё ближе и ближе этот неприятный звук. Таскания чего-то тяжелого и железного по бетону. Оно приближается и времени всё меньше и меньше. Попутно начал дальше погружаться в себя и в воспоминаний. \n\nДа тогда я так и не ответил. Уснул в кровати.\nПроснувшись я всё же надоумил посмотреть. Почему мне так активно писала сестра. И включив телефон. Увидел более 30 пропущенных и почти что 100 сообщение. И здесь я начал понимать, что, что то не так. Открыв сообщение я увидел много слов. Но смысл каждого сообщение один. &quot;Спаси братец&quot;. Моё сердце содрогнулась. Я побежал к машине. Попутно звоня сестре. Надеясь  что это просто шутка. Слишком много я надеялся на что-то. В тей два дня. Много, но не одна надежда не оправдала себя. \nЯ ехал быстро. И доехал даже за два часа. Я так и не дозвонился до неё пока ехал. \nПриехав. Меня встретила. Разрушенная деревушка. Хотя какая деревушка, это было деревня городского типа. Она была большая и там жила не мало людей. Но сейчас там был погром, кровь и смерть. \nОстановившись на въезде. Я вышел из машины и пошёл к дому. И чувствовал кислый запах железа. Наверное лишь нюх работал правильно и не подводил. Ведь слух мой, ничего не слышал. А зрения так и кидала моменты из детства. Кладя их поверх реальности. Поверх той крови и разрушений. Я видел, как я с ребятами воровал у соседа яблоки. А также видел, что то дерево было в крови, а окна дома всё разбиты. Я видел, как мы с отцом чинили машину. Хотя, как мы. Я то просто подавал разный ключи. И боялся дать неправильный. А теперь я вижу, как гараж открыт и там всё разнесли. Я шёл. Прекрасно зная, что там за крепкой дверью дома. Ведь видел, как из под двери течёт кровь. Но даже так. Я всё равно открыл еë. И сошёл с ума. Кровь и плоть. Всё, что видел я. Там было ничего, что напоминала человека. Была лишь цепочка сестры, которая она не
