<script>const BASE="../";const DOCNAME="Оберег";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Оберег\n\n*способность* · вселенные: 7 островов\n\n## Навигация\n\n- (w0040) Инструмент персонажа: Слава просит помочь придумать, отсекает оружие, останавливается на обереге. Миколай предлагает варианты и памятное происхождение вещи.\n\n## Связано с\n\nПерсонаж с раздвоением личности (способность тьма), Тьма\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-06-30\n\nвселенная: 7 островов (по дате объявления) · окно w0040 · сообщения 191892–191926\n\n*что здесь: Слава: инструмент точно не оружие. Варианты Миколая — печать, колечко как кран (регулятор). Слава называет: оберег. Миколай описывает как «залупу на верёвке» и предлагает сделать вещь памятной (подарок родственницы перед её гибелью). Слава отвечает, что истории не прописывает, и вместо памятного подарка даёт лабораторную предысторию.*\n\n\n\n```chat\n[191892] 2024-06-30 01:20 Миколай: А че по инструментам?\n[191893] 2024-06-30 01:21 Слава: Хммм\n[191894] 2024-06-30 01:21 Миколай: Кстати, кошка нашлась?\n[191895] 2024-06-30 01:22 Слава: Да и снова потерялась\n[191896] 2024-06-30 01:22 Миколай: Капец, что ж она так\n[191897] 2024-06-30 01:22 Миколай: Где была?\n[191898] 2024-06-30 01:22 Слава: Не знаю я 3 проснулся его нашли\n[191899] 2024-06-30 01:22 Миколай: Понятно\n[191900] 2024-06-30 01:23 Миколай: Сука, как же меня бесит слово &quot;понятно&quot;, в моих глазах это сверх инструмент, но сука кто такие вещи юзает постоянно\n[191901] 2024-06-30 01:24 Миколай: Даже не война бля\n[191902] 2024-06-30 01:24 Слава: А я же раньше &#x27;понятно&#x27; писал\n[191903] 2024-06-30 01:24 Слава: Помоги не могу придумать\n[191904] 2024-06-30 01:25 Миколай: Жиза\n[191905] 2024-06-30 01:25 Миколай: Ну тогда щас покумекаю\n[191906] 2024-06-30 01:25 Слава: Это точно не оружие\n[191907] 2024-06-30 01:25 Миколай: Так ну ты хотел вообще огнестрелы ебануть\n[191908] 2024-06-30 01:25 Миколай: Я тебя понял\n[191909] 2024-06-30 01:26 Миколай: Пиздец\n[191910] 2024-06-30 01:26 Миколай: Печать может какая\n[191911] 2024-06-30 01:26 Слава: Оберег\n[191912] 2024-06-30 01:26 Миколай: Или колечко, чисто как кран служащее\n[191913] 2024-06-30 01:26 Слава: Какие обереги есть\n[191914] 2024-06-30 01:26 Миколай: Да\n[191915] 2024-06-30 01:27 Миколай: Хмм\n[191917] 2024-06-30 01:27 Миколай: Такая залупа на верёвке\n[191918] 2024-06-30 01:27 Миколай: Называется оберег\n[191919] 2024-06-30 01:28 Миколай: Возможно это будет чет памятное?\n[191920] 2024-06-30 01:28 Миколай: Типа ему подарила эту хуету внучка брата по линии матери перед тем как её сбила машина хз\n[191921] 2024-06-30 01:28 Слава: Ты же в курсах я истории вообще как долбоеб не прописываю\n[191923] 2024-06-30 01:29 Миколай: Стой\n[191924] 2024-06-30 01:29 Миколай: Она написала мне\n[191926] 2024-06-30 01:30 Слава: Он рос в лабораторий его с рождения учили убивать не более, но после его спасения сильнейший команды он попал под их опеку и там учился быть нормальным человеком\n```\n\n## Часть чего\n\nПерсонаж с раздвоением личности (способность тьма)\n\n## Неясности\n\n- (w0040) Форма и функция оберега до конца не определены, обсуждение обрывается на краю окна.</div>"}];</script>
