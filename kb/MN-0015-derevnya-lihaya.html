quot; Сказал Док, который всё это время молчал. \n&quot; Ты лучшее посмотри на глаза его, он что слепой? &quot; Спросил рыжий.\n &quot; Да не видит вроде&quot; поверьтев рукой перед парнишкой и увидев, как он слегка верьте головой смотря на руку, сказал капитан. \n&quot; Да отойти, вы от него. Словно бараны на новый ворота смотрите. Видите он и слова проронить не может, пока перед ним, четыре взрослых дылды с оружиям стоять&quot; Прикрикнул самый старший среди них.\n &quot; Эй кушать хочешь? Хотя че я спрашиваю, конечно хочешь&quot; сказал старик. \n &quot; Ладно давайте привал&quot; сказал капитан, быстро поняв, что хотел старик.\nВо время их привала. Когда они уже начили кушать. Старик спросил &quot; Мальчик, а ты вообще откуда, такой вылез&quot;. Мальчик посмотрель на старика. Это было неприятно, нет, сам взгляд был обычным, детским, но белый светящийся глаза были неприятными. \nВ это время трое мужчин сидевший в стороне. &quot; Док, а что за болезнь или мутация при котором глаза светятся и белый словно у слепого, при этом он всё видет?&quot; Спросил рыжеволосый\n[297461] 2025-03-03 18:47 Слава: &quot; Не знаю, впервые вижу подобная, да и слышу тоже&quot; Ответил доктор \n&quot; Да и откуда он? &quot; Негодовал рыжеволосый солдат\n&quot; Ясно же, с деревни Лихой, здесь она одна на ближайшие 40 км&quot; Невольно ответил капитан. \n&quot; Хм, Лихая и кто дал название такое&quot; Ухмыльнулся рыжеволосый. \nПосле капитан жестом подозвал старика, в надежде, что он хоть что-нибудь узнал. \n&quot; И как? &quot; Спросил капитан \n&quot;Как, как, никак!. Ничего о себе не знает ни возраст, ни имя, ни где живёт, ни кто родители. Показал только, откуда пришел и&quot; Слегка подумав старик добавил \n&quot; Короче видил он вон там. Видел,он цистерну с трубой, наполненой кровью и трупами&quot;\n&quot; Че&quot; Явно не понимая спросил рыжеволосый \n&quot; Как трупами?И что за цистерна&quot; Спросил рыжеволосый. \n&quot; Да не знаю я. Сказал лишь,  что слышал&quot;\n&quot; Ладно,
