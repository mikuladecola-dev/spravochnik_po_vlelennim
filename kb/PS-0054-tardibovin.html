<script>const BASE="../";const DOCNAME="Тардибовин";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Тардибовин\n\n*персонаж* · вселенные: игра бога\n\n## Навигация\n\n- (w0030) Раса пришельцев ростом полтора метра, помесь вола/быка с тихоходкой (Tardigrade + bovine). Карточка написана нейронкой по заданию М (он придумал, кого скрестить), потом правится вдвоём: телепатия убирается, внешка спорная. На следующий день попадает в тройку одобренных.\n\n## Связано с\n\nмноголикий, тихоходка\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-04-06\n\nвселенная: игра бога (по дате объявления) · окно w0030 · сообщения 154392–154396\n\n*что здесь: Первая карточка: 1.5 м, толстая морщинистая серо-коричневая кожа, два загнутых рога, двуногий, 4 пальца с противопоставленным большим; выносливость к температурам/радиации/обезвоживанию, анабиоз, огромная сила, телепатия, смена плотности тела, регенерация на клеточном уровне.*\n\n\n\n```chat\n[154392] 2024-04-06 16:00 Миколай: Да, увеличивается\n[154394] 2024-04-06 16:15 Миколай: Название пришельца: Тардибовин (от лат. Tardigrade - тихоходка, bovine - бычий)\n\nОписание:\nТардибовины - раса пришельцев ростом около 1.5 метров с крепким телосложением, напоминающим миниатюрную версию вола или быка. Их кожа толстая и морщинистая, серо-коричневого цвета. На голове есть два небольших рога, загнутых назад. Лицо имеет обобщенные антропоморфные черты - два глаза, нос и рот.  \n\nКонечности массивные и мускулистые. Передвигаются на двух ногах, имеют две руки с 4 пальцами, включая противопоставленный большой палец. Несмотря на массивность, движения тардибовинов неторопливы и размеренны.\n\nСпособности:\n- Невероятная выносливость, способны выдерживать экстремальные температуры, радиацию, обезвоживание. \n- Впадают в анабиоз при крайне неблагоприятных условиях, понижая метаболизм почти до нуля.\n- Огромная физическая сила, во много раз превосходящая человеческую\n- Способны телепатически общаться между собой и с другими существами\n- Могут менять плотность тела, становясь почти неосязаемыми или тверже стали\n- Регенерируют физические повреждения на клеточном уровне\n[154396] 2024-04-06 16:17 Миколай: Я придумал кого скрестить, нейронка дала четкое описание по заданию))\n```\n\n### Версия 2 — 2024-04-06\n\nвселенная: игра бога (по дате объявления) · окно w0030 · сообщения 154397–154400\n\n*что здесь: С принимает всё кроме внешки и телепатии — телепатия вычеркнута, внешность отправлена на переделку/дорисовку.*\n\n\n\n```chat\n[154397] 2024-04-06 16:19 Слава: Все понравилась кроме внешкий и телепатией\n[154398] 2024-04-06 16:20 Миколай: Оке, телепатию заборт. А вот по внешке че\n[154399] 2024-04-06 16:22 Миколай: Хех, я его как то так представляю, ток чуть меньше\n[154400] 2024-04-06 16:24 Миколай: Вот что нейронка по описанию выдала\n```\n\n### Версия 3 — 2024-04-07\n\nвселенная: игра бога (по дате объявления) · окно w0030 · сообщения 154664–154679\n\n*что здесь: Смещён акцент: главное у быка не сила, а выносливость — экстремальный холод, мощное пламя, вплоть до атомного взрыва; это наследство от скрещивания с тихоходкой. Он «маленький, но танк»; силу добавить можно, ловкость — нет.*\n\n\n\n```chat\n[154664] 2024-04-07 11:26 Слава: Три это быстрый с узорами молний, бык или козел; а третий кто\n[154665] 2024-04-07 11:27 Миколай: Ну я подумал что лягуху с крыльями ты тож одобрил\n[154666] 2024-04-07 11:27 Миколай: А мне лично все понравились\n[154667] 2024-04-07 11:27 Слава: Ну мне тоже ну там чисто как отдельный виды расы а не часть челика\n[154668] 2024-04-07 11:28 Миколай: Вообще прикол быка не в силе, а выносливости, он может выдержать экстремальные условия, большой холод или наоборот мощное пламя, или даже атомный взрыв\n[154669] 2024-04-07 11:28 Слава: Это кто\n[154670] 2024-04-07 11:28 Слава: Пузырь\n[154671] 2024-04-07 11:29 Миколай: Он\n[154672] 2024-04-07 11:29 Миколай: .\n[154673] 2024-04-07 11:29 Миколай: Такие способности ему достались от скрещивания с тихоходкой\n[154674] 2024-04-07 11:30 Слава: Аааа ну туда можно ещё и силу кинуть с ловкостью\n[154675] 2024-04-07 11:30 Миколай: Ну думаю он не про ловкость\n[154676] 2024-04-07 11:30 Миколай: Он как танк будет скорее\n[154677] 2024-04-07 11:30 Миколай: Маленький но танк\n[154678] 2024-04-07 11:30 Миколай: А вот силу да, силу можно\n```\n\n## Неясности\n\n- (w0030) Не сказано прямо, он ли тот «наш качок»/«силач», о котором говорят на 154434 и 154497.</div>"}];</script>
