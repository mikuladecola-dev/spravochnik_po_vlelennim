<script>const BASE="../";const DOCNAME="Место и ты";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Место и ты\n\n*2025-11-21 · неясно · Помечена маркером «Второе» (387579); три сообщения подряд, обрывается после добивания существа на кухне*\n\n---\n\n\n\n```chat\n[387581] 2025-11-21 18:16 Слава: Место и ты \n \nСкажите у вас не возникала мысли ударить, мимо проходящего человека. Нет он ничего вам не сделал, вы в первые его видите. Но почему-то всё же проскальзывает едкая чувство, хорошенько его долбануть. \nХа. Я не поверю в эти невинные глаза, что отводят взгляд, и запинаясь пытаются убедить меня, что не за чтобы это не сделали. \nКАЖДЫЙ хоть раз в жизни об этом думал. И сразу же возникают плохие мысли, о том что же произойдёт в мире, если все вдруг рельно это сделают, то начнётся хаос. Кровь мучения и страх смешаються в одну политру и станут единным, и тогда не будет психов. Ведь в мире психов нету психа. \nК сожалению или к радость это вряд ли, когда-то случится. Законы, запреты, наказания и конечно же совесть, так сильно засели в человеческой натуре.\n\n\nЕсли вспоминать о давно ушедшим. То воспоминания можно разделить на 2 категории: плохие и хорошие, лишь именно эти воспоминания оставляються с нами на веки. \nВоспоминания о том, как меня мелкого ещё не познавшего мир, окунал в холодную воду религиозный пьянеца, вроде как мой отец. Вода до дрожи холодная , от который сводили мышцы, которая мелкими холодными иглами, протыкали пухленькое лицо ребёнка и уходил в глубины тела и оставаясь там. \nВоспоминания о том, как я всё ещё ребенок, но уже по-старше отрывал ножки насекомым и следил за ними. Думая когда же он умрёт и сколько можно нанести ему вреда, чтобы он был ещё живой. Не знаю, почему но это воспоминания въелось в мою головушку. \nВоспоминания о том, как дрожал побитый времени комок оделяла, которым я укрылся в надежде на защиту. Хотя прекрасно понимал, что одеяла не способный остановить даже звуки пьянки неизвестных людей в соседней комнате, не будет способна остановить приближающие галдешь, а после удара армейским ремнём или рукой, сложно было предсказать, чем именно меня могут ударить. \nВоспоминания о ток, как белый кот, что не хотел со мной ласкаться и вечно убегал. Больше не мог ходить, ведь его лапы были сломаны разваливающим молотком. И я был рад, теперь он мой и он нуждался во мне, и кот он был таким  жалким. Я прекрасно понимал что его жизнь в моих руках. \nТак можно вспоминать ещё очень долго, но итог один. Я ненавидел людей , который доминировали или приченяли  мне вред. Но при этом до безумия любил доминировать и приченять вред. Это выглядит с одной стороны глупо, разве я, который испытал всю боль жертвы, не должен был ненавидеть насилия? \n\nВдруг монотоный звук черчения ручкой прекратился и психолог поднял на меня взгляд. \n- это был вопрос Алексей? - спросил мой психолог, пристально смотря на меня. \n- Нет - слегка резка сказал я, и добавил - вы же сами сказили рассказать о прошлом и о чувствах и мыслях в те времена. А на этот вопрос вы уже отвечали- \nПсихолог мягко улыбнувшись опустил глаза. Крутя ручку в руках он спросил\n- Вот знаете, что мне интересно Алексей. По какой причине вы не стали пьянецей, убийцей или кем либо ещё в криминальном  обществе? - в его глазах так и читалась &quot; Или стал? &quot;.\n-в самом начале своего монолога я соврал- психолог скорчил удивлённое лицо. \n- не КАЖДЫЙ об этом думает. Точнее сказать я надеюсь, что не каждый об этом думает. Хотя бы не та миловидная бабуля, что подкармливала меня.-\nДоктор явно ждал продолжение, но боялся словом спугнуть душевный разказ своего клиента, который в первые за 9 встреч дошёл, до того почему клиент не стал тем кем должен был стать. Я лишь усмехнулся про себя. \n-После кота я совсем сорвался. И перешёл уже на сверстников и детей по младшие. Начал их бить, унижать и придераться. \nЯ также начал часто драться и к сожалению не всегда выигравал...... ПИЛИПИЛИПИПяляияп. \nЗазвонил мой старенький телефон. Я не глядя взял трубку. \n-ало-\n- Леха дом горит! - крикнули мне в ухо. Я резким движением убрал телефон от уха. Но быстро поняв смысл слов вернул его к уху. \n- Всмысле чей? где?- недомивал я\n[387582] 2025-11-21 18:16 Слава: -да.. Моя горит квартира. Катька кастрюлю на плите оставила.- я пытался вспомнить приятеля, у которого была девушка Катя. \n- У тебя же ключи от квартиры есть? - резко спросили меня. Я же на автомате ответил -да- даже не поняв, кто звонит \n-идти пожалуйста кастрюлю сними или хотя бы документы вынеси- я встал с кожанного дивана. И начал снимать куртку с вешалки, так и не понимая куда ехать. \nЯ быстро надел куртку и открыв дверь в спину услышал \n- встретимся в пятницу Алексей- сказал доктор улыбаясь мне в спину. Я же уже выскачил из кабинета психолога и наконец-то посмотрел, кто звонит &quot; Вадим сосед&quot; Была надпись на телефоне. И я ускорил шаг. Нет, на квартиру соседа было от части наплевать. \nВот только он сосед через стенку и если начнётся пожар, то гореть начнёт и моя квартира. \nВетер нагло бил мне в лицо пока я бежал , словно пытаясь остановить. &quot;Чёртов психолог&quot; Бегали эти мысли. Ведь именно он сказал раз мой дом рядом, то лучшей идей будет ходить к нему пешком для улучшения психологической стабильности или чего-то там. Я бежал, от резкой нагрузки лёгкие отдала огнем, а сердце билась как сумашедшая, пытаюсь поспеть за телом. \nУлица, дом и окно соседа из которых ничего не светится. \nМеня это не успокаивает и, я стоя у домофона не мог найти эту долбанную пилюлю. Наконец найдя пилюлю, я прикладываю его к домофону. И со всей силой потянув дверь, я переборщил и она громко ударяеться от бетонную стенку, но меня это мало волнует. Я уже перемахиваю через ступени и быстро поднявшись на 4 этаж. На ходу я рукой уже искал запасной ключ  от соседской квартиры. Намереваясь ранее после психолога сразу покормить кота, поэтому и взял ключи с собой. \nБинго я нашёл их во внутреном кармане и на удивления попав с первой попытки в скважину. Также сильно отталкиваю дверь и забегаю. \nКот, жирный кот подумав, что пришли хозяевы побежал с закрытыми глазами терется об ноги. Споткнувшись от кота, что весом был больше меня. Я рестекся на полу, чувствуя как в нос наливаеться красная густая жидкость.\nВставая, я проклинал этого кота, что лежал на моих ногах (но славу богу). \nПоднявшись  уже спокойно, пошёл на кухню, как видимо из разбитого носа вместе с кровью вышел и весь адреналин. \nСпокойно идя на кухню. Взглядом искал салфетки или ещё чего, чем можно остановить кровь. Потому что уже понял, что пожара нету. Если бы был пожар, то был бы дым, запах и жара да и кот если всетаки, что-то горела таким беспечным не был бы. \nДа уж, конечно ничего не горела и кастрюли не было. Было лишь непомытая кастрюля в раковине и включённая электрическая плита. \n&quot; Да уж герой спас от переплаты&quot; Подумал про себя выключая плиту. Я устала вздохнул и взяв вафленная полотенца на кухне. Начал им прикрывать нос. \nЯ посмотрел на окно без всякой мысли. Без цели, что-то там увидеть. Но что-то было, что-то показалось мне. Лишь на долю секунды, нееет меньше чем на долю секунды. Мой мозг, да и я сам не успел осознать, что это было. Я даже не был уверен, что там что-то было. И даже описать не могу, что я видел, ведь это было слишком быстро. &quot; Я шизофриник&quot; Возникла мысль, но не успела быть обдуманно. Как стеклопакет затрясся и было ощущения, что он сейчас разобьётся. \nДом строгнул. Кастрюля и посуда затряслись в такт  вибрации. Я же уже сидел под столом. Вспоминая множеств моментов из фильмов, где деревянный хрупкий стол спасал людей от движения гиганстких  земных плит. Кот же прыжком прыгнул ко мне с расширенными глазами, и больно вцепившись в руку прижимался ко мне, словно хотел стать меньше. \nЯ же дрожал, от мысли, что это не землетрясение. \nДом всё дрожал, и мысли, что это землетрясения всё дальше уходили от меня, вместе с кровью, что льётся из носа. Ведь не бывает таких длинных землетрясений, тем более в нашей-то стране, где все природные явления если, и проявляють себя то слабо. \nВдруг резко без следствий всё остановилась. Словно природа матушка всё же решила жалуется над разумом жалкого человека. Но нет это была не наша любимая матушка природа. Это было что-то иное, что-то более хитрое и понимающие человеческий разум.\n[387583] 2025-11-21 18:16 Слава: Она остановилась лишь на мгновения, чтобы я выдохнул и резкими и дрожащими движениями начал искать пачку сигарет. Попутна ощущая, как ноет рука, в который цепился рыжий котяра. \nА после она решила уронить этот мир. Да здания, или даже весь мир начал падать. Если честно я бы не понял, что мир падает, не был бы моей обескоенный разум ощутить это. Но он был способен осознать, что поднявшийся в воздух стол, посуда и конешно же любимый котяра. Не просто так всё в воздухе. \nИ после мой разум принял самое правильное решения. Верный ответ он нашёл и сделав правильный вывод он отключился. Отключился и я. Ну это понятное дело. И я считавший себя хищником среди стадо баранов не понимающий собственных желаний. Выключился от непонимания происходящего. \n\nНе знаю сколько прошло времени. Мне снилось сны очень яркий и непонятный, но такие приятные. Я не хотел просыпаться, я и дальше хотел быть во сне думая, что сон это ряльность, а всё остальное бред бредовой собаки. Но новый мир решил не ждать моего естественного пробуждения и не ждать пока я не перекурю чем то похожим на белку. Он вытянул меня из защитного крепости, мерзким и отвратильным способом. Обоссал он меня короче, хотя я не уверен, что это было моча. Но мой мозг, что перебирал всю информацию, именно так ощутил жидкость, что лелась на моей тела. \nЯ открыл глаза и увидел, кем то не перижованый кусок мяса с хрящами. И это кусок мяса чём-то похожий на тень человека, испустил из своего отверстия, которая находилось на пузе, жёлтую густую жидкость. \nНа удивление как видимо не только меня, так как это существо удивлённое глядело на меня своими глазами бусинами. Я спокойно встал, попытался вытереть жидкость кухонным полотенцем, что было у меня в руках. Поняв, что это бесполезно, решил медленно наматать полотенце на кулак. \nЭто существо, что-то булькало своим отверстиям у пуза. Возможно она хотела, что-то сказать, но не могла. Но было уже поздно удар в лицо и это существо пошатнулась и пошла назад. Не успел он не отойди, не прийти в себя, как мой ботинок впечатался в пуза этого... Этого, как ещё его можно назвать. \nОн упал быстро и тяжело, и вертелся как таракан упавший на спину. Каждый моей пинок по его туши. Он издавал знакомый звук визга жертвы. Да это звук легко узнать хоть у человека, животного и насекомого они разные, но интонация одна и та-же.\nЭто существо оказалось живучим после десятков моих ударов, когда я уже начал давать заднию. Он всё мычал, и сложно было понять по куску мяса, нанёс я ему вред или нет. \nЯ решил бросить это дела, ведь это бесмысленно. Хотя я же на кухне. Я быстро огляделся и увидел стелажи и столики. Ножницы, ложки, тарелки и тому подобной бытовой фигни.\nДа нож тоже фигня,  ведь это кухонный нож. Он хлипкий и тонкий и легко сгибается, ранить им конечно можно, но не убить, да и застрять он может. Поэтому я искал что-то более увесистое. \nОткрывая очередной шкафчик и опустив туда руку я почувствовал что-то холодной и достаточное тяжёлое. Достав я понял, что это молот для обивки мяса. Идеально молоток для куска мяса. \nМоей трепещало от интереса, что же там внутри него. Словно я ребёнок, что так и жаждет раскрыть подарок. И конечно же я его раскрыл. Пять именно пять ударов молотком дало понять, что череп у него всё же есть. Но спрятанный под обилием плоти. \n&quot;Так ты всё же человек. Ну или был им когда-то &quot;не знаю почему возникла эта мысль. Ну я  не отрицал эту мысль.\n```</div>"}];</script>
