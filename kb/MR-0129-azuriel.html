 (Азуриэль), новый мир (сказка о новом мире)\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-03-26\n\nвселенная: вне вселенной (по дате объявления) · окно w0086 · сообщения 311282–311286\n\n*что здесь: Первое описание внешности (ещё без имени), по пересланной картинке; вопрос «какая у него будет способность»*\n\n\n\n```chat\n[311282] 2025-03-26 08:29 Слава: Боже, какой он симпапусечный\n[311284] 2025-03-26 08:29 Слава: Какой он красивый\n[311285] 2025-03-26 08:36 Слава: Давай я его опишу \nГуманоид человеческого роста синий кожей( не точно может розовый) с острыми ушами как у эльфа \nТакже на лице красивый узоры разного цвета  \nОдежда зимняя \nСам он гибкий\n[311286] 2025-03-26 08:36 Слава: И какая у него будет способность\n```\n\n### Версия 2 — 2025-03-26 · повтор прежней мысли\n\nвселенная: вне вселенной (по дате объявления) · окно w0086 · сообщения 311287–311288\n\n*что здесь: Дано имя Азуриэль; описание повторено и дополнено: узоры на лице меняются в зависимости от эмоций*\n\n\n\n```chat\n[311287] 2025-03-26 08:40 Слава: Азуриэль\n[311288] 2025-03-26 08:44 Слава: Давай я его опишу \nГуманоид человеческого роста синий кожей( не точно может розовый) с острыми ушами как у эльфа \nТакже на лице красивый узоры разного цвета, который могут меняться в зависимости от эмоций\nОдежда зимняя \nСам он гибкий\n```\n\n### Версия 3 — 2025-03-26\n\nвселенная: вне вселенной (по дате объявления) · окно w0086 · сообщения 311412–311429\n\n*что здесь: М просит ещё представления о существе, чтобы придумать силу («а то скажу что он ртутью управляет»); С отказывается расширять и заодно закрывает тему стихий и веществ для этого мира*\n\n\n\n```chat\n[311412] 2025-03-26 13:17 Миколай: ну кстати\n[311413] 2025-03-26 13:17 Миколай: ты чет ещё о нем скажешь\n[311414] 2025-03-26 13:17 Миколай: я все равно не понимаю что это за существо чтобы давать способности\n[311415] 2025-03-26 13:17 Миколай: ну типа\n[311416 inserts), добавлены слабость в толпе и работа с электричеством*\n\n\n\n```chat\n[366148] 2025-09-17 12:25 Слава: Азуриэль: Нейро-сканер\n\nЕго способность это не эзотерическая эмпатия, а гиперразвитое чувство, позволяющее напрямую считывать и интерпретировать биоэлектрическую активность нервной системы других существ.\n[366151] 2025-09-17 12:26 Слава: находясь в толпе он теряется и не может сконцетрироваться\n[366159] 2025-09-17 12:28 Слава: И кстати он может поглощать электричество и улучшать своё физ. Данные и регенерацию. И бить током прикоснувшись человека или стрелять молнии. Но не каких громовых драконов либо ещё какое фантастическое и связанное с энергией бредятины\n```\n\n### Версия 6 — 2025-09-17\n\nвселенная: неясно (по дате объявления) · окно w0105 · сообщения 366175–366193\n\n*что здесь: роль во вселенной: природный охотник на апостолов, потому что их сила держится на нервной системе и мозге; против Поротаев малоэффективен; появился на Земле естественным путём*\n\n\n\n```chat\n[366175] 2025-09-17 12:35 Слава: Ты ведь понимаешь что для апостолов у которых главная силы сверх чувства и восприятия ( то есть самое главное нервная система и мозг) то есть Азуриэль является природным охотником Апостолов. При этом против Поротой они не так эффективны\n[366177] 2025-09-17 12:36 Слава: Но апостолы сильнее поротоя\n[366178] 2025-09-17 12:36 Миколай: природным?\n[366184] 2025-09-17 12:38 Миколай: блять\n[366186] 2025-09-17 12:38 Миколай: я чужую шаурму спиздил\n[366192] 2025-09-17 12:39 Миколай: Потом ответишь \nПридумал один вид Поротай \nКороче есть жуг ты его съедаеш и у тебя 3 варианта \n1) смерть , все твои внутренности превращаются в камень и отказывают\n2)  превращаются  в низший Поротай (горбатого двух лицого, полукаменного-полуплоти , и ты теряешь личностей и  слушаещя высшего Поротая  ) способности крепкость, реген, сверхсила \n3) превращается высшего Поротая сохраняешь свой человеческий образ и личность. Способности реген, контроль над низшими, превращать
