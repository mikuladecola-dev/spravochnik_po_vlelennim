<script>const BASE="../";const DOCNAME="Философия обучения и рисования (Миколай)";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Философия обучения и рисования (Миколай)\n\n*служебное* · вселенные: вне вселенной\n\n## Навигация\n\n- (w0028) Сквозная линия всего окна: Миколай раз за разом объясняет Славе, как учиться рисовать и зачем. Тянется с 2024-03-26 [148568] через 2024-03-27 и до конца окна [150199] и распадается на несколько отдельных состояний мысли.\n\n## Связано с\n\nТемы для рисования\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-03-26\n\nвселенная: вне вселенной (разбор «неясно») · окно w0028 · сообщения 148568–148619\n\n*что здесь: Срисовывание как метод: своё нельзя создать, не разобрав чужое; анализ предшествует синтезу; перерисовывать лучше фотографии, чем чужие работы; при копировании чужого не менять стиль, а понимать, почему автор сделал так; фиксировать выводы после перерисовки и применять их у себя; по фото — экспериментировать, рисовать одно и то же по-разному и помногу, «на отъебись». Продолжение мысли, начатой 2024-03-21 в w0027.*\n\n\n\n```chat\n[148568] 2024-03-26 16:38 Слава: Под рисуешь можно относить срисование\n[148569] 2024-03-26 16:38 Миколай: Ну, смотря как это происходит\n[148570] 2024-03-26 16:38 Слава: А то в голову ничего не приходит а те персонаж которых хочу нарисовать просто не могу\n[148571] 2024-03-26 16:39 Слава: Ну типо срисование\n[148572] 2024-03-26 16:39 Миколай: Положил листок на экран и обводишь\n[148573] 2024-03-26 16:39 Слава: Нет конечно\n[148574] 2024-03-26 16:39 Миколай: Ахаххах\n[148575] 2024-03-26 16:40 Миколай: Ладно\n[148576] 2024-03-26 16:40 Миколай: Я понял крч\n[148577] 2024-03-26 16:40 Миколай: Я как раз сейчас эту тему изучаю\n[148578] 2024-03-26 16:40 Миколай: В общем\n[148579] 2024-03-26 16:40 Миколай: Ты ничего своего не сможешь нарисовать\n[148580] 2024-03-26 16:40 Миколай: Это нормально\n[148581] 2024-03-26 16:40 Миколай: Ща, дам почитать\n[148582] 2024-03-26 16:40 Миколай: Отношение анализа и синтеза в научном познании можно охарактеризовать следующим образом:\n\n1. Анализ и синтез - это взаимодополняющие методы познания:\n\n- Анализ - это мысленное или практическое расчленение целого на части, выделение отдельных элементов, свойств, отношений.\n\n- Синтез - это соединение частей, элементов, свойств в единое целое.\n\n2. Анализ и синтез находятся в диалектическом единстве:\n\n- Анализ предшествует синтезу, так как для того, чтобы соединить части в целое, нужно сначала выделить и изучить эти части.\n\n- Но синтез также необходим, так как только на основе синтеза мы можем получить целостное знание об объекте.\n\n3. Анализ и синтез применяются на всех этапах познания:\n\n- На эмпирическом уровне - для расчленения объекта на составные элементы и затем воссоздания его в мысленной форме.\n\n- На теоретическом уровне - для построения научных теорий, объясняющих внутренние связи и закономерности объекта.\n\n4. Соотношение анализа и синтеза меняется на разных этапах познания:\n\n- На начальных этапах преобладает анализ, направленный на изучение частей.\n\n- На более поздних этапах возрастает роль синтеза, направленного на воссоздание целостной картины объекта.\n\nТаким образом, анализ и синтез находятся в диалектическом единстве и взаимодополняют друг друга в процессе познания.\n[148583] 2024-03-26 16:44 Миколай: Суть в том, чтобы создать нечто своё, нужно сначала понимать из чего создавать, а значит нужно изначально изучить со всех сторон множество работ других людей, но лучше конечно работать по фотографиям и в этом нету ничего плохого, так и должно быть. А эффективнее всего фиксировать ещё выводы, записывая то что понял перерисовав, а после попробовать применить эти выводы у себя в работе\n[148584] 2024-03-26 16:45 Слава: Типо можно перерисовать под свой стиль\n[148585] 2024-03-26 16:45 Миколай: Ты знаешь какой у тебя стиль?\n[148586] 2024-03-26 16:45 Слава: Не\n[148587] 2024-03-26 16:45 Слава: Но я его ищу\n[148588] 2024-03-26 16:46 Миколай: Но ты имеешь ввиду перерисовать чужие работы всё таки\n[148589] 2024-03-26 16:46 Миколай: ?\n[148590] 2024-03-26 16:46 Слава: Не фото\n[148591] 2024-03-26 16:46 Миколай: Ага, я понял\n[148592] 2024-03-26 16:46 Миколай: Ок\n[148593] 2024-03-26 16:47 Миколай: Ну смотри\n[148594] 2024-03-26 16:47 Миколай: Лучше в таком случае не менять стиль\n[148595] 2024-03-26 16:47 Миколай: И не просто копировать что видишь\n[148596] 2024-03-26 16:47 Слава: Почему\n[148597] 2024-03-26 16:48 Миколай: А пытаться опять-таки понять, почему человек решил это сделать именно так\n[148598] 2024-03-26 16:48 Миколай: Для обучения сейчас не выгодно\n[148599] 2024-03-26 16:48 Слава: Фото\n[148600] 2024-03-26 16:48 Слава: Перерисовать фото\n[148601] 2024-03-26 16:49 Миколай: Ок, если фото, то можно уже экспериментировать\n[148602] 2024-03-26 16:49 Миколай: И рисовать так как хочешь\n[148603] 2024-03-26 16:49 Миколай: И тут думаю эффективнее всего рисовать на отебись\n[148604] 2024-03-26 16:49 Миколай: Но одно и тоже и по разному\n[148605] 2024-03-26 16:50 Миколай: И типо в большом количестве\n[148606] 2024-03-26 16:50 Миколай: Тут реально очень выгодно делать много попыток и экспериментов\n[148607] 2024-03-26 16:51 Миколай: Ты сейчас рисуешь?\n[148608] 2024-03-26 16:51 Слава: Ну да\n[148609] 2024-03-26 16:51 Миколай: Может покажешь процесс, если, возможно\n[148611] 2024-03-26 16:52 Слава: Не лучше не надо\n[148612] 2024-03-26 16:52 Миколай: Почему?\n[148613] 2024-03-26 16:52 Миколай: А\n[148614] 2024-03-26 16:52 Миколай: Пон\n[148615] 2024-03-26 16:53 Миколай: Ты же с телефона рисовать будешь\n[148616] 2024-03-26 16:53 Миколай: Ну\n[148617] 2024-03-26 16:53 Миколай: Тип фото\n[148618] 2024-03-26 16:53 Слава: Да да\n[148619] 2024-03-26 16:53 Слава: Да да\n```\n\n### Версия 2 — 2024-03-27\n\nвселенная: вне вселенной (разбор «неясно») · окно w0028 · сообщения 148885–148918\n\n*что здесь: Переход от теории к практике: требование показывать результат, а не разговаривать о рисунках; собственные попытки «рисовать не думая», срисовывание с референса и рисование из головы без референса как разные режимы.*\n\n\n\n```chat\n[148885] 2024-03-27 15:13 Слава: Привет помнишь мы шаурму кушали не помнишь как она называется\n[148886] 2024-03-27 15:14 Миколай: Ой, чет на букву м, как будто мадагаскарская или тип того\n[148887] 2024-03-27 15:14 Миколай: Мексиканская походу\n[148888] 2024-03-27 15:15 Миколай: И там самая большая\n[148889] 2024-03-27 15:15 Слава: Бля я итальянскую взял вчера так она с грибами и маслам\n[148890] 2024-03-27 15:15 Слава: Вообще говно\n[148891] 2024-03-27 15:15 Миколай: Ааа, ну бывает\n[148892] 2024-03-27 15:15 Миколай: Сочувствую\n[148895] 2024-03-27 15:48 Миколай: Атататата, ты так часто чет говоришь о рисунках в последнее время, но я чет не вижу результатов. Ты хоть покажи, что там у тебя. Я сам вот уже захотел порисовать после таких разговоров 😅\n[148897] 2024-03-27 16:26 Миколай: Ластика нет, поэтому как-то так\n[148898] 2024-03-27 16:26 Слава: Бля как же красиво\n[148899] 2024-03-27 16:26 Миколай: А это я почти не думая срисовал себя\n[148900] 2024-03-27 16:27 Миколай: Если бы думал, вышло хуже\n[148901] 2024-03-27 16:27 Миколай: Спасибо\n[148902] 2024-03-27 16:27 Миколай: Ну потому что опыта мало, а я решил подзаморочится\n[148903] 2024-03-27 16:28 Миколай: Если что, вот Референс\n[148905] 2024-03-27 16:28 Миколай: Голова сразу видно упала\n[148907] 2024-03-27 16:29 Слава: Но не особо видно\n[148911] 2024-03-27 17:02 Миколай: Но то норм результат, вот как весь лист выглядит))\n[148913] 2024-03-27 17:30 Слава: Попытался рисовать не думая\n[148915] 2024-03-27 17:36 Миколай: Попытался срисовать отсюда\n[148917] 2024-03-27 17:58 Миколай: Тож решил не думая(ну почти) порисовать. Чисто как выходит, так оставить\n[148918] 2024-03-27 18:19 Миколай: Опять из головы, не опираясь на
