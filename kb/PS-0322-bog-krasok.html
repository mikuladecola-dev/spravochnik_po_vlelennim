const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Бог красок\n\n*персонаж* · вселенные: Оам, Феня\n\n## Навигация\n\n- (w0112) Человек с глазами цвета радуги: для него весь мир состоит из красок, и он может заставить мир течь, как невысохшую картину. Появился 04.12 как чистый образ без характера, 06.12 закреплён как один из двух главных злодеев мира Оэм.\n- (w0114) Один из трёх сильнейших злодеев мира, у него есть дочь. В этом окне к нему приделывают четвёрку главных последователей.\n\n## Связано с\n\nДочь Бога красок, Имита (дочь Имитатора), Оэм, Пастыри, Радужные глаза, Серафим\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-12-04\n\nвселенная: Оам (объявлено) · окно w0112 · сообщения 392464–392492\n\n*что здесь: Первое появление: радужные глаза, мир как растекающаяся краска, автор говорит, что придумал только образ, характер не продуман; предположительно антагонист, но &#x27;не знаю куда его деть&#x27;*\n\n\n\n```chat\n[392464] 2025-12-04 11:36 Слава: Бог красок\n[392465] 2025-12-04 11:36 Миколай: подробнее\n[392466] 2025-12-04 11:59 Слава: Не знаю. \nПросто человек у которого глаза цвета радуги. \nИ вот ты видел как картина не высохшая течёт. Он может так сделать со всем миром.для него все состоит из красок. Бля это тяжка объяснить\n\nЯ все понял. Нужно убить его. \nМужчина быстро передвигался среди палаток. Направляясь к палатке главнокомандующего. Он нервное держал рукоять меча. Готовый выхватить его . \nОн заходит за угол и видит мужчину с чёрными глазами. \nНе раздумывая он выхватывает меч. \nНаносит колющий удар прямо в шею. Мужчина не успел среагировать, лишь ахнул от неожиданности. \nИз его горла хлынула кровь, сдержанное лишь холодным металлом. \nМужчина что пронзил врага. Выдохнул. Понимая что он всех спас, конечно объяснить все всем будет сложно. &quot; Но я смогу &quot; Думал он. \nНо что-то было не так. Тишина. Ни кто не кричал, а ведь он среди дня убил главнокомандующего. \nОн огляделся и увидел. Весь мир поплыл. Словно краски начала растекаться по картине. \nСтрах пронзил голову. Дыхания стало прерывистом. Он перевёл взгляд на черноглазого мужчину. Но его глаза уже не были черными. Они были всех цветов радуги. \nМужчина попытался бежать, но меч не хотел вытаскивается. Он нервничал, не понимал что здесь происходит. Из-за этого и глупил. \nПоняв что меч ему не достать. Он отпустил рукоять и побежал. По мокрому и жидкому миру. \nПадая мужчина каждый раз вставал ведь страх не позволял остановиться. \nСреди этого расплывчатого мира. Он разглядел свою сестру, у костра, которые растаял. И сестра его тоже таяла. Её лицо превратилась в смазанную картину. Он схватил её пытаясь удержать. \nНо она все истекала, он не мог её ухватить. \nВ слезах он видел как его весь мир просто растекался. Все что ему дорого, все что он знал просто исчезала. \nОн почувствовал руку на своем плече и вздрогнул. \nМедленно он поднял голову. Увидел радужные глаза, он хотел молить о пощаде, о спасении. Но не мог выдавить из себя слова. \nЛишь мог смотреть как рука медленно опускалась на его лицо. \n\n\nВ палатку забежал юнец. \n- главнокомандующий там... Это.. - не мог выдавить юный воин. \nСобравшись он всё же выдавил. \n- на нас напали. Есть труп, но там это странная.. - \n- что там странного? - спросил черноглазые мужчина. \n- там это. Голова трупа словно просто растаяла. Словно на картине просто перемещали краски. И ещё он словно из неоткуда появился. Пряма на ногах его сестры- юноша дрожал. Ведь все это больше походила на бред.\n[392471] 2025-12-04 12:07 Слава: Ну как\n[392474] 2025-12-04 12:09 Слава: И кстати норм если я буду писать так коротко. Особо не концентрируюсь на окружении. \nКонечно вообще нужно словить баланс. Ну пока хочу просто коротко\n[392478] 2025-12-04 12:12 Слава: Если три пары глаз. \nПервые белые апостола. Способны видеть оэм ну ещё чего-нибудь\nГлаза черви. Зрачки у них будут словно состоять из тысячи маленьких червячков и вечно двигаться вызывая отвращения и страх ( будет у котов) \nРадужные глаза только для одного челика\n[392486] 2025-12-04 12:17 Слава: Коты наверное буду типо духами. \nБудут чисто из Оэм состоять.\n[392489] 2025-12-04 12:17 Слава: Поэтому запас и понимания Оэм у них больше всех\n[392490] 2025-12-04 12:18 Слава: Бог красок. Я не знаю куда его деть. Возможно будет антагонистом\n[392491] 2025-12-04 12:18 Слава: Как никак сильный и могущественный\n[392492] 2025-12-04 12:18 Слава: Ну я даже характер его не продумал. Лишь образ\n```\n\n### Версия 2 — 2025-12-04\n\nвселенная: Оам (объявлено) · окно w0112 · сообщения 392618–392674\n\n*что здесь: Уточнение механики в ответ на вопрос Миколая, как плавится объёмное лицо: представить сферу из разных цветов, которая с одной стороны растаяла внутрь; обсуждение, как это визуализировать*\n\n\n\n```chat\n[392620] 2025-12-04 20:29 Миколай: я так хуй написал и нарисовал\n[392623] 2025-12-04 20:29 Миколай: невысохшей краской\n[392624] 2025-12-04 20:29 Миколай: ну по сути имитация крови и березового сока\n[392625] 2025-12-04 20:29 Слава: Нихуя я не вижу\n[392626] 2025-12-04 20:29 Миколай: хе\n[392627] 2025-12-04 20:30 Слава: Все загрузилась, норм, только оттенок какой-то серый\n[392628] 2025-12-04 20:30 Слава: Мне больше яркий тона нравится\n[392629] 2025-12-04 20:30 Миколай: ааа\n[392630] 2025-12-04 20:30 Миколай: забыл\n[392631] 2025-12-04 20:31 Слава: И чё\n[392632] 2025-12-04 20:31 Миколай: да да да\n[392633] 2025-12-04 20:31 Слава: Про Бога красок\n[392634] 2025-12-04 20:31 Миколай: вообще охуенно\n[392635] 2025-12-04 20:31 Миколай: пиши коротко\n[392636] 2025-12-04 20:31 Миколай: в пизду баланс\n[392637] 2025-12-04 20:32 Миколай: из крайности в крайность\n[392638] 2025-12-04 20:32 Миколай: сейчас при обучении это лучше всего\n[392639] 2025-12-04 20:32 Миколай: на этом этапе\n[392641] 2025-12-04 20:32 Миколай: щас делать кратко самое то\n[392644] 2025-12-04 20:33 Миколай: ну и идея интересная\n[392645] 2025-12-04 20:33 Миколай: и на словах прикольно\n[392646] 2025-12-04 20:33 Миколай: но как например это смастерить, визуализировать в фильме том же\n[392647] 2025-12-04 20:33 Миколай: сложно представить\n[392648] 2025-12-04 20:33 Миколай: логику\n[392649] 2025-12-04 20:33 Слава: Я представляю каждый раз. И у меня четкая картина\n[392650] 2025-12-04 20:34 Слава: А ну логику да. Пишу я все равно плоха\n[392651] 2025-12-04 20:34 Миколай: потому что тебе нравится когда их насилуют?\n[392652] 2025-12-04 20:34 Миколай: не, не то как пишешь\n[392654] 2025-12-04 20:34 Миколай: как персонаж это реализует\n[392656] 2025-12-04 20:34 Миколай: ок\n[392657] 2025-12-04 20:35 Слава: Я не понял\n[392663] 2025-12-04 20:35 Слава: Нет. Потому что в моей голове эти глаза страшные. Страшнее просто белых или радужных\n[392667] 2025-12-04 20:36 Слава: Типа это вроде нормальный зрачок. Но если пригляделся то там словно движутся черви. Из-за возникает чувство отвращения, ну и чувство жути\n[392669] 2025-12-04 20:36 Миколай: как он лицо плавит? ну типа картина плоская, лицо объёмное\n[392670] 2025-12-04 20:36 Слава: Словно это что-то не понятное\n[392673] 2025-12-04 20:37 Слава: Преставился сферу из разных цветов и представь что с одной стороны он растаял во внутрь\n[392674] 2025-12-04 20:38 Миколай: а, ок\n```\n\n### Версия 3 — 2025-12-06\n\nвселенная: Оам (объявлено) · окно w0112 · сообщения 393312–393317\n\n*что здесь: Закреплён как второй из двух основных злодеев мира Оэм; появился недавно, каким именно злодеем будет — не решено*\n\n\n\n```chat\n[393312] 2025-12-06 17:53 Миколай: червивоглазых?\n[393313] 2025-12-06 17:54 Слава: Сестра, ну теперь дочь имитатора (Имита) \nВ вселенной правителя её целью было объединить миры и вызвать Апокалипсис. У неё даже есть своя группа злодеев. Ну теперь я не знаю какая у неё цель в мире Оэм. \nНе забывая что произойдет если апостол умрет.\nУмретли он просто или переродится чем то иным. \nУ меня было пара идей. Заставите одно из апостолов быть выженым пламенем Серафима. После это конечно он выживает, но теряет семя ( я так и сам не до конца понял, что это за семя. Ну можешь считать это источником их силы и быстрое адаптации) и после этого он уходит от Апостолов ( точнее сбегает не желая чтобы его братья видели, как он умирает.) и По итогу он умирает в домике в лесу. И становится чем-то другими. Чудовищем. Он нападает на графа, что нашёл его. И пытается его сожрать.\n[399527] 2025-12-17 22:14 Миколай: спокойно да может\n[399528] 2025-12-17 22:14 Миколай: ну он один из\n[399530] 2025-12-17 22:14 Слава: Ну как бы у нас Бог красок. И дочь \nХотя у Серафима уже понятно цель. Перезапустите человечества\n[399533] 2025-12-17 22:15 Слава: Ну это уже интересно 3 злодея. Двое из которых это иной уровень сил.\n[399534] 2025-12-17 22:17 Слава: К Богу красок я хотел подставить 4 главных последователя ( как их назвать?) \nОни будут одарены его  благословением и будут чудовищна сильные.\n[399536] 2025-12-17 22:17 Слава: И\n[399537] 2025-12-17 22:17 Слава: Где ответы?\n```\n\n## Неясности\n\n- (w0112) Характер, мотивация и роль в сюжете не придуманы; на 04.12 вселенная не названа, привязка к Оэм появляется только 06.12\n- (w0114) мотивы и планы не прописаны</div>"}];</script>
