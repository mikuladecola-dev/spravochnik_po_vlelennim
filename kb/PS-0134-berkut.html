<script>const BASE="../";const DOCNAME="Беркут";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Беркут\n\n*персонаж* · вселенные: монстры\n\n## Навигация\n\n- (w0050) Легендарный персонаж мобильной MOBA-шутера, материализовавшийся из детского желания. Териан-орнитотроп с настоящими крыльями, головой и видовым килем, говорит голосом игрового персонажа, зовёт летать и учит полёту. Уводит души детей, оставляя тела; после гибели Кирилла становится чистым злом и повторяет тот же сценарий уже насильно.\n- (w0051) Летающий монстр из истории Миколая, виновник массового суицида детей в городе, убитый Защитником. В этом окне раскрывается его происхождение: пародия на Ворона из Brawl Stars, порождение желаний мальчика Кирилла.\n- (w0052) Монстр, материализованный Кириллом: синтез персонажа из игры с чертами терианов и настоящими крыльями, мотив — научить летать. В этом окне имя всплывает только внутри вставленных в чат машинных разборов.\n- (w0054) Монстр из известной байки, которую Захар рассказал знакомому; обитает в определённом городе, с ним связана какая-то тёмная история. Спасатель утверждает, что изгнал его и защитил детей города.\n\n## Связано с\n\nДети и животные видят иной мир, Захар Авгур, Защитник, Кирилл, Материализация монстров из желаний и веры, Монстры и вера, Паша (Пашка), знающий, родитель, спасатель\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-08-10\n\nвселенная: монстры (объявлено) · окно w0050 · сообщения 217234–217240\n\n*что здесь: персонаж-монстр введён целиком в истории: происхождение из игры и фандома, облик, манера, механика увода души, превращение в чистое зло, финал спустя 3 года — небо для детей стало кисло-пурпурным*\n\n\n\n```chat\n[217234] 2024-08-10 07:49 Миколай: если что пишу новую\n[217235] 2024-08-10 07:49 Миколай: прям сейчас придумываю\n--- пауза 1.9 ч ---\n[217239] 2024-08-10 09:41 Миколай: дети и животные могут видеть мистических существ, а до 4 лет психического возраста их душа способна взаимодействовать с иным миром напрямую, поэтому если недоглядеть за ними их за руку могут увести монстры в мир иной и с вами останется лишь их физическая оболочка, так что нужно быть внимательнее\n\nв семье нашего главного героя всё под контролем, не было ещё такого, чтобы родители ругали ребёнка, а он разочаровывал их своим поведением. звать кстати, этого маленького человечка Кирилл. так вот несмотря на то, что ему 6 лет, почти 4 психических, это довольно спокойный и умный ребёнок. поэтому мама и папа почти не беспокоится за него и у них есть приличное количество времени на работу и личные дела. как только к нему попал в руки  планшет, Кирилл сразу увлёкся этим гаджетом, мог часами в нем сидеть не отрываясь. каждый раз приходя из заведения дошкольной программы он приходил в свою комнату и писал своему другу по парте Паше, чтобы поиграть в популярную нынче шутер мобу(MOBA) с ним по сети. и кстати, его радости не было предела, как только ему выпал из ящика долгожданный и любимый легендарный персонаж &quot;Беркут&quot;, он сразу захотел его попробовать в деле. после нескольких каток он с горящими глазами, пусть и утомлённый мечтал о том, как бы встретить его в реальной жизни. ну пока отвлечёмся, ведь помимо этого он ещё обожает листать короткие видео, в частности о терианах. да, Кирилл фанат этой субкультуры, но его смущает, что нету не одного териана орнитотропа, как минимум летающего. вот сидит этот парень в парке на скамейке с родителями и каждый раз как видит самолёт в небе кричит &quot;самолёт&quot;. Он хочет летать, познать всё величие этой вечно лазурной пелены небесной характерной для его региона. неудивительно, что Кирилл так восхищается этими грациозными созданиями. наш герой прочёл весь фандом той игры и очень влюбился в Беркута, знает все его особенности наизусть. конечно такое сильное желание встретиться с ним не могло не материализовывать это существо (понятное дело он не первый и не единственный, кто о Беркуте думает, так что это не уникальная материализация, точнее субъективное представление разное у всех, но так это не единственный в своём роде &quot;Беркут&quot; из той же игры, того же авторства. в нашем случае он не может не летать). так как мальчик не только в игре изучал его, синтез его видения в реальной жизни отличался, этот монстр был характерными для териана чертами, но настоящими крыльями и головой, даже точный видовой киль имеется. так вот сначала это были слухи которые в своей подгруппе на занятиях распространял Кирилл, мол видел он его, хотя очевидно это ложь. далее из подгруппы слух разнесли дальше. его облик на мгновение уже могли видеть психически маленькие носители информации и своей уверенностью и широким распространением  создавали более сильный и чёткий образ монстра, естественно добавляя ему негативных коннотаций. но пока его все боялись, поэтому никто не связывался с иным миром через него. пока ещё Кирилл его не видел, однако был единственный, кто не боится его и хочет встретить. и вот вчера когда родители, что-то обсуждают на кухне, наш герой услышав самолёт бежит на балкон, чтобы полюбоваться его красотой. вдруг к нему подпрыгивает на перила откуда-то снизу это существо так элегантно свернув свои огромные крылья. сидит и пялится в душу. конечно, Кирилл испугался, не то слово. он отпрыгнул к двери и закричал, хотя родители его не слышали. после он понял, кто у него перед глазами. он встал и молча смотрел на Беркута в шоке. и вдруг эта птичка голосом персонажа начинает звать его с собой, летать, это существо переняла его желания, в частности любов к нему. он сказал, что Кирилл сможет летать. тот коснулся его руки и он почувствовал её, посмотрел назад и увидел на свое спине крылья. Беркут его крепче хватает и зовёт в постигать прекрасные необъятные просторы неба, утверждает, что наш герой не разобьётся если будет держаться крепко, тот научит его искусству полёта. ну как можно отказаться от такого предложения сказанного кумиром который перед тобой, которого ты можешь коснуться и ты уже видел на, что он способен.\n[217240] 2024-08-10 09:41 Миколай: Кириллу страшно, но он с его поддержкой встаёт на перила, ужасаясь от высоты, ступает дальше и... и наш мечтатель, любитель полётов летит, не просто вниз, он возвышается, он держится за руку Беркута и не падает, тот учит его летать. пока они изучают небеса седьмой час и пока астрал Кирилла наполнен любознательностью, он задаёт миллионы вопросов и получает ответы, тем временем его физическая оболочка в бардовой субстанции и окружённая преисполнеными ужасом родителями потерявших почти самое святое что у них есть, отправляется в реанимацию. на там понятно его уже не вернуть, ведь его душа даже не подозревает, что его больше не увидят родные, а значит не сможет вовремя вернуться в тело. и вот он наигрался с Беркутом идёт домой, а там никого, сидит в планшете. когда ехал с родителями в школу они странно вели себя, всё время плакали и молчали. на занятиях он слышал краем уха какую-то недавнюю жуткую ситуацию, но больше пытался добиться внимания скучных лиц в кабинете. в конечном счёте от этой ерунды он ушел гулять с Беркутом и как только получил ответы на все вопросы его душа ушла на небеса, Кирилл всё понял, да уже поздно было. а вот этот монстр остался и конечно все приписывали ему ответственность за случившееся, ещё больше боялись, нет человека дарующего хоть малейшей позитивной коннотации его существования, вот тогда он стал чистым злом, о нем знал весь интернет после того случая. ему надо же реализовать свою суть, поэтому он в любых условиях старался воспроизводить тот сценарий с теми кто его видит, пусть уже насильно, ему мало было полетать. тогда на балконы массово стали ставить ограждения от детей, но не все могли это позволить. и однажды друг Кирилла - Пашка, захотел избавиться от него, отомстить за товарища и остальных. он наш
