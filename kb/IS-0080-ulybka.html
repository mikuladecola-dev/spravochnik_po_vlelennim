<script>const BASE="../";const DOCNAME="Улыбка";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Улыбка\n\n*история* · вселенные: вне вселенной\n\n## Навигация\n\n- (w0110) Рассказ С из пролога и главы «1 начало мира» в трёх сообщениях: пролог с запретами (нельзя пить чай, есть, смотреть в зеркала) под стук в дверь; затем ночное сообщение с неизвестного номера, аватарка-смайлик, фото домика в лесу с мордочкой в окне, встреча брата на вокзале, улыбающаяся толпа, падение с перрона и больница.\n\n## Связано с\n\n«Здесь нельзя плакать. Нельзя грустить... живи и улыбайся», Миша, Нумерация присланных историй (Первый, Второе, Третье, Четвёртое, Пятая), Улыбающийся (неизвестный номер)\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-11-21\n\nвселенная: вне вселенной (разбор «неясно») · окно w0110 · сообщения 387587–387590\n\n*что здесь: Пролог и первая глава, помечено маркером «Четвёртое»; дальше в окне не продолжается*\n\n\n\n```chat\n[387587] 2025-11-21 18:19 Слава: Улыбка\nПролог\nНет. Нельзя пить чай. Иначе ты вспомнишь, те детский времена, когда ты мог кричать всей силой детского горла. И упиваться до ужаса сладками напитками. Где ты мог... Стук в дверь. Они здесь. Нет не бойся, только знай:\nНельзя есть. Иначе ты вспомнишь запах, до ужаса далёкий. Но такой родный. Запах выпечки, что доставало самая добрая женщина в мире. И тогда они точно сломают эту хлипкую дверь и ты не сможешь. Нет не бойся, только знай:\nНельзя смотреть на зеркала. Ведь ты до ужаса похож на брата и отца. Они ведь оба были, куда смелее тебя. Почему были? Они же и сейчас есть ДА. Я не знаю, а стук в эту ржавую, холодную дверь всё не утихают.\n Я пытаюсь закрыть эти чертовв дырки на моём лице, чтобы не слышать стук. Но не получается. Словно стук идёт не оттуда, а изнутри \nНет не пытайся. Не делай этого. Ведь ты вспомнишь, о тех хороших временах. И не выдержишь за ревёшь. И даже если выдержишь. Лицо твой не улыбнётся, а если ты не улыбнёшься, когда они придут. То вини лишь себя и не надейся, что кто нибудь поможет . Ведь никто палец об палец, здесь не ударить, чтобы помочь тебе. \n \n1 начало мира \n&quot;Здесь нельзя плакать. Нельзя грустить. Нельзя чувствовать боль. Живи и улыбайся. Ведь в этом счастье&quot; Вот такой сообщения, я получил в 2 часа ночи. Сначала конечно подумал, что сон приснился ночью. Про то, что какой-то неизвестный номер написал мне этот бред. Признаться честно, когда тебе это пишут в 2 часа ночи, то как бы ты не хотел. Но спинай мокрой станет. Да и уснуть после этого нормально не мог. Плюсом аватарка у него стремная. \nСмайлик да не обычный, а натуральные. Я имею ввиду, что в этом рисунке смайлика больше деталь, чем на человеческом лице. Всё эти складки, прыщи с гноем. И всё 32 зуба нарисованный с такими большими деталями, что казалось они тоже улыбаться. А эти глаза, в которых едва видимо шли слезы и сама улыбка. В ней не было ничего искреннего. Словно, кто-то насильно заставлял его улыбаться. Натягивает его улыбку и держит глаза. От этого даже у меня начались порывы опустошить желудок. И некая жалость. Я даже хотел сохранить эту аватарку. Показать друзьям. А потом забыть об этом. Спустя, какой-нибудь время. \nЗабыл, если бы он не отправил фотку. Не подумайте там не был мой дом или дом моих близких. И там не было сверх мерзостей, что не давало бы мне уснуть. \nТам был просто домик. Деревянные домик, в лесу и все. Хотя вру, не все. Там как бы было мордочка, которая как бы есть, и которой как бы нет. \nМордочка с улыбочкой в окне этого дома для охотников. Ну или для егеря или кого ещё там. \nМорда вроде, как человека. Но взгляд, этот пиксельный взгляд не давал мне покоя. Словно хищник на меня смотрит. Нет не то. Взгляд более заинтересованый, выжидающе и зовущие и что то ещё. То что я понимаю,  но не могу объяснить. То что вызывает у меня дрожь и непонятное чувство беспокойство. Словно я что-то сделал и исправить уже не могу. \nКак я хочу забыть взгляд то ли молящий, то ли выжыдающий, то ли хищный. Он застрял у меня в голове, такой взгляд просто тяжело забыть. \nНадо удалить фотку. Лучше вообще заблокировать этот контакт. Не зачем лезть в эту фигню. Но мой взгляд всё равно смотрел на телефон. Я смотрел в чёрной погасший экран и видел своё отражение. Видел свои коричневые глаза и густый брови, в которых могли бы затеряться тараканы. О чем это я. Повертел головой и на всякий случай покапавшись в бровях. Может там и правда таракан. Я благо ничего не нашёл. Но некая стремная чувство, что там что-то есть. Не отпускала. Встав и быстрам шагам идтя до ваной. Я на последок оглянулся и мой взор всё также уставился на телефон. \nЗайдя в ванную, я щедро облил себя холодной водой. На удивления вода оказалось холодной. Куда холодней, чем я ожидал. Я сразу пришёл в себя. \nПосмотрев зеркало я вздохнул. Ладно всё, куда я там собирался, а точно брата надо встретить. \nПосле 2 лет разлуки. Впервые с ним увижусь, нет мы конечно переписывались и все дела. Но встреча лицом к лицу, куда более живее, как бы смешно это не звучало. Поэтому надо собираться.\n[387588] 2025-11-21 18:19 Слава: Кое как собравшись. Никак не мог завязать шнурки. Они словно змеи двигалась и не давали себя схватить, а когда удавалось, то они брыкались. Словно я их убивать собираюсь. А когда я еле-еле, как завязывал. Они прям на глазах у меня распутывались, как будто бы правда живые. В конце концов я всё же победил. И крепко, на крепко их завязал. \nЛадно перейдем к сути. \nЖдал я своего брата. На перрони захудалого вокзала, который был старшей всех в этом городе. \nВдруг послышалось шум старого поезда, что тянул за собой несколько тонный вагоны. Пыхтел и кашлял поезд. Словно сейчас развалится. Но не на понятной силе держался. Принеся он передо мной. И я даже слегка удивился. Нет, не тому, что он докатился до меня. А от того, что вагоны выглядели новенькими, чистыми, как будто вот только, что их сделали. С электрическими дверями и тому подобное. \nСмотрел я, как эти вагоны проносили передо мной всё медленнее и медленнее. И вспоминал &quot;какой же у него вагон. Вроде, как он писал, а вроде и нет&quot;\nВ этой бы ситуации лучше, что можно сделать- это просто достать телефон. Но я забыл его дома, на кровати. Поэтому я начал  просто вглядываться в окна вагонов, чтобы увидеть лицо своего друга.\nК сожалению вместо лица своего брата. Я увидел, на долю секунды. Улыбающийся лицо и этот взгляд. Пронзающий словно душу, этот взгляд говорит об бесполезности всего. Я сразу отскочил в сторону и наступив на свои развязывающий шнурки. \nЯ не смог удержать равновесия. И всей массой своего тела ударился от бетонные перрон. В голове сразу загудела, зазвенела, а в глазах начали мерцать звёздочки. Голова пульсировало, в неё словно залили горячую воду и она вот-вот хлынет наружу. Горячее всего было на затылке и пульсировало там словно одна большая вена, что порвалась и из неë вытекает горячая жидкость по голове. \nНа трясущихся ногах. Я кое-как встал. В глазах всё мутила и плыло. Из-за этого закружилась голова и я чуть снова не упал. Но смог удержаться. \nЯ услышал хохот. &quot;Чево серьёзно им смешно, что я чуть не упал&quot; Подумал я поднимаю голову. В глазах до сих пор всё плыло. Но даже так я увидел, как толпа вокруг меня улыбаються. Смеются и осторожно, выступив руки вперёд подходят ко мне. Я прикрикнул, и от этого в голове пронеся эхом мой же голос. Он ударялся об стенке черепа и возвращался причиняя боль. \nЯ  прикусил губу, чтобы снова не завыть, а они смеялись и походили. Эти расплывчатый фигуры. С натянутой улыбкой. Всё приближались. Я отступал от них. Неуверенно, неспеша я отходил от этих уродов. Помогите, хоть кто-нибудь. Хоть кто. \nТелефон, где он, где он!!! \nНа моём лице выступили едва видимый слезы отчаяния. Да, что здесь происходит. \nВдруг из толпы резко, кто-то выпрыгнул и быстрым шагом направился ко мне. Я испуганно сделал пару шагов назад. И ещё один шаг. Но теперь я не ощутил бетонного перрона. Там был просто провал. Тела уже начало наклоняться в сторону  и я начал падать. Я за жмурил глаза со всей силы, что заставило голову лишь больше пульсировать. Я уже был готов удариться об поезде или полностью провалиться в яму. \nНо крепкая мужская рука схватила меня за грудки и потянула на себя. На столь резко, что я и моё спаситель плюхнулась на бетон. \nЯ начал отворять веки. Но свет мне мешал их полностью открыть. Кто-то резко схватил меня за плечи. \n-Эй, эй ты меня слышишь Миша. С тобою всё хорошо. Ай да о чем это я. Вставай поехали в больницу- быстро пролепетал знакомый голос. В моей горячей голове сразу возник образ обладатель того голоса. Брат, кто же ещё мог словно мать так лепетать вокруг взрослого мужчины. Хоть и раненого. \nОн грубо подхватил меня за подмышки, что вызвало у меня гологружения. Словно боялся, что я снова попытаюсь спрыгнуть с перрона, либо убежать. Дальше я особо ничего и не помню. \nПомню, как мы сели в машину. А дальше всё пустота. Как сказал брат позднее. Я просто отрубился. Благо снов никаких не было, а то ещё не хватало бы. Хотя вообще бывают сны после потери сознание. Нет наверное.\n[387589] 2025-11-21 18:19 Слава: Очнулся я уже в больнице. С сотрясением мозга. Ну и с гудящей головой. Благо болело уже не так сильно. А то я бы точно не выдержал. \nОчуховшись немного. Я впал ступор слегка. На соседней койке спал мой брат. Вот прям в одежде уснул и всё. Надеюсь он с этой койки не кого не выгнал. Ха. Голову пронзила боль от моего мелкого смешка. \nНа это же проснулся мой брат. \n- че смеёшься? - сказал он сонным голосом. Попутно протирая глаза. \n-да думаю. Не выгнали ты кого с койки- признался я честно. \n-о себе лучше подумай. На ровном месте упал. Ещё так сильно- произнёс брат вставая и подтягиваясь. \n-голова не болит?- спросил он. \n-да нет уже- слегка соврал я. \n-ладно. Тебе кофей взять? - спросил брат выходя из палаты.\n[387590] 2025-11-21 18:19 Слава: Пятая\n```\n\n## Неясности\n\n- (w0110) Вселенная не названа</div>"}];</script>
