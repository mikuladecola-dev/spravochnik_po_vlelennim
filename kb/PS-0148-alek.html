<script>const BASE="../";const DOCNAME="Алек";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Алек\n\n*персонаж* · вселенные: монстры\n\n## Навигация\n\n- (w0054) Главный герой истории Славы от первого лица: студент 4 курса, живёт один в однокомнатной квартире. После встречи с незнакомкой в ресторане теряет память, а через десять дней начинает видеть сон, в котором от него гонится рука.\n\n## Связано с\n\nнезнакомка из ресторана, рука\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-08-21\n\nвселенная: монстры (по дате объявления) · окно w0054 · сообщения 222143–222143\n\n*что здесь: Первое появление: возраст/статус, речевая манера, потеря памяти, записка и пропавший мусор, обход врачей, начало снов.*\n\n\n\n```chat\n[222143] 2024-08-21 22:00 Слава: Здравствуйте ну или привет, а блин ладно здорова. Я чел которому не повезло или наоборот повезло это как смотреть. Ну ладно звать меня Алек. Студент 4 курса. Живущий в свое однокомнатной квартире. Парень я вроде не плохой. Жил не тужил до одного дня. Решил я передохнуть от учебы в субботу. Ну на голодной желудок как то не отдыхается. И решил сходить в ресторанчик рядом с моим домом. Ну пошел, заказал  какой-то супчик, честно слово не помню, у нее какой то названия странная. Ладно не суть. Вот сижу хаваю. Как замечаю что на меня кто то зырит, вот буквально зырит, пожирает взглядом. Смотрю, а там ниче себе модможелей, ну на 20. И как бы чё делать как да на тебе красивая баба смотрит. Не знаете. Вот и я не знаю, и как еблан продолжил кушать. Сижу почевкаю супом, как вдруг эта модмажель подсел ко мне.  Ну здесь я вообще полностью приболдел. Ну быстро успокоившись, начал активничить. Ну и вот мы разговорились как она предлагает пойди ко мне домой. Ну здесь мне слегка сыкотной стало, как бы ко мне подс
