 монстра.\n2.1.2. при минимальных условиях, что чаще всего, монстр минимально может взаимодействовать с миром духов при 10 знающих\n## всегда идет стремление к идеалу. в идеале монстр может полностью взаимодействовать в духовным и реальным миром, а также совершать манипуляции различного характера на всех уровнях соответствующие его мотивам\n2.2. влияние качества\n2.2.1. сила реализации мотивов геометрически пропорциональна силе вклада знающих\n2.2.2. сила способностей геометрически пропорциональна эмоциям знающих\n## качество вклада знающего обнуляется если он начинает рационализировать силу своих и чужих влияний \n3. что такое материализованый монстр\n3.1. дух действующий в соответствии с один мотивом и сценарием сформированным консенсусом хаоса\n3.2. существо создание коллективным бессознательным\n4. из чего состоит жизнь материализации\n4.1. изменения под влиянием представления\n4.2. стремление воплотить мотивы родителя\n4.3. его материализация это духовное тело с которым можно взаимодействовать на духовном уровне\n4.4. жизнь существа поддерживается родителем, если его не будет или он изменит мотивы, монстр навсегда исчезнет если развеять форму даже если остались знающие\n4.4. при отсутствии знающий жизнь также перестаёт поддерживаться\n5. злой дух\n5.1. после первого нарушения одной заповеди дух становится злым\n5.2. злой дух реализует мотивацию родителя через аморальные методы\n[218394] 2024-08-12 16:57 Слава: Во всех этих правилах мне не нравится именно вера других людей\n[218395] 2024-08-12 16:58 Слава: Типо злой челик решит показать своего монстра по телеку или Ютуб и все начнут в него верить\n[218396] 2024-08-12 16:59 Слава: И  моснстор сразу может стать бог\n```\n\n### Версия 2 — 2024-08-12\n\nвселенная: монстры (по дате объявления) · окно w0052 · сообщения 218410–218414\n\n*что здесь: упоминание взрослых, в чью жизнь вмешался злой дух, — в перечислении тех, кто может видеть монстров*\n\n\n\n```chat\n[218410] 2024-08-12 17:03 Миколай: .\n[218411] 2024-08-1
