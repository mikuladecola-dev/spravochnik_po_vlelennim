<script>const BASE="../";const DOCNAME="Новый главный герой";

const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Новый главный герой\n\n*персонаж* · вселенные: Падения небес\n\n## Навигация\n\n- (w0023) Слава одним длинным сообщением излагает биографию нового главного героя: продан родителями в организацию, где из него ковали героя, срыв на пресс-конференции и резня, а после — высокомерный чсв, ломающий все правила. Миколай отвечает разбором и уточняет структуру повествования, Слава отвечает «Флэшбек».\n\n## Связано с\n\nКомикс Славы\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-01-18\n\nвселенная: Падения небес (по дате объявления) · окно w0023 · сообщения 92316–92338\n\n*что здесь: первое изложение: продан родителями в организацию, побои и промывка мозгов, потеря команд и бессонница, встреча с женщиной, говорившей о свободе, и её убийство, срыв на пресс-конференции, резня и уход; вторая половина жизни — высокомерие, нарушение правил, спасение людей под отговорки, цель уничтожить организацию, потому что таких воспитанников много*\n\n\n\n```chat\n[92316] 2024-01-18 10:07 Слава: Новый гг его история обычный мальчик который собственный родитель продали в организацию где его воспитывали как героя ( сразу нет с ним там не сусукались его избивали , тренировали сутками напролет за каждую ошибку строго наказывали и промывали мозги ) так он вырос и наконец-то вышел на сцену ( то бишь в мир ) там он сам себя убедил что быть героем хорошо . Нет он не просто спасал людей, его посылали в самую жопу где он чуть не полыхал терял команду плюсом ко всему этому ему не давали передышку и даже спать он мог неделями не спать. В конце концов он встречается с человеком который говорит быть свободным но после он её убил так как она заразилась чем-то или типо того и вот пресс конференция где журналисты пытаются его обвинить в гибели уже 10 команды ( ведь журналистом нужна сенсация ) и вот гг со  от недосыпа и непонимания почему с ним так и от накопившего стресса срывается и устраивает резну после уходя в закат \nВремя спустя вот гг уже другой он стал высокомерным ( так как считает людей лицемерами из за прошлого) и он чсв и он старается нарушить все правила ( ведь раньше ему все запрещали ) ну у него до сих пор есть травмы , и также он часто спасает людей давая отговорку типо меня просто раздражала или из-за этого могло что-то произойти , и вот он узнал что его не одного воспитывали по той методики и он решил уничтожить организацию\n[92317] 2024-01-18 10:08 Слава: У меня сейчас в ушах начали звонить чаще и раза 4 громче\n[92318] 2024-01-18 10:09 Слава: Хотя я наушник вообще перестал надевать максимум на 40 минут могу надеть в день и все\n--- пауза 5.1 ч ---\n[92330] 2024-01-18 15:16 Слава: Привет\n[92331] 2024-01-18 15:17 Слава: А в той библиотеке который ты ходишь книжек по анатомии нету ?\n[92333] 2024-01-18 15:40 Миколай: Врд нет, я не смотрел\n[92334] 2024-01-18 15:40 Миколай: Сорян телефон был разряжен\n[92335] 2024-01-18 15:40 Миколай: А на сообщения выше позже\n[92337] 2024-01-18 16:34 Миколай: Ну персонаж хорошо проработан, однако хочу уточнить, в самой работе (произведении) он уже взрослый и просто потом покажешь его прошлое вкратце или будет проходить этап взросления? А вообще персонаж интересный, но чуток заурядный, однако пусть такой и останется, все норм, так и должно быть\n[92338] 2024-01-18 16:37 Слава: Флэшбек\n```\n\n### Версия 2 — 2024-01-18\n\nвселенная: Падения небес (по дате объявления) · окно w0023 · сообщения 92337–92345\n\n*что здесь: уточнение подачи: в произведении герой уже взрослый, прошлое даётся флэшбеком; Миколай считает персонажа проработанным, но заурядным, и предлагает таким и оставить*\n\n\n\n```chat\n[92337] 2024-01-18 16:34 Миколай: Ну персонаж хорошо проработан, однако хочу уточнить, в самой работе (прои
