<script>const BASE="../";const DOCNAME="Имитатор";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Имитатор\n\n*персонаж* · вселенные: 7 островов, Апостол, Оам, Цветной мир, вне вселенной, игра бога\n\n## Навигация\n\n- (w0032) Слава мимоходом сообщает, что у него есть персонаж имитатор, в ответ на слово «метаморф». Одно упоминание, 166879.\n- (w0035) Один из сильнейших существ вселенной, напарник спартанца. Позже уточняется: человек (во вселенной пока все люди) и слабее командира.\n- (w0041) Защитник острова Оазис, держит на себе и оборону, и политику острова. Союзник Нуара, при нём есть помощник.\n- (w0042) Защитник Оазиса, персонаж Славы. В окне даётся словесное описание, затем карточка с характеристиками, потом биография (война, отряд, семья) и связи с другими защитниками.\n- (w0044) Вместо имитации чужих способностей видоизменяет их и создаёт множество новых — фактически может сам придумывать способности. Внешне похож на серафима, но не полноценного. Может пользоваться гранью, по силе стоит рядом с Нуаром.\n- (w0066) Мужчина, владелец глаз. Структура у него так и не сформировалась — вместо неё частицы, отсюда плохой контроль и малый запас энергии, и при этом он один из сильнейших (звание носят около 400 человек). Учёный: раскрывает тайны энергии, структуры, сосуда и биологии монстров, пишет книги, продаёт свои техники, делает артефакты, мастер рукопашного боя.\n- (w0072) Благословенный со способностью имитации; в каталоге с приписками (ветреной 🌬; электро ⚡; птичка 🔈).\n- (w0073) Третий номер команды против Серафима и, как выясняется по ходу, главный герой. Самый живучий при прочности ниже, чем у Воительницы.\n- (w0082) Апостол, спасающий Максима в 305116: мужчина 20-30 лет в белой рубашке и чёрных брюках, симметричное лицо, белые светящиеся глаза, убивает белой цепью и взрывом изнутри, вербует Максима в агенты, едет к новому апостолу &quot;защитнику&quot;. Замысел образа обсуждается в 305424-305437.\n- (w0083) Апостол в белой рубашке и тёмных брюках, лет 20-30, настоящего имени не называет и, возможно, сам его не помнит. Объясняет защитнику устройство миров и благословений, ведёт основной бой против ангела и упыря.\n- (w0104) 2025-09-12 упомянут одной строкой как исключение: остальные апостолы делают упор в определённые способности, «не считая Имита».\n- (w0106) Один из апостолов, назван в ответе на вопрос о дальности чувств: вместе со Звездочётом может почувствовать нечто на другом конце света, если сконцентрируется.\n- (w0107) Персонаж, повторяющий чужие способности; в этом окне — сцена, где он в бою понимает, как использовать способность пепельника. Упоминался и раньше (w0106, 370842, вместе со Звездочётом), то есть к миру Оам отношения, судя по всему, не имеет.\n- (w0108) Упомянуто «особое усиление Имитатора», которому пробовали обучать Палачей и отказались из-за высокой смертности.\n- (w0109) Упоминается как отец &#x27;сестры&#x27; — главы одноимённой группировки. Сам по себе в окне не описан, известен по прежним окнам (усиление Имитатора).\n- (w0112) Апостол, отец главной злодейки; &#x27;Имит&#x27; — сокращение от &#x27;Имитатор&#x27;. Грех Чревоугодия — голоден до знаний. Жив, никуда не исчезал, возможно будет главным героем; для правительства именно он представитель апостолов.\n- (w0120) Разбор Славы: высокомерный чёрт, ключевой персонаж каждой вселенной, издевается над противниками, даёт им выложиться и в конце имитирует их способность и превосходит в мастерстве. Миколай отвечает, что таких имбалансных лучше держать эпизодически.\n- (w0121) Апостол, фигура старшего брата и архетип учёного. В окне сначала пересылается его старая карточка «Имитатор», затем С полностью переписывает персонажа под новый мир.\n\n## Связано с\n\n«Я не умру пока не кончится энергия», Агрегат, Ангел, Апик, Апостолы, Артефакты (структура в предмете), Белые глаза, Босс группировки дочери, Братья и сёстры (благословенные одним правителем), Вибрация (Волнистый удар), Воительница, Волнистый удар, Глаза Имитатора, Грань, Группировка сестры, Доима (дочь Имета), Дочь Имитатора, Жидкая масса (инструмент Имитатора), Защитник, Защитник Асгарда (Избранный), Звездочёт, Имитация, Имитация (способность Имитатора), Имитация способностей, Командир, Кукловод, Максим, Материализация, Маура, Нуар, Оазис, Оам, Особое усиление, Особое усиление (ОУ), Отряд Имитатора времён 8-летней войны, Отряд сильнейших, Палач, Палачи, Пепельный человек, Перерождение Имитатора, Помощник Имитатора, Программа в голове (конструкция Оам), Свободное придумывание способностей апостолами, Серафим, Серебряная жидкость, Смотрящий, Сосудники (сосуд и структура), Спартанец, Удар разрушающий структуру, Упырь-рассказчик, Частицы вместо структуры\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-05-07\n\nвселенная: игра бога (по дате объявления) · окно w0032 · сообщения 166876–166882\n\n*что здесь: Упомянут факт существования персонажа; никакого описания не даётся.*\n\n\n\n```chat\n[166876] 2024-05-07 21:05 Миколай: Тут скорее подойдёт термин метаморф\n[166877] 2024-05-07 21:05 Миколай: Че как?\n[166879] 2024-05-07 21:06 Слава: Ну у меня есть персонаж имитатор\n[166880] 2024-05-07 21:07 Слава: А так там особой идей нету но зато я понял что просто кидать сильных персонажей в один отряд глупо тем более если их ний силы друг другу не подходят\n[166882] 2024-05-07 21:07 Миколай: Ну есть такое\n```\n\n### Версия 2 — 2024-05-25\n\nвселенная: Цветной мир (объявлено) · окно w0035 · сообщения 173135–173140\n\n*что здесь: Появление: «имитатор один из сильнейших существ в той вселенной», напарник — спартанец.*\n\n\n\n```chat\n[173135] 2024-05-25 14:01 Слава: Когти скорость инстинкты регенерация\n[173136] 2024-05-25 14:02 Миколай: А спартанец?\n[173137] 2024-05-25 14:03 Слава: Кстати спартанец напарник имитатор ( имитатор один из сильнейших существ в той вселенной ) и вот какую дать способности спартанцу \nОн будет ходить полностью голый только в железных ботинках, трусах и в шлеме\n[173138] 2024-05-25 14:04 Слава: ⁉\n[173139] 2024-05-25 14:04 Миколай: Ну\n[173140] 2024-05-25 14:05 Миколай: Есть 2 концепции известные\n```\n\n### Версия 3 — 2024-05-25\n\nвселенная: Цветной мир (объявлено) · окно w0035 · сообщения 173222–173232\n\n*что здесь: Уточнение: имитатор всё-таки человек, «там все люди, пока что»; имитатор слабее командира.*\n\n\n\n```chat\n[173222] 2024-05-25 14:47 Миколай: Это человек\n[173223] 2024-05-25 14:47 Слава: Да\n[173224] 2024-05-25 14:47 Миколай: Ща\n[173225] 2024-05-25 14:47 Миколай: имитатор один из сильнейших существ в той вселенной\n[173226] 2024-05-25 14:47 Миколай: Тобиж не человек\n[173227] 2024-05-25 14:47 Слава: Человек\n[173228] 2024-05-25 14:47 Миколай: ?\n[173229] 2024-05-25 14:47 Слава: Там все люди\n[173230] 2024-05-25 14:48 Слава: Пока что\n[173231] 2024-05-25 14:48 Слава: Имитатор слабей командира\n[173232] 2024-05-25 14:48 Миколай: Вообще есть аниме по манге ветролом\n```\n\n### Версия 4 — 2024-07-03\n\nвселенная: 7 островов (объявлено) · окно w0041 · сообщения 194774–194777\n\n*что здесь: Заявлен как защитник Оазиса и как образец, по которому нужно придумать защитников остальным островам.*\n\n\n\n```chat\n[194774] 2024-07-03 18:58 Слава: 7 островов \n1 оазис ( Имитатор )\n2 ??????( Нуар ( челек с растворением личности ))\n3 асгар ( Избранный ( ты его не знаешь))\n[194775] 2024-07-03 18:59 Слава: Остров это город ну или страна\n[194776] 2024-07-03 18:59 Слава: 3 есть\n[194777] 2024-07-03 19:00 Слава: Надо 4 и у них должен быть защитник типо Иметатора\n```\n\n### Версия 5 — 2024-07-03\n\nвселенная: 7 островов (объявлено) · окно w0041 · сообщения 194833–194838\n\n*что здесь: У Имитатора есть помощник — человек с разными цветами глаз и двумя способностями.*\n\n\n\n```chat\n[194833] 2024-07-03 19:24 Слава: У имитатор помощник есть\n[194834] 2024-07-03 19:24 Миколай: да, ти
