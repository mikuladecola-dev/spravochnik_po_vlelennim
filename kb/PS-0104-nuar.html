const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Нуар\n\n*персонаж* · вселенные: 7 островов, Оам\n\n## Навигация\n\n- (w0041) Защитник второго острова, «челек с растворением личности», работает с тьмой. По ходу разговора его остров решают отправить под воду, где тьма держит воду как барьер. Хороший человек, не наёмник, союзник Имитатора.\n- (w0042) Защитник, к которому авторы переходят в конце рабочей части окна. Лентяй, «всем сопровляеь солнышко», стал защитником из-за солнышка; союзник Имитатора. Слава ссылается на более раннее описание и отказывается повторять.\n- (w0043) В этом окне присутствует как воля, управляющая тьмой на подводном острове: тьма насыщается и убирает лишнее «по воли нуара». Сам по себе не раскрывается, лор был отослан к более раннему разговору ещё в w0042.\n- (w0044) Держит барьер острова круглосуточно; объясняется это невероятно большим сосудом, развитым с рождения, и тем, что он не один — у него две личности, вторая и есть его грань. Единственный, кто обходит недельный откат после грани, потому что иначе остров пропадёт.\n- (w0066) Упомянут в перечне сильнейших вместе с Имитатором, Палачом и Смотрящим. В этом окне не раскрыт.\n- (w0109) Старый персонаж — &#x27;сильнейший из 7 островов&#x27;. В этом окне встроен в новую иерархию: он один из девяти котов и влияет на мир волнами.\n- (w0112) Кот, один из трёх сильнейших существ мира Оэм. Отсылка на &#x27;Семь островов&#x27;, где персонаж с этим именем уже был.\n- (w0120) Первый искусственный сверхчеловек Нимба, не стареет, один из шести столпов героев. Владеет несколькими способностями: кровь, слова, молния, тьма. Слава специально говорит, что в этот заход только добавил пару способностей и улучшил тьму.\n- (w0121) Сильнейший из столпов, не хотел светиться и напоминать людям, насколько сильны ИС. В окне уточняется его место в силовой иерархии, участие в инциденте с дырой между мирами и даётся сцена его срыва после боя с Фатикой.\n\n## Связано с\n\n7 островов и их защитники, Апостолы, Грань, Граф, Изб, Изменение мира волнами, Имитатор, Инквизиторы, Конфликт из-за вывоза мусора, Коты, Кровь, Молния, Нимб, Оам, Особое усиление (ОУ), Остров Нуара (подводный), Остров на дне океана (сфера), Палач, Серафим, Система сил (сосуд), Слова, Смотрящий, Солнышко, Тьма, Тьма Нуара, Уровни сил 1-10, Фатик, Человек со способностью солнца\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-07-03\n\nвселенная: 7 островов (объявлено) · окно w0041 · сообщения 194774–194776\n\n*что здесь: В исходном списке: второй остров без названия, защитник Нуар — человек с растворением личности.*\n\n\n\n```chat\n[194774] 2024-07-03 18:58 Слава: 7 островов \n1 оазис ( Имитатор )\n2 ??????( Нуар ( челек с растворением личности ))\n3 асгар ( Избранный ( ты его не знаешь))\n[194775] 2024-07-03 18:59 Слава: Остров это город ну или страна\n[194776] 2024-07-03 18:59 Слава: 3 есть\n```\n\n### Версия 2 — 2024-07-03\n\nвселенная: 7 островов (объявлено) · окно w0041 · сообщения 194812–194821\n\n*что здесь: Предложение отправить Нуара под воду; тьма держит воду как барьер; если он умрёт — острову конец; М допускает, что он не единственный такой.*\n\n\n\n```chat\n[194812] 2024-07-03 19:18 Миколай: может нуара под воду пошлём? там темноты дохуя\n[194813] 2024-07-03 19:19 Миколай: а то хули в небе есть кто-то, а ниже уровня земли нету никого\n[194814] 2024-07-03 19:19 Слава: Вообще интересная идея\n[194815] 2024-07-03 19:20 Слава: И тьма будет держать воду как барьер\n[194816] 2024-07-03 19:20 Миколай: ага\n[194817] 2024-07-03 19:20 Слава: Вот только если он сдохнет будет пиздец острову\n[194818] 2024-07-03 19:20 Миколай: важный вопрос, а вот тьма это миазмы?\n[194819] 2024-07-03 19:20 Миколай: да\n[194820] 2024-07-03 19:21 Слава: Миазмы ?
