<script>const BASE="../";const DOCNAME="История про спасение тринадцати суицидников";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># История про спасение тринадцати суицидников\n\n*история* · вселенные: Оам\n\n## Навигация\n\n- (w0107) Замысел Славы: человек хочет покончить с собой, но боится ада, поэтому решает по-настоящему спасти тринадцать самоубийц (не просто предотвратить, а вернуть к счастливой жизни), рассчитывая, что тогда рай ему зачтётся; в финале гг обязан совершить самоубийство. Мира вокруг нет, сюжет самостоятельный.\n- (w0108) Замысел Славы (объявлен в предыдущем окне): человек хочет покончить с собой, но боится ада, поэтому спасает 13 самоубийц, считая, что это откупит ему рай. В этом окне идёт разбор написанного нейронкой текста и переработка.\n\n## Связано с\n\nКатя, Михаил\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-10-20\n\nвселенная: Оам (по дате объявления) · окно w0107 · сообщения 376583–376591\n\n*что здесь: Формулировка замысла плюс объяснение, зачем: Слава хотел прочесть историю, где гг всех спасает, сам страдает и в конце умирает, без утешительного разворота, который есть в других произведениях. Отдельно оговорено, что тема слишком длинная и он, возможно, напишет сам, но позже.*\n\n\n\n```chat\n[376583] 2025-10-20 20:34 Слава: Нейросеть попросил написать историю\n[376584] 2025-10-20 20:34 Слава: Можешь написать историю. Про человека, что хочет совершить суицид но боится попасть в ад. Из-за этого он решил спасти суицидников 13 людей и думал, что раз он спас 13 людей то даже если он совершил суицид он попадёт в рай. \nСпасти подразумевается не просто там предовратить это. А сделать так чтобы этот человек смог продолжить жить счастливой жизнью без мысли о самоубийстве\nГг в конце обязан совершить суицид.\n[376585] 2025-10-20 20:35 Слава: Такой я сам хуй напишу\n[376586] 2025-10-20 20:36 Слава: Просто мне всегда хотелось почитать, что подобное. Где гг всех спасает но страдает сам и в конце помирает. \nВ других произведениях да гг может страдать пока помогает, но всё это такое временное. После тот кого он спас даёт ему наставления или помогает и гг больше не страдает и это минус для меня\n[376587] 2025-10-20 20:37 Слава: Хуево написал историю нейросеть. Без эмоции и коротко\n[376588] 2025-10-20 20:38 Слава: Типо я не хочу брать эту тему потому что она будет дохуя длиной\n[376589] 2025-10-20 20:38 Слава: А я как я уже понял не умею писать длинный истории\n[376590] 2025-10-20 20:38 Слава: Возможно сам напишу\n[376591] 2025-10-20 20:38 Слава: Но позже\n```\n\n### Версия 2 — 2025-10-20\n\nвселенная: Оам (по дате объявления) · окно w0107 · сообщения 376624–376633\n\n*что здесь: Договорились, что Миколай попросит нейросеть заново, «в хорошую кинуть» или спросить иначе.*\n\n\n\n```chat\n[376624] 2025-10-20 20:48 Миколай: ну я могу в хорошую кинуть\n[376626] 2025-10-20 20:48 Миколай: или попросить иначе\n[376628] 2025-10-20 20:49 Слава: Ну ок\n[376629] 2025-10-20 20:49 Слава: Давай\n[376633] 2025-10-20 20:49 Миколай: ну ток позже, я щас отвечу в тг ещё\n```\n\n### Версия 3 — 2025-10-22\n\nвселенная: Оам (по дате объявления) · окно w0108 · сообщения 377279–377301\n\n*что здесь: Слава разбирает текст: похоже на скелет, мысли и действия есть, но не целостно и коротко; концовка не понравилась — не хотел божественного существа и итоговых мыслей ГГ, ждал, что ГГ сдох, а его дневник о спасении других найдёт кто-то другой, и мы увидим мысли Кати, узнавшей, что Михаил был анонимным спасителем, и сожаления других спасённых. Ад в замысле означал только мотивацию ГГ*\n\n\n\n```chat\n[377279] 2025-10-22 07:05 Слава: Прочитал\n[377280] 2025-10-22 07:09 Слава: Знаешь это похожа на скелет. То есть главный мысли действия там есть. Но не полный не целостный, короткий. Но кроме конца ( конец вышел длинным и не понравился мне. Я не хотел видеть божественной существо и итоговое мышления гг. Я больше ожидал, что гг сдох и его дневник о спасении других скроется другим. Мы увидим их ний мысли на счёт этого. Мысли Кати который узнала, что именно Михаил был анонимным спасителем. Других спасённых их ней сожаление. Но не мысли мёртвого гг\n[377285] 2025-10-22 07:46 Миколай: я могу попросить нейронку переписать\n[377286] 2025-10-22 07:46 Миколай: в этом очень согласен\n[377287] 2025-10-22 07:46 Миколай: конечно про концовку я ему сказал, что её надо сделать больше\n[377288] 2025-10-22 07:47 Миколай: и морали накидать\n[377289] 2025-10-22 07:47 Миколай: ну ибо он очень боится оправдать суицид\n[377290] 2025-10-22 07:47 Миколай: или романтизировать\n[377291] 2025-10-22 07:48 Миколай: он хорошо написал, но задача другая\n[377292] 2025-10-22 07:49 Миколай: а про ад и рай что-то хотел?\n[377297] 2025-10-22 08:31 Слава: Нехрена я не хотел про ад или рай\n[377298] 2025-10-22 08:33 Миколай: вот\n[377299] 2025-10-22 08:33 Миколай: ты писал это\n[377300] 2025-10-22 08:33 Миколай: че ты имел ввиду под адом?\n[377301] 2025-10-22 08:40 Слава: Я подразумевал лишь мотивацию гг. О том почему он решил спасти\n```\n\n### Версия 4 — 2025-10-22\n\nвселенная: Оам (по дате объявления) · окно w0108 · сообщения 377353–377388\n\n*что здесь: Мотивация уточнена: ГГ боится попасть в ад именно за самоубийство, хочет не в рай, а просто не в ад, решение убить себя принял заранее, до 13. Договорились переписать с упором на истории персонажей и другой конец — дневник и реакция. Слава объясняет исток замысла: хотел много страдающего ГГ, чьи спасители неудачны, и чтобы в конце он умер*\n\n\n\n```chat\n[377353] 2025-10-22 14:06 Миколай: а че его мотивация?\n[377354] 2025-10-22 14:07 Миколай: ты не решил получается\n[377355] 2025-10-22 14:07 Миколай: и хотел чтобы ии придумала\n[377356] 2025-10-22 14:07 Слава: Так он боится попасть в ад и вот вся мотивация\n[377357] 2025-10-22 14:08 Миколай: хочет в рай?\n[377358] 2025-10-22 14:08 Миколай: или просто не в ад\n[377359] 2025-10-22 14:08 Миколай: хочешь показать его грехи?\n[377360] 2025-10-22 14:08 Миколай: и он когда себя решает убить?\n[377361] 2025-10-22 14:08 Миколай: заранее?\n[377362] 2025-10-22 14:08 Миколай: до 13\n[377363] 2025-10-22 14:08 Миколай: или в процессе\n[377364] 2025-10-22 14:08 Слава: Заранее\n[377365] 2025-10-22 14:08 Миколай: он сначала именно не хотел попасть в ад после смерти\n[377366] 2025-10-22 14:09 Слава: Какие\n[377367] 2025-10-22 14:09 Миколай: а, ок\n[377368] 2025-10-22 14:09 Слава: Да\n[377369] 2025-10-22 14:09 Миколай: ну за что бы он в ад мог попасть\n[377370] 2025-10-22 14:09 Слава: Самоубийство\n[377371] 2025-10-22 14:09 Миколай: а\n[377372] 2025-10-22 14:09 Миколай: ну так я и видел\n[377373] 2025-10-22 14:09 Миколай: крч\n[377374] 2025-10-22 14:09 Миколай: как думаешь\n[377375] 2025-10-22 14:10 Миколай: переписать\n[377376] 2025-10-22 14:10 Миколай: упор на: истории персов\nдругой конец с его дневником и реакцией\n[377377] 2025-10-22 14:10 Слава: Зачем?\n[377378] 2025-10-22 14:10 Слава: Ну давай\n[377379] 2025-10-22 14:11 Миколай: а вообще как ты это придумал и зачем?\n[377380] 2025-10-22 14:12 Слава: Просто так. \nХотел увидеть много страдающего гг, который не будет счастливым и попытки его спасти будут неудачными и чтобы в конце он умер\n[377384] 2025-10-22 14:21 Миколай: хочешь написать историю\n[377385] 2025-10-22 14:21 Миколай: с таким персом\n[377386] 2025-10-22 14:21 Миколай: ну подобную\n[377387] 2025-10-22 14:21 Миколай: сложную психику\n[377388] 2025-10-22 14:21 Слава: Ну дв\n```\n\n### Версия 5 — 2025-10-28\n\nвселенная: Оам (по дате объявления) · окно w0108 · сообщения 379405–379411\n\n*что здесь: Решено раскрывать глубоко всех 13 персонажей, а не пятерых*\n\n\n\n```chat\n[379405] 2025-10-28 16:21 Миколай: эй\n[379406] 2025-10-28 16:22 Миколай: а раскрыть всех 13 персов глубоко\n[379407] 2025-10-28 16:22 Миколай: или только 5 можно?\n[379408] 2025-10-28 16:22 Миколай: ну про суицид\n[379409] 2025-10-28 16:22 Миколай: я сейчас делаю\n[379410] 2025-10-28 16:22 Слава: Вообще я думал всех\n[379411] 2025-10-28 16:22 Миколай: я тоже так думал\n```\n\n### Версия 6 — 2025-10-29\n\nвселенная: Оам (по дате объявления) · окно w0108 · сообщения 379751–379759\n\n*что здесь: Объём: нейронка пишет 900 тысяч слов на 90 глав, чтобы раскрыть всех и всё; Миколай продолжает вести переработку*\n\n\n\n```chat\n[379751] 2025-10-29 11:44 Миколай: хороче\n[379752] 2025-10-29 11:44 Миколай: крч\n[379753] 2025-10-29 11:44 Миколай: нейронка пишет историю на 900 тысяч слов\n[379754] 2025-10-29 11:44 Миколай: на 90 глав\n[379755] 2025-10-29 11:44 Миколай: я пока продолжу\n[379756] 2025-10-29 11:44 Миколай: а тебе как?\n[379757] 2025-10-29 11:44 Миколай: это все про тот суицид\n[379758] 2025-10-29 11:44 Миколай: я поговорил как сделать объемнее\n[379759] 2025-10-29 11:45 Миколай: так много ибо он всех и всё раскроет\n```\n\n### Версия 7 — 2025-10-29\n\nвселенная: Оам (по дате объявления) · окно w0108 · сообщения 380101–380104\n\n*что здесь: Слава подтверждает, что будет читать такой объём, если выйдет нормально*\n\n\n\n```chat\n[380101] 2025-10-29 21:08 Миколай: ?\n[380102] 2025-10-29 21:08 Миколай: будешь столько смотреть\n[380103] 2025-10-29 21:08 Слава: Ну если будет нор почитаю\n[380104] 2025-10-29 21:09 Миколай: пока норм как по мне\n```\n\n## Неясности\n\n- (w0107) Своего текста автор не написал; обсуждение результата уезжает в следующее окно.\n- (w0108) Сам текст пишет нейросеть по заданию авторов — авторские тут замысел, правки и требования; вселенная не объявлена</div>"}];</script>
