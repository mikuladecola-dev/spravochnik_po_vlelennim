 достал нож и шатаясь полоснул парня, благо пьяные парень не попал, а просто царапнул щеку, ну блять сука это пьяный  дебошир попытался его убить. Да он пьяный но разве это его как то оправдывает. Всегда должна быть грань, через который ну вот нельзя переходить вот вообще не как, в каком бы состояний ты бы не был, нельзя вот нельзя и точка. А они перешагнули эту грань попытавшись убить паренька, а друзяшки его лишь ржать в голосину. Ну вот поэтому, я тогда постигаем гневам ринулся на них. Его дружков уложить был просто, они то сами еле стояли, одному просто подзатыльник со всей силы, а второму которой даже среагировать не успел удар в челюсть и все. Вот только тепер остался с ножом, и это опасно подходить ему водь даже если он пьян в стелку  у него всё же нож, поэтому долга не думая подобрав то что попалось первым, а это оказалась колонка, увесистая, кинул в пьяного чмыря тот пошатнулся, покачался. И пока он приходил в себя саданул ему прям по лицу. И как вы уже догадались не прошло и недели, как копы повязали меня за драку. Эти скатины пьяные первый побежали жаловаться мистерам полицейским. Я конечно пытался сказать как было, но им то что им главное задержать и все, и сидел я так в объязаники, как вдруг грохот словно со всех сторон и.\n[287807] 2025-02-10 11:49 Слава: И типо надо на ноутбуке?\n[287808] 2025-02-10 11:49 Миколай: но\n[287809] 2025-02-10 11:49 Слава: Прочитал\n[287810] 2025-02-10 11:49 Миколай: скачать нажать и как обычная прога\n[287811] 2025-02-10 11:49 Миколай: 16 лет\n[287812] 2025-02-10 11:49 Миколай: читаю\n[287813] 2025-02-10 11:50 Миколай: парниша\n[287814] 2025-02-10 11:50 Миколай: пристают\n[287815] 2025-02-10 12:04 Миколай: прочел\n[287816] 2025-02-10 12:05 Миколай: физика идет\n[287817] 2025-02-10 12:05 Миколай: потом отвечу\n[287818] 2025-02-10 12:13 Миколай: короче\n[287819] 2025-02-10 12:14 Миколай: какая-то проблема двух миров в начале\n[287820] 2025-02-10 12:14 Миколай: и в новом мире ситуация\n[287821] 2025-02-10 12:14 Миколай: где ч
