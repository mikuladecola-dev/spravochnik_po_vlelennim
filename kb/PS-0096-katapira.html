const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Катапира\n\n*персонаж* · вселенные: 7 островов\n\n## Навигация\n\n- (w0038) Персонаж Миколая, выросший из карточки Славы «Температура т.п.»: парень около 17 лет с повышением температуры, инструмент — тонкий меч, раскаляемый до состояния лазерного. Атакующий с высокой выносливостью, чтобы бои были длинными.\n- (w0121) Пересланная карточка персонажа со статблоком (сила/ловкость/меткость/скорость/выносливость/контроль), оружием — тонким мечом, тремя приёмами и характером. С поясняет, что слегка переделал такие карточки и запихнул персонажей во вселенную.\n\n## Связано с\n\nЗурбон, Повышение температуры, Повышение температуры (Катапира), Система характеристик персонажей, Сталкер, Текси\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-06-18\n\nвселенная: 7 островов (по дате объявления) · окно w0038 · сообщения 183252–183252\n\n*что здесь: первая карточка Славы без имени: мужчина 17 лет, повышение температуры, тонкий меч-«лазерник», плавление предметов (сверхчеловека расплавить трудно или невозможно), фирменный приём — нагрев воздуха до взрыва с риском для себя*\n\n\n\n```chat\n[183252] 2024-06-18 06:56 Слава: Температура т.п.\nМужчин лет 17 \nСпособности: повышение температуры \nИнструмент: тонкие меч ( он его нагревает до невероятных высот из-за этого, он как будто лазерный меч)( также он использует способности не только для нагревания инструмента но и чтобы убить человека или чтобы расплавить другие предметы( расплавить сверхчеловека будет тяжело или невозможно))\nТакже его фирменный приемы нагревания воздуха до невероятных высот заставляет воздух буквально взрываться ( сам может получить урон)\n```\n\n### Версия 2 — 2024-06-21 · повтор прежней мысли\n\nвселенная: 7 островов (по дате объявления) · окно w0038 · сообщения 185001–185007\n\n*что здесь: карточка переслана, Миколай берёт этого персонажа себе на разработку*\n\n\n\n```chat\n[185001] 2024-06-21 09:47 Слава: Температура т.п.\nМужчин лет 17 \nСпособности: повышение температуры \nИнструмент: тонкие меч ( он его нагревает до невероятных высот из-за этого, он как будто лазерный меч)( также он использует способности не только для нагревания инструмента но и чтобы убить человека или чтобы расплавить другие предметы( расплавить сверхчеловека будет тяжело или невозможно))\nТакже его фирменный приемы нагревания воздуха до невероятных высот заставляет воздух буквально взрываться ( сам может получить урон)\n[185003] 2024-06-21 09:47 Слава: Каво выбираешь?\n[185007] 2024-06-21 09:48 Миколай: Попробую температуру\n```\n\n### Версия 3 — 2024-06-21\n\nвселенная: 7 островов (по дате объявления) · окно w0038 · сообщения 185046–185046\n\n*что здесь: полная карточка: имя Катапира, любит корочки от печной пиццы и волосатых гусениц, не любит соль/сахар и молодёжь до 25, статы, три приёма, характер — любопытный, тихие личные эксперименты, любит наблюдать за природой и общаться со взрослыми, почти не ест, а если ест — сырое, потому что внутри него температура убивает любых паразитов*\n\n\n\n```chat\n[185046] 2024-06-21 10:24 Миколай: Имя: Катапира\n\nЛюбит: корочки от печной пиццы, волосатых гусениц\n\nНе любит: соль/сахар, молодёжь (людей до 25, хотя самому меньше)\n\nСила: 6\n\nЛовкость: 5\n\nМеткость: 9\n\nСкорость: 7\n\nВыносливость: 8\n\nКонтроль: 10\n\nОружие: тонкий меч \n\nСпособности: повышение температуры\n\nПриёмы:\n\n1. Нагревание воздуха до невероятных высот при которых происходит взрыв этой смеси газов\n\n2. Атомарное домино: Коснувшись мечем на определённой частоте какой-либо поверхности, она начинает резко передавать температуру по волновому импульсу. Например пол он коснулся, и в сторону противника он начинает отдавать раскалённую волну тепла. Это просто очень горячо ну если не направлять силу. Если направить силу, то под конкретной целью расплавиться поверхность\n\n3. Самовозгорание: повышает защиту и атаку. Типо предметы попадающие в его воспламенённую зону сгорают или плавятся, а у оружия появляется наружняя аура добовляющая урон. Не очень затратная на самом деле способность, но зато очень эффективная и выглядит красиво пхех\n\nЧерта характера: любопытный парень, со стороны кажущийся сумасшедшим и не тем что делает странные шумные выходки, а тем, что делает тихие личные эксперименты и прикольчики. Обожает наблюдать за природой и общаться со взрослыми, набираться опыта. Не любит кушать, а если и кушает что-то, то только в сыром виде, все равно он никогда не заболеет и не подхватит паразита, так как в его теле такая температура при которой никто не выживет, да и еда внутри уже готовится\n```\n\n### Версия 4 — 2024-06-21\n\nвселенная: 7 островов (по дате объявления) · окно w0038 · сообщения 185047–185070\n\n*что здесь: спор о роли: не танк, а атакующий; выносливость вкачана ради длинных боёв; добавлена скорость 7, сознательно не делают его быстрым ради баланса с будущими персонажами*\n\n\n\n```chat\n[185047] 2024-06-21 10:26 Слава: А чё он типа танк ?\n[185048] 2024-06-21 10:27 Миколай: Нет, совсем нет, он атакующий, типо это самовозгорание слабенькое на деле\n[185049] 2024-06-21 10:28 Слава: Ну у него выносливость выше всех статов ( ну кроме контроля с контролем все ясно)\n[185050] 2024-06-21 10:28 Миколай: Хмм\n[185051] 2024-06-21 10:28 Миколай: Ну\n[185052] 2024-06-21 10:28 Миколай: Тогда он хуёвый атакующий\n[185053] 2024-06-21 10:28 Миколай: Но атакующий\n[185055] 2024-06-21 10:29 Миколай: Ему нравится драться\n[185056] 2024-06-21 10:30 Миколай: Этот стат я вкачал чтобы его битвы были дохуя длинными\n[185057] 2024-06-21 10:30 Слава: Я думал ты сделаешь упор на скорость, у него же типа смертельный атаки и &quot;лазерный меч&quot;\n[185058] 2024-06-21 10:31 Миколай: Бля есть же ещё скорость 😅\n[185060] 2024-06-21 10:31 Слава: Ну типа ловкость и скорость одно и тоже\n[185061] 2024-06-21 10:31 Слава: Или не ?\n[185062] 2024-06-21 10:32 Слава: Ладно не ,добавь скорость и я добавлю\n[185063] 2024-06-21 10:32 Миколай: Ну я считаю иначе. Ловкость это способность уклоняться от препятствий, выбираться из любой хуйни. А скорость ну это то насколько быстро перемещается\n\n\nЯ должен был это прокомментировать, да.)\n[185064] 2024-06-21 10:33 Слава: 7\n[185065] 2024-06-21 10:33 Миколай: Да\n[185066] 2024-06-21 10:34 Миколай: Я не хочу всё-таки его делать очень быстрым\n[185067] 2024-06-21 10:34 Миколай: Типо ты часто переживаешь за баланс и как по мне в таком случае не стоит в самом начале всех делать имбовыми\n[185068] 2024-06-21 10:35 Миколай: Надо дать им и будущим персам потанцевал\n[185069] 2024-06-21 10:35 Слава: Да уловил\n[185070] 2024-06-21 10:35 Слава: И изменил статы\n```\n\n### Версия 5 — 2026-06-14 · повтор прежней мысли\n\nвселенная: неясно (по дате объявления) · окно w0121 · сообщения 489439–489441\n\n*что здесь: карточка целиком: любит корочки от печной пиццы и волосатых гусениц, не любит соль/сахар и молодёжь; любопытный экспериментатор, ест только сырое, потому что внутри него всё готовится*\n\n\n\n```chat\n[489439] 2026-06-14 15:04 Слава: Имя: Катапира\n\nЛюбит: корочки от печной пиццы, волосатых гусениц\n\nНе любит: соль/сахар, молодёжь (людей до 25, хотя самому меньше)\n\nСила: 6\n\nЛовкость: 5\n\nМеткость: 9\n\nСкорость: 7\n\nВыносливость: 8\n\nКонтроль: 10\n\nОружие: тонкий меч \n\nСпособности: повышение температуры\n\nПриёмы:\n\n1. Нагревание воздуха до невероятных высот при которых происходит взрыв этой смеси газов\n\n2. Атомарное домино: Коснувшись мечем на определённой частоте какой-либо поверхности, она начинает резко передавать температуру по волновому импульсу. Например пол он коснулся, и в сторону противника он начинает отдавать раскалённую волну тепла. Это просто очень горячо ну если не направлять силу. Если направить силу, то под конкретной целью расплавиться
