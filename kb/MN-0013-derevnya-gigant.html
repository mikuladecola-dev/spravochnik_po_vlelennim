const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Деревня-гигант\n\n*монумент* · вселенные: 7 островов\n\n## Навигация\n\n- (w0066) Изолированное поселение в Азии на старейшем вулкане около 3000 метров, окружённом неидеальным кольцом гор пониже: богатые внизу, учёные в середине, рабочие и бедные наверху. Слой земли тонкий и близок к магме. Главная особенность места — облака и тысячелетняя наука о них (нефология).\n\n## Связано с\n\nЗаражённые облака, История про приезжего учителя, Монстры в небе (облачные существа), Раса деревни-гиганта (нефители), Система облаков деревни-гиганта\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-12-11\n\nвселенная: 7 островов (объявлено) · окно w0066 · сообщения 269341–269373\n\n*что здесь: основное описание одним текстом: расположение и вулкан, расслоение по высоте, изоляция и обмен с университетами, историческая справка про кочевое племя, врезавшееся облако и проросшие семена, готовая система работы с облаками*\n\n\n\n```chat\n[269341] 2024-12-11 17:33 Миколай: короче\n[269342] 2024-12-11 17:33 Миколай: моя история мне ценнее введением концепции которая развита на определенной территории\n[269343] 2024-12-11 17:34 Миколай: ты говорил насчет рас\n[269344] 2024-12-11 17:34 Миколай: думаю можно их категоризировать как расу\n[269345] 2024-12-11 17:34 Миколай: рассказать о концепции\n[269346] 2024-12-11 17:34 Слава: Я тебе говорил предложить способность который подойдёт к гг\n[269347] 2024-12-11 17:34 Миколай: вот её мне не лень написать\n[269348] 2024-12-11 17:34 Миколай: ну\n[269349] 2024-12-11 17:34 Миколай: да говорил\n[269350] 2024-12-11 17:35 Миколай: пока идей конкретно для гг нету\n[269351] 2024-12-11 17:35 Слава: О концепции рас тебе не лень писать ?\n[269352] оречит обычаям. вот и поселились там исследуя облака.\nсейчас там уже своя продуманная система: они могут создавать облака, ловить и хранить их. \nони прорубли давно канал для реки в деревню (во первых потому что деревень без воды вблизи не бывает, а она была далеко) и также установили управляемые дамбы. периодично они их открывают. вода течёт на расколенные низменности и испаряется. причем настолько горячая поверхность, что до 5 метров действительный пар, после он превращается частично в туман, но продолжает подниматься, а на высоте 2,5 км сталкивается с ветром, который выходит из-за гор полученный течением. ветер формирует из тумана облака, из-за четких пропорций, они не вырастают больше 10 метров и врезаются ближе к вершине, где на специальных мостиках - бышах нефители ловят облака, в специальную ткань из специального материала и с особенной фактурой, используя родовую энергию могут перемещать облака не испортив их. обычные жители просто поливают огород этими облаками в основном, но ученые от рабочих получают облака, которые те через жерло вулкана кидают на середину горы. а после типа в лабораториях делают различные исследования с облаками. увеличивают плотность, уменьшают, заражатют вирусами и тд. \nесли зараженное облако съест или вдохнет человек естественно он заболеет и причем сильно, а избавится от болезни только выдохнув облако.\nу них множеств всяких экспериментов с облаками но это я не продумал уже\n[269370] 2024-12-11 19:08 Миколай: да, не самая сильная и конкретно о расе почти не написал, но вот крч что есть\n[269371] 2024-12-11 19:09 Миколай: если ты о гг чет придумал или придумаешь то пиши\n[269372] 2024-12-11 19:09 Миколай: ибо у меня нет идей\n[269373] 2024-12-11 19:09 Миколай: но я постараюсь тоже придумать\n```\n\n### Версия 2 — 2024-12-11\n\nвселенная: 7 островов (объявлено) · окно w0066 · сообщения 269379–269408\n\n*что здесь: дополнения по вопросам С: реки далеко за горами, прорытые каналы, вода пущена по кругу, наверху реки не нужны из-за обла
