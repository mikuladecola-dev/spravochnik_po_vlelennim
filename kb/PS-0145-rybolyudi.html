<script>const BASE="../";const DOCNAME="рыболюди";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># рыболюди\n\n*персонаж* · вселенные: монстры\n\n## Навигация\n\n- (w0053) Раса монстров вселенной Славы: обитают в определённом водном месте, их гены могут попасть к человеку, а голову рыбочеловека охотник подаёт узнику на тарелке.\n- (w0055) Монстр, за которым спасатель шёл до Ньюса; ранее в 224940 фигурирует «тушка рыбомонстра», которую собираются нарезать.\n\n## Связано с\n\nНьюс, монстры как домен живых существ, спасатель, чел с генами рыбочеловека\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-08-17\n\nвселенная: монстры (по дате объявления) · окно w0053 · сообщения 220168–220168\n\n*что здесь: Первое упоминание: голова рыбочеловека на тарелке как еда узнику*\n\n\n\n```chat\n[220168] 2024-08-17 22:20 Слава: Ну я начал ожидать 5 день ожидая что что-то измениться. И в рот мне швабру, нихуя не изменилась. Только на 10 день место супа принес он мне кашу, и если честно признаться каша была в разы вкуснее нежели суп. И так пошел день за днём каша и мои вечный причитание что он не виноват, что все хорошо, что я его люблю. Ну типа на жалость пытался надавить и возможно решить его детскую травму что бы он меня отпустили. Ну ничего не изменилась не через месяц не через 2 месяца и т.п. Вообще прошло уже 6 месяцев как я уже суда попал, ну и вроде все ок я ем, сплю, жру. Не жизнь а рая для интроверт и тому подобных. И вот в один из дней. Мне место каши принесли накрытую тарелку, большую тарелку. Ну я подумал опа наконец то мои криволения в  словах сработали. Поднял крышку, а там сука бошка, нет не башка человека или какого либо животного. А бышка рыба человека. И здесь я уже начал понимать что это не просто псих а какое то охотник на нечисть сука или как это можно назвать. Какой то человек убивающий монстров с психологическими проблемами запер меня здесь и заставляет есть хуй пойми чей. После рыба, ну или что то похожей на рыбу. Я как всегда очнулся в темной комнате, но под собой ощутил, что то прямоугольно и да сука это телефон ебучий телефон. Но к сожалению на нем ничего не было не сети не связи, ни приложений только менеджер, где в контактах был только один человек и это ты . И вот сука я сейчас все суда записываю, для чего спросишь ты для того что бы собраться с мыслями, ну и успокоиться. Я уже понимаю кому пишу, это ведь ты запер меня здесь не так ли. И нет не надо ни на что отвечать просто выпусти и для полиция я придумаю какую нибудь отговорку. Ничто не связанной с тобой. Просто прошу выпусти. Я большого не прошу. Я продолжу писать даже если ты не ответишь ведь я вижу ты читаешь. Надеюсь мы поймём друг друга и ты пожалуйста отпустишь меня. Я готов на все хоть полностью сожрать того рыба человека. Да сука хоть человека. Я СДЕЛАЮ ВСЕ\n```\n\n### Версия 2 — 2024-08-17\n\nвселенная: монстры (по дате объявления) · окно w0053 · сообщения 220213–220216\n\n*что здесь: Уточнение: рыболюди живут в конкретном месте, знают о носителе своих генов; отдельно оговорено, что вариант с зачатием в их вселенной «кринж», поэтому передача через укус*\n\n\n\n```chat\n[220213] 2024-08-17 23:14 Миколай: ахахахахха. ну концовка чуток натянута. хотя, может ему так было веселее. ок...\n\nкто это? я бы сказал что это обычный человек, которому делать нехуй, думать постоянно о похитителях. но ты не этого ждёшь, да и я чёт тоже поинтереснее хочу. тогда может это чел который имеет гены рыбочеловека? типа, его отец плавал в месте где обитают рыболюди, кто-то из них кончил, но это в твоей вселенной кринж, ток что укусил отца этого чела в ключицу, ну и в семяпроводе через кровь или молочные железы проникли гены рыбочеловека, мне похуй насколько это реалистично, такой концепт интересен и можно его запихнуть сюда, ты сможешь доработать может если не нравится. так вот чел родился с генами, рыбалюди об этом знают, охотник пытался чет допросить одного такого монстра, узнал историю и начал охоту уже на человека. начал над ним опыты проводить и наблюдать за каннибализмом и физическими способностями\n[220214] 2024-08-17 23:16 Слава: Кто похититель ?\n[220215] 2024-08-17 23:16 Миколай: а, бля\n[220216] 2024-08-17 23:16 Миколай: ясен хуй спасатель\n```\n\n### Версия 3 — 2024-08-26\n\nвселенная: монстры (по дате объявления) · окно w0055 · сообщения 224940–224940\n\n*что здесь: первое упоминание: собираются нарезать тушку рыбомонстра*\n\n\n\n```chat\n[224940] 2024-08-26 11:30 Миколай: бро, мы походу голубец поймали. зачем он мне в любви признаётся. видно что в сознании и адекватен.. &quot;я читал, что это Стокгольмский синдром&quot;. а вот оно как. и что это? &quot;чел, тебя в гугле забанили?&quot;. че такой душный, я так-то поговорить хотел. &quot;ну не в эфире же&quot;. ладно.\nстоп. Киппер. ну ты же при нём это сказал. он теперь понял что мы в эфире. а вызывать амнезию не одно из наших веществ не умеет. че делать теперь. &quot;да не ссы, есть пара народных методов&quot;. ок. стой, ну не обязательно наверное, кирпичем по голове. &quot;ты че такой весь правильный, мы и так по локоть в меазмах&quot;. эх, делай.\nи вообще, я не понимаю что тебе этот человек сделал и зачем такие странные эксперименты. &quot;ты эфир остановил?&quot;. нет. &quot;тогда че ты спрашиваешь!?&quot;. ладно всё, я остановил. &quot;внимательнее будь, но. это не человек, это монстр, пусть он и выглядит так. ты же видел что он делает после удара о землю в отключке. каждый раз стены ломаются&quot;. да я и сам бы такое сделал, но это же не значит что я монстр. эй, ты че делаешь. убери иглу, больно же. &quot;был бы монстром, то тебя бы эта доза смогла бы отключить&quot;. боже, да просто у меня другая группа крови. &quot;у тебя в кровь красная, у него синяя. ты хоть одного человека видел, в чьей крови течёт гемоцианин?&quot;. это особенность природы, почему сразу монстр. &quot;ладно, ты сейчас видишь понятие монстр, как ярлык и его субъективное значение. но, на самом деле, в школе не преподают этого, монстры - один из доменов живых существ. в ряду с бактериями, археями или эукариотами. у каждого типа свои особенности, появления, поведения. в общем целая наука&quot;. а ты от куда всё знаешь? &quot;учиться надо, трогать мир. хотя я большинство монстров познал из-за из вмешательства в мою жизнь. эти твари мои враги и я их же использую для мести&quot;. и где их мао садао? э, ты че меня бьёшь &quot;я с тобой серьёзно говорю, зачем ты всё это делаешь&quot;. ты че аниме не смотришь, ну где их тёмный повелитель, самый главный кого ты хочешь одолеть, герой наш? и почему никто из людей не знает об этих существах? &quot;так бы сразу и говорил, а то свои мау сау тут начал. пересмотрел своих аниме теперь реальность выдумываешь. нет у них никакого предводителя, их(существов) слишком много и нормально все живут вместе. их инстинкт говорит прятаться от людей, но от людей они сильно зависят, как и люди от них, они связаны ментальными сигналами, но обычно это никак не отражается. и вообще, даже так я их всех истреблю за то что они сделали..  иногда их отклонения доходят до вмешательства в жизнь людей, тогда их судьбу обречена, общество их не примет. а они более социальные существа, даже не социум у них, а более сложное явление, которое я не понимаю. да и вообще, че я тебе объясняю, пойдём делать эксперименты&quot;. реально, от куда ты так подробно всё знаешь, тебе че делать нечего? нет работать, ты воображаешь там себе эти идеи. &quot;хочешь чтобы я снова на тебя монстра натравил? он то пожалел тебя, но если надоешь, такие большие иллюзии тебе покажет&quot;. в смысле снова? &quot;ой. ну давай вот без вопросов идём уже нарежем тушку рыбомонстра и телефон парню зарядим, посмотрим, что сегодня напишет&quot;. ну осётр своего рода монстр, но он же из домена эукариотов. шизик. че ты имел блин ввиду под &#x27;снова&#x27;? эй, не игнорь!\
