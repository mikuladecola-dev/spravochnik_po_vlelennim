трудностями. Наступает «момент истины».\n​Состояние: Признание собственного невежества. Это самый сложный этап, так как здесь часто падает самооценка и пропадает мотивация.\n​Пример: Тот же человек садится за руль и понимает, что не может одновременно следить за дорогой и переключать передачи. Машина глохнет, наступает стресс.\n​3. Осознанная компетентность\n​«Я знаю, как это делать, но мне нужно об этом думать».\n​Вы научились, но выполнение действия требует полной концентрации. Если вас отвлечь — вы совершите ошибку.\n​Состояние: Навык приобретен, но он еще не стал автоматическим. Требуется серьезное умственное усилие.\n​Пример: Начинающий водитель едет правильно, но он напряжен, не может поддерживать беседу и постоянно проговаривает про себя: «Так, сейчас выжимаю сцепление, включаю вторую...»\n​4. Неосознанная компетентность\n​«Я просто это делаю».\n​Навык ушел в подсознание. Вы выполняете действие автоматически, параллельно занимаясь чем-то другим.\n​Состояние: Мастерство. Мозг освобождает ресурсы для других задач.\n​Пример: Опытный водитель едет домой, слушает подкаст и планирует ужин, совершенно не задумываясь о том, как его ноги и руки управляют механизмами.\n​Пятая ступень (бонус)\n​Иногда исследователи добавляют пятый этап — Осознанная компетентность над неосознанной компетентностью. Это уровень эксперта-преподавателя, который не просто «делает на автомате», но и может разложить свой автоматизм обратно на детали, чтобы научить другого.\n[457610] 2026-04-11 09:52 Миколай: я думал покороче будет\n[457612] 2026-04-11 09:53 Слава: Ну да прикольно, но как гг навык получать будет разные. Если он их даже не помнит и не знает\n[457613] 2026-04-11 09:54 Слава: Поэтому с продажей навыка всё ещё остаёмся\n```\n\n## Часть чего\n\nСистема прокачки в бесконечном данже\n\n## Неясности\n\n- (w0119) Текст явно откуда-то скопирован (общеизвестная модель обучения), авторским материалом не является — оставлен как рабочая заметка, продублирован в ai_suspect.</div>"}];</script>
