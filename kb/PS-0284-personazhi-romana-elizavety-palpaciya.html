<script>const BASE="../";const DOCNAME="Персонажи романа Елизаветы Пальпация";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Персонажи романа Елизаветы Пальпация\n\n*персонаж* · вселенные: Апостол\n\n## Навигация\n\n- (w0099) Пять главных героев чужого романа: Курт-Амадей Рихтер, Нонна Васкес, Роджер де Ла-Гранж, Сашка Флобер, Авраам. Материал третьего лица.\n\n## Связано с\n\nМироустройство романа Елизаветы Пальпация\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-05-25\n\nвселенная: Апостол (по дате объявления) · окно w0099 · сообщения 330034–330034\n\n*что здесь: Курт-Амадей Рихтер — глава Старшего Повстанческого движения, сын певчего и скрипачки, ослеп на один глаз, родителей публично казнили по ложным доносам, сменил церковное имя; Нонна Васкес — Видящая Старшей Церкви, рождена от союза кардинала и генерала, «искажённость» через повреждённый нерв даёт доступ к сокрытым знаниям, Видящих изымают из семей; Роджер де Ла-Гранж — правая рука Курта, видел, как мать разрезало дверьми бункера; Сашка Флобер — Учёная, упустившая генно-модифицированных сколопендр, которые мутировали под излучением; Авраам — кардинал, в конце Папа Старшей Церкви, высоконравственный наблюдатель и советчик*\n\n\n\n```chat\n[330034] 2025-05-25 20:00 Миколай: Персонажи\n\nВсего главных героев 5:\n• Курт-Амадей Рихтер\n• Нонна Васкес\n• Роджер де Ла-Гранж\n• Александра (Сашка) Флобер\n• Авраам (временно без фамилии)\n\nКурт-Амадей Рихтер – \nГлава Старшего Повстанческого движения\nРодился в семье певчего и скрипачки при театре 3 сектора (а-ля в семье Священников). Однажды его родителей заподозрили в предательстве Церкви, так как на них поступали доносы, к слову, они были лживые. К ним направили людей, которые их насильственно забрали. Тогда Амадею полоснули по лицу ножом, из-за чего тот ослеп на один глаз. Его родителей публично казнили, Церковь признала Амадея предателем и отреклась от него. Мальчику пришлось примкнуть к Повстанцам, где он спустя много лет занял руководящую должность. Сменил имя на Курт, так как Амадей – церковное (мейби католическое) и строго запрещённое на территории Повстанцев\n\nНонна Васкес –\nСлужительница Старшей Церкви, Видящая\nРодилась от незакреплëнного союза кардинала конклава и генерала ПД. На начало действий романа является одной из двух Видящих на планете, в конце – единственной. Суть Видящих заключается в их &quot;искажëнности&quot;. При рождении у них повреждается некий нерв в мозгу... но я слишком умничать не буду, потому что за биологию не шарю. Если говорить самую суть, то у них появляется доступ к &quot;сокрытым знаниям&quot;, как это называют Священники, а потому их Церковь при первых же признаках изымает из семей и растит ради своих целей. Таковой является Нонна \n\nРоджер де Ла-Гранж – \nПравая рука Курта\nРодился в браке Учёного и Повстанца. Ещё в детстве потерял отца, который не пережил опасный опыт на работе, и мать, что, рискуя собой во время стычки, спасла его, в последний момент закрыв в бункере (вообще, это должна быть очень трогательная сцена. Мать Роджера доносит его на руках до закрывающегося бункера, оставляет его там и убегает, но решив в последний раз обернуться к сыну и посмотреть, как он, остаётся зажатой меж железных дверей. Роджер своими глазами видит, как тело матери располовинивает и его верхняя часть , ещё еле-еле трепыхаясь, истекает кровью, а после окончательно опадает). После этого он решает вступить в войска и дослуживается до правой руки\n\nСашка Флобер –\nУчёная, ответственная за разработку генно-модифицированных насекомых\nВыросла в неполной семье. Отец скончался так же во время опытов, как и у Роджера. Мать больна. Именно Сашка становится причиной всему тому, что будет происходить. По неосторожности и недосыпу во время ночного осмотра она не уследила и выпустила из камеры парочку особей чего-то, внешне схожего со сколопендрами (Учёные занимались выращиванием этих насекомых в изолированной от излучения среде, чтоб впоследствии они вырабатывали пригодные в пищу вещества). Но оказавшись в открытой среде попали под влияние дыр магнитного поля и начали постепенно мутировать. В конце из крошечных ползучих пакостей они становятся гигантами, угрожающими всему человечеству (на этот образ меня и вдохновила картина Сальвадора Дали. Особенно ноги слонов. Вроде как это должно быть угрожающе)\n\nАвраам –\nКардинал. Спойлер: в конце романа – Папа Старшей Церкви\nЕго разработкой заняться у меня времени было не особо то и много, так как появился он совсем недавно. Но должен быть очень высоконравственным человеком, который будет выступать как зритель со стороны и параллельно с этим советчик\n```\n\n## Часть чего\n\nМироустройство романа Елизаветы Пальпация\n\n## Неясности\n\n- (w0099) чужое авторство: переслано от третьего лица, не материал соавторов</div>"}];</script>
