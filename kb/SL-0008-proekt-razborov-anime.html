<script>const BASE="../";const DOCNAME="Проект разборов аниме";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Проект разборов аниме\n\n*служебное* · вселенные: Падения небес\n\n## Навигация\n\n- (w0021) Совместный проект: писать разборы аниме с точки зрения приёмов и удержания зрителя, вести его на общем канале вдвоём в формате дебатов. Придуман 23 декабря, расписан регламент и график, 25-26 декабря запущен на «Вратах Штейна» — обменялись разборами первых двух серий.\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2023-12-23\n\nвселенная: неясно (не определено) · окно w0021 · сообщения 64929–64949\n\n*что здесь: Толчок — ролики канала Ючия, где разбирают героев аниме. Предложение Миколая писать разборы с опорой на сюжет и приёмы удержания; Слава предлагает делать это на их канал; Миколай добавляет, что вдвоём такое почти никто не делает, озвучивать будут вместе.*\n\n\n\n```chat\n[64929] 2023-12-23 16:55 Миколай: Так, ну я начал смотреть ролик про бездарную нану (9 минут просмотрел), для начала скажу: прикольная подача, я иногда подобным голосом объясняю 😅, разбор подобный, интересный\n[64930] 2023-12-23 16:55 Миколай: Продолжаю смотреть дальше\n[64931] 2023-12-23 16:59 Миколай: Ещё нравится что он каждому персонажу сам придумывает погоняло, это прям круто\n[64935] 2023-12-23 17:38 Миколай: Так, ну я досмотрел\n[64936] 2023-12-23 17:38 Миколай: В конце он как раз рассказал чем это аниме ценно для писателя и в чем его слабость\n[64937] 2023-12-23 17:41 Миколай: Я конечно сейчас предлагаю мороку, но как тебе идея писать сюда разборы аниме с точки зрения приёмов и удержания зрителей\n[64938] 2023-12-23 17:41 Миколай: Ну с опорой на сюжет\n[64939] 2023-12-23 17:41 Миколай: Что думаешь?\n--- пауза 1.3 ч ---\n[64941] 2023-12-23 18:56 Слава: То бишь на канал ?\n[64942] 2023-12-23 18:57 Слава: Наш\n[64943] 2023-12-23 18:57 Миколай: ну вообще я планировал в нашей переписке, но твоя идея мне нравиться\n[64944] 2023-12-23 18:58 Слава: Какая идея ?\n[64945] 2023-12-23 18:58 Миколай: на канал\n[64946] 2023-12-23 18:59 Слава: Как, то бишь разбирать аниме с твоим голосом ?\n[64947] 2023-12-23 19:00 Миколай: кстати, вдвоём редко кто разбирает ролики\n[64948] 2023-12-23 19:00 Миколай: мы можем создать волну\n[64949] 2023-12-23 19:00 Миколай: вместе озвучим\n```\n\n### Версия 2 — 2023-12-23\n\nвселенная: неясно (не определено) · окно w0021 · сообщения 64950–65005\n\n*что здесь: Работа над подачей: пробные голосовые, разбор чужой и своей начитки, требование добавить обращение к зрителю, вопрос о канале — новый или существующий (решили на существующем).*\n\n\n\n```chat\n[64950] 2023-12-23 19:00 Слава: С моим то голосом \nКоторый я даже не качал с говорорками\n[64951] 2023-12-23 19:01 Слава: Я даже забыл как правильно пишется\n[64952] 2023-12-23 19:01 Слава: Ну вообще мне нравится вот только мой голос\n[64953] 2023-12-23 19:01 Миколай: Ты его ролики видел?\n[64954] 2023-12-23 19:01 Слава: Да\n[64955] 2023-12-23 19:01 Слава: Все смотрю\n[64956] 2023-12-23 19:02 Миколай: Он озвучивает как настоящий диктор да\n[64957] 2023-12-23 19:02 Миколай: ?\n[64958] 2023-12-23 19:02 Слава: Ну интонация ,твердый и эмоциональный голос\n[64959] 2023-12-23 19:03 Миколай: Так, ну ок, сейчас дам текст, прочитаешь его на гс\n[64960] 2023-12-23 19:03 Миколай: Лично меня очень зацепил сюжет, а сюжета в первой серии аниме никогда не бывает поэтому если первую серию переживёшь, ты окажешься в деревне (ты поймёшь что я имею ввиду)\n[64966] 2023-12-23 19:05 Миколай: Интернет плохой\n[64968] 2023-12-23 19:05 Слава: Не ,решил попробовать ещё не сколько раз\n[64969] 2023-12-23 19:05 Миколай: Ну норм\n[64970] 2023-12-23 19:06 Миколай: Я сам по 10 раз перезаписываю\n[64971] 2023-12-23 19:06 Миколай: Я был на стримах Лололошки\n[64972] 2023-12-23 19:06 Слава: Я не был\n[64973] 2023-12-23 19:06 Миколай: Он говорил что тоже по 20 раз перезаписывает пока ему не понравиться\n[64974] 2023-12-23 19:07 Слава: Не ну у лолошки прям актерский талант\n[64975] 2023-12-23 19:07 Миколай: 11 лет\n[64976] 2023-12-23 19:07 Миколай: На Ютубе\n[64977] 2023-12-23 19:07 Миколай: Видел бы ты его первые ролики\n[64978] 2023-12-23 19:07 Слава: Да понял\n[64979] 2023-12-23 19:07 Слава: Опыт\n[64980] 2023-12-23 19:07 Миколай: Да больше походу\n[64981] 2023-12-23 19:08 Слава: Ну ладно давай попробуем\n[64982] 2023-12-23 19:08 Миколай: Так, ну сейчас я прочитаю, напишешь чем отличается, пытайся проанализировать что я хочу показать\n[64984] 2023-12-23 19:08 Слава: Только на каком канале на том что есть или новый ?\n[64985] 2023-12-23 19:09 Миколай: Будет тяжело на новом, на нынешнем тоже тяжело, но этот вариант лучше\n[64986] 2023-12-23 19:10 Слава: Можно сказать свое  мнение 😉\n[64987] 2023-12-23 19:10 Миколай: Попробуй\n[64988] 2023-12-23 19:10 Миколай: Интернет плохой долго сообщения приходят, так что сорян за задержку\n[64990] 2023-12-23 19:12 Слава: Ну ты словно задыхался и где то в середки ты слишком быстро начал\n[64991] 2023-12-23 19:13 Миколай: Тогда можно я тоже выскажусь\n[64992] 2023-12-23 19:14 Миколай: Ты грустно рассказываешь, будто был парень, я его знал, теперь он умер и я рассказываю каким он был человеком\n[64993] 2023-12-23 19:15 Слава: Понял принял\n[64994] 2023-12-23 19:15 Миколай: Ну, я хотел вообще своим сообщением показать что нужно  добавить обращение\n[64995] 2023-12-23 19:15 Миколай: У тебя я его не нашёл\n[64996] 2023-12-23 19:15 Миколай: Поэтому решил показать\n[64997] 2023-12-23 19:15 Миколай: Перезапиши\n[64998] 2023-12-23 19:16 Миколай: С обращением\n[65000] 2023-12-23 19:16 Слава: Ну вроде лучше\n[65001] 2023-12-23 19:16 Миколай: Да\n[65002] 2023-12-23 19:16 Миколай: Теперь все будут тебя слушать\n[65003] 2023-12-23 19:17 Миколай: Че, не веришь?\n[65004] 2023-12-23 19:17 Миколай: Проверим\n[65005] 2023-12-23 19:17 Слава: Ну ок\n```\n\n### Версия 3 — 2023-12-23\n\nвселенная: неясно (не определено) · окно w0021 · сообщения 65006–65035\n\n*что здесь: Формат: дебаты, двое ведущих на равных, два мнения, спор и скандал как приём удержания; один смотрел давно, другой сейчас — «свежий взгляд»; пробный созвон о «Рагнарёке».*\n\n\n\n```chat\n[65006] 2023-12-23 19:18 Слава: А ты вообще как хочешь устроить эту дуэль тип там будет спор или как ?\n[65007] 2023-12-23 19:18 Миколай: Блять, да ты меня сегодня удивляешь годными идеями\n[65008] 2023-12-23 19:18 Миколай: Го дебаты\n[65009] 2023-12-23 19:18 Слава: Типо ты главным ведущим и я буду добавлять свои пять копеек и иногда спорить с твоим мнениям\n[65010] 2023-12-23 19:19 Слава: Ладно давай попробуем\n[65011] 2023-12-23 19:19 Миколай: Равноправие, в споре все правы и все виноваты\n[65012] 2023-12-23 19:19 Миколай: 2 мнения 2 точки зрения\n[65013] 2023-12-23 19:20 Миколай: Скандал\n[65014] 2023-12-23 19:20 Миколай: Это люди любят\n[65015] 2023-12-23 19:20 Миколай: Негативные эмоции хорошо запоминаю иначе новости бы не слушали\n[65016] 2023-12-23 19:20 Миколай: Помнишь фирамира\n[65017] 2023-12-23 19:20 Миколай: Там такая история\n[65018] 2023-12-23 19:20 Миколай: Вот\n[65019] 2023-12-23 19:21 Слава: Че то нет\n[65020] 2023-12-23 19:21 Миколай: А мы в рамках приличия будем использовать этот приём\n[65021] 2023-12-23 19:21 Миколай: Ок\n[65022] 2023-12-23 19:21 Миколай: Мы просто как то в школе в начальной всем классом смотрели\n[65023] 2023-12-23 19:22 Миколай: Так\n[65024] 2023-12-23 19:22 Миколай: Ты сейчас не занят?\n[65025] 2023-12-23 19:22 Слава: Ну нет вроде\n[65026] 2023-12-23 19:23 Миколай: Какие аниме мы смотрели\n[65027] 2023-12-23 19:23 Миколай: Ты и я\n[65028] 2023-12-23 19:23 Слава: Дай подумать\n[65029] 2023-12-23 19:23 Миколай: Рагнарек\n[65030] 2023-12-23 19:23 Слава: Да\n[65031] 2023-12-23 19:24 Миколай: Давай попробуем по звонку поговорить о нём\n[65033] 2023-12-23 19:32 Миколай: Один смотрел давно другой сейчас\n[65034] 2023-12-23 19:33 Ми
