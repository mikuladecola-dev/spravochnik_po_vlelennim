<script>const BASE="../";const DOCNAME="Старик-исследователь облаков";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Старик-исследователь облаков\n\n*персонаж* · вселенные: вне вселенной\n\n## Навигация\n\n- (w0087) Взрослый герой второй части: в молодости исследовал облака, именно его деревня и поменялась. Посмотрев обзор на историю ГГ-автора, что-то понял, лишился эмпатии по сделке с одержимым, получил мессианский комплекс и решил изменить мир.\n\n## Связано с\n\nДмитрий, Жена-студентка по обмену, Облачная краска, Одержимый с чёрными слезами, Повелитель салфеток\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-04-01\n\nвселенная: вне вселенной (разбор «неясно») · окно w0087 · сообщения 314877–314934\n\n*что здесь: Первый контур в разговоре: учёный, пишет обоснования против покраски, его не слушают, дом красят вместе со всем.*\n\n\n\n```chat\n[314877] 2025-04-01 18:39 Миколай: ну крч\n[314878] 2025-04-01 18:40 Миколай: он обзор посмотрел на рассказ того чела\n[314879] 2025-04-01 18:40 Миколай: этот обзор искажал авторскую мысль и позицию\n[314880] 2025-04-01 18:41 Миколай: привел к тому что второй чел решил всё уничтожить лишившись эмпатии\n[314881] 2025-04-01 18:41 Миколай: но я это не пропишу уже\n[314882] 2025-04-01 18:41 Слава: Какого чела?\n[314883] 2025-04-01 18:41 Миколай: димы\n[314884] 2025-04-01 18:41 Миколай: у него этот стих\n[314885] 2025-04-01 18:41 Миколай: это его работа\n[314886] 2025-04-01 18:41 Миколай: на которую был потом краткий слишком сжатый обзор\n[314887] 2025-04-01 18:42 Слава: Так у него же там типо цвета были всё красиво\n[314888] 2025-04-01 18:42 Миколай: его это ваще бесит\n[314889] 2025-04-01 18:42 Слава: Или ты просто что он на звезды смотрел\n[314890] 2025-04-01 18:42 Миколай: «изнасиловали деревню»\n[314891] 2025-04-01 18:42 Миколай: ну\n[314892] 2025-04-01 18:43 Слава: Я вообще не понял, как покрасить?\n[314893] 2025-04-01 18:43 Миколай: облаками\n[314894] 2025-04-01 18:43 Миколай: технологией\n[314895] 2025-04-01 18:43 Миколай: жители покрасили здания и дороги\n[314896] 2025-04-01 18:43 Миколай: всё нахуй\n[314897] 2025-04-01 18:43 Миколай: как графити\n[314898] 2025-04-01 18:43 Слава: А нахера всё красить?\n[314899] 2025-04-01 18:43 Слава: Типо даже траву\n[314900] 2025-04-01 18:43 Слава: ?\n[314901] 2025-04-01 18:44 Миколай: вот чтобы ярче было, настроение всем поднять\n[314902] 2025-04-01 18:44 Миколай: идея была такая\n[314903] 2025-04-01 18:44 Миколай: ну её там не много, думаю и её\n[314904] 2025-04-01 18:44 Слава: Так бля если 24/7 всё видить в красках у тебя бошка просто заболит\n[314905] 2025-04-01 18:44 Миколай: вот вот\n[314906] 2025-04-01 18:44 Миколай: а он о чем\n[314907] 2025-04-01 18:44 Миколай: износиловали деревню\n[314908] 2025-04-01 18:45 Слава: Так она же не будет получать свет, если еë покрасить?\n[314909] 2025-04-01 18:45 Миколай: а государство за\n[314910] 2025-04-01 18:45 Миколай: да, естественно\n[314911] 2025-04-01 18:45 Слава: И как она это разрешила\n[314912] 2025-04-01 18:45 Миколай: типа цель правильная, краски безопасные\n[314913] 2025-04-01 18:45 Слава: И какой блять государство ты же написал что это типо отдельная деревня можно сказать\n[314914] 2025-04-01 18:45 Миколай: ну в правительстве в принципе ебнутые немного люди у них\n[314915] 2025-04-01 18:46 Миколай: ну в плане\n[314916] 2025-04-01 18:46 Миколай: совет деревни\n[314917] 2025-04-01 18:46 Миколай: я про деревенскую власть\n[314918] 2025-04-01 18:46 Миколай: её назвал случайно государством\n[314919] 2025-04-01 18:46 Слава: Тогда можно просто собраться и свергнуть это предложение или подать жалобу\n[314920] 2025-04-01 18:46 Миколай: так я и написал что ваще не слушают\n[314921] 2025-04-01 18:47 Миколай: стоят на своём\n[314922] 2025-04-01 18:47 Слава: Он же учёный он бы мог как нибудь это расписать и поставить пару фактов\n[314923] 2025-04-01 18:47 Миколай: да, так и делал\n[314924] 2025-04-01 18:47 Слава: Его дом не покрасили ?\n[314925] 2025-04-01 18:48 Миколай: красили всё\n[314926] 2025-04-01 18:48 Слава: Типо они не имеют права красить чужой имущество без разрешения владельца\n[314927] 2025-04-01 18:49 Миколай: да там жители имеют права эмиссией заниматься, тобиж буквально печать деньги\n[314928] 2025-04-01 18:49 Слава: И че?\n[314929] 2025-04-01 18:49 Миколай: сравнивать с нашими правилами бессмысленно\n[314930] 2025-04-01 18:49 Миколай: у них своя система\n[314931] 2025-04-01 18:50 Слава: Так мог бы рассказать о ней, а не просто говорить что сравнивать без мысленно \nИли хотя бы в истории упомянуть и поставить перед читателем факт того что он и правда ничего не может ( а не типо потому что он обленился)\n[314932] 2025-04-01 18:51 Слава: Честно сказать я ожидал большого\n[314933] 2025-04-01 18:51 Слава: Со всём уважением\n[314934] 2025-04-01 18:51 Миколай: за это время в деревне произошла катастрофа, молодёжь, насмотревшись устаревшие тренды запада решила по технологии облачной краски ежедневно красить дома, дороги и всё остальное. а правительство поддерживало и переубедить совсем не выходило. в итоге абсолютно всё было в красках, я не знаю как можно в этом жить, они буквально изнасиловали деревню которую я знаю.\n```\n\n### Версия 2 — 2025-04-01\n\nвселенная: вне вселенной (разбор «неясно») · окно w0087 · сообщения 314960–314960\n\n*что здесь: В плане: обзор → понимание → сделка с одержимым → потеря эмпатии → ошибка и мессианский комплекс → его одолеет повелитель салфеток. Открытый вопрос про семью.*\n\n\n\n```chat\n[314960] 2025-04-01 18:58 Миколай: основная идея боль потери близкого сердцу. потеря дома и невозможность его найти. попытка закрыть глаза. чувство как в садике оставили с другими без родителей без дома игрушек и другого, в последствии привычка с пониманием что заберут домой обратно\n\nидея такая:\n\nвступление: автор (я) говорит читателю &quot;хотелось бы с самого начала подговорить тебя к концу&quot; и далее идёт эта подготовка и несколько раз в сюжете будет плавная подготовка к концу\n\nсначала идет биография чела, в ней его вечные переключения внимания(одно из которой когда все кричат самолет он видит его но переключается на облака и взглядом по ним скачет описывая), жалкое тело, лучше пишет чем другие\n\nсидит на конференции и думает а че на улице все серое скудное, наверняка это важно (заметьте на конференции а не на улице)\n\nпробует себя в публикации произведения\n\nдалее текст произведения для понимания идеи\n\nбыли и другие публикации, о них быстро пробежаться можно (например &quot;Неведомая дичь сделанная своими руками&quot; название серии книг, изначально это название было у другого автора, на гг право выкупил для себя)\n\nпервая публикация изначально и на долго стала известной {серость посвящена девушке встречной на утренней прогулке, стыд за тело вызван ей}\n\nодин из взрослых(исследователь облаков в молодости и кстати именно его деревня и поменялась) смотря обзор на эту историю (можно обзор проиллюстрировать с реакцией) понял кое че, а времени с публикации прилично прошло\n\nодержимый с черными слезами повлиял на старика. то есть они встретились когда старику нужна была сила. одержимый может выполнить что-то для человека в обмен на здоровые нейроны. и у старика он забрал эмпатию. (и он лишается только эмпатии, в остальном он полноценный такой же человек как и все остальные)\n\nбыл сложный вопрос а есть ли семья у него из-за чего я теперь представляю что есть и как она будет реагировать на это как и что он скажет то семье сложный вопрос, надо подумать\n\nавтор первый гг в истории рассматривал ценность серости мира\n\nа во время взрослого молодёжи многое можно\n\nв это время они возрадили и преобразовали культуру граффити и ярких цветов (игра в имена)\n\nстарик понял что надо исправлять и автор предсказал это и так же говорил автор обзора\n\nна деле же мужик ошибся, но получил миссианский комплекс и решил изменить мир, доделаем\n\nего одолеет повелитель салфеток\n```\n\n### Версия 3 — 2025-04-01\n\nвселенная: вне вселенной (разбор «неясно») · окно w0087 · сообщения 314969–314969\n\n*что здесь: Добавлена мотивация после потери эмпатии: возмущение чужими законами о невмешательстве, намерение изменить сошедшее с ума общество, презрение к молодёжи с граффити.*\n\n\n\n```chat\n[314969] 2025-04-01 19:00 Миколай: {если существуют золотые облака, будет и золотой дождь}\n\n{в других странах по типу китая запрещено вмешиваться в судьбы людей, какая чушь. не останавливать преступление значит участвовать в преступлении. я должен изменить это общество которое сошло с ума, правильно говорил Дмитрий в своей поэме, что мир должен быть серым, а молодёжь с этим граффити уничтожает улицы. государство вместо пресечения поддерживает идею, как же отвратительно.}\n\n{лешение эмпатии показать как лишение действенности. я ебанутый}\n\n{в настоящим времени будет говорить о настоящем когда действия пойдут} \n\n{важно заметить что диалога в этом случае не будет с девочкой и женой ибо он не может их полноценно воспринимать как личность}\n\n{его жена студентка по обмену, об этом мало людей знает. после обзора он их не воспринимает и прзерает, перестал понимать. эм ей тогда в отношениях было 19. но возможно они были знакомы ранее и она им восхищалась, была его аудиторией благодарной, он в ней видел мудрую и осознанную девушку, коей она и являлась, а ещё она являлась крайне молодой}\n```\n\n## Неясности\n\n- (w0087) Есть ли у него семья и как она реагирует — автор сам помечает вопрос как нерешённый.</div>"}];</script>
