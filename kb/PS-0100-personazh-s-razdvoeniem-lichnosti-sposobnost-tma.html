<script>const BASE="../";const DOCNAME="Персонаж с раздвоением личности (способность тьма)";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Персонаж с раздвоением личности (способность тьма)\n\n*персонаж* · вселенные: 7 островов\n\n## Навигация\n\n- (w0040) Персонаж Славы: две личности — сонный лентяй без способностей и убийца с тьмой. Слава просит Миколая придумать приёмы, дальше вдвоём лепят механику, реген и предысторию.\n\n## Связано с\n\nОберег, Солнце, Теневые приёмы (предложения Миколая), Тьма\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-06-28\n\nвселенная: 7 островов (по дате объявления) · окно w0040 · сообщения 190713–190824\n\n*что здесь: Объявлен персонаж. Первая личность — лентяй, сонливый, вечно засыпающий, с краткой временной памятью, способностей нет. Вторая — убийца, получающий удовольствие; уточнение Славы: нападает в открытую, показывает ничтожество противника и превращает его в месиво. Тьма сочится из него самого, есть регенерация (отрубленную руку восстанавливает, не прилепляет).*\n\n\n\n```chat\n[190713] 2024-06-28 22:00 Миколай: Каникулы, все дела\n[190714] 2024-06-28 22:00 Слава: Не знаю\n[190715] 2024-06-28 22:00 Миколай: Понятно\n[190716] 2024-06-28 22:00 Миколай: Че там по персам\n[190717] 2024-06-28 22:00 Миколай: Вообще думаешь о них\n[190718] 2024-06-28 22:01 Слава: Щя погодь\n[190719] 2024-06-28 22:01 Миколай: Ок\n[190720] 2024-06-28 22:12 Слава: Ну думаю они лучше чем раньше\n[190721] 2024-06-28 22:13 Слава: Кошку искал\n[190722] 2024-06-28 22:13 Миколай: Где была?\n[190723] 2024-06-28 22:14 Слава: Не нашел\n[190724] 2024-06-28 22:14 Миколай: Аа, капец\n[190725] 2024-06-28 22:15 Миколай: Ну всё норм, придёт ещё\n[190726] 2024-06-28 22:15 Миколай: Или ты найдёшь\n[190727] 2024-06-28 22:15 Миколай: Не переживай главное\n[190728] 2024-06-28 22:15 Слава: Ты если сваливаешь знак подай\n[190729] 2024-06-28 22:16 Миколай: Куда?\n[190730] 2024-06-28 22:16 Миколай: А, пон\n[190731] 2024-06-28 22:16 Миколай: Ты тоже\n[190732] 2024-06-28 22:16 Миколай: Ну я вроде все темки обсудил. А ты хочешь ещё что-нибудь сказать?\n[190733] 2024-06-28 22:17 Слава: Есть один с раздвоением личности способности тьма \nПриемы??????\n[190734] 2024-06-28 22:17 Слава: Придумай\n[190735] 2024-06-28 22:17 Миколай: Ок, ща покумекаю\n[190736] 2024-06-28 22:18 Миколай: В плане тьма\n[190737] 2024-06-28 22:18 Миколай: Это че такое\n[190738] 2024-06-28 22:18 Миколай: Я конечно встречал, но не понимаю\n[190739] 2024-06-28 22:18 Слава: Тень\n[190740] 2024-06-28 22:19 Миколай: Ну у одной личности будет способность шикимару\n[190741] 2024-06-28 22:19 Миколай: Захват\n[190742] 2024-06-28 22:19 Слава: Нет\n[190743] 2024-06-28 22:19 Слава: Подожди\n[190744] 2024-06-28 22:19 Миколай: Пон\n[190745] 2024-06-28 22:19 Миколай: Жду\n[190747] 2024-06-28 22:21 Слава: Первая личность лентяй, сонливый, вечно засыпающий, с краткой временной памятью \nВторая убийца получающий удовольствия\n[190748] 2024-06-28 22:21 Слава: У первой личности нет способностей\n[190751] 2024-06-28 22:26 Миколай: Возможность сталкерить падая в тень, можно это оригинально раскрыть, также, тэпэшка через теневой мир, но не себя а предметов, то есть, может стрелять в свою тень а снаряды из другой вылетают, ну и пожирание солнца внутри человека лишением тени, человек так станет неосязаемым, то есть не нанесёт урон и не возможно будет нанести урон ему, возможно это он в команде будет делать, радиус 5 метров, так челы смогут проходит сквозь препятствия в радиусе действия\n[190752] 2024-06-28 22:27 Слава: Прости прости\n[190753] 2024-06-28 22:28 Миколай: За что?\n[190757] 2024-06-28 22:29 Слава: Все говно кроме солнца\n[190759] 2024-06-28 22:29 Слава: Что не ответил сообщение не увидел\n[190762] 2024-06-28 22:29 Миколай: А, ну норм, не привыкать\n[190763] 2024-06-28 22:30 Слава: Убийца прости это не
