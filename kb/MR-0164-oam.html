особ но который мы можем хоть как-то повлиять). И дальше он по кровеносной системе вместе с кислородом проходит через всё тело, где-то оседая зависима от человека. И также зависимо от человека в нём накапливается определенное количества Оам.то есть у каждого человека своя ёмкость Оам. Если же у человека накапливается больше Оам, чем предусматривает его ёмкость. То Оам выходит через споры, с выдохом и просто через кожу либо другие способы выделением. Выпуск лишний Оам происходит чуть быстрее чем поглащения. \nВ каждым человеке есть Оам но использовать его не как нельзя. Но есть способ. \nЕсли человек поглотит, что-то с большой концентрации( воду либо вздохнет воздух с большими концентрациями Оам) Оам. Его тело просто не успевает выпускать Оам. И у человека два итого может быть. \nПервый: Либо из-за большого количества Оам его лёгкий или сосуд лопаются, либо Оам просто остановит сердца либо Оам из-за своей токсичности убьет человека. \nВторой: человеку удаётся почувствовать и обуздать Оам. Сдерживая Оам, чтобы он не навредил телу. Сдерживать до тех пор пока избытки Оам не выйдут естественным путём. И после когда избытки выйдут. Человек сможет пользоваться Оам ведь он уже почувствовал и сдерживал Оам. \nОпять же это касается только людей. У животных это происходит более инстинктивно. Поэтому шанс выживаемости у них больше чем у людей. Но они не могут раскрыть весь потенциал. \nТакже есть мутанты это животное и люди, у которых под воздействием Оам изменилось их физиология. А также есть некоторый окружающей среды что под воздействием Оам обрели какой-либо воздействия на живых существ. \n\n\nМутанты \nАпостолы- это люди, у которых в утробе матери мутировало нервную систему мозг и глаза. Из-за этого их ней пять чувств, работоспособность мозга, реакция, точность выше чем у обычного человека в несколько раз. \nОбуздать Оам они могут без поглощения огромного количества Оам. Им достаточно пережить одну эмоциональную ситуацию, и они неосознанно воспользуются Оам. И дальше они м
