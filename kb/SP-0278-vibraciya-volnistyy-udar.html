<script>const BASE="../";const DOCNAME="Вибрация (Волнистый удар)";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Вибрация (Волнистый удар)\n\n*способность* · вселенные: неясно\n\n## Навигация\n\n- (w0121) Удар, заставляющий чужую конструкцию колебаться, из-за чего уже применённая способность ослабевает или уничтожается. Занимает второй слот Имета (альтернатива — огонь как план Б).\n\n## Связано с\n\nИмет (Имитатор), Маура\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2026-06-07 · повтор прежней мысли\n\nвселенная: неясно (по дате объявления) · окно w0121 · сообщения 488504–488506\n\n*что здесь: старый вариант: удар отменяет все действующие способности, но противник сразу может применить их снова*\n\n\n\n```chat\n[488504] 2026-06-07 21:54 Слава: Имитатор мужчина \nВладелец глаз \nУ него так и не смогла сформироваться структура дающий способности ( у него вместо него частицы) \nМинусы частиц: плохой контроль; слабая способность накопления ( маленькая количество энергий)\nСпособность:\nОсобая усиления- когда другие усиливают просто часть тела или все тела имитатор усиливает каждую волокна мышцы каждый кость из за этого его усиления раза 10 больше чем у обычных людей;\n&quot;Я не умру пока не кончится энергия&quot;- но здесь понятно\nМатериализация- он может из частиц энергий создать любой не живой предмет но энергий тратится дофига ( если что обычный тоже так могут но то к чему относится структура например структура воды ты можешь без каких проблем создать воду )\nВолнистый удар- удар составляющий структура колебаться из за этого все действующий способности отменяются например ты запустил огненный шар и держишь его где то в воздухе по после того как тебя ударили этот огненный шар исчезает но после удара ты сразу сможешь использовать способность \nУдар разрушающий структуру- чтобы использовать этот удар тебе надо полностью отказаться от защиты да и плюсом твой мозг будет по тихонько сгорать если попытается его использовать, сам удар разрушает структуру на время дела оппонента чуть ли не простым человеком \nНу и его глазки способны видеть чужую структуры и так как у него самого нет структуры то он может с помощью частиц сформировать чужую структуру опять же на время да и структура которую имитируют в разы несовершенной  по сравнений с оригиналом\n[488505] 2026-06-07 22:21 Миколай: нашёл?\n[488506] 2026-06-07 22:21 Слава: Вот\n```\n\n### Версия 2 — 2026-06-07\n\nвселенная: неясно (по дате объявления) · окно w0121 · сообщения 488546–488546\n\n*что здесь: новый вариант: вибрация всего, используется в рукопашном и оружейном бою, выбирается чаще огня «потому что прикольнее»; этому стилю Имет обучил Мауру*\n\n\n\n```chat\n[488546] 2026-06-07 22:58 Слава: Поэтому кроме Имета их никто и не использует. Ну возможно кто-нибудь из апостолов оу может иногда применить, но материализацию точно нет. Сдохнут ведь, даже если апостолы. \nТы не забыл сл может владеть тремя программами в голове. У имета три пустый программы. Одну он всегда оставляет чистое. А вот другие. Он заполняет. \nПервая кукловод. Суть такова &quot;Я не умру пока не кончится оам&quot;.то бишь он управляет своим телом как куклой и поэтому независимо от урона он способен двигаться, пока способен поддерживать эту способность. Даже если его сожгут так что будут кости видны он будет двигаться, даже если его внутронности будут разбросаны по всему полу боя он будет двигаться пока действует способность. \nВторой слот он заполняет либо огнём, в котором он спец, так сказать план б если вдруг ситуация будет рисковой, чтобы у него была способность в которой он уверен. Но чаще всего он заполняет её вибрации. Именно что вибрации всего. Он использует его для рукопашного боя ( хотя он прям редко дерётся кулаками, он дерётся разными оружими, который принимает мимик артефакт). Чуть такова при ударе он способен вызвать вибрации чужую конструкция, ослабевая или вообще уничтожая способность. Именно что способность что уже применена. Но враг может быстро применить опять способность, всё же у него готовый шаблон. Он чаще всего использует вибрацию потомучто это прикольне. Он также научил этому стилю Мауру ( уродливая маска апостол со способностью вибрация) \nНу вроде все, если ничего не забыл. Ну фактик оу не способны использовать сл, нет способны просто у них потом будет много разорваных мыщцы даже при правильном применения и у них нет той же регенерации как у ис. \nНаур также владеет оу. Но не применяет так как у него итак четыре способности который он способен использовать одновременно. Также оу нельзя применить с комбинации с чем либо, с какой либо способностью.\n```\n\n## Часть чего\n\nИмет (Имитатор)</div>"}];</script>
