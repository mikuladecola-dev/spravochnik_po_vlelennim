ая применяемая. А дальше мне лень искать.\n[361201] 2025-09-03 22:09 Слава: Блять\n[361202] 2025-09-03 22:10 Слава: Есть ещё тёмная энергия\n[361203] 2025-09-03 22:10 Слава: Из-за которой вселенная расширяется\n[361204] 2025-09-03 22:11 Слава: Груба говоря это антигравитация, которая отталкивает саму вселенную заставляя ее расширяться. И со временем всё быстрее её расширяя\n[361205] 2025-09-03 22:11 Слава: Ну всё это опять же не доказано. Просто красивая теория учёных\n[361224] 2025-09-03 22:22 Слава: Прикольно да тёмная материя это гравитация, а тёмная энергия это антигравитация. При этом обоих и не существо, то есть у них нет физических тел. Тёмная материя конечно возможно владеет физическим телом, как никак гравитация возникает лишь там где есть физическое тело то есть масса, но масса обозначения как физического тела\n, но пока всё что мы о неё знаем, что её не увидеть не как она не отражает не поглощает свет и другие волны\n```\n\n### Версия 2 — 2025-09-09 · повтор прежней мысли\n\nвселенная: Апостол (по дате объявления) · окно w0103 · сообщения 363069–363077\n\n*что здесь: Тот же текст переслан Славой повторно, без нового содержания и без реакции Миколая.*\n\n\n\n```chat\n[363069] 2025-09-09 08:56 Слава: Это невидимый и не излучающие, не поглощающие какие либо волны. Грубо говоря её как бы нету. Но она есть и у неё есть масса.\n[363070] 2025-09-09 08:56 Слава: Учёные скидывают на неё всё свои необъяснимый в космосе вещи. Ведь в космосе всё ( почти) звезды двигаться на одной скорости. Но это не возможно. Ведь скопления объектов с массой ( планеты), разлагается не полностью во всём космосе. Из-за этого звезды должны двигаться в хаотичной скоростью. Но нет они двигаться с одной скоростью, потому что дополнительную гравитацию делает как раз чёрная материя.\n[363071] 2025-09-09 08:56 Слава: И можешь поискать применяемая математика и физика для космоса. Для вселенной вообще то. Просто видео посмотрел где говорилось что не применяемая. У нейронки спросил она типа прим
