колай: Лучше делай персонажей и ролик\n[37112] 2023-03-22 16:45 Миколай: Нет\n[37113] 2023-03-22 16:46 Миколай: Ну идею можешь обдумать лучше, чтобы понимать как ты хочешь всех изобразить\n[37114] 2023-03-22 16:46 Слава: Если я сегодня забью то не смогу успеть к пятнице\n[37115] 2023-03-22 16:46 Миколай: Ок\n[37116] 2023-03-22 16:47 Миколай: Тогда желаю тебе удачи\n[37117] 2023-03-22 16:47 Слава: Спасибо\n[37118] 2023-03-22 16:47 Миколай: Я тогда тоже сегодня начну\n```\n\n### Версия 2 — 2023-03-23 · повтор прежней мысли\n\nвселенная: вне вселенной (разбор «неясно») · окно w0011 · сообщения 37144–37266\n\n*что здесь: Ожидание готовых персонажей, напоминания и таймеры без нового содержания*\n\n\n\n```chat\n[37144] 2023-03-22 19:16 Миколай: Сделаешь персонажей отправь\n[37145] 2023-03-22 19:16 Миколай: Я буду ждать\n--- пауза 11.0 ч ---\n[37207] 2023-03-23 06:16 Слава: Коля спасать\n[37208] 2023-03-23 06:16 Слава: Спасай\n[37209] 2023-03-23 06:16 Слава: Дай ластик\n[37210] 2023-03-23 06:24 Миколай: Я к сожалению тоже без него\n--- пауза 5.4 ч ---\n[37211] 2023-03-23 11:48 Слава: https://resh.edu.ru/subject/lesson/3344/start/\n--- пауза 2.2 ч ---\n[37226] 2023-03-23 14:02 Слава: https://youtube.com/@ulthacker1097\n[37228] 2023-03-23 14:31 Миколай: Прости, но я съебался\n[37229] 2023-03-23 14:31 Миколай: Прощай\n[37230] 2023-03-23 14:31 Слава: Как\n[37231] 2023-03-23 14:31 Слава: Тебе разрешили\n[37232] 2023-03-23 14:31 Миколай: Но\n[37234] 2023-03-23 14:32 Слава: Не честно\n[37235] 2023-03-23 14:39 Миколай: Сочувствую\n--- пауза 1.2 ч ---\n[37240] 2023-03-23 15:51 Миколай: Соло лэвелинг скоро будет в аниме\n[37241] 2023-03-23 15:51 Миколай: Уже есть тизер на кранчероле\n[37258] 2023-03-23 16:25 Миколай: https://youtu.be/eqy85AL70PU\n[37259] 2023-03-23 16:27 Миколай: Скоро, это зимой 2024 года\n[37260] 2023-03-23 16:28 Миколай: Поздравляю, Оптимус набрал 60 тысяч просмотров\n[37261] 2023-03-23 16:30 Миколай: Ну и через несколько часов сайтами тоже наберёт\n[37262] 2023-  16:34 Миколай: И долго ты там будешь?\n```\n\n### Версия 4 — 2023-03-27\n\nвселенная: вне вселенной (разбор «неясно») · окно w0011 · сообщения 37522–37529\n\n*что здесь: Уточнение по Андрею: если рисуешь его, то это не гуль, а человек по профессии голубь*\n\n\n\n```chat\n[37522] 2023-03-27 13:32 Миколай: Ок\n[37523] 2023-03-27 13:34 Слава: Гуль\n[37524] 2023-03-27 13:35 Миколай: Это кто\n[37525] 2023-03-27 13:35 Слава: Гуль\n[37526] 2023-03-27 13:35 Миколай: Андрей\n[37527] 2023-03-27 13:36 Миколай: ?\n[37528] 2023-03-27 13:59 Миколай: Если ты его рисуешь, то это не гуль, а человек, по профессии голубь\n--- пауза 2.2 ч ---\n[37529] 2023-03-27 16:13 Миколай: Делай ролик как можно лучше и интереснее, чтобы не было скучно на протяжении всех 12 минут, перерывы каждые 4-3 минуты.\n```\n\n## Неясности\n\n- (w0011) Вселенной нет; неясно, куда идут эти персонажи — в ролик, в соревнование или в отдельный рисунок</div>"}];</script>
