<script>const BASE="../";const DOCNAME="Монстры из мифологии (копилка)";
const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Монстры из мифологии (копилка)\n\n*мир* · вселенные: неясно\n\n## Навигация\n\n- (w0105) 2025-09-17 Слава пересылает в чат карточки существ из канала про мифологию (Шаркань, Атцыс, Грим, Анзуд, Сикомэ) и объявляет: буду всё интересное сюда закидывать. 2025-09-18 из этого выводится правило — монстров можно просто брать из мифологии, а придумывать надо расы.\n\n## Связано с\n\nСлавянская мифология (небеса, Буян, мировое древо), Шаркань, новая вселенная (безымянная, «Разрушаем вселенную»)\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-09-17\n\nвселенная: неясно (по дате объявления) · окно w0105 · сообщения 366243–366251\n\n*что здесь: заведена копилка: пересланы Шаркань, Атцыс (вампир-стог сена), Грим (призрачный чёрный пёс), Анзуд (львиноголовый орёл), Сикомэ (японские демоны-воины)*\n\n\n\n```chat\n[366243] 2025-09-17 12:52 Слава: Шаркань\n\nТак же есть легенда, что шаркань был человеком, который решил выпить драконью кровь. По легенде, если её выпить, можно стать бессмертным. Но этот человек превратился в отвратительного дракона - Шарканя. Дело в том, что Шаркань действительно бессмертен, но его жизнь - настоящий ад. Этот дракон вынужден вечно искать жертв, на растерзание демонам, а сам он испытывает постоянный, неутолимый голод. По ранним легендам, Шаркань был поход на обычного ядовитого змея, но потом его переделали в многоголового крылатого дракона. Часто Шаркань ездит на чёрным коне по лесу ночью.\n[366245] 2025-09-17 12:52 Слава: Мне нравится\n[366246] 2025-09-17 12:53 Слава: Можно добавить как ядовитого чудища\n[366247] 2025-09-17 12:54 Слава: Атцыс\nСвоеобразный вид вампиров, охотящиеся по ночам на одиноких путников. Представляют из себя либо копну сена либо небольшой стог, приглашая тем самым путника задержаться и отдохнуть, после чего душат.\n[366248] 2025-09-17 12:54 Слава: Буду всё интересное сюда закидывать\n[366249] 2025-09-17 12:55 Слава: Грим\n\nДемон, являющийся в образе призрачного чёрного пса или телёнка. Чаще всего появляется на кладбищах средневековой Европы. Также, гримы нередко приходят к домам и своим воем предвещают гибель на подобие плача баньши.\n[366250] 2025-09-17 12:56 Слава: Анзуд\n\nВ шумеро-аккадской мифологии огромная птица божественного происхождения, представляемая в виде львиноголового орла (позднее, приблизительно с 14 в. до н. э., - просто в виде орла). На памятниках изобразительного искусства (главным образом глиптике) часто изображён в геральдической композиции - когтящим двух оленей (или других животных). В надписях упоминается начиная с 26 в. до н. э.\n[366251] 2025-09-17 12:57 Слава: Сикомэ\n\nэто воинственная раса демонических существ в японской мифологии.\nЭти существа намного сильнее простого человека и даже воина. Они выглядят как мускулистые и высокие существа, похожие на демонов О́ни. Одеты в рваные набедренные повязки. Имеют очень острые зубы и горящие красным огнём глаза. Сикомэ всегда мужчины. Как правило не занимаются ничем другим, кроме драк между собой и людьми. Такие сражения сопровождаются Рычанием сикомэ. Они часто устраивают засады в горах. Сикомэ опасны тем что могут заманивать людей своеобразной магией.\n```\n\n### Версия 2 — 2025-09-18\n\nвселенная: неясно (по дате объявления) · окно w0105 · сообщения 366585–366587\n\n*что здесь: правило: монстров берём из мифологии в изменённом виде, думать надо над расами*\n\n\n\n```chat\n[366585] 2025-09-18 11:03 Слава: Добавлять ещё насекомых \nКаменный жук\nБелая бабочка или гусеница \nЧёрный червь\n[366586] 2025-09-18 11:07 Слава: Кто у нас как раса есть Поротой Азуриэль Апостолы Одержимый \nНу и монстры который я тебе скинул ну изменённый \nСейчас надо думать о расе ведь монстров можно просто из мифологии взять\n[366587] 2025-09-18 11:10 Слава: .\n```\n\n## Неясности\n\n- (w0105) сами тексты карточек пересланы из чужого телеграм-канала, авторской переработки, кроме Шарканя, в окне нет</div>"}];</script>
