const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Благословение\n\n*способность* · вселенные: Апостол\n\n## Навигация\n\n- (w0070) Сила, которую правитель мира может дать только человеку из нашего мира. Благословенный остаётся человеком, благословение надо активировать; сила уровня 10 — сломать деревянный дом, не более. Бог и дьявол дают по 21 человеку, держится до смерти носителя.\n- (w0071) По ходу разговора об артефактах проговариваются правила работы благословений: равенство по силе независимо от источника и временность действия.\n- (w0072) Общая механика: у благословённого Богом при активации благословения белеют глаза. Слава замечает, что этими же глазами наделил тех, кто должен был быть благословлён дьяволом, менять не хочет — и предлагает вообще убрать благословенных дьяволом. Обсуждается число благословенных: 21 или 42. Позже добавляется третий вид — благословение правителем нашего мира.\n- (w0079) Люди, у которых есть связь с правителем другого мира. Чтобы получить силу, её надо пропустить через мозг, из-за этого благословенные не могут пользоваться силой круглосуточно.\n- (w0081) Механика мира, показанная в бою и разобранная в диалоге 302666-302681, 302766-302780: благословение получают в критический момент, благословение от бога делает апостолом, признак — белые светящиеся глаза.\n- (w0083) Сила, которую правитель одного мира даёт разумному жителю Кильки через связь с мозгом. Механика разобрана в разговоре имитатора и защитника (305856), работа показана в бою (305857-305858).\n- (w0099) Механика передачи силы правителя существу через связь, установленную на мозге. Даётся без согласия, одно на всю жизнь, разорвать нельзя, укорачивает жизнь.\n\n## Связано с\n\nАльфы, Апостолы, Арбетар, Арбетары, Арбетары и Альфа, Артефакты, Базовые умения благословенных бога, Базовые умения благословенных дьявола, Бессмертный, Бог, Братья и сёстры (благословенные одним правителем), Всегда активное благословение Бессмертного, Дьявол, Защитник, Иерархия силы, Имитатор, Организация злодеев, Правители, Правители минимиров, Правители миров, Предохранитель, Пустынник, Связь между благословенными, Семь грехов, Территории и организации благословенных, Чужамирцы\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-01-06\n\nвселенная: Апостол (по дате объявления) · окно w0070 · сообщения 278852–278852\n\n*что здесь: Введение: правители могут дать своё благословение, но только людям нашего мира*\n\n\n\n```chat\n[278852] 2025-01-06 14:17 Слава: Сразу, все это происходит в современном мире \nВот есть наш мир будем называть &quot;Вселенной&quot; и этот мир самый большой \nИ как ты понял есть ещё миры помимо нашего \nНа втором месте по размеру это &quot;рай&quot; и &quot;ад&quot;\nНу и также существует множество минимиров \nВообще все миры будь то &quot;рай&quot; или &quot;ад&quot; или минимиры всегда связаны с нашем миров так как наш мир появился первым и является самым большим, и чаще всего минимиры пытаются копировать нашей мир \nИ вот чаще всего эти минимиры темный жуткий жестокий все существо там опасный \nИ иногда случается так что существа из минимиров выбираются в нас и творят бесчинства, и все те мистический монстры( драконы, упырь, оборотни, леший, и т.д) это существа из минимиров.\nИ вот что насчёт &quot;ад&quot; и &quot;рая&quot;, вот смотри мы умираем и отправляемся в рай или ад, ну или в минимирок ну это случается крайне редко \nИ вот из &quot;рай&quot; по понятным причинам не кто не хочет сбегать, а вот с &quot;ад&quot; грешники сбегают, и вот сразу дьявол правитель &quot;ада&quot; добрый, типо он карает грешников\nИ вообще почему мы существо из нашего мира вдруг после смерти отправляемся в других мира, из за &quot;смерти&quot; она после нашей кончины не даёт остаться в вторых правитель минимиров довольно редко дают свой благословение \nБольше все благословенный даёт бог и дьявол\n[278942] 2025-01-06 14:47 Слава: Их ний полномочия\n[278943] 2025-01-06 14:48 Слава: В раю много добрых людей и бог име проникся из за этого даёт благословение\nУ дьявола часто сбегают в грешники в наш мир и их надо возвращать поэтому он даёт благословение\n[278944] 2025-01-06 14:49 Слава: И бог и дьявол могут дать свой благословение лишь 21 человеку\n```\n\n### Версия 3 — 2025-01-06\n\nвселенная: Апостол (по дате объявления) · окно w0070 · сообщения 278945–278954\n\n*что здесь: Благословение держится, пока человек не умрёт*\n\n\n\n```chat\n[278945] 2025-01-06 14:50 Миколай: а демоны или ангелы в наш мир сбегают?\n\nкстати я так понял рай и ад миры не совсем зависящие от нашего мира раз там по целый стать худшей или лучшей версией если я прав\n[278946] 2025-01-06 14:50 Миколай: пока человек не сдохнет?\n[278947] 2025-01-06 14:50 Слава: Неа\n[278948] 2025-01-06 14:50 Слава: Да\n[278949] 2025-01-06 14:50 Миколай: всё мимо?\n[278950] 2025-01-06 14:50 Слава: Первой мимо\n[278951] 2025-01-06 14:50 Миколай: .\n[278952] 2025-01-06 14:51 Миколай: а почему?\n[278953] 2025-01-06 14:51 Миколай: почему не сбегают\n[278954] 2025-01-06 14:52 Слава: Ангела просто незачем сбегать \nА демоны бояться гнева дьявола который и так в бешенстве что сбегают грешники\n```\n\n### Версия 4 — 2025-01-06\n\nвселенная: Апостол (по дате объявления) · окно w0070 · сообщения 278958–278967\n\n*что здесь: Всего благословенных бога и дьявола сейчас 42; общество о мирах не знает, но благословенные имеют большую власть у верхушки и могут многое. Первый рабочий шаг — придумать способность каждому благословенному*\n\n\n\n```chat\n[278958] 2025-01-06 14:53 Миколай: вселенная получилась интересной\n[278959] 2025-01-06 14:53 Миколай: как планируешь с ней работать?\n[278960] 2025-01-06 14:54 Миколай: а и кстати, общество не знает о хуйне этой, а че благославленые и драконы\n[278961] 2025-01-06 14:5
