ет есть? - спрашивает Мишка. Я же качаю головой. Электричество как уже с двух часов дня нету, а сейчас уже закат летом. \n-а связь ловит? - продолжил задавать вопрос Мишка. Снова покачав головой, я всё же не выдержувыюсь и говорю. \n-Мишка, че за вопросы. Просто скажи, что происходит и всё- \n-да блять. Хрен знает, что происходит- говорит Мишка потирай подбородок\n- слушай у всей деревни свет нету и связь не ловит. Мужики у кого есть машина, в город поехали узнать почему электричество выключили. Так до сих пор не приехали- произносит Миша глотая слюну в засохшем горле. \n- а ещё и на внука Любки, Кто-то напал и руку полоснул. Да кровищей там было. Володя, что руку бинтовал говорил, что нервы задела и пацан больше не сможет, как прежде рукой махать- сказал Миша. А я задумался, как так-то. На кого-то напали, а я только сейчас узнаю. \n-кто напал то, а Мишка? - задаю вопрос\n-в том то и дело, что не знаю, кто напал. Знают только, что в лес убежал- \n-пацан то этот говорит, что чудовищя какой. Ну ему конечно некто не поверил. В шоке пацан просто. Ну всё же, кто его так полоснул- Закончил Миша ускорив шаг. \n\nДа уж получается я мог не идти. Думаю, чтобы преступника поймать этой толпы хватит вполне себе, а я мог остаться и чай попить, у меня же там ещё и сладости завалялись, и бутерброд можно было бы сделать добавив больше колбасы.... Сука есть охота. \n\nНет ну почему мне изначально ничего не обьснили. Хотя может и объясняли, а я просто не услышал. Устал же я всё же, пока весь день работал. И они просто толпой мимо моего забора прошли и начали созывать и выкрикивать дружной толпой разные слова, что хрень пойми, о чем они. Ну и я дурак подался коллективному помешательству и пошёл за ними. \n\nСейчас уже поварачивать назад по-дурацки будет. \n\n.......... \n\nНе знаю сколько шли мы еще. Но комары успели знатно меня покусать. Всю шею искусали и как будто даже волосы. Ещё и темно стало и я так как недавно здесь обоснавался не привык к лесу этому. И раза четыре спотыкался и
