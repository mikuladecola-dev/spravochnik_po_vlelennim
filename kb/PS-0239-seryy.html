 всё лишь смеялись. \n-Смотрите свинья плачет- задорным голосом произнёс Серый . А Миша лишь лежал на полу. Он не знал, что в этой ситуации делать. Его воспитывала мать. Отца у него не было и он не знал, как поступить. Он просто встал и пошёл умываться. Вот с того дня и начались избиения, раздевания. А Миша просто терпел. Он не плакал, он просто копил всё в себе. И когда наконец-то уже не смог держать всё в себе. Он ударил главарь. Он продолжал его бить пока его не силой откинули от главаря. Это был учитель, он откинул Мишу. Как после Миша узнал это был отец Серого. Именно из-за того, что отец серого был учителем. Все проделки его сына пропускали мимо глаз. А вот Мишену проделкю поставили на уши. Словно Миша не просто кого-то избил, а убил или сделал калеку. Тогда Миша испытал странные чувств. Нет, большинство чувств, который он тогда испытал. Были ему знакомы. Виде бессилия, обиды, страха, гнева, вина. Вина не за то, что он избил серого. А за то, что его матери пришлось извинятся перед этими людьми. Это вина разьедала его и стала оковами. Ведь елинственный дорогой человек сейчас извинялся за то, что и не должен был извинятся. Поэтому вина стало оковами державший его эмоции теперь возможно навсегда в себе. Он не хотел, чтобы из-за его эмоции его мать страдала. Поэтому решил закрыться для всех. Даже для неë. \nЕго перевели в другую школу. Там в первой время было хорошо. Мишу ни кто не трогал, как и он. Но время шло и хулиганы уже этой школы заметив тихого толстика, не выделяющимся, какой-то физической формы. Решил сделать его шестеркой. Он терпел и больше не срывался. Просто молча всё терпел. Хулиганом это в первой время нравилось. Но после они поняли, что издеваться над тем, кто не испытывает чувств. То, кто конечно боится их. Но не умоляет отстать. Не смотрит взглядом неудачника. И не кричит от боли. Пробуждала в них некий гнев &quot;как этот неудачника посмел&quot;. И вот такие мысли были у каждого из них. Поэтому одним из днём. Они подождали его возле школы, а по
