const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Вселенная: вне вселенной\n\n## Отрезки жизни\n\n_Границы поставлены по объявлению в чате плюс дате, а не по содержанию. Отрезки могут быть несмежными — это нормально._\n\n| С | По | По какому объявлению |\n|---|---|---|\n| 2025-03-20 | 2025-03-25 | смена 306564 — следующая история вне его вселенной; подтверждение 306750 («новая история не связана с моей вселенной») |\n| 2025-03-26 | 2025-03-30 | объявление 311410 — история, не связанная ни с какой вселенной, «просто решил поэкспериментировать» |\n| 2025-11-01 | 2025-11-16 | объявление 381301 — сюжет прямо объявлен не связанным ни с одной их вселенной (мирок с манна-системой и разломами) |\n\n### События-объявления\n\n_Границы — по объявлению в чате плюс дате, а не по содержанию. Отрезки могут быть несмежными._\n\n| Дата | Событие | Окно | Сообщения |\n|---|---|---|---|\n| 2025-03-26 | объявление — С объявляет, что пишет историю, не связанную ни с какой вселенной, «просто решил поэкспериментировать». Это та история, которую он выложит 2025-03-27 (проза про Серого); 313099 подтверждает: «просто вне какой-то вселенной». | w0086 | 311407–311412 |\n| 2025-11-01 | объявление — Слава прямо говорит, что сюжет не связан ни с одной их вселенной — отдельный клишированный мирок с манна-системой и разломами, откуда приходят монстры | w0108 | 381300–381305 |\n\n### Дословно — объявления\n\n\n**2025-03-26 · объявление**\n\n```chat\n[311407] 2025-03-26 13:15 Миколай: я просто думал та критика вышла слишком широкой и тебе возможно интересно посмотреть детали\n[311408] 2025-03-26 13:16 Миколай: я не буду это читать, но это твоя история, может увидишь то что интересно\n[311409] 2025-03-26 13:16 Миколай: ахахах, просто это очень много\n[311410] 2025-03-26 13:16 Слава: Сейчас я пишу историю не связанной с какой либо вселенной\n[311411] 2025-03-26 13:16 Слава: Просто решил поэкспериментировать\n[311412] 2025-03-26 13:17 Миколай: ну кстати\n```\n\n\n**2025-11-01 · объявление**\n\n```chat\n[381300] 2025-11-01 20:58 Слава: Давай подумаем\n[381301] 2025-11-01 20:59 Слава: Всё просто. Я крутил сюжет в голове не связанный со вселенной. Просто простенький мирок, современность манна система и разломы откуда приходят монстры. Клише среди клишей\n[381303] 2025-11-01 21:13 Слава: И вот гг осталься единственным человеком. \nОн безэмоциональной словно больше инстинктивно сражаться с ордами чудищ. Не видя не надежды, не победы, он просто сражается как работ у которого одна цель перебить чудовищь\nЕдинственное что он слышит вокруг это мерзкий звуки издаваемый монстрами. Его ранят его рубят. В нём прорастають, его лишают глаз выпив их. Ему ломают кости руки ноги. Всё что можно, но он встаёт не из-за воли, а лишь потому что не может по другому. И где-то далеко существо выше всех являющий по сути Богом плачет. Существу жаль и больно смотреть на попытки последнего человека подняться. Его душа разрывается но оно бессильно и может лишь наблюдать, как один мир поглощает другой. Поэтому он молит, чтобы человек сдался и принял смерть, ведь для него и для человека это легче. Там больше не из-за чего сражаться всё умерли, не кого больше не ту. Лишь Орды чудовишь что желають тебе смерти, так что пожалуйста умри быстрее и бесполезно\nНо по итогу существо не выдерживает и вмешивается отправля гг  в прошлое, а само попадая в НИЧТО. \nГг просыпается и видео в окно целый город, людей и в его голове всё накладывается на те воспоминания, где город залит кровью людей \n( что вообще в этой ситуации должен почуствовать гг, он убивал монстров не из-за мести, а лишь потому что по другому не мог. Ка робот он просто убивал их. И да он будет желать всех спасти ценой себя самого, наплевав на мнение близких. Но что он почуствовает, когда вернётся в прошлое.\n[381305] 2025-11-01 21:17 Слава: Лично мне кажется, что во время просмотра в окно. Он будет смотреть на людей и в его глазах будет мерещиться их ней мёртвый изуродованный тела. И в конце он блуваенет и будет в панике даже в ужасе\n```\n\n## Что внутри\n\n| Вид | Название | Версий | С даты | Файл |\n|---|---|---|---|---|\n| идея | [2D Minecraft](../sushnosti/idei/ID-0019-2d-minecraft.md) | 1 | 2023-06-10 | `sushnosti/idei/ID-0019-2d-minecraft.md` |\n| идея | [Аниме про себя](../sushnosti/idei/ID-0011-anime-pro-sebya.md) | 1 | 2023-02-15 | `sushnosti/idei/ID-0011-anime-pro-sebya.md` |\n| идея | [Аниме-двойники соавторов](../sushnosti/idei/ID-0005-anime-dvoyniki-soavtorov.md) | 1 | 2022-10-01 | `sushnosti/idei/ID-0005-anime-dvoyniki-soavtorov.md` |\n| идея | [Видео по МГА для канала](../sushnosti/idei/ID-0012-video-po-mga-dlya-kanala.md) | 1 | 2023-02-16 | `sushnosti/idei/ID-0012-video-po-mga-dlya-kanala.md` |\n| идея | [Главный злодей Коля / тень президента](../sushnosti/idei/ID-0060-glavnyy-zlodey-kolya-ten-prezidenta.md) | 1 | 2024-05-12 | `sushnosti/idei/ID-0060-glavnyy-zlodey-kolya-ten-prezidenta.md` |\n| идея | [Игра про Дамблдора, убивающего Гарри Поттеров](../sushnosti/idei/ID-0170-igra-pro-dambldora-ubivayuschego-garri-potterov.md) | 1 | 2026-06-14 | `sushnosti/idei/ID-0170-igra-pro-dambldora-ubivayuschego-garri-potterov.md` |\n| идея | [История про пушистых монстров](../sushnosti/idei/ID-0128-istoriya-pro-pushistyh-monstrov.md) | 1 | 2025-03-20 | `sushnosti/idei/ID-0128-istoriya-pro-pushistyh-monstrov.md` |\n| идея | [Канал с интересными фактами о странах](../sushnosti/idei/ID-0015-kanal-s-interesnymi-faktami-o-stranah.md) | 2 | 2023-05-22 | `sushnosti/idei/ID-0015-kanal-s-interesnymi-faktami-o-stranah.md` |\n| идея | [Команда по созданию мультиков](../sushnosti/idei/ID-0132-komanda-po-sozdaniyu-multikov.md) | 1 | 2025-03-24 | `sushnosti/idei/ID-0132-komanda-po-sozdaniyu-multikov.md` |\n| идея | [Комикс (сюжет любой)](../sushnosti/idei/ID-0010-komiks-syuzhet-lyuboy.md) | 1 | 2023-01-07 | `sushnosti/ide
