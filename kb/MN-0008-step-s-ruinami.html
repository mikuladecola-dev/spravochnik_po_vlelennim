было. она рисовала на песке и я решил присоединиться. вместе бы нарисовали триптих Босха и как кронос пожирает своих детей. причём как я люблю отмечать такие моменты, инициатива в выборе работ для перерисовки была не за мной, а сей юной леди, что меня не удивило. и я вовсе не чёрствый, это действительно впечатляет, однако сие событие было крайне обычным в сравнении с тем, что она была единственным живим существом в той степи. ну по крайней мере я так думал ибо женщина чью кожу с левой лопатки жевала девочка, возможно являвшаяся матерью не подавала признаки жизни. хотя прозвучало оскорбительно, женщиной её точно звать не стоит это вполне молодая девушка, двадцати лет. \n\nпростите я остановлюсь. мне было жутко, страшно. но я знаю, что о детях важно заботиться и я не подавал виду, как минимум её воспитание не моя ответственность, хотя полицию и скорую я вызывал, но меня забрали с девочкой, а женщину они трогать не стали и не возвращались потом к ней, что довольно странно. и сколько я бы о ней не спрашивал они игнорировали темы связанные с ней. девочку увезли в скорую из-за пищевого отравления, а меня домой.\n\nда, со мной вообще не говорили всю дорогу, лишь в конце попросили не поднимать эту тему в разговорах. и всё. ну конечно мне интересно и я решил разобраться, ушёл в ту степь, среди которой много руин, трупов, черепов, гнилых растений. я искал остатки той женщины которую жевала девочка. \n\nя ошибся. хотя нет. она ошибка. ладно, ты не понял о чем я, ща поясню. девочка тогда была не одна по среди этого адского места, живой. эта девушка тоже жива. но, у неё не билось сердце, я тогда проверял. она была бездыханна и холодна. а сейчас сидит и избивает могилу какого-то парня. \n\nкакая мерзость, девушка не имеет права на смерть. конечно. можете сказать что я спешу в этом заключении, но нет. даже этот случай громко говорит о том, что она отринула смерть. она не способна умереть и это страшно, её нельзя допускать до общества.\n\nиз этой истории, я хотел показать, что быва
