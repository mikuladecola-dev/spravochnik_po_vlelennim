const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Лабиринт разговора\n\n*идея* · вселенные: монстры\n\n## Навигация\n\n- (w0055) Развёрнутая метафора М (224953, написана «позавчера»): разговор с человеком как проход по тёмному лабиринту с системой наград и наказаний — стены, факелы, расширяющееся пространство, отсутствие награды за выход. Прозвучало и заглохло, Слава не ответил по существу.\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2024-08-26\n\nвселенная: монстры (по дате объявления) · окно w0055 · сообщения 224952–224956\n\n*что здесь: полный текст метафоры выложен в чат*\n\n\n\n```chat\n[224952] 2024-08-26 14:29 Миколай: ч как?\n[224953] 2024-08-26 14:36 Миколай: говорить с другим человеком, особенно стремясь уважать границы это как проходить лабиринт в темноте, но со следующей системой наград и наказаний: если проходишь сквозь стену то ты получаешь урон, а стена пытается сохранить закон существования и поэтому пытается убрать вас в разрешение системой пространство, визави может поставить на стену факел, тогда ты уже можешь осознанно обходить стену или нет. при проходе по открытому пространству за определённое количество безошибочных шагов в качестве наград появляются опции а пространство увеличивается, но то как с ними работать вопрос личный и зачастую проблематичный. этот лабиринт не наградит за выход ибо в его системе это не достижение, но в некоторых ситуациях лично для вас выход из него будет ценным и спасительным, особенно когда стены сужаются и разрешённого пространства не остаётся.\n[224954] 2024-08-26 14:36 Миколай: позавчера накулякал\n[224955] 2024-08-26 14:36 Слава: Не прочел ещё\n[224956] 2024-08-26 14:36 Миколай: ок\n```\n\n## Неясности\n\n- (w0055) к вселенным отношения не заявл
