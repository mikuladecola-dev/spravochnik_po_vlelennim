const LEAD="";
const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Клон ведущего\n\n*персонаж* · вселенные: вне вселенной\n\n## Навигация\n\n- (w0111) «Прошлый я» ведущего, собранный из дыма: моложе, в белой футболке и мешковатых штанах, с усталым видом. Начало в w0110 [387591], в окне — [387592–387593].\n\n## Связано с\n\nВедущий, Маска ведущего\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-11-21\n\nвселенная: вне вселенной (разбор «неясно») · окно w0111 · сообщения 387591–387593\n\n*что здесь: Голова клона раскрывается как шкатулка, оттуда выходит «карнавал безумия» — летающие младенцы-монстры, строй дрожащих солдат, огромные рыбы; после ведущий роняет клона, тот превращается в дым и в маску.*\n\n\n\n```chat\n[387591] 2025-11-21 18:19 Слава: Шут в костюме \nДамы и джентльмены. На сцене ведущий. \n-благодарю, что вы всё здесь собрались ради меня. И прошу прощения, что предоставил вам такой плохую сцену- сказал мужчина разводя руками. Одет он был в костюме 19 века и имеющие на голове колпак. \n-да брость вы. Мы очень рады, что хоть на этой сцене увидели вас- заголосили зрителей в один тон. Всё они тоже были одеты в костюмы 19 века и пахли слегка тухла. \n-как же я польщён- нагнувшись в знак приветствия или благодарности. Произнес мужчина. \n-ну не будем уходить в сентиментальности. Нас ждёт куда более интересный вещи- бодра и радостно произнёс мужчина. Расхаживая на сцене. И делая вид задумчивого человека. \nПублика ждала. Дети пискляво кричали, чтобы представлений скорее началось. Женщины охали в нетерпении. Мужчины же сидели с угрожающим видом. Но глазами тожа прощая быстрее начать- это представления. На котором всё они собрались. Всё были в ожидании. А ведущий словно про себя говорил \n-так, так, какой бы вам Что вы зритель увидели интересную картину. - Зритель на столь резко и импульсивно подняли руки. Что даже ведущий слегка содрогнулся. \n- ой простите. У меня уже есть помощники и я уже хотел их пригласить - виновато произнёс ведущий. Зритель грустно опустили руки. Но ведущий слегка поколебавшись. Гордо произнёс \n- ну раз вы хотите участвовать. Я всё уступлю вам, часть моей сцены. Но лишь для одного человека. И думаю вы будете не против если на сцене будет именно та, что предложила мне поведать свою историю- ведущий внимательно посмотрел на зритель. Те конечно были против. Ведь на сцену хотели именно они. Но приняв факт, что им туда не попасть. Всё же согласились с предложением ведущего. \nВедущий получив согласия. Подошёл к девочке, что первая крикнула о желание послушать историю. \nА девочка, что крикнула об этом. Жалась в стул. Молясь, чтобы он не ошибся. А когда тот пошёл в ее сторону. Едва смогла удержаться от крика. Ещё крепче держяс за стул. А ведущий всё подходил. Пристально смотря на девочку. И наконец-то он подошёл и протянул одну руку отводя , а вторую убрал за спину . Ведущий ждал, когда та примет предложение, о выступление. Девочка огляделась, как будто бы по считая, что он ошибиться. А после встав со стула медленно словно перо. Положила на руку ведущего. И быстро обернувшись назад. Чтобы, как видимо получить согласия родителей. \nУвидела слегка улыбающегося отца, что был явно горд за то, что именно его дочь идёт на эту сцену. И мать что пыталась держать вид строгой матери. Но глаза явно выдавали крик души. Поэтому девочка спокойно пошла за ведущим и встав рядом с клоном. Начала его разглядывать и начал подмечать, что сходство с ведущим всё меньше. Чем казалось ей. \nВедущий же встав рядом с девочкой задал вопрос\n- Юная леди. Не соизволите сказать своё имя?- \n-а да- заволновалась девочка. И перестав разглядывать клона. Сказала деловита. \n- меня зовут София- ведущий улыбнулся и сказал \n- приятно познакомиться София- и ведущий слегка нагнувшись вперёд. В знак приветствия. И здесь девочку резко ударила смелость. Словно это было не она.И она задала вопрос, о которым бы никогда не спросила бы. Ведь это было негласным табу этой сцены \n- а вас как зовут? - произнесла Софья и резко  схватившись за рот. Словно поняла, что сказала то, что нельзя говорить. Но ведущий словно не услышав это продолжил. \n-пора уже приглашать помощников и начинать рассказ, а то зрителям уже не терпится- сказал ведущий, а София выдохнула про себя. Ведущий же отошёл от девочке и клона на значительная расстояния. Развёл руками и резко прокричал \n- выходите!!- вдруг земля задрожала. И сзади ведущего начал ломаться доски пола. Не выдержав натиск доски всё таки ломаються. Образуя пыль, который не мешает видеть. А смотреть там было на что. Это было гора из чудиков. Как можно было назвать их. Эти люди в фарфоровых масках, который выражають разные эмоций. А одежда на них ярко светлый. Словно у шута.\n[387593] 2025-11-21 18:19 Слава: Не успели зритель всех разглядеть, как это гора помощников разлетелась, как будто бы от взрыва. И каждый приземлившись то на руке, то на одну ногу, то на голову, то ещё как. У зритель это вызвало огромный шок. А София резко засмеялся от удивления. В это же время ведущий подошёл к дыре и зацокал. \n-ТЦ Тц, а ну-ка чините- сказал ведущий. И чудики быстра начали чинить пол. А ведущий одного из чудиков повёл за собой. Этот чудик был похож на ведущего по телосложению. \nПриведя чудика до клона и Софьи. Он отпустил его. София же пыталась разглядеть глаза чудика, который стоял рядом с ней. Ей было интересно, кто за маской. Ведущий же подошел к клону. Схватил его за макушку.  Сильно и резко дёрнул вперёд. И клон начал падать. Но прежде чем упасть превратился в дым, который сконцентрировался в руке ведущего. И когда дым развелся. Зритель увидели в руке ведущего маску, которая очень походила на лицо ведущего. Ведущий не долго думая передал маску чудику. София же внимательно пыталась разглядеть эту маску с стороны, который её надев
