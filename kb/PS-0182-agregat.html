const CH=[{"t": "Дословный исходник базы", "a": [], "r": [], "h": "<div class=\"rawnote\">Это не статья справочника, а дословная выписка из переписки. Текст не редактировался: сохранены опечатки, пунктуация и повторы.</div><div class=\"raw\"># Агрегат\n\n*персонаж* · вселенные: Апостол, Оам\n\n## Навигация\n\n- (w0072) Владелец способности изменения агрегатного состояния; в каталоге идёт с приписками (волк 🐺; экстремал ⏳; позже добавлен страдалец 🔪).\n- (w0073) Второй номер команды против Серафима, ранее уже числившийся в реестре благословенных. Здесь впервые расписаны показатели, способность и оружие.\n- (w0081) Назван в перечислении персонажей автора как уравновешенный, в отличие от остальных «жалких»; пока второстепенный, не центральный (302839-302842).\n- (w0112) Апостол, упомянут только в списке тех, чья судьба и путь уже придуманы автором (вместе с Графом и Защитником).\n\n## Связано с\n\nАнтон, Апостолы, Братья и сёстры (благословенные одним правителем), Воительница, Граф, Защитник, Имитатор, Палач, Серафим\n\n## История по версиям\n\n_Ниже — дословные куски переписки. Старое не затирается, повторы сохранены._\n\n### Версия 1 — 2025-01-22\n\nвселенная: Апостол (по дате объявления) · окно w0072 · сообщения 283706–283710\n\n*что здесь: назван через способность — изменение агрегатного состояния*\n\n\n\n```chat\n[283706] 2025-01-22 08:36 Слава: Принципиальному, прямолинейному и жестокому \nОн воплощения гнева \nПрототип защитника только молчиливова \nБэтмен с жестокостью и гневом \nТот кто да мозга костей ненавидит междумирцов \nТот кто оторвёт крылья ангелам, переломает кости своим братьям и сёстрам \nБратья и сестры это то бишь благословенный одним правителем\n[283707] 2025-01-22 08:40 Слава: Среди его братьев и сестёр есть владельцы способности изменения агрегатного сотояния, \nТа кто может изменять плотность массу и размер объектов и себя \nТот у кого есть способность сжатия\nИмитация \nБессмертный выродок\nТеневые братья\n[283708] 2025-01-22 08:49 Слава: Над имать ауру и делать слэш \nЕго орудия катана\n[285369] 2025-01-28 19:35 Миколай: https://telegra.ph/boi-01-28\n```\n\n### Версия 5 — 2025-03-14\n\nвселенная: Апостол (по дате объявления) · окно w0081 · сообщения 302836–302848\n\n*что здесь: Характеристика: уравновешенный, второстепенный «пока что»; собеседник отмечает, что пока не центральный.*\n\n\n\n```chat\n[302836] 2025-03-14 23:12 Слава: В смысле. Это я просто решил рифмитический описать. А так персонажи не жалкий. Ну если смотреть со стороны психи, то конечно жалкий, два мститель, нече не помниший апостол, и один с ушедший с ума чужемирец\n[302837] 2025-03-14 23:13 Миколай: во первых поэтически\n[302838] 2025-03-14 23:13 Миколай: во вторых я в этом плане\n[302839] 2025-03-14 23:13 Слава: Ну Агрегат уравновешенный хоть второстепенный перс\n[302840] 2025-03-14 23:13 Слава: Пока что\n[302841] 2025-03-14 23:13 Миколай: в третьих сейчас действительно только о жалких людях истории ничего другого\n[302842] 2025-03-14 23:13 Миколай: пока не центральный\n[302844] 2025-03-14 23:14 Слава: Ладно у меня как раз были две илей. И я не мог определиться какая лучше будет. Но ты поставил точку\n[302845] 2025-03-14 23:15 Слава: Харе жалких\n[302846] 2025-03-14 23:15 Миколай: не то что мне не нравится если что, просто наблюдение)\n[302847] 2025-03-14 23:15 Слава: Ну конечно не харе, но пока отступим в сторонку\n[302848] 2025-03-14 23:16 Слава: Ну я понимаю, что нужно тоже расбовлять\n```\n\n### Версия 6 — 2025-12-06\n\nвселенная: Оам (объявлено) · окно w0112 · сообщения 393477–393480\n\n*что здесь: Единственное упоминание: судьба предрешена, путь придуман*\n\n\n\n```chat\n[393477] 2025-12-06 21:53 Слава: Для плана\n[393478] 2025-12-06 21:54 Слава: Вообще у Агрегат, Графа и Защитника \nСудьба предрешена. Ну я то есть придумал их ней путь\n[393479] 2025-12-06 21:55 Слава: Это босс будет хитрым и уверенным. Хотя обычные человек. \nПопытается наладить связь с Имитам\n[393480] 2025-12-06 21:56 Слава: Так как для правительства. Предста
