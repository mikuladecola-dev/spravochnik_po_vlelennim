куда раньше лежал я думал, а ведь можно попробовать, нет нельзя это ведь человек, нет это не человек это Пераг, тем более он мёртвый чево ему, он ведь первый сожрать меня хотел на верное. И я в цепился зубами в плоть бывшего человека. И я жувал и ел, его плоть не гнила и была вкусна. Я ел его и это дало время мне, ведь в конце концов, руками откопав себе выход, я смог пройти сквозь этот бетон. Я вылез под цвет Луны, но тот кто вылез изнутри бетонное тюрьмы, был ли он тем кто там застрял. Если судить внешней, то точно нет ведь тот, кто вылез был чудовищем, его лицо была лишь плоть без кожы и век и волос, можно была даже череп увидеть у него, и весь он сам быль в крови и много, где свисали с него ошмётки плоти, а руки были лишь кости не более. А внутри, я не знаю. И это чудище пошло куда-то, как сотни чудовище и шло оно слыша крики чудище, нннееееттт это были не крики а голоса - ты убийца - ты людоед - и как понравилась есть людей?- ты один,здавайся - зачем твоя борьба? - ты один. И шел он не зная куда деться. Схватил Перага он живого связал и говорил он с ним и слышал он ответ. И жил он так с Перагом в том доме одиноком. Иногда поедая его плоть. \nНет, нет, кто я блять такой и что творю. Увидел я себя в отражении воды, когда луна решила посветить. И испугался я, что же я творю, они ведь не говорил со мной это всё в мой голове. Я псих, я сошёл с ума. Я должен это всё закончить, схвативь автомат, приставь его к челюсть, нажал я на курок и послышался хлопок в лесу.... \nНо нет я не умер в том лесу. Я жив, очнулся в том же доме. И я опять ушел, убежал от всех проблем от дома с чудищим от воды, которая показывала истину мою. И снова шел, без ничего, я шёл и резал вены, я шел и падал с высоты, я шел и вешался, я шел и пытался жечь себя, и после каждой той попытке я не умирал, но становился куда страшнее Перагов. Какого чёрта бог, почему ты не желаешь взять меня, хотя в ад, где люди, грешники и говорящий демоны, или можешь просто, стереть меня, оставив этот мир. Но нет ты н
