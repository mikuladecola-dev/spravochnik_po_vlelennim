<script>const BASE="";const DOCNAME="Пришельцы";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0043-S01", "GR-0043--chto-eto"], "h": "<p>Пришельцы — раса-фракция вселенной «монстры»: инопланетяне, захватившие Землю и удерживающие её как площадку для собственных опытов. Объявлены Славой 2024-08-07 (id 215636) одной фразой, задающей весь сеттинг: «Мир захватили пришельцы и распылили вирус который убил некоторых людей а некоторым дал способности». Там же сразу назван их мотив: «Но пришельцы даже так были недовольны им нужен был ещё более подходящая ДНК».</p>\n<p>Позже в тот же день Слава уточняет их отношение к планете (2024-08-07, id 215642): «Земля для пришельцов это грубо говоря песочница где они проводят опыты и просто наблюдают. Вирус дал некоторым людям сверхсилы».</p>\n<p>Это именно коллектив, а не персонаж: они действуют во множественном числе — захватывают, распыляют вирус, ставят опыты, наблюдают, ищут и хватают носителя нужной ДНК. Но ни один пришелец в переписке поимённо не назван, внешности у них нет, и того, как они выглядят и как устроены, авторы не обсуждали.</p>\n<p>Материал по ним лежит в записях <a href=\"MR-0047.html\">Мир, захваченный пришельцами</a> (мир, захваченный пришельцами), <a href=\"PS-0130.html\">ГГ с особой ДНК (донор)</a> (ГГ с особой ДНК, донор), <a href=\"SP-0095.html\">Особая ДНК / золотая кровь</a> (особая ДНК / золотая кровь) и <a href=\"SP-0096.html\">Термоядерный синтез клеток донора</a> (термоядерный синтез клеток донора). Всё придумано в одном окне w0050, за два дня, 2024-08-07 и 2024-08-08.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Первым — вирус. <code>MR-0048</code> «Вирус пришельцев»: 5 838 знаков базы, статьи нет, входящих ссылок ноль, вселенная проставлена «неясно». Формально он ничего не блокирует — и именно поэтому его не видно. Это те же сообщения 215636–215644, что и весь остальной куст, но остальной куст числится по «монстрам» и статьями закрыт (<code>MR-0047</code> — три ссылки, <code>SP-0095</code> — три, <code>SP-0096</code> — три, <code>PS-0130</code> — две), а вирус выпал из реестра по вселенной, а не по материалу. При этом на нём держится всё: и гибель части людей, и появление всех сверхспособных в этом мире. Пока он вне реестра, «механика вируса не объяснена» выглядит пробелом замысла, хотя это пробел разбора.</p></div>", "r": [["ГГ с особой ДНК (донор)", "PS-0130.html"], ["Особая ДНК / золотая кровь", "SP-0095.html"], ["Термоядерный синтез клеток донора", "SP-0096.html"], ["Мир, захваченный пришельцами", "MR-0047.html"]]}, {"t": "Состав", "a": ["S02", "GR-0043-S02", "GR-0043--sostav"], "h": "<p>Поимённого состава нет. В переписке не названо ни одного пришельца — ни имени, ни клички, ни отдельной фигуры с описанием. Список members в плане статьи пуст.</p>\n<p>Единственные упомянутые внутри расы фигуры — те, ради кого затеяна вся охота: заболевший «вождь или тянка» (2024-08-08, id 215787). Кто из двоих — не решено, вариант так и оставлен развилкой в самой формулировке Миколая: «крч, у инопречеленсов вождь или тянка заболели». Ни имени, ни пола, ни роли этой фигуры дальше не обсуждали.</p>\n<p>Численность расы, устройство их общества, размер экспедиции на Земле — в переписке не сказано.</p>", "r": []}, {"t": "Общие способности группы", "a": ["S03", "GR-0043-S03", "GR-0043--obschie-sposobnosti-gruppy"], "h": "<p>Всё, что известно про их возможности, — это то, что они уже сделали или делают в сеттинге. Отдельного разбора способностей пришельцев авторы не вели.</p>\n<ul>\n<li>Захват планеты. Земля взята под контроль целиком — «Мир захватили пришельцы» (2024-08-07, id 215636). Как именно проходил захват, чем воевали и было ли сопротивление — в переписке не сказано.</li>\n<li>Распыление вируса. Вирус распылён по планете, и у него двойное действие: «убил некоторых людей а некоторым дал способности» (2024-08-07, id 215636). Слава повторяет это отдельно: «Вирус дал некоторым людям сверхсилы» (2024-08-07, id 215642). То есть все люди со сверхсилами в этом мире — побочный продукт работы пришельцев. Чем определяется, кто умрёт, а кто получит способности, не обсуждалось.</li>\n<li>Опыты и наблюдение. Земля для них — «грубо говоря песочница где они проводят опыты и просто наблюдают» (2024-08-07, id 215642). Наблюдение названо отдельным от опытов занятием.</li>\n<li>Отбор и поиск нужной ДНК. Даже после вируса результат их не устроил: им нужна «ещё более подходящая ДНК» (2024-08-07, id 215636). Вокруг этого крутится вся их деятельность.</li>\n<li>Охота и захват. Носителя особой ДНК они находят и берут физически: «его хватают потом он сбегает» (2024-08-07, id 215644). Значит, у них есть места содержания, из которых можно сбежать, и есть силы, которые ловят. Устройство этих мест и то, кто именно ловит, — в переписке не сказано.</li>\n<li>Хранение секретов и информации. Из сюжетной канвы Славы (2024-08-07, id 215644): герой «добывает информацию, раскрывает секреты». То есть у пришельцев есть и информация, которую можно добыть, и секреты, которые можно раскрыть. Какие именно — осталось нерешённым.</li>\n<li>Ошибка в разведданных. Их знание о нужном веществе на Земле устарело: «знают что есть на земле», «но на самом деле этой информации 563 миллиона лет» (2024-08-08, id 215790–215791). Цифра названа именно так — 563 миллиона лет.</li>\n</ul>", "r": []}, {"t": "Иерархия", "a": ["S04", "GR-0043-S04", "GR-0043--ierarhiya"], "h": "<p>Прямо названа только одна ступень: у расы есть вождь (2024-08-08, id 215787). Формулировка Миколая допускает и другого адресата — «вождь или тянка», то есть либо глава, либо чья-то девушка; выбор между этими двумя вариантами в переписке не сделан.</p>\n<p>Никакой другой структуры — командиров экспедиции, учёных, охотников, отдельных каст — не описано. Кто принимает решение о захвате донора, кто ведёт опыты, кто наблюдает — не сказано.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S05", "GR-0043-S05", "GR-0043--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>С людьми Земли.</strong> Отношение потребительское и исследовательское: планета — «песочница», люди — материал для опытов и объект наблюдения (2024-08-07, id 215642). Вирус пришельцев поделил человечество на погибших и на получивших способности (2024-08-07, id 215636). Людей со сверхсилами как отдельную сторону, группу или сопротивление в этом окне не разбирали — в переписке не сказано, объединены ли они и противостоят ли пришельцам.</p>\n<p><strong>С ГГ, донором (<a href=\"PS-0130.html\">ГГ с особой ДНК (донор)</a>).</strong> Центральный конфликт. Герой — единственный носитель нужного гена: «и вот 1 человек остался нужном геном производящим нужную кровь, единственную в своём роде» (2024-08-08, id 215792), «вот он будет донором» (2024-08-08, id 215793). Пришельцы его хватают, он сбегает, дальше — «ныкается в разных местах попутно сражаясь, добывает информацию, раскрывает секреты, устраивать бунты» (2024-08-07, id 215644). Бунты, которые он устраивает, обращены против них, но кого он поднимает на бунт — состав не назван.</p>\n<p><strong>Со своей заболевшей фигурой.</strong> Единственный названный мотив расы — спасение своего: «нужно спасать» (2024-08-08, id 215788). Вещества, которое для этого нужно, у них нет и синтезировать его они не могут: «на их планете нет вещества и вывести не могут» (2024-08-08, id 215789).</p>", "r": [["ГГ с особой ДНК (донор)", "PS-0130.html"]]}, {"t": "Как менялась — по датам", "a": ["S06", "GR-0043-S06", "GR-0043--kak-menyalas"], "h": "<p><strong>2024-08-07, id 215636–215644 (первое изложение, версия 1 записей <a href=\"MR-0047.html\">Мир, захваченный пришельцами</a> и <a href=\"SP-0095.html\">Особая ДНК / золотая кровь</a>).</strong>\nСлава объявляет сеттинг целиком: захват, вирус, гибель одних и сверхсилы у других, недовольство пришельцев результатом и потребность в «ещё более подходящей ДНК» (id 215636). Тут же он сам ставит вопрос, на котором держится вся дальнейшая разработка: «Вопрос нахуй им более подходящая днк» (id 215637). Позже уточняет статус планеты — песочница для опытов и наблюдения (id 215642), повторяет вопрос «что за особую ДНК ищет пришельцы в людях» (id 215643) и задаёт сюжетную канву со стороны героя (id 215644).</p>\n<p><strong>2024-08-07, id 215638–215641 (ответ Миколая, отклонено или оставлено без ответа).</strong>\nМиколай приносит два развёрнутых списка возможных целей изменения ДНК. Первый (id 215638): создание «сверхлюдей» с уникальными способностями; биологические интерфейсы для связи с технологиями пришельцев; коллективное сознание или телепатическая сеть; адаптация людей к экстремальным условиям (космос, другие планеты); биологические компьютеры на основе человеческого мозга; практическое бессмертие через регенерацию клеток; метаморфозы и изменение формы тела; симбиоз людей с инопланетными организмами. Второй, разложенный по осям «глубже — выше — локальнее — отстранённее» (id 215639): «квантовое сознание», воспринимающее многомерную реальность; манипуляция фундаментальными силами вселенной; эволюция человечества в нематериальные энергетические сущности; коллективный сверхразум, влияющий на эволюцию галактик; контроль каждой клетки тела по отдельности; внутренний «биологический интернет» в теле; люди как «биологические антенны» для связи с параллельными вселенными; человечество как живой инструмент для изучения тёмной материи и энергии.\nНи один из пунктов обоих списков в дальнейшей разработке не использован. Миколай сам предполагает отказ и предлагает запасной ход: «если из этого ничего, тогда ты согласен на то чтобы я попробовал на свой лад переиначить представление о космических туристах?» (id 215640) и просит «ток ты не скипай эти идеи, а вдумайся хорошенько» (id 215641). Ответа Славы ни на списки, ни на предложение про космических туристов в переписке нет — вариант с переиначенными космическими туристами остался нерешённым.</p>\n<p><strong>2024-08-07, id 215654–215666 (версия 2 записи <a href=\"SP-0095.html\">Особая ДНК / золотая кровь</a>: ДНК вымерших видов).</strong>\nМиколай предлагает свою трактовку искомого: «ну днк это темка влияющая на развитие какой либо характеристики» (id 215654), «возможно это нечто особенное, чего нет в ныне живущих организмах» (id 215655). После переспроса Славы уточняет: «ну типа есть виды которые вымерли и их днк утратилось, а в нем оно есть» (id 215661), «и оно ценное для использования» (id 215662), «и исследования» (id 215663). Слава одобряет с оговоркой: «Ну пока, что да» (id 215665). Миколай обещает «провести исследование и найти как конкретизировать» (id 215666).</p>\n<p><strong>2024-08-07, id 215667–215674 (версия 3 записи <a href=\"SP-0095.html\">Особая ДНК / золотая кровь</a>: золотая кровь).</strong>\nСлава вводит новую опору — «Ты знаешь что такое золотая кровь ?» (id 215667). Миколай отвечает, что не знает (id 215668), и Слава перекладывает разбор на него: «Узнай», «Я объяснять не умею», «И не смогу» (id 215669–215671), затем — «чекний видео и сам все поймёшь» (id 215674). Само содержание понятия в переписке не разбирается: тема подкинута, но не раскрыта.</p>\n<p><strong>2024-08-08, id 215777–215796 (версия 2 записи <a href=\"MR-0047.html\">Мир, захваченный пришельцами</a>, версия 4 записи <a href=\"SP-0095.html\">Особая ДНК / золотая кровь</a>, версия 1 записи <a href=\"SP-0096.html\">Термоядерный синтез клеток донора</a>).</strong>\nЛинии сводятся. Миколай формулирует, что «основная охота идёт на последнего человека с таким результатом фактором» (id 215778) — то есть предмет поиска перестаёт быть абстрактной «более подходящей ДНК» и становится конкретным резус-фактором у конкретного последнего носителя. Затем появляется мотив расы целиком: заболел «вождь или тянка» (id 215787), «нужно спасать» (id 215788), «на их планете нет вещества и вывести не могут» (id 215789), «знают что есть на земле» (id 215790), «но на самом деле этой информации 563 миллиона лет» (id 215791). Отсюда — фигура донора: остался один человек с нужным геном, кровь единственная в своём роде (id 215792–215793), с биологией, описанной отдельно в <a href=\"SP-0096.html\">Термоядерный синтез клеток донора</a> (термоядерный синтез клеток, id 215794–215796).</p>\n<p>Итог смены версий по цели пришельцев: «более подходящая ДНК» без объяснения (2024-08-07) → ДНК вымерших видов, утраченная у живущих (2024-08-07) → золотая кровь как тема, подброшенная Славой (2024-08-07) → уникальный ген последнего носителя, нужный для спасения заболевшего вождя или тянки (2024-08-08). Более ранние состояния не отменены прямо: одобрение версии про вымершие виды звучало как «Ну пока, что да», и отказа от неё в переписке нет.</p>", "r": [["Особая ДНК / золотая кровь", "SP-0095.html"], ["Термоядерный синтез клеток донора", "SP-0096.html"], ["Мир, захваченный пришельцами", "MR-0047.html"]]}, {"t": "Пробелы", "a": ["S07", "GR-0043-S07", "GR-0043--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет: ни один пришелец не назван, у расы нет ни имён, ни отдельных персонажей.</li>\n<li>Как пришельцы выглядят, какого они вида, как устроена их биология — не обсуждалось.</li>\n<li>Название их расы и планеты не дано. Слово «инопречеленсы» (2024-08-08, id 215787) — разговорная форма, а не название.</li>\n<li>Заболевший — «вождь или тянка»; кто именно, осталось нерешённым, как и чем он или она болеет.</li>\n<li>Иерархия, кроме упоминания вождя, не описана: кто ставит опыты, кто ловит, кто наблюдает — не сказано.</li>\n<li>Численность пришельцев на Земле и их технологии не описаны. Технологии упоминаются только в отклонённом списке идей (id 215638), в сеттинг не введены.</li>\n<li>Не сказано, как именно происходил захват Земли и было ли сопротивление.</li>\n<li>Что за секреты пришельцев раскрывает герой и какую информацию добывает (id 215644) — не раскрыто.</li>\n<li>Кого герой поднимает на бунты — состав не назван.</li>\n<li>Механика вируса не объяснена: почему одних он убил, а другим дал способности.</li>\n<li>Понятие «золотая кровь» так и не разобрано в переписке — Слава отказался объяснять, разбор был отложен на Миколая и в чат не вернулся.</li>\n<li>Предложение Миколая «переиначить представление о космических туристах» (id 215640) осталось без ответа.</li>\n<li>Как несовпадение возраста информации (563 миллиона лет) отражается на планах пришельцев — не обсуждалось.</li>\n<li>В записи <a href=\"MR-0047.html\">Мир, захваченный пришельцами</a> отдельно отмечено, что вселенная в чате никак не названа; отнесение к «монстрам» сделано по дате объявления.</li>\n</ul></div>", "r": [["Мир, захваченный пришельцами", "MR-0047.html"]]}, {"t": "Связи — всё вместе", "a": ["GR-0043--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0130.html\">ГГ с особой ДНК (донор)</a></li>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0095.html\">Особая ДНК / золотая кровь</a>, <a href=\"SP-0096.html\">Термоядерный синтез клеток донора</a></li>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0047.html\">Мир, захваченный пришельцами</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0082.html\">Пришельцы (линия Фени)</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0043--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0043.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0043-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0043/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — вирус. <code>MR-0048</code> «Вирус пришельцев»: 5 838 знаков базы, статьи нет, входящих ссылок ноль, вселенная проставлена «неясно». Формально он ничего не блокирует — и именно поэтому его не видно. Это те же сообщения 215636–215644, что и весь остальной куст, но остальной куст числится по «монстрам» и статьями закрыт (<code>MR-0047</code> — три ссылки, <code>SP-0095</code> — три, <code>SP-0096</code> — три, <code>PS-0130</code> — две), а вирус выпал из реестра по вселенной, а не по материалу. При этом на нём держится всё: и гибель части людей, и появление всех сверхспособных в этом мире. Пока он вне реестра, «механика вируса не объяснена» выглядит пробелом замысла, хотя это пробел разбора.</p>\n<p>Второе — люди со сверхсилами. Их создали пришельцы, герой поднимает среди них бунты, и отдельной записи под них в окне w0050 нет вообще: ни статьи, ни исходника. Это единственная сторона конфликта без носителя.</p>\n<p>Ниже по цене — заболевший «вождь или тянка». Мотив всей расы держится на фигуре, у которой нет ни записи, ни выбора между двумя вариантами прочтения.</p>\n<h3>С чего начать</h3>\n<p>В базе — за вирусом: <code>MR-0048</code>, одна версия, окно w0050, 2024-08-07. Материал уже вырезан, нужна привязка ко вселенной и связь с <code>MR-0047</code>.</p>\n<p>В архив — под три места, все узкие.</p>\n<p>Первое: 2024-08-07, id 215638–215641. Два больших списка Миколая и прямой вопрос «ты согласен на то чтобы я попробовал на свой лад переиначить представление о космических туристах?» — ответа Славы в записи нет. Смотреть сообщения сразу после 215641, до 215654.</p>\n<p>Второе: 2024-08-07, id 215667–215674. Слава вводит «золотую кровь», отказывается объяснять и кидает видео. Содержание понятия ушло из чата в ролик; проверять надо, вернулись ли к нему 2024-08-08 или позже — в записи разбора нет.</p>\n<p>Третье: чем кончилось окно. Статья обрывается на 215796, а w0050 на этом вряд ли заканчивается; хвост окна не просмотрен.</p>\n<h3>Как развивалось</h3>\n<p>2024-08-07, утро: заявили сеттинг одной фразой — захват, вирус, мёртвые и сверхспособные, «нужна ещё более подходящая ДНК». Через минуту сам автор ставит вопрос, на который никто не ответит: «Вопрос нахуй им более подходящая днк». Днём приходят два развёрнутых списка целей — ни один пункт не использован, ответа нет. К вечеру ограничили: искомое — ДНК вымерших видов, одобрено с оговоркой «Ну пока, что да». Тем же вечером опору подменили: вместо ДНК вымерших — «золотая кровь», и разбор переложен на другого. 2024-08-08 всё сведено к одному носителю и заболевшему вождю. После 2024-08-08 к теме не возвращались. Ни одна из промежуточных версий прямо не отменена — они просто перестали упоминаться.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Граница возможностей расы названа один раз и очень точно: «на их планете нет вещества и вывести не могут» — на этом держится вся охота за донором. Для вируса границы того же рода нет. Раса, которая распылила по чужой планете вирус, переписывающий ДНК людям целыми популяциями, не может синтезировать одно вещество. Может быть, так и задумано, но правило, по которому одно им доступно, а другое нет, не проговорено — при том что для вещества оно проговорено прямым текстом.</p>\n<h3>Отклик</h3>\n<p>Зацепила одна цифра: 563 миллиона лет. Захватчики прилетели по устаревшим данным — знают, что вещество есть на Земле, и не знают, что знание протухло на полмиллиарда лет. Это меняет весь тон: не всесильные экспериментаторы, а экспедиция, работающая по сгнившей разведке, и вся их «песочница» — попытка догнать то, чего давно нет. Из всего окна это единственное место, где у пришельцев появляется положение, а не функция, — и оно же самое брошенное: как несовпадение отражается на их планах, никто не обсуждал. Рядом стоит «вождь или тянка», развилка, которую так и оставили в тексте как есть, — и она честно показывает, на какой стадии всё замерло: мотив расы придуман раньше, чем решено, кто именно её мотивирует.</p></div>", "r": []}];</script>
