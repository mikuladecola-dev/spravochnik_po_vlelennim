<script>const BASE="";const DOCNAME="Тардибовин";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0054-S01", "PS-0054--proishozhdenie"], "h": "<p>Тардибовин — раса пришельцев вселенной «игра бога», разработанная 6–7 апреля 2024 года (окно w0030, сообщения 154392–154679). Название составлено из двух латинских корней: «от лат. Tardigrade - тихоходка, bovine - бычий» (2024-04-06, id 154394).</p>\n<p>Порядок работы над карточкой Миколай описал прямо: «Я придумал кого скрестить, нейронка дала четкое описание по заданию))» (2024-04-06, id 154396). То есть замысел скрещивания — быка с тихоходкой — авторский, а первичный текст описания сгенерирован нейросетью по этому заданию и дальше правился вдвоём.</p>\n<p>В переписке персонаж встречается также под разговорными обозначениями «бык», «бык или козел» (2024-04-07, id 154664) и во множественном числе — «тардибовины».</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0054-S02", "PS-0054--vneshnost"], "h": "<p>Первая версия описания (2024-04-06, id 154394):</p>\n<p>Ростом около 1.5 метров, «с крепким телосложением, напоминающим миниатюрную версию вола или быка». Кожа толстая и морщинистая, серо-коричневого цвета. На голове два небольших рога, загнутых назад. Лицо имеет «обобщенные антропоморфные черты» — два глаза, нос и рот.</p>\n<p>Конечности массивные и мускулистые. Передвижение на двух ногах, две руки с 4 пальцами, включая противопоставленный большой палец. «Несмотря на массивность, движения тардибовинов неторопливы и размеренны».</p>\n<p>Внешность была единственным пунктом (наряду с телепатией), который соавтор не принял: «Все понравилась кроме внешкий и телепатией» (2024-04-06, id 154397). После этого Миколай уточнил своё представление — «я его как то так представляю, ток чуть меньше» (id 154399) — и приложил изображение, сгенерированное нейросетью по описанию (id 154400). Итоговый вид в переписке словами не переформулирован: правка внешности осталась на уровне картинок.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0054-S03", "PS-0054--harakter"], "h": "<p>Отдельного описания характера в переписке нет. Единственная поведенческая черта, названная в карточке, — неторопливость и размеренность движений.</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0054-S04", "PS-0054--sposobnosti"], "h": "<p>Список первой версии (2024-04-06, id 154394):</p>\n<ul>\n<li>«Невероятная выносливость, способны выдерживать экстремальные температуры, радиацию, обезвоживание».</li>\n<li>«Впадают в анабиоз при крайне неблагоприятных условиях, понижая метаболизм почти до нуля».</li>\n<li>«Огромная физическая сила, во много раз превосходящая человеческую».</li>\n<li>«Способны телепатически общаться между собой и с другими существами» — вычеркнуто во второй версии.</li>\n<li>«Могут менять плотность тела, становясь почти неосязаемыми или тверже стали».</li>\n<li>«Регенерируют физические повреждения на клеточном уровне».</li>\n</ul>\n<p>В третьей версии (2024-04-07) главным в персонаже названа не сила, а выносливость: «Вообще прикол быка не в силе, а выносливости, он может выдержать экстремальные условия, большой холод или наоборот мощное пламя, или даже атомный взрыв» (id 154668). Происхождение этих способностей объяснено скрещиванием: «Такие способности ему достались от скрещивания с тихоходкой» (id 154673).</p>\n<p>Боевая роль сформулирована так: «Он как танк будет скорее», «Маленький но танк» (id 154676–154677).</p>\n<p>По поводу дополнительных характеристик Слава предложил: «Аааа ну туда можно ещё и силу кинуть с ловкостью» (id 154674). Ловкость отклонена — «Ну думаю он не про ловкость» (id 154675), сила принята — «А вот силу да, силу можно» (id 154678).</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0054-S05", "PS-0054--svyazi-s-drugimi"], "h": "<p>В карточке отмечена связь с многоликим и с тихоходкой (второй компонент скрещивания).</p>\n<p>7 апреля 2024 года Тардибовин упомянут в перечислении одобренной тройки: «Три это быстрый с узорами молний, бык или козел; а третий кто» (id 154664). Третьим Миколай считал «лягуху с крыльями»: «Ну я подумал что лягуху с крыльями ты тож одобрил» (id 154665). Статус этой группы уточнён Славой: «ну там чисто как отдельный виды расы а не часть челика» (id 154667) — то есть тардибовины существуют как самостоятельная раса, а не как часть человеческого персонажа.</p>\n<p>В том же обмене проходит реплика «Это кто» — «Пузырь» — «Он» (id 154669–154671), связь которой с Тардибовином в переписке не разъяснена.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0054-S06", "PS-0054--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2024-04-06 (id 154392–154396).</strong> Полная карточка: рост 1.5 м, толстая морщинистая серо-коричневая кожа, два загнутых назад рога, двуногость, 4 пальца с противопоставленным большим; шесть способностей — выносливость к температурам/радиации/обезвоживанию, анабиоз, огромная сила, телепатия, смена плотности тела, регенерация на клеточном уровне.</p>\n<p><strong>Версия 2 — 2024-04-06 (id 154397–154400).</strong> Соавтор принимает всё, кроме внешности и телепатии. Телепатия убирается: «Оке, телепатию заборт» (id 154398). Внешность отправлена на переделку, обсуждение продолжается через изображения.</p>\n<p><strong>Версия 3 — 2024-04-07 (id 154664–154679).</strong> Смещён акцент внутри способностей: главное — не сила, а выносливость, вплоть до способности выдержать атомный взрыв; источник — скрещивание с тихоходкой. Персонаж определён как «маленький но танк». Ловкость отклонена, сила подтверждена как допустимое дополнение. Тардибовин попадает в тройку одобренных.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0054-S07", "PS-0054--chto-s-nim-stalo"], "h": "<p>К 7 апреля 2024 года входит в число одобренных существ — как отдельный вид расы. Дальнейшая судьба персонажа в прочитанном материале не прослеживается.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0054-S08", "PS-0054--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Итоговая внешность после отклонения первого варианта словесно не зафиксирована — правка шла картинками, нового текстового описания в переписке нет.</li>\n<li>Характер, речь, общественное устройство расы не описаны.</li>\n<li>Не сказано прямо, он ли тот «наш качок»/«силач», о котором говорят на 154434 и 154497.</li>\n<li>Реплика про «Пузыря» (id 154669–154671) осталась неразъяснённой.</li>\n<li>Не сказано, была ли добавлена сила отдельным пунктом сверх уже имевшейся в карточке «огромной физической силы», или речь шла о ней же.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0054--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0014.html\">игра бога</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0054--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-04-06</td>\n<td>154392–154396</td>\n<td>w0030</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-04-06</td>\n<td>154397–154400</td>\n<td>w0030</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-04-07</td>\n<td>154664–154679</td>\n<td>w0030</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0054-tardibovin.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0054--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0054.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
