<script>const BASE="";const DOCNAME="Одержимые";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0234-S01", "SP-0234--mehanika"], "h": "<p>Одержимые — это люди, в которых вселился демон. Формулировка автора: «Одержимые это люди одержимые демоном» (2025-09-12, id 364766).</p>\n<p>По устройству сил одержимый приравнен к арбетару: «Одержимый это аналог Арбетара ( я даже в иногда буду называть их так) то есть у него такие же силы». Автор отдельно оговаривает, что и сам будет иногда называть одержимых арбетарами.</p>\n<p>Главное отличие от благословенных — отсутствие ступени обучения: «Но ему не надо обучаться. Он сразу сильный». Сила приходит вместе с одержимостью, сразу и в полном объёме.</p>\n<p>По уровню силы одержимый чаще всего превосходит благословенного: «И в чаще всего сильнее благословенных ( поэтому на убийства одержимого они ходят группой разного количества)». Отсюда прямое тактическое следствие, названное в переписке: на одержимого ходят группой, а не поодиночке, и численность группы каждый раз разная.</p>\n<p>Для одержимого предусмотрено два исхода: «И этого одержимого либо убивают либо изгоняют демона» (id 364766). Второй путь — экзорцизм, <a href=\"SP-0235.html\">Экзорцизм (изгнание демона)</a>; он назван муторным и опасным, поэтому применяется редко, «Легче просто убить». (В исходном сообщении фраза записана как «Изменения демона производится редко ведь это муторно и опасно», в разборе базы это место читается как изгнание демона.)</p>", "r": [["Экзорцизм (изгнание демона)", "SP-0235.html"]]}, {"t": "Ограничения и цена", "a": ["S02", "SP-0234-S02", "SP-0234--ogranicheniya-i-cena"], "h": "<p>Ограничений самой силы одержимого в переписке не названо — сила описана только со стороны её объёма и того, что обучение не требуется.</p>\n<p>Цена лежит в социальной и правовой плоскости. Убийство одержимого законно: «Но их не я убийства все равно разрешено законным» (фраза в источнике записана с обрывом, id 364766). Против одержимых работает множество организаций: «И вот есть множество организации занимающие убийством одержимых и получающие деньги от правительство и благотворительности» (id 364768). Финансирование этих организаций идёт от правительства и от благотворительности. Там же оговорено, что часть организаций берёт и другие заказы: «Хотя некоторые организации нанимают чтобы убить человека либо другого благословенного».</p>\n<p>При этом у одержимых есть собственная сторона: «И у одержимых есть собственный организаций, а также после раскрытия существования чёрной изнанки. Большое количество людей начало их защищать» и «Просто у них есть такие же больший организации как и у благословенных» (id 364766). То есть организации одержимых сопоставимы по масштабу с организациями благословенных.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0234-S03", "SP-0234--nositeli"], "h": "<p>Носители — люди, одержимые демоном. Никакого другого условия (происхождение, отбор, предрасположенность) в переписке не названо; как именно демон вселяется в человека, не сказано.</p>\n<p>Отдельно зафиксировано, что одержимого автор может называть арбетаром — то есть носители одержимости и арбетары в терминологии автора пересекаются.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0234-S04", "SP-0234--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-09-12 (id 364764–364768), окно w0104.</strong>\nВведено само разделение: «Во первых вообще кто есть благословенные и одержимые. Благословенный всё также но силы у всех благословенных получен от небес» (id 364764). Благословенные получают силу от небес, одержимые — от демона. Заданы: аналогия с арбетаром, отсутствие обучения, превосходство над благословенными и групповая охота, два исхода (убийство или изгнание), законность убийства, наличие у одержимых собственных крупных организаций и появление у них защитников после раскрытия существования чёрной изнанки, а также существование организаций-охотников на правительственном и благотворительном финансировании.</p>\n<p><strong>Версия 2 — 2025-09-12 (id 364774–364782), окно w0104.</strong>\nДостроен мир после раскрытия. До этого «И всё это держалось в секрете от людей». Раскрытие произошло из-за апостолов: «когда апостолы устроили охоту на одну религиозную организацию по всему миру. И делали они это особо не скрываясь. Да какой там скрываться. Они могли в центре города разнести церковь или многоэтажку которая принадлежал той организации. Апостола ещё могли публично устроить казнь десятков а то и сотни людей ( работников этой организации)». Поскольку организация «было одной из самых крупных организации связанный с благословенными», апостолы «знатно пошумели на весь мир. Раскрыв существование тёмной изнанки». Последовали «паника, массовая истерия, гражданский войны и множеств других пагубных вещей».</p>\n<p>Итог раскрытия: «Ну по итогу всё устаканилось и всё продолжили жить как жили. Изменилось только три вещи». Перечислены три:</p>\n<ol>\n<li>«было подписан публичный договор обозначающий права и обязанности благословенных. А также их не я, не участия в военных конфликтах» (фраза записана с обрывом; речь о договоре о правах и обязанностях благословенных и о неучастии в военных конфликтах).</li>\n<li>«большинство организации раскрылись то бишь о них уже знает мир и могут их даже нанимать для убийства одержимого ( ну это бесплатно. Не благословенный получают деньги за убийство одержимого. Просто именно для родственников одержимого это бесплатно), а вот платно это изгнания демона». То есть заказ на убийство одержимого для родственников бесплатен, платной услугой является изгнание демона. Там же: «Да и схватки одержимых и благословенных стали уже обыкновенными».</li>\n<li>«теперь в данный организации можно в ступить» — в организации открыт вход.</li>\n</ol>\n<p>Обе версии написаны в один день, 2025-09-12; вторая не отменяет первую, а добавляет к ней послераскрытийное состояние мира.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0234-S05", "SP-0234--svyaz-s-drugimi-sposobnostyami"], "h": "<ul>\n<li><a href=\"SP-0235.html\">Экзорцизм (изгнание демона)</a> (экзорцизм, изгнание демона) — второй из двух возможных исходов для одержимого, альтернатива убийству; после раскрытия — платная услуга.</li>\n<li>Арбетары — прямой аналог по силам: «у него такие же силы», но без обучения.</li>\n<li>Благословенные — противопоставленная сторона: сила «получен от небес», требуется обучение, по силе чаще уступают одержимому; ведут на одержимых групповую охоту, после раскрытия схватки одержимых и благословенных стали обыденностью.</li>\n<li>Демоны — источник силы одержимого.</li>\n<li>Апостолы — не связаны с одержимыми напрямую, но именно их охота на религиозную организацию раскрыла существование чёрной (тёмной) изнанки и изменила положение одержимых в мире.</li>\n</ul>", "r": [["Экзорцизм (изгнание демона)", "SP-0235.html"]]}, {"t": "Пробелы", "a": ["S06", "SP-0234-S06", "SP-0234--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Как демон вселяется в человека, по какому признаку выбирается носитель — в переписке не сказано.</li>\n<li>Что конкретно за силы у одержимого, кроме отсылки «такие же, как у арбетара», — не расписано.</li>\n<li>Сохраняется ли личность человека под демоном, есть ли у одержимого воля и рассудок — не сказано.</li>\n<li>Как проводится изгнание демона — автор прямо говорит: «Как будет проводиться экзорцизм я ещё не придумал» (id 364767).</li>\n<li>Названия организаций одержимых и организаций-охотников не даны, состав не назван.</li>\n<li>Чёрная изнанка и тёмная изнанка названы в двух версиях разными словами; уточнения, одно ли это, в переписке нет.</li>\n<li>Что происходит с человеком после успешного изгнания демона — не сказано.</li>\n<li>Численность групп благословенных на охоте оговорена как «разного количества», без чисел.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0234--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0235.html\">Экзорцизм (изгнание демона)</a></li>\n<li><strong>Упомянут в способностях:</strong> <a href=\"SP-0235.html\">Экзорцизм (изгнание демона)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0234--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-09-12</td>\n<td>364764–364768</td>\n<td>w0104</td>\n<td>Апостол (разбор «неясно»)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-09-12</td>\n<td>364774–364782</td>\n<td>w0104</td>\n<td>Апостол (разбор «неясно»)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0234-oderzhimye.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0234--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0234.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
