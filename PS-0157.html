<script>const BASE="";const DOCNAME="ведьма (красотка)";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0157-S01", "PS-0157--proishozhdenie"], "h": "<p>Ведьма — не показанный персонаж, а версия рассказчика о причине происходящего с ним. Появляется во второй части истории Славы (2024-08-27, id 225501, окно w0055), когда рассказчик сводит вместе два происшествия — «1 потеря памяти 2 сон который не сон» — и делает вывод:</p>\n<p>«Я как бы не мало мистический херни прочел, чтобы сразу подумать на ведьму. Ну типа та красотка оказалась ведьмой ну или суккубом как кому».</p>\n<p>Выбор между ведьмой и суккубом автор оставляет на читателя — «как кому». В базе это зафиксировано как неясность: ведьма это или суккуб, сам автор оставляет на выбор. Как вариант имени записан «суккуб».</p>\n<p>Само рассуждение рассказчик помещает во вполне бытовую обстановку: «Я начал мыслять сидя на толчке».</p>\n<p>«Та красотка» — отсылка к событиям предыдущей части истории. В первой части (2024-08-21, id 222143) описана незнакомка из ресторана: рассказчик заметил, что на него смотрят — «вот буквально зырит, пожирает взглядом», — и увидел «ниче себе модможелей, ну на 20». Прямой фразы «красотка из ресторана — это она» в переписке нет; связь держится только на слове «та» и на отсылке к предыдущим частям.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0157-S02", "PS-0157--vneshnost"], "h": "<p>Отдельного описания в связи с версией о ведьме нет. Всё, что есть, — из первой части, где речь идёт о незнакомке из ресторана: модель на вид лет двадцати, взгляд, который «пожирает».</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0157-S03", "PS-0157--harakter"], "h": "<p>О поведении — только из первой части (2024-08-21, id 222143). Она сама подсела к рассказчику, сама разговорилась, сама предложила пойти к нему домой. Рассказчик объясняет своё согласие так: «Ну она так играла на эмоциях, что я согласился».</p>\n<p>После потери памяти она оставила записку: «на тумбочки записка с извинением и о оповещения что она выбросила мусор». То есть извинилась и предупредила про мусор. Из вещей рассказчика пропал только мусор — «Ну вроде бы все кроме мусора. Ну блинон который были на столе».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0157-S04", "PS-0157--sposobnosti"], "h": "<p>Приписываемые ей способности — только по цепочке рассуждения рассказчика, прямо в тексте не показаны:</p>\n<ul>\n<li>потеря памяти при открывании двери квартиры («и здесь темень, не не то бишь в глазах, а в памяти не фига не помнил»);</li>\n<li>кошмар с рукой, начавшийся на 10-ю ночь после потери памяти.</li>\n</ul>\n<p>Отдельно рассказчик выдвигает предположение о необходимом условии: что без прямого контакта с ним «она не как не сможет повторить подобного». Предположение опровергается на 15-ю ночь, когда кошмар возвращается без всякого контакта.</p>\n<p>Прямых действий ведьмы в тексте нет: она названа только как объяснение.</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0157-S05", "PS-0157--svyazi-s-drugimi"], "h": "<p><strong>Рассказчик истории Славы</strong> (в первой части — Алек, <a href=\"PS-0148.html\">Алек</a>) — тот, с кем она встретилась в ресторане, кто потерял память и кому снится рука. Он же автор версии о ведьме.</p>\n<p><strong>Рука из кошмара</strong> (<a href=\"PS-0156.html\">рука из кошмара</a>) — связь предположена рассказчиком в том же рассуждении, но не подтверждена. В базе это зафиксировано как неясность: чья это рука и связана ли она с ведьмой — в тексте только догадка героя.</p>\n<p><strong>Незнакомка из ресторана</strong> — «та красотка», к которой отсылает версия.</p>", "r": [["Алек", "PS-0148.html"], ["рука из кошмара", "PS-0156.html"]]}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0157-S06", "PS-0157--kak-menyalsya"], "h": "<p><strong>2024-08-21 (id 222143).</strong> Персонаж существует только как незнакомка из ресторана: модель на вид двадцати лет, подсела, играла на эмоциях, ушла до пробуждения, оставила записку и вынесла мусор. Ничего мистического ей ещё не приписывается. На вопрос Миколая «типо когда он память потерял где она была» (2024-08-21, id 222171) Слава ответил: «В следующий части» (id 222172).</p>\n<p><strong>2024-08-27 (id 225501).</strong> Появляется версия о ведьме или суккубе. Это единственная версия персонажа в базе. Само появление женщины в кадре не повторяется — она названа задним числом, как объяснение уже случившегося.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0157-S07", "PS-0157--chto-s-nim-stalo"], "h": "<p>После записки женщина в тексте больше не появляется. На конец второй части (2024-08-27, id 225501) она остаётся только предположением рассказчика.</p>\n<p>Поиски рассказчиком колдунов и экспертов чёрной магии в интернете ничего не дали: «либо явная кидавола, либо кидаволо но менее явная». В конце второй части к нему на улице обращается мужчина, принятый за бомжа, который «поведал мне о причине моих несчастье», — но сам рассказ в сообщение не входит, текст обрывается на «и вот что он рассказал» и «Продолжение следует». Подтверждает ли эта причина версию о ведьме, в переписке не сказано.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0157-S08", "PS-0157--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Ведьма это или суккуб — сам автор оставляет на выбор, «как кому».</li>\n<li>Имя не названо.</li>\n<li>Где она была в момент потери памяти — на 2024-08-21 ответ отложен в следующую часть (id 222172); в тексте от 2024-08-27 к этому вопросу не возвращаются.</li>\n<li>Зачем ей рассказчик и зачем она забрала мусор — не сказано.</li>\n<li>Подтверждения версии рассказчика в окне нет: она названа догадкой и догадкой остаётся.</li>\n<li>Связь с рукой из кошмара не подтверждена.</li>\n<li>Прямое отождествление «той красотки» с незнакомкой из ресторана словами в переписке не сделано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0157--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0148.html\">Алек</a>, <a href=\"PS-0156.html\">рука из кошмара</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0148.html\">Алек</a>, <a href=\"PS-0156.html\">рука из кошмара</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0157--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-27</td>\n<td>225501–225501</td>\n<td>w0055</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0157-vedma-krasotka.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0157--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0157.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
