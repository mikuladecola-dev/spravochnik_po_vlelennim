<script>const BASE="";const DOCNAME="Хойя-Бача";
const LEAD="";
const CH=[{"t": "Где находится — в каком мире и в каком его месте", "a": ["S01", "MN-0005-S01", "MN-0005--gde-nahoditsya"], "h": "<p>Вселенная «монстры» (по дате объявления). Точное положение внутри мира не названо: в переписке Хойя-Бача упомянута только как пункт, куда персонаж собирается пойти, без указания на соседние места, расстояние или способ добраться. Единственная косвенная привязка — маршруты одного дня: в том же сообщении спасатель говорит, что «вообще за рыбочеловеком шел до Ньюса» (<a href=\"MN-0006.html\">Ньюс</a>), так что оба места оказываются в пределах его текущих перемещений. Как они соотносятся между собой, не проговорено.</p>", "r": [["Ньюс", "MN-0006.html"]]}, {"t": "Что собой представляет", "a": ["S02", "MN-0005-S02", "MN-0005--chto-soboy-predstavlyaet"], "h": "<p>Не описано. Единственное упоминание (2024-08-29, id 226088) даёт только название и то, зачем туда идут: «пойду пока-что в Хойя-Бачу монстров на монстров порыбачу». Из этой фразы прямо следует, что в Хойя-Баче водятся монстры и что там их можно ловить — «порыбачить»; ни ландшафт, ни размер, ни то, природное это место или постройка, в переписке не сказано.</p>", "r": []}, {"t": "Что с ним связано — предметы, механики, силы", "a": ["S03", "MN-0005-S03", "MN-0005--chto-s-nim-svyazano"], "h": "<p>Единственная механика, привязанная к месту самой фразой, — ловля монстров, где монстры служат и добычей, и средством: «монстров на монстров порыбачу». Как это устроено, не объяснено.</p>\n<p>Прямых связей с предметами не названо. В том же сообщении перечислены монстры, которыми занят говорящий, но привязка их к Хойя-Баче не проговорена:</p>\n<ul>\n<li>«векторная тварь» — «очень сподручна для перемещения конечно, её буду истреблять последней. хотя нет всех и сразу»; там же — «раздавил опять векторный шар, благо над холмом пролетал»;</li>\n<li>эхолокатор — «найти бы эхолокатора. почему все эти ублюдки так хорошо прячутся»;</li>\n<li>рыбочеловек — с ним связан второй топоним того же сообщения, Ньюс (<a href=\"MN-0006.html\">Ньюс</a>), а не Хойя-Бача.</li>\n</ul>\n<p>Где именно происходили эти эпизоды — в переписке не сказано.</p>", "r": [["Ньюс", "MN-0006.html"]]}, {"t": "Персонажи и события — кто с ним связан и что там происходило", "a": ["S04", "MN-0005-S04", "MN-0005--personazhi-i-sobytiya"], "h": "<p>Спасатель. Он объявляет о намерении идти в Хойя-Бачу; самого похода в переписке нет — только заявленное намерение, и оно объявлено как промежуточное дело («пойду пока-что»), потому что основной его маршрут в этом сообщении другой: «я же вообще за рыбочеловеком шел до Ньюса».</p>\n<p>Сцена, в которой звучит название, происходит не в Хойя-Баче: спасатель встречает собеседника и ведёт его на склад («ладно, погнали покажу склад»), попутно обсуждая его рост («165 в 27 лет»), и там же обращается к монстрам — «ублюдки, приятного аппетита». В том же сообщении он говорит о себе: «я хочу увидеть дочку. я устал видеть эти мерзкие лица, устал каждого уничтожать. я хочу жить счастливо и размеренно со своей семьёй. эти изверги, я ненавижу их. их не останется ни одного». К Хойя-Баче это прямо не отнесено.</p>\n<p>Событий, происходивших в самой Хойя-Баче, в переписке нет.</p>", "r": []}, {"t": "Как менялся по версиям — по датам", "a": ["S05", "MN-0005-S05", "MN-0005--kak-menyalsya-po-versiyam"], "h": "<p>Одна версия. 2024-08-29 (id 226088, окно w0055) — первое и единственное упоминание. Позже к месту не возвращались, ничего не переигрывали, отклонённых вариантов нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "MN-0005-S06", "MN-0005--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Что это за место — не описано.</li>\n<li>Не сказано, где Хойя-Бача расположена относительно других мест мира монстров и относительно Ньюса (<a href=\"MN-0006.html\">Ньюс</a>), упомянутого в том же сообщении.</li>\n<li>Не сказано, откуда название и что оно значит.</li>\n<li>Не сказано, кто, кроме монстров, там водится и есть ли там население.</li>\n<li>В чём состоит ловля «монстров на монстров» — механика не раскрыта.</li>\n<li>Дошёл ли спасатель до Хойя-Бачи — в переписке не сказано.</li>\n</ul></div>", "r": [["Ньюс", "MN-0006.html"]]}, {"t": "Связи — всё вместе", "a": ["MN-0005--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает монументы:</strong> <a href=\"MN-0006.html\">Ньюс</a></li>\n<li><strong>Упомянут в монументах:</strong> <a href=\"MN-0006.html\">Ньюс</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MN-0005--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-29</td>\n<td>226088–226088</td>\n<td>w0055</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/monumenty/MN-0005-hoyya-bacha.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MN-0005--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MN-0005.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["MN-0005-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/MN-0005/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым чинить саму вселенную. <code>VS-0015</code> «монстры»: статьи нет, в базе 49 КБ, и на её исходник смотрят одиннадцать статей — все монументы мира (<code>MN-0004</code>, <code>MN-0006</code>–<code>MN-0011</code>), плюс <code>IS-0017</code>, <code>SP-0120</code>, <code>MR-0068</code>. Пока её нет, у Хойя-Бачи нет ни карты, ни соседей: раздел «где находится» нечем закрыть не потому, что в переписке не сказано, а потому, что не к чему привязывать.</p>\n<p>Вторая по цене — спасатель. <code>PS-0144</code>: статьи нет, а в базе 51 КБ — больше, чем у любого другого персонажа этого мира. По имени он назван в четырёх статьях (<code>MN-0004</code>, <code>MN-0005</code>, <code>MN-0006</code>, <code>MR-0067</code>), и в каждой он единственный источник сведений о месте. Нулевой счётчик ссылок у него только потому, что ссылаться пока некуда.</p>\n<p>Третья — то, что перечислено в этой же статье как «связанное»: <code>PS-0154</code> векторный шар (5.8 КБ), <code>ID-0092</code> эхолокатор (4.2 КБ), <code>PS-0145</code> рыболюди (17.3 КБ), <code>SP-0105</code> использование монстров спасателем (2.3 КБ). Ни у одного нет статьи, поэтому раздел про связи держится на цитатах и никуда не выводит.</p>\n<h3>С чего начать</h3>\n<p>В базе — но не по самой Хойя-Баче. Она исчерпана: одно сообщение, id 226088, оно уже разобрано до фразы. Сцена вокруг него разъехалась по трём статьям: склад — <code>MN-0004</code>, преследование рыбочеловека — <code>MN-0006</code>, монстры-утилиты — здесь. Собирать надо не место, а говорящего: <code>PS-0144</code> (51 КБ), рядом <code>SP-0109</code> вещества спасателя (7.1 КБ), <code>SP-0105</code> (2.3 КБ), <code>PS-0152</code> дочка спасателя (4.9 КБ) и <code>PR-0033</code> «Один день из повседневности спасателя» (3.6 КБ) — судя по названию, тот же режим речи, что и в этом сообщении.</p>\n<p>В архив идти только за географией: окно w0055, 2024-08-29, и всё вокруг этой даты. Ориентир для поиска — не слово «Хойя-Бача», а лексика монолога: «порыбачу», «ублюдки», клички монстров. Топоним появился как побочный продукт болтовни, и если он повторится, то там же.</p>\n<h3>Как развивалось</h3>\n<p>2024-08-29 — название сказано один раз, внутри отступления от другой сцены, и объявлено как промежуточное дело: «пойду пока-что». В тот же вечер из одного сообщения выросли три места сразу — склад, Ньюс, Хойя-Бача. Ни к одному из них не вернулись. Дальше по миру монстров топонимы идут в том же режиме, по одному за раз: Колосс — 2024-09-17, Степь с руинами — 2024-10-20, Чёрное озеро — 2024-11-13, у каждого ровно одна дата.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для векторной твари полезность проговорена, и из неё прямо выведен порядок действий: «очень сподручна для перемещения конечно, её буду истреблять последней». Для эхолокатора, которого в том же сообщении ищут («найти бы эхолокатора»), зачем он нужен — не сказано ничего. Один монстр объяснён через применение, соседний — только через факт поиска.</p>\n<h3>Отклик</h3>\n<p>Хойя-Бача держится на одном глаголе. «Монстров на монстров порыбачу» — и место мгновенно получает режим: туда не идут воевать, туда ходят по-бытовому, и приманка того же сорта, что и добыча. Ещё сильнее то, что название проброшено вскользь: человек ведёт гостя на склад, обсуждает его рост, желает монстрам приятного аппетита — и между делом роняет два топонима, ни один из которых ему самому не интересен. Статья честно фиксирует, что материала на место нет, и из этого неожиданно получается портрет не места, а говорящего: у него в голове карта, по которой он ходит каждый день, и он не считает нужным её кому-то объяснять.</p></div>", "r": []}];</script>
