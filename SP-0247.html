<script>const BASE="";const DOCNAME="Изменение мира волнами";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0247-S01", "SP-0247--mehanika"], "h": "<p>Способность названа только формулировкой, без разбора устройства (2025-11-17, окно w0109, id 385768–385779).</p>\n<p>Первое упоминание — в перечне рас и организаций, при описании правительственной организации по контролю: «Правителская организации по контролю всех этих. Сильнейшая там девченка что может изменять мир волнами» (id 385768).</p>\n<p>Второе — при разговоре о Нуаре: «Ну здесь он будет влиять на мир подобно волнами» (id 385779).</p>\n<p>Что такое «волны», по чему они идут и что именно меняется в мире, в переписке не сказано.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S02", "SP-0247-S02", "SP-0247--nositeli"], "h": "<p><strong>Девчонка из правительственной организации по контролю.</strong> Названа сильнейшей в этой организации. Организация в том же перечне описана как «Правителская организации по контролю всех этих» — то есть контролирующая перечисленные расы и группировки. Имени у девчонки нет.</p>\n<p><strong>Нуар.</strong> О нём в том же окне сказано: «Кстати нуар один из котов» (id 385774) и «Помнишь нуара. Сильнеший из 7 островов» (id 385775). Миколай подтвердил, что помнит персонажа (id 385776). После этого и дана формулировка про влияние на мир волнами.</p>\n<p>Одна ли это способность у двух носителей или просто совпадение оборота — в переписке не оговорено.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S03", "SP-0247-S03", "SP-0247--kak-menyalas-po-versiyam"], "h": "<p>Версия 1 — 2025-11-17 (id 385768–385779, окно w0109). Единственное состояние. Внутри одного окна формулировка применена сначала к девчонке из правительственной организации, затем к Нуару. Раньше или позже способность не описывалась.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S04", "SP-0247-S04", "SP-0247--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Через носителя способность связана с котами. О котах в том же сообщении сказано: «Коты. Их 9. они сильнеший (уникальный особенности, я для них не придумал помоги) и вот они есть в каждую эпоху. Если один кот умрёт родиться новый и всегда их будет 9. Они вообще никуда не вмешиваться» (id 385768). Уникальные особенности котов на тот момент не придуманы — Слава прямо попросил Миколая помочь с ними. Влияние Нуара на мир волнами и общее утверждение о том, что коты никуда не вмешиваются, в переписке между собой не соотнесены.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "SP-0247-S05", "SP-0247--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Механика не раскрыта: как выглядит волна, какой у неё охват, что она делает с миром — ничего не названо.</li>\n<li>Не сказано, одна ли это способность у двух носителей.</li>\n<li>Не названо, есть ли у способности цена или ограничения.</li>\n<li>У девчонки из правительственной организации нет имени.</li>\n<li>Уникальные особенности котов, к которым относится Нуар, на этот момент не придуманы.</li>\n<li>Связь между «коты вообще никуда не вмешиваются» и тем, что Нуар влияет на мир, осталась нерешённой.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0247--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0104.html\">Нуар</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0059.html\">Правительственная организация по контролю</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0247--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-11-17</td>\n<td>385768–385779</td>\n<td>w0109</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0247-izmenenie-mira-volnami.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0247--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0247.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
