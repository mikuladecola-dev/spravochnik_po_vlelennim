<script>const BASE="";const DOCNAME="Оберег";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0074-S01", "SP-0074--mehanika"], "h": "<p>Оберег — «инструмент» персонажа, а не оружие: Слава, попросив помощи с придумыванием, сразу отсекает оружейный вариант — «Это точно не оружие» (2024-06-30, id 191906). На реплику Миколая «Так ну ты хотел вообще огнестрелы ебануть» (id 191907) продолжения не следует: огнестрел в этой ветке больше не рассматривается.</p>\n<p>Собственно принцип действия оберега в переписке не сформулирован. Названо только то, чем предмет является внешне: Миколай описывает его как «Такая залупа на верёвке» и добавляет — «Называется оберег» (id 191917–191918). Что оберег делает, от чего оберегает, как включается — в переписке не сказано.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0074-S02", "SP-0074--ogranicheniya-i-cena"], "h": "<p>Не обсуждались.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0074-S03", "SP-0074--nositeli"], "h": "<p>Персонаж с раздвоением личности (способность тьма). Оберег заявлен как его инструмент; способность помечена как часть этого персонажа.</p>\n<p>Про самого носителя в этом же окне Слава даёт предысторию вместо предложенной Миколаем памятной: «Он рос в лабораторий его с рождения учили убивать не более, но после его спасения сильнейший команды он попал под их опеку и там учился быть нормальным человеком» (id 191926). Связь этой предыстории с происхождением оберега не проговорена — сказано только, что она даётся вместо истории про подарок.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0074-S04", "SP-0074--kak-menyalas-po-versiyam"], "h": "<p>Версия 1 — 2024-06-30 (id 191892–191926, окно w0040). Единственная версия. Ход разработки внутри одного разговора:</p>\n<ol>\n<li>Миколай начинает с вопроса «А че по инструментам?» (id 191892), Слава просит помочь — «Помоги не могу придумать» (id 191903).</li>\n<li>Слава ставит рамку: не оружие (id 191906).</li>\n<li>Миколай предлагает варианты — «Печать может какая» (id 191910), затем «Или колечко, чисто как кран служащее» (id 191912), то есть кольцо-регулятор.</li>\n<li>Слава называет своё: «Оберег» (id 191911) и тут же спрашивает «Какие обереги есть» (id 191913).</li>\n<li>Миколай даёт форму: «Такая залупа на верёвке. Называется оберег» (id 191917–191918).</li>\n<li>Миколай предлагает сделать вещь памятной: «Возможно это будет чет памятное? Типа ему подарила эту хуету внучка брата по линии матери перед тем как её сбила машина хз» (id 191919–191920).</li>\n<li>Слава отказывается: «Ты же в курсах я истории вообще как долбоеб не прописываю» (id 191921) — и вместо памятного подарка даёт лабораторную предысторию персонажа (id 191926).</li>\n</ol>\n<p>На этом обсуждение обрывается на краю окна.</p>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S05", "SP-0074-S05", "SP-0074--otklonennye-varianty"], "h": "<ul>\n<li>Оружие, в том числе огнестрельное — отсечено Славой сразу («Это точно не оружие», id 191906).</li>\n<li>Печать — предложение Миколая (id 191910), не подхвачено.</li>\n<li>Колечко «чисто как кран служащее», то есть предмет-регулятор — предложение Миколая (id 191912), не подхвачено.</li>\n<li>Памятное происхождение (подарок от внучки брата по линии матери, погибшей под машиной) — предложение Миколая (id 191919–191920), отклонено Славой со ссылкой на то, что он «истории вообще как долбоеб не прописывает».</li>\n</ul>", "r": []}, {"t": "Связь с другими способностями", "a": ["S06", "SP-0074-S06", "SP-0074--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Названо соседство с Тьмой: оберег принадлежит персонажу с раздвоением личности, чья способность — тьма. Как оберег соотносится со тьмой — работает вместе с ней, сдерживает её, независим от неё — в переписке не сказано.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "SP-0074-S07", "SP-0074--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Что оберег делает — не названо.</li>\n<li>От чего оберегает и оберегает ли вообще (кроме самого слова «оберег») — не названо.</li>\n<li>Форма и функция до конца не определены, обсуждение обрывается на краю окна.</li>\n<li>Происхождение предмета осталось нерешённым: памятный вариант отклонён, замены ему не предложено.</li>\n<li>Второе имя способности — «инструмент»; какое из двух названий рабочее, не оговорено.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0074--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0074--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-06-30</td>\n<td>191892–191926</td>\n<td>w0040</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0074-obereg.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0074--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0074.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
