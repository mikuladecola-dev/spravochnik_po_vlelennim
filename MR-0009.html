<script>const BASE="";const DOCNAME="Бесцветные и Цветные";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0009-S01", "MR-0009--ustroystvo"], "h": "<p>Базовое деление носителей абакры на две категории. Определение дано Славой одной репликой (2024-05-25, id 173152): «Бесцветный ( владельцы абакра но без эксклюзивный абилки ) Цветный ( владельцы абакра но с абилкой». То есть абакра есть у обеих категорий, различие проходит по наличию «эксклюзивной абилки».</p>\n<p>Что умеют бесцветные, сказано сразу следом (id 173153): «То бишь бесцветный могут только усиливать тело и все». Никаких других действий за бесцветными в переписке не закреплено.</p>\n<p>Носитель абилки описан на клеточном уровне. Миколай: «Абилка во первых выражается в клетках» (id 173155), «Которые как раз содержат информацию о ней» (id 173157). Отсюда прямой вывод: «Бесцетные не имеют таких клеток» (id 173159). Слава попросил закрепить эту мысль (id 173160). Таким образом, разница между бесцветным и цветным — это наличие или отсутствие особых клеток, содержащих информацию об абилке.</p>\n<p>Переход из бесцветных в цветные в переписке представлен двумя путями:</p>\n<ul>\n<li>Программа опытов — «Эксперименты по превращению бесцветного в цветного» (<a href=\"MR-0010.html\">Эксперименты по превращению бесцветного в цветного</a>), где за 30-50 лет получено три удачных экземпляра.</li>\n<li>Пробуждение. В тексте про главного героя (2024-05-25, id 173353): судьба «дала ему пробудится цветным». Механика самого пробуждения — от чего оно происходит, можно ли им управлять — не описана; в этом фрагменте оно подано как событие, которое с мальчиком произошло.</li>\n</ul>\n<p>Соотносятся ли эти два пути между собой (является ли эксперимент искусственной заменой пробуждения), в переписке не сказано.</p>", "r": [["Эксперименты по превращению бесцветного в цветного", "MR-0010.html"]]}, {"t": "Население", "a": ["S02", "MR-0009-S02", "MR-0009--naselenie"], "h": "<p>Численное соотношение: Миколай задаёт вопрос «И их бо́льшее количество?» о бесцветных (id 173163) и следующей репликой пишет «Окей» (id 173164). В навигационной сводке материала это зафиксировано как «и самих бесцветных больше». Прямого ответа Славы на вопрос о количестве в приведённом куске переписки нет — реплика Славы «Получается нет» (id 173162) стоит раньше и относится к отсутствию клеток у бесцветных.</p>\n<p>Названные носители в этом окне:</p>\n<ul>\n<li>Главный герой — мальчик без имени, «пробудился цветным» (id 173353). До пробуждения у него «не было ничего не имени не семьи ни друзей не дома не вещей», и «сам мальчик был некем». После пробуждения «в мальчики проснулась жадность»: «он захотел больше он хотел стать кем-то кого заполнять он хотел больше чего-то иметь он хотел сделать единственную ценную вещь сильней ( то бишь способности)». Способность для него здесь названа «единственной ценной вещью» и «единственной значимой вещью» — то есть цветность для этого персонажа является единственным его имуществом.</li>\n<li>Командир — «первый удачный эксперимент для превращение бесцветного в цветной» (id 173148), то есть бывший бесцветный, ставший цветным. Подробнее — <a href=\"MR-0010.html\">Эксперименты по превращению бесцветного в цветного</a>.</li>\n<li>Волк и Тен (многоликий) — два других удачных экземпляра эксперимента, см. <a href=\"MR-0010.html\">Эксперименты по превращению бесцветного в цветного</a>.</li>\n</ul>", "r": [["Эксперименты по превращению бесцветного в цветного", "MR-0010.html"]]}, {"t": "Место во вселенной", "a": ["S03", "MR-0009-S03", "MR-0009--mesto-vo-vselennoy"], "h": "<p>Деление относится ко вселенной «Цветной мир» (<a href=\"MR-0011.html\">Цветной мир</a>) и входит в её систему сил; на момент окна w0035 Слава говорит, что во вселенной «только персонажей и систему сил продумали».</p>\n<p>С делением напрямую связаны «Эксперименты по превращению бесцветного в цветного» (<a href=\"MR-0010.html\">Эксперименты по превращению бесцветного в цветного</a>): вся программа опытов существует именно ради перевода из одной категории в другую.</p>\n<p>Связь названия вселенной «Цветной мир» с этим делением в переписке не проговаривается: название предложено отдельно (id 173342), без объяснения, откуда взято.</p>", "r": [["Цветной мир", "MR-0011.html"], ["Эксперименты по превращению бесцветного в цветного", "MR-0010.html"]]}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0009-S04", "MR-0009--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-05-25 (id 173145–173164), окно w0035.</strong> Первое определение обеих категорий. Разговор начинается не с деления, а с вопроса Славы о способности для командира сильнейшего отряда, и уже там (id 173148) появляется формулировка «первый удачный эксперимент для превращение бесцветного в цветной» — то есть категории использованы до того, как определены. Определение даётся следующей репликой (id 173152). Затем Миколай выводит клеточную природу абилки (id 173155–173159), и ставится вопрос о численном перевесе бесцветных (id 173163).</p>\n<p><strong>Версия 2 — 2024-05-25 (id 173348–173353), окно w0035, повтор прежней мысли.</strong> Механика используется повторно, уже в связном тексте про главного героя: «дала ему пробудится цветным». Здесь появляется слово «пробудится» — пробуждение как событие, меняющее судьбу. Новых уточнений к самому делению версия не вносит, старое определение не отменяет.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0009-S05", "MR-0009--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Что такое абакра сама по себе, в этом материале не раскрывается — сказано только, что она есть и у бесцветных, и у цветных.</li>\n<li>Численный перевес бесцветных остался в виде вопроса Миколая; ответ Славы в приведённом куске отсутствует.</li>\n<li>Откуда берутся особые клетки с информацией об абилке и почему у одних они есть, а у других нет, не сказано.</li>\n<li>Механика пробуждения не описана: неизвестно, в каком возрасте оно происходит, у всех ли возможно, связано ли с экспериментами.</li>\n<li>Могут ли цветные потерять абилку и стать бесцветными — не обсуждалось.</li>\n<li>Есть ли внутри цветных дальнейшее деление (по силе, по типу абилки) — в этом окне не сказано.</li>\n<li>Социальная сторона деления — есть ли у бесцветных и цветных разный статус, права, отношение друг к другу — не обсуждалась. Упомянутая в <a href=\"MR-0010.html\">Эксперименты по превращению бесцветного в цветного</a> «война между людьми и со сверхлюдми» с этим делением в переписке напрямую не соединена.</li>\n<li>Варианты написания «цветный» и «цветной» в переписке используются вперемешку; какое из них считать основным, не оговорено.</li>\n</ul></div>", "r": [["Эксперименты по превращению бесцветного в цветного", "MR-0010.html"]]}, {"t": "Связи — всё вместе", "a": ["MR-0009--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0010.html\">Эксперименты по превращению бесцветного в цветного</a>, <a href=\"MR-0011.html\">Цветной мир</a></li>\n<li><strong>Упомянут в мирах:</strong> <a href=\"MR-0010.html\">Эксперименты по превращению бесцветного в цветного</a>, <a href=\"MR-0011.html\">Цветной мир</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0090.html\">Бесцветные и Цветные</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0012.html\">Цветной мир</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0009--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-05-25</td>\n<td>173145–173164</td>\n<td>w0035</td>\n<td>Цветной мир (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-05-25</td>\n<td>173348–173353</td>\n<td>w0035</td>\n<td>Цветной мир (объявлено)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0009-bescvetnye-i-cvetnye.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0009--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0009.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
