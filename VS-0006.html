<script>const BASE="";const DOCNAME="Нимб";
const LEAD="";
const CH=[{"t": "Зарождение", "a": ["S01", "VS-0006-S01", "VS-0006--zarozhdenie"], "h": "<p>Вселенная объявлена 2025-04-08 одним словом. Ей предшествовал разговор про апокалипсис в то же утро (2025-04-08, 11:29, id 317146–317149), где Слава задавал вопросы:</p>\n<ul>\n<li>«Если строить апокалипсис» (317146)</li>\n<li>«То какая будет основа вируса или заразя» (317147)</li>\n<li>«Какая у него будет изюминка» (317148)</li>\n<li>«И что за монстры» (317149)</li>\n</ul>\n<p>Миколай спрашивал «а паразиты че?» (317178) и «че за монстры, это антагонисты?» (317198). Слава отвечал: «Нет это протагонист» (317213), «А люди антоганисты» (317215). То есть до объявления вселенной существовала заготовка апокалипсиса, где монстры — протагонисты, а люди — антагонисты (в базе она заведена отдельной идеей «Апокалипсис с монстрами-протагонистами», 2 версии, с 2025-04-08).</p>\n<p>Сам Слава уточнил, что всё перечисленное было не изложением идеи, а списком вопросов. На требования Миколая «раскрой всё что есть из идей» (317216), «че за идея» (317222), «как оно будет» (317223), «че хочешь получить» (317224) ответ: «Ты еба....................... Это всё был вопрос» (317226), «Всё эти вопросыи» (317227).</p>\n<p>Объявление — одно слово (2025-04-08, 13:00, id 317228, окно w0087):</p>\n<div class=\"q\"><p>Нимб</p></div>\n<p>Миколай ответа не понял: «че» (317231), «не понял» (317232), «че» (317233, 317234), «я бы точнее вопросы задал» (317235), «я же говорю сейчас уже занят» (317236), «консультация» (317237).</p>\n<p>Через 24 минуты Слава разворачивает содержание (id 317240–317258) — это первое описание организации Нимб, приведённое ниже в разделе «Организации и сообщества». Итоговая формула автора там же: «Грубо говоря это организация сцп только измененая под мои рамки» (317258).</p>\n<p>Вечером того же дня (2025-04-08, 21:14–21:18, id 317403–317454) Слава отменяет исходную рамку. Миколай возвращается к апокалипсису: «че за апокалипсис в итоге?» (317403), «или как раз этого ты не знаешь?» (317404). Ответы:</p>\n<ul>\n<li>«А его нету» (317405)</li>\n<li>на «будет?» (317408) — «Не знаю» (317413)</li>\n<li>«Просто знаю есть объекты и есть нимб» (317410)</li>\n<li>«И всё происходит в современном мире» (317412)</li>\n<li>на вопрос «это темка которой управляет нимб?» (317418) — «Не, забудь про это» (317422)</li>\n<li>«Апокалипсиса и вируса нету» (317430)</li>\n<li>«Есть только нимб и объекты» (317432)</li>\n<li>перечень объектов: «Медуза, черныши, серафим,..» (317440), многоточие авторское</li>\n<li>«Также там производять опыт над людьми» (317447)</li>\n</ul>\n<p>Тогда же уточнено отношение объектов к SCP. Миколай: «это аномалии, объескиы сцп» (317446). Слава: «Нет» (317448), «Мои» (317450), «Личные» (317452), «Хотя они могут быть похоже» (317453), «Ведь в сцп их там дохуя» (317454).</p>\n<p>Тем же вечером Миколай вводит рабочее сокращение (2025-04-08, id 317459–317474). Сначала он поясняет, что словом «сцп» пользовался образно: «я то понял» (317460), «что не офицальный сцп» (317461), «я тоже образно назвал» (317463). Слава предлагает пользоваться своим словом: «Нимб» (317464), «Называй» (317465), «Да» (317466). Миколай: «дай называть нб: нимб банк» (317467), «банк объектов» (317468), «нбо» (317469). Слава: «Ок» (317470), «Нбо» (317471). На переспрос Славы «А че не просто нимб» (317473) Миколай объясняет разграничение: «ну типа нимб это пошире будет» (317472), «там же они как больничка и другое» (317474). Дальше в переписке сокращение НБО не используется.</p>\n<p>Формат вещи автор определяет там же: «Ну будут мини истории о некоторых объектов , будней нимба и т. П. Пока я ещё не до конца придумал мир, пусть пока будет так» (317512).</p>\n<p>Все три дословных объявления в карточке вселенной (<code>[Нимб](VS-0006-nimb.md)</code>) датированы одним днём — 2025-04-08, окно w0087: объявление (317228), смена (отмена апокалипсиса, 317430) и переименование (введение НБО, 317467–317471). Между первым и вторым — восемь часов того же дня (13:00 и 21:14).</p>\n<p><strong>Названия и рабочие обозначения</strong></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Обозначение</th>\n<th>Кто ввёл</th>\n<th>Дата и id</th>\n<th>Что означает</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>«Нимб»</td>\n<td>Слава</td>\n<td>2025-04-08, id 317228</td>\n<td>Название вселенной; произнесено одним словом в ответ на вопросы про апокалипсис</td>\n</tr>\n<tr>\n<td>«Организация нимб»</td>\n<td>Слава</td>\n<td>2025-04-08, id 317240</td>\n<td>Организация внутри вселенной, с которой вселенная начинается</td>\n</tr>\n<tr>\n<td>«нб: нимб банк»</td>\n<td>Миколай</td>\n<td>2025-04-08, id 317467</td>\n<td>Промежуточная форма, тут же уточнена до «банк объектов»</td>\n</tr>\n<tr>\n<td>«нбо» / «Нбо» / «НБО»</td>\n<td>Миколай, принято Славой</td>\n<td>2025-04-08, id 317469–317471</td>\n<td>«нимб банк объектов» — часть организации, которая ловит и хранит объекты</td>\n</tr>\n<tr>\n<td>«сцп», «организация сцп»</td>\n<td>оба</td>\n<td>2025-04-08, id 317251, 317258, 317446, 317461, 317463</td>\n<td>Образное обозначение, не название. Слава: «Они типа сцп»; Миколай: «я тоже образно назвал»</td>\n</tr>\n</tbody>\n</table></div>\n<p>Отдельного названия для вселенной, отличного от названия организации, в переписке не звучало: вселенная и организация названы одним словом «Нимб». Откуда взялось само слово и почему организация названа именно так — в переписке не сказано.</p>\n<p><strong>Границы отрезка.</strong> В карточке объявлен один отрезок: 2025-04-08 — 2025-05-09, по объявлению 317228 и смене 317430. Конец отрезка стоит на 2025-05-09, но объявления, которым он поставлен, в файле нет: раздел «Дословно — объявления» содержит только три события 2025-04-08. Самая поздняя датированная запись во всём файле — проза от 2025-05-07 (фрагменты истории Ивана Васильевича).</p>\n<p><strong>Что вошло во вселенную раньше её объявления.</strong> Восемь сущностей датированы раньше 2025-04-08: Демон (2023-03-27), Максим и Саша (2024-04-03), Андрей (2024-08-08), Чёрный ящик (2024-11-17), Масочник (2025-01-28), Михаил (2025-03-21), Игорь (2025-03-25). Объявлений об их включении в «Нимб» в выписках нет.</p>", "r": []}, {"t": "Масштаб", "a": ["S02", "VS-0006-S02", "VS-0006--masshtab"], "h": "<p>Мир один и он современный. Прямая формулировка Славы (2025-04-08, id 317410–317432): «Просто знаю есть объекты и есть нимб», «И всё происходит в современном мире», «Апокалипсиса и вируса нету», «Есть только нимб и объекты». Ни карты, ни стран, ни континентов, ни устройства неба и земли в переписке не описано; география — наша.</p>\n<p>Числа миров в переписке не названо ни разу. Списка миров не существует. Раздел «мир» в базе содержит по этой вселенной четыре записи, и ни одна не описывает мир как отдельную планету, план или измерение: «Нимб» (<a href=\"MR-0132.html\">Нимб</a>) — организация, «Отделы Нимба» (<a href=\"MR-0133.html\">Отделы Нимба</a>) — её отделы, «Фармацевтическая компания» (<a href=\"MR-0135.html\">Фармацевтическая компания</a>) — организация из другой истории, «Инцидент (ядерный удар)» (<a href=\"MR-0136.html\">Инцидент (ядерный удар)</a>) — событие.</p>\n<p>Единственное место, где во вселенной вообще названа множественность миров, — вопрос Миколая 2025-04-08 (id 317516): «это челы другого мира или директора нимба или всё вместе?». Слава отвечает «И то и другой» (317517) и тут же переспрашивает: «Че ща другой мир?» (317518). То есть второй мир внесён вопросом соавтора и на переспрос автора не подтверждён. Миколай сворачивает на «Мастера и Маргариту»: «у мы сейчас мастера и Маргариту читаем в школе на литре» (317519), «там демон был типа сущностью другого мира» (317520), поправляется — «скорее он находился в существующем мире вне времени» (317524), «ну вот он демон» (317526). Разработки после этого нет.</p>\n<p><strong>Единственное названное исключение из физики — медуза</strong> (2025-04-08, 21:32–21:33, id 317530–317536). Слава: «медуза находиться вне пространства этого мира»; на просьбу объяснить («че за медуза, я думал обычное животное», 317534) уточняет: «Чисто формально, но тела его в нашем мире, но законы физике действуют на него по правилам пространства другого мира» (317536). Миколай: «о, круто» (317537). Дальше Слава разбор откладывает: «Там я вообще поебоду придумал» (317538), «Расписывать дофига» (317539); Миколай просит: «рассказывай», «поебать», «так и надо» (317540–317542). Обещанное подробное описание в чат не попало. Что это за другой мир, где он, есть ли у него имя, кто в нём — не сказано.</p>\n<p><strong>Второе место с ненормальным пространством — заброшенный корабль исполняющего желания</strong> (2025-04-21, id 320983–320987), внутри прозы Славы. Правила места, как они прописаны в тексте:</p>\n<ul>\n<li>собраться нужно 11 июня к полуночи, у заброшенного корабля «По размеру который как гора»;</li>\n<li>будильник у всех поставлен ровно на 00:00, забежать надо в это время, «А если не успеешь то все»;</li>\n<li>в 00:01 берег исчезает: «за мной было морей. Не тот берег. На которым мы всё собрались. А морей без горизонта». Рассказчик называет это «такой резкой перемещение в пространстве»;</li>\n<li>внутри абсолютная тьма: «Темно настолько, что вытянув руку ты ее не увидишь. Тьма во тьме. Тьма против тьмы»;</li>\n<li>комната, затопленная водой, после прорыва двери исчезает вместе с водой: «Она как-то быстро исчезла, испарилась… Я посмотрел в сторону комнаты. Но там еë не было»;</li>\n<li>в каждой комнате окно;</li>\n<li>коридоры завалены выпотрошенными телами без кожи, под ногами булькает;</li>\n<li>тени ведут себя активно: «тени начали кидаться под ноги. Мы спотыкались на ровном месте»;</li>\n<li>на корабле есть «тот кто исполнить желания», найти его надо самому; слух, который двигает сюжет, — «А что если он может исполнить лишь одно желания».</li>\n</ul>\n<p>Кто такой «исполняющий желания» и как он связан с Нимбом — в тексте не объяснено, история оборвана.</p>\n<p>В том же тексте (id 320983) есть проговорка про состав пришедших: «Студентка, клерк, старик, красотка, бандит, бизнесмен и так далее. Все это были разный люди, из разных слоев. Хм миров.» Слово «миров» стоит там как поправка к «слоев».</p>\n<p><strong>Способов перемещения между мирами в переписке по этой вселенной не названо вообще</strong> — ни порталов, ни ритуалов, ни техники, ни правил перехода. Единственное описанное перемещение — мгновенный перенос корабля вместе с людьми в открытое море в 00:01 (id 320983), и оно подано как событие внутри истории, а не как механизм.</p>\n<p><strong>Инцидент (ядерный удар)</strong> (2025-05-04, id 323659–323661) — единственное описание состояния мира целиком, и то через рассказчика. Пролог про апокалипсис, рассказчик — Алексей, «Я Алексей выживший». Он делит время на до и после и называет катастрофу инцидентом: «В том мире, в котором жиле мы до инцидента я был просто офисный сотрудник».</p>\n<p>Мир до инцидента (id 323659): «То время, где могли учиться, развиваться и мечтать. То время, где хаус и неразбериху. Упорядочил порядок и закон. Где ясно было где плохой, а где хороший. Где ты мог стать хоть кем угодно»; и далее: «Мы жили в том порядке, который наши предки собрали за миллионы лет истории. Но ничто не вечно. И весь порядок собранный так долго, тщательно, был разрушен в один миг.»</p>\n<p>Сам удар (id 323660): субботнее утро, 8:23 на часах, город почти пустой, ощущение «что-то не так», которое рассказчик не может осознать. Потом небо: «Линий в воздухе, как от самолёта. Вот только их было сотни если не тысячи. Словно всё страны мира решили разом запустить всё имеющий боеголовки.» Дальше: «Не было сигнала или голоса, который говорил бы о запуске ракеты на нас. Не было паники, истерики. Была просто тишина. Пока не прогремел ударь.» Затем сотрясение земли, гул зданий, волна, трещащие окна и зеркала, обрушение домов, на машину падает дом: «А после тьма и тишина. Словно умер я и лежу в могиле.» Причина удара в тексте не объяснена. Вселенная в этом окне не названа, атрибуция проставлена по дате объявления. Миколай на пролог отвечает выбором: «мне второй больше нравится, поэтому предлагаю продолжить первый» (323661).</p>\n<p>Отдельно фиксируется: этот ядерный инцидент появляется 2025-05-04, почти месяц спустя после того, как Слава сказал «Апокалипсиса и вируса нету» (2025-04-08, id 317430). Как это соотносится с отменой апокалипсиса, в переписке не сказано — дословных объявлений после 2025-04-08 в файле нет.</p>\n<p><strong>Названные места</strong> внутри одного современного мира: Нимб (организация), НБО (её часть), безымянная фармацевтическая компания из истории про лесорубов, заброшенный корабль, гора с пещерами в тайге (место действия истории про лесорубов), плюс инцидент — не место, а событие.</p>\n<p><strong>Поздний слой (2026).</strong> Версии 6 и 7 записи «Нимб» (2026-06-02, окно w0120, id 487001–487006; 2026-06-07, окно w0121, id 488439–488440) помечены в базе как «вселенная: неясно (по дате объявления)» и описывают другой каркас, где Нимб — одна из сил, а не рамка: «Вселенная. Современные мир, где есть злодей и герой. Ну и нимб и секта» (487001). В переписке переход от Нимба 2025 года к этому Нимбу не проговорён; занесены они в один файл потому, что организация называется так же. Единственная описанная там механика межмирового перехода (2026-06-07, id 488439): Доима, «Схватив одного фантазера, что был на грани провалиться в свой мир… использовав артефакт. Открыла путь из мира фантазера в наш. И открыла она его в центре города»; из дыры лезли существа, «некоторый из этих существ были очень сильными, и их также была десятки тысячи», фантазёр при этом — «ключ, что держит дыру открытой». Цель: «Суть этого эксперимента была, можно ли объединить миры. Хотя он и не удался, доима осталась довольной результатом.»</p>", "r": [["Нимб", "MR-0132.html"], ["Отделы Нимба", "MR-0133.html"], ["Фармацевтическая компания", "MR-0135.html"], ["Инцидент (ядерный удар)", "MR-0136.html"]]}, {"t": "Организации и сообщества", "a": ["S03", "VS-0006-S03", "VS-0006--organizacii-i-soobschestva"], "h": "<h3>Нимб</h3>\n<p>Главная организация вселенной и одновременно её каркас. Первое развёрнутое описание — 2025-04-08, id 317240–317258, окно w0087, дословно по пунктам:</p>\n<ul>\n<li>«Организация нимб» (317240)</li>\n<li>«Официально появилась в 2003 году 11 июня» (317241)</li>\n<li>«Это фармацевтическая компания» (317242)</li>\n<li>«У ней есть свои фармацевтический заводы, фабрики, А также больницы и аптеки, ветеринарный клиники» (317243)</li>\n<li>«Известно своими качественными товарами и услугами» (317244)</li>\n<li>«Способны излечить даже рак» (317245)</li>\n<li>«Или отрастить конечность» (317246)</li>\n<li>«Что бы полечиться в нимбе к нам ездять даже иностранцы» (317247) — «к нам» сказано от лица организации или страны; в переписке это не поясняется</li>\n<li>«И у них также контракт с армии» (317248)</li>\n<li>«Хотя формально они правительства организация, но на деле они свободная организация» (317249)</li>\n<li>«А теперь же к сладкому» (317250) — переход ко второй, скрытой части</li>\n<li>«Они типа сцп» (317251)</li>\n<li>«Ловят разный объекты виде чернышей и медузы» (317252)</li>\n<li>«И на основе их ней крови или чего-нибудь другого создають разный препараты» (317253)</li>\n<li>«А также проводят эксперименты над людьми» (317254)</li>\n<li>«Чаще всего над преступниками» (317255)</li>\n<li>«Но бывает и над сиротами» (317256)</li>\n<li>отделы (317257)</li>\n<li>«Грубо говоря это организация сцп только измененая под мои рамки» (317258)</li>\n</ul>\n<p>Мотив производства назван прямо (2025-04-08, id 317496–317507): «именно для препаратов», «Для получение денег», «Им не хватает денег налогоплательщиков», «У них есть контракт с армии после того как их ней препараты начали показываться хороший результаты», «Контракт на создания препаратов который могут усилить (типо супер солдат)».</p>\n<p>Дата основания — 11 июня 2003 года. То же число, 11 июня, стоит в брошенной истории про корабль как дата сбора («Да 11 июня в полночь. Я был у заброшенного корабля», 2025-04-21, id 320983). Соавторы этого совпадения не обсуждают.</p>\n<h3>Отделы Нимба</h3>\n<p>Одна запись, один источник (2025-04-08, id 317257–317258). Дословно:</p>\n<div class=\"q\"><p>«У них есть три основных отдела<br>Силовики( ну здесь всё ясно)<br>Бухгалтерии<br>Исследования</p>\n<p>Ещё есть отдал Этики, который часто ругается с отделом силовиков и исследования»</p></div>\n<p>Три основных отдела — силовики, бухгалтерия, исследования. Четвёртый, отдел этики, назван отдельно и в число «основных» не входит; единственное его описанное свойство — конфликт с силовиками и исследованиями. Ни численности, ни руководителей отделов, ни того, кто кому подчиняется, в переписке нет. Чем занят отдел бухгалтерии сверх названия и какие функции у силовиков сверх реплики «ну здесь всё ясно» — не сказано.</p>\n<h3>НБО</h3>\n<p>Рабочее сокращение, введённое Миколаем 2025-04-08 (id 317467–317471) и принятое Славой: «нимб банк объектов» — та часть организации, что ловит и хранит объекты. Нимб при этом остаётся шире: «ну типа нимб это пошире будет» (317472), «там же они как больничка и другое» (317474). Как Нимб и НБО соотносятся в правовом или организационном смысле (одно юрлицо, отдел, дочерняя структура) — не обсуждалось. Дальше в переписке сокращение не используется.</p>\n<h3>Руководство Нимба</h3>\n<p>На вопрос Миколая «в плане злодей кто» (317511) Слава называет двоих: «Демон и масочник» (2025-04-08, id 317515). Миколай уточняет: «это челы другого мира или директора нимба или всё вместе?» (317516). Ответ — «И то и другой» (317517). То есть оба одновременно и из другого мира, и из руководства Нимба. Как именно устроена эта двойственность — не расписано. Ни одна должность и ни одно имя директора больше не названы; слово «директора» звучит только в вопросе Миколая.</p>\n<h3>Нимб внутри прозы: письма про корабль</h3>\n<p>Единственная сцена с участием организации в текстах вселенной — вторая брошенная история (2025-04-21, id 320984, окно w0088). Персонажи выясняют, откуда узнали о корабле. Игорь: «я как бы письмо получил. Там в этом письме об этом месте и говорилось». Ника: «да какая разница, что в письме было написано. Главная от кого пришло письмо». Игорь: «от организации \"нимб\"?». Ника: «ДА. Одна из крупнейших организаций всего мира написала нам о корабль. Разве это не странно».</p>\n<p>Дальше прямой спор о вине. Игорь: «ты хочешь сказать, что организация \" Нимб\" Во всём этом виновата?». Ника: «я не говорила, что она виновата. Я лишь сказала, что письмо от них. А это что-то да и значит». Вопрос в тексте открыт, история оборвана, в обсуждении вопрос не решается.</p>\n<h3>Безымянная фармацевтическая компания</h3>\n<p>Вторая организация вселенной, появляется в эпилоге истории Ивана Васильевича (2025-05-02, id 323370, окно w0089). Названия у неё нет.</p>\n<div class=\"q\"><p>«После мы позвонили полиции. И сказали всё как есть. Они это за всерьёз не восприняли сначала. Но после нам перезвонили. Нет не полицая, а фармацевтическая компания. После они даже к нам ко всем. Лично приехали и взяли показание. А после попросили подписать бумажке о неразглашении. Конечно же с моральными выплатами, как мои 6 зарплат. А после уехали. Похороны Тохи они также оплатили. И оплатили медицинский расходы. Но при этом сами не предоставили свои препараты. Я то знаю. Да нет всё знают, что их ней препараты могут и конечность отрастить. Но они решили не тратить на нас это. Поэтому мне и ампутировали руку. Если бы они помогли то всё было бы иначе.»</p></div>\n<p>Финал абзаца — страх подписавшего: «Хотя это всё равно не посмертной письмо. Вряд ли из-за этого они решат меня убить. Надеюсь».</p>\n<p>Роль компании автор определил позже, отвечая на прямой вопрос Миколая (2025-05-15, id 326310–326314): на «Какова роль фарм-корпорации? Это эксперименты, биологическое оружие или они „пылесосят аномалии“?» ответ Славы — «Биологическая оружия». Тем же списком закрыты остальные вопросы: цель истории — «Напугать»; судьба Ивана — «На свободе но параноит»; показывать ли существо целиком — «Чем меньше».</p>\n<p>Связь этой компании с организацией «Нимб» в переписке не заявлена; в базе это отмечено отдельной пометкой. Совпадают признаки — препараты, отращивающие конечности, и повадка приезжать вместо полиции, — но соавторы этого не проговаривают.</p>\n<h3>Бригада лесорубов</h3>\n<p>Единственный поимённо расписанный коллектив вселенной (2025-05-02, id 323364–323370, окно w0089; 2025-05-07, id 324211–324215, окно w0094).</p>\n<ul>\n<li>«Наш-то в бригаде было 8 человек» (323364). Работа законная: «И не подумайте, всё законное. Мы не какие-то там браконьеры или вроде того. Свою матушку Россию со всеми еë недостатками, я всё равно люблю».</li>\n<li>Место — тайга, участок рядом с горой, «а в это горе было много пещер. Природный пещеры вроде как». Время — «Как-то осенью… где то в октябре».</li>\n<li>Быт: лагерь с палаткой, машина, аптечка, дежурные, которые уходят готовить, один фонарик из машины с садящимися батарейками; позже — две законные двустволки, «по одному ружью на каждую дежурную группу у пещеры и в лагере для охраны раненых», дежурство по часу.</li>\n<li>Внутренние отношения (окно w0094): Миша и Игорь отказываются дежурить поодиночке; Тоха дежурит с Иваном; Иван молчит о случившемся, потому что «не любитель показывать слабость»; бригадир слушает скептически, предполагает «зверька какого-то» или лису, а версию Игоря про человека сводит к «Может пранкер какой».</li>\n<li>Потери: погибает один — Тоха. Раненые: вспоротая нога, вылетевший сустав, сломанная ключица, у Ивана ампутирована рука.</li>\n<li>Трое из восьми поимённо не названы.</li>\n</ul>\n<h3>Правительство</h3>\n<p>Отдельной записи нет, государство упоминается только в связке с Нимбом: «Хотя формально они правительства организация, но на деле они свободная организация» (2025-04-08, id 317249). Как устроена эта двойственность, как устроено само правительство, как оно называется — не сказано.</p>\n<h3>Организации позднего слоя (2026, вселенная не объявлена)</h3>\n<p>В окнах w0120–w0121 под тем же именем Нимб действует организация экспериментов, и рядом с ней названы другие структуры. Связь этого слоя с Нимбом 2025 года в переписке не проговорена.</p>\n<ul>\n<li><strong>Нимб</strong> (2026-06-02, id 487001): «Есть нимб что проводит эксперимент, у них в этих экспериментах нет одной цели, у них их дохрена. По типу создать искусственного сверхчеловека, создать лекарство на крови сверхчеловека и т.д. ну у них есть маленький изъян их эксперимент не этичный ( и это мягко сказано) сотни тысяч людей умирают пробуя их лекарство. В экспериментах умирает ещё сотня и так далее». Первый искусственный сверхчеловек — Нуар. Реакция: «после этого правительства решил расскрыть какой нимб плохое. Но общество узнав что им удалось создать первого искусственного сверхчеловека, начало наоборот продвигать эту идею, и другие организации тоже начали пытаться создать искусственного сверхчеловека»; «Правительство не могло разрешить проведение подобных экспериментов. А если бы разрешили. То сверхлюди конечно пошли против и это ни чем хорошим не кончилась». Второй удавшийся проект — «Проект апостолов. 12 созданных ИС. Но его уже на публику не раскрывали». Единственная названная кадровая черта — нехватка кадров (488439).</li>\n<li><strong>Ассоциация</strong> (id 487001): «Короче есть ассоциация которая контролирует и помогает героем». На её стороне 6 столпов — шесть сильнейших героев, «В ней входит граф и нуар, ну ещё челики который я потом расскажу» (487002). Палач — «Цепной пёс ассоциации. Ну точнее ассоциации так думает… убийцу, что убивает тиха всех неугодных ассоциации. И он не герой, ну не числиться» (487176). Лицо ассоциации выбирается голосованием, им становится Праведник (2026-06-03, id 487514).</li>\n<li><strong>Организация злодеев</strong> (id 487003, 487032–487036): шесть столпов, «так сказать разрушение», состав не придуман, кроме безумной девки и старика со способностью гравитации. На вопрос «злодеи это правительство?» — «Пока что нет»; «Просто сверхлюди который нарушает закон. Ну и они создали свою организацию для противовеса Ассоциации».</li>\n<li><strong>Культ четырёх епископов</strong> (id 487001): «Культ всё ясно. Просто ебланы который верит во что-то ( у меня всегда с верующими проблема, я никогда ничего нормального придумать не могу) ну 4 епископа». В сводном раскладе те же четверо названы архиепископами. Дальше не развит.</li>\n<li><strong>Секта Фалим</strong> (2026-06-03, id 487531): Фатик «является главой секты, которой покланяется ей как богини в человеческом виде. ( давай назовём данную секту Фалим)»; «кстати в этой сети как раз таки состоит инквизитор с чистой Оам».</li>\n<li><strong>Инквизиторы</strong> — отряды, охотящиеся на сверхлюдей; одна сцена (2026-06-09, id 488828), где отряд атакует истощённого Нуара и уничтожается целиком. Часть ли отряд секты Фалим или отдельная структура — не сказано.</li>\n<li><strong>Организация Доимы</strong> (2026-06-07, id 488439): «У неё своя организация ( это конечно громко сказано, там просто несколько сл и ис), о которой нимба неизвестно». Доима при этом штатная сотрудница Нимба.</li>\n</ul>\n<p>Сводный счёт сил автора (2026-06-02, id 487005): «6 героев, 6 злодеев, 4 ахрепископа, 12 апостолов, ну и кто-нибудь из Нимба». Кто такой «кто-нибудь из Нимба» — не назван.</p>\n<h3>Одноимённая «Организация нимб» во вселенной «Апостол»</h3>\n<p>Отдельная запись под тем же именем, две версии. 2025-05-14 (окно w0094, id 325805–325808) она появляется как пункт правок к реестру: «Добавления организация нимб и фантазеров И перераспределение сил»; что это за организация, в окне не сказано, и в какой раздел реестра её вписывать — тоже. 2025-09-12 (окно w0104, id 364761–364764), в окне, открывающемся репликой «Новая вселенная более простая», её природа меняется: «Организация Нимб более не фармавечическая компания это религиозная церковь» (364762), после чего разговор уходит к благословенным и одержимым. Разведены ли эта организация и Нимб-фармкомпания из вселенной «Нимб» — в переписке нигде не сказано.</p>\n<h3>Отношения организаций между собой — только названное</h3>\n<ul>\n<li><strong>Нимб — государство</strong>: «формально они правительства организация, но на деле они свободная организация» (317249).</li>\n<li><strong>Нимб — армия</strong>: контракт на препараты, «который могут усилить (типо супер солдат)» (317505, 317507).</li>\n<li><strong>Нимб — объекты</strong>: ловит, исследует, делает из их биологических жидкостей препараты (317252–317253, 317479–317490).</li>\n<li><strong>Внутри Нимба</strong>: отдел этики «часто ругается с отделом силовиков и исследования» (317257) — единственный описанный внутренний конфликт.</li>\n<li><strong>Нимб — Демон и Масочник</strong>: «И то и другой» (317517).</li>\n<li><strong>Нимб — участники истории про корабль</strong>: разослал письма; вина не подтверждена и не опровергнута (320984).</li>\n<li><strong>Бригада лесорубов — безымянная фармкомпания</strong>: компания перезванивает вместо полиции, берёт показания, даёт подписку о неразглашении, платит компенсации, оплачивает похороны и медрасходы, препараты не тратит (323370).</li>\n<li><strong>Нимб — безымянная фармкомпания</strong>: связь не заявлена.</li>\n</ul>\n<div class=\"mnote\"><b>⚙ машинная заметка · Что не сформулировано по вашей же логике — не материал авторов</b>\n<p>Для объектов производственная цепочка названа целиком: поймали → биологические жидкости → препарат → деньги и армейский контракт (317252–317253, 317479–317507). Для второго источника того же рода — опытов над людьми — названо только, что они идут и над кем («чаще всего над преступниками», «бывает и над сиротами», 317255–317256). Что из этих опытов выходит, куда это идёт и зачем организации это при уже работающих объектах — не сказано ни разу, при том что для объектов на тот же вопрос ответ дан в том же окне, через десять сообщений.</p></div>", "r": []}, {"t": "Население и классы", "a": ["S04", "VS-0006-S04", "VS-0006--naselenie-i-klassy"], "h": "<p>Классы этой вселенной в единую систему не сведены: часть населения идёт от организации (сотрудники, отделы, подопытные), часть — от аномальных объектов, часть — из отдельных историй Славы, которые к организации прямо не привязаны. Общего разговора «как устроено население» соавторы не вели; обещанное «Также раскажу про разделения сил в вселенной» (2025-04-22, id 321109) в окне больше не звучит.</p>\n<h3>Аномальные объекты</h3>\n<p>Класс назван перечислением, не определением. Полный список из переписки — одно сообщение: «Медуза, черныши, серафим,..» (2025-04-08, id 317440), многоточие авторское, список открытый. Общие свойства класса: их ловит Нимб (та его часть, что названа НБО), из их биологических жидкостей делают препараты, происхождение автором не придумано — «Я даже не придумал откуда они берутся?» (317481).</p>\n<p><strong>Медуза</strong> (2025-04-08, 3 версии). В базе проходит как персонаж, по сути — объект или класс объектов (вариант имени во множественном числе — «медузы»). Известно ровно одно свойство: «медуза находиться вне пространства этого мира» (317530), уточнённое в 317536 (см. раздел «Масштаб»). Сырьё для препаратов у неё — не кровь: на вопрос Миколая Слава отвечает «Нет крови» (317488), «Биологический жидкости» (317490). Внешности, размера, поведения, опасности в переписке нет.</p>\n<p><strong>Черныши</strong> (2025-04-08, 2 версии). Самая маленькая запись во вселенной. Сказано только, что их ловят наравне с медузами (317252), что из их крови или иного сырья делают препараты (317253) и что они второй раз названы в списке объектов (317440). Ни вида, ни числа, ни поведения, ни объяснения названия.</p>\n<p><strong>Серафим</strong> назван третьим в той же строке (317440) и внутри материала Нимба больше не разворачивается; отдельной сущности с таким именем в составе вселенной нет. Развёрнутый набор его сил лежит в другой вселенной («Апостол», 2025-01-28, id 285333): ангел, состоящий из крыльев и с закрытыми глазами; контроль времени (замедление или остановка, «а ещё пресказывать будущий иногда»); свет (световое оружие, шары, ослепление, перемещение со скоростью, приближенной к световой); святой огонь, который исцеляет его и жжёт противников; манипуляция сознанием — «открыв один из глаз своих он составить жертву утонуть в собственных воспоминаниях»; телекинез, «контроль над всеми объектами». К вселенной «Нимб» этот набор в переписке не привязан — только имя в списке объектов.</p>\n<h3>Люди-подопытные</h3>\n<p>«А также проводят эксперименты над людьми» (317254), «Чаще всего над преступниками» (317255), «Но бывает и над сиротами» (317256), повтор в 317447. Что именно даёт человеку такой опыт, в окне объявления не сказано.</p>\n<h3>Усиленные препаратом</h3>\n<p>По армейскому контракту делаются препараты, «который могут усилить (типо супер солдат)» (317507). Ни цены, ни побочных эффектов, ни срока действия не названо.</p>\n<h3>Сверхлюди и грешники</h3>\n<p>Термин приходит из описания Демона (2023-03-27, id 37532), где вселенная ещё не была названа: он «Убивает в прямом эфире сверхлюдей который делали грехи на подобие безмысленного убийство или каких ещё грехов». Отсюда два разряда: сверхлюди и внутри них грешники. Управляемость грешника задана авторской формулой: «тем грешней человек тем лучше контролирует он их» (37532). Больше про сверхлюдей как класс в отрезке «Нимба» не сказано ничего — ни откуда они, ни сколько их, ни как соотносятся с объектами и препаратами.</p>\n<p>Отдельно объявлены <strong>напарники Демона</strong>: «Ему же все равно нужны напарники» (37557), «У него будет напарники» (37558), «Он же один не будет» (37559), «Ну и вот у него будет напарник с такой способностю» (37562). Поимённо не названы.</p>\n<h3>Твари из пещеры</h3>\n<p>Единственный класс существ во вселенной, описанный подробно, — и описан изнутри истории Ивана Васильевича, а не как справка автора (2025-05-02, id 323369–323370; повтор во фрагменте 18, 2025-05-07, id 324215).</p>\n<div class=\"q\"><p>«Это было четырех ногая ходячая тварь. Больше всего она смахивала на большую чёрную худую собаку. Но имеет некоторый странности. Это тело и лапы чём-то походили на человеческий. Не спрашивайте чем. Я сам не знаю. Я как то на по сознательном уровней понял сходство. Но было у неё ещё одна странность. Еë голова. Не как у собаки морда вытянутая. Но дальше со лба да самого носа лезвия, как бы вам это сказать. Представьте топор и эту острую часть сняли с топора и нацепили на морду собаки. Только у неё это видимо родной.»</p></div>\n<p>Физиология и уязвимость: крови нет — «Да и крови не пошла. Что-то только черная, как смола течь начала»; выстрел в упор в голову не убивает — «Попал ему точно в его худую, чёрную бошку. Но эффекта, как фильмах виде взрыва головы не было. Лишь слегка разлетелась та жижа в нём и все»; лбом рубит деревья — «Тварь это своим лбом буквально рубит деревья, как почти что мы. Только сильнее быстрее и вертикально»; умна настолько, чтобы обойти машину и залезть на капот и крышу; слабое место найдено Игорем — «он как-то извернулся и подломил еë коленки. Оказывается без разгона она не столь страшна. И если держать его голову на виду то справиться с ним будет достаточно легко»; живучесть — «били его до изнеможении. Когда от неё осталось лишь мокрая места. Оно как то было ещё живо. Как?. Это же нереально. Мы же переломали ей всё кости»; предсмертный крик — «издала крик настолько сильный, что мы всё по закрывали уши и на землю попадали». Голос описан формулой, которую рассказчик повторяет: «Тот самый, рев, который и не рев вообще» (324214).</p>\n<p>Что делает из твари класс: «Пока со стороны горы не услышали рёв. Не один их было множество. Десятки если не сотни тварей там кричала» (323370).</p>\n<p>Правило, которое бригада считала правилом и которое оказалось ложным (324215): «Тогда не думали, что тварь то та вылезет из пещеры. Подумали, что не может она покинуть пещеру». Она вышла и ударила Тоху в спину уже в лагере.</p>\n<p>Природа и происхождение тварей не объяснены, и автор раскрывать их не собирается: на вопрос «Планируете ли показать внешность существа целиком или оставить \"чем меньше знаем, тем страшнее\"?» ответ — «Чем меньше» (2025-05-15, id 326314).</p>\n<h3>Обитатели корабля</h3>\n<p>Второй класс существ, из второй брошенной истории (2025-04-21, id 320984–320988). Известно два появления, и одно это существо или разные — не сказано.</p>\n<p>Первое — лапа за углом (320984): «Едва показалось рука?. Нееет лапа зверя. Медведь? Не знаю. Но мне и лапы хватало, чтобы понять, что нужно бежать.» Размер: «даже она была по размеру, как моя голова». Рассказчик рассматривает спутников как отвлекающий манёвр: «Пока медведь будет их есть. Я смогу быстро свалить».</p>\n<p>Второе — чёрный гуманоид (320987): «Что-то двигалось во тьме, как бы сюрреалтстичной это не звучало бы. Но во тьме двигалось тьма. Как бы это сказать в обычной тьме помещения передвигался гуманоид, который был ещё черней чем тьма вокруг.» Хватает Нику «своей когтистой лапой» за ногу и тащит; Игоря и Пашу к этому моменту уже унесло. «Хоть он был и тощим. Но спина выглядела сильной». Убивается ножом между лопаток, после смерти «Тело его стало мягким и податливым».</p>\n<p>Кроме них на корабле — выпотрошенные тела без кожи в коридорах и тени, которые «начали кидаться под ноги».</p>\n<h3>Люди на корабле — сословия названы прямо</h3>\n<p>Единственное место, где вселенная описана через социальные слои, и сделано это одной фразой (2025-04-21, id 320983):</p>\n<div class=\"q\"><p>«Там уже было кучка людей. И все это разный люди. Студентка, клерк, старик, красотка, бандит, бизнесмен и так далее. Все это были разный люди, из разных слоев. Хм миров. Все они собрались здесь, чтобы исполнить своё самое заведное желание.»</p></div>\n<p>Дальше эти типы работают признаками персонажей: студентка — Ника, «одетая в джинсы и в рубашку. Волосы у ниё покрашены, желто-розовый или как то так»; клерк — Игорь, «высокий мужчина в очках, одетый в пиджак. Не смотря на длинный рост был худым»; школьник — Паша, «третий самый низкий среди них был пацан. Вообще школьник кажись»; отдельно на берегу — «Здоровый мужчина. Явно зэк». Объединяет их то, что всем пришло письмо от организации «Нимб», все собрались 11 июня к полуночи, все хотят исполнить желание и все допускают, что желание исполнят только одно — отсюда толчки в спину на трапе.</p>\n<h3>Обычные люди: рассказчики и выжившие</h3>\n<p>Отдельным классом это не названо, но большая часть населённости вселенной — обычные современные люди.</p>\n<ul>\n<li><strong>Иван Васильевич</strong> — рассказчик истории про лесорубов, «мужик уже за тридцать, который пол жизни отдал работе лесоруба», главным своим качеством считает хладнокровие: «я всегда выбирался из этих бед благодаря моему самому главному, как по мне качеству хладнокровию». В финале — с ампутированной рукой.</li>\n<li><strong>Бригадир</strong> — мужик около пятидесяти: «бригадир всегда был таким человеком, который хочет потушить угли нежели потом тушить пожар. Хороший мужик». Поход в пещеру поддержал так: «место здесь странная. Гнетущая какая-то… не только тебя подкосила оглянись все, как не в себе. Вот я и подумал может вам развёлся надо. Всё же лучше эту проблему сразу устранить. Нежели потом расхлебывать».</li>\n<li><strong>Игорь</strong> — «самый младший из нас», зачинщик похода: «а может давайте в пещеру сгоняем»; «Молодой шибко, залезть куда желает. Да и по выносливее нас будет».</li>\n<li><strong>Михаил (Мишка)</strong> — «был парням крепким и самым крупным в бригаде», не пролез в узкий вход без порванной кофты; «Миша вообще был парням винящий в первую очередь себя. Это вроде бы хорошо, но в некоторых ситуациях не является хорошей стороной». В бою — «Смелее чем кто либо в бригаде. Хладнокровен чем кто либо в бригаде», первым стреляет.</li>\n<li><strong>Тоха, он же Григорий</strong> — штатный навигатор бригады, идёт первым: «Первым не из гибкого желания, а от того что имеет удивительные особенности. Одно из них его географическая память, он может легко ориентироваться в новом городе или лесу». Первым замечает тварь и первым от неё гибнет — удар в спину.</li>\n<li><strong>Алексей</strong> — рассказчик пролога про апокалипсис (2025-05-04): до инцидента обычный офисный сотрудник, ни детей, ни девушки, в день удара ехал за подарком племяннице. <strong>Племяшка Алексея</strong> — девочка, у которой в этот день день рождения, тараторит как пулемёт, зовёт помочь маме с готовкой; её мать — сестра Алексея, вышедшая замуж и родившая в 20.</li>\n<li><strong>Максим, Андрей, Саша</strong> — компания из прологов про поход (2025-05-04, id 323655–323659; 2025-05-06, id 323930–323936). Максим здесь не сверхчеловек, а человек, про которого рассказывают: спёр медвежонка у медведицы, из-за чего убегали от неё по лесу; уговорил залезть в пещеру, откуда два дня не могли выйти; всю дорогу ловил лису, поймал и съел, «суп вышел вкусный»; дома у него живёт медведь. Реплики Андрея: «у Максима всё идеальное выходит» и в переписанном прологе — «Он же Максим, совершённый во всём». Саша называет себя атлетом и против участия Максима, потому что в прошлом походе стёр ноги до крови. Старые карточки Максима и Саши со способностями («власть», «деление») относятся к 2024-04-03 и к вселенной «игра бога», не к «Нимбу».</li>\n<li><strong>Артём</strong> — рассказчик обеих брошенных историй 2025-04-21. В первой — женатый человек, ждущий первенца-дочь, стабильно зарабатывающий; во второй — тот, кто идёт на корабль, толкает людей на трапе и в темноте убивает гуманоида ножом. Про себя внутри второй истории: «Я привык быть в чужих органах и крови. Это так навевает воспоминания. Мой шедевр, где-то там».</li>\n</ul>\n<p>Отдельный эпизод, оставшийся без объяснения (2025-05-02, id 323365–323366): однажды в лесу одному из бригады показалось, что там ребёнок; он побежал за ним, остальные за ним, ребёнка никто, кроме него, не увидел. Обвинить его во вранье не смогли: «Сколько лет работаем. Знаем что он мужик не любящий подобный юмор». Связь этого случая с тварями в переписке не проводится.</p>\n<h3>Классы позднего слоя (2026, вселенная не объявлена)</h3>\n<p><strong>Искусственные сверхлюди (ИС)</strong> — сокращение вводит сам Слава по ходу: «( я заебался писать. Поэтому ИС)». Первый удачный — Нуар, «владеет нескольками способностями… и он не стареет». До него (487006): «Ну большинство из них теряли рассудок или у них появлялись дефекты тела или они умирали. Превращались в жижу ну и т. Д. Нуар первый ИС кто сохранил разум и получил способности без каких либо дефектов».</p>\n<p><strong>Апостолы</strong> — 12 созданных ИС, проект на публику не раскрывали; «Ну и апостолы которые держут нейтралитет. Конечно не все» (487004).</p>\n<p><strong>Столпы</strong> — шесть сильнейших героев и шесть столпов злодеев. <strong>Культ</strong> — четыре епископа (в сводном раскладе архиепископа). <strong>Фантазёры</strong> — упомянуты как отдельный вид: Доима схватила «одного фантазера, что был на грани провалиться в свой мир» (488439).</p>\n<p><strong>Сотрудники Нимба как категория</strong> — там же (488439): Нимб захватил беременную от Имета женщину, «Им было интересно унаследует ли ребёнок апостола его способности»; мать умерла при родах, над ребёнком ставили опыты, «По итогу когда ей исполнилось восемь лет, ученный сдались и больше не тестировали её. Но и девочку нужно было куда-то девать. Возраст уже вышел и проводить над ней эксперименты бесполезно. Поэтому они просто решили взрастить сотрудника, у них и так нехватка кадрова была». Доима — единственный названный поимённо сотрудник Нимба во всём материале.</p>\n<p><strong>Реакция общества на ИС</strong> (487001) — единственное описанное социальное движение: правительство решило раскрыть, «какой нимб плохое», но общество, узнав про первого искусственного сверхчеловека, «начало наоборот продвигать эту идею».</p>\n<h3>Как классы соотносятся — только названное</h3>\n<ol>\n<li><strong>Нимб → объекты.</strong> Организация ловит аномальные объекты (черныши, медузы, серафим), хранит их (эта часть названа НБО) и исследует.</li>\n<li><strong>Объекты → препараты → люди.</strong> Из биологических жидкостей объектов делают препараты; они лечат рак и отращивают конечности, за ними едут иностранцы, по армейскому контракту делаются усиливающие — «типо супер солдат». Мотив — деньги: «Им не хватает денег налогоплательщиков».</li>\n<li><strong>Нимб → подопытные.</strong> Опыты над людьми, «Чаще всего над преступниками. Но бывает и над сиротами».</li>\n<li><strong>Внутри Нимба.</strong> Три основных отдела плюс отдел этики, который с двумя из трёх ругается.</li>\n<li><strong>Нимб → злодеи.</strong> Демон и Масочник — и «челы другого мира», и «директора нимба», «И то и другой».</li>\n<li><strong>Демон → грешники.</strong> Сверхлюди, совершившие грехи, — его добыча и объект первой способности; «тем грешней человек тем лучше контролирует он их».</li>\n<li><strong>Нимб → люди с корабля.</strong> Письма о корабле пришли от организации. Вопрос о её вине поставлен и не решён.</li>\n<li><strong>Твари из пещеры → бригада → фармацевтическая компания.</strong> Тварей в горе десятки или сотни; одна вышла и перебила часть бригады; следом приехала фармацевтическая компания, отобрала дело у полиции, купила молчание и препаратами не поделилась.</li>\n</ol>\n<p>Ни одного случая, когда классы из разных историй встречаются друг с другом, в переписке нет: твари из пещеры не пересекаются с объектами Нимба, обитатели корабля — с тварями, сверхлюди-грешники — с чернышами и медузами. Каждая история несёт свой набор населения, общая рамка — организация «Нимб» и слово «объекты».</p>", "r": []}, {"t": "Система способностей", "a": ["S05", "VS-0006-S05", "VS-0006--sistema-sposobnostey"], "h": "<p>Отдельного разговора «как в этом мире устроены силы вообще» соавторы не вели ни разу. Обещание было: «Также раскажу про разделения сил в вселенной» (2025-04-22, id 321109) — содержания не последовало.</p>\n<p>Каркас на момент объявления задан двумя источниками необычного: «Есть только нимб и объекты» (2025-04-08, id 317432). Объекты — авторские, не официальные SCP: «Мои» (317450), «Личные» (317452), «Хотя они могут быть похоже» (317453), «Ведь в сцп их там дохуя» (317454).</p>\n<h3>Препараты Нимба — промышленный путь получения силы</h3>\n<p>Технология названа 2025-04-08 двумя заходами. Утренний (id 317244–317249): препараты лечат рак, отращивают конечность, за лечением едут иностранцы, есть армейский контракт. Вечерний (id 317479–317507) — механика:</p>\n<ul>\n<li>«Че они просто исследует объекты и иногда исследование дают результаты и они создают препараты» (317479), «Исследует и получают результат» (317484);</li>\n<li>аналогия: Миколай — «типа как йод получают из яда змей?» (317480); раньше в тот же день сам Слава сказал так же: «Препараты создають на основе их ней крови Типо как у яд змей» (317306);</li>\n<li>сырьё уточняется в диалоге: «Нет крови» (317488), «Биологический жидкости» (317490);</li>\n<li>цель: «именно для препаратов» (317496), «Для получение денег» (317497), «Им не хватает денег налогоплательщиков» (317503);</li>\n<li>препараты не только лекарственные (317500);</li>\n<li>«У них есть контракт с армии после того как их ней препараты начали показываться хороший результаты» (317505), «Контракт на создания препаратов который могут усилить (типо супер солдат)» (317507).</li>\n</ul>\n<p>То есть путь такой: пойманный объект → его биологические жидкости → препарат → усиленный человек. Цены, побочных эффектов и срока действия препаратов в переписке не названо вовсе.</p>\n<p>Внутри прозы препараты появляются ещё раз — в эпилоге истории Ивана Васильевича (2025-05-02, id 323370), где компания не потратила их на пострадавших: «Да нет всё знают, что их ней препараты могут и конечность отрастить. Но они решили не тратить на нас это. Поэтому мне и ампутировали руку».</p>\n<h3>Свойства объектов</h3>\n<p>Единственный объект с прописанным свойством — медуза: «медуза находиться вне пространства этого мира» (317530), «Чисто формально, но тела его в нашем мире, но законы физике действуют на него по правилам пространства другого мира» (317536). Черныши не описаны. Серафим внутри Нимба назван только именем.</p>\n<p>Происхождение объектов не придумано: «К чему ты это. Я даже не придумал откуда они берутся?» (317481).</p>\n<h3>Опыты над людьми</h3>\n<p>Названы одной строкой (317254–317256, повтор 317447). Что именно они дают человеку, в окне объявления не сказано.</p>\n<h3>Чёрный ящик</h3>\n<p>Самая проработанная сущность вселенной по числу версий (14 версий, с 2024-11-17). К «Нимбу» относятся версии от 2025-04-18 (окно w0088).</p>\n<p>Определение (2025-04-18, id 320032–320036):</p>\n<div class=\"q\"><p>«Чёрный ящик устройства записывающий и сохраняющие знание, параметры и характеристики вселенной. Бытия. У чёрного ящик есть вход, через который он поглощает знания, параметры и характеристики. Также у него есть выход. То бишь отворяя чёрный ящик ты получаешь результат его обработки информации о чем либо».</p></div>\n<p>Область охвата: «Под вселенной подразумевается всё» (320034), «Буте то объект или субъект. Живой или не живой» (320036).</p>\n<p>Владелец и происхождение (id 320080–320098): у ящика есть владелец (320084); владелец не всегда человек — «Не всегда» (320092); «Да владелец меняется» (320096), «Это кочевной артефакт» (320097); «Ог появился вместе с большим взрывом и записывал информацию о нашей вселенной, а также сохранял их, чтобы возможно при уничтожение вселенной остался дубликат» (320098).</p>\n<p>Запрос — механика выдачи силы (id 320110–320135, вынесена в базе отдельной сущностью):</p>\n<ul>\n<li>«Ты даёшь запрос Чёрному ящику и он его выполняет по ситуации» (320110);</li>\n<li>примеры: проверка правды — «Типо говорит ли он правду» (320111); временное превращение — «Или мне нужно стать быстрее и чёрный ящик подберёт данный (характеристики или параметры) существ имеющию большую скорости и временно превратит тебя в его» (320112);</li>\n<li>сложность считается по типу вопроса, а не по формулировке: «Сложность вопроса зависит не от сложной формулировки а от типа вопроса, я хочу спасти вселенную это сложный запрос. Хоть формулировка лёгкая» (320114);</li>\n<li>цена: «Задавая запрос и зависимость от его сложности он будет поглощать \"выносливость? Или жизненную силу» (320115), затем «Я не знаю» (320116) и «Наверное жизненную силу» (320117).</li>\n</ul>\n<p>Миколай на это: «круто звучит» (320127), хотел додумать обмен (320128–320135), продолжения в окне нет. На прямой вопрос, имеет ли ящик отношение к истории (320142), Слава отвечает «не» — то есть к тогдашней прозе про Нимб ящик не привязан.</p>\n<p><strong>Ранняя редакция ящика</strong> (2024-11-17, окно w0064, вселенная там — «монстры») — другая механика под тем же названием. Первая формулировка (258912): «Новая способность Черный ящик ( выдает разный способности ) Является частичной передающий способностью». Миколай сразу: «рамки», «это ваще не понятно», «мало деталей», «даже на примера нет» (258917–258923). Развёрнуто (258924):</p>\n<div class=\"q\"><p>«Есть способность черный ящик И вот его владелец способен создавать разный черный орудий броню Или создать черный кубик разного размера ( без разницы) и открывая его, владельцу выдаётся способность типо управления огнем, молниями, супер скорость и т.п. То бишь как Омнитрикс ( из Бен 10) только он не изменяет форму владельца а просто даёт способность».</p></div>\n<p>Ограничения: одна способность за раз — «Одну» (258940); смена только после исчезновения текущей — «Ну сначала ждёт когда это способность исчезнет и потом снова открывает черный ящик» (258944); выпадение случайное (258943, 258946); срок — «Не знаю 10 минут +-» (258948); список нужен «хотя бы 20» (258953), при этом «Как отдавать очень много способностей одному персу душе больно» (258952). Встройка в систему энергии (258997): «Черный ящик это структура И черный ящик поверх свой структуры образует хранящую внутри него структуру В черном ящики может хранится фиг знает сколько структур». Тупик назван автором прямо: «Проблема в том что я не могу реализовать способности пришельцев Бен 10 в черный ящик» (259107), «Раз соединять не хочу а вместе они не катят» (259111), «Потому что Омнитрикс=черный ящик» (259114). Миколай развёл понятия: Омнитрикс — часы выбора пришельца, чёрный ящик — «шкатулька со способностями», «но не выбор», «а рандом» (259117–259121).</p>\n<p>Что одна редакция заменила другую, авторы нигде не проговаривают.</p>\n<h3>Силы без названного источника</h3>\n<p><strong>Географическая память Тохи</strong> (2025-05-02, id 323365–323367), внутри истории Ивана Васильевича: Тоха шёл первым «не из гибкого желания, а от того что имеет удивительные особенности. Одно из них его географическая память, он может легко ориентироваться в новом городе или лесу». Применения: бригада заплуталась в лесу, гоняясь за ребёнком, — «Как Тоха живо нас всех сориентировал. И мы обратно выбрались ещё более коротким маршрутом»; бегство из пещеры — «Благо Тоха протолкнуться вперёд всех и начал координировать наш в бег. Если бы не он разбежались бы мы по этой пещере и забывая как звали». Источник особенности и её природа не названы; сказано «одно из них», остальные особенности не раскрыты.</p>\n<p><strong>«Холод»</strong> (2025-04-21, id 320985–320988) — нечто с корабля, названное автором в кавычках и с большой буквы, действующее как субъект. Ход атаки (320986): «Тоска этого место залазила мне словно в грудь. Захватывая моей сердце. Окутывая и делая дыхания прерывистом»; рассказчик ложится в позе эмбриона, «чтобы тот холод в сердце не распространялся дальше. Но он распространялся заполоная лёгкий»; «Этот холод спускался всё ниже. Касаясь уже не сердце, а как будто бы самой моей естество». Провал атаки (320987): «Ведь \" Холод\" Не знал какой же я. Не знал мою извращенную натуру. Не знал, что я не сожалею. Он думал, что найдёт уязвимость. Но сам же утонул в безумий красок, волн, взрывов. Там был фестиваль, всё взрывалось. Было цветной море. Холоду здесь было не месту». Отдельная это сущность корабля или образ внутреннего состояния рассказчика — не разъяснено.</p>\n<h3>Способности Демона</h3>\n<p>Единственный персонаж вселенной с проработанным набором способностей; набирался он 2023-03-27 в окне w0011 (id 37529–37598), когда вселенная не была определена, и к «Нимбу» отнесён версией от 2025-04-08.</p>\n<p>Исходное описание (37532): «17 летние нормального телосложения ходит в белой маски где нарисовано улыбка черный плащ Убивает в прямом эфире сверхлюдей который делали грехи на подобие безмысленного убийство или каких ещё грехов у него должно быть 6 способности первая способности контроли грешнико( тем грешней человек тем лучше контролирует он их )». Чаще всего пользуется пистолетом (37534). Почему шесть: «Потому что его кличка демон» (37543), «И надо было дать изюминку» (37544).</p>\n<p>Авторская сводка набранных способностей (37573–37580):</p>\n<ol>\n<li><strong>Контроль грешников</strong> — «тем грешней человек тем лучше контролирует он их». Единственное в материале правило, где сила зависит от свойства цели, а не носителя; формулировка повторяется во всех последующих перечнях, включая пересказ 2024-07-10 (202912).</li>\n<li><strong>Ускорение</strong> — «он может ускорять себя и другие неудушевленый предметы» (37573). Пришло из предложения Миколая «инерционная телепатия, чтобы патроны жёстко ускорять» (37569); заняло вторую позицию, вытеснив контроль интернета.</li>\n<li><strong>Контроль тела</strong> — «он может как либо изменять тела и регенерировать» (37577).</li>\n<li><strong>Душа грешника</strong> — «хватая противника за голову и за 3 минуты создаёт в его голове мир где он проживает разный или одну жизнь» (37580).</li>\n</ol>\n<p>Пятая и шестая не доведены: «Ну вот осталось ещё 2» (37581), дальше разговор ушёл в сторону; в следующем окне тема не всплывает.</p>\n<p>Предложенное и не вошедшее в набор (2023-03-27): короткая невидимость на время ухода от полиции (37535); лечение и приведение в сознание — Миколай предлагал их как усиление жестокости («Он грешника избивает до потери сознания, приводит в сознание и дальше», 37556; «Или крови грешник много потерял, он его лечит и снова», 37560), Слава отказал — «Ну нет» (37555) — и отдал их напарникам, а Демону оставил боевую: «Ему нужна боевая способность» (37564); телекинез для переноса камеры прямого эфира и камера на лбу (37539–37541); контроль радиоволн, «чтобы его видео транслировались на всех каналах в мире» (37542), переоформленный Славой в «контроль интернета» (37547) и вытесненный ускорением; телепатия (37565); управление мышцами — «Глупо» (37568); клон грешника — «Способность создать клон грешника, который будет сражаться с грешником, отвлекать его» (37582); отнятие способности при убийстве (37585). Последние две отклонены одинаково: «Может другую», «Может другую» (37595–37596). Отдельно 2023-05-20 (41339–41341) Миколай прогнал задачу через нейросеть и принёс пять вариантов — движение со скоростью света, энергетические взрывы, чтение мыслей, шоковая волна, фотогенез; в набор не вошло ничего.</p>\n<h3>Предложено и отклонено</h3>\n<ul>\n<li><strong>Ранжирование способностей</strong> (2024-11-17, id 258926–258937). Миколай: «список способностей ограничен?», «они ранжированы?», «тобиж уникальные, редкие обычные эпичные». Слава: «Нет, каждая способность по своему полезная в разных ситуациях» (258932). Миколай возражает, что ранг определяет не полезность, «а определяет скорее шанс выпадения» (258934) — ответ «Нет» / «Нету» (258935–258936). Повтор предложения через двадцать минут — «поэтому систему ранжирования можно сделать» (259016) — остался без ответа.</li>\n<li><strong>Разные кубики под разные способности</strong> (2024-11-17, id 259060–259072). Миколай предложил разбить набор на отдельные кубики: «один реген», «другой управление огр», «еще сила», «и ещё передвижение в земле». Слава: «Нет типо разделять способности который изначально были вмести как глупо» (259067) и «Да и плюсом все по отдельности они какие то слабый» (259069). Миколай: «нет, всё вместе это чит» (259068), потом соглашается — «да», «слабые», «но полезные» (259070–259072).</li>\n<li><strong>Слабость молния + вода</strong> (2024-11-17, id 259045–259055). Из случая, где персонажа водой смыло в трансформатор («вода проводник а он весь был воде и по сути он получил урон со всех сторон»), Миколай предложил правило: «типа такое сочетание дебафит или отключает способность или пользователя», «молния + вода». Слава отложил: «Ну это потом» (259052). К механике не возвращались.</li>\n<li><strong>Кровь из разных металлов</strong> (2025-04-08, id 317475–317483). Миколай: «то что она у разных существ из разных металлов в разработке не поможет...», «например к древних не железо преобладало, а медь», «поэтому она была синяя», «можно придумать существ опираясь на удивительные свойства крови» (317483). Слава идею не подхватил; Миколай сам констатирует: «короче, на кровь тебе похуй я так понял» (317475).</li>\n<li><strong>Стихийный набор для списка способностей</strong> (2024-11-17, id 258954–258964): «стихийные мы даём ему?», «6», «или тьма и свет не входят?», «ок тогда 4 есть», «полёт это ветер или другое?» — Слава: «Не знаю» (258962). Список из двадцати способностей так и не составлен.</li>\n</ul>\n<h3>Ограничения и цена — сводка</h3>\n<ul>\n<li><strong>чёрный ящик</strong>: плата за запрос — «выносливость? Или жизненную силу», склонение в пользу жизненной силы (320115–320117); размер платы зависит от сложности запроса, а сложность считается по типу вопроса, не по формулировке;</li>\n<li><strong>ранний чёрный ящик</strong> (2024-11-17): одна способность за раз, срок около 10 минут, следующую нельзя достать до исчезновения текущей, выпадение случайное;</li>\n<li><strong>контроль грешников</strong>: «тем грешней человек тем лучше контролирует он их»;</li>\n<li><strong>препараты Нимба</strong>: цена и побочные эффекты не названы;</li>\n<li><strong>географическая память Тохи</strong>, <strong>«Холод»</strong>: ограничений и цены нет.</li>\n</ul>\n<p>Ранжирования способностей во вселенной нет — предложение отклонено. Единственная система разрядов («6 героев, 6 злодеев, 4 ахрепископа, 12 апостолов, ну и кто-нибудь из Нимба», 2026-06-02, id 487005) и общее ограничение всех носителей — <strong>плёнка</strong> (2026-06-02, id 487170: «У сверхлюдей есть как бы плёнка что защищает от воздействия других способности. Чем сильнее сверхчеловек тем больше плёнка»; уточнение 487174: «Плёнка есть у всех и развивается она с возрастом. То есть с психическом росте. Ну это у обычных людей. У сверхлюдей способные её чувствовать. И поэтому они прокачивають её с помощью тренировок, а не психического роста») — лежат в окнах июня 2026, где вселенная не объявлена.</p>\n<p>Отдельный общий запрет, произнесённый при разборе Серафима и относящийся к вселенной «Апостол» (2025-01-28, id 285338): «Роботов нету в этой вселенной».</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "VS-0006-S06", "VS-0006--probely"], "h": "<div class=\"gaps\"><p><strong>Прямо помечено авторами как непридуманное</strong></p>\n<ul>\n<li>Откуда берутся объекты: «Я даже не придумал откуда они берутся?» (2025-04-08, id 317481). Реплика двусмысленна по адресату («они» — объекты или препараты); контекст — ответ на аналогию с ядом змей.</li>\n<li>Мир в целом: «Пока я ещё не до конца придумал мир, пусть пока будет так» (id 317512).</li>\n<li>Медуза: «Там я вообще поебоду придумал», «Расписывать дофига» (317538–317539) — обещанный разбор в чат так и не попал; известно ровно одно свойство.</li>\n<li>Черныши: что они собой представляют — не описано вовсе.</li>\n<li>Пятая и шестая способности Демона: дошли до четырёх из шести, оба предложения Миколая отклонены («Может другую», «Может другую», 37595–37596), в следующем окне тема не всплывает.</li>\n<li>Разделение сил во вселенной: обещано 2025-04-22 (id 321109) и больше не звучит.</li>\n<li>Список из двадцати способностей для раннего чёрного ящика (2024-11-17) так и не составлен.</li>\n<li>Природа твари из пещеры не раскрывается намеренно: «Чем меньше» (2025-05-15, id 326314).</li>\n<li>В позднем слое (2026): состав шести столпов злодеев — «я ещё конечно их не придумал» (487003); остальные столпы героев — «ну ещё челики который я потом расскажу» (487002); культ — «у меня всегда с верующими проблема, я никогда ничего нормального придумать не могу» (487001); финал линии Доимы — «А в конце ну ты знаешь что будет» (488439).</li>\n</ul>\n<p><strong>Не сказано в переписке</strong></p>\n<ul>\n<li>Кончина вселенной не объявлена. Отрезок закрыт датой 2025-05-09, но дословного объявления о закрытии в файле нет — раздел «Дословно — объявления» содержит только три события 2025-04-08. Никаких возвратов, повторных объявлений и переоткрытий вселенной после 2025-04-08 не зафиксировано.</li>\n<li>Возможность возврата апокалипсиса не закрыта и не подтверждена: на «будет?» (317408) ответ «Не знаю» (317413). При этом «Пролог про апокалипсис» датирован 2025-05-04, почти через месяц после «Апокалипсиса и вируса нету» (317430); соотношение не объяснено. Осталась ли инверсия «монстры протагонисты, люди антагонисты» после отмены — тоже не сказано. Причина ядерного удара в прологе не объяснена.</li>\n<li>Откуда взялось слово «Нимб» и почему организация названа именно так.</li>\n<li>Что произошло 11 июня 2003 года — дата основания дана без события. То же число стоит как дата сбора у корабля (320983); совпадение соавторами не обсуждается.</li>\n<li>Что делает отдел Этики помимо того, что он «часто ругается с отделом силовиков и исследования» (317257); его полномочия, а также численность, руководители и подчинённость всех отделов.</li>\n<li>Как устроена двойственность «формально они правительства организация, но на деле они свободная организация» (317249). Названия государства нет, устройство правительства не обсуждалось.</li>\n<li>Как соотносятся Нимб и НБО организационно; сказано только «нимб это пошире будет» (317472) и «там же они как больничка и другое» (317474). Дальше сокращение не используется.</li>\n<li>Что за «темка», о которой шла речь в вопросе «это темка которой управляет нимб?» (317418) и ответе «Не, забудь про это» (317422) — из выписки не восстанавливается, предшествующие сообщения в файл не попали (лакуна id 317414–317418).</li>\n<li>Что такое серафим в этой вселенной: назван третьим в перечне (317440), отдельной сущности с таким именем в составе вселенной нет. Перечень объектов открытый — многоточие авторское, полный список не приведён. Обсуждение серафима как должности (Миколай, 2025-12-17: «вообще Серафим это профессия», «а не конкретное существо») шло вне отрезка «Нимба» и к списку объектов Нимба обратно не приложено; вопрос самого Славы «И будут ли другие Серафимы» (id 399488) остался без ответа.</li>\n<li>Двойной статус Демона и Масочника («И то и другой», 317517) заявлен и не расписан. Что такое «другой мир» в этой вселенной, кто ещё оттуда, как это сочетается с «есть только нимб и объекты» — не сказано. Про Масочника кроме имени и этого статуса не сказано ничего. Кто ещё в руководстве Нимба, ни одна должность и ни одно имя — не названы.</li>\n<li>Класс «сверхлюди» и «грешники» в отрезке «Нимба» не раскрыт: откуда сверхлюди, сколько их, как соотносятся с объектами и препаратами. Напарники Демона объявлены, состав не придуман.</li>\n<li>Кто главный герой: на вопрос «кто гг» (317506) прямого ответа нет; на «кто хуйло» (317508) — «Не кто» (317509).</li>\n<li>Цена и побочные эффекты препаратов Нимба. Результат опытов над людьми в окне объявления не описан.</li>\n<li>Цена запроса к чёрному ящику не решена: «выносливость? Или жизненную силу» → «Я не знаю» → «Наверное жизненную силу» (320115–320117). Миколай хотел додумать обмен (320128–320135), продолжения нет.</li>\n<li>Связь чёрного ящика с самой вселенной: на прямой вопрос, имеет ли ящик отношение к истории (320142), Слава ответил «не». Ранняя (2024-11-17) и поздняя (2025-04-18) редакции ящика — разные механики под одним названием, и что одно заменило другое, авторы не проговаривают.</li>\n<li>Кто такой «исполняющий желания» на корабле и связан ли он с Нимбом. Виновен ли Нимб в происходящем на корабле — вопрос поставлен внутри прозы (320984) и не решён.</li>\n<li>Обитатели корабля: одно это существо или разные, родство «лапы медведя» и чёрного гуманоида — не сказано.</li>\n<li>«Холод»: отдельная сущность корабля или образ внутреннего состояния рассказчика — не разъяснено.</li>\n<li>Природа и происхождение тварей из пещеры: откуда они в горе и почему их «десятки если не сотни».</li>\n<li>Источник «удивительных особенностей» Тохи и остальные его особенности («одно из них»).</li>\n<li>Эпизод с ребёнком в лесу, которого видел только один лесоруб (323365–323366), с тварями авторами не связан и остался без объяснения.</li>\n<li>Связь безымянной фармацевтической компании из истории про лесорубов с организацией «Нимб» не заявлена; названия у компании нет. Совпадают только профиль, способность препаратов отращивать конечности и повадка забирать дело у полиции.</li>\n<li>Как Нимб-фармкомпания 2025 года соотносится с Нимбом-экспериментатором окон w0120–w0121 (2026), помеченных в базе как «вселенная: неясно (по дате объявления)»; переход соавторы не комментируют.</li>\n<li>Как Нимб-фармкомпания соотносится с «Организацией Нимб» из реестра «Апостола», переопределённой в религиозную церковь (2025-09-12, id 364762); что означает для неё статус церкви — не разбиралось. В какой раздел реестра собирались вписать Нимб (правка 2025-05-14, id 325808) — не сказано; связь Нимба с фантазёрами и «перераспределением сил» из той же реплики не раскрыта.</li>\n<li>Наследуются ли способности апостолов: эксперимент над Доимой описан (2026-06-07, id 488439), ответа нет — «ученный сдались и больше не тестировали её».</li>\n<li>Является ли отряд инквизиторов частью секты Фалим или отдельной структурой; кто такие четыре епископа (в другой реплике — архиепископа) поимённо; кто «кто-нибудь из Нимба» в раскладе сил (487005); состав организации Доимы («несколько сл и ис») поимённо.</li>\n<li>Трое из восьми членов бригады лесорубов поимённо не названы.</li>\n<li>Ни одной сцены с участием Нимба-организации в раннем отрезке не написано, кроме упоминания писем внутри прозы.</li>\n</ul>\n<p><strong>Расхождения внутри самой карточки вселенной, не объяснённые в ней</strong></p>\n<ol>\n<li>Шапка объявляет <code>отрезков_объявлено: 3</code>, в таблице отрезков одна строка (2025-04-08 — 2025-05-09). Три — это число событий-объявлений (объявление, смена, переименование), а не число отрезков; что имелось в виду, не поясняется.</li>\n<li>Шапка объявляет диапазон дат 2023-03-27 — 2025-05-06, при том что отрезок начинается 2025-04-08. Нижняя граница берётся от персонажа Демон (2023-03-27), верхняя — от «Историй про Максима» и «Рассказчика историй про Максима» (2025-05-06). При этом в файле есть проза от 2025-05-07 и конец отрезка 2025-05-09 — обе даты позже верхней границы шапки.</li>\n<li>Восемь сущностей вселенной датированы раньше объявления «Нимба»: Демон (2023-03-27), Максим и Саша (2024-04-03), Андрей (2024-08-08), Чёрный ящик (2024-11-17), Масочник (2025-01-28), Михаил (2025-03-21), Игорь (2025-03-25). Как они попали во вселенную, объявленную 2025-04-08, в переписке не сказано.</li>\n<li>Вселенная у сущности проставлена по дате объявления, а не по содержанию. Из-за этого в «Нимбе» оказались куски, к организации Нимб отношения не имеющие (история про лесорубов, история про корабль, прологи Славы), и наоборот — часть материала про Нимб как организацию лежит в окнах, где вселенная не объявлена.</li>\n<li>Материал вселенной неоднороден: три из пяти способностей — фрагменты прозы («Холод», географическая память Тохи, отчасти препараты), а не проектируемые механики; конструирование механики есть только вокруг чёрного ящика и препаратов.</li>\n</ol></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["VS-0006--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0132.html\">Нимб</a>, <a href=\"MR-0133.html\">Отделы Нимба</a>, <a href=\"MR-0135.html\">Фармацевтическая компания</a>, <a href=\"MR-0136.html\">Инцидент (ядерный удар)</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0009.html\">Организация Нимб (НБО)</a></li>\n<li><strong>Группы:</strong> <a href=\"GR-0009.html\">Организация Нимб (НБО)</a>, <a href=\"GR-0073.html\">Бригада лесорубов</a>, <a href=\"GR-0074.html\">Четверо на корабле («супер группа»)</a>, <a href=\"GR-0075.html\">Фармацевтическая компания (из истории про лесорубов)</a>, <a href=\"GR-0076.html\">Черныши</a>, <a href=\"GR-0077.html\">Компания Игоря (школьная группа с завода имени Попова)</a></li>\n<li><strong>Персонажи:</strong> <a href=\"PS-0011.html\">Демон</a>, <a href=\"PS-0048.html\">Максим</a>, <a href=\"PS-0051.html\">Саша</a>, <a href=\"PS-0132.html\">Андрей</a>, <a href=\"PS-0195.html\">Масочник</a>, <a href=\"PS-0234.html\">Михаил</a>, <a href=\"PS-0240.html\">Игорь</a>, <a href=\"PS-0255.html\">Медуза</a>, <a href=\"PS-0256.html\">Черныши</a>, <a href=\"PS-0257.html\">Артём</a>, <a href=\"PS-0258.html\">Ника</a>, <a href=\"PS-0259.html\">Паша</a>, <a href=\"PS-0260.html\">Обитатели корабля</a>, <a href=\"PS-0261.html\">Иван Васильевич</a>, <a href=\"GR-0073.html\">Бригада лесорубов</a>, <a href=\"PS-0263.html\">Бригадир</a>, <a href=\"PS-0264.html\">Тоха</a>, <a href=\"PS-0265.html\">Тварь из пещеры</a>, <a href=\"PS-0266.html\">Алексей</a>, <a href=\"PS-0267.html\">Племяшка Алексея</a>, <a href=\"PS-0268.html\">Рассказчик историй про Максима</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["VS-0006--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/VS-0006.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["VS-0006-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/VS-0006/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Самое дорогое здесь — не внутри отрезка 2025 года, а на границе с поздним слоем. Нет статьи о Доиме (<code>PS-0375</code>), а на неё ссылаются четыре записи, и в базе по ней лежит около 9 КБ материала — это единственный поимённо названный сотрудник Нимба во всей вселенной, и через неё же проходит единственная описанная механика межмирового перехода. Рядом с ней тем же порядком висит вся конструкция окон w0120–w0121: Ассоциация (<code>MR-0194</code>, ~13 КБ), Фантазёры и провал в свой мир (<code>MR-0202</code>, ~15 КБ), Инквизиторы (<code>MR-0203</code>), Секта Фалим (<code>MR-0197</code>), плёнка сверхлюдей (<code>SP-0272</code>), Праведник (<code>PS-0372</code>), Святая дева (<code>PS-0373</code>), Фатик (<code>PS-0374</code>) — ни у одной статьи нет, вселенная у всех проставлена «неясно». Пока их нет, раздел про поздний слой в этой статье остаётся единственным местом, где они вообще описаны, и держится он сам на себе.</p>\n<p>Внутри самого отрезка 2025 года ситуация обратная: на всё, на что статья ссылается, статьи уже есть. Дорогая дыра там одна и она авторская, а не техническая — серафим. Он назван третьим в перечне объектов (317440) и отдельной сущности с таким именем в составе вселенной нет вообще; весь набор сил висит в другой вселенной.</p>\n<h3>С чего начать</h3>\n<p>В базу, не в архив. Поздний слой лежит целиком в записях <code>PS-0375</code>, <code>MR-0194</code>, <code>MR-0197</code>, <code>MR-0202</code>, <code>MR-0203</code>, <code>SP-0272</code>, <code>PS-0372</code>–<code>PS-0374</code> — это окна w0120–w0121, id 487001–488828, материала там на 70+ КБ, писать можно прямо оттуда.</p>\n<p>В архив идти надо за двумя вещами, и обе — вечер 2025-04-08, окно w0087. Первая: обещанный разбор медузы, который в чат «не попал» — ориентир id 317536–317560, сразу после «Расписывать дофига» и просьб Миколая «рассказывай». Вторая: лакуна перед «это темка которой управляет нимб?» — id 317414–317418, там предшествующие сообщения в выписку не вошли, и без них реплика не восстанавливается.</p>\n<p>Отдельно: обещание «раскажу про разделения сил в вселенной» (2025-04-22, id 321109) заведено в базе идеей <code>ID-0137</code>, но там всего ~1,8 КБ и статьи нет. Проверять надо не базу, а окно w0088–w0089 после 321109 — если продолжение было, оно там.</p>\n<h3>Как развивалось</h3>\n<p>Объявили, ограничили и переименовали в один день. Между «Нимб» (13:00, 317228) и «Апокалипсиса и вируса нету» (21:14, 317430) — восемь часов; ещё через несколько минут введено НБО (317467–317471). Дальше дословных объявлений нет ни одного. Следующие полтора месяца вселенная живёт только прозой: чёрный ящик 04-18, корабль 04-21, лесорубы 05-02, пролог про ядерный удар 05-04 — то есть апокалипсис возвращается через 26 дней после того, как его отменили, и это нигде не проговорено. Потом пауза в тринадцать месяцев и возврат под тем же именем в июне 2026, где Нимб — уже не рамка, а одна из сил.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для объектов производственная цепочка названа целиком: поймали → биологические жидкости → препарат → деньги и армейский контракт (317252–317253, 317479–317507). Для второго источника того же рода — опытов над людьми — названо только, что они идут и над кем («чаще всего над преступниками», «бывает и над сиротами», 317255–317256). Что из этих опытов выходит, куда это идёт и зачем организации это при уже работающих объектах — не сказано ни разу, при том что для объектов на тот же вопрос ответ дан в том же окне, через десять сообщений.</p>\n<h3>Отклик</h3>\n<p>Тварь из пещеры — лучшее, что здесь есть, и не потому, что страшно. Она сделана одним точным жестом: «представьте топор и эту острую часть сняли с топора и нацепили на морду собаки. Только у неё это видимо родной». Дальше её не берёт выстрел в упор, зато берут подломленные колени — то есть у неё есть слабое место, найденное руками, а не объяснением, и после драки от неё «осталось лишь мокрая места», а оно ещё живо. И рядом эта формула, которую рассказчик повторяет дважды: «тот самый, рев, который и не рев вообще». Обидно, что автор сам решил её не раскрывать («Чем меньше») — решение честное, но из-за него самая живая вещь вселенной так и осталась эпизодом внутри одного рассказа, а не частью мира.</p></div>", "r": []}];</script>
