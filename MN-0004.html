<script>const BASE="";const DOCNAME="склад спасателя";
const LEAD="";
const CH=[{"t": "Где находится — в каком мире и в каком его месте", "a": ["S01", "MN-0004-S01", "MN-0004--gde-nahoditsya"], "h": "<p>Вселенная «монстры» (по дате объявления; 2024-08-29, id 226088, окно w0055). Конкретное расположение склада не названо.</p>\n<p>Из монолога спасателя следует только, что склад — точка, откуда он выходит на охоту: сразу после того, как он заводит гостя внутрь, он уходит «пока-что в Хойя-Бачу монстров на монстров порыбачу». Рядом упоминается Ньюс — место, до которого он шёл за рыбочеловеком, и холм, над которым он пролетал. Как эти точки расположены относительно склада, не сказано.</p>", "r": []}, {"t": "Что собой представляет", "a": ["S02", "MN-0004-S02", "MN-0004--chto-soboy-predstavlyaet"], "h": "<p>База спасателя — место, которое он показывает пришедшему: «ладно, погнали покажу склад». Внутри кто-то есть и кто-то ест: заводя гостя, спасатель бросает «в общем, заходи.. ублюдки, приятного аппетита».</p>\n<p>Само содержимое склада не раскрыто. В исходнике место помечено как «место, где кто-то содержится/кормится», но прямо в тексте этого не сказано — есть только обращение «ублюдки» и пожелание приятного аппетита.</p>", "r": []}, {"t": "Что с ним связано — предметы, механики, силы", "a": ["S03", "MN-0004-S03", "MN-0004--chto-s-nim-svyazano"], "h": "<p>Склад принадлежит спасателю.</p>\n<p>Из того же монолога, привязанного к приходу на склад, идут вещи, к самому складу прямо не привязанные, но названные в одном фрагменте:</p>\n<ul>\n<li>рыбочеловек, за которым спасатель шёл до Ньюса: «суп из него такой ароматный, постоянная гипермедленная регенерация даже в варёном состоянии это райское наслаждение для моих очей. и то, как эта ошибка природы питается этими существами так расслабляет»;</li>\n<li>исследовательская программа по нему: «после 56 тестов я смогу с уверенностью определить его возможности, его днк и другие данные»;</li>\n<li>векторная тварь — «очень сподручна для перемещения конечно, её буду истреблять последней. хотя нет всех и сразу»; отдельно упоминается векторный шар: «ай, раздавил опять векторный шар, благо над холмом пролетал»;</li>\n<li>эхолокатор, которого спасатель ищет: «найти бы эхолокатора. почему все эти ублюдки так хорошо прячутся».</li>\n</ul>", "r": []}, {"t": "Персонажи и события — кто с ним связан и что там происходило", "a": ["S04", "MN-0004-S04", "MN-0004--personazhi-i-sobytiya"], "h": "<p><strong>Спасатель</strong> — хозяин склада, говорит весь фрагмент. К моменту прихода гостя он заканчивает разговор с подругой и поясняет: «не обращай внимания, делился с подругой о бестолковом парнишке». Содержание того спора приведено в самом начале: «да надоел этот парень спорить о том, что люди и монстры не связаны, утверждая что это отдельный вид. согласен, это совсем не аргумент. ещё говорит, что ауры не существует. ну ладно, это правда. но зачем всё услож...».</p>\n<p><strong>Гость</strong> — тот, кому показывают склад. Имя не названо. О нём известно из реплик спасателя: рост 165, возраст 27 лет. Спасатель комментирует: «ты такой маленький конечно, не в обиду.. в баскетбол наверное играешь? хахахах. ладно, прости. таких маленьких давно не видел, сколько рост? ну 165 в 27 лет это забавно конечно». Там же — «ой, прости не хотел плечо отбивать, это уже инстинктивно получилось». Что гостю нужно от спасателя, не сказано: «че интересно он ждет от меня, потом спрошу».</p>\n<p><strong>Парнишка</strong> — тот самый спорщик; ему отводится роль в исследовании: «тот паренёк займётся вычислениями пока не надоест, деньги сможет с глубин интернета собрать на исследование».</p>\n<p><strong>Дочка и семья спасателя</strong> — названы в его же словах: «я. я хочу увидеть дочку. я устал видеть эти мерзкие лица, устал каждого уничтожать. я хочу жить счастливо и размеренно со своей семьёй. эти изверги, я ненавижу их. их не останется ни одного».</p>\n<p>Событие одно: спасатель встречает гостя у склада, ведёт внутрь, здоровается с теми, кто внутри ест, и уходит на охоту.</p>", "r": []}, {"t": "Как менялся по версиям — по датам", "a": ["S05", "MN-0004-S05", "MN-0004--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-08-29 (id 226088, окно w0055).</strong> Единственное состояние. Всё описание умещается в один монолог Миколая; переработок в этом окне нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "MN-0004-S06", "MN-0004--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Что именно на складе — не раскрыто.</li>\n<li>Кто такие «ублюдки», которым спасатель желает приятного аппетита: содержащиеся там существа, помощники или кто-то ещё — в переписке не сказано.</li>\n<li>Где склад расположен относительно Хойя-Бачи, Ньюса и холма — не сказано.</li>\n<li>Кто такой гость и зачем пришёл — не названо, сам спасатель этого не знает: «че интересно он ждет от меня, потом спрошу».</li>\n<li>Связан ли склад с исследованием рыбочеловека (56 тестов) — прямо не сказано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MN-0004--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MN-0004--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-29</td>\n<td>226088–226088</td>\n<td>w0055</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/monumenty/MN-0004-sklad-spasatelya.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MN-0004--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MN-0004.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
