<script>const BASE="";const DOCNAME="мир богов и аватаров";
const LEAD="<p>Мир Славы. В переписке называется «мой мир», «мой вселенной», «главная мир» — собственного имени у него нет. Разработка идёт двумя большими кусками (2024-01-03 и 2024-01-04, окно w0022, id 75650–76415): сначала сама система богов и аватаров с балансом, затем выбор пантеона, главный герой и структура состава персонажей.</p>";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0003-S01", "MR-0003--ustroystvo"], "h": "<p>Основа мира заявлена Славой одной фразой (2024-01-03, id 75665): «мой мир боги решили устроить месиво и начали выбирать аватаров ( то бишь людей) давая им силы. И при всем этом аватар может качать способности только связанные со своим богом».</p>\n<p>Мир — обычный современный, не фэнтезийный: «Смотри вот мир обычный современный и вдруг боги решили устроить месиво» (id 75746).</p>\n<p><strong>Аватары.</strong> Аватар — человек, выбранный богом и получивший от него силу. Ограничение жёсткое: аватар может качать только те способности, которые связаны с его богом. Пример, на котором система объясняется в первый раз: бог времени Хронос, у его аватара — соответствующая способность (id 75668). Миколай сразу предлагает по классике Зевса, у которого «молнии качать» (id 75669–75670).</p>\n<p><strong>Как открываются новые способности.</strong> В версии от 15:37 (id 75746) аватар получает «с самого начало лишь основный способность, но со временем человек может открывать другие способности данного бога, и при этом может качать и старый». Механизм открытия менялся внутри того же дня — см. раздел «Как менялся по версиям».</p>\n<p><strong>Баланс.</strong> Слава: «что бы каждый аватары были более менее равны по силе» (id 75714), «Баланс» (id 75716). Миколай: «у них могут быть ограничения для баланса» (id 75717). Образец назван прямо — Джоджо: «остановка времени максимум 5 секунд и подобной хуеты» (id 75718–75719). Отдельно Слава подтверждает исходное равенство: «И все они изначально равны ( я про аватаров )» (id 75747). Миколай с этим спорит: «Способности все разные. И развиваться должны не равномерно. Чтобы дольше балан шел» (id 75752–75754).</p>\n<p><strong>Ограничения аватаров.</strong> Итоговый тип ограничения выбран Славой: «ограничение выносливость и типо того» (id 75734). Временные ограничения он отверг (перечень отклонённого — ниже). Объяснение, почему ограничения вообще нужны, дано Славой: «Это жалкий людишки конечно они не смогут в полной мере использовать силы богов» (id 75814).</p>\n<p><strong>Ограничения богов.</strong> Слава: «у богов должны тоже быть ограничение что бы они просто так способности не раздавали» (id 75775). Миколай предлагает механику слепоты бога: «Бог не сможет увидеть результат который выйдет после раздачи способности, точнее наоборот увидит только последствия и за эти последствия будет наказан богом на статус всех выше» (id 75780), развёрнуто — «если бог норм, то не будет давать ему возможность натворить бед, так как вышестоящее существо покарает за что-то тяжёлое» (id 75792). Слава эту надстройку снимает: «Это и есть высшее существа. И они хотят зрелища поэтому им только в кайф если будут беды» (id 75799). Миколай на это: «Ну тогда ограничения нахуя им» (id 75813) — и получает ответ про «жалкий людишки». То есть ограничения остаются на стороне людей, а не богов; сама механика наказания вышестоящим существом в мире не закрепилась.</p>\n<p><strong>Монстры.</strong> Боги выпускают монстров ради зрелища: «что бы было большей зрелище что бы людишки шевелились они начали выпускать дута монстров ( но там нет квестов там просто монстры и все )» (id 75746). Квестовой системы вокруг монстров нет — оговорено прямо.</p>\n<p><strong>Хаос как заданное состояние мира.</strong> Слава: «Я хочу что бы в мире был Хаус. Ведь боги раздали способности не только добрякам но и психом террористом и подобной мразоть» (id 75727). И позже: «в твоём мире появится дохуя монстров или будут психи или другая мразато который стали аватаром и тебе надо будет стать сильнее что бы защитить себя» (id 75775).</p>\n<p><strong>Мотивация аватаров.</strong> Обсуждается прямо. Миколай про себя: «я бы прокачал до того уровня когда с помощью неё можно будет спрятаться от всей этой поеботы. А дальше жил бы спокойно» (id 75777–75778). Слава ставит в основу интерес: «Если человеку скажут не нажимать на кнопку что человек сделает. Также и со способностями интерес до скольки я смогу прокачаться интересно какие ещё будут способности интересно Ая сам смогу стать богом» (id 75779). Миколай фиксирует различие: «Тат на интересе все завязано. А не на психологии» (id 75785–75786). Возможность аватару самому стать богом названа как интерес персонажа; отдельной механикой не прописана.</p>\n<p><strong>Смена поколений отсутствует.</strong> Слава: «в моём мире не будет потом нового поколения» (id 75755). Этим отсекается вся наследственная схема прокачки, предложенная Миколаем.</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0003-S02", "MR-0003--naselenie"], "h": "<ul>\n<li><strong>Боги.</strong> Пантеон конкретно не утверждён, но обсуждён (см. версию 5). Названные в переписке имена: Аматерасу, Один, Перун, Шива (id 75661–75664), Зевс (id 75669), Посейдон (id 75684), Приап — Миколай называет его «Приамп», «бог с большим еладаком», затем поправляется: «То есть бог плодородия» (id 75682–75691), Хронос (id 75668), Сатурн (id 75984), Идзанами (id 75989), Гермес (id 75995). Отдельной репликой Слава добавляет: «Феникс есть» (id 75677).</li>\n<li><strong>Аватары</strong> — люди, выбранные богами. Среди них не только «добряки», но и «психи-террористы» (id 75727).</li>\n<li><strong>Монстры</strong>, выпущенные богами ради зрелища (id 75746).</li>\n<li><strong>Персонажи из других миров</strong>, призванные богами на землю: «персонажей из других миров. Который боги призвали на землю ради Хауса» (2024-01-04, id 76396).</li>\n<li><strong>Высшие существа.</strong> По версии Славы это те же боги (id 75799). По версии Миколая — отдельный уровень, «бог на статус всех выше», карающий за последствия (id 75780).</li>\n<li><strong>Главный герой.</strong> Есть; отдельная сущность — «гг мира богов и аватаров». Заявлен как избранный (id 75746). Отдельная характеристика от Славы: «Тем более гг у меня будет уродом» (id 75987), Миколай: «Хах, прикольно, мне нравится».</li>\n</ul>\n<p><strong>Структура состава</strong> (2024-01-04, id 76393–76401). Миколай: «Рекомендую сделать 12 персонажей по 3 человека в группе», с оговоркой «наверное трудно всех проработать». Слава на тот момент: «Вот эти у меня одна тройка уже есть. И один мега гач». Персонажи планируется записывать в тетрадь: «Буду писать про них в тетрадь так легче будет. Плюсом все эти персонажей у меня давным давно в башки были раньше гг в мой вселенной» — то есть они жили в других вселенных Славы раньше, чем появился нынешний главный герой, и потому «их легче будет проработать» (id 76405). Миколай напоминает: «ты не только над способностями работай но и над характером, внешкой, прошлым и будущем».</p>", "r": []}, {"t": "Место во вселенной — как связан с другими мирами", "a": ["S03", "MR-0003-S03", "MR-0003--mesto-vo-vselennoy"], "h": "<p>Связь с другими мирами задана в одну сторону: боги призывают на землю персонажей из других миров ради хаоса (id 76396). Устройство этих миров, их названия и способ призыва в переписке не названы.</p>\n<p>Отдельно — авторская, не внутримировая связь: персонажи «давным давно в башки были» и существовали «в других вселенных» Славы до этого мира (id 76401, 76405). Речь о прежних придумках автора, а не о сюжетном переходе между мирами.</p>\n<p>Значение мира для Славы проговорено прямо (id 76407–76413). Миколай: «Мир тоже важная штука». Слава: «Дохуя важна. Для меня самая важная», и объясняет почему: «персонажей в свою голове у меня вроде норм плюс способности потихоньку по маленьку тоже норм. Но мир у меня всегда говном был». Отсюда его установка на 2024-01-04: «Сейчас главная мир нормально создать а то опять фигня получится» (id 76403).</p>\n<p>С миром связаны отдельные сущности: Гермес, аватар бога плодородия, гг мира богов и аватаров, жертвоприношение богу, наследственная прокачка способности, псих-кукловод, телепортация в карманное измерение.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0003-S04", "MR-0003--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-01-03, id 75650–75722.</strong> Первое объявление системы: боги выбирают аватаров среди людей и дают им силы; аватар качает только способности своего бога. Пример — Хронос и его аватар. Разговор идёт от обсуждения способности стрелять ногтями («От щелбана ноготь ломается и летит», id 75655), после чего Слава просит: «Тогда кидай богов с разными именами» — и Миколай называет Аматерасу, Одина, Перуна, Шиву. Тут же — первый разбор конкретного аватара: у бога плодородия «всеобщее повышение либидо» и «роста растений», причём «Его сила повышается с его повышением либидо», «Если красивую девочку увидит — сильнее становится» (id 75695–75705). В конце версии появляется тема баланса и ограничений.</p>\n<p><strong>Версия 2 — 2024-01-03, id 75714–75745.</strong> Проработка ограничений. Миколай предлагает варианты, Слава их отклоняет (см. ниже). Слава формулирует запрос на хаос (id 75727) и итоговое требование: ограничение по выносливости, «При всем этом они будут в будущем открывать новый способности связанный с их нем богом» (id 75734). Миколай в этой же версии выдвигает противоположную схему — способность нельзя улучшить лично, только по наследству (id 75736), плюс «чем больше человек думает о боге в момент зачатия тем лучше повлияет на улучшение» (id 75738). Слава фиксирует расхождение: «Да мы во все в другий стороны смотрим» (id 75737).</p>\n<p><strong>Версия 3 — 2024-01-03, id 75742–75775.</strong> Развёрнутая формулировка мира от Славы (id 75746): современный мир; аватар получает сначала только основную способность, со временем открывает другие способности своего бога и может качать старые; гг стал избранным; боги выпускают монстров ради зрелища, квестов нет; все аватары изначально равны (id 75747). Миколай возражает по поводу равномерности развития (id 75752–75754). Наследственная схема снимается репликой Славы про отсутствие нового поколения (id 75755), Миколай соглашается: «А. Ок» (id 75756–75757) — и взамен предлагает жертвоприношение богу: «Чем важнее для аватара вещь будет дана в жертву богу, тем сильнее способность он получит», «Важность может ещё определяется сложностью получения», «Убить целый спальный район ради жертвы не хухры мухры» (id 75760–75763).</p>\n<p><strong>Версия 4 — 2024-01-03, id 75764–75814.</strong> Способ открытия новых способностей. Исходно у Славы: «что бы открыть новый способности либо надо тренироваться либо выполнить просьбу бога когда он попросит. Это уже система» (id 75764–75765). Миколай: «тренировки просто скучно», «А вот поручение бога — норм» (id 75766–75768), и задаёт вопрос: «А если народу похуй на своего бога, пойдут против» (id 75770–75772) — ответа на это в переписке нет. Слава принимает возражение и переписывает механику: «на счёт тренировок прав тогда боги будут давать способности только при просьбе или когда аватар сделает что то что им понравится» (id 75775). Там же — требование ограничений для богов, спор о вышестоящем существе и мотивация через интерес.</p>\n<p><strong>Версия 5 — 2024-01-03, вечер, id 75970–76019.</strong> Выбор пантеона. Слава: «Вообще я хочу из славянской мифология. Так как она все же ближе плюсом мне достало что везде есть древнегреческая, египетская, мусульманская, скандиданская» (id 75973). Миколай: «древнегреческая топ» (id 75974), «в синтоизме 8 миллионов различных богов, должно хватить думаю» (id 75975), «Из язычества тоже было бы здорово» (id 75976), «Скандинавия вообще в моем сердечке» (id 75977), «Египетская тоже ничего» (id 75979). Мусульманскую отклоняет: «мне кажется это монотеистическая религия. Думаю не пойдёт» (id 75980–75981). Оформляется приём с дублирующими богами: «Сатурн и Хронос, это прикольно можно обоих использовать, но разные способности присвоить» (id 75984), Слава: «Вот идеально» (id 75986); Миколай сравнивает: «Это как Аматерасу и Идзанами» (id 75989). Итоговый пантеон в переписке так и не выбран.</p>\n<p>Там же — разбор Гермеса (id 75995–76019). Слава спрашивает, кто он в представлении Миколая без интернета. Миколай: «Чет наверное в черным с воронами и молниями ассоциируется. Ну и характер плохой». Слава: «Я думал ты скажешь бегун», и добавляет: «в некоторых источника, вор и торговец и типо у него дохуя артефактов. Идеальная для одного персонажа» — уточняя, что персонаж этот бог, а не человек (id 76010–76013). Миколай: «Просто вор обычно с плохим характером только».</p>\n<p><strong>Версия 6 — 2024-01-04, id 76393–76415.</strong> Структура состава: 12 персонажей по 3 в группе; персонажи из других миров, призванные богами ради хаоса; у Славы уже есть одна тройка и «один мега гач»; тетрадь как способ записи. Отдельной репликой в эту версию попадает энергетический щит: «энергетический щит будет имба ( он покроет тела энергий и любой кто притронется получит невероятный урон с заражением )» (id 76395) — чей это щит и к какому богу относится, не сказано. Завершает кусок разговор о приоритетах: мир для Славы важнее персонажей и способностей, потому что мир у него «всегда говном был».</p>", "r": []}, {"t": "Отклонённые варианты", "a": ["S05", "MR-0003-S05", "MR-0003--otklonennye-varianty"], "h": "<ul>\n<li><strong>Временные ограничения способностей.</strong> Миколай: способность работает только в поединке, а вне поединка — за какую-то валюту, «не обязательно деньги», то есть «менее строго» (id 75722–75725). Слава: «Не» (id 75726).</li>\n<li><strong>Способности некоторых работают только утром, а некоторых только ночью</strong> (id 75728). Слава: «Это будет Хаус будет смерти конец экономике», «Ограничений не такого плана» (id 75729–75730).</li>\n<li><strong>«Максимум можно юзать 45 минут в день»</strong> (id 75731). Отклонено там же: Слава уточняет, что имел в виду ограничение по выносливости, а не временное (id 75734).</li>\n<li><strong>Наследственная прокачка.</strong> Миколай: «способность нельзя никак улучшить, она изначально слаба и почти бесполезна, не все есть возможности, можно её улучшить только по наследству, с каждым поколением способность сильнее» (id 75736), плюс усиление за мысли о боге в момент зачатия (id 75738). Отклонено: в мире Славы нет смены поколений (id 75755).</li>\n<li><strong>Тренировки как способ открыть новую способность</strong> (id 75764). Отклонено самим Славой после довода Миколая «тренировки просто скучно» (id 75766, 75775).</li>\n<li><strong>Мусульманская мифология</strong> как источник пантеона — как монотеистическая (id 75980–75981).</li>\n<li><strong>Наказание бога вышестоящим существом</strong> за последствия раздачи силы (id 75780, 75792). Снято Славой: высшие существа — это и есть боги, и им «только в кайф если будут беды» (id 75799).</li>\n<li><strong>Жертвоприношение богу</strong> как способ усиления (id 75760–75763) — предложено Миколаем взамен наследственной схемы; принятия или отказа в переписке нет, Слава отвечает своей версией про тренировку или просьбу бога.</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S06", "MR-0003-S06", "MR-0003--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вселенная нигде не названа: говорится только «мой мир», «главная мир», «мой вселенной». Отнесение к «Падениям небес» — по дате объявления. Неясно, тот ли это мир, к которому относится январский список способностей времени.</li>\n<li>Пантеон не выбран. Славянская мифология заявлена как желаемая, но перечень Миколая (греческая, синтоизм, язычество, скандинавская, египетская) не сведён с ней ни к какому решению. Состав богов мира не назван.</li>\n<li>Ограничение по выносливости названо как тип, но не расписано: как считается, что тратит, как восстанавливается — в переписке не сказано.</li>\n<li>Не решено противоречие между «все аватары изначально равны» (Слава, id 75747) и «развиваться должны не равномерно» (Миколай, id 75753).</li>\n<li>Не решено, принята ли механика жертвоприношения богу.</li>\n<li>Вопрос Миколая «А если народу похуй на своего бога, пойдут против» (id 75770–75772) остался без ответа.</li>\n<li>Возможность аватару самому стать богом упомянута только как мотив интереса (id 75779); есть ли такой путь в мире — не сказано.</li>\n<li>Монстры заявлены («просто монстры и все»), но их происхождение, виды и поведение не описаны.</li>\n<li>Миры, из которых боги призывают персонажей, не названы и не описаны.</li>\n<li>Энергетический щит (id 76395) назван без привязки к носителю или богу.</li>\n<li>Состав из 12 персонажей — рекомендация Миколая, не подтверждённая Славой; из него на 2024-01-04 существуют «одна тройка» и «один мега гач», кто это — не сказано.</li>\n<li>Про главного героя из мировых кусков известно только, что он избранный и «будет уродом»; остальное — в отдельной статье.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0003--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0092.html\">Боги (пантеон мира богов и аватаров)</a>, <a href=\"GR-0093.html\">Аватары</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0009.html\">Падения небес</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0003--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-01-03</td>\n<td>75650–75722</td>\n<td>w0022</td>\n<td>Падения небес (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-01-03</td>\n<td>75714–75745</td>\n<td>w0022</td>\n<td>Падения небес (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-01-03</td>\n<td>75742–75775</td>\n<td>w0022</td>\n<td>Падения небес (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-01-03</td>\n<td>75764–75814</td>\n<td>w0022</td>\n<td>Падения небес (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-01-03</td>\n<td>75970–76019</td>\n<td>w0022</td>\n<td>Падения небес (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-01-04</td>\n<td>76393–76415</td>\n<td>w0022</td>\n<td>Падения небес (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0003-mir-bogov-i-avatarov.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0003--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0003.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["MR-0003-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/MR-0003/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>В тексте статьи прямо названа связанная сущность «Гермес» (<code>ID-0028</code>) — обсуждалась развёрнуто, как кандидат на одного из персонажей мира («Идеальная для одного персонажа»), но собственной статьи у неё нет, хотя материал в базе уже есть (3475 знаков). Это дороже, чем кажется: остальные сущности из того же списка связей — «аватар бога плодородия», «жертвоприношение богу», «наследственная прокачка способности», «псих-кукловод», «телепортация в карманное измерение» — все уже имеют свои статьи, а Гермес выпадает единственным. Чинить в первую очередь — его.</p>\n<h3>С чего начать</h3>\n<p>В архив идти не обязательно — материал уже лежит в базе под <code>ID-0028</code>, 3475 знаков. Если нужен более широкий контекст разговора, чем то, что попало в карточку, — окно w0022, 2024-01-03, вечер, id 75995–76019: там Слава и Миколай разбирают, что за персонаж мог бы получиться из Гермеса без опоры на интернет-справки.</p>\n<h3>Как развивалось</h3>\n<p>Мир заявлен утром 3 января 2024 (id 75650) и весь день дорабатывался: аватары, баланс, ограничения, отказ от наследственной прокачки. Вечером того же дня (id 75970) начался выбор пантеона — и здесь разработка обрывается незавершённой: «Итоговый пантеон в переписке так и не выбран». На следующий день, 4 января (id 76393), Слава возвращается к миру уже с другой задачей — структурой из 12 персонажей — и прямо формулирует, зачем: «Сейчас главная мир нормально создать а то опять фигня получится».</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для аватаров назван прямой способ роста силы — тренировка или просьба, обращённая к своему богу (id 75764–75775). Для самих богов аналогичного вопроса — как они наращивают или получают собственную силу — в переписке не поднималось вообще, будто сила богов дана изначально и обсуждению не подлежит.</p>\n<h3>Отклик</h3>\n<p>Больше всего зацепил момент, где Миколай спрашивает про ограничения для богов — «ну тогда ограничения нахуя им» — и получает в ответ не механику, а холодную формулировку: высшие существа хотят зрелища, и беды им только в кайф. Это не системный ответ, а авторская интонация, которая случайно проговорилась и тут же осталась без развития.</p></div>", "r": []}];</script>
