<script>const BASE="";const DOCNAME="Палач";
const LEAD="<p>Персонаж проходит через три объявленные вселенные — «7 островов», «Апостол» и «Оам» — и через семь зафиксированных состояний с 2024-12-13 по 2026-06-02 (окна w0066, w0073, w0097, w0108, w0120). Варианты имени, встречающиеся в переписке: «мой личный палач», «мой палач».</p>\n<p>Под одним именем описаны заметно разные вещи: боец команды с катаной и способностью сжатия (2025-01-28), фигура с топором внутри сознания героя (2025-05-19), апостол-убийца при Ассоциации (2025-11-05, 2026-06-02). Между собой эти состояния в переписке не сведены.</p>";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0171-S01", "PS-0171--proishozhdenie"], "h": "<p>Впервые имя произносится в перечне сильнейших персонажей (2024-12-13, id 269818–269824), во вселенной «7 островов». Слава спрашивает Миколая, какой уровень силы тот представляет у среднестатистического персонажа и «сильнейшего виде Имитатора и Палача, Нуара, смотрящего». Никакого описания в этом окне нет — только имя в одном ряду с Имитатором, Нуаром и Смотрящим. Разработка уровней силы тут же ставится под вопрос: Миколай — «ну вводить четкие уровни силы идея сложная кнш», Слава — «Не примерно», «Да ито она наверное не раз смениться».</p>\n<p>Развёрнутая природа персонажа названа только в версии от 2025-05-19 (id 328132–328133): Палач — осколок сознания Александра Титовского, ставший самостоятельным. Цель осколка — казнить и мстить виновным в смерти близких. Сами сообщения этого диапазона в архиве отсутствуют, содержание известно по сводке окна; дословных формулировок авторов по этому пункту нет.</p>\n<p>Обстоятельства, при которых он появляется впервые (2025-05-19, id 328114–328115), изложены в тексте от лица Александра. Сестра много раз звонит и пишет ему, он не берёт трубку и не читает сообщения; проснувшись, он видит «более 30 пропущенных и почти что 100 сообщение», смысл каждого один — «Спаси братец». Он приезжает и находит разрушенную деревню городского типа, кровь и погром, а в доме — «Кровь и плоть. Всё, что видел я. Там было ничего, что напоминала человека», только цепочку сестры, которую та не снимала. После этого — «И сошёл с ума».</p>\n<p>Само явление Палача происходит внутри безумия, которое авторский текст отдельно оговаривает как внутреннее, а не внешнее: «А дальше началось безумия. Не то что описали в фильмах, не то что написана в книгах. А реальная, субъективная», и следом — «Не, не подумайте. Не пришёл, какой-то убийца. Не появился демон. Или из земли не начали лезть упыри. Безумия началось лишь в моём разуме». В этом же видении — танцующие тени, «люди с лицами козлов, мышей. Словно маски нацепили», краски, взрывающиеся как салют, существа, «лапы которых достигали солнца», и шут, который «неумело жонглировал» огоньками надежды. Палач стоит отдельно от всего этого: «Он стоял поодаль от этих танцев и веселей».</p>\n<p>Ключевая формулировка о принадлежности: «Он был моим палачом».</p>\n<p>При этом звук, которым он обозначен, появляется в тексте раньше самой фигуры: ещё до видения, пока герой глотает горстку неизвестных таблеток и запивает водкой, он слышит «всё ближе и ближе этот неприятный звук. Таскания чего-то тяжелого и железного по бетону. Оно приближается и времени всё меньше и меньше».</p>\n<p>В версии 2025-01-28 происхождение не обсуждается вовсе — Палач просто числится четвёртым номером команды против Серафима. В версиях 2025-11-05 и 2026-06-02 он назван апостолом, но откуда берутся апостолы и как это соотносится с осколком сознания, в переписке не сказано. По разделу «Часть чего» в исходнике Палач относится к Апостолам.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0171-S02", "PS-0171--vneshnost"], "h": "<p>Описание дано один раз, в версии 3 (2025-05-19, id 328115), и в дальнейшем не переписывалось.</p>\n<p>Высокий и плечистый человек, одетый во всё чёрное; «кожаная одежда была, как будто ему малой». Лицо — «чудовищна. Словно слепленным безумцем»: кожи нет, только плоть и мышцы, нос отсутствует, из щёк выпирают острые наросты. Лысый.</p>\n<p>В руках — топор: «Большое топор. В раза два больше чем обычный. И этот топор был полностью железный.» Топор он не несёт, а волочит опущенным, отчего и берётся тот самый звук таскания тяжёлого железа по бетону. Поднимает его одной рукой.</p>\n<p>Походка описана через то, что она означает: «Шёл он медленно. Знал что не убегу.»</p>\n<p>Отдельно от внешности в переписке (2025-05-19, id 328115) описаны два шрама на лице самого Александра — «Два шрама по щекам и глазам. Они напоминали слезы. Словно я недавно плакал». Происхождение шрамов герой объясняет двояко: «Возможно, тогда в деревне я сам их сделал или на что-то напоролся», но тут же допускает другое — «Хотя шута мог казнить палач, как и меня. Оставив шрамы на лице.» Прямой связи между шрамами и Палачом переписка не устанавливает, оба варианта оставлены рядом. Отдельно отмечено, что после «возвращения» шрамы остались, тогда как седина и морщины исчезли (id 328117): «Почему они остались?»</p>\n<p>Внешность версии 2 (команда против Серафима) и версий 6–7 (апостол Ассоциации) не описана вообще: там названы только оружие и роль. Носит ли апостол Палач маску, как государственные Палачи, в переписке не сказано.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0171-S03", "PS-0171--harakter"], "h": "<p>Отдельного разбора характера в переписке нет; поведение показано через действия в версиях 3 и 4 (2025-05-19).</p>\n<p>Он не спешит: «Шёл он медленно. Знал что не убегу.» Эта формула повторяется почти дословно во втором эпизоде: «Он шёл сюда. Он не торопился. Он знал, что я не убегу.»</p>\n<p>Он не разговаривает — во всех сценах он молчит и только заносит топор.</p>\n<p>По дороге он устраняет всё, что попадается: «Пока он шел, он изредка поднимал топор. Если рядом были монстры. Или люди в масках. И одним движениям решал их головы. Он разрушил всё те пляски и безумия.» То есть безумие видения он не дополняет, а прекращает.</p>\n<p>Казнит одним движением, топор поднимает одной рукой — деталь повторена в обоих эпизодах.</p>\n<p>Единственное прямое высказывание о мотиве — реплика героя о том, что Палачу нравится давать надежду и рушить её: «Опять эти новый сценки, что дают надежду, а после разрушает их. Ему нравится это. Он же палач.» Это оценка изнутри текста, от лица Александра, а не отдельно сформулированное авторами свойство.</p>\n<p>В версии 7 (2026-06-02) поведение описано иначе и уже в социальных терминах: «убийцу, что убивает тиха всех неугодных ассоциации. И он не герой, ну не числиться».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0171-S04", "PS-0171--sposobnosti"], "h": "<p><strong>Версия 2025-01-28 (id 285363), команда против Серафима.</strong> Способность названа «сжатие». Дословно: «Его способность сжатия он может жать пространства чтобы приблизится к противнткк, или сжать атаку противника. Он также может сжимать ауру и делать слэш». Три применения, названные явно: сжатие пространства для сокращения дистанции, сжатие атаки противника, сжатие ауры с последующим слэшем.</p>\n<p>Боевые характеристики того же сообщения: «Быстрейший в этой пати, его всё атаки нацеленый на жизненный важный точки противника». Оружие — катана.</p>\n<p><strong>Версии 3–5 (2025-05-19).</strong> Способностей в игромеханическом смысле нет. Действие одно — казнь топором, повторяемая: «И вот подойдя ко мне в притык. Он поднял, одной рукой топор.......» (id 328115), «Поднял топор одной рукой и казнил меня......» (id 328116). Головы монстрам и людям в масках он сносит «одним движениям». В версии 5 обозначен выход из сознания в реальный мир.</p>\n<p><strong>Версия 2025-11-05 (id 382099).</strong> Способность не упоминается, зато зафиксирован стиль ближнего боя: Палач назван «апостолом, который сильнейший в ближнем бою». Стиль воспроизводим — государственных Палачей «были обучены стилю боя как у Палача», «но опять же это лишь имитация стиля Палача».</p>\n<p><strong>Версия 2026-06-02 (id 487176).</strong> Формулировка смягчена: «В ближнем бою он почти сильнейший». Там же: «сильнейший апостолы это Граф и Палач». Собственной способности на эту дату нет — в том же окне Слава пишет: «Придумаю способность и тебе скину. И ты идей кидай. Ок?» (id 487175). Миколай отвечает «ок» и следом «но конечно чет идей мало приходит» (id 487177–487178). То есть способность версии 7 на момент окна не придумана.</p>\n<p>Уровень силы численно не задан ни в одной версии. Первая же попытка ввести шкалу (2024-12-13) была прокомментирована как сложная и заведомо непостоянная.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Как развивалось — не материал авторов</b>\n<p>2024-12-13 — заявили одним именем в перечне сильнейших и тут же ограничили попытку измерить силу: шкалу назвали сложной идеей и отложили. 2025-01-28 — расписали как боевую единицу: катана, сжатие, номер четыре в отряде. 2025-05-19 — переписали целиком в другую фигуру: топор, лицо без кожи, осколок чужого сознания; здесь же единственное описание внешности за всю историю. Полгода тишины. 2025-11-05 — вернулись одной строкой и вскользь, уже как к образцу боевого стиля для чужой организации. 2026-06-02 — вернулись ещё раз, формулировка о силе ослаблена с «сильнейший в ближнем бою» до «почти сильнейший», а способность объявлена как то, что предстоит придумать. Полтора года и три фигуры под одним именем, ни разу не сведённые между собой.</p></div>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0171-S05", "PS-0171--svyazi-s-drugimi"], "h": "<p><strong>Александр Титовский.</strong> Палач — осколок его сознания (версия от 2025-05-19). В тексте героя он раз за разом называется притяжательно: «Он был моим палачом», «И прекрасно знал, что это мой палач. Мой личный.» Эта вторая формула сказана не в видении, а в обычной жизни: Александр после выписки выходит на завод, работает «как никогда», уходит последним и приходит первым, «И я всё слышал этот неприятный звук таскания топора об бетон. И прекрасно знал, что это мой палач. Мой личный.» Отношение к нему у Александра — не сопротивление, а ожидание: «Да я никогда ничего не делал с ним. Просто принимало его и ждал.» Звук топора описывается как происходящий внутри: «Я слышу, его топор тащиться по бетону моего сознания.»</p>\n<p><strong>Команда против Серафима (2025-01-28).</strong> Палач — четвёртый номер в четвёрке, вместе с Воительницей (первый номер: огромная физическая сила и крепость, средняя скорость, контроль над массой, размером и плотностью на себе и неживых объектах, оружейный браслет), Агрегатом (второй: смена агрегатных состояний неодушевлённых объектов, оружие создаёт из воздуха) и Имитатором (третий: самый живучий, имитирует одну способность врага и способен её развить, оружие — жидкость, принимающая любую форму). Команда собрана, чтобы противостоять Серафиму. По скорости он выделен внутри группы: «Быстрейший в этой пати».</p>\n<p><strong>Перечень сильнейших (2024-12-13).</strong> Назван рядом с Имитатором, Нуаром и Смотрящим.</p>\n<p><strong>Апостолы.</strong> Палач входит в апостолов (версии 2025-11-05 и 2026-06-02). В версии 2026-06-02 сильнейшими апостолами названы двое — Граф и Палач.</p>\n<p><strong>Ассоциация.</strong> «Цепной пёс ассоциации. Ну точнее ассоциации так думает.» Оговорка сделана авторами прямо и означает, что подчинённость Палача Ассоциации — представление самой Ассоциации, а не установленный факт. Чем это оборачивается, в переписке не сказано.</p>\n<p><strong>Палачи (государственные убийцы).</strong> Отдельная группа, названная по нему. «Палачи государственный убийцы. Личность которых засекречена. Они всегда ходят в масках на задание. У них всегда одна и таже цель ликвидации. Если они появятся не кто не выживает. Их вырастили именно для убийства.» Их обучили стилю Палача, но это «лишь имитация стиля». Там же зафиксирована неудачная попытка привить им другое: «Также было проведена попытка обучения особого усиления Имитатора, но из-за большой смертности от неё отказались.» Связи между самим Палачом и этой организацией — знает ли он о них, участвует ли в обучении — в переписке нет.</p>\n<p><strong>Шут с огоньками надежды.</strong> Присутствует в том же видении: «Я видел огоньки надежды, который неумело жонглировал шут». Прямого взаимодействия не описано, есть только предположение Александра: «Но этот огонёк надежды. Кажется шут всё же уронил и он потух. Хотя шута мог казнить палач, как и меня.» Сказано «мог», утверждения нет.</p>\n<p><strong>Звук таскания топора по бетону.</strong> Устойчивый признак появления, вынесенный в переписке в отдельную сущность. Возникает раньше самой фигуры и работает как предупреждение о её приближении.</p>\n<p><strong>Уровни сил 1-10.</strong> Палач фигурирует в вопросе Славы о шкале уровней силы (2024-12-13). Числа ему не присвоено.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0171-S06", "PS-0171--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2024-12-13, «7 островов», окно w0066, id 269818–269824.</strong> Только имя в списке сильнейших. Ни внешности, ни способности, ни роли.</p>\n<p><strong>Версия 2 — 2025-01-28, «Апостол», окно w0073, id 285353–285369.</strong> Расписан как боевая единица: четвёртый номер команды против Серафима, быстрейший, все атаки — по жизненно важным точкам, способность сжатия (пространство, атака противника, аура со слэшем), оружие катана. В этом состоянии он — обычный участник группы, никакого отношения к чьему-либо сознанию нет. Реплика Славы перед списком: «Ладно сейчас я запишу персонажей который будут противостоять ему ты в нейрону скинушь?» Миколай: «хорошо давай». Результат отправлен ссылкой https://telegra.ph/boi-01-28 (id 285369); что в ней, в переписке не показано.</p>\n<p><strong>Версия 3 — 2025-05-19, «Апостол», окно w0097, id 328114–328115.</strong> Полностью иная фигура: не боец из пати, а видение в разуме Александра. Здесь появляется единственное описание внешности, топор вместо катаны и медленная неотвратимая походка. Здесь же он впервые назван «моим палачом». Звук топора слышен герою ещё до видения — в квартире, до отключения сознания. Эпизод кончается первой казнью, после которой Александр приходит в себя в белой комнате; в больнице он пролежал два месяца, «Для меня же это было, как мгновение. Словно, Кто-то просто перемотал вперёд.»</p>\n<p><strong>Версия 4 — 2025-05-19, окно w0097, id 328116–328117.</strong> Повтор прежней мысли, без отмены предыдущего. Палач приходит каждый раз, когда Александр тонет в вине — после срыва у психолога, после отравления таблетками с водкой, после аварии. Казнь оказывается не финалом, а переходом: после каждой герой обнаруживает себя в другой сцене (морг, больница), и сам определяет эти сцены как работу Палача — «Так это сценка палача была, где он опять казнил меня». Сопротивление отсутствует полностью: «Просто лежал. Как перед палачом.»</p>\n<p><strong>Версия 5 — 2025-05-19, окно w0097, id 328132–328133.</strong> Природа названа прямо: осколок сознания, ставший самостоятельным; цель — казнить и мстить виновным в смерти близких. С решением о мести он начинает выбираться из сознания в настоящий мир. Дословных формулировок нет — сообщения этого диапазона в архиве отсутствуют.</p>\n<p><strong>Версия 6 — 2025-11-05, «Оам», окно w0108, id 382099.</strong> Упомянут вскользь, внутри описания государственных Палачей: «апостола, который сильнейший в ближнем бою». Здесь он уже апостол и образец стиля, самостоятельного описания в окне нет.</p>\n<p><strong>Версия 7 — 2026-06-02, вселенная не объявлена, окно w0120, id 487175–487178.</strong> Один из апостолов, цепной пёс Ассоциации (с оговоркой «ну точнее ассоциации так думает»), тихо убивает всех неугодных, героем не числится. Формулировка о силе ослаблена по сравнению с 2025-11-05: не «сильнейший в ближнем бою», а «почти сильнейший». Вместе с Графом — сильнейший из апостолов. Реплика введена как напоминание: «Надеюсь ты не забыл.» Развития внутри окна нет; способность объявлена как то, что ещё предстоит придумать.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0171-S07", "PS-0171--chto-s-nim-stalo"], "h": "<p>Последнее состояние — версия от 2026-06-02: апостол, работающий на Ассоциацию как тихий ликвидатор, официально не герой, один из двух сильнейших апостолов наряду с Графом, без придуманной способности.</p>\n<p>Внутри линии Александра последнее зафиксированное движение — выход наружу: с решением о мести Палач начинает выбираться из сознания в настоящий мир (2025-05-19, id 328132–328133). Что происходит дальше и как это состояние соотносится с апостольским, в переписке не сказано; сами эти сообщения в архиве отсутствуют.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0171-S08", "PS-0171--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Уровень силы численно не задан ни разу. Первая попытка ввести шкалу (2024-12-13) была отклонена как «идея сложная», с оговоркой, что «она наверное не раз смениться».</li>\n<li>Соотношение между тремя разными Палачами — бойцом с катаной и сжатием (2025-01-28), осколком сознания с топором (2025-05-19) и апостолом Ассоциации (2025-11-05, 2026-06-02) — нигде не оговорено. Один это персонаж или разные, из переписки не следует.</li>\n<li>В реестре у Палача значится оружие «меч палача ☠️», а в описании 2025-01-28 оружие названо катаной. Противоречие не разрешено.</li>\n<li>Топор версий 3–5 и катана/меч версии 2 нигде не сведены.</li>\n<li>Способность сжатия (2025-01-28) больше нигде не повторяется; отменена она или нет — не сказано.</li>\n<li>Расхождение формулировок о силе: «сильнейший в ближнем бою» (2025-11-05) против «почти сильнейший» (2026-06-02), без пометки, что одно заменяет другое.</li>\n<li>Способность апостольской версии (2026-06-02) не придумана: «Придумаю способность и тебе скину».</li>\n<li>Оговорка «цепной пёс ассоциации. Ну точнее ассоциации так думает» оставлена без продолжения — во что выливается это расхождение, не сказано.</li>\n<li>Как Палач связан с государственными Палачами, знает ли о них, откуда взялся его стиль — не сказано.</li>\n<li>Казнил ли Палач шута с огоньками надежды — осталось нерешённым, в тексте только допущение «мог казнить».</li>\n<li>Происхождение шрамов Александра оставлено с двумя равноправными версиями и не решено.</li>\n<li>Реплик у персонажа нет ни в одном фрагменте; говорит ли он вообще — не сказано.</li>\n<li>Что стало с Палачом после выхода в реальный мир (2025-05-19, id 328132–328133) — осталось нерешённым; сами эти сообщения в архиве отсутствуют.</li>\n<li>В окне 2024-12-13 только имя: разработка была раньше или ещё будет, из окна неясно.</li>\n<li>В окне 2025-11-05 только упоминание, самостоятельного описания нет.</li>\n<li>В окне 2026-06-02 развития внутри окна нет.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0171--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0001.html\">Апостолы (организация апостолов, «благословенные Богом»)</a>, <a href=\"GR-0008.html\">Команда против Серафима («пати»)</a>, <a href=\"GR-0011.html\">Братья и сёстры (благословенные одним правителем)</a>, <a href=\"GR-0013.html\">Благословенные</a>, <a href=\"GR-0056.html\">Апостолы (21 апостол; «насекомые»)</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0104.html\">Нуар</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0001.html\">Апостолы (организация апостолов, «благословенные Богом»)</a>, <a href=\"GR-0008.html\">Команда против Серафима («пати»)</a>, <a href=\"GR-0011.html\">Братья и сёстры (благословенные одним правителем)</a>, <a href=\"GR-0013.html\">Благословенные</a>, <a href=\"GR-0056.html\">Апостолы (21 апостол; «насекомые»)</a>, <a href=\"GR-0070.html\">Палачи (государственные убийцы)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0171--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-12-13</td>\n<td>269818–269824</td>\n<td>w0066</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-28</td>\n<td>285353–285369</td>\n<td>w0073</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-05-19</td>\n<td>328114–328115</td>\n<td>w0097</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-05-19</td>\n<td>328116–328117</td>\n<td>w0097</td>\n<td>Апостол (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2025-05-19</td>\n<td>328132–328133</td>\n<td>w0097</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-11-05</td>\n<td>382099–382099</td>\n<td>w0108</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-02</td>\n<td>487175–487178</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0171-palach.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0171--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0171.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0171-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0171/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — Ассоциация. <code>MR-0194</code> «Ассоциация»: три версии, окна w0120 и w0121, база 13 631, статьи нет. На ней держится всё последнее состояние Палача, через неё идут шесть столпов героев, «лицо» Ассоциации и голосование за него. С ней же связан <code>PS-0323</code> «Граф» (пять версий, w0112 и w0120, база 7 851, статьи нет) — а Граф вдвоём с Палачом назван сильнейшим апостолом, то есть половина утверждения о вершине иерархии сейчас ведёт в пустоту. Третья рядом — <code>PS-0304</code> «Палачи» (база 2 464, статьи нет), группа, названная по нему.</p>\n<p>Три записи, у всех трёх материал в базе есть, статьи нет ни у одной. Всё окно 2026-06-02 висит на них. Это заметно дороже, чем несведённые топор и катана: противоречие про оружие блокирует одну статью, Ассоциация — целую ветку.</p>\n<h3>С чего начать</h3>\n<p>Три из четырёх — в базе, идти в архив не нужно. <code>MR-0194</code> — 487001–487005 и продолжение в w0121, там же разбор, почему лицом стал Праведник, а не Граф или Нуар. <code>PS-0323</code> — 393296–393301 (w0112, 2025-12-06) и w0120. <code>PS-0304</code> — одно сообщение 382099, целиком, больше ничего.</p>\n<p>В архив — ровно за одним. Диапазон 328132–328133 (2025-05-19, w0097) в архиве отсутствует, а именно там названа природа персонажа: осколок сознания, ставший самостоятельным. Сейчас это единственное место статьи без дословной опоры — всё остальное цитируется, а самый сильный тезис держится на сводке окна. Искать вокруг 328117–328140 или помечать этот абзац как пересказ, третьего варианта нет.</p>\n<h3>Как развивалось</h3>\n<p>2024-12-13 — заявили одним именем в перечне сильнейших и тут же ограничили попытку измерить силу: шкалу назвали сложной идеей и отложили. 2025-01-28 — расписали как боевую единицу: катана, сжатие, номер четыре в отряде. 2025-05-19 — переписали целиком в другую фигуру: топор, лицо без кожи, осколок чужого сознания; здесь же единственное описание внешности за всю историю. Полгода тишины. 2025-11-05 — вернулись одной строкой и вскользь, уже как к образцу боевого стиля для чужой организации. 2026-06-02 — вернулись ещё раз, формулировка о силе ослаблена с «сильнейший в ближнем бою» до «почти сильнейший», а способность объявлена как то, что предстоит придумать. Полтора года и три фигуры под одним именем, ни разу не сведённые между собой.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для государственных Палачей граница между оригиналом и копией названа прямо и дважды: их «обучили стилю боя как у Палача», «но опять же это лишь имитация стиля Палача». Правило проговорено — копия остаётся копией, сколько её ни обучай.</p>\n<p>Для самого Палача образца 2025-05-19 того же правила нет, хотя случай ровно такой же: он осколок чужого сознания, ставший самостоятельным. Оригинал он теперь или копия по отношению к тому, чьим осколком является, — не сказано ни разу, при том что для организации, названной его именем, это оговорено специально.</p>\n<h3>Отклик</h3>\n<p>Сильнее всего — звук раньше фигуры. Волочение железа по бетону слышно до того, как появляется тот, кто волочит; потом этот звук отделяется в самостоятельную сущность базы (<code>SP-0227</code>, 30 071) и работает уже сам по себе. Приём никто не объяснял, он просто есть, и он держит два эпизода подряд. Туда же повтор «Он шёл сюда. Он не торопился. Он знал, что я не убегу» — почти дословно из первого эпизода во второй; это не небрежность, это ритм, и он единственное, что связывает разошедшиеся версии персонажа.</p>\n<p>А лучшая строчка во всём позднем материале — «Цепной пёс ассоциации. Ну точнее ассоциации так думает». Полперсонажа в двух фразах, и за ней не последовало ничего.</p></div>", "r": []}];</script>
