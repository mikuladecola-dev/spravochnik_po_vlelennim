<script>const BASE="";const DOCNAME="Организация нимб";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0137-S01", "MR-0137--ustroystvo"], "h": "<p>Организация Нимб на протяжении переписки существует в двух несовместимых определениях, причём первое из них в чате прямо не проговаривается, а всплывает только в момент отмены.</p>\n<p>Ко второй версии (2025-09-12, id 364762) выясняется, что до этого Нимб был фармацевтической компанией: Слава объявляет, что «Организация Нимб более не фармавечическая компания это религиозная церковь». Само исходное определение — фармацевтическая компания — в сохранённой переписке нигде не разворачивается; оно известно только из этой отменяющей реплики.</p>\n<p>С 2025-09-12 Нимб — религиозная церковь. Никаких деталей устройства церкви — структуры, иерархии, обрядов, отношения к благословенным и одержимым — в переписке за этим переопределением не следует. Сразу после смены природы организации разговор уходит на другую тему: «Во первых вообще кто есть благословенные и одержимые. Благословенный всё также но силы у всех благословенных получен от небес» (id 364764).</p>", "r": []}, {"t": "Место во вселенной", "a": ["S02", "MR-0137-S02", "MR-0137--mesto-vo-vselennoy"], "h": "<p>Нимб отнесён к вселенной «Апостол» и связан с благословенными; в реестре он помечен как часть темы «Благословенные».</p>\n<p>Первое появление (2025-05-14, id 325805–325808) — это не описание, а пункт списка правок. На вопрос Миколая, что надо изменить — «убрать кого-то? добавить» — Слава отвечает: «Добавления организация нимб и фантазеров И перераспределение сил». То есть Нимб назван в одном ряду с фантазёрами и перераспределением сил как то, что предстоит добавить.</p>\n<p>Переопределение 2025-09-12 происходит внутри разговора о новой вселенной — переработке «Апостола», которая на тот момент безымянная. Ему непосредственно предшествует реплика «Новая вселенная более простая» (id 364761), а следом идёт «Ладно давай начнём» (id 364763). К какой именно вселенной относится Нимб-церковь — к «Апостолу» или к новой безымянной вселенной — в переписке прямо не сказано; в реестре вселенная второй версии помечена как неясная.</p>\n<p>Помимо благословенных и новой вселенной, Нимб числится связанным с организациями охотников на одержимых и с фантазёрами. Характер этих связей в переписке не раскрывается — связь с фантазёрами возникает лишь из того, что они названы в одной реплике-списке.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S03", "MR-0137-S03", "MR-0137--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-05-14 (окно w0094, id 325805–325808).</strong> Организация нимб названа как планируемое добавление в реестр, вместе с фантазёрами и перераспределением сил. Дальше не разворачивается. Что это за организация — не сказано.</p>\n<p><strong>Версия 2 — 2025-09-12 (окно w0104, id 364761–364764).</strong> Смена природы организации: фармацевтическая компания становится религиозной церковью. Дословно: «Организация Нимб более не фармавечическая компания это религиозная церковь».</p>\n<p>Диапазон существования сущности в переписке: 2025-05-14 — 2025-09-12, две версии, окна w0094 и w0104.</p>", "r": []}, {"t": "Пробелы", "a": ["S04", "MR-0137-S04", "MR-0137--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Чем именно была организация в первой версии, в переписке не сказано напрямую — то, что это была фармацевтическая компания, известно только задним числом, из реплики об отмене.</li>\n<li>Как фармацевтическая компания соотносилась с благословенными, одержимыми или охотниками на одержимых — в переписке не сказано.</li>\n<li>Устройство Нимба как религиозной церкви не описано: ни состава, ни иерархии, ни доктрины, ни того, кому она поклоняется.</li>\n<li>Связь Нимба с фантазёрами и с организациями охотников на одержимых не объяснена.</li>\n<li>Вселенная, к которой относится вторая версия, в чате не названа.</li>\n<li>Что стало с прежним, фармацевтическим Нимбом внутри сюжета — переписан ли он задним числом или это просто замена задумки — осталось нерешённым.</li>\n<li>Само имя «Нимб» нигде не объясняется.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0137--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0009.html\">Организация Нимб (НБО)</a>, <a href=\"GR-0025.html\">Фантазёры (творцы)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0137--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-05-14</td>\n<td>325805–325808</td>\n<td>w0094</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-09-12</td>\n<td>364761–364764</td>\n<td>w0104</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0137-organizaciya-nimb.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0137--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0137.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["MR-0137-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/MR-0137/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Чинить первым надо не церковь, а слово. В базе «Нимб» — это не только организация, но и целая вселенная, и по ней лежит больше материала, чем по всему «Апостолу» в этой части: <code>VS-0006</code> «Нимб» (21 285 знаков, статьи нет) и внутри неё <code>MR-0132</code> «Нимб» — 88 701 знак, статьи нет, ноль ссылок. Рядом, в той же вселенной и тоже без статей: <code>MR-0133</code> «Отделы Нимба» (1 526), <code>SP-0221</code> «Препараты Нимба» (5 182), <code>IS-0090</code> «Инцидент с вирусом Нимба» (5 635), <code>MR-0136</code> «Инцидент (ядерный удар)» (12 050). Восемьдесят восемь тысяч знаков про «Нимб» лежат в архиве, пока статья об организации Нимб говорит, что фармацевтическое определение «нигде не разворачивается». Одно из двух: либо это разные Нимбы и это надо записать прямо, либо это один и тот же и статья построена на пустом месте. Пока вопрос не решён, любая работа по церкви идёт вслепую.</p>\n<p>Второе по цене — <code>MR-0148</code> «Новая вселенная (безымянная, переработка „Апостола“)»: статьи нет, в базе 3 372 знака, при этом на неё опираются <code>PS-0226</code> и <code>GR-0001</code>. Это ровно та запись, которая решает вопрос «к какой вселенной относится Нимб-церковь» — и не только для Нимба, а для всего, что сказано 2025-09-12.</p>\n<p>Третье — <code>MR-0149</code> «Организации охотников на одержимых»: статьи нет, 6 390 знаков в базе, вселенная помечена как неясная, а Нимб числится с ней связанным. Характер связи в статье назван неизвестным — и проверить его не по чему.</p>\n<h3>С чего начать</h3>\n<p>В базе, не в архиве. Первый шаг — сверить <code>MR-0132</code> с этой статьёй: там 88 701 знак, и если фармацевтический Нимб где-то развёрнут, то там. Подпорки к той же сверке: <code>SP-0221</code> «Препараты Нимба» и <code>IS-0090</code> «Инцидент с вирусом Нимба» — обе записи фармацевтические по предмету, обе без статей.</p>\n<p>Дальше — <code>MR-0135</code> «Фармацевтическая компания» (статья есть, база 9 750, вселенные «Апостол» и «Нимб»). Там уже стоит прямой ответ Славы про роль фарм-корпорации: «Биологическая оружия» (2025-05-15, id 326310, 326314). Отождествление с Нимбом там объявлено незаявленным — но окно 326310–326315 в источники этой статьи не входит вообще, хотя стоит через день после первого упоминания Нимба (325808, 2025-05-14).</p>\n<p>В архив идти надо ровно за одним: где впервые сказано, что Нимб — фармацевтическая компания. Ориентир — промежуток между 325808 и 364762, и в первую очередь дни вокруг 2025-05-15, окно w0094 и соседние: это единственный момент переписки, где фармацевтика обсуждается вслух и по существу.</p>\n<h3>Как развивалось</h3>\n<p>2025-05-14 — заявлено пунктом списка правок, в одном ряду с фантазёрами и перераспределением сил; что это, не сказано. Четыре месяца тишины. 2025-09-12 — возврат, и он же отмена: одна реплика убирает определение, которое за всё это время ни разу не было произнесено. Через сообщение разговор уходит к благословенным и одержимым и к Нимбу не возвращается. Заявили — не развернули — вернулись, чтобы отменить.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Две соседние реплики 2025-09-12 объявляют изменения по-разному. Для Нимба отмена проговорена явно: «более не фармавечическая компания это религиозная церковь» (364762) — старое названо и снято. Через сообщение, для благословенных: «Благословенный всё также но силы у всех благословенных получен от небес» (364764) — сказано, что всё по-прежнему, и тут же переопределён источник силы. Правило «как объявляется отмена прежнего» сформулировано для организации и не сформулировано для соседнего случая, стоящего в том же окне через одну реплику.</p>\n<h3>Отклик</h3>\n<p>Зацепило то, что вся первая жизнь этой организации существует только в отрицательной форме. Фармацевтический Нимб нигде не описан — он известен исключительно из слов «более не». Это как свидетельство о смерти без свидетельства о рождении: мы знаем, чем эта штука была, только потому, что кто-то отменил её вслух. И отмена сделана в один ход, без объяснения и без последствий — фармкомпания становится церковью так же легко, как переименовывают файл, а следующая же реплика уходит на другую тему и не оглядывается. Само слово «Нимб» при этом ни разу не объяснено, хотя оно одинаково хорошо подошло бы и фармацевтическому бренду, и церкви — и, возможно, именно поэтому переход прошёл безболезненно.</p></div>", "r": []}];</script>
