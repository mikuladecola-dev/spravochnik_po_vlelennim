<script>const BASE="";const DOCNAME="Церковь с паладинами";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0061-S01", "GR-0061--chto-eto"], "h": "<p>Религиозная организация вселенной Оам. Заведена одной строкой в общем перечне рас и организаций мира (2025-11-17, id 385768): «Церковь с паладинами ( мёртвыми рыцарями которых оживил один челик, для верующих) паладины до хрена сильный но их ней движения предсказуемый. Они больше как роботы с повторяющими движениями».</p>\n<p>То есть церковь — это община верующих, чью боевую силу составляют паладины, и паладины эти не живые люди, а мёртвые рыцари, поднятые со стороны: их оживил не кто-то из церкви, а посторонний человек — «один челик», которому тут же, в той же реплике, дано имя Виктор (<a href=\"PS-0308.html\">Виктор</a>). Оживлены они, по формулировке, именно «для верующих».</p>\n<p>Позже в церковь помещён второй предмет — матка Аскизов (<a href=\"PS-0301.html\">Матка Аскизы</a>). 2025-12-06 (id 393465): «Матка. Находиться в церкви. И люди им поклоняются, а детей маток считают святыми». Таким образом церковь оказывается сразу и владельцем мёртвого войска, и местом, где живёт и размножается матка, и объектом культа для людей.</p>\n<p>В расстановке сторон конфликта церковь отнесена к промежуточным злодеям (2025-12-06, id 393306): «Ну или церкви, да и люди иногда». Не к добру, не к основным злодеям, а в средний слой.</p>\n<p>Церковь и организация Виктора — разные пункты перечня. Виктор идёт отдельной строкой сразу после церкви: «Организация челика который и оживил паладинов». Церковь получает паладинов, но не является организацией Виктора.</p>", "r": [["Виктор", "PS-0308.html"], ["Матка Аскизы", "PS-0301.html"]]}, {"t": "Состав", "a": ["S02", "GR-0061-S02", "GR-0061--sostav"], "h": "<p>Поимённого состава нет — в переписке не названо ни одного члена церкви по имени. Названы только категории:</p>\n<ul>\n<li>Паладины — мёртвые рыцари, оживлённые Виктором. Основная и единственная описанная боевая сила церкви. Численность не названа.</li>\n<li>Верующие («люди») — те, для кого паладины оживлены и кто поклоняется матке. Количество, устройство общины, наличие духовенства в переписке не сказаны.</li>\n<li>Матка Аскизы (<a href=\"PS-0301.html\">Матка Аскизы</a>) — находится в церкви и является предметом поклонения. Является ли она членом организации или её содержимым, в переписке не разбирается.</li>\n</ul>\n<p>Виктор (<a href=\"PS-0308.html\">Виктор</a>) в состав церкви не записан: у него своя организация, он назван отдельным пунктом того же перечня и отдельно упомянут среди промежуточных злодеев (id 393308).</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Что не сформулировано по вашей же логике — не материал авторов</b>\n<p>Про Виктора разграничение проговорено прямо: церковь и организация Виктора — разные пункты перечня, паладины у церкви, но сам он в её состав не входит и стоит отдельной строкой среди промежуточных злодеев. Для матки такого же разграничения не сделано. Аскизы — тоже отдельный пункт того же перечня, матка при этом «находится в церкви», и член она организации или её содержимое, не сказано. Правило принадлежности названо для одного случая и не названо для соседнего того же рода.</p></div>", "r": [["Матка Аскизы", "PS-0301.html"], ["Виктор", "PS-0308.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0061-S03", "GR-0061--obschie-sposobnosti-gruppy"], "h": "<p>Про паладинов сказано ровно одно свойство и одно ограничение, и они парные.</p>\n<p>Сила: «паладины до хрена сильный». Никаких пределов, приёмов, оружия или способностей сверх этого не названо.</p>\n<p>Ограничение: «но их ней движения предсказуемый. Они больше как роботы с повторяющими движениями». То есть слабость паладинов — не в мощности, а в рисунке боя: движения повторяются, и потому читаются. В версии от 2025-12-06 та же мысль записана как «движения предсказуемые: они как роботы с повторяющимися движениями».</p>\n<p>Источник этой пары свойств лежит в механике оживления. Виктор верит в красный ток (<a href=\"SP-0248.html\">Красный ток</a>), «что оживляет людей», и «он многих оживил, но разум так и не смог в них оживить». Позже это же сказано жёстче (2025-12-06, id 393308): Виктор «воскрешает трупы, ну точнее делает из них марионеток». Природа самого «тока» в переписке не объяснена.</p>\n<p>Способностей, общих для верующих-людей церкви (не паладинов), в переписке не названо.</p>", "r": [["Красный ток", "SP-0248.html"]]}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0061-S04", "GR-0061--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p>Различий между отдельными паладинами не названо: они описаны как однородная масса — сильные, роботоподобные, с повторяющимися движениями. Ни одного паладина с именем, отдельной способностью или отличием от прочих в переписке нет.</p>\n<p>Различие внутри церкви названо одно и проходит не между паладинами, а между паладинами и маткой. Паладины — мёртвые, поднятые чужой волей, без разума. Матка — живая, и она не оружие, а предмет веры: ей поклоняются, а её детей «считают святыми». Матка описана отдельно (2025-10-20, id 376401; 2025-11-05, id 382108): бывшая аксолотль, мутировавшая после падения метеорита в её водоём и начавшая производить Оам, ростом четыре метра и такой же ширины, «больше похожая на червя с огромными количествами лапок», с белоснежной кожей; выделяет детей из яиц «подобное муравьиной матки». В этих двух ранних версиях церковь ещё не упомянута — матка привязана к церкви только 2025-12-06.</p>", "r": []}, {"t": "Иерархия", "a": ["S05", "GR-0061-S05", "GR-0061--ierarhiya"], "h": "<p>Внутренней иерархии церкви в переписке нет: ни главы, ни жрецов, ни командиров паладинов не названо. Кто отдаёт паладинам приказы после того, как Виктор их поднял, осталось нерешённым.</p>\n<p>Место церкви в иерархии сил мира названо. В перечне (2025-11-17, id 385768; повторно 2025-12-06, id 393287) сверху стоят коты — «Их 9. они сильнеший», ниже апостолы — «вторая по силе раса на земле», а дальше идёт блок «расы и организации который равны по силе с друг другом», и церковь стоит именно в этом блоке, наравне с Детьми мирового древа, Поротаями, Азуриэль, группировкой сестры, правительской организацией, организацией Виктора, пернатыми, орденом для убийства котов, вампирами и Аскизами.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S06", "GR-0061-S06", "GR-0061--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>Виктор и его организация (<a href=\"PS-0308.html\">Виктор</a>).</strong> Ключевая связь и одновременно единственная механическая. Виктор оживил паладинов «для верующих». При этом организация Виктора — отдельный пункт перечня, а не часть церкви. Договор, плата, подчинение, причина, по которой он это сделал, в переписке не названы.</p>\n<p><strong>Аскизы и матка (<a href=\"PS-0301.html\">Матка Аскизы</a>).</strong> Матка находится в церкви, ей поклоняются, её детей считают святыми. Первая форма этой связи появилась ещё до того, как церковь и матка были сведены в одно место: в перечне от 2025-11-17 (id 385768) стоит «Аскизы. Матка Аскизов стало предметом веры для какой-то верологий» — вера названа, но не сказано, что это именно церковь с паладинами. Отождествление «какой-то верологии» с этой церковью произошло 2025-12-06 (id 393465).</p>\n<p><strong>Промежуточные злодеи.</strong> Церковь входит в один слой с Детьми мирового древа и кланом крылатых (Серафим), а также с людьми и Виктором (2025-12-06, id 393305–393308). Отношения внутри этого слоя не разбирались — это перечисление, а не союз.</p>\n<p><strong>Основные злодеи.</strong> Названы отдельно и с церковью не связаны: сестра, «ну теперь дочь имитатора (Имита)», и человек — Бог красок, который «лишь образ» (id 393313–393314).</p>\n<p><strong>Апостолы, коты и прочие силы.</strong> Никаких контактов церкви с ними в переписке не названо.</p>", "r": [["Виктор", "PS-0308.html"], ["Матка Аскизы", "PS-0301.html"]]}, {"t": "Как менялась — по датам", "a": ["S07", "GR-0061-S07", "GR-0061--kak-menyalas"], "h": "<p><strong>2025-11-17 (id 385768–385769).</strong> Церковь заведена одной строкой в общем разборе рас и организаций мира. Сразу дано всё: паладины — мёртвые рыцари, оживлены «одним челиком» для верующих, «до хрена сильный», движения предсказуемые, «как роботы с повторяющими движениями». Следующей строкой заведена отдельная организация того же челика, ему дано имя — «Давай челика назовём Виктор» — и заведён красный ток: Виктор в него верит, ток «оживляет людей», «он многих оживил, но разум так и не смог в них оживить». В этом же перечне отдельно, в строке про Аскизов, сказано, что матка Аскизов «стало предметом веры для какой-то верологий», но с церковью она пока не связана.</p>\n<p><strong>2025-12-06, 17:36 (id 393286–393290).</strong> Весь перечень повторён почти дословно при возврате к миру: «Давай вспомним», «В нашем мире Оэм уже существует много сторон для конфликта». Формулировка про церковь та же. Изменений нет, но в справочнике эта версия зафиксирована отдельно — состояние на дату подтверждено.</p>\n<p><strong>2025-12-06, 17:49–17:50 (id 393305–393310).</strong> Расстановка сторон конфликта. Промежуточными злодеями названы Дети мирового древа и клан крылатых (Серафим), затем добавлено: «Ну или церкви, да и люди иногда». Отдельной репликой в тот же слой попадает Виктор — «что воскрешает трупы, ну точнее делает из них марионеток». Здесь же уточнена и природа паладинов: не воскрешение, а марионетки.</p>\n<p><strong>2025-12-06, 21:43–21:45 (id 393464–393467).</strong> Матка помещена в церковь: «Матка. Находиться в церкви. И люди им поклоняются, а детей маток считают святыми». Церковь получает второе содержимое помимо паладинов, а прежняя формулировка «предмет веры для какой-то верологий» получает адрес. Разговор в этом месте сразу уходит на другую тему — на вопрос Имиты об Оам, — и церковь дальше не обсуждается.</p>\n<p>Более поздние версии базы (2026-02-06 — 2026-02-07, id 429348–429816), где Оам собирали в документ через нейросеть, церковь не затрагивают: там речь о вселенной «Семь островов» и о полноте выгруженного материала — «Че то мало информация оказывается о ОЭМ», «ой, ч не все чет кинул видимо».</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "GR-0061-S08", "GR-0061--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет: ни одного члена церкви, ни одного паладина по имени не названо.</li>\n<li>Численность паладинов не названа. Численность общины верующих не названа.</li>\n<li>Названия церкви как организации нет: она проходит по описанию — «Церковь с паладинами». Название веры тоже не дано, в первой версии стоит только «какой-то верологий».</li>\n<li>Внутренняя иерархия не названа: главы, жрецов, командиров нет. Кто управляет паладинами, осталось нерешённым.</li>\n<li>Отношения церкви с Виктором не разобраны: неизвестно, оживил ли он паладинов по заказу, по собственной вере или как-то ещё, платит ли церковь ему чем-то, подчиняются ли паладины ему или церкви.</li>\n<li>Как матка попала в церковь и как она там содержится — в переписке не сказано. Не сказано и того, знает ли церковь, что матка — мутировавшая аксолотль.</li>\n<li>Отношения между маткой и паладинами не описаны.</li>\n<li>Природа красного тока не объяснена (помечено как неясность в обеих версиях материала о нём).</li>\n<li>География не названа: где стоит церковь, в переписке не сказано; про Аскизов прямо сказано «Я не знаю где они живут».</li>\n<li>Цели церкви, её доктрина и то, за что именно она отнесена к промежуточным злодеям, не разобраны — есть только сама пометка «Ну или церкви, да и люди иногда».</li>\n<li>Что значит «детей маток считают святыми» на практике — как церковь с ними обращается, учитывая, что дети-Аскизы, по описанию, едят людей и «инстинкт голода выше разума», — в переписке не сказано.</li>\n<li>Отклонённых вариантов по церкви в переписке нет: ни один пункт про неё не предлагался и не забраковывался, формулировка от 2025-11-17 дожила до последнего упоминания без правок.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0061--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0301.html\">Матка Аскизы</a>, <a href=\"PS-0308.html\">Виктор</a></li>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0248.html\">Красный ток</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0061--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0061.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0061-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0061/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Чинить первым надо не церковь, а Виктора. <code>PS-0308</code> — самый нагруженный узел этой ветки: на него ссылаются четыре статьи (сама церковь, <code>GR-0062</code> «Паладины», <code>GR-0063</code> «Организация Виктора», <code>SP-0248</code> «Красный ток»), а материала под ним всего 9,2 КБ. Рядом <code>SP-0248</code> — три ссылки, 8,2 КБ, и природа тока в обеих версиях помечена как неясность. И <code>MR-0173</code> («Организация Виктора») — две ссылки, 4,1 КБ. То есть вся боевая сила церкви держится на трёх записях общим объёмом 21,5 КБ, и самая тонкая из них — та, на которую ссылаются чаще всего. Пока не сказано, кто командует паладинами после подъёма, ни одна из четырёх статей не может сказать о них ничего сверх «сильные, но предсказуемые».</p>\n<p>Для сравнения — соседи церкви по тому же блоку «равных по силе»: <code>MR-0129</code> (Азуриэль) — 51,6 КБ базы, <code>PS-0300</code> (Аскизы) — 33,8 КБ, <code>MR-0161</code> (Дети мирового древа) — 32,8 КБ. Под самой церковью — <code>MR-0172</code>, 13,5 КБ. Церковь не пустая, она просто вдвое-вчетверо легче тех, с кем поставлена вровень.</p>\n<p>Отдельно, поверх этой статьи: самая дорогая дыра всей вселенной — <code>SL-0054</code> («Список 12 апостолов»): семь входящих ссылок, 234 КБ базы и ни одной статьи. Церковь она задевает по касательной — апостолы стоят в том же перечне сил строкой выше, — но пока эта запись не разобрана, весь верх иерархии Оам («коты сильнейшие, апостолы вторые») висит на нерасписанном материале. Туда же <code>SL-0125</code> («Список нерешённых вопросов по миру Оэм»): одна ссылка, 3,9 КБ, статьи нет — а это буквально перечень того, что авторы сами считали незакрытым.</p>\n<h3>С чего начать</h3>\n<p>В базе, не в архиве. Материал по церкви разъехался по шести записям: <code>MR-0172</code> — сама церковь (13,5 КБ), <code>GR-0062</code> — паладины отдельной статьёй, <code>PS-0308</code> и <code>MR-0173</code> — оживитель и его организация, <code>SP-0248</code> — механика, <code>PS-0301</code> и <code>PS-0300</code> — содержимое (матка 21,3 КБ, Аскизы 33,8 КБ). Про то, что в церкви лежит, материала вчетверо больше, чем про саму церковь. Первое действие — свести <code>PS-0308</code> с <code>MR-0173</code>: персонаж и его организация описаны врозь, а вопрос «по заказу или по своей вере он поднял паладинов» находится ровно между ними.</p>\n<p>Названия, иерархии и географии нет ни в одной из семи записей — это уже в архив. Ориентиры: 2025-11-17 вокруг id <code>385768</code> (первый перечень рас и организаций, где церковь заведена одной строкой) — смотреть, обсуждали ли перечень до и после самой выкладки; 2025-12-06, 21:43–21:45 (<code>393464</code>–<code>393467</code>), где матку поместили в церковь и разговор тут же ушёл на вопрос Имиты об Оам — проверить, вернулись ли к теме позже в тот вечер; и окно 2026-02-06/07 (<code>429348</code>–<code>429816</code>), где Оам выгружали в документ и Слава сам сказал «Че то мало информация оказывается о ОЭМ» и «ой, ч не все чет кинул видимо» — там могло остаться невыгруженное.</p>\n<h3>Как развивалось</h3>\n<p>Заявили одной строкой 2025-11-17, и сразу целиком: и паладины, и их сила, и их слабость, и тот, кто их поднял, — всё в одном предложении. Через три недели, 2025-12-06 в 17:36, тот же перечень повторили почти дословно при возврате к миру («Давай вспомним») — без единой правки. В 17:49 уточнили вниз: церковь попала в промежуточные злодеи, а оживление переформулировали жёстче — не воскрешение, а «делает из них марионеток». В 21:43 дописали содержимое: матка помещена в церковь, и прежняя «какая-то верология» из ноябрьской строки получила адрес. На этом нить обрывается — разговор в ту же минуту уходит на вопрос Имиты. В феврале 2026, когда Оам собирали в документ, церковь не всплыла ни разу.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Про Виктора разграничение проговорено прямо: церковь и организация Виктора — разные пункты перечня, паладины у церкви, но сам он в её состав не входит и стоит отдельной строкой среди промежуточных злодеев. Для матки такого же разграничения не сделано. Аскизы — тоже отдельный пункт того же перечня, матка при этом «находится в церкви», и член она организации или её содержимое, не сказано. Правило принадлежности названо для одного случая и не названо для соседнего того же рода.</p>\n<h3>Отклик</h3>\n<p>Зацепило, что сила и её слабость выданы одним дыханием, в первой же строке: «до хрена сильный, но их ней движения предсказуемый. Они больше как роботы с повторяющими движениями». Слабость не в мощности — мощность как раз запредельная, — а в рисунке: движения повторяются, значит читаются, значит их можно обыграть, не будучи сильнее. Это дешёвая по словам и очень рабочая механика, из неё сразу видно, как выглядит бой с ними. И она не выдумана отдельно, а вытекает из причины: разум оживить не смогли, остались марионетки — предсказуемость не свойство, а последствие. Второе, что стоит рядом и не сведено: в одном здании — мёртвое войско без разума и живая матка, которой поклоняются, а её детей считают святыми, при том что дети эти едят людей и «инстинкт голода выше разума». Святыня, которая ест прихожан, — на месте, никем не прокомментирована и оттого только сильнее.</p></div>", "r": []}];</script>
