<script>const BASE="";const DOCNAME="Бесцветные и Цветные";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0090-S01", "GR-0090--chto-eto"], "h": "<p>Не отряд, не организация и не команда, а базовое деление всех носителей абакры на два разряда. Определение дано Славой одной репликой (2024-05-25, id 173152): «Бесцветный ( владельцы абакра но без эксклюзивный абилки ) / Цветный ( владельцы абакра но с абилкой». Абакра при этом — общее название системы сил вселенной, концепция Миколая, на которую соавторы решили опираться (2024-05-25, id 173114–173120); название придумано из скороговорки «краба, краба, краба, абакр, абакр, абакра» (id 173127). Слава сразу оговорил, что название системы «возможно будущем изменим но пока оставим» (id 173123).</p>\n<p>От этого же деления идёт название вселенной: вариант «Цветной мир» предложил Слава (2024-05-25, id 173342), Миколай ответил «Идеально» (id 173346).</p>\n<p>Обе категории описаны как разряды, к которым персонажи принадлежат, а не как объединения с составом, целями и внутренними связями. Поимённо в переписке названы только Цветные; ни один Бесцветный по имени не назван.</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0090-S02", "GR-0090--sostav"], "h": "<p>В разряд прямо отнесены четверо — все Цветные:</p>\n<ul>\n<li><a href=\"PS-0077.html\">Командир</a> — Командир. «Первый удачный эксперимент для превращение бесцветного в цветной» (2024-05-25, id 173148).</li>\n<li><a href=\"PS-0079.html\">Волк</a> — Волк. Один из трёх удачных экземпляров эксперимента (2024-05-25, id 173165).</li>\n<li><a href=\"PS-0078.html\">Тен</a> — Тен (многоликий). Один из трёх удачных экземпляров эксперимента (2024-05-25, id 173165).</li>\n<li><a href=\"PS-0084.html\">ГГ — мальчик без имени</a> — ГГ, мальчик без имени. К Цветным отнесён не через эксперимент: «судьба обратила на него внимания и дала ему пробудится цветным» (2024-05-25, id 173353).</li>\n</ul>\n<p>Поимённого состава Бесцветных нет. Про них сказано только количественно — их «бо́льшее количество» (id 173163).</p>\n<p>Перечень имён и способностей, надиктованный Славой в том же окне (2024-05-25, id 173128): «Энергет, прятки, закон, петля, феникс, Тен, волк, дракон, ци, имитатор, спартанец, вампир, драгоценность, бессмерт, жук, лёд, Дилан, граница, солнце». Кроме Тена и Волка, никто из этого перечня к разряду Бесцветных или Цветных в переписке не приписан.</p>", "r": [["Командир", "PS-0077.html"], ["Волк", "PS-0079.html"], ["Тен", "PS-0078.html"], ["ГГ — мальчик без имени", "PS-0084.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0090-S03", "GR-0090--obschie-sposobnosti-gruppy"], "h": "<p>Общее для обоих разрядов — владение абакрой. Разряды разделены по одному признаку: наличию или отсутствию «эксклюзивной абилки».</p>\n<p>Про Бесцветных сказано прямо: «То бишь бесцветный могут только усиливать тело и все» (2024-05-25, id 173153). Усиление тела — весь их доступный набор.</p>\n<p>Механика носителя абилки разобрана Миколаем на клеточном уровне (2024-05-25, id 173155–173159): «Абилка во первых выражается в клетках», «Которые как раз содержат информацию о ней», следовательно «Бесцетные не имеют таких клеток». Слава попросил закрепить формулировку (id 173160).</p>\n<p>Отдельно Миколаем введено понятие «полуактивная абакра» (2024-05-25, id 173201–173203) — на примере отца в альтернативной вселенной: «И способность реализовать негатив нанося вред врагу тем самым». К какому из двух разрядов относится полуактивная абакра, в переписке не сказано.</p>\n<p>Умеют ли Цветные усиливать тело так же, как Бесцветные, не сказано; про усиление тела говорится только применительно к Бесцветным.</p>", "r": []}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0090-S04", "GR-0090--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p>Между разрядами:</p>\n<ul>\n<li>Наличие клеток с информацией об абилке. У Бесцветных таких клеток нет (id 173159).</li>\n<li>Численность. Бесцветных больше — Миколай спросил «И их бо́льшее количество?» (id 173163), Слава подтвердил.</li>\n</ul>\n<p>Внутри Цветных различаются пути попадания в разряд:</p>\n<ul>\n<li>Через эксперимент по превращению бесцветного в цветного — Командир, Волк, Тен. За 30–50 лет только три удачных экземпляра (2024-05-25, id 173165).</li>\n<li>Через пробуждение — ГГ-мальчик, «дала ему пробудится цветным» (2024-05-25, id 173353). Пробуждение описано как событие, меняющее судьбу: до него у мальчика «не было ничего не имени не семьи ни друзей не дома не вещей», после — «в мальчики проснулась жадность он захотел больше».</li>\n</ul>\n<p>Отдельно оговорено, что Командир — «первый удачный» из трёх, то есть внутри самой тройки есть порядок.</p>", "r": []}, {"t": "Иерархия", "a": ["S05", "GR-0090-S05", "GR-0090--ierarhiya"], "h": "<p>Внутри разрядов иерархия не расписана. Названы только отдельные положения:</p>\n<ul>\n<li>Командир — «командир сильнейшего отряда», «И он в теорий сильнейший» (2024-05-25, id 173147).</li>\n<li>Он же — первый удачный экземпляр эксперимента (id 173148).</li>\n<li>Слава про Командира: «Грубо говоря он будет означать добро реальной добро» (2024-05-25, id 173177). Гг он при этом не является: «Нет», «Он будет редко появляться» (id 173325–173326).</li>\n</ul>\n<p>Ни у Волка, ни у Тена, ни у мальчика места в какой-либо иерархии разряда не указано.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S06", "GR-0090-S06", "GR-0090--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>Люди и сверхлюди.</strong> Названа война между ними, остановленная Командиром: «ко крастоки этот командир остановил войну между людьми и со сверхлюдми» (2024-05-25, id 173175). Слово «сверхлюди» в этом окне звучит как обозначение носителей сил, но отдельным термином авторы его не закрепляли и с Цветными прямо не отождествляли.</p>\n<p><strong>Неудачные экземпляры эксперимента.</strong> Из той же программы опытов выходят те, кто не стал Цветным: «Да больше миллиона умерло» (id 173167), «Или не в состояний двигаться» (id 173168), «Да некоторые умерли некоторый парализовала» (id 173173). Миколай предложил добавить ветку мутантов: «А может мутации ещё» (id 173169), «Ну типа неудачный эксперимент повредил там нейроны и чел вышел из под контроля» (id 173171), «Он уже типа не человек» (id 173172). Слава ответил: «А про мутантов вообще можно что нибудь замутить» (id 173173). Дальше этого согласия ветка мутантов в окне не разработана; отношения мутантов с Бесцветными и Цветными не описаны.</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S07", "GR-0090-S07", "GR-0090--kak-menyalas"], "h": "<p>Вся работа над делением укладывается в одно окно, 2024-05-25.</p>\n<p><strong>2024-05-25, 13:52–13:58 (id 173114–173129).</strong> Выбрана опорная система сил: Миколай спрашивает «Мы получается мою берём? Где абакра, все дела», Слава — «Дадада». Рассказано происхождение слова «абакра». Оговорка Славы, что название могут потом сменить.</p>\n<p><strong>2024-05-25, 14:09–14:11 (id 173146–173152).</strong> Командир заявлен как «первый удачный эксперимент для превращение бесцветного в цветной». Тут же, отвечая на вопрос о способности Командира, Миколай выдаёт первые ассоциации — «дыра черная», «фольга мятая»; способность в этом окне так и не выбрана. Следом Слава даёт определение двух разрядов (id 173152).</p>\n<p><strong>2024-05-25, 14:12–14:15 (id 173153–173164).</strong> Уточнение: Бесцветные «могут только усиливать тело и все». Механика клеток от Миколая, вывод «Бесцетные не имеют таких клеток», фиксация, что Бесцветных больше.</p>\n<p><strong>2024-05-25, 14:15 (id 173165).</strong> Названы все три удачных экземпляра: «Это командир, волк, Тен( многоликий) / За все 30-50 лет».</p>\n<p><strong>2024-05-25, 14:16–14:18 (id 173166–173173).</strong> Цена эксперимента: больше миллиона умерших, парализованные. Предложение Миколая про мутантов и вышедших из-под контроля нелюдей, согласие Славы.</p>\n<p><strong>2024-05-25, 14:20–14:21 (id 173175–173177).</strong> Война людей и сверхлюдей, остановленная Командиром; Командир как «добро реальной добро».</p>\n<p><strong>2024-05-25, 14:34–14:41 (id 173201–173204).</strong> Миколай вводит «полуактивную абакру» на примере отца в альтернативной вселенной. Слава в ответ даёт отцу способность реинкарнации: «каждый раз как он умирал он оказался в новом теле и так на протяжении 1000 лет», с сохранением способностей каждого тела. К разрядам Бесцветных и Цветных эти реплики прямо не привязаны.</p>\n<p><strong>2024-05-25, 15:18–15:31 (id 173306–173347).</strong> Подбор названия вселенной. Вариант Миколая «Не сахар» отвергнут Славой: «Точно не это» (id 173314). Вариант Славы «Паладин» — от образа Командира, «он типа добро» (id 173318–173321) — не принят. Принято «Цветной мир» (id 173342–173346), то есть название вселенной выведено из этого самого деления. Тут же зафиксировано состояние вселенной: «Не знаю мы только персонажей и систему сил продумали», «Да у меня даже нет гг чтобы пихнуть ему двигатель сюжета» (id 173331–173332).</p>\n<p><strong>2024-05-25, 16:18 (id 173353).</strong> Механика применена повторно и в другом виде: мальчик без имени пробуждается Цветным без всякого эксперимента.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "GR-0090-S08", "GR-0090--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава Бесцветных нет — ни одного имени, только «их бо́льшее количество».</li>\n<li>Кто ставил опыты по превращению бесцветного в цветного — лаборатория, государство или кто-то ещё — в этом окне не названо.</li>\n<li>Не сказано, умеют ли Цветные усиливать тело; усиление тела приписано только Бесцветным.</li>\n<li>Способность Командира не выбрана: на вопрос Славы прозвучали только первые ассоциации Миколая («дыра черная», «фольга мятая»), решения нет.</li>\n<li>Ветка мутантов из неудачных экземпляров осталась нерешённой: есть предложение и согласие «можно что нибудь замутить», разработки нет.</li>\n<li>Термин «сверхлюди» (id 173175) с Цветными прямо не отождествлён и как отдельное понятие не закреплён.</li>\n<li>К какому разряду относится «полуактивная абакра» — не сказано.</li>\n<li>Персонажи из перечня id 173128 (Имитатор, Спартанец, Дракон, Ци, Энергетик и прочие) к разрядам не приписаны.</li>\n<li>Механизм пробуждения Цветным (как у мальчика без имени) не объяснён: сказано только, что «судьба обратила на него внимания».</li>\n<li>Как соотносятся между собой два пути в Цветные — эксперимент и пробуждение — в переписке не разобрано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0090--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0077.html\">Командир</a>, <a href=\"PS-0078.html\">Тен</a>, <a href=\"PS-0079.html\">Волк</a>, <a href=\"PS-0084.html\">ГГ — мальчик без имени</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0090--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0090.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0090-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0090/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — <code>SL-0012</code>, «Тезаурус вселенной»: статьи нет, 5,5 КБ базы, две входящие ссылки (<code>VS-0012</code>, <code>VS-0014</code>). Задуман он был ровно под то, чем эта статья и является: «Ну типа человек со способностью называется так \"...\", суперспособность по другому это \"...\"» (173102, 13:49). Через двадцать минут после этого разговора Слава выдаёт «Бесцветный / Цветный» (173152) — первую и единственную статью словаря, который так и не завели. Все незакрытые термины отсюда — «сверхлюди», «полуактивная абакра», «абилка» — упираются в запись без статьи, и она же единственное место, где видно, что термины во вселенной решили вести системно.</p>\n<p>Второе — <code>SP-0064</code>, «абакра»: пять входящих ссылок, статья 12,2 КБ, базы 8,4 КБ, и всё из одного окна. При этом сама механика абакры разобрана на 18,3 КБ в <code>SP-0059</code> («Лиомат», «игра бога», четыре ссылки) — там железа, лиомат, гелиогормоны, рудимент. Реплика 173118 «Мы получается мою берём? Где абакра, все дела» ссылается именно на тот текст, а связи между записями нет. Дыра дорогая потому, что на абакру опирается вся вселенная, и клеточное объяснение из 173155–173159 сейчас читается как придуманное на ходу, хотя у него есть предыстория.</p>\n<p>Третье — <code>MR-0010</code>, «Эксперименты по превращению бесцветного в цветного»: пять ссылок (<code>PS-0077</code>, <code>MR-0009</code>, <code>MR-0011</code>, <code>VS-0012</code>), статья есть, а базы всего 5,1 КБ. Оба висящих пробела — кто ставил опыты и что стало с мутантами — должны лежать там, и там их нет. Это тот случай, когда дыра не в сборке, а в переписке.</p>\n<p>Отдельно: сущности «сверхлюди» в «Цветном мире» нет ни одной строки, хотя слово звучит и здесь, и в <code>PS-0077</code>, и в <code>PS-0085</code>. Ссылаться не на что.</p>\n<h3>С чего начать</h3>\n<p>Часть материала уже в базе, просто разложена по другой вселенной. Окно w0033, 2024-05-09: id 167303 и 167322 — два длинных сообщения Миколая, где абакра изложена целиком (железа, лиомат из обычной энергии, гелиогормоны, рудимент), и id 167795–167798, 2024-05-10, где звучит «люди с активной абакрой». Это за шестнадцать дней до окна этой статьи. Лежит в <code>SP-0059</code> и <code>ID-0056</code> («Мифы как летописи людей с активной абакрой», 2,2 КБ, статьи нет). К пробелу «к какому разряду относится полуактивная абакра» это относится напрямую: слово «активная» применительно к абакре придумано не 25 мая, и что ему противопоставлялось, видно там.</p>\n<p>Дальше по базе: <code>MR-0009</code> (5,5 КБ, то же деление под другим видом — мир, а не группа), <code>MR-0010</code>, <code>PS-0084</code> (пробуждение мальчика, 173353), <code>ID-0061</code> («Паладин», 2 КБ, статьи нет — отвергнутое название, выведенное из того же деления).</p>\n<p>Архив по этой линии, скорее всего, исчерпан: после 2024-05-25 вселенная не обсуждается до 2024-07-31, когда её откладывают одной строкой (<code>VS-0012</code>, id 213577). Ловушка при поиске по слову: «бесцветная» встречается 2024-07-04 (w0042, id 196142–196145), но там это имя персонажа в «отряде белых» островной линии, к разрядам отношения не имеющее.</p>\n<h3>Как развивалось</h3>\n<p>13:48 — предложен тезаурус, чтобы термины не забывались. 13:52 — выбрана опора: берут абакру Миколая, с оговоркой «возможно будущем изменим но пока оставим». 14:11 — деление заявлено одной репликой: бесцветный без эксклюзивной абилки, цветный с ней. 14:12–14:15 — сразу ограничено: бесцветные «могут только усиливать тело и все», абилка живёт в клетках, у бесцветных таких клеток нет, и бесцветных больше. 14:16–14:18 — названа цена: больше миллиона умерших, парализованные, согласие «про мутантов вообще можно что нибудь замутить». 14:34 — введена «полуактивная абакра» и ни к одному из разрядов не привязана. 15:31 — из деления выведено и принято название вселенной. 16:18 — механика применена второй раз и другим способом: мальчик пробуждается цветным без всякого эксперимента, сверки с первым способом нет. Дальше — не вернулись: ни тезаурус, ни мутанты, ни полуактивная абакра больше не звучат, а 2024-07-31 вселенную откладывают.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Про «абакру» оговорка сделана явно и в ту же минуту, когда название принято: «Возможно будущем изменим но пока оставим» (173123). То есть для имени системы сил правило пересмотра проговорено — оно рабочее, временное, его можно менять.</p>\n<p>Для «бесцветный / цветный», данных двадцатью минутами позже, такой оговорки нет. И для названия вселенной, выведенного прямо из них (173342–173346), тоже. Хотя это термины того же рода и держатся один на другом: имя вселенной стоит на делении, деление — на абакре, у которой снизу подписано «пока». Где кончается «пока» и начинается закреплённое, сказано ровно один раз и только про нижний слой.</p>\n<h3>Отклик</h3>\n<p>Самое сильное здесь — как быстро название превратилось в правило. Слава даёт две строки в скобках, чистая номенклатура: у одних есть эксклюзивная абилка, у других нет. И Миколай за три минуты подводит под них биологию — абилка выражается в клетках, клетки несут информацию о ней, значит у бесцветных таких клеток просто нет. Слава тут же просит закрепить формулировку. Из слова получился механизм, и видно поимённо, кто какую половину внёс.</p>\n<p>Второе, что зацепило, — два входа в один разряд, стоящие рядом и стоящие разного. В 14:15 названа цена первого: тридцать-пятьдесят лет, миллион с лишним мёртвых, трое удачных. В 16:18 тот же порог берётся так: «судьба обратила на него внимания и дала ему пробудится цветным». Мальчик, у которого «не было ничего не имени не семьи ни друзей не дома не вещей», получает даром то, за что заплачено миллионом. Авторы этого не сопоставляли и, кажется, не заметили — но контраст в тексте уже стоит, и он сильнее всего, что вокруг него написано.</p></div>", "r": []}];</script>
