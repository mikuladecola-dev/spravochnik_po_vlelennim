<script>const BASE="";const DOCNAME="Одержимый";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0203-S01", "PS-0203--proishozhdenie"], "h": "<p>Одержимые появляются в переписке 2025-02-25 (id 295552–295560, окно w0077) как отдельная категория, о которой Слава напоминает Миколаю. Разговор начинается с реплики Миколая «я могу тебе помогать там где у тебя могут быть трудности», после чего Слава пишет: «Одержимый», «Ты не забыл», «Благословенный ада», «Которых 9». Миколай отвечает «я прекрасно помню» и затем «всё это время в голове держу».</p>\n<p>Формулировка «Благословенный ада» и число «9» даны Славой подряд, следом за словом «Одержимый»; как именно они соотносятся с категорией — в переписке не разъяснено.</p>", "r": []}, {"t": "Связи с другими", "a": ["S02", "PS-0203-S02", "PS-0203--svyazi-s-drugimi"], "h": "<p>Одержимые стоят рядом с благословенными: категория названа сразу после напоминания о благословенных и в общем списке идёт отдельным разделом под благословенными. Чем одержимые отличаются от благословенных, в окне не сказано.</p>\n<p>Единственное имя, стоящее под категорией в списке от 2025-02-25 (id 295559), — Гурман:</p>\n<pre><code>Одержимый:\nГурман\n</code></pre>\n<p>Тот же список (id 295559) содержит и другие разделы, среди которых Одержимый стоит вторым: Благословенный (14 пунктов, от Имитатора до Маэстро), Враг, Церковь, Военный, Сторонний силы, Семь грехов, Существа, Аномалий, Оружие, Артефакты, Идей. Раздел «Семь грехов» в этом же списке включает Чревоугодие (<a href=\"PS-0189.html\">Чревоугодие</a>) и Лень (<a href=\"PS-0190.html\">Лень</a>).</p>", "r": [["Чревоугодие", "PS-0189.html"], ["Лень", "PS-0190.html"]]}, {"t": "Как менялся — состояния по датам", "a": ["S03", "PS-0203-S03", "PS-0203--kak-menyalsya"], "h": "<p><strong>2025-02-25 (id 295552–295560, окно w0077).</strong> Единственная зафиксированная версия. Категория названа, в списке раскрыта одним пунктом — Гурман. Других состояний в переписке нет.</p>", "r": []}, {"t": "Пробелы — чего в переписке нет", "a": ["S04", "PS-0203-S04", "PS-0203--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Кто такой Гурман — не объяснено; тема уходит в следующее окно.</li>\n<li>Чем одержимые отличаются от благословенных — не объяснено.</li>\n<li>Слава говорит «Которых 9», а под категорией в списке стоит одно имя. Как это согласуется, в переписке не сказано.</li>\n<li>Способности, внешность, характер одержимых — не описаны.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0203--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0189.html\">Чревоугодие</a>, <a href=\"PS-0190.html\">Лень</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0014.html\">Одержимые</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0203--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-02-25</td>\n<td>295552–295560</td>\n<td>w0077</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0203-oderzhimyy.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0203--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0203.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0203-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0203/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дороже всего не «кто такой Гурман», а сам список, который статья цитирует. Он заведён отдельной сущностью и статьи не имеет: <code>SL-0053</code> «Список персонажей вселенной (Благословенные / Враг / Церковь / Военный / Сторонние силы / Семь грехов / Существа / Аномалии / Оружие / Артефакты / Идеи)» — шесть ссылок, статьи нет, база 20 313. Рядом та же беда: <code>SL-0051</code> «Каталог: благословенные, враги, грехи, оружие, артефакты» (шесть ссылок, статьи нет, 9 834), <code>SL-0090</code> «Реестр персонажей и сил» (четыре, нет, 5 492), <code>SL-0089</code> (четыре, нет, 1 753). Категория «Одержимый» существует только внутри этих реестров — то есть эта статья стоит на узле, у которого своей записи нет, и на нём же стоят ещё пять-шесть статей вселенной.</p>\n<p>Второе: материала про одержимых в базе много, и весь он под сущностями без статей — <code>SP-0234</code> «Одержимые» (6 663), <code>MR-0149</code> «Организации охотников на одержимых» (6 390), <code>PS-0250</code> «Одержимый с чёрными слезами» (5 605), <code>PS-0296</code> «Антиапостолы / Одержимые» (3 643). Около 22 тысяч знаков, ноль статей, ноль ссылок. Записанный здесь пробел «чем одержимые отличаются от благословенных» скорее всего закрывается этими четырьмя карточками, а не походом в архив.</p>\n<h3>С чего начать</h3>\n<p>Первым делом — расхождение внутри самого справочника. Здесь сказано, что Гурман стоит под категорией в списке от 2025-02-25, id 295559. В <code>PS-0269</code> «Гурман» сказано, что он появляется в переписке один раз и это 2025-05-14, id 325798–325801, в реестре с другим составом разделов — там «Апостолы» и нет «Семи грехов». Два разных списка, одно имя, обе записи говорят «единственный раз». Свести 295559 и 325798–325801 напрямую — одно обращение к архиву, и оно решает, к какому реестру Гурман приписан и есть ли он в обоих.</p>\n<p>Дальше — в базу: <code>SP-0234</code>, <code>MR-0149</code>, <code>PS-0250</code>, <code>PS-0296</code>. Туда же за разницей с благословенными.</p>\n<p>В архив идти только за двумя вещами: «Благословенный ада» и число 9. Если в перечисленных карточках их нет — окно w0077, 2025-02-25, сразу за 295560, вокруг перехода к Гурману, который здесь помечен как уходящий в следующее окно.</p>\n<h3>Как развивалось</h3>\n<p>Категория не вводится, а напоминается: Слава перечисляет её как то, о чём уже договорились («Ты не забыл»), Миколай подтверждает — «я прекрасно помню», «всё это время в голове держу». Значит, к 2025-02-25 она была заявлена где-то раньше, а раскрытие уже тогда откладывалось. В тот же день она попадает в список — одной строкой, при названном числе 9. Следующая точка — 2025-05-14, другой реестр, где раздел «Одержимый» снова состоит из одного имени. Между февралём и маем к содержанию не возвращались; вернулись к строке в списке.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для благословенных источник силы разведён по сторонам, и под каждую сторону заведена своя запись: <code>SP-0164</code> «Базовые умения благословенных бога», <code>SP-0165</code> «Базовые умения благословенных дьявола», <code>SP-0240</code> «Благословение правителя». Правило «у благословения есть тот, кто благословляет, и он назван» в мире проговорено. Для одержимых сторона не названа нигде, хотя сказанное в том же ряду «Благословенный ада» её прямо предполагает. Для соседней категории правило есть, для этой такого же рода — нет.</p>\n<h3>Отклик</h3>\n<p>Сильное место здесь одно, и оно не про мир: «Одержимый» — «Ты не забыл» — «я прекрасно помню» — «всё это время в голове держу». Это разговор двух людей, у которых общий мир живёт в основном как память друг о друге, и один проверяет другого не на знание, а на то, что он ещё здесь. Категория при этом так и остаётся строкой с одним именем при заявленных девяти — и в таком виде держится три месяца до следующего реестра. Забавно, что «Которых 9» единственному Гурману совершенно не мешает: число сказано вслух, и этого хватает, чтобы категория ощущалась населённой.</p></div>", "r": []}];</script>
