<script>const BASE="";const DOCNAME="Отец";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0330-S01", "PS-0330--proishozhdenie"], "h": "<p>Появился в разговоре 2025-12-09 (окно w0113) как ответ на вопрос, кто обманул сверхлюдей. Заход Слава сделал сам и потребовал вопроса от собеседника: «И ты даже не спросишь кто их наебали. Всех сверхлюдей. У которых психика все еще Окей» (id 394766). После настойчивого «Ты должен написать \" А кто это сделал?)\"» (id 394775) и ответа ответ прозвучал двумя словами: «Их Отец» (id 394779).</p>\n<p>Пишется с большой буквы — это отдельно уточнил Миколай: «у тебя всегда О с большой буквы?» (id 394783).</p>\n<p>Кем он является по отношению к сверхлюдям, уточнялось следующим заходом: он их создатель и «Ну духовные отец. Папа приёмный. ( приёмный папа 😂» (id 394803).</p>\n<p>Что он не Бог — заявлено сразу: «Не. Боги конечно есть, но они будут появляться изредка. А их отец не Бог» (id 394784).</p>\n<p>Что он такое — не раскрыто сознательно. Итоговая формулировка Славы: «Он вроде как человек, но не человек. Потом скажу при встрече» (id 394837).</p>", "r": []}, {"t": "Характер", "a": ["S02", "PS-0330-S02", "PS-0330--harakter"], "h": "<p>Единственное действие, которым он охарактеризован, — обман сверхлюдей. Механизм обмана назван прямо: «Да просто не выполняет условия контракта» (id 394817). Контракт — «Контракт на \"души\"» (id 394827), причём кавычки поставлены намеренно и на них Слава указал отдельно: «Видишь кавычки 😏» (id 394833). То есть предмет контракта — не души в буквальном смысле; что это на самом деле, не сказано.</p>\n<p>Отдельная линия — то, что Отец говорит сам. Миколай: «эм, ну релизия воспитывает уважать отца, сам Отец так говорит» (id 394804). Слава ответил «Да» (id 394805), затем «Нет» (id 394806), затем уточнил: «Отец уважает отца», «В смысле он говорит» (id 394809–394810). Однозначного положения из этого обмена не вышло.</p>", "r": []}, {"t": "Связи с другими", "a": ["S03", "PS-0330-S03", "PS-0330--svyazi-s-drugimi"], "h": "<ul>\n<li>Сверхлюди Фени — те, кого он создал, воспитал как приёмный отец и обманул. На вопрос, кто они, полулюди или люди-мутанты, Слава ответил: «Они люди» (id 394808).</li>\n<li>Контракт на «души» — договор между ним и сверхлюдьми, условия которого он не выполняет.</li>\n<li>Боги — в мире есть, но «будут появляться изредка»; Отец к ним не относится.</li>\n<li>Феня — мир, в котором всё это происходит.</li>\n</ul>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S04", "PS-0330-S04", "PS-0330--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2025-12-09, id 394766–394784.</strong> Первое появление. Заявлено: сверхлюдей наебал их Отец; он не Бог; боги в мире есть, но появляются изредка. Прямой вопрос Миколая «бог?» (id 394781) отклонён.</p>\n<p><strong>Версия 2 — 2025-12-09, id 394795–394837.</strong> Уточнено: он создатель сверхлюдей, их духовный и приёмный отец. Обман состоит в невыполнении условий контракта. Контракт — на «души», в кавычках. Сверхлюди — люди. Собственная природа Отца обозначена как «вроде как человек, но не человек» и отложена до личной встречи.</p>", "r": []}, {"t": "Отклонённые и оставленные без ответа варианты", "a": ["S05", "PS-0330-S05", "PS-0330--otklonennye-i-ostavlennye-bez-otveta-var"], "h": "<ul>\n<li><strong>Бог</strong> — прямо отклонено (id 394781 → 394784).</li>\n<li><strong>«типа как демоны?»</strong> — предположение Миколая о природе контракта (id 394829). Ответ Славы — «Прочитай снова» (id 394830) и указание на кавычки, то есть аналогия не принята.</li>\n<li><strong>Интервью через Иисуса</strong> — версия Миколая о том, как Отца узнали: «у него интервью брали через Иисуса, 2000 лет назад», «сразу несколько человек», «3 или больше» (id 394815–394818). Слава на это отреагировал не подтверждением, а сомнением в самом персонаже: «Чё-то мне теперь он меньше нравиться» (id 394820), с объяснением «Типо он мог быть шизиком. И сказать все что попало. И люди в это поверили бы» (id 394824). Принято это в канон или нет — не сказано.</li>\n<li><strong>Могут ли сверхлюди иметь потомство между собой</strong> — вопрос Миколая (id 394798) остался без ответа.</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0330-S06", "PS-0330--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Кто он такой на самом деле — сознательно не раскрыто: «Потом скажу при встрече».</li>\n<li>Что за «души» в кавычках и что на деле является предметом контракта — не сказано.</li>\n<li>Как именно душу забрать — вопрос задан (id 394831), ответа в переписке нет.</li>\n<li>Условия контракта, которые он не выполняет, не перечислены.</li>\n<li>Каким образом он создал сверхлюдей — не сказано.</li>\n<li>Могут ли сверхлюди иметь между собой потомство — не решено.</li>\n<li>Говорит ли он сам, что его надо уважать, — обмен репликами закончился без определённого ответа.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0330--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0080.html\">Сверхлюди (Феня)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0330--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-12-09</td>\n<td>394766–394784</td>\n<td>w0113</td>\n<td>Феня (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-09</td>\n<td>394795–394837</td>\n<td>w0113</td>\n<td>Феня (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0330-otec.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0330--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0330.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
