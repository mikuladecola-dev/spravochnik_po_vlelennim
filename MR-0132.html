<script>const BASE="";const DOCNAME="Нимб";
const LEAD="<p>«Нимб» — одновременно организация и каркас сеттинга: Слава разрабатывает её и как действующее лицо внутри мира, и как то, вокруг чего мир построен. Варианты имени, встречающиеся в переписке: «НБО», «нимб банк объектов», «организация \"нимб\"». Материал охватывает 2025-04-08 — 2026-06-07, окна w0087, w0088, w0120, w0121.</p>";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0132-S01", "MR-0132--ustroystvo"], "h": "<p>Организация «Нимб» официально появилась 11 июня 2003 года (2025-04-08, id 317240–317241). Это фармацевтическая компания: «У ней есть свои фармацевтический заводы, фабрики, А также больницы и аптеки, ветеринарный клиники» (id 317243).</p>\n<p>Репутация: «Известно своими качественными товарами и услугами», «Способны излечить даже рак», «Или отрастить конечность». «Что бы полечиться в нимбе к нам ездять даже иностранцы» (id 317244–317247). Есть контракт с армией (id 317248).</p>\n<p>Правовое положение: «Хотя формально они правительства организация, но на деле они свободная организация» (id 317249).</p>\n<p>Вторая сторона деятельности вводится словами «А теперь же к сладкому»: «Они типа сцп» (id 317250–317251). Нимб ловит разные объекты «виде чернышей и медузы» и «на основе их ней крови или чего-нибудь другого создають разный препараты» (id 317252–317253). Также «проводят эксперименты над людьми» — «Чаще всего над преступниками», «Но бывает и над сиротами» (id 317254–317256).</p>\n<p>Собственное определение Славы: «Грубо говоря это организация сцп только измененая под мои рамки» (id 317258). При этом объекты не являются официальными SCP: на реплику Миколая «это аномалии, объескиы сцп» Слава отвечает «Нет», «Мои», «Личные», «Хотя они могут быть похоже», «Ведь в сцп их там дохуя» (2025-04-08, id 317446–317454).</p>\n<p>Отделы (2025-04-08, id 317257). Слава называет «три основных отдела»:</p>\n<ul>\n<li>Силовики — «ну здесь всё ясно»;</li>\n<li>Бухгалтерии;</li>\n<li>Исследования.</li>\n</ul>\n<p>Отдельно: «Ещё есть отдал Этики, который часто ругается с отделом силовиков и исследования».</p>\n<p>Основа препаратов. Сначала — «Препараты создають на основе их ней крови Типо как у яд змей» (2025-04-08, id 317306). Позже формулировка меняется: на вопрос Миколая Слава говорит «Нет крови», «Биологический жидкости» (id 317488–317490). Механика описана как «Че они просто исследует объекты и иногда исследование дают результаты и они создают препараты» (id 317479). На уточняющий вопрос, что здесь считается исследованием, Слава отвечает «Медуза», «Исследует и получают результат» (id 317484–317486). Состав препаратов не назван.</p>\n<p>Мотив — деньги. Препараты делают «именно для препаратов», «Для получение денег»; «Им не хватает денег налогоплательщиков» (id 317496–317503). На вопросы Миколая «лекарственных? / убийственных? / усиливающих?» Слава отвечает «Не только» (id 317498–317501). Контракт с армией появился «после того как их ней препараты начали показываться хороший результаты» и заключён «на создания препаратов который могут усилить (типо супер солдат)» (id 317505, 317507).</p>\n<p>Сокращение НБО. Предложено Миколаем: «дай называть нб: нимб банк», «банк объектов», «нбо» (2025-04-08, id 317467–317469). Слава соглашается: «Ок», «Нбо», но спрашивает «А че не просто нимб». Обоснование Миколая: «ну типа нимб это пошире будет», «там же они как больничка и другое» (id 317470–317474).</p>\n<p>Устройство в поздней версии (2026-06-02, id 487001). Нимб описан как организация, «что проводят эксперимент, у них в этих экспериментах нет одной цели, у них их дохрена. По типу создать искусственного сверхчеловека, создать лекарство на крови сверхчеловека и т.д.». Оговорка про этику: «ну у них есть маленький изъян их эксперимент не этичный ( и это мягко сказано) сотни тысяч людей умирают пробуя их лекарство. В экспериментах умирает ещё сотня и так далее».</p>\n<p>Результат — первый искусственный сверхчеловек Нуар, владеющий несколькими способностями и не стареющий. После этого «правительства решил расскрыть какой нимб плохое», но общество, узнав об успехе, «начало наоборот продвигать эту идею», и другие организации тоже начали пытаться создать искусственного сверхчеловека (сокращение автора — ИС). «И конечно это ни чем не кончилось. Правительство не могло разрешить проведение подобных экспериментов. А если бы разрешили. То сверхлюди конечно пошли против и это ни чем хорошим не кончилась». После Нуара удался лишь ещё один проект по созданию ИС — проект апостолов, 12 созданных ИС, «Но его уже на публику не раскрывали».</p>\n<p>До Нуара ИС «были тоже в принципе не плохие. Ну большинство из них теряли рассудок или у них появлялись дефекты тела или они умирали. Превращались в жижу ну и т. Д. Нуар первый ИС кто сохранил разум и получил способности без каких либо дефектов» (2026-06-02, id 487006).</p>\n<p>В навигационной сводке окна w0120 указано также, что Нимб «распыляет вирус, превращающий людей в чудовищ»; в приведённых в файле сообщениях этого окна такой реплики нет.</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0132-S02", "MR-0132--naselenie"], "h": "<p>Сотрудники и отделы. Силовики, бухгалтерия, исследования, отдел этики (2025-04-08, id 317257). Учёные ведут эксперименты над подопытными (2026-06-07, id 488439). В организации «и так нехватка кадрова была» — этим объяснено решение вырастить сотрудника из подопытной (там же).</p>\n<p>Подопытные. Преступники и сироты (2025-04-08, id 317255–317256). Отдельно — беременная от Имета женщина и её дочь (см. ниже).</p>\n<p>Объекты. Названы черныши и медузы (2025-04-08, id 317252). Перечисление объектов: «Медуза, черныши, серафим,..» (id 317440). Откуда объекты берутся, не придумано.</p>\n<p>Созданные Нимбом. Первый искусственный сверхчеловек Нуар; проект апостолов — 12 ИС; неудачные ИС до Нуара, терявшие рассудок, получавшие дефекты тела, умиравшие, превращавшиеся в жижу (2026-06-02, id 487001, 487006). Ещё в 2025-04-08 Миколай спрашивал про «те кого в нимб создали», называя это «так-то интересная вещь», и предполагал, что протагонисты — «то кого создали в нимбе» (id 317307, 317313–317314); ответа в переписке нет.</p>\n<p>Доима, дочь Имета (2026-06-07, id 488439). У Имитатора в подростковом возрасте «была мелкая интрижка о которой он забыл», он не знал, что девушка забеременела, и «без беспокойство покинул данный город». «Нимб захватили девушку которая была беремена от Имета. Им было интересно унаследует ли ребёнок апостола его способности». Ребёнок родился, мать умерла, «а над ребёнком начали проводить всяческий эксперименты дабы выявить если у неё особенности апостолов». Когда девочке исполнилось восемь лет, «ученный сдались и больше не тестировали её». Дальше: «Но и девочку нужно было куда-то девать. Возраст уже вышел и проводить над ней эксперименты бесполезно. Поэтому они просто решили взрастить сотрудника, у них и так нехватка кадрова была».</p>\n<p>Она выросла и является сотрудницей Нимба. «Но она так и осталась ребёнком, что мечтает о нормальной семьи. Она всё ещё та маленькая девочка что была заперта в белой комнате, читая книжки и мечтая о семье. И при этом весь этот мир ей кажется отвратным». Её цель — «воплотить свой мир. С родителями». Имета она любит, «считая его единственным дорогим и родным человеком».</p>\n<p>У Доимы есть своя организация — «это конечно громко сказано, там просто несколько сл и ис» — «о которой нимба неизвестно» (id 488439). То есть внутри Нимба существует не известная ему группа его же сотрудницы.</p>\n<p>Эксперимент Доимы (2026-06-07, id 488439). Она схватила «одного фантазера, что был на грани провалиться в свой мир», использовала артефакт и открыла путь из мира фантазёра в наш — в центре города, «ей не нравится этот мир». Со своей группой она защищала фантазёра, «что был ключом, что держит дыру открытой», пока столпы героев выводили людей и сражались с существами из другого мира; «некоторый из этих существ были очень сильными, и их также была десятки тысячи». В тот день «сначала поглотила тьма нуара», которой он «спасал граждан, убивал монстров и помогал другим героем, в радиусе 3 км», сам сражаясь с сильным существом и пытаясь убить фантазёра; «после мир окрасился черно белый и Карен начала вести ещё большую поддержку». Участвовали все столпы: Изб летал, спасал людей и бился с чудовищами, был праведник, были Клед с графом. «Суть этого эксперимента была, можно ли объединить миры. Хотя он и не удался, доима осталась довольной результатом». Дальше она будет проводить мелкие и большие эксперименты, «А в конце ну ты знаешь что будет» — что именно, в переписке не раскрыто.</p>\n<p>Продолжение линии (2026-06-07, id 488440): Имет, узнав о дочери, «не будет с ней драться или мешать ей он просто поговорить с ней по душам». Доима предложит ему стать союзниками и создать тот мир, где они вместе с матерью, «как и должно быть». Имет сперва отказывается, «ему это не особо интересно», но, узнав, что Доима поглотила камень желания («она и до камня желания была сл»), помогает — «делает всё возможное чтобы её никто не убил попутно исследуя её организм и ищет лекарство против камня желания». Доима «от заботы и беспокойство отца лишь больше утверждается изменить этот мир, чтобы отец был всегда рядом, как сейчас и чтобы у неё была мама».</p>\n<h3>Серафим как грань Нимба</h3>\n<p>Серафим назван третьим в перечне объектов Нимба («Медуза, черныши, серафим,..», 2025-04-08, id 317440) и дальше в этом контексте не разворачивается. Остальной материал по нему собран вокруг Нимба, самостоятельной единицей не является.</p>\n<p><strong>2025-01-28, id 285333–285343.</strong> Введение и полный набор сил. Задача сформулирована как «Как победить Серафима». Описание: «Ангел состоящий из крыльев и закрытыми глазами». Способности:</p>\n<ul>\n<li>контроль времени — «он может замедлить или остановить время, а ещё пресказывать будущий иногда»;</li>\n<li>свет — «он может создавать световой оружия, шары, ослеплять противника, и перемещаться со скоростью приближенной к световой»;</li>\n<li>святой огонь — «способен исцелить его или жечи всё своих противников»;</li>\n<li>манипуляции сознанием — «открыв один из глаз своих он составить жертву утонуть в собственных воспоминаниях»;</li>\n<li>телекинез — «контроль над всеми объектами».</li>\n</ul>\n<p>Идеи Миколая против него: «быть чем-то не живым», «если ты робот, или кукла у тебя нет сознания» — сам же отмечает: «но это легко контрить». Вариант с роботом отклонён Славой: «Роботов нету в этой вселенной». Дальше Миколай предлагает куклу, управлять ей телекинезом, голема.</p>\n<p><strong>2025-01-28, id 285519–285540.</strong> Внесён в реестр в раздел «Сторонний силы» рядом с Породителем и Провидцем, с перечнем сил в скобках и тремя парами крыльев: «Серафим ( манипуляция сознанием; контроль времент; управлений светом; огонь Божий)🪽🪽🪽». В том же окне Слава замечает про цепь связи: «Ну бля их сложная представить ведь в сюжете пока их не будет так как они слишком мощный, мощней Серафима».</p>\n<p><strong>2025-02-25, id 295234–295239.</strong> Первое упоминание в связи с основным миром: «Плюсом я хотел показать вирус перьев», «Так как в нашем мире он тоже будет», «Вместе с серафимом». Замечание Миколая: «но думаю крылья ещё не полностью раскрыты, только на интриге пока».</p>\n<p><strong>2025-02-25, id 295556–295560.</strong> В общем списке снова отнесён к сторонним силам рядом с Породителем и Провидцем, с тем же перечнем сил.</p>\n<p><strong>2025-05-14, id 325798–325801.</strong> Та же позиция в списке сторонних сил с перечнем из четырёх сил.</p>\n<p><strong>2025-08-30, id 359686–359688.</strong> Роль: «Есть Серафим. Но это одноразовый босс. Что появится, когда будет война с раем». На роль сквозного злодея не годится; существа из рая тоже отвергнуты: «Во первых нет так таковой цели, кроме мести. Во вторых не какой группироаонной работы не будет их же в разный места раскидает». «Нет сестра так и останется ключевым злодеем».</p>\n<p><strong>2025-12-17, id 399477–399493.</strong> Слава приносит из нейросети идею: «Например Серафим предвестник Апокалипсиса. Во вторых именно серафии перезапускает человечества» — и прикладывает её к своему: «У нас есть один Серафимчек», «Давай при его появления. Во всем мире случиться какая-то катастрофа». Открытыми оставлены вопросы «Но какая именно» и «И будут ли другие Серафимы». Возражение Миколая: «вообще Серафим это профессия», «а не конкретное существо»; позже уточняет — «ну типа не столько профессия, но должность».</p>\n<p><strong>2025-12-17, id 399494–399499.</strong> Ответ Славы на это: «Давай серафимам будет обычный челик.( потом придумаем) И в момент свой смерти он воскреснет и принесет катастрофу и изменится визуально став трехкрылом». Кто именно этот человек — не придумано.</p>\n<p><strong>2025-12-17, id 399512–399535.</strong> Роль в сюжете: «Хотя у Серафима уже понятно цель. Перезапустите человечества». На вопрос «Может ли Серафим стать главным злодеем» Миколай отвечает «спокойно да может», «ну он один из». Всего злодеев трое — Серафим, Бог красок и дочь: «Ну это уже интересно 3 злодея. Двое из которых это иной уровень сил». Здесь же — идея про пламя: «Заставите одно из апостолов быть выженым пламенем Серафима. После это конечно он выживает, но теряет семя ( я так и сам не до конца понял, что это за семя. Ну можешь считать это источником их силы и быстрое адаптации)», после чего апостол уходит от братьев, «точнее сбегает не желая чтобы его братья видели, как он умирает», умирает в домике в лесу и становится «чем-то другими. Чудовищем», нападает на нашедшего его графа и пытается его сожрать. Открытые вопросы того же захода: «Какая будет катастрофа?», «И кто теперь будет апостолами», «А что произойдет если апостол умрет. Умретли он просто или переродится чем то иным», а также что произойдёт, когда Защитник откажется от человечности.</p>\n<p><strong>2026-06-03, id 487531–487532.</strong> Соотношение сил: «Нет серафим не сильнее Нуар. Они плюс минус равны по силе, но просто Пламя Серафима представляет опасность. Также у нуара больше всего Оам».</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0132-S03", "MR-0132--mesto-vo-vselennoy"], "h": "<p>Современный мир, апокалипсиса нет. «А его нету», «Просто знаю есть объекты и есть нимб», «И всё происходит в современном мире» (2025-04-08, id 317405–317412). На вопрос «будет?» — «Не знаю» (id 317408, 317413). Прямое отсечение: «Апокалипсиса и вируса нету», «Есть только нимб и объекты» (id 317430–317432).</p>\n<p>Формат материала на 2025-04-08: «Ну будут мини истории о некоторых объектов , будней нимба и т. П. Пока я ещё не до конца придумал мир, пусть пока будет так» (id 317512).</p>\n<p>Внутри прозы (2025-04-21, окно w0088, id 320983–320988). Во второй брошенной истории — про заброшенный корабль исполняющего желания — «Нимб» назван как отправитель писем, которыми участники были созваны к кораблю. Игорь: «от организации \"нимб\"?». Ника: «ДА. Одна из крупнейших организаций всего мира написала нам о корабль. Разве это не странно. Сначала я конечно подумала может шутка такая. Но сейчас когда мы оказались посреди моря-». Игорь спрашивает: «ты хочешь сказать, что организация \" Нимб\" Во всём этом виновата?» — ответ Ники: «я не говорила, что она виновата. Я лишь сказала, что письмо от них. А это что-то да и значит-». Вопрос о виновности организации остаётся открытым; в тексте персонажи «обсуждали виновность того или иного субъекта в этом инциденте». Другие связанные с этим фрагментом персонажи — рассказчик, Игорь, Ника, Паша. Дата сбора у корабля в тексте — 11 июня в полночь, то же число, что и дата официального появления Нимба (11 июня 2003 года); связь между этими датами в переписке не проговорена.</p>\n<p>Вселенная героев и злодеев (2026-06-02, окно w0120, id 487001–487005). Нимб помещён в состав мира вместе с другими силами: «Вселенная. Современные мир, где есть злодей и герой. Ну и нимб и секта». Раскладка:</p>\n<ul>\n<li>ассоциация, «которая контролирует и помогает героем»;</li>\n<li>злодеи, «который просто нарушают закон»;</li>\n<li>Нимб — организация экспериментов;</li>\n<li>культ: «Просто ебланы который верит во что-то ( у меня всегда с верующими проблема, я никогда ничего нормального придумать не могу) ну 4 епископа».</li>\n</ul>\n<p>На стороне ассоциации — 6 столпов, «тобишь шесть сильнейших Героев», в них входят граф и Нуар. У злодеев тоже шесть столпов, «так сказать разрушение», ещё не придуманы: «Ну там как минимум будет безумная девка. И старик со способностью гравитации, который бы досканкльно придумали». Апостолы держат нейтралитет — «Конечно не все». Итоговый счёт сил: «6 героев, 6 злодеев, 4 ахрепископа, 12 апостолов, ну и кто-нибудь из Нимба» (id 487005).</p>\n<p>Таким образом Нимб — это и создатель ключевых фигур мира (Нуар как один из столпов героев, апостолы), и самостоятельная сторона, чей представитель занимает отдельную позицию в раскладке.</p>\n<p>Позиция в структуре справочника: часть вселенной героев и злодеев.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0132-S04", "MR-0132--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-04-08, окно w0087, id 317240–317258.</strong> Первое развёрнутое описание: дата основания 11 июня 2003 года, фармацевтический профиль, заводы, фабрики, больницы, аптеки, ветклиники, репутация (рак, отращивание конечностей, иностранцы), контракт с армией, формально правительственный, фактически свободный статус, ловля объектов (черныши, медузы), препараты из их крови, опыты над преступниками и сиротами, четыре отдела — силовики, бухгалтерия, исследования и «отдал Этики», который ругается с двумя первыми. Самоопределение: «организация сцп только измененая под мои рамки».</p>\n<p><strong>Версия 2 — 2025-04-08, окно w0087, id 317301–317314.</strong> Уточнение по препаратам: их «создають на основе их ней крови Типо как у яд змей». Миколай предлагает копаться в составе крови: «мне покопаться в кровяке?», «да, я могу узнать составы крови и особенности чтобы применить в создании чего-то». Слава: «Ну только позде», «Я занят». В этой же версии Миколай спрашивает, люди ли это и антагонисты ли они и не являются ли протагонистами «то кого создали в нимбе» — прямого ответа в переписке нет.</p>\n<p><strong>Версия 3 — 2025-04-08, окно w0087, id 317392–317454.</strong> Отсечение апокалипсиса и вируса: «Апокалипсиса и вируса нету», «Есть только нимб и объекты», действие в современном мире. Объекты объявлены личными, а не официальными SCP: «Мои», «Личные», «Хотя они могут быть похоже». Перечень объектов: «Медуза, черныши, серафим,..». Подтверждено, что «там производять опыт над людьми».</p>\n<p><strong>Версия 4 — 2025-04-08, окно w0087, id 317459–317512.</strong> Введено сокращение НБО (предложение Миколая, принято Славой). Основа препаратов переопределена с крови на биологические жидкости: «Нет крови», «Биологический жидкости». Добавлен денежный мотив: «Им не хватает денег налогоплательщиков»; контракт с армией «на создания препаратов который могут усилить (типо супер солдат)». Формат заявлен как мини-истории об объектах и о буднях Нимба; мир на этот момент, по признанию Славы, «ещё не до конца придумал».</p>\n<p><strong>Версия 5 — 2025-04-21, окно w0088, id 320983–320988.</strong> Повтор прежней мысли в новом контексте: внутри прозаического текста Нимб — «Одна из крупнейших организаций всего мира», разославшая участникам письма о корабле; спор о её виновности не разрешён.</p>\n<p><strong>Версия 6 — 2026-06-02, окно w0120, id 487001–487006.</strong> Смена каркаса: Нимб уже не единственная сила мира, а одна из четырёх (герои и ассоциация, злодеи, Нимб, секта). Профиль организации переописан как эксперименты без единой цели с крайне неэтичными методами и гибелью сотен тысяч. Появляются Нуар как первый удавшийся ИС, реакция правительства (раскрытие) и обратная реакция общества (продвижение идеи, попытки других организаций), проект апостолов на 12 ИС, не раскрытый публике, и предыстория неудачных ИС до Нуара.</p>\n<p><strong>Версия 7 — 2026-06-07, окно w0121, id 488439–488440.</strong> Нимб входит в биографию Доимы: захват беременной от Имета женщины, эксперименты над ребёнком с восьми лет до отказа учёных, выращивание из неё сотрудницы из-за нехватки кадров. Фиксируется, что о собственной организации Доимы Нимбу неизвестно. В том же сообщении меняется возраст апостолов — «теперь им за 40».</p>\n<p>Отдельно фиксируется расхождение между версиями: вирус, отсечённый в версии 3 («Апокалипсиса и вируса нету»), в сводке окна w0120 снова приписан Нимбу; в самих сообщениях того окна вирус не назван. Старое не затирается — обе формулировки остаются в материале.</p>\n<p>Не подхваченные предложения. Миколай дважды заходил с идеей строить существ от свойств крови: «то что она у разных существ из разных металлов в разработке не поможет...», «например к древних не железо преобладало, а медь», «поэтому она была синяя», «к тому что можно придумать существ опираясь на удивительные свойства крови» (2025-04-08, id 317476–317483). Слава перевёл разговор на биологические жидкости и препараты; идея развития не получила. Его же вопрос «почему именно жидкости а не строение» (id 317495) остался без ответа.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0132-S05", "MR-0132--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Откуда берутся объекты — Слава прямо говорит, что не придумал: «К чему ты это. Я даже не придумал откуда они берутся?» (2025-04-08, id 317481).</li>\n<li>Состав препаратов не назван. Сказано только, что основа — биологические жидкости объектов, и что препараты не только лекарственные («Не только»), но какие ещё — не перечислено.</li>\n<li>Главный герой и главный злодей на 2025-04-08 не определены: на вопросы «кто гг», «в плане злодей кто» ответ — «Не кто» (id 317506–317509).</li>\n<li>Мир на этот момент не додуман: «Пока я ещё не до конца придумал мир, пусть пока будет так» (id 317512).</li>\n<li>Про Нимб как мир/организацию говорили и раньше — в окне w0087 (около id 317505–317536). В окне w0088 название всплывает только внутри текста истории, отдельного объявления вселенной в окне нет.</li>\n<li>Виновен ли Нимб в происходящем на корабле — осталось нерешённым внутри самой истории.</li>\n<li>Шесть столпов злодеев не придуманы, кроме двух набросков — безумной девки и старика со способностью гравитации (2026-06-02, id 487003).</li>\n<li>Кто именно из Нимба входит в раскладку сил, не назван: «ну и кто-нибудь из Нимба» (id 487005).</li>\n<li>Отношения Нимба с ассоциацией героев и с сектой в переписке не описаны.</li>\n<li>Связь между объектами Нимба (черныши, медузы, серафим) и линией искусственных сверхлюдей и апостолов в переписке не проведена.</li>\n<li>Чем заканчивается линия Доимы, не раскрыто: «А в конце ну ты знаешь что будет» (2026-06-07, id 488439).</li>\n<li>Идея с распылением вируса, превращающего людей в чудовищ, в приведённых сообщениях окна w0120 не подтверждена.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0132--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0104.html\">Нуар</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0009.html\">Организация Нимб (НБО)</a>, <a href=\"GR-0074.html\">Четверо на корабле («супер группа»)</a>, <a href=\"GR-0076.html\">Черныши</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0006.html\">Нимб</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0132--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-04-08</td>\n<td>317240–317258</td>\n<td>w0087</td>\n<td>Нимб (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-04-08</td>\n<td>317301–317314</td>\n<td>w0087</td>\n<td>Нимб (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-04-08</td>\n<td>317392–317454</td>\n<td>w0087</td>\n<td>Нимб (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-04-08</td>\n<td>317459–317512</td>\n<td>w0087</td>\n<td>Нимб (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-04-21</td>\n<td>320983–320988</td>\n<td>w0088</td>\n<td>Нимб (объявлено)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2026-06-02</td>\n<td>487001–487006</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-07</td>\n<td>488439–488440</td>\n<td>w0121</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0132-nimb.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0132--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0132.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["MR-0132-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/MR-0132/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Самая дорогая дыра этого пласта — не в самом Нимбе, а в том, что он произвёл. <code>SL-0054</code> «Список 12 апостолов» — 7 ссылок, статьи нет, база 234052 знака, крупнейшая несобранная запись во всём материале. Статья о Нимбе называет этот проект прямо: «единственный после Нуара удавшийся проект по созданию ИС... 12 созданных ИС», и вся раскладка мира героев и злодеев держится на этом списке — без него половина того, что Нимб произвёл, существует одной строкой.</p>\n<p>Второе, ближе к самой статье, — <code>PS-0375</code> Доима (дочь Имета): 4 ссылки, статьи нет, база 9036. Её история — самая длинная и подробная часть раздела «Население» в этой же статье о Нимбе; и она же держит сцену эксперимента с дырой между мирами, у которой есть собственная несобранная запись <code>IS-0092</code> «Эксперимент Доимы: дыра между мирами» — 8080 знаков, ноль ссылок.</p>\n<h3>С чего начать</h3>\n<p>Всё в базе, не в архиве. Для Доимы — та же отправная точка, что и в статье о Нуаре: запись <code>PS-0324</code> «Дочь Имитатора» прямо говорит, что версия 2026 года «вынесена в отдельную запись» <code>PS-0375</code>, у которой пока нет статьи. Для сцены с дырой между мирами — запись <code>IS-0092</code> уже существует отдельно, её просто не подключили. Для апостолов готового куска нет: <code>SL-0054</code> придётся собирать по частям из всех статей, которые на него ссылаются.</p>\n<h3>Как развивалось</h3>\n<p>Организацию заявили и почти целиком прописали за один день (2025-04-08): устав, отделы, деньги, статус SCP-подобной структуры. Через две недели она мелькнула ещё раз — уже не как объект разработки, а внутри чужого текста, безымянным письмом на корабль, и вопрос её виновности так и остался открытым. После этого — тишина длиной больше года. Вернулись к ней в 2026-06-02, но полностью пересобрав каркас: из единственной силы мира Нимб стал одной из четырёх. Через пять дней, 2026-06-07, в неё дописали историю Доимы — самую подробную за всё время существования записи.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>В организации назван отдельный отдел этики, который «часто ругается» с силовиками и исследователями — то есть у Нимба есть механизм внутреннего протеста против жестоких экспериментов. Но самый жёсткий из описанных случаев — многолетние эксперименты над восьмилетним ребёнком, дочерью Имета, — рассказан без единого упоминания этого отдела: ни того, что он вмешался, ни того, что промолчал.</p>\n<h3>Отклик</h3>\n<p>Сильнее всего работает контраст внутри одной статьи: сухое корпоративное устройство с отделами и контрактом на «супер солдат» — и тут же, без перехода, живая деталь про Доиму, что «всё ещё та маленькая девочка, что была заперта в белой комнате, читая книжки и мечтая о семье», в мире, который ей самой кажется отвратным. Организация написана как система, а Доима внутри неё — как единственный человек, у которого есть желание, а не функция.</p></div>", "r": []}];</script>
