<script>const BASE="";const DOCNAME="Ньюс";
const LEAD="";
const CH=[{"t": "Где находится — в каком мире и в каком его месте", "a": ["S01", "MN-0006-S01", "MN-0006--gde-nahoditsya"], "h": "<p>Вселенная «монстры» (по дате объявления). Положение внутри мира не названо. Ньюс упомянут как конечная точка преследования: «я же вообще за рыбочеловеком шел до Ньюса» (2024-08-29, id 226088). Из формулировки прямо следует только то, что до Ньюса можно дойти пешком, преследуя добычу. В том же сообщении названо второе место, Хойя-Бача (<a href=\"MN-0005.html\">Хойя-Бача</a>), куда спасатель собирается идти; связь между двумя топонимами не проговорена.</p>", "r": [["Хойя-Бача", "MN-0005.html"]]}, {"t": "Что собой представляет", "a": ["S02", "MN-0006-S02", "MN-0006--chto-soboy-predstavlyaet"], "h": "<p>Не описано. В переписке есть название и предлог движения («до Ньюса») — больше ничего: ни ландшафт, ни размер, ни то, поселение это, водоём или постройка, не сказано.</p>", "r": []}, {"t": "Что с ним связано — предметы, механики, силы", "a": ["S03", "MN-0006-S03", "MN-0006--chto-s-nim-svyazano"], "h": "<p>Связь идёт через рыбочеловека, за которым до Ньюса шёл спасатель. Про самого рыбочеловека в том же сообщении сказано:</p>\n<ul>\n<li>«суп из него такой ароматный, постоянная гипермедленная регенерация даже в варёном состоянии это райское наслаждение для моих очей»;</li>\n<li>«то, как эта ошибка природы питается этими существами так расслабляет»;</li>\n<li>«после 56 тестов я смогу с уверенностью определить его возможности, его днк и другие данные»;</li>\n<li>к этой же линии отнесены расчёты: «тот паренёк займётся вычислениями пока не надоест, деньги сможет с глубин интернета собрать на исследование».</li>\n</ul>\n<p>Сказано ли, что рыбочеловек обитает в Ньюсе или что тесты идут там, — в переписке не сказано; названо только направление преследования.</p>", "r": []}, {"t": "Персонажи и события — кто с ним связан и что там происходило", "a": ["S04", "MN-0006-S04", "MN-0006--personazhi-i-sobytiya"], "h": "<p>Спасатель — тот, кто шёл до Ньюса. Рыбочеловек — тот, за кем он шёл.</p>\n<p>Само преследование в переписке не показано, оно упомянуто задним числом и в скобках, как отвлечение от текущей сцены: спасатель ведёт собеседника на склад и по дороге вспоминает, куда вообще направлялся, — «а, ой. я же вообще за рыбочеловеком шел до Ньюса». Параллельно он объявляет другое дело: «пойду пока-что в Хойя-Бачу монстров на монстров порыбачу» (см. <a href=\"MN-0005.html\">Хойя-Бача</a>). Чем кончился поход до Ньюса, не сказано.</p>\n<p>К тому же сообщению относятся ещё две линии, с Ньюсом прямо не связанные: «найти бы эхолокатора. почему все эти ублюдки так хорошо прячутся» и «раздавил опять векторный шар, благо над холмом пролетал».</p>", "r": [["Хойя-Бача", "MN-0005.html"]]}, {"t": "Как менялся по версиям — по датам", "a": ["S05", "MN-0006-S05", "MN-0006--kak-menyalsya-po-versiyam"], "h": "<p>Одна версия. 2024-08-29 (id 226088, окно w0055) — первое и единственное упоминание. К названию больше не возвращались, отклонённых вариантов нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "MN-0006-S06", "MN-0006--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Что это за место — не описано.</li>\n<li>Не сказано, что такое Ньюс по типу: город, область, объект.</li>\n<li>Не сказано, где он относительно Хойя-Бачи (<a href=\"MN-0005.html\">Хойя-Бача</a>), названной в том же сообщении.</li>\n<li>Не сказано, живёт ли там рыбочеловек и почему он шёл именно туда.</li>\n<li>Дошёл ли спасатель до Ньюса и что там было — осталось нерешённым.</li>\n<li>Не сказано, откуда название.</li>\n</ul></div>", "r": [["Хойя-Бача", "MN-0005.html"]]}, {"t": "Связи — всё вместе", "a": ["MN-0006--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает монументы:</strong> <a href=\"MN-0005.html\">Хойя-Бача</a></li>\n<li><strong>Упомянут в монументах:</strong> <a href=\"MN-0005.html\">Хойя-Бача</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0038.html\">Рыболюди</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MN-0006--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-29</td>\n<td>226088–226088</td>\n<td>w0055</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/monumenty/MN-0006-nyus.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MN-0006--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MN-0006.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["MN-0006-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/MN-0006/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — спасатель. <code>PS-0144</code> «спасатель»: 51.1 КБ базы, статьи нет, ссылок ноль. Это крупнейший неразобранный кусок вселенной «монстры», и на нём висит вся здешняя география. У мест, куда он ходит, статьи уже есть — <code>MN-0006</code> (эта), <code>MN-0005</code> «Хойя-Бача» (4.9 КБ), <code>MN-0004</code> «склад спасателя» (7.2 КБ), — а у человека, ради которого эти места вообще названы, статьи нет. Всё, что известно о Ньюсе, — это одна его реплика; пока он сам не разобран, Ньюс нечем описывать, кроме этой реплики. К нему же примыкают <code>PS-0152</code> «дочка спасателя» (4.9 КБ, статьи нет), <code>SP-0109</code> «вещества спасателя» (7.1 КБ, статьи нет), <code>SP-0105</code> «использование монстров спасателем» (2.3 КБ, статьи нет).</p>\n<p>Второе — рыбочеловек. Записи с таким именем нет вообще, материал разошёлся на три без статей: <code>PS-0143</code> «Человек с генами рыбочеловека» (19.0 КБ), <code>PS-0131</code> «Тварь (человек-рыба из озера)» (7.0 КБ), <code>SP-0104</code> «гены рыбочеловека» (4.0 КБ). Единственное содержательное в этой статье — что до Ньюса шли за рыбочеловеком, — не прицепляется ни к чему, пока не решено, одно это существо или три разных.</p>\n<h3>С чего начать</h3>\n<p>Не в архив. Своя база выбрана целиком: статья 4.1 КБ при 4.1 КБ базы, одно сообщение 226088 — дочитывать здесь нечего, и второй заход в архив за самим словом «Ньюс» ничего не даст, если не искать вокруг.</p>\n<p>Начинать с <code>PS-0144</code>: 51 КБ речи спасателя — единственное место, где название могло всплыть повторно, потому что произнёс его он и в своей манере (походя, в скобках, между делами). Дальше <code>PS-0143</code> и <code>PS-0131</code> — если рыбочеловек где-то описан с местом обитания, привязка Ньюса найдётся там, а не в самом Ньюсе. Соседний монумент <code>MN-0005</code> «Хойя-Бача» назван в том же сообщении и уже имеет статью — сверять надо парой.</p>\n<p>В архив идти только если после этого пусто. Ориентир: окно w0055, 2024-08-29, и соседние окна вселенной «монстры» до и после этой даты; искать не топоним, а сцены со складом, с тестами (в реплике названы «56 тестов») и с охотой на рыбочеловека — Ньюс, если и появится ещё раз, появится тем же способом, попутным упоминанием внутри чужого дела.</p>\n<h3>Как развивалось</h3>\n<p>Одна дата, 2024-08-29, одно сообщение. Название произнесено задним числом и в скобках, как отвлечение: человек ведёт собеседника на склад, вспоминает, куда вообще шёл, и тут же объявляет другое дело — идти в Хойя-Бачу. Ни ограничения, ни возврата: заявили и забыли в той же фразе, в которой заявили. За два года к слову не возвращались ни разу. Хойя-Бача из того же предложения получила статью того же размера и одну ссылку — обе точки так и остались на уровне имени.</p>\n<h3>Отклик</h3>\n<p>Честно: сам Ньюс не зацепил — это адрес без содержимого, и статья правильно делает, что не изображает больше, чем есть. Зацепило предложение, в котором он произнесён. «Суп из него такой ароматный, постоянная гипермедленная регенерация даже в варёном состоянии это райское наслаждение для моих очей» — тут в одном человеке сидят гурман и лаборант, и он не видит между ними разницы: существо одновременно вкусное, интересное и подлежащее 56 тестам. И манера, в которой всплывает Ньюс, сама по себе точная — «а, ой. я же вообще за рыбочеловеком шел до Ньюса». Так и выглядит карта в голове занятого человека: маршрут вспоминается, когда уже перебит другим маршрутом, и никуда он по нему не дошёл.</p></div>", "r": []}];</script>
