<script>const BASE="";const DOCNAME="Демоны";
const LEAD="<p>Демоны — одна из рас, внесённых в общий список рас (2024-12-21, id 272835–272839). Всего по записи проходит три версии, даты 2024-12-21 — 2025-09-12, окна w0067 и w0104.</p>";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0091-S01", "MR-0091--ustroystvo"], "h": "<p>Демоны — источник ядовитой маны (Скверна). Сами они яд «не используют» — «ядом демоны наделяют животных» (2024-12-21, id 272857–272858). Животные, которых демоны наделили ядом, «отравляются и агресируют», «становятся злом» (id 272860–272861). При этом яд остаётся тем, о чём договаривались раньше: Слава напоминает — «Мы же договаривались что это будет как яд созданный разумным существом» (id 272856), и наделение животных ядом от демонов этому условию отвечает.</p>\n<p>По состоянию на 2025-09-12 (id 364797) демоны не могут попасть в мир людей самостоятельно: «Точнее демоны не могут попасть в наш мир. Точнее могут но там надо какой-нибудь сложный обряд придумать». Сам обряд не придуман — в переписке сказано только, что он должен быть сложным. Способ присутствия демонов в мире людей без обряда — вселение в людей, отсюда Одержимые. По силе демоны стоят выше: «Демоны в разы сильнее одержимых» (id 364797).</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0091-S02", "MR-0091--naselenie"], "h": "<p>Раса демонов. Численность, внешность, внутреннее деление, места обитания в переписке не названы. Отдельные демоны по именам не выделены.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0091-S03", "MR-0091--mesto-vo-vselennoy"], "h": "<p>Демоны — часть списка рас (Расы). Связаны с ядовитой маной (Скверна) как её источник; с одержимыми — через вселение; с экзорцизмом — как то, что изгоняют; с арбетарами — в сообщении 364797 они названы через «Плюсом арбетары», связь при этом не расписана.</p>\n<p>Мир людей («наш мир») противопоставлен месту, где демоны находятся: чтобы попасть в мир людей, нужен сложный обряд. Как называется и как устроено то место, откуда они приходят, в переписке не сказано.</p>\n<p>Принадлежность к вселенной по записи стоит как «неясно» и определяется только по дате объявления (безымянная вселенная, объявленная 2024-12-21, id 272184).</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0091-S04", "MR-0091--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-12-21 (окно w0067, id 272835–272839).</strong> Раса внесена в мир. Слава: «А типо расы типо демонов ?» — Миколай: «демоны», «всё». Никаких свойств на этом шаге не задано.</p>\n<p><strong>Версия 2 — 2024-12-21 (окно w0067, id 272856–272862).</strong> Демоны становятся теми, кто наделяет ядом животных; животные от этого отравляются, агрессируют и становятся злом. Сами демоны яд не используют. В этом же куске переписки Слава подаёт отдельное предложение, к демонам не привязанное: «Давай клятву типо я не убью, я не ем мясо и т.п. И чем сложней дабу чем сильней ты будешь» (id 272859) — как это соотносится с демонами, в переписке не сказано.</p>\n<p><strong>Версия 3 — 2025-09-12 (окно w0104, id 364787–364797).</strong> Добавлено правило прохода в мир: сами демоны в «наш мир» попасть не могут, нужен сложный обряд, который «ещё не придуман». Добавлено соотношение сил: демоны в разы сильнее одержимых. Свойства версии 2 (ядовитая мана, наделение животных) не отменялись.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0091-S05", "MR-0091--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Сложный обряд, которым демоны могут попасть в мир, только назван — его содержание не придумано, это прямо сказано в переписке.</li>\n<li>Мир или место, откуда демоны приходят, не назван и не описан.</li>\n<li>Механика вселения в людей в этой записи не раскрыта: сказано, что демоны вселяются и делают людей одержимыми, но условия, порядок и обратимость не описаны.</li>\n<li>Связь с арбетарами обозначена одним словом «Плюсом арбетары» и не расшифрована.</li>\n<li>Внешность, численность, устройство расы, отдельные персонажи-демоны — не названы.</li>\n<li>Принадлежность к конкретной вселенной в переписке не проговорена, стоит по дате.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["MR-0091--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-12-21</td>\n<td>272835–272839</td>\n<td>w0067</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-21</td>\n<td>272856–272862</td>\n<td>w0067</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-09-12</td>\n<td>364787–364797</td>\n<td>w0104</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0091-demony.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0091--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0091.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
