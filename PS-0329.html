<script>const BASE="";const DOCNAME="Семья Бенжимена";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0329-S01", "PS-0329--proishozhdenie"], "h": "<p>Семья Бенжимена Бэнуара — родня главного героя истории «Страх», разобранная 2025-12-09 (окно w0113) в ответ на вопросы Миколая о том, откуда герой взялся и кто его отправил.</p>\n<p>Разбор шёл двумя заходами в одно утро: сначала об отце и матери (id 394477–394500), затем о том, кто воспитывал (id 394508–394513).</p>\n<p>Состав, как он назван в переписке:</p>\n<ul>\n<li><strong>Отец</strong> — граф. Именно он отправил Бенжимена. На вопрос Миколая «кто его отправил то» (394478) — «Отец» (394479). Бенжимену при этом не объяснили, зачем: разговор начинается с реплики Миколая «ему не объяснили?» (394477). Куда и на что отправил, в самом фрагменте не проговорено; навигационная сводка записи формулирует это как «отправил на смерть». Слава добавил, что объяснение отложено на сам текст: «Дальше по истории должно будет показать» (394481).</li>\n<li><strong>Мать</strong> — покойная. Законная жена графа (394496–394497). Умерла сразу после родов.</li>\n<li><strong>Мачеха</strong> — новая супруга отца, она и воспитывала Бенжимена (394508–394509). В навигационной сводке записи рядом с ней названы её дети; в приведённых кусках переписки о детях мачехи ничего нет.</li>\n</ul>", "r": []}, {"t": "Связи с другими", "a": ["S02", "PS-0329-S02", "PS-0329--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Отец — Бенжимен</strong>: ненависть. Прямая формулировка Славы: «Мать умерла, а отец ненавидел» (394510). Причина ненависти не названа.</li>\n<li><strong>Мачеха — Бенжимен</strong>: она его воспитывала (394509). Какие между ними отношения — Миколай спросил именно об этом («интересно кто его воспитывал и какие у них отношения», 394508), но ответ дан только на первую половину вопроса. Отношения не описаны.</li>\n<li><strong>Отец — мать</strong>: брак законный, мать была женой графа. Был ли брак по расчёту, Миколай спросил отдельно («а брак был по расчёту за деньги? ну это мне уже интерес», 394498–394499) — не решено, см. ниже.</li>\n</ul>", "r": []}, {"t": "Как менялся", "a": ["S03", "PS-0329-S03", "PS-0329--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2025-12-09, id 394477–394500.</strong> Устанавливается отец как тот, кто отправил героя, и мать как покойная законная жена графа. Здесь же отвергается альтернативное происхождение (см. отклонённый вариант). Вопрос о браке по расчёту остаётся без ответа: «Я не знаю я не думал об этом. Его мать просто сразу умерла после родов и я посчитал это не важным» (394500).</p>\n<p><strong>Версия 2 — 2025-12-09, id 394508–394513.</strong> Добавляется мачеха как воспитательница и фиксируется отношение отца: «Мачеха» (394509), «Мать умерла, а отец ненавидел» (394510). Первая версия при этом не отменяется, вторая её дополняет.</p>\n<h3>Отклонённый вариант</h3>\n<p>Миколай предложил вариант происхождения: «он сын шлюхи или покойной матери?» (394487), отметив, что первое ему «честно часто видел когда первое» (394488) и что «в аниме или других историях говорят о сыне с какой-то такой дамой» (394493–394494).</p>\n<p>Слава выбрал второе — «Покойной матери» (394489) — и отказ мотивировал прямо: «Я разочарование о таких мыслих» (394491) и «Я та не прям любитель жестить. Тем более в этом плане» (394495). Незаконнорождённость как происхождение героя из замысла исключена.</p>", "r": []}, {"t": "Пробелы", "a": ["S04", "PS-0329-S04", "PS-0329--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Внешность никого из семьи не описана.</li>\n<li>Имён нет ни у отца, ни у матери, ни у мачехи — все названы только по роли.</li>\n<li>Причина отцовской ненависти не названа.</li>\n<li>Отношения мачехи и Бенжимена остались без ответа, хотя вопрос был задан.</li>\n<li>Брак отца и матери: по расчёту или нет — «Я не знаю я не думал об этом» (394500). Автор счёл это неважным, потому что мать умерла сразу после родов.</li>\n<li>Реплика Миколая «она единственный дворянин?» (394512) и ответ «Он» (394513) — на кого именно указывает «он», из переписки не следует; вопрос дворянства семьи дальше не разбирается.</li>\n<li>Дети мачехи в квотированных фрагментах не появляются: состав этой части семьи не назван.</li>\n<li>Куда именно отец отправил Бенжимена, в самих репликах не сказано — отложено на сюжет.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["PS-0329--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-12-09</td>\n<td>394477–394500</td>\n<td>w0113</td>\n<td>Феня (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-09</td>\n<td>394508–394513</td>\n<td>w0113</td>\n<td>Феня (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0329-semya-benzhimena.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0329--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0329.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
