<script>const BASE="";const DOCNAME="Семья Бэлут";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0081-S01", "GR-0081--chto-eto"], "h": "<p>Семья Бэлут — дворянский род (граф с женой и тремя детьми) из истории «Фанатик» (<a href=\"IS-0083.html\">Фанатик</a>), точнее — из её заброшенного варианта с подзаголовком «обычный мир» (<a href=\"PR-0105.html\">Фанатик (обычный мир)</a>). Живёт в особняке в средневековом королевстве Пиор (<a href=\"MR-0187.html\">Королевство Пиор</a>). Всё, что о ней известно, укладывается в одну главу, выложенную Славой четырьмя сообщениями подряд 2025-12-14 (id 397758–397761); сама семья появляется в трёх из них (id 397759–397761).</p>\n<p>Название рода прозвучало в тексте не как представление, а как мысль героя, впервые услышавшего свою новую фамилию: «Да и семья Бэлут, что-то не припоминаю» (id 397758).</p>\n<p>Семья показана целиком с точки зрения постороннего: в тело старшего сына, Диониса, попал человек из нашего мира, и он выясняет состав семьи, расспрашивая служанку, а потом впервые видит родню за ужином. Всё, что о Бэлутах сказано, сказано либо служанкой в порядке справки, либо глазами героя, который «даже не знает каким был Дионис».</p>\n<p>Отдельных записей базы у графа Эдгара, графини Виктории, Лукаса и Алисы нет — они лежат внутри записи <a href=\"PS-0334.html\">Семья Бэлут</a> «Семья Бэлут», которая в базе заведена как персонаж, а не как группа. Поэтому в участниках группы числится только Дионис (<a href=\"PS-0332.html\">Дионис Бэлут</a>).</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Чинить первым — расщепление <code>PS-0334</code>. Сейчас четыре человека (граф Эдгар, графиня Виктория, Лукас, Алиса) лежат внутри одной записи, заведённой как персонаж: 20485 знаков базы, 2 ссылки. Из-за этого группа из пяти человек числит в участниках одного Диониса (<code>PS-0332</code>), а на Викторию — на которой держится вся сцена ужина и главный неразрешённый вопрос главы («почему прежний Дионис звал мачеху мамой») — сослаться нечем. Тянут этот вопрос сразу три записи с приличным материалом: <code>PS-0332</code> (27762), <code>PS-0335</code> (22874), <code>PR-0105</code> (25915), и все три упираются в отсутствующую сущность. Дыра не в переписке, а в разметке: материал есть весь, ему негде лежать.</p></div>\n<div class=\"mnote\"><b>⚙ машинная заметка · С чего начать — не материал авторов</b>\n<p>В базе, архив тут почти не нужен. Внешность и состав — <code>PS-0334</code>; сам текст главы — <code>PR-0105</code>; служанка и её настоящая хозяйка — <code>PS-0335</code>; рамка истории — <code>IS-0083</code> (40562 знака, самый крупный сосед); место действия — <code>MR-0187</code> (8779). Пробел «каким был прежний Дионис» частично закрывается не отсюда, а из <code>PS-0333</code>, где описан герой до попадания, — но именно частично: про прежнего владельца тела там тоже ничего.</p></div>", "r": [["Семья Бэлут", "PS-0334.html"], ["Дионис Бэлут", "PS-0332.html"], ["Королевство Пиор", "MR-0187.html"], ["Фанатик", "IS-0083.html"], ["Фанатик (обычный мир)", "PR-0105.html"]]}, {"t": "Состав", "a": ["S02", "GR-0081-S02", "GR-0081--sostav"], "h": "<ul>\n<li><a href=\"PS-0332.html\">Дионис Бэлут</a> — Дионис Бэлут, старший сын, 23 года. Тело, в которое попал герой истории.</li>\n<li>Граф Эдгар Бэлут — отец. Отдельной записи нет.</li>\n<li>Графиня Виктория Бэлут — мачеха Диониса, мать Лукаса и Алисы. Отдельной записи нет.</li>\n<li>Лукас — младший брат, 10 лет. Отдельной записи нет.</li>\n<li>Алиса — младшая сестра, 7 лет. Отдельной записи нет.</li>\n</ul>\n<p>Состав назван служанкой в ответ на прямой вопрос «кто вообще есть семья?» (id 397759): «Граф Эдгар Бэлут ваш отец и графиня Виктория Бэлут ваша мачеха», «у вас также есть младший брат и младшая сестра от графине Виктории». Имена младших прозвучали позже, уже в коридоре после ужина (id 397761): Лукас — «замялся Лукас. Так звали моего младшего брата», Алиса — «говорила Алиса. Моя младшая сестра».</p>\n<p>Фамилия Бэлут в тексте прямо привязана только к графу Эдгару, графине Виктории и Дионису. Про Лукаса и Алису сказано только имя.</p>\n<p>Родная мать Диониса в переписке не упоминается вообще — сказано лишь, что Виктория ему мачеха.</p>", "r": [["Дионис Бэлут", "PS-0332.html"]]}, {"t": "Чем участники отличаются друг от друга", "a": ["S03", "GR-0081-S03", "GR-0081--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p><strong>Граф Эдгар Бэлут.</strong> Первое, что герой отмечает, войдя в столовую: «Моя копия, ну или я его копия. Как я только в разы крупней и с более суровым лицом, ну и с барадишкой». Глаза красные — те же, что у Диониса. За столом молчит, пока не заговорит сам; пьёт вино, поглаживает бокал. Спрашивает Диониса о причине хорошего настроения, потом повторяет за ним слова («духовное рождение?», «наблюдать?») — герой про себя раздражается: «да что же вы так любите повторять мои слова». На ответ Диониса о пути хмурится, а потом, «то ли от вина, то ли от моих слов», слегка улыбается и продолжает есть.</p>\n<p><strong>Графиня Виктория Бэлут.</strong> Сидит рядом с графом. «С шелковистыми и зелёными волосами. Пристойно смотрела на меня». Слово «духовное рождение» произносит «с интересам», но после объяснения Диониса её «лицо графини слегка стало холодным и напряженым». Единственное, что она говорит за весь ужин, — требование не звать её графиней: «Дионис зачем такие формальности за обеденным столом». Когда Дионис вместо этого называет её мачехой, «лицо Виктории нухмурилась и стало еще грубее».</p>\n<p><strong>Дионис Бэлут (<a href=\"PS-0332.html\">Дионис Бэлут</a>).</strong> 23 года. «Чёрные волосы, что были бы абсолютно чёрными если не седина. Острые черты лицо, с измученными красными глазами». Носит белоснежные перчатки — герой отмечает, что «на моих руках всегда были белоснежные перчатки». В теле осталась привычка держать столовые приборы: «прибор, который каким то чудом оказались в моих руках. Мышечная память что-ли?» — и вообще движения слишком выучены: «мои действия слишком элегантны для человека 21 века». Постоянно отряхивает с груди и плеча невидимую пыль — привычка проходит через всю главу. Прежний Дионис, по словам Лукаса и Алисы, звал Викторию мамой, «иногда матушкой или матерью».</p>\n<p><strong>Лукас, 10 лет.</strong> Черноволосый, «с ярко зелёными словно нефрит глазами» (в тексте назван «черноволосый мужчина», хотя ему десять). Первым из всей семьи замечает, что со старшим братом что-то не так: «а ты себя хорошое чувствуешь. А то ты сегодня странно себя ведешь», — и сразу подводит объяснение: «я слышал, что существует несколько болезней, что искажают восприятия». Стесняется спрашивать про «мачеху» — мнётся, отводит взгляд. Заканчивает разговор словами «мама наверное очень сильно расстроилась».</p>\n<p><strong>Алиса, 7 лет.</strong> Черноволосая и красноглазая. Говорит «резким детским голоском», влезает в чужой жест — «и мою руку», — и хихикает, когда Дионис прижимает её ладонь ко лбу. Отвечает на вопрос про обращение к матери «ярко улыбаясь. Словно ответила на сложнейшие вопрос».</p>\n<p>Общая внешняя черта, названная в тексте: чёрные волосы у графа, Диониса, Лукаса и Алисы; красные глаза у графа, Диониса и Алисы. Виктория выбивается зелёными волосами, Лукас — зелёными глазами. Прямо как признак рода это в переписке не проговорено.</p>", "r": [["Дионис Бэлут", "PS-0332.html"]]}, {"t": "Иерархия", "a": ["S04", "GR-0081-S04", "GR-0081--ierarhiya"], "h": "<p>Глава семьи — граф Эдгар. Его требование передаётся через прислугу и не обсуждается: Дионис пробует сказаться больным, но служанка отвечает, что уже сообщила графу о хорошем настроении господина и «Граф потребовал, чтобы вы сегодня были на ужине». Сообщено это было через главного дворецкого, пока герой был в библиотеке.</p>\n<p>Порядок ужина назван прямо: «По правилам на ужине присутствует только члены семьи и главный дворецкий, с несколькими своими приближёнными». Служанка Диониса до столовой не допускается — кланяется у двери и желает удачи.</p>\n<p>Обращения внутри семьи. Дионис — к отцу «граф», к мачехе сначала «графиня», после её замечания — «мачеха». Прежний Дионис, по словам младших, звал Викторию «мамой», «иногда матушкой или матерью»; когда новый Дионис зовёт её мачехой, Виктория мрачнеет, а Лукас потом переспрашивает: «а почему ты маму, мачехой назвал?». Как Виктория и граф обращаются к Дионису, кроме имени, в тексте не показано.</p>\n<p>Место Диониса за столом — «Напротив моих младших».</p>\n<p>Что до старшинства в наследовании, титулов, прав и обязанностей — в переписке не сказано ничего.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S05", "GR-0081-S05", "GR-0081--otnosheniya-s-drugimi-gruppami"], "h": "<p>Другие группы, роды или дома в тексте не названы вообще. Есть только домашняя прислуга особняка, стоящая рядом с семьёй, но в неё не входящая.</p>\n<p><strong>Главный дворецкий.</strong> Присутствует на семейном ужине вместе с «несколькими своими приближёнными». Через него служанка передаёт сообщения графу. Герой сначала принял его за библиотекаря. Имени и описания нет.</p>\n<p><strong>Черноволосая служанка (<a href=\"PS-0335.html\">Черноволосая служанка</a>).</strong> Приставлена к Дионису и называет себя его служанкой: «да господин я ваша служанка». По ходу главы выясняется, что служит она не ему: «Все было до ужаса очевидным. Моя милая служанка служит графине». Понял это Дионис по тому, как она поморщилась на слова «мачеха Виктория». Сразу после этого он переигрывает сказанный ранее комплимент: было «будь конкурс лучшей служанки. Ты бы заняла первое место», стало «знаешь теперь я думаю. Ты займешь последнее место». После ужина она исчезает, и Дионис остаётся один в коридорах.</p>\n<p><strong>Королевство Пиор (<a href=\"MR-0187.html\">Королевство Пиор</a>).</strong> Семья живёт в нём, дата действия — 28 июня 1417 года. Упрощённую историю королевства Дионису рассказала служанка, и по этому рассказу он понял, что попал в мир сказки о герое справедливости. Положение рода Бэлут в королевстве, его земли, влияние и связи с другими домами не названы.</p>\n<p><strong>Герой справедливости.</strong> Цель Диониса — увидеть его и «возможно немного контралировать, чтобы события были именно таким, каким должны быть». Связь семьи Бэлут с этим героем в переписке не заявлена.</p>\n<p>Отдельно: услышав про мачеху и её детей, герой сразу ждёт от семьи вражды — «Я прочитал достаточно рассказов, чтобы понимать мачеха не сулит ничего хорошего», «Это плоха, очень плоха. Мне не хотелось устраивать политическую борьбу». Это его ожидание по книжному опыту, а не то, что показано в тексте. Собственно борьбы внутри семьи в главе нет: ужин проходит спокойно, граф улыбается, младшие тянутся к брату. Чем это ожидание должно было кончиться, осталось нерешённым — глава обрывается.</p>", "r": [["Черноволосая служанка", "PS-0335.html"], ["Королевство Пиор", "MR-0187.html"]]}, {"t": "Как менялась — по датам", "a": ["S06", "GR-0081-S06", "GR-0081--kak-menyalas"], "h": "<p>Внутри самой семьи изменений в переписке нет: она вся описана за один вечер. Меняется рамка вокруг неё — история, которой семья принадлежит.</p>\n<p><strong>2025-12-09 (id 394616–394664).</strong> Слава спрашивает, не против ли Миколай исекая, и объявляет: «Вообще обычный исекай», «То есть исекай в мир фэнтези». Ни семьи, ни имён ещё нет.</p>\n<p><strong>2025-12-11 (id 395749–395757).</strong> Названо название истории — «Фанатик». Слава жалуется, что образ гг «не тот», но перечисляет, что в нём понимает: «Его привычка, его ненависть к определенным словам, его действия, который иногда кажутся хаотичным, его недоверия к тому что как бы вызывает доверия», а также «его гнев, восхищение и возбуждение».</p>\n<p><strong>2025-12-13 (id 397182–397183).</strong> Третье переписывание: «Ладно не жди образа гг который я изначально задумывал», «я заново переписываю истории с новым гг». То есть на момент, когда семья Бэлут будет показана, вариант с ней уже отброшен.</p>\n<p><strong>2025-12-14 (id 397744, 397758–397761).</strong> Миколай просит: «ну вот то скинь раз забросил». Слава выкладывает первую главу заброшенного варианта — «Фанатик (обычный мир)». Здесь семья Бэлут и появляется целиком:</p>\n<ul>\n<li>id 397759 — состав со слов служанки: отец-граф Эдгар, мачеха-графиня Виктория, младшие брат и сестра от неё. Имён младших ещё нет.</li>\n<li>id 397760 — ужин. Внешность графа, графини и обоих детей. Объявление о «духовном рождении». Требование Виктории не звать её графиней и её реакция на «мачеху».</li>\n<li>id 397761 — коридор после ужина. Имена Лукас и Алиса. Дионис прижимает их ладони ко лбу, проверяя реальность мира. Выясняется, что прежний Дионис звал Викторию мамой. Текст обрывается на реплике Лукаса «мама наверное очень сильно расстроилась».</li>\n</ul>\n<p><strong>2025-12-17 (id 399649–399690).</strong> Слава объявляет, что продолжит «Фанатик», «Изменив некоторый детали» — «Некоторые его момент в характере гг». Дальнейший сюжет выложен пунктами: «Фанатик ( убийства ведьмы) ( инцидент в деревне) (психическая нестабильность) ( неспособность убить) ( принципы)», и следом: «В принципе это весь дальнейший сюжет. Дальше я хер знает что». Семья Бэлут ни в одном из этих пунктов не названа. Останется ли она в переписанном варианте, в переписке не сказано.</p>\n<p><strong>Отклонённое.</strong> Вся глава с семьёй Бэлут — заброшенный вариант, скинутый в чат именно как заброшенный. Отдельно внутри главы отброшена оценка служанки: «первое место» на конкурсе лучшей служанки заменено на «последнее место» после того, как выяснилось, чьей она на самом деле служит.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "GR-0081-S07", "GR-0081--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Отдельных записей у графа Эдгара, графини Виктории, Лукаса и Алисы нет — вся четвёрка лежит внутри записи <a href=\"PS-0334.html\">Семья Бэлут</a>.</li>\n<li>Фамилия Лукаса и Алисы прямо не названа — только имена.</li>\n<li>Родная мать Диониса не упомянута ни разу; что с ней стало, в переписке не сказано.</li>\n<li>Почему прежний Дионис звал мачеху мамой, а не мачехой, не объяснено. Единственная реакция героя на это — «Это какое новый способ контроля», то есть догадка самого героя, а не ответ текста.</li>\n<li>Отношение Виктории к пасынку не раскрыто: она за весь ужин произносит одну реплику, а её холодность и хмурость никак не прокомментированы.</li>\n<li>Почему у 23-летнего Диониса седина и «измученные красные глаза», не сказано.</li>\n<li>Каким был прежний Дионис до попадания, в переписке нет — герой сам отмечает: «Я же даже не знаю каким был Дионис». Известно только, что он давно не был в хорошем настроении («сегодня у вас за долгое время хорошее настроение») и что тело давно не ело («Похожа это тело давное не ела»).</li>\n<li>У главного дворецкого нет ни имени, ни описания; его «приближённые» не названы и не сосчитаны.</li>\n<li>Никаких общих способностей, умений или свойств рода в переписке не приписано — про магию, силу или дар Бэлутов не сказано ничего.</li>\n<li>Положение рода в королевстве Пиор — титул выше графского, земли, вассалы, отношения с короной и другими домами — не названо.</li>\n<li>Ожидаемая героем «политическая борьба» в семье не показана и осталась нерешённой: глава обрывается.</li>\n<li>Останется ли семья Бэлут в переписанном варианте «Фанатика» (объявлен 2025-12-17), в переписке не сказано.</li>\n</ul></div>", "r": [["Семья Бэлут", "PS-0334.html"]]}, {"t": "Связи — всё вместе", "a": ["GR-0081--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0332.html\">Дионис Бэлут</a>, <a href=\"PS-0334.html\">Семья Бэлут</a>, <a href=\"PS-0335.html\">Черноволосая служанка</a></li>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0187.html\">Королевство Пиор</a></li>\n<li><strong>Упоминает истории:</strong> <a href=\"IS-0083.html\">Фанатик</a></li>\n<li><strong>Упоминает прозу:</strong> <a href=\"PR-0105.html\">Фанатик (обычный мир)</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0081--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0081.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0081-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0081/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Чинить первым — расщепление <code>PS-0334</code>. Сейчас четыре человека (граф Эдгар, графиня Виктория, Лукас, Алиса) лежат внутри одной записи, заведённой как персонаж: 20485 знаков базы, 2 ссылки. Из-за этого группа из пяти человек числит в участниках одного Диониса (<code>PS-0332</code>), а на Викторию — на которой держится вся сцена ужина и главный неразрешённый вопрос главы («почему прежний Дионис звал мачеху мамой») — сослаться нечем. Тянут этот вопрос сразу три записи с приличным материалом: <code>PS-0332</code> (27762), <code>PS-0335</code> (22874), <code>PR-0105</code> (25915), и все три упираются в отсутствующую сущность. Дыра не в переписке, а в разметке: материал есть весь, ему негде лежать.</p>\n<p>Второе по цене — <code>PS-0333</code> «Прежняя жизнь гг „Фанатика“»: 8410 знаков базы и ноль ссылок на неё. При этом статья цитирует id 397758 — то самое сообщение, из которого <code>PS-0333</code> и собрана. Запись-сирота, вырванная из той же главы, что и семья.</p>\n<h3>С чего начать</h3>\n<p>В базе, архив тут почти не нужен. Внешность и состав — <code>PS-0334</code>; сам текст главы — <code>PR-0105</code>; служанка и её настоящая хозяйка — <code>PS-0335</code>; рамка истории — <code>IS-0083</code> (40562 знака, самый крупный сосед); место действия — <code>MR-0187</code> (8779). Пробел «каким был прежний Дионис» частично закрывается не отсюда, а из <code>PS-0333</code>, где описан герой до попадания, — но именно частично: про прежнего владельца тела там тоже ничего.</p>\n<p>В архив идти стоит за одним вопросом — остаётся ли семья в переписанном «Фанатике». Ориентир: заход 2025-12-17, id 399649–399690, где выложен скелет сюжета пятью пунктами, и всё, что после этой даты. Если в последующих окнах Бэлуты не всплывают, это надо зафиксировать как решённое отрицательно, а не держать открытым.</p>\n<h3>Как развивалось</h3>\n<p>Заявили — 2025-12-09, «обычный исекай в мир фэнтези», ни имён, ни семьи. Назвали — 2025-12-11, история получает имя «Фанатик», автор перечисляет, что понимает в гг, и тут же говорит, что образ «не тот». Забросили — 2025-12-13, третье переписывание с новым гг; вариант с семьёй отброшен ещё до того, как читатель его увидел. Вернулись — 2025-12-14, но не по своей воле: «ну вот то скинь раз забросил», и глава выкладывается именно как заброшенная. 2025-12-17 — новый план сюжета в пяти пунктах, семьи Бэлут нет ни в одном. Вся группа существует внутри отменённой ветки, показанной задним числом.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Про обращение к мачехе правило проговорено дважды и с обеих сторон: Виктория требует не звать её графиней за столом, младшие сообщают, что прежний Дионис звал её мамой, матушкой или матерью. Для обращения к отцу — случай ровно того же рода — правила нет: Дионис зовёт графа «граф», граф на это никак не реагирует, и как звал его прежний Дионис, не сказано. При том что вся сцена построена на том, что герой выдаёт себя неправильными словами.</p>\n<h3>Отклик</h3>\n<p>Самое живое здесь — десятилетний Лукас. Он единственный, кто замечает подмену, и при этом сам же подсовывает старшему брату готовое оправдание: «я слышал, что существует несколько болезней, что искажают восприятия». Ребёнок, который вместо тревоги предлагает объяснение — потому что ему нужно, чтобы брат остался братом. И глава обрывается на его же реплике «мама наверное очень сильно расстроилась», то есть на самом неудобном месте. Понравился и разворот со служанкой: комплимент про первое место на конкурсе, отозванный на последнее, как только выяснилось, чья она на самом деле. Мелочь, но она делает больше, чем вся заготовленная героем «политическая борьба», которой в главе так и не случилось.</p></div>", "r": []}];</script>
