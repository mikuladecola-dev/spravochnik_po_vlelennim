<script>const BASE="";const DOCNAME="Айсберг (остров Юкионы)";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0024-S01", "MR-0024--ustroystvo"], "h": "<p>Айсберг — один из островов архипелага «7 островов», ледяной. Появился как один из четырёх биомов, предложенных Миколаем разом: «болото, тропики, вулканы, айсберг» (2024-07-03, id 194780). Вариант имени в записи — «айсберги», во множественном числе.</p>\n<p>Режим правления на острове — тотальный контроль: «на айсбергах будет тотальный контроль» (2024-07-03, id 194923). Разговор к этому вёлся от вопроса Миколая «как думаешь, будем пихать тоталитаризм?» (id 194917).</p>\n<p>Исполнение режима описано одной репликой: «и ебнутая женщина с миниганом убивать всех ослушивающихся» (2024-07-03, id 194924). То есть ослушавшихся убивает не служба и не армия, а сама защитница острова.</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0024-S02", "MR-0024--naselenie"], "h": "<p>Состав населения не назван. Из переписки известна только фигура правящей женщины с миниганом.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0024-S03", "MR-0024--mesto-vo-vselennoy"], "h": "<p>Айсберг входит в «7 островов» — запись отнесена к этой части. Связан с сущностями «Режимы правления островов» и «Юкиона»; связка острова с Юкионой зафиксирована в карточке записи (имя «Айсберг (остров Юкионы)» и раздел «Связано с»), но в самих процитированных сообщениях женщина с миниганом по имени не названа.</p>\n<p>В том же обмене распределялись режимы и по другим островам. Слава на предложение отдать тоталитаризм Нуару ответил: «Ну нуар хороший челик / А вообще можно одному из островов» (id 194920), после чего Миколай решил: «тогда у него будет Федеративная республика» (id 194921) — то есть Нуару досталась федеративная республика, а тоталитаризм ушёл на остров. Следующая реплика: «ну тогда дам этот грех женщине» (id 194922) — режим айсберга привязан к греху, закреплённому за женщиной. Какой именно грех, в этом фрагменте не назван.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0024-S04", "MR-0024--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-07-03</strong> (окно w0041, id 194778–194784). Миколай предложил разделение на биомы: «может это будут разные биомы?» — Слава: «Можно 😁». Айсберг назван четвёртым в списке «болото, тропики, вулканы, айсберг». Одобрение Славы дано с оговоркой: «Ну пока норм» (id 194782).</p>\n<p><strong>Версия 2 — 2024-07-03</strong> (окно w0041, id 194917–194924), тем же вечером, около 19:52–19:54. Айсбергу назначен тотальный контроль и добавлена фигура женщины с миниганом, убивающей ослушавшихся. Ледяной характер острова при этом не отменялся.</p>\n<h3>Отклонённое</h3>\n<p>Тоталитаризм сначала предлагали персонажу Нуару («нуару например», id 194919). Вариант отведён Славой — Нуар «хороший челик», а тоталитаризм лучше отдать одному из островов. Нуару взамен назначена федеративная республика.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0024-S05", "MR-0024--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Устройство самого острова (кроме того, что он ледяной) не описано.</li>\n<li>Население не названо.</li>\n<li>Какой именно грех «дан женщине» — в этом фрагменте не сказано.</li>\n<li>Имя защитницы в процитированных сообщениях не звучит.</li>\n<li>Как тотальный контроль устроен помимо личных убийств — не расписано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0024--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0024--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-03</td>\n<td>194778–194784</td>\n<td>w0041</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-03</td>\n<td>194917–194924</td>\n<td>w0041</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0024-aysberg-ostrov-yukiony.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0024--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0024.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
