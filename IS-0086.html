<script>const BASE="";const DOCNAME="Любимый город";
const LEAD="";
const CH=[{"t": "Содержание", "a": ["S01", "IS-0086-S01", "IS-0086--soderzhanie"], "h": "<p>История написана Славой от первого лица и выложена тремя сообщениями подряд (2026-02-14, id 432538–432540). Заголовок дан самим автором первой строкой: «Любимый город».</p>\n<p><strong>Пролог-биография.</strong> Текст открывается самоаттестацией рассказчика: «Не назвать мою жизнь удачной. К сожалению». Дальше перечислено, из чего его биография состоит: «Было лишь пару горячительных напитков и интересные таблеточки, конечно и сигареты, как без них-то». Отдельно оговорено, чего в ней не было: в азартные игры не играл, «потому что чаще всего выигравал», сердцеедом не был, «потому что болела голова от попыток угодить другому человеку». Итог пролога: «Ну и в принципе вся моя биография». Дальше рассказчик говорит, что всё могло бы кончиться тем, что «моё тело бы сказало гудбай и я помер», но случился «момент в мой жизни, который что-то возможно изменил», и тут же поправляет себя: «Точнее это не момент, а места». После этой строки идёт разделитель, и начинается основное действие.</p>\n<p><strong>Пробуждение на крыше.</strong> Рассказчик просыпается «скрючившись в калачик после ночной гулянки». Состояние описано телесно и подробно: ломит всё тело, в горле пересохло до того, что «ты чувствуешь как отваливаються какие-то куски с твоего горла», похмелье, «что двоечкой пробивает твою черепушку», солнце бьёт в опухшее лицо. По ощущению холода на коже («тело продувает и на коже образовались маленькие пупырышки») он понимает, что находится на открытом воздухе. Затем нащупывает под собой «что-то колючее, но при этом податливое» — траву. Первый вывод рассказчика: в городе, «в тем более в моём», травы на улицах не найдёшь, значит он в лесу или в парке, «который недавно подожгли, какие-то подростки».</p>\n<p>Попытка подняться даёт потемнение в глазах и почти рвоту. Восстановив зрение, он видит, что лежит на подстриженной лужайке — «строго постриженная, словно прическа солдата», — и что лужайка находится «на долбаной крыше пятиэтажки». На лужайке, кроме него, ещё шесть человек, все без сознания: мужчина средних лет с обручальным кольцом на пальце, пацан лет десяти, подросток, молодая женщина «в отключки», старичок и «девчуля подросток». Рассказчик подводит итог составу: «Идеальная команда для семейного конкурса. Всё такие ухоженные и единственный я белая ворона».</p>\n<p>Версию про розыгрыш («Прикольно приколист решил пьяных людей сюда притащить») он отбрасывает из-за десятилетнего мальчика, тоже лежащего без сознания.</p>\n<p><strong>Побег.</strong> Здесь вводится опорная для текста формулировка — «инстинкт трёх принципов \"Бей, беги, замри\"». Рассказчик выбирает бег, и объясняет выбор двумя причинами: инстинктивным пониманием, что ему, «мясоеду», не место на зелёной лужайке, и трезвым расчётом, что оставаться в группе, «в которой я очнулся первым, и в которой я самый подозрительный, не лучшая идея».</p>\n<p>Встав, он впервые осматривает крышу: бортиков нет, то есть «кто нибудь из этих спящих бедолаг в принципе мог перевернуться и выпасть»; кроме травы на крыше есть бетонное сооружение с железной дверью — выход. Дверь открывается, из неё идёт застоявшийся воздух. На спуске рассказчик отмечает две вещи: бежать в помещении с застоявшимся воздухом тяжело («чувствуешь как пылинки оседают в твоих лёгких»), и что здание, судя по всему, заброшка — «нет здесь людей, вещей которые бы обозначали, что здесь живут», что он считает логичным: «Вряд ли бы нас кто на жилое здание поперл бы».</p>\n<p>Сверху раздаётся хлопок двери и шаги («Топ-топ»). Рассказчик, снова по «принципу трёх инстинктов», бежит вниз, начинает прыгать через ступеньки, неправильно рассчитывает расстояние, падает и «громко шлепнушись о бетонный пол». Его рвёт. Шаги приближаются, он отползает в угол и «пытается притвориться стеной».</p>\n<p><strong>Жених.</strong> Мимо по лестнице спускается «силуэт мужчины в чёрной кофте». Мужчина на мгновение останавливается, тяжело дыша, смотрит на рассказчика, «но быстро потеряв ко мне интерес побежал дальше вниз». Рассказчик опознаёт его как того самого мужчину с обручальным кольцом и даёт ему имя: <strong>Жених</strong>. Дальше идёт его догадка о мотивации: «И куда он так целеустремленно несётся» — то есть либо Жених что-то знает, «ну или он психанул, когда очнулся на крыше и просто начал бежать». Рассказчик склоняется к первому, потому что «лицо его выглядили уж слишком собраным и полным надежд», и тут же над собой иронизирует: «Вау как я умело могу читать людей. Надеюсь».</p>\n<p>После ухода Жениха возвращается боль: адреналин «начал от меня убегать, а боль начала догонять», ноют руки и рёбра, «как будто мы мозг набух и давит на черепушку». Отдельным ходом идёт рассуждение про телефон: позвонить в больницу было бы неплохо, но рассказчик не знает, где он, а «телефон у меня кирпич», и геолокацию, «вроде как», узнать не сможет. Аргумент к этому: «В армию же можно с кирпичем, а значит он не показывает геолокацию».</p>\n<p><strong>Пустой город.</strong> Выйдя из здания, рассказчик несколько минут стоит с закрытыми глазами, а открыв, обнаруживает, что вокруг никого. Перечислено через отрицание: ни взглядов отвращения из-за грязных штанов, ни гула машин, «ни даже песни наших младших пернатых братьев. Ничего». Возникают три вопроса — «Что это за город?», «Почему здесь никого нет?», «Как я здесь оказался?» — но перебивает их четвёртый, который для рассказчика важнее: «Где мне найти воду?». Обоснование: «Каким бы не был ты героем, ты не сможешь совершать великий подвиги не утолив свои билогический хателки».</p>\n<p>Прогулка по пустым улицам описана как непривычная: он человек, «прожившие в городе, где на каждом шагу есть человек», а тут пусто и тихо — «настолько тихо, что звенит в ушах или это потому что я всё же плохо прикрыл голову и стукнулся».</p>\n<p><strong>Магазин.</strong> Рассказчик находит вывеску «магазин 24». Дверь снова открыта («Почему то на двери мне сегодня везёт. Хотя я всегда был везунчиком»). Внутри темно, но воздух не застоявшийся, витрины с продукцией на месте. Он перелезает через прилавок и пьёт воду — «Да именно глотать, а не пить», — опустошает бутылку, берётся за вторую.</p>\n<p>Дальше — разочарование: «в моих фантазиях вкус воды был таким приятным, а на деле просто безвкусная вода». Взгляд останавливается на холодильнике с напитками, которые «прям спецально вызывающие выглядили». Рассказчику слышится: «Эй дружек выпей нас. Тебе сразу полегчает», и он комментирует: «Я же человек не привыкшей отказываться от просьбы».</p>\n<p>Запой описан через смену тары: сначала банки пива, потом на полу начинают валяться и стеклянные бутылки. Воспоминания тускнеют, дальнейшее идёт «лишь кадроми»: он бил витрины, разбивал бутылки, сходил в туалет прямо в магазине, «напивал какую-ту песню».</p>\n<p><strong>Финал куска.</strong> Сознание возвращается ночью в переулке, в «луже теплое жидкости». Первая мысль — «Че я за свинья под себя сходил», вторая — «Бок...болит». Мысли соединяются в третью: «кровь?!». Он хватается за бок и отползает от лужи. В темноте города, которая «не давали пробиться луному цвету», цвет жидкости не виден, «но в моёй голове цвет уже был ярко красным». На этом текст обрывается.</p>", "r": []}, {"t": "Персонажи", "a": ["S02", "IS-0086-S02", "IS-0086--personazhi"], "h": "<p><strong>Рассказчик</strong> — безымянный, голос от первого лица. Из пролога: пил, употреблял таблетки, курил, в азартные игры не играл, отношений избегал. Считает себя везунчиком, ходит с кнопочным телефоном («кирпич»). Называет себя «мясоедом» и «белой вороной» на фоне остальных шести. В карточке истории он же проходит под именем <strong>Рассказчик «Любимого города»</strong>.</p>\n<p><strong>Жених</strong> — имя дано рассказчиком по обручальному кольцу, других имён у персонажа в тексте нет. Мужчина средних лет, при пробуждении на нём чёрная кофта. Первым (после рассказчика) приходит в себя, хлопает дверью, бежит вниз по лестнице мимо лежащего рассказчика, останавливается на мгновение и бежит дальше. Лицо описано как «слишком собраным и полным надежд». Отдельная сущность справочника — Жених.</p>\n<p><strong>Пятеро остальных на крыше</strong> — пацан лет десяти, подросток, «девчуля подросток», молодая женщина, старичок. В тексте они не приходят в себя и в действии не участвуют.</p>\n<p><strong>Пустой город</strong> — место действия; в справочнике проходит отдельной сущностью — Пустой город. В самом тексте у города нет названия, есть только пятиэтажка-заброшка с газоном на крыше, улицы и «магазин 24».</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "IS-0086-S03", "IS-0086--mesto-vo-vselennoy"], "h": "<p>Отнесение к Иссекаю держится на одной реплике Славы, поставленной сразу после третьего куска текста: «Я снова вернулся к Иссекаю» (2026-02-14, id 432541). Больше ни в первом, ни во втором окне вселенная не называется и с известными местами Иссекая история не связывается. В карточке самой истории по этому поводу стоит оговорка: вселенная указана по соседней реплике, «возможно, это жанр, а не название вселенной».</p>\n<p>В карточке истории также значится связь с «историей про ледяной ад»; в самой переписке (id 432535–432549, 433102–433184) ледяной ад не упоминается ни разу.</p>", "r": []}, {"t": "Состояние", "a": ["S04", "IS-0086-S04", "IS-0086--sostoyanie"], "h": "<p><strong>Написано за один заход.</strong> Три сообщения подряд в 09:26 (2026-02-14, id 432538–432540), плюс реплика про возвращение к Иссекаю в 09:29 (id 432541). Продолжения в окне w0117 нет; текст обрывается на сцене в переулке. История не закончена.</p>\n<p><strong>Совпадение с планом Миколая (2026-02-16, id 433110–433128).</strong> Через два дня Миколай читает и первым делом фиксирует, что у него самого «историю сейчас планирую», «то есть план писал», «и там такая же идея». Происхождение совпадения он не выясняет, а перечисляет варианты: «мб по забыл и украл», «мб спи додумался». На вопрос Славы «И че по плану?» отвечает: «очень интересно», «все», «я хочу написать», «будет либо хуйня либо очень круто». Слава спрашивает, хватит ли мотивации; Миколай: «думаю да», «такая история должна быть написана», «мощно», «но страшно». Что именно за план и как он соотносится с «Любимым городом» кроме «такой же идеи» — не сказано.</p>\n<p><strong>Построчный разбор Миколая (2026-02-16, id 433129–433148).</strong> Разбор идёт очередью коротких реплик, без указания, к каким конкретно строкам они относятся. Основной вопрос — о голосе: «это кто говорит», «персонаж?», «а зачем он так говорит», «ты пытаешься красиво описать?», «для чего эти детали?», «почувствовать?». На собственный вопрос отвечает: «чувствую», «но это чей-то голос», «так персонаж говорит?», «я ему не верю», «ну зачем он так говорит». Затем претензию снимает сам: «ну да, тут в целом другая идея», «она работает на себя», «так что нахуй претензию», «просто это другое». Дальше — «красиво», «красиво», «ты прям красиво пишешь», «крутые детали», «ты прям рисуешь текстом».</p>\n<p><strong>Сравнение через нейросети (2026-02-16, id 433149–433174).</strong> Миколай сообщает, что прогонял тексты через нейросети и что те ставят его собственную историю выше: «почему нейронки сравнивая твою и мою историю пишут что моя сильнее», «это странно». Слава спрашивает, какую свою работу он сравнивал; Миколай кидает фрагмент собственной прозы — сцену с Мрк'грш'тракларом (он же Марк, «багрянник», крылатый кузнец) у тёмного угла в Блэквеле и эльфом со множеством косичек. Уточняет, что кидал ещё историю подруги — «она куда хуже твоей», «я её ваще не понял», — но «я сравнил только наши два». Тексты обеих машинных рецензий он вставляет в переписку целиком (id 433169 и 433173–433174, вторая с пометкой «другой хуй», то есть другая нейросеть).</p>\n<p>Обе рецензии ставят «Любимый город» ниже, чем текст Миколая, при этом отмечают у него живой голос рассказчика, работающий юмор («идеальная команда для семейного конкурса», «великое слово блять»), плотную физиологию и затягивающую ситуацию, а слабым называют техническую сторону: орфографию, избыточность, проговаривание за читателя. Вторая рецензия отдельно предъявляет логику поведения: герой, проснувшись в мёртвом городе, «первым делом бежит бухать в магазин», что делает его «плоским \"алкашом-функцией\"».</p>\n<p>Реакция Славы: «Ему просто не понравилось моя грамматика гандон» (id 433172) и «Прозвучала слегка обидна» (id 433176). Миколай соглашается («реально»), потом отвечает: «прыгай», «он пидрила просто», «забей на него», «у тебя хорошо», «пишется» (id 433177–433181).</p>\n<p><strong>Мотивация Жениха (2026-02-16, id 433167–433168).</strong> Миколай предлагает две трактовки того, почему Жених, увидев рассказчика, потерял к нему интерес и побежал дальше: «либо он подумал что мальчик не человек / либо он подумал что он не пьяный», и добавляет — «а кркк набухался». Слава на это в переписке не отвечает; какая из трактовок принята, не решено.</p>\n<p><strong>Размер газона (2026-02-16, id 433182–433184).</strong> Миколай: «насколько она широкая интересно, 150 м²». Слава: «Хрен знает». Площадь крыши с газоном осталась неустановленной.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "IS-0086-S05", "IS-0086--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Продолжения нет. Текст обрывается на сцене в переулке; кто ранил рассказчика, ранен ли он вообще (кровь только предполагается: цвет в темноте не виден), в переписке не сказано.</li>\n<li>Не сказано, как рассказчик и шестеро остальных попали на крышу, кто их туда доставил и зачем.</li>\n<li>Пятеро спящих, кроме Жениха, не разработаны: имён нет, что с ними стало после ухода рассказчика с крыши — не сказано.</li>\n<li>Куда бежал Жених и что он знал (если знал) — осталось нерешённым; Миколай предложил два объяснения его безразличия к рассказчику, выбор не сделан.</li>\n<li>Название и расположение пустого города не даны. Не сказано и то, из какого города рассказчик родом, хотя он на него ссылается («в тем более в моём»).</li>\n<li>Связь с Иссекаем держится на одной реплике «Я снова вернулся к Иссекаю» и в самом тексте ничем не подкреплена; в карточке истории отмечено, что это может быть жанровое обозначение, а не название вселенной.</li>\n<li>Площадь газона на крыше не установлена: на предположение «150 м²» ответ — «Хрен знает».</li>\n<li>Ссылка на codepen, отправленная Миколаем в тот же день (2026-02-14, id 432549), никак не прокомментирована; связана ли она с историей — не сказано.</li>\n<li>План Миколая с «такой же идеей» в переписке не изложен, текст плана не приводится.</li>\n<li>Правки по итогам разбора не вносились: переписанной версии текста в окне w0117 нет.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["IS-0086--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0087.html\">Группа на крыше (шесть спящих и рассказчик)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0005.html\">Иссекай</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["IS-0086--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-02-14</td>\n<td>432535–432549</td>\n<td>w0117</td>\n<td>Иссекай (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-02-16</td>\n<td>433102–433184</td>\n<td>w0117</td>\n<td>Иссекай (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/istorii/IS-0086-lyubimyy-gorod.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["IS-0086--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/IS-0086.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["IS-0086-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/IS-0086/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Чинить первым — план Миколая, который «случайно» совпал с этой историей. Запись <code>SL-0132</code> («План истории про ледяной ад») уже лежит в базе (4938 знаков), но статьи у неё нет, и с «Любимым городом» её никто не сопоставил. А ведь именно вокруг неё крутится разговор 2026-02-16 (id 433110–433128): «то есть план писал», «и там такая же идея» — без этой записи совпадение так и останется голой репликой, не проверяемой ничем.</p>\n<h3>С чего начать</h3>\n<p>В базу: <code>SL-0132</code> — сравнить её с текстом «Любимого города» и со статьёй <code>IS-0087</code> («история про ледяной ад», 8618 знаков базы), с которой эта история тоже числится связанной, хотя в самой переписке ледяной ад не упомянут ни разу. Если план и «Любимый город» действительно про одно и то же — это должно быть видно по <code>SL-0132</code> напрямую, без похода в архив.</p>\n<h3>Как развивалось</h3>\n<p>Заявили: 14 февраля 2026, три сообщения подряд (id 432538–432540) плюс «Я снова вернулся к Иссекаю» (id 432541). Дальше — тишина: ограничили себя простым молчанием, два дня без единой реплики по тексту. 16 февраля вернулись — построчный разбор, потом сравнение через нейросети, которое ставит «Любимый город» ниже собственного текста Миколая. Форма на этом обрывается на стадии «забыли»: реакция Славы («Прозвучала слегка обидна») закрыта репликой «забей на него», а правок по итогам разбора в переписке нет.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Рассказчик уверенно достраивает мир по обрывкам почти везде: трава — значит не улица, значит парк или лес; нет вещей в здании — значит заброшка; сухость в горле — значит опасно, надо искать воду в первую очередь. Тот же самый навык — уверенно делать вывод по обрывку — ни разу не применяется к главному вопросу текста: кто эти шестеро и почему они здесь. Рассказчик формулирует три вопроса подряд и тут же сам их отбрасывает ради поиска воды.</p>\n<h3>Отклик</h3>\n<p>Зацепила не сама история, а её разбор: сцена, где Миколай сравнивает два текста через нейросети и получает, что его собственный текст оценён выше, а потом отвечает на это простым «забей на него» — редкий момент, где авторская правка идёт не по содержанию, а по тому, кто и как задел самолюбие. Живее, чем сам текст про пустой город.</p></div>", "r": []}];</script>
