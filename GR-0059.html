<script>const BASE="";const DOCNAME="Правительственная организация по контролю";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0059-S01", "GR-0059--chto-eto"], "h": "<p>Правительственная организация по контролю — организация мира Оам (в переписке чаще пишется «Оэм»), назначение которой в тексте описано одной строкой: она контролирует все прочие расы и организации этого мира. Дословная формулировка Славы, с которой организация появляется и которой она же повторяется через три недели: «Правителская организации по контролю всех этих. Сильнейшая там девченка что может изменять мир волнами» (2025-11-17, id 385768; повтор 2025-12-06, id 393287).</p>\n<p>Слово «этих» отсылает к предшествующему перечню: организация введена не отдельно, а внутри списка рас и организаций мира — после Детей мирового древа, «проротых каменных челике», Азуриэль и группировки сестры, перед церковью с паладинами, организацией Виктора, пернатыми, орденом для убийства котов, вампирами и Аскизами. То есть «все эти», которых организация контролирует, — это участники того же списка, в котором она сама стоит.</p>\n<p>Собственного названия у организации нет: в переписке она называется только по функции — «правителская организации по контролю», «Правителская организация». В карточках базы закреплён вариант написания «Правительственная организация по контролю».</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0059-S02", "GR-0059--sostav"], "h": "<ul>\n<li><a href=\"PS-0327.html\">Девушка, изменяющая мир волнами</a> — «Девушка, изменяющая мир волнами». Единственный названный участник. В обоих перечислениях она вводится как сильнейшая в организации: «Сильнейшая там девченка что может изменять мир волнами» (2025-11-17, id 385768; 2025-12-06, id 393287).</li>\n</ul>\n<p>Отдельно, в разборе сильнейших фигур мира, она названа третьей в перечне и отнесена к людям: «3 и на стороне людей девушка. Опять же я ее не продумал. Помнишь фантазера с волнами. Вот её способность. По сути она одна из немногих, что может изменять законы мира» (2025-12-06, id 393300). Разбор начат репликой «Прежде чем разбирать злодеев. Давай сначала проясним сильнейших» (2025-12-06, id 393295), то есть девушка попала в перечень сильнейших мира, а не только сильнейших организации.</p>\n<p>Её способность — «изменение мира волнами» (<a href=\"SP-0247.html\">Изменение мира волнами</a>). Способность не придумана заново, а взята у уже существовавшего персонажа: «Помнишь фантазера с волнами. Вот её способность» (2025-12-06, id 393300). Механика волн в переписке не раскрыта. Указан только результат: она «одна из немногих, что может изменять законы мира».</p>\n<p>Тем же оборотом описано действие Нуара, одного из девяти котов: «Кстати нуар один из котов» / «Помнишь нуара. Сильнеший из 7 островов» / «Ну здесь он будет влиять на мир подобно волнами» (2025-11-17, id 385774–385779). Одна ли это способность у двух носителей или совпадение формулировки — в переписке не сказано; Нуар при этом к организации не отнесён.</p>\n<p>Имени у девушки нет, характер не проработан: «Опять же я ее не продумал» (2025-12-06, id 393300).</p>\n<p>Других участников не названо. Поимённого состава организации в переписке нет.</p>", "r": [["Девушка, изменяющая мир волнами", "PS-0327.html"], ["Изменение мира волнами", "SP-0247.html"]]}, {"t": "Иерархия", "a": ["S03", "GR-0059-S03", "GR-0059--ierarhiya"], "h": "<p>Внутри организации назван один уровень: девушка с волнами — «сильнейшая там». Кто ею командует, кому она подчиняется и есть ли у организации руководитель, в перечнях не сказано.</p>\n<p>В записи организации к версии от 2025-12-06 отнесён фрагмент про босса: «Это босс будет хитрым и уверенным. Хотя обычные человек. Попытается наладить связь с Имитам» (id 393479). В приведённом куске переписки не сказано, чьим боссом он является и относится ли он к правительственной организации, — реплики, где он вводится, в выписку не попали.</p>\n<p>Место самой организации в силовой иерархии мира Оэм задано общим порядком, который Слава выстроил в том же перечне (2025-11-17, id 385768; повтор 2025-12-06, id 393287):</p>\n<ul>\n<li>коты — сильнейшие, их девять, «они вообще никуда не вмешиваться»;</li>\n<li>апостолы — «21 вторая по силе раса на земле»;</li>\n<li>«ну и дальше расы и организации который равны по силе с друг другом» — в этом третьем, уравненном между собой ряду и стоит правительственная организация.</li>\n</ul>\n<p>Отдельно оговорено, что сила не исчерпывается расами: «в мире есть просто индивиды который могут быть сильными».</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S04", "GR-0059-S04", "GR-0059--otnosheniya-s-drugimi-gruppami"], "h": "<p>Общая функция — контроль над всеми прочими расами и организациями мира. Как этот контроль устроен, какими средствами осуществляется и признают ли его контролируемые, в переписке не сказано.</p>\n<p>Названа одна конкретная связь — с апостолами, и она идёт через Имита (Имитатора): «Так как для правительства. Представитель Апостоловы именно Имит» (2025-12-06, id 393480). Имит выступает представителем апостолов именно перед правительством; членом организации он при этом не назван. Реплика идёт сразу за фрагментом про босса, который «попытается наладить связь с Имитам» (id 393479).</p>\n<p>Прочие организации из того же перечня — церковь с паладинами, организация Виктора, группировка сестры (дочери Имитатора), орден для убийства котов и остальные — с правительственной организацией напрямую в переписке не соотнесены, кроме общей формулы про контроль «всех этих».</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S05", "GR-0059-S05", "GR-0059--kak-menyalas"], "h": "<p><strong>2025-11-17 (id 385768–385769, окно w0109).</strong> Организация заведена внутри большого перечня рас и организаций мира как надзорная структура над всеми ними. Одной строкой названа её функция и её сильнейший боец — девчонка с волновым изменением мира. Тогда же, в том же окне (id 385774–385779), тот же оборот про волны применён к Нуару.</p>\n<p><strong>2025-12-06, 17:36 (id 393286–393290, окно w0112).</strong> Перечень воспроизведён дословно, строка про организацию не изменена. К перечню добавлена реплика: «В нашем мире Оэм уже существует много сторон для конфликта» (id 393290).</p>\n<p><strong>2025-12-06, 17:46–17:48 (id 393299–393302).</strong> Девушка вынесена из перечня в отдельный разбор сильнейших: она третья в списке, на стороне людей, её способность — те же волны, что у «фантазёра с волнами», и она «одна из немногих, что может изменять законы мира». Тут же зафиксировано, что сама она не продумана.</p>\n<p><strong>2025-12-06, 21:55–21:57 (id 393479–393481).</strong> Уточнена связь с апостолами: их представителем для правительства назван Имит. В тот же фрагмент попал босс, «хитрый и уверенный», «хотя обычные человек», который «попытается наладить связь с Имитам».</p>\n<p>За пределами этих четырёх заходов организация не дорабатывалась. Отклонённых вариантов её устройства в переписке нет — правок к строке про неё не вносилось вообще, второе появление перечня повторяет первое слово в слово.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "GR-0059-S06", "GR-0059--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Названия у организации нет — только описание функции.</li>\n<li>Поимённого состава нет: назван один участник, и у него нет имени.</li>\n<li>Численность, структура, подразделения не описаны.</li>\n<li>Цель организации сверх «контроля всех этих» не сформулирована; чего она добивается и от чего защищает — не сказано.</li>\n<li>Механизм контроля не описан: чем именно она контролирует расы и организации, есть ли у неё силовой ресурс помимо девушки с волнами — не сказано.</li>\n<li>Руководство не названо. Фрагмент про босса (id 393479) в выписке не привязан прямо ни к какой стороне; кто он — осталось нерешённым.</li>\n<li>Механика способности «изменение мира волнами» не раскрыта. Совпадает ли она со способностью Нуара или это совпадение формулировки — в переписке не сказано.</li>\n<li>Имя и характер <a href=\"PS-0327.html\">Девушка, изменяющая мир волнами</a> не придуманы, автором это отмечено прямо.</li>\n<li>Отношение организации к котам, апостолам как расе (помимо канала через Имита) и к остальным организациям перечня не разобрано.</li>\n<li>Название мира в переписке пишется двояко — «Оэм» у Славы, «Оам» у Миколая; какое написание основное, не оговаривалось.</li>\n</ul></div>", "r": [["Девушка, изменяющая мир волнами", "PS-0327.html"]]}, {"t": "Связи — всё вместе", "a": ["GR-0059--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0327.html\">Девушка, изменяющая мир волнами</a></li>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0247.html\">Изменение мира волнами</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0059--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0059.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0059-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0059/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — <code>SL-0054</code>, «Список 12 апостолов»: статьи нет, а в базе 234 КБ и на запись ссылаются семь статей, включая узловые для Оама. Это самая дорогая дыра во всём кусте, и для этой статьи она не абстрактная: единственная названная внешняя связь организации идёт через апостолов («Представитель Апостоловы именно Имит»), а сами апостолы существуют как нераспакованный ком. Отдельно там сидит несостыковка, которая касается и здешней иерархии: в перечне сил Оама апостолов 21, а нераспакованный список — на 12.</p>\n<p>Второе — <code>MR-0202</code>, «Фантазёры и провал в свой мир»: статьи нет, 15,2 КБ базы, одна ссылка. Способность единственного названного участника организации взята не заново, а у «фантазёра с волнами». Пока фантазёры не разобраны, происхождение этой способности некуда положить, и <code>SP-0247</code> (5,1 КБ) остаётся описанием без источника.</p>\n<p>Третье, структурное. Мир этой статьи расщеплён на четыре записи: <code>MR-0182</code> («Оэм», 16 входящих ссылок — больше, чем у любой сущности в базе), <code>MR-0164</code> («Оам», 5), <code>MR-0165</code> («Мир Оам», 3) и <code>VS-0008</code>. Расхождение «Оам/Оэм», отмеченное здесь как мелочь в пробелах, на уровне связей выглядит как два разных хаба одного мира.</p>\n<h3>С чего начать</h3>\n<p>Всё в базе, архив нужен точечно.</p>\n<p>Фрагмент про босса (id 393479), про который здесь честно сказано, что он ни к чему не привязан, на самом деле привязан к шести записям сразу: <code>PS-0325</code> («Босс группировки дочери»), <code>PS-0182</code> («Агрегат»), <code>PS-0323</code> («Граф»), <code>PS-0293</code>, <code>PS-0383</code> и <code>IS-0017</code>. Предшествуют ему сообщения 393473–393478 — про дочь Имита, про то, что имя её не придумано, и про то, что «у Агрегат, Графа и Защитника судьба предрешена». То есть контекст у реплики есть, он просто не в этом окне. Смотреть надо туда, прежде чем решать, чей это босс.</p>\n<p>Продолжение того же вечера, обрывающееся здесь на 393481, записано в <code>SL-0054</code> и <code>SL-0125</code> — сообщения 393482–393490, где Слава говорит «А также отдельно апостолы. Я ведь изменил их и сделал насекомыми» и «Я думал ты ещё свои идей подкинишь». <code>SL-0125</code> («Список нерешённых вопросов по миру Оэм», 3,9 КБ, статьи нет) — вообще первое, что стоит открыть: авторы сами вели такой список.</p>\n<p>Девушка с волнами: <code>PS-0327</code> (5,9 КБ) и <code>SP-0247</code> (5,1 КБ) — но материала там ровно столько же, сколько здесь. За новым — только в архив: окна w0109 (2025-11-17, вокруг id 385768) и w0112 (2025-12-06, вокруг 393286–393302 и 393479–393490). Больше организация нигде не звучит.</p>\n<h3>Как развивалось</h3>\n<p>Четыре захода, два окна, три недели между ними. 2025-11-17 — организацию заводят внутри перечня, одной строкой: функция плюс сильнейший боец. 2025-12-06, 17:36 — перечень воспроизведён дословно, строка про организацию не тронута ни на слово. 17:46 — девушку вынимают из перечня в отдельный разбор сильнейших мира и в той же реплике помечают: «Опять же я ее не продумал». 21:55 — достраивают единственную внешнюю связь, через Имита, и разговор уходит.</p>\n<p>Отклонённых вариантов у организации нет вообще: за всё время в неё ничего не переписывали — только повторяли и добавляли снаружи.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для верхнего этажа иерархии правило названо: коты сильнейшие и «они вообще никуда не вмешиваться». Это прямое правило отношений — их не трогают и они не трогают.</p>\n<p>Для организации названо своё правило — «контроль всех этих». Но она стоит в третьем, уравненном ряду того же перечня, ниже котов и апостолов, а «эти» — участники того самого перечня. Входят ли в «этих» те, кто стоит выше неё, не проговорено: правило невмешательства сформулировано с одной стороны, правило контроля — с другой, и место, где они встречаются, пустое.</p>\n<h3>Отклик</h3>\n<p>Зацепила одна реплика: «3 и на стороне людей девушка. Опять же я ее не продумал». Персонажа ставят третьим в списке сильнейших мира — и тут же, не переводя дыхания, сообщают, что его нет. Причём способность ей выдали подержанную: «Помнишь фантазера с волнами. Вот её способность» — то есть механика пережила своего носителя и переехала в другого. И сама организация в этом духе: у неё нет имени, только глагол. «Правителская организации по контролю всех этих» — контроль без лица, без здания, без единого человека, кроме безымянной девочки, которая может менять законы мира. Формулировка «всех этих» с двух заходов не изменилась ни на букву, и в ней слышно, как автор рукой обводит собственный список. Это не небрежность, это стенограмма скорости: мир строится быстрее, чем успевают называться его части.</p></div>", "r": []}];</script>
