<script>const BASE="";const DOCNAME="Мета-люди";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0031-S01", "GR-0031--chto-eto"], "h": "<p>Мета-люди — не команда и не организация, а класс носителей силы: категория людей, у которых есть энергия или способность, помимо защитника. Термин ввёл Слава в разговоре о том, как защитники защищают целые острова (2024-07-04, id 196705–196714): «Защитник- сильнейший человек на острове», «Есть другие мета-люди».</p>\n<p>Название взято на пробу и авторами прямо заявлено как временное: «Где то услышал», «Ну пусть будут пока мета» (2024-07-04, id 196710–196711). Замены термину в переписке не предложено.</p>\n<p>Определение дано двумя короткими репликами подряд: «Мета- люди с энергий», «Способностью» (2024-07-04, id 196712–196713). Никакого другого критерия принадлежности к мета-людям в переписке не названо.</p>\n<p>Ключевое свойство класса — его размер. Мета-людей, по формулировке Миколая, «дохуя» (2024-07-04, id 197051), и из этого авторы выводят рабочий приём: раз их так много, среди них находится носитель почти любой нужной механики. Именно так класс и используется в переписке — как резерв, из которого достаётся человек под возникшую задачу.</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0031-S02", "GR-0031--sostav"], "h": "<p>Поимённого состава нет. В переписке не названо ни одного мета-человека по имени.</p>\n<p>Единственный обозначенный носитель — мета-человек, утилизирующий мусор (<a href=\"SP-0084.html\">Мета-человек, утилизирующий мусор</a>), и он назван не именем, а функцией: «мета челик» (2024-07-04, id 197066). Он закреплён за Дриадой (<a href=\"PS-0115.html\">Дриада</a>): «У дриады», «Будет человек», «И он будет только у нее» (2024-07-04, id 197062–197069).</p>\n<p>Защитник в переписке противопоставлен остальным мета-людям («Защитник- сильнейший человек на острове / Есть другие мета-люди», id 196706), но прямо ли защитник входит в класс мета-людей или стоит рядом с ним — в переписке не сказано.</p>", "r": [["Дриада", "PS-0115.html"], ["Мета-человек, утилизирующий мусор", "SP-0084.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0031-S03", "GR-0031--obschie-sposobnosti-gruppy"], "h": "<p>Общее у всех участников класса — наличие энергии или способности: «Мета- люди с энергий», «Способностью» (2024-07-04, id 196712–196713). Никакой общей для всех мета-людей конкретной механики, единого источника силы или общего умения в переписке не названо.</p>", "r": []}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0031-S04", "GR-0031--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p>Различие проработано на одном примере — на мета-человеке, утилизирующем мусор. Задача возникла из бытового вопроса: грязь и пыль собирают в одном месте и вывозят, и Слава спрашивает — «Вот только сколько раз им придется их возить», «И куда» (2024-07-04, id 197047–197048). Миколай отвечает через класс: «мета людей же дохуя», «может есть те, кто может как-то перерабатывать эту залупу», «или на крайняк сжигать бесследно» (2024-07-04, id 197051–197053).</p>\n<p>Дальше Слава задаёт вопрос «На каком острове этот человек будет?» (2024-07-04, id 197054), и Миколай отвечает вариантом, в котором носители одной и той же роли различаются по островам — «мой варик на каждом особенный» (2024-07-04, id 197058). Перечисленные способы утилизации (2024-07-04, id 197059–197064):</p>\n<ul>\n<li>на одном — «отправляет эту залупу в какое-то пустое измерение»;</li>\n<li>на другом — «сжигает до тла»;</li>\n<li>в другом — «перерабатывает во что-то полезное»;</li>\n<li>в другом — «уменьшает количество».</li>\n</ul>\n<p>Островов при этом семь, а способов перечислено четыре; остальные три в переписке не названы.</p>\n<p>Этот вариант в том же разговоре был заменён (см. «Как менялась»): по итогу такой мета-человек остался один, «И он будет только у нее» (id 197069), «только один» (id 197072). Четыре способа при этом никак не переназначены — какой именно из них у оставшегося одного, в переписке не сказано. По сводке Дриады (<a href=\"PS-0115.html\">Дриада</a>) за ней закрепляется тот, кто перерабатывает мусор во что-то полезное; в самих репликах эта привязка конкретного способа к Дриаде не проговорена.</p>\n<p>Кроме мусорной специализации, никаких других различий между мета-людьми в переписке не разобрано.</p>", "r": [["Дриада", "PS-0115.html"]]}, {"t": "Иерархия", "a": ["S05", "GR-0031-S05", "GR-0031--ierarhiya"], "h": "<p>Единственное иерархическое утверждение: защитник — «сильнейший человек на острове», а помимо него есть «другие мета-люди» (2024-07-04, id 196706). Тут же уточняется, что защитник не привязан к одному острову: «Он не один остров защищает» (2024-07-04, id 196709).</p>\n<p>Никакой структуры внутри самих мета-людей — старшинства, рангов, подчинения, организации — в переписке нет.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S06", "GR-0031-S06", "GR-0031--otnosheniya-s-drugimi-gruppami"], "h": "<p>Мета-человек-утилизатор возникает как звено мусорной схемы островов: грязь и пыль собираются в одном месте и вывозятся (2024-07-04, id 197044), а мета-человек избавляется от собранного. Кто именно возит и на каких условиях, осталось нерешённым: Слава спрашивает «Кто будет возить» и «И что взамен» (2024-07-04, id 197074–197075), Миколай переворачивает вопрос — «а кому», «взамен», «у кого выгода от того что они возят всякую дичь», «к ней», «мусор в том числе» (2024-07-04, id 197076–197080). Ответа в окне не дано.</p>\n<p>Связка с Дриадой сформулирована как обмен: «Типо дриада растения за чистоту» (2024-07-04, id 197073).</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S07", "GR-0031-S07", "GR-0031--kak-menyalas"], "h": "<p>Вся работа над классом уместилась в один вечер, 2024-07-04 (окно w0043).</p>\n<p><strong>2024-07-04, 20:27–20:28 (id 196705–196714).</strong> Введение термина. Отвечая на вопрос Миколая о том, как защитники защищают целые острова, Слава вводит мета-людей: защитник — сильнейший человек на острове, но есть и другие мета-люди, то есть люди с энергией, со способностью. Название сразу помечено как пробное: «Ну пусть будут пока мета».</p>\n<p><strong>2024-07-04, 21:50 (id 197044–197053).</strong> Класс впервые используется как инструмент. Из мусорной проблемы вырастает первая формулировка: раз мета-людей много, среди них может быть тот, кто перерабатывает мусор «или на крайняк сжигать бесследно».</p>\n<p><strong>2024-07-04, 21:52–21:54 (id 197054–197064).</strong> Вариант «на каждом острове особенный»: один и тот же тип мета-человека реализован по-разному на разных островах — пустое измерение, сжигание дотла, переработка во что-то полезное, уменьшение количества.</p>\n<p><strong>2024-07-04, 21:54–21:56 (id 197062–197080).</strong> Вариант с распределением по островам отклонён в пользу единственного носителя, закреплённого за Дриадой: «И он будет только у нее», «только один». Миколай уступает, оговорив собственное намерение: «ну вообще я хотел для современных, ну пускай» (id 197070). Следом ставится вопрос о перевозчиках и о том, что они получают взамен, — без ответа.</p>\n<h3>Отклонённые варианты</h3>\n<ul>\n<li><strong>Мета-человек-утилизатор по одному на каждый остров, со своим способом у каждого</strong> (предложен Миколаем, id 197058–197064) — заменён на единственного носителя у Дриады (id 197069, 197072).</li>\n<li><strong>Мета-человек-утилизатор для «современных»</strong> (намерение Миколая, id 197070) — не реализовано, носитель отдан Дриаде.</li>\n<li><strong>Простой вывоз мусора без мета-человека</strong> (первая схема Славы, id 197044) — не отменён, но признан упирающимся в вопросы «сколько раз им придется их возить» и «куда», из-за чего и понадобился мета-человек.</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S08", "GR-0031-S08", "GR-0031--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет: ни один мета-человек в переписке не назван по имени, единственный обозначенный носитель фигурирует как «мета челик».</li>\n<li>Численность не названа — только «мета людей же дохуя».</li>\n<li>Не сказано, входит ли защитник в класс мета-людей или противопоставлен ему.</li>\n<li>Не сказано, откуда берётся энергия или способность у мета-людей и как человек становится мета.</li>\n<li>Иерархии, организации, общего названия для самих носителей внутри мира в переписке нет; «мета» — рабочее слово авторов, заявленное как временное, и замены ему не найдено.</li>\n<li>Из четырёх способов утилизации мусора неизвестно, какой достался единственному оставшемуся носителю; остальные три способа после отказа от варианта «на каждом острове особенный» никуда не переназначены.</li>\n<li>Способов утилизации перечислено четыре при семи островах — остальные не названы.</li>\n<li>Осталось нерешённым, кто возит мусор к Дриаде и что получает взамен.</li>\n<li>Не разобрано, Дриада тут остров или персонаж-защитница острова (отмечено в <a href=\"PS-0115.html\">Дриада</a>).</li>\n</ul></div>", "r": [["Дриада", "PS-0115.html"]]}, {"t": "Связи — всё вместе", "a": ["GR-0031--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0115.html\">Дриада</a></li>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0084.html\">Мета-человек, утилизирующий мусор</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0031--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0031.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0031-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0031/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — мусорная линия: <code>ID-0081</code> («Межостровная корпорация по вывозу мусора») и <code>ID-0085</code> («Конфликт из-за вывоза мусора»). У обеих статей нет, в базе по 3 КБ, ссылаются на каждую по две записи — вселенная <code>VS-0001</code> и группа <code>GR-0036</code>. Это ровно та точка, на которой обрывается здешний раздел про отношения: кто возит мусор к Дриаде и что получает взамен. Пока эти две не написаны, вопрос висит одновременно в трёх статьях, и каждая пересказывает его заново.</p>\n<p>Второе — <code>SL-0020</code>, «Сравнение силы защитников»: статьи нет, 4,8 КБ базы, две ссылки. Через неё закрывается главный вопрос определения — входит защитник в класс мета-людей или стоит рядом с ним. Сейчас он поставлен здесь, в <code>GR-0030</code> и в <code>MR-0029</code> и нигде не решён.</p>\n<p>Третье, тише, но важно для этой статьи: <code>PS-0115</code> («Дриада») — узел, на котором держится единственный носитель класса, а базы под ней 2,3 КБ, и в самой её статье не решено, Дриада это остров или персонаж. Класс из «дохуя» людей упирается в одну запись весом в две страницы.</p>\n<h3>С чего начать</h3>\n<p>В архив идти почти не надо — материал в базе, просто разъехался.</p>\n<p>Ответ на «Кто будет возить» и «И что взамен» лежит буквально в следующих сообщениях того же вечера, за границей цитируемого здесь окна: id 197088 «ну там будет корпорация» и 197092 «межостровная». Статья доводит разговор до 197080 и останавливается. Записан этот кусок в <code>ID-0081</code> (окно w0043, сообщения 197074–197094) и в <code>GR-0036</code>.</p>\n<p>Про «четыре способа при семи островах» — смотреть <code>ID-0085</code>: там окно w0044, сообщения 197117–197136, и там же формула «у каждого острова свой способ», которая с отклонённым здесь вариантом Миколая прямо спорит.</p>\n<p>Остальное по классу: <code>MR-0029</code> («Мета-люди», 4,8 КБ), <code>MR-0030</code> («Утилизация мусора на островах», 5,5 КБ), <code>SP-0084</code> (5,9 КБ). Три записи об одном вечере, входящие ссылки разложены по ним, а не сюда.</p>\n<p>В архив — только за одним: проверить, всплывает ли слово «мета» после 2024-07-04 хоть раз. Сейчас все окна класса — один вечер, w0043, и если замена временному названию где-то и появилась, то за его пределами.</p>\n<h3>Как развивалось</h3>\n<p>Весь класс уместился в один вечер, 2024-07-04. 20:27 — заявили и тут же ограничили сами себя: «Ну пусть будут пока мета», название помечено временным в момент введения. 21:50 — впервые применили как инструмент: мусор некуда девать, значит среди мета-людей найдётся тот, кто его перерабатывает. 21:52 — расширили: на каждом острове свой утилизатор, четыре разных способа. 21:54 — сузили обратно до одного носителя у Дриады, «только один». 21:56 — уперлись в перевозчиков и остановились. Не возвращались ни разу: единственное окно w0043, других дат у класса нет.</p>\n<p>Расширение и сужение здесь разделяют две минуты.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Правило единственности проговорено прямо и для мета-человека-утилизатора («И он будет только у нее», «только один»), и для защитника — с обратным знаком: он к одному острову не привязан, «Он не один остров защищает».</p>\n<p>А для класса в целом такого правила нет. Класс заведён именно как резерв, из которого достают носителя под возникшую задачу — «мета людей же дохуя, может есть те, кто может…». Значит вопрос «сколько носителей одной механики допускается» будет вставать каждый раз, когда из резерва достанут следующего. Для первого случая он решён частным образом, в споре, и решение объявлено исключением («ну вообще я хотел для современных, ну пускай»). Общего правила на второй такой случай в переписке нет.</p>\n<h3>Отклик</h3>\n<p>Сильнее всего тут сам приём, а не содержание: класс заведён не как население мира, а как выдвижной ящик. Возник бытовой вопрос — куда девать мусор с островов — и ответом стал не механизм, а человек, вынутый из класса под задачу. Мир, в котором любая нерешённая логистика превращается в чьё-то умение. И жалко четырёх способов: пустое измерение, сжигание дотла, переработка в полезное, уменьшение количества — четыре острова с разными характерами угадывались за одной строкой, и через две минуты всё это свернулось в одного человека, приписанного к Дриаде, а способ ему так и не назначили. Ещё цепляет честность заявки: «Где то услышал», «Ну пусть будут пока мета». Слово взято на пробу, проба длится полтора года.</p></div>", "r": []}];</script>
