<script>const BASE="";const DOCNAME="Древние левиафаны";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0154-S01", "MR-0154--ustroystvo"], "h": "<p>В «в какой-то период» (датировка внутри мира не уточняется) умер древнейший левиафан. Подводные насекомые, существовавшие на тот момент, начали его жрать — «вот так могли и произойти насекомые». Это была первая версия объяснения происхождения силы насекомых.</p>\n<p>Сразу же, в том же сообщении, Слава поправляет сам себя: «будет лучше если будет несколько левиафанов который сдохла, чтобы обозначать уникальность каждого насекомого» — то есть вариант с одним левиафаном заменяется на вариант с несколькими погибшими левиафанами, каждый из которых стал источником силы для отдельного вида/особи насекомых.</p>\n<p>Других деталей об устройстве этого мира (где именно жили левиафаны, как долго они существовали, что они собой представляли до гибели) в переписке нет.</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0154-S02", "MR-0154--naselenie"], "h": "<p>Названные обитатели — сами древнейшие левиафаны (несколько особей) и подводные насекомые того времени, которые их поедали. Иных жителей этого мира в переписке не упомянуто.</p>", "r": []}, {"t": "Место во вселенной — как связан с другими мирами", "a": ["S03", "MR-0154-S03", "MR-0154--mesto-vo-vselennoy"], "h": "<p>Материал относится к вселенной без собственного названия, объявленной репликой «Разрушаем вселенную» (2025-09-17, id 366030) — имени в переписке ей не дали.</p>\n<p>Гибель левиафанов и поедание их насекомыми названо прямым источником силы насекомых (связь зафиксирована в самой переписке — «Объяснение, откуда у насекомых сила»). Других связей с другими мирами или сущностями вселенной не названо.</p>\n<p>Сразу после реплики про левиафанов, в том же окне, Слава переходит к отдельной теме — способности расы апостолов («сверх зрения или типа всё видящая ока я больше не хочу»). Прямой связи между этой репликой и левиафанами в переписке не проведено, это соседняя, но отдельная мысль в рамках одного захода 2025-09-17.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0154-S04", "MR-0154--kak-menyalsya-po-versiyam"], "h": "<h3>Версия 1 — 2025-09-17 (id 366108–366109, окно w0105)</h3>\n<p>Единственный зафиксированный заход. Внутри одного сообщения — две последовательные формулировки:</p>\n<ol>\n<li>один древнейший левиафан умер, подводные насекомые его сожрали — так «могли произойти насекомые»;</li>\n<li>тут же уточнение: лучше несколько левиафанов, чтобы объяснить уникальность каждого насекомого.</li>\n</ol>\n<p>Второй вариант — финальный на момент переписки, первый не отменён явно, но заменён следующим же предложением.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0154-S05", "MR-0154--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Не сказано, кто такие левиафаны сами по себе — облик, размер, происхождение, где обитали.</li>\n<li>Не названо, сколько именно левиафанов погибло и как это число соотносится с числом видов насекомых.</li>\n<li>Не уточнено, когда именно («в какой-то период») это произошло относительно других событий вселенной.</li>\n<li>Связь с апостолами и их способностью, упомянутыми в том же сообщении, в переписке не установлена.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["MR-0154--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-09-17</td>\n<td>366108–366109</td>\n<td>w0105</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0154-drevnie-leviafany.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0154--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0154.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
