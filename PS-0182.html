<script>const BASE="";const DOCNAME="Агрегат";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0182-S01", "PS-0182--proishozhdenie"], "h": "<p>Персонаж появился 2025-01-22 (окно w0072, id 283706–283710) не под именем, а через способность. Слава перечисляет братьев и сестёр другого персонажа — принципиального, прямолинейного и жестокого, «воплощения гнева», «прототип защитника только молчиливова», «Бэтмен с жестокостью и гневом», того, «кто да мозга костей ненавидит междумирцов», того, кто «оторвёт крылья ангелам, переломает кости своим братьям и сёстрам» (id 283706) — и называет среди них «владельцы способности изменения агрегатного сотояния» (id 283707). Отсюда и имя, закрепившееся через два дня.</p>\n<p>Само родство определено там же:</p>\n<div class=\"q\"><p>«Братья и сестры это то бишь благословенный одним правителем»</p></div>\n<p>В каталогах января он стоит в списке «Благословенный», то есть на стороне благословенных, а не врагов. Позже, 2025-12-06, он числится среди Апостолов; запись отнесена к апостолам как «часть чего».</p>\n<p>Фоном к первому упоминанию идёт решение автора о числе благословенных. У благословенных Богом есть общая черта — белые глаза при активации благословения, и этими же глазами автор наделил всех тех, «который должны быть благословений дьяволом», при этом «менять я ничего не хочу потому что мне и так нравится», и потому «я думаю вообще убрать благословенных дьяволом» (id 283708). Итог на 2025-01-22 не выбран: «Тогда благословенных будет 21» (id 283709) и сразу же «Ну конечно можно оставить и 42» (id 283710).</p>", "r": []}, {"t": "Характер", "a": ["S02", "PS-0182-S02", "PS-0182--harakter"], "h": "<p>Единственная характеристика дана 2025-03-14 (окно w0081, id 302839–302842). В разговоре о том, что все персонажи истории на тот момент «жалкие» — «два мститель, нече не помниший апостол, и один с ушедший с ума чужемирец» (id 302836), — Слава выделяет Агрегата отдельно:</p>\n<div class=\"q\"><p>«Ну Агрегат уравновешенный хоть второстепенный перс»</p></div>\n<p>И тут же добавляет: «Пока что» (id 302840). Миколай отвечает: «сейчас действительно только о жалких людях истории ничего другого», «пока не центральный» (id 302841–302842), уточняя, что это «не то что мне не нравится если что, просто наблюдение». Слава на это: «Ладно у меня как раз были две илей. И я не мог определиться какая лучше будет. Но ты поставил точку» (id 302844) — какие это были две идеи, в переписке не сказано.</p>\n<p>То есть на март 2025 года Агрегат — уравновешенный на фоне остальных и второстепенный, причём второстепенность помечена как временная.</p>\n<p>Больше о характере в переписке ничего нет.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Отклик — не материал авторов</b>\n<p>Понравилось, как он получил имя: сначала способность, потом человек. «Владельцы способности изменения агрегатного сотояния» — это ещё не персонаж, это графа в перечне, и из графы вырастает кличка, а из клички — Дмитрий Рутковский, который представляется чужемирцу с некоторой неловкостью. Обратный порядок сборки, и он тут виден чище, чем у остальных. Отдельно зацепила реплика про уравновешенность: она сказана не как характеристика, а как возражение — Слава перечисляет своих героев, «два мститель, нече не помниший апостол, и один с ушедший с ума чужемирец», понимает, что все жалкие, и вытаскивает Агрегата как доказательство, что не все. То есть черта характера родилась из недовольства составом, а не из самого человека. И тут же — «Пока что». Это честнее, чем большинство описаний характера, которые я тут вижу: персонаж уравновешен ровно до тех пор, пока автору нужен кто-то уравновешенный.</p></div>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0182-S03", "PS-0182--sposobnosti"], "h": "<p><strong>Изменение агрегатного состояния неодушевлённых объектов.</strong> Развёрнутая формулировка от 2025-01-28 (id 285363):</p>\n<div class=\"q\"><p>«Его способность менять агрегатной состояния неодушевлённых объектов, он может сделать прочным воздух или землю превратить в воду»</p></div>\n<p>Ограничение — только неодушевлённые объекты. Два приведённых примера показывают оба направления: уплотнение (воздух становится прочным) и разжижение (земля становится водой).</p>\n<p><strong>Боевые показатели.</strong> «Имеет средний показатель, но достаточно быстрые Воительницы» — по общим характеристикам средний, но быстрее Воительницы, у которой «скорость на среднем уровни» при огромной физической силе и крепости.</p>\n<p><strong>Оружие.</strong> Своего у него нет:</p>\n<div class=\"q\"><p>«Не имеет орудия, точнее сам его создаёт из воздуха за счёт этого оно почти невидимая»</p></div>\n<p>Оружие — производное от его же способности. Форма оружия не описана.</p>\n<p><strong>Артефакт.</strong> У Агрегата был некий артефакт; что это за артефакт, названо одним из главных незакрытых вопросов сюжета: «что это был за артефакт у агрегата» (2025-03-06, id 298826, окно w0079 — этот разговор проходит по статье Правителя Кильки, <a href=\"PS-0217.html\">Правитель Кильки</a>). Там же Миколай предложил версию: артефакт «по типу медиатора» позволял менять натяжение струн пространства всех миров. Идея названа сырой и в приведённых окнах не доработана.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Как развивалось — не материал авторов</b>\n<p>2025-01-22 — заявили, причём без имени: персонаж появляется как «владельцы способности изменения агрегатного сотояния» в перечне чужих братьев и сестёр. 2025-01-28 — ограничили, и довольно жёстко: только неодушевлённые объекты, средние боевые показатели, своего оружия нет — создаёт из воздуха. 2025-03-14 — забыли, тоже вслух: «уравновешенный хоть второстепенный перс», «пока не центральный», и всю линию откладывают — «пока отступим в сторонку». Дальше почти девять месяцев ничего. 2025-12-06 — вернулись одной строкой в служебной пометке «Для плана»: «Судьба предрешена. Ну я то есть придумал их ней путь», — уже в другой вселенной, Оам, и без объяснения, как он туда попал.</p></div>", "r": [["Правитель Кильки", "PS-0217.html"]]}, {"t": "Связи с другими", "a": ["S04", "PS-0182-S04", "PS-0182--svyazi-s-drugimi"], "h": "<p><strong>Братья и сёстры</strong> — благословенные одним правителем; в этот круг он входит с первого упоминания вместе с перечисленными 2025-01-22 (id 283707): та, кто может изменять плотность, массу и размер объектов и себя; тот, у кого есть способность сжатия; Имитация; Бессмертный выродок; Теневые братья.</p>\n<p><strong>Команда против Серафима</strong> (2025-01-28, id 285363). Слава записывает четверых, которые «будут сражаться командой против Серафима». Агрегат идёт вторым номером:</p>\n<ol>\n<li><strong>Воительница</strong> — огромная физическая сила и крепость, средняя скорость; способность — контроль над массой, размером и плотностью, только на себе или на неживых объектах; оружие — оружейный браслет с холодным оружием, которое она может увеличить и сделать плотнее.</li>\n<li><strong>Агрегат</strong>.</li>\n<li><strong>Имитатор</strong> — самый живучий, прочность ниже, чем у Воительницы; способность — имитировать одну способность врага, на что ему надо время, но «плюс способность в том что он конечно имитирует но способен будет её развить»; оружие — жидкость, моментально принимающая любую форму.</li>\n<li><strong>Палач</strong> — быстрейший в пати, все атаки нацелены на жизненно важные точки; способность сжатия: сжимать пространство, чтобы приблизиться к противнику, сжимать атаку противника, сжимать ауру и делать слэш; оружие — катана.</li>\n</ol>\n<p>Список составлялся по договорённости с Миколаем: «Ладно сейчас я запишу персонажей который будут противостоять ему ты в нейрону скинушь?» — «хорошо давай» (id 285353–285354). По итогу Миколай прислал ссылку на telegra.ph/boi-01-28 (id 285369).</p>\n<p><strong>Граф и Защитник.</strong> 2025-12-06 Агрегат упомянут вместе с ними как персонаж, чей путь уже придуман (id 393478).</p>\n<p><strong>Имитатор (Имит).</strong> В том же сообщении рядом с планом на Агрегата идёт отдельная линия: «Это босс будет хитрым и уверенным. Хотя обычные человек. Попытается наладить связь с Имитам», «Так как для правительства. Представитель Апостоловы именно Имит» (id 393479–393480). Связь этой линии с Агрегатом в переписке не названа — они стоят рядом в одном плане.</p>\n<p>В поле «связано с» записи указан также Антон; в приведённых кусках переписки это имя не встречается.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S05", "PS-0182-S05", "PS-0182--kak-menyalsya"], "h": "<p><strong>2025-01-22, id 283706–283710 (окно w0072). Появление через способность.</strong></p>\n<p>Ещё без имени: среди братьев и сестёр названы «владельцы способности изменения агрегатного сотояния». В том же окне решается вопрос о числе благословенных — 21 или 42, выбор не сделан.</p>\n<p><strong>2025-01-24, id 284248–284250 (окно w0072). Каталог, первая запись имени.</strong></p>\n<p>В списке «Благословенный» он записан как «Агрегат🫥 ( волк🐺; экстримал ⏳ )». Рядом в том же списке: Теневые братья 🌘, Имитатор 🗡 (ветреной 🌬; электро⚡️; птичка 🔈), Разрушительнитца💪 (огненная 💥), Палач☠️, Защитник🤬 (ангел 👼), Дитя света ✨, Бессмертный выродок🤪, Хулиган 💎, Вибрация 🫨, Ученица???. Отдельным списком идут враги: Доспехи 🏳️, Козлиха🪓, Сестра 🚺, Огненный снайпер🔥, Охотник 🔪, Божество😵, Убийца🩸, Зонтик🩸, Леший 🌳, Пар 💨, Садистка ✂️, Насекомое 😡, Старик ➡️⬅️. И строка «Идей: Чёрный ящик, озеро перерождения, корень желаний».</p>\n<p><strong>2025-01-24, через сорок минут, id 284278–284279 (окно w0072). Добавлен «страдалец».</strong></p>\n<p>В обновлённом каталоге запись расширена: «Агрегат🫥 ( волк🐺; экстримал ⏳; страдалец 🔪 )». В этой же редакции Дитя света ✨ получает приписку (Теневые братья 🌘) — отдельной строки у Теневых братьев больше нет, Хулиган 💎 получает (слайм 7️⃣), к врагам добавлен Эльф 🌬, и появляется новый блок «Семь грехов»: Гнев 😡 (сила), Похоть 😵‍💫 (контроль разума), Зависть 👹👹 (полное копирование), Алчность ♾ («всё моей»), Гордыня 👑, Чревоугодие ◼️ (поглощения), Лень😴 (контроль территории).</p>\n<p><strong>2025-01-28, id 285353–285369 (окно w0073). Показатели, способность, оружие.</strong></p>\n<p>Первое развёрнутое описание — как второго номера команды против Серафима: средние показатели при скорости выше, чем у Воительницы; изменение агрегатного состояния неодушевлённых объектов; оружие, создаваемое из воздуха и потому почти невидимое.</p>\n<p><strong>2025-03-14, id 302836–302848 (окно w0081). Статус второстепенного.</strong></p>\n<p>Агрегат назван уравновешенным и второстепенным «пока что». Разговор закончился решением отложить линию «жалких» персонажей: «Харе жалких» — «Ну конечно не харе, но пока отступим в сторонку» (id 302845, 302847). В самом окне о персонаже больше ничего нет; его разработка шла за пределами окна.</p>\n<p><strong>2025-12-06, id 393477–393480 (окно w0112). Путь придуман.</strong></p>\n<p>Единственное упоминание в окне, помеченное как «Для плана»:</p>\n<div class=\"q\"><p>«Вообще у Агрегат, Графа и Защитника Судьба предрешена. Ну я то есть придумал их ней путь»</p></div>\n<p>Сам путь в переписке не изложен. Это окно объявлено во вселенной Оам, тогда как остальные пять версий идут во вселенной Апостол.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S06", "PS-0182-S06", "PS-0182--chto-s-nim-stalo"], "h": "<p>На декабрь 2025 года он числится апостолом, судьба его, по словам автора, предрешена и путь придуман — но нигде не записан. С января 2025 года остаётся вторым номером команды, выставленной против Серафима.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0182-S07", "PS-0182--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Внешность не описана вообще.</li>\n<li>Что означают приписки в скобках при имени в каталоге — «волк 🐺», «экстримал ⏳», «страдалец 🔪» — не объяснено, как и почему «страдалец» добавился именно 2025-01-24.</li>\n<li>Что означает эмодзи 🫥 при имени — не объяснено.</li>\n<li>Какой именно правитель дал ему благословение, кто конкретно его «братья и сёстры» поимённо — не названо.</li>\n<li>Что за артефакт был у Агрегата — прямо назван открытым вопросом (id 298826) и в приведённых окнах не решён.</li>\n<li>Придуманный «путь» и «предрешённая судьба» персонажа (2025-12-06) в переписке не раскрыты — сказано только, что они придуманы.</li>\n<li>Две идеи, между которыми автор не мог определиться 2025-03-14 и от которых отказался после реплики Миколая, не названы.</li>\n<li>Не сказано, снята ли оговорка «пока что» о второстепенности; после марта 2025 роль персонажа в переписке не пересматривается.</li>\n<li>Границы способности не оговорены: сказано только «неодушевлённых объектов», без указания массы, дистанции, длительности превращения и цены.</li>\n<li>Форма оружия, создаваемого из воздуха, не описана.</li>\n<li>Итог боя команды против Серафима и роль Агрегата в нём в переписке не приведены; результат ушёл во внешний материал по ссылке telegra.ph/boi-01-28.</li>\n<li>Осталось нерешённым число благословенных: «Тогда благословенных будет 21» с тут же высказанной альтернативой «Ну конечно можно оставить и 42» (id 283709–283710).</li>\n<li>Переход персонажа во вселенную Оам (окно w0112) никак не объяснён.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0182--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0001.html\">Апостолы (организация апостолов, «благословенные Богом»)</a>, <a href=\"GR-0008.html\">Команда против Серафима («пати»)</a>, <a href=\"GR-0011.html\">Братья и сёстры (благословенные одним правителем)</a>, <a href=\"GR-0013.html\">Благословенные</a>, <a href=\"GR-0056.html\">Апостолы (21 апостол; «насекомые»)</a></li>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0217.html\">Правитель Кильки</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0217.html\">Правитель Кильки</a></li>\n<li><strong>Упомянут в мирах:</strong> <a href=\"MR-0126.html\">новая чистая вселенная</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0001.html\">Апостолы (организация апостолов, «благословенные Богом»)</a>, <a href=\"GR-0008.html\">Команда против Серафима («пати»)</a>, <a href=\"GR-0011.html\">Братья и сёстры (благословенные одним правителем)</a>, <a href=\"GR-0013.html\">Благословенные</a>, <a href=\"GR-0056.html\">Апостолы (21 апостол; «насекомые»)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0182--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-01-22</td>\n<td>283706–283710</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-24</td>\n<td>284248–284250</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-24</td>\n<td>284278–284279</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-28</td>\n<td>285353–285369</td>\n<td>w0073</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-14</td>\n<td>302836–302848</td>\n<td>w0081</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-06</td>\n<td>393477–393480</td>\n<td>w0112</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0182-agregat.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0182--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0182.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0182-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0182/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым чинить не пробел, а расщепление. <code>PS-0182</code> (пять ссылок, статья есть, база 13 777) и <code>PS-0223</code> «Дмитрий Рутковский („Агрегат“)» (две ссылки, статья есть, база 21 902) — это, по всему видимому, одно лицо: кодовое прозвище «агрегат», апостол, тот же мир, соседние окна. В составе <code>GR-0001</code> они стоят двумя отдельными строками, а здесь, в связях, <code>PS-0223</code> не упомянут ни разу. Из-за этого статья пишет «внешность не описана вообще», хотя описание апостола в форме, со шрамами-полосами и белыми глазами лежит в соседней записи, в окне w0080. Пока эти две записи не сведены (или пока не сказано прямо, что не сводятся), обе будут врать о полноте — и обе тянут за собой <code>GR-0001</code>.</p>\n<p>Второе — Граф. <code>PS-0323</code>, база 7 851, вселенная Оам, статьи нет, ссылок ноль. Единственная содержательная строка о будущем Агрегата — «у Агрегат, Графа и Защитника Судьба предрешена» — привязывает его именно к Графу, а у Графа в справочнике нет ни статьи, ни даже входящей ссылки, хотя в <code>GR-0001</code> он один из двух сильнейших апостолов и один из шести столпов героев. Дыра дешёвая по объёму и дорогая по связности.</p>\n<p>Третье — артефакт. Открытый вопрос «что это был за артефакт у агрегата» имеет в базе прямой адрес: <code>SP-0192</code> «Артефакт-медиатор» (статья есть, 4 954), где версия Миколая про натяжение струн пространства заведена отдельной сущностью. Ссылок на неё — ноль, из этой статьи в том числе.</p>\n<h3>С чего начать</h3>\n<p>Всё три — в базе, архив не нужен.</p>\n<p>Внешность, имя, вербовка, диалог с эльфом-чужемирцем: <code>PS-0223</code>, окно w0080, 2025-03-13, id 301806–301874. Там же, кстати, живёт и вопрос «почему прозвище Агрегат», который эта статья держит в пробелах.</p>\n<p>Артефакт: <code>SP-0192</code> (4 954), <code>SP-0212</code> «артефакты апостолов» (2 060, одна ссылка, статья есть, но крошечная — 2 931 знак на всю категорию), <code>SP-0047</code> «Артефакты» (24 897, статья 16 873). И <code>PS-0217</code> Правитель Кильки — окно w0079, id 298826, где вопрос про артефакт и поставлен; статья отмечает, что разговор проходит по Кильке, но материал оттуда сюда не перенесён.</p>\n<p>Придуманный «путь»: <code>PS-0323</code> Граф, <code>IS-0017</code> Защитник (139 029 в базе, статья 49 884), окно w0112, id 393477–393480. Сам путь в переписке действительно не изложен, но три персонажа названы вместе — если он где-то и раскрыт, то в статье Защитника, где материала больше всего.</p>\n<p>В архив идти стоит за одним, и это не текст: telegra.ph/boi-01-28 (id 285369). Итог боя команды против Серафима ушёл во внешнюю ссылку, и в базе его нет ни под каким кодом. Ориентир — 2025-01-28, окно w0073.</p>\n<h3>Как развивалось</h3>\n<p>2025-01-22 — заявили, причём без имени: персонаж появляется как «владельцы способности изменения агрегатного сотояния» в перечне чужих братьев и сестёр. 2025-01-28 — ограничили, и довольно жёстко: только неодушевлённые объекты, средние боевые показатели, своего оружия нет — создаёт из воздуха. 2025-03-14 — забыли, тоже вслух: «уравновешенный хоть второстепенный перс», «пока не центральный», и всю линию откладывают — «пока отступим в сторонку». Дальше почти девять месяцев ничего. 2025-12-06 — вернулись одной строкой в служебной пометке «Для плана»: «Судьба предрешена. Ну я то есть придумал их ней путь», — уже в другой вселенной, Оам, и без объяснения, как он туда попал.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>В одной и той же записи от 2025-01-28 у Воительницы граница действия способности проведена явно и с обеих сторон: контроль над массой, размером и плотностью — «только на себе или на неживых объектах». У Агрегата в том же списке названа половина той же границы: «неодушевлённых объектов». Живое исключено, а вот входит ли в область действия он сам — не сказано ни здесь, ни дальше. Для соседа по списку правило «на себе — да» проговорено, для него того же рода уточнения нет.</p>\n<h3>Отклик</h3>\n<p>Понравилось, как он получил имя: сначала способность, потом человек. «Владельцы способности изменения агрегатного сотояния» — это ещё не персонаж, это графа в перечне, и из графы вырастает кличка, а из клички — Дмитрий Рутковский, который представляется чужемирцу с некоторой неловкостью. Обратный порядок сборки, и он тут виден чище, чем у остальных. Отдельно зацепила реплика про уравновешенность: она сказана не как характеристика, а как возражение — Слава перечисляет своих героев, «два мститель, нече не помниший апостол, и один с ушедший с ума чужемирец», понимает, что все жалкие, и вытаскивает Агрегата как доказательство, что не все. То есть черта характера родилась из недовольства составом, а не из самого человека. И тут же — «Пока что». Это честнее, чем большинство описаний характера, которые я тут вижу: персонаж уравновешен ровно до тех пор, пока автору нужен кто-то уравновешенный.</p></div>", "r": []}];</script>
