<script>const BASE="";const DOCNAME="Эффект адаптации";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0245-S01", "SP-0245--mehanika"], "h": "<p>Механика в переписке не описана. Способность существует пока как требование, выставленное к апостолам, а не как проработанное правило.</p>\n<p>Требование сформулировано так: «Просто если у них развита только мозг и нервная связь. Они не смогут в моей голове сражаться полноценная. ( эффект адаптации повышенный у них должен быть)» (2025-10-22, id 377617). То есть повышенная адаптация вводится как компенсация: мутация у апостолов затронула только мозг и нервную связь, а без чего-то ещё они не смогут полноценно сражаться.</p>\n<p>Оговорка «в моей голове» вызвала переспрос Миколая: «че значит в своей голове сражаться» (id 377645). Ответ: «В моей» (id 377646) — речь про голову автора, про его представление, а не про бой, происходящий внутри чьей-то головы.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S02", "SP-0245-S02", "SP-0245--nositeli"], "h": "<p>Апостолы. В том же окне заявлено: «Кстати вернём старых апостолов. Они насекомые произошли от неизвестного мутировшого существа» (2025-10-22, id 377616).</p>\n<p>Слово «насекомые» — не описание облика: «Насекомые это апостолы который выглядит как люди. (Насекомые я назвал их по приколу)» (2025-10-22, id 377643).</p>\n<p>Происхождение самой мутации: «Так вот это существо мутировал из-за воздействием Оам» (id 377633), и шире — «Все монстры это мутированный под воздействием Оам» (id 377634).</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S03", "SP-0245-S03", "SP-0245--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-10-22, id 377616–377619.</strong> Возврат старых апостолов, их происхождение от неизвестного мутировавшего существа, и требование повышенного эффекта адаптации как следствие того, что развиты только мозг и нервная связь. Миколай тут же остановил: «так стой», «не совсем понимаю» (id 377618–377619).</p>\n<p><strong>Версия 2 — 2025-10-22, id 377632–377647.</strong> Тот же вечер, разбор непонятого. Уточнено, что мутация существа вызвана воздействием Оам и что все монстры — мутировавшие под воздействием Оам; что «насекомые» — прозвище, а не облик; что «в моей голове» относится к автору. Само содержание эффекта адаптации при этом не расширено.</p>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S04", "SP-0245-S04", "SP-0245--otklonennye-varianty"], "h": "<p>Миколай предложил вариант происхождения апостолов: «это существо умерло» (id 377640) и «и 21 насекомые съели его труп» (id 377642). Слава отклонил сразу: «Нет» (id 377641). Причина отказа не названа.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0245-S05", "SP-0245--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Способность привязана к Оам как к источнику мутаций: апостолы происходят от существа, мутировавшего под воздействием Оам, и по тому же правилу устроены все монстры.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "SP-0245-S06", "SP-0245--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Механика самой адаптации не описана (помечено по окну w0108).</li>\n<li>Не сказано, к чему именно адаптация: к повреждениям, к среде, к противнику — не названо.</li>\n<li>Не сказано, есть ли у эффекта ограничения или цена.</li>\n<li>Не сказано, чем «повышенный» эффект отличается от обычного и есть ли обычный эффект адаптации у кого-то ещё.</li>\n<li>Не сказано, у всех ли апостолов он есть или это свойство «старых апостолов», которых предложено вернуть.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0245--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0056.html\">Апостолы (21 апостол; «насекомые»)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0008.html\">Оам</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0245--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-10-22</td>\n<td>377616–377619</td>\n<td>w0108</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-10-22</td>\n<td>377632–377647</td>\n<td>w0108</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0245-effekt-adaptacii.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0245--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0245.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
