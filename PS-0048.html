<script>const BASE="";const DOCNAME="Максим";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0048-S01", "PS-0048--proishozhdenie"], "h": "<p>Максим проходит через три объявленные вселенные — «игра бога» (2024-04-03), «Апостол» (2025-03-18), «Нимб» (2025-05-04 и 2025-05-06) — и через два текста, где вселенная не объявлена («Зима», 2025-11-21; список благословенных, 2026-04-19). Всего девять версий, 2024-04-03 — 2026-04-19, окна w0029, w0082, w0090, w0091, w0110, w0120. Все версии писал Слава; Миколай выступает как собеседник, разбирающий логику персонажа. Вариант имени — «чупакабра» (так его называет рассказчик пролога от 2025-05-06).</p>\n<p>Первое появление — карточка персонажа во вселенной «игра бога» (2024-04-03, id 153366). Там только рост, роль («лидер») и способность с минусом. Ни возраста, ни биографии, ни скуки в карточке нет.</p>\n<p>Полная предыстория дана уже во вселенной «Апостол», в истории-блоге от лица самого Максима (2025-03-18, id 305113–305117). Максиму 19 лет, он живёт с родителями (в ночь боя с лучницей «родителей были в командировке»), к 19 годам он «преспективном спортсменом с красным дипломом и также преспективным музыкантом и актёром». Он пробовал себя «почти что во всех видов спорта в учебе, в музыки», и всё давалось относительно легко: «Я мог пойти куда угодно и мне везде бы с руками оторвали». Есть друг — профессиональный лучник, у которого Максим тоже пробовал стрелять; поэтому он на слух узнаёт натягивание тетивы. Сам блог он ведёт «чисто по приколу. Ну и чтобы возможно позлить Михаила».</p>\n<p>Вербовка: после убийства чёрной лучницы Максим продолжает ночные прогулки, в лесу натыкается на чёрную дымку и вступает в бой с копьещиками. Бой заканчивает не он — приходит человек в белой рубашке с белыми глазами, снимает голову одному копьещику белой цепью, взрывает второго изнутри, убивает лучницу в кустах. Он предлагает Максиму два пути: «Первый я подхожу тебя к остановки и ты едешь домой. Забыв обо всём этом и живя обычной жизнью. Второй- ты становишься агентом и сразаешься с подобными тварями, как сегодняшний. Выбор за тобой. Я не буду говорить плюс и минус». Максим отвечает: «я стану агентом». В машине этот человек упоминает, что спешит на встречу «с новым апостооом по прозвищу \"защитник\"», и уезжает, не объяснив, откуда у него номер Максима.</p>\n<p>На следующее утро звонит Михаил Саакашвили: через три дня Максима заберут в лагерь, где он должен прожить шесть месяцев «под тренировкам и впитыванием информации». Максим отучился три недели — «так как я был в идеальном физической форме и мне оставалось только дать информацию и ресурсы и всё». Куратор — Михаил с кодовым прозвищем «Медведь». В группе было десять человек: «Каждый агент может быть куратором только для 10 людей».</p>\n<p>Во вселенной «Нимб» (2025-05-04 и 2025-05-06) происхождение другое и социальное: Максим — знакомый рассказчика и Андрея, «Лучший наверное спортсмен нашего колледжа или даже города», которого Андрей позвал в поход. Причина, по которой он занялся спортом, — та же скука: «потому что ему было скучно». Сверхспособности из «Апостола» в этом варианте не упоминаются.</p>\n<p>В версии от 2026-04-19 (id 462205) Максим включён в список благословенных под номером семь. Благословенные — «люди, что способны чувствовать присутствия когото. Кого именно неизвестно, может бог, может ещё какое-то существо».</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0048-S02", "PS-0048--vneshnost"], "h": "<p>Прямых описаний почти нет.</p>\n<p>Карточка 2024-04-03 (id 153366): «Высокого роста, лидер».</p>\n<p>В остальных текстах внешность не описана — ни в блоге от 2025-03-18 (Максим там рассказчик и себя не описывает), ни в прологах походов, ни в «Зиме», где он вообще не появляется в кадре. В версии от 2025-05-06 рассказчик называет его «чупакабра шустрая, быстрая и ловкая», но это характеристика темпа, а не облика.</p>\n<p>Из блога известны только полученные раны: стрела «царапнут» лоб «И очень глубоко», в лесу лоб задет вторично, задето плечо.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0048-S03", "PS-0048--harakter"], "h": "<p>Сквозная черта во всех версиях, кроме карточки, — скука.</p>\n<p>В блоге (2025-03-18, id 305113): «Но вот мне стала скучна». Максим объясняет её собственной безграничностью: «Простите это проблема всех гениях. Скука. Я зная, что я безграничный. И такому безграничному мне, нужно было двигаться вперед и встречаться с препятствиями. Но нет их. Этих препятствий. И поэтому мне скучно». Он ходит по неблагополучному району на окраине города, где много заброшенных домов, и признаётся: «Ладно подловили. Я не гулял, а искал с тем кем мог подраться». Ко второй неделе таких прогулок драться уже не с кем — «Никого нет. Они все испугались».</p>\n<p>Отношение к бою — как к задаче и развлечению. Увидев, что придётся пробиваться в дом, он думает: «Интересная игра. В которой мне надо преодолеть дистанцию между тем где я стою и домом. А после пробраться на второй этаж и схватить врага. При этом уклоняясь от стрел. Интригует». Двойной выстрел лучницы он переживает как решённую задачку: «И словно получил второй дыхания от возбуждения решённой задачки».</p>\n<p>Убийство лучницы он сам себе не объясняет: «И здесь я. Не до конца понимаю, что на меня нашло. Возможно выброс адреналина». После этого скука усилилась: «Теперь простый драки мне казались детской забавой. Я хотел боя за жизнь. Где либо тебя либо ты».</p>\n<p>Решение стать агентом принято мгновенно: «А я в голове у себя уже давно всё решил. Вся моя жизнь стремилась к этому моменту. К моменту веселья и риска. Я силён, а значит можно попробовать».</p>\n<p>Тон блога — задиристый. Часть информации Максим сознательно не выдаёт, «чтобы вас подразнить», и подписывает список недосказанного: «альфа, апостолы, благословенный, силы зверя, классификация, арбетары, аномалия, существа и так далее. Что уже не терпится да. Ну ладно адьос». О классификации способностей чужемирцев он говорит: «Ну это скука об этом говорить». Про Михаила: «даже если я его бесил. Он всё равно отметил мои навыки».</p>\n<p>В походных версиях («Нимб») характер тот же, но показан снаружи, глазами других. Спортом он занялся от скуки, и в походе ему тоже скучно, «поэтому он скакал, как заяц туда сюда». Разница между Максимом и обычным гонящим человеком в версии от 2025-05-06 сформулирована так: «Дед гонял меня зная мои пределы. А Максим гонял пытаясь найти свои пределы».</p>\n<p>Выходки прошлого похода (2025-05-04 и 2025-05-06): похитил медвежонка у медведицы, из-за чего вся группа убегала от неё по лесу; завёл группу в пещеру (в версии 2025-05-04 — «повел, а потом заблудился», в версии 2025-05-06 — «уговорил, как то нас о этом. А после мы два дня не могли оттуда выйти»); всю дорогу ловил лису, поймал и съел. Оценка Саши/рассказчика: «Живодер хренов. Но суп вышел вкусный». Дома у Максима живёт медведь — тот самый медвежонок; лису Андрей дома не видел, потому что она была съедена в лесу.</p>\n<p>Оценки со стороны других персонажей:</p>\n<ul>\n<li>Андрей (2025-05-04, id 323658): «ну так это же Максим, у него всё идеальное же выходит»;</li>\n<li>Андрей (2025-05-06, id 323934): «ну конечно. Он же Максим, совершённый во всём».</li>\n</ul>\n<p>В «Зиме» (2025-11-21) — та же склонность усложнять быт из принципа: «один особо одарённый решил, что мы будем топить печь по старинке и выкинув спички и зажигалку. Он грандиозна вручил мне огниво и кремень».</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Отклик — не материал авторов</b>\n<p>Сильнее всего не сверхчеловек, а строчка из походного пролога: «Дед гонял меня зная мои пределы. А Максим гонял пытаясь найти свои пределы». Тот же персонаж, увиденный снаружи и без единой способности, и там он понятнее, чем в блоге с тремя фактами: человек, который ставит эксперимент на других, потому что на себе всё уже проверил. Хорош и мотор фигуры — скука не как черта характера, а как техническая проблема: препятствий нет, значит их надо изготовить; отсюда и прогулки по неблагополучному району, и похищенный медвежонок, и выброшенные спички с вручённым огнивом. Тем обиднее, что версия 2026 года чинит его в обратную сторону: у безграничного, которому вдобавок невозможно умереть, скуке взяться уже неоткуда, и главный двигатель глохнет. И отдельно стоит разбор Миколая про арены — «там реально сильные люди», «че ему в неблагополучных районах делать», «где нет качалки»: возражение по существу, на которое ответили «Потому что там много быдло», и текст остался как был.</p></div>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0048-S04", "PS-0048--sposobnosti"], "h": "<p><strong>Власть (2024-04-03, id 153366, вселенная «игра бога»).</strong> «любой кто находится в 70 м должен подчиняться любому закону сказанная Максимам, минус в том что Максиму тоже надо подчиняться закону». Радиус — 70 метров, действие — подчинение любому произнесённому Максимом закону, цена — Максим сам подпадает под собственный закон. В более поздних версиях эта способность не появляется и не отменяется явно.</p>\n<p><strong>Три факта (2025-03-18, id 305113, вселенная «Апостол»).</strong> Максим представляется как «Лучший среди людей» — «И нет это не пустый слова» — и приводит три доказательства, оговаривая, что «Всего их три» и что два вытекают из первого.</p>\n<ol>\n<li>Другое восприятие времени: «Для меня все разы медленнее чем вам».</li>\n<li>Обострённые пять чувств: «Нет. Точнее будет сказать. Они у меня идеальный. Я могу слышать за километры, и видить детально и лучше чем вы».</li>\n<li>Контроль всех мышц тела: «При хотьбе я контролирую куда наступать, как дышать. Я чувствую какие мышцы напрягаются. Да я чуствовал как переносится моя же кровь в венах и артериях. Я чуствовал как бьётся моей сердце. И для меня лишь моргания эта тьма, на достаточно не малый промежуток времени. Я живу так и я к этому привык».</li>\n</ol>\n<p>Практические следствия, названные им самим: в учёбе — «Просто слушай и запоминай», и «для меня, который контролирует дажа то как он сидит. Не было напряга учиться хорошо»; в спорте он чувствует, какие мышцы работают в упражнении, и понимает, «какие тренировки бесполезный,а какие хорошие»; на длинных дистанциях он лучший за счёт контроля дыхания и выносливости, на коротких — потому что «мог сразу выдать максимум»; в музыке — идеальный слух, при этом «учить все эти ноты было та ещё скука».</p>\n<p>В бою: по звуку натянутой тетивы он определяет пол, возраст и сложение стрелка («Лёгкая, быстрая и ловкая») ещё до того, как поднял голову; определяет, куда целится противник, и уклоняется, «Даже не поднимая головы»; изгибается «в букву С» и в «английскую букву S», чтобы пропустить парные стрелы, летящие в разные точки; от выстрела в упор уходит падением назад в позу прохода под низко повешенной верёвкой; по дальности отлёта понимает, что лучница неестественно лёгкая («Это она такая лёгкая, что от моего удара отлитает»).</p>\n<p>Ограничения показаны прямо в том же тексте:</p>\n<ul>\n<li>вращение вокруг оси сбивает ориентацию: «Ведь крутится вокруг себя. Это очень плохо влияет на чувство пространства»;</li>\n<li>он уязвим: стрелы царапают плечо и дважды лоб, мощный выстрел через тело копьещика отбрасывает его — «А вот меня она ранила. И выстрел оказался мощным. Я аж отлетел»;</li>\n<li>он выдыхается: «И когда я уже начал выдыхаться»;</li>\n<li>на чёрную стрелу в темноте даже идеального зрения хватает с трудом: «разглядеть его в темноте, даже с моим идеальном зрением было сложно».</li>\n</ul>\n<p><strong>Уточнения от Миколая (2025-03-18, id 305260–305266).</strong> Разбирая «идеальную модель», Миколай отмечает: «ну тут не все к персу относится я считаю ибо он контролирует то на что может понадобиться навык и время», «регенерация например вряд ли про него». На прямой вопрос «он просто человек?» Слава отвечает: «Да».</p>\n<p><strong>Седьмой благословенный (2026-04-19, id 462205).</strong> В новой системе Максим значится седьмым.</p>\n<ul>\n<li>«Он сверхчеловек. Его восприятия ускорения. То есть для него всё люди медленный. Их голоса, машины, самолёт для него всё медленная. Сверхчеловек он потому что везде всегда выигрывает спомощью этого».</li>\n<li>Точность движений: «каждое его движения точна, ведь он просто чуствует, как каждая клетка его тела напрягается при прыжки, чусвтует как лучше напрячь мышцы, что выше прыгнуть».</li>\n<li>Канал связи с нечто — сердцебиение: «он должен идти по зову сердца, и если он идёт в то место куда видет его сердца, он по чуствует как приятно бьётся сердца и словно чём-то тёплый руки обнимают его. Если же он не следует зову сердца. То его сердца начнёт больно екать, и ему будет холодно».</li>\n<li>Смерть: «Смерти, ну невозможно, он как бы почти сверхчеловек».</li>\n</ul>\n<p><strong>Бытовое проявление.</strong> В «Зиме» рассказчик не идёт к Максиму за помощью именно потому, что уверен в его результате: «моя внутренняя гордость не позволяет пойти Максиму и сказать о своё никчёмность. Потому что я прекрасно понимаю, что он с первого раза ражет огонь».</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Самая дорогая дыра — <code>PS-0031</code> «Закон»: 15 884 знака базы, статьи нет, ноль ссылок, семь версий, 2024-03-12 — 2024-07-09, окна w0026, w0029, w0046. Статья утверждает, что способность «власть» (2024-04-03) больше нигде не появляется и нигде не отменена. В базе она появляется — раньше карточки Максима: в w0026 та же механика (произнесённый закон, радиус 70 метров, обязательное подчинение, наказание за нарушение) разбирается отдельно, Миколай предлагает ограничение по слышимости, Слава его отклоняет. То есть у первой способности Максима есть собственная история с поиском слабостей, и она лежит в записи, на которую не ссылается ни одна статья.</p></div>\n<div class=\"mnote\"><b>⚙ машинная заметка · С чего начать — не материал авторов</b>\n<ul>\n<li><code>PS-0031</code>, окна w0026 и w0029: история способности «власть» до карточки 2024-04-03 и заодно ответ, отменяли её или просто бросили.</li>\n<li><code>SP-0238</code>, окна w0105–w0107: цена той же механики, расписанная через полгода после «трёх фактов».</li>\n<li>Продолжение семёрки: <code>PS-0359</code> доходит до 2026-06-02, id 487082–487095, 487096–487107 и 487148–487169. Благословенные там переехали в новую вселенную с Ассоциацией и «шестью столпами героев», а Слава признаёт, что способности для Героя так и нет, и просит помощи. Статья Максима обрывается на 2026-04-19; следующий шаг линии лежит в базе целиком, и там же должно решиться, кто шестой.</li>\n<li>Походная линия — тоже база: <code>IS-0052</code> «Пролог про Максима» (20 147), <code>IS-0055</code> «Истории про Максима» (8 186), <code>PS-0268</code> «Рассказчик историй про Максима» (7 865), <code>SL-0088</code> «Три начатых пролога» (19 948), <code>SL-0091</code> «Хронология историй Славы» (14 910), <code>PS-0132</code> «Андрей» (21 822), <code>PS-0051</code> «Саша» (13 354). Ни у одной из семи записей нет статьи. Путаница атрибуций в прологе 2025-05-04 (id 323655–323659), где обе стороны диалога подписаны Сашей, чинится там же.</li>\n<li>Вселенные: <code>VS-0006</code> «Нимб» (21 285) и <code>VS-0014</code> «игра бога» (18 198) — статей нет, при том что Максим числится в обеих; плюс <code>MR-0132</code> «Нимб» (88 701, семь версий, окно w0087) — самый большой неразобранный кусок во всей округе.</li>\n</ul></div>\n<div class=\"mnote\"><b>⚙ машинная заметка · Как развивалось — не материал авторов</b>\n<p>2024-04-03 — заявили: карточка, рост, «лидер», способность «власть» с минусом для самого носителя. 2025-03-18 — переписали заново и ограничили: вместо магии три факта, прямой вопрос «он просто человек?» и ответ «Да», отдельно оговорено, что регенерация «вряд ли про него». В тот же день ограничили и мотивацию — Миколай разбирает, зачем такому гению драться в подворотне, — но текст после разбора не переписан. 2025-05-04 и 2025-05-06 — Максим уходит в другую линию, где способностей у него нет вовсе и виден он только со стороны. 2025-11-21 — остаётся за кадром, одна бытовая сцена. 2026-04-19 — вернулись, сняв ограничение: сверхчеловек, седьмой благословенный, «Смерти, ну невозможно». Между «просто человек» и «сверхчеловек» тринадцать месяцев и ни одной реплики, которая отменяла бы первое.</p></div>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0048-S05", "PS-0048--svyazi-s-drugimi"], "h": "<p><strong>Михаил «Медведь» Саакашвили</strong> — куратор Максима в лагере агентов. Позвонил на следующее утро после встречи в лесу и назначил срок в три дня на окончательный ответ. Описан так: «По два метра ростом, в плечах почти также. Везде мыщцы и суровым лицом богатыря. Ходил он в кожанном плаще и был суров, но справедливым». Он же удалил блог Максима через семь минут после публикации, а автора наказал. Блог Максим пишет в том числе «чтобы возможно позлить Михаила».</p>\n<p><strong>Человек в белой рубашке</strong> — вербовщик, убивший двух копьещиков и лучницу в лесу и предложивший Максиму выбор. В блоге он безымянный, описан как мужчина «с 20 до 30», в белой рубашке и чёрных брюках, мышцы видны сквозь рубашку «Словно в рекламах», лицо симметричное, причёска «как у всех только чуть длинноватый волосы», глаза светятся белым. Первая реплика: «Привет, тебя подвизти». Свой монолог о двух путях Максим оценивает как «явно выученный». Едет на встречу с новым апостолом по прозвищу «защитник». В версии от 2026-04-19 отдельно перечислен благословенный «Мистер белая рубашка, ну то есть Александор» (он же Саша), невероятно везучий; в переписке эти двое напрямую не отождествлены.</p>\n<p><strong>Чёрная лучница</strong> — первый убитый Максимом противник. Девушка не старше 20 лет, полностью чёрная («Нет не как афроамериканцы. А по настоящему черная. Чёрного цвета»), одета «как дикари в джунглях», белые только радужки глаз; лук и стрелы чёрные, у стрел наконечник с древком «словно единой»; кровь тоже чёрная. В ближнем бою у неё два странных ножа. Максим убивает её ударами ноги по голове, «Пока не слышу характерный хрусть. Ломающий черепушки».</p>\n<p><strong>Копьещики</strong> — противники в лесу у оврага с чёрной дымкой: двое с копьями плюс лучница в кустах (сначала по слуху Максим насчитал троих). «Они хоть не такие ловкий, как лучница. Но более крепкие». Стрела прошла сквозь одного из них насквозь, не ранив его, но ранив стоявшего за ним Максима.</p>\n<p><strong>Андрей</strong> — в версиях «Нимба» тот, кто позвал Максима в поход и защищает это решение. Его реплики о Максиме приведены выше.</p>\n<p><strong>Саша / рассказчик</strong> — второй участник спора, отговаривающий брать Максима. В версии 2025-05-04 он назван Сашей, в версии 2025-05-06 переписан в рассказчика от первого лица. Из-за темпа Максима он стёр ноги до крови и месяц не мог нормально ходить: «И это не шутка или преувеличения». Предложенное им решение (2025-05-04): «Нужно будет его попросить по медленнее двигаться».</p>\n<p><strong>Дима</strong> — третий участник зимовки в «Зиме» (2025-11-21). Максим и Дима вместе повалили дерево; Дима возвращается в дом, а Максим остаётся его пилить. На вопрос рассказчика «а где Максим?» Дима отвечает: «да там дерево распиливает, который мы повалили». Описан как высокий, плечистый, с натуральным чёрным цветом глаз и чёрными волосами, в любимой чёрной одежде.</p>\n<p><strong>Другие благословенные</strong> (2026-04-19): Герой (слышит шёпот «герой молю спаси...», предсказывающий будущее; за неспасённых расплачивается кошмарами; не может умереть окончательно), Александор / Мистер белая рубашка (везение), Юра (видит две белые точки — глаза непонятного существа — перед опасностью), четвёртый без имени (чувствует запах, напоминающий дом, и обязан идти за ним), азуриэль — пятый (чувствует эмоции). Максим — седьмой. Шестой в переписке не назван.</p>\n<p><strong>Друг-профессиональный лучник</strong> — упомянут одной фразой: «У меня друг профессиональный лучник. Да и я там пробовал себя». Имени нет.</p>\n<p><strong>Медведь</strong> — живёт у Максима дома; это тот медвежонок, которого он «спер, у медведицы».</p>", "r": []}, {"t": "Как менялся — состояния по датам, старое не затирается", "a": ["S06", "PS-0048-S06", "PS-0048--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2024-04-03 (id 153366), «игра бога», окно w0029.</strong> Карточка от Славы: высокий рост, лидер, способность «власть» с радиусом 70 метров и минусом — сам Максим тоже обязан подчиняться произнесённому закону. Никаких других черт нет.</p>\n<p><strong>Версия 2 — 2025-03-18 (id 305113–305117), «Апостол», окно w0082.</strong> Максим — главный герой и рассказчик блога: 19 лет, «Лучший среди людей», три факта о себе (восприятие времени, идеальные пять чувств, контроль мышц), скука гения, бой с чёрной лучницей и её убийство, бой с копьещиками, спасение и вербовка, три недели обучения вместо шести месяцев, куратор Медведь.</p>\n<p>Он же излагает основы устройства мира: «В начале всего было ничего. Потом появился первый мир \"Килька\". И да это наш мир». Потом появились другие миры, «И в каждом этом мире был свой бог. Его называют Правителем». Миры появляются и по сей день; связь есть между всеми мирами, но с «Килькой» она крепче. Чужемирцы — «существо покинувший свой мир», «Чаще всего из-за того, что их ней миры суший ад. Или желанием захвата других миров», «почти всё чужемирцы жестокие психи. Для которых убийства это обыденная дело»; у них есть разделение по видам способностей, о котором Максим говорить отказывается. Три известных способа попасть сюда: достичь границы своего мира (используется в маленьких недавно образовавшихся мирах), ритуал с любой из сторон (Максиму о нём не рассказали «по понятном причинам»), и самый редкий — когда Правитель сам отправляет. Главный факт для него самого: «мы субъекты первого мира. Не модем его пикинуть. Ну вот никак. Ну вот чужемирцы попадають нам за раз плюнуть». Запись удалена Михаилом через семь минут, отправитель наказан.</p>\n<p><strong>Версия 3 — 2025-03-18 (id 305260–305267), окно w0082.</strong> В обсуждении зафиксировано: Максим — просто человек (прямой вопрос «он просто человек?» и ответ «Да»); не всё из разбора «идеальной модели» к нему относится, потому что «он контролирует то на что может понадобиться навык и время»; регенерации у него нет. Миколай предлагает мотив: «он станет хулиганом».</p>\n<p><strong>Версия 4 — 2025-03-18 (id 305279–305297), окно w0082.</strong> Разбор мотивации. Миколай развивает догадку: «реально если че там чел говорит как легко было в учебе поэтому скатился и стал хулиганом». Дальше переформулирует происходящее жёстче: «не подраться а убить»; «с его контролем подраться можно на нормальных боевых аренах», «но там правила», «и если ему скучно правила», «он ходил убивать обычных людей в подворотнях»; на аренах «там реально сильные люди», а «че ему в неблагополучных районах делать», «где нет качалки», «никто не тягает железо». Слава отвечает: «Потому что там много быдло». Отдельно Миколай замечает, что при такой скуке Максим мог бы попробовать себя в стрельбе из лука: «а че ж не ты профессиональный лучник, раз делать нехуй и в этой юв дисциплине себя попробовал, может бы интересно было».</p>\n<p><strong>Версия 5 — 2025-03-18 (id 305422–305423), окно w0082.</strong> Авторское пояснение к бою в лесу: «И не смог придумать бой трёх против одного. Поэтому так быстро и вывел Максима». Ответ Миколая: «и ещё поможет далее развить и раскрыть другое ибо что-то уже написано а не в голове».</p>\n<p><strong>Версия 6 — 2025-05-04 (id 323655–323658), «Нимб» по дате объявления, окно w0090.</strong> Максим — не рассказчик, а тема спора Андрея и Саши перед походом. Лучший спортсмен колледжа или города, спортом занялся от скуки, в походе «скакал, как заяц туда сюда», «успел ещё какие-то дырки залазить». Перечислены выходки прошлого похода (медвежонок, пещера с блужданием, лиса), дома у него медведь. Реплика Андрея: «у него всё идеальное же выходит». Способностей из «Апостола» здесь нет.</p>\n<p><strong>Версия 7 — 2025-05-06 (id 323930–323934), «Нимб», окно w0091 (вселенная не объявлена).</strong> Пролог переписан от первого лица — рассказчиком стал тот, кто в прошлой версии был Сашей. Максим здесь — «чупакабра шустрая, быстрая и ловкая. Скачет туда сюда. Бегает то на гору то на речку то на дерева». Добавлено противопоставление про пределы («Дед гонял меня зная мои пределы. А Максим гонял пытаясь найти свои пределы»); пещера — не «повел и заблудился», а «уговорил, как то нас о этом» и «два дня не могли оттуда выйти»; лису он ловил всю дорогу. Реплика Андрея переписана в «Он же Максим, совершённый во всём». Здесь же названо число участников похода: «Нас тогда было шесть людей. Жалкая горстка людей, по сравнению с угрозой». О переработке Слава сказал: «С тем прологом я бы не смог продолжить» и «Изменения там не особо».</p>\n<p><strong>Версия 8 — 2025-11-21 (id 387578–387579), вселенная неясна, окно w0110.</strong> «Зима». Максим — третий участник зимовки вместе с рассказчиком и Димой, в деревянной халупе за десять тысяч километров от дома, в четырёх километрах от ближайшего населённого пункта. В кадре не появляется: он вне дома, пилит поваленное дерево, и падение этого дерева — тот шум, от которого сотрясается дом. Он «особо одарённый», решивший топить печь по старинке, выкинувший спички и зажигалку и вручивший рассказчику огниво с кремнем; сам, по мнению рассказчика, зажигает огонь с первого раза.</p>\n<p><strong>Версия 9 — 2026-04-19 (id 462204–462206), вселенная неясна, окно w0120.</strong> Максим включён в список благословенных под номером семь как сверхчеловек: ускоренное восприятие, точность движений через ощущение каждой клетки тела, ощущение нечто через сердцебиение с холодом и болезненным ёканьем как расплатой за отказ идти по зову сердца, невозможность смерти. Слава вводит это как основу системы: «И пока что основой послужат благословенный, одарённый, и т. Д.». Прежний тезис «он просто человек» (2025-03-18) здесь не действует, но и не отменяется в переписке отдельной репликой.</p>\n<h3>Отклонённые и не развитые варианты</h3>\n<ul>\n<li>Мотив «он станет хулиганом» (Миколай, id 305267, 305279) в самом тексте не развит: Максим в блоге не хулиган, а ищущий боя гений.</li>\n<li>Предложение дать Максиму стрельбу из лука как ещё одну дисциплину от скуки (Миколай, id 305294) осталось без ответа — диалог сворачивается репликами «ладно», «блять», «ладно я читаю дальше».</li>\n<li>Бой трое против одного не был написан: автор прямо сказал, что не смог его придумать, и вывел Максима из боя раньше (id 305422).</li>\n<li>Пролог от 2025-05-04 не отменён, а переписан 2025-05-06; оба варианта существуют, причина замены названа автором — с первым он «бы не смог продолжить».</li>\n</ul>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0048-S07", "PS-0048--chto-s-nim-stalo"], "h": "<p>Отдельной концовки у персонажа нет, линии между собой не сведены.</p>\n<p>В линии «Апостола» последнее, что известно: Максим — агент, прошедший трёхнедельное обучение под кураторством Медведя; его блог удалён Михаилом через семь минут, а сам он наказан. В финале записи он говорит, что времени осталось мало: «Скоро должен появиться чужемирец». Что произошло дальше, в переписке не сказано.</p>\n<p>В линии походов история обрывается на прологе: и версия 2025-05-04, и версия 2025-05-06 доходят только до сборов. Судьба группы в походе не написана — рассказчик версии 2025-05-06 упоминает «ту угрозу» и обрывает себя, но саму угрозу не называет.</p>\n<p>В «Зиме» Максим жив и остаётся за кадром до конца доступного фрагмента; текст обрывается репликой «Второе».</p>\n<p>В версии 2026-04-19 про него сказано, что смерть для него «невозможно».</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0048-S08", "PS-0048--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Соотношение способностей между версиями не оговорено. Способность «власть» (2024-04-03) больше нигде не появляется; сказано ли, что она отменена, — в переписке нет.</li>\n<li>Противоречие между «он просто человек» (2025-03-18, id 305263–305266) и «Он сверхчеловек», «Смерти, ну невозможно» (2026-04-19, id 462205) в переписке не обсуждается.</li>\n<li>Не сказано, один ли это персонаж во всех вселенных или разные Максимы. Совпадают три вещи: скука как причина заниматься всем подряд, идеальный результат во всём и физическая неутомимость; прямого утверждения о тождестве в переписке нет.</li>\n<li>Внешность за пределами «высокого роста» (2024-04-03) не описана нигде.</li>\n<li>Возражения Миколая по мотивации (2025-03-18, id 305279–305294) не привели к переписыванию текста: в блоге прогулки по неблагополучному району сохранены, ответ «там много быдло» — единственный аргумент.</li>\n<li>Фамилия, город, имена родителей не названы. Друг-профессиональный лучник упомянут одной фразой, имени нет.</li>\n<li>В версии 2026-04-19 Максим назван седьмым благословенным, но шестой в списке отсутствует, а четвёртый назван без имени.</li>\n<li>Не сказано, что за «нечто» ведёт благословенных: «Кого именно неизвестно, может бог, может ещё какое-то существо».</li>\n<li>Тождество человека в белой рубашке из блога (2025-03-18) и благословенного «Мистер белая рубашка, ну то есть Александор» (2026-04-19) в переписке не заявлено.</li>\n<li>Апостол по прозвищу «защитник» упомянут один раз (id 305116) и больше нигде не разработан.</li>\n<li>Ритуал перехода между мирами Максиму «не рассказали по понятном причинам» и в переписке не описан.</li>\n<li>Связь между линией «Апостола» (агенты, чужемирцы) и линией походов и зимовки не объяснена.</li>\n<li>В прологе от 2025-05-04 перепутаны атрибуции реплик: обе стороны диалога подписаны как Саша, один раз проскакивает имя Яра; кто такой Яра, не сказано. Вселенная там не названа; в версии от 2025-05-06 тоже не объявлена.</li>\n<li>Как Максим оказался на зимовке за десять тысяч километров от дома и был ли там кто-то кроме него, Димы и рассказчика — не сказано.</li>\n<li>Как Максим стал агентом на практике, чем занимался после лагеря и с какими чужемирцами сталкивался — не написано; он сам обещал рассказать про «альфа, апостолы, благословенный, силы зверя, классификация, арбетары, аномалия, существа», но запись удалили.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0048--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0005.html\">Агенты (организация вербовки)</a>, <a href=\"GR-0050.html\">Команда Славы (персонажи игры бога)</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0005.html\">Агенты (организация вербовки)</a>, <a href=\"GR-0050.html\">Команда Славы (персонажи игры бога)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0014.html\">игра бога</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0048--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-04-03</td>\n<td>153366–153366</td>\n<td>w0029</td>\n<td>игра бога (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-18</td>\n<td>305113–305117</td>\n<td>w0082</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-18</td>\n<td>305260–305267</td>\n<td>w0082</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-18</td>\n<td>305279–305297</td>\n<td>w0082</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-18</td>\n<td>305422–305423</td>\n<td>w0082</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-05-04</td>\n<td>323655–323659</td>\n<td>w0090</td>\n<td>Нимб (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-05-06</td>\n<td>323930–323936</td>\n<td>w0091</td>\n<td>Нимб (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-11-21</td>\n<td>387578–387579</td>\n<td>w0110</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-04-19</td>\n<td>462204–462206</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0048-maksim.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0048--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0048.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0048-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0048/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Самая дорогая дыра — <code>PS-0031</code> «Закон»: 15 884 знака базы, статьи нет, ноль ссылок, семь версий, 2024-03-12 — 2024-07-09, окна w0026, w0029, w0046. Статья утверждает, что способность «власть» (2024-04-03) больше нигде не появляется и нигде не отменена. В базе она появляется — раньше карточки Максима: в w0026 та же механика (произнесённый закон, радиус 70 метров, обязательное подчинение, наказание за нарушение) разбирается отдельно, Миколай предлагает ограничение по слышимости, Слава его отклоняет. То есть у первой способности Максима есть собственная история с поиском слабостей, и она лежит в записи, на которую не ссылается ни одна статья.</p>\n<p>Второе — семёрка благословенных 2026-04-19, на которой стоит вся девятая версия. Статья есть только у Максима. <code>PS-0359</code> «Герой» — 15 064, статьи нет; <code>PS-0360</code> «Александор» — 8 070, нет; <code>PS-0361</code> «Юра» — 7 884, нет; <code>PS-0362</code> «Четвёртый благословенный (запах дома)» — 8 179, нет; <code>MR-0129</code> «Азуриэль» — 51 589, тринадцать версий начиная с w0086, статьи нет. Ссылок на них ноль, хотя все пятеро перечислены в тексте этой статьи. Проверить противоречие «просто человек» / «сверхчеловек» не по чему: остальная шестёрка не описана нигде.</p>\n<p>Третье — <code>SP-0238</code> «Белые глаза»: 26 418 знаков, статьи нет, ноль ссылок, шесть версий, 2025-09-17 — 2025-10-20, вселенная «Оам». Там ровно та же связка, что в «трёх фактах» Максима, — замедленное восприятие времени плюс обострение всех пяти чувств, — но как общая способность расы, с дебаффами и с запретом держать режим долго («мозг не выдержит»). У Максима та же связка постоянная и бесплатная. Один это ход или два разных, из статьи не видно, и сверить не с чем.</p>\n<h3>С чего начать</h3>\n<p>Почти всё — в базе, а не в архиве.</p>\n<ul>\n<li><code>PS-0031</code>, окна w0026 и w0029: история способности «власть» до карточки 2024-04-03 и заодно ответ, отменяли её или просто бросили.</li>\n<li><code>SP-0238</code>, окна w0105–w0107: цена той же механики, расписанная через полгода после «трёх фактов».</li>\n<li>Продолжение семёрки: <code>PS-0359</code> доходит до 2026-06-02, id 487082–487095, 487096–487107 и 487148–487169. Благословенные там переехали в новую вселенную с Ассоциацией и «шестью столпами героев», а Слава признаёт, что способности для Героя так и нет, и просит помощи. Статья Максима обрывается на 2026-04-19; следующий шаг линии лежит в базе целиком, и там же должно решиться, кто шестой.</li>\n<li>Походная линия — тоже база: <code>IS-0052</code> «Пролог про Максима» (20 147), <code>IS-0055</code> «Истории про Максима» (8 186), <code>PS-0268</code> «Рассказчик историй про Максима» (7 865), <code>SL-0088</code> «Три начатых пролога» (19 948), <code>SL-0091</code> «Хронология историй Славы» (14 910), <code>PS-0132</code> «Андрей» (21 822), <code>PS-0051</code> «Саша» (13 354). Ни у одной из семи записей нет статьи. Путаница атрибуций в прологе 2025-05-04 (id 323655–323659), где обе стороны диалога подписаны Сашей, чинится там же.</li>\n<li>Вселенные: <code>VS-0006</code> «Нимб» (21 285) и <code>VS-0014</code> «игра бога» (18 198) — статей нет, при том что Максим числится в обеих; плюс <code>MR-0132</code> «Нимб» (88 701, семь версий, окно w0087) — самый большой неразобранный кусок во всей округе.</li>\n</ul>\n<p>В архив — за одним. Вербовщик в белой рубашке из блога 2025-03-18 отдельной записи не имеет: <code>PS-0349</code> «Мужчина в белой рубашке» (10 135, статьи нет) — это окно w0116, вселенная «7 островов», id 430012–430014, почти наверняка другой человек. Искать надо в w0082 вокруг 305113–305117 и в w0120 рядом с 462205, где назван Александор; без этого вопрос о тождестве не проверяем в принципе.</p>\n<h3>Как развивалось</h3>\n<p>2024-04-03 — заявили: карточка, рост, «лидер», способность «власть» с минусом для самого носителя. 2025-03-18 — переписали заново и ограничили: вместо магии три факта, прямой вопрос «он просто человек?» и ответ «Да», отдельно оговорено, что регенерация «вряд ли про него». В тот же день ограничили и мотивацию — Миколай разбирает, зачем такому гению драться в подворотне, — но текст после разбора не переписан. 2025-05-04 и 2025-05-06 — Максим уходит в другую линию, где способностей у него нет вовсе и виден он только со стороны. 2025-11-21 — остаётся за кадром, одна бытовая сцена. 2026-04-19 — вернулись, сняв ограничение: сверхчеловек, седьмой благословенный, «Смерти, ну невозможно». Между «просто человек» и «сверхчеловек» тринадцать месяцев и ни одной реплики, которая отменяла бы первое.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>В записи 2026-04-19 у Максима названа не только связь с «нечто», но и цена отказа от неё: пойдёшь по зову сердца — тепло и «приятно бьётся сердца», не пойдёшь — «сердца начнёт больно екать, и ему будет холодно». Он единственный в списке, у кого расписано, что бывает, если канал проигнорировать. У Героя — шёпот-мольба, у Юры — две белые точки перед опасностью, у четвёртого — запах, напоминающий дом, у азуриэля — чужие эмоции. Во всех четырёх случаях канал назван, а расплата за неповиновение — нет. Правило есть, и оно есть ровно у одного из пяти.</p>\n<h3>Отклик</h3>\n<p>Сильнее всего не сверхчеловек, а строчка из походного пролога: «Дед гонял меня зная мои пределы. А Максим гонял пытаясь найти свои пределы». Тот же персонаж, увиденный снаружи и без единой способности, и там он понятнее, чем в блоге с тремя фактами: человек, который ставит эксперимент на других, потому что на себе всё уже проверил. Хорош и мотор фигуры — скука не как черта характера, а как техническая проблема: препятствий нет, значит их надо изготовить; отсюда и прогулки по неблагополучному району, и похищенный медвежонок, и выброшенные спички с вручённым огнивом. Тем обиднее, что версия 2026 года чинит его в обратную сторону: у безграничного, которому вдобавок невозможно умереть, скуке взяться уже неоткуда, и главный двигатель глохнет. И отдельно стоит разбор Миколая про арены — «там реально сильные люди», «че ему в неблагополучных районах делать», «где нет качалки»: возражение по существу, на которое ответили «Потому что там много быдло», и текст остался как был.</p></div>", "r": []}];</script>
