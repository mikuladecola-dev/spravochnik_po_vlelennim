<script>const BASE="";const DOCNAME="Отряд сильнейших";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0063-S01", "PS-0063--proishozhdenie"], "h": "<p>Отряд объявлен Славой утром 2024-05-07 двумя сообщениями подряд: «Отряд сильнейших» и сразу состав — «Провидец; бессмертный» (2024-05-07, id 166480–166481). Третьим сообщением он же формулирует принцип набора: «И за пихая туда кого-нибудь» (id 166482), то есть отряд заводится как рамка, куда добираются персонажи, а не как готовая группа.</p>\n<p>Разработка целиком укладывается в один день — 2024-05-07, окно w0032, сообщения от 166480 до 166897. Всё, что известно об отряде, набрано за этот день.</p>\n<p>Варианты имени, встречающиеся в переписке: «Отряд сильнейших», «команда \"А\"», просто «отряд». Название «команда \"А\"» появляется в текстах, которые Миколай прогоняет через нейронку и вставляет в чат (id 166875 и далее); кто ввёл этот вариант первым, в переписке не сказано.</p>", "r": []}, {"t": "Характер", "a": ["S02", "PS-0063-S02", "PS-0063--harakter"], "h": "<p>Отряд описан Славой как военная единица: «Ну сильнейший бойцы типо военных» (id 166857). Рамка, которую Слава задаёт для подбора состава: «Ну представь военный отряд которым ещё врагов надо придумывать поэтому через чур инбаласный не надо ( ну или надо только с ограничением )» (id 166837). И следом: «Их типо считают сильнейшими но будут и другие отряд равный им по силе» (id 166838). Миколай сводит это к правилу набора: «Оке пон, мери сьюшек не делать» (id 166839).</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0063-S03", "PS-0063--sposobnosti"], "h": "<p>Собственных способностей у отряда нет — есть способности бойцов, которых в него набирают.</p>\n<p><strong>Провидец</strong> (Слава, id 166507, дословно): «Провидец имеет способность отматывать время но при этом отматывая время превращается в петлю времени где он обязан 10 000 прожить один и тот же промежуток времени ( безумец, ни разу не проигравший в рукопашном бою или в стрельбе)». Единица измерения при «10 000» не названа.</p>\n<p><strong>Бессмертный</strong> (Слава, id 166507, дословно): «Бессмертный бессмертный которого может убить лишь сверхчеловек с идеальном контролям, он способен не просто регенерировать повреждённый части, а изменять структуру своего тела или стрелять костями или с помощью плоти создавать разных существ ( на любой дистанции хорош на дальнее и средней он может стрелять костями, создавать костенной сад, или чудовище, а на ближней дистанции неплохо сражаться и использует свой бессмертие на все сто)».</p>\n<p>Условие бессмертия уточняется отдельно: Миколай скидывает ссылку на статью «Бессмертие» с anime-characters-fight.fandom.com со словами «Тут все возможные условия прописаны» и «Может у тебя чет отличающиеся» (id 166754–166756), Слава отвечает одной цифрой: «4» (id 166757). Что означает четвёртый тип по той классификации, в переписке не расшифровано.</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0063-S04", "PS-0063--svyazi-s-drugimi"], "h": "<p>Персонажи и сущности, названные в связи с отрядом: Бессмертный, Герострат, Имитатор, Лиомат, Несоразмерный, Призрак, Провидец, Сверхчеловек с идеальным контролем.</p>\n<p>Из них по переписке прослеживается:</p>\n<ul>\n<li><strong>Провидец</strong> и <strong>Бессмертный</strong> — состав отряда, заявленный первым же сообщением и ни разу не отменённый.</li>\n<li><strong>Несоразмерный</strong> — предложение Миколая на третьего, отклонено.</li>\n<li><strong>Призрак</strong> — предложение Миколая, отклонено для этого отряда, но оставлено в силе как персонаж.</li>\n<li><strong>Сверхчеловек с идеальным контролем</strong> — единственный названный тип противника, способный убить Бессмертного (заложено сразу в описание Бессмертного, id 166507). В конце дня Слава просит именно этих идей: «Ну все равно скидывай идей сверхчеловека» (id 166896).</li>\n<li><strong>Имитатор</strong> — упомянут Славой как уже имеющийся у него персонаж в ответ на предложение метаморфа: «Ну у меня есть персонаж имитатор» (id 166879). В отряд не заявлен.</li>\n<li><strong>Герострат</strong> и <strong>Лиомат</strong> значатся в списке связанных сущностей, но в приведённых кусках переписки по этому отряду не упоминаются — на каком основании они связаны, из текста не следует.</li>\n</ul>\n<p>Отдельно зафиксировано, что отряд не единственный: «будут и другие отряд равный им по силе» (id 166838). Условный «отряд \"Х\"» (телекинетик, криокинетик, пирокинетик, электрокинетик) — не часть вселенной, а спарринг-состав, придуманный нейронкой для моделирования боя (id 166889).</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S05", "PS-0063-S05", "PS-0063--kak-menyalsya"], "h": "<p>Вся разработка — 2024-05-07, пять состояний в пределах одного дня.</p>\n<p><strong>Состояние 1 — утро (id 166473–166510).</strong> Отряд объявлен, состав: Провидец и Бессмертный. Миколай предлагает третьим <strong>Несоразмерного</strong>: «Крч пиздец большой» или «Или меняющий размер по желанию» (id 166504–166505). Слава в ответ разворачивает подробные описания обоих своих бойцов (id 166507).</p>\n<p><strong>Состояние 2 — день (id 166753–166783).</strong> Миколай прямо спрашивает, что делать с его вариантом: «Просто я не определился ты оставляешь мой вариант, мне его доработать или чет другое придумать» (id 166761). Слава: «Не оставляю ( не знаю почему, просто как то не подходит)» (id 166762). Миколай предлагает <strong>Призрака</strong> — «локальное управление осязания. Ну тобиж он может проходить сквозь всё, и может контролировать какая часть его тела будет доступна для прикосновения. Даже если это маленькие участки или участки внутри тела» (id 166764), плюс «мощным боевым искусством» (id 166765), пример применения — «он например может сделать иглы из костей осязаемыми и ими зарезать других» (id 166766), и сразу способ победы — «просто атаковать осязаемую часть тела» (id 166767). Слава одобряет («Да», id 166771), но через час: «Но все это как то не то» (id 166776) и «Не ну призрак можно ещё куда нибудь запихать» (id 166779). Миколай: «Ну бля, я под эту идею его и создавал» (id 166781).</p>\n<p>Попутно Миколай выписывает из фандома определение ловкости по Н. А. Бернштейну — «способность двигательно выйти из любого положения», с четырьмя пунктами: правильно, быстро, рационально, находчиво (id 166772–166774). Как это применяется к отряду, в переписке не сказано.</p>\n<p><strong>Состояние 3 — вечер (id 166814–166845).</strong> Миколай предлагает <strong>Логос номос</strong> — «чел слова которого имеют вес», «Например скажет умри и чел умрёт, скажет дереву вырасти и оно вырастет» (id 166816), с пояснением «Это \"слово - закон\" по гречески если что» (id 166818); ограничение оставляет придумать Славе. Слава: «Ну чёт я хотел более новой» (id 166819). Миколай возражает, что новизну можно добрать условиями: «Но можно условия добавить», «Особенные», «И ограничения новые», «И тогда сойдёт за новую», «А то ты не первый о бессмертии заговорил» (id 166821–166825).</p>\n<p>Здесь же Миколай упоминает «божественные способности», «3 основные», с идеей: «раз эти челики будут сильнейшие значит будут близки к Богу», уточняя — «Ну бог это образно. Просто сильнейшее существо» (id 166828–166836). Слава от разбора отказывается («Нет и так ясно», id 166832), и дальше эта линия не развивается — что это за три основные способности, в переписке не названо.</p>\n<p>В ответ Слава и задаёт рамку военного отряда без имбаланса (id 166837–166838), а Миколай подкидывает ещё вариант: «Чел получает способности того кого / чего хавает», с оговоркой «я её из онгоинга про монстра спиздил» и «Просто написал пока» (id 166841–166844).</p>\n<p><strong>Состояние 4 — переопределение названия (id 166850–166866).</strong> Миколай атакует само название: «А с хуяли они сильнейшее», «Кто его так назвал», «Почему они сильнейшие если у них есть равные», «Чисто на выебонах назвались?» (id 166852–166856). Слава сначала держится за «сильнейший бойцы типо военных» (id 166857), но после указания, что есть равные им бойцы и тоже отряд (id 166858–166860), отступает: «Ладно ладно», «Не сильнейший», «Ну просто отряд довольно сильных людей с которыми способный справляться единицы» (id 166861–166863). Это последнее определение — итоговое для дня.</p>\n<p><strong>Состояние 5 — прогон через нейронку и вывод (id 166867–166897).</strong> Миколай признаётся, что скинул идею в нейронку: «Я зависимый», «Ну и поху. Главное что задача решается» (id 166868–166870), и вставляет её ответ (id 166875) — четыре варианта на добор к «команде \"А\"»: Манипулятор реальности, Телепат-эмпат, Хрономанипулятор, Трансформер. Сам Миколай уточняет по последнему: «Тут скорее подойдёт термин метаморф» (id 166876).</p>\n<p>Слава отвечает, что метаморф у него уже есть в виде Имитатора, и формулирует главный вывод дня: «А так там особой идей нету но зато я понял что просто кидать сильных персонажей в один отряд глупо тем более если их ний силы друг другу не подходят» (id 166880). Миколай соглашается: «Ну есть такое» (id 166882).</p>\n<p>Дальше Миколай вставляет ещё два текста нейронки: разбор «команды \"А\"» как подавляющей силы за счёт синергии Бессмертного и Провидца (id 166884) и смоделированный бой против выдуманного «отряда \"Х\"» из четырёх кинетиков, который «команда \"А\"» выигрывает (id 166889). Слава уточняет, что проблема не в этом: «Тока я никак в голове приставить не могу их ний командный работу или битву» (id 166887) и затем «Не я про то что не могу приставать командную работу против одного бойца» (id 166890). Миколай на это: «Вообще, Шекспир великий драматург не чурался подглядывать чужие работы, современные авторы пиздят идеи у Шекспира. А изначально все пиздили из летописей и реального мира. В общем ты и не представишь ничего, то что ты хочешь надо подглядеть в имеющихся реализованных ситуациях» (id 166891).</p>\n<p>Третий текст нейронки моделирует бой отряда против одного Сверхчеловека с идеальным контролем — и отряд там проигрывает (id 166893). Миколай подводит итог: «В общем. Тогда надо попробовать через время ещё раз представить. Возможно ты решишь полностью отряд переформировать если считаешь что они сейчас не совместимы» (id 166895). Слава закрывает день просьбой: «Ну все равно скидывай идей сверхчеловека» (id 166896).</p>\n<h3>Отклонённые варианты</h3>\n<ul>\n<li><strong>Несоразмерный</strong> (Миколай, id 166504–166505) — «пиздец большой» либо «меняющий размер по желанию». Отклонён: «Не оставляю ( не знаю почему, просто как то не подходит)» (id 166762).</li>\n<li><strong>Призрак</strong> (Миколай, id 166764–166767) — локальное управление осязанием плюс боевое искусство. Сначала принят («Да», id 166771), затем отклонён для этого отряда: «Но все это как то не то» (id 166776). Как персонаж сохранён: «призрак можно ещё куда нибудь запихать» (id 166779).</li>\n<li><strong>Логос номос</strong> (Миколай, id 166816) — «слово — закон», сказанное сбывается. Отклонён как недостаточно новое: «Ну чёт я хотел более новой» (id 166819). Ограничение под него так и не придумано.</li>\n<li><strong>Поедатель способностей</strong> (Миколай, id 166841) — «Чел получает способности того кого / чего хавает», взято из «онгоинга про монстра». Реакции Славы в переписке нет.</li>\n<li><strong>Варианты от нейронки</strong> (id 166875) — Манипулятор реальности, Телепат-эмпат, Хрономанипулятор, Трансформер/метаморф. Ни один не принят; на метаморфа Слава ответил, что у него уже есть Имитатор (id 166879).</li>\n</ul>", "r": []}, {"t": "Что с ним стало", "a": ["S06", "PS-0063-S06", "PS-0063--chto-s-nim-stalo"], "h": "<p>На конец дня 2024-05-07 отряд состоит из тех же двоих, что и утром: Провидец и Бессмертный. Ни один из пяти предложенных третьих бойцов не принят. Название переопределено с «сильнейших» на «отряд довольно сильных людей с которыми способный справляться единицы» (id 166863). Открытым остаётся вопрос о переформировании: «Возможно ты решишь полностью отряд переформировать если считаешь что они сейчас не совместимы» (id 166895) — решения в переписке нет. Последнее действие по теме — просьба Славы прислать идеи сверхчеловека (id 166896) и ответ Миколая «Хорошо» (id 166897). Дальше этого дня разработка отряда не идёт.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0063-S07", "PS-0063--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Внешность не описана ни для отряда как единицы, ни в связи с ним.</li>\n<li>Вселенная ни разу не названа; принадлежность к «игре бога» проставлена по дате объявления.</li>\n<li>Численность отряда не задана: сколько всего бойцов должно быть, в переписке не сказано. Ясно только, что двоих мало и ищут третьего.</li>\n<li>Кто назвал отряд и кто в него набирает — Миколай спрашивает прямо («Кто его так назвал», id 166854), ответа в переписке нет.</li>\n<li>Армия, государство или структура, к которой отряд относится, не названа — только слово «типо военных» (id 166857).</li>\n<li>Названо, что есть «другие отряд равный им по силе» (id 166838), но ни один такой отряд не описан и не поименован. «Отряд \"Х\"» из четырёх кинетиков — материал нейронки для моделирования, не часть вселенной.</li>\n<li>Единица измерения в «10 000 прожить один и тот же промежуток времени» у Провидца не указана.</li>\n<li>Ответ Славы «4» на классификацию условий бессмертия (id 166757) не расшифрован — какой именно тип имеется в виду, из переписки не следует.</li>\n<li>«3 основные божественные способности» упомянуты, но не перечислены: Слава отказался от статей со словами «Нет и так ясно» (id 166832).</li>\n<li>Как определение ловкости по Бернштейну (id 166773) относится к отряду или к кому-то из бойцов, не сказано.</li>\n<li>Связь отряда с Геростратом и Лиоматом в приведённой переписке не проявлена.</li>\n<li>Тип сущности спорный: это коллективная единица, боевой отряд, а не одиночный персонаж, хотя разработка вокруг неё ведётся как вокруг персонажа.</li>\n<li>Главная нерешённая задача, названная самим Славой: не получается представить командную работу отряда, особенно против одного бойца (id 166887, 166890). Решения к концу дня нет.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0063--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0048.html\">Отряд сильнейших (команда «А»)</a>, <a href=\"GR-0052.html\">Геростраты</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0014.html\">игра бога</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0063--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-05-07</td>\n<td>166473–166510</td>\n<td>w0032</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-05-07</td>\n<td>166753–166783</td>\n<td>w0032</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-05-07</td>\n<td>166814–166845</td>\n<td>w0032</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-05-07</td>\n<td>166850–166866</td>\n<td>w0032</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-05-07</td>\n<td>166867–166897</td>\n<td>w0032</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0063-otryad-silneyshih.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0063--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0063.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0063-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0063/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дороже всего чинить не третьего бойца (тут решения и так нет), а Провидца — половину исходного состава отряда. По <code>blockers.json</code> это <code>ID-0050</code>, идея без статьи, но с 14549 байтами материала в базе и тремя ссылками на неё — больше, чем на любую другую сущность вокруг этого отряда (для сравнения, у отклонённого Несоразмерного — <code>ID-0051</code> — вдвое меньше материала и на одну ссылку меньше). Отряд открывается двумя именами, Провидец и Бессмертный, но раскрыт в статье только Бессмертный — Провидец остаётся однострочной цитатой, хотя материала под него уже накоплено больше, чем под всё остальное содержимое дня 2024-05-07.</p>\n<h3>С чего начать</h3>\n<p>Материал уже в базе, не в архиве: <code>kb/sushnosti/idei/ID-0050-providec.md</code>. Идти в переписку заново не нужно — файл существует, просто до статьи о Провидце дело не дошло.</p>\n<h3>Как развивалось</h3>\n<p>Отряд заявлен утром одним днём — состав, принцип набора, оба бойца расписаны сразу. Дальше день ушёл на предложения третьего: Несоразмерный отклонён без объяснений, Призрак сперва принят, через час отклонён, Логос номос отклонён как «недостаточно новый». К вечеру само название пересмотрено — «сильнейшие» превратились в «довольно сильных людей, с которыми справятся единицы». День закрылся не решением, а прогоном через нейронку и открытым вопросом о переформировании, к которому переписка больше не возвращалась.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для Бессмертного условие «кто может его убить» названо прямо — сверхчеловек с идеальным контролем. Для Провидца, второго члена того же дуэта, аналогичного условия — что может прервать его петлю в 10 000 [чего-то] — в переписке нет вообще.</p>\n<h3>Отклик</h3>\n<p>Самое живое здесь — не способности, а момент, когда Слава сам себя ловит на честной формулировке: «просто кидать сильных персонажей в один отряд глупо, тем более если их силы друг другу не подходят». Это редкий случай, когда автор проговаривает вслух не идею, а причину, по которой идея не складывается, — и на этом останавливается, не пытаясь тут же её решить.</p></div>", "r": []}];</script>
