<script>const BASE="";const DOCNAME="Военный";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0124-S01", "PS-0124--proishozhdenie"], "h": "<p>Персонаж принадлежит вселенной, объявленной 2024-07-31 (id 214143); имени в переписке ей не дали.</p>\n<p>Введён 2024-07-31 (id 214316–214322, окно w0049) как одна из ролей пятёрки главных героев (<a href=\"PS-0123.html\">Команда гиг (5 человек)</a>): Слава перечисляет — «Врачи военные», «Механик», «И та.»; Миколай подтверждает состав: «ну больной, врач, военный, механик и подросток».</p>", "r": [["Команда гиг (5 человек)", "PS-0123.html"]]}, {"t": "Характер", "a": ["S02", "PS-0124-S02", "PS-0124--harakter"], "h": "<p>Возраст сначала предложен как 50 лет («военному 50», «позавчера исполнилось» — id 214340–214341), но Слава возражает: «Ты не ахуел», «Главное боевое силе 50» — то есть для роли главной боевой силы команды 50 лет много. После шутливого обмена репликами про 120-летних «старичков» со сверхсилами в аниме (Миколай: «Вай, в аниме такие старички офигенные я не могу 😍») Слава отвечает, что у обычного старика вместо сверхсилы — «Горб» и «Проблемы с реакции», и возраст фиксируется на 37 годах («ладно 37 норм»).</p>\n<p>Характер описан отдельно, в два захода. Сначала Миколай называет военного «имба», но Слава уточняет: «Не всегда». Затем, после короткой паузы («Я хавать»), Миколай формулирует характеристику целиком: «он неуклюжий будет», «и с плохим характером», «добрый», «но общаться не умеет», «и ваще у него птср» (id 214370–214383).</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0124-S03", "PS-0124--sposobnosti"], "h": "<p>Прямо названных сверхспособностей нет — команда описана как «обычные люди» без суперсил (см. <a href=\"PS-0123.html\">Команда гиг (5 человек)</a>). Военный обозначен как «главная боевая сила» пятёрки («Главное боевое силе» — формулировка Славы), то есть его роль в команде — боевая, но природа этой силы (боевые навыки, а не магия/сверхспособность) прямо не уточняется.</p>", "r": [["Команда гиг (5 человек)", "PS-0123.html"]]}, {"t": "Связи с другими", "a": ["S04", "PS-0124-S04", "PS-0124--svyazi-s-drugimi"], "h": "<p>Часть пятёрки — <a href=\"PS-0123.html\">Команда гиг (5 человек)</a> «Команда гиг (5 человек)».</p>", "r": [["Команда гиг (5 человек)", "PS-0123.html"]]}, {"t": "Как менялся", "a": ["S05", "PS-0124-S05", "PS-0124--kak-menyalsya"], "h": "<p><strong>2024-07-31, версия 1 (id 214316–214322):</strong> введён как роль в перечне пяти («врач, военный, механик и подросток»).</p>\n<p><strong>2024-07-31, версия 2 (id 214336–214364):</strong> возраст — 50 (отклонено) → 37, с попутным обсуждением того, что даёт возраст персонажу («горб», «проблемы с реакции» — вместо сверхсилы, которая бывает у стариков в аниме).</p>\n<p><strong>2024-07-31, версия 3 (id 214370–214383):</strong> характер — от короткого «имба» (тут же скорректированного Славой: «Не всегда») до развёрнутого списка черт: неуклюжий, с плохим характером, добрый, не умеет общаться, ПТСР.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S06", "PS-0124-S06", "PS-0124--chto-s-nim-stalo"], "h": "<p>Дальнейшая судьба персонажа после 2024-07-31 в материале не описана.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0124-S07", "PS-0124--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Внешность не описана.</li>\n<li>Не уточнено, в чём конкретно заключается его боевая роль («главная боевая сила») — навыки, оружие или иное.</li>\n<li>Не сказано, откуда у него ПТСР — военный опыт упомянут только через профессию, конкретная предыстория не раскрыта.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0124--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0123.html\">Команда гиг (5 человек)</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0123.html\">Команда гиг (5 человек)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0124--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-31</td>\n<td>214316–214322</td>\n<td>w0049</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-31</td>\n<td>214336–214364</td>\n<td>w0049</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-31</td>\n<td>214370–214383</td>\n<td>w0049</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0124-voennyy.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0124--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0124.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
