<script>const BASE="";const DOCNAME="Клон грешника";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0017-S01", "SP-0017--mehanika"], "h": "<p>Способность создавать клона грешника, который дерётся с самим грешником: «Способность создать клон грешника, который будет сражаться с грешником, отвлекать его» (2023-03-27, id 37582). Клон, таким образом, выполняет две задачи — сражается и отвлекает, а противником ему выступает тот, с кого он снят.</p>\n<p>Предложена Миколаем как пятая способность Демона. Ни срок жизни клона, ни способ его создания, ни то, чем клон отличается от оригинала, в переписке не названы.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0017-S02", "SP-0017--ogranicheniya-i-cena"], "h": "<p>Ограничений и цены в переписке не названо.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0017-S03", "SP-0017--nositeli"], "h": "<p>Предполагаемый носитель — Демон. Способность разрабатывалась в наборе способностей Демона; в базе она также помечена как часть сущности «Парень в белой маске с улыбкой».</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0017-S04", "SP-0017--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2023-03-27 (id 37580–37584, окно w0011).</strong> Предложена. Разговор шёл о наборе способностей Демона: перед этим Слава сформулировал четвёртую — «Четвертая способность душа грешника( хватая противника за голову и за 3 минуты создаёт в его голове мир где он проживает разный или одну жизнь )» (id 37580) — и подвёл счёт: «Ну вот осталось ещё 2» (id 37581). На это место Миколай и предложил клона грешника (id 37582).</p>\n<p><strong>Версия 2 — 2023-03-27 (id 37594–37598, окно w0011).</strong> Отклонена. Ответ Славы: «Может другую», повторённый дважды (id 37595–37596). Причина отказа не названа. Замены на месте не предложено; Миколай ответил вопросом о сроках — «Может, сам или завтра?» (id 37597).</p>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S05", "SP-0017-S05", "SP-0017--otklonennye-varianty"], "h": "<p>Способность отклонена целиком, в тот же вечер, что и предложена, — между предложением в 18:56 и отказом в 19:33. Отказ дан без разбора и без встречного варианта, только «Может другую».</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S06", "SP-0017-S06", "SP-0017--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Входит в счётный набор способностей Демона — всего их предполагалось шесть: после четвёртой Слава отметил, что «осталось ещё 2» (id 37581). Клон грешника предлагался на пятое место.</p>\n<p>Рядом с ней в том же разговоре названа четвёртая способность — «душа грешника»: захват противника за голову и создание у него в голове мира, где тот за три минуты проживает одну или несколько жизней (id 37580). Обе способности строятся вокруг слова «грешник», но связь между ними в переписке не проговорена.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "SP-0017-S07", "SP-0017--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Не сказано, из чего создаётся клон, сколько он живёт и что с ним происходит после боя.</li>\n<li>Не сказано, повторяет ли клон способности грешника и насколько он ему равен.</li>\n<li>Не сказано, можно ли создать несколько клонов сразу.</li>\n<li>Причина отказа не названа: «Может другую» дано без объяснения.</li>\n<li>Чем заполнено пятое место в наборе способностей Демона после отказа — в прочитанном фрагменте не сказано.</li>\n<li>Соотношение Демона и сущности «Парень в белой маске с улыбкой» в переписке не разъяснено, связь дана только пометкой в базе.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["SP-0017--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2023-03-27</td>\n<td>37580–37584</td>\n<td>w0011</td>\n<td>неясно (не определено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2023-03-27</td>\n<td>37594–37598</td>\n<td>w0011</td>\n<td>неясно (не определено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0017-klon-greshnika.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0017--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0017.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
