<script>const BASE="";const DOCNAME="Нат Магнов";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0043-S01", "PS-0043--proishozhdenie"], "h": "<p>Персонаж вселенной «игра бога». Появляется одним сообщением Миколая (2024-04-02, id 153331) в виде готовой карточки — имя, роль, возраст, способность. Откуда персонаж взялся, из какой предыстории и по какому поводу придуман, в переписке не сказано: обсуждения, предшествующего карточке, в записи нет.</p>\n<p>Карточка записана подряд с карточками <a href=\"PS-0044.html\">Терор Мачилович</a> (Терор Мачилович) и <a href=\"PS-0045.html\">Каваи Навалов</a> (Каваи Навалов) — три сообщения одной минуты, id 153331–153333, все от Миколая, все по одному шаблону: имя, характеристика с возрастом, строка «Способность:».</p>\n<p>Возраст — 28 лет.</p>", "r": [["Терор Мачилович", "PS-0044.html"], ["Каваи Навалов", "PS-0045.html"]]}, {"t": "Характер", "a": ["S02", "PS-0043-S02", "PS-0043--harakter"], "h": "<p>Описан одной строкой: «Лидер группы, хороший оратор с широким спектром знаний, 28 лет».</p>\n<p>Отдельно в сводке по окну w0029 он обозначен как лидер команды — то есть роль лидера привязана к нему, а не разделена с кем-то ещё. Никаких других черт характера, привычек или манеры речи в переписке нет.</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0043-S03", "PS-0043--sposobnosti"], "h": "<p>«Способность: создание прохода в секретный подземный бункер».</p>\n<p>Больше о способности не сказано ничего. Не названо: откуда берётся проход и куда именно открывается (бункер один и тот же всякий раз или каждый раз свой — не уточнено), можно ли провести с собой других, сколько держится проход, есть ли цена или ограничение по числу применений. Что находится в бункере и чей он — не описано. Само слово «секретный» остаётся без расшифровки: секретный от кого — не сказано.</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0043-S04", "PS-0043--svyazi-s-drugimi"], "h": "<p>Назван «лидер группы» — то есть группа предполагается, но её состав в переписке не назван. Карточка идёт первой из трёх подряд идущих карточек (<a href=\"PS-0043.html\">Нат Магнов</a>, <a href=\"PS-0044.html\">Терор Мачилович</a>, <a href=\"PS-0045.html\">Каваи Навалов</a>); прямо в тексте эти трое в одну группу не сведены, связь между ними в переписке не проговорена.</p>\n<p>Из связей зафиксирована только принадлежность к вселенной «игра бога».</p>", "r": [["Терор Мачилович", "PS-0044.html"], ["Каваи Навалов", "PS-0045.html"]]}, {"t": "Как менялся — состояния по датам", "a": ["S05", "PS-0043-S05", "PS-0043--kak-menyalsya"], "h": "<p><strong>2024-04-02 (id 153331, окно w0029)</strong> — единственная версия. Полная карточка: лидер группы, хороший оратор с широким спектром знаний, 28 лет, способность — создание прохода в секретный подземный бункер.</p>\n<p>К персонажу больше не возвращались: других версий, правок и упоминаний в переписке нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0043-S06", "PS-0043--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Внешность не описана вообще.</li>\n<li>Происхождение, биография до момента карточки — в переписке не сказано.</li>\n<li>Состав группы, которую он возглавляет, не назван.</li>\n<li>Механика способности не разобрана: ограничения, цена, дальность, длительность прохода, возможность провести других — ничего этого нет.</li>\n<li>Что представляет собой бункер, кому он принадлежит, что в нём — не описано.</li>\n<li>Дальнейшая судьба персонажа не прописана: он появляется один раз и больше в переписке не возникает.</li>\n<li>Связь с двумя соседними карточками (<a href=\"PS-0044.html\">Терор Мачилович</a>, <a href=\"PS-0045.html\">Каваи Навалов</a>) прямо не заявлена, осталась нерешённой.</li>\n</ul></div>", "r": [["Терор Мачилович", "PS-0044.html"], ["Каваи Навалов", "PS-0045.html"]]}, {"t": "Связи — всё вместе", "a": ["PS-0043--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0049.html\">Команда Миколая (10 персонажей игры бога)</a></li>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0044.html\">Терор Мачилович</a>, <a href=\"PS-0045.html\">Каваи Навалов</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0044.html\">Терор Мачилович</a>, <a href=\"PS-0045.html\">Каваи Навалов</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0049.html\">Команда Миколая (10 персонажей игры бога)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0014.html\">игра бога</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0043--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-04-02</td>\n<td>153331–153331</td>\n<td>w0029</td>\n<td>игра бога (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0043-nat-magnov.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0043--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0043.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
