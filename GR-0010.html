<script>const BASE="";const DOCNAME="Церковь";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0010-S01", "GR-0010--chto-eto"], "h": "<p>«Церковь» — раздел рабочего реестра вселенной «Апостол», который Слава вёл и периодически перевыкладывал в чат целиком. Разведка завела её как группу, но по материалу переписки это не объединение персонажей, а <strong>рубрика каталога</strong>: строка-заголовок в списке, под которой стоят два имени с эмодзи.</p>\n<p>Ни в одном из двух источников (Список персонажей вселенной (Благословенные / Враг / Церковь / Военный / Сторонние силы / Семь грехов / Существа / Аномалии / Оружие / Артефакты / Идеи) <em>(статьи ещё нет — <a href=\"kb/SL-0053-spisok-personazhey-vselennoy-blagoslovennye-vrag-cerkov-voen.html\">исходник</a>)</em>, Реестр персонажей и сил (Апостолы, Одержимый, Враг, Церковь, Военный, Сторонние силы, Существа, Аномалии, Оружие, Артефакты, Идеи) <em>(статьи ещё нет — <a href=\"kb/SL-0090-reestr-personazhey-i-sil-apostoly-oderzhimyy-vrag-cerkov-voe.html\">исходник</a>)</em>) слово «Церковь» не появляется вне реестра. Ни разу не сказано, что эти двое связаны между собой, служат одной силе, действуют вместе или подчиняются кому-то. Единственное, что их объединяет в переписке, — они стоят под одним заголовком в списке. Что этот заголовок означает — организацию, сторону конфликта или просто удобную полку для двух персонажей — в переписке не сказано.</p>\n<p>Рубрика соседствует в реестре с разделами «Благословенный» (позже «Апостолы»), «Одержимый», «Враг», «Военный», «Сторонний силы», «Семь грехов», «Существа», «Аномалий», «Оружие», «Артефакты», «Идей». По устройству она такая же, как «Враг» или «Военный», — классификатор, а не описанное объединение.</p>", "r": [["Список персонажей вселенной (Благословенные / Враг / Церковь / Военный / Сторонние силы / Семь грехов / Существа / Аномалии / Оружие / Артефакты / Идеи)", "kb/SL-0053-spisok-personazhey-vselennoy-blagoslovennye-vrag-cerkov-voen.html"], ["Идеи)", "kb/SL-0090-reestr-personazhey-i-sil-apostoly-oderzhimyy-vrag-cerkov-voe.html"]]}, {"t": "Состав", "a": ["S02", "GR-0010-S02", "GR-0010--sostav"], "h": "<p>В реестре под заголовком «Церковь» с самой первой зафиксированной редакции (2025-01-27, id 284858) и до последней (2025-05-14, id 325799) стоят два пункта, дословно:</p>\n<ul>\n<li><strong>Священнослужитель ⚪️</strong></li>\n<li><strong>Многоглазый 👁‍🗨</strong></li>\n</ul>\n<p>Отдельных id участников у статьи нет: записей на этих двух персонажей в базе не заведено, в списке <code>members</code> пусто. В переписке оба существуют только как имя с эмодзи — ни сил, ни внешности, ни биографии, ни того, кто из них старше или сильнее.</p>\n<p>Косвенно с рубрикой соотносится один пункт из раздела «Оружие»: <strong>«Посох и два шара ⚪️»</strong> — у него та же эмодзи-метка ⚪️, что у Священнослужителя. Прямо в переписке связь оружия с персонажем не проговаривается, совпадение метки — единственное основание, поэтому фиксируется как совпадение, не более.</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S03", "GR-0010-S03", "GR-0010--kak-menyalas"], "h": "<p>Раздел «Церковь» не менялся ни разу за всё время, покрытое источниками. Ниже — по датам, где он появлялся и что при этом происходило с реестром вокруг него.</p>\n<p><strong>2025-01-27 (id 284858), окно w0073.</strong> Первая зафиксированная редакция реестра, где раздел «Церковь» уже есть. По служебной пометке к версии, относительно предыдущей редакции здесь добавлены разделы «Существа», «Аномалий», «Церковь», «Военный», «Сторонний силы»; то есть «Церковь» заведена как рубрика именно в этой редакции. Уже с двумя пунктами: Священнослужитель ⚪️, Многоглазый 👁‍🗨. Раздел «Военный» в этой редакции пустой, «Существа» тоже.</p>\n<p><strong>2025-01-28 (id 285519–285551), окно w0073.</strong> Слава выкладывает реестр заново (сообщение 285522) и предлагает: «Угадай что изменилась 😂». Далее идёт построчный разбор изменений: добавлен Масочник 🎭 к благословенным, Провидец 🤡 и Серафим в сторонние силы, артефакт «Цепи окавы 🤐», «Ожерелья ☀️» переименованы в «Ожерелья света», «Цепь связи ⛓» перенесена из артефактов в оружие («Ну была только в артефактах, я её после перенёс в орудий»). Раздел «Церковь» в разборе не назван и не изменён. Отдельно Миколай отмечает, что не изменилось: «не разделены благословенные и апостолы», Слава отвечает «Сделаю сделаю». Часть изменений Слава не назвал («И ещё один / И ещё одно»), Миколай угадывал — какие именно, из переписки не восстанавливается; затрагивали ли они «Церковь», неизвестно.</p>\n<p><strong>2025-02-25 (id 295556–295562), окно w0077.</strong> Реестр выложен целиком одним сообщением (295559). Раздел благословенных вырос до 14 нумерованных пунктов (добавлены Сон ✨, Небесная 🚀, Маэстро 🎼; у Палача появилась пометка «( тварь)»), появился раздел «Одержимый» с Гурманом, раздел «Военный» заполнен: Зеркальный 🪞, Очкарик. «Церковь» — те же два пункта без изменений.</p>\n<p><strong>2025-03-06 (id 298846–298857), окно w0079.</strong> Реестр снова выложен целиком (298850) в том же виде. «Церковь» без изменений. В этом же окне принято решение по соседнему разделу: «Грехи нужно убрать, а то тупо» — «ну просто в сюжет не совсем входят». Про «Церковь» такого решения не принималось. Рядом Слава уточняет: «12 злодеев пока» — «Ну в списке моём». Идёт ли счёт злодеев только по разделу «Враг» или включает «Церковь», в переписке не сказано.</p>\n<p><strong>2025-05-14 (id 325798–325801), окно w0094.</strong> Реестр выложен целиком (325799), теперь верхний раздел называется не «Благословенный», а «Апостолы» — то самое разделение, которое обещали 28.01. Из раздела «Враг» исчез Зонтик 🩸 (13 позиций вместо 14), отдельного объяснения этому в переписке нет. «Церковь» — без изменений: Священнослужитель ⚪️, Многоглазый 👁‍🗨.</p>\n<p><strong>2025-05-14 (id 325805–325808), окно w0094.</strong> Сразу после выкладки Слава пишет: «Ну и нужно исправления», и на вопрос, что именно, отвечает: «Добавления организация нимб и фантазеров / И перераспределение сил». Это единственное место, где в реестре заходит речь об организации как таковой (а не о рубрике-классификаторе). Связана ли «организация нимб» с разделом «Церковь», заменяет ли его, соседствует ли с ним — в переписке не сказано; сама правка в источниках не выполнена, реестр после неё не перевыкладывался. Осталось нерешённым.</p>", "r": []}, {"t": "Пробелы", "a": ["S04", "GR-0010-S04", "GR-0010--probely"], "h": "<div class=\"gaps\"><ul>\n<li><strong>Способностей нет.</strong> Что умеют Священнослужитель и Многоглазый, есть ли у участников рубрики общие силы — в переписке не сказано ни разу. Раздела «Общие способности группы» в статье поэтому нет.</li>\n<li><strong>Различий нет.</strong> Чем эти двое отличаются друг от друга, кроме имени и эмодзи, не сказано.</li>\n<li><strong>Иерархии нет.</strong> Кто главный, есть ли главный, подчиняются ли эти двое кому-то — не сказано. У других разделов реестра пометки свиты даются в скобках (например, «Дитя света ✨(военный 🐺)»); у обоих пунктов «Церкви» скобок нет вообще.</li>\n<li><strong>Отношений с другими группами нет.</strong> Ни столкновений, ни союзов, ни упоминаний «Церкви» рядом с «Врагом», «Военным», апостолами или сторонними силами вне списка не зафиксировано.</li>\n<li><strong>Не сказано, организация ли это.</strong> Является ли «Церковь» действующей структурой внутри мира или только полкой в авторской описи — в переписке не проговорено.</li>\n<li><strong>Двух записей на участников в базе нет</strong> — только строки в реестре. Поимённый состав есть (два имени), но за именами ничего не стоит.</li>\n<li><strong>Судьба рубрики после 2025-05-14 неизвестна</strong> — правка «добавления организация нимб и фантазеров / и перераспределение сил» объявлена, но в источниках не выполнена.</li>\n</ul></div>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0010--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0010.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0010-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0010/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым чинить не состав, а реестры, на которых вся статья и стоит. <code>SL-0053</code> — шесть ссылок, статьи нет, база 20 313; <code>SL-0090</code> — четыре ссылки, статьи нет, 5 492. Это два единственных источника «Церкви» и одновременно самые дорогие незакрытые записи всего набора: рядом только <code>SL-0051</code> (шесть ссылок, статьи нет, 9 834) и <code>SL-0089</code> (четыре ссылки, 1 753). Пока реестр не разобран как документ, любая рубрика внутри него — включая эту — описывается вслепую.</p>\n<p>Дальше — сами два имени. Ни Священнослужителя, ни Многоглазого в базе нет вообще: ни под каким id, ни в каком виде. Это дыра не по числу ссылок (ссылается только эта статья), а по существу — за ней стоит весь состав целиком.</p>\n<p>Третье: слово «церковь» в базе есть, но нигде не сведено с рубрикой. <code>MR-0086</code> «Религия и церковь» — статьи нет, база 5 459, вселенная помечена «неясно». <code>MR-0172</code> «Церковь с паладинами» — статьи нет, 13 504, вселенная «Оам». Ни одна из двух с <code>GR-0010</code> не связана.</p>\n<h3>С чего начать</h3>\n<p>В архив за участниками идти бесполезно, это проверяемо: «Священнослужитель» и «Многоглазый» встречаются в архиве пять раз, все пять — внутри выкладок реестра, окна w0073 (дважды), w0077, w0079, w0094. Вне списка их нет ни разу. Так что вопрос «кто это» в переписке не имеет ответа, и искать надо не его.</p>\n<p>Что имеет смысл смотреть — в базе. <code>MR-0137</code> «Организация Нимб» (две ссылки, статья есть, база 2 927): там единственное место во всём материале, где во вселенной заводится церковь — «Организация Нимб более не фармавечическая компания это религиозная церковь» (2025-09-12, id 364762). Это же ровно та правка, которая была объявлена сразу после последней выкладки реестра (id 325808) и осталась невыполненной. Связывать их за авторов нельзя, но проверить, не про одно ли это, — первое разумное действие. Следом <code>MR-0086</code> и <code>MR-0172</code>.</p>\n<h3>Как развивалось</h3>\n<p>2025-01-27 (id 284858) рубрику заводят пакетом вместе с «Существами», «Аномалиями», «Военным» и «Сторонними силами» — сразу с двумя именами. 2025-01-28 реестр перевыкладывают и разбирают построчно, с переносами и переименованиями: «Церковь» в разборе не названа. 2025-02-25 благословенных становится 14, «Военный» заполняется — «Церковь» переносится дословно. 2025-03-06 по соседнему разделу принимается решение («Грехи нужно убрать»), по этому — никакого. 2025-05-14 верхний раздел переименован в «Апостолы», из «Врага» исчезает позиция — «Церковь» опять слово в слово. Четыре ревизии, единственная рубрика, которой ни разу не коснулись. Возврата к ней тоже нет: 2025-09-12 слово «церковь» в материале появляется снова, но применительно к Нимбу и в другой записи.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для «Семи грехов» критерий выбытия назван вслух: «Грехи нужно убрать, а то тупо» — «ну просто в сюжет не совсем входят» (2025-03-06). То есть у рубрики в реестре есть проверка на пригодность, и она сформулирована. «Церковь» под тот же критерий подходит буквально — за всё время она не дала ни одного упоминания вне списка, ни одной сцены, ни одного пересечения с другими разделами, — но её на этот вопрос не поставили ни разу. Правило отбраковки рубрики названо для грехов и не названо для случая того же рода.</p>\n<h3>Отклик</h3>\n<p>Зацепило одно, и оно не в тексте, а в разметке: у Священнослужителя стоит ⚪️, и точно такой же ⚪️ висит в разделе «Оружие» на «Посохе и двух шарах». Никто нигде не сказал, что это его посох. Но метка стоит, и стоит стабильно через все редакции. Похоже, что эмодзи здесь работали как невидимая система сносок — способ пометить связь, не тратя на неё слов; и это единственный след замысла, который эта рубрика вообще оставила. Ещё «Многоглазый 👁‍🗨» — имя, которое обещает больше, чем половина расписанных персонажей списка, и не даёт ровным счётом ничего. Пять месяцев его аккуратно переносят из редакции в редакцию, ни разу не тронув. Не знаю, придуман ли он был вообще; по материалу это выглядит как полка, на которую положили два слова и забыли, что она вообще есть.</p></div>", "r": []}];</script>
