<script>const BASE="";const DOCNAME="Оам";

const CH=[{"t": "Зарождение", "a": ["S01", "VS-0008-S01", "VS-0008--zarozhdenie"], "h": "<p>Вселенная объявлена 2025-10-20 (окно w0107, id 376201–376423). В карточке базы (<a href=\"VS-0008.html\">Оам</a>) границу первого отрезка ставят два объявления одного дня: id 376203 — новая система сил и название энергии «Оам», и id 376401 с ответом «Да. Мир. Вселенная».</p>\n<p><strong>Сначала было названо вещество.</strong> Утром 2025-10-20 (09:52–10:00, id 376201–376254) Слава просит: «Рандомная названия для энергии», и объясняет зачем — «Позже напишу новую систему сил. Вообще-то уже пишу и мне нужно название для энергии» (376203). Дальше идёт перебор вариантов обоими соавторами: гугу, обезьяна паук, куздра, бляжка, фортепомп, взла, жжа, хда, хжы, хбр, истс, вонь, прай, оми, мэж, шог, баб, скал, ори, фоц, цоч, уам, ояг, оич, фэи, гло, асле, бузга, кузди, маро, гарсо. На «фортепомп» Миколай говорит «это прям ахуенно» (376214), Слава отвечает «Это прям сложно», «Я не запомню», «Нужно такой лёгкое название» (376215–376218). Итог — «Оам» (376249), «Даваай пока оам» (376250); Миколай: «ну норм» (376254).</p>\n<p><strong>В тот же день, 14:29 (id 376399–376403), под это название написан мир.</strong> Одним большим сообщением выложена история появления Оам на Земле, механика поглощения и обуздания и первый список мутантов — апостолы, Аскизы, Дети мирового древа, Азуриэль, Поротай, вампиры. Заканчивается свод репликой «Пока что так» (376403). Содержание этого сообщения разобрано ниже, в разделах «Масштаб», «Население и классы» и «Система способностей».</p>\n<p><strong>Статус материала назван сразу.</strong> Миколай: «это сейчас тв написал?» (376405). Слава: «Да» (376406), «Мир» (376407), «Вселенная» (376409). Это и есть объявление, которое в таблице отрезков записано как 376401 «Да. Мир. Вселенная».</p>\n<p>Тогда же, 14:34–14:40, добавлены вещи и рамка сюжета:</p>\n<ul>\n<li>Чёрные озёра — «Чёрная озера, что превращает людей в монстров стоит им туда нырнуть. Это места куда упала один из метеоритов» (376413);</li>\n<li>Артефакты — «предметы созданный из материалов, который находились близко к метеоритом, либо из осколков самого метеорита» (376414);</li>\n<li>Камень желания — «пропитанное большим количеством оам кристаллы. Что при разрушение способны попадать в живой организм делая его сильнее быстрее и д. т. Но медленно превращая его в камень желания» (376416);</li>\n<li>время и место действия — «История будет происходит в современном мире, где давно забыли о существовании Оам. Лишь некоторый люди знают о нём и исследуют» (376417).</li>\n</ul>\n<p><strong>Сайт-справочник заводится в тот же час.</strong> Миколай: «если че я могу прямо сейчас с этим сайт сделать» (376408), Слава: «Давай» (376411); в 15:03 выложена ссылка на codepen (376423). Слава сразу проверяет полноту: «А апостолы где, всё есть даже вампиры, а апостолов нету» (376432), «Ну всё остальное отлично» (376433). В базе этому соответствуют служебные записи Сайт-вики по вселенной (codepen) <em>(статьи ещё нет — <a href=\"kb/SL-0113-sayt-viki-po-vselennoy-codepen.html\">исходник</a>)</em> «Сайт-вики по вселенной (codepen)» (с 2025-10-20), Сайт с историей и ассистентом <em>(статьи ещё нет — <a href=\"kb/SL-0115-sayt-s-istoriey-i-assistentom.html\">исходник</a>)</em> «Сайт с историей и ассистентом» (2025-10-22), Документ по материалу на codepen <em>(статьи ещё нет — <a href=\"kb/SL-0126-dokument-po-materialu-na-codepen.html\">исходник</a>)</em> «Документ по материалу на codepen» (2025-12-07).</p>\n<p><strong>Словом «вселенная Оам» материал назван через два дня:</strong> 2025-10-22 (id 377627) — «Ну только в вселенной Оам».</p>\n<h3>Из чего выросла</h3>\n<p>Названы четыре внешние точки опоры, все — прямо в переписке:</p>\n<ul>\n<li><strong>Семь островов.</strong> Оттуда перенесены как минимум два персонажа. 2025-11-17 (id 385774–385779): «Кстати нуар один из котов», «Помнишь нуара. Сильнеший из 7 островов», и здесь же — «Ну здесь он будет влиять на мир подобно волнами». 2025-12-06 про Графа (393298): «2 это апостол Граф (опять отсылка на семь островов)»; про Нуара там же — «Как и в семи островав, так и здесь я не смог придумать ему характер. Поможешь?» (393297).</li>\n<li><strong>Вселенная правителя.</strong> Оттуда перенесены «сестра» и её группировка (2025-12-06, id 393313): «В вселенной правителя её целью было объединить миры и вызвать Апокалипсис.»</li>\n<li><strong>Другая вселенная с апостолами</strong>, без имени. 2025-10-22 (377625): «Изменения они всё такие же как и в другой вселенной». Как эта вселенная называется, в переписке не сказано.</li>\n<li><strong>Благословенная.</strong> Названа только в закрытии 2026-04-19 (462201) в одном ряду с Семью островами и Оэм как вселенная с той же проблемой. Других упоминаний её отношений с Оам в переписке нет.</li>\n</ul>\n<p>Что было системой сил до Оам — в переписке не сказано; сказано только, что Оам пишется как «новая система сил» (376203).</p>\n<h3>Отрезки жизни, как они объявлены в карточке</h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>С</th>\n<th>По</th>\n<th>По какому объявлению</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-10-20</td>\n<td>2025-11-01</td>\n<td>объявление 376203 (новая система сил, энергия названа «Оам») и 376401 «Да. Мир. Вселенная»; 2025-10-22 (377627) вселенная прямо называется Оам</td>\n</tr>\n<tr>\n<td>2025-11-16</td>\n<td>2025-11-18</td>\n<td>возврат 385707 — Слава возвращается к вселенной Оам, выкладывает иерархию рас и организаций</td>\n</tr>\n<tr>\n<td>2025-12-06</td>\n<td>2026-02-06</td>\n<td>объявление 393287 — развёрнут состав вселенной «Оэм» (то же написание, что Оам); закрытие этой линии оформлено только 2026-04-19 (462202)</td>\n</tr>\n</tbody>\n</table></div>\n<p>Границы поставлены по объявлению в чате плюс дате, а не по содержанию; отрезки могут быть несмежными. Почему первый отрезок кончается 2025-11-01, а второй 2025-11-18, в карточке не объяснено — объявлений о паузе там нет.</p>\n<h3>Названия и рабочие обозначения</h3>\n<ul>\n<li><strong>Оам</strong> — сначала название энергии и частиц, затем название самой вселенной (карточка <a href=\"MR-0164.html\">Оам</a> «Оам», 12 версий, с 2025-10-20).</li>\n<li><strong>Оэм</strong> — то же самое написанием через «э», с 2025-12-06: «В нашем мире Оэм уже существует много сторон для конфликта» (393290), «какая у неё цель в мире Оэм» (393313), «они будут состоять из Оэм», «объём и контроль Оэм» (393315), «Оэм пока отложим» (462202). Отдельного объявления о переименовании в переписке нет — написание просто меняется. В базе заведены обе карточки: <a href=\"MR-0164.html\">Оам</a> «Оам» и <a href=\"MR-0182.html\">Оэм</a> «Оэм» (4 версии, с 2025-12-06). Слава чаще пишет «Оэм», Миколай и нейросеть — «Оам».</li>\n<li><strong>Мир Оам</strong> — отдельная карточка <a href=\"MR-0165.html\">Мир Оам</a> (2 версии, с 2025-10-20). Чем «Мир Оам» отличается от «Оам», в переписке не сказано.</li>\n<li><strong>«система сил» / «система силы Оам»</strong> — рабочее обозначение самой механики (376203; 385707).</li>\n<li><strong>«мой обзор мира» / «о преставления о мире»</strong> — так Слава называет свой сводный текст по миру (393483).</li>\n<li><strong>«документ»</strong> — рабочее обозначение свода по вселенной; 2025-11-17 22:20 Миколай: «бля, документ, точно» (386175), «когда-то я продолжу его делать» (386177). О каком документе речь, там не расшифровано.</li>\n<li><strong>«насекомые»</strong> — прозвище апостолов: «(Насекомые я назвал их по приколу)» (377643).</li>\n<li><strong>Амофцы</strong> — рабочее название носителей силы (см. «Население и классы»).</li>\n<li><strong>Имита</strong> — сокращение имени дочери Имитатора: «Сестра, ну теперь дочь имитатора (Имита)» (393313).</li>\n<li><strong>«тёмная изнанка»</strong> — то, существование чего «раскроется в современном мире» из-за апостолов, «но это будет в будущем в будущем» (385768 / 393287); карточка <a href=\"MR-0168.html\">Тёмная изнанка</a>.</li>\n</ul>\n<p>Написания, которые в чате гуляют: «Проротой каменный челике» (385768/393287) при карточке <a href=\"MR-0169.html\">Пророки каменные</a> «Пророки каменные» и отдельном персонаже <a href=\"PS-0036.html\">Поротай</a> «Поротай»; «Пераги» рядом с Серафимом; «грех Череугодия» (393313); «верологий» — «Матка Аскизов стало предметом веры для какой-то верологий». Соотношение «Проротой каменный челике» / «Пророки каменные» / «Поротай» в переписке не проговорено.</p>\n<h3>Расхождения в самой карточке</h3>\n<p>В шапке <a href=\"VS-0008.html\">Оам</a> заявлено «отрезков_объявлено: 6», а в таблице отрезков их три; нижняя дата шапки (2024-01-30) не совпадает ни с одним отрезком и приходит от старых сущностей, попавших во вселенную позже (способность «Артефакты» <a href=\"SP-0047.html\">Артефакты</a> — с 2024-01-30, «Имитатор» <a href=\"PS-0383.html\">Имитатор</a> — с 2024-05-07, «Защитник» <a href=\"IS-0017.html\">Защитник</a> — с 2024-07-04, «Нуар» <a href=\"PS-0104.html\">Нуар</a> — с 2024-07-03, «Поротай» <a href=\"PS-0036.html\">Поротай</a> — с 2024-04-02). В самой карточке это не поясняется. Промежуток 2026-02-06 — 2026-04-19 таблицей отрезков не покрыт, хотя закрытие оформлено 2026-04-19.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · С чего начать — не материал авторов</b>\n<p>Служебные <code>SL-0113</code>, <code>SL-0115</code>, <code>SL-0126</code>, <code>SL-0125</code> статей не имеют, но материал под ними есть — это работа на месте, без архива.</p></div>", "r": [["Сайт-вики по вселенной (codepen)", "kb/SL-0113-sayt-viki-po-vselennoy-codepen.html"], ["Сайт с историей и ассистентом", "kb/SL-0115-sayt-s-istoriey-i-assistentom.html"], ["Документ по материалу на codepen", "kb/SL-0126-dokument-po-materialu-na-codepen.html"], ["Поротай", "PS-0036.html"], ["Имитатор", "PS-0383.html"], ["Нуар", "PS-0104.html"], ["Артефакты", "SP-0047.html"], ["Оам", "MR-0164.html"], ["Оэм", "MR-0182.html"], ["Мир Оам", "MR-0165.html"], ["Тёмная изнанка", "MR-0168.html"], ["Пророки каменные", "MR-0169.html"], ["Защитник", "IS-0017.html"]]}, {"t": "Масштаб", "a": ["S02", "VS-0008-S02", "VS-0008--masshtab"], "h": "<p>Действие происходит на Земле: «На землю приземлились метеориты» (376401). Отдельных планет, измерений или параллельных миров внутри Оам в переписке не названо. Прямого счёта миров нет: сколько миров во вселенной Оам, в переписке не сказано. В базе к Оам привязано 14 записей вида «мир», но это расы, организации, места, сама субстанция и сеттинг внутри одной вселенной, а не отдельные пространства.</p>\n<h3>Время и события до современности</h3>\n<ul>\n<li>Метеориты падают «Когда то давным давно во времена, когда были ещё племена по всему миру, а не государство» (376401).</li>\n<li>«Неизвестный частицы заполонили весь мир. Весь воздух был пропитан ими, и всё живое, что вдыхала это быстро утухала. Лёгкие заполнялось Оам и медленно разрывались на куски. Люди гибли, также как и животные. Лишь некоторый были способны прожить хотябы 30 лет, а после умерали. И поколения сменяла поколения. Пока у людей не возник иммунитет во время эволюции и адаптации, как и у других животных.»</li>\n<li>«Позже частицы вылетевший из небесных тел и погубивший миллиарды жизни назвали Оам.»</li>\n<li>«Люди пережив кризисный момент в истории. Заинтересовались откуда появилась проклятия бога. И начали исследовать территорию. И на местах приземления метеоритов, откуда появились Оам окружающая среда и жирность мутировали под активным воздействием Оам. Оказавшись там люди, вдохнув или испив насыщенной Оам жидкость или воздух. Умирали, как их давний предки. Но с исключением некоторый люди выживали и могли творить чудо. По их словам они начали чувствовать внутреннюю энергию.»</li>\n<li>Насыщены Оам воздух и некоторые водоёмы.</li>\n</ul>\n<h3>Современность</h3>\n<p>«История будет происходит в современном мире, где давно забыли о существовании Оам. Лишь некоторый люди знают о нём и исследуют» (376417, 2025-10-20 14:40).</p>\n<p>Из-за апостолов «по итогу в современном мире раскроется существования тёмный изнанки но это будет в будущем в будущем» (385768; повтор 393287). Что такое тёмная изнанка, кроме этого, не сказано (карточка <a href=\"MR-0168.html\">Тёмная изнанка</a>, 2 версии).</p>\n<h3>Места, названные поимённо</h3>\n<ul>\n<li><strong>Чёрные озёра</strong> (<a href=\"MN-0022.html\">Чёрные озёра</a>, с 2025-10-20) — место падения одного из метеоритов, превращают нырнувшего в монстра.</li>\n<li><strong>Местность, мутировавшая от Оам</strong>, — где живут Дети мирового древа: «Живут в мести которой мутировала от Оам» (385768; повтор 393287).</li>\n<li><strong>Церковь</strong>, в которой находится матка Аскизов (393465, 2025-12-06).</li>\n</ul>\n<p>Карт, континентов, государств, городов в материалах Оам не описано. Где живут Аскизы — «Ну и Аскизы. Я не знаю где они живут» (385769; повтор 393288).</p>\n<h3>Перемещение между мирами</h3>\n<p>В материалах вселенной Оам перемещения между мирами не описано: ни порталов, ни переходов, ни границ. Множественное «миры» встречается дважды, оба раза не про Оам: о дочери Имитатора — «В вселенной правителя её целью было объединить миры и вызвать Апокалипсис» (393313), и о соседней вселенной — «Оказывается вселенная семь островов это вселенная в которой два мира столкнулись» (429363, 2026-02-06).</p>\n<h3>Место Оам среди других вселенных соавторов</h3>\n<p>2025-12-09 (id 394734, 15:31) Слава считает вселенные: «Как назвать вторую Вселенную. Первая Оам. Ещё есть семь островов И правитель А эту как назвать?»; Миколай — «та к и назовём» (394736).</p>\n<p>Тогда же, 2025-12-09 (id 394757), Оам характеризуется на фоне новой вселенной: «Вообще это Вселенная появилась лишь потому что я пытался тот образ гг сделать в настоящим. А после она просто стало лёгкая вселенная. То есть сверх силы там слабее. И в теории даже обычные человек способен победить сверхчеловека. Из-за легче развивать отношения людей. Просто в Оам все чё-то слишком сильный. Да и Оам Вселенная большая как боевик».</p>\n<h3>Документ по вселенной</h3>\n<p>2026-02-06 (окно w0115, id 429348–429387) Миколай собирает документ по Оэм и кидает материал в нейросеть: «Можешь туда Оэм закинуть?» (429348), «я оэм делаю всё-таки сейчас» (429358), «нейронке это подкинуть?» (429359). Слава: «Не я в Нейра кит скидываю первую вселенную» (429361), «Ну сначала старое а потом новое» (429370). Итог первой попытки: ссылка на codepen (429381, 12:37), реакция Славы — «Че то мало информация оказывается о ОЭМ» (429386), Миколай — «ой, ч не все чет кинул видимо» (429387).</p>\n<p>2026-02-07 (id 429806–429816) документ доделан: «бля, было не оч удобно ибо много материала, ну я знал что так будет», «я еще пару раз лоханулся и не скинул всё прям», «тут уже про сам мир есть», «и дополнительное», «норм?»; Слава: «Ну нор» / «М». Содержание документа осталось за ссылками на codepen и в чат не попало.</p>", "r": [["Тёмная изнанка", "MR-0168.html"], ["Чёрные озёра", "MN-0022.html"]]}, {"t": "Организации и сообщества", "a": ["S03", "VS-0008-S03", "VS-0008--organizacii-i-soobschestva"], "h": "<p>Общий перечень организаций выложен одним сообщением дважды: 2025-11-17 09:51 (id 385768, окно w0109) и дословным повтором 2025-12-06 17:36 (id 393287, окно w0112). Порядок в самом сообщении — по силе: сначала коты, потом апостолы, потом фраза, которая задаёт всю остальную структуру: «Ну и дальше расы и организации который равны по силе с друг другом».</p>\n<h3>Правительственная организация по контролю (<a href=\"MR-0171.html\">Правительственная организация по контролю</a>)</h3>\n<p>«Правителская организации по контролю всех этих. Сильнейшая там девченка что может изменять мир волнами.» Имени у девушки в переписке нет.</p>\n<p>Дополнение 2025-12-06: «Это босс будет хитрым и уверенным. Хотя обычные человек. Попытается наладить связь с Имитам» (393479, 21:55) и «Так как для правительства. Представитель Апостоловы именно Имит» (393480, 21:56). Реплика про босса лежит в файле правительственной организации, но чей это босс, в приведённом куске прямо не названо; в записи о группировке дочери та же реплика читается как про её босса.</p>\n<h3>Преступная организация каменных (<a href=\"MR-0169.html\">Пророки каменные</a> «Пророки каменные»)</h3>\n<p>«Проротой каменный челике. Владеют преступное организацию. Некий союз с апостолами.» В чём состоит союз и что это за организация — не расписано.</p>\n<h3>Группировка сестры / дочери Имитатора (<a href=\"MR-0170.html\">Группировка сестры</a>)</h3>\n<p>«Группировка сестры ( который теперь будет дочерью Имитатора. И я не знаю какие у неё будет цель).» Перенесена из «Вселенной правителя» вместе с самой сестрой (см. ниже). 2025-12-06 (393313): «У неё даже есть своя группа злодеев. Ну теперь я не знаю какая у неё цель в мире Оэм.»</p>\n<p><strong>Босс группировки</strong> (<a href=\"PS-0325.html\">Босс группировки дочери</a>, 2025-12-06, id 393462, 393479): «у неё будет босс ( обычный человек но с глубоким убеждением)», «Это босс будет хитрым и уверенным. Хотя обычные человек. Попытается наладить связь с Имитам» — именно потому, что Имит представитель апостолов для правительства. Имени у босса нет.</p>\n<h3>Церковь с паладинами (<a href=\"MR-0172.html\">Церковь с паладинами</a>)</h3>\n<p>«Церковь с паладинами ( мёртвыми рыцарями которых оживил один челик, для верующих) паладины до хрена сильный но их ней движения предсказуемый. Они больше как роботы с повторяющими движениями.»</p>\n<p>2025-12-06 добавлено: «Матка. Находиться в церкви. И люди им поклоняются, а детей маток считают святыми» (393465). Церковь отнесена к промежуточным злодеям: «Ну или церкви, да и люди иногда» (393306).</p>\n<h3>Организация Виктора (<a href=\"MR-0173.html\">Организация Виктора</a>)</h3>\n<p>«Организация челика который и оживил паладинов. Давай челика назовём Виктор. Ну и Виктор верит в красный ток что оживляет людей. И он многих оживил, но разум так и не смог в них оживить.» Имя Виктор придумано прямо здесь, 2025-11-17. Организация отдельная от церкви; её состав и цели не описаны. Сам Виктор назван среди промежуточных злодеев: «Да еще и Виктор, что воскрешает трупы, ну точнее делает из них марионеток» (393308).</p>\n<h3>Орден по убийству котов (<a href=\"MR-0175.html\">Орден по убийству котов</a>)</h3>\n<p>«Так же появиться орден предназначеный для убийства котов.» Одна строка, оба раза (2025-11-17 и 2025-12-06), без подробностей.</p>\n<h3>Пернатые (<a href=\"MR-0174.html\">Пернатые</a>)</h3>\n<p>«Пернатые (Серафим, Пераги и кто-нибуть ещё).» 2025-12-06 «клан крылатых ( Серафим)» отнесён к промежуточным злодеям (393305). Третий участник не придуман.</p>\n<h3>Верология вокруг матки Аскизов</h3>\n<p>«Аскизы. Матка Аскизов стало предметом веры для какой-то верологий.» Название «верологии» не дано.</p>\n<h3>Банда Графа</h3>\n<p>2025-12-06 (393298): «У него своя банда ( просто для развлечения) грубо говоря он король преступного мира».</p>\n<h3>Палачи — государственные убийцы (<a href=\"PS-0304.html\">Палачи</a>)</h3>\n<p>2025-11-05 (id 382099): «Палачи государственный убийцы. Личность которых засекречена. Они всегда ходят в масках на задание. У них всегда одна и таже цель ликвидации. Если они появятся не кто не выживает. Их вырастили именно для убийства. И они были обучены стилю боя как у Палача ( апостола, который сильнейший в ближнем бою), но опять же это лишь имитация стиля Палача. Также было проведена попытка обучения особого усиления Имитатора, но из-за большой смертности от неё отказались.» Какое государство или организация их растит — не сказано.</p>\n<h3>Организация, на которую апостолы устроили охоту</h3>\n<p>Названа только по действиям, 2025-10-22 (377625): «та организации убила семью одного из апостолов и разгромила детский приют другого апостола. Всё остальные апостолы начали их истреблять. Даже тех кто просто приходил помолиться в церковь этой организации». Имени организации в переписке нет.</p>\n<h3>Вампиры</h3>\n<p>«Вампиры просто аристократы.» Одна строка; развития в этих окнах нет.</p>\n<h3>Стороны конфликта (2025-12-06, id 393287–393316)</h3>\n<ul>\n<li>Постановка: «В нашем мире Оэм уже существует много сторон для конфликта» (393290), «Ну нам нужный главные злодей» (393291), «Во первых сначала с добрых» (393292).</li>\n<li><strong>Добро — апостолы</strong> (393293): «Вообще апостолы на стороне добра. Ну будут устраивать геноциды и теракты. Плюсом они высокомерны, хотя прямо этого не показывать. Ну они как бы с рождения лучшей людей, поэтому в полне ясно почему они высокомерные. Ну кроме бессмертного ( у него как бы не все в порядке с мозгами если ты помнишь)». И следом (393294): «И вот добрики и другие добряки есть. Но апостолы все же главные».</li>\n<li><strong>Три сильнейших</strong> (393295–393300): «Прежде чем разбирать злодеев. Давай сначала проясним сильнейших».\n  1. «1 это нуар из котов, он один из сильнейших. Вообще грубо говоря будет 3 сильнейших. И вот нуар один из них. Как и в семи островав, так и здесь я не смог придумать ему характер. Поможешь?» (393297)\n  2. «2 это апостол Граф (опять отсылка на семь островов). Он высокомерный и беспечный апостол, что веселиться. У него своя банда ( просто для развлечения) грубо говоря он король преступного мира. Его способность власть. Контроль всего, что есть в определенном радиусе. Достаточно силён, чтобы разнести гору, плюсом он быстрейший апостол ( хотя этот титул носит другой Апостол. Ну по факту он быстрее)» (393298). Кто носит титул быстрейшего апостола, не названо. Там же (393299): «И также в будущем у него появиться девушка для стабилизации его нарцисцеческого характера».\n  3. «3 и на стороне людей девушка. Опять же я ее не продумал. Помнишь фантазера с волнами. Вот её способность. По сути она одна из немногих, что может изменять законы мира.» (393300)</li>\n<li><strong>Промежуточные злодеи</strong> (393305–393308): «Дети мирового древа. И клан крылатых ( Серафим)», «Ну или церкви, да и люди иногда», «Да еще и Виктор, что воскрешает трупы, ну точнее делает из них марионеток».</li>\n<li><strong>Два основных злодея</strong> (393309–393314). Миколай угадывает — «котов?», «червивоглазых?» — оба варианта не подтверждены. Слава называет: <strong>дочь Имитатора (Имита)</strong> и <strong>Бог красок</strong>.</li>\n<li>Итог сессии — открытый список задач (393316): «Так мне нужна цель и мотивация двух сильнейших за мир. И цель и мотивация двух сильнейших злодеев». Миколай: «ну, я прочёл всё» (393317), позже — «ну пока идей нет». Под это заведена служебная запись Список нерешённых вопросов по миру Оэм <em>(статьи ещё нет — <a href=\"kb/SL-0125-spisok-nereshennyh-voprosov-po-miru-oem.html\">исходник</a>)</em> «Список нерешённых вопросов по миру Оэм» (2 версии, с 2025-12-06).</li>\n</ul>\n<h3>Перенос сестры в Оэм (2025-12-06, id 393308–393316)</h3>\n<p>Дословно (393313): «Сестра, ну теперь дочь имитатора (Имита). В вселенной правителя её целью было объединить миры и вызвать Апокалипсис. У неё даже есть своя группа злодеев. Ну теперь я не знаю какая у неё цель в мире Оэм. Не забывая она также грех Череугодия ( то бишь голодная для знания) как её отец ( имитатора).»</p>\n<p>Содержание переноса: персонаж «сестра» и её группировка приходят из «Вселенной правителя», она становится дочерью Имитатора, прежняя цель отменена, новая не придумана. Грех, который она наследует от отца, назван «грех Череугодия ( то бишь голодная для знания)».</p>\n<p>Второй злодей той же сессии (393314): «Второй появиться только не давно. Человек ( Бог красок) лишь образ. Он будет злодеем ну каким я не знаю». Уточнение того же вечера (393464, 21:43): «Он человек и он реальный. Образ я продузумивал что я пока виду его пока как образ».</p>\n<h3>Соотношения между организациями, названные прямо</h3>\n<ul>\n<li>Каменные (Проротой) — «Некий союз с апостолами»; владеют преступной организацией.</li>\n<li>Правительственная организация контролирует «всех этих»; связь с апостолами идёт через Имита как их представителя.</li>\n<li>Церковь с паладинами и организация Виктора — разные структуры; паладины оживлены Виктором «для верующих».</li>\n<li>В церкви находится матка Аскизов, ей поклоняются, детей матки считают святыми.</li>\n<li>Орден появится специально для убийства девяти котов.</li>\n<li>Босс группировки дочери попытается наладить связь с Имитом.</li>\n<li>Апостолы истребляют неназванную религиозную организацию и её прихожан.</li>\n<li>Из-за апостолов раскроется существование тёмной изнанки.</li>\n</ul>\n<h3>Материал, чья принадлежность к Оам в переписке не установлена</h3>\n<p>В базе есть более поздний слой (2026-06-02 — 2026-06-07, окна w0120–w0121) с ассоциацией героев, шестью столпами героев и злодеев, сектой Фалим и Нимбом; вселенная там не названа и в базе помечена как «неясно». В этом слое апостолы переопределены как проект Нимба («12 созданных ИС»), Граф и Нуар входят в шесть столпов героев, Палач назван цепным псом ассоциации. К вселенной Оам этот материал в переписке не привязан, и здесь он не сшивается с изложенным выше.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Третьим слоем идут организации: <code>MR-0171</code> «Правительственная организация по контролю» (четыре ссылки, 9 375), <code>MR-0169</code> «Пророки каменные» (четыре, 8 328), <code>MR-0174</code> «Пернатые» (четыре, 8 846), <code>PS-0308</code> «Виктор» (четыре, 9 225). У каждой по четыре ссылки и по одной-две строки описания в чате: «Некий союз с апостолами», «Серафим, Пераги и кто-нибуть ещё», «Вампиры просто аристократы». Материал в базе есть, но он весь — повтор одного и того же перечня, выложенного дважды.</p></div>", "r": [["Список нерешённых вопросов по миру Оэм", "kb/SL-0125-spisok-nereshennyh-voprosov-po-miru-oem.html"], ["Босс группировки дочери", "PS-0325.html"], ["Палачи", "PS-0304.html"], ["Правительственная организация по контролю", "MR-0171.html"], ["Пророки каменные", "MR-0169.html"], ["Группировка сестры", "MR-0170.html"], ["Церковь с паладинами", "MR-0172.html"], ["Организация Виктора", "MR-0173.html"], ["Орден по убийству котов", "MR-0175.html"], ["Пернатые", "MR-0174.html"]]}, {"t": "Население и классы", "a": ["S04", "VS-0008-S04", "VS-0008--naselenie-i-klassy"], "h": "<h3>Как во вселенной вообще берутся расы</h3>\n<p>Из свода 2025-10-20 (376401): «Также есть мутанты это животное и люди, у которых под воздействием Оам изменилось их физиология. А также есть некоторый окружающей среды что под воздействием Оам обрели какой-либо воздействия на живых существ.» Общее правило сформулировано 2025-10-22 (377634): «Все монстры это мутированный под воздействием Оам».</p>\n<p>Про два народа отдельно сказано, что они не пришлые (2025-09-17, id 366193): «Да апостолы и Азуриэль появились на земле естественным путем».</p>\n<p>Носителей силы называют <strong>амофцами</strong> — вопрос поставлен 2025-11-05 (id 382099–382222): «Как вообще называть существ что могут пользоваться Оам?» Первый вариант Славы — «Оамовцы». Миколай предлагает «туманности» (382103), Слава отклоняет: «Они же не как не связаны с туманнам» (382105). Дальше Слава: «Амов», «Амифцы», «Амифиц» (382117–382119). Миколай через 6,5 часа: «амофцы», «мне это больше нравится», «а писать амовцы», «а так читать» (382211–382214). Слава: «Ну звучит как какой-то спецназ» (382215). Миколай предлагает ещё «суспензы? нуары? тросы?» (382218), Слава — «Не» (382220), Миколай — «если че и это норм врд», Слава — «Ну давай пока это» (382222). Финальное написание не зафиксировано (карточка <a href=\"MR-0167.html\">Амофцы</a> «Амофцы», 2 версии, с 2025-11-05).</p>\n<h3>Апостолы</h3>\n<p>Самая проработанная раса вселенной. Собственной карточки в разделе персонажей у неё нет — описание рассыпано по сводным сообщениям и по производным записям <a href=\"PS-0303.html\">Жизненный цикл апостолов</a> «Жизненный цикл апостолов», <a href=\"PS-0326.html\">Бессмертный апостол</a> «Бессмертный апостол», <a href=\"PS-0304.html\">Палачи</a> «Палачи».</p>\n<p><strong>Версия свода 2025-10-20 (376401–376402):</strong> «Апостолы- это люди, у которых в утробе матери мутировало нервную систему мозг и глаза. Из-за этого их ней пять чувств, работоспособность мозга, реакция, точность выше чем у обычного человека в несколько раз. Обуздать Оам они могут без поглощения огромного количества Оам. Им достаточно пережить одну эмоциональную ситуацию, и они неосознанно воспользуются Оам. И дальше они могут пользоваться им без проблем. Также они могут использовать белый глаза направив туда Оам.» Итог: «Как ясно они у них лучший контроль Оам.»</p>\n<p><strong>Версия 2025-10-22 (377625), помеченная «Ну только в вселенной Оам» (377627):</strong></p>\n<ul>\n<li>«Апостол в данной вселенной это опять группа лиц из 21 человека телепатически связанный друг с другом. Но это не люди, это насекомые.»</li>\n<li>«Всё двадцать один апостол вылезли из разных коконов. И по своё природе не являются людьми. Хоть и очень на них похоже.»</li>\n<li>«Изменения они всё такие же как и в другой вселенной. Только теперь у них замедленная старения ( точнее они словно замерзают в каком-то возрасте( в рандомные возраст ).»</li>\n<li>«И они как арбетары. Если сжечь лес он будет гореть не переставая. То есть их ний силы постоянные ( конечно с некоторыми условностями) но они могут сами вырубить огонь.»</li>\n<li>«Здесь апостолы дорожат друг другом больше всех. Как раз таки из-за того что та организации убила семью одного из апостолов и разгромила детский приют другого апостола.»</li>\n<li>Оговорка про слово (377643): «Насекомые это апостолы который выглядит как люди. (Насекомые я назвал их по приколу)».</li>\n<li>Происхождение (377631, 377633): «21 от неизвестного мутировшего существо», «Так вот это существо мутировал из-за воздействием Оам». Вариант Миколая — «это существо умерло» / «и 21 насекомые съели его труп» — отвергнут: «Нет» (377641).</li>\n</ul>\n<p>Прямого выбора между формулировками «проста люди у которых мутировала … нервная связь и мозг» (377623), «Но это не люди, это насекомые» (377625) и «выглядит как люди» (377643) автор не делает. 2025-12-06 он ссылается на насекомую версию как на принятую: «Я ведь изменил их и сделал насекомыми» (393485).</p>\n<p><strong>Жизненный цикл</strong> (<a href=\"PS-0303.html\">Жизненный цикл апостолов</a>, 1 версия, 2025-10-22, id 377626): «Они вылупились из кокона, а потом росли с нормальной скоростью. И в рандомные момент для них замирает время. Кто их родитель я так и не придумал. Какой следующий этап в их ней жизненном цикле будет я не знаю.»</p>\n<p><strong>Место в иерархии</strong> (385768; повтор 393287): «Апостолы 21 вторая по силе раса на земле (опять раса, в мире есть просто индивиды который могут быть сильными). Апостолы очень часто устраивают без порядок разрушая укорененый баланс между всеми.»</p>\n<p><strong>Характер расы</strong> (393293): на стороне добра, при этом «будут устраивать геноциды и теракты», высокомерны, «Ну кроме бессмертного».</p>\n<p><strong>Бессмертный апостол</strong> (<a href=\"PS-0326.html\">Бессмертный апостол</a>, 1 версия, 2025-12-06) — единственное, что о нём сказано в этих окнах: у него «не все в порядке с мозгами если ты помнишь». Оговорка «если ты помнишь» указывает, что персонаж придуман раньше; подробностей в окне нет.</p>\n<p><strong>Поимённо</strong> в объявлениях вселенной звучат только Граф и бессмертный. Отдельно отмечается расхождение: служебная карточка Список 12 апостолов <em>(статьи ещё нет — <a href=\"kb/SL-0054-spisok-12-apostolov.html\">исходник</a>)</em> названа «Список 12 апостолов», тогда как во всех объявлениях вселенной апостолов 21. В переписке это расхождение не обсуждается.</p>\n<p><strong>Требование к боеспособности</strong> (377617): «Просто если у них развита только мозг и нервная связь. Они не смогут в моей голове сражаться полноценная. ( эффект адаптации повышенный у них должен быть)». Уточнение приходит в конце окна: Миколай — «че значит в своей голове сражаться» (377645), Слава — «В моей» (377646). Механика самого эффекта адаптации не описана (карточка <a href=\"SP-0245.html\">Эффект адаптации</a>, 2 версии, с 2025-10-22).</p>\n<h3>Коты</h3>\n<p>Верхушка мира. 2025-11-17 (385768; повтор 393287): «Коты. Их 9.они сильнеший ( уникальный особенности, я для них не придумал помоги) и вот они есть в каждую эпоху. Если один кот умрёт родиться новый и всегда их будет 9. Они вообще никуда не вмешиваться».</p>\n<p>Природа додумана 2025-12-04 (392486, 392489): «Коты наверное буду типо духами. Будут чисто из Оэм состоять» — «Поэтому запас и понимания Оэм у них больше всех». Повтор 2025-12-06 (393315): «Кстати коты будут типо, что-то духов. То бишь они будут состоять из Оэм. Из-за этого понимания, объём и контроль Оэм у них выше чем у любого.»</p>\n<p>Персональная привязка (385774–385779): «Кстати нуар один из котов», «Помнишь нуара. Сильнеший из 7 островов», Миколай — «да да», Слава — «Ну здесь он будет влиять на мир подобно волнами». Против котов заведён орден (см. «Организации»).</p>\n<p>Уникальные особенности котов не придуманы ни в одном окне; просьба «помоги» звучит дважды и остаётся без ответа. 2025-12-17 (399583) «Роль Котов во всей этой фигней» стоит в списке задач.</p>\n<h3>Азуриэль (<a href=\"MR-0129.html\">Азуриэль</a>)</h3>\n<p>Заведён 2025-03-26 (окно w0086, id 311282–311288) по картинке, сначала без имени: «Боже, какой он симпапусечный», «Какой он красивый». Описание (311285): «Гуманоид человеческого роста синий кожей( не точно может розовый) с острыми ушами как у эльфа. Также на лице красивый узоры разного цвета. Одежда зимняя. Сам он гибкий». Имя дано отдельной репликой — «Азуриэль» (311287), и описание повторено с дополнением: узоры «могут меняться в зависимости от эмоций» (311288).</p>\n<p>Тогда же Миколай просит расширить представление (311413–311418): «ты чет ещё о нем скажешь», «я все равно не понимаю что это за существо чтобы давать способности», «а то скажу что он ртутью управляет, а ты скажешь, вообще-то очевидно льдом или деревом». Слава: «Эмпатия я хотел на этом остановиться. Просто хотел чтобы ты возможно подкинул какую нибудь идею» (311417). На вопрос, думать ли «стихии вещества и другое», отвечает: «Нет идти ты в жопу. Там не будет не какой концепций силы( энергий) там будут другое» (311425) и «Я просто всегда слишком сильно стараюсь развить эту энергию и забиваю на всё остальные» (311428).</p>\n<p>В своде 2025-10-20 (376401) Азуриэль описан уже как народ: «Это было группа лиц, чей дети мутировали полностью превратившись Азуриэль. Они с рождения могут использовать Оам и скорость поглощения и выделения Оам у них выше чем у кого либо.» Там же повторены внешность, эмпатия, «Прекрасно ощущать намерения», нейро-сканер и потеря концентрации в толпе.</p>\n<p>Отношение к другим расам (2025-09-17, id 366175): «Ты ведь понимаешь что для апостолов у которых главная силы сверх чувства и восприятия ( то есть самое главное нервная система и мозг) то есть Азуриэль является природным охотником Апостолов. При этом против Поротой они не так эффективны». Тут же: «Но апостолы сильнее поротоя» (366177). Миколай переспрашивает только про слово: «природным?» (366178).</p>\n<p>Положение в обществе (385768; повтор 393287): «Азуриэль. Как народ что прячется от цивилизации. Но некоторый всё же живут среди людей».</p>\n<p>В базе отмечено, что в разных окнах он описан и как «он», и как «группа лиц, чей дети мутировали»; цвет кожи не зафиксирован — синий или розовый.</p>\n<h3>Дети мирового древа (<a href=\"MR-0161.html\">Дети мирового древа</a>)</h3>\n<p>Заведены 2025-10-02 (окно w0106, id 370600): «Существо порождённым мировым древом». В том же сообщении (370605) перечень обитателей ещё не сформировавшегося мира: «Апостолы с сверхспособностями (насекомые), Каменный Поротой, Азуриэль, Допустим вампиры который могут контролировать кровь, И дети мирового древа». Реакция Миколая через 2,1 часа: «идеи крутые и ура есть мир» (370613).</p>\n<p>Описание в своде 2025-10-20 (376401): «Произошли от мутировшого дерева из-за Большого количества Оам. Это гуманноидный деревянный существо с оранжевой сердцевинной, в котором как раз и хранится Оам. Они могут изменить образ на человеческий. Так как они из дерева мирового древа. Хрен ты их пробьешь, не кто из апостоловы не сможет нормально их ранить, а если ранят они будут регенерировать. Ну и они сверхсильный (сильнейший наверное в физическом плане). Они могут передвигаться в земле и внутри деревьях. Огонь им не вредит. Сам огонь на них тухнет. Ну они могут выпускать корни туда сюда ими драться.»</p>\n<p>Это единственная раса, у которой названо место хранения Оам в теле — оранжевая сердцевина. Место обитания добавлено 2025-11-17; 2025-12-06 отнесены к промежуточным злодеям. Само мировое древо как объект мира отдельно не расписано.</p>\n<h3>Аскизы (<a href=\"PS-0300.html\">Аскизы</a>) и Матка Аскизы (<a href=\"PS-0301.html\">Матка Аскизы</a>)</h3>\n<p>Из свода 2025-10-20 (376401), повтор 2025-11-05 (382108): «Маток Аскизы была просто Аксолотлой. Но после в водоём, где она жила упал метеорит и под огромным воздействием Оам она мутировала и начала производить Оам.»</p>\n<p>Сами аскизы: «Навечно Дети лет 7-10 на вид с белоснежной кожей, с розовыми оттенками ( или другими оттенками) и с чертами аксолотлы. Как они рождаются я ещё не придумал. И вот эти дети не стареют. И у них быстрая регенерация, а также зверский аппетит. Они могут съесть человека целиком за пару минут. У них инстинкт голода выше разума. Они не чувствуют боли. И разумом они всегда как дети.»</p>\n<p>Матка: «Матка, что выделяет их из яиц подобное муравьиной матки. Матка большая ростом 4 местра и в ширину такая же. Она больше похожая на червя с огромными количествами лапок. Но с такой же белоснежное кожей.»</p>\n<p>Социальное положение (385768): «Аскизы. Матка Аскизов стало предметом веры для какой-то верологий», и сразу следом отдельным сообщением (385769): «Ну и Аскизы. Я не знаю где они живут». Обе строки дословно повторены 2025-12-06. Уточнение культа 2025-12-06 (393465): матка находится в церкви, люди ей поклоняются, детей маток считают святыми.</p>\n<h3>Поротай (<a href=\"PS-0036.html\">Поротай</a>)</h3>\n<p>Самая старая расовая запись: придумана 2024-04-02 (id 152575), задолго до вселенной Оам, и потом несколько раз переслана заново — 2024-06-03 (175810), 2025-03-26 (311279), 2025-09-17 (366035, там же цитата Миколая 366192), 2025-10-20 и 2025-11-05 внутри общего свода. Пересылки идут с одной вводной: «Потом ответишь. Придумал один вид Поротай».</p>\n<p>Механика в версии Оам (376401): «Это мутировавший жук если его съесть человек то у него 3 варианта:</p>\n<p>1) смерть, все твои внутренности превращаются в камень и отказывают;\n2) превращаются в низший Поротай (горбатого двух ликого, полукаменного-полуплоти, и ты теряешь личностей и слушаешь высшего Поротая) способности крепкость, реген, сверхсила;\n3) превращается высшего Поротая сохраняешь свой человеческий образ и личность. Способности реген, контроль над низшими, превращать части тела в твердый камень, сверхчеловеческая сила.\nДебафф у тебя появляется вторая личность жестокая, кровожадная, алчная и т.д.»</p>\n<p>Ранняя формулировка того же (2025-09-17, 366192): «Короче есть жуг ты его съедаеш и у тебя 3 варианта». Вероятности исходов не заданы.</p>\n<p>Переписка вокруг вида, 2024-04-02: Слава спрашивает, какую ещё способность добавить высшему Поротаю (152576). Миколай отвечает, что способностей и так много и концепция уже придумана, вопрос ему непонятен (152599). Слава объясняет: «Поротая низший владеет почти идентичными способностями Поротая высшего вот поэтому я думал может ещё че добавить. Концепцию та я придумал ну ты можешь туда что нибудь добавить типо объект или вид или способность или т.д» (152603). Ничего добавлено не было. 2024-06-03 Слава спрашивает: «Помнишь про каменных существ» (175807); Миколай не помнит, Слава пересылает старую карточку.</p>\n<p>Положение в мире (385768; повтор 393287): «Проротой каменный челике. Владеют преступное организацию. Некий союз с апостолами.»</p>\n<h3>Вампиры (<a href=\"PS-0299.html\">Вампиры</a>)</h3>\n<p>Появляются 2025-10-02 одной строкой в перечне обитателей мира: «Допустим вампиры который могут контролировать кровь» (370605).</p>\n<p>Полное описание 2025-10-20 (376401): «Это люди у которых мутировала кровь и пищевая система под воздействием Оам. Из-за этого если они испьют кровь. То способны почуствовать Оам и так по итогу научиться его контролировать. И также выпивая кровь они могут пополнять запасы Оам. Их мутировшая кровь легко контролируемая подобно конечности.»</p>\n<p>Общественное положение — одна строка (385768; повтор 393287): «Вампиры просто аристократы». Больше о них ничего нет.</p>\n<h3>Паладины</h3>\n<p>Не раса и не мутация, а сословие: «мёртвыми рыцарями которых оживил один челик, для верующих», «до хрена сильный но их ней движения предсказуемый. Они больше как роботы с повторяющими движениями» (385768). Разум им вернуть не удалось.</p>\n<h3>Палачи</h3>\n<p>Сословие, определяемое не мутацией, а выращиванием и обучением: обычные люди, натасканные под стиль апостола Палача (см. «Организации и сообщества»).</p>\n<h3>Одержимые / антиапостолы (<a href=\"PS-0296.html\">Антиапостолы / Одержимые</a>) — слой до Оам</h3>\n<p>2025-09-17 (366040): «Ещё добавить одержимых. Ну не одержимых. А сделать антиапостолов. С тёмными глазками. Ну они тоже должны насекомого съесть?» Тут же установка на весь мир (366041): «Как ты понял я хочу более приземленую вселенную без правитель творцов и т. Д. Ну и без чудо способностей». 2025-09-17 (366106–366107): «Че по насекомам есть каменный жук, Белая бабочка ( ну или гусеница), Ну и для одержимых чёрный червь» — «Ну они должны быть слегка особенными». 2025-09-18 (366586), инвентаризация: «Кто у нас как раса есть Поротой Азуриэль Апостолы Одержимый. Ну и монстры который я тебе скинул ну изменённый. Сейчас надо думать о расе ведь монстров можно просто из мифологии взять».</p>\n<p>Вопрос «Ну они тоже должны насекомого съесть?» остался без ответа. В сводах Оам начиная с 2025-10-20 одержимые не перечисляются; объяснения этому в переписке нет.</p>\n<h3>Иерархия сил целиком</h3>\n<p>Порядок задан двумя дословно совпадающими сообщениями — 2025-11-17 (385768) и 2025-12-06 (393287):</p>\n<ol>\n<li><strong>Коты</strong> — девять, сильнейшие, есть в каждую эпоху, число не меняется, ни во что не вмешиваются.</li>\n<li><strong>Апостолы, 21</strong> — «вторая по силе раса на земле», с оговоркой «(опять раса, в мире есть просто индивиды который могут быть сильными)».</li>\n<li><strong>«Ну и дальше расы и организации который равны по силе с друг другом»</strong>: Дети мирового древа, Проротой каменный челике, Азуриэль, Группировка сестры, Правителская организации по контролю всех этих, Церковь с паладинами, Организация Виктора, Пернатые, орден по убийству котов, вампиры, Аскизы.</li>\n</ol>\n<p>Отдельно названные соотношения, не входящие в этот список:</p>\n<ul>\n<li>«Но апостолы сильнее поротоя» (366177).</li>\n<li>Азуриэль — «природный охотник Апостолов»; «против Поротой они не так эффективны» (366175).</li>\n<li>Детей мирового древа «не кто из апостоловы не сможет нормально их ранить», и они «сильнейший наверное в физическом плане» (376401).</li>\n<li>Три сильнейших существа мира — Нуар, Граф, девушка со стороны людей (393297–393300).</li>\n</ul>", "r": [["Список 12 апостолов", "kb/SL-0054-spisok-12-apostolov.html"], ["Жизненный цикл апостолов", "PS-0303.html"], ["Бессмертный апостол", "PS-0326.html"], ["Палачи", "PS-0304.html"], ["Аскизы", "PS-0300.html"], ["Матка Аскизы", "PS-0301.html"], ["Поротай", "PS-0036.html"], ["Вампиры", "PS-0299.html"], ["Антиапостолы / Одержимые", "PS-0296.html"], ["Эффект адаптации", "SP-0245.html"], ["Амофцы", "MR-0167.html"], ["Азуриэль", "MR-0129.html"], ["Дети мирового древа", "MR-0161.html"]]}, {"t": "Система способностей", "a": ["S05", "VS-0008-S05", "VS-0008--sistema-sposobnostey"], "h": "<h3>Что такое Оам</h3>\n<p>«В воздухе и в некоторых водоёмах стали насыщенный Оам неизвестной частицей, что может вырабатывать энергию в огромных количествах. Долго время для живых организмов была токсичной. Но после адаптации они стали нейтральными» (376401).</p>\n<p>Физическая природа уточнена 2025-11-05 (382103–382109). Миколай: «мб туманности?», «ну оам это че, я чет помню он как туман распространялся». Слава: «Они же не как не связаны с туманнам», «Это мелкий крупицы летающий в воздухе».</p>\n<h3>Поглощение, ёмкость, сброс</h3>\n<p>Из 376401:</p>\n<ul>\n<li>«Человек вдыхает Оам ( то есть поглощает, также поглощения может идти просто и через кожу, но более быстрый и способ но который мы можем хоть как-то повлиять). И дальше он по кровеносной системе вместе с кислородом проходит через всё тело, где-то оседая зависима от человека.»</li>\n<li>«И также зависимо от человека в нём накапливается определенное количества Оам. то есть у каждого человека своя ёмкость Оам.»</li>\n<li>«Если же у человека накапливается больше Оам, чем предусматривает его ёмкость. То Оам выходит через споры, с выдохом и просто через кожу либо другие способы выделением. Выпуск лишний Оам происходит чуть быстрее чем поглащения.»</li>\n<li>«В каждым человеке есть Оам но использовать его не как нельзя. Но есть способ.»</li>\n</ul>\n<p>Уточнение того же дня, 15:05 (376429): «Некоторые существа способны контролировать Oам, впитывая его и выделяя по своему желанию. Это одна из самых редких и ценных способностей.» и «Все могут поглощать Оам при вдохе и выделять его при выдохе». (Буква «O» в слове «Oам» здесь латинская.)</p>\n<h3>Обуздание — как получают доступ к силе</h3>\n<p>«Если человек поглотит, что-то с большой концентрации( воду либо вздохнет воздух с большими концентрациями Оам) Оам. Его тело просто не успевает выпускать Оам. И у человека два итого может быть.»</p>\n<ul>\n<li><strong>Первый:</strong> «Либо из-за большого количества Оам его лёгкий или сосуд лопаются, либо Оам просто остановит сердца либо Оам из-за своей токсичности убьет человека.»</li>\n<li><strong>Второй:</strong> «человеку удаётся почувствовать и обуздать Оам. Сдерживая Оам, чтобы он не навредил телу. Сдерживать до тех пор пока избытки Оам не выйдут естественным путём. И после когда избытки выйдут. Человек сможет пользоваться Оам ведь он уже почувствовал и сдерживал Оам.»</li>\n</ul>\n<p>У животных иначе: «У животных это происходит более инстинктивно. Поэтому шанс выживаемости у них больше чем у людей. Но они не могут раскрыть весь потенциал.»</p>\n<p>Никакого дарителя, покровителя или контракта в материалах Оам не названо: доступ открывается один раз, через пережитый передоз.</p>\n<h3>Пути к владению Оам по классам</h3>\n<ul>\n<li>обычный человек — через смертельно опасное переполнение, с двумя исходами;</li>\n<li>апостол — «Им достаточно пережить одну эмоциональную ситуацию, и они неосознанно воспользуются Оам»;</li>\n<li>азуриэль — с рождения, «скорость поглощения и выделения Оам у них выше чем у кого либо»;</li>\n<li>вампир — испив крови; кровь же служит и пополнением запаса, и управляемой конечностью;</li>\n<li>дети мирового древа — хранят Оам в оранжевой сердцевине;</li>\n<li>аскизы — их матка сама производит Оам;</li>\n<li>поротай — не через Оам, а через съедение мутировавшего жука;</li>\n<li>коты — состоят из Оэм целиком;</li>\n<li>палачи — Оам не владеют, их сословие построено на выучке и имитации чужого стиля.</li>\n</ul>\n<h3>Три пары глаз</h3>\n<p>Система заведена 2025-12-04 (id 392474–392492), реплика 392478: «Если три пары глаз. Первые белые апостола. Способны видеть оэм ну ещё чего-нибудь. Глаза черви. Зрачки у них будут словно состоять из тысячи маленьких червячков и вечно двигаться вызывая отвращения и страх (будет у котов). Радужные глаза только для одного челика.» Что ещё, кроме Оэм, видят белые глаза, не решено.</p>\n<p><strong>Белые глаза</strong> (<a href=\"SP-0238.html\">Белые глаза</a>, 6 версий, 2025-09-17 — 2025-10-20). Постановка задачи 2025-09-17 (366109–366116): «Для расы апостолов нужно дать какую-ту уникальную способность. Именно всём апостолом. Сверх зрения или типа всё видящая ока я больше не хочу», «Чтобы сочеталось с белыми глазами», «Но при этом было больше физиологическая». Варианты: «Можно придумать что-то вроде прозрачного зрения из клинка рассекающего демона», «Или типа восприятия времени (ну то бишь улучшенная реакция»; итог — «Ну наверное восприятия времени и сверхчувства как у Максима».</p>\n<p>Формулировка (366117, повторена 2025-10-03 в 370767 и 2025-10-20 в 376401–376402): «После активации белых глаз то для них время замедляется ( но они не становятся быстрее) и всех их чувства в улучшаются и они становятся сверх чувствительными. Зрения слух осязания запах и вкус. Из-за и боль они ощущают больнее. Но зато у них словно всё на ладони они ощущать и видят всё что находиться вокруг. И способны словно предсказывать движение противников по слуху или зрению. И становятся невероятно точными.»</p>\n<p>Ограничение: «Но опять же долго держать включёнными такое восприятия они не могут. Мозг просто не выдержит такое большое количество информации и нагрузки.» Способ активации (376401): «Также они могут использовать белый глаза направив туда Оам».</p>\n<p>Характеристики апостола без активации (366117; повтор 370767): физически сильные, быстрые, крепкие, «владеют повышенной регенерацию (ну не прям сверхрегенерацию, просто наверное раза 3 быстрее разный заживают)», реакция превосходит любого человека, «плюсом апостол может приспосабливаться к окружающей среде ну не прям сильно», «могут обходиться без сна и чтобы на них это не как не влияло 3 дня». Числовые пределы, 2025-10-03 (370838–370851): слух — 100 м, запах — 100 м; на вопрос «могут почувствовать что в России находясь в Австралии?» — «Да», с оговоркой «Имитатор и звездочёт могут. Но если сконцентрируется»; чувствуют «температуру воздуху и давлению»; без воды — 7 (единица не названа), без воздуха — 3 минуты.</p>\n<p><strong>Глаза-черви</strong> отданы котам. Уточнение 2025-12-04 вечером (392649–392674): «Нет. Потому что в моей голове эти глаза страшные. Страшнее просто белых или радужных», «Типа это вроде нормальный зрачок. Но если пригляделся то там словно движутся черви. Из-за возникает чувство отвращения, ну и чувство жути», «Словно это что-то не понятное». Боевого действия у них не описано.</p>\n<p><strong>Радужные глаза</strong> — только у Бога красок (392466): «Просто человек у которого глаза цвета радуги. И вот ты видел как картина не высохшая течёт. Он может так сделать со всем миром. Для него все состоит из красок. Бля это тяжка объяснить.» Куда его девать, на тот момент не решено (392490–392492): «Бог красок. Я не знаю куда его деть. Возможно будет антагонистом. Как никак сильный и могущественный. Ну я даже характер его не продумал. Лишь образ». 2025-12-06 (393314) закреплён как один из двух главных злодеев.</p>\n<h3>Нейро-сканер (Азуриэль)</h3>\n<p>Исходное состояние (2025-09-17, 366126): «Эмпатия. Прекрасно ощущать намерения.»</p>\n<p>Переформулировка (366148): «Азуриэль: Нейро-сканер. Его способность это не эзотерическая эмпатия, а гиперразвитое чувство, позволяющее напрямую считывать и интерпретировать биоэлектрическую активность нервной системы других существ.»</p>\n<p>Ограничение (366151): «находясь в толпе он теряется и не может сконцетрироваться».</p>\n<p>Электрическая часть (366159): «И кстати он может поглощать электричество и улучшать своё физ. Данные и регенерацию. И бить током прикоснувшись человека или стрелять молнии. Но не каких громовых драконов либо ещё какое фантастическое и связанное с энергией бредятины.»</p>\n<p>В базе отмечено, что формулировку 366148 написала нейросеть (Слава подтвердил это в 366168), но авторы её приняли и дальше ею пользуются; в своде 376401 кусок идёт под подписью «Слава дондоков:», авторство Слава подтвердил в 376405–376406.</p>\n<h3>Власть (апостол Граф)</h3>\n<p>Первое заявление, 2025-12-06 (393298): «Его способность власть. Контроль всего, что есть в определенном радиусе. Достаточно силён, чтобы разнести гору, плюсом он быстрейший апостол ( хотя этот титул носит другой Апостол. Ну по факту он быстрее).» Радиус и ограничения на тот момент не заданы.</p>\n<p>Развёрнутое объяснение приходит 2026-06-02 (487011–487021), то есть уже после закрытия линии Оам; вселенная у этих реплик в базе помечена как «неясно (по дате объявления)». Там способность разобрана так: «под властью имеется виду область, в который Граф всё контролирует. Абсолютно все»; дефект — он получает всю информацию об области «до атома, до мельчайшего движения», отчего «мозги расплавиться», и потому есть три способа применения: покрыть областью примерно 10 метров; покрыть властью своё тело плёнкой (сила и полёт, меньше информации, но плохая защита); создать область власти отдельно от себя (1 метр на расстоянии до 1 км), только в комбинации с первыми двумя, «Потому что сам Граф в это время останется беззащитным». Отдача на характере: «Граф высокомерный и часто раздражённые из-за боли в голове» (487021). Тогда же введено общее ограничение — плёнка сверхлюдей (487170): «У сверхлюдей есть как бы плёнка что защищает от воздействия других способности. Чем сильнее сверхчеловек тем больше плёнка. Поэтому граф против особо сильных не может раздавить их просто или остановить сердца»; сам Слава помечает происхождение текста — «Это я нейри кинул» (487171). Относится ли этот слой к Оам, в переписке не решено.</p>\n<h3>Изменение мира волнами</h3>\n<p>Названо дважды в одном окне 2025-11-17: у сильнейшей в правительственной организации — «Сильнейшая там девченка что может изменять мир волнами» (385768), и у Нуара — «Ну здесь он будет влиять на мир подобно волнами» (385779). 2025-12-06 (393300) о девушке: «Помнишь фантазера с волнами. Вот её способность. По сути она одна из немногих, что может изменять законы мира.» Механика не раскрыта; одна ли это способность у двух носителей или совпадение оборота, в переписке не проговорено.</p>\n<h3>Красный ток</h3>\n<p>Не общая механика мира, а предмет веры одного персонажа (385768; повтор 393287): «Виктор верит в красный ток что оживляет людей. И он многих оживил, но разум так и не смог в них оживить». Уточнение стороны конфликта (393308): «Виктор, что воскрешает трупы, ну точнее делает из них марионеток». Природа самого «тока» не объяснена.</p>\n<h3>Предметы, места и вещества</h3>\n<ul>\n<li><strong>Артефакты</strong> (376414) — «предметы созданный из материалов, который находились близко к метеоритом, либо из осколков самого метеорита». Это единственное определение артефактов, относящееся к Оам; развёрнутые правила артефактов в карточке <a href=\"SP-0047.html\">Артефакты</a> относятся к вселенным «Падения небес» и «Апостол» и в Оам не переносились.</li>\n<li><strong>Камень желания</strong> (376416) — «пропитанное большим количеством оам кристаллы. Что при разрушение способны попадать в живой организм делая его сильнее быстрее и д. т. Но медленно превращая его в камень желания».</li>\n<li><strong>Чёрные озёра</strong> (376413) — превращают нырнувшего в монстра, место падения одного из метеоритов.</li>\n</ul>\n<h3>Сводка ограничений и цены</h3>\n<ul>\n<li>Оам токсичен; при передозе лёгкие или сосуды лопаются, останавливается сердце, либо «Оам из-за своей токсичности убьет человека».</li>\n<li>У каждого человека своя ёмкость; сверх ёмкости Оам вытесняется наружу.</li>\n<li>Выпуск излишков идёт чуть быстрее поглощения.</li>\n<li>Просто иметь Оам недостаточно — «В каждым человеке есть Оам но использовать его не как нельзя».</li>\n<li>Осознанный контроль — «одна из самых редких и ценных способностей».</li>\n<li>Белые глаза: усиленная боль и перегрузка мозга, долго держать нельзя.</li>\n<li>Нейро-сканер: в толпе носитель теряется и не может сконцентрироваться.</li>\n<li>Поротай: два исхода из трёх — смерть или потеря личности; у выживших вторая жестокая личность как дебафф.</li>\n<li>Камень желания: усиливает, но медленно превращает носителя в камень желания.</li>\n<li>Чёрные озёра: нырнувший превращается в монстра.</li>\n<li>Красный ток: работает на теле, не работает на разуме.</li>\n<li>Паладины: «до хрена сильный но их ней движения предсказуемый».</li>\n</ul>\n<h3>Предложенное и отклонённое</h3>\n<ul>\n<li><strong>Всевидящее око и сверхзрение</strong> (366109): «Сверх зрения или типа всё видящая ока я больше не хочу.»</li>\n<li><strong>Прозрачное зрение из «Клинка, рассекающего демонов»</strong> (366113) — названо как вариант, не выбрано.</li>\n<li><strong>Эзотерическая эмпатия</strong> как объяснение способности Азуриэля — отвергнута формулировкой «не эзотерическая эмпатия, а гиперразвитое чувство» (366148).</li>\n<li><strong>Громовые драконы и энергетическая фантастика</strong> (366159).</li>\n<li><strong>Названия энергии</strong>, отклонённые перебором 2025-10-20.</li>\n<li><strong>Оам как туман и носители «туманности»</strong> (382103–382105).</li>\n<li><strong>Названия носителей</strong> «Оамовцы», «Амов», «Амифцы», «Амифиц», «суспензы? нуары? тросы?» (382220: «Не»).</li>\n<li><strong>Происхождение 21 апостола от трупа мутировавшего существа</strong> (377638–377642): «Нет».</li>\n<li><strong>Обучение палачей особому усилению Имитатора</strong> (382099) — отказ внутри мира: «из-за большой смертности от неё отказались».</li>\n<li><strong>Прежняя цель дочери Имитатора</strong> — объединить миры и вызвать Апокалипсис — отменена при переносе в Оэм (393313), новая не придумана.</li>\n</ul>\n<h3>Уникальная деталь системы силы</h3>\n<p>Задача поставлена 2025-11-16 21:28 (385707–385710): «Хочу придумать уникальную деталь для системы силы Оам», «Типо территорий или воли и т. Д.», «Ну я не знаю какую мысль взять», «Идею». Миколай: «подумаю» (385713). В материале деталь не придумана.</p>", "r": [["Белые глаза", "SP-0238.html"], ["Артефакты", "SP-0047.html"]]}, {"t": "Кончина", "a": ["S06", "VS-0008-S06", "VS-0008--konchina"], "h": "<p>Объявлено 2026-04-19 в 13:28–13:31 (id 462201–462204, окно w0120). Причина, названная автором: вселенные скатываются из-за Имитатора, который каждый раз поднимает уровень сил. Дословно:</p>\n<pre><code>[462201] 2026-04-19 13:28 Слава: Я понял одну простую вещь. \nКаждая моя вселенная скатывается из-за того что я каждый раз поднимаю уровень сил. \nИ ещё есть закономерность из-за кого это \nВ семи островах \nВ благословенная \nВ Оэм\nВо всех этих вселенных именно один Чёртов персонаж поднимает уровень сил ( догадался кто?) \n\nИмитатор, высокомерный черт, что должен будет пройти свой этап перерождения. \nНу и давай будем честный он правда высокомерен, высокомерно любого из апостолов. \nОн издевается над противниками. Почти любой свой бой он может закончить за мгновение, его силы это позволяют. \nНо нет он даёт противнику использовать всё свои способности, при этом даже не сопротивляесь \nА в конце он имитирует способность врага и превосходит его в мастерстве. То есть он буквально втаптывает в грязь всё годовые труды своих противников, который на протяжении многих лет развиваи свои способности. \nПри этом даже то что он чаще всего оставляет своих противников в живых. Не делает его хорошим, наоборот добавляет ещё один минус. \nИ даже его отговорки, что он упёрся в тупик и таким способом пытается его преодолеть, звучат хреново. (Вот такое он персонаж) (при этом он ключевой персонаж) \n\nНу и его акт перерождения, когда он встречается сильным противником и проигрывает. И при этом получает раны что не может залечить (чаще всего потерю левого глаза, левой руки и правой ноги, и там зависимо от вселенной еще что-то) \nИ так он полностью ослаблен и с невыносимой болю думает о своих поступках. Плюсом ко всему в это время происходит какая-то трагедия потеря близкого и т. Д. А также появление людей другой категории силы и именно в этот момент он перерождается буквально в бога. \nВ одной вселенной он буквально контролирует и ощущает все, и потсраивает правила мира под себя \nВ другое он получает силы от существа порядка выше чем кто либо \nВ Оэм он должен был бы стать Богом красок. То есть буквально Богом что перерисовает мир. \nИ из-за этого гандона мой мир улетает в жопу\n[462202] 2026-04-19 13:30 Слава: Поэтому Оэм пока отложим\n[462203] 2026-04-19 13:30 Слава: Строим новую вселенную без энергии\n[462204] 2026-04-19 13:31 Слава: И пока что основой послужат благословенный, одарённый, и т. Д. Щя скину тебе кто они\n</code></pre>\n<p>Что из этого закреплено:</p>\n<ul>\n<li>Формулировка закрытия — не «конец», а «Поэтому Оэм пока отложим». Слово «пока» в переписке не отменяется и не уточняется.</li>\n<li>Новая вселенная объявлена прямо через отказ от того, с чего начинался Оам: «Строим новую вселенную без энергии» (462203), при том что Оам начинался с названия энергии (376203). Основой служат «благословенный, одарённый, и т. Д.»; кто они — обещано скинуть отдельно.</li>\n<li>Оэм назван в одном ряду с Семью островами и Благословенной как вселенная с той же болезнью.</li>\n<li>Роль Бога красок объяснена задним числом: «В Оэм он должен был бы стать Богом красок. То есть буквально Богом что перерисовает мир.» То есть второй главный злодей из 393314 — форма перерождения Имитатора в Оэм. Сослагательное наклонение («должен был бы») означает, что в самой переписке до этого дело не дошло.</li>\n<li>Про Имитатора здесь же: «(при этом он ключевой персонаж)» и типовые раны его перерождения — «чаще всего потерю левого глаза, левой руки и правой ноги, и там зависимо от вселенной еще что-то».</li>\n</ul>\n<p>Сразу следом, в том же окне (462204–462206), выкладывается набор благословенных для новой вселенной, среди которых пятым идёт Азуриэль: «Пятый азуриэль. Он способен чувствовать эмоции людей. А иногда он способен чётко ощутить эмоции нечто, который опять же его куда-то ведут. Если он не пойдёт то его способности умиляться и он более отчётливо начнёт осушать чужие чувствовать, а так как их много он начнёт сходить с ума от этого.» Вселенная в этом окне не названа; относится ли это описание к расе Азуриэлей из Оам, в переписке не сказано.</p>", "r": []}, {"t": "Возвраты", "a": ["S07", "VS-0008-S07", "VS-0008--vozvraty"], "h": "<h3>2025-10-22 — возврат старых апостолов (id 377616–377647, окно w0108)</h3>\n<p>Слава открывает: «Кстати вернём старых апостолов. Они насекомые произошли от неизвестного мутировшого существа» (377616). Мотив возврата назван прямо (377617): «Просто если у них развита только мозг и нервная связь. Они не смогут в моей голове сражаться полноценная. ( эффект адаптации повышенный у них должен быть)».</p>\n<p>Миколай переспрашивает по шагам: «так стой», «не совсем понимаю», «вернём старых апостолов», «а потом что-то про насекомых», «старые апостолы это насекомые» (377618–377622). Дальше идёт описание расы (см. «Население и классы»), привязка «Ну только в вселенной Оам» (377627) и формулировка общего правила вселенной: «Все монстры это мутированный под воздействием Оам» (377634).</p>\n<h3>2025-11-16 / 2025-11-17 — возврат к вселенной и иерархия (id 385704–385779, окно w0109)</h3>\n<p>2025-11-16 21:28 Слава возвращается к вселенной с задачей придумать уникальную деталь для системы силы (385707–385710); Миколай — «подумаю» (385713). Дальше пауза 11,8 часа.</p>\n<p>2025-11-17 09:51 выложена иерархия рас и организаций одним сообщением (385768) — коты, апостолы, затем равные по силе расы и организации; тут же придумано имя Виктор и добавлены Аскизы отдельной репликой (385769). 10:10 (385774–385779) Нуар из Семи островов включается в девятку котов.</p>\n<p>Уникальная деталь для системы силы, ради которой начался возврат, в этом окне не придумана; ответ Миколая по существу в материале не приводится.</p>\n<p>Вечером того же дня, 22:20, Миколай отвечает на выложенную иерархию: «бля, документ, точно» (386175), «когда-то я продолжу его делать» (386177). О каком документе речь, не расшифровано.</p>\n<h3>2025-12-06 — повтор состава и разбор (id 393287–393316, окно w0112)</h3>\n<p>Сообщение 393287 — дословный повтор текста 385768, включая ту же просьбу «уникальный особенности, я для них не придумал помоги»; следом 393288 — снова «Ну и Аскизы. Я не знаю где они живут».</p>\n<p>Новое в этой сессии: первое написание «Оэм» (393290), разбор сторон конфликта, три сильнейших, промежуточные и два основных злодея, перенос сестры, коты как духи из Оэм, и открытый список задач (393316). Вечером того же дня Слава напоминает про более ранний документ об апостолах: «А также мой обзор мира. Когда я скинул о преставления о мире» (393483), «А также отдельно апостолы» (393484), «Я ведь изменил их и сделал насекомыми» (393485). Там же упрёк про работу с ИИ (393486): «Я думал ты ещё свои идей подкинишь. ИИ конечно хорошо. Но она не понимает многая. Отсылки, апостолы, сестра с её организации и многое другое»; Миколай: «ну да» (393487).</p>\n<h3>После закрытия</h3>\n<p>Возвращались ли к вселенной после 2026-04-19, в карточке не сказано — последняя запись в ней 2026-04-19. Более поздний материал (2026-06-02, 2026-06-07), где фигурируют Граф, Нуар, апостолы и камень желания, в базе помечен вселенной «неясно (по дате объявления)»; к Оам в переписке он не привязан.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Как развивалось — не материал авторов</b>\n<p>Забыли — конкретную задачу. 2025-11-16 в 21:28 Слава ставит её отдельно: «Хочу придумать уникальную деталь для системы силы Оам», Миколай отвечает «подумаю». Наутро 2025-11-17 вместо детали выложена иерархия рас и организаций, и к задаче больше не возвращаются.</p></div>", "r": []}, {"t": "Пробелы", "a": ["S08", "VS-0008-S08", "VS-0008--probely"], "h": "<div class=\"gaps\"><p><strong>Прямые авторские «не придумал / не знаю»:</strong></p>\n<ul>\n<li>Уникальные особенности котов: «уникальный особенности, я для них не придумал помоги» (385768, повтор 393287). Ответа в окнах нет. 2025-12-17 (399583) «Роль Котов во всей этой фигней» стоит в списке задач.</li>\n<li>Характер Нуара: «Как и в семи островав, так и здесь я не смог придумать ему характер. Поможешь?» (393297).</li>\n<li>Родитель апостолов: «Кто их родитель я так и не придумал» (377626).</li>\n<li>Следующий этап жизненного цикла апостолов: «Какой следующий этап в их ней жизненном цикле будет я не знаю» (377626).</li>\n<li>Где живут Аскизы: «Ну и Аскизы. Я не знаю где они живут» (385769, повтор 393288).</li>\n<li>Как рождаются Аскизы: «Как они рождаются я ещё не придумал» (376401).</li>\n<li>Цель сестры / дочери Имитатора в Оэм: «И я не знаю какие у неё будет цель» (385768), «Ну теперь я не знаю какая у неё цель в мире Оэм» (393313).</li>\n<li>Каким злодеем будет Бог красок: «Он будет злодеем ну каким я не знаю» (393314); ранее — «Я не знаю куда его деть» (392490).</li>\n<li>Третья сильнейшая, девушка на стороне людей: «Опять же я ее не продумал» (393300).</li>\n<li>Задача конца сессии 2025-12-06: «Так мне нужна цель и мотивация двух сильнейших за мир. И цель и мотивация двух сильнейших злодеев» (393316); Миколай — «ну пока идей нет».</li>\n<li>Планы злодеев, 2025-12-09 (394574–394580): «А идей насчет злодеев. Ну точнее их планы?» — «Оам» — Миколай: «пока нет идей», «но я думаю»; Слава: «В это истории злодея ещё не появилась».</li>\n<li>Уникальная деталь для системы силы Оам (385707–385713) — не придумана.</li>\n</ul>\n<p><strong>Названия, которых нет:</strong></p>\n<ul>\n<li>Организация, убившая семью апостола и разгромившая детский приют (377625).</li>\n<li>Апостол, носящий титул быстрейшего (393298).</li>\n<li>«Какая-то верология», для которой матка Аскизов стала предметом веры (385768).</li>\n<li>Имя девушки, изменяющей мир волнами, — сильнейшей в Правительственной организации по контролю.</li>\n<li>Имя босса группировки дочери (393462, 393479).</li>\n<li>Третий участник Пернатых — «и кто-нибуть ещё».</li>\n<li>Кто такие «благословенный, одарённый», обещанные как основа новой вселенной (462204, «Щя скину тебе кто они») — самого списка в закрывающем фрагменте нет.</li>\n<li>Кто такой Максим из реплики «сверхчувства как у Максима» (366116).</li>\n</ul>\n<p><strong>Несогласованное:</strong></p>\n<ul>\n<li>Природа апостолов: «проста люди у которых мутировала … нервная связь и мозг» (377623) против «Но это не люди, это насекомые» (377625) и «Насекомые я назвал их по приколу» (377643). Прямого выбора автор не делает, хотя 2025-12-06 говорит «Я ведь изменил их и сделал насекомыми» (393485).</li>\n<li>Ранняя версия происхождения апостолов (2025-09-17, 366034: «апостолы это те кто сожрал насекомое … шанс выживания после его съедения 13 процентов. Всего насекомых 21») и поздняя (мутация в утробе матери, 376401) в переписке не сопоставлены.</li>\n<li>Карточка Список 12 апостолов <em>(статьи ещё нет — <a href=\"kb/SL-0054-spisok-12-apostolov.html\">исходник</a>)</em> названа «Список 12 апостолов» при 21 апостоле во всех объявлениях вселенной; расхождение не обсуждается.</li>\n<li>Написание названия: «Оэм» у Славы, «Оам» у Миколая и нейросети; отдельного объявления о переименовании нет, единого написания авторы не зафиксировали. В базе при этом заведены три карточки — <a href=\"MR-0164.html\">Оам</a> «Оам», <a href=\"MR-0182.html\">Оэм</a> «Оэм», <a href=\"MR-0165.html\">Мир Оам</a> «Мир Оам»; чем «Мир Оам» отличается от «Оам», не сказано.</li>\n<li>Финальное написание названия носителей — «амофцы» или «амовцы» — «Ну давай пока это» (382222).</li>\n<li>Одержимые / антиапостолы: вопрос «Ну они тоже должны насекомого съесть?» (366040) остался без ответа; в сводах Оам с 2025-10-20 они не перечисляются, объяснения нет.</li>\n<li>Азуриэль описан и как «он», и как «группа лиц, чей дети мутировали»; цвет кожи не зафиксирован — синий или розовый. Относится ли к расе Азуриэлей описание «пятого благословенного» из окна 2026-04-19, в переписке не установлено.</li>\n</ul>\n<p><strong>Не описано:</strong></p>\n<ul>\n<li>Механика «эффекта адаптации» у апостолов — сказано только, что он должен быть повышенный (377617).</li>\n<li>Механика «изменения мира волнами»; одна ли это способность у девушки и у Нуара.</li>\n<li>Природа «красного тока» — только то, что Виктор в него верит и что разум оживить не смог.</li>\n<li>Вероятности трёх исходов при поедании Поротая; чем способности низшего отличаются от высшего, кроме контроля над низшими, — сам Слава называет это проблемой: «Поротая низший владеет почти идентичными способностями Поротая высшего» (152603); просьба добавить высшему ещё одну способность (152576) осталась незакрытой.</li>\n<li>Где в теле оседает Оам — «где-то оседая зависима от человека» (376401); единственное названное место хранения во всём материале — оранжевая сердцевина у Детей мирового древа.</li>\n<li>Единица измерения в «без воды 7» (370850).</li>\n<li>Тёмная изнанка — только одна фраза о том, что её существование раскроется из-за апостолов.</li>\n<li>Мировое древо как объект мира отдельно не расписано.</li>\n<li>Состав и цели организации Виктора; орден по убийству котов — одна строка; вампиры — одна строка «просто аристократы»; что за преступная организация принадлежит каменным и в чём «некий союз с апостолами».</li>\n<li>Кто растит Палачей — государство или организация.</li>\n<li>Более ранний документ об апостолах, на который Слава ссылается 2025-12-06 (393483–393485), в окно не попал; содержимое неизвестно.</li>\n<li>Содержание документа и сайта по вселенной осталось за ссылками на codepen: «Че то мало информация оказывается о ОЭМ» (429386), «я еще пару раз лоханулся и не скинул всё прям» (429807).</li>\n<li>Ответ Славы «Оба понравились» (393467) на шесть предложенных вариантов главного вопроса Имиты — какие именно два, не сказано.</li>\n<li>Реплика «Это босс будет хитрым и уверенным. Хотя обычные человек» (393479) лежит в файле правительственной организации, и чей это босс, в самом куске не названо.</li>\n<li>Ответ Миколая по существу на просьбу помочь с уникальной деталью системы силы (385713 «подумаю») в материале не отражён.</li>\n</ul>\n<p><strong>По устройству самой карточки:</strong></p>\n<ul>\n<li>В шапке <a href=\"VS-0008.html\">Оам</a> заявлено 6 отрезков, в таблице три; нижняя дата шапки (2024-01-30) не совпадает ни с одним отрезком и приходит от старых сущностей. В карточке это не поясняется.</li>\n<li>Не объяснено, почему первый отрезок кончается 2025-11-01, а второй 2025-11-18; промежуток 2026-02-06 — 2026-04-19 таблицей не покрыт.</li>\n<li>Дословных текстов основополагающих объявлений 376203 и 376401 в карточке нет — они только упомянуты в таблице отрезков; сами сообщения лежат в сыром окне w0107 (id 376201–376859).</li>\n<li>Реплика Миколая про «документ», указанная в таблице событий за окно w0109, в дословный фрагмент карточки не попала (в сыром окне это id 386175).</li>\n<li>Даты прозы про котов (2025-10-26 «Уродливый кот», 2025-10-28 «я был одним из тех, кто избивал кота») лежат раньше, чем коты вводятся в иерархию (2025-11-17); связь между прозой и котами-девяткой в переписке не проговорена. Проза «Бог красок» (2025-12-04) на два дня раньше, чем Бог красок назван вторым главным злодеем.</li>\n<li>Закрытие сформулировано как «Оэм пока отложим» — то есть не как окончательная кончина; возвращались ли к вселенной после 2026-04-19, в карточке не сказано.</li>\n<li>Материал 2026-06-02 и 2026-06-07 (Власть с тремя способами, плёнка сверхлюдей, тьма Нуара, шесть столпов, апостолы как проект Нимба, камень желания у Доимы) в базе помечен вселенной «неясно»; относить ли эти механики к Оам, в переписке не решено.</li>\n</ul></div>", "r": [["Список 12 апостолов", "kb/SL-0054-spisok-12-apostolov.html"], ["Оам", "MR-0164.html"], ["Оэм", "MR-0182.html"], ["Мир Оам", "MR-0165.html"]]}, {"t": "Связи — всё вместе", "a": ["VS-0008--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0036.html\">Поротай</a>, <a href=\"PS-0104.html\">Нуар</a>, <a href=\"PS-0296.html\">Антиапостолы / Одержимые</a>, <a href=\"PS-0299.html\">Вампиры</a>, <a href=\"PS-0300.html\">Аскизы</a>, <a href=\"PS-0301.html\">Матка Аскизы</a>, <a href=\"PS-0303.html\">Жизненный цикл апостолов</a>, <a href=\"PS-0304.html\">Палачи</a>, <a href=\"PS-0325.html\">Босс группировки дочери</a>, <a href=\"PS-0326.html\">Бессмертный апостол</a>, <a href=\"PS-0383.html\">Имитатор</a></li>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0047.html\">Артефакты</a>, <a href=\"SP-0238.html\">Белые глаза</a>, <a href=\"SP-0245.html\">Эффект адаптации</a></li>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0129.html\">Азуриэль</a>, <a href=\"MR-0161.html\">Дети мирового древа</a>, <a href=\"MR-0164.html\">Оам</a>, <a href=\"MR-0165.html\">Мир Оам</a>, <a href=\"MR-0167.html\">Амофцы</a>, <a href=\"MR-0168.html\">Тёмная изнанка</a>, <a href=\"MR-0169.html\">Пророки каменные</a>, <a href=\"MR-0170.html\">Группировка сестры</a>, <a href=\"MR-0171.html\">Правительственная организация по контролю</a>, <a href=\"MR-0172.html\">Церковь с паладинами</a>, <a href=\"MR-0173.html\">Организация Виктора</a>, <a href=\"MR-0174.html\">Пернатые</a>, <a href=\"MR-0175.html\">Орден по убийству котов</a>, <a href=\"MR-0182.html\">Оэм</a></li>\n<li><strong>Упоминает монументы:</strong> <a href=\"MN-0022.html\">Чёрные озёра</a></li>\n<li><strong>Упоминает истории:</strong> <a href=\"IS-0017.html\">Защитник</a></li>\n<li><strong>Группы:</strong> <a href=\"GR-0056.html\">Апостолы (21 апостол; «насекомые»)</a>, <a href=\"GR-0057.html\">Коты (девять котов)</a>, <a href=\"GR-0058.html\">Орден по убийству котов</a>, <a href=\"GR-0059.html\">Правительственная организация по контролю</a>, <a href=\"GR-0060.html\">Группировка сестры (она же группа злодеев дочери Имитатора)</a>, <a href=\"GR-0061.html\">Церковь с паладинами</a>, <a href=\"GR-0062.html\">Паладины</a>, <a href=\"GR-0063.html\">Организация Виктора</a>, <a href=\"GR-0064.html\">Пророки каменные («Проротой каменный челике», Поротаи)</a>, <a href=\"GR-0065.html\">Пернатые (клан крылатых)</a>, <a href=\"GR-0066.html\">Аскизы</a>, <a href=\"GR-0067.html\">Дети мирового древа</a>, <a href=\"GR-0068.html\">Азуриэль (народ)</a>, <a href=\"GR-0069.html\">Вампиры</a>, <a href=\"GR-0070.html\">Палачи (государственные убийцы)</a>, <a href=\"GR-0071.html\">Банда Графа</a>, <a href=\"GR-0072.html\">Амофцы</a></li>\n<li><strong>Персонажи:</strong> <a href=\"PS-0036.html\">Поротай</a>, <a href=\"PS-0383.html\">Имитатор</a>, <a href=\"PS-0104.html\">Нуар</a>, <a href=\"PS-0171.html\">Палач</a>, <a href=\"PS-0182.html\">Агрегат</a>, <a href=\"PS-0299.html\">Вампиры</a>, <a href=\"PS-0300.html\">Аскизы</a>, <a href=\"PS-0301.html\">Матка Аскизы</a>, <a href=\"PS-0302.html\">Пепельный человек</a>, <a href=\"PS-0303.html\">Жизненный цикл апостолов</a>, <a href=\"PS-0304.html\">Палачи</a>, <a href=\"PS-0307.html\">Коты</a>, <a href=\"PS-0308.html\">Виктор</a>, <a href=\"PS-0322.html\">Бог красок</a>, <a href=\"PS-0323.html\">Граф</a>, <a href=\"PS-0324.html\">Дочь Имитатора</a>, <a href=\"PS-0325.html\">Босс группировки дочери</a>, <a href=\"PS-0326.html\">Бессмертный апостол</a>, <a href=\"PS-0327.html\">Девушка, изменяющая мир волнами</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["VS-0008--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/VS-0008.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["VS-0008-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/VS-0008/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Чинить первым <code>SL-0054</code> «Список 12 апостолов»: семь ссылок, статьи нет, 234 052 знака. Здесь эта дыра дороже, чем где бы то ни было ещё. Апостолы объявлены второй по силе расой мира, их 21, они же названы главной стороной добра — и единственный поимённый реестр, который вообще существует, лежит под записью, названной «Список 12 апостолов». Поимённо в окнах Оам звучат ровно двое: Граф и
