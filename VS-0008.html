бессмертный. То есть девятнадцать позиций главной расы не существуют нигде, кроме этих 234 килобайт, и расхождение 21 против 12 в переписке ни разу не обсуждается.</p>\n<p>Второе — коты. <code>PS-0307</code> «Коты»: четыре ссылки, статья есть, 13 340 знаков, и при этом «уникальный особенности, я для них не придумал помоги» — просьба выложена 2025-11-17 (385768) и дословно повторена 2025-12-06 (393287), оба раза без ответа. На нерасписанную вершину иерархии опираются <code>MR-0175</code> «Орден по убийству котов» (четыре ссылки, 8 026) — орден, заведённый специально против них, — и <code>PS-0104</code> «Нуар» (три ссылки, 49 571), которого в котов зачислили.</p>\n<p>Третьим слоем идут организации: <code>MR-0171</code> «Правительственная организация по контролю» (четыре ссылки, 9 375), <code>MR-0169</code> «Пророки каменные» (четыре, 8 328), <code>MR-0174</code> «Пернатые» (четыре, 8 846), <code>PS-0308</code> «Виктор» (четыре, 9 225). У каждой по четыре ссылки и по одной-две строки описания в чате: «Некий союз с апостолами», «Серафим, Пераги и кто-нибуть ещё», «Вампиры просто аристократы». Материал в базе есть, но он весь — повтор одного и того же перечня, выложенного дважды.</p>\n<h3>С чего начать</h3>\n<p><code>SL-0054</code> — целиком в базе, 44 версии, но версии эти лежат в окнах «Апостола»: id 284248, 284300, 284858, 285522, 325799. Сшивать надо с оамовскими окнами w0107 (376401, свод мира) и w0108 (377616–377647, возврат насекомых), потому что там апостолов уже 21 и природа у них другая.</p>\n<p>Коты в базе тонкие, надо в архив. Ориентиры: 2025-11-17, окно w0109, id 385768–385779 (там же Нуар зачислен в девятку); 2025-12-04, id 392486–392492 (коты как духи из Оэм, глаза-черви); 2025-12-06, id 393315; 2025-12-17, id 399583 — «Роль Котов во всей этой фигней» стоит в списке задач. Отдельно стоит просмотреть прозу 2025-10-26 «Уродливый кот» и 2025-10-28 — она на три недели раньше, чем коты вводятся в иерархию, и связь между ней и девяткой нигде не проговорена; если у котов есть содержание, оно, скорее всего, там, а не в иерархии.</p>\n<p>Самое дешёвое действие вообще: содержимое сайта и документа по вселенной в чат не попало, есть только ссылки на codepen — 376423 (2025-10-20), 429381 и 429804 (2026-02-06 и 02-07). Плюс более ранний свод об апостолах, на который Слава ссылается 2025-12-06 («А также мой обзор мира. Когда я скинул о преставления о мире», 393483) и которого в окне нет. Если эти три вещи достаются, они закрывают больше, чем весь поиск по архиву.</p>\n<p>Служебные <code>SL-0113</code>, <code>SL-0115</code>, <code>SL-0126</code>, <code>SL-0125</code> статей не имеют, но материал под ними есть — это работа на месте, без архива.</p>\n<h3>Как развивалось</h3>\n<p>Заявили 2025-10-20 в два приёма за один день: утром перебрали три десятка вариантов названия для энергии и остановились на «Оам» («Даваай пока оам»), а в 14:29 под это название одним сообщением выложен весь мир — метеориты, вымирание, адаптация, поглощение, обуздание и первый список рас. К вечеру добавлены чёрные озёра, артефакты, камень желания и время действия.</p>\n<p>Ограничили тогда же и жёстко: Оам токсичен, у каждого своя ёмкость, излишек вытесняется наружу, выпуск чуть быстрее поглощения, доступ открывается через передоз с двумя исходами; белые глаза перегружают мозг, боль ощущается сильнее, долго держать нельзя; нейро-сканер отказывает в толпе.</p>\n<p>Забыли — конкретную задачу. 2025-11-16 в 21:28 Слава ставит её отдельно: «Хочу придумать уникальную деталь для системы силы Оам», Миколай отвечает «подумаю». Наутро 2025-11-17 вместо детали выложена иерархия рас и организаций, и к задаче больше не возвращаются.</p>\n<p>Вернулись 2025-12-06 и выложили дословный повтор сообщения 385768 — вместе с той же просьбой «помоги» про котов и той же строкой «Ну и Аскизы. Я не знаю где они живут». Новое в этой сессии — разбор сторон конфликта и первое написание «Оэм».</p>\n<p>Отложили 2026-04-19: «Поэтому Оэм пока отложим», сразу за разбором того, почему все вселенные скатываются. Слово «пока» нигде не отменяется и не уточняется.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Правило ёмкости названо для человека и названо подробно: «зависимо от человека в нём накапливается определенное количества Оам. то есть у каждого человека своя ёмкость Оам», сверх ёмкости Оам «выходит через споры, с выдохом и просто через кожу», и выпуск идёт чуть быстрее поглощения. Отдельно оговорено, что у животных всё то же самое, только инстинктивнее и с большим шансом выжить.</p>\n<p>Для рас, которые Оам производят или из него состоят, правила того же рода нет. Матка Аскизов «начала производить Оам», коты «будут состоять из Оэм», у Детей мирового древа Оам хранится в оранжевой сердцевине — и ни для одной из трёх не сказано, есть ли у них ёмкость, что происходит при переполнении и можно ли их вообще передозировать, хотя ёмкость объявлена свойством всякого носителя. Место видно; решение не моё.</p>\n<h3>Отклик</h3>\n<p>Самое сильное здесь — закрытие. Вселенную сворачивают не потому, что она не сошлась, а потому, что автор вычислил в трёх своих мирах подряд одного и того же виновника, и обвинение расписано на целую страницу — с интонацией не разработчика, а человека, которому персонаж лично надоел: «Имитатор, высокомерный черт», «он буквально втаптывает в грязь всё годовые труды своих противников», «И из-за этого гандона мой мир улетает в жопу». Тут же выясняется вещь, которая мне и понравилась: Бог красок, объявленный вторым главным злодеем за четыре месяца до этого, оказывается тем же Имитатором после перерождения — «В Оэм он должен был бы стать Богом красок». Сослагательное наклонение говорит, что до этого в самой работе не дошло: разбор собственной болезни поставлен раньше, чем сюжет, ради которого болезнь заводилась. И рядом стоит фраза, которая объясняет весь этот мир лучше любой системы Оам: «Строим новую вселенную без энергии». Начали с того, что придумали имя для энергии, кончили тем, что от энергии отказались.</p></div>", "r": []
