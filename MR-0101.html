<script>const BASE="";const DOCNAME="Грехи (существа минимиров)";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0101-S01", "MR-0101--ustroystvo"], "h": "<p>Грехи в этом значении — не пороки и не абстракции, а существа. Определение дано одной репликой Славы (2025-01-06, id 278982): «Грехи это существо из минимиров который будут по силе 3 благословенным».</p>\n<p>Из этого следуют два зафиксированных свойства:</p>\n<ul>\n<li>происхождение — минимиры;</li>\n<li>сила — эквивалент трёх благословенных. Мера силы задана именно так, через пересчёт на благословенных, а не в собственных единицах.</li>\n</ul>\n<p>Больше в окне о них ничего не говорится.</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0101-S02", "MR-0101--naselenie"], "h": "<p>Грехи и есть население: существа минимиров. Сколько их, различаются ли они между собой, как соотносятся с семёркой грехов — в переписке не сказано, хотя запись отнесена к «Семи грехам» как к части целого.</p>", "r": []}, {"t": "Место во вселенной — как связан с другими мирами", "a": ["S03", "MR-0101-S03", "MR-0101--mesto-vo-vselennoy"], "h": "<p>Грехи приходят из минимиров, то есть привязаны к минимирам как к месту происхождения. Соотнесение с нашим миром и способ попадания сюда в этом окне не описаны.</p>\n<p>Как связанные в записи перечислены: Благословение, Минимиры. Запись помечена как часть «Семи грехов».</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0101-S04", "MR-0101--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-01-06 (id 278975–278984).</strong> Единственная версия. Реплика возникает внутри другого разговора: Слава пишет «Все благословенный», Миколай подхватывает темой «добродели и грехи» «как основа благословения» и выкладывает список из тринадцати добродетелей (Воздержание, Молчание, Порядок, Решительность, Бережливость, Трудолюбие, Искренность, Справедливость, Умеренность, Чистота, Спокойствие, Целомудрие, Скромность) с формулировками к каждой, предлагая: «опираясь на них придумать че нибудь».</p>\n<p>Слава на это предложение не отвечает — вместо разработки добродетелей как основы благословения он выдаёт определение грехов как существ из минимиров силой в трёх благословенных. Реакция Миколая: «эх», «ладно». Дальше в окне тема не развивается.</p>\n<p>Отклонённым, таким образом, оказывается предложение Миколая строить благословение на паре «добродетели — грехи» и отталкиваться от списка добродетелей: оно прозвучало, не было принято и было закрыто в том же обмене.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0101-S05", "MR-0101--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Не сказано, как грехи-существа связаны с грехами в смысле пороков и с семёркой смертных грехов, хотя запись числится частью «Семи грехов».</li>\n<li>Не сказано, попадают ли грехи в наш мир и как.</li>\n<li>Не описано, как грехи выглядят и как действуют.</li>\n<li>Не сказано, откуда взялась мера «3 благословенных» и постоянна ли она.</li>\n<li>Связь грехов с благословением, которую предлагал выстроить Миколай («как основа благословения»), осталась непроработанной.</li>\n<li>Вселенная в окне прямо не названа; отнесена к «Апостолу» по дате объявления.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0101--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0002.html\">Семь грехов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0101--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-01-06</td>\n<td>278975–278984</td>\n<td>w0070</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0101-grehi-suschestva-minimirov.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0101--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0101.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["MR-0101-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/MR-0101/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — отклонённое предложение. <code>ID-0111</code> «Добродетели и грехи как основа благословений»: одна ссылка, 5.4 КБ базы, статьи нет. Это единственное место во всём наборе, где связь грехов с благословением вообще проговаривается, — а определение из этой статьи целиком стоит на такой связи: сила грехов задана не в своих единицах, а пересчётом на благословенных. Пока <code>ID-0111</code> не раскрыт, «3 благословенным» остаётся числом без основания.</p>\n<p>Вторая дыра — семёрка грехов разрезана надвое, и одна половина не видна. Со статьями: <code>PS-0187</code> «Семь грехов» (две ссылки, 10.4 КБ), <code>PS-0188</code> Похоть, <code>PS-0189</code> Чревоугодие, <code>PS-0190</code> Лень (по три ссылки каждая), <code>PS-0191</code> Зависть, <code>PS-0192</code> Гордыня, <code>PS-0177</code> Гнев, <code>SP-0159</code> Алчность. Без статей, при сопоставимом или большем объёме базы: <code>SP-0156</code> «Семь грехов (магия по грехам)» (11.8 КБ), <code>SP-0157</code> Похоть (7.3 КБ), <code>SP-0158</code> Чревоугодие (7.1 КБ), <code>SP-0160</code> Лень (8.3 КБ), <code>SP-0161</code> Зависть (8.1 КБ), <code>SP-0162</code> Гордыня (7.5 КБ) — у всех шести вселенная не определена. По каждому греху материала во второй половине больше, чем в первой, и ни один килобайт оттуда не дошёл до статей.</p>\n<p>Третье, локальное: происхождение. Грехи объявлены существами минимиров, <code>MR-0094</code> «Минимиры» — 12.5 КБ и статья есть, но связи между двумя записями никто не провёл.</p>\n<h3>С чего начать</h3>\n<p>В базе, адрес точный. <code>ID-0111</code> — там тот самый список тринадцати добродетелей и предложение «опираясь на них придумать че нибудь», 5.4 КБ. <code>SP-0156</code> «Семь грехов (магия по грехам)», 11.8 КБ — ближайшее к вопросу «что грехи умеют», которого в статье нет вовсе. Дальше <code>SP-0163</code> «Благословение» (86.8 КБ, 2025-01-06 — 2025-05-31): мера «3 благословенных» имеет смысл только вместе с тем, что такое один благословенный.</p>\n<p>В архив — за датой. Здешнее окно w0070, 2025-01-06, id 278975–278984, единственное. А семёрка развёрнута заметно позже: <code>PS-0187</code> и <code>PS-0191</code> датированы 2025-01-23 — 2025-01-24, у гнева (<code>PS-0177</code>) след тянется ещё раньше, с 2024-12-24. Значит идти в конец января 2025 и проверять одно: сохранилось ли там определение грехов как существ из минимиров или семёрку начали с чистого листа. Там же искать объявление вселенной — в самом окне она не названа, «Апостол» проставлен по дате.</p>\n<h3>Как развивалось</h3>\n<p>Заявили одно, развили другое. Миколай вносит пару «добродетели — грехи» как основу благословения и выкладывает готовый список из тринадцати пунктов с формулировками. Слава отвечает не на это: он даёт определение грехов как существ из минимиров силой в трёх благословенных — то есть переводит тему из механики сил в бестиарий. Ограничения как отдельного шага здесь нет, есть подмена предмета. Забыли сразу же: Миколай закрывает собственное предложение сам — «эх», «ладно», — и в этом окне тема не возобновляется. Вернулись к грехам через две с половиной недели, 2025-01-23, и вернулись не сюда: продолжение лежит в другом ряду записей.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для существ минимиров дорога в наш мир названа прямо: они приходят «через край своего мира», и оттуда же происходят драконы, упыри, оборотни, леший. Грехи объявлены существами тех же самых минимиров. Попадают ли они сюда тем же краем, попадают ли вообще или заперты у себя — не сказано. Для одной группы жителей минимиров переход описан, для соседней, названной оттуда же родом, — нет.</p>\n<h3>Отклик</h3>\n<p>Понравилась мера. Не «очень сильные», не шкала от одного до десяти — «по силе 3 благословенным». Единицей измерения в этом мире оказывается человек с благословением, и всё остальное считают в нём; из одной короткой фразы сразу видно, где у мира ноль. Рядом хорошо видно и то, как разговор сворачивает не туда, куда его вели: приносят тринадцать добродетелей с расписанными формулировками, почти готовую систему, а получают одну строчку про тварей силой в три благословенных. «эх», «ладно». Список жалко, но ответ по-своему честнее — в нём грех не этическая категория, а то, что придёт.</p></div>", "r": []}];</script>
