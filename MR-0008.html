<script>const BASE="";const DOCNAME="Герострат";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0008-S01", "MR-0008--ustroystvo"], "h": "<p>Герострат — не место, а термин, от которого разворачивается устройство мира: название человека со сверхспособностями. Предложено Миколаем 2024-05-07 (окно w0032, id 166905–166922) и принято.</p>\n<p>Принцип, по которому подбиралось имя, оговорён до самого имени. Миколай спрашивает: «Тебе обязательно нужна логика / Или главное чтоб звучало прикольно?» — Слава отвечает: «Звучала прикольная». Сразу после этого: «Тогда чел со сверх способностями это Герострат».</p>\n<p>Историческая отсылка отброшена сознательно и прямо: «Похуй на изначальную коннотацию имени, это будет нарицательное для человека со способностями». То есть в этом мире слово работает как нарицательное обозначение носителя сверхспособностей, а не как имя собственное.</p>\n<p>Дальше от Герострата идёт энергетический слой. Название энергии запрашивает Слава («А название энергий ?»), Миколай даёт: <strong>Лиомат</strong>. У этого названия, в отличие от Герострата, смысл есть: «Объединение конечных частей слов означающих солнце и кровь на греческом».</p>\n<p>Как энергия и способности соотносятся, задаёт Слава (id 166922): «я хочу что бы это энергий была у Геростратов и типо они это энергий используют способности». Лиомат, таким образом, — то, чем Геростраты пользуются, чтобы применять способности.</p>\n<p>Отдельное название для самих сверхспособностей на этот момент не закреплено: предложенный вариант отклонён (см. ниже), а Слава от вопроса отмахивается: «Похую на название сверхспособности».</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0008-S02", "MR-0008--naselenie"], "h": "<p>Названы две категории.</p>\n<p><strong>Геростраты</strong> — люди со сверхспособностями, владеющие энергией лиомат и применяющие через неё способности.</p>\n<p><strong>Насильно пробуждённые</strong> — «там будут насильно пробужденый обычный людий которых заставили пробудить данную энергию, при этом самой сверхсилый у них не будет, а только усиленный за счёт этой энергий». То есть это обычные люди, у которых лиомат пробудили принудительно; сверхспособности у них при этом не появляются, они получают только усиление за счёт энергии.</p>\n<p>Кто именно их заставляет пробуждать энергию, зачем и что происходит с ними дальше — в переписке не сказано.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0008-S03", "MR-0008--mesto-vo-vselennoy"], "h": "<p>Записано во вселенную «игра бога»; сама вселенная в этом окне не названа.</p>\n<p>В файле как связанное перечислено: Лиомат, Отряд сильнейших, Сверхчеловек с идеальным контролем. Из них в самой переписке проработан только Лиомат — как энергия Геростратов. Связь с Отрядом сильнейших и со Сверхчеловеком с идеальным контролем в этих сообщениях не проговаривается.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0008-S04", "MR-0008--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-05-07</strong> (окно w0032, id 166905–166922). Единственная версия. За один вечерний обмен закреплены: принцип именования (по звучанию, а не по логике), термин «Герострат», отказ от исторической коннотации, название энергии «Лиомат» с греческой этимологией, схема «энергия у Геростратов — через неё способности» и категория насильно пробуждённых.</p>\n<p><strong>Отклонённый вариант.</strong> Для названия самих сверхспособностей Миколай предложил <strong>макроскилы</strong>: «Ну есть идейка назвать макроскилы». Тут же забраковал — «Но слишком длинно и неоч», — и тут же передумал: «Хотя / Не мне понравилось». Слава на этот вариант не отвечает, он переводит разговор на энергии («А название энергий ?») и снимает вопрос целиком: «Похую на название сверхспособности». Итог по макроскилам в переписке не подведён.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0008-S05", "MR-0008--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вселенная не названа.</li>\n<li>Название для самих сверхспособностей не выбрано; судьба варианта «макроскилы» осталась нерешённой.</li>\n<li>Не сказано, откуда у Геростратов берётся лиомат и как он пробуждается естественным путём.</li>\n<li>Не сказано, кто и зачем насильно пробуждает энергию у обычных людей.</li>\n<li>Не объяснено, почему энергия называется через солнце и кровь — этимология названа, её связь с механикой нет.</li>\n<li>Связь Герострата с Отрядом сильнейших и со Сверхчеловеком с идеальным контролем в этом окне не проговорена.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0008--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0048.html\">Отряд сильнейших (команда «А»)</a>, <a href=\"GR-0052.html\">Геростраты</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0014.html\">игра бога</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0008--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-05-07</td>\n<td>166905–166922</td>\n<td>w0032</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0008-gerostrat.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0008--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0008.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
