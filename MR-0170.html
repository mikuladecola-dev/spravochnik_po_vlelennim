<script>const BASE="";const DOCNAME="Группировка сестры";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0170-S01", "MR-0170--ustroystvo"], "h": "<p>Группировка сестры названа одной строкой в перечне сил вселенной:</p>\n<div class=\"q\"><p>«Группировка сестры ( который теперь будет дочерью Имитатора. И я не знаю какие у неё будет цель)»</p></div>\n<p>Строка содержит три вещи. Первое: группировка существует и названа по «сестре» — то есть по фигуре, вокруг которой она собрана. Второе: сама эта сестра на момент реплики переопределена — «теперь будет дочерью Имитатора»; слово «теперь» показывает, что это правка более раннего состояния, но чем она была до правки, в этом сообщении не сказано. Третье: цель у группировки отсутствует не как замысел, а как незаполненное место — «И я не знаю какие у неё будет цель».</p>\n<p>Ни численность, ни структура, ни название самой группировки (кроме как по сестре), ни место базирования не названы.</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0170-S02", "MR-0170--naselenie"], "h": "<p>Поимённо назван один человек — сестра, она же дочь Имитатора. Её имя в переписке не дано, она обозначается только через родство. Кто ещё входит в группировку — не сказано.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0170-S03", "MR-0170--mesto-vo-vselennoy"], "h": "<p>Группировка стоит в перечне рас и организаций вселенной (2025-11-17, id 385768–385769), в блоке, который открывается словами:</p>\n<div class=\"q\"><p>«Ну и дальше расы и организации который равны по силе с друг другом.»</p></div>\n<p>То есть группировка сестры поставлена в один силовой ряд с детьми мирового древа, каменным челиком с преступной организацией, азуриэль, правительственной организацией, церковью с паладинами, организацией Виктора и пернатыми. Выше этого ряда стоят коты («сильнеший», их девять) и апостолы («вторая по силе раса на земле»).</p>\n<p>В том же перечне, тремя строками ниже, названа «Правителская организации по контролю всех этих. Сильнейшая там девченка что может изменять мир волнами». Слова «всех этих» относятся к перечисленному ряду, в который входит и группировка сестры. Прямого разговора о том, как правительственная организация взаимодействует именно с группировкой сестры, в переписке нет.</p>\n<p>Внешняя привязка группировки — Имитатор, через дочь. Что такое Имитатор и какое положение он занимает во вселенной, в этом сообщении не объясняется, и в перечне сил он отдельной строкой не идёт.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0170-S04", "MR-0170--kak-menyalsya-po-versiyam"], "h": "<p><strong>2025-11-17 (id 385768–385769, окно w0109).</strong> Единственная версия. Внутри неё зафиксирована одна правка: сестра переопределена как дочь Имитатора — «который теперь будет дочерью Имитатора». Прежнее её положение в этом сообщении не приводится. Цель группировки на этот момент не придумана.</p>\n<p>В повторном проговаривании перечня 2025-12-06 (id 393286–393290) строка про группировку сестры идёт дословно та же, но база засчитывает его как отдельную версию для других сущностей того же перечня (<a href=\"MR-0168.html\">Тёмная изнанка</a>, <a href=\"MR-0175.html\">Орден по убийству котов</a>), а для группировки сестры вторая версия не заведена — новых сведений о ней не появилось.</p>", "r": [["Тёмная изнанка", "MR-0168.html"], ["Орден по убийству котов", "MR-0175.html"]]}, {"t": "Пробелы", "a": ["S05", "MR-0170-S05", "MR-0170--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Цель организации не придумана — прямо сказано автором.</li>\n<li>Имя сестры не названо.</li>\n<li>Чем сестра была до правки «теперь будет дочерью Имитатора» — не сказано.</li>\n<li>Кто такой Имитатор и как он связан с самой группировкой (а не только с её главой через родство) — не сказано.</li>\n<li>Состав, численность и структура группировки не названы.</li>\n<li>Отношения с другими силами перечня, включая правительственную организацию по контролю, не разобраны.</li>\n<li>Собственное название группировки, кроме описательного «группировка сестры», отсутствует.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0170--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0168.html\">Тёмная изнанка</a>, <a href=\"MR-0175.html\">Орден по убийству котов</a></li>\n<li><strong>Упомянут в мирах:</strong> <a href=\"MR-0175.html\">Орден по убийству котов</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0060.html\">Группировка сестры (она же группа злодеев дочери Имитатора)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0008.html\">Оам</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0170--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-11-17</td>\n<td>385768–385769</td>\n<td>w0109</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0170-gruppirovka-sestry.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0170--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0170.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
