<script>const BASE="";const DOCNAME="Грань";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0087-S01", "SP-0087--mehanika"], "h": "<p>Грань — не отдельная способность, а механика перехода, надстроенная над системой сосуда. Определение дано Славой одним куском (2024-07-05, id 197938):</p>\n<div class=\"q\"><p>«Что есть грань<br>Когда сосуд становится достаточно сильным он может на некоторой время черпать куда большей силы видо изменяй и способность и носителя<br>Так могут лишь люди сильным сосудом<br>А у Нуара изначально был развить сосуд и 2 личность грань, это видео измененный он»</p></div>\n<p>То есть при достаточно сильном сосуде носитель на некоторое время черпает куда большую силу, и видоизменяется при этом и сама способность, и он сам. Видоизменение затрагивает и внешность: у Имитатора «внешка как серафим» (id 197941), с оговоркой «Ну не полноценный серафим» (id 197942); у Кая «внешка как рогатый демон» (id 197943).</p>\n<p>Видоизменение способности показано на примере Имитатора: «Имитатор видо изменяет способности. Вместо имитация, создания множество других способностей, то бишь он может сам придумывать способности» (id 197941).</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0087-S02", "SP-0087--ogranicheniya-i-cena"], "h": "<p>Доступ: «Так могут лишь люди сильным сосудом» (id 197938).</p>\n<p>Цена: «Кстати после использования грани ты не можешь пользоваться способностью некоторая время неделю наверное» (id 197957). Срок дан с оговоркой «наверное» — точное значение не зафиксировано.</p>\n<p>Исключение из правила цены: «Это правила обходить только Нуар» (id 197961). Обоснование — «Так он с рождения со сильном сосудом. И если он на неделю потерять способности. Минус остров» (id 197963).</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0087-S03", "SP-0087--nositeli"], "h": "<ul>\n<li><strong>Нуар.</strong> Сосуд развит с рождения. Его вторая личность и есть его грань — «это видео измененный он» (id 197938). Единственный, кто обходит недельный откат.</li>\n<li><strong>Имитатор.</strong> «Кстати грань может пользоваться и кай и Имитатор» (id 197940). В грани его способность меняется с имитации на создание множества других способностей — он может сам придумывать способности. Внешность — как серафим, но не полноценный серафим.</li>\n<li><strong>Кай.</strong> Тоже назван среди тех, кто может пользоваться гранью, но на момент разговора не умеет: «Он по сюжету научиться делать грань», «А так который сейчас не может использовать грань» (id 197948–197949). Внешность в грани — рогатый демон. В том же обмене Миколай отмечает про Кая: «и его считают богом» (id 197945).</li>\n</ul>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0087-S04", "SP-0087--kak-menyalas-po-versiyam"], "h": "<p>Вся разработка уместилась в один разговор ночью 2024-07-05 (окно w0044), но раскладывается на три состояния.</p>\n<p><strong>Версия 1 — 2024-07-05 (id 197932–197940).</strong> Введено само понятие: грань как временное черпание большей силы с видоизменением способности и носителя, доступное только сильным сосудам. Сразу же оговорено, что у Нуара сосуд развит с рождения, а его вторая личность и есть его грань. В конце — добавление, что гранью могут пользоваться Кай и Имитатор.</p>\n<p><strong>Версия 2 — 2024-07-05 (id 197940–197949).</strong> Раскрыто, что именно грань даёт Имитатору и Каю: видоизменение способности и внешности. Введено ограничение по Каю — сейчас не умеет, научится по сюжету.</p>\n<p><strong>Версия 3 — 2024-07-05 (id 197956–197965).</strong> Введена цена: неделя без способности после использования. Тут же введено единственное исключение — Нуар, с обоснованием «минус остров».</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0087-S05", "SP-0087--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Грань стоит поверх системы сил и завязана на понятие сосуда: сила сосуда — единственное названное условие доступа. Собственной способностью грань не является — она видоизменяет ту способность, которая у носителя уже есть.</p>\n<p>Отдельно связана со второй личностью Нуара: вторая личность прямо приравнена к его грани, а не описана как что-то параллельное.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "SP-0087-S06", "SP-0087--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Не сказано, чем сосуд «становится достаточно сильным» — как он развивается и есть ли порог, кроме врождённого случая Нуара.</li>\n<li>Длительность самой грани («на некоторой время») не названа.</li>\n<li>Срок отката дан приблизительно: «неделю наверное». Точная величина осталась нерешённой.</li>\n<li>Не сказано, как Кай научится делать грань — только что научится по сюжету.</li>\n<li>Не сказано, есть ли у Нуара вообще какая-либо цена за грань, кроме того, что недельное правило его не касается.</li>\n<li>Реплика «и его считают богом» (id 197945) относится к Каю, но связь этого с гранью в переписке не раскрыта.</li>\n<li>Список носителей грани, кроме Нуара, Кая и Имитатора, не назван — не сказано, полный ли он.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0087--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0104.html\">Нуар</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0087--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-05</td>\n<td>197932–197940</td>\n<td>w0044</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-05</td>\n<td>197940–197949</td>\n<td>w0044</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-05</td>\n<td>197956–197965</td>\n<td>w0044</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0087-gran.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0087--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0087.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
