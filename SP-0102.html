<script>const BASE="";const DOCNAME="метаболизм вампиров";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0102-S01", "SP-0102--mehanika"], "h": "<p>Объяснение, почему вампиры худые и очень сильные. Изложено целиком в одном сообщении (2024-08-11, id 218122) как отступление внутри истории про спасение Асеши.</p>\n<p>Отправная точка — наблюдение: «вы когда-нибудь видели вампиров с лишним весом. я в массовой культуре тоже не видел». Дальше идёт разворот привычного объяснения: «так вот они все худые не из-за того что могут превращаться в летучих мышей. и от того они очень сильные». То есть сила и худоба — не следствие превращения самого по себе, а следствие того, что превращение приносит с собой устройство мышиного тела.</p>\n<p>Механика строится на летучей мыши: «у мышей невероятно быстрый метаболизм и короткий кишечник, кстати у вампиров он тоже короткий, намного короче чем у людей». Дальше — итог, сформулированный автором для тех, кто «не поняли прикол»: «еда быстрее переваривается и выходит из организма, и эффективней его наделяет энергией».</p>\n<p>Из этого следует внешний результат превращения, показанный на Ник-Хане после того, как он обернулся мышью и перенёс людей за две тысячи километров: «представьте себе бодибилдера с мёртвой серой кожей. да, его метаболизм убрал весь жир, но мускулатуру зато очень возбудил и сделал невероятно объёмной». То есть метаболизм не просто сжигает жир, а перегоняет тело в мускулатуру — жир уходит, мышцы раздуваются.</p>\n<p>Скорость, которую даёт эта сила, в истории измерена: Ник-Хан живёт «в пещере за 2 тысячи километров от моего города», а прибыл «через 1 минуты и 34 секунды», при условии ночи — «благо ночь была».</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0102-S02", "SP-0102--ogranicheniya-i-cena"], "h": "<ul>\n<li>Метаболизм работает только при регулярном превращении в летучую мышь. Если превращаться редко, тело набирает вес, несмотря на сильный метаболизм. Формулировка автора про Ник-Хана: «он много ест и редко превращается в летучую мышь, метаболизм у него на самом деле даже сильнее чем у обычного вампира». Итог: «как вы заметили метаболизм у него всё ещё работает, но он его ограничивает». То есть ограничение накладывает не природа, а образ жизни носителя.</li>\n<li>Альтернатива обычного вампира названа тут же и отвергнута для Ник-Хана: «только он не спит в гробу тысячелетиями». Сон в гробу веками поставлен рядом с превращением как второй режим, при котором метаболизм не срывается.</li>\n<li>Немедленная цена превращения — работа кишечника. Сразу после того, как Ник-Хан обернулся и перенёс людей: «хотя его живот сильно прихватило и он захотел в туалет». Эта цена в истории оказывается ресурсом: именно из неё рассказчик получает гуано для <a href=\"SP-0103.html\">снятие окаменения гуано и спиртом</a>.</li>\n<li>Ночь как условие быстрого перемещения проговорена вскользь: «благо ночь была». Что было бы днём, не сказано.</li>\n</ul>", "r": [["снятие окаменения гуано и спиртом", "SP-0103.html"]]}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0102-S03", "SP-0102--nositeli"], "h": "<p>Правило заявлено как общее для всех вампиров: они все худые и очень сильные, кишечник короче человеческого.</p>\n<p>Ник-Хан — единственный конкретный носитель в переписке и одновременно исключение по внешнему виду. Он вампир с ожирением; причина не в сломанном метаболизме, а в поведении: «он каждый день поедает тонны жареных сверчков за просмотром сериальчиков и за написанием рецензий по ним». Метаболизм у него сильнее, чем у обычного вампира. Живёт в пещере. Его имя автор комментирует отдельно: «более нелепого имени конечно не придумать, но что поделать, тогда это было достаточно красивое и редкое имя».</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0102-S04", "SP-0102--kak-menyalas-po-versiyam"], "h": "<p><strong>2024-08-11 (id 218121–218123).</strong> Полная формулировка правила. Всё, что известно о механике, изложено здесь: короткий кишечник от летучей мыши, быстрое переваривание, эффективная отдача энергии, худоба и сила, случай Ник-Хана как ограничение изнутри, тело бодибилдера с мёртвой серой кожей после превращения и позыв в туалет. Позже не переписывалось.</p>\n<p><strong>2024-08-12 (id 218236–218246).</strong> В споре со Славой всё объяснение сведено к одному тезису. Слава: «я про то что твой вампир ничем не выделяется». Ответ Миколая — «он более сильный» (id 218240). Больше о метаболизме в этом обмене ничего нет; спор уходит на жанр (Слава требует «Ужастик», «Трагедия», «Но сука не как повседневка»), а Миколай отвечает, что «там есть элемент трагедии но подано в легкой форме», и что серьёзные работы начались позже: «это уже после мы начали делать такие работы».</p>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S05", "SP-0102-S05", "SP-0102--otklonennye-varianty"], "h": "<p>Отклонённых вариантов самой механики в переписке нет. Отвергнуто внутри текста только ходовое объяснение, от которого автор отталкивается: что вампиры худые «из-за того что могут превращаться в летучих мышей» — тут же уточняется, что дело не в превращении как таковом, а в коротком кишечнике и скорости метаболизма.</p>\n<p>Возражение Славы — не по механике, а по персонажу: вампир ничем не выделяется, «При этом без какого либо его раскрытия либо изуминки этот перс выглядит так словно про него забудут» (2024-08-12, id 218283, тот же спор). Миколай на это метаболизм не переписывал; аргумент, который он выдвигает в защиту — «сука ну да, это угар был, но ты сам сказал что главное чтобы был монстр хули не нравится».</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S06", "SP-0102-S06", "SP-0102--svyaz-s-drugimi-sposobnostyami"], "h": "<ul>\n<li><a href=\"SP-0103.html\">снятие окаменения гуано и спиртом</a> (снятие окаменения гуано и спиртом) — прямо вытекает из этой способности. Гуано для состава берётся у Ник-Хана после превращения в летучую мышь, а само действующее вещество объяснено через мышиную физиологию. Момент перехода одной способности в другую в тексте отмечен: «его живот сильно прихватило и он захотел в туалет. и тут я всё понял».</li>\n<li>Сила вампиров как таковая — часть этой же способности, не отдельная. Она нужна в истории потому, что окаменевшую Асешу нельзя поднять: «это же теперь каменная статуя которая весит не одну сотню килограмм».</li>\n</ul>", "r": [["снятие окаменения гуано и спиртом", "SP-0103.html"]]}, {"t": "Пробелы", "a": ["S07", "SP-0102-S07", "SP-0102--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Не сказано, как часто вампиру нужно превращаться, чтобы метаболизм не «ограничивался».</li>\n<li>Не сказано, почему у Ник-Хана метаболизм сильнее, чем у обычного вампира.</li>\n<li>Не сказано, как связаны между собой два режима — превращение в мышь и сон в гробу тысячелетиями. Названы рядом, соотношение не разобрано.</li>\n<li>Не сказано, чем питаются вампиры вообще: у Ник-Хана это жареные сверчки, кровь в этом фрагменте не упоминается.</li>\n<li>Не сказано, есть ли предел скорости и дальности перемещения; известен один замер — две тысячи километров за 1 минуту 34 секунды ночью.</li>\n<li>Не сказано, что происходит днём и обязательна ли ночь для превращения.</li>\n<li>Не сказано, обратим ли эффект «бодибилдера»: возвращается ли Ник-Хан к прежнему виду и через какое время.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0102--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0103.html\">снятие окаменения гуано и спиртом</a></li>\n<li><strong>Упомянут в способностях:</strong> <a href=\"SP-0103.html\">снятие окаменения гуано и спиртом</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0044.html\">Вампиры</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0102--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-11</td>\n<td>218121–218123</td>\n<td>w0052</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-08-12</td>\n<td>218236–218246</td>\n<td>w0052</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0102-metabolizm-vampirov.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0102--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0102.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
