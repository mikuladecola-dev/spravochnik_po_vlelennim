<script>const BASE="";const DOCNAME="Логос номос";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0058-S01", "SP-0058--mehanika"], "h": "<p>Слова носителя имеют силу закона. Формулировка Миколая: «Логос номос - чел слова которого имеют вес, ну тобиж как чел из магичеки говорящий морепродуктами. Например скажет умри и чел умрёт, скажет дереву вырасти и оно вырастет» (2024-05-07, id 166816).</p>\n<p>Названы два примера действия: приказ «умри», от которого человек умирает, и приказ дереву расти, от которого оно вырастает. То есть сказанное исполняется и на живых существах, и на растениях.</p>\n<p>Название расшифровано автором тут же: «Это \"слово - закон\" по гречески если что» (id 166818).</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0058-S02", "SP-0058--ogranicheniya-i-cena"], "h": "<p>Ограничение при заявке намеренно оставлено незаполненным — Миколай передал его соавтору: «Ну а ограничение попробуй сам придумать интересное, а я пока съедусь с мысли чтобы прийти со свежей головой» (id 166816).</p>\n<p>Позже Миколай возвращается к этому же месту как к способу сделать способность небанальной: «Но можно условия добавить / Особенные / И ограничения новые / И тогда сойдёт за новую» (id 166821–166824).</p>\n<p>Ни условий, ни ограничений в окне не придумано.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0058-S03", "SP-0058--nositeli"], "h": "<p>Носитель — боец, заявленный в отряд сильнейших. Имени в переписке нет, персонаж назван только через способность: «чел слова которого имеют вес».</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0058-S04", "SP-0058--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-05-07 (id 166814–166828, окно w0032).</strong> Единственная версия. Миколай выкладывает заявку целиком: механика, пример, расшифровка названия и просьба придумать ограничение. Сразу просит оценку: «Ток сразу пиши хуйня или нет» (id 166817).</p>\n<p>Реакция Славы сдержанная: «Ну чёт я хотел более новой» (id 166819). Миколай соглашается с претензией («Понимаю», id 166820) и предлагает вытянуть способность за счёт условий и ограничений, а не за счёт замены. Довод в пользу того, что вторичность тут не только у него: «А то ты не первый о бессмертии заговорил» (id 166825).</p>\n<p>Слава на это: «Ну можно, ну ты ещё чего-нибудь подкинь» (id 166827). Миколай отвечает «Вщ есть божественные способности» (id 166828) — на этом кусок обрывается.</p>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S05", "SP-0058-S05", "SP-0058--otklonennye-varianty"], "h": "<p>Прямого отказа нет. Способность не забракована, но и не принята без оговорки: претензия Славы — недостаточная новизна («хотел более новой»). Договорённость по итогу — оставить как есть и добить особыми условиями и ограничениями, чтобы «сойдёт за новую».</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S06", "SP-0058-S06", "SP-0058--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Способность заявлена в отряд сильнейших.</p>\n<p>В разговоре рядом упомянуты бессмертие (как пример того, что оба соавтора берут неоригинальные идеи) и «божественные способности», которые Миколай называет как следующее направление для перебора. Связи с логос номос ни у того, ни у другого в переписке не названо.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "SP-0058-S07", "SP-0058--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Ограничение так и не придумано в окне.</li>\n<li>Особые условия, которые должны были сделать способность «более новой», не названы.</li>\n<li>Не сказано, кто носитель.</li>\n<li>Не сказано, есть ли пределы у того, что можно приказать, — примеры даны, границы нет.</li>\n<li>Не сказано, действует ли приказ на любого слышащего, нужно ли обращение к конкретной цели, работает ли способность на самом носителе.</li>\n<li>Оценка «хуйня или нет», которую Миколай запрашивал прямо (id 166817), в явном виде не дана.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0058--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0048.html\">Отряд сильнейших (команда «А»)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0014.html\">игра бога</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0058--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-05-07</td>\n<td>166814–166828</td>\n<td>w0032</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0058-logos-nomos.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0058--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0058.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
