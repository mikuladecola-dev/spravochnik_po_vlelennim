<script>const BASE="";const DOCNAME="Цена жизни";
const LEAD="";
const CH=[{"t": "Содержание", "a": ["S01", "IS-0088-S01", "IS-0088--soderzhanie"], "h": "<p>Рассказ Славы, скинутый в чат 2026-02-16 в 22:31 (окно w0118, id 433701–433713). Название дано самим автором в отдельном сообщении перед текстом — «Цена жизни» (id 433706). Написан, по словам автора, «на прошлое недели» относительно 2026-02-16.</p>\n<p>Текст целиком — одна сцена, спор двух мужчин.</p>\n<p>Начало: мужчина с каштановыми волосами просит успокоиться и говорит, что «Мы должны всё решить как цивилизованный людей». Черноволосый — Ден — отвечает, что решать нечего. Первый настаивает, что «ответ и так очевиден», и тыкает пальцем Дену в грудь. Ден отталкивает руку и уточняет: очевиден тот ответ, «который тебе по-душе», и добавляет, что нельзя «единолично решить принять решение, о чужой жизни». Мужчина отвечает «могу!» и собирается уходить, Ден преграждает ему путь.</p>\n<p>Предмет спора: подросток убил Криса. Ден настаивает, что «он не желал ему смерть. Это вышло случайно», ссылаясь на слова самого пацана, «что хотел лишь подшутить». Второй мужчина спрашивает про прежние отношения этих двоих и говорит, что слышал и видел: «Ден ты защищаешь того, кто издевался над ним, лишь из зависти». Ден повторяет: «но он не хотел его убивать. Всё это вышло случайно» и «да и он же ещё ребёнок».</p>\n<p>На это мужчина равнодушно повторяет «Он же ребёнок» и после долгого молчания хватает Дена за плечо и ведёт в другое здание — в комнату, где хранились трупы. Охранники встают и здороваются. Мужчина открывает один из мешков и спрашивает, знает ли Ден, кто это. Ден узнаёт Криса. Здесь же в тексте впервые звучит имя второго — Ден говорит: «Бен успокойся. Я не это имеет виду».</p>\n<p>Бен «уставился красными глазами на Дена». Ден договаривает свою позицию: «то что пацани ещё ребёнок. Он не до конца осознаёт свои действия. Поэтому ему надо дать второй шанс. Тем более это не он убил Криса».</p>\n<p>Бен резко хватает голову Дена и опускает её к голове Криса, крича: «Второй шанс!!», «скажи это Крису. Крису кто-нибудь давал второй шанс», «ты хотя бы понимаешь. Это всё конец для него!». В этот момент по щекам Бена начинают скатываться слезинки. Его монолог: «всё что он мог прожить. Всё будущее.... Всё счастье, всю горечь.... Всё что он мог прожить, всё что он мог изменить. Всё закончилось и не будет чудесного воскрешения». Пока он говорит, он сильнее давит на голову Дена, чтобы тот лучше разглядел «лицо, которой больше не улыбнеться и не заплачет». Заканчивает вопросом: «и ты хочешь, чтобы я просто отпустил того, кто отнял чужое будущее?»</p>\n<p>Ден отвечает: «Бен мы его накажем. Только не так, как хочешь ты», и держится изо всех сил, чтобы не приблизиться к мёртвому лицу. Бен отпускает его голову, отходит и спрашивает: «почему?»</p>\n<p>Финал спора: Ден говорит «потому что мы с тобой не имеем права судить». Бен усмехается: «А кто имеет право. Бог что-ли или дьявол». Ден ссылается на инстанцию — «совет принят объективное решение». Бен смеётся и отвечает: «с каких пор люди стали объективными. Не тогда когда мир был пропитан законам и правилам, не сейчас, когда мы дохнем как мухи, чтобы хоть что-то защитить. Люди никогда не будет объективными». Последние реплики Бена: «Поэтому хватит Ден» — устало, и «ты не остановишь меня своими словами. Тем более когда ты сам в них не до конца веришь». На этом текст обрывается.</p>\n<h3>Замысел за текстом</h3>\n<p>После публикации Слава объяснил исходную мысль (id 433712–433713): «Просто я подумал о разногласий», «Точнее чувство виновности и цены жизни». И дальше — замысел шире написанной сцены: «Я хотел написать историю о персонажей, что говорит о том что не виновен и представляет вполне разумный доводы ну мстительный дух его всё равно заебыввет».</p>\n<p>В самом скинутом тексте мстительного духа нет — есть только спор Дена и Бена. Как замысел с духом соотносится со сценой, в переписке не сказано.</p>\n<p>Собственная оценка автора сразу после публикации: «Просто хуйня» (id 433707).</p>", "r": []}, {"t": "Персонажи", "a": ["S02", "IS-0088-S02", "IS-0088--personazhi"], "h": "<ul>\n<li><strong>Ден</strong> — черноволосый. Позиция: подросток ещё ребёнок, не до конца осознаёт свои действия, убийство вышло случайно, надо дать второй шанс; наказать — но не так, как хочет Бен; судить они права не имеют, объективное решение принял совет.</li>\n<li><strong>Бен</strong> — мужчина с каштановыми волосами, к концу сцены с красными глазами и слезами. Позиция: ответ очевиден, второго шанса Крису никто не давал, люди объективными не были и не будут, словами его не остановить.</li>\n<li><strong>Крис</strong> — убитый ребёнок. В сцене присутствует только как тело в мешке в комнате, где хранились трупы.</li>\n<li><strong>Подросток-убийца</strong> — по тексту «тот пацан», который, по словам Дена, «хотел лишь подшутить», а по словам Бена — издевался над Крисом «лишь из зависти». Имени нет, в сцене не появляется.</li>\n</ul>\n<p>По базе история связана также с сущностью «Цикл повторений: Защитник / Защитник / Вина».</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "IS-0088-S03", "IS-0088--mesto-vo-vselennoy"], "h": "<p>Вселенная в переписке не объявлена; в базе история отнесена к Иссекаю по дате объявления.</p>\n<p>Из окружения в тексте названы только: «совет», который принимает объективные решения, здание с комнатой для хранения трупов и охраной, и состояние мира по реплике Бена — «сейчас, когда мы дохнем как мухи, чтобы хоть что-то защитить». Что это за совет, от чего защищаются и почему мрут, в переписке не раскрыто.</p>", "r": []}, {"t": "Состояние", "a": ["S04", "IS-0088-S04", "IS-0088--sostoyanie"], "h": "<p>Написана одна сцена, скинутая в чат целиком 2026-02-16 (id 433706). Написана «на прошлое недели» — точная дата не названа. Версия одна, переработок в переписке нет. Текст обрывается на реплике Бена; продолжения нет. Замысел с мстительным духом остался только замыслом.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "IS-0088-S05", "IS-0088--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вселенная не объявлена.</li>\n<li>«Совет» упомянут, но не раскрыт.</li>\n<li>Мир, где «мы дохнем как мухи», не описан — от кого защищаются, не сказано.</li>\n<li>У подростка-убийцы нет имени, он в сцене не появляется.</li>\n<li>Кем Ден и Бен приходятся Крису и подростку и по какому праву они вообще решают — не сказано.</li>\n<li>Замысел про героя, доказывающего, что не виновен, и про мстительного духа, который «его всё равно заебыввет», в написанном тексте не реализован; связь замысла со сценой не проговорена.</li>\n<li>Реакции Миколая на сам текст в переписке нет — он только спрашивает, когда тот успел написать.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["IS-0088--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0086.html\">Совет</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0005.html\">Иссекай</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["IS-0088--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-02-16</td>\n<td>433701–433713</td>\n<td>w0118</td>\n<td>Иссекай (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/istorii/IS-0088-cena-zhizni.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["IS-0088--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/IS-0088.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
