<script>const BASE="";const DOCNAME="Паладины";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0062-S01", "GR-0062--chto-eto"], "h": "<p>Паладины — мёртвые рыцари, оживлённые Виктором (<a href=\"PS-0308.html\">Виктор</a>) для верующих. Существуют при церкви: в переписке они всегда названы вместе с ней, самой формулировкой «Церковь с паладинами» (<a href=\"MR-0172.html\">Церковь с паладинами</a>). Отдельного разговора именно о паладинах — без церкви — в переписке нет; они заведены как названный коллектив, но за пределами церкви не описаны.</p>\n<p>Это не раса и не результат мутации. Паладинами становятся уже умершие люди (рыцари), поднятые чужим действием, — то есть это корпус, набранный оживлением, а не народ и не вид. По той же причине их «способность» — не их собственная: сильны они как тела, поднятые красным током (<a href=\"SP-0248.html\">Красный ток</a>).</p>\n<p>Первое и основное описание дано одной репликой в перечне сил мира (2025-11-17, id 385768):</p>\n<div class=\"q\"><p>«Церковь с паладинами ( мёртвыми рыцарями которых оживил один челик, для верующих) паладины до хрена сильный но их ней движения предсказуемый. Они больше как роботы с повторяющими движениями.»</p></div>\n<p>Тот же текст повторён без изменений при пересборке списка (2025-12-06, id 393287).</p>\n<p>Оговорка по разведке: как самостоятельная организация паладины в переписке не заводились. Названным коллективом они являются, но всё, что о них сказано, сказано внутри статьи о церкви и внутри реплик о Викторе и красном токе. При сведении базы статья может слиться с «Церковью с паладинами» (<a href=\"MR-0172.html\">Церковь с паладинами</a>).</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Чинить первым надо не паладинов, а красный ток. <code>SP-0248</code> — 3 ссылки, 8 184 знака базы, и природа его прямо помечена как неясность в обоих окнах (w0109, w0112). Через него объясняется всё в кластере сразу: почему паладины сильны, почему безмозглы, чем занят Виктор, чем владеет церковь. На нём висят <code>PS-0308</code> «Виктор» (4 ссылки, 9 225), <code>MR-0172</code> «Церковь с паладинами» (3 ссылки, 13 504), <code>MR-0173</code> «Организация Виктора» (2 ссылки, 4 149) — и сами паладины, у которых входящих ссылок ноль. Пока «ток» не описан, ни одна из этих записей вырасти не может: все четыре пересказывают одно и то же предложение из id 385768.</p></div>\n<div class=\"mnote\"><b>⚙ машинная заметка · С чего начать — не материал авторов</b>\n<p>В базе, и её там немного: <code>SP-0248</code> (8 184), <code>PS-0308</code> (9 225), <code>MR-0172</code> (13 504), <code>MR-0173</code> (4 149) — весь корпус про оживление в Оам укладывается в 35 КБ, и статья утверждает, что новых фактов сверх одной реплики в нём нет. Первым делом надо это проверить: не разъехались ли подробности про паладинов в карточку церкви, где базы больше всего.</p></div>", "r": [["Виктор", "PS-0308.html"], ["Красный ток", "SP-0248.html"], ["Церковь с паладинами", "MR-0172.html"]]}, {"t": "Состав", "a": ["S02", "GR-0062-S02", "GR-0062--sostav"], "h": "<p>Поимённого состава нет. Ни один паладин в переписке не назван по имени, численность корпуса не указана, отдельные фигуры из его числа не выделены.</p>\n<p>Названы только связанные лица и сущности, сами в состав паладинов не входящие:</p>\n<ul>\n<li><a href=\"PS-0308.html\">Виктор</a> — Виктор, тот, кто их оживил; в переписке сначала «один челик», имя дано прямо в реплике: «Давай челика назовём Виктор» (2025-11-17, id 385768).</li>\n<li><a href=\"SP-0248.html\">Красный ток</a> — красный ток, то, во что Виктор верит и чем оживляет.</li>\n<li><a href=\"MR-0172.html\">Церковь с паладинами</a> — церковь, при которой паладины состоят.</li>\n</ul>", "r": [["Виктор", "PS-0308.html"], ["Красный ток", "SP-0248.html"], ["Церковь с паладинами", "MR-0172.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0062-S03", "GR-0062--obschie-sposobnosti-gruppy"], "h": "<p>Про паладинов сказано ровно два свойства, и оба относятся ко всем сразу.</p>\n<p><strong>Сила.</strong> «Паладины до хрена сильный» (2025-11-17, id 385768; повтор 2025-12-06, id 393287). В перечне сил мира церковь с паладинами стоит в разряде тех, кто идёт после котов (сильнейших, их девять) и после апостолов (вторая по силе раса): «Ну и дальше расы и организации который равны по силе с друг другом» — и в этом ряду перечислена «Церковь с паладинами». То есть по силе они поставлены наравне с Детьми мирового древа, каменным человеком с его преступной организацией, Азуриэль, группировкой сестры, правительственной организацией, пернатыми, вампирами и прочими из того же списка.</p>\n<p><strong>Предсказуемость движений.</strong> «Но их ней движения предсказуемый. Они больше как роботы с повторяющими движениями». Это прямо названо оборотной стороной силы: сила огромная, но рисунок движений повторяющийся, и потому читаемый.</p>\n<p><strong>Отсутствие разума.</strong> Свойство идёт от способа оживления. Виктор «верит в красный ток что оживляет людей. И он многих оживил, но разум так и не смог в них оживить» (2025-11-17, id 385768). В сводке по красному току это записано как «работает на теле, но не на разуме», а оживлённые остаются марионетками. Позже Слава уточняет по самому Виктору: «Виктор, что воскрешает трупы, ну точнее делает из них марионеток» (2025-12-06, id 393308). Прямо к паладинам слово «марионетки» в переписке не применено — оно сказано об оживлённых Виктором вообще; паладины же названы оживлёнными именно им.</p>\n<p>Природа самого красного тока не объяснена — это отмечено в неясностях по <a href=\"SP-0248.html\">Красный ток</a> в оба окна (w0109, w0112).</p>", "r": [["Красный ток", "SP-0248.html"]]}, {"t": "Иерархия", "a": ["S04", "GR-0062-S04", "GR-0062--ierarhiya"], "h": "<p>Внутренней иерархии у паладинов в переписке нет: старших, командиров, рангов или деления на отряды не названо.</p>\n<p>Названо только внешнее подчинение по происхождению: паладинов оживил Виктор, и оживил их «для верующих». Паладины при церкви, а у Виктора при этом своя отдельная организация — она идёт в перечне отдельным пунктом: «Организация челика который и оживил паладинов». Кому паладины подчиняются в момент действия — церкви, верующим или Виктору — в переписке не сказано.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S05", "GR-0062-S05", "GR-0062--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>Виктор и его организация.</strong> Виктор — тот, кто оживил паладинов; его организация выделена в перечне сил отдельной строкой, рядом с церковью, но не как церковь. Отношения между церковью с паладинами и организацией Виктора не описаны.</p>\n<p><strong>Верующие.</strong> Паладины оживлены «для верующих» — назначение задано этой формулировкой и больше нигде не раскрыто.</p>\n<p><strong>Аскизы.</strong> В той же церкви находится матка Аскизов: «Матка. Находиться в церкви. И люди им поклоняются, а детей маток считают святыми» (2025-12-06, id 393465). Раньше об этом было сказано короче: «Матка Аскизов стало предметом веры для какой-то верологий» (2025-11-17, id 385768). Как паладины соотносятся с маткой и с её культом — в переписке не сказано.</p>\n<p><strong>Роль в конфликте.</strong> Церковь отнесена к промежуточным злодеям. Список складывался так (2025-12-06, id 393305–393306): «Вообще промежуточными злодеями будут Дети мирового древа И клан крылатых ( Серафим)», затем добавлено «Ну или церкви, да и люди иногда», затем «Да еще и Виктор, что воскрешает трупы, ну точнее делает из них марионеток» (id 393308). Отдельно от церкви паладины к какой-либо стороне конфликта не отнесены.</p>\n<p><strong>Общая обстановка.</strong> Реплика, задающая контекст всего перечня: «В нашем мире Оэм уже существует много сторон для конфликта» (2025-12-06, id 393290).</p>\n<p>Ни одной вражды, союза или столкновения паладинов с конкретной другой группой в переписке не названо.</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S06", "GR-0062-S06", "GR-0062--kak-menyalas"], "h": "<p><strong>2025-11-17, id 385768–385769 (окно w0109).</strong> Паладины заведены внутри общего перечня сил мира. Задано всё сразу: мёртвые рыцари, оживлены «одним челиком», оживлены для верующих, очень сильны, движения предсказуемые, «как роботы с повторяющими движениями». В соседних строках того же сообщения оживитель получает имя — «Давай челика назовём Виктор» — и заводится красный ток с его ограничением: оживил многих, «но разум так и не смог в них оживить». Тем же сообщением задана и матка Аскизов как предмет веры.</p>\n<p><strong>2025-12-06, id 393286–393290 (окно w0112).</strong> Перечень сил мира пересобран заново; кусок про церковь с паладинами повторён дословно, без правок. Изменений в описании паладинов нет — есть повтор.</p>\n<p><strong>2025-12-06, id 393305–393310.</strong> Церковь (а с ней и паладины как её часть) отнесена к промежуточным злодеям. Здесь же Виктор переописан точнее: не просто воскрешает трупы, а «делает из них марионеток».</p>\n<p><strong>2025-12-06, id 393464–393467.</strong> Уточнена матка Аскизов: она находится в церкви, люди ей поклоняются, детей маток считают святыми. Про паладинов в этом окне ничего не добавлено.</p>\n<p>Изменений в самом описании паладинов между 2025-11-17 и 2025-12-06 не произошло: формулировка воспроизведена слово в слово. Менялось окружение — статус церкви в конфликте, формулировка про Виктора, содержимое церкви.</p>\n<p>Отклонённых вариантов по паладинам в переписке нет: альтернативных версий их устройства не предлагалось и не забраковывалось.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "GR-0062-S07", "GR-0062--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет. Ни одного паладина по имени не названо.</li>\n<li>Численность не названа.</li>\n<li>Различий между отдельными паладинами не описано: чем один отличается от другого — в переписке не сказано.</li>\n<li>Внутренней иерархии нет: командиров, рангов, деления на отряды не названо.</li>\n<li>Не сказано, кому паладины подчиняются: церкви, верующим или Виктору.</li>\n<li>Природа красного тока не объяснена — это прямо зафиксировано как неясность в обоих окнах (w0109, w0112).</li>\n<li>Возвращение разума осталось нерешённым: «разум так и не смог в них оживить», и попыток решить это в переписке дальше нет.</li>\n<li>Внешность, вооружение, доспехи паладинов не описаны — сказано только «мёртвыми рыцарями».</li>\n<li>Не сказано, кем эти рыцари были при жизни и откуда взяты тела.</li>\n<li>Не сказано, могут ли паладины быть уничтожены и что для этого нужно, при том что предсказуемость движений названа их слабой стороной.</li>\n<li>Не описано ни одного эпизода с участием паладинов: где и против кого они действовали — в переписке нет.</li>\n<li>Отношения с маткой Аскизов, находящейся в той же церкви, не описаны.</li>\n<li>Границы между «паладинами», «церковью с паладинами» и «организацией Виктора» не проведены: в перечне это разные пункты, но как они разделены — не сказано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0062--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0308.html\">Виктор</a></li>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0248.html\">Красный ток</a></li>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0172.html\">Церковь с паладинами</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0062--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0062.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0062-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0062/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Чинить первым надо не паладинов, а красный ток. <code>SP-0248</code> — 3 ссылки, 8 184 знака базы, и природа его прямо помечена как неясность в обоих окнах (w0109, w0112). Через него объясняется всё в кластере сразу: почему паладины сильны, почему безмозглы, чем занят Виктор, чем владеет церковь. На нём висят <code>PS-0308</code> «Виктор» (4 ссылки, 9 225), <code>MR-0172</code> «Церковь с паладинами» (3 ссылки, 13 504), <code>MR-0173</code> «Организация Виктора» (2 ссылки, 4 149) — и сами паладины, у которых входящих ссылок ноль. Пока «ток» не описан, ни одна из этих записей вырасти не может: все четыре пересказывают одно и то же предложение из id 385768.</p>\n<p>Второе — дыра не мира, а справочника, но она мешает считать. Церковь заведена дважды: <code>GR-0061</code> (0 входящих ссылок) и <code>MR-0172</code> (3). Организация Виктора тоже дважды: <code>GR-0063</code> (0) и <code>MR-0173</code> (2). Все входящие уходят в версию-«мир», версия-«группа» стоит пустая. По группам кластер выглядит изолированным, по мирам — связанным; это одна и та же сущность, посчитанная два раза.</p>\n<h3>С чего начать</h3>\n<p>В базе, и её там немного: <code>SP-0248</code> (8 184), <code>PS-0308</code> (9 225), <code>MR-0172</code> (13 504), <code>MR-0173</code> (4 149) — весь корпус про оживление в Оам укладывается в 35 КБ, и статья утверждает, что новых фактов сверх одной реплики в нём нет. Первым делом надо это проверить: не разъехались ли подробности про паладинов в карточку церкви, где базы больше всего.</p>\n<p>Потом архив, две точки.</p>\n<ul>\n<li>2025-11-17, окно w0109, до id 385768. Перечень сил мира надиктован уже готовым, одним куском. Откуда взялась в нём церковь с паладинами и обсуждалась ли она до попадания в список — в собранном не видно; смотреть надо, что шло перед этим сообщением.</li>\n<li>2025-12-06, окно w0112. В этом же окне лежит <code>SL-0125</code> «Список нерешённых вопросов по миру Оэм» — 1 ссылка, статьи нет, 3 899 знаков, та же дата, что и пересборка перечня. Слава там сам записал, чего по миру не хватает. Это надо прочитать раньше, чем чинить что-либо руками.</li>\n</ul>\n<h3>Как развивалось</h3>\n<p>2025-11-17 (w0109, id 385768) — заявили всё сразу и одной строкой: мёртвые рыцари, оживитель, «для верующих», огромная сила, предсказуемые движения. Ограничили в том же сообщении, через несколько слов: «он многих оживил, но разум так и не смог в них оживить». 2025-12-06 (w0112, id 393287) — перечень пересобран, строка про паладинов повторена слово в слово, без единой правки. Менялось только окружение: церковь отнесена к промежуточным злодеям (393305–393306), Виктор переописан как делающий марионеток (393308), матка Аскизов уточнена (393464–393467). После 2025-12-06 паладины не появляются. Заявили и ограничили в одну минуту, дальше только повторили.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для красного тока причина ограничения названа прямо: тело поднимается, разум — нет, и это записано как свойство самого способа оживления. Для предсказуемости движений причины нет. Названо следствие — «Они больше как роботы с повторяющими движениями» — и на нём остановились: непонятно, растёт ли это из того же дефекта (нет разума — нет вариативности) или это отдельное свойство поднятых тел. Связка «сила и её оборотная сторона» проговорена наполовину: у половины причина есть, у половины только результат.</p>\n<h3>Отклик</h3>\n<p>«Разум так и не смог в них оживить» — сказано мимоходом, посреди перечня, между церковью и следующим пунктом списка, и это самая тяжёлая фраза во всём куске. Не «не захотел», не «не стал» — «не смог». Человек верит в свой ток, поднимает многих и каждый раз получает не того, кого поднимал. Сильно и то, что слабость паладинам придумали сразу и придумали не силовую: их не пересиливают, их прочитывают. «До хрена сильный, но движения предсказуемый» — это описание из другого жанра, чем «мёртвые рыцари при церкви», и оно точнее. Зацепило, какая охрана в итоге досталась верующим: сильная, послушная и пустая внутри. Ни один из двоих на этом не задержался, а место громкое.</p></div>", "r": []}];</script>
