<script>const BASE="";const DOCNAME="Триколор";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0339-S01", "PS-0339--proishozhdenie"], "h": "<p>Имя появилось 2025-12-17 в списке из четырёх, который Миколай кинул одним сообщением (id 399541):</p>\n<div class=\"q\"><p>триколор<br>радуга<br>градиент<br>монохром</p></div>\n<p>Разговор шёл о Пастырях — последователях Бога красок. До этого их было 21, причём причина числа не была придумана: на вопрос Миколая «и кстати почему их 21?» Слава ответил «Не знаю. Все же хоть как-то его прописать надо же» и «Я хуй знает» (399546–399548). Миколай предложил урезать до 12 «как по базе», объяснив: «ну было ж 12 апостолов у бога» (399552–399557). Слава согласился словами «Ну давай. А то мне в падлу придумывать всех 21» (399560).</p>\n<p>Тут же Миколай ввёл правило: «если че бог любит все че на 3 делится и чем меньше частное тем больше нравится» (399562). Слава сначала пошёл в сторону тройки — «Три», «Не сука», — и остановился на четырёх: «4 мне нравится больше», «Все четыре» (399565–399568). Миколай возразил, что у 12 «там частное 4», Слава на это ответил «Я Бог в своё вселенной» (399571–399573). Итоговым числом осталось четыре, и Триколор — одна из этой четвёрки.</p>\n<p>Авторство разделено прямой репликой Славы (399595–399596): «Ну по триколор можешь забыть. Её я уже придумал.» — «Но все остальное твое». Триколор — единственная из четвёрки, придуманная Славой; радугу, градиент и монохром взялся придумывать Миколай («я буду прилумывать / эти 4 у бога красок», 399593–399594, после чего Слава отделил Триколор).</p>\n<p>Пол — женский, по слову «её» в реплике Славы (399595).</p>", "r": []}, {"t": "Способности", "a": ["S02", "PS-0339-S02", "PS-0339--sposobnosti"], "h": "<p>В том же разговоре Слава заявил (399549): «Вообще одна из них будет управлять огнём. Точка....» Реплика формально относится к «одной из них», то есть к одной из четвёрки без указания имени; Миколай в дальнейшем сводит её к Триколор. Других способностей Триколор в переписке не названо.</p>", "r": []}, {"t": "Связи с другими", "a": ["S03", "PS-0339-S03", "PS-0339--svyazi-s-drugimi"], "h": "<ul>\n<li>Пастыри — Триколор входит в четвёрку Пастырей (последователей Бога красок). Остальные трое по списку 399541 / 399591: радуга, градиент, монохром.</li>\n<li>Бог красок — Пастыри принадлежат ему; Триколор через это связана с ним.</li>\n<li>Радуга — соседка по четвёрке. Про неё в том же разговоре сказано отдельное: способность «хромокей» (399542–399543) и «то есть сразу в сюжете будет монстром» (399545). К Триколор это не относится.</li>\n</ul>\n<p>В списке задач, который Слава составил под конец разговора (399583), отдельными пунктами идут «Придумать силы и мотивы 4 последователь» и «Придумать жизненные цикл апостолов и придумать кто их родитель» — то есть на момент разговора ни силы, ни мотивы, ни жизненный цикл, ни родитель Пастырей ещё не были определены.</p>", "r": []}, {"t": "Пробелы", "a": ["S04", "PS-0339-S04", "PS-0339--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Внешность не описана.</li>\n<li>Характер не описан.</li>\n<li>Владение огнём приписано «одной из них», а не Триколор по имени; отождествление сделано Миколаем, а не заявлено Славой (399549).</li>\n<li>Слава сказал, что уже её придумал, но в переписке не изложил, что именно придумал: ни сил, ни мотивов, ни биографии.</li>\n<li>Родитель апостолов и их жизненный цикл в переписке не названы — оставлены как задача на будущее (399583).</li>\n<li>Что с ней стало дальше, в переписке нет: разговор оборван переносом на встречу — «Поговорим когда ты приедешь?» (399585).</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0339--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0079.html\">Пастыри</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0079.html\">Пастыри</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0339--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-12-17</td>\n<td>399541–399597</td>\n<td>w0114</td>\n<td>Феня (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0339-trikolor.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0339--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0339.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
