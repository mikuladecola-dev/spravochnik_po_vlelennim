<script>const BASE="";const DOCNAME="Нефители (раса деревни-гиганта)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0034-S01", "GR-0034--chto-eto"], "h": "<p>Нефители — жители «деревни-гиганта», поселения в Азии на старейшем вулкане высотой около 3000 метров. Авторы категоризировали их именно как расу: Миколай предложил это сам (2024-12-11, id 269341–269345) — «ты говорил насчет рас», «думаю можно их категоризировать как расу», «рассказать о концепции». Ему это было важно не как история про персонажа, а как «введение концепции которая развита на определенной территории» (269342).</p>\n<p>Отдельно Миколай проговаривает, чем концепция отличается от истории: «ну историю сложнее написать чем концепцию», «поэтому концепцию хочу написать», «я её продумал примерно» (269353–269355).</p>\n<p>Главная особенность расы и места — облака. У нефителей есть наука о них — нефология, и, по формулировке Миколая, «для них эти знания бытовая и жизненная необходимость ибо уже не первое тысячелетие они исследуют их и имеют инструменты для использования в повседневной жизни» (269369).</p>\n<p>Происхождение расы дано исторической справкой (269369): было кочевое племя, «им было холодно на земле и они полезли к солнцу на гору», а когда забрались — поняли, что в них «врезалось» облако. Наблюдали за ним вблизи впервые, «это было интересно». После того как облако прошло сквозь них, проросли их семена («ну овощей всяких»), а «некоторых хватило недуг». Спускать больных было неудобно, «оставлять жалко и противоречит обычаям» — «вот и поселились там исследуя облака».</p>\n<p>Поимённых персонажей расы в переписке нет.</p>", "r": []}, {"t": "Общие способности группы", "a": ["S02", "GR-0034-S02", "GR-0034--obschie-sposobnosti-gruppy"], "h": "<p>Нефители «могут создавать облака, ловить и хранить их» (269369). Это описано как готовая продуманная система, а не как индивидуальный дар.</p>\n<p>Цикл производства облаков (269369):</p>\n<ul>\n<li>Реки находятся далеко за горами (269393). Чтобы деревня функционировала, нужна вода, поэтому «они прорыли каналы» и «эту воду пустили по кругу» (269395–269396). Канал для реки в деревню прорубили давно — «во первых потому что деревень без воды вблизи не бывает, а она была далеко».</li>\n<li>На канале установлены управляемые дамбы, которые периодически открывают.</li>\n<li>Вода течёт на раскалённые низменности и испаряется. Поверхность настолько горячая, что до 5 метров идёт «действительный пар», выше он частично превращается в туман, но продолжает подниматься.</li>\n<li>На высоте 2,5 км туман сталкивается с ветром, выходящим из-за гор, полученным течением. Ветер формирует из тумана облака.</li>\n<li>«из-за четких пропорций, они не вырастают больше 10 метров» и врезаются ближе к вершине горы.</li>\n<li>У вершины, на специальных мостиках — «бышах» — нефители ловят облака в специальную ткань «из специального материала и с особенной фактурой».</li>\n<li>Перемещать облака, не испортив их, нефители могут «используя родовую энергию».</li>\n</ul>\n<p>Тем, кто живёт наверху, реки не нужны — «потому что у них есть облака» (269397–269398).</p>\n<p>Отдельно зафиксировано свойство заражённых облаков: «если зараженное облако съест или вдохнет человек естественно он заболеет и причем сильно, а избавится от болезни только выдохнув облако» (269369).</p>\n<p>Облака как оружие названы, но не расписаны: «облака это ебать оружие может быть интересное», «там крч есть действительно интересная технология как делать разные темки с ними» — и сразу же оговорка «пока у меня глупая идея и не зрелая» (269422–269426). Также сказано: «у них множеств всяких экспериментов с облаками но это я не продумал уже» (269369).</p>", "r": []}, {"t": "Чем участники отличаются друг от друга", "a": ["S03", "GR-0034-S03", "GR-0034--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p>Внешние признаки расы описаны 2024-12-11 (id 269404): нефители — долгожители, «у них темно-синяя кожа(но при этом эти крайняя форма нормальной человеческой)», вес небольшой, но лёгкие большие и ноздри.</p>\n<p>Признаки распределены неравномерно: «эти черты больше у обычных жителей и рабочих которые на верху, тобиж в расе есть разные виды, вот ученых от обычных людей почти не отличить». То есть внутри расы есть разные виды, и степень выраженности признаков связана с положением в деревне.</p>\n<p>Из этого прямо следует практическое различие, названное в переписке: учёным «не сложно уезжать в университет», «из спокойно принимают» (269405–269406).</p>\n<p>Роли в работе с облаками тоже разделены (269369): обычные жители «просто поливают огород этими облаками в основном»; рабочие кидают облака учёным через жерло вулкана на середину горы; учёные в лабораториях «делают различные исследования с облаками» — увеличивают плотность, уменьшают, заражают вирусами и так далее.</p>", "r": []}, {"t": "Иерархия", "a": ["S04", "GR-0034-S04", "GR-0034--ierarhiya"], "h": "<p>Иерархия задана расселением по высоте горы (269369): «богатые люди живут внизу, ученые в середине, рабочие и бедные на верху».</p>\n<p>Ловля облаков происходит наверху, у вершины, то есть у рабочих и бедных; передача идёт снизу вверх по социальной лестнице и сверху вниз по горе — рабочие сбрасывают облака учёным через жерло вулкана на середину.</p>\n<p>Формальной власти, старшинства или управляющего органа в переписке не названо.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S05", "GR-0034-S05", "GR-0034--otnosheniya-s-drugimi-gruppami"], "h": "<p>Деревня описана как «относительно изолированное поселение», при этом «не тайное»: «трудно сказать к какому государству оно принадлежит», во внешней политике оно не участвует, «однако сотрудничает по программе обмена с крупными университетами» (269369).</p>\n<p>Отношения с приезжими описаны отдельно (269407–269408): «а вот тех кто приезжает к них они не знакомят с облаками, типа о них просто факт есть, они изучают погоду и всё, сильно о них не распространяются». Приезжают в том числе те, кто идёт в метеорологи — «тут учиться». То есть обмен односторонний: свои учёные уезжают в университеты и проходят там незамеченными, чужие приезжают, но к облакам не допускаются.</p>\n<p>Со страхами и небесными существами связь зафиксирована так: у нефителей «есть разные страхи связанные с небом» (269382), один из них — «монстры которые находятся в небе» (269384), другой — «есть страх упасть в небо» (269386), который Миколай тоже думает использовать. При этом «пока-что монстров нет», «пока только легенды и божества увиденные в облаках и записаные» (269443–269444) — то есть на 2024-12-11 у расы есть записанные легенды и божества, увиденные в облаках, а самих монстров как сущностей ещё нет.</p>\n<p>Основанием для этих легенд Миколай приводит парейдолию — психологический феномен, когда человек видит знакомые образы в случайных объектах или узорах, в том числе животных, лица и предметы в облаках, и который исторически играл роль в создании мифов, религиозных видениях и народных приметах (269428).</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S06", "GR-0034-S06", "GR-0034--kak-menyalas"], "h": "<p>Вся разработка расы уложилась в один день, 2024-12-11, окно w0066.</p>\n<p><strong>2024-12-11, 17:33–17:37 (id 269341–269361).</strong> Миколай предлагает категоризировать жителей деревни-гиганта как расу и рассказать о концепции. Слава в этот момент ждёт другого: «Я тебе говорил предложить способность который подойдёт к гг» (269346). Миколай отвечает, что способность ему «не лень написать», но «пока идей конкретно для гг нету» (269347, 269350). Написание откладывается на полтора часа по бытовой причине.</p>\n<p><strong>2024-12-11, 19:08 (id 269369–269373).</strong> Одним большим сообщением выложена вся концепция: расположение и вулкан, расслоение по высоте, изоляция и обмен с университетами, историческая справка про кочевое племя и врезавшееся облако, готовая система работы с облаками, заражённые облака. Сам Миколай оценивает написанное так: «да, не самая сильная и конкретно о расе почти не написал, но вот крч что есть» (269370). Тут же просьба: если Слава что-то придумает о главном герое — писать, «ибо у меня нет идей» (269371–269372).</p>\n<p><strong>2024-12-11, 19:20–19:25 (id 269379–269399).</strong> Слава отвечает «Мне понравилась» и напоминает: «Ты только не забывай о концепций силы» (269383). Задаёт вопрос про водоёмы — «Типо где они», «И какие» (269391–269392). Миколай добавляет: реки далеко за горами, прорыты каналы, вода пущена по кругу, наверху реки не нужны из-за облаков. Здесь же упоминает, что «эти 2 дня люто изучал че такое облака и многое понял» (269399).</p>\n<p><strong>2024-12-11, 19:25–19:29 (id 269400–269409).</strong> Слава уточняет: «Как я понял о расе сейчас ты не расскажешь ?». Миколай подтверждает — «да», — но добавляет: «но признаки могу описать» (269400–269402). Дальше идёт описание внешних признаков, деления на виды внутри расы, лёгкого поступления учёных в университеты и правила не знакомить приезжих с облаками. На этом же месте обрывается фраза «а ваще в истории у меня был гг» (269409) — продолжения в собранных материалах нет.</p>\n<p><strong>2024-12-11, 19:32–19:38 (id 269422–269448).</strong> Тема облаков как оружия и мифологии. Миколай говорит, что есть интересная технология, но идея «глупая и не зрелая». Приводит справку о парейдолии. Слава просит: «Только прошу тебя не забей на это идею», уточняя — «Про все», «Монстры раса облака», «Не забьешь на ней ?» (269430–269438). Миколай отвечает: «ну мне она нравится я хочу её развивать», «знаю как с этим работать можно», тут же поправляясь — «ладно, не знаю но предполагаю» (269439–269442). Про местность: «это очень необычная местность», «в которой ещё мизологию никто не писал почти», «можно будет легенды писать представляя их ракурс и пейзажи» (269446–269448).</p>\n<p><strong>2024-12-11, 19:54–19:59 (id 269464–269490).</strong> Обсуждение облачных монстров как визуального материала: «кста, рил облачных монстров пиздец мало придумали» — с уточнением, что имелось в виду «люди пока такое создали», а не что они реально существуют (269464, 269468–269469). Миколай говорит, что увидел такое в апреле и «сразу влюбился», а «сейчас раз я близком небом работаю из вспомнил» (269478–269479). День закрывается словами, что все надуманные мысли высказаны: «главное что знаю куда думать» (269486).</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "GR-0034-S07", "GR-0034--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет: персонажей расы в переписке не названо ни одного.</li>\n<li>Миколай сам говорит, что о расе как таковой почти не написал — есть только признаки: «конкретно о расе почти не написал» (269370), «Как я понял о расе сейчас ты не расскажешь ?» — «да» (269400–269401).</li>\n<li>Виды внутри расы названы («в расе есть разные виды»), но перечня видов и их границ нет — сказано только, что признаки сильнее у обычных жителей и рабочих наверху, а учёных «от обычных людей почти не отличить».</li>\n<li>«Родовая энергия», которой перемещают облака, названа, но не объяснена: что это, у всех ли она есть, как работает — в переписке не сказано.</li>\n<li>«Быши» — специальные мостики у вершины — названы, но не описаны.</li>\n<li>Эксперименты с облаками: «у них множеств всяких экспериментов с облаками но это я не продумал уже» (269369).</li>\n<li>Облака как оружие: технология названа, конкретика не расписана, автор сам называет идею «глупой и не зрелой» (269423–269426).</li>\n<li>Монстров в небе на момент переписки нет — «пока только легенды и божества увиденные в облаках и записаные» (269443–269444). Сами легенды и божества не приведены.</li>\n<li>Главный герой остался нерешённым: «пока идей конкретно для гг нету» (269350), «ибо у меня нет идей» (269372); фраза «а ваще в истории у меня был гг» (269409) продолжения не получила. Просьба Славы предложить способность, которая подойдёт к главному герою (269346), в собранных материалах не закрыта.</li>\n<li>Государственная принадлежность деревни не определена намеренно: «трудно сказать к какому государству оно принадлежит».</li>\n<li>Отнесение к вселенной «7 островов» не бесспорно: в источниках отмечено, что вселенная прямо не названа, писалось после решения вернуться к 7 островам и обнулить мир, а позже Слава отделяет «твою гору» от 7 островов (269851).</li>\n</ul></div>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0034--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0034.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0034-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0034/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>По числам эта статья почти ничем не заблокирована: у всех четырёх соседей статьи есть — <code>MN-0013</code> «Деревня-гигант» (2 ссылки, 20 464), <code>SP-0126</code> «Система облаков деревни-гиганта» (2 ссылки, 9 892), <code>MR-0078</code> «Заражённые облака» (1 ссылка, 6 702), <code>MR-0079</code> «Раса деревни-гиганта (нефители)» (2 ссылки, 4 473). Дыр вида «на сущность ссылаются, а статьи нет» рядом нет ни одной.</p>\n<p>Дорогая дыра здесь другого сорта — термин без кода. «Родовая энергия» не заведена нигде: её нет в числах, потому что нет сущности. В справочнике слово встречается только внутри чужих статей — <code>SP-0126</code>, <code>MR-0078</code>, <code>MN-0013</code>, — и везде как рабочий инструмент, а не как объяснённая вещь. При этом на ней держится последний шаг всей производственной цепочки: поймать облако можно тканью, а перенести, не испортив, — только ею. Ткань описана («из специального материала и с особенной фактурой»), мостики названы, энергия — нет. Это чинить первым: она стоит под <code>SP-0126</code>, а через неё под <code>MN-0013</code> и <code>MR-0078</code>, которые ссылаются на систему облаков как на работающую.</p>\n<p>Второе — привязка к вселенной. Весь куст из четырёх записей висит на «7 островах» условно: в окне вселенная не названа, а позже Слава отделяет «твою гору» от 7 островов (id 269851). <code>MR-0018</code> «7 островов» — 7 ссылок, один из самых цитируемых кодов справочника. Пока привязка не решена, четыре записи либо входят в него, либо не входят никуда.</p>\n<p>Третье — главный герой. У <code>GR-0034</code> ноль входящих ссылок: раса не подключена ни к одной истории, и просьба Славы «предложить способность который подойдёт к гг» (id 269346) — единственный мост наружу, который так и не построили.</p>\n<h3>С чего начать</h3>\n<p>В архив, но узко: вся разработка уложилась в один вечер, окно w0066, 2024-12-11, id 269341–269490. Там две точки, где лента обрывается на полуслове.</p>\n<ul>\n<li>id 269409 — «а ваще в истории у меня был гг», продолжения в собранном материале нет. Смотреть, что идёт следом: там, возможно, лежит тот самый недостающий персонаж.</li>\n<li>id 269851 — та же дата, позже: Слава отделяет «твою гору» от 7 островов. Читать вокруг — там решается вселенная сразу для четырёх записей.</li>\n</ul>\n<p>В базе стоит проверить на пересечение соседний облачный пласт, хотя он, судя по всему, из другого сюжета: <code>PS-0251</code> «Старик-исследователь облаков» (15 565 знаков, статьи нет, вселенная «вне вселенной», окно w0087, 2025-04-01) и <code>MR-0131</code> «Облачная краска» (7 237, статьи нет). Там тоже деревня, тоже облака, тоже исследователь, и это самый крупный необработанный облачный материал в базе. Совпадение это или перенос темы — по записям не видно, но проверять надо до того, как идти за новым.</p>\n<h3>Как развивалось</h3>\n<p>Всё в один вечер. 17:33 — заявили: Миколай сам предлагает считать жителей деревни расой, и не ради истории, а ради «введения концепции которая развита на определенной территории». 19:08 — выложено целиком, одним сообщением: гора, расслоение по высоте, происхождение, производственный цикл от каналов до ткани, заражённые облака. 19:20 — ограничили снаружи: Слава спрашивает про водоёмы, и в ответ достраивается вся гидрология. 19:25 — ограничили изнутри: «Как я понял о расе сейчас ты не расскажешь ?» — «да», — и вместо расы описываются признаки. 19:32 — автор сам маркирует следующий слой как несделанный: «пока у меня глупая идея и не зрелая». 19:54 — разговор уходит с расы на облачных монстров как на визуальный материал. 19:59 — «главное что знаю куда думать». Забывания и возвращения тут нет: линия закончилась на самой высокой точке интереса и больше не открывалась.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Правило закрытости названо в одну сторону: приезжих с облаками не знакомят — «типа о них просто факт есть, они изучают погоду и всё, сильно о них не распространяются». Для обратного направления такого правила нет. Свои учёные уезжают в университеты, «из спокойно принимают», и отличить их от обычных людей почти нельзя — а что им можно рассказывать снаружи, связаны ли они чем-то, чем деревня их держит, не сказано. Секретность прописана на входе и не прописана на выходе, хотя выход в тексте работает регулярно и назван программой обмена.</p>\n<h3>Отклик</h3>\n<p>Сильнее всего здесь причина, по которой деревня вообще возникла. Не открытие, не призвание, не пророчество: спускать заболевших вниз было неудобно, а бросить «жалко и противоречит обычаям» — и они остались. Тысячелетняя наука об облаках выросла из бытового неудобства, и это гораздо убедительнее любого замысла. Хорошо и то, что гора перевёрнута относительно привычного: богатые внизу, бедные наверху, потому что наверху работа. Из мелочей зацепил «страх упасть в небо» — сказано вскользь, одной строкой, и держит целую мифологию, которую даже писать не надо. И довольно смешно, что человек, два дня подряд разбиравшийся, как физически устроены облака, и выложивший связную производственную цепочку с дамбами, паром и высотами, тут же оценивает это как «да, не самая сильная».</p></div>", "r": []}];</script>
