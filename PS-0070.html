<script>const BASE="";const DOCNAME="Металлоид";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0070-S01", "PS-0070--proishozhdenie"], "h": "<p>Металлоид (Metalloid) — пришелец вселенной «игра бога», появившийся 2024-05-10 (id 167450–167455, окно w0033) в ответ на реплику Славы: «И надо ещё 4 пришельца». Миколай выложил в ответ нумерованный список новых пришельцев, продолжающий уже существующий ростер 1–6: под номером 7 Омниграф, под 8 Хроматер, под 9 Металлоид, под 10 Пироманта, под 11 Нейроглиф. Металлоид, таким образом, идёт девятым номером в общем списке пришельцев.</p>\n<p>Про способ появления материала Миколай прямо сказал в том же окне: «2 мощные нейронки сгенерировали предложения пока что» (id 167454). То есть карточка Металлоида — одно из машинно сгенерированных предложений, вынесенных на отбор, а не проработанная вручную заготовка.</p>", "r": []}, {"t": "Способности", "a": ["S02", "PS-0070-S02", "PS-0070--sposobnosti"], "h": "<p>В карточке названы три способности, все три — дословно:</p>\n<ul>\n<li><strong>Металломорфизм</strong>: «Может превращать части своего тела в различные металлы, от легких и гибких до тяжелых и прочных».</li>\n<li><strong>Металлический контроль</strong>: «Управляет металлами, создавая оружие, щиты или ловушки».</li>\n<li><strong>Формирование и восстановление</strong>: «Способен быстро восстанавливать повреждения или менять форму своего тела для адаптации к ситуации».</li>\n</ul>\n<p>Ограничений, цены, источника силы и пределов дальности в переписке не названо.</p>", "r": []}, {"t": "Связи с другими", "a": ["S03", "PS-0070-S03", "PS-0070--svyazi-s-drugimi"], "h": "<p>Металлоид входит в одну заявку с Омниграфом (номер 7), Хроматером (<a href=\"PS-0069.html\">Хроматер</a>, номер 8), Пиромантой (номер 10) и Нейроглифом (номер 11) и примыкает к уже существующему ростеру пришельцев 1–6. Сюжетных или личных связей между ними в переписке не описано — они перечислены единым списком.</p>\n<p>Отдельно стоит вторая, параллельная подача того же окна (id 167452): Миколай сразу следом выложил другой список — «Изменяющий форму», «Телекинетик», «Мастер времени», «Энергетический вампир» — тоже под номерами 7–10. Это второй вариант заполнения тех же слотов; в переписке не сказано, как два списка соотносятся между собой и заменяет ли один другой. Номер 9 во втором списке занимает «Мастер времени», а не Металлоид.</p>", "r": [["Хроматер", "PS-0069.html"]]}, {"t": "Как менялся — состояния по датам", "a": ["S04", "PS-0070-S04", "PS-0070--kak-menyalsya"], "h": "<p><strong>2024-05-10 (id 167450–167455, окно w0033)</strong> — единственное состояние. Заявлен под номером 9 с тремя способностями (металломорфизм, металлический контроль, формирование и восстановление). Версий больше одной у персонажа нет.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S05", "PS-0070-S05", "PS-0070--chto-s-nim-stalo"], "h": "<p>В окне w0033 Металлоид не отобран Славой и дальше не развивается. Реакция Славы на список в сохранённой переписке отсутствует; единственное «Ок» (id 167453) принадлежит самому Миколаю и относится к его же сообщению.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0070-S06", "PS-0070--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Внешность не описана вообще: ни роста, ни строения тела, ни того, как выглядит металлизированная часть.</li>\n<li>Характер, поведение, речь — в переписке не сказано ничего.</li>\n<li>Происхождение, раса, родная планета, среда обитания — не названы.</li>\n<li>Ограничения и цена способностей не оговорены: не сказано, какие металлы доступны, нужен ли внешний металл для «металлического контроля», есть ли предел восстановления.</li>\n<li>Отношения с другими пришельцами не прописаны.</li>\n<li>Судьба персонажа осталась нерешённой: отбора не было, отказа тоже не зафиксировано.</li>\n<li>Соотношение двух параллельных списков пришельцев (id 167451 и id 167452) осталось нерешённым.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0070--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0069.html\">Хроматер</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0069.html\">Хроматер</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0014.html\">игра бога</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0070--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-05-10</td>\n<td>167450–167455</td>\n<td>w0033</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0070-metalloid.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0070--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0070.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
