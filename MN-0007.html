<script>const BASE="";const DOCNAME="Колосс";
const LEAD="";
const CH=[{"t": "Где находится — в каком мире и в каком его месте", "a": ["S01", "MN-0007-S01", "MN-0007--gde-nahoditsya"], "h": "<p>Вселенная «монстры» (по дате объявления; 2024-09-17, id 230869–230874, окно w0057). В каком городе или районе стоит супермаркет — в переписке не сказано. Вариант имени: «супермаркет Колосс».</p>", "r": []}, {"t": "Что собой представляет", "a": ["S02", "MN-0007-S02", "MN-0007--chto-soboy-predstavlyaet"], "h": "<p>Супермаркет под названием «Колосс». Из устройства названы только касса, выход и покупатели в зале. Кроме названия и того, что это супермаркет, о самом месте ничего не сообщается.</p>\n<p>Из товаров назван батончик «Андромеда» — тот, рекламу которого Крим видел утром того же дня и который стал причиной всей сцены. Сам Крим потом называет батончик «галактикой»: «тётушка, держи галактику». Ещё упомянута пачка сливок, которую нёс стоявший с ними на кассе мужчина.</p>", "r": []}, {"t": "Что с ним связано — предметы, механики, силы", "a": ["S03", "MN-0007-S03", "MN-0007--chto-s-nim-svyazano"], "h": "<p>Внутри супермаркета разыгрывается вся сцена с «волшебным словом». Мать объясняет Криму правило дословно: «есть волшебное слово \"пожалуйста\", если его скажешь, то тебе всё отдадут что хочешь и сделают всё, что пожелаешь, попробуй. только помни, его нужно говорить спокойно, но чётко. сначала произносишь, что тебе нужно, а потом слово или наоборот».</p>\n<p>Дальше правило работает буквально на всех, к кому Крим обращается: мать покупает батончик, девушка на выходе берёт его на руки, мужчина отдаёт сливки, мать отпускает его руку, девочка обнимает, девушка уводит его с собой. Отказ звучит один раз — когда Крим лезет обниматься без просьбы, девушка его отталкивает и говорит, что кормить будет.</p>\n<p>Отдельно в супермаркете проверяется фраза «трипл хук». Крим выкрикивает её как волшебное слово, все, включая маму, смеются, и он отмечает разницу мест: «значит тут эта фраза не отбрасывает соперника ломая позвоночник, а заставляет смеяться, прикольно». Где эта фраза ломает позвоночник — в переписке не сказано; сказано только, что здесь она так не работает.</p>", "r": []}, {"t": "Персонажи и события — кто с ним связан и что там происходило", "a": ["S04", "MN-0007-S04", "MN-0007--personazhi-i-sobytiya"], "h": "<p><strong>Крим</strong> — рассказчик сцены, ребёнок. Он не понимает происходящего и проговаривает свои догадки вслух: почему мать просит его помолчать («потише Крим, видишь тут люди, подумают ещё что-нибудь. потом скажешь»), он объясняет себе так — «может это она сама с собой говорит, а меня не слышит или подумала, что я просто хотел её назвать?». На отказ купить батончик реагирует недоверием: «мне кажется, она меня обманывает, я знаю что за деньги всё можно купить и их было много много, а купила она не много».</p>\n<p><strong>Мать Крима.</strong> Оплачивает покупки на кассе, просит вести себя тише, отказывает («у нас сейчас денег нет, давай потом»), затем учит его «волшебному слову» и покупает батончик. Зовёт его «Крими». Когда Крима берёт на руки девушка у выхода, кричит: «ТЫ ЧЕ СЕБЕ ПОЗВОЛЯЕШЬ, А НУ ОТДАЙ МОЕГО СЫНА СТЕРВА». Её реакции Крим считывает как странность: «мама скривила лицо, так, словно я какой-то псих. но мама это моя мама, всё хорошо».</p>\n<p><strong>Девушка у выхода.</strong> Стоит на выходе, долго смотрит на Крима и слушает разговор. Возраст называет сама: «ну во первых, парень какая я тебе тётушка, мне 16, во вторых где волшебное слово?». Берёт Крима на руки, откусывает от батончика, отталкивает его, когда он пытается обняться, и в конце уводит с собой — по его просьбе с волшебным словом. На требование матери отвечает: «да, больно он мне нужен, забирай».</p>\n<p><strong>Мужчина со сливками.</strong> Стоял с ними на кассе, нёс пачку сливок. Отдаёт Криму попить со словами «раз произнёс спасибо, то держи» — при том, что Крим сказал «пожалуйста».</p>\n<p><strong>Девочка.</strong> Обнимает Крима после просьбы. Больше о ней ничего не сказано.</p>\n<p>Ход событий: касса — отказ — обучение «волшебному слову» — покупка батончика — девушка на выходе берёт на руки и кормит батончиком — мать забирает Крима и выводит из магазина — Крим фразой «пожалуйста отпусти мою руку» освобождается и уже за пределами магазина обходит по очереди мужчину, девочку и девушку, и последняя забирает его с собой.</p>", "r": []}, {"t": "Как менялся по версиям — по датам", "a": ["S05", "MN-0007-S05", "MN-0007--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-09-17 (id 230869–230874, окно w0057).</strong> Единственное состояние: место названо один раз, как площадка уже готовой сцены.</p>\n<p>Как автор подавал саму историю при выкладке (id 230869–230872): «давай скину историю», «которая уже есть», «она скучная и без Монстро», «но норм». После текста (id 230874) — «потом раскрою». Раскрытия в этом окне не последовало.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "MN-0007-S06", "MN-0007--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Кроме названия и того, что это супермаркет, о самом месте ничего не сказано: ни города, ни размеров, ни того, чем «Колосс» отличается от других магазинов.</li>\n<li>Почему место названо «Колосс» и значит ли название что-то — не сказано.</li>\n<li>Работает ли «волшебное слово» только в «Колоссе» или везде — не сказано; проверено оно только здесь.</li>\n<li>Про «трипл хук» сказано лишь, что в этом месте фраза не ломает позвоночник; где и как она работает иначе — не раскрыто.</li>\n<li>Что произошло после того, как девушка забрала Крима с собой, — не написано, автор пометил «потом раскрою».</li>\n<li>Связь сцены с «Монстро» отсутствует по прямому заявлению автора: история «без Монстро».</li>\n<li>Имена матери, девушки с выхода, мужчины со сливками и девочки не названы.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MN-0007--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MN-0007--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-09-17</td>\n<td>230869–230874</td>\n<td>w0057</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/monumenty/MN-0007-koloss.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MN-0007--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MN-0007.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
