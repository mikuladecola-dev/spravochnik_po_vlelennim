<script>const BASE="";const DOCNAME="Гении";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0193-S01", "SP-0193--mehanika"], "h": "<p>«Гении» — не отдельная способность с описанным действием, а название категории апостолов. Слава задаёт её так: «давай теперь таких называть Гениями то бишь, апостол со самой странной способностью, у каждого поколения такой был» (2025-03-06, id 298875).</p>\n<p>Из этой формулировки следуют два признака категории: способность носителя — «самая странная» среди апостолов своего поколения, и такой апостол был в каждом поколении. Чем именно измеряется «странность» и кто её определяет, в переписке не сказано. Сказано «такой был» — то есть в поколении речь идёт об одном; отдельно число не оговаривалось.</p>\n<p>Собственного механизма — что гений умеет как гений, помимо своей странной способности — в переписке нет.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S02", "SP-0193-S02", "SP-0193--nositeli"], "h": "<p>Единственный названный пример — Бессмертный. Миколай попросил пример прямо: «пример дай пж», «а то все равно не до конца пон» (id 298881–298882), Слава ответил одним словом: «Бессмертный» (id 298883). Чем именно способность Бессмертного попадает под определение «самой странной», не разбиралось.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S03", "SP-0193-S03", "SP-0193--kak-menyalas-po-versiyam"], "h": "<p><strong>2025-03-06 (id 298872–298886, окно w0079).</strong> Единственная версия. Разговор начинается с того, что Миколай вспоминает прежнюю формулировку иначе: «а я чет другое будто помню», «что типа страные благословенные» (id 298872–298873). Слава подтверждает, что говорил так, и здесь же вводит новое название — «Гении», с определением через «самую странную способность» и с уточнением про каждое поколение. Миколай спрашивает, как категория называлась до этого; Слава отвечает: «Аномалия» (id 298877–298878). После примера с Бессмертным тема закрывается — Слава переходит к вопросу «Когда прочтёшь историю?» (id 298885).</p>\n<p>Таким образом на 2025-03-06 фиксируется смена названия: «Аномалия» → «Гении».</p>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S04", "SP-0193-S04", "SP-0193--otklonennye-varianty"], "h": "<ul>\n<li><strong>«Аномалия»</strong> — прежнее название той же категории, названо самим Славой как то, «как до этого» он их называл. Заменено на «Гении» в том же разговоре. Причина замены не названа.</li>\n<li><strong>«странные благословенные»</strong> — вариант, который Миколай держал в памяти как ранее прозвучавший. Слава его не отрицает («Ну я говорил»), но вместо него вводит «Гениев». Отдельно как термин дальше не используется.</li>\n</ul>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0193-S05", "SP-0193--svyaz-s-drugimi-sposobnostyami"], "h": "<p>В блоке «Связано с» записи перечислены: Аномалия (мир внутри Кильки), Бессмертный, Килька. Из них в самой переписке проговорены только прежнее название «Аномалия» и пример «Бессмертный». Как категория «Гении» связана с миром «Аномалия» внутри Кильки и с самой Килькой — в переписке не сказано; совпадение слова «Аномалия» в названии мира и в прежнем названии категории никак не комментируется.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "SP-0193-S06", "SP-0193--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Не описано, что общего у гениев кроме признака «самая странная способность» — общей механики нет.</li>\n<li>Не определено, по какому критерию способность считается «самой странной» и кто это решает.</li>\n<li>Не сказано, ровно ли один гений на поколение; формулировка «у каждого поколения такой был» числа не задаёт.</li>\n<li>Не объяснено, почему прежнее название «Аномалия» заменено.</li>\n<li>Не разобрано, чем способность Бессмертного подходит под определение.</li>\n<li>Связь с миром «Аномалия» внутри Кильки и с Килькой остаётся нерасшифрованной.</li>\n<li>Других носителей, кроме Бессмертного, не названо.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0193--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0003.html\">Гении (ранее «Аномалия»)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0193--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-03-06</td>\n<td>298872–298886</td>\n<td>w0079</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0193-genii.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0193--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0193.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["SP-0193-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/SP-0193/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — развести «Бессмертного». Это единственный названный носитель категории, а под этим именем в базе лежат три разные записи: <code>PS-0211</code> «Мальчик из братской могилы (Бессмертный)» — 58 295 знаков базы, статья есть, три ссылки; <code>IS-0013</code> «Бессмертный» — 44 010, статья есть, три ссылки; <code>PS-0184</code> «Бессмертный выродок» — 10 676, статья есть, четыре ссылки, и там прямо сказано, что это апостол и он бессмертный. Гении — категория апостолов, значит выбор сужается, но в статье он не сделан. Единственный пример категории ведёт в три стороны сразу, и все три уже нагружены ссылками.</p>\n<p>Вторая — «Аномалия» как прежнее имя категории: такой сущности нет. Есть <code>MR-0116</code> «Аномалия (мир внутри Кильки)» — 2 088 базы, ноль ссылок — и раздел «Аномалии» внутри рабочих реестров, у которых статей нет вообще: <code>SL-0053</code> — шесть ссылок, 20 313 знаков, четыре редакции с 2025-01-27 по 2025-03-06; <code>SL-0090</code> — четыре ссылки, 5 492; <code>SL-0051</code> — шесть ссылок, 9 834. Это самые дорогие дыры вокруг записи: то, из чего берётся деление вселенной на разряды, не разобрано ни в одном месте, а на разряды опирается всё определение Гениев.</p>\n<p>Третье, дешёвое: <code>ID-0036</code> «Требование к силам первого поколения» — 2 865, статьи нет, ноль ссылок, вселенная помечена «неясно». Единственное место, где «поколение» заведено как понятие; определение Гениев держится именно на нём.</p>\n<h3>С чего начать</h3>\n<p>В базе, и близко. <code>SP-0194</code> «Всегда активное благословение Бессмертного» — 2025-03-10, четыре дня после этого разговора, 6 462 знака, статья есть, ноль ссылок. Там ровно то, чего в записи нет: чем его благословение устроено не как у остальных — включено постоянно, из-за этого вытекает мозг, своей же силой восстанавливает и после этого всё забывает. Если «самая странная способность» где-то показана, то там. Рядом <code>PS-0211</code> — 58 295, тот же носитель, белые светящиеся глаза.</p>\n<p>Совпадение слова, которое статья отмечает и не расшифровывает, проверяется по датам, а не по смыслу: <code>MR-0116</code> «Аномалия (мир внутри Кильки)» датирована тем же 2025-03-06, то есть оба употребления слова живут в одном дне и одном окне w0079. Смотреть надо не два разных разговора, а один. Килька — <code>MR-0207</code>, 68 896 знаков базы, одна ссылка — там же.</p>\n<p>В архив идти пока не за чем, кроме одного. Миколай помнит формулировку «страные благословенные» (id 298872–298873), и Слава её не отрицает. Значит был более ранний заход, и он в записи не датирован. Искать до 2025-03-06, вокруг редакций <code>SL-0053</code> (с 2025-01-27) и <code>SL-0051</code> (2025-01-24) — там, где перечисляются разряды.</p>\n<h3>Как развивалось</h3>\n<p>Всё уместилось в пятнадцать сообщений одного дня, 2025-03-06, id 298872–298886. Начинается не с заявки, а с расхождения памяти: Миколай помнит другое, Слава отвечает «Ну я говорил». Дальше одной репликой вводится новое имя и сразу определение — «самая странная способность» плюс оговорка про каждое поколение. На вопрос, как было раньше, названо прежнее имя: «Аномалия». Пример выдан только после прямого требования — «пример дай пж», «а то все равно не до конца пон» — и одним словом. Тем же заходом тема закрыта переходом на «Когда прочтёшь историю?». Переименовали, определили, пример вытянули, закрыли — в один присест, и больше в датах статьи ничего нет.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Про «Аномалию» сказано прямо, что это прежнее имя — «как до этого». Про «странных благословенных», формулировку того же рода и из той же реплики, не сказано ничего: Слава подтверждает, что говорил так, но статус её не назван — было это названием, рабочим описанием или оговоркой. Для одного старого имени замена проговорена как событие, для соседнего — нет.</p>\n<h3>Отклик</h3>\n<p>Зацепило, что термин здесь заводится не решением, а спором о памяти. Разговор начинается с «а я чет другое будто помню», и новое название рождается прямо из этой нестыковки — не потому, что старое чем-то плохо, а потому что двое не сошлись на том, что было сказано раньше. Терминология мира существует в виде того, кто что удержал в голове. И сама пара слов хорошая: «Аномалия» — это диагноз, взгляд снаружи, отклонение от нормы; «Гении» — то же самое место в классификации, но сказанное с уважением. Один и тот же человек, одна и та же странность, а разряд переехал из брака в дар. Что причину замены не назвали, тут даже уместно: её и не формулируют вслух, такие вещи меняют на слух. Слабое место — определение через превосходную степень: «самая странная» требует, чтобы кто-то сравнил всех апостолов поколения между собой, и этого сравнителя в мире пока нет.</p></div>", "r": []}];</script>
