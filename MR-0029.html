<script>const BASE="";const DOCNAME="Мета-люди";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0029-S01", "MR-0029--ustroystvo"], "h": "<p>Мета-люди — категория людей вселенной «7 островов», введённая 2024-07-04 (id 196705–196714). Определение дано Славой в двух репликах: «Мета- люди с энергий», «Способностью». То есть мета — это люди с энергией, со способностью, в отличие от людей без неё.</p>\n<p>Название взято на пробу. Слава: «Где то услышал», «Ну пусть будут пока мета». Термин заявлен как временный.</p>\n<p>Термин возник из вопроса Миколая «а как вообще защитники защищают целые острова». Ответ Славы: «Защитник- сильнейший человек на острове», «Есть другие мета-люди», «Он не один остров защищает». Таким образом, защитник — сильнейший из мета-людей на острове, но не единственный мета-человек, и защитник защищает не один остров.</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0029-S02", "MR-0029--naselenie"], "h": "<p>Ключевая характеристика группы — численность. Миколай: «мета людей же дохуя». Из этого прямо выводится способ решать сюжетные задачи: раз мета-людей много, среди них можно найти носителя почти любой нужной механики.</p>\n<p>Первое применение этого принципа — мусорная проблема (2024-07-04, id 197050–197072). Миколай: «может есть те, кто может как-то перерабатывать эту залупу», «или на крайняк сжигать бесследно».</p>\n<p>Слава задал вопрос «На каком острове этот человек будет?». Миколай ответил вариантом, при котором такой мета-человек есть на каждом острове, и на каждом он свой:</p>\n<ul>\n<li>на одном отправляет мусор «в какое-то пустое измерение»;</li>\n<li>на другом «сжигает до тла»;</li>\n<li>в другом «перерабатывает во что-то полезное»;</li>\n<li>в другом «уменьшает количество».</li>\n</ul>\n<p>Слава предложил противоположное: «У дриады», «Будет человек», «Этот», «И он будет только у нее» — то есть такой мета-человек существует в единственном экземпляре и находится у дриады. Миколай: «ну вообще я хотел для современных, ну пускай», «хмм», «только один». Обсуждение обрывается на этом; окончательный выбор между «на каждом острове свой» и «только один у дриады» в переписке не зафиксирован явно, хотя Миколай последней репликой повторяет «только один».</p>", "r": []}, {"t": "Место во вселенной — как связан с другими мирами", "a": ["S03", "MR-0029-S03", "MR-0029--mesto-vo-vselennoy"], "h": "<p>Связано с: Защитник, Мета-человек, утилизирующий мусор, Остров на дне океана (сфера).</p>\n<p>Защитник — сильнейший человек на острове и сам относится к мета-людям («Есть другие мета-люди»); он защищает не один остров.</p>\n<p>Мета-человек, утилизирующий мусор — частный случай мета-человека, выведенный из тезиса о численности.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0029-S04", "MR-0029--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-07-04 (окно w0043, id 196705–196714).</strong> Введение термина. Защитник — сильнейший человек на острове, но есть и другие мета-люди. Мета — люди с энергией, со способностью. Название пробное.</p>\n<p><strong>Версия 2 — 2024-07-04 (окно w0043, id 197050–197072).</strong> Из численности мета-людей («мета людей же дохуя») выводится существование того, кто решает мусорную проблему. Обсуждаются два варианта размещения: на каждом острове свой такой мета-человек с разным способом утилизации (вариант Миколая) и один-единственный у дриады (вариант Славы).</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0029-S05", "MR-0029--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Термин заявлен как временный: «Ну пусть будут пока мета». Постоянного названия в переписке нет.</li>\n<li>Что такое «энергия», которой обладают мета-люди, не раскрыто.</li>\n<li>Откуда берётся способность и как человек становится мета — в переписке не сказано.</li>\n<li>Численность («дохуя») не уточнена ни цифрой, ни долей от населения.</li>\n<li>Соотношение защитника и остальных мета-людей описано только формулой «сильнейший человек на острове»; механизм назначения или отбора защитника не назван.</li>\n<li>Спор о том, есть ли утилизирующий мусор мета-человек на каждом острове или он один у дриады, остался нерешённым.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0029--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0030.html\">Защитники островов</a>, <a href=\"GR-0031.html\">Мета-люди</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0029--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-04</td>\n<td>196705–196714</td>\n<td>w0043</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-04</td>\n<td>197050–197072</td>\n<td>w0043</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0029-meta-lyudi.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0029--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0029.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
