<script>const BASE="";const DOCNAME="Правители (правители миров, правители минимиров)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0023-S01", "GR-0023--chto-eto"], "h": "<p>Правители — класс существ вселенной «Апостол», по одному на мир. Разведка не ошиблась: это именно группа (пантеон), а не один персонаж, — в переписке правители описываются набором общих свойств, и отдельные правители называются как её члены.</p>\n<p>Первое определение дано 2025-01-06 (id 278852): «почти во всех мирах есть правитель( существо правящий этим миров )». Развёрнутое определение — 2025-05-31 (id 331635) и дословно повторено 2025-10-18 (id 375849):</p>\n<div class=\"q\"><p>«Правители. Это не физические существа появившиеся в нигде и в ни чем. Они первыми, что появилось в пустоте. И именно они начали создавать мир. По своему желанию.( между всеми мирами есть связь, которую не может оборвать не один правитель)»</p></div>\n<p>В версии от 2025-03-18 (id 305116) то же самое сказано изнутри истории и другими словами: «В начале всего было ничего. Потом появился первый мир \"Килька\". И да это наш мир. А потом начали появляться другие миры. И в каждом этом мире был свой бог. Его называют Правителем. И вот эти миры появляются и по сей день.»</p>\n<p>Название группы в переписке употребляется в трёх формах: «правители», «правители миров», «правители минимиров». Разделения между ними как между разными сущностями не проводится — «правители минимиров» это те же правители, только у миров малого размера.</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0023-S02", "GR-0023--sostav"], "h": "<ul>\n<li><strong><a href=\"PS-0217.html\">Правитель Кильки</a></strong> — Правитель Кильки (варианты написания в переписке: «Правитель кильке», «наш правитель», «правитель кильки»). Первый из появившихся правителей.</li>\n<li><strong><a href=\"PS-0279.html\">Правитель рая</a></strong> — Правитель рая. Второй из появившихся; он раздаёт 21 благословение апостолам.</li>\n<li><strong><a href=\"MR-0207.html\">Килька</a></strong> — «Кильке». Назван 2025-08-30 (id 359684) как правитель, чьим благословением наделена сестра-злодейка: «Есть сестра благословенная правителем Кильке». Одно ли это лицо с <a href=\"PS-0217.html\">Правитель Кильки</a> — в переписке не сказано; в базе при этой записи стоит пометка, что возможна опечатка в написании имени.</li>\n<li><strong><a href=\"MR-0068.html\">Существо с длинными руками</a></strong> — «существо», правитель нашего мира, создавшее Смерть.</li>\n</ul>\n<p>Кроме них в переписке названы, но в состав группы отдельными записями не выделены:</p>\n<ul>\n<li><strong>бог</strong> — правитель рая (2025-01-06, id 278868): «Бог есть в рая он его правитель». Совпадает ли он с <a href=\"PS-0279.html\">Правитель рая</a> (правитель рая) — прямо не сказано, но обе роли описаны одинаково: раздаёт наибольшее число благословений, лимит 21.</li>\n<li><strong>дьявол</strong> — правитель ада (2025-01-06, id 278852): «дьявол правитель \"ада\" добрый, типо он карает грешников».</li>\n</ul>\n<p>Поимённого списка всех правителей нет. Их число не названо; сказано только, что мир есть «почти у каждого» (2025-01-06, id 278852) и «в каждом этом мире был свой бог» (2025-03-18, id 305116) — сами две формулировки друг с другом не согласованы, и в переписке это не обсуждалось.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Вторая по цене — «существо». Слово несёт две несовместимые роли (правитель нашего мира и самый сильный из всех против «ребёнок правителя, имеющий физическую оболочку» и один из видов чужемирцев), и на нём висит позиция в составе группы — <code>MR-0068</code>, у которой в базе 18 447 знаков против 15 170 в статье. Пока противоречие не снято, состав группы содержит запись, про которую неизвестно, правитель это вообще или нет.</p></div>", "r": [["Правитель Кильки", "PS-0217.html"], ["Правитель рая", "PS-0279.html"], ["Килька", "MR-0207.html"], ["Существо с длинными руками", "MR-0068.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0023-S03", "GR-0023--obschie-sposobnosti-gruppy"], "h": "<p><strong>Происхождение и создание миров.</strong> Правители — не физические существа. «Просто появились в пустоте. По итогу создавая землю воду и т.д.» (2025-01-06, id 278909). Они «первыми, что появилось в пустоте», и начали создавать миры «по своему желанию» (2025-05-31, id 331635). Миры появляются «и по сей день» (2025-03-18, id 305116).</p>\n<p>На вопрос Миколая «нахуя и с чего» появились правители (2025-05-31, id 331648) Слава ответил «Фиг знает» (id 331653) и сослался на историю про упыря и битву с защитником (id 331654). Причина появления правителей осталась нерешённой.</p>\n<p><strong>Облик.</strong> «У них нет облика они могут принять любой» (2025-01-06, id 278903) — ответ на вопрос Миколая, есть ли у них облик вообще «или они фактическое деяние собой являют» (id 278898).</p>\n<p><strong>Власть над своим миром.</strong> «Он может изменять этот мир как хочешь ведь это его мир» (2025-01-06, id 278880), «контролирует полностью свой мир изменяя пространства» (id 278903). На вопрос «размеры тоже?» (id 278882) ответ — «Нет» (id 278885). Ответы в этом месте идут вперемешку с ответами на другой вопрос, но база читает связку именно так: пространство своего мира правитель контролирует полностью, размеры мира — нет.</p>\n<p><strong>Что не их работа.</strong> Дождь — «Нет это экологией, круговорот» (2025-01-06, id 278905). Войны, упавший хлеб, ссоры — «Нет, это наша работа» (id 278904).</p>\n<p><strong>Всевидение и предел вмешательства.</strong> «Правители не как не могут влиять на благословенного или обычного существа ( кроме как насильственно давать благословения, даже если само существо этого не хочет)... При этом правители всевидящий» (2025-05-31, id 331636).</p>\n<p><strong>Благословение.</strong> Механика описана дважды и почти одинаково.</p>\n<p>Версия 2025-03-19 (id 305856), изложенная персонажем-имитатором: «Правитель другого мира устанавливает с тобой связь и через эту связь даёт тебе силу. Но каждый правитель может дать ограниченной количество благословение. И к факту. Благословения можеть получать только разумный житель кильке. Первого мира. Не знаю точно с чем это связано. Но это просто факт.» Там же — почему у благословенного болит голова: «Потому-что связь устанавливается с мозгом. И сила проходит через мозг. Повреждая его. Но не сильно.»</p>\n<p>Версия 2025-05-31 (id 331635), повторённая 2025-10-18 (id 375849): «Правители способны давать благословение. То есть настраивать связь с существом живущими в мире ( благословения даётся только существами живущими в кильке). Настроив это связь с существом ( без его разрешения). Правитель способен передавать свою силу через эту связь к существу( человеку чаще всего). Сама связь устанавливается на мозге. То есть сила или энергия проходит через мозг вредя ему.» Средняя продолжительность жизни благословенного после получения благословения — 10 лет.</p>\n<p>Дополнительно (2025-05-31, id 331636): «благословения даётся только одно. Больше человек не выдержит. И это одно благословения с ним до его смерти. Благословения нельзя разорвать».</p>\n<p>Более ранняя формулировка (2025-01-06, id 278852) звучит иначе: «эти правитель могут дать свой благословение, но они могут дать свой благословений только людям из нашего мира». В январе «наш мир» — «Вселенная», в мае и позже — «килька»; переименование в переписке отдельно не проговаривается.</p>\n<p><strong>Четыре базовых способности, которые даёт любой правитель.</strong> Названы двумя разными наборами слов.</p>\n<ul>\n<li>2025-03-19 (id 305856): «четыре базовых есть у всех. Это усиления, самоисцеления, энергия и сенсорика».</li>\n<li>2025-05-31 (id 331635) и 2025-10-18 (id 375849): «усиленная регенерация; усиления тела и всех чуств; аура( то бишь самая энергия, которая выплескивается и заставляет чувствовать страх е животных и обычных людей. Так же способный влиять на окружающей. При сильном скоплении) ; сенсорика ( позволяет ощущать других благослрвенных и арбетара или Протобионтов)».</li>\n</ul>\n<p><strong>Уникальная способность правителя.</strong> «под уникальным подразумеввется, что у правителя уникальная благословенния дающий отличающий от всех других благословенной способность. НО если правитель, что дал вам благословения. Даст благословения ещё другому человеку. То оно будет такой же, как и у вас» (2025-05-31, id 331635). То есть уникален правитель, а не благословенный: все благословенные одного правителя получают одну и ту же способность.</p>\n<p>Способность выключаема вместе с благословением: «например вам дали ьлагословенния и ваша уникальность способность это огонь. Вы можете поджечь лес. Но после отключения благословенния весь огонь исчезнет... Буть то огненный шар или остановка времени они просто отключаться.» То же самое сказано раньше, 2025-01-13 (id 281379): «Благословений это временная сила, типа еë нельзя долго сохранять. Например огонь стрельнуть по дереву оно горит, а после отключение благословенной огонь сразу исчезает».</p>\n<p><strong>Дети — Протобионты.</strong> «У правителей есть дети, которых зовут Протобионты. Это субъект, который был создан именно правителем, а не из-за особенности мира. Подобные субъекты имеют огромную силу, которая в теории позволит уничтожить континент. Но большинство существ спокойный и миролюбивый. При этом они очень не любят покидать мир своего родителя» (2025-05-31, id 331635).</p>\n<p>Миколай пересчитал масштаб этой силы на устройство вселенной (2025-05-31, id 331649) и получил «это существо может уничтожить Евразию 🤯 это огромная сила». Слава уточнил (id 331655): «Я подразумевал существ среднего и малого мира. А вот из нашего то он вполне солнечную систему разрушит».</p>\n<p>На вопрос «у любого правителя есть пробионты» (id 331656) ответ — «Ну да наверное» (id 331657), то есть подтверждено с оговоркой.</p>\n<p><strong>Выброс существа из мира.</strong> Один из способов покинуть свой мир — «Вас может выкинуть сам правитель ( очень очень очень, крайне редко)» (2025-05-31, id 331635). Тот же способ в перечне от 2025-03-18 (id 305117) назван третьим и самым редким: «Когда правитель сам тебя отправляет в другой мир».</p>\n<p><strong>Связь между мирами правители оборвать не могут.</strong> «между всеми мирами есть связь, которую не может оборвать не один правитель» (2025-05-31, id 331635). Самая крепкая связь — с первым миром: «Самая крепкая связь с нашем миров так как он первый и по суть на основе него строились и другие миры. Между всеми мирами есть связь но самый сильной только с нашем» (2025-01-06, id 278908).</p>\n<p><strong>Бесконечная жизнь и наблюдение.</strong> «Опять они вечно наблюдают за нашем миров можно сказать единственное развлечения в их ней бесконечное жизни» (2025-01-06, id 278941).</p>\n<p><strong>Энергия, потраченная на артефакты.</strong> Предложение Миколая 2025-01-13 (id 281371): «ну правители при создании своих миров периодически тратили энергию на создание артефактов в которых заключали идеи». Позже, 2025-05-31 (id 331636), Слава дал свою версию происхождения артефактов через правителей: «Артефакты это объект, что имеет силу правителя. Из-за того, что. Когда то правитель пытался создать мир. И не в состоянии полностью контролировать этот процесс наделили какой-либо объект через чур большой сил этот самый объект.» Отдельный вид — артефакты с символикой: «это артефакт, который не был ни кем создан. Они появились вместе с правителями и имеют невероятную мощь».</p>", "r": []}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0023-S04", "GR-0023--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p><strong>Порядок появления и размер мира.</strong> «Первым правителем был правитель кильке. Вторым же был правитель рая. Поэтому их мир в разы больше миров других правителей» (2025-05-31, id 331635; повтор 2025-10-18, id 375849).</p>\n<p>В более раннем январском состоянии (2025-01-06, id 278852) порядок и размеры описаны иначе: «Вот есть наш мир будем называть \"Вселенной\" и этот мир самый большой... На втором месте по размеру это \"рай\" и \"ад\". Ну и также существует множество минимиров». Наш мир там же назван бесконечным (id 278862, 279031), а размеры прочих миров — «есть мир который по размеру как дом, а есть мир который как город и т.д.» (id 278863).</p>\n<p><strong>Сколько благословений раздаёт правитель.</strong></p>\n<ul>\n<li>«правитель минимиров довольно редко дают свой благословение. Больше все благословенный даёт бог и дьявол» (2025-01-06, id 278941).</li>\n<li>«И бог и дьявол могут дать свой благословение лишь 21 человеку» (2025-01-06, id 278944).</li>\n<li>«21 это максимальное число благословения, который способен давать правитель рая. Другие же правители дают меньше» (2025-05-31, id 331635).</li>\n<li>«каждый правитель может дать ограниченной количество благословение» (2025-03-19, id 305856).</li>\n</ul>\n<p><strong>Какого рода силу правитель посылает.</strong> Это главное различие внутри группы. У большинства правителей все благословенные получают одну и ту же способность. У правителя рая — нет: «Так как правитель рая. Посылает им лишь сгустки чистой и необработанной силы, который формируется во что уже только внутри Апостолов. Даруя им уникальные способности» (2025-05-31, id 331635). То же в устах имитатора (2025-03-19, id 305856): «У нас апостолов в отличие от всех. Способность формируется. То бишь у каждого апостола уникальная способность. У других же благословенных одним правителем. Одинаковые способности.»</p>\n<p><strong>Сила самих благословенных при этом не различается.</strong> «Сразу всё благословенный равны по силе, путь то благословенный Богом, дьяволом, или другими правителем минимиров» (2025-01-13, id 281368). И позже (2025-05-31, id 331635): «так как всё благословенный включая апостолов. Получают плюс минус одинаковая количество энергии ( силы). Они являются одинаково сильными. Но это не включая индивидуальность людей.»</p>\n<p><strong>Зачем правитель вообще раздаёт благословения.</strong> Мотив назван только для двоих:</p>\n<ul>\n<li>бог: «В раю много добрых людей и бог име проникся из за этого даёт благословение» (2025-01-06, id 278943).</li>\n<li>дьявол: «У дьявола часто сбегают в грешники в наш мир и их надо возвращать поэтому он даёт благословение» (там же). Механика возврата уточнена 2025-01-06 (id 279011): «Он даёт благословение людям, а эти люди изгоняют грешников из этого мира и отправляют в ад» — то есть убивая: «Да после смерти грешники опять отправляются в ад» (id 279014).</li>\n</ul>\n<p>Мотивы прочих правителей в переписке не названы.</p>\n<p><strong>Оценка дьявола.</strong> «дьявол правитель \"ада\" добрый, типо он карает грешников» (2025-01-06, id 278852), «дьявол каратель, он наказывает грешников» (id 279004). Он же «в бешенстве что сбегают грешники» (id 278954) — из-за этого гнева демоны из ада не сбегают, тогда как ангелам «просто незачем сбегать».</p>\n<p><strong>Существо.</strong> Правитель нашего мира и самый сильный из правителей. «Существо являющий правителем нашего мира создала смерть которая таскает души в разный миры» (2025-01-06, id 278883). Смерть, в свою очередь, «после нашей кончины не даёт остаться в нашем мире и вечно отправлять нам куда-то» (id 278852). Про присутствие существа в сюжете: «Также есть существо в нашем мире который является правителем нашего мира ( но сейчас он не нейтрален, в сюжете пока его не будет)» (id 278868).</p>\n<p><strong>Правитель Кильки: сдерживание аномалии.</strong> «Аномалий это мир, который образовался внутри Кильке и конечно правитель кильке не позволяет ему расти» (2025-03-06, id 298868), «То бишь озера перерождения» (id 298869). Такой функции у других правителей не названо.</p>\n<p><strong>Правитель Кильки как источник благословения сестры-злодейки</strong> (2025-08-30, id 359684): «Есть сестра благословенная правителем Кильке. Да она сильнее одного апостола. Но дальше че. Это не та сила, что поставит на колени весь мир.»</p>", "r": []}, {"t": "Иерархия", "a": ["S05", "GR-0023-S05", "GR-0023--ierarhiya"], "h": "<p>Над группой не стоит никто. Вопрос Миколая «а есть кто-то кто контролирует все миры?» (2025-01-06, id 278887) — ответ «Нет» (id 278888), с оговоркой: «Но самым сильном является \" существо\"» (id 278889).</p>\n<p>Ранг внутри группы задаётся тремя вещами:</p>\n<ol>\n<li><strong>Порядком появления.</strong> Первый — правитель кильке, второй — правитель рая; из этого следует размер их миров (2025-05-31, id 331635).</li>\n<li><strong>Силой.</strong> «Существо» — самый сильный, при этом всеми мирами не управляет.</li>\n<li><strong>Тягой к «существу» снизу.</strong> «Правитель минимиров могут наблюдать за нашем, вот и изменять свой пытаясь копировать наш чтобы хоть чуть-чуть приблизится к могуществу \" существа\"» (2025-01-06, id 278894), «большинство правитель пытаются достигнуть нашего правителя из за этого пытаются везде его копировать» (id 278912).</li>\n</ol>\n<p>Копирование касается конкретных мест: на вопрос «копировать че как и зачем? размеры, культуру, механизмы?» (id 278864) ответ — «Копировать например кладбище, именной какой-то место в нашем мире» (id 278867).</p>\n<p>Единственное общее ограничение, которому подчинены все без исключения, — связь между мирами: её «не может оборвать не один правитель».</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S06", "GR-0023-S06", "GR-0023--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>Благословенные и апостолы.</strong> Правители — источник благословений. Связь устанавливается на мозге и без разрешения существа. Апостолы — «21 человек получивший благословен от правителя рая» (2025-05-31, id 331635), «Нас апостолов 21 во всём мире. Нас, именно нас благословенных правителем рая. Больше чем других благословенных другими правителями» (2025-03-19, id 305856). У апостолов есть дополнительная способность — телепатия между собой.</p>\n<p><strong>Протобионты.</strong> Дети правителей, созданные «именно правителем, а не из-за особенности мира»; не любят покидать мир своего родителя.</p>\n<p><strong>Чужемирцы.</strong> Правитель — один из трёх (2025-03-18, id 305117) или четырёх (2025-05-31, id 331635) способов оказаться в чужом мире. Обитатели первого мира из него уйти не могут никак: «мы субъекты первого мира. Не модем его пикинуть. Ну вот никак» (id 305117), «всё существа кильке не способны покинуть свой мир. Не каким либо образом» (id 331635).</p>\n<p><strong>Ритуал</strong> как способ перехода в переписке не проработан: в самом тексте Славы он записан со знаками вопроса — «С помощью ритуала???». На вопрос Миколая «жертвенный?» (2025-03-18, id 305402) Слава ответил: «Я не знаю», «Я просто это добавил», «Потом придумаю» (id 305403–305405). В истории то же самое сказано голосом рассказчика: «Мне об этом ритуале не рассказали по понятном причинам».</p>\n<p><strong>Фантазёры.</strong> Названы через правителей: «Фантазеры это можно сказать правитель с маленькой буквой. Они создали свой мир в голове» (2025-05-31, id 331636). Там же: «Фантазёр на данный момент сильнейший существа», и «нет не одной причины жить в мире правителя. Если ты можешь попасть в свой».</p>\n<p><strong>Арбетары и Альфы.</strong> Их сила берётся не от правителя, а из мира: «существа, который насильственно вырвали кусок силы своего мира... А после посели его в себе и заставили выделять силу» (2025-05-31, id 331636). Прямое противопоставление благословению: «по сути это благословенния только не через связь. А именно это сила находиться внутри их».</p>\n<p><strong>Артефакты.</strong> Побочный продукт неудачного создания мира (см. выше). Отдельно оговорено, что раскрыть мощь артефакта лучше всего способен обычный человек, а не благословенный, альфа, арбетар или фантазёр — «Так как уже сами переполненный силой».</p>\n<p><strong>Смерть.</strong> Создана существом, правителем нашего мира; таскает души в другие миры.</p>\n<p><strong>Жители рая.</strong> Мир, в котором живёт один из главных героев, уничтожил рай — но не правитель: «Точнее это были жители рая, сам правитель ничего не сделал» (2025-02-25, id 295217). На вопрос Миколая «зачем?» (id 295214) ответа в переписке нет. Позже (2025-03-19, id 305854) эта же мысль дана как теория персонажей: «Что все нападения на миры. Были устроены из Рая... Хотя это опять же не точно. Лишь теория. Без стопроцентных фактов.»</p>\n<p><strong>Правитель гибнущего мира.</strong> В той же прозе правителю дважды приписывают действия, но всегда предположительно, устами рассказчика-упыря: про выживших 17 % — «Не знаю, каким чудом. Возможно наш правитель подсобил»; про появление упырей — «Это заража из рая. Или это попытка правителя спасти людей. Не знаю»; про чёрную дымку, утягивающую его прочь, — «Это правитель пытается меня спасти. Отправив в другой мир». Ни одно из трёх в переписке не подтверждено как факт.</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S07", "GR-0023-S07", "GR-0023--kak-menyalas"], "h": "<p><strong>2024-11-13 (окно w0064, id 256812–256858).</strong> Под именем «существо» описана тварь из истории про гг: очень длинные руки и пальцы, когти, режущие одежду, капающая слюна. Внешность гг достроил по ощущению — «В прошлой части это существо капнула слюной на его голову вот он и подумал что он дофига длинный» (id 256844). К правителям на этом этапе оно не привязано. Связывает ли переписка эту тварь с правителем нашего мира — не сказано.</p>\n<p><strong>2025-01-06 (окно w0070, id 278852–279031).</strong> Первое устройство мира. Наш мир — «Вселенная», он первый, самый большой и бесконечный. Вторые по размеру — рай и ад. Множество минимиров, которые копируют наш мир. «почти во всех мирах есть правитель», правители могут давать благословение, но только людям из нашего мира. Правитель рая — бог, правитель ада — дьявол, правитель нашего мира — «существо», оно же создало Смерть, оно же самое сильное. Никто не контролирует все миры. Правители появились в пустоте, облика не имеют, полностью контролируют своё пространство, но не размеры. Дождь, войны и ссоры — не их работа. Единственное развлечение в бесконечной жизни — наблюдать за нашим миром. Бог и дьявол дают по 21 благословению; правители минимиров дают редко.</p>\n<p>На вопрос «3 мира и много минимиров или будут потенциально ещё миры но мы молчим?» (id 278895) — «Ну это надо подумать», «Ну пока 3 мира» (id 278896–278897). Осталось нерешённым на этой дате.</p>\n<p><strong>2025-01-13 (окно w0071, id 281365–281379).</strong> Уравнены благословенные всех правителей. Обсуждается, откуда взялись артефакты; Миколай предлагает два варианта: (1) правители при создании миров тратили энергию на артефакты, в которые заключали идеи; (2) «раньше веков 15 назад благословенные были мощее но типа их реже призывали поэтому они оставляли силу потомкам» и заключали её в артефактах — «просто думали что благословенных больше не будет и заботились о будущем». Какой из двух принят — в переписке не сказано; Слава в ответ говорит о временной природе благословения. Позднее, 2025-05-31, Слава даёт третье объяснение — артефакт как побочный продукт неудачного создания мира.</p>\n<p><strong>2025-02-25 (окно w0077, id 295209–295221).</strong> Уничтожение мира главного героя приписано раю, но правитель выведен из-под ответственности: сделали жители рая. Мотив не объяснён.</p>\n<p><strong>2025-03-06 (окно w0079, id 298826–298838).</strong> Отклонённый вариант: целью главного злодея было объединить все миры в один под Килькой, «таким образом наш правитель хочет иметь контроль над другими мирами» (id 298826). В тот же день роль злодея отдана другому персонажу: «И вообще мир будет объединять сестра имитатора, а не правитель» (id 298834). Правитель Кильки из злодейской роли выведен.</p>\n<p>Там же введено: правитель кильке сдерживает рост аномалии внутри своего мира.</p>\n<p><strong>2025-03-10 (окно w0079, id 300757–300760, 300890–300892).</strong> «Существо» переопределено: «Существо это ребёнок правителя, который имеет физическую оболочку» (id 300760). Это состояние не совпадает с январским, где существо само было правителем нашего мира. В переписке противоречие не обсуждается. Там же существа перечислены как один из трёх видов чужемирцев — наряду с обычными чужемирцами и альфами.</p>\n<p><strong>2025-03-18 (окно w0082, id 305116–305117, 305402–305407).</strong> Первый мир получает имя: «Килька», и это наш мир. Определение правителя дано как «бог» отдельного мира. Перечислены три способа перехода между мирами, третий и самый редкий — правитель отправляет сам. Ритуал не придуман и отложен.</p>\n<p><strong>2025-03-19 (окно w0083, id 305854–305858).</strong> Изложение изнутри истории, голосом персонажа-имитатора: у каждого мира есть правитель, включая наш; благословение — связь через мозг; лимит благословений у каждого правителя; благословение доступно только разумному жителю кильки; четыре базовых способности; апостолы — 21 благословлённый правителем рая, и только у них способность формируется индивидуально. Введён предохранитель в голове благословенного, отключающий благословение при выгорании мозгов.</p>\n<p><strong>2025-05-31 (окно w0099, id 331634–331638, 331646–331662).</strong> Большой лор-дамп Славы, целиком посвящённый правителям, и разбор вопросами Миколая. Здесь впервые собраны в одном тексте: происхождение в пустоте, порядок появления (первый — правитель кильке, второй — правитель рая), неразрывная связь миров, четыре способа покинуть свой мир, дети-Протобионты, полная механика благословения с десятью годами жизни, всевидение при невозможности вмешаться иначе как насильственным благословением, арбетары и альфы, фантазёры, артефакты и артефакты с символикой. О самом дампе Слава сказал: «Не знаю зачем я это сделал», «Но пусть будет» (id 331637–331638).</p>\n<p>Вопросы Миколая в этом окне, оставшиеся без ответа на краю окна (id 331658–331662): почему благословения даются именно людям; «корову можно?»; можно ли поглощать чужую энергию правителя и что об этом думает сам правитель; легче ли мозгу, когда энергия течёт вовне, и что было бы, если бы не лилась; «можно бессмертному дать второе?».</p>\n<p><strong>2025-08-30 (окно w0103, id 359684–359685).</strong> Правитель Кильке назван благословителем сестры-злодейки. Оценка силы: сестра сильнее одного апостола, но её подручные слабее апостолов и группировка невелика. Итог обсуждения — «Нужен злодей» (id 359685).</p>\n<p><strong>2025-10-18 (окно w0106, id 375843–375852).</strong> Миколай верстает лор-дамп от 2025-05-31 как страницу справочника и цитирует его дословно. Текст не изменён. Слава: «Очень круто», «Делай так» (id 375851–375852). Это последнее состояние описания правителей.</p>\n<p><strong>2026-02-06 (окно w0115, id 429334–429347).</strong> Упоминание вселенной «Правитель» по поводу сгенерированного нейросетью документа. Слава: «Давно не читал про вселенную правитель. Поэтому понравилась» (id 429344). Содержание документа за ссылкой, в переписке его текста нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "GR-0023-S08", "GR-0023--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава группы нет. Число правителей не названо.</li>\n<li>Не согласовано, есть ли правитель у каждого мира или «почти у каждого»: 2025-01-06 (id 278852) — «почти во всех мирах», 2025-03-18 (id 305116) — «в каждом этом мире был свой бог». В переписке это не обсуждалось.</li>\n<li>Зачем и с чего появились правители — «Фиг знает» (2025-05-31, id 331653). Осталось нерешённым.</li>\n<li>Является ли <a href=\"MR-0207.html\">Килька</a> («правитель Кильке», благословивший сестру) тем же лицом, что <a href=\"PS-0217.html\">Правитель Кильки</a> (Правитель Кильки), — в переписке не сказано.</li>\n<li>Является ли бог (правитель рая, 2025-01-06) тем же лицом, что правитель рая <a href=\"PS-0279.html\">Правитель рая</a> (2025-05-31 и позже), — прямо не сказано.</li>\n<li>Статус «существа» противоречив и противоречие не снято: 2025-01-06 — правитель нашего мира и самый сильный из всех; 2025-03-10 — «ребёнок правителя, который имеет физическую оболочку» и один из видов чужемирцев. Связь с тварью с длинными руками из окна w0064 не оговорена.</li>\n<li>Мотив, по которому правители раздают благословения, назван только у бога и дьявола. У остальных — не назван.</li>\n<li>Мотив уничтожения мира главного героя жителями рая не объяснён: вопрос «зачем?» (2025-02-25, id 295214) остался без ответа.</li>\n<li>Ритуал как способ покинуть мир не придуман — в тексте самого Славы он записан со знаками вопроса, и на прямой вопрос он ответил «Я просто это добавил. Потом придумаю» (2025-03-18, id 305404–305405).</li>\n<li>Какая из версий происхождения артефактов принята — предложение Миколая от 2025-01-13 или объяснение Славы от 2025-05-31 — в переписке не решено.</li>\n<li>Вопросы Миколая от 2025-05-31 про корову, поглощение энергии, отношение правителя к утечке своей силы и второе благословение для бессмертного остались без ответа.</li>\n<li>Число миров зафиксировано условно: «Ну это надо подумать. Ну пока 3 мира» (2025-01-06, id 278896–278897); позже к этому не возвращались.</li>\n</ul></div>", "r": [["Правитель Кильки", "PS-0217.html"], ["Правитель рая", "PS-0279.html"], ["Килька", "MR-0207.html"]]}, {"t": "Связи — всё вместе", "a": ["GR-0023--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0217.html\">Правитель Кильки</a>, <a href=\"PS-0279.html\">Правитель рая</a></li>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0068.html\">Существо с длинными руками</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0023--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0023.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0023-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0023/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Самая дорогая дыра — механика благословения. Она держит половину вселенной, и записей о ней в базе две, а статьи нет ни у одной: <code>SP-0240</code> «Благословение правителя» (9 835 знаков) и <code>SP-0242</code> «Уникальная способность правителя» (9 592). Обе без проставленной вселенной — числятся как «неясно». Между тем на эту механику опираются <code>GR-0013</code> (благословенные), <code>GR-0001</code> (апостолы), <code>VS-0002</code> и вся эта статья: почти каждое различие между правителями сформулировано через то, сколько и какого рода благословений он раздаёт.</p>\n<p>Вторая по цене — «существо». Слово несёт две несовместимые роли (правитель нашего мира и самый сильный из всех против «ребёнок правителя, имеющий физическую оболочку» и один из видов чужемирцев), и на нём висит позиция в составе группы — <code>MR-0068</code>, у которой в базе 18 447 знаков против 15 170 в статье. Пока противоречие не снято, состав группы содержит запись, про которую неизвестно, правитель это вообще или нет.</p>\n<p>Сам класс правителей размазан по пяти записям: <code>MR-0120</code> (35 010 знаков базы), <code>PS-0278</code> (26 811), <code>MR-0097</code>, <code>MR-0103</code>, плюс персональные <code>PS-0217</code> и <code>PS-0279</code>. Своей базы у группы нет.</p>\n<h3>С чего начать</h3>\n<p>В базе. Сначала проставить вселенную у <code>SP-0240</code> и <code>SP-0242</code> и втянуть их — там почти двадцать тысяч знаков про то, что в статье изложено выжимкой. Потом свести <code>MR-0120</code>, <code>PS-0278</code>, <code>MR-0097</code> и <code>MR-0103</code>: четыре записи об одном классе, различающиеся, судя по названиям, только тем, сказано «правитель», «правители» или «правители минимиров».</p>\n<p>В архив — только за «существом»: окно w0064 (2024-11-13, id 256812–256858), где тварь с длинными руками ещё не связана с правителями, и 2025-03-10 (id 300757–300760, 300890–300892), где слово уже значит другое. Переход между этими двумя датами и есть то, чего в статье нет.</p>\n<h3>Как развивалось</h3>\n<p>2025-01-06 — заявили за один вечер почти всё: происхождение в пустоте, отсутствие облика, власть над своим миром, благословения, бог, дьявол, «существо». Тем же вечером ограничили: размеры мира менять нельзя, дождь и войны не их работа, над всеми никто не стоит. 2025-01-22 — отменили посмертие, и вместе с ним поплыла причина, по которой дьявол раздаёт благословения; к этой связке не вернулись. 2025-03-06 — вывели правителя Кильки из роли главного злодея. 2025-05-31 — вернулись большим дампом, где всё собрано заново и добавлены протобионты, фантазёры, артефакты; автор сам приписал: «Не знаю зачем я это сделал», «Но пусть будет». 2025-10-18 — вернулись ещё раз, вёрсткой: тот же текст дословно, без правок.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Про связь сказано со стороны носителя: благословение даётся одно, до смерти, «нельзя разорвать». Про отключение сказано с двух сторон — предохранитель в голове благословенного гасит силу при выгорании мозгов, чёрный шар создаёт зону, куда связь не дотягивается. Со стороны правителя — того, кто эту связь настроил и настроил без разрешения существа, — правила нет: может ли он сам её оборвать, не проговорено ни в одной редакции.</p>\n<h3>Отклик</h3>\n<p>Лучшее в правителях — их бессилие. Всевидящие, вечные, создали миры по своему желанию — и не могут вмешаться ни во что, кроме как насильно всунуть человеку благословение, которого он не просил. Плюс единственное развлечение в бесконечной жизни: смотреть на чужой мир и копировать оттуда кладбище. Это точнее любого описания могущества — тоска, которая выражается в плагиате. Отдельно стоит «Фиг знает» в ответ на «нахуя и с чего появились правители»: вопрос о происхождении богов остался без ответа, и это честнее, чем ответ был бы.</p></div>", "r": []}];</script>
