<script>const BASE="";const DOCNAME="Дымовой чел";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0075-S01", "PS-0075--proishozhdenie"], "h": "<p>Дымовой чел — персонаж Славы. Заявка подана 2024-05-10 в окне w0033 (id 167587–167591) одним сообщением: внешность и четыре пронумерованные способности. Тут же Слава попросил дополнить: «Ну и можешь ещё какой-нибудь способности добавить», «Типо огня только опиши использования» (id 167590–167591). В ответ Миколай прислал развёрнутую карточку, сделанную через нейросеть, — по его словам, он «получил доступ к новой нейросети», «Самой мощной на сегодняшний день», доступ ограничен, «Поэтому я не хочу упускать шанс ей воспользоваться» (id 167593–167596). Карточку Слава принял: на вопрос «Кстати, норм?» ответил «Да» (id 167602–167603).</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0075-S02", "PS-0075--vneshnost"], "h": "<p>Заявка Славы (id 167589): «Черный только грудная клетка и глаза светятся красным».</p>\n<p>Развёрнутая карточка (id 167592):</p>\n<ul>\n<li>Чёрный, с отчётливо видимой грудной клеткой и горящими красными глазами.</li>\n<li>Вокруг него всегда присутствует лёгкая дымка, которая усиливается при использовании его способностей.</li>\n<li>Движение плавное и текучее, «создавая впечатление, что он полностью состоит из дыма».</li>\n</ul>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0075-S03", "PS-0075--sposobnosti"], "h": "<p><strong>Заявленные Славой четыре (2024-05-10, id 167589):</strong></p>\n<ol>\n<li>«делает черную дымку в которой сложно дышать и ориентироваться»</li>\n<li>«тепловой зрение»</li>\n<li>«полет, как деку который использовал дымку и летал»</li>\n<li>«самовозгорание других веществ касаясь ладонью»</li>\n</ol>\n<p><strong>Развёрнутая карточка (id 167592):</strong></p>\n<ol>\n<li><strong>Чёрная дымка</strong> — плотное облако чёрного дыма, заполняющее пространство радиусом в 10 метров. Внутри дымки трудно дышать и ориентироваться из-за пониженной видимости и нехватки кислорода. Применение: атака (дезориентировать и ослабить противника перед прямой атакой) и защита (скрыться и сбить с толку преследователей).</li>\n<li><strong>Тепловое зрение</strong> — видит в тепловом спектре, различает живых существ и тепловыделяющие объекты даже в полной темноте. Видит сквозь дымку и любые препятствия, определяя местоположение врагов и обходя ловушки. Применение: разведка и наведение.</li>\n<li><strong>Полёт</strong> — окружив себя дымкой, становится легче и может летать, используя дым как средство передвижения; мгновенно поднимается в воздух и перемещается в любом направлении с большой скоростью. Применение: уклонение, манёвренность, атака с воздуха.</li>\n<li><strong>Самовозгорание</strong> — прикоснувшись ладонью к любому горючему веществу, вызывает мгновенное возгорание; огонь распространяется по поверхности и вызывает масштабные пожары. Применение: поджог, атака при контакте, отвлечение внимания.</li>\n<li><strong>Огненные колья</strong> (обозначены в карточке как «новая способность») — формирует из своего тела копья из огня и метает их в противников; копья пронзают цель, мгновенно воспламеняя её. Применение: дистанционная атака, блокировка путей отхода барьерами из копий, комбинация с дымкой, «чтобы враги не могли их сразу заметить».</li>\n</ol>\n<p><strong>Тактика боя</strong> (из той же карточки): изнурение врага дымкой, лишая его кислорода и видимости; атака огненными кольями или поджиг при контакте с опорой на тепловое зрение; полёт над полем боя для манёвров; поджоги, чтобы окружить врагов и ограничить их манёвренность.</p>\n<p><strong>Слабости:</strong></p>\n<ul>\n<li>Влага — «уязвим перед водой, так как влажная среда может подавлять его дымку и ограничивать его возможности».</li>\n<li>Воздух — при сильном ветре дымка рассеивается быстрее, что ограничивает возможность скрываться и атаковать.</li>\n</ul>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0075-S04", "PS-0075--svyazi-s-drugimi"], "h": "<p>В карточке сущности указаны связи с Зурбоном, Катапирой и Пиромантой. Характер этих связей в приведённых кусках переписки не проговаривается.</p>\n<p>Полёт задан отсылкой к внешнему источнику: «полет, как деку который использовал дымку и летал» (id 167589).</p>", "r": []}, {"t": "Как менялся", "a": ["S05", "PS-0075-S05", "PS-0075--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2024-05-10 (id 167587–167591).</strong> Заявка Славы: внешность и четыре способности, плюс просьба добавить огненную с описанием применения.</p>\n<p><strong>Версия 2 — 2024-05-10 (id 167592–167603).</strong> Развёрнутая карточка Миколая: к четырём заявленным способностям добавлены числовые и механические уточнения (радиус дымки 10 метров, нехватка кислорода, зрение сквозь препятствия, облегчение тела в дымке как причина полёта, масштабные пожары), появляется пятая способность — огненные колья, а также разделы «Тактика боя» и «Слабости». Слава подтвердил: «Да».</p>\n<p><strong>Версия 3 — 2026-06-14 (id 489442, окно w0121).</strong> Слава пересылает исходную короткую заготовку одним сообщением, дословно повторяя текст 2024 года: чёрный, только грудная клетка и глаза светятся красным; чёрная дымка, тепловое зрение, полёт «как деку», самовозгорание веществ от касания ладонью. Пятая способность (огненные колья), тактика и слабости в пересланном тексте отсутствуют. Обсуждения не последовало.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S06", "PS-0075-S06", "PS-0075--chto-s-nim-stalo"], "h": "<p>После одобрения карточки в 2024 году персонаж в переписке не разрабатывался. В 2026-06-14 заготовка была переслана заново без изменений и без реакции соавтора.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0075-S07", "PS-0075--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вселенная в окне w0033 не названа; связь с ростером пришельцев прямо не заявлена.</li>\n<li>В окне w0121 персонаж ни к вселенной, ни к сюжету не привязан, реакции соавтора нет.</li>\n<li>Характер, происхождение и биография не обсуждались: в переписке есть только внешность и набор способностей.</li>\n<li>Имя остаётся рабочим — «Дымовой чел»; собственного имени персонаж не получил.</li>\n<li>Неясно, отменяет ли пересылка 2026 года пятую способность или это просто повтор старой заготовки: в переписке об этом не сказано.</li>\n<li>Отношения с Зурбоном, Катапирой и Пиромантой не описаны.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["PS-0075--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-05-10</td>\n<td>167587–167591</td>\n<td>w0033</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-05-10</td>\n<td>167592–167603</td>\n<td>w0033</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-14</td>\n<td>489442–489442</td>\n<td>w0121</td>\n<td>неясно (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0075-dymovoy-chel.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0075--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0075.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
