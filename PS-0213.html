<script>const BASE="";const DOCNAME="Выродок";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0213-S01", "PS-0213--proishozhdenie"], "h": "<p>Выродок — персонаж Славы, существовавший к моменту разговора уже как «неполный», недоработанный. В переписке он всплывает не при разработке, а при выборе роли для отыгрыша (2025-02-26, id 295891–295906).</p>\n<p>Разговор начинается с того, что Слава отказывается отыгрывать Бена 10: «Сначала пытался, а потом забил. Ведь Бен, чуть ли не моя противоположность» (id 295891), пробовал он «пол-дня» (id 295892). На вопрос Миколая, не хочет ли он попробовать ещё, Слава отвечает: «Ну только не Бена» (id 295894).</p>\n<p>Миколай на это говорит о собственном выборе: «мой персонаж тоже полная моя противоположность», «абсолютно», «из того в чем мои слабости», «это интересно», «но это сложно» (id 295896–295900). Дальше он рассуждает, что, наверное, выберет что-то проще, но к Тане тоже вернётся, «интересно просто» (id 295901), и что «шимпачи отыгрывать тоже интересно, пусть по описанию он и похож, поведение всё-таки отличается и я его плохо понимаю» (id 295902).</p>\n<p>После этого Слава называет свой выбор: «Ладно я выродок, наверное будет легче, неполного персонажа, отыгрывать, чтобы больше было простора» (id 295903). Миколай добавляет про свой вариант: «но чувствую как можно сыграть» (id 295904). Слава заканчивает: «Давай» (id 295906).</p>\n<p>Таким образом, единственная зафиксированная характеристика Выродка — его незавершённость, и именно она названа причиной выбора: неполного персонажа отыгрывать легче, «чтобы больше было простора».</p>", "r": []}, {"t": "Связи с другими", "a": ["S02", "PS-0213-S02", "PS-0213--svyazi-s-drugimi"], "h": "<p>В базе Выродок связан с Мальчиком из братской могилы (Бессмертным). В самой переписке этого окна связь не проговаривается.</p>\n<p>В более позднем списке (окно w0079) среди Апостолов значится «Бессмертный выродок» — то же это лицо или другое, в переписке не сказано.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S03", "PS-0213-S03", "PS-0213--kak-menyalsya"], "h": "<p><strong>2025-02-26 (id 295891–295906)</strong> — единственное появление. Персонаж не разрабатывается: он только называется как уже существующий и недоработанный и берётся Славой для отыгрыша. Ни одной черты, кроме «неполноты», в окне не добавлено.</p>", "r": []}, {"t": "Пробелы", "a": ["S04", "PS-0213-S04", "PS-0213--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Кто такой Выродок, в переписке не раскрыто: ни внешности, ни характера, ни способностей, ни биографии.</li>\n<li>Чем именно персонаж «неполный» — какие части задуманы, а какие нет, — не названо.</li>\n<li>Тождество с «Бессмертным выродком» из списка Апостолов осталось нерешённым.</li>\n<li>Как прошёл сам отыгрыш и что в нём выяснилось о персонаже, в этом окне не зафиксировано.</li>\n<li>Происхождение имени не объяснено.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["PS-0213--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-02-26</td>\n<td>295891–295906</td>\n<td>w0078</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0213-vyrodok.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0213--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0213.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0213-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0213/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дыра здесь одна и она не в этой статье. Тождество с «Бессмертным выродком» из списка апостолов висит между тремя записями сразу: <code>PS-0213</code> (эта, ссылок ноль, статья 4.2 КБ при базе 3.3 — база выбрана до дна), <code>PS-0184</code> «Бессмертный выродок» (четыре ссылки, статья 10.6 при базе 10.7) и <code>PS-0211</code> «Мальчик из братской могилы (Бессмертный)» (три ссылки, статья 36.5 при базе 58.3 — 22 КБ ещё не перенесено). Три карточки, семь входящих ссылок на две из них, и нерешённый вопрос, сколько там на самом деле лиц.</p>\n<p>Развести их можно только по списку, в котором «Бессмертный выродок» стоит строчкой, — то есть по окну w0079. Этот список в наборе есть и статьи у него нет: <code>SL-0053</code> (20.3 КБ, шесть ссылок) и <code>SL-0051</code> (9.8 КБ, шесть ссылок). Шесть входящих на каждый, ноль статьи — это самые дорогие записи вселенной, и они же единственный способ закрыть здешний пробел. Чинить надо их, а не эту статью: сама по себе она не тянет ничего, но её единственный открытый вопрос упирается ровно туда, куда упираются ещё пять.</p>\n<h3>С чего начать</h3>\n<p>В базу, не в архив. По самому Выродку в базе больше ничего нет — статья длиннее исходника. Но соседи не выбраны: <code>PS-0211</code> — 58.3 КБ базы против 36.5 статьи, и если тождество где-то решается, то там. Отыгрыш, о котором в этом окне только договорились, заведён двумя отдельными записями без статей: <code>SL-0059</code> «Отыгрыш персонажей» (16.4 КБ) и <code>SL-0061</code> «Игра в отыгрыш персонажей» (3.5 КБ). Пробел «как прошёл сам отыгрыш и что в нём выяснилось» надо задавать им — 16.4 КБ неразобранного материала ровно про это.</p>\n<p>В архив — за одним: чем кончилось «Давай» (id 295906). Договорённость датирована 2025-02-26, окно w0078; смотреть надо следующие окна за конец февраля — начало марта 2025, ищется не разработка персонажа, а сама игра, реплики от лица. Ориентир — соседние имена из того же разговора: Бен 10, Таня, шимпачи; если отыгрыш состоялся, они всплывут рядом.</p>\n<h3>Как развивалось</h3>\n<p>Одна дата, 2025-02-26, и внутри неё всё движение. Персонаж не заявлен — он назван как уже существующий и уже недоработанный, то есть заявлен где-то раньше и вне записи. Тут же ограничен: единственная его черта, неполнота, названа не свойством, а удобством — «чтобы больше было простора». И на этом забыт: ни одного упоминания после. Возврата нет.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Критерий пригодности персонажа для отыгрыша в этом окне назван — дважды и с обеих сторон. Слава про Бена 10: «Ведь Бен, чуть ли не моя противоположность», пробовал полдня и забил. Миколай про своего: «полная моя противоположность», «абсолютно», «это интересно», «но это сложно». То есть противоположность автору проговорена как рабочий признак — у одного как причина бросить, у другого как причина взяться.</p>\n<p>К Выродку этот признак не применён. Он выбран по другому основанию — по неполноте, — и противоположен он Славе или похож на него, не сказано ни слова. Правило названо для двух соседних случаев подряд и не названо для третьего, названного в той же реплике.</p>\n<h3>Отклик</h3>\n<p>Зацепило одно: «неполного персонажа, отыгрывать, чтобы больше было простора». Это сказано походя, между «не хочу Бена» и «Давай», и это единственная содержательная вещь про Выродка во всей записи — но она про метод, а не про персонажа. Недоделанность здесь не долг и не стыд, а рабочее преимущество: дыры в персонаже — это место, где можно двигаться. Смешно и хорошо, что персонаж, о котором мы не знаем ровно ничего, попал в справочник именно за то, что о нём ничего не известно; статья честно длиннее своего источника и при этом не добавила ни одной черты. Всё остальное в окне — про выбор роли, не про Выродка, и делать вид, что это не так, не получилось бы.</p></div>", "r": []}];</script>
