<script>const BASE="";const DOCNAME="Петля возрождения ГГ";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0261-S01", "SP-0261--mehanika"], "h": "<p>То, как главный герой рассказа «Рогалик и бесконечный данж» возвращается после смерти (2026-04-11, id 457506–457535, окно w0119).</p>\n<p>Исходная постановка: «гг просыпается в начале данже и ничего не помнит, проходит дальше и умирает и снова оказывается в самом начале, но сам данж изменился» (id 457506). Само возвращение Слава называет петлёй и объясняет так: «Ну где гг умирает и оказывается в начале то бишь петля» (id 457527).</p>\n<p>Отдельно оговорено, что «Бесконечный данж означает здесь нет конца, как и концовки. Это просто для меня бесконечный рассказ, который я никогда не закончу» (id 457506).</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0261-S02", "SP-0261--ogranicheniya-i-cena"], "h": "<ul>\n<li>Герой ничего не помнит — потеря памяти заявлена уже в первом описании и относится к состоянию, в котором он просыпается в начале данжа (id 457506). Эта же потеря памяти позже, в том же разговоре, стала основанием для покупки навыков в системе прокачки (<a href=\"SP-0262.html\">Система прокачки в бесконечном данже</a>).</li>\n<li>Данж после смерти не тот же самый: «сам данж изменился» (id 457506). Что именно меняется, не расписано; уровни Слава собирался придумывать на ходу.</li>\n<li>Ограничений по числу возрождений, по месту возрождения или по тому, что герой сохраняет между петлями (навыки, предметы, ОЭм), в переписке не названо.</li>\n</ul>", "r": [["Система прокачки в бесконечном данже", "SP-0262.html"]]}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0261-S03", "SP-0261--nositeli"], "h": "<p>Только главный герой, и он один: «Да всё я уже решил один гг» (id 457525). Другие исследователи — «люди который здесь очутились и спускаються по данжу» — описаны как те, кто спускается «без возможности вернуться в прошлое» (id 457515, из разговора о системе прокачки, <a href=\"SP-0262.html\">Система прокачки в бесконечном данже</a>), то есть петля на них не распространяется.</p>\n<p>Миколай на этом месте отметил, что понял механику иначе: «я думал одно место спавна» (id 457526).</p>", "r": [["Система прокачки в бесконечном данже", "SP-0262.html"]]}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0261-S04", "SP-0261--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 (2026-04-11, id 457506, окно w0119).</strong> Заявка на рассказ с двумя вариантами возрождения на выбор: «Типа либо это просто петля. Либо после смерти нашого гг, мы будем переключаться на другого, который в начале». Тут же — сомнение автора: «Ну я не уверен, что смогу это осилить. Поэтому есть идеи?» Порядок работы назван в том же сообщении: «Во первых надо условия данжа сделать, способ прокачки, оружия и т. Д. После надо решить как гг будет возрождаться».</p>\n<p><strong>Версия 2 (2026-04-11, id 457521–457535).</strong> Миколай попросил объяснить оба варианта («объясни че за петля че за другой», id 457524), и Слава к этому моменту уже закрыл вопрос: «Да всё я уже решил один гг» (id 457525). Далее разъяснение второго варианта и отказ от него.</p>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S05", "SP-0261-S05", "SP-0261--otklonennye-varianty"], "h": "<p><strong>Смена героя вместо петли</strong> (2026-04-11, id 457506, 457528–457532). Вариант: «мы наблюдаем за гг и он умирает, ну и всё он по-настоящему умер и теперь у нас новый гг» (id 457528). Реакция Миколая: «а, нифига», «я такое не видел» (id 457529–457530). Отклонён Славой по причине неподъёмности, а не негодности: «Только я такое не потяну», «Не смогу» (id 457531–457532).</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S06", "SP-0261-S06", "SP-0261--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Петля — часть рассказа «Рогалик и бесконечный данж» и стоит в одном ряду с системой прокачки в бесконечном данже (<a href=\"SP-0262.html\">Система прокачки в бесконечном данже</a>), обсуждавшейся в том же разговоре тем же утром. Сцепка между ними прямая: потеря памяти при возрождении названа причиной, по которой навыки герой не изобретает, а покупает.</p>", "r": [["Система прокачки в бесконечном данже", "SP-0262.html"]]}, {"t": "Пробелы", "a": ["S07", "SP-0261-S07", "SP-0261--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Не сказано, сохраняет ли герой между петлями навыки, мастерство, предметы и ОЭм, или обнуляется всё.</li>\n<li>Не сказано, помнит ли герой хоть что-то о прошлых заходах.</li>\n<li>Не сказано, что именно и по каким правилам меняется в данже после каждой смерти.</li>\n<li>Не сказано, есть ли у петли источник или причина внутри мира.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0261--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0262.html\">Система прокачки в бесконечном данже</a></li>\n<li><strong>Упомянут в способностях:</strong> <a href=\"SP-0262.html\">Система прокачки в бесконечном данже</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0005.html\">Иссекай</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0261--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-04-11</td>\n<td>457506–457506</td>\n<td>w0119</td>\n<td>Иссекай (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-04-11</td>\n<td>457521–457535</td>\n<td>w0119</td>\n<td>Иссекай (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0261-petlya-vozrozhdeniya-gg.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0261--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0261.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
