<script>const BASE="";const DOCNAME="Солнышко";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0113-S01", "PS-0113--proishozhdenie"], "h": "<p>Персонаж вселенной «7 островов», появившийся в перечислении уже существующих персонажей: «ну получается такс», «есть солнышко» (2024-07-04, id 196715–196716). То есть на момент разговора Солнышко уже числится среди своих — момента придумывания в переписке не зафиксировано, зафиксирована только фиксация состава.</p>\n<p>Варианты имени: «солнышко», «императорша».</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0113-S02", "PS-0113--vneshnost"], "h": "<p>Рыба-человек. Определение дал Слава сразу после того, как Миколай назвал персонажа императором: «Рыба человек» (id 196718). Ответ Миколая — «о», «норм» (id 196719–196720). Больше никаких деталей внешности в переписке нет.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0113-S03", "PS-0113--harakter"], "h": "<p>В переписке не описан.</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0113-S04", "PS-0113--sposobnosti"], "h": "<p>С персонажем связана способность Солнце.</p>\n<p>Во второй заход (2024-07-04, id 197086–197099) Слава вводит для неё ограничение через устройство самого солнца: «Солнце это звезда которая что-то поглощает», «Даже если держать её на способности вечно не выйдет» (id 197098–197099). То есть держать солнце на способности бесконечно нельзя — оно требует, чтобы что-то поглощалось.</p>\n<p>В этом же обмене солнце привязывается к мусорной экономике: Миколай говорит, что «там будет корпорация» (id 197088), «межостровная» (id 197092), а Слава формулирует: «Для поддержания солнце в ней будет сжигаться мусор» (id 197095). Как именно корпорация соотносится с самим персонажем — в переписке не сказано; сказано только, что Солнышко надо учитывать в этой экономике: «Солнышко есть еще», «Не забываю» (id 197086–197087).</p>", "r": []}, {"t": "Положение", "a": ["S05", "PS-0113-S05", "PS-0113--polozhenie"], "h": "<p>Императорша подводного острова при конституционной монархии. Первое определение Миколая — «он император» (id 196717), Слава тут же поправляет: «Императорша» (id 196721), Миколай принимает: «оке» (id 196722).</p>\n<p>Связана с Островом на дне океана (сфера) и с Рыба-людьми.</p>", "r": []}, {"t": "Связи с другими", "a": ["S06", "PS-0113-S06", "PS-0113--svyazi-s-drugimi"], "h": "<p>С Нуаром — отношения. Разговор идёт так: Миколай спрашивает «то есть у них отношения?» (id 196724), Слава отвечает «Не официальный» (id 196725) и добавляет «Ну хочу чтобы были» (id 196726). Миколай называет это симбиозом: «симбиоз», «ну это прикольно» (id 196727–196728).</p>\n<p>То есть отношения на момент разговора неофициальные, и их наличие — то, чего Слава хочет добиться, а не то, что уже установлено.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S07", "PS-0113-S07", "PS-0113--kak-menyalsya"], "h": "<p><strong>2024-07-04, id 196715–196728 (окно w0043).</strong> Солнышко назван императором, поправлен на рыба-человека и императоршу. Установлены неофициальные отношения с Нуаром, названные Миколаем симбиозом.</p>\n<p><strong>2024-07-04, id 197086–197099 (окно w0043).</strong> Слава напоминает, что Солнышко тоже надо учитывать в мусорной экономике. Вводится ограничение на способность: солнце — звезда, которая что-то поглощает, вечно держать её на способности не выйдет. Появляется межостровная корпорация, в которой для поддержания солнца будет сжигаться мусор.</p>\n<p>Прежнее состояние вторым заходом не отменяется — оно дополняется ограничением.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0113-S08", "PS-0113--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Не до конца ясно, между кем именно отношения: Миколай переспрашивает «то есть у них отношения?», прямого ответа, кто с кем, в переписке нет.</li>\n<li>Характер не описан.</li>\n<li>Внешность дальше формулы «рыба-человек» не разработана.</li>\n<li>Как межостровная корпорация связана с самой императоршей — в переписке не сказано.</li>\n<li>Что за конституционная монархия и как она устроена — не разворачивается.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0113--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0033.html\">Рыба-люди</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0104.html\">Нуар</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0033.html\">Рыба-люди</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0113--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-04</td>\n<td>196715–196728</td>\n<td>w0043</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-04</td>\n<td>197086–197099</td>\n<td>w0043</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0113-solnyshko.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0113--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0113.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
