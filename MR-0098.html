<script>const BASE="";const DOCNAME="Душа";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0098-S01", "MR-0098--ustroystvo"], "h": "<p>Душа — понятие сеттинга, введённое одной репликой в ответ на прямой вопрос. Миколай спросил «че такое душа» (2025-01-06, id 278890), Слава ответил: «Это мы, наш фантомный облик» (id 278892).</p>\n<p>Определение построено на отождествлении: душа — не то, что человеку принадлежит, а сам человек («это мы»). Второе слово формулировки — «фантомный облик» — задаёт её как облик, а не как бесплотную сущность без формы.</p>\n<p>Именно душу Смерть таскает между мирами.</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0098-S02", "MR-0098--naselenie"], "h": "<p>Не применимо: душа не мир с населением, а понятие сеттинга, помещённое в раздел миров.</p>", "r": []}, {"t": "Место во вселенной — как связан с другими мирами", "a": ["S03", "MR-0098-S03", "MR-0098--mesto-vo-vselennoy"], "h": "<p>Душа связана с двумя вещами: с Вселенной (нашим миром) и со Смертью. Со Смертью — через перенос: душа есть то, что перемещается между мирами, и переносит её Смерть.</p>\n<p>Вопрос Миколая, заданный в том же сообщении, что и вопрос про душу, — «как они копируют наш мир» (id 278891) — остался без ответа в этом фрагменте. Так же без ответа остался и следующий его вопрос: «как создаются минимиры или они всегда есть/были?» (id 278893). Связь души с копированием мира и с минимирами таким образом обозначена соседством вопросов, но в переписке не проговорена.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0098-S04", "MR-0098--kak-menyalsya-po-versiyam"], "h": "<p>Зафиксировано одно состояние — 2025-01-06 (id 278890–278893).</p>\n<p>Отдельно отмечено расхождение с более ранней вселенной. В предыдущей вселенной на тот же вопрос был дан ответ «души нету» (w0069, id 276687–276689); здесь душа есть. Это не правка и не смена решения — это разные вселенные, и оба состояния сохраняются каждое в своей.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0098-S05", "MR-0098--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Не сказано, у кого есть душа, а у кого нет.</li>\n<li>Не сказано, что происходит с душой, когда Смерть переносит её между мирами, и зачем она это делает.</li>\n<li>«Фантомный облик» не раскрыт: видим ли он, есть ли у него плотность, отличается ли от прижизненного облика — не сказано.</li>\n<li>Вопросы про копирование нашего мира и про происхождение минимиров заданы, но в этом фрагменте ответа не получили.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["MR-0098--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-01-06</td>\n<td>278890–278893</td>\n<td>w0070</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0098-dusha.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0098--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0098.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
