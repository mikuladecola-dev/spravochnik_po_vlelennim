<script>const BASE="";const DOCNAME="Совет";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0086-S01", "GR-0086--chto-eto"], "h": "<p>Коллективный орган, упомянутый в рассказе Славы «Цена жизни» (2026-02-16, id 433701–433713, окно w0118). Название в переписке даётся строчной буквой и только один раз — в реплике Дена «совет принят объективное решение».</p>\n<p>Всё, что о совете известно, содержится в одном обмене репликами в конце рассказа. Ден отказывается участвовать в самосуде над подростком-убийцей доводом «потому что мы с тобой не имеем права судить». Бен на это отвечает вопросом-насмешкой: «ха... А кто имеет право. Бог что-ли или дьявол». Ответ Дена — «совет принят объективное решение». Из этого следует ровно две вещи: совет — это те, кто имеет право судить, в отличие от Дена и Бена лично; и совет по данному делу уже вынес решение, которое Ден называет объективным.</p>\n<p>Само решение в тексте не приведено. Ден в том же разговоре говорит Бену «Бен мы его накажем. Только не так, как хочешь ты» — то есть наказание для подростка предполагается, но в чём оно состоит и совпадает ли оно с решением совета, в рассказе не сказано. Связь между репликой «мы его накажем» и решением совета прямо не проведена.</p>\n<p>Ответ Бена — не оспаривание решения по существу, а отказ признавать за людьми способность быть объективными вообще: «с каких пор люди стали объективными. Не тогда когда мир был пропитан законам и правилам, не сейчас, когда мы дохнем как мухи, чтобы хоть что-то защитить. Люди никогда не будет объективными». Из этой реплики следует, что совет для Бена состоит из людей, а не из богов или духов, — но прямо это тоже не заявлено, Бен говорит о людях вообще.</p>\n<p>Заведён в справочнике как группа только на том основании, что это явно коллективный орган, названный в переписке. Ни устройство совета, ни его состав, ни мир, в котором он существует, не раскрыты. Авторы совет отдельно не обсуждали: после текста рассказа Слава объясняет замысел («Просто я подумал о разногласий. Точнее чувство виновности и цены жизни. Я хотел написать историю о персонажей, что говорит о том что не виновен и представляет вполне разумный доводы ну мстительный дух его всё равно заебыввет»), и в этом объяснении слово «совет» не звучит. Миколай на рассказ откликается только вопросом о том, когда тот был написан.</p>", "r": []}, {"t": "Иерархия", "a": ["S02", "GR-0086-S02", "GR-0086--ierarhiya"], "h": "<p>Внутреннее устройство совета не описано. Единственное, что о положении совета сказано, — это противопоставление коллективного решения единоличному, которое проходит через весь спор:</p>\n<ul>\n<li>Ден в начале рассказа: «Ты не можешь просто взять и единолично решить принять решение, о чужой жизни». Бен отвечает «могу!».</li>\n<li>Ден в конце: «мы с тобой не имеем права судить», и следом — «совет принят объективное решение».</li>\n</ul>\n<p>То есть совет в рассказе стоит выше отдельного человека в праве решать чужую судьбу. Кому совет подчинён, из кого состоит, как принимает решения и что означает у него слово «объективное» — не сказано.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S03", "GR-0086-S03", "GR-0086--otnosheniya-s-drugimi-gruppami"], "h": "<p>Прямо не названы. В сцене появляются охранники здания, где хранятся трупы («Охранники лишь встали и поздоровались»), но их подчинённость совету или какая-либо связь с ним в тексте не заявлена, и достраивать её нечем.</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S04", "GR-0086-S04", "GR-0086--kak-menyalas"], "h": "<p><strong>2026-02-16 (id 433701–433713, окно w0118).</strong> Единственное появление. Слава скидывает в чат рассказ «Цена жизни», написанный, по его словам, «На прошлое недели»; в рассказе совет упоминается один раз, репликой Дена. Больше к совету ни один из соавторов не возвращается. Версий, правок и отклонённых вариантов устройства совета в переписке нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "GR-0086-S05", "GR-0086--probely"], "h": "<div class=\"gaps\"><ul>\n<li><strong>Поимённого состава нет.</strong> Ни один член совета не назван. Входят ли в совет Ден (<a href=\"PS-0353.html\">Ден</a>) и Бен (<a href=\"PS-0354.html\">Бен</a>) — в переписке не сказано; напротив, Ден говорит «мы с тобой не имеем права судить», что скорее отделяет их обоих от того, кто правом судить обладает, но прямо принадлежность или непринадлежность к совету не оговорена.</li>\n<li><strong>Численность не названа.</strong> Слово «совет» — единственное указание на то, что орган коллективный.</li>\n<li><strong>Порядок работы не описан.</strong> Как совет собирается, голосует ли, кто его созывает, есть ли председатель — ничего этого в переписке нет.</li>\n<li><strong>Содержание решения по делу не приведено.</strong> Сказано только, что решение принято и что Ден считает его объективным.</li>\n<li><strong>Полномочия не очерчены.</strong> Судит ли совет все дела или только это, распространяется ли его власть на что-то помимо приговоров — не сказано.</li>\n<li><strong>Мир не раскрыт.</strong> Из реплики Бена известно только, что мир когда-то «был пропитан законам и правилам», а «сейчас, когда мы дохнем как мухи, чтобы хоть что-то защитить» — обстановка, объясняющая это «дохнем как мухи», в рассказе не описана. Вселенная в самом сообщении не объявлена; отнесение к «Иссекаю» сделано по дате.</li>\n<li><strong>Название неточное.</strong> «Совет» — не имя собственное, а слово из реплики; собственного названия у органа в переписке нет.</li>\n<li><strong>Отношение Бена к совету осталось нерешённым.</strong> Бен отрицает объективность решения, но не говорит, признаёт ли он вообще власть совета над собой; он лишь заявляет «ты не остановишь меня своими словами. Тем более когда ты сам в них не до конца веришь». Чем кончилось противостояние, неизвестно — рассказ обрывается на этой реплике.</li>\n<li><strong>Продолжения нет.</strong> В следующем окне (w0119, история «Сумасшедший где-то?») действует персонаж по имени Ден — командир отряда, но тождество с Деном из «Цены жизни» не заявлено, и совет там не упоминается.</li>\n</ul></div>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Дорогая дыра рядом и она не в составе совета, а под ним — у мира «Цены жизни» нет никакой записи. Обстановка, из которой совет только и существует («мы дохнем как мухи, чтобы хоть что-то защитить», здание с трупами под охраной), держит на себе пять статей: <code>PS-0353</code> (4 ссылки), <code>PS-0354</code> (4), <code>PS-0355</code> Крис (3), <code>IS-0088</code> (2) и эту. Единственный мир, заведённый во всём «Иссекае», — <code>MR-0190</code> «Ледяной мир», и у него всего 1 входящая ссылка. То есть заведён самый малоцитируемый кусок пространства, а самый нагруженный — нет.</p></div>", "r": [["Ден", "PS-0353.html"], ["Бен", "PS-0354.html"]]}, {"t": "Связи — всё вместе", "a": ["GR-0086--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0353.html\">Ден</a>, <a href=\"PS-0354.html\">Бен</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0086--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0086.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0086-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0086/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Сама запись ничего не блокирует: на <code>GR-0086</code> ноль входящих ссылок, а обе сущности, на которые она ссылается, укомплектованы — <code>PS-0353</code> Ден (4 входящих, база 7945) и <code>PS-0354</code> Бен (4 входящих, база 7674). Своей базы у группы 0, но это не её беда: <code>razmer_bazy: 0</code> стоит у всех 87 групп справочника, группы собраны производным способом.</p>\n<p>Дорогая дыра рядом и она не в составе совета, а под ним — у мира «Цены жизни» нет никакой записи. Обстановка, из которой совет только и существует («мы дохнем как мухи, чтобы хоть что-то защитить», здание с трупами под охраной), держит на себе пять статей: <code>PS-0353</code> (4 ссылки), <code>PS-0354</code> (4), <code>PS-0355</code> Крис (3), <code>IS-0088</code> (2) и эту. Единственный мир, заведённый во всём «Иссекае», — <code>MR-0190</code> «Ледяной мир», и у него всего 1 входящая ссылка. То есть заведён самый малоцитируемый кусок пространства, а самый нагруженный — нет.</p>\n<p>Вторая по цене, если чинить не мир, а людей: подросток-убийца, о котором совет вынес решение, не существует нигде — ни статьи, ни базы. Совет известен ровно одним действием, и объект этого действия в справочнике отсутствует.</p>\n<h3>С чего начать</h3>\n<p>В базе. Своего материала у статьи нет, но соседи по кластеру набиты: <code>IS-0088</code> (8405 знаков), <code>PS-0353</code> (7945), <code>PS-0354</code> (7674), <code>PS-0355</code> (7478) — суммарно за 31 тысячу знаков вокруг одной сцены. Всё, что относится к совету, охране при хранилище и к «мы», которое дохнет как мухи, надо вычесать из этих четырёх, а не искать заново.</p>\n<p>Нового там не появится — за новым в архив, и ориентиров два. Первый: окно w0118, вечер 2026-02-16, id 433701–433713 — весь обмен целиком, включая то, что стоит до 433706 и после 433713, а не только реплики про совет. Второй важнее: Слава сказал, что рассказ написан «На прошлое недели», то есть текст старше чата. Смотреть надо предыдущую неделю, 2026-02-09 — 2026-02-15, на предмет любого упоминания замысла до появления текста. И отдельно — w0119, 2026-02-20, id 435083–435085, где действует второй Ден: не для отождествления, а чтобы зафиксировать, спрашивал ли кто-нибудь про совпадение имён.</p>\n<h3>Как развивалось</h3>\n<p>Заявили и ограничили одновременно, одной парой реплик 2026-02-16: совет назван, и тут же ему назначено единственное свойство — он выше отдельного человека в праве судить. Дальше ни одной стадии не было. Автор в тот же вечер оценил текст словом «Просто хуйня», соавтор откликнулся вопросом о дате написания, и на этом всё. Не забыли даже — забывать было нечего: возврата не было ни через четыре дня, ни через два месяца, до последней реплики по вселенной 2026-04-11.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Право судить проговорено прямо и дважды: единолично решать чужую жизнь нельзя («Ты не можешь просто взять и единолично решить принять решение, о чужой жизни»), судить вправе не Ден с Беном, а совет. Правило названо.</p>\n<p>Соседний случай того же рода — право наказывать. В том же разговоре Ден говорит «Бен мы его накажем. Только не так, как хочешь ты» — и здесь «мы» это они двое, те самые, у кого права судить нет. То есть суд отдан совету, а наказание Ден оставляет за собой, и на каком основании — не сказано. Одно решение из двух передано наверх, второе осталось внизу, и разделительная линия между ними не проведена.</p>\n<h3>Отклик</h3>\n<p>Сильным показалось, как Бен уходит от спора вбок. Ему говорят «совет принял объективное решение» — и он не оспаривает решение, не требует пересмотра, не спрашивает, кто в совете; он отказывает в объективности людям вообще, всем и навсегда: «Люди никогда не будет объективными». Возражение проваливается на уровень ниже того, на котором велось, и совет от этого не рушится, а просто перестаёт быть аргументом. Ещё зацепило то, что справочник тут не достроил ничего: рядом с советом стоят охранники, которые здороваются с вошедшими, — очевидное место, чтобы приписать им подчинённость совету, и связь не проведена. Записи, у которой нет ни состава, ни численности, ни полномочий, честнее всего именно это.</p></div>", "r": []}];</script>
