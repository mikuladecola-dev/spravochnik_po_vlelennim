<script>const BASE="";const DOCNAME="пристав";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0060-S01", "PS-0060--proishozhdenie"], "h": "<p>Персонаж Славы. Впервые заявлен 2024-04-05 в окне w0030 одним сообщением: «Вот пристав богатый наглый высокомерный. И какая у него должна быть способность» (id 154291). То есть персонаж пришёл в переписку как связка «должность плюс три черты», а вопрос о способности был поставлен отдельно и адресован соавтору.</p>\n<p>Имя собственное персонажу не давалось: он проходит по должности — пристав, в вариантах имени также «богатый наглый высокомерный персонаж».</p>", "r": []}, {"t": "Характер", "a": ["S02", "PS-0060-S02", "PS-0060--harakter"], "h": "<p>Заданные Славой черты: богатый, наглый, высокомерный (id 154291).</p>\n<p>Миколай 2024-04-06 (id 154298) разобрал характер, разведя два варианта происхождения богатства, и отдельно отметил, что разбор делал сам: «Попробовал провести анализ», «А то не особо умею я способности давать кому-то учитывая критерии» (id 154299–154300).</p>\n<p><strong>Вариант 1 — «Он сам всё заработал».</strong> Причина наглости в том, что «он идёт по головам чтобы сохранить своё состояние и расширить его». У него «есть свои принципы и убеждения, которые он ни за, что не нарушит и не позволит другим». Высокомерие Миколай объясняет так: «причина в его приобретённых филках и статусе, он горд тем что смог добиться этого положения». Поведение он может себе позволить, «ибо не переживает за последствия а значит он чувствует себя под защитой либо денег, либо способности, но пускай будет всё сразу».</p>\n<p><strong>Вариант 2 — «Он мажор и деньги ему легко достались и были с рождения».</strong> В этом случае, по разбору Миколая, «способность точно не придаёт ему этих фич, поэтому мож быть совершенно любая».</p>\n<p>Какой из двух вариантов принят, в переписке не сказано.</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0060-S03", "PS-0060--sposobnosti"], "h": "<p><strong>Принятое решение (2024-04-06, id 154331).</strong> Слава: «Вообще этот персонаж будет иметь способность окаменения (то бишь усиливать себя и повышать защиту) и заражения (то бишь заражать окаменением и контролировать их) но дальше по сюжету я хочу дать ему ещё способность не обязательно что бы она сочеталось с окаменением».</p>\n<p>Итого две подтверждённые способности:</p>\n<ul>\n<li><strong>Окаменение</strong> — усиление себя и повышение защиты.</li>\n<li><strong>Заражение</strong> — заражать окаменением и контролировать заражённых.</li>\n</ul>\n<p>Третья способность объявлена как будущая, к сочетаемости с окаменением не обязанная. Названа она не была.</p>\n<p><strong>Варианты, предложенные и не вошедшие:</strong></p>\n<ul>\n<li><strong>Банкротство по желанию.</strong> Предложение Миколая под первый тип богатства, выведенное из принципа «Лучшая защита это нападение»: «может тогда его способность будет ну допустим делать человека банкротом по желанию (я хотел написать убивать по желанию 😅)». К способности прилагалась деталь: «он уже давно обнародовал эту способность, о ней все знают и боятся этого» (id 154298). В решении Славы не использовано.</li>\n<li><strong>Передача мыслей кому хочет</strong> — вариант под второй тип богатства, где способность к характеру не привязана (id 154298). Не использовано.</li>\n<li><strong>Мгновенный реген «от гематом и других садин небольших»</strong> — там же, второй вариант под тип «мажор» (id 154298). Не использовано.</li>\n<li><strong>Кристаллокинез.</strong> После решения Славы Миколай попросил разрешения обратиться к нейросети: «А можно», «Я снова попробую в нейронку кинуть?», «А то идей нету» (id 154332–154335). Слава разрешил: «Да можешь пожалуйста» (id 154337). Полученный ответ (id 154338) предлагает на роль третьей способности кристаллокинез — «Способность телекинетически манипулировать кристаллическими структурами, такими как драгоценные камни и металлы». Персонаж может контролировать движение и форму кристаллов, создавать из них конструкции и использовать как оружие: «создать барьер из алмазов, выпустить шквал рубиновых снарядов или обездвижить противника, покрыв его тело слоем золота». Обоснование в ответе: способность «тематически перекликается с окаменением и отражает одержимость персонажа богатством и статусом», но в отличие от защитной природы окаменения «более агрессивен и позволяет активно нападать и контролировать поле боя». Указан и недостаток: зависимость от наличия кристаллических материалов поблизости — персонаж должен либо носить с собой запас драгоценных камней, либо искать их в окружении. Реакции Славы на это предложение в переписке нет.</li>\n</ul>\n<p>В том же ответе перечислены критерии, по которым выбиралась третья способность: усиление существующих способностей; контраст и баланс («способность может быть противоположна или отличаться по природе от окаменения, создавая интересную динамику и внутренний конфликт персонажа»); расширение возможностей персонажа в областях, не связанных с окаменением и заражением; развитие сюжета и темы.</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0060-S04", "PS-0060--svyazi-s-drugimi"], "h": "<p>В карточке сущности указаны связи со способностями «банкротство по желанию» и «окаменение и заражение». Других персонажей в приведённых кусках переписки к приставу не привязывают.</p>", "r": []}, {"t": "Как менялся", "a": ["S05", "PS-0060-S05", "PS-0060--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2024-04-05 (id 154291).</strong> Заявка: пристав, богатый, наглый, высокомерный; вопрос о подходящей способности.</p>\n<p><strong>Версия 2 — 2024-04-06 (id 154298–154300).</strong> Разбор Миколая: два типа богатства и разные способности под каждый — банкротство по желанию под «заработал сам», передача мыслей или мгновенный реген под «мажора».</p>\n<p><strong>Версия 3 — 2024-04-06 (id 154331–154338).</strong> Слава сообщает уже готовое решение — окаменение и заражение, третья способность позже по сюжету. Разбор Миколая в решении не использован. Далее по запросу к нейросети возникает предложение кристаллокинеза как третьей способности.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0060-S06", "PS-0060--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вселенная не названа; неясно, из той ли он серии персонажей, что шла в w0029.</li>\n<li>Третья способность обещана, но не названа. Кристаллокинез предложен, однако принятия или отказа в переписке нет.</li>\n<li>Внешность персонажа не описана вообще.</li>\n<li>Не сказано, какой из двух вариантов богатства («сам заработал» или «мажор») выбран, — а от этого в разборе Миколая зависела мотивировка характера.</li>\n<li>Не объяснено, как окаменение и заражение соотносятся с богатством и должностью пристава: связь в переписке не проговорена.</li>\n<li>Не уточнено, кого именно и как персонаж «контролирует» после заражения — механика контроля названа одной строкой.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0060--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0014.html\">игра бога</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0060--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-04-05</td>\n<td>154291–154291</td>\n<td>w0030</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-04-06</td>\n<td>154298–154300</td>\n<td>w0030</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-04-06</td>\n<td>154331–154338</td>\n<td>w0030</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0060-pristav.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0060--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0060.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
