<script>const BASE="";const DOCNAME="Слова";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0266-S01", "SP-0266--mehanika"], "h": "<p>Способность носит имя «Слова» (встречается также вариант «Слово»). Описана одной фразой: «Он может отдавать приказы и люди повинуются» (2026-06-02, id 487010).</p>\n<p>Приказ отдаётся голосом, повиновение наступает у людей. Ни жеста, ни касания, ни условия слышимости в переписке не оговорено.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0266-S02", "SP-0266--ogranicheniya-i-cena"], "h": "<p>Названы два ограничения, оба в первом же описании:</p>\n<ul>\n<li>Против сильных противников: «Не особо действительно против сильных противников». Порог силы, с которого приказ перестаёт работать, не определён.</li>\n<li>Запрет на самоуничтожение цели: «он не может сказать убить себя или навредить себе, инстинкт самосохранения просто не даст этого сделать». Ограничение объяснено не устройством самой способности, а инстинктом самосохранения того, кому отдан приказ.</li>\n</ul>\n<p>Цена для носителя не названа.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0266-S03", "SP-0266--nositeli"], "h": "<p>Нуар. «Слова» — одна из его способностей, перечисленных подряд в одном сообщении наравне с Кровью (<a href=\"SP-0265.html\">Кровь</a>), Молнией и Тьмой.</p>\n<p>В том же окне сказано об общих особенностях Нуара и апостолов: «Они не стареют, у них невероятное быстрая регенерация тела. И их тела очень адаптивные. Ну ещё несколько особенностей которых я прям здесь не скажу» (id 487009). Часть особенностей автор сознательно оставил неназванными.</p>\n<p>Есть ли «Слова» у апостолов — в переписке не сказано; перечисление способностей отнесено именно к Нуару.</p>", "r": [["Кровь", "SP-0265.html"]]}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0266-S04", "SP-0266--kak-menyalas-po-versiyam"], "h": "<p>Версия 1 — 2026-06-02 (id 487009–487011, окно w0120). Первое и единственное описание, сразу с ограничениями. Позже способность не переписывалась.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0266-S05", "SP-0266--svyaz-s-drugimi-sposobnostyami"], "h": "<p>«Слова» перечислены в общем наборе Нуара вместе с:</p>\n<ul>\n<li>Кровью (<a href=\"SP-0265.html\">Кровь</a>) — «Может управлять собственное кровью, а из-за регенерация он может вырабатывать эту кровь дофига»;</li>\n<li>Молнией — «здесь говорить особого не чево просто плюс разрушительный навык»;</li>\n<li>Тьмой — «он просто пропитывает всё своё тьмой. Всё воздух, землю, воду. Всё что не имеет инстинктов или разума попадають под воздействия тьмы ( то есть даже деревья и трава превращается во тьму)». Радиус области тьмы — примерно 3 км, тьму Нуар полностью контролирует и перемещается в ней.</li>\n</ul>\n<p>Для области тьмы отдельно сказано: «в области тьмы способности нуар становяться мощнее, а способности противников слабее». Распространяется ли это усиление на «Слова» — прямо не сказано, но формулировка «способности нуар» дана без исключений.</p>\n<p>Внутренняя перекличка условий: Тьма действует на всё, «что не имеет инстинктов или разума», а «Слова» упираются в инстинкт самосохранения. Как эти два условия соотносятся между собой, в переписке не обсуждалось.</p>", "r": [["Кровь", "SP-0265.html"]]}, {"t": "Пробелы", "a": ["S06", "SP-0266-S06", "SP-0266--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вселенная в карточке помечена как «неясно».</li>\n<li>Не определено, что считается «сильным противником» — порога нет.</li>\n<li>Действуют ли «Слова» на нелюдей, на апостолов, на животных — не сказано; названы только люди.</li>\n<li>Длительность подчинения, число целей одновременно, дальность голоса не названы.</li>\n<li>Помнит ли подчинённый о приказе после — не обсуждалось.</li>\n<li>Часть особенностей Нуара и апостолов автор оставил нераскрытыми намеренно: «ещё несколько особенностей которых я прям здесь не скажу».</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0266--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0265.html\">Кровь</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0104.html\">Нуар</a></li>\n<li><strong>Упомянут в способностях:</strong> <a href=\"SP-0265.html\">Кровь</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0266--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-06-02</td>\n<td>487009–487011</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0266-slova.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0266--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0266.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
