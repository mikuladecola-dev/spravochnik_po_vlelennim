<script>const BASE="";const DOCNAME="Апостол (вселенная)";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0113-S01", "MR-0113--ustroystvo"], "h": "<p>«Апостол» — главная вселенная соавторов, объявленная 2025-03-03 (id 297458–297463) и подтверждённая в этом качестве 2025-06-10 (id 335360). В переписке она называется по-разному: «Апостол», «апостол» со строчной буквы как обиходное имя, «вселенная апостолов».</p>\n<p>Действие показанного материала происходит на Земле во время Второй мировой войны. В тексте есть немецкие солдаты (водитель ругается «Черт, черт, черт, что делать?!!» по-немецки), советский разведотряд, танки, деревня Лихая — «здесь она одна на ближайшие 40 км», братская могила в этой деревне. Отдельные детали быта: «сейчас война и художников стало явно меньшее».</p>\n<p>Поверх этого военного слоя лежит слой существ, о которых обычные люди не знают. Солдаты, столкнувшись с мальчиком из могилы, не имеют для него названия: перебирают «возможный зомби», «бес», «падший ангел, над которым измывался сам дьявол», «кара божея». Доктор на вопрос о болезни или мутации, при которой глаза светятся и белые, как у слепого, но человек всё видит, отвечает: «Не знаю, впервые вижу подобная, да и слышу тоже».</p>\n<p>Апостолы — класс носителей силы, легендарный внутри мира. Эльф произносит о них ключевую формулировку (2025-03-03, id 297462): «Что-то, не верится, что ты апостол, тот самый легендарный, тем кем наш пугали старший, тех кого боялись сильнейший и те кто могут убить даже существо, ты явно не заслуживаешь эту силу». Из этой фразы следует, что апостолов боялись сильнейшие, что ими пугали старшие эльфов и что они способны убить «существо» — отдельную категорию, которая в переписке не поясняется.</p>\n<p>Существование апостолов держится в секрете силой. Апостол, вышедший из леса, ставит условие свидетелям: «Вы ничего не видите и не слышали, а если попытаетесь кому-то рассказать, я первый об этом узнаю» — сказано «приказным тоном, словно мы только что, составили контракт с дьяволом».</p>\n<p>В мире есть механизм появления новых носителей силы, связанный со сменой поколений: апостол, забирая мальчика, роняет «Похоже ты будешь аномалий нашего поколения». Что такое «аномалия поколения» как институт, в переписке не сказано.</p>\n<p>Отдельная составляющая устройства — множество миров. Прямо она описана только в 2025-09-12 (id 364760), и только как проблема: «Самая сложная и пугающие для меня там стало это множество миров. Всё же множество миров для меня звучит слишком за мудрено сейчас». Сколько миров, как они соотносятся и как между ними перемещаются — в переписке не сказано.</p>\n<p>Навигация файла отмечает, что сама разработка мира — правители, благословения, апостолы — лежит в конце предыдущего окна w0099. В материале данной записи ни правители, ни благословения не раскрыты.</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0113-S02", "MR-0113--naselenie"], "h": "<p><strong>Люди.</strong> Солдаты обеих сторон. Немецкая колонна — легковая «желазная-стеклянная махина» и танковая группа из двенадцати человек при трёх машинах; их командир — садист, и это «каждый понимал», но сделать никто ничего не мог. Отмечено, что среди немцев были такие, кому мучить ребёнка было не по душе: «Ведь у них ведь тоже дети, им было сложно смотреть на боль другого дитя».</p>\n<p><strong>Советский разведотряд из четырёх человек</strong>, посланный «лишь, для получения информации»: капитан («мужчина, явно повидавший много»), рыжеволосый паренёк «не старший 30», Док (доктор) и старик — самый старший, у которого «был большой опыт и знания» и на которого командир часто полагался как на советника. Старик закрывает мальчику глаза при виде трупов: «Не зачем ещё больше травм для ребёнка». Он же отговаривает командира от попытки устранить мальчика: «Вон смотри, его танки не взяли, думаешь мы сможем» и «да и тем более если бы он захотел нас убить то давно бы убил бы».</p>\n<p><strong>Мальчик из братской могилы.</strong> Черноволосый ребёнок, вылезший из братской могилы в Лихой, весь в крови, с белыми светящимися глазами, «словно у слепого», при этом зрячий. Не помнит ничего — «ни возраст, ни имя, ни где живёт, ни кто родители». Не понимает чужой речи и сам сначала не говорит; позже разговаривает с отрядом. Обладает регенерацией («всё раны который наносил эльф мгновенно зажывали»), сверхскоростью, способностью изменять и удлинять руки, отращивать из спины пять красных паучьих лап, управлять собственной кровью (кровавые руки, щупальца, кровь на поле сковывает ноги эльфа), протискиваться в щель танка, «рвья кожу, мышцы и плоть свою, ломая кости». Умирает по ходу текста дважды: первый раз после боя с танками, когда «из носа кровь пошла», оказавшаяся мозгом, и он приходит в себя заново в «цистерне наполненой крови»; второй раз в бою с эльфом — «из рта и носа и ушей хлынулв кровь, нет это была не кровь &lt;…&gt; у него вытикал мозг. И он умер». Мотивация проста и повторяется: он прощает первый удар и не прощает второй — «И больше вас прощать я не намерен»; жалуется, что «встретя людей, я обязательно их убиваю. Я не хочу, но они первый меня калечять, и смеються».</p>\n<p><strong>Эльф с ветряным мечом.</strong> Ростом «по 2 метра», «худой словно ветка, но при этом всё ещё пугающий и изящный», одет «словно средневековый одеяния по типу полуплатия и полудоспехов», волосы длинные оранжевые, уши вытянутые и острые, глаза закрыты железной маской, «не пойми как держашия». Двигается «словно балерина, филигранно», бьёт мечом на расстоянии — «ветренные разрезы». Носит пассивную ветряную защиту, отклоняющую и пули, и кровавые руки мальчика: «словно под невидимой защитой, эти руки не попали по нему, они словно в момент прикосновения изменили свою траекторию». Знает об апостолах по рассказам старших своего народа.</p>\n<p><strong>Апостол-«плакса».</strong> Мужчина в военной форме — одет «также, как и те мужчины на дороге. Но более раскошно, что-ли, и элегантно». Лицо: «Шрамы! словно он плачет, две полосы вниз, словно он роняет слезы, сочитались с его белыми блестящими глазами придавая вид плачующего человека». Белые светящиеся глаза — те же, что у мальчика; в лесу они видны как «Светящихся белым двух светлячков». Воюет винтовкой и штыком: стреляет с большого расстояния сквозь лес, попадая в голову, в колено; в ближнем бою парирует меч штыком, ставит подсечку, выкалывает эльфу глаза, добивает выстрелом. Его выстрелы пробивают ветряную защиту эльфа — «Эльф ещё не смог привыкнуть, что его ветренная защита бесполезно». Уносит тело мальчика на плече и утаскивает труп эльфа.</p>\n<p><strong>«Существо».</strong> Отдельная категория, названная только в реплике эльфа как то, кого апостолы «могут убить». Что это, в переписке не сказано.</p>", "r": []}, {"t": "Место во вселенной — как связан с другими мирами", "a": ["S03", "MR-0113-S03", "MR-0113--mesto-vo-vselennoy"], "h": "<p>Внутри самой вселенной заявлено «множество миров» (2025-09-12, id 364760), но их перечень, устройство и связи в переписке не приведены.</p>\n<p>В работе соавторов «Апостол» занимает положение главной вселенной. 2025-06-10 (id 335358–335360) Слава объявляет: «Я придумал новую вселенную», Миколай отвечает «стой», и тут же Слава уточняет: «Но главная вселенная всё равно апостол». Миколай на этом сворачивает разговор: «расскажешь при встрече».</p>\n<p>2025-09-12 (id 364757) та же новая вселенная описана как производная: «Хотя это просто редактирования старой вселенной». То есть безымянная новая вселенная — переработка «Апостола», а не независимый замысел.</p>\n<p>Файл также отмечает связь с записями: «Мальчик из братской могилы (Бессмертный)», «Новая вселенная (безымянная, переработка \"Апостола\")», «Эльф с ветряным мечом», «новая вселенная Славы». Идентификаторы этих записей в исходнике не приведены.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0113-S04", "MR-0113--kak-menyalsya-po-versiyam"], "h": "<p><strong>2025-03-03 (окно w0078, id 297458–297463).</strong> Вселенная выведена целиком через прозаический фрагмент. Здесь появляется сам термин: апостолы как класс легендарных носителей силы, упомянутый эльфом, и конкретный апостол-«плакса» в финале. Никакой системы вокруг апостолов в этом окне не строится — только реплика эльфа и одна сцена. Навигация файла отмечает, что апостолы упоминались ещё раньше, в окне w0077 (id 295592), как список для отыгрыша.</p>\n<p><strong>2025-06-10 (окно w0100, id 335356–335362).</strong> Служебное подтверждение статуса на фоне появления новой вселенной: «Но главная вселенная всё равно апостол». Написано со строчной буквы, как обиходное имя. Нового содержания мира не добавлено.</p>\n<p><strong>2025-09-12 (окно w0104, id 364757–364761).</strong> Автор откладывает вселенную, но специально оговаривает, что не закрывает её: «Ну вселенную Апостол куда-нибудь в долгий ящик я не убираю. Просто отдохнуть от неё. Да и сама вселенная апостолов достаточно сложная и запутанная. Что даже я забываю кто че». Названа конкретная причина отхода — множество миров: «Самая сложная и пугающие для меня там стало это множество миров. Всё же множество миров для меня звучит слишком за мудрено сейчас». Новая вселенная противопоставлена по сложности: «Новая вселенная по сути лёгкая пока что. Всё же хуй знает как я замудрю», «Новая вселенная более простая».</p>\n<p>Предыдущие состояния при этом не отменены: статус главной вселенной от 2025-06-10 в сентябре не снимается, снимается только активная работа.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0113-S05", "MR-0113--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Система апостолов не описана. Есть класс, есть один его представитель и одна характеристика в чужой реплике — иерархии, численности, происхождения силы, правил вступления в переписке нет.</li>\n<li>«Аномалия поколения» названа один раз в последней фразе фрагмента и никак не раскрыта.</li>\n<li>«Существо», которое апостолы могут убить, — категория названа, содержание не названо.</li>\n<li>Правители и благословения отнесены навигацией к концу окна w0099; в материале этой записи их описания нет.</li>\n<li>Множество миров: количество, устройство и связи не описаны. Единственное, что о них сказано, — что автору это «слишком за мудрено».</li>\n<li>Имя апостола-«плаксы» не названо; «плакса» — прозвище по внешности, употреблённое один раз в тексте фрагмента.</li>\n<li>Народ эльфа, его цель и причина нападения на отряд не объяснены; кто такие «старший», которые пугали апостолами, не сказано.</li>\n<li>Природа мальчика (зомби, бес, падший ангел) в тексте остаётся набором солдатских догадок; авторского ответа в переписке нет.</li>\n<li>Механика того, почему у мальчика при перегрузке вытекает мозг и как он после этого возрождается в «цистерне наполненой крови» с трубой, не объяснена; что это за цистерна — осталось нерешённым.</li>\n<li>Судьба разведотряда после угрозы апостола в переписке не прослежена.</li>\n<li>Отклонённых вариантов устройства мира в этом материале не зафиксировано — единственное отвергнутое решение относится к работе автора, а не к миру: от множества миров он отходит как от слишком сложного, не отменяя его.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0113--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0001.html\">Апостолы (организация апостолов, «благословенные Богом»)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0113--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-03-03</td>\n<td>297458–297463</td>\n<td>w0078</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-06-10</td>\n<td>335356–335362</td>\n<td>w0100</td>\n<td>Апостол (объявлено)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2025-09-12</td>\n<td>364757–364761</td>\n<td>w0104</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0113-apostol-vselennaya.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0113--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0113.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["MR-0113-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/MR-0113/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым чинить систему апостолов. Статьи о ней нет, а материал в базе самый крупный из всего, что я вижу: <code>SL-0054</code> «Список 12 апостолов» — 234 КБ, статьи нет, на него ссылаются три записи. Рядом лежат два служебных свода, на каждый по шесть ссылок и тоже без статьи: <code>SL-0051</code> (благословенные, враги, грехи, оружие, артефакты) и <code>SL-0053</code> (полный список персонажей вселенной), плюс <code>SL-0090</code> с четырьмя ссылками. Получается, что самое востребованное во вселенной «Апостол» — это как раз четыре нерасписанных реестра, и пока их нет, всякая статья про апостолов упирается в одну реплику эльфа.</p>\n<p>Вторая по цене — «существо». Категория названа в той же реплике, а записи под неё нет вовсе; ближайшее, куда она могла попасть, — <code>ID-0126</code> («Нераскрытые термины: альфа, благословенный, силы зверя, классификация, арбетары, аномалия, существа»), 3.5 КБ, статьи нет, ссылок нет.</p>\n<p>Третья — безымянная новая вселенная. Статья ссылается на неё дважды, а <code>MR-0148</code> без статьи, 3.4 КБ базы.</p>\n<h3>С чего начать</h3>\n<p>В базе, не в архиве. Апостолы: <code>SL-0054</code>, <code>SL-0051</code>, <code>SL-0053</code>, <code>SL-0090</code>. Апостол-«плакса» почти наверняка сидит в <code>PS-0201</code> «Человек с белыми светящимися глазами» (8.6 КБ) — тот же признак, что у мальчика; отдельной записи под «плаксу» нет. Сцена целиком разошлась по <code>PS-0211</code> (58 КБ), <code>SP-0191</code> (41.7 КБ), <code>PR-0056</code> (40.5 КБ), эльф — <code>PS-0212</code> (41 КБ) и <code>PS-0218</code>.</p>\n<p>В архив идти надо только за двумя вещами. Множество миров: записи в базе нет ни под каким именем — смотреть окно w0104, 2025-09-12, id 364757–364761 и всё, что вокруг этой даты. Правители и благословения: сама статья указывает на конец окна w0099, туда же. Плюс ранняя точка, отмеченная навигацией, — w0077, id 295592, список апостолов для отыгрыша: это, судя по всему, зародыш <code>SL-0054</code>.</p>\n<h3>Как развивалось</h3>\n<p>2025-03-03 — вселенная выведена одним прозаическим куском, термин появляется внутри чужой реплики, системы вокруг не строится. 2025-06-10 — статус подтверждён служебно, в ответ на появление новой вселенной, содержания не прибавилось, разговор свёрнут на «расскажешь при встрече». 2025-09-12 — работа снята, причина названа прямо (множество миров), но статус главной вселенной не отменён, и это оговорено отдельно. За полгода три касания, содержание добавило только первое.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для мальчика механика смерти проговорена: перегрузка, вытекающий мозг, возвращение в цистерне. Апостол-«плакса» носит тот же признак — белые светящиеся глаза, — но про его смертность и возврат не сказано ничего, хотя он в той же сцене и в том же классе. Правило для одного носителя признака названо, для второго — нет.</p>\n<h3>Отклик</h3>\n<p>Сильнее всего тут не апостолы, а то, что солдаты не знают слова. «Возможный зомби», «бес», «падший ангел, над которым измывался сам дьявол» — четыре версии подряд, ни одна не выигрывает, и доктор честно говорит «впервые вижу подобная». Мир показан не через объяснение, а через отсутствие у людей подходящего названия — и это работает лучше любой иерархии. Зацепило ещё, что мальчик каждый раз объясняет себя одной и той же короткой формулой про первый и второй удар: у существа, которое не помнит ни имени, ни возраста, оказалась ровно одна сохранившаяся вещь — счёт обид. И отдельно — сентябрьская запись, где автор отказывается от собственного мира, потому что сам в нём путается. Это редкая по прямоте фраза, и она в статье оставлена как есть, без сглаживания.</p></div>", "r": []}];</script>
