<script>const BASE="";const DOCNAME="Бессмертный апостол";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0326-S01", "PS-0326--proishozhdenie"], "h": "<p>Персонаж из вселенной «Оам», один из апостолов. Появляется в переписке 2025-12-06 (окно w0112, сообщения 393292–393295) уже как известная соавторам фигура: Слава упоминает его через оговорку «если ты помнишь», то есть придуман он был раньше этого разговора. Где и когда именно — в переписке не сказано.</p>\n<p>Разговор, в котором он назван, был посвящён разбору «сильнейших» и шёл со стороны добра: «Во первых сначала с добрых», «Прежде чем разбирать злодеев. Давай сначала проясним сильнейших».</p>", "r": []}, {"t": "Характер", "a": ["S02", "PS-0326-S02", "PS-0326--harakter"], "h": "<p>Единственная данная о нём характеристика — «у него как бы не все в порядке с мозгами».</p>\n<p>Она подана как исключение из общего свойства расы. Про апостолов в целом сказано: они «высокомерны, хотя прямо этого не показывать», и высокомерие объясняется происхождением — «они как бы с рождения лучшей людей, поэтому в полне ясно почему они высокомерные». Бессмертный апостол из этого вынесен за скобки: «Ну кроме бессмертного».</p>\n<p>Вариант имени: «бессмертный».</p>", "r": []}, {"t": "Связи с другими", "a": ["S03", "PS-0326-S03", "PS-0326--svyazi-s-drugimi"], "h": "<p>Часть апостолов — их id в исходнике не назван.</p>\n<p>Об апостолах в этом же окне сказано, что они «на стороне добра», при этом «будут устраивать геноциды и теракты», и что среди сил добра «апостолы все же главные»: «И вот добрики и другие добряки есть. Но апостолы все же главные».</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S04", "PS-0326-S04", "PS-0326--kak-menyalsya"], "h": "<p><strong>2025-12-06 (окно w0112, id 393292–393295)</strong> — единственная зафиксированная версия. Назван как апостол, исключённый из общего высокомерия расы по причине того, что «не все в порядке с мозгами». Других состояний в переписке нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "PS-0326-S05", "PS-0326--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Придуман раньше окна w0112, но того более раннего разговора в переписке нет — подробности происхождения отсутствуют.</li>\n<li>Внешность не описана.</li>\n<li>Способности не названы. В частности, не сказано, значит ли имя «бессмертный» способность к бессмертию или это только прозвище.</li>\n<li>Не сказано, в чём именно выражается то, что «не все в порядке с мозгами».</li>\n<li>Связи с конкретными персонажами не названы.</li>\n<li>Что с ним стало — в переписке не сказано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0326--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0056.html\">Апостолы (21 апостол; «насекомые»)</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0056.html\">Апостолы (21 апостол; «насекомые»)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0008.html\">Оам</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0326--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-12-06</td>\n<td>393292–393295</td>\n<td>w0112</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0326-bessmertnyy-apostol.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0326--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0326.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
