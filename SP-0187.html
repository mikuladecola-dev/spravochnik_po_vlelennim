<script>const BASE="";const DOCNAME="Силы Серафима";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0187-S01", "SP-0187--mehanika"], "h": "<p>Способность существует в переписке как перечень из четырёх сил, записанных подряд в скобках после имени носителя: «манипуляция сознанием; контроль времент; управлений светом; огонь Божий» (2025-02-25, id 295559). В навигации записи тот же перечень приведён в виде «манипуляция сознанием, контроль времени, управление светом, огонь Божий».</p>\n<p>Таким образом фиксируются четыре отдельные силы:</p>\n<ul>\n<li>манипуляция сознанием;</li>\n<li>контроль времени;</li>\n<li>управление светом;</li>\n<li>огонь Божий.</li>\n</ul>\n<p>Как каждая из них действует, что именно можно сделать манипуляцией сознанием или контролем времени, чем «огонь Божий» отличается от обычного огня — в переписке не сказано. Названы только названия.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Отклик — не материал авторов</b>\n<p>Самое любопытное тут — сама форма записи. Четыре силы, каждая из которых в любом другом мире тянет на отдельного главного противника, стоят в скобках через точку с запятой, между «Породителем» и «Провидцем», и никто не останавливается. Контроль времени идёт третьим пунктом списка, как «молоко, хлеб». Это не небрежность, это по-своему честный способ работать: сначала пишется каталог, механика — потом, если дойдут руки. Отдельно зацепил «огонь Божий» — единственное из четырёх, что не механика, а заявление о происхождении. Три остальные говорят, что персонаж делает; это говорит, чей он. И три крыла после имени, никак не объяснённые, работают ровно в ту же сторону — знак принадлежности вместо описания. Похоже, Серафим собран не из способностей, а из знаков, и разбирать его надо будет как символ, а не как боевую сводку.</p></div>", "r": []}, {"t": "Носители — у кого есть", "a": ["S02", "SP-0187-S02", "SP-0187--nositeli"], "h": "<p>Серафим. Имя записано в общем списке персонажей вселенной в разделе «Сторонние силы», рядом с двумя другими позициями того же раздела — «Породитель» и «Провидец» (2025-02-25, id 295559). После имени Серафима в строке стоят три значка крыла подряд — «🪽🪽🪽».</p>\n<p>Других носителей этих четырёх сил в переписке не названо.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S03", "SP-0187-S03", "SP-0187--kak-menyalas-po-versiyam"], "h": "<p>Версия одна.</p>\n<p><strong>2025-02-25 (окно w0077, id 295556–295560).</strong> Перечень появляется сразу целиком, внутри большого списка, который Слава выкладывает одним сообщением: благословенные (пронумерованы до 14, при этом в начале сказано «Благословенный ада» и «Которых 9»), одержимый, враги, церковь, военные, сторонние силы, семь грехов, существа, аномалии, оружие, артефакты, идеи. Строка Серафима относится к разделу «Сторонние силы». Миколай на этот список отвечает: «я прекрасно помню» и «всё это время в голове держу».</p>\n<p>Правок, уточнений или переформулировок этих четырёх сил в переписке дальше нет.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S04", "SP-0187-S04", "SP-0187--svyaz-s-drugimi-sposobnostyami"], "h": "<p>В том же списке (2025-02-25, id 295559) отдельным разделом идут семь грехов со своими способностями в скобках: «Гнев 😡( сила)», «Похоть 😵‍💫(контроль разума)», «Зависть 👹👹( полной копирование)», «Алчность ♾(всё моей)», «Гордыня 👑» (без указания способности), «Чероугодия ◼️( поглощения)», «Лень😴( контроль территории)». Про Похоть см. <a href=\"SP-0169.html\">Контроль разума с ограничением</a>, про Лень — <a href=\"SP-0171.html\">Телекинез и контроль территории</a>.</p>\n<p>«Манипуляция сознанием» Серафима и «контроль разума» Похоти названы разными словами в одном и том же сообщении, но соотношение между ними — одно ли это, разные ли вещи, сильнее ли одно другого — в переписке не обсуждалось.</p>", "r": [["Контроль разума с ограничением", "SP-0169.html"], ["Телекинез и контроль территории", "SP-0171.html"]]}, {"t": "Пробелы", "a": ["S05", "SP-0187-S05", "SP-0187--probely"], "h": "<div class=\"gaps\"><ul>\n<li>«Правила работы сил не описаны, только названия» — так помечено в самой записи. Ни одна из четырёх сил не расписана.</li>\n<li>Не сказано, действуют ли четыре силы независимо, есть ли между ними связь или общий источник.</li>\n<li>Ограничений, цены, расхода, отката — не названо ничего.</li>\n<li>Не сказано, что даёт принадлежность к разделу «Сторонние силы» и чем эта категория отличается от благословенных, врагов, церкви, военных и семи грехов.</li>\n<li>Значение трёх крыльев «🪽🪽🪽» после имени не пояснено. В разделе «Оружие» того же списка есть позиции «Крылатый мечи 🪽» и «Крылатый клинки 🪽» с тем же значком, но связь с Серафимом не названа.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0187--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0169.html\">Контроль разума с ограничением</a>, <a href=\"SP-0171.html\">Телекинез и контроль территории</a></li>\n<li><strong>Упомянут в способностях:</strong> <a href=\"SP-0169.html\">Контроль разума с ограничением</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0187--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-02-25</td>\n<td>295556–295560</td>\n<td>w0077</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0187-sily-serafima.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0187--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0187.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["SP-0187-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/SP-0187/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — сам Серафим. Статьи о носителе четырёх сил нет, и записи о нём в базе нет тоже. <code>PS-0209</code> «Серафима» — это другой человек: кошкодевочка, приёмная дочь Серпа, из разговора про персонажей девочки с конкурса, 2 914 знаков базы, ноль ссылок. Тёзка, не носитель. При этом на Серафима уже опираются три вещи: сама эта запись, <code>SP-0186</code> «вирус перьев» (там прямая реплика «Вместе с серафимом») и группа <code>GR-0008</code> «Команда против Серафима („пати“)» — 23 140 знаков статьи при нуле базы, то есть целая группа собрана вокруг того, кого в справочнике не существует.</p>\n<p>Вторая — дубль. <code>SP-0225</code> «Способности Серафима» — 2025-05-14, 3 861 знак базы, статья есть, ноль ссылок, содержание то же самое: четыре силы, перечисленные в скобках при Серафиме в разделе сторонних сил. Две статьи об одном перечне. И эта утверждает «Версия одна», «правок, уточнений или переформулировок этих четырёх сил в переписке дальше нет», хотя в мае строка выложена заново.</p>\n<p>Третья — источник. Строка Серафима существует только внутри рабочих реестров, а у реестров нет статей: <code>SL-0053</code> — шесть ссылок, 20 313 знаков базы, четыре редакции 2025-01-27–2025-03-06; <code>SL-0090</code> — четыре ссылки, 5 492, редакция 2025-05-14; <code>SL-0051</code> — шесть ссылок, 9 834. <code>SL-0053</code> — самая нагруженная бесстатейная сущность вокруг этой записи.</p>\n<p>И по разделу «Сторонние силы», где стоит Серафим: из трёх позиций у Провидца в базе 14 549 знаков без статьи (<code>ID-0050</code>, одна ссылка), а «Породитель» не заведён вообще — на него нет ни одной записи во всей базе.</p>\n<h3>С чего начать</h3>\n<p>В базе. <code>SL-0053</code> — там, по описанию записи, две редакции подряд, и вторая разбирается построчно: что добавилось и что переехало из раздела в раздел. Если строка Серафима где-то комментировалась, то только там; там же видно, менялась ли она между редакциями.</p>\n<p>Дальше <code>SP-0225</code> и <code>SL-0090</code>, откуда она взята, — свести с этой записью и решить, одна тут сущность или две.</p>\n<p>Про соотношение «манипуляции сознанием» с «контролем разума» смотреть <code>SP-0169</code> (2025-01-23–24, 4 264 базы, две ссылки): повысить чувство, вызвать галлюцинации, понизить чувство. Это ближайший описанный аналог.</p>\n<p>Про «контроль времени» — <code>ID-0050</code> «Провидец»: отмотка времени там расписана с ценой, носитель попадает во временную петлю и проживает промежуток многократно. Но даты записи ранние (с 2024-05-07) и вселенных две, так что первым делом надо проверить, тот ли это Провидец, что стоит в «Сторонних силах» рядом с Серафимом.</p>\n<p>В архив — за крыльями. Три «🪽🪽🪽» при имени и тот же значок при «Крылатых мечах» и «Крылатых клинках» в том же сообщении. Смотреть окно w0077, 2025-02-25 целиком: в этот же день, в id 295232–295243, обсуждаются перья и крылья (<code>SP-0186</code>), но к строке Серафима это не привязывают. Двое суток — 2025-02-24 и 2025-02-25 — самое плотное место по перьевой теме во всём материале.</p>\n<h3>Как развивалось</h3>\n<p>Даты статьи — один день, 2025-02-25, id 295556–295560. Перечень появился не как решение, а как строка внутри большого списка, выложенного одним сообщением; на весь список Миколай ответил «я прекрасно помню», «всё это время в голове держу» — то есть разбора не было ни по одной позиции, включая эту. По базе видно продолжение: реестр переписывается дальше (<code>SL-0053</code>, редакции до 2025-03-06), а 2025-05-14 выкладывается снова (<code>SL-0090</code>), и та же строка Серафима заводится второй записью. Выложили — не разобрали — переложили тем же составом.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Про источник силы в этой вселенной правило проговорено, и довольно рано: 2025-01-28 Слава вводит отдельное слово специально ради различения — «Давай благословенный Богом это апостооы, чтобы различать благословенных Богом и других» (id 285342). То есть принадлежность силы Богу здесь — основание для того, чтобы носитель попал в отдельный разряд. У Серафима одна из четырёх сил называется «огонь Божий», и при этом он стоит не среди апостолов, а в «Сторонних силах». Для благословенных правило «сила от Бога — значит вот такой разряд» названо; для того, кто владеет божьим огнём вне божьего разряда, правила того же рода нет.</p>\n<h3>Отклик</h3>\n<p>Самое любопытное тут — сама форма записи. Четыре силы, каждая из которых в любом другом мире тянет на отдельного главного противника, стоят в скобках через точку с запятой, между «Породителем» и «Провидцем», и никто не останавливается. Контроль времени идёт третьим пунктом списка, как «молоко, хлеб». Это не небрежность, это по-своему честный способ работать: сначала пишется каталог, механика — потом, если дойдут руки. Отдельно зацепил «огонь Божий» — единственное из четырёх, что не механика, а заявление о происхождении. Три остальные говорят, что персонаж делает; это говорит, чей он. И три крыла после имени, никак не объяснённые, работают ровно в ту же сторону — знак принадлежности вместо описания. Похоже, Серафим собран не из способностей, а из знаков, и разбирать его надо будет как символ, а не как боевую сводку.</p></div>", "r": []}];</script>
