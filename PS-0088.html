<script>const BASE="";const DOCNAME="Ночные охотники";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0088-S01", "PS-0088--proishozhdenie"], "h": "<p>Существа вселенной «Новый мир», предложенные Славой 3 июня 2024 года (2024-06-03, id 175797). Формулировка автора: «Ночные охотники существо сотканный из темный энергий». То есть они не рождаются и не создаются кем-то конкретным — они сотканы из тёмной энергии, одной из двух энергий мира.</p>\n<p>Появились в разговоре сразу после рассуждения Миколая (175795) о том, как утилитарная этика делит стороны: светлые «будут стараться завести семью и распространить здоровые принципы», а тёмные «будут стараться либо убить как можно больше, либо умереть как можно быстрее, возможно будут манипулировать серыми и делать их колдунами с нужными качествами». Ночные охотники названы следующей же репликой, в этом контексте тёмной стороны.</p>\n<p>Второе имя — «тёмные охотники» — появляется 6 июня (2024-06-06, id 176473), когда о них говорит Слава применительно к главному герою.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0088-S02", "PS-0088--vneshnost"], "h": "<p>Единого облика нет: «выглядят по разному» (175797). Общее у них — уникальное строение тела. Слава перечисляет: «крылья, многорукий, многоногий, большой рот и т.п».</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0088-S03", "PS-0088--harakter"], "h": "<p>Отдельно характер в переписке не разбирался. Известно только поведение: они питаются, прячутся и прислуживают.</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0088-S04", "PS-0088--sposobnosti"], "h": "<p>Сверхспособностей у них нет. Дословно: «У них особо каких либо сверх сил сил не будет чисто физическая сила и уникальный строения тела» (175797). То есть весь их арсенал — физическая сила плюс анатомия.</p>\n<p>Питание: «питается людьми и страхами и болью» (175797). На эту часть Миколай отреагировал прямо — «О, вот подпитка идея классная» (175798).</p>", "r": []}, {"t": "Ограничения", "a": ["S05", "PS-0088-S05", "PS-0088--ogranicheniya"], "h": "<p>Боятся света. Уточнение Славы: свет «их не убивает а лишь причиняет невыносимую боль» (175797). Из-за этого «часто скрываться в заброшенных домах или в нелюдных местах».</p>", "r": []}, {"t": "Связи с другими", "a": ["S06", "PS-0088-S06", "PS-0088--svyazi-s-drugimi"], "h": "<ul>\n<li>Тёмные колдуны — «Часто прислуживают темным колдунам» (175797).</li>\n<li>Главный герой. 6 июня Слава добавляет (2024-06-06, id 176473): «Он станет хранилищем темных охотником и других существ с темной энергии ( потому что владелец темный энергий перерождаться или в некоторым роде бессмертный, ну то бишь как проклятий в магичке) И он будет страдать поглощая их. После свой смерть он отправится в ад вместе с темными». Таким образом ночные охотники оказываются тем, что ГГ в себя вбирает, и тем, с чем он вместе попадает в ад.</li>\n<li>Другие существа с тёмной энергией — упомянуты как категория, но не перечислены.</li>\n</ul>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S07", "PS-0088-S07", "PS-0088--kak-menyalsya"], "h": "<p><strong>2024-06-03 (id 175795–175806).</strong> Полное описание вида, данное Славой одним сообщением: происхождение из тёмной энергии, разный облик, питание людьми/страхами/болью, отсутствие сверхсил, физическая сила и особая анатомия, служба тёмным колдунам, страх света, укрытия в заброшенных домах и нелюдных местах.</p>\n<p><strong>2024-06-06 (id 176469–176477).</strong> Ничего из описания не отменено, добавлена роль: ГГ становится их хранилищем, страдает, поглощая их, и после смерти уходит с ними в ад. Здесь же они названы «тёмными охотниками».</p>", "r": []}, {"t": "Отклонённые и незавершённые варианты рядом с ними", "a": ["S08", "PS-0088-S08", "PS-0088--otklonennye-i-nezavershennye-varianty-ry"], "h": "<p>В том же разговоре 3 июня Слава спросил: «И каких существ ещё можно добавить типо вампиров или оборотней только видео измененный концепт» (175804). Миколай предложил два изменённых концепта, которые к ночным охотникам не относятся и как отдельные виды дальше в этом окне не разрабатывались:</p>\n<ul>\n<li>Вампиры-падальщики (175805): «охотятся на живых и сосут кровь, а эти только на свежих мёртвых, потому что хрупкие, и кровь пить будут отрывая конечности и делать это прилюдно чтобы была подпитка мощная».</li>\n<li>Люди-медведи (175806): «похожих на обычных людей добавить можно, живущих в обществе, но если к ним люди проявят светлую сторону, они увеличатся и станут похожими на медведя».</li>\n</ul>\n<p>Отдельно в переписке есть обмен, где Слава говорит «Чёт мне это идея не нравится» (175799), а Миколай отвечает «Ну тогда забыли» (175803). К чему именно относится это «эта идея», из текста однозначно не следует — реплика идёт после похвалы подпитки, но что именно забраковано, не названо.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S09", "PS-0088-S09", "PS-0088--chto-s-nim-stalo"], "h": "<p>Вид остался в мире. Последнее его состояние на 2024-06-06 — существа, которых поглощает и хранит в себе главный герой.</p>", "r": []}, {"t": "Пробелы", "a": ["S10", "PS-0088-S10", "PS-0088--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Численность, организация, наличие вожаков или иерархии — в переписке не сказано.</li>\n<li>Разумны ли они, есть ли у них речь — не обсуждалось.</li>\n<li>Отношения с серыми и со светлой стороной — не названы.</li>\n<li>Как именно устроено «хранилище» внутри ГГ и что происходит с поглощённым охотником — осталось нерешённым.</li>\n<li>Что именно Слава забраковал репликой 175799 — из текста не восстанавливается.</li>\n<li>Собственных имён у отдельных охотников нет; вид описан только целиком.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0088--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0097.html\">Ночные охотники (они же «тёмные охотники»)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0007.html\">Новый мир</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0088--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-06-03</td>\n<td>175795–175806</td>\n<td>w0036</td>\n<td>Новый мир (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-06-06</td>\n<td>176469–176477</td>\n<td>w0036</td>\n<td>Новый мир (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0088-nochnye-ohotniki.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0088--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0088.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
