<script>const BASE="";const DOCNAME="Чужемирцы";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0117-S01", "MR-0117--ustroystvo"], "h": "<p>Чужемирцы (в переписке также «чужамирцы») — не отдельный мир, а категория существ, определяемая через происхождение из других миров. Определение Славы дословно: «Существа других миров, который сбегают в наш по разным причинам» (2025-03-10, id 300890).</p>\n<p>Ключевой признак — побег. Чужемирец не просто попадает в наш мир, он именно сбегает в него; причины побега в переписке не перечислены, сказано только «по разным причинам».</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0117-S02", "MR-0117--naselenie"], "h": "<p>Чужемирцы делятся на три вида (2025-03-10, id 300891):</p>\n<ol>\n<li><strong>Обычные чужемирцы</strong> — «просто чужемирца с разной анатомии». Единственная названная их характеристика — разнообразие анатомии.</li>\n<li><strong>Существа</strong> — о них, по словам Славы, речь шла раньше: «Существа про них я говорил». Само содержание этого прежнего разговора в данном фрагменте не воспроизводится.</li>\n<li><strong>Альфы</strong> — «раньше означали сильнейшей разумной субъекты в своём мире, которая имеет, что-то похоже на благословенния» (id 300892).</li>\n</ol>\n<p>Формулировка про Альф дана через прошедшее время — «раньше означали». Что слово означает теперь, в приведённом куске переписки не сказано. Их сила определяется не абсолютно, а внутри собственного мира: сильнейшие разумные субъекты именно в своём мире. То, чем они обладают, названо не благословением, а тем, что «похоже на благословенния» — то есть сходство с благословениями отмечено, а тождество нет.</p>\n<p>Отдельно среди чужемирцев числится Эльф (чужемирец), но к какому из трёх видов он относится, в переписке не сказано.</p>", "r": []}, {"t": "Место во вселенной — как связан с другими мирами", "a": ["S03", "MR-0117-S03", "MR-0117--mesto-vo-vselennoy"], "h": "<p>Чужемирцы — точка контакта между нашим миром и остальными: они и есть механизм, которым существа из других миров оказываются здесь. Сколько миров участвует, как устроен переход и что происходит с чужемирцем после побега, не описано.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0117-S04", "MR-0117--kak-menyalsya-po-versiyam"], "h": "<p>Зафиксировано одно состояние — 2025-03-10 (id 300889–300892). Введено само понятие и деление на три вида. Правок после этого нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0117-S05", "MR-0117--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Причины побега не названы — только «по разным причинам».</li>\n<li>Способ перехода между мирами не описан.</li>\n<li>Разница между «обычным чужемирцем» и «Существом» не проговорена: обычные отличаются анатомией, Существа отнесены к прежнему разговору без пересказа.</li>\n<li>Про Альф сказано, что термин что-то означал «раньше»; текущее значение осталось нерешённым.</li>\n<li>Отношение того, чем владеют Альфы, к настоящим благословениям не определено — сказано только «что-то похоже».</li>\n<li>К какому виду относится Эльф (чужемирец), не указано.</li>\n<li>Отношение нашего мира к чужемирцам — принимает, преследует, не замечает — в переписке не сказано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0117--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0018.html\">Альфы</a>, <a href=\"GR-0019.html\">Чужемирцы</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0117--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-03-10</td>\n<td>300889–300892</td>\n<td>w0079</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0117-chuzhemircy.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0117--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0117.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["MR-0117-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/MR-0117/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дороже всего вторая из трёх категорий — «Существа». В переписке она отправлена к прежнему разговору («про них я говорил»), а в справочнике под неё нет ни одной записи по «Апостолу». Зато раздел «Существа» есть в двух самых ссылаемых реестрах без статей: <code>SL-0053</code> «Список персонажей вселенной» (шесть ссылок, статьи нет, база 20 313) и <code>SL-0090</code> «Реестр персонажей и сил» (четыре ссылки, статьи нет, 5 492). В реестре от 2025-05-14 этот раздел пуст — так записано в <code>GR-0009</code>. То есть категория заведена трижды (здесь, в двух реестрах) и не наполнена нигде.</p>\n<p>Второе — <code>SL-0089</code> «Список категорий сил (Благословенный, Арбетары, Альфы, Чужемирцы, Владельцы артефактов, Фантазёры)»: четыре ссылки, статьи нет, а в базе под ним 1 753 знака, меньше почти всего в узле. На него опираются <code>MR-0146</code>, <code>MR-0107</code>, <code>MR-0105</code>, <code>GR-0013</code>. Именно там чужемирцы стоят как одна из шести категорий сил — и это единственное место, где категория соотнесена с остальными, а материала под ним почти нет.</p>\n<h3>С чего начать</h3>\n<p>В базе. Материал по чужемирцам разъехался на четыре карточки, и окна у них почти не пересекаются. Здесь, в <code>MR-0117</code>, — только w0079 (2025-03-10), 1 818 знаков базы. В <code>PS-0198</code> «Чужемирцы» (статья есть, база 58 680) — восемь версий, 2025-02-12 — 2025-05-30, окна w0075, w0080, w0082, w0099; там и определение через побег в другой редакции, и три способа перехода, и внешность. В <code>MR-0100</code> «Чужемирцы и аномальные люди» (две ссылки, статья есть, 3 285) — январское окно w0070, 2025-01-06, id 279029–279038. В <code>GR-0019</code> — группа. Классификация на три вида, ради которой существует эта статья, есть только здесь и ни в одну из трёх соседних карточек не попала.</p>\n<p>За «Существами» идти недалеко: прежний разговор, к которому отсылает Слава, надо искать в двух местах базы прежде архива — первое появление чужемирцев в <code>PS-0198</code> (2025-02-12, id 288543–288545, рассказ от лица одного из них, «мелкие серые карлики») и январское окно <code>MR-0100</code> (279029–279038). Если ни там, ни там разговора нет — тогда в архив, в промежуток между 279038 и 300889, окна w0070–w0079.</p>\n<p>Про Эльфа в архив тоже не надо: <code>PS-0218</code> «Эльф (чужемирец)» — статья есть, база 5 563, весь материал уложен в один вечер того же дня, 2025-03-10, id 300761–300793, то есть на сотню сообщений раньше классификации в этом же окне w0079. К какому виду он отнесён, там не сказано — но сверять надо эти два куска одного вечера, а не искать где-то ещё.</p>\n<h3>Как развивалось</h3>\n<p>Одно окно, 2025-03-10, id 300889–300892: понятие введено и тут же разделено на три вида. Одна из трёх позиций объявлена устаревшей в момент введения — про альф сказано в прошедшем времени, «раньше означали». В тот же день, в том же окне, разговор уходит дальше (300896–300907) и разворачивает механику альф. К самим чужемирцам после 2025-03-10 не возвращались: правок нет. Ввели, при вводе пометили часть устаревшей, ушли в одну из трёх ветвей и не вернулись к стволу.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Признак чужемирца назван и он один: побег. «Существа других миров, который сбегают в наш» — не попадают, не приходят, а именно сбегают, и это подчёркнуто. Третья категория определена по другому основанию: альфы — «сильнейшей разумной субъекты в своём мире». Для чужемирцев вообще правило входа в категорию сформулировано через уход из своего мира; для альф, стоящих внутри той же категории, правило сформулировано через положение в своём мире — и не проговорено, обязателен ли для них побег. Альфа, оставшийся дома, по этому определению чужемирец или нет, сказать не по чему.</p>\n<h3>Отклик</h3>\n<p>Зацепила ровно одна вещь, зато крепко: «Альфы раньше означали...» — прошедшее время внутри определения. Классификация вводится, и одна из трёх её позиций уже в момент рождения помечена как бывшая; читателю выдают термин и сразу предупреждают, что он значит уже не то. Рядом такая же аккуратность: то, чем владеют альфы, названо не благословением, а тем, что «похоже на благословенния» — сходство зафиксировано, тождество отдельно не подписано. Это редкий случай, когда автор в одной реплике держит и старое значение, и отказ от него, и ничего не затирает. Всё остальное здесь — три строчки на три вида, и по двум из них сказать нечего; статья честно это и показывает.</p></div>", "r": []}];</script>
