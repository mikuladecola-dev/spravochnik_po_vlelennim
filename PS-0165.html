<script>const BASE="";const DOCNAME="Сестра гг";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0165-S01", "PS-0165--proishozhdenie"], "h": "<p>Персонаж вводится в предыстории Славы к истории про существо (2024-11-10, id 255096, окно w0063). Это младшая сестра главного героя, ребёнок. Имя не названо ни в одной версии, возраст тоже — только «ещё ребенок».</p>\n<p>Она переезжает вместе с гг в новый город: «Гг переезжает в ной город с сестрой из за родителей». Родители в тексте присутствуют как отсутствующие: «Родителей вечно на работе и почему то не питают ни каких чувств к свои отбрыском». Гг считает, что родители его ненавидят, и связывает это с тем, что его каждый раз отправляют в школу с плохой репутацией; праздники семья вместе не отмечает.</p>\n<p>Основа персонажа — нехватка внимания, названная прямо: «его больше волновала состояния его сестры который ещё ребенок который хочет получать внимание. Гг конечно старается уделить её достаточной внимание, но внимание 2 родителей даже иногда не хватает не говоря уже о внимание только брата».</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0165-S02", "PS-0165--vneshnost"], "h": "<p>Не описана. Единственная физическая деталь во всех версиях — звук: гг «услышишь топот ножек и увидит ту самую, целую и невредимую сестру».</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0165-S03", "PS-0165--harakter"], "h": "<p>Тоже задан через одну черту — ребёнок, которому нужно внимание. Единственная сцена с её участием — встреча брата в коридоре и то, что происходит следом: гг «побежал за сестрой дабы поймать её и зашикатить, пряча за этим все те эмоции который переполнили его за этим жалких 20 мину». Реплик у неё в переписке нет ни одной.</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0165-S04", "PS-0165--svyazi-s-drugimi"], "h": "<p><strong>Гг (главный герой истории про существо).</strong> Брат, от лица которого идёт повествование. Сестра — то, ради чего он действует. После встречи с существом в лесу первое, о чём он думает, — она: «И выпив от туда у гг сразу проскакивает мысль а как же сестра, она же совсем одна в доме, а что если этот монстр». Обратная дорога описана через неё: «он снова бежал только в этот раз не ради себя а ради такой близкой и бесконечно любимый сестры, он был готов перевернуть сами небеса дабы с ней все было в порядке».</p>\n<p>Эмоции при ней он прячет: не кричит, не плачет, не теряет сознания, а улыбается и играет с ней, а после «удалился в туалет и начал резать руку нет невены не артерий а просто кожу и плоть, это единственный способ который он знал дабы выплеснуть эмоции».</p>\n<p><strong>Существо.</strong> Прямого контакта в тексте истории нет — существо нападает на гг, а сестра остаётся дома целой. Но именно страх за неё превращает страх гг в решимость: «мое страх перерастает в гнев а из гнева в решимость убить эту тварь, ради безопасности сестры, ради мой безопасности, ради безопасности этого толстяка которого я сейчас бью» (2024-11-11, id 255795). Позже Слава уточняет, что встреча с монстром у неё всё-таки была (см. ниже).</p>\n<p><strong>Родители.</strong> Присутствуют только как причина переезда и как источник нехватки внимания. Отдельных сцен с ними нет.</p>", "r": []}, {"t": "Как менялась — состояния по датам", "a": ["S05", "PS-0165-S05", "PS-0165--kak-menyalas"], "h": "<p><strong>Версия 1 — 2024-11-10, id 255096, окно w0063.</strong> Полное введение: переезд, родители, нехватка внимания, страх гг за неё и финал — она выбегает навстречу целой и невредимой. Здесь же список того, чего гг боялся, открывая дверь: «увидит окровавленный труп свой сестры или вообще не увидит её дома или решений рассудком и обвинявший его о опоздание сестру». Последний пункт списка написан неразборчиво и станет предметом разбора через четыре дня.</p>\n<p><strong>Версия 2 — 2024-11-11, id 255795–255805, окно w0063.</strong> Продолжение от первого лица, следующее утро. Сестра упомянута один раз — спящей: «Одевшись и проверял что сестра спит я пошел в школу». Второе упоминание — как причина решимости убить существо (цитата выше). В конце окна Миколай отвечает, что читать будет позже: «так как я решил что буду читать и думать», «я хуй его знает когда прочту», «но хорошо что ты написал» (id 255803–255805).</p>\n<p><strong>Версия 3 — 2024-11-13, id 256858, окно w0064.</strong> Слава заново присылает текст предыстории — он совпадает с версией 1 дословно, от «Гг переезжает в ной город» до сцены в туалете. Изменений в персонаже нет.</p>\n<p><strong>Версия 4 — 2024-11-14, id 257159–257180, окно w0064.</strong> Разбор непонятной строки. Слава поясняет: «Решений рассудка и обвинявший его сестру. Типо сестра сума сошла когда увидел монстра» (id 257161). Миколай переспрашивает: «за что сестру обвинял?» (id 257163), «решений рассудка?» (id 257164), «может лишённый» (id 257165), «и кто» (id 257167). Слава поправляет направление обвинения: «Он не обвинял» (id 257168), «Сестра обвиняла брата» (id 257174), «Обвинявший» (id 257175). Последняя формулировка в окне — «Решеную рассудка» (id 257180).</p>\n<p>Таким образом на 2024-11-14 к персонажу добавлены два состояния: сошла с ума, увидев монстра, и обвиняла брата. За что именно обвиняла, прямо не сказано; в исходной строке версии 1 рядом стоит «о опоздание».</p>\n<p>В том же окне Слава говорит «В 3 часть расскажу» (id 257159) — то есть часть материала по этой линии отнесена в ненаписанное продолжение.</p>", "r": []}, {"t": "Что с ней стало", "a": ["S06", "PS-0165-S06", "PS-0165--chto-s-ney-stalo"], "h": "<p>В тексте истории (версии 1 и 3) она остаётся живой и невредимой — это финал сцены возвращения. Уточнение версии 4 говорит о ней иначе: сошла с ума при виде монстра и обвиняла брата. Как эти два состояния соотносятся — идёт ли речь о том, чего гг боялся, или о том, что произошло позже, — в переписке не решено: исходная фраза стоит в перечне страхов гг, а Слава пересказывает её как факт и относит рассказ к третьей части.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0165-S07", "PS-0165--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имени нет ни в одной версии.</li>\n<li>Возраста нет — только «ещё ребенок».</li>\n<li>Внешность не описана.</li>\n<li>Реплик у неё нет; всё, что о ней известно, дано через восприятие гг.</li>\n<li>Не сказано, где она была и что делала, пока гг встречал существо и бежал через лес; в доме она оставалась одна.</li>\n<li>Не сказано, когда и при каких обстоятельствах она увидела монстра, — это добавлено отдельной репликой (id 257161) без сцены.</li>\n<li>За что именно она обвиняла брата, прямо не названо.</li>\n<li>В тексте предыстории в окне w0064 отмечена путаница — фразу читают как «у его сестры есть ребёнок»; Миколай отдельно на это указывает. Сама реплика с указанием в приведённые куски переписки не попала, разрешения путаницы в них тоже нет.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0165--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0163.html\">ГГ-защитник</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0165--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-11-10</td>\n<td>255096–255096</td>\n<td>w0063</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-11-11</td>\n<td>255795–255805</td>\n<td>w0063</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-11-13</td>\n<td>256858–256858</td>\n<td>w0064</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-11-14</td>\n<td>257159–257180</td>\n<td>w0064</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0165-sestra-gg.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0165--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0165.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
