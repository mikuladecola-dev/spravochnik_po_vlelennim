<script>const BASE="";const DOCNAME="Сверхлюди и война";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0199-S01", "MR-0199--ustroystvo"], "h": "<p>Правило об участии сверхлюдей в войне, проговорённое одной парой реплик (2026-06-09, id 488778–488783). Вопрос: «Скажи а сл можно участвовать в войне», с пояснением сокращения — «Сверхлюди (сл)». Ответ, спустя паузу в 1,8 часа: «думаю нельзя, но кто запретит, их сложно сдерживать, какое-нибудь государство всё равно захочет» (2026-06-09, id 488781).</p>\n<p>То есть формальный запрет есть, но он не работает: сверхлюдей «сложно сдерживать», и какое-то государство всё равно захочет их использовать. Кто именно запрещает — какая инстанция, договор, закон — не названо. Какое государство «всё равно захочет» — тоже не названо.</p>\n<p>О какой войне речь, в переписке не сказано.</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0199-S02", "MR-0199--naselenie"], "h": "<p>Сверхлюди, в переписке — «сл». Отдельных носителей здесь не перечислено. В связях записи стоят Апостолы и Программа в голове (конструкция Оам), но в самих репликах эти темы не всплывают.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0199-S03", "MR-0199--mesto-vo-vselennoy"], "h": "<p>Сразу за ответом идёт реплика: «Приходится переделывать всех персов под вселенную» (2026-06-09, id 488783). Это фиксирует момент, когда персонажи перестраиваются под вселенную; связь этой перестройки с вопросом о войне прямо не проговорена.</p>\n<p>Принадлежность к конкретной вселенной в записи стоит как «неясно» (проставлено по дате объявления).</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0199-S04", "MR-0199--kak-menyalsya-po-versiyam"], "h": "<p>Одна версия, одно окно (w0121), 2026-06-09, сообщения 488778–488783. Правило проговорено вслух и тут же оставлено — дальше тема не разворачивается.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0199-S05", "MR-0199--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Ответ дан одной репликой, продолжения нет.</li>\n<li>Кто и чем запрещает сверхлюдям участвовать в войне — в переписке не сказано.</li>\n<li>Что за война и что за государство — не названо.</li>\n<li>Последствия нарушения запрета — осталось нерешённым.</li>\n<li>Связь с Апостолами и с Программой в голове в самих репликах не проговорена.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["MR-0199--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-06-09</td>\n<td>488778–488783</td>\n<td>w0121</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0199-sverhlyudi-i-voyna.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0199--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0199.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
