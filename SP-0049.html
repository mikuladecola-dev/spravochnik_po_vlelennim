<script>const BASE="";const DOCNAME="режим ярости";
const LEAD="<p>Способность из куска переписки, вселенная которого объявлена 2024-02-05 (id 104329); имени в переписке ей не дали. В разборе окна w0025 отдельно отмечено, что для самой этой сцены вселенная не объявлена. Проговорена 2024-02-12 (окно w0025, сообщения 108622–108637), формулировка принадлежит Миколаю, повод задан Славой.</p>";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0049-S01", "SP-0049--mehanika"], "h": "<p>Задана через аналогию с аниме «Восхождение героя щита». Миколай отсылает к состоянию Наофуми: «помнишь когда Наофуми выходил из под контроля» (id 108627), «И его негативные эмоции затмевали разум, щит становился дьявольский» (id 108629).</p>\n<p>Дальше механика переносится с поправками: «Вот такая же хуйня» (id 108631), «Но уже на инопришеленцах» (id 108632), «И без эмоциональной составляющей» (id 108633), «То есть, режим ярости» (id 108634).</p>\n<p>То есть берётся выход силы из-под контроля и превращение её в «дьявольскую» форму, но носителями оказываются инопланетяне, а эмоциональный триггер — негативные эмоции, затмевающие разум, — из механики убран. Что запускает режим вместо эмоций, в переписке не сказано.</p>\n<p>Имя «режим ярости» дано самим Миколаем в этой же реплике.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S02", "SP-0049-S02", "SP-0049--nositeli"], "h": "<p>Носитель существует только в виде картинки: Слава прислал ссылку на изображение существа — «Взгляните на это… 👀 https://pin.it/3Gm6EHQir» (id 108622) — и спросил: «Какие у него особенности», «Как думаешь?» (id 108623–108624). Ответ Миколая про режим ярости — ответ именно на этот вопрос.</p>\n<p>Имени у существа в чате нет. В общем виде носители названы как «инопришеленцы» (id 108632).</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S03", "SP-0049-S03", "SP-0049--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-02-12 (id 108622–108637).</strong> Первое и единственное проговаривание. После реплик «Крч» и «Как то так думаю» (id 108635–108636) Миколай переходит к постороннему разговору — про высказывание одноклассницы и шутку одноклассника про «омни… трикс». К режиму ярости не возвращаются.</p>", "r": []}, {"t": "Пробелы", "a": ["S04", "SP-0049-S04", "SP-0049--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Не сказано, что запускает режим, раз эмоциональная составляющая убрана.</li>\n<li>Не сказано, как режим заканчивается, есть ли выход по желанию.</li>\n<li>Ограничения и цена не названы.</li>\n<li>Не сказано, что именно у инопланетян меняется в режиме — у Наофуми менялся щит, аналога предмета здесь не назвали.</li>\n<li>Носитель есть только как картинка по ссылке pin.it, имени у него нет.</li>\n<li>Неясно, заготовка ли это для собственного материала соавторов или разбор чужого арта.</li>\n<li>Вселенная для этой сцены не объявлена.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["SP-0049--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-02-12</td>\n<td>108622–108637</td>\n<td>w0025</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0049-rezhim-yarosti.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0049--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0049.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
