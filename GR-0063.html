<script>const BASE="";const DOCNAME="Организация Виктора";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0063-S01", "GR-0063--chto-eto"], "h": "<p>Организация человека, оживившего паладинов. Названа в перечне рас и организаций мира Оам одной строкой: «Организация челика который и оживил паладинов. Давай челика назовём Виктор» (2025-11-17, id 385768). Имя Виктор придумано прямо в этой реплике — до неё он проходит как «челик», «один челик».</p>\n<p>Организация заведена отдельно от Церкви с паладинами, хотя обе строки идут в списке подряд и завязаны на одного человека: сначала перечисляется «Церковь с паладинами ( мёртвыми рыцарями которых оживил один челик, для верующих)», а следующей строкой — организация того же самого челика. То есть паладины стоят при церкви, а у их создателя есть собственная структура, к церкви не сведённая. Как две структуры соотносятся между собой, в переписке не сказано.</p>\n<p>Всё, что о самой организации сказано за обе даты, укладывается в одну строку перечня: она существует, она принадлежит Виктору, она стоит в ряду организаций, «который равны по силе с друг другом». Дальше речь идёт уже не об организации, а о самом Викторе: «Ну и Виктор верит в красный ток что оживляет людей. И он многих оживил, но разум так и не смог в них оживить».</p>\n<p>Устройство, численность и цели организации не описаны. В карточке самой организации это отмечено прямо: «Цели и состав не описаны».</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0063-S02", "GR-0063--sostav"], "h": "<ul>\n<li><a href=\"PS-0308.html\">Виктор</a> — Виктор, тот самый «челик который оживил паладинов». Единственный названный участник.</li>\n</ul>\n<p>Кроме Виктора никто в организацию не записан. Поимённого состава нет, численность не названа.</p>", "r": [["Виктор", "PS-0308.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0063-S03", "GR-0063--obschie-sposobnosti-gruppy"], "h": "<p>Способностей, приписанных всем участникам организации, в переписке нет. Единственная названная способность привязана лично к Виктору и подана как предмет его веры, а не как умение организации: «Виктор верит в красный ток что оживляет людей».</p>\n<p>Красный ток (<a href=\"SP-0248.html\">Красный ток</a>) работает с одним чётким ограничением, которое соавторы задали сразу же, в той же реплике: «И он многих оживил, но разум так и не смог в них оживить». Тело поднимается, разум не возвращается. Позже (2025-12-06, id 393308) итог сформулирован жёстче: Виктор «воскрешает трупы, ну точнее делает из них марионеток».</p>\n<p>Природа самого «тока» не объяснена — ни в окне w0109, ни в окне w0112. Почему он красный, откуда берётся, чем является физически, в переписке не сказано.</p>\n<p>Единственный названный результат работы — паладины Церкви: «мёртвыми рыцарями которых оживил один челик, для верующих». Их свойства описаны через то же ограничение: «паладины до хрена сильный но их ней движения предсказуемый. Они больше как роботы с повторяющими движениями». Отнесены ли паладины к организации Виктора или только к церкви, не сказано.</p>", "r": [["Красный ток", "SP-0248.html"]]}, {"t": "Иерархия", "a": ["S04", "GR-0063-S04", "GR-0063--ierarhiya"], "h": "<p>Внутренняя иерархия организации не описана. Названо только, что организация принадлежит Виктору — она заведена как «организация челика», то есть через его владение, и он же единственный, кто в ней назван.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S05", "GR-0063-S05", "GR-0063--otnosheniya-s-drugimi-gruppami"], "h": "<p>Место организации в общем раскладе сил Оам задано перечнем от 2025-11-17 (id 385768) и повторено дословно 2025-12-06 (id 393287). Расклад устроен так: сверху коты — «Их 9.они сильнеший», вторыми апостолы — «Апостолы 21 вторая по силе раса на земле», а дальше идёт ряд, к которому организация Виктора и принадлежит: «Ну и дальше расы и организации который равны по силе с друг другом».</p>\n<p>В этом ряду вместе с организацией Виктора перечислены: Дети мирового древа, «Проротой каменный челике» с их преступной организацией, Азуриэль, группировка сестры (она же дочь Имитатора), «Правителская организации по контролю всех этих», Церковь с паладинами, Пернатые (Серафим, Пераги), орден для убийства котов, вампиры, Аскизы. Никаких союзов, войн или конкретных связей организации Виктора с кем-либо из них не названо — она просто стоит в списке равных.</p>\n<p>Отдельно оговорено, что Правительская организация существует «по контролю всех этих», то есть в том числе и над этим рядом, но прямого столкновения с организацией Виктора в переписке не описано.</p>\n<p>Единственная названная связь — с Церковью с паладинами, и то через личное действие Виктора: паладины церкви оживлены им. Договора, подчинения или вражды между церковью и организацией Виктора не описано; в карточке организации она прямо помечена как «Отдельная от церкви».</p>\n<p>Сам Виктор 2025-12-06 (id 393305–393308) поставлен в разряд промежуточных злодеев — вместе с Детьми мирового древа, кланом крылатых (Серафим), церквями и «да и люди иногда»: «Да еще и Виктор, что воскрешает трупы, ну точнее делает из них марионеток». Основными злодеями в том же разговоре названы двое других — дочь Имитатора (Имита) и «Человек ( Бог красок)». Виктор к ним не отнесён. Распространяется ли статус промежуточного злодея на организацию целиком или только на её владельца, не сказано.</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S06", "GR-0063-S06", "GR-0063--kak-menyalas"], "h": "<p><strong>2025-11-17, id 385768–385769 (окно w0109).</strong> Организация заведена и названа. Появляется одной строкой в общем перечне рас и организаций Оам, сразу после Церкви с паладинами: «Организация челика который и оживил паладинов. Давай челика назовём Виктор. Ну и Виктор верит в красный ток что оживляет людей. И он многих оживил, но разум так и не смог в них оживить». В этот же момент придумано имя владельца, заведена его вера в красный ток и сразу поставлено ограничение способности — разум не оживает. Отнесена к ряду организаций, равных по силе между собой.</p>\n<p><strong>2025-12-06, id 393287–393290 (окно w0112).</strong> Весь перечень пересказан заново дословно, строка про организацию повторена без изменений. Повтор идёт под репликами «Давай вспомним» и «В нашем мире Оэм уже существует много сторон для конфликта» — то есть список поднят как справка перед разбором сторон конфликта. Ничего нового об организации не добавлено.</p>\n<p><strong>2025-12-06, id 393301–393317 (окно w0112).</strong> Разбор злодеев. Виктор отнесён к промежуточным злодеям, и его работа переформулирована: раньше было «оживил, но разум не смог оживить», теперь — «воскрешает трупы, ну точнее делает из них марионеток». Формулировки не отменяют одна другую, вторая уточняет первую: неоживший разум назван прямо марионеточным состоянием. Об организации как таковой в этом разборе речи нет — злодеем назван человек.</p>\n<p><strong>2026-02-06 — 2026-02-07, id 429348–429816 (окно w0115).</strong> Материал по Оэм собирали в отдельный документ через нейросеть; отмечено, что скинуто было не всё («Че то мало информация оказывается о ОЭМ» — «ой, ч не все чет кинул видимо»). Организация Виктора в этом окне отдельно не разбиралась и не упоминалась.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "GR-0063-S07", "GR-0063--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Цели организации не названы. Ни в одном окне не сказано, чего она добивается.</li>\n<li>Численность не названа.</li>\n<li>Поимённого состава нет: назван только сам Виктор, больше в организацию никто не записан.</li>\n<li>Устройство и внутренняя иерархия не описаны.</li>\n<li>Название организации в переписке отсутствует — она проходит только как «организация челика который и оживил паладинов».</li>\n<li>Не сказано, где организация базируется.</li>\n<li>Соотношение организации с Церковью с паладинами оставлено нерешённым: обе завязаны на Виктора, но как они связаны между собой, не проговорено. Отмечено только, что организация от церкви отдельная.</li>\n<li>Не сказано, входят ли оживлённые паладины в организацию или относятся только к церкви.</li>\n<li>Природа красного тока не объяснена — «Природа 'тока' не объяснена» (w0109), «Природа красного тока не объяснена» (w0112).</li>\n<li>Не сказано, владеет ли красным током кто-то, кроме Виктора, и передаётся ли он внутри организации.</li>\n<li>Отношения с конкретными другими организациями из перечня равных не описаны — назван только сам факт равенства по силе.</li>\n<li>Отклонённых вариантов по организации в переписке нет: строка заведена сразу в готовом виде и дальше только повторялась.</li>\n<li>Написание названия мира в источниках расходится: «Оам» и «Оэм» — Слава пишет «Оэм», Миколай и нейросеть «Оам». Отдельно как разночтение соавторами не обсуждалось.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0063--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0308.html\">Виктор</a></li>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0248.html\">Красный ток</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0063--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0063.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0063-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0063/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Это единственная запись в кластере, которая после 2025-11-17 не сдвинулась ни разу: <code>MR-0173</code> стоит версией 1, дата одна, 4 149 знаков базы при 2 входящих ссылках. Соседи за то же время выросли: <code>MR-0172</code> «Церковь с паладинами» — версия 4, тянется до 2025-12-06, 13 504 знака, 3 ссылки; <code>PS-0308</code> «Виктор» — 4 ссылки, 9 225. Владельца разрабатывали, организацию — нет.</p>\n<p>Чинить первым надо границу между организацией и церковью. Она названа в статье как пробел, но по числам видно, чего стоит: две записи с 17 КБ общей базы описывают одного человека и одно его действие, а входящие ссылки идут то в одну, то в другую. Пока граница не проведена, любая правка в одной записи дублирует другую, и обе они блокируют <code>SP-0248</code> «Красный ток» (3 ссылки, 8 184) — единственную запись, которая объясняет, чем организация вообще занимается.</p>\n<p>Второе — двойники в самом справочнике. Организация Виктора заведена и как группа <code>GR-0063</code> (0 входящих ссылок), и как мир <code>MR-0173</code> (2). Церковь так же: <code>GR-0061</code> (0) и <code>MR-0172</code> (3). Считать кластер по группам и считать его по мирам — два разных ответа про одну сущность.</p>\n<h3>С чего начать</h3>\n<p>В базе смотреть почти нечего, и это само по себе результат: <code>MR-0173</code> — 4 149 знаков, и статья утверждает, что сверх строки перечня там ничего нет. Проверить это надо первым делом, потому что от ответа зависит, куда идти дальше.</p>\n<p>Дальше — архив, три точки.</p>\n<ul>\n<li>2025-11-17, окно w0109, до id 385768. Перечень надиктован готовым. Почему «организация челика» вынесена отдельной строкой от церкви, хотя обе завязаны на одного человека, — из собранного не видно; решение принято до этого сообщения.</li>\n<li>2025-12-06, окно w0112. <code>SL-0125</code> «Список нерешённых вопросов по миру Оэм» — 1 ссылка, статьи нет, 3 899 знаков, та же дата, что и пересборка перечня. Слава там сам перечисляет, чего по Оэм не хватает; читать до всего остального.</li>\n<li>2026-02-06 — 2026-02-07, окно w0115, id 429348–429816. Сборка документа по Оэм через нейросеть, и по её итогу сказано прямым текстом: «Че то мало информация оказывается о ОЭМ» — «ой, ч не все чет кинул видимо». Это признание, что часть материала по миру в сборку не попала; смотреть надо, что именно кидали, отрезок 429348–429386. Рядом лежат <code>SL-0113</code> «Сайт-вики по вселенной (codepen)» (1 ссылка, статьи нет, 6 843) и <code>SL-0126</code> «Документ по материалу на codepen» (1 ссылка, статьи нет, 2 974) — в этих документах могут стоять формулировки, которых в самом чате нет.</li>\n</ul>\n<h3>Как развивалось</h3>\n<p>2025-11-17 (w0109, id 385768) — заявили: строка перечня, тут же придумано имя владельца, тут же поставлено ограничение способности. 2025-12-06 (w0112, id 393287) — повторили дословно, под репликами «Давай вспомним» и «В нашем мире Оэм уже существует много сторон для конфликта»; нового ничего. 2025-12-06 (id 393301–393317) — разбор злодеев: Виктор в него вошёл, организация нет — злодеем назван человек. 2026-02-06 — 2026-02-07 (w0115) — при сборке документа по Оэм организация не всплыла ни разу. Возврата не было.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Статус в конфликте для Виктора назван: промежуточный злодей, вместе с Детьми мирового древа, кланом крылатых и церквями. Для его организации такого правила нет, хотя в том же перечне организации стоят самостоятельными пунктами и меряются силой друг с другом. Рядом видно, что для другого случая правило проговорить не забыли: правительственная организация заведена «по контролю всех этих» — то есть отношение всего ряда к ней задано одной формулировкой. Для человека статус есть, для его структуры — нет, при том что в перечне она числится сама по себе.</p>\n<h3>Отклик</h3>\n<p>Зацепиться тут почти не за что: одна строка списка, повторённая через три недели без единой правки. Но сама строка устроена любопытно — «Организация челика который и оживил паладинов». Организация названа не по себе, а по чужому делу своего владельца, и в этом виде прожила два окна и не изменилась. Живое место здесь ровно одно, и оно не про организацию: «Давай челика назовём Виктор» — имя придумано вслух, посреди перечня, и человек за полстроки стал названным. Всё, что потом наросло — красный ток, марионетки, промежуточный злодей, — выросло из этой минуты. А организация так и осталась приставкой к имени.</p></div>", "r": []}];</script>
