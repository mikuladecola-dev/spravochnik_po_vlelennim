<script>const BASE="";const DOCNAME="Отряд белых";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0028-S01", "GR-0028--chto-eto"], "h": "<p>Отряд из трёх человек на Асгарде — приближённые защитника Асгарда. Появляется в переписке один раз, 2024-07-04, в окне w0042 (id 196135–196149), внутри разговора о «начинке» Асгарда.</p>\n<p>Разговор начался с вопроса Миколая о том, кто окружает защитника: «кто его приближенные» (196126), «он же типо не один там», «есть жители, есть его команда», «те кто выполняют некие задачи» (196133–196135). На это Слава ответил: «А помнишь отряд белых про которых я давно говорил» (196136), «Отряд белых 3 челика» (196137).</p>\n<p>Название «отряд белых» — то, как Слава называет отряд в этом разговоре. Сам он тут же уточнил, что раньше называл его иначе: «Ну я их не так называл» (196141), «Я их как то назвал» (196143). Прежнее название он не вспомнил. Миколай предложил вариант «бесцветные?» (196142) — Слава на него не согласился и не отверг, а перевёл разговор на состав: «Одна из этого отряда бесцветная» (196144).</p>\n<p>Разбор отряда на этом закончился: «Потом как-нибудь расскажу полностью» (196146). Подробного рассказа в переписке дальше нет.</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0028-S02", "GR-0028--sostav"], "h": "<p>Состав назван списком (196145):</p>\n<ol>\n<li>Бесцветная</li>\n<li>Лев</li>\n<li>Наблюдатель</li>\n</ol>\n<p>Отдельных записей в базе у этих трёх нет, id участников не заведены. Названы только имена — ни описаний, ни способностей, ни внешности, ни роли каждого в отряде в переписке нет.</p>\n<p>Порядок в списке пронумерован автором, но что означает нумерация — старшинство, очерёдность или просто перечисление — не сказано.</p>", "r": []}, {"t": "Чем участники отличаются друг от друга", "a": ["S03", "GR-0028-S03", "GR-0028--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p>Единственное различие, названное в переписке, — про Бесцветную: «Одна из этого отряда бесцветная» (196144), то есть это женщина. Про Льва и Наблюдателя не сказано ничего, кроме имён.</p>", "r": []}, {"t": "Иерархия", "a": ["S04", "GR-0028-S04", "GR-0028--ierarhiya"], "h": "<p>Отряд подчинён защитнику Асгарда. Формулировка принадлежит Миколаю: «они получается его сподручные» (196148), Слава подтвердил: «Ну получается» (196149). До этого Миколай называл их через свой же вопрос о приближённых защитника и о «его команде», о тех, «те кто выполняют некие задачи» (196135).</p>\n<p>Какие именно задачи они выполняют, в переписке не сказано. Внутренняя иерархия отряда — есть ли у него главный — не названа.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S05", "GR-0028-S05", "GR-0028--otnosheniya-s-drugimi-gruppami"], "h": "<p>Отряд привязан к защитнику Асгарда (Избранному) и к самому Асгарду — третьему острову, летающему острову религии, где, по разговорам того же и последующих окон, у власти церковь, а жители «сидят набирают ресурсы и силы для атаки на все острова» (196127), считая всех остальных демонами. Защитник Асгарда — «избранный 14 летний мальчик» (201818, 2024-07-09).</p>\n<p>Миколай в том же разговоре разделял окружение защитника на жителей и «его команду» (196134); отряд белых возник как ответ на вопрос о приближённых. Соотношение отряда с «командой» и с армией Асгарда в переписке не проговорено.</p>\n<p>Позже, 2024-07-09 (id 201810–201811), при разборе правительства Асгарда Слава упомянул «Персы» и «И их 3 главных правителей». Связь этих троих с отрядом белых в переписке не названа — совпадение числа никак не оговорено.</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S06", "GR-0028-S06", "GR-0028--kak-menyalas"], "h": "<p><strong>До 2024-07-04, точная дата неизвестна.</strong> Отряд обсуждался раньше — «отряд белых про которых я давно говорил» (196136), — но под другим названием: «Ну я их не так называл» (196141), «Я их как то назвал» (196143). Прежнее название не вспомнили и в переписке оно не всплывает. Миколай на память не полагался: «я не умею запоминать» (196138).</p>\n<p><strong>2024-07-04, id 196135–196149 (окно w0042).</strong> Отряд назван «отрядом белых», числом три, состав перечислен: Бесцветная, Лев, Наблюдатель. Зафиксировано, что это сподручные защитника Асгарда. Разбор отложен: «Потом как-нибудь расскажу полностью» (196146) — «хорошо» (196147).</p>\n<p><strong>Отклонённый (точнее, оставшийся без ответа) вариант названия.</strong> Миколай предложил «бесцветные?» (196142) как догадку о прежнем названии отряда. Слава ответил не на него, а рядом: «Я их как то назвал», «Одна из этого отряда бесцветная». Вариант в переписке не принят и не отвергнут.</p>\n<p>Дальнейших версий у отряда нет: во всех последующих окнах об Асгарде (w0044, w0046) отряд белых не упоминается.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "GR-0028-S07", "GR-0028--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Обещанный полный рассказ об отряде («Потом как-нибудь расскажу полностью») в переписке так и не состоялся.</li>\n<li>Прежнее название отряда осталось невспомненным.</li>\n<li>Общих способностей отряда нет: не сказано ни про одну способность — ни общую, ни личную.</li>\n<li>Не сказано, что означает «белые» в названии и связано ли это с Бесцветной.</li>\n<li>Не сказано, что означают имена Лев и Наблюдатель.</li>\n<li>Задачи отряда не названы, хотя разговор начинался именно с «те кто выполняют некие задачи».</li>\n<li>Внутренняя иерархия отряда и смысл нумерации 1–2–3 не объяснены.</li>\n<li>Возраст, внешность, происхождение участников, их отношение к религии Асгарда — ничего этого в переписке нет.</li>\n<li>Как отряд соотносится с «командой» защитника, с церковью и с армией Асгарда — не проговорено.</li>\n</ul></div>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0028--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0028.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0028-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0028/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дороже всего тут не участники отряда, а <code>MR-0032</code> («Церковная власть Асгарда»): три входящие ссылки при 3,3 КБ статьи и 2,7 КБ базы — самая тощая запись во всём асгардском кусте. Рядом <code>MR-0022</code> (Асгард) держит 31,5 КБ базы, <code>PS-0106</code> (Защитник Асгарда) — 16,6 КБ при пяти входящих. Отряд подчинён защитнику, защитником, по соседним статьям, распоряжается церковь — и вот этот последний узел пустой. Пока он пустой, вопрос «какие задачи выполняет отряд», с которого разговор и начинался, чинить не с чего.</p>\n<p>Вторая по цене — <code>SL-0020</code> («Сравнение силы защитников»): статьи нет вообще, две входящие ссылки, 4,8 КБ базы лежат мимо справочника.</p>\n<p>Третье и самое дешёвое, но прямо про эту статью: сам отряд заведён дважды. <code>GR-0028</code> — 8,3 КБ статьи и 0 базы, <code>PS-0112</code> — 4,2 КБ статьи и 2,8 КБ базы, обе про одни и те же пятнадцать сообщений 2024-07-04. Бесцветная, Лев и Наблюдатель при этом не заведены никак: ни id, ни строки в базе. Никто на них не ссылается, так что блокируют они ноль, — но именно из-за этого «Состав» остаётся списком из трёх слов.</p>\n<h3>С чего начать</h3>\n<p>Не в архив. Сначала свести <code>GR-0028</code> и <code>PS-0112</code>: дословные куски (список 196145, реплики 196141–196144) лежат в персонажной записи, у групповой база нулевая — расхождений между двумя пересказами одного окна быть не должно, а проверить их никто не проверял.</p>\n<p>Дальше — <code>MR-0022</code> и <code>MR-0032</code>. Кусок 2024-07-09 про «Персы» и «И их 3 главных правителей» (id 201810–201811) сидит в островной записи; совпадение числа три с составом отряда нигде не оговорено, и решать это надо там, где лежит материал о правителях, а не здесь.</p>\n<p>В архив идти за двумя вещами. Первая — прежнее название: Слава говорит «про которых я давно говорил», значит искать надо до окна w0042, во всех разговорах об Асгарде и о защитниках, по словам «отряд», «трое», «бесцветн». Вторая — обещанное «Потом как-нибудь расскажу полностью» (196146): всё после 2024-07-04 по именам Бесцветная, Лев, Наблюдатель. В окнах w0044 и w0046, которые уже разобраны, этого нет — значит либо позже, либо нигде.</p>\n<h3>Как развивалось</h3>\n<p>Заявлено где-то до 2024-07-04 под другим названием, которое никто не записал. 2024-07-04 переназвано «отрядом белых» и в те же четверть часа ограничено: три человека, три имени, привязка к защитнику. Тут же отложено самим автором — «Потом как-нибудь расскажу полностью», ответ «хорошо». Не забыто, а именно отложено с согласия обоих. Через пять дней, 2024-07-09, при разборе правительства Асгарда снова возникает тройка — «Персы», «И их 3 главных правителей», — но отряд в этом разговоре не упоминается. Возврата не было ни разу.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Про сам отряд правило названо прямо: «белые» — это как он называется сейчас, а раньше называлось иначе, то есть имя отделено от свойства и объявлено сменным. Про Бесцветную того же не сказано: имя это или описание — не проговорено, хотя ровно на этой двусмысленности построен весь обмен 196141–196144, где Миколай угадывает «бесцветные?» как старое имя отряда, а Слава отвечает, что бесцветная — одна из троих. Для отряда различение имя/свойство сделано, для участницы такого же рода — нет.</p>\n<h3>Отклик</h3>\n<p>Зацепило то, как здесь работает забывание. Обычно в переписке видно, как что-то придумывают; тут видно, как что-то теряют в реальном времени: «Ну я их не так называл», «Я их как то назвал» — и всё, названия больше нет ни у кого, ни у автора, ни у соавтора, который честно говорит «я не умею запоминать». Отряд существует уже в состоянии полустёртого — три имени, из которых одно почти наверняка не имя, а цвет, второе зверь, третье функция. Бесцветная, Лев, Наблюдатель — набор такой, будто их придумывали в разной логике и в разное время, и это скорее интересно, чем небрежно. Слабое место при этом ровно там же: разговор начался с вопроса «кто выполняет некие задачи» и закончился списком без единой задачи. На вопрос ответили именами.</p></div>", "r": []}];</script>
