<script>const BASE="";const DOCNAME="Аватары";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0093-S01", "GR-0093--chto-eto"], "h": "<p>Аватары — класс носителей силы в мире богов и аватаров (<a href=\"MR-0003.html\">мир богов и аватаров</a>): люди, которых выбрали боги и которым боги раздали свои силы. Название дано прямо в переписке: «мой мир боги решили устроить месиво и начали выбирать аватаров ( то бишь людей) давая им силы» (2024-01-03, id 75665). Дальше слово используется как обозначение целого разряда персонажей: «И все они изначально равны ( я про аватаров )» (2024-01-03, id 75747), «что бы каждый аватары были более менее равны по силе» (2024-01-03, id 75714).</p>\n<p>Это не отряд и не организация, а именно класс: аватары друг с другом не объединены, общего дела у них нет, и мир, в котором они появляются, Слава хочет видеть как хаос — «Я хочу что бы в мире был Хаус» (2024-01-03, id 75727).</p>\n<p>Мир, в котором класс существует, — «обычный современный», и месиво в нём начинается внезапно: «вот мир обычный современный и вдруг боги решили устроить месиво и начали выбирать аватаров ( давая самого начало лишь основный способность , но со временем человек может открывать другие способности данного бога , и при этом может качать и старый ) и вот гг стал избранном» (2024-01-03, id 75746). Параллельно с раздачей сил боги выпускают монстров: «что бы было большей зрелище что бы людишки шевелились они начали выпускать дута монстров ( но там нет квестов там просто монстры и все )» (2024-01-03, id 75746).</p>\n<p>Поимённого состава класса в переписке нет. Разобраны три носителя, они и перечислены ниже.</p>", "r": [["мир богов и аватаров", "MR-0003.html"]]}, {"t": "Состав", "a": ["S02", "GR-0093-S02", "GR-0093--sostav"], "h": "<ul>\n<li><a href=\"PS-0024.html\">Главный герой мира богов и аватаров</a> — главный герой мира богов и аватаров, «гг стал избранном» (2024-01-03, id 75746). Его основная способность — телепортация в карманное измерение (<a href=\"SP-0034.html\">телепортация в карманное измерение</a>).</li>\n<li><a href=\"SP-0040.html\">аватар бога плодородия</a> — аватар бога плодородия. Отдельной записи-персонажа у него нет: он заведён в базе как способность, потому что в переписке разбиралась только его сила, а не он сам.</li>\n<li><a href=\"PS-0026.html\">псих-кукловод</a> — псих-кукловод. Миколай предлагает ему богиню плодородия, дающую создавать афродизиак (2024-01-04, id 77258). Прямым словом «аватар» он не назван, привязка идёт через бога-покровителя.</li>\n</ul>\n<p>Кроме этих трёх, Слава называет аватаров общей категорией, без имён: «боги раздали способности не только добрякам но и психом террористом и подобной мразоть» (2024-01-03, id 75727), «в твоём мире появится дохуя монстров или будут психи или другая мразато который стали аватаром» (2024-01-03, id 75775).</p>\n<p>Отдельно от аватаров стоят персонажи из других миров, которых боги призвали на землю: «Плюсом персонажей из других миров Который боги призвали на землю ради Хауса. Вот эти у меня одна тройка уже есть И один мега гач» (2024-01-04, id 76396–76397). Аватарами они не названы.</p>", "r": [["Главный герой мира богов и аватаров", "PS-0024.html"], ["псих-кукловод", "PS-0026.html"], ["телепортация в карманное измерение", "SP-0034.html"], ["аватар бога плодородия", "SP-0040.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0093-S03", "GR-0093--obschie-sposobnosti-gruppy"], "h": "<p><strong>Сила — от своего бога и только от него.</strong> Ключевое ограничение класса задано сразу: «аватар может качать способности только связанные со своим богом» (2024-01-03, id 75665). Пример там же: «бог времени ( хронус ) Аватар и так знаешь способность» (2024-01-03, id 75668).</p>\n<p><strong>Начало — одна основная способность, дальше открываются другие.</strong> «давая самого начало лишь основный способность , но со временем человек может открывать другие способности данного бога , и при этом может качать и старый» (2024-01-03, id 75746). Та же мысль раньше: «они будут в будущем открывать новый способности связанный с их нем богом» (2024-01-03, id 75734).</p>\n<p><strong>Изначальное равенство.</strong> «И все они изначально равны ( я про аватаров )» (2024-01-03, id 75747). Равенство — сознательная задача Славы: «что бы каждый аватары были более менее равны по силе», «Баланс» (2024-01-03, id 75714, 75716).</p>\n<p><strong>Баланс держится на ограничениях.</strong> Ограничения вводятся как механика класса: «Ну у них могут быть ограничения для баланса» (2024-01-03, id 75717). Образец назван прямо: «Ну как почти что в Джоджо», «То бишь остановка времени максимум 5 секунд и подобной хуеты» (2024-01-03, id 75718–75719). Какого рода ограничения нужны, Слава уточняет: «ну типа ограничение выносливость и типо того» (2024-01-03, id 75734).</p>\n<p><strong>Ограничения аватаров объяснены их природой.</strong> «Это жалкий людишки конечно они не смогут в полной мере использовать силы богов» (2024-01-03, id 75814).</p>\n<p><strong>Как открываются новые способности.</strong> Итоговая формулировка Славы: «боги будут давать способности только при просьбе или когда аватар сделает что то что им понравится» (2024-01-03, id 75775). До этого у него было два пути: «что бы открыть новый способности либо надо тренироваться либо выполнить просьбу бога когда он попросит» (2024-01-03, id 75764); от тренировок он отказывается после возражения Миколая «Ну тренировки просто скучно», «А вот поручение бога Норм» (2024-01-03, id 75766–75768) — «Кстати на счёт тренировок прав» (2024-01-03, id 75775).</p>\n<p><strong>Жертвоприношение богу (<a href=\"SP-0041.html\">жертвоприношение богу</a>).</strong> Механика усиления, предложенная Миколаем взамен тренировок: «Чем важнее для аватара вещь будет дана в жертву богу, тем сильнее способность он получит», «Важность может ещё определяется сложностью получения», «Убить целый спальный район ради жертвы не хухры мухры» (2024-01-03, id 75761–75763). Принята ли механика в мир Славы, в переписке не сказано: Слава в ответ описывает свою систему (id 75764), и вопрос не закрывается.</p>\n<p><strong>Мотив качаться — интерес.</strong> «Если человеку скажут не нажимать на кнопку что человек сделает Также и со способностями интерес до скольки я смогу прокачаться интересно какие ещё будут способности интересно Ая сам смогу стать богом» (2024-01-03, id 75779). Вторая причина — самозащита: «тебе надо будет стать сильнее что бы защитить себя» (2024-01-03, id 75775). Миколай на тот же вопрос отвечает иначе, за себя: «я бы прокачал до того уровня когда с помощью неё можно будет спрятаться от всей этой поеботы А дальше жил бы спокойно» (2024-01-03, id 75777–75778). Слава подводит итог различию: «Тат на интересе все завязано А не на психологии» — это реплика Миколая (2024-01-03, id 75785–75786).</p>\n<h3>Отклонённые и неутверждённые варианты общих правил</h3>\n<ul>\n<li><strong>Ограничение «только в поединке» плюс плата вне поединка.</strong> Миколай: «Если только во время поединка», «А вне поединка он может юзать способность, за какую то валюту, не обязательно деньги, возможно это будет его как то ограничивать», «То есть менее строго» (2024-01-03, id 75722, 75724–75725). Слава отказал: «Не», причина — «Я хочу что бы в мире был Хаус» (2024-01-03, id 75726–75727).</li>\n<li><strong>Время суток.</strong> «способности некоторых работают только утром а некоторых только ночью» (2024-01-03, id 75728). Отказ: «Это будет Хаус будет смерти конец экономике», «Ограничений не такого плана» (2024-01-03, id 75729–75730).</li>\n<li><strong>Лимит по времени в сутки.</strong> «Максимум можно юзать 45 минут в день» (2024-01-03, id 75731). Слава: «Нет ты не правильной понял ну типа ограничение выносливость и типо того» (2024-01-03, id 75734).</li>\n<li><strong>Наследственная прокачка (<a href=\"SP-0042.html\">наследственная прокачка способности</a>).</strong> «способность нельзя никак улучшить, она изначально слаба и почти бесполезна, не все есть возможности, можно её улучшить только по наследству, с каждым поколением способность сильнее» (2024-01-03, id 75736), с добавлением «чем больше человек думает о боге в момент зачатия тем лучше повлияет на улучшение» (2024-01-03, id 75738). Отклонено Славой: «Ты написал нельзя никак улучшать И так же в моём мире не будет потом нового поколения» (2024-01-03, id 75755). Миколай согласился: «А», «Ок» (2024-01-03, id 75756–75757).</li>\n<li><strong>Неравномерное развитие.</strong> Возражение Миколая против равенства: «Способности все разные И развиваться должны не равномерно Чтобы дольше балан шел» (2024-01-03, id 75752–75754). Ветка обрывается на споре о наследственной прокачке; переформулировано это возражение не было.</li>\n<li><strong>Отбор всех способностей одним аватаром.</strong> Предложение Миколая для мотивации гг: «в мга есть все за одно, типо чел который забирает все способности и может ими управлять, может его цель забрать всё», «Все способности у всех» (2024-01-04, id 77267–77268). Отклонено: «Да ты прав я не соглашусь Тогда тот баланс который я так сильно хочу создать разрушится» (2024-01-04, id 77272).</li>\n</ul>", "r": [["жертвоприношение богу", "SP-0041.html"], ["наследственная прокачка способности", "SP-0042.html"]]}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0093-S04", "GR-0093--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p><strong><a href=\"PS-0024.html\">Главный герой мира богов и аватаров</a>, главный герой.</strong> Аватар с основной способностью «телепортация в карманное измерение» (<a href=\"SP-0034.html\">телепортация в карманное измерение</a>). Измерение принадлежит богу: «Это его способность телепортироваться карманная измерения ( бога )» (2024-01-04, id 76201). Имя бога-владельца не названо.</p>\n<p>Полное описание способности дано одним сообщением (2024-01-04, id 76171): «человек способен телепертиваться в свою карманная измерения где нету ничего кроме энергий который его организм способен поглощать и использовать для увеличения физических способностей и регенерации И он также способен телепортировать туда неоудешевленный объекты заряжая их этой же энергий ( Это энергия опасно для живых существ кроме гг, но и гг тоже не может поглощать её до бесконечности иначе сдохнить )». Возвращённые объекты «также способны оказаться где попала», заряжены энергией, которую гг может поглотить, и «на какой то время способен контролировать те предметы который телепортировал то бишь телекинез».</p>\n<p>Минусы перечислены там же (2024-01-04, id 76171): не может телепортироваться далеко; не может находиться в своём пространстве слишком долго; не способен лечить других своей энергией; не способен телепортировать объект, который не видит; не способен телепортировать живых существ; перезарядка «минут 1-3 сам ещё не определился»; не способен телепортировать артефакты — «поэтому он не может просто стибзить артефакте у кого то».</p>\n<p>Уточнения после разбора (2024-01-04, id 76348–76385): энергия идёт не из гг в пространство, а наоборот — «Попадая в этой пространства они заряжаются этой энергий»; в пространстве энергии «дохуя» и она «бесконечна»; живые существа туда попасть не могут вовсе; возврат — «От куда ушел и в радиусе 20 метров», маяки поставить нельзя; само пространство — «Это пустой пространства там нет гравитация ни объектов чисто тьма»; предел пребывания задан телом: «он не может бесконечно поглощать эту энергию поэтому он там дольше 3 секунд не бывает». Энергия тратится, поэтому «ему нужно будет часто телепортироваться Либо телепортировать объект и из них поглощать энергию» (2024-01-04, id 76241).</p>\n<p>Развитие способности на будущее (2024-01-04, id 76390): «энергия который он способен усилить себя или излечить также в будущем научиться превращать эту энергию в оружий либо в шарик который взорвется и в будущем энергетический щит и имитирования молний». Про щит отдельно: «энергетический щит будет имба ( он покроет тела энергий и любой кто притронется получит невероятный урон с заражением )» (2024-01-04, id 76395).</p>\n<p>Внешность и характер: «гг у меня будет уродом» (2024-01-03, id 75987); «он чсв, эгоистичный , не прочь убить и считает себя избранным но у него все ровно есть мораль» (2024-01-04, id 77263). Поведение в начале сюжета: «изначально в сюжете он просто веселиться набивая всем морду но дальше нужная какая то цель ?» (2024-01-04, id 77263) — цель осталась ненайденной, решено: «лучше сначала мир построить и потом дать гг мотивацию» (2024-01-04, id 77276).</p>\n<p>Подбор способности до её закрепления шёл через перебор (2024-01-04, id 76034–76070). Начальный вариант — время: «Изначально я хотел время но передумал ( потому что как то так себе )». Варианты Миколая: «Спонтанное самовозгорание самоподжигание объектов вокруг» с оговоркой «типо с прокачкой он больше контролирует её» — отклонено Славой («Не»); «влияние и стимуляция отдельных органов выработка гормонов по желанию для того, чтобы получить нужный эффект, например не чувствовать боль, чувствовать себя сильнее»; «если обычная то телепорт, это круто И удобно»; «Умение ломать систему. Системы разные бывают не обязательно механические. У него удача всегда направлена на то что какую-то деталь в системе он сломает уберёт, а как мы знаем, хоть одну деталь убрать из системы она полностью развалится, но обычно эту деталь можно восстановить, его способность делает это не возможным». Слава хотел что-то в духе Акселератора («у него управления вектором Что и делало его почти не победимым», «Грубо говоря телекинез на новым уровне») но своё: «Придумать что то подобной Только нечего в голову не влезает». Его собственный незакреплённый набросок: «атомного телекинеза настолько сильного что он может разобрать на атомы танк и потом снова собрать тупо говоря телекинез+ алхимия» (2024-01-04, id 76064).</p>\n<p><strong><a href=\"SP-0040.html\">аватар бога плодородия</a>, аватар бога плодородия.</strong> Первый разобранный аватар в системе. Бог назван Миколаем как «Приамп» (2024-01-03, id 75682) с пояснением «Это крч бог с большим еладаком», затем «То есть бог плодородия» (2024-01-03, id 75689, 75691). Способности аватара: «во первых, всеобщее повышение либидо» и «роста растений» (2024-01-03, id 75695, 75697). Отдельная механика силы: «Его сила повышается с его повышением либидо», «Если красивую девочку увидит Сильнее становится» (2024-01-03, id 75702, 75704–75705). Кто носит эту силу — не сказано, персонаж под неё не заведён.</p>\n<p><strong><a href=\"PS-0026.html\">псих-кукловод</a>, псих-кукловод.</strong> Заявка Славы: «В моём мире есть обычный люди и я хочу придумать психа который будет охотится на них используя мозг» (2024-01-04, id 77242), «хитрец, манипулятор, и так далее ( куклод)», «Кукловод» (2024-01-04, id 77245–77246). Связь с классом аватаров — через предложение Миколая: «Может например у чела будет богиня плодородия которая даст возможность создавать например афродизиак» (2024-01-04, id 77258). Применение афродизиака: «контролировать влюблённых», «Давать им приказы», «можно было попросить умереть человека ради него и он себя убивал во имя любви», «он будет использовать афродизиак на людях, смотреть их половые акты и заставлять убивать друг друга» (2024-01-04, id 77260–77264). Реплика Славы в этой ветке — «Он человек обычный» (2024-01-04, id 77266); к кому она относится — к психу или к гг, о котором Слава писал сообщением раньше, — из переписки не следует.</p>\n<p>Богиня плодородия для психа (2024-01-04) и бог плодородия для отдельного аватара (2024-01-03) в переписке между собой не связаны — соотношение этих двух божеств не оговорено.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Первым чинить бога главного героя. Его нет как сущности вообще — ни статьи, ни исходника, ни кода, потому что в переписке он назван только скобкой: «карманная измерения ( бога )». А завязано на него много: <code>PS-0024</code> главный герой (статья 20 763, база 16 835, четыре ссылки — больше, чем у любой другой сущности этого мира) и <code>SP-0034</code> телепортация в карманное измерение (статья 15 841, база 14 458, две ссылки). Самая проработанная механика мира — три десятка килобайт разбора на двоих — держится на владельце пространства, у которого нет имени. И правило класса «аватар качает только способности своего бога» без этого имени непроверяемо: неизвестно, к какой теме привязан главный герой.</p></div>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Второе — носитель силы бога плодородия. <code>SP-0040</code> «аватар бога плодородия» — статья 7 334, база 5 548, три ссылки (эта статья, <code>GR-0092</code>, <code>VS-0009</code>); разобрана сила, персонажа под ней нет. Рядом лежит <code>PS-0026</code> псих-кукловод — статья 9 420, база 4 740, две ссылки, — и он привязан ровно к той же теме, только через «богиню». Две записи об одном мотиве, между собой не связанные ни ссылкой, ни репликой.</p></div>", "r": [["Главный герой мира богов и аватаров", "PS-0024.html"], ["псих-кукловод", "PS-0026.html"], ["телепортация в карманное измерение", "SP-0034.html"], ["аватар бога плодородия", "SP-0040.html"]]}, {"t": "Иерархия", "a": ["S05", "GR-0093-S05", "GR-0093--ierarhiya"], "h": "<p>Внутри класса иерархии нет: аватары «изначально равны» (2024-01-03, id 75747), и весь спор о балансе идёт ради удержания этого равенства.</p>\n<p>Над аватарами стоят боги: они выбирают людей, раздают силы и дают поручения, за которые открываются новые способности (2024-01-03, id 75665, 75775). У богов, по требованию Славы, тоже есть ограничения: «у богов должны тоже быть ограничение что бы они просто так способности не раздавали» (2024-01-03, id 75775).</p>\n<p>Выше богов — вышестоящее существо. Миколай: «Бог не сможет увидеть результат который выйдет после раздачи способности, точнее наоборот увидит только последствия и за эти последствия будет наказан богом на статус всех выше» (2024-01-03, id 75780), развёрнуто — «обычно, если бог наблюдает за аватаром, он его создал чтобы наблюдать, а тут, ну после улучшения способности он не сможет узнать как именно аватар будет пользоваться способностью и если бог норм, то не будет давать ему возможность натворить бед, так как вышестоящее существо покарает за что-то тяжёлое» (2024-01-03, id 75792).</p>\n<p>Слава эту конструкцию переворачивает: «Это и есть высшее существа И они хотят зрелища поэтому им только в кайф если будут беды» (2024-01-03, id 75799). Миколай на это: «Ну тогда ограничения нахуя им» (2024-01-03, id 75813), Слава отвечает про природу самих аватаров: «Это жалкий людишки конечно они не смогут в полной мере использовать силы богов» (2024-01-03, id 75814). Вопрос, наказывается ли бог за последствия и кем, остался нерешённым.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S06", "GR-0093-S06", "GR-0093--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>Боги / пантеон.</strong> Аватар привязан к своему богу: качает только его способности, получает новые за просьбы и за поступки, которые богу понравятся. Выбор пантеона обсуждался вечером 2024-01-03 (id 75973–76019) и не был закрыт. Слава: «Вообще я хочу из славянской мифология Так как она все же ближе плюсом мне достало что везде есть древнегреческая, египетская , мусульманская , скандиданская» (id 75973). Миколай: «древнегреческая топ», «в синтоизме 8 миллионов различных богов, должно хватить думаю», «Из язычества тоже было бы здорово», «Скандинавия вообще в моем сердечке», «Египетская тоже ничего»; мусульманская отклонена — «мне кажется это монотеистическая религия Думаю не пойдёт» (id 75974–75981). Отдельная идея: «Сатурн и Хронос, это прикольно можно обоих использовать, но разные способности присвоить» (id 75984), на что Слава: «Вот идеально» (id 75986). Ранее в списке богов назывались Аматерасу, Один, Перун, Шива (2024-01-03, id 75661–75664), Зевс с молниями «по классике» (id 75669–75670), Феникс (id 75677), Посейдон (id 75684). Отдельно разбирался Гермес (2024-01-03, id 75995–76019): Слава — «в некоторых источника, вор и торговец и типо у него дохуя артефактов», «Идеальная для одного персонажа», «Бог» (id 76009, 76011, 76013); Миколай без интернета связал его с чёрным, воронами и молниями и плохим характером (id 76002–76003).</p>\n<p><strong>Монстры.</strong> Выпускаются богами параллельно с раздачей сил, ради зрелища; квестовой системы при них нет (2024-01-03, id 75746). Названы как одна из причин качаться: «в твоём мире появится дохуя монстров» (2024-01-03, id 75775).</p>\n<p><strong>Обычные люди.</strong> В мире остаются: «В моём мире есть обычный люди» (2024-01-04, id 77242); они добыча для психа-кукловода. В речи о богах люди зовутся «людишки» (2024-01-03, id 75746, 75814).</p>\n<p><strong>Призванные из других миров.</strong> Отдельная категория, аватарами не названная: «персонажей из других миров Который боги призвали на землю ради Хауса», у Славы «одна тройка уже есть И один мега гач» (2024-01-04, id 76396–76397). Состав тройки не назван.</p>\n<p><strong>Структура персонажей.</strong> Рекомендация Миколая по общему устройству состава: «Рекомендую сделать 12 персонажей по 3 человека в группе» (2024-01-04, id 76394), с оговоркой «Ну да, но наверное трудно всех проработать» (id 76398). Как эти 12 соотносятся с аватарами и с призванными, не сказано. Слава планировал «писать про них в тетрадь так легче будет» и отметил, что персонажи у него уже были в других его вселенных: «все эти персонажей у меня давным давно в башки были раньше гг в мой вселенной» (2024-01-04, id 76401), «они уже были в моих в других вселенных и поэтому их легче будет проработать» (id 76405).</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S07", "GR-0093-S07", "GR-0093--kak-menyalas"], "h": "<p><strong>2024-01-03, дневной блок (id 75650–75722).</strong> Объявлена сама система: боги устраивают месиво, выбирают аватаров среди людей, дают силы; аватар качает только способности своего бога; пример — бог времени Хронос. Тогда же разобран первый аватар — аватар бога плодородия (id 75678–75706). В конце блока поставлена задача баланса и введены ограничения как механика (id 75714–75722).</p>\n<p><strong>2024-01-03, спор об ограничениях (id 75714–75745).</strong> Образец назван — Джоджо, «остановка времени максимум 5 секунд». Миколай перебирает варианты (только в поединке, плата вне поединка, время суток, 45 минут в день, наследственная прокачка), Слава отклоняет их все и формулирует нужный тип: ограничение по выносливости. Там же зафиксировано, что силы достались не только добрякам, но и «психом террористом и подобной мразоть».</p>\n<p><strong>2024-01-03, развёрнутая формулировка (id 75742–75775).</strong> Слава излагает мир целиком: современный мир, аватар начинает с одной основной способности и со временем открывает другие способности своего бога, старые тоже качаются; боги выпускают монстров ради зрелища; «И все они изначально равны». Миколай возражает про неравномерное развитие и предлагает жертвоприношение богу. Слава закрывает наследственную прокачку («в моём мире не будет потом нового поколения») и описывает свою систему открытия способностей.</p>\n<p><strong>2024-01-03, вопрос о богах (id 75764–75814).</strong> Слава требует ограничений и для богов. Миколай вводит наказание бога вышестоящим существом; Слава заявляет, что высшие существа сами хотят зрелища и бед. Вопрос остался нерешённым. Там же — мотивация аватаров через интерес.</p>\n<p><strong>2024-01-03, вечер (id 75973–76019).</strong> Выбор пантеона: славянская мифология против греческой, синтоизма, язычества, скандинавской, египетской; монотеистическая отклонена. Идея Сатурна и Хроноса как двух разных богов. Разбор Гермеса. Тогда же: «гг у меня будет уродом».</p>\n<p><strong>2024-01-04, день (id 76034–76070).</strong> Подбор способности для гг: отказ от времени, перебор вариантов Миколая, попытка сделать «что то подобной» Акселератору.</p>\n<p><strong>2024-01-04, вторая половина дня (id 76166–76241).</strong> Закреплена способность гг — телепортация в карманное измерение бога, с полным списком минусов; уточнено, что энергия тратится.</p>\n<p><strong>2024-01-04, вечер (id 76348–76415).</strong> Уточнения по механике измерения: энергия бесконечна внутри пространства, живые туда не попадают, возврат в радиусе 20 метров, пространство — пустая тьма, предел пребывания 3 секунды. Намечено развитие: оружие из энергии, взрывающийся шарик, энергетический щит, имитация молний. Там же — рекомендация про 12 персонажей по 3 в группе и заявка на призванных из других миров.</p>\n<p><strong>2024-01-04, поздний вечер (id 77240–77279).</strong> Заявка на психа-кукловода и предложение дать ему богиню плодородия с афродизиаком. Вопрос о мотивации гг: вариант «забрать все способности» отклонён ради баланса, решено сначала строить мир.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "GR-0093-S08", "GR-0093--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава класса нет: аватары перечисляются категориями («психи», «террористы», «добряки»), разобраны только трое.</li>\n<li>Имя бога, которому принадлежит карманное измерение гг, не названо.</li>\n<li>Имени у главного героя нет.</li>\n<li>У аватара бога плодородия нет носителя: разобрана только сила, персонаж не заведён.</li>\n<li>Имя бога плодородия дано в искажённом виде — «Приамп»; правильная форма в переписке не установлена.</li>\n<li>Прямо аватаром псих-кукловод не назван; принят ли он в мир, не сказано — ветка обрывается решением сначала строить мир.</li>\n<li>Соотношение бога плодородия (2024-01-03) и богини плодородия для психа (2024-01-04) не оговорено.</li>\n<li>Принята ли механика жертвоприношения богу (<a href=\"SP-0041.html\">жертвоприношение богу</a>) в мир Славы — прямо не сказано.</li>\n<li>Возражение Миколая о неравномерном развитии способностей осталось без ответа: спор ушёл в сторону наследственной прокачки.</li>\n<li>Вопрос об ограничениях самих богов остался нерешённым: Миколай ввёл наказание вышестоящим существом, Слава заявил, что высшим существам беды в кайф, и спор закончился ничем.</li>\n<li>Мотивация гг после начального «просто веселиться набивая всем морду» не найдена.</li>\n<li>Перезарядка телепортации не определена: «минут 1-3 сам ещё не определился».</li>\n<li>Как рекомендация «12 персонажей по 3 человека в группе» соотносится с аватарами, не сказано; состав тройки призванных из других миров не назван.</li>\n<li>Рэпер (<a href=\"PS-0025.html\">Рэпер (накачанный чернокожий)</a>) в аватары прямо не записан.</li>\n<li>Вселенная в переписке не названа, говорится только «мой мир»; отнесение к «Падениям небес» сделано по дате объявления.</li>\n</ul></div>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Третье, дешевле, но заметно: <code>PS-0025</code> Рэпер — статья 4 268 при базе 1 738, две ссылки, вселенная «Падения небес», а в аватары не записан. Он тут самая тонкая запись мира, и статья честно выносит это в пробелы.</p></div>", "r": [["Рэпер (накачанный чернокожий)", "PS-0025.html"], ["жертвоприношение богу", "SP-0041.html"]]}, {"t": "Связи — всё вместе", "a": ["GR-0093--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0024.html\">Главный герой мира богов и аватаров</a>, <a href=\"PS-0025.html\">Рэпер (накачанный чернокожий)</a>, <a href=\"PS-0026.html\">псих-кукловод</a></li>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0034.html\">телепортация в карманное измерение</a>, <a href=\"SP-0040.html\">аватар бога плодородия</a>, <a href=\"SP-0041.html\">жертвоприношение богу</a>, <a href=\"SP-0042.html\">наследственная прокачка способности</a></li>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0003.html\">мир богов и аватаров</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0093--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0093.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0093-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0093/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым чинить бога главного героя. Его нет как сущности вообще — ни статьи, ни исходника, ни кода, потому что в переписке он назван только скобкой: «карманная измерения ( бога )». А завязано на него много: <code>PS-0024</code> главный герой (статья 20 763, база 16 835, четыре ссылки — больше, чем у любой другой сущности этого мира) и <code>SP-0034</code> телепортация в карманное измерение (статья 15 841, база 14 458, две ссылки). Самая проработанная механика мира — три десятка килобайт разбора на двоих — держится на владельце пространства, у которого нет имени. И правило класса «аватар качает только способности своего бога» без этого имени непроверяемо: неизвестно, к какой теме привязан главный герой.</p>\n<p>Второе — носитель силы бога плодородия. <code>SP-0040</code> «аватар бога плодородия» — статья 7 334, база 5 548, три ссылки (эта статья, <code>GR-0092</code>, <code>VS-0009</code>); разобрана сила, персонажа под ней нет. Рядом лежит <code>PS-0026</code> псих-кукловод — статья 9 420, база 4 740, две ссылки, — и он привязан ровно к той же теме, только через «богиню». Две записи об одном мотиве, между собой не связанные ни ссылкой, ни репликой.</p>\n<p>Третье, дешевле, но заметно: <code>PS-0025</code> Рэпер — статья 4 268 при базе 1 738, две ссылки, вселенная «Падения небес», а в аватары не записан. Он тут самая тонкая запись мира, и статья честно выносит это в пробелы.</p>\n<p>Проверка на связность: <code>GR-0093</code> — ноль входящих ссылок при статье в 38 420 знаков, самой крупной из трёх в этой партии.</p>\n<h3>С чего начать</h3>\n<p>Почти всё нужное уже в базе и просто не подцеплено. Перебор способностей для главного героя в разделе «Чем участники отличаются» пересказан по репликам, а между тем каждый вариант из перебора заведён отдельной записью — со статьёй ни один: <code>ID-0030</code> «спонтанное самовозгорание объектов» (2 147), <code>ID-0031</code> «атомный телекинез» (3 089), <code>ID-0026</code> «обмотка времени» (2 464), <code>ID-0027</code> «забывать прошлое» (1 780). У всех по одной ссылке, и та из <code>VS-0009</code>, — то есть от этой статьи к ним не ведёт ничего, хотя разбираются они здесь. Туда же <code>ID-0032</code> «Энтропия как замысел вселенной» (2 869), <code>ID-0033</code> «Откуда растут концепции сил» (6 517) и <code>ID-0034</code> «Меняются ли люди» (2 835): три записи того же дня и той же вселенной, ни одна в статье не фигурирует, а вопрос мотивации главного героя — «дальше нужная какая то цель ?» — упирается ровно в них.</p>\n<p>Дальше <code>MR-0003</code> (база 31 443) — самая толстая запись мира и единственное место, где может лежать имя бога-владельца.</p>\n<p>В архив — за одним. 2024-01-04, id 76166–76241 и 76348–76415: механика измерения разобрана подробно, но именно там, между «карманная измерения ( бога )» и уточнениями про радиус и три секунды, мог всплыть бог. Смотреть надо вокруг id 76197–76201, где Миколай задаёт прямой вопрос «Его ему подарил его бог / Да ?» — ответ дан, но неполный, и продолжение стоит проверить построчно.</p>\n<h3>Как развивалось</h3>\n<p>2024-01-03, день — заявили класс: боги выбирают людей, дают силу, аватар качает только своего бога, все изначально равны.</p>\n<p>2024-01-03, вечер — ограничили, и очень плотно. Миколай перебирает пять механик подряд (только в поединке, плата валютой вне поединка, время суток, 45 минут в день, наследственная прокачка), Слава отклоняет все до одной и задаёт свой тип: «ну типа ограничение выносливость и типо того». Тогда же закрыта наследственная прокачка — «в моём мире не будет потом нового поколения».</p>\n<p>2024-01-04, весь день — забыли про класс: разговор целиком уходит на одного носителя и одну его способность. О том, как всё это ложится на остальных аватаров, за день не сказано ни разу.</p>\n<p>2024-01-04, поздний вечер — вернулись, боком: через психа-кукловода, которому предлагают богиню плодородия. И тут же свернули — «лучше сначала мир построить и потом дать гг мотивацию». После 2024-01-04 к классу не возвращаются.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для главного героя ограничения силы расписаны списком и всерьёз: далеко не телепортируется, дольше трёх секунд не остаётся, живых не переносит, того, чего не видит, не переносит, лечить других не может, перезарядка одна-три минуты, артефакты не берёт. Семь пунктов, и они названы прямо как минусы.</p>\n<p>Аватар бога плодородия разобран в той же системе, в те же сутки и по тем же правилам — «Его сила повышается с его повышением либидо», рост растений, всеобщее повышение либидо. Ни одного ограничения к нему не названо. При этом общий принцип класса объявлен как общий: ограничения есть у всех, они по выносливости, и держат они баланс, ради которого весь спор и шёл. Для одного носителя правило выполнено полностью, для соседнего, стоящего в том же списке, — не проговорено вовсе.</p>\n<h3>Отклик</h3>\n<p>Зацепило сообщение 76171. Одним куском выдан целый механизм, и половина этого куска — про то, как он не работает. «Не способен телепортировать артефакты, поэтому он не может просто стибзить артефакте у кого то» — это ограничение придумано не из физики пространства, а из сюжетной дыры, которую автор увидел за собой сам, на ходу, и заткнул в том же предложении. Так же и «он там дольше 3 секунд не бывает»: место, где сила бесконечна, ограничено не силой, а телом того, кто ей пользуется. Человек, который так думает про свою выдумку, думает про неё как про устройство, а не как про список крутых штук.</p>\n<p>И рядом, в тот же вечер: «изначально в сюжете он просто веселиться набивая всем морду но дальше нужная какая то цель ?» — с вопросительным знаком, на который никто не ответил. Семь ограничений на одну способность и ни одного мотива на весь сюжет; и автор это про себя знает и говорит вслух. Мне это показалось честнее, чем любая придуманная цель на её месте.</p></div>", "r": []}];</script>
