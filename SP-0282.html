<script>const BASE="";const DOCNAME="Очки Заны";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0282-S01", "SP-0282--mehanika"], "h": "<p>Артефакт Заны — очки, второй в перечне его артефактов (2026-06-17, id 491164). «Они позволяют телепортироваться в поле своего зрения».</p>\n<p>Телепортация привязана к тому, что владелец видит непосредственно в момент применения: «а только на те который именно сейчас видит».</p>\n<p>Во внешнем описании (id 491165) уточнено, что это «очки с цепочкой (артефакт)» и что Зана носит их постоянно.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0282-S02", "SP-0282--ogranicheniya-i-cena"], "h": "<ul>\n<li>Дальние дистанции недоступны: «Он не способен телепортироваться на Дальний дистанции».</li>\n<li>Туман отключает артефакт полностью: «И если всё накроется туманом он по сути не сможет телепортироваться».</li>\n<li>Перезарядка: «у очков перезарядка 3-4 секунды».</li>\n</ul>\n<p>Цены сверх этого — расхода сил, ресурса, вреда носителю — в переписке не названо.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0282-S03", "SP-0282--nositeli"], "h": "<p>Зана. Других носителей не названо. Очки он носит постоянно, наравне с перчаткой для стрельбы на правой руке; подвеска-артефакт при этом спрятана за рубашкой (id 491165).</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0282-S04", "SP-0282--kak-menyalas-po-versiyam"], "h": "<p>Версия одна — 2026-06-17 (id 491164–491165, окно w0122). Оба сообщения написаны в одну минуту: в первом дан перечень артефактов с механикой и ограничениями очков, во втором — внешнее описание Заны, где очки указаны как деталь постоянного облика.</p>\n<p>Изменений механики после этого в переписке нет.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0282-S05", "SP-0282--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Очки — второй из четырёх артефактов Заны, перечисленных в id 491164:</p>\n<ol>\n<li><strong>Клинок тысячи боли.</strong> «Царапина от такого клинка вызовит такую боль словно тебя пырнули». Этим клинком Зана ударил в спину старика.</li>\n<li><strong>Очки</strong> — настоящая статья.</li>\n<li><strong>Железная сердца</strong> — «подвеска, с серебряным сердцем». Эффект: «рандомно телепортирует куда-то». Используется крайне редко именно из-за случайности: «Он может оказаться внутри стены и сдохнуть, он может оказаться воздухе и просто умереть, он может оказаться под глубиной воды и просто захлебнуться и умереть под давлением». Перезарядка 5 часов.</li>\n<li><strong>Перчатка, предназначенная для стрельбы.</strong> «Способен призывать серебряный лук, который стреляет стрелами созданный из оам (лук сам создаёт стрелы из оам)».</li>\n</ol>\n<p>Очки и железное сердце — два телепортационных артефакта, и в исходном сообщении они прямо сопоставлены по перезарядке: 5 часов у подвески против 3-4 секунд у очков. Сопоставление по управляемости (очки — только в видимую точку, подвеска — случайно) в тексте тоже присутствует, но как отдельная оговорка про минусы подвески.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "SP-0282-S06", "SP-0282--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Откуда у Заны очки и кто их сделал — в переписке не сказано.</li>\n<li>Дальность прямо не задана числом: сказано только, что дальние дистанции недоступны, а работает — по тому, что видно сейчас.</li>\n<li>Работает ли артефакт по отражению, изображению на экране, через стекло — не оговорено.</li>\n<li>Считается ли «туман» именно погодным туманом или любым помутнением обзора (дым, пыль) — не уточнено.</li>\n<li>Можно ли переносить с собой что-то или кого-то при телепортации — не сказано.</li>\n<li>Что происходит, если снять очки, и работают ли они у другого носителя, — не сказано.</li>\n<li>Вселенная в карточке помечена как «неясно».</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["SP-0282--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-06-17</td>\n<td>491164–491165</td>\n<td>w0122</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0282-ochki-zany.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0282--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0282.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
