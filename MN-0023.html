<script>const BASE="";const DOCNAME="Домик с механизмом";
const LEAD="";
const CH=[{"t": "Где находится — в каком мире и в каком его месте", "a": ["S01", "MN-0023-S01", "MN-0023--gde-nahoditsya"], "h": "<p>Вселенная не определена: в карточке стоит «неясно», в переписке принадлежность к какому-либо из миров не названа.</p>\n<p>Объект пришёл из сна Славы, пересказанного 2025-11-18 (id 386293–386296). Внутри сна домик стоит посреди воды — «толи в океане, то ли в море», где после взрыва плота остались трое выживших. Появляется он не постепенно, а разом: «как вдруг словно мир прогрузился и я вижу деревяный домов без окон дверей и трубы».</p>\n<p>Контекст места — мир, захваченный обратными: «Эти обратные по итогу захватывают мир и обычных людей остаються единицы». Домик назван примером того, что обратные строят: «Обратные что-то строили. И нет, не машину для убийства всех и чего подобного. Каждый из них словно строили что-то своё, что-то непонятное».</p>", "r": []}, {"t": "Что собой представляет", "a": ["S02", "MN-0023-S02", "MN-0023--chto-soboy-predstavlyaet"], "h": "<p>Деревянная постройка без окон, дверей и трубы. Описание дословно: «Просто стенка стенка потолок и пол, сделаный не из брёвен, а из досок». Второе имя в карточке — «деревяный домик без окон».</p>\n<p>С задней стороны домика — механизм: «шестерёнки, Какие-то геометрические фигуры и что-то похожее на пушке».</p>\n<p>На домик можно залезть — выжившие «залезли мы на этот домик».</p>", "r": []}, {"t": "Что с ним связано — предметы, механики, силы", "a": ["S03", "MN-0023-S03", "MN-0023--chto-s-nim-svyazano"], "h": "<p>Механизм стреляет. Из домика в сторону плота «что-то с невероятной скоростью влетает» — снаряд не описан, назван только эффект: не попал, но «воды от столкновении с ним поднялась на метра 3».</p>\n<p>Назначение механизма в переписке не объяснено. Единственная рамка, в которую он поставлен, — общая для построек обратных: каждый строит «что-то своё, что-то непонятное», и мир этот описан как «Выживания в мире психов ( обратных), что создают какую-ту хуйню для разных целей».</p>\n<p>Домик отнесён к обратным — в карточке он числится частью этой сущности.</p>", "r": []}, {"t": "Персонажи и события — кто с ним связан и что там происходило", "a": ["S04", "MN-0023-S04", "MN-0023--personazhi-i-sobytiya"], "h": "<p>Обратные — те, кто строит. Их описание в том же куске переписки: люди, которые «больше не люди», при этом «они могли веселиться и смеяться и убивать людей, который не как они». Отличий названо два: азарт в характере и глаза — «глаза были стеклянными что-ли», «второй глаза что были тусклыми что-ли». Про глаза уточнено отдельно: «назвать их мёртвыми был бо перебор, они где-то на уровне живых и мертвых». Автор отмечает, что сам не понимает, почему они не люди: «И я не понимаю почему они не люди. В моих глазах всё конечно ясно, я же видел сон».</p>\n<p>Рассказчик сна — скрывающийся среди обратных выживший. До домика он оказывается на деревянном плоту с другими людьми, купается в воде, чувствует неладное и ныряет под плот; на плот сбрасывают ракету, плот взрывается, выживает трое считая рассказчика.</p>\n<p>Дальше — выстрел из домика. Реакция рассказчика: «Всё валим нахер». Двое других решают плыть к домику — «фиг знает зачем», — и он плывёт с ними.</p>\n<p>Наверху домика — дед: «а там дед с уставшим лицом, но стеклянными глазами». На этом сон обрывается: «Ну и всё я проснулся». Что дед там делает, кто он и связан ли с механизмом — не сказано; стеклянные глаза совпадают с признаком обратных.</p>\n<p>Общее ощущение от места, названное отдельно: «Вообще в этом сне я испытал чувство клаустрофобии. Хотя и был в открытой местности. Словно меня всё завели в тупик, окружили и шанс выбраться нету» — при этом с оговоркой, что убивать рассказчика никто не собирался.</p>", "r": []}, {"t": "Как менялся по версиям — по датам", "a": ["S05", "MN-0023-S05", "MN-0023--kak-menyalsya-po-versiyam"], "h": "<p>Версия одна, 2025-11-18 (окно w0109, id 386293–386296). Объект заведён сразу целиком, как ключевой объект сна и пример «непонятной постройки» обратных. Изменений после этого в переписке нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "MN-0023-S06", "MN-0023--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Назначение механизма не объяснено.</li>\n<li>Чем именно стреляет пушка — не сказано, назван только след от снаряда (подъём воды метра на три).</li>\n<li>Кто такой дед, зачем он в домике, обратный он или нет — не сказано; общий признак стеклянных глаз назван, вывод из него в переписке не сделан.</li>\n<li>Вход внутрь не описан: дверей нет, а что внутри — не сказано; выжившие оказываются наверху.</li>\n<li>Вселенная не определена.</li>\n<li>Почему двое выживших поплыли к домику — «фиг знает зачем», мотив не назван.</li>\n<li>Связь домика с прочими постройками обратных (одинаковые ли они, сколько их) не разобрана.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["MN-0023--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-11-18</td>\n<td>386293–386296</td>\n<td>w0109</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/monumenty/MN-0023-domik-s-mehanizmom.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MN-0023--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MN-0023.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
