<script>const BASE="";const DOCNAME="Бэм";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0378-S01", "PS-0378--proishozhdenie"], "h": "<p>Бэм введён 2026-06-14 (id 489798–489855, окно w0121). Автор персонажа — Слава; он же представляет его репликой «Моё лучшее творение» (id 489803). Имя в переписке записывается в нескольких вариантах: сначала «Бе» (id 489800), затем «Бэм» (id 489801), затем «Бжм» и снова «Бэм» (id 489811–489812).</p>\n<p>В тот же вечер (2026-06-14, id 489874–489899) Миколай спрашивает, как пришла идея, и Слава называет две причины. Первая — прообраз: «Хотел создать персонаж похожего на бена», «Ну бен 10.его прообраз» (id 489881, 489887). Вторая — служебная надобность: «И нужен был надёжный владелец чёрного ящика» (id 489890).</p>\n<p>Разрабатывался не в одиночку: на вопрос Миколая «ты с нейронкой его разработал?» (id 489875) Слава отвечает «Ну да» (id 489878).</p>\n<p>На вопрос «а он будет в этой вселенной?» (id 489849) — ответ «Конечно» (id 489851).</p>", "r": []}, {"t": "Характер", "a": ["S02", "PS-0378-S02", "PS-0378--harakter"], "h": "<p>Задан списком в один заход (2026-06-14, id 489816–489832):</p>\n<ul>\n<li>«Архетип Бена теннисана»;</li>\n<li>«Ребёнок из богатой семьи», «У которого всё есть», «Весь мир у его ног»;</li>\n<li>«Он наглый», «Тщеславный», «Высокомерный»;</li>\n<li>«Эго его больше всего мира»;</li>\n<li>«Он ленивыц», «Подросток»;</li>\n<li>«Что не понимает ценности чего либо».</li>\n</ul>\n<p>Отношение автора к персонажу заявлено прямо: «И он мой любимый персонаж» (id 489832).</p>\n<p>Отдельно закреплена устойчивость его картины мира. Миколай на середине списка спросил «это изб?» (id 489826), и Слава развёл двух персонажей: «Не изб идеалист и его идеалы в итоге падут» (id 489840), «А бэм думающий что весь мир вертится вокруг него. Его идеалы никогда не падут.» (id 489846). Дальше он подтверждает это как авторское решение: «Это я как бог заявляю» (id 489847) и повторяет: «Его идеалы не падут» (id 489850).</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0378-S03", "PS-0378--sposobnosti"], "h": "<p>Собственных способностей Бэма в переписке не названо. Единственное, что за ним закреплено, — владение Чёрным ящиком: «И нужен был надёжный владелец чёрного ящика» (2026-06-14, id 489890), повторно — «Владелец чёрного ящика» (id 489898). Что такое Чёрный ящик и что даёт владение им, в приведённых репликах не сказано.</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0378-S04", "PS-0378--svyazi-s-drugimi"], "h": "<p><strong>Зана.</strong> Союз, описанный 2026-06-17 (id 491165) внутри большого описания Заны. Союз назван реальным: «У него союз с Бэмом. Реальный.» Мотивировка со стороны Заны: «Он не сообщем дурак. Он готов к верному сотруднечеству зная что это в будущем принесёт больше эмоции и даст ему ресурс для его преставления.» Устройство союза: «Союз таков. Бэм спонсирует его, а он веселит его преставоениеми и устраняет тех на кого покажет Бэм.»</p>\n<p>Союз входит в перечень того, что Зана не предаст: «Можно сказать есть три вещи которые он не предаст. Свою организация, союз с Бэмом ( большая часть ресурсов оттуда как бы. Поэтому это глупо ради мимолётно радости, решать себя постоянной радости) И всул.»</p>\n<p><strong>Изб.</strong> Прямое противопоставление по устойчивости идеалов (см. «Характер»): идеалы Изба «в итоге падут», идеалы Бэма «никогда не падут».</p>\n<p><strong>Всул.</strong> Числится в связях записи, но в сохранённых репликах Всул появляется только рядом с Заной (в том же сообщении id 491165: Всул летал рядом и обеспокоенно смотрел на Зану). Связь Всула с самим Бэмом в переписке не описана.</p>\n<p><strong>Чёрный ящик.</strong> Бэм — его владелец, см. «Способности».</p>", "r": []}, {"t": "Как менялся", "a": ["S05", "PS-0378-S05", "PS-0378--kak-menyalsya"], "h": "<p><strong>2026-06-14, id 489798–489855 (окно w0121).</strong> Введён и описан: архетип, набор черт характера, статус любимого персонажа автора, противопоставление Избу, заявление о неломающихся идеалах.</p>\n<p><strong>2026-06-14, id 489874–489899 (окно w0121).</strong> Достроено происхождение задумки: прообраз — Бен 10, вторая причина появления — нужен был надёжный владелец Чёрного ящика; персонаж разрабатывался вместе с нейросетью.</p>\n<p><strong>2026-06-17, id 491165 (окно w0122).</strong> Добавлена одна грань — реальный союз с Заной (спонсирование в обмен на представления и устранение указанных Бэмом людей). Ничего из ранее сказанного не отменяется. В этом окне Бэм больше нигде не разрабатывается.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0378-S06", "PS-0378--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Внешность не описана вообще.</li>\n<li>Собственные способности не названы; неизвестно, есть ли они.</li>\n<li>Чёрный ящик не раскрыт: ни устройство, ни свойства, ни то, почему владелец должен быть «надёжным».</li>\n<li>Семья, названная в описании («ребёнок из богатой семьи»), не показана: ни родители, ни источник богатства не упомянуты.</li>\n<li>Вселенная в базе помечена как «неясно (по дате объявления)».</li>\n<li>Что с Бэмом стало — в переписке не сказано; никакой его судьбы, финала или дальнейших событий не зафиксировано.</li>\n<li>По окну w0122 отмечено: всё остальное про Бэма находится в машинной вставке (id 491167), которая в базу не идёт.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["PS-0378--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-06-14</td>\n<td>489798–489855</td>\n<td>w0121</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-14</td>\n<td>489874–489899</td>\n<td>w0121</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-17</td>\n<td>491165–491165</td>\n<td>w0122</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0378-bem.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0378--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0378.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
