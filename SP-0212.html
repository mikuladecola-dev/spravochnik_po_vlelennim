<script>const BASE="";const DOCNAME="артефакты апостолов";
const LEAD="";
const CH=[{"t": "Механика", "a": ["S01", "SP-0212-S01", "SP-0212--mehanika"], "h": "<p>Механика не описана. В переписке зафиксировано только существование категории — «перс и артефакты» апостолов — как совокупности предметов, привязанных к апостолам. Что артефакты делают, как ими пользуются, дают ли они силы носителю — в переписке не сказано.</p>", "r": []}, {"t": "Носители", "a": ["S02", "SP-0212-S02", "SP-0212--nositeli"], "h": "<p>Отдельные носители не названы. Артефакты отнесены к апостолам как к группе.</p>", "r": []}, {"t": "Как менялась по версиям", "a": ["S03", "SP-0212-S03", "SP-0212--kak-menyalas-po-versiyam"], "h": "<p>Версия одна.</p>\n<p><strong>2025-03-25 (id 310899–310903, окно w0085).</strong> Категория упомянута одной строкой в разговоре о закрытии вселенной. Миколай: «я не буду держаться особенно если для тебя она всё», «это нормально». Ответ Славы (310901): «Ну перс и артефакты. Возможно останутся. Хотя не факт. Возможно я создам вселенную вообще без сил». Реакция Миколая — «охохохо», «интересно».</p>\n<p>То есть артефакты названы не как работающий механизм, а как то, что может перейти в новую вселенную вместе с персонажами — при этом сам переход поставлен под сомнение тут же («Хотя не факт»).</p>", "r": []}, {"t": "Отклонённые варианты", "a": ["S04", "SP-0212-S04", "SP-0212--otklonennye-varianty"], "h": "<p>Прямого отказа нет, но рядом с переносом артефактов в той же реплике выставлена конкурирующая возможность: «Возможно я создам вселенную вообще без сил». В этом варианте артефакты и силы в новую вселенную не переходят вовсе. Какой из двух вариантов принят — в переписке не решено.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "SP-0212-S05", "SP-0212--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Какие именно артефакты входят в категорию — состав не назван, перечня в окне нет.</li>\n<li>Что артефакты делают — не сказано.</li>\n<li>У кого из апостолов какой артефакт — не сказано.</li>\n<li>Перейдут ли артефакты в новую вселенную — осталось нерешённым: сказано «Возможно останутся. Хотя не факт».</li>\n<li>Считаются ли артефакты способностью или предметом — в переписке не разграничено.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0212--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0001.html\">Апостолы (организация апостолов, «благословенные Богом»)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0212--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-03-25</td>\n<td>310899–310903</td>\n<td>w0085</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0212-artefakty-apostolov.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0212--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0212.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["SP-0212-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/SP-0212/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Перечня артефактов нет ни в одном месте, где его можно было бы прочитать. Все четыре записи, где он должен лежать, — служебные и без статей: <code>SL-0051</code> «Каталог: благословенные, враги, грехи, оружие, артефакты» (шесть ссылок, 9 834), <code>SL-0053</code> «Список персонажей вселенной» с отдельным разделом «Артефакты» (шесть ссылок, 20 313), <code>SL-0090</code> «Реестр персонажей и сил», тоже с разделом «Артефакты» (четыре ссылки, 5 492), <code>SL-0089</code> «Список категорий сил», где «Владельцы артефактов» стоят отдельной категорией наравне с благословенными и арбетарами (четыре ссылки, 1 753). Двадцать ссылок в сумме и ни одной статьи. Эта статья говорит «состав не назван, перечня в окне нет» — перечень заведён четырежды и не раскрыт нигде.</p>\n<p>Второе — <code>SL-0054</code> «Список 12 апостолов»: 234 052 знака базы, статьи нет, три ссылки. Половина названия этой статьи — «апостолов», и группа, к которой артефакты приписаны, разбирается именно там.</p>\n<h3>С чего начать</h3>\n<p>В базе, и не за составом, а за тем, чтобы понять, одна это категория или четыре. Про артефакты во вселенной уже написаны три статьи, и ни одна не привязана сюда: <code>SP-0047</code> «Артефакты» (статья есть, 24 897 базы, тянется с 2024-01-30 по 2025-10-20), <code>SP-0229</code> «Артефакты с символикой» (6 721) и <code>SP-0192</code> «Артефакт-медиатор» (4 954). В <code>SP-0229</code> артефакт получает происхождение — «объект, что имеет силу правителя», побочный продукт неудавшегося творения мира, — и правило раскрытия мощи: лучше всех её раскрывает обычный человек, а переполненные силой (благословенные, альфы, арбетары, фантазёры) не могут. Это 2025-05-31, id 331636, окно w0099 — через два месяца после здешней реплики и в другой ветке разговора. Если артефакты апостолов — это те же артефакты, то механика у них уже есть и её надо просто подвести; если не те же — это надо где-то сказать.</p>\n<p>Нерешённый вопрос про переход в новую вселенную тоже закрывается в базе, а не в архиве. Смотреть три записи от 2025-09-17, у всех ноль ссылок и нет статей: <code>MR-0148</code> «Новая вселенная (безымянная, переработка „Апостола“)» (3 372), <code>MR-0156</code> «Запрет на творцов, артефакты, ауру и энергию» (4 121), <code>ID-0158</code> «Творцы» (3 644). Название второй прямо содержит ответ на «Возможно останутся. Хотя не факт»; сверить надо, та ли это новая вселенная, о которой шла речь в марте. Рядом <code>ID-0152</code> «новая вселенная Славы» (1 797, статьи нет).</p>\n<p>В архив — только если после сверки останется разрыв: окно w0085, 2025-03-25, вокруг 310899–310903, читать целиком до и после, потому что реплика про артефакты стоит внутри разговора о закрытии вселенной и сама по себе не тема, а следствие.</p>\n<h3>Как менялось</h3>\n<p>Дата в статье одна, и внутри неё всё уместилось: заявили и в той же реплике поставили под сомнение — «Возможно останутся. Хотя не факт», — и тут же выставили конкурирующий вариант, «Возможно я создам вселенную вообще без сил». Утверждение, оговорка и его отмена стоят в одном сообщении, 310901. Дальше линия продолжается уже без слова «апостолы»: 2025-05-31 — устройство артефактов вообще (<code>SP-0229</code>), 2025-09-17 — запись про запрет артефактов в новой вселенной (<code>MR-0156</code>). Сама эта категория к ним не подключалась.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Откуда артефакт у апостола берётся. Для второй вещи, привязанной к апостолам, источник назван точно: благословение даёт правитель рая, число ограничено, у каждого — своя уникальная способность. Для артефактов в целом источник тоже назван — правитель, наделивший объект избыточной силой при попытке создать мир (<code>SP-0229</code>), а для артефактов с символикой отдельно оговорено, что их не создавал никто. Для «артефактов апостолов» — тех, что перечислены рядом с персонажами как то, что переходит в новую вселенную, — правила того же рода нет: неясно, приданы ли они вместе с благословением, найдены, отняты или просто есть.</p>\n<h3>Отклик</h3>\n<p>Цепляет не сама категория — за ней пусто, две строчки, — а то, при каких обстоятельствах она всплыла. Разговор идёт о том, что вселенная для Славы кончилась; Миколай говорит «я не буду держаться особенно если для тебя она всё», «это нормально». И в этот момент автор перечисляет, что он бы всё-таки вынес: «Ну перс и артефакты. Возможно останутся». Список из двух пунктов, и второй — предметы. Не мир, не система сил, не сюжет — люди и вещи. Это довольно честная опись того, что человек считает своим в собственной выдумке, и она тем убедительнее, что сделана не как манифест, а вскользь, при закрытии. Ответ Миколая — «охохохо», «интересно» — тут единственно возможный: сказано много, а разобрать нечего.</p></div>", "r": []}];</script>
