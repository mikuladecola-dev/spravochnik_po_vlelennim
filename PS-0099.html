<script>const BASE="";const DOCNAME="Внешность Зурбона";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0099-S01", "PS-0099--proishozhdenie"], "h": "<p>Не самостоятельный персонаж, а часть карточки персонажа Зурбона: блок описания внешности, выделенный в отдельную запись. Появился 2024-06-21 (окно w0038) в составе полной карточки, которую Миколай выложил одним сообщением (id 185096). В тот же день, через четыре часа, дополнен рисунками (id 185194–185201).</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0099-S02", "PS-0099--vneshnost"], "h": "<p>Текстовое описание (2024-06-21, id 185096), дословно:</p>\n<p>«Цилиндр на голове, медный монокль на левом глазу. Одет в чёрный фрак, галстук в стиле стимпанк, на руках множество перстней и браслетов с реальным механическим функционалом, брюки подвернуты и выглядят как шорты, на икрах татуировки дырок вы коже, которые трипофобов люто пугают»</p>\n<p>По пунктам:</p>\n<ul>\n<li>цилиндр на голове;</li>\n<li>медный монокль на левом глазу;</li>\n<li>чёрный фрак;</li>\n<li>галстук в стиле стимпанк;</li>\n<li>на руках множество перстней и браслетов «с реальным механическим функционалом» — то есть механика в них рабочая, а не декоративная;</li>\n<li>брюки подвёрнуты и выглядят как шорты;</li>\n<li>на икрах татуировки дырок в коже, «которые трипофобов люто пугают».</li>\n</ul>\n<p>Возраст по карточке — 34.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0099-S03", "PS-0099--harakter"], "h": "<p>В том же сообщении карточки (id 185096): «очень добрый и отзывчивый, любит помогать людям, особенно тем кто шарит за технику. В бою немного конченый, цветы блять выращивает чтобы на них похоронить противника.»</p>\n<p>Любит: «морских губок, стимпанк и технарей». Не любит: «романтику, птиц (в том числе в еде)».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0099-S04", "PS-0099--sposobnosti"], "h": "<p>Из той же карточки — «контроль и созидание костей».</p>\n<p>Характеристики: сила 7, ловкость 10, меткость 3, скорость 5, контроль 7.</p>\n<p>Оружие: «маленькая секира размером с предплечье». Инструмент: «мешок с инвентарём на пол гектара вместимостью».</p>\n<p>Приёмы, дословно:</p>\n<ol>\n<li><strong>Костная мука</strong> — «дробление костей в муку и последующее разпыление на растения увеличивает их способность к росту. Иногда они превосходят свои возможности вырастая за секунду до колоссальных размеров, что помогает ему в бою или для поднятия на высоту».</li>\n<li><strong>Суставная связка</strong> — «созданные кости он может соединять между собой суставами для создания неких цепей или может так кости приклеивать к чему либо например к секире».</li>\n<li><strong>Манипуляция собственными костями</strong> — «увеличение, уменьшение, улучшение гибкости. Может как росомаха когти сделать пхех».</li>\n</ol>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S05", "PS-0099-S05", "PS-0099--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2024-06-21 (id 185096, окно w0038).</strong> Текстовое описание одежды и татуировок в составе полной карточки Зурбона.</p>\n<p><strong>Версия 2 — 2024-06-21, 15:05–15:07 (id 185194–185201, окно w0038).</strong> Миколай прикладывает рисунки: «Такая примерно у него внешка», «Такое тату». О процессе: «Много попыток было, единственная норм».</p>\n<p>Слава на первый рисунок: «Я думал старик с длинными усами». Миколай отвечает: «Ну ему 34», «Норм, ещё молодой». Затем присылает другой вариант: «На скорее тогда так», «Тут уже возраст хорошо передан». То есть рисунков внешности как минимум два, и второй Миколай сам считает более точным по возрасту.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0099-S06", "PS-0099--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Сами изображения в текст переписки не входят — доступны только подписи к ним. Что именно нарисовано и чем второй вариант отличается от первого, кроме «возраст хорошо передан», не сказано.</li>\n<li>Цвет волос, телосложение, лицо — не описаны ни в тексте, ни в подписях.</li>\n<li>Какая именно механика в перстнях и браслетах — не названа.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["PS-0099--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-06-21</td>\n<td>185096–185096</td>\n<td>w0038</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-06-21</td>\n<td>185194–185201</td>\n<td>w0038</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0099-vneshnost-zurbona.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0099--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0099.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
