<script>const BASE="";const DOCNAME="Междумирцы";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0186-S01", "PS-0186--proishozhdenie"], "h": "<p>Междумирцы — существа из других миров. В переписке они появляются 2025-01-22 (id 283706) не сами по себе, а через того, кто их ненавидит: Слава описывает персонажа-воплощение гнева и в перечне его свойств пишет «Тот кто да мозга костей ненавидит междумирцов». Из этого же сообщения: «Принципиальному, прямолинейному и жестокому / Он воплощения гнева / Прототип защитника только молчиливова / Бэтмен с жестокостью и гневом», и следом — «Тот кто оторвёт крылья ангелам, переломает кости своим братьям и сёстрам».</p>\n<p>Собственного описания — откуда они, как попадают в мир, что такое «междумирье» — в переписке нет. Название держится на самом слове: те, кто из других миров.</p>\n<p>Имя встречается в нескольких написаниях, авторы его не унифицировали: «междумирцы» (283706), «чужамириц» (284249), «чудемириц» (284280), «междумирцев» (284290).</p>", "r": []}, {"t": "Характер", "a": ["S02", "PS-0186-S02", "PS-0186--harakter"], "h": "<p>Отдельно как черта характера ничего не названо. Единственное, что о них известно из отношения к ним: воплощение гнева ненавидит их «да мозга костей».</p>", "r": []}, {"t": "Связи с другими", "a": ["S03", "PS-0186-S03", "PS-0186--svyazi-s-drugimi"], "h": "<p>Связь с воплощением гнева односторонняя и заявлена только со стороны воплощения: оно их ненавидит. Причина ненависти в переписке не названа.</p>\n<p>Междумирцы не отдельная строка каталога, а признак, скрытый внутри уже существующего списка врагов. Каталог, к которому относится загадка (2025-01-24, id 284278), выглядит так:</p>\n<p>Благословенные: Имитатор 🗡 (ветреной 🌬; электро ⚡️; птичка 🔈), Агрегат 🫥 (волк 🐺; экстримал ⏳; страдалец 🔪), Разрушительнитца 💪 (огненная 💥), Палач ☠️, Защитник 🤬 (ангел 👼), Дитя света ✨ (Теневые братья 🌘), Бессмертный выродок 🤪 (<a href=\"PS-0184.html\">Бессмертный выродок</a>), Хулиган 💎 (слайм 7️⃣), Вибрация 🫨, Ученица???</p>\n<p>Враги: Доспехи 🏳️, Козлиха 🪓, Сестра 🚺, Огненный снайпер 🔥, Охотник 🔪, Божество 😵, Убийца 🩸, Зонтик 🩸, Леший 🌳, Пар 💨, Садистка ✂️, Насекомое 😡, Старик ➡️⬅️, Эльф 🌬.</p>\n<p>Семь грехов в том же сообщении: Гнев 😡 (сила) — <a href=\"PS-0177.html\">Гнев (грех)</a>, Похоть 😵‍💫 (контроль разума), Зависть 👹👹 (полной копирование), Алчность ♾ (всё моей), Гордыня 👑, Чероугодия ◼️ (поглощения), Лень 😴 (контроль территории).</p>\n<p>Идеи, приписанные к тому же списку: Чёрный ящик, озеро перерождения, корень желаний.</p>", "r": [["Бессмертный выродок", "PS-0184.html"], ["Гнев (грех)", "PS-0177.html"]]}, {"t": "Как менялся", "a": ["S04", "PS-0186-S04", "PS-0186--kak-menyalsya"], "h": "<p><strong>2025-01-22 (id 283706–283712).</strong> Первое появление: междумирцы — те, кого воплощение гнева ненавидит до мозга костей. Больше в этот день о них ничего не сказано. В том же куске переписки Слава решает судьбу благословенных дьяволом: «Вообще благословенный Богом есть общая чёрта виде белых глаз при активаций благословения / И я эти глазами наделил всех тех который должны быть благословений дьяволом, при этом и менять я ничего не хочу потому что мне и так нравится / Поэтому я думаю вообще убрать благословенных дьяволом». Дальше — «Тогда благословенных будет 21», «Ну конечно можно оставить и 42», «Ну я не знаю», и вопрос Миколаю: «Как думаешь сколько должно быть благословенных Богом 21 или 42». К междумирцам этот счёт напрямую не привязан.</p>\n<p><strong>2025-01-24, утро (id 284249–284292).</strong> Слава превращает междумирцев в загадку: «Угадай кто из врагов чужамириц». Миколай отвечает с урока, отгадывать не начинает сразу. На вопрос, сколько их, Слава отвечает: «Их там больше», «Где-то 7», «Не считал». Миколай уточняет — «междумирцев?» — Слава: «Да». Первые предположения Миколая в этом заходе: «либо эльф либо доспехи», сразу же поправка «ой, не эльф». Разговор обрывается: «ну в тогда дома подумаю а то я на урок иду меня убьют щас».</p>\n<p><strong>2025-01-24, вечер (id 284351–284367).</strong> Миколай отказывается от угадывания как от процесса: «я не хочу гадать», «я не знаю как думать», «у меня нет предположений» — и просто перечисляет: «насекомое, козлика, божество, зонтик», «пускай так», «и эльф ещё», «и доспехи». Слава правит список: «Отсюда только зонтик убрать», затем «И леший / Все». Формулировка про лешего в списке Миколая отсутствовала — Слава вычёркивает и его.</p>\n<p>Тем самым после правки от предложенного остаются: насекомое, козлиха, божество, эльф, доспехи. Подтверждения, что это и есть ответ, Слава не даёт; он только убирает лишнее из перечня Миколая.</p>\n<p>В этом же куске Миколай спрашивает про глубину проработки списка: «а ты рил всех персов продумал? ну которых написал». Слава: «Ну только вид и способность и плюс минус характер».</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "PS-0186-S05", "PS-0186--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Точный ответ, кто именно из врагов междумирец, внутри окна w0072 не дан. Слава называет число — «где-то 7», «не считал» — и вычёркивает зонтика и лешего, но список не закрывает.</li>\n<li>Число «около семи» самим Славой обозначено как неточное.</li>\n<li>Что такое междумирье, откуда междумирцы приходят и чем отличаются от местных существ — в переписке не сказано.</li>\n<li>Причина ненависти воплощения гнева к междумирцам не названа.</li>\n<li>Не сказано, признак ли это только для врагов или среди благословенных тоже могут быть междумирцы: загадка ставится строго «из врагов».</li>\n<li>Написание имени не унифицировано; какой вариант считается основным, авторы не оговаривали.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0186--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0177.html\">Гнев (грех)</a>, <a href=\"PS-0184.html\">Бессмертный выродок</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0184.html\">Бессмертный выродок</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0020.html\">Междумирцы</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0186--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-01-22</td>\n<td>283706–283712</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-24</td>\n<td>284249–284292</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-24</td>\n<td>284351–284367</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0186-mezhdumircy.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0186--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0186.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0186-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0186/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Загадка не закрывается не потому, что Слава не сказал ответа, а потому, что отвечать нечем: из пяти имён, оставшихся после его правки, четыре в справочнике пусты. Козлиха, Доспехи, Насекомое — сущностей нет вообще: ни статьи, ни записи в базе, ни id. Эльф раздваивается: <code>PS-0212</code> «Эльф с ветряным мечом» (одна ссылка, статья есть, база 41 260) и <code>PS-0218</code> «Эльф (чужемирец)» (одна ссылка, статья есть, 5 563) — который из них враг из каталога, нигде не установлено, хотя во втором имени слово «чужемирец» стоит прямо. Единственный из пятёрки с материалом — Божество <code>PS-0193</code> (три ссылки, статья есть, база 4 074), и там сказано, что персонаж придуман раньше, а в окне только отсылка «помнишь его».</p>\n<p>Следом — каталог, из которого эта пятёрка вынута: <code>SL-0051</code> (шесть ссылок, статьи нет, база 9 834) и <code>SL-0053</code> (шесть ссылок, статьи нет, 20 313). На <code>SL-0051</code> опираются шесть групповых статей, включая <code>GR-0020</code> «Междумирцы». Плюс <code>SL-0089</code> «Список категорий сил» (четыре ссылки, статьи нет, база 1 753) — там «Чужемирцы» стоят отдельной категорией сил мира, то есть категория в своде уже есть, но не связана с этой статьёй.</p>\n<h3>С чего начать</h3>\n<p>Сначала база, потом архив.</p>\n<p>В базе: <code>SP-0163</code> «Благословение», версия 10, id 283717–283748, 2025-01-22 — прямое продолжение того же утра. Там реплика Славы про воплощение гнева: «Воплощений гнева / Непробиваемому чудовище / Страх всех чужемирцов» (283728). То есть в тот же день междумирцы названы вторым словом и в другой формуле — не «ненавидит», а «страх всех», — и это в статью не попало. Дальше <code>MR-0100</code> «Чужемирцы и аномальные люди» (две ссылки, статья есть, база 3 285) и <code>PS-0202</code> «Чужемирец (герой истории про сломанное солнце)»: если «чужамириц» и «чужемирец» — одно слово, то описание категории уже написано, просто под другим именем. Проверять надо это, а не искать заново. По написанию — <code>SL-0091</code> «Хронология историй Славы», w0095, 2025-05-15, id 326424: «Не вторая междумирец», слово к маю живёт уже как название истории.</p>\n<p>В архив — за одним: подтверждением загадки. Смотреть после 284367, вечер 2025-01-24 и ближайшие дни, w0072 и дальше. Слава вычеркнул зонтика и лешего, но «да, эти» не сказал ни разу; либо подтверждение есть чуть позже, либо разговор просто кончился, и это тоже надо зафиксировать.</p>\n<h3>Как развивалось</h3>\n<p>2025-01-22 — появляются не как категория, а как объект чужой ненависти: строка в описании воплощения гнева. 2025-01-24, утро — Слава превращает их в игру: «Угадай кто из врагов чужамириц», число даёт на глаз («Где-то 7», «Не считал»), Миколай уходит на урок. 2025-01-24, вечер — Миколай отказывается от процесса угадывания («я не хочу гадать», «я не знаю как думать») и просто перечисляет; Слава правит перечень вычёркиванием и не подтверждает остаток. Дальше в окне не возвращаются. По базе слово всплывает в мае 2025 (<code>SL-0091</code>, w0095) — уже как номер истории, не как признак существ.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для благословенных признак опознания назван прямо: «общая чёрта виде белых глаз при активаций благословения». По нему их видно снаружи, и на нём же Слава строит рассуждение о благословенных дьяволом. Для междумирцев названо число — «где-то 7» — и не названо ничего, по чему их можно опознать: ни внешнего признака, ни механики, ни правила, кто считается междумирцем. У одной категории метка без счёта, у другой счёт без метки. Загадка при этом требует именно метки — угадывать предлагается по признаку, которого нет.</p>\n<h3>Отклик</h3>\n<p>Сильное здесь — сам жанр. Слава не описывает категорию, он прячет её в уже написанный список и предлагает соавтору её оттуда достать. Это работает как проверка: если междумирцы действительно чем-то отличаются, отличие должно быть видно в том, что про этих врагов уже сказано. Отгадка не сошлась — и это честный результат теста, а не провал разговора. И реплика Миколая «я не хочу гадать / я не знаю как думать» — редкий момент, когда один из двоих прямо говорит, что не видит в чужом материале опоры для догадки; он не притворяется, что понял, а вываливает список и отдаёт правку обратно. Оба хода читаются лучше, чем любая версия ответа.</p></div>", "r": []}];</script>
