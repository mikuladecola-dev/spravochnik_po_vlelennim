<script>const BASE="";const DOCNAME="Пернатые";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0174-S01", "MR-0174--ustroystvo"], "h": "<p>Пернатые — раса (в переписке она же группа) мира Оам, названная одной строкой в общем перечне сторон мира: «Пернатые (Серафим, Пераги и кто-нибуть ещё)» (2025-11-17, id 385768). Состав задан открытым списком: два имени и незакрытая позиция «кто-нибудь ещё».</p>\n<p>В перечне пернатые стоят в блоке, открытом словами «Ну и дальше расы и организации который равны по силе с друг другом» — то есть по силе они наравне с детьми мирового древа, пророками каменными (<a href=\"MR-0169.html\">Пророки каменные</a>), Азуриэль, группировкой сестры, правительственной организацией по контролю (<a href=\"MR-0171.html\">Правительственная организация по контролю</a>), церковью с паладинами, организацией Виктора, орденом для убийства котов, вампирами и аскизами. Выше стоят коты и апостолы 21.</p>\n<p>Второе название, появившееся 2025-12-06 — «клан крылатых (Серафим)» (id 393305). То есть на Серафима один раз указано как на клан крылатых.</p>\n<p>Никакого устройства помимо этого — где живут, как организованы, чем владеют — в переписке не названо.</p>", "r": [["Пророки каменные", "MR-0169.html"], ["Правительственная организация по контролю", "MR-0171.html"]]}, {"t": "Население", "a": ["S02", "MR-0174-S02", "MR-0174--naselenie"], "h": "<p>Названы двое: Серафим и Пераги. Третья и дальнейшие позиции оставлены открытыми — «и кто-нибуть ещё».</p>\n<p>Никаких описаний Серафима и Пераги в этих окнах нет — только имена. В окне w0109 отмечено прямо: «Кроме имён — ничего».</p>", "r": []}, {"t": "Место во вселенной — как связан с другими мирами", "a": ["S03", "MR-0174-S03", "MR-0174--mesto-vo-vselennoy"], "h": "<p>Часть вселенной Оам.</p>\n<p>Роль в конфликте назначена 2025-12-06 (id 393305): «Вообще промежуточными злодеями будут / Дети мирового древа / И клан крылатых ( Серафим)». Следом список промежуточных злодеев расширяется: «Ну или церкви, да и люди иногда» (id 393306) и «Да еще и Виктор, что воскрешает трупы, ну точнее делает из них марионеток» (id 393308). При этом Слава отделяет от них главных: «Ну вот у меня в голове два основных злодея» (id 393309), а Миколай переспрашивает: «котов?» (id 393310). Кто эти два основных злодея — в переписке не назван.</p>\n<p>Связей пернатых с конкретными другими расами и организациями (союзов, вражды) не названо.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0174-S04", "MR-0174--kak-menyalsya-po-versiyam"], "h": "<p><strong>2025-11-17 (окно w0109, id 385768–385769).</strong> Пернатые заведены в общем перечне сторон мира одной строкой: «Пернатые (Серафим, Пераги и кто-нибуть ещё)». Состав открытый, третий участник не придуман.</p>\n<p><strong>2025-12-06 (окно w0112, id 393286–393290).</strong> Перечень повторён дословно, строка про пернатых не изменена — те же Серафим, Пераги, «кто-нибуть ещё».</p>\n<p><strong>2025-12-06, чуть позже (окно w0112, id 393304–393310).</strong> Клан крылатых (Серафим) отнесён к промежуточным злодеям — вместе с детьми мирового древа, а следом добавлены церкви, «люди иногда» и Виктор.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0174-S05", "MR-0174--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Кто ещё входит в пернатых — не решено (третья позиция «кто-нибуть ещё» так и не закрыта).</li>\n<li>Про Серафима и Пераги, кроме имён, ничего не сказано: ни внешности, ни способностей, ни отношений между ними.</li>\n<li>Соотношение названий «пернатые» и «клан крылатых» не проговорено: сказано только, что клан крылатых — это Серафим.</li>\n<li>Где живут пернатые, как организованы — в переписке не сказано.</li>\n<li>Кто такие «два основных злодея», от которых отделены промежуточные — не названо.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0174--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0169.html\">Пророки каменные</a>, <a href=\"MR-0171.html\">Правительственная организация по контролю</a></li>\n<li><strong>Упомянут в мирах:</strong> <a href=\"MR-0169.html\">Пророки каменные</a>, <a href=\"MR-0171.html\">Правительственная организация по контролю</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0065.html\">Пернатые (клан крылатых)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0008.html\">Оам</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0174--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-11-17</td>\n<td>385768–385769</td>\n<td>w0109</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-06</td>\n<td>393286–393290</td>\n<td>w0112</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-06</td>\n<td>393304–393310</td>\n<td>w0112</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0174-pernatye.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0174--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0174.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
