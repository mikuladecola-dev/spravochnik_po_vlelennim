<script>const BASE="";const DOCNAME="Артём";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0257-S01", "PS-0257--proishozhdenie"], "h": "<p>Артём (<a href=\"PS-0257.html\">Артём</a>) — рассказчик двух брошенных историй Славы, скинутых в переписку одним заходом 21 апреля 2025 года (2025-04-21, id 320973–320988, окно w0088). Обе истории отнесены к вселенной «Нимб» по дате объявления.</p>\n<p>Появление персонажа в переписке не было разработкой замысла: Слава предложил «Скинуть заметки брошенных истории?» (320973), Миколай ответил «получается ты забросил?» и «ну кидай» (320974–320975). После этого Слава выложил два текста подряд, подписав их «Первая» (320980) и «Вторая» (320982). Обсуждения текстов после выкладки нет — Миколай ограничился репликой «спасибо что скинул» (320988). Таким образом весь материал о персонаже — это сами тексты историй, без авторских пояснений.</p>\n<p>Имя названо только в первой истории: «Я  Артем. Думаю не надо здесь фамилии и отечество моего. Просто Артём и всё». Фамилия и отчество, соответственно, не названы намеренно — как отказ рассказчика их сообщать.</p>\n<p>Во второй истории рассказчик по имени не назван вовсе. То, что это тот же Артём, в переписке прямо не сказано.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0257-S02", "PS-0257--vneshnost"], "h": "<p>Описания внешности в обеих историях нет — обе написаны от первого лица, и рассказчик себя не описывает.</p>\n<p>Единственная деталь внешнего вида — обувь во второй истории: «вода уже проникает в кроссовки, который были слегка большими для меня. Ведь это были не мои кроссовки, а парня. Нет, нет. Сейчас не до этого» (320985). Чьи это кроссовки и что за «парень», в переписке не сказано; рассказчик сам обрывает мысль.</p>\n<p>Косвенно про возраст: студентка Ника обращается к нему «эй дядь, что там?», на что он возмущается — «че \"дядь\" Ты серьёзно, какой я дядь?» (320984). Никакой другой привязки к возрасту нет.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0257-S03", "PS-0257--harakter"], "h": "<p>Первая история и вторая дают разные срезы.</p>\n<p><strong>В первой истории</strong> (320979) Артём подан как обычный семейный человек. Он неуверен в собственной оценке произошедшего: «Моя жизнь сломалось, а я не пойму, кто в этом виноват. То ли я, то ли.... Ладно зачем тянуть резину». О браке: «Был я женат. Жена была красна, как девица из сказок. Да и характерами мы сошлись. И вроде брак хороший. Хотя утверждать не буду . Да я вообще сейчас вообще ни в чем не уверен».</p>\n<p>Отношение к будущему ребёнку — счастье пополам со страхом: «Чуство переполняли меня. У меня будет ребенок. Мой, именно мой. Не знаю, как всё я был счастлив и готов был танцевать». И тут же: «Хотя я всё равно боялся. Как бы первый ребенок. Не сделаю я где нибудь ошибку при его воспитание. Дам ли я ему достаточно внимания. Да ещё и страхи, что беременность, как то неправильно пройдёт. Выкидыш, мутация или типа того. Не разбираюсь я в этом».</p>\n<p>Отдельно отмечена его манера говорить о дочери как о сделанном: «Хм.. Моя дочь. Первая, что я создал. Можно ли вообще так выражаться».</p>\n<p><strong>Во второй истории</strong> (320983–320987) характер расписан подробно и другой стороной.</p>\n<p>Одержимость желанием: «Скажите вы чего нибудь желали. Настолько сильной, что не могли спать днями. Только думали о этой мечте. Не ели, не спали. И были готовы убить, даже самым жестоким способом. Дабы ещё подумать, помечтать. Но реальность жестока. Очень жестока к человеку, который мечтает. А я был таковым».</p>\n<p>Готовность действовать на ничтожном шансе: «Но хотя бы на 0,000001% это могло быть реальным. Жалкий процент но он всё ещё есть. И я не мог не прийти туда, зная что есть шанс».</p>\n<p>Проговаривание мыслей вслух — названо прямой чертой: «Здесь стоить уточнить, что я тот тип людей, который чуть-ли не все мысли говорит в слух. Тем более когда он возбуждён».</p>\n<p>Смех в опасных и напряжённых местах. Когда толпа обернулась на его реплику про одно-единственное желание: «Я едва здерживался от смеха. Нет вру. Я засмеялся и смех мой был истеричным. А глаза смотревший на меня с гневом, яростью и непониманием. Лишь больше меня смешили».</p>\n<p>Отсутствие угрызений совести при устранении конкурентов: «Моя цель проста и понятна. Исполнить мечту. И если правда, что желания может загадать лишь один. То нужно сократить число попавших туда. Поэтому без каких-либо угрызений совести. Я толкал людей, ранял их, ставил подсечки. Они падали и в их глазах был лишь ужас. Они тоже желалали, что-то очень сильно. Но были не осмотрительный».</p>\n<p>Расчёт на спутников как на расходный материал — при этом высказанный про себя, а не вслух: «Ну они могут быть отвлекающим маневром. В полне. Пока медведь будет их есть. Я смогу быстро свалить».</p>\n<p>Шутки, которые никто не поддерживает. На вопрос Паши, сработает ли план: «конечно! Сработает, а если нет то мы всего лишь умрем - ответиь я улыбаясь». Про «супергруппу»: «Да-да мы супер группа. Команда сильней чем рейнджеры- не кто не оценил. Лишь построили раздраженый лица. Хотя нет. Вот Паша улыбается и слегка смеётся. Ну хоть, кто-то в юморе разбирается». Игорь прямо говорит ему: «знаешь шутки твои мне вообще не подушей». Отдельно — розыгрыш с фонариком: он делает вид, что потерял фонарик («сказал я подавленным голосом»), а затем светит Игорю в лицо вторым, «ели сдерживая смех».</p>\n<p>Склонность издеваться над спутниками ради реакции: когда под ногами начали булькать тела, «Я то прекрасно понимал, что там. Но другим  нужно было визуальной доказательство. Я решил над ними поиздеваться и поэтому специально светил вверх. Так чтобы не было видно пола».</p>\n<p>При этом он несёт Пашу на плече, когда у того разбита нога, и настаивает на этом вопреки отказу мальчика: «Он отнекивался. Говоря что и сам дойдет. Но я был твёрд». В затопленной комнате он же берёт Пашу и держит повыше, чтобы тому дольше хватало воздуха.</p>\n<p>Своя логика вместо проверки: «-да не бойся ты. Ты если, что в окно полежишь и выживешь-успокоил его я. Точнее я так думал. Но какая чёрту разница. Раз я так думал. Значит так и есть».</p>\n<p>Предусмотрительность в мелочах: фонарик взят заранее — «который я забоговременно взял с собой. Не дурак же, что бы не догадаться взять фонарик в ночь». Позже отмечено, что он единственный в группе с фонариком, у остальных были телефоны, которые сломались в воде.</p>\n<p>Привычка к трупам, названная прямо: «Меня, который лежал на выпотрошенном теле без кожи. Падением я сломал ему ребро.  И лицом нырнул ему в его органы. Было мерзко. Но привычно. Я привык быть в чужих органах и крови. Это так навевает воспоминания. Мой шедевр, где-то там, а я здесь, чтобы зделать, то что нужно». Что такое «мой шедевр», в переписке не объяснено.</p>\n<p>Тоска по дому, ставшая для него неожиданностью: «\"Я то же хочу домой\"  Удивился я собственной мысли. Тоска нахлынула на меня. Тоска этого место залазила мне словно в грудь. Захватывая моей сердце». И далее: «\"Что я здесь делаю? Зачем я здесь? Я хочу домой? Тёплый дом, где ждут меня жена и дочь. В места которая я могу назвать родным. Я не хочу здесь быть\"».</p>\n<p>Самооценка, данная в момент атаки «Холода»: «Ведь \" Холод\" Не знал какой же я. Не знал мою извращенную натуру. Не знал, что я не сожалею».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0257-S04", "PS-0257--sposobnosti"], "h": "<p>Отдельных сверхспособностей у Артёма в текстах не заявлено. Зафиксированы два свойства, работающие как способность по факту.</p>\n<p><strong>Невосприимчивость к «Холоду».</strong> «Холод» пробирается в него через тоску по дому — сначала «Мои глаза начали гореть. Наливаться свинцом о жалость к себе», затем «Я лёг в позе эмбриона. В надежде согреть себя же,  чтобы тот холод в сердце не распространялся дальше. Но он распространялся заполоная лёгкий \"Я хочу домой. Хочу уйти\". Этот холод спускался всё ниже. Касаясь уже не сердце, а как будто бы самой моей естество».</p>\n<p>Атака оканчивается провалом «Холода»: «Но это было ошибкой. Ведь \" Холод\" Не знал какой же я. Не знал мою извращенную натуру. Не знал, что я не сожалею. Он думал, что найдёт уязвимость. Но сам же утонул в безумий красок, волн, взрывов. Там был фестиваль, всё взрывалось. Было цветной море. Холоду здесь было не месту». Механика — «Холод» ищет уязвимость через сожаление, а у Артёма сожаления нет, и вместо уязвимости он находит внутри него «фестиваль». Проснулся Артём после этого в той же комнате.</p>\n<p><strong>Навык убийства.</strong> Чёрного гуманоида он снимает бесшумно и с одного захода: «Я встал едва слышно. Этот гуманоид был ко мне спиной . Чёрная спина его было. Хоть он был и тощим. Но спина выглядела сильной. Но даже так. Ночь свободно прошёл между лопаток. Он заревел. Я схватил его за шею и держал нож в спине. В таком положении он ничего не сделает. Лишь махал руками, который не могли до меня до тянуться. Он не долго барахтался. Тело его стало мягким и податливым». Нож у него был при себе; откуда и зачем — не сказано.</p>\n<p>Снаряжение: два фонарика, нож, взятые заранее.</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0257-S05", "PS-0257--svyazi-s-drugimi"], "h": "<p><strong>Жена.</strong> Первая история: «Жена была красна, как девица из сказок. Да и характерами мы сошлись». Мяса почти не ела — «Нет. Она не была вегетарианкой. Просто не любил. И мало кушало его». На седьмом месяце беременности впервые просит купить много мяса, вписав в список «Малина, мороженное, хлеб, куринный ножки 4 кг». Дома выхватывает пакет у него из рук и уходит на кухню, «Ни привет, ни здрасти», где «буквально разрывает пакет». На вопрос «эй с тобой всё хорошо?» она разворачивается к нему лицом — на этом текст первой истории обрывается. Имя жены не названо.</p>\n<p><strong>Дочь.</strong> Первенец, ещё не родившаяся. «Мы ждали ребенка. Первенца. Хм.. Моя дочь. Первая, что я создал». Во второй истории дом описан как место, «где ждут меня жена и дочь» — то есть дочь там уже есть.</p>\n<p><strong>Ника.</strong> Студентка, «одетая в джинсы и в рубашку. Волосы у ниё покрашены, желто-розовый или как то так». Держится с ним резко и пренебрежительно, называет «дядь», требует рассказать, от чего он бежал; позже смягчается — «можетъ скажешь уже, что там было. От чего ты убегал- сказала уже более мягким тоном». Именно она подхватила упавший фонарик и после этого не отдаёт его Артёму: «Я хотел его забрать. Но она ловко убирала свою руку». Артём отмечает её спокойствие у трупа: «Больше меня удивило как Нико так спокойно подошла». В финале второй истории её тащит за ногу чёрный гуманоид; Артём убивает гуманоида, Ника остаётся без сознания.</p>\n<p><strong>Игорь.</strong> Клерк, «высокий мужчина в очках, одетый в пиджак. Не смотря на длинный рост был худым». Первым представляется и первым пытается снять напряжение — «нам не зачем ругаться. Давайте, что нибудь другой обсудим. Например как нас зовут. Меня зовут Игорь». Попал на корабль по письму от организации «нимб». Пытается выбить железную дверь с разбегу — «Ну хотя бы упорство ему не занимать». Спорит с Никой, предлагает остановиться и не идти вслепую, и Артём про себя признаёт его правоту: «И он был прав. Я конечно не хотел этого признавать». Его же идея — искать комнату без окон. Шутки Артёма ему не заходят.</p>\n<p><strong>Паша.</strong> Мальчик, школьник — «третий самый низкий среди них был пацан. Вообще школьник кажись. И че он здесь забыл?». Робкий, представляется последним и с запинкой. Единственный, кто смеётся над шутками Артёма. Не умеет плавать — в затопленной комнате Артём держит его над водой. Разбивает ногу, и Артём несёт его на плече. Говорит вслух: «я хочу домой» — и именно эта реплика запускает у Артёма приступ тоски, через который заходит «Холод».</p>\n<p><strong>Здоровяк-зэк.</strong> Безымянный. На берегу толкнул Артёма в плечо: «-Хватит а! ? Ты не видишь здесь и так все напряжённые и без твоих ебнутых шуток». Артём ответил «а правда ли шуток?». При старте к кораблю Артём толкнул его в спину: «Толчок в спину был для него неожиданным. И он упал. А я побежал дальше».</p>\n<p><strong>Организация «Нимб».</strong> В диалоге названа источником писем, созвавших людей к кораблю. Ника: «Одна из крупнейших организаций всего мира написала нам о корабль. Разве это не странно». Игорь: «ты хочешь сказать, что организация \" Нимб\" Во всём этом виновата?». Ника: «я не говорила, что она виновата. Я лишь сказала, что письмо от них. А это что-то да и значит». Сам Артём в этом споре не участвует — он в это время думает о существе в коридоре. Как о корабле узнал он сам, в переписке не сказано; сказано только, что он «повёлся на одну чушь наверное. Чушь про корабль».</p>\n<p><strong>«Холод».</strong> Сущность, атаковавшая его в комнате без окон. См. раздел «Способности».</p>\n<p><strong>Медведеподобное существо.</strong> В коридоре Артём увидел «Едва показалось рука?. Нееет лапа зверя. Медведь? Не знаю». Оценка размера: «даже она была по размеру, как моя голова». Существо больше в тексте не появляется; Артём строит на нём вывод, что в коридорах оставаться нельзя.</p>\n<p><strong>Чёрный гуманоид.</strong> «в обычной тьме помещения передвигался гуманоид, который был ещё черней чем тьма вокруг», с когтистой лапой. Утащил, по предположению Артёма, Игоря и Пашу — «Получается их это существо утащил во мрак корабля, а я здесь». Убит Артёмом ножом.</p>\n<p><strong>Заброшенный корабль исполняющего желания.</strong> Место действия второй истории. Артём пришёл туда «11 июня в полночь», к кораблю «По размеру который как гора». На берегу собрались «Студентка, клерк, старик, красотка, бандит, бизнесмен и так далее. Все это были разный люди, из разных слоев. Хм миров».</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0257-S06", "PS-0257--kak-menyalsya"], "h": "<p>Персонаж не переписывался: обе версии выложены в один вечер 21 апреля 2025 года как готовые куски двух разных брошенных текстов. Ниже — два состояния, каждое само по себе.</p>\n<p><strong>Версия 1 — 2025-04-21 (id 320973–320981, окно w0088).</strong> Артём назван по имени. Женатый человек на стабильной работе, «прилично зарабатывал», ждёт первого ребёнка — дочь. Живёт в квартире в 7 минутах ходьбы от магазина. Рассказ ведётся ретроспективно, из точки, где «Моя жизнь сломалось». Событийная линия: беременность на седьмом месяце, список покупок с 4 кг куриных ножек, реакция жены дома. Текст обрывается на фразе «Она развернулась  ко мне лицом».</p>\n<p><strong>Версия 2 — 2025-04-21 (id 320982–320988, окно w0088).</strong> Рассказчик безымянный. Одержимый мечтой человек, готовый убивать ради неё, привычный к чужим органам и крови, шутящий в опасности. Событийная линия: сбор у корабля, перемещение корабля в открытое море ровно в 00:01, забег внутрь с калечением конкурентов, встреча с лапой зверя, группа с Никой, Игорем и Пашей, затопленная комната и выбитая дверь, исчезновение комнаты, коридор с телами, падение в выпотрошенное тело, приступ тоски и атака «Холода», убийство чёрного гуманоида. Текст обрывается на том, что Ника всё ещё без сознания.</p>\n<p>Связка между версиями в переписке не проговорена. За то, что во второй истории тот же Артём, говорят: жена и дочь, ждущие дома, и привычка к чужим органам, перекликающаяся с надломом из первой истории. Прямо это не сказано.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0257-S07", "PS-0257--chto-s-nim-stalo"], "h": "<p>Обе истории брошены и не дописаны — они и были скинуты как «заметки брошенных истории». Первая обрывается в момент, когда жена поворачивается к нему лицом. Вторая обрывается сразу после убийства гуманоида, при пропавших Игоре и Паше и лежащей без сознания Нике.</p>\n<p>Продолжения, планов продолжения или обсуждения дальнейшей судьбы персонажа в переписке нет. На вопрос Миколая «а сейчас чёт пишешь?» Слава ответил «Нет еще» (320976, 320978).</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0257-S08", "PS-0257--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Фамилия и отчество не названы — отказ обозначен внутри текста: «Думаю не надо здесь фамилии и отечество моего».</li>\n<li>Имя жены не названо. Что произошло, когда она развернулась к нему лицом, — не написано, история на этом оборвана.</li>\n<li>Чем именно «сломалась» жизнь Артёма из первой истории — не написано.</li>\n<li>Что за желание у Артёма во второй истории, ради которого он готов убивать, — не названо ни разу.</li>\n<li>«Мой шедевр, где-то там» — что это, не объяснено.</li>\n<li>Привычка «быть в чужих органах и крови» и «извращенная натура» никак не раскрыты: откуда взялись, что он делал раньше — не сказано.</li>\n<li>Чьи кроссовки на нём и что за «парень» — не сказано; мысль оборвана самим рассказчиком.</li>\n<li>Откуда у него нож — не сказано.</li>\n<li>Как он сам узнал о корабле (в отличие от Игоря и Ники, получивших письма от организации «Нимб») — не сказано.</li>\n<li>Прямой связи между рассказчиком первой и второй истории в переписке нет; отмечено как неясность в самой базе.</li>\n<li>Обсуждения обеих историй соавторами нет: после выкладки Миколай написал только «спасибо что скинул».</li>\n<li>Отклонённых вариантов и альтернативных версий персонажа в переписке не зафиксировано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0257--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0074.html\">Четверо на корабле («супер группа»)</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0074.html\">Четверо на корабле («супер группа»)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0257--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-04-21</td>\n<td>320973–320981</td>\n<td>w0088</td>\n<td>Нимб (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-04-21</td>\n<td>320982–320988</td>\n<td>w0088</td>\n<td>Нимб (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0257-artem.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0257--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0257.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0257-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0257/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>По цифрам это не тот случай, где что-то стопорит соседние статьи: у <code>PS-0257</code> всего одна обратная ссылка (группа <code>GR-0074</code>), а все, кто назван внутри — Ника (<code>PS-0258</code>), Игорь (<code>PS-0240</code>), Паша (<code>PS-0259</code>), «Холод» (<code>SP-0223</code>), заброшенный корабль (<code>MN-0019</code>) — уже имеют собственные статьи с материалом. Единственная реально открытая нить тянется наружу, в статью мира <code>VS-0006</code> (Нимб): из восьми связей организации «Нимб» с миром, перечисленных там подряд, семь закрыты фактами, и только одна — «Нимб → люди с корабля» — оставлена как открытый вопрос: «Письма о корабле пришли от организации. Вопрос о её вине поставлен и не решён». Артём — один из тех, кого это письмо привело на корабль, и в самом споре о вине он демонстративно не участвует — думает о существе в коридоре, пока Ника и Игорь спорят.</p>\n<h3>С чего начать</h3>\n<p>Копать архив не нужно — вопрос уже сформулирован и процитирован в <code>VS-0006</code>, раздел «Как классы соотносятся», пункт 7. Дальше стоит идти через тех, кто внутри истории спорил о вине организации, — Игорь (<code>PS-0240</code>) и Ника (<code>PS-0258</code>): у обоих статьи заметно крупнее статьи об Артёме (29909 и 16024 знаков против 28048) и материала в базе больше.</p>\n<h3>Как развивалось</h3>\n<p>Персонаж не проходит развития по датам — обе версии выложены разом, одним вечером 21 апреля 2025 года, без обсуждения между ними. Слава предложил скинуть заметки «брошенных историй» — Миколай уточнил, что это значит забросить, и разрешил кидать. Дальше — сразу два готовых текста подряд, без разбора. Итог — «спасибо что скинул», и больше ни слова.</p>\n<h3>Отклик</h3>\n<p>Зацепила не механика, а то, как безымянный рассказчик во второй истории методично не совпадает с человеком из первой — тот боится ошибиться с ребёнком, этот без раздумий подсекает конкурентов на трапе, — и текст ни разу не называет его по имени, чтобы это стыковалось напрямую. Приходится либо верить на слово, что это тот же Артём, либо нет — и статья честно не делает этот выбор за читателя.</p></div>", "r": []}];</script>
