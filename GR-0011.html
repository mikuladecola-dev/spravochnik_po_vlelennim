<script>const BASE="";const DOCNAME="Братья и сёстры (благословенные одним правителем)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0011-S01", "GR-0011--chto-eto"], "h": "<p>Родня по благословению. Определение дано Славой одной строкой при разработке Воплощения гнева (2025-01-22, id 283706): «Братья и сестры это то бишь благословенный одним правителем».</p>\n<p>То есть это не отряд, не орден и не организация, а категория родства: братьями и сёстрами друг другу приходятся все, кого благословил один и тот же правитель. Правителей в переписке двое — Бог и дьявол; соответственно есть братья и сёстры по благословению Бога и братья и сёстры по благословению дьявола, и между этими двумя лагерями связи нет.</p>\n<p>Отношения внутри такой родни описаны раньше самого термина (2025-01-06, id 279042–279043): «Они чувствуют себя как братья и сестры», «Хотя и редко видятся в живую». Вопрос Миколая, с которого это началось, звучал так (id 279034, 279041): «эти 42 человека знают друг друга, к каких они отозвались?» — и следом уточнение: «я имел ввиду \"в каких они отношениях\"».</p>\n<p>В базе эта общность заведена как запись о персонаже (<a href=\"PS-0181.html\">Братья и сёстры (благословенные одним правителем)</a>), но по содержанию реплик это именно группа — перечень родни, а не отдельное действующее лицо.</p>", "r": [["Братья и сёстры (благословенные одним правителем)", "PS-0181.html"]]}, {"t": "Состав", "a": ["S02", "GR-0011-S02", "GR-0011--sostav"], "h": "<p>Поимённого состава в самой реплике нет. Слава перечисляет братьев и сестёр Воплощения гнева по способностям, без имён (2025-01-22, id 283707):</p>\n<div class=\"q\"><p>«Среди его братьев и сестёр есть владельцы способности изменения агрегатного сотояния,<br>Та кто может изменять плотность массу и размер объектов и себя<br>Тот у кого есть способность сжатия<br>Имитация<br>Бессмертный выродок<br>Теневые братья»</p></div>\n<p>Привязка этих способностей к именам сделана по карточкам способностей (<a href=\"SP-0179.html\">Контроль над массой, размером и плотностью</a> — контроль над массой, размером и плотностью; <a href=\"SP-0180.html\">Смена агрегатного состояния</a> — смена агрегатного состояния; <a href=\"SP-0181.html\">Сжатие</a> — сжатие), а не по самой реплике.</p>\n<ul>\n<li><a href=\"PS-0180.html\">Воплощение гнева</a> — Воплощение гнева (в каталоге «Защитник 🤬»), тот, чья родня перечисляется</li>\n<li><a href=\"PS-0182.html\">Агрегат</a> — Агрегат, владелец изменения агрегатного состояния</li>\n<li><a href=\"PS-0194.html\">Воительница</a> — Воительница, «та кто может изменять плотность массу и размер объектов и себя»</li>\n<li><a href=\"PS-0171.html\">Палач</a> — Палач, «тот у кого есть способность сжатия»</li>\n<li><a href=\"PS-0184.html\">Бессмертный выродок</a> — Бессмертный выродок</li>\n<li><a href=\"PS-0183.html\">Теневые братья</a> — Теневые братья</li>\n</ul>\n<p>Отдельной строкой в перечне стоит «Имитация» — в каталоге благословенных ей соответствует Имитатор, но записи в списке участников группы нет.</p>\n<p>Полный список благословенных, куда входят перечисленные, Слава сводит в каталог (2025-01-24, id 284248): Теневый братья 🌘, Имитатор 🗡 (ветреной 🌬; электро ⚡️; птичка 🔈), Агрегат 🫥 (волк 🐺; экстримал ⏳), Разрушительнитца 💪 (огненная 💥), Палач ☠️, Защитник 🤬 (ангел 👼), Дитя света ✨, Бессмертный выродок 🤪, Хулиган 💎, Вибрация 🫨, Ученица???</p>\n<p>Насколько эти персонажи проработаны, Слава отвечает прямо (2025-01-24, id 284366): «Ну только вид и способность и плюс минус характер».</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · С чего начать — не материал авторов</b>\n<p>В базе — за «Имитацией» (<code>PS-0383</code>, <code>SP-0060</code>, <code>SP-0205</code>) и за способностями родни: <code>SP-0179</code> (3 953), <code>SP-0180</code> (3 991), <code>SP-0181</code> (3 760). Привязка имён к перечню 283707 сделана именно через эти три карточки, и их стоит перечитать целиком — они небольшие, а держат на себе весь раздел «Состав».</p></div>", "r": [["Воплощение гнева", "PS-0180.html"], ["Агрегат", "PS-0182.html"], ["Воительница", "PS-0194.html"], ["Палач", "PS-0171.html"], ["Бессмертный выродок", "PS-0184.html"], ["Теневые братья", "PS-0183.html"], ["Контроль над массой, размером и плотностью", "SP-0179.html"], ["Смена агрегатного состояния", "SP-0180.html"], ["Сжатие", "SP-0181.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0011-S03", "GR-0011--obschie-sposobnosti-gruppy"], "h": "<p><strong>Связь между собой.</strong> Названа за две недели до самого термина (2025-01-06, id 279037): «Между благословенный бога есть связь и они в любой момент могут связаться с другими благословенными бога. У благословенными дьявола также. Но при этом благословенный дьявола и бога не могут с друг другом связываться». Миколай спросил: «телепатия?» — Слава ответил: «Ну типа того» (id 279039–279040). Механика связи дальше не расписана.</p>\n<p><strong>Белые глаза.</strong> Общая внешняя черта (2025-01-22, id 283708): «Вообще благословенный Богом есть общая чёрта виде белых глаз при активаций благословения». Тут же Слава отмечает, что этими же глазами он наделил и всех, кто должен был быть благословлён дьяволом, и что менять он ничего не хочет, «потому что мне и так нравится».</p>\n<p><strong>Уровень силы относительно грехов.</strong> Один благословенный слабее одного греха (2025-01-24, id 284276): «7 грехов сильней благословенный и чтобы убить одного греха в максимум надо 3 благословенных именно Бога. А для остальных благословенных надо будет 5».</p>", "r": []}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0011-S04", "GR-0011--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p>Различие внутри родни — по способности, у каждого своя:</p>\n<ul>\n<li>изменение агрегатного состояния (Агрегат);</li>\n<li>изменение плотности, массы и размера объектов и себя (Воительница);</li>\n<li>сжатие (Палач);</li>\n<li>имитация;</li>\n<li>бессмертие (Бессмертный выродок — способность в реплике не расшифрована, назван по прозвищу);</li>\n<li>Теневые братья — названы во множественном числе, чем именно они владеют, в перечне не сказано.</li>\n</ul>\n<p>Сам Воплощение гнева описан отдельно и подробнее прочих (2025-01-22, id 283706): принципиальный, прямолинейный и жестокий, «Прототип защитника только молчиливова», «Бэтмен с жестокостью и гневом», «Тот кто да мозга костей ненавидит междумирцов», «Тот кто оторвёт крылья ангелам, переломает кости своим братьям и сёстрам». Позже уточнено (2025-01-22, id 283728): «Непробиваемому чудовище. Страх всех чужемирцов». Там же отклонён вариант способности: «Способность скорость не подходит». В самом начале обсуждения Миколай предлагал левитацию (id 283704) — предложение осталось без ответа.</p>\n<p>В каталоге у части благословенных в скобках стоят подчинённые формы: у Имитатора — ветреной, электро, птичка; у Агрегата — волк, экстримал, позже добавлен страдалец; у Разрушительницы — огненная; у Защитника — ангел; у Хулигана — слайм (добавлен 2025-01-24). Что означает скобка, в переписке не сказано.</p>", "r": []}, {"t": "Иерархия", "a": ["S05", "GR-0011-S05", "GR-0011--ierarhiya"], "h": "<p>Внутренняя иерархия между братьями и сёстрами не названа. Над ними стоит правитель, благословением которого они и связаны, — Бог или дьявол.</p>\n<p>Единственное, что сказано о старшинстве по силе, относится не к самой родне, а к соседней группе: семь грехов сильнее благословенных (2025-01-24, id 284276).</p>\n<p>Родство не мешает вражде: Воплощение гнева «переломает кости своим братьям и сёстрам» (2025-01-22, id 283706). Причина этой вражды в переписке не названа — наоборот, там же Слава пишет о персонажах-грехах: «За что карать его. Потому что ничего про них придумать не могу» (2025-01-22, id 283729–283730).</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S06", "GR-0011-S06", "GR-0011--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>Благословенные другого правителя.</strong> Связи нет вообще (2025-01-06, id 279037): благословенный дьявола и благословенный Бога «не могут с друг другом связываться».</p>\n<p><strong>Семь грехов.</strong> Сильнее благословенных. Чтобы убить одного греха в максимуме, нужно трое благословенных именно Бога, для остальных благословенных — пятеро (2025-01-24, id 284276). Список грехов со способностями оформлен там же (id 284278): Гнев 😡 (сила), Похоть 😵‍💫 (контроль разума), Зависть 👹👹 (полной копирование), Алчность ♾ (всё моей), Гордыня 👑, Чероугодия ◼️ (поглощения), Лень 😴 (контроль территории).</p>\n<p><strong>Междумирцы (чужемирцы).</strong> Воплощение гнева их «да мозга костей ненавидит» и является «страхом всех чужемирцов» (2025-01-22, id 283706, 283728). Отношение остальной родни к междумирцам не описано.</p>\n<p><strong>Враги.</strong> Отдельный список в том же каталоге, параллельный списку благословенных (2025-01-24, id 284248): Доспехи 🏳️, Козлиха 🪓, Сестра 🚺, Огненный снайпер 🔥, Охотник 🔪, Божество 😵, Убийца 🩸, Зонтик 🩸, Леший 🌳, Пар 💨, Садистка ✂️, Насекомое 😡, Старик ➡️⬅️; со второй редакции добавлен Эльф 🌬 (id 284278). Слава дважды предлагает Миколаю угадать, кто из врагов чужемирец (id 284249, 284280–284281); ответа в переписке нет.</p>\n<p><strong>Ангелы.</strong> Упомянуты только через действие Воплощения гнева: «оторвёт крылья ангелам» (2025-01-22, id 283706).</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S07", "GR-0011-S07", "GR-0011--kak-menyalas"], "h": "<p><strong>2025-01-06 (id 279034–279044).</strong> Введена связь внутри группы благословенных одного правителя и запрет связи между лагерями. Миколай подставляет слово «телепатия», Слава соглашается («Ну типа того»). Отношения определены как «чувствуют себя как братья и сестры», при этом «редко видятся в живую». Термина «братья и сёстры» как названия группы ещё нет — это описание ощущения.</p>\n<p><strong>2025-01-22 (id 283706–283707).</strong> Появляется само определение: «Братья и сестры это то бишь благословенный одним правителем». Даётся перечень родни Воплощения гнева по способностям, без имён.</p>\n<p><strong>2025-01-22 (id 283708–283712).</strong> Обсуждается численность. Из-за того, что белые глаза при активации благословения розданы и тем, кто должен был быть благословлён дьяволом, Слава предлагает: «Поэтому я думаю вообще убрать благословенных дьяволом. Тогда благословенных будет 21». Тут же откатывается: «Ну конечно можно оставить и 42», «Ну я не знаю», и переадресует вопрос Миколаю: «Как думаешь сколько должно быть благословенных Богом 21 или 42». Ответа в переписке нет — вопрос остался нерешённым, оба варианта (21 и 42) сохраняются.</p>\n<p><strong>2025-01-24, 10:31 (id 284248).</strong> Родня оформлена в каталог благословенных с эмодзи. Теневые братья стоят отдельной строкой, первыми в списке. Появляется «Ученица???» со знаками вопроса.</p>\n<p><strong>2025-01-24, 11:12 (id 284278).</strong> Вторая редакция каталога. Теневые братья убраны из отдельной строки и перенесены в скобки к Дитя света: «Дитя света ✨(Теневые братья 🌘)». К Агрегату добавлен страдалец 🔪, к Хулигану — слайм 7️⃣. В том же окне зафиксировано соотношение сил с грехами.</p>\n<p><strong>2025-01-24, 12:25 (id 284300).</strong> Третья редакция каталога. Список благословенных не меняется; добавлены блоки оружия и артефактов, в строке идей «корень желаний» заменён на «камень желаний». Реакция Миколая: «ебаиь ты работяга», «так много всего придумал» (id 284301–284302).</p>\n<p><strong>2025-01-24, 16:20 (id 284364–284367).</strong> Уточнена степень проработки всех перечисленных: «Ну только вид и способность и плюс минус характер».</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "GR-0011-S08", "GR-0011--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава группы в самой реплике нет: 2025-01-22 (id 283707) родня названа по способностям, имена там не звучат. Привязка к именам взята из карточек способностей.</li>\n<li>Перечень 283707 не объявлен полным: сказано «среди его братьев и сестёр есть», то есть список открытый. Полный состав родни не назван.</li>\n<li>Численность не решена: 21 или 42 (2025-01-22, id 283709–283712). Ответа Миколая в переписке нет.</li>\n<li>Не решено, убирать ли благословенных дьяволом. Предложение высказано (id 283708) и тут же поставлено под сомнение самим же автором.</li>\n<li>Механика связи не описана: сказано только, что связаться можно «в любой момент», и что Миколай называет это телепатией. Дальность, ограничения, что именно передаётся — в переписке не сказано.</li>\n<li>Как согласуется телепатическая связь с тем, что Воплощение гнева ломает братьям и сёстрам кости, не обсуждалось.</li>\n<li>Внутренняя иерархия родни не названа.</li>\n<li>Способности Бессмертного выродка и Теневых братьев в перечне не расшифрованы.</li>\n<li>Что означают подчинённые формы в скобках каталога, в переписке не сказано.</li>\n<li>«Ученица???» оставлена со знаками вопроса и не определена.</li>\n<li>«Имитация» из перечня родни не имеет отдельной записи в составе группы.</li>\n<li>Предложение Миколая о левитации (2025-01-22, id 283704) осталось без ответа — не принято и не отклонено.</li>\n<li>Загадка «кто из врагов чужемирец» (id 284249, 284280–284281) задана дважды и не разгадана.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0011--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0171.html\">Палач</a>, <a href=\"PS-0180.html\">Воплощение гнева</a>, <a href=\"PS-0181.html\">Братья и сёстры (благословенные одним правителем)</a>, <a href=\"PS-0182.html\">Агрегат</a>, <a href=\"PS-0183.html\">Теневые братья</a>, <a href=\"PS-0184.html\">Бессмертный выродок</a>, <a href=\"PS-0194.html\">Воительница</a></li>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0179.html\">Контроль над массой, размером и плотностью</a>, <a href=\"SP-0180.html\">Смена агрегатного состояния</a>, <a href=\"SP-0181.html\">Сжатие</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0011--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0011.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0011-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0011/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первое — каталог, из которого взят весь состав родни: <code>SL-0051</code> — шесть ссылок, статьи нет, база 9 834; <code>SL-0053</code> — шесть ссылок, статьи нет, 20 313. Перечень 2025-01-24 (id 284248) целиком лежит там, и статья цитирует его построчно, а адресовать читателя не к чему.</p>\n<p>Второе — механика связи. <code>SP-0167</code> «Связь между благословенными»: две ссылки, статья есть, база 2 873. Две с половиной тысячи знаков — это ровно те два сообщения, что уже процитированы. То есть пробел «дальность, ограничения, что передаётся — не сказано» настоящий, добирать неоткуда, и это самое дорогое место статьи: телепатия здесь единственное, что делает родню родней, всё остальное — общий источник силы.</p>\n<p>Третье, техническое, но чинится за минуту. «Имитация» стоит в перечне родни без записи в составе — при этом <code>PS-0383</code> «Имитатор» в наборе есть: статья на 79 022 знака, ноль ссылок и нулевая база. Материал под именем не потерян, он лежит под другими номерами — <code>SP-0060</code> (112 113) и <code>SP-0205</code> (20 127). Незакрытым остаётся не персонаж, а связь: самая большая статья набора не собирает на себя ни одной ссылки.</p>\n<p>И то, чего нет совсем: «Дитя света», «Хулиган», «Экстримал», «Страдалец», «Ученица» — эти пункты каталога в справочнике отсутствуют как сущности, ни записи, ни статьи, ни знака базы. Пробел «что означают подчинённые формы в скобках» упирается именно в это: половина скобок ведёт в никуда.</p>\n<h3>С чего начать</h3>\n<p>В базе — за «Имитацией» (<code>PS-0383</code>, <code>SP-0060</code>, <code>SP-0205</code>) и за способностями родни: <code>SP-0179</code> (3 953), <code>SP-0180</code> (3 991), <code>SP-0181</code> (3 760). Привязка имён к перечню 283707 сделана именно через эти три карточки, и их стоит перечитать целиком — они небольшие, а держат на себе весь раздел «Состав».</p>\n<p>Числовая развилка 21/42 тоже проверяется без архива: <code>PS-0279</code> «Правитель рая» — 23 121, <code>PS-0278</code> «Правители» — 26 811, <code>MR-0097</code> — 9 624, <code>MR-0103</code> — 3 793. Все со статьями. Если решение про благословенных дьяволом где-то и было озвучено, то в этих записях, а не в окне 2025-01-22.</p>\n<p>В архив — за одним куском: 2025-01-06, id 279034–279044. Там Миколай задаёт вопрос про отношения сорока двух между собой, получает «чувствуют себя как братья и сестры» и «редко видятся в живую», подставляет слово «телепатия» и слышит «Ну типа того». Всё, что мир знает о связи внутри родни, — это восемь сообщений. Смотреть надо продолжение окна после id 279044, до конца дня.</p>\n<h3>Как развивалось</h3>\n<p>2025-01-06 — сначала появилось ощущение: «чувствуют себя как братья и сестры», без термина, в ответ на вопрос про отношения. 2025-01-22 — ощущение стало определением: «братья и сестры это то бишь благословенный одним правителем». В тот же час родню ограничили с другой стороны — численность поставили под вопрос (21 или 42), передали вопрос Миколаю и оставили без ответа. 2025-01-24 — родню свели в каталог, за один день переписав его трижды, и в тот же день сами оценили глубину: «Ну только вид и способность и плюс минус характер». После 24 января термин в этих окнах не возвращается: дальше живут отдельные имена из каталога, а сама категория родства больше не обсуждается.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Правило родства названо чётко: братья и сёстры — благословенные одним правителем, и между лагерями Бога и дьявола связи нет вообще. Тут же назван внешний признак принадлежности — белые глаза при активации у благословенных Богом. И тут же сказано, что этими же глазами наделены все, кто должен был быть благословлён дьяволом, и менять автор ничего не хочет. То есть признак перестал совпадать с правилом: по глазам две родни неразличимы, по связи — не сообщаются вовсе. Как теперь определяется, кто кому брат, если внешний маркер общий, а канал связи разный, — не проговорено. Правило есть для связи, для признака такого же рода правила нет.</p>\n<h3>Отклик</h3>\n<p>Тут одна фраза перевешивает всё остальное: «Тот кто оторвёт крылья ангелам, переломает кости своим братьям и сёстрам». Она стоит в том же сообщении, где введено само понятие родства, — то есть родня определена и разломана в один приём, до того как в ней появилось хоть одно имя. И рядом, через несколько реплик, о персонажах-грехах: «За что карать его. Потому что ничего про них придумать не могу» — автор вслух назначает наказание за то, что не смог придумать. Два признания подряд, одно внутри мира, другое снаружи, и оба про одно и то же. Ещё нравится, что вся эта родня друг друга почти не видит: связь есть постоянно, встречи редки. Для группы, которая ни разу не собралась вместе, это сказано ровно один раз и больше не понадобилось.</p></div>", "r": []}];</script>
