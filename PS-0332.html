<script>const BASE="";const DOCNAME="Дионис Бэлут";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0332-S01", "PS-0332--proishozhdenie"], "h": "<p>Дионис Бэлут — герой текста «Фанатик (обычный мир)», выложенного Славой одним заходом (2025-12-14, id 397758–397761, окно w0113). Текст написан от первого лица, повествователь — человек из нашего мира, очнувшийся в чужом теле.</p>\n<p>О прежней жизни рассказчик сообщает сам, во вступлении. Он подчёркивает, что не относился к тем, кто мечтает о переносе: «Наверное многие мечтали попасть другое мир. Чаще всего об этом мечтают неудачники». По его формулировке, такие люди зря надеются на перемену: «Они как и останутся неудачником в настоящим, так и в другом мире име будут. Смелость и воля не появится просто по волшебству». Про себя он говорит: «Я же никогда не мечтал о побеге. Тем более в другой мир. Был готов жить нынешнее жизнью».</p>\n<p>Жить приходилось с родителями, которые к моменту рассказа перестали быть людьми в прежнем смысле: «вот эти куски плоти, когда-то были моей семье. Уважаемые отец и миловидная мать. Сейчас не более чем....» — фраза в исходнике обрывается, чем именно они стали, не договорено. Он их не бросил: «как никак раньше они меня любили, да и воспитали. И бросить их будет неправильно».</p>\n<p>Быт описан как замкнутый цикл: «Работа, дом и уход за этими». Денег на содержание уходило много, приходилось работать на нескольких работах, «наплевав на своё светлое будущее, что вещали мне учителя». Тяжелее всего был недосып: «эти всю ночь вопили. Они всегда вопят. Вот только ночью они словно сходят с ума. Кричат, вопят и стукаются своими тушами». Он мыл «эти разлагающие изнутри тела, которая дергаются каждый раз, когда я 'случайно' сильно на давлю», кормил и «каждый раз натягивать улыбку, когда они выплёвывают еду». Отдельно зафиксировано: «Тем больше проходила времени, чем больше я желал им смерти».</p>\n<p>Отдушиной были книги — сказки, «легкий, с простой моралью». Обоснование: «Вроде кто-то говорил, чем глубже ты во тьме, чем ярчее даже самый тусклый свет. Этим светом стали книги». Одна книга выделена особо — «о герой справедливости, что побеждает все зло. Легко, просто и предсказуема, но да безумия запало в душу. Мой милый лучик света. Мой герой». Название книги и имя героя справедливости в переписке не названы.</p>\n<p>Попадание происходит уже свершившимся фактом: первая сцена — рассказчик стоит у зеркала в чужом теле. Мысль «Я попал в другое мир» он описывает как «Четкая мысль, которое даже не нужно было формировать». Реакция — не страх, а «Волнительные чувство, как перед открытием подарка на новый год».</p>\n<p>Сведения о новом теле он получает от служанки прямым вопросом («как же звать меня? Сколько мне лет? И какое сейчас число?»). Ответ: «вы Дионис Бэлут старший сын графа Бэлута. В этом году вам исполнилась 23 года. Сегодняшняя дата 28 июня 1417 год».</p>\n<p>Мир опознан позже, из упрощённого пересказа истории королевства Пиор, который по его просьбе сделала служанка: «Этой информации мне хватило, чтобы понять, что это за мир. Удивительно, нет- это восхитительно. Я лютый грешник попал в тот самый лучик света. В ту б сказку о герой справедливости, что борется со всем злом на свете». То есть мир «Фанатика» — тот самый мир его любимой книги. Что именно в истории Пиора его опознал, в переписке не сказано.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0332-S02", "PS-0332--vneshnost"], "h": "<p>Тело описано в сцене у зеркала: «Лицо была мужчины за 20 лет. Чёрные волосы, что были бы абсолютно чёрными если не седина. Острые черты лицо, с измученными красными глазами. И неподелная улыбка».</p>\n<p>Седина отмечена как то, чего он не ждал: «Хотя седина на волосах немного беспокоит ну ладно...». Она же служит доводом, что персонаж не из прочитанных им романов: «Вроде как не описывалась в романах, которых я читал. \"Чёрные волосы с сединой\" Такой бы запомнилась».</p>\n<p>Красные глаза — семейная черта: у графа Эдгара Бэлута глаза тоже красные, у младшей сестры Алисы тоже.</p>\n<p>На руках Диониса «всегда были белоснежные перчатки» — сказано в третьей части, когда он впервые касается кого-то в этом мире.</p>\n<p>Одежда местная и сложная: «эти наряды, что-то с чем то. Слишком сложно одеваемый и без помощи дополнительных рук их не одеть» — переодевается с помощью служанки, хотя предпочёл бы сам.</p>\n<p>Постоянная физическая привычка, повторяющаяся через весь текст, — отряхивание невидимой пыли с груди и с плеча. Она сопровождает почти каждую его реплику в разговорах со служанкой, с графом и с младшим братом: «сказал я отряхивая пыль на груди», «Продолжая отряхивать пыль уже с плеча», «сказал я искренне улыбаясь и отряхивая невидимую пыль с груди», «Я отряхнул грудь и продолжил», «ответил я держась на дистанции и быстро отряхивая пыль». Откуда взялась привычка — от прежнего Диониса или от самого рассказчика — в переписке не сказано.</p>\n<p>Отдельно отмечена несвойственная ему пластика: «Элегантно и спокойно сев на стол. Я начал понимать, что мои действия слишком элегантны для человека 21 века». Прибор оказался в руках сам собой — «Мышечная память что-ли?».</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0332-S03", "PS-0332--harakter"], "h": "<p>Себя рассказчик называет прямо: «Я лютый грешник».</p>\n<p>Главное свойство — отсутствие притязаний на власть и сюжет. Политическая борьба, которую он ожидает от расклада с мачехой и младшими детьми, ему не нужна: «Мне не хотелось устраивать политическую борьбу. Единственно, что я хотел это понаблюдать за главным героем. В независимости в каком я романе». На вопрос графа о своём пути он формулирует то же вслух: «мой путь мне виден с множество знакомств, а также наблюдением за невероятными событиями, что изменят историю»; на переспрос «наблюдать?» — «да наблюдать. Ну и возможно немного контралировать, чтобы события были именно таким, каким должны быть».</p>\n<p>Отношение к попаданию — восторг, а не паника: «Я едва сдержал возбуждение. Даже если это сон, даже если это бред. Нужно увидеть героя. Самая мысль о том, что я его увижу, того самого. Заставляло моей сердце биться сильнее». В саду ему приходится опираться на фарфоровую скульптуру, держась за колотящееся сердце.</p>\n<p>Осторожность он проявляет через раз: понимает, что «Я и так уже веду себя подозрительно», сдерживается от того, чтобы разуться и пройтись по коврам, но задаёт служанке прямые вопросы о собственном имени и возрасте, потому что «был настолько в хорошем настроении, что и не думал об этом».</p>\n<p>К проверке реальности подходит эмпирически. Сомнение «что если это правда какая-то болезнь» (подсказанное десятилетним братом) он проверяет прикосновением: просит руку у Лукаса, приседает, прижимает его ладонь ко лбу. Вывод: «Тепло. Думаю этого должно хватить чтобы понять. Даже если это все нереально, зато чувство здесь реальны». Когда Алиса требует «и мою руку», он делает то же — «Я улыбнулся испытав внутренние тепло».</p>\n<p>Оптимизм у него функциональный: «Нужно быть оптимистом - это единственный способ пережить что-то тяжелое», после чего он раскладывает предстоящий ужин на «во-первых / во-вторых / в-третьих».</p>\n<p>На публику он готов работать намеренно: когда семья собирается за столом, он думает «Раз так хотите сильно клоуна. То он будут лучшим из клоунов», и здоровается «искренне улыбаясь». Своё поведение на ужине он подаёт как «духовное рождение» — «духовно рождение или по другому. Я вижу свою путь. Четкая и ясна, как никогда».</p>\n<p>Ирония и резкость проявляются в обращении со служанкой. Сначала — «да ты нечто», «будь конкурс лучшей служанки. Ты бы заняла первое место». После того как он понимает, что она докладывает графине, — перед дверью столовой: «знаешь теперь я думаю. Ты займешь последнее место». Ей же отдан прямой запрет: «больше не делай что-либо без моего приказа. Ты же моя служанка?». Своё же поведение он комментирует чужой поговоркой: «И вправду говорят \"Прощения получить легче, чем разрешение\"».</p>\n<p>Речевая привычка из прежней жизни при нём осталась: «\"Блять\" Едва сдержался, чтобы не произнести привычное слова».</p>\n<p>Раздражение вызывают повторы за ним: «да что же вы так любите повторять мои слова» (о графе), и бесконечный коридор особняка — «И этот идиотский коридор с множеств дверей, когда нибудь закончится?».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0332-S04", "PS-0332--sposobnosti"], "h": "<p>Сверхъестественных способностей за Дионисом в переписке не названо. Единственное, что работает помимо его воли, — навыки тела: столовый прибор «каким то чудом оказались в моих руках», движения «слишком элегантны для человека 21 века». Объяснение предположительное и принадлежит самому рассказчику: «Мышечная память что-ли?».</p>\n<p>Знание мира у него книжное, из прежней жизни: он опознаёт королевство Пиор как мир своей любимой сказки и заранее знает, чем обычно оборачивается фигура мачехи — «Я прочитал достаточно рассказов, чтобы понимать мачеха не сулит ничего хорошего».</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0332-S05", "PS-0332--svyazi-s-drugimi"], "h": "<p><strong>Прежняя жизнь / прежняя семья (наш мир).</strong> Отец и мать, превратившиеся в «куски плоти», за которыми он ухаживал и которым желал смерти. Что с ними стало после его исчезновения — в переписке не сказано.</p>\n<p><strong>Прежний Дионис Бэлут.</strong> Хозяин тела. О нём известно только по чужим реакциям. Граф отмечает: «сегодня у тебя на удивление хорошое настроение Дионис» — то есть обычное настроение прежнего Диониса было другим. Служанка сообщила графу, «что сегодня у вас за долгое время хорошее настроение». Лукас замечает: «а то ты сегодня странно себя ведешь». Главное расхождение — обращение к графине: «а почему ты маму, мачехой назвал?», «Ты маму называл мамой. Иногда матушкой или матерью». Рассказчик на это думает только: «\"Чё\" Единственное мысль. Это какое новый способ контроля». Куда делся прежний Дионис и жив ли он, в переписке не сказано.</p>\n<p><strong>Граф Эдгар Бэлут</strong> — отец. Внешне: «Моя копия, ну или я его копия. Как я только в разы крупней и с более суровым лицом, ну и с барадишкой», красные глаза. На ужине он молчит, потом расспрашивает про хорошее настроение и про «путь», хмурится, пьёт вино и в итоге «слегка улыбнулся продолжая есть». Он же потребовал, чтобы Дионис был на ужине, когда тот пытался отговориться недомоганием.</p>\n<p><strong>Графиня Виктория Бэлут</strong> — мачеха, вторая жена графа, «с шелковистыми и зелёными волосами». На заявление о духовном рождении реагирует интересом, но «Лицо графини слегка стало холодным и напряженым». Требует убрать формальности: «Дионис зачем такие формальности за обеденным столом»; когда он переходит на «мачеха», «Лицо Виктории нухмурилась и стало еще грубее». Рассказчик перебирает варианты обращения — Виктория, «Матуш....», «Моя госпожа» — и ни на чём не останавливается. Ей же служит его черноволосая служанка. Родная мать Диониса в переписке не упоминается вовсе.</p>\n<p><strong>Лукас</strong> — младший брат, 10 лет, черноволосый, «с ярко зелёными словно нефрит глазами», сын графини Виктории. Первым замечает странность в поведении старшего брата и предполагает медицинскую причину: «я слышал, что существует несколько болезней, что искажают восприятия». Без колебаний даёт руку. Он же задаёт вопрос про «мачеху» и заканчивает сценой тревоги: «мама наверное очень сильно расстроилась».</p>\n<p><strong>Алиса</strong> — младшая сестра, 7 лет, черноволосая и красноглазая, дочь графини Виктории. Требует, чтобы её руку тоже приложили ко лбу, «по детски захихикала». Отвечает про обращение к матери «ярко улыбаясь. Словно ответила на сложнейшие вопрос».</p>\n<p><strong>Черноволосая служанка</strong> — имя не названо. Внешность: «Особо выдающим лицо её не было. Просто тьма во тьме. Чёрные глаза, с чёрными волосами скрытый в углу комнаты». Отвечает бесстрастно, «без колебаний», «Словно только ждала когда я задам этот вопрос». Водит его по особняку, пересказывает историю Пиора, достаёт «из неоткуда» стакан воды, помогает переодеться, наклоняется, желая удачи перед дверью столовой. Сообщила графу о его настроении через дворецкого, пока они были в библиотеке. При упоминании мачехи Виктории «слегка с езжилась», из чего рассказчик делает вывод: «Все было до ужаса очевидным. Моя милая служанка служит графине». После ужина её нигде нет.</p>\n<p><strong>Дворецкий.</strong> Главный дворецкий присутствует на ужине с несколькими приближёнными — по правилам за столом только члены семьи и он. Рассказчик отмечает, что принял его за библиотекаря.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0332-S06", "PS-0332--kak-menyalsya"], "h": "<p>Все три версии записаны 2025-12-14 в 22:10 и представляют собой не переделки одного эпизода, а последовательные куски одного текста (id 397758, 397759–397760, 397761). Переписанных или отменённых состояний персонажа в материале нет.</p>\n<p><strong>Версия 1 (2025-12-14, id 397758).</strong> Вступление о прежней жизни и книгах; пробуждение у зеркала; опрос служанки — имя, возраст, дата 28 июня 1417. Заканчивается решением: «Остаётся лишь одно. Самому расследовать, что же это за мир».</p>\n<p><strong>Версия 2 (2025-12-14, id 397759–397760).</strong> Экскурсия по особняку, состав семьи, история королевства Пиор и опознание мира; формулируется цель — наблюдать за героем справедливости и «немного контралировать»; появляется привычка отряхивать невидимую пыль; ужин с семьёй и объявление о «духовном рождении»; выясняется, что служанка служит графине. Заканчивается тем, что он заблудился в особняке: «Это конец. Мне правда придётся спать в горидоре».</p>\n<p><strong>Версия 3 (2025-12-14, id 397761).</strong> Встреча с Лукасом и Алисой в коридоре, проверка реальности мира прикосновением ко лбу, первое касание кого-либо в этом мире; открывается, что прежний Дионис звал мачеху мамой.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0332-S07", "PS-0332--chto-s-nim-stalo"], "h": "<p>Текст обрывается на разговоре в коридоре: Лукас говорит «мама наверное очень сильно расстроилась». Продолжения в переписке нет. Встретил ли Дионис героя справедливости, ради которого он и хочет остаться наблюдателем, — не написано.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0332-S08", "PS-0332--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Название любимой книги и имя героя справедливости не названы. Не сказано и того, по каким деталям истории Пиора рассказчик опознал в нём мир этой книги.</li>\n<li>Как именно произошло попадание, что стало с телом в прежнем мире и что стало с прежним Дионисом — не сказано.</li>\n<li>Настоящее имя рассказчика (из нашего мира) не названо ни разу.</li>\n<li>Родная мать Диониса не упоминается: неизвестно, жива ли она, и как она соотносится с тем, что прежний Дионис звал Викторию мамой.</li>\n<li>Почему прежний Дионис звал мачеху мамой и почему у семьи была репутация, заставляющая рассказчика ждать «политическую борьбу», не объяснено. Сам он списывает это на «какое новый способ контроля», но что имеется в виду, осталось нерешённым.</li>\n<li>Откуда седина у 23-летнего и почему у него «измученные» глаза — не сказано.</li>\n<li>Имя черноволосой служанки не названо; чем именно она обязана графине и что ей поручено, не сказано.</li>\n<li>Отношение графа и графини к Дионису до подмены не раскрыто.</li>\n<li>Государственное устройство и время (28 июня 1417 год) даны только цифрами; чему соответствует летоисчисление Пиора, не сказано.</li>\n<li>Отклонённых вариантов в материале нет: текст выложен одним заходом и не переписывался.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0332--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0081.html\">Семья Бэлут</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0081.html\">Семья Бэлут</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0332--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-12-14</td>\n<td>397758–397758</td>\n<td>w0113</td>\n<td>Феня (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-14</td>\n<td>397759–397760</td>\n<td>w0113</td>\n<td>Феня (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-14</td>\n<td>397761–397761</td>\n<td>w0113</td>\n<td>Феня (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0332-dionis-belut.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0332--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0332.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0332-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0332/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Здесь почти всё, что названо в тексте, уже прикрыто статьями: и семья (<code>PS-0334</code>), и служанка (<code>PS-0335</code>), и мир Пиора (<code>MR-0187</code>), и прежняя жизнь рассказчика (<code>PS-0333</code>). Единственное, что в статье прямо помечено как «статьи ещё нет», — группа «Семья Бэлут» (<code>GR-0081</code>). Но у неё нет и материала (0 знаков, 0 ссылок): это не пробел с потерянным содержанием, а формальный хвост — тот же состав семьи уже пересказан внутри персонажной карточки <code>PS-0334</code>. Чинить стоит именно это, но по цене это самая дешёвая дыра из всех — не наработка, а сшивка двух записей об одном и том же.</p>\n<h3>С чего начать</h3>\n<p>В архив идти не нужно. Всё, что нужно для группы «Семья Бэлут», уже есть — просто в другой записи: <code>PS-0334</code>, готовая статья, 20485 знаков в базе. Остаётся связать <code>GR-0081</code> с уже написанным, а не собирать семью заново.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Рассказчик применяет к миру эмпирическую проверку на реальность — трогает Лукаса и Алису, проверяет тепло их рук, делает вывод «даже если это всё нереально, зато чувство здесь реальны». Но то же самое опознание мира как «того самого» из его любимой книги он принимает на веру, по одному пересказу служанки, без единой проверки: «Этой информации мне хватило, чтобы понять, что это за мир». Правило проверки для одного вопроса (реальна ли рука брата) есть, для другого вопроса того же рода (тот ли это мир) — нет.</p>\n<h3>Отклик</h3>\n<p>Зацепило не событие, а голос: «вот эти куски плоти, когда-то были моей семье» — фраза обрывается на полуслове, и именно этот обрыв работает сильнее, чем любое доописание. Ужас тут не в деталях, а в том, что рассказчик даже не может закончить мысль о собственных родителях, зато с восторгом, без единой запинки, описывает попадание в чужое тело как подарок на Новый год. Это ровно тот контраст, ради которого стоит читать текст целиком, а не пересказ.</p></div>", "r": []}];</script>
