<script>const BASE="";const DOCNAME="абакра";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0064-S01", "SP-0064--mehanika"], "h": "<p>Абакра — общее название системы сил вселенной «Цветной мир», концепция Миколая. Вариант имени, встречающийся в переписке, — «абакр».</p>\n<p>Абакрой владеют все, но по-разному. Слава задаёт деление (2024-05-25, id 173152): «Бесцветный ( владельцы абакра но без эксклюзивный абилки ) Цветный ( владельцы абакра но с абилкой». То есть носительство самой абакры не делает существо Цветным; Цветным его делает наличие эксклюзивной абилки поверх абакры.</p>\n<p>Что доступно тем, у кого абилки нет, сказано отдельно (id 173153): «То бишь бесцветный могут только усиливать тело и все». Усиление тела — потолок Бесцветного.</p>\n<p>Носитель абилки описан на клеточном уровне. Миколай (id 173155–173157): «Абилка во первых выражается в клетках», «Которые как раз содержат информацию о ней». Отсюда прямой вывод, сделанный тут же (id 173159): «Бесцетные не имеют таких клеток». Слава подтверждает: «Получается нет» (id 173162).</p>\n<p>Происхождение слова рассказано самим Миколаем (2024-05-25, id 173127): «Я короче в одном тгк пока думал о концепции увидел пост про крабовые чипсы. Быстро начал говорить, мол хочу краба. Много раз. Краба, краба, краба, абакр, абакр, абакра. Абакра, да так и назову». Цепочка: краба — краба — абакр — абакра.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0064-S02", "SP-0064--ogranicheniya-i-cena"], "h": "<p>Отдельно сформулированных ограничений и цены за использование в переписке нет. Единственное зафиксированное ограничение — по классу носителя: Бесцветный ограничен усилением тела, поскольку у него нет клеток, несущих информацию об абилке.</p>\n<p>Из эксперимента по превращению Бесцветного в Цветного следует крайне низкая успешность процедуры (id 173165): «Вообще в этом эксперименте только 3 удачных экземпляра / Это командир, волк, Тен( многоликий) / За все 30-50 лет». Что происходит с неудачными экземплярами и какова цена эксперимента для подопытного — в переписке не сказано.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0064-S03", "SP-0064--nositeli"], "h": "<p>Абакра принадлежит всем существам вселенной, разделяя их на Бесцветных и Цветных.</p>\n<p>Названы три удачных экземпляра эксперимента по превращению Бесцветного в Цветного, полученные «за все 30-50 лет»: Командир, Волк, Тен (многоликий) (id 173165). Про Командира сказано отдельно (id 173148): «Также он первый удачный эксперимент для превращение бесцветного в цветной».</p>\n<p>Отдельный носитель полуактивной абакры — отец (см. ниже, версия 3).</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0064-S04", "SP-0064--kak-menyalas-po-versiyam"], "h": "<p>Все три состояния зафиксированы в один день, 2024-05-25, в окне w0035.</p>\n<p><strong>Версия 1 (2024-05-25, id 173114–173129).</strong> Выбор концепции. Миколай перечисляет альтернативу: «Ну типа ты перечислял разные типы способностей», «Мы получается мою берём?», «Где абакра, все дела» (id 173117–173119). Слава: «Дадада» (id 173120). Тут же оговорка о неокончательности названия (id 173123): «Возможно будущем изменим но пока оставим». В этой же версии — история происхождения слова.</p>\n<p>В том же куске Слава перечисляет список сил, который надо записывать (id 173128): «Энергет, прятки, закон, петля, феникс, Тен, волк, дракон, ци, имитатор, спартанец, вампир, драгоценность, бессмерт, жук, лёд, Дилан, граница, солнце», с пометкой «Надо потихоньку записывать а то я по тихонько забываю» (id 173129). Прятки из этого списка — <a href=\"SP-0063.html\">Прятки</a>.</p>\n<p><strong>Версия 2 (2024-05-25, id 173148–173165).</strong> Уточнение механики: деление на Бесцветных и Цветных по наличию эксклюзивной абилки, клеточная природа абилки, отсутствие таких клеток у Бесцветных, эксперимент по превращению и три его удачных экземпляра.</p>\n<p>Здесь же остался незакрытый вопрос Миколая (id 173163): «И их бо́льшее количество?» — ответа в переписке нет.</p>\n<p><strong>Версия 3 (2024-05-25, id 173201–173204).</strong> Миколай вводит понятие «полуактивная абакра». Идея пришла от постороннего материала — ролика на канале утопии про мать, записывавшую в дневнике ненависть к своим детям (по итогу она никого не убивала, её подставил муж). Формулировка Миколая (id 173203): «Может быть у отца была полуактивная абакра. И способность реализовать негатив нанося вред врагу тем самым. Сначала он просто заебался от его криков. Потом заметил что от злости ему больнее и ему понравилось. Он раз в месяц приходил домой и вымещал злость. Он увлёкся и не заметил как это вошло в привычку, он его бил и не навидел чтобы успокоиться».</p>\n<p>Слава в ответ (id 173204) привязывает отца к другой способности — реинкарнации: «каждый раз как он умирал он оказался в новом теле и так на протяжении 1000 лет и так реинкарнируясь он сохранял способности получены в каждом теле и стал типо злодеим». Далее: «по итогу у одной пары родился странный ребенок и после 7 лет этот ребенок убил свою мать и собирался убить и отца но его воспоминания запечатали и дальше ты знаешь историю». И объяснение силы персонажа через тело, а не через абакру: «как он стал сильнейшим благодаря только физической силой потому что хоть он ничего не помнить но все равно есть мышечная память которая сохраняется с ним».</p>\n<p>Полуактивная абакра отнесена к альтернативной вселенной (по навигационной пометке к версии 3: «у отца в альтернативной вселенной»).</p>\n<p>Версии друг друга не отменяют: версия 3 добавляет отдельный подвид, не переписывая деление на Бесцветных и Цветных из версии 2.</p>", "r": [["Прятки", "SP-0063.html"]]}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S05", "SP-0064-S05", "SP-0064--otklonennye-varianty"], "h": "<p>Прямо отклонённого варианта нет. Есть выбор из нескольких: Слава ранее перечислял «разные типы способностей», и в итоге взята концепция Миколая с абакрой (id 173117–173120). Сами отвергнутые типы в этом куске переписки не перечислены.</p>\n<p>Название оставлено условно, с оговоркой Славы (id 173123): «Возможно будущем изменим но пока оставим».</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S06", "SP-0064-S06", "SP-0064--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Абакра — рамка, внутри которой существуют остальные силы, поэтому связана со всем списком id 173128 (Энергет, прятки, закон, петля, феникс, Тен, волк, дракон, ци, имитатор, спартанец, вампир, драгоценность, бессмерт, жук, лёд, Дилан, граница, солнце). Из них в справочнике есть Прятки — <a href=\"SP-0063.html\">Прятки</a>.</p>\n<p>Полуактивная абакра отца соседствует с реинкарнацией (Слава, id 173204) — но как именно они сочетаются в одном носителе, в переписке не сказано.</p>\n<p>Связанные записи, отмеченные в исходнике: Бесцветные и Цветные, Командир, Тезаурус вселенной.</p>", "r": [["Прятки", "SP-0063.html"]]}, {"t": "Пробелы", "a": ["S07", "SP-0064-S07", "SP-0064--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вопрос Миколая «И их бо́льшее количество?» (id 173163) остался без ответа — о чьём количестве речь, из переписки однозначно не следует.</li>\n<li>Не сказано, как проводится эксперимент по превращению Бесцветного в Цветной, кто его проводит и что происходит с неудачными экземплярами.</li>\n<li>Не объяснено, откуда берутся клетки с информацией об абилке и можно ли их приобрести иначе, чем через эксперимент.</li>\n<li>Не описано, что значит «полуактивная» — то есть какая абакра считается активной, а какая пассивной. Классификация не введена.</li>\n<li>Отец не назван по имени; связь его линии с основной вселенной обозначена как «альтернативная вселенная», но устройство этой альтернативы не описано.</li>\n<li>Цена и откат для абакры как системы не заданы (в отличие от отдельных сил, например <a href=\"SP-0063.html\">Прятки</a>, где откат прописан).</li>\n<li>Название зафиксировано как временное; окончательного решения по нему в переписке нет.</li>\n</ul></div>", "r": [["Прятки", "SP-0063.html"]]}, {"t": "Связи — всё вместе", "a": ["SP-0064--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0063.html\">Прятки</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0086.html\">Отец-реинкарнатор</a></li>\n<li><strong>Упомянут в способностях:</strong> <a href=\"SP-0063.html\">Прятки</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0090.html\">Бесцветные и Цветные</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0012.html\">Цветной мир</a>, <a href=\"VS-0014.html\">игра бога</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0064--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-05-25</td>\n<td>173114–173129</td>\n<td>w0035</td>\n<td>Цветной мир (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-05-25</td>\n<td>173148–173165</td>\n<td>w0035</td>\n<td>Цветной мир (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-05-25</td>\n<td>173201–173204</td>\n<td>w0035</td>\n<td>Цветной мир (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0064-abakra.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0064--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0064.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
