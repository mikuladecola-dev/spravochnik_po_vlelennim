<script>const BASE="";const DOCNAME="Альфы";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0106-S01", "MR-0106--ustroystvo"], "h": "<p>Альфа — это субъект своего мира, который «смогли сцапать кусочек силы своего мира, с помощью ритуала или ещё чего» (2025-03-10, id 300898). Получив этот кусочек, он «зародил в себе ядро, которая и вырабатывает энергию».</p>\n<p>Устройство силы альфы описано через отличие от благословенных. У благословенного есть связь — канал к стороннему источнику, и эта связь идёт через мозг. У альфы связи нет: «у них нет связи, их нея сила только их нея, а из-за отсутствия связи напряжения на мозг исчезает, так как через мозг больше ничего не проходит, и теперь они по-сути могут использовать свою силу 24/7» (2025-03-10, id 300898).</p>\n<p>Из того, что сила своя, а не сторонняя, выведены два следствия, названные прямо:</p>\n<ul>\n<li>альфа может лечить и баффать не только себя — «И так как это их нея сила, а не сторонняя, они могут лечить и баффеть не только себя»;</li>\n<li>эффект, созданный альфой, держится сам: «а огонь которым они устроили пожар не исчезнет пока его не потушить или пока альфа не умрёт» (2025-03-10, id 300898).</li>\n</ul>\n<p>Второй разговор (2025-03-13, id 301806) добавляет постоянную защиту как отдельное свойство. Сила альфы всегда активна и в это же время прикрывает носителя: «Они как и мы может использовать свою силу 24/7 без риска повредить мозг. А если сила всегда активна и его защищает, то просто неожиданная атака, на нём не проканает». Прямое следствие, названное в тексте: внезапно напасть на альфу и убить его нельзя.</p>\n<p>Отдельно зафиксировано, что тело альфы — материал для ритуала становления Арбетаром, и в наборе материалов оно названо самым сложным: «самая сложная альфа». В самом обряде тело альфы работает как пресс: «я использую мозг благословенного, чтобы он начал собирать силу. И тело Альфы дабы он его пресовал. А всё остальные компоненты служат активаторами» (2025-03-13, id 301806).</p>\n<p>О сроке жизни сказано одной репликой без пояснения: на вопрос по механике идёт ответ «Ну бессмертным» (2025-03-10, id 300899). К чему именно относится это слово, в переписке не уточнено.</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0106-S02", "MR-0106--naselenie"], "h": "<p>Альфы — сильнейшие существа в своём мире (2025-01-22, id 283839). В той же переписке они названы участниками организации злодеев наряду с благословенными: «В их ней организаций есть Альфы и благословенный» (2025-01-22, id 283835).</p>\n<p>В классификации чужамирцев альфы — одна из трёх категорий: «Чужамирцы делятся на: обычных просто чужемирца с разной анатомии / Существа про них я говорил / Альфы» (2025-03-10, id 300891). В служебной части карточки альфы отнесены к чужамирцам как часть целого.</p>\n<p>Никакой численности, устройства сообщества альф, их отношений между собой или территории в переписке нет. Тело убитого альфы описано снаружи только одной деталью в сцене ритуала: «а в центре тело, какой-то анатомический неправильной» (2025-03-13, id 301806).</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0106-S03", "MR-0106--mesto-vo-vselennoy"], "h": "<p>Альфы стоят в иерархии силы рядом с арбетарами и противопоставлены благословенным.</p>\n<p>Сходство с арбетарами названо прямо: «у альфа и арбетатов похожий силый» (2025-03-13, id 301806) — обе стороны работают 24/7 без риска повредить мозг. Разница по происхождению силы: альфа берёт кусочек силы собственного мира, благословенный получает силу от правителя.</p>\n<p>Противопоставление благословенным идёт по линии «своя сила / чужая сила». Про благословенных в том же монологе: «вся их сила, и не их вообще. Жалкий благословенный получивший силу лишь потому что понравились правителем, но сами они эту силу не добывали». Благословенного убить легко, потому что «благословенный не могут использовать благословенния долга, поэтому можно просто неожидано напасть и убить и всё». У альфы этот способ не работает.</p>\n<p>Отношение к апостолам зафиксировано только через один рабочий факт: апостолы охотятся на альф и способны довести альфу до полусмерти. Чтобы добыть тело альфы, арбетар ждал именно апостольского промаха: «поэтому пришлось ждать пока какой-нибудь апостол упустить альфю. При этом доведя его до полусмерти. И это было долго» (2025-03-13, id 301806). Там же — оценка апостолов от того же говорящего: «свою работу они выполняють слишком идеально. Ну даже в идеальной системе есть единичные пробои».</p>\n<p>В списке материалов ритуала становления Арбетаром альфа стоит рядом с парой чужемирцев, ещё одним благословенным и человеком-проводником с чистой душой.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0106-S04", "MR-0106--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-01-22 (окно w0072, id 283835–283842).</strong> Альфы вводятся одной строкой в разговоре про мотивы организаций злодеев: в организации «есть Альфы и благословенный». На вопрос «альфы?» дано определение: «Альфы сильнейший существа в своём мире». Больше в этом окне ничего не сказано; в тех же сообщениях подтверждено, что разные миры есть, а на вопрос про существование дьявола дан ответ «Возможно».</p>\n<p><strong>Версия 2 — 2025-03-10 (окно w0079, id 300891–300895).</strong> Альфы включены в классификацию чужамирцев третьим пунктом. Здесь же прежнее определение объявлено устаревшим — оно дано в прошедшем времени: «Альфы раньше означали сильнейшей разумной субъекты в своём мире, которая имеет, что-то похоже на благословенния». Дальше автор отделяет альф от благословения: «И я думал что это похожее на благословения? И теперь я допер». То есть на 2025-03-10 сходство альфы с благословенным признано только внешним.</p>\n<p><strong>Версия 3 — 2025-03-10 (окно w0079, id 300896–300907).</strong> Развёрнутая механика в одном сообщении (id 300898): кусочек силы своего мира, взятый ритуалом или иначе; ядро, вырабатывающее энергию; отсутствие связи; отсутствие нагрузки на мозг; работа 24/7; способность лечить и баффать не только себя; самостоятельность созданного эффекта (огонь держится, пока его не потушат или пока альфа не умрёт). Следом реплика «Ну бессмертным» (id 300899).</p>\n<p><strong>Версия 4 — 2025-03-13 (окно w0080, id 301806–301807).</strong> Альфа появляется внутри прозаического фрагмента — монолога арбетара, который рассказывает пойманному человеку, как готовил ритуал. Здесь добавлены: постоянная защита носителя и невозможность внезапной атаки; сходство силы альфы и арбетара; способ добычи тела (ждать, пока апостол доведёт альфу до полусмерти); роль тела альфы в обряде (прессует силу, собранную мозгом благословенного); статус альфы как самого сложного материала — «если бы у меня были сомнения, то я бы ещё на Альфе остановился».</p>\n<p><strong>Версия 5 — 2025-03-13 (окно w0080, id 301821).</strong> Тот же фрагмент в более полной версии, начинающейся раньше по сюжету — с прихода арбетара в деревню Ливия и с расшифровки слова: «Арбетар(швецский; на русском трудяга)». По части альф текст повторяет версию 4 дословно, нового про них не добавляет.</p>\n<p>Ни одна версия не отменяет предыдущую целиком: определение «сильнейшие существа в своём мире» из версии 1 не опровергается, снимается только приравнивание альфы к благословенному (версия 2).</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0106-S05", "MR-0106--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Карточка заведена как мир, но во всех пяти версиях альфы описаны как разряд существ, а не как отдельный мир. Свой мир альфы упоминается только как источник «кусочка силы»; никаких сведений о нём — устройства, названия, границ — в переписке нет.</li>\n<li>Ритуал, которым альфа берёт кусочек силы своего мира, не описан: сказано «с помощью ритуала или ещё чего», состав и порядок не названы.</li>\n<li>Что такое ядро физически, где оно находится и можно ли его отнять или разрушить, не сказано.</li>\n<li>Реплика «Ну бессмертным» (id 300899) не раскрыта: относится ли она к альфам, к сроку их жизни или к чему-то ещё, в переписке не сказано.</li>\n<li>Пределы силы альфы не заданы: сила названа своей и постоянно активной, но насколько она сильна в сравнении с апостолом или арбетаром по величине, а не по режиму работы, не обсуждалось.</li>\n<li>Не сказано, каким образом апостолы доводят альфу до полусмерти, если внезапная атака не проходит.</li>\n<li>Организация злодеев, в которой альфы состоят вместе с благословенными (2025-01-22), дальше в связи с альфами не появляется; её состав, цели и отношение альф к ней остались нерешёнными.</li>\n<li>Отдельные альфы как персонажи не названы: имён, числа и биографий нет, тело в сцене ритуала безымянное.</li>\n<li>Вариант написания «альфя» встречается только в косвенной речи арбетара («упустить альфю»); отдельной формой это нигде не оговорено.</li>\n</ul></div>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Второе: своего мира у альф нет нигде. Про альф в реестре три записи — <code>MR-0106</code> (эта), <code>GR-0018</code> «Альфы» и <code>PS-0281</code> «Арбетары и Альфа» (три ссылки, статья есть, база 7 646), — и ни одной про мир, из которого альфа берёт «кусочек силы». Карточка заведена как мир, а мира в базе нет ни под каким id. Это не пробел статьи, это пустое место в реестре.</p></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0106--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0006.html\">Организация злодеев</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0006.html\">Организация злодеев</a>, <a href=\"GR-0018.html\">Альфы</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0106--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-01-22</td>\n<td>283835–283842</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-10</td>\n<td>300891–300895</td>\n<td>w0079</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-10</td>\n<td>300896–300907</td>\n<td>w0079</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-13</td>\n<td>301806–301807</td>\n<td>w0080</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-13</td>\n<td>301821–301821</td>\n<td>w0080</td>\n<td>Апостол (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0106-alfy.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0106--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0106.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["MR-0106-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/MR-0106/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дороже всего — <code>SL-0089</code> «Список категорий сил (Благословенный, Арбетары, Альфы, Чужемирцы, Владельцы артефактов, Фантазёры)»: четыре ссылки, статьи нет, в базе всего 1 753 знака. На него опираются <code>MR-0146</code> «Силы мира» (три ссылки), <code>MR-0107</code> «Иерархия силы» (четыре), <code>MR-0105</code> «Организация злодеев» (четыре) и <code>GR-0013</code> «Благословенные». Это единственная запись, где альфы стоят не сами по себе, а в одном ряду с пятью остальными категориями, — и именно там, где положено лежать сравнению, лежит меньше двух тысяч знаков. Пока список не разобран, вопрос «насколько альфа сильнее или слабее арбетара и апостола по величине» некуда даже задать: он про соотношение категорий, а карточки соотношения нет.</p>\n<p>Второе: своего мира у альф нет нигде. Про альф в реестре три записи — <code>MR-0106</code> (эта), <code>GR-0018</code> «Альфы» и <code>PS-0281</code> «Арбетары и Альфа» (три ссылки, статья есть, база 7 646), — и ни одной про мир, из которого альфа берёт «кусочек силы». Карточка заведена как мир, а мира в базе нет ни под каким id. Это не пробел статьи, это пустое место в реестре.</p>\n<p>Третье, дешёвое: <code>ID-0126</code> «Нераскрытые термины: альфа, благословенный, силы зверя, классификация, арбетары, аномалия, существа» — 3 566 знаков, статьи нет, ноль ссылок кроме <code>MR-0146</code>. Альфа и арбетары стоят в этом списке рядом; запись висит без связей.</p>\n<h3>С чего начать</h3>\n<p>В базе, и в первую очередь — проверить одно утверждение статьи. Здесь сказано, что организация злодеев «дальше в связи с альфами не появляется». При этом <code>MR-0105</code> «Организация злодеев» — четыре ссылки, статья есть, база 4 924 — построена ровно на том же окне 2025-01-22 и разбирает состав: «В их ней организаций есть Альфы и благословенный» (283835), определение альф (283839), подтверждение множественности миров (283838, 283840). Плюс <code>GR-0006</code> и <code>PS-0185</code> «Глава организации злодеев». Связь есть и разобрана — просто в соседней карточке; сюда она не подтянута.</p>\n<p>Второе место в базе — ритуал. <code>SP-0198</code> «Ритуал становления Арбетаром» (две ссылки, статья есть, база 48 879) и <code>PS-0226</code> «Арбетары» (две ссылки, статья, 20 681). Сцена 301806/301821, из которой сюда взято, что тело альфы работает прессом и что это «самая сложная альфа», разобрана там подробнее; состав материалов и порядок обряда искать надо в <code>SP-0198</code>, а не в архиве.</p>\n<p>Единственное, за чем надо идти в архив, — реплика «Ну бессмертным» (id 300899). В источники этой статьи взят диапазон 300896–300907, но цитаты доходят только до 300899: восемь сообщений окна w0079 не использованы ни одной строкой. То же с диапазоном 300891–300895, где процитированы 300891 и 300892. Смотреть надо именно хвосты этих двух окон — к чему относится «бессмертным», скорее всего решается в 300900–300907.</p>\n<h3>Как развивалось</h3>\n<p>2025-01-22 — термин появляется строкой в перечне: в организации злодеев «есть Альфы и благословенный», на переспрос дано определение в одну фразу. 2025-03-10 — возврат через полтора месяца: старое определение не отменено, но переведено в прошедшее время («раньше означали»), и снято приравнивание альфы к благословенному. В тот же день, в соседнем окне, — механика одним большим сообщением: кусочек силы, ядро, отсутствие связи, работа 24/7, эффект держится сам. 2025-03-13 — альфа появляется уже не как понятие, а как материал: в монологе арбетара это тело в центре ритуального круга, «какой-то анатомический неправильной». Строка в списке — определение — механика — тело в сцене; ни один шаг не отменяет предыдущего целиком.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Правило про происхождение силы названо прямо и из него выведены следствия: сила альфы своя, а не сторонняя, — значит, он может лечить и баффать не только себя, и значит, созданный им огонь держится, пока его не потушат или пока альфа не умрёт. Собственность на силу здесь работает как физическое свойство с последствиями. Для арбетара режим объявлен таким же — «у альфа и арбетатов похожий силый», обе стороны работают 24/7 без нагрузки на мозг, — но откуда у арбетара сила, своя она или собранная из чужого (мозг благословенного, тело альфы), не сказано. И те же два следствия для него не проговорены: может ли арбетар лечить не только себя и держится ли сам по себе созданный им эффект. Правило выведено для одного носителя и не выведено для соседнего, про которого прямо сказано, что у него так же.</p>\n<h3>Отклик</h3>\n<p>Сильное здесь — то, что вся механика выведена из одного различения: своя сила или чужая. Не «альфа мощнее», а «сила его собственная», и дальше всё честно следует: раз своя — можно направить на другого, раз своя — не гаснет, когда отвернулся, раз своя — не идёт через мозг и не изнашивает голову. Это не набор способностей, а одно допущение, отработанное до конца. И оно же вывернуто в мотив: «жалкий благословенный получивший силу лишь потому что понравились правителем, но сами они эту силу не добывали». Разница между добытым и подаренным здесь не метафора и не мораль — она определяет, кого можно убить внезапной атакой, а кого нельзя. Отдельно зацепило, как арбетар добывал тело: ждал, пока апостол упустит альфу, доведя до полусмерти, «И это было долго», — потому что «даже в идеальной системе есть единичные пробои». Целый сюжет о человеке, который годами ждёт чужой редкой ошибки, уложен в две строки внутри монолога о другом.</p></div>", "r": []}];</script>
