<script>const BASE="";const DOCNAME="Неуязвимость";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0269-S01", "SP-0269--mehanika"], "h": "<p>Неуязвимость — вторая из основных способностей Изба, названная при разборе появления этого персонажа (2026-06-02, id 487017–487018).</p>\n<p>Описание дословно: «Неуязвимость. Он достаточно часто прошибает собой каких нибудь злодеев, монстров, неудачных экспериментов Нимба и т. Д. И при этом остаётся без царапинки. Ну в моё фантазии где я как бы кручу историю. У него так и не разу не пошла кровь».</p>\n<p>Способность описана не через порог прочности, а через практику: Изб используется как таран — прошибает собой злодеев, монстров, неудачные эксперименты Нимба — и после этого остаётся «без царапинки». Планка задана через отсутствие крови: у него «ни разу не пошла кровь». Слава отдельно оговорил, откуда это известно: «Ну в моё фантазии где я как бы кручу историю» — то есть это итог прокрученных в голове сцен, а не отдельно сформулированное правило.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0269-S02", "SP-0269--ogranicheniya-i-cena"], "h": "<p>Постоянных ограничений в переписке не названо: ни предела нагрузки, ни расхода, ни условий, при которых неуязвимость не работает.</p>\n<p>Единственный зафиксированный отказ — сюжетный, в арке слома: кровь у Изба идёт впервые, и не от злодея или монстра, а от камня, брошенного хейтером (2026-06-02, id 487065–487067).</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0269-S03", "SP-0269--nositeli"], "h": "<p>Единственный носитель, названный в переписке, — Изб. В файле записи неуязвимость отмечена как часть Изба.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0269-S04", "SP-0269--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2026-06-02 (id 487017–487018).</strong> Первое описание, в перечне основных способностей Изба вместе с полётом (<a href=\"SP-0268.html\">Полёт</a>) и сверхчеловеческой силой. Здесь же названа причина, по которой Изб получил не одну способность: изначально Слава «просто хотел создать летающего персонажа», но «потом я запихнул его в Столпы героев. И поэтому ему нужно было добавить ещё способность, дабы он не выглядит ущербно из-за Графа и Нуара».</p>\n<p><strong>Версия 2 — 2026-06-02 (id 487065–487067).</strong> Выбран «путь сломать Изб». В арке слома неуязвимость впервые даёт сбой: «Его идеалы падут. Он падёт с небес потеряв способность летать. У него пойдёт кровь из-за брошенного камня хейтером. Его обкидают грязью. И ему придётся в этом состоянии сразится с злодеем». Кровь, которой не было ни разу за все тараны сквозь монстров, идёт от камня в руках хейтера. Дальше: «Конечно он выживет и дальше преодолеть эти кризисы. Но долгое время будет недееспособным».</p>\n<p>Версия 1 не отменена: описание неуязвимости из неё остаётся, версия 2 добавляет момент, когда она отказывает.</p>", "r": [["Полёт", "SP-0268.html"]]}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0269-S05", "SP-0269--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Неуязвимость названа второй в тройке основных способностей Изба, вместе с полётом (<a href=\"SP-0268.html\">Полёт</a>) и сверхчеловеческой силой (поднимать многотонные конструкции, двигаться со скоростью, позволяющей прошибать противников, одним ударом рассеивать облака).</p>\n<p>Неуязвимость и сверхчеловеческая сила в описании работают в паре: и там и там речь о том, что Изб прошибает собой противников — сила даёт скорость тарана, неуязвимость даёт отсутствие последствий для самого Изба.</p>\n<p>В арке слома неуязвимость и полёт отказывают в одной сцене: Изб падает с небес и получает кровь от камня.</p>", "r": [["Полёт", "SP-0268.html"]]}, {"t": "Пробелы", "a": ["S06", "SP-0269-S06", "SP-0269--probely"], "h": "<div class=\"gaps\"><ul>\n<li>От чего именно защищает неуязвимость — от удара, от температуры, от способностей, от чего-то ещё — не разобрано; названы только столкновения телом.</li>\n<li>Есть ли у неуязвимости предел и что его пробивает — не сказано; отказ в арке слома описан как событие, а не как правило.</li>\n<li>Почему камень хейтера пробивает то, что не пробивали монстры и неудачные эксперименты Нимба, — в переписке не объяснено.</li>\n<li>Восстанавливается ли неуязвимость после арки слома — не сказано; сказано только, что Изб выживет, преодолеет кризисы и «долгое время будет недееспособным».</li>\n<li>Как неуязвимость соотносится с плёнкой сверхлюдей (<a href=\"SP-0272.html\">Плёнка сверхлюдей</a>), введённой в тот же день, — в переписке не обсуждалось.</li>\n<li>Есть ли неуязвимость у кого-то ещё, кроме Изба, — не упоминалось.</li>\n<li>К какой вселенной запись относится, в файле помечено как «неясно»; привязка идёт по дате объявления.</li>\n</ul></div>", "r": [["Плёнка сверхлюдей", "SP-0272.html"]]}, {"t": "Связи — всё вместе", "a": ["SP-0269--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0268.html\">Полёт</a>, <a href=\"SP-0272.html\">Плёнка сверхлюдей</a></li>\n<li><strong>Упомянут в способностях:</strong> <a href=\"SP-0268.html\">Полёт</a>, <a href=\"SP-0272.html\">Плёнка сверхлюдей</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0269--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-06-02</td>\n<td>487017–487018</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-02</td>\n<td>487065–487067</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0269-neuyazvimost.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0269--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0269.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
