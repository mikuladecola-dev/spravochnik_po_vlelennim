<script>const BASE="";const DOCNAME="Серые странники";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0098-S01", "GR-0098--chto-eto"], "h": "<p>Серые странники — существа вселенной «Новый мир», описанные в переписке одной строкой: «загадочные существа, не принадлежащие ни к одной из сторон и преследующие свои собственные цели» (2024-06-04, id 175848).</p>\n<p>По классификации базы это группа — раса-сообщество нейтралов, не принадлежащих ни одной из сторон. Но нужно оговорить, чем эта запись является на деле: в переписке Серые странники не разрабатывались. Это один пункт из большого перечня существ, который Миколай прислал списком (2024-06-04 01:49, id 175848), — перечень разбит на «Тёмная сторона», «Светлая сторона» и «Смешанные или нейтральные персонажи», Серые странники стоят там первым номером в третьей части. Никакого текста, кроме процитированной строки, у них нет.</p>\n<p>Сама формулировка списка помечена в базе как машинная вставка. Отдельно отмечено в источнике: «Формулировка пришла из машинной вставки 175848, но принята автором в 175863 — берём как материал с оговоркой». В мир Серые странники попали именно через авторский отбор: из всего списка Слава принял только их, ответив спустя пять с лишним часов паузы: «Чёт ничего не понравилась кроме серых странников» (2024-06-04 07:00, id 175863).</p>\n<p>Таким образом, статья описывает не разработанную группу, а принятое название с однострочным определением. Всё, что известно, — что они существуют в мире, что они нейтральны и что у них есть собственные цели. Какие это цели, в переписке не сказано.</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S02", "GR-0098-S02", "GR-0098--kak-menyalas"], "h": "<p><strong>2024-06-03, id 175718–175813</strong> — контекст, в котором Серые странники затем появились. Слава объявляет мир (id 175722, 175759) и его устройство: «3 энергии: Темная, Светлая, Природная (животным и растениям). Темная и светлая всю жизнь борется в человеке и в некоторых существ» (id 175763); жанр — «страшилка с приземленными силами» (id 175764). У любого существа, способного думать, энергия «либо смесь либо темная или светлая», у неспособного думать — природная (id 175790). Ставится задача, из которой затем вырос список: «И здесь вопрос каких существ запихать в темную сторону или светлую или как людей смесь. Типо надо существ придумывать» (id 175783–175784). В этот же вечер мир наполняется собственными существами Славы — ночными охотниками (id 175797) и Поротаями (id 175810).</p>\n<p><strong>2024-06-04 01:49, id 175848</strong> — Миколай присылает список существ по трём разделам. В разделе «Смешанные или нейтральные персонажи» первым пунктом: «Серые странники — загадочные существа, не принадлежащие ни к одной из сторон и преследующие свои собственные цели».</p>\n<p><strong>2024-06-04 07:00, id 175863</strong> — Слава отбирает из списка ровно один пункт: «Чёт ничего не понравилась кроме серых странников». Это единственное авторское высказывание о Серых странниках во всей переписке. Ни развития, ни уточнений после него не следует: следующим сообщением (id 175864) Слава переходит к другому виду — провидцам.</p>\n<p><strong>2024-06-05, id 176191</strong> — Миколай спрашивает: «А в чёрно белом мире придумал что-то ещё?» Ответа на этот вопрос в переписке нет.</p>\n<p><strong>2024-06-06, id 176473</strong> — последнее наполнение мира в этом окне (роль ГГ как хранилища тёмных существ). Серые странники здесь не упоминаются.</p>", "r": []}, {"t": "Отклонённые варианты", "a": ["S03", "GR-0098-S03", "GR-0098--otklonennye-varianty"], "h": "<p>Вместе с Серыми странниками в списке 175848 были предложены и отвергнуты (2024-06-04, id 175848 и 175863 — «Чёт ничего не понравилась кроме серых странников»):</p>\n<p>Тёмная сторона — тенеморфы (принимающие облик теней создания тёмных колдунов), кошмарные твари (порождения страхов и негативных эмоций), некромантские слуги (оживлённые трупы и скелеты), энергетические вампиры (питающиеся жизненной силой и эмоциями), тёмные шифтеры (оборотни и метаморфы для обмана и проникновения).</p>\n<p>Светлая сторона — целители, светящиеся стражи (создания из чистой светлой энергии), мудрые древни (древовидные существа-советчики), звёздные духи (связанные с небесными телами, помогают в навигации и предсказаниях), животные-компаньоны.</p>\n<p>Смешанные или нейтральные — вместе с Серыми странниками предлагались стихийные духи (воплощения огня, воды, земли, воздуха), механические конструкты (разумные искусственные создания со свободой воли), космические сущности (древние и могущественные, с непонятными смертным мотивами), полукровки (рождённые от союза разных рас или носителей разных энергий).</p>", "r": []}, {"t": "Пробелы", "a": ["S04", "GR-0098-S04", "GR-0098--probely"], "h": "<div class=\"gaps\"><ul>\n<li><strong>Поимённого состава нет.</strong> Ни одного участника группы в переписке не названо; список членов в плане пуст.</li>\n<li><strong>Внешность не описана.</strong> Ни в списке, ни в ответе Славы нет ни слова о том, как Серые странники выглядят. Это притом что задача формулировалась именно так: «Ну вообще и про внешку и про особенный черты» (2024-06-03, id 175786).</li>\n<li><strong>Способности не названы.</strong> Ни общих, ни индивидуальных. Раздел «Общие способности группы» писать не из чего.</li>\n<li><strong>Различия между участниками не обсуждались.</strong> Внутреннего разнообразия группы в переписке нет.</li>\n<li><strong>Иерархии нет.</strong> Ни вожаков, ни ступеней, ни устройства сообщества — не упомянуто. (Ср. с Поротаями, у которых Слава сразу задал деление на низших и высших, id 175810; у Серых странников ничего подобного не сказано.)</li>\n<li><strong>Численность не названа.</strong> Неизвестно даже, много их или мало.</li>\n<li><strong>Цели не раскрыты.</strong> Сказано, что они «преследующие свои собственные цели», но какие именно — в переписке не сказано.</li>\n<li><strong>Тип энергии прямо не приписан.</strong> Серые странники стоят в разделе «Смешанные или нейтральные», но соотнесения их с введённой Славой системой трёх энергий (смесь? природная?) в переписке нет.</li>\n<li><strong>Отношения с другими группами не установлены.</strong> Ни с колдунами, ни с ночными охотниками, ни с Поротаями, ни с провидцами связь не названа. Отдельно: слово «серые» встречается в переписке до появления Серых странников — в описании того, что видит колдун, глядя на человека («Типо увидеть цвет серый, серая белый, темная серый», 2024-06-03, id 175782), и в реплике Миколая о тёмных, которые «возможно будут манипулировать серыми и делать их колдунами с нужными качествами» (2024-06-03, id 175795). Оба раза речь о людях смешанной энергии, а не о Серых странниках; связь между этими «серыми» и Серыми странниками в переписке не проведена и остаётся нерешённой.</li>\n<li><strong>Развития после отбора нет.</strong> К Серым странникам авторы больше не возвращались — ни 2024-06-05, ни 2024-06-06.</li>\n</ul></div>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0098--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0098.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0098-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0098/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>По числам самая дорогая дыра рядом — <code>ID-0066</code> «Утилитарная призма для тёмных и светлых»: статьи нет, база 4 915, две входящие ссылки, по тексту поминается в шести статьях «Нового мира». Этой статьи она касается ровно одной точкой, но важной: в 175795 сказано, что тёмные «возможно будут манипулировать серыми и делать их колдунами», и эти «серые» — люди смешанной энергии. Пока у <code>ID-0066</code> нет страницы, развести их с Серыми странниками негде, а омоним стоит прямо в названии группы.</p>\n<p>Дальше — то, что дорого именно здесь. Всё содержание статьи — не о существах, а о процедуре: чужой список, авторский отбор одной строкой. Записи, которые эту процедуру называют, статей не имеют: <code>SL-0016</code> «Роли в соавторстве» (база 2 309, 2024-06-14 — Слава про себя: придумывал лор и основу, Миколай отвечает, что реализовать хочет сам) и <code>SL-0015</code> «Как идёт создание: анализ, потом синтез» (4 997, 2024-06-10). У обеих по одной входящей ссылке. Отдельно: сам факт машинности источника задокументирован только в <code>kb/sluzhebnoe/mashinnye_vstavki.md</code>, строкой про 175845–175850, — сущности у него нет вообще, а статья на этот факт опирается дважды.</p>\n<h3>С чего начать</h3>\n<p>Не в архиве. По базе Серые странники встречаются ровно в трёх местах — <code>PS-0090</code> (6 075, и это тот же список плюс та же реплика 175863), <code>MR-0012</code> и запись машинных вставок; в других окнах слово не появляется. Дописывать статью нечем, и это её потолок, а не недоработка — важно, чтобы правка не пошла в сторону «дособрать материал».</p>\n<p>Что реально можно сделать в базе, всё про омоним: <code>MR-0013</code> «Три энергии» (6 914) и <code>PS-0087</code> (7 080) — там лежит цветовой словарь колдунского зрения, «Типо увидеть цвет серый, серая белый, темная серый» (175782); <code>ID-0066</code> (4 915) — вторая половина того же узла. Разбирать надо оттуда, а не отсюда: здесь для этого нет ни одной строки.</p>\n<p>Если идти в архив, то не за странниками, а за процедурой отбора — окно w0037 (177470–181869, 2024-06-10 — 06-16), где роли соавторов проговорены прямо. Само окно этой статьи, w0036 (174499–177144, 410 сообщений), помечено прочитанным целиком.</p>\n<h3>Как развивалось</h3>\n<p>3 июня, вечер — поставлена задача: «каких существ запихать в темную сторону или светлую или как людей смесь» (175783–175784). В тот же вечер Слава закрывает её сам — ночные охотники, Поротай.</p>\n<p>4 июня 01:49 — задача закрывается ещё раз, но чужой рукой: список из пятнадцати пунктов (175848). Серые странники — первый номер в третьей части.</p>\n<p>07:00, через пять часов с лишним, — отбор: «Чёт ничего не понравилась кроме серых странников». Это одновременно и принятие, и ограничение: принято ровно одно название и ноль свойств.</p>\n<p>07:01, следующей минутой, — внимание уходит к своим провидцам. 5 июня — вопрос без ответа, 6 июня мир пополняется ролью ГГ, странников там нет.</p>\n<p>Возврата не было. Между принятием и уходом — одна минута.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>У каждого вида, придуманного Славой самим, названа цена или устройство, и все три — в пределах тех же двух суток: у ночных охотников свет, который мучает, и вытекающие из него укрытия (175797); у Поротаев деление на низших и высших (175810); у провидцев безумие и суицид как плата за способность (175864). Для вида, взятого извне, того же не проговорено: чем оплачивается нейтральность Серых странников и есть ли у неё вообще цена — не названо. Правило выдержано трижды подряд и один раз не применено — там, где формулировка пришла не от автора.</p>\n<h3>Отклик</h3>\n<p>Интересны здесь не странники, а жест. Пять с половиной часов, пятнадцать предложенных существ, ответ в семь утра одной строкой — и ни слова о том, почему четырнадцать мимо и почему этот один остался. При этом выбор точный: в списке всё остальное — узнаваемые полки (некроманты, целители, духи стихий, полукровки), а взято единственное, у чего нет функции, есть только отказ принадлежать. Это ровно та вакансия, которую собственные виды Славы не закрывали: тёмные, светлые и каменные у него были, нейтралов не было.</p>\n<p>И мне нравится, что статья не стала это дотягивать. Она прямо говорит: группы нет, есть принятое название с одной строкой, — и не изображает содержания. Пустая запись, честно помеченная пустой, полезнее полуправдоподобной. Работать с ней при этом нечем, и статья это тоже не скрывает.</p></div>", "r": []}];</script>
