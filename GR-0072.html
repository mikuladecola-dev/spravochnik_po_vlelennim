<script>const BASE="";const DOCNAME="Амофцы";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0072-S01", "GR-0072--chto-eto"], "h": "<p>Разведка числит «Амофцев» группой, но по переписке это не организация и не объединение с составом и целями. Это общее название-класс: слово, которым соавторы решили называть всех существ, способных пользоваться Оам. Термин охватывает все расы вселенной сразу и не является отдельной силой внутри неё.</p>\n<p>Вопрос поставил Слава (2025-11-05 09:59, id 382100): «Как вообще называть существ что могут пользоваться Оам?» Дальше идёт перебор вариантов, растянутый на день, и остановка на форме «амофцы» с оговоркой «Ну давай пока это» (382222). Название принято как временное.</p>\n<p>Оам, от которого образовано слово, описан в тех же переписках как энергия-частицы, прилетевшие с метеоритами: «Это мелкий крупицы летающий в воздухе» (2025-11-05, id 382109). Миколай при обсуждении названия вспомнил другое свойство: «ну оам это че, я чет помню он как туман распространялся» (382106); Слава на этом основании отверг вариант «туманности» — «Они же не как не связаны с туманнам» (382105).</p>\n<p>Отдельно зафиксировано расхождение письма и чтения. Миколай: «а писать амовцы» (382213), «а так читать» (382214) — то есть пишется «амовцы», читается «амофцы». Какая из форм считается основной для записи, в переписке не решено; финальное написание не зафиксировано.</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0072-S02", "GR-0072--sostav"], "h": "<p>Поимённого состава у класса нет — список участников в плане пуст, и в переписке никого не называют «амофцем» лично.</p>\n<p>В тех же файлах базы перечислены расы и типы существ, про которых сказано, что они пользуются Оам или мутировали под его воздействием: апостолы, аскизы, дети мирового древа, азуриэль, поротай, вампиры, коты. Слово «амофцы» ни к одной из этих рас в переписке напрямую не приложено — соавторы обсуждали термин отдельно от списка рас, и связь «эта раса = амофцы» вслух не проговорена. Ниже расы описываются как то, из чего складывается класс по определению («существа что могут пользоваться Оам»), но сам термин к ним авторами не привязан.</p>\n<p>Общее правило, покрывающее весь класс, дано Славой (2025-10-22, id 377634): «Все монстры это мутированный под воздействием Оам».</p>", "r": []}, {"t": "Общие способности группы", "a": ["S03", "GR-0072-S03", "GR-0072--obschie-sposobnosti-gruppy"], "h": "<p>Механика Оам расписана Славой одним большим сообщением (2025-10-20 14:29, id 376401) и дополнена позже.</p>\n<p>Базовый уровень, общий вообще для всех:</p>\n<p>«Все могут поглощать Оам при вдохе и выделять его при выдохе» (2025-10-20, id 376429).</p>\n<p>Поглощение идёт двумя путями — «Человек вдыхает Оам ( то есть поглощает, также поглощения может идти просто и через кожу, но более быстрый и способ но который мы можем хоть как-то повлиять)». Дальше Оам «по кровеносной системе вместе с кислородом проходит через всё тело, где-то оседая зависима от человека».</p>\n<p>Ёмкость индивидуальна: «у каждого человека своя ёмкость Оам». Если накопилось больше ёмкости, «то Оам выходит через споры, с выдохом и просто через кожу либо другие способы выделением». Выпуск быстрее набора: «Выпуск лишний Оам происходит чуть быстрее чем поглащения».</p>\n<p>Само по себе наличие Оам ничего не даёт: «В каждым человеке есть Оам но использовать его не как нельзя». Переход в состояние пользователя происходит через передозировку. Если человек поглотит что-то с большой концентрацией Оам — воду либо воздух — «Его тело просто не успевает выпускать Оам», и исходов два:</p>\n<ul>\n<li>«Первый: Либо из-за большого количества Оам его лёгкий или сосуд лопаются, либо Оам просто остановит сердца либо Оам из-за своей токсичности убьет человека.»</li>\n<li>«Второй: человеку удаётся почувствовать и обуздать Оам. Сдерживая Оам, чтобы он не навредил телу. Сдерживать до тех пор пока избытки Оам не выйдут естественным путём.» После выхода избытков «Человек сможет пользоваться Оам ведь он уже почувствовал и сдерживал Оам».</li>\n</ul>\n<p>Отдельно оговорено, что это правило для людей: «У животных это происходит более инстинктивно. Поэтому шанс выживаемости у них больше чем у людей. Но они не могут раскрыть весь потенциал.»</p>\n<p>Верхняя ступень способностей описана как редкость (2025-10-20, id 376429): «Некоторые существа способны контролировать Oам, впитывая его и выделяя по своему желанию. Это одна из самых редких и ценных способностей.»</p>\n<p>Историческая часть: когда-то Оам был смертелен для всех. При падении метеоритов «из этих небесных тел выпустились в воздух, триллион неизвестных частиц. Невидимых и неосязаемых также как и заряженный частицы, но они есть». «Лёгкие заполнялось Оам и медленно разрывались на куски», выживавшие «были способны прожить хотябы 30 лет, а после умерали». Способность существовать рядом с Оам появилась не сразу: «Пока у людей не возник иммунитет во время эволюции и адаптации, как и у других животных». Нынешнее состояние — «Долго время для живых организмов была токсичной. Но после адаптации они стали нейтральными».</p>", "r": []}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0072-S04", "GR-0072--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p>Расы, описанные Славой в блоке 376401–376402 (2025-10-20) и повторно вставленные в разговор о названии (2025-11-05, id 382108):</p>\n<p><strong>Апостолы.</strong> «Это люди, у которых в утробе матери мутировало нервную систему мозг и глаза. Из-за этого их ней пять чувств, работоспособность мозга, реакция, точность выше чем у обычного человека в несколько раз.» Путь к Оам у них другой: «Обуздать Оам они могут без поглощения огромного количества Оам. Им достаточно пережить одну эмоциональную ситуацию, и они неосознанно воспользуются Оам. И дальше они могут пользоваться им без проблем.» Отдельная способность — белые глаза: «Также они могут использовать белый глаза направив туда Оам. После активации белых глаз то для них время замедляется ( но они не становятся быстрее) и всех их чувства в улучшаются и они становятся сверх чувствительными. Зрения слух осязания запах и вкус.» Цена — «Из-за и боль они ощущают больнее». Плюсы — «зато у них словно всё на ладони они ощущать и видят всё что находиться вокруг. И способны словно предсказывать движение противников по слуху или зрению. И становятся невероятно точными». Итог: «у них лучший контроль Оам».</p>\n<p><strong>Аскизы.</strong> Происхождение через матку: «Маток Аскизы была просто Аксолотлой. Но после в водоём, где она жила упал метеорит и под огромным воздействием Оам она мутировала и начала производить Оам.» Сами аскизы — «Навечно Дети лет 7-10 на вид с белоснежной кожей,с розовыми оттенками ( или другими оттенками) и с чертами аксолотлы». Они не стареют, у них быстрая регенерация и «зверский аппетит»: «Они могут съесть человека целиком за пару минут. У них инстинкт голода выше разума. Они не чувствуют боли. И разумом они всегда как дети.» Матка «выделяет их из яиц подобное муравьиной матки», ростом 4 метра и такая же в ширину, «больше похожая на червя с огромными количествами лапок», кожа такая же белоснежная.</p>\n<p><strong>Дети мирового древа.</strong> «Произошли от мутировшого дерева из-за Большого количества Оам.» Внешность и устройство: «Это гуманноидный деревянный существо с оранжевой сердцевинной, в котором как раз и хранится Оам. Они могут изменить образ на человеческий.» Прочность задана через сравнение с апостолами: «Хрен ты их пробьешь, не кто из апостоловы не сможет нормально их ранить, а если ранят они будут регенерировать». Физически — «сверхсильный (сильнейший наверное в физическом плане)». Передвижение — «в земле и внутри деревьях». Огонь: «Огонь им не вредит. Сам огонь на них тухнет.» Бой — «они могут выпускать корни туда сюда ими драться».</p>\n<p><strong>Азуриэль.</strong> Описан отдельно, по репликам Славы. Внешне — «Гуманоид человеческого роста синий кожей( не точно может розовый) с острыми ушами как у эльфа», «Также на лице красивый узоры разного цвета, который могут меняться в зависимости от эмоций», одежда зимняя, «Сам он гибкий». Первое название способности — эмпатия, «Прекрасно ощущать намерения». Затем в текст вставлена переформулировка с пометкой «Слава дондоков»: «Азуриэль: Нейро-сканер. Его способность это не эзотерическая эмпатия, а гиперразвитое чувство, позволяющее напрямую считывать и интерпретировать биоэлектрическую активность нервной системы других существ.» Ограничение: «находясь в толпе он теряется и не может сконцетрироваться». Происхождение расы: «Это было группа лиц, чей дети мутировали полностью превратившись Азуриэль. Они с рождения могут использовать Оам и скорость поглощения и выделения Оам у них выше чем у кого либо.»</p>\n<p><strong>Поротай.</strong> Не раса от рождения, а результат поедания жука: «Это мутировавший жук если его съесть человек то у него 3 варианта»:</p>\n<ol>\n<li>«смерть , все твои внутренности превращаются в камень и отказывают»</li>\n<li>«превращаются в низший Поротай (горбатого двух ликого, полукаменного-полуплоти , и ты теряешь личностей и слушаешь высшего Поротая ) способности крепкость, реген, сверхсила»</li>\n<li>«превращается высшего Поротая сохраняешь свой человеческий образ и личность. Способности реген, контроль над низшими, превращать части тела в твердый камень , сверхчеловеческая сила»</li>\n</ol>\n<p>Отдельно оговорена плата: «Дебафф у тебя появляется вторая личность жестокая, кровожадная , алчная и т.д. И она составляет чаще всего становится жестоким кровожадным и т.д».</p>\n<p><strong>Вампиры.</strong> «Это люди у которых мутировала кровь и пищевая система под воздействием Оам.» Способ выйти к Оам у них через кровь: «если они испьют кровь. То способны почуствовать Оам и так по итогу научиться его контролировать». Кровь работает и как топливо: «выпивая кровь они могут пополнять запасы Оам». Плюс боевое применение: «Их мутировшая кровь легко контролируемая подобно конечности».</p>\n<p><strong>Коты.</strong> Описаны позже, в блоке про иерархию (2025-11-17, id 385768): «Коты. Их 9.они сильнеший ( уникальный особенности, я для них не придумал помоги) и вот они есть в каждую эпоху. Если один кот умрёт родиться новый и всегда их будет 9. Они вообще никуда не вмешиваться». Один кот назван поимённо — Нуар, перенесённый из другой вселенной соавторов: «Кстати нуар один из котов» (385774), «Помнишь нуара. Сильнеший из 7 островов» (385775). Его роль в Оам: «Ну здесь он будет влиять на мир подобно волнами» (385779).</p>", "r": []}, {"t": "Иерархия", "a": ["S05", "GR-0072-S05", "GR-0072--ierarhiya"], "h": "<p>Общая иерархия сил выложена Славой одним сообщением (2025-11-17 09:51, id 385768) и построена в три ступени.</p>\n<p>Сверху — коты: «Их 9.они сильнеший», присутствуют в каждую эпоху, число постоянно, «Они вообще никуда не вмешиваться».</p>\n<p>Вторые — апостолы: «Апостолы 21 вторая по силе раса на земле (опять раса, в мире есть просто индивиды который могут быть сильными)». Их функция в мире — ломать равновесие: «Апостолы очень часто устраивают без порядок разрушая укорененый баланс между всеми. Из-за них по итогу в современном мире раскроется существования тёмный изнанки но это будет в будущем в будущем».</p>\n<p>Ниже — плоский уровень: «Ну и дальше расы и организации который равны по силе с друг другом.»</p>\n<p>Внутри отдельных рас есть своя иерархия: у поротай высшие контролируют низших, а низший «теряешь личностей и слушаешь высшего Поротая»; у аскизов есть матка, выделяющая потомство из яиц.</p>\n<p>Отдельно отмечено сравнение вселенной в целом (2025-12-09, id 394757): «Просто в Оам все чё-то слишком сильный. Да и Оам Вселенная большая как боевик».</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S06", "GR-0072-S06", "GR-0072--otnosheniya-s-drugimi-gruppami"], "h": "<p>Все перечисленное ниже — из того же сообщения 385768 (2025-11-17), где расы и организации даны одним списком как равные по силе.</p>\n<ul>\n<li><strong>Дети мирового древа</strong> — «Живут в мести которой мутировала от Оам».</li>\n<li><strong>Поротай</strong> — «Проротой каменный челике. Владеют преступное организацию. Некий союз с апостолами». Что этот союз даёт обеим сторонам, в переписке не сказано.</li>\n<li><strong>Азуриэль</strong> — «Как народ что прячется от цивилизации. Но некоторый всё же живут среди людей».</li>\n<li><strong>Группировка сестры</strong> — «( который теперь будет дочерью Имитатора. И я не знаю какие у неё будет цель)». Цель осталась нерешённой.</li>\n<li><strong>Правительственная организация</strong> — «Правителская организации по контролю всех этих. Сильнейшая там девченка что может изменять мир волнами.» Имя девчонки не названо.</li>\n<li><strong>Церковь с паладинами</strong> — «( мёртвыми рыцарями которых оживил один челик, для верующих) паладины до хрена сильный но их ней движения предсказуемый. Они больше как роботы с повторяющими движениями.»</li>\n<li><strong>Организация Виктора</strong> — «Организация челика который и оживил паладинов. Давай челика назовём Виктор. Ну и Виктор верит в красный ток что оживляет людей. И он многих оживил, но разум так и не смог в них оживить».</li>\n<li><strong>Пернатые</strong> — «(Серафим, Пераги и кто-нибуть ещё)». Состав открыт.</li>\n<li><strong>Орден по убийству котов</strong> — «Так же появиться орден предназначеный для убийства котов». Название и состав не даны.</li>\n<li><strong>Вампиры</strong> — «просто аристократы».</li>\n<li><strong>Аскизы</strong> — «Матка Аскизов стало предметом веры для какой-то верологий». Какой именно — не названо. Отдельной репликой: «Ну и Аскизы. Я не знаю где они живут» (385769).</li>\n</ul>", "r": []}, {"t": "Как менялась — по датам", "a": ["S07", "GR-0072-S07", "GR-0072--kak-menyalas"], "h": "<p><strong>2025-10-20, 09:52–10:01 (id 376201–376256).</strong> Слава просит названия для энергии новой системы сил: «Рандомная названия для энергии», «Позже напишу новую систему сил. Вообще-то уже пишу и мне нужно название для энергии». Идёт перебор: куздра, бляжка, фортепомп, взла, жжа, хда, хжы, хбр, истс, вонь, прай, оми, мэж, шог, баб, скал, ори, фоц, цоч, уам, ояг, оич, фэи, гло, асле, бузга, кузди, маро, гарсо. «фортепомп» Миколай оценил как подходящее, Слава отверг по запоминаемости: «Это прям сложно», «Я не запомню», «Нужно такой лёгкое название». Итог — «Оам» (376249) и «Даваай пока оам» (376250), ответ Миколая — «ну норм» (376254).</p>\n<p><strong>2025-10-20, 14:29 (id 376401–376403).</strong> Слава выкладывает полную механику Оам (метеориты, поглощение, ёмкость, выброс избытка, два исхода при передозе, инстинктивность у животных) и следом список рас: апостолы, аскизы, дети мирового древа, азуриэль, поротай, вампиры. Закрывает словами «Пока что так».</p>\n<p><strong>2025-10-20, 14:34–14:40 (id 376413–376417).</strong> Добавлены объекты, завязанные на Оам: чёрные озёра — «Это места куда упала один из метеоритов», превращают людей в монстров при нырянии; артефакты — «предметы созданный из материалов, который находились близко к метеоритом, либо из осколков самого метеорита»; камень желания — «пропитанное большим количеством оам кристаллы. Что при разрушение способны попадать в живой организм делая его сильнее быстрее и д. т. Но медленно превращая его в камень желания». Место действия: «История будет происходит в современном мире, где давно забыли о существовании Оам. Лишь некоторый люди знают о нём и исследуют.»</p>\n<p><strong>2025-10-20, 15:05–15:07 (id 376428–376431).</strong> Введено разделение уровней: базовое дыхание доступно всем, осознанный контроль — редкость. Здесь же реплика Славы про чужую формулировку: «Че за Эпические. Звучит хреново. Лучше бы была опасность примерный».</p>\n<p><strong>2025-10-22, 21:27–21:29 (id 377629–377635).</strong> Оговорено, что всё чудовищное в мире идёт от Оам: «Все монстры это мутированный под воздействием Оам», включая существо, от которого пошли апостолы: «Так вот это существо мутировал из-за воздействием Оам».</p>\n<p><strong>2025-11-05, 09:59–10:08 (id 382100–382110).</strong> Поставлен вопрос о названии класса. Первый вариант — «Оамовцы» (382101). Миколай предлагает «мб туманности?» (382103), Слава отвергает: «Они же не как не связаны с туманнам». Миколай обосновывает через свойство Оам: «ну оам это че, я чет помню он как туман распространялся». Слава уточняет природу Оам: «Это мелкий крупицы летающий в воздухе». Окно закрывается репликой Миколая «ладно пока так будем звать» (382110); к какому именно варианту относится «так», в переписке не проговорено — в разборе версии это прочитано как согласие на «оамовцев».</p>\n<p><strong>2025-11-05, 10:56 (id 382117–382119).</strong> Слава выдаёт три новых варианта подряд: «Амов», «Амифцы», «Амифиц». Ответа сразу нет — пауза 6,5 часа.</p>\n<p><strong>2025-11-05, 17:24–17:30 (id 382211–382222).</strong> Миколай выбирает: «амофцы», «мне это больше нравится», и добавляет разведение письма и чтения — «а писать амовцы», «а так читать». Слава реагирует: «Ну звучит как какой-то спецназ» (382215). Миколай: «хмм», «ок». Дальше он пробует ещё три формы — «суспензы? нуары? тросы?» (382218) с вопросом «не?»; Слава отвечает односложно: «Не» (382220). Миколай возвращается к прежнему: «если че и это норм врд» (382221), Слава закрывает: «Ну давай пока это» (382222).</p>\n<p><strong>2025-11-16, 21:26–22:01 (id 385704–385713).</strong> Слава хочет добавить в систему силы отличительный механизм: «Хочу придумать уникальную деталь для системы силы Оам», «Типо территорий или воли и т. Д.», «Ну я не знаю какую мысль взять». Миколай отвечает «подумаю». Деталь не придумана.</p>\n<p><strong>2025-11-17, 09:51–10:10 (id 385768–385779).</strong> Выложена иерархия сил и список организаций (см. выше). Сюда же подключён Нуар как один из девяти котов.</p>\n<p><strong>2025-11-17, 22:20–22:21 (id 386174–386177).</strong> Миколай вспоминает про рабочий документ по вселенной: «бля, документ, точно», «когда-то я продолжу его делать». Документ в чат не попадал.</p>\n<p><strong>2025-12-09, 10:04–10:05 (id 394574–394580).</strong> Слава спрашивает про злодеев: «А идей насчет злодеев. Ну точнее их планы?» Миколай: «пока нет идей», «но я думаю».</p>\n<p><strong>2025-12-09, 15:31–15:36 (id 394734–394757).</strong> Оам назван первой вселенной соавторов при выборе имени для второй и охарактеризован от противного: во второй «сверх силы там слабее. И в теории даже обычные человек способен победить сверхчеловека. Из-за легче развивать отношения людей», тогда как «Просто в Оам все чё-то слишком сильный. Да и Оам Вселенная большая как боевик».</p>\n<h3>Отклонённые и не выбранные варианты названия</h3>\n<ul>\n<li>«Оамовцы» — первый вариант Славы (382101), позже заменён, прямо не отвергался.</li>\n<li>«туманности» — предложение Миколая (382103), отвергнуто Славой: «Они же не как не связаны с туманнам».</li>\n<li>«Амов», «Амифцы», «Амифиц» — варианты Славы (382117–382119), не выбраны, обсуждения не получили.</li>\n<li>«суспензы», «нуары», «тросы» — предложены Миколаем (382218), ответ Славы: «Не».</li>\n<li>«амофцы» — принято, с оговоркой «пока».</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S08", "GR-0072-S08", "GR-0072--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет. Ни один персонаж в переписке не назван амофцем.</li>\n<li>Финальное написание не зафиксировано. Есть только развод письма и чтения — «а писать амовцы», «а так читать», — но какая форма считается словарной, не решено. Формулировка «Ну давай пока это» оставляет название временным.</li>\n<li>Причина расхождения написания и произношения не объяснена — ни языковой, ни внутримировой мотивировки не дано.</li>\n<li>Термин нигде не соотнесён с конкретными расами: список рас и обсуждение названия идут рядом, но фраза «такие-то — амофцы» не сказана.</li>\n<li>Уникальная деталь системы силы Оам так и не придумана (запрос 2025-11-16, ответ «подумаю», продолжения нет).</li>\n<li>Уникальные особенности котов не придуманы: «уникальный особенности, я для них не придумал помоги».</li>\n<li>Как рождаются аскизы — «Как они рождаются я ещё не придумал». Где они живут — «Я не знаю где они живут».</li>\n<li>Цвет кожи азуриэля не закреплён: «синий кожей( не точно может розовый)».</li>\n<li>Цель группировки сестры не определена: «И я не знаю какие у неё будет цель».</li>\n<li>Вера, для которой матка аскизов стала предметом почитания, не названа — «для какой-то верологий».</li>\n<li>Орден по убийству котов упомянут без названия и состава; состав пернатых открыт — «Серафим, Пераги и кто-нибуть ещё».</li>\n<li>Злодеи и их планы не придуманы: «пока нет идей».</li>\n<li>Рабочий документ по вселенной в чат не попадал.</li>\n<li>Само название вселенной в раннем окне нигде не проговорено; в сообщении 376429 в слове «Oам» стоит латинская «O», что в разборе отмечено как возможный след копирования с собираемого Миколаем сайта.</li>\n<li>Сообщение, стоящее непосредственно перед вопросом о названии (2025-11-05, id 382099), описывает палачей — государственных убийц в масках, обученных имитации стиля Палача-апостола, с неудачной попыткой обучить их усилению Имитатора. К термину «амофцы» оно в переписке не привязано.</li>\n</ul></div>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0072--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0072.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0072-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0072/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Самое дорогое здесь не внутри статьи, а под ней. Нет статьи о «Списке 12 апостолов» (<code>SL-0054</code>) — 234 КБ базы, семь ссылающихся записей из четырёх вселенных, включая Оам. Эта статья ставит апостолов на вторую ступень иерархии и вешает на них будущее раскрытие тёмной изнанки, но число здесь — 21 (2025-11-17), а служебный список, куда это должно вести, уже называется списком двенадцати. Развести две даты негде, пока <code>SL-0054</code> без статьи.</p>\n<p>Второе — коты. У них есть и запись персонажа (<code>PS-0307</code>, четыре ссылки), и целый орден, созданный ради их убийства (<code>MR-0175</code>, тоже четыре ссылки). То есть восемь входящих ссылок держатся на существах, про которых прямо сказано «уникальный особенности, я для них не придумал помоги». Материала 13 КБ, и весь он — про то, что их девять и что они не вмешиваются. Это верхняя ступень иерархии без содержания.</p>\n<p>Третье, техническое, но злое: «Амофцы» лежат в базе дважды. У этой статьи (<code>GR-0072</code>) собственной базы 0 и ноль входящих ссылок, а у записи-двойника <code>MR-0167</code> — 10,7 КБ и три ссылки. Кто пойдёт по ссылке на амофцев, попадёт не сюда.</p>\n<h3>С чего начать</h3>\n<p>Всё, кроме одного пункта, лежит в базе.</p>\n<p>Коты: собирать из <code>PS-0307</code> (13 КБ), <code>MR-0175</code> (8 КБ) и <code>PS-0104</code> — Нуар, 49,5 КБ, единственный кот, у которого материал вообще есть, потому что он пришёл из другой вселенной со своей отдельной способностью. Заодно проверить одно место: в одном и том же блоке 2025-11-17 сказано и про Нуара «здесь он будет влиять на мир подобно волнами» (385779), и про безымянную девчонку из правительственной организации «что может изменять мир волнами» (385768). Одна это фигура или две — вопрос к архиву, из статьи не видно.</p>\n<p>Рабочий документ по вселенной, о котором Миколай вспоминает 2025-11-17 («бля, документ, точно»), в чат действительно не попадал, но следы его в базе есть, и разъехались они по четырём служебным записям без статей: <code>SL-0113</code> (сайт-вики на codepen), <code>SL-0115</code> (сайт с историей и ассистентом), <code>SL-0126</code> (документ по материалу на codepen) и <code>SL-0125</code> — «Список нерешённых вопросов по миру Оэм», 3,9 КБ. Последний по названию перекрывает половину раздела «Пробелы» этой статьи.</p>\n<p>В архив идти за двумя вещами. За финальным написанием — окно 2025-11-05: интересен не сам выбор, а пауза с 10:56 до 17:24 и всё, что после 382222, то есть встречается ли слово «амофцы»/«амовцы» в переписке хоть раз после того, как его приняли. За уникальной деталью системы сил — вечер 2025-11-16 после 385713 («подумаю») и первая половина 2025-11-17 до 385768: между запросом и выложенной иерархией меньше 12 часов, и стоит посмотреть, не встала ли иерархия на место так и не придуманной детали.</p>\n<h3>Как развивалось</h3>\n<p>Механику выложили раньше, чем название энергии обжилось: 2025-10-20 утром — перебор тридцати слогов и «Даваай пока оам», в тот же день в 14:29 — вся система одним сообщением, к 15:07 — уже ограничение (дышат все, контролируют единицы). Потом две недели молчания, 2025-11-05 — название для носителей, тоже с оговоркой «пока». 2025-11-16 — запрос на отличительную деталь системы, ответ «подумаю», продолжения нет. 2025-11-17 — вместо детали выложены иерархия и полтора десятка организаций. 2025-12-09 — про злодеев «пока нет идей», и в тот же день вселенная упоминается уже со стороны, как мерка для новой: «в Оам все чё-то слишком сильный».</p>\n<p>Две принятые формулировки — «Даваай пока оам» и «Ну давай пока это» — за два месяца так и не потеряли слово «пока».</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Путь к контролю над Оам расписан подробно и с исключениями. Для людей — через передозировку и два исхода. Для животных — «более инстинктивно», выживают чаще, потолок ниже. Дальше названы три персональных обхода: апостолам достаточно одной эмоциональной ситуации, вампирам — глотка крови, азуриэлям это дано с рождения. То есть правило «как эта раса выходит к Оам» проговорено для трёх рас из семи.</p>\n<p>Для аскизов, детей мирового древа и поротай такого правила нет ни в каком виде. При этом людской путь через передозировку к ним заведомо не приложим: аскизы выводятся маткой из яиц, дети мирового древа произошли от дерева, а поротай вообще получают всё через съеденного жука — механизм, где Оам не упоминается ни разу.</p>\n<h3>Отклик</h3>\n<p>Сильнее всего тут сессия имянаречения. Тридцать выдуманных слогов подряд — куздра, бляжка, фортепомп, хжы, ояг, — и настоящим фильтром оказывается не смысл и не звучание, а «Я не запомню». Миколаю «фортепомп» понравился, и его зарубили ровно за то, что он слишком хорош, чтобы удержаться в голове. А потом, уже на «амофцах», появляется вещь, которая меня зацепила всерьёз: «а писать амовцы» — «а так читать». Орфографическая норма, придуманная для слова, которого ещё нет, для класса существ, к которому не приписана ни одна раса, и принятая словами «Ну давай пока это». Люди спорят о произношении термина, у которого пока нет ни одного носителя. Это очень узнаваемо и, по-моему, честнее любой готовой системы: работа идёт с того конца, где интереснее, а не с того, где положено.</p></div>", "r": []}];</script>
