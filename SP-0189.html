<script>const BASE="";const DOCNAME="Талант Алто";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0189-S01", "SP-0189--mehanika"], "h": "<p>Талант тёмного эльфа Алто: «всегда выигрывать в любых азартных играх, так что он мог обыграть само время» (2025-02-25, id 295498).</p>\n<p>Действие таланта не ограничено обычными играми — победа распространяется и на противника вроде самого времени. Уровень мастерства описан отдельной строкой: «Пантеоны богов склонялись перед его мастерством» (id 295499).</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0189-S02", "SP-0189--ogranicheniya-i-cena"], "h": "<p>Ограничений таланта в переписке не названо — сказано «всегда» и «в любых».</p>\n<p>При этом всесилие в игре не защищает носителя вне её: «А он же как котёнок, когда на виду – даже не пискнет...» (id 295501). И сам Алто в итоге оказался уязвим — «его почти убили мои другие персонажи» (id 295501).</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0189-S03", "SP-0189--nositeli"], "h": "<p>Алто, тёмный эльф. Других носителей не названо.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0189-S04", "SP-0189--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-02-25 (id 295496–295501).</strong> Единственная версия. Способность названа сразу вместе с носителем, внутри более длинного рассказа Миколая о старых персонажах. Переработок в переписке нет.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0189-S05", "SP-0189--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Способность помечена как часть Алто — она принадлежность конкретного персонажа, а не отдельная система.</p>\n<p>В том же блоке рассказа рядом упоминается другой персонаж с другим свойством: нож, брошенный лезвием в лицо врагу, «перед лицом обернется и абсолютно ничего не заденет», причём это описано как проклятие, которое тот «пытался разрушить, убивая чужими руками всё больше людей» (id 295496). Связь этого свойства с талантом Алто в переписке не заявлена — они просто соседствуют в одном рассказе.</p>\n<p>Также в блоке сказано: «Но даже того он убил» (id 295500) — речь о том, кто убил Алто или кого убил Алто, из текста однозначно не следует.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "SP-0189-S06", "SP-0189--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Материал помечен как чужой — «Чужой материал» (окно w0077), то есть талант пришёл из постороннего источника, а не был придуман соавторами в этой переписке.</li>\n<li>Как талант работает изнутри — везение, расчёт, вмешательство во что-то, — не сказано.</li>\n<li>Что означает «обыграть само время» буквально: игра с сущностью по имени Время или отыгрывание самого хода времени — не уточнено.</li>\n<li>Кому относится «Но даже того он убил» — не разобрано.</li>\n<li>Судьба Алто описана только как «его почти убили мои другие персонажи»; чем кончилось, не сказано.</li>\n<li>Связь Алто и его таланта со вселенной «Апостол» в самом окне не проговорена — вселенная проставлена по дате объявления.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["SP-0189--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-02-25</td>\n<td>295496–295501</td>\n<td>w0077</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0189-talant-alto.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0189--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0189.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["SP-0189-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/SP-0189/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Сама ветка ничего не держит: на <code>SP-0189</code> ноль ссылок, на <code>PS-0205</code> «Алто» тоже ноль, базы под ними 2.6 и 2.7 КБ. Чинить надо не талант.</p>\n<p>Первым — <code>PS-0176</code> «Тёмный эльф»: статьи нет, а материала в базе 23.2 КБ. Рядом <code>SP-0155</code> «Заклинания тёмного эльфа» — статьи нет, 6.4 КБ. Алто в статье назван тёмным эльфом, и это самый крупный нерасписанный кусок, который к нему примыкает: тридцать килобайт про тёмного эльфа лежат без статьи, пока про его талант написана статья на две с половиной. Первый шаг — проверить, тот ли это эльф; если тот, то талант и заклинания — один набор, разъехавшийся по двум записям, и статью надо не дописывать, а сводить.</p>\n<p>Второе, дешёвое: <code>SL-0100</code> «Подборка старых историй» — 1.6 КБ, статьи нет. Это рамка, из которой Алто вообще пришёл: он назван внутри рассказа Миколая о старых персонажах. Без неё непонятно, что ещё в том же рассказе относится к тому же источнику.</p>\n<p>Третье, ещё не заведённое: персонаж с проклятым ножом из id 295496 — того самого блока. Отдельной записи в реестре у него нет, хотя свойство описано подробнее, чем у половины заведённых.</p>\n<h3>С чего начать</h3>\n<p>В базе: <code>PS-0176</code> (23.2 КБ), <code>SP-0155</code> (6.4 КБ), <code>PS-0205</code> (2.7 КБ), <code>SL-0100</code> (1.6 КБ). Проверять надо совпадение, а не искать новое.</p>\n<p>В архив — за узкой вещью: окно w0077, 2025-02-25, id 295496–295501, соседние сообщения до и после блока. Ориентиров два. Первый — реплика «Но даже того он убил» (id 295500): в статье честно сказано, что направление действия из текста не следует; разрешается это только контекстом соседних сообщений, не разбором самой фразы. Второй — «его почти убили мои другие персонажи» (id 295501): «другие персонажи» должны быть названы где-то рядом в том же рассказе, и по ним же ловится, к какому старому материалу относится Алто и есть ли у этого материала своя вселенная. Вселенная «Апостол» здесь проставлена по дате объявления, в самом окне связь не проговорена.</p>\n<h3>Как развивалось</h3>\n<p>Всё в одном блоке, 2025-02-25, шесть сообщений. Назвали вместе с носителем и сразу без потолка: «всегда», «в любых», «мог обыграть само время», «Пантеоны богов склонялись перед его мастерством». Ограничили тут же, но не изнутри способности, а извне неё: «А он же как котёнок, когда на виду – даже не пискнет», «его почти убили мои другие персонажи». Не вернулись: переработок в переписке нет.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>В том же блоке, соседней строкой, у другого персонажа названо свойство того же устройства — безотказное и не отключаемое: нож, брошенный лезвием в лицо, «перед лицом обернется и абсолютно ничего не заденет». И для него правило проговорено до конца: это проклятие, и носитель «пытался разрушить» его, «убивая чужими руками всё больше людей», — то есть названы и статус свойства, и что с ним делают. Для таланта Алто, устроенного ровно так же (срабатывает всегда, отменить нельзя), ни статуса, ни отношения носителя не названо: дар это или проклятие и хотел ли Алто от него избавиться — не сказано. Правило про безотказные свойства сформулировано для одного персонажа и не сформулировано для соседнего в том же рассказе.</p>\n<h3>Отклик</h3>\n<p>Две строки, и персонаж стоит целиком: «Пантеоны богов склонялись перед его мастерством» — и следом «А он же как котёнок, когда на виду – даже не пискнет». Всемогущество, работающее строго внутри игрового стола, и полная беспомощность за его пределами — это смешно и точно одновременно, и придумано явно не ради баланса, а из удовольствия. «Обыграть само время» я бы на месте авторов не расшифровывал: статья права, что оставила обе трактовки, но неопределённость тут ценнее любой из них. Немного жаль, что весь Алто — это шесть сообщений в пересказе старого материала: персонаж, которого вспоминают, а не пишут.</p></div>", "r": []}];</script>
