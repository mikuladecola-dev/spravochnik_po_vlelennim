<script>const BASE="";const DOCNAME="Нейроглиф";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0072-S01", "PS-0072--proishozhdenie"], "h": "<p>Нейроглиф (Neuroglyph) — пришелец вселенной «игра бога», заявленный 10 мая 2024 года (окно w0033, сообщения 167450–167455).</p>\n<p>Появился при добора ростера. Слава: «И надо ещё 4 пришельца» (2024-05-10 08:43, id 167450). В ответ Миколай выложил список под заголовком «### Пришельцы:», продолжающий нумерацию с седьмого номера (id 167451). Нейроглиф идёт в этом списке одиннадцатым — то есть последним из четырёх добранных.</p>\n<p>Источник текста Миколай обозначил прямо: «2 мощные нейронки сгенерировали предложения пока что» (id 167454). В том же обмене выложен второй, параллельный список от другой нейросети (id 167452) с иным набором пришельцев под номерами 7–10 — Изменяющий форму, Телекинетик, Мастер времени, Энергетический вампир; Нейроглифа в нём нет.</p>", "r": []}, {"t": "Способности", "a": ["S02", "PS-0072-S02", "PS-0072--sposobnosti"], "h": "<p>Три способности (2024-05-10, id 167451):</p>\n<ol>\n<li>\n<p><strong>Нейропрограммирование.</strong> «Может записывать и стирать воспоминания, управляя эмоциями и поведением жертвы».</p>\n</li>\n<li>\n<p><strong>Гипноз.</strong> «Вводит цель в транс, заставляя выполнять команды».</p>\n</li>\n<li>\n<p><strong>Ментальная связь.</strong> «Создает ментальную сеть с союзниками, позволяя им обмениваться мыслями и чувствами мгновенно».</p>\n</li>\n</ol>", "r": []}, {"t": "Связи с другими", "a": ["S03", "PS-0072-S03", "PS-0072--svyazi-s-drugimi"], "h": "<p>Входит в ростер пришельцев (позиции 1–6 плюс добранные 7–11). Соседи по списку от 2024-05-10: Омниграф (Omnigraph) — звуковые волны, манипуляция вибрациями, сбор информации через резонанс; Хроматер (Chromater) — полиморфизм, манипуляция светом, поглощение света; Металлоид (Metalloid) — металломорфизм, металлический контроль, формирование и восстановление; Пироманта (Pyromanta) — пирокинез, плазменная форма, тепловое видение.</p>\n<p>По способностям пересекается с шестым пришельцем — Псиклоном.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S04", "PS-0072-S04", "PS-0072--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2024-05-10 (id 167450–167455).</strong> Единственная версия: имя, латинское написание, три способности. Ни правок, ни обсуждения после публикации списка в переписке нет.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S05", "PS-0072-S05", "PS-0072--chto-s-nim-stalo"], "h": "<p>Отобран не был. Из четвёрки добранных пришельцев Нейроглиф в дальнейшей работе в прочитанном материале не встречается.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0072-S06", "PS-0072--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Внешность не описана.</li>\n<li>Характер, поведение, происхождение не описаны.</li>\n<li>Реакция соавтора на список из четырёх пришельцев в переписке не зафиксирована.</li>\n<li>Не сказано, как разрешалось пересечение способностей с Псиклоном и было ли оно вообще замечено авторами.</li>\n<li>Не сказано, какой из двух параллельных списков нейросетей был взят за основу.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0072--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0014.html\">игра бога</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0072--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-05-10</td>\n<td>167450–167455</td>\n<td>w0033</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0072-neyroglif.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0072--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0072.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
