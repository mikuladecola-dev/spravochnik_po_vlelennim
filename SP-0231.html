<script>const BASE="";const DOCNAME="Чтение воспоминания";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0231-S01", "SP-0231--mehanika"], "h": "<p>Способность Куры, арбетара, описана Славой одним сообщением (2025-05-31, id 331639) вместе с «Водоворотом событий» (<a href=\"SP-0230.html\">Водоворот событий</a>) и «Реконструкцией».</p>\n<p>«Чтения воспоминания — способность позволяющая читать чужие воспоминания с помощью прикосновения к голове». Контакт должен быть определённого качества: «Прикосновения должно быть долгим и сконцентрированным».</p>\n<p>Способность работает не только на живых. «Так же он может прочесть воспоминания недавно погибшего». Для этого нужны два условия: «Главная, чтобы он умер недавно и была цела голова».</p>", "r": [["Водоворот событий", "SP-0230.html"]]}, {"t": "Ограничения и цена", "a": ["S02", "SP-0231-S02", "SP-0231--ogranicheniya-i-cena"], "h": "<ul>\n<li>Требуется физическое касание головы, и касание не мимолётное, а долгое и сосредоточенное.</li>\n<li>Выбирать нечего: «Владелец способность не сможет прочесть именно то воспоминания, которая хочет. Он будет получать их рандомное».</li>\n<li>Для чтения у мёртвого — смерть должна быть недавней, голова целой. Насколько «недавно» — не уточнено.</li>\n</ul>\n<p>Отдельная цена сформулирована не как механическое ограничение, а как последствие для личности носителя. В описании Куры сказано: он выделяется игривым и импульсивным характером «Из-за частого чтения чужих воспоминаний. Он сомневается, что нынешний он это он. И в попытках доказать себе, что он прежний он творит разные безумные вещи пытаясь удержать своё я». То есть накопленные чужие воспоминания размывают у владельца ощущение собственного «я», и его поведение — попытка это «я» удержать.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0231-S03", "SP-0231--nositeli"], "h": "<p>Кура, арбетар. Мужчина, выглядящий на тридцать лет, точный возраст неизвестен, рост 185. Носит маску курицы с красным гребнем, зелёно-оранжевый плащ с ромбовидным узором, кожаные аксессуары, пояс с разноцветными украшениями, сапоги, на поясе зелёный короткий меч. Некоторое время был начальником одного из дополнительных филиалов АЗИП, отстранён «из-за проявления своего безумия и игривого характера», на момент описания — «агентом и приближенным Апостола (Бессмертного)».</p>\n<p>Других носителей в переписке не названо.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0231-S04", "SP-0231--kak-menyalas-po-versiyam"], "h": "<p>Версия одна, правок нет: 2025-05-31, окно w0099, id 331639.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0231-S05", "SP-0231--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Питает «Водоворот событий» (<a href=\"SP-0230.html\">Водоворот событий</a>): водоворот переносит затянутых «в рандомное события владельца или полученного им воспоминания» — то есть чужие воспоминания, добытые чтением, становятся местами, куда водоворот может забросить. Чем больше прочитано, тем шире набор событий.</p>\n<p>С «Реконструкцией», третьей способностью Куры из того же сообщения, связь через материал: реконструкция «преобразовывает опыт и воспоминания в энергию (зелёного цвета)», усиливая носителя, причём рассеявшаяся энергия «будет делать всё возможное, чтобы воссоединиться с владельцем. Возвращая ему утеренный воспоминания и опыт». Прямо в переписке связка «чтение → реконструкция» не проговорена — оба текста просто стоят рядом в одном перечне способностей Куры.</p>", "r": [["Водоворот событий", "SP-0230.html"]]}, {"t": "Пробелы", "a": ["S06", "SP-0231-S06", "SP-0231--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Не сказано, сколько длится «долгое» прикосновение и что считается достаточной концентрацией.</li>\n<li>Не сказано, сопротивляется ли живой носитель воспоминаний и можно ли чтение заблокировать.</li>\n<li>Не сказано, какой срок после смерти ещё считается «недавно».</li>\n<li>Не сказано, сколько воспоминаний приходит за одно касание и можно ли читать одного и того же человека повторно.</li>\n<li>Не сказано, остаются ли чужие воспоминания у Куры навсегда и можно ли от них избавиться.</li>\n<li>Не сказано, знает ли Кура, чьё воспоминание он получил.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0231--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0230.html\">Водоворот событий</a></li>\n<li><strong>Упомянут в способностях:</strong> <a href=\"SP-0230.html\">Водоворот событий</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0231--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-05-31</td>\n<td>331639–331639</td>\n<td>w0099</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0231-chtenie-vospominaniya.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0231--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0231.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["SP-0231-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/SP-0231/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — сам Кура. Записи о нём в базе нет вообще: ни персонажа, ни группы. Имя встречается только в связях <code>PS-0281</code> «Арбетары и Альфа» (три ссылки, 7 646), <code>MR-0138</code> «АЗИП» (две ссылки, 15 539), <code>PS-0277</code> «Агент АЗИП» (одна ссылка, 11 887), в версии 13 записи <code>IS-0013</code> «Бессмертный» (три ссылки, 44 010) и одной строкой в <code>SL-0054</code>. При этом три его способности разобраны в отдельные статьи и весят вместе почти двадцать четыре тысячи знаков базы: <code>SP-0230</code> «Водоворот событий» (7 502), <code>SP-0231</code> (7 126), <code>SP-0232</code> «Реконструкция» (8 768). Носитель существует только как сумма своих сил, и все три статьи ссылаются на человека, которого в реестре нет.</p>\n<p>Вторая — <code>SL-0054</code> «Список 12 апостолов»: три ссылки, статьи нет, 234 052 знака. Там, 2026-02-09 (id 430399–430401), Кура занимает одиннадцатую строку в списке апостолов, тогда как здесь он арбетар и «агент и приближенный Апостола (Бессмертного)». Пока список не разобран, это расхождение негде даже увидеть.</p>\n<p>Третья, тише: <code>PS-0281</code> — три ссылки, статья есть, но база всего 7 646, при том что <code>PS-0224</code> «Старик-арбетар» весит 90 651, а <code>SP-0198</code> «Ритуал становления Арбетаром» — 48 879. Обобщающий узел про арбетаров, на который ссылаются чаще прочих в этой группе, — самый тонкий из них.</p>\n<h3>С чего начать</h3>\n<p>Всё, что известно о способности, — одно сообщение: 2025-05-31 08:39, id 331639, окно w0099. Оно целиком лежит в <code>IS-0013</code> как версия 13, оттуда же взяты внешность, характер и должность. В архив за самой способностью идти незачем — там больше ничего нет.</p>\n<p>Идти надо за двумя вещами. Первая — АЗИП: «Некоторая время был начальник одного из дополнительного филиала АЗИП. Но был отстранён из-за проявления своего безумия» — единственный сюжет при Куре, и он должен лежать рядом с <code>MR-0138</code> и <code>MR-0139</code> «Контракт и правила агента АЗИП» (две ссылки, 17 145), окна с w0099 и до конца августа 2025. Вторая — промежуток между 2025-05-31 и 2026-02-09: имя всплывает в списке апостолов через восемь месяцев, значит между этими датами что-то было; смотреть окна w0100–w0116, ориентир — упоминания Бессмертного и АЗИП, а не имя Куры.</p>\n<h3>Как развивалось</h3>\n<p>Заявили и ограничили одновременно: 2025-05-31, одним сообщением, где сразу и портрет, и три способности, и все рамки — долгое сосредоточенное касание, случайный выбор воспоминания, недавняя смерть, целая голова. Обычного разгона «сначала идея, потом ограничения» здесь нет, всё пришло собранным. Забыли на восемь месяцев: версия одна, правок нет, ни одного возврата. Вернулись 2026-02-09 — но не к способности, а к имени: Кура занимает одиннадцатую позицию в списке 12 апостолов, где до этого стоял пробел.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для «Водоворота событий» подробно расписано, каково постороннему внутри чужого воспоминания: он видит событие так, как видел его владелец, чувствует то же самое, участвует, изменить итог не может, умереть не может. То есть правило «каково быть в чужой памяти» для гостя названо. Для самого чтения — каково владельцу в момент, когда чужое воспоминание входит: отличает ли он его от своего, помнит ли, чьё оно, — правила нет. Хотя вся цена способности («Он сомневается, что нынешний он это он») держится именно на этом месте. Для выхода из чужой памяти правило есть, для входа — нет.</p>\n<h3>Отклик</h3>\n<p>Понравилось, как здесь устроена цена. Не «сходит с ума», а наоборот: «в попытках доказать себе, что он прежний он творит разные безумные вещи пытаясь удержать своё я». Безумие как способ доказать, что ты цел, — это не штамп, это точное наблюдение, и оно объясняет всё остальное в описании задним числом: маску курицы, танцы, нелюбовь ко всему, где надо ждать. Набор привычек, который читается как чужой — набранный из прочитанных жизней и присвоенный, чтобы было чем быть. И отдельно — что читать можно недавно умершего, если цела голова: у человека, чья сила растёт из чужой памяти, основной источник — трупы. Всё это влезло в одно сообщение, и больше к нему не возвращались.</p></div>", "r": []}];</script>
