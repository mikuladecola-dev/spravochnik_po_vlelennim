<script>const BASE="";const DOCNAME="Пераги";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0022-S01", "GR-0022--chto-eto"], "h": "<p>Пераги — заражённые люди мира без солнца, из тела которых наружу лезут белые перья. Это не организация и не отряд, а раса-сообщество: все, кого катастрофа превратила в такое существо, называются одним словом. По данным базы у группы числится один участник — <a href=\"PS-0199.html\">Пераг</a> «Пераг», и это запись о виде в целом, а не об отдельном персонаже. Поимённого состава у Перагов нет: в переписке ни один Пераг не назван по имени и не выделен как отдельная особь с биографией.</p>\n<p>Название придумано прямо по ходу рассказа. Рассказчик, увидев первое такое существо, прерывает описание и говорит: «Думаю не помешало бы, дать им название для ясности ума, давайте например \"пераг\"» (2025-02-24, id 293227). То есть слово вводится не автором мира извне, а героем истории внутри самой истории, для собственного удобства.</p>\n<p>Первое описание — 2025-02-24 (id 293227): «Ну увидел, я ангела?!! Чушь и бред не может быть такого, как и солнце которая сломалась. Это был, когда-то человек, хотя ручаться я не стану. И был он весь в крови, но даже в этом красном месиве, я видел чётко, перья белый как снег, не они ещё белее, белее чем душа младенца. И эти перья вылазили из недор тела, стремясь в наружу. Но больше всех, этих перье были в голове».</p>\n<p>Позднее, 2025-03-19 (id 305854), то же самое даётся уже как сводка со стороны другого мира: «Это люди, который обрастают белыми перьями. Словно они состоят из чистого серебра. Они становятся похожими на ангелов из мифов. Но лишь похожими. На деле это были чудища. Монстры у которых главная цель убить всё разумной на планете Земля. Падший ангелы».</p>\n<p>Отдельно оговорено, что Пераг — не житель Рая и не ангел. Миколай сначала понял именно так: «я думал пераг это ангел», «чел из рая» (2025-03-20, id 306126–306128). Слава ответил прямо: «Это заражённый» (id 306131).</p>\n<p>Отдельно оговорено и то, что Пераг — не пирог: «Надеюсь ты понимаешь что Пераг и пирог это разный штуки» (2025-02-27, id 296039). Миколай подтвердил, что искажение шуточное и намеренное: «я просто хочу шутить об этом», «это забавно» (id 296041–296042).</p>", "r": [["Пераг", "PS-0199.html"]]}, {"t": "Состав", "a": ["S02", "GR-0022-S02", "GR-0022--sostav"], "h": "<ul>\n<li><a href=\"PS-0199.html\">Пераг</a> — «Пераг». Запись описывает вид, а не конкретное существо. Варианты написания в переписке: ПЕРАГ, ПеРаг, пераг, Пераги, «падшие ангелы», шуточное искажение «пирог».</li>\n</ul>\n<p>Поимённого состава нет. Все Пераги, появляющиеся в тексте, безымянны: «Пераг», которого рассказчик встречает у полицейского участка, «Пераг», гибнущий под музеем, «Пераг», которого рассказчик связал и держал в доме. Ни один из них не отделён от остальных как отдельный персонаж.</p>", "r": [["Пераг", "PS-0199.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0022-S03", "GR-0022--obschie-sposobnosti-gruppy"], "h": "<p><strong>Перья (<a href=\"SP-0183.html\">Перья Перага</a>).</strong> Белые перья растут из тела наружу, гуще всего на голове. Про них названы два свойства.</p>\n<p>Первое — броня. В бою у полицейского участка рассказчик отмечает: «всё пули, который попадали в перья отскакивали, а если попал просто тело то они прошибали» (2025-02-24, id 293227). То есть перья пуленепробиваемы, а незакрытое ими тело — нет.</p>\n<p>Второе — несгораемость и неизменность цвета. Когда Пераг гибнет под обрушившимся горящим музеем, рассказчик подходит посмотреть: «И всё горела, кроме перьев белых. И даже в красно-оранжевым огне, эти перье были белые» (2025-02-24, id 293228).</p>\n<p>Дополнительно белизна перьев подчёркнута через сравнения: «белый как снег, не они ещё белее, белее чем душа младенца» (id 293227) и «Словно они состоят из чистого серебра» (2025-03-19, id 305854).</p>\n<p><strong>Перо-меч (<a href=\"SP-0184.html\">Перо-меч Перага</a>).</strong> Из руки Перага вырастает оружие: «замечаю, что с руки его вылазить огромное и длинное перо, словно меч» (2025-02-24, id 293228). Рассказчик называет его «недомеч», а дальше по тексту — «крыло-меч». Пераг машет им на бегу, преследуя добычу в горящем здании: «начал он махать крылом-мечом над моей головой». Удар пера-меча достаточно силён, чтобы задеть и расшатать несущую опору здания — именно от этого, вместе с расстрелянной опорой, музей и обрушивается.</p>\n<p><strong>Голос.</strong> Пераг издаёт «крик подобной звериному реву», причём рассказчик специально уточняет: «Но всё же это был не рев, а что-то большее, похожее на крик» (id 293227). Придавленный обломками и горящий, Пераг кричит, и крик со временем стихает (id 293228).</p>\n<p><strong>Речь.</strong> Здесь в переписке два состояния, и второе не отменяет первого начисто. В версии от 2025-02-24 (id 293229) рассказчик обращается к мёртвому Перагу: «а, скажи Пераг. Ты ведь говорил, на человеческом, так скажи, скажи мне правду это ад». Позже, в том же сообщении, он связывает живого Перага и живёт с ним: «Схватил Перага он живого связал и говорил он с ним и слышал он ответ». Ещё позже он сам отвергает это: «они ведь не говорил со мной это всё в мой голове. Я псих, я сошёл с ума». Окончательного ответа, говорят Пераги или нет, в переписке не дано.</p>\n<p><strong>Плоть.</strong> Мёртвый Пераг не гниёт и съедобен: «его плоть не гнила и была вкусна» (id 293229). Рассказчик ест мёртвого Перага, будучи заваленным под плитой, и это даёт ему время выкопаться. Позже он периодически ест плоть связанного живого Перага: «Иногда поедая его плоть». В версии 2025-03-19 (id 305854) это свойство сформулировано как общее правило для упырей: «Ведь пераги это люди. Их можно есть. Жувать. Глотать».</p>\n<p><strong>Уязвимость.</strong> Пераг смертен и убивается обычными средствами: гибнет придавленный обрушенным зданием и сгорает. Пули по телу, не закрытому перьями, проходят. Сверхживучести, как у упырей, за Перагами не числится.</p>\n<p><strong>Цель.</strong> В сводке 2025-03-19 (id 305854) названа одна общая цель: «главная цель убить всё разумной на планете Земля».</p>\n<p><strong>Численность.</strong> «Коэффициент этих зараженных. 23 заражённых на одного человека. Где-то так» (id 305854).</p>\n<p><strong>Распространённость.</strong> В мире без солнца Пераги встречаются повсеместно: рассказчик больше месяца идёт через страну, и его маршрут описан как «встречал Пераг и прятался и снова шел» (id 293229).</p>", "r": [["Перья Перага", "SP-0183.html"], ["Перо-меч Перага", "SP-0184.html"]]}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0022-S04", "GR-0022--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p>Различий между отдельными Перагами в переписке не проведено. Все встреченные описаны одинаково: бывший человек, белые перья наружу, гуще на голове, рёв-крик, перо-меч из руки. Ни размера, ни силы, ни разновидностей, ни стадий заражения не названо.</p>\n<p>Единственное фактическое различие между эпизодами — поведение, и оно не отнесено к самим существам. Первый Пераг, встреченный на улице, рассказчика не заметил: «Пераг постоял ещё с минуты десять, да пошёл куда то, шатаясь» (id 293227). Второй сразу побежал в атаку. Третий, связанный, вёл себя пассивно и, по словам рассказчика, отвечал ему. Как это соотносится между собой, в переписке не сказано.</p>", "r": []}, {"t": "Иерархия", "a": ["S05", "GR-0022-S05", "GR-0022--ierarhiya"], "h": "<p>Иерархии у Перагов в переписке нет. Нет вожаков, старших, стай, командиров, нет и указания, что Пераги действуют сообща. Все сцены — одиночные встречи с одним Перагом.</p>\n<p>Единственный намёк на внешнюю над ними инстанцию — теория о Рае как источнике нападений на миры: «все нападения на миры. Были устроены из Рая. Второго мира, который появился после Кильке. Хотя это опять же не точно. Лишь теория. Без стопроцентных фактов» (2025-03-19, id 305854). Кто именно управляет Перагами и управляет ли ими кто-нибудь, не названо.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S06", "GR-0022-S06", "GR-0022--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>Люди.</strong> Враждебность односторонняя и полная: Пераги нападают, люди прячутся или отстреливаются. Заявленная цель — убить всё разумное. При этом в мире без солнца после катастрофы людей рассказчик не находит вообще: «людей та нету вот прям исчезли, словно спрятались всё от меня, словно я чудовище» (id 293228).</p>\n<p><strong>Упыри.</strong> Упыри — вторая категория выживших после катастрофы, «где-то 30-40 процентов выживших стали упырями» (2025-03-19, id 305854). Для упырей Пераги — еда: голод упыря утоляется только человечиной, а Пераги считаются людьми, поэтому годятся. Рассказчик мира без солнца, сам становящийся упырём, описывает свой предполагаемый конец как «упырем безмозглым, жрущий Перагов» (id 293229). Он же в экзоскелете уничтожает Перагов как противник: «Я побеждал. Я уничтожал перагов» (id 305854).</p>\n<p><strong>Рай и ангелы.</strong> Пераги «внешне похожи на ангелов из мифов», но ангел Рая в переписке описан как отдельное существо, не как Пераг: «Гуманоид, состоящий только из белых перьев. Он был вытянутым. По два метра ростом. У него было две пары рук и две пары крыльев. И вертикальный глаз один. Но он был закрыть. Хаха и нимб у него был» (2025-03-19, id 305854). Разница проговорена и прямо: на реплику Миколая «я думал пераг это ангел, чел из рая» Слава отвечает «Это заражённый» (2025-03-20, id 306128, 306131). Связь Перагов с Раем существует только на уровне недоказанной теории (см. «Иерархия»).</p>\n<p><strong>Другие миры.</strong> Заражение белыми перьями идёт не только в мире без солнца. Мир рассказчика 2025-03-19 фиксировал, что «у них разбивалось солнце. И начиналось эпидемия неизвестно болезнью в их нём мире . И это уже в трёх мирах произошло». Само слово «Пераг» для этого мира — чужое, заимствованное: «этих зараженных, которых в других мирах называют Пераг» (id 305854).</p>\n<p><strong>Вирус перьев (<a href=\"SP-0186.html\">вирус перьев</a>) и Серафим.</strong> Пераги связаны с явлением, которое авторы называют «вирус перьев». Слава объяснил, зачем вообще писал историю про мир без солнца: «Плюсом я хотел показать вирус перьев», «Так как в нашем мире он тоже будет», «Вместе с серафимом» (2025-02-25, id 295234–295236). То есть тот же вирус планировался и в основном мире, в связке с Серафимом. Миколай на это заметил: «но думаю крылья ещё не полностью раскрыты, только на интриге пока» (id 295239). Механика вируса в переписке не расписана.</p>", "r": [["вирус перьев", "SP-0186.html"]]}, {"t": "Как менялась — по датам", "a": ["S07", "GR-0022-S07", "GR-0022--kak-menyalas"], "h": "<p><strong>2025-02-24 (id 293226–293229), окно w0076.</strong> Первое появление. Пераг — окровавленное существо, бывший человек, белые перья лезут из тела, больше всего на голове; рёв-крик. Здесь же герой даёт им имя. В бою устанавливается правило про пули: по перьям отскакивают, по телу прошибают. Дальше в том же дне добавляются перо-меч из руки, гибель Перага под обрушенным горящим музеем и несгораемость перьев. Ещё дальше — что Пераги встречаются повсюду, что мёртвая плоть не гниёт и съедобна, и что живого Перага можно связать и разговаривать с ним. О происхождении Перагов и об их связи с разрушением солнца в этом окне ничего не сказано; вселенная в окне не объявлена.</p>\n<p><strong>2025-02-25 (id 295232–295243), окно w0077.</strong> Пераги привязываются к общему замыслу: заявлено, что вирус перьев перейдёт в основной мир вместе с Серафимом. Отмечено, что крылья пока держатся на интриге.</p>\n<p><strong>2025-02-27 (id 296039–296045), окно w0078.</strong> Слава разграничивает Перага и пирога. Миколай признаёт, что путает нарочно, и в запросе к нейросети даёт единственное на тот момент пояснение сути: «ну типа я называю это пирог по сути это название что то типа ангела, сказал это для понимания контекста». Само содержание истории про Перагов в этом окне не приводится.</p>\n<p><strong>2025-03-19 (id 305854–305855), окно w0083.</strong> Пераги вводятся в рассказ другого мира — технологически развитого, установившего обрывочную связь с чужими мирами. Здесь они впервые названы второй волной катастрофы: сначала раскол солнца, потом заражение. Появляются коэффициент «23 заражённых на одного человека», формула «Падший ангелы», формулировка цели «убить всё разумной на планете Земля», сравнение перьев с чистым серебром и указание, что слово «Пераг» пришло из других миров. Здесь же Пераги встают в один ряд с упырями: упыри едят Перагов, потому что «пераги это люди».</p>\n<p><strong>2025-03-20 (id 306126–306135), окно w0083.</strong> Разъяснение читателю. Миколай прочёл Перагов как ангелов, жителей Рая; Слава поправил — заражённые. Кроме поправки в этом обмене претензия Миколая к подаче: «прикольно говорить в процентах с но ты так всё раздробил что трудно представить».</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "GR-0022-S08", "GR-0022--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет. Ни один Пераг не назван по имени и не выделен как отдельная особь.</li>\n<li>Иерархии нет: ни вожаков, ни стай, ни признаков совместных действий.</li>\n<li>Происхождение вируса не установлено. В окне w0076 не сказано, откуда взялись Пераги и связаны ли они с разрушением солнца. В версии 2025-03-19 источником называется Рай, но только как теория — «Лишь теория. Без стопроцентных фактов».</li>\n<li>Механика самого вируса перьев не расписана: как передаётся, сколько длится превращение, обратимо ли оно — не сказано.</li>\n<li>Говорят Пераги или нет — осталось нерешённым. Рассказчик сначала слышит ответы, потом объявляет их собственным бредом, окончательного ответа в переписке нет.</li>\n<li>Отличия между отдельными Перагами не названы: разновидностей, стадий, различий по силе или размеру нет.</li>\n<li>Как соотносятся Пераги и ангел Рая, кроме того что это разные существа, не разобрано: почему у обоих белые перья, не объяснено.</li>\n<li>Как вирус перьев должен работать в основном мире вместе с Серафимом, не сказано — заявлено только, что будет.</li>\n<li>Судьба Перагов в мире без солнца после ухода рассказчика в другой мир не описана.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0022--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0199.html\">Пераг</a></li>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0183.html\">Перья Перага</a>, <a href=\"SP-0184.html\">Перо-меч Перага</a>, <a href=\"SP-0186.html\">вирус перьев</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0022--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0022.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0022-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0022/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым чинить вирус перьев. <code>SP-0186</code> — самая тонкая запись во всём узле: статья 4 107 знаков при 3 901 знаке материала в базе, одна версия, одно окно. Для сравнения, на самом Пераге <code>PS-0199</code> лежит 44 124 знака базы, на перьях <code>SP-0183</code> — 15 757. При этом именно вирус держит сцепку: через него мир без солнца привязан к основному миру, и на нём висит единственное обещание про Серафима. Серафим со своей стороны раскидан на четыре тощие записи — <code>PS-0209</code> (2 914 знаков базы), <code>SP-0187</code> (4 303), <code>SP-0225</code> (3 861) и <code>GR-0008</code>, у которой статья есть, а базы ноль. Пока вирус не описан, ни одна из них не может опереться на другую, и обещание «в нашем мире он тоже будет» ничем не обеспечено.</p>\n<p>Второе по цене — стык Перага и ангела Рая. Тут наоборот: материала много (<code>MR-0095</code> — 54 131 знак базы, <code>PS-0233</code> — 28 551, <code>PS-0279</code> — 23 121), обе фигуры описаны, обе через белые перья, а связи между ними нет ни в одну сторону. Разграничение сделано одной репликой «Это заражённый», и на этом всё.</p>\n<h3>С чего начать</h3>\n<p>По вирусу — в архив, материала в базе почти нет. Ориентир узкий: окно w0077, 2025-02-25, id 295232–295243 — там заявка целиком, и это единственная версия записи <code>SP-0186</code>. Второй адрес — 2025-05-14, окно w0094, id 325798–325801: Серафим всплывает в реестре сторонних сил уже с четырьмя силами, и перьев среди них нет. Значит проверять надо промежуток между w0077 и w0094 — возвращались ли к вирусу вообще, или он остался словом одного дня.</p>\n<p>По Раю и ангелу — идти не надо, всё в базе, но разъехалось по соседям: <code>MR-0095</code>, <code>PS-0233</code>, <code>PS-0279</code>, <code>MR-0145</code>. Общая точка у всех одна — 2025-03-19, id 305854.</p>\n<p>Отдельно: <code>MR-0110</code> «Мир без солнца» (статья 13 413, база 23 565) не связана ни с одной статьей справочника, включая эту. Пераги живут в этом мире, и ссылки на него у них нет.</p>\n<h3>Как развивалось</h3>\n<p>2025-02-24 (w0076) — заявили в один заход: существо, перья, имя, придуманное героем вслух посреди сцены; в тот же день добавили броню, перо-меч, несгораемость, съедобную плоть, речь и отказ от речи. 2025-02-25 (w0077) — пристегнули к общему замыслу: вирус перейдёт в основной мир вместе с Серафимом. 2025-02-27 (w0078) — из содержания только разграничение Перага и пирога. Дальше три недели без Перагов. 2025-03-19 (w0083) — вернулись с другой стороны: не от героя, а из сводки другого мира, языком процентов и коэффициентов, и здесь же слово «Пераг» объявлено заимствованным. 2025-03-20 — разъяснение читателю, что это не ангел. После этого линия обрывается.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для перьев названы два свойства, и оба с механикой: пули по перьям отскакивают, по телу проходят; в огне не горят и не темнеют. Перо-меч — из того же вещества и растёт из того же тела, но правил того же рода для него нет: горит ли он, отражает ли пули, отрастает ли после потери, отличается ли от перьев на голове чем-то кроме размера — не сказано ни разу, при том что описан он подробно и работает как основное оружие.</p>\n<p>Второе место того же вида: про речь оговорено, что рассказчик мог всё это придумать. Про крик, про поведение первого Перага, про вкус плоти такой оговорки нет — они идут как факты. Где кончается ненадёжный рассказчик, не проведено.</p>\n<h3>Отклик</h3>\n<p>Сильнее всего здесь имя. Не автор снаружи назвал существо, а герой посреди описания прервался и сказал: «Думаю не помешало бы, дать им название для ясности ума, давайте например \"пераг\"» — и слово потом уехало в другой мир, где происхождения уже не знают и просто пользуются им как термином. Это делает с языком мира больше, чем сделала бы любая этимология. Зацепило ещё, что поедание мёртвого Перага подано без ужаса, с оценкой вкуса и с практическим выводом — плоть не гниёт, значит можно тянуть время под плитой. А вот шутка про пирог, судя по тому, что её пришлось разбирать отдельным обменом сообщений, взяла на себя больше внимания, чем отдала.</p></div>", "r": []}];</script>
