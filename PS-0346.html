<script>const BASE="";const DOCNAME="Васька";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0346-S01", "PS-0346--proishozhdenie"], "h": "<p>Персонаж введён 2026-02-08 (окно w0116) внутри текста истории «Чёрное озеро», выложенной Славой подряд четырьмя сообщениями. В записи Васьки приведены сообщения 430011–430013, но первое упоминание стоит раньше, в 430010, где рассказчик перечисляет, кто как идёт по ночному лесу: «Васька, как видимо успевший притронуться к рюмке. Вечно спотыкался и кряхтел». Отдельного обсуждения персонажа вне текста истории в переписке нет. Версия одна.</p>\n<p>Всё, что о нём известно, известно с чужих слов — из речи рассказчика Сергея (<a href=\"PS-0345.html\">Сергей</a>), от лица которого идёт весь текст. Собственных реплик у Васьки нет ни одной: он за весь текст не произносит ни слова.</p>\n<p>Он один из мужиков деревни, вышедших ночью в лес с вилами, топорами и фонариками искать того, кто напал на внука Любки. Введён сначала как комический фон — пьяный, спотыкающийся, кряхтящий, — и в этом же качестве упоминается второй раз, когда толпа встречает чудовище: «Первым разрушил этот хрупкий и блаженный момент был не пьяный Васька. Не дрожащий словно осиновый листь Мишка. Ни даже чудовища, что изучала нас своими глазами бусинками. Это был старый охотник».</p>", "r": [["Сергей", "PS-0345.html"]]}, {"t": "Внешность", "a": ["S02", "PS-0346-S02", "PS-0346--vneshnost"], "h": "<p>Прямого описания нет; названа одна черта, и то по ходу действия — глаза. Когда он оборачивается на шум и видит лежащего Сергея: «Его глаза до этого и так большие, стали ещё больше и чуть не выпали из орбиты». То есть глаза у него большие и в обычном состоянии.</p>\n<p>Ещё сказано, что он старый: «Этот бежавший был пьяный, старый Васька». Роста, сложения, одежды, лица в переписке нет.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0346-S03", "PS-0346--harakter"], "h": "<p>Даётся тремя определениями, все — глазами Сергея:</p>\n<ul>\n<li>пьяный, причём выпивший ещё до похода: «как видимо успевший притронуться к рюмке»;</li>\n<li>старый;</li>\n<li>«у которого вроде как не всё дома в голове». Формулировка стоит с оговоркой «вроде как» — то есть это то, что Сергей о нём слышал или предполагает, а не установленный факт.</li>\n</ul>\n<p>Оценка ему даётся заранее и отрицательная. Услышав чей-то топот, Сергей молится о любой помощи — «Блять кто бы ты не был сука помоги», — а разглядев, кто прибежал, реагирует так: «И блять нет, не услышали меня боги».</p>\n<p>При этом действует Васька быстро и без колебаний. Увидев лежащего, он «подпрыгнул с места и подбежал ко мне. Схватил меня за руку и бесцеремонно начал тащить за собой». На крик Сергея «СУКА Стой!» он замирает, «явно не понимая, что же делать», потом «Оглядевшись он всё же принимает какой решений, которым не спешил делиться со мной. А лишь крепче схватил мою руку и начал тащить». То, что он не объясняет своих действий, отмечено отдельно — он не говорит вообще ничего.</p>\n<p>Последовательность его действий у ямки описана подробно: остановился, «не долго думая скинул меня туда», не обратил внимания на крик, «начал забрасывать меня землёй, травой и ветками. Закидав меня он встал отряхнулся, посмотрел на меня и кивнув побежал куда-то». Кивок — единственный знак, который он подаёт.</p>\n<p>Он единственный из всей толпы, кто не бросил раненого. Остальные, включая тех, кто бежал впереди, ушли в темноту: «Спины мужиков всё отдаляються».</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0346-S04", "PS-0346--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Сергей (<a href=\"PS-0345.html\">Сергей</a>)</strong> — рассказчик, которого Васька вытаскивает. До этой сцены они, по тексту, не общаются; Сергей знает о нём только по слухам и по виду.</li>\n<li><strong>Мишка</strong> — упомянут рядом с Васькой в перечислении на сцене с чудовищем, взаимодействия между ними в тексте нет.</li>\n<li><strong>Старый охотник с двустволкой</strong> — стреляет в чудовище и запускает общее бегство, из которого Васька и выбегает на Сергея.</li>\n<li><strong>Чудовище</strong> — то, от чего Васька бежит и от чего прячет Сергея. Прямого столкновения Васьки с ним в тексте нет.</li>\n<li>Васька числится частью истории <strong>«Чёрное озеро»</strong>.</li>\n</ul>", "r": [["Сергей", "PS-0345.html"]]}, {"t": "Как менялся — состояния по датам", "a": ["S05", "PS-0346-S05", "PS-0346--kak-menyalsya"], "h": "<p><strong>2026-02-08 (id 430010–430013), окно w0116.</strong> Единственная версия. Персонаж вводится и исчерпывается внутри одного текста: сначала как пьяный спотыкающийся мужик из толпы, затем как единственный, кто вытащил раненого. Переработок, споров и альтернативных вариантов в переписке нет.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S06", "PS-0346-S06", "PS-0346--chto-s-nim-stalo"], "h": "<p>Не раскрыто. Последнее, что о нём сказано: закопав Сергея, «он встал отряхнулся, посмотрел на меня и кивнув побежал куда-то» (id 430012). Куда он побежал, добежал ли, вернулся ли — в тексте нет. В утренней сцене он не появляется, и о нём никто не вспоминает.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0346-S07", "PS-0346--probely"], "h": "<div class=\"gaps\"><ul>\n<li><strong>Не произносит ни одной реплики за весь текст.</strong></li>\n<li><strong>Внешности, кроме больших глаз и слова «старый», нет.</strong></li>\n<li><strong>Фамилии, точного возраста, занятия, дома, семьи нет.</strong></li>\n<li><strong>«Не всё дома в голове» ничем не раскрыто</strong> — что именно с ним не так, в переписке не сказано, формулировка дана с оговоркой «вроде как».</li>\n<li><strong>Мотив его поступка не объяснён.</strong> Почему он вернулся за незнакомым в деревне человеком и почему выбрал закопать его, а не тащить дальше, — не сказано; в тексте прямо отмечено, что решение он «не спешил делиться».</li>\n<li><strong>Дальнейшая судьба в тексте не раскрыта</strong> (помечено в самой записи, w0116).</li>\n<li><strong>Способностей нет</strong> — в выложенном тексте он обычный человек.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0346--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0345.html\">Сергей</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0345.html\">Сергей</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0346--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-02-08</td>\n<td>430011–430013</td>\n<td>w0116</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0346-vaska.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0346--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0346.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
