<script>const BASE="";const DOCNAME="Организация Виктора";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0173-S01", "MR-0173--ustroystvo"], "h": "<p>Организация Виктора — «Организация челика который и оживил паладинов», то есть отдельное от церкви объединение, во главе которого стоит человек, ожививший паладинов для церкви (2025-11-17, id 385768). Внутреннее устройство в переписке не описано: ни структуры, ни численности, ни того, где организация находится.</p>\n<p>Единственное, что сказано про её основателя и, судя по формулировке, про её содержание: «Виктор верит в красный ток что оживляет людей. И он многих оживил, но разум так и не смог в них оживить». Оживление без возвращения разума — то, чем Виктор занимается; отнесена ли эта деятельность к организации как таковой или только к нему лично, в переписке не сказано.</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0173-S02", "MR-0173--naselenie"], "h": "<p>Состав не назван. Прямо в тексте перечислены только сам Виктор и — как отдельная от организации сущность — паладины церкви, «мёртвыми рыцарями которых оживил один челик, для верующих». Про паладинов сказано, что они «до хрена сильный но их ней движения предсказуемый. Они больше как роботы с повторяющими движениями», однако принадлежат они церкви, а не организации Виктора: организация названа отдельной от церкви позицией в списке. Кто входит в саму организацию — в переписке не сказано.</p>\n<p>Многочисленные оживлённые Виктором («он многих оживил») в организацию явно не зачислены; их статус осталось нерешённым.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0173-S03", "MR-0173--mesto-vo-vselennoy"], "h": "<p>Организация появляется внутри перечня рас и организаций вселенной Оам (2025-11-17, id 385768–385769). Список выстроен по силе:</p>\n<ul>\n<li>Коты, их 9 — сильнейшие, «они вообще никуда не вмешиваться»; если один кот умрёт, родится новый, и всегда их будет 9. Уникальные особенности для них на этот момент не придуманы — Слава прямо просит помощи с ними.</li>\n<li>Апостолы, 21 — «вторая по силе раса на земле».</li>\n<li>Дальше — «расы и организации который равны по силе с друг другом». Организация Виктора стоит именно в этой группе, то есть по силе она приравнена ко всем прочим позициям того же перечня: Детям мирового древа, Проротым каменным челикам, Азуриэль, Группировке сестры, Правительской организации по контролю всех этих, Церкви с паладинами, Пернатым (Серафим, Пераги «и кто-нибуть ещё»), ордену, предназначенному для убийства котов, вампирам-аристократам и Аскизам.</li>\n</ul>\n<p>С церковью с паладинами организация связана через Виктора: он оживил паладинов, которых церковь использует «для верующих», но его организация от церкви отделена. Характер отношений между ними — союз, подчинение, вражда — в переписке не сказано.</p>\n<p>Никаких других связей организации с прочими пунктами списка не названо. Для сравнения: у Проротых каменных челиков союз с апостолами оговорён прямо («Некий союз с апостолами»), у организации Виктора подобных оговорок нет.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0173-S04", "MR-0173--kak-menyalsya-po-versiyam"], "h": "<p>Версия одна.</p>\n<p><strong>2025-11-17 (id 385768–385769, окно w0109).</strong> Организация названа в общем списке рас и организаций Оам одной строкой: «Организация челика который и оживил паладинов. Давай челика назовём Виктор. Ну и Виктор верит в красный ток что оживляет людей. И он многих оживил, но разум так и не смог в них оживить». Имя Виктора даётся тут же, в момент называния организации — до этого он фигурирует в списке безымянно, как «один челик», ожививший паладинов. Дальше организация в переписке не разрабатывалась.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0173-S05", "MR-0173--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Цели организации не описаны.</li>\n<li>Состав не назван — кроме Виктора, никто в неё не записан.</li>\n<li>Не сказано, где организация базируется.</li>\n<li>Отношения с церковью с паладинами не определены: сказано только, что организация от церкви отдельная.</li>\n<li>Что такое «красный ток», кроме того, что он «оживляет людей» и что Виктор в него верит, не объяснено. Отдельная ли это сила, вещество или верование — осталось нерешённым.</li>\n<li>Судьба оживлённых без разума не описана.</li>\n<li>Название организации отсутствует: она обозначается через своего основателя.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0173--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0063.html\">Организация Виктора</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0008.html\">Оам</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0173--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-11-17</td>\n<td>385768–385769</td>\n<td>w0109</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0173-organizaciya-viktora.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0173--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0173.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
