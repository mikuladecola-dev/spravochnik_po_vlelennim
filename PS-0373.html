<script>const BASE="";const DOCNAME="Святая дева";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0373-S01", "PS-0373--proishozhdenie"], "h": "<p>Появляется 2026-06-03 (id 487514, окно w0121) внутри большого сообщения Славы о Праведнике (<a href=\"PS-0372.html\">Праведник</a>) — в списке тех, кто не стал лицом ассоциации. Отдельного введения у неё нет: она сразу вводится как проигравшая конкурентка и объясняется, почему лицом стала не она.</p>", "r": [["Праведник", "PS-0372.html"]]}, {"t": "Внешность", "a": ["S02", "PS-0373-S02", "PS-0373--vneshnost"], "h": "<p>«девушка с золотыми волосами» (2026-06-03, id 487514). Больше о внешности ничего не сказано.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0373-S03", "PS-0373--harakter"], "h": "<p>Прямо названа одна черта — страх перед Нуаром: «Боится Нуара, так как тот, когда та ещё стремилась занят места столпа, была сильная им избита в тренировочном бою.» Там же указано, чем этот эпизод для неё обернулся: «Но она после этого сильна выросла, потому что у неё появилась мотивация».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0373-S04", "PS-0373--sposobnosti"], "h": "<p>«Её способность свет, она может ускоряться и формировать свет.» Боевой профиль: «Она боец ближнего боя и у неё свой стиль мяча основанный на её способности» (формулировка приведена как в переписке; что означает «стиль мяча», не пояснено).</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0373-S05", "PS-0373--svyazi-s-drugimi"], "h": "<p><strong>Праведник (<a href=\"PS-0372.html\">Праведник</a>).</strong> Конкурентка за роль лица ассоциации: «она в полне себе конкурировала за роль лица ассоциации. Но по итогу проиграла. Не хватило голосов. Возможно в будущем будет заменой праведника.»</p>\n<p><strong>Нуар.</strong> Избил её в тренировочном бою, когда она «ещё стремилась занят места столпа». Причина названа: «Нуар переборщил потому что ему было интересно, как свет противостоит тьме.» Отсюда её страх перед ним и её последующий рост.</p>\n<p><strong>Фатик.</strong> Персонаж, занявший её место после вычёркивания (см. «Что с ней стало»).</p>", "r": [["Праведник", "PS-0372.html"]]}, {"t": "Как менялась", "a": ["S06", "PS-0373-S06", "PS-0373--kak-menyalas"], "h": "<p><strong>Версия 1 — 2026-06-03, 12:17 (id 487514).</strong> Введена: золотоволосая девушка, способность — свет, ускорение и формирование света, боец ближнего боя со своим стилем; предыстория с Нуаром; конкурентка Праведника, проигравшая по голосам; «Возможно в будущем будет заменой праведника».</p>\n<p><strong>Версия 2 — 2026-06-03, 14:16 (id 487531).</strong> Через два часа того же дня персонаж отменяется целиком: «Святая дева её больше нет как персонаж вообще. Вместо неё одним из столпов злодеев становится Фатик».</p>", "r": []}, {"t": "Что с ней стало", "a": ["S07", "PS-0373-S07", "PS-0373--chto-s-ney-stalo"], "h": "<p>Вычеркнута из вселенной в тот же день, что и введена: «Святая дева её больше нет как персонаж вообще» (2026-06-03, id 487531). Заявленная в первой версии перспектива («Возможно в будущем будет заменой праведника») вместе с ней отпадает.</p>\n<p>Занявший её место персонаж — Фатик, «желтоволосая девчушка», со способностью управления фотонами: зрительные иллюзии, возможность «разукрасить мир в чёрное белые», внушение, что «вы оказались во дворце», перемещение на невероятной скорости, «мощные залпы энергии ( ну фотонов с массой, ну которые как бы нарушает законы физики, ну пока допустим)» — в том числе как защита от тьмы Нуара; при усилии — осязаемые иллюзии, «может погладить все факторы устроив минутку тьмы», ослепление, запутывание в пространстве. Фатик также глава секты, «которой покланяется ей как богини в человеческом виде»; секте тут же дано имя: «давай назовём данную секту Фалим». В этой секте состоит инквизитор с чистой Оам.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0373-S08", "PS-0373--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имя (кроме прозвища «Святая дева»), возраст, происхождение, биография — не названы.</li>\n<li>Место в организации не уточнено: сказано только, что она «ещё стремилась занят места столпа» и конкурировала за лицо ассоциации; заняла ли она в итоге место столпа, не сказано.</li>\n<li>Состав и устройство голосования, на котором ей «не хватило голосов», не описаны.</li>\n<li>«Стиль мяча», названный её собственным, не расшифрован.</li>\n<li>Причина вычёркивания персонажа не объяснена: сказано только, что её «больше нет как персонаж вообще».</li>\n<li>В первой версии она конкурентка за лицо ассоциации героев, а сменивший её Фатик назван «одним из столпов злодеев»; как эти две роли соотносятся, в переписке не пояснено.</li>\n<li>Вселенная в базе помечена как «неясно (по дате объявления)».</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0373--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0372.html\">Праведник</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0104.html\">Нуар</a>, <a href=\"PS-0372.html\">Праведник</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0373--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-06-03</td>\n<td>487514–487516</td>\n<td>w0121</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-03</td>\n<td>487531–487532</td>\n<td>w0121</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0373-svyataya-deva.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0373--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0373.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
