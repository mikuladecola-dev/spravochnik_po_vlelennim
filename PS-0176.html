<script>const BASE="";const DOCNAME="Тёмный эльф";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0176-S01", "PS-0176--proishozhdenie"], "h": "<p>Персонаж Миколая, заявленный в разговоре о команде наёмников (2024-12-23, id 273293–273297). Первая формулировка звучала как «мы будем эльфами» и «которые решили стать королями»; на переспрос Славы «Кто мы ?» Миколай уточнил: «перс эльф». То есть заявка сразу содержала и расу, и цель.</p>\n<p>В версии от 2024-12-23 (id 273507–273516) уточнено, что он «не просто эльф а темный эльф, поэтому темная магия развита хорошо». Возраст — 207 лет.</p>\n<p>Имени персонажу не дали ни разу; в переписке он проходит как «перс эльф», «мой эльф», «тёмный эльф».</p>\n<p>Состав команды обсуждался тогда же: у Славы персонаж-человек (<a href=\"PS-0174.html\">Маг ветра</a>), у Миколая эльф, всего договорились на четверых — «2 моих и 2 твоих» (2024-12-23, id 273321). Отдельно Слава оговорил: «И если что магии наделять всех не надо» (id 273301). На вопрос Миколая «будет гильдия?» Слава ответил «Нет» (id 273302–273304).</p>", "r": [["Маг ветра", "PS-0174.html"]]}, {"t": "Внешность", "a": ["S02", "PS-0176-S02", "PS-0176--vneshnost"], "h": "<p>Описание дано одним куском в карточке от 2024-12-23 (id 273515):</p>\n<ul>\n<li>коричневые джинсы;</li>\n<li>рубаха желтоватая из плотной ткани;</li>\n<li>плащ синеватый;</li>\n<li>уши «естественно эльфийские»;</li>\n<li>кожа грубоватая;</li>\n<li>при этом «он привлекательный».</li>\n</ul>\n<p>Джинсы стали первым пунктом критики Славы: «Джинсы в средневековье» (2024-12-23, id 273517). Миколай ответил «ну типа джинсы» и «ща», после чего разговор ушёл в сторону; чем джинсы заменили — в переписке не сказано.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0176-S03", "PS-0176--harakter"], "h": "<p>«да он по характеру и внешне и внутренне добрый и эмпатичный» (2024-12-23, id 273515).</p>\n<p>Общительный: команда у него не одна, он «типа ш.... общительный». Работает на команду и на поддержку. Ему важно, чтобы развивалась команда, поэтому «вкидывает идеи каждому лично и они там пытаются своему найти и сделать».</p>\n<p>В народе «ракрепояет имя хотя относительно в тени, но репутация надёжная» — то есть имя закрепляет, оставаясь относительно в тени.</p>\n<p>Сам Миколай о балансе персонажа: «он у меня такой имбаланстный» (2024-12-23, id 273403–273404).</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0176-S04", "PS-0176--sposobnosti"], "h": "<h3>Цели</h3>\n<p>Открытая цель — стать королём. Полная цель — «изменить государство ибо делать нехуй, в 207 лет» (2024-12-23, id 273515).</p>\n<h3>Чтение опыта</h3>\n<p>Первая названная способность (2024-12-23, id 273341–273343) — «чтение прошлого опыта любого человека». Слава на это переспросил: «Магий времени?»; ответа на переспрос в переписке нет.</p>\n<p>Развёрнутая формулировка в карточке (id 273515): «погладив по голове кого-то и если тот участвует в процессе он может узнать опыт этого человека и изучить его даже относительно прожить, но чревато потерями навыков или памяти, ну относительно кнш».</p>\n<p>Здесь названы два условия и одна цена: поглаживание по голове, участие самого человека в процессе, риск потери навыков или памяти.</p>\n<h3>Стихийная магия</h3>\n<p>2024-12-23 (id 273345–273357): «обычная магия хорошо развита», уточнено как «базовая стихийная, на высоком уровне». На вопрос «Какой именно стихий» — «6 стандартных», «больше воздух» и «свет». Слава возразил: «Базовая стихийная это овладения одной из 4 основных элементов». Миколай: «ну а он такой ахуенный», «6 может», «таких не мало».</p>\n<p>В тот же день (id 273372–273373, 273402–273403) правка: чтобы не пересекаться с персонажем Славы, «значит просто свет и земля», далее — «ну типа и свет и земля мощные а остальные средние».</p>\n<h3>Тёмная магия</h3>\n<p>«он кстати не просто эльф а темный эльф, поэтому темная магия развита хорошо» (id 273515).</p>\n<p>Что это такое, в переписке до конца не определено. Слава спрашивал прямо: «И как понимать темной магии ?», «Про какую темную магий ты говоришь», и заявил: «В моем преставление так таковой темной магии и нету». Миколай согласился — «я тебе и говорю», «нету» — и объяснил свою позицию так: «сам хз, думаю это обобщеное название для магии которая может использоваться скрытно или явно плохо»; «а нету холериков, меланхоликов и сонгвиников но эту хуету люди юзают», «и в этом мире тоже», «это так обзывают набор определённой магии», «категорию», «могут не называть», «просто чтобы дохуя не расписыватт» (2024-12-23, id 273521, 273534–273546).</p>\n<p>Слава: «Так ты да же сам не понимаешь что такая темная магия». Миколай: «вот и подумаю потом,, я имею представление но не знаю как описать сейчас». Состав тёмной магии не назван.</p>\n<h3>Заклинания</h3>\n<p>Названный набор (2024-12-23, id 273515), с оговоркой Миколая «ну это базовый набор который онираскрывает разным людям, не весь кнш»:</p>\n<ul>\n<li>шар огня;</li>\n<li>мини ураган «с ладонь по размеру»;</li>\n<li>водяной луч — «режет хорошо твёрдое а мягкое не может»;</li>\n<li>ослепление;</li>\n<li>усыпление.</li>\n</ul>\n<p>Отдельно сказано: «обычно он использует стихию огня и усиливает человека», «ваще он работает на команду и на поддержку справляется хорошо, всё что использует дополняет команду».</p>\n<h3>Артефакты</h3>\n<p><strong>Листок бумаги из клевера.</strong> Первая формулировка (id 273515): «он может написать заклинание и сложить листок в оригами, тогда поимеет свой и материализует относительно функции формы». Слава: «И про листок клевера ты походу там слова попутал ниче не ясна». Разъяснение Миколая (2024-12-23, id 273527): «есть бумага которую сделали из клевера, на ней может написать заклинание и после например самолётик сложить, это заклинание активируется и вот он сложил самолётик за этой формой оригами есть какая-то функция и он её активирует». Сразу за этим — «я не знаю как это описать я не думал», «потом»; на вопрос Славы «Тогда зачем писал» — «чтобы потом раскрыть естественно».</p>\n<p><strong>Линза удачи.</strong> «есть ещё линза удачи, он видит с её помощью удачу людей» (id 273515). Про артефакт со светом Слава заметил: «Так он не сам её не использует это артефакт просто светиться и все» (id 273401).</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0176-S05", "PS-0176--svyazi-s-drugimi"], "h": "<ul>\n<li>Персонаж Славы — маг ветра, мечник (<a href=\"PS-0174.html\">Маг ветра</a>). Оба входят в одну команду наёмников. Правка стихий («значит просто свет и земля») сделана прямо ради того, чтобы не пересекаться с ним. В финальном разборе персонаж Славы поставлен эталоном баланса: «прочти моего перса он не сильный но и не слабый у него нет заклинание который супер супер по типу твоего водяного» (2024-12-25, id 274528).</li>\n<li>Команда (группа наёмников): у эльфа «команда эта у него не одна». Планируемый состав основной команды — четыре персонажа, по два от каждого автора (2024-12-23, id 273321).</li>\n<li>Артефакты: листок бумаги из клевера, линза удачи.</li>\n</ul>", "r": [["Маг ветра", "PS-0174.html"]]}, {"t": "Как менялся — состояния по датам, старое не затирается", "a": ["S06", "PS-0176-S06", "PS-0176--kak-menyalsya"], "h": "<p><strong>2024-12-23, id 273293–273306.</strong> Заявка: эльф, решивший стать королём. Способность ещё не названа, состав команды не определён.</p>\n<p><strong>2024-12-23, id 273332–273357.</strong> Первые способности: чтение прошлого опыта любого человека; хорошо развитая базовая стихийная магия — 6 стандартных стихий, «больше воздух» и свет.</p>\n<p><strong>2024-12-23, id 273372–273404.</strong> Правка после того, как Миколай прочёл персонажа Славы: «я не читал», «значит просто свет и земля». Итог — свет и земля мощные, остальные средние. В этой же версии Слава излагает свои правила магии: материализация как основа («магия это именно что выдворение фантазий в реальность»), требование знать «химию, алхимию, физику… на уровне профессора наук», и что «стихийная магия прям пропорционально материализации».</p>\n<p><strong>2024-12-23, id 273507–273516.</strong> Полная карточка по списку вопросов Славы (оружие, характер, одежда, цель, артефакты, заклинания): 207 лет, две цели, работа на команду, сеть команд, тёмная магия, два артефакта, чтение опыта поглаживанием, пять заклинаний, одежда.</p>\n<p><strong>2024-12-23, id 273517–273556.</strong> Критика Славы и согласие переделать. Претензии: джинсы в средневековье; «А не дохуя ли у него способность»; непонятная тёмная магия; невнятный листок клевера; «Плюсом у твоего эльфа уже есть благословение виде усиление»; «Усыпления это чё второе благословение / Ты там берега не путый». Миколай: «эх», «ладно», «переделаю», «но потом мне уже лен».</p>\n<p><strong>2024-12-25, id 274477–274483.</strong> Миколай приносит разбивку способностей по категориям и спрашивает «а цели как тебе?», допуская и полную переделку: «или вообще перса переделать». Категории в разбивке:</p>\n<ul>\n<li>Обычные (создание): шар огня, мини ураган, водяной луч, ослепление, усыпление, базовая тёмная магия.</li>\n<li>Благословение (влияние): усиление человека, поддержка команды, передача идей для развития, способность перенимать опыт через поглаживание («хотя это скорее гибридная способность»).</li>\n<li>Другие (особые/уникальные): магия оригами через листок клевера, линза удачи (видение удачи других), способность создавать и поддерживать сеть команд, распространение репутации оставаясь в тени.</li>\n</ul>\n<p>В базе текст этой разбивки помечен как машинный (см. ai_inserts исходного файла).</p>\n<p><strong>2024-12-25, id 274514–274534.</strong> Вердикт Славы: «Лучше вообще с нуля начать».</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0176-S07", "PS-0176--chto-s-nim-stalo"], "h": "<p>Итоговый вид персонажа в окне не зафиксирован. Последнее состояние — список требований Славы к переделке (2024-12-25, id 274518–274534):</p>\n<ol>\n<li>«Лучше вообще с нуля начать».</li>\n<li>«Во первых благословения бывает только одно у человека». Возражение Миколая: «он эльф»; ответа на возражение в переписке нет.</li>\n<li>«Во вторых не давай ему столько базовых стихий» — Миколай: «хорошо».</li>\n<li>«В третьих разделил заклинаний который он может кастовать почти мгновенная и те которым нужно время». Миколай переспросил: «мне надо разделить заклинания на мгновенные и с задержкой ? верно» — Слава: «Типо того».</li>\n<li>«А артефакты можешь оставить».</li>\n<li>«И ослабь его магический заклинание» — с пояснением через персонажа Славы, у которого нет заклинаний «супер супер по типу твоего водяного».</li>\n</ol>\n<p>Сама переделка в переписке не сделана — перенесена «потом».</p>", "r": []}, {"t": "Отклонённые варианты", "a": ["S08", "PS-0176-S08", "PS-0176--otklonennye-varianty"], "h": "<ul>\n<li>Шесть стандартных стихий на высоком уровне (2024-12-23, id 273351–273357) — снято дважды: сначала правкой самого Миколая до «свет и земля мощные, остальные средние», затем требованием Славы «не давай ему столько базовых стихий» (2024-12-25).</li>\n<li>Джинсы (2024-12-23, id 273515) — отклонены Славой как несовместимые со средневековьем; замена не названа.</li>\n<li>Одновременное наличие усиления человека и усыпления как двух благословений — отклонено: «благословения бывает только одно у человека».</li>\n<li>Гильдия как механизм получения заданий — предложена Миколаем («будет гильдия?»), отклонена Славой одним словом «Нет» (2024-12-23, id 273302–273304).</li>\n</ul>", "r": []}, {"t": "Пробелы — чего в переписке нет", "a": ["S09", "PS-0176-S09", "PS-0176--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имени у персонажа нет.</li>\n<li>Оружие: Слава спрашивал про оружие дважды (id 273391, 273507), в карточке ответа на этот пункт нет.</li>\n<li>Состав тёмной магии не назван; сам автор сказал, что имеет представление, но описать сейчас не может.</li>\n<li>Механика листка из клевера названа дважды и оба раза оставлена неоконченной: «какая-то функция» формы оригами не расшифрована, соответствие «форма — функция» не задано.</li>\n<li>Не сказано, что происходит с линзой удачи дальше — только то, что через неё видна удача людей.</li>\n<li>Осталось нерешённым, относится ли чтение опыта к магии времени (переспрос Славы без ответа).</li>\n<li>Не разъяснено, распространяется ли правило «благословение бывает только одно у человека» на эльфа (возражение «он эльф» осталось без ответа).</li>\n<li>Разделение заклинаний на почти мгновенные и требующие времени только назначено, но не проведено.</li>\n<li>Не сказано, откуда взялся возраст 207 лет и связан ли он с чем-либо, кроме фразы «делать нехуй, в 207 лет».</li>\n<li>Второй персонаж Миколая (из расчёта «2 моих и 2 твоих») в этом окне не описан.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0176--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0174.html\">Маг ветра</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0174.html\">Маг ветра</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0176--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-12-23</td>\n<td>273293–273306</td>\n<td>w0068</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-23</td>\n<td>273332–273357</td>\n<td>w0068</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-23</td>\n<td>273372–273404</td>\n<td>w0068</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-23</td>\n<td>273507–273516</td>\n<td>w0068</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-23</td>\n<td>273517–273556</td>\n<td>w0068</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-25</td>\n<td>274477–274483</td>\n<td>w0068</td>\n<td>неясно (по дате объ
