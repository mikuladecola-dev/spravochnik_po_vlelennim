<script>const BASE="";const DOCNAME="Закон";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0031-S01", "PS-0031--proishozhdenie"], "h": "<p>Закон появился в переписке 2024-03-12 (окно w0026, сообщения 138166–138172) не как персонаж, а как название способности в перечне Славы: «Есть способности / Закон». Вселенная в этот момент не названа. Носитель способности имени не получил — в переписке он идёт просто как «чел с такой способностью» (138181).</p>\n<p>Позже, 2024-04-02 (окно w0029, сообщения 151856–151860), Слава называет «закон» в одном ряду с петлёй и агентами-животными как заготовку, которую надо «закидать» во вселенную (вселенная на эту дату — «игра бога»).</p>\n<p>К 2024-07-09 (окно w0046, сообщения 202039–202062, вселенная «7 островов») Закон разбирается уже как персонаж с расой, целями и отношением к другим — в ряду персонажей преступной организации Пресрог.</p>\n<p>Как имя носителя способность и персонаж совпадают: в w0046 Слава на вопрос о поведении отвечает «Помнишь способности закона» (202056), то есть персонаж носит ту самую способность, которую разбирали в марте.</p>", "r": []}, {"t": "Характер", "a": ["S02", "PS-0031-S02", "PS-0031--harakter"], "h": "<p>Единственная развёрнутая характеристика дана 2024-07-09 (id 202040–202058).</p>\n<p>Раса — «Человек обычный» (202046).</p>\n<p>Слава: «Закон расист» (202040). Миколай спрашивает, как проявляется расизм и убивает ли он всех иной расы. Ответ Славы: «Ненавистью» (202049), «Но считает рабами и убиваетне» (202050), «Не всегда убивает» (202053).</p>\n<p>На вопрос Миколая «из преступной не трогает?» / «чисто презирает» (202054–202055) Слава отвечает «Да» (202057) — членов преступной организации Закон не трогает, только презирает.</p>\n<p>Отдельно оговорено соотношение сил с Каем: «Он бы и не смог его убить или победить» (202058) — Закон не смог бы одолеть Кая.</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0031-S03", "PS-0031--sposobnosti"], "h": "<p>Способность носит то же название, что и персонаж. Первая формулировка Славы (138166, 2024-03-12):</p>\n<div class=\"q\"><p>«Закон ( в радиусе 70 метром может сказать любой законны и его обязательно выполнять ( то бишь не убивать , не прыгать и т.д) а если нет будет наказание ( не прыгать если прыгнешь твой весь увеличиться на 1 тонну плюс минус ; не убивать за хочешь убить и нападешь то не сможешь двигаться н количество времени ))»</p></div>\n<p>То есть: радиус действия — 70 метров; произнесённый закон обязателен к исполнению; за нарушение следует наказание. Названные примеры наказаний — прыгнешь при запрете прыгать, вес увеличится примерно на 1 тонну; нападёшь с намерением убить при запрете убивать, не сможешь двигаться какое-то количество времени.</p>\n<p>Тем же сообщением Слава заявляет: «И вот это способности нужны слабости» — то есть разработка ограничений была задана сразу.</p>\n<p>Уточнения того же дня:</p>\n<ul>\n<li>Закон только запрещает, а не приказывает. Слава: «Нет закон что то запрещает только» (138188). Реплика возникает после того, как Миколай пробует приказные формулировки «Не живи» (138193).</li>\n<li>Действие не зависит от того, услышал ли человек. Слава: «Ты не понял закон будет действовать в радиусе 70 метров и там без разницы услышал ты или нет пока не покинул радиус действия способности закон будет действовать» (138176).</li>\n<li>«Любой кто в радиусе 70 метров должен подчиняться закону» (138201).</li>\n<li>Обращение может быть направлено одному человеку за раз или сразу нескольким на определённой территории — формулировка Миколая (138197–138200), возражений на неё в переписке нет.</li>\n<li>Носитель сам подчинён своему закону. Миколай: «Он сам должен следовать сказанному закону» (138204). Ответа Славы на эту реплику в переписке нет.</li>\n</ul>\n<p>Позже, 2024-07-09, Миколай переформулирует механику по памяти как «то шо говорит то и происходит» (202059) — с вопросительным «нет?» (202061), ответа в переписке нет.</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0031-S04", "PS-0031--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Пресрог</strong> — преступная организация, в разборе персонажей которой Закон обсуждается в w0046. Своих не трогает, только презирает.</li>\n<li><strong>Кай</strong> — Закон «бы и не смог его убить или победить» (202058).</li>\n<li><strong>Чел с абсолютным нулём, Феникс, Чел манипулирующий объектами</strong> — названы Славой 2024-03-12 (138203) как те, кто «там просто есть», в контексте того, против кого способности нужны слабости: «С абсолютным нулем который убьет любого кто в него попадет / Феникс полу бессмертный чел с харошой огневой мощью / Чел манипулирующий объектами».</li>\n<li><strong>Петля</strong> («перемотка времени на 10 секунд 10000 раз») и <strong>агенты-животные</strong> («люди берущий свою силу от животных то бишь агенты среди людей») — названы вместе с законом как заготовки для вселенной (151858), позже петля и закон снова названы парой внутри scp-концепции (152594).</li>\n<li><strong>Максим</strong> со способностью «власть» через закон — связь в переписке не проговорена, в исходнике помечена как догадка составителя.</li>\n</ul>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S05", "PS-0031-S05", "PS-0031--kak-menyalsya"], "h": "<p><strong>2024-03-12, окно w0026, id 138166–138172.</strong> Способность объявлена: радиус 70 метров, любой закон обязателен к исполнению, за нарушение наказание. Заявлено, что способности нужны слабости. Миколай сразу предлагает первые условия: цель должна услышать закон, знать язык, на котором он дан, и понимать, что требуется (138169); закон «должен быть сказан чётко и стандартизировано» (138170). Слава: «Ну допустим у них один язык ещё есть предложение» (138172).</p>\n<p><strong>2024-03-12, id 138169–138187.</strong> Миколай развивает слабость: «Ну можно уши закрыть / И тогда он не услышит и условия работать не будут» (138173–138174), предлагает привязку к радиусу или территории (138175). Слава отклоняет условие слышимости (138176). Миколай, признав, что не заметил радиус («А ой бл / Забыл, не заметил», 138177–138178), настаивает: «Нет, слабость хочешь придумать, пусть все таки чтобы человек должен слышать» (138179). Обоснование: «Ну без этого я хз как противостоять челу с такой способностью / Скажет, умри / И я убью себя / А если уши закрою, мне збс / Я сам убью его» (138181–138186). Итог спора в переписке не зафиксирован.</p>\n<p><strong>2024-03-12, id 138188–138206.</strong> Уточнение: закон только запрещает. Уточнение адресации (одному за раз или сразу нескольким на территории). Подтверждение радиуса: любой в 70 метрах обязан подчиняться. Слава формулирует задачу: «Ну типо ограничение из за которых он не может использовать способность» (138194). Миколай вводит ключевое ограничение: носитель сам должен следовать сказанному закону (138204).</p>\n<p><strong>2024-03-12, id 138215–138220.</strong> Разработка обрывается. Миколай: «Слава, я не буду погружаться и усложнять, все гениальное просто, если хочешь, что-то более конкретное учись давать более релевантное задание, да и вообще это по жизни пригодится))» (138218).</p>\n<p><strong>2024-04-02, окно w0029, id 151856–151860.</strong> Вселенная на эту дату — «игра бога». Название прозвучало без раскрытия механики: закон назван среди того, что Слава хочет «закидать» во вселенную вместе с петлёй и агентами-животными.</p>\n<p><strong>2024-04-02, id 152590–152600</strong> (повтор прежней мысли). Закон снова упомянут в связке с петлёй, теперь внутри scp-концепции. Слава: «Лучшей будет создать концепцию scp только вбухать туда и сверхсила типо петли и закона, и экспериментах на людях / И другую расу которая будет нам помогать / Вообще концепция охота на аномалий» (152594). Миколай отвечает, что не понял запрос и что ему нужно время: «Ты точно чет хочешь добавить у Поротая как по мне и так много способностей, а концепцию ты придумал, в чем вопрос не пон» (152599).</p>\n<p><strong>2024-07-09, окно w0046, id 202039–202062.</strong> Вселенная — «7 островов». Закон разбирается как персонаж: обычный человек, расист, проявление расизма — ненависть, иные расы считает рабами, убивает не всегда, членов преступной организации не трогает и презирает, Кая одолеть не смог бы.</p>", "r": []}, {"t": "Отклонённые варианты", "a": ["S06", "PS-0031-S06", "PS-0031--otklonennye-varianty"], "h": "<ul>\n<li><strong>Условие слышимости как слабость.</strong> Миколай: цель должна услышать закон, знать язык и понимать требование; можно закрыть уши и выйти из-под действия (138169–138174, 138179). Слава отклонил: в радиусе 70 метров действует независимо от того, услышал человек или нет (138176). Миколай продолжал настаивать; согласия в переписке не достигнуто.</li>\n<li><strong>Приказные формулировки</strong> («Не живи», 138193) — отклонены уточнением, что закон только запрещает (138188).</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0031-S07", "PS-0031--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Слабости способности так и не были окончательно согласованы: спор о слышимости оборвался, разработку Миколай прекратил репликой 138218.</li>\n<li>Имя носителя способности в w0026 не указано.</li>\n<li>Вселенная в w0026 не названа.</li>\n<li>В w0029 механика не описана вовсе — только название.</li>\n<li>Связь с персонажем Максимом и его способностью «власть» через закон в переписке не проговорена; в исходнике она помечена как догадка составителя, а не как решение авторов.</li>\n<li>Внешность персонажа в переписке не описана.</li>\n<li>Соотношение мартовской способности и июльского персонажа проговорено только косвенно (202056 «Помнишь способности закона»); отдельного решения о том, что это один и тот же носитель, в переписке нет.</li>\n<li>Реплика Миколая «привели мы так и не решили» (202041) относится к чему-то, что осталось нерешённым; к чему именно — из переписки не следует.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0031--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0026.html\">Пресрог (преступная организация)</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0026.html\">Пресрог (преступная организация)</a>, <a href=\"GR-0053.html\">Организация, ловящая обнаглевших существ</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a>, <a href=\"VS-0014.html\">игра бога</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0031--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-03-12</td>\n<td>138166–138172</td>\n<td>w0026</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-03-12</td>\n<td>138169–138187</td>\n<td>w0026</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-03-12</td>\n<td>138188–138206</td>\n<td>w0026</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-03-12</td>\n<td>138215–138220</td>\n<td>w0026</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-04-02</td>\n<td>151856–151860</td>\n<td>w0029</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-04-02</td>\n<td>152590–152600</td>\n<td>w0029</td>\n<td>игра бога (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2024-07-09</td>\n<td>202039–202062</td>\n<td>w0046</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0031-zakon.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0031--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0031.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
