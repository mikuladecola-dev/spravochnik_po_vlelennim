<script>const BASE="";const DOCNAME="Место и ты";
const LEAD="";
const CH=[{"t": "Об этом тексте", "a": ["S01", "PR-0097-S01", "PR-0097--ob-etom-tekste"], "h": "<ul>\n<li>Дата: 2025-11-21</li>\n<li>Сообщения: 387581–387583</li>\n<li>Состояние: брошено на середине (обрывается после того, как рассказчик добивает существо молотком на кухне)</li>\n<li>Действующие лица: рассказчик (Алексей/Леха), психолог, кот, Вадим-сосед (по телефону), Катька (упомянута), безымянное существо</li>\n</ul>", "r": []}, {"t": "Текст", "a": ["S02", "PR-0097-S02", "PR-0097--tekst"], "h": "<p>Место и ты</p>\n<p>Скажите у вас не возникала мысли ударить, мимо проходящего человека. Нет он ничего вам не сделал, вы в первые его видите. Но почему-то всё же проскальзывает едкая чувство, хорошенько его долбануть.<br>Ха. Я не поверю в эти невинные глаза, что отводят взгляд, и запинаясь пытаются убедить меня, что не за чтобы это не сделали.<br>КАЖДЫЙ хоть раз в жизни об этом думал. И сразу же возникают плохие мысли, о том что же произойдёт в мире, если все вдруг рельно это сделают, то начнётся хаос. Кровь мучения и страх смешаються в одну политру и станут единным, и тогда не будет психов. Ведь в мире психов нету психа.<br>К сожалению или к радость это вряд ли, когда-то случится. Законы, запреты, наказания и конечно же совесть, так сильно засели в человеческой натуре.</p>\n<p>Если вспоминать о давно ушедшим. То воспоминания можно разделить на 2 категории: плохие и хорошие, лишь именно эти воспоминания оставляються с нами на веки.<br>Воспоминания о том, как меня мелкого ещё не познавшего мир, окунал в холодную воду религиозный пьянеца, вроде как мой отец. Вода до дрожи холодная , от который сводили мышцы, которая мелкими холодными иглами, протыкали пухленькое лицо ребёнка и уходил в глубины тела и оставаясь там.<br>Воспоминания о том, как я всё ещё ребенок, но уже по-старше отрывал ножки насекомым и следил за ними. Думая когда же он умрёт и сколько можно нанести ему вреда, чтобы он был ещё живой. Не знаю, почему но это воспоминания въелось в мою головушку.<br>Воспоминания о том, как дрожал побитый времени комок оделяла, которым я укрылся в надежде на защиту. Хотя прекрасно понимал, что одеяла не способный остановить даже звуки пьянки неизвестных людей в соседней комнате, не будет способна остановить приближающие галдешь, а после удара армейским ремнём или рукой, сложно было предсказать, чем именно меня могут ударить.<br>Воспоминания о ток, как белый кот, что не хотел со мной ласкаться и вечно убегал. Больше не мог ходить, ведь его лапы были сломаны разваливающим молотком. И я был рад, теперь он мой и он нуждался во мне, и кот он был таким  жалким. Я прекрасно понимал что его жизнь в моих руках.<br>Так можно вспоминать ещё очень долго, но итог один. Я ненавидел людей , который доминировали или приченяли  мне вред. Но при этом до безумия любил доминировать и приченять вред. Это выглядит с одной стороны глупо, разве я, который испытал всю боль жертвы, не должен был ненавидеть насилия?</p>\n<p>Вдруг монотоный звук черчения ручкой прекратился и психолог поднял на меня взгляд.<br>- это был вопрос Алексей? - спросил мой психолог, пристально смотря на меня.<br>- Нет - слегка резка сказал я, и добавил - вы же сами сказили рассказать о прошлом и о чувствах и мыслях в те времена. А на этот вопрос вы уже отвечали-<br>Психолог мягко улыбнувшись опустил глаза. Крутя ручку в руках он спросил<br>- Вот знаете, что мне интересно Алексей. По какой причине вы не стали пьянецей, убийцей или кем либо ещё в криминальном  обществе? - в его глазах так и читалась &quot; Или стал? &quot;.<br>-в самом начале своего монолога я соврал- психолог скорчил удивлённое лицо.<br>- не КАЖДЫЙ об этом думает. Точнее сказать я надеюсь, что не каждый об этом думает. Хотя бы не та миловидная бабуля, что подкармливала меня.-<br>Доктор явно ждал продолжение, но боялся словом спугнуть душевный разказ своего клиента, который в первые за 9 встреч дошёл, до того почему клиент не стал тем кем должен был стать. Я лишь усмехнулся про себя.<br>-После кота я совсем сорвался. И перешёл уже на сверстников и детей по младшие. Начал их бить, унижать и придераться.<br>Я также начал часто драться и к сожалению не всегда выигравал...... ПИЛИПИЛИПИПяляияп.<br>Зазвонил мой старенький телефон. Я не глядя взял трубку.<br>-ало-<br>- Леха дом горит! - крикнули мне в ухо. Я резким движением убрал телефон от уха. Но быстро поняв смысл слов вернул его к уху.<br>- Всмысле чей? где?- недомивал я<br>-да.. Моя горит квартира. Катька кастрюлю на плите оставила.- я пытался вспомнить приятеля, у которого была девушка Катя.<br>- У тебя же ключи от квартиры есть? - резко спросили меня. Я же на автомате ответил -да- даже не поняв, кто звонит<br>-идти пожалуйста кастрюлю сними или хотя бы документы вынеси- я встал с кожанного дивана. И начал снимать куртку с вешалки, так и не понимая куда ехать.<br>Я быстро надел куртку и открыв дверь в спину услышал<br>- встретимся в пятницу Алексей- сказал доктор улыбаясь мне в спину. Я же уже выскачил из кабинета психолога и наконец-то посмотрел, кто звонит &quot; Вадим сосед&quot; Была надпись на телефоне. И я ускорил шаг. Нет, на квартиру соседа было от части наплевать.<br>Вот только он сосед через стенку и если начнётся пожар, то гореть начнёт и моя квартира.<br>Ветер нагло бил мне в лицо пока я бежал , словно пытаясь остановить. &quot;Чёртов психолог&quot; Бегали эти мысли. Ведь именно он сказал раз мой дом рядом, то лучшей идей будет ходить к нему пешком для улучшения психологической стабильности или чего-то там. Я бежал, от резкой нагрузки лёгкие отдала огнем, а сердце билась как сумашедшая, пытаюсь поспеть за телом.<br>Улица, дом и окно соседа из которых ничего не светится.<br>Меня это не успокаивает и, я стоя у домофона не мог найти эту долбанную пилюлю. Наконец найдя пилюлю, я прикладываю его к домофону. И со всей силой потянув дверь, я переборщил и она громко ударяеться от бетонную стенку, но меня это мало волнует. Я уже перемахиваю через ступени и быстро поднявшись на 4 этаж. На ходу я рукой уже искал запасной ключ  от соседской квартиры. Намереваясь ранее после психолога сразу покормить кота, поэтому и взял ключи с собой.<br>Бинго я нашёл их во внутреном кармане и на удивления попав с первой попытки в скважину. Также сильно отталкиваю дверь и забегаю.<br>Кот, жирный кот подумав, что пришли хозяевы побежал с закрытыми глазами терется об ноги. Споткнувшись от кота, что весом был больше меня. Я рестекся на полу, чувствуя как в нос наливаеться красная густая жидкость.<br>Вставая, я проклинал этого кота, что лежал на моих ногах (но славу богу).<br>Поднявшись  уже спокойно, пошёл на кухню, как видимо из разбитого носа вместе с кровью вышел и весь адреналин.<br>Спокойно идя на кухню. Взглядом искал салфетки или ещё чего, чем можно остановить кровь. Потому что уже понял, что пожара нету. Если бы был пожар, то был бы дым, запах и жара да и кот если всетаки, что-то горела таким беспечным не был бы.<br>Да уж, конечно ничего не горела и кастрюли не было. Было лишь непомытая кастрюля в раковине и включённая электрическая плита.<br>&quot; Да уж герой спас от переплаты&quot; Подумал про себя выключая плиту. Я устала вздохнул и взяв вафленная полотенца на кухне. Начал им прикрывать нос.<br>Я посмотрел на окно без всякой мысли. Без цели, что-то там увидеть. Но что-то было, что-то показалось мне. Лишь на долю секунды, нееет меньше чем на долю секунды. Мой мозг, да и я сам не успел осознать, что это было. Я даже не был уверен, что там что-то было. И даже описать не могу, что я видел, ведь это было слишком быстро. &quot; Я шизофриник&quot; Возникла мысль, но не успела быть обдуманно. Как стеклопакет затрясся и было ощущения, что он сейчас разобьётся.<br>Дом строгнул. Кастрюля и посуда затряслись в такт  вибрации. Я же уже сидел под столом. Вспоминая множеств моментов из фильмов, где деревянный хрупкий стол спасал людей от движения гиганстких  земных плит. Кот же прыжком прыгнул ко мне с расширенными глазами, и больно вцепившись в руку прижимался ко мне, словно хотел стать меньше.<br>Я же дрожал, от мысли, что это не землетрясение.<br>Дом всё дрожал, и мысли, что это землетрясения всё дальше уходили от меня, вместе с кровью, что льётся из носа. Ведь не бывает таких длинных землетрясений, тем более в нашей-то стране, где все природные явления если, и проявляють себя то слабо.<br>Вдруг резко без следствий всё остановилась. Словно природа матушка всё же решила жалуется над разумом жалкого человека. Но нет это была не наша любимая матушка природа. Это было что-то иное, что-то более хитрое и понимающие человеческий разум.<br>Она остановилась лишь на мгновения, чтобы я выдохнул и резкими и дрожащими движениями начал искать пачку сигарет. Попутна ощущая, как ноет рука, в который цепился рыжий котяра.<br>А после она решила уронить этот мир. Да здания, или даже весь мир начал падать. Если честно я бы не понял, что мир падает, не был бы моей обескоенный разум ощутить это. Но он был способен осознать, что поднявшийся в воздух стол, посуда и конешно же любимый котяра. Не просто так всё в воздухе.<br>И после мой разум принял самое правильное решения. Верный ответ он нашёл и сделав правильный вывод он отключился. Отключился и я. Ну это понятное дело. И я считавший себя хищником среди стадо баранов не понимающий собственных желаний. Выключился от непонимания происходящего.</p>\n<p>Не знаю сколько прошло времени. Мне снилось сны очень яркий и непонятный, но такие приятные. Я не хотел просыпаться, я и дальше хотел быть во сне думая, что сон это ряльность, а всё остальное бред бредовой собаки. Но новый мир решил не ждать моего естественного пробуждения и не ждать пока я не перекурю чем то похожим на белку. Он вытянул меня из защитного крепости, мерзким и отвратильным способом. Обоссал он меня короче, хотя я не уверен, что это было моча. Но мой мозг, что перебирал всю информацию, именно так ощутил жидкость, что лелась на моей тела.<br>Я открыл глаза и увидел, кем то не перижованый кусок мяса с хрящами. И это кусок мяса чём-то похожий на тень человека, испустил из своего отверстия, которая находилось на пузе, жёлтую густую жидкость.<br>На удивление как видимо не только меня, так как это существо удивлённое глядело на меня своими глазами бусинами. Я спокойно встал, попытался вытереть жидкость кухонным полотенцем, что было у меня в руках. Поняв, что это бесполезно, решил медленно наматать полотенце на кулак.<br>Это существо, что-то булькало своим отверстиям у пуза. Возможно она хотела, что-то сказать, но не могла. Но было уже поздно удар в лицо и это существо пошатнулась и пошла назад. Не успел он не отойди, не прийти в себя, как мой ботинок впечатался в пуза этого... Этого, как ещё его можно назвать.<br>Он упал быстро и тяжело, и вертелся как таракан упавший на спину. Каждый моей пинок по его туши. Он издавал знакомый звук визга жертвы. Да это звук легко узнать хоть у человека, животного и насекомого они разные, но интонация одна и та-же.<br>Это существо оказалось живучим после десятков моих ударов, когда я уже начал давать заднию. Он всё мычал, и сложно было понять по куску мяса, нанёс я ему вред или нет.<br>Я решил бросить это дела, ведь это бесмысленно. Хотя я же на кухне. Я быстро огляделся и увидел стелажи и столики. Ножницы, ложки, тарелки и тому подобной бытовой фигни.<br>Да нож тоже фигня,  ведь это кухонный нож. Он хлипкий и тонкий и легко сгибается, ранить им конечно можно, но не убить, да и застрять он может. Поэтому я искал что-то более увесистое.<br>Открывая очередной шкафчик и опустив туда руку я почувствовал что-то холодной и достаточное тяжёлое. Достав я понял, что это молот для обивки мяса. Идеально молоток для куска мяса.<br>Моей трепещало от интереса, что же там внутри него. Словно я ребёнок, что так и жаждет раскрыть подарок. И конечно же я его раскрыл. Пять именно пять ударов молотком дало понять, что череп у него всё же есть. Но спрятанный под обилием плоти.<br>&quot;Так ты всё же человек. Ну или был им когда-то &quot;не знаю почему возникла эта мысль. Ну я  не отрицал эту мысль.<br>&lt;/content&gt;</p>", "r": []}, {"t": "Примечания и поправки", "a": ["PR-0097--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PR-0097.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
