<script>const BASE="";const DOCNAME="Самосбор";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0144-S01", "MR-0144--ustroystvo"], "h": "<p>Самосбор — явление внутри мира Гигахрущевка (<a href=\"MR-0143.html\">Гигахрущевка</a>), а не отдельная территория. Слава излагает его так: «Самосбор- это неизвестная явления, которая пагубная влияет на организм человека. Он может превратить его в лужу ( чаще всего это случаются) либо в какую-то нечисть. Самосбор невозможно предугадать. Он появляется в рандомных местных и этажах и может протекать разное время» (2025-08-07, id 353608).</p>\n<p>Из описания следуют признаки:</p>\n<ul>\n<li>Природа явления неизвестна — оно так и названо, «неизвестная явления».</li>\n<li>Действует на человеческий организм и действует «пагубна».</li>\n<li>Два известных исхода: превращение в лужу и превращение «в какую-то нечисть». Первый указан как более частый — «чаще всего это случаются».</li>\n<li>Предсказать невозможно: «Самосбор невозможно предугадать».</li>\n<li>Место возникновения случайно и по горизонтали, и по вертикали — «в рандомных местных и этажах».</li>\n<li>Длительность непостоянна — «может протекать разное время».</li>\n</ul>\n<p>Реакция Миколая на описание — «жутко» (id 353609).</p>", "r": [["Гигахрущевка", "MR-0143.html"]]}, {"t": "Население", "a": ["S02", "MR-0144-S02", "MR-0144--naselenie"], "h": "<p>Явление затрагивает людей Гигахрущевки; отдельного населения у Самосбора нет. Единственное упоминание существ — «какая-то нечисть», в которую может превратиться человек. Что это за нечисть, сохраняет ли она сознание, остаётся ли в мире после превращения — в переписке не сказано.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0144-S03", "MR-0144--mesto-vo-vselennoy"], "h": "<p>Самосбор — часть вселенной Гигахрущевка (<a href=\"MR-0143.html\">Гигахрущевка</a>), взятой из книг, которые прочитал Слава. Материал чужой, не авторский.</p>\n<p>Слово «Самосбор» в том же разговоре звучит и как возможное название всей вселенной: «Вселенная гигохрущевка» / «Ну или самосбор» / «Не знаю как она называется» (id 353586–353590). То есть у названия два употребления — явление и вселенная целиком, — и переписка их не разводит.</p>", "r": [["Гигахрущевка", "MR-0143.html"]]}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0144-S04", "MR-0144--kak-menyalsya-po-versiyam"], "h": "<p>Версия 1 — 2025-08-07 (окно w0102, id 353604–353610). Единственное состояние, изложено одним сообщением (id 353608). К описанию больше не возвращались.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0144-S05", "MR-0144--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Причина и механизм явления не названы — по условию оно «неизвестное».</li>\n<li>Не сказано, есть ли защита, предупреждающие признаки или способ пережить Самосбор.</li>\n<li>«Какая-то нечисть» не описана: ни вид, ни поведение, ни дальнейшая судьба превращённого.</li>\n<li>Не сказано, обратимо ли превращение.</li>\n<li>Диапазон длительности не назван — только «разное время».</li>\n<li>Не сказано, связан ли Самосбор с тем, что в Гигахрущевке неизвестно происхождение воды и электричества и назначение отходов.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0144--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0143.html\">Гигахрущевка</a></li>\n<li><strong>Упомянут в мирах:</strong> <a href=\"MR-0143.html\">Гигахрущевка</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0004.html\">Гигахрущевка</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0144--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-08-07</td>\n<td>353604–353610</td>\n<td>w0102</td>\n<td>Гигахрущевка (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0144-samosbor.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0144--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0144.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
