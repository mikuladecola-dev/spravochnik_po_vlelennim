<script>const BASE="";const DOCNAME="Некрономикон наш";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0049-S01", "MR-0049--ustroystvo"], "h": "<p>Вселенная-сборник, задуманная Славой 8 августа 2024 года (2024-08-08, id 215852–215916). Принцип объявлен сразу: «Я хочу построить вселенную на из мини истории», «То бишь вот это история / Потом другая связанная с первой но другая». Миколай переформулирует это вопросом: «строим огромную историю из кучи маленьких?» (id 215879).</p>\n<p>Каждый соавтор пишет своё. Слава: «Сам придумаю мини историю со своим монстром». Миколай уточняет: «ты со своим я со своим?» — «Да» (id 215890–215893).</p>\n<p>Что связывает истории между собой, выясняется в перечислении Миколая (id 215896–215900): «одна вселенная», «один город», «одно время», «одни персонажи». Часть пунктов не подтверждается: на «один город» Слава отвечает «Лубок время / Хоть какие» (id 215902–215903), то есть привязка к одному городу и к конкретному времени снимается. Итоговая формулировка, которую Миколай выводит и просит подтвердить: «получается их объединяет одна вселенная и тематика монстров, больше границ нет» — «верно?» (id 215910–215911). Прямого «да» на этот вопрос в переписке нет; следующее сообщение Славы уходит на имя главного героя.</p>\n<p>Из перечисленного подтверждается общий обмен персонажами: «Можно добавлять персонажей из старых истории», «Например я спизу у тебя когото» (id 215898, 215901). То есть герой одной мини-истории может появиться в чужой.</p>\n<p>Название у вселенной рабочее. Миколай спрашивает «че в нашей книге монстров будет» и тут же предлагает: «ну типа Некрономикон наш» (id 215872, 215875). Отдельного собственного имени в переписке ей так и не дают.</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0049-S02", "MR-0049--naselenie"], "h": "<p>Наполняется книга монстрами, и способов их получить оговорено три. Вопрос Миколая: «мы будем новых создавать, меня имеющихся или полностью пиздить» — ответ Славы: «Ну то и то» (id 215870–215871). То есть в ход идут и новые монстры, и переделанные существующие, и заимствованные целиком.</p>\n<p>Названо на этом этапе:</p>\n<ul>\n<li><strong>Тварь</strong> — первый монстр вселенной: «У нас есть первый монстр / Тварь». На уточняющий вопрос Миколая «рыба?» Слава отвечает «Да» и добавляет: «Ну типа новый вид монстров» (id 215858–215867). В базе проходит как человек-рыба из озера.</li>\n<li><strong>Лохнесское чудовище</strong> — предложение Миколая из разряда заимствованных и переосмысленных: «ейти все незаслуженно забыли», «лохнеское чудовище», «их можно по новому раскрыть» (id 215883–215885). Дальше в этом окне не развивается.</li>\n<li><strong>Андрей</strong> — главный герой историй Славы: «Кстати гг мой историй зовут Андрей» (id 215913). Миколай отзывается «надеюсь Федореев» (id 215916); подтверждения фамилии в переписке нет.</li>\n</ul>\n<p>В файле как связанные с этой вселенной также названы Беркут и Чёрт с ножиком (монстр хранителя секрета) — в самом фрагменте переписки они не упоминаются.</p>", "r": []}, {"t": "Место во вселенной — как связан с другими мирами", "a": ["S03", "MR-0049-S03", "MR-0049--mesto-vo-vselennoy"], "h": "<p>Это не мир внутри вселенной «монстры», а сама рамка сборника: одна вселенная, внутри которой лежат все отдельные мини-истории про отдельных монстров. Вселенная в этом окне объявлена прямо.</p>\n<p>Про время в переписке звучит «через 600 лет» (id 215912), реплика идёт вперемежку с обсуждением сроков, когда кто придумает свою историю, и к устройству мира не привязывается.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0049-S04", "MR-0049--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-08-08 (id 215852–215916), окно w0050.</strong> Единственная версия. За двенадцать минут проговорено всё: принцип сборника мини-историй, первый монстр (Тварь), три источника монстров (новые, переделанные, заимствованные), раздельное авторство при общем праве брать чужих персонажей, набор объединяющих рамок с отсечением части из них, рабочее название «Некрономикон наш», имя главного героя историй Славы.</p>\n<p>Отклонённые по ходу рамки: «один город» и привязка к одному времени — оба сняты ответом «Лубок время / Хоть какие». Пункт «одни персонажи» превращается в необязательную возможность переноса, а не в требование.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0049-S05", "MR-0049--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Собственного имени у вселенной в чате нет — только рабочие обороты «наша книга монстров» и «Некрономикон наш».</li>\n<li>Итоговая формулировка границ («одна вселенная и тематика монстров, больше границ нет») задана как вопрос «верно?» и остаётся без прямого подтверждения.</li>\n<li>Лейтмотив историй Миколай спрашивает («а лейтмотив историй», id 215892) — ответа на этот вопрос в переписке нет, разговор уходит на объединяющие рамки.</li>\n<li>Фамилия Андрея не подтверждена: «надеюсь Федореев» остаётся репликой без ответа.</li>\n<li>Что означает «Лубок время» — в переписке не разъясняется; Миколай переспрашивает «что», затем пишет «а / пон», но своими словами не пересказывает.</li>\n<li>Сроки, к которым каждый должен придумать свою историю, обсуждаются («Сегодня», «Или завтра»), но не назначаются: «и тотне обещаю».</li>\n<li>Связь Беркута и Чёрта с ножиком с этой вселенной в данном окне не проговорена.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0049--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0049--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-08</td>\n<td>215852–215916</td>\n<td>w0050</td>\n<td>монстры (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0049-nekronomikon-nash.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0049--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0049.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
