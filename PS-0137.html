<script>const BASE="";const DOCNAME="Терианство Кирилла";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0137-S01", "PS-0137--proishozhdenie"], "h": "<p>Терианство Кирилла введено Миколаем 2024-08-11 (id 217710–217756, окно w0051) как объяснение того, кто такие терианы и квадроберы и почему Кирилл к ним относится. Объяснение служит обоснованием, зачем ребёнку понадобилось летать.</p>\n<p>Терианы описаны так: «это люди которые себя ощущают животными и ведут соответственно», «тобиж как кошка например». Поведение перечислено: «ходят на 4 лапах, выгибаются, трутся обо всё, сворачиваются к клубок». Про распространённость сказано: «среди детей нынче популярная практика, да и взрослых».</p>\n<p>В переписке рядом идёт обмен про йогу: Слава спрашивает, когда будет скинута история, и пишет «Типа ега», «Ейга», Миколай поправляет — «йога брат», после чего уточняет про териан: «ну не», «не она», «они так прям живут».</p>\n<p>Отдельно Миколай переформулировал понятие после того, как Слава не понял: «так нахуй, хорошо», «тогда иначе выражусь», «он был квадробером». Квадроберы определены как «терианы которые не всегда себя так ведут», «это типо спорт». Тут же оговорка «не квадрокоптером», «камон».</p>", "r": []}, {"t": "Характер", "a": ["S02", "PS-0137-S02", "PS-0137--harakter"], "h": "<p>Кирилл относил себя к терианам: «кирил к ним относил себя». При этом «он считал себя птицей» — на что Слава сразу отозвался словом «Птица» и «Он птица».</p>\n<p>Примера для подражания у Кирилла не было: «он не видел примера где кто-то так делал», «ни одной птицы квадробера нет». Поэтому «он в основном изучал их» — то есть птиц.</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0137-S03", "PS-0137--sposobnosti"], "h": "<p>Крыльев у Кирилла нет: «он не имеет крыльев», «и не мог даже с земли взлететь». Из этого следует его занятие — «он искал способ полететь».</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0137-S04", "PS-0137--svyazi-s-drugimi"], "h": "<p>Кирилл — терианство описано как его свойство, персонаж проходит по разделу «Часть чего: Кирилл».</p>\n<p>Беркут — от того, что Кирилл считал себя птицей, выведена внешность Беркута: «и поэтому беркут был частично похож на человека, который с оперением на голове».</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S05", "PS-0137-S05", "PS-0137--kak-menyalsya"], "h": "<p>Одно состояние, 2024-08-11 (id 217710–217756). Внутри самого разговора формулировка сдвинулась: сначала Кирилл назван терианом, затем, для понятности, квадробером — то есть терианом, который «не всегда себя так ведёт». Обе формулировки в переписке остаются, вторая заявлена как иначе выраженная первая, а не как замена.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0137-S06", "PS-0137--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Слава задал подряд возражения: «Почему самого начал не выпрыгнул с окна», «Почему разговаривал», «Почему не ел червей», «Почему разетку не вставлял», «Почему не издавал звука полнта». Ответов на них в переписке нет.</li>\n<li>Какой именно птицей Кирилл себя считал — не сказано; беркут назван только применительно к Беркуту.</li>\n<li>Как он «изучал» птиц и нашёл ли способ полететь — в переписке не сказано.</li>\n<li>Возраст Кирилла не назван; о нём говорится как о ребёнке только косвенно, через фразу про то, что практика популярна «среди детей».</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0137--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0046.html\">Терианы (квадроберы)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0137--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-11</td>\n<td>217710–217756</td>\n<td>w0051</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0137-terianstvo-kirilla.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0137--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0137.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
