<script>const BASE="";const DOCNAME="Пузырик";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0344-S01", "PS-0344--proishozhdenie"], "h": "<p>Один из пришельцев. В окне w0114 (2025-12-17, id 399324–399334) Слава напоминает ранее данное им описание: «И это пузырик я говорил выглядит подобно медузи» (id 399325). Версия помечена как повтор прежней мысли — первичный разговор, где внешность была задана, в этом фрагменте не приведён.</p>\n<p>Имя-прозвище — Пузырик (в переписке строчными: «пузырик»).</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0344-S02", "PS-0344--vneshnost"], "h": "<p>Выглядит подобно медузе.</p>\n<p>Как и с <a href=\"PS-0343.html\">Летающий пришелец</a>, описание всплывает при разборе картинок, сгенерированных нейронкой: Слава называет то, что он говорил, но чего в изображениях не видно. Миколай подтверждает, что в запрос это не шло: «аа, ну я тогда в описание не кидал это» (id 399327).</p>", "r": [["Летающий пришелец", "PS-0343.html"]]}, {"t": "Связи с другими", "a": ["S03", "PS-0344-S03", "PS-0344--svyazi-s-drugimi"], "h": "<p>Часть пришельцев.</p>\n<p>Упоминается в одной реплике с <a href=\"PS-0343.html\">Летающий пришелец</a> (Летающий пришелец).</p>", "r": [["Летающий пришелец", "PS-0343.html"]]}, {"t": "Как менялся — состояния по датам", "a": ["S04", "PS-0344-S04", "PS-0344--kak-menyalsya"], "h": "<p><strong>2025-12-17 (id 399324–399334).</strong> Единственное зафиксированное состояние: подобен медузе. Версий больше одной нет.</p>\n<p>В том же куске проговаривается, как делались пришельцы: «ну это было в целом по моим идеям, ты дополнял, но я кидал первые запросы» (Миколай, id 399332), и что сгенерированные нейронкой описания можно найти, полистав переписку: «если полистаешь видно будет», «которые нейронка писала» (id 399333–399334).</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "PS-0344-S05", "PS-0344--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Внешность задана одним сравнением — подобен медузе; ничего более конкретного не сказано.</li>\n<li>Способностей у Пузырика в переписке не названо.</li>\n<li>Роль в сюжете не названа.</li>\n<li>Что за существо в реплике «Это я вообще хуй знает кто» (Слава, id 399326) — не установлено.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0344--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0082.html\">Пришельцы (линия Фени)</a></li>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0343.html\">Летающий пришелец</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0343.html\">Летающий пришелец</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0082.html\">Пришельцы (линия Фени)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0344--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-12-17</td>\n<td>399324–399334</td>\n<td>w0114</td>\n<td>Феня (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0344-puzyrik.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0344--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0344.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
