<script>const BASE="";const DOCNAME="Рассказчик-монстр";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0197-S01", "PS-0197--proishozhdenie"], "h": "<p>Чужемирец, от лица которого ведётся вся история о защитнике (2025-02-12, id 288543–288546). Имени у него нет, вид не назван — он обозначен только тем, что принадлежит к чужемирцам и говорит про «мой мир»: «не каждый из моего мира хотя бы раз в жизни так вкусно и сытно питался».</p>\n<p>Появляется он как голос повествования. Первые строки текста — описание лежащего в лесу мужчины лет 40 в луже собственной крови, рядом «с целом семейством непонятных тварей», которые лежат, «но живыми не были». Только через несколько фраз голос обозначает себя: «Хотите знать, что произошло, хорошо. Я поведаю историю этого мужчин прежде чем он встанет и закончит начатая». К концу текста выясняется, что рассказывающий — один из тех самых тварей, тоже лежащий в лесу, с переломанными конечностями, и что он говорит о собственной скорой смерти.</p>\n<p>Он входит в группу чужемирцев, на которую наткнулся защитник: «и так однажды он наткнулся на нашу группу и порешал есть сам конечно получив тяжёлый ранения». Всё, что известно о его происхождении, этим и ограничивается — как он попал в лес, кто были остальные из группы и откуда взялся его мир, в переписке не сказано.</p>\n<p>О своём положении среди других чужемирцев он высказывается один раз, и то вскользь: про серых карликов, влетевших в окно дома, он говорит «Даже в сравнение со мной это существо вообще нижая». Про связь карликов с высокими безволосыми тварями он прямо признаёт, что не знает: «Если честно сам не могу сказать кем им приходится карлики. Может они родственники, а может просто подчинённый и слуга».</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0197-S02", "PS-0197--vneshnost"], "h": "<p>Не описана. Ни роста, ни строения, ни числа конечностей рассказчик о себе не сообщает — при том что о других чужемирцах в тексте описания есть (серые карлики — «мелких, быстрых, скучающих крыс»; вторая пара — «высокий, мускулистый, без одежды и волос, глаза у них были маленькие»; отдельно упоминается «шесте рукой чудовище» и оборотень — «тощий силуэт покрытой шерстью»). К какому из этих типов относится сам рассказчик и относится ли вообще — в переписке не сказано.</p>\n<p>Косвенно известно только состояние его тела на момент рассказа: защитник «переломал мне всё конечности и не только», и встать он не может.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0197-S03", "PS-0197--harakter"], "h": "<p>Рассказчик говорит о происходящем с удовольствием и с постоянным смехом, вписанным прямо в речь: «ОН ДУМАЛ о приключений!!, сейчас если он вспомнил об этом, он бы убил бы себя АХХАХАХа!!!». Смерть дочери защитника он комментирует так же: «Ахаха это прекрасная чувство зародивший внутри защитника, который видел и слышал, что происходит».</p>\n<p>Он оценивает человеческую еду и человеческие состояния как гурман. Про шашлык — «хм неплохой лакомство людей». Про вечер за настольной игрой — «мммм какое же вкусной чувства умиротворения у него было, божественно». Схватку и всё, что он получил от защитника, он называет пиром: «Я ему уже благодарен тем, что мне даль вкуснейший пир перед смертью, не каждый из моего мира хотя бы раз в жизни так вкусно и сытно питался».</p>\n<p>Он несколько раз одёргивает сам себя, чтобы не уходить от линии повествования: «Хм если задуматься то в его воспоминаниях я ни разу не увидел страх за себя, хотя возможно он, где-то в более старых воспоминаниях, но у меня нет времени проверять и смотреть, так что продолжим»; «Но мы отходим от темы». Обращается к читателю напрямую и подтрунивает над ним: «И вроде, всё спасены, да здравствует счастливая концовка. Если вы и правду поверили, то вам бы лечится. Ну и ладно».</p>\n<p>Отдельная черта — отказ убивать беспомощного противника не из милосердия. На собственный вопрос «И вот вопрос почему я его не убью раз он сейчас без сознания» он отвечает: «Ответ просто он переломал мне всё конечности и не только. Но если бы я даже мог бы, я бы ни за что этого не сделал ведь он должен жить узнать о чужемирцов, о благословенных, о артефактах он должен страдать и быть снова счастливым».</p>\n<p>Его единственное сожаление — что он не увидит продолжения: «Но всё же у меня есть сожаления, то что я не смогу увидеть дальше жизнь защитника не его страдания, не боли, не счастья и не смогу увидеть всё растущую вину. Нет не ту вину, что не смог уберечь свою семью, вот она по размеру с гневом рядом с ним. А чувством вины за убийство не виновных чужемирцов. Хотя сейчас она маленькая, но она растет. Ах как жаль».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0197-S04", "PS-0197--sposobnosti"], "h": "<p>Чтение чужих воспоминаний. Вся история защитника, которую он излагает, — это то, что он видит в лежащем рядом без сознания человеке. Границы способности он проговаривает сам, когда доходит до эпизода, где жена и дочь заперлись в комнате: «Где же были его дочь с женой? Не знаю, я же вижу только воспоминания защитника». То есть он видит происходившее ровно в том объёме, в каком это воспринимал сам защитник, и не более.</p>\n<p>Доступ к более старым слоям памяти, по его словам, есть, но требует времени, которого у него нет: «возможно он, где-то в более старых воспоминаниях, но у меня нет времени проверять и смотреть».</p>\n<p>Механика способности — как именно он читает, нужен ли контакт, работает ли это только на бессознательных — в переписке не описана. Названия у способности нет.</p>\n<p>Второе — «подарок» внутри его тела. Перед смертью он сообщает: «Но защитник уже отчухивается, и я уже подготовил для него подарок, нет не пакость, а настоящее подарок, он находится внутри меня и когда защитник будет рвать меня он получит этот подарок». Что это за подарок, чем он является физически и что даёт получившему — не сказано; это отдельная сущность «Подарок внутри монстра».</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0197-S05", "PS-0197--svyazi-s-drugimi"], "h": "<p><strong>Защитник</strong> — человек, чью историю он рассказывает и рядом с которым лежит. Отношение к нему двойное: с одной стороны, защитник переломал ему все конечности и убьёт его через несколько секунд; с другой — рассказчик благодарен ему за «вкуснейший пир перед смертью» и хочет, чтобы тот жил дальше и «страдать и быть снова счастливым». Именно защитник, приходя в себя, его и убивает: текст заканчивается словами «Эх ладно пок.... В лесу пронеся хруст ломающий черепушки».</p>\n<p><strong>Чужемирцы</strong> — его собственный род. Он говорит о них «мы» и «наша группа», называет истреблённых защитником чужемирцев невиновными («вину за убийство не виновных чужемирцов»), но при этом не берётся определить внутренние связи между разными их видами.</p>\n<p><strong>Подарок внутри монстра</strong> — то, что он оставляет защитнику своим телом.</p>\n<p>Кроме этого он упоминает <strong>благословенных</strong> и <strong>артефакты</strong>: защитник после пыток шестирукого чудовища «начал как то инстинктивно понимать, где находиться чужимирцы словно благословенный. Но он им не был», и рассказчик хочет, чтобы защитник «узнать о чужемирцов, о благословенных, о артефактах». Как рассказчик связан с благословенными и артефактами и откуда он о них знает — в переписке не сказано.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0197-S06", "PS-0197--kak-menyalsya"], "h": "<p>Персонаж появился и завершился в один день, 2025-02-12, в окне w0075. Версий две, и вторая — не переработка фигуры, а разговор авторов о ней.</p>\n<p><strong>Версия 1 — 2025-02-12 (id 288543–288546).</strong> Слава выкладывает текст целиком, тремя сообщениями подряд. Голос повествования оказывается умирающим монстром, читающим воспоминания жертвы; в финале он погибает. Сразу после текста Слава добавляет о собственной работе: «Каюсь в конце я сдулся» (288546).</p>\n<p><strong>Версия 2 — 2025-02-12 (id 288613–288621).</strong> Обсуждение приёма самими авторами. Слава спрашивает: «А тебе вообще как была идея, что рассказчик монстр, и что помер?» (288615) — и тут же говорит, что придумал это на ходу, по мере написания: «Нет я просто в этом моменте в ахуе от себя мне пришла гениальная идея про монстра и я его реализовал» (288616).</p>\n<p>Миколай отвечает, что с рассказчиками уже работал раньше: «я уже в своих историях играл с рассказчиками поэтому я не сильно удивился. но я точно обрадовался когда такую идею встретил», и следом уточняет: «ладно я оч удивился, особенно тем что это монстр и то что он сдох. просто хотел сказать что удивление не в плане первородности» (288617). Далее он объясняет, почему сначала начал с нейтрального ответа: он уже обсуждал историю с нейросетью, не скидывая её Славе, и та отметила, «как круто автор использовал рассказчика это интересно и необычно»; Миколай не хотел повторяться за нейросетью и потому решил зайти «как-то с критики, но не сдержался» (288619). Отдельным сообщением он снимает возможную двусмысленность: «в кавычки взял чтобы речь выделить если что, а не сарказм. пишу ибо интерпретация двойная, а наука такое не прощает» (288620).</p>\n<p>Изменений в самой фигуре рассказчика между версиями нет — вторая версия фиксирует только то, что ход был импровизацией автора, а не заготовкой.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0197-S07", "PS-0197--chto-s-nim-stalo"], "h": "<p>Погибает в финале собственного рассказа. Защитник приходит в сознание и убивает его; последняя реплика рассказчика обрывается на полуслове — «Эх ладно пок....» — и текст заканчивается фразой «В лесу пронеся хруст ломающий черепушки».</p>\n<p>Перед смертью он успевает подготовить «подарок» внутри своего тела, который защитник получит, когда будет его рвать. Получил ли защитник этот подарок и что с ним дальше — за пределами текста; продолжения в переписке нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0197-S08", "PS-0197--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имени нет.</li>\n<li>Вид не назван. К какому из описанных в тексте типов чужемирцев он относится — в переписке не сказано.</li>\n<li>Внешность не описана вообще.</li>\n<li>Свои отношения с другими чужемирцами он сам определить не может: «Если честно сам не могу сказать кем им приходится карлики. Может они родственники, а может просто подчинённый и слуга».</li>\n<li>Механика чтения воспоминаний не объяснена: неизвестно, нужен ли контакт, работает ли способность на бодрствующих, есть ли у неё цена.</li>\n<li>Что такое «вкуснейший пир», за который он благодарен защитнику, — не раскрыто.</li>\n<li>Состав и природа «подарка» внутри него не названы, последствия его получения не показаны.</li>\n<li>Откуда он знает про благословенных и артефакты — не сказано.</li>\n<li>Продолжения нет: судьба защитника после этой сцены осталась нерешённой, о чём говорит и сам рассказчик.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0197--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0019.html\">Чужемирцы</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0019.html\">Чужемирцы</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0197--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-02-12</td>\n<td>288543–288546</td>\n<td>w0075</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-02-12</td>\n<td>288613–288621</td>\n<td>w0075</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0197-rasskazchik-monstr.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0197--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0197.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0197-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0197/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Самый дорогой узел рядом — сам Защитник. Он есть в справочнике только как история <code>IS-0017</code> (две ссылки, статья 49 884 при базе 139 029): почти девяносто тысяч знаков базы в статью не попало, а на эту фигуру опираются <code>PS-0197</code>, <code>PS-0198</code>, <code>PS-0196</code>, <code>IS-0057</code> «Битва Защитника и арбетара», <code>IS-0038</code> «Следующая история: встреча старика и Защитника». Отдельной карточки персонажа под него нет — при том что у его семьи такая карточка есть (<code>PS-0196</code>, статья 17 812 при базе 37 618).</p>\n<p>Второе — узел не сшит. <code>IS-0035</code> «Подарок внутри монстра»: статья есть (13 447), ссылок на неё ноль, хотя о подарке текстом говорят и <code>PS-0197</code>, и <code>PS-0198</code>. У <code>PS-0196</code> тоже ноль ссылок, хотя гибель дочери и ослепление жены пересказаны в <code>PS-0198</code>. В разделе «Связи» этой статьи стоит одна группа <code>GR-0019</code> и больше ничего. Тут чинить нечего искать — материал уже лежит, просто не связан.</p>\n<h3>С чего начать</h3>\n<p>В базе. По самому рассказчику запас небольшой, но есть: статья 17 552 при базе 26 571. Всё остальное того же вечера — в <code>IS-0017</code> (139 029), <code>PS-0196</code> (37 618), <code>PS-0198</code> (58 680); это один и тот же текст 2025-02-12, разложенный по четырём карточкам, и разночтения между ними ловятся без архива.</p>\n<p>В архив — за продолжением, и адрес известен. <code>IS-0058</code> «История, где рассказчик — монстр, которого убьёт Защитник» (статья 2 429 при базе 1 654): 2025-05-15, окно w0094, авторы договариваются, с какой истории начинать хронологию, и называют ею именно эту; текста в окне нет. Значит через три месяца к рассказу возвращались — но как к точке отсчёта, а не как к тексту. Смотреть w0094 вокруг этого обмена и <code>SL-0063</code> «Три рассказа: Защитник, Чужемирец, Бессмертный» (2025-03-10, окно w0079, статьи нет, 2 438) — там этот рассказ стоит в ряду с двумя другими и оценивается.</p>\n<h3>Как развивалось</h3>\n<p>Всё уместилось в один день. Текст выложен тремя сообщениями подряд (288543–288545), и автор тут же сам его понижает: «Каюсь в конце я сдулся» (288546). Через несколько десятков сообщений (288613–288621) разговор идёт уже не о персонаже, а о приёме: Слава спрашивает, как зашла идея, и признаётся, что придумал её по ходу письма; Миколай отвечает, что удивился, но «не в плане первородности», и объясняет, почему начал с критики. К самой фигуре после этого не возвращались: в мартовских и майских записях Защитник есть, рассказчика нет. Единственное возвращение — 2025-05-15, и там он назван не персонажем, а первой точкой хронологии. Заявили — сами же обесценили в тот же час — разобрали как приём — вернулись через три месяца уже как к номеру в списке.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>2025-03-18 для чужемирцев названо правило тела, и названо жёстко: «Они могут создавать оружия из себя», «Но трансформировать тело не могут». «Подарок», который рассказчик готовит внутри себя и который Защитник получит, разрывая его, — это тоже нечто, сделанное из собственного тела, но правило на него не распространено: сформулировано оно про оружие и только про оружие. Соседний случай той же механики есть, он старше правила на месяц, и под правило его никто не подвёл.</p>\n<h3>Отклик</h3>\n<p>Зацепил ход с оптикой, а не сам поворот. Первые строки читаются как обычное описание побоища снаружи — мужчина в луже крови, вокруг твари, — и только к концу выясняется, что смотрит на это одна из тварей и что ей осталось несколько секунд. При этом всё, что мы узнали о герое, мы узнали из его же головы, и рассказчик честно отмечает, где его зрение кончается: «Где же были его дочь с женой? Не знаю, я же вижу только воспоминания защитника». Границу собственного знания он проводит сам — это редко кому приходит в голову. И совсем хорош мотив: монстр не убивает беспомощного врага не из милосердия, а потому что хочет, чтобы тот жил и копил вину за убитых невиновных, — а единственное его сожаление в том, что он не досмотрит. Отдельно стоит вторая версия: там авторы разговаривают уже не про мир, а про ремесло, и реплика Миколая «в кавычки взял чтобы речь выделить если что, а не сарказм. пишу ибо интерпретация двойная, а наука такое не прощает» — самое живое место во всей записи, хотя к вымыслу не относится вовсе.</p></div>", "r": []}];</script>
