<script>const BASE="";const DOCNAME="Фантазёры";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0270-S01", "PS-0270--proishozhdenie"], "h": "<p>Фантазёры — одна из категорий носителей сил во вселенной «Апостол». Впервые названы 10 мая 2025 года (2025-05-10, id 324539–324541), последней строкой в перечне категорий, который Слава выписал списком: «Благословенный / Арбетары / Альфы / Чужемирцы / Владельцы артефактов / Фантазёры». В этом сообщении никакого устройства категории не даётся — только имя в ряду прочих.</p>\n<p>Происхождение фантазёра описано 31 мая 2025 года (2025-05-31, id 331636): «Они создали свой мир в голове». Именно это, а не внешнее вмешательство, делает существо фантазёром. Отличие от других категорий проговорено там же и в терминах сравнения с Правителями: «Фантазеры это можно сказать правитель с маленькой буквой».</p>\n<p>Ритуал, посвящение, вмешательство извне — ничего этого в описании нет: категория задана через то, что существо сделало у себя в голове.</p>", "r": []}, {"t": "Способности", "a": ["S02", "PS-0270-S02", "PS-0270--sposobnosti"], "h": "<p>Основная механика, как она изложена 31 мая 2025 года (2025-05-31, id 331636): создав свой мир в голове, фантазёр «даже глядя на наш мир ( то бишь мир в котором находиться их физическая оболочка). Они видят его по другому». То есть у фантазёра есть физическая оболочка, находящаяся в нашем мире, но восприятие этого мира у него подменено законами собственного.</p>\n<p>Пример, который Слава приводит для пояснения, — фантазёр, «что видит мир виде линей, колебаний. Глядя на стенку он видит лишь большо миллиона движущих линий, который за, что-то отвечают».</p>\n<p>Из этого выведена и способность к воздействию: «Из-за этого он способен влиять на наш мир. По законам своего». В приведённом примере это работает так: фантазёр «может изменить колебания волны ( нитки). И стена может стать воздухом или водой или взорваться в зависимости. Какую нитку потянули и как на неё повлияли».</p>\n<p>Мера силы названа прямо: «Фантазёр на данный момент сильнейший существа».</p>\n<p>Ограничение, отделяющее их от Правителей, зафиксировано в той же формулировке «правитель с маленькой буквой» — но чем именно объём их силы меньше правительского, в переписке не расписано. Отдельно оговорено, что фантазёры входят в перечень тех, кто не может раскрыть всю мощь артефакта: «Благословенный; альфа, Арбетары и фантазёры не способны раскрыть всю мощь артефакта. Так как уже сами переполненный силой. Лучшего всего мощь артефакта способен раскрыть обычный человек».</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Отклик — не материал авторов</b>\n<p>Сильное здесь одно, и оно в примере: стена, которая на самом деле миллион движущих линий, и фантазёр, который тянет нитку — и стена становится воздухом, водой или взрывается, смотря какую потянул. Это не описание способности, это описание чужого зрения, из которого способность выпадает сама собой. И дальше очень аккуратно: раз он видит мир по своим законам, он и влияет по своим — причина и следствие сцеплены в одну фразу, без магии посередине. Зацепило и то, чем это оплачено: сильнейшее существо в мире исчезает не от врага, а от того, что уходить незачем возвращаться, — «нет не одной причины жить в мире правителя. Если ты можешь попасть в свой». Малочисленность объяснена не редкостью рождения, а тем, что они уходят; это редкий ход, когда слабое место вида выведено из его же силы, а не приделано отдельно. Ответ «Нет» на просьбу Миколая пустить его туда, кстати, тоже работает на это: мир, куда нельзя заглянуть, остаётся тем, чем описан, — местом, из которого не возвращаются.</p></div>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0270-S03", "PS-0270--harakter"], "h": "<p>Прямого описания характера нет. Единственное, что сказано о мотивации, — причина, по которой фантазёры уходят: «Ведь нет не одной причины жить в мире правителя. Если ты можешь попасть в свой».</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0270-S04", "PS-0270--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Правители.</strong> Заданы как точка отсчёта: фантазёр — «правитель с маленькой буквой». Мир, в котором находится физическая оболочка фантазёра, назван «миром правителя».</li>\n<li><strong>Артефакты.</strong> Фантазёры перечислены среди тех, кто не способен раскрыть всю мощь артефакта из-за собственной переполненности силой.</li>\n<li><strong>Благословенные.</strong> В файле фантазёры отнесены к части Благословенных; при этом в самом описании 31 мая благословенные и фантазёры перечислены как разные категории. Как это соотносится, в переписке не сказано.</li>\n<li><strong>Организация нимб.</strong> Названа рядом с фантазёрами 14 мая 2025 года как второе добавление в реестр, но связи между ними не проговорено.</li>\n<li><strong>АЗИП, Арбетары, Альфы, Чужемирцы, Владельцы артефактов.</strong> Соседние категории в том же перечне сил; отношений с фантазёрами не описано.</li>\n</ul>", "r": []}, {"t": "Как менялся", "a": ["S05", "PS-0270-S05", "PS-0270--kak-menyalsya"], "h": "<p><strong>2025-05-10 (id 324539–324541).</strong> Фантазёры названы впервые — последней строкой в перечне категорий сил. Ни устройства, ни свойств. Реплика Миколая в том же месте: «но я не был уверен что этот норм».</p>\n<p><strong>2025-05-14 (id 325805–325808).</strong> Повтор прежней мысли: на вопрос Миколая, что менять в реестре — «убрать кого-то? добавить» — Слава отвечает: «Добавления организация нимб и фантазеров / И перераспределение сил». Категория всё ещё числится как то, что надо добавить, то есть на этот момент в реестр она не внесена.</p>\n<p><strong>2025-05-31 (id 331636).</strong> Полное описание в общем сообщении, где заодно разобраны Правители, Арбетары/Альфы и Артефакты. Здесь появляется всё: мир в голове, изменённое восприятие своего мира, влияние на наш мир по законам своего, пример с линиями и нитками, статус сильнейших существ, риск исчезновения и малочисленность.</p>\n<p><strong>2025-05-31 (id 331663–331667).</strong> Уточнение по вопросу Миколая: «а в мир фантазёра можно попасть?» — «хочу» — «ну в целом крайне интересно». Ответ Славы: «Нет». Мир фантазёра закрыт для проникновения извне.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S06", "PS-0270-S06", "PS-0270--chto-s-nim-stalo"], "h": "<p>У категории задан собственный способ исчезновения: «Но они могут просто исчезнуть. Потерять связь с нашим мирам и полностью окунуться свой. Исчезая». Прямое следствие этого — редкость: «Из-за этого их очень мало».</p>\n<p>Ни одного конкретного фантазёра по имени в переписке не появляется — фантазёр из примера («что видит мир виде линей, колебаний») дан безымянно и только как иллюстрация механики.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0270-S07", "PS-0270--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Устройство категории на момент первых двух упоминаний (май 2025, окно w0094) не раскрыто — только имя в списке.</li>\n<li>Ни один фантазёр не назван по имени; персонажа-носителя в переписке нет.</li>\n<li>Не сказано, как существо становится фантазёром: описано состояние («создали свой мир в голове»), но не путь к нему и не то, может ли к нему прийти любой.</li>\n<li>Не сказано, чем именно сила фантазёра меньше силы Правителя, при том что фантазёр назван «сильнейшим существом на данный момент», а Правитель — всевидящим.</li>\n<li>Отношение фантазёров к Благословенным осталось нерешённым: в файле категория проходит как часть Благословенных, в описании — как отдельная строка перечня.</li>\n<li>Связь фантазёров с Организацией нимб не проговорена, хотя названы они вместе.</li>\n<li>Возможно ли вернуться из своего мира после ухода, в переписке не сказано; сказано только, что попасть в мир фантазёра со стороны нельзя.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0270--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0104.html\">Нуар</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0025.html\">Фантазёры (творцы)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0270--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-05-10</td>\n<td>324539–324541</td>\n<td>w0094</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-05-14</td>\n<td>325805–325808</td>\n<td>w0094</td>\n<td>Апостол (объявлено)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2025-05-31</td>\n<td>331636–331636</td>\n<td>w0099</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-05-31</td>\n<td>331663–331667</td>\n<td>w0099</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0270-fantazery.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0270--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0270.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0270-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0270/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым чинить <code>SL-0089</code> «Список категорий сил (Благословенный, Арбетары, Альфы, Чужемирцы, Владельцы артефактов, Фантазёры)»: четыре ссылки, статьи нет, база 1 753 знака — меньше, чем почти у любой соседней сущности. Это и есть то сообщение 10 мая, где фантазёры названы впервые. На него опираются <code>MR-0146</code>, <code>MR-0107</code>, <code>MR-0105</code>, <code>GR-0013</code>, <code>GR-0017</code>, <code>GR-0018</code>, <code>GR-0019</code>, <code>PS-0281</code> — то есть единственное место, где шесть категорий сил поставлены в один ряд и соотнесены друг с другом, живёт как строчка внутри чужих статей. Пока статьи о самом перечне нет, вопрос «чем фантазёр отличается от соседа по списку» негде даже поставить, а он и есть главный незакрытый вопрос этой статьи.</p>\n<p>Второе по цене — не отсутствие статьи, а расхождение двух имеющихся. <code>PS-0179</code> «Благословенные» (две ссылки, статья есть, база 78 161) и <code>GR-0013</code> описывают благословенных как отдельную категорию; разметка при этом относит фантазёров к Благословенным, а описание 31 мая ставит их отдельной строкой рядом с ними. Это не ищется в архиве и не добирается материалом — это решение авторов, и оно блокирует всё, что опирается на счёт категорий.</p>\n<h3>С чего начать</h3>\n<p>В базе, не в архиве. Три адреса.</p>\n<p><code>MR-0146</code> «Силы мира: Благословенные, Арбетаров и Альфы, Творцы (фантазёры)» — три ссылки, статья есть, база 2 460, окно w0103, 2025-08-30, id 359697–359711. Там фантазёры идут под вторым именем — «Творцы ( фантазёры)», — и это имя дано Славой прямо в скобках при упоминании. В <code>PS-0270</code> слова «творцы» нет вообще, и августовское окно в источники статьи не попало; <code>GR-0025</code> его фиксирует (id 359706), статья — нет.</p>\n<p><code>MR-0202</code> «Фантазёры и провал в свой мир» — ссылок ноль, статьи нет, база 15 226, окно w0121, 2026-06-07 — 2026-06-09, id 488439–488440 и 488784. Это ровно тот механизм, которого в статье нет: как сознание постепенно уходит из нашего мира в собственный, что при этом с телом, и фантазёр на грани провала как ключ, удерживающий дыру между мирами открытой. Пятнадцать тысяч знаков на тему, по которой в <code>PS-0270</code> стоит «не сказано». Оговорка обязательная: вселенная у карточки помечена «неясно», соседи там — Доима, Нимб, Эниг; на «Апостол» этот материал не сшит и сам себя туда не относит. Сшивать или нет — авторское решение, но искать уже нечего.</p>\n<p><code>ID-0156</code> «Четвёртая сила наподобие благословенных» — ссылок ноль, статьи нет, база 2 062, то же августовское окно.</p>\n<p>В архив идти нужно за одним: за «перераспределением сил», которое Слава объявил 14 мая (id 325805–325808) вместе с добавлением Нимба и фантазёров и в том окне не расписал. Смотреть промежуток между 325808 и 331636, окна w0094–w0099.</p>\n<h3>Как развивалось</h3>\n<p>10 мая — имя без содержания, последней строкой перечня, и тут же реплика Миколая «но я не был уверен что этот норм». 14 мая — не раскрытие, а запись в список дел: «добавить». 31 мая — всё содержание разом, одним сообщением, вперемешку с правителями, арбетарами и артефактами. В тот же день единственное ограничение, и появилось оно по чужому запросу: Миколай спросил, можно ли попасть в мир фантазёра, — ответ «Нет». Дальше три месяца тишины. 30 августа категория возвращается под вторым именем и уже не как предмет разработки, а как позиция в счёте: третья сила, после которой встанет четвёртая. Через год, в июне 2026-го, механика ухода в свой мир разрабатывается заново — в другом узле, без слова «Апостол».</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Про вход в мир фантазёра правило названо прямо и односложно: «Нет». Про выход — нет. При этом выход в тексте описан как событие: фантазёр «может просто исчезнуть. Потерять связь с нашим мирам и полностью окунуться свой». Дверь закрыта снаружи — про то, заперта ли она изнутри, ничего не сказано, хотя случай ровно того же рода и стоит в том же сообщении.</p>\n<h3>Отклик</h3>\n<p>Сильное здесь одно, и оно в примере: стена, которая на самом деле миллион движущих линий, и фантазёр, который тянет нитку — и стена становится воздухом, водой или взрывается, смотря какую потянул. Это не описание способности, это описание чужого зрения, из которого способность выпадает сама собой. И дальше очень аккуратно: раз он видит мир по своим законам, он и влияет по своим — причина и следствие сцеплены в одну фразу, без магии посередине. Зацепило и то, чем это оплачено: сильнейшее существо в мире исчезает не от врага, а от того, что уходить незачем возвращаться, — «нет не одной причины жить в мире правителя. Если ты можешь попасть в свой». Малочисленность объяснена не редкостью рождения, а тем, что они уходят; это редкий ход, когда слабое место вида выведено из его же силы, а не приделано отдельно. Ответ «Нет» на просьбу Миколая пустить его туда, кстати, тоже работает на это: мир, куда нельзя заглянуть, остаётся тем, чем описан, — местом, из которого не возвращаются.</p></div>", "r": []}];</script>
