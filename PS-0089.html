<script>const BASE="";const DOCNAME="Провидцы";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0089-S01", "PS-0089--proishozhdenie"], "h": "<p>Вид во вселенной «Новый мир», добавленный Славой 2024-06-04 (окно w0036, id 175862–175866). Появляется сразу после отбраковки предыдущего списка существ — Слава подводит итог перебору репликой «Чёт ничего не понравилась кроме серых странников» (id 175863) и следующим сообщением вводит провидцев (id 175864):</p>\n<div class=\"q\"><p>«Ещё один вид в сторону добра провидцы вымирающий вид ( потому что они сходят с ума из за своей способности и по итогу чаще всего заканчиваются суицидом )<br>Их способность петля времени ( надеюсь ты не забыл )»</p></div>\n<p>Сторона обозначена прямо: «в сторону добра».</p>", "r": []}, {"t": "Характер", "a": ["S02", "PS-0089-S02", "PS-0089--harakter"], "h": "<p>Отдельного описания характера нет. Есть состояние, общее для вида: провидцы «сходят с ума из за своей способности». Безумие названо не как черта отдельных представителей, а как то, что происходит с ними из-за самой способности.</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0089-S03", "PS-0089--sposobnosti"], "h": "<p>Способность вида — петля времени. Слава ссылается на неё как на уже известную соавтору: «( надеюсь ты не забыл )». Разработка петли времени лежит в более ранних окнах, в этом фрагменте она не описывается — только называется и присваивается виду.</p>\n<p>Способность имеет цену, и цена описана как неизбежная для носителя: провидцы из-за неё сходят с ума.</p>", "r": []}, {"t": "Что с ними стало", "a": ["S04", "PS-0089-S04", "PS-0089--chto-s-nimi-stalo"], "h": "<p>Вид вымирающий. Причина вымирания названа прямо и целиком лежит внутри самого вида, а не во внешней угрозе: «потому что они сходят с ума из за своей способности и по итогу чаще всего заканчиваются суицидом». То есть провидцев убивает их собственная способность — через безумие и через самоубийство, которым это безумие «чаще всего» заканчивается. Оговорка «чаще всего» оставляет часть провидцев вне этого исхода, но что происходит с ними, в переписке не сказано.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S05", "PS-0089-S05", "PS-0089--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2024-06-04 (окно w0036, id 175862–175866).</strong> Единственная версия. Вид на стороне добра; вымирающий; сходят с ума из-за своей способности и чаще всего кончают суицидом; способность — петля времени. Позднейших правок в материале нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0089-S06", "PS-0089--probely"], "h": "<div class=\"gaps\"><ul>\n<li><strong>Внешность не описана.</strong> Ни одного упоминания.</li>\n<li><strong>Численность и ареал.</strong> Где живут, сколько их осталось, в каком мире находятся — не сказано.</li>\n<li><strong>Петля времени в этом фрагменте не раскрывается.</strong> Способность упомянута как уже знакомая; её разработка лежит в более ранних окнах, и здесь ни механика, ни ограничения не пересказываются.</li>\n<li><strong>Связь безумия со способностью.</strong> То, что провидцы сходят с ума именно из-за петли времени, зафиксировано, но каким образом петля времени сводит с ума — не объяснено.</li>\n<li><strong>Отдельных персонажей-провидцев нет.</strong> Вид описан только как вид; ни одного носителя по имени не названо.</li>\n<li><strong>Что значит «в сторону добра».</strong> Сторона объявлена, но роль вида в конфликте, союзники и противники не названы.</li>\n<li><strong>Судьба тех, кто не кончает с собой.</strong> Формулировка «чаще всего» подразумевает исключения, но они не разобраны.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0089--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0099.html\">Провидцы</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0007.html\">Новый мир</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0089--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-06-04</td>\n<td>175862–175866</td>\n<td>w0036</td>\n<td>Новый мир (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0089-providcy.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0089--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0089.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
