<script>const BASE="";const DOCNAME="незнакомка из ресторана";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0150-S01", "PS-0150--proishozhdenie"], "h": "<p>Появляется внутри текста, который Слава прислал одним сообщением (2024-08-21, id 222143, окно w0054). Текст написан от первого лица от имени Алека, студента 4 курса. Незнакомка — первое, что с ним случается: он в субботу пошёл отдохнуть от учёбы в ресторанчик рядом с домом, заказал «какой-то супчик» с странным названием, и во время еды заметил, что на него смотрят.</p>\n<p>Собственного имени у неё нет. Алек называет её «модможелей» / «модмажель» и «красивая деваха».</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0150-S02", "PS-0150--vneshnost"], "h": "<p>Отдельного описания нет. Всё, что сказано: «ниче себе модможелей, ну на 20» — то есть на вид около двадцати лет, и красивая.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0150-S03", "PS-0150--harakter"], "h": "<p>Смотрела на Алека, «вот буквально зырит, пожирает взглядом», пока он ел. Потом подсела сама. Разговорились, и она предложила пойти к нему домой. Алеку стало «слегка сыкотно» — он подумал, не пойдут ли за ними «какие нибудь анбалы», — но согласился: «Ну она так играла на эмоциях, что я согласился».</p>\n<p>После случившегося оставила на тумбочке записку с извинением и с сообщением, что вынесла мусор.</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0150-S04", "PS-0150--sposobnosti"], "h": "<p>Прямо способность ей не приписана. Зафиксировано следствие: у Алека провал в памяти, начавшийся в момент, когда он открывал дверь квартиры, — «здесь темень, не не то бишь в глазах, а в памяти не фига не помнил». Очнулся он голым на кровати. Проверил, всё ли на месте: пропал только мусор и блины, которые были на столе. Испугался («люди просто так не теряют память»), прошёлся по врачам — все сказали, что с ним всё в порядке, и он «забил на это».</p>\n<p>Причастность незнакомки к потере памяти в переписке не утверждается — эти события просто идут подряд.</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0150-S05", "PS-0150--svyazi-s-drugimi"], "h": "<p>Алек — тот, кого она встретила в ресторане и с кем ушла к нему домой.</p>\n<p>Рука из сна Алека (<a href=\"PS-0149.html\">Рука из сна Алека</a>) появляется в том же тексте на десятую ночь после потери памяти. Связь между ней и незнакомкой в переписке не проведена.</p>", "r": [["Рука из сна Алека", "PS-0149.html"]]}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0150-S06", "PS-0150--kak-menyalsya"], "h": "<p><strong>2024-08-21 (id 222143, окно w0054).</strong> Единственное зафиксированное состояние — первое появление внутри текста истории. Переработок нет.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0150-S07", "PS-0150--chto-s-nim-stalo"], "h": "<p>После записки на тумбочке она из текста исчезает. Миколай задал вопрос, куда она делась; ответ был отложен во вторую часть, которой в переписке нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0150-S08", "PS-0150--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Куда она делась — вопрос задан Миколаем, ответ отложен во вторую часть; вторая часть в переписке отсутствует.</li>\n<li>Имени нет.</li>\n<li>Внешность, кроме «красивая, на 20», не описана.</li>\n<li>Что произошло между открыванием двери и пробуждением Алека — не сказано; это провал в его памяти, и в переписке он не заполнен.</li>\n<li>Человек она или нет, есть ли у неё способности — не сказано.</li>\n<li>Зачем ей были мусор и блины со стола — не объяснено.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0150--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0149.html\">Рука из сна Алека</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0149.html\">Рука из сна Алека</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0150--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-21</td>\n<td>222143–222143</td>\n<td>w0054</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0150-neznakomka-iz-restorana.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0150--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0150.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
