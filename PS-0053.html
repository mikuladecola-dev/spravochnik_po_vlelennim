<script>const BASE="";const DOCNAME="змей из цепи";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0053-S01", "PS-0053--proishozhdenie"], "h": "<p>Первый пришелец, который пришёл Миколаю в голову (2024-04-06, id 154387–154392, окно w0030). Порядок работы Миколай описывает прямо: «Вот первая идея пришла и засела, так что пока не напишу, не придут новые, а так потом на всякий жеский штурм проведу» (id 154389) — то есть змей записывается не как отобранный вариант, а как идея, которую надо выгрузить, чтобы освободить место для остальных, с отложенным мозговым штурмом после.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0053-S02", "PS-0053--vneshnost"], "h": "<p>Змей, собранный из цепи, «созданной по принципу ленты Мёбиуса» (id 154389). Ничего кроме этого не описано: ни размера, ни материала цепи, ни головы, ни глаз.</p>\n<p>Форма отдельно обсуждалась на уровне «змея или человекоподобный». Миколай спросил: «Те норм что змея или хочешь кого-то антропоморфного?» (id 154389). Слава ответил: «Норм что змея. Ну я хочу что бы большей половины были гуманноидыми» (id 154390) — то есть змеиная форма одобрена как исключение при общем требовании, чтобы большая половина пришельцев была гуманоидной.</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0053-S03", "PS-0053--sposobnosti"], "h": "<p>Механика движения: «с зайди укорачивается, впереди генерируется или тупо того, может один конец приостановить, то есть остановиться больше или меньше» (id 154389). Цепь ползёт за счёт того, что сзади убывает, а спереди достраивается; при этом один из концов можно придержать.</p>\n<p>Из придержанного конца следует удлинение. Слава уточнил: «А способность я не до конца понял то бишь увеличивается ?» (id 154391), Миколай подтвердил: «Да, увеличивается» (id 154392). То есть если задний конец не укорачивается, а передний продолжает генерироваться, змей растёт в длину.</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0053-S04", "PS-0053--svyazi-s-drugimi"], "h": "<p>В связях числятся «многоликий» и «перевоплощение в 10 разных существ». Как именно змей из цепи с ними соотносится, в переписке не проговорено.</p>\n<p>Входит в набор пришельцев, к которому относится требование Славы про большую половину гуманоидов (id 154390).</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S05", "PS-0053-S05", "PS-0053--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2024-04-06 (id 154387–154392).</strong> Первое и единственное состояние: цепь-лента Мёбиуса, сзади укорачивается, спереди генерируется, можно приостановить один конец, при этом увеличивается. Дальше в окне к персонажу не возвращаются.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S06", "PS-0053-S06", "PS-0053--chto-s-nim-stalo"], "h": "<p>Змеиная форма одобрена Славой, но карточки и имени у пришельца так и не появилось. В справочнике проходит по рабочим обозначениям: «змей из цепи», «пришелец из цепи», «цепи».</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0053-S07", "PS-0053--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имени нет.</li>\n<li>Описания внешности за пределами «змей из цепи по принципу ленты Мёбиуса» нет.</li>\n<li>Карточка не заведена.</li>\n<li>Характер, происхождение, роль в сюжете не обсуждались.</li>\n<li>Ограничения способности, предел удлинения, уязвимость — не названы.</li>\n<li>Вселенная в самой переписке не названа; отнесение к «игре бога» сделано по дате объявления.</li>\n<li>Обещанный «жеский штурм» (id 154389) в этом окне не проведён.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0053--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0014.html\">игра бога</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0053--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-04-06</td>\n<td>154387–154392</td>\n<td>w0030</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0053-zmey-iz-cepi.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0053--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0053.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
