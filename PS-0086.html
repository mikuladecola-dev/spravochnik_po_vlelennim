<script>const BASE="";const DOCNAME="Отец-реинкарнатор";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0086-S01", "PS-0086--proishozhdenie"], "h": "<p>Отец главного героя альтернативной вселенной — того персонажа, который в переписке зовётся «сильнейший человек без способностей» (<a href=\"PS-0085.html\">Сильнейший человек без способностей (прототип командира)</a>). Вселенная не названа, сказано только «Но этой совсем другая вселенная» (2024-05-25, id 173215).</p>\n<p>Появился как загадка, а не как готовый персонаж. Слава, рассказав биографию героя, спросил: «И вопрос почему отец его так сильно ненавидит ?» и сразу пометил: «( если что я знаю ответ )» (2024-05-25, id 173190–173191). Дальнейший разбор — это отгадывание Миколаем и раскрытие Славой.</p>\n<p>Его собственная история уходит на тысячу лет назад: он реинкарнатор, копивший способности от тела к телу и ставший злодеем (id 173204).</p>", "r": [["Сильнейший человек без способностей (прототип командира)", "PS-0085.html"]]}, {"t": "Характер", "a": ["S02", "PS-0086-S02", "PS-0086--harakter"], "h": "<p>Задан через поведение. Он избивал и мучил сына с детства (id 173188). Он убил внучку — дочь героя. Он не смог убить жену героя, потому что она сверхчеловек. И он не смог убить собственного ребёнка: «Да , но так и не смог найти силы что бы убить свой собственной дитя» (id 173210).</p>\n<p>Мотив ненависти — месть. Миколай: «Так он его ненавидит из чувства мести получается?», Слава: «Да» (id 173211, 173214). Месть за жену, убитую этим же ребёнком в семь лет.</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0086-S03", "PS-0086--sposobnosti"], "h": "<p><strong>Реинкарнация.</strong> Формулировка Славы целиком: «Поэтому-что у него была способности реинкарнация ( каждый раз как он умирал он оказался в новом теле и так на протяжении 1000 лет и так реинкарнируясь он сохранял способности получены в каждом теле и стал типо злодеим )» (2024-05-25, id 173204).</p>\n<p>Из этого следует: смерть переносит его в новое тело; срок накопления — 1000 лет; способности, полученные в каждом теле, сохраняются при переходе. Конкретный перечень накопленных способностей в переписке не назван.</p>\n<p>Ограничений у способности не названо. Механика попадания в новое тело (выбор тела, рождение или вселение, разрыв во времени) не описана.</p>", "r": []}, {"t": "Отклонённые и параллельные версии мотива", "a": ["S04", "PS-0086-S04", "PS-0086--otklonennye-i-parallelnye-versii-motiva"], "h": "<p><strong>Версия Миколая — полуактивная абакра (<a href=\"SP-0064.html\">абакра</a>).</strong> Изложена целиком в id 173203. Миколай начал с постороннего примера: «На канале утопии был ролик где мама убивала детей после рождения. Она в дневнике записывала как ненавидит их. Почему? Да просто заебали орать и заботиться не хочется. Вообще-то у неё своя жизнь есть и нет цели заботиться о жизни других. Ну на деле она только так думала. Они ни кого не убивала, её подставил муж».</p>\n<p>Дальше — сама версия: «Может быть у отца была полуактивная абакра. И способность реализовать негатив нанося вред врагу тем самым. Сначала он просто заебался от его криков. Потом заметил что от злости ему больнее и ему понравилось. Он раз в месяц приходил домой и вымещал злость. Он увлёкся и не заметил как это вошло в привычку, он его бил и не навидел чтобы успокоиться».</p>\n<p>Эта версия и ответ Славы отправлены почти одновременно (id 173203 и 173204, обе в 14:41). Слава на неё не отвечал — он дал свою, каноничную. Прямого отказа в переписке нет; версия с абакрой осталась несведённой с версией про реинкарнацию.</p>\n<p><strong>Версия Миколая — чужое влияние на мальчика.</strong> До разгадки: «Ну крч, просто мальчик как-то увидел одного мужика», «Он этом мужик сказал чем занимается», «И мальчик решил что будет таким же», «А у отца были свои планы на мальчика» (id 173194–173197). Отклонено Славой одним словом: «Нет» (id 173198).</p>\n<p><strong>Шуточный вариант.</strong> «Потому что он осетинец», сразу же — «Таска, угораю» (id 173192–173193).</p>\n<p><strong>Незаданное направление.</strong> Миколай спросил «Он единственный ребёнок в семье?» и добавил «Щас появилась интересная идея» (id 173200–173201). Идея в переписке не изложена, ответа на вопрос нет.</p>", "r": [["абакра", "SP-0064.html"]]}, {"t": "Связи с другими", "a": ["S05", "PS-0086-S05", "PS-0086--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Сильнейший человек без способностей (<a href=\"PS-0085.html\">Сильнейший человек без способностей (прототип командира)</a>)</strong> — его сын. Отец ненавидел и избивал его с детства; сын не помнит, что убил мать, и считает происходящее буллингом от отца (id 173212, 173214).</li>\n<li><strong>Мать / жена отца</strong> — убита сыном, когда тому было семь лет (id 173204). Именно за неё — месть.</li>\n<li><strong>Жена героя</strong> — сверхчеловек; отец пытался её убить, но не смог, «оставил навечно калекой» (id 173188, 173213).</li>\n<li><strong>Дочь героя</strong> — убита отцом (id 173188, 173213).</li>\n<li><strong>Абакра (<a href=\"SP-0064.html\">абакра</a>)</strong> — фигурирует только в отклонённой/несведённой версии Миколая, в форме «полуактивная абакра» со способностью «реализовать негатив нанося вред врагу тем самым» (id 173203).</li>\n</ul>", "r": [["Сильнейший человек без способностей (прототип командира)", "PS-0085.html"], ["абакра", "SP-0064.html"]]}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0086-S06", "PS-0086--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2024-05-25, id 173189–173202.</strong> Персонажа ещё нет как сущности, есть только загадка «почему отец его так сильно ненавидит». Гипотезы Миколая: шуточная (осетинец) и содержательная — мальчик увидел мужика, решил быть как он, а у отца были на мальчика свои планы. Отклонено. В конце Миколай спрашивает, единственный ли это ребёнок в семье, и упоминает появившуюся идею.</p>\n<p><strong>Версия 2 — 2024-05-25, id 173203–173204.</strong> Две версии мотива приходят одновременно. Миколай — полуактивная абакра, реализация негатива через вред врагу, привыкание к вымещению злости раз в месяц. Слава — реинкарнация: 1000 лет, накопление способностей от тела к телу, злодей; странный ребёнок, убийство матери в семь лет, попытка убить отца, запечатанные воспоминания.</p>\n<p><strong>Версия 3 — 2024-05-25, id 173205–173216.</strong> Уточнения по ходу разбора: отец убил дочь героя; жену убить не смог, так как она сверхчеловек; собственного ребёнка убить сил не нашёл; ненавидит его из мести; ребёнок не помнит содеянного и считает происходящее буллингом. Тема закрыта репликами «Но этой совсем другая вселенная» и «Перейдем к нашей».</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0086-S07", "PS-0086--chto-s-nim-stalo"], "h": "<p>К концу разбора он жив и находится в том же мире, что и герой: изложенные события — убийство внучки, увечье невестки, регулярное присутствие в жизни сына — поданы как уже произошедшие. Дальнейшая судьба не рассказана: линия оборвана переходом к другой вселенной (id 173216).</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0086-S08", "PS-0086--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вселенная не названа.</li>\n<li>Имени нет; в переписке он «отец» и «батя».</li>\n<li>Внешность не описана.</li>\n<li>Какие именно способности он накопил за 1000 лет — не перечислено.</li>\n<li>Механика реинкарнации (как и куда он попадает после смерти, помнит ли прошлые жизни, есть ли предел) не описана.</li>\n<li>В каком он теле на момент событий с сыном и был ли он биологическим отцом — не разобрано.</li>\n<li>Версия Миколая с полуактивной абакрой не отклонена явно и не сведена с версией про реинкарнацию; статус её остался неопределённым.</li>\n<li>Кто запечатал воспоминания ребёнка — не сказано.</li>\n<li>«Интересная идея», о которой Миколай объявил в id 173201, так и не изложена.</li>\n<li>В чём состояло его злодейство за 1000 лет — не рассказано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0086--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0085.html\">Сильнейший человек без способностей (прототип командира)</a></li>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0064.html\">абакра</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0085.html\">Сильнейший человек без способностей (прототип командира)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0086--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-05-25</td>\n<td>173189–173202</td>\n<td>w0035</td>\n<td>Цветной мир (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-05-25</td>\n<td>173203–173204</td>\n<td>w0035</td>\n<td>Цветной мир (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-05-25</td>\n<td>173205–173216</td>\n<td>w0035</td>\n<td>Цветной мир (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0086-otec-reinkarnator.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0086--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0086.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
