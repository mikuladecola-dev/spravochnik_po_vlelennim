<script>const BASE="";const DOCNAME="Пастыри";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0338-S01", "PS-0338--proishozhdenie"], "h": "<p>Четвёрка главных последователей Бога красок. Придумана в один вечер (2025-12-17, окно w0114, id 399534–399604) в два захода.</p>\n<p>Начало — заявка Славы: «К Богу красок я хотел подставить 4 главных последователя ( как их назвать?) Они будут одарены его благословением и будут чудовищна сильные» (id 399534).</p>\n<p>Имена дал Миколай одним списком (id 399541, повторён без изменений в id 399591):</p>\n<ul>\n<li>триколор</li>\n<li>радуга</li>\n<li>градиент</li>\n<li>монохром</li>\n</ul>\n<p>Общее название группы предложил Слава — «Пастери» (id 399587), Миколай подхватил: «ну го пастыри» (id 399598) с оговоркой «мь потом по другому» (id 399599). Уточнение, что название относится именно к группе: «ну типа эту шайку, группу в целом» (id 399601).</p>\n<p>Вопрос Миколая при заявке — «т появляется новый апостол?» (id 399539) — прямого ответа не получил. Ответ Славы про численность: «Как бы их 21 один и я не всех придумал. И вот из этих какого я не придумал будет моей маленькой жертвой» (id 399540).</p>", "r": []}, {"t": "Способности", "a": ["S02", "PS-0338-S02", "PS-0338--sposobnosti"], "h": "<p>Заявлено только общее: одарены благословением Бога красок и «будут чудовищна сильные» (id 399534). Конкретные силы четвёрки на момент конца окна не придуманы — это стоит в списке дел Славы отдельным пунктом.</p>\n<p>Единственная названная конкретная способность — хромакей. Миколай: «и у кого-то способность хромокей» (id 399542), сразу же уточнил — «у радуги» (id 399543). Дальше следует «а, ок» (id 399544) и «то есть сразу в сюжете будет монстром» (id 399545) — к чему относится реплика про монстра, из переписки не восстанавливается.</p>", "r": []}, {"t": "Связи с другими", "a": ["S03", "PS-0338-S03", "PS-0338--svyazi-s-drugimi"], "h": "<ul>\n<li>Бог красок — тот, чьими последователями они являются и чьё благословение носят. Запись помечена как часть Бога красок.</li>\n<li>Триколор — участница четвёрки; по авторству закреплена за Славой: «Ну по триколор можешь забыть. Её я уже придумал» (id 399595).</li>\n<li>Радуга — участница; носитель способности хромакей по предложению Миколая.</li>\n<li>Градиент, Монохром — участники, на конец окна только имена.</li>\n<li>Апостолы — отдельный слой, с которым четвёрку пытались соотнести. Численность апостолов проговаривается как 21 (id 399540) и как 12 (предложение Миколая, id 399553), однозначного решения в переписке нет.</li>\n<li>Дочь Бога красок — упомянута в списке дел («Дальше планы Бога красок и дочер»), к четвёрке напрямую не привязана.</li>\n<li>Коты / «котики» — упомянуты Славой в списке дел («Роль Котов во всей этой фигней», id 399583) и Миколаем отдельной репликой «котики» (id 399603) сразу после разговора о Пастырях. Связь между Котами и Пастырями в переписке не названа.</li>\n</ul>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S04", "PS-0338-S04", "PS-0338--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2025-12-17, id 399534–399545.</strong> Четвёрка заявлена как 4 главных последователя Бога красок с его благословением, «чудовищна сильные». Миколай даёт четыре имени: триколор, радуга, градиент, монохром. Отдельно — способность хромакей у радуги. Общего названия у группы ещё нет.</p>\n<p><strong>Версия 2 — 2025-12-17, id 399550–399604.</strong> Группа получает общее название «Пастыри» (сначала в написании «Пастери»). Список имён пересылается повторно и без изменений. Заключается договорённость по авторству: Триколор пишет Слава, три остальные — Миколай («если они я буду прилумывать эти 4 у бога красок», id 399592–399594; «Но все остальное твое», id 399596). Название помечено как не окончательное: «мь потом по другому».</p>\n<p>В том же окне Слава выкладывает список того, что осталось сделать (id 399583), и просит закрепить его сообщением:</p>\n<div class=\"q\"><p>Дальше планы Бога красок и дочер<br>Придумать силы и мотивы 4 последователь<br>Придумать жизненные цикл апостолов и придумать кто их родитель<br>Также разобрать некоторые способности<br>Дать мотивы 3 сильнейшим моего мира<br>Роль Котов во всей этой фигней.</p></div>\n<p>Продолжение разговора отложено до личной встречи: «Поговорим когда ты приедешь?» (id 399585).</p>", "r": []}, {"t": "Отклонённые и нерешённые варианты", "a": ["S05", "PS-0338-S05", "PS-0338--otklonennye-i-nereshennye-varianty"], "h": "<ul>\n<li><strong>Урезать число до 12</strong> — предложение Миколая: «мб урезать?», «12 как по базе?» (id 399552–399553) с обоснованием «ну было ж 12 апостолов у бога» (id 399557). Слава сначала согласился («Ну давай», id 399554), причём мотив согласия назвал прямо: «А то мне в падлу придумывать всех 21» (id 399560). Затем передумал: «Три», «Не сука», «4 мне нравится больше», «Все четыре» (id 399565–399568). Миколай продолжал настаивать на 12 и объяснил своим же правилом (см. ниже): «там частное 4» (id 399573). Спор закончился без сведения: Миколай — «лан», «как хочешь» (id 399576–399577), Слава — «Я Бог в своё вселенной» (id 399572) и «Я должен что-то понять?» (id 399578).</li>\n<li><strong>Правило Бога красок по числам</strong> — Миколай: «если че бог любит все че на 3 делится и чем меньше частное тем больше нравится» (id 399562). Слава ответил «Ну ок» (id 399564). Дальше это правило в переписке не применяется, кроме как в аргументе про 12.</li>\n<li><strong>Название «Пастыри» как временное</strong> — принято с оговоркой «мь потом по другому».</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0338-S06", "PS-0338--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Силы и мотивы четвёрки на момент конца окна не придуманы — Слава ставит это отдельным пунктом в список дел.</li>\n<li>Градиент и Монохром — только имена, ничего больше.</li>\n<li>Численность апостолов не решена: названо и 21, и 12.</li>\n<li>Является ли четвёрка апостолами или это отдельный слой — вопрос Миколая «т появляется новый апостол?» остался без ответа.</li>\n<li>Кто именно станет «маленькой жертвой» из непридуманных апостолов — не выбран.</li>\n<li>К кому относится реплика «то есть сразу в сюжете будет монстром» — не восстанавливается.</li>\n<li>Почему группа названа именно «Пастыри» — не объяснено.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0338--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0057.html\">Коты (девять котов)</a>, <a href=\"GR-0078.html\">Апостолы (Феня; список 12)</a>, <a href=\"GR-0079.html\">Пастыри</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0338--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-12-17</td>\n<td>399534–399545</td>\n<td>w0114</td>\n<td>Феня (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-17</td>\n<td>399550–399604</td>\n<td>w0114</td>\n<td>Феня (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0338-pastyri.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0338--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0338.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
