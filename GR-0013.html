<script>const BASE="";const DOCNAME="Благословенные";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0013-S01", "GR-0013--chto-eto"], "h": "<p>Благословенные — класс носителей силы во вселенной «Апостол» и одновременно их территориальные организации. Разведка отнесла их к группам; строго говоря, это надкласс: отдельные благословенные и целые их организации — единицы внутри него, а не члены одного отряда.</p>\n<p>Определение из первого разговора о вселенной (2025-01-06, id 278936): «Это человек получающий силу с другого мира, и это все ещё человек». Силу даёт правитель мира: «эти правитель могут дать свой благословение, но они могут дать свой благословений только людям из нашего мира» (id 278852). Позже формулировка уточняется: «Благословенный это люди у которых есть связь с правителем другого мира, и чтобы получить его силу нужно сначала пропустить еë через мозг, из за этого благословенный не могут использовать благословенный 24/7» (2025-03-10, id 300888).</p>\n<p>Апостолы — не отдельный класс, а сильнейшая часть благословенных: «Ты же знаешь кто такие апостол. Сильнейший среди благословенных» (2025-08-30, id 359681). Апостолами называют благословенных правителем рая — «Ты и я апостолы. Это люди получивший благословения от правителя рая» (2025-03-19, id 305856). Остальные благословлены иными правителями: Богом, дьяволом, правителями минимиров, правителем нашего мира.</p>\n<p>Организационная часть введена 2025-01-06 (id 279023, 279029): «Благословенный и дьявола и бога. У каждого из них своя территория где они должны убивать грешником либо чудемирцов» — и дальше: «Чаще всего эти благословенный создают какую-то организацию, так как в одиночку это просто не возможно. В этой организаций могут быть как и простые люди как и благословенный (от минимиров), а также аномальный люди или даже чужемирцый». То есть организация — не собрание одних благословенных, в неё входят и обычные люди, и аномальные люди, и чужемирцы. На вопрос Миколая, кто такие аномальные люди, ответ: «Чаще всего это дети простого человека и чужемирца» (id 279033).</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0013-S02", "GR-0013--sostav"], "h": "<p>В списке участников группы:</p>\n<ul>\n<li><a href=\"PS-0225.html\">Пустынник</a> — Пустынник (в переписке также «пустырник»). Появляется 2025-03-14 (id 302380): костюм, закрывающий всё тело, маска, полностью скрывающая лицо, плащ, меч; на руке в месте, где режут вены, оставлен открытый участок кожи. Автор подтверждает, что персонаж новый и что он благословенный (id 302766–302780).</li>\n<li><a href=\"PS-0214.html\">Благословлённый Фениксом</a> — Благословлённый Фениксом (в переписке один раз назван «благословенный фенриром»). Носитель, создающий на вечность большое количество пламени; нужен злодеям как топливо для механизма либо чтобы нагреть стены (2025-03-06, id 298826).</li>\n<li><a href=\"PS-0182.html\">Агрегат</a> — Агрегат. Владелец способности изменения агрегатного состояния (2025-01-22, id 283707). В команде против Серафима идёт вторым номером: «Имеет средний показатель, но достаточно быстрые Воительницы. Его способность менять агрегатной состояния неодушевлённых объектов, он может сделать прочным воздух или землю превратить в воду» (2025-01-28, id 285363).</li>\n<li><a href=\"PS-0171.html\">Палач</a> — Палач. Четвёртый номер команды против Серафима, быстрейший в пати, бьёт по жизненно важным точкам, оружие — катана (2025-01-28). Позже — апостол, сильнейший в ближнем бою.</li>\n<li><a href=\"PS-0194.html\">Воительница</a> — Воительница (в ранних редакциях реестра «Разрушительнитца», «Разрушительница»). Первый номер команды против Серафима: «Имеет огромную физическую силу и очень крепка, но скорость на среднем уровни. Еë способность контроль над массой, размером и плотностью, но только на себе или на неживых объектов. У неё есть оружие оружейный браслет — это браслет на котором висят разный холодный орудия, которая она сможет увеличить и сделать плотней» (2025-01-28, id 285363).</li>\n<li><a href=\"PS-0184.html\">Бессмертный выродок</a> — Бессмертный выродок. Впервые назван 2025-01-22 в перечне братьев и сестёр воплощения гнева, дальше устойчиво стоит в реестре под номером 7. 2025-02-25 Слава берёт его себе для отыгрыша и уточняет, что это апостол и он бессмертный.</li>\n<li><a href=\"PS-0195.html\">Масочник</a> — Масочник. Новое имя в разделе благословенных во второй редакции реестра (2025-01-28, id 285522), только название с эмодзи маски, разработки в окне нет.</li>\n<li><a href=\"PS-0180.html\">Воплощение гнева</a> — Воплощение гнева, он же Защитник в реестре («Защитник 🤬 (ангел 👼)»). Заказ способности персонажу от 2025-01-22 (id 283706): «Принципиальному, прямолинейному и жестокому. Он воплощения гнева. Прототип защитника только молчиливова. Бэтмен с жестокостью и гневом. Тот кто да мозга костей ненавидит междумирцов. Тот кто оторвёт крылья ангелам, переломает кости своим братьям и сёстрам». Позже: «Воплощений гнева. Непробиваемому чудовище. Страх всех чужемирцов» (id 283728).</li>\n<li><a href=\"PS-0183.html\">Теневые братья</a> — Теневые братья. Упомянуты среди братьев и сестёр воплощения гнева; в каталоге сперва стояли отдельной строкой, затем перенесены в скобку к «Дитя света ✨».</li>\n<li><a href=\"IS-0017.html\">Защитник</a> — Защитник, он же Александр. В списке с оговоркой. 2025-02-12 (id 288545) про него сказано: «он начал как то инстинктивно понимать, где находиться чужимирцы словно благословенный. Но он им не был» — то есть чутьё «словно благословенный» у него было до всякого благословения. Благословенным он становится 2025-03-14 (id 302380): «В момент, когда он должен был умереть. Он получил благословение. И не обычная, а от бога». Отдельно уточнено, что апостолом он стал не сразу: «Нет ещё, иначе бы я написал бы белый глаза» и «Он стал апостолом, когда его атаковали кровью в спину» (id 302670, 302676).</li>\n<li><a href=\"PS-0215.html\">Сестра имитатора</a> — Сестра имитатора, в списке врагов проходит как «Сестра». Благословлена правителем Кильке: «Есть сестра благословенная правителем Кильке. Да она сильнее одного апостола. Но дальше че. Это не та сила, что поставит на колени весь мир» (2025-08-30, id 359684).</li>\n<li><a href=\"PS-0185.html\">Глава организации злодеев</a> — Глава организации злодеев. «При этом глава этой организации будет единственный благословенный правителем нашего мира», «То бишь она будет грубо говоря сильнейшей» (2025-01-23, id 284170–284171).</li>\n</ul>\n<p>Отдельно от этого списка существует рабочий реестр Славы, где раздел «Благословенный» переписывался целиком по нескольку раз. Имена в нём (по состоянию на 2025-02-25, id 295559): Имитатор, Агрегат, Разрушительница, Палач, Защитник, Дитя света, Бессмертный выродок, Хулиган, Вибрация, Ученица, Масочник, Сон, Небесная, Маэстро. Большинство позиций — только имя с эмодзи; на прямой вопрос Миколая «а ты рил всех персов продумал?» ответ: «Ну только вид и способность и плюс минус характер» (2025-01-24, id 284364–284366).</p>", "r": [["Пустынник", "PS-0225.html"], ["Благословлённый Фениксом", "PS-0214.html"], ["Агрегат", "PS-0182.html"], ["Палач", "PS-0171.html"], ["Воительница", "PS-0194.html"], ["Бессмертный выродок", "PS-0184.html"], ["Масочник", "PS-0195.html"], ["Воплощение гнева", "PS-0180.html"], ["Теневые братья", "PS-0183.html"], ["Сестра имитатора", "PS-0215.html"], ["Глава организации злодеев", "PS-0185.html"], ["Защитник", "IS-0017.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0013-S03", "GR-0013--obschie-sposobnosti-gruppy"], "h": "<p><strong>Базовые умения — три разные редакции, друг друга не отменившие.</strong></p>\n<p>Редакция 2025-01-06 (id 278985): «Вообще у благословенных бога есть 5 базовых умений (усиления, регенерация, аура (просто аура), исцеление, глазки способны видеть эмоции)». На вопрос Миколая «у каждого все эти» прямого ответа не прозвучало.</p>\n<p>Для благословенных дьявола в тот же день (id 278987): «У благословенных демона есть также 5 базовых умений (усиления, регенерация, аура, способный чувствовать намерение людей, ????) и здесь я не знаю». Пятое умение так и не выбрано, перебор вариантов — в разделе «Как менялась».</p>\n<p>Редакция 2025-03-19 (id 305856), объяснение имитатора защитнику: «есть отличие. Каждый правитель даёт разный способности. Но четыре базовых есть у всех. Это усиления, самоисцеления, энергия и сенсорика».</p>\n<p>Редакция 2025-05-31 (id 331635): «При активации благословения (то есть пропускания энергий через мозг). У всех благословенных есть четыре основных способности: усиленная регенерация; усиления тела и всех чуств; аура (то бишь самая энергия, которая выплескивается и заставляет чувствовать страх е животных и обычных людей. Так же способный влиять на окружающей. При сильном скоплении); сенсорика (позволяет ощущать других благослрвенных и арбетара или Протобионтов)».</p>\n<p><strong>Уникальная способность правителя.</strong> Сверх базовых у каждого благословенного есть способность, которую даёт конкретный правитель. Она уникальна для правителя, но не для человека: «если правитель, что дал вам благословения. Даст благословения ещё другому человеку. То оно будет такой же, как и у вас» (2025-05-31, id 331635). Ранее то же правило: «У нас апостолов в отличие от всех. Способность формируется. То бишь у каждого апостола уникальная способность. У других же благословенных одним правителем. Одинаковые способности» (2025-03-19, id 305856).</p>\n<p><strong>Активация и её цена.</strong> Благословение надо активировать (2025-01-06, id 278936). Оно временное: «Благословений это временная сила, типа еë нельзя долго сохранять. Например огонь стрельнуть по дереву оно горит, а после отключение благословенной огонь сразу исчезает» и «Благословений не может быть активным постоянная, это тратит выносливость» (2025-01-13, id 281379, 281382). То же правило в редакции 2025-05-31: «После отключения благословенния они просто исчезают. Буть то огненный шар или остановка времени они просто отключаться».</p>\n<p>Причина ограничения — мозг. «Потому-что связь устанавливается с мозгом. И сила проходит через мозг. Повреждая его. Но не сильно. Именно из-за этого факта мы благословенный не можем использовать благословенния 24/7» (2025-03-19, id 305856). Там же — предохранитель: «И у нас благословенных есть предохранитель в голове. Который при случаи выгорания мозгов отключает благословенния. Но его можно —» (фраза оборвана на полуслове). В бою предохранитель срабатывает самостоятельно и без ведома носителя: «Не замечая, что благословения выключалось. Точнее его выключил предохранитель. А имитатор не научил вырубать этот предохранитель» (id 305857).</p>\n<p><strong>Признак использования.</strong> У благословенных Богом (в поздней формулировке — правителем рая) при активации белеют глаза: «Вообще благословенный Богом есть общая чёрта виде белых глаз при активаций благословения» (2025-01-22, id 283708); «И его глаза стали белыми. Это был признак использования благословенния правителем рая» (2025-03-19, id 305856). Глаза светятся в темноте (2025-03-14, id 302380).</p>\n<p><strong>Чего благословенные не могут.</strong> «Я же говорил вроде апостолы не способны лечить и влиять на разум» — «Благословенный вообще все» (2025-03-13, id 301867–301868). Отдельно названа уязвимость: «благословенный не могут использовать благословенния долга, поэтому можно просто неожидано напасть и убить и всё» (2025-03-13, id 301806). Что такое «благословение долга» — в переписке не раскрыто.</p>\n<p><strong>Уровень силы.</strong> Первая оценка (2025-01-06, id 278932): «они могут сломать деревянный дом не более», сила «на уровне 10». Правило равенства (2025-01-13, id 281368): «Сразу всё благословенный равны по силе, путь то благословенный Богом, дьяволом, или другими правителем минимиров». Уточнение 2025-05-31 (id 331635): «так как всё благословенный включая апостолов. Получают плюс минус одинаковая количество энергии (силы). Они являются одинаково сильными. Но это не включая индивидуальность людей. Всё же апостолы всё равно чаще всего сильнее любого другого благословенного».</p>\n<p><strong>Условия получения и срок.</strong> Благословение даётся только людям нашего мира (2025-01-06), в поздней редакции — только разумным жителям Кильки: «Благословения можеть получать только разумный житель кильке. Первого мира. Не знаю точно с чем это связано. Но это просто факт» (2025-03-19, id 305856). Даётся без согласия носителя, одно на человека и до его смерти: «благословения даётся только одно. Больше человек не выдержит. И это одно благословения с ним до его смерти. Благословения нельзя разорвать» (2025-05-31, id 331636). Держится, пока человек не умрёт (2025-01-06, id 278946–278948). Срок жизни: «Средние продолжительность жизнь у благословенного после получения благословения 10 лет» (2025-05-31, id 331635). Момент получения показан на Защитнике: благословение приходит в момент, когда он должен был умереть (2025-03-14).</p>\n<p><strong>Связь внутри группы.</strong> «Между благословенный бога есть связь и они в любой момент могут связаться с другими благословенными бога. У благословенными дьявола также. Но при этом благословенный дьявола и бога не могут с друг другом связываться» (2025-01-06, id 279037). Миколай называет это телепатией, Слава подтверждает: «Ну типа того». Отношения внутри лагеря: «Они чувствуют себя как братья и сестры», «Хотя и редко видятся в живую» (id 279042–279043). Термин «братья и сёстры» закреплён отдельно: «Братья и сестры это то бишь благословенный одним правителем» (2025-01-22, id 283706). В редакции 2025-05-31 связь названа дополнительной способностью апостолов: «У апостолов есть дополнительная способность. Телепатия между ними. (они способны разговаривать. На расстоянии и также всем мести. Они также могут отказаться от телепатического общения и прервать разговор)» (id 331635).</p>\n<p><strong>Работа с артефактами.</strong> «Благословенный; альфа, Арбетары и фантазёры не способны раскрыть всю мощь артефакта. Так как уже сами переполненный силой. Лучшего всего мощь артефакта способен раскрыть обычный человек» (2025-05-31, id 331636).</p>", "r": []}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0013-S04", "GR-0013--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p><strong>По правителю.</strong> Базовые умения различались по лагерям: у благословенных бога пятым умением стояли «глазки способны видеть эмоции», у благословенных дьявола — «способный чувствовать намерение людей» и нерешённое пятое (2025-01-06). В поздних редакциях (2025-03-19, 2025-05-31) базовые умения одинаковы у всех, а различие переносится на уникальную способность правителя.</p>\n<p><strong>Апостолы против прочих.</strong> У благословенных одного правителя способность одна и та же, у апостолов — разные. Причина названа 2025-05-31 (id 331635): «Когда у всех благословенных одного правителя одна и та же способность. То у благословенных правителя рая. Они разные. Так как правитель рая. Посылает им лишь сгустки чистой и необработанной силы, который формируется во что уже только внутри Апостолов. Даруя им уникальные способности».</p>\n<p><strong>По личным показателям.</strong> Разложение отличий внутри одной команды сделано 2025-01-28 (id 285363): Воительница — огромная физическая сила и прочность при средней скорости; Агрегат — средние показатели, но быстрее Воительницы; Палач — быстрейший в пати, бьёт по жизненно важным точкам. То есть разница фиксируется не только по способности, но и по сырым характеристикам.</p>\n<p><strong>По личности.</strong> «Но это не включая индивидуальность людей» — оговорка при правиле равной силы (2025-05-31).</p>\n<p><strong>В поздней вселенной без энергии (2026-04-19, id 462205)</strong> различие устроено иначе: все благословенные «способны чувствовать присутствия когото», но «Кого именно неизвестно, может бог, может ещё какое-то существо», и каждый чувствует по-своему. Герой слышит шёпот («герой молю спаси…», «Герой помоги», «Герой, герой герой»), который заранее звучит, когда человеку нужна помощь — материальная, физическая или духовная, — и тем самым отчасти предсказывает будущее. Александор, он же Мистер белая рубашка, невероятно везуч: «если его попытаться застрелить то либо промажуть, либо Саша сам как-то споткнеться, либо пистолет заклинит и даст осечку». Юра видит две белые точки — «глаза не понятного существа», и это означает близкую опасность. Четвёртый чувствует запах, напоминающий дом, и по запаху определяет, «ждёт их хорошая или плохое». Азуриэль чувствует эмоции людей, а иногда «чётко ощутить эмоции нечто». Максим — сверхчеловек с ускоренным восприятием, ощущает нечто через сердцебиение и должен «идти по зову сердца».</p>\n<p>У каждого из них парой к чутью идут плюс и дебафф. Плюс общий — почти невозможность умереть: Герой «вырубается и слышат голос \"герой пора вставать\"» и просыпается в больнице живым; Юра «как-то спасется, иногда опасность самая может устранить себя»; про Максима сказано «Смерти, ну невозможно, он как бы почти сверхчеловек». Дебафф индивидуален и наступает за неповиновение: Герою снятся кошмары, если он не спас молившего; Сашу выворачивает при попытке поесть, если он не рискует («в его горло словно че я та рука залезет и спуститься в желудок, и начнёт его выворачивать»); четвёртому запах становится смердящим до тошноты и обморока; у Азуриэля способность обостряется и он начинает сходить с ума от чужих чувств; у Максима сердце «начнёт больно екать, и ему будет холодно».</p>", "r": []}, {"t": "Иерархия", "a": ["S05", "GR-0013-S05", "GR-0013--ierarhiya"], "h": "<p>Внутри класса: апостолы — сильнейшие. Их 21 во всём мире, это максимум для правителя рая: «Апостолы это 21 человек получивший благословен от правителя рая. (21 это максимальное число благословения, который способен давать правитель рая. Другие же правители дают меньше)» (2025-05-31, id 331635). Ранее то же число названо изнутри истории: «Нас апостолов 21 во всём мире. Нас, именно нас благословенных правителем рая. Больше чем других благословенных другими правителями» (2025-03-19, id 305856).</p>\n<p>Над апостолами по силе поставлена глава организации злодеев: единственная благословлённая правителем нашего мира, «грубо говоря сильнейшей» (2025-01-23). Между ней и рядовым благословенным помещены семь грехов и божество: «7 грехов и божество (помнишь его) будет слабей главы этой организации но сильней благословенного» (id 284175).</p>\n<p>Числовое правило соотношения сил (2025-01-24, id 284276): «7 грехов сильней благословенный и чтобы убить одного греха в максимум надо 3 благословенных именно Бога. А для остальных благословенных надо будет 5». Формулировка «а для остальных надо будет 5» в переписке не уточнена и читается двояко — то ли про остальных грехов, то ли про остальных благословенных.</p>\n<p>Отдельная точка — сестра, благословлённая правителем Кильке: «Да она сильнее одного апостола. Но дальше че. Это не та сила, что поставит на колени весь мир. А её подручный всё слабее апостолов. Каждый из них один на один против апостолов продует» (2025-08-30, id 359684).</p>\n<p>Организационная вертикаль названа только частично. У апостолов есть АЗИП: «у них есть нерушимая организация Азип, которой уже более сотней лет» (2025-08-30, id 359681). У АЗИП есть дополнительные филиалы с начальниками — из описания Куры (2025-05-31, id 331639): «Некоторая время был начальник одного из дополнительного филиала АЗИП. Но был отстранён из-за проявления своего безумия и игривого характера. В нынешней время является агентом и приближенным Апостола (Бессмертного)». Иных должностей и званий внутри организаций благословенных в переписке не названо.</p>\n<p>Отношения внутри лагеря описаны не как подчинение, а как родство: «братья и сёстры», редко видящиеся вживую, связанные телепатией.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S06", "GR-0013-S06", "GR-0013--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>Грешники и чужемирцы.</strong> Основная обязанность: у каждого благословенного своя территория, «где они должны убивать грешником либо чудемирцов» (2025-01-06, id 279023). Роль благословенных дьявола расписана отдельно: «Он даёт благословение людям, а эти люди изгоняют грешников из этого мира и отправляют в ад» — то есть убивая, «после смерти грешники опять отправляются в ад» (id 279011, 279014).</p>\n<p><strong>Правители.</strong> Источник силы и одновременно сторона, с которой у благословенного связь. Правители всевидящи, но «не как не могут влиять на благословенного или обычного существа (кроме как насильственно давать благословения, даже если само существо этого не хочет)» (2025-05-31, id 331636). Мотивы выдачи благословений: «В раю много добрых людей и бог име проникся из за этого даёт благословение. У дьявола часто сбегают в грешники в наш мир и их надо возвращать поэтому он даёт благословение» (2025-01-06, id 278943). Правители минимиров дают благословение редко.</p>\n<p><strong>Арбетары и альфы.</strong> Названы отдельной силой рядом с благословенными. Их отличие: «Они как и мы может использовать свою силу 24/7 без риска повредить мозг» (2025-03-13, id 301806), тогда как благословенный так не может. В редакции 2025-05-31 то же: у арбетаров и альф «нету такого понятия, как отключения», но им приходится учиться вырабатывать энергию и контролировать её, «Когда у благословенным это выходит автоматический». Отношение враждебное с обеих сторон. Старик-арбетар о благословенных: «Ведь по правде говоря вся их сила, и не их вообще. Жалкий благословенный получивший силу лишь потому что понравились правителем, но сами они эту силу не добывали. Лишь мелкий пизжоны». Отдельно об апостолах: «Эти апостолы не пойми кем себя возомнили и везде понаставили свои порядки, на чужой силе» и — при этом — «Но не могу не признать, что свою работу они выполняють слишком идеально. Ну даже в идеальной системе есть единичные пробои» (2025-03-13, id 301806, 301812).</p>\n<p>Практическая сторона этой вражды: мозг благословенного — один из материалов ритуала становления арбетаром, наравне с телом альфы, парой чужемирцев и проводником с чистой душой. «я использую мозг благословенного, чтобы он начал собирать силу. И тело Альфы дабы он его пресовал» (2025-03-13, id 301807).</p>\n<p><strong>Одержимые.</strong> Проработаны в редакции 2025-09-12 (id 364766): «Одержимый это аналог Арбетара… И в чаще всего сильнее благословенных (поэтому на убийства одержимого они ходят группой разного количества). И у одержимых есть собственный организаций». То есть групповая тактика благословенных названа прямым следствием того, что поодиночке они слабее одержимого. После раскрытия чёрной изнанки одержимых стали защищать, но их убийство осталось законным.</p>\n<p><strong>Общество.</strong> Ранняя стадия — тайна и влияние: «Общество не знает», при этом «Благословенный имеют большую власть у верхушки и может многой» (2025-01-06, id 278915, 278965). Люди знают мифы и монстров, но не верят в них. Поздняя стадия — публичность, см. раздел «Как менялась» за 2025-09-12.</p>\n<p><strong>Церковь и военные.</strong> В реестре стоят отдельными разделами («Церковь: Священнослужитель, Многоглазый»; «Военный: Зеркальный, Очкарик»), но их отношений с благословенными переписка не описывает. Косвенно названо одно событие: апостолы устроили охоту на крупную религиозную организацию, «одну из самых крупных организации связанный с благословенными» (2025-09-12).</p>\n<p><strong>Фантазёры (творцы).</strong> Поставлены в один ряд с благословенными как отдельная сила и названы сильнейшими существами на данный момент; отношений с благословенными не описано.</p>\n<p><strong>Семь грехов.</strong> Названы силой выше благословенных (2025-01-23, 2025-01-24), затем убраны: «Грехи нужно убрать, а то тупо», «ну просто в сюжет не совсем входят» (2025-03-06, id 298854, 298856).</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S07", "GR-0013-S07", "GR-0013--kak-menyalas"], "h": "<p><strong>2025-01-06 (id 278852–279075), окно w0070.</strong> Введение. Правители миров могут дать благословение только людям нашего мира. Благословенный остаётся человеком, силу надо активировать, уровень силы — 10, то есть «они могут сломать деревянный дом не более». Бог и дьявол дают по 21 человеку, держится до смерти носителя. Введены территории и обязанность убивать грешников и чужемирцев, введены организации со смешанным составом. Введена связь внутри лагеря и запрет связи между лагерями. Названы базовые умения обоих лагерей. Пятое умение благословенных дьявола перебирается и не выбирается: Миколай предлагает по аналогии отравление и «глаза способны видеть хз, прошлые мысли человека или его прошлое или мысли»; яд отклонён Славой; предложена склонность к разрушению «по типу разложения» — сам Миколай называет это перебором; предложен сквозной удар — «уходящий в твёрдое игнорирующий мягкое», «тобиж урон доспехам и костям мб», «коже и мышцам нет». Итог: «Ладно пока просто выкинем» (id 279021). Численность в этот день названа трижды по-разному: 21 и 21, затем 42, затем 41. Первый рабочий шаг определён как «Сначала придумать способность всём благословенным»; Миколай отвечает «я и одного хуй знает когда и как сделаю, поэтому начнем с 1».</p>\n<p><strong>2025-01-13 (id 281365–281386), окно w0071.</strong> Введено правило равенства всех благословенных по силе независимо от источника благословения. Введена временность: сила не сохраняется, пример с подожжённым деревом, постоянная активация невозможна, тратит выносливость. Миколай предлагает прошлое класса: «раньше веков 15 назад благословенные были мощее но типа их реже призывали поэтому они оставляли силу потомкам» и «заключали её в артефактах», сразу же предлагая ослабить формулировку — «ну мб про мощь убрать можно», оставив мотив «просто думали что благословенных больше не будет и заботились о будущем». На возражение о временности силы отвечает: «ну мб раньше был способ». Расхождение между артефактами как сохранённой силой и правилом о невозможности сохранять благословение не закрыто.</p>\n<p><strong>2025-01-22 (id 283706–283748), окно w0072.</strong> Закреплён термин «братья и сёстры» для благословенных одним правителем. Названа общая черта — белые глаза при активации у благословенных Богом. Слава предлагает вообще убрать благословенных дьяволом: «я эти глазами наделил всех тех который должны быть благословений дьяволом, при этом и менять я ничего не хочу потому что мне и так нравится. Поэтому я думаю вообще убрать благословенных дьяволом». Тогда благословенных остаётся 21. Миколай против: «я хочу благословенных дьяволом», «блин», «грустно». Причина, которую называет Слава: «Потому что ничего про них придумать не могу». На прямой вопрос, сколько должно быть благословенных Богом, 21 или 42, Миколай отвечает «21». Окончательного решения Слава в окне не объявил. Отклонённые в тот же день варианты способности для воплощения гнева: скорость — «Способность скорость не подходит»; вулкан с каменной кожей и лавой внутри, где «даже если сломать камень он не упадёт, просто завязнет в лаве» — отклонено знаком 🚫.</p>\n<p><strong>2025-01-23 (id 284170–284176), окно w0072.</strong> Введён третий вид благословения — правителем нашего мира, единственная носительница, глава организации злодеев, сильнейшая. Выстроена иерархия: глава &gt; семь грехов и божество &gt; благословенный.</p>\n<p><strong>2025-01-24 (id 284248–284367), окно w0072.</strong> Числовое правило: 3 благословенных Бога либо 5 остальных на одного греха в максимуме. Каталог переписан за день трижды: первая редакция — десять благословенных с Теневыми братьями отдельной строкой; вторая — Теневые братья переехали в скобку к Дитя света, добавлены страдалец к Агрегату, слайм к Хулигану, Эльф во враги, отдельный блок «Семь грехов»; третья — добавлены блоки «Оружие» и «Артефакты», «корень желаний» в идеях заменён на «камень желаний». Степень проработки: «Ну только вид и способность и плюс минус характер».</p>\n<p><strong>2025-01-27 (id 284858), окно w0073.</strong> Реестр расширен: появились разделы «Существа», «Аномалий», «Церковь», «Военный», «Сторонний силы»; у Агрегата вместо волка теневые братья, у Дитя света — военный.</p>\n<p><strong>2025-01-28 (id 285353–285551), окно w0073.</strong> В реестр благословенных добавлен Масочник. Расписана команда против Серафима с показателями и оружием (Воительница, Агрегат, Палач и другие). Миколай замечает то, что не изменилось: «не разделены благословенные и апостолы». Слава отвечает «Сделаю сделаю» и поясняет: «Но там среди благословенных только апостолы а в скобках благословенный». В самом реестре разделение так и не появилось.</p>\n<p><strong>2025-02-12 (id 288545), окно w0075.</strong> В тексте про Защитника класс упомянут дважды и не раскрыт: чутьё Защитника на чужемирцев сравнивается с чутьём благословенного при прямой оговорке, что благословенным он не был, и перечисляется, о чём он ещё должен узнать — «о чужемирцов, о благословенных, о артефактах».</p>\n<p><strong>2025-02-25 (id 295551–295560), окно w0077.</strong> Слава напоминает про «Благословенный ада. Которых 9» и следом присылает нумерованный список из 14 позиций. Расхождение между числом 9 и четырнадцатью пунктами в переписке не обсуждается.</p>\n<p><strong>2025-03-06 (id 298846–298857), окно w0079.</strong> Реестр выложен целиком; принято решение убрать семь грехов. Названо, что злодеев пока 12.</p>\n<p><strong>2025-03-10 (id 300884–300889), окно w0079.</strong> Механика благословения сформулирована как отправная точка для объяснения арбетаров: связь с правителем другого мира, прогон силы через мозг, невозможность использовать 24/7.</p>\n<p><strong>2025-03-13 (id 301806–301874), окно w0080.</strong> Устами старика-арбетара: сила благословенных не их собственная, получена «лишь потому что понравились правителем»; благословенные не могут использовать «благословение долга», поэтому их можно убить внезапной атакой; мозг благословенного — материал ритуала становления арбетаром. Отдельно подтверждено ограничение: не лечат и не влияют на разум, и это касается не только апостолов, а всех благословенных.</p>\n<p><strong>2025-03-14 (id 302380–302681), окно w0081.</strong> Механика показана в бою: благословение приходит в критический момент, благословение от бога делает апостолом, признак — белые светящиеся глаза, следом свечение конечности и рывок. Проговорено правило чтения: пока белые глаза не написаны, персонаж не апостол.</p>\n<p><strong>2025-03-19 (id 305855–305858), окно w0083.</strong> Полная редакция механики в диалоге имитатора и защитника: четыре базовых способности у всех (усиление, самоисцеление, энергия, сенсорика); у апостолов способность формируется и потому уникальна, у прочих благословенных одного правителя одинаковая; связь идёт через мозг и повреждает его, отсюда головная боль; предохранитель в голове; каждый правитель может дать ограниченное число благословений; благословение может получить только разумный житель Кильки; апостолов 21.</p>\n<p><strong>2025-05-09 (id 324457–324462), окно w0094.</strong> Слава объявляет: «Я возвращаюсь к благословенным». Решено не ограничивать истории одной вселенной.</p>\n<p><strong>2025-05-10 (id 324541), окно w0094.</strong> Перечислены шесть категорий носителей сил: Благословенный, Арбетары, Альфы, Чужемирцы, Владельцы артефактов, Фантазёры.</p>\n<p><strong>2025-05-14 (id 325798–325808), окно w0094.</strong> Реестр выложен целиком, раздел благословенных переименован в «Апостолы». Заявлены правки: «Добавления организация нимб и фантазеров. И перераспределение сил».</p>\n<p><strong>2025-05-31 (id 331635–331665), окно w0099.</strong> Самая подробная редакция механики: связь ставится на мозг, средняя продолжительность жизни благословенного после получения — 10 лет, благословение даётся без согласия, одно на человека, разорвать нельзя; четыре базовых способности; уникальная способность правителя, одинаковая у всех его благословенных; после отключения все эффекты исчезают, включая остановку времени; все благословенные получают примерно одинаковое количество энергии; апостолам добавлена телепатия между собой; объяснено, почему у апостолов способности разные — правитель рая шлёт «лишь сгустки чистой и необработанной силы», которая формируется внутри апостола. Миколай задаёт вопросы, оставшиеся без ответа: почему благословение даётся именно этим существам, можно ли благословить корову, можно ли поглощать эту энергию, что правитель думает о выпуске энергии, легче ли мозгу, когда энергия течёт вовне, и что было бы, если бы не лилась; отдельно — можно ли дать Бессмертному второе благословение.</p>\n<p><strong>2025-08-30 (id 359681–359711), окно w0103.</strong> Определение через функцию: благословенные — «Людей, что лишь своё силой и авторитетом поддерживают мир». Названа организация апостолов АЗИП, которой более ста лет. Названа сестра, благословлённая правителем Кильке. Благословенные поставлены первыми в списке сил мира: «Благословенный / Арбетаров и Альфы / Творцы (фантазёры)», и обсуждается добавление четвёртой силы «Наподобие благословенных?».</p>\n<p><strong>2025-09-12 (id 364763–364782), окно w0104.</strong> Источник силы переопределён: «Благословенный всё также но силы у всех благословенных получен от небес». Одержимые объявлены аналогом арбетаров и чаще более сильными, чем благословенные, отсюда групповые выходы на убийство одержимого. Описано раскрытие чёрной изнанки: апостолы устроили открытую охоту на религиозную организацию, разносили церкви и многоэтажки в центре города, публично казнили десятки и сотни людей. После этого изменились три вещи: подписан публичный договор о правах и обязанностях благословенных, включая неучастие в военных конфликтах; организации раскрылись, их можно нанимать, причём убийство одержимого для родственников бесплатно, а изгнание демона платно; в организации теперь можно вступить.</p>\n<p><strong>2026-04-19 (id 462204–462207), окно w0120.</strong> Понятие перенесено в новую вселенную без энергии: благословенные — «люди, что способны чувствовать присутствия когото. Кого именно неизвестно, может бог, может ещё какое-то существо». Перечислены носители: Герой, Александор, Юра, четвёртый (запах), Азуриэль, Максим. Нумерация в перечислении сбита — после пятого Азуриэля идёт «Седьмой Максим», шестой пропущен. В мире на тот момент «только два аспекта. Благословенный и чёрные места, в которых если войти, то выйдешь уже не ты, а монстор».</p>\n<p><strong>2026-04-25 (id 466469–466505), окно w0120.</strong> Повтор: в мире были только благословенные и тёмные места, Слава хочет снова добавить апостолов и замечает про благословенных: «Ну я их везде пихаю».</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "GR-0013-S08", "GR-0013--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава класса нет. Есть рабочий реестр Славы, но благословенные и апостолы в нём так и не разделены, хотя Миколай указал на это 2025-01-28, а Слава ответил «Сделаю сделаю».</li>\n<li>Численность не сведена. За 2025-01-06 названы подряд 21+21, 42 и 41. 2025-01-22 предложено сократить до 21 за счёт удаления благословенных дьяволом — Миколай против, Слава решения не объявил. 2025-02-25 сказано «Благословенный ада. Которых 9», а в списке того же сообщения 14 позиций.</li>\n<li>Судьба благословенных дьяволом не решена. Позже они из механики фактически исчезают (в редакции 2025-03-19 всё держится на правителях Кильки и рая), но прямого решения об отмене в переписке нет.</li>\n<li>Пятое базовое умение благословенных дьявола не выбрано: «Ладно пока просто выкинем».</li>\n<li>На вопрос «у каждого все эти?» про пять базовых умений благословенных бога прямого ответа не прозвучало.</li>\n<li>Что такое «благословение долга» — не раскрыто, хотя на нём держится уязвимость всего класса.</li>\n<li>Фраза про предохранитель оборвана: «Но его можно —» продолжения нет.</li>\n<li>Три редакции базовых умений (пять умений на лагерь в 2025-01-06; четыре — усиление, самоисцеление, энергия, сенсорика — в 2025-03-19; четыре — регенерация, усиление тела и чувств, аура, сенсорика — в 2025-05-31) явно друг с другом не согласованы. Куда делись исцеление и глаза, видящие эмоции, в переписке не сказано.</li>\n<li>Расхождение между сохранением силы в артефактах 15 веков назад и правилом о невозможности сохранять благословение не закрыто.</li>\n<li>Кто и как «призывает» благословенных (формулировка «их реже призывали») — не объяснено.</li>\n<li>Вопросы Миколая от 2025-05-31 остались без ответа: почему благословение даётся именно этим существам, можно ли благословить корову, можно ли поглощать эту энергию, что об этом думает правитель, легче ли мозгу, когда энергия выходит наружу, и можно ли дать Бессмертному второе благословение.</li>\n<li>Формулировка «а для остальных надо будет 5» в правиле убийства греха не уточнена и допускает два чтения.</li>\n<li>Внутренняя структура организаций благословенных не описана. Названы АЗИП, его дополнительные филиалы и должность начальника филиала; ничего другого — ни числа организаций, ни их названий, ни правил приёма до 2025-09-12 — в переписке нет.</li>\n<li>Отношения благословенных с церковью и военными не описаны, хотя оба раздела стоят в реестре.</li>\n<li>Соотношение поздних вселенных (2025-09-12 «силы от небес», 2026-04-19 «чувствуют присутствие кого-то») с ранней механикой правителей и связи через мозг не проговорено; названия вселенных в этих окнах не даны.</li>\n<li>В перечислении носителей 2026-04-19 пропущен шестой: после пятого сразу идёт «Седьмой Максим». Имя четвёртого (того, что чувствует запах) не названо.</li>\n<li>Позиции «Ученица???», «липкий» и «иссушающий» в реестрах стоят без содержания; про две последние прямо сказано: «придумаю позже», «пока как заполнение».</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0013--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0171.html\">Палач</a>, <a href=\"PS-0180.html\">Воплощение гнева</a>, <a href=\"PS-0182.html\">Агрегат</a>, <a href=\"PS-0183.html\">Теневые братья</a>, <a href=\"PS-0184.html\">Бессмертный выродок</a>, <a href=\"PS-0185.html\">Глава организации злодеев</a>, <a href=\"PS-0194.html\">Воительница</a>, <a href=\"PS-0195.html\">Масочник</a>, <a href=\"PS-0214.html\">Благословлённый Фениксом</a>, <a href=\"PS-0215.html\">Сестра имитатора</a>, <a href=\"PS-0225.html\">Пустынник</a></li>\n<li><strong>Упоминает истории:</strong> <a href=\"IS-0017.html\">Защитник</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0013--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0013.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0013-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0013/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым чинить <code>SL-0054</code> «Список 12 апостолов»: три ссылки, статьи нет, а базы под ним 234 052 знака — это крупнейшая несобранная куча во всём наборе, и она ровно про то, чего в статье не хватает больше всего, про поимённый состав. Заодно там же, судя по названию записи, сидит третье число — двенадцать, — которое в статье не фигурирует вовсе, а в переписке идут 21, 42, 41, 9 и список на 14 позиций.</p>\n<p>Следом — реестры, на которых держатся все разговоры о составе и о неразделённости апостолов с благословенными: <code>SL-0053</code> — шесть ссылок, статьи нет, база 20 313; <code>SL-0051</code> — шесть ссылок, статьи нет, 9 834; <code>SL-0090</code> — четыре ссылки, статьи нет, 5 492; <code>SL-0089</code> (перечень шести категорий носителей сил, на который статья опирается датой 2025-05-10) — четыре ссылки, статьи нет, 1 753. Четыре записи, двадцать ссылок суммарно, ни одной статьи.</p>\n<p>Отдельно — организации. <code>MR-0099</code> «Территории и организации благословенных» — две ссылки, статья есть, но базы всего 3 135. Это и есть весь материал под пробелом «внутренняя структура организаций не описана»: искать там больше нечего, дыра настоящая. А вот <code>MR-0138</code> (АЗИП, 15 539) и <code>MR-0139</code> (контракт и правила агента АЗИП, 17 145) — записи заметные и в статье почти не использованы; прежде чем писать «иных должностей не названо», надо прочесть их.</p>\n<h3>С чего начать</h3>\n<p>В базе. Поздние редакции механики разложены по отдельным записям и все помечены «неясно»: <code>SP-0240</code> «Благословение правителя» (9 835), <code>SP-0241</code> «Четыре основные способности благословенных» (9 573), <code>SP-0242</code> «Уникальная способность правителя» (9 592), <code>SP-0264</code> «Белые глаза апостолов» (2 260), <code>SP-0236</code> (3 543), <code>SP-0237</code> (3 397). Ни у одной нет статьи, ни одна не привязана ко вселенной. Это тот самый материал, из-за которого в статье три несогласованных редакции базовых умений: они не противоречат друг другу в переписке, они просто лежат под разными номерами. Сверять три редакции надо здесь, а не в архиве.</p>\n<p>Так же с ядром: <code>SP-0163</code> «Благословение» — 86 784 базы при одной ссылке, <code>PS-0179</code> «Благословенные» — 78 161 при двух. Обе со статьями. Вопросы Миколая от 2025-05-31, оставшиеся без ответа, надо сначала поискать в этих двух записях — окно длинное, и ответ мог уехать туда.</p>\n<p>В архив — за одним: перечень носителей 2026-04-19, id 462204–462207, окно w0120. Там пропущен шестой и не назван по имени четвёртый (тот, что чувствует запах). Смотреть надо не сами эти сообщения, а продолжение окна и повтор 2026-04-25 (id 466469–466505) — если имя вообще прозвучало, то там.</p>\n<h3>Как развивалось</h3>\n<p>2025-01-06 — заявили широко: два лагеря, территории, организации, пять базовых умений на лагерь, три разных числа за один день. 2025-01-13 — ограничили: сила временная, тратит выносливость, все равны независимо от правителя. 2025-01-22 — попытка сократить вдвое, убрав благословенных дьяволом; Миколай против, решения нет. Дальше лагерь дьявола просто перестаёт упоминаться — не отменён, а вытеснен. 2025-03-19 и 2025-05-31 — механику переписывают заново дважды, каждый раз с нуля и не ссылаясь на предыдущую. 2025-09-12 — источник силы переопределён «от небес». 2026-04-19 — понятие перенесено в мир, где энергии нет вообще, и держится уже на чутье. 2026-04-25 — про себя: «Ну я их везде пихаю».</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для благословенного цена названа поимённо: сила идёт через мозг и повреждает его, отсюда невозможность держать благословение постоянно, отсюда предохранитель, отсюда десять лет средней жизни после получения. Апостол в той же системе получает не готовую способность, а «сгустки чистой и необработанной силы», которые формируются уже внутри него, — то есть работы мозгу достаётся заведомо больше. Дороже ли это обходится апостолу, короче ли у него те десять лет, чаще ли срабатывает предохранитель — не сказано ни разу. Правило цены сформулировано для класса и не сформулировано для его вершины, хотя разница между ними задана именно через то, в каком виде сила приходит.</p>\n<h3>Отклик</h3>\n<p>Предохранитель — лучшее, что здесь есть. Не «герой устал», а деталь, которая срабатывает сама, без ведома носителя, и в бою может выключить его в худший момент; и тут же — «а имитатор не научил вырубать этот предохранитель», то есть его можно обойти, и это умение передаётся от человека к человеку, а не выдаётся правителем. За две реплики появилось и ограничение, и школа, и способ его нарушить. И ровно на этом месте фраза «Но его можно —» обрывается на полуслове и продолжения не получает никогда. Такое совпадение мне трудно считать случайным: самая интересная механика мира осталась недоговорённой буквально в середине слова. Ещё зацепила поздняя версия, где энергии нет и остались только чутьё, почти-бессмертие и дебафф за неповиновение — Сашу выворачивает, если он не рискует. Это уже не про силу, а про то, что тебя ведут и наказывают за отказ идти; от «сломать деревянный дом, не более» это отстоит очень далеко.</p></div>", "r": []}];</script>
