<script>const BASE="";const DOCNAME="Провалы Энига";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0279-S01", "SP-0279--mehanika"], "h": "<p>Провалы — способность Энига, описанная целиком в один заход (2026-06-09, id 488784–488785, окно w0121). Эниг при этом отдельно вынесен из общей классификации: «Эниг сл с подвохом. Точнее самый особенный сл. Или даже не сл и не ис и не фантазёр».</p>\n<h3>Провал самого Энига</h3>\n<p>Тело и сознание Энига исчезают из нашего мира и оказываются на первом слое мира его матери. Первый слой описан так: «пустой чёрной пространство, наполненной синими молниями, неизвестной ранее энергии, это не оам и не ток, это совершенно новая энергия. Ядовитая для живых существ, но для Энига она оказалась безвредной».</p>\n<p>Числовые параметры:</p>\n<ul>\n<li>Длительность: «Проваливается он на 2 секунды, ну по меркам нашего мира, а вот по меркам того мира. То он в той пустоте наполненой неизвестной энергии может быть 2 минуты, а после насильно возращается обратная». То есть время в мире матери идёт в 60 раз быстрее по отношению к нашему, и возврат происходит принудительно.</li>\n<li>Точка возврата: Эниг сам выбирает, где появится, «в радиусе 50 метров от места где он провалился».</li>\n<li>Перезарядка: 3 минуты нашего времени.</li>\n</ul>\n<p>В первый раз (в 10 лет) точка возврата была не выбранной, а фиксированной: он «смог поглотить её часть и потом снова провалился но уже в обратно в настоящее, на 2 метра от того места, на котором он изчез».</p>\n<h3>Провал объектов</h3>\n<p>Эниг может отправлять в мир матери не только себя:</p>\n<div class=\"q\"><p>«Также он способен заставить провалится объекты не наполненные оам. ( это я к тому что он не может составить провалится артефакты, людей и живые организмы ( во всех живых организмов есть оам) )»</p></div>\n<p>Параметры для объектов другие:</p>\n<ul>\n<li>Длительность: «Любые объекты могут быть там 1 секунд для нашего мира, и одну минуту для того мира».</li>\n<li>Точка возврата: в радиусе 30 метров от места исчезновения, тоже по выбору Энига.</li>\n<li>Защита от совмещения: «так-же он не может заставить появиться объект внутри другого объекта, если он попытается так сделать, то объект просто рандомном месте появиться ну в радиусе 30 метров».</li>\n</ul>\n<h3>СОЭ и то, что даёт возврат</h3>\n<p>Вернувшиеся предметы «пропитываются это странное особое энергии ( СОЭ)». Пока СОЭ в них есть, Эниг может ими управлять — «ну типо телекинез». Из этих же объектов он может собирать СОЭ обратно в себя. Зачем: «из-за того, что он не может без остановочная сам проваливается, так сказать перезарядка, которая занимает 3 минуты, нашего времени. Поэтому он так делает если ему нужна СОЭ». То есть проваливание объектов — обходной способ добыть СОЭ, когда сам провалиться нельзя.</p>\n<h3>Применение СОЭ</h3>\n<p>Отдельно оговорено, почему применение узкое: «Во первых у него нет программы поэтому использовать прям креативно он не может, да и он ещё юный, на момент начала сюжета ему 17 лет».</p>\n<ul>\n<li><strong>Усиление.</strong> «Просто покрывает себя этими синими молниями и увеличивает свои физически характеристики.»</li>\n<li><strong>Регенерация.</strong> «СОЭ имеет очень хорошо восстанавливает тела, ну то бишь с помощью СОЭ можно хорошо регенерировать лучше чем от оам.»</li>\n<li><strong>Удары.</strong> «Его удары достаточна мощный так как СОЭ для всех ядовит, то удар пропитанной СОЭ является очень болючим, и сложно восстанавливаемым. То есть после этого удара восстановиться с помощью оам очень сложная. Плюсом если ты прям будешь впитывать удары СОЭ то по-тихоньку тебе будет всё хреновее так как СОЭ распостраняется по телу и тебе будет хреновее. Очень сложно вывести с помощью оам.»</li>\n<li><strong>Выстрел молнией.</strong> «Ещё он может стрелять этой СОЭ как молнии. Но он косой и поэтому часто не попадает.»</li>\n<li><strong>Выпуск во все стороны.</strong> «Также он может выпустить заряд СОЭ в разные стороны.»</li>\n</ul>\n<p>Итоговый список авторов (id 488785): «И по сути у него способности это телепортация на малый расстояние ( провалы то есть). Телекинез пропитаных СОЭ объектов. Усиление, опасный удары, косой выстрел молнии. Ну и просто выпуск накопившиеся СОЭ в разные стороны».</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0279-S02", "SP-0279--ogranicheniya-i-cena"], "h": "<ul>\n<li><strong>Перезарядка провала</strong> — 3 минуты нашего времени, провалиться подряд нельзя.</li>\n<li><strong>Возврат принудительный</strong> — остаться в мире матери дольше двух минут того мира Эниг не может.</li>\n<li><strong>Живое и артефакты не проваливаются.</strong> Условие сформулировано через оам: провалиться может только то, что оам не наполнено. Люди, живые организмы и артефакты не поддаются, «во всех живых организмов есть оам».</li>\n<li><strong>Косоглазие как ограничение точности.</strong> Дальнобойная атака СОЭ ненадёжна не из-за механики, а из-за того, что «он косой».</li>\n<li><strong>Отсутствие программы.</strong> Гибкого, «креативного» применения СОЭ у него нет — не из-за нехватки энергии, а потому что программы у него нет вообще.</li>\n<li><strong>СОЭ как наркотик — главная цена.</strong> «СОЭ хоть и не ядовита для него вызывает чувство эфория, посылает дофамина дофига. И мутить сознание. Делая тебе словно пьяным и ты творишь всякую дичь. Убиваешь прохожего. Убиваешь всех в приюти. Купаясь в ванне кого-то богача и т. Д. Можно сказать он наркоман, а его наркотик это СОЭ.» То есть та же энергия, которая даёт усиление и регенерацию, отбирает контроль над поведением, и перечисленные последствия даны как уже случившиеся, а не как гипотетические.</li>\n</ul>\n<p>Для всех остальных живых существ СОЭ ядовита; безвредность именно для Энига — исключение, объяснённое его происхождением.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0279-S03", "SP-0279--nositeli"], "h": "<p>Единственный носитель — Эниг. Способность не наследуется и не передаётся; она объяснена его происхождением, а не обучением.</p>\n<p>Предыстория (id 488784): фантазёрша забеременела и «не почуствовала того чего хотела. Она думала что забеременив у неё появится мотивация остаться в этом мире. Но нет ей до сих пор этот мир казался серым». Она начала исчезать, «то бишь отправляться своей мир», сознание уходило от тела, пока она окончательно его не покинула. «А тела без сознания это просто труп. И врач пришлось поддерживать мировой тело, и провести рождение ребёнка раньше чем нужно было.» Поэтому Эниг родился слабым и нездоровым и попал в приют — «хиленьким и вечно бледным (не типо бледный красивый, а типо бледный больной, так сказать серовато бледный)», над ним издевались, и он был отстранённым, «словно не в этом мире».</p>\n<p>Первый провал случился в 10 лет: «И так он доживает до 10 лет, всё такоё же бледный, хиленький и больной и не являющийся сл. И уже познавший неприятную сторону человечества. И он впервые проваливается». До этого момента он сл не был.</p>\n<p>На момент начала сюжета Энигу 17 лет. «И также он злодей, но не принадлежит не какой организаций. И он любит по драться и давить врагов.»</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0279-S04", "SP-0279--kak-menyalas-po-versiyam"], "h": "<p>Версия одна.</p>\n<p><strong>2026-06-09 (id 488784–488785, окно w0121).</strong> Способность описана сразу целиком, вместе с предысторией, числами, ограничением по оам, запретом появления объекта внутри объекта и эффектом СОЭ на сознание. Двумя сообщениями подряд, второе — сводка того же в виде перечня. Переписываний не было.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0279-S05", "SP-0279--svyaz-s-drugimi-sposobnostyami"], "h": "<ul>\n<li><strong>СОЭ (странная особая энергия)</strong> — не отдельная способность, а вещество, которое провалы добывают. Всё остальное, что умеет Эниг, — производные от СОЭ, а не от самого провала.</li>\n<li><strong>Оам</strong> — противопоставлен СОЭ по всем пунктам: СОЭ «не оам и не ток», регенерация от СОЭ лучше, чем от оам, урон СОЭ плохо лечится оам, вывести СОЭ из тела с помощью оам «очень сложно». Наличие оам в объекте, наоборот, делает объект непроваливаемым.</li>\n<li><strong>Мир матери</strong> — первый слой этого мира и есть место, куда идёт провал. Дальше первого слоя Эниг не заходит; что там за первым слоем, не описано.</li>\n<li><strong>Фантазёры</strong> — категория, к которой относилась мать. Сам Эниг фантазёром не назван: «Или даже не сл и не ис и не фантазёр».</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S06", "SP-0279-S06", "SP-0279--probely"], "h": "<div class=\"gaps\"><ul>\n<li><strong>Что за первым слоем мира матери</strong> — не сказано. Известно только, что слой первый, значит есть и другие.</li>\n<li><strong>Встречает ли Эниг там мать</strong> — не сказано. Мать ушла в свой мир полностью, но вопрос о встрече в переписке не поднимался.</li>\n<li><strong>Верхний предел накопления СОЭ</strong> не назван: сколько её можно держать в себе, кончается ли она сама.</li>\n<li><strong>Масса и размер провалимых объектов</strong> не ограничены явно — сказано «Любые объекты», единственный фильтр это оам.</li>\n<li><strong>Сколько СОЭ держится в вернувшемся объекте</strong> и как быстро выветривается — не сказано, только «пока в них находится СОЭ».</li>\n<li><strong>Не сказано, можно ли провалить объект в руках у противника</strong> или объект, которого Эниг касается, — условия наведения не описаны, только радиусы возврата.</li>\n<li><strong>Не сказано, что происходит, если провалить объект, а самому провалиться следом.</strong></li>\n<li><strong>Отклонённых вариантов нет</strong> — способность не переписывалась.</li>\n<li><strong>Вселенная не определена</strong>: в карточке стоит «неясно», привязка сделана по дате объявления.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["SP-0279--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-06-09</td>\n<td>488784–488785</td>\n<td>w0121</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0279-provaly-eniga.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0279--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0279.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
