<script>const BASE="";const DOCNAME="ловушка времени";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0036-S01", "SP-0036--mehanika"], "h": "<p>Способность запирать жертву в повторяющемся отрезке времени. Постановка вопроса принадлежит Славе (2024-01-03, id 73725): «Смотри есть допустим ловушка времени где человек проживает одно и тоже. Какие должны быть условия использования? Типо он же просто не будет всех кидать в эту ловушку».</p>\n<p>Условия применения выдал Миколай тем же вечером (2024-01-03, id 73876–73884), тремя пунктами:</p>\n<ol>\n<li>«Человек со способностью и его жертва» «должны быть близко друг к другу».</li>\n<li>«Жертва должна услышать, прочитать сценарий ну или промежуток заточения в ловушке» — то есть жертве нужно воспринять и сам сценарий повторяющегося отрезка, и срок заточения.</li>\n<li>«Чел со способностью тратит свои жизненные силы на заточение».</li>\n</ol>\n<p>Отдельно оговорено, что применение не может быть массовым и произвольным — сам вопрос Славы был задан именно про это ограничение («он же просто не будет всех кидать в эту ловушку»).</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0036-S02", "SP-0036--ogranicheniya-i-cena"], "h": "<p>Цена платится носителем и выражена в жизненных силах: «Ну тобиж естественная старость теперь все ближе» (id 73881). Курс назван точно: «1 неделя заточения, 1 год жизни» (id 73884). Пример дан там же: «Мог умереть от старости в 80, а умрет в 79» — если «неделю способность работает» (id 73882–73883).</p>\n<p>Кроме того, сама механика требует близости носителя к жертве и осведомлённости жертвы о сценарии и сроке — без этого ловушка, по условиям Миколая, не ставится.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0036-S03", "SP-0036--nositeli"], "h": "<p>В переписке носители не названы. Разговор идёт про «человека со способностью» вообще, без привязки к конкретному персонажу.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0036-S04", "SP-0036--kak-menyalas-po-versiyam"], "h": "<p>Версия 1 — 2024-01-03 (окно w0022, id 73715–73884). Единственная зафиксированная версия: вопрос Славы об условиях и ответ Миколая из трёх условий с ценой. Позже способность в переписке не пересматривалась.</p>\n<p>Разговор, в котором она возникла, начинался с другой темы: перед вопросом про ловушку Миколай обсуждал способность «забывать прошлое» и оценивал её так: «Не полезная конечно способность, скорее вредная» (id 73715–73716). Связь между этой репликой и ловушкой времени в переписке не проговорена.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0036-S05", "SP-0036--svyaz-s-drugimi-sposobnostyami"], "h": "<p>В базе способность отнесена к группе «способности, связанные со временем». Конкретные другие способности рядом с ней не названы.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "SP-0036-S06", "SP-0036--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Носитель не назван — ни персонажа, ни расы, ни мира.</li>\n<li>Не сказано, к какому миру или сюжету ловушка относится.</li>\n<li>Не сказано, что происходит с жертвой внутри цикла: помнит ли она повторы, можно ли из ловушки выйти досрочно, что бывает по истечении срока.</li>\n<li>Не сказано, кто задаёт сценарий отрезка и насколько подробным он должен быть.</li>\n<li>Не уточнено, что значит «близко друг к другу» — расстояние не названо.</li>\n<li>Не сказано, нужно ли носителю сохранять близость всё время заточения или только в момент постановки ловушки.</li>\n<li>Курс «1 неделя — 1 год» дан на одном примере; масштабируется ли он линейно вверх и вниз, не оговорено.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0036--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0009.html\">Падения небес</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0036--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-01-03</td>\n<td>73715–73884</td>\n<td>w0022</td>\n<td>Падения небес (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0036-lovushka-vremeni.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0036--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0036.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
