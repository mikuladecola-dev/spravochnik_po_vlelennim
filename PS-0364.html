<script>const BASE="";const DOCNAME="Дети апостолов";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0364-S01", "PS-0364--proishozhdenie"], "h": "<p>Введены Славой 25 апреля 2026 года (id 466548, окно w0120) как «ещё один вкид»: «Дети апостолов, долгое промежуток времени просто люди. Но после 18 лет. Они становяться сверх людьми и у них будут чернеть глаза.» Материал относится к вселенной, объявленной в тот же день, 2026-04-25 (id 466476) — своего имени в переписке эта вселенная не получила.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0364-S02", "PS-0364--vneshnost"], "h": "<p>После 18 лет у Детей апостолов чернеют глаза. Больше признаков внешности в переписке не названо.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0364-S03", "PS-0364--harakter"], "h": "<p>Главная и единственная описанная черта — направленность против родителя: «А и ещё их главная особенность. Они всегда после 18 лет захотят убить родителя. Это их главная цель.» Миколай реагирует репликой «эдипов комплекс», проводя параллель, но развёрнуто её не обсуждает.</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0364-S04", "PS-0364--sposobnosti"], "h": "<p>До 18 лет — обычные люди. После 18 лет «становяться сверх людьми», при этом какие именно способности приобретаются, не уточнено — назван только внешний признак (чернеющие глаза).</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0364-S05", "PS-0364--svyazi-s-drugimi"], "h": "<p>По метаданным записи связаны с сущностями «Апостолы» и «Белые глаза апостолов», а также помечены как «часть» Апостолов. В самом прочитанном фрагменте переписки эта связь не проговаривается — только заявлена вне текста диалога.</p>", "r": []}, {"t": "Как менялся", "a": ["S06", "PS-0364-S06", "PS-0364--kak-menyalsya"], "h": "<p>Единственная версия — 2026-04-25 (id 466548–466588, окно w0120). Дальнейших упоминаний или изменений в переписке нет.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0364-S07", "PS-0364--chto-s-nim-stalo"], "h": "<p>Миколай одобряет идею: «о, это круто... да если честно». Слава ожидала иной реакции: «Бля я думал ты не поймёшь». Обсуждение обрывается на реплике Миколая «эдипов комплекс», после чего разговор уходит в сторону (прощание, не относящееся к теме). Дальнейшего развития концепции в переписке нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0364-S08", "PS-0364--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Не раскрыто, какие именно сверхспособности получают Дети апостолов после 18 лет — сказано только «становятся сверх людьми».</li>\n<li>Не сказано, что происходит после попытки или совершения убийства родителя — цель заявлена, но её последствия не описаны.</li>\n<li>Связь с «Апостолами» и «Белыми глазами апостолов» заявлена только метаданными записи, в самой переписке не раскрыта.</li>\n<li>Своего имени вселенная, к которой отнесён этот материал, не получила: объявлена 2026-04-25, id 466476.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["PS-0364--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-04-25</td>\n<td>466548–466588</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0364-deti-apostolov.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0364--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0364.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
