<script>const BASE="";const DOCNAME="Ускорение (маска)";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0090-S01", "SP-0090--mehanika"], "h": "<p>Механика не расписана. Способность названа списком, без пояснений: «Первая контроль грешниками вторая ускорения третий контроль тела( он может как либо изменять тела и регенерировать)» (2024-07-10, id 202913). Что именно ускоряется — сам носитель, его действия или что-то ещё, — в переписке не сказано.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S02", "SP-0090-S02", "SP-0090--nositeli"], "h": "<p>Персонаж в белой маске с улыбкой. Описан в том же сообщении, что и список способностей (id 202912): «17 летние нормального телосложения ходит в белой маски где нарисовано улыбка черный плащ». Убивает в прямом эфире сверхлюдей, которые совершали грехи — «на подобие безмысленного убийство или каких ещё грехов». У него «должно быть 6 способности».</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S03", "SP-0090-S03", "SP-0090--kak-menyalas-po-versiyam"], "h": "<p><strong>2024-07-10 (id 202911–202915), единственная версия.</strong> Ускорение названо вторым пунктом в перечне из шести способностей. Из шести в переписке перечислены три:</p>\n<ol>\n<li>контроль грешниками — «тем грешней человек тем лучше контролирует он их»;</li>\n<li>ускорения;</li>\n<li>контроль тела — «он может как либо изменять тела и регенерировать».</li>\n</ol>\n<p>Остальные три не названы. Перечисление оборвалось: Миколай написал «ахахахах», Слава ответил «В чем смысл / Зачем я это написал ?».</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S04", "SP-0090-S04", "SP-0090--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Идёт вторым номером в наборе из шести способностей одного персонажа, между «контролем грешниками» и «контролем тела». Как способности взаимодействуют между собой, в переписке не сказано.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "SP-0090-S05", "SP-0090--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Механика не расписана.</li>\n<li>Не сказано, что ускоряется и насколько.</li>\n<li>Ограничения и цена не названы.</li>\n<li>Три из шести способностей персонажа вообще не перечислены.</li>\n<li>К теме не возвращались.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["SP-0090--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-10</td>\n<td>202911–202915</td>\n<td>w0047</td>\n<td>7 островов (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0090-uskorenie-maska.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0090--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0090.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
