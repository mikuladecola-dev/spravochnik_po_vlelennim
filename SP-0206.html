<script>const BASE="";const DOCNAME="Оранжевые пузырьки";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0206-S01", "SP-0206--mehanika"], "h": "<p>Уникальное благословение Защитника, показанное один раз — в бою против упыря и ангела (2025-03-19, id 305857–305858, окно w0083). Отдельного разбора механики в переписке нет: способность целиком раскрыта внутри боевой сцены, написанной Славой.</p>\n<p><strong>Оранжевые конечности.</strong> Способность включается в момент, когда Защитник, потерявший сознание после удара упыря о скалу, «мгновенно пробуждается» от худших воспоминаний своей жизни. Он преодолевает дистанцию до упыря «Мгновение ока» и наносит удар, «Ломая ему нос, кость и рвя ему мыщцы». В тексте прямо сказано, что он при этом «Не замечая, что его руки и ноги стали оранжевым». То есть окрашивание рук и ног в оранжевый — внешний признак работы способности, и в этот момент он не был замечен самим носителем.</p>\n<p><strong>Пузырьки и взрыв.</strong> Второй элемент — оранжевые пузырьки, вздувающиеся на теле противника, и последующий взрыв. В сцене это показано на упыре: «из его груди. Показались пальцы. И вдруг грудь упырья. Начала надуваться мелкими и большими оранжевыми пузырьками. И БАМ. Упырь взрывается».</p>\n<p><strong>Пузырьки в воздухе.</strong> Второй показ — не на теле, а рядом с целью в воздухе: бросив ангела в небо, применивший способность «Образуя рядом с ним оранжевый пузырьки. Прогремел взрыв». Мощность взрыва названа прямо: «Способный снести здания».</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0206-S02", "SP-0206--ogranicheniya-i-cena"], "h": "<p><strong>Взрыв не убивает ангела.</strong> Мощность оговорена сразу же: взрыв «Способный снести здания. Но не способные убить ангела» — после взрыва ангел открывает глаз и вокруг него образуется пламя.</p>\n<p><strong>Предохранитель.</strong> В той же сцене, пока Защитник продолжает бить упыря, описано отключение благословения: «Не замечая, что благословения выключалось. Точнее его выключил предохранитель. А имитатор не научил вырубать этот предохранитель». Предохранитель, таким образом, срабатывает сам, а способа его отключить Защитник не знает — этому его не научил имитатор. В тексте не сказано прямо, относится ли предохранитель именно к Оранжевым пузырькам или к благословению Защитника в целом.</p>\n<p><strong>Разрушение собственного тела.</strong> В том же эпизоде, продолжая бить, Защитник «Не замечая, как пальцы его ломаются. Не замечая как кожа рвётся, а кости трещят. Не замечая, что бьёт уже не кулаком, а культяпкой». Текст не говорит прямо, вызвано ли это самой способностью или тем, что Защитник продолжал бить, не чувствуя тела; связь в переписке не сформулирована.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Что не сформулировано по вашей же логике — не материал авторов</b>\n<p>Про мозг правило названо целиком и тут же показано: сила проходит через мозг, вредит ему, поэтому в голове стоит автоматический ограничитель, который срабатывает сам. Про тело в том же абзаце — только события: пальцы ломаются, кожа рвётся, кости трещат, бьёт уже культяпкой. Что это — цена способности, побочный эффект усиления или следствие того, что носитель перестал чувствовать себя, — не сказано; и предохранителя, который остановил бы разрушение рук так же, как он останавливает выгорание мозга, тоже нет. Для одного органа правило доведено до механизма, для остального тела того же рода утверждения нет. Показываю место.</p></div>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0206-S03", "SP-0206--nositeli"], "h": "<p><strong>Защитник</strong> — носитель. Способность названа его: увидев взрыв упыря, он думает «Он сымитировал мою способность».</p>\n<p><strong>Имитатор</strong> — воспроизводит способность через имитацию чужого благословения. Именно он взрывает упыря пузырьками изнутри (пальцы, показавшиеся из груди упыря) и он же создаёт пузырьки в воздухе рядом с ангелом. Реакция Защитника на это: он теряет сознание, «Удивляясь, как можно использовать своей благословенния».</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S04", "SP-0206-S04", "SP-0206--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Имитация чужого благословения — способность имитатора, через которую Оранжевые пузырьки были применены вторым носителем.</p>\n<p>В той же сцене у имитатора показаны другие приёмы, не относящиеся к пузырькам: удар по воздуху, накрывший разом упыря и ангела, о котором сказано «Это был особый способ усиления имитатор. Но он поглащает слишком много сил. Да и его нужно ещё готовить», и цепь, которой он ловит ангела за ногу и за шею.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "SP-0206-S05", "SP-0206--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Способность существует в одной версии, разработки по датам нет: разговора о её механике отдельно от боевой сцены в переписке не было.</li>\n<li>Не сказано, как способность включается: в сцене она срабатывает сама на пробуждении Защитника, и он её не замечает. Управляет ли он ею сознательно — не сказано.</li>\n<li>Не сказано, чем задаётся мощность взрыва и от чего она зависит.</li>\n<li>Не объяснено, что такое предохранитель, кто его поставил и почему обучение его отключению относится к имитатору.</li>\n<li>Не сказано, обязателен ли контакт с телом противника: в одном случае пузырьки вздуваются на теле, в другом образуются рядом с целью в воздухе.</li>\n<li>Не сказано, что происходит с носителем после применения — цена самой способности не названа.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["SP-0206--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-03-19</td>\n<td>305857–305858</td>\n<td>w0083</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0206-oranzhevye-puzyrki.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0206--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0206.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["SP-0206-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/SP-0206/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — <code>SL-0054</code> «Список 12 апостолов»: три ссылки, статьи нет, 234 052 знака базы, 44 версии, двадцать окон, 2025-01-28 — 2026-06-07. Самая большая бесстатейная запись во всём наборе, и уникальные благословения апостолов лежат именно в ней — эта боевая сцена (305857) втянута туда целиком, вместе с пузырьками и предохранителем. Пока у списка нет статьи, вопрос «чем вообще задаётся уникальная способность апостола и откуда она берётся» негде поставить, а это ровно тот вопрос, на который здесь нет ответа.</p>\n<p>Вторая — носитель. Защитника как персонажа в справочнике нет. Есть история <code>IS-0017</code> «Защитник» (две ссылки, статья 49 884, база 139 029, пять вселенных), есть <code>PS-0196</code> «Семья Защитника» (17 812 / 37 618), есть три прозаические записи — <code>PR-0049</code>, <code>PR-0059</code>, <code>PR-0061</code> — и четыре истории вокруг. Персональной карточки у того, чьё это благословение, нет ни одной. Всё, что о нём известно, разложено по чужим записям, и связать «уникальную способность» с биографией негде.</p>\n<p>Третья, обратная по знаку: второй носитель обеспечен лучше первого. <code>SP-0079</code> «Имитация» (32 925 / 36 425, две ссылки), <code>SP-0060</code> «Усиление Имитатора» (48 704 / 112 113), <code>SP-0205</code> «Цепи имитатора» (20 127), <code>PS-0383</code> «Имитатор» — статья на 79 022 знака при нулевой базе, то есть собранная из чужих записей. Вопрос «как имитация воспроизводит пузырьки без тела носителя» придётся ставить там, а не здесь.</p>\n<h3>С чего начать</h3>\n<p>В базе, и один пробел закрывается одним сообщением назад.</p>\n<p>Статья спрашивает, относится предохранитель к пузырькам или к благословению целиком. Ответ — в 305856, ровно предыдущем сообщении того же окна, которое в источники не попало (взяты 305857–305858). Там имитатор объясняет защитнику устройство мира: связь идёт через мозг и повреждает его, поэтому благословением нельзя пользоваться круглосуточно, «и у нас благословенных есть предохранитель в голове. Который при случаи выгорания мозгов отключает благословенния». Это записано в <code>SP-0204</code> «Предохранитель» (статья есть, 17 153 базы): предохранитель общий, не пузырьковый. Туда же за оборванным «А имитатор не научил вырубать» — 2025-03-20, id 306157–306165, где Миколай трижды тыкает в недосказанное, а Слава договаривает одним словом: «Вырубить».</p>\n<p>Дальше:</p>\n<ul>\n<li><code>SL-0054</code> — та же сцена внутри большой записи про апостолов, вместе с их устройством (окно w0083: благословлённые правителем рая, 21 на весь мир).</li>\n<li><code>SP-0079</code> и <code>SP-0060</code> — про имитацию и её цену. Цена в этой же сцене названа, но не для пузырьков, а для усиления: «Но он поглащает слишком много сил. Да и его нужно ещё готовить».</li>\n<li><code>SP-0210</code> «Экзоскелет» (16 871, две ссылки) — в этом же бою у защитника «заставля скрипеть экзоскелет», и с ломающимися пальцами это нигде не сведено.</li>\n</ul>\n<p>В архив — за разбором. 19 марта текст прислан, 20-го Миколай его читает и спрашивает по ходу: сначала «че можно», «там рил не понятно», потом «ангел и упырь?». Смотреть окно w0083 после 306165: дошёл ли разбор до пузырьков вообще. В базе следов такого вопроса нет — похоже, взрыв упыря прошёл мимо обсуждения.</p>\n<h3>Как развивалось</h3>\n<p>Здесь нет разработки по датам, есть один абзац. 19 марта 2025, id 305857: способность заявлена, показана и ограничена внутри одного сообщения — руки и ноги оранжевые, пузырьки на груди упыря, взрыв, и тут же предел мощности («Способный снести здания. Но не способные убить ангела»), и тут же выключение предохранителем. Вторым показом (305858) она уже в чужих руках. 20 марта при чтении разбор упирается в предохранитель, а не в пузырьки. 14 мая, когда весь состав апостолов переписывается реестром заново, Защитник стоит строкой «Защитник🤬( ангел 👼)» — без единой способности в скобках. Заявили и ограничили в одном абзаце, и не возвращались.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Про мозг правило названо целиком и тут же показано: сила проходит через мозг, вредит ему, поэтому в голове стоит автоматический ограничитель, который срабатывает сам. Про тело в том же абзаце — только события: пальцы ломаются, кожа рвётся, кости трещат, бьёт уже культяпкой. Что это — цена способности, побочный эффект усиления или следствие того, что носитель перестал чувствовать себя, — не сказано; и предохранителя, который остановил бы разрушение рук так же, как он останавливает выгорание мозга, тоже нет. Для одного органа правило доведено до механизма, для остального тела того же рода утверждения нет. Показываю место.</p>\n<h3>Отклик</h3>\n<p>Сильное здесь то, что способность появляется не в описании, а в драке, и герой узнаёт о ней последним: «Не замечая, что его руки и ноги стали оранжевым». Опознавательный знак собственного благословения он в этот момент не видит — как не видит ни сломанных пальцев, ни того, что сила уже выключена. А дальше лучший ход всей сцены: свою способность он впервые видит со стороны, применённую чужими руками, и правильно применённую — из груди упыря показываются пальцы имитатора, грудь вздувается пузырьками, и в голове успевает мелькнуть только «Он сымитировал мою способность». Он теряет сознание не от боли, а от удивления, «как можно использовать своей благословенния». Показать предел героя тем, что кто-то другой делает его же дело лучше, — точный приём. И сам образ хорош своей несерьёзностью: мелкие и большие оранжевые пузырьки, вспухающие на теле, как в газировке, за секунду до «И БАМ».</p></div>", "r": []}];</script>
