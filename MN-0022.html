<script>const BASE="";const DOCNAME="Чёрные озёра";
const LEAD="";
const CH=[{"t": "Где находится — в каком мире и в каком его месте", "a": ["S01", "MN-0022-S01", "MN-0022--gde-nahoditsya"], "h": "<p>Вселенная «Оам», мир Оам. Точка на карте не названа: озёра привязаны не к местности, а к событию — они стоят там, куда упали метеориты. Дословно: «Это места куда упала один из метеоритов» (2025-10-20, id 376413). Сколько таких озёр и в каких областях мира они находятся, в переписке не сказано.</p>\n<p>По разметке источника монумент связан с миром Оам и входит в его состав.</p>", "r": []}, {"t": "Что собой представляет", "a": ["S02", "MN-0022-S02", "MN-0022--chto-soboy-predstavlyaet"], "h": "<p>Озёра, превращающие людей в монстров. Дословно: «Чёрная озера, что превращает людей в монстров стоит им туда нырнуть» (2025-10-20, id 376413).</p>\n<p>Условие названо точно — нырнуть. Что происходит при простом касании воды или при питье, в переписке не сказано. Каких именно монстров получают, сохраняет ли превращённый разум, обратим ли переход — тоже не сказано.</p>\n<p>Имя в источнике встречается в двух написаниях: «Чёрные озёра» и «Чёрная озера».</p>", "r": []}, {"t": "Что с ним связано — предметы, механики, силы", "a": ["S03", "MN-0022-S03", "MN-0022--chto-s-nim-svyazano"], "h": "<p>Метеориты и артефакты. Следующим сообщением, в том же разговоре, Слава объясняет происхождение артефактов: «Артефакты это предметы созданный из материалов, который находились близко к метеоритом, либо из осколков самого метеорита» (2025-10-20, id 376414).</p>\n<p>Озёра и артефакты таким образом восходят к одному источнику — упавшим метеоритам. Прямой связи между озёрами и артефактами (например, что из озера или с его берега можно достать артефакт) в переписке не проведено.</p>\n<p>Сами метеориты как отдельная сущность здесь не расписаны: не сказано, сколько их упало, откуда они пришли и когда это произошло.</p>", "r": []}, {"t": "Как менялся по версиям — по датам", "a": ["S04", "MN-0022-S04", "MN-0022--kak-menyalsya-po-versiyam"], "h": "<p>Версия 1 — 2025-10-20, окно w0107, сообщения id 376411–376414. Первое и единственное упоминание, сразу с объяснением природы: озёра стоят на местах падения метеоритов, ныряние превращает человека в монстра, артефакты происходят от того же метеоритного вещества. Других версий, правок и отклонённых вариантов в материале нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MN-0022-S05", "MN-0022--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Не сказано, сколько озёр и где они находятся.</li>\n<li>Не описано, во что именно превращается нырнувший, сохраняет ли он разум, можно ли вернуть человеческий облик.</li>\n<li>Не сказано, действует ли свойство на всех подряд и есть ли от него защита.</li>\n<li>Не сказано, использует ли кто-то озёра намеренно.</li>\n<li>Почему озёра «чёрные» — цвет воды, свойство метеоритного вещества или что-то ещё — не объяснено.</li>\n<li>Связь озёр с артефактами не проведена, хотя оба объяснены через метеориты.</li>\n<li>Ни один персонаж с озёрами не связан, событий на них в переписке не происходило — поэтому раздела о персонажах и событиях в статье нет.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MN-0022--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0008.html\">Оам</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MN-0022--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-10-20</td>\n<td>376411–376414</td>\n<td>w0107</td>\n<td>Оам (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/monumenty/MN-0022-chernye-ozera.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MN-0022--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MN-0022.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
