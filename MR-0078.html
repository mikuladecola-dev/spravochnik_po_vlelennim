<script>const BASE="";const DOCNAME="Заражённые облака";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0078-S01", "MR-0078--ustroystvo"], "h": "<p>Заражённые облака — правило, действующее внутри деревни-гиганта, и часть её общей системы работы с облаками. Всё описание дано Миколаем одним куском (2024-12-11, id 269369–269371).</p>\n<p>Место действия: Азия, «деревня-гигант» — название дано «из-за площади поселения и количества жителей». Деревня стоит на горе высотой около 3000 метров. Гора «не просто гора, а старейший вулкан». Земли вокруг него стабильные, но есть «гладкие каменные плоскости», где слой земли «крайне маленький по общим меркам и близок к активной магме». Вулкан окружён «можно сказать кольцом из гор пониже»; сам Миколай отмечает, что кольцо не идеальное и это скорее оговорка — «по карте так не скажешь, но функция у него схожа».</p>\n<p>Главная особенность места — облака. Существует наука нефология, изучающая облака; для жителей деревни «эти знания бытовая и жизненная необходимость», потому что «уже не первое тысячелетие они исследуют их и имеют инструменты для использования в повседневной жизни».</p>\n<p>Историческая справка, данная в том же сообщении: было кочевое племя, «им было холодно на земле и они полезли к солнцу на гору», а забравшись, поняли, что в них «врезалось» облако. Это было первое их наблюдение облака вблизи. После того, как облако прошло сквозь них, проросли их семена (овощей), а «некоторых хватило недуг». Спускать больных было неудобно, оставлять — жалко и противоречило обычаям. Так племя и поселилось на горе, исследуя облака.</p>\n<p>К настоящему времени в деревне работает выстроенная система: жители «могут создавать облака, ловить и хранить их». Цепочка производства облаков описана так:</p>\n<ul>\n<li>давно прорублен канал для реки в деревню — «во первых потому что деревень без воды вблизи не бывает, а она была далеко»; на канале установлены управляемые дамбы;</li>\n<li>дамбы периодически открывают, вода течёт «на расколенные низменности» и испаряется;</li>\n<li>поверхность настолько горячая, что «до 5 метров действительный пар», выше он частично превращается в туман, но продолжает подниматься;</li>\n<li>на высоте 2,5 км туман сталкивается с ветром, «который выходит из-за гор полученный течением»;</li>\n<li>ветер формирует из тумана облака; «из-за четких пропорций, они не вырастают больше 10 метров» и врезаются ближе к вершине горы;</li>\n<li>там, на специальных мостиках — «бышах» — нефители ловят облака «в специальную ткань из специального материала и с особенной фактурой»;</li>\n<li>используя родовую энергию, ловцы «могут перемещать облака не испортив их».</li>\n</ul>\n<p>Дальше облака расходятся по двум путям. Обычные жители «просто поливают огород этими облаками в основном». Учёные получают облака от рабочих: рабочие кидают облака через жерло вулкана на середину горы, где расположены лаборатории. В лабораториях с облаками проводят исследования: «увеличивают плотность, уменьшают, заражатют вирусами и тд».</p>\n<p>Собственно правило заражённых облаков: «если зараженное облако съест или вдохнет человек естественно он заболеет и причем сильно, а избавится от болезни только выдохнув облако». Выдох облака обратно — единственный названный способ вылечиться.</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0078-S02", "MR-0078--naselenie"], "h": "<p>Расселение по горе привязано к социальному положению и задано прямо: «богатые люди живут внизу, ученые в середине, рабочие и бедные на верху». Соответственно, ловля облаков на мостиках-бышах приходится на верхнюю часть горы, лаборатории — на середину.</p>\n<p>Ловцов облаков Миколай называет нефителями. Владение родовой энергией названо у них как рабочий инструмент — именно ею перемещают пойманные облака.</p>\n<p>О народе в целом сказано: это «относительно изолированное поселение, трудно сказать к какому государству оно принадлежит, но и не тайное». Во внешней политике деревня не участвует, «однако сотрудничает по программе обмена с крупными университетами».</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0078-S03", "MR-0078--mesto-vo-vselennoy"], "h": "<p>Вселенная — 7 островов (объявлено). Заражённые облака — часть деревни-гиганта; в файле деревня-гигант указана как целое, частью которого является эта запись. Также запись связана с системой облаков деревни-гиганта.</p>\n<p>Внешние связи деревни ограничены программой обмена с крупными университетами; в остальном поселение изолировано и во внешней политике не участвует.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0078-S04", "MR-0078--kak-menyalsya-po-versiyam"], "h": "<p>Одна версия, одна дата.</p>\n<p><strong>Версия 1 — 2024-12-11 (id 269369–269371), окно w0066.</strong> Весь материал изложен Миколаем в одном сообщении: география горы и вулкана, историческая справка о кочевом племени, нефология, производственная цепочка облаков, социальное расселение, лабораторные эксперименты и правило заражённого облака. Сразу после Миколай оценивает состояние наработки: «да, не самая сильная и конкретно о расе почти не написал, но вот крч что есть», и добавляет: «если ты о гг чет придумал или придумаешь то пиши».</p>\n<p>Переработок, возражений или отклонённых вариантов в переписке нет — реакция Славы на этот кусок в файле не приведена.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0078-S05", "MR-0078--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Раса жителей деревни почти не описана — это отмечает сам Миколай: «конкретно о расе почти не написал».</li>\n<li>Эксперименты с облаками названы списком в общем виде («увеличивают плотность, уменьшают, заражатют вирусами и тд»), но не расписаны: «у них множеств всяких экспериментов с облаками но это я не продумал уже».</li>\n<li>Государственная принадлежность деревни не определена: «трудно сказать к какому государству оно принадлежит».</li>\n<li>Не сказано, какие именно вирусы используют и зачем учёные заражают облака — цель заражения в переписке не названа.</li>\n<li>Не сказано, как заражённое облако выдыхают обратно, сколько времени это занимает и что происходит с выдохнутым облаком дальше.</li>\n<li>Не сказано, что бывает, если больной не может выдохнуть облако.</li>\n<li>Родовая энергия названа как инструмент нефителей, но её устройство здесь не раскрыто.</li>\n<li>Главный герой для этого места на момент записи не придуман — Миколай просит написать, если у Славы что-то появится.</li>\n<li>Кольцо гор вокруг вулкана описано с оговоркой: функция схожа с кольцом, но по карте кольца не видно; окончательной формулировки нет.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0078--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0078--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-12-11</td>\n<td>269369–269371</td>\n<td>w0066</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0078-zarazhennye-oblaka.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0078--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0078.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
