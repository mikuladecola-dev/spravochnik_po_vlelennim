<script>const BASE="";const DOCNAME="Эльф с ветряным мечом";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0212-S01", "PS-0212--proishozhdenie"], "h": "<p>Персонаж появляется в прозаическом куске Славы (2025-03-03, id 297458–297463, окно w0078). Записан одной версией, других состояний в переписке нет.</p>\n<p>Откуда он взялся, кто он такой и как его зовут — не сказано. В тексте он не назван по имени ни разу; повествователь называет его «эльф», солдаты — никак, а апостол в финале уносит «труп неизвестного существа». Прозвище «эльф» держится на внешности (рост, худоба, вытянутые острые уши, оранжевые волосы, средневековый меч), а не на объявленной принадлежности к какому-либо народу.</p>\n<p>Действие идёт во время войны, на дороге между деревней Лихой и штабом; в отряде — капитан, старик, рыжеволосый и док, с ними подобранный мальчик из братской могилы. Эльф выходит на них из леса.</p>\n<p>Единственное, что он сообщает о себе, — что об апостолах он знает заранее и знает от старших:</p>\n<div class=\"q\"><p>«Что-то, не верится, что ты апостол, тот самый легендарный, тем кем наш пугали старший, тех кого боялись сильнейший и те кто могут убить даже существо, ты явно не заслуживаешь эту силу»</p></div>\n<p>Из этой фразы следует, что у него есть некое «наши старшие», которые пугали апостолами, и что апостол для него — фигура известная и страшная. Кто эти старшие и что за сообщество за ними стоит — в переписке не сказано.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0212-S02", "PS-0212--vneshnost"], "h": "<p>Описание дано в момент, когда отряду наконец удаётся его разглядеть:</p>\n<div class=\"q\"><p>«высокий по 2 метра ростом, худой словно ветка, но при этом всё ещё пугающий и изящный был одет словно средневековый одеяния по типу полуплатия и полудоспехов. Волосы были длинными и оранжевыми, странный цвет не так ли. Уши были вытянутыми и острыми. А глаз видно не было, их закрывала маска железная, не пойми как держашия.»</p></div>\n<p>По частям:</p>\n<ul>\n<li>рост около двух метров;</li>\n<li>«худой словно ветка», при этом «пугающий и изящный»;</li>\n<li>одежда — среднее между платьем и доспехом, «полуплатия и полудоспехов», средневекового типа;</li>\n<li>длинные оранжевые волосы, цвет отмечен как странный;</li>\n<li>вытянутые острые уши;</li>\n<li>вместо глаз — железная маска, способ крепления не объяснён, отмечено прямо: «не пойми как держашия».</li>\n</ul>\n<p>Оружие — меч «словно из средневековья». Мальчик, заметивший его в лесу первым, описывает его иначе, по-детски: «у него длинная железная палка».</p>\n<p>Под маской глаза всё-таки есть: в конце боя апостол проводит по ним «чем то острым» и они взрываются.</p>\n<p>Движение: из леса он выскакивает «быстрая, словно леопард»; в бою уклоняется «словно балерина, филигранно» от всех выпадов.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0212-S03", "PS-0212--harakter"], "h": "<p>Материала мало, весь — из одной сцены.</p>\n<p>Нападает первым и молча: выскакивает из леса и бьёт мечом в сердце старика, без предупреждения и без разговора. Смысла в этом нападении никто из отряда не понял: «Ни кто из отряда не понял смысла его слове».</p>\n<p>К противнику относится с пренебрежением. Меч, застрявший в мальчике, он прокручивает; мальчик воспринимает это именно как пренебрежение: «Зачем он прокручивает меч, который во мне? Зачем это пренебрежение?». Обращённая к мальчику реплика — отказ признавать в нём апостола и приговор: «ты явно не заслуживаешь эту силу».</p>\n<p>Уверенность держится на защите. Когда выясняется, что защита не работает, поведение меняется резко: «Эльф ещё не смог привыкнуть, что его ветренная защита бесполезно». Дальше — прямо названная паника: «Эльф в панике, начал махать мечем вызывая ветренный разрезы»; после потери глаз — «В панике он начал всё крушить ветром, который должен был защищать».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0212-S04", "PS-0212--sposobnosti"], "h": "<p><strong>Ветряные разрезы.</strong> Взмахом меча вызывает разрезы ветром, бьющие на расстоянии. Против апостола: «Большинство разрезов, не попали, а те кто попали не оставили и царапины, но попортили одежду».</p>\n<p><strong>Ветряная защита.</strong> Постоянная невидимая защита вокруг него. Работает не как стена, а как отклонение траектории:</p>\n<ul>\n<li>кровавые руки мальчика «словно под невидимой защитой, эти руки не попали по нему, они словно в момент прикосновения изменили свою траекторию»;</li>\n<li>пули солдат — «как и кровавый руки, их ней пули просто изменяли траекторию».</li>\n</ul>\n<p><strong>Хлопок.</strong> Отдельная от разрезов атака, названная тем же словом, каким мальчик называет выстрелы людей, но отмеченная как чужая: «послышался хлопок, хлопок не людей, а этого субьекта, из за этого хлопка в мальчике образовалась дырень в груди». След — «Идеальный круг, но не посередине». Рана от этого хлопка на мальчике не заживает, в отличие от ран от меча.</p>\n<p><strong>Ближний бой.</strong> Меч рубит кровавые руки мальчика без труда: «этот эльф легко их перерубил». Против апостола со штыком винтовки держится в размене долго: «вертелись они словно в танце, уклоняясь, парировая. Но так друг друга не раня».</p>\n<p><strong>Живучесть.</strong> Попадание в голову его не убивает: «Попал ровнехинка в голову эльфа, тот аш отлетел» — после чего он встаёт и бежит дальше. Затем получает ещё два попадания из трёх выстрелов, потом выстрел почти в упор — и продолжает бой.</p>", "r": []}, {"t": "Ограничения", "a": ["S05", "PS-0212-S05", "PS-0212--ogranicheniya"], "h": "<p>Ветряная защита не действует против апостола — ни против его выстрелов, ни против его штыка. Это названо в тексте прямо и подано как то, к чему эльф не успел привыкнуть.</p>\n<p>Ноги можно сковать: кровь с поля «сковала его ноги не давая сделать шаг», и он останавливается.</p>\n<p>Подсечку он не читает: «До момента пока плакса не поставил подсечку, в которую так удачно попал эльф».</p>\n<p>Глаза под маской уязвимы, и после их уничтожения он теряет способность направлять удары, хотя и продолжает чувствовать, что апостол не сдвинулся с места.</p>", "r": []}, {"t": "Связи с другими", "a": ["S06", "PS-0212-S06", "PS-0212--svyazi-s-drugimi"], "h": "<p><strong>Мальчик из братской могилы (Бессмертный).</strong> Первая жертва и первый противник. Эльф бьёт мечом в старика, мальчик отталкивает старика и принимает удар на себя. Дальше — бой: паучьи красные лапы из спины мальчика против уклонений эльфа, раны от меча на мальчике мгновенно заживают, кровавые руки отклоняются защитой. Эльф принимает мальчика за апостола («Что-то, не верится, что ты апостол») и ошибается: настоящий апостол в это время в лесу. Мальчик умирает не от эльфа, а сам — у него вытекает мозг; эльф идёт добить его, «намереваясь раздавить ему голову», и не успевает.</p>\n<p><strong>Апостол (мужчина со шрамами-слезами).</strong> Убийца эльфа. Стреляет издалека, из глубины леса, куда эльф замечает «Светящихся белым двух светлячков, глаза». Описан как одетый так же, как солдаты на дороге, но «более раскошно, что-ли, и элегантно», со шрамами «словно он плачет, две полосы вниз» и белыми блестящими глазами. В тексте назван «плакса». Именно против него ветряная защита не работает.</p>\n<p><strong>Отряд (капитан, старик, рыжеволосый, док).</strong> Свидетели. Их выстрелы отклоняются защитой. После боя апостол запрещает им говорить: «Вы ничего не видите и не слышали, а если попытаетесь кому-то рассказать, я первый об этом узнаю».</p>\n<p>Связь эльфа с какой-либо организацией, расой или стороной войны в переписке не названа.</p>", "r": []}, {"t": "Как менялся", "a": ["S07", "PS-0212-S07", "PS-0212--kak-menyalsya"], "h": "<p>Одна версия, 2025-03-03, окно w0078, сообщения 297458–297463. Персонаж введён, раскрыт и убит внутри одного куска прозы. Переработок, альтернативных вариантов и отклонённых версий в переписке нет.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S08", "PS-0212-S08", "PS-0212--chto-s-nim-stalo"], "h": "<p>Убит апостолом в той же сцене, в которой появился. Последовательность:</p>\n<ol>\n<li>Выстрел в голову с большого расстояния — отброшен, но встаёт.</li>\n<li>Бежит на светящиеся глаза в лесу; из трёх выстрелов два попадают, один валит дерево.</li>\n<li>Ещё один выстрел «чуть-ли не в упор».</li>\n<li>Ближний бой: меч против штыка винтовки, размен без ран.</li>\n<li>Подсечка, падение, выстрел в колено — «Дабы больше не скакал».</li>\n<li>Ветряные разрезы в панике — не достигают цели, портят апостолу одежду.</li>\n<li>По глазам проводят «чем то острым» и они взрываются.</li>\n<li>Крушит всё ветром вслепую; чувствует, что апостол не сдвинулся. Выстрел.</li>\n</ol>\n<p>Тело апостол забирает: «Из леса вышел мужчина тащья за собой труп неизвестного существа». Что он с трупом сделал дальше — в переписке не сказано.</p>", "r": []}, {"t": "Пробелы", "a": ["S09", "PS-0212-S09", "PS-0212--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имя не названо. Ни своего, ни родового.</li>\n<li>Откуда он пришёл и зачем напал на отряд — не объяснено. Мотив нападения на старика в тексте отсутствует.</li>\n<li>Кто такие «наши старшие», пугавшие апостолами, — не сказано. Народ, к которому он принадлежит, не назван.</li>\n<li>Слово «эльф» употребляет только повествователь; принадлежность к эльфам как виду нигде не объявлена.</li>\n<li>Как держится железная маска — отмечено самим текстом как непонятное: «не пойми как держашия».</li>\n<li>Природа ветряной защиты (врождённая, от меча, от снаряжения) не объяснена; почему она не действует против апостола — тоже.</li>\n<li>Природа «хлопка», оставившего в мальчике идеальный круг, не объяснена; связан ли он с ветром — не сказано.</li>\n<li>Была ли у него регенерация или он просто выдерживал попадания — не разобрано.</li>\n<li>Судьба трупа после того, как апостол его унёс, осталась нерешённой.</li>\n<li>Возвращений персонажа в переписке нет; продолжения линии эльфов после этой сцены не зафиксировано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0212--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0019.html\">Чужемирцы</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0019.html\">Чужемирцы</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0212--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-03-03</td>\n<td>297458–297463</td>\n<td>w0078</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0212-elf-s-vetryanym-mechom.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0212--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0212.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0212-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0212/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — убийца. Апостол со шрамами-слезами в этой сцене описан подробнее многих: одежда «более раскошно, что-ли, и элегантно», белые блестящие глаза-светлячки в лесу, прозвище «плакса». И ни одной связи из статьи наружу. При этом в справочнике стоят <code>PS-0271</code> «Александр Титовский» (статья есть, база 59 077, ноль ссылок) и <code>PS-0272</code> «Шрамы-слёзы на лице Александра» (15 938, ноль ссылок) — те же две полосы по щекам и глазам, «словно я недавно плакал». Две записи, одна примета, ноль ссылок в обе стороны. Пока это не сведено или не разведено явным «это разные люди», самая крупная фигура сцены висит без опознания.</p>\n<p>Вторая: <code>PS-0218</code> «Эльф (чужемирец)» (база 5 563). Разговор 2025-03-10, из которого он собран, — это разбор ровно вот этой прозы 2025-03-03. Обе записи в группе <code>GR-0019</code>, обе про эльфа у деревни Лихой, связи между ними нет. Один это персонаж или два — не решено, и решать надо до того, как на любую из них начнут ссылаться.</p>\n<p>Третья, общая: <code>SL-0089</code> «Список категорий сил» — четыре ссылки, статьи нет, база 1 753, и <code>SL-0054</code> «Список 12 апостолов» — три ссылки, статьи нет, база 234 052. Обе нужны здесь напрямую: первая говорит, что такое чужемирец как разряд, вторая — кто такой апостол, против которого не работает ветряная защита.</p>\n<h3>С чего начать</h3>\n<p>За самой сценой в архив идти незачем: она целиком лежит в базе как <code>PR-0056</code> «Где я? Кто я?» (40 517), 2025-03-03, id 297458–297463, окно w0078 — те же шесть сообщений, из которых собрана статья. Соседние куски того же текста растащены по <code>PS-0211</code> «Мальчик из братской могилы (Бессмертный)» (58 295), <code>PS-0219</code> «Отряд: Старик, Рыжий, Доктор, Капитан» (7 997), <code>MN-0015</code> «Деревня Лихая» (32 900) и <code>SP-0191</code> «Способности мальчика из братской могилы» (41 717). Всё, что нужно про бой, разложено по этим пяти записям.</p>\n<p>В архив имеет смысл идти за двумя вещами. За разбором этой сцены — 2025-03-10, окно w0079, id 300761–300793: там Слава задним числом объясняет, кто в этой истории что сделал. И за апостолом — 2025-05-19, окно w0097, id 328115 и вокруг: оттуда собраны <code>PS-0271</code> и <code>PS-0272</code>. Между 2025-03-03 и 2025-05-19 два с половиной месяца, и вопрос, тот ли это человек, решается где-то в этом промежутке или не решается вовсе.</p>\n<h3>Как развивалось</h3>\n<p>Нетипично для этого справочника: заявили сразу целиком. 2025-03-03, шесть сообщений подряд — внешность, движение, три способности, ограничения, паника, смерть. Никакой стадии «сначала идея, потом уточнения» нет, персонаж пришёл готовым и в том же тексте кончился. Ограничили через неделю и задним числом: 2025-03-10 Слава снимает с эльфа всё, что успел приписать ему Миколай, — деревню, пробуждение способностей героя, роль монстра. Забыли сразу после: возвратов нет, продолжения эльфийской линии нет, судьба унесённого трупа не обсуждалась ни разу. Вернулись — нет, ни в одном окне.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для мальчика правило исключения названо точно: раны от меча заживают мгновенно, а дыра от «хлопка» не заживает. То есть у его регенерации есть прямо обозначенная дырка, и через неё держится вся сцена. Для живучести эльфа такого правила нет. Он выдерживает попадание в голову, потом два из трёх выстрелов, потом выстрел почти в упор — и умирает от выстрела в самом конце. Что именно его берёт и почему берёт только на восьмом шаге, нигде не сказано; сама статья честно отмечает, что не разобрано даже, регенерация это или просто прочность. Для соседнего бессмертия исключение проговорено, для этого — нет, хотя они меряются в одной сцене.</p>\n<h3>Отклик</h3>\n<p>Это лучший кусок из всех четырёх, и по конкретным местам видно почему. Ветряная защита описана не как стена, а как изменение траектории — кровавые руки «в момент прикосновения изменили свою траекторию», пули так же; это гораздо неприятнее обычного щита, потому что непонятно, где граница. Дыра от хлопка — «идеальный круг, но не посередине»: вот это «не посередине» и делает картинку. Маска «не пойми как держашия» — автор прямым текстом говорит, что не знает, как крепится маска его собственного существа, и оставляет так; получается загадка вместо недоделки. И финальный разворот: то, что защищало, он в панике начинает крушить вслепую — «начал всё крушить ветром, который должен был защищать». Ещё зацепило, что эльф всю сцену ошибается: он уверен, что дерётся с апостолом, презирает его за недостойность силы, а апостол в это время смотрит на него из леса двумя белыми точками. Персонаж умирает, так и не поняв, с кем воевал.</p></div>", "r": []}];</script>
