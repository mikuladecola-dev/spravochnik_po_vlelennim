<script>const BASE="";const DOCNAME="Трубы сферы";
const LEAD="";
const CH=[{"t": "Где находится — в каком мире и в каком его месте", "a": ["S01", "MN-0001-S01", "MN-0001--gde-nahoditsya"], "h": "<p>Вселенная «7 островов» (по дате объявления). Трубы принадлежат сфере на дне океана: «На дне океана будет сфера с множество трубами», «Черными трубами» (2024-07-04, id 196820–196821).</p>\n<p>Часть труб направлена внутрь и служит выходом из сферы в саму воду. Часть идёт вверх, от сферы наружу, «типо как дым» (id 196826). Точка входа для людей уточнена в последней версии: дым, нарисованный сверху сферы, «на деле идёт от его стенки и туда люди идут», а наружу идут через порт (id 196956).</p>\n<p>Варианты имени, встречающиеся в переписке: «дым», «каналы», «чёрные трубы».</p>", "r": []}, {"t": "Что собой представляет", "a": ["S02", "MN-0001-S02", "MN-0001--chto-soboy-predstavlyaet"], "h": "<p>Система каналов, связывающая внутренность сферы с океаном и с поверхностью. Сколько видов труб и что через какую идёт — центральный предмет спора всего окна w0043.</p>\n<p><strong>Происхождение идеи.</strong> Задача поставлена Славой: «Тогда как сделать чтобы они плавно выходили через барьер», «Из барьера в воду» (id 196758, 196761). Ответ: «ну можно реализовать специальные каналы», «ну тобиж, не напрямую в воду, а как бы в барьере будут подобия труб», «или выходить можно через дно» (id 196762, 196768–196769). Слава переформулирует: «Трубы где ты проходишь через неё давления плавно поднимается» (id 196770). Подтверждение: «наружу естественно по каналам», «да, получается так» (id 196771, 196773).</p>\n<p><strong>Трубы, идущие внутрь.</strong> «ну про те трубы для выхода в воду / они внутрь направлены / то есть вода внутри сферы удерживается» (id 196823–196825). «те труды что внутри, они идут на выход в воду / с нормальным переходом давления» (id 196835–196836).</p>\n<p><strong>Трубы, идущие вверх («дым»).</strong> «а наружу типо как дым / идут каналы» (id 196826–196827). «а дым идущий наверх, таких много / это сплошнве большие каналы / для фильтрации и переноса воздуха», «и транспортировки людей, ресурсов» (id 196837–196842).</p>\n<p><strong>Дым — это тьма.</strong> Ключевое уточнение: «это буквально тьма», «как внутри барьера» (id 196863, 196865). «дым тут это тоже самое что и тьма / просто выглядит так / это уже барьер / от воды / он сам фильтрует че каво» (id 196886–196890).</p>\n<p>На прямой вопрос «Барьер это дым ?» ответ идёт в три реплики подряд: «нет», «да», «но концентрированный крч» (id 196893–196895). Разница между барьером и трубами формулируется так: барьер — «он его удерживает в форме», а в трубах «он просто его выделяет, там форма не требуется / лишь курс / иначе он сдохнет» (id 196896–196899). Итог: «это очень сложно» (id 196900).</p>\n<p><strong>Что происходит с газом.</strong> «ну так сама тьма поглощает газ», «в трубах нету» (id 196877–196878). На вопрос «И куда тьма девать газ» — «в сферу / и из неё» (id 196881–196882).</p>\n<p><strong>Взаимодействие.</strong> «взаимодействие газов и людей по разному происходят» (id 196959). Как именно — не расписано.</p>", "r": []}, {"t": "Что с ним связано — предметы, механики, силы", "a": ["S03", "MN-0001-S03", "MN-0001--chto-s-nim-svyazano"], "h": "<ul>\n<li><strong>Остров на дне океана (сфера)</strong> — трубы выходят из неё.</li>\n<li><strong>Барьер</strong> — «концентрированная» тьма, которую нуар удерживает в форме; трубы — та же тьма, но меньшей концентрации, требующая только курса.</li>\n<li><strong>Тьма</strong> — вещество труб и барьера; поглощает газ, фильтрует воздух.</li>\n<li><strong>Нуар</strong> — удерживает тьму в форме барьера; в трубах форма не требуется, «иначе он сдохнет» (id 196896–196899).</li>\n<li><strong>Порт</strong> — через него люди идут наружу (id 196956).</li>\n</ul>", "r": []}, {"t": "Персонажи и события — кто с ним связан и что там происходило", "a": ["S04", "MN-0001-S04", "MN-0001--personazhi-i-sobytiya"], "h": "<p>Отдельного персонажа у труб нет; названы нуар (как тот, кто удерживает тьму) и жители сферы.</p>\n<p>Из механики выхода в воду сразу выведено следствие для населения: «ну ебать они качки там будут все / каждый с тренировками как для космонавта / ну детей там к хуям разорвёт / так что родители будут за этим следить» (2024-07-04, id 196774–196777).</p>", "r": []}, {"t": "Как менялся по версиям — по датам", "a": ["S05", "MN-0001-S05", "MN-0001--kak-menyalsya-po-versiyam"], "h": "<p>Вся разработка укладывается в один вечер (2024-07-04, окно w0043), шесть состояний.</p>\n<p><strong>Версия 1 — 2024-07-04 (id 196758–196777).</strong> Первое появление. Не напрямую в воду, а «подобия труб» в самом барьере, либо выход через дно; внутри труб давление поднимается плавно. Сразу же — вывод про тренированность жителей и опасность для детей.</p>\n<p><strong>Версия 2 — 2024-07-04 (id 196820–196842).</strong> Разделение на два направления: трубы, направленные внутрь, — выход в океан с нормальным переходом давления; трубы, идущие вверх «как дым», — сплошные большие каналы для фильтрации и переноса воздуха, а также транспортировки людей и ресурсов. Слава не понимает объяснение («Я не понял», id 196831), Миколай рисует схему («ща / нарисую», id 196832–196833).</p>\n<p><strong>Версия 3 — 2024-07-04 (id 196858–196900).</strong> Уточнение природы дыма. Слава предлагает разделение по назначению: «Это трубы для переноса углекислого газа и кислорода и также дыма от костров», «Нужны ещё отдельные трубы для людей и ресурсов», «Кислород в сферу / Углекислый газ и дым в небо» (id 196860, 196862, 196883). Миколай отвечает, что отдельные трубы не нужны: дым и есть тьма, барьер сам фильтрует, разница между барьером и трубами — только в концентрации и в том, требуется ли форма.</p>\n<p><strong>Версия 4 — 2024-07-04 (id 196909–196921).</strong> Вариант Славы, изложенный заново и списком: «Есть сфера в на дне океана из него выходит четыре вида трубы / 1) для поглощения кислорода / 2 для выкидывания углекислого газа / 3 для людей / 4 для выхода в океан» (id 196914). Требование к соавтору: «Ну для начала объясни свою теорию / Так легко как я / Без сложности / Основу» (id 196917–196920).</p>\n<p><strong>Версия 5 — 2024-07-04 (id 196922).</strong> Вариант Миколая в ответ, дословно:</p>\n<div class=\"q\"><p>«так есть 2 вида труб:</p>\n<p>1) внутрь для выхода в сам океан из сферы</p>\n<p>2) из чистой, хаотичной тьмы, она:<br>а) сосёт воздух и фильтрует его<br>б) позволяет ресурсам и людям перемещаться между сферой и внешним миром»</p></div>\n<p><strong>Версия 6 — 2024-07-04 (id 196955–196959).</strong> Как люди попадают в трубу. Вопрос Славы: «А как люди попадают в трубу у тебя» (id 196955). Ответ: «ну там я нарисовал то что этот дым сверху сферы, на деле идёт от его стенки и туда люди идут, а если про наружу, туда идут через порт» (id 196956). Плюс: «взаимодействие газов и людей по разному происходят».</p>", "r": []}, {"t": "Отклонённые и конкурирующие варианты", "a": ["S06", "MN-0001-S06", "MN-0001--otklonennye-i-konkuriruyuschie-varianty"], "h": "<ul>\n<li><strong>Четыре вида труб (Слава, id 196914)</strong> — по назначению: поглощение кислорода, выброс углекислого газа, люди, выход в океан. Предложен как упрощение.</li>\n<li><strong>Отдельные трубы для людей и ресурсов (Слава, id 196862, 196866)</strong> — Миколай отказывает: «не наружу океана», «хуй те», «ну так блять, / это и есть трубы» (id 196868–196872).</li>\n<li><strong>Кислород в сферу, углекислый газ и дым в небо (Слава, id 196883)</strong> — снято тем же аргументом: «дым тут это тоже самое что и тьма», барьер «сам фильтрует че каво».</li>\n<li><strong>Два вида труб (Миколай, id 196922)</strong> — контрвариант к четырём.</li>\n<li><strong>Выход через дно (id 196769)</strong> — упомянут как альтернатива трубам в барьере, дальше не развит.</li>\n</ul>\n<p>Какой из вариантов принят как окончательный, в окне не зафиксировано.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "MN-0001-S07", "MN-0001--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Спор о числе видов труб не закрыт: четыре (Слава) против двух (Миколай), решения в окне нет.</li>\n<li>Что означает ответ «нет» / «да» / «но концентрированный крч» на вопрос «Барьер это дым ?» — однозначно не сформулировано.</li>\n<li>«взаимодействие газов и людей по разному происходят» (id 196959) — чем именно различается, не сказано.</li>\n<li>Устройство порта не описано.</li>\n<li>Что произойдёт, если нуару придётся держать форму в трубах («иначе он сдохнет»), — не развёрнуто.</li>\n<li>Сложность признана самим автором: «это очень сложно» (id 196900).</li>\n<li>Разговор опирается на рисунок («ща / нарисую», id 196832–196833; «как тут», id 196957), содержимого рисунка в тексте нет.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MN-0001--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0033.html\">Рыба-люди</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MN-0001--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-04</td>\n<td>196758–196777</td>\n<td>w0043</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-04</td>\n<td>196820–196842</td>\n<td>w0043</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-04</td>\n<td>196858–196900</td>\n<td>w0043</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-04</td>\n<td>196909–196921</td>\n<td>w0043</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-04</td>\n<td>196922–196922</td>\n<td>w0043</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-04</td>\n<td>196955–196959</td>\n<td>w0043</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/monumenty/MN-0001-truby-sfery.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MN-0001--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MN-0001.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
