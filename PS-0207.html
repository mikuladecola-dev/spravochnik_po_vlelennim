<script>const BASE="";const DOCNAME="Серп";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0207-S01", "PS-0207--proishozhdenie"], "h": "<p>Серп появляется в переписке один раз — 2025-02-25 (окно w0077, сообщения 295508–295512). Материал чужой: Миколай пересылает кусок из другого чата, и в самом файле это помечено как «Чужой материал, переслан из другого чата». Речь идёт о вселенной, которая по отношению к «Апостолу» названа чужой: Серп — «местный супергерой чужой вселенной».</p>\n<p>Он назван в перечислении персонажей, которые «пожалели её» — сбежавшую дочь Альгиза. Рядом с ним в этом перечислении стоит Земова (<a href=\"PS-0208.html\">Земова</a>): «среди них была Земова – тип моя основная, за которую я ролила... Ну ещё Серп – местный супергерой».</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · С чего начать — не материал авторов</b>\n<p>В базе, не в архиве. Диапазоны соседей перекрываются и обрываются в разных местах: <code>PS-0206</code> — 295503–295510, <code>PS-0208</code> — 295507–295510, эта статья — 295508–295512, <code>PS-0209</code> — 295508–295522. Хвост 295513–295522 есть только у Серафимы, и там лежит то, чего здесь нет: происхождение («Её родил кот»), вид (кошкодевочка), статус любимого персонажа, упоминание рисунков. То есть анонс «Ты щас сдохнешь» частично уже отработан — в соседней записи. Первым делом сверить <code>PS-0209</code> с этой, а не искать заново.</p></div>", "r": [["Земова", "PS-0208.html"]]}, {"t": "Способности", "a": ["S02", "PS-0207-S02", "PS-0207--sposobnosti"], "h": "<p>Прямо о способностях не сказано ничего. Названо только звание — «местный супергерой». Что именно он умеет, в переписке не сказано.</p>", "r": []}, {"t": "Связи с другими", "a": ["S03", "PS-0207-S03", "PS-0207--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Серафима</strong> — приёмная дочь Серпа. Отмечено дважды: «ОООО У СЕРПА ТОЖЕ ПРИЁМНАЯ ДОЧЬ». Слово «тоже» ставит его в параллель с Альгизом, у которого приёмная дочь тоже есть.</li>\n<li>Про Серафиму сказано: «Только там пиздец» и «История у неё тяжёлая». Чем именно тяжёлая — в переписке не раскрыто, сказано только «Ты щас сдохнешь», то есть продолжение анонсировано, но в этом окне не дано.</li>\n<li><strong>Альгиз</strong> — прямой связи между Серпом и Альгизом не названо; они соотнесены только через параллель приёмных дочерей и через сцену, где персонажи пожалели сбежавшую дочь Альгиза.</li>\n<li><strong>Земова</strong> (<a href=\"PS-0208.html\">Земова</a>) — назван с ней в одном перечислении персонажей, пожалевших сбежавшую девочку. Характер их отношений не описан.</li>\n</ul>", "r": [["Земова", "PS-0208.html"]]}, {"t": "Как менялся — состояния по датам", "a": ["S04", "PS-0207-S04", "PS-0207--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2025-02-25</strong> (окно w0077, сообщения 295508–295512). Единственное состояние. Названы: роль супергероя, факт приёмной дочери Серафимы, оценка её истории как тяжёлой. Больше версий нет, задумка не менялась.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "PS-0207-S05", "PS-0207--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Внешность не описана.</li>\n<li>Характер не описан.</li>\n<li>Способности не названы, кроме статуса «местный супергерой».</li>\n<li>Обещанная тяжёлая история Серафимы («Ты щас сдохнешь») в переписке не изложена — осталось нерешённым.</li>\n<li>Не сказано, как Серп относится к Альгизу и к его сбежавшей дочери за пределами того, что «персонажи пожалели её».</li>\n<li>Материал чужой, переслан из другого чата; на что он повлиял внутри «Апостола», в переписке не сказано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0207--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0208.html\">Земова</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0208.html\">Земова</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0207--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-02-25</td>\n<td>295508–295512</td>\n<td>w0077</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0207-serp.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0207--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0207.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0207-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0207/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Самое дорогое здесь — вселенная, из которой Серп. Он прямо назван «местный супергерой чужой вселенной», а в шапке у него стоит «Апостол (по дате объявления)». Отдельной записи под эту чужую вселенную не заведено вообще: ни имени, ни сущности, ни базы. При этом на неё завязаны четыре персонажа разом — <code>PS-0206</code>, <code>PS-0207</code>, <code>PS-0208</code>, <code>PS-0209</code>, весь пересланный кусок. Ближайшее, что под такие случаи в базе есть, — <code>VS-0013</code> «вне вселенной» (статьи нет, база 15 911), но этот материал туда не отнесён.</p>\n<p>Второе по цене — не материал, а связи. Из четырёх статей одного двадцатисообщенного разговора двусторонняя связь стоит ровно одна: <code>PS-0207</code> ↔ <code>PS-0208</code>. <code>PS-0209</code> Серафима (статья есть, база 2 914) — ноль ссылок и вообще нет раздела «Связи», хотя она приёмная дочь именно Серпа. <code>PS-0206</code> Приёмная дочь Альгиза (2 192) — ноль ссылок. <code>PS-0204</code> Альгиз (7 314) — ноль ссылок, при том что вся здешняя параллель («ТОЖЕ ПРИЁМНАЯ ДОЧЬ») держится на нём одном.</p>\n<h3>С чего начать</h3>\n<p>В базе, не в архиве. Диапазоны соседей перекрываются и обрываются в разных местах: <code>PS-0206</code> — 295503–295510, <code>PS-0208</code> — 295507–295510, эта статья — 295508–295512, <code>PS-0209</code> — 295508–295522. Хвост 295513–295522 есть только у Серафимы, и там лежит то, чего здесь нет: происхождение («Её родил кот»), вид (кошкодевочка), статус любимого персонажа, упоминание рисунков. То есть анонс «Ты щас сдохнешь» частично уже отработан — в соседней записи. Первым делом сверить <code>PS-0209</code> с этой, а не искать заново.</p>\n<p>Если после сверки «тяжёлой истории» всё равно нет — тогда в архив: 2025-02-25, окно w0077, сразу за 295522, вокруг слов «а сейчас отправлю рисунки». Ориентир не имя Серпа, а пересылка из другого чата — она и границы куска задаёт.</p>\n<h3>Как развивалось</h3>\n<p>Один день, пять сообщений. Персонаж возникает не как задумка, а попутно — внутри чужого пересказа, приложением к сбежавшей дочери Альгиза. В том же сообщении заявлено продолжение («Ты щас сдохнешь», «Только там пиздец») — и в том же разговоре внимание уходит на Серафиму, у которой хвост длиннее на десять сообщений. К Серпу не возвращались: дата начала равна дате конца, версия одна.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для Перага (<code>PS-0199</code>) разговор, который идёт не изнутри истории, а о ней, получил отдельную пометку вселенной — «вне вселенной», версия 6 от 2025-03-20. Здесь материал прямо помечен как чужой и пересланный из другого чата, а сам персонаж прямо назван из чужой вселенной — и вселенная всё равно проставлена «Апостол (по дате объявления)». Для одного рода «это не наш материал» правило отнесения названо, для другого такого же — нет.</p>\n<h3>Отклик</h3>\n<p>Зацепило одно слово — «тоже». «ОООО У СЕРПА ТОЖЕ ПРИЁМНАЯ ДОЧЬ» — это реакция читателя, а не автора: человек ловит рифму между чужим персонажем из пятого класса и своим серийным убийцей, и на секунду чужая вселенная становится соседней, а не посторонней. Дальше ничего не происходит, рифма не разработана, но сама реакция живая и точная. Сам Серп при этом состоит из трёх слов и одной дочери: он существует только как отражение — держится не на себе, а на том, что у кого-то ещё есть такая же слабость.</p></div>", "r": []}];</script>
