<script>const BASE="";const DOCNAME="Банда Графа";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0071-S01", "GR-0071--chto-eto"], "h": "<p>Банда, принадлежащая апостолу Графу в мире Оэм (он же Оам). Заявлена одной строкой при представлении самого Графа (2025-12-06, id 393298): «У него своя банда ( просто для развлечения) грубо говоря он король преступного мира». Из этой фразы известно всё, что о банде известно: она существует, она его собственная, держит он её «просто для развлечения», и положение самого Графа в преступном мире описано как королевское.</p>\n<p>Как самостоятельная сущность банда в переписке не разрабатывалась: у неё нет названия, состава, территории, занятия, врагов и внутреннего устройства. Это скорее свойство персонажа Графа, чем отдельно проработанная организация. Ни в одном другом сообщении — включая подробный разбор Графа 2026-06-02 — банда больше не упоминается.</p>\n<p>Отдельно стоит отметить противоречие, которое в переписке не снимается. Апостолы объявлены стороной добра (2025-12-06, id 393293): «Вообще апостолы на стороне добра. Ну будут устраивать геноциды и теракты. Плюсом они высокомерны, хотя прямо этого не показывать. Ну они как бы с рождения лучшей людей, поэтому в полне ясно почему они высокомерные». Позже Граф вводится ещё и как один из шести столпов героев (2026-06-02, id 487002, 487004): «Вот Граф один из столпов героев». Как «король преступного мира» совмещается с апостолом на стороне добра и со столпом героев — в переписке не объяснено.</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0071-S02", "GR-0071--sostav"], "h": "<ul>\n<li><a href=\"PS-0323.html\">Граф</a> — Граф, апостол, владелец банды.</li>\n</ul>\n<p>Поимённого состава банды нет. Кроме самого Графа, ни один участник не назван — ни числом, ни именем, ни ролью.</p>\n<p>Что известно о единственном названном участнике:</p>\n<p>Введён 2025-12-06 (id 393298) как второй из трёх сильнейших: «2 это апостол Граф (опять отсылка на семь островов). Он высокомерный и беспечный апостол, что веселиться». Там же — сила и скорость: «Достаточно силён, чтобы разнести гору, плюсом он быстрейший апостол ( хотя этот титул носит другой Апостол. Ну по факту он быстрее)». Кто носит титул быстрейшего апостола формально — не названо. Тогда же сказано, что «в будущем у него появиться девушка для стабилизации его нарцисцеческого характера» (2025-12-06, id 393299).</p>\n<p>Позднейшая правка характера (2026-06-02, id 487021): «Граф высокомерный и часто раздражённые из-за боли в голове». Головная боль связана с дефектом его способности (см. ниже). Также подтверждено, что «сильнейший апостолы это Граф и Палач» (2026-06-02, id 487176).</p>\n<p>Способность Графа — Власть. Первое описание (2025-12-06, id 393298): «Его способность власть. Контроль всего, что есть в определенном радиусе». Радиус и ограничения в этом окне не заданы.</p>\n<p>Развёрнутое описание дано 2026-06-02 (id 487011–487016), с оговоркой, что раньше способность «толком не описал»: «Ты наверное думал что это просто телекинез. И сейчас я тебе всё объясню». Суть: «под властью имеется виду область, в который Граф всё контролирует. Абсолютно все». Дефект — информационная перегрузка: «Он также получает всю информацию. Информацию до атома, до мельчайшего движения он получает абсолютно всю информацию о данное области. Представляешь как это напрягает мозг. Поэтому он не способен использовать власть очень долго. Потому что у него просто мозги расплавиться». Из-за этого дефекта существуют три способа применения:</p>\n<ol>\n<li>Область около 10 метров (2026-06-02, id 487013): «Просто покрыть область властью. Область примерно 10 метров. &lt;...&gt; В данное области он абсолютно всё контролирует. Даже температуру. Ну и он также получает дохрена информацие. Данные способ удерживать очень сложно».</li>\n<li>Плёнка поверх собственного тела (2026-06-02, id 487014): «просто покрыть властью своё тело плёнкой. То бишь он получает всю информацию о своём теле. И так же поверх получает физическая увеличения силы и полета». Информации поступает меньше, силы много, но способ «является плох именно в защите. Потому что ты просто можешь не успеть защититься если атака будет быстрое». Для сравнения: с областью в 10 метров «ты успеш остановить атаку. Схватить человека не давая ему вообще двигаться. Или просто уклониться от атаки».</li>\n<li>Отделённая область (2026-06-02, id 487015) — «просто дополнение которое используется в комбинации с первым или со вторым»: «Создать область власти 1 метр. Но на расстоянии от себя на 1 км. И контролировать всё что находиться в этой власти». Используется только в комбинации, потому что «сам Граф в это время останется беззащитным».</li>\n</ol>\n<p>Ограничение по условностям мира (2026-06-02, id 487170): «У сверхлюдей есть как бы плёнка что защищает от воздействия других способности. Чем сильнее сверхчеловек тем больше плёнка. Поэтому граф против особо сильных не может раздавить их просто или остановить сердца». Про плёнку добавлено (2026-06-02, id 487174), что она «есть у всех и развивается она с возрастом. То есть с психическом росте. Ну это у обычных людей. У сверхлюдей способные её чувствовать. И поэтому они прокачивають её с помощью тренировок, а не психического роста».</p>", "r": [["Граф", "PS-0323.html"]]}, {"t": "Иерархия", "a": ["S03", "GR-0071-S03", "GR-0071--ierarhiya"], "h": "<p>Единственное, что сказано об устройстве: банда — Графа, и она «своя», то есть он ей владеет. Его положение в преступном мире названо королевским: «грубо говоря он король преступного мира» (2025-12-06, id 393298). Заместителей, приближённых, ярусов, структуры подчинения в переписке нет.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S04", "GR-0071-S04", "GR-0071--otnosheniya-s-drugimi-gruppami"], "h": "<p>Прямых связей банды с другими группами в переписке не названо ни одной.</p>\n<p>Рядом, в перечне рас и организаций мира Оэм (2025-12-06, id 393287), названа отдельная преступная организация: «Проротой каменный челике. Владеют преступное организацию. Некий союз с апостолами». Эта организация принадлежит не Графу, и является ли она его бандой, входит ли в неё, конкурирует ли с ней — в переписке не сказано. Упомянутый там же «некий союз с апостолами» с бандой Графа тоже нигде не связан.</p>\n<p>Также в перечне организаций мира есть «Правителская организации по контролю всех этих» (2025-12-06, id 393287) — её отношения с бандой не описаны.</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S05", "GR-0071-S05", "GR-0071--kak-menyalas"], "h": "<p><strong>2025-12-06 (id 393298).</strong> Единственное упоминание банды. Заявлены три вещи: банда есть, она у Графа, она «просто для развлечения», а сам Граф — «король преступного мира».</p>\n<p><strong>2025-12-06 (id 393478–393480).</strong> В том же окне сказано, что судьба Графа уже определена: «Вообще у Агрегат, Графа и Защитника. Судьба предрешена. Ну я то есть придумал их ней путь». Сам путь в переписке не изложен. Следующими сообщениями идёт: «Это босс будет хитрым и уверенным. Хотя обычные человек. Попытается наладить связь с Имитам» и «Так как для правительства. Представитель Апостоловы именно Имит». К кому относится слово «босс» и связан ли он с бандой — из переписки не ясно.</p>\n<p><strong>2026-02-06 — 2026-02-07 (id 429348–429816).</strong> Попытка собрать документ по ОЭМ через нейросеть. Банда Графа в собранном материале не фигурирует; сам Слава отмечает по итогу: «Че то мало информация оказывается о ОЭМ» (2026-02-06, id 429386), Миколай отвечает, что «не все чет кинул видимо».</p>\n<p><strong>2026-06-02 (id 487002–487005, 487010–487016, 487021, 487170–487176).</strong> Крупная переработка Графа: он вводится в шесть столпов героев, подробно расписывается способность Власть с тремя способами применения и дефектом, уточняется характер, добавляется ограничение плёнкой сверхлюдей, подтверждается статус одного из двух сильнейших апостолов. Банда в этом окне не упоминается ни разу. Отменена она или просто не затронута — не сказано.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "GR-0071-S06", "GR-0071--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет. Ни один участник банды, кроме самого Графа, не назван.</li>\n<li>Численность не названа.</li>\n<li>Названия у банды нет.</li>\n<li>Чем банда занимается — не сказано. Единственная характеристика деятельности — «просто для развлечения».</li>\n<li>Территория, база, город не названы.</li>\n<li>Внутренней структуры нет: заместители, роли, ярусы подчинения не описаны.</li>\n<li>Связь с преступной организацией «Проротых каменных челик» (2025-12-06, id 393287) не установлена, хотя обе организации существуют в одном мире.</li>\n<li>Не объяснено, как «король преступного мира» совмещается с тем, что апостолы — сторона добра, а Граф ещё и один из шести столпов героев.</li>\n<li>«Судьба предрешена» (2025-12-06, id 393478) — сам придуманный путь Графа в переписке не изложен.</li>\n<li>Девушка «для стабилизации его нарцисцеческого характера» (2025-12-06, id 393299) не введена и с бандой никак не связана.</li>\n<li>После 2025-12-06 банда не упоминается; осталось нерешённым, действует ли она в поздней версии мира.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0071--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0323.html\">Граф</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0071--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0071.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0071-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0071/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дыра, которая блокирует эту статью, лежит не в банде и вообще не в Оам. Весь поздний слой Графа — 2026-06-02, id 487002–487176 — отнесён в базе к безымянной вселенной и потому не имеет ни одной статьи. Числа: <code>PS-0366</code> «Шесть столпов героев» — 1 ссылка, статьи нет, 6 416 знаков; <code>SP-0272</code> «Плёнка сверхлюдей» — 1 ссылка, статьи нет, 3 859; <code>PS-0367</code> «Шесть столпов злодеев» — 1 ссылка, статьи нет, 3 270; <code>MR-0193</code> «Вселенная героев и злодеев» — статьи нет, 12 986; <code>IS-0090</code> «Инцидент с вирусом Нимба» — статьи нет, 5 635. То есть обе вещи, которыми статья описывает Графа в его нынешнем виде — столпы героев и плёнка, ограничивающая Власть, — ссылаются в пустоту. Сам Граф при этом описан: <code>PS-0323</code> — 4 ссылки, 7 851 знак базы, <code>SP-0255</code> «Власть» — 1 ссылка, 12 184. Персонаж есть, рамки, в которую его поставили, нет.</p>\n<p>Причина названа в разборе базы прямо: вселенная объявлена 2026-06-02 репликой «Короче вселенная простая» (id 486999) и названия не получила; Граф помечен как переносной персонаж. Слово «Оам» в этом отрезке встречается, но как имя энергии (<code>SP-0277</code>, <code>MR-0198</code>), а не вселенной, — и это в базе оговорено отдельно. Пока вселенная безымянна, около сорока её кодов не попадут в реестр, и вопрос про банду — действует она в поздней версии мира или нет — просто не к чему приложить.</p>\n<p>Второе, дешевле и ближе: <code>MR-0169</code> «Пророки каменные» — 4 ссылки, 8 328 знаков. Каменный человек владеет преступной организацией и состоит в «неком союзе с апостолами». Граф — апостол и «король преступного мира». Две преступные структуры заведены соседними строками одного перечня (id 393287), и связь между ними не установлена ни в одну сторону.</p>\n<h3>С чего начать</h3>\n<p>Сначала архив, и точка узкая: 2026-06-02, id 486999–487005. Надо увидеть само объявление вселенной — спрашивали ли про название, отвечал ли кто-нибудь. От этого зависит судьба всего блока 2026-06-02 — 2026-06-09, а не одной статьи.</p>\n<p>Потом база, три записи, которых статья не касается.</p>\n<ul>\n<li><code>SL-0125</code> «Список нерешённых вопросов по миру Оэм» — 1 ссылка, статьи нет, 3 899 знаков, дата 2025-12-06, то есть тот же день, когда заявлена банда. Слава там сам пишет, чего по миру не хватает.</li>\n<li><code>SL-0126</code> «Документ по материалу на codepen» — 1 ссылка, статьи нет, 2 974 знака, дата 2025-12-07, назавтра после единственного упоминания банды: Миколай в тот день собирал по их материалу страницу и обещал доделать.</li>\n<li><code>SL-0113</code> «Сайт-вики по вселенной (codepen)» — 1 ссылка, статьи нет, 6 843 знака. Это та же линия документа, которую в w0115 пытались собрать через нейросеть и про которую сказано «не все чет кинул видимо». Если формулировка про банду где-то дожила сверх одной фразы, то там.</li>\n</ul>\n<h3>Как развивалось</h3>\n<p>2025-12-06 (id 393298) — заявили: банда есть, она Графа, держит он её «просто для развлечения», сам он «король преступного мира». В том же окне (393293) ограничили сверху, причём не банду, а её владельца: апостолы — сторона добра. Там же (393478) сказали, что путь Графа уже придуман, но не изложили. 2026-02-06 — 2026-02-07 (w0115) — при сборке документа по Оэм банда в материал не попала. 2026-06-02 — вернулись к Графу крупно: столпы героев, три способа применения Власти, дефект способности, характер, плёнка сверхлюдей, статус одного из двух сильнейших апостолов — и банду не назвали ни разу. Ни отмены, ни продолжения.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для Власти ограничение проговорено дважды и с двух сторон: изнутри — информационная перегрузка, «он не способен использовать власть очень долго. Потому что у него просто мозги расплавиться»; снаружи — плёнка сверхлюдей, «поэтому граф против особо сильных не может раздавить их просто или остановить сердца». Заявка сильная, и её сразу обвешали рамками с обоих концов. Для положения Графа в мире — вещи ровно того же рода и такой же силы — рамок нет ни одной: «король преступного мира», апостол на стороне добра и один из шести столпов героев стоят рядом без единого условия, которое их разводило бы. Для способности сказано, чего она не может. Для статуса не сказано.</p>\n<h3>Отклик</h3>\n<p>Разбор Власти 2026-06-02 — лучшее, что тут есть, и лучшее в нём — дефект. Не «он выдыхается через пять минут», а «Информацию до атома, до мельчайшего движения он получает абсолютно всю информацию о данное области» — ограничение выведено из природы самой способности, а не приделано к ней сбоку. И то, что головная боль и раздражительность оказались следствием той же механики, а не отдельно придуманной чертой характера, — это уже работа, а не перечисление свойств. На этом фоне банда выглядит оговоркой: «просто для развлечения», четыре слова, сказанные в декабре и ни разу не вспомненные. Зацепило именно соседство: способность автор через полгода переписал сам, с признанием «толком не описал», а про короля преступного мира не вспомнил вообще. Похоже, банда была нужна ровно на одну фразу — чтобы Граф в перечне прозвучал крупно, — и своё отработала.</p></div>", "r": []}];</script>
