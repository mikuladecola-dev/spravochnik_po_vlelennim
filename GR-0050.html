<script>const BASE="";const DOCNAME="Команда Славы (персонажи игры бога)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0050-S01", "GR-0050--chto-eto"], "h": "<p>Одна из двух команд-сторон игры «игра бога» — та, которую собирал Слава. Игру Слава объявил вечером 2024-04-02 (id 153132–153148): «Новая и более лёгкая» вселенная, в которой «20 человек оказались на какой-то территории и их поделили на 2 группы и т.п», «то бишь соревнование и испытания / то бишь игра бога», и «у всех них есть способности». Дальше он сформулировал правило набора, обращаясь к Миколаю: «От тебя 10 человека любых можешь взять из своего окружения и превратить в персонажа желательно» (153140), «И также их способности что бы подходили под характер ну хотя бы чуть чуть и чтобы не были прям нарушающий баланс» (153141), плюс отдельным требованием — «Так же фотки людей которых ты брал персонажа» (153146).</p>\n<p>Команда Славы — вторая половина этих двадцати: персонажи, сделанные Славой из своего окружения по тому же правилу. Отдельного названия у команды в переписке нет: она называется родовыми словами — «команда» («Оке, собираю команду», 153142), «2 группы» (153133). Что Слава берёт своих десятерых по тому же правилу, отдельной репликой не проговорено — правило адресовано Миколаю; общая рамка «20 человек... поделили на 2 группы» задана в 153133.</p>\n<p>В базе от этой команды видно пять карточек, выложенных 2024-04-03 (id 153365–153531): Аполлон, Максим, Кирилл, Дима, Саша. До десяти состав в окне не добран.</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0050-S02", "GR-0050--sostav"], "h": "<ul>\n<li><a href=\"PS-0047.html\">Аполлон</a> — Аполлон</li>\n<li><a href=\"PS-0048.html\">Максим</a> — Максим</li>\n<li><a href=\"PS-0049.html\">Кирилл</a> — Кирилл</li>\n<li><a href=\"PS-0050.html\">Дима</a> — Дима</li>\n<li><a href=\"PS-0051.html\">Саша</a> — Саша</li>\n</ul>\n<p>Карточки выложены подряд в один день, 2024-04-03: Аполлон (153365, 05:45), Максим (153366, 05:49), Кирилл (153368, 06:54), Дима (153530, 13:56), Саша (153531, 13:59). Оставшиеся до десяти персонажи в окне не названы.</p>", "r": [["Аполлон", "PS-0047.html"], ["Максим", "PS-0048.html"], ["Кирилл", "PS-0049.html"], ["Дима", "PS-0050.html"], ["Саша", "PS-0051.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0050-S03", "GR-0050--obschie-sposobnosti-gruppy"], "h": "<p>Общей на всех способности у команды нет — у каждого своя, отдельная. Общим является только устройство: «у всех них есть способности» (153135), способность подобрана к характеру персонажа — «что бы подходили под характер ну хотя бы чуть чуть» — и ограничена условием «чтобы не были прям нарушающий баланс» (153141).</p>\n<p>Второе общее свойство — происхождение: все участники сделаны из реальных людей окружения автора, «10 человека любых можешь взять из своего окружения и превратить в персонажа» (153140). К набору полагались фотографии прототипов (153146); прислал ли Слава фото своих — в переписке не сказано.</p>\n<p>Третье общее свойство — формат карточки. Все пять записаны одинаково: имя, одна-две черты характера (и иногда телосложение/возраст), затем строка «Способность:» с названием в скобках и разъяснением, у части — с прямо прописанным минусом или лимитом.</p>", "r": []}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0050-S04", "GR-0050--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p><strong>Максим (<a href=\"PS-0048.html\">Максим</a>)</strong> — «Высокого роста, лидер». Способность «власть»: «любой кто находится в 70 м должен подчиняться любому закону сказанная Максимам, минус в том что Максиму тоже надо подчиняться закону» (153366, 2024-04-03 05:49). Единственный в пятёрке, у кого в карточке прямо стоит роль лидера, и единственный, чей минус бьёт по самому носителю: закон, который он произнёс, связывает и его.</p>\n<p><strong>Аполлон (<a href=\"PS-0047.html\">Аполлон</a>)</strong> — «Мужчина 34 лет общительный, крупного телосложения». Способность «мастер на все руки»: «мастер любого оружия, боевые искусства, механик, электрик, то бишь мастер любого физического труда» (153365, 2024-04-03 05:45). Единственный, у кого назван возраст. Минуса или лимита в карточке нет.</p>\n<p><strong>Кирилл (<a href=\"PS-0049.html\">Кирилл</a>)</strong> — «Спокойный, тихий / Спортивный». Способность: «телепортировать 1 человека, которого он видел он способен телепортировать его только рядом собой». К карточке приложены оба тактических применения: «То бишь он может призвать врага или наоборот если его окружат будет способен телепортировать друга» (153368, 2024-04-03 06:54). Ограничения — один человек, только виденный раньше, и точка назначения только одна: к себе.</p>\n<p><strong>Дима (<a href=\"PS-0050.html\">Дима</a>)</strong> — «Разговорчивый, приставучий». Способность «кровавая палец»: «может стрелять кровью из пальца 3 раза максимум» (153530, 2024-04-03 13:56). Единственный со счётным лимитом применений.</p>\n<p><strong>Саша (<a href=\"PS-0051.html\">Саша</a>)</strong> — «Умный, разговорчивый». Способность «деление»: «может делить объекты на равный части только неоудешевленный предметы, чем большой объект делить чем больше устаешь» (153531, 2024-04-03 13:59). Два ограничения: только неодушевлённое и расход сил, растущий с размером объекта.</p>\n<p>По типу способностей пятёрка разложена так: контроль над чужими действиями (Максим), универсальное умение (Аполлон), перемещение (Кирилл), атака с жёстким лимитом (Дима), работа с предметами и усталость как цена (Саша).</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Третье, поменьше, но показательное: <code>PS-0047</code> (Аполлон) — 1,5 КБ базы, две ссылки, и это единственный из пятерых, кто не встречается вне игры бога. У остальных четверых материала много, но он чужой: <code>PS-0048</code> — 70,2 КБ на три вселенные, <code>PS-0050</code> — 36,8 КБ, <code>PS-0049</code> — 23,2 КБ, <code>PS-0051</code> — 13,4 КБ. В самой «игре бога» под ними почти ничего.</p></div>", "r": [["Максим", "PS-0048.html"], ["Аполлон", "PS-0047.html"], ["Кирилл", "PS-0049.html"], ["Дима", "PS-0050.html"], ["Саша", "PS-0051.html"]]}, {"t": "Иерархия", "a": ["S05", "GR-0050-S05", "GR-0050--ierarhiya"], "h": "<p>Единственное, что зафиксировано, — Максим назван лидером прямо в своей карточке (153366).</p>\n<p>Прописать иерархию целиком авторы собирались отдельным шагом. 2024-04-03 в 12:31 Миколай задал порядок: «Мы должны прописать взаимоотношения в своей команде» (153457), «Кто главный кто баласт и т.д» (153458), и уже потом «будут они соревноваться» (153459). В 12:42 он повторил задание: «Так что начинай отношения прописывать пораньше / И я начну» (153494–153495). Ни отношения внутри команды Славы, ни распределение на главного и балласт в окне так и не прописаны.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S06", "GR-0050-S06", "GR-0050--otnosheniya-s-drugimi-gruppami"], "h": "<p>Вторая сторона игры — команда Миколая, собранная по тому же правилу. Отношения между командами заданы только рамкой игры: двадцать человек на территории, «поделили на 2 группы» (153133), «соревнование и испытания» (153134).</p>\n<p>Как именно команды столкнутся, обсуждалось 2024-04-03. Сначала Слава признал, что продолжения у него нет: «Кстати и что дальше вот мы про всех персов рассказам и что дальше (Я та про игру сказал в полусонном состояния когда спать ложился поэтому не знаю что дальше)» (153408, 10:57). В 11:11 он выдал вариант и сам его оборвал: «Просто как идея (можно на друг друга скидывать монстров с характеристиками и способностями, а другая .......) я не знаю чё дальше» (153417).</p>\n<p>В 12:40 Миколай предложил другой механизм — турнир с нейронкой в роли арбитра (153481–153492, зафиксировано отдельно как идея «Турнир», Турнир <em>(статьи ещё нет — <a href=\"kb/ID-0041-turnir.html\">исходник</a>)</em>): «Придумаем турнир какой-нибудь / Ну и пропишем идею», «Мы идею турнира кидаем нейронке», «А потом прописываем наш ход / Тут», «И потом в контексте тура пишем нейронке / Она сама пропишет исход / И действия / И типо кто и как победит». Слава согласился: «Хорошо» (153493).</p>\n<p>Приз, за который команды соревнуются, — лист Шакоропаля: «А приз, лист Шакоропаля» (153497), «По сути это будет макгафин» (153498). На вопрос Славы «Че за лист» (153499) Миколай ответил «Если интересно погугли» и привёл определение макгафина — предмета, который движет сюжет, но сам по себе значения не имеет. Отдельно оговорено, что для персонажей это остаётся закрытой информацией: «Только тсс / Участникам об этом знать не нужно» (153503–153504).</p>\n<p>Сама идея турнира — его правила, испытания, содержание — в окне не придумана.</p>", "r": [["Турнир", "kb/ID-0041-turnir.html"]]}, {"t": "Как менялась — по датам", "a": ["S07", "GR-0050-S07", "GR-0050--kak-menyalas"], "h": "<p><strong>2024-04-02, вечер (id 153126–153148).</strong> Объявлена игра и задана рамка: 20 человек, 2 группы, соревнование и испытания, способности у всех, по 10 персонажей от автора из своего окружения, способности под характер и без нарушения баланса, плюс фото прототипов. Команда на этот момент существует только как половина от двадцати; ни одного персонажа Славы ещё нет.</p>\n<p><strong>2024-04-03, утро (id 153365–153368).</strong> Выложены три карточки: Аполлон (05:45), Максим (05:49), Кирилл (06:54).</p>\n<p><strong>2024-04-03, 10:57–11:11 (id 153408–153417).</strong> Слава ставит вопрос, что делать после того, как персонажи названы, и говорит, что игру придумал в полусонном состоянии. Предложенный им же вариант со скидыванием друг на друга монстров остаётся оборванным.</p>\n<p><strong>2024-04-03, 12:30–12:45 (id 153453–153504).</strong> Миколай задаёт порядок работы: сначала отношения внутри своей команды (кто главный, кто балласт), потом соревнование; механизмом соревнования становится турнир с нейронкой, призом — лист Шакоропаля как макгафин.</p>\n<p><strong>2024-04-03, день (id 153530–153531).</strong> Выложены ещё две карточки: Дима (13:56) и Саша (13:59). На этом пополнение состава в окне прекращается — пятеро из десяти.</p>\n<p>Дальше как команда эта пятёрка в переписке не появляется. Отдельные её участники позже переиспользованы Славой и Миколаем в других вселенных, уже вне игры бога и вне командной рамки: Кирилл — во вселенной «монстры» (с 2024-08-10, id 217239), Максим — в «Апостоле» (с 2025-03-18, id 305113) и в «Нимбе» (с 2025-05-04, id 323658), Саша — в «Нимбе» (2025-05-04, id 323658), Дима — в «Апостоле» (2025-09-08, id 362528) и в историях окна w0110 (2025-11-21, id 387578, 387585). Что это те же персонажи команды, а не совпадение имён, в переписке не оговорено; в базе они сведены в одну карточку по имени. Аполлон вне игры бога не встречается.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "GR-0050-S08", "GR-0050--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Состав добран только наполовину: пять карточек из десяти. Кто остальные пятеро — в переписке не названо.</li>\n<li>Имени у команды нет. В чате она называется только «команда» и «2 группы».</li>\n<li>Отношения внутри команды не прописаны, хотя задание было выдано прямо: «Кто главный кто баласт и т.д» (153458). Из иерархии зафиксирована одна строчка — «лидер» в карточке Максима.</li>\n<li>Турнир не придуман: есть механизм проведения через нейронку, но правил, испытаний и содержания нет.</li>\n<li>Что происходит после представления персонажей, осталось нерешённым — Слава сам сформулировал это как открытый вопрос (153408).</li>\n<li>Вариант «скидывать друг на друга монстров с характеристиками и способностями» (153417) не развит: реплика обрывается на «а другая .......».</li>\n<li>Фотографии прототипов требовались правилом (153146); прислал ли их Слава для своей пятёрки — в переписке не сказано.</li>\n<li>Как соотносится состав команды Славы с составом команды Миколая (кто против кого, разбивка на пары, порядок ходов) — не названо.</li>\n<li>О чём знают сами персонажи, кроме того, что о макгафине им знать не нужно (153504), не сказано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0050--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0047.html\">Аполлон</a>, <a href=\"PS-0048.html\">Максим</a>, <a href=\"PS-0049.html\">Кирилл</a>, <a href=\"PS-0050.html\">Дима</a>, <a href=\"PS-0051.html\">Саша</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0050--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0050.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0050-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0050/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым чинить <code>ID-0041</code> («Турнир»): три входящие ссылки, 4,2 КБ базы, статьи нет. Это самая дорогая дыра вселенной после самой вселенной, и она блокирует обе команды сразу — ни <code>GR-0050</code>, ни <code>GR-0049</code> не могут сказать, что персонажи вообще делают, потому что механизм проведения описан (кидаем идею нейронке, пишем ход, она пишет исход), а содержания — правил, испытаний, порядка — нет. Рядом <code>ID-0042</code> («Лист Шакоропаля»): одна ссылка, 3 КБ, статьи нет. Приз названо макгафином прямо, то есть его пустота задумана; но пока нет турнира, пустой оказывается и рамка вокруг него.</p>\n<p>Вторая дыра — пять недостающих персонажей. Их нет ни в базе, ни в архиве по имени: правило требовало десятерых, набрано пятеро. Асимметрия видна по числам: у второй команды <code>PS-0037</code>–<code>PS-0046</code> — ровно десять карточек, выложенных одним блоком 2024-04-02 в 23:02, до того как здесь появилась первая. Пять пустых слотов держат весь раздел «Отношения с другими группами»: разбивку на пары и порядок ходов не назовёшь, пока одной стороны половина.</p>\n<p>Третье, поменьше, но показательное: <code>PS-0047</code> (Аполлон) — 1,5 КБ базы, две ссылки, и это единственный из пятерых, кто не встречается вне игры бога. У остальных четверых материала много, но он чужой: <code>PS-0048</code> — 70,2 КБ на три вселенные, <code>PS-0050</code> — 36,8 КБ, <code>PS-0049</code> — 23,2 КБ, <code>PS-0051</code> — 13,4 КБ. В самой «игре бога» под ними почти ничего.</p>\n<h3>С чего начать</h3>\n<p>В базе — за турниром: <code>ID-0041</code> (4,2 КБ) и <code>ID-0042</code> (3 КБ) лежат рядом, и всё, что о механизме сказано, там. Этого хватит на статью о механизме, но не на правила; за правилами — в архив.</p>\n<p>За пятерыми недостающими — только архив, в базе их нет. Ориентир точный: 2024-04-03, после <code>153531</code> (13:59, карточка Саши, последняя) — смотреть остаток дня и ближайшие дни апреля 2024, добирал ли Слава состав молча, отдельным сообщением, или тема кончилась там же. Второй заход в архив — по фотографиям прототипов: правило (<code>153146</code>) требовало «фотки людей которых ты брал персонажа», в тексте не сказано, присылал ли их Слава; это проверяется просмотром вложений вокруг <code>153365</code>–<code>153531</code>.</p>\n<p>И третье, чисто базовое: материал пятерых разъехался по другим вселенным, а тождество нигде не проговорено. Проверять надо в точках переиспользования — <code>217239</code> (Кирилл, «монстры»), <code>305113</code> и <code>323658</code> (Максим, «Апостол» и «Нимб»), <code>323658</code> (Саша), <code>362528</code> и <code>387578</code> (Дима): сказано ли там хоть раз, что это те же люди из игры бога, или карточки сведены по имени. От ответа зависит, чем считать <code>PS-0048</code> — общим персонажем на три вселенные или тремя тёзками.</p>\n<h3>Как развивалось</h3>\n<p>Заявили ночью 2024-04-02: двадцать человек, две группы, соревнование, способности под характер, «чтобы не были прям нарушающий баланс». В 23:02 того же вечера вторая команда выложена целиком — все десять. Здесь набор идёт медленнее: три карточки утром 04-03 (05:45, 05:49, 06:54). В 10:57 автор сам останавливается и спрашивает, что дальше, — «Я та про игру сказал в полусонном состояния когда спать ложился поэтому не знаю что дальше». В 11:11 пробует вариант и обрывает его на середине фразы. В 12:30 соавтор задаёт порядок работ: сначала отношения внутри команд, потом соревнование; в 12:40 появляется турнир, в 12:45 — приз. В 13:56 и 13:59 добавлены ещё две карточки — и всё. Дальше команда как команда не появляется; участники возвращаются поодиночке и в других вселенных, с августа 2024 по ноябрь 2025.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Правило баланса названо для всех сразу: способность под характер и «чтобы не были прям нарушающий баланс». В четырёх карточках из пяти оно отработано прямо в тексте — у Максима закон связывает его самого, у Кирилла один человек, только виденный, и только к себе, у Димы три выстрела, у Саши только неодушевлённое плюс растущая усталость. У Аполлона — «мастер любого оружия, боевые искусства, механик, электрик, то бишь мастер любого физического труда», и ни минуса, ни лимита, ни расхода. Для четверых ограничение того же рода проговорено, для пятого — нет, и как «мастер любого физического труда» проходит под общее правило, не сказано.</p>\n<h3>Отклик</h3>\n<p>Сильнее всего — минус Максима. Способность даёт власть над всеми в семидесяти метрах, и тут же: закон, который он произнёс, связывает и его самого. Это не штраф, привинченный сбоку для баланса, — это сама природа приказа, и она сразу делает персонажа интереснее, чем его сила: каждый его ход есть выбор, чем он готов связать себя. Хорошо и то, что пятеро разложились по типам без всякого умысла — контроль, универсал, перемещение, атака с жёстким счётом, работа с предметами за усталость; получилась настоящая партия, а не пять сильных парней. И отдельно стоит реплика 10:57. Автор публично признаёт, что придумал игру в полусонном состоянии и не знает, что дальше, — и оставляет это в чате. В справочнике это выглядит как дыра, но по-человечески это самая честная строчка во всём окне.</p></div>", "r": []}];</script>
