<script>const BASE="";const DOCNAME="Одержимые";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0014-S01", "GR-0014--chto-eto"], "h": "<p>«Одержимые» — отдельная категория носителей силы, стоящая в рабочем реестре вселенной «Апостол» рядом с благословенными. В том виде, в каком она существует в реестре, это не группа с прописанным составом и не организация, а рубрика каталога: заголовок «Одержимый:» и под ним одно имя — Гурман (2025-02-25, id 295559). В таком виде рубрика повторяется во всех последующих выкладках реестра без изменений (2025-03-06, id 298850; 2025-05-14, id 325799).</p>\n<p>Содержание у категории появляется много позже и уже не в «Апостоле», а в переработанной, безымянной версии вселенной, которую Слава разворачивает 2025-09-12 (id 364756–364763): «Новая вселенная. Хотя это просто редактирования старой вселенной», «Ну вселенную Апостол куда-нибудь в долгий ящик я не убираю. Просто отдохнуть от неё». Там одержимые определены как один из двух основных типов носителей силы, наравне с благословенными:</p>\n<p>«Одержимые это люди одержимые демоном. И этого одержимого либо убивают либо изгоняют демона» (2025-09-12, id 364766).</p>\n<p>Записи этого окна в базе помечены вселенной «неясно» — сам автор её никак не называет, кроме как «новая вселенная». Поэтому определение 2025-09-12 и рубрика реестра «Апостола» — это два разных состояния материала, а не одно; в переписке они прямо не сшиты, и перенос определения на Гурмана нигде не оговорён.</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0014-S02", "GR-0014--sostav"], "h": "<ul>\n<li><a href=\"PS-0269.html\">Гурман</a> — Гурман.</li>\n</ul>\n<p>Это единственное имя, когда-либо стоявшее под заголовком «Одержимый» (2025-02-25, id 295559; 2025-03-06, id 298850; 2025-05-14, id 325799). Кто такой Гурман, чем он занят, какая у него сила и откуда прозвище — в переписке не сказано ни разу; имя встречается только внутри копий реестра и нигде не разворачивается. В окне, где категория появляется, Миколай не спрашивает о нём, а Слава не поясняет.</p>\n<p>В определении 2025-09-12 одержимые описаны как целый класс людей, но ни одного имени в этом классе не названо — поимённого состава там нет.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>По числам самая дорогая дыра — не сама категория, а реестры, внутри которых она живёт. <code>SL-0090</code> (реестр с разделом «Одержимый») — четыре ссылки, статьи нет, база 5 492. <code>SL-0053</code> — шесть ссылок, статьи нет, база 20 313. <code>SL-0051</code> — тоже шесть ссылок и тоже без статьи. Весь поимённый состав одержимых — одно имя, и существует оно только внутри этих трёх записей; пока у реестра нет своей статьи, <code>PS-0269</code> подвешен ни к чему.</p></div>", "r": [["Гурман", "PS-0269.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0014-S03", "GR-0014--obschie-sposobnosti-gruppy"], "h": "<p>Всё, что сказано о силах одержимых, сказано в одном сообщении 2025-09-12 (id 364766):</p>\n<ul>\n<li>«Одержимый это аналог Арбетара ( я даже в иногда буду называть их так) то есть у него такие же силы». Автор прямо разрешает себе называть одержимых арбетарами.</li>\n<li>«Но ему не надо обучаться. Он сразу сильный». Обучения одержимому не требуется — сила приходит вместе с одержимостью.</li>\n<li>«И в чаще всего сильнее благословенных ( поэтому на убийства одержимого они ходят группой разного количества)». Численный перевес противника — прямое следствие силы одержимого.</li>\n</ul>\n<p>Что именно за силы у арбетара, в переписке не раскрыто: арбетары остаются нераскрытыми во всех окнах, где упоминаются, и в 2025-09-17 (id 366200–366203) Слава прямо спрашивает «Вот только что с арбетарами делать?» и ответа не получает. Таким образом, способности одержимых заданы через отсылку к тому, что само не описано.</p>\n<p>Отдельно оговорён потолок: «Демоны в разы сильнее одержимых» (2025-09-12, id 364797). Там же — правило прохода: «Плюсом арбетары. Точнее демоны не могут попасть в наш мир. Точнее могут но там надо какой-нибудь сложный обряд придумать». Обряд не придуман, автор поправляет сам себя по ходу фразы, и одно ли и то же арбетары и демоны — из сообщения не следует.</p>\n<p>Способ прекратить одержимость назван двумя пунктами: убийство и экзорцизм. «Изменения демона производится редко ведь это муторно и опасно. Легче просто убить» (id 364766). Механика обряда оставлена пустой: «Как будет проводиться экзорцизм я ещё не придумал» (id 364767).</p>\n<p>Отдельно: 2025-10-03 (id 370732) в разговоре о другой переработке вселенной постоянно действующая сила описана оборотом «И они как арбетары. Если сжечь лес он будет гореть не переставая. То есть их ний силы постоянные». Сказано это про апостолов-насекомых, к одержимым эта фраза в переписке не отнесена.</p>", "r": []}, {"t": "Иерархия", "a": ["S04", "GR-0014-S04", "GR-0014--ierarhiya"], "h": "<p>Внутреннего устройства, старшинства или главы у одержимых в переписке нет. Названо только одно: «И у одержимых есть собственный организаций», «Просто у них есть такие же больший организации как и у благословенных» (2025-09-12, id 364766). Ни одна такая организация не названа по имени, состав и устройство их не описаны.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S05", "GR-0014-S05", "GR-0014--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>Демоны.</strong> Одержимость — это вселение демона в человека; демон в разы сильнее самого одержимого и без сложного обряда в мир попасть не может (2025-09-12, id 364766, 364797).</p>\n<p><strong>Благословенные.</strong> Основное противостояние. Одержимый «чаще всего сильнее благословенных», из-за чего благословенные «на убийства одержимого... ходят группой разного количества» (id 364766). После раскрытия чёрной изнанки «схватки одержимых и благословенных стали уже обыкновенными» (id 364774).</p>\n<p><strong>Организации охотников.</strong> «И вот есть множество организации занимающие убийством одержимых и получающие деньги от правительство и благотворительности. Хотя некоторые организации нанимают чтобы убить человека либо другого благословенного» (2025-09-12, id 364768). После раскрытия изнанки большинство таких организаций рассекретилось, их можно нанимать, и в них можно вступить (id 364774).</p>\n<p><strong>Общество и закон.</strong> Убийство одержимого законно: «Но их не я убийства все равно разрешено законным» (id 364766). При этом «после раскрытия существования чёрной изнанки. Большое количество людей начало их защищать» (id 364766). Цена услуг разведена: убийство одержимого для его же родственников бесплатно, платно — изгнание демона (id 364774).</p>\n<p><strong>Апостолы.</strong> Прямых отношений с одержимыми у апостолов в переписке нет, но именно охота апостолов на религиозную организацию раскрывает миру чёрную изнанку, а с ней — и существование одержимых (2025-09-12, id 364774).</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S06", "GR-0014-S06", "GR-0014--kak-menyalas"], "h": "<p><strong>2025-01-27 (id 284858) и 2025-01-28 (id 285522).</strong> В реестре разделов «Одержимый» ещё нет: есть «Благословенный», «Враг», «Церковь», «Военный», «Сторонний силы», «Семь грехов», «Существа», «Аномалий», оружие, артефакты, «Идей».</p>\n<p><strong>2025-02-25 (id 295552–295560).</strong> Категория появляется. Слава напоминает о ней отдельными репликами: «Одержимый», «Ты не забыл»; Миколай отвечает «я прекрасно помню», «всё это время в голове держу». В выложенном следом реестре (id 295559) стоит раздел «Одержимый:» с единственной строкой «Гурман». В тех же секундах Слава пишет «Благословенный ада» и «Которых 9» — к какому именно разделу относятся эти две реплики, в переписке не сказано; связь с одержимыми не названа. Чем одержимые отличаются от благословенных, в этом окне не объяснено.</p>\n<p><strong>2025-03-06 (id 298850).</strong> Реестр выложен целиком, раздел «Одержимый: Гурман» в нём без изменений. В том же окне (id 298854) принято решение «Грехи нужно убрать, а то тупо» — убирается соседний раздел «Семь грехов», раздела одержимых это решение не касается.</p>\n<p><strong>2025-05-14 (id 325798–325801).</strong> Реестр выложен снова, «Одержимый: Гурман» на месте; заголовок благословенных к этому моменту переименован в «Апостолы:». Сразу после выкладки Слава пишет «Он жив» и «Ну и нужно исправления». Исправления названы в id 325808: «Добавления организация нимб и фантазеров И перераспределение сил». Одержимые в списке правок не упомянуты.</p>\n<p><strong>2025-09-12 (id 364756–364797).</strong> Разворот переработанной вселенной. Слава начинает с рамки: «Во первых вообще кто есть благословенные и одержимые. Благословенный всё также но силы у всех благословенных получен от небес» (id 364764). Дальше в одном сообщении (id 364766) задано всё содержание категории: люди, одержимые демоном; аналог арбетара с теми же силами; сила без обучения; чаще сильнее благословенных; свои организации; законность убийства; защитники из числа людей. Тут же — незакрытые места: экзорцизм не придуман (id 364767), обряд прохода демонов не придуман (id 364797). В id 364774 добавлены последствия раскрытия чёрной изнанки, в том числе расценки и обыденность схваток.</p>\n<p><strong>2025-09-17 (id 366040–366041).</strong> В следующей переработке — уже другой, «более приземленой» вселенной без правителей, творцов и «чудо способностей» — от слова «одержимые» автор отказывается: «Ещё добавить одержимых. Ну не одержимых. А сделать антиапостолов. С тёмными глазками. Ну они тоже должны насекомого съесть?» Вопрос про насекомое задан Миколаю и остался без ответа.</p>\n<p><strong>2025-09-17 (id 366106–366107).</strong> Для одержимых выделено собственное насекомое: «Че по насекомам есть каменный жук / Белая бабочка ( ну или гусеница) / Ну и для одержимых чёрный червь», «Ну они должны быть слегка особенными».</p>\n<p><strong>2025-09-18 (id 366583–366586).</strong> Одержимый числится в перечне рас: «Кто у нас как раса есть Поротой Азуриэль Апостолы Одержимый».</p>\n<h3>Отклонённые и не доведённые варианты</h3>\n<ul>\n<li>Название «одержимые» в версии от 2025-09-17 заменено на «антиапостолы» («Ну не одержимых. А сделать антиапостолов»), при этом в тех же днях автор продолжает пользоваться словом «одержимые» (id 366106, 366586).</li>\n<li>Вопрос «Ну они тоже должны насекомого съесть?» (2025-09-17, id 366040) остался без ответа.</li>\n<li>Экзорцизм заявлен как один из двух исходов одержимости, но обряд не придуман (2025-09-12, id 364767).</li>\n<li>Обряд, которым демоны могли бы попасть в мир, заявлен и тут же оставлен: «там надо какой-нибудь сложный обряд придумать» (2025-09-12, id 364797).</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S07", "GR-0014-S07", "GR-0014--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет. За всё время под категорией стоит одно имя — Гурман, и оно не раскрыто: ни силы, ни роли, ни внешности, ни сюжета. Что означает прозвище — в переписке не сказано.</li>\n<li>Численность одержимых не названа ни разу.</li>\n<li>Не сказано, относится ли определение 2025-09-12 («люди, одержимые демоном») к Гурману из реестра «Апостола»: это разные состояния материала, и связь между ними в переписке не проводится.</li>\n<li>Силы одержимых заданы через арбетаров, а сами арбетары не описаны; что такое «такие же силы» — осталось нерешённым.</li>\n<li>Одно ли и то же арбетары и демоны — из переписки не восстанавливается, автор поправляет себя в середине фразы (id 364797).</li>\n<li>Организации одержимых названы, но ни одна из них не имеет имени, устройства или численности.</li>\n<li>Механика экзорцизма и механика прохода демонов в мир прямо объявлены непридуманными.</li>\n<li>Связь категории «Одержимый» с соседним разделом реестра «Семь грехов» нигде не проводится; грехи убраны из списка 2025-03-06 отдельным решением.</li>\n<li>В архиве под словом «одержимый» встречается ещё одна фигура — «одержимый с чёрными слезами», существо из плана истории, выполняющее просьбы в обмен на здоровые нейроны (2025-04-01, id 314960). С категорией из реестра «Апостола» она в переписке не связана.</li>\n<li>Вселенная материала 2025-09-12 и 2025-09-17 в чате не названа; в базе эти окна помечены как «неясно».</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0014--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0269.html\">Гурман</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0014--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0014.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0014-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0014/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>По числам самая дорогая дыра — не сама категория, а реестры, внутри которых она живёт. <code>SL-0090</code> (реестр с разделом «Одержимый») — четыре ссылки, статьи нет, база 5 492. <code>SL-0053</code> — шесть ссылок, статьи нет, база 20 313. <code>SL-0051</code> — тоже шесть ссылок и тоже без статьи. Весь поимённый состав одержимых — одно имя, и существует оно только внутри этих трёх записей; пока у реестра нет своей статьи, <code>PS-0269</code> подвешен ни к чему.</p>\n<p>Вторая дыра дешевле по ссылкам, но она держит смысл всей категории: одержимость определена через демона, а демона в справочнике нет. <code>MR-0091</code> «Демоны» — 3 639 знаков базы, статьи нет, вселенная «неясно». На той же ветке <code>SP-0235</code> «Экзорцизм (изгнание демона)» — 3 445, статьи нет; <code>MR-0150</code> «Чёрная изнанка» — 5 665, статьи нет; <code>MR-0149</code> «Организации охотников на одержимых» — 6 390, статьи нет. У всех четырёх ноль ссылок, и это не потому, что они никому не нужны, а потому, что привязать их не к чему: они помечены «неясно», а <code>GR-0014</code> числится по «Апостолу».</p>\n<p>Третье — арбетары, через которых заданы силы одержимого. Здесь как раз наоборот: материала много (<code>PS-0224</code> — 90 651, <code>SP-0198</code> — 48 879, <code>PS-0220</code> — 38 531, <code>PS-0226</code> — 20 681), статьи есть. Значит, «силы арбетара не описаны» надо сперва проверить по этим четырём записям, а уже потом называть пробелом.</p>\n<h3>С чего начать</h3>\n<p>В базе, не в архиве. Содержание категории 2025-09-12 целиком лежит в справочнике, только разложено по шести записям с пометкой «неясно»: <code>SP-0234</code> «Одержимые» (6 663), <code>SP-0235</code> (3 445), <code>PS-0296</code> «Антиапостолы / Одержимые» (3 643), <code>MR-0149</code> (6 390), <code>MR-0150</code> (5 665), <code>MR-0153</code> «Насекомые (источник сил)» (5 672). Ни у одной нет статьи. Решение по одной развилке — «неясная» вселенная 2025-09-12 и 2025-09-17 это отдельный мир или ветка «Апостола» — закрывает все шесть разом.</p>\n<p>Отдельно <code>PS-0203</code> «Одержимый» (статья 3 198, база 4 874, вселенная «Апостол») — это вторая запись о том же под другим номером; её надо сверить с <code>PS-0269</code> и <code>SP-0234</code> прежде, чем что-то дописывать.</p>\n<p>В архив идти надо только за Гурманом. Под ним 3 763 знака, и это копии реестра. Ориентир — окно 2025-02-25, id 295552–295560: там Слава дважды напоминает про категорию («Одержимый», «Ты не забыл»), и если пояснение было, оно между этими репликами и выкладкой id 295559. Второе окно — 2025-09-17, id 366100–366110, вокруг раздачи насекомых: чёрный червь выдан одержимым, а вопрос «Ну они тоже должны насекомого съесть?» задан пятью днями раньше и ответа не получил.</p>\n<h3>Как развивалось</h3>\n<p>2025-02-25 — рубрику заводят и о ней напоминают отдельно, будто она важна. 2025-03-06 и 2025-05-14 — реестр перевыкладывают дважды, рубрика едет в нём без единого изменения, а в объявленный список правок 2025-05-14 не попадает. Дальше семь месяцев тишины. 2025-09-12 — возвращение, но в другой, неназванной вселенной, и всё содержание категории выдано в одном сообщении id 364766. Через пять дней, 2025-09-17, слово заменяют на «антиапостолы» и в те же дни продолжают пользоваться прежним.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для благословенных условия входа проговорены плотно: даётся без согласия, одно на человека, разорвать нельзя, до смерти носителя, в среднем десять лет жизни. Одержимость — вторая половина той же пары, автор сам ставит их рядом как два основных типа носителей силы. Для неё не названо ничего из того же ряда: сам ли человек впускает демона, один ли демон на человека, можно ли получить одержимость дважды, и что остаётся от человека после экзорцизма — тот, кем он был, или уже нет. Правило есть у одной половины и не сформулировано у второй.</p>\n<h3>Отклик</h3>\n<p>Сильнее всего тут экономика. Убийство одержимого для его же родственников бесплатно, изгнание демона — платно. Две строки, а из них разом видно и то, как мир относится к одержимым, и то, что «спасти» дороже, чем «избавить», и почему организации живут на этом неплохо. Это редкий случай, когда правило мира сформулировано через прайс, и оно работает лучше любого описания. Рядом с этим — «Легче просто убить», сказанное про экзорцизм в том же абзаце, где экзорцизм объявлен одним из двух исходов. Механику автор не придумал, но отношение к ней уже придумал, и оно оказалось точнее механики. Всё остальное в категории — одно имя без человека за ним и класс без единого имени, и между этими двумя пустотами семь месяцев.</p></div>", "r": []}];</script>
