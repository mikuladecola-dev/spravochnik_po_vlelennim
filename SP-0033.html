<script>const BASE="";const DOCNAME="Карма как вера";
const LEAD="<p>Правило о том, что карма работает по тому же принципу, что божественная сила в аниме «Бездомный бог»: её питает вера. Сформулировано Миколаем 2023-12-26 (окно w0021, id 66145–66187) и с тех пор не пересматривалось — версия одна.</p>";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0033-S01", "SP-0033--mehanika"], "h": "<p>Разговор вырос из бытовой приметы Славы: «У меня есть поверья что чем больше хорошого чем скорей произойдет что то неприятной» (2023-12-26, id 66147), с добавлением «Оно работает / Так каждый раз происходит» (id 66151).</p>\n<p>Механика вводится через вопрос-аналогию. Миколай спрашивает, смотрел ли Слава «Бездомного бога» (id 66173), и что влияет на силу бога (id 66176). Ответ Славы — «Вера» (id 66178). После этого следует сама формулировка (2023-12-26, id 66181–66185):</p>\n<div class=\"q\"><p>«Так вот и с кармой<br>Чем больше веришь в нее<br>Чем она сильнее<br>Тем вероятней будет<br>Если не верить не будет»</p></div>\n<p>То есть вера задаёт две вещи сразу: силу кармы и вероятность её срабатывания. Оба параметра растут вместе с верой.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0033-S02", "SP-0033--ogranicheniya-i-cena"], "h": "<p>Нижняя граница названа прямо: «Если не верить не будет» (id 66185). При отсутствии веры эффекта нет вообще.</p>\n<p>Ни цены, ни расхода, ни отката в переписке не названо.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0033-S03", "SP-0033--nositeli"], "h": "<p>Носители не названы. Правило сформулировано как свойство самой кармы, а не как способность конкретного персонажа.</p>\n<p>В карточке сущность связана с «Падениями небес» и со «Сверхлюдьми-актёрами», но привязка внутри самой переписки не проговорена.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0033-S04", "SP-0033--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2023-12-26 (id 66145–66187).</strong> Единственная версия. Первая и окончательная формулировка правила: вера задаёт силу и вероятность срабатывания кармы, без веры эффекта нет. Аналогия с «Бездомным богом» дана как способ объяснения.</p>\n<p>Позже правило не возвращалось и не переписывалось.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "SP-0033-S05", "SP-0033--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Не сказано, для какой вселенной это правило и правило ли это вообще, а не бытовое рассуждение о собственной примете. Тематически рифмуется с ролью веры в «Падениях небес», обсуждавшихся тем же утром, но связь в переписке не названа.</li>\n<li>Не сказано, чья именно вера считается — того, на кого карма действует, или наблюдателя, или общая.</li>\n<li>Не сказано, работает ли карма только на плохое (исходная примета Славы — «чем больше хорошего, тем скорее произойдёт неприятное») или в обе стороны.</li>\n<li>Не сказано, есть ли у правила носители, персонажи или сюжетное применение.</li>\n<li>Механика измерения веры (как определяется, «сколько» веры) не задана.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0033--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0009.html\">Падения небес</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0033--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2023-12-26</td>\n<td>66145–66187</td>\n<td>w0021</td>\n<td>Падения небес (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0033-karma-kak-vera.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0033--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0033.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
