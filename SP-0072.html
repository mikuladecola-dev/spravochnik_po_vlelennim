<script>const BASE="";const DOCNAME="Солнце";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0072-S01", "SP-0072--mehanika"], "h": "<p>Солнце — приём в составе способности Тьма, принадлежащей персонажу с раздвоением личности. Единственный из приёмов, предложенных Миколаем в этом разговоре, который Слава принял (2024-06-28, окно w0040, id 190751–190806).</p>\n<p>Исходная формулировка Миколая (id 190751): «пожирание солнца внутри человека лишением тени, человек так станет неосязаемым, то есть не нанесёт урон и не возможно будет нанести урон ему, возможно это он в команде будет делать, радиус 5 метров, так челы смогут проходит сквозь препятствия в радиусе действия». То есть: солнце внутри человека пожирается через лишение его тени; результат — неосязаемость в обе стороны; радиус 5 метров; применение командное, союзники в радиусе проходят сквозь препятствия.</p>\n<p>Переопределение Славы (id 190793): «Солнце поглашаеть все положительных чувств ( не действует на сильных духом)».</p>\n<p>Миколай признал эти две формулировки одной и той же: «А, сука я тоже самое написал другими словами. Ток щас понял» (id 190798, 190800).</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0072-S02", "SP-0072--ogranicheniya-i-cena"], "h": "<p>Единственное названное ограничение — из формулировки Славы: не действует на сильных духом (id 190793).</p>\n<p>Из исходной формулировки Миколая — радиус 5 метров (id 190751). Сохранился ли радиус после переопределения, в переписке не сказано.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0072-S03", "SP-0072--nositeli"], "h": "<p>Персонаж с раздвоением личности, носитель способности Тьма. Имя в этом окне не названо.</p>\n<p>О его манере Слава уточняет отдельно (id 190763): «Убийца прости это не правильная описания. Он скорее в открытую нападает показывая ничтожество противника и превращает его в месиво».</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0072-S04", "SP-0072--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-06-28 (id 190751–190806).</strong> Единственная зафиксированная версия, внутри неё — два состояния формулировки за один вечер:</p>\n<ul>\n<li>id 190751, 22:26 — формулировка Миколая через лишение тени, неосязаемость, радиус 5 метров и командное применение;</li>\n<li>id 190793, 22:35 — формулировка Славы через поглощение всех положительных чувств с оговоркой про сильных духом.</li>\n</ul>\n<p>Между ними — id 190757, 22:29: «Все говно кроме солнца». Приём отобран из списка предложений именно этой репликой.</p>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S05", "SP-0072-S05", "SP-0072--otklonennye-varianty"], "h": "<p>Всё, что Миколай предложил в id 190751, кроме солнца, было отвергнуто репликой «Все говно кроме солнца» (id 190757):</p>\n<ul>\n<li>«Возможность сталкерить падая в тень, можно это оригинально раскрыть»;</li>\n<li>«тэпэшка через теневой мир, но не себя а предметов, то есть, может стрелять в свою тень а снаряды из другой вылетают».</li>\n</ul>\n<p>Отдельно и позже отвергнуты проклятия и дебафы. Миколай (id 190779–190781): «Ну тогда он может проклинать противника, дебафить по всем статам лишь прикосновением. И уже над слабаками издеваться. Кромсать». Слава: «Нет» (id 190782), «Не будет» (id 190784). После того как солнце было переопределено, Слава закрыл направление совсем: «И все больше дебаффов не будет» (id 190802).</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S06", "SP-0072-S06", "SP-0072--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Солнце входит в состав способности Тьма — в карточке проставлено как часть Тьмы.</p>\n<p>В том же разговоре о Тьме зафиксировано:</p>\n<ul>\n<li>тьма не призывается, а «из него сочится» (id 190773–190775) — Миколай спрашивал «Типо он тьму призывает. И ей атакует», Слава ответил «Он из него сочится», следом «Ну да наверное»;</li>\n<li>у носителя есть реген (id 190774); на вопрос «так может если ему руку отхуярить он сможет её восстановить или прилепить?» (id 190776) ответ — «Восстановить» (id 190777);</li>\n<li>итог Миколая по Тьме в конце разговора (id 190806): «Он бафает себе инструменты, они наделяются тьмой, и ну в общем лучше работают».</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S07", "SP-0072-S07", "SP-0072--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Не сказано, сохраняются ли после переопределения Славы радиус 5 метров, командное применение и проход союзников сквозь препятствия — Миколай считает формулировки одинаковыми, но напрямую эти детали не подтверждены.</li>\n<li>Не раскрыто, что означает «поглощает все положительные чувства» в бою: механический эффект не описан.</li>\n<li>Не определено, кто такие «сильные духом» и как это проверяется.</li>\n<li>Цена и откат не названы.</li>\n<li>Имя носителя в этом окне не названо.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0072--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0072--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-06-28</td>\n<td>190751–190806</td>\n<td>w0040</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0072-solnce.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0072--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0072.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
