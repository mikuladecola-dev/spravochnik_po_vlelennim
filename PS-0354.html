<script>const BASE="";const DOCNAME="Бен";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0354-S01", "PS-0354--proishozhdenie"], "h": "<p>Персонаж истории «Цена жизни», выложенной Славой одним куском (2026-02-16, id 433706–433713, окно w0118). Текст написан примерно за неделю до публикации: «На прошлое недели». Собственная оценка автора сразу после выкладки — «Просто хуйня».</p>\n<p>Замысел, названный Славой в тех же сообщениях: «Просто я подумал о разногласий», «Точнее чувство виновности и цены жизни. Я хотел написать историю о персонажей, что говорит о том что не виновен и представляет вполне разумный доводы ну мстительный дух его всё равно заебыввет». Бен в тексте — сторона мести. Совпадает ли он с «мстительным духом» из этой формулировки, в переписке не сказано; в самом тексте он живой человек, а не дух.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0354-S02", "PS-0354--vneshnost"], "h": "<p>«Черноволосый мужчина». Глаза красные — отмечено в момент, когда он «уставился красными глазами на Дена»; постоянный это признак или состояние в сцене, не уточнено. Во время монолога у трупа «по его щекам начали скатываться слезинки».</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0354-S03", "PS-0354--harakter"], "h": "<p>Позиция Бена — решить вопрос самому и без разбирательства: «что здесь решать Ден», «ответ и так очевиден». На возражение, что он не вправе единолично решать о чужой жизни, отвечает одним словом: «могу!».</p>\n<p>Он настаивает, что убийство не было случайностью, и ссылается на то, что знает предысторию: «А ты случаем не знаешь, какие до этого были их отношения?», «а я вот слышал и....видел!», «Ден ты защищаешь того, кто издевался над ним, лишь из зависти». Что именно он слышал и видел, в тексте не раскрыто.</p>\n<p>Способ убеждения — физический. Он тыкает пальцем в грудь Дена, хватает за плечо, ведёт в здание, где хранятся трупы, открывает мешок, кричит «ну и кто это!?!», а затем «резко схватил голову Дена и опустил его голову, к голове Криса» и во время монолога «импульсивно сильнее давил на голову Дена. Дабы он лучше разглядел лицо, которой больше не улыбнеться и не заплачет».</p>\n<p>Центральный монолог:</p>\n<ul>\n<li>«-Второй шанс!!- скажи это Крису. Крису кто-нибудь давал второй шанс-»;</li>\n<li>«ты хотя бы понимаешь. Это всё конец для него!»;</li>\n<li>«всё что он мог прожить. Всё будущее.... Всё счастье, всю горечь.... Всё что он мог прожить, всё что он мог изменить. Всё закончилось и не будет чудесного воскрешения»;</li>\n<li>«и ты хочешь, чтобы я просто отпустил того, кто отнял чужое будущее?».</li>\n</ul>\n<p>Отношение к инстанциям и к людям вообще. На довод «мы с тобой не имеем права судить» отвечает с ухмылкой: «ха... А кто имеет право. Бог что-ли или дьявол». На ссылку про решение совета смеётся и говорит: «с каких пор люди стали объективными. Не тогда когда мир был пропитан законам и правилам, не сейчас, когда мы дохнем как мухи, чтобы хоть что-то защитить. Люди никогда не будет объективными».</p>\n<p>Заканчивает сцену устало и с оценкой собеседника: «Поэтому хватит Ден», «ты не остановишь меня своими словами. Тем более когда ты сам в них не до конца веришь». Отпускает голову Дена и отходит.</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0354-S04", "PS-0354--svyazi-s-drugimi"], "h": "<ul>\n<li>Ден (<a href=\"PS-0353.html\">Ден</a>) — оппонент в споре, единственный, с кем Бен разговаривает в сцене. Обращаются по имени; чем связаны, в переписке не сказано.</li>\n<li>Крис (<a href=\"PS-0355.html\">Крис</a>) — погибший ребёнок, чей труп Бен показывает Дену. Характер связи Бена с Крисом прямо не назван: Бен плачет над ним и говорит о его отнятом будущем, но кем он ему приходился, в тексте не сказано.</li>\n<li>Подросток-убийца — тот, кого Бен намерен наказать по-своему; по имени не назван, в сцене не появляется. По словам Бена, он «издевался над ним, лишь из зависти».</li>\n<li>Охранники комнаты с трупами — «Охранники лишь встали и поздоровались». Из этого следует, что Бена там знают и пропускают без вопросов; его должность или положение не названы.</li>\n<li>Совет — упомянут Деном, Бен его авторитет отвергает.</li>\n</ul>", "r": [["Ден", "PS-0353.html"], ["Крис", "PS-0355.html"]]}, {"t": "Как менялся — состояния по датам", "a": ["S05", "PS-0354-S05", "PS-0354--kak-menyalsya"], "h": "<p><strong>2026-02-16 (id 433706–433713), версия 1.</strong> Единственное состояние: позиция мести, монолог о том, что чудесного воскрешения не будет. Дальнейших правок и обсуждений персонажа в переписке нет.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S06", "PS-0354-S06", "PS-0354--chto-s-nim-stalo"], "h": "<p>Сцена обрывается на его реплике «ты не остановишь меня своими словами». Осуществил ли он задуманное, в переписке не сказано — продолжение не написано.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0354-S07", "PS-0354--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Кем Бен приходится Крису, не сказано.</li>\n<li>Что именно он «слышал и....видел» про отношения Криса и подростка, не раскрыто.</li>\n<li>Что он собирался сделать с подростком, прямо не сформулировано — сказано только, что Ден предлагает наказать «не так, как хочешь ты».</li>\n<li>Красные глаза не объяснены: признак вида, состояния, способности или просто слёз — не сказано.</li>\n<li>Способностей за Беном не описано; в сцене он действует руками.</li>\n<li>Мир и организация, к которой принадлежат Бен и Ден, не описаны. Единственное упоминание обстановки — «сейчас, когда мы дохнем как мухи, чтобы хоть что-то защитить»; от кого защищают и что, не сказано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0354--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0353.html\">Ден</a>, <a href=\"PS-0355.html\">Крис</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0353.html\">Ден</a>, <a href=\"PS-0355.html\">Крис</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0086.html\">Совет</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0005.html\">Иссекай</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0354--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-02-16</td>\n<td>433706–433713</td>\n<td>w0118</td>\n<td>Иссекай (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0354-ben.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0354--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0354.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
