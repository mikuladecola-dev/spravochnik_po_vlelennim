<script>const BASE="";const DOCNAME="Новый мир";
const LEAD="";
const CH=[{"t": "Зарождение", "a": ["S01", "VS-0007-S01", "VS-0007--zarozhdenie"], "h": "<p>Вселенная объявлена <strong>2024-06-03</strong>: Слава пишет в чат «Новый мир». Слово прозвучало дважды за один вечер, и мир развернулся только со второго раза.</p>\n<p><strong>Первое «Новый мир» (2024-06-03 22:13, id 175722)</strong> вставлено посреди разговора про рисунок Миколая. Непосредственно перед ним Слава разбирает картинку: «Получилось словно пейзаж» (175718), «Словно красками» (175719); Миколай отвечает «Ага, ну если что я фон спиздил» (175720). Реакции на «Новый мир» нет — следующей репликой Слава спрашивает «Что за улыбка ?» (175725), и разговор без паузы возвращается к рисунку: «А вот его я полностью делал сам» (175726), «Плохо вышла?» (175727).</p>\n<p><strong>Разговор, в который вписано первое объявление (2024-06-03, id 175718–175766).</strong> Слава читает выражение лица персонажа: «Ну словно он стесняется» (175728), «Или неуверенный» (175729). Миколай: «А, цель была немного другая» (175730), «Типо уверенный и дохуя злой» (175731), потом «Лан, шуткую. Все что ты написал, то я и хотел изобразить» (175732). Про манеру рисовать Слава спрашивает: «А что ты их всех прямо рисуешь без поз ?» (175733), «Просто я думал ты можешь и по-другому» (175737), «А то они получаются однотипный» (175738); Миколай — «На больное давишь» (175734), «Да» (175735). Дальше Миколай про себя как рисующего: «Вот у всех на меня большие надежды, эт оч напрягает. На деле это весь мой скилл» (175739), «Ну а ещё я пока просто презентую персонажа» (175740), «Так что не особо думал над позой» (175741). Оценка Славы: «Ну норм вроде. Не особо выделяющийся и не особо приукрашенные» (175743).</p>\n<p>Тут же Миколай излагает замысел по этому персонажу: «Вообще планирую его таким уебаном сделать» (175744), «Конченым человеком просто» (175745), «Надеюсь получится» (175746). На уточнение Славы «Под конченым ты что имеешь виду?» (175747) — «Ну тут больше по характеру и поступкам. Те вещи сделает, за которые моя авторская позиция его максимально осудит и не простит» (175748), «А подробности в сюжете появятся» (175749). Это персонаж «конченый человек» (<code>[Персонаж «конченый человек»](../personazhi/PS-0092-personazh-konchenyy-chelovek.md)</code>, 1 версия, с 2024-06-03) — отдельная сущность вселенной, совпадающая по дате и месту в переписке с первым объявлением. Связь этого рисунка и персонажа с самим «Новым миром» словами не названа: слова «Новый мир» просто стоят посреди разговора о рисунке.</p>\n<p>Затем разговор уходит в бытовое — учёба, как прошёл день (175750–175758), — и посреди этого куска Слава повторяет «Новый мир».</p>\n<p><strong>Второе «Новый мир» (2024-06-03 22:26, id 175759)</strong> Миколай замечает: «Так» (175760), «А тут подробнее» (175761), «Ты уже второй раз пишешь» (175762). Почему первое объявление осталось без реакции, в переписке не объяснено. После этой просьбы мир и разворачивается — тремя энергиями, колдунами, существами (см. «Система способностей» и «Население и классы»).</p>\n<p><strong>Переименование 2024-06-05 (id 176188–176194).</strong> Через два дня Миколай называет мир иначе:</p>\n<ul>\n<li>[176188] 18:25 Миколай: «А ты ещё рисовал что-нибудь»</li>\n<li>[176189] 18:25 Миколай: «Или рисуешь?»</li>\n<li>[176190] 18:25 Слава: «Буду»</li>\n<li>[176191] 18:25 Миколай: «А в чёрно белом мире придумал что-то ещё?»</li>\n<li>[176192] 18:28 Миколай: «Кстати, я ролик на 24 минуты выложил на ютуб и как я рассказывал ютуб его начал мощно продвигать. Однако и смотреть его никто не будет. Но, то что ютуб его хорошо продвигает это факт»</li>\n</ul>\n<p>Ответа Славы на вопрос про «чёрно белый мир» нет: следующей репликой Миколай сам перевёл тему на свой ролик. В базе это событие помечено как переименование, с оговоркой: «прямого подтверждения, что это тот же „Новый мир“ с тёмной/светлой энергией, в чате нет».</p>\n<p><strong>Что было до вселенной.</strong> Прямого высказывания «до этого было то-то» в переписке нет. Известно только из разметки: шапка карточки <code>[Новый мир](VS-0007-novyy-mir.md)</code> даёт даты вселенной <strong>2024-04-02 — 2024-06-14</strong>, то есть левая граница на два месяца раньше объявления, и с 2024-04-02 числятся две сущности — персонаж <strong>Поротай</strong> (<code>[Поротай](../personazhi/PS-0036-porotay.md)</code>, 9 версий) и способность <strong>Жуг</strong> (<code>[Жуг](../sposobnosti/SP-0052-zhug.md)</code>, 3 версии). Как они попали в «Новый мир» и что предшествовало объявлению, в переписке не сказано. Сам Поротай перенесён в мир пересылкой старой карточки 3 июня (см. «Население и классы»).</p>\n<p><strong>Названия и рабочие обозначения.</strong></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Обозначение</th>\n<th>Кто, когда, id</th>\n<th>Отношение к вселенной</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>«Новый мир»</td>\n<td>Слава, 2024-06-03 22:13, [175722]; повтор 2024-06-03 22:26, [175759]</td>\n<td>Название вселенной; по нему поставлена граница отрезка. Единственное обозначение, произнесённое как имя, и произнесено оно Славой</td>\n</tr>\n<tr>\n<td>«чёрно белый мир»</td>\n<td>Миколай, 2024-06-05 18:25, [176191]</td>\n<td>Помечено как переименование, вторым автором внутри цитаты не подтверждено</td>\n</tr>\n<tr>\n<td>«страшилка с приземленными силами»</td>\n<td>Слава, 2024-06-03 22:28, [175764]</td>\n<td>Не имя, а определение жанра и тона мира; Миколай переспрашивает: «Страшилка?» (175766)</td>\n</tr>\n<tr>\n<td>«инь и янь»</td>\n<td>Миколай, 2024-06-03 22:29, [175765]</td>\n<td>Сравнение при первой реакции на три энергии, не название</td>\n</tr>\n<tr>\n<td>«ному из мга»</td>\n<td>Миколай, 2024-06-03 22:42, [175788]</td>\n<td>Внешний ориентир по внешности существ, не название мира</td>\n</tr>\n</tbody>\n</table></div>\n<p>Собственного имени у мира в переписке нет. Названий отдельных мест, стран, эпох не звучит.</p>\n<p><strong>Разметка карточки.</strong> В шапке <code>[Новый мир](VS-0007-novyy-mir.md)</code>: тип «вселенная», <code>отрезков_объявлено: 3</code>, <code>даты: 2024-04-02 — 2024-06-14</code>, <code>сущностей: 21</code>. В таблице «Отрезки жизни» — один отрезок: <strong>2024-06-03 — 2024-06-17</strong>. Все три события-объявления отнесены к одному окну <code>w0036</code> и все три — это два объявления 3 июня и переименование 5 июня; событий типа «закрытие», «возврат», «пауза», «слияние» в файле нет. Правило самого файла приведено в нём дважды дословно: «Границы поставлены по объявлению в чате плюс дате, а не по содержанию. Отрезки могут быть несмежными — это нормально».</p>\n<p><strong>Где лежит материал.</strong> Почти всё — в окне <code>w0036</code> (174499–177144, 2024-06-02 — 2024-06-08, 410 сообщений); одна идея (<code>Магия появляется из мечты _(статьи ещё нет — [исходник](../../kb/sushnosti/idei/ID-0069-magiya-poyavlyaetsya-iz-mechty.md))_</code>, «Магия появляется из мечты», 2024-06-11) — в следующем окне <code>w0037</code>; Поротай приходит из окна <code>w0029</code> (2024-04-02, id 152572–152606). Плотная работа над миром занимает четыре вечера: 3, 4, 5 и 6 июня 2024.</p>", "r": [["Магия появляется из мечты", "kb/ID-0069-magiya-poyavlyaetsya-iz-mechty.html"], ["Персонаж «конченый человек»", "PS-0092.html"], ["Поротай", "PS-0036.html"], ["Жуг", "SP-0052.html"]]}, {"t": "Масштаб", "a": ["S02", "VS-0007-S02", "VS-0007--masshtab"], "h": "<p><strong>Мир один.</strong> Нигде в переписке не сказано, что миров несколько; нет ни списка миров, ни второго названного мира, ни границы между мирами. Вопрос «сколько миров» не поднимался ни разу.</p>\n<p>В списке миров вселенной две записи, но это не два мира:</p>\n<ul>\n<li><code>[Новый мир](../miry/MR-0012-novyy-mir.md)</code> «Новый мир» (2024-06-03 — 2024-06-06, 6 версий, 26 КБ) — сам мир;</li>\n<li><code>[Три энергии (тёмная, светлая, природная)](../miry/MR-0013-tri-energii-temnaya-svetlaya-prirodnaya.md)</code> «Три энергии (тёмная, светлая, природная)» (2024-06-03, 3 версии, 7 КБ) — базовый закон этого же мира, вынесенный отдельной записью. В разделе «Связано с» у <code>[Три энергии (тёмная, светлая, природная)](../miry/MR-0013-tri-energii-temnaya-svetlaya-prirodnaya.md)</code> стоят только «Колдуны, Новый мир».</li>\n</ul>\n<p><strong>Жанр и уровень.</strong> Слава определяет мир одной фразой: «Типо страшилка с приземленными силами» (175764, 2024-06-03 22:28). Миколай переспрашивает: «Страшилка?» (175766). Это единственное сказанное в переписке ограничение на масштаб сил.</p>\n<p>Действие происходит в обычном мире с людьми — это следует из завязки: «Ну типо тварь у которых темная энергия доминирует нападают на обычного гг и после этого весь мир гг переворачивается» (175768, 2024-06-03 22:30).</p>\n<p><strong>Устройство пространства в переписке не описано.</strong> Ни географии, ни стран, ни городов, ни карты, ни устройства неба и земли, ни планов бытия. Единственные пространственные указания, которые вообще прозвучали:</p>\n<ul>\n<li>места, где прячутся ночные охотники: «часто скрываться в заброшенных домах или в нелюдных местах» (175797, 2024-06-03 22:51) — потому что боятся света;</li>\n<li>ад, куда после смерти отправляется главный герой вместе с тёмными: «После свой смерть он отправится в ад вместе с темными» (176473, 2024-06-06 21:05).</li>\n</ul>\n<p>Больше никаких мест не названо. Делится ли мир на области по энергиям, где живут колдуны, есть ли у сторон территории — не сказано. Численности, государств и времени действия в переписке нет.</p>\n<p><strong>Перемещений между мирами нет вообще.</strong> Ни порталов, ни переходов, ни попаданчества, ни возвращений; тема не поднимается ни разу за все четыре вечера. Единственный названный переход куда-либо — посмертный и односторонний, тот же ад из 176473. Как устроен ад, кто там, можно ли оттуда выйти — не сказано.</p>\n<p><strong>Соседние записи с похожими названиями, которые к этой вселенной не относятся.</strong></p>\n<ul>\n<li><code>[Цветной мир](../miry/MR-0011-cvetnoy-mir.md)</code> «Цветной мир» (2024-05-25) — отдельная вселенная базы со своей системой сил (абакра, Бесцветные и Цветные). В служебном файле потерь (<code>kb/sluzhebnoe/poteri_i_neyasnosti.md</code>) отмечено, что разговор про названия начат левее края окна: в w0035 (id 174233, 2024-06-02) Слава спрашивал про «цветной мир», а в 176191 Миколай говорит про «чёрно белый мир». Соотношение этих названий в переписке не проговорено.</li>\n<li><code>новый мир (сказка о новом мире) _(статьи ещё нет — [исходник](../../kb/sushnosti/miry/MR-0128-novyy-mir-skazka-o-novom-mire.md))_</code> «новый мир (сказка о новом мире)» (вселенная «вне вселенной», 2025-03-26 — 2025-03-30, окно w0086) — другая работа спустя девять месяцев, с прямо противоположным правилом: «Там не будет не какой концепций силы( энергий) там будут другое» (311425, 2025-03-26 13:19), причина названа самим Славой: «Я просто всегда слишком сильно стараюсь развить эту энергию и забиваю на всё остальные» (311428). Основа всего там — Ом (314486, 2025-03-30 11:01), с физикой не связанный; «Жди сказку» (314491), сама сказка в архив не попала. Единственная фактическая перемычка с «Новым миром» 2024 года — Поротай и жуг, пересланные тем же текстом (311279, 2025-03-26 08:29). Что это один мир, в переписке не сказано.</li>\n</ul>", "r": [["новый мир (сказка о новом мире)", "kb/MR-0128-novyy-mir-skazka-o-novom-mire.html"], ["Новый мир", "MR-0012.html"], ["Три энергии (тёмная, светлая, природная)", "MR-0013.html"], ["Цветной мир", "MR-0011.html"]]}, {"t": "Организации и сообщества", "a": ["S03", "VS-0007-S03", "VS-0007--organizacii-i-soobschestva"], "h": "<p><strong>Организаций в узком смысле в «Новом мире» нет.</strong> Ни ордена, ни компании, ни службы, ни государства в переписке по этому миру не названо. Ни одна из 87 статей каталога групп этой вселенной не приписана. Правителей, совета, столицы, имён конкретных колдунов — тоже нет: ни один колдун, ночной охотник, провидец, серый странник или Поротай не назван по имени.</p>\n<p>Всё, что работает в мире как коллективное тело, — это виды и сословия носителей энергии; они описаны в разделе «Население и классы». Здесь — только то, как они соотносятся между собой.</p>\n<p><strong>Отношения, прямо названные в переписке.</strong></p>\n<ul>\n<li><strong>Ночные охотники → тёмные колдуны:</strong> «Часто прислуживают темным колдунам» (175797, 2024-06-03 22:51). Единственная названная в мире связь подчинения между двумя разными телами.</li>\n<li><strong>Тёмные колдуны → бестиарий:</strong> «По части новых существ будут создавать именно темный колдуны» (175773, 2024-06-03 22:32). Единственный названный механизм пополнения населения мира.</li>\n<li><strong>Низший Поротай → высший Поротай:</strong> у низшего «ты теряешь личностей и слушаещя высшего Поротая», у высшего в списке способностей — «контроль над низшими» (175810, 2024-06-03 23:08). Ступеней ровно две; старшинства среди высших, привязки конкретного низшего к конкретному высшему в переписке нет.</li>\n<li><strong>Колдуны делятся на низших и высших:</strong> «Будут низший и также вышей» (175775, 2024-06-03 22:34). Названо само деление, содержание отношения не раскрыто.</li>\n<li><strong>Главный герой → тёмные охотники и другие существа тёмной энергии:</strong> становится их хранилищем и страдает, поглощая их (176473, 2024-06-06 21:05).</li>\n</ul>\n<p><strong>Распределение по сторонам.</strong></p>\n<ul>\n<li>Тёмная сторона: тёмные колдуны, ночные охотники, твари с доминирующей тёмной энергией.</li>\n<li>Светлая сторона: светлые колдуны, провидцы («ещё один вид в сторону добра», 175864).</li>\n<li>Ни к одной из сторон: серые странники — «не принадлежащие ни к одной из сторон и преследующие свои собственные цели» (175848, принято в 175863).</li>\n<li>Природная энергия: растения и животные, то есть всё, что «не способная думать» (175790).</li>\n</ul>\n<p>Место Поротаев в этой раскладке в переписке не определено.</p>\n<p><strong>Не названо:</strong> отношения провидцев с кем бы то ни было; отношения серых странников с кем бы то ни было; отношения светлых колдунов с чем-либо, кроме их принадлежности к светлой стороне; какая-либо структура сторон помимо самого деления по энергиям.</p>\n<p><strong>Единственная организация в поле зрения — из другой вселенной.</strong> В блоке «Связано с» карточки Поротая (<code>[Поротай](../personazhi/PS-0036-porotay.md)</code>) стоит <code>[Организация, ловящая обнаглевших существ](../gruppy/GR-0053-organizaciya-lovyaschaya-obnaglevshih-suschestv.md)</code> «Организация, ловящая обнаглевших существ» (вселенная «игра бога», 2024-04-01, id 150629–150675): «типо вот есть организация которая ловит обнаглевших или совершивший преступлений существ ( при этом эти существа могут работать в этой организации)». Поимённого состава там нет ни одного человека. К «Новому миру» она в переписке не привязана — связь идёт через базу (общий вид Поротай), а не через чат.</p>\n<p><strong>Готовые сводные статьи по Поротаям тоже приписаны другим вселенным:</strong> <code>[Поротаи (низшие и высшие)](../gruppy/GR-0051-porotai-nizshie-i-vysshie.md)</code> «Поротаи (низшие и высшие)» — вселенная «игра бога»; <code>[Пророки каменные («Проротой каменный челике», Поротаи)](../gruppy/GR-0064-proroki-kamennye-prorotoy-kamennyy-chelike-porotai.md)</code> «Пророки каменные („Проротой каменный челике“, Поротаи)» — вселенная «Оам».</p>", "r": [["Организация, ловящая обнаглевших существ", "GR-0053.html"], ["Поротаи (низшие и высшие)", "GR-0051.html"], ["Пророки каменные («Проротой каменный челике», Поротаи)", "GR-0064.html"], ["Поротай", "PS-0036.html"]]}, {"t": "Население и классы", "a": ["S04", "VS-0007-S04", "VS-0007--naselenie-i-klassy"], "h": "<p><strong>Закон, по которому делится всё живое.</strong> Формула Славы (175763, 2024-06-03 22:27):</p>\n<div class=\"q\"><p>3 энергии:<br>Темная<br>Светлая<br>Природная( животным и растениям )</p>\n<p>Темная и светлая всю жизнь борется в человеке и в некоторых существ</p></div>\n<p>Принадлежность определяется способностью думать (175790, 2024-06-03 22:43): «У любого существо способный думать будет либо смесь либо темная или светлая. А если существо не способная думать то у него будет природная типо растения животный».</p>\n<h3>Обычные люди и «серые»</h3>\n<p>Отдельной записи в базе нет, но как класс люди описаны через две черты.</p>\n<p>Первая: в человеке тёмная и светлая энергия «всю жизнь борется», и исход зависит только от него самого — «У людей это борьба зависит именно от них самих типо ты не с рождения псих маньяк ты гнида стал таким лишь и за себя» (175777, 2024-06-03 22:36).</p>\n<p>Вторая: человека можно увидеть как цвет. Колдун «может сражу понять что за человек перед ним» (175778); на «Типо почувствовать?» (175779) Слава отвечает «Типо увидеть» (175780), на «Прям увидеть силу отклонения от своего типа энергии?» (175781) — «Типо увидеть цвет серый, серая белый, темная серый» (175782). Три названных оттенка: серый, серо-белый, тёмно-серый. Чистых белого и чёрного среди человеческих цветов Слава не называет.</p>\n<p>Слово «серые» как обозначение людей вне сторон появляется один раз, у Миколая, внутри отклонённого предложения: тёмные «возможно будут манипулировать серыми и делать их колдунами с нужными качествами» (175795).</p>\n<h3>Колдуны (тёмные и светлые) — <code>[Колдуны (тёмные и светлые)](../personazhi/PS-0087-kolduny-temnye-i-svetlye.md)</code>, 2024-06-03, id 175770–175799, 2 версии</h3>\n<p>Заведены Славой сразу после его же вопроса «Вот только какие именно твари темной энергий» (175770), со слова «Во первых» (175771):</p>\n<ul>\n<li>«Будут темный и светлый колдуны ( ну который будут мега сильный не все но именно они будут двигать сюжет создавая новых существ или т.п)» (175772, 22:32);</li>\n<li>«По части новых существ будут создавать именно темный колдуны» (175773, 22:32);</li>\n<li>«И вот эти колдуны способный управлять энергий их будет немного но они будут» (175774, 22:33);</li>\n<li>«Будут низший и также вышей» (175775, 22:34).</li>\n</ul>\n<p>Условие членства (175777, 22:36): «Колдуны чтобы полностью владеть энергий должны отдаться одному типу энергий». Это и отличает колдуна от человека: у человека две энергии борются всю жизнь, колдун отдался одной целиком.</p>\n<p>Служебная способность сословия — видеть цвет собеседника (175778–175782, разобрано выше).</p>\n<p>Свита тёмных колдунов — ночные охотники (175797).</p>\n<p>Прямо в этом же месте Миколай спрашивает (175776, 22:34): «Ты ещё определяешь многих чистыми цветами. Тобиж они не имеют другого типа энергии? Это люди? Колдуны - люди?» — прямого ответа в чате нет; в карточке <code>[Колдуны (тёмные и светлые)](../personazhi/PS-0087-kolduny-temnye-i-svetlye.md)</code> это стоит в «Неясностях». Чем низший колдун отличается от высшего, тоже не сказано: названо только само деление. Численность — только «их будет немного».</p>\n<p>После введения колдунов Слава ставит задачу на весь остаток вечера: «И здесь вопрос каких существ запихать в темную сторону или светлую или как людей смесь» (175783), «Типо надо существ придумывать» (175784). Миколай уточняет, о чём речь: «Какое-то такое чудо, но более страшное внешка, хорорнаяю иль ты по их характеристики спрашиваешь?» (175785); Слава: «Ну вообще и про внешку и про особенный черты» (175786). Дальше весь бестиарий появляется как ответ на эту постановку.</p>\n<h3>Ночные охотники (они же тёмные охотники) — <code>[Ночные охотники](../personazhi/PS-0088-nochnye-ohotniki.md)</code>, 2024-06-03 и 2024-06-06, 2 версии</h3>\n<p>Полное описание дано одним сообщением (175797, 2024-06-03 22:51):</p>\n<div class=\"q\"><p>Ночные охотники существо сотканный из темный энергий ( выглядят по разному ) питается людьми и страхами и болью<br>У них особо каких либо сверх сил сил не будет чисто физическая сила и уникальный строения тела типо крылья, многорукий, многоногий, большой рот и т.п<br>Часто прислуживают темным колдунам<br>Бояться света ( он их не убивает а лишь причиняет невыносимую боль )<br>Поэтому часто скрываться в заброшенных домах или в нелюдных местах</p></div>\n<p>По признакам: происхождение — сотканы из тёмной энергии, не мутанты и не бывшие люди; облик единый отсутствует, «выглядят по разному», вместо него набор возможных особенностей строения — крылья, много рук, много ног, большой рот; питание — люди, страхи и боль, три вещи в одном ряду; сверхспособностей нет, только физическая сила и строение тела (единственный класс, про который прямо сказано, что сверхсил нет); уязвимость — свет, «он их не убивает а лишь причиняет невыносимую боль»; отсюда поведение — прячутся в заброшенных домах и нелюдных местах; место в иерархии — прислуга тёмных колдунов.</p>\n<p>Реакция Миколая: «О, вот подпитка идея классная» (175798).</p>\n<p>Второе появление — 6 июня, где они названы «тёмными охотниками» и становятся содержимым главного героя (176473).</p>\n<h3>Провидцы — <code>[Провидцы](../personazhi/PS-0089-providcy.md)</code>, 2024-06-04, id 175862–175866, 1 версия</h3>\n<p>Добавлены Славой утром 4 июня, сразу после отбраковки большого списка существ, одной репликой (175864, 07:01):</p>\n<div class=\"q\"><p>Ещё один вид в сторону добра провидцы вымирающий вид ( потому что они сходят с ума из за своей способности и по итогу чаще всего заканчиваются суицидом )<br>Их способность петля времени ( надеюсь ты не забыл )</p></div>\n<p>Сторона — добро; статус — вымирающий вид; причина вымирания — не война и не гонения, а собственная способность. Численность, устройство, какая-либо организация — не сказано. Реакции Миколая на провидцев в окне нет.</p>\n<p>Про «петлю времени» см. «Система способностей»: Слава ссылается на неё как на уже известную, в этом окне она не разворачивается.</p>\n<h3>Серые странники — <code>[Серые странники](../personazhi/PS-0090-serye-stranniki.md)</code>, 2024-06-04, id 175845–175866, 1 версия</h3>\n<p>Единственный нейтральный класс мира и единственный пункт, вошедший в мир из большого списка. Формулировка:</p>\n<div class=\"q\"><p>Серые странники - загадочные существа, не принадлежащие ни к одной из сторон и преследующие свои собственные цели.</p></div>\n<p>История записи: ночью 4 июня в 01:49 Миколай присылает список существ (175848), после паузы в 5,2 часа Слава отвечает в 07:00 одной строкой — «Чёт ничего не понравилась кроме серых странников» (175863). Из пятнадцати предложенных существ в мир вошло ровно одно.</p>\n<p>Оговорка базы, которую надо держать вместе с текстом: формулировка пришла из машинной вставки 175848 (в служебном файле <code>mashinnye_vstavki.md</code> вставка помечена по признаку сервильного обращения к автору на «вы»), но принята автором в 175863 — берётся как материал с оговоркой.</p>\n<p>Больше про серых странников в переписке ничего нет: ни облика, ни целей, ни отношений с кем бы то ни было.</p>\n<h3>Отбракованный список существ (2024-06-04 01:49, id 175848)</h3>\n<p>Единственный сводный список состава в мире, пятнадцать позиций по трём сторонам. Приводится целиком, потому что показывает, как задумывалась расстановка сторон, и потому что четырнадцать пунктов из пятнадцати были отвергнуты одной репликой.</p>\n<p>Тёмная сторона:</p>\n<ol>\n<li>Тенеморфы — существа, созданные тёмными колдунами, которые могут принимать облик теней и проникать в самые защищённые места.</li>\n<li>Кошмарные твари — порождения страхов и негативных эмоций, вызывающие ужас и отчаяние у своих жертв.</li>\n<li>Некромантские слуги — оживлённые трупы или скелеты, подчиняющиеся воле своих создателей.</li>\n<li>Энергетические вампиры — существа, питающиеся жизненной силой и эмоциями других, ослабляя их.</li>\n<li>Тёмные шифтеры — оборотни или метаморфы, способные принимать облик других существ для обмана и проникновения.</li>\n</ol>\n<p>Светлая сторона:</p>\n<ol>\n<li>Целители — существа с мощными способностями к исцелению и восстановлению.</li>\n<li>Светящиеся стражи — создания из чистой светлой энергии, защищающие невинных и борющиеся со злом.</li>\n<li>Мудрые древни — древовидные существа, обладающие глубокими знаниями.</li>\n<li>Звёздные духи — эфемерные создания, связанные с небесными телами, помогают в навигации и предсказаниях.</li>\n<li>Животные-компаньоны — звери с повышенным интеллектом, служащие верными спутниками.</li>\n</ol>\n<p>Смешанные или нейтральные:</p>\n<ol>\n<li>Серые странники — загадочные существа, не принадлежащие ни к одной из сторон и преследующие свои собственные цели.</li>\n<li>Стихийные духи — воплощения природных сил (огонь, вода, земля, воздух), чьё отношение зависит от обстоятельств.</li>\n<li>Механические конструкты — искусственные создания с разумом и свободой воли.</li>\n<li>Космические сущности — древние и могущественные создания, чьи мотивы не всегда понятны смертным.</li>\n<li>Полукровки — существа, рождённые от союза представителей разных рас или носителей разных энергий, вынужденные искать баланс внутри себя.</li>\n</ol>\n<p>Приговор (175863, 2024-06-04 07:00): «Чёт ничего не понравилась кроме серых странников». Остальные четырнадцать в мир не вошли и отдельными записями в базе не заведены.</p>\n<h3>Поротай: низший и высший — <code>[Поротай](../personazhi/PS-0036-porotay.md)</code>, 9 версий, 38 КБ</h3>\n<p>Самая крупная запись из попавших в «Новый мир». Придуман 2024-04-02 (id 152575, окно w0029), в «Новый мир» не разрабатывался, а перенесён пересылкой готовой карточки.</p>\n<p>Как это произошло: 3 июня, посреди перебора существ, Слава спрашивает «Помнишь про каменных существ» (175807, 22:58); Миколай — «Неа😅» (175808), «Напомнишь?» (175809); в 23:08 Слава пересылает старый текст без изменений (175810), следом «Я спать» (175811), Миколай — «Окей, добрых снов» (175812) и «Ааа, вспомнил» (175813). Никакого разбора не было.</p>\n<p>Пересланный текст (175810, он же 152575, он же 311279, он же 366035 — за полтора года не изменившийся ни в одном слове):</p>\n<div class=\"q\"><p>Придумал один вид Поротай<br>Короче есть жуг ты его съедаеш и у тебя 3 варианта<br>1) смерть , все твои внутренности превращаются в камень и отказывают<br>2) превращаются в низший Поротай (горбатого двух лицого, полукаменного-полуплоти , и ты теряешь личностей и слушаещя высшего Поротая ) способности крепкость, реген, сверхсила<br>3) превращается высшего Поротая сохраняешь свой человеческий образ и личность. Способности реген, контроль над низшими, превращать части тела в твердый камень , сверхчеловеческая сила<br>Дебафф у тебя появляется вторая личность жестокая, кровожадная , алочная и т.д.<br>И она составляет чаще всего становится жестоким кровожадным и т.д</p></div>\n<p><strong>Низший Поротай.</strong> Горбатый, двулицый, полукаменный-полуплоть. Теряет личность и слушается высшего. Способности: крепкость, реген, сверхсила.</p>\n<p><strong>Высший Поротай.</strong> Сохраняет свой человеческий образ и личность. Способности: реген, контроль над низшими, превращать части тела в твёрдый камень, сверхчеловеческая сила. Дебафф — вторая личность, «жестокая, кровожадная, алочная», и она чаще всего берёт верх.</p>\n<p>Соотношение ступеней Слава формулирует прямо (152603, 2024-04-02): «Поротая низший владеет почти идентичными способностями Поротая высшего вот поэтому я думал может ещё че добавить». То есть разница не в наборе сил, а в личности и подчинении.</p>\n<p>Поимённого состава нет: ни один конкретный Поротай не назван. Численность вида и соотношение низших к высшим не названы.</p>\n<p><strong>Принадлежность Поротаев к «Новому миру» под вопросом у самой базы:</strong> «Неясно, переносится ли Поротай именно в 'Новый мир' с тремя энергиями или просто вспоминается как старая наработка» (неясность окна w0036). К какой из трёх энергий Поротаи относятся — тёмной, светлой или смеси — в переписке не сказано.</p>\n<p>Отдельные записи «Низший Поротай» (<code>[Низший Поротай](../personazhi/PS-0294-nizshiy-porotay.md)</code>) и «Высший Поротай» (<code>[Высший Поротай](../personazhi/PS-0295-vysshiy-porotay.md)</code>) в базе есть, но обе датированы 2025-09-17 (окно w0105) и помечены вселенной «неясно» — к «Новому миру» не приписаны. Остальное содержимое карточки Поротая (апостолы, Азуриэль, аскизы, дети мирового древа, вампиры, частицы Оам) относится к вселенным «Оам», «игра бога» и «неясно».</p>\n<h3>Главный герой — <code>[ГГ-хранилище тёмных существ](../personazhi/PS-0091-gg-hranilische-temnyh-suschestv.md)</code> «ГГ-хранилище тёмных существ», 2 версии</h3>\n<p>Первое упоминание — в завязке (175768, 2024-06-03 22:30): «тварь у которых темная энергия доминирует нападают на обычного гг и после этого весь мир гг переворачивается». ГГ обычный, мир переворачивается после нападения.</p>\n<p>Роль сформулирована перед сном 6 июня, начиная с «А кстати гг» (176471, 21:02), дальше (176473, 21:05):</p>\n<div class=\"q\"><p>Он станет хранилищем темных охотником и других существ с темной энергии ( потому что владелец темный энергий перерождаться или в некоторым роде бессмертный, ну то бишь как проклятий в магичке)<br>И он будет страдать поглощая их<br>После свой смерть он отправится в ад вместе с темными</p></div>\n<p>Сравнение авторское — «как проклятий в магичке». Обсуждение мира заканчивается на этом: «Спокойной ночи или доброй утро» (176475), «Хорошо, добрых снов и прекрасного утра» (176476), «Продуктивного завтра» (176477). Дальше мир в переписке не появляется.</p>\n<p>Обычный ли ГГ человек или колдун, как он получил способность поглощать, есть ли предел вместимости — не сказано.</p>\n<h3>Фигуры, классом не являющиеся</h3>\n<ul>\n<li><strong>Персонаж «конченый человек»</strong> (<code>[Персонаж «конченый человек»](../personazhi/PS-0092-personazh-konchenyy-chelovek.md)</code>, 2024-06-03, id 175744–175749) — нарисованный Миколаем персонаж, разобранный в разделе «Зарождение». Имя не названо, сюжет в окне не появляется, связь с системой энергий и с ГГ-хранилищем не проговорена.</li>\n<li><strong>Ваёль</strong> (<code>[Ваёль](../personazhi/PS-0093-vael.md)</code>) и <strong>Вика</strong> (<code>[Вика](../personazhi/PS-0094-vika.md)</code>), 2024-06-07, id 176753 — герои отдельной истории Миколая про музыканта (под ником юзер764) и его фанатку. К устройству мира отношения не имеют, хотя в базе приписаны той же вселенной. Проза — <code>[История Ваёля и Вики (начало)](../proza/PR-0015-istoriya-vaelya-i-viki-nachalo.md)</code> «История Ваёля и Вики (начало)», помечено как обрывок; единственная запись в разделе прозы вселенной.</li>\n</ul>\n<h3>Записи, приписанные вселенной по дате, но не относящиеся к устройству мира</h3>\n<p><code>[Поиск людей по имени со стены](../istorii/IS-0014-poisk-lyudey-po-imeni-so-steny.md)</code> «Поиск людей по имени со стены» (2024-06-14) — сюжетная задумка Миколая, про которую Слава прямо уточняет, что это повседневность без ужасов и сверхспособностей; <code>Сумасшедший, который любит жизнь _(статьи ещё нет — [исходник](../../kb/sushnosti/idei/ID-0070-sumasshedshiy-kotoryy-lyubit-zhizn.md))_</code> «Сумасшедший, который любит жизнь» (2024-06-11) — разбор скетчей; <code>Задание на скетчи (3 вещи) _(статьи ещё нет — [исходник](../../kb/sushnosti/zametki/SL-0014-zadanie-na-sketchi-3-veschi.md))_</code> «Задание на скетчи (3 вещи)», <code>Как идёт создание: анализ, потом синтез _(статьи ещё нет — [исходник](../../kb/sushnosti/zametki/SL-0015-kak-idet-sozdanie-analiz-potom-sintez.md))_</code> «Как идёт создание: анализ, потом синтез», <code>Роли в соавторстве _(статьи ещё нет — [исходник](../../kb/sushnosti/zametki/SL-0016-roli-v-soavtorstve.md))_</code> «Роли в соавторстве» (2024-06-10 — 2024-06-14) — рабочие договорённости соавторов.</p>\n<p>Из <code>Роли в соавторстве _(статьи ещё нет — [исходник](../../kb/sushnosti/zametki/SL-0016-roli-v-soavtorstve.md))_</code> (2024-06-14) к делу относится одно: Слава про себя говорит, что фантазии не хватит, он всегда придумывал чисто лор и основу, а саму историю не двигал; Миколай отвечает, что делится идеей, а реализовать хочет сам. Это совпадает с тем, как распределён материал по миру: механика, виды и правила — Славины, а предложения Миколая (утилитарная призма, пожиратели свежих мертвецов, растущие от доброты, магия из мечты, список из пятнадцати существ) либо отклонены, либо оставлены без ответа; принят один пункт — серые странники.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Третье — куст без статей: <code>ID-0067</code>, <code>ID-0068</code>, <code>ID-0069</code>, <code>ID-0070</code>, <code>SL-0014</code>, <code>SL-0015</code>, <code>SL-0016</code>. Поодиночке по одной ссылке, вместе — около 25 КБ базы и семь мест, куда статья вселенной отсылает читателя в пустоту. <code>SL-0016</code> («Роли в соавторстве») здесь важнее прочих: на нём держится вывод раздела о том, как распределён материал между соавторами.</p></div>", "r": [["который любит жизнь", "kb/ID-0070-sumasshedshiy-kotoryy-lyubit-zhizn.html"], ["Задание на скетчи (3 вещи)", "kb/SL-0014-zadanie-na-sketchi-3-veschi.html"], ["потом синтез", "kb/SL-0015-kak-idet-sozdanie-analiz-potom-sintez.html"], ["Роли в соавторстве", "kb/SL-0016-roli-v-soavtorstve.html"], ["Колдуны (тёмные и светлые)", "PS-0087.html"], ["Ночные охотники", "PS-0088.html"], ["Провидцы", "PS-0089.html"], ["Серые странники", "PS-0090.html"], ["Поротай", "PS-0036.html"], ["Низший Поротай", "PS-0294.html"], ["Высший Поротай", "PS-0295.html"], ["ГГ-хранилище тёмных существ", "PS-0091.html"], ["Персонаж «конченый человек»", "PS-0092.html"], ["Ваёль", "PS-0093.html"], ["Вика", "PS-0094.html"], ["Поиск людей по имени со стены", "IS-0014.html"], ["История Ваёля и Вики (начало)", "PR-0015.html"]]}, {"t": "Система способностей", "a": ["S05", "VS-0007-S05", "VS-0007--sistema-sposobnostey"], "h": "<p><strong>Рамка, ограничивающая уровень сил.</strong> «Типо страшилка с приземленными силами» (175764, 2024-06-03 22:28) — единственное сказанное в переписке ограничение на масштаб сил. Больше жанр не обсуждается.</p>\n<h3>Три энергии — базовый закон (<code>[Три энергии (тёмная, светлая, природная)](../miry/MR-0013-tri-energii-temnaya-svetlaya-prirodnaya.md)</code>, 2024-06-03, id 175759–175793, 3 версии за один вечер)</h3>\n<p>Закон задан одним сообщением (175763, 22:27): три энергии — тёмная, светлая, природная («животным и растениям»); «Темная и светлая всю жизнь борется в человеке и в некоторых существ».</p>\n<p>Признак, по которому существо получает ту или иную энергию, — способность думать (175790, 22:43): мыслящие получают тёмную, светлую или смесь; немыслящие (названы растения и животные) — природную.</p>\n<p>Миколай на первое изложение отвечает: «Агась, ну неплохая концепция. Типо инь и янь да. А как происходит доминация, за счет чего» (175765). На аналогию Слава не отвечает — отвечает на вопрос про доминацию.</p>\n<p>Что природная энергия даёт своему носителю, как она работает и можно ли ею пользоваться — не сказано: она названа один раз в 175763 и один раз в 175790 и больше нигде не появляется. Откуда сами энергии взялись, кто их создал, есть ли у них источник — вопрос не задавался.</p>\n<h3>Доминация: борьба внутри человека</h3>\n<p>Миколай задаёт вопрос дважды — коротко (175765) и развёрнуто (175776, 22:34): «Ну ты говоришь что в человеке борятся две энергии внутри и как по мне для начала стоит разобраться как эта борьба происходит и под какой призмой на всё это смотреть. И как идёт доминация одной силы над другой. Ты ещё определяешь многих чистыми цветами. Тобиж они не имеют другого типа энергии? Это люди? Колдуны - люди?»</p>\n<p>Ответ Славы (175777, 22:36): «У людей это борьба зависит именно от них самих типо ты не с рождения псих маньяк ты гнида стал таким лишь и за себя».</p>\n<p>Это единственная в переписке формулировка механизма доминации. Никакого другого фактора — наследственность, обряд, внешнее заражение — для людей не названо. Как эта борьба выглядит изнутри, что происходит с человеком в момент перевеса, можно ли отыграть назад — не обсуждалось. Развёрнутого ответа на «как идёт доминация одной силы над другой» в переписке нет.</p>\n<h3>Владение энергией: колдуны</h3>\n<p>Единственный класс, который управляет энергией. Их немного, они «мега сильный» — с оговоркой «не все», и «именно они будут двигать сюжет создавая новых существ или т.п» (175772). Создание новых существ закреплено за тёмными колдунами (175773). Внутри — низшие и высшие (175775), различие не описано.</p>\n<p><strong>Цена владения</strong> (175777): «Колдуны чтобы полностью владеть энергий должны отдаться одному типу энергий». Это единственное названное условие доступа к силе. Формулировка «полностью владеть» оставляет открытым, возможно ли неполное владение без отдачи одному типу; это не обсуждается. Как человек становится колдуном — каждый ли на это способен, есть ли обряд или порог — не сказано.</p>\n<p><strong>Восприятие чужой энергии.</strong> Из условия отдачи одному типу способность выводится напрямую (175778): «По этому колдуны могут сражу понять что за человек перед ним». Модальность уточняется в два захода: «Типо почувствовать?» (175779) — «Типо увидеть» (175780); «Прям увидеть силу отклонения от своего типа энергии?» (175781) — «Типо увидеть цвет серый, серая белый, темная серый» (175782). Шкала названа тремя позициями и до чистого белого и чистого чёрного не доведена.</p>\n<h3>Существа, сотканные из энергии</h3>\n<p>Единственный вид, целиком сделанный из энергии, — ночные охотники (175797). По механике: существо не получает энергию, оно из неё соткано; питается людьми, страхами и болью (Миколай отдельно отмечает: «О, вот подпитка идея классная», 175798); сверхсил «особо каких либо не будет» — только физическая сила и уникальное строение тела, что согласуется с рамкой приземлённых сил; ограничение — свет, который не убивает, а причиняет невыносимую боль, и из ограничения прямо выведено поведение (прячутся).</p>\n<h3>Способность как причина вымирания: провидцы</h3>\n<p>«Ещё один вид в сторону добра провидцы вымирающий вид ( потому что они сходят с ума из за своей способности и по итогу чаще всего заканчиваются суицидом )» (175864, 2024-06-04 07:01). Единственный случай в мире, где цена силы названа прямо и убивает носителя: вид вымирает не от врагов, а от собственных суицидов.</p>\n<p>Сама способность названа отсылкой: «Их способность петля времени ( надеюсь ты не забыл )». В окне «Нового мира» механика не разворачивается; карточка <code>[Провидцы](../personazhi/PS-0089-providcy.md)</code> помечает, что разработка лежит в более ранних окнах. Ближайшие по имени записи базы: <code>[отмотка времени (петля)](../sposobnosti/SP-0050-otmotka-vremeni-petlya.md)</code> «отмотка времени (петля)» (2024-03-29, окно w0028, id 149905, вселенная помечена как «неясно») — носитель отматывает время на 10 секунд и снова и снова застревает в этих 10 секундах как в петле времени, пока не проживёт 10000 отмоток; остановить он это не может, «Вот поэтому он немного ненормальный»; и <code>[Петля](../sposobnosti/SP-0051-petlya.md)</code> «Петля» (2024-04-02, id 151858, вселенная «игра бога») — «перемотка времени на 10 секунд 10000 раз». Что Слава имел в виду именно это, в переписке не сказано — отождествление не проговорено.</p>\n<h3>Второй, независимый канал получения сил: жуг и Поротай</h3>\n<p>Отдельно от энергий стоит механика Поротаев (<code>[Жуг](../sposobnosti/SP-0052-zhug.md)</code> «Жуг», 3 версии, 2024-04-02 — 2025-03-26; текст карточки — в разделе «Население и классы»).</p>\n<p><strong>Как получают.</strong> Через поедание: съел жуг — сработал бросок на три исхода. Никакого выбора, обучения или отдачи одному типу энергии здесь нет.</p>\n<p><strong>Цена и риск.</strong> Первый из трёх исходов — смерть, описанная физиологически: «все твои внутренности превращаются в камень и отказывают». Вероятности исходов не названы.</p>\n<p><strong>Дебафф.</strong> У высшего появляется вторая личность — жестокая, кровожадная, алчная, — и носитель чаще всего сам становится жестоким, кровожадным и так далее. Единственный случай в материале, когда сила прописана с явным словом «дебафф».</p>\n<p><strong>Что такое жуг сам по себе — не сказано.</strong> Существо, гриб, предмет, плод — не определено; база фиксирует эту дыру трижды, по разу на каждое окно (w0029, w0036, w0086). В более поздних окнах, уже вне «Нового мира», Слава называет его жуком (w0105, 2025-09-17), каменным жуком (w0105, 2025-09-18, id 366585) и мутировавшим жуком (w0107, 2025-10-20, id 376401). В самом «Новом мире» это остаётся просто «жуг».</p>\n<p><strong>Нерешённый вопрос по балансу разрядов.</strong> Ещё в апрельском окне w0029 Слава спрашивает: «Какую ещё способность добавить к выше Поротаем» (152576, 2024-04-02 18:52). Миколай возражает (152599, 20:13): «Ты точно чет хочешь добавить у Поротая как по мне и так много способностей, а концепцию ты придумал, в чем вопрос не пон🤔». Слава объясняет причину (152603, 20:18): «Поротая низший владеет почти идентичными способностями Поротая высшего вот поэтому я думал может ещё че добавить. Концепцию та я придумал ну ты можешь туда что нибудь добавить типо объект или вид или способность или т.д». Дополнительная способность высшему так и не была придумана — ни в апреле, ни в июне.</p>\n<p><strong>Связь Поротаев с тремя энергиями не установлена.</strong> Разговор об этом не заходил: сразу после пересылки карточки Слава пишет «Я спать» (175811).</p>\n<h3>Свойство тёмной энергии: перерождение и хранилище</h3>\n<p>Из роли ГГ (176473, 2024-06-06 21:05) следует ещё одно общее свойство, не сказанное больше нигде: <strong>владелец тёмной энергии перерождается или в некотором роде бессмертен</strong> — «ну то бишь как проклятий в магичке». Именно из этого выведена необходимость хранилища: тёмных существ нельзя убить окончательно, поэтому их поглощает и носит в себе ГГ. Цена названа прямо: он будет страдать, поглощая их, и после смерти отправится в ад вместе с тёмными.</p>\n<h3>Предложенное и не вошедшее</h3>\n<p><strong>Утилитарная призма для тёмных и светлых (<code>Утилитарная призма для тёмных и светлых _(статьи ещё нет — [исходник](../../kb/sushnosti/idei/ID-0066-utilitarnaya-prizma-dlya-temnyh-i-svetlyh.md))_</code>, 2024-06-03 22:50, id 175795) — отклонена.</strong> Единственная попытка подвести под стороны мотивационное основание. Миколай спрашивает разрешения: «А можно я тогда предложу свою нынешнюю теорию которую я пропагандирую» (175793); Слава: «Какую» (175794). Ответ (175795):</p>\n<div class=\"q\"><p>Типа утилитарная теория не моя, но к ней я пришел сам из-за ситуации внешней. В общем потрахаться лучше чем убить или умереть. Типо лучше больше людей или столько же, чем меньше или самому умереть(в любом случае меньше). Естественно в первом случае отвергается любое противозаконное действие. А второе в любом случае идёт против законов.</p>\n<p>Ну и с этой призмы светлые будут стараться завести семью и распространить здоровые принципы, а вот темные будут стараться либо убить как можно больше, либо умереть как можно быстрее, возможно будут манипулировать серыми и делать их колдунами с нужными качествами. И всё это будет ярко отражаться на их жизни ибо они этим дышат</p></div>\n<p>Внутри предложения содержится единственный названный во всём материале механизм пополнения сословия колдунов: тёмные манипулируют серыми и делают их колдунами с нужными качествами. Он отклонён вместе со всем остальным.</p>\n<p>Отказ: «Чёт мне это идея не нравится» (175799, 22:53). Миколай сворачивает тему: «Ну, так и думал» (175800), «А бля» (175801), «Прости» (175802), «Ну тогда забыли» (175803). Мотивации сторон так и остались неописанными, замены не предложено.</p>\n<p>Оговорка по порядку реплик: между предложением (175795) и отказом (175799) стоят два сообщения — описание ночных охотников от Славы (175797) и похвала Миколая подпитке (175798). База относит отказ к утилитарной призме (в навигации <code>Утилитарная призма для тёмных и светлых _(статьи ещё нет — [исходник](../../kb/sushnosti/idei/ID-0066-utilitarnaya-prizma-dlya-temnyh-i-svetlyh.md))_</code>: «Миколай предлагает мотивационную рамку для сторон (175795), Слава отказывается (175799), тему сворачивают»), и сам Миколай понял его так же. К чему относится «эта идея» буквально — в переписке не уточнено.</p>\n<p><strong>Пожиратели свежих мертвецов (<code>Пожиратели свежих мертвецов (переосмысленные вампиры) _(статьи ещё нет — [исходник](../../kb/sushnosti/idei/ID-0067-pozhirateli-svezhih-mertvecov-pereosmyslennye-vampiry.md))_</code>, 2024-06-03 22:56, id 175805) — брошено без ответа.</strong> Слава просит (175804, 22:54): «И каких существ ещё можно добавить типо вампиров или оборотней только видео измененный концепт». Миколай отвечает: «Ну вампиры например охотятся на живых и сосут кровь, а эти только на свежих мёртвых, потому что хрупкие, и кровь пить будут отрывая конечности и делать это прилюдно чтобы была подпитка мощная». Механика держится на трёх сдвигах: добыча — не живые, а свежие мёртвые; причина — хрупкость самих существ; способ — отрывание конечностей и обязательная публичность, потому что она даёт мощную подпитку. Реакции Славы в окне нет: через две минуты он переключается на каменных существ.</p>\n<p><strong>Существа, растущие от чужой доброты (<code>Существа, растущие от чужой доброты _(статьи ещё нет — [исходник](../../kb/sushnosti/idei/ID-0068-suschestva-rastuschie-ot-chuzhoy-dobroty.md))_</code>, 2024-06-03 22:58, id 175806) — брошено без обсуждения.</strong> «И ещё похожих на обычных людей добавить можно, живущих в обществе, но если к ним люди проявят светлую сторону, они увеличатся и станут похожими на медведя». Механика: чужая проявленная светлая сторона работает как источник роста существа. Следующим сообщением Слава меняет тему на каменных существ.</p>\n<p><strong>Магия появляется из мечты (<code>Магия появляется из мечты _(статьи ещё нет — [исходник](../../kb/sushnosti/idei/ID-0069-magiya-poyavlyaetsya-iz-mechty.md))_</code>, 2024-06-11 09:06, id 178748, окно w0037) — без ответа.</strong> Миколай проговаривает общее правило происхождения способностей: «Щас назову примитивную и дохуя раз обсосаную тему. Магия появляется из мечты. Хотел человек огонь, хотел чтобы его было больше, хотел чтобы он обрёл такую форму. Вот и появился фаербол например. И другие способности также. Ну я уверен ты всё это учитываешь конечно, но напомнить базу никогда не поздно 😅» — и предлагает метод: «Есть какие-то мечты у тебя или ты увидел что кто-то чего-то желает, пробуй дать этому форму. Тогда может быть родится интересная способность». Схема: желание → форма → способность; предложено как рабочий метод придумывания способностей, а не как закон мира. Слава не отвечает — разговор уходит на скетчи. Карточка помечает: вселенная в сообщении не названа, автор сам называет тему «примитивной и дохуя раз обсосаной», то есть возможен повтор более раннего разговора вне окна.</p>\n<p><strong>Предложение наработать сюжет.</strong> «Можно в формате копипасты наработать тогда сюжетик» (175767, 2024-06-03 22:30) — не подхвачено; в файле потерь помечено как обрывок без продолжения.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · С чего начать — не материал авторов</b>\n<p>Почти всё в базе, и разъехалось оно предсказуемо. Призма — <code>ID-0066</code>, отказ по ней стоит в 175799, окно w0036. Сказка 2025 года — <code>MR-0128</code>, окно w0086 (2025-03-26 — 2025-03-31, id 311277–314703), пересылка Поротая там же, 311279. Петля времени, на которую Слава ссылается как на уже известную, — <code>SP-0050</code> и <code>SP-0051</code>, оба вне этой вселенной; отождествление надо либо провести, либо явно отклонить.</p></div>", "r": [["Утилитарная призма для тёмных и светлых", "kb/ID-0066-utilitarnaya-prizma-dlya-temnyh-i-svetlyh.html"], ["Пожиратели свежих мертвецов (переосмысленные вампиры)", "kb/ID-0067-pozhirateli-svezhih-mertvecov-pereosmyslennye-vampiry.html"], ["растущие от чужой доброты", "kb/ID-0068-suschestva-rastuschie-ot-chuzhoy-dobroty.html"], ["Магия появляется из мечты", "kb/ID-0069-magiya-poyavlyaetsya-iz-mechty.html"], ["Провидцы", "PS-0089.html"], ["отмотка времени (петля)", "SP-0050.html"], ["Петля", "SP-0051.html"], ["Жуг", "SP-0052.html"], ["Три энергии (тёмная, светлая, природная)", "MR-0013.html"]]}, {"t": "Пробелы", "a": ["S06", "VS-0007-S06", "VS-0007--probely"], "h": "<div class=\"gaps\"><p><strong>Про сам мир и его границы</strong></p>\n<ol>\n<li><strong>Кончина не объявлена.</strong> Ни одного события типа «закрытие» в карточке нет, ни одной цитаты, где кто-то из авторов сворачивает мир. Правая граница единственного отрезка — 2024-06-17 — стоит без объявления и без процитированного сообщения; чем она поставлена, в файле не сказано. Что произошло после 2024-06-17 и было ли вообще что-то сказано — неизвестно. Возвратов тоже не зафиксировано.</li>\n<li><strong>Мир оборван на середине.</strong> Последняя запись по существу — роль ГГ 2024-06-06 (176473); после этого к «Новому миру» не возвращались.</li>\n<li><strong>Имени у мира нет.</strong> Слава зовёт его «Новый мир» (175722, 175759), Миколай — «чёрно белый мир» (176191). Совпадение обозначений прямо не подтверждено; на вопрос 176191 Слава не ответил, Миколай сам перевёл тему на свой ролик (176192).</li>\n<li><strong>Соотношение с «цветным миром»</strong> из более раннего окна (w0035, id 174233, 2024-06-02) не проговорено.</li>\n<li><strong>Почему первое «Новый мир» (175722) осталось без реакции</strong> — не объяснено; известно только, что Миколай заметил это позже: «Ты уже второй раз пишешь» (175762).</li>\n<li><strong>Связь рисунка и персонажа «конченый человек» с самим миром</strong> не проговорена: слова «Новый мир» вставлены посреди разговора о рисунке, но автор не сказал, что мир вырос именно из него.</li>\n<li><strong>Что было до вселенной — не сказано.</strong> Шапка тянет даты с 2024-04-02, с этой даты числятся Поротай и Жуг, но как они относятся к «Новому миру» и что предшествовало объявлению, в цитатах не объяснено.</li>\n<li><strong>Устройства пространства нет вовсе</strong>: ни географии, ни государств, ни времени действия, ни численности классов. Перемещение между мирами не обсуждалось ни разу.</li>\n<li><strong>Устройство ада</strong>, куда ГГ отправляется после смерти, и механика «перерождения / бессмертия» владельца тёмной энергии не раскрыты.</li>\n<li><strong>Сюжета нет.</strong> Предложение «наработать сюжетик» (175767) не подхвачено; последнее сказанное о сюжете — роль ГГ (176473).</li>\n</ol>\n<p><strong>Про энергии и силы</strong></p>\n<ol start=\"11\">\n<li><strong>Природная энергия</strong> названа дважды (175763, 175790) и не раскрыта: что даёт, как проявляется, могут ли ею пользоваться; носителей-персонажей нет.</li>\n<li><strong>Происхождение самих трёх энергий</strong> не обсуждалось.</li>\n<li><strong>Механика доминации</strong> описана только через «зависит именно от них самих» (175777); на прямой вопрос Миколая «как идёт доминация одной силы над другой» (175776) развёрнутого ответа нет.</li>\n<li><strong>Шкала цветов</strong> оборвана на трёх позициях — серый, серо-белый, тёмно-серый (175782). Есть ли чистый белый и чистый чёрный, соответствуют ли им колдуны, отдавшиеся одному типу, — не сказано, хотя сам Миколай в 175776 замечает, что Слава «определяет многих чистыми цветами».</li>\n<li><strong>Как человек становится колдуном</strong> — кроме условия «отдаться одному типу энергий» (175777), не сказано ничего: каждый ли на это способен, есть ли обряд или порог. Единственный названный механизм пополнения (тёмные манипулируют серыми и делают их колдунами) входил в отклонённую утилитарную призму, и считать ли его действующим — нерешено.</li>\n</ol>\n<p><strong>Про классы и существ</strong></p>\n<ol start=\"16\">\n<li><strong>Колдуны — люди или нет.</strong> Вопрос задан прямо (175776), ответа в чате нет; помечено в неясностях <code>[Колдуны (тёмные и светлые)](../personazhi/PS-0087-kolduny-temnye-i-svetlye.md)</code>.</li>\n<li><strong>Низшие и высшие колдуны.</strong> Деление объявлено одной строкой (175775), различие не описано вообще.</li>\n<li><strong>Численность</strong> любого тела не названа: только «их будет немного» про колдунов и «вымирающий вид» про провидцев.</li>\n<li><strong>Поимённого состава нет нигде.</strong> Ни ГГ, ни один колдун, охотник, провидец, серый странник или Поротай в переписке не назван по имени.</li>\n<li><strong>Серые странники ничем не обвязаны:</strong> ни облика, ни целей, ни отношений с другими классами. Плюс оговорка базы про машинную вставку 175848, принятую автором в 175863.</li>\n<li><strong>Провидцы ни с кем в отношения не поставлены</strong>, в том числе со светлыми колдунами. Их <strong>«петля времени»</strong> названа как уже известная («надеюсь ты не забыл», 175864), в окне не разворачивается; отождествление с <code>[отмотка времени (петля)](../sposobnosti/SP-0050-otmotka-vremeni-petlya.md)</code> или <code>[Петля](../sposobnosti/SP-0051-petlya.md)</code> в чате не проговорено.</li>\n<li><strong>Открытые вопросы, поставленные самим Славой и не закрытые:</strong> «Вот только какие именно твари темной энергий» (175770) и «каких существ запихать в темную сторону или светлую или как людей смесь» (175783).</li>\n<li><strong>Реакции Славы на два предложения Миколая</strong> — пожиратели свежих мертвецов (175805) и существа, растущие от чужой доброты (175806) — в окне нет: не приняты и не отклонены.</li>\n<li><strong>К чему относится «Чёт мне это идея не нравится» (175799)</strong> — к утилитарной призме или к похвале про подпитку (175798) — из чата буквально не следует; база читает реплику как отказ от призмы.</li>\n<li><strong>Реакция Славы на утилитарную призму как на часть мира</strong> отсутствует отдельно от самого отказа: принята ли призма хоть в какой-то части, не сказано.</li>\n</ol>\n<p><strong>Про Поротаев и жуга</strong></p>\n<ol start=\"26\">\n<li><strong>Переносится ли Поротай в «Новый мир» вообще</strong> или просто вспоминается как старая наработка — база помечает это как неясность окна w0036.</li>\n<li><strong>К какой из трёх энергий относятся Поротаи</strong> — не сказано.</li>\n<li><strong>Что такое жуг сам по себе</strong> (существо, гриб, предмет, плод) — не определено ни в одном из трёх окон, где он встречается.</li>\n<li><strong>Иерархия Поротаев дальше пары «высший — низший» не описана:</strong> старшинство среди высших, привязка конкретного низшего к конкретному высшему, потеря контроля, судьба низшего при гибели высшего — ничего этого нет.</li>\n<li><strong>Четвёртая способность высшего Поротая</strong>, о которой Слава спросил 2024-04-02 (152576, 152603), так и не добавлена: Миколай возразил, что способностей и так много.</li>\n<li><strong>Отношение «нового мира (сказки о новом мире)» 2025 года (<code>новый мир (сказка о новом мире) _(статьи ещё нет — [исходник](../../kb/sushnosti/miry/MR-0128-novyy-mir-skazka-o-novom-mire.md))_</code>) к этому миру не установлено:</strong> общий у них только пересланный текст про Поротая.</li>\n</ol>\n<p><strong>Расхождения внутри разметки</strong></p>\n<ol start=\"32\">\n<li>Шапка: <code>отрезков_объявлено: 3</code>, при этом в таблице «Отрезки жизни» одна строка (2024-06-03 — 2024-06-17). Цифра 3 совпадает с числом строк в таблице событий-объявлений, но это не то же самое, что три отрезка.</li>\n<li>Шапка: <code>даты: 2024-04-02 — 2024-06-14</code>; отрезок жизни: 2024-06-03 — 2024-06-17. Ни одна из границ не совпадает.</li>\n<li>Второй дословный блок (2024-06-03, «объявление») начинается с id 175757 и повторяет хвост первого: сообщения 175757–175766 приведены в файле дважды.</li>\n<li>В выгрузке отсутствуют id 175721, 175723, 175724, 175789 — пропущены в нумерации внутри цитируемых блоков, причина не указана.</li>\n<li>Большинство сущностей из таблицы состава (Ночные охотники, Провидцы, Серые странники, ГГ-хранилище, Ваёль, Вика, Поротай, Жуг, пожиратели свежих мертвецов, магия из мечты, сумасшедший, который любит жизнь) в карточке вселенной репликами не подтверждены — только строками таблицы; их содержание берётся из отдельных файлов сущностей.</li>\n<li>Служебный перечень вселенной (<code>novyy_sluzhebnoe.txt</code>) содержит только три записи про рабочий процесс соавторов; организаций он не касается, и организаций в мире нет вовсе.</li>\n</ol></div>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Отдельно, не как дыра, а как шум: <code>GR-0096</code>—<code>GR-0099</code> (колдуны, ночные охотники, серые странники, провидцы) — статьи есть, а материала в базе под ними ноль; они пересобраны из <code>PS-0087</code>—<code>PS-0090</code>. Удвоение, а не пробел, чинить не первым.</p></div>", "r": [["новый мир (сказка о новом мире)", "kb/MR-0128-novyy-mir-skazka-o-novom-mire.html"], ["Колдуны (тёмные и светлые)", "PS-0087.html"], ["отмотка времени (петля)", "SP-0050.html"], ["Петля", "SP-0051.html"]]}, {"t": "Связи — всё вместе", "a": ["VS-0007--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0036.html\">Поротай</a>, <a href=\"PS-0087.html\">Колдуны (тёмные и светлые)</a>, <a href=\"PS-0088.html\">Ночные охотники</a>, <a href=\"PS-0089.html\">Провидцы</a>, <a href=\"PS-0090.html\">Серые странники</a>, <a href=\"PS-0091.html\">ГГ-хранилище тёмных существ</a>, <a href=\"PS-0092.html\">Персонаж «конченый человек»</a>, <a href=\"PS-0093.html\">Ваёль</a>, <a href=\"PS-0094.html\">Вика</a>, <a href=\"PS-0294.html\">Низший Поротай</a>, <a href=\"PS-0295.html\">Высший Поротай</a></li>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0050.html\">отмотка времени (петля)</a>, <a href=\"SP-0051.html\">Петля</a>, <a href=\"SP-0052.html\">Жуг</a></li>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0011.html\">Цветной мир</a>, <a href=\"MR-0012.html\">Новый мир</a>, <a href=\"MR-0013.html\">Три энергии (тёмная, светлая, природная)</a>, новый мир (сказка о новом мире) <em>(статьи ещё нет — <a href=\"kb/MR-0128-novyy-mir-skazka-o-novom-mire.html\">исходник</a>)</em></li>\n<li><strong>Упоминает группы:</strong> <a href=\"GR-0051.html\">Поротаи (низшие и высшие)</a>, <a href=\"GR-0053.html\">Организация, ловящая обнаглевших существ</a>, <a href=\"GR-0064.html\">Пророки каменные («Проротой каменный челике», Поротаи)</a></li>\n<li><strong>Упоминает истории:</strong> <a href=\"IS-0014.html\">Поиск людей по имени со стены</a></li>\n<li><strong>Упоминает прозу:</strong> <a href=\"PR-0015.html\">История Ваёля и Вики (начало)</a></li>\n<li><strong>Группы:</strong> <a href=\"GR-0051.html\">Поротаи (низшие и высшие)</a>, <a href=\"GR-0096.html\">Колдуны (тёмные и светлые)</a>, <a href=\"GR-0097.html\">Ночные охотники (они же «тёмные охотники»)</a>, <a href=\"GR-0098.html\">Серые странники</a>, <a href=\"GR-0099.html\">Провидцы</a></li>\n<li><strong>Персонажи:</strong> <a href=\"PS-0036.html\">Поротай</a>, <a href=\"PS-0087.html\">Колдуны (тёмные и светлые)</a>, <a href=\"PS-0088.html\">Ночные охотники</a>, <a href=\"PS-0089.html\">Провидцы</a>, <a href=\"PS-0090.html\">Серые странники</a>, <a href=\"PS-0091.html\">ГГ-хранилище тёмных существ</a>, <a href=\"PS-0092.html\">Персонаж «конченый человек»</a>, <a href=\"PS-0093.html\">Ваёль</a>, <a href=\"PS-0094.html\">Вика</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["VS-0007--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/VS-0007.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["VS-0007-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/VS-0007/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым чинить <code>ID-0066</code> — «Утилитарная призма для тёмных и светлых». Статьи о ней нет, а ссылаются на неё две записи, и материала в базе почти пять килобайт. Дорого это потому, что внутри призмы лежит единственный названный во всём мире механизм пополнения сословия колдунов (тёмные манипулируют серыми), и статья вселенной сама трижды возвращается к вопросу, считать его действующим или нет, — а идти при этом некуда.</p>\n<p>Второе — <code>MR-0128</code>, «новый мир (сказка о новом мире)»: статьи нет, ссылка одна, зато 10,5 КБ материала. Он держит на себе ответ на вопрос, поставленный самой статьёй: относится ли работа 2025 года к этому миру, и куда ушла вторая половина истории Поротая.</p>\n<p>Третье — куст без статей: <code>ID-0067</code>, <code>ID-0068</code>, <code>ID-0069</code>, <code>ID-0070</code>, <code>SL-0014</code>, <code>SL-0015</code>, <code>SL-0016</code>. Поодиночке по одной ссылке, вместе — около 25 КБ базы и семь мест, куда статья вселенной отсылает читателя в пустоту. <code>SL-0016</code> («Роли в соавторстве») здесь важнее прочих: на нём держится вывод раздела о том, как распределён материал между соавторами.</p>\n<p>Отдельно, не как дыра, а как шум: <code>GR-0096</code>—<code>GR-0099</code> (колдуны, ночные охотники, серые странники, провидцы) — статьи есть, а материала в базе под ними ноль; они пересобраны из <code>PS-0087</code>—<code>PS-0090</code>. Удвоение, а не пробел, чинить не первым.</p>\n<h3>С чего начать</h3>\n<p>Почти всё в базе, и разъехалось оно предсказуемо. Призма — <code>ID-0066</code>, отказ по ней стоит в 175799, окно w0036. Сказка 2025 года — <code>MR-0128</code>, окно w0086 (2025-03-26 — 2025-03-31, id 311277–314703), пересылка Поротая там же, 311279. Петля времени, на которую Слава ссылается как на уже известную, — <code>SP-0050</code> и <code>SP-0051</code>, оба вне этой вселенной; отождествление надо либо провести, либо явно отклонить.</p>\n<p>В архив идти за двумя вещами. Первая: правая граница отрезка, 2024-06-17. Она приходится ровно на первый день окна w0038 (2024-06-17 18:07, id 183012 и дальше) — то есть похожа на служебную привязку к началу окна, а не на авторское объявление; проверять надо хвост w0037 (до 2024-06-16 02:25) и первые сообщения w0038. Вторая: ответ на вопрос 176191 про «чёрно белый мир». В w0036 его нет, окно кончается на id 177144; смотреть w0037 (177470–181869, 2024-06-10 — 2024-06-16).</p>\n<h3>Как развивалось</h3>\n<p>3 июня 22:13 — «Новый мир» сказано и не замечено. 22:26 — повторено, замечено, и мир разворачивается за час: три энергии (22:27), жанровая рамка «страшилка с приземлёнными силами» (22:28), колдуны (22:32–22:36), ночные охотники (22:51). Ограничивали в тот же вечер и дважды: сначала жанром, потом отказом от призмы в 22:53. 4 июня 01:49 приходит список из пятнадцати существ, в 07:00 из него принят один пункт. 5 июня мир называют другим именем — ответа нет, тему уводит сам спрашивающий. 6 июня 21:05 — роль ГГ, последняя запись по существу. 11 июня предложение про магию из мечты остаётся без ответа, 14 июня разговор уже про роли в соавторстве. Возврата нет: 2025-03-26 в чат уходит тот же текст про Поротая, слово в слово, но уже в другую работу.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Цена силы в этом мире прописывается по-разному и не везде. У провидцев она названа прямо и убивает носителя: сходят с ума и кончают собой. У Поротаев названа тоже — смерть, потеря личности, вторая личность как дебафф. У колдунов — самого сильного сословия мира, того, что «будет двигать сюжет», — названо только условие входа: отдаться одному типу энергии. Что эта отдача носителю стоит дальше, для класса такого же рода не проговорено.</p>\n<h3>Отклик</h3>\n<p>Зацепило место, где из пятнадцати предложенных существ принимают ровно одно — и именно серых странников, тех, что ни на чьей стороне. Мир, построенный на жёсткой двоичности, где всё живое обязано быть тёмным, светлым или смесью, взял себе единственный пункт, который в эту сетку не лезет. И ночные охотники хороши по той же причине: у них нет сверхсил, они просто сотканы из тьмы, боятся света — и из одного страха сразу выведено, где они живут. Это редкий случай, когда ограничение немедленно превращается в поведение, а не остаётся строчкой в списке. Список из пятнадцати рядом с ними выглядит ровно тем, чем является, — каталогом; и то, что его забраковали одной строкой в семь утра, кажется мне честным.</p></div>", "r": []}];</script>
