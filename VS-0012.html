<script>const BASE="";const DOCNAME="Цветной мир";
const LEAD="";
const CH=[{"t": "Зарождение", "a": ["S01", "VS-0012-S01", "VS-0012--zarozhdenie"], "h": "<p>Вселенная разработана почти целиком за один вечер — 2024-05-25, окно w0035, сообщения 173092–173353 (с 13:44 до 16:18). Всё остальное, что к ней привязано, — это одна ранняя реплика 2024-05-07 (id 166879, окно w0032), служебное упоминание 2024-05-30 (id 174228–174236), закрытие 2024-07-31 (id 213576–213582, окно w0049) и два поздних перечитывания списка персонажей (2024-09-24, окно w0059; 2026-06-09, окно w0121).</p>\n<p>Разделение работы между соавторами названо прямо: систему сил («абакру») придумал Миколай, персонажей — Слава. Отсюда же формулировка Миколая про фандом — «По твоей вселенной» (173296–173297).</p>\n<p><strong>Что было до названия.</strong> Вечер начинается с готового материала Славы: способность «Прятки» (173095–173097), затем разговор о тезаурусе (173098–173113), затем выбор опорной концепции.</p>\n<p><strong>Выбор концепции (2024-05-25, 13:52–13:53, id 173114–173120).</strong> Миколай: «И вот ещё вопрос», «На что в таком случае опираться», «На какую концепцию», «Ну типа ты перечислял разные типы способностей», «Мы получается мою берём?», «Где абакра, все дела». Слава: «Дадада». То есть у Славы был свой перечень типов способностей, у Миколая — концепция с абакрой; за основу берут концепцию Миколая. Слава оговаривается: «Возможно будущем изменим но пока оставим» (173123), и отдельным сообщением уточняет, к чему относится оговорка: «Название» (173124). Миколай: «Да, ошибся». К какому именно названию — прямо не сказано; из контекста реплики речь о слове «абакра».</p>\n<p><strong>Происхождение слова «абакра» (2024-05-25, 13:56, id 173121–173127).</strong> Миколай: «Кстати, знаешь как я это название придумал?» Слава: «И как придумал». Миколай: «Я короче в одном тгк пока думал о концепции увидел пост про крабовые чипсы. Быстро начал говорить, мол хочу краба. Много раз. Краба, краба, краба, абакр, абакр, абакра. Абакра, да так и назову».</p>\n<p>В сообщении 173121 Миколай отвечает точкой на своё более раннее сообщение 167322 (2024-05-09) — то есть указывает на конкретный написанный ранее текст концепции. В базе этот текст лежит отдельной сущностью <code>[Лиомат](../sposobnosti/SP-0059-liomat.md)</code> «Лиомат» со вселенной «игра бога» (железа, лиомат как энергия способностей, гелиогормоны, сфинктер-хранилище, клетки с генкодом). В переписке по Цветному миру ничего из этой физиологии не пересказывается: оттуда взяты только само слово «абакра» и мысль о клеточном носителе абилки.</p>\n<p><strong>Список Славы (2024-05-25, 13:58, id 173128–173129).</strong> Следом Слава сбрасывает перечень: «Энергет, прятки, закон, петля, феникс, Тен, волк, дракон, ци, имитатор, спартанец, вампир, драгоценность, бессмерт, жук, лёд, Дилан, граница, солнце», с припиской «Надо потихоньку записывать а то я по тихонько забываю». Позже — «Можешь закрепить» (173160). Из этого выросли две служебные сущности — «Тезаурус вселенной» (<code>Тезаурус вселенной _(статьи ещё нет — [исходник](../../kb/sushnosti/zametki/SL-0012-tezaurus-vselennoy.md))_</code>) и «Список персонажей Славы» (<code>Список персонажей Славы _(статьи ещё нет — [исходник](../../kb/sushnosti/zametki/SL-0013-spisok-personazhey-slavy.md))_</code>).</p>\n<p><strong>Перебор названий (2024-05-25, 15:18–15:30).</strong> Поводом стало недоразумение: Слава спрашивает «А ты что спрашивал как вселенную назвать?» (173306), Миколай — «Вроде не спрашивал», Слава объясняет: «Не я подумал ты типо отправляешь фотку где надо назвать фнаф и я подумал ты так спросил» (173309), «Вообще нету / У меня же там не один гг» (173310).</p>\n<ul>\n<li><strong>«Не сахар»</strong> (173311–173316). Миколай: «Ну можно назвать по глупому», «Потом будет привычно», «„Не сахар“». Слава: «Точно не это». Миколай: «Ахахах», «Да», затем: «Ну ладно, тогда более серьёзные подходы рассмотреть бы» (173317).</li>\n<li><strong>«Паладин»</strong> (173318–173327). Предложение Славы. Миколай: «Почему». Слава: «Типо мы только что рассматривали командира а он типа добро» (173321), следом ссылка на ютуб-шортс (173322) и «И плюс» (173323) — продолжение отсутствует. Миколай: «Он гг?» Слава: «Нет», «Он будет редко появляться». Миколай: «Нуу, в принципе». Название не закреплено, но осталось во вселенной отдельной идеей (<code>Паладин _(статьи ещё нет — [исходник](../../kb/sushnosti/idei/ID-0061-paladin.md))_</code>).</li>\n</ul>\n<p><strong>Принятие названия (2024-05-25, 15:30, id 173342–173346).</strong> Слава пишет одним словом: «Цветной мир», следом отдельным сообщением «?». Миколай отвечает тремя сообщениями: «Оооо», «Оо», «Идеально».</p>\n<p>Никакого объяснения, почему мир «цветной», в этом фрагменте не дано — Слава называет вариант без обоснования, и обоснования у него не спрашивают. Связь названия с делением населения на Бесцветных и Цветных (оно введено на полтора часа раньше, 173152) в переписке нигде не проговорена.</p>\n<p>Непосредственно перед предложением названия обсуждался Энергетик (173338–173341): «Ну ладно пусть будет пока энергетик», «Энергетик чел со способностью телепортироваться и черпать оттуда энергию» — Миколай: «Аа, понял», «Ну допустим». «Цветной мир» идёт следующей репликой, но как вывод из этого разговора не подан.</p>\n<p>Сразу после принятия названия Миколай ставит условие: «Но должен быть конфликт для сюжета» (173347). Слава: «Но это потом», «Хотя он есть», «Я по позже напишу» (173348–173350). Вместо конфликта через 46 минут приходит биография мальчика без имени (173353) — последнее сообщение вселенной по существу.</p>\n<p><strong>Рабочие обозначения до имени.</strong> До 15:30 вселенная в чате называется просто «наша»: «Перейдем к нашей» (173216, 14:46). Спустя пять дней после принятия имени «цветной мир» употребляется уже как готовое рабочее обозначение, со строчной буквы и без пояснений (174233, 2024-05-30).</p>\n<p><strong>Все звучавшие обозначения:</strong></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Обозначение</th>\n<th>Когда, id</th>\n<th>Отношение к вселенной</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>«наша»</td>\n<td>2024-05-25, 173216</td>\n<td>рабочее обозначение до имени</td>\n</tr>\n<tr>\n<td>«Не сахар»</td>\n<td>2024-05-25, 173313</td>\n<td>предложение Миколая, отвергнуто сразу: «Точно не это»</td>\n</tr>\n<tr>\n<td>«Паладин»</td>\n<td>2024-05-25, 173318–173327</td>\n<td>предложение Славы от образа командира-добра, не закреплено; осталось как идея <code>Паладин _(статьи ещё нет — [исходник](../../kb/sushnosti/idei/ID-0061-paladin.md))_</code></td>\n</tr>\n<tr>\n<td>«Цветной мир»</td>\n<td>2024-05-25, 173342</td>\n<td>принятое название</td>\n</tr>\n<tr>\n<td>«цветной мир»</td>\n<td>2024-05-30, 174233; 2024-07-31, 213577</td>\n<td>то же название в строчном рабочем употреблении</td>\n</tr>\n<tr>\n<td>«абакра»</td>\n<td>2024-05-25, 173119, 173127</td>\n<td>не название вселенной, а система сил, взятая за основу</td>\n</tr>\n<tr>\n<td>«апокалипсис»</td>\n<td>2024-07-31, 213578</td>\n<td>то, к чему переходят после откладывания; чем является — не сказано</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Разметка карточки.</strong> В карточке <code>[Цветной мир](VS-0012-cvetnoy-mir.md)</code> объявлено 7 отрезков, но в таблице «Отрезки жизни» приведён один: 2024-05-25 — 2024-06-03, по объявлениям 173118 (берут за основу абакру), 173216 («перейдем к нашей») и 173342 (принято название). Диапазон дат в шапке шире отрезка с обоих концов: 2024-05-07 — 2024-07-31. Нижняя граница идёт не от объявления, а от персонажа «Имитатор» (<code>[Имитатор](../personazhi/PS-0383-imitator.md)</code>, самая ранняя дата 2024-05-07) — единственной сущности старше самой вселенной, на 18 дней. Конец отрезка 2024-06-03 не подкреплён ни одним объявлением. Закрытие 2024-07-31 лежит за пределами отрезка жизни. Сам файл оговаривает принцип: «Границы поставлены по объявлению в чате плюс дате, а не по содержанию. Отрезки могут быть несмежными — это нормально».</p>", "r": [["Паладин", "kb/ID-0061-paladin.html"], ["Тезаурус вселенной", "kb/SL-0012-tezaurus-vselennoy.html"], ["Список персонажей Славы", "kb/SL-0013-spisok-personazhey-slavy.html"], ["Имитатор", "PS-0383.html"], ["Лиомат", "SP-0059.html"]]}, {"t": "Масштаб", "a": ["S02", "VS-0012-S02", "VS-0012--masshtab"], "h": "<p><strong>Мир один.</strong> «Цветной мир» — название всей вселенной, а не отдельного мира внутри неё. Никакого набора миров, планов, слоёв или измерений в переписке нет. Три записи базы вида «мир» — это не места: <code>[Цветной мир](../miry/MR-0011-cvetnoy-mir.md)</code> «Цветной мир» (сама вселенная и история названия), <code>[Бесцветные и Цветные](../miry/MR-0009-bescvetnye-i-cvetnye.md)</code> «Бесцветные и Цветные» (деление населения), <code>[Эксперименты по превращению бесцветного в цветного](../miry/MR-0010-eksperimenty-po-prevrascheniyu-bescvetnogo-v-cvetnogo.md)</code> «Эксперименты по превращению бесцветного в цветного» (программа опытов).</p>\n<p><strong>Устройство пространства в переписке не описано.</strong> Ни географии, ни стран, ни континентов, ни городов. Единственные пространственные детали, которые вообще прозвучали:</p>\n<ul>\n<li>приют, который командир построил «в отшибе от людей» (173147), — там же он живёт отшельником после распада отряда (173239);</li>\n<li>«оттуда», откуда Энергетик черпает энергию (173339), — что это за место, не раскрыто;</li>\n<li>лаборатории — упомянуты только в биографии прототипа командира из другой вселенной (173188); про лаборатории самого Цветного мира не сказано ничего, известно лишь, что эксперимент существует.</li>\n</ul>\n<p>Состояние проработки Слава формулирует сам, на прямой вопрос о фабуле: «Не знаю мы только персонажей и систему сил продумали» (173331), «Да у меня даже нет гг чтобы пихнуть ему двигатель сюжета» (173332).</p>\n<p><strong>Перемещений между мирами в переписке нет.</strong> Ни один персонаж не переходит из мира в мир. Две механики, связанные с переходом, обе не про мультивселенную: телепортация Энергетика (173339) — внутримировая и не объяснённая; реинкарнация Отца-реинкарнатора (173204) — переход из тела в тело и относится к другой вселенной. Предложенная командиру «манипуляция пространством» — «Ну тпшкается парень», «тп - телепорт» (173263–173265) — отвергнута: «Ну как то не особо» (173268).</p>\n<p><strong>Соседние вселенные.</strong> Названы две, и обе — как соседние авторские разработки, а не как части одного космоса:</p>\n<ul>\n<li>«совсем другая вселенная» (173215), где живут Сильнейший человек без способностей и Отец-реинкарнатор. Названия у неё нет. Слава закрывает отступление: «Но этой совсем другая вселенная», «Перейдем к нашей» (173215–173216);</li>\n<li>вселенные, куда позже уходит Имитатор («7 островов», «Апостол», «Оам», «игра бога»), — это переиспользование персонажа авторами в других проектах; никакой внутримировой связи в переписке не заявлено.</li>\n</ul>\n<p><strong>Кто правит — в переписке не сказано.</strong> Ни правителей, ни государств, ни советов, ни богов. Косвенно к теме власти относятся два места, оба про войну и порядок, а не про правление: командир «остановил войну между людьми и со сверхлюдми» (173175); Сильнейший человек без способностей «был гарантом между сверхлюдми и людьми ( поэтому он уничтожал лабораторий убивал сверхлюдей нарувшийшя закон то бишь он типо полицейский для всех)» (173188) — но это другая вселенная, и он не правитель, а гарант.</p>", "r": [["Цветной мир", "MR-0011.html"], ["Бесцветные и Цветные", "MR-0009.html"], ["Эксперименты по превращению бесцветного в цветного", "MR-0010.html"]]}, {"t": "Организации и сообщества", "a": ["S03", "VS-0012-S03", "VS-0012--organizacii-i-soobschestva"], "h": "<p>Отдельных записей вида «группа» у вселенной нет ни одной: в <code>spravochnik/gruppy/</code> 87 файлов GR-*, и ни один не относится к «Цветному миру». Не путать: «Отряд сильнейших» (<code>[Отряд сильнейших](../gruppy/GR-0015-otryad-silneyshih.md)</code>, 2024-05-07, id 166480–166482) относится к вселенным «игра бога» / «Апостол», «Отряд Имитатора времён 8-летней войны» (<code>[Отряд Имитатора времён 8-летней войны](../gruppy/GR-0029-otryad-imitatora-vremen-8-letney-voyny.md)</code>, 2024-07-04) — к «7 островам». Всё, что во вселенной есть по этой части, существует как упоминания внутри записей о персонажах и о мире.</p>\n<p><strong>Сильнейший отряд (отряд командира).</strong> Дословно (173147): «В той вселенной командир сильнейшего отряда / После развала команды построил приют для детей в отшибе от людей и жил там поживал / И он в теорий сильнейший». Отряд распался — сказано дважды: «После развала команды» (173147) и «он и так живёт отшельником после распада отряда» (173239). Состав не назван вообще, ни одного участника кроме командира; причина распада, задача отряда и то, кому он подчинялся, не названы.</p>\n<p>Рядом по смыслу стоит реплика Славы из другого разговора (2024-05-07, id 166880, окно w0032, при первом упоминании имитатора): «А так там особой идей нету но зато я понял что просто кидать сильных персонажей в один отряд глупо тем более если их ний силы друг другу не подходят». Сказано про отряды вообще; связь с отрядом командира в переписке не заявлена.</p>\n<p><strong>Приют для детей.</strong> Построен командиром после распада отряда, «в отшибе от людей» (173147). В перечне свойств персонажа Слава называет его среди опор образа: «Он плод эксперимента, любит детей раз построил приют, он сильнейший, он значит лишь добро и справедливость» (173241). Кто эти дети, сколько их и кто ещё при приюте — в переписке не сказано.</p>\n<p><strong>Команда Тена.</strong> Названа одной репликой (173132): «Волк командир команды тена с способностю как у волка». То есть команда названа по Тену, а командует ею Волк. Больше в неё никто не назван; задача команды и её отношение к отряду командира и к экспериментам не проговорены.</p>\n<p><strong>Пара «имитатор — спартанец».</strong> Не организация, но единственная устойчивая связка двоих (173137): «Кстати спартанец напарник имитатор ( имитатор один из сильнейших существ в той вселенной )».</p>\n<p><strong>Эксперименты по превращению бесцветного в цветного</strong> (<code>[Эксперименты по превращению бесцветного в цветного](../miry/MR-0010-eksperimenty-po-prevrascheniyu-bescvetnogo-v-cvetnogo.md)</code>) — единственное во вселенной образование, ведущее систематическую деятельность и имеющее измеримый результат. Кто ставит опыты — лаборатория, государство, частное лицо — в окне не названо; ни имени программы, ни ведомства, ни места. Подробности см. в разделе о населении.</p>\n<p><strong>Институции соседней вселенной.</strong> Единственное место во всём материале, где мир устроен через организации, — рассказ Славы о прототипе командира (173183–173216), который он сам помечает как «совсем другая вселенная». Там названы: лаборатории, ставящие опыты над сверхдетьми (персонаж их уничтожал); приют для сверхдетей из спасённых, построенный «ко крастоки из за чувство вины»; сам герой в функции службы правопорядка для обеих сторон — «типо полицейский для всех»; подразумеваемый закон, который сверхлюди могут нарушить («убивал сверхлюдей нарувшийшя закон»), — чей это закон и кто его пишет, не сказано. Существуют ли эти институции в Цветном мире, в переписке не сказано.</p>\n<p><strong>Организационные затеи самих авторов</strong> (про устройство работы, не про содержание мира):</p>\n<ul>\n<li><strong>Тезаурус вселенной</strong> (<code>Тезаурус вселенной _(статьи ещё нет — [исходник](../../kb/sushnosti/zametki/SL-0012-tezaurus-vselennoy.md))_</code>, 173098–173113). Идею первым подавал Слава, напоминает о ней Миколай: «ты как-то кидал идею, создать тезаурус», «Словарь, отражающий систематизированную совокупность понятий какой-л. отрасли знаний». На «Не понял» объясняет практически: «Ну типа человек со способностью называется так \"...\", суперспособность по другому это \"...\"» (173102). Аргументы: «Чтобы не забыть», «Создать действительно тезаурус», «Чтобы можно было консультироваться у него», «Словарик с терминами» (173108–173111). Слава: «Но можно» (173113). В этом же обмене всплывает термин «Герострат» (173104) — Слава на него отвечает «Это? Я забыл»; что слово означает во вселенной, не объяснено. Тезаурус так и не составлен.</li>\n<li><strong>Фандом по вселенной</strong> (<code>Фандом по вселенной _(статьи ещё нет — [исходник](../../kb/sushnosti/idei/ID-0064-fandom-po-vselennoy.md))_</code>, 173293–173305). Миколай: «Ну ты создаёшь сообщество», «Агась», «Фандом», «По твоей вселенной», обоснование — «Будет удобно систематизированная информация». И тут же сам отказывается: «Ну я вот это сейчас сказал», «И лень стало», «Поэтому отложу немного».</li>\n<li><strong>Канал</strong> (2024-05-30, 174228–174236). Миколай: «Я канал создал», «Опять». Слава уточняет: «По цветному миру». Миколай: «Нет», «По себе». Канала по вселенной не появилось.</li>\n<li><strong>Закрепление сообщения</strong> — «Можешь закрепить» (173160), рабочий способ не потерять список состава.</li>\n</ul>\n<p><strong>Отношения между перечисленным</strong> — только то, что названо или прямо следует из текста: эксперименты → командир, волк, Тен (все трое — удачные экземпляры одной программы, 173165); Волк → команда Тена (командир этой команды, 173132); командир → сильнейший отряд (распался); командир → приют; командир → война между людьми и сверхлюдьми (остановил её, 173175); командир ↔ имитатор («Имитатор слабей командира», 173231); имитатор ↔ спартанец (напарники, 173137); командир как персонаж → отвергнутое название «Паладин» (173318–173321). Связь между командой Тена и отрядом командира в переписке не сказана. Связь между экспериментами и войной не сказана — реплики стоят рядом, но авторы их не соединяют.</p>", "r": [["Фандом по вселенной", "kb/ID-0064-fandom-po-vselennoy.html"], ["Тезаурус вселенной", "kb/SL-0012-tezaurus-vselennoy.html"], ["Отряд сильнейших", "GR-0015.html"], ["Отряд Имитатора времён 8-летней войны", "GR-0029.html"], ["Эксперименты по превращению бесцветного в цветного", "MR-0010.html"]]}, {"t": "Население и классы", "a": ["S04", "VS-0012-S04", "VS-0012--naselenie-i-klassy"], "h": "<p>Отдельными записями базы существуют только три надличные категории: «абакра» (<code>[абакра](../sposobnosti/SP-0064-abakra.md)</code>), «Бесцветные и Цветные» (<code>[Бесцветные и Цветные](../miry/MR-0009-bescvetnye-i-cvetnye.md)</code>), «Эксперименты по превращению бесцветного в цветного» (<code>[Эксперименты по превращению бесцветного в цветного](../miry/MR-0010-eksperimenty-po-prevrascheniyu-bescvetnogo-v-cvetnogo.md)</code>). Мутанты, сверхлюди, сверхдети, «владельцы» названы внутри записей о персонажах и мире и своих файлов не имеют.</p>\n<p><strong>Бесцветные и Цветные.</strong> Базовое и единственное прямо названное деление населения. Дословно, Слава (2024-05-25, 14:11, id 173152):</p>\n<div class=\"q\"><p>Бесцветный ( владельцы абакра но без эксклюзивный абилки )<br>Цветный ( владельцы абакра но с абилкой</p></div>\n<p>И сразу потолок нижнего разряда (173153): «То бишь бесцветный могут только усиливать тело и все».</p>\n<p>Клеточное обоснование даёт Миколай (173155–173159): «Абилка во первых выражается в клетках», «Которые как раз содержат информацию о ней», «Значит», «Бесцетные не имеют таких клеток». Слава просит закрепить (173160) и подтверждает: «Получается нет» (173162).</p>\n<p>Абакра есть у всех — и у бесцветных, и у цветных. Различие не в наличии силы, а в наличии эксклюзивной абилки и несущих её клеток. Бесцветный — не человек без силы; всё, что ему доступно, — усиление тела.</p>\n<p>О численности: Миколай спрашивает «И их бо́льшее количество?» (173163) и следом пишет «Окей» (173164), но прямого ответа Славы в окне нет — разговор в этот момент уходит к эксперименту. В навигационных карточках базы (<code>[Бесцветные и Цветные](../miry/MR-0009-bescvetnye-i-cvetnye.md)</code>, <code>[абакра](../sposobnosti/SP-0064-abakra.md)</code>) это записано утвердительно — «и самих бесцветных больше»; в самой переписке вопрос остался незакрытым.</p>\n<p><strong>Пути в цветные — два, и они не сведены друг с другом.</strong></p>\n<ol>\n<li><em>Пробуждение.</em> Единственное описание — в биографии главного героя (173353): «судьба обратила на него внимания и дала ему пробудится цветным». Агентом названа судьба. Что запускает пробуждение, в каком возрасте оно происходит, можно ли его вызвать — не сказано.</li>\n<li><em>Эксперимент.</em> См. ниже.</li>\n</ol>\n<p><strong>Эксперименты по превращению бесцветного в цветного.</strong> Многолетняя программа. Первое упоминание — через командира (173148): «Также он первый удачный эксперимент для превращение бесцветного в цветной». Цифры даёт Слава (2024-05-25, 14:15, id 173165):</p>\n<div class=\"q\"><p>Вообще в этом эксперименте только 3 удачных экземпляра<br>Это командир, волк, Тен( многоликий)<br>За все 30-50 лет</p></div>\n<p>Судьба неудачных: на вопрос «А неудачные умерли?» (173166) — «Да больше миллиона умерло» (173167), «Или не в состояний двигаться» (173168), позже сведено: «Да некоторые умерли некоторый парализовала» (173173). Слово «экземпляр» — авторское, Слава пользуется им для удачных результатов.</p>\n<p>Кто ставит опыты — лаборатория, государство, частное лицо — в окне не названо; это помечено неясностью в самой записи <code>[Эксперименты по превращению бесцветного в цветного](../miry/MR-0010-eksperimenty-po-prevrascheniyu-bescvetnogo-v-cvetnogo.md)</code>.</p>\n<p><strong>Мутанты.</strong> Ветка населения, выведенная из неудачных экспериментов. Предложена Миколаем (173169–173172): «А может мутации ещё», «Или баян?», «Ну типа неудачный эксперимент повредил там нейроны и чел вышел из под контроля», «Он уже типа не человек». Слава отвечает согласием, но не разработкой: «А про мутантов вообще можно что нибудь замутить» (173173), и разговор тут же уходит на способность командира. Численность, поведение, отношения с людьми и цветными не оговорены.</p>\n<p><strong>Люди и сверхлюди.</strong> Пара проходит двумя следами. Первый — война: «И кстати, ко крастоки этот командир остановил войну между людьми и со сверхлюдми» (173175). Это единственное указание на политическую историю вселенной; ни причин, ни сроков, ни исхода кроме факта остановки. Второй — видовой состав. Миколай из реплики «имитатор один из сильнейших существ в той вселенной» (173137) делает вывод: «Тобиж не человек» (173226). Слава поправляет: «Человек» (173227), и следом даёт общее правило: «Там все люди» (173229), «Пока что» (173230). Про командира тут же подтверждено: «Это человек» — «Да» (173222–173223).</p>\n<p>Как «сверхлюди» соотносятся с «цветными» — совпадают ли эти два деления, вложены ли одно в другое — в переписке не проговорено. Здесь же лежит неразобранное противоречие: «Там все люди» (173229) против войны «между людьми и сверхлюдьми» (173175).</p>\n<p><strong>«Владельцы».</strong> Сословное слово, которое авторы употребляют не задумываясь: «владельцы абакра» в определении обеих категорий и «владелец не контролирующий энергий использует посых для контроля» про Ци (173133). Закреплённого названия для «человека со способностью» вселенная так и не получила — именно этот пробел Миколай пытался закрыть тезаурусом.</p>\n<p><strong>Сверхдети</strong> — только в соседней вселенной: приют «для сверхдетей над которыми ставили опыты и которых он благополучно спасал» (173188). Там же сверхчеловечество работает как физическая характеристика: отец героя «убил его дочь а жену убить не смог так как она сверхчеловек» (173213) — то есть сверхчеловека убить труднее. В Цветном мире ничего из этого не сказано.</p>\n<p><strong>Именной состав.</strong> Задан одним сообщением-перечнем Славы (173128, повторён без изменений 235517 и 488786): «Энергет, прятки, закон, петля, феникс, Тен, волк, дракон, ци, имитатор, спартанец, вампир, драгоценность, бессмерт, жук, лёд, Дилан, граница, солнце». 19 позиций. В перечне не разделены персонажи, способности и термины: часть пунктов дальше идёт как люди (Тен, волк, дракон, ци, спартанец, имитатор, энергет), часть — как силы (прятки). Расшифрованы в окне восемь — те, о ком выборочно спросил Миколай: «Тен, волк, дракон, ци, спартанец» / «Кто такие» (173130–173131), плюс имитатор, энергет и прятки по ходу. Одиннадцать позиций — закон, петля, феникс, вампир, драгоценность, бессмерт, жук, лёд, Дилан, граница, солнце — не раскрыты нигде.</p>\n<p><strong>Сводка деления, собранная только из сказанного:</strong></p>\n<ol>\n<li>Абакра — общая система сил; ею владеют все, кто вообще что-то может. Это уровень ниже деления на классы.</li>\n<li>Внутри владельцев абакры проходит единственное прямо названное деление — по наличию особых клеток с информацией об абилке: нет клеток → бесцветный, «могут только усиливать тело и все»; есть клетки → цветной, есть эксклюзивная абилка.</li>\n<li>Из бесцветного можно сделать цветного экспериментом: за 30–50 лет три удачи, больше миллиона умерших, часть парализована.</li>\n<li>Из неудачных опытов заявлена ветка мутантов — не разработана.</li>\n<li>Цветным можно пробудиться — отдельный от эксперимента путь, показанный на мальчике без имени.</li>\n<li>Параллельно и без стыковки с предыдущим существует пара люди / сверхлюди, между которыми была война, остановленная командиром.</li>\n<li>Видовой состав на момент окна: «Там все люди», «Пока что». Нечеловеческих рас не введено.</li>\n</ol>\n<p><strong>Главный герой не определён.</strong> На вопрос Миколая «Гг ещё нету» Слава отвечает: «Ну у меня они все как гг почти», «Поэтому я ещё не определился кто может стать гг» (173335–173336). В кандидатах побывали Тен («Типо Тен вполне может и энергетик», 173337) и Энергетик, назначенный временно: «Ну ладно пусть будет пока энергетик» (173338). Через 46 минут приходит биография мальчика без имени (173353) — брошенного при рождении, у которого «не было ничего не имени не семьи ни друзей не дома не вещей», пробудившегося цветным, в котором «проснулась жадность». Тот же это персонаж, что Энергетик, или новый герой вместо него — в переписке не проговорено; в базе это помечено неясностью в <code>[Энергетик](../personazhi/PS-0083-energetik.md)</code> и <code>[ГГ — мальчик без имени](../personazhi/PS-0084-gg-malchik-bez-imeni.md)</code>. Отдельно сказано, что командир — не главный герой: «Он будет редко появляться» (173326), и что «у меня же там не один гг» (173310).</p>", "r": [["Энергетик", "PS-0083.html"], ["ГГ — мальчик без имени", "PS-0084.html"], ["абакра", "SP-0064.html"], ["Бесцветные и Цветные", "MR-0009.html"], ["Эксперименты по превращению бесцветного в цветного", "MR-0010.html"]]}, {"t": "Система способностей", "a": ["S05", "VS-0012-S05", "VS-0012--sistema-sposobnostey"], "h": "<p>Вся система сил уместилась в то же окно w0035 (2024-05-25, id 173092–173353). Ни до, ни после этого дня она не дорабатывалась; два позднейших возврата касались только списка имён, без разбора механик.</p>\n<p><strong>Абакра</strong> — общее название системы сил вселенной (встречается и форма «абакр»), концепция Миколая. История её принятия и происхождение слова — см. «Зарождение».</p>\n<p><strong>Носитель абилки — клетки.</strong> Единственное сказанное о физическом устройстве силы: «Абилка во первых выражается в клетках» (173155), «Которые как раз содержат информацию о ней» (173157), «Бесцетные не имеют таких клеток» (173159), подтверждение Славы — «Получается нет» (173162). Наличие или отсутствие этих клеток и есть то, чем один разряд отличается от другого физически.</p>\n<p><strong>Полуактивная абакра.</strong> Подвид, введённый Миколаем 2024-05-25 в 14:41 (173203) применительно к отцу из другой вселенной: «Может быть у отца была полуактивная абакра. И способность реализовать негатив нанося вред врагу тем самым». Слава в ответ даёт свою уже готовую версию (реинкарнацию) и на предложенный разряд не отвечает вообще. Что делает абакру полуактивной, есть ли другие степени активности и как это соотносится с парой «бесцветный / цветной» — в переписке не сказано.</p>\n<p><strong>Общей цены за использование силы</strong> — расхода, усталости, отката для всех — в переписке не установлено. Ограничения проговорены поштучно.</p>\n<p><strong>Прятки</strong> (<code>[Прятки](../sposobnosti/SP-0063-pryatki.md)</code>, 2024-05-25, 13:47, id 173097) — единственная способность вселенной, описанная с полной механикой, лимитом и откатом. Дословно:</p>\n<div class=\"q\"><p>Ну вот персонаж считает до 10 и говорит кто не спрятался я не виноват и всех кого он увидит своими глазами раздавить ( конечно особо крепкий получат лишь сильный урон и повреждений внутренних органов ) вообще он может найти только 5 объектов а дальше откат способности</p></div>\n<p>По частям: ритуал запуска — счёт до 10 и фраза «кто не спрятался я не виноват»; условие поражения — «всех кого он увидит своими глазами», то есть через зрение носителя; эффект — раздавливание; смягчение для стойких целей — «особо крепкий получат лишь сильный урон и повреждений внутренних органов»; лимит — «он может найти только 5 объектов», сверх лимита — откат. Реакция Миколая: «Хорошая концепция» (173098). Носитель не назван, и неясно, «прятки» — имя персонажа или название силы.</p>\n<p><strong>Ци</strong> (173133): «Ци ты наверное не помнишь владелец не контролирующий энергий использует посых для контроля». Ограничение здесь не в самой силе, а в носителе: он не контролирует энергию, и посох служит инструментом контроля. Единственное место в Цветном мире, где сила описана через «энергию» и где названо приспособление-компенсатор. Персонаж придуман раньше, вне этого окна («ты наверное не помнишь»).</p>\n<p><strong>Прочие расшифрованные силы из списка Славы:</strong></p>\n<ul>\n<li><strong>Тен</strong> — «Тен 10 форм» (173132), он же «многоликий» (173165). Что за 10 форм, не раскрыто.</li>\n<li><strong>Волк</strong> — «командир команды тена с способностю как у волка» (173132). Миколай предполагает набор: «Способности волка: когти, клыки, вой?» (173134), Слава даёт свой: «Когти скорость инстинкты регенерация» (173135). Клыки и вой в набор не вошли.</li>\n<li><strong>Дракон</strong> — «женщина способна превращаться в дракона частично или полностью» (173132). Частичное превращение оговорено отдельно.</li>\n<li><strong>Спартанец</strong> — напарник имитатора, «Он будет ходить полностью голый только в железных ботинках, трусах и в шлеме» (173137). Способность не выбрана.</li>\n<li><strong>Имитатор</strong> — «один из сильнейших существ в той вселенной» (173137), человек, слабее командира. Содержание его силы в окне Цветного мира не раскрывается.</li>\n<li><strong>Энергетик</strong> — «чел со способностью телепортироваться и черпать оттуда энергию» (173339). Куда телепортируется и что за «оттуда» — не объяснено; это единственное место во всём материале, где вообще подразумевается некое «там».</li>\n</ul>\n<p><strong>Иерархия силы.</strong> Командир: «И он в теорий сильнейший» (173147), позже «он сильнейший» (173241). Имитатор — «один из сильнейших существ в той вселенной» (173137), и прямое сравнение: «Имитатор слабей командира» (173231). Внутри отряда своя вертикаль: Волк — командир команды Тена. Возраст с силой напрямую не связан, но у командира зафиксировано расхождение: «Выглядит на 30 / А на деле 56» (173286); объяснения через способность или абакру этому нет.</p>\n<p><strong>Отклонённые механики.</strong></p>\n<p><em>Способность командира</em> — весь блок 173147–173271 это её поиск, идущий двумя заходами и кончающийся ничем. Перед перебором Слава выкладывает исходные данные: «Он плод эксперимента, любит детей раз построил приют, он сильнейший, он значит лишь добро и справедливость», «И он свободен» (173241–173242). Отвергнуты по порядку:</p>\n<ol>\n<li>Первые ассоциации Миколая — «Ясен хуй дыра черная», «Фольга мятая» (173149–173151).</li>\n<li>Вытягивание и передача лиомата: «Может он сосёт лиомат из каждого, может его концентрировать и возможно передавать» (173243), «По желанию» (173245). Слава: «Ну он добро» (173244), «Нет как той» (173246), «Нет» (173248). Итог Миколая: «Не берет и не дает энергию» (173250), «Другая способность» (173251) — Слава: «Да». Это единственное место, где в Цветном мире вообще звучит слово <strong>лиомат</strong>, и звучит оно без объяснения, что это такое.</li>\n<li>«Направлять людей на путь истинный»: «Ну типа если добро. Тогда может он умеет направлять людей на путь истинный» (173254), тут же сам — «Тупые пока идеи идут» (173256), «Это не способность по сути» (173258). Слава: «Ну вообще да он так иногда будет делать» (173257), «Но это не способности» (173259). Свойство персонажа сохранено, статус способности снят.</li>\n<li>Манипуляции пространством / телепорт: «Короче. Может манипуляции пространством» (173263), «Ну тпшкается парень» (173264), сам же автор идеи — «Ну это не сила так то» (173267). Слава: «Ну как то не особо» (173268).</li>\n<li>Манипуляция светом: «По идее что. Если цвет есть значит есть свет. Может манипуляция светом» (173269) — вывод сделан из названия мира. Слава отклоняет по занятой нише: «Есть уже такой персонажей» (173270); сам этот светоносный персонаж в окне не назван.</li>\n</ol>\n<p>Итог захода (173271): «Тогда, мои полномочия всё. Сейчас точно ничего не скажу дельного. Лучше взять паузу тогда. Хотел по ходу дела чет придумать, но мысли не те идут».</p>\n<p><em>Способность спартанца</em> — Миколай предлагает две концепции мышечной силы: «Есть 2 концепции известные», «1 даже в той вселенной выдумка», далее «Или как Мга мышцы увеличивать» и «Или как в баки бесквит Оливер мышцы размером с остров прячет в маленьком теле» (173140–173144), со своей же оценкой: «По идее норм концепция, можно дополнить или объединить с другой» (173146). Слава не выбирает ни одну — разговор перескакивает на командира. Формально ни одна не отклонена и ни одна не принята.</p>\n<p><strong>Приёмы, которыми авторы подбирали способности</strong> (рабочие правила, названные вслух, а не механики мира):</p>\n<ul>\n<li><strong>«Гнуть вселенную под способность»</strong> (<code>Гнуть вселенную под способность _(статьи ещё нет — [исходник](../../kb/sushnosti/idei/ID-0063-gnut-vselennuyu-pod-sposobnost.md))_</code>, 173174–173176), Миколай: «Ну вообще часто как поступают авторы», «Они делают очевидную способность единичной и тем самым мощной. Гнут вселенную под способность так сказать». Предложено применительно к командиру; применили ли — не сказано, Слава сразу вернул разговор к «Ну и какую дать способности».</li>\n<li><strong>Опора на чужую идеологию силы</strong> (173232–173235): «Вообще есть аниме по манге ветролом», «И сильнейший персонаж там по идеологии самый свободный», «Вот, это может быть опорой». Свобода как признак сильнейшего к командиру подошла — «И он свободен» (173242), — но в способность не превратилась.</li>\n<li><strong>Критерий «это не способность по сути»</strong> (173258, 173259, 173267) — применён трижды, обоими авторами одинаково.</li>\n<li><strong>Отсев по занятой нише</strong> — «Есть уже такой персонажей» (173270).</li>\n<li><strong>Деконструкция образа командира</strong> (<code>Деконструкция образа командира _(статьи ещё нет — [исходник](../../kb/sushnosti/idei/ID-0062-dekonstrukciya-obraza-komandira.md))_</code>, 173272–173291): Миколай приводит словарное определение деконструкции и предлагает разобрать ассоциации со словом «командир» отдельно от персонажа. Разбор упирается в вопрос о возрасте, и после ответа «выглядит на 30, а на деле 56» — «На самом деле этот вопрос всё решил» (173287), «Просто персонаж то командир. Я на слове командор зациклился и внешка такая нежнаянудная в голове» (173288), «И история и характер», «а его образ плоским кажется» (173290), «Но слово не персонаж» (173291).</li>\n</ul>\n<p><strong>Механики соседней вселенной</strong>, идущие в том же разговоре и в систему Цветного мира не входящие: Сильнейший человек без способностей — «Сильнейший человек который только благодаря физической силой стал одним из сильнейших сам он не владеет способностями» (173188), сила объяснена мышечной памятью запечатанных жизней; Отец-реинкарнатор — «каждый раз как он умирал он оказался в новом теле и так на протяжении 1000 лет и так реинкарнируясь он сохранял способности получены в каждом теле и стал типо злодеим» (173204), то есть способности всех прежних тел сохраняются при переносе; запечатанные воспоминания (ребёнок в 7 лет убил мать, «его воспоминания запечатали»); сверхчеловек как предел уязвимости (173213).</p>\n<p><strong>Терминология не собрана.</strong> Тезаурус решили завести и не завели; закреплённого слова для «человека со способностью» нет — работают только «цветной», «бесцветный», «сверхлюди» и «владелец». «Герострат» (173104) назван как пример термина и не определён.</p>\n<p><strong>Чего в переписке не обсуждалось вовсе:</strong> можно ли потерять абилку или лишиться клеток; можно ли отнять чужую способность (в Цветном мире; накопление способностей есть только у отца-реинкарнатора из другой вселенной); наследуется ли абилка; развивается ли она и как — при том что мотивация главного героя построена на желании «сделать единственную ценную вещь сильней»; бывает ли у одного носителя больше одной абилки; есть ли у Цветных внешний признак; как абакра соотносится с цветом, хотя название мира от цвета и произведено — единственная попытка связать одно с другим (173269) была отклонена.</p>", "r": [["Гнуть вселенную под способность", "kb/ID-0063-gnut-vselennuyu-pod-sposobnost.html"], ["Деконструкция образа командира", "kb/ID-0062-dekonstrukciya-obraza-komandira.html"], ["Прятки", "SP-0063.html"]]}, {"t": "Кончина", "a": ["S06", "VS-0012-S06", "VS-0012--konchina"], "h": "<p>Кончина как таковая не объявлена ни разу. Объявлено откладывание.</p>\n<p>2024-07-31, 14:20–14:57 (id 213576–213582, окно w0049). Дословно. Слава: «Привет» (213576), «Пока откладываем цветной мир» (213577), «И снова апокалипсис» (213578). Миколай через 37 минут: «привет» (213581), «окей» (213582).</p>\n<p>Формулировка автора — именно «Пока откладываем цветной мир», не закрытие и не конец; слово «пока» стоит в реплике. Причина не объяснена: Слава не говорит, почему откладывают, Миколай не спрашивает. Единственное, что сказано о том, куда переходят, — «И снова апокалипсис», то есть возврат к чему-то, что уже было раньше. Что это за «апокалипсис» и относится ли он к отдельной вселенной, в этом фрагменте не сказано. Никакого обсуждения решения в выписке нет.</p>\n<p>Закрытие лежит за пределами объявленного отрезка жизни (2024-05-25 — 2024-06-03).</p>\n<p>Состояние вселенной на момент откладывания авторы сформулировали сами ещё 2024-05-25: «Не знаю мы только персонажей и систему сил продумали» (173331), «Да у меня даже нет гг чтобы пихнуть ему двигатель сюжета» (173332).</p>", "r": []}, {"t": "Возвраты", "a": ["S07", "VS-0012-S07", "VS-0012--vozvraty"], "h": "<p><strong>Возврат «к нашей»</strong> (2024-05-25, 14:45–14:46, id 173215–173218). Слава: «Но этой совсем другая вселенная» (173215), «Перейдем к нашей» (173216), «И какую дать способности командиру» (173217). Миколай: «Хех» (173218). Это возврат из отступления про соседнюю вселенную в основную; обсуждение способности командира продолжается. Вселенная здесь называется просто «наша» — возврат (14:46) происходит раньше, чем у неё появляется имя (15:30). Что за «совсем другая вселенная», из которой возвращаются, в приведённом фрагменте не названо: реплика 173215 отсылает к более раннему обсуждению, не выписанному в файл.</p>\n<p><strong>После откладывания вселенная в переписке не возобновлялась.</strong> Единственные поздние следы — два перечитывания списка персонажей, оба без разбора механик и без возобновления работы:</p>\n<ul>\n<li>2024-09-24 (окно w0059, id 235514–235555). Слава пересылает перечень себе и не помнит двух пунктов: «И блядь что значит Дилан» (235518), «И граница» (235519). Миколай: «не ебу», «прости», «я из этих только жука знаю» (235521–235525). Версия Миколая о причине пробела: «как будто ты не обо всех писал тут», «в голове придумал но не выписал» (235534–235535). Слава ловит его на прежнем: «Ну ты даже там не задал вопрос о дилане и границе / Значит ты знал о них» (235536–235537) — Миколай: «да💔». Признание (235545–235546): «на самом деле, всегда когда раньше (раньше то есть до этой секунды) я говорил что знаю, я очень сильно наёбввал и тебя и себя в первую очередь», «знание понятие растяжимое».</li>\n<li>2026-06-09 (окно w0121, id 488786–488789). Тот же перечень и та же проверка памяти: «Че за граница», «Всех помню кроме границы и дилана».</li>\n</ul>\n<p>То есть к вселенной возвращались трижды за два года, и все три раза — только к списку имён; ответа по «границе» и «Дилану» нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "VS-0012-S08", "VS-0012--probely"], "h": "<div class=\"gaps\"><p><strong>Не решено внутри разговора:</strong></p>\n<ol>\n<li><strong>Способность командира.</strong> Весь блок 173147–173271 — её безуспешный поиск; четыре варианта отклонены, заход кончается на «Тогда, мои полномочия всё».</li>\n<li><strong>Способность спартанца.</strong> Две мышечные концепции предложены, ни одна не выбрана; обсуждение оборвалось переходом к командиру.</li>\n<li><strong>Конфликт для сюжета.</strong> Миколай: «Но должен быть конфликт для сюжета» (173347), Слава: «Но это потом», «Хотя он есть», «Я по позже напишу» (173348–173350). Написан не был.</li>\n<li><strong>Главный герой.</strong> Энергетик назначен временно — «пусть будет пока»; следом появляется мальчик без имени; тот же это персонаж или новый — не проговорено. Слава объясняет затруднение так: «Ну у меня они все как гг почти».</li>\n<li><strong>Численное соотношение бесцветных и цветных.</strong> Вопрос задан (173163), прямого ответа нет. В карточках базы <code>[Бесцветные и Цветные](../miry/MR-0009-bescvetnye-i-cvetnye.md)</code> и <code>[абакра](../sposobnosti/SP-0064-abakra.md)</code> это записано утвердительно как «бесцветных больше» — расхождение базы с источником.</li>\n<li><strong>Кто ставит эксперименты</strong> по превращению — не названо; помечено неясностью в <code>[Эксперименты по превращению бесцветного в цветного](../miry/MR-0010-eksperimenty-po-prevrascheniyu-bescvetnogo-v-cvetnogo.md)</code>. Нет ни названия программы, ни ведомства, ни места, ни срока окончания; закрыта программа или продолжается — не сказано; кем стали трое удачных сразу после эксперимента — не сказано.</li>\n<li><strong>Ветка мутантов</strong> — согласована в принципе («про мутантов вообще можно что нибудь замутить», 173173) и не разработана.</li>\n<li><strong>Тезаурус</strong> решено завести (173099–173113) и не заведён.</li>\n</ol>\n<p><strong>Не сказано вовсе:</strong></p>\n<ol start=\"9\">\n<li><strong>Почему мир «цветной».</strong> Название предложено одной репликой и принято без обоснования. Связь с сущностями «Бесцветные и Цветные» и «Эксперименты по превращению бесцветного в цветного» в выписанных кусках чата не проговорена ни разу. Единственная попытка связать название с механикой — «Если цвет есть значит есть свет» (173269) — отклонена.</li>\n<li><strong>Соотношение «сверхлюди» и «цветные»</strong> не оговорено: два независимо возникших слова.</li>\n<li><strong>Война между людьми и сверхлюдьми</strong> — одна реплика (173175). Стороны, причины, сроки, исход кроме факта остановки командиром — ничего. Связь войны с экспериментами не заявлена.</li>\n<li><strong>Устройство пространства</strong> — ни географии, ни стран, ни городов.</li>\n<li><strong>Кто правит</strong> — ни правителей, ни государств, ни организаций.</li>\n<li><strong>Приют командира</strong> — кто там дети, сколько их, кто ещё при приюте. Сверхдети и лаборатории есть только в соседней вселенной, прямо помеченной как «совсем другая» (173215).</li>\n<li><strong>Состав «сильнейшего отряда»</strong> — ни одного участника кроме командира; причина распада, задача, подчинение.</li>\n<li><strong>Состав «команды Тена»</strong> — назван только Волк как командир; что делает команда и как соотносится с отрядом командира.</li>\n<li><strong>Механика пробуждения цветным</strong> — назван только агент, «судьба» (173353): от чего, в каком возрасте, у всех ли.</li>\n<li><strong>Что даёт бесцветным «усиление тела»</strong> и каков его потолок.</li>\n<li><strong>Энергия в Цветном мире</strong> не названа и не описана: слово «энергия» встречается только у Ци и Энергетика, «лиомат» — один раз, в отклонённом варианте (173243), без объяснения, что это.</li>\n<li><strong>«Полуактивная абакра»</strong> применена однократно и в схему «бесцветный / цветной» не встроена.</li>\n<li><strong>10 форм Тена</strong> не раскрыты.</li>\n<li><strong>Носитель «Пряток»</strong> не назван; неясно, имя это персонажа или название силы.</li>\n<li><strong>«Герострат»</strong> (173104) прозвучал и не расшифрован ни в одном окне.</li>\n<li><strong>Из какой вселенной возвращаются</strong> (173215) — более раннее обсуждение в файл не выписано; вселенная, где живут Сильнейший человек без способностей и Отец-реинкарнатор, названия не имеет.</li>\n<li><strong>Что такое «апокалипсис»</strong> (213578) — отдельная вселенная, сюжет или цикл; слово «снова» указывает, что к нему уже возвращались.</li>\n<li><strong>Причина откладывания</strong> — не объяснена, вопроса не задано.</li>\n</ol>\n<p><strong>Внутренние противоречия, оставленные как есть:</strong></p>\n<ol start=\"27\">\n<li>«Там все люди» (173229) против войны «между людьми и сверхлюдьми» (173175) — в окне не разбирается.</li>\n<li>Персонаж с манипуляцией светом упомянут («Есть уже такой персонажей», 173270) и не назван.</li>\n<li>К чему относится оговорка «Возможно будущем изменим но пока оставим» (173123): Слава уточняет «Название», но какое именно — прямо не сказано; из контекста речь о слове «абакра».</li>\n</ol>\n<p><strong>Утраченное и не выписанное:</strong></p>\n<ol start=\"30\">\n<li><strong>Одиннадцать позиций списка</strong> (закон, петля, феникс, вампир, драгоценность, бессмерт, жук, лёд, Дилан, граница, солнце) не раскрыты нигде. Две из них — «граница» и «Дилан» — не опознаны самими авторами ни 2024-09-24, ни 2026-06-09.</li>\n<li><strong>Чем является список Славы</strong> — перечнем персонажей или перечнем способностей: в разных окнах он называется по-разному.</li>\n<li><strong>Оборванная реплика</strong> «И плюс» (173323) — второй довод в пользу названия «Паладин» не досказан; ссылка на ютуб-шортс (173322) не прокомментирована, содержание неизвестно.</li>\n<li><strong>В дословных выписках пропущены отдельные id:</strong> 173320 (между 173319 и 173321), 174232 (между 174231 и 174233), 213579–213580 (между 213578 и 213581). Содержания этих сообщений в файле нет.</li>\n</ol>\n<p><strong>Разметка базы:</strong></p>\n<ol start=\"34\">\n<li>Шапка карточки объявляет 7 отрезков, в таблице «Отрезки жизни» приведён один (2024-05-25 — 2024-06-03). Диапазон дат в шапке (2024-05-07 — 2024-07-31) шире отрезка с обоих концов; нижняя граница идёт от персонажа «Имитатор», объявления от этой даты в файле нет. Конец отрезка 2024-06-03 не подкреплён ни одним объявлением. Закрытие 2024-07-31 лежит за пределами отрезка.</li>\n<li>Событие 173121–173129 помечено типом «переименование», но переименования в нём нет — это рассказ о происхождении слова «абакра»; его дословный блок дублирует хвост предыдущего блока.</li>\n<li>Записей вида «группа» у вселенной нет ни одной. Надличных категорий с отдельными файлами — три (абакра, Бесцветные и Цветные, Эксперименты); мутанты, сверхлюди, сверхдети, «владельцы» своих файлов не имеют.</li>\n<li>Концепция абакры взята по ссылке на более раннее сообщение Миколая (173121 → 167322, 2024-05-09), которое в базе лежит как <code>[Лиомат](../sposobnosti/SP-0059-liomat.md)</code> «Лиомат» со вселенной «игра бога» — с железой, гелиогормонами и сфинктером-хранилищем. В переписке по Цветному миру ничего из этой физиологии не повторено; переносить её как канон Цветного мира оснований в тексте нет.</li>\n</ol></div>", "r": [["абакра", "SP-0064.html"], ["Лиомат", "SP-0059.html"], ["Бесцветные и Цветные", "MR-0009.html"], ["Эксперименты по превращению бесцветного в цветного", "MR-0010.html"]]}, {"t": "Связи — всё вместе", "a": ["VS-0012--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0083.html\">Энергетик</a>, <a href=\"PS-0084.html\">ГГ — мальчик без имени</a>, <a href=\"PS-0383.html\">Имитатор</a></li>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0059.html\">Лиомат</a>, <a href=\"SP-0063.html\">Прятки</a>, <a href=\"SP-0064.html\">абакра</a></li>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0009.html\">Бесцветные и Цветные</a>, <a href=\"MR-0010.html\">Эксперименты по превращению бесцветного в цветного</a>, <a href=\"MR-0011.html\">Цветной мир</a></li>\n<li><strong>Упоминает группы:</strong> <a href=\"GR-0015.html\">Отряд сильнейших</a>, <a href=\"GR-0029.html\">Отряд Имитатора времён 8-летней войны</a></li>\n<li><strong>Группы:</strong> <a href=\"GR-0088.html\">Сильнейший отряд (отряд Командира)</a>, <a href=\"GR-0089.html\">Команда Тена</a>, <a href=\"GR-0090.html\">Бесцветные и Цветные</a>, <a href=\"GR-0091.html\">Имитатор и Спартанец (напарники)</a></li>\n<li><strong>Персонажи:</strong> <a href=\"PS-0383.html\">Имитатор</a>, <a href=\"PS-0077.html\">Командир</a>, <a href=\"PS-0078.html\">Тен</a>, <a href=\"PS-0079.html\">Волк</a>, <a href=\"PS-0080.html\">Дракон</a>, <a href=\"PS-0081.html\">Ци</a>, <a href=\"PS-0082.html\">Спартанец</a>, <a href=\"PS-0083.html\">Энергетик</a>, <a href=\"PS-0084.html\">ГГ — мальчик без имени</a>, <a href=\"PS-0085.html\">Сильнейший человек без способностей (прототип командира)</a>, <a href=\"PS-0086.html\">Отец-реинкарнатор</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["VS-0012--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/VS-0012.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["VS-0012-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/VS-0012/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым чинить <code>SL-0013</code> — «Список персонажей Славы». Статьи нет, а в базе почти 10 КБ, и это самая дорогая точка вселенной по положению: на список опирается сама статья вселенной, на него же ссылаются <code>GR-0088</code> и <code>GR-0089</code>, и он вылезает за пределы Цветного мира — на него завязаны <code>VS-0014</code>, <code>VS-0015</code>, <code>PS-0144</code> и четыре группы из соседнего ярлыка (<code>GR-0038</code>, <code>GR-0041</code>, <code>GR-0046</code>, <code>GR-0047</code>). Именной состав вселенной задан одним сообщением на 19 позиций, восемь из них расшифрованы, одиннадцать не раскрыты нигде — то есть больше половины населения мира существует только как строка перечня, на которую все ссылаются.</p>\n<p>Вторая по цене — <code>SL-0012</code>, «Тезаурус вселенной»: статьи нет, 5,5 КБ в базе, ссылаются статья вселенной, <code>GR-0089</code>, <code>GR-0090</code> и <code>VS-0014</code>. Тезаурус — единственное место, где вообще ставился вопрос, как называется человек со способностью; пока записи нет, вселенная остаётся без слова для собственного основного класса, и туда же уходит нерасшифрованный «Герострат».</p>\n<p>Дешёвые и оттого следующие: <code>ID-0061</code>, <code>ID-0062</code>, <code>ID-0063</code>, <code>ID-0064</code> — по одной ссылке каждая, статей нет, материала 2–4,4 КБ. Это идеи и приёмы работы, не содержание мира; чинятся быстро.</p>\n<p>Отдельно, не дыра материала, а дыра связей: у четырёх групп вселенной — <code>GR-0088</code>, <code>GR-0089</code>, <code>GR-0090</code>, <code>GR-0091</code> — статьи есть, но объём базы у всех нулевой, и входящих ссылок ноль. Они собраны из чужих реплик и ни на что не опираются; проверять их надо не дописыванием, а сверкой с источником.</p>\n<h3>С чего начать</h3>\n<p>Восемь расшифрованных позиций списка уже лежат в базе, но врозь: <code>PS-0077</code>, <code>PS-0078</code>, <code>PS-0079</code>, <code>PS-0080</code>, <code>PS-0081</code>, <code>PS-0082</code>, <code>PS-0083</code>, плюс механика в <code>SP-0063</code>. Сводить <code>SL-0013</code> надо из них, а не из файла вселенной.</p>\n<p>Одиннадцати оставшихся в базе нет — за ними в архив. Ориентиры: окно w0035 (2024-05-25, 173092–173353) выписано дословно, там их не расшифровывают; оба поздних возврата — w0059 (2024-09-24, 235514–235555) и w0121 (2026-06-09, 488786–488789) — только повторяют перечень. Значит смотреть надо раньше 25 мая: Ци заведомо придуман до окна («ты наверное не помнишь»), и первый след вселенной — 2024-05-07, w0032, 166879–166880. Тот же заход закрывает и происхождение абакры: 173121 отвечает точкой на 167322 (2024-05-09), сам этот текст в файл вселенной не выписан.</p>\n<p>Дёшево и точечно из архива добираются пропущенные id: 173320, 174232, 213579–213580 — три вырезки, три места в тексте.</p>\n<p>Ещё одна поездка в архив — за «апокалипсисом» (213578). Слово «снова» говорит, что к нему уже возвращались, значит искать не вокруг 2024-07-31, а раньше: чем эта вещь была в первый раз. Там же выяснится, вселенная это или сюжет.</p>\n<h3>Как развивалось</h3>\n<p>2024-05-07 — первая реплика, Имитатор появляется за 18 дней до вселенной. 2024-05-25, 13:44 — заход начинается с готовой способности Славы; 13:52 берут за основу концепцию Миколая; 14:11 вводят деление на бесцветных и цветных; 14:15 дают цифры эксперимента; с 14:19 до 15:00 идёт поиск способности командира и кончается на «мои полномочия всё». Имя мир получает в 15:30 — после того как устроен, а не до. В 15:31 ставится условие про конфликт, в 16:18 приходит биография мальчика без имени, и это последнее сообщение по существу. 2024-05-30 канал создан — но не по вселенной. 2024-07-31 — «Пока откладываем цветной мир». 2024-09-24 и 2026-06-09 — возвращаются трижды за два года и все три раза к одному и тому же перечню имён; в 2026-м не опознают те же две позиции, что в 2024-м.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для цветных физическое основание силы названо прямо: абилка выражается в клетках, клетки содержат информацию о ней. Для бесцветных сказано, чего у них нет («не имеют таких клеток»), и что им доступно — «могут только усиливать тело и все». Но абакра, по тому же тексту, есть у обоих разрядов. То есть для одного разряда носитель силы назван, а для соседнего разряда того же рода — чем именно держится усиление тела, если клеток нет, — вопрос не задан ни разу.</p>\n<p>Рядом то же самое с ценой: у Пряток названы и лимит («только 5 объектов»), и откат — это единственная сила вселенной, у которой потолок проговорён. Ни у одной соседней силы из того же перечня потолка не спрашивают.</p>\n<h3>Отклик</h3>\n<p>Зацепило два места, и оба про то, как люди ловят себя. Первое — деконструкция командира: разбор идёт вязко, пока не всплывает «выглядит на 30, а на деле 56», и сразу — «На самом деле этот вопрос всё решил», «Я на слове командор зациклился», «Но слово не персонаж». Человек публично обнаруживает, что мешала ему не пустота персонажа, а собственная картинка на слово. Второе — сентябрьское «знание понятие растяжимое» и признание, что «всегда когда раньше я говорил что знаю, я очень сильно наёбывал и тебя и себя». Это сказано через четыре месяца после вечера, где половина списка так и не была расшифрована именно потому, что оба делали вид, будто помнят. Ещё отдельно нравится происхождение слова абакра — «краба, краба, краба, абакр, абакра» — вся система сил названа тем, что осталось от крабовых чипсов, и это единственная деталь мира, которую точно никто не забудет. На фоне этого сам мир выглядит ровно тем, чем его назвали сами авторы: персонажи и система сил есть, гг нет, конфликта нет. Но вечер, за который это сделано, читается лучше, чем результат.</p></div>", "r": []}];</script>
