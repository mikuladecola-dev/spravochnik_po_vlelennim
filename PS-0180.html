<script>const BASE="";const DOCNAME="Воплощение гнева";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0180-S01", "PS-0180--proishozhdenie"], "h": "<p>Персонаж Славы, появившийся в переписке 2025-01-22 как заявка на подбор способности. Разговор начинается с прямого вопроса Славы: «Какую дать способность» (id 283703), и дальше идёт описание того, кому эту способность подбирают.</p>\n<p>Имя как таковое не закреплено: персонаж проходит через переписку под обозначениями «воплощения гнева», «Воплощений гнева», а в каталоге благословенных — как «Защитник🤬( ангел 👼)» (2025-01-24, id 284248).</p>\n<p>Относится к благословенным — то есть к тем, кого благословил один из правителей. Через это же определяются его «братья и сёстры»: «Братья и сестры это то бишь благословенный одним правителем» (id 283706).</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0180-S02", "PS-0180--vneshnost"], "h": "<p>Отдельного описания внешности нет. Есть общая черта категории, к которой он принадлежит: «Вообще благословенный Богом есть общая чёрта виде белых глаз при активаций благословения» (id 283708).</p>\n<p>В каталоге запись сопровождается пометами «🤬» и «( ангел 👼)» (id 284248); что означает скобка, в переписке не поясняется.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0180-S03", "PS-0180--harakter"], "h": "<p>Заявлен Славой одним блоком (2025-01-22 08:36, id 283706):</p>\n<div class=\"q\"><p>«Принципиальному, прямолинейному и жестокому<br>Он воплощения гнева<br>Прототип защитника только молчиливова<br>Бэтмен с жестокостью и гневом<br>Тот кто да мозга костей ненавидит междумирцов<br>Тот кто оторвёт крылья ангелам, переломает кости своим братьям и сёстрам»</p></div>\n<p>То есть: принципиальный, прямолинейный, жестокий, молчаливый. «Прототип защитника только молчиливова» и «Бэтмен с жестокостью и гневом». Ненависть к междумирцам — «да мозга костей», то есть до мозга костей.</p>\n<p>Через два часа образ уточняется (2025-01-22 10:05, id 283728): «Воплощений гнева / Непробиваемому чудовище / Страх всех чужемирцов».</p>\n<p>Насилие в описании направлено в обе стороны — и на чужих (крылья ангелам), и на своих (кости братьям и сёстрам).</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0180-S04", "PS-0180--sposobnosti"], "h": "<p>На момент разговора способности у персонажа нет — она и есть предмет заявки.</p>\n<p>Предложенные и отклонённые варианты:</p>\n<ul>\n<li><strong>Левитация</strong> — предложена Миколаем (2025-01-22 08:29, id 283704) ещё до того, как Слава изложил описание. Ответной реакции на это предложение в переписке нет.</li>\n<li><strong>Скорость</strong> — отклонена Славой прямо: «Способность скорость не подходит» (id 283728).</li>\n</ul>\n<p>Чем дело кончилось и какая способность в итоге назначена, в приведённой переписке не сказано.</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0180-S05", "PS-0180--svyazi-s-drugimi"], "h": "<p><strong>Братья и сёстры</strong> — благословенные одним правителем. Слава перечисляет тех, кто среди них есть (2025-01-22 08:40, id 283707): «владельцы способности изменения агрегатного сотояния», «Та кто может изменять плотность массу и размер объектов и себя», «Тот у кого есть способность сжатия», «Имитация», «Бессмертный выродок», «Теневые братья». Отношение к ним — враждебное: он тот, кто «переломает кости своим братьям и сёстрам».</p>\n<p><strong>Междумирцы / чужемирцы</strong> — предмет ненависти («да мозга костей») и те, для кого он «страх всех чужемирцов».</p>\n<p><strong>Ангелы</strong> — те, кому он отрывает крылья. При этом в каталоге его собственная запись помечена «( ангел 👼)»; как это соотносится, в переписке не разбирается.</p>\n<p><strong>Каталог благословенных и врагов</strong> (2025-01-24 10:31, id 284248) — там он стоит в списке благословенных среди: Теневые братья 🌘, Имитатор 🗡, Агрегат 🫥, Разрушительнитца 💪, Палач ☠️, Защитник 🤬 (ангел 👼), Дитя света ✨, Бессмертный выродок 🤪, Хулиган 💎, Вибрация 🫨, Ученица???. Отдельным списком идут враги: Доспехи 🏳️, Козлиха 🪓, Сестра 🚺, Огненный снайпер 🔥, Охотник 🔪, Божество 😵, Убийца 🩸, Зонтик 🩸, Леший 🌳, Пар 💨, Садистка ✂️, Насекомое 😡, Старик ➡️⬅️. Там же приписаны «Идей: Чёрный ящик, озеро перерождения, корень желаний».</p>", "r": []}, {"t": "Как менялся", "a": ["S06", "PS-0180-S06", "PS-0180--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2025-01-22 (id 283703–283712).</strong> Заявка и первое описание: принципиальный, прямолинейный, жестокий, молчаливый прототип защитника, «Бэтмен с жестокостью и гневом», ненависть к междумирцам, готовность калечить своих. Тут же перечислены братья и сёстры.</p>\n<p>В этом же куске Слава ставит вопрос об устройстве всей категории благословенных: белые глаза при активации он уже раздал тем, кто «должны быть благословений дьяволом», менять ничего не хочет — «потому что мне и так нравится», — и потому думает «вообще убрать благословенных дьяволом». Тогда благословенных остаётся 21, хотя «конечно можно оставить и 42». Вопрос Миколаю: «Как думаешь сколько должно быть благословенных Богом 21 или 42». Ответа в этом куске нет.</p>\n<p><strong>Версия 2 — 2025-01-22, 10:05 (id 283728–283732).</strong> Уточнение: «Непробиваемому чудовище», «Страх всех чужемирцов». Скорость отвергнута. Тут же Слава упирается в другое: «За что карать его» — «Потому что ничего про них придумать не могу». Миколай отвечает только «эх» и «а, ладно теперь пон».</p>\n<p><strong>Версия 3 — 2025-01-24 (id 284248–284254).</strong> Персонаж попадает в общий каталог как «Защитник🤬( ангел 👼)». Обсуждения самого персонажа тут нет: Слава предлагает угадать, кто из врагов чужемирец, Миколай отвечает, что он на уроке, «красиво кстати» и «пиздец интесно подумать», но занят заданием.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0180-S07", "PS-0180--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Способность так и не выбрана — в переписке нет момента, где ей дают имя.</li>\n<li>На вопрос «За что карать его» ответа не найдено: Слава прямо говорит, что «ничего про них придумать не могу».</li>\n<li>Вопрос «21 или 42» благословенных остаётся без ответа Миколая; решение убрать благословенных дьяволом остаётся на уровне «я думаю».</li>\n<li>Собственное имя персонажа не названо: только «воплощение гнева» и каталожное «Защитник».</li>\n<li>Что значит помета «( ангел 👼)» при его имени в каталоге, не объяснено, при том что ангелам он отрывает крылья.</li>\n<li>Неясно, тот ли это «Гнев» из семи грехов или другой персонаж: оба названы через гнев, но грехи в иерархии стоят отдельно от благословенных. В переписке это не проговаривается.</li>\n<li>Внешность, происхождение и биография не описаны вовсе.</li>\n<li>Кто именно его правитель — не сказано, только что братья и сёстры благословлены «одним правителем».</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0180--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0011.html\">Братья и сёстры (благословенные одним правителем)</a>, <a href=\"GR-0013.html\">Благословенные</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0011.html\">Братья и сёстры (благословенные одним правителем)</a>, <a href=\"GR-0013.html\">Благословенные</a>, <a href=\"GR-0020.html\">Междумирцы</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0180--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-01-22</td>\n<td>283703–283712</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-22</td>\n<td>283728–283732</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-24</td>\n<td>284248–284254</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0180-voploschenie-gneva.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0180--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0180.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0180-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0180/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Самое дорогое здесь — не пробел, а разрыв. <code>SP-0168</code> «Способность воплощения гнева»: статья на 10 497, база 8 379, вселенная «Апостол» — и ноль входящих ссылок, включая <code>PS-0180</code>, при том что это тот же разговор того же дня. <code>SP-0168</code> покрывает id 283703–283802, <code>PS-0180</code> — только 283703–283712 и 283728–283732. В зазор попали три отклонённых варианта из четырёх и весь рабочий конфликт вокруг отказов. Раздел «Предложенные и отклонённые варианты» неполон не потому, что материала нет, а потому что он в соседней записи, на которую никто не смотрит.</p>\n<p>Второе — <code>PS-0177</code> «Гнев (грех)»: две ссылки, статья 8 950, база 11 005, то есть материала там больше, чем в базе самой <code>PS-0180</code> (7 227). Статья держит открытым вопрос, тот ли это Гнев из семи грехов; отвечать на него надо, читая обе записи рядом, а сейчас между ними нет даже ссылки.</p>\n<p>Третье — правитель. «Кто именно его правитель» упирается сразу в несколько записей, у которых статьи есть, а входящих ссылок почти нет: <code>MR-0097</code> «Правители миров» (одна ссылка, 9 624), <code>MR-0103</code> «Правители минимиров» (одна ссылка, 3 793), <code>PS-0278</code> «Правители» (одна ссылка, 26 811). Материала много, связей нет — дыра не в мире, а в проводке.</p>\n<h3>С чего начать</h3>\n<p>В базе, целиком.</p>\n<p><code>SP-0168</code> — первым делом. Там варианты, которых в этой статье нет: «мб неудача» (283713–283715) с обоснованием «я бы стал таким если бы меня всегда приследовала неудача», ветка обрывается собственным «стоп нахуй» Миколая, реакции Славы нет; вулкан (283733–283737) — «каменная кожа», «внутри из лавы», «даже если сломать камень он не упадёт, просто завязнет в лаве», отвергнут одним знаком «🚫»; вариант из нейросети (283791–283794), отвергнутый до озвучивания — «Нет», «Потому что», «Не хочу». Там же дважды сформулированная просьба Миколая обосновывать отказы (283725 и 283799–283802). Раздел «Способности» после этого выглядит иначе: не два варианта, а пять, и три последних сняты без разбора.</p>\n<p>Продолжение вопроса «21 или 42» — <code>ID-0143</code> «Благословенный дьяволом» (статьи нет, ссылок ноль, база 3 149), id 325845–325850, 2025-05-14. Через четыре месяца Слава сам возвращает категорию, которую собирался убрать: «Благословенный дьяволом», «Ты же хотел создать их»; Миколай спрашивает «на всегда или пока в зоне обрывает контакт с правителем?». Решения по счёту там по-прежнему нет, но январское «я думаю убрать» после этого не окончательное.</p>\n<p>Отдельно — осторожность с именем «Защитник». <code>IS-0017</code> (две ссылки, статья 49 884, база 139 029, пять вселенных) — это другой Защитник, из «7 островов» и «монстров», с собственной биографией; <code>PS-0196</code> «Семья Защитника (жена и дочь)» (статья 17 812, база 37 618, ноль ссылок) относится туда же. Поиск по слову даст больше сотни килобайт чужого материала. Идти надо по каталожной строке «Защитник🤬( ангел 👼)» и по id, а не по имени.</p>\n<h3>Как развивалось</h3>\n<p>2025-01-22 08:29 — Миколай предлагает левитацию ещё до того, как узнал, кому. 08:36–08:40 — Слава заявляет персонажа целиком, шестью строками характера, и тут же перечисляет, что уже занято роднёй. 10:05 — первое ограничение: «Способность скорость не подходит», и следом вопрос, который сносит рамку самой заявки: «За что карать его» — «Потому что ничего про них придумать не могу». В тот же день ещё два отказа, оба без разбора. 2025-01-24 — вернулись, но не к способности: персонаж входит в общий каталог строкой «Защитник🤬( ангел 👼)», а разговор идёт про загадку о врагах, и Миколай отвечает, что он на уроке. Заявка, открытая вопросом «Какую дать способность», закрывается тем, что персонаж получает эмодзи.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для благословения Богом признак назван, и он внешний и проверяемый: «благословенный Богом есть общая чёрта виде белых глаз при активаций благословения». Для благословения дьяволом признака нет — и в том же сообщении сказано, почему: белые глаза уже розданы тем, кто «должны быть благословений дьяволом». Дальше идёт не признак, а вывод: «Поэтому я думаю вообще убрать благословенных дьяволом». То есть вторую половину пары не отличили, а сократили. Правило опознания сформулировано для одной стороны и не сформулировано для другой, при том что сама сторона из мира не ушла — спустя четыре месяца к ней возвращаются по имени.</p>\n<h3>Отклик</h3>\n<p>Самое живое здесь — не персонаж, а сцена вокруг него. Слава выдаёт шесть строк, из которых человек встаёт целиком: «Бэтмен с жестокостью и гневом», «Тот кто оторвёт крылья ангелам, переломает кости своим братьям и сёстрам». Плотно и работает. А дальше — четыре предложения подряд и четыре отказа, два из них вообще без слов: «🚫» и «Нет / Потому что / Не хочу». И посреди этого Миколай пишет: «пока ты четко не пошлёшь нахуй то что я предложил и не обоснуешь почему мне труднее за новое браться» — просьба не про сюжет, а про то, как вдвоём работать. Ответ Славы честнее любого обоснования: «Потому что ничего про них придумать не могу». Персонаж, которому не смогли подобрать способность, — это ровно тот персонаж, про которого автор сам сказал, что не знает, за что тот карает. Заглох не подбор силы, заглох вопрос, зачем этот человек нужен, — и это видно прямо в переписке, без реконструкции.</p></div>", "r": []}];</script>
