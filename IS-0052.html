<script>const BASE="";const DOCNAME="Пролог про Максима";
const LEAD="";
const CH=[{"t": "Содержание", "a": ["S01", "IS-0052-S01", "IS-0052--soderzhanie"], "h": "<p>Пролог — сцена перед выходом в поход, целиком построенная на разговоре двух друзей, Андрея и Саши, о третьем — о Максиме, который в самой сцене не появляется (2025-05-04, id 323658).</p>\n<p>Разговор начинается с того, что Саша «в очередной раз» спрашивает: «Андрей, а нам точно нужно брать его собой?» Андрей не понимает негодования друга. Саша спрашивает, ходил ли Андрей с Максимом в поход раньше; Андрей отвечает честно — «ну нет», и Саша отвечает: «что и требовалось доказать». Андрей начинает злиться и требует сказать прямо, что не так.</p>\n<p>Довод Саши: он сам ходил с Максимом в поход, и в последний раз стёр ноги до крови — «И это не шутка или преувеличения. Я потом ходить нормально не мог месяц». На вопрос, почему стёр ноги, Саша сначала переспрашивает, реально ли Андрей не в курсе, а потом объясняет.</p>\n<p>Объяснение и есть характеристика Максима:</p>\n<ul>\n<li>Максим — спортсмен, «Лучший наверное спортсмен нашего колледжа или даже города».</li>\n<li>Причина, по которой он начал заниматься спортом: «потому что ему было скучно».</li>\n<li>В походе ему тоже скучно, «поэтому он скакал, как заяц туда сюда». Саша «еле за ним поспевать успевал». Кроме того, Максим «успел ещё какие-то дырки залазить».</li>\n<li>Саша прямо говорит, что Андрей за таким темпом не поспеет: «раз сука я атлет за ним не поспевать то ты точно».</li>\n</ul>\n<p>Андрей возражает, что Максима уже пригласили; Саша соглашается — «Нужно будет его попросить по медленнее двигаться».</p>\n<p>Дальше Андрей усмехается, что Саша был против только из-за скорости передвижения, и Саша перечисляет остальное — списком отрицаний:</p>\n<ul>\n<li>«Не из-за того, что он похитил медвежонка, а после по всему лесу убегал от его матери».</li>\n<li>«Не из-за того, что он нас в пещеру повел, а потом заблудился».</li>\n<li>«Не из-за того что он пытался лисю поймать».</li>\n</ul>\n<p>Андрей на это отвечает: «а так вот откуда у него медведь дома, а лису я не видел» — то есть медведь у Максима дома действительно есть. Саша уточняет судьбу лисы: «А лису он съел в лесу. Живодёр хренов. Но суп всё равно вкусный вышел».</p>\n<p>Закрывает сцену реплика Андрея: «ну так это же Максим, у него всё идеальное же выходит. Пошли уже. Собираться пора в походе уже».</p>", "r": []}, {"t": "Персонажи", "a": ["S02", "IS-0052-S02", "IS-0052--personazhi"], "h": "<ul>\n<li><strong>Максим</strong> — предмет разговора, в сцене не присутствует. Спортсмен, лучший в колледже или в городе; занялся спортом от скуки; быстрый в походе; дома держит медведя; в прошлом походе завёл группу в пещеру и заблудился, похищал медвежонка, поймал и съел лису. Оценка друга: «у него всё идеальное же выходит».</li>\n<li><strong>Саша</strong> — тот, кто против участия Максима в походе; сам называет себя атлетом, ходил с Максимом раньше, стёр ноги до крови.</li>\n<li><strong>Андрей</strong> — второй участник разговора, с Максимом в поход раньше не ходил, о его выходках знает не всё.</li>\n</ul>\n<p>В тексте пролога реплики местами приписаны одному и тому же имени (несколько подряд идущих реплик подписаны «Саша», включая ту, которую по смыслу подаёт Андрей), а в одной реплике стоит имя «Яра»: «и только из-за того что двигается быстро ты так Яра был против». Это не оговорено в переписке.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "IS-0052-S03", "IS-0052--mesto-vo-vselennoy"], "h": "<p>Пролог — один из трёх, начатых Славой одновременно (2025-05-04, id 323648–323651). Слава сформулировал: «Я написал три пролога. Ну или начало 3 истории», и объяснил, почему просит выбрать: «Вот только я не могу сконцентрироваться на одном. Так как думаю о других. Поэтому делаю выбор, который возможно не как не повлияет. Но очень важен для меня».</p>\n<p>Список из трёх (id 323651):</p>\n<ol>\n<li>апокалипсис («всё же решил попробовать ещё раз») — <a href=\"IS-0053.html\">Пролог про апокалипсис</a></li>\n<li>максим — эта запись</li>\n<li>автопилот</li>\n</ol>\n<p>Третий пролог, «автопилот», в переписке не показан.</p>\n<p>Условие выбора Слава поставил заранее: он скидывает два пролога, Миколай решает, какой продолжить первым (id 323652), и «Только ты должен будешь сразу ответить» (id 323655).</p>\n<p>Вселенная в переписке не объявлена; в базе история отнесена к Нимбу по дате объявления.</p>", "r": [["Пролог про апокалипсис", "IS-0053.html"]]}, {"t": "Состояние", "a": ["S04", "IS-0052-S04", "IS-0052--sostoyanie"], "h": "<p><strong>2025-05-04, id 323658</strong> — пролог написан и показан соавтору. Отправлен первым из двух.</p>\n<p><strong>2025-05-04, id 323661</strong> — Миколай: «мне второй больше нравится, поэтому предлагаю продолжить первый». То есть больше понравился пролог про апокалипсис (<a href=\"IS-0053.html\">Пролог про апокалипсис</a>), а продолжать он предлагает пролог про Максима.</p>\n<p><strong>2025-05-04, id 323664, 323667</strong> — Слава спрашивает «Почему?», Миколай отвечает на оба вопроса сразу:</p>\n<ul>\n<li>почему нравится второй: «я просканировал и чувствую что я буду это читать и мне будет легко, кажется такое сложно поддерживать долго»;</li>\n<li>почему предлагает продолжить первый: «мне интересно во что в конечном итоге это выйдет. и кажется диалоги развивать сложнее, а я уважаю выбор в сторону усложнения. ммм, имею ввиду я не пробовал писать диалоги, поэтому хочу увидеть как можно с этим работать».</li>\n</ul>\n<p>Слава отвечает «Ок» и «Спасибо» (id 323668, 323669).</p>\n<p><strong>2025-05-04, id 323672</strong> — Миколай уточняет: «справедливости ради и во втором есть диалоги, но впечатление я дал по началу, как одно и как другое зацепило».</p>\n<p><strong>Позже (окно w0091, id 323926–323934)</strong> — Слава сообщает, что удалил историю и переписал пролог заново. Текст переписанного пролога в этом окне не приведён.</p>", "r": [["Пролог про апокалипсис", "IS-0053.html"]]}, {"t": "Пробелы", "a": ["S05", "IS-0052-S05", "IS-0052--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вселенная при написании не объявлена; отнесение к Нимбу — по дате.</li>\n<li>Третий пролог, «автопилот», не показан и не обсуждался.</li>\n<li>В нумерации Славы (id 323651) апокалипсис стоит первым, а Максим вторым; отправлены они в обратном порядке — сначала Максим, потом апокалипсис. Слова Миколая «первый»/«второй» отдельно не расшифрованы.</li>\n<li>Что было в переписанном варианте пролога (w0091) — здесь не сказано.</li>\n<li>Кто такая «Яра» из реплики Саши и почему часть реплик подписана одним именем — не оговорено.</li>\n<li>Куда история должна была идти дальше похода, что происходит после сборов — в переписке не сказано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["IS-0052--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает истории:</strong> <a href=\"IS-0053.html\">Пролог про апокалипсис</a></li>\n<li><strong>Упомянут в историях:</strong> <a href=\"IS-0053.html\">Пролог про апокалипсис</a>, <a href=\"IS-0054.html\">История про лесоруба</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["IS-0052--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-05-04</td>\n<td>323648–323672</td>\n<td>w0090</td>\n<td>Нимб (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/istorii/IS-0052-prolog-pro-maksima.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["IS-0052--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/IS-0052.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
