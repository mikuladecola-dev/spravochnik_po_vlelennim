<script>const BASE="";const DOCNAME="Церковь с паладинами";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0172-S01", "MR-0172--ustroystvo"], "h": "<p>Церковь, состоящая при паладинах и вере в них. В переписке заведена одной строкой в перечне сил мира: «Церковь с паладинами ( мёртвыми рыцарями которых оживил один челик, для верующих) паладины до хрена сильный но их ней движения предсказуемый. Они больше как роботы с повторяющими движениями» (2025-11-17, id 385768).</p>\n<p>Паладины — мёртвые рыцари, оживлённые «для верующих». Их боевая характеристика задана парой: огромная сила при предсказуемом рисунке движений, «они больше как роботы с повторяющими движениями».</p>\n<p>Оживил паладинов человек, которому тут же дано имя: «Организация челика который и оживил паладинов. Давай челика назовём Виктор». Виктор при этом ведёт отдельную от церкви организацию — в перечне это два разных пункта, идущих подряд: «Церковь с паладинами» и «Организация челика который и оживил паладинов». Виктор «верит в красный ток что оживляет людей. И он многих оживил, но разум так и не смог в них оживить». Позже про него сказано иначе: «Виктор, что воскрешает трупы, ну точнее делает из них марионеток» (2025-12-06, id 393308).</p>\n<p><strong>Матка Аскизов как предмет культа.</strong> В том же перечне сказано: «Аскизы. Матка Аскизов стало предметом веры для какой-то верологий» (2025-11-17, id 385768). Позже это привязано к церкви прямо: «Матка. Находиться в церкви. И люди им поклоняются, а детей маток считают святыми» (2025-12-06, id 393465).</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0172-S02", "MR-0172--naselenie"], "h": "<p>Паладины — мёртвые рыцари, оживлённые Виктором, лишённые оживлённого разума (по формулировке о Викторе: «многих оживил, но разум так и не смог в них оживить»).</p>\n<p>Верующие — те, для кого паладины и оживлены; они же поклоняются матке Аскизов, а детей матки считают святыми.</p>\n<p>Матка Аскизов — находится в церкви.</p>\n<p>Иерархия внутри самой церкви, наличие священства, численность паладинов и верующих в переписке не названы.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0172-S03", "MR-0172--mesto-vo-vselennoy"], "h": "<p>Церковь входит в перечень сил мира Оам, выстроенный по силе (2025-11-17, id 385768; повторён 2025-12-06, id 393287). В перечне:</p>\n<ul>\n<li>Коты. Их 9, они сильнейшие, «и вот они есть в каждую эпоху. Если один кот умрёт родиться новый и всегда их будет 9. Они вообще никуда не вмешиваться».</li>\n<li>Апостолы — «21 вторая по силе раса на земле (опять раса, в мире есть просто индивиды который могут быть сильными)». «Апостолы очень часто устраивают без порядок разрушая укорененый баланс между всеми. Из-за них по итогу в современном мире раскроется существования тёмный изнанки но это будет в будущем в будущем».</li>\n<li>Дальше идут «расы и организации который равны по силе с друг другом» — и в этой части перечня стоит церковь с паладинами. Вместе с ней в этой части: Дети мирового древа («Живут в мести которой мутировала от Оам»); Проротой, «каменный челике», владеющие преступной организацией и состоящие в неком союзе с апостолами; Азуриэль — «Как народ что прячется от цивилизации. Но некоторый всё же живут среди людей»; группировка сестры («который теперь будет дочерью Имитатора. И я не знаю какие у неё будет цель»); «Правителская организации по контролю всех этих. Сильнейшая там девченка что может изменять мир волнами»; организация Виктора; Пернатые («Серафим, Пераги и кто-нибуть ещё»); орден, «предназначеный для убийства котов»; вампиры — «просто аристократы»; Аскизы.</li>\n</ul>\n<p>Общий вывод по перечню сформулирован так: «В нашем мире Оэм уже существует много сторон для конфликта» (2025-12-06, id 393290).</p>\n<p><strong>Роль в конфликте.</strong> Церковь отнесена к промежуточным злодеям: «Вообще промежуточными злодеями будут Дети мирового древа И клан крылатых ( Серафим)» — и следом: «Ну или церкви, да и люди иногда» (2025-12-06, id 393305–393306). Туда же добавлен Виктор (id 393308). Основных злодеев при этом двое: «Ну вот у меня в голове два основных злодея» (id 393309) — кто именно, в этом фрагменте не названо.</p>\n<p>Мир, в котором стоит церковь, — <a href=\"MR-0165.html\">Мир Оам</a>. Расы, перечисленные рядом, описаны там же.</p>", "r": [["Мир Оам", "MR-0165.html"]]}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0172-S04", "MR-0172--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-11-17 (id 385768–385769).</strong> Церковь заведена строкой в общем перечне сил: паладины — оживлённые мертвецы, огромная сила при предсказуемом, повторяющемся рисунке движений. Тогда же имя оживившего названо на месте: «Давай челика назовём Виктор». Матка Аскизов в этой версии — «предмет веры для какой-то верологий», без указания, что верология и есть эта церковь. Про самих Аскизов сказано: «Ну и Аскизы. Я не знаю где они живут» (id 385769).</p>\n<p><strong>Версия 2 — 2025-12-06 (id 393286–393290).</strong> Тот же перечень выложен заново дословно, без изменений, с пометкой «Давай вспомним» (id 393289) и выводом о количестве сторон конфликта (id 393290). Формулировка про паладинов повторена в точности.</p>\n<p><strong>Версия 3 — 2025-12-06 (id 393305–393310).</strong> Церковь отнесена к промежуточным злодеям — наряду с детьми мирового древа, кланом крылатых и людьми («да и люди иногда»). Виктор в этой же реплике переописан как тот, кто «воскрешает трупы, ну точнее делает из них марионеток».</p>\n<p><strong>Версия 4 — 2025-12-06 (id 393464–393467).</strong> Матка Аскизов помещена в церковь: «Матка. Находиться в церкви. И люди им поклоняются, а детей маток считают святыми». Так неопределённая «какая-то верология» из версии 1 сомкнута с церковью паладинов.</p>\n<p>Ранние состояния ничем не отменены: описание паладинов от 2025-11-17 повторено без правок 2025-12-06.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0172-S05", "MR-0172--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Не сказано, во что церковь верит помимо матки и святости её детей: доктрина, обряды, названия не даны.</li>\n<li>Не сказано, где церковь находится географически.</li>\n<li>Неясно, подчинены ли паладины церкви или Виктору: организация Виктора и церковь стоят в перечне как разные пункты, отношение между ними не названо.</li>\n<li>Не сказано, сколько паладинов и можно ли делать новых.</li>\n<li>«Красный ток», в который верит Виктор, только назван; что это, в этих фрагментах не раскрыто.</li>\n<li>Не сказано, как матка Аскизов попала в церковь и добровольно ли она там находится; отдельно зафиксировано, что где живут Аскизы вообще, автор ещё не решил.</li>\n<li>Двое «основных злодеев», названные 2025-12-06 (id 393309), в этих фрагментах не поименованы.</li>\n<li>Соотношение церкви с правительственной организацией по контролю и с орденом убийц котов не обсуждалось.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0172--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0165.html\">Мир Оам</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0061.html\">Церковь с паладинами</a>, <a href=\"GR-0062.html\">Паладины</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0008.html\">Оам</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0172--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-11-17</td>\n<td>385768–385769</td>\n<td>w0109</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-06</td>\n<td>393286–393290</td>\n<td>w0112</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-06</td>\n<td>393305–393310</td>\n<td>w0112</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-06</td>\n<td>393464–393467</td>\n<td>w0112</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0172-cerkov-s-paladinami.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0172--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0172.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
