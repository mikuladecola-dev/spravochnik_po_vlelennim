<script>const BASE="";const DOCNAME="Гении (ранее «Аномалия»)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0003-S01", "GR-0003--chto-eto"], "h": "<p>Разведка записала «Гениев» как группу, но в переписке это не группа с известным составом, а <strong>категория внутри апостолов</strong> — рубрика, под которую подводят отдельных персонажей. Определение дал Слава одной репликой (2025-03-06, id 298875): «давай теперь таких называть Гениями то бишь, апостол со самой странной способностью, у каждого поколения такой был».</p>\n<p>Из этого следует ровно два признака:</p>\n<ul>\n<li>Гений — это апостол (то есть Гении не отдельный вид, а выделенная часть апостолов);</li>\n<li>в каждом поколении такой был один — «у каждого поколения такой был».</li>\n</ul>\n<p>Что именно считается «самой странной способностью» и кто решает, чья способность страннее, в переписке не сказано. Миколаю определения не хватило, он попросил пример: «пример дай пж», «а то все равно не до конца пон» (id 298881–298882). Слава ответил одним словом — «Бессмертный» (id 298883). Больше примеров не приводилось.</p>\n<p>Прежнее название категории — «Аномалия» (id 298877–298878: «а как до этого ты их называл?» — «Аномалия»).</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0003-S02", "GR-0003--sostav"], "h": "<p>В карточке базы к группе привязаны две записи, и обе — про одного и того же персонажа, единственный названный пример категории:</p>\n<ul>\n<li><strong><a href=\"PS-0211.html\">Мальчик из братской могилы (Бессмертный)</a></strong> — Мальчик из братской могилы (Бессмертный);</li>\n<li><strong><a href=\"IS-0013.html\">Бессмертный</a></strong> — Бессмертный (история).</li>\n</ul>\n<p>Поимённого состава категории в переписке нет. Названо, что Гений был в каждом поколении, но кроме Бессмертного не назван ни один — ни из прошлых поколений, ни из нынешнего.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Третье — единственный пример, растащенный по четырём номерам. <code>PS-0211</code> «Мальчик из братской могилы (Бессмертный)» — три ссылки, база 58 295. <code>IS-0013</code> «Бессмертный» — три ссылки, 44 010. <code>PS-0184</code> «Бессмертный выродок» — четыре ссылки, 10 676. Сто тринадцать тысяч знаков на одного персонажа, разложенные так, что в составе группы стоят две записи из трёх, а самая цитируемая — <code>PS-0184</code>, с четырьмя ссылками — в составе не стоит вовсе. Прежде чем идти за вторым примером категории, надо понять, один ли человек в этих трёх записях.</p></div>\n<div class=\"mnote\"><b>⚙ машинная заметка · С чего начать — не материал авторов</b>\n<ul>\n<li><code>PS-0184</code> — 10 676 знаков, четыре ссылки. Начинать отсюда: это самая связанная запись из всего «бессмертного» куста и единственная, которая в состав группы не попала.</li>\n<li><code>PS-0211</code> — 58 295 при статье на 36 542. Двадцать тысяч знаков про единственный названный пример категории в статью не вошли; если где-то сказано, к какому поколению он относится, то там.</li>\n<li><code>MR-0116</code> «Аномалия (мир внутри Кильки)» — статья есть, база 2 088, ноль ссылок. Крошечная запись, и именно она решает вопрос про совпадение названий: если в этих двух тысячах знаков нет ничего про категорию апостолов, то «Аномалия» — просто омоним, и пробел закрывается отрицательным ответом.</li>\n<li><code>MR-0113</code> «Апостол (вселенная)» — 44 953, статья есть. Второе место, где может быть сказано про смену поколений.</li>\n</ul></div>", "r": [["Мальчик из братской могилы (Бессмертный)", "PS-0211.html"], ["Бессмертный", "IS-0013.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0003-S03", "GR-0003--obschie-sposobnosti-gruppy"], "h": "<p>Общий признак у Гениев один и он же определяющий: это апостол «со самой странной способностью» своего поколения. Никаких дополнительных умений, отличающих Гениев от прочих апостолов, в переписке не названо. Не сказано и того, странность способности — это отдельное свойство или просто оценка на фоне остальных апостолов поколения.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S04", "GR-0003-S04", "GR-0003--otnosheniya-s-drugimi-gruppami"], "h": "<p>Гении — подмножество апостолов: категория определена через апостолов («апостол со самой странной способностью»). Отношения с какими-либо иными группами в переписке не обсуждались.</p>\n<p>В карточке базы <a href=\"SP-0193.html\">Гении</a> в связях перечислены «Аномалия (мир внутри Кильки)», «Бессмертный» и «Килька». Из них в самой переписке фигурируют только слово «Аномалия» как старое название категории и «Бессмертный» как пример. Совпадает ли категория-«Аномалия» с миром внутри Кильки или это одинаковые названия у разных вещей — в переписке не сказано.</p>", "r": [["Гении", "SP-0193.html"]]}, {"t": "Как менялась — по датам", "a": ["S05", "GR-0003-S05", "GR-0003--kak-menyalas"], "h": "<p><strong>До 2025-03-06 — «Аномалия».</strong> По словам Славы, категория раньше называлась «Аномалия» (id 298878). Момент введения этого названия в данном разговоре не обсуждается.</p>\n<p><strong>2025-03-06 (id 298872–298886) — переименование в «Гении».</strong> Разговор начал Миколай, у которого в памяти держалась другая формулировка: «а я чет другое будто помню», «что типа страные благословенные», «или ты про другое?» (id 298872–298874). Слава подтвердил, что говорил об этом, и тут же переименовал категорию: «Ну я говорил, только давай теперь таких называть Гениями то бишь, апостол со самой странной способностью, у каждого поколения такой был» (id 298875). Миколай согласился одним словом — «хорошо» (id 298876). Дальше он уточнил старое название и попросил пример; получил «Бессмертный».</p>\n<p>Отдельно фиксируется вариант «страные благословенные» — формулировка, которую Миколай помнил как рабочее обозначение этих же персонажей. Она не была ни подтверждена, ни явно отвергнута: Слава ответил «я говорил», но название заменил на «Гении». Так что «странные благословенные» остаётся третьим бывшим обозначением того же, наряду с «Аномалией», а не действующим названием.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "GR-0003-S06", "GR-0003--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет. Названо, что Гений есть в каждом поколении, но назван только один — Бессмертный.</li>\n<li>Не сказано, о каком поколении идёт речь применительно к Бессмертному и сколько поколений вообще есть.</li>\n<li>Критерий «самой странной способности» не раскрыт: непонятно, как сравниваются способности и кто присваивает статус.</li>\n<li>Не сказано, знают ли сами Гении о своей категории и знает ли о ней кто-то в мире, или это внешняя классификация авторов.</li>\n<li>Иерархия внутри категории не обсуждалась; отношений между Гениями разных поколений в переписке нет.</li>\n<li>Не сказано, отличаются ли Гении друг от друга чем-то помимо самих способностей.</li>\n<li>Осталось нерешённым соотношение названий: «Аномалия» как старое имя категории и «Аномалия» как мир внутри Кильки в переписке не разведены.</li>\n<li>Судьба варианта «страные благословенные» не проговорена — отменён он или это было чьё-то параллельное обозначение.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0003--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0211.html\">Мальчик из братской могилы (Бессмертный)</a></li>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0193.html\">Гении</a></li>\n<li><strong>Упоминает истории:</strong> <a href=\"IS-0013.html\">Бессмертный</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0003--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0003.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0003-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0003/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первое — поколения. <code>SL-0054</code> «Список 12 апостолов»: три ссылки, статьи нет, база 234 052 знака. Определение Гения целиком держится на слове «поколение» — «у каждого поколения такой был», — а перечня апостолов, по которому эти поколения только и можно нарезать, в справочнике нет. Пробелы «о каком поколении речь применительно к Бессмертному» и «сколько поколений вообще есть» — это один пробел, и он весь внутри этой записи. Четверть мегабайта материала без статьи, и на неё же ссылаются три другие сущности.</p>\n<p>Второе — сама категория. <code>SP-0193</code> «Гении»: одна ссылка, статья есть на 5 789, база 2 539. Две с половиной тысячи знаков — это ровно тот десяток реплик 2025-03-06, что уже процитирован построчно. Статья вдвое длиннее источника. Добирать про Гениев неоткуда: всё, что о них есть, уже здесь, и это стоит зафиксировать, чтобы не искать дважды.</p>\n<p>Третье — единственный пример, растащенный по четырём номерам. <code>PS-0211</code> «Мальчик из братской могилы (Бессмертный)» — три ссылки, база 58 295. <code>IS-0013</code> «Бессмертный» — три ссылки, 44 010. <code>PS-0184</code> «Бессмертный выродок» — четыре ссылки, 10 676. Сто тринадцать тысяч знаков на одного персонажа, разложенные так, что в составе группы стоят две записи из трёх, а самая цитируемая — <code>PS-0184</code>, с четырьмя ссылками — в составе не стоит вовсе. Прежде чем идти за вторым примером категории, надо понять, один ли человек в этих трёх записях.</p>\n<p>Отдельно, как ловушка: <code>PS-0326</code> «Бессмертный апостол» (статьи нет, 2 295) относится к вселенной «Оам», а <code>SL-0077</code> «Анализ \"Бессмертного\"» (статьи нет, 15 252) помечен как вне вселенной. По имени они подходят идеально, по принадлежности — нет. Их легко подтянуть сюда по ошибке.</p>\n<h3>С чего начать</h3>\n<p>В базе:</p>\n<ul>\n<li><code>PS-0184</code> — 10 676 знаков, четыре ссылки. Начинать отсюда: это самая связанная запись из всего «бессмертного» куста и единственная, которая в состав группы не попала.</li>\n<li><code>PS-0211</code> — 58 295 при статье на 36 542. Двадцать тысяч знаков про единственный названный пример категории в статью не вошли; если где-то сказано, к какому поколению он относится, то там.</li>\n<li><code>MR-0116</code> «Аномалия (мир внутри Кильки)» — статья есть, база 2 088, ноль ссылок. Крошечная запись, и именно она решает вопрос про совпадение названий: если в этих двух тысячах знаков нет ничего про категорию апостолов, то «Аномалия» — просто омоним, и пробел закрывается отрицательным ответом.</li>\n<li><code>MR-0113</code> «Апостол (вселенная)» — 44 953, статья есть. Второе место, где может быть сказано про смену поколений.</li>\n</ul>\n<p>В архив — за тем, что было до. Реплики Миколая 2025-03-06 (id 298872–298874) — «а я чет другое будто помню», «что типа страные благословенные» — прямо указывают на более ранний разговор, которого в этом окне нет. Слава подтверждает: «Ну я говорил». Значит, где-то раньше 6 марта существует окно, где эта категория вводилась впервые и называлась «Аномалия». Искать надо там же, где обсуждались апостолы и странные способности, то есть в январских и февральских окнах, до 298872. Всё содержательное про категорию, кроме переименования, лежит в том разговоре, а не в этом.</p>\n<p>Само окно 2025-03-06 маленькое: id 298872–298886, полтора десятка сообщений. Перечитывать его повторно смысла нет — статья взяла из него всё.</p>\n<h3>Как развивалось</h3>\n<p>До 2025-03-06 категория существовала под именем «Аномалия» — момент её появления в этом разговоре не обсуждается вовсе, он остаётся в прошлом обоих участников и всплывает только как справка. 2025-03-06 — заявлено новое имя и одновременно дано определение: «апостол со самой странной способностью, у каждого поколения такой был». Согласие получено одним словом — «хорошо». Тут же категорию ограничили с двух сторон: снизу — попросили пример и получили один, «Бессмертный»; сверху — так и не назвали, что считается странной способностью. После этого дня к категории не возвращались: ни второго примера, ни уточнения критерия, ни решения по третьему обозначению, «странные благословенные», в материалах нет.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>В разговоре 2025-03-06 названы два обозначения одного и того же. То, которое помнил Миколай, — «страные благословенные». То, которое вводится взамен, — «Гении, то бишь апостол со самой странной способностью». Слава подтверждает, что говорил именно об этом: «Ну я говорил».</p>\n<p>Между двумя формулировками произошло сужение. В первой признак странности приписан благословенным вообще, во второй — только апостолам. Апостолы при этом остаются частью благословенных, а не отдельным видом.</p>\n<p>Для апостолов правило названо: странная способность выделяет одного на поколение и даёт ему имя категории. Для остальных благословенных, к которым тот же признак применялся до переименования, правила того же рода нет — перестала ли странность способности что-либо означать за пределами апостолов, в переписке не сказано, и сужение прошло молча, внутри одной реплики.</p>\n<h3>Отклик</h3>\n<p>Самое живое здесь — механика самого разговора. Один человек говорит: «а я чет другое будто помню», второй отвечает «я говорил» и тут же переименовывает то, о чём говорил. То есть неточность чужой памяти закрыли не восстановлением прежней формулировки, а новым именем — проще выдать другое слово, чем выяснять, какое было. И следом «пример дай пж», «а то все равно не до конца пон» — единственный раз, когда определение проверили на прочность, и ответом стало одно слово: «Бессмертный». Хватило. Дальше согласие, и категория в этом виде живёт до сих пор.</p>\n<p>Отдельно нравится сама формулировка: «апостол со самой странной способностью». Не сильнейший, не худший, не избранный — самый странный. Это оценочная категория, вделанная в устройство мира: чтобы попасть в Гении, надо, чтобы кому-то показалось. Кто этот кто-то, статья честно спрашивает и не отвечает, и по-моему это лучшее, что в ней есть. Из двух признаков и одного примера вышло что-то, о чём хочется спросить дальше, — а спрашивать пока не у кого: разговор кончился в тот же день, когда начался.</p></div>", "r": []}];</script>
