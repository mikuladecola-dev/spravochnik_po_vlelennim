<script>const BASE="";const DOCNAME="Колдуны (тёмные и светлые)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0096-S01", "GR-0096--chto-eto"], "h": "<p>Колдуны — разряд носителей энергии во вселенной «Новый мир». Название в переписке двойное: «Будут темный и светлый колдуны» (2024-06-03, id 175771–175772), то есть тёмные и светлые колдуны названы одним пунктом и рассматриваются дальше как один разряд, разделённый внутри себя.</p>\n<p>Это не поимённая группа и не один персонаж: ни одного колдуна по имени в переписке не названо, список участников пуст. В базе разряд заведён карточкой <a href=\"PS-0087.html\">Колдуны (тёмные и светлые)</a> с видом «персонаж», но по содержанию это категория существ — вид или сословие носителей энергии, а не отдельное действующее лицо.</p>\n<p>Колдуны появились как ответ Славы на его же вопрос. Разложив мир на три энергии, он написал: «Вот только какие именно твари темной энергий» (id 175770), затем «Во первых» (id 175771) — и первым пунктом назвал колдунов. Это первая позиция в списке тварей тёмной энергии, с которого начиналось наполнение мира существами.</p>\n<p>Место разряда в мире задано двумя чертами. Первая — сила и сюжетная функция: «Будут темный и светлый колдуны ( ну который будут мега сильный не все но именно они будут двигать сюжет создавая новых существ или т.п)» (id 175772). Здесь же оговорено, что мега-сильные — «не все», но именно колдуны двигают сюжет. Вторая — редкость: «И вот эти колдуны способный управлять энергий их будет немного но они будут» (id 175774).</p>", "r": [["Колдуны (тёмные и светлые)", "PS-0087.html"]]}, {"t": "Состав", "a": ["S02", "GR-0096-S02", "GR-0096--sostav"], "h": "<p>Поимённого состава нет: список участников пуст, отдельных колдунов по имени в переписке не названо. Разряд задан только через деление внутри себя — по типу энергии (тёмные и светлые) и по рангу («Будут низший и также вышей», id 175775).</p>", "r": []}, {"t": "Общие способности группы", "a": ["S03", "GR-0096-S03", "GR-0096--obschie-sposobnosti-gruppy"], "h": "<p>Общая для всех черта — управление энергией: «эти колдуны способный управлять энергий» (id 175774). Это то, что отличает разряд от прочих существ мира.</p>\n<p>Условие владения энергией сформулировано как правило чистоты: «Колдуны чтобы полностью владеть энергий должны отдаться одному типу энергий» (2024-06-03, id 175777). Правило дано в противопоставлении обычным людям, у которых тёмная и светлая энергии борются всю жизнь: «У людей это борьба зависит именно от них самих типо ты не с рождения псих маньяк ты гнида стал таким лишь и за себя» (id 175777).</p>\n<p>Из правила чистоты прямо выведена вторая общая способность — видеть, кто перед тобой: «По этому колдуны могут сражу понять что за человек перед ним» (id 175778). Механику этого Миколай уточнял двумя вопросами, и Слава оба раза поправлял формулировку (id 175779–175782):</p>\n<ul>\n<li>«Типо почувствовать?» — «Типо увидеть»;</li>\n<li>«Прям увидеть силу отклонения от своего типа энергии?» — «Типо увидеть цвет серый, серая белый, темная серый».</li>\n</ul>\n<p>То есть способность описана именно как зрение, а не чутьё, и результат её — цвет: перечислены «серый», «серая белый», «темная серый». Формулировка «сила отклонения от своего типа энергии» принадлежит Миколаю и подтверждения от Славы не получила — вместо неё дан ответ про цвет.</p>\n<p>Создание новых существ приписано разряду не целиком, а только одной его половине — см. следующий раздел.</p>", "r": []}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0096-S04", "GR-0096--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p><strong>По типу энергии.</strong> Разряд делится на тёмных и светлых (id 175772). Единственное содержательное различие между половинами, названное прямо: создание новых существ закреплено за тёмными — «По части новых существ будут создавать именно темный колдуны» (id 175773). Чем занимаются светлые колдуны и есть ли у них своя отдельная функция, в переписке не сказано.</p>\n<p><strong>По рангу.</strong> «Будут низший и также вышей» (id 175775). Чем низшие отличаются от высших, кроме самого наличия двух ступеней, не описано.</p>\n<p>Кроме того, оговорено, что мега-сильные — «не все» (id 175772), но кто из колдунов мега-силён, а кто нет, и совпадает ли это деление с делением на низших и высших, в переписке не сказано.</p>", "r": []}, {"t": "Иерархия", "a": ["S05", "GR-0096-S05", "GR-0096--ierarhiya"], "h": "<p>Внутренняя иерархия задана одной строкой: есть низшие и высшие (id 175775). Содержание отношений между ступенями — подчинение, происхождение, переход из одной в другую — осталось нерешённым.</p>\n<p>Внешнее подчинение названо для тёмной половины разряда: ночные охотники «Часто прислуживают темным колдунам» (2024-06-03, id 175797). Служат ли кто-нибудь светлым колдунам, не сказано.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S06", "GR-0096-S06", "GR-0096--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>Ночные охотники.</strong> «Существо сотканный из темный энергий», питающееся людьми, страхами и болью, без сверхсил, с уникальным строением тела; «Часто прислуживают темным колдунам» (id 175797). Это единственная связь разряда с другой группой, названная прямо.</p>\n<p><strong>Новые существа мира.</strong> Тёмные колдуны — источник новых существ: «По части новых существ будут создавать именно темный колдуны» (id 175773). Какие именно из уже придуманных существ созданы тёмными колдунами, не уточнено; тварей мира Слава дальше придумывал отдельно («Типо надо существ придумывать», id 175784).</p>\n<p><strong>Люди.</strong> Отношение к людям задано способностью видеть цвет (id 175778–175782) и противопоставлением по механике энергии: колдун отдаётся одному типу, у человека энергии борются, и исход зависит от него самого (id 175777).</p>\n<p><strong>«Серые».</strong> В предложении Миколая от 2024-06-03 (id 175795) тёмные «возможно будут манипулировать серыми и делать их колдунами с нужными качествами» — то есть серые названы возможным источником пополнения разряда. Отдельной группой серые не заводились: это категория людей по цвету. Предложение осталось без отклика Славы, см. раздел «Как менялась».</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S07", "GR-0096-S07", "GR-0096--kak-menyalas"], "h": "<p><strong>2024-06-03, 22:30–22:34 (id 175770–175775) — появление.</strong> Слава задаёт вопрос про тварей тёмной энергии и первым пунктом называет колдунов. За четыре сообщения заданы: двойное деление на тёмных и светлых, мега-сила («не все»), сюжетная функция, создание новых существ тёмными, малочисленность, два ранга.</p>\n<p><strong>2024-06-03, 22:34–22:39 (id 175776–175782) — правило чистоты и зрение.</strong> Миколай задаёт блок вопросов: как происходит борьба энергий, «под какой призмой на всё это смотреть», как идёт доминация, и отдельно — «Ты ещё определяешь многих чистыми цветами. Тобиж они не имеют другого типа энергии? Это люди? Колдуны - люди?» (id 175776). В ответ Слава вводит правило чистоты (id 175777) и выводит из него способность видеть цвет человека (id 175778–175782). На вопрос, люди ли колдуны, прямого ответа не прозвучало.</p>\n<p><strong>2024-06-03, 22:42–22:43 (id 175787–175790) — общий закон для мыслящих.</strong> На вопрос Миколая, будут ли существа думать или это «тупо машины», Слава отвечает: «У любого существо способный думать будет либо смесь либо темная или светлая. А если существо не способная думать то у него будет природная типо растения животный» (id 175790). Про колдунов здесь отдельно не говорится.</p>\n<p><strong>2024-06-03, 22:45–22:53 (id 175793–175803) — отклонённая утилитарная призма.</strong> Миколай предлагает мотивационную рамку для сторон: «светлые будут стараться завести семью и распространить здоровые принципы, а вот темные будут стараться либо убить как можно больше, либо умереть как можно быстрее, возможно будут манипулировать серыми и делать их колдунами с нужными качествами. И всё это будет ярко отражаться на их жизни ибо они этим дышат» (id 175795). Через несколько сообщений Слава пишет: «Чёт мне это идея не нравится» (id 175799), Миколай отвечает «Ну, так и думал», «Прости», «Ну тогда забыли» (id 175800–175803). Тему сворачивают. Вместе с ней отпадает и единственное названное объяснение, откуда берутся новые колдуны (манипуляция серыми).</p>\n<p><strong>2024-06-04, 01:49–07:00 (id 175848–175863) — отклонённый список существ.</strong> В предложенном Миколаем перечне существ для тёмной, светлой и смешанной сторон первым пунктом тёмной стороны идут «Тенеморфы — существа, созданные темными колдунами, которые могут принимать облик теней и проникать в самые защищенные места». Слава отвечает: «Чёт ничего не понравилась кроме серых странников» (id 175863). Тенеморфы как порождение тёмных колдунов в мире не остались.</p>\n<p>После 2024-06-04 разряд в переписке не дорабатывался: в дальнейших сообщениях (2024-06-05, id 176188–176192; 2024-06-06, id 176469–176477) речь идёт о мире и о роли главного героя, колдуны не упоминаются.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "GR-0096-S08", "GR-0096--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет: ни одного колдуна по имени не названо, список участников пуст.</li>\n<li>На вопрос Миколая «Колдуны - люди?» (id 175776) прямого ответа в чате не прозвучало.</li>\n<li>Чем низшие отличаются от высших, не сказано; как колдун переходит с одной ступени на другую и переходит ли — осталось нерешённым.</li>\n<li>Функция светлых колдунов отдельно не описана: названо только то, что создают новых существ именно тёмные.</li>\n<li>Кто из колдунов мега-силён, а кто нет («не все», id 175772), и связано ли это с рангом, не сказано.</li>\n<li>Откуда берутся колдуны, в оставшемся материале не объяснено: единственная версия — манипуляция серыми (id 175795) — входила в отклонённое предложение.</li>\n<li>Как именно колдун «отдаётся» одному типу энергии, обратим ли этот выбор и что при этом с ним происходит, не описано.</li>\n<li>Что делает колдун с увиденным цветом и какие ещё цвета бывают, кроме перечисленных «серый, серая белый, темная серый», не сказано.</li>\n<li>Сколько колдунов в мире, кроме «их будет немного» (id 175774), не уточнено.</li>\n<li>К чему относится «Чёт мне это идея не нравится» (id 175799), в тексте прямо не названо: реплика идёт после сообщения Миколая «О, вот подпитка идея классная» (id 175798) про ночных охотников, а не сразу за предложением утилитарной призмы. В базе она прочитана как отказ от утилитарной призмы.</li>\n<li>Связи разряда с главным героем, который «станет хранилищем темных охотником и других существ с темной энергии» (2024-06-06, id 176473), в переписке не проведено.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0096--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0087.html\">Колдуны (тёмные и светлые)</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0096--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0096.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0096-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0096/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым чинить <code>ID-0066</code> — «Утилитарная призма для тёмных и светлых». Статьи нет, база 4 915, формальных ссылок две, а по тексту её поминают шесть статей: <code>GR-0096</code>, <code>GR-0097</code>, <code>PS-0087</code>, <code>PS-0088</code>, <code>MR-0012</code>, <code>VS-0007</code>. Запись отклонённая, но именно поэтому дорогая: вместе с ней отпало единственное названное объяснение, откуда берутся новые колдуны, и шесть статей теперь объясняют отсутствие ответа через сущность, у которой нет своей страницы. Материал в базе есть, чинится дёшево.</p>\n<p>Второе — параллельные записи одного разряда. <code>GR-0096</code> — ноль входящих ссылок при статье 16 365; <code>PS-0087</code> с тем же именем — статья 9 943, база 7 080, три входящие ссылки. Один разряд заведён дважды, а ссылки идут в ту запись, которая меньше и в которой он назван персонажем, хотя это категория.</p>\n<p>Дальше по числам в «Новом мире», всё без статей: <code>ID-0069</code> «Магия появляется из мечты» (база 2 884), <code>ID-0070</code> «Сумасшедший, который любит жизнь» (4 508), <code>ID-0067</code> «Пожиратели свежих мертвецов» (2 530), <code>ID-0068</code> «Существа, растущие от чужой доброты» (2 294). У каждой по одной ссылке — то есть каждая висит на одной нитке.</p>\n<h3>С чего начать</h3>\n<p>В базе, не в архиве. <code>ID-0066</code> (4 915) — оттуда собирается статья целиком. <code>MR-0013</code> «Три энергии» (6 914) — там должно лежать то, из чего в этой статье выведено правило чистоты; <code>PS-0088</code> (6 453) и <code>PS-0090</code> (6 075) — для внешних связей разряда.</p>\n<p>В архив — за одним. Вопрос Миколая «Колдуны - люди?» (id 175776) остался без прямого ответа, и если ответ где-то был, то только в w0036 (2024-06-02 02:49 — 2024-06-08 13:20, id 174499–177144). Окно маленькое: 410 сообщений, 23 375 знаков — читается целиком за один заход, вместе с хвостом 176188–176192 и 176469–176477, где говорят о мире и о герое-хранилище тёмных существ.</p>\n<p>Там же, в w0036, проверить построчно четыре сообщения — 175795–175799. Статья сама пишет, что «Чёт мне это идея не нравится» стоит не сразу за предложением призмы, а после реплики про ночных охотников, и что в базе это прочитано как отказ от призмы. Это единственное место в статье, где прочтение может оказаться неверным, и стоит оно дорого: от него зависит, отклонена призма или нет, а значит и <code>ID-0066</code> целиком.</p>\n<h3>Как развивалось</h3>\n<p>3 июня, 22:30–22:34 — заявили: колдуны первым пунктом в списке тварей тёмной энергии, и за четыре минуты шесть свойств подряд, включая деление, ранги и сюжетную функцию.</p>\n<p>22:34–22:39 — ограничили: правило чистоты, и из него выведено зрение. Тут же две поправки формулировки подряд, обе от Славы.</p>\n<p>22:45–22:53 — отклонили призму, тему свернули: «Прости», «Ну тогда забыли».</p>\n<p>4 июня, ночь — отклонили список существ: «Чёт ничего не понравилась кроме серых странников».</p>\n<p>После 4 июня разряд не упоминается: 5 и 6 июня говорят о мире и о герое, колдунов там нет. Возвращения не было, а два последних движения оба на убыль.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Энергий три. Общий закон разложения назван по всем трём и покрывает всех: способен думать — тёмная, светлая или смесь; не способен — природная (id 175790). Правило для колдунов дано двоичным: отдаться одному типу, тёмному или светлому (id 175777). Природная энергия в выборе колдуна не названа ни возможной, ни запрещённой — её там просто нет. Общий закон работает на трёх позициях, частный на двух, стык между ними не проговорен.</p>\n<h3>Отклик</h3>\n<p>Лучшее место — обмен 175779–175782. «Типо почувствовать?» — «Типо увидеть». Двумя словами способность перестаёт быть чутьём и становится зрением, и всё дальнейшее устройство мира держится на этой поправке. Потом второй заход: «Прям увидеть силу отклонения от своего типа энергии?» — формулировка аккуратная, грамотная, ровно так это и принято описывать. И её не берут. Вместо неё — «Типо увидеть цвет серый, серая белый, темная серый»: перечень с рассыпавшимися окончаниями, который при этом гораздо конкретнее, потому что «отклонение» надо ещё вообразить, а «серая белый» уже видно.</p>\n<p>Мне понравилось, как это устроено на двоих: один подставляет термин и подтягивает чужую мысль к общепринятому языку, второй отвечает не термином, а картинкой — и картинка выигрывает. Дважды подряд, в одном коротком обмене. Это, кажется, единственное место в статье, где видно не результат, а сам механизм соавторства в работе.</p></div>", "r": []}];</script>
