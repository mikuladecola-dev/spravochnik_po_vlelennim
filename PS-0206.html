<script>const BASE="";const DOCNAME="Приёмная дочь Альгиза";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0206-S01", "PS-0206--proishozhdenie"], "h": "<p>Персонаж введён Миколаем 2025-02-25 (id 295503–295510, окно w0077) при пересказе более раннего материала — Миколай вспоминает, «как она сбежала», то есть излагает уже существовавший сюжет, а не придумывает его на ходу. В карточке этот материал помечен как чужой.</p>\n<p>Появляется она сразу в служебной роли — как слабость Альгиза: «В итоге там у него была типа приёмная дочь... Ну как у всех серийных убийц. Есть какие-то слабости. Ну этот боялся потерять дочь.»</p>", "r": []}, {"t": "Характер", "a": ["S02", "PS-0206-S02", "PS-0206--harakter"], "h": "<p>Отдельно не описан. Единственное её действие в переписке — побег: «Короче я помню, как она сбежала...»</p>", "r": []}, {"t": "Связи с другими", "a": ["S03", "PS-0206-S03", "PS-0206--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Альгиз</strong> — приёмный отец, серийный убийца. Она названа его слабостью: «этот боялся потерять дочь». В карточке она числится частью Альгиза — то есть введена внутри его материала, а не самостоятельно.</li>\n<li><strong>Земова</strong> — одна из персонажей, которые её пожалели после побега. Миколай помечает её как «тип моя основная, за которую я ролила».</li>\n<li><strong>Серп</strong> — второй из пожалевших, «местный супергерой».</li>\n</ul>\n<p>Про сам эпизод сказано: «И персонажи пожалели её (блин, среди них была Земова... Ну ещё Серп...)».</p>\n<p>Тут же Миколай отмечает параллель: «ОООО У СЕРПА ТОЖЕ ПРИЁМНАЯ ДОЧЬ. Только там пиздец.» Что именно там «пиздец», в переписке не раскрыто.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S04", "PS-0206-S04", "PS-0206--chto-s-nim-stalo"], "h": "<p>Сбежала от Альгиза; после побега её пожалели Земова и Серп. Дальше её линия в переписке не продолжается — версия одна, дат больше нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "PS-0206-S05", "PS-0206--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имени не названо.</li>\n<li>Возраст, внешность, характер не описаны.</li>\n<li>Причина побега не названа.</li>\n<li>Чем побег кончился для Альгиза — в переписке не сказано.</li>\n<li>Что за история со второй приёмной дочерью, у Серпа, — обозначено только словами «там пиздец», содержание не раскрыто.</li>\n<li>Материал помечен как чужой; чей именно — не указано.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["PS-0206--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-02-25</td>\n<td>295503–295510</td>\n<td>w0077</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0206-priemnaya-doch-algiza.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0206--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0206.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0206-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0206/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Самая дешёвая починка стоит прямо в списке пробелов и на уровне базы уже неверна. Написано: «что за история со второй приёмной дочерью, у Серпа, — обозначено только словами „там пиздец“, содержание не раскрыто». Вторая дочь раскрыта — у неё есть имя, вид и статья: <code>PS-0209</code> Серафима, кошкодевочка, приёмная дочь Серпа, происхождение «Её родил кот. От человечечкой сущности». Диапазоны перекрываются: здесь 295503–295510, там 295508–295522. Пробел закрыт соседней карточкой, и об этом не знает ни одна из двух — ссылок между ними нет.</p>\n<p>Дороже другое. Сама эта запись — самая маленькая в кластере: 3 081 знак статьи при 2 192 базы, ссылок ноль, имени нет. При этом на ней держится финал главного узла: побег дочери — последнее, что сказано об Альгизе (<code>PS-0204</code>) перед обрывом, и единственная названная его слабость. Точка, в которой кончается сюжет всего кластера, опирается на персонажа без имени и без материала. Ни статья, ни архив этого не закрывают — но понимать, что это несущая дыра, а не декоративная, стоит.</p>\n<p>Осторожно с Серафимой при любой сшивке. Имя сталкивается с Серафимом из самого «Апостола»: <code>SP-0187</code> «Силы Серафима» (w0077, 295556–295560) и <code>SP-0225</code> «Способности Серафима» (w0094, 2025-05-14) перечисляют одни и те же четыре силы — манипуляция сознанием, контроль времени, управление светом, огонь Божий — и относятся к нему, а не к ней. То есть в одном окне w0077 два разных персонажа с почти одинаковыми именами, между ними тридцать сообщений. Заодно видно, что <code>SP-0187</code> и <code>SP-0225</code> — похоже, одна и та же строка списка, заведённая дважды.</p>\n<h3>С чего начать</h3>\n<p>В базе, архив пока не нужен. Три места, все перекрываются с диапазоном этой статьи:</p>\n<ul>\n<li><code>PS-0207</code> Серп, 295508–295512 — там параллель дочерей названа прямо, с анонсом продолжения «Ты щас сдохнешь»;</li>\n<li><code>PS-0209</code> Серафима, 295508–295522 — там вторая дочь описана;</li>\n<li><code>PS-0204</code> Альгиз, 295465–295507 — там она как слабость и как финал линии.</li>\n</ul>\n<p>В архив — только за концом: чем побег кончился для Альгиза. Ориентир: 25 февраля 2025, окно w0077, после 295522, включая обещанные в <code>PS-0209</code> рисунки.</p>\n<h3>Как развивалось</h3>\n<p>Одна дата, 2025-02-25, одна версия. Персонаж вводится не как персонаж, а как свойство другого — «слабость», в перечислении общего правила про серийных убийц. Единственное её действие названо сразу в прошедшем времени и до всякого описания: «я помню, как она сбежала». Описание после этого не появляется — ни имени, ни возраста, ни причины побега. Линия не продолжается, пересмотров нет.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Про Альгиза сказано в форме правила: у серийных убийц бывают слабости, у него это дочь. Тут же отмечено, что приёмная дочь есть и у Серпа — «ОООО У СЕРПА ТОЖЕ ПРИЁМНАЯ ДОЧЬ». Работает ли для Серпа то же правило, то есть слабость ли она ему, не сказано ни здесь, ни в <code>PS-0207</code>. Параллель проведена по факту наличия дочери и на этом остановлена.</p>\n<h3>Отклик</h3>\n<p>Зацепило то, что персонаж состоит целиком из чужой нужды: она существует, чтобы у убийцы было что терять, и в тот момент, когда она делает единственное собственное действие — уходит, — рассказ обрывается. И отдельно хорош момент, где рассказчица натыкается на рифму в собственной вселенной и явно не ожидала её: «ОООО У СЕРПА ТОЖЕ ПРИЁМНАЯ ДОЧЬ. Только там пиздец.» Не придумывание на ходу, а узнавание задним числом — редко попадается в такой чистой форме.</p></div>", "r": []}];</script>
