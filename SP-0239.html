<script>const BASE="";const DOCNAME="Нейро-сканер";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0239-S01", "SP-0239--mehanika"], "h": "<p>Способность Азуриэля. Названа «Нейро-сканер» (2025-09-17, id 366148).</p>\n<p>Основная формулировка, которую авторы приняли и дальше повторяли без изменений:\n«Его способность это не эзотерическая эмпатия, а гиперразвитое чувство, позволяющее напрямую считывать и интерпретировать биоэлектрическую активность нервной системы других существ» (2025-09-17, id 366148).</p>\n<p>То есть носитель не «чувствует души» и не работает с эзотерикой — он считывает и интерпретирует\nбиоэлектрическую активность чужой нервной системы напрямую, как развитое до предела чувство.</p>\n<p>Первая, более ранняя формулировка того же самого была короче: «Эмпатия. Прекрасно ощущать\nнамерения» (2025-09-17, id 366126).</p>\n<p>Отдельным сообщением к способности добавлена работа с электричеством\n(2025-09-17, id 366159): «он может поглощать электричество и улучшать своё физ. Данные и\nрегенерацию. И бить током прикоснувшись человека или стрелять молнии».</p>\n<p>Итого по этому сообщению в способность входит:</p>\n<ul>\n<li>поглощение электричества;</li>\n<li>усиление за счёт поглощённого своих физических данных и регенерации;</li>\n<li>удар током при касании человека;</li>\n<li>стрельба молниями.</li>\n</ul>\n<p>В сводных пересказах 2025-10-20 (id 376401) и 2025-11-05 (id 382108) блок про Азуриэля приводится\nцеликом, но электрическая часть в этих пересказах не повторена — там только эмпатия, «Нейро-сканер»\nи потеря концентрации в толпе. Отменена ли электрическая часть, в переписке не сказано.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0239-S02", "SP-0239--ogranicheniya-i-cena"], "h": "<p>Названо одно ограничение, и оно повторяется во всех поздних пересказах:\n«находясь в толпе он теряется и не может сконцетрироваться» (2025-09-17, id 366151;\nповторено 2025-10-20 id 376401 и 2025-11-05 id 382108).</p>\n<p>Отдельно оговорён потолок эффектов — что способность НЕ делает: «Но не каких громовых драконов\nлибо ещё какое фантастическое и связанное с энергией бредятины» (2025-09-17, id 366159).</p>\n<p>Цена применения, расход, откат, время работы — в переписке не названы.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0239-S03", "SP-0239--nositeli"], "h": "<p>Азуриэль. В навигации файла способность отнесена к нему же («Часть чего: Азуриэль»),\nи в списке связей указаны Азуриэль и Апостолы.</p>\n<p>При этом в сводке от 2025-10-20 (id 376401) Азуриэль описан не как одиночный персонаж, а как\nцелая группа: «Это было группа лиц, чей дети мутировали полностью превратившись Азуриэль.\nОни с рождения могут использовать Оам и скорость поглощения и выделения Оам у них выше чем\nу кого либо». Тот же текст повторён 2025-11-05 (id 382108).</p>\n<p>Отдельно от этого, но в том же перечислении мутантов, описаны Апостолы — «люди, у которых в\nутробе матери мутировало нервную систему мозг и глаза», с обострёнными пятью чувствами,\nработоспособностью мозга, реакцией и точностью, и с «белыми глазами», при активации которых\nвремя для них замедляется, а все чувства становятся сверхчувствительными. Прямо сказано, что\nэто отдельный вид мутантов; связан ли их аппарат восприятия с Нейро-сканером Азуриэля\nмеханически — в переписке не сказано.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0239-S04", "SP-0239--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-09-17 (id 366126–366128, окно w0105).</strong>\nСпособность придумана в один заход с самим персонажем. Формулировка: «Эмпатия. Прекрасно\nощущать намерения». Ни ограничений, ни механики на этом шаге нет.</p>\n<p><strong>Версия 2 — 2025-09-17 (id 366148–366151, окно w0105).</strong>\nПолучает имя и переформулируется: «Азуриэль: Нейро-сканер. Его способность это не эзотерическая\nэмпатия, а гиперразвитое чувство, позволяющее напрямую считывать и интерпретировать\nбиоэлектрическую активность нервной системы других существ». Тут же появляется единственная\nслабость — толпа.</p>\n<p><strong>Версия 3 — 2025-09-17 (id 366159–366160, окно w0105).</strong>\nДобавлена электрическая часть: поглощение электричества, усиление физданных и регенерации,\nудар током при касании, стрельба молниями. Сразу же поставлен запрет на «громовых драконов».\nНа это сообщение Миколай отвечает: «это нейронка написала?» (id 366160).</p>\n<p><strong>Версия 4 — 2025-10-20 (id 376399–376403, окно w0107).</strong>\nСпособность попадает в большую сводку по вселенной Оам, где перечислены частицы Оам, механика\nих поглощения и мутанты (Апостолы, Аскизы, Дети мирового древа, Азуриэль, Поротай, Вампиры).\nБлок про Азуриэля воспроизведён дословно — описание внешности, «Эмпатия / Прекрасно ощущать\nнамерения», затем формулировка Нейро-сканера и слабость в толпе. Новое здесь одно: Азуриэль\nподан как группа лиц, чьи дети полностью мутировали, они «с рождения могут использовать Оам\nи скорость поглощения и выделения Оам у них выше чем у кого либо». Сводка заканчивается\nсловами «Пока что так» (id 376403).</p>\n<p><strong>Версия 5 — 2025-11-05 (id 382108, окно w0108).</strong>\nТот же блок повторён без изменений — эмпатия переформулирована в чтение нервной активности\nплюс ограничение по толпе. Новых деталей нет.</p>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S05", "SP-0239-S05", "SP-0239--otklonennye-varianty"], "h": "<ul>\n<li>Эзотерическая эмпатия как трактовка способности. Отвергнута прямо в самой формулировке:\n  «не эзотерическая эмпатия, а гиперразвитое чувство» (2025-09-17, id 366148). При этом сам\n  ранний вариант «Эмпатия. Прекрасно ощущать намерения» из текста не выкинули — он продолжает\n  ходить внутри блока про Азуриэля и в сводках 2025-10-20 и 2025-11-05.</li>\n<li>Крупная энергетическая фантастика на основе электрической части: «Но не каких громовых драконов\n  либо ещё какое фантастическое и связанное с энергией бредятины» (2025-09-17, id 366159).\n  Запрет поставлен тем же автором в том же сообщении, где добавлены молнии.</li>\n</ul>", "r": []}, {"t": "Связь с другими способностями", "a": ["S06", "SP-0239-S06", "SP-0239--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Способность встроена в общую механику Оам: люди поглощают частицы Оам через дыхание и кожу,\nу каждого своя ёмкость, излишек выходит наружу, а контроль над Оам достаётся тем, кто пережил\nпередозировку и сумел её сдержать. Про Азуриэль отдельно сказано, что им этот путь не нужен:\nони «с рождения могут использовать Оам», и скорость поглощения и выделения у них выше, чем\nу кого-либо (2025-10-20, id 376401).</p>\n<p>В том же перечислении рядом стоят другие мутантские наборы способностей — Апостолы (обострённые\nчувства, белые глаза, лучший контроль Оам), Аскизы (нестарение, быстрая регенерация, отсутствие\nболи), Дети мирового древа (неуязвимость, регенерация, сверхсила, движение в земле и деревьях,\nневосприимчивость к огню), Поротай (три исхода поедания жука), Вампиры (кровь как контролируемая\nконечность, пополнение Оам кровью). Прямой механической связи Нейро-сканера с любым из этих\nнаборов в переписке не проведено.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "SP-0239-S07", "SP-0239--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Дальность, разрешение и точность считывания не названы: сказано только, что активность\n  считывается и интерпретируется «напрямую».</li>\n<li>Читает ли Нейро-сканер намерения и эмоции или только сырую нервную активность — не разграничено;\n  ранняя формулировка про намерения и поздняя про биоэлектрику соседствуют в одном блоке, и какая\n  из них отменяет другую, не сказано.</li>\n<li>Судьба электрической части (поглощение электричества, удар током, молнии) осталась нерешённой:\n  в сводках 2025-10-20 и 2025-11-05 она не повторена, но и отменена нигде не была.</li>\n<li>Цена, расход и время работы способности не названы.</li>\n<li>Единственное ограничение — толпа; что именно считается толпой и как носитель с этим справляется,\n  не описано.</li>\n<li>Связь способности с Апостолами (она указана в списке связей) в тексте переписки не раскрыта.</li>\n<li>Отдельно зафиксировано в исходнике: формулировка 366148 написана нейросетью — Слава подтвердил\n  это в 366168, — но авторы её приняли и дальше ей пользуются. Формулировка внутри сообщения\n  376401 тоже выглядит отредактированной сторонним голосом, авторство Слава подтвердил\n  в 376405–376406. Кусок в 382108 подписан «Слава дондоков:» и похож на цитату из другого чата.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0239--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0068.html\">Азуриэль (народ)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0239--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-09-17</td>\n<td>366126–366128</td>\n<td>w0105</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-09-17</td>\n<td>366148–366151</td>\n<td>w0105</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-09-17</td>\n<td>366159–366160</td>\n<td>w0105</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-10-20</td>\n<td>376399–376403</td>\n<td>w0107</td>\n<td>Оам (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-11-05</td>\n<td>382108–382108</td>\n<td>w0108</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0239-neyro-skaner.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0239--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0239.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
