<script>const BASE="";const DOCNAME="касание руки";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0112-S01", "SP-0112--mehanika"], "h": "<p>Касание руки происходит во сне, а отзывается наяву. Способность описана изнутри, от первого лица, в тексте С (2024-08-27, id 225501) — в одном сообщении, заканчивающемся на «Продолжение следует».</p>\n<p>Само касание рассказчик описывает так: «снова почувствовал косания которая заставила дребезжать каждую клетку моего тела». Реакция — паника и попытка вырваться: «Я как безумец начал пытаться выбраться и да сука я выбрался. Выбрался невероятным чудом как то раскрутился как гимнаст и вытянул руку».</p>\n<p>Сон, в котором это происходит, рассказчик отделяет от обычного сна: он перечисляет два происшествия — «1 потеря памяти 2 сон который не сон». Содержание сна одно и то же от раза к разу: «снова кошмар снова бег и снова пока лёгким и всей дыхательной системе» — всю ночь он бегает от руки.</p>\n<p>Работает механика по нарастающему графику. Интервалы между кошмарами сокращаются: «Надеюсь вы заметили, что интервалы начали глобально уменьшаться, и как вы наверное догадались это начала происходить каждую убнутую ночь». Догнать рассказчика рука смогла не сразу: на 15-й день «это сука не смогла меня коснуться», захват состоялся только на 23-й.</p>\n<p>Пропуск сна как защита не работает: рассказчик пробовал не спать, но «на долго меня не хватило до 04:47 ели как смог продержаться. А дали сам не понял как вырубился».</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0112-S02", "SP-0112--ogranicheniya-i-cena"], "h": "<p>Последствия наяву:</p>\n<ul>\n<li>Рука, за которую схватили, болит после пробуждения: «Болела так словно я крапиву взял и полностью её руку обвязал и каждый 10 минут менял на новую».</li>\n<li>Потеря веса: «к 23 дню я сбросил 7 кг сука 7 кг я чутли не стал как скелет».</li>\n<li>«И также нервозность, раздражительность, вялый вид».</li>\n<li>Ощущение гниения во рту, которое рассказчик сам отменяет: «мне показалось что во рту у меня начало что-то гнить, но это лишь мне показалось».</li>\n<li>Непроизвольное мочеиспускание во сне: на 15-й день «я проснулся обоссаный», в предыдущий раз этого не было только потому, что он мало пил ночью.</li>\n<li>Страх, возвращающийся заново после каждого раза: «Снова новыми красками ударил по мозгу».</li>\n</ul>\n<p>Прямых ограничений для самой руки в тексте не названо, кроме одного эпизода, где касание не удалось (15-й день, без объяснения причины).</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0112-S03", "SP-0112--nositeli"], "h": "<p>Носитель — рука из кошмара. Рассказчик не определяет её род: «он ну она или оно схватила меня за руку». Собственную догадку о происхождении он строит на женской фигуре из более раннего эпизода: «Ну типа та красотка оказалась ведьмой ну или суккубом как кому» — при этом сам он предупреждает, что вывод сделан быстро: «Я как бы не мало мистический херни прочел, чтобы сразу подумать на ведьму».</p>\n<p>Испытывает действие способности рассказчик истории Славы.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0112-S04", "SP-0112--kak-menyalas-po-versiyam"], "h": "<p>Версия одна — 2024-08-27, окно w0055, сообщение id 225501. Более ранних или поздних состояний в переписке нет.</p>\n<p>Хронология внутри самого текста (счёт по дням от событий, предшествующих отрывку):</p>\n<ul>\n<li>10-й день — пробуждение утром после первого случая, попытка «забить». В этот же день поиск колдунов в интернете, результат нулевой: «Точнее нашел и очень много чего нашел но все это была либо явная кидавола, либо кидаволо но менее явная».</li>\n<li>Ночь после 10-го дня — попытка не спать до 04:47, затем провал в сон. Пробуждение около 11:30 без кошмара. Отсюда надежда: «а может быть это одноразовая херня и все больше она не как не сможет повторить подобного без прямого контакта со мной».</li>\n<li>11-й день (второй день поисков) — снова поиск «экспертов черной магии», снова ничего.</li>\n<li>12, 13, 14, 16-й дни — без кошмара.</li>\n<li>15-й день — кошмар есть, но касания нет: «С одним исключением это сука не смогла меня коснуться».</li>\n<li>17-й день — следующий кошмар, после чего они идут каждую ночь.</li>\n<li>23-й день — захват за руку. «Это сука теперь мой не любимой число».</li>\n<li>После 23-го дня — прогулка, на которой к рассказчику обращается человек, объясняющий причину происходящего. Его объяснение в отрывок не вошло.</li>\n</ul>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0112-S05", "SP-0112--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Связь названа с рукой из кошмара — способность является её частью, отдельно от носителя не существует. Также связана с фигурой рассказчика истории Славы как единственного, на ком она показана.</p>\n<p>Отдельной линией через текст проходит потеря памяти («1 потеря памяти»), названная рядом с «сном который не сон» как второе происшествие, но в этом отрывке не раскрытая.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "SP-0112-S06", "SP-0112--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Кто такая «та красотка» и был ли с ней «прямой контакт», давший начало кошмарам — в этом отрывке не сказано, догадка про ведьму или суккуба остаётся догадкой рассказчика.</li>\n<li>Почему на 15-й день касание не удалось — не объяснено.</li>\n<li>Почему интервалы сокращаются и почему захват пришёлся именно на 23-й день — не объяснено.</li>\n<li>Что происходит после захвата, если не вырваться — неизвестно, рассказчик вырвался.</li>\n<li>Природа потери памяти и её связь с касанием не раскрыты.</li>\n<li>Объяснение причины, которое даёт встреченный человек, отсутствует: текст обрывается на «Но он поведал мне о причине моих несчастье и вот что он рассказал. Продолжение следует». Продолжения в переписке нет.</li>\n<li>Сам встреченный описан подробно (длинные волосы, двухнедельная щетина, мешковатая одежда, запах, мутные и тяжёлые глаза, «груда мощных мышц», гигантская рука, рост «как минимум 185 см», сравнение с медведем, «который одно лапой может меня прям здесь укокошить»), но не назван и в другие записи не заведён.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0112--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0112--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-27</td>\n<td>225501–225501</td>\n<td>w0055</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0112-kasanie-ruki.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0112--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0112.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
