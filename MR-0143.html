<script>const BASE="";const DOCNAME="Гигахрущевка";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0143-S01", "MR-0143--ustroystvo"], "h": "<p>Гигахрущевка — мир, устроенный как бесконечный дом. Слава излагает его так: «Гигахрущевка это бесконечный( по ка не менее в рассказах не кто так и не дошёл до самого низа или самого верха) этажи. В которых находится комнаты» (2025-08-07, id 353598).</p>\n<p>Из этого описания складываются четыре признака:</p>\n<ul>\n<li>Мир состоит из этажей, на этажах — комнаты.</li>\n<li>Бесконечность заявлена с оговоркой: она не доказана, а лишь не опровергнута — «по ка не менее в рассказах не кто так и не дошёл до самого низа или самого верха». То есть верх и низ существуют как вопрос, а не как известная граница.</li>\n<li>Внешней природы нет: «Там нет неба или земли и травы».</li>\n<li>Жизнеобеспечение работает, но источник его неизвестен изнутри: «Не кому из гигахрущевки неизвестно откуда берётся вода и электричество, а также куда попадают отходы» (id 353598).</li>\n</ul>\n<p>Последний пункт задаёт устройство мира как закрытой системы с невидимым входом и невидимым выходом: вода и электричество приходят ниоткуда, отходы уходят в никуда, и обитатели не знают ни того, ни другого.</p>\n<p>Реакция Миколая на пересказ — «оо», «интересно» (id 353599–353600), затем «вдохновляет» (id 353607).</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0143-S02", "MR-0143--naselenie"], "h": "<p>Прямого описания жителей в переписке нет. Население упоминается только косвенно, через формулировку «Не кому из гигахрущевки неизвестно...» — то есть в мире есть кто-то, кто мог бы знать и не знает. Ни численность, ни быт, ни организация не названы.</p>\n<p>Отдельно к миру привязано явление Самосбор (<a href=\"MR-0144.html\">Самосбор</a>), губительное для человека, — см. соответствующую статью.</p>", "r": [["Самосбор", "MR-0144.html"]]}, {"t": "Место во вселенной", "a": ["S03", "MR-0143-S03", "MR-0143--mesto-vo-vselennoy"], "h": "<p>Гигахрущевка — не авторский мир Миколая и Славы, а вселенная из книг, которые Слава скачал и прочитал до поездки: «Про эту вселенную 4 книги прочёл» (id 353593). В справочнике она зафиксирована как внешний источник, на который Миколай отреагировал словом «вдохновляет» (id 353607).</p>\n<p>Название вселенной на момент разговора не устоялось. Слава называет её двумя именами и признаёт, что не знает точного: «Вселенная гигохрущевка» / «Ну или самосбор» / «Не знаю как она называется» (id 353586–353590). Таким образом «Самосбор» выступает и как альтернативное название всей вселенной, и как название явления внутри неё (<a href=\"MR-0144.html\">Самосбор</a>).</p>\n<p>Оценка источника со стороны Славы: «Хотя некоторые рассказы из книги тупорылые» (id 353611) и одновременно «мне понравилось вселенная и живые персонажи ( живее моих раз в сто)» (id 353612).</p>", "r": [["Самосбор", "MR-0144.html"]]}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0143-S04", "MR-0143--kak-menyalsya-po-versiyam"], "h": "<p>Версия 1 — 2025-08-07 (окно w0102, id 353580–353620). Единственное состояние. Мир изложен целиком в одном сообщении (id 353598), явление Самосбор — в следующем блоке (id 353608). Позже описание не менялось и не дополнялось.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0143-S05", "MR-0143--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Откуда берутся вода и электричество и куда уходят отходы — не сказано; это часть самого устройства мира, а не пробел переписки.</li>\n<li>Есть ли у мира верх и низ — осталось нерешённым: в рассказах до них никто не дошёл.</li>\n<li>Население не описано: ни кто живёт, ни сколько, ни как устроен быт.</li>\n<li>Не сказано, как именно Гигахрущевка повлияла на собственные вещи авторов и повлияла ли. Дальше слова «вдохновляет» разговор не пошёл.</li>\n<li>Точное название вселенной в переписке не установлено — Слава прямо говорит «Не знаю как она называется».</li>\n<li>Ни одна из четырёх книг не названа, авторы книг не названы.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0143--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0144.html\">Самосбор</a></li>\n<li><strong>Упомянут в мирах:</strong> <a href=\"MR-0144.html\">Самосбор</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0004.html\">Гигахрущевка</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0143--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-08-07</td>\n<td>353580–353620</td>\n<td>w0102</td>\n<td>Гигахрущевка (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0143-gigahruschevka.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0143--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0143.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
