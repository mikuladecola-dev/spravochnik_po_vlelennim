<script>const BASE="";const DOCNAME="Комикс Славы";
const LEAD="";
const CH=[{"t": "Содержание", "a": ["S01", "IS-0009-S01", "IS-0009--soderzhanie"], "h": "<p>Проект Славы, который в переписке проходит под названиями «мой комикс» и «недо комикс». Обсуждается в окне w0023 с 18 по 30 января 2024 года (id 92435–101936). Это не пересказанный сюжет, а проект-контейнер: в переписке фиксируются не события истории, а её объём, состав персонажей, требования к подаче и то, ради чего Слава учится рисовать.</p>\n<p>Первое упоминание — как цель обучения рисованию (2024-01-18, id 92435–92436). Слава: «Хочу рисовать людей для своего недо комикса», с уточнением «Детализовоно». Порядок освоения назван сразу: сначала люди, потом объекты — «Плюсом потом объект научусь но сними наверное легче будет».</p>\n<p>Формат комикса обсуждается на следующий день (2024-01-19, id 93133–93166). Миколай ставит вопрос: «Формат у комиксов разный бывает», «К чему стремишься», «Какие идеи». Слава на вопрос о формате отвечает встречным «А какие вообще формат ?»; Миколай в форматах не разбирается — «Я не шарю», «Но знаю что разные бывают». Цель Славы сформулирована так: «К эпическими и гибкими телами».</p>\n<p>Дальше Миколай излагает требование к подаче: «Должен быть стандарт», «Стандарт линии и стиля», «На всех рисунках». При этом единый стандарт не означает единой детализации: «Персонажа можно в обычных моментах упрощать», с отсылкой к «Ванпанчмену» — «Там типо 2 стиля, но персонаж и там м там читается и там и там он не выбивается из идеи». Отсюда следует требование к автору: «ты должен знать подробности своего персонажа чтобы уметь его передать во всех стилях и он узнавался».</p>\n<p>Слава сводит это к трём степеням: «Типо упрощённый , нормальный, и мега эпический». Миколай подтверждает — «Да».</p>\n<p>Рабочий метод, который Миколай рекомендует тут же: «Настоятельно рекомендую провести небольшое исследование стилей и идей того как автор рисует мангу которую ты читаешь», «Прям следить не только за сюжетом но и анализировать рисовку и идеи того как автор рисует». Слава отвечает, что ему «бы сначала тела научится рисовать»; Миколай на это: «Без понимания все равно не сможешь», «Надо теорию практику почитать», «Сочетать».</p>", "r": []}, {"t": "Персонажи", "a": ["S02", "IS-0009-S02", "IS-0009--personazhi"], "h": "<p>Число главных персонажей — шесть. Названо 2024-01-30 (id 101911–101936), поводом послужил вопрос Славы: «6 персонажей не многовато ли». Миколай уточняет — «Все главные?».</p>\n<p>Ни один из шести по имени в переписке не назван. В блоке связей истории указаны «Мир с поглощением энергии» и «Новый гг»; как «Новый гг» соотносится с шестёркой главных персонажей — в переписке не сказано.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "IS-0009-S03", "IS-0009--mesto-vo-vselennoy"], "h": "<p>Вселенная в самой переписке не названа. Отнесение к «Падениям небес» проставлено по дате объявления. Один ли это проект с миром поглощения энергии или разные — не решено (помечено как неясность окна w0023).</p>\n<p>Мир истории, по состоянию на 2024-01-30, продуман. Обмен на этом месте краткий: Миколай спрашивает «Кстати», «Как мир», Слава отвечает «Ну вот», Миколай — «Продумал». Устройство мира в этих сообщениях не раскрыто.</p>\n<p>Отдельно в разговоре 2024-01-30 всплывает возможность переноса части персонажей в другую вселенную, но как отклонённый вариант (см. ниже).</p>", "r": []}, {"t": "Состояние", "a": ["S04", "IS-0009-S04", "IS-0009--sostoyanie"], "h": "<p>Проект на стадии подготовки: на всём протяжении окна речь идёт об обучении рисованию и о требованиях к будущим рисункам, не о готовых страницах. Ни одна глава в переписке не упоминается как нарисованная.</p>\n<p>Состояния по датам:</p>\n<ul>\n<li><strong>2024-01-18 (id 92435–92436).</strong> Проект назван «недо комиксом». Заявлена цель: научиться рисовать людей детализированно, потом объекты.</li>\n<li><strong>2024-01-19 (id 93133–93166).</strong> Заданы требования к подаче: единый стандарт линии и стиля на всех рисунках; допустимое упрощение персонажа в обычных моментах; три степени — упрощённый, нормальный, мега эпический; узнаваемость персонажа в каждой из них. Цель Славы — «эпичность» и «гибкие тела».</li>\n<li><strong>2024-01-30 (id 101911–101936).</strong> Установлено, что главных персонажей шесть и это нормально; мир продуман. Миколай говорит «Нарисую» (id 101930) — что именно и для кого, в переписке не уточняется.</li>\n</ul>\n<h3>Отклонённый вариант</h3>\n<p>2024-01-30, id 101918–101929. Миколай сначала оценивает шестерых так: «Ну вообще для самой концепции норм», «Но думаю не потянешь», — и предлагает «Надо трех слить», «В первой главе», «Или вообще в другую вселенную потом вставить». Предложение снимается, как только выясняется, что речь о комиксе Славы, а не об общем проекте: «А я то думал», «Ты про свою историю», «Ок», «6 норм». То есть слияние троих и перенос в другую вселенную относились к другому объекту обсуждения и к комиксу Славы в итоге не применены.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "IS-0009-S05", "IS-0009--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вселенная в переписке не названа; отнесение к «Падениям небес» — по дате объявления.</li>\n<li>Неясно, один ли это проект с миром поглощения энергии или разные (помечено как неясность окна w0023).</li>\n<li>Сюжет истории не изложен: ни завязки, ни событий, ни жанра.</li>\n<li>Имена шести главных персонажей не названы, роли не расписаны.</li>\n<li>Устройство продуманного мира не раскрыто — сказано только, что он продуман.</li>\n<li>Формат комикса так и не выбран: вопрос «Формат у комиксов разный бывает» остался без ответа, Миколай в форматах не разбирается, Слава спрашивает встречно.</li>\n<li>Что означает «Нарисую» (id 101930) — не уточнено.</li>\n<li>После 2024-01-30 в этом окне проект не упоминается; чем кончилось — в переписке не сказано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["IS-0009--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0095.html\">Организация, ковавшая героев (из истории нового гг)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0009.html\">Падения небес</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["IS-0009--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-01-18</td>\n<td>92435–92436</td>\n<td>w0023</td>\n<td>Падения небес (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-01-19</td>\n<td>93133–93166</td>\n<td>w0023</td>\n<td>Падения небес (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-01-30</td>\n<td>101911–101936</td>\n<td>w0023</td>\n<td>Падения небес (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/istorii/IS-0009-komiks-slavy.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["IS-0009--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/IS-0009.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
