<script>const BASE="";const DOCNAME="Терор Мачилович";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0044-S01", "PS-0044--proishozhdenie"], "h": "<p>Персонаж вселенной «игра бога». Появляется одним сообщением Миколая (2024-04-02, id 153332) готовой карточкой: имя, роль, возраст, способность. Предыстории, повода для создания и обсуждения перед карточкой в переписке нет.</p>\n<p>Карточка идёт второй из трёх подряд (id 153331–153333, окно w0029): <a href=\"PS-0043.html\">Нат Магнов</a> (Нат Магнов), <a href=\"PS-0044.html\">Терор Мачилович</a> (Терор Мачилович), <a href=\"PS-0045.html\">Каваи Навалов</a> (Каваи Навалов). Все три записаны одним автором в одну минуту по одному шаблону — имя, характеристика с возрастом, строка «Способность:».</p>\n<p>Возраст — 30 лет, самый старший из трёх карточек этой серии.</p>", "r": [["Нат Магнов", "PS-0043.html"], ["Каваи Навалов", "PS-0045.html"]]}, {"t": "Характер", "a": ["S02", "PS-0044-S02", "PS-0044--harakter"], "h": "<p>Описан строкой: «Спокойный и уравновешенный стратег, казначей, 30 лет».</p>\n<p>При нём закреплены две функции сразу — стратег и казначей. Чьи деньги он ведёт и чью стратегию строит, в переписке не сказано. Других черт характера не названо.</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0044-S03", "PS-0044--sposobnosti"], "h": "<p>«Способность: для самого себя делать людей или предметы не существующими».</p>\n<p>Ключевое в формулировке — «для самого себя»: несуществующими они становятся именно для него, а не вообще. Как это отражается на самом объекте и замечает ли он что-нибудь, в переписке не разобрано. Не названо: обратима ли способность, сколько объектов можно вычеркнуть разом, есть ли цена, работает ли она на расстоянии, можно ли так избавиться от удара или атаки. Разница между «людьми» и «предметами» в применении не проговорена — перечислены через «или», без пояснения.</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0044-S04", "PS-0044--svyazi-s-drugimi"], "h": "<p>Обозначен как казначей — должность внутри некоторой группы, но группа и её состав в его карточке не названы. В соседней карточке <a href=\"PS-0043.html\">Нат Магнов</a> (Нат Магнов) есть «лидер группы», однако прямо в переписке эти двое в одну группу не сведены; связь не проговорена.</p>\n<p>Из зафиксированного — принадлежность к вселенной «игра бога».</p>", "r": [["Нат Магнов", "PS-0043.html"]]}, {"t": "Как менялся — состояния по датам", "a": ["S05", "PS-0044-S05", "PS-0044--kak-menyalsya"], "h": "<p><strong>2024-04-02 (id 153332, окно w0029)</strong> — единственная версия. Полная карточка: спокойный и уравновешенный стратег, казначей, 30 лет, способность — для самого себя делать людей или предметы несуществующими.</p>\n<p>Правок и повторных упоминаний в переписке нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0044-S06", "PS-0044--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Внешность не описана вообще.</li>\n<li>Происхождение и биография — в переписке не сказано.</li>\n<li>Не сказано, при какой группе он казначей и стратег.</li>\n<li>Механика способности не разобрана: обратимость, цена, ограничения, дальность, что происходит с «вычеркнутым» объектом с его собственной стороны.</li>\n<li>Дальнейшая судьба персонажа не прописана: появляется один раз и больше не возникает.</li>\n<li>Связь с соседними карточками <a href=\"PS-0043.html\">Нат Магнов</a> и <a href=\"PS-0045.html\">Каваи Навалов</a> прямо не заявлена, осталась нерешённой.</li>\n</ul></div>", "r": [["Нат Магнов", "PS-0043.html"], ["Каваи Навалов", "PS-0045.html"]]}, {"t": "Связи — всё вместе", "a": ["PS-0044--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0049.html\">Команда Миколая (10 персонажей игры бога)</a></li>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0043.html\">Нат Магнов</a>, <a href=\"PS-0045.html\">Каваи Навалов</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0043.html\">Нат Магнов</a>, <a href=\"PS-0045.html\">Каваи Навалов</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0049.html\">Команда Миколая (10 персонажей игры бога)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0014.html\">игра бога</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0044--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-04-02</td>\n<td>153332–153332</td>\n<td>w0029</td>\n<td>игра бога (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0044-teror-machilovich.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0044--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0044.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
