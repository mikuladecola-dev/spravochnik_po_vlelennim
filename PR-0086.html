<script>const BASE="";const DOCNAME="Бетонный герой";
const LEAD="";
const CH=[{"t": "Об этом тексте", "a": ["S01", "PR-0086-S01", "PR-0086--ob-etom-tekste"], "h": "<ul>\n<li>Дата: 2025-08-08</li>\n<li>Сообщения: 354014–354015</li>\n<li>Состояние: брошено на середине — автор сразу после текста написал, что это набросок и он его не продолжит</li>\n<li>Действующие лица: Свят (Святослав), рыжеволосый мальчишка (безымянный), торговец, старшики</li>\n</ul>", "r": []}, {"t": "Текст", "a": ["S02", "PR-0086-S02", "PR-0086--tekst"], "h": "<p>Бетонный герой <br>Много лет назад людям пришлось покинуть землю. Причины неизвестные или их скрывают. Боясь, что люди, что народ узнав ту правду. Больше не будут их восхвалять, как спаситель. Как героев, что однажды спасли множество жизни. Если подумать, то раньше эти герои и правда выглядели мужественно и устрашали своим видом все проблемы. Но сейчас спустя так много времени. Так много поколений. Герои стали большее похожие на жирных свиней, что раздают всем указания. Со своими любимыми фразами &quot; Работа найдётся для всех&quot; Вот только там не говориться о зарплате. Да и в частности работа для неумехи  - это стать пушечным мясом, который самовозглашают себя защитниками. Хотя защищают они лишь толстый задницы героев.</p>\n<p>Глава 1<br>-говорят небо красивое- сказал худощавый мальчишка. Глаза его были красиво синими. Хотя цвет волос был мусорная коричневый. <br>-и кто же тебе на уши присел ?- скучающий ответил рыжеволосый мальчишка. Ему было без разница на небо и землю. На красоту о которой говорит его друг. Его интересовал лишь бурлящий желудок, что требовал его покормить. Желудок скручивался, давил выжимал кислоты и продолжил переваривать самого себя. И мальчишка правда хотел его накормить. Но не мог. <br>-старрршшшики- неуверенно протянул голубоглазый мальчишка. Хоть голос был и не уверен. Но в глазах мальчишки, что пытались найти там в сером, от туч и дыми синеву, что и у себя. Заводы, что были на каждом шаге. От которых не убежать. Они дымили своими горячими парами отравляли и так убитую планету. Но без них, человечество не смог бы, здесь жить. Как и без технологии, что производят кислород. <br>-ну дурак и ты серьезно им поверил. Они даже не родились на земли, откуда им знать, как было раньше- вспылил рыжеволосый мальчишка. В душе понимая, что гнев был вызван не глупостью или наивностью его друга, а тем что желудок больно кольнул и что эмоции и боль и эту кислоту, что разжижает его желудок. Он хотел выплюнуть хоть на кого-то. <br>-они говорили небо было синим, а рядом с ним летали белые, как ангелы облака- продолжал мальчишка глядя в серую плывущий комок. Он стал на цыпочки. Опираясь на ржавый перилла. Голова его вытянулась вперёд, вперёд. Словно он заметил там ту синеву, что так безбожно спрятали комки. Но на деле он лишь пытался их найти. Но как будто бы вот-вот и он их увидит. Он всё тянулся ещё чуть-чуть и он увидит, он точно всё увидит. <br>Рыжеволосый мальчуган смотревший всё это время просто в стену. Оглянулся на своего замолчавшего друга. Его сердце забилось сильнее. Готовя тело действовать. Друг, синеглазый друг. Переваривалися через перила и готов был упасть. Разбиться о бетонной пол, что был везде. <br>Рыжеволосый сделал скачок к другу. Но тела не было готовой, к такой нагрузке. Плохо удерживало своего хозяина в равновесии. А желудок решивший, что именно сейчас настал его момент. Брызнул кислотой. Вызвав рвотный позыв. Но рыжеволосый этого не заметил. Ни того не другого. Он просто бежал. И обняв за талию своего единственного друга. Он держал его над пропастью. А тот всё продолжал тянуться к небу. <br>Напрягшись рыжеволосый со всех своих последних сил тянул друг на себя. Он смог перекинул тушу своего друга и они оба лежали на холодном полу смотря всё также в серое неба. <br>-Свят... Тебе.. Что-то старшики дали? - спросил задыхающийся рыжеволосый глядя на Святослава.Святославом его конечно же не кто не звал. Просто Свят и все, что нужно для брошенного ребёнка. <br>-да они, как будто дадут хоть, что-то - надув щеки сказал Свят. <br>-тогда че это было. На кой ты за перила полез!!! - взорвался рыжик. <br>-ну... Небо же... Там- неуверенно процедил Свят. <br>-какой нахрен небо. Мы с тобой не на Земле. Так что забудь уже. Лучше пошли поесть найдём, а то помираю- выпалил рыжеволосый вставая и протягивая руку для помощи в подъёме Святу. <br>Они пошли искать еду. </p>\n<p>Крики, ворчание, ругань. Всё это смешалось в одну фразу.</p>\n<p>-ЛОВИТе ВОРА! - кричал жилистый мужчина. Тыкая пальцам в толпу. И долго не думая побежал в эту толпу. Расталкивая своим жирным задом прохожих. Он неся словно кабан за двумя тенями , что стащили с его прилавка всего-лишь хлеб. Кусочек даже. Но ему было без разницы ведь даже кусок хлебы баль его. Лишь его и не кто не смейте даже смотреть на его вещи. Он догонял двух истощённых мальчишек. Улице все сужалось, не давая мальчишкам спрятаться в толпе. И вот остались лишь мусорки, да красы.и также кричавший торговец. Заревел подобно свиней он ускорился и вытянув жирную руку вперёд хотел схватить за шиворот рыжеволосого пацана. Но его кто-то опередил. Неизвестная мозолистая рука схватила мальца. А жирдяй попытавшийся затормозить упал и купером покатился по бетонному полу.</p>", "r": []}, {"t": "Примечания и поправки", "a": ["PR-0086--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PR-0086.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PR-0086-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PR-0086/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дорогая дыра — не внутри текста, а под ним: реестры вселенной, к которой он приписан. <code>SL-0053</code> «Список персонажей вселенной» — 6 ссылок, 20 313 знаков базы, статьи нет; <code>SL-0051</code> «Каталог: благословенные, враги, грехи, оружие, артефакты» — 6 ссылок, 9 834, статьи нет; <code>SL-0090</code> «Реестр персонажей и сил» — 4 ссылки, 5 492, статьи нет; <code>SL-0089</code> «Список категорий сил» — 4 ссылки, 1 753, статьи нет. На них ссылаются чаще, чем на любую другую сущность без статьи. Для этого наброска они решают конкретное: в мире есть правящее сословие «героев», наследников тех, кто «однажды спасли множество жизни», а в реестрах «Апостола» есть разделы «Благословенные», «Церковь», «Военный». Одно это или разное — не проверить, сверять не с чем.</p>\n<p>Второе — обладатель «неизвестной мозолистой руки», на котором текст обрывается. Отдельной записи в базе под него нет вообще: он существует строкой внутри <code>IS-0066</code> и <code>MR-0142</code>, и это единственный персонаж наброска, у которого есть сюжетная функция и нет ни статьи, ни исходной записи. То же положение у «старшиков» и торговца.</p>\n<p>Третье — <code>MR-0148</code> «Новая вселенная (безымянная, переработка Апостола)»: 2025-09-12, окно w0104, 3 373 знака, статьи нет.</p>\n<h3>С чего начать</h3>\n<p>Всё в базе.</p>\n<ul>\n<li>Окно w0102, id 354014–354032 — сам набросок, авторская пометка «Это набросок, который я не продолжу», вопрос «Просто скажи я лучше начал писать?» и обещание «скоро на эту тему будет другой набросок а может и полноценная история». Проверять надо именно обещание: чем оно оказалось — сентябрьским текстом под тем же названием или чем-то ещё. Прямо это нигде не отождествлено, а от ответа зависит, один ли это замысел или два.</li>\n<li><code>SL-0051</code> — окно w0072, <code>SL-0053</code> — окна w0073, w0077, w0079. Состав «Апостола» на январь-март 2025 года, то есть на момент до написания.</li>\n<li><code>MR-0148</code>, окно w0104 — переработка вселенной месяцем позже; там же должно решаться, куда относить оба «Бетонных героя».</li>\n</ul>\n<h3>Как развивалось</h3>\n<p>2025-08-08 — заявили мир и в тот же день сами его ограничили: «набросок, который я не продолжу». Тогда же пообещали вернуться «на эту тему». 2025-09-04 — 09-08 вернулись под тем же названием, но с другим миром, другим героем и другой оптикой: вместо серого неба над заводами — бетонный потолок вместо неба, вместо двух беспризорников — один взрослый. Соответствие между ними за оба окна ни разу не проговорено ни одной стороной; обсуждение в обоих случаях свелось к стилю.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Про «героев» правило названо прямо: спасители через поколения превратились в тех, кто раздаёт указания, и правду об уходе с Земли скрывают именно они — у инстанции, хранящей память, есть корысть. Для «старшиков», второй инстанции памяти, того же разбора нет. Про них сказано только, что они сами на Земле не родились, — то есть они могут ошибаться, но вопрос, зачем им рассказывать детям про синее небо, не задан. Одну память проверили на интерес, соседнюю — нет.</p>\n<h3>Отклик</h3>\n<p>Лучшее здесь — желудок как отдельное действующее лицо. Он не «болел»: он «скручивался, давил выжимал кислоты и продолжил переваривать самого себя», а потом «решивший, что именно сейчас настал его момент. Брызнул кислотой». И то, что рыжий понимает, что злится не на глупость друга, а на боль, и хочет «выплюнуть хоть на кого-то» — точная вещь, редко проговариваемая. Особенно хорошо, что спасение происходит на фоне рвотного позыва, которого спасающий даже не замечает: героический жест физически противный, и в этом честность. Ну и сама расстановка у перил: один тянется к небу и почти падает, держит его тот, кому небо безразлично и кто закрывает разговор фразой «Мы с тобой не на Земле». Обрыв на чужой мозолистой руке при этом воспринимается почти как приём, хотя и не был им.</p></div>", "r": []}];</script>
