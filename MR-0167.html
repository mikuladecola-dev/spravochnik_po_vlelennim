<script>const BASE="";const DOCNAME="Амофцы";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0167-S01", "MR-0167--ustroystvo"], "h": "<p>Общее название для существ, способных пользоваться Оам. Вопрос поставлен прямо: «Как вообще называть существ что могут пользоваться Оам?» (2025-11-05, id 382100).</p>\n<p>На момент окончания разговора написание не закреплено. Принятая форма — та, которую предложил Миколай: «амофцы», причём с расхождением письма и чтения: «а писать амовцы», «а так читать» (2025-11-05, id 382213–382214). Итог разговора — «Ну давай пока это» (id 382222), то есть решение помечено как временное.</p>\n<p>Основание для слова — сам Оам. Единственное содержательное уточнение о природе Оам, прозвучавшее в этом разговоре: «Это мелкий крупицы летающий в воздухе» (id 382109).</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0167-S02", "MR-0167--naselenie"], "h": "<p>Под название подпадают существа, способные пользоваться Оам. В ходе разговора Слава повторно выложил в чат перечень мутантов (id 382108) — текст дословно совпадает с описанием из <a href=\"MR-0165.html\">Мир Оам</a> и охватывает апостолов, Аскизов, детей мирового древа, Азуриэль, Поротая и вампиров, включая и фрагмент про белые глаза апостолов, начиная с «Из-за и боль они ощущают больнее». Отдельного отбора — кто именно считается амофцем, а кто нет — в переписке не проведено.</p>", "r": [["Мир Оам", "MR-0165.html"]]}, {"t": "Место во вселенной", "a": ["S03", "MR-0167-S03", "MR-0167--mesto-vo-vselennoy"], "h": "<p>Часть вселенной Оам; термин относится к миру <a href=\"MR-0165.html\">Мир Оам</a> и к населяющим его расам, описанным там же.</p>", "r": [["Мир Оам", "MR-0165.html"]]}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0167-S04", "MR-0167--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-11-05 (id 382099–382110).</strong> Слава ставит вопрос об общем названии (id 382100) и сразу предлагает свой вариант: «Оамовцы» (id 382101).</p>\n<p>Миколай предлагает «мб туманности?» (id 382103). Слава возражает: «Почему?», «Они же не как не связаны с туманнам» (id 382104–382105). Миколай объясняет: «ну оам это че, я чет помню он как туман распространялся», «не?» (id 382106–382107). Слава в ответ выкладывает перечень мутантов и уточняет про Оам: «Это мелкий крупицы летающий в воздухе» (id 382108–382109). Миколай: «ладно пока так будем звать» (id 382110) — то есть на этом этапе остаются на «оамовцах».</p>\n<p><strong>Версия 2 — 2025-11-05 (id 382117–382222).</strong> Через час Слава выкладывает три новых варианта подряд: «Амов», «Амифцы», «Амифиц» (id 382117–382119).</p>\n<p>После паузы примерно в шесть с половиной часов Миколай выбирает: «амофцы», «мне это больше нравится», «а писать амовцы», «а так читать» (id 382211–382214). Слава реагирует: «Ну звучит как какой-то спецназ» (id 382215). Миколай: «хмм», «ок» (id 382216–382217).</p>\n<p>Дальше Миколай предлагает ещё три варианта — «суспензы? нуары? тросы?», «не?» (id 382218–382219). Слава отвечает: «Не» (id 382220). Миколай: «если че и это норм врд» (id 382221). Слава закрывает разговор: «Ну давай пока это» (id 382222).</p>\n<p><strong>Отклонённые варианты.</strong> «Туманности» (Миколай, id 382103) — отклонено Славой: с туманом эти существа никак не связаны. «Суспензы», «нуары», «тросы» (Миколай, id 382218) — отклонены Славой одним словом «Не». Варианты «Амов», «Амифцы», «Амифиц» (Слава, id 382117–382119) не выбраны, но и не отвергнуты явно — Миколай вместо них предложил «амофцы».</p>\n<p>Вариант «Оамовцы», принятый на первом этапе («ладно пока так будем звать»), не отменён прямо: он вытеснен более поздним «амофцы», но обе договорённости в переписке помечены как временные.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0167-S05", "MR-0167--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Финальное написание так и не зафиксировано: разговор заканчивается на «Ну давай пока это».</li>\n<li>Расхождение «писать амовцы, читать амофцы» дальше не подтверждено и не отменено.</li>\n<li>Не определено, распространяется ли название на всех существ, способных пользоваться Оам, включая обычных людей, прошедших обуздание Оам, и животных, — граница термина не проведена.</li>\n<li>Возражение Славы «звучит как какой-то спецназ» осталось без разрешения: Миколай ответил «хмм», «ок», но заменять слово не стали.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0167--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0165.html\">Мир Оам</a></li>\n<li><strong>Упомянут в мирах:</strong> <a href=\"MR-0165.html\">Мир Оам</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0072.html\">Амофцы</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0008.html\">Оам</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0167--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-11-05</td>\n<td>382099–382110</td>\n<td>w0108</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-11-05</td>\n<td>382117–382222</td>\n<td>w0108</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0167-amofcy.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0167--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0167.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
