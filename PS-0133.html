<script>const BASE="";const DOCNAME="Чёрт с ножиком";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0133-S01", "PS-0133--proishozhdenie"], "h": "<p>Введён Миколаем 2024-08-09 (id 216956–216960, окно w0050) словами «короче», «такая идея» — сразу целиком, вместе с наброском сцены. В дальнейшем обсуждении Миколай называет это только идеей и наброском.</p>\n<p>Отдельного имени у монстра нет. В переписке он назван «этот монстр», «его монстр» и описан как «чёрт с ножиком».</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0133-S02", "PS-0133--vneshnost"], "h": "<p>«ну а так это не видимый для обычных людей небольшой чёрт с ножиком, который легко и быстро перемещается».</p>\n<p>В сцене отдельно описано, как он закатывает глаза: «те 360 градусов по вертикали».</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0133-S03", "PS-0133--harakter"], "h": "<p>В наброске сцены он реагирует на перемены решения человека: «Он капец закатывает глаза и те 360 градусов по вертикали проехали ему очень не нравится такая смена идей, злой и раздражённый убивает объект мыслей того парня».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0133-S04", "PS-0133--sposobnosti"], "h": "<p>Монстр приходит к тому, кто взялся хранить чужой секрет. Формулировка Миколая:</p>\n<p>«был разговор и вот человек говорит мол секрет расскажет, а с этим секретом к тому кто выбрал держать секрет приходит и этот монстр, пока тот хранит секрет тот монстр хранит и его, хотя и изредка даже выполняет просьбы парня, думая что он его видит и с ним общается».</p>\n<p>То есть: пока человек хранит секрет, монстр «хранит» его самого, и изредка выполняет его просьбы, при этом считая, что человек его видит и с ним общается.</p>\n<p>Исполнение просьб буквальное и необратимое: «после начала реализации действие желания нельзя отменить».</p>\n<p>Набросок сцены, показывающий, как это работает. Главный герой после неловкой ситуации говорит: «такой стыд, убейте меня..» — «{Он уже начинает замахиваться...}». Герой поправляется: «хотя нет не меня, давай кого-нибудь другого...» — монстр закатывает глаза и «злой и раздражённый убивает объект мыслей того парня». Герой снова поправляется: «хотя ладно никого не надо убивать..» — «{но тут уже поздно, после начала реализации действие желания нельзя отменить, и начинаются на глазах главного героя массовые гибели, каждому он ре*ет сонную артерию и дождь из их крови окрашивает всю улицу в красный, самого героя и далее небо}». Герой: «нооо я же пошутил.. почему это происходит» — «{его тошнит, тело в ужасе сжалось и он упал на землю съёжившись в комочек, он кричит, он рыдает, простит прекратить}», «нееет, скажите что это всё сон, перестань, нет».</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0133-S05", "PS-0133--svyazi-s-drugimi"], "h": "<p>Буквальное исполнение желаний, которое нельзя отменить — механика, на которой построен весь набросок.</p>\n<p>Вселенная из мини историй / наша книга монстров («Некрономикон наш») — свод, к которому монстр отнесён.</p>\n<p>Главный герой сцены — тот, кто выбрал хранить чужой секрет. Отдельно как персонаж он не описан и имени не имеет.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0133-S06", "PS-0133--kak-menyalsya"], "h": "<p>Одно состояние, 2024-08-09 (id 216956–216960). Дальнейших версий в переписке нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0133-S07", "PS-0133--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Что происходит, если человек выдаст секрет или перестанет его хранить, — не сказано; сказано только, что монстр хранит человека, «пока тот хранит секрет».</li>\n<li>Видит ли и слышит ли герой монстра на самом деле — прямо не сказано; сказано лишь, что монстр выполняет просьбы, «думая что он его видит и с ним общается».</li>\n<li>Откуда монстр берётся и один ли он — в переписке не сказано.</li>\n<li>Чем кончается сцена и что было дальше с героем — осталось нерешённым.</li>\n<li>Что за секрет и кто его рассказал — не названо.</li>\n<li>Для чего монстру ножик отдельно не объяснено; в сцене он режет сонные артерии.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0133--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0133--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-09</td>\n<td>216956–216960</td>\n<td>w0050</td>\n<td>монстры (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0133-chert-s-nozhikom.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0133--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0133.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
