<script>const BASE="";const DOCNAME="Чёрные места";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0192-S01", "MR-0192--ustroystvo"], "h": "<p>Чёрные места — один из двух аспектов мира вселенной без энергии (название в чате не дано, объявлено 2026-04-19). Второй аспект — Благословенный (см. «Связано с»). Определяющее свойство места, данное дословно: «чёрные места, в которых если войти, то выйдешь уже не ты, а монстор» (2026-04-19, id 462207). Что именно происходит при входе, из чего состоит превращение и обратимо ли оно — в переписке не сказано.</p>\n<p>В повторном упоминании (2026-04-25, id 466469) место названо иначе — «тёмные места»: «Идеи для мира с тёмными местами и благословенным». Оба варианта имени — «чёрные места» и «тёмные места» — используются соавторами без пояснения, какое из них основное.</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0192-S02", "MR-0192--naselenie"], "h": "<p>В переписке не сказано. Упомянуты только те, кто «выходит уже не ты, а монстор» после входа — то есть результат посещения места, а не его обитатели или структура населения.</p>", "r": []}, {"t": "Место во вселенной — как связан с другими мирами", "a": ["S03", "MR-0192-S03", "MR-0192--mesto-vo-vselennoy"], "h": "<p>Чёрные места — часть вселенной без энергии, один из двух названных на 2026-04-19 аспектов этого мира наряду с Благословенным: «Пока что в нашем мире есть только два аспекта Благословенный и чёрные места» (id 462207). При повторном перечислении 2026-04-25 состав тот же — «Там были только благословенный и тёмные места» (id 466502), связи с другими вселенными не названы.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0192-S04", "MR-0192--kak-menyalsya-po-versiyam"], "h": "<h3>Версия 1 — 2026-04-19 (id 462206–462207)</h3>\n<p>Введены как один из двух аспектов мира. Даётся единственная характеристика — эффект входа: выходишь уже не собой, а «монстором».</p>\n<h3>Версия 2 — 2026-04-25 (id 466469–466504)</h3>\n<p>Повтор прежней мысли при обсуждении, что уже придумано в мире. Слава предлагает продолжить разработку («Идеи для мира с тёмными местами и благословенным», id 466469; «Хочу опять добавить апостолов», id 466476), но собственно к чёрным/тёмным местам разговор не возвращается — участники уточняют лишь состав уже названного («благословенный и тёмные места», id 466502) и переходят к другим темам. Новых деталей о самих местах версия не добавляет.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0192-S05", "MR-0192--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Механизм превращения человека в «монстра» при входе — не описан.</li>\n<li>Внешний вид, границы, расположение чёрных/тёмных мест внутри вселенной без энергии — не названы.</li>\n<li>Обратимость превращения — не сказано.</li>\n<li>Почему место в одном случае названо «чёрные», в другом «тёмные» — не пояснено, осталось нерешённым.</li>\n<li>Население и любые персонажи, связанные конкретно с этим местом, — не названы.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["MR-0192--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-04-19</td>\n<td>462206–462207</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-04-25</td>\n<td>466469–466504</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0192-chernye-mesta.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0192--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0192.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
