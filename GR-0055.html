<script>const BASE="";const DOCNAME="Агенты, берущие силу от животных";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0055-S01", "GR-0055--chto-eto"], "h": "<p>Категория носителей силы во вселенной «игра бога»: люди, которые берут свою силу от животных. Названы Славой одной строкой в перечне того, что он хочет добавить в новую вселенную (2024-04-02, id 151858): «Также люди берущий свою силу от животных то бишь агенты среди людей».</p>\n<p>Из этой формулировки следует всё, что о них известно: это люди (не отдельная раса и не существа), сила у них берётся от животных, и второе их обозначение — «агенты среди людей». Слово «агенты» в переписке никак не раскрыто: не сказано, чьи это агенты, при какой структуре они состоят и агенты ли они в смысле службы или в смысле «носители». Разговорные варианты названия, которые встречаются в переписке, — «агенты среди людей» и «люди берущие силу от животных»; имя статьи описательное, самими авторами группа не именовалась.</p>\n<p>Это категория, названная во множественном числе, а не один персонаж: Слава говорит о «людях» и «агентах». Но дальше первого упоминания разработка не пошла — ни одного поимённого агента, ни одного эпизода с их участием в переписке нет.</p>\n<p>Упоминание стоит в списке из трёх пунктов, которые Слава хотел «закидать» в новую вселенную: петля («то бишь перемотка времени на 10 секунд 10000 раз»), люди, берущие силу от животных, и закон. То есть агенты появились в переписке как один из строительных элементов вселенной наравне со способностью и с законом, а не как сюжетная группа.</p>", "r": []}, {"t": "Общие способности группы", "a": ["S02", "GR-0055-S02", "GR-0055--obschie-sposobnosti-gruppy"], "h": "<p>Единственная общая черта, названная в переписке, — сила берётся от животного. Механика не описана: как именно сила берётся от животного, в переписке не сказано, и это прямо отмечено как неясность в записи базы (Агенты, берущие силу от животных <em>(статьи ещё нет — <a href=\"kb/ID-0039-agenty-beruschie-silu-ot-zhivotnyh.html\">исходник</a>)</em>). Не сказано, идёт ли речь о превращении, о связи с конкретным зверем, о заимствовании способностей вида или о чём-то ещё. Одно ли животное на агента или несколько — тоже не сказано.</p>", "r": [["берущие силу от животных", "kb/ID-0039-agenty-beruschie-silu-ot-zhivotnyh.html"]]}, {"t": "Отношения с другими группами", "a": ["S03", "GR-0055-S03", "GR-0055--otnosheniya-s-drugimi-gruppami"], "h": "<p>В переписке связей не названо. Единственное сообщение об агентах (id 151858) стоит рядом с петлёй и законом, но как элементы одного списка, а не как связанные между собой вещи.</p>\n<p>База относит группу к смежным с двумя другими записями — с олицетворением персонажа с животным (Олицетворение персонажа с животным <em>(статьи ещё нет — <a href=\"kb/ID-0044-olicetvorenie-personazha-s-zhivotnym.html\">исходник</a>)</em>) и с организацией по отлову существ-преступников (<a href=\"MR-0006.html\">Организация по отлову существ-преступников</a>). Обе смежности сделаны на уровне базы; в самой переписке ни Слава, ни Миколай агентов с ними не соотносят.</p>\n<p>Про организацию (<a href=\"MR-0006.html\">Организация по отлову существ-преступников</a>) в том же окне w0029 сказано отдельно и без упоминания агентов: есть организация, которая ловит существ, совершивших преступления, «при этом эти существа могут работать в этой организации» (2024-04-01, id 150631). Пример Славы — про вампиров и оборотней: если вампир «начал гасить людей, а не питаться мертвыми», организация обязана его устранить и посылает «человека или вампира или оборотня ну кто есть» (2024-04-01, id 150659). Работают ли агенты, берущие силу от животных, в этой организации, ловят ли их или не пересекаются с ней — в переписке не сказано.</p>", "r": [["Олицетворение персонажа с животным", "kb/ID-0044-olicetvorenie-personazha-s-zhivotnym.html"], ["Организация по отлову существ-преступников", "MR-0006.html"]]}, {"t": "Как менялась — по датам", "a": ["S04", "GR-0055-S04", "GR-0055--kak-menyalas"], "h": "<p><strong>2024-04-01 (id 150629–150675).</strong> Агенты ещё не названы. Слава излагает исходную рамку новой вселенной: «зло против добра», организация, ловящая обнаглевших или совершивших преступления существ, существа как сотрудники этой организации. Сам оговаривает: «Это не та вселенная которой я хочу здесь чисто принцип».</p>\n<p><strong>2024-04-02, 06:58 (id 151856–151860, ключевое сообщение 151858).</strong> Первое и единственное упоминание агентов — в перечне из трёх пунктов вместе с петлёй и законом. Это единственная версия записи; описание с тех пор не менялось и не дополнялось.</p>\n<p><strong>2024-04-02, вечер (id 152590–152605).</strong> Слава отказывается от исходной концепции добра и зла: «изначально я хотел что была организация которая борется с злом то бишь добро и зло но сейчас думая мне как то не нравится. Лучшей будет создать концепцию scp только вбухать туда и сверхсила типо петли и закона, и экспериментах на людях. И другую расу которая будет нам помогать. Вообще концепция охота на аномалий». В новом перечне (петля, закон, эксперименты над людьми, другая раса) агенты, берущие силу от животных, уже не названы. Отменены ли они вместе со старой концепцией или просто не повторены — в переписке не сказано.</p>\n<p>Отклонённой оказалась рамка «зло против добра», внутри которой агенты были впервые названы; сама категория агентов ни принята, ни забракована явно.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "GR-0055-S05", "GR-0055--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет: ни одного агента по имени в переписке не названо, состав не назван вообще.</li>\n<li>Не сказано, как именно сила берётся от животного — отмечено как неясность в исходной записи.</li>\n<li>Не раскрыто слово «агенты»: чьи они агенты и есть ли за ними какая-то структура, в переписке не сказано.</li>\n<li>Иерархии нет: старших, младших, званий, различий между участниками не названо.</li>\n<li>Отличий участников друг от друга нет — категория описана одной общей чертой.</li>\n<li>Связь с организацией по отлову существ (<a href=\"MR-0006.html\">Организация по отлову существ-преступников</a>) и с олицетворением персонажа с животным (Олицетворение персонажа с животным <em>(статьи ещё нет — <a href=\"kb/ID-0044-olicetvorenie-personazha-s-zhivotnym.html\">исходник</a>)</em>) в переписке не названа, она существует только как смежность в базе.</li>\n<li>Отношение агентов к другим существам вселенной (вампиры, оборотни, «другая раса которая будет нам помогать») не обсуждалось.</li>\n<li>Реакции Миколая на эту идею в переписке нет: он отвечает на общую концепцию вселенной, отдельно про агентов не высказывается. Дальнейшая разработка осталась нерешённой.</li>\n<li>Название самой вселенной в чате так и не прозвучало; принадлежность к «игре бога» проставлена по дате объявления.</li>\n</ul></div>", "r": [["Олицетворение персонажа с животным", "kb/ID-0044-olicetvorenie-personazha-s-zhivotnym.html"], ["Организация по отлову существ-преступников", "MR-0006.html"]]}, {"t": "Связи — всё вместе", "a": ["GR-0055--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0006.html\">Организация по отлову существ-преступников</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0055--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0055.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0055-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0055/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым здесь чинить не агентов, а <code>ID-0050</code> «Провидец»: 3 ссылки, статьи нет, база 14 549 — крупнейший неразвёрнутый кусок «игры бога». На него смотрят <code>IS-0036</code>, <code>SP-0187</code>, <code>SP-0225</code>, <code>GR-0015</code> и <code>GR-0048</code>, и это ровно воплощение петли, то есть первого пункта того самого списка из трёх, где были названы агенты. Следом <code>ID-0041</code> «Турнир» — 3 ссылки, статьи нет, 4 216: формат, в котором обе команды персонажей должны действовать, и без него <code>GR-0049</code> и <code>GR-0050</code> описывают состав без события. Дальше <code>ID-0051</code> (2 ссылки, 4 525), <code>ID-0052</code> (2 ссылки, 3 402), <code>ID-0040</code> (2 ссылки, 3 388).</p>\n<p>Расклад по вселенной характерный: у всех двенадцати поимённых участников статьи есть, а базы под ними по 1 300–2 600 знаков (<code>PS-0043</code>, <code>PS-0044</code>, <code>PS-0045</code> — по 4 ссылки каждый при 1 384, 1 372 и 1 426); без статей стоят именно несущие идеи, и материал под ними в разы толще. Сами агенты в этом ряду — самое тонкое место: <code>ID-0039</code>, 1 877 знаков, три ссылки, и всё содержимое — одна реплика.</p>\n<h3>С чего начать</h3>\n<p>В базе, но сперва проверить смежность. <code>ID-0044</code> «Олицетворение персонажа с животным» (1 ссылка, 2 403) держится рядом с агентами на одном слове «животное»: внутри — частный разговор 2024-04-03, id 153510–153522, о том, с каким животным Миколай себя олицетворяет, зебра наугад и потом жираф с обоснованием «до жирафа всегда долго доходит». К устройству вселенной это, судя по записи, отношения не имеет, и до того как связку использовать, её стоит снять или подтвердить.</p>\n<p>Настоящие соседи — <code>MR-0007</code> «Концепция scp / охота на аномалий» (4 ссылки, база 4 490) и <code>MR-0006</code> (4 ссылки, статья 9 434, база 7 127): там лежит и старая рамка, и новая, между которыми агенты потерялись. Плюс <code>ID-0040</code> «Раса-помощник» (2 ссылки, 3 388) — элемент из того же вечернего перечня, который в новую рамку попал.</p>\n<p>В архив — за одним промежутком: 2024-04-02 между 06:58 (id 151858) и 19:44 (id 152593). За эти тринадцать часов рамка вселенной сменилась целиком, и в собранных окнах от них ничего нет. Там же искать вторую вещь: в 20:13 Миколай пишет «ты там уточни несколько моментов, которые я попросил выше» — этих просьб «выше» в материале не видно, значит они либо раньше в w0029, либо выпали.</p>\n<h3>Как развивалось</h3>\n<p>2024-04-01 — заявили рамку: организация, ловящая обнаглевших существ, зло против добра, с оговоркой самого автора «Это не та вселенная которой я хочу здесь чисто принцип». 2024-04-02, 06:58 — агенты названы, третьим пунктом в списке из трёх: петля, агенты, закон, всё это «закидать» в новую вселенную. 2024-04-02, 19:46 — рамку сняли: «мне как то не нравится», вместо неё scp и охота на аномалий, и выдан новый перечень — петля, закон, эксперименты над людьми, другая раса. Из трёх утренних пунктов в него перенесены два. Агентов не перенесли и не отменили — они просто не названы. 20:13 — Миколай просит время и рамки по срочности. К агентам никто из двоих не возвращается.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для вампиров граница проведена через источник силы: питаться мёртвыми можно, «начал гасить людей, а не питаться мертвыми» — нельзя, и тогда организация обязана устранить, причём послать может «человека или вампира или оборотня ну кто есть» (id 150659). То есть правило связывает способ кормления с юридической границей и заодно допускает нарушителя в штат. Агенты берут силу тоже от живого — от животных, — и для них ничего из этого ряда не названо: ни цены для источника, ни границы допустимого, ни того, попадают ли они под ту же организацию или стоят вне её. Место — id 150631 и 150659 против id 151858, полтора суток разницы.</p>\n<h3>Отклик</h3>\n<p>Зацепило слово «агенты». Оно приходит с готовым шлейфом — раз агенты, значит кто-то их нанимает, кому-то они докладывают, есть служба, — и за этим шлейфом ровно ничего нет, ни одной буквы. Одно существительное сделало вид, что за ним стоит институт, и авторы, кажется, сами на это купились и пошли дальше. Второе, что осталось, — реплика Миколая тем же вечером: «мне прям штурмануть на часика 3 надо мозг, чтобы понимать, что хочу и как», «напиши как по срочности, чтобы я ну как-то чувствовал рамочки». Это уже не про вселенную, а про то, как двое пытаются работать вместе, и звучит честнее всего в окне. А агенты в итоге не были ни приняты, ни отвергнуты: утром их назвали третьими из трёх, вечером список пересобрали, два пункта переехали, третий не переехал — и никто не заметил.</p></div>", "r": []}];</script>
