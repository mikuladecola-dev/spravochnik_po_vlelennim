<script>const BASE="";const DOCNAME="Граф";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0323-S01", "PS-0323--proishozhdenie"], "h": "<p>Граф — апостол, то есть относится к расе апостолов, а не к людям. В переписке он вводится сразу как готовая фигура, без рассказа о том, откуда взялся: обстоятельства его появления не названы.</p>\n<p>Имя-титул перенесено из другой работы соавторов: при вводе прямо сказано «опять отсылка на семь островов» (2025-12-06, id 393298). Так же помечен и Нуар, который вводится в том же перечне: «это нуар из котов» — «как и в семи островав, так и здесь я не смог придумать ему характер» (id 393297).</p>\n<p>Введён вторым в перечне из трёх сильнейших существ мира: первым идёт Нуар, вторым Граф, третьей — девушка на стороне людей (<a href=\"PS-0327.html\">Девушка, изменяющая мир волнами</a>).</p>", "r": [["Девушка, изменяющая мир волнами", "PS-0327.html"]]}, {"t": "Характер", "a": ["S02", "PS-0323-S02", "PS-0323--harakter"], "h": "<p>При вводе (2025-12-06, id 393298): «Он высокомерный и беспечный апостол, что веселиться». У него своя банда — «просто для развлечения», «грубо говоря он король преступного мира».</p>\n<p>Тогда же указано, что этот характер планировалось уравновесить через другого персонажа: «И также в будущем у него появиться девушка для стабилизации его нарцисцеческого характера» (id 393299). Кто эта девушка — в переписке не сказано.</p>\n<p>Через полгода характер переформулирован (2026-06-02, id 487021): «Граф высокомерный и часто раздражённые из-за боли в голове». Высокомерие сохранилось, беспечность и веселье в этой формулировке отсутствуют, вместо них — постоянная боль в голове. В навигационной сводке окна w0120 боль связана с собственной способностью Графа.</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0323-S03", "PS-0323--sposobnosti"], "h": "<p>Способность называется Власть. Определение при вводе (2025-12-06, id 393298): «Контроль всего, что есть в определенном радиусе».</p>\n<p>Уровень силы задан там же: «Достаточно силён, чтобы разнести гору, плюсом он быстрейший апостол ( хотя этот титул носит другой Апостол. Ну по факту он быстрее)». То есть титул быстрейшего апостола формально принадлежит кому-то другому, а фактически быстрейший — Граф.</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0323-S04", "PS-0323--svyazi-s-drugimi"], "h": "<ul>\n<li>Апостолы — раса, к которой он принадлежит; он один из двадцати одного (в другом месте — из двенадцати, см. ниже).</li>\n<li>Палач — второй из двух сильнейших апостолов. Прямая формулировка (2026-06-02, id 487176): «Что сильнейший апостолы это Граф и Палач». Палач при этом описан как «цепной пёс ассоциации», убийца неугодных ассоциации, не числящийся героем, «в ближнем бою он почти сильнейший».</li>\n<li>Нуар — вместе с Графом входит в шесть столпов героев (2026-06-02, id 487002). Ранее оба перечислены как двое из трёх сильнейших.</li>\n<li>Шесть столпов героев — «шесть сильнейших Героев» на стороне ассоциации. «Вот Граф один из столпов героев» (id 487004).</li>\n<li>Изб — упомянут рядом с Графом в одном сообщении о характерах: «Изб новичок который стремится к идеалами» (id 487021). Связь между ними как между персонажами в переписке не описана, они просто идут подряд в одном перечне.</li>\n<li>Агрегат и Защитник — названы вместе с Графом как трое, чья судьба уже определена автором: «Вообще у Агрегат, Графа и Защитника Судьба предрешена. Ну я то есть придумал их ней путь» (2025-12-06, id 393478). Сам этот путь в переписке не изложен.</li>\n<li>Банда Графа — держит её для развлечения; состав и название не названы.</li>\n<li>Девушка для стабилизации характера — заявлена как будущая, не отождествлена ни с кем.</li>\n</ul>", "r": []}, {"t": "Как менялся", "a": ["S05", "PS-0323-S05", "PS-0323--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2025-12-06 (окно w0112, id 393296–393301).</strong> Введён как второй из трёх сильнейших существ мира. Высокомерный и беспечный, веселится, держит банду ради развлечения, «король преступного мира». Способность — Власть, контроль всего в определённом радиусе. Силён настолько, чтобы разнести гору; фактически быстрейший апостол при том, что титул носит другой. Отмечено, что в будущем появится девушка для стабилизации его нарциссического характера.</p>\n<p><strong>Версия 2 — 2025-12-06 (окно w0112, id 393478–393480).</strong> Граф попадает в группу персонажей с предрешённой судьбой — вместе с Агрегатом и Защитником. Дальше в том же сообщении разговор уходит на босса-человека и на Имита как представителя апостолов для правительства; к Графу это прямо не отнесено.</p>\n<p><strong>Версия 3 — 2026-06-02 (окно w0120, id 487002–487005).</strong> Граф оказывается на стороне ассоциации: «В ней входит граф и нуар». Прямое повторение: «Вот Граф один из столпов героев». При этом он остаётся апостолом, а про апостолов в этом же месте сказано, что они «держут нейтралитет. Конечно не все». Общий расклад сил на этот момент: «6 героев, 6 злодеев, 4 ахрепископа, 12 апостолов, ну и кто-нибудь из Нимба». Число апостолов здесь 12, тогда как раньше их 21 — расхождение в переписке не оговаривается.</p>\n<p><strong>Версия 4 — 2026-06-02 (окно w0120, id 487021–487022).</strong> Переформулирован характер: «Граф высокомерный и часто раздражённые из-за боли в голове».</p>\n<p><strong>Версия 5 — 2026-06-02 (окно w0120, id 487176–487178), повтор прежней мысли.</strong> Напоминание о том, кто сильнейшие апостолы: «Надеюсь ты не забыл. Что сильнейший апостолы это Граф и Палач».</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0323-S06", "PS-0323--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Кто носит титул быстрейшего апостола — не названо (w0112).</li>\n<li>Внешность Графа не описана нигде.</li>\n<li>Придуманный «путь» Графа, Агрегата и Защитника заявлен как существующий, но в переписке не изложен.</li>\n<li>Девушка, которая должна стабилизировать его характер, не названа и не отождествлена с кем-либо из известных персонажей.</li>\n<li>Как совмещается положение «короля преступного мира» с местом среди шести столпов героев — не объяснено.</li>\n<li>Связь боли в голове со способностью Власть проговорена только в сводке окна w0120; в самих сообщениях причина боли не названа.</li>\n<li>Банда Графа: состав, название и дальнейшая роль не названы.</li>\n<li>Расхождение между 21 и 12 апостолами не разрешено.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0323--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0056.html\">Апостолы (21 апостол; «насекомые»)</a>, <a href=\"GR-0071.html\">Банда Графа</a></li>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0327.html\">Девушка, изменяющая мир волнами</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0104.html\">Нуар</a>, <a href=\"PS-0327.html\">Девушка, изменяющая мир волнами</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0056.html\">Апостолы (21 апостол; «насекомые»)</a>, <a href=\"GR-0071.html\">Банда Графа</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0323--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-12-06</td>\n<td>393296–393301</td>\n<td>w0112</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-06</td>\n<td>393478–393480</td>\n<td>w0112</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-02</td>\n<td>487002–487005</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-02</td>\n<td>487021–487022</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-02</td>\n<td>487176–487178</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0323-graf.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0323--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0323.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
