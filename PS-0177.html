<script>const BASE="";const DOCNAME="Гнев (грех)";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0177-S01", "PS-0177--proishozhdenie"], "h": "<p>Гнев — один из семи грехов вселенной «Апостол». Появляется 2024-12-24 (id 273904–273908) внутри общего захода Миколая по грехам: «продолжаю грехи писатт». В том сообщении разом расписаны похоть, чревоугодие, алчность, лень, гнев, зависть и гордыня; гнев — пятый по порядку.</p>\n<p>В каталоге за ним закреплена короткая пометка: «Гнев 😡( сила)» (2025-01-24, id 284278). В шапке записи имя фигурирует также как «ira».</p>", "r": []}, {"t": "Характер", "a": ["S02", "PS-0177-S02", "PS-0177--harakter"], "h": "<p>По Миколаю (2024-12-24, id 273906): «по характеру чувствительность к тому что считаешь несправедливым».</p>\n<p>К этому там же идёт авторская оговорка про природу самой несправедливости: «справедливость всегда субъективна, но субъективная не всегда глупая».</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0177-S03", "PS-0177--sposobnosti"], "h": "<p>Набор от 2024-12-24 (id 273906), дословно:</p>\n<ul>\n<li>«при несправедливом ты в режиме берсерка, повышается мышечная масса, тобиж в размерах меняешься, сила возрастает, контроль уходит и ты разрушаешь то что не справедливо»;</li>\n<li>«магия взрыва развита»;</li>\n<li>«вес ног увеличен».</li>\n</ul>\n<p>Проклятье: «теряешь способность видеть человеком того кто поступил не справедливо (ну личность не видишь, это просто груша с маркером ненависти ты видишь чувство)».</p>\n<p>Отдельно Миколай оговаривает общий принцип, под который подпадает и гнев (2024-12-24, id 273917): «но в грехах это базовое подразумевается, такова природа греха».</p>\n<p>Каталожная формулировка способности, появившаяся позже (2025-01-24, id 284278): «Гнев 😡( сила)».</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Отклик — не материал авторов</b>\n<p>Зацепило проклятье, и не тем, что оно жестокое, а тем, как оно устроено. «Это просто груша с маркером ненависти ты видишь чувство» — расчеловечивание описано не как моральный провал, а как поломка зрения: личность физически перестаёт отображаться, на её месте остаётся предмет с ярлыком. Это точнее, чем любое «он озверел». И рядом, в скобках, посреди списка способностей — «справедливость всегда субъективна, но субъективная не всегда глупая»: человек на ходу защищает своего берсерка от обвинения в дурости, не оправдывая при этом ни одного его удара. Из семи описаний это единственное, где автор остановился и подумал про носителя, а не про приём. Тем страннее «вес ног увеличен» — сухая строчка из другого жанра, зажатая между магией взрыва и проклятьем.</p></div>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0177-S04", "PS-0177--svyazi-s-drugimi"], "h": "<p>Гнев входит в состав Семи грехов. Прочие грехи в редакции Славы от 2024-12-24 (id 273920), повторённой без изменений 2025-01-23 (id 284176):</p>\n<ul>\n<li>Похоть: «Контроль разума с ограничением. То бишь она может повысить какое то чувство или вызвать галлюцинаций или наоборот понизить какой то чувство»;</li>\n<li>Чревоугодие: «ок» (принято в редакции Миколая);</li>\n<li>Алчность: «Я думал больше о способности поглощений чужой манный или объектов»;</li>\n<li>Лень: «я думал телекинез типа лень чё то делать вот и телекинез ( здесь ещё в придачу владений магий ветра, как никак они связаны)»;</li>\n<li>Зависть: «Полной перевоплощение тому кого завидуешь, под полный подразумевается полной копирование сил, магии, одежды, внешность но не характера»;</li>\n<li>Гордыня: «Слово закон с ограничением».</li>\n</ul>\n<p>Место грехов в силовой иерархии задано двумя репликами Славы.</p>\n<p>2025-01-23 (id 284175): «7 грехов и божество ( помнишь его) / Будет слабей главы этой организации но сильней благословенного».</p>\n<p>2025-01-24 (id 284276): «Но не забывай 7 грехов сильней благословенный и чтобы убить одного греха в максимум надо 3 благословенных именно Бога / А для остальных благословенных надо будет 5».</p>\n<p>Каталожный вид семи грехов на 2025-01-24 (id 284278): Гнев 😡 (сила), Похоть 😵‍💫 (контроль разума), Зависть 👹👹 (полной копирование), Алчность ♾ (всё моей), Гордыня 👑, Чероугодия ◼️ (поглощения), Лень 😴 (контроль территории). Здесь у Лени вместо телекинеза стоит «контроль территории», у Гордыни способность не проставлена.</p>\n<p>Существует отдельный персонаж — воплощение гнева, он же Защитник 🤬 из списка благословенных (Защитник 🤬 (ангел 👼), id 284278). Как грех Гнев соотносится с ним, в переписке не оговорено.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S05", "PS-0177-S05", "PS-0177--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2024-12-24 (id 273904–273908).</strong> Полный вариант Миколая: чувствительность к несправедливому, режим берсерка с ростом мышечной массы и размеров, потерей контроля и разрушением несправедливого; развитая магия взрыва; увеличенный вес ног; проклятье — обидчик перестаёт восприниматься как человек, «это просто груша с маркером ненависти».</p>\n<p><strong>Версия 2 — 2024-12-24 (id 273917–273921).</strong> Слава проходит по всем грехам и правит почти каждый: похоть, алчность, лень, зависть и гордыню он переписывает под себя. Гнев принимает без правок — «Гнев ну ок». Чревоугодие тоже принято как есть: «Чревоугодие ок».</p>\n<p><strong>Версия 3 — 2025-01-23 (id 284175–284177).</strong> Слава повторяет свой же список от 2024-12-24 дословно, в контексте разговора о том, что семь грехов и божество «будет слабей главы этой организации но сильней благословенного». Гнев остаётся без изменений — строка «Гнев ну ок» переносится в неизменном виде.</p>\n<p><strong>Версия 4 — 2025-01-24 (id 284278–284279).</strong> Гнев попадает в сводный каталог уже не описанием, а короткой пометкой: «Гнев 😡( сила)». Прежний набор (берсерк, взрыв, вес ног, проклятье) при этом не отменяется — он просто не пересказывается в каталожной строке.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0177-S06", "PS-0177--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Соотношение греха Гнева с персонажем-воплощением гнева (Защитником) не оговорено: не сказано, один это персонаж, два разных или одно производно от другого.</li>\n<li>Носитель греха как персонаж не описан: ни внешности, ни имени, ни истории.</li>\n<li>Как каталожная «сила» (2025-01-24) соотносится с прежним набором из берсерка, магии взрыва и увеличенного веса ног — не сказано; заменяет она его или сокращённо обозначает, в переписке не разобрано.</li>\n<li>Категория способности (благословение это или стихия) для гнева не определена. Для похоти Миколай отдельно отмечал, что «категорию хз как определить»; для гнева вопрос вообще не поднимался.</li>\n<li>Механика выхода из режима берсерка и снятия проклятья не описана.</li>\n<li>Кто решает, что считается несправедливым, кроме самого носителя, не разобрано; сказано только, что «справедливость всегда субъективна».</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0177--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0002.html\">Семь грехов</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0186.html\">Междумирцы</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0002.html\">Семь грехов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0177--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-12-24</td>\n<td>273904–273908</td>\n<td>w0068</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-24</td>\n<td>273917–273921</td>\n<td>w0068</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-23</td>\n<td>284175–284177</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-24</td>\n<td>284278–284279</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0177-gnev-greh.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0177--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0177.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0177-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0177/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дороже всего — <code>SP-0156</code> «Семь грехов (магия по грехам)»: 11 757 знаков базы, статьи нет, вселенная «неясно», ссылок ноль. Из этой записи вырезан антецедент цитаты, на которой стоит целый абзац статьи. Статья приводит реплику Миколая 273917 «но в грехах это базовое подразумевается, такова природа греха» как общий принцип, поставив её сразу после проклятья. В <code>SP-0156</code> видно, к чему относится «это»: за три минуты до неё Слава пишет про базовые стихии — «Базовый стихий это владением одной из 4 стихий… ты не можешь сразу начать учиться магий дерева для тебя сначала надо научиться магии земле… Ну то бишь как в аватаре» (273915), Миколай отвечает «ок» (273916) и только следом добавляет про грехи. Реплик 273915–273916 в записи <code>PS-0177</code> нет — версия 2 начинается прямо с 273917. То есть принцип в статье висит без предмета, а пробел «категория способности (благословение это или стихия) для гнева не определена» задет ровно этой репликой и с другой стороны.</p>\n<p>Второе — каталоги <code>SL-0053</code> (20 313, статьи нет, шесть ссылок) и <code>SL-0051</code> (9 834, статьи нет, шесть ссылок). Статья кончается 2025-01-24, а строка «Гнев 😡( сила)» живёт в <code>SL-0053</code> ещё четыре редакции подряд, дословно: 284858 (2025-01-27), 285519–285551 (2025-01-28), 295556 (2025-02-25), 298846 (2025-03-06). И в последней из них, 298854, Слава: «Грехи нужно убрать, а то тупо», Миколай следом: «ну просто в сюжет не совсем входят». Это решение по всей семёрке, принятое после последней даты статьи, и ни одна статья грехов его не знает.</p>\n<h3>С чего начать</h3>\n<p>В базе.</p>\n<p><code>SP-0156</code>, окно w0068, id 273912–273921 — там декабрьский обмен целиком, с базовыми стихиями, ответом Славы по семи пунктам и полуторачасовой паузой в конце. Оттуда же берётся полный текст 273906: у Миколая на семь грехов раздача разной плотности, и видно, что именно он определял, а что нет.</p>\n<p><code>ID-0111</code> «Добродетели и грехи как основа благословений» (5 419, статьи нет, одна ссылка), id 278968–278984, 2025-01-06. Между версией 2 и версией 3 статьи. Миколай предлагает взять добродетели и грехи за основу благословений, вставляет франклиновский список из тринадцати пунктов, Слава отвечает «Нафига». В самом списке дважды прописана справедливость — «Не причинять никому вреда; не совершать несправедливостей» и «сдерживать, насколько ты считаешь это уместным, чувство обиды от несправедливостей». Это ближайшее место, где в переписке вообще обсуждали, чем меряется несправедливость, — то есть заход на пробел «кто решает, что считается несправедливым».</p>\n<p>В архив — за одним: 2024-12-25, окно w0068, id 274459–274472. Миколай разбирает встречный список Славы по пунктам, но реплики безадресные: «нуу думаю это получше», «это лучше», «вот это подходит», «тоже хороший вариант». К какому греху относится каждая, из базы не восстанавливается — нужны цели ответов. Гнев в этом разборе может быть, а может и не быть; статья про этот день не знает вовсе.</p>\n<h3>Как развивалось</h3>\n<p>2024-12-24, 13:57 — заявили: полный набор Миколая, берсерк, магия взрыва, вес ног, проклятье. 2024-12-24, 14:26 — Слава проходит по семёрке и переписывает пять пунктов из семи; гнев остаётся нетронутым, «Гнев ну ок», вместе с чревоугодием единственный такой. 2025-01-23 — тот же список Славы выложен заново дословно, строка про гнев переносится без изменений. 2025-01-24 — сжали: в каталоге от всего набора остаётся «Гнев 😡( сила)». Дальше (уже за границей статьи) строку переносят из редакции в редакцию ещё четыре раза, не трогая, а 2025-03-06 весь раздел снимают с доски: «Грехи нужно убрать, а то тупо». Возврата в прочитанных окнах нет.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Проклятье — цена, которую платит носитель. В декабрьской раздаче оно названо у двоих: у алчности («ты не можешь ничего отдать кому либо») и у гнева («теряешь способность видеть человеком того кто поступил не справедливо»). У пяти остальных — похоти, чревоугодия, лени, зависти, гордыни — в той же раздаче платы нет ни строчки, хотя способности расписаны так же подробно. Для двух грехов оборотная сторона выписана, для пяти того же ряда — нет.</p>\n<h3>Отклик</h3>\n<p>Зацепило проклятье, и не тем, что оно жестокое, а тем, как оно устроено. «Это просто груша с маркером ненависти ты видишь чувство» — расчеловечивание описано не как моральный провал, а как поломка зрения: личность физически перестаёт отображаться, на её месте остаётся предмет с ярлыком. Это точнее, чем любое «он озверел». И рядом, в скобках, посреди списка способностей — «справедливость всегда субъективна, но субъективная не всегда глупая»: человек на ходу защищает своего берсерка от обвинения в дурости, не оправдывая при этом ни одного его удара. Из семи описаний это единственное, где автор остановился и подумал про носителя, а не про приём. Тем страннее «вес ног увеличен» — сухая строчка из другого жанра, зажатая между магией взрыва и проклятьем.</p></div>", "r": []}];</script>
