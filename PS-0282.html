<script>const BASE="";const DOCNAME="начальник (из «Вины»)";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0282-S01", "PS-0282--proishozhdenie"], "h": "<p>Персонаж истории Славы «Вина». В переписке появляется 2025-05-27 (id 330705–330738, окно w0099) — не как заново придуманный герой, а как уже написанный: Миколай дочитал текст и разбирает его.</p>\n<p>Собственно вводных данных о персонаже — кто он, где работает, как выглядит — в переписке нет. Есть только его роль в тексте: у него есть диалог с рассказчиком, и он добрый.</p>\n<p>Разговор, в котором он всплывает, шире самого персонажа: Миколай сначала хвалит текст в целом («ты какого хуя так хорошо пишешь», «ебануться какие мысли интересные / в диалоге с начальником»), потом объявляет, что специально будет искать, к чему придраться: «поэтому, чтобы ты имел право исправить ошибки и стать ещё лучше раздавив меня навыком, я буду ебаться с тем чтоб найти до чего доебаться». Первый пункт претензий он формулирует как «наивность некоторых идей и не понимание как это работает в реальности» (id 330718), и Слава сразу переспрашивает: «Каких» — «Типо начальник» (id 330719–330720).</p>", "r": []}, {"t": "Характер", "a": ["S02", "PS-0282-S02", "PS-0282--harakter"], "h": "<p>Единственная закреплённая черта — доброта, и именно её масштаб стал предметом спора.</p>\n<p>Позиция Славы (автора): «Ну так он слишком добрый» (id 330730). Слава считает персонажа неестественным — что подтверждается его же репликой «Я думал о слишком хорошим начальником» (id 330725), то есть он сам ожидал претензии именно к этому месту.</p>\n<p>Позиция Миколая: «мне реально понравился начальник», «я не вижу его неестественным если честно» (id 330728–330729). Аргумент — личный опыт: «я на своём опыте знаю, что такие люди бывают. настолько добрые» (id 330732), «когда вижу человека которому пиздец хуёво я тоже хочу помочь и буду добрым» (id 330733), «даже если заёбан» (id 330734). И оговорка: «да я не начальник / но я верю что такое может существовать» (id 330735–330736).</p>\n<p>То есть по характеру персонажа авторы разошлись прямо: автор считает своего начальника перебором, соавтор — достоверным.</p>", "r": []}, {"t": "Связи с другими", "a": ["S03", "PS-0282-S03", "PS-0282--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>«Вина»</strong> — история Славы, частью которой персонаж является.</li>\n<li><strong>Рассказчик «Вины»</strong> — второй участник диалога, за который Миколай хвалил текст. Отдельно не описан.</li>\n</ul>", "r": []}, {"t": "Как менялся", "a": ["S04", "PS-0282-S04", "PS-0282--kak-menyalsya"], "h": "<p>Версия одна — 2025-05-27 (id 330705–330738). Персонаж не переделывался: разговор кончается расхождением во мнениях, а не правкой. Слава на возражение Миколая отвечает «Ну так он слишком добрый» и «Не» (id 330730–330731), Миколай излагает свой довод и уходит дальше по тексту: «лан я опять пошел искать доёбы» (id 330738).</p>\n<p>Что персонаж в итоге останется таким, как написан, или будет переписан — в переписке не сказано.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "PS-0282-S05", "PS-0282--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Ни имени, ни возраста, ни внешности, ни места работы персонажа в переписке нет — он назван только по должности.</li>\n<li>Содержание самого диалога с начальником не приводится: Миколай его хвалит, но не цитирует.</li>\n<li>Спор остался нерешённым: авторы остались каждый при своём, договорённости о правке нет.</li>\n<li>Претензия Миколая, из-за которой начался разговор («наивность некоторых идей и не понимание как это работает в реальности»), применительно к начальнику не расшифрована — конкретика, которую Миколай пошёл искать, оказалась про другое место текста, а не про этого персонажа.</li>\n<li>Роль начальника в сюжете «Вины» не описана.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["PS-0282--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-05-27</td>\n<td>330705–330738</td>\n<td>w0099</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0282-nachalnik-iz-viny.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0282--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0282.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0282-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0282/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дыра здесь не в недостающем материале, а в несведённых записях, и чинить надо это.</p>\n<p>Статья говорит: «ни имени, ни возраста, ни внешности, ни места работы персонажа в переписке нет». Рядом лежит <code>PS-0274</code> «Начальник с завода» (22 862 знака, статья есть) — начальник Александра Титовского в той же «Вине»: завод, служба с отцом героя, коньяк в кабинете, три часа дороги, ночь в машине, разговор в палате. По датам это разные точки одного текста (19 мая — сам текст, 27 мая — разбор), но фигура похоже одна, разведённая на две записи по тому, кто о ней говорит. Проверять это надо первым: пока не проверено, статья честно перечисляет как пробелы то, что в соседней записи расписано на двадцать килобайт.</p>\n<p>Второе того же рода: «Рассказчик \"Вины\" — отдельно не описан» при существующем <code>PS-0271</code> «Александр Титовский» (59 077, статья есть).</p>\n<p>И общий счёт по кластеру: у <code>IS-0060</code> «Вина» (92 890), <code>PR-0080</code> (56 659), <code>PS-0271</code>, <code>PS-0273</code>, <code>PS-0274</code>, <code>PS-0275</code>, <code>PS-0276</code> и у этой записи (6 476) — ноль входящих ссылок у каждой. Самый крупный связный массив вселенной не вызывается ни из одной статьи, кроме указателя.</p>\n<h3>С чего начать</h3>\n<p>В архив идти незачем: разговор целиком уложился в 330705–330738, и после 330738 начальник в окне w0099 не всплывает ни разу.</p>\n<p>Всё нужное — в базе. Диалог с начальником, который Миколай хвалит, но не цитирует, лежит в <code>PR-0080</code> «Вина» (56 659) и <code>IS-0060</code> (92 890), обе со статьями. Предысторию разбора даёт <code>SL-0097</code> «Прослушивание \"Вины\" в нейро-озвучке» (2 835, статьи нет, 2025-05-21, окно w0098): за шесть дней до спора Миколай кидал текст в нейро-озвучку, потому что «сил и времени нет», и хотел понять, о чём история и как написана. Это прямо объясняет, почему разбор 27 мая начинается с общих восторгов, а конкретика приходит только под нажимом.</p>\n<h3>Как развивалось</h3>\n<p>19 мая — текст. 21 мая — Миколай слушает его в озвучке, чтобы осилить. 27 мая, 19:35 — дочитал, хвалит, отдельно выделяет диалог с начальником. Через несколько минут сам себе назначает режим: искать, к чему придраться, «чтоб ты имел право исправить ошибки». 19:41 — первая претензия сформулирована широко, «наивность некоторых идей», и сужает её не автор претензии, а Слава: «Каких» — «Типо начальник». 19:53–19:56 — расхождение: автор считает своего персонажа перебором, соавтор защищает его личным опытом. Дальше «лан я опять пошел искать доёбы», и к начальнику не возвращались. Заявили — сузили чужой рукой — разошлись — ушли.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Достоверность здесь проверяют одной названной меркой: бывают ли такие люди на личном опыте — «я на своём опыте знаю, что такие люди бывают. настолько добрые». Мерка проговорена и приложена к доброте. К другому ходу того же начальника — если это тот же начальник, <code>PS-0274</code>, — где он сознательно толкает героя на месть, «прекрасно понимая, что сейчас возможно создаёт убийцу», та же мерка не приложена вообще. Спорили о том, бывают ли люди настолько добрые; бывают ли они настолько решительные в другую сторону — вопрос не поставлен.</p>\n<h3>Отклик</h3>\n<p>Сильное место — как Слава подставляется заранее. «Я думал о слишком хорошим начальником» сказано до претензии: автор уже знал, где у него тонко, и ждал удара именно туда. Удар не пришёл — Миколай похвалил ровно это место. И дальше происходит редкое: автор спорит против собственного персонажа, соавтор — за. Обычно расхождение выглядит наоборот. Довод Миколая при этом держится не на тексте, а на нём самом — «когда вижу человека которому пиздец хуёво я тоже хочу помочь и буду добрым», «даже если заёбан», и следом честная оговорка «да я не начальник». Спор о правдоподобии героя за три реплики становится разговором о том, кто из двоих во что верит про людей, и кончается без правки. Похоже, это здесь единственный возможный конец.</p></div>", "r": []}];</script>
