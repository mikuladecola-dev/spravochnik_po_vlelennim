<script>const BASE="";const DOCNAME="Феня";
const LEAD="";
const CH=[{"t": "Зарождение", "a": ["S01", "VS-0011-S01", "VS-0011--zarozhdenie"], "h": "<p>Вселенная объявлена <strong>2025-12-09, между 15:30 и 15:36 (окно w0113, id 394730–394757)</strong>. Объявляющее сообщение — 394734 (Слава):</p>\n<div class=\"q\"><p>Как назвать вторую Вселенную.<br>Первая Оам.<br>Ещё есть семь островов<br>И правитель<br>А эту как назвать?</p></div>\n<p>То есть на момент объявления вселенная уже существовала как работающий, но безымянный материал, и объявлением закрывался только вопрос имени. По разметке базы это единственное объявление по этой вселенной: отрезок жизни один, <strong>2025-12-09 — 2026-02-06</strong>, тип события — «объявление» (не «смена», не «возврат»). В основании отрезка записано: «объявление 394734 — вторая вселенная названа „Феня“ (первая при этом остаётся Оам), идёт параллельно». Феня объявлена не вместо Оам, а второй, параллельно идущей вселенной.</p>\n<h3>Как выбирали название (2025-12-09, id 394730–394757)</h3>\n<p>Разговор начинается с обыгрывания имени Славы: «Кстати Вай» (394730, Слава), «имя твоё?» / «Вайчеслав» (394732–394733, Миколай). После вопроса 394734 Слава пишет «Вай Вай вай» (394735).</p>\n<p><strong>Отвергнутый вариант «Вай».</strong> Миколай отвечает: «та к и назовём» (394736) с обоснованием «раз гг долбаеб» (394737) и уточнением «вай какой» (394739). Слава называет вселенную «Вторая» (394738) и отклоняет обоснование: «Это не гг» (394740), «Гг бессмертный» (394741). Миколай: «...» (394742), «эх» (394743).</p>\n<p><strong>Принятый вариант «феня».</strong> Миколай: «пусть будет феня» (394745, 15:32). Тут же поясняет принцип именования: «типа Инфинити это бесконечность» (394747) — то есть имя вселенной как значащее слово. Затем даёт смысл самого слова (394749, 15:33):</p>\n<div class=\"q\"><p>феня это язык торговли, где всех наёбывали и придумали слово лох</p></div>\n<p>Реакция Славы идёт в два хода. Сначала «Сам ты Феня» (394748), потом принятие: «Тогда феня» (394751) и обоснование, ради которого имя и оставлено (394753, 15:34):</p>\n<div class=\"q\"><p>Феня. Идеально описывает всех сверхлюдей. Их наебали</p></div>\n<p>То есть смысл названия привязан прямо к населению вселенной: воровской язык торговли, где всех обманывали, — и обманутые сверхлюди. Никакого другого объяснения имени в переписке нет.</p>\n<p>Отдельная реплика Славы, стоящая непосредственно после предложения названия (394746):</p>\n<div class=\"q\"><p>Что это за унизительно остановки речь.<br>Она предназначена для подавления воли?</p></div>\n<p>Миколай повторяет эту же реплику дословно в 394756. К чему именно относится вопрос — к слову «феня» как явлению или к чему-то ещё — в переписке не сказано.</p>\n<p>Между этим Миколай бросает шутку «паххахмхахмхм, Павла Воли чтоли» (394752); развития она не получает.</p>\n<h3>Из чего выросла и что было до неё</h3>\n<p>Прямой вопрос Миколая: «а когда появилась это вселенная?» (394754) и «сегодня ты первый раз о ней написал?» (394755). Ответ Славы (394757, 15:36) — единственное изложение происхождения вселенной, дословно:</p>\n<div class=\"q\"><p>Давненько.<br>Вообще это Вселенная появилась лишь потому что я пытался тот образ гг сделать в настоящим.<br>А после она просто стало лёгкая вселенная<br>То есть сверх силы там слабее. И в теории даже обычные человек способен победить сверхчеловека.<br>Из-за легче развивать отношения людей.<br>Просто в Оам все чё-то слишком сильный. Да и Оам Вселенная большая как боевик</p></div>\n<p>Через тринадцать минут та же мысль повторяется короче (394839, 15:49):</p>\n<div class=\"q\"><p>По сути Вселенная лёгкая я же её придумал для развития персонажей, чтобы не заморачиваться над системы силы</p></div>\n<p>Что из этого зафиксировано:</p>\n<ul>\n<li>Вселенная появилась <strong>«давненько»</strong>, задолго до 2025-12-09; дата первого появления в чате не названа, и вопрос «сегодня ты первый раз о ней написал?» прямого ответа не получил.</li>\n<li>Причина появления — попытка <strong>«тот образ гг сделать в настоящим»</strong>. Про этот образ в тот же день сказано: «Гг бессмертный» (394741), «Ну и тем что гг долбоеб» (394646), «Вообще этот образ гг был впихнут во вторую Вселенную» (394664, 15:22). В составе вселенной есть персонаж «Бессмертный главный герой» (<a href=\"PS-0331.html\">Бессмертный главный герой</a>). Тождество образа и этого персонажа в переписке прямо не заявлено.</li>\n<li><strong>Смена назначения: «А после она просто стало лёгкая вселенная».</strong> Исходно вселенная была инструментом под одного персонажа, затем стала «лёгкой». Даты этого перехода в переписке нет.</li>\n<li>Признаки «лёгкой» вселенной, названные автором: «сверх силы там слабее», «в теории даже обычные человек способен победить сверхчеловека», «Из-за легче развивать отношения людей».</li>\n<li>Противопоставление названо прямо: в Оам «все чё-то слишком сильный», Оам — «Вселенная большая как боевик». Феня определяется через контраст с Оам.</li>\n</ul>\n<h3>Названия и рабочие обозначения</h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Обозначение</th>\n<th>Кто, id</th>\n<th>Отношение к вселенной</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>«Феня» / «феня»</td>\n<td>Миколай 394745, принято Славой 394751, 394753</td>\n<td>Принятое и закреплённое имя вселенной; в базе канонизировано как «Феня»</td>\n</tr>\n<tr>\n<td>«вторая Вселенная», «Вторая»</td>\n<td>Слава 394734, 394738</td>\n<td>Рабочее обозначение до присвоения имени; «вторая» — по отношению к Оам как первой</td>\n</tr>\n<tr>\n<td>«Вай»</td>\n<td>Миколай 394736, 394739</td>\n<td>Предложенный вариант, отвергнут: «Это не гг», «Гг бессмертный». Вырос из обыгрывания имени Славы («Вайчеслав», 394733), а не из содержания вселенной</td>\n</tr>\n<tr>\n<td>«Инфинити»</td>\n<td>Миколай 394747</td>\n<td>Не название этой вселенной, а пример принципа («типа Инфинити это бесконечность»). К какой вселенной или произведению относится сам пример — в переписке не сказано</td>\n</tr>\n<tr>\n<td>«Сам ты Феня»</td>\n<td>Слава 394748</td>\n<td>Реплика в момент принятия имени, не отдельное обозначение</td>\n</tr>\n</tbody>\n</table></div>\n<p>Написание в базе — «Феня»; в чате слово звучит и со строчной («пусть будет феня», «Тогда феня»). Вариантов написания, требующих склейки, у этой вселенной нет.</p>\n<p>Внутри вселенной есть <strong>мир с тем же названием — «Феня»</strong> (<a href=\"MR-0184.html\">Феня</a>, 3 версии, с 2025-12-09). Слово работает и как имя вселенной, и как имя мира внутри неё; как эти два уровня соотносятся, в переписке не разъяснено.</p>\n<h3>Содержимое старше названия</h3>\n<p>Диапазон дат содержимого вселенной — <strong>2024-07-04 — 2026-02-02</strong>, то есть материал датирован почти на полтора года раньше, чем прозвучало имя, что согласуется со словом Славы «Давненько». Раньше объявления датировано:</p>\n<ul>\n<li>история «Защитник» — 21 версия, с 2024-07-04</li>\n<li>способность «Семя» — 2 версии, с 2024-07-21</li>\n<li>служебное «Список 12 апостолов» — 44 версии, с 2025-01-28</li>\n<li>персонаж «Коты» — 5 версий, с 2025-11-17</li>\n<li>персонаж «Бог красок» — 5 версий, с 2025-12-04</li>\n</ul>\n<p>Всего во вселенной числится <strong>39 сущностей</strong>: 1 идея, 3 истории, 6 миров, 19 персонажей, 5 служебных заметок, 5 способностей. Прозы три вещи: «Страх» (обрывок, 2025-12-09), «Фанатик (обычный мир)» (обрывок, 2025-12-14), «Урок (про небеса и критическое мышление)» (целиком, 2026-02-02).</p>\n<h3>Порядок разработки по датам</h3>\n<ul>\n<li><strong>2025-12-09, утро (09:11–10:00, id 394451–394553).</strong> Мир истории «Страх»: средневековье, крепость, аристократов держат в тылу; жанр — фэнтези с магией и другими расами, мир взят готовым. В тот же день история заброшена.</li>\n<li><strong>2025-12-09, день (15:17–15:22, id 394640–394664).</strong> Решение писать исекай; образ бессмертного гг; «Вообще этот образ гг был впихнут во вторую Вселенную».</li>\n<li><strong>2025-12-09, 15:30–15:34 (id 394730–394753).</strong> Перечень вселенных, название «Феня», обоснование через воровской язык торговли.</li>\n<li><strong>2025-12-09, 15:36–15:50 (id 394757–394847).</strong> Устройство Фени: лёгкая вселенная, слабые сверхсилы, сверхлюди — люди, Отец, контракт на «души», боги, правило о душе.</li>\n<li><strong>2025-12-14, 22:10 (id 397758–397759).</strong> Проза «Фанатика»: прежняя жизнь гг и королевство Пиор.</li>\n<li><strong>2025-12-17, 22:36–22:44 (id 399151–399642).</strong> Пришельцы, апостолы, семя, Пастыри, трое злодеев, правительство и его представитель; окно закрывается по времени.</li>\n<li><strong>2026-01-25 — 2026-02-03 (id 423805–426563).</strong> Маски, список из 12 апостолов.</li>\n<li><strong>2026-02-06, 11:21–11:33 (id 429356–429370).</strong> Семь островов: столкновение двух миров, старые и новые острова.</li>\n</ul>\n<h3>Оговорка о привязке материала</h3>\n<p>Почти все записи Фени помечены в базе «вселенная: Феня (<strong>по дате объявления</strong>)» — то есть само имя вселенной в этих сообщениях не звучит, отнесение сделано по дате. Прямо объявлена Феня только в окне w0113, там, где её и назвали. В окне w0114 на прямой вопрос Миколая «а че за мир» / «современный?» (399631, 399633) Слава отвечает: <strong>«Оэм. Современный»</strong> (399634), то есть сам относит апостолов, Пастырей, правительство и трёх злодеев к Оэм. Противоречие в переписке не разрешено.</p>", "r": [["Бессмертный главный герой", "PS-0331.html"], ["Феня", "MR-0184.html"]]}, {"t": "Масштаб", "a": ["S02", "VS-0011-S02", "VS-0011--masshtab"], "h": "<h3>Счёт вселенных</h3>\n<p>Перечень вселенных даётся один раз, Славой, в момент, когда он просит придумать название (394734): «Первая Оам. Ещё есть семь островов И правитель». Названо четыре позиции — Оам, безымянная вторая (станет Феней), семь островов, правитель, — но статус двух последних не разъяснён: «ещё есть семь островов И правитель» читается и как две отдельные заготовки, и как одна. В базе зафиксированы оба чтения: у записи «Семь островов» в варианты имени записано и «7 островов», и «Семь островов и правитель», и стоит помета: «неясно, вселенные это, места внутри Оам или отдельные заготовки».</p>\n<p>Соседние вселенные, названные в том же сообщении:</p>\n<ul>\n<li><strong>Оам</strong> — «Первая Оам» (названа по энергии «Оам» 2025-10-20, id 376249–376250; написание «Оэм» — то же самое).</li>\n<li><strong>семь островов</strong> — названы как отдельная уже существующая вселенная. При этом в составе Фени числится мир «Семь островов» (<a href=\"MR-0186.html\">Семь островов</a>, 2 версии, с 2025-12-09): одно и то же обозначение в один и тот же день выступает и как отдельная вселенная в перечислении Славы, и как мир внутри Фени. Объяснения этому в переписке нет.</li>\n<li><strong>правитель</strong> — назван как отдельная уже существующая вселенная и в материале Фени больше не упоминается ни разу.</li>\n</ul>\n<h3>Как устроено пространство</h3>\n<p>Общей космологии — карты вселенных, слоёв, изнанок, порталов — в материале Фени нет. Есть три разных типа устройства, каждый в своей записи:</p>\n<ol>\n<li><strong>Феня в целом</strong> пространственного описания не имеет вовсе. Она задана не географией, а уровнем силы: «лёгкая вселенная», «сверх силы там слабее» (394757). Сколько в Фене миров, планет или континентов — в переписке не сказано.</li>\n<li><strong>Семь островов</strong> — единственная запись с пространственным устройством: «Оказывается вселенная семь островов это вселенная в которой два мира столкнулись» (429363). Плюс деление островов на старые и новые. Число семь названо, состав островов в материале Фени не перечислен.</li>\n<li><strong>Мир «Страха» и Пиор</strong> — оба средневековые, оба описаны изнутри, через фронт и особняк, а не сверху. Границы этих миров, соседние страны, карта не описаны.</li>\n</ol>\n<p>Отдельный слой — <strong>правило про душу</strong> (394843, 394846, 394847): «Душа всегда принадлежит человека. Её нельзя отнять или купить» — «Даже Бог на такое не способен» — «Что говорить уже о Отце». Это единственное правило, заявленное как действующее на уровне мироустройства, а не отдельной страны.</p>\n<h3>Миры</h3>\n<p>В списке миров Фени шесть записей. Две из них — не про место, а про саму вселенную и её устройство; они проходят по виду «мир», потому что так устроен реестр.</p>\n<p><strong>Феня (<a href=\"MR-0184.html\">Феня</a>, 3 версии, 2025-12-09, id 394730–394753, 394757, 394839).</strong> Запись о самой вселенной: происхождение названия, «лёгкость», противопоставление Оам — всё изложено в разделе «Зарождение». Связи записи: Оам, Образ бессмертного гг, Отец, Сверхлюди Фени.</p>\n<p><strong>Боги во вселенной Феня (<a href=\"MR-0185.html\">Боги во вселенной Феня</a>, 2 версии, 2025-12-09).</strong> Версия 1 (15:40–15:41): Миколай, услышав про Отца, спрашивает «бог?» (394781) и отдельно — «у тебя всегда О с большой буквы?» (394783). Слава: «Не. Боги конечно есть, но они будут появляться изредка. А их отец не Бог» (394784). Фиксируются три вещи: боги в Фене существуют; появляться они будут изредка; Отец к ним не относится. Версия 2 (15:50) задаёт предел божьих возможностей через душу — правило, приведённое выше. Пантеона, имён богов, числа богов в переписке нет.</p>\n<p><strong>Мир истории «Страх» (<a href=\"MR-0183.html\">Мир истории «Страх»</a>, 2 версии, 2025-12-09, id 394451–394459 и 394518–394553).</strong> Миколай по первому черновику определяет сеттинг: «ок, сеттинг, средние века походу» (394451), «и перс не русский» (394452), «крепость» (394455). Слава добавляет социальное правило (394459): «Ну его как аристократа могли отправить в безопасное место. Например в столицу или просто в тылу. Как типо резервный солдаты, который балту пинают», и подтверждает его во второй версии: «Я же сказал что Аристократов если и посылают на войну то в безопасные места» (394518). Жанр (394531, 09:55):</p>\n<div class=\"q\"><p>Сразу сказу- это фэнтези с магией и другими расами. Плюсом недопонимания я хочу там развить.<br>Плюсом из-за тебя я понял, что нужно добавить сценку где будет говориться как он туда так легко попал.<br>Гг не будет владеть магией. Чисто хладнокровием и мечом будет шататься</p></div>\n<p>Происхождение мира Слава называет прямо, отвечая на вопрос «как ты её придумал… ну мир этот» (394545–394546): «Клише из клише фэнтези мир» (394547), «Не придумал просто взял существующий» (394550). На вопрос «зачем» — «Комедия» (394552), «Наверное» (394553).</p>\n<p>Черты мира, вытекающие из текста черновика (394532): война с осадой крепости; фронт под крепостью — «одна из самых опасных мест», «этот фронт славился высокой смертностью»; на него отправляют новобранцев («нам на помощь зелёный щенков послали, что даже не разу не убивали»), причём высокая смертность объясняется в тексте именно тем, что «сюда повышают новобранцев». Сословная структура: дворяне, графы, наследник-первенец, мачеха-новая супруга графа и её дети. Магия в мире есть, у гг её нет. Какие именно «другие расы» — не перечислено ни разу. Названия у мира нет: помета базы — «название мира не даётся».</p>\n<p><strong>Королевство Пиор (<a href=\"MR-0187.html\">Королевство Пиор</a>, 1 версия, 2025-12-14, id 397759).</strong> Один длинный кусок прозы, выложенный Славой в 22:10; отдельного обсуждения устройства мира в переписке нет, всё известное взято из самого текста главы. Название: «Моя черноволосая служанка по моей просьбе рассказала упрощённый вариант истории королевства Пиор». Строй и быт: королевство, внутри него графский дом Бэлут; особняк с длинными коридорами, библиотекой, кухней, залами, садом; интерьер — «Сам интерьер, здесь как и ожидалось был средневековым. Разные узоры, где попало и не экономия пространства. Был только один большой плюс. Невероятная мягкий ковры»; прислуга — служанка, дворецкий. Дата внутри мира названа служанкой: «Сегодняшняя дата 28 июня 1417 год» (397758); гг отмечает, что дата ему ничего не даёт: «Вообще в романах очень редко пишут даты. Потому что авторы сами бояться в них запутаться».</p>\n<p>Ключевое свойство мира: Пиор оказывается миром прочитанной книги. Из рассказа служанки гг понимает:</p>\n<div class=\"q\"><p>Этой информации мне хватило, чтобы понять, что это за мир.<br>Удивительно, нет- это восхитительно. Я лютый грешник попал в тот самый лучик света. В ту б сказку о герой справедливости, что борется со всем злом на свете.</p></div>\n<p>То есть в Пиоре есть герой справедливости, «что борется со всем злом на свете», и гг намерен его увидеть: «Нужно увидеть героя». Сама сказка описана в записи о прежней жизни гг «Фанатика»: «Одна книга о герой справедливости, что побеждает все зло. Легко, просто и предсказуема, но да безумия запало в душу. Мой милый лучик света. Мой герой.» Помета базы: «устройство мира кроме названия и „сказки о герое справедливости“ не раскрыто».</p>\n<p><strong>Семь островов (<a href=\"MR-0186.html\">Семь островов</a>, 2 версии, 2025-12-09 и 2026-02-06).</strong> Единственная запись Фени с двумя окнами и разрывом почти в два месяца; в реестре она числится сразу за двумя вселенными — «7 островов» и «Феня». Версия 1 (2025-12-09, id 394734–394736) — упоминание внутри перечня Славы, помета: «единственное упоминание». Версия 2 (2026-02-06, 11:21–11:33, id 429356–429370): Слава возвращается к теме, потому что скидывает материал в нейросеть — «Не я в Нейра кит скидываю первую вселенную» (429361). Миколай уточняет: «те старые 7 островов?» (429362). Здесь Слава даёт формулировку сути (429363): «Оказывается вселенная семь островов это вселенная в которой два мира столкнулись». Дальше идёт разделение на старые и новые острова: «или новые» (429364, Миколай), «Ну эти» (429365), «А че за новые» (429367, Слава), «ну ты врд пытался вернуть острова как-то» (429368, Миколай). Договорённость (429370): «Ну сначала старое а потом новое».</p>\n<p>Отметить: в этом окне Слава называет Семь островов <strong>первой</strong> вселенной («скидываю первую вселенную»), тогда как 2025-12-09 первой была названа Оам (394734). Как это соотносится, в переписке не проговорено. Помета базы: «подробный разбор мира в этом окне присутствует только в виде машинной сводки (429376–429377), авторский исходник в чат не попал».</p>\n<p><strong>Мир апостолов, современный (<a href=\"MR-0188.html\">Мир апостолов (современный)</a>, 1 версия, 2025-12-17, id 399612–399642).</strong> Самая короткая запись; разговор идёт 22:36–22:44 и обрывается на «сроки ночь». Слава добавляет линию правительства (399612), Миколай спрашивает прямо «а че за мир» (399631), затем сам подсказывает «современный?» (399633), Слава отвечает: «Оэм. Современный» (399634). Состав мира по навигации базы: правительство, апостолы, Бог красок, Серафим. Помета: «название вселенной так и не прозвучало».</p>\n<h3>Как между мирами перемещаются</h3>\n<p><strong>Единственный названный способ — исекай, то есть попадание в чужое тело.</strong> Механики, объясняющей переход, в переписке нет ни в каком виде.</p>\n<p>Решение о жанре принято 2025-12-09 в 15:17–15:20 (id 394640–394659). Слава: «Просто есть образ гг. И этот образ отчасти можно оправдать лишь исекаем» (394645), «Ну и тем что гг долбоеб» (394646), «Вообще обычный исекай» (394657), «То есть исекай в мир фэнтези» (394659). Миколай: «ну исекай можно интересным сделать, просто другой жанр» (394641).</p>\n<p>Само попадание показано только со стороны результата (397758, 2025-12-14): герой стоит у зеркала и рассматривает незнакомое лицо — «„Я попал в другое мир“ Четкая мысль, которое даже не нужно было формировать. Вот только какое?» Он оказывается в теле Диониса Бэлута, 23 года, чёрные волосы с сединой, красные глаза. Причина, механизм, чья это воля, что стало с прежним владельцем тела — не сказано ничего. Отдельно гг заранее отрицает популярный сюжет побега в другой мир: «Я же никогда не мечтал о побеге. Тем более в другой мир.»</p>\n<p>Никаких порталов, разломов, ритуалов, проводников между мирами в материале Фени нет. Столкновение двух миров в Семи островах (429363) — событие устройства вселенной, а не способ перемещения; как именно миры столкнулись, не сказано. Ни одного случая, когда персонаж из одного мира Фени попадает в другой мир Фени, в материале нет.</p>\n<h3>Как миры связаны между собой</h3>\n<p>Связи, названные в переписке или прямо следующие из текста:</p>\n<ol>\n<li><strong>Оам ↔ Феня.</strong> Противопоставлены по силе: Оам «большая как боевик», в ней «все чё-то слишком сильный»; Феня заведена как «лёгкая» именно в противовес (394757). Это единственная явно сформулированная связь между двумя вселенными, и она не сюжетная, а авторская.</li>\n<li><strong>Оам, Феня, Семь островов, правитель — один перечень</strong> (394734). Порядок: Оам первая, Феня вторая.</li>\n<li><strong>Семь островов ↔ Оам/Оэм.</strong> В реестре «Семь островов» отнесены к вселенным «7 островов» и «Феня», а запись «Оэм» — к «7 островов» и «Оам». В самой переписке Фени это пересечение не проговаривается.</li>\n<li><strong>Семь островов — вселенная, в которой столкнулись два мира</strong> (429363). Какие именно два мира — не названо.</li>\n<li><strong>Прежний мир гг «Фанатика» → королевство Пиор.</strong> Связь через исекай: современный обычный мир, где гг работал на нескольких работах и ухаживал за родителями, «превратившимися в разлагающиеся вопящие тела», — и Пиор, куда он попал в тело Диониса Бэлута.</li>\n<li><strong>Книга → мир.</strong> Пиор оказывается тем самым миром из сказки о герое справедливости, которую гг читал в прошлой жизни.</li>\n<li><strong>Современный мир апостолов ↔ Оэм.</strong> Слава на вопрос о мире отвечает «Оэм. Современный» (399634), при том что запись отнесена к Фене.</li>\n<li><strong>Бог красок — общая фигура.</strong> Числится в двух вселенных сразу: Оам и Феня.</li>\n<li><strong>Мир «Страха» и Пиор</strong> между собой в переписке не связаны. Оба средневековые, обе истории заброшены, но общего мира им не назначали.</li>\n</ol>\n<h3>Кто правит</h3>\n<ul>\n<li><strong>Мир истории «Страх»</strong> — идёт война с осадой крепости. Названы дворянство, графы, командование на фронте (человек со шрамами и твёрдыми холодными глазами, встречающий новобранцев). Кто правит страной, кто с кем воюет — не сказано. Проговорено одно правило власти: аристократов, если и посылают на войну, то в безопасные места — в столицу или в тыл, «как типо резервный солдаты, который балту пинают».</li>\n<li><strong>Королевство Пиор</strong> — королевство, но король в тексте не появляется. Реально действующая власть в главе — граф Эдгар Бэлут, глава дома, чьё требование («Граф потребовал, чтобы вы сегодня были на ужине») отменяет распоряжение гг. Кто король Пиора, в переписке не сказано.</li>\n<li><strong>Современный мир апостолов</strong> — есть правительство и его представитель, «челик без способностей». Рядом стоят апостолы, Бог красок и Серафим, но кто из них правит, а кто просто силён, не сказано.</li>\n<li><strong>Семь островов</strong> — в перечне 2025-12-09 сразу после островов идёт «И правитель». Кто это, чем правит, один он или их несколько — в материале Фени не раскрыто ни разу.</li>\n<li><strong>Феня как вселенная</strong> правителя не имеет. Ближайшая фигура власти — Отец: духовный, приёмный отец сверхлюдей, который их обманул. Он не Бог. Боги существуют отдельно и «будут появляться изредка».</li>\n</ul>", "r": [["Семь островов", "MR-0186.html"], ["Феня", "MR-0184.html"], ["Боги во вселенной Феня", "MR-0185.html"], ["Мир истории «Страх»", "MR-0183.html"], ["Королевство Пиор", "MR-0187.html"], ["Мир апостолов (современный)", "MR-0188.html"]]}, {"t": "Организации и сообщества", "a": ["S03", "VS-0011-S03", "VS-0011--organizacii-i-soobschestva"], "h": "<h3>Апостолы</h3>\n<p>Основная группа Фени. К Фене относятся только версии 36–38 сквозной записи «Список 12 апостолов» (сама запись — 44 версии, 2025-01-28 — 2026-06-07, четыре вселенные: 7 островов, Апостол, Оам, Феня). Всё, что сказано про апостолов в других окнах — организация благословенных с агентами, 21 благословенный правителя Рая, насекомые из коконов, мутанты с белыми глазами, вторая по силе раса на земле, проект Нимба, — сказано про другие вселенные и в окна Фени не попадает.</p>\n<p><strong>Число (2025-12-17, id 399540–399562).</strong> Их 21: «Как бы их 21 один и я не всех придумал. И вот из этих какого я не придумал будет моей маленькой жертвой» (399540). На вопрос Миколая «и кстати почему их 21?» (399546) ответа нет: «Не знаю. Все же хоть как-то его прописать надо же» (399547), «Я хуй знает» (399548). Тут же число урезают. Миколай: «мб урезать?» (399552), «12 как по базе?» (399553), поясняя: «ну было ж 12 апостолов у бога» (399557). Слава соглашается: «Ну давай. А то мне в падлу придумывать всех 21» (399560). Миколай добавляет довод: «если че бог любит все че на 3 делится и чем меньше частное тем больше нравится» (399562). Дальше реплики про 12 (апостолы) и про 4 (Пастыри) идут внахлёст (id 399565–399573), и кто из авторов о ком говорит в каждой конкретной реплике, из переписки однозначно не восстанавливается.</p>\n<p><strong>Внутреннее отношение.</strong> Апостолы называют друг друга братьями — это следует из формулировки «не желая чтобы его братья видели, как он умирает» (399522). Иерархии, руководителя, штаба, базы в Фене не заведено.</p>\n<p><strong>Список позиций (2026-01-31, id 426512, окно w0115).</strong> Слава выкладывает нумерованный список на 12 позиций, заполнено 10:</p>\n<ol>\n<li>Имитатор</li>\n<li>Агрегат</li>\n<li>Защитник</li>\n<li>Бессмертный выродок</li>\n<li>Граф</li>\n<li>Вибрация</li>\n<li>Масочник</li>\n<li>Звездачет</li>\n<li>Небесная</li>\n<li>Палач</li>\n<li><em>(пусто)</em></li>\n<li><em>(пусто)</em></li>\n</ol>\n<p>Миколай через два с лишним часа докидывает два слова — «липкий / иссушающий» (426535). На вопрос Славы «Че за липкий» (426554) отвечает через полтора часа: «придумаю позже», «пока как заполнение» (426561–426563). В список они не вписаны.</p>\n<p>Повтор того же списка от 2026-02-09 (id 430399–430400) в базе помечен уже вселенной «7 островов», окно w0116: позиция 7 (Масочник) опустела, 11 и 12 заполнены — Кура и Избранный. К Фене этот повтор по разметке базы не отнесён.</p>\n<p><strong>Именованные апостолы Фени.</strong> Содержательно разработан в окнах Фени только <strong>Защитник</strong> (версия 21 истории «Защитник», id 399513–399528): «Защитник (один из апостолов) должен будет отказаться от человечность ( что плачет в нём и чувствует вину, что не уберёг семью) но что произойдет когда он откажется от человечности» (399521). Последствия отказа не придуманы. <strong>Граф</strong> упомянут в Фене отдельно — как персонаж, на которого нападает апостол-чудовище; с позицией 5 списка эти упоминания в переписке не сведены. <strong>Масочник</strong> с носителем маски из окна w0115 прямо не связан.</p>\n<p><strong>Апостол, ставший чудовищем</strong> (2025-12-17, id 399522–399548) — безымянный, выбран Славой из числа непридуманных как «маленькая жертва». Линия целиком, словами Славы: один из апостолов выжжен пламенем Серафима, выживает, но теряет семя, уходит от апостолов — «точнее сбегает не желая чтобы его братья видели, как он умирает», умирает в домике в лесу, становится «чем-то другими. Чудовищем», нападает на графа, который его нашёл, и пытается его сожрать. Миколай подытоживает: «то есть сразу в сюжете будет монстром» (399545).</p>\n<p><strong>Отношения с другими.</strong> Правительство — союзник по расчёту (см. ниже). Серафим — источник пламени, выжигающего апостола, и один из трёх злодеев. С Пастырями связь не установлена: вопрос Миколая «т появляется новый апостол?» (399539) остался без прямого ответа.</p>\n<h3>Пастыри</h3>\n<p>Единственная организация, целиком созданная внутри Фени (2025-12-17, id 399534–399604).</p>\n<p><strong>Заявка Славы (399534):</strong></p>\n<div class=\"q\"><p>К Богу красок я хотел подставить 4 главных последователя ( как их назвать?) Они будут одарены его благословением и будут чудовищна сильные</p></div>\n<p>Определяющие признаки: четверо, главные последователи, благословение Бога красок, чудовищная сила.</p>\n<p><strong>Имена</strong> даёт Миколай, все четыре сразу и цветовым рядом, одним сообщением дважды (399541, повтор 399591): триколор, радуга, градиент, монохром. Тут же: «и у кого-то способность хромокей» (399542) — «у радуги» (399543).</p>\n<p><strong>Название группы</strong> предлагает Слава: «Пастери» (399587). Миколай подтверждает: «ну го пастыри» (399598), «мь потом по другому» (399599) и поясняет, что имя относится ко всей группе: «ну типа эту шайку, группу в целом» (399601). Название принято как рабочее, с оговоркой, что потом может смениться.</p>\n<p><strong>Число.</strong> Слава настаивает на четырёх: «Три» — «Не сука» — «4 мне нравится больше» — «Все четыре» (399565–399568), обосновывая правом автора: «Я Бог в своё вселенной» (399572).</p>\n<p><strong>Разделение авторства</strong> (399593–399596). Миколай: «я буду прилумывать эти 4 у бога красок». Слава: «Ну по триколор можешь забыть. Её я уже придумал», «Но все остальное твое». То есть Триколор — за Славой, Радуга, Градиент и Монохром — за Миколаем.</p>\n<p><strong>Состав:</strong></p>\n<ul>\n<li><strong>Триколор</strong> — единственная, кого Слава придумал до разговора; пол женский («Её я уже придумал»). К ней Миколай сводит реплику Славы «Вообще одна из них будет управлять огнём. Точка....» (399549); формально в этой реплике сказано «одна из них», без имени.</li>\n<li><strong>Радуга</strong> — за ней закреплён хромакей. Как хромакей работает, в окне не сказано.</li>\n<li><strong>Градиент</strong> — только имя.</li>\n<li><strong>Монохром</strong> — только имя.</li>\n</ul>\n<p>Силы и мотивы четвёрки на конец окна не придуманы — отдельный пункт рабочей памятки Славы.</p>\n<h3>Правительство и его представитель</h3>\n<p>Добавлено в самом конце окна w0114, как дописанный пункт (2025-12-17, id 399612):</p>\n<div class=\"q\"><p>Бля ещё правительства.<br>А точнее челик без способностей, что будет его представителем. И будет пытаться помогать апостолом, считая их сдерживающий силой</p></div>\n<p>Отсюда следует ровно три вещи: правительство существует как сторона мира; его представляет человек без способностей; он помогает апостолам, и мотив помощи назван прямо — он считает их сдерживающей силой. Имени у представителя нет. Никакого названия у правительства нет, устройства нет, других сотрудников нет. Как апостолы относятся к правительству в ответ — не сказано.</p>\n<h3>Коты</h3>\n<p>В Фене от них одна строка, но она стоит в списке задач, поэтому группа числится действующей: «Роль Котов во всей этой фигней» (2025-12-17, id 399583). Разработки в окне нет, кто такие Коты — в нём не объясняется; помета базы: «вероятно линия из более ранних окон».</p>\n<p>Всё содержательное про них лежит в окнах, объявленных как Оам, и в Феню формально не входит: их девять, они сильнейшие, есть в каждую эпоху, «Если один кот умрёт родиться новый и всегда их будет 9. Они вообще никуда не вмешиваться» (2025-11-17, id 385768; повтор 2025-12-06, id 393287); «Коты наверное буду типо духами. Будут чисто из Оэм состоять», «Поэтому запас и понимания Оэм у них больше всех» (2025-12-04, id 392486–392489). Из девяти назван один — Нуар. Уникальные особенности котов Слава дважды просил придумать Миколая, ответа по существу в переписке нет.</p>\n<h3>Семья Бэлут и дом в королевстве Пиор</h3>\n<p>Дворянский дом из истории «Фанатик» (2025-12-14, id 397758–397761). Состав со слов служанки и по сцене ужина:</p>\n<ul>\n<li><strong>Граф Эдгар Бэлут</strong> — отец. Копия главного героя, только «в разы крупней и с более суровым лицом, ну и с барадишкой», красные глаза. Требует присутствия сына на ужине, реагирует на объявленное «духовное рождение» с интересом и слегка улыбается.</li>\n<li><strong>Графиня Виктория Бэлут</strong> — мачеха. Шелковистые зелёные волосы. Требует не звать её графиней за столом; на обращение «мачеха» лицо становится грубее — прежний Дионис звал её мамой, матушкой или матерью.</li>\n<li><strong>Лукас</strong> — младший брат, 10 лет, черноволосый, глаза «ярко зелёными словно нефрит».</li>\n<li><strong>Алиса</strong> — младшая сестра, 7 лет, черноволосая и красноглазая. Дети — от графини Виктории.</li>\n<li><strong>Дионис Бэлут</strong> — старший сын графа, 23 года, чёрные волосы с сединой, красные глаза. Тело, в которое попал герой.</li>\n</ul>\n<p>Прислуга дома: <strong>черноволосая служанка</strong> — безымянная, чёрные волосы и чёрные глаза, отвечает бесстрастно, обращается «господин», воду достаёт из ниоткуда; по ходу главы выясняется, что служит она графине, а не Дионису — она сообщила графу о хорошем настроении сына, не спрашивая, и герой это отмечает. <strong>Главный дворецкий</strong> и несколько его приближённых; правило дома названо прямо: «По правилам на ужине присутствует только члены семьи и главный дворецкий, с несколькими своими приближёнными». Через дворецкого служанка передаёт сообщения графу.</p>\n<p>Никакой другой структуры королевства — двора, армии, орденов, церкви — в «Фанатике» не заведено.</p>\n<h3>Дом Бэнуар и армия в мире истории «Страх»</h3>\n<p>Семья Бенжимена (2025-12-09, id 394477–394513):</p>\n<ul>\n<li><strong>Отец-граф</strong> — ненавидит сына, не скрывает неприязни, отправил его на смерть и, по тексту, уже заказывал его убийство раньше; сдерживают только свидетели.</li>\n<li><strong>Покойная мать</strong> — законная жена графа (на прямой вопрос Миколая «он сын шлюхи или покойной матери?» — «Покойной матери», 394489). Умерла сразу после родов; был ли брак по расчёту, Слава не решал: «Я не знаю я не думал об этом... я посчитал это не важным» (394500).</li>\n<li><strong>Мачеха</strong> — новая супруга графа, именно она воспитывала героя (394509–394510: «Мачеха», «Мать умерла, а отец ненавидел»).</li>\n<li><strong>Дети мачехи</strong> — упомянуты в тексте как возможная причина отправки на фронт.</li>\n<li><strong>Бенжимен Бэнуар</strong> — первенец и «ближайшее на замену отцу дворянина», то есть наследник. Магией владеть не будет: «Чисто хладнокровием и мечом будет шататься» (394531).</li>\n</ul>\n<p>Порядок в армии задан правилом об аристократах (394459, 394518), и против этого правила построена история: героя отправляют «Не куда-то в тыл или в штаб. И даже не на спокойную точку, а на передовую. В одну из самых опасных мест, на передовой. На осаду крепости, где пролилось уже литр крови». Устройство фронта: новобранцев ставят в строй под осаждённой крепостью, командует человек со шрамами, чья мысль про пополнение — «Серьезно, нам на помощь зелёный щенков послали, что даже не разу не убивали»; причина смертности названа механикой снабжения: «Лишь из-за того, что сюда повышают новобранцев, здесь высокая смертность», при общей нехватке людей. История заброшена в тот же день, 2025-12-09.</p>\n<h3>Рабочая памятка Славы (2025-12-17, id 399583, дописан пункт 399612)</h3>\n<p>Список того, что надо придумать; Слава просит закрепить его в чате («Можешь закрепить», 399583; «Поговорим когда ты приедешь?», 399585). Шесть пунктов дословно:</p>\n<ol>\n<li>«Дальше планы Бога красок и дочер»</li>\n<li>«Придумать силы и мотивы 4 последователь»</li>\n<li>«Придумать жизненные цикл апостолов и придумать кто их родитель»</li>\n<li>«Также разобрать некоторые способности»</li>\n<li>«Дать мотивы 3 сильнейшим моего мира»</li>\n<li>«Роль Котов во всей этой фигней»</li>\n</ol>\n<p>Седьмым пунктом через несколько минут дописано правительство и его представитель (399612). Закрепление Миколай сначала сделал только для себя и не переприкрепил (399605–399607). Разговор по всем пунктам отложен до личной встречи; личная встреча в материале дальше не отражена — следующее окно (конец января 2026) начинается с другой темы, со списка 12 апостолов и масок.</p>\n<p>Отдельно, вне списка задач, есть служебная запись «Документ и сайт по вселенным» (2025-12-09 — 2025-12-12, id 394570–396314): Миколай ведёт документ по материалу и делает сайт-визуализацию на codepen, показывает результат и картинки. Содержимое ссылок и картинок в архиве отсутствует.</p>\n<h3>Пришельцы</h3>\n<p>Не организация, а старая совместная линия существ, которую в окне w0114 только перегоняют через нейросети для картинок (2025-12-17, id 399151–399337). Миколай прогоняет тех же пришельцев через две новые нейросети и сравнивает результат. Слава, увидев картинки: «Это типа Бен 10» (399312). Миколай напоминает: «ну помниш давно ещё просил нейронку нарисовать пришельцев» (399319). Оценка старых картинок против новых: «Ну там они выглядели круче что-ли» (399321).</p>\n<p>Слава восстанавливает по памяти описания, которых в запросах к нейросети не было:</p>\n<ul>\n<li><strong>Летающий пришелец</strong>: «Плюсом у летающего. Я говорил на плечах три отверстия с каждой стороны откуда тентакли вылетают с острым концом» (399324). Имени нет.</li>\n<li><strong>Пузырик</strong>: «И это пузырик я говорил выглядит подобно медузи» (399325).</li>\n<li>Часть картинок авторы сами не опознают: «Это я вообще хуй знает кто» (399326).</li>\n</ul>\n<p>Авторство линии проговорено: «ну это было в целом по моим идеям, ты дополнял, но я кидал первые запросы» (Миколай, 399332); Слава: «Ну я тоже помню» (399336). Сколько пришельцев всего, откуда они, как связаны с остальным населением — не сказано; вселенная в окне не названа.</p>", "r": []}, {"t": "Население и классы", "a": ["S04", "VS-0011-S04", "VS-0011--naselenie-i-klassy"], "h": "<h3>Сверхлюди</h3>\n<p>Тот разряд, ради которого вселенная и названа Феней. Их положение задано одной формулой: <strong>их наебали</strong> (394753).</p>\n<ul>\n<li>Они <strong>люди</strong>. Миколай спрашивает: «а они меж собой могут иметь потомство» (394798), «они полу люди или люди мутанты» (394799). Слава отвечает: «Они люди» (394808). То есть не мутанты, не полулюди, не отдельная раса.</li>\n<li>Психика при этом в порядке — Слава оговаривает это, представляя тему: «И ты даже не спросишь кто их наебали. Всех сверхлюдей. У которых психика все еще Окей» (394766).</li>\n<li>Силы у них слабее, чем в Оам, и обычный человек в теории способен победить сверхчеловека (394757).</li>\n<li>Потомство: карточка базы фиксирует в навигации «могут иметь потомство между собой», но в дословном куске между вопросом и ответом идут две реплики Славы подряд — «Да» (394805) и «Нет» (394806), относящиеся к параллельной ветке разговора про религию и отца. Единственный однозначный ответ на блок вопросов Миколая — «Они люди». Прямого «да» про потомство в переписке нет.</li>\n</ul>\n<p>Сколько сверхлюдей, откуда у них силы, как силы устроены — в окне не сказано.</p>\n<h3>Отец</h3>\n<p>Отдельный класс из одного лица, стоящий над сверхлюдьми (2025-12-09, id 394766–394837). Слава сам подводит к фигуре: «И ты даже не спросишь кто их наебали» (394766), затем называет: «Их Отец» (394779).</p>\n<ul>\n<li>Он <strong>не Бог</strong>: «Не. Боги конечно есть, но они будут появляться изредка. А их отец не Бог» (394784).</li>\n<li>Он их <strong>духовный отец и приёмный папа</strong>: на вопрос Миколая про создателя сверхлюдей (394795–394797) Слава отвечает — «Ну духовные отец. Папа приёмный. ( приёмный папа 😂» (394803). Прямого «да, создатель» в переписке нет.</li>\n<li>Собственная природа: «Он вроде как человек, но не человек. Потом скажу при встрече» (394837). Раскрытие сознательно отложено за пределы переписки; в базе это вынесено в неясности — «кто он такой на самом деле — сознательно не раскрыто».</li>\n</ul>\n<p>Никакой организации вокруг Отца в переписке нет.</p>\n<h3>Боги</h3>\n<p>Заявлены двумя репликами. Боги в Фене есть, но «они будут появляться изредка» (394784). Отец к ним не относится. Верхний предел их возможностей задан прямо: душу отнять или купить не может даже Бог (394846). Ни одного бога, культа, церкви или ордена в Фене не названо; сколько богов, как они соотносятся с Отцом и с апостолами — не сказано.</p>\n<h3>Апостолы как разряд</h3>\n<p>Природа названа дважды и оба раза отрицанием: «И кто теперь будет апостолами. Типо они и так не люди. А их него родителя я так и не придумал» (399514); «Апостолы не люди. Их ней цикл жизни я не придумал» (399521). Кто они по природе — в этих окнах не сказано. Родитель и жизненный цикл прямо помечены как непридуманные и вынесены в памятку.</p>\n<p>Источник их силы — <strong>семя</strong>: «он выживает, но теряет семя ( я так и сам не до конца понял, что это за семя. Ну можешь считать это источником их силы и быстрое адаптации)» (399522). Природу семени автор сам не определил.</p>\n<p>Отношение к ним со стороны людей без сил: представитель правительства помогает апостолам, «считая их сдерживающий силой» (399612).</p>\n<h3>Трое злодеев верхнего яруса</h3>\n<p>Расставлены 2025-12-17 (id 399530, 399533): «Ну как бы у нас Бог красок. И дочь. Хотя у Серафима уже понятно цель. Перезапустите человечества», затем итог — «Ну это уже интересно 3 злодея. Двое из которых это иной уровень сил». Кто именно эти двое, не уточнено.</p>\n<ul>\n<li><strong>Серафим</strong> — цель уже известна: «Перезапустите человечества». Ему же принадлежит пламя, которым выжигают апостола (399522). Слава ставит вопрос «Может ли Серафим стать главным злодеем» (399515) и оставляет его открытым. Отдельной записи по Серафиму во вселенной Феня нет — он существует только этими упоминаниями.</li>\n<li><strong>Бог красок</strong> — человек с глазами цвета радуги; описание его силы дано ещё 2025-12-04 под вселенной Оам (id 392466): «Просто человек у которого глаза цвета радуги. И вот ты видел как картина не высохшая течёт. Он может так сделать со всем миром. для него все состоит из красок». Уточнение механики на вопрос Миколая, как плавится объёмное лицо (392673): «Преставился сферу из разных цветов и представь что с одной стороны он растаял во внутрь». В окне w0114 он один из трёх сильнейших злодеев мира; запись числится сразу в двух вселенных — Оам и Феня.</li>\n<li><strong>Дочь Бога красок</strong> — названа рядом с ним. Про неё в Фене не сказано ничего, кроме факта существования и статуса злодея.</li>\n</ul>\n<h3>Люди без способностей</h3>\n<p>Обычные люди без сил — отдельный работающий разряд, а не фон:</p>\n<ul>\n<li>Общий принцип: «в теории даже обычные человек способен победить сверхчеловека» (394757).</li>\n<li><strong>Представитель правительства</strong> — «челик без способностей» (399612), имени нет.</li>\n<li><strong>Носитель маски</strong> — «у этого персонажа нет сверх силы» (423809), и при этом он проникает в охраняемые места и убивает вооружённых. Сила здесь у предмета, а не у человека. По имени носитель не назван.</li>\n</ul>\n<h3>Сословия средневековых историй</h3>\n<p>По дате к Фене отнесены два средневековых мира, и сословная лестница там прописана подробнее, чем силовая иерархия современного мира.</p>\n<p>В <strong>мире истории «Страх»</strong> — «фэнтези с магией и другими расами» (394531), где расы ни разу не перечислены; аристократы, которых на войну если и посылают, то в безопасные места; новобранцы, которых на передовой называют «зелёный щенков»; граф, его первенец-наследник, мачеха и её дети.</p>\n<p>В <strong>королевстве Пиор</strong> — граф и графиня, наследник-первенец, младшие брат и сестра, при них служанка, дворецкий и его приближённые, обязательный общий ужин, на котором граф требует присутствия.</p>\n<p>Связь этих двух средневековых блоков с современным миром апостолов, Бога красок и правительства в переписке не проговорена ни разу.</p>\n<h3>Как классы соотносятся между собой</h3>\n<p>Что сказано прямо:</p>\n<ul>\n<li><strong>Общее правило силы</strong>: в Фене сверхсилы намеренно слабее, чем в Оам, и обычный человек в теории способен победить сверхчеловека (394757). Это единственная общая планка, заданная для всей вселенной.</li>\n<li><strong>Отец — над сверхлюдьми</strong>: он их духовный, приёмный отец, он же их обманул, не выполняя условия контракта (394803, 394817).</li>\n<li><strong>Боги — отдельно, но редко</strong>: они есть, появляются изредка, Отец к ним не относится (394784); при этом даже Бог не может отнять или купить душу (394846).</li>\n<li><strong>Пастыри — под Богом красок</strong>: четыре главных последователя, одарённые его благословением, «чудовищна сильные» (399534).</li>\n<li><strong>Серафим — над апостолами по силе</strong>: его пламя выжигает апостола и лишает того семени (399522).</li>\n<li><strong>Апостолы — сдерживающая сила</strong>, по крайней мере в глазах правительства (399612); при этом они не люди, их 21 (позже 12), и они друг другу братья.</li>\n<li><strong>Коты — верхушка</strong>, но это сказано про Оам; в Фене их роль числится нерешённым вопросом (399583).</li>\n<li><strong>Люди без способностей</strong> — низ лестницы по силе, но с политическим весом.</li>\n</ul>\n<p>Чего в соотношениях нет: как апостолы относятся к сверхлюдям и наебал ли Отец их тоже; как Бог красок и Пастыри соотносятся с апостолами по силе; кто сильнее — Серафим или Бог красок; где в этой картине боги. Всё это в переписке не сказано.</p>", "r": []}, {"t": "Система способностей", "a": ["S05", "VS-0011-S05", "VS-0011--sistema-sposobnostey"], "h": "<h3>Общий принцип: вселенная сделана намеренно «лёгкой»</h3>\n<p>Слава прямо объясняет, зачем силы в Фене устроены слабо (394757): «сверх силы там слабее. И в теории даже обычные человек способен победить сверхчеловека. Из-за легче развивать отношения людей». И повторяет короче (394839): «По сути Вселенная лёгкая я же её придумал для развития персонажей, чтобы не заморачиваться над системы силы».</p>\n<p>То есть отношение к системе сил заявлено самим автором: система намеренно не проработана, слабость сверхлюдей — не ограничение внутри мира, а рабочее решение ради отношений персонажей. Название вселенной завязано на ту же идею обмана носителей силы: «Феня. Идеально описывает всех сверхлюдей. Их наебали» (394753).</p>\n<h3>Контракт на «души» и правило о душе (2025-12-09, id 394812–394847)</h3>\n<p>Механика обмана: Отец заключил со сверхлюдьми контракт и просто не выполняет его условия. На вопрос «а как наебали» (394812) — «Да просто не выполняет условия контракта» (394817). Предмет контракта назван в 394827: <strong>Контракт на «души»</strong>.</p>\n<p>Кавычки — часть механики. На попытку Миколая прочитать это как демонический договор («типа как демоны?», 394829) Слава отвечает «Прочитай снова» (394830) и «Видишь кавычки 😏» (394833). Буквальные души предметом контракта не являются; чем они являются — в переписке не сказано.</p>\n<p>Закрыто это правилом мира (394843, 394846, 394847):</p>\n<div class=\"q\"><p>Душа всегда принадлежит человека. Её нельзя отнять или купить<br>Даже Бог на такое не способен<br>Что говорить уже о Отце</p></div>\n<p>Это единственное правило Фени, сформулированное как абсолютное.</p>\n<h3>Семя: две несведённые версии</h3>\n<p>Способность существует в двух состояниях, разделённых полутора годами и сменой вселенной. В переписке они нигде не связаны между собой.</p>\n<p><strong>Версия 1 — 2024-07-21, id 207712–207748, окно w0048, вселенная в базе помечена как «7 островов».</strong> Слава объявляет термин раньше содержания: «Семя есть» (207717). На вопросы «какое семя» и «что это значит» сначала отвечает односложно («Это»), затем выдаёт схему одним сообщением (207736):</p>\n<div class=\"q\"><p>1: врождённый<br>2: контракт<br>Тип энергии<br>Внутренний ( усиления, трансформация, регенерация и т.п.)<br>Внешний ( вайрбол, лазеры из глаз, ледяный шипы и т.п)<br>Смещенный<br>Особенный( петля, имитация и т.п.)</p></div>\n<p>Пояснения даны отдельными репликами: контракт (207739) — «То бишь та недавних типо сосуд и сила из вне»; врождённый (207743) — «Врождённый орган». То есть происхождение силы бывает двух родов: врождённый — орган в теле носителя; контракт — сосуд и сила извне. Тип энергии — четыре пункта, из которых три снабжены примерами, а «смещенный» назван и не пояснён ничем. Что вся конструкция и есть семя, подтверждено прямо (207747–207748): Миколай — «это типо семя», Слава — «Типо да».</p>\n<p><strong>Версия 2 — 2025-12-17, id 399521–399527, вселенная Феня.</strong> Здесь семя — уже не схема, а объект внутри апостола: «он теряет семя ( я так и сам не до конца понял, что это за семя. Ну можешь считать это источником их силы и быстрое адаптации)» (399522). Формулировка «можешь считать» подана как рабочее допущение, а не как определение: автор оговаривается, что сам не до конца понял, что это. Реакция Миколая на всю версию — одна реплика: «спокойно да может» (399527).</p>\n<p>Как соотносятся классификация 2024 года и семя-орган 2025 года — в переписке не сказано. Есть ли семя у сверхлюдей или только у апостолов — тоже не сказано.</p>\n<h3>Цена: потеря семени (2025-12-17, id 399521–399548)</h3>\n<p>Единственная описанная цена силы в Фене — утрата семени и то, что за ней следует. Постановка вопроса у Славы (399522): «А что произойдет если апостол умрет. Умретли он просто или переродится чем то иным». Общего ответа как правила нет; есть одна проработанная линия, изложенная как «пара идей»: апостола выжигает пламя Серафима, он выживает, но теряет семя, сбегает от братьев, умирает в домике в лесу, становится чудовищем и нападает на нашедшего его графа.</p>\n<p>Рядом стоит вторая линия «цены», не механическая, а сюжетная (399521): Защитник «должен будет отказаться от человечность ( что плачет в нём и чувствует вину, что не уберёг семью)», и вопрос «но что произойдет когда он откажется от человечности» остаётся без ответа.</p>\n<h3>Благословение как способ получить силу</h3>\n<p>Второй названный источник силы в Фене — благословение Бога красок: «Они будут одарены его благословением и будут чудовищна сильные» (399534). То есть механика такая: сильная фигура одаряет благословением четверых последователей, и они становятся чудовищно сильными. Ни условий благословения, ни того, что оно даёт конкретно, ни того, можно ли его отнять, в переписке нет.</p>\n<p>За Радугой закреплён <strong>хромакей</strong> (399542–399543): «и у кого-то способность хромокей» — «у радуги». Механика хромакея в окне не раскрыта: способность названа и закреплена, дальше о ней не говорят. За «одной из них» закреплено управление огнём: «Вообще одна из них будет управлять огнём. Точка....» (399549).</p>\n<h3>Маска (окно w0115, 2026-01-25 — 2026-01-30)</h3>\n<p>Единственная способность Фени, разработанная целиком от постановки задачи до решения. Формат работы Слава называет сам (423805): «Давай вернёмся к тупому шаблону» — он даёт образ, Миколай придумывает способность.</p>\n<p><strong>Постановка задачи (2026-01-25, id 423806–423809):</strong></p>\n<div class=\"q\"><p>Есть маска. Чёрная маска с оранжевыми узорами. Без отверстие.<br>И вот нужна способность<br>Не атакующая<br>Способность чтобы перс с этой маской смог проникнуть в защищённая места. И убить группу вооружённых людей. При этом защищая мирных людей. При этом у этого персонажа нет сверх силы</p></div>\n<p>Требования, названные прямо: не атакующая; носитель без сверхсилы; результат — проникновение в охраняемые места, убийство группы вооружённых людей, защита мирных.</p>\n<p><strong>Расширение (2026-01-27, id 424732):</strong> «Будет шесть масок, с разными цветами и узорами». Миколай позже предлагает раскладку (2026-01-30, id 426076): «го 3 с белым 3 с черным и плюсуем: фиолетовый, оранжевый, зелёный, красный, синий, серый».</p>\n<p><strong>Решение (2026-01-30, id 426075).</strong> Слава формулирует его сам:</p>\n<div class=\"q\"><p>Ну я как бы уже придумал. Люди просто тяжело его заметить в этой маске. А в толпе они инстикттвно будут считать его своим</p></div>\n<p>Миколай сверяет с известным примером (426081): «типа как супермена в очках?», Слава — «Ну типа» (426086). Про то, что решение существовало у Славы до разговора, он говорит отдельно (426077): «А это сюжет в моей голове летал».</p>\n<h3>Отклонённые механики</h3>\n<ol>\n<li><strong>Маска как защитная способность — отклонена</strong> (2026-01-30, id 426067–426071). Миколай перебирает: «защитная?» — «маскирующая» — «хм». Слава отвечает двумя репликами подряд: «Нет» (на защитную) — «Да» (на маскирующую).</li>\n<li><strong>Души как предмет контракта в буквальном смысле — отклонены</strong> (394829–394847). Миколай предлагает демоническую схему: «типа как демоны?», «а как душу забрать?». Слава отвечает «Не как» и вводит правило о душе, отдельно возвращая к тексту: «Прочитай снова» — «Видишь кавычки».</li>\n<li><strong>Сверхлюди как полулюди или мутанты — отклонено</strong> (394799, 394808): «Они люди».</li>\n<li><strong>Отец как Бог — отклонено</strong> (394781–394784): «Не. Боги конечно есть, но они будут появляться изредка. А их отец не Бог».</li>\n<li><strong>Число апостолов 21 — отклонено в пользу 12</strong> (399540–399560). Причина, названная самим Славой: «А то мне в падлу придумывать всех 21». Довод Миколая — «ну было ж 12 апостолов у бога».</li>\n<li><strong>Три Пастыря вместо четырёх — отклонено</strong> (399562–399568): «Три» — «Не сука» — «4 мне нравится больше» — «Все четыре».</li>\n<li><strong>«Липкий» и «иссушающий» как позиции 11 и 12</strong> — не отклонены, но помечены как временные: «придумаю позже», «пока как заполнение» (426561–426563).</li>\n</ol>\n<p>Больше отклонений в материале Фени нет. В частности, ни одна из «пары идей» про смерть апостола не отвергнута: Миколай отвечает «спокойно да может».</p>\n<h3>Оговорка о полноте</h3>\n<p>Разбор способностей Слава сам вынес из чата в личную встречу: пункт памятки «Также разобрать некоторые способности» (399583) и «Поговорим когда ты приедешь?» (399585). Продолжения этого разговора в переписке нет, поэтому целостной системы сил Фени в материале не существует.</p>", "r": []}, {"t": "Кончина", "a": ["S06", "VS-0011-S06", "VS-0011--konchina"], "h": "<p><strong>Кончина вселенной «Феня» в чате не объявлена.</strong> Ни в таблице отрезков, ни в событиях-объявлениях, ни в дословных блоках нет события типа «закрытие» по этой вселенной. Даты кончины, причины и дословной формулировки автора о конце Фени в переписке нет.</p>\n<p>Отрезок жизни закрывается датой 2026-02-06, но объявления о закрытии в материале не приведено — граница поставлена по общему правилу разметки (границы ставятся по объявлению плюс дате, отрезки могут быть несмежными).</p>\n<p>Единственная содержательная смена, о которой говорится, — внутренняя и без даты: «А после она просто стало лёгкая вселенная» (394757), переход от вселенной-под-персонажа к «лёгкой» вселенной.</p>", "r": []}, {"t": "Возвраты", "a": ["S07", "VS-0011-S07", "VS-0011--vozvraty"], "h": "<p><strong>Возвратов по вселенной «Феня» не зафиксировано.</strong> В хронологии по ней одно событие — объявление 2025-12-09; событий типа «смена» и «возврат» нет.</p>\n<p>На дату 2026-02-06, которой обрывается отрезок Фени, в сверочном файле приходится другое событие — возврат Славы к «первой вселенной», старым Семи островам (id 429361, span 429356–429370, окно w0115, «сначала старое а потом новое»). Связи этого возврата с Феней в записи не заявлено.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "VS-0011-S08", "VS-0011--probely"], "h": "<div class=\"gaps\"><p><strong>По самой вселенной.</strong></p>\n<ol>\n<li><strong>Дата появления.</strong> Слава говорит только «Давненько» (394757). Когда она реально возникла и когда впервые прозвучала в чате — не названо; вопрос Миколая «сегодня ты первый раз о ней написал?» (394755) остался без прямого ответа.</li>\n<li><strong>Какой именно «образ гг» породил вселенную</strong> — «я пытался тот образ гг сделать в настоящим» (394757). Что за образ, из какого материала он взят, не сказано. Рядом звучит «Гг бессмертный» (394741), в составе есть персонаж «Бессмертный главный герой», но тождество нигде не заявлено.</li>\n<li><strong>Когда вселенная «стала лёгкой»</strong> — переход датой не сопровождается.</li>\n<li><strong>К чему относится реплика</strong> «Что это за унизительно остановки речь. Она предназначена для подавления воли?» (394746, повтор 394756) — прямо не сказано.</li>\n<li><strong>«Инфинити»</strong> (394747) приведено как пример принципа именования; что это за вселенная или произведение — не сказано.</li>\n<li><strong>Расхождение дат</strong> (содержимое 2024-07-04 — 2026-02-02 против отрезка 2025-12-09 — 2026-02-06) в материале не объяснено.</li>\n<li><strong>Принадлежность материала к Фене шаткая.</strong> Почти все записи помечены «вселенная: Феня (по дате объявления)» — имя вселенной в них не звучит. В организационном окне 2025-12-17 автор на прямой вопрос «а че за мир» отвечает «Оэм. Современный» (399634), то есть сам относит апостолов, Пастырей, правительство и трёх злодеев к Оэм. Противоречие не разрешено.</li>\n</ol>\n<p><strong>По устройству и мирам.</strong></p>\n<ol start=\"8\">\n<li><strong>Сколько всего вселенных</strong> — точного счёта нет; перечень 394734 не разъясняет, «семь островов И правитель» — это две позиции или одна.</li>\n<li><strong>Противоречие в нумерации</strong>: 2025-12-09 первой вселенной названа Оам (394734), 2026-02-06 Слава называет первой вселенной Семь островов (429361).</li>\n<li><strong>«Семь островов» одновременно и отдельная вселенная, и мир внутри Фени</strong>; то же со вселенной «Феня» и миром «Феня». Соотношение не объяснено.</li>\n<li><strong>«И правитель»</strong> — фигура названа и брошена; в материале Фени о ней больше ни слова, как и о вселенной «Правитель».</li>\n<li><strong>Семь островов</strong>: развёрнутый разбор был скинут в нейросеть, авторский исходник в чат не попал — в архиве только машинная сводка (429376–429377). Какие два мира столкнулись, что за «новые» острова и как Слава «пытался их вернуть» — не сказано.</li>\n<li><strong>Мир истории «Страх» названия не получил</strong>; какие в нём «другие расы» — не перечислено ни разу.</li>\n<li><strong>Королевство Пиор</strong>: «устройство мира кроме названия и „сказки о герое справедливости“ не раскрыто». Кто король, что за герой справедливости, где он сейчас — не сказано.</li>\n<li><strong>Механизм исекая полностью отсутствует</strong>: причина попадания, что стало с прежним Дионисом, можно ли вернуться — ни одного слова. Между мирами Фени нет ни одного описанного перехода; порталов, разломов, проводников в материале нет вообще.</li>\n<li><strong>Средневековые блоки не сшиты с остальным.</strong> Пиор с семьёй Бэлут и мир «Страха» с семьёй Бэнуар живут отдельно и ни с апостолами, ни с Пастырями, ни с правительством, ни с Отцом не связаны. Граф, на которого нападает апостол-чудовище, ни с одним из этих графов не отождествлён.</li>\n</ol>\n<p><strong>По населению и силам.</strong></p>\n<ol start=\"17\">\n<li><strong>Как сверхлюди получают силу</strong> — механизм не описан ни разу. Сколько их — не сказано. Связь между сверхлюдьми (окно 2025-12-09) и апостолами (окно 2025-12-17) в переписке не проводится; наебал ли Отец апостолов так же, как сверхлюдей, — не сказано.</li>\n<li><strong>Потомство сверхлюдей</strong>: карточка базы фиксирует «могут иметь потомство», но прямого ответа на вопрос 394798 в дословном тексте нет.</li>\n<li><strong>Кто такой Отец на самом деле</strong> — сознательно не раскрыто: «Он вроде как человек, но не человек. Потом скажу при встрече» (394837). Разговор при встрече в переписку не попал.</li>\n<li><strong>Что является предметом контракта вместо душ</strong> — не сказано, хотя кавычки в «контракт на „души“» подчёркнуто важны. Что именно Отец обещал сверхлюдям и каких условий не выполняет — тоже.</li>\n<li><strong>Боги</strong>: сколько их, кто они, как соотносятся с Отцом и с апостолами — не сказано; только «есть» и «будут появляться изредка».</li>\n<li><strong>Природа апостолов</strong>: сказано только «Апостолы не люди». Родитель не придуман, жизненный цикл не придуман (пункт памятки). Почему их было 21 — «Не знаю», «Я хуй знает» (399547–399548). Урезание до 12 принято, но новый состав в окне не собран: список от 2026-01-31 заполнен на 10 позиций, а его исправленная версия от 2026-02-09 в базе отнесена уже к «7 островам».</li>\n<li><strong>Что происходит со смертью апостола</strong> — вопрос поставлен дословно и оставлен без общего ответа (399522); есть только одна частная линия.</li>\n<li><strong>Что произойдёт с Защитником после отказа от человечности</strong> — поставлено вопросом, ответа нет (399521).</li>\n<li><strong>Природа семени</strong> — «я так и сам не до конца понял, что это за семя» (399522). К чему именно «быстрая адаптация» и как семя её обеспечивает — не раскрыто. Как соотносятся две версии семени (классификация 2024-07-21 и семя-орган 2025-12-17) — связь нигде не проводится, старое не отменяется. Тип энергии «смещенный» назван в списке и не пояснён ни определением, ни примером.</li>\n<li><strong>Пастыри</strong>: силы и мотивы четвёрки не придуманы (пункт памятки). Градиент и Монохром — только имена. Механика хромакея не раскрыта. Управление огнём сказано про «одну из них» (399549), поимённо не закреплено. Связь Пастырей с апостолами не установлена: вопрос «т появляется новый апостол?» (399539) остался без прямого ответа, а обсуждения числа 21→12 и числа 4 идут вперемешку (399565–399573), так что кто из авторов о ком говорит в каждой реплике, восстановить нельзя.</li>\n<li><strong>Бог красок и его дочь</strong>: планы и мотивы не придуманы (пункт памятки). У дочери, кроме факта существования и статуса злодейки, ничего нет.</li>\n<li><strong>Трое сильнейших</strong>: кто те «двое из которых это иной уровень сил» (399533) — не уточнено; мотивы троих вынесены в памятку. Серафим в Фене только упоминается, собственной записи по нему в материале Фени нет.</li>\n<li><strong>Правительство</strong> заведено одной репликой (399612): названия нет, устройства нет, кроме представителя — никого, имени у представителя нет; как апостолы относятся к правительству в ответ — не сказано.</li>\n<li><strong>Коты</strong>: в Фене есть только строка «Роль Котов во всей этой фигней» (399583). Уникальные особенности не придуманы даже в оамских окнах — прямая просьба к соавтору помочь, ответа по существу в переписке нет. Из девяти назван один, Нуар, и то в окнах Оам.</li>\n<li><strong>Носитель шести масок</strong> по имени не назван; связь с «Масочником» из списка апостолов прямо не проговорена; вселенная в окне w0115 не объявлена.</li>\n<li><strong>Пришельцы</strong>: сколько их, откуда, как связаны с остальным населением — не сказано; вселенная в окне не названа; часть картинок авторы сами не опознают («Это я вообще хуй знает кто», 399326).</li>\n<li><strong>Разговор отложен.</strong> По всем шести пунктам памятки Слава пишет «Поговорим когда ты приедешь?» (399585); в следующем окне (конец января 2026) к ним не возвращаются, а личная встреча в переписке не отражена.</li>\n<li><strong>Дословных блоков, кроме окна 394730–394757, по самой вселенной нет</strong> — по остальному периоду отрезка авторская речь в записи вселенной не приведена, только по отдельным сущностям.</li>\n</ol></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["VS-0011--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0331.html\">Бессмертный главный герой</a></li>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0183.html\">Мир истории «Страх»</a>, <a href=\"MR-0184.html\">Феня</a>, <a href=\"MR-0185.html\">Боги во вселенной Феня</a>, <a href=\"MR-0186.html\">Семь островов</a>, <a href=\"MR-0187.html\">Королевство Пиор</a>, <a href=\"MR-0188.html\">Мир апостолов (современный)</a></li>\n<li><strong>Группы:</strong> <a href=\"GR-0057.html\">Коты (девять котов)</a>, <a href=\"GR-0078.html\">Апостолы (Феня; список 12)</a>, <a href=\"GR-0079.html\">Пастыри</a>, <a href=\"GR-0080.html\">Сверхлюди (Феня)</a>, <a href=\"GR-0081.html\">Семья Бэлут</a>, <a href=\"GR-0082.html\">Пришельцы (линия Фени)</a>, <a href=\"GR-0083.html\">Правительство (Феня)</a></li>\n<li><strong>Персонажи:</strong> <a href=\"PS-0307.html\">Коты</a>, <a href=\"PS-0322.html\">Бог красок</a>, <a href=\"PS-0328.html\">Бенжимен Бэнуар</a>, <a href=\"PS-0329.html\">Семья Бенжимена</a>, <a href=\"PS-0330.html\">Отец</a>, <a href=\"PS-0331.html\">Бессмертный главный герой</a>, <a href=\"PS-0332.html\">Дионис Бэлут</a>, <a href=\"PS-0333.html\">Прежняя жизнь гг «Фанатика»</a>, <a href=\"PS-0334.html\">Семья Бэлут</a>, <a href=\"PS-0335.html\">Черноволосая служанка</a>, <a href=\"PS-0336.html\">Апостол, ставший чудовищем</a>, <a href=\"PS-0337.html\">Дочь Бога красок</a>, <a href=\"PS-0338.html\">Пастыри</a>, <a href=\"PS-0339.html\">Триколор</a>, <a href=\"PS-0340.html\">Радуга</a>, <a href=\"PS-0341.html\">Представитель правительства без способностей</a>, <a href=\"PS-0342.html\">Пришельцы</a>, <a href=\"PS-0343.html\">Летающий пришелец</a>, <a href=\"PS-0344.html\">Пузырик</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["VS-0011--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/VS-0011.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["VS-0011-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/VS-0011/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым чинить надо не то, что внутри Фени. Нет статьи о «Списке 12 апостолов» (<code>SL-0054</code>), а на него ссылаются семь статей из четырёх вселенных, и в базе по нему лежит 234 КБ — 44 версии. Это самая дорогая дыра во всей работе, и Феня упирается в неё сильнее прочих: раздел про апостолов здесь наполовину состоит из пересказа этих списков, и апостолы Фени по разметке — всего лишь версии 36–38 той самой записи.</p>\n<p>Вторая по цене — своя: «Список того, что надо придумать по миру» (<code>SL-0129</code>), рабочая памятка Славы. Три ссылки, статьи нет, в базе всего 4 КБ. Через эту памятку в статье держатся сразу пять сюжетных линий — Бог красок с дочерью, силы Пастырей, цикл апостолов, мотивы троих сильнейших, роль Котов.</p>\n<p>Третье — четыре группы, которые в связях статьи прямо помечены как «статьи ещё нет»: Сверхлюди (<code>GR-0080</code>), Семья Бэлут (<code>GR-0081</code>), Пришельцы (<code>GR-0082</code>), Правительство (<code>GR-0083</code>). Сверхлюди тут особенно неприятны: вселенная названа в их честь, а группы, объясняющей, кто они, нет.</p>\n<h3>С чего начать</h3>\n<p>В базу. По <code>SL-0054</code> материала больше, чем по любой другой записи справочника; по <code>SL-0129</code> мало, но он весь в одном сообщении (399583 плюс дописанный 399612), собрать статью можно за один заход. Четыре группы без статей собираются из уже существующих карточек: сверхлюди — из <code>SP-0257</code>, семья Бэлут — из <code>PS-0334</code> и <code>PS-0335</code> (там ~43 КБ на двоих), пришельцы — из <code>PS-0342</code>, <code>PS-0343</code>, <code>PS-0344</code>, правительство — из <code>PS-0341</code>.</p>\n<p>В архив идти надо ровно за одним — за разбором Семи островов. Авторский исходник в чат не попал, в архиве только машинная сводка (429376–429377). Ориентир: 2026-02-06, 11:21–11:33, окна w0115–w0116, вокруг реплики «Не я в Нейра кит скидываю первую вселенную» (429361). Если исходник где-то есть, он лежит вне чата — в том же документе или на codepen, о которых речь в <code>SL-0128</code>, и содержимое ссылок в архиве отсутствует.</p>\n<p>И ещё одно место, куда идти бесполезно: разбор способностей и все шесть пунктов памятки Слава вынес в личную встречу («Поговорим когда ты приедешь?», 399585). Этого в архиве нет и не будет — спрашивать надо у авторов.</p>\n<h3>Как развивалось</h3>\n<p>Материал был раньше названия почти на полтора года (с 2024-07-04), имя дали задним числом 2025-12-09 — и в той же реплике, где объясняют происхождение, назначение вселенной меняется: «А после она просто стало лёгкая вселенная». Дальше восемь дней плотной работы: устройство и Отец 12-09, проза Пиора 12-14, апостолы, Пастыри и правительство 12-17 — и это окно закрывается переносом всего разговора на личную встречу. Через полтора месяца возвращаются, но уже к другому: маска и список апостолов, конец января 2026. К шести пунктам памятки не возвращаются. 2026-02-06 разговор уходит к «первой вселенной», Семи островам, и на этом отрезок Фени обрывается — без объявления о закрытии.</p>\n<p>Отдельно по датам: 2025-12-09 первой вселенной названа Оам, 2026-02-06 первой названы Семь островов.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Про душу правило сформулировано абсолютным и единственным во всей вселенной: «Душа всегда принадлежит человека. Её нельзя отнять или купить» — «Даже Бог на такое не способен» — «Что говорить уже о Отце» (394843–394847). А через восемь дней в соседнем окне у апостола пламенем Серафима выжигают семя — «источник их силы» (399522), — и он его теряет. То есть у сверхлюдей то, что делает их ими, отнять нельзя даже Богу, а у апостолов такое же по месту отнимается одним ударом. Соотнесено это нигде: ни как исключение, ни как разница природы, ни как повод сказать, что семя — не душа.</p>\n<h3>Отклик</h3>\n<p>Зацепило, как название сюда пришло. Оно родилось из подъёбки над именем соавтора, три реплики висело шуткой — и вдруг Слава сам достаёт из него определение: «Феня. Идеально описывает всех сверхлюдей. Их наебали». Целый разряд населения получил свою суть из воровского словечка, которое подвернулось в чате. И рядом второе, такое же: «контракт на „души“» — Миколай читает это как договор с демоном, а ему отвечают «Прочитай снова» и «Видишь кавычки 😏». Кавычки как часть механики — это красиво и это работает, потому что автор сам не говорит, что там вместо душ. Правда, оба хороших места стоят в одном дне, а всё, что после, уехало в разговор, которого в переписке нет.</p></div>", "r": []}];</script>
