<script>const BASE="";const DOCNAME="Бессмертный выродок";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0184-S01", "PS-0184--proishozhdenie"], "h": "<p>Бессмертный выродок — один из благословенных вселенной «Апостол». Впервые назван 2025-01-22 (id 283707) в перечне братьев и сестёр воплощения гнева. До этого, в предыдущем сообщении (id 283706), Слава задаёт само понятие: «Тот кто оторвёт крылья ангелам, переломает кости своим братьям и сёстрам / Братья и сестры это то бишь благословенный одним правителем».</p>\n<p>Перечень братьев и сестёр (id 283707) целиком: «Среди его братьев и сестёр есть владельцы способности изменения агрегатного сотояния, / Та кто может изменять плотность массу и размер объектов и себя / Тот у кого есть способность сжатия / Имитация / Бессмертный выродок / Теневые братья».</p>\n<p>Дальше он устойчиво держится в каталоге благословенных под записью «Бессмертный выродок 🤪».</p>\n<p>2025-02-25 (id 295577–295578) Слава уточняет статус двумя словами подряд: «Апостол», «Бессмертный».</p>", "r": []}, {"t": "Способности", "a": ["S02", "PS-0184-S02", "PS-0184--sposobnosti"], "h": "<p>Единственное названное свойство содержится в самом имени и подтверждено репликой Славы 2025-02-25 (id 295578): «Бессмертный». Механика бессмертия — что именно оно останавливает, есть ли у него условия или предел — в переписке не разобрана. В каталоге у него, в отличие от многих соседей по списку, нет скобочной пометки со способностью: строка состоит только из имени и эмодзи 🤪.</p>", "r": []}, {"t": "Связи с другими", "a": ["S03", "PS-0184-S03", "PS-0184--svyazi-s-drugimi"], "h": "<p>Входит в число братьев и сестёр воплощения гнева — то есть, по определению Славы, благословенных одним правителем. Рядом с ним в том же перечне (2025-01-22, id 283707) стоят владелец способности изменения агрегатного состояния, та, кто может изменять плотность, массу и размер объектов и себя, обладатель способности сжатия, Имитация и Теневые братья.</p>\n<p>О самом воплощении гнева в том же куске сказано: «Принципиальному, прямолинейному и жестокому / Он воплощения гнева / Прототип защитника только молчиливова / Бэтмен с жестокостью и гневом / Тот кто да мозга костей ненавидит междумирцов» (<a href=\"PS-0186.html\">Междумирцы</a>).</p>\n<p>Отношения Бессмертного выродка с воплощением гнева отдельно не описаны — он назван только как один из братьев и сестёр.</p>\n<p>В отыгрыше 2025-02-25 (id 295572–295574) авторы распределяют роли: «Начинай представлять себя как защитник / Ты / А я выродок». Защитника берёт Миколай, Бессмертного выродка — Слава.</p>", "r": [["Междумирцы", "PS-0186.html"]]}, {"t": "Как менялся — состояния по датам", "a": ["S04", "PS-0184-S04", "PS-0184--kak-menyalsya"], "h": "<p><strong>2025-01-22 (id 283706–283710).</strong> Первое упоминание, в списке братьев и сестёр воплощения гнева, без описания. В том же сообщении (id 283708) Слава решает вопрос о благословенных дьяволом: «Вообще благословенный Богом есть общая чёрта виде белых глаз при активаций благословения / И я эти глазами наделил всех тех который должны быть благословений дьяволом, при этом и менять я ничего не хочу потому что мне и так нравится / Поэтому я думаю вообще убрать благословенных дьяволом». Дальше — «Тогда благословенных будет 21» и следом «Ну конечно можно оставить и 42». Решение внутри этого куска не принято.</p>\n<p><strong>2025-01-24, 10:31 (id 284248).</strong> Каталог благословенных: Теневый братья 🌘, Имитатор 🗡 (ветреной 🌬; электро ⚡️; птичка 🔈), Агрегат 🫥 (волк 🐺; экстримал ⏳), Разрушительнитца 💪 (огненная 💥), Палач ☠️, Защитник 🤬 (ангел 👼), Дитя света ✨, Бессмертный выродок 🤪, Хулиган 💎, Вибрация 🫨, Ученица???. Бессмертный выродок стоит восьмым, нумерации в этой редакции ещё нет.</p>\n<p><strong>2025-01-24, 11:12 (id 284278).</strong> Каталог переписан: Теневые братья уходят из отдельной строки в скобку к Дитя света ✨ (Теневые братья 🌘), у Агрегата добавляется страдалец 🔪, у Хулигана — слайм 7️⃣, в списке врагов появляется Эльф 🌬. Бессмертный выродок 🤪 остаётся на месте, без изменений и без скобки.</p>\n<p><strong>2025-02-25 (id 295559).</strong> Расширенный сводный каталог, благословенные пронумерованы, и Бессмертный выродок получает номер: «7.Бессмертный выродок🤪». Список благословенных вырастает до четырнадцати позиций (добавлены Масочник 🎭, Сон ✨, Небесная 🚀, Маэстро 🎼), появляются новые разделы: Одержимый (Гурман), Церковь (Священнослужитель ⚪️, Многоглазый 👁‍🗨), Военный (Зеркальный 🪞, Очкарик), Сторонние силы (Породитель 😈, Провидец 🤡, Серафим (манипуляция сознанием; контроль времент; управлений светом; огонь Божий) 🪽🪽🪽), а также разделы аномалий, оружия и артефактов. Внутри уже существующих строк тоже правки: у Палача появляется (тварь), у Дитя света — (военный 🐺), у Агрегата теневые братья 🌑 возвращаются в скобку. Сам Бессмертный выродок при всех этих перестановках остаётся строкой без пометок.</p>\n<p><strong>2025-02-25, там же (id 295551, 295576–295578).</strong> Заявлен как ближайший кандидат на отдельную историю. Слава: «Ну так концепция у меня пока, что есть, поэтому буду скидывать мини истории апостолов», и позже — «Как рас про него историю писать буду», «Апостол», «Бессмертный». В том же разговоре Слава упоминает: «Благословенный ада / Которых 9».</p>", "r": []}, {"t": "Что с ним стало", "a": ["S05", "PS-0184-S05", "PS-0184--chto-s-nim-stalo"], "h": "<p>На 2025-02-25 он взят Славой для отыгрыша и назначен темой ближайшей мини-истории апостолов. Отыгрыш описан как долгий, по образцу, который Миколай приводит в том же разговоре (id 295564–295571): «она ролеплеела персов», «жила так же как они», «повторяла за ними целый день», «неделю», «представляла себя персонажем», «еще до своей вселенной», «чужих играла». Миколай соглашается на предложенный ему формат: «ну хорошо, буду вживаться эту неделю в роль», «и жить», «ну типа понимать», «а дальше чисто жить».</p>\n<p>Сама история про Бессмертного выродка внутри окна w0077 не написана.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0184-S06", "PS-0184--probely"], "h": "<div class=\"gaps\"><ul>\n<li>История про него, объявленная 2025-02-25, в переписке не написана.</li>\n<li>Механика бессмертия не описана: ни границ, ни условий, ни цены.</li>\n<li>Внешность, возраст, имя (кроме прозвища) не названы.</li>\n<li>Характер не описан вовсе.</li>\n<li>Происхождение прозвища «выродок» не объяснено.</li>\n<li>Соотношение статусов «благословенный» и «апостол» для него не разобрано: оба слова применены, связь между ними не оговорена.</li>\n<li>Название вселенной в окне w0077 не звучит.</li>\n<li>Реплика Миколая на распределение ролей — «тот кого я убил или кто это😳» — остаётся без ответа: убивал ли Защитник Бессмертного выродка, в переписке не сказано.</li>\n<li>Как «Благословенный ада / Которых 9» соотносится со списком благословенных из четырнадцати позиций, не разъяснено.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0184--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0001.html\">Апостолы (организация апостолов, «благословенные Богом»)</a>, <a href=\"GR-0011.html\">Братья и сёстры (благословенные одним правителем)</a>, <a href=\"GR-0013.html\">Благословенные</a></li>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0186.html\">Междумирцы</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0186.html\">Междумирцы</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0001.html\">Апостолы (организация апостолов, «благословенные Богом»)</a>, <a href=\"GR-0011.html\">Братья и сёстры (благословенные одним правителем)</a>, <a href=\"GR-0013.html\">Благословенные</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0184--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-01-22</td>\n<td>283706–283710</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-24</td>\n<td>284248–284250</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2025-02-25</td>\n<td>295551–295584</td>\n<td>w0077</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0184-bessmertnyy-vyrodok.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0184--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0184.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0184-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0184/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дороже всего здесь не механика бессмертия, а соседи по строке. «Ученица», «Дитя света», «Хулиган» стоят с ним в одном каталоге благословенных и упоминаются каждый в 17–18 статьях справочника — а в базе их нет вообще: ни статьи, ни карточки, ни id. «Вибрация» есть только как <code>SP-0278</code> «Вибрация (Волнистый удар)» (ноль ссылок, статьи нет, база 8 294, вселенная «неясно»). Четыре пустых имени в списке, который воспроизводится по всему своду.</p>\n<p>Следом — сам список. <code>SL-0053</code> (шесть ссылок, статьи нет, база 20 313) и <code>SL-0051</code> (шесть ссылок, статьи нет, 9 834), плюс <code>SL-0090</code> и <code>SL-0089</code> (по четыре ссылки, статей нет). Это самые ссылаемые записи всего «Апостола» без статьи, и именно из них собран каталог, в котором он стоит седьмым. Пока реестры не разобраны, любая статья, опирающаяся на состав благословенных, упирается в одно и то же место.</p>\n<h3>С чего начать</h3>\n<p>В базе, материал разъехался по четырём соседним записям.</p>\n<p><code>PS-0213</code> «Выродок» (статья есть, база 3 299, w0078, 2025-02-26, id 295891–295906) — следующий день после распределения ролей; там объяснение, почему для отыгрыша взят именно недоработанный персонаж. <code>SL-0058</code> «Мини-истории апостолов» (одна ссылка, статьи нет, 2 662, w0077) — там же обещание мини-историй и признание про дыру в раскрытии персонажей. <code>PS-0326</code> «Бессмертный апостол» (ноль ссылок, статьи нет, 2 295, Оам, w0112, 2025-12-06) — апостол, у которого «не всё в порядке с мозгами»; тождество с этой записью не проверено, но проверить дешевле, чем искать заново.</p>\n<p>Осторожно с <code>PS-0211</code> «Мальчик из братской могилы (Бессмертный)» (три ссылки, статья есть, база 58 295), <code>IS-0013</code> «Бессмертный» (три ссылки, 44 010) и <code>SP-0194</code> «Всегда активное благословение Бессмертного» (статья есть, 6 462). Материала там много, и соблазн вытащить оттуда механику бессмертия большой — но сначала надо развести имена, иначе в статью приедет чужой персонаж.</p>\n<p>В архив — за одним: «Благословенный ада / Которых 9». w0077, 2025-02-25, диапазон 295551–295584, рядом с разговором о мини-историях.</p>\n<h3>Как развивалось</h3>\n<p>2025-01-22 — назвали строкой в перечне братьев и сестёр, без описания; в том же сообщении поставили под вопрос основание самого перечня (убирать ли благословенных дьяволом, 21 или 42) и решения не приняли. 2025-01-24, 10:31 и 11:12 — каталог переписан дважды за сорок минут, вокруг него правки у половины строк, его строка в обеих редакциях без изменений и без скобки. Потом месяц молчания. 2025-02-25 — вернулись: номер 7, взят на отыгрыш, назначен темой ближайшей мини-истории. История в окне не написана.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для благословения Богом опознавательный признак назван прямо: «общая чёрта виде белых глаз при активаций благословения» — и на этом основании принято решение о благословенных дьяволом. Для братьев и сестёр, введённых в том же куске и определённых как «благословенный одним правителем», такого признака нет: по чему их отличают снаружи, чем благословение одного правителя видно, — не сказано. Правило «у категории есть внешняя метка» сформулировано для одной группы и не проговорено для соседней, заданной через две реплики.</p>\n<h3>Отклик</h3>\n<p>Сильное здесь — то, как персонаж без единой пометки в каталоге оказался первым в очереди на историю. У всех соседей в скобках стоит способность, у него скобка пустая три редакции подряд, и именно его берут на отыгрыш — потому что неполного играть легче, простора больше. Это переворачивает обычную логику: незаполненность работает не как долг, а как ресурс. И реплика «тот кого я убил или кто это😳» на распределении ролей — она честнее любого описания характера: собственный мир уже достаточно велик, чтобы в нём можно было не узнать своего. Дальше неделя жизни в роли, которая никуда не записалась. Жалко, что не записалась.</p></div>", "r": []}];</script>
