<script>const BASE="";const DOCNAME="манипулятор";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0236-S01", "PS-0236--proishozhdenie"], "h": "<p>Материал относится к переписке 2025-03-25 — тому же дню, когда Слава закрыл вселенную «Апостол» (310844: «Пора прощаться», «Это вселенная (апостолов) была хорошая») и объявил желание сделать новую вселенную с нуля («Я просто захотел новую. Чистую», 310923–310924). В плане задания этот отрезок помечен как «вселенная (апостолов) (объявлено 2025-03-25, id 311180)»: id 311180 — сообщение 17:19 того же дня, где Слава пишет «Сука первая что я сделал в голове это перенёс апостолов и уже придумал им логическая объяснения. Даже не до конца придумав мир» (мысленный перенос персонажей и артефактов старой вселенной в ещё не придуманную новую). Сам разбираемый типаж назван раньше в тот же день, в 11:42–11:44 (id 310943–310952) — в разговоре о том, с каких стартовых персонажей начинать новую вселенную. Своего названия эта новая вселенная в переписке не получила: вселенная объявлена 2025-03-25, имени в переписке ей не дали.</p>\n<p>Типаж назван Миколаем сразу после «драчуна со сложными обстоятельствами» (<a href=\"PS-0235.html\">драчун со сложными обстоятельствами</a>): «и какой-то манипулятор» (310945), с оговоркой о неопределённости замысла: «да я хуй его знает» (310946), и допущением: «вселенной можно высосать что-то из них» (310947). Слава уточняет контекст — персонажи задуманы как ключевые, вокруг которых строится вся вселенная: «Ну есть такая задумка начать с ключевых 2-5 персонажей т поверх них развивать вселенную» (310948), и спрашивает, с каких именно персонажей начинать (310949–310951). Миколай отвечает: «манипулятор и драчун» (310952).</p>", "r": [["драчун со сложными обстоятельствами", "PS-0235.html"]]}, {"t": "Характер", "a": ["S02", "PS-0236-S02", "PS-0236--harakter"], "h": "<p>Собственных черт характера манипулятора в переписке не раскрыто — назван только сам типаж по функции («манипулятор»), без описания методов, целей или манеры поведения.</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0236-S03", "PS-0236--sposobnosti"], "h": "<p>В переписке не названы.</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0236-S04", "PS-0236--svyazi-s-drugimi"], "h": "<p>Назван в паре с «драчуном со сложными обстоятельствами» (<a href=\"PS-0235.html\">драчун со сложными обстоятельствами</a>) как второй из стартовых типажей новой вселенной; сочетание этих двух типажей отдельно отмечено как удачное сочетание («но такое сочетание прикольно», 310979). Оба предложены как кандидаты на роль ключевых персонажей, вокруг которых Слава собирался строить новую вселенную. Связан с самой новой безымянной вселенной.</p>", "r": [["драчун со сложными обстоятельствами", "PS-0235.html"]]}, {"t": "Как менялся — состояния по датам", "a": ["S05", "PS-0236-S05", "PS-0236--kak-menyalsya"], "h": "<h3>Версия 1 — 2025-03-25 (id 310943–310952)</h3>\n<p>Типаж впервые назван в паре с драчуном, сразу как один из ключевых стартовых персонажей: «манипулятор и драчун» (310952) — прямой ответ на вопрос Славы, с каких персонажей начинать вселенную.</p>\n<h3>Версия 2 — 2025-03-25, повтор прежней мысли (id 310974–310988)</h3>\n<p>Та же мысль повторена при пересылке Миколаем своих же сообщений: «и какой-то манипулятор» (310982), с подчёркиванием, что сочетание с драчуном «прикольно» (310979). Здесь же обсуждается число стартовых персонажей: Миколай предлагает 2, Слава — 4, потом сходятся на «сейчас лучше с 3» (310968).</p>", "r": []}, {"t": "Что с ним стало", "a": ["S06", "PS-0236-S06", "PS-0236--chto-s-nim-stalo"], "h": "<p>Дальнейшей разработки типажа в окне переписки не появилось.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0236-S07", "PS-0236--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имени персонажу не дано — известен только по функциональному ярлыку «манипулятор».</li>\n<li>Внешность, характер и способности не описаны.</li>\n<li>Не решено, войдёт ли персонаж в итоговый состав из 2, 3 или 4 стартовых персонажей.</li>\n<li>Что именно и как манипулятор «высасывает» из вселенной (310947: «вселенной можно высосать что-то из них») — в переписке не раскрыто.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0236--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0235.html\">драчун со сложными обстоятельствами</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0235.html\">драчун со сложными обстоятельствами</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0236--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-03-25</td>\n<td>310943–310952</td>\n<td>w0085</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-25</td>\n<td>310974–310988</td>\n<td>w0085</td>\n<td>неясно (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0236-manipulyator.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0236--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0236.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
