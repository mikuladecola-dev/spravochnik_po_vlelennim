<script>const BASE="";const DOCNAME="Журналист (бывший)";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0126-S01", "PS-0126--proishozhdenie"], "h": "<p>Материал относится к периоду, объявленному 2024-07-31 (id 214143); собственного названия эта вселенная в переписке не получила — в базе она отмечена как «неясно».</p>\n<p>Журналист (бывший) введён 2024-07-31 в окне w0049 (id 214330–214336) в ходе пересборки состава команды. Слава убирает механика: «Механик минус». Миколай предлагает замену — «бомж», Слава соглашается: «Вместо него да бомж». Сразу после этого Миколай меняет предложение на «журналист бывший», уточняя причину: «чья профессия нахуй не всралась» — то есть профессия журналиста в условиях апокалипсиса никому не нужна. Слава реагирует одобрительно: «Вово». В том же обмене Миколай называет возраст подростка — «ну подростку 13» (id 214336); чуть позже, в id 214338, этот возраст меняется на 17 — в переписке не поясняется почему.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0126-S02", "PS-0126--vneshnost"], "h": "<p>В переписке не сказано.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0126-S03", "PS-0126--harakter"], "h": "<p>Черта, названная Миколаем 2024-07-31: «журналист увлекается животным миром» (id 214344). Слава реагирует репликой «Ты не ахуей» (id 214346, дословно «Ты не ахуел»).</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0126-S04", "PS-0126--sposobnosti"], "h": "<p>В переписке не сказано.</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0126-S05", "PS-0126--svyazi-s-drugimi"], "h": "<p>Часть команды гиг (5 человек). В своей истории связан с Бомж — журналист появляется в разговоре как замена этому варианту роли (id 214331–214333).</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0126-S06", "PS-0126--kak-menyalsya"], "h": "<h3>2024-07-31 (id 214330–214336)</h3>\n<p>Введён вместо механика — сначала в разговоре мелькает вариант «бомж», который тут же заменяется на «журналист бывший, чья профессия нахуй не всралась». Слава одобряет реплику: «Вово».</p>\n<h3>2024-07-31 (id 214342–214346)</h3>\n<p>Закреплена черта характера: «увлекается животным миром».</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0126-S07", "PS-0126--chto-s-nim-stalo"], "h": "<p>Дальнейшая судьба персонажа после закрепления черты «увлекается животным миром» в переписке не прослеживается — осталось нерешённым.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0126-S08", "PS-0126--probely"], "h": "<div class=\"gaps\"><p>Внешность, имя, возраст, способности не названы. Не уточнено, был ли вариант «бомж» окончательно отменён в момент появления журналиста или же оба варианта какое-то время сосуществовали в обсуждении — в сообщении id 214339 (в статье <a href=\"PS-0125.html\">Врач</a>) снова фигурирует «бомжу 34» уже после появления журналиста в разговоре.</p></div>", "r": [["Врач", "PS-0125.html"]]}, {"t": "Связи — всё вместе", "a": ["PS-0126--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0125.html\">Врач</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0125.html\">Врач</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0126--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-31</td>\n<td>214330–214336</td>\n<td>w0049</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-31</td>\n<td>214342–214346</td>\n<td>w0049</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0126-zhurnalist-byvshiy.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0126--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0126.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
