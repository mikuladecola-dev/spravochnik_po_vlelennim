<script>const BASE="";const DOCNAME="Три пары глаз";
const LEAD="";
const CH=[{"t": "Механика", "a": ["S01", "SP-0253-S01", "SP-0253--mehanika"], "h": "<p>Система из трёх типов глаз, предложенная одним блоком (2025-12-04, id 392474–392492). Формулировка задана условно: «Если три пары глаз».</p>\n<p><strong>Первые белые</strong> — глаза апостола. «Способны видеть оэм ну ещё чего-нибудь».</p>\n<p><strong>Глаза черви.</strong> «Зрачки у них будут словно состоять из тысячи маленьких червячков и вечно двигаться вызывая отвращения и страх». То есть эффект здесь двойной: собственно устройство зрачка и реакция смотрящего — отвращение и страх.</p>\n<p><strong>Радужные глаза</strong> — «только для одного челика». Что именно они дают, в переписке не сказано; названо только то, что они единичны.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0253-S02", "SP-0253--ogranicheniya-i-cena"], "h": "<p>Не названы. Единственное ограничение, прямо сформулированное в переписке, — распределение: белые закреплены за апостолами, черви за котами, радужные за одним персонажем.</p>", "r": []}, {"t": "Носители", "a": ["S03", "SP-0253-S03", "SP-0253--nositeli"], "h": "<ul>\n<li>Белые глаза — апостолы.</li>\n<li>Глаза-черви — коты. Про них тут же добавлено: «Коты наверное буду типо духами. Будут чисто из Оэм состоять». И следом: «Поэтому запас и понимания Оэм у них больше всех». Связь между составом кота (целиком из Оэм) и объёмом Оэм/понимания у него названа авторами прямо, через «поэтому».</li>\n<li>Радужные глаза — один персонаж, не названный по имени.</li>\n</ul>", "r": []}, {"t": "Как менялась по версиям", "a": ["S04", "SP-0253-S04", "SP-0253--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 (2025-12-04, id 392474–392492, окно w0112).</strong> Единственное состояние. Все три типа глаз, их носители и природа котов как духов из Оэм появляются в одном заходе. Позже система в этой записи не пересматривалась.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0253-S05", "SP-0253--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Белые глаза апостолов и коты завязаны на Оэм: первые его видят, вторые из него состоят и потому имеют наибольший «запас и понимания Оэм». Радужные глаза в переписке с Оэм никак не связаны — про них сказано только, что они у одного персонажа.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "SP-0253-S06", "SP-0253--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Что именно, кроме Оэм, видят белые глаза апостолов, — не решено; в переписке стоит «ну ещё чего-нибудь».</li>\n<li>Что делают радужные глаза и кому именно они принадлежат — не сказано.</li>\n<li>Почему глаза-черви достались именно котам и связаны ли они с тем, что коты состоят из Оэм, — не сказано.</li>\n<li>Формулировка «три пары глаз» и перечисление трёх типов у трёх разных носителей не согласованы между собой: идёт ли речь о трёх парах у одного существа или о трёх видах глаз во всём мире — в переписке не разъяснено.</li>\n<li>В том же куске переписки рядом упомянут Бог красок («Я не знаю куда его деть. Возможно будет антагонистом», «Как никак сильный и могущественный», «Ну я даже характер его не продумал. Лишь образ»), но его связь с системой глаз не названа — он идёт следующей темой.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0253--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0056.html\">Апостолы (21 апостол; «насекомые»)</a>, <a href=\"GR-0057.html\">Коты (девять котов)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0253--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-12-04</td>\n<td>392474–392492</td>\n<td>w0112</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0253-tri-pary-glaz.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0253--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0253.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
