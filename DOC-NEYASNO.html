ез привязки: единственный образ-зацепка — вурдалак, одной строкой, нигде больше не разворачивается. Хронология на 2022 год вселенных не даёт.</td>\n<td><code>kb/sushnosti/istorii/IS-0002-povsyudu-chelyusti.md</code></td>\n</tr>\n<tr>\n<td><code>IS-0006</code></td>\n<td>История про вора способностей и слизь</td>\n<td>2023-02-22–2023-02-22</td>\n<td>1</td>\n<td>18КБ</td>\n<td>Ключевая запись всего блока: полный текст 34270–34459 прочитан. Сюжет придуман и закрыт за один вечер 2023-02-22, названия у истории нет, вселенная не объявлена (это прямо записано в «Неясностях» карточки), в архиве дальше не прод</td>\n<td><code>kb/sushnosti/istorii/IS-0006-istoriya-pro-vora-sposobnostey-i-sliz.md</code></td>\n</tr>\n<tr>\n<td><code>IS-0010</code></td>\n<td>как сверхчеловек тупо спалился</td>\n<td>2024-02-05–2024-02-05</td>\n<td>3</td>\n<td>6КБ</td>\n<td>Идея зачина для мира сверхлюдей (104383–104391) — тот же безымянный отрезок от объявления 104329. Названия вселенной не прозвучало.</td>\n<td><code>kb/sushnosti/istorii/IS-0010-kak-sverhchelovek-tupo-spalilsya.md</code></td>\n</tr>\n<tr>\n<td><code>IS-0030</code></td>\n<td>Сюжет с подменой ГГ</td>\n<td>2024-12-08–2024-12-08</td>\n<td>1</td>\n<td>5КБ</td>\n<td>Тот же безымянный отрезок 08.12.2024 (ужасы + мифология, объявление 268571): подмена ГГ, убийство друга, монстр в новостях. Опорных терминов ни одной названной вселенной нет, а материал этого дня авторы тут же выбросили.</td>\n<td><code>kb/sushnosti/istorii/IS-0030-syuzhet-s-podmenoy-gg.md</code></td>\n</tr>\n<tr>\n<td><code>IS-0032</code></td>\n<td>Команда (группа наёмников)</td>\n<td>2024-12-23–2024-12-23</td>\n<td>2</td>\n<td>6КБ</td>\n<td>Завязка про группу наёмников, мага ветра-мечника, рыцарей с меткой бога (273203-273322). Классический средневековый фэнтези-каркас безымянного отрезка 2024-12-21 — 2025-01-06. На Иссекай не тянет: Иссекай в базе — это 2026-02/04,</td>\n<td><code>kb/sushnosti/istorii/IS-0032-komanda-gruppa-naemnikov.md</code></td>\n</tr>\n<tr>\n<td><code>IS-0073</code></td>\n<td>Сон про плот и домик с механизмом</td>\n<td>2025-11-18–2025-11-18</td>\n<td>1</td>\n<td>6КБ</td>\n<td>Пересказ того же сна (плот, ракета, домик в море, дед со стеклянными глазами), из которого выросла безымянная вселенная обратных. Названия у неё нет.</td>\n<td><code>kb/sushnosti/istorii/IS-0073-son-pro-plot-i-domik-s-mehanizmom.md</code></td>\n</tr>\n<tr>\n<td><code>IS-0074</code></td>\n<td>Атцыс (белоглазый выродок)</td>\n<td>2025-11-20–2025-11-20</td>\n<td>1</td>\n<td>17КБ</td>\n<td>Отдельный черновик-страшилка (Арсений, дядя Сергей, старик, легенда о болоте и зелёном свете), самая старая из четырёх задумок Славы. Ни персонажей, ни терминов какой-либо вселенной, к обратным не относится; к «вне вселенной» тоже</td>\n<td><code>kb/sushnosti/istorii/IS-0074-atcys-beloglazyy-vyrodok.md</code></td>\n</tr>\n<tr>\n<td><code>IS-0076</code></td>\n<td>Клаустрофобия</td>\n<td>2025-11-21–2025-11-21</td>\n<td>1</td>\n<td>5КБ</td>\n<td>Не «вне вселенной»: содержание сходится с безымянным сеттингом «обратных» из сна (386292–386296, отрезок 2025-11-18 — 2025-12-06). Совпадают сразу три опоры — само название «Клаустрофобия» (Слава: «в этом сне я испытал чувство кла</td>\n<td><code>kb/sushnosti/istorii/IS-0076-klaustrofobiya.md</code></td>\n</tr>\n<tr>\n<td><code>IS-0090</code></td>\n<td>Инцидент с вирусом Нимба</td>\n<td>2026-06-02–2026-06-02</td>\n<td>1</td>\n<td>5КБ</td>\n<td>Инцидент из 487019–487021 в безымянной вселенной 2026-06-02. Нимб фигурирует как организация этой вселенной, а не как вселенная «Нимб» (её отрезок — весна 2025).</td>\n<td><code>kb/sushnosti/istorii/IS-0090-incident-s-virusom-nimba.md</code></td>\n</tr>\n<tr>\n<td><code>IS-0091</code></td>\n<td>Слом Изб</td>\n<td>2026-06-02–2026-06-02</td>\n<td>1</td>\n<td>6КБ</td>\n<td>Арка слома Изб (487062–487081) внутри безымянной вселенной 2026-06-02. Все участники — злодеи, хейтеры, фан-база — местные, опорных терминов названных вселенных нет.</td>\n<td><code>kb/sushnosti/istorii/IS-0091-slom-izb.md</code></td>\n</tr>\n<tr>\n<td><code>IS-0092</code></td>\n<td>Эксперимент Доимы: дыра между мирами</td>\n<td>2026-06-07–2026-06-07</td>\n<td>1</td>\n<td>7КБ</td>\n<td>Эксперимент Доимы разворачивается вокруг столпов героев, Нуара, Изба, Праведника, Графа — то есть состава безымянной вселенной 2026-06-02. Апостолы и Нимб присутствуют как перенесённые элементы, названия вселенной в чате нет.</td>\n<td><code>kb/sushnosti/istorii/IS-0092-eksperiment-doimy-dyra-mezhdu-mirami.md</code></td>\n</tr>\n</tbody>\n</table></div>", "r": []}, {"t": "Проза — 30", "a": ["DOC-NEYASNO--proza-30"], "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>id</th>\n<th>Название</th>\n<th>Даты</th>\n<th>Версий</th>\n<th>Объём</th>\n<th>Почему не привязано</th>\n<th>Исходник</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>PR-0001</code></td>\n<td>Малолетний нигилист</td>\n<td>2022-04-19–2022-04-19</td>\n<td>0</td>\n<td>2КБ</td>\n<td></td>\n<td><code>kb/proza/PR-0001-maloletniy-nigilist.md</code></td>\n</tr>\n<tr>\n<td><code>PR-0002</code></td>\n<td>О, как же красен день в аду (про Уробороса) — версия 1</td>\n<td>2022-04-19–2022-04-19</td>\n<td>0</td>\n<td>1КБ</td>\n<td></td>\n<td><code>kb/proza/PR-0002-o-kak-zhe-krasen-den-v-adu-pro-uroborosa-versiya-1.md</code></td>\n</tr>\n<tr>\n<td><code>PR-0004</code></td>\n<td>Повсюду челюсти</td>\n<td>2022-04-19–2022-04-19</td>\n<td>0</td>\n<td>2КБ</td>\n<td></td>\n<td><code>kb/proza/PR-0004-povsyudu-chelyusti.md</code></td>\n</tr>\n<tr>\n<td><code>PR-0003</code></td>\n<td>О, как же красен день в аду (про Уробороса) — версия 2, пере</td>\n<td>2022-04-20–2022-04-20</td>\n<td>0</td>\n<td>1КБ</td>\n<td></td>\n<td><code>kb/proza/PR-0003-o-kak-zhe-krasen-den-v-adu-pro-uroborosa-versiya-2-peredelan.md</code></td>\n</tr>\n<tr>\n<td><code>PR-0005</code></td>\n<td>Рассказ про садик «Солнышко» (черновик Славы)</td>\n<td>2022-09-24–2022-09-24</td>\n<td>0</td>\n<td>7КБ</td>\n<td></td>\n<td><code>kb/proza/PR-0005-rasskaz-pro-sadik-solnyshko-chernovik-slavy.md 2025-11-21</td>\n<td>0</td>\n<td>4КБ</td>\n<td></td>\n<td><code>kb/proza/PR-0095-klaustrofobiya.md</code></td>\n</tr>\n<tr>\n<td><code>PR-0098</code></td>\n<td>Ложный герой</td>\n<td>2025-11-21–2025-11-21</td>\n<td>0</td>\n<td>5КБ</td>\n<td></td>\n<td><code>kb/proza/PR-0098-lozhnyy-geroy.md</code></td>\n</tr>\n<tr>\n<td><code>PR-0097</code></td>\n<td>Место и ты</td>\n<td>2025-11-21–2025-11-21</td>\n<td>0</td>\n<td>20КБ</td>\n<td></td>\n<td><code>kb/proza/PR-0097-mesto-i-ty.md</code></td>\n</tr>\n<tr>\n<td><code>PR-0099</code></td>\n<td>Улыбка</td>\n<td>2025-11-21–2025-11-21</td>\n<td>0</td>\n<td>15КБ</td>\n<td></td>\n<td><code>kb/proza/PR-0099-ulybka.md</code></td>\n</tr>\n<tr>\n<td><code>PR-0100</code></td>\n<td>Шут в костюме</td>\n<td>2025-11-21–2025-11-21</td>\n<td>0</td>\n<td>7КБ</td>\n<td></td>\n<td><code>kb/proza/PR-0100-shut-v-kostyume.md</code></td>\n</tr>\n<tr>\n<td><code>PR-0101</code></td>\n<td>Шут в костюме</td>\n<td>2025-11-21–2025-11-21</td>\n<td>0</td>\n<td>56КБ</td>\n<td></td>\n<td><code>kb/proza/PR-0101-shut-v-kostyume.md</code></td>\n</tr>\n<tr>\n<td><code>PR-0125</code></td>\n<td>После битвы с Фатикой (Нуар и отряд инквизиторов)</td>\n<td>2026-06-09–2026-06-09</td>\n<td>0</td>\n<td>2КБ</td>\n<td></td>\n<td><code>kb/proza/PR-0125-posle-bitvy-s-fatikoy-nuar-i-otryad-inkvizitorov.md</code></td>\n</tr>\n<tr>\n<td><code>PR-0126</code></td>\n<td>Сцена предательства Заны (чёрный ящик)</td>\n<td>2026-06-17–2026-06-17</td>\n<td>0</td>\n<td>4КБ</td>\n<td></td>\n<td><code>kb/proza/PR-0126-scena-predatelstva-zany-chernyy-yaschik.md</code></td>\n</tr>\n<tr>\n<td><code>PR-0127</code></td>\n<td>Сказка о Короле, Который Боялся Свержения</td>\n<td>2026-07-14–2026-07-14</td>\n<td>0</td>\n<td>6КБ</td>\n<td></td>\n<td><code>kb/proza/PR-0127-skazka-o-korole-kotoryy-boyalsya-sverzheniya.md</code></td>\n</tr>\n</tbody>\n</table></div>", "r": []}, {"t": "Идея — 13", "a": ["DOC-NEYASNO--ideya-13"], "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>id</th>\n<th>Название</th>\n<th>Даты</th>\n<th>Версий</th>\n<th>Объём</th>\n<th>Почему не привязано</th>\n<th>Исходник</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>ID-0007</code></td>\n<td>душа как внутренности тела</td>\n<td>2022-10-21–2022-10-21</td>\n<td>1</td>\n<td>2КБ</td>\n<td>Определение «душа — это внутренности тела» из того же монолога 2022-10-21, подано как «возьми на заметку» и нигде не развивается. Ни вселенной, ни механики какой-либо вселенной; дата вне всех отрезков хронологии.</td>\n<td><code>kb/sushnosti/idei/ID-0007-dusha-kak-vnutrennosti-tela.md</code></td>\n</tr>\n<tr>\n<td><code>ID-0013</code></td>\n<td>Иллюзии, меняющие реальность</td>\n<td>2023-02-22–2023-02-22</td>\n<td>1</td>\n<td>2КБ</td>\n<td>Встречное предложение Славы (34319–34322) в том же вечернем блоке: телекинез / контроль теней / иллюзии, меняющие реальность. Голая идея без мира и без объявленной вселенной, дата 2023-02-22 вне отрезков хронологии.</td>\n<td><code>kb/sushnosti/idei/ID-0013-illyuzii-menyayuschie-realnost.md</code></td>\n</tr>\n<tr>\n<td><code>ID-0017</code></td>\n<td>Мир в голове (заготовка Славы)</td>\n<td>2023-06-13–2023-06-13</td>\n<td>1</td>\n<td>4КБ</td>\n<td>Слава просит «почву для размышления» для создания мира в голове, в ответ — машинный список наводящих вопросов (климат, расы, магия, культура). Мир не назван и не описан, только намерение; дата 2023-06-13 вне всех отрезков.</td>\n<td><code>kb/sushnosti/idei/ID-0017-mir-v-golove-zagotovka-slavy.md</code></td>\n</tr>\n<tr>\n<td><code>ID-0018</code></td>\n<td>Новый сюжет, которого нигде не было</td>\n<td>2023-06-16–2023-06-16</td>\n<td>1</td>\n<td>1КБ</td>\n<td>Четыре сообщения «Хочешь придумать свой новый сюжет, которого нигде не было?» без ответа. Ни жанра, ни персонажей, ни названия — цепляться не за что.</td>\n<td><code>kb/sushnosti/idei/ID-0018-novyy-syuzhet-kotorogo-nigde-ne-bylo.md</code></td>\n</tr>\n<tr>\n<td><code>ID-0023</code></td>\n<td>история про попадание куда-то во сне</td>\n<td>2023-08-19–2023-09-22</td>\n<td>2</td>\n<td>4КБ</td>\n<td>В окне подтверждается только факт существования истории («ты же что-то говорил про попадание куда-то во сне» — «в голове продолжаю») и обещание скинуть «Сюжет». Содержание не раскрыто ни на строчку: ни мира, ни персонажей, ни терм</td>\n<td><code>kb/sushnosti/idei/ID-0023-istoriya-pro-popadanie-kuda-to-vo-sne.md</code></td>\n</tr>\n<tr>\n<td><code>ID-0024</code></td>\n<td>квазар</td>\n<td>2023-09-22–2023-09-22</td>\n<td>1</td>\n<td>3КБ</td>\n<td>Единственное упоминание [51164] «в черные дыры я верю иначе, во что мне ещё свой квазар запускать» посреди бытового спора про учёных, Марс и высадку на Луну. Неотличимо, отсылка ли это к собственному материалу или просто острота,</td>\n<td><code>kb/sushnosti/idei/ID-0024-kvazar.md</code></td>\n</tr>\n<tr>\n<td><code>ID-0035</code></td>\n<td>Корпорация «Суслик»</td>\n<td>2024-02-05–2024-02-05</td>\n<td>2</td>\n<td>5КБ</td>\n<td>Корпорация «Суслик» названа в 104378 внутри того же разговора 2024-02-05, что и MR-0005 — это безымянный отрезок 2024-02-05 — 2024-04-01 (объявление 104329). Имени вселенной в чате не прозвучало.</td>\n<td><code>kb/sushnosti/idei/ID-0035-korporaciya-suslik.md</code></td>\n</tr>\n<tr>\n<td><code>ID-0036</code></td>\n<td>Требование к силам первого поколения</td>\n<td>2024-02-05–2024-02-05</td>\n<td>1</td>\n<td>2КБ</td>\n<td>Требование к силам первого поколения прозвучало в 104351 — внутри безымянного отрезка от объявления 104329 (2024-02-05). Названия вселенной нет ни здесь, ни в отрезке.</td>\n<td><code>kb/sushnosti/idei/ID-0036-trebovanie-k-silam-pervogo-pokoleniya.md</code></td>\n</tr>\n<tr>\n<td><code>ID-0037</code></td>\n<td>Аниме с необъяснимым, которое потом объясняется научно</td>\n<td>2024-02-29–2024-02-29</td>\n<td>1</td>\n<td>4КБ</td>\n<td>2024-02-29, разговор о вере и науке: авторский замысел «сделать в аниме необъяснимое, а потом объяснить научно». Это про вымысел (будущее аниме), поэтому не «вне вселенной», но ни мира, ни персонажей, ни терминов вокруг не появило</td>\n<td><code>kb/sushnosti/idei/ID-0037-anime-s-neobyasnimym-kotoroe-potom-obyasnyaetsya-nauchno.md</code></td>\n</tr>\n<tr>\n<td><code>ID-0108</code></td>\n<td>Месть как тема</td>\n<td>2024-12-08–2024-12-08</td>\n<td>1</td>\n<td>3КБ</td>\n<td>Сообщения 268575–268593 — рассуждение Миколая о мести как приёме («заезжено, зато всем понятна»), это разговор о том, о чём писать, без единой привязки к миру. Идея прозвучала и ни во что не выросла; даже отрезок 2024-12-08 — 2024</td>\n<td><code>kb/sushnosti/idei/ID-0108-mest-kak-tema.md</code></td>\n</tr>\n<tr>\n<td><code>ID-0159</code></td>\n<td>Персонажи из опроса (Артём, Богдан, Данил)</td>\n<td>2025-09-26–2025-09-26</td>\n<td>1</td>\n<td>3КБ</td>\n<td>Заготовки персонажей из ответов случайных прохожих (Артём-невидимка, Богдан-задира, Данил-Спайдермен). Вымысел, но ни к одной вселенной не привязан; в записи прямо: «к какой вселенной это относится и относится ли вообще — не сказа</td>\n<td><code>kb/sushnosti/idei/ID-0159-personazhi-iz-oprosa-artem-bogdan-danil.md</code></td>\n</tr>\n<tr>\n<td><code>ID-0160</code></td>\n<td>Каменный Поротой</td>\n<td>2025-10-02–2025-10-02</td>\n<td>1</td>\n<td>2КБ</td>\n<td>Имя прозвучало один раз в перечне обитателей безымянного несформировавшегося мира; кто это и что умеет — не сказано. Опереться не на что, кроме отрезка, который сам «неясно».</td>\n<td><code>kb/sushnosti/idei/ID-0160-kamennyy-porotoy.md</code></td>\n</tr>\n<tr>\n<td><code>ID-0169</code></td>\n<td>Чёрный цвет как поглотитель света</td>\n<td>2026-06-09–2026-06-09</td>\n<td>1</td>\n<td>2КБ</td>\n<td>Обрывочная мысль М про чёрный цвет (488804-488812), ни к персонажу, ни к миру не привязана, ответа не было. Связь с Нуаром (7 островов) — догадка составителя базы, в переписке не сказана; привязывать по ней нельзя. Дата попадает в</td>\n<td><code>kb/sushnosti/idei/ID-0169-chernyy-cvet-kak-poglotitel-sveta.md</code></td>\n</tr>\n</tbody>\n</table></div>", "r": []}, {"t": "Служебное — 9", "a": ["DOC-NEYASNO--sluzhebnoe-9"], "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>id</th>\n<th>Название</th>\n<th>Даты</th>\n<th>Версий</th>\n<th>Объём</th>\n<th>Почему не привязано</th>\n<th>Исходник</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>SL-0004</code></td>\n<td>Размеры персонажа</td>\n<td>2023-03-16–2023-03-16</td>\n<td>1</td>\n<td>2КБ</td>\n<td>Миколай просит фото из тетради с «размерами» — рост, вес, грудь, имя (36452–36483). Похоже на анкету персонажа, но чей это персонаж и для чего, в окне не сказано; сама тетрадь в архив не попала. Соседняя запись «Коды персонажей» —</td>\n<td><code>kb/sushnosti/zametki/SL-0004-razmery-personazha.md</code></td>\n</tr>\n<tr>\n<td><code>SL-0081</code></td>\n<td>начать с 2-5 ключевых персонажей</td>\n<td>2025-03-25–2025-03-25</td>\n<td>1</td>\n<td>2КБ</td>\n<td>Рабочий метод сборки той же безымянной «чистой» вселенной 2025-03-25 (310944-310974): сперва 2-5 ключевых персонажей. Содержания вселенной ещё нет, имени нет.</td>\n<td><code>kb/sushnosti/zametki/SL-0081-nachat-s-2-5-klyuchevyh-personazhey.md</code></td>\n</tr>\n<tr>\n<td><code>SL-0083</code></td>\n<td>Приём: просить у нейросети вопросы, а не идеи</td>\n<td>2025-03-25–2025-03-25</td>\n<td>1</td>\n<td>3КБ</td>\n<td>Приём с вопросами к нейросети (311127–311145) прямо заявлен для разгона «новой чистой вселенной» — той самой, что объявлена 310923 и в чате имени не получила (отрезок 2025-03-25 — 2025-03-26 в хронологии тоже «неясно»). В «вне все</td>\n<td><code>kb/sushnosti/zametki/SL-0083-priem-prosit-u-neyroseti-voprosy-a-ne-idei.md</code></td>\n</tr>\n<tr>\n<td><code>SL-0106</code></td>\n<td>Список рас вселенной</td>\n<td>2025-09-18–2025-09-18</td>\n<td>1</td>\n<td>2КБ</td>\n<td>Инвентаризация рас (Поротой, Азуриэль, Апостолы, Одержимые, монстры) для безымянной пересборки «Разрушаем вселенную» (отрезок 2025-09-17–2025-10-20); в самой записи стоит «часть чего: новая вселенная (безымянная)». Апостолы здесь</td>\n<td><code>kb/sushnosti/zametki/SL-0106-spisok-ras-vselennoy.md</code></td>\n</tr>\n<tr>\n<td><code>SL-0143</code></td>\n<td>Разбор: почему вселенные скатываются</td>\n<td>2026-04-19–2026-04-19</td>\n<td>1</td>\n<td>5КБ</td>\n<td>Авторская мета-заметка [462201–462204] о закономерности сразу по нескольким вселенным (семь островов, благословенная, Оэм) и о решении отложить Оэм. Ни одной вселенной не принадлежит: она про них все и про переход к новой безымянн</td>\n<td><code>kb/sushnosti/zametki/SL-0143-razbor-pochemu-vselennye-skatyvayutsya.md</code></td>\n</tr>\n<tr>\n<td><code>SL-0144</code></td>\n<td>Принцип: имбалансные персонажи должны появляться редко</td>\n<td>2026-04-19–2026-06-02</td>\n<td>2</td>\n<td>5КБ</td>\n<td>Спор о принципе построения персонажей [462246–462279] с примерами из разных вселенных сразу («В апостолах он должен был обучать нового апостола… В Оэм он просто политический важный перс»), версия 2 применена уже к Изб в новой безы</td>\n<td><code>kb/sushnosti/zametki/SL-0144-princip-imbalansnye-personazhi-dolzhny-poyavlyatsya-redko.md</code></td>\n</tr>\n<tr>\n<td><code>SL-0145</code></td>\n<td>Расклад сил вселенной героев и злодеев</td>\n<td>2026-06-02–2026-06-02</td>\n<td>1</td>\n<td>2КБ</td>\n<td>Рабочий пересчёт состава (487004–487008) для вселенной, объявленной 486999. Она прямо помечена в хронологии и в самой карточке MR-0193 как безымянная; «12 апостолов» и «Нимб» тут элементы расклада, а не имя вселенной.</td>\n<td><code>kb/sushnosti/zametki/SL-0145-rasklad-sil-vselennoy-geroev-i-zlodeev.md</code></td>\n</tr>\n<tr>\n<td><code>SL-0146</code></td>\n<td>Перенос всех персонажей в новый мир</td>\n<td>2026-06-17–2026-06-17</td>\n<td>2</td>\n<td>3КБ</td>\n<td>Заметка о переносе всех прежних персонажей «под правила нового мира» (491166, 491171-491173). Новый мир прямо назван новым, но не поименован — в самом файле это отмечено в «Неясностях». Ровно тот случай, когда привязка невозможна.</td>\n<td><code>kb/sushnosti/zametki/SL-0146-perenos-vseh-personazhey-v-novyy-mir.md</code></td>\n</tr>\n<tr>\n<td><code>SL-0147</code></td>\n<td>Религия</td>\n<td>2026-07-25–2026-07-26</td>\n<td>2</td>\n<td>5КБ</td>\n<td>Заметка про религию (510950, 511428-511463). Тема начинается как авторская рефлексия о своём материале («у меня религия превратился в отрицательную персону») и уходит в личные взгляды обоих — то есть это не отдельная реальная пере</td>\n<td><code>kb/sushnosti/zametki/SL-0147-religiya.md</code></td>\n</tr>\n</tbody>\n</table></div>", "r": []}];</script>
