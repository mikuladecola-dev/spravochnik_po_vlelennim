<script>const BASE="";const DOCNAME="Неясно — что не привязано ни к одной вселенной";
const LEAD="<p>Всего: <strong>248</strong> записей. Это авторский вымысел, у которого в переписке не нашлось привязки к названной вселенной. Разбор уже прогонялся: агенты читали материал и раскидывали по вселенным там, где основание было в тексте. Здесь — то, что осталось честно неразобранным.</p>\n<p>Колонка «почему» — вывод разбора. Где её нет, запись в разбор не попадала (например, потому что была заведена позже).</p>";
const CH=[{"t": "Персонаж — 66", "a": ["DOC-NEYASNO--personazh-66"], "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>id</th>\n<th>Название</th>\n<th>Даты</th>\n<th>Версий</th>\n<th>Объём</th>\n<th>Почему не привязано</th>\n<th>Исходник</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>PS-0001</code></td>\n<td>Уроборос</td>\n<td>2022-04-19–2023-07-25</td>\n<td>3</td>\n<td>7КБ</td>\n<td>Стихотворение Миколая про девять этажей ада (2022-04-19 и повтор 2023-07-25) — целиком до старта любой вселенной по хронологии (первая — Падения небей с 2023-12-26). В самом файле трижды помечено «вселенная не объявлена», опорных</td>\n<td><code>kb/sushnosti/personazhi/PS-0001-uroboros.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0006</code></td>\n<td>ГГ — всезнающий бог</td>\n<td>2023-01-07–2023-01-07</td>\n<td>1</td>\n<td>2КБ</td>\n<td>Одна строка «Гг стал всезнающим богом» внутри того же разговора 2023-01-07 про будущую безымянную вселенную-повседневность. Ни имени, ни деталей, ни продолжения; дата раньше первого отрезка хронологии.</td>\n<td><code>kb/sushnosti/personazhi/PS-0006-gg-vseznayuschiy-bog.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0007</code></td>\n<td>Главный злодей (слизевик)</td>\n<td>2023-02-22–2023-02-22</td>\n<td>7</td>\n<td>12КБ</td>\n<td>Дата 2023-02-22 лежит вне всех отрезков хронологии (первый начинается 2023-12-26). Весь блок 34270–34459 — история, придуманная за один вечер и больше нигде не всплывающая (все версии в одном окне w0010). Ни одного опорного термин</td>\n<td><code>kb/sushnosti/personazhi/PS-0007-glavnyy-zlodey-slizevik.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0008</code></td>\n<td>Главный герой (вор способностей)</td>\n<td>2023-02-22–2023-02-22</td>\n<td>5</td>\n<td>10КБ</td>\n<td>Тот же вечер 2023-02-22, окно w0010, вне любых отрезков хронологии. ГГ-старшеклассник, крадущий способности ценой лет жизни, ребёнок-наследник, эпоха «2 половина XX или начало XXI» — сеттинг ни к одной из названных вселенных не пр</td>\n<td><code>kb/sushnosti/personazhi/PS-0008-glavnyy-geroy-vor-sposobnostey.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0009</code></td>\n<td>Сын главного героя</td>\n<td>2023-02-22–2023-02-22</td>\n<td>3</td>\n<td>5КБ</td>\n<td>Сын/наследник ГГ из блока 2023-02-22 (34364–34425). Существует только внутри этой одновечерней истории, вселенная не объявлена, дата вне отрезков.</td>\n<td><code>kb/sushnosti/personazhi/PS-0009-syn-glavnogo-geroya.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0010</code></td>\n<td>Сестра главного героя</td>\n<td>2023-02-22–2023-02-22</td>\n<td>2</td>\n<td>3КБ</td>\n<td>Сестра ГГ, мать ребёнка, убита злодеем (34420–34433), 2023-02-22. Та же безымянная история, вселенной в чате нет, дата вне отрезков хронологии.</td>\n<td><code>kb/sushnosti/personazhi/PS-0010-sestra-glavnogo-geroya.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0012</code></td>\n<td>Напарники Демона</td>\n<td>2023-03-27–2023-03-27</td>\n<td>1</td>\n<td>2КБ</td>\n<td>Заготовка «у Демона будут напарники», 27.03.2023, ни одного напарника не описали. Дата вне отрезков, персонажей с твёрдой пропиской в записи нет — только Демон, который в базе числится и за Нимбом, и (как маска) за 7 островами.</td>\n<td><code>kb/sushnosti/personazhi/PS-0012-naparniki-demona.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0020</code></td>\n<td>Перерождённые герои (иссекай-типаж)</td>\n<td>2023-06-13–2023-06-13</td>\n<td>2</td>\n<td>4КБ</td>\n<td>13.06.2023, разговор о типаже «маленьких скромных мальчиков» и о том, что «они обычно иссекаятся»: возраст до/после перерождения, память прошлой жизни, магия, фамильяры. Слово «иссекай» здесь — жанровый троп чужих аниме/ранобэ, а</td>\n<td><code>kb/sushnosti/personazhi/PS-0020-pererozhdennye-geroi-issekay-tipazh.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0023</code></td>\n<td>команда по спасению земли от пришельцев</td>\n<td>2023-12-05–2023-12-07</td>\n<td>3</td>\n<td>3КБ</td>\n<td>2023-12-05–07 — раньше первого отрезка хронологии (Падения небес с 2023-12-26), ни в один отрезок не попадает. В материале только подпись к картинке «Лучшая команда», спасение земли от пришельцев и разбор ролей; ни имени вселенной</td>\n<td><code>kb/sushnosti/personazhi/PS-0023-komanda-po-spaseniyu-zemli-ot-prishelcev.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0022</code></td>\n<td>Персонаж с иконками способностей</td>\n<td>2023-12-14–2023-12-14</td>\n<td>1</td>\n<td>2КБ</td>\n<td>2023-12-14 — вне отрезков хронологии. Персонаж описан за пределами окна (ссылка на 37532), здесь только нейросетевая визуализация и четыре силы (контроль грешниками, ускорение, контроль тела, душа грешника). Тот же исходник 37532</td>\n<td><code>kb/sushnosti/personazhi/PS-0022-personazh-s-ikonkami-sposobnostey.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0029</code></td>\n<td>пацан со сверхспособностью (клонирование)</td>\n<td>2024-02-05–2024-02-05</td>\n<td>1</td>\n<td>4КБ</td>\n<td>Безымянный ребёнок из зачина 104383–104392 — материал безымянного отрезка от 104329. Вселенная в чате не названа.</td>\n<td><code>kb/sushnosti/personazhi/PS-0029-pacan-so-sverhsposobnostyu-klonirovanie.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0030</code></td>\n<td>областной чиновник-толстосум</td>\n<td>2024-02-05–2024-02-05</td>\n<td>1</td>\n<td>4КБ</td>\n<td>Антагонист того же зачина 104383–104392 внутри безымянного отрезка 2024-02-05 — 2024-04-01. Ни имени вселенной, ни её терминов.</td>\n<td><code>kb/sushnosti/personazhi/PS-0030-oblastnoy-chinovnik-tolstosum.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0032</code></td>\n<td>Человек с абсолютным нулём</td>\n<td>2024-03-12–2024-03-12</td>\n<td>1</td>\n<td>2КБ</td>\n<td>2024-03-12, перечень 138203 рядом с Законом. Сам Закон (PS-0031) позже уходит в «игра бога» (2024-04-02) и «7 островов» (2024-07-09), но версия от 2024-03-12 и в его карточке помечена как неясно — отрезок безымянный. Абсолютный но</td>\n<td><code>kb/sushnosti/personazhi/PS-0032-chelovek-s-absolyutnym-nulem.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0033</code></td>\n<td>Феникс</td>\n<td>2024-03-12–2024-03-12</td>\n<td>1</td>\n<td>1КБ</td>\n<td>Феникс из того же перечня 138203 от 2024-03-12 — одна строка описания (полубессмертие, огневая мощь), безымянный отрезок 2024-02-05 — 2024-04-01. В названных вселенных дальше не появляется.</td>\n<td><code>kb/sushnosti/personazhi/PS-0033-feniks.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0034</code></td>\n<td>Человек, манипулирующий объектами</td>\n<td>2024-03-12–2024-03-12</td>\n<td>1</td>\n<td>1КБ</td>\n<td>Третий из перечня 138203 от 2024-03-12, названо и не развёрнуто. Отрезок без имени, продолжения в названных вселенных нет.</td>\n<td><code>kb/sushnosti/personazhi/PS-0034-chelovek-manipuliruyuschiy-obektami.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0035</code></td>\n<td>Человек со способностью отмотки времени</td>\n<td>2024-03-29–2024-03-29</td>\n<td>1</td>\n<td>4КБ</td>\n<td>2024-03-29 [149905], безымянный отрезок 2024-02-05 — 2024-04-01. Персонаж без имени, определён только через петлю времени; Миколай отвечает «Фига/Жёстко» и разговор уходит в рисование. Похожая петля 2024-04-02 брошена в «игру бога</td>\n<td><code>kb/sushnosti/personazhi/PS-0035-chelovek-so-sposobnostyu-otmotki-vremeni.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0122</code></td>\n<td>ГГ-шизофреник</td>\n<td>2024-07-31–2024-08-03</td>\n<td>5</td>\n<td>17КБ</td>\n<td>2024-07-31–08-03 — отрезок 2024-07-31 — 2024-08-08 (объявление 213578 «И снова апокалипсис», 214143), у которого названия в чате нет. ГГ-шизофреник объявлен прямо в этом объявлении. До «монстров» (с 2024-08-08, книга монстров) мат</td>\n<td><code>kb/sushnosti/personazhi/PS-0122-gg-shizofrenik.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0123</code></td>\n<td>Команда гиг (5 человек)</td>\n<td>2024-07-31–2024-07-31</td>\n<td>4</td>\n<td>8КБ</td>\n<td>Сообщения 214288–214390 прямо описывают «новую вселенную» безымянного постапокалипсиса из отрезка 2024-07-31 — 2024-08-08: пятеро обычных людей без суперсил, роли и возраста. Никаких опорных терминов (кильки, апостолов, островов,</td>\n<td><code>kb/sushnosti/personazhi/PS-0123-komanda-gig-5-chelovek.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0124</code></td>\n<td>Военный</td>\n<td>2024-07-31–2024-07-31</td>\n<td>3</td>\n<td>5КБ</td>\n<td>Часть той же пятёрки из окна w0049 (31.07.2024). Военный 37 лет с ПТСР — бытовая постапокалиптическая роль, ни одного термина названной вселенной. Дата попадает в безымянный отрезок «И снова апокалипсис».</td>\n<td><code>kb/sushnosti/personazhi/PS-0124-voennyy.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0125</code></td>\n<td>Врач</td>\n<td>2024-07-31–2024-07-31</td>\n<td>2</td>\n<td>2КБ</td>\n<td>Врач 45 лет из той же безымянной пятёрки w0049. Содержание чисто бытовое (смотрит криминальные истории), зацепок на вселенную нет; отрезок 2024-07-31 — 2024-08-08 сам «неясно».</td>\n<td><code>kb/sushnosti/personazhi/PS-0125-vrach.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0126</code></td>\n<td>Журналист (бывший)</td>\n<td>2024-07-31–2024-07-31</td>\n<td>2</td>\n<td>2КБ</td>\n<td>Бывший журналист из той же пятёрки w0049. Единственная привязка — «профессия в апокалипсисе никому не всралась», то есть безымянный постапокалипсис отрезка 2024-07-31 — 2024-08-08, который в хронологии и есть «неясно».</td>\n<td><code>kb/sushnosti/personazhi/PS-0126-zhurnalist-byvshiy.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0127</code></td>\n<td>Подросток</td>\n<td>2024-07-31–2024-07-31</td>\n<td>1</td>\n<td>2КБ</td>\n<td>Подросток (13 → 17) из той же пятёрки w0049, сообщения 214336–214338. Никаких терминов вселенной; отрезок безымянный.</td>\n<td><code>kb/sushnosti/personazhi/PS-0127-podrostok.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0128</code></td>\n<td>Бомж</td>\n<td>2024-07-31–2024-07-31</td>\n<td>2</td>\n<td>4КБ</td>\n<td>Роль-заглушка внутри перебора состава пятёрки w0049 (214331–214332, 214383–214384). Материал — только про замены ролей, содержательных признаков вселенной нет.</td>\n<td><code>kb/sushnosti/personazhi/PS-0128-bomzh.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0129</code></td>\n<td>Дерзкий друг гг</td>\n<td>2024-07-31–2024-07-31</td>\n<td>2</td>\n<td>4КБ</td>\n<td>Замена бомжа в пятёрке w0049 (214383–214390): друг по чувству вины. Ни персонажей, ни механик названных вселенных; отрезок 2024-07-31 — 2024-08-08 сам «неясно».</td>\n<td><code>kb/sushnosti/personazhi/PS-0129-derzkiy-drug-gg.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0173</code></td>\n<td>Ветреные человечки</td>\n<td>2024-12-21–2024-12-21</td>\n<td>1</td>\n<td>1КБ</td>\n<td>Как и зимние человечки, вспомянуты одной строкой как уже существующая раса («который твой горы») и внесены в список рас безымянного средневекового мира (w0067). Прежняя привязка в окне отсутствует, текущий отрезок сам «неясно».</td>\n<td><code>kb/sushnosti/personazhi/PS-0173-vetrenye-chelovechki.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0174</code></td>\n<td>Маг ветра</td>\n<td>2024-12-23–2024-12-25</td>\n<td>5</td>\n<td>8КБ</td>\n<td>Персонаж Славы — безымянный мечник и маг ветра из команды наёмников безымянного средневекового мира (w0068). Ни он, ни его окружение не встречаются в названных вселенных; отрезок «неясно».</td>\n<td><code>kb/sushnosti/personazhi/PS-0174-mag-vetra.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0175</code></td>\n<td>Учитель мага ветра</td>\n<td>2024-12-23–2024-12-23</td>\n<td>2</td>\n<td>2КБ</td>\n<td>Наставник мага ветра, источник заданий, «посылает на лысую гору» — фигура безымянного средневекового мира (w0068). Имени нет, отрезок «неясно».</td>\n<td><code>kb/sushnosti/personazhi/PS-0175-uchitel-maga-vetra.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0176</code></td>\n<td>Тёмный эльф</td>\n<td>2024-12-23–2024-12-25</td>\n<td>7</td>\n<td>22КБ</td>\n<td>Персонаж Миколая — тёмный эльф 207 лет, цель стать королём; вся карточка и её разгром Славой идут в w0068 внутри безымянного средневекового мира. Слово «благословение» в критике — термин местной системы магии. Не путать с Алто (PS</td>\n<td><code>kb/sushnosti/personazhi/PS-0176-temnyy-elf.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0235</code></td>\n<td>драчун со сложными обстоятельствами</td>\n<td>2025-03-25–2025-03-25</td>\n<td>2</td>\n<td>4КБ</td>\n<td>Стартовый типаж для безымянной «чистой» вселенной 2025-03-25 (310940-310988). В файле помечено: имени нет, дальше типажа не ушло.</td>\n<td><code>kb/sushnosti/personazhi/PS-0235-drachun-so-slozhnymi-obstoyatelstvami.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0236</code></td>\n<td>манипулятор</td>\n<td>2025-03-25–2025-03-25</td>\n<td>2</td>\n<td>3КБ</td>\n<td>Второй стартовый типаж той же безымянной «чистой» вселенной 2025-03-25 (310943-310952); ни имени, ни разработки.</td>\n<td><code>kb/sushnosti/personazhi/PS-0236-manipulyator.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0245</code></td>\n<td>Ангелы (как биологический вид)</td>\n<td>2025-03-30–2025-03-30</td>\n<td>2</td>\n<td>5КБ</td>\n<td>Разговор 314452–314512 про срок жизни ангелов — заготовка к тому же безымянному миру на основе Ома, где Слава прямо отделяет его от Кильки (314481–314483). Названия вселенной нет, содержательных маркеров ни одной из названных всел</td>\n<td><code>kb/sushnosti/personazhi/PS-0245-angely-kak-biologicheskiy-vid.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0254</code></td>\n<td>Гриша</td>\n<td>2025-04-01–2025-04-01</td>\n<td>1</td>\n<td>4КБ</td>\n<td>Единственное упоминание — скобочная пометка в потоке личных заметок Миколая (идеи для прозы вперемешку с бытовыми размышлениями). Ни имени вселенной, ни опорных терминов, ни узнаваемых персонажей. Дата 2025-04-01 попадает в отрезо</td>\n<td><code>kb/sushnosti/personazhi/PS-0254-grisha.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0294</code></td>\n<td>Низший Поротай</td>\n<td>2025-09-17–2025-09-17</td>\n<td>1</td>\n<td>3КБ</td>\n<td>Исход поедания жука в безымянной вселенной от 2025-09-17. Механика насекомых нигде больше не встречается, названия у вселенной нет, отрезок хронологии — «неясно».</td>\n<td><code>kb/sushnosti/personazhi/PS-0294-nizshiy-porotay.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0295</code></td>\n<td>Высший Поротай</td>\n<td>2025-09-17–2025-09-17</td>\n<td>1</td>\n<td>3КБ</td>\n<td>Тот же блок 366035 о Поротаях в безымянной вселенной «Разрушаем вселенную». Ни имени, ни опорных терминов какой-либо названной вселенной.</td>\n<td><code>kb/sushnosti/personazhi/PS-0295-vysshiy-porotay.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0296</code></td>\n<td>Антиапостолы / Одержимые</td>\n<td>2025-09-17–2025-09-18</td>\n<td>3</td>\n<td>3КБ</td>\n<td>Слово «антиапостолы» соблазняет привязать к Апостолу, но в 366040 это новая раса безымянной вселенной, получающая силу от чёрного червя, а не благословенные/арбетары Апостола. Термин переиспользован, вселенная другая и без имени —</td>\n<td><code>kb/sushnosti/personazhi/PS-0296-antiapostoly-oderzhimye.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0297</code></td>\n<td>Шаркань</td>\n<td>2025-09-17–2025-09-17</td>\n<td>1</td>\n<td>2КБ</td>\n<td>Шаркань взят из копилки мифологии в безымянную вселенную «Разрушаем вселенную» как кандидат в ядовитые чудища. Ни имени вселенной, ни её опорных терминов рядом нет.</td>\n<td><code>kb/sushnosti/personazhi/PS-0297-sharkan.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0298</code></td>\n<td>Звездочёт</td>\n<td>2025-10-03–2025-10-03</td>\n<td>1</td>\n<td>1КБ</td>\n<td>Звездочёт назван апостолом, но это редакция апостолов-«насекомых/белоглазых» безымянной пересборки (с 2025-09-17 Слава прямо хотел мир «без правителей-творцов»), а не система вселенной «Апостол». Кроме имени и дальности чувств 100</td>\n<td><code>kb/sushnosti/personazhi/PS-0298-zvezdochet.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0309</code></td>\n<td>Саша (Саня)</td>\n<td>2025-11-21–2025-11-21</td>\n<td>1</td>\n<td>5КБ</td>\n<td>Саша — друг рассказчика из «Клаустрофобии», именно он и проговаривает приметы «обратных» (рыбьи мёртвые глаза, «что-то мастерят», рост смертей). Идёт вслед за своей историей: безымянный сеттинг сна, названия нет, остаётся в «неясн</td>\n<td><code>kb/sushnosti/personazhi/PS-0309-sasha-sanya.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0317</code></td>\n<td>София</td>\n<td>2025-11-21–2025-11-21</td>\n<td>3</td>\n<td>65КБ</td>\n<td>Девочка из зала в рассказе «Шут в костюме» [387592–387599]. Персонаж существует только внутри этой отдельной истории, ни с одной названной вселенной и её механикой не пересекается. Дата даёт лишь безымянный отрезок.</td>\n<td><code>kb/sushnosti/personazhi/PS-0317-sofiya.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0318</code></td>\n<td>Отец ведущего</td>\n<td>2025-11-21–2025-11-21</td>\n<td>2</td>\n<td>36КБ</td>\n<td>Фигура из воспоминаний ведущего внутри того же рассказа [387595–387598] («от военного у него была лишь форма»). Бытовой хоррор без сил и терминов; ни к одной названной вселенной не привязывается.</td>\n<td><code>kb/sushnosti/personazhi/PS-0318-otec-veduschego.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0319</code></td>\n<td>Гигантский младенец</td>\n<td>2025-11-21–2025-11-21</td>\n<td>1</td>\n<td>15КБ</td>\n<td>Образ из финала того же рассказа [387597–387599]. Сюрреалистическая деталь внутри автономной истории, опорных терминов вселенных нет.</td>\n<td><code>kb/sushnosti/personazhi/PS-0319-gigantskiy-mladenec.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0320</code></td>\n<td>Рассказчик «Заката»</td>\n<td>2025-11-21–2025-11-21</td>\n<td>1</td>\n<td>12КБ</td>\n<td>Безымянный рассказчик от первого лица в «Закате» [387600–387602]. Обычный человек без способностей, никаких зацепок на названную вселенную; отрезок по дате безымянный.</td>\n<td><code>kb/sushnosti/personazhi/PS-0320-rasskazchik-zakata.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0359</code></td>\n<td>Герой</td>\n<td>2026-04-19–2026-06-02</td>\n<td>4</td>\n<td>14КБ</td>\n<td>Термин «благословенный» звучит прямо, но здесь он не признак Апостола: в тех же сообщениях [462202–462204] Слава закрывает Оэм и объявляет «Строим новую вселенную без энергии», где благословенные — лишь заимствованная основа. По х</td>\n<td><code>kb/sushnosti/personazhi/PS-0359-geroy.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0360</code></td>\n<td>Александор</td>\n<td>2026-04-19–2026-04-19</td>\n<td>1</td>\n<td>7КБ</td>\n<td>Из того же списка благословенных [462205] новой вселенной без энергии. Термин апостольский, но вселенная объявлена новой и имени в чате не получила; отрезок по хронологии — «неясно».</td>\n<td><code>kb/sushnosti/personazhi/PS-0360-aleksandor.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0361</code></td>\n<td>Юра</td>\n<td>2026-04-19–2026-04-19</td>\n<td>1</td>\n<td>7КБ</td>\n<td>Из того же перечня [462205]. Основание было бы «благословенные → Апостол», но автор прямо строит новую безымянную вселенную без энергии, поэтому привязка к Апостолу увела бы персонажа в чужую вселенную.</td>\n<td><code>kb/sushnosti/personazhi/PS-0361-yura.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0362</code></td>\n<td>Четвёртый благословенный (запах дома)</td>\n<td>2026-04-19–2026-04-19</td>\n<td>1</td>\n<td>7КБ</td>\n<td>Четвёртый из списка [462205]. Та же ситуация: апостольская терминология переиспользована в новой безымянной вселенной без энергии (объявление 462203).</td>\n<td><code>kb/sushnosti/personazhi/PS-0362-chetvertyy-blagoslovennyy-zapah-doma.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0363</code></td>\n<td>Гагарин</td>\n<td>2026-04-19–2026-04-19</td>\n<td>1</td>\n<td>1КБ</td>\n<td>В окне [462292–462301] только имя и реплика «Гг истории, который я тебе скидывал»; самой истории в архиве нет. Даже отрезок, куда попадает дата, безымянный. Зацепок на названную вселенную нет вообще.</td>\n<td><code>kb/sushnosti/personazhi/PS-0363-gagarin.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0364</code></td>\n<td>Дети апостолов</td>\n<td>2026-04-25–2026-04-25</td>\n<td>1</td>\n<td>3КБ</td>\n<td>2026-04-25, отрезок 2026-04-19–2026-06-02, который в хронологии сам помечен «неясно» (462203 — новая вселенная без имени). Слово «апостолы» здесь не улика Апостола: в карточке VS-0002 прямо сказано, что весь материал после 2025-09</td>\n<td><code>kb/sushnosti/personazhi/PS-0364-deti-apostolov.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0365</code></td>\n<td>Апик</td>\n<td>2026-04-29–2026-04-29</td>\n<td>1</td>\n<td>6КБ</td>\n<td>Слава прямо говорит [468998]: персонаж, «который теперь будет в каждой вселенной», «он один везде». В самой карточке зафиксировано: вселенная не названа. Привязать нельзя ни по дате (отрезок 2026-04-19 сам безымянный), ни по содер</td>\n<td><code>kb/sushnosti/personazhi/PS-0365-apik.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0366</code></td>\n<td>Шесть столпов героев</td>\n<td>2026-06-02–2026-06-02</td>\n<td>2</td>\n<td>6КБ</td>\n<td>Столпы героев введены в 487002–487005 внутри вселенной, объявленной 486999 и оставшейся без названия. Граф и Нуар — переносные персонажи, по ним вселенная не определяется: материал после 2025-09-12 к «Апостолу» в базе не отнесён.</td>\n<td><code>kb/sushnosti/personazhi/PS-0366-shest-stolpov-geroev.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0367</code></td>\n<td>Шесть столпов злодеев</td>\n<td>2026-06-02–2026-06-02</td>\n<td>2</td>\n<td>3КБ</td>\n<td>Зеркальная группа злодеев из того же объявления 487002–487005 безымянной вселенной 2026-06-02. Никаких опорных терминов какой-либо названной вселенной в материале нет — только «шесть столпов» и «разрушение».</td>\n<td><code>kb/sushnosti/personazhi/PS-0367-shest-stolpov-zlodeev.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0368</code></td>\n<td>Безумная девка</td>\n<td>2026-06-02–2026-06-02</td>\n<td>1</td>\n<td>1КБ</td>\n<td>Одна строка в 487003 внутри безымянной вселенной 2026-06-02. Содержания нет вообще — «безумная девка» как заготовка столпа злодеев. Даже слабой зацепки для привязки не существует.</td>\n<td><code>kb/sushnosti/personazhi/PS-0368-bezumnaya-devka.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0369</code></td>\n<td>Старик (обладатель гравитации)</td>\n<td>2026-06-02–2026-06-02</td>\n<td>2</td>\n<td>14КБ</td>\n<td>Столп злодеев из безымянной вселенной 2026-06-02 (487002–487004, 487191–487235). Разбор гравитации — чистая физика без терминов какой-либо названной вселенной; авторы сами признают, что способность нигде не записана.</td>\n<td><code>kb/sushnosti/personazhi/PS-0369-starik-obladatel-gravitacii.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0370</code></td>\n<td>Изб</td>\n<td>2026-06-02–2026-06-14</td>\n<td>8</td>\n<td>22КБ</td>\n<td>Изб создан 2026-06-02 внутри безымянной вселенной и живёт в ней до 2026-06-14. В версии 6 рядом всплывают Имитатор, апостолы, Нимб, фантазёры, камень желания — сборная солянка из прежних вселенных, а в 489849 Миколай спрашивает «а</td>\n<td><code>kb/sushnosti/personazhi/PS-0370-izb.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0371</code></td>\n<td>Фан-база Изб</td>\n<td>2026-06-02–2026-06-02</td>\n<td>1</td>\n<td>4КБ</td>\n<td>Примечание к арке Изб (487064–487065) в безымянной вселенной 2026-06-02. Фан-база — чисто сюжетная деталь без терминов какой-либо названной вселенной.</td>\n<td><code>kb/sushnosti/personazhi/PS-0371-fan-baza-izb.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0372</code></td>\n<td>Праведник</td>\n<td>2026-06-03–2026-06-03</td>\n<td>1</td>\n<td>8КБ</td>\n<td>Праведник введён 487514 как лицо Ассоциации в безымянной вселенной 2026-06-02. Слова «апостолы» и «Оам» звучат, но здесь это перенесённые сквозные элементы (апостолы держат нейтралитет, Оам — система усиления), а не признак вселен</td>\n<td><code>kb/sushnosti/personazhi/PS-0372-pravednik.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0373</code></td>\n<td>Святая дева</td>\n<td>2026-06-03–2026-06-03</td>\n<td>2</td>\n<td>7КБ</td>\n<td>Святая дева заявлена и на следующий день вычеркнута внутри того же безымянного мира с Ассоциацией и столпами (487514, 487531). Ни имени вселенной, ни её опорных терминов; Нуар — сквозной персонаж, по нему привязать нельзя.</td>\n<td><code>kb/sushnosti/personazhi/PS-0373-svyataya-deva.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0374</code></td>\n<td>Фатик</td>\n<td>2026-06-03–2026-06-09</td>\n<td>2</td>\n<td>6КБ</td>\n<td>Фатик введена 487531 как замена Святой девы в столпах злодеев и глава секты Фалим — целиком материал безымянной вселенной 2026-06-02. «Чистая Оам» и Нуар — перенесённые элементы, вселенная Оам как таковая закрыта 462202 и устроена</td>\n<td><code>kb/sushnosti/personazhi/PS-0374-fatik.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0375</code></td>\n<td>Доима (дочь Имета)</td>\n<td>2026-06-07–2026-06-07</td>\n<td>1</td>\n<td>8КБ</td>\n<td>Доима введена 488435–488444: дочь Имета, выращена Нимбом. Нимб тут — организация внутри новой вселенной (она прямо названа в объявлении 487001), а не вселенная Нимб (её отрезок 2025-04-08 — 2025-05-09). Апостолы и Имет — сквозные</td>\n<td><code>kb/sushnosti/personazhi/PS-0375-doima-doch-imeta.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0376</code></td>\n<td>Маура</td>\n<td>2026-06-07–2026-06-07</td>\n<td>1</td>\n<td>4КБ</td>\n<td>Маура упомянут в 488546 как апостол со способностью вибрации, обученный Иметом, — то есть состав апостолов уже переделанной безымянной вселенной 2026-06-02. Слово «апостол» одно по себе не привязывает: апостолы встречаются и в Оам</td>\n<td><code>kb/sushnosti/personazhi/PS-0376-maura.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0377</code></td>\n<td>Эниг</td>\n<td>2026-06-09–2026-06-09</td>\n<td>1</td>\n<td>10КБ</td>\n<td>Эниг — сын фантазёрши, злодей-одиночка; вся его биография строится на механике фантазёров и на СОЭ, введённых в безымянной вселенной 2026-06-02. Оам упоминается как штатная энергия этого мира, имени вселенной в чате нет.</td>\n<td><code>kb/sushnosti/personazhi/PS-0377-enig.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0378</code></td>\n<td>Бэм</td>\n<td>2026-06-14–2026-06-17</td>\n<td>3</td>\n<td>8КБ</td>\n<td>Бэм 2026-06-14/17. «Бен 10» звучит только как прообраз/архетип, придуманный С («хотел создать персонаж похожего на бена», 489887) — это источник вдохновения, а не принадлежность к вселенной Бен 10. Сам Бэм действует в безымянной в</td>\n<td><code>kb/sushnosti/personazhi/PS-0378-bem.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0379</code></td>\n<td>Зана</td>\n<td>2026-06-17–2026-06-17</td>\n<td>4</td>\n<td>18КБ</td>\n<td>Зана, 2026-06-17, блок 491161-491165. Вселенная в окне ни разу не названа; упомянуты организации Нора, ассоциация, «загик», термины сл/ис/оам. Дата — в отрезке 2026-06-02…конец архива, который в хронологии сам «неясно». Слово «оам</td>\n<td><code>kb/sushnosti/personazhi/PS-0379-zana.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0380</code></td>\n<td>Люля и Эвир</td>\n<td>2026-06-17–2026-06-17</td>\n<td>1</td>\n<td>2КБ</td>\n<td>Люля и Эвир — линия, которую встретит Изб в путешествии (2026-06-17). Привязка только к Избу, персонажу безымянной вселенной финального отрезка; источник — сон автора.</td>\n<td><code>kb/sushnosti/personazhi/PS-0380-lyulya-i-evir.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0381</code></td>\n<td>Апол</td>\n<td>2026-07-14–2026-07-14</td>\n<td>2</td>\n<td>14КБ</td>\n<td>Апол, 2026-07-14 (502717-502799). Сказка о короле не содержит имён вселенной; упомянут «контроль оам», но обещанная способность так и не раскрыта. В файле прямо: «Вселенная не названа». Дата — конец архива, отрезок безымянный.</td>\n<td><code>kb/sushnosti/personazhi/PS-0381-apol.md</code></td>\n</tr>\n<tr>\n<td><code>PS-0382</code></td>\n<td>Трёхголовый дракон Апола</td>\n<td>2026-07-14–2026-07-14</td>\n<td>1</td>\n<td>6КБ</td>\n<td>Дракон Апола из той же сказки 502718. Никаких терминов вселенной, привязан только к Аполу, который сам в «неясно».</td>\n<td><code>kb/sushnosti/personazhi/PS-0382-trehgolovyy-drakon-apola.md</code></td>\n</tr>\n</tbody>\n</table></div>", "r": []}, {"t": "Способность — 69", "a": ["DOC-NEYASNO--sposobnost-69"], "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>id</th>\n<th>Название</th>\n<th>Даты</th>\n<th>Версий</th>\n<th>Объём</th>\n<th>Почему не привязано</th>\n<th>Исходник</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>SP-0001</code></td>\n<td>способность создавать любой предмет</td>\n<td>2022-10-21–2023-07-25</td>\n<td>2</td>\n<td>7КБ</td>\n<td>Шутливый монолог «ты умер / готов душу продать»: Омнитрикс (термин Бен 10) тут же ОТБРОШЕН в пользу отдельной силы — создавать любой предмет. Сама способность ни к Бен 10, ни к другой вселенной не привязана, обе версии (2022-10-21</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0001-sposobnost-sozdavat-lyuboy-predmet.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0002</code></td>\n<td>Кража способностей</td>\n<td>2023-02-22–2023-02-22</td>\n<td>3</td>\n<td>4КБ</td>\n<td>Способность из вечернего блока 2023-02-22 (сначала отвергнута злодею как банальная, потом отдана ГГ). Дата вне отрезков хронологии, вселенная в чате не объявлена, механика (кража способностей с ценой в годах жизни и наследованием)</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0002-krazha-sposobnostey.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0003</code></td>\n<td>Слизь</td>\n<td>2023-02-22–2023-02-22</td>\n<td>2</td>\n<td>4КБ</td>\n<td>Слизь, поедающая людей и присваивающая их свойства — сообщения 34303–34307 того же вечера 2023-02-22. Вне отрезков хронологии, названия вселенной нет, опорных терминов ни одной из вселенных в материале нет.</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0003-sliz.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0004</code></td>\n<td>Бессмертие, привязанное к предмету</td>\n<td>2023-02-22–2023-02-22</td>\n<td>1</td>\n<td>2КБ</td>\n<td>Отвергнутый первый вариант способности злодея (34278–34281), 2023-02-22. Дата вне отрезков, вселенная не объявлена, дальше идея не живёт.</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0004-bessmertie-privyazannoe-k-predmetu.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0005</code></td>\n<td>Очень быстрая регенерация</td>\n<td>2023-02-22–2023-02-22</td>\n<td>1</td>\n<td>2КБ</td>\n<td>Отвергнутый второй вариант для злодея (34286–34291), 2023-02-22. Вне отрезков хронологии, ни имени вселенной, ни её терминов.</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0005-ochen-bystraya-regeneraciya.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0006</code></td>\n<td>Металлические предметы из тела</td>\n<td>2023-02-22–2023-02-22</td>\n<td>1</td>\n<td>2КБ</td>\n<td>Третий перебираемый вариант для злодея (34299), 2023-02-22. Одна реплика, вселенная не названа, дата вне всех отрезков.</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0006-metallicheskie-predmety-iz-tela.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0007</code></td>\n<td>Выбор будущего при смерти</td>\n<td>2023-02-22–2023-02-22</td>\n<td>1</td>\n<td>2КБ</td>\n<td>Заготовка по мотивам аниме «Ложные выводы» (34334–34340), 2023-02-22: бессмертный выбирает будущее при смерти. Заимствование из чужого произведения, своей вселенной не объявлено, дата вне отрезков.</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0007-vybor-buduschego-pri-smerti.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0009</code></td>\n<td>Контроль интернета</td>\n<td>2023-03-27–2023-03-27</td>\n<td>3</td>\n<td>3КБ</td>\n<td>Способность Демона (контроль радиоволн → «контроль интернета», 37541–37578), 2023-03-27 — вне всех отрезков хронологии. По самому Демону материал раздвоен: карточка персонажа получила «Нимб» из-за одной реплики 2025-04-08 («Демон</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0009-kontrol-interneta.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0010</code></td>\n<td>Ускорение (Демон)</td>\n<td>2023-03-27–2023-12-14</td>\n<td>3</td>\n<td>3КБ</td>\n<td>Вторая способность Демона, подтверждённая 2023-12-14 (63306, иконки от нейросети). Обе даты — 2023-03-27 и 2023-12-14 — раньше первого отрезка хронологии (2023-12-26). Дальше судьба та же, что у всего перечня Демона: сам персонаж</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0010-uskorenie-demon.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0012</code></td>\n<td>Душа грешника</td>\n<td>2023-03-27–2023-12-14</td>\n<td>2</td>\n<td>3КБ</td>\n<td>Четвёртая способность Демона (37580; повтор в перечне иконок 63306 от 2023-12-14). Обе даты вне отрезков хронологии, механика («душа грешника») в известных вселенных нигде не всплывает, а единственная ниточка к Нимбу — имя персона</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0012-dusha-greshnika.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0013</code></td>\n<td>Короткая невидимость</td>\n<td>2023-03-27–2023-03-27</td>\n<td>1</td>\n<td>2КБ</td>\n<td>Предложение Миколая для Демона (37535), 2023-03-27 — вне отрезков хронологии. В итоговые перечни способность не вошла и больше нигде не упоминается; вселенная в окне не названа (это отмечено и в «Неясностях» карточки).</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0013-korotkaya-nevidimost.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0014</code></td>\n<td>Лечение и приведение в сознание</td>\n<td>2023-03-27–2023-03-27</td>\n<td>2</td>\n<td>3КБ</td>\n<td>Пара способностей для Демона (37537–37564), 2023-03-27, отклонена Славой и передана будущему напарнику; сами «Напарники Демона» в базе тоже висят в «неясно». Дата вне отрезков хронологии, вселенная не объявлена, содержательных сов</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0014-lechenie-i-privedenie-v-soznanie.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0015</code></td>\n<td>Телекинез для камеры</td>\n<td>2023-03-27–2023-03-27</td>\n<td>1</td>\n<td>2КБ</td>\n<td>27.03.2023 — задолго до первого отрезка хронологии (Падения небес с 2023-12-26). Вариант способности для Демона (телекинез/камера на лбу), в итоговый перечень не вошёл и больше нигде не всплывал. Сам носитель разведён базой против</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0015-telekinez-dlya-kamery.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0016</code></td>\n<td>Телепатия и управление мышцами</td>\n<td>2023-03-27–2023-03-27</td>\n<td>1</td>\n<td>1КБ</td>\n<td>То же окно w0011, 27.03.2023. Телепатия/управление мышцами отклонены Славой сразу, продолжения нет. Вне любого отрезка хронологии; носитель (Демон) в базе принадлежит одновременно Нимбу и 7 островам — однозначного основания нет.</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0016-telepatiya-i-upravlenie-myshcami.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0017</code></td>\n<td>Клон грешника</td>\n<td>2023-03-27–2023-03-27</td>\n<td>2</td>\n<td>2КБ</td>\n<td>Отклонённое предложение на пятую способность Демона (27.03.2023). Материал только w0011, повторов нет. Уцелевшие способности того же вечера (SP-0008, SP-0011) попали в 7 островов лишь потому, что всплыли в w0047 (2024-07-10); у эт</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0017-klon-greshnika.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0018</code></td>\n<td>Отнятие способности при убийстве</td>\n<td>2023-03-27–2023-03-27</td>\n<td>2</td>\n<td>2КБ</td>\n<td>Отклонено вместе с клоном грешника, единственное упоминание 27.03.2023 в w0011. Ни имени вселенной, ни опорных терминов; дата вне всех отрезков.</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0018-otnyatie-sposobnosti-pri-ubiystve.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0048</code></td>\n<td>Клонирование последнего тронутого объекта</td>\n<td>2024-02-05–2024-02-05</td>\n<td>2</td>\n<td>4КБ</td>\n<td>Способность из зачина Миколая 104383–104392, тот же безымянный сеттинг первых сверхлюдей (отрезок 2024-02-05 — 2024-04-01). Опорных терминов ни одной названной вселенной нет.</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0048-klonirovanie-poslednego-tronutogo-obekta.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0049</code></td>\n<td>режим ярости</td>\n<td>2024-02-12–2024-02-12</td>\n<td>1</td>\n<td>3КБ</td>\n<td>2024-02-12 попадает в безымянный отрезок 2024-02-05 — 2024-04-01, но содержание с ним не стыкуется: разбор чужой картинки по ссылке pin.it, аналогия с дьявольским щитом Наофуми, перенос на инопланетян. Носителя нет даже имени, к т</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0049-rezhim-yarosti.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0050</code></td>\n<td>отмотка времени (петля)</td>\n<td>2024-03-29–2024-03-29</td>\n<td>1</td>\n<td>4КБ</td>\n<td>Механика отмотки на 10 секунд и 10000 повторов проговорена одним сообщением 2024-03-29, в безымянном отрезке. Отдельная «Петля» из 151858 (2024-04-02, игра бога) в базе живёт как SP-0051; отождествлять их без слов авторов нельзя.</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0050-otmotka-vremeni-petlya.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0094</code></td>\n<td>Заражение грибницей</td>\n<td>2024-07-31–2024-07-31</td>\n<td>1</td>\n<td>4КБ</td>\n<td>Сообщения 214254–214281 (31.07.2024) попадают в отрезок 2024-07-31 — 2024-08-08, который сам по хронологии числится «неясно» (объявление 213578 «И снова апокалипсис», имени вселенной в чате нет). В дословном материале — грибница,</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0094-zarazhenie-gribnicey.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0137</code></td>\n<td>Магия</td>\n<td>2024-12-21–2024-12-21</td>\n<td>5</td>\n<td>13КБ</td>\n<td>Центральная механика того же безымянного средневекового сеттинга w0067 (21.12.2024). Спор о природе магии (духи, стихии, «идея плюс мана») не содержит терминов ни одной названной вселенной, а отрезок по хронологии сам «неясно».</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0137-magiya.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0138</code></td>\n<td>Мана</td>\n<td>2024-12-21–2024-12-21</td>\n<td>4</td>\n<td>7КБ</td>\n<td>Мана из того же средневекового окна w0067 (ключевое сообщение 272537). Мана — общий фэнтезийный термин, а не опорный маркер какой-либо из названных вселенных; отрезок безымянный.</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0138-mana.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0139</code></td>\n<td>Табу</td>\n<td>2024-12-21–2024-12-21</td>\n<td>2</td>\n<td>4КБ</td>\n<td>Табу (запрет, защищающий ману, затем клятва-усиление) — часть той же безымянной средневековой системы сил w0067. Ни персонажей, ни терминов названных вселенных.</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0139-tabu.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0140</code></td>\n<td>Скверна (ядовитая мана)</td>\n<td>2024-12-21–2024-12-21</td>\n<td>2</td>\n<td>6КБ</td>\n<td>Скверна как «грязная» ветка маны (названа в 272510) — механика того же средневекового сеттинга 21.12.2024 из безымянного отрезка. Зацепок на названную вселенную нет.</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0140-skverna-yadovitaya-mana.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0141</code></td>\n<td>Гримуары (книги заклинаний)</td>\n<td>2024-12-21–2024-12-21</td>\n<td>5</td>\n<td>21КБ</td>\n<td>Гримуары — самая длинная связка окна w0067, и в конце окна авторы её выбрасывают. Материал целиком внутри безымянного средневекового отрезка 2024-12-21 — 2025-01-06; терминов названных вселенных в тексте нет.</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0141-grimuary-knigi-zaklinaniy.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0142</code></td>\n<td>Предрасположенность к магии</td>\n<td>2024-12-21–2024-12-21</td>\n<td>4</td>\n<td>6КБ</td>\n<td>Предрасположенность к магии (кровь, кланы) — ветка того же средневекового разговора 21.12.2024. Отрезок в хронологии безымянный, содержательных маркеров вселенной нет.</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0142-predraspolozhennost-k-magii.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0143</code></td>\n<td>Барьерная магия</td>\n<td>2024-12-21–2024-12-21</td>\n<td>3</td>\n<td>5КБ</td>\n<td>Барьерная магия из безымянного средневекового мира, окно w0067 (21.12.2024). Отрезок 2024-12-21 — 2025-01-06 сам по хронологии «неясно» (смена 272089), имени вселенной в чате нет. В дословном материале только спор о сложности маги</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0143-barernaya-magiya.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0144</code></td>\n<td>Магия клятвы</td>\n<td>2024-12-23–2024-12-23</td>\n<td>2</td>\n<td>4КБ</td>\n<td>Магия клятвы рыцаря королеве, наследуемая её семьёй — механика безымянного средневекового мира (w0068). Отрезок «неясно», названий вселенных нет.</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0144-magiya-klyatvy.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0145</code></td>\n<td>Магия (система магии мира)</td>\n<td>2024-12-23–2024-12-25</td>\n<td>5</td>\n<td>12КБ</td>\n<td>Общая система магии безымянного средневекового мира (4 стихии, отклонения, барьеры, материализация, «как в аватаре»), w0068. Упоминание «благословение бывает только одно» — внутренний термин этой же системы, не опора Апостола. Отр</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0145-magiya-sistema-magii-mira.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0146</code></td>\n<td>Магия материализации</td>\n<td>2024-12-23–2024-12-23</td>\n<td>1</td>\n<td>3КБ</td>\n<td>Магия материализации: воплощение фантазии в реальность, нужны химия и физика на уровне профессора — часть системы магии безымянного средневекового мира (w0068). Отрезок «неясно».</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0146-magiya-materializacii.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0147</code></td>\n<td>Магия контроля (благословения)</td>\n<td>2024-12-23–2024-12-25</td>\n<td>5</td>\n<td>9КБ</td>\n<td>Здесь «благословение» звучит чаще всего (17 раз), и это был единственный серьёзный кандидат на Апостола. Но дословно это ДРУГАЯ механика: благословение = магия контроля над уже существующим объектом (исцеление, баффы, некромантия)</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0147-magiya-kontrolya-blagosloveniya.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0148</code></td>\n<td>Тёмная магия</td>\n<td>2024-12-23–2024-12-23</td>\n<td>2</td>\n<td>8КБ</td>\n<td>Спор Миколая и Славы о существовании тёмной магии при описании персонажа-тёмного эльфа, w0068, безымянный средневековый мир. Содержание так и не определено. Отрезок «неясно».</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0148-temnaya-magiya.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0149</code></td>\n<td>Заклинания мага ветра</td>\n<td>2024-12-23–2024-12-23</td>\n<td>2</td>\n<td>4КБ</td>\n<td>Заклинания мага ветра (щит, разрез, толчок, взрыв, стрела) — способности персонажа безымянного средневекового мира, w0068. Отрезок «неясно».</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0149-zaklinaniya-maga-vetra.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0150</code></td>\n<td>Меч, сохраняющий заклинание</td>\n<td>2024-12-23–2024-12-23</td>\n<td>2</td>\n<td>4КБ</td>\n<td>Артефакт мага ветра из безымянного средневекового мира (w0068): меч хранит одно заклинание для мгновенного дистанционного применения. Отрезок «неясно», опорных терминов нет.</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0150-mech-sohranyayuschiy-zaklinanie.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0151</code></td>\n<td>Бусы с магией света</td>\n<td>2024-12-23–2024-12-23</td>\n<td>2</td>\n<td>2КБ</td>\n<td>Второй артефакт того же персонажа — бусы с магией света; вводятся и уточняются внутри w0068, безымянный средневековый мир. Отрезок «неясно».</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0151-busy-s-magiey-sveta.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0152</code></td>\n<td>Листок бумаги из клевера</td>\n<td>2024-12-23–2024-12-23</td>\n<td>2</td>\n<td>5КБ</td>\n<td>Артефакт тёмного эльфа: бумага из клевера, заклинание плюс оригами. Введён в его карточке в w0068, безымянный средневековый мир, отрезок «неясно». Механика нигде больше не всплывает.</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0152-listok-bumagi-iz-klevera.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0153</code></td>\n<td>Линза удачи</td>\n<td>2024-12-23–2024-12-23</td>\n<td>1</td>\n<td>3КБ</td>\n<td>Артефакт из карточки тёмного эльфа (273513-273517). Дата 2024-12-23 попадает в отрезок 2024-12-21 — 2025-01-06, который в хронологии сам безымянный («средневековье с другой системой сил», реплика Славы «Джинсы в средневековье»). Н</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0153-linza-udachi.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0154</code></td>\n<td>Чтение опыта через поглаживание</td>\n<td>2024-12-23–2024-12-23</td>\n<td>2</td>\n<td>5КБ</td>\n<td>Тот же разговор про тёмного эльфа Миколая, отрезок 2024-12-21 — 2025-01-06 без имени. Слово «благословение» тут — родовая категория сил этого средневекового мира (стихия / благословение), а не термин «благословенные» из Апостола:</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0154-chtenie-opyta-cherez-poglazhivanie.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0155</code></td>\n<td>Заклинания тёмного эльфа</td>\n<td>2024-12-23–2024-12-25</td>\n<td>3</td>\n<td>6КБ</td>\n<td>Базовый набор заклинаний тёмного эльфа (273545-273551), тот же безымянный средневековый отрезок. Спор «усыпление — это второе благословение» — механика мира, названия вселенной в чате не звучит.</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0155-zaklinaniya-temnogo-elfa.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0156</code></td>\n<td>Семь грехов (магия по грехам)</td>\n<td>2024-12-24–2024-12-25</td>\n<td>4</td>\n<td>11КБ</td>\n<td>Задача про магию семи грехов (273735-274472). В самом файле в «Неясностях» зафиксировано: «неясно, для этого ли мира грехи или это отдельная задумка — вселенная не названа». Отрезок безымянный.</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0156-sem-grehov-magiya-po-greham.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0157</code></td>\n<td>Похоть (грех)</td>\n<td>2024-12-24–2024-12-24</td>\n<td>2</td>\n<td>7КБ</td>\n<td>Часть разбора семи грехов из того же безымянного отрезка; имени вселенной и опорных терминов нет.</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0157-pohot-greh.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0158</code></td>\n<td>Чревоугодие</td>\n<td>2024-12-24–2024-12-24</td>\n<td>2</td>\n<td>6КБ</td>\n<td>Часть разбора семи грехов (поглощение), тот же безымянный отрезок 2024-12-21 — 2025-01-06.</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0158-chrevougodie.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0160</code></td>\n<td>Лень (грех)</td>\n<td>2024-12-24–2024-12-25</td>\n<td>3</td>\n<td>8КБ</td>\n<td>Часть разбора семи грехов (лень: барьер, телепортация / телекинез+ветер), тот же безымянный отрезок.</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0160-len-greh.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0161</code></td>\n<td>Зависть (грех)</td>\n<td>2024-12-24–2024-12-25</td>\n<td>3</td>\n<td>7КБ</td>\n<td>Часть разбора семи грехов (зависть), тот же безымянный отрезок; вселенная в чате не названа.</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0161-zavist-greh.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0162</code></td>\n<td>Гордыня (грех)</td>\n<td>2024-12-24–2024-12-25</td>\n<td>3</td>\n<td>7КБ</td>\n<td>Часть разбора семи грехов (гордыня), тот же безымянный отрезок; вселенная в чате не названа.</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0162-gordynya-greh.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0263</code></td>\n<td>Перерождение Имитатора</td>\n<td>2026-04-19–2026-04-19</td>\n<td>1</td>\n<td>5КБ</td>\n<td>Материал [462201] сам перечисляет сразу три вселенные — «В семи островах / В благословенная / В Оэм» — и описывает исход перерождения отдельно для каждой. Это сквозная механика ключевого персонажа, а не свойство одной вселенной; в</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0263-pererozhdenie-imitatora.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0264</code></td>\n<td>Белые глаза апостолов</td>\n<td>2026-04-25–2026-04-25</td>\n<td>1</td>\n<td>2КБ</td>\n<td>Слово «апостолы» звучит прямо [466520–466535], но это переделанные апостолы, которых Слава вернул в новую вселенную без энергии ([466476] «Хочу опять добавить апостолов»): без индивидуальных способностей, «раз бога нет». Механика</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0264-belye-glaza-apostolov.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0265</code></td>\n<td>Кровь</td>\n<td>2026-06-02–2026-06-02</td>\n<td>1</td>\n<td>3КБ</td>\n<td>Способность Нуара из разбора 487009–487011 внутри безымянной вселенной 2026-06-02. Сама по себе «кровь» ничего о вселенной не говорит, а Нуар — сквозной персонаж, кочующий между вселенными (он же в 7 островах).</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0265-krov.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0266</code></td>\n<td>Слова</td>\n<td>2026-06-02–2026-06-02</td>\n<td>1</td>\n<td>3КБ</td>\n<td>Тот же блок 487009–487011: способность Нуара в безымянной вселенной, объявленной 486999. Опорных терминов названных вселенных в тексте нет.</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0266-slova.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0267</code></td>\n<td>Молния</td>\n<td>2026-06-02–2026-06-02</td>\n<td>1</td>\n<td>3КБ</td>\n<td>Тот же блок 487009–487011. Слава сам говорит, что «говорить особо нечего» — содержания, по которому можно было бы привязать, нет; отрезок 2026-06-02 в хронологии безымянный.</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0267-molniya.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0268</code></td>\n<td>Полёт</td>\n<td>2026-06-02–2026-06-02</td>\n<td>2</td>\n<td>3КБ</td>\n<td>Способность Изб из 487018 и 487065–487067 — внутри безымянной вселенной 2026-06-02. Полёт как таковой ни на какую названную вселенную не указывает.</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0268-polet.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0269</code></td>\n<td>Неуязвимость</td>\n<td>2026-06-02–2026-06-02</td>\n<td>2</td>\n<td>3КБ</td>\n<td>Способность Изб (487018, 487066). Упомянут Нимб, но это организация внутри вселенной 2026-06-02, а не вселенная «Нимб», отрезок которой — 2025-04-08–2025-05-09.</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0269-neuyazvimost.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0270</code></td>\n<td>Сверхчеловеческая сила</td>\n<td>2026-06-02–2026-06-02</td>\n<td>1</td>\n<td>2КБ</td>\n<td>Способность Изб из 487018, безымянная вселенная 2026-06-02. Никаких опорных терминов названных вселенных.</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0270-sverhchelovecheskaya-sila.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0271</code></td>\n<td>Влияние на реальность</td>\n<td>2026-06-02–2026-06-02</td>\n<td>1</td>\n<td>6КБ</td>\n<td>Основная способность Изб (487018–487020) внутри вселенной, объявленной 486999 без имени. «Влияние на реальность этого мира» — про мир вообще, конкретной вселенной не называет.</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0271-vliyanie-na-realnost.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0272</code></td>\n<td>Плёнка сверхлюдей</td>\n<td>2026-06-02–2026-06-02</td>\n<td>2</td>\n<td>3КБ</td>\n<td>Условность мира из 487169–487176 в безымянной вселенной 2026-06-02. Рядом всплывают Палач и апостолы, но это переработанные переносные персонажи; в VS-0002 материал после 2025-09-12 из «Апостола» исключён.</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0272-plenka-sverhlyudey.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0273</code></td>\n<td>Способность старика: единственная точка гравитации</td>\n<td>2026-06-02–2026-06-02</td>\n<td>2</td>\n<td>13КБ</td>\n<td>Материал 2026-06-02 (сообщ. 487194–487209) — восстановление способности старика-злодея для вселенной, объявленной 486999/487001 («современный мир, где есть злодей и герой, нимб и секта»). По хронологии этот отрезок (2026-06-02 — д</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0273-sposobnost-starika-edinstvennaya-tochka-gravitacii.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0274</code></td>\n<td>Способность Праведника</td>\n<td>2026-06-03–2026-06-03</td>\n<td>1</td>\n<td>5КБ</td>\n<td>Способность лица Ассоциации из той же сцены 487514. Упоминание «усиляет себя Оам» — сквозная механика, перенесённая в новую вселенную 2026-06-02; собственного имени у этой вселенной в чате нет, дата в «неясно»-отрезке.</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0274-sposobnost-pravednika.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0275</code></td>\n<td>Способность света Святой девы</td>\n<td>2026-06-03–2026-06-03</td>\n<td>1</td>\n<td>4КБ</td>\n<td>Способность света привязана к Святой деве из безымянной вселенной 2026-06-02. Никаких маркеров названной вселенной, только дата — а дата ведёт в «неясно»-отрезок.</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0275-sposobnost-sveta-svyatoy-devy.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0276</code></td>\n<td>Управление фотонами</td>\n<td>2026-06-03–2026-06-03</td>\n<td>1</td>\n<td>3КБ</td>\n<td>Управление фотонами — способность Фатик из того же сообщения 487531 (защита от тьмы Нуара, «минутка тьмы»). Имени вселенной нет, дата попадает в «неясно»-отрезок 2026-06-02.</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0276-upravlenie-fotonami.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0277</code></td>\n<td>Кукловод («Я не умру, пока не кончится Оам»)</td>\n<td>2026-06-07–2026-06-07</td>\n<td>2</td>\n<td>8КБ</td>\n<td>Первый слот программы Имета из большого разбора 488545–488546. Формула «Я не умру, пока не кончится Оам» использует Оам как энергию переделанного мира; сам Слава в 488783 говорит «приходится переделывать всех персов под вселенную»</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0277-kuklovod-ya-ne-umru-poka-ne-konchitsya-oam.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0278</code></td>\n<td>Вибрация (Волнистый удар)</td>\n<td>2026-06-07–2026-06-07</td>\n<td>2</td>\n<td>8КБ</td>\n<td>Вибрация — второй слот Имета из того же сообщения 488546, часть системы программ новой безымянной вселенной. Апостолы и Оам здесь сквозные, а не маркеры вселенных Апостол/Оам.</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0278-vibraciya-volnistyy-udar.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0279</code></td>\n<td>Провалы Энига</td>\n<td>2026-06-09–2026-06-09</td>\n<td>1</td>\n<td>9КБ</td>\n<td>Провалы Энига опираются на мир его матери и на разграничение с Оам — обе конструкции родом из безымянной вселенной 2026-06-02. Названия вселенной в материале нет, дата ведёт в «неясно»-отрезок.</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0279-provaly-eniga.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0280</code></td>\n<td>Мерцание</td>\n<td>2026-06-14–2026-06-14</td>\n<td>1</td>\n<td>2КБ</td>\n<td>Способность Изба, 2026-06-14. Изб — персонаж финального безымянного отрезка (в 489571 объявлен гг), вселенная в чате не названа; хронология для этой даты даёт «неясно».</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0280-mercanie.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0281</code></td>\n<td>Клинок тысячи боли</td>\n<td>2026-06-17–2026-06-17</td>\n<td>1</td>\n<td>12КБ</td>\n<td>Первый артефакт Заны (491163). Наследует неопределённость Заны: вселенная в окне не названа, дата — в безымянном финальном отрезке.</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0281-klinok-tysyachi-boli.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0282</code></td>\n<td>Очки Заны</td>\n<td>2026-06-17–2026-06-17</td>\n<td>1</td>\n<td>6КБ</td>\n<td>Второй артефакт Заны (491163). Опорных терминов вселенной нет, вселенная в окне не названа.</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0282-ochki-zany.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0283</code></td>\n<td>Железное сердце</td>\n<td>2026-06-17–2026-06-17</td>\n<td>1</td>\n<td>13КБ</td>\n<td>Третий артефакт Заны, им убран чёрный ящик (491161, 491163). Чёрный ящик — предмет того же безымянного мира; названия вселенной в чате нет.</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0283-zheleznoe-serdce.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0284</code></td>\n<td>Перчатка для стрельбы</td>\n<td>2026-06-17–2026-06-17</td>\n<td>1</td>\n<td>6КБ</td>\n<td>Четвёртый артефакт Заны, лук создаёт стрелы «из оам» (491164). Оам здесь — энергия нового безымянного мира (та же, что и в 488784, где ей противопоставлена СОЭ), а не маркер вселенной Оам, чья линия по хронологии закрыта 2026-04-1</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0284-perchatka-dlya-strelby.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0285</code></td>\n<td>Способность Апола</td>\n<td>2026-07-14–2026-07-14</td>\n<td>4</td>\n<td>13КБ</td>\n<td>Разработка способности Апола (502719-502799): души питомцев плюс отдельная способность на контроль оам. Наследует неопределённость Апола, собственной привязки нет.</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0285-sposobnost-apola.md</code></td>\n</tr>\n<tr>\n<td><code>SP-0286</code></td>\n<td>Био реконструкция</td>\n<td>2026-07-14–2026-07-14</td>\n<td>1</td>\n<td>2КБ</td>\n<td>Био реконструкция — способность трёх неназванных персонажей, введена как довод о вторичности способности Апола (502786). Носители не названы, вселенная тоже.</td>\n<td><code>kb/sushnosti/sposobnosti/SP-0286-bio-rekonstrukciya.md</code></td>\n</tr>\n</tbody>\n</table></div>", "r": []}, {"t": "Мир — 42", "a": ["DOC-NEYASNO--mir-42"], "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>id</th>\n<th>Название</th>\n<th>Даты</th>\n<th>Версий</th>\n<th>Объём</th>\n<th>Почему не привязано</th>\n<th>Исходник</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>MR-0001</code></td>\n<td>Повседневность + фентези</td>\n<td>2023-01-07–2023-01-07</td>\n<td>1</td>\n<td>3КБ</td>\n<td>2023-01-07, разговор о том, какой будет ПЕРВАЯ вселенная Миколая: повседневность, 3 сезона, 4-й — повседневность + фентези. Это заготовка до всех отрезков хронологии (первая, Падения небес, начинается 2023-12-26), названия в чате</td>\n<td><code>kb/sushnosti/miry/MR-0001-povsednevnost-fentezi.md</code></td>\n</tr>\n<tr>\n<td><code>MR-0005</code></td>\n<td>мир первых сверхлюдей (2024)</td>\n<td>2024-02-05–2024-02-05</td>\n<td>2</td>\n<td>7КБ</td>\n<td>Это ядро самого объявления 104329 от 2024-02-05 (первые сверхлюди, эксперименты, постапокалипсис). По хронологии отрезок 2024-02-05 — 2024-04-01 объявлен, но названия вселенной в чате нет вообще. Значит вселенная безымянная, а не</td>\n<td><code>kb/sushnosti/miry/MR-0005-mir-pervyh-sverhlyudey-2024.md</code></td>\n</tr>\n<tr>\n<td><code>MR-0044</code></td>\n<td>апокалипсис (новая вселенная)</td>\n<td>2024-07-31–2024-07-31</td>\n<td>5</td>\n<td>12КБ</td>\n<td>Это и есть развёрнутое объявление 214141–214161 от 2024-07-31: апокалипсис, монстры, выживание ГГ. По хронологии отрезок безымянный; название «монстры» закрепится за другой вселенной только с 2024-08-08 (215855, связанные мини-ист</td>\n<td><code>kb/sushnosti/miry/MR-0044-apokalipsis-novaya-vselennaya.md</code></td>\n</tr>\n<tr>\n<td><code>MR-0048</code></td>\n<td>Вирус пришельцев</td>\n<td>2024-08-07–2024-08-07</td>\n<td>1</td>\n<td>5КБ</td>\n<td>Сообщения 215636–215644 (07.08.2024) идут до объявления 215855 («монстры», 08.08.2024), то есть внутри безымянного отрезка 2024-07-31 — 2024-08-08. Содержание — пришельцы, распылённый вирус, особая ДНК; это не книга монстров и не</td>\n<td><code>kb/sushnosti/miry/MR-0048-virus-prishelcev.md</code></td>\n</tr>\n<tr>\n<td><code>MR-0076</code></td>\n<td>Монстры-боги (лавкрафтовская концепция)</td>\n<td>2024-12-08–2024-12-08</td>\n<td>2</td>\n<td>12КБ</td>\n<td>Ловушка: название «монстры-боги» не значит вселенную «монстры». Сообщения 268606–268698 идут после объявления 268571 (новая вселенная, ужасы + мифология) и сам Слава в 268671 отделяет их от прошлой: «да и в прошлой вселенной о мон</td>\n<td><code>kb/sushnosti/miry/MR-0076-monstry-bogi-lavkraftovskaya-koncepciya.md</code></td>\n</tr>\n<tr>\n<td><code>MR-0084</code></td>\n<td>Средневековый мир</td>\n<td>2024-12-21–2024-12-21</td>\n<td>3</td>\n<td>5КБ</td>\n<td>Сообщение 272089 — та самая смена, что открывает отрезок 2024-12-21 — 2025-01-06, помеченный в хронологии «неясно». В самом файле в разделе «Неясности» зафиксировано: «Вселенная в чате именем не названа, обозначается только как ср</td>\n<td><code>kb/sushnosti/miry/MR-0084-srednevekovyy-mir.md</code></td>\n</tr>\n<tr>\n<td><code>MR-0085</code></td>\n<td>Маги в обществе</td>\n<td>2024-12-21–2024-12-21</td>\n<td>3</td>\n<td>5КБ</td>\n<td>Устройство магов в обществе безымянного средневекового мира (w0067). Дословно: школы, казармы, церковь, «маги это учёный». Дата попадает в отрезок, который сам помечен «неясно»; названий и опорных терминов вселенных нет.</td>\n<td><code>kb/sushnosti/miry/MR-0085-magi-v-obschestve.md</code></td>\n</tr>\n<tr>\n<td><code>MR-0086</code></td>\n<td>Религия и церковь</td>\n<td>2024-12-21–2024-12-21</td>\n<td>3</td>\n<td>5КБ</td>\n<td>Религия и церковь того же безымянного средневекового мира (w0067): переделка христианства под мир с сильными магами, бог «в небесах». Отрезок 2024-12-21 — 2025-01-06 сам «неясно», зацепок на названные вселенные нет.</td>\n<td><code>kb/sushnosti/miry/MR-0086-religiya-i-cerkov.md</code></td>\n</tr>\n<tr>\n<td><code>MR-0087</code></td>\n<td>Рыцари</td>\n<td>2024-12-21–2024-12-23</td>\n<td>5</td>\n<td>9КБ</td>\n<td>Рыцари безымянного средневекового мира, тянется из w0067 в w0068 (21–23.12.2024). Дословно — справочные выписки про рыцарей Европы и деление на сильных/средних, служба королеве. Ни имени вселенной, ни её терминов.</td>\n<td><code>kb/sushnosti/miry/MR-0087-rycari.md</code></td>\n</tr>\n<tr>\n<td><code>MR-0088</code></td>\n<td>Расы</td>\n<td>2024-12-21–2024-12-21</td>\n<td>3</td>\n<td>5КБ</td>\n<td>Подбор рас (эльф, дворф, гоблин, орк, вампир, драконид) для безымянного средневекового мира, w0067. Отрезок по хронологии «неясно»; ничего, что указывало бы на названную вселенную.</td>\n<td><code>kb/sushnosti/miry/MR-0088-rasy.md</code></td>\n</tr>\n<tr>\n<td><code>MR-0089</code></td>\n<td>Зимние человечки</td>\n<td>2024-12-21–2024-12-21</td>\n<td>1</td>\n<td>2КБ</td>\n<td>Раса вспомянута как придуманная РАНЬШЕ («помнишь зимний челики?»), но исходное описание за пределами окна, и в какой вселенной она родилась — не восстанавливается. Здесь она вносится в безымянный средневековый мир отрезка «неясно»</td>\n<td><code>kb/sushnosti/miry/MR-0089-zimnie-chelovechki.md</code></td>\n</tr>\n<tr>\n<td><code>MR-0090</code></td>\n<td>Оборотни</td>\n<td>2024-12-21–2024-12-21</td>\n<td>1</td>\n<td>1КБ</td>\n<td>Четыре реплики о том, что оборотень — человек плюс любое животное; часть списка рас безымянного средневекового мира (w0067). Отрезок «неясно», опорных терминов нет.</td>\n<td><code>kb/sushnosti/miry/MR-0090-oborotni.md</code></td>\n</tr>\n<tr>\n<td><code>MR-0091</code></td>\n<td>Демоны</td>\n<td>2024-12-21–2025-09-12</td>\n<td>3</td>\n<td>3КБ</td>\n<td>Версии 1–2 (21.12.2024, w0067) — раса демонов в безымянном средневековом мире, отрезок «неясно». Версия 3 (2025-09-12, w0104, сообщение 364797 с упоминанием арбетаров и одержимых) относится уже к объявлению 364756 — новой упрощённ</td>\n<td><code>kb/sushnosti/miry/MR-0091-demony.md</code></td>\n</tr>\n<tr>\n<td><code>MR-0092</code></td>\n<td>Мир (безымянный средневеково-фэнтезийный мир с магией)</td>\n<td>2024-12-23–2024-12-25</td>\n<td>7</td>\n<td>12КБ</td>\n<td>Сам заголовок и раздел «Неясности» фиксируют: «Вселенная не названа ни разу». Три королевства, королева, эльфы, система магии — w0068, отрезок 2024-12-21 — 2025-01-06 помечен «неясно». Слово «благословенных» в версии 7 — локальный</td>\n<td><code>kb/sushnosti/miry/MR-0092-mir-bezymyannyy-srednevekovo-fenteziynyy-mir-s-magiey.md</code></td>\n</tr>\n<tr>\n<td><code>MR-0126</code></td>\n<td>новая чистая вселенная</td>\n<td>2025-03-25–2025-03-25</td>\n<td>3</td>\n<td>7КБ</td>\n<td>Это и есть та самая безымянная вселенная отрезка 2025-03-25 — 2025-03-26 (объявление 310923 после прощания с апостолами 310844). Апостолы в ней упоминаются только как перенесённый материал (311180), сама она объявлена «чистой», на</td>\n<td><code>kb/sushnosti/miry/MR-0126-novaya-chistaya-vselennaya.md</code></td>\n</tr>\n<tr>\n<td><code>MR-0130</code></td>\n<td>раса, связанная с ангелами</td>\n<td>2025-03-30–2025-03-30</td>\n<td>2</td>\n<td>6КБ</td>\n<td>Раса относится к «новому миру», про который Слава тут же говорит 314481–314486: «Это не килька. Это другая вселенная. И основой всего является Ом». То есть принадлежность к Апостолу прямо отрицена, а сама вселенная имени в чате не</td>\n<td><code>kb/sushnosti/miry/MR-0130-rasa-svyazannaya-s-angelami.md</code></td>\n</tr>\n<tr>\n<td><code>MR-0152</code></td>\n<td>новая вселенная (безымянная, «Разрушаем вселенную»)</td>\n<td>2025-09-17–2025-09-25</td>\n<td>4</td>\n<td>11КБ</td>\n<td>366030 «Разрушаем вселенную» — прежняя вселенная снесена и собрана другая: современный мир, монстры, расы через поедание насекомых, запрет на творцов и энергию. Имени в чате нет. Слова «апостолы» и «арбетары» тут переопределены (а</td>\n<td><code>kb/sushnosti/miry/MR-0152-novaya-vselennaya-bezymyannaya-razrushaem-vselennuyu.md</code></td>\n</tr>\n<tr>\n<td><code>MR-0153</code></td>\n<td>Насекомые (источник сил)</td>\n<td>2025-09-17–2025-09-18</td>\n<td>3</td>\n<td>5КБ</td>\n<td>21 вид насекомых как источник сил — собственная механика безымянной вселенной от 2025-09-17, ни в одной названной вселенной не встречается.</td>\n<td><code>kb/sushnosti/miry/MR-0153-nasekomye-istochnik-sil.md</code></td>\n</tr>\n<tr>\n<td><code>MR-0154</code></td>\n<td>Древние левиафаны</td>\n<td>2025-09-17–2025-09-17</td>\n<td>1</td>\n<td>2КБ</td>\n<td>Объяснение силы насекомых через сдохших левиафанов (366108) — внутренняя деталь той же безымянной вселенной. Зацепок на названную вселенную нет.</td>\n<td><code>kb/sushnosti/miry/MR-0154-drevnie-leviafany.md</code></td>\n</tr>\n<tr>\n<td><code>MR-0155</code></td>\n<td>Выход монстров из воды</td>\n<td>2025-09-17–2025-09-17</td>\n<td>2</td>\n<td>4КБ</td>\n<td>Версия происхождения монстров из воды (366098–366105) — часть безымянной вселенной 2025-09-17. Со вселенной «монстры» (2024-08-08 — 2024-12-08, книга связанных мини-историй) не совпадает ни по времени, ни по содержанию, поэтому пр</td>\n<td><code>kb/sushnosti/miry/MR-0155-vyhod-monstrov-iz-vody.md</code></td>\n</tr>\n<tr>\n<td><code>MR-0156</code></td>\n<td>Запрет на творцов, артефакты, ауру и энергию</td>\n<td>2025-09-17–2025-09-25</td>\n<td>3</td>\n<td>4КБ</td>\n<td>Главное правило безымянной вселенной: без творцов, артефактов, ауры и энергии (366039, 366097). Это правило как раз отсекает её от прежних вселенных, а собственного имени ей не дали.</td>\n<td><code>kb/sushnosti/miry/MR-0156-zapret-na-tvorcov-artefakty-auru-i-energiyu.md</code></td>\n</tr>\n<tr>\n<td><code>MR-0157</code></td>\n<td>Монстры из мифологии (копилка)</td>\n<td>2025-09-17–2025-09-18</td>\n<td>2</td>\n<td>6КБ</td>\n<td>Копилка мифологических существ, которую Слава заводит для безымянной вселенной 2025-09-17 (366243–366251, правило 366586). Источник — сторонний канал, названной вселенной в материале нет.</td>\n<td><code>kb/sushnosti/miry/MR-0157-monstry-iz-mifologii-kopilka.md</code></td>\n</tr>\n<tr>\n<td><code>MR-0158</code></td>\n<td>Славянская мифология (небеса, остров Буян, мировое древо)</td>\n<td>2025-09-23–2025-09-23</td>\n<td>1</td>\n<td>5КБ</td>\n<td>Пересказ славянской мифологии (семь небес, Буян, мировой океан, мировое дерево) без единой привязки; в записи прямо помечено «к какой вселенной это прикладывается, здесь не сказано». Мировое древо всплывает в следующем окне в безы</td>\n<td><code>kb/sushnosti/miry/MR-0158-slavyanskaya-mifologiya-nebesa-ostrov-buyan-mirovoe-drevo.md</code></td>\n</tr>\n<tr>\n<td><code>MR-0159</code></td>\n<td>Воскрешение погибших цивилизаций</td>\n<td>2025-09-26–2025-09-26</td>\n<td>1</td>\n<td>3КБ</td>\n<td>Мозговой штурм в безымянном отрезке: воскресить павшие цивилизации и спор Славы об истоке магии. Ни имени вселенной, ни опорных терминов; в записи отмечено, что даже границы силы автору неясны.</td>\n<td><code>kb/sushnosti/miry/MR-0159-voskreshenie-pogibshih-civilizaciy.md</code></td>\n</tr>\n<tr>\n<td><code>MR-0160</code></td>\n<td>Бог, которого едят</td>\n<td>2025-09-26–2025-09-26</td>\n<td>1</td>\n<td>5КБ</td>\n<td>Продолжение того же штурма (бог даёт себя есть, болезнь = слово = магия). В записи прямо: «вселенная не названа»; в следующем окне идею хотят сделать истоком мистики безымянного мира.</td>\n<td><code>kb/sushnosti/miry/MR-0160-bog-kotorogo-edyat.md</code></td>\n</tr>\n<tr>\n<td><code>MR-0163</code></td>\n<td>Пожиратели богов</td>\n<td>2025-10-02–2025-10-02</td>\n<td>1</td>\n<td>4КБ</td>\n<td>Возврат к пожиранию богов как первоисточнику мистики того же безымянного мира (2025-10-02, «ура есть мир»). Связь с апостолами и мировым древом в окне не проговорена, названия вселенной нет.</td>\n<td><code>kb/sushnosti/miry/MR-0163-pozhirateli-bogov.md</code></td>\n</tr>\n<tr>\n<td><code>MR-0176</code></td>\n<td>Обратные</td>\n<td>2025-11-18–2025-11-20</td>\n<td>2</td>\n<td>13КБ</td>\n<td>Слава прямо объявляет: «по основам сна пытаюсь создать маленькую вселенную, что заброшу потом» — это отрезок 2025-11-18–2025-12-06, у которого имени в чате нет. Вселенная опознана, но безымянна, поэтому честнее «неясно».</td>\n<td><code>kb/sushnosti/miry/MR-0176-obratnye.md</code></td>\n</tr>\n<tr>\n<td><code>MR-0192</code></td>\n<td>Чёрные места</td>\n<td>2026-04-19–2026-04-25</td>\n<td>2</td>\n<td>4КБ</td>\n<td>Дословно [462207]: «в нашем мире есть только два аспекта — благословенный и чёрные места». Это второй аспект той самой вселенной без энергии, которой автор имени не дал (объявление 462203); в самой карточке «Часть чего» указано «В</td>\n<td><code>kb/sushnosti/miry/MR-0192-chernye-mesta.md</code></td>\n</tr>\n<tr>\n<td><code>MR-0193</code></td>\n<td>Вселенная героев и злодеев</td>\n<td>2026-06-02–2026-06-02</td>\n<td>2</td>\n<td>12КБ</td>\n<td>Это и есть карточка самой вселенной, объявленной 486999 (2026-06-02): «Короче вселенная простая». В хронологии этот отрезок значится «неясно», названия в чате не дано, в файле стоит явная пометка «названия вселенной в чате нет». Н</td>\n<td><code>kb/sushnosti/miry/MR-0193-vselennaya-geroev-i-zlodeev.md</code></td>\n</tr>\n<tr>\n<td><code>MR-0194</code></td>\n<td>Ассоциация</td>\n<td>2026-06-02–2026-06-03</td>\n<td>3</td>\n<td>13КБ</td>\n<td>Ассоциация — часть той же безымянной вселенной 2026-06-02 (487001–487005, 487176, 487514). В версии 3 звучит и «Оам» (Праведник усиляет себя Оам, у Нуара больше всего Оам), и апостолы — то есть смешаны опорные термины сразу двух п</td>\n<td><code>kb/sushnosti/miry/MR-0194-associaciya.md</code></td>\n</tr>\n<tr>\n<td><code>MR-0195</code></td>\n<td>Искусственные сверхлюди (ИС)</td>\n<td>2026-06-02–2026-06-02</td>\n<td>1</td>\n<td>5КБ</td>\n<td>Механика ИС описана в 487001–487006 — том же объявлении безымянной вселенной. «Проект апостолов, 12 созданных ИС» здесь переопределяет апостолов как искусственных сверхлюдей, то есть это переработка, а не вселенная «Апостол» (в VS</td>\n<td><code>kb/sushnosti/miry/MR-0195-iskusstvennye-sverhlyudi-is.md</code></td>\n</tr>\n<tr>\n<td><code>MR-0196</code></td>\n<td>Столпы злодеев</td>\n<td>2026-06-02–2026-06-03</td>\n<td>2</td>\n<td>4КБ</td>\n<td>Столпы злодеев — зеркало шести столпов героев из объявления 487003, то есть структура новой безымянной вселенной 2026-06-02. Нуар здесь фигурирует как перенесённый персонаж (он ходит по многим вселенным), названия вселенной в мате</td>\n<td><code>kb/sushnosti/miry/MR-0196-stolpy-zlodeev.md</code></td>\n</tr>\n<tr>\n<td><code>MR-0197</code></td>\n<td>Секта Фалим</td>\n<td>2026-06-03–2026-06-03</td>\n<td>1</td>\n<td>3КБ</td>\n<td>Секта Фалим придумана прямо в 487531 внутри мира с Ассоциацией, злодеями, Нимбом и культом (об этом культе Слава и говорил в объявлении 487001). Название вселенной в чате так и не прозвучало.</td>\n<td><code>kb/sushnosti/miry/MR-0197-sekta-falim.md</code></td>\n</tr>\n<tr>\n<td><code>MR-0203</code></td>\n<td>Инквизиторы</td>\n<td>2026-06-03–2026-06-09</td>\n<td>2</td>\n<td>5КБ</td>\n<td>Инквизиторы охотятся на сверхлюдей в той же безымянной вселенной 2026-06-02 (один инквизитор с чистой Оам состоит в секте Фалим). «Оам» здесь — перенесённая система энергии, не признак вселенной Оам; та закрыта 2026-04-19.</td>\n<td><code>kb/sushnosti/miry/MR-0203-inkvizitory.md</code></td>\n</tr>\n<tr>\n<td><code>MR-0198</code></td>\n<td>Программа в голове (конструкция Оам)</td>\n<td>2026-06-07–2026-06-07</td>\n<td>1</td>\n<td>12КБ</td>\n<td>Базовый закон «способность = готовая конструкция Оам» изложен 488545–488546 как устройство текущей переделанной вселенной (три слота у СЛ, материализация, ОУ). Слово «Оам» здесь — название энергии, перенесённой в новую вселенную 2</td>\n<td><code>kb/sushnosti/miry/MR-0198-programma-v-golove-konstrukciya-oam.md</code></td>\n</tr>\n<tr>\n<td><code>MR-0202</code></td>\n<td>Фантазёры и провал в свой мир</td>\n<td>2026-06-07–2026-06-09</td>\n<td>2</td>\n<td>14КБ</td>\n<td>Фантазёры и провал в свой мир — механика, вводимая в 2026-06-07/09 внутри мира со столпами, Нимбом и Оам, то есть в безымянной вселенной 2026-06-02. Ни имени вселенной, ни термина, однозначно принадлежащего названной вселенной.</td>\n<td><code>kb/sushnosti/miry/MR-0202-fantazery-i-proval-v-svoy-mir.md</code></td>\n</tr>\n<tr>\n<td><code>MR-0199</code></td>\n<td>Сверхлюди и война</td>\n<td>2026-06-09–2026-06-09</td>\n<td>1</td>\n<td>2КБ</td>\n<td>Вопрос-ответ про участие сверхлюдей в войне (488778–488783) без единого имени, термина или персонажа. Следом идёт реплика «приходится переделывать всех персов под вселенную» — то есть речь о текущей безымянной вселенной 2026-06-02</td>\n<td><code>kb/sushnosti/miry/MR-0199-sverhlyudi-i-voyna.md</code></td>\n</tr>\n<tr>\n<td><code>MR-0200</code></td>\n<td>СОЭ (странная особая энергия)</td>\n<td>2026-06-09–2026-06-09</td>\n<td>1</td>\n<td>9КБ</td>\n<td>СОЭ вводится именно как НЕ Оам — новая энергия первого слоя мира матери Энига. Это собственная механика безымянной вселенной 2026-06-02; ссылка на Оам здесь противопоставительная и вселенную Оам не подтверждает.</td>\n<td><code>kb/sushnosti/miry/MR-0200-soe-strannaya-osobaya-energiya.md</code></td>\n</tr>\n<tr>\n<td><code>MR-0201</code></td>\n<td>Первый слой мира матери Энига</td>\n<td>2026-06-09–2026-06-09</td>\n<td>1</td>\n<td>8КБ</td>\n<td>2026-06-09 — попадает в отрезок 2026-06-02…конец архива, который в хронологии сам помечен «неясно» (объявление 486999, названия нет). В материале (488784) фигурируют «сл», «ис», «фантазёры», «оам», но энергия СОЭ прямо противопост</td>\n<td><code>kb/sushnosti/miry/MR-0201-pervyy-sloy-mira-materi-eniga.md</code></td>\n</tr>\n<tr>\n<td><code>MR-0204</code></td>\n<td>Насла</td>\n<td>2026-06-17–2026-06-17</td>\n<td>2</td>\n<td>7КБ</td>\n<td>Организация Насла (491162). Идеология построена на «сл» и «тех, кто контролирует оам», но вселенная не поименована. Отрезок 2026-06-02…конец архива в хронологии безымянный; объявление 486999 упоминает Ассоциацию, злодеев, Нимб и к</td>\n<td><code>kb/sushnosti/miry/MR-0204-nasla.md</code></td>\n</tr>\n<tr>\n<td><code>MR-0206</code></td>\n<td>СЛ (люди со способностями)</td>\n<td>2026-06-17–2026-07-23</td>\n<td>2</td>\n<td>5КБ</td>\n<td>Термин «сл» (люди со способностями), 491162 и 509170-509176. Рядом «ис» и «оам», но вселенная не названа; сокращение «ис» даже не расшифровано. Дата в безымянном отрезке.</td>\n<td><code>kb/sushnosti/miry/MR-0206-sl-lyudi-so-sposobnostyami.md</code></td>\n</tr>\n<tr>\n<td><code>MR-0205</code></td>\n<td>Использование сверхлюдей государствами в войнах</td>\n<td>2026-07-23–2026-07-23</td>\n<td>1</td>\n<td>3КБ</td>\n<td>Вопрос об устройстве мира: почему государства не применяют сл в войнах (509170-509176). Термин «сл» общий для безымянного финального мира, названия вселенной нет, обсуждение оборвано.</td>\n<td><code>kb/sushnosti/miry/MR-0205-ispolzovanie-sverhlyudey-gosudarstvami-v-voynah.md</code></td>\n</tr>\n</tbody>\n</table></div>", "r": []}, {"t": "Монумент — 6", "a": ["DOC-NEYASNO--monument-6"], "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>id</th>\n<th>Название</th>\n<th>Даты</th>\n<th>Версий</th>\n<th>Объём</th>\n<th>Почему не привязано</th>\n<th>Исходник</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>MN-0003</code></td>\n<td>Грибница</td>\n<td>2024-07-31–2024-07-31</td>\n<td>3</td>\n<td>6КБ</td>\n<td>Грибница из Антарктиды — принятая причина апокалипсиса в том же разговоре 2024-07-31, то есть материал безымянного отрезка 2024-07-31 — 2024-08-08. Имени вселенной в чате нет.</td>\n<td><code>kb/sushnosti/monumenty/MN-0003-gribnica.md</code></td>\n</tr>\n<tr>\n<td><code>MN-0021</code></td>\n<td>Мировое древо</td>\n<td>2025-10-02–2025-10-02</td>\n<td>1</td>\n<td>3КБ</td>\n<td>Порождающее начало «пока что не сформировавшегося мира» безымянной пересборки: рядом в списке апостолы-насекомые, Каменный Поротой, Азуриэль, дети мирового древа. Своего имени у этой вселенной в чате нет.</td>\n<td><code>kb/sushnosti/monumenty/MN-0021-mirovoe-drevo.md</code></td>\n</tr>\n<tr>\n<td><code>MN-0023</code></td>\n<td>Домик с механизмом</td>\n<td>2025-11-18–2025-11-18</td>\n<td>1</td>\n<td>6КБ</td>\n<td>Ключевой объект того же сна — пример «непонятной постройки» обратных. Принадлежит той же безымянной маленькой вселенной, имени в чате не прозвучало.</td>\n<td><code>kb/sushnosti/monumenty/MN-0023-domik-s-mehanizmom.md</code></td>\n</tr>\n<tr>\n<td><code>MN-0024</code></td>\n<td>Цирк ведущего</td>\n<td>2025-11-21–2025-11-21</td>\n<td>2</td>\n<td>50КБ</td>\n<td>Дословно прочитан материал [387591–387599]: это самостоятельный ужастик «Шут в костюме» — сцена, ведущий, чудики в фарфоровых масках, маска-воспоминание. Ни одного термина вселенных (апостолы, благословенные, Оам, острова, абакра)</td>\n<td><code>kb/sushnosti/monumenty/MN-0024-cirk-veduschego.md</code></td>\n</tr>\n<tr>\n<td><code>MN-0025</code></td>\n<td>Тьма под сценой</td>\n<td>2025-11-21–2025-11-21</td>\n<td>1</td>\n<td>15КБ</td>\n<td>Часть того же рассказа «Шут в костюме» [387594–387595]: тьма под полом сцены и свет с криками под ней. Опорных терминов ни одной названной вселенной нет; отрезок по дате безымянный и по содержанию («обратные») не совпадает.</td>\n<td><code>kb/sushnosti/monumenty/MN-0025-tma-pod-scenoy.md</code></td>\n</tr>\n<tr>\n<td><code>MN-0026</code></td>\n<td>Деревня в «Закате»</td>\n<td>2025-11-21–2025-11-21</td>\n<td>1</td>\n<td>12КБ</td>\n<td>Место действия отдельного рассказа «Закат» [387600–387602] (деревенский участок, баня, огород, за забором — безкожие существа). Помечен «Черновики». Ни системы сил, ни терминов названных вселенных; по дате — безымянный отрезок.</td>\n<td><code>kb/sushnosti/monumenty/MN-0026-derevnya-v-zakate.md</code></td>\n</tr>\n</tbody>\n</table></div>", "r": []}, {"t": "История — 12", "a": ["DOC-NEYASNO--istoriya-12"], "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>id</th>\n<th>Название</th>\n<th>Даты</th>\n<th>Версий</th>\n<th>Объём</th>\n<th>Почему не привязано</th>\n<th>Исходник</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>IS-0001</code></td>\n<td>Малолетний нигилист</td>\n<td>2022-04-19–2022-04-19</td>\n<td>1</td>\n<td>3КБ</td>\n<td>Стих-биография «Малолетний нигилист», записан 2022-04-19 («Сейчас сочинил»). Авторский вымысел, но ни имени вселенной, ни опорных терминов; дата задолго до первого отрезка хронологии. В файле прямо: «Вселенная не объявлена».</td>\n<td><code>kb/sushnosti/istorii/IS-0001-maloletniy-nigilist.md</code></td>\n</tr>\n<tr>\n<td><code>IS-0002</code></td>\n<td>Повсюду челюсти</td>\n<td>2022-04-19–2022-04-19</td>\n<td>1</td>\n<td>3КБ</td>\n<td>Текст-песня «Повсюду челюсти», 2022-04-19. Вымысел б
