<script>const BASE="";const DOCNAME="Мир Оам";

const CH=[{"t": "Устройство", "a": ["S01", "MR-0165-S01", "MR-0165--ustroystvo"], "h": "<p>Мир, названный по частицам Оам, которые в нём распространены.</p>\n<p><strong>Падение метеоритов.</strong> Исходное событие отнесено ко времени, «когда были ещё племена по всему миру, а не государство» (2025-10-20, id 376401). На землю приземлились метеориты — «словно гнев самих богов по всему миру послышались взрывы и земля задрожала». Из этих небесных тел «выпустились в воздух, триллион неизвестных частиц. Невидимых и неосязаемых также как и заряженный частицы, но они есть».</p>\n<p><strong>Вымирание.</strong> Частицы заполонили весь мир, весь воздух был пропитан ими. Всё живое, что вдыхало их, быстро гибло: «Лёгкие заполнялось Оам и медленно разрывались на куски». Люди гибли так же, как и животные; лишь некоторые были способны прожить хотя бы 30 лет, а после умирали. Поколения сменяли поколения, пока у людей не возник иммунитет «во время эволюции и адаптации, как и у других животных». Уже после этого частицы, «вылетевший из небесных тел и погубивший миллиарды жизни», назвали Оам.</p>\n<p><strong>Исследование мест падения.</strong> Пережив кризисный момент в истории, люди заинтересовались, откуда появилось «проклятия бога», и начали исследовать территорию. На местах приземления метеоритов окружающая среда мутировала под активным воздействием Оам. Оказавшись там и вдохнув или испив насыщенную Оам жидкость или воздух, люди умирали, как их давние предки, — «Но с исключением некоторый люди выживали и могли творить чудо. По их словам они начали чувствовать внутреннюю энергию».</p>\n<p><strong>Природа Оам.</strong> Оам — «неизвестной частицей, что может вырабатывать энергию в огромных количествах». Долгое время частицы были токсичны для живых организмов, но после адаптации стали нейтральными. Насыщены Оам воздух и некоторые водоёмы. Отдельная реплика в переписке описывает Оам как «мелкий крупицы летающий в воздухе» (2025-11-05, id 382109, в файле <a href=\"MR-0167.html\">Амофцы</a>).</p>\n<p><strong>Поглощение и ёмкость.</strong> Человек вдыхает Оам, то есть поглощает его; поглощение может идти и просто через кожу, но дыхание — «более быстрый и способ но который мы можем хоть как-то повлиять». Дальше Оам по кровеносной системе вместе с кислородом проходит через всё тело, где-то оседая — зависимо от человека. Так же зависимо от человека в нём накапливается определённое количество Оам: «то есть у каждого человека своя ёмкость Оам».</p>\n<p>Если у человека накапливается больше Оам, чем предусматривает его ёмкость, то Оам выходит через споры, с выдохом, просто через кожу либо другими способами выделения. Выпуск лишнего Оам происходит чуть быстрее, чем поглощение.</p>\n<p><strong>Как открывается доступ.</strong> «В каждым человеке есть Оам но использовать его не как нельзя. Но есть способ.» Если человек поглотит что-то с большой концентрацией Оам — воду либо вдохнёт воздух с большими концентрациями, — его тело просто не успевает выпускать Оам. Дальше два исхода:</p>\n<ul>\n<li>Первый: «Либо из-за большого количества Оам его лёгкий или сосуд лопаются, либо Оам просто остановит сердца либо Оам из-за своей токсичности убьет человека».</li>\n<li>Второй: «человеку удаётся почувствовать и обуздать Оам». Он сдерживает Оам, чтобы тот не навредил телу, — сдерживает до тех пор, пока избытки Оам не выйдут естественным путём. После выхода избытков человек сможет пользоваться Оам, «ведь он уже почувствовал и сдерживал Оам».</li>\n</ul>\n<p><strong>Животные.</strong> У животных это происходит более инстинктивно, поэтому шанс выживаемости у них больше, чем у людей. Но они не могут раскрыть весь потенциал.</p>\n<p><strong>Мутанты и мутировавшая среда.</strong> Мутанты — «это животное и люди, у которых под воздействием Оам изменилось их физиология». Кроме того, есть «некоторый окружающей среды что под воздействием Оам обрели какой-либо воздействия на живых существ».</p>\n<p><strong>Объекты мира, названные отдельно</strong> (все — 2025-10-20, id 376413–376416):</p>\n<ul>\n<li>Чёрные озёра — «Чёрная озера, что превращает людей в монстров стоит им туда нырнуть. Это места куда упала один из метеоритов».</li>\n<li>Артефакты — «предметы созданный из материалов, который находились близко к метеоритом, либо из осколков самого метеорита».</li>\n<li>Камень желания — «пропитанное большим количеством оам кристаллы. Что при разрушение способны попадать в живой организм делая его сильнее быстрее и д. т. Но медленно превращая его в камень желания».</li>\n</ul>", "r": [["Амофцы", "MR-0167.html"]]}, {"t": "Население", "a": ["S02", "MR-0165-S02", "MR-0165--naselenie"], "h": "<p>Люди — обычные, с иммунитетом к Оам, у каждого своя ёмкость Оам, доступ к использованию открывается только через описанное выше переполнение.</p>\n<p>Дальше перечислены мутанты (2025-10-20, id 376401–376402).</p>\n<p><strong>Апостолы.</strong> «Это люди, у которых в утробе матери мутировало нервную систему мозг и глаза.» Из-за этого их пять чувств, работоспособность мозга, реакция, точность выше, чем у обычного человека, в несколько раз.</p>\n<p>Обуздать Оам они могут без поглощения огромного количества Оам: «Им достаточно пережить одну эмоциональную ситуацию, и они неосознанно воспользуются Оам». Дальше они могут пользоваться им без проблем.</p>\n<p>Также они могут использовать белые глаза, направив туда Оам. После активации белых глаз для них время замедляется — «(но они не становятся быстрее)» — и все их чувства улучшаются, они становятся сверхчувствительными: зрение, слух, осязание, запах и вкус. Из-за этого и боль они ощущают больнее. «Но зато у них словно всё на ладони они ощущать и видят всё что находиться вокруг. И способны словно предсказывать движение противников по слуху или зрению. И становятся невероятно точными.» У них лучший контроль Оам.</p>\n<p><strong>Аскизы.</strong> «Маток Аскизы была просто Аксолотлой. Но после в водоём, где она жила упал метеорит и под огромным воздействием Оам она мутировала и начала производить Оам.»</p>\n<p>Сами аскизы — навечно дети лет 7–10 на вид, с белоснежной кожей, с розовыми оттенками (или другими оттенками) и с чертами аксолотля. Эти дети не стареют. У них быстрая регенерация и зверский аппетит: «Они могут съесть человека целиком за пару минут. У них инстинкт голода выше разума. Они не чувствуют боли. И разумом они всегда как дети».</p>\n<p>Матка выделяет их из яиц, подобно муравьиной матке. Матка большая, ростом 4 метра и в ширину такая же, «больше похожая на червя с огромными количествами лапок. Но с такой же белоснежное кожей».</p>\n<p>Как рождаются аскизы — «Как они рождаются я ещё не придумал».</p>\n<p><strong>Дети мирового древа.</strong> Произошли от дерева, мутировавшего из-за большого количества Оам. «Это гуманноидный деревянный существо с оранжевой сердцевинной, в котором как раз и хранится Оам.» Могут изменить образ на человеческий.</p>\n<p>Поскольку они из дерева мирового древа: «Хрен ты их пробьешь, не кто из апостоловы не сможет нормально их ранить, а если ранят они будут регенерировать». Они сверхсильные — «сильнейший наверное в физическом плане». Могут передвигаться в земле и внутри деревьев. Огонь им не вредит, сам огонь на них тухнет. Могут выпускать корни «туда сюда» и ими драться.</p>\n<p><strong>Азуриэль.</strong> «Это было группа лиц, чей дети мутировали полностью превратившись Азуриэль. Они с рождения могут использовать Оам и скорость поглощения и выделения Оам у них выше чем у кого либо.»</p>\n<p>Описание внешности: гуманоид человеческого роста, с синей кожей («не точно может розовый»), с острыми ушами, как у эльфа. На лице красивые узоры разного цвета, которые могут меняться в зависимости от эмоций. Одежда зимняя. Сам он гибкий. Эмпатия, «Прекрасно ощущать намерения».</p>\n<p>Дальше в переписке идёт уточнение под пометкой «Слава дондоков» — «Азуриэль: Нейро-сканер. Его способность это не эзотерическая эмпатия, а гиперразвитое чувство, позволяющее напрямую считывать и интерпретировать биоэлектрическую активность нервной системы других существ». Ограничение: «находясь в толпе он теряется и не может сконцетрироваться».</p>\n<p><strong>Поротай.</strong> «Это мутировавший жук.» Если его съест человек, у него три варианта:</p>\n<ol>\n<li>Смерть — «все твои внутренности превращаются в камень и отказывают».</li>\n<li>Превращение в низшего Поротая — «горбатого двух ликого, полукаменного-полуплоти, и ты теряешь личностей и слушаешь высшего Поротая». Способности: крепкость, реген, сверхсила.</li>\n<li>Превращение в высшего Поротая — «сохраняешь свой человеческий образ и личность». Способности: реген, контроль над низшими, превращать части тела в твёрдый камень, сверхчеловеческая сила.</li>\n</ol>\n<p>Дебафф: «у тебя появляется вторая личность жестокая, кровожадная, алчная и т.д. И она составляет чаще всего становится жестоким кровожадным и т.д».</p>\n<p><strong>Вампиры.</strong> «Это люди у которых мутировала кровь и пищевая система под воздействием Оам.» Из-за этого, если они испьют кровь, то способны почувствовать Оам и так по итогу научиться его контролировать. Также, выпивая кровь, они могут пополнять запасы Оам. Их мутировавшая кровь «легко контролируемая подобно конечности».</p>\n<p><strong>Общее название.</strong> Отдельным разговором подбиралось общее слово для существ, способных пользоваться Оам, — см. <a href=\"MR-0167.html\">Амофцы</a>.</p>", "r": [["Амофцы", "MR-0167.html"]]}, {"t": "Место во вселенной", "a": ["S03", "MR-0165-S03", "MR-0165--mesto-vo-vselennoy"], "h": "<p>Действие истории отнесено к современности: «История будет происходит в современном мире, где давно забыли о существовании Оам. Лишь некоторый люди знают о нём и исследуют» (2025-10-20, id 376417).</p>\n<p>В переписке мир связан с Артефактами, Камнем желания, Оам и Чёрными озёрами.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0165-S04", "MR-0165--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-10-20 (id 376399–376403).</strong> Изложена вся история мира от падения метеоритов до появления людей, способных чувствовать внутреннюю энергию: вымирание, адаптация, иммунитет, исследование мест падения, мутировавшая среда. Здесь же даны механика поглощения и ёмкости Оам и весь список мутантов — апостолы, аскизы, дети мирового древа, Азуриэль, Поротай, вампиры. Блок завершается репликами «Вот и все. И вот объяснения» и «Пока что так» (id 376403), то есть подан как черновое, не окончательное изложение.</p>\n<p><strong>Версия 2 — 2025-10-20 (id 376413–376418).</strong> Через несколько минут добавлены отдельные объекты мира — чёрные озёра (id 376413), артефакты (id 376414), камень желания (id 376416) — и зафиксировано время действия: современный мир, где об Оам давно забыли, знают и исследуют лишь некоторые (id 376417).</p>\n<p>Первая версия ничем не отменена; вторая только дополняет её.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0165-S05", "MR-0165--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Название вселенной в этом окне не произнесено — в репликах фигурируют только «Мир» и «Вселенная».</li>\n<li>Как рождаются аскизы — прямо сказано: «Как они рождаются я ещё не придумал».</li>\n<li>Цвет кожи Азуриэль не зафиксирован: «синий кожей( не точно может розовый)».</li>\n<li>Не сказано, сколько было метеоритов и где именно они упали; чёрные озёра описаны как «места куда упала один из метеоритов», но перечня мест падения нет.</li>\n<li>Не сказано, чем именно определяется ёмкость Оам у конкретного человека, — только что она «зависима от человека».</li>\n<li>Не сказано, что происходит с человеком, нырнувшим в чёрное озеро, кроме того, что он превращается в монстра; какие это монстры — не описано.</li>\n<li>Не сказано, за какой срок камень желания «медленно превращает» организм в камень и обратим ли этот процесс.</li>\n<li>Взаимное соотношение мутантов между собой, их численность и расселение в этом окне не обсуждаются.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0165--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0167.html\">Амофцы</a></li>\n<li><strong>Упомянут в мирах:</strong> <a href=\"MR-0167.html\">Амофцы</a>, <a href=\"MR-0172.html\">Церковь с паладинами</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0008.html\">Оам</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0165--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-10-20</td>\n<td>376399–376403</td>\n<td>w0107</td>\n<td>Оам (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-10-20</td>\n<td>376413–376418</td>\n<td>w0107</td>\n<td>Оам (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0165-mir-oam.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0165--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0165.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
