<script>const BASE="";const DOCNAME="Стенд Миколая";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0113-S01", "SP-0113--mehanika"], "h": "<p>Стенд Миколая описан в переписке 2024-09-04 (id 227683–227712, окно w0056). Внешние элементы стенда назвал сам Миколай, перечислив их подряд и не понимая, что они дают: «телефон», «глаз», «щупальца», «это что» (id 227697–227700).</p>\n<p>Механику сформулировал Слава: «Все к чему прикоснуться шупальцы, то ты сможешь сохранить и в случай чего создать дубликат» (id 227701).</p>\n<p>То есть работает связка из двух шагов: касание щупальцем сохраняет объект, а дальше сохранённое можно воспроизвести дубликатом. Что делают телефон и глаз, в переписке не сказано — они названы как части стенда, но механики за ними не закреплено.</p>\n<p>Реакция Миколая на формулировку: «о», «имба», позже «хорошая темка», «молодец», «мне нравится» (id 227702–227708).</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0113-S02", "SP-0113--ogranicheniya-i-cena"], "h": "<p>Единственное названное ограничение — число слотов сохранения: «Но слотов сохранения ограниченный», «6 слотов» (id 227704–227705).</p>\n<p>Можно ли перезаписывать занятый слот, освобождается ли слот после создания дубликата, сколько дубликатов даёт одно сохранение — в переписке не сказано. Цена (расход ресурса, откат, ограничение по времени) не назначена вообще.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0113-S03", "SP-0113--nositeli"], "h": "<p>Миколай. В базе стенд отнесён к Миколаю как часть персонажа.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0113-S04", "SP-0113--kak-menyalas-po-versiyam"], "h": "<p>Версия одна.</p>\n<p><strong>2024-09-04 (id 227683–227712), окно w0056.</strong> Первое и единственное описание: телефон, глаз, щупальца как внешние элементы; сохранение объектов касанием щупалец и создание дубликата; ограничение в 6 слотов сохранения.</p>\n<p>Разговор развивался так: Слава спросил «А ты понял что у тебя за стенд ?», Миколай ответил «нет» и перечислил элементы, Слава тут же выдал механику, следом — ограничение по слотам. После одобрения Миколай переключился на стенд Славы (<a href=\"SP-0114.html\">Стенд Славы</a>) репликой «а знаешь что у тебя за стенд?» (id 227709). К стенду Миколая в дальнейшем не возвращались.</p>", "r": [["Стенд Славы", "SP-0114.html"]]}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0113-S05", "SP-0113--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Парная разработка со стендом Славы (<a href=\"SP-0114.html\">Стенд Славы</a>): оба стенда придуманы в одном разговоре подряд, каждый соавтор придумывал стенд другому. Механики разные: у Миколая — сохранение уже существующего и его дублирование, у Славы — создание чего угодно с нуля на свитке.</p>", "r": [["Стенд Славы", "SP-0114.html"]]}, {"t": "Пробелы", "a": ["S06", "SP-0113-S06", "SP-0113--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вселенная в разговоре нигде не названа; отнесение к «монстрам» в базе сделано по дате объявления.</li>\n<li>Неясно, сохраняются ли только предметы или и живое.</li>\n<li>Телефон и глаз названы как элементы стенда, но что они делают — не сказано.</li>\n<li>Не сказано, что происходит с занятым слотом: перезапись, освобождение после дубликата, срок хранения.</li>\n<li>Не сказано, сколько дубликатов можно создать с одного сохранения и чем дубликат отличается от оригинала.</li>\n<li>Цена способности не назначена — в отличие от стенда Славы, где платой названо время.</li>\n<li>Имя стенда не придумано: он проходит как «мой стенд», «стенд», «стенд Коли (щупальца, телефон, глаз)».</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0113--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0114.html\">Стенд Славы</a></li>\n<li><strong>Упомянут в способностях:</strong> <a href=\"SP-0114.html\">Стенд Славы</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0113--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-09-04</td>\n<td>227683–227712</td>\n<td>w0056</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0113-stend-mikolaya.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0113--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0113.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
