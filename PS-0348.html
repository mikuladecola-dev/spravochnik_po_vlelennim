<script>const BASE="";const DOCNAME="Чудовище из леса";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0348-S01", "PS-0348--proishozhdenie"], "h": "<p>Персонаж Славы, появляется внутри прозаического куска по «Чёрному озеру» (2026-02-08, id 430011–430012). Отдельного обсуждения персонажа в переписке нет: он существует ровно в том объёме, в каком показан в сцене.</p>\n<p>Собственного имени у твари нет. В тексте она называется «чудовище», «чудище», «Это» (с большой буквы — «страх того, что тебя найдёт Это»), в последней реплике рассказчика — «чудовищя».</p>\n<p>Обстоятельства появления: ночью по лесу ходит отряд деревенских мужиков, ищущих кого-то (в тексте — «преступника»). Отряд устал и решает возвращаться домой. В этот момент рассказчик слышит хруст, затем чавкающий звук за спиной; лучи фонарей выхватывают тварь.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0348-S02", "PS-0348--vneshnost"], "h": "<p>Дословно по тексту (id 430011):</p>\n<ul>\n<li>«существо под два метра ростом и также в ширене» — то есть примерно два метра и в высоту, и в ширину;</li>\n<li>«Покрытой черной шерстью», «Массивного лохматого зверя»;</li>\n<li>стоит на двух ногах;</li>\n<li>«Он был без шее. То есть голова и сразу плечи»;</li>\n<li>«Глаза его горели оранжоаым огнем»;</li>\n<li>«в своей массивной руке он держал раздавленную голову» — оттуда идут звуки хруста и чавканья.</li>\n</ul>\n<p>Ниже в той же сцене про глаза сказано иначе — «чудовища, что изучала нас своими глазами бусинками». Оба описания даны в одном куске и не согласованы между собой.</p>\n<p>Рассказчик отдельно фиксирует, что определить существо не может: «Нет... Ну он... Как бы.. Я не знаю».</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0348-S03", "PS-0348--harakter"], "h": "<p>Прямых черт не задано. Что показано поведением:</p>\n<ul>\n<li>при первом контакте не нападает сразу, а рассматривает отряд — «чудовища, что изучала нас своими глазами бусинками»;</li>\n<li>рёв издаёт только после выстрела в морду: «Чудовище взревело, давай понять , что даже прямой выстрел голову ему нипочём».</li>\n</ul>\n<p>Реакция окружающих: время как будто останавливается, мужики, которые «до этого рвались наказать преступника», замирают и только держат на нём луч фонаря, «Боясь потерять его из виду».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0348-S04", "PS-0348--sposobnosti"], "h": "<ul>\n<li><strong>Неуязвимость к выстрелу в голову.</strong> Старый охотник стреляет из ружья «прямо в морду чудовищу»; результат — «даже прямой выстрел голову ему нипочём». Никакого другого урона в сцене твари не наносят.</li>\n<li><strong>Бесшумность.</strong> «Шагов чудовища не было слышно» — и это описано как хуже, а не лучше для рассказчика: «Ведь он также тиха пробрался к нам не издав не звука. Мне было в разы легче когда я его видел и мог хоть как-то понимать, что он будет делать, а сейчас нихрена не ясна».</li>\n<li><strong>Физическая сила.</strong> Раздавленная голова в руке; отдельно рассказчик отказывается лезть на дерево с оценкой «Нет он его лёгким движением повалит».</li>\n</ul>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0348-S05", "PS-0348--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Чёрное озеро</strong> — тварь принадлежит этой истории, в базе значится как её часть.</li>\n<li><strong>Водяные</strong> — связь зафиксирована в базе, но в самом тексте водяные не упомянуты; прямого сцепления в переписке нет.</li>\n<li><strong>Отряд из деревни</strong> — старик/старый охотник с ружьём, стреляющий в тварь; пьяный старый Васька, «у которого вроде как не всё дома в голове», который вытаскивает раненого рассказчика, скидывает его в ямку и забрасывает землёй, травой и ветками; Мишка, «дрожащий словно осиновый листь»; запыхавшийся мужик, предложивший вернуться, — имени рассказчик не знает. Сам рассказчик ведёт повествование от первого лица, имени не имеет.</li>\n<li><strong>Мужчина утром после ночи</strong> — «высокий и подтянутый мужчина в делай рубашке и в чёрных джинсах», «Явно не с деревни», рассказчику незнаком. Появляется наутро, справляя нужду на засыпанного землёй рассказчика, затем предлагает сделать шину на сломанную ногу. Связь этого мужчины с тварью в тексте не установлена; рассказчик машет на него веткой «С мыслью \"может это чудовищя\"», и на этом кусок обрывается.</li>\n</ul>", "r": []}, {"t": "Как менялся", "a": ["S06", "PS-0348-S06", "PS-0348--kak-menyalsya"], "h": "<p><strong>2026-02-08 (id 430011–430012), окно w0116.</strong> Единственная версия. Появление и полное описание сразу целиком, внутри сцены: обнаружение твари отрядом, выстрел охотника, бегство, перелом ноги у рассказчика, укрытие в ямке, ночь под землёй и ветками, утреннее пробуждение и встреча с незнакомым мужчиной.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0348-S07", "PS-0348--chto-s-nim-stalo"], "h": "<p>В сцене тварь не убита и никуда не девается: после выстрела и рёва начинается хаос, отряд разбегается, «сбросив фонарики, топоры и вилы». Дальше она не показывается ни разу — ни ночью, пока рассказчик лежит в ямке («Ничего не происходила»), ни утром. Судьба твари после этой ночи в куске не описана.</p>\n<p>Судьба людей: рассказчик проваливается ногой в яму и ломает её («Хруст..»), Васька уводит его, прячет и убегает; из остальных участников отряда никого больше в тексте не встречается. Погиб ли кто-то, кроме владельца раздавленной головы, не сказано.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0348-S08", "PS-0348--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Природа твари не названа. Что это, откуда взялось, разумно ли — в тексте нет.</li>\n<li>Чья голова была раздавлена у неё в руке — не сказано. Отряд по ходу сцены искал кого-то («преступника», «убежал это уже наверное далековато»), но связь между поисками и раздавленной головой прямо не проведена.</li>\n<li>Связь с водяными в переписке не проговорена; она подразумевается только финальной репликой рассказчика про незнакомого мужчину — «может это чудовищя», и превращаться ли твари в человека, в тексте не сказано.</li>\n<li>Два описания глаз («горели оранжоаым огнем» и «глазами бусинками») не согласованы.</li>\n<li>Останавливает ли тварь что-нибудь, кроме огнестрельного оружия, которое на неё не действует, — не проверено, других попыток в сцене нет.</li>\n<li>Что было с остальным отрядом после бегства — не описано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0348--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0348--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-02-08</td>\n<td>430011–430012</td>\n<td>w0116</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0348-chudovische-iz-lesa.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0348--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0348.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
