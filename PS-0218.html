<script>const BASE="";const DOCNAME="Эльф (чужемирец)";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0218-S01", "PS-0218--proishozhdenie"], "h": "<p>Эльф — чужемирец, он же «чужестранец». Материал по нему целиком укладывается в один вечер (2025-03-10, id 300761–300793, окно w0079).</p>\n<p>Происхождение задано одной фразой Славы: «Эльф попав в наш мир почувствовал апостола и решил его убить». То есть эльф приходит извне, из другого мира, и его появление в нашем мире предшествует всему, что он делает. Откуда именно он попал, как именно попал и почему оказался здесь — в переписке не сказано.</p>\n<p>Отдельно и настойчиво оговорено, к чему эльф отношения не имеет: «и всё эльф вообще не причастен к становлению апостолом».</p>", "r": []}, {"t": "Способности", "a": ["S02", "PS-0218-S02", "PS-0218--sposobnosti"], "h": "<p>Названа одна: эльф способен почувствовать апостола, оказавшись в нашем мире. Механика этого чутья не описана — говорится только «почувствовал апостола». Других способностей эльфа в переписке нет.</p>", "r": []}, {"t": "Связи с другими", "a": ["S03", "PS-0218-S03", "PS-0218--svyazi-s-drugimi"], "h": "<p>С апостолом — через мотив: почуяв апостола, эльф «решил его убить». Убийство апостола — единственная названная цель персонажа.</p>\n<p>С Бессмертным — связь отрицательная и оговорена отдельно (см. ниже раздел о версиях): эльф не причастен ни к гибели деревни Лихой, ни к пробуждению способностей Бессмертного. Тот монстр, которого боялся отряд старика, — не эльф.</p>\n<p>С деревней Лихой — тоже отрицательная. По версии Славы деревню «заехали немцы и всех поубивали», а Бессмертного убили пистолетом, «который потом им пахнет».</p>\n<p>С отрядом (старик, рыжий, Доктор, капитан) — прямой связи не названо. Отряд упоминается в том же разговоре, но только в связи с Бессмертным: «Старик, рыжий, Доктор и капитан русский солдаты, вот поэтому он их понимает».</p>\n<p>Эльф отнесён к чужамирцам.</p>", "r": []}, {"t": "Как менялся", "a": ["S04", "PS-0218-S04", "PS-0218--kak-menyalsya"], "h": "<p><strong>2025-03-10, id 300761–300766.</strong> Разговор начинается с того, что Миколай пересказывает своё понимание прочитанного: «есть деревня Лихая. там всех убил эльф и в этой деревне образовалась могила яма с солдатами»; «как я понял эльф это чужестранец, а дед с шрамами слезами кто-то из апостолов»; «и крч этот эльф пробудил способности гг».</p>\n<p>Слава отвечает «Нет» и снимает с эльфа обе функции сразу — и вырезание деревни, и пробуждение способностей героя. Остаётся только мотив охоты на апостола. Эльф при этом остаётся чужестранцем — эту часть понимания Миколая Слава не опровергает.</p>\n<p><strong>2025-03-10, id 300784–300793.</strong> Повторное уточнение в ту же сторону. Слава: «Этот эльф вообще появился только в конце и слова не сказал, что причастен к смертей жителей деревни». Здесь добавляется композиционная деталь, которой не было в первом заходе: эльф появляется только в конце истории и о своей причастности ничего не говорит.</p>\n<p>Миколай объясняет, откуда взялась его версия: «ну хз, я что-то прочел что был монстр которого команда старика боялась», «и типа это эльф я решил». Слава: «Монстр это Бессмертный».</p>", "r": []}, {"t": "Отклонённые варианты", "a": ["S05", "PS-0218-S05", "PS-0218--otklonennye-varianty"], "h": "<p>Всё, что предложил Миколай в id 300761–300763, Слава забраковал:</p>\n<ul>\n<li>эльф убил всех в деревне Лихой — нет, деревню вырезали немцы;</li>\n<li>эльф пробудил способности главного героя — нет, «эльф вообще не причастен к становлению апостолом»;</li>\n<li>эльф — тот монстр, которого боялся отряд старика — нет, «Монстр это Бессмертный».</li>\n</ul>\n<p>Сам Миколай отметил, что выводил это сложением из прочитанного: «и делал всякое сложение», «которое и написал». Слава на это заметил, что часть сведений о Бессмертном была передана устно: «Когда мы гуляли я тебе покормил некоторой информации насчёт Бессмертного».</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0218-S06", "PS-0218--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Внешность эльфа не описана вообще.</li>\n<li>Характер не описан. Единственное поведенческое указание — что он «слова не сказал».</li>\n<li>Имени у персонажа нет, он назван по виду: эльф, чужестранец.</li>\n<li>Из какого мира попал и как — в переписке не сказано.</li>\n<li>Чем кончилось его намерение убить апостола — осталось нерешённым; сказано только, что он появляется в конце истории.</li>\n<li>Механика того, как он «почувствовал апостола», не объяснена.</li>\n<li>Связь эльфа с остальными чужамирцами не расписана.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0218--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0019.html\">Чужемирцы</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0019.html\">Чужемирцы</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0218--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-03-10</td>\n<td>300761–300766</td>\n<td>w0079</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-10</td>\n<td>300784–300793</td>\n<td>w0079</td>\n<td>Апостол (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0218-elf-chuzhemirec.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0218--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0218.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0218-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0218/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — не сам эльф, а то, что он единственный обитатель пустой категории. <code>SL-0089</code> «Список категорий сил (Благословенный, Арбетары, Альфы, Чужемирцы, Владельцы артефактов, Фантазёры)»: четыре ссылки, статьи нет, база 1 753. Чужемирцы там объявлены как один из шести разрядов силы, и пока список не разобран, непонятно, во что именно эльф записан. Хуже того, само понятие лежит в четырёх местах сразу: <code>PS-0198</code> «Чужемирцы» (одна ссылка, статья есть, база 58 680), <code>MR-0117</code> «Чужемирцы» (две ссылки, база 1 818), <code>MR-0100</code> «Чужемирцы и аномальные люди» (две ссылки, база 3 285) и группа <code>GR-0019</code>. Четыре записи об одном, и обобщающий список, на который ссылаются чаще всех четырёх, — без статьи.</p>\n<p>Вторая, и она прямо про эту статью: <code>PS-0212</code> «Эльф с ветряным мечом» (база 41 260) и <code>PS-0218</code> — две записи, обе в <code>GR-0019</code>, обе про эльфа в деревне Лихой, обе с отрядом старика и Бессмертным рядом. Разговор 2025-03-10, из которого собран <code>PS-0218</code>, — это разбор прозы 2025-03-03, из которой собран <code>PS-0212</code>. Связи между ними нет ни в одну сторону. Пока не решено, одна это фигура или две, обе статьи стоят на нерешённом.</p>\n<p>Третья: <code>SL-0054</code> «Список 12 апостолов» — три ссылки, статьи нет, база 234 052. Весь мотив эльфа — «почувствовал апостола и решил его убить». Кого именно он почувствовал, негде посмотреть: самая большая нетронутая куча базы во вселенной.</p>\n<h3>С чего начать</h3>\n<p>В архив за самим эльфом ходить незачем: весь материал — один вечер 2025-03-10, id 300761–300793, окно w0079, и он уже в базе целиком.</p>\n<p>Ходить надо по соседям, куда разъехался тот же разговор. <code>MN-0015</code> «Деревня Лихая» (32 900) держит куски именно из 300761 и 300777–300780 — про вторую мировую и про то, чья это деревня. <code>PS-0211</code> «Мальчик из братской могилы (Бессмертный)» (58 295) — там ответ Славы «Монстр это Бессмертный» имеет продолжение. <code>PS-0219</code> «Отряд: Старик, Рыжий, Доктор, Капитан» (7 997) — реплика «русские солдаты, вот поэтому он их понимает» из этого же окна.</p>\n<p>Отдельно: одну ниточку в архиве не найти вообще. Слава сам сказал — «Когда мы гуляли я тебе покормил некоторой информации насчёт Бессмертного». Это не пробел переписки, это материал, которого в переписке никогда не было. Его надо не искать, а спрашивать.</p>\n<h3>Как развивалось</h3>\n<p>Здесь всё сжалось в один вечер. Заявили и ограничили с разницей в минуты: Миколай в id 300761–300763 приписывает эльфу три функции — вырезал деревню, пробудил способности героя, он же монстр отряда, — и Слава в 300764–300766 снимает все три подряд. Через полчаса, в 300784–300793, то же самое повторяется вторым заходом, и на повторе добавляется единственное, чего не было в первом: эльф появляется только в конце и о причастности молчит. Дальше — не возвращались ни разу. Ограничение здесь пришло раньше, чем персонаж успел что-нибудь набрать.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>В справочнике есть <code>SP-0182</code> «Чутьё на чужемирцев» — отдельная статья на 8 882 базы про то, как здешние распознают пришедших извне. Правило названо в одну сторону. Эльф в этой статье делает ровно обратное: попав в наш мир, он «почувствовал апостола». То есть чутьё работает и от чужемирца к местным — но для этой стороны ни записи, ни правила нет. Для здешних, чующих чужих, механика проговорена; для чужого, чующего апостола, — нет.</p>\n<h3>Отклик</h3>\n<p>Забавно, что статья целиком собрана из «нет». Три раза подряд: не он вырезал деревню, не он пробудил способности, не он тот монстр. После всех вычитаний от персонажа остаётся ровно одно предложение — пришёл, почуял, решил убить, — и это, пожалуй, честнее, чем если бы дыры замазали. А зацепило другое: реплика Миколая «я что-то прочел что был монстр которого команда старика боялась», «и типа это эльф я решил», «и делал всякое сложение». Это же в чистом виде читатель, который достраивает мир из недостаточного текста — и достраивает неправильно, но связно. Его неверная версия (эльф как источник всей беды деревни) устроена аккуратнее авторской, и видно, почему она собралась именно так. И рядом — «когда мы гуляли я тебе покормил информации»: половина канона существовала в устной форме, и вот эту половину уже не восстановить.</p></div>", "r": []}];</script>
