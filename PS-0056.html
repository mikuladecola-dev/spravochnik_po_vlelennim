<script>const BASE="";const DOCNAME="Витрофунгус";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0056-S01", "PS-0056--proishozhdenie"], "h": "<p>Витрофунгус (Vitrofungus) — персонаж вселенной «игра бога», предложенный Миколаем 2024-04-06 (id 154417, окно w0030). Имя переводится самими авторами как «стеклогриб». Персонаж возник в ходе разработки многоликого — способности перевоплощения в 10 разных существ — как один из вариантов формы для этого перевоплощения. В этом качестве Слава его отклонил, но оставил как самостоятельного персонажа: «Ну как отдельный персонаж крутой / А как часть способности человека , как та не подходит» (154418). Миколай согласился: «Ну так-то, да» (154419).</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0056-S02", "PS-0056--vneshnost"], "h": "<p>Описание дано Миколаем одним блоком (154417, 2024-04-06 17:26):</p>\n<ul>\n<li>гуманоидные существа с вытянутым телом и конечностями;</li>\n<li>кожа покрыта сетью грибных нитей, «напоминающих грибницу хитридиомицетов»;</li>\n<li>кости и череп состоят из прозрачного стекловидного материала, «просвечивающего изнутри»;</li>\n<li>пальцы на руках и ногах заканчиваются острыми стеклянными когтями;</li>\n<li>большие чёрные глаза «без видимых белков и зрачков»;</li>\n<li>рот усеян острыми стеклянными зубами;</li>\n<li>корни-присоски, которыми существо присасывается к жертве.</li>\n</ul>\n<p>Передвигается «быстрыми рывками, опираясь на все четыре конечности».</p>\n<p>Сводная характеристика облика от Миколая: «Его облик сочетает черты гуманоида, гриба, амфибии и стекла, что делает его очень странным и пугающим созданием».</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0056-S03", "PS-0056--harakter"], "h": "<p>Отдельно характер не прописывался. Названа только роль: «это опасный хищник и паразит, чуждый земной природе», и «Встреча с витрофунгусом не сулит ничего хорошего» (154417).</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0056-S04", "PS-0056--sposobnosti"], "h": "<p>Питание — паразитическое: витрофунгусы «питаются, паразитируя на других живых существах — присасываются к ним специальными корнями-присосками и высасывают питательные вещества» (154417).</p>\n<p>Тела хрупкие, но это работает как оружие: «осколки стекла, на которые они рассыпаются, могут наносить глубокие раны» (154417).</p>\n<p>Во второй версии (154424–154425, 2024-04-06 17:31–17:32) Миколай развернул устройство так, что механика строится на сочетании двух свойств: «Тут просто прикол в том, что кости из стекла, а значит типо резня жёсткая, и может оставлять грибы и они лишают важных для жизни штук, но в тоже время стекло хрупкое, как-то так». Грибы при этом не часть самого существа в смысле паразитирования на нём: «Сами грибы живущие в симбиозе на костях паразитируют при попадании на жертву» (154425). То есть грибы живут в симбиозе на стеклянных костях витрофунгуса, а паразитировать начинают уже на жертве, попав в неё.</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0056-S05", "PS-0056--svyazi-s-drugimi"], "h": "<p>Связан с многоликим и способностью перевоплощения в 10 разных существ — как отклонённый вариант одной из форм.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0056-S06", "PS-0056--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2024-04-06 (id 154415–154419).</strong> Карточка целиком: внешность, паразитический способ питания через корни-присоски, передвижение рывками на четырёх, хрупкое тело, режущие осколки. Здесь же Слава отклоняет его как форму многоликого.</p>\n<p><strong>Версия 2 — 2024-04-06 (id 154423–154427).</strong> Возражение Славы: «Но что бы паразитировать на ком то для него слишком жёстко» (154423). В ответ Миколай переформулирует устройство персонажа: акцент переносится со свободного паразитирования на связку «стеклянные кости → жёсткая резня → в раны попадают грибы, лишающие важных для жизни штук», уравновешенную хрупкостью стекла. Паразитирование грибов перенесено на момент попадания на жертву, а на самом витрофунгусе грибы живут в симбиозе.</p>", "r": []}, {"t": "Отклонённые варианты", "a": ["S07", "PS-0056-S07", "PS-0056--otklonennye-varianty"], "h": "<p>Витрофунгус как форма многоликого — отклонён Славой 2024-04-06 (154418) с формулировкой, что паразитирование «для него слишком жёстко» (154423), то есть слишком жёстко для героя-носителя способности. При этом сам персонаж признан крутым и оставлен.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S08", "PS-0056-S08", "PS-0056--chto-s-nim-stalo"], "h": "<p>Оставлен «как отдельный персонаж» без вселенной и без продолжения. Переписка обрывается на репликах Миколая «Ааааааааа / Я понял» (154426–154427), содержание понятого не названо.</p>", "r": []}, {"t": "Пробелы", "a": ["S09", "PS-0056-S09", "PS-0056--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Мир, откуда витрофунгусы происходят, не назван — сказано только, что существо «чуждо земной природе».</li>\n<li>Численность, общество, язык, культура не обсуждались; неясно даже, идёт ли речь о виде или об одной особи (в описании — множественное число, в отклонении Славы — «отдельный персонаж»).</li>\n<li>Что именно за «важные для жизни штуки» отнимают грибы у жертвы — не расшифровано.</li>\n<li>Что понял Миколай на 154427 — в переписке не сказано.</li>\n<li>Дальнейшая судьба персонажа осталась нерешённой.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0056--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0014.html\">игра бога</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0056--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-04-06</td>\n<td>154415–154419</td>\n<td>w0030</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-04-06</td>\n<td>154423–154427</td>\n<td>w0030</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0056-vitrofungus.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0056--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0056.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
