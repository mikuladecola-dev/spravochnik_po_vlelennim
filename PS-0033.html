<script>const BASE="";const DOCNAME="Феникс";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0033-S01", "PS-0033--proishozhdenie"], "h": "<p>Персонаж относится к периоду, вселенная которого в переписке не названа: вселенная объявлена 2024-02-05, имени в переписке ей не дали. Само упоминание персонажа зафиксировано позже — 2024-03-12 (id 138201–138206, окно w0026).</p>", "r": []}, {"t": "Способности", "a": ["S02", "PS-0033-S02", "PS-0033--sposobnosti"], "h": "<p>Полубессмертие в сочетании с высокой огневой мощью. Слава описывает: «Феникс полу бессмертный чел с харошой огневой мощью». Ни степень «полубессмертия» (что именно его убивает, а что нет), ни характер «огневой мощи» в переписке не расшифрованы.</p>", "r": []}, {"t": "Связи с другими", "a": ["S03", "PS-0033-S03", "PS-0033--svyazi-s-drugimi"], "h": "<p>Назван вторым в перечне Славы, между Человеком с абсолютным нулём (<a href=\"PS-0032.html\">Человек с абсолютным нулём</a>) и Человеком, манипулирующим объектами (<a href=\"PS-0034.html\">Человек, манипулирующий объектами</a>): «Там просто есть челы / С абсолютным нулем который убьет любого кто в него попадет / Феникс полу бессмертный чел с харошой огневой мощью / Чел манипулирующий объектами». Перед этим в переписке упомянут Закон: «Любой кто в радиусе 70 метров должен подчиняться закону» — прямая связь Феникса с этим Законом не проговорена.</p>", "r": [["Человек с абсолютным нулём", "PS-0032.html"], ["Человек, манипулирующий объектами", "PS-0034.html"]]}, {"t": "Как менялся — состояния по датам", "a": ["S04", "PS-0033-S04", "PS-0033--kak-menyalsya"], "h": "<h3>2024-03-12 (id 138201–138206, окно w0026)</h3>\n<p>Единственная версия. Слава называет персонажа в перечне; Миколай реагирует общей репликой «Жесть» на весь перечень, отдельного комментария к Фениксу нет.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S05", "PS-0033-S05", "PS-0033--chto-s-nim-stalo"], "h": "<p>Дальше персонаж не упоминается и не разрабатывается.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0033-S06", "PS-0033--probely"], "h": "<div class=\"gaps\"><p>Помимо имени, кроме одной строки описания способности, о персонаже ничего не известно: не сказано, откуда взялось имя «Феникс», связано ли оно с мифологическим образом (возрождением из пепла), как он выглядит и каков его характер. Вселенная не названа.</p></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0033--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0032.html\">Человек с абсолютным нулём</a>, <a href=\"PS-0034.html\">Человек, манипулирующий объектами</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0032.html\">Человек с абсолютным нулём</a>, <a href=\"PS-0034.html\">Человек, манипулирующий объектами</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0033--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-03-12</td>\n<td>138201–138206</td>\n<td>w0026</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0033-feniks.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0033--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0033.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
