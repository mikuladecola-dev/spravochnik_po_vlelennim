<script>const BASE="";const DOCNAME="Перья Перага";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0183-S01", "SP-0183--mehanika"], "h": "<p>Белые перья, растущие из тела перага наружу (2025-02-24, id 293227–293228, окно w0076). Способность описана изнутри истории — от лица рассказчика, который сам же и придумывает виду название: «Думаю не помешало бы, дать им название для ясности ума, давайте например \"пераг\"».</p>\n<p>Перья описаны как «белый как снег, не они ещё белее, белее чем душа младенца». Растут они не как оперение поверх тела, а изнутри: «эти перья вылазили из недор тела, стремясь в наружу». Распределены по телу неравномерно — «больше всех, этих перье были в голове». Носитель при этом остаётся узнаваемо человекоподобным: «Это был, когда-то человек, хотя ручаться я не стану», и внешне похож на ангела («Ну увидел, я ангела?!!»).</p>\n<p>Главное боевое свойство перьев — они держат пулю. Правило сформулировано рассказчиком по итогу перестрелки дословно так: «В голове отметил, что всё пули, который попадали в перья отскакивали, а если попал просто тело то они прошибали» (id 293227). То есть защита работает только там, где перья есть; открытое тело пулю пропускает.</p>\n<p>Второе свойство — перо может служить оружием. У перага «с руки его вылазить огромное и длинное перо, словно меч»; рассказчик называет его «недомечом», а дальше по тексту — «крылом-мечом». Этим пером пераг машет над головой убегающего человека и в горящем здании задевает им опору, отчего опора начинает шататься. Отдельным описанием, как перо-меч отращивается или убирается, переписка не располагает.</p>\n<p>Третье свойство — огнестойкость. В горящем музее пераг погибает под обрушившимся зданием и горит, но перья при этом не меняются: «И всё горела, кроме перьев белых. И даже в красно-оранжевым огне, эти перье были белые» (id 293228). Ни обугливания, ни потемнения, ни сгорания не происходит.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Отклик — не материал авторов</b>\n<p>«Белее чем душа младенца» — сравнение на самой грани безвкусицы, и оно тут работает именно потому, что говорит его человек, который не понимает, что перед ним: ангел или тварь. Он и спрашивает вслух — «Ну увидел, я ангела?!!». Нравится, что перья лезут не поверх тела, а изнутри: не оперение, а прорастание. И отдельно хорошо, что правило рикошета не выдано автором сверху, а выведено пристрелкой — персонаж отмечает его в голове посреди боя, как считают патроны. В этих записях механика редко появляется как чей-то вывод, а не как объявление; здесь появилась. Финальный кадр — мёртвое горящее тело с белыми перьями, которые не берёт огонь, — сильнее всего описания вместе взятого.</p></div>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0183-S02", "SP-0183--ogranicheniya-i-cena"], "h": "<p>Ограничение названо в переписке одно и прямо: перья прикрывают не всё тело. Попадание в перья — рикошет, попадание в тело — пробитие. На этом рассказчик и строит стрельбу.</p>\n<p>Ни огнестойкость перьев, ни их пулестойкость не спасают самого носителя от гибели: пераг погибает придавленным обрушившейся опорой горящего музея и горит заживо — «Я слышал крик, да и видел я его придавленного и горящего», а после «видел я горящего Перага, он был мертв». Перья при этом остаются белыми на мёртвом теле. То есть свойство принадлежит перьям как таковым, а не живому носителю.</p>\n<p>Цены, платы, расхода сил или каких-либо издержек для перага за использование перьев в переписке не названо.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0183-S03", "SP-0183--nositeli"], "h": "<p>Пераги. В обеих версиях перья описаны как признак вида, а не как индивидуальная особенность конкретного существа. Кем были пераги раньше, сказано только предположительно: «Это был, когда-то человек, хотя ручаться я не стану».</p>\n<p>Появляются пераги в мире после того, как разбилось солнце: рассказчик встречает первого перага уже после катастрофы, выбравшись из-под обломков здания.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0183-S04", "SP-0183--kak-menyalas-po-versiyam"], "h": "<p>Обе версии записаны в один день, 2025-02-24, окно w0076, двумя подряд идущими сообщениями.</p>\n<p><strong>Версия 1 — 2025-02-24 (id 293227).</strong> Введены сами перья: белые, растут из тела наружу, больше всего на голове. Задано правило рикошета: пули по перьям отскакивают, по открытому телу — прошибают.</p>\n<p><strong>Версия 2 — 2025-02-24 (id 293228).</strong> Добавлены два свойства, которых в первой версии не было: перо-меч, вылезающее из руки, и несгораемость перьев в огне. Правило про пули не отменяется и не переписывается — во второй версии рассказчик просто перестаёт стрелять по расчёту патронов («в магазине с натяжкой осталась 10 патронов»), а не потому, что стрельба не работает.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0183-S05", "SP-0183--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Перья названы частью перага — в базе способность помечена как «часть чего: Пераг». Отдельно с другими способностями в этом окне переписки перья не соотносятся.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "SP-0183-S06", "SP-0183--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Не сказано, отрастают ли перья заново после повреждения и можно ли их срезать или выбить.</li>\n<li>Не сказано, все ли пераги отращивают перо-меч или это свойство отдельных особей.</li>\n<li>Не сказано, как именно перо-меч появляется и исчезает, и остаётся ли оно после смерти носителя.</li>\n<li>Не сказано, чем перья являются по составу; сравнение со снегом и с «душой младенца» дано только как описание цвета.</li>\n<li>Не сказано, действует ли пулестойкость против других видов урона — режущего, дробящего, взрывного. Проверено в переписке только огнестрельное оружие и огонь.</li>\n<li>Не сказано, защищают ли перья голову лучше остального тела, хотя их там «больше всех».</li>\n<li>Происхождение перьев не объяснено: связь с расколом солнца рассказчиком не проговорена, он только последовательно описывает сперва катастрофу, потом встречу с перагом.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0183--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0022.html\">Пераги</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0183--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-02-24</td>\n<td>293227–293227</td>\n<td>w0076</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-02-24</td>\n<td>293228–293228</td>\n<td>w0076</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0183-perya-peraga.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0183--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0183.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["SP-0183-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/SP-0183/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дыра не в отсутствии статей — они у соседей есть, — а в том, что материал по перьям не дошёл до статей. У <code>PS-0199</code> в базе 44124 знака против 19046 в статье: больше половины исходника о перагах не разобрано, и происхождение перьев, которого не хватает именно здесь, сидит в этой неразобранной части. У самой <code>SP-0183</code> та же картина в меньшем масштабе — 15757 в базе против 8170 в статье.</p>\n<p>Отдельно дорого стоит <code>SL-0053</code> — реестр вселенной, на который ссылаются шесть статей, 20313 знаков в базе, статьи нет. В нём же лежит раздел «Оружие» с позициями «Крылатый мечи 🪽» и «Крылатый клинки 🪽», записанными на следующий день после перьев, и раздел «Сторонние силы» с Серафимом. Рядом <code>SL-0051</code> — тоже шесть ссылок, тоже без статьи. Пока эти реестры не разобраны, перья висят в вакууме: сравнить их не с чем.</p>\n<h3>С чего начать</h3>\n<p>В базе, не в архиве. Три соседних записи держат ровно то, чего не хватает.</p>\n<p><code>SP-0186</code> «вирус перьев» (2025-02-25, id 295232–295243) — там перья названы вирусом и прямо привязаны к Серафиму: «Так как в нашем мире он тоже будет», «Вместе с серафимом». Это единственное место, где перья объявлены передающимся явлением.</p>\n<p><code>PS-0199</code>, версии 5–6 (2025-03-19, id 305854–305855; 2025-03-20, id 306126–306135) — там пераги переопределены как заражённые и «Падший ангелы», с коэффициентом 23 к 1, и Слава прямо отсекает: «Н-не», «Это заражённый».</p>\n<p><code>PS-0233</code> «Ангел» (2025-03-19, id 305855–305858; 2025-03-20, id 306457–306466) — гуманоид «состоящий только из белых перьев», с одним вертикальным закрытым глазом. Те же белые перья, другое существо.</p>\n<p>В архив — только за одним: окно w0076 целиком, 293226–293229. Версия 3 (293229) со связанным живым перагом в статью не попала, а именно там перья можно было рассмотреть вблизи и без стрельбы.</p>\n<h3>Как развивалось</h3>\n<p>Заявили и ограничили в одном сообщении: 293227 вводит перья и тут же — правило рикошета, где ограничение вшито в саму механику (перья держат, тело не держит). Следующим сообщением, 293228, добавили два свойства, которых не было, — перо-меч и несгораемость, — и правило про пули не отменили, но пользоваться им перестали: рассказчик переходит на счёт патронов. Дальше, в 293229, пераги уходят в фон. Забыли на три недели. Вернулись 2025-03-19 — но не в эту статью и не в эту рамку: перья стали признаком заражения, существа — падшими ангелами, и старое с новым нигде не сведено.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для перагов происхождение перьев в итоге названо — заражение, вторая волна после раскола солнца. Для двух других носителей белых перьев в той же вселенной такого правила нет: Серафим «состоящий из крыльев», ангел из Рая — «только из белых перьев», и откуда перья у них, не сказано ни разу. При этом <code>SP-0186</code> ставит вирус перьев и Серафима в одну строку. Правило происхождения проговорено для одного вида и не проговорено для двух соседних, притом что признак у всех трёх один и тот же.</p>\n<h3>Отклик</h3>\n<p>«Белее чем душа младенца» — сравнение на самой грани безвкусицы, и оно тут работает именно потому, что говорит его человек, который не понимает, что перед ним: ангел или тварь. Он и спрашивает вслух — «Ну увидел, я ангела?!!». Нравится, что перья лезут не поверх тела, а изнутри: не оперение, а прорастание. И отдельно хорошо, что правило рикошета не выдано автором сверху, а выведено пристрелкой — персонаж отмечает его в голове посреди боя, как считают патроны. В этих записях механика редко появляется как чей-то вывод, а не как объявление; здесь появилась. Финальный кадр — мёртвое горящее тело с белыми перьями, которые не берёт огонь, — сильнее всего описания вместе взятого.</p></div>", "r": []}];</script>
