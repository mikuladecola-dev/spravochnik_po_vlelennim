<script>const BASE="";const DOCNAME="спасатель";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0144-S01", "PS-0144--proishozhdenie"], "h": "<p>Персонаж Славы. Во вселенную «монстры» входит через историю Славы от 2024-08-17 (id 220167–220168) — там он ещё безымянный: тот, кто похитил рассказчика, держит его в комнате без дверей и окон и кормит. В самом тексте истории он ни разу не назван, рассказчик обозначает его как «смотрящий» («угадайте, что смотрящие сделали. Погладил меня по голове») и постепенно доходит до определения «какое то охотник на нечисть сука или как это можно назвать. Какой то человек убивающий монстров с психологическими проблемами запер меня здесь и заставляет есть хуй пойми чей».</p>\n<p>Имя «спасатель» появляется в тот же вечер, в разборе Миколая (2024-08-17, id 220206–220220). Слава спрашивает прямо: «Кто похититель ?» — Миколай отвечает: «ясен хуй спасатель», «он же ебанутый на голову» (220214–220217). То есть персонаж на момент вопроса уже существует у Славы и опознаётся обоими без пояснений; в записи по окну w0053 отдельно отмечено, что неясно, тот ли это «спасатель», что был у Славы раньше, или он вводится здесь заново.</p>\n<p>Разработка идёт с 2024-08-17 по 2024-08-29, окна w0053–w0055, семь зафиксированных версий. После первой истории персонажа берёт в свои тексты Миколай — сначала как «знакомого» своего героя (2024-08-20), потом как одного из двух голосов в диалоге (2024-08-26) и как героя отдельного этюда (2024-08-29).</p>\n<p>Варианты имени, под которыми он проходит: спасатель, спаситель, Киппер, знакомый, охотник на нечисть, похититель, смотрящий.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0144-S02", "PS-0144--vneshnost"], "h": "<p>Внешность зафиксирована Славой как владельцем персонажа 2024-08-27 (id 225613), в ответ на предположение Миколая, что новый персонаж Славы — это спасатель: «Так у спасателя не длинный волосы он не ходит в мешковатой одежде и у спасателя на лице шрамы». То есть: волосы не длинные, мешковатой одежды не носит, на лице шрамы. Миколай ответил «понятно, я учту это» (225614).</p>\n<p>В истории Миколая от 2024-08-20 (id 220649) он впервые виден глазами Захара Авгура: стучит в окно первого этажа, «там стоял темный злой силуэт в капюшоне. но это оказался мой знакомый». Там же дана социальная характеристика: «уличный парень», о котором почти никто не знает.</p>\n<p>В этюде от 2024-08-29 (id 226088) через реплики о собеседнике задан рост: спасатель обращается к пареньку — «ты такой маленький конечно, не в обиду.. в баскетбол наверное играешь? хахахах. ладно, прости. таких маленьких давно не видел, сколько рост? ну 165 в 27 лет это забавно конечно». Сам он, соответственно, заметно выше; точный рост не назван. Там же — «ой, прости не хотел плечо отбивать, это уже инстинктивно получилось».</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0144-S03", "PS-0144--harakter"], "h": "<p>Первое определение, данное Миколаем: «он же ебанутый на голову» (220217, 2024-08-17).</p>\n<p>Рассказчик истории Славы (220167) выводит его психологию из поведения: после того как пленник на четвёртый день съел суп, «Погладил меня по голове, я честно слово прифигел. Ну и мысль стукнул этот гадонище извращенец и покалеченный в душе ребенок. Типо он хотит воспроизвести момент из свой жизни или типо того». Пленник полгода пытается давить на жалость: «мои вечный причитание что он не виноват, что все хорошо, что я его люблю. Ну типа на жалость пытался надавить и возможно решить его детскую травму что бы он меня отпустили». Не срабатывает: «ничего не изменилась не через месяц не через 2 месяца».</p>\n<p>В истории Миколая (220649, 2024-08-20) характер дан снаружи и с раздражением: «он помешан на всяких мистических существах», «ну фанатик походу», «этот клоун продолжает что-то твердить и зовёт на какое-то задание», «реально, этот спасатель прилепился ко мне», «серьёзно.. человека похитить, он точно сумасшедший». Спасатель при этом отчитывает Захара за то, что тот не читает почту, и рассказывает о своём подвиге — что изгнал монстра Беркута, «спас детей того города и будущее теперь под его защитой».</p>\n<p>2024-08-20 Миколай формулирует собственное намерение по персонажу: «я хочу твоего спасателя сделать ублюдком)» (220669).</p>\n<p>В диалоге от 2024-08-26 (224940) характер держится на грубости и на закрытости: он обрывает вопросы писателя («чел, тебя в гугле забанили?», «ну не в эфире же», «ты эфир остановил?» — «тогда че ты спрашиваешь!?»), бьёт собеседника («я с тобой серьёзно говорю, зачем ты всё это делаешь»), угрожает («хочешь чтобы я снова на тебя монстра натравил? он то пожалел тебя, но если надоешь, такие большие иллюзии тебе покажет»), а проговорившись — уходит от темы («ой. ну давай вот без вопросов идём уже нарежем тушку рыбомонстра и телефон парню зарядим, посмотрим, что сегодня напишет»). Мотив назван им самим: «хотя я большинство монстров познал из-за из вмешательства в мою жизнь. эти твари мои враги и я их же использую для мести». На вопрос, откуда он всё знает: «учиться надо, трогать мир».</p>\n<p>Этюд от 2024-08-29 (226088) Миколай писал специально ради характера — «один из повседневности спасателя», «хотел характер раскрыть» (226094–226095). Там впервые звучит то, что за ненавистью: «я. я хочу увидеть дочку. я устал видеть эти мерзкие лица, устал каждого уничтожать. я хочу жить счастливо и размеренно со своей семьёй. эти изверги, я ненавижу их. их не останется ни одного.» Ненависть при этом тотальная и без исключений: про векторную тварь он говорит «её буду истреблять последней. хотя нет всех и сразу», про монстров на складе — «ублюдки, приятного аппетита», про эхолокатора — «найти бы эхолокатора. почему все эти ублюдки так хорошо прячутся».</p>\n<p>В том же этюде он разговаривает по телефону с подругой о писателе: «да надоел этот парень спорить о том, что люди и монстры не связаны, утверждая что это отдельный вид. согласен, это совсем не аргумент. ещё говорит, что ауры не существует. ну ладно, это правда. но зачем всё услож... пришёл, перезвоню».</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Как развивалось — не материал авторов</b>\n<p>Вся жизнь персонажа — двенадцать дней. 2024-08-17 он появляется у Славы безымянным тюремщиком, который за всю историю не произносит ни слова, и в тот же вечер получает имя от Миколая. 2024-08-20 Миколай берёт его в свой текст и вслух объявляет намерение: «я хочу твоего спасателя сделать ублюдком)». 2024-08-26 персонаж впервые говорит сам и обзаводится вторым именем — Киппер. 2024-08-27 Слава от него отказывается («как-то часто я его кастаю») и заводит вместо него нового. 2024-08-29 Миколай пишет этюд специально ради характера и сразу извиняется. После 2024-08-29 записей нет.</p></div>\n<div class=\"mnote\"><b>⚙ машинная заметка · Отклик — не материал авторов</b>\n<p>Забавнее всего вышло с владением. У Славы спасатель — абсолютно немой: за всю историю с похищением ни одной реплики, только укол, сброс в комнату и поглаживание по голове за съеденный суп. У Миколая через девять дней это болтун, у которого монолог не закрывается сорок строк подряд — про рост собеседника, про суп из рыбочеловека, про склад, про дочку. Один и тот же человек, ровно противоположный режим, и оба варианта читаются как он же. И отдельно — «прости», «я не могу», «я не умею писать» сразу после отправки этюда, который как раз сработал: строчка «я хочу увидеть дочку. я устал видеть эти мерзкие лица, устал каждого уничтожать» стоит там, где раньше была только тотальная ненависть, и держит весь характер. Автор извинился за текст, который сделал то, ради чего писался.</p></div>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0144-S04", "PS-0144--sposobnosti"], "h": "<p>Сверхъестественных способностей у него в переписке не названо. Его возможности — знание, вещества, аппаратура и использование самих монстров.</p>\n<p><strong>Знание о монстрах.</strong> Он излагает писателю систему (224940, 2024-08-26): «в школе не преподают этого, монстры - один из доменов живых существ. в ряду с бактериями, археями или эукариотами. у каждого типа свои особенности, появления, поведения. в общем целая наука». Про устройство их сообщества: «нет у них никакого предводителя, их(существов) слишком много и нормально все живут вместе. их инстинкт говорит прятаться от людей, но от людей они сильно зависят, как и люди от них, они связаны ментальными сигналами, но обычно это никак не отражается». Про их социальность: «а они более социальные существа, даже не социум у них, а более сложное явление, которое я не понимаю». Про их судьбу при выходе к людям: «иногда их отклонения доходят до вмешательства в жизнь людей, тогда их судьбу обречена, общество их не примет».</p>\n<p><strong>Различение монстра и человека.</strong> Признаки, которыми он пользуется: поведение в отключке («ты же видел что он делает после удара о землю в отключке. каждый раз стены ломаются»), реакция на дозу («был бы монстром, то тебя бы эта доза смогла бы отключить» — проверяет уколом на самом писателе), цвет и состав крови («у тебя в кровь красная, у него синяя. ты хоть одного человека видел, в чьей крови течёт гемоцианин?»).</p>\n<p><strong>Вещества.</strong> У них есть набор веществ; ограничение названо писателем: «а вызывать амнезию не одно из наших веществ не умеет» (224940). Взамен спасатель предлагает «пара народных методов» — кирпичом по голове, и на возражение отвечает: «ты че такой весь правильный, мы и так по локоть в меазмах».</p>\n<p><strong>Использование монстров против людей.</strong> 2024-08-20 (220671–220672) Миколай описывает механику: «он использует монстров в своих целях для спасения людей», «моего персонажа с помощью какого-то жука заставил увидеть галлюцинацию». 2024-08-26 это подтверждается изнутри текста через слово «снова» и разъясняется в чате: «спасатель натравил тех кто иллюзию по телеку покажет» (224967), «он раскрылся, да не совсем» (224973).</p>\n<p><strong>Эксперименты.</strong> В истории Славы — уколы в шею, кормление супом и кашей, подача головы рыбочеловека. В версии 2024-08-17 (220213) — «начал над ним опыты проводить и наблюдать за каннибализмом и физическими способностями». В этюде 2024-08-29 — цель исследования: «после 56 тестов я смогу с уверенностью определить его возможности, его днк и другие данные».</p>\n<p><strong>Трансляция.</strong> Ведёт эфир в даркнете; все действия с существом транслируются (220650, 2024-08-20). В диалоге 224940 эфир — рабочее обстоятельство, который можно «остановить», и при котором нельзя говорить лишнего.</p>\n<p><strong>Физическая сила.</strong> Отмечена вскользь и как автоматизм — отбитое плечо собеседника «это уже инстинктивно получилось»; раздавленный векторный шар — «ай, раздавил опять векторный шар» (226088).</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0144-S05", "PS-0144--svyazi-s-drugimi"], "h": "<p><strong>Похищенный (история Славы, 220167–220168).</strong> Рассказчик первой истории, тот, кого спасатель держит в комнате 5 на 5 метров с люком в потолке на высоте четырёх метров. Спасатель с ним не разговаривает вообще: колет в шею при буйстве, сбрасывает обратно в тёмную комнату, кормит супом, с десятого дня кашей, гладит по голове за съеденную еду, через полгода подаёт под крышкой голову рыбочеловека и подкладывает телефон с единственным контактом. Кто он такой — версии расходятся, см. ниже.</p>\n<p><strong>Захар Авгур</strong> — писатель, автор книги «Память забытому», претендент на Пулитцеровскую премию. Спасатель — его «знакомый»; Захар держит его при себе по прямо названной причине: «он мне не конкурент, поэтому мы с ним дружим» (220649). Спасатель втягивает его в похищение гибрида монстра и человека, и подкупает именно трансляцией в даркнете: «он точно не спалится, а вот я. я придумаю план, как можно сделать так, чтобы нас разоблачили. да так, чтобы об этом узнал весь мир» (220650). Ему же — по замыслу 220672 — спасатель с помощью жука показывает галлюцинацию.</p>\n<p><strong>Писатель</strong> (персонаж Миколая в диалоге 224940). Второй голос в тексте: «в кавычках говорит твой спасатель», «без них мой писатель» (224962–224963). Работает при спасателе: ведёт эфир, задаёт вопросы, получает уколом проверку на монстра и удар, ему поручены вычисления — «тот паренёк займётся вычислениями пока не надоест, деньги сможет с глубин интернета собрать на исследование» (226088). Отдельно от спасателя спорит, что люди и монстры не связаны и что ауры не существует. Тождество писателя и Захара Авгура в переписке нигде не проговорено.</p>\n<p><strong>Беркут</strong> — монстр, о котором Захар рассказал спасателю «известную байку»: «с ним была какая-то тёмная история связана. так он пошёл весь в ярости и с улыбкой до ушей в тот город где обитает это существо». Спасатель заявляет, что изгнал его и спас детей города (220649).</p>\n<p><strong>Голубец</strong> — пойманный монстр, выглядящий как человек, в сознании и адекватный, признающийся спасателю в любви и объясняющий это сам: «я читал, что это Стокгольмский синдром». Спасатель настаивает: «это не человек, это монстр, пусть он и выглядит так». При голубце нельзя было говорить об эфире, и решение проблемы — «пара народных методов» (224940).</p>\n<p><strong>Рыбочеловек / рыболюди.</strong> Голова рыбочеловека подаётся пленнику под крышкой в истории Славы. В этюде 2024-08-29 спасатель идёт за рыбочеловеком до Ньюса: «суп из него такой ароматный, постоянная гипермедленная регенерация даже в варёном состоянии это райское наслаждение для моих очей. и то, как эта ошибка природы питается этими существами так расслабляет».</p>\n<p><strong>Чел с генами рыбочеловека / человек с рыбьей мутацией.</strong> По версии Миколая от 2024-08-17 — тот самый похищенный. Про задержание похитителей «человека с рыбьей мутацией» говорит и телевизор в истории 220649, куда Захар не верит: «только не говори, что поверил в эту сказку».</p>\n<p><strong>Векторный шар</strong> — монстр, которым спасатель пользуется для перемещения: «эта векторная тварь очень сподручна для перемещения конечно». Механику Миколай объяснил в чате, а не в тексте (226100–226101): «это монстр которого ты бросаешь, но не отпуская и в ту сторону к которую идёт инерция он бесконечно тебя уносит», «обычно всегда в небо, а после если ты достаточно высоко он отпускает и бьёт током чтобы ты разбился», «мелкий хуй». Отношение спасателя к нему двойственное: истреблять последним — и тут же «хотя нет всех и сразу»; после того как раздавил очередной шар — «че интересно он ждет от меня, потом спрошу».</p>\n<p><strong>Эхолокатор</strong> — монстр, которого он ищет и не может найти: «найти бы эхолокатора. почему все эти ублюдки так хорошо прячутся».</p>\n<p><strong>Дочка спасателя и семья.</strong> Названы один раз, в монологе 226088. Ни имени, ни обстоятельств, ни того, где они, в переписке нет.</p>\n<p><strong>Подруга.</strong> Упомянута один раз — телефонный разговор в начале 226088. Не названа и больше не появляется.</p>\n<p><strong>Склад спасателя</strong> — место, куда он ведёт писателя: «ладно, погнали покажу склад», «в общем, заходи.. ублюдки, приятного аппетита».</p>\n<p><strong>Хойя-Бача</strong> — место, куда он идёт «монстров на монстров порыбачу».</p>\n<p><strong>Ньюс</strong> — место, до которого он шёл за рыбочеловеком.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0144-S06", "PS-0144--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2024-08-17, окно w0053, id 220167–220168.</strong> История Славы. Безмолвный тюремщик, увиденный только глазами пленника. Фургон, мешок на голову, телефон в окно, укол в шею. Комната 5 на 5, без дверей и окон, высота четыре метра, люк в потолке. Белая комната со столом, стул, прибитый к полу. Реакции строго механические: крик и буйство — укол и сброс обратно; отказ от еды — укол и сброс; съеденная еда — поглаживание по голове. Кормление: суп «какой то мерзкий словно из испорчехся продуктов сделали», с десятого дня каша, через полгода голова рыбочеловека под крышкой. Ни одного слова от него за всю историю. Затем — подложенный телефон без сети и приложений, с единственным контактом, в который пленник пишет: «Я уже понимаю кому пишу, это ведь ты запер меня здесь не так ли».</p>\n<p><strong>Версия 2 — 2024-08-17, окно w0053, id 220206–220220.</strong> Разбор Миколая. Сначала он предлагает трактовку самого похищенного и попутно даёт первую биографию охотника: «охотник пытался чет допросить одного такого монстра, узнал историю и начал охоту уже на человека. начал над ним опыты проводить и наблюдать за каннибализмом и физическими способностями». На прямой вопрос Славы «Кто похититель ?» — «ясен хуй спасатель», «он же ебанутый на голову». Здесь персонаж Славы и охотник из трактовки Миколая сходятся в одно лицо.</p>\n<p><strong>Версия 3 — 2024-08-20, окно w0054, id 220649–220654.</strong> Первое появление в тексте Миколая, снаружи, глазами Захара Авгура. Уличный парень в капюшоне, помешанный на мистических существах, только что изгнавший Беркута и спасший детей города, отчитывающий Захара за непрочитанную почту, зовущий на задание. Задание: в городе ходит гибрид монстра и человека, его нужно поймать. Оценка героя: «серьёзно.. человека похитить, он точно сумасшедший. но его полный план на деле был куда мрачнее». Приманка для Захара — трансляция в даркнете. Здесь же — характеристика статуса: «да если бы он реально был героем, то о его подвигах знали бы все. как говорится \"герою - слава\". а о нём почти никто не знает, уличный парень. если бы я в этой истории его не упомянул, то и ты бы нигде больше о нем не услышал».</p>\n<p><strong>Версия 4 — 2024-08-20, окно w0054, id 220662–220694.</strong> Прямое заявление о смене роли, вне текста, в чате: «я хочу твоего спасателя сделать ублюдком)», «то он использует монстров в своих целях для спасения людей», «моего персонажа с помощью какого-то жука заставил увидеть галлюцинацию» (220669–220672). Слава останавливает раскрытие: «Не надо слишком больших сполеров» — и спрашивает только про похищенного. Ответ Миколая (220685): «он человек, но с иммунитетом способным адаптировать клетки монстров. тобиж если к нему пришьют органы монстра он не умрёт». Слава при этом отмечает, что сам не знает, кто похищенный: «Я в свой истории про это не писал поэтому сам не знаю» (220684). Здесь же названа сцепка историй: «это всё вступление в твою последнюю историю» (220681).</p>\n<p><strong>Версия 5 — 2024-08-26, окно w0055, id 224938–224998.</strong> Первый текст, где спасатель говорит сам. В истории 224940 его речь дана в кавычках, речь писателя — без. Здесь появляется имя Киппер (обращение писателя: «стоп. Киппер. ну ты же при нём это сказал»). Содержание: пойманный голубец, признание в любви и Стокгольмский синдром, риск засветить эфир, укол дозой писателю в качестве проверки, изложение домена монстров, признание про месть, отказ от идеи «тёмного повелителя», угроза натравить монстра «снова» и обрыв разговора. Слово «снова» раскрывает, что телевизионная сцена версии 3 была подстроена: «спасатель натравил тех кто иллюзию по телеку покажет» (224967), «он раскрылся, да не совсем» (224973). В 224968–224971 Миколай сначала переспрашивает «какие» и поясняет «я ща на улице, неправильно прочитал», после чего подтверждает, что речь именно об этом. По итогам Слава просит помечать говорящих: «И сразу пиши ковычки это кто», «А то я знатно запутался» (224993, 224995).</p>\n<p><strong>Версия 6 — 2024-08-27, окно w0055, id 225595–225616.</strong> Уточнения на границе персонажей. Миколай принимает нового персонажа Славы за спасателя: «это киппера он встретил, да?» — «ну спасателя». Слава: «Нет», «Когда спаситель стал киппером». Миколай объясняет: «в моей последней истории)) ну это просто спасатель на английском языке» (225608). Здесь же Слава фиксирует внешность (225613) и объясняет, почему в этой истории спасателя нет: «Я сначала подумал использовать спасателя но подумал как-то часто я его кастаю, поэтому решил добавить нового перса» (225609). Миколай: «да, я думаю правильное решение добавить новых персов», «но по описанию я представил спасателя».</p>\n<p><strong>Версия 7 — 2024-08-29, окно w0055, id 226083–226116.</strong> Этюд «один день из повседневности» (226088), написанный Миколаем специально ради характера. Сплошной монолог спасателя: телефонный разговор с подругой о писателе, встреча с писателем, шутка про рост, поход на склад с приветствием «ублюдки, приятного аппетита», Хойя-Бача и рыбалка на монстров монстрами, векторная тварь как транспорт, поиск эхолокатора, погоня за рыбочеловеком до Ньюса, план на 56 тестов, монолог о дочке и семье, раздавленный векторный шар. Реакция Миколая сразу после отправки: «прости», «я не могу», «я не умею писать», «я не знаю что мне делать» (226089–226093). Претензия Славы — не к персонажу, а к введению векторного шара без описания: «Если добавляеш надо хотя бы описывать. А то нехуя не ясна» (226108); Миколай ответил «я писал с одной целью и и её выполнил» и согласился: «буду понятнее делать» (226109, 226115).</p>\n<h3>Отклонённые и отложенные варианты</h3>\n<ul>\n<li>2024-08-17 (220213): первая версия того, кем может быть похищенный, отброшена самим Миколаем — «я бы сказал что это обычный человек, которому делать нехуй, думать постоянно о похитителях. но ты не этого ждёшь, да и я чёт тоже поинтереснее хочу».</li>\n<li>2024-08-17 (220213): в механизме передачи генов рыбочеловека отца отброшен один вариант в пользу другого — «кто-то из них кончил, но это в твоей вселенной кринж, ток что укусил отца этого чела в ключицу, ну и в семяпроводе через кровь или молочные железы проникли гены рыбочеловека». Оговорка автора: «мне похуй насколько это реалистично, такой концепт интересен и можно его запихнуть сюда, ты сможешь доработать может если не нравится».</li>\n<li>2024-08-20 (220675): развёрнутое раскрытие плана спасателя во второй части остановлено Славой — «Не надо слишком больших сполеров».</li>\n<li>2024-08-26 (224940): версия писателя, что «тёмный повелитель» монстров существует, отвергнута спасателем внутри текста — «нет у них никакого предводителя».</li>\n<li>2024-08-27 (225609): использование спасателя в очередной истории Славы отклонено самим Славой по причине частоты — «как-то часто я его кастаю».</li>\n</ul>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0144-S07", "PS-0144--chto-s-nim-stalo"], "h": "<p>Последнее появление — этюд от 2024-08-29 (226088). На этот момент он ведёт исследование рыбочеловека, держит склад, охотится за эхолокатором и хочет увидеть дочь. Ничем сюжет не закрыт: Миколай в 224975 говорит «я хочу ещё многое раскрыть, так что планирую ещё писать истории», и раскрытие спасателя остаётся незаконченным — «он раскрылся, да не совсем» (224973). Слава со своей стороны 2024-08-27 сознательно отложил персонажа и завёл вместо него нового (225609). За пределами 2024-08-29 в этом материале спасатель не появляется.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0144-S08", "PS-0144--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Настоящего имени нет. «Спасатель», «спаситель», «Киппер», «смотрящий», «похититель», «знакомый» — все обозначения, а не имя. «Киппер» прямо объяснён как то же слово по-английски (225608).</li>\n<li>Не сказано, тот ли это спасатель, который был у Славы раньше, или персонаж вводится в w0053 заново.</li>\n<li>Кто такой похищенный из истории Славы, окончательно не решено. Слава: «Я в свой истории про это не писал поэтому сам не знаю» (220684). Миколай дал две несводимые версии: чел с генами рыбочеловека, полученными через укус отца (220213), и «человек, но с иммунитетом способным адаптировать клетки монстров» (220685). Какая из них принята — в переписке не сказано.</li>\n<li>Не сказано, один ли похититель. Пленник сам отмечает: «Стояли сзади ну или стоял. Я не знаю сколько их там было». Про «похитителей» во множественном числе говорит и телевизор в 220649.</li>\n<li>Не отождествлены прямо голубец и «парень», которому в 224940 заряжают телефон. Оба фигурируют в одной сцене, но что это одно лицо, нигде не сказано.</li>\n<li>Не сказано, тождественны ли «писатель» из 224940 и Захар Авгур.</li>\n<li>Детская травма спасателя — только догадка пленника («покалеченный в душе ребенок», «типо он хотит воспроизвести момент из свой жизни»), авторами не подтверждена и не опровергнута.</li>\n<li>Что монстры сделали спасателю — не названо. Есть только «я большинство монстров познал из-за из вмешательства в мою жизнь» и «даже так я их всех истреблю за то что они сделали..».</li>\n<li>Про дочку и семью не сказано ничего, кроме одного предложения: живы ли, где, что с ними — нет.</li>\n<li>Вопрос Славы «Это он натравил карликов ?» (224957) остался без ответа: Миколай ответил на другой вопрос, потом сообщил, что читал неправильно, и к карликам не вернулся.</li>\n<li>Что за жук вызывает галлюцинацию — не описано, только «какого-то жука» (220672).</li>\n<li>Состав веществ спасателя не назван; известно только ограничение — амнезию ни одно из них не вызывает.</li>\n<li>Векторный шар в тексте этюда не описан, его механика есть только в чате (226100–226101); Слава на это и указал.</li>\n<li>Вопрос спасателя о векторном шаре — «че интересно он ждет от меня, потом спрошу» — остался нерешённым.</li>\n<li>Итог заявленного плана (похищение гибрида и трансляция в даркнете, с встречным планом Захара разоблачить их обоих) в переписке не показан.</li>\n<li>Вселенная в окне w0055 нигде не названа; в записи она проставлена по дате объявления. Имени персонажа в чате окна w0054 тоже нет — только «спасатель», и связка тянется влево, в w0053.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0144--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0038.html\">Рыболюди</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0144--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-17</td>\n<td>220167–220168</td>\n<td>w0053</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-08-17</td>\n<td>220206–220220</td>\n<td>w0053</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-08-20</td>\n<td>220649–220654</td>\n<td>w0054</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-08-20</td>\n<td>220662–220694</td>\n<td>w0054</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-08-26</td>\n<td>224938–224998</td>\n<td>w0055</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-08-27</td>\n<td>225595–225616</td>\n<td>w0055</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-08-29</td>\n<td>226083–226116</td>\n<td>w0055</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0144-spasatel.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0144--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0144.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0144-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0144/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Вокруг спасателя, в отличие от большинства линий, почти всё уже заведено со статьями: Захар, писатель, Беркут, голубец, векторный шар, склад, Хойя-Бача, Ньюс, вещества, эфир. Дорогая дыра здесь одна и она в другом месте: <code>SL-0013</code> «Список персонажей Славы» — 2 ссылки, статьи нет, база 9986. Именно там должен решаться первый вопрос статьи — тот ли это спасатель, который был у Славы раньше, или он заводится в w0053 заново. Пока списка нет, персонаж просто не прослеживается левее 2024-08-17, и вся его предыстория держится на «ясен хуй спасатель» — то есть на том, что оба его уже знали.</p>\n<p>Второе — не нехватка материала, а нерешённое тождество, и оно стоит дорого именно объёмом. Про возможного похищенного заведены три записи: <code>PS-0155</code> «рассказчик истории Славы» (12524), <code>PS-0143</code> «Человек с генами рыбочеловека» (18993), <code>SP-0107</code> «иммунитет, адаптирующий клетки монстров» (2143). Про возможно одного человека — две: <code>PS-0146</code> Захар Авгур (15465) и <code>PS-0151</code> писатель (15940), обе со статьями, по одной ссылке. Больше шестидесяти тысяч знаков ждут двух ответов «да/нет».</p>\n<p>Третье, дешёвое: <code>ID-0092</code> эхолокатор (4214) и <code>ID-0093</code> «система ауры» (5172) — статей нет, по одной ссылке. Про ауры спасатель спорит с писателем прямо в этюде, а посмотреть, что это в их мире такое, некуда.</p>\n<p>Фон, который стоит держать в голове: во вселенной «монстры» восемнадцать записей имеют статью, базу больше 3000 знаков и ноль входящих ссылок — голубец, дочка спасателя, рассказчик, Крим, Паша и так далее. Это не дыры по материалу, это несвязанная куча.</p>\n<h3>С чего начать</h3>\n<p>В базе. Всё перечисленное лежит записями, идти в архив за этим не нужно — нужно свести <code>PS-0146</code> с <code>PS-0151</code> и три записи вокруг похищенного между собой.</p>\n<p>В архив — за одним конкретным вопросом: 2024-08-26, id 224957, «Это он натравил карликов ?». Ответа нет, Миколай съехал на другое и сообщил, что читал неправильно. Смотреть 224958–224998 и продолжение w0055 (225595 и дальше) — не вернулся ли он к карликам позже. И вторым заходом — всё, что левее w0053, на слово «спасатель»: это ровно то, чем должен закрываться <code>SL-0013</code>.</p>\n<h3>Как развивалось</h3>\n<p>Вся жизнь персонажа — двенадцать дней. 2024-08-17 он появляется у Славы безымянным тюремщиком, который за всю историю не произносит ни слова, и в тот же вечер получает имя от Миколая. 2024-08-20 Миколай берёт его в свой текст и вслух объявляет намерение: «я хочу твоего спасателя сделать ублюдком)». 2024-08-26 персонаж впервые говорит сам и обзаводится вторым именем — Киппер. 2024-08-27 Слава от него отказывается («как-то часто я его кастаю») и заводит вместо него нового. 2024-08-29 Миколай пишет этюд специально ради характера и сразу извиняется. После 2024-08-29 записей нет.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>У спасателя названы три признака, которыми он отличает монстра от человека: поведение в отключке, реакция на дозу, цвет и состав крови — «ты хоть одного человека видел, в чьей крови течёт гемоцианин?». И он их применяет: колет писателя дозой, чтобы проверить. Про голубца, который выглядит как человек, находится в сознании, говорит связно и сам называет своё состояние Стокгольмским синдромом, он утверждает: «это не человек, это монстр, пусть он и выглядит так». По какому из трёх собственных признаков — не сказано. Правило проверки проговорено для того, кто оказался человеком, и не проговорено для того, ради кого оно вообще понадобилось.</p>\n<h3>Отклик</h3>\n<p>Забавнее всего вышло с владением. У Славы спасатель — абсолютно немой: за всю историю с похищением ни одной реплики, только укол, сброс в комнату и поглаживание по голове за съеденный суп. У Миколая через девять дней это болтун, у которого монолог не закрывается сорок строк подряд — про рост собеседника, про суп из рыбочеловека, про склад, про дочку. Один и тот же человек, ровно противоположный режим, и оба варианта читаются как он же. И отдельно — «прости», «я не могу», «я не умею писать» сразу после отправки этюда, который как раз сработал: строчка «я хочу увидеть дочку. я устал видеть эти мерзкие лица, устал каждого уничтожать» стоит там, где раньше была только тотальная ненависть, и держит весь характер. Автор извинился за текст, который сделал то, ради чего писался.</p></div>", "r": []}];</script>
