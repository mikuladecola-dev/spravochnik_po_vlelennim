<script>const BASE="";const DOCNAME="Что такое монстр";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0054-S01", "MR-0054--ustroystvo"], "h": "<p>Определение объёма понятия «монстр», данное Миколаем (2024-08-11, окно w0051, id 217869–217882). Определение намеренно широкое.</p>\n<p>Отправная точка — оговорка о порождении верой: это «один из типов монстров» и «один из типов их зарождения», причём «конечно есть другие» (id 217871–217873). То есть вера как источник монстров не единственный механизм, а частный случай.</p>\n<p>Дальше идёт сама формулировка (id 217874): «вообще монстр это такое понятие, под которое можно всё засунуть». Перечислен диапазон того, что под понятие подпадает, парами крайностей (id 217875–217878):</p>\n<ul>\n<li>«от человека до чего-то просто большого»</li>\n<li>«от обычного персонажа в игре которого надо убить до главного антагониста главного героя»</li>\n<li>«от уродливой хуепуталы, гибрида всяких живых тварей, до пугающего чувства нахождения под кровати чего-то»</li>\n<li>«это просто даже событие которое вышло из под контроля»</li>\n</ul>\n<p>Итог: «всё это называется монстром» (id 217879).</p>\n<p>Причина, по которой понятие взято таким широким, названа прямо (id 217881): «а значит всё это даёт большую свободу и спектр возможностей». То есть широта определения — рабочий инструмент для дальнейшей разработки, а не описание какого-то конкретного существа.</p>\n<p>Отдельно зафиксировано, что монстром может быть не только тело, но и состояние или чувство (чувство, что под кроватью кто-то есть), и не только сущность, но и процесс — событие, вышедшее из-под контроля.</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0054-S02", "MR-0054--naselenie"], "h": "<p>Записью охватывается всё, что подпадает под понятие: люди, крупные объекты, игровые персонажи любого ранга, гибриды живых тварей, чувства, события. Отдельных именованных монстров в этом куске переписки нет.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0054-S03", "MR-0054--mesto-vo-vselennoy"], "h": "<p>Вселенная — «монстры» (по дате объявления). Запись обозначена как часть темы «Монстры и вера»: разговор о вере предшествует и определение объёма даётся именно как расширение относительно неё. Как связанные названы: Монстры и вера, Типы зарождения монстров.</p>\n<p>Здесь же отклонена одна ветка. Миколай упоминает возможность разработать линию с автором игры и тут же её оценивает (2024-08-11, id 217882): «а прописать могу эту тему с автором игры но для меня это кажется скучной идеей». Продолжения у этой ветки в записи нет.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0054-S04", "MR-0054--kak-menyalsya-po-versiyam"], "h": "<p>Версия 1 — 2024-08-11 (окно w0051, id 217869–217882). Единственная версия; переформулировок определения в записи нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0054-S05", "MR-0054--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Другие типы зарождения монстров названы как существующие («конечно есть другие»), но не перечислены.</li>\n<li>Не сказано, есть ли у столь разных монстров что-то общее по механике — то есть определение задано перечислением, а не признаком.</li>\n<li>Как монстром может быть событие и как оно при этом действует — не разобрано.</li>\n<li>Линия «с автором игры» оставлена нерешённой: названа и отклонена по вкусу, без разбора.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0054--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0054--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-11</td>\n<td>217869–217882</td>\n<td>w0051</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0054-chto-takoe-monstr.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0054--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0054.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
