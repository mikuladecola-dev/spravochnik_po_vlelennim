<script>const BASE="";const DOCNAME="Средневековый мир";
const LEAD="<p>Мир средневековья, к которому соавторы перешли 21 декабря 2024 года (2024-12-21, id 272089–272890, окно w0067). В переписке он называется просто «средневековье» или «средние века»; отдельного имени ни миру, ни вселенной не дали. Вся работа по нему на сегодня уложилась в один день.</p>";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0084-S01", "MR-0084--ustroystvo"], "h": "<p>Мир возник не как новый, а как переделка уже существовавшего. Слава поставил вопрос прямо: «Мы этот мир превратим в средневековье / Или возьмём новый где будет средневековья ?» (id 272089). Миколай выбрал первое: «ну превратить думаю интереснее» (id 272098), сопроводив замечанием о прежнем мире — «а этот мир это какой», «мы врд не особо развили его» (id 272099–272100). Что это был за прежний мир, в переписке не сказано.</p>\n<p>Причина выбора эпохи у Славы не выведена ни из чего: на вопрос «а почему средневековье» и «что это время для тебя означает?» он ответил «Захотелось» (id 272090–272092), а на «как его понимаешь» — «Ничего» и «Щя попозже постараюсь описать» (id 272093–272096). Описания в этом окне не последовало.</p>\n<p>Система сил при переходе меняется. Слава уточнил, что вопрос был именно про неё: «Тибо в средневековье также система сила или / Новая ?» (id 272103). Миколай: «ну средневековье время новое, так что другая» (id 272104). Дальше Слава спросил, «Типо вообще с нуля или на основе магии ?» (id 272106) — ответа на эту развилку в окне нет.</p>\n<p>Географически и культурно мир не привязан к реальным регионам. Миколай перебрал варианты: «в какой мы стране, культуре?», «мы западная Европа?», «Русь?», «или чет другое» (id 272764–272767). Слава выбрал: «Что-то другое» (id 272773). На следующий вопрос «че по культуре?» (id 272775) ответа в окне нет.</p>\n<p>Опора на реальную историю от мира отсечена. Миколай подготовил некоторый материал и спросил: «ты это прочтёшь или удалить?», «мб это не нужно и из воздуха создаём средние века» (id 272778–272779). Слава: «Если честно удаляй» (id 272780). Содержание удалённого материала в переписке не приведено. Тем же вечером Миколай отметил про себя: «а то я был все время сфокусирован на другом, надо переключиться», «на опоре на факты и историю» (id 272888, 272890).</p>\n<p>Итоговая на конец дня рамка мира — набор сторон. Слава: «Ну вроде почти все решилась / Теперь только конструкция мира / Стороны церковь эльфы король и т п» (id 272882). Миколай отложил это: «ну ладно, это потом уже» (id 272883). Продолжение — за краем окна.</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0084-S02", "MR-0084--naselenie"], "h": "<p>Названные стороны мира — церковь, эльфы, король (id 272882). Об эльфах и короле в самом окне по этому миру ничего сверх упоминания не сказано; «и т п» в реплике Славы означает, что список сторон открыт и не закрыт.</p>\n<p>Сословия и уклады, названные при обсуждении магов (<a href=\"MR-0085.html\">Маги в обществе</a>): школы, улицы, казармы и армия, рыцари, наёмники, церкви. Само королевство названо: маги имеют в нём «большой влияний» (id 272372).</p>", "r": [["Маги в обществе", "MR-0085.html"]]}, {"t": "Место во вселенной — как связан с другими мирами", "a": ["S03", "MR-0084-S03", "MR-0084--mesto-vo-vselennoy"], "h": "<p>Вселенная в чате именем не названа и обозначается только как «средневековье». Связь с прежним миром — прямая: это он и есть, переделанный (id 272098). Что это был за мир, не сказано.</p>\n<p>Внутри мира выделены отдельные ветки обсуждения: маги в обществе (<a href=\"MR-0085.html\">Маги в обществе</a>) и религия и церковь (<a href=\"MR-0086.html\">Религия и церковь</a>) — обе оформлены как части этого мира. В окне также названы, но отдельно здесь не раскрыты: Магия, Мана, Расы, Рыцари.</p>", "r": [["Маги в обществе", "MR-0085.html"], ["Религия и церковь", "MR-0086.html"]]}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0084-S04", "MR-0084--kak-menyalsya-po-versiyam"], "h": "<p><strong>2024-12-21, утро (id 272089–272106).</strong> Решение: превращаем существующий мир в средневековье, система сил новая. Вопрос «с нуля или на основе магии» остался открытым.</p>\n<p><strong>2024-12-21, вечер (id 272764–272782).</strong> Страна и культура: не западная Европа и не Русь, а «Что-то другое». Материал по реальной истории решили удалить и делать средние века «из воздуха». Миколай подвёл итог: «ну теперь понятнее» (id 272781), Слава — «Вроде как» (id 272782).</p>\n<p><strong>2024-12-21, конец дня (id 272882–272890).</strong> Почти всё решено; следующий шаг — конструкция мира и стороны: церковь, эльфы, король. Отложено на потом.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0084-S05", "MR-0084--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имени у мира и у вселенной нет; в чате только «средневековье» / «средние века».</li>\n<li>Прежний мир, который переделывали, не описан: «а этот мир это какой», «мы врд не особо развили его» — ответа нет.</li>\n<li>Что для Славы значит средневековье, осталось нерешённым: «Щя попозже постараюсь описать» — описания в окне не появилось.</li>\n<li>Развилка по системе сил «вообще с нуля или на основе магии ?» (id 272106) без ответа.</li>\n<li>Культура мира не названа: вопрос «че по культуре?» (id 272775) остался без ответа, при том что от западной Европы и Руси отказались.</li>\n<li>Удалённый исторический материал Миколая в переписке не сохранён — что в нём было, не восстановить.</li>\n<li>Конструкция мира и стороны (церковь, эльфы, король «и т п») только намечены; разбор отложен и в это окно не попал.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0084--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0085.html\">Маги в обществе</a>, <a href=\"MR-0086.html\">Религия и церковь</a></li>\n<li><strong>Упомянут в мирах:</strong> <a href=\"MR-0085.html\">Маги в обществе</a>, <a href=\"MR-0086.html\">Религия и церковь</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0084--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-12-21</td>\n<td>272089–272106</td>\n<td>w0067</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-21</td>\n<td>272764–272782</td>\n<td>w0067</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-21</td>\n<td>272882–272890</td>\n<td>w0067</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0084-srednevekovyy-mir.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0084--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0084.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
