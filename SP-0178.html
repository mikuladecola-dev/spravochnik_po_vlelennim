<script>const BASE="";const DOCNAME="Телекинез";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0178-S01", "SP-0178--mehanika"], "h": "<p>«Телекинез контроль над всеми объектами» (2025-01-28, id 285333). Одна строка в перечислении сил Серафима; ни принципа действия, ни дальности, ни того, что считается объектом, в переписке не сказано.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S02", "SP-0178-S02", "SP-0178--nositeli"], "h": "<p>Серафим — «Ангел состоящий из крыльев и закрытыми глазами». Телекинез назван последним в его наборе сил; других носителей в материале нет.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S03", "SP-0178-S03", "SP-0178--kak-menyalas-po-versiyam"], "h": "<p>Одна версия, 2025-01-28 (окно w0073, сообщения 285333–285334). Первое и единственное описание — внутри общего списка сил Серафима, заданного вопросом «Как победить Серафима». Реакция Миколая на весь набор: «тяжело» (id 285334).</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S04", "SP-0178-S04", "SP-0178--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Идёт в одной связке с остальными силами Серафима, названными в том же сообщении (2025-01-28, id 285333):</p>\n<ul>\n<li>контроль времени — «он может замедлить или остановить время, а ещё пресказывать будущий иногда»;</li>\n<li>свет — «он может создавать световой оружия, шары, ослеплять противника, и перемещаться со скоростью приближенной к световой»;</li>\n<li>святой огонь — «способен исцелить его или жечи всё своих противников»;</li>\n<li>манипуляции сознанием — «открыв один из глаз своих он составить жертву утонуть в собственных воспоминаниях».</li>\n</ul>\n<p>Как телекинез взаимодействует с этими силами и есть ли между ними порядок применения, не разобрано.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "SP-0178-S05", "SP-0178--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Ограничений и цены телекинеза в переписке нет.</li>\n<li>«Контроль над всеми объектами» не уточнён: живые ли объекты входят, есть ли предел массы или количества.</li>\n<li>Вопрос «Как победить Серафима» остался без ответа — обсуждение закончилось репликой «тяжело».</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["SP-0178--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-01-28</td>\n<td>285333–285334</td>\n<td>w0073</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0178-telekinez.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0178--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0178.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["SP-0178-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/SP-0178/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — носитель. Серафима как персонажа в справочнике не существует: ни статьи, ни записи в базе. Есть <code>PS-0209</code> «Серафима» — другой персонаж из другой, пересланной вселенной, и путать их нельзя. А ссылаются на него пять отдельных статей о его силах (<code>SP-0174</code>, <code>SP-0175</code>, <code>SP-0176</code>, <code>SP-0177</code>, <code>SP-0178</code>), две сводных (<code>SP-0187</code>, <code>SP-0225</code>) и целая группа, собранная под него, — <code>GR-0008</code>. Эта статья — самый бедный конец той же дыры: у неё 1.9 КБ базы, одна строка исходника и нулевые ссылки. Пока нет носителя, разворачивать её не из чего.</p>\n<p>Вторая — реестры, в которых Серафим прописан: <code>SL-0053</code> (шесть ссылок, 20 КБ базы, статьи нет) и <code>SL-0090</code> «Реестр персонажей и сил» (четыре ссылки, статьи нет). Именно в них решается судьба этого телекинеза — см. ниже.</p>\n<h3>С чего начать</h3>\n<p>В базе, и почти всё видно без архива.</p>\n<p>Сам телекинез — это id 285333, одно перечисление, окно w0073, 2025-01-28. Разворачивать надо не его, а соседей. Ключевая соседняя запись — <code>SP-0171</code> «Телекинез и контроль территории», способность Лени: 2025-01-23, id 284176 («я думал телекинез типа лень чё то делать вот и телекинез»), затем 2025-01-24, id 284278, где в каталоге у Лени уже стоит «контроль территории». То есть во вселенной два телекинеза, разведённые пятью днями, и оба в базе есть. Дальше — <code>SL-0053</code> (окна w0073, w0077, w0079) и <code>SL-0090</code> (w0094): по ним видно, что стало с этим пунктом в перечнях сил Серафима.</p>\n<p>В архив идти только за одним: за самим Серафимом до 28 января 2025, потому что в справочник он входит уже готовым, вопросом «Как победить Серафима». Ориентир — всё, что раньше окна w0073.</p>\n<h3>Как развивалось</h3>\n<p>2025-01-28 — телекинез назван, последним пунктом в наборе из пяти сил Серафима. 2025-02-25 — в перечне его сил четыре пункта: манипуляция сознанием, контроль времени, управление светом, огонь Божий. Телекинеза нет. 2025-05-14 — та же четвёрка повторена дословно, телекинеза снова нет. Заявили — не повторили — вслух не отменяли: реплики «убираем телекинез» в переписке нигде не стоит, он просто перестал появляться в списках.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для Лени телекинез поставлен в рамку: в каталоге он записан как «контроль территории» (<code>SP-0171</code>). Для Похоти ограничение вписано прямо в название способности — «контроль разума с ограничением» (<code>SP-0169</code>). Для телекинеза Серафима сказано «контроль над всеми объектами» — без рамки и без слова «ограничение». И там же не проговорено соседнее: одна ли это способность у Лени и у Серафима, разные ли, соотносятся ли по силе. Два носителя одного названия в одной вселенной — а правило соотношения названо только внутри группы грехов, наружу оно не выведено.</p>\n<h3>Отклик</h3>\n<p>Честно: цепляться тут почти не за что — это одна строка в перечислении, самая тонкая статья из четырёх. Но одно слово в ней держит: «всеми». Не «предметами», не «телами» — всеми объектами, без единой оговорки, и это единственная сила во всём наборе, у которой нет ни глагола, ни примера. И ровно она первой выпала из следующих списков. Не берусь говорить, связано ли одно с другим, но выглядит так, будто пункт, который не удалось ничем наполнить, сам себя и вычеркнул.</p></div>", "r": []}];</script>
