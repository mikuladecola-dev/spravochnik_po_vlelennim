<script>const BASE="";const DOCNAME="Саша (Саня)";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0309-S01", "PS-0309--proishozhdenie"], "h": "<p>Материал относится к периоду вселенной, объявленной 2025-11-18 (id 386292) — «маленькая вселенная по мотивам сна» («обратные»); отдельного имени в переписке ей не дали.</p>\n<p>Саша (в тексте также «Саня») — друг рассказчика в присланном Славой тексте «Клаустрофобия» (id 387575, история <a href=\"IS-0076.html\">Клаустрофобия</a>). Он назначает встречу безымянному рассказчику от первого лица в «плохо сохранившемся ресторане», построенном «ещё наверное в союзе», в пяти километрах от населённого пункта. Про самого Сашу вне этой сцены в переписке ничего не сказано.</p>", "r": [["Клаустрофобия", "IS-0076.html"]]}, {"t": "Внешность", "a": ["S02", "PS-0309-S02", "PS-0309--vneshnost"], "h": "<p>Не описана впрямую — только поведение при встрече: рассказчик замечает его «фигуру нервное курящие в угле данного заведения», Саша «нервно замахал» рассказчику, «со стороны это могло показаться словно у него припадок».</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0309-S03", "PS-0309--harakter"], "h": "<ul>\n<li>Раньше был «слегка параноиком, что любил расказывать о теориях заговора», но несерьёзно — «так просто, как о интересной вещи, как о сериале».</li>\n<li>В сцене встречи ведёт себя иначе: звонит рассказчику «в свет не заря», настаивает на личной встрече в заброшенном месте, нервно курит, не может внятно сформулировать, что его беспокоит: «- что вообще должен был я заметить- ...- ну... - неуверенно протянул Саша - может вокруг тебя люди странно себя начали вести или... - он сделал паузу, так и не подобрав слова».</li>\n<li>Когда рассказчик просит объяснить прямо, «взбодрился и начал поливать без вязаные мысли, как будто ему в голове всё блендером перемещали»: «мёртвые глаза, как у рыбы, а ещё они что мастерят, и в новостях по кримильном хроником говорилось, что число смертей возросло, а ещё...»</li>\n<li>Требует внимания, раздражается, что его не слушают: «- ты меня слушаешь?!- прикрикнул Саня».</li>\n</ul>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0309-S04", "PS-0309--sposobnosti"], "h": "<p>Не указаны.</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0309-S05", "PS-0309--svyazi-s-drugimi"], "h": "<ul>\n<li>Рассказчик — безымянный друг от первого лица, к которому Саша обращается «Серёга»; сам рассказчик, размышляя о Саше, называет его «Сергей» («Нет, Сергей и раньше был слегка параноиком...») — в переписке не сказано, чьё это на самом деле имя, вероятна путаница имён у автора.</li>\n<li>Клаустрофобия (<a href=\"IS-0076.html\">Клаустрофобия</a>) — заглавие и материал, внутри которого Саша появляется.</li>\n</ul>", "r": [["Клаустрофобия", "IS-0076.html"]]}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0309-S06", "PS-0309--kak-menyalsya"], "h": "<h3>Версия 1 — 2025-11-21 (id 387575–387576)</h3>\n<p>Единственное и первое появление персонажа, окно w0110. Сообщение id 387576 помечено автором как «Первый» (нумерация присланных историй, см. Нумерация присланных историй (Первый, Второе, Третье, Четвёртое, Пятая) <em>(статьи ещё нет — <a href=\"kb/SL-0119-numeraciya-prislannyh-istoriy-pervyy-vtoroe-trete-chetvertoe.html\">исходник</a>)</em>). Дальше по переписке не продолжается.</p>", "r": [["Пятая)", "kb/SL-0119-numeraciya-prislannyh-istoriy-pervyy-vtoroe-trete-chetvertoe.html"]]}, {"t": "Что с ним стало", "a": ["S07", "PS-0309-S07", "PS-0309--chto-s-nim-stalo"], "h": "<p>Разговор обрывается: рассказчик, оглядев пустой ресторан («Пусто, здесь было пусто, не одного человека»), решает уйти под предлогом дел, так и не дослушав Сашу: «- а знаешь давай попозже поговорим, у меня там дела- сказал в лоб я ему». Дальнейшая судьба Саши в переписке не прослеживается.</p>", "r": []}, {"t": "Пробелы — чего в переписке нет", "a": ["S08", "PS-0309-S08", "PS-0309--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Настоящее имя рассказчика и, соответственно, кто есть кто в паре «Серёга / Сергей» — не проясняется.</li>\n<li>Что именно видел или узнал Саша про «мёртвые глаза», что именно люди «мастерят» и о какой криминальной хронике речь — не раскрыто.</li>\n<li>Дальнейшая судьба персонажа за пределами этой единственной сцены — не сказано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0309--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает истории:</strong> <a href=\"IS-0076.html\">Клаустрофобия</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0309--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-11-21</td>\n<td>387575–387576</td>\n<td>w0110</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0309-sasha-sanya.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0309--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0309.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
