<script>const BASE="";const DOCNAME="Пророки каменные";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0169-S01", "MR-0169--ustroystvo"], "h": "<p>Пророки каменные — каменные люди мира Оам, владеющие преступной организацией. Заведены одной строкой в общем перечне сторон мира: «Проротой каменный челике. Владеют преступное организацию. Некий союз с апостолами» (2025-11-17, id 385768).</p>\n<p>Из этой строки следует три вещи и только три: они каменные, у них есть преступная организация в собственности («владеют»), и у них союз с апостолами — союз назван «неким», то есть содержание союза не раскрыто.</p>\n<p>В перечне они стоят в блоке, открытом словами «Ну и дальше расы и организации который равны по силе с друг другом» — наравне с детьми мирового древа, Азуриэль, группировкой сестры, правительственной организацией по контролю (<a href=\"MR-0171.html\">Правительственная организация по контролю</a>), церковью с паладинами, организацией Виктора, пернатыми (<a href=\"MR-0174.html\">Пернатые</a>), орденом для убийства котов, вампирами и аскизами. Выше них — коты («они сильнеший») и апостолы 21 («вторая по силе раса на земле»).</p>\n<p>Написание названия в чате неустойчиво: «Проротой каменный челике», «проротой каменный челике», «Поротай», «Проротой».</p>", "r": [["Правительственная организация по контролю", "MR-0171.html"], ["Пернатые", "MR-0174.html"]]}, {"t": "Население", "a": ["S02", "MR-0169-S02", "MR-0169--naselenie"], "h": "<p>Каменные люди. Ни численность, ни отдельные имена в этих окнах не названы. Устройство самой преступной организации — состав, иерархия, чем занимается — не описано.</p>", "r": []}, {"t": "Место во вселенной — как связан с другими мирами", "a": ["S03", "MR-0169-S03", "MR-0169--mesto-vo-vselennoy"], "h": "<p>Часть вселенной Оам.</p>\n<p>Единственная названная связь — с апостолами: «Некий союз с апостолами». Апостолы в том же перечне описаны как вторая по силе раса на земле, которая «очень часто устраивают без порядок разрушая укорененый баланс между всеми» и из-за которой «в современном мире раскроется существования тёмный изнанки».</p>\n<p>Общая рамка мира, в которой пророки каменные — одна из сторон, задана репликой: «В нашем мире Оэм уже существует много сторон для конфликта» (2025-12-06, id 393290).</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0169-S04", "MR-0169--kak-menyalsya-po-versiyam"], "h": "<p><strong>2025-11-17 (окно w0109, id 385768–385769).</strong> Заведены в общем перечне: каменные, владеют преступной организацией, состоят в неком союзе с апостолами. В навигации по окну отмечена связь с ранее описанным Поротаем.</p>\n<p><strong>2025-12-06 (окно w0112, id 393286–393290).</strong> Перечень повторён дословно, строка про пророков каменных не изменена: те же каменные люди, та же преступная организация, тот же союз с апостолами. Добавлено общее замечание о мире: «В нашем мире Оэм уже существует много сторон для конфликта».</p>\n<p>Между двумя версиями содержание не менялось — менялся только контекст, в котором перечень повторялся.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0169-S05", "MR-0169--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Написание названия в чате неустойчиво; связь с прежним «Поротай» просматривается по смыслу, но прямо в окне w0109 не проговорена.</li>\n<li>Что именно за союз с апостолами — сказано только «некий», содержание не раскрыто.</li>\n<li>Чем занимается преступная организация, как называется, кто в ней — не сказано.</li>\n<li>Имён и отдельных персонажей среди пророков каменных не названо.</li>\n<li>Что значит «каменные» физически (материал тела, происхождение, способности) — в переписке не разобрано.</li>\n<li>Где живут — не названо.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0169--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0171.html\">Правительственная организация по контролю</a>, <a href=\"MR-0174.html\">Пернатые</a></li>\n<li><strong>Упомянут в мирах:</strong> <a href=\"MR-0171.html\">Правительственная организация по контролю</a>, <a href=\"MR-0174.html\">Пернатые</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0064.html\">Пророки каменные («Проротой каменный челике», Поротаи)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0008.html\">Оам</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0169--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-11-17</td>\n<td>385768–385769</td>\n<td>w0109</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-06</td>\n<td>393286–393290</td>\n<td>w0112</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0169-proroki-kamennye.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0169--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0169.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
