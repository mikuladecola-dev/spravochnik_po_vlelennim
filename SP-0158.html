<script>const BASE="";const DOCNAME="Чревоугодие";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0158-S01", "SP-0158--mehanika"], "h": "<p>Чревоугодие (в вариантах имени также «gula», «Чревоугодие (грех)») — один из семи грехов в системе «магия по грехам». Разбиралось вместе с остальными шестью грехами в одном заходе (2024-12-24, id 273904–273921).</p>\n<p><strong>Вариант Миколая (2024-12-24, id 273904–273908).</strong> Даётся в двух режимах — «если одна способность» и «как набор».</p>\n<p>Если одна способность: «способность всё хавать или поглощать, в том числе магию которая меньше облака заклинания, даже чужая магия. это благословение, ибо влияние, а не создание». То есть поглощается всё подряд, включая магию, — с порогом: магия должна быть меньше облака заклинания. Чужая магия поглощается тоже. Категория определена сразу и однозначно, в отличие от похоти (<a href=\"SP-0157.html\">Похоть (грех)</a>): чревоугодие — благословение, и основание названо — «ибо влияние, а не создание».</p>\n<p>Как набор: «поглощение чужих навыков, но не себе. он их поглощает и они исчезают». То есть носитель не присваивает поглощённое: навык не переходит к нему, а пропадает.</p>\n<p>Что такое «облако заклинания» и как измеряется размер магии относительно него — в переписке не объяснено.</p>", "r": [["Похоть (грех)", "SP-0157.html"]]}, {"t": "Ограничения и цена", "a": ["S02", "SP-0158-S02", "SP-0158--ogranicheniya-i-cena"], "h": "<p>Ограничение одно и названо прямо: поглощается только та магия, которая «меньше облака заклинания». Верхний предел, за которым магия уже не поглощается, задан этой мерой и ничем больше.</p>\n<p>Второе ограничение — в режиме набора: поглощённые чужие навыки не достаются носителю, «он их поглощает и они исчезают».</p>\n<p>Отдельного проклятья за чревоугодием не закреплено — в отличие от алчности («ты не можешь ничего отдать кому либо») и гнева, где Миколай проклятья прописал.</p>\n<p>В том же окне Миколай замечает: «но в грехах это базовое подразумевается, такова природа греха» (2024-12-24, id 273917). К чему относится «это», из сохранённого куска не восстанавливается.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0158-S03", "SP-0158--nositeli"], "h": "<p>Носители не названы.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0158-S04", "SP-0158--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-12-24 (id 273904–273908), Миколай.</strong> Поглощение всего, включая чужую магию, если она меньше облака заклинания; категория — благословение. В варианте набора — поглощение чужих навыков без присвоения их себе.</p>\n<p><strong>Версия 2 — 2024-12-24 (id 273917–273921), Слава.</strong> Принято без изменений. Слава проходит по списку грехов Миколая и напротив чревоугодия пишет одну строку: «Чревоугодие ок». Из семи грехов без правок он принял два — чревоугодие и гнев («Гнев ну ок»).</p>\n<p>Дальнейших версий у чревоугодия нет: к 2024-12-25, когда Миколай пересматривал гордыню (<a href=\"SP-0162.html\">Гордыня (грех)</a>), чревоугодие не пересматривалось.</p>", "r": [["Гордыня (грех)", "SP-0162.html"]]}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S05", "SP-0158-S05", "SP-0158--otklonennye-varianty"], "h": "<p>Отклонённых вариантов нет — вариант принят с первого предъявления.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S06", "SP-0158-S06", "SP-0158--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Входит в набор «Семь грехов (магия по грехам)» вместе с похотью (<a href=\"SP-0157.html\">Похоть (грех)</a>), гордыней (<a href=\"SP-0162.html\">Гордыня (грех)</a>), алчностью, ленью, гневом и завистью. Все семь разбирались одним списком в сообщении id 273906 и одним ответным списком в id 273920.</p>\n<p>Пересекается с алчностью. У Миколая алчность — воровство вещей с хранением их в пространстве, а Слава на неё отвечает: «Я думал больше о способности поглощений чужой манный или объектов» (2024-12-24, id 273920), то есть предлагает для алчности поглощение — механику, уже отданную чревоугодию. Как две способности с поглощением должны разойтись между собой, в переписке не обсуждалось — осталось нерешённым.</p>\n<p>Деление на «стихию», «благословение» и «проклятье», по которому чревоугодие определено как благословение, применяется и к остальным грехам; критерий сформулирован здесь же: благословение — это влияние, а не создание.</p>", "r": [["Похоть (грех)", "SP-0157.html"], ["Гордыня (грех)", "SP-0162.html"]]}, {"t": "Пробелы", "a": ["S07", "SP-0158-S07", "SP-0158--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Не выбрано, одна это способность (поглощение всего) или набор (плюс поглощение чужих навыков).</li>\n<li>«Облако заклинания» как мера не объяснено.</li>\n<li>Не сказано, куда девается поглощённое в первом режиме — усваивается ли носителем, в отличие от навыков, которые прямо «исчезают».</li>\n<li>Не сказано, поглощаются ли живые существа и что вообще входит в «всё хавать».</li>\n<li>Разграничение с алчностью, которой Слава тоже предложил поглощение, не проведено.</li>\n<li>Носители не названы.</li>\n<li>Вселенная в исходной записи помечена как неясная: привязка к средневековой вселенной (объявлена 2024-12-21, id 272184) сделана по дате объявления, а не по прямому указанию в переписке.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0158--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0157.html\">Похоть (грех)</a>, <a href=\"SP-0162.html\">Гордыня (грех)</a></li>\n<li><strong>Упомянут в способностях:</strong> <a href=\"SP-0157.html\">Похоть (грех)</a>, <a href=\"SP-0162.html\">Гордыня (грех)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0158--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-12-24</td>\n<td>273904–273908</td>\n<td>w0068</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-24</td>\n<td>273917–273921</td>\n<td>w0068</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0158-chrevougodie.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0158--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0158.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
