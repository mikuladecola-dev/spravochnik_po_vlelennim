<script>const BASE="";const DOCNAME="Маура";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0376-S01", "PS-0376--proishozhdenie"], "h": "<p>Маура появляется в переписке 2026-06-07 (id 488546, окно w0121) — единственным упоминанием, внутри скобки в длинном описании способностей Имета (Имитатора). Отдельного разговора о персонаже не было: он назван как ученик Имета по стилю боя.</p>\n<p>Маура — апостол. Апостолы в этом разговоре проходят как отдельная категория носителей силы: их двенадцать («6 героев, 6 злодеев, 4 ахрепископа, 12 апостолов, ну и кто-нибудь из Нимба» — из более раннего разговора), и по словам Славы часть из них держит нейтралитет. В той же реплике, где назван Маура, апостолы упоминаются как те, кто в принципе может иногда применить «оу»: «Ну возможно кто-нибудь из апостолов оу может иногда применить, но материализацию точно нет. Сдохнут ведь, даже если апостолы».</p>\n<p>В имени встречается вариант «Мауру» (падежная форма в исходной реплике). Вселенная в карточке помечена как «неясно» — привязка сделана только по дате объявления.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0376-S02", "PS-0376--vneshnost"], "h": "<p>Названа одна деталь: уродливая маска. Дословно — «уродливая маска апостол со способностью вибрация». Больше о внешности в переписке ничего нет.</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0376-S03", "PS-0376--sposobnosti"], "h": "<p>Вибрация. Маура владеет ею как апостол, и стилю боя его обучил Имет: «Он также научил этому стилю Мауру».</p>\n<p>Сама вибрация описана в переписке применительно к Имету, а не к Мауре. Имет держит в голове три программы, одну всегда оставляет чистой, а остальные заполняет; во второй слот он чаще всего ставит вибрацию — «Именно что вибрации всего». Механика: «при ударе он способен вызвать вибрации чужую конструкция, ослабевая или вообще уничтожая способность». Уничтожается именно способность, которая уже применена: «Именно что способность что уже применена. Но враг может быстро применить опять способность, всё же у него готовый шаблон». Причина, по которой Имет предпочитает вибрацию, названа прямо: «Он чаще всего использует вибрацию потомучто это прикольне».</p>\n<p>Второй вариант заполнения того же слота у Имета — огонь, в котором он «спец», «так сказать план б если вдруг ситуация будет рисковой, чтобы у него была способность в которой он уверен». Первая программа у Имета — кукловод, суть «Я не умру пока не кончится оам».</p>\n<p>Насколько из этого описания относится к Мауре, в переписке не сказано: передан только стиль боя, а программы, кукловод, мимик-артефакт и прочее приписаны Имету.</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0376-S04", "PS-0376--svyazi-s-drugimi"], "h": "<ul>\n<li>Имет (Имитатор) — учитель. Обучил Мауру стилю боя (вибрации).</li>\n<li>Апостолы — Маура один из них.</li>\n<li>Вибрация (Волнистый удар) — его способность.</li>\n</ul>", "r": []}, {"t": "Как менялся", "a": ["S05", "PS-0376-S05", "PS-0376--kak-menyalsya"], "h": "<p>Версия одна, 2026-06-07 (id 488546, окно w0121). Изменений и переработок не было.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0376-S06", "PS-0376--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Кроме маски и вибрации, о персонаже ничего не сказано.</li>\n<li>Сторона (герои, злодеи, нейтралитет) не названа. Про апостолов в целом сказано, что нейтралитет держат «конечно не все», но к Мауре это не отнесено.</li>\n<li>Характер, происхождение, судьба — в переписке нет.</li>\n<li>Пол напрямую не назван; в реплике идут вперемешку «уродливая маска апостол» и «научил этому стилю Мауру».</li>\n<li>Не сказано, владеет ли Маура «оу» и «сл», хотя обе системы обсуждаются в той же реплике.</li>\n<li>Не сказано, в чём именно состоит переданный стиль боя и отличается ли применение вибрации у Мауры от применения у Имета.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["PS-0376--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-06-07</td>\n<td>488546–488546</td>\n<td>w0121</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0376-maura.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0376--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0376.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
