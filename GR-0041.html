<script>const BASE="";const DOCNAME="Секты, выращивающие сверхлюдей";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0041-S01", "GR-0041--chto-eto"], "h": "<p>Секты, выращивающие сверхлюдей — организации из вселенной «монстры», названные Славой при описании мира 2024-11-17 (id 259085–259089, окно w0064).</p>\n<p>Строго говоря, это не одна организация, а класс организаций: в переписке они всегда во множественном числе и всегда друг другу враждебны. Отдельных сект по именам нет ни одной, поэтому статья описывает не конкретную секту, а то общее, что о них сказано.</p>\n<p>Мир, в котором они существуют, описан так: «Обычный современный мир где все хорошо, но там существует секты который выращивают сверх людей ( то бишь с сосудом) и вот сейчас происходит война сект, и сект в данный момент пытаются либо вернуть либу убить своих сверх людей который от них сбежали чтобы при случай чего не было ножа в спину» (2024-11-17, id 259085).</p>\n<p>Сверхлюди в этом определении приравнены к носителям сосуда: «сверх людей ( то бишь с сосудом)». Что такое сосуд, объяснено отдельно, в разговоре о концепте силы получасом раньше (2024-11-17, id 258985) — см. раздел об общих способностях.</p>\n<p>Способ пополнения рядов уточнён вопросом Миколая: «типа обычным людям встраивают сосуд или детей с сосудом развивают или че» (id 259088). Ответ Славы: «Детей с сосудом находят и выращивают» (id 259089). То есть вариант со встраиванием сосуда обычным людям был назван и не принят — секты работают только с теми, у кого сосуд уже есть от рождения.</p>\n<p>Мир, в котором действуют секты, возник у Славы из внешнего источника: «Я недавно смотрел анимацию боёв стикменов», «И там был маломальский сюжет» (2024-11-17, id 259081–259082). Названия у вселенной в самом чате нет.</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0041-S02", "GR-0041--sostav"], "h": "<ul>\n<li><a href=\"PS-0169.html\">Владелец чёрного ящика</a> — Владелец чёрного ящика.</li>\n</ul>\n<p>Здесь нужна оговорка. Единственный названный персонаж, связанный с сектами, — не действующий член секты, а беглец: «Владелец черного ящика тоже сбежал из секты» (2024-11-17, id 259086). Слово «тоже» ставит его в один ряд с остальными сбежавшими сверхлюдьми, которых секты сейчас ловят или убивают. Имени у него нет.</p>\n<p>Ни одного человека, состоящего в секте, — руководителя, вербовщика, воспитателя, рядового сверхчеловека, оставшегося на месте, — в переписке не названо. Поимённого состава сект нет; названий самих сект нет.</p>", "r": [["Владелец чёрного ящика", "PS-0169.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0041-S03", "GR-0041--obschie-sposobnosti-gruppy"], "h": "<p>О самих сектах как об организациях сказано только одно умение: они находят детей с сосудом и выращивают из них сверхлюдей (2024-11-17, id 259085, 259089). Как именно находят — по каким признакам, в каком возрасте, какими средствами — в переписке не сказано. Чему именно учат и как выращивают — тоже не сказано.</p>\n<p>Всё остальное известное относится к материалу, с которым секты работают, — к системе энергии, сосуда и структуры, изложенной Славой в тот же день (2024-11-17, id 258985, окно w0064):</p>\n<ul>\n<li>Энергией владеют все, но без структуры: «В этом мире каждый владеет энергий ( без структуры) просто энергий».</li>\n<li>Рождаются те, у кого есть сосуд, — он позволяет накапливать энергию, и накопление идёт «с самого рождения».</li>\n<li>Накопленная энергия «создаёт свою уникальную структуру ( то бишь способность)».</li>\n<li>От чего зависит структура: «это может зависеть от всего от психологического состояния ребенка, от сосуда, от среды, и т.п.».</li>\n<li>Срок: «Энергий становится структурной примерно в 7 лет».</li>\n<li>Избыток: «типо если её слишком много сосуд выпускают ту которую не может удержать».</li>\n<li>Развитие: «Сосуд ещё можно качать / Как и объем и контроль структурной энергий».</li>\n</ul>\n<p>Прямой связки «секты качают сосуд своим воспитанникам» в переписке нет — сказано лишь, что сосуд, объём и контроль в принципе поддаются прокачке, и отдельно, что секты детей с сосудом выращивают. Пункт про зависимость структуры от «психологического состояния ребенка» и «от среды» тоже нигде не сведён с работой сект напрямую.</p>\n<p>Уточнение по способностям как таковым (2024-11-17, id 258997): способность — это структура; чёрный ящик «это структура», которая «поверх свой структуры образует хранящую внутри него структуру», и в нём «может хранится фиг знает сколько структур».</p>", "r": []}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0041-S04", "GR-0041--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p>Единственное сказанное различие между сверхлюдьми — уровень, и он не выровнен: «И все они по уровню друг другу разный» (2024-11-17, id 259087). Реплика стоит сразу после сообщения о беглом владельце чёрного ящика и относится к сбежавшим сверхлюдям. Шкалы уровней, разрядов, границ «сильный / слабый» в переписке нет.</p>\n<p>Второй источник различий заложен в самой системе: структура у каждого уникальна и складывается из психики ребёнка, его сосуда и среды (id 258985). То есть двух одинаковых воспитанников быть не может по устройству мира, но какие структуры получились у кого — не перечислено.</p>\n<p>Единственный расписанный случай — способность беглеца, «Чёрный ящик» (<a href=\"SP-0120.html\">Чёрный ящик</a>), разобранная в том же окне w0064 2024-11-17 (id 258912–259140):</p>\n<ul>\n<li>Первая формулировка: «Черный ящик ( выдает разный способности ) / Является частичной передающий способностью» (id 258912). Миколай на неё ответил: «это ваще не понятно», «мало деталей», «даже на примера нет» (id 258920–258923).</li>\n<li>Развёрнутая механика (id 258924): владелец «способен создавать разный черный орудий броню / Или создать черный кубик разного размера ( без разницы) и открывая его, владельцу выдаётся способность типо управления огнем, молниями, супер скорость и т.п.». Сравнение авторское: «То бишь как Омнитрикс ( из Бен 10) только он не изменяет форму владельца а просто даёт способность».</li>\n<li>Ограничения: способностей за раз — одна (id 258940); смена — «сначала ждёт когда это способность исчезнет и потом снова открывает черный ящик» (id 258944); срок действия — «10 минут +-» (id 258948); выпадение случайное, ранги и разные шансы выпадения отвергнуты: «Нет, каждая способность по своему полезная в разных ситуациях», «Нету» (id 258932, 258936).</li>\n<li>Список выпадающих способностей нужен был «хотя бы 20» (id 258953) и в том разговоре так и не собран.</li>\n</ul>", "r": [["Чёрный ящик", "SP-0120.html"]]}, {"t": "Отношения с другими группами", "a": ["S05", "GR-0041-S05", "GR-0041--otnosheniya-s-drugimi-gruppami"], "h": "<p>Между собой секты воюют: «и вот сейчас происходит война сект» (2024-11-17, id 259085). Причины войны, стороны, давность и текущее положение дел не названы.</p>\n<p>Со своими сбежавшими сверхлюдьми у сект отношение однозначное и названо дословно: каждая «пытаются либо вернуть либу убить своих сверх людей который от них сбежали чтобы при случай чего не было ножа в спину» (id 259085). Мотив — страховка от удара с тыла в момент войны; уточнений, ловит ли секта чужих беглецов или только своих, в переписке нет.</p>\n<p>Отдельно: в источниках группы есть ещё одно упоминание секты — в записи об организации Насла (2026-06-17, id 491162, окно w0122): «В данной организации также вступила и секта что считает сл демонами вылезший из ада». Это другая дата, другое окно и другой материал; с сектами, выращивающими сверхлюдей, в переписке она нигде не связана, и вселенная у той записи не названа. Связь не устанавливается.</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S06", "GR-0041-S06", "GR-0041--kak-menyalas"], "h": "<p><strong>2024-11-17, окно w0064</strong> — единственный день, когда секты обсуждались. Внутри дня порядок такой:</p>\n<ul>\n<li>13:35–13:40 (id 258978–258985) — Слава по вопросу «Ты помнишь концепт силы ?» заново излагает систему энергии, сосуда и структуры, потому что Миколай не помнит: «помню много всяких было», «я короче не помню». Это повтор ранее обсуждавшейся мысли; оригинал в архиве раньше.</li>\n<li>13:42–13:46 (id 258986–259005) — уточнение, что способность есть структура и что чёрный ящик хранит внутри себя другие структуры.</li>\n<li>14:03–14:06 (id 259078–259085) — Слава объявляет мир: обычный современный мир, секты, война сект, охота на беглецов.</li>\n<li>14:07 (id 259086–259087) — владелец чёрного ящика назван беглецом из секты; уровень у беглецов разный.</li>\n<li>14:08–14:09 (id 259088–259089) — уточнение способа: не встраивание сосуда обычным людям, а поиск и выращивание детей с сосудом.</li>\n<li>14:10 (id 259090–259092) — Миколай: «тогда», «учитывая мир», «что ты предлагаешь?». Ответа про секты не последовало: разговор ушёл в проблему наполнения чёрного ящика способностями (id 259093 и дальше).</li>\n</ul>\n<p>После 2024-11-17 секты в переписке не возвращались. Ни одной новой версии, уточнения или отмены сказанного в источниках нет.</p>\n<p>Отклонённые и отложенные варианты, названные в этом же окне (относятся к способности беглеца, не к сектам):</p>\n<ul>\n<li>Встраивание сосуда обычным людям — предложено как вариант вопросом Миколая (id 259088), не принято.</li>\n<li>Ранжирование способностей (обычные / редкие / эпические / уникальные) и разные шансы выпадения — предложено Миколаем (id 258926–258934), отвергнуто Славой. Позже Миколай повторил: «поэтому систему ранжирования можно сделать» (id 259016) — без ответа.</li>\n<li>Разбить набор способностей Пламенного на отдельные кубики (реген, управление огнём, сила, передвижение в земле) — предложено Миколаем (id 259060–259066), отвергнуто: «Нет типо разделять способности который изначально были вмести как глупо», «Да и плюсом все по отдельности они какие то слабый» (id 259067, 259069).</li>\n<li>Слабость «молния + вода», отключающая или дебафающая способность либо самого носителя (id 259049–259051), — отложено: «Ну это потом» (id 259052).</li>\n<li>Стихийный набор для списка способностей — шесть стихий или четыре, если не считать тьму и свет; вопрос «полёт это ветер или другое?» остался без ответа: «Не знаю» (id 258957–258962). Список так и не собран.</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S07", "GR-0041-S07", "GR-0041--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Названий сект нет ни одного. Сколько их всего — не сказано.</li>\n<li>Поимённого состава нет: ни главы, ни воспитателей, ни рядовых сверхлюдей, оставшихся в секте. Единственный названный связанный персонаж — беглец <a href=\"PS-0169.html\">Владелец чёрного ящика</a>, у которого нет и имени.</li>\n<li>Иерархии нет: как секта устроена внутри, кто кому подчиняется, есть ли ступени у воспитанников — в переписке не сказано.</li>\n<li>Как секты находят детей с сосудом — не сказано. Как именно выращивают — не сказано.</li>\n<li>Причины и ход войны сект не названы; кто с кем воюет и из-за чего — осталось нерешённым.</li>\n<li>Не сказано, ловят ли секты чужих беглецов или только своих.</li>\n<li>Не сказано, качают ли секты сосуд и контроль своим воспитанникам, хотя сама возможность прокачки в системе есть.</li>\n<li>Шкалы уровней нет: сказано только, что «все они по уровню друг другу разный».</li>\n<li>География, время действия, отношение обычного мира к сектам — не названы. Мир описан как «обычный современный», где «все хорошо».</li>\n<li>Названия вселенной в чате нет; «монстры» проставлено по дате объявления.</li>\n<li>Вопрос Миколая «что ты предлагаешь?» (id 259092) остался без ответа — линия сект оборвалась на нём.</li>\n</ul></div>", "r": [["Владелец чёрного ящика", "PS-0169.html"]]}, {"t": "Связи — всё вместе", "a": ["GR-0041--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0169.html\">Владелец чёрного ящика</a></li>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0120.html\">Чёрный ящик</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0041--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0041.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0041-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0041/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Самая дорогая дыра — <code>PS-0169</code> «Владелец чёрного ящика»: три ссылки (<code>SP-0120</code>, <code>MR-0071</code>, <code>GR-0042</code>, плюс эта статья), статья есть, а базы под ней 2 548 знаков. Его же способность <code>SP-0120</code> «Чёрный ящик» — 54 937 знаков, в двадцать с лишним раз больше. Единственный человек, связывающий секты с остальным миром, известен ровно двумя фактами: сбежал и владеет предметом. Ни имени, ни возраста, ни того, из какой секты бежал. Пока эта запись не наполнена, сектам не с кем сталкиваться: у <code>GR-0041</code> ноль входящих ссылок, у <code>MR-0071</code> «Мир сект и сбежавших сверхлюдей» четыре ссылки при 3 541 знаке базы.</p>\n<p>Второе — самих сект как сущностей нет: ни одного названия, значит ни одного кода, значит в числах эта дыра не видна вообще. Рядом при этом стоит развитая механика, вся со статьями: <code>MR-0070</code> «Энергия, сосуд и структура» (4 ссылки, 5 784), <code>MR-0073</code> «Кристаллизация энергии» (4 ссылки, 7 341), <code>MR-0072</code> (2 ссылки), <code>SP-0122</code> (3), <code>SP-0123</code> (3), <code>SP-0125</code> (2). Устройство мира проработано, действующих лиц в нём нет ни одного — включая противника, вокруг которого мир объявлен.</p>\n<h3>С чего начать</h3>\n<p>В базе, и с одной конкретной записи. <code>SL-0013</code> «Список персонажей Славы» — две ссылки, статьи нет, 9 986 знаков, вселенные «Цветной мир» и «монстры», среди вариантов имени стоит «Список способностей». Внутри перечень названий одной строкой: энергет, прятки, закон, петля, феникс, Тен, волк, дракон, ци, имитатор, спартанец, вампир, драгоценность, бессмерт, жук, лёд, Дилан, граница, солнце. Статья фиксирует, что список выпадающих из чёрного ящика способностей нужен был «хотя бы 20» и так и не собран. В этом перечне девятнадцать позиций, и он старше окна сект: версия 2 — 2024-09-24, окно w0059, id 235514–235555. Проверять надо это до всего остального.</p>\n<p>Потом архив, две точки.</p>\n<ul>\n<li>Раньше 2024-11-17. В 13:35 Слава излагает концепт силы заново, потому что соавтор не помнит: «помню много всяких было», «я короче не помню». Значит первый разговор про сосуд лежит в архиве раньше и в собранное не попал. Ориентир — окрестности w0059 (2024-09-24) и промежуток между сентябрём и ноябрём 2024-го.</li>\n<li>id 259093 и дальше, окно w0064. Вопрос «что ты предлагаешь?» (id 259092) — последняя реплика про секты во всей переписке; надо увидеть, чем именно её перебило и было ли это переключение осознанным.</li>\n</ul>\n<p>Записи «неясно», которые стоит проверить на принадлежность к этому же миру, прежде чем заводить новое: <code>MR-0195</code> «Искусственные сверхлюди (ИС)» (5 986), <code>MR-0199</code> «Сверхлюди и война» (2 071), <code>MR-0205</code> «Использование сверхлюдей государствами в войнах» (3 429), <code>MR-0005</code> «мир первых сверхлюдей (2024)» (7 504), <code>SP-0272</code> «Плёнка сверхлюдей» (3 859). Все без статей. Тематически это тот же узел — организации, растящие сверхлюдей, и война вокруг них.</p>\n<h3>Как развивалось</h3>\n<p>Всё уложилось в тридцать пять минут одного дня. 13:35 — заявили повторно: концепт силы пересказан по памяти, потому что оригинал забыт. 13:42 — уточнили: способность есть структура, чёрный ящик хранит структуры внутри своей структуры. 14:03 — объявлен мир: обычный современный, секты, война сект, охота на беглецов. 14:07 — назван беглец и сказано, что беглецы разного уровня. 14:08 — ограничили: сосуд не встраивают, детей с сосудом находят готовыми; вариант соавтора отклонён в ту же минуту. 14:10 — «что ты предлагаешь?» остаётся без ответа, и разговор уходит в наполнение чёрного ящика. Возврата не было: после 2024-11-17 секты не появляются ни разу, ни новой версии, ни отмены.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Правило происхождения сверхлюдей сформулировано отрицанием и потому жёстко: встраивать сосуд обычным людям нельзя, детей с сосудом находят уже такими. Это делает воспитанников исчерпаемым ресурсом, а войну сект — войной за него. Насколько ресурс редок, нигде не проговорено: сколько таких детей рождается, часто ли, зависит ли это от чего-нибудь. Для устройства самого сосуда правила названы подробно — накопление с рождения, структура к семи годам, сброс избытка, возможность прокачки; для частоты, с которой сосуд вообще встречается, — ни слова. Место, где для внутреннего устройства числа названы, а для внешнего, из которого следует цена войны, — нет.</p>\n<h3>Отклик</h3>\n<p>«Детей с сосудом находят и выращивают» — сказано как техническое уточнение, в ответ на уточняющий вопрос, и в этой интонации вся жестокость мира, которую никто не собирался подчёркивать. Сильно и то, что мотив охоты на беглецов назван не гордостью и не порядком, а страховкой: «чтобы при случай чего не было ножа в спину». Секты не мстят, они воюют и не могут позволить себе незакрытый хвост — это взрослое объяснение, редкое для одного дня работы. Зацепило другое соседство, которое авторы поставили рядом и не свели: структура человека зависит от «психологического состояния ребенка» и «от среды», а растят этих детей организации, которым нужны бойцы. Правило и его самое неприятное следствие лежат в одном окне, в получасе друг от друга, и никто из двоих на это не наступил. И ещё: линия оборвалась ровно на вопросе «что ты предлагаешь?» — на месте, где идея впервые потребовала не описания, а решения.</p></div>", "r": []}];</script>
