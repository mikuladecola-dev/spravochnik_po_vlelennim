<script>const BASE="";const DOCNAME="Контроль тела";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0011-S01", "SP-0011--mehanika"], "h": "<p>Контроль тела — третья способность в наборе персонажа, который сначала назывался Демоном, а позже — парнем в белой маске с улыбкой. Формулировка авторов держится дословно одинаковой во всех версиях: он «может как либо изменять тела и регенерировать» (2023-03-27, id 37577; повторено 2024-07-10, id 202913).</p>\n<p>Способность объединяет два действия — изменение собственного тела и регенерацию. До того как её оформили под этим названием, регенерация предлагалась Славой отдельным пунктом (2023-03-27, id 37549–37552: «Ну регенерация», «Так да 3», «Надо»).</p>\n<p>Вариант имени, зафиксированный в карточке: «регенерация».</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S02", "SP-0011-S02", "SP-0011--nositeli"], "h": "<p>Персонаж в белой маске с улыбкой, он же Демон в ранних версиях. Описание носителя дано в id 202912 (2024-07-10): «17 летние нормального телосложения ходит в белой маски где нарисовано улыбка черный плащ. Убивает в прямом эфире сверхлюдей который делали грехи на подобие безмысленного убийство или каких ещё грехов».</p>\n<p>Также способность приписана «персонажу с иконками способностей» — в окне w0020 его имя не названо, дана отсылка к сообщению 37532.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S03", "SP-0011-S03", "SP-0011--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2023-03-27 (id 37549–37553).</strong> Регенерация названа отдельной способностью, самостоятельным пунктом списка. Тут же Миколай задаёт вопрос, который остался без ответа: «А как же способность лечить других и способность других приводить в сознание» (id 37553).</p>\n<p><strong>Версия 2 — 2023-03-27 (id 37576–37580).</strong> Регенерация переоформлена в третий пункт под названием «контроль тела». Слава перечисляет набор целиком: «Первая контроль грешниками вторая ускорения третий контроль тела( он может как либо изменять тела и регенерировать)» (id 37577). Следом добавляется четвёртая — душа грешника (id 37580).</p>\n<p><strong>Версия 3 — 2023-12-14 (id 63305–63310).</strong> Только название в перечне способностей, механика не раскрывается. Миколай просит нейросеть нарисовать персонажа и иконки способностей и раскладывает их по позициям: «Сверху слева на право: контроль грешниками, ускорение. Снизу: контроль тела, душа грешника» (id 63306). Контроль тела — иконка снизу слева.</p>\n<p><strong>Версия 4 — 2024-07-10 (id 202911–202915).</strong> Повтор прежней мысли. Миколай заново вводит персонажа как «второй врд» и дословно воспроизводит формулировку 2023 года: «Первая контроль грешниками вторая ускорения третий контроль тела( он может как либо изменять тела и регенерировать)» (id 202913).</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S04", "SP-0011-S04", "SP-0011--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Контроль тела идёт третьим номером в наборе персонажа. Рядом с ним в перечнях названы:</p>\n<ul>\n<li>контроль грешниками — первая, с формулировкой «тем грешней человек тем лучше контролирует он их» (id 202912);</li>\n<li>ускорение — вторая;</li>\n<li>душа грешника — четвёртая, «хватая противника за голову и за 3 минуты создаёт в его голове мир где он проживает разный или одну жизнь» (id 37580).</li>\n</ul>\n<p>В сообщении id 202912 сказано, что способностей у персонажа должно быть шесть, но перечислены четыре. Остальные две в переписке не названы.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "SP-0011-S05", "SP-0011--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Механика «как либо изменять тела» не расшифрована: что именно и в каких пределах изменяется — в переписке не сказано.</li>\n<li>Не сказано, изменяет ли носитель только собственное тело или чужие: формулировка «изменять тела» стоит во множественном числе, а навигационная запись говорит об изменении собственного тела. Разночтение в переписке не разрешено.</li>\n<li>Цена, ограничения и предел регенерации не названы.</li>\n<li>Вопрос Миколая про «способность лечить других и способность других приводить в сознание» (id 37553) остался без ответа.</li>\n<li>В окне w0020 (2023-12-14) механика и вселенная не описаны.</li>\n<li>Заявлено шесть способностей, названо четыре — две остались неназванными.</li>\n<li>В версиях 1–3 вселенная не определена; принадлежность к «7 островам» проставлена по дате объявления только для версии 4.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0011--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0011--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2023-03-27</td>\n<td>37549–37553</td>\n<td>w0011</td>\n<td>неясно (не определено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2023-03-27</td>\n<td>37576–37580</td>\n<td>w0011</td>\n<td>неясно (не определено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2023-12-14</td>\n<td>63305–63310</td>\n<td>w0020</td>\n<td>неясно (не определено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-10</td>\n<td>202911–202915</td>\n<td>w0047</td>\n<td>7 островов (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0011-kontrol-tela.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0011--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0011.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
