<script>const BASE="";const DOCNAME="Организация, ловящая обнаглевших существ";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0053-S01", "GR-0053--chto-eto"], "h": "<p>Организация, которая ловит существ, совершивших преступления, при этом сами существа могут в ней работать. Собственного имени у организации в переписке нет: она названа описанием и по нему же заведена в базу. Варианты имени в базе — «Организация, ловящая обнаглевших существ» и просто «организация»; у записи <a href=\"MR-0006.html\">Организация по отлову существ-преступников</a> в вариантах имени числится ещё и «зло против добра» — так Слава обозначил рамку, в которую организация вставлена при первом объявлении.</p>\n<p>Строго говоря, это не группа с известным составом, а элемент устройства вселенной: в базе обе относящиеся к ней записи (<a href=\"MR-0006.html\">Организация по отлову существ-преступников</a> и <a href=\"MR-0007.html\">Концепция scp / охота на аномалий</a>) заведены по виду «мир», а не по виду «группа». Поимённого состава нет ни одного человека — в переписке не названо ни одного сотрудника организации по имени. Всё, что о ней известно, — принцип работы и то, кого она ловит и кого посылает ловить.</p>\n<p>Появляется организация в первом заходе Славы на новую вселенную (2024-04-01, id 150629–150675). Формулировка Славы: «типо вот есть организация которая ловит обнаглевших или совершивший преступлений существ ( при этом эти существа могут работать в этой организации)». Тогда же он объясняет, зачем вселенная вообще заводится: «Построить новую вселенную, прошлая про сверсилы как та уже надоело. Эту вселенную я хочу затолкать зло против добра».</p>\n<p>Пояснение на пальцах даётся через вампиров и оборотней (2024-04-01 09:43, id 150659): «Вот допустим есть вампиры и оборотни и вот какой нибудь вампир начал гасить людей , а не питаться мертвыми И это организация обязана его устранить и вот они посылают человека или вампира или оборотня ну кто есть Вот и все». Здесь же Слава оговаривает, что пример нужен только для понимания устройства, а не как готовый мир: «Это не та вселенная которой я хочу здесь чисто принцип».</p>\n<p>Через сутки та же организация переописана заново (2024-04-02, id 152590–152605). Слава отказывается от рамки добро/зло: «изначально я хотел что была организация которая борется с злом то бишь добро и зло но сейчас думая мне как то не нравится Лучшей будет создать концепцию scp только вбухать туда и сверхсила типо петли и закона, и экспериментах на людях И другую расу которая будет нам помогать Вообще концепция охота на аномалий». Обе версии — это одно и то же место в устройстве вселенной: организация, которая отлавливает опасное. Меняется, что именно она отлавливает (обнаглевших существ — аномалии) и по какой рамке (добро против зла — scp).</p>", "r": [["Организация по отлову существ-преступников", "MR-0006.html"], ["Концепция scp / охота на аномалий", "MR-0007.html"]]}, {"t": "Состав", "a": ["S02", "GR-0053-S02", "GR-0053--sostav"], "h": "<p>Поимённого состава нет: в переписке не назван ни один сотрудник организации.</p>\n<p>Названы только категории тех, кого организация отправляет на задание: человек, вампир, оборотень — «ну кто есть». Отдельно оговорено, что существа-нарушители, то есть те же вампиры и оборотни, «могут работать в этой организации».</p>\n<p>К организации примыкает идея агентов (Агенты, берущие силу от животных <em>(статьи ещё нет — <a href=\"kb/ID-0039-agenty-beruschie-silu-ot-zhivotnyh.html\">исходник</a>)</em>, 2024-04-02 06:58, id 151856–151860): «Также люди берущий свою силу от животных то бишь агенты среди людей». Слово «агенты» — единственное в переписке обозначение рода занятий, но напрямую с организацией эти агенты не связаны: Слава перечисляет их в списке того, что хочет «закидать» во вселенную, а не как сотрудников организации. Как именно сила берётся от животного, не сказано.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Здесь дыра не содержательная, а учётная, и чинить надо её первой: сущности этой вселенной заведены дважды и связи ушли не туда. <code>ID-0039</code> («Агенты, берущие силу от животных») — три входящие ссылки, статьи нет, базы 1,9 КБ; и одновременно существует <code>GR-0055</code> с тем же названием, где статья на 9,4 КБ, но база 0 и ноль входящих ссылок. Ровно та же картина у расы-помощника: <code>ID-0040</code> — две ссылки, статьи нет, база 3,4 КБ, а <code>GR-0054</code> — статья 5,9 КБ, база 0, ссылок 0. Получается, что раздел «Состав» этой статьи честно пишет «статьи ещё нет» и уводит в исходник базы, хотя статья есть — под другим номером. Пока это не сшито, все входящие ссылки вселенной указывают на пустые записи, а наполненные стоят в стороне.</p></div>", "r": [["берущие силу от животных", "kb/ID-0039-agenty-beruschie-silu-ot-zhivotnyh.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0053-S03", "GR-0053--obschie-sposobnosti-gruppy"], "h": "<p>Способностей, которыми владели бы все участники организации, в переписке не названо. Перечислены сверхсилы, которые Слава хочет поместить во вселенную; принадлежат они организации, её противникам или всем подряд — не сказано.</p>\n<p><strong>Петля</strong> (<a href=\"SP-0051.html\">Петля</a>, 2024-04-02 06:58, id 151856–151860): «петлю ( то бишь перемотка времени на 10 секунд 10000 раз)». То есть перемотка времени на 10 секунд, до 10000 раз. Кто носитель петли и есть ли ограничения кроме числа повторов — не сказано. Позже петля названа второй раз, уже как одна из сверхсил scp-концепции (2024-04-02 19:46, id 152594), новых деталей при этом не добавлено.</p>\n<p><strong>Закон</strong> (<a href=\"PS-0031.html\">Закон</a>) в окне w0029 назван только по имени, без механики: «Также туда можно и закон закидать» (2024-04-02 06:58, id 151858) и затем в связке «сверхсила типо петли и закона» (2024-04-02 19:46, id 152594). Сама способность была разобрана раньше и в другой рамке — 2024-03-12, вселенная тогда не названа (id 138166–138220). Носитель произносит закон, и в радиусе 70 метров его обязаны выполнять: «в радиусе 70 метром может сказать любой законны и его обязательно выполнять ( то бишь не убивать , не прыгать и т.д) а если нет будет наказание ( не прыгать если прыгнешь твой весь увеличиться на 1 тонну плюс минус ; не убивать за хочешь убить и нападешь то не сможешь двигаться н количество времени ))». Уточнения того же дня: закон «что то запрещает только», а не приказывает; «Любой кто в радиусе 70 метров должен подчиняться закону»; носитель «сам должен следовать сказанному закону» (предложение Миколая, id 138204). Связь этой механики с организацией в переписке не проговорена — в окне w0029 закон упомянут как имя без раскрытия.</p>\n<p><strong>Эксперименты на людях</strong> и <strong>другая раса, которая помогает</strong> названы в scp-версии как содержание концепции (2024-04-02 19:46, id 152594). Кто ставит эксперименты и над кем, кому помогает другая раса, кроме местоимения «нам», — в переписке не сказано.</p>", "r": [["Закон", "PS-0031.html"], ["Петля", "SP-0051.html"]]}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0053-S04", "GR-0053--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p>Разница между сотрудниками задана только по расе и по тому, кто под рукой: на устранение вампира-нарушителя посылают «человека или вампира или оборотня ну кто есть». Отбор по способностям, специализации или пригодности к конкретной цели не описан — принцип подбора исполнителя в переписке сводится к наличию.</p>\n<p>Второе различие — происхождение сотрудника. Существа, которых организация ловит, и существа, которые на неё работают, — это одни и те же виды: «при этом эти существа могут работать в этой организации». Как существо переходит из ловимых в ловящие и переходит ли вообще, не сказано.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S05", "GR-0053-S05", "GR-0053--otnosheniya-s-drugimi-gruppami"], "h": "<p>Названа одна сторонняя сила: «И другую расу которая будет нам помогать» (2024-04-02 19:46, id 152594). Раса-помощник заведена в базе отдельной записью и связана с scp-концепцией; ни имени, ни свойств, ни характера помощи в переписке нет. Кому именно она помогает — организации, людям или авторам как рассказчикам («нам») — из формулировки не следует.</p>\n<p>Противостоящая сторона в первой версии — не группа, а отдельные нарушители: «обнаглевшие или совершившие преступления существа», пример — вампир, который «начал гасить людей , а не питаться мертвыми». Во второй версии противостоящая сторона — аномалии: «Вообще концепция охота на аномалий». Организованного противника, второй организации, в переписке нет.</p>\n<p>Слава предлагает Миколаю дополнять концепцию извне: «Концепцию та я придумал ну ты можешь туда что нибудь добавить типо объект или вид или способность или т.д» (2024-04-02 20:18, id 152603). Что Миколай добавил — в этом окне не сказано.</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S06", "GR-0053-S06", "GR-0053--kak-menyalas"], "h": "<p><strong>2024-04-01 (id 150629–150675) — первое объявление.</strong> Слава просит помочь построить новую вселенную взамен прошлой «про сверсилы», в новую хочет «затолкать зло против добра». Внутри этой рамки заявлена организация, которая ловит обнаглевших или совершивших преступления существ, и оговорено, что сами такие существа могут в ней работать. Существ Слава планирует «добавить ну много». Он сам отмечает, что объяснение получилось невнятным («Нихуя неясно да ?»), Миколай подтверждает и берёт время на подумать.</p>\n<p><strong>2024-04-01 09:43 (id 150659) — пример на вампирах и оборотнях.</strong> Механика показана на конкретном случае: вампир начал убивать живых вместо того, чтобы питаться мёртвыми, организация обязана его устранить и посылает того, кто есть, — человека, вампира или оборотня. Тут же оговорка, что это не желаемая вселенная, а «чисто принцип».</p>\n<p><strong>2024-04-02 06:58 (id 151856–151860) — список того, что закидать во вселенную.</strong> Одним сообщением названы три вещи: петля (перемотка времени на 10 секунд 10000 раз), люди, берущие силу от животных — «то бишь агенты среди людей», и закон. Ни одна из трёх не привязана к организации явно.</p>\n<p><strong>2024-04-02 19:46 (id 152590–152605) — отказ от добра/зла и переописание как scp.</strong> Рамка «добро и зло» отброшена формулировкой «сейчас думая мне как то не нравится». На её место ставится «концепция scp», в которую вбухиваются: сверхсилы типа петли и закона, эксперименты на людях, другая раса-помощник. Общая формула — «охота на аномалий». Миколай в ответ говорит, что не понял вопроса («концепцию ты придумал, в чем вопрос не пон»), сообщает, что находится в растерянности и что ему нужно «штурмануть на часика 3» мозг, и просит уточнить несколько моментов и обозначить срочность, «чтобы я ну как-то чувствовал рамочки». Слава уточняет причину, по которой хотел добавок: «Поротая низший владеет почти идентичными способностями Поротая высшего вот поэтому я думал может ещё че добавить», и передаёт концепцию Миколаю на дополнение.</p>\n<p>Дальше этого вечера организация не разрабатывалась. В базе у записи <a href=\"MR-0007.html\">Концепция scp / охота на аномалий</a> отмечено, что концепция снесена в тот же вечер.</p>", "r": [["Концепция scp / охота на аномалий", "MR-0007.html"]]}, {"t": "Пробелы", "a": ["S07", "GR-0053-S07", "GR-0053--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет: ни один сотрудник организации не назван.</li>\n<li>Собственного имени у организации нет, в базе она заведена по описанию.</li>\n<li>Название вселенной в чате так и не прозвучало — в записи <a href=\"MR-0006.html\">Организация по отлову существ-преступников</a> это отмечено отдельной неясностью.</li>\n<li>Иерархии, руководства, структуры подразделений в переписке нет: не сказано, кто отдаёт приказ на устранение и кто решает, что существо «обнаглело».</li>\n<li>Не описано, как существо-нарушитель попадает в организацию на работу и попадает ли.</li>\n<li>Не сказано, кто носитель петли и есть ли у неё ограничения кроме числа повторов.</li>\n<li>Механика закона внутри этой вселенной не описана: имя произнесено, раскрытия нет. Разбор способности «Закон» от 2024-03-12 (id 138166–138220) с организацией в переписке не связан. Слабости закона там же остались несогласованными: Миколай настаивал на условии слышимости и знания языка, Слава отклонил — «там без разницы услышал ты или нет пока не покинул радиус действия способности закон будет действовать»; 2024-03-12 15:44 (id 138218) Миколай отказался углублять разбор («я не буду погружаться и усложнять, все гениальное просто»).</li>\n<li>Про агентов, берущих силу от животных, не сказано, как именно сила берётся от животного, и не сказано, служат ли они в организации.</li>\n<li>Эксперименты на людях названы, но кто их ставит и над кем — не сказано.</li>\n<li>Раса-помощник названа, но не описана; кому она помогает, из слова «нам» не следует.</li>\n<li>Что такое аномалии в этой концепции и чем они отличаются от «обнаглевших существ» первой версии, осталось нерешённым.</li>\n<li>Отношений с другими группами в переписке нет; предложение Славы Миколаю добавить «объект или вид или способность» осталось без зафиксированного ответа в этом окне.</li>\n</ul></div>", "r": [["Организация по отлову существ-преступников", "MR-0006.html"]]}, {"t": "Связи — всё вместе", "a": ["GR-0053--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0031.html\">Закон</a></li>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0051.html\">Петля</a></li>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0006.html\">Организация по отлову существ-преступников</a>, <a href=\"MR-0007.html\">Концепция scp / охота на аномалий</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0007.html\">Новый мир</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0053--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0053.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0053-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0053/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Здесь дыра не содержательная, а учётная, и чинить надо её первой: сущности этой вселенной заведены дважды и связи ушли не туда. <code>ID-0039</code> («Агенты, берущие силу от животных») — три входящие ссылки, статьи нет, базы 1,9 КБ; и одновременно существует <code>GR-0055</code> с тем же названием, где статья на 9,4 КБ, но база 0 и ноль входящих ссылок. Ровно та же картина у расы-помощника: <code>ID-0040</code> — две ссылки, статьи нет, база 3,4 КБ, а <code>GR-0054</code> — статья 5,9 КБ, база 0, ссылок 0. Получается, что раздел «Состав» этой статьи честно пишет «статьи ещё нет» и уводит в исходник базы, хотя статья есть — под другим номером. Пока это не сшито, все входящие ссылки вселенной указывают на пустые записи, а наполненные стоят в стороне.</p>\n<p>Второе по цене — <code>ID-0050</code> (Провидец): три входящие ссылки, статьи нет, база 14,5 КБ. Это самый крупный необработанный кусок «игры бога», больше, чем <code>MR-0006</code> (7,1 КБ) и <code>MR-0007</code> (4,5 КБ) вместе. Рядом <code>ID-0041</code> (Турнир) — тоже три ссылки и тоже без статьи. К самой организации они прямо не привязаны, но пока их нет, вселенная вокруг организации остаётся списком заголовков.</p>\n<p>Третье: вампиры и оборотни, на которых объясняется весь принцип работы организации, в этой вселенной не заведены никак. <code>PS-0299</code> и <code>GR-0069</code> — «Оам», <code>GR-0044</code> — «монстры», <code>MR-0090</code> («Оборотни», статьи нет, база 1,7 КБ) числится как «неясно». Пример, через который вообще понятна механика, опереть не на что.</p>\n<h3>С чего начать</h3>\n<p>Первое — не архив, а сверка дублей внутри базы: <code>ID-0039</code> против <code>GR-0055</code>, <code>ID-0040</code> против <code>GR-0054</code>. Обе пары про одно и то же, разведены по видам сущности, и в каждой паре ссылки и текст лежат в разных половинах.</p>\n<p>Второе — <code>PS-0031</code> (Закон): 15,9 КБ базы, четыре ссылки, две вселенных. Механика закона, которой не хватает в разделе о способностях, там уже есть целиком — просто она из разбора 2024-03-12, а не из окна w0029. Вопрос не в поиске материала, а в решении, переносится ли разбор 12 марта в эту вселенную.</p>\n<p>В архив — за одним конкретным местом. 2024-04-02 в 20:18 Слава передаёт концепцию Миколаю: «ты можешь туда что нибудь добавить типо объект или вид или способность». Миколай в том же разговоре говорит, что ему надо «штурмануть на часика 3». Ответ, если он был, лежит либо поздно вечером 2 апреля, либо 3–4 апреля — это узкое окно, и именно там должно быть всё, чего в статье нет: имя организации, кто отдаёт приказ, что такое аномалии. И там же ищется название вселенной, которое в чате так и не прозвучало.</p>\n<h3>Как развивалось</h3>\n<p>2024-04-01 организацию заявили сразу с рамкой «зло против добра» и тут же объяснили на вампирах и оборотнях — с оговоркой, что пример не про эту вселенную, «здесь чисто принцип». Автор сам сказал, что вышло невнятно. 2024-04-02 утром вокруг неё положили три вещи (петля, агенты, закон) — ни одна к организации не привязана. Вечером того же дня рамку сняли целиком: «сейчас думая мне как то не нравится», и на её место поставили scp-концепцию с экспериментами и расой-помощником. Через полчаса концепцию передали второму автору на доработку, и в базе отмечено, что в тот же вечер она снесена. Возврата нет: между заявкой и сносом — примерно тридцать шесть часов, и внутри них рамка сменилась один раз, а исполнитель — один раз.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Про существ правило двойного статуса названо прямо и это главная находка первой версии: организация ловит вампиров и оборотней, и вампиры с оборотнями в ней же работают. Во второй версии предмет охоты сменился — «концепция охота на аномалий». Может ли аномалия работать в организации так же, как мог вампир, не сказано. Для существ правило есть, для аномалий, которые встали ровно на их место, такого же — нет.</p>\n<h3>Отклик</h3>\n<p>Зацепило ровно одно место, зато настоящее: вампир, который «начал гасить людей, а не питаться мертвыми». Организация реагирует не на убийство как таковое — у вампира есть своя норма, и нарушена именно она. Из одной фразы следует, что у каждого вида здесь свой допустимый способ существовать, и преступление считается от него, а не от человеческой морали. Это интереснее, чем обе рамки, которые вокруг него ставили, — и добро против зла, и scp; обе выглядят как готовые чужие формы, а вампир, который зарвался по меркам вампиров, — своё. Остальное, честно говоря, не зацепило: перечень того, что «закидать» во вселенную, и два переописания за сутки. Отдельно отмечу другое — не мир, а работу: «Нихуя неясно да ?» и просьба обозначить срочность, «чтобы я ну как-то чувствовал рамочки». Двое разбираются не с вселенной, а с тем, как они друг другу передают задачи, и это в записи видно честнее, чем сама концепция.</p></div>", "r": []}];</script>
