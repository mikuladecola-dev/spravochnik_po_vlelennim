<script>const BASE="";const DOCNAME="Зависть (грех)";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0161-S01", "SP-0161--mehanika"], "h": "<p>Зависть — один из грехов в наборе «Семь грехов (магия по грехам)». Разбиралась 2024-12-24 — 2024-12-25 (id 273904–274472) в двух вариантах.</p>\n<p><strong>Вариант Миколая (2024-12-24, id 273906).</strong> Зависть идёт шестым пунктом в общем списке грехов и состоит из трёх строк:</p>\n<ul>\n<li>«способность заставить, забыть человека и всех кто его знает его родословную навязав желаемый статус» — стирается не память самого объекта, а родословная: её забывает и сам человек, и все, кто его знает; на освободившееся место ставится статус, который нужен носителю зависти;</li>\n<li>«объект зависти забывает желания»;</li>\n<li>«магия льда развита».</li>\n</ul>\n<p><strong>Вариант Славы (2024-12-24, id 273920).</strong> «Полной перевоплощение тому кого завидуешь, под полный подразумевается полной копирование сил, магии, одежды, внешность но не характера». То есть копируется всё внешнее и всё боевое — силы, магия, одежда, внешность, — а характер не копируется и остаётся своим.</p>\n<p>Общий принцип, названный Миколаем в ходе разбора грехов (2024-12-24, id 273917): «но в грехах это базовое подразумевается, такова природа греха». К чему относится «это», в приведённом куске не сказано.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0161-S02", "SP-0161--ogranicheniya-i-cena"], "h": "<p>В варианте Славы ограничение названо прямо: перевоплощение полное, но характер в него не входит — «полной копирование сил, магии, одежды, внешность но не характера».</p>\n<p>В варианте Миколая ограничений не выписано. Отдельного проклятья для зависти нет — в отличие от алчности («ты не можешь ничего отдать кому либо») и гнева («теряешь способность видеть человеком того кто поступил не справедливо»).</p>\n<p>Цена, откат, длительность и расход не названы ни в одном из вариантов.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0161-S03", "SP-0161--nositeli"], "h": "<p>Носитель зависти в переписке не назван. Грехи обсуждались как система способностей без привязки к персонажам. В обоих вариантах предполагается второй участник — «объект зависти» у Миколая, «тот кому завидуешь» у Славы, — но конкретных лиц не названо.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0161-S04", "SP-0161--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-12-24 (id 273904–273908), окно w0068.</strong> Миколай пишет грехи подряд («продолжаю грехи писатт») и в сообщении 273906 даёт зависть как стирание родословной у объекта и у всех, кто его знает, с навязыванием желаемого статуса, забывание желаний объектом и развитую магию льда. Завершает вопросом «как тебе».</p>\n<p><strong>Версия 2 — 2024-12-24 (id 273917–273921), окно w0068.</strong> Слава отвечает своим разбором по всем грехам и по зависти даёт другое: полное перевоплощение в того, кому завидуешь, с копированием сил, магии, одежды и внешности, но не характера. Дальше пауза 1.5 часа.</p>\n<p><strong>Версия 3 — 2024-12-25 (id 274467–274472), окно w0068.</strong> Миколай оценивает варианты Славы. После реплики Славы про сходство телекинеза и ветра («Ну не прям копия но есть похожие черты») идёт: «дадада», «это лучше», «моя версия мне не нравится», «вот это подходит», «тоже хороший вариант». К каким именно грехам относится каждая из этих реплик, поштучно не расписано; зафиксировано, что вариант Славы Миколай ставит выше своего, а свою версию отвергает.</p>\n<p>Прямого утверждения, что окончательным принят вариант Славы, в переписке нет — это отмечено и в исходной карточке как неясность.</p>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S05", "SP-0161-S05", "SP-0161--otklonennye-varianty"], "h": "<p>Версия Миколая (стирание родословной, навязанный статус, забывание желаний, магия льда) забракована самим автором 2024-12-25 (id 274470): «моя версия мне не нравится». Формально из набора грехов она не вычеркнута — сказано только, что она не нравится и что вариант Славы лучше.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S06", "SP-0161-S06", "SP-0161--svyaz-s-drugimi-sposobnostyami"], "h": "<ul>\n<li>Часть набора «Семь грехов (магия по грехам)» — наравне с похотью, чревоугодием, алчностью, ленью <a href=\"SP-0160.html\">Лень (грех)</a>, гневом и гордыней.</li>\n<li>В варианте Миколая к зависти привязана стихия — «магия льда развита». Стихии привязаны и к соседям: у гнева «магия взрыва развита», у гордыни «магия света и огня развита хорошо». В варианте Славы стихии у зависти нет.</li>\n<li>Вариант Славы, копирующий «силы, магию» объекта, по механике пересекается с чревоугодием в варианте Миколая — «поглощение чужих навыков, но не себе. он их поглощает и они исчезают» — и с алчностью в варианте Славы («способность поглощений чужой манный или объектов»), но связи между ними авторы не проговаривали.</li>\n<li>Стирание памяти о родословной у всех окружающих в варианте Миколая соседствует с гордыней как «магия привлечения внимания»; связь не названа.</li>\n</ul>", "r": [["Лень (грех)", "SP-0160.html"]]}, {"t": "Пробелы", "a": ["S07", "SP-0161-S07", "SP-0161--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Какой из двух вариантов окончательный, прямо не сказано, хотя Миколай свою версию отверг.</li>\n<li>В варианте Миколая не сказано, чью родословную стирают — только объекта зависти или любого человека, — и кто задаёт «желаемый статус»: носитель или объект.</li>\n<li>Не сказано, обратимо ли стирание родословной и забывание желаний, и сколько это держится.</li>\n<li>В варианте Славы не названы ни длительность перевоплощения, ни условия входа в него (нужно ли видеть объект, знать его, находиться рядом), ни что происходит, если объект умирает.</li>\n<li>Не оговорено, копируются ли вместе с магией её ограничения и запас, и остаётся ли у носителя своя магия во время перевоплощения.</li>\n<li>Проклятья для зависти не выписано.</li>\n<li>Носитель не назван, вселенная в карточке помечена как неясная.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0161--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0160.html\">Лень (грех)</a></li>\n<li><strong>Упомянут в способностях:</strong> <a href=\"SP-0138.html\">Мана</a>, <a href=\"SP-0160.html\">Лень (грех)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0161--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-12-24</td>\n<td>273904–273908</td>\n<td>w0068</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-24</td>\n<td>273917–273921</td>\n<td>w0068</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-25</td>\n<td>274467–274472</td>\n<td>w0068</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0161-zavist-greh.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0161--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0161.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
