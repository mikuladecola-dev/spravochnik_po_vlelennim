<script>const BASE="";const DOCNAME="Жених";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0352-S01", "PS-0352--proishozhdenie"], "h": "<p>Персонаж появляется внутри текста «Любимый город», присланного Славой в окне w0117 (2026-02-14, id 432538–432540). Отдельно от текста его не обсуждали и не придумывали — он возникает сразу как один из персонажей сцены на крыше.</p>\n<p>Прозвище дал рассказчик (<a href=\"PS-0351.html\">Рассказчик «Любимого города»</a>), увидев его на лестнице: «Я сразу понял, что это за мужчина. Жених. Ну мужчина с обручальным кольцом.» Другого имени у него нет.</p>\n<p>В сцене пробуждения он один из шестерых человек, лежащих без сознания на подстриженной лужайке на крыше пятиэтажки, рядом с рассказчиком, который очнулся первым. Состав лежащих перечислен так: «старики и дети, женщины и мужчины. Мужчина средних лет с обручальным кольцом на пальце, пацан лет десяти, ну и подросток. Также молодая женщина в отключки, старичок, да и девчуля подросток.» Как эти шестеро туда попали, в переписке не сказано.</p>", "r": [["Рассказчик «Любимого города»", "PS-0351.html"]]}, {"t": "Внешность", "a": ["S02", "PS-0352-S02", "PS-0352--vneshnost"], "h": "<p>Мужчина средних лет. На пальце обручальное кольцо — деталь, по которой рассказчик его и опознаёт и от которой идёт прозвище. На лестнице описан как «силуэт мужчины в чёрной кофте, что быстро спускался по лестнице».</p>\n<p>Отдельно отмечено выражение лица: рассказчик, лежащий у стены после падения, разглядел, что «лицо его выглядили уж слишком собраным и полным надежд». Про рост, телосложение, возраст точнее «средних лет» — ничего.</p>\n<p>Вместе с остальными спящими он входит в общее описание группы: «Всё такие ухоженные и единственный я белая ворона» — то есть по виду он ухоженный человек, в отличие от рассказчика.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0352-S03", "PS-0352--harakter"], "h": "<p>Прямых характеристик нет — есть только поведение и догадка рассказчика о нём.</p>\n<p>Очнулся вторым, после рассказчика. Не остался на крыше и не стал будить остальных: захлопнул за собой дверь («Бам», «Звук захлопнувшейся двери разнёсся сверху») и побежал вниз по лестнице быстрым шагом — «Топ-топ», «чей-то топот лишь приближался».</p>\n<p>На лестнице он натыкается на упавшего рассказчика: «Он увидев меня и на мгновение остановился тяжело дыша, но быстро потеряв ко мне интерес побежал дальше вниз.» То есть остановка на мгновение и немедленное продолжение бега, без помощи, вопросов и разговора.</p>\n<p>Вывод, который делает из этого рассказчик, приведён его словами: «И куда он так целеустремленно несётся» — «появление это мысли обозначало бы, что Жених что-то знает. Ну или он психанул, когда очнулся на крыше и просто начал бежать. Вот только лицо его выглядили уж слишком собраным и полным надежд.» Сам рассказчик тут же оговаривается: «Вау как я умело могу читать людей. Надеюсь.» — то есть даже внутри текста эта оценка подана как ненадёжная.</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0352-S04", "PS-0352--svyazi-s-drugimi"], "h": "<p><strong>Рассказчик «Любимого города» (<a href=\"PS-0351.html\">Рассказчик «Любимого города»</a>)</strong> — единственный персонаж, с которым у Жениха есть сцена. Контакт односторонний: Жених его видит, останавливается на мгновение и уходит; рассказчик к нему не обращается и не окликает. Разговора между ними нет.</p>\n<p><strong>Остальные пятеро спящих</strong> — пацан лет десяти, подросток, молодая женщина, старичок, девчуля-подросток. Жених лежал вместе с ними на крыше и ушёл, оставив их спящими. Как они между собой связаны и связаны ли вообще, в переписке не сказано.</p>\n<p><strong>«Любимый город»</strong> — текст и место, к которому персонаж относится; в карточке он отмечен как часть «Любимого города».</p>\n<p>Обручальное кольцо предполагает наличие супруга или супруги, но в переписке об этом ничего нет: жена (или муж) не упоминается, среди спящих на крыше её никак не выделяют, и связь между кольцом и кем-либо из присутствующих не проведена.</p>", "r": [["Рассказчик «Любимого города»", "PS-0351.html"]]}, {"t": "Способности", "a": ["S05", "PS-0352-S05", "PS-0352--sposobnosti"], "h": "<p>Ничего сверхъестественного за ним не показано и не обсуждалось.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0352-S06", "PS-0352--kak-menyalsya"], "h": "<p><strong>2026-02-14, id 432538–432540, окно w0117.</strong> Персонаж введён целиком внутри текста Славы, в двух эпизодах: сначала как один из шестерых спящих на крыше (описан через обручальное кольцо), затем как бегущий мимо мужчина в чёрной кофте, которому рассказчик даёт прозвище Жених. На этом его участие в тексте заканчивается — дальше рассказчик выходит на улицу, идёт в «магазин 24» и Жених больше не появляется.</p>\n<p><strong>2026-02-16, id 433167–433168, окно w0117.</strong> Миколай возвращается к сцене на лестнице и предлагает объяснение того, почему Жених «быстро потеряв ко мне интерес побежал дальше вниз». Названы два варианта, дословно: «либо он подумал что мальчик не человек / либо он подумал что он не пьяный». Это единственное обсуждение персонажа вне текста. Какой из двух вариантов принят, не сказано; оба остались рядом. Реакции Славы на эту реплику в переписке нет.</p>\n<p>Версия от 2026-02-16 ничего не отменяет в версии от 2026-02-14 — она добавляет мотивировку к уже написанной сцене.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0352-S07", "PS-0352--chto-s-nim-stalo"], "h": "<p>Убежал вниз по лестнице и вышел (или не вышел — этого рассказчик не видел) из здания раньше рассказчика. Когда рассказчик через некоторое время сам добирается до выхода, на улице никого нет: «Никого не было. Ни взглядов отвращения из-за грязных штанов. Ни гула машин.» Куда делся Жених — не показано.</p>\n<p>Дальше в тексте он не появляется. Дошёл ли он куда-то, куда бежал, в переписке не сказано.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0352-S08", "PS-0352--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имя не названо, есть только прозвище, данное рассказчиком.</li>\n<li>Откуда он и как попал на крышу — не сказано (как и про остальных пятерых).</li>\n<li>Знал ли он что-то на самом деле — осталось нерешённым. В тексте это догадка рассказчика, в переписке от 2026-02-16 — две несведённые версии Миколая.</li>\n<li>Куда именно он бежал, была ли у него цель — не сказано.</li>\n<li>Супруг или супруга, к которым отсылает обручальное кольцо, не упоминаются вообще.</li>\n<li>Что он делал между пробуждением на крыше и появлением на лестнице — не показано; известен только звук захлопнувшейся двери.</li>\n<li>Дальнейшая судьба не описана: после сцены на лестнице он из текста исчезает.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0352--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0087.html\">Группа на крыше (шесть спящих и рассказчик)</a></li>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0351.html\">Рассказчик «Любимого города»</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0351.html\">Рассказчик «Любимого города»</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0087.html\">Группа на крыше (шесть спящих и рассказчик)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0005.html\">Иссекай</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0352--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-02-14</td>\n<td>432538–432540</td>\n<td>w0117</td>\n<td>Иссекай (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-02-16</td>\n<td>433167–433169</td>\n<td>w0117</td>\n<td>Иссекай (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0352-zhenih.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0352--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0352.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
