<script>const BASE="";const DOCNAME="Михаил";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0234-S01", "PS-0234--proishozhdenie"], "h": "<p>Персонаж «новой истории» Славы. Впервые назван в переписке 2025-03-21 (окно w0084, id 306748–306765) — там же, где Слава объявляет, что «новая история не связана с моей вселенной» (306750). На эту дату персонаж проходит как «вне вселенной»; вторая версия (2025-05-02) уже относится к вселенной Нимб. В карточке персонажа обе вселенные проставлены разом: «Нимб, вне вселенной».</p>\n<p>Всё, что о нём сказано при первом упоминании, — одна реплика Славы:</p>\n<div class=\"q\"><p>«Там просто есть Михаил но это не тот Михаил который &quot;медведь» (306760, 2025-03-21).</p></div>\n<p>То есть персонаж вводится через разграничение с уже существующим Михаилом «медведем» — как другой, отдельный человек с тем же именем. Больше в окне w0084 о нём ничего не говорится.</p>\n<p>Варианты имени, встречающиеся в тексте: Михаил, Миша, Мишка.</p>\n<p>В основном тексте (2025-05-02, id 323365–323370) Михаил — член бригады лесорубов, работающей на выезде в лесу, вдали от населённых пунктов (бригадир: «Удачей будет если в радиусе 100км есть населённый пункты»). Рассказ ведётся от первого лица другим лесорубом бригады, поэтому всё о Михаиле дано через его взгляд. Бригада — люди, работавшие в шахтах («Сколько обвалом было на наших шахтах»), с законным охотничьим оружием: «Оружия у нас законно… Два оружия для охоты».</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0234-S02", "PS-0234--vneshnost"], "h": "<p>Прямого портрета нет. Указаны:</p>\n<ul>\n<li>«Был парням крепким и самым крупным в бригаде» (323365).</li>\n<li>Из-за размера он не пролез в лаз пещеры без последствий: «Поэтому это дырочка была ему мала. Но он уперто лезь. И его кофта по пути к нам за что-то зацепилась и порвалась» (323365). Кофту после этого он осмотрел и понял, «что это уже на помойку».</li>\n</ul>\n<p>Отдельно в тексте обыгрывается созвучие его имени с «мишкой»-медведем. Рассказчик перед этим боится, что в пещере может спать медведь («Может там мишка спит, а мы ему на обед идем»), а услышав звук рвущейся одежды, думает: «А вот и наш Мишка. Усмехнулся я в мыслях. Мишка то есть Михаил» (323365). Та же двусмысленность возвращается, когда бригадир видит бегущую бригаду: «Подумал тогда что мишка за нами бежит. Настоящий мишка то есть» (323366).</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0234-S03", "PS-0234--harakter"], "h": "<p>Основная характеристика дана рассказчиком сразу после эпизода с порванной кофтой:</p>\n<div class=\"q\"><p>«И нет он не начал гнать на Игорь. Миша вообще был парням винящий в первую очередь себя. Это вроде бы хорошо, но в некоторых ситуациях не является хорошей стороной. Ну мы конечно этим не пользовались Мишу-то всё уважали за его характер и доброту» (323365).</p></div>\n<p>То есть: винит в первую очередь себя; в бригаде его за характер и доброту уважают и этой чертой не пользуются; сам рассказчик тут же оговаривает, что черта не во всех ситуациях хорошая.</p>\n<p>Рассказчик отдельно отмечает, что с Михаилом ему спокойнее: «Хотя я всё же хотел пойти с Мишой с ним как-то надёжнее» (323368).</p>\n<p>Во время боя рассказчик пересматривает своё же прежнее суждение о нём:</p>\n<div class=\"q\"><p>«Мишка всё же оклеветал я тебя за зря. Зря говорил что он не способен дать сдачи. Вот дает. Смелее чем кто либо в бригаде. Хладнокровен чем кто либо в бригаде» (323369).</p></div>\n<p>Дословной реплики «не способен дать сдачи» в более раннем тексте нет — рассказчик ссылается на свои слова, которые в переписке не приведены.</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0234-S04", "PS-0234--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Бригада лесорубов</strong> — Михаил её часть, самый крупный в ней.</li>\n<li><strong>Бригадир</strong> — примерно 50-летний мужик («словно не 50 летний мужик, а малец какой»), распределяет дежурства и оружие; о Михаиле говорит: «Да и Игорь с Михаилом врачи проверят, и если хоть что-то там выяснит тоже живо поедут в больницу» (323367).</li>\n<li><strong>Игорь</strong> — тот, кто первым полез в пещеру и из-за кого лаз оказался пройден; на него Михаил не стал «гнать» из-за порванной кофты. Позже Игорь и Михаил вместе отказываются дежурить поодиночке и ставятся в одну пару.</li>\n<li><strong>Тоха, «ну для вас Григорий»</strong> — навигатор бригады с географической памятью; погибает от твари. Прямого взаимодействия с Михаилом в тексте не описано.</li>\n<li><strong>Рассказчик</strong> (лесоруб, от чьего лица идёт текст) — считает Михаила надёжным, при нём пересматривает своё мнение о нём.</li>\n<li><strong>Михаил «медведь»</strong> — другой персонаж, от которого этот Михаил специально отделён репликой 306760.</li>\n<li><strong>Иван Васильевич</strong> — числится в связях карточки, но в приведённых кусках переписки не назван; кто он Михаилу, в переписке не сказано.</li>\n</ul>", "r": []}, {"t": "Что с ним стало", "a": ["S05", "PS-0234-S05", "PS-0234--chto-s-nim-stalo"], "h": "<p><strong>Пещера и бегство.</strong> Михаил лезет в пещеру не первым (первым — Игорь), в лазе рвёт кофту. При бегстве из пещеры вся бригада вылетает через тот же лаз и катится кубарем по крутому склону. Михаил из этого выходит целым — по счёту рассказчика перед бригадиром: «Для Мишка то подобная неверная как массаж вот и целый» (323367). Из бригады после спуска «относительно целых осталось 4 человека» по счёту бригадира (рассказчика он в это число не включает из-за раны в плече от ветки).</p>\n<p><strong>Дежурство.</strong> Бригадир хотел ставить дежурных по одному, «но получив категорический отказ от Игоря и Мишы. Решил пойти на компромисс и выставил двух дежурных» (323368). Пары: рассказчик и Тоха; Игорь и Михаил. Двустволок две — по одной на группу; пока одна группа дежурит, вторая охраняет раненых, смена каждый час.</p>\n<p><strong>Бой с тварью.</strong> Когда тварь врезается в спину Тохи в лагере и бросается к толпе, Михаил единственный не разбегается:</p>\n<div class=\"q\"><p>«Только Мишка встал и прицеливался в эту тварь… прицелился и из двух выстрелил. И по всему лесу раздался хлопок от выстрела… А Миша попал, ровно в бок твари. Та аш отлетела. Но не сдохла. Да и крови не пошла. Что-то только черная, как смола течь начала» (323369).</p></div>\n<p>После выстрела «Мишато сразу выкинул двустволку из-за её бесполезности. И полез на дерева». Он успевает залезть на высоту, где тварь его не достаёт, но тварь начинает рубить дерево лбом-лезвием: «Тварь это своим лбом буквально рубит деревья, как почти что мы. Только сильнее быстрее и вертикально».</p>\n<p>Позже, когда бригадир отвлекает тварь на себя, «Мишка с тем кем ещё ногу повредил спрыгнул с деревьев. И оружия хватать начали. Быстро заряжая его… Прогремела два выстрела. И оба попали. Тварь то получив с двух двухстволок отлетала аж до другого дерева. Но всё ещё была жива» (323370). Добивают тварь уже всей бригадой палками, после того как Игорь спрыгивает на неё и подламывает ей колени.</p>\n<p><strong>После.</strong> Со стороны горы раздаётся рёв десятков, «если не сотни тварей», бригада уезжает на машинах — «и на удивление быстро смогли уехать без потерей». Дальше: звонок в полицию, приезд не полиции, а фармацевтической компании, снятие показаний, подписки о неразглашении с выплатами «как мои 6 зарплат», оплаченные похороны Тохи и медицинские расходы. Отдельная судьба Михаила после отъезда в переписке не описана — сказано только, что врачи должны были проверить его и Игоря.</p>", "r": []}, {"t": "Как менялся", "a": ["S06", "PS-0234-S06", "PS-0234--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2025-03-21</strong> (окно w0084, id 306748–306765, вселенная на дату объявления — «вне вселенной»). Персонаж только назван. Единственная информация: он есть в новой истории, и это не Михаил «медведь». Ни внешности, ни характера, ни роли.</p>\n<p><strong>Версия 2 — 2025-05-02</strong> (окно w0089, id 323365–323370, вселенная на дату объявления — Нимб). Михаил появляется в сплошном тексте истории как член бригады лесорубов. В этой версии закреплены: самый крупный в бригаде, крепкий; винит в первую очередь себя; уважаем за характер и доброту; в бою — самый хладнокровный и смелый, первым стреляет в тварь из двустволки. Первое суждение рассказчика о нём (кроткий, себя винящий, «не способен дать сдачи») внутри той же версии переоценивается по ходу боя. Первая версия при этом не отменяется: разграничение с Михаилом «медведем» остаётся в силе, история по-прежнему заявлена как «новая история» Славы.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0234-S07", "PS-0234--probely"], "h": "<div class=\"gaps\"><ul>\n<li>В окне w0084 (2025-03-21) кроме имени и разграничения с «медведем» о персонаже не сказано ничего.</li>\n<li>Возраст, фамилия, семья, биография до бригады — в переписке не сказано.</li>\n<li>Особых способностей за Михаилом не названо. «Удивительные особенности» в тексте приписаны только Тохе — географическая память.</li>\n<li>Иван Васильевич числится в связях, но в приведённых кусках переписки не появляется; связь с Михаилом не названа.</li>\n<li>Имя бригадира в тексте не названо; совпадает ли он с Иваном Васильевичем, в переписке не сказано.</li>\n<li>Что с Михаилом стало после отъезда бригады и осмотра врачами — осталось нерешённым.</li>\n<li>Почему двух Михаилов (этого и «медведя») понадобилось разводить и есть ли между ними какая-то связь помимо имени — в переписке не сказано.</li>\n<li>Принадлежность истории к вселенной противоречива по датам: 2025-03-21 Слава говорит, что история «не связана с моей вселенной», версия 2025-05-02 отнесена к Нимбу; момент и причина перехода в переписке не зафиксированы.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0234--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0073.html\">Бригада лесорубов</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0073.html\">Бригада лесорубов</a>, <a href=\"GR-0077.html\">Компания Игоря (школьная группа с завода имени Попова)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0234--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-03-21</td>\n<td>306748–306765</td>\n<td>w0084</td>\n<td>вне вселенной (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-05-02</td>\n<td>323365–323370</td>\n<td>w0089</td>\n<td>Нимб (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0234-mihail.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0234--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0234.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
