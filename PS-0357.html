<script>const BASE="";const DOCNAME="Таинственный торговец";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0357-S01", "PS-0357--proishozhdenie"], "h": "<p>Таинственный торговец назван одной репликой внутри разговора о системе прокачки в бесконечном данже (2026-04-11, id 457554). Кто он и откуда он в данже — не обсуждалось.</p>", "r": []}, {"t": "Способности", "a": ["S02", "PS-0357-S02", "PS-0357--sposobnosti"], "h": "<p>Единственная зафиксированная функция — продажа навыков. За прохождение уровня исследователь получает «ОЭм» и может купить навыки: «Вообще типо за прохождения уровня получаешь допустим ОЭм и можешь купить навыки / Пассивный который всегда усиливают / И активный типо огненный шар» (id 457551). На вопрос, где это происходит, ответ: «Купить у таинственного торговца» (id 457554). Расшифровка «ОЭм» в переписке не дана.</p>", "r": []}, {"t": "Связи с другими", "a": ["S03", "PS-0357-S03", "PS-0357--svyazi-s-drugimi"], "h": "<ul>\n<li>Система прокачки в бесконечном данже — торговец является точкой, в которой полученная за уровни валюта обменивается на навыки, пассивные и активные.</li>\n<li>Рогалик и бесконечный данж — торговец находится внутри данжа. Двумя ответами «Нет» и «Нет» (id 457555–457556) отклонены оба предположения Миколая: что герой «может в обычный мир попасть» (id 457552) и что «город есть внутри данжа» (id 457553). То есть покупка навыков не привязана ни к выходу в обычный мир, ни к городу.</li>\n</ul>", "r": []}, {"t": "Как менялся", "a": ["S04", "PS-0357-S04", "PS-0357--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2026-04-11 (id 457551–457556).</strong> Единственное состояние: продавец навыков в данже. Изменений задумки после этого в переписке нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "PS-0357-S05", "PS-0357--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Внешность не описана.</li>\n<li>Характер, речь, поведение не обсуждались.</li>\n<li>Кто он и откуда в данже — не обсуждалось.</li>\n<li>Где именно с ним встречаются, появляется ли он сам или его находят — в переписке не сказано.</li>\n<li>Что такое «ОЭм» и как считается — не расшифровано.</li>\n<li>Полный набор продаваемых навыков не назван; из примеров даны только «пассивный который всегда усиливают» и «активный типо огненный шар».</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0357--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0005.html\">Иссекай</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0357--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-04-11</td>\n<td>457551–457556</td>\n<td>w0119</td>\n<td>Иссекай (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0357-tainstvennyy-torgovec.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0357--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0357.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
