<script>const BASE="";const DOCNAME="Охота апостолов";
const LEAD="";
const CH=[{"t": "Содержание", "a": ["S01", "IS-0069-S01", "IS-0069--soderzhanie"], "h": "<p>Событие-предыстория мира вселенной «Апостол»: апостолы устроили открытую охоту на одну религиозную организацию по всему миру. Второе название истории в переписке — «охота на религиозную организацию» (2025-09-12, окно w0104).</p>\n<p><strong>Обстановка до охоты (версия 1, 2025-09-12, id 364768–364782).</strong> Слава начинает с фона: «есть множество организации занимающие убийством одержимых и получающие деньги от правительство и благотворительности. Хотя некоторые организации нанимают чтобы убить человека либо другого благословенного». Всё это «держалось в секрете от людей».</p>\n<p><strong>Сама охота.</strong> «Держалось. Но когда апостолы устроили охоту на одну религиозную организацию по всему миру. И делали они это особо не скрываясь. Да какой там скрываться». Способ действий описан так: «Они могли в центре города разнести церковь или многоэтажку которая принадлежал той организации», «Апостола ещё могли публично устроить казнь десятков а то и сотни людей ( работников этой организации)».</p>\n<p>Масштаб последствий связан с размером жертвы: «а так как организации было одной из самых крупных организации связанный с благословенными. То апостол знатно пошумели на весь мир. Раскрыв существование тёмной изнанки». Сразу за этим — «Конечно началась паника, массовая истерия, гражданский войны и множеств других пагубных вещей».</p>\n<p><strong>Итог.</strong> «Ну по итогу всё устаканилось и всё продолжили жить как жили. Изменилось только три вещи».</p>\n<p>Первая: «был подписан публичный договор обозначающий права и обязанности благословенных. А также их не я, не участия в военных конфликтах» (фраза в переписке оборвана и не переформулирована).</p>\n<p>Вторая: «большинство организации раскрылись то бишь о них уже знает мир и могут их даже нанимать для убийства одержимого ( ну это бесплатно. Не благословенный получают деньги за убийство одержимого. Просто именно для родственников одержимого это бесплатно), а вот платно это изгнания демона». Отдельной строкой: «Да и схватки одержимых и благословенных стали уже обыкновенными».</p>\n<p>Третья: «теперь в данный организации можно в ступить».</p>\n<p><strong>Причина охоты (версия 2, 2025-09-12, id 364808–364815).</strong> Мотив назван только во второй версии и вписан в описание апостолов этой вселенной. «Здесь апостолы дорожат друг другом больше всех. Как раз таки из-за того что та организации убила семью одного из апостолов и разгромила детский приют другого апостола. Всё остальные апостолы начали их истреблять. Даже тех кто просто приходил помолиться в церковь этой организации».</p>\n<p>В том же сообщении описаны сами апостолы этой вселенной: «группа лиц из 21 человека телепатически связанный друг с другом. Но это не люди, это насекомые», «Всё двадцать один апостол вылезли из разных коконов. И по своё природе не являются людьми. Хоть и очень на них похоже». Про возраст: «у них замедленная старения ( точнее они словно замерзают в каком-то возрасте( в рандомные возраст )». Про силы: «И они как арбетары. Если сжечь лес он будет гореть не переставая. То есть их ний силы постоянные ( конечно с некоторыми условностями) но они могут сами вырубить огонь». Про способности: «теперь у них не по одной способности. Так как они по сути могут сами придумать новую способность. Но всё же они стараються делать упор в определённый способности. Ну не считая Имита».</p>\n<p>Версия 2 не отменяет версию 1: события и три последствия остаются, к ним добавляется причина.</p>", "r": []}, {"t": "Персонажи", "a": ["S02", "IS-0069-S02", "IS-0069--personazhi"], "h": "<ul>\n<li><strong>Апостолы</strong> — исполнители охоты, группа из 21 существа. История помечена как часть материала об апостолах.</li>\n<li><strong>Имит</strong> — назван как исключение среди апостолов: остальные «стараються делать упор в определённый способности. Ну не считая Имита». Больше в этой истории о нём ничего не сказано.</li>\n<li><strong>Апостол, у которого убили семью</strong>, и <strong>апостол, чей детский приют разгромили</strong> — по именам не названы.</li>\n<li><strong>Религиозная организация</strong> — жертва охоты, «одна из самых крупных организации связанный с благословенными». Название не дано.</li>\n<li><strong>Творцы</strong> — вопрос об их участии поднят и оставлен открытым: «Не знаю добавлять сюда творцов».</li>\n</ul>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "IS-0069-S03", "IS-0069--mesto-vo-vselennoy"], "h": "<p>История служит предысторией мира: она объясняет, почему мир знает о благословенных, одержимых и организациях. До охоты существование изнанки было секретом, после — публичным фактом.</p>\n<p>Связана с: Апостолы, Публичный договор о благословенных, Чёрная изнанка.</p>\n<p>Вселенная в переписке прямо не объявлялась — привязка к «Апостолу» сделана при разборе пометки «неясно».</p>", "r": []}, {"t": "Состояние", "a": ["S04", "IS-0069-S04", "IS-0069--sostoyanie"], "h": "<p>Обе версии записаны в один день, 2025-09-12, в одном окне w0104, с разницей примерно в сорок минут. Дальше история не продолжалась. Реплики Миколая в первой версии к разбору не относятся: он сообщает, что хочет спать и после пар поедет, — то есть на изложение Славы ответа в переписке нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "IS-0069-S05", "IS-0069--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Название религиозной организации не дано.</li>\n<li>Не сказано, кто из апостолов потерял семью и чей был детский приют.</li>\n<li>Сроки охоты не названы: ни сколько она длилась, ни в каком году мира происходила.</li>\n<li>Формулировка первого последствия оборвана: «А также их не я, не участия в военных конфликтах» — что именно запрещено договором, из текста не восстанавливается, уточнений в переписке нет.</li>\n<li>Схема оплаты изложена с оговорками внутри одного предложения (убийство одержимого «бесплатно» для родственников, изгнание демона — платно), но кто платит в остальных случаях и как организации при этом получают «деньги от правительство и благотворительности» — не разъяснено.</li>\n<li>Вопрос о творцах остался нерешённым.</li>\n<li>В навигации сущность связана с «Чёрной изнанкой», а в самом тексте сказано «тёмной изнанки»; соотношение этих двух названий в переписке не оговорено.</li>\n<li>Судьба организации после охоты — уничтожена ли она полностью — не сказана.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["IS-0069--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-09-12</td>\n<td>364768–364782</td>\n<td>w0104</td>\n<td>Апостол (разбор «неясно»)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-09-12</td>\n<td>364808–364815</td>\n<td>w0104</td>\n<td>Апостол (разбор «неясно»)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/istorii/IS-0069-ohota-apostolov.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["IS-0069--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/IS-0069.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
