<script>const BASE="";const DOCNAME="Мэри";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0102-S01", "PS-0102--proishozhdenie"], "h": "<p>Персонаж стороннего автора — Ани Мареевой. В переписку попал 2024-06-30 (id 191747–191772, окно w0040) как пересланное Миколаем описание. Миколай отмечает, что Аня «прописывать персонажей» умеет: «Ну без способностей, но подробненько». Мэри названа последней в её списке: «Последний перс».</p>\n<p>Первую попытку скинуть описание Миколай не довёл: «Или блять не скину», «Я хз где оно затерялось». Затем прислал пересланный текст (в переписке помечен значком 🍒 — маркер источника пересылки).</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0102-S02", "PS-0102--vneshnost"], "h": "<p>«она довольно высокая, но недостаточно из-за чего над нею прикалываются, что она не учитель, а ученица какого-нибудь класса».</p>\n<p>Про рисовку Ани Мареевой Слава говорит отдельно: «Ну мне рисовка нравится / Типо мой перс однотипный и внешкой и всем / А здесь внешка шикордос». Миколай объясняет: «Она очень давно рисует». Слава добавляет: «Типо исключительная черта есть у персов». Сам рисунок Мэри в переписке не показан — речь идёт о персонажах Ани в целом.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0102-S03", "PS-0102--harakter"], "h": "<p>Дословно из пересланного описания:</p>\n<p>«Мэри преподаёт уроки английского и геометрии, она очень серьёзна к своей работе, но что касается её юмора, то это пиздец. она настолько привыкла к играм от Хуко, что сама начала стебаться над учителями с кожурой от банана. да и кроме этого, ей ужасно нравится смотреть на то, как жертвы пытаются встать из-за давления двух ручек на спине.»</p>\n<p>Составляющие: преподаёт английский и геометрию; к работе серьёзна; юмор жёсткий; привыкла к играм от Хуко и сама начала стебаться над учителями с кожурой от банана; любит смотреть, как жертвы пытаются встать из-за давления двух ручек на спине.</p>\n<p>Реакция Славы на это: «Учитель английского / Нравится давить ручкой людей 🤨».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0102-S04", "PS-0102--sposobnosti"], "h": "<p>Способностей нет. Это не пробел, а принцип автора: персонажи Ани Мареевой прописываются «без способностей, но подробненько».</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0102-S05", "PS-0102--svyazi-s-drugimi"], "h": "<ul>\n<li>Хуко — назван как источник «игр», к которым Мэри привыкла и от которых переняла манеру стебаться. Кто такой Хуко и что за игры — в переписке не сказано.</li>\n<li>Связана с Анчи и с принципом прописывания персонажей без способностей (по разметке базы).</li>\n</ul>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0102-S06", "PS-0102--kak-menyalsya"], "h": "<p>Версия одна.</p>\n<p><strong>2024-06-30 (id 191747–191772, окно w0040).</strong> Пересланное описание целиком, в том виде, в каком приведено выше. Изменений и уточнений после этого не было.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0102-S07", "PS-0102--chto-s-nim-stalo"], "h": "<p>Дальше в переписке не разрабатывался. Разговор ушёл на общее обсуждение персонажей Ани Мареевой и её рисовки.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0102-S08", "PS-0102--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вселенная не определена. Слава спрашивает прямо: «Чё за вселенная». Миколай: «Хех», «Хз», «Я сам не читал даже описание его», «Я не могу просто пока-что», «Норм думать об этом». Вселенная неизвестна и самим соавторам; в базе запись отнесена к «7 островам» по дате объявления, а не по указанию в тексте.</li>\n<li>Кто такой Хуко и что за «игры от Хуко» — не сказано.</li>\n<li>«Жертвы» — кто это и в каком контексте (ученики, кто-то ещё) — не сказано.</li>\n<li>Возраст, происхождение, внешность помимо роста — не описаны.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["PS-0102--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-06-30</td>\n<td>191747–191772</td>\n<td>w0040</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0102-meri.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0102--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0102.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
