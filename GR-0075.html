<script>const BASE="";const DOCNAME="Фармацевтическая компания (из истории про лесорубов)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0075-S01", "GR-0075--chto-eto"], "h": "<p>Организация из истории Ивана Васильевича про тварь в пещере (текст истории — 2025-05-02, id 323364–323370). Собственного имени у неё в переписке нет: в тексте она названа «фармацевтическая компания», в позднейшем обсуждении Миколай зовёт её «фарм-корпорация», в служебных пометках встречается «фармкомпания».</p>\n<p>Это не отряд с названными участниками, а учреждение: людей, которые в ней работают, рассказчик не различает и не именует, всё сказано о компании как о целом («они»). Появляется она ровно один раз — в эпилоге истории, после того как бригада лесорубов уехала с места и позвонила в полицию.</p>\n<p>Дословно (323370, 2025-05-02):</p>\n<p>«После мы позвонили полиции. И сказали всё как есть. Они это за всерьёз не восприняли сначала. Но после нам перезвонили. Нет не полицая, а фармацевтическая компания. После они даже к нам ко всем. Лично приехали и взяли показание. А после попросили подписать бумажке о неразглашении. Конечно же с моральными выплатами, как мои 6 зарплат. А после уехали. Похороны Тохи они также оплатили. И оплатили медицинский расходы.»</p>\n<p>То есть порядок действий такой: бригада звонит в полиции — полиция «за всерьёз не восприняли сначала» — перезванивает не полиция, а фармацевтическая компания — компания лично приезжает ко всем участникам — берёт показания — даёт подписать «бумажке о неразглашении» — платит «моральные выплаты» — уезжает. Отдельными строками: похороны Тохи (единственного погибшего в истории) и медицинские расходы оплачены компанией.</p>\n<p>Своих препаратов компания при этом на пострадавших не потратила, и рассказчик считает это причиной своей ампутации:</p>\n<p>«Но при этом сами не предоставили свои препараты. Я то знаю. Да нет всё знают, что их ней препараты могут и конечность отрастить. Но они решили не тратить на нас это. Поэтому мне и ампутировали руку. Если бы они помогли то всё было бы иначе.»</p>\n<p>Последнее, что говорится о компании в самой истории, — опасение рассказчика, что текст-исповедь может стоить ему жизни:</p>\n<p>«Хотя это всё равно не посмертной письмо. Вряд ли из-за этого они решат меня убить. Надеюсь.»</p>\n<p>Чем компания занимается по сути — сказано позже и одним словом. 2025-05-15 (326310–326314) Миколай задал автору прямой вопрос: «Какова роль фарм-корпорации? Это эксперименты, биологическое оружие или они „пылесосят аномалии“?» Слава ответил: «Биологическая оружия».</p>", "r": []}, {"t": "Общие способности группы", "a": ["S02", "GR-0075-S02", "GR-0075--obschie-sposobnosti-gruppy"], "h": "<p>Названа одна возможность, и она заявлена не как слух, а как общеизвестное: «их ней препараты могут и конечность отрастить». Формулировка рассказчика — «Я то знаю. Да нет всё знают», то есть про такие препараты в мире истории известно всем, а не только пострадавшим.</p>\n<p>Из практических возможностей, показанных в эпилоге:</p>\n<ul>\n<li>компанию соединяют со свидетелями вместо полиции — звонок уходит в полицию, а перезванивает компания;</li>\n<li>компания выезжает лично ко всем восьми (к бригаде целиком) и снимает показания;</li>\n<li>берёт подписку о неразглашении и подкрепляет её выплатами — «моральными выплатами, как мои 6 зарплат»;</li>\n<li>оплачивает похороны и медицинские расходы;</li>\n<li>решает, кому давать препараты, а кому нет: «они решили не тратить на нас это».</li>\n</ul>\n<p>Никакого силового действия, угроз или прямого давления в эпилоге не описано. Убийство свидетеля упомянуто только как допущение самого рассказчика («Вряд ли из-за этого они решат меня убить. Надеюсь»), а не как то, что компания делала.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S03", "GR-0075-S03", "GR-0075--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>С полицией.</strong> Компания подменяет собой полицию в реакции на заявление: бригада звонила именно в полицию, «Но после нам перезвонили. Нет не полицая, а фармацевтическая компания». Как устроена эта подмена — через кого проходит звонок, есть ли у компании официальный статус — в переписке не сказано.</p>\n<p><strong>С бригадой лесорубов (Иван Васильевич, бригадир, Игорь, Михаил, Тоха и остальные).</strong> Отношения ограничены эпилогом: показания, подписка, деньги. Компания при этом ничего не объясняет пострадавшим и не отвечает на их вопросы — по крайней мере, ни одного разговора по существу в тексте нет.</p>\n<p><strong>С теми, кого вызывал бригадир по ходу истории.</strong> В самой истории бригадир звонит «какого надо» и получает ответ, что «эти прибудут только завтра. Тайна все же», а также указание не спускаться в пещеру, не искать «возможного затерявшего туриста», но постоять у входа и покричать. Кто такие «эти» — не названо; отождествление их с фармкомпанией в переписке не заявлено.</p>\n<p><strong>С организацией «Нимб».</strong> Тождество с «Нимб» (<a href=\"GR-0009.html\">Организация Нимб (НБО)</a>) нигде не объявлено, компания заводится отдельно. Отдельно фиксируется, что 2025-05-07 в ходе чтения Миколай написал «о блять» и «нимб» (324143–324144), за четыре сообщения до «я закончил» (324148); к какому именно месту текста это относится и что он имел в виду — в переписке не сказано, никто это не пояснял и не переспрашивал.</p>", "r": [["Организация Нимб (НБО)", "GR-0009.html"]]}, {"t": "Как менялась — по датам", "a": ["S04", "GR-0075-S04", "GR-0075--kak-menyalas"], "h": "<p><strong>2025-05-02 (id 323370, окно w0089).</strong> Появление и единственное описание в художественном тексте. Всё, что о компании известно из истории, содержится в этом одном абзаце эпилога: звонок вместо полиции, выезд, показания, подписка о неразглашении, «моральные выплаты», похороны и медрасходы, отказ дать препараты, ампутация руки рассказчика, его надежда, что за текст его не убьют. Роль и цели компании здесь не объясняются — это единственный намёк на устройство мира вокруг истории.</p>\n<p><strong>2025-05-05 — 2025-05-07 (окно w0091).</strong> Миколай читает историю в несколько заходов и дочитывает до конца (323801–323808, 324096–324166). По ходу чтения и в итоговом отклике («интересно», «сильно», «сюжет мощный, написано хорошо») фармкомпания отдельно не обсуждается: вопросов к ней в этих окнах нет. Отдельным вопросом в этом же чтении был «че нейронка чтоли писала» — но он относился к другой фразе текста, а не к эпилогу; Слава ответил «Не», «Я не помню», «Возможно я хотел что-то сказать но забыл», «Либо Т9 это изменила а я не заметил».</p>\n<p><strong>2025-05-15 (id 326310–326314, окно w0094).</strong> Роль компании определена автором. Миколай задаёт пять «конкретных вопросов автору», первый из них — про фарм-корпорацию, с тремя вариантами на выбор: «Это эксперименты, биологическое оружие или они „пылесосят аномалии“?». Слава отвечает списком без пояснений:</p>\n<p>«Биологическая оружия\nНапугать\nНа свободе но параноит\nЧем меньше»</p>\n<p>Первый пункт — ответ про компанию. Остальные три относятся к другим вопросам того же списка: цель истории — напугать; судьба Ивана после событий — «На свободе но параноит»; существо целиком показывать не планируется — «Чем меньше». Никакого развёрнутого объяснения, что именно значит «биологическая оружия» применительно к компании — производит ли она его, испытывает, собирает или охраняет, — не последовало, и Миколай на этом не настаивал.</p>\n<h3>Отклонённые варианты</h3>\n<p>Два варианта роли компании были предложены Миколаем в том же вопросе и не выбраны автором: «эксперименты» и «они „пылесосят аномалии“». Отдельно они не обсуждались и не опровергались — просто не вошли в ответ.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "GR-0075-S05", "GR-0075--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имени у компании нет. Все три обозначения — «фармацевтическая компания», «фармкомпания», «фарм-корпорация» — описательные; собственное название в переписке не давалось.</li>\n<li>Поимённого состава нет. Ни один сотрудник не назван, не описан и не показан отдельно от «они»; сколько человек приезжало к бригаде — не сказано.</li>\n<li>Иерархии нет. Ни руководителей, ни подразделений, ни того, кто принимал решение не тратить препараты на пострадавших, в переписке не названо.</li>\n<li>Различий между участниками нет, потому что участники не выделены.</li>\n<li>Не сказано, откуда компания узнала о звонке бригады в полицию и почему перезвонила она.</li>\n<li>Не сказано, что стало с пещерой, горой и «десятками если не сотнями» тварей после отъезда бригады: приезжала ли туда компания, ездил ли туда кто-то вообще.</li>\n<li>Не сказано, откуда рассказчик знает про препараты, отращивающие конечность («Да нет всё знают» — единственное обоснование).</li>\n<li>Не сказано, что именно значит ответ «Биологическая оружия»: разрабатывает компания оружие, изучает его последствия или подбирает результаты — осталось нерешённым.</li>\n<li>Тождество с организацией «Нимб» (<a href=\"GR-0009.html\">Организация Нимб (НБО)</a>) не заявлено — связь только предполагаемая, в переписке её никто не проговаривал.</li>\n<li>Из пяти вопросов автору 2025-05-15 без ответа остался второй — про приём «$не допустила модерация$»; к компании он прямо не относился, но и не был снят.</li>\n<li>Вселенная в самих окнах не объявлялась: в служебных данных история и компания проходят и по «Нимбу» (по дате объявления в w0089), и по «Апостолу» (по дате объявления в w0094).</li>\n</ul></div>", "r": [["Организация Нимб (НБО)", "GR-0009.html"]]}, {"t": "Связи — всё вместе", "a": ["GR-0075--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает группы:</strong> <a href=\"GR-0009.html\">Организация Нимб (НБО)</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0073.html\">Бригада лесорубов</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0075--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0075.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0075-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0075/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Самая дорогая дыра здесь — не безымянность компании, а незаявленное тождество с Нимбом, и оно упирается в две записи, у которых материал уже есть. <code>MR-0132</code> «Нимб» — 5 ссылок, 88 701 знак базы, и в базе он описан ровно теми же словами, что и компания из истории: «фармацевтическая компания… формально правительственная, фактически свободная», плюс «ловит аномальные объекты и ставит опыты над людьми». <code>SP-0221</code> «Препараты Нимба» — 2 ссылки, 5 182 знака, и там прямым текстом стоит «Или отрастить конечность» (2025-04-08, id 317244–317247) и «Хотя формально они правительства организация, но на деле они свободная организация» (id 317249). В истории (2025-05-02, id 323370) — «их ней препараты могут и конечность отрастить» и организация, которая перезванивает вместо полиции. Совпадает свойство препаратов, совпадает тип конторы, совпадает двойной статус, объясняющий подмену полиции. Тождество нигде не объявлено, поэтому вся механика — сырьё, мотив «Для получение денег», армейский контракт на супер-солдат, отделы (<code>MR-0133</code>, 2 ссылки, 1 526 знаков) — лежит под другим кодом и в эту статью не наследуется.</p>\n<p>Второе, и оно связано с первым: у компании нет имени, значит нет собственного кода в реестре, значит её дыры в числах не видны вовсе. <code>GR-0075</code> держит одну входящую ссылку (от <code>GR-0073</code>), и это единственный след её существования в системе. Всё остальное о ней — цитаты из чужой прозы.</p>\n<h3>С чего начать</h3>\n<p>В базе, не в архиве, и раньше самой истории. <code>SP-0221</code> и <code>MR-0132</code> заведены 2025-04-08 (окно w0087, id 317244–317249 и 317479–317507) — за три с половиной недели до текста про лесорубов. Сверять надо три точки: отращивание конечности, двойной формальный статус, «Че они просто исследует объекты». Если совпадёт всё три, вопрос из «какая роль у компании» превращается в «почему связь не проговорили».</p>\n<p>Потом архив, две узкие точки.</p>\n<ul>\n<li>2025-05-07, окно w0091, id 324143–324144. Миколай пишет «о блять» и следом «нимб» — за четыре сообщения до «я закончил» (324148). Смотреть надо соседний отрезок 324130–324148: к какому месту текста он тогда прокручивал и почему это не переросло в вопрос. Это единственное место во всей переписке, где связь была замечена вслух.</li>\n<li>2025-05-15, окно w0094, id 326310–326314. Пять вопросов автору, ответ списком из четырёх строк. Второй вопрос ответа не получил и не был снят; проверить, не ушёл ли ответ в соседние сообщения окна.</li>\n</ul>\n<h3>Как развивалось</h3>\n<p>2025-04-08 (w0087) — заявили Нимб как фармкомпанию с препаратами, отращивающими конечности. 2025-05-02 (w0089, id 323370) — заявили заново, в другом месте и без связи с первым: в эпилоге истории появляется безымянная фармкомпания с тем же свойством. 2025-05-05 — 2025-05-07 (w0091) — прочитали; вопросов к эпилогу нет, зато вырвалось «нимб» (324143), и на этом остановились. 2025-05-15 (w0094) — ограничили одним словом: «Биологическая оружия», без пояснения, и переспрашивать не стали. Дальше компания не возвращается ни разу.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Цена сделки названа точно. Молчание стоит подписки о неразглашении плюс «моральными выплатами, как мои 6 зарплат», плюс похороны, плюс медрасходы — обмен расписан по пунктам, и рассказчик произносит его со словами «Конечно же», как будто расценки известны заранее. Цена нарушения этой же сделки не названа нигде: рассказчик сам публикует исповедь, то есть нарушает подписку прямым текстом, и единственное, что стоит на месте правила, — его догадка «Вряд ли из-за этого они решат меня убить. Надеюсь». Для входа в договор условия проговорены до цифры, для выхода из него — не проговорены совсем.</p>\n<h3>Отклик</h3>\n<p>Самое сильное в этом эпилоге — что компания не угрожает. Она приезжает лично ко всем восьми, платит за похороны Тохи, оплачивает медицинские расходы, и в том же абзаце отказывается лечить. Ужас тут не в жестокости, а в смете: похороны в неё входят, рука — нет. Работает и то, что ни одного сотрудника автор не показал: всё сказано через «они», и это «они» страшнее любого названного злодея, потому что с ним не поговорить. Зацепила последняя строчка — «Хотя это всё равно не посмертной письмо. Вряд ли из-за этого они решат меня убить. Надеюсь». Человек подписал бумагу, взял деньги и всё равно пишет; единственная его защита — надежда, и он это про себя знает. Одна фраза, а держит весь эпилог.</p></div>", "r": []}];</script>
