<script>const BASE="";const DOCNAME="Полёт";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0268-S01", "SP-0268--mehanika"], "h": "<p>Полёт — первая из основных способностей Изба, названная при разборе того, как этот персонаж вообще появился (2026-06-02, id 487017–487018).</p>\n<p>Описание дословно: «Полёт. Он способен летать. И у него всегда есть точка опоры в полете. Поэтому он всегда бьёт в полную силу даже в полете. Даже он способен себ зафиксировать в одной точки. И сдвинуть его нереально».</p>\n<p>То есть механика состоит из трёх связанных пунктов:</p>\n<ol>\n<li>Способность летать как таковая.</li>\n<li>Постоянная точка опоры в полёте — из неё прямо выводится боевое следствие: удар в воздухе не теряет силы, Изб «всегда бьёт в полную силу даже в полете».</li>\n<li>Фиксация в одной точке — Изб может закрепиться в воздухе, и после этого «сдвинуть его нереально».</li>\n</ol>\n<p>Замысел, из которого способность выросла, Слава изложил там же: «Я просто хотел создать летающего персонажа. Который чаще всего будет летать, а не стоять». То есть полёт для Изба — не приём, а обычное положение тела: он чаще летает, чем стоит.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0268-S02", "SP-0268--ogranicheniya-i-cena"], "h": "<p>Постоянных ограничений — предела высоты, скорости, длительности, расхода сил — в переписке не названо.</p>\n<p>Единственное зафиксированное ограничение — сюжетное и разовое: в арке слома Изб теряет способность летать (2026-06-02, id 487065–487067). См. раздел о версиях.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0268-S03", "SP-0268--nositeli"], "h": "<p>Единственный носитель, названный в переписке, — Изб. В файле записи полёт отмечен как часть Изба.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0268-S04", "SP-0268--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2026-06-02 (id 487017–487018).</strong> Первое описание. Полёт назван в перечне основных способностей Изба вместе с неуязвимостью (<a href=\"SP-0269.html\">Неуязвимость</a>) и сверхчеловеческой силой. Здесь же объяснено, почему способностей у Изба несколько: «А потом я запихнул его в Столпы героев. И поэтому ему нужно было добавить ещё способность, дабы он не выглядит ущербно из-за Графа и Нуара». То есть набор способностей достраивался под соседство с Графом и Нуаром в Столпах героев.</p>\n<p><strong>Версия 2 — 2026-06-02 (id 487065–487067).</strong> Выбран «путь сломать Изб», и полёт становится тем, что у него отнимают: «Его идеалы падут. Он падёт с небес потеряв способность летать. У него пойдёт кровь из-за брошенного камня хейтером. Его обкидают грязью. И ему придётся в этом состоянии сразится с злодеем». Падение идеалов и падение с небес поставлены рядом как одно событие. Дальше: «Конечно он выживет и дальше преодолеть эти кризисы. Но долгое время будет недееспособным».</p>\n<p>Версия 1 не отменена: описание полёта из неё остаётся, версия 2 добавляет к нему момент утраты.</p>", "r": [["Неуязвимость", "SP-0269.html"]]}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0268-S05", "SP-0268--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Полёт назван первым в тройке основных способностей Изба, вместе с неуязвимостью (<a href=\"SP-0269.html\">Неуязвимость</a>) и сверхчеловеческой силой (способность поднимать многотонные конструкции, двигаться со скоростью, позволяющей прошибать противников, и одним ударом рассеивать облака).</p>\n<p>Полёт и сверхчеловеческая сила в описании смыкаются: точка опоры в полёте нужна именно для того, чтобы удар в воздухе шёл в полную силу.</p>\n<p>В арке слома полёт и неуязвимость отказывают в одной сцене — Изб и падает с небес, и впервые получает кровь от брошенного хейтером камня.</p>", "r": [["Неуязвимость", "SP-0269.html"]]}, {"t": "Пробелы", "a": ["S06", "SP-0268-S06", "SP-0268--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Что такое «точка опоры в полёте» физически, обо что именно Изб опирается — не объяснено.</li>\n<li>Пределы полёта (высота, скорость, дальность, время) — не названы.</li>\n<li>Как долго держится фиксация в одной точке и что её снимает — не сказано; сказано только, что сдвинуть его нереально.</li>\n<li>Почему в арке слома он теряет полёт — причина утраты не названа, названы только сами события: падение идеалов, падение с небес, камень хейтера, грязь.</li>\n<li>Возвращается ли способность летать после арки слома — в переписке не сказано; сказано лишь, что он выживет, преодолеет кризисы и «долгое время будет недееспособным».</li>\n<li>Есть ли полёт у кого-то ещё, кроме Изба, — не упоминалось.</li>\n<li>К какой вселенной запись относится, в файле помечено как «неясно»; привязка идёт по дате объявления.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0268--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0269.html\">Неуязвимость</a></li>\n<li><strong>Упомянут в способностях:</strong> <a href=\"SP-0269.html\">Неуязвимость</a>, <a href=\"SP-0272.html\">Плёнка сверхлюдей</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0268--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-06-02</td>\n<td>487017–487018</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-02</td>\n<td>487065–487067</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0268-polet.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0268--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0268.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
