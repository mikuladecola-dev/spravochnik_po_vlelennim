<script>const BASE="";const DOCNAME="Монстры";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0046-S01", "MR-0046--ustroystvo"], "h": "<p>Мир монстров апокалипсиса — основная вселенная соавторов с конца июля 2024 и, по договорённости от 24 сентября 2024, остающаяся действующей. Варианты имени: «монстры», «моча», «эта вселенная».</p>\n<p><strong>Принятая версия устройства (2024-07-31, id 214235–214243, окно w0049).</strong> Мир держится на грибнице. Грибница «заразила людей и захватила разум и дала одну цель есть». Грибниц несколько, и происхождение остальных объяснено делением: «Самая первая грибница заставила перенести часть себя чтобы размножиться путем деления». Монстры обслуживают эту систему: «И в эти грибницы монстры будут таскать жрать». Еда — люди.</p>\n<p>В ходе того же сообщения возникает путаница слов: Миколай поправляет «гробница по идее» (id 214236), Слава отвечает «Гробница это пирамида» (id 214239), после чего Миколай признаёт, что понял: «а, я пон», «прикольно» (id 214241–214242). Термином остаётся грибница.</p>\n<p><strong>Отклонённая версия устройства (2024-07-31, id 214171–214186, окно w0049).</strong> Более ранний вариант, предложенный Миколаем: монстры были запечатаны и выбрались наружу из-за луча. «да, они были запечатанны и из-за этого луча они смогли выбраться наружу», «их ещё древние мастера убрали в очень глубокое место», «но эта залупа всё испортила» (id 214176–214177, 214186). В навигации записи луч уточнён как луч квазара. Слава оценил вариант как «Не слишком замутренно» (id 214183), Миколай возразил: «нихуя», «проще ничего не слышал» (id 214184–214185). Дальше эта версия не развивается — следующим идёт вариант с грибницами.</p>\n<p>Общая характеристика монстров в обеих версиях одна и та же и дана Славой: «Монстры», «Монстры страшный» (id 214174–214175).</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0046-S02", "MR-0046--naselenie"], "h": "<ul>\n<li><strong>Монстры.</strong> Страшные. В принятой версии таскают добычу — людей — в грибницы. В отклонённой версии были запечатаны древними мастерами в очень глубоком месте и выбрались из-за луча.</li>\n<li><strong>Грибницы.</strong> Первая грибница и её потомки, полученные делением. Заражают людей, захватывают разум и задают единственную цель — есть.</li>\n<li><strong>Заражённые люди.</strong> С захваченным разумом и одной целью.</li>\n<li><strong>Древние мастера.</strong> Названы только в отклонённой версии: те, кто убрал монстров в очень глубокое место. Больше о них ничего не сказано.</li>\n</ul>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0046-S03", "MR-0046--mesto-vo-vselennoy"], "h": "<p>Действующая вселенная соавторов на конец сентября 2024. Указана как часть «апокалипсиса (новой вселенной)». Связана с сущностями «Грибница», «Список способностей», «История, от которой будешь сраться неделю».</p>\n<p>Статус вселенной подтверждён служебным разговором 2024-09-24 (id 235553–235588, окно w0059). Миколай спрашивает: «а мы че делаем и когда?», «все ещё на монстрах живём?» (id 235555–235556). Слава предлагает выбор: «Новая вселенная», «Или старая?», «Или эта?» (id 235561–235563). Решение Миколая: «ну я хочу писать обо всём на свете», «пока в моче посидим», «тобиж в этой хочу остаться» (id 235564–235566). Слава поправляет название: «Может монстры а не в мочей», «Ну ок» (id 235571–235572). Своё прозвище вселенной Миколай объясняет отдельно: «ну в плане всё что остаётся неизменным я оскорбляю, это моя философия» (id 235574).</p>\n<p>Тем же разговором закреплено разделение работы: «Пиши истории тогда и скидывай» (id 235573) — «А буду ночью читать и говорить обосралься я или нет» (id 235575). Миколай подтверждает: «щас когда получиться я сделаю», «мы договорились» (id 235576, 235578). Слава оставляет решение открытым: «Возможно не на долго», «Ну может быть мне в голову что то влетит», «Ну это все в будущем» (id 235580, 235583–235584).</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0046-S04", "MR-0046--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-07-31 (id 214171–214186, окно w0049).</strong> Монстры страшные, были запечатаны древними мастерами в очень глубоком месте, выбрались из-за луча. Вариант забракован по ходу разговора.</p>\n<p><strong>Версия 2 — 2024-07-31 (id 214235–214243, окно w0049).</strong> Принятая версия: грибница заражает людей и захватывает разум, размножается делением, монстры таскают в грибницы еду. Реакция Миколая — «прикольно», «ч дальше».</p>\n<p><strong>Версия 3 — 2024-09-24 (id 235553–235588, окно w0059).</strong> Устройство мира не меняется, меняется его статус: подтверждено, что соавторы остаются в этой вселенной. Здесь же появляются имена «моча» (Миколай) и «монстры» (Слава) и уговор о том, кто пишет и кто читает.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0046-S05", "MR-0046--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Связь монстров с грибницей не проговорена: порождены ли они ею или существуют отдельно, в переписке не сказано.</li>\n<li>Строгого объявления имени вселенной в окне w0059 нет — название проговорено вскользь и через шутку («моча»).</li>\n<li>Что за луч выпустил монстров в отклонённой версии, в самом чате не раскрыто: «из-за этого луча», «эта залупа». Уточнение про квазар есть только в навигации записи.</li>\n<li>Кто такие древние мастера и почему они запечатывали монстров, не сказано.</li>\n<li>Реплика «5 дней» (id 214181) в разговоре ни к чему не привязана.</li>\n<li>Ответ Славы «Айсберг» (id 214186) на спор о запутанности версии не развёрнут.</li>\n<li>Не сказано, чем закончилась договорённость 24.09 — были ли написаны истории.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0046--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0046--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-31</td>\n<td>214171–214186</td>\n<td>w0049</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-31</td>\n<td>214235–214243</td>\n<td>w0049</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-09-24</td>\n<td>235553–235588</td>\n<td>w0059</td>\n<td>монстры (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0046-monstry.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0046--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0046.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
