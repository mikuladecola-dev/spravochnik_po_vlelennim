<script>const BASE="";const DOCNAME="Теневые братья";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0183-S01", "PS-0183--proishozhdenie"], "h": "<p>Теневые братья названы Славой 2025-01-22 (окно w0072, id 283706–283710) в перечне родни воплощения гнева. Перечню предшествует описание самого воплощения гнева: «Принципиальному, прямолинейному и жестокому / Он воплощения гнева / Прототип защитника только молчиливова / Бэтмен с жестокостью и гневом / Тот кто да мозга костей ненавидит междумирцов / Тот кто оторвёт крылья ангелам, переломает кости своим братьям и сёстрам» (283706).</p>\n<p>Там же дано определение родства, к которому принадлежат Теневые братья: «Братья и сестры это то бишь благословенный одним правителем» (283706). То есть братство здесь — не кровное, а по источнику благословения.</p>\n<p>Сам перечень (283707): «Среди его братьев и сестёр есть владельцы способности изменения агрегатного сотояния, / Та кто может изменять плотность массу и размер объектов и себя / Тот у кого есть способность сжатия / Имитация / Бессмертный выродок / Теневые братья». Теневые братья стоят в этом списке последними и единственные названы именем, а не способностью.</p>\n<p>Имя во множественном числе — «братья», не «брат». Сколько их, в переписке не сказано.</p>", "r": []}, {"t": "Способности", "a": ["S02", "PS-0183-S02", "PS-0183--sposobnosti"], "h": "<p>В переписке не названы. Остальные позиции того же перечня заданы через способность (изменение агрегатного состояния, изменение плотности/массы/размера, сжатие, имитация), а Теневые братья названы только именем. Что именно они делают, из окна w0072 не следует; связь с тенью подразумевается именем и эмодзи 🌘, но нигде не раскрыта.</p>", "r": []}, {"t": "Связи с другими", "a": ["S03", "PS-0183-S03", "PS-0183--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Воплощение гнева</strong> (в каталоге фигурирует как «Защитник🤬») — тот, чьими братьями и сёстрами они названы. Про него сказано, что он «переломает кости своим братьям и сёстрам», то есть отношения внутри этой родни заданы как враждебные.</li>\n<li><strong>Братья и сёстры (благословенные одним правителем)</strong> — категория, к которой они отнесены.</li>\n<li><strong>Дитя света ✨</strong> — с 2025-01-24 Теневые братья перенесены в скобку к этой позиции каталога (см. ниже). Что означает скобка, в переписке не объяснено; по форме записи так же оформлены другие позиции: «Имитатор 🗡( ветреной 🌬; электро⚡️; птичка 🔈)», «Агрегат🫥 ( волк🐺; экстримал ⏳ )», «Разрушительнитца💪 ( огненная 💥)», «Хулиган 💎(слайм 7️⃣)».</li>\n<li>В одном перечне с ними названы Агрегат (изменение агрегатного состояния), Разрушительнитца (плотность, масса, размер), Палач (сжатие), Имитатор (имитация), Бессмертный выродок.</li>\n</ul>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S04", "PS-0183-S04", "PS-0183--kak-menyalsya"], "h": "<p><strong>Версия 1 (2025-01-22, id 283706–283710).</strong> Названы в перечне братьев и сестёр воплощения гнева, последней строкой, без способности.</p>\n<p>В этом же обмене Слава разбирает вопрос о числе благословенных, напрямую с Теневыми братьями не связанный, но задающий рамку категории: «Вообще благословенный Богом есть общая чёрта виде белых глаз при активаций благословения / И я эти глазами наделил всех тех который должны быть благословений дьяволом, при этом и менять я ничего не хочу потому что мне и так нравится / Поэтому я думаю вообще убрать благословенных дьяволом» (283708). Следствие: «Тогда благословенных будет 21» (283709), с оговоркой «Ну конечно можно оставить и 42» (283710). Выбор между 21 и 42 в окне не сделан.</p>\n<p><strong>Версия 2 (2025-01-24, id 284248–284250).</strong> В каталоге персонажей Теневые братья стоят отдельной строкой и первыми в разделе «Благословенный»: «Теневый братья 🌘». Каталог этой даты:</p>\n<ul>\n<li>Благословенный: Теневый братья 🌘; Имитатор 🗡 (ветреной 🌬; электро⚡️; птичка 🔈); Агрегат🫥 (волк🐺; экстримал ⏳); Разрушительнитца💪 (огненная 💥); Палач☠️; Защитник🤬 (ангел 👼); Дитя света ✨; Бессмертный выродок🤪; Хулиган 💎; Вибрация 🫨; Ученица???</li>\n<li>Враг: Доспехи 🏳️; Козлиха🪓; Сестра 🚺; Огненный снайпер🔥; Охотник 🔪; Божество😵; Убийца🩸; Зонтик🩸; Леший 🌳; Пар 💨; Садистка ✂️; Насекомое 😡; Старик ➡️⬅️</li>\n<li>Идей: Чёрный ящик, озеро перерождения, корень желаний</li>\n</ul>\n<p>К каталогу Слава добавил вопрос-загадку: «Угадай кто из врагов чужамириц ?» (284249–284250). Ответ в окне не приведён.</p>\n<p><strong>Версия 3 (2025-01-24, id 284278–284279).</strong> Через сорок минут каталог переписан, и Теневые братья перестают быть отдельной строкой — они уходят в скобку: «Дитя света ✨(Теневые братья 🌘)». Написание имени при этом исправлено с «Теневый братья» на «Теневые братья».</p>\n<p>Другие изменения того же каталога, для контекста: у Агрегата в скобку добавлен «страдалец 🔪», у Хулигана — «слайм 7️⃣», в список врагов добавлен «Эльф 🌬», и появился новый раздел:</p>\n<ul>\n<li>Семь грехов: Гнев 😡 (сила); Похоть 😵‍💫 (контроль разума); Зависть 👹👹 (полной копирование); Алчность ♾ (всё моей); Гордыня 👑; Чероугодия ◼️ (поглощения); Лень😴 (контроль территории)</li>\n</ul>\n<p>Раздел «Идей» остался прежним. Реплика Славы после каталога: «Ну да» (284279).</p>", "r": []}, {"t": "Что с ним стало", "a": ["S05", "PS-0183-S05", "PS-0183--chto-s-nim-stalo"], "h": "<p>В переписке не сказано. Последнее состояние — позиция в скобке при Дитя света ✨ (2025-01-24). Дальше в окне w0072 Теневые братья не упоминаются.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0183-S06", "PS-0183--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Способность не названа. Единственная позиция перечня 283707, заданная именем, а не способностью.</li>\n<li>Сколько их — не сказано, при том что имя во множественном числе.</li>\n<li>Смысл скобки в каталоге («Дитя света ✨(Теневые братья 🌘)») не объяснён: подчинение, свита, родство, одна способность на нескольких — ни один вариант в переписке не назван.</li>\n<li>Причина переноса из отдельной строки в скобку между 10:31 и 11:12 2025-01-24 не проговорена.</li>\n<li>Внешность, характер, происхождение не описаны.</li>\n<li>Не определено, к каким благословенным они относятся после решения «вообще убрать благословенных дьяволом» и не выбрано, 21 благословенных будет или 42.</li>\n<li>Не сказано, состоят ли они в родне воплощения гнева в том же смысле, что и остальные, — то есть благословлены ли тем же правителем.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0183--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0011.html\">Братья и сёстры (благословенные одним правителем)</a>, <a href=\"GR-0013.html\">Благословенные</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0011.html\">Братья и сёстры (благословенные одним правителем)</a>, <a href=\"GR-0012.html\">Теневые братья</a>, <a href=\"GR-0013.html\">Благословенные</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0183--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-01-22</td>\n<td>283706–283710</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-24</td>\n<td>284248–284250</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2025-01-24</td>\n<td>284278–284279</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0183-tenevye-bratya.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0183--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0183.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0183-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0183/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — Дитя света. В скобку к нему Теневых братьев переносят 2025-01-24, и статья считает это последним известным состоянием персонажа; при этом самого Дитя света в базе нет вообще — ни статьи, ни карточки, ни id, при том что имя встречается в 18 статьях справочника. Скобка, которая определяет положение Теневых братьев, ведёт в пустоту. Рядом такие же пустые имена из того же каталога: Хулиган (18 статей), Ученица (17), Разрушительнитца (15) — записи нет ни у одного; Вибрация существует только как <code>SP-0278</code> «Вибрация (Волнистый удар)» (ноль ссылок, статьи нет, база 8 294, вселенная «неясно»).</p>\n<p>Второе — двойник по имени. <code>GR-0012</code> «Теневые братья» — группа, статья 18 322, база нулевая; <code>PS-0183</code> — персонаж, статья 9 792, база 5 993. Одно имя, два типа, статьи у обоих, а связь между ними односторонняя и служебная («Упомянут в группах»). Пока не решено, что это — один объект или два, любая правка придётся в одно из двух мест наугад.</p>\n<p>Третье — каталоги: <code>SL-0051</code> (шесть ссылок, статьи нет, 9 834) и <code>SL-0053</code> (шесть ссылок, статьи нет, 20 313). Там лежит вся дальнейшая судьба этой позиции, включая то, чего статья не знает.</p>\n<h3>С чего начать</h3>\n<p>В базе, и материал разъехался ровно на одну соседнюю запись.</p>\n<p><code>SL-0053</code>, версия 1: 2025-01-27, окно w0073, id 284858. Через три дня после последней даты статьи Теневые братья переезжают ещё раз — из скобки Дитя света в скобку Агрегата: «Агрегат🫥 ( теневые братья 🌑; экстримал ⏳; страдалец 🔪 )», а у Дитя света в скобке появляется «военный 🐺». Эмодзи при переезде меняется с 🌘 на 🌑. Дальше это положение держится во всех редакциях той же записи — 2025-01-28 (285519–285551), 2025-02-25 (295556–295562), 2025-03-06 (298846–298857) — и повторяется в <code>SL-0054</code> (2025-03-13, 301806–301874) и <code>SL-0090</code> (2025-05-14, 325798–325808). Раздел «Что с ним стало» закрыт преждевременно: движение шло ещё четыре месяца, просто в служебных записях.</p>\n<p>Вопрос «21 или 42» тоже имеет продолжение, и не в январе. <code>ID-0143</code> «Благословенный дьяволом» (статьи нет, ссылок ноль, база 3 149, «Апостол»), id 325845–325850, 2025-05-14: Слава сам возвращает категорию — «Благословенный дьяволом», «Ты же хотел создать их», — Миколай в ответ спрашивает «на всегда или пока в зоне обрывает контакт с правителем?», и разговор уходит в сторону. Решение по счёту так и не принято, но январское «думаю вообще убрать» после этого нельзя считать закрытым.</p>\n<p>За способностью в архив идти пока рано. <code>SP-0073</code> «Теневые приёмы» (6 896, статьи нет, ноль ссылок) по имени напрашивается, но это «7 островов», 2024-06-28, отвергнутая ветка про тьму — скорее ложный след; проверить дешевле, чем гадать, но закладываться не стоит.</p>\n<h3>Как развивалось</h3>\n<p>2025-01-22 08:40 — заявили: имя последней строкой в перечне родни, единственная позиция, названная не через способность. 2025-01-24 10:31 — вывели вперёд: отдельная строка и первое место в блоке «Благословенный». 2025-01-24 11:12, через сорок минут — убрали в скобку к Дитя света, попутно исправив написание имени. 2025-01-27 — переставили в скобку к Агрегату, сменив и эмодзи. Дальше пять воспроизведений реестра до мая 2025-го, и в каждом они на том же месте без изменений. За всё это время о них не сказано ни одной отдельной фразы: имя перемещается по списку, содержания не прибавляется.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Число благословенных обсуждается как жёсткий ресурс, который считают поштучно: «Тогда благословенных будет 21», «Ну конечно можно оставить и 42», и вопрос задан прямо — 21 или 42. Теневые братья — единственная позиция списка во множественном числе, и правила, считается ли она за одного благословенного или за нескольких, нет. Для размера категории счёт назван, для единицы этого счёта — не назван.</p>\n<h3>Отклик</h3>\n<p>Зацепило само движение имени. За пять дней Теневые братья успевают побывать последней строкой в чужом перечне родни, первой строкой каталога и содержимым чужой скобки — дважды подряд и у разных владельцев, — и ни в одном из этих положений про них не сказано ни слова. Персонаж без способности обычно выглядит как черновик, который ждёт заполнения; этот выглядит иначе — как деталь, которую перекладывают, потому что она хорошо называется и никуда конкретно не приросла. Множественное число тут работает почти как приём: «братья» звучит как что-то, чего много и что можно приложить к кому угодно, — и его приложили сначала к свету, потом к агрегатному состоянию. То, что вышло это, скорее всего, само собой, эффекта не убавляет.</p></div>", "r": []}];</script>
