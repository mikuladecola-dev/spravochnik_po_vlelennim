<script>const BASE="";const DOCNAME="Семь грехов";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0002-S01", "GR-0002--chto-eto"], "h": "<p>Группа из семи персонажей вселенной «Апостол», названных по семи смертным грехам: Похоть, Чревоугодие, Алчность, Лень, Гнев, Зависть, Гордыня. Разведка определила запись верно: это именно группа, а не один персонаж и не рубрика каталога, — но с оговоркой, что в рабочем реестре Славы «Семь грехов» существуют ещё и как отдельный раздел списка, наравне с разделами «Благословенный», «Враг», «Церковь», «Военный», «Сторонний силы», «Существа», «Аномалий», «Оружие», «Артефакты», «Идей».</p>\n<p>Что грехи такое по природе, сказано один раз, 2025-01-06 (id 278982): «Грехи это существо из минимиров который будут по силе 3 благословенным». Формулировка Славы прозвучала в ответ на предложение Миколая взять добродетели и грехи за основу благословений (Добродетели и грехи как основа благословений <em>(статьи ещё нет — <a href=\"kb/ID-0111-dobrodeteli-i-grehi-kak-osnova-blagosloveniy.html\">исходник</a>)</em>) — предложение было отклонено («Нафига», id 278970), и разговор ушёл в грехов-существ.</p>\n<p>Началась группа раньше, ещё до объявления вселенной: 2024-12-24 (id 273735) Слава ставит задачу «Какую магии или способность ты дал бы каждому из грехов» и приводит список с латинскими названиями — Похоть (luxuria), Чревоугодие (gula), Алчность (avaritia), Лень или апатия (accedia), Гнев (ira), Зависть (invidia), Гордость или гордыня (superbia). Для какого мира этот заход делался, в переписке не сказано — в базе вселенная материала окна w0068 помечена как «неясно».</p>\n<p>К вселенной «Апостол» группа привязывается в январе 2025 года, когда её вписывают в расстановку сил вокруг организации злодеев (<a href=\"MR-0105.html\">Организация злодеев</a>, <a href=\"MR-0107.html\">Иерархия силы</a>).</p>", "r": [["Добродетели и грехи как основа благословений", "kb/ID-0111-dobrodeteli-i-grehi-kak-osnova-blagosloveniy.html"], ["Организация злодеев", "MR-0105.html"], ["Иерархия силы", "MR-0107.html"]]}, {"t": "Состав", "a": ["S02", "GR-0002-S02", "GR-0002--sostav"], "h": "<ul>\n<li><a href=\"PS-0188.html\">Похоть</a> — Похоть</li>\n<li><a href=\"PS-0189.html\">Чревоугодие</a> — Чревоугодие</li>\n<li><a href=\"SP-0159.html\">Алчность</a> — Алчность</li>\n<li><a href=\"PS-0190.html\">Лень</a> — Лень</li>\n<li><a href=\"PS-0177.html\">Гнев (грех)</a> — Гнев</li>\n<li><a href=\"PS-0191.html\">Зависть (грех)</a> — Зависть</li>\n<li><a href=\"PS-0192.html\">Гордыня</a> — Гордыня</li>\n</ul>\n<p>Алчность в базе заведена как запись способности (<a href=\"SP-0159.html\">Алчность</a>, «Грех Алчности»), отдельной карточки-персонажа у неё нет.</p>\n<p>Личных имён, внешности и биографий ни у кого из семи в переписке нет — только грех, способность и эмодзи-метка в каталоге. На прямой вопрос Миколая о степени проработки всего своего списка (2025-01-24, id 284364–284366) Слава отвечает: «Ну только вид и способность и плюс минус характер».</p>\n<p>Пол назван только у Похоти: Слава пишет о ней в женском роде — «она может повысить какое то чувство» (id 284176).</p>", "r": [["Похоть", "PS-0188.html"], ["Чревоугодие", "PS-0189.html"], ["Лень", "PS-0190.html"], ["Гнев (грех)", "PS-0177.html"], ["Зависть (грех)", "PS-0191.html"], ["Гордыня", "PS-0192.html"], ["Алчность", "SP-0159.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0002-S03", "GR-0002--obschie-sposobnosti-gruppy"], "h": "<p>Общее для всех семи — сила относительно других категорий персонажей и владение базовой стихией.</p>\n<p>По силе (2025-01-06, id 278982): существа из минимиров, «по силе 3 благословенным».</p>\n<p>По месту в расстановке (2025-01-23, id 284175): «7 грехов и божество ( помнишь его) Будет слабей главы этой организации но сильней благословенного».</p>\n<p>Числовое правило, добавленное 2025-01-24 (id 284276): «Но не забывай 7 грехов сильней благословенный и чтобы убить одного греха в максимум надо 3 благословенных именно Бога А для остальных благословенных надо будет 5».</p>\n<p>Про стихийную основу — реплика Миколая 2024-12-24 (id 273915–273917). Слава излагает общее правило магии: «Базовый стихий это владением одной из 4 стихий И после только изучение одной из базовой стихий мы можешь изучить другйи отвлетленние магии Типо ты не можешь сразу начать учиться магий дерева для тебя сначала надо научиться магии земле а потом только магии дерева Ну то бишь как в аватаре». Миколай на это отвечает: «но в грехах это базовое подразумевается, такова природа греха». Какая именно стихия у кого — не расписано.</p>", "r": []}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0002-S04", "GR-0002--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p>Способности расписывались дважды: 2024-12-24 — 2024-12-25 (окно w0068) и 2025-01-23 — 2025-01-24 (окно w0072). Оба захода ниже даны по грехам, старые варианты не затёрты.</p>\n<p><strong>Похоть.</strong>\nВариант Миколая (2024-12-24, id 273906): «во первых: если одна способность, то это определённо афродизиак. можно по разному определить его: как стихию и как благословение. типа: либо ты создаёшь туман с веществом и оно на человека влияет. либо ты влияешь на человека»; «во вторых: если набор то к афродизиака контроль серотонина(решает кто кого любит по научному), отключает стыд регулирующий соц поведение»; «в третьих: категорию хз как определить».\nВариант Славы (2024-12-24, id 273920; повторён дословно 2025-01-23, id 284176): «Контроль разума с ограничением. То бишь она может повысить какое то чувство или вызвать галлюцинаций или наоборот понизить какой то чувство».\nВ каталоге (2025-01-24, id 284278): «Похоть 😵‍💫(контроль разума)».</p>\n<p><strong>Чревоугодие.</strong>\nВариант Миколая (2024-12-24, id 273906): «способность всё хавать или поглощать, в том числе магию которая меньше облака заклинания, даже чужая магия. это благословение, ибо влияние, а не создание»; «как набор: поглощение чужих навыков, но не себе. он их поглощает и они исчезают».\nРеакция Славы — «Чревоугодие ок» (id 273920), без правок; та же строка повторена 2025-01-23 (id 284176).\nВ каталоге (2025-01-24, id 284278): «Чероугодия ◼️( поглощения)». То есть в каталог к Чревоугодию попало поглощение — та самая способность, которую в январе примеряли к Алчности.</p>\n<p><strong>Алчность.</strong>\nВариант Миколая (2024-12-24, id 273906): «естественно: воровство, конкретно вещей, любых, можно с нескольких вещей одновременно и даже больших, они хранятся в пространстве»; «также возможность совершить сделку с дьяволом»; «проклятье: ты не можешь ничего отдать кому либо».\nВариант Славы (2024-12-24, id 273920; повторён 2025-01-23, id 284176): «Я думал больше о способности поглощений чужой манный или объектов».\nРазбор Миколая (2024-12-25, id 274462–274463): «нуу думаю это получше, но мне понравилась идея со сделкой в дьявола»; «согл звучит уместнее, просто было воровство, а я повторятся не хотел, если убрать, но очень хорошо подходит, я тоже хотел».\nВ каталоге (2025-01-24, id 284278): «Алчность ♾(всё моей)». Что означает «всё моей», не раскрыто.</p>\n<p><strong>Лень.</strong>\nВариант Миколая (2024-12-24, id 273906): «барьер неуязвимый пока тебе лень. хотя, пока ты спиш»; «телепортация неподкондрольная, ну типа хочется куда то, туда и появляешься, но лень должно быть))))»; «способность растечься, но не двигаться».\nВариант Славы (2024-12-24, id 273920; повторён 2025-01-23, id 284176): «Лень: я думал телекинез типа лень чё то делать вот и телекинез ( здесь ещё в придачу владений магий ветра, как никак они связаны)».\nСвязку телекинеза с ветром Миколай не понял (2024-12-25, id 274464): «хз, я не думал, так что не особо понимаю про ветер». Слава объясняет (id 274465, 274467): «Не типа магия телекинез и магия ветра они же похожий в чем то»; «Ну не прям копия но есть похожие черты». Миколай соглашается: «это лучше», «моя версия мне не нравится», «вот это подходит» (id 274469–274471).\nВ каталоге (2025-01-24, id 284278): «Лень😴( контроль территории)» — формулировка, не совпадающая ни с телекинезом, ни с магией ветра; переход к контролю территории в переписке не объяснён.</p>\n<p><strong>Гнев.</strong>\nВариант Миколая (2024-12-24, id 273906): «по характеру чувствительность к тому что считаешь несправедливым»; «при несправедливом ты в режиме берсерка, повышается мышечная масса, тобиж в размерах меняешься, сила возрастает, контроль уходит и ты разрушаешь то что не справедливо (справедливость всегда субъективна, но субъективная не всегда глупая)»; «магия взрыва развита»; «вес ног увеличен»; «проклятье: теряешь способность видеть человеком того кто поступил не справедливо(ну личность не видишь, это просто груша с маркером ненависти ты видишь чувство)».\nРеакция Славы — «Гнев ну ок» (id 273920), без правок; повторено 2025-01-23 (id 284176).\nВ каталоге (2025-01-24, id 284278): «Гнев 😡( сила)».</p>\n<p><strong>Зависть.</strong>\nВариант Миколая (2024-12-24, id 273906): «способность заставить, забыть человека и всех кто его знает его родословную навязав желаемый статус»; «объект зависти забывает желания»; «магия льда развита».\nВариант Славы (2024-12-24, id 273920; повторён 2025-01-23, id 284176): «Полной перевоплощение тому кого завидуешь, под полный подразумевается полной копирование сил, магии, одежды, внешность но не характера».\nРазбор Миколая (2024-12-25, id 274469–274470): «это лучше», «моя версия мне не нравится».\nВ каталоге (2025-01-24, id 284278): «Зависть 👹👹( полной копирование)».</p>\n<p><strong>Гордыня.</strong>\nВариант Миколая (2024-12-24, id 273906): «шизофрения как способность, чет ему в голову голос говорит какой он крутой»; «магия света и огня развита хорошо»; «магия привлечения внимания».\nВариант Славы (2024-12-24, id 273920; повторён 2025-01-23, id 284176): «Слово закон с ограничением».\nЕдинственный грех, к которому авторы вернулись отдельно (2025-01-24, id 284255–284275). Слава: «Греху гордыни какая способность», «Типо слова закон, че то я не могу представить битву». Миколай предлагает «выход за предел» и поясняет: «типа он гордится силой, отрицая ограничения тела. он легко способен сбросить естественные биологические ограничители, но после такие травмы получить». Затем присылает список этих ограничителей: «1. Центральный регулятор усталости — мозг останавливает усилие до реального истощения мышц, защищая от травм. 2. Болевые рецепторы — сигнализируют о повреждениях, заставляя снизить нагрузку. 3. Терморегуляция — потовые железы и дыхание предотвращают перегрев. 4. Инстинкты самосохранения — страх/дискомфорт ограничивают рискованные действия», с припиской «Тренировки и адаптация могут „обмануть“ эти системы, повышая выносливость, но с риском перегрузок».\nОценка Славы: «Ну пока звучит плохо» (id 284273). Сам Миколай отступает: «ну можно как одна из его особенностей но не основная» (id 284275).\nВ каталоге (2025-01-24, id 284278): «Гордыня 👑» — единственная строка блока без указания способности в скобках.</p>", "r": []}, {"t": "Иерархия", "a": ["S05", "GR-0002-S05", "GR-0002--ierarhiya"], "h": "<p>Внутренней иерархии у группы нет: кто из семи главный, сильнее или старше, в переписке не сказано ни разу. Все семеро идут одним блоком и одной строкой силы.</p>\n<p>Внешняя вертикаль выстроена 2025-01-23 (id 284170–284175):</p>\n<ul>\n<li>глава организации злодеев — «единственный благословенный правителем нашего мира», «она будет грубо говоря сильнейшей»;</li>\n<li>семь грехов и Божество — «слабей главы этой организации но сильней благословенного»;</li>\n<li>благословенный.</li>\n</ul>\n<p>Семь грехов и Божество стоят на этой ступени вместе, одной парой; чем они друг от друга отличаются по силе, не сказано.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Что не сформулировано по вашей же логике — не материал авторов</b>\n<p>Правило смертности названо точно и в цифрах: чтобы убить одного греха «в максимум надо 3 благословенных именно Бога А для остальных благословенных надо будет 5». На той же ступени иерархии, одной парой с грехами, стоит Божество — «7 грехов и божество ( помнишь его) Будет слабей главы этой организации но сильней благословенного». Для греха цена смерти посчитана, для Божества при равном положении в вертикали — нет; чем они друг от друга отличаются по силе, тоже не сказано. Правило есть для одной половины пары и отсутствует для второй.</p></div>", "r": []}, {"t": "Отношения с другими группами", "a": ["S06", "GR-0002-S06", "GR-0002--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>Организация злодеев (<a href=\"MR-0105.html\">Организация злодеев</a>).</strong> Грехи вписаны в её иерархию — ниже главы, — но входят ли они в организацию как её участники, не сказано. О составе организации сказано отдельно и без грехов: «В их ней организаций есть Альфы и благословенный» (2025-01-22, id 283835), где «Альфы сильнейший существа в своём мире». Мотивы самой организации, ради которых заход и начинался, так и не сформулированы.</p>\n<p><strong>Божество.</strong> Стоит с грехами на одной ступени иерархии (id 284175). В каталоге Божество при этом числится в разделе «Враг» («Божество😵»), а грехи — в отдельном разделе «Семь грехов».</p>\n<p><strong>Благословенные.</strong> Отношение задано только через силу: грехи сильнее благословенного, а чтобы убить одного греха «в максимум», нужно 3 благословенных именно Бога, «а для остальных благословенных надо будет 5».</p>\n<p><strong>Минимиры.</strong> Грехи названы «существо из минимиров» (2025-01-06, id 278982); дальше в том окне тема не развивается.</p>", "r": [["Организация злодеев", "MR-0105.html"]]}, {"t": "Как менялась — по датам", "a": ["S07", "GR-0002-S07", "GR-0002--kak-menyalas"], "h": "<p><strong>2024-12-24 (id 273735–273750).</strong> Слава ставит задачу и даёт список семи грехов с латинскими названиями. Уточняет формат: «одну способность», «или категорию», «или набор» — «Как хочешь», «Можешь и так и так». Попутно: «Бля я только сейчас узнал что такое алчность» — «Это жадность и желание получить все».</p>\n<p><strong>2024-12-24, 13:57 (id 273903–273908).</strong> Миколай одним сообщением выкладывает разбор всех семи грехов — способности, наборы и проклятья (полностью приведён выше в разделе о различиях).</p>\n<p><strong>2024-12-24, 14:20–14:26 (id 273915–273920).</strong> Слава излагает правило базовых стихий; Миколай отвечает, что «в грехах это базовое подразумевается, такова природа греха». Слава даёт встречный вариант по спорным грехам: Похоть — контроль разума с ограничением, Чревоугодие — «ок», Алчность — поглощение чужой маны или объектов, Лень — телекинез плюс магия ветра, Гнев — «ну ок», Зависть — полное перевоплощение, Гордыня — слово закон с ограничением.</p>\n<p><strong>2024-12-25 (id 274459–274472).</strong> Миколай разбирает встречный вариант по пунктам: по Алчности вариант Славы «получше», но жалко идею со сделкой с дьяволом; по Лени — сперва не понял связь с ветром, после объяснения согласился; по Зависти — «моя версия мне не нравится»; по Гордыне — «тоже хороший вариант».</p>\n<p><strong>2025-01-06 (id 278968–278984).</strong> Миколай предлагает взять «добродели и грехи как основа благословения» и вставляет список из тринадцати добродетелей. Предложение отклонено: «Нафига». Вместо этого Слава объявляет: «Грехи это существо из минимиров который будут по силе 3 благословенным». Миколай: «эх», «ладно».</p>\n<p><strong>2025-01-22 (id 283833–283842).</strong> Задано направление — мотивы организации злодеев; в её составе Альфы и благословенные. Грехов в этом разговоре ещё нет.</p>\n<p><strong>2025-01-23, 08:39–09:10 (id 284170–284176).</strong> Глава организации объявлена сильнейшей; следом семь грехов и Божество вписаны под неё и над благословенным. Тем же сообщением Слава повторяет декабрьское распределение способностей по семи грехам без изменений.</p>\n<p><strong>2025-01-24, 10:31 (id 284248).</strong> Первая редакция каталога Славы: благословенные, враги, «Идей». Отдельного блока «Семь грехов» в ней ещё нет.</p>\n<p><strong>2025-01-24, 10:44–11:11 (id 284255–284276).</strong> Отдельный заход по Гордыне: «слово закон» не устраивает Славу, Миколай предлагает «выход за предел» со сбросом биологических ограничителей, вариант оценён как «пока звучит плохо» и снижен до «одной из его особенностей но не основная». Тут же добавлено правило убийства греха: 3 благословенных Бога, «а для остальных благословенных надо будет 5».</p>\n<p><strong>2025-01-24, 11:12 (id 284277–284279).</strong> Миколай спрашивает: «остальные грехи сейчас норм?» — Слава отвечает выкладкой второй редакции каталога, где впервые появляется блок «Семь грехов», и словом «Ну да». Блок выглядит так:\nГнев 😡 (сила), Похоть 😵‍💫 (контроль разума), Зависть 👹👹 (полной копирование), Алчность ♾ (всё моей), Гордыня 👑, Чероугодия ◼️ (поглощения), Лень 😴 (контроль территории).\nОтносительно январского распределения здесь смещено сразу несколько позиций: поглощение переехало от Алчности к Чревоугодию, Алчность получила «всё моей», Лень — «контроль территории» вместо телекинеза и ветра, Гнев — «сила», у Гордыни способность не указана вовсе.</p>\n<p><strong>2025-01-24, 12:25 (id 284300–284302).</strong> Третья редакция каталога, добавлены разделы «Оружие» и «Артефакты», в «Идей» «корень желаний» заменён на «камень желаний». Блок «Семь грехов» перенесён без единого изменения. Реакция Миколая: «ебаиь ты работяга», «так много всего придумал».</p>\n<p><strong>2025-01-24, 16:20–16:21 (id 284364–284367).</strong> На вопрос, все ли персонажи из списка продуманы, Слава отвечает: «Ну только вид и способность и плюс минус характер».</p>\n<p><strong>2025-01-27 (id 284858).</strong> Реестр переписан целиком, добавлены разделы «Церковь», «Военный», «Сторонний силы», «Существа», «Аномалий». Блок «Семь грехов» стоит между «Сторонний силы» и «Существа», текст блока прежний.</p>\n<p><strong>2025-01-28 (id 285522).</strong> Очередная редакция реестра с разбором изменений в переписке; блок «Семь грехов» снова без изменений.</p>\n<p><strong>2025-02-25 (id 295559).</strong> Реестр выложен целиком одним сообщением; благословенных уже 14, появились «Одержимый» и наполнился «Военный». Блок «Семь грехов» без изменений.</p>\n<p><strong>2025-03-06, 15:58–16:01 (id 298846–298857).</strong> Реестр выложен ещё раз, блок «Семь грехов» в нём по-прежнему на месте. Сразу после этого Слава: «Грехи нужно убрать, а то тупо» (id 298854). Миколай: «то есть там битвы быть не может последней?» (id 298855), «ну просто в сюжет не совсем входят» (id 298856). Дальше разговор уходит к тому, что в финале объединятся только мелкие и некоторые средние миры, а рай и ад останутся. Отмены этого решения в переписке нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "GR-0002-S08", "GR-0002--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вселенная декабрьского захода (2024-12-24 — 2024-12-25) не названа: неясно, для «Апостола» ли изначально придумывались грехи или это была отдельная задумка.</li>\n<li>Внутренней иерархии нет — кто в группе главный, сильнее, старше, не сказано.</li>\n<li>Не сказано, входят ли грехи в организацию злодеев формально; названо только их место по силе относительно её главы.</li>\n<li>Мотивы организации злодеев, ради которых заводился весь заход, так и не сформулированы.</li>\n<li>Гордыня осталась без утверждённой способности: «слово закон» Славу не устраивает, «выход за предел» назван «пока звучит плохо» и самим Миколаем снижен до неосновной особенности, в каталоге строка идёт с одной эмодзи-меткой.</li>\n<li>По Зависти прямо не сказано, какой из двух вариантов принят окончательно; в январе повторён вариант Славы, но решение словами не зафиксировано.</li>\n<li>«Всё моей» у Алчности не расшифровано.</li>\n<li>Не объяснено, как из телекинеза и магии ветра у Лени получился «контроль территории».</li>\n<li>Не объяснено, почему поглощение перешло от Алчности к Чревоугодию.</li>\n<li>Формулировка «а для остальных благословенных надо будет 5» читается неоднозначно — то ли про других грехов, то ли про других благословенных.</li>\n<li>Не оговорено соотношение Гнева-греха с персонажем-воплощением гнева (Защитником).</li>\n<li>Какая базовая стихия у кого из семи — не расписано, хотя владение ею объявлено подразумевающимся.</li>\n<li>Имён, внешности, характеров, происхождения нет ни у одного из семи; минимиры, из которых они происходят, в связи с грехами дальше не разрабатываются.</li>\n<li>Ни одной сцены с участием грехов в переписке нет.</li>\n</ul></div>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Чинить первым надо каталог, а не грехи. Рабочий реестр Славы заведён в базе двумя записями — <code>SL-0051</code> (9 834) и <code>SL-0053</code> (20 313), — и на каждую ссылаются по шесть статей; больше ссылок нет ни у одной сущности этого куста. Статьи нет ни у той, ни у другой. При этом ровно из каталога взяты все спорные строки блока: «всё моей» у Алчности, «контроль территории» у Лени, переезд поглощения от Алчности к Чревоугодию, пустая скобка у Гордыни. Пока каталог не разобран отдельно, с датами редакций и разницей между ними, семь статей о грехах будут по очереди пересказывать один и тот же список и по очереди отмечать в пробелах, что он не сходится с январским распределением. Рядом <code>SL-0090</code> (5 492, четыре ссылки) и <code>SL-0089</code> (1 753, четыре ссылки) — те же реестры в поздних редакциях, тоже без статей.</p></div>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Второе по цене — декабрьский заход. Он лежит в базе не там, где эта статья его ищет. <code>SP-0156</code> «Семь грехов (магия по грехам)» — 11 757, <code>SP-0157</code> Похоть — 7 256, <code>SP-0158</code> Чревоугодие — 7 117, <code>SP-0160</code> Лень — 8 291, <code>SP-0161</code> Зависть — 8 056, <code>SP-0162</code> Гордыня — 7 454. Около пятидесяти килобайт, вселенная у всех шести помечена «неясно», статей нет, ссылок ноль. Единственное исключение — <code>SP-0159</code> Алчность: статья есть, вселенная проставлена «Апостол», одна ссылка. То есть шесть грехов из семи существуют в базе дважды — как персонажи «Апостола» и как ничейные записи способностей, и первый же пробел статьи («вселенная декабрьского захода не названа») упирается именно в этот разъезд.</p></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0002--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0177.html\">Гнев (грех)</a>, <a href=\"PS-0188.html\">Похоть</a>, <a href=\"PS-0189.html\">Чревоугодие</a>, <a href=\"PS-0190.html\">Лень</a>, <a href=\"PS-0191.html\">Зависть (грех)</a>, <a href=\"PS-0192.html\">Гордыня</a></li>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0159.html\">Алчность</a></li>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0105.html\">Организация злодеев</a>, <a href=\"MR-0107.html\">Иерархия силы</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0002--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0002.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0002-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0002/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Чинить первым надо каталог, а не грехи. Рабочий реестр Славы заведён в базе двумя записями — <code>SL-0051</code> (9 834) и <code>SL-0053</code> (20 313), — и на каждую ссылаются по шесть статей; больше ссылок нет ни у одной сущности этого куста. Статьи нет ни у той, ни у другой. При этом ровно из каталога взяты все спорные строки блока: «всё моей» у Алчности, «контроль территории» у Лени, переезд поглощения от Алчности к Чревоугодию, пустая скобка у Гордыни. Пока каталог не разобран отдельно, с датами редакций и разницей между ними, семь статей о грехах будут по очереди пересказывать один и тот же список и по очереди отмечать в пробелах, что он не сходится с январским распределением. Рядом <code>SL-0090</code> (5 492, четыре ссылки) и <code>SL-0089</code> (1 753, четыре ссылки) — те же реестры в поздних редакциях, тоже без статей.</p>\n<p>Второе по цене — декабрьский заход. Он лежит в базе не там, где эта статья его ищет. <code>SP-0156</code> «Семь грехов (магия по грехам)» — 11 757, <code>SP-0157</code> Похоть — 7 256, <code>SP-0158</code> Чревоугодие — 7 117, <code>SP-0160</code> Лень — 8 291, <code>SP-0161</code> Зависть — 8 056, <code>SP-0162</code> Гордыня — 7 454. Около пятидесяти килобайт, вселенная у всех шести помечена «неясно», статей нет, ссылок ноль. Единственное исключение — <code>SP-0159</code> Алчность: статья есть, вселенная проставлена «Апостол», одна ссылка. То есть шесть грехов из семи существуют в базе дважды — как персонажи «Апостола» и как ничейные записи способностей, и первый же пробел статьи («вселенная декабрьского захода не названа») упирается именно в этот разъезд.</p>\n<p>Третье, мелкое, но с ссылкой: <code>ID-0111</code> — та самая идея, отказ от которой («Нафига») и породил определение грехов как существ минимиров. Одна ссылка, база 5 419, статьи нет.</p>\n<h3>С чего начать</h3>\n<p>В базе, почти всё.</p>\n<p>Каталог целиком есть в <code>SL-0051</code>, <code>SL-0053</code>, <code>SL-0090</code>, <code>SL-0089</code> — четыре редакции реестра лежат четырьмя отдельными записями, и разница между ними уже зафиксирована, её надо просто свести. Декабрьский материал — <code>SP-0156</code>, <code>SP-0157</code>, <code>SP-0158</code>, <code>SP-0160</code>, <code>SP-0161</code>, <code>SP-0162</code>, плюс <code>SP-0159</code> как образец того, как эти записи выглядят после привязки к вселенной. Дубли самой группы: <code>PS-0187</code> «Семь грехов» (две ссылки, статья есть, 10 426) и <code>MR-0101</code> «Грехи (существа минимиров)» (одна ссылка, статья есть, 4 608) — из <code>GR-0002</code> на них не ссылаются ни разу, хотя это та же группа под другими типами. Про минимиры, откуда грехи родом, — <code>MR-0094</code> (12 462, статья есть) и <code>MR-0103</code> «Правители минимиров» (3 793).</p>\n<p>В архив идти за одним. Окно w0068, 2024-12-24 — 2024-12-25, id 273735–274472: искать, назван ли мир до того, как Слава выложил список с латинскими названиями. Именно эта неизвестность делает шесть записей способностей ничейными. Вторая точка в архиве — 2025-03-06, id 298854 и дальше: после «Грехи нужно убрать, а то тупо» разговор уходит к финалу с раем и адом; проверить, всплывают ли грехи там ещё раз, потому что отмены решения в статье нет, а блок в реестре к этому дню уже полгода стоит без правок.</p>\n<h3>Как развивалось</h3>\n<p>2024-12-24 — заявили: задача, латинский список, три разрешённых формата ответа («одну способность», «или категорию», «или набор», «Как хочешь»). В тот же день и на следующий — разбор по семи, встречный вариант, сверка. 2025-01-06 — ограничили, и ограничение пришло сбоку: предложение про добродетели отклонено, и вместо него грехи получают природу и потолок одной репликой — существа из минимиров, по силе три благословенных. 2025-01-23 — 2025-01-24 — ограничили ещё раз, уже числом: место под главой организации, 3 благословенных Бога на убийство, 5 для остальных, и каталожный блок. Дальше забыли: 2025-01-27, 2025-01-28, 2025-02-25, 2025-03-06 — четыре выкладки реестра подряд, блок «Семь грехов» переносится каждый раз без единого изменения. Вернулись 2025-03-06, id 298854, и возврат оказался вычёркиванием: «Грехи нужно убрать, а то тупо», «ну просто в сюжет не совсем входят».</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Правило смертности названо точно и в цифрах: чтобы убить одного греха «в максимум надо 3 благословенных именно Бога А для остальных благословенных надо будет 5». На той же ступени иерархии, одной парой с грехами, стоит Божество — «7 грехов и божество ( помнишь его) Будет слабей главы этой организации но сильней благословенного». Для греха цена смерти посчитана, для Божества при равном положении в вертикали — нет; чем они друг от друга отличаются по силе, тоже не сказано. Правило есть для одной половины пары и отсутствует для второй.</p>\n<h3>Отклик</h3>\n<p>Сильное здесь — декабрьский разбор Миколая одним сообщением: не список способностей, а семь маленьких механик, у каждой своя внутренняя логика и почти у каждой цена. Гнев с потерей лица противника («это просто груша с маркером ненависти ты видишь чувство»), Алчность с проклятьем «ты не можешь ничего отдать кому либо», Лень с телепортацией, которая срабатывает только если лень. Это придумано не про силу, а про характер, из которого сила растёт, — и оговорка «справедливость всегда субъективна, но субъективная не всегда глупая» тут не украшение, она держит всю конструкцию Гнева. Дальше почти всё это стёрлось: сверка, каталог, потом четыре переноса блока без правок, потом «тупо, убрать». Зацепило не то, что жалко, — жалко неинтересно. Зацепило, что маршрут виден целиком: детально придуманное вытеснено не другим придуманным, а строкой в таблице, и вытеснение заняло полтора месяца.</p></div>", "r": []}];</script>
