<script>const BASE="";const DOCNAME="Чёрный шар";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0226-S01", "SP-0226--mehanika"], "h": "<p>Артефакт, а не врождённая сила. В переписке проходит под именем «Артефакт- чёрный шар» (2025-05-14, id 325841).</p>\n<p>Формулировка Славы: «Способность создаёт зону отчуждения, который решает благословенных благословенний. При этом на артефакты, альфоф и арбитаров никак не действует».</p>\n<p>Механика в том виде, в каком её довели за один разговор:</p>\n<ul>\n<li>Шар создаёт <strong>зону отчуждения</strong>.</li>\n<li>Внутри зоны благословенные лишаются благословения.</li>\n<li>Причина, названная во второй версии: «Зона куда связь не дотягивает, поэтому благословенный не получают силу» (id 325855). То есть шар не отнимает силу напрямую, а разрывает канал — связь благословенного с правителем, от которого сила поступает. Внутри зоны связь просто не достаёт.</li>\n<li>Эффект <strong>временный и локальный</strong>: «И да это временно. Пока ты находишься в это зоне» (id 325855). Вышел из зоны — благословение вернулось.</li>\n</ul>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0226-S02", "SP-0226--ogranicheniya-i-cena"], "h": "<p>Названы три категории, на которые шар не действует: артефакты, альфы, арбитры. Обоснование Слава дал единой формулой — «Так как их ней сила это их нея» (id 325844), то есть их сила принадлежит им самим и ни от какой внешней связи не зависит. Обрывать в их случае нечего.</p>\n<p>Из этого следует граница применимости артефакта: он работает только против сил, которые кем-то выдаются и поддерживаются извне. Против сил собственных он бесполезен.</p>\n<p>Цена для того, кто пользуется шаром, в переписке не названа. Размер зоны, дальность, длительность работы самого артефакта, способ активации — не названы.</p>\n<p>Отдельно: обладателя шара в переписке не указано, и не сказано, действует ли зона на самого носителя, если он благословенный.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0226-S03", "SP-0226--nositeli"], "h": "<p>Носитель не назван. Артефакт описан как предмет сам по себе, вне владельца.</p>\n<p>Категории сил, относительно которых шар определён (перечень назван в этом же материале как «Список категорий сил»): Благословенный, Арбетары, Альфы, Чужемирцы, Владельцы артефактов, Фантазёры. Из шести категорий в описании шара разобраны четыре — благословенные (мишень), артефакты, альфы, арбитры (иммунны). Про чужемирцев и фантазёров в связи с чёрным шаром не сказано ничего.</p>\n<p>Сам шар по этой классификации попадает в категорию артефактов; то есть по своей же формулировке — на другие артефакты и на владельцев артефактов он не действует.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0226-S04", "SP-0226--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-05-14 (окно w0094, id 325840–325844).</strong> Первое описание. Названы зона отчуждения, лишение благословенных благословения и иммунитет артефактов, альф и арбитаров. Обоснование иммунитета: «Так как их ней сила это их нея» (id 325844).</p>\n<p><strong>Версия 2 — 2025-05-14, через три минуты (окно w0094, id 325847–325855).</strong> Уточнение, которое Миколай вытянул прямым вопросом: «на всегда или пока в зоне обрывает контакт с правителем?» (id 325847). Ответ Славы: «Зона куда связь не дотягивает, поэтому благословенный не получают силу. И да это временно. Пока ты находишься в это зоне» (id 325855).</p>\n<p>Вторая версия добавляет два элемента, которых в первой не было: механизм (не отъём силы, а недостающая связь) и временность эффекта. Первая версия про длительность не говорила ничего — вопрос Миколая поставлен именно потому, что из неё этого не следовало.</p>\n<p>Обе версии записаны одним днём, в одном окне, с разницей в несколько минут.</p>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S05", "SP-0226-S05", "SP-0226--otklonennye-varianty"], "h": "<p>Отклонённых вариантов по самому шару в переписке нет: единственное описание сразу принято и один раз уточнено.</p>\n<p>В том же окне идёт фоновый разговор, к механике шара прямо не относящийся: Миколай о том, что берёт не всё подряд («типа с этим согласен. с этим нет / в не спизжу это, спизжу то, если че», id 325840) и что на большинство вопросов отвечал «незнанаю, хз че выбрать» (id 325842, 325843). Что именно за вопросы и чей это опросник — в переписке не сказано. Там же короткий обмен про миры: Миколай «миры же есть?» (id 325848), Слава «Ты же хотел создать их» (id 325849), Миколай «да, было дело» (id 325850). К чёрному шару это не привязано.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S06", "SP-0226-S06", "SP-0226--svyaz-s-drugimi-sposobnostyami"], "h": "<ul>\n<li><strong>Благословенные.</strong> Единственная категория, по которой шар работает. Вся механика артефакта определена через них: он отменяет не силу вообще, а конкретно благословение.</li>\n<li><strong>Правитель.</strong> Названа как источник, от которого благословенный получает силу по связи. В описании шара правитель фигурирует только как дальний конец обрываемого канала; кто он и сколько их, здесь не сказано.</li>\n<li><strong>Артефакты, альфы, арбитры.</strong> Определены как исключения, с общим обоснованием «их сила это их» — по этому признаку они противопоставлены благословенным.</li>\n<li><strong>Чёрный ящик.</strong> Числится в связанных с чёрным шаром, но в приведённых кусках переписки о нём ничего не говорится — в чём связь, не сказано.</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S07", "SP-0226-S07", "SP-0226--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Размер зоны отчуждения не назван.</li>\n<li>Способ активации и выключения не назван; не сказано, работает ли шар постоянно или его включают.</li>\n<li>Не сказано, кто владеет шаром и откуда он взялся.</li>\n<li>Не сказано, действует ли зона на самого носителя шара.</li>\n<li>Не сказано, что происходит с благословенным, если зона накрывает его в момент применения силы.</li>\n<li>Не сказано, действует ли шар на чужемирцев и фантазёров — две из шести категорий сил остались неразобранными.</li>\n<li>Не сказано, отслеживает ли правитель обрыв связи со своей стороны и замечает ли что-нибудь.</li>\n<li>Связь с Чёрным ящиком заявлена, но в переписке не раскрыта.</li>\n</ul></div>\n<div class=\"mnote\"><b>⚙ машинная заметка · С чего начать — не материал авторов</b>\n<ul>\n<li>2025-05-31, id 331636 — большое сообщение, где разом разобраны правители, арбетары с альфами, фантазёры и артефакты. Там лежит правило про артефакты, которое с шаром никогда не сводили: «Благословенный; альфа, Арбетары и фантазёры не способны раскрыть всю мощь артефакта. Так как уже сами переполненный силой. Лучшего всего мощь артефакта способен раскрыть обычный человек». Это ближайший существующий материал к пробелу «кто владеет шаром».</li>\n<li><code>SP-0163</code> «Благословение» (86 784) и <code>SP-0204</code> «Предохранитель» (17 153) — второй конец обрываемого канала. Там сказано, что связь с правителем идёт через мозг носителя; вопросы «что чувствует благословенный внутри зоны» и «замечает ли правитель обрыв» ставятся именно оттуда, а не отсюда.</li>\n<li><code>PS-0270</code> «Фантазёры» (9 594) и <code>PS-0198</code> «Чужемирцы» (58 680) — две из шести категорий, которые в разговоре о шаре не тронули. Обе с готовыми статьями.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["SP-0226--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-05-14</td>\n<td>325840–325844</td>\n<td>w0094</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-05-14</td>\n<td>325847–325855</td>\n<td>w0094</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0226-chernyy-shar.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0226--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0226.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["SP-0226-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/SP-0226/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — <code>SL-0089</code> «Список категорий сил (Благословенный, Арбетары, Альфы, Чужемирцы, Владельцы артефактов, Фантазёры)»: четыре ссылки, статьи нет, 1 753 знака базы, одно окно (2025-05-10, id 324539–324541). Шар определён целиком через этот перечень — кто мишень, кто иммунен, кто вообще не разобран, — а сам перечень существует как шесть строк внутри чужих записей. На него уже опираются <code>PS-0281</code> «Арбетары и Альфа», <code>PS-0270</code> «Фантазёры», <code>PS-0198</code> «Чужемирцы», <code>MR-0146</code> и эта статья. Дыра дешёвая по объёму и дорогая по последствиям: пока нет статьи о самом списке, вопрос «почему шар берёт одну категорию и не берёт три» негде поставить иначе, как в скобках.</p>\n<p>Вторая — владелец. Статья честно пишет, что обладателя нет; хуже то, что нет и категории. «Владельцы артефактов» — пятая строка того же перечня — не заведены в базе вообще: ни статьи, ни записи, ни строки. Ближайшее по смыслу — <code>SP-0047</code> «Артефакты» (одна ссылка, статья 16 873, база 24 897) и <code>SP-0229</code> «Артефакты с символикой» (7 585 / 6 721). То есть разряд, к которому сам шар и относится, в реестре назван и нигде не раскрыт.</p>\n<p>Третья — Чёрный ящик, но тут наоборот: материала полно. <code>SP-0120</code> «Чёрный ящик» — статья есть, 54 937 знаков базы, 14 версий, окна w0064–w0122, главный разбор 2025-04-18 (id 320032–320135), и при этом ноль ссылок на него. Связь двух записей держится, судя по всему, на соседстве строк в одном реестре: в <code>SL-0090</code> «Чёрный ящик» стоит последней строкой раздела «Идей».</p>\n<h3>С чего начать</h3>\n<p>В базе, и не в мае, а в конце месяца.</p>\n<ul>\n<li>2025-05-31, id 331636 — большое сообщение, где разом разобраны правители, арбетары с альфами, фантазёры и артефакты. Там лежит правило про артефакты, которое с шаром никогда не сводили: «Благословенный; альфа, Арбетары и фантазёры не способны раскрыть всю мощь артефакта. Так как уже сами переполненный силой. Лучшего всего мощь артефакта способен раскрыть обычный человек». Это ближайший существующий материал к пробелу «кто владеет шаром».</li>\n<li><code>SP-0163</code> «Благословение» (86 784) и <code>SP-0204</code> «Предохранитель» (17 153) — второй конец обрываемого канала. Там сказано, что связь с правителем идёт через мозг носителя; вопросы «что чувствует благословенный внутри зоны» и «замечает ли правитель обрыв» ставятся именно оттуда, а не отсюда.</li>\n<li><code>PS-0270</code> «Фантазёры» (9 594) и <code>PS-0198</code> «Чужемирцы» (58 680) — две из шести категорий, которые в разговоре о шаре не тронули. Обе с готовыми статьями.</li>\n</ul>\n<p>В архив — за одним коротким отрезком: окно w0094, 14 мая, после 325855. Весь разговор о шаре занимает четыре минуты, 12:43–12:47, и обрывается на ответе Славы. Смотреть надо, спрашивал ли Миколай дальше в тот же день про размер зоны и включение — судя по тому, как он вытянул временность одним вопросом, это его типовой ход.</p>\n<h3>Как развивалось</h3>\n<p>12:44 — заявлено: зона отчуждения, благословенные теряют благословение. 12:45 — тут же ограничено: артефакты, альфы, арбитры не берутся, обоснование одной строкой — «Так как их ней сила это их нея». 12:46 — Миколай упирается в недосказанное: «на всегда или пока в зоне обрывает контакт с правителем?». 12:47 — механизм и срок: связь не дотягивается, эффект держится, пока стоишь в зоне. Дальше не возвращались; 31 мая артефакты разбирают заново и подробно, но чёрный шар в этом разговоре не назван ни разу.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Иммунитет решается по происхождению силы: своя — шар не берёт, выданная по связи — берёт. Правило названо и применено к трём категориям из шести. Для двух оставшихся из того же списка вопрос не поставлен вовсе, хотя происхождение их силы к тому моменту описано: у фантазёров — «Они создали свой мир в голове» (2025-05-31, id 331636), у чужемирцев есть четыре отдельные записи со статьями. Основание для решения лежит рядом, решения по соседним клеткам того же перечня нет.</p>\n<p>И вторым слоем то же самое в одной строке: в перечне категория называется «Владельцы артефактов» — люди; в правиле иммунитета названы «артефакты» — предметы. Для предмета сказано, что его не берёт. Для человека, чья сила и есть предмет, того же рода утверждения нет.</p>\n<h3>Отклик</h3>\n<p>Понравилась экономность решения. Шар ничего не отнимает и ничего не ломает — он просто оказывается местом, куда не дотягивается провод. Из одной этой картинки сразу следует и то, что эффект временный, и то, кого он не берёт, и почему: критерий иммунитета — не прочность и не ранг, а чья сила. Пять слов с опечатками — «их ней сила это их нея» — делают тут работу целой системы правил. Отдельно смешно и хорошо, что артефакт, отключающий чужие силы, сам по своей же классификации попадает в разряд неприкасаемых: выключатель, который себя выключить не может. И заметно, что временность появилась не от автора, а от вопроса: описание молчало про срок, пока Миколай не спросил в лоб. Такие места в переписке видно сразу — механика достраивается ровно на длину заданного вопроса, ни на слово больше.</p></div>", "r": []}];</script>
