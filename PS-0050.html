<script>const BASE="";const DOCNAME="Дима";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0050-S01", "PS-0050--proishozhdenie"], "h": "<p>Персонаж Славы. Появляется в переписке четыре раза, с 2024-04-03 по 2025-11-21, в трёх окнах (w0029, w0103, w0110). Первое появление — карточка персонажа во вселенной «игра бога» (2024-04-03, id 153530): имя, две черты характера и способность. Дальше имя всплывает уже во вселенной «Апостол», в прозе Славы, и связи между карточкой 2024 года и прозой 2025 года в переписке не проведено.</p>\n<p>В прозаическом варианте (2025-09-08, id 362528–362531, история «Бетонный герой») Дима — друг рассказчика: «Дима мой друг ещё со школы. И он любитель подобных мест. Заброшек я имею ввиду». В воспоминании рассказчика о детстве уточняется, откуда они знакомы: «Когда-то давно, когда я был ещё ребёнком, что не ходил в школу. Я часто гулял с друзьями с одной площадки. На той площадки была четыре квартиры и четыре ребёнка у каждого. И на удивление одного возраста. Дима, Леха и.. Андрей, ну и я . Четыре друга». Про детский возраст всей четвёрки сказано, что различий между ними тогда не было: «Не кто друг от друга особо не отличался. Как никак в детстве особо характер ещё не сформировался. Были лишь желания и инстинкты. В детстве больше всего были похоже на зверей». Исключение из этого — как раз Дима: «Но даже так наш Дима уже имеет пристрастья к заброшенным зданиям. И вот он нашёл заброшенный дом большое и бетонные».</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0050-S02", "PS-0050--vneshnost"], "h": "<p>Внешность описана только в версии от 2025-11-21 (id 387578, история «Зима»). Дима — высокий плечистый мужчина. У него натуральный чёрный цвет глаз, чёрные волосы и чёрная одежда, названная любимой: «Высокий, плечистый Дима, что имел натуральный чёрный цвет глаз, что устало глядели на меня, и чёрные волосы, который сейчас были покрыти инейм, а его любимая чёрная одежда».</p>\n<p>В сцене он приходит с мороза, и всё чёрное на нём занесено: волосы покрыты инеем, чёрная куртка осыпана снегом и щепками от дерева, чёрные штаны «затверденели и не сгибались». Идёт он от двери, оставляя за собой белые следы снега.</p>\n<p>В карточке 2024 года и в «Бетонном герое» внешность не описана.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0050-S03", "PS-0050--harakter"], "h": "<p>В карточке 2024 года (id 153530) характер задан двумя словами: «Разговорчивый, приставучий».</p>\n<p>В прозе 2025 года эти две черты не используются и не упоминаются. Вместо них закреплена одна устойчивая черта — пристрастие к заброшенным зданиям, названное и в детстве, и во взрослом возрасте. В «Бетонном герое» это работает как объяснение: очнувшись в бетонном помещении без окон и дверей, рассказчик первым делом думает про Диму — «Первая мысль, что пришла в голову- Дима блять.наверника это он нас сюда привел».</p>\n<p>В «Зиме» (id 387578) Дима показан молчаливым и уставшим: заходит, падает на скамейку у печки, снимает шапку и перчатки, тяжело дышит; на вопрос про Максима отвечает одной фразой — «да там дерево распиливает, который мы повалили». Дальше — «Неловкая тишина».</p>\n<p>В «Ложном герое» (id 387585) он вступает в драку с существом, защищая чужую семью, и в финале сам оценивает это как геройство, о котором жалеет: «Погеройствовал блять Дима».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0050-S04", "PS-0050--sposobnosti"], "h": "<p>Способность названа только в карточке 2024 года (id 153530): «кровавая палец ( может стрелять кровью из пальца 3 раза максимум)». То есть стрельба кровью из пальца с жёстким лимитом — максимум три раза.</p>\n<p>Ни в «Бетонном герое», ни в «Зиме», ни в «Ложном герое» способность не применяется и не упоминается. В «Ложном герое» Дима дерётся с рогатым существом обычным рукопашным способом — пинки, удар в челюсть, попытка опрокинуть — и проигрывает.</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0050-S05", "PS-0050--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Герой-рассказчик «Бетонного героя»</strong> — друг со школы и с детской площадки. Пили вместе в пятницу перед тем, как рассказчик очнулся в бетонном мире: «Да я помню, как мы с Димой и Лёхой собрались в пятницу у Димы, и начали употрее алкоголь». Собирались, по этой фразе, у Димы.</li>\n<li><strong>Лёха</strong> — третий участник той же пьянки и один из четырёх детей с площадки. Рассказчик ищет обоих в бетонном здании: «где Дима с Лёхой?».</li>\n<li><strong>Андрей</strong> — четвёртый ребёнок с той же площадки. В пьянке перед провалом не участвует.</li>\n<li><strong>Максим</strong> — в «Зиме» находится там же, в зимней халупе и рядом с ней; Дима с ним валил дерево, Максим остался его распиливать. Про Максима рассказчик «Зимы» говорит, что тот разжигает огонь с первого раза, и что именно он выкинул спички и зажигалку и вручил огниво с кремнем — «один особо одарённый решил, что мы будем топить печь по старинке».</li>\n<li><strong>Рассказчик «Зимы»</strong> — тот, кто безуспешно разжигает печь и с кем Дима перекидывается двумя репликами. Кто он, в переписке не назван.</li>\n<li><strong>Рогатое существо</strong> — противник в «Ложном герое». Ростом «метра 2 если не выше», жилистое, упругое, с сероватой кожей, без гениталий, с рогами в необычных местах: один вместо уха, другой чуть ниже уха. Оно ломает Диме череп и утаскивает его в лес.</li>\n<li><strong>«Бетонный герой»</strong> — в файле указано, что Дима является частью этой истории.</li>\n</ul>", "r": []}, {"t": "Как менялся", "a": ["S06", "PS-0050-S06", "PS-0050--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2024-04-03 (id 153530, окно w0029, вселенная «игра бога»).</strong> Полная карточка персонажа, три строки: имя, «Разговорчивый, приставучий», способность «кровавая палец ( может стрелять кровью из пальца 3 раза максимум)».</p>\n<p><strong>Версия 2 — 2025-09-08 (id 362528–362531, окно w0103, вселенная «Апостол»).</strong> Дима введён в прозу как друг рассказчика со школы и с детской площадки, любитель заброшек. Присутствует только в чужой памяти: сам в кадре не появляется ни разу. Две функции в тексте — быть первым объяснением, которое приходит рассказчику в голову («Дима блять.наверника это он нас сюда привел»), и быть тем, кого рассказчик обходит этаж за этажом в поисках. Ни одного этажа поиски не дают. В детском воспоминании закреплено, что Дима ещё ребёнком нашёл «заброшенный дом большое и бетонные», и рассказчик связывает это с бетонным миром, в котором очнулся. Черты из карточки 2024 года («разговорчивый, приставучий») и способность здесь не появляются.</p>\n<p><strong>Версия 3 — 2025-11-21 (id 387578–387579, окно w0110, вселенная в переписке не объявлена).</strong> История «Зима». Дима впервые появляется в кадре лично. Здесь задана вся внешность: высокий, плечистый, натуральный чёрный цвет глаз, чёрные волосы, чёрная одежда. Обстановка — деревянная халупа в десяти тысячах километров от дома, до ближайшего населённого пункта четыре километра, вокруг ветер, снег и деревья. Дима приходит с валки дерева, вымотанный, весь в снегу и щепках. Появление предваряется тем, что дом вздрагивает от шума падения чего-то большого, и с потолка сыплется пыль и опилки. Рассказчик сначала принимает вошедшего за угрозу и готовится драться, сжимая полено, и узнаёт его, только когда тот поворачивается лицом. Сообщение 387579 состоит из одного слова — «Второе».</p>\n<p><strong>Версия 4 — 2025-11-21 (id 387585–387586, окно w0110, вселенная в переписке не объявлена).</strong> История «Ложный герой», тот же день, что и «Зима». Дима здесь весь текст описывается как «мужчина», без имени: «Человек подозрительно одетый в тусклую одету, и закрытым лицом». Имя раскрывается только в последней строке, изнутри его головы. Действие: ночная деревня, дом на окраине, Диму выбрасывают через окно, он приземляется у деревянных ворот и вступает в бой с вылезающим следом существом. Ход драки — он уворачивается от размашистого удара, которым существо ломает деревянный забор в щепки, пинает существо в подколенную ямку и бьёт в челюсть, когда оно приседает на колено; существо не вздрагивает, хватает его за ногу и отбрасывает так, «словно мужчина ничего не весил». Дима бьётся спиной о стену дома, слышит хруст, пытается встать и получает удар по голове: «Удар был достаточным, чтобы череп мужчины сломался, как греческий орех». При этом он не умирает и не теряет сознания — может только кряхтеть и думать. В окне того же дома видно мать, обнимающую плачущего ребёнка, и рядом с ними окровавленное тело главы семейства. Существо разворачивается и уходит в густой тёмный лес, «которой даже Луны свет не мог разверить», волоча Диму за ногу. Последняя строка — его собственная мысль: «Погеройствовал блять Дима». Сообщение 387586 состоит из одного слова — «Четвёртое».</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0050-S07", "PS-0050--chto-s-nim-stalo"], "h": "<p>Последнее по времени состояние (2025-11-21, id 387585) — Диму с проломленным черепом, живого и в сознании, рогатое существо утаскивает за ногу в лес. Что было дальше, в переписке не сказано.</p>\n<p>Порядок «Зимы» и «Ложного героя» между собой не установлен: обе написаны в один день с разницей в минуту, помечены как «Второе» и «Четвёртое», но что это за нумерация и как истории соотносятся во времени, в переписке не сказано.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0050-S08", "PS-0050--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Связь между карточкой 2024 года («игра бога») и прозаическим Димой 2025 года прямо не заявлена. Способность «кровавый палец» и черты «разговорчивый, приставучий» в прозе не появляются; отменены они или просто не использованы — не сказано.</li>\n<li>В версиях 3 и 4 (2025-11-21) вселенная в переписке не объявлена.</li>\n<li>Про версию 4 в файле отдельно зафиксировано: прямо не сказано, один ли это Дима в «Зиме» и в «Ложном герое»; совпадают имя и телосложение.</li>\n<li>Связь между Димой из «Бетонного героя» и Димой из «Зимы» / «Ложного героя» в переписке тоже не проговорена.</li>\n<li>Судьба Димы после того, как его утащили в лес, не описана.</li>\n<li>Возраст, род занятий, где живёт — не названы. Известно только, что в пятницу перед провалом рассказчика компания собиралась у него.</li>\n<li>Кто такой рассказчик «Зимы» и зачем они с Димой и Максимом находятся в халупе в десяти тысячах километров от дома — не сказано.</li>\n<li>Почему Дима оказался ночью в чужой деревне и дрался с рогатым существом — не сказано; предыстория боя в «Ложном герое» отсутствует, текст начинается с того, что его уже выбрасывают в окно.</li>\n<li>Существо и его отношение к Диме не объяснены: зачем оно тащит его в лес живым, не сказано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0050--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0050.html\">Команда Славы (персонажи игры бога)</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0050.html\">Команда Славы (персонажи игры бога)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0014.html\">игра бога</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0050--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-04-03</td>\n<td>153530–153530</td>\n<td>w0029</td>\n<td>игра бога (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-09-08</td>\n<td>362528–362531</td>\n<td>w0103</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-11-21</td>\n<td>387578–387579</td>\n<td>w0110</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-11-21</td>\n<td>387585–387586</td>\n<td>w0110</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0050-dima.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0050--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0050.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0050-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0050/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Две версии из четырёх — вся внешность Димы, единственное его появление в кадре и последнее известное состояние — держатся на записях, у которых нет статей вообще: <code>IS-0077</code> «Зима» (6 645 знаков базы), <code>PR-0096</code> «Зима» (5 516), <code>IS-0079</code> «Ложный герой» (7 111), <code>PR-0098</code> «Ложный герой» (5 878). Все четыре: статьи нет, ссылок ноль, вселенная «вне вселенной» / «неясно». Рядом с ними <code>PS-0311</code> «Рогатое существо» — 6 999 знаков базы, статьи нет. Это тот, кто ломает Диме череп и уносит его в лес; то есть у последнего кадра персонажа есть подробное описание противника и ни одной статьи, куда его можно поставить.</p>\n<p>Второе — <code>VS-0014</code> «игра бога»: 18 198 знаков базы, статьи нет. Оттуда пришла карточка 2024 года с «кровавым пальцем» и лимитом в три выстрела. Пока статьи о вселенной нет, вопрос «способность отменена или просто не использована» не с чем сверять — сравнивать не по чему.</p>\n<p>Третье, помельче: <code>PS-0292</code> «Лёха и Андрей» — статья 6 282 знака при 23 963 базы. Четверть материала о ближайшем окружении разобрана.</p>\n<h3>С чего начать</h3>\n<p>В архив идти почти не надо, всё в базе.</p>\n<p>Окно w0110, 2025-11-21: «Зима» и «Ложный герой» лежат не по отдельности, а внутри пачки из пяти текстов подряд — <code>PR-0095</code> «Клаустрофобия» (387575), <code>PR-0096</code> «Зима» (387578), <code>PR-0097</code> «Место и ты» (387581–387583), <code>PR-0098</code> «Ложный герой» (387585), <code>PR-0099</code> «Улыбка» (387587–387589). Между ними стоят одиночные слова: 387576 «Первый», 387579 «Второе», 387584 «Третье», 387586 «Четвёртое». В базе они разнесены как метки перед текстом — тогда «Зима» первая, а «Ложный герой» третий. В статье те же 387579 и 387586 прочитаны как метки после текста, и из этого сделан вывод, что порядок двух историй не установлен. Сверять одно место: кто к чему относится, маркер к предыдущему сообщению или к следующему.</p>\n<p>Там же, в соседней записи <code>PR-0097</code> «Место и ты» (20 718 знаков базы, статьи нет), по описи базы тоже есть существо, которого добивают на кухне. Одно ли оно с рогатым из <code>PS-0311</code>, нигде не проверялось — а это соседние сообщения того же дня.</p>\n<p>По вселенной для версий 3 и 4: <code>MR-0148</code> «Новая вселенная (безымянная, переработка Апостола)», 2025-09-12, окно w0104, 3 373 знака, статьи нет. Переработка шла за два месяца до пачки; вопрос, куда относить ноябрьские тексты, решается там, а не в самих текстах.</p>\n<p>В архив — только за одним: что стало с Димой после леса. Искать после 387589, окно w0110 и дальше.</p>\n<h3>Как развивалось</h3>\n<p>2024-04-03 — заявили: три строки карточки, две черты характера, способность с жёстким лимитом (три раза максимум). 2025-09-08 — забыли: в прозе нет ни черт, ни способности, сам Дима в кадр не входит ни разу, существует только в чужой памяти и в чужих поисках. 2025-11-21 — вернулись, дважды за один день с разницей в минуту: сначала он впервые появляется лично и получает всю внешность, потом дерётся врукопашную, проигрывает и его уносят. За полтора года способность не всплыла ни разу, включая сцену, где она была бы к месту.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Правило датировки названо и работает: вселенная ставится «по дате объявления», а когда объявления нет — пишется «неясно», и это проведено по всем четырём версиям. Для порядка внутри одного дня такого правила нет. Два текста разделяет минута, между ними стоят пронумерованные маркеры — но чем считать маркер, подписью к предыдущему тексту или заголовком к следующему, не проговорено ни здесь, ни где-либо ещё. Правило для одной оси упорядочивания есть, для соседней — нет.</p>\n<h3>Отклик</h3>\n<p>Сильное — ход с именем в «Ложном герое»: весь текст это «мужчина», человек в тусклой одежде с закрытым лицом, и имя выдаётся один раз, в последней строке, изнутри его же головы, когда его уже волокут за ногу. «Погеройствовал блять Дима» — и задним числом становится понятно, кого только что убивали. Зацепило ещё, что в «Зиме» на нём всё чёрное — глаза, волосы, куртка, штаны, — и всё чёрное занесено белым: иней, снег, щепки, и белые следы от двери. Персонаж, у которого цвет один, приходит с улицы весь в противоположном. И отдельно — расстояние между версиями: в 2024-м он стреляет кровью из пальца, в 2025-м получает по затылку и не может встать. Ни слова о том, что первое отменили, просто больше не понадобилось.</p></div>", "r": []}];</script>
