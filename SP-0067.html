<script>const BASE="";const DOCNAME="Магнетизм";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0067-S01", "SP-0067--mehanika"], "h": "<p>Магнетизм — способность управлять железом. Носитель — Текси. Способность объявлена Славой (2024-06-18, id 183250) сразу вместе с описанием снаряжения: способность подана не отдельно, а через набор предметов, которыми она управляет.</p>\n<p>Основа работы — инструмент: «большой железный меч ( как у берсерка)». Про него сказано, что «ему его легко контролировать пулять его и летайте на нем». То есть меч используется двояко — как метательный снаряд и как средство передвижения по воздуху. Во второй версии (2024-06-21, id 185045) та же мысль повторена: «огромные меч ( легче контролировать и легко запускать воздух  или летать на нем , самый убойный среди всех орудий)». Инструмент он «почти всегда держит воздухе».</p>\n<p>Второй канал применения — железо в одежде: «Железный перчатки и ботинки с помощью магнетизма усиливает их из-за этого удара в разы сильней».</p>\n<p>Третий канал — собственная кровь: железо, содержащееся в крови, вытягивается наружу и превращается в покрытие.</p>\n<p>К версии 2 (2024-06-21, id 185045) приёмы получили имена и оформились в список из трёх:</p>\n<p>1) <strong>Магнитная поля</strong> — «складывает пальцы круг и через них запускать нож с невероятной скоростью». В первой версии этот же приём назван «фирменный прием» и описан как «сложить пальцы круг и через него пустить нож давая ему невероятной ускорения».</p>\n<p>2) <strong>Железная кожа</strong> — «пускает себя кровь и из железа в крови, покрываеть  себя защищаясь и усиливая себя». То есть приём одновременно защитный и усиливающий.</p>\n<p>3) <strong>Грать желаза</strong> (град железа) — «запуск 10 ножей для отвлечения внимания или чтобы убить слабых противников».</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0067-S02", "SP-0067--ogranicheniya-i-cena"], "h": "<p>У магнитного поля (разгона ножа через кольцо из пальцев) минус назван сразу, в первой же версии: «он очень не меткий поэтому прием использует лишь в ближе». В версии 2 ограничение расширено — хромает не только меткость, но и контроль: «меткость хромает как и контроль из за этого использует только в ближе».</p>\n<p>У железной кожи цена — кровь: «слишком рискованно использовать на постоянной основе; большая потеря кровь».</p>\n<p>Ножи как класс оружия ограничены по эффективности относительно инструмента: 10 клинков «он использует их для отвлечения или если много слабых целей, так как скорость и убойность у них в разы меньше инструмента». Град железа во второй версии сохраняет ровно эту функцию — отвлечение и добивание слабых.</p>\n<p>Меч на поясе — отдельный предмет, не инструмент: «лёгкий и тонкие что бы им сражаться так как свой инструмент он почти всегда держит воздухе». В версии 2 он записан как «одноручный меч».</p>\n<p>Числовой профиль носителя (2024-06-21, id 185045): Сила 10, Скорость 5,5, Ловкость 6, Выносливость 8, Контроль 5. Низкий контроль согласуется с оговоркой про хромающий контроль в первом приёме, но связь между цифрой и приёмом в переписке прямо не проговорена.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0067-S03", "SP-0067--nositeli"], "h": "<p>Единственный носитель — Текси. В первой версии (2024-06-18, id 183250) персонаж ещё без имени, обозначен как «Магнетик т.п.», «Мужчина 20 лет способности магнетизм». Имя Текси появляется во второй версии (2024-06-21, id 185045).</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0067-S04", "SP-0067--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-06-18 (id 183250, окно w0038).</strong> Заявка Славы. Персонаж без имени, 20 лет. Перечислены: инструмент (большой железный меч типа берсерковского — полёт и метание), оружие (10 клинков для отвлечения и слабых целей), лёгкий тонкий меч на поясе, железные перчатки и ботинки для усиления ударов. Отдельно выделен «фирменный прием» — кольцо из пальцев и нож сквозь него, с минусом по меткости и требованием ближней дистанции. Приём с кровью на этом этапе ещё не назван.</p>\n<p><strong>Версия 2 — 2024-06-21 (id 185045, окно w0038).</strong> Полная анкета персонажа. Добавлено имя Текси, любит/не любит (яблоки, брата «как брата»; не любит толпы людей и жару), статы, черта характера («спокойный, интроверт( то бишь держит все проблемы и со мнения внутри себя), с опаская относится к людям»). Приёмы формализованы в три пронумерованных с названиями. Новым относительно версии 1 является приём «железная кожа» — железо из собственной крови. К минусу фирменного приёма добавлен провал контроля. Список оружия сокращён по формулировке до «10 ножей; одноручный меч; железный перчатки и обувь» — клинки и ножи в разных версиях названы по-разному, но количество (10) сохраняется.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0067-S05", "SP-0067--svyaz-s-drugimi-sposobnostyami"], "h": "<p>В том же обмене сообщениями, сразу после анкеты Текси, Миколай выложил анкету персонажа Катапира со способностью «повышение температуры» (2024-06-21, id 185046) — по тому же шаблону (любит/не любит, статы, оружие, приёмы, черта характера). Прямого сюжетного или механического соединения магнетизма с этой способностью в переписке не проведено; совпадает только формат подачи.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "SP-0067-S06", "SP-0067--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Не сказано, действует ли магнетизм на чужое железо — на оружие и доспехи противника. Все описанные применения касаются собственного снаряжения носителя и собственной крови.</li>\n<li>Дальность действия не названа нигде, кроме оговорки «только в ближе» для одного приёма.</li>\n<li>Не сказано, откуда способность взялась и как соотносится с общей системой появления сил.</li>\n<li>Число 10 (ножей/клинков) фиксировано, но восполняются ли они и как — в переписке не сказано.</li>\n<li>Что происходит с железной кожей при исчерпании крови и есть ли предел количества применений — осталось нерешённым.</li>\n<li>Стат «Контроль 5» не расшифрован: относится ли он к контролю над железом или к общему самоконтролю — в переписке не сказано.</li>\n<li>Версии 3 нет; после 2024-06-21 способность в материале не возвращается.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["SP-0067--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-06-18</td>\n<td>183250–183250</td>\n<td>w0038</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-06-21</td>\n<td>185045–185046</td>\n<td>w0038</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0067-magnetizm.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0067--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0067.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
