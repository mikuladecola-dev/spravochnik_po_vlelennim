<script>const BASE="";const DOCNAME="Вселенная апостолов";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0125-S01", "MR-0125--ustroystvo"], "h": "<p>Под этим названием в переписке фигурирует не отдельная локация, а общая вселенная соавторов целиком — та, что называется по своим ключевым персонажам, апостолам. Единственное окно, где она обсуждается под этим именем (2025-03-25, окно w0085), посвящено её закрытию, поэтому устройство мира здесь не описывается: разговор идёт о статусе вселенной как проекта, а не о её содержании.</p>\n<p>Признаки, которыми вселенная охарактеризована при прощании (id 310843–310891):</p>\n<ul>\n<li>«Это вселенная (апостолов ) была хорошая»;</li>\n<li>«Была самой целестной»;</li>\n<li>«Для меня апостолы были самой сбалансированный истории» (Слава, id 310874);</li>\n<li>«но она была в принципе сильная» (Миколай, id 310891).</li>\n</ul>\n<p>Распределение работы над ней зафиксировано Миколаем прямо: «ты развивал её по большей части» (id 310890).</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0125-S02", "MR-0125--naselenie"], "h": "<p>Из состава вселенной в окне названы только две категории — персонажи и артефакты апостолов, и обе упомянуты в контексте возможного переноса, а не описания: «Ну перс и артефакты. Возможно останутся. Хотя не факт» (Слава, id 310901). Перечня персонажей и артефактов в этом окне нет.</p>", "r": []}, {"t": "Место во вселенной — как связан с другими мирами", "a": ["S03", "MR-0125-S03", "MR-0125--mesto-vo-vselennoy"], "h": "<p>В этом окне вселенная апостолов соотносится не с другими мирами внутри себя, а с ещё не созданной новой вселенной Славы. Соотношение задано так:</p>\n<ul>\n<li>Действующей она остаётся до появления новой: «Конечно пока мы будем придерживаться еë. Пока я не создам новую» (id 310847).</li>\n<li>Из неё в новую вселенную, возможно, перейдут персонажи и артефакты апостолов — «Возможно останутся. Хотя не факт» (id 310901).</li>\n<li>Новая вселенная может оказаться устроена принципиально иначе: «Возможно я создам вселенную вообще без сил» (id 310901).</li>\n</ul>\n<p>Позже в тот же день Слава сообщил, что перенос уже произошёл у него в голове: «Сука первая что я сделал в голове это перенёс апостолов и уже придумал им логическая объяснения. Даже не до конца придумав мир» (2025-03-25, id 311180). Само «логическое объяснение» в переписке не приведено.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0125-S04", "MR-0125--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-03-25, id 310843–310913. Объявление о закрытии.</strong></p>\n<p>Слава начал с «Пора прощаться» и изложил статус: вселенная была хорошей и самой целостной, «Но для меня она исчерпала себя», «Ну ей уже можно сказать пока», «Так как дальше я еë развивать не буду». При этом придерживаться её решено до создания новой.</p>\n<p>Реакция Миколая: «я уве понял что апостолов вселенная», «ей пиздец» (id 310867–310869). Слава уточнил: «Пока что нет. Но новая вселенная уже придумается. Так что ей возможно не долго» (id 310872).</p>\n<p>На просьбу «Скажи пару слов» Миколай ответил, что не ожидал такого исхода: «мне казалось мы прямо жёстко будем её развивать», «ваще не думал что она умрёт» (id 310880–310883). Слава: «Я не могу. Для меня она всё больше не как» (id 310886). Итоговая позиция Миколая: «надо развиваться», «и если идея себя исчерпала», «то почему бы не перейти на другую», «я не буду держаться особенно если для тебя она всё», «это нормально» (id 310895–310900).</p>\n<p>Здесь же Миколай сообщил о собственном состоянии по своей начатой работе: «возможно мне придётся насильно писать», «ибо мне тоже немного настоебенило», «эта идея которую я начал крутая», «но как-то», «хз как работу продолжать», «но», «я все равно напишу», «её», «уже» (id 310905–310913). О какой именно идее речь, в окне не названо.</p>\n<p><strong>Версия 2 — 2025-03-25, id 311180–311181. Повтор прежней мысли о переносе.</strong></p>\n<p>Через несколько часов Слава зафиксировал, что апостолы уже мысленно перенесены в новый, ещё не достроенный мир, и им придумано логическое объяснение: «Даже не до конца придумав мир». Далее — «Какой же я гений».</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0125-S05", "MR-0125--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Что именно за «логическое объяснение» апостолам в новом мире — в окне не раскрыто.</li>\n<li>Состав наследства не определён: перейдут ли персонажи и артефакты апостолов в новую вселенную, оставлено открытым самим Славой («Возможно останутся. Хотя не факт»).</li>\n<li>Будет ли новая вселенная «вообще без сил» — названо как возможность, решения в переписке нет.</li>\n<li>Что конкретно в вселенной апостолов «исчерпало себя» — не разобрано, названо только ощущение Славы.</li>\n<li>Какую свою идею Миколай собирался «насильно писать» — в этом окне не названо.</li>\n<li>Устройство самой вселенной апостолов в данном окне не излагается: разговор целиком о её статусе.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0125--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0001.html\">Апостолы (организация апостолов, «благословенные Богом»)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0125--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-03-25</td>\n<td>310843–310913</td>\n<td>w0085</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-25</td>\n<td>311180–311181</td>\n<td>w0085</td>\n<td>Апостол (объявлено)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0125-vselennaya-apostolov.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0125--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0125.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["MR-0125-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/MR-0125/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Чинить первым надо не устройство вселенной (в этом окне его и нет), а её состав — потому что именно на состав статья и упирается: «Ну перс и артефакты. Возможно останутся».</p>\n<p>Самое дорогое — <code>SL-0054</code> «Список 12 апостолов»: 3 ссылки, статьи нет, 234 052 знака в базе. Это крупнейшая запись во всём соседстве, и она про тех самых персонажей, чья судьба здесь оставлена под «возможно». Следом <code>SL-0053</code> «Список персонажей вселенной» (6 ссылок, статьи нет, 20 313) и <code>SL-0051</code> «Каталог: благословенные, враги, грехи, оружие, артефакты» (6 ссылок, статьи нет, 9 834). Ниже — <code>SL-0090</code> (4 ссылки, 5 492) и <code>SL-0089</code> «Список категорий сил» (4 ссылки, 1 753), тоже без статей.</p>\n<p>Пять служебных перечней, на которые в сумме двадцать три ссылки, и ни у одного нет статьи. Это и есть узел: вселенная закрыта, а её опись не составлена.</p>\n<p>Для контраста — <code>SP-0212</code> «артефакты апостолов»: статья есть, но в ней 2 931 знак при 2 060 в базе. То есть на вопрос «что за артефакты возможно перейдут» отвечать нечем, и дело не в том, что статью не написали, а в том, что материала в этой записи нет — он в перечнях.</p>\n<h3>С чего начать</h3>\n<p>В базе. <code>SL-0054</code> первым: 234 тысячи знаков про апостолов — если состав вселенной где-то зафиксирован, то там. Дальше <code>SL-0053</code> и <code>SL-0051</code>.</p>\n<p>По новой вселенной, в которую апостолы «уже перенесены в голове»: <code>ID-0152</code> «новая вселенная Славы» (1 797 знаков, статьи нет), <code>MR-0148</code> «Новая вселенная (безымянная, переработка „Апостола“)» (3 372, статьи нет), <code>MR-0152</code> «новая вселенная (безымянная, „Разрушаем вселенную“)» (11 386, статьи нет). Три записи про одно и то же событие, ни одной статьи — прежде чем искать в архиве, надо понять, не одна ли это вселенная под тремя именами.</p>\n<p>В архив — за двумя вещами. Первое: за «логическим объяснением», которое Слава придумал апостолам в новом мире (2025-03-25, id 311180) — само объяснение в переписке не приведено; искать после id 311181, в ближайшие дни после 25 марта. Второе: за идеей, которую Миколай собирался «насильно писать» (id 310905–310913) — она не названа, и без неё непонятно, в какой вселенной он тогда работал.</p>\n<h3>Как развивалось</h3>\n<p>Всё уложилось в одни сутки, 2025-03-25. Утро — заявлено закрытие: «Пора прощаться», «Но для меня она исчерпала себя». Тут же ограничено: придерживаемся до появления новой, наследство поставлено под «Возможно останутся. Хотя не факт». Через несколько часов — возврат, но не к вселенной, а к переносу: апостолы уже унесены в мир, который ещё не придуман (id 311180). В этих окнах дальше ничего.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для своей части Слава правило назвал: «дальше я её развивать не буду», «пока мы будем придерживаться еë». Для работы Миколая, объявленной в том же окне и в тех же минутах — «эта идея которую я начал крутая», «я все равно напишу её», — такого же рода правила нет. Пишется ли эта вещь внутри закрываемой вселенной, переезжает ли в новую или стоит вне обеих, не сказано ни им, ни Славой. Место есть, вопрос не задан.</p>\n<h3>Отклик</h3>\n<p>Зацепил обмен «ваще не думал что она умрёт» — «Я не могу. Для меня она всё больше не как». Это редкое место, где переписка не про мир, а про то, как мир кончается, и кончается он не событием внутри, а тем, что одному из двоих стало никак. Ответ Миколая — «надо развиваться», «я не буду держаться», «это нормально» — звучит как человек, который уговаривает не столько соавтора, сколько себя. И через несколько часов: «Сука первая что я сделал в голове это перенёс апостолов». Похороны не продержались до вечера, и в этом больше правды про то, как работает совместное сочинение, чем в любом описании устройства. Статья честно фиксирует, что под именем целой вселенной лежит одно окно про её закрытие — и это само по себе диагноз материала: фиксация шла по разговору, а не по миру.</p></div>", "r": []}];</script>
