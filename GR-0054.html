<script>const BASE="";const DOCNAME="Раса-помощник («другая раса»)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0054-S01", "GR-0054--chto-eto"], "h": "<p>Раса, помогающая людям, упомянутая Славой при объявлении scp-концепции вселенной «игра бога» (2024-04-02, id 152594). В переписке она названа одной строкой — «И другую расу которая будет нам помогать» — и на этом разработка закончилась.</p>\n<p>Собственного имени у расы нет. «Раса-помощник» — имя, данное в базе; в чате звучало только «другая раса».</p>\n<p>Формально это заявленное во вселенной сообщество (раса, то есть множество существ), а не объединение отдельных персонажей: ни одного её представителя авторы не назвали, и как группы с составом и внутренним устройством она не существует. Всё, что о ней известно, помещается в одну строку сообщения 152594.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S02", "GR-0054-S02", "GR-0054--otnosheniya-s-drugimi-gruppami"], "h": "<p>Раса упомянута как один из элементов scp-концепции (<a href=\"MR-0007.html\">Концепция scp / охота на аномалий</a>). Слава перечислил, что «вбухивается» в эту концепцию, единым списком (2024-04-02, id 152594):</p>\n<div class=\"q\"><p>«Лучшей будет создать концепцию scp только вбухать туда и сверхсила типо петли и закона, и экспериментах на людях<br>И другую расу которая будет нам помогать<br>Вообще концепция охота на аномалий»</p></div>\n<p>То есть раса стоит в одном ряду со сверхсилами «петля» и «закон» и с экспериментами на людях, внутри общей рамки «охота на аномалий».</p>\n<p>Кому именно раса помогает, в переписке сказано только словом «нам». Отношение расы к организации, ловящей обнаглевших существ (она в базе связана с той же концепцией), в переписке не проговорено.</p>", "r": [["Концепция scp / охота на аномалий", "MR-0007.html"]]}, {"t": "Как менялась — по датам", "a": ["S03", "GR-0054-S03", "GR-0054--kak-menyalas"], "h": "<p><strong>2024-04-02, id 152590–152605 (окно w0029).</strong> Единственное появление. Раса возникает внутри второго захода Славы на концепцию вселенной. Первый вариант, который он тут же отвергает, — «организация которая борется с злом то бишь добро и зло», про него сказано: «но сейчас думая мне как то не нравится». Вместо него предлагается scp-концепция, и в её составе — «другая раса которая будет нам помогать».</p>\n<p>Миколай на предложение отвечает не разбором, а просьбой уточнить (id 152599): «Ну ммм, эмм. Тут не совсем опять пон. Ты точно чет хочешь добавить у Поротая как по мне и так много способностей, а концепцию ты придумал, в чем вопрос не пон». Он просит время («мне прям штурмануть на часика 3 надо мозг») и рамки по срочности. Раса при этом не обсуждается ни одним из авторов.</p>\n<p>Слава уточняет задачу (id 152603): «Концепцию та я придумал ну ты можешь туда что нибудь добавить типо объект или вид или способность или т.д». Предложение добавить «вид» к расе прямо не привязано — это общее приглашение дополнить концепцию.</p>\n<p>По пометке в базе концепция снесена в тот же вечер; в приведённых кусках переписки момент отказа не показан.</p>", "r": []}, {"t": "Пробелы", "a": ["S04", "GR-0054-S04", "GR-0054--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет. Ни один представитель расы не назван, участников у группы нет.</li>\n<li>Кто эта раса — не сказано.</li>\n<li>Чем именно она помогает — не сказано. Есть только «будет нам помогать».</li>\n<li>Кому помогает: в переписке только «нам», кто входит в это «нам», не расшифровано.</li>\n<li>Способностей расы, отличий её представителей друг от друга и внутренней иерархии в переписке нет вообще.</li>\n<li>Собственного имени нет; «Раса-помощник» — служебное имя базы.</li>\n<li>Связь с организацией, ловящей обнаглевших существ, и с прочими элементами scp-концепции (петля, закон, эксперименты на людях) не проговорена — они просто перечислены рядом в одном сообщении.</li>\n<li>Возвращались ли авторы к идее позже — по прочитанным материалам не видно; единственное окно w0029, дальнейшей разработки нет.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0054--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0007.html\">Концепция scp / охота на аномалий</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0054--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0054.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0054-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0054/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Прямо по этой статье чинить нужно <code>ID-0040</code> («Раса-помощник»): две входящие ссылки, статьи нет, база 3,4 КБ. У самой <code>GR-0054</code> база нулевая при 5,9 КБ текста — то есть статья о расе написана поверх пересказа, а дословный материал висит в записи без статьи. Дыра маленькая, но она ровно под ногами.</p>\n<p>Дороже по вселенной «игра бога» — три записи без статей, на каждую по три входящие ссылки: <code>ID-0050</code> («Провидец», база 14,5 КБ — самый крупный непокрытый кусок этой вселенной), <code>ID-0041</code> («Турнир», 4,2 КБ), <code>ID-0039</code> («Агенты, берущие силу от животных», 1,9 КБ). Последняя ближе всего к делу: она про существ, берущих силу извне, то есть про ту же зону, где должна была бы стоять раса-помощник, — и её тоже нет.</p>\n<p>Каркас концепции при этом собран: <code>MR-0007</code> — четыре входящие ссылки и статья, <code>MR-0006</code> — четыре, <code>SP-0051</code> (Петля), <code>PS-0031</code> (Закон, 15,9 КБ базы) — всё на месте. Из четырёх элементов, перечисленных Славой в одном сообщении, три разработаны, четвёртый — раса — не сдвинулся ни на слово. Это единственная пустая клетка в списке.</p>\n<h3>С чего начать</h3>\n<p>В базе, и близко. <code>ID-0040</code> — там сама строка 152594 и её окружение. Дальше <code>MR-0007</code> (4,5 КБ базы) и <code>MR-0006</code> (7,1 КБ): раса заявлена как часть первой и молча заменяет вторую, и вопрос «отменена ли организация» лежит между этими двумя записями, а не здесь. Ещё <code>GR-0053</code> («Организация, ловящая обнаглевших существ»): статья 18,5 КБ, база 0 — то же расхождение, что и у этой записи, и обе группы описывают одну концепцию с разных сторон.</p>\n<p>В архив — за одним конкретным моментом. По пометке в базе концепция снесена в тот же вечер, но самого отказа в приведённых кусках нет. Окно w0029, 2024-04-02, разобрано по диапазону 152590–152605; смотреть надо дальше — вечер 2 апреля 2024, id после 152605, и начало следующего дня. Там же, вероятно, единственный шанс узнать, была ли раса упомянута ещё раз перед сносом.</p>\n<h3>Как развивалось</h3>\n<p>Всё уместилось в один день, 2024-04-02. Слава сначала снимает собственную предыдущую рамку — «но сейчас думая мне как то не нравится», — и тут же заявляет новую четырьмя пунктами, где раса стоит последней строкой. Ограничение приходит сразу и с неожиданной стороны: Слава сам сужает свою роль до рамки и отдаёт наполнение соавтору — «Концепцию та я придумал ну ты можешь туда что нибудь добавить типо объект или вид или способность». Миколай на это отвечает не содержанием, а запросом рамок и сроков: «мне прям штурмануть на часика 3 надо мозг», «напиши как по срочности». Расу не обсуждает ни один из двоих. К вечеру концепция снесена целиком. Возврата нет.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Слава прямо называет единицы, которыми в эту концепцию можно что-то добавлять: «объект или вид или способность или т.д». Для сверхсил правило встраивания тоже названо, пусть и грубо, — петля и закон «вбухиваются» туда как уже готовые, перенос из старого материала. Для расы, заявленной в том же сообщении, ни того, ни другого: не сказано, «вид» ли она в смысле того же перечня — то есть та же единица, которую предлагается заводить, — или это что-то другого порядка, часть рамки, а не наполнения. Список единиц есть, место расы в этом списке не названо.</p>\n<h3>Отклик</h3>\n<p>Тут интереснее не раса, а как она произнесена. «И другую расу которая будет нам помогать» — и это «нам» ни разу никто не переспросил. Кому помогает: людям в мире, организации, или буквально двум авторам, которые эту вселенную ведут? Из строки не выбрать, и в статье это зафиксировано аккуратно, без домысливания, — правильно. Целый народ заведён в мир как служебная деталь для удобства рассказчиков, одной строкой в перечне рядом с экспериментами на людях. Мне это показалось самым живым во всей записи: видно момент, когда мир ещё не отделился от тех, кто его пишет. А следующая сцена — Миколай отвечает не на концепцию, а «в чем вопрос не пон» и просит рамочки по срочности — стоит рядом почти комично: один вбухивает целую расу, второй пытается понять, что от него хотят к какому числу.</p></div>", "r": []}];</script>
