<script>const BASE="";const DOCNAME="Алчность";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0159-S01", "SP-0159--mehanika"], "h": "<p>Алчность — один из Семи грехов. Её содержание менялось: у соавторов было два разных варианта, и в итоговый каталог попал третий, короткий.</p>\n<p><strong>Вариант Миколая (2024-12-24, id 273904–273908).</strong> Алчность — воровство: «естественно: воровство, конкретно вещей, любых, можно с нескольких вещей одновременно и даже больших, они хранятся в пространстве». То есть предмет забирается и помещается в пространственное хранилище, ограничений по количеству и размеру не поставлено. К этому добавлена вторая часть: «также возможность совершить сделку с дьяволом».</p>\n<p><strong>Вариант Славы (2024-12-24, id 273920).</strong> Алчность — поглощение: «Я думал больше о способности поглощений чужой манный или объектов».</p>\n<p><strong>Каталожная формулировка (2025-01-24, id 284278).</strong> В сводном списке способность записана как «Алчность ♾(всё моей)». Поглощение в этом же списке закреплено не за Алчностью, а за Чревоугодием: «Чероугодия ◼️( поглощения)».</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0159-S02", "SP-0159--ogranicheniya-i-cena"], "h": "<p><strong>Проклятье (вариант Миколая, id 273906).</strong> «проклятье: ты не можешь ничего отдать кому либо». Проклятья — общая часть его схемы грехов: у Гнева, например, тоже названо своё проклятье. Что именно проклятье запрещает — только предметы или что-то шире — не уточнялось.</p>\n<p><strong>Общее правило греха.</strong> Миколай отдельно оговорил (2024-12-24, id 273917), что базовые свойства в грехи заложены самой их природой: «но в грехах это базовое подразумевается, такова природа греха».</p>\n<p><strong>Уровень силы.</strong> В сводке от 2025-01-23 (id 284175) о Семи грехах и божестве сказано: «Будет слабей главы этой организации но сильней благословенного».</p>\n<p>К каталожной формулировке «всё моей» ограничений не приложено.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0159-S03", "SP-0159--nositeli"], "h": "<p>Отдельный персонаж-носитель Алчности в переписке не назван. Алчность существует как позиция в списке Семи грехов рядом с Гневом, Похотью, Завистью, Гордыней, Чревоугодием и Ленью.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0159-S04", "SP-0159--kak-menyalas-po-versiyam"], "h": "<p><strong>2024-12-24 (id 273904–273908), окно w0068.</strong> Миколай пишет разбор всех семи грехов подряд и даёт Алчности воровство вещей с хранением в пространстве плюс сделку с дьяволом, плюс проклятье «ты не можешь ничего отдать кому либо». Вселенная на эту дату по объявлению неясна.</p>\n<p><strong>2024-12-24 (id 273920), окно w0068.</strong> Слава отвечает своим набором по тем же семи грехам. По Алчности: «Я думал больше о способности поглощений чужой манный или объектов».</p>\n<p><strong>2024-12-25 (id 274462–274464), окно w0068.</strong> Миколай сравнивает два варианта. Оценка варианта Славы: «нуу думаю это получше, но мне понравилась идея со сделкой в дьявола». Дальше он объясняет, почему сам поставил воровство: «согл звучит уместнее, просто было воровство, а я повторятся не хотел, если убрать, но очень хорошо подходит, я тоже хотел». То есть воровство стояло у него как способ не повторяться, а поглощение он и сам считал подходящим.</p>\n<p><strong>2025-01-23 (id 284175–284176), окно w0072.</strong> Слава повторяет свой список из декабря дословно, в том же виде — Алчность снова «поглощений чужой манный или объектов». На эту дату вселенная объявлена как Апостол.</p>\n<p><strong>2025-01-24 (id 284278–284279), окно w0072.</strong> В большом каталоге благословенных, врагов и Семи грехов Алчность записана как «Алчность ♾(всё моей)», а поглощение уже стоит у Чревоугодия. В этом же сообщении в конце записан отдельный список идей: «Чёрный ящик, озеро перерождения, корень желаний».</p>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S05", "SP-0159-S05", "SP-0159--otklonennye-varianty"], "h": "<p><strong>Воровство вещей с хранением в пространстве</strong> (Миколай, id 273906). Отклонено самим автором в пользу варианта Славы: «звучит уместнее». Причина, по которой воровство ставилось изначально, названа: «просто было воровство, а я повторятся не хотел».</p>\n<p><strong>Сделка с дьяволом</strong> (Миколай, id 273906). Прямо не отклонена и прямо не принята. Миколай отметил, что ему жалко её терять: «мне понравилась идея со сделкой в дьявола» (id 274462). В каталог 2025-01-24 она не вошла. Что с ней стало — в переписке не сказано.</p>\n<p><strong>Поглощение чужой маны или объектов</strong> (Слава, id 273920, повторено id 284176). Одобрено Миколаем как лучший вариант, но к каталогу 2025-01-24 ушло от Алчности к Чревоугодию.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S06", "SP-0159-S06", "SP-0159--svyaz-s-drugimi-sposobnostyami"], "h": "<p><strong>Семь грехов</strong> — набор, частью которого является Алчность. В каталоге 2025-01-24 весь набор выглядит так: Гнев (сила), Похоть (контроль разума), Зависть (полное копирование), Алчность (всё моё), Гордыня, Чревоугодие (поглощение), Лень (контроль территории).</p>\n<p><strong>Чревоугодие</strong> — грех, к которому в итоге перешло поглощение. Оба варианта Чревоугодия описывал Миколай (id 273906): как одна способность — «способность всё хавать или поглощать, в том числе магию которая меньше облака заклинания, даже чужая магия. это благословение, ибо влияние, а не создание»; как набор — «поглощение чужих навыков, но не себе. он их поглощает и они исчезают». Слава на это ответил коротко: «Чревоугодие ок». Таким образом, поглощение и у Алчности, и у Чревоугодия обсуждалось параллельно, и в каталоге закрепилось за Чревоугодием.</p>\n<p><strong>Поглощение</strong> — способность, вокруг которой шёл спор о том, за каким грехом её закрепить.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "SP-0159-S07", "SP-0159--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Что конкретно означает каталожная формулировка «всё моей» — не раскрыто.</li>\n<li>Не сказано, отменяет ли каталожная формулировка вариант с поглощением или переформулирует его.</li>\n<li>Судьба сделки с дьяволом не решена: идея названа понравившейся, но в каталог не вошла и больше не обсуждалась.</li>\n<li>Не сказано, сохраняется ли проклятье «ты не можешь ничего отдать кому либо» после отказа от варианта с воровством.</li>\n<li>Носитель Алчности не назван.</li>\n<li>Вселенная для версий 1–3 (2024-12-24 и 2024-12-25) по дате объявления неясна; для версий 4–5 — Апостол.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0159--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0002.html\">Семь грехов</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0002.html\">Семь грехов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0159--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-12-24</td>\n<td>273904–273908</td>\n<td>w0068</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-24</td>\n<td>273917–273921</td>\n<td>w0068</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-25</td>\n<td>274461–274464</td>\n<td>w0068</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-23</td>\n<td>284175–284177</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-24</td>\n<td>284278–284279</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0159-alchnost.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0159--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0159.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["SP-0159-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/SP-0159/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первое — Чревоугодие. Поглощение, вокруг которого весь сюжет этой статьи, ушло к нему, а само Чревоугодие в базе лежит в трёх местах: <code>SP-0158</code> «Чревоугодие» — 7 117 знаков, статьи нет, вселенная «неясно», ссылок ноль; <code>PS-0189</code> «Чревоугодие» — 4 175 базы, статья есть, три ссылки; <code>SP-0170</code> «Поглощение» — 4 094, статья, одна ссылка. Пока эти три не сведены, вопрос «отменяет ли „всё моей“ поглощение или переформулирует его» не решается ни в одной из статей: половина материала о поглощении сидит в записи без статьи и без вселенной.</p>\n<p>Второе — весь декабрьский слой семи грехов. <code>SP-0156</code> «Семь грехов (магия по грехам)» — 11 757, <code>SP-0157</code> Похоть — 7 256, <code>SP-0158</code> — 7 117, <code>SP-0160</code> Лень — 8 291, <code>SP-0161</code> Зависть — 8 056, <code>SP-0162</code> Гордыня — 7 454. Около 50 тысяч знаков, все без статей, у всех вселенная «неясно». У тех же грехов есть вторые записи со статьями и втрое меньшей базой: <code>PS-0188</code> (4 054), <code>PS-0189</code> (4 175), <code>PS-0190</code> (4 125), <code>PS-0191</code> (4 062); отдельно <code>PS-0177</code> Гнев (11 005). Алчность — единственная из семи, у кого декабрьский и январский слои сведены в одной записи. То есть чинить надо не эту статью, а шесть соседних по её образцу.</p>\n<h3>С чего начать</h3>\n<p>В базе. <code>SP-0156</code> и <code>SP-0158</code> — там декабрьский разбор 273904–273921 целиком, включая проклятья по всем грехам и правило «в грехах это базовое подразумевается»; сверять надо с ними, а не с архивом. Январская сторона — <code>PS-0189</code> и <code>SP-0170</code>.</p>\n<p>В архив — за сделкой с дьяволом. Она названа один раз (273906) и один раз помянута с сожалением (274462), в каталог не вошла и больше нигде не встречается. Смотреть два окна: w0068, 2024-12-24–25, правее 274464, и w0072, 2025-01-23–24, вокруг 284175–284279. Ориентир: сделка — единственный пункт схемы Миколая, завязанный не на способность, а на самого дьявола, поэтому искать её надо не в списках грехов, а там, где обсуждают дьявола и его благословенных (<code>ID-0143</code>, 3 149 базы, статьи нет).</p>\n<h3>Как развивалось</h3>\n<p>2024-12-24 — заявили: воровство любых вещей с хранением в пространстве, плюс сделка с дьяволом; тут же ограничили проклятьем «ты не можешь ничего отдать кому либо». В тот же день Слава даёт свой вариант — поглощение. 2024-12-25 — автор отказывается от собственного варианта в пользу чужого и называет причину, по которой ставил воровство. Дальше месяц молчания. 2025-01-23 — Слава повторяет декабрьский список дословно, без единого изменения. 2025-01-24 — в каталоге стоит третья формула, «всё моей», которой до этого не было ни у кого, а согласованное поглощение переехало к соседнему греху. Заявили — ограничили — отменили сами — повторили старое — заменили на третье.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>В каталоге 2025-01-24 у трёх грехов предел вписан прямо в формулу: Похоть — «контроль разума с ограничением», Гордыня — «Слово закон с ограничением», Зависть — «полной копирование сил, магии, одежды, внешность но не характера». У Алчности стоит «всё моей», у Гнева — «сила»: ни ограничителя, ни оговорки. Общее правило Миколая («но в грехах это базовое подразумевается, такова природа греха») объясняет, откуда у греха берётся способность, но не откуда берётся её граница. Для трёх грехов граница названа в самой строке, для этих двух правила того же рода нет.</p>\n<h3>Отклик</h3>\n<p>Зацепила одна реплика: «просто было воровство, а я повторятся не хотел». Способность выбрана не из природы греха, а из соображения композиции — чтобы не совпало с чем-то соседним; и тут же признание, что чужой вариант и был тем, чего хотелось самому. Это редкий момент, когда виден не мир, а рука, которая его раскладывает: семь грехов сочиняются подряд, одним заходом, и главная забота — чтобы не было двух одинаковых. А потом всё равно оказывается два одинаковых, и поглощение месяц кочует между Алчностью и Чревоугодием, пока не осядет не там, где его обсуждали. И «всё моей» в итоге — три слова, которые шире и воровства, и поглощения, вместе взятых; похоже, формула появилась не как решение спора, а как способ его не вести.</p></div>", "r": []}];</script>
