<script>const BASE="";const DOCNAME="Ваёль";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0093-S01", "PS-0093--proishozhdenie"], "h": "<p>Персонаж появился 7 июня 2024 года в одном разговоре (2024-06-07, id 176705–176765, окно w0036). Разговор начался с рисунка Миколая, который он прислал Славе на оценку, и перешёл к тексту истории, выложенной на канале Миколая. На вопрос Славы «История которая на твоём канале» (176750) Миколай отвечает «Да» (176751).</p>\n<p>Сюжет истории заимствован: «Продолжение и видео от куда я полностью всю идею спиздил» (176757), «Ну вот, история основана на его сюжете» (176765). Само видео и ссылка «| Вдохновение» в переписке не раскрываются — Слава говорит про него «Вдохновение твой / Видел / Не смотрел» (176761–176763).</p>\n<p>Персонаж носит несколько имён: в тексте истории он называется Ваёлем, Потасом и Тосычем, в разговоре о рисунке — «дядя Тосыч» (176709), в переписке с Викой он подписан ником «юзер764» (176753).</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0093-S02", "PS-0093--vneshnost"], "h": "<p>Известна по рисунку Миколая, нарисованному, по его собственным словам, «на отъебись» и «овалами пытался поймать наугад» (176717, 176719).</p>\n<p>Слава отметил асимметрию головы — «Симметрия головы улетел далеко» (176708), на что Миколай ответил «Это же дядя Тосыч» (176709), то есть отнёс асимметрию к самому персонажу, а не к ошибке рисунка. О пропорциях: «И чё он такой длинный» (176714) — Миколай объяснил перспективой: «нуу, то перспектива такая» (176715). Перспектива сверху (176724), при этом Слава указал, что «башка и плечи должны быть больше если перспектива сверху» (176718). О лице Слава сказал: «Морда нормальная у челика» (176729).</p>\n<p>Отдельно назван цвет волос: «Вообще чел с фиолетовыми волосами смотрит в тёмной комнате в экран телефона на фотку» (176748) — этим Миколай объяснил покрас работы (176749).</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0093-S03", "PS-0093--harakter"], "h": "<p>Прямых характеристик в переписке нет; поведение описано через действия.</p>\n<p>Ваёль сидит в группе, где обсуждают музыку, и хорошо знает многих участников, причём знает их через музыку: «та музыка которую они слушают подтверждает их характер» (176753).</p>\n<p>Он заметил состояние Вики и решил вмешаться: «Однако, Потас заметив её чувства решил поддержать» (176753). При этом он скрыл, кто он: «Она не знала, что с ней общается кумир. Ваёль записал себя как юзер764» (176753). Он смог её успокоить: «Вике было грустно, но всё-таки Ваёль смог её успокоить» (176753).</p>\n<p>В сцене продолжения истории он действует как мучитель: «Он её заставил на себе вырезать число для начала, а дальше он всячески ещё над ней издевался, чтобы показать людям» (176738).</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0093-S04", "PS-0093--svyazi-s-drugimi"], "h": "<p><strong>Вика (<a href=\"PS-0094.html\">Вика</a>)</strong> — единственная названная связь. Вика — его слушательница; из примерно шести фанатов только она «в каждой подборке оставляет его творчество, ведь его тематика всегда верно передаёт её вайб» (176753). Он написал ей в личку под ником юзер764. «Они общаются целую неделю и за это время очень сблизились» (176753).</p>\n<p>Внутри текста истории названо, что «Тосыч узнал с кем имеет дело и был удивлён, и интересовался почему именно с ним он решил общаться» (176753) — в этом месте истории Тосыч и Ваёль выступают как две стороны разговора; является ли это одним лицом, в переписке не разъяснено.</p>\n<p>Аудитория: «у него в планах было познакомиться с фанатом его музыки. Их там не так уж и много, около 6. Но, большинство выделяют для его творчества отдельный плейлист» (176753).</p>", "r": [["Вика", "PS-0094.html"]]}, {"t": "Как менялся", "a": ["S05", "PS-0093-S05", "PS-0093--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2024-06-07 (id 176705–176749).</strong> Персонаж существует как фигура на рисунке, «дядя Тосыч». Обсуждается только изображение: пропорции, перспектива, лицо, покрас. Здесь же названа сцена, в которой он участвует: он заставил женщину вырезать на себе число лезвием, лезвие лежит на столе рядом (176734), и дальше издевался над ней, «чтобы показать людям» (176738). Миколай хотел передать глубину надрезов, но, по его оценке, не вышло (176740–176741); Слава предложил «Ты б хотя бы красным покрасил или что типо кровь течет ( в цветной версий)» (176737), Миколай ответил «Хорошие мысли» (176739).</p>\n<p><strong>Версия 2 — 2024-06-07 (id 176744–176766).</strong> Тем же вечером выложен текст начала истории (176753), где персонаж — музыкант из музыкальной группы-чата, знакомящийся с фанаткой под чужим ником. Сцена с лезвием оказывается частью продолжения, которое выложено отдельно: «Внимание!! Ниже представлено продолжение истории с Тосычем и Ваёлем, а так же материал для вдохновения. У этих работ довольно-таки жуткое содержание: | Продолжение | Вдохновение» (176756).</p>\n<p>Первая версия не отменена второй: рисунок и текст относятся к одной истории, но описывают разные её точки.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S06", "PS-0093-S06", "PS-0093--chto-s-nim-stalo"], "h": "<p>Выложенное начало истории обрывается на фразе «И всё бы было так вкусно сладко и приторно, пока Ваёль не предложил..» (176753). Что именно он предложил, в переписке не сказано — на этом месте текст переходит к подборке композиций Ваёля, которые слушает Вика: «прежде чем узнать, что он предложил, предложу ознакомиться с тем какие примерно композиции Ваёля слушает Вика, чтобы понять, какой до сих пор вайб сохраняется в её жизни. Тобиж, для ознакомительных целей» (176753).</p>\n<p>Продолжение существует, но в переписке дано только ссылкой-заголовком «| Продолжение» (176756). Из версии 1 известна одна сцена продолжения — с вырезанным лезвием числом.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0093-S07", "PS-0093--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Одно ли лицо Ваёль, Потас и Тосыч — из чата прямо не следует, хотя имена в тексте истории чередуются.</li>\n<li>Не сказано прямо, что человек с фиолетовыми волосами, смотрящий в тёмной комнате на фотку, — это Ваёль/Тосыч.</li>\n<li>Что именно предложил Ваёль, в переписке не названо.</li>\n<li>Не названо, что за число вырезано на женщине и что оно значит.</li>\n<li>Не сказано, кому и зачем он «показывал людям» (176738) результат.</li>\n<li>Название и содержание видео-источника («Вдохновение») в переписке не приведены.</li>\n<li>Музыка Ваёля упомянута как существующая (плейлисты, подборки), но что это за композиции — не перечислено.</li>\n<li>Возраст, внешность и другие данные о персонаже вне рисунка не обсуждались.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0093--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0094.html\">Вика</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0094.html\">Вика</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0007.html\">Новый мир</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0093--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-06-07</td>\n<td>176705–176749</td>\n<td>w0036</td>\n<td>Новый мир (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-06-07</td>\n<td>176744–176766</td>\n<td>w0036</td>\n<td>Новый мир (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0093-vael.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0093--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0093.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
