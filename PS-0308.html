<script>const BASE="";const DOCNAME="Виктор";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0308-S01", "PS-0308--proishozhdenie"], "h": "<p>Виктор введён в общем перечне рас и организаций вселенной Оам (2025-11-17, id 385768) сначала безымянно — через паладинов: «Церковь с паладинами ( мёртвыми рыцарями которых оживил один челик, для верующих)». Имя он получает в следующем абзаце того же сообщения, прямо в ходе перечисления: «Организация челика который и оживил паладинов. Давай челика назовём Виктор».</p>\n<p>До этого он проходит под описанием «челик который оживил паладинов» — это единственный зафиксированный вариант его именования, помимо собственно имени.</p>\n<p>Откуда он взялся, кем был до того, как начал оживлять мёртвых, и как связан с церковью — в переписке не сказано.</p>", "r": []}, {"t": "Характер", "a": ["S02", "PS-0308-S02", "PS-0308--harakter"], "h": "<p>Отдельного описания характера нет. Названа только вера: «Ну и Виктор верит в красный ток что оживляет людей» (2025-11-17, id 385768). Вера, а не знание — формулировка авторская и повторена без изменений 2025-12-06 (id 393287).</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0308-S03", "PS-0308--sposobnosti"], "h": "<p>Виктор оживляет мёртвых. Материал его работы — красный ток, в который он верит и который, по его вере, оживляет людей.</p>\n<p>Результат работы описан с прямо названным ограничением (2025-11-17, id 385768): «И он многих оживил, но разум так и не смог в них оживить». То есть тела возвращаются, разум — нет.</p>\n<p>Позднее (2025-12-06, id 393308) та же способность переформулирована: «Да еще и Виктор, что воскрешает трупы, ну точнее делает из них марионеток». Здесь «воскрешение» прямо уточнено до «марионеток» — тем же ходом, что и раньше: тело без разума.</p>\n<p>Результат его работы — паладины, «мёртвые рыцари», оживлённые «для верующих». Про них сказано (2025-11-17, id 385768): «паладины до хрена сильный но их ней движения предсказуемый. Они больше как роботы с повторяющими движениями». Предсказуемость и повторяемость движений — следствие того же: разум в них не оживлён.</p>\n<p>Механика самого красного тока в приведённых кусках переписки не раскрыта.</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0308-S04", "PS-0308--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Церковь с паладинами</strong> — паладины оживлены им и оживлены именно «для верующих». Церковь идёт в перечне отдельной строкой, сразу перед его организацией.</li>\n<li><strong>Организация Виктора</strong> — своя организация, названная в перечне как «Организация челика который и оживил паладинов». Состав, цели и численность не названы.</li>\n<li><strong>Красный ток</strong> — предмет его веры и средство оживления.</li>\n<li><strong>Оам</strong> — вселенная, к которой он отнесён.</li>\n<li>В перечне он стоит среди «расы и организации который равны по силе с друг другом» — то есть не в верхушке иерархии, где коты <a href=\"PS-0307.html\">Коты</a> и апостолы.</li>\n<li>В разговоре о злодеях (2025-12-06, id 393308–393310) он назван сразу перед тем, как Слава подводит итог: «Ну вот у меня в голове два основных злодея». Двумя основными злодеями оказываются дочь Имитатора <a href=\"PS-0324.html\">Дочь Имитатора</a> и Бог красок; Виктор в их число не входит и остаётся на промежуточной ступени.</li>\n</ul>", "r": [["Коты", "PS-0307.html"], ["Дочь Имитатора", "PS-0324.html"]]}, {"t": "Как менялся", "a": ["S05", "PS-0308-S05", "PS-0308--kak-menyalsya"], "h": "<p><strong>2025-11-17 (окно w0109, id 385768–385769).</strong> Появляется в перечне рас и организаций Оам. Здесь же получает имя прямо в реплике. Заведены: собственная организация, вера в красный ток, оживляющий людей, и итог его работы — «он многих оживил, но разум так и не смог в них оживить». Через него объяснены паладины церкви.</p>\n<p><strong>2025-12-06 (окно w0112, id 393287–393290).</strong> Дословный повтор того же перечня: организация, вера в красный ток, оживил многих, разума не оживил. Изменений нет.</p>\n<p><strong>2025-12-06, 17:50 (окно w0112, id 393307–393310).</strong> Отнесён к промежуточным злодеям при разборе сторон конфликта. Формулировка способности уточнена: «Виктор, что воскрешает трупы, ну точнее делает из них марионеток». Сразу после этого Слава переходит к двум основным злодеям, среди которых Виктора нет.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S06", "PS-0308-S06", "PS-0308--chto-s-nim-stalo"], "h": "<p>На последней зафиксированной дате (2025-12-06) Виктор — одна из сторон конфликта вселенной Оэм, стоящая ниже двух основных злодеев. Дальше его линия в окнах не разрабатывается: цель, мотивация и судьба остались не названными.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0308-S07", "PS-0308--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Цель и мотивация Виктора в переписке не названы. Задачу «цель и мотивация двух сильнейших злодеев» Слава ставит себе отдельно, и Виктор в эти двое не входит.</li>\n<li>Внешность не описана.</li>\n<li>Что такое красный ток, откуда он берётся и почему Виктор в него верит — не объяснено.</li>\n<li>Почему разум оживить не удаётся и пытается ли он это исправить — не сказано.</li>\n<li>Организация Виктора названа, но её состав, размер и цели не описаны.</li>\n<li>Характер отношений Виктора с церковью (нанят, состоит в ней, использует её) не определён.</li>\n<li>Чем его линия заканчивается — в переписке нет.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0308--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0063.html\">Организация Виктора</a></li>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0307.html\">Коты</a>, <a href=\"PS-0324.html\">Дочь Имитатора</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0307.html\">Коты</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0061.html\">Церковь с паладинами</a>, <a href=\"GR-0062.html\">Паладины</a>, <a href=\"GR-0063.html\">Организация Виктора</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0308--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-11-17</td>\n<td>385768–385769</td>\n<td>w0109</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-06</td>\n<td>393286–393290</td>\n<td>w0112</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-06</td>\n<td>393307–393310</td>\n<td>w0112</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0308-viktor.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0308--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0308.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
