<script>const BASE="";const DOCNAME="ГГ-защитник";
const LEAD="<p>Главный герой хоррор-истории Славы: подросток, переехавший с младшей сестрой в новый город. Имени у него в переписке нет ни разу — он проходит как «гг», «главный герой истории про существо», «защитник». Разрабатывался в две сессии, 2024-11-09 — 2024-11-14 (окна w0063, w0064), семь версий.</p>";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0163-S01", "PS-0163--proishozhdenie"], "h": "<p>Персонаж появляется 2024-11-09 (id 255024–255053) не как отдельная задумка, а как свойство целого набора миров. Слава: «И во все у меня в этих мирах гг вообще защитник» (id 255026). То есть «защитник» заявлен сразу как общая роль главного героя во всех его мирах, а не черта одного конкретного героя.</p>\n<p>Тут же, отдельной репликой, Слава предлагает второго персонажа: «Ну или другой перс который пытается все выкинуть на своем горбу и всегда когда сложно улыбается и пытается подбодрить всех но сам трясется в ужасе» (id 255029). Это отдельная запись — Перс, тащащий всё на своём горбу (<a href=\"PS-0164.html\">Перс, тащащий всё на своём горбу</a>), не сам ГГ.</p>\n<p>Параллельно Миколай выкладывает разбор «формулы страха» (id 255030) и вытаскивает из него одно слово. Из его же выкладки: «Угроза + Неопределенность + Отсутствие контроля = Страх» (id 255033) и «Осознание неизбежности + Чувство беспомощности = Ужас» (id 255041). Дальше: «беспомощность» — «вот оно» (id 255043–255044).</p>\n<p>Слава на это: «Защитник да ещё и беспомощный 😂» (id 255048). Миколай: «слава / это че такое / ты творчеством занимаешься или где» и «как раз таки творчество это сочетание несочетаемого» (id 255049–255053). Слава соглашается: «Ладно ладно можно его запихнуть» (id 255052).</p>\n<p>В том же разговоре Слава называет элементы вселенной, в которой живёт этот ГГ: «в этой вселенной существует озеро перерождения ( который превращает монстра )» (id 255042, <a href=\"MN-0009.html\">Озеро перерождения</a>) и «Ну или ещё камень желаний» (id 255047, <a href=\"MN-0010.html\">Камень желаний</a>). Прямая связь ГГ с этими двумя объектами в переписке не проговорена.</p>", "r": [["Перс, тащащий всё на своём горбу", "PS-0164.html"], ["Озеро перерождения", "MN-0009.html"], ["Камень желаний", "MN-0010.html"]]}, {"t": "Характер", "a": ["S02", "PS-0163-S02", "PS-0163--harakter"], "h": "<p>Основное свойство, проговорённое дословно: он не боится людей и боится существо. Из текста от первого лица (2024-11-11, id 255795):</p>\n<p>«Я не боялся людей, ведь это глупо человек боится человека если это и будет так то наша общество не крепче картонной коробке, а я верил что нашей общество крепкая, поэтому я не боялся, но чего я действительно боялся это то невообразимое существо который в любой момент может взять и убить».</p>\n<p>Оттуда же — цепочка, в которую у него превращается страх: «я боюсь его настолько что мое страх перерастает в гнев а из гнева в решимость убить эту тварь, ради безопасности сестры, ради мой безопасности, ради безопасности этого толстяка которого я сейчас бью».</p>\n<p>Драки для него норма: «Он уже был готов к драке и не боялся получать ему это казалось естественным как вращение земли» (id 255096). Миколай отдельно отметил это место, процитировав его как «движение земли»: «очень красиво подобрано выражение» (id 255101–255102).</p>\n<p>Про его отношения со страхом сказано двумя ступенями и с оговоркой: «гг давно привык к страху тренируемых все это время в драках или точней он так думал / На самом деле он переборол страх» (id 255096). Что такое «тренируемых», Слава пояснил позже: «То бишь просто драки» (2024-11-14, id 257162). В чём разница между «привык к страху» и «переборол страх», Миколай спросил прямо (id 256952) — ответа в переписке нет.</p>\n<p>Улыбка у него — постоянная и не настоящая. В школу он идёт «с наигранной улыбкой» (id 255096); вернувшись домой и увидев сестру живой, он «хотел закричать расплакаться или потерять сознания», но «не закричал не расплакался и не потерял сознания он лишь когда всегда лучезарная улыбался и побежал за сестрой дабы поймать её и зашикатить, пряча за этим все те эмоции который переполнили его за этим жалких 20 мину» (id 255096).</p>\n<p>Эмоции он выплёскивает самоповреждением: «После он удалился в туалет и начал резать руку нет невены не артерий а просто кожу и плоть, это единственный способ который он знал дабы выплеснуть эмоции» (id 255096). Наутро рука болит, и он «не обращал на это внимание ведь это ключ» (id 255795).</p>\n<p>Учёба: «я уже давно понял что учусь только для себя, не для родителей которых не бывают дома, не для учителей который меняются так часто, что я не успевал запоминать имена» (id 255795).</p>\n<p>К избитому им задире он испытывает благодарность: «Он дал мне решимость и почти что решил страх. Я благодарен ему и его лицу» (id 255795). И там же — сомнение в собственном страхе: «И с чего я вообще взял что это не человек. Я же его не видел, да он был большим, а руки длинный и острый ногти но это вполне мог быть человек, а если это человек то и бояться его не надо» (id 255795).</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0163-S03", "PS-0163--sposobnosti"], "h": "<p>Сверхъестественных способностей у ГГ не названо. В переписке есть два места, где с его телом что-то происходит, и оба остались непрояснёнными.</p>\n<p>Первое — момент встречи с существом: «в тот же момент когти существо прибили кожу гг давай ему контроль над телом и гг бежал не обращай ни на что внимания» (id 255096). Миколай спросил дважды: «прибили кожу?» (id 256953) и «как он контроль получил?» (id 256954). На первое Слава ответил «Поцарапал» (2024-11-14, id 257160), на второе ответа в переписке нет.</p>\n<p>Второе — питьё из чёрного озера: «И выпив от туда у гг сразу проскакивает мысль а как же сестра» (id 255096). Никаких последствий питья ни в тексте, ни в обсуждении не описано.</p>\n<p>Заявленная 2024-11-09 «беспомощность» (id 255043–255052) как свойство персонажа в написанных частях не показана; договорились только, что «можно его запихнуть».</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0163-S04", "PS-0163--svyazi-s-drugimi"], "h": "<p><strong>Сестра (<a href=\"PS-0165.html\">Сестра гг</a>).</strong> Младшая, «ещё ребенок который хочет получать внимание». Главная привязка персонажа: «его больше волновала состояния его сестры», «Гг конечно старается уделить её достаточной внимание, но внимание 2 родителей даже иногда не хватает не говоря уже о внимание только брата» (id 255096). Ради неё он бежит обратно из леса: «не ради себя а ради такой близкой и бесконечно любимый сестры, он был готов перевернуть сами небеса дабы с ней все было в порядке» (id 255096).</p>\n<p><strong>Родители.</strong> Вечно на работе, «почему то не питают ни каких чувств к свои отбрыском», в праздники семья не собирается. «А гг думает что родители его вообще ненавидят / Потому что каждый раз посылают его в школу с плохой репутации» (id 255096). Миколай уточнил, чья именно репутация плохая: «тобиж у школы репутация плохая? не у гг или родителей верно» — Слава: «Да» (id 256897–256901).</p>\n<p><strong>Существо с длинными руками (<a href=\"PS-0166.html\">Существо с длинными руками</a>).</strong> Встречено на дороге по пути из школы. ГГ его не видел: существо подошло сзади и положило руки на плечи. «Его руки были длины как и пальцы, а когти были настолько что без каких либо усилий давали одежду гг и в момент когда на его голову уже капнула слюна» (id 255096). Отдельно проговорено, откуда ГГ вообще знает, как оно выглядит: «Потому что не видел» (id 256841), «В прошлой части это существо капнула слюной на его голову вот он и подумал что он дофига длинный» (id 256844). То есть представление о существе он достроил сам, по слюне сверху.</p>\n<p><strong>Здоровяк / толстяк-задира (<a href=\"PS-0168.html\">Здоровяк (толстый задира)</a>, <a href=\"PS-0167.html\">Толстяк-задира</a>).</strong> Школьный противник, обычный человек — на вопрос «это обычный человек / не?» Слава отвечает «Да обычный человек / Но пока он его бил он думал» (id 256818–256820). Хронология драк уточнена 2024-11-13 (id 256742–256754): «Вчера гг тоже его избил и вчера в местью со свой бандой он побил гг», сегодняшняя встреча происходит перед уроками на крыльце, «Гг просто увидел его и начал избивать».</p>\n<p><strong>Перс, тащащий всё на своём горбу (<a href=\"PS-0164.html\">Перс, тащащий всё на своём горбу</a>).</strong> Предложен в том же сообщении-развилке (id 255029) как «другой перс» — то есть не как версия ГГ, а как альтернативный герой.</p>\n<p><strong>Чёрное озеро в густом лесу (<a href=\"MN-0011.html\">Чёрное озеро в густом лесу</a>).</strong> Место, куда он прибегает в беспамятстве: «лес настолько густым что словно казалось сейчас ночь но как бы не была темная ночь темнее всего в этом месте был озеро настолько черный что казалось там не вода а нефть залитоми литрами» (id 255096).</p>", "r": [["Сестра гг", "PS-0165.html"], ["Существо с длинными руками", "PS-0166.html"], ["Здоровяк (толстый задира)", "PS-0168.html"], ["Толстяк-задира", "PS-0167.html"], ["Перс, тащащий всё на своём горбу", "PS-0164.html"], ["Чёрное озеро в густом лесу", "MN-0011.html"]]}, {"t": "Как менялся", "a": ["S05", "PS-0163-S05", "PS-0163--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2024-11-09 (w0063, id 255024–255053).</strong> Персонаж существует одной строкой: ГГ во всех этих мирах — защитник. К нему пристёгивается «беспомощность» из формулы ужаса Миколая. Слава фиксирует несочетаемость шуткой, Миколай настаивает, Слава соглашается «запихнуть».</p>\n<p><strong>Версия 2 — 2024-11-10 (w0063, id 255073–255103).</strong> Слава пишет то, что называет «Мини предыстория» (Миколай: «минипредыстория блять», id 255097). Текст от третьего лица, одним сообщением (id 255096): переезд с сестрой, холодные родители, школа с плохой репутацией, наигранная улыбка, готовность к дракам, ступор посреди дороги, руки существа на плечах, слюна на голову, когти, бегство, густой лес, чёрное озеро, глоток из него, мысль о сестре, обратный бег, страх перед дверью, живая сестра, щекотка вместо срыва, порезы в туалете. Оценка Миколая: «предыстория хорошая» (id 255103).</p>\n<p><strong>Версия 3 — 2024-11-11 (w0063, id 255795–255805).</strong> Вторая часть, уже от первого лица (id 255795): утро после, разбитое тело, дорога в пустой школе, встреча с здоровяком на крыльце, драка, монолог про то, что людей он не боится, про переход страха в гнев и решимость, и про сомнение — существо ли это вообще было. Миколай в тот день текст не разбирает: «так как я решил что буду читать и думать / я хуй его знает когда прочту / но хорошо что ты написал» (id 255803–255805).</p>\n<p><strong>Версия 4 — 2024-11-13 (w0064, id 256736–256760).</strong> Разбор хронологии драк. Миколай цитирует кусок и спрашивает, «вчера ждал / или сейчас / после уроков». Выясняется расклад: вчера ГГ избил здоровяка, вчера же после уроков здоровяк с бандой избил ГГ, сегодня перед уроками ГГ бьёт его снова, первым.</p>\n<p><strong>Версия 5 — 2024-11-13 (w0064, id 256812–256867).</strong> Разбор мотивации. Миколай не понимает, почему ГГ «с нихуя про существо заговорил / которого ни разу не видел». Слава: «Он все время о нем думал после вчерашнего». Проверяются варианты: считает ли ГГ задиру существом («Нет»), кого он считает существом («Не кого»), привели ли к существу мысли о страхе («Да»). Миколай фиксирует: «ну тогда переход у тебя резкий получился / а так хорошо». Здесь же обнаруживается, что вторая часть — продолжение первой: Слава заново скидывает всю предысторию (id 256858, текст совпадает с id 255096), Миколай: «это первая / я ща вторую чекаю» и «я совсем не помню эту историю».</p>\n<p><strong>Версия 6 — 2024-11-13 (w0064, id 256897–256955).</strong> Правки по формулировкам. Миколай цепляется к «каждый раз посылают»: «звучит немного странно, будто разные новые одинаково хуёвые школы» (id 256915). Обсуждается замена — «Устраивают ?», «просто послали / не в хорошую / а хуёвую», «Послали»; чем кончилось, из переписки не следует, Слава сворачивает разговор («Иди ты»). Дальше Миколай пишет уже в спящий чат три вопроса: что такое «тренируемых», в чём разница между «привык к страху» и «переборол страх» и как это делается (id 256952), «прибили кожу?» (id 256953), «как он контроль получил?» (id 256954).</p>\n<p><strong>Версия 7 — 2024-11-14 (w0064, id 257159–257180).</strong> Ответы наутро. «Поцарапал» (про когти, id 257160). «То бишь просто драки» (про «тренируемых», id 257162). Разбирается фраза «решений рассудком и обвинявший его о опоздание сестру»: Слава поясняет «Типо сестра сума сошла когда увидел монстра» (id 257161) и, на вопрос кто кого обвинял, «Сестра обвиняла брата» (id 257174). Миколай предлагает читать «решений рассудка» как «лишённый» (id 257165) — принята ли правка, из переписки не видно; последнее слово Славы «Решеную рассудка» (id 257180). На вопрос про контроль над телом Слава отвечает переносом: «В 3 часть расскажу» (id 257159).</p>", "r": []}, {"t": "Что с ним стало", "a": ["S06", "PS-0163-S06", "PS-0163--chto-s-nim-stalo"], "h": "<p>Написаны две части. Третья обещана и должна объяснить, как ГГ получил контроль над телом (id 257159, 2024-11-14). В имеющейся переписке третьей части нет.</p>\n<p>Последнее состояние героя по тексту: он в школе, бьёт здоровяка, решил, что боится не людей, а существо, и что страх нужно превратить в решимость убить тварь. Сестра на конец первой части жива и невредима.</p>\n<p>Отдельно стоит пояснение про сошедшую с ума сестру (id 257161, 257174). В самом тексте сумасшествие сестры — один из вариантов, которых ГГ боится, открывая дверь; открыв, он находит её целой. Как соотносится пояснение Славы с этим — то есть случилось это или только могло случиться — в переписке не разъяснено.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0163-S07", "PS-0163--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имени у персонажа нет ни разу за все семь версий.</li>\n<li>Внешность ГГ не описана вообще: ни возраста цифрой, ни роста, ни лица, ни одежды. Есть только улыбка (наигранная, лучезарная) и порезы на руке.</li>\n<li>Не сказано прямо, что ГГ прозы и «ГГ-защитник» из системы миров — один и тот же персонаж (отмечено как неясность в w0063).</li>\n<li>Вселенная, в которой происходит история, в чате не объявлена (w0064).</li>\n<li>Как ГГ получил контроль над телом — вопрос задан (id 256954), ответ перенесён в третью часть, которой нет.</li>\n<li>Разница между «привык к страху» и «переборол страх» — вопрос задан (id 256952), ответа нет.</li>\n<li>Что дало питьё из чёрного озера — не сказано ничего.</li>\n<li>Как «беспомощность», о которой договорились 2024-11-09, должна проявляться в персонаже — осталось нерешённым.</li>\n<li>Связь ГГ с озером перерождения (<a href=\"MN-0009.html\">Озеро перерождения</a>) и камнем желаний (<a href=\"MN-0010.html\">Камень желаний</a>) не проговорена, хотя оба названы как элементы его вселенной.</li>\n<li>Итоговая формулировка про школу («каждый раз посылают») не выбрана.</li>\n<li>Судьба сестры после пояснения про сумасшествие неоднозначна.</li>\n<li>Сколько всего частей задумано и в каком состоянии текст — не сказано.</li>\n</ul></div>", "r": [["Озеро перерождения", "MN-0009.html"], ["Камень желаний", "MN-0010.html"]]}, {"t": "Связи — всё вместе", "a": ["PS-0163--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0164.html\">Перс, тащащий всё на своём горбу</a>, <a href=\"PS-0165.html\">Сестра гг</a>, <a href=\"PS-0166.html\">Существо с длинными руками</a>, <a href=\"PS-0167.html\">Толстяк-задира</a>, <a href=\"PS-0168.html\">Здоровяк (толстый задира)</a></li>\n<li><strong>Упоминает монументы:</strong> <a href=\"MN-0009.html\">Озеро перерождения</a>, <a href=\"MN-0010.html\">Камень желаний</a>, <a href=\"MN-0011.html\">Чёрное озеро в густом лесу</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0168.html\">Здоровяк (толстый задира)</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0045.html\">Чёрные, белые и серые маги</a>, <a href=\"GR-0047.html\">Банда толстяка-задиры («недобанда»)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0163--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-11-09</td>\n<td>255024–255053</td>\n<td>w0063</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-11-10</td>\n<td>255073–255103</td>\n<td>w0063</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-11-11</td>\n<td>255795–255805</td>\n<td>w0063</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-11-13</td>\n<td>256736–256760</td>\n<td>w0064</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-11-13</td>\n<td>256812–256867</td>\n<td>w0064</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-11-13</td>\n<td>256897–256955</td>\n<td>w0064</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-11-14</td>\n<td>257159–257180</td>\n<td>w0064</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0163-gg-zaschitnik.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0163--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0163.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0163-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0163/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Чинить первым — не пробел внутри самой статьи, а соседняя запись, на которую эта статья прямо опирается: <code>SL-0043</code> («Формула страха»). У неё нет статьи, но материала в базе достаточно (11730 знаков) — и именно из этого материала выросло ключевое, так и не реализованное свойство ГГ: «беспомощность». Пока <code>SL-0043</code> не разобрана отдельно, вопрос «как беспомощность должна была проявляться в персонаже» останется гипотезой на пустом месте — писать статью о формуле не с нуля, материал уже лежит.</p>\n<h3>С чего начать</h3>\n<p>Начать стоит с базы, не с архива: открыть <code>SL-0043</code> и посмотреть, раскрывает ли она «беспомощность» подробнее, чем две реплики в чате (id 255043–255052). Если там пусто по этой части — тогда в архив, и ориентир такой: обещанная третья часть истории (id 257159, 2024-11-14, «В 3 часть расскажу») в окне w0064 не появляется, значит искать её нужно в более поздних окнах, идущих после w0064 и снова помеченных вселенной «монстры».</p>\n<h3>Как развивалось</h3>\n<p>2024-11-09 заявили: ГГ-защитник — сразу общее свойство героя «во всех этих мирах», к нему тут же пристёгнута «беспомощность» из формулы ужаса. 2024-11-10 ограничили: заявка стянулась в одну конкретную предысторию, один мир, один текст. Дальше — забыли: ни беспомощность, ни то, как ГГ получил контроль над телом, в написанных частях не показаны, вопросы 2024-11-13 (id 256952, 256954) оставлены без ответа Миколая. 2024-11-13–14 вернулись, но только к формулировкам и хронологии драк — не к этим двум открытым вопросам.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для толстяка-задиры статус «обычный человек» назван и подтверждён впрямую: «это обычный человек / не? — Да обычный человек» (id 256818–256820). Для существа с длинными руками тот же по сути вопрос — человек это или нет — поднят внутри текста самим ГГ («а если это человек то и бояться его не надо»), но между авторами вслух не задан и не решён, хотя это куда более нагруженная фигура истории, чем толстяк.</p>\n<h3>Отклик</h3>\n<p>Зацепила деталь про слюну: ГГ ни разу не видел существо, а вывел его длину из капли, упавшей сверху на голову, — и это единственное основание для всего образа монстра в тексте. Порезы в туалете после драки тоже поданы без нажима, одной строкой, без объяснений — и это тот случай, когда недосказанность работает лучше, чем работала бы подробность.</p></div>", "r": []}];</script>
