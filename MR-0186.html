<script>const BASE="";const DOCNAME="Семь островов";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0186-S01", "MR-0186--ustroystvo"], "h": "<p>Семь островов — вселенная, а не отдельное место внутри другой вселенной. Суть её сформулирована одной фразой: «Оказывается вселенная семь островов это вселенная в которой два мира столкнулись» (2026-02-06, id 429363).</p>\n<p>Внутри вселенной различаются «старые» и «новые» острова. Разделение возникло из уточняющего вопроса Миколая — «те старые 7 островов?» / «или новые» (2026-02-06, id 429362, 429364). Основание для «новых»: «ну ты врд пытался вернуть острова как-то» (id 429368), то есть новые острова — это следствие более поздней попытки Славы вернуть острова к работе. Порядок разбора договорились такой: «Ну сначала старое а потом новое» (id 429370).</p>\n<p>Само число семь в переписке не раскрывается: перечисления островов, их названий или устройства в этих окнах нет.</p>", "r": []}, {"t": "Место во вселенной — как связан с другими мирами", "a": ["S02", "MR-0186-S02", "MR-0186--mesto-vo-vselennoy"], "h": "<p>Семь островов названы первой вселенной. При обсуждении названия для второй вселенной Слава перечисляет уже существующее: «Первая Оам. Ещё есть семь островов И правитель» (2025-12-09, id 394734). В феврале то же положение повторяется: Слава скидывает в нейросеть «первую вселенную», и речь идёт именно о семи островах (2026-02-06, id 429361–429363).</p>\n<p>В карточке мира вселенными указаны «7 островов» и «Феня»: первое упоминание (2025-12-09) приходится на окно, где объявлена Феня, второе (2026-02-06) — на окно вселенной «7 островов».</p>\n<p>Связанные записи, зафиксированные в карточке: Бессмертный, ОЭМ, Оам, Феня.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S03", "MR-0186-S03", "MR-0186--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-12-09 (окно w0113, id 394734–394736).</strong> Единственное упоминание. Семь островов названы в списке того, что уже придумано, наряду с Оам и «правителем», — при попытке подобрать имя второй вселенной. Разговор сразу ушёл к имени, острова не разбирались.</p>\n<p><strong>Версия 2 — 2026-02-06 (окно w0115, id 429356–429370).</strong> Повтор прежней мысли с добавлением сути. Слава возвращается к вселенной, называет её первой и формулирует, что это вселенная столкновения двух миров. Миколай уточняет, старые это острова или новые; вводится разделение на старые и новые, договариваются идти сначала по старому, потом по новому.</p>", "r": []}, {"t": "Пробелы", "a": ["S04", "MR-0186-S04", "MR-0186--probely"], "h": "<div class=\"gaps\"><ul>\n<li>(w0113) Неясно, вселенные это, места внутри Оам или отдельные заготовки.</li>\n<li>Какие именно два мира столкнулись — в переписке не сказано.</li>\n<li>Чем «новые» острова отличаются от «старых», кроме того, что связаны с попыткой Славы вернуть острова, — не сказано. Как именно он «пытался вернуть острова», тоже не описано.</li>\n<li>Перечня самих семи островов в этих окнах нет.</li>\n<li>(w0115) Подробный разбор мира в этом окне присутствует только в виде машинной сводки (id 429376–429377), авторский исходник в чат не попал.</li>\n<li>Разбор «сначала старое, потом новое» на момент последнего сообщения остался нерешённым — он только запланирован.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0186--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a>, <a href=\"VS-0011.html\">Феня</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0186--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-12-09</td>\n<td>394734–394736</td>\n<td>w0113</td>\n<td>Феня (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-02-06</td>\n<td>429356–429370</td>\n<td>w0115</td>\n<td>7 островов (объявлено)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0186-sem-ostrovov.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0186--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0186.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
