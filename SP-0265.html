<script>const BASE="";const DOCNAME="Кровь";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0265-S01", "SP-0265--mehanika"], "h": "<p>Способность носит имя «Кровь». Описана одной фразой: «Может управлять собственное кровью, а из-за регенерация он может вырабатывать эту кровь дофига» (2026-06-02, id 487010).</p>\n<p>Управление распространяется на собственную кровь носителя — про чужую кровь ничего не сказано. Объём доступного материала обеспечен другой чертой носителя: невероятно быстрой регенерацией тела, благодаря которой кровь вырабатывается в неограниченных на практике количествах.</p>\n<p>Во что кровь превращается, какие формы принимает (оружие, щит, потоки), в переписке не описано — названо только само управление.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0265-S02", "SP-0265--ogranicheniya-i-cena"], "h": "<p>Отдельных ограничений не названо. Естественное ограничение — расход крови — снято прямо в описании: регенерация покрывает его.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0265-S03", "SP-0265--nositeli"], "h": "<p>Нуар. «Кровь» стоит первой в перечне его способностей, за ней идут Слова (<a href=\"SP-0266.html\">Слова</a>), Молния и Тьма.</p>\n<p>Общие особенности Нуара и апостолов, названные в том же окне (id 487009): «Они не стареют, у них невероятное быстрая регенерация тела. И их тела очень адаптивные. Ну ещё несколько особенностей которых я прям здесь не скажу». Регенерация, на которой держится «Кровь», — не отдельная способность, а общая особенность Нуара и апостолов.</p>\n<p>Есть ли «Кровь» у апостолов — в переписке не сказано, хотя регенерация у них общая с Нуаром.</p>", "r": [["Слова", "SP-0266.html"]]}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0265-S04", "SP-0265--kak-menyalas-po-versiyam"], "h": "<p>Версия 1 — 2026-06-02 (id 487009–487011, окно w0120). Первое и единственное описание. Позже способность не переписывалась.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0265-S05", "SP-0265--svyaz-s-drugimi-sposobnostyami"], "h": "<ul>\n<li>Прямая зависимость от регенерации: без неё запас крови был бы ограничен, и в описании эта связь названа причинно — «из-за регенерация он может вырабатывать эту кровь дофига».</li>\n<li>Входит в общий набор Нуара вместе со Словами (<a href=\"SP-0266.html\">Слова</a>), Молнией («просто плюс разрушительный навык») и Тьмой (пропитывание тьмой воздуха, земли и воды в радиусе примерно 3 км, полный контроль над этой тьмой и перемещение в ней).</li>\n<li>В области тьмы «способности нуар становяться мощнее, а способности противников слабее». Отдельно про «Кровь» в этой связи не сказано, но оговорка дана для способностей Нуара без исключений.</li>\n</ul>", "r": [["Слова", "SP-0266.html"]]}, {"t": "Пробелы", "a": ["S06", "SP-0265-S06", "SP-0265--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вселенная в карточке помечена как «неясно».</li>\n<li>Формы применения крови не описаны: во что она обращается и что делает — состав приёмов не назван.</li>\n<li>Действует ли управление на чужую кровь — не сказано.</li>\n<li>Скорость восполнения, предел единовременного объёма, дальность контроля не названы.</li>\n<li>Часть особенностей Нуара и апостолов автор оставил нераскрытыми намеренно: «ещё несколько особенностей которых я прям здесь не скажу».</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0265--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0266.html\">Слова</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0104.html\">Нуар</a></li>\n<li><strong>Упомянут в способностях:</strong> <a href=\"SP-0266.html\">Слова</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0265--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-06-02</td>\n<td>487009–487011</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0265-krov.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0265--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0265.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
