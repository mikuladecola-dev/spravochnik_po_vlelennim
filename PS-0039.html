<script>const BASE="";const DOCNAME="Адам Тихой";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0039-S01", "PS-0039--proishozhdenie"], "h": "<p>Персонаж вселенной «игра бога». Появился одним сообщением Миколая как готовая карточка — имя, короткое описание, способность (2024-04-02, id 153327). Обсуждения до или после этой карточки в переписке нет: персонаж назван и описан за один раз, реакции соавтора на него в материале не зафиксировано.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0039-S02", "PS-0039--vneshnost"], "h": "<p>Отдельного описания внешности нет. Из карточки известны только пол и возраст: «мужчина лет 25».</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0039-S03", "PS-0039--harakter"], "h": "<p>Дословно: «Неуравновешенный но талантливый мужчина лет 25». Два свойства — неуравновешенность и талант — даны рядом, без пояснений: в чём именно талант и как проявляется неуравновешенность, в переписке не сказано.</p>\n<p>Из способности следует, что Адам «подъёбывает» — то есть задирает, подначивает окружающих; это часть его поведения, а не отдельно описанная черта.</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0039-S04", "PS-0039--sposobnosti"], "h": "<p>Одна способность, сформулированная так: «За каждый ответ на его подъебку тот кто ответил получает адскую головную боль».</p>\n<p>Механика в том виде, как она названа:</p>\n<ul>\n<li>триггером служит подъёбка Адама и ответ на неё;</li>\n<li>страдает тот, кто ответил, — не сам Адам и не третьи лица;</li>\n<li>эффект — адская головная боль;</li>\n<li>счёт идёт «за каждый ответ», то есть срабатывание привязано к отдельной реплике, а не к разговору в целом.</li>\n</ul>\n<p>Оговорено ли, что за несколько ответов боль накапливается, в переписке не сказано — формулировка «за каждый ответ» этого прямо не раскрывает. Длительность боли, её последствия, возможность защиты от неё, необходимость Адаму слышать ответ или находиться рядом — ничего из этого не названо. Работает ли способность против воли Адама (то есть обязан ли он её включать) — тоже не обсуждалось.</p>\n<p>Отдельного id за способностью в материале не закреплено.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S05", "PS-0039-S05", "PS-0039--kak-menyalsya"], "h": "<p><strong>2024-04-02 (id 153327), окно w0029</strong> — единственная версия. Полная карточка от Миколая: имя, «неуравновешенный но талантливый мужчина лет 25», способность с головной болью в ответ на подъёбки.</p>\n<p>Правок, переработок и отклонённых вариантов нет: карточка записана один раз и к ней не возвращались.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0039-S06", "PS-0039--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Внешность не описана, кроме возраста и пола.</li>\n<li>В чём состоит талант — не сказано.</li>\n<li>Как проявляется неуравновешенность — не сказано.</li>\n<li>Границы способности (дальность, длительность боли, накопление, защита) не обсуждались.</li>\n<li>Связей с другими персонажами вселенной «игра бога» в переписке не названо ни одной.</li>\n<li>Сюжетной роли, места действия, дальнейшей судьбы персонажа в материале нет — карточка осталась одиночной записью.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0039--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0049.html\">Команда Миколая (10 персонажей игры бога)</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0049.html\">Команда Миколая (10 персонажей игры бога)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0014.html\">игра бога</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0039--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-04-02</td>\n<td>153327–153327</td>\n<td>w0029</td>\n<td>игра бога (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0039-adam-tihoy.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0039--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0039.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
