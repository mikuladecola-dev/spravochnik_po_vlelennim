<script>const BASE="";const DOCNAME="Лучница";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0227-S01", "PS-0227--proishozhdenie"], "h": "<p>Лучница (вариант имени — «чёрная лучница») — чужемирец. Это раскрыто не в самой сцене, а в обсуждении после неё (2025-03-18, id 305314–305325): Миколай спрашивает, откуда она берёт стрелы, Слава отвечает — «В этом суть этих чудемирцов. Они могут создавать оружия из себя». Через два сообщения Миколай проговаривает вывод: «а, она чужемирец....» — Слава подтверждает: «Да».</p>\n<p>В тексте (2025-03-18, id 305113–305115) она — первый противник Максима, рассказчика от первого лица. Место встречи: неблагоприятный район на окраине города, где много заброшенных домов, ночь. Максим ходит туда уже вторую неделю в поисках того, с кем можно подраться. Лучница стреляет в него из заброшенного двухэтажного дома; Максим определяет её по звуку натягиваемой тетивы ещё до того, как поднял голову — «по слуху это девушка молодая лет до 20. Лёгкая, быстрая и ловкая».</p>\n<p>Откуда она пришла, из какого мира и зачем стреляла в Максима — в переписке не сказано.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0227-S02", "PS-0227--vneshnost"], "h": "<p>Девушка, «явно не старше 20 лет». Полностью чёрная: «Нет не как афроамериканцы. А по настоящему черная. Чёрного цвета». Одета «как дикари в джунглях» — «лишь недо юбка и всё. Грудь ничего не закрывает. Хотя еë даже и не видно, как темнота во тьме». Единственное светлое пятно — глаза: «Лишь радужки глаз белые, как у людей. Но так она вся черная».</p>\n<p>Оружие такое же чёрное. Лук чёрный. Стрелы полностью тёмные, из-за чего Максим со своим идеальным зрением сначала не может разглядеть выстрел в темноте. Отдельно отмечена странность стрелы: «Она не только чёрная но и наконечник с деревяшкой словно единой». В момент боя Максим ещё не знает объяснения и думает: «Интересно, где она такие стрелы купила».</p>\n<p>Крайне лёгкая. От удара в лицо она отлетает через комнату и врезается в стену, и Максим делает из этого вывод: «Я конечно силен. Ну чтобы человека на такой долгий полёт отправить. У меня явно сил не хватит. И я понял. Это она такая лёгкая, что от моего удара отлитает».</p>\n<p>Кровь чёрная. В сцене это сказано после её смерти («И кровь у неë тоже черная»), а в обсуждении Миколай переспрашивает отдельно: «какая у неё кровь?» — «Чёрная» (id 305324–305325).</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0227-S03", "PS-0227--harakter"], "h": "<p>Прямых реплик у неё нет — за всю сцену она не произносит ни слова. Всё, что о ней известно как о характере, взято из её поведения в бою.</p>\n<p>Не издаёт звуков от боли. Когда Максим выворачивает ей локоть в неправильном положении, «вместо того, чтобы закричать. Она атакует правой рукой».</p>\n<p>Держит дистанцию последовательно: при приближении Максима «Наоборот отдаляется. Не забывая по мне стрелять». Лишившись лука, немедленно переходит на ножи, без паузы.</p>\n<p>После поражения не пытается встать и не сопротивляется: «Она же просто смотрите на потолок. Наверное уже понимает, что проиграла. И дальнейшее сопротивления бесполезна» — это догадка Максима, её собственных мыслей в тексте нет.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Отклик — не материал авторов</b>\n<p>Лучший кусок — двойной выстрел. Две стрелы в левое плечо и правое бедро, посланные так, что уклонение в любую сторону подставляет под вторую, — это не «крутой приём», это придуманная задача с одним решением, и решение честное: подпрыгнуть и выгнуться. То, что Максим описывает свою позу через буквы — сначала С, потом S, — смешно и точно одновременно, потому что так и правда думает человек, который пытается объяснить, как он изогнулся. Ещё зацепило молчание: у неё за всю сцену нет ни реплики, ни крика, и когда ей выворачивают локоть, она вместо крика бьёт другой рукой. Всё, что мы о ней знаем как о характере, вычитано из того, что она делает, и это выдержано до конца — включая финал, где она смотрит в потолок, а её мысли на этот счёт остаются догадкой рассказчика. Убийство при этом написано с той же обстоятельностью, что и всё остальное, и от этого читается тяжелее, чем, кажется, задумано.</p></div>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0227-S04", "PS-0227--sposobnosti"], "h": "<p>Создание оружия из себя — общая особенность чужемирцов. Формулировка Славы: «Они могут создавать оружия из себя», с сразу же названным ограничением — «Но трансформировать тело не могут». Именно этим объясняются чёрные стрелы, у которых «наконечник с деревяшкой словно единой». Слава признаёт, что в самом тексте сцены этого не объяснил: «Но здесь я виноват. Забыл добавить момент» (id 305318).</p>\n<p>Стрельба на уровне, который Максим оценивает сразу: «это лучница явно профессионал. Ведь стрела летела ровно в голову».</p>\n<p>Двойной выстрел в разные точки — её главный приём. Первый раз: «Два звука разрезающий воздух. Она стрельнула двумя стрелами. И эти две стрелы летели в разный точки. Первая в левой плечо. А второй в правой бедро». Приём построен так, чтобы закрыть уклонение в обе стороны: «И попытаясь я отклониться в влево, то стрела попадёт в правой плечо. А если попытаться уйти в право, то получу по левому бедру». Максиму приходится подпрыгнуть и изогнуться «в букву С». Во второй раз тот же приём вынуждает его изогнуться «в английскую букву S».</p>\n<p>Предугадывание позиции: когда Максим бежит к лестнице, он исходит из того, что «лучница наверника уже целится в сторону лестницы» — и оказывается прав, выстрел следует ровно в момент, когда его голова появляется на втором этаже.</p>\n<p>Стрельба в упор. Один выстрел почти касается лба; Максим уклоняется падением назад, но «мой лоб, стрела успела царапнут. И очень глубоко».</p>\n<p>Ближний бой на двух ножах: «У неë теперь в руках. Два странных ножа. И она ими атакует». Чем именно они странные, не описано.</p>\n<p>Ловкость и уклонение: первый удар Максима она «с лёгкостью увернулась от удара и от прыгнув от меня. Готовится стрелять». Также отмечена реакция на захват лука — Максим чувствует, «что она хочет его закрутит дабы я отпустил».</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0227-S05", "PS-0227--svyazi-s-drugimi"], "h": "<p><strong>Максим</strong> — противник, единственный персонаж, с которым она взаимодействует. Для него бой с ней становится точкой перелома: после него «скука стало куда сильнее», обычные драки стали казаться «детской забавой», он захотел «боя за жизнь. Где либо тебя либо ты», и его ночные прогулки продолжились.</p>\n<p><strong>Чужемирцы</strong> — вид, к которому она принадлежит. В том же тексте, уже в лесу, Максим встречает других: тёмного мужчину с копьём, «Подобной той который я убил», затем второго такого же и третьего. Про них сказано: «Они хоть не такие ловкий, как лучница. Но более крепкие». Из кустов там же стреляет ещё одна лучница — стрела Максима ранит, а сквозь тело чужемирца, которого он использовал как щит, «стрела прошла насквозь этого черныша даже не ранев его». Является ли эта лесная лучница таким же существом того же типа или чем-то отдельным, в переписке не разобрано; описания её внешности нет.</p>\n<p><strong>Создание оружия из себя</strong> — способность, объясняющая её снаряжение.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0227-S06", "PS-0227--kak-menyalsya"], "h": "<p><strong>2025-03-18, id 305113–305115 (окно w0082).</strong> Сцена целиком: появление, внешность, тактика боя, гибель. Стрелы и лук описаны как данность, объяснения им в тексте нет.</p>\n<p><strong>2025-03-18, id 305314–305325 (окно w0082, через два с половиной часа).</strong> Обсуждение сцены. Миколай задаёт два вопроса подряд — «у неё юбка и всё», «откуда она стрелы берет» — и получает объяснение про чужемирцев и создание оружия из себя. Слава фиксирует, что это пропуск в тексте, а не в задумке: «Но здесь я виноват. Забыл добавить момент». Отдельно уточняется цвет крови. Сам текст сцены при этом не переписывался — в переписке нет правки, только объяснение задним числом.</p>\n<p>Других версий у персонажа нет; обе датированы одним днём.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0227-S07", "PS-0227--chto-s-nim-stalo"], "h": "<p>Убита в той же сцене, в которой появилась.</p>\n<p>Ход развязки: Максим выбивает лук ударом ноги («Делаю полумесяц ногой»), уходит от выпада ножом, ломает ей руки — левую выворачивает в локте, правую «Закручиваю её до хруста», — раскручивает и бросает в стену. Дальше серия ударов до окна, удар со всей силы, которым он выбивает её в окно, перехват за ногу в последний момент и бросок в другую стену, «Расцарапов ей спину». Затем — по полу: «Схвативь еë за челюсть. И при подняв еë так. Резко опускаю на пол. И словно тряпку провожу по всему полу». После пинка она лежит на спине и не двигается.</p>\n<p>Смерть: «И здесь я. Не до конца понимаю, что на меня нашло. Возможно выброс адреналина. Но поднимаю ногу над еë головой и отпускаю. И повторяю. Пока не слышу характерный хрусть. Ломающий черепушки. И кровь у неë тоже черная».</p>\n<p>Что стало с телом, не сказано. Максим уходит домой (родители в командировке, никто не увидел «сына в чёрной крови»), утром сначала не верит произошедшему, но убеждается по разбросанной одежде в чёрной крови. Позже он «Также проверил заброшку. Ну там уже никого не было».</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0227-S08", "PS-0227--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имя не названо. «Лучница» — обозначение по роли.</li>\n<li>Мотив нападения не назван: почему она стреляла в Максима, в переписке не сказано.</li>\n<li>Мир, из которого она пришла, не назван; сказано только, что она чужемирец.</li>\n<li>Как она попала в мир Максима — не сказано.</li>\n<li>Что стало с телом после её смерти — не сказано; заброшка на следующий день оказалась пустой, кто её убрал и убирал ли кто-то, осталось нерешённым.</li>\n<li>Чем именно «странные» её два ножа — не описано.</li>\n<li>Действует ли она одна или связана с чужемирцами из леса — в переписке не разобрано.</li>\n<li>Реплик у персонажа нет; говорит ли она вообще — не сказано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0227--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0019.html\">Чужемирцы</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0019.html\">Чужемирцы</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0227--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-03-18</td>\n<td>305113–305115</td>\n<td>w0082</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-18</td>\n<td>305314–305325</td>\n<td>w0082</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0227-luchnica.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0227--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0227.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0227-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0227/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дороже всего — тонкая опора под всеми чужемирцами: <code>SP-0203</code> «Создание оружия из себя» (статья есть, 1 ссылка, база всего 2 067 знаков). Это единственное правило, объясняющее чёрные стрелы Лучницы, копья копейщиков из <code>PS-0228</code>, её же два ножа и вообще любое снаряжение вида, — и оно держится на двух репликах одного дня. При этом сами чужемирцы разложены на четыре записи с несопоставимым весом: <code>PS-0198</code> (статья, 58 680), <code>MR-0117</code> (2 ссылки, статья, 1 818), <code>MR-0100</code> (2 ссылки, статья, 3 285), <code>GR-0019</code> (статья, база 0). Материала под видом много, под правилом — почти ничего.</p>\n<p>Вторая дыра — лучница из леса. Записи о ней нет вообще: она есть в этой статье («Является ли эта лесная лучница таким же существом того же типа, не разобрано»), она же есть в <code>PS-0228</code> как третий противник в бою, и она же убита вербовщиком в <code>MR-0122</code>. Три статьи ссылаются на существо, у которого нет ни идентификатора, ни строки в базе, — из-за чего вопрос «одна лучница или две» нельзя даже задать формально.</p>\n<p>Третья, общая с соседями: <code>SL-0089</code> «Список категорий сил» — 4 ссылки, статьи нет, база 1 753. Мир, из которого она пришла, и её разряд внутри чужемирцев упираются в него.</p>\n<h3>С чего начать</h3>\n<p>В базе. Правило про оружие из себя лежит в <code>SP-0203</code>, окно 305314–305321, — и там же зафиксировано то, чего нет в этой статье: Слава прямо отмечает, что в текст сцены момент не внесён, и Миколай отвечает «красивая сцена» (305319). То есть реакция соавтора на сцену существует, просто она разъехалась в запись о способности.</p>\n<p>Как Максим её опознал и почему слышит натягиваемую тетиву — <code>SP-0182</code> «Чутьё на чужемирцев» (статья, 8 882) и <code>SP-0202</code> «Три факта Максима» (статья, 13 847); он сам как персонаж — <code>PS-0048</code> (статья, 70 202), полный текст сцены — <code>PR-0060</code> «Блог Максима» (статья, 31 165).</p>\n<p>В архив идти за мотивом и за телом. Ориентир узкий: окно w0082, 2025-03-18, участок 305325–305344 — то есть между тем местом, где обсуждение обрывается на цвете крови, и тем, где начинается разговор про фамилии. Если про мотив и про пустую заброшку говорили вообще, то там. Второй ориентир — 2025-03-19, окно w0083: в тот день Слава продолжает ту же линию (305855 и дальше), и уборка тел могла всплыть по ходу.</p>\n<h3>Как развивалось</h3>\n<p>Написали, спросили, ограничили в той же реплике, в текст не внесли, не вернулись. 2025-03-18, 305113–305115 — сцена целиком: появление, тактика, гибель. Стрелы и лук даны как данность, объяснения им нет. Через два с половиной часа, 305314–305325, Миколай задаёт два вопроса подряд — про юбку и про то, откуда берутся стрелы, — и правило вводится сразу вместе со своей границей: «могут создавать оружия из себя», «но трансформировать тело не могут». Заявление и ограничение здесь идут не последовательно, а одной парой сообщений. Тут же Слава фиксирует, что это пропуск в тексте, а не в замысле: «Но здесь я виноват. Забыл добавить момент». Текст после этого не переписывался. Обе версии — один день; третьей нет.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для оружия граница проведена явно и с двух сторон: делать из себя — можно, менять тело — нельзя. Для самого тела границы нет, хотя в сцене оно ведёт себя не по-человечески дважды: она настолько лёгкая, что от удара летит через комнату, и кровь у неё чёрная. Личное это или родовое — не сказано, и это тот же род вопроса, что и про оружие: свойство вида против свойства особи. Для одной половины пары правило названо, для второй — только два наблюдения из одного боя.</p>\n<h3>Отклик</h3>\n<p>Лучший кусок — двойной выстрел. Две стрелы в левое плечо и правое бедро, посланные так, что уклонение в любую сторону подставляет под вторую, — это не «крутой приём», это придуманная задача с одним решением, и решение честное: подпрыгнуть и выгнуться. То, что Максим описывает свою позу через буквы — сначала С, потом S, — смешно и точно одновременно, потому что так и правда думает человек, который пытается объяснить, как он изогнулся. Ещё зацепило молчание: у неё за всю сцену нет ни реплики, ни крика, и когда ей выворачивают локоть, она вместо крика бьёт другой рукой. Всё, что мы о ней знаем как о характере, вычитано из того, что она делает, и это выдержано до конца — включая финал, где она смотрит в потолок, а её мысли на этот счёт остаются догадкой рассказчика. Убийство при этом написано с той же обстоятельностью, что и всё остальное, и от этого читается тяжелее, чем, кажется, задумано.</p></div>", "r": []}];</script>
