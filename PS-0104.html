<script>const BASE="";const DOCNAME="Нуар";
const LEAD="<p>Персонаж, проходящий через две объявленные вселенные — «7 островов» и «Оам» — и через поздний набор окон 2026 года, где вселенная в переписке не названа. Разрабатывался с 2024-07-03 по 2026-06-09, 20 зафиксированных версий, окна w0041–w0044, w0066, w0109, w0112, w0120, w0121. Варианты написания имени в переписке: Нуар, Наур, нуар, нуару.</p>";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0104-S01", "PS-0104--proishozhdenie"], "h": "<p><strong>«7 островов» (2024-07-03, id 194774–194776, w0041).</strong> Появляется сразу в первом списке островов и их защитников (<a href=\"MR-0018.html\">7 островов</a>), вторым номером:</p>\n<div class=\"q\"><p>«7 островов<br>1 оазис ( Имитатор )<br>2 ??????( Нуар ( челек с растворением личности ))<br>3 асгар ( Избранный ( ты его не знаешь))»</p></div>\n<p>Остров под номером 2 названия не получает — на его месте стоят знаки вопроса. Там же Слава уточняет: «Остров это город ну или страна». Первый номер — Имитатор (<a href=\"PS-0383.html\">Имитатор</a>), третий — Избранный, защитник Асгарда (<a href=\"PS-0106.html\">Защитник Асгарда (Избранный)</a>).</p>\n<p>Через двадцать минут (2024-07-03, id 194812–194817) Миколай предлагает перенести его остров под воду: «может нуара под воду пошлём? там темноты дохуя», аргумент — «а то хули в небе есть кто-то, а ниже уровня земли нету никого». Слава принимает: «Вообще интересная идея», «И тьма будет держать воду как барьер». Тут же оговаривается цена: «Вот только если он сдохнет будет пиздец острову». Так возникает подводный остров Нуара (<a href=\"MR-0021.html\">Остров Нуара (подводный)</a>).</p>\n<p>О биографии человека Нуара в этом слое сказано только одно: сосуд у него был развит с самого начала — «А у Нуара изначально был развить сосуд» (2024-07-05, id 197938), «Так он с рождения со сильном сосудом» (id 197963).</p>\n<p><strong>Мир Оам (2025-11-17, id 385774–385779, w0109).</strong> Нуар переносится в новую систему как уже существующий старый персонаж: «Кстати нуар один из котов», «Помнишь нуара. Сильнеший из 7 островов». Миколай подтверждает, что помнит. Его роль в новом мире задана одной фразой: «Ну здесь он будет влиять на мир подобно волнами» (<a href=\"SP-0247.html\">Изменение мира волнами</a>, <a href=\"PS-0307.html\">Коты</a>). В сводке окна значится «один из девяти котов», но само число в этой переписке не произносится.</p>\n<p><strong>Современный мир с героями, злодеями и Нимбом (2026-06-02, id 487001, w0120).</strong> Здесь у него техногенное происхождение: он первый искусственный сверхчеловек (<a href=\"MR-0195.html\">Искусственные сверхлюди (ИС)</a>), полученный организацией Нимб (<a href=\"MR-0132.html\">Нимб</a>). Нимб проводит эксперименты без единой цели — «по типу создать искусственного сверхчеловека, создать лекарство на крови сверхчеловека и т.д.», — и с неэтичностью, о которой сказано так: «сотни тысяч людей умирают пробуя их лекарство. В экспериментах умирает ещё сотня и так далее». Итог: «Ну даже так им удалось создать первого искусственного сверх человека. Нуар».</p>\n<p>Общественные последствия его создания расписаны отдельно. Правительство после этого решило раскрыть, «какой нимб плохое», но общество, узнав об успехе, «начало наоборот продвигать эту идею», и другие организации тоже стали пытаться создать ИС (сокращение введено Славой прямо в сообщении: «я заебался писать. Поэтому ИС»). Ничем это не кончилось: разрешить такие эксперименты правительство не могло, а если бы разрешило — «сверхлюди конечно пошли против и это ни чем хорошим не кончилась». После Нуара удался только один проект по созданию ИС — проект апостолов, 12 созданных ИС, который на публику уже не раскрывали.</p>\n<p>Отличие Нуара от предшественников (2026-06-02, id 487006): ИС до него «в принципе не плохие», но «большинство из них теряли рассудок или у них появлялись дефекты тела или они умирали. Превращались в жижу ну и т. Д.». «Нуар первый ИС кто сохранил разум и получил способности без каких либо дефектов».</p>\n<p>Как «сильнейший из 7 островов» стал первым ИС Нимба и стал ли — в переписке не объяснено; версии просто идут одна за другой.</p>", "r": [["Имитатор", "PS-0383.html"], ["Защитник Асгарда (Избранный)", "PS-0106.html"], ["Коты", "PS-0307.html"], ["Изменение мира волнами", "SP-0247.html"], ["7 островов", "MR-0018.html"], ["Остров Нуара (подводный)", "MR-0021.html"], ["Искусственные сверхлюди (ИС)", "MR-0195.html"], ["Нимб", "MR-0132.html"]]}, {"t": "Внешность", "a": ["S02", "PS-0104-S02", "PS-0104--vneshnost"], "h": "<p>Прямого портрета в переписке почти нет.</p>\n<p>В окне 2024-07-03 (id 194836–194838) Слава, отвечая на путаницу Миколая, пишет подряд: «Нуар не наемник», затем «Чел с разными цвета глаз имеющий 2 способности Барьер и исцеление». Вторая реплика идёт следом за первой и по смыслу (барьер) сходится с ролью Нуара, но имя в ней не повторено — отнесение разноцветных глаз именно к Нуару в переписке прямо не сказано (ср. <a href=\"SP-0075.html\">Барьер и исцеление (способности помощника Имитатора)</a>, <a href=\"PS-0103.html\">Помощник Имитатора</a>).</p>\n<p>Из слоя 2026 года: он не стареет (2026-06-02, id 487001 и 487009), тело с «невероятное быстрая регенерация» и очень адаптивное.</p>\n<p>Единственное другое описание облика — в сцене 2026-06-09 (id 488828), где он ослеплён и находится внутри собственной тьмы: «Слепой существо жадно поедает его товарища», «голова во вся крови повернула голову в его сторону и смотрит слепыми глазами».</p>", "r": [["Помощник Имитатора", "PS-0103.html"], ["Барьер и исцеление (способности помощника Имитатора)", "SP-0075.html"]]}, {"t": "Характер", "a": ["S03", "PS-0104-S03", "PS-0104--harakter"], "h": "<p>Характер — то место, которое авторы сами отмечают как непридуманное. 2025-12-06 (id 393297): «Как и в семи островав, так и здесь я не смог придумать ему характер. Поможешь?» Ответа Миколая на эту просьбу в окне нет.</p>\n<p>Что при этом зафиксировано:</p>\n<ul>\n<li><strong>«хороший челик»</strong> (2024-07-03, id 194920). Реплика возникает в ответ на предложение Миколая раздать грехи и виды правления: «как думаешь, будем пихать тоталитаризм? … нуару например». Слава отказывает: «Ну нуар хороший челик. А вообще можно одному из островов». Тоталитаризм уходит от Нуара, его острову достаётся федеративная республика (<a href=\"MR-0025.html\">Режимы правления островов</a>), а грех Миколай решает отдать женщине.</li>\n<li><strong>Не наёмник</strong> (2024-07-03, id 194836). Прямое отсечение: Миколай спутал его с другим персонажем — «а, точняк, перепутал».</li>\n<li><strong>Лентяй</strong> (2024-07-04, id 196273). Прямой ответ на вопрос «че по его лору… не, по самому нуару» — одно слово: «Лентяй». Оно же подтверждается тем, как Слава отказывается пересказывать историю: «Я тебе писал про нуара», «Поищи мне лень».</li>\n<li><strong>Мотив защиты — солнышко.</strong> На вопрос «а че он решил всех защищать» ответ: «Из за солнышки» (2024-07-04, id 196286). Там же: «Всем сопровляеь солнышко». Что именно значит «солнышко» и кто это, в этом окне не разобрано (ср. <a href=\"PS-0113.html\">Солнышко</a>, <a href=\"PS-0105.html\">Человек со способностью солнца</a>); Миколай в соседней реплике говорит о человеке, который «пойдёт по своим делам наёмника, солнышко останется» (2024-07-03, id 194834), но это относится не к Нуару.</li>\n<li><strong>Роль</strong> сформулирована одним словом: «Защитник» (2024-07-04, id 196280).</li>\n<li><strong>Не хочет светиться</strong> (2026-06-03, id 487514). В разборе того, почему лицом ассоциации стал Праведник, а не другие столпы: «Нуар просто не хотел светиться, и напоминать людям о том что ИС такое сильные».</li>\n<li><strong>Любопытство, доведённое до перебора</strong> (2026-06-03, id 487514). В тренировочном бою со Святой девой, когда та ещё стремилась занять место столпа, «была сильная им избита». Мотив назван прямо: «Нуар переборщил потому что ему было интересно, как свет противостоит тьме». Последствие для неё — страх («Боится Нуара») и рост: «она после этого сильна выросла, потому что у неё появилась мотивация».</li>\n<li><strong>Страх смерти</strong> (2026-06-09, id 488828). В финальной сцене окна: «он испугался впервые за долгое время он ощутил страх смерти и его знания помутнилась». Формулировка «впервые за долгое время» — единственное, что сказано о его обычном отношении к смерти.</li>\n</ul>\n<div class=\"mnote\"><b>⚙ машинная заметка · Отклик — не материал авторов</b>\n<p>Зацепила последняя сцена, 2026-06-09. Персонажа два года не удавалось наделить характером — прямо, вслух, «я не смог придумать ему характер» — и характер в итоге приходит не описанием, а поступком: ослеплённый, выжатый, он разворачивает тьму, в которой нет ни света, ни звука, ни понимания, стоишь ты или лежишь, и жрёт людей. И дано это не с его стороны, а глазами инквизитора, который бежит на «звук чавканья, липкий звук хруста», думая, что бежит к своим. Причина вынесена автором в скобки одной строкой — испугался, впервые за долгое время ощутил страх смерти. Скобки тут работают лучше, чем работал бы абзац. До этого в тексте были только перечни способностей с радиусами и процентами, а здесь впервые видно, что за существо их носит.</p></div>", "r": [["Солнышко", "PS-0113.html"], ["Человек со способностью солнца", "PS-0105.html"], ["Режимы правления островов", "MR-0025.html"]]}, {"t": "Способности", "a": ["S04", "PS-0104-S04", "PS-0104--sposobnosti"], "h": "<h3>Версия «7 островов» (2024-07)</h3>\n<p><strong>Растворение личности.</strong> Названо в первом же представлении — «челек с растворением личности» (2024-07-03, id 194774). Механика ни в этом окне, ни дальше не раскрыта.</p>\n<p><strong>Тьма и барьер</strong> (<a href=\"SP-0076.html\">Тьма Нуара</a>, <a href=\"SP-0071.html\">Тьма</a>). Основная функция — держать воду вокруг подводного острова: «И тьма будет держать воду как барьер» (2024-07-03, id 194815). Барьер держится круглосуточно — в разговоре это формулируется как «24/7 держать барьер» (2024-07-05, id 197929).</p>\n<p>Принцип работы тьмы даёт Миколай (2024-07-04, id 196937): «тьма это как вакуум, он насыщается одним, и убирает другое по воли нуара». Тьма при этом не покрывает остров целиком — Слава возражает: «Тьма не окутывает весь остров», Миколай соглашается и уточняет, что она окутывает трубу: «остров не окутывает», «зато трубу» (<a href=\"MN-0001.html\">Трубы сферы</a>). Тьма способна выделять накопленное: «но она может выделять то что накопила». Разговор идёт вокруг вопроса Славы, откуда на подводном острове выходит углекислый газ и дым от костра; Миколай сводит это к правилу: «ну то что ты жгёшь, обязательно выделяет углекислый», «это правило мироздания», «а вообще, люди дышут, потребляя кислород, выделяют угль», «ну а он создаёт вредные условия для жизни», «поэтому от него надо избавляться».</p>\n<p>Вопрос Миколая «а вот тьма это миазмы?» (2024-07-03, id 194818) остался без ответа: Слава переспросил «Миазмы ?» и разговор ушёл в сторону.</p>\n<p><strong>Сосуд</strong> (<a href=\"SP-0086.html\">Система сил (сосуд)</a>). Общее правило системы сил формулирует Слава (2024-07-05, id 197927): «Мета люди с рождения получают силу из в нее, и они её использует. Энергия не бесконечная так как сосуд поглощает энергию который дадут и он заполняется и им надо его опустошить иначе сосуд лопнет». Тут же он сам ставит вопрос по Нуару: «Откуда у нуара столько энергии что бы 24/7 держать барьер». Ответ Миколая двойной: «ну он невьеьено большой сосуд» и «тем более он не один».</p>\n<p><strong>Две личности и грань</strong> (<a href=\"SP-0087.html\">Грань</a>). Вторая половина ответа раскрывается сразу: «у него две личности» (id 197935). Слава подхватывает и даёт определение грани (2024-07-05, id 197938):</p>\n<div class=\"q\"><p>«Что есть грань<br>Когда сосуд становится достаточно сильным он может на некоторой время черпать куда большей силы видо изменяй и способность и носителя<br>Так могут лишь люди сильным сосудом<br>А у Нуара изначально был развить сосуд и 2 личность грань, это видео измененный он»</p></div>\n<p>То есть вторая личность Нуара и есть его грань. Гранью, по той же реплике, могут пользоваться также кай (<a href=\"PS-0111.html\">Кай</a>) и Имитатор (<a href=\"PS-0383.html\">Имитатор</a>) — id 197940.</p>\n<p><strong>Исключение из отката.</strong> После использования грани способность недоступна «некоторая время неделю наверное» (2024-07-05, id 197957). «Это правила обходить только Нуар» (id 197961). Причина названа прямо: «Так он с рождения со сильном сосудом. И если он на неделю потерять способности. Минус остров» (id 197963).</p>\n<p><strong>Барьер и исцеление.</strong> В реплике 2024-07-03 (id 194838) назван набор из двух способностей — «Барьер и исцеление» — у человека с разными цветами глаз; принадлежность реплики Нуару по имени не подтверждена (см. «Внешность»).</p>\n<h3>Версия мира Оам (2025)</h3>\n<p><strong>Влияние волнами</strong> (<a href=\"SP-0247.html\">Изменение мира волнами</a>). «Ну здесь он будет влиять на мир подобно волнами» (2025-11-17, id 385779). Как это соотносится с тьмой, сосудом и гранью — в переписке не сказано.</p>\n<h3>Версия 2026 года (мир Нимба и столпов)</h3>\n<p>Слава прямо помечает эту версию как доработку прежней, а не как нового персонажа: «Ну начнём с Нуара. Ведь я просто добавил пару способности и улучшил тьму» (2026-06-02, id 487008).</p>\n<p><strong>Общие особенности ИС</strong> (2026-06-02, id 487009), общие у Нуара и апостолов: «Они не стареют, у них невероятное быстрая регенерация тела. И их тела очень адаптивные». Плюс оговорка: «Ну ещё несколько особенностей которых я прям здесь не скажу».</p>\n<p><strong>Четыре способности</strong> (2026-06-02, id 487010), которые он «способен использовать одновременно» (2026-06-07, id 488546):</p>\n<ul>\n<li><strong>Кровь</strong> (<a href=\"SP-0265.html\">Кровь</a>). «Может управлять собственное кровью, а из-за регенерация он может вырабатывать эту кровь дофига».</li>\n<li><strong>Слова</strong> (<a href=\"SP-0266.html\">Слова</a>). «Он может отдавать приказы и люди повинуются». Ограничения даны тут же: «Не особо действительно против сильных противников. Да и он не может сказать убить себя или навредить себе, инстинкт самосохранения просто не даст этого сделать».</li>\n<li><strong>Молния</strong> (<a href=\"SP-0267.html\">Молния</a>). «Ну здесь говорить особого не чево просто плюс разрушительный навык».</li>\n<li><strong>Тьма</strong> (<a href=\"SP-0071.html\">Тьма</a>). «Ну он просто пропитывает всё своё тьмой. Всё воздух, землю, воду. Всё что не имеет инстинктов или разума попадають под воздействия тьмы ( то есть даже деревья и трава превращается во тьму). И эту тьму Наур может полностью контролировать и перемещаться в ней». Радиус области тьмы — «примерно 3 км». Отдельный эффект области: «в области тьмы способности нуар становяться мощнее, а способности противников слабее».</li>\n</ul>\n<p><strong>Особое усиление (ОУ)</strong> (<a href=\"SP-0127.html\">Особое усиление</a>). Владеет, но не пользуется (2026-06-07, id 488546): «Наур также владеет оу. Но не применяет так как у него итак четыре способности который он способен использовать одновременно. Также оу нельзя применить с комбинации с чем либо, с какой либо способностью».</p>\n<p><strong>Оам</strong> (<a href=\"MR-0164.html\">Оам</a>). «Также у нуара больше всего Оам» (2026-06-03, id 487531).</p>\n<p><strong>Новая тьма</strong> (2026-06-09, id 488828). Открыта в состоянии ослепления и помутнения, отличается от прежней и размером, и свойствами: «Область тьма маленькая, по сравнению какой он делал её раньше, но люди попав в эту тьму не видели света, не слышали звуков, они не были даже уверены стоят ли они или лежат, и идут. Пытаюсь использовать оам, он просто чём-то поглащался». Внутри этой области он сам описан как «слепой существо», поедающее людей.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Третье — <code>MR-0195</code> «Искусственные сверхлюди (ИС)»: статьи нет, база 5986. Это определение, через которое описан весь Нуар после 2026-06-02, и под ним материала меньше, чем под тремя его новыми способностями вместе (<code>SP-0265</code> 3190, <code>SP-0266</code> 3384, <code>SP-0267</code> 3183). Здесь дыра не в сборке, а в исходнике: собирать почти не из чего.</p></div>\n<div class=\"mnote\"><b>⚙ машинная заметка · Как развивалось — не материал авторов</b>\n<p>2024-07-03 заявлен как защитник второго острова с «растворением личности» — и в тот же день ограничен: остров уходит под воду, тьма держит воду, его смерть означает гибель острова. 2024-07-04–05 под него подводят общую механику (сосуд, грань, недельный откат) и тут же делают из неё исключение лично для него. 2024-12-13 остаётся одним именем в перечне сильнейших. 2025-11-17 переносится в Оам одной фразой про волны. 2025-12-06 назван одним из трёх сильнейших, характер по-прежнему не придуман. 2026-06-02 переписан под новый мир: четыре способности, ИС, столпы. 2026-06-03 введена Святая дева и в тот же день отменена. 2026-06-09 последняя сцена. Сосуд, грань, откат и волны в слое 2026 года не упоминаются и не отменяются.</p></div>\n<div class=\"mnote\"><b>⚙ машинная заметка · Что не сформулировано по вашей же логике — не материал авторов</b>\n<p>Недельный откат после грани введён как общее правило — и сразу же с исключением для Нуара, с названной причиной: неделя без него = минус остров. По той же реплике (2024-07-05, id 197940) гранью пользуются ещё двое — кай и Имитатор, а Имитатор при этом тоже защитник острова, оазиса. Для них того же вопроса не поставлено: держат ли они что-нибудь постоянно и что делается с их островами в ту неделю, когда способность недоступна. Правило и цена исключения проговорены для одного носителя из трёх.</p></div>", "r": [["Кай", "PS-0111.html"], ["Имитатор", "PS-0383.html"], ["Тьма Нуара", "SP-0076.html"], ["Тьма", "SP-0071.html"], ["Система сил (сосуд)", "SP-0086.html"], ["Грань", "SP-0087.html"], ["Изменение мира волнами", "SP-0247.html"], ["Кровь", "SP-0265.html"], ["Слова", "SP-0266.html"], ["Молния", "SP-0267.html"], ["Особое усиление", "SP-0127.html"], ["Оам", "MR-0164.html"], ["Трубы сферы", "MN-0001.html"]]}, {"t": "Связи с другими", "a": ["S05", "PS-0104-S05", "PS-0104--svyazi-s-drugimi"], "h": "<p><strong>Имитатор</strong> (<a href=\"PS-0383.html\">Имитатор</a>). Союзник — «имитатор союзник нуара» (2024-07-04, id 196287). В списке островов Имитатор идёт первым (оазис, <a href=\"MR-0020.html\">Оазис</a>), Нуар вторым. Оба вместе с Палачом и Смотрящим перечислены как сильнейшие (2024-12-13, id 269820). Имитатор, наряду с кай, может пользоваться гранью (2024-07-05, id 197940).</p>\n<p><strong>Палач</strong> (<a href=\"PS-0171.html\">Палач</a>), <strong>Смотрящий</strong> (<a href=\"PS-0172.html\">Смотрящий</a>). Названы рядом с ним в перечне сильнейших (2024-12-13, id 269820); разговор о том, какой у них уровень силы (<a href=\"MR-0081.html\">Шкала уровней сил 1-10</a>), ни к чему не пришёл — Миколай: «ну вводить четкие уровни силы идея сложная кнш», Слава: «Да ито она наверное не раз смениться».</p>\n<p><strong>Коты</strong> (<a href=\"PS-0307.html\">Коты</a>). В мире Оам Нуар входит в котов (2025-11-17, id 385774). В шапке записи это же отмечено как «часть чего: Коты».</p>\n<p><strong>Граф</strong> (<a href=\"PS-0323.html\">Граф</a>). В мире Оам Граф — второй из трёх сильнейших, апостол, «опять отсылка на семь островов» (2025-12-06, id 393298). В версии 2026 года оба входят в шесть столпов героев (<a href=\"PS-0366.html\">Шесть столпов героев</a>): «В ней входит граф и нуар» (2026-06-02, id 487002). В перечне причин, почему тот или иной столп не стал лицом ассоциации (<a href=\"MR-0194.html\">Ассоциация</a>), Граф идёт рядом с Нуаром: «Граф часто раздражённый / Нуар просто не хотел светиться».</p>\n<p><strong>Изб</strong> (<a href=\"PS-0370.html\">Изб</a>). Назван третьим в списке персонажей на разбор вместе с Графом и Нуаром (2026-06-02, id 487007); в списке непригодных на роль лица ассоциации — «Изб не устойчив».</p>\n<p><strong>Праведник</strong> (<a href=\"PS-0372.html\">Праведник</a>). Лицо ассоциации, которым Нуар быть не захотел (2026-06-03, id 487514).</p>\n<p><strong>Серафим.</strong> «Нет серафим не сильнее Нуар. Они плюс минус равны по силе, но просто Пламя Серафима представляет опасность» (2026-06-03, id 487531).</p>\n<p><strong>Святая дева</strong> (<a href=\"PS-0373.html\">Святая дева</a>). Девушка с золотыми волосами, способность — свет (<a href=\"SP-0275.html\">Способность света Святой девы</a>), боец ближнего боя со своим стилем. Боится Нуара из-за тренировочного боя, в котором он её сильно избил из интереса, «как свет противостоит тьме» (2026-06-03, id 487514). В следующем сообщении персонаж отменён: «Святая дева её больше нет как персонаж вообще» (2026-06-03, id 487531).</p>\n<p><strong>Фатик</strong> (<a href=\"PS-0374.html\">Фатик</a>). Заменила Святую деву — «желтоволосая девчушка» со способностью управления фотонами (<a href=\"SP-0276.html\">Управление фотонами</a>), столп злодеев (<a href=\"PS-0367.html\">Шесть столпов злодеев</a>), глава секты Фалим (<a href=\"MR-0197.html\">Секта Фалим</a>). Её выбросы фотонов прямо описаны как защита «например от тьмы Нуара» (2026-06-03, id 487531). Бой Нуара с ней и его исход — см. «Что с ним стало».</p>\n<p><strong>Инквизиторы</strong> (<a href=\"MR-0203.html\">Инквизиторы</a>). Отряд, атаковавший Нуара после боя с Фатикой (2026-06-09, id 488828). Все убиты. В секте Фалим, по той же переписке, состоит инквизитор с чистой Оам.</p>\n<p><strong>Апостолы.</strong> Второй и единственный после Нуара удавшийся проект ИС, 12 созданных, на публику не раскрывался (2026-06-02, id 487001). Разделяют с ним особенности ИС — нестарение, регенерация, адаптивное тело.</p>\n<p><strong>Нимб</strong> (<a href=\"MR-0132.html\">Нимб</a>). Организация-создатель.</p>\n<p><strong>Доима</strong> (<a href=\"PS-0375.html\">Доима (дочь Имета)</a>) <strong>и фантазёр-ключ</strong> (<a href=\"PS-0270.html\">Фантазёры</a>, <a href=\"MR-0202.html\">Фантазёры и провал в свой мир</a>). В инциденте с дырой между мирами (2026-06-07, id 488439) Нуар пытается убить фантазёра, которого группа Доимы защищает.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · С чего начать — не материал авторов</b>\n<p>В базе лежит почти весь слой 2026 года, просто россыпью и без статей: <code>PS-0370</code> Изб — 22546, <code>MR-0202</code> «Фантазёры и провал в свой мир» — 15226, <code>MR-0194</code> Ассоциация — 13631, <code>PS-0375</code> Доима — 9036, <code>PS-0372</code> Праведник — 8228, <code>PS-0374</code> Фатик — 6604, <code>PS-0366</code> «Шесть столпов героев» — 6416, <code>MR-0203</code> Инквизиторы — 6057, <code>MR-0197</code> «Секта Фалим» — 3282. Отдельно <code>PR-0125</code> «После битвы с Фатикой (Нуар и отряд инквизиторов)» — 3022, ноль ссылок: это ровно та финальная сцена, которой заканчивается статья. И дубль: столпы злодеев заведены дважды — <code>MR-0196</code> (4551) и <code>PS-0367</code> (3270), плюс <code>SL-0145</code> «Расклад сил вселенной героев и злодеев» (2645) без статьи.</p></div>", "r": [["Имитатор", "PS-0383.html"], ["Палач", "PS-0171.html"], ["Смотрящий", "PS-0172.html"], ["Коты", "PS-0307.html"], ["Граф", "PS-0323.html"], ["Шесть столпов героев", "PS-0366.html"], ["Изб", "PS-0370.html"], ["Праведник", "PS-0372.html"], ["Святая дева", "PS-0373.html"], ["Фатик", "PS-0374.html"], ["Шесть столпов злодеев", "PS-0367.html"], ["Доима (дочь Имета)", "PS-0375.html"], ["Фантазёры", "PS-0270.html"], ["Способность света Святой девы", "SP-0275.html"], ["Управление фотонами", "SP-0276.html"], ["Оазис", "MR-0020.html"], ["Шкала уровней сил 1-10", "MR-0081.html"], ["Ассоциация", "MR-0194.html"], ["Секта Фалим", "MR-0197.html"], ["Инквизиторы", "MR-0203.html"], ["Нимб", "MR-0132.html"], ["Фантазёры и провал в свой мир", "MR-0202.html"]]}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0104-S06", "PS-0104--kak-menyalsya"], "h": "<p><strong>2024-07-03, id 194774–194776.</strong> Защитник второго острова, «челек с растворением личности». Остров без названия.</p>\n<p><strong>2024-07-03, id 194812–194821.</strong> Остров переносится под воду, тьма назначается тем, что держит воду. Фиксируется зависимость острова от его жизни. Миколай допускает, что таких, как он, может быть больше: «возможно он не один такой». Вопрос про миазмы задан и не закрыт.</p>\n<p><strong>2024-07-03, id 194834–194838.</strong> Уточнение: «Нуар не наемник» — Миколай перепутал его с другим персонажем.</p>\n<p><strong>2024-07-03, id 194917–194922.</strong> Отклонённый вариант: Миколай предлагал отдать Нуару тоталитаризм. Отказ по характеру — «Ну нуар хороший челик». Тоталитаризм уходит на один из островов, острову Нуара достаётся федеративная республика, грех перераспределяется женщине.</p>\n<p><strong>2024-07-04, id 196253–196290.</strong> Отклонённый вариант: Миколай пытается вернуть его с округами на сушу («все те округи нуару уходят», «обратно на сушу идём»), Слава настаивает — «Нет», «И точка», «Все воду идем», «Он». Решение остаётся за водой. В этом же окне добавлены: характер «Лентяй», роль «Защитник», мотив «Из за солнышки», союз с Имитатором. Подробный лор Слава пересказывать отказывается, отсылая к более раннему разговору.</p>\n<p><strong>2024-07-04, id 196930–196952.</strong> Разбор жизнеобеспечения подводного острова. Тьма получает механику вакуума, работающего «по воли нуара»; уточняется, что весь остров она не окутывает.</p>\n<p><strong>2024-07-05, id 197926–197940.</strong> Введён сосуд как общий механизм. Проблема бесконечного барьера решена двумя добавками: невероятно большой сосуд и вторая личность, которая тут же отождествлена с гранью — «это видео измененный он». Сосуд у Нуара развит с рождения.</p>\n<p><strong>2024-07-05, id 197956–197965.</strong> Введён недельный откат после грани и сразу же — исключение для Нуара, обоснованное последствиями для острова.</p>\n<p><strong>2024-12-13, id 269818–269824.</strong> Только имя, в перечне сильнейших. Попытка задать уровни сил не доведена до результата.</p>\n<p><strong>2025-11-17, id 385774–385779.</strong> Перенос в мир Оам. Старая роль («Сильнеший из 7 островов») сохраняется как отсылка, новая — один из котов, влияющий на мир «подобно волнами».</p>\n<p><strong>2025-12-06, id 393295–393300.</strong> Определён как первый из трёх сильнейших мира: «1 это нуар из котов, он один из сильнейших. Вообще грубо говоря будет 3 сильнейших. И вот нуар один из них». Двое других — апостол Граф и девушка на стороне людей со способностью фантазёра с волнами (<a href=\"PS-0327.html\">Девушка, изменяющая мир волнами</a>). Характер по-прежнему не придуман, Слава просит помощи.</p>\n<p><strong>2026-06-02, id 487001–487002.</strong> Новая вселенная: современный мир, ассоциация героев, злодеи, Нимб, секта. Нуар — первый ИС, не стареет, владеет несколькими способностями, входит в шесть столпов героев.</p>\n<p><strong>2026-06-02, id 487006–487009.</strong> Добавлено отличие от прежних ИС (сохранил разум, без дефектов) и общие особенности ИС. Слава отмечает объём правки: «я просто добавил пару способности и улучшил тьму».</p>\n<p><strong>2026-06-02, id 487010.</strong> Полный перечень способностей: кровь, слова, молния, тьма. Радиус тьмы 3 км, усиление своих и ослабление чужих способностей внутри области.</p>\n<p><strong>2026-06-03, id 487514–487516.</strong> Разобрано, почему он не лицо ассоциации. Введена Святая дева и её история с ним.</p>\n<p><strong>2026-06-03, id 487531–487532.</strong> Уточнено соотношение с Серафимом (примерно равны), назван обладателем наибольшего количества Оам. Святая дева отменена, на её место как столп злодеев поставлена Фатик, чьи способности сразу описаны с оглядкой на тьму Нуара.</p>\n<p><strong>2026-06-07, id 488439–488440.</strong> Участие в инциденте с дырой между мирами.</p>\n<p><strong>2026-06-07, id 488546.</strong> Владение ОУ и причина его неприменения.</p>\n<p><strong>2026-06-09, id 488828.</strong> Бой с Фатикой, нападение инквизиторов, срыв и новая тьма.</p>", "r": [["Девушка, изменяющая мир волнами", "PS-0327.html"]]}, {"t": "Что с ним стало", "a": ["S07", "PS-0104-S07", "PS-0104--chto-s-nim-stalo"], "h": "<p>Отдельного финала у версии «7 островов» в переписке нет — последнее состояние там: защитник подводного острова, держащий барьер круглосуточно, единственный, кто обходит недельный откат.</p>\n<p>В версии 2026 года зафиксированы два события.</p>\n<p><strong>Инцидент с дырой между мирами</strong> (2026-06-07, id 488439). Доима, дочь Имитатора и сотрудница Нимба, схватила фантазёра, «что был на грани провалиться в свой мир», и артефактом открыла путь из его мира в этот — в центре города. Её группа защищала фантазёра как ключ, держащий дыру открытой; столпы героев выводили людей и сражались с существами, вылезшими из другого мира — «некоторый из этих существ были очень сильными, и их также была десятки тысячи». Роль Нуара описана первой:</p>\n<div class=\"q\"><p>«поэтому в тот день сначала поглотила тьма нуара. (Которой с помощью тьмы спасал граждан, убивал монстров и помогал другим героем, в радиусе 3 км, при этом и сам сражался с достаточно сильным существом и также пытался убить фантазера, которого очень сильно защищали )»</p></div>\n<p>После его тьмы «мир окрасился черно белый». Эксперимент — «можно ли объединить миры» — не удался, но Доима осталась довольна результатом.</p>\n<p><strong>После боя с Фатикой</strong> (2026-06-09, id 488828). Он побеждает, но не убивает: «Оставляет её в живых и уходит. Уставший и потративший много оам, больше чем когда либа». Далеко отойти не успевает — его атакует отряд инквизиторов. Ослабленный и невосстановившийся, он пытается отбиваться, но его ослепляют: «лишают зрения и чувство, он в полной тьме». Дальше — «к нему проиходит озарение он использует тьму», и разворачивается область новой тьмы, где нет света, звука, ощущения собственного положения и работы Оам.</p>\n<p>Сцена внутри области дана глазами инквизитора: он слышит звук и «с облегчением побежал на звук звук чавканья, липкий звук хруста», видит, как «слепой существо жадно поедает его товарища», пытается использовать Оам — не выходит, «что-то его поглощает», начинает отступать не дыша, «он боялся издать хоть малейшее звук», но «голова во вся крови повернула голову в его сторону и смотрит слепыми глазами».</p>\n<p>Итог и объяснение вынесены в скобки самим автором: «(Всё инквизиторы были убиты.) ( почему нуар так поступил, он испугался впервые за долгое время он ощутил страх смерти и его знания помутнилась)».</p>\n<p>Что было после этого — в переписке не сказано. Это последнее по времени сообщение о персонаже.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0104-S08", "PS-0104--probely"], "h": "<div class=\"gaps\"><ul>\n<li><strong>«Растворение личности»</strong> названо в первом же описании (2024-07-03) и больше нигде не объясняется. Как эта способность связана с двумя личностями и гранью, введёнными двумя днями позже, в переписке не сказано.</li>\n<li><strong>Название второго острова</strong> так и не придумано — в списке стоят «??????».</li>\n<li><strong>Миазмы.</strong> Вопрос «а вот тьма это миазмы?» остался без ответа.</li>\n<li><strong>«возможно он не один такой»</strong> (2024-07-03, id 194821) — реплика не развита, есть ли другие носители такой тьмы, не сказано.</li>\n<li><strong>Лор в окне w0042</strong> не изложен: Слава отсылает к более раннему разговору («Я тебе писал про нуара», «Поищи мне лень»), и содержание того разговора в записи отсутствует.</li>\n<li><strong>Вторая личность</strong> не получила ни имени, ни собственного характера, ни описания того, как две личности взаимодействуют. Сказано только, что вторая — это грань, «это видео измененный он».</li>\n<li><strong>Характер.</strong> Прямо помечен автором как непридуманный и в «7 островах», и в Оам (2025-12-06): «я не смог придумать ему характер. Поможешь?». Ответа Миколая на эту просьбу в записи нет.</li>\n<li><strong>Уровни сил.</strong> Попытка присвоить сильнейшим (включая Нуара) числовые уровни не доведена до конца (2024-12-13).</li>\n<li><strong>Число котов.</strong> В переписке сказано только «один из котов»; сколько их, в этих сообщениях не названо.</li>\n<li><strong>Связь между версиями.</strong> Переносы «7 островов» → Оам и Оам → мир Нимба помечены авторами как отсылки к прежнему персонажу («Помнишь нуара», «опять отсылка на семь островов»), но соотношение вселенных между собой — один ли это персонаж, разные ли инкарнации — в переписке не разобрано. В шапке записи вселенная поздних окон (w0120, w0121) значится как неясная.</li>\n<li><strong>Соотношение способностей разных слоёв.</strong> Сосуд, грань, обход отката и влияние волнами в слое 2026 года не упоминаются, но и не отменяются.</li>\n<li><strong>Часть особенностей ИС не раскрыта</strong> сознательно: «Ну ещё несколько особенностей которых я прям здесь не скажу» (2026-06-02).</li>\n<li><strong>Сообщение 487532</strong> («Конечно он ебанутый. Он блять каждый Божий день слышат крики о помощи. Его каждую ночь мучуют кошмары») стоит в цепочке версий персонажа, но чьи способности там описаны, не названо; мольбы слышит Праведник (<a href=\"PS-0372.html\">Праведник</a>).</li>\n<li><strong>«Карен»</strong> (2026-06-07, id 488439) — в описании инцидента сказано «Карен начала вести ещё большую поддержку», кто это, в переписке не пояснено.</li>\n<li><strong>Судьба после срыва</strong> (2026-06-09) не описана: что стало с самим Нуаром, вышел ли он из этого состояния, узнал ли кто-то о случившемся — не сказано.</li>\n<li><strong>Кто такое «солнышко»</strong>, из-за которого он стал защищать всех, в окнах 2024-07 не разобрано.</li>\n</ul></div>", "r": [["Праведник", "PS-0372.html"]]}, {"t": "Связи — всё вместе", "a": ["PS-0104--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0030.html\">Защитники островов</a>, <a href=\"GR-0057.html\">Коты (девять котов)</a></li>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0103.html\">Помощник Имитатора</a>, <a href=\"PS-0105.html\">Человек со способностью солнца</a>, <a href=\"PS-0106.html\">Защитник Асгарда (Избранный)</a>, <a href=\"PS-0111.html\">Кай</a>, <a href=\"PS-0113.html\">Солнышко</a>, <a href=\"PS-0171.html\">Палач</a>, <a href=\"PS-0172.html\">Смотрящий</a>, <a href=\"PS-0270.html\">Фантазёры</a>, <a href=\"PS-0307.html\">Коты</a>, <a href=\"PS-0323.html\">Граф</a>, <a href=\"PS-0327.html\">Девушка, изменяющая мир волнами</a>, <a href=\"PS-0366.html\">Шесть столпов героев</a>, <a href=\"PS-0367.html\">Шесть столпов злодеев</a>, <a href=\"PS-0370.html\">Изб</a>, <a href=\"PS-0372.html\">Праведник</a>, <a href=\"PS-0373.html\">Святая дева</a>, <a href=\"PS-0374.html\">Фатик</a>, <a href=\"PS-0375.html\">Доима (дочь Имета)</a>, <a href=\"PS-0383.html\">Имитатор</a></li>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0071.html\">Тьма</a>, <a href=\"SP-0075.html\">Барьер и исцеление (способности помощника Имитатора)</a>, <a href=\"SP-0076.html\">Тьма Нуара</a>, <a href=\"SP-0086.html\">Система сил (сосуд)</a>, <a href=\"SP-0087.html\">Грань</a>, <a href=\"SP-0127.html\">Особое усиление</a>, <a href=\"SP-0247.html\">Изменение мира волнами</a>, <a href=\"SP-0265.html\">Кровь</a>, <a href=\"SP-0266.html\">Слова</a>, <a href=\"SP-0267.html\">Молния</a>, <a href=\"SP-0275.html\">Способность света Святой девы</a>, <a href=\"SP-0276.html\">Управление фотонами</a></li>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0018.html\">7 островов</a>, <a href=\"MR-0020.html\">Оазис</a>, <a href=\"MR-0021.html\">Остров Нуара (подводный)</a>, <a href=\"MR-0025.html\">Режимы правления островов</a>, <a href=\"MR-0081.html\">Шкала уровней сил 1-10</a>, <a href=\"MR-0132.html\">Нимб</a>, <a href=\"MR-0164.html\">Оам</a>, <a href=\"MR-0194.html\">Ассоциация</a>, <a href=\"MR-0195.html\">Искусственные сверхлюди (ИС)</a>, <a href=\"MR-0197.html\">Секта Фалим</a>, <a href=\"MR-0202.html\">Фантазёры и провал в свой мир</a>, <a href=\"MR-0203.html\">Инквизиторы</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0030.html\">Защитники островов</a>, <a href=\"GR-0057.html\">Коты (девять котов)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0008.html\">Оам</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0104--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-03</td>\n<td>194774–194776</td>\n<td>w0041</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-03</td>\n<td>194812–194821</td>\n<td>w0041</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-03</td>\n<td>194834–194838</td>\n<td>w0041</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-03</td>\n<td>194917–194922</td>\n<td>w0041</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-04</td>\n<td>196253–196290</td>\n<td>w0042</td>\n<td>7 островов (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2024-07-04</td>\n<td>196930–196952</td>\n<td>w0043</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-05</td>\n<td>197926–197937</td>\n<td>w0044</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-05</td>\n<td>197937–197940</td>\n<td>w0044</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-05</td>\n<td>197956–197965</td>\n<td>w0044</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-13</td>\n<td>269818–269824</td>\n<td>w0066</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-11-17</td>\n<td>385774–385779</td>\n<td>w0109</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-06</td>\n<td>393295–393300</td>\n<td>w0112</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-02</td>\n<td>487001–487002</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-02</td>\n<td>487006–487009</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-02</td>\n<td>487010–487010</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-03</td>\n<td>487514–487516</td>\n<td>w0121</td>\n<td>неясно (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2026-06-03</td>\n<td>487531–487532</td>\n<td>w0121</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-07</td>\n<td>488439–488440</td>\n<td>w0121</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-07</td>\n<td>488546–488546</td>\n<td>w0121</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-09</td>\n<td>488828–488828</td>\n<td>w0121</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0104-nuar.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0104--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0104.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0104-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0104/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым чинить апостолов. <code>SL-0054</code> «Список 12 апостолов» — 7 ссылок, статьи нет, база 234052 знака; это самая нагруженная запись справочника без статьи. Нуара весь слой 2026 года описывает через них: он первый ИС, они — второй и единственный удавшийся проект после него, особенности (нестарение, регенерация, адаптивное тело) у них общие. Пока апостолов нет, у половины биографии Нуара нет второго берега.</p>\n<p>Второе — <code>PS-0375</code> «Доима (дочь Имета)»: 4 ссылки, статьи нет, база 9036. Она и в этой статье, и в статье о Нимбе держит целый эпизод (дыра между мирами, 2026-06-07). При этом рядом живёт <code>PS-0324</code> «Дочь Имитатора» — 5 ссылок, статья есть, база 9403. Похоже на одного человека в двух записях; пока это не решено, девять ссылок расходятся по разным адресам.</p>\n<p>Третье — <code>MR-0195</code> «Искусственные сверхлюди (ИС)»: статьи нет, база 5986. Это определение, через которое описан весь Нуар после 2026-06-02, и под ним материала меньше, чем под тремя его новыми способностями вместе (<code>SP-0265</code> 3190, <code>SP-0266</code> 3384, <code>SP-0267</code> 3183). Здесь дыра не в сборке, а в исходнике: собирать почти не из чего.</p>\n<h3>С чего начать</h3>\n<p>В базе лежит почти весь слой 2026 года, просто россыпью и без статей: <code>PS-0370</code> Изб — 22546, <code>MR-0202</code> «Фантазёры и провал в свой мир» — 15226, <code>MR-0194</code> Ассоциация — 13631, <code>PS-0375</code> Доима — 9036, <code>PS-0372</code> Праведник — 8228, <code>PS-0374</code> Фатик — 6604, <code>PS-0366</code> «Шесть столпов героев» — 6416, <code>MR-0203</code> Инквизиторы — 6057, <code>MR-0197</code> «Секта Фалим» — 3282. Отдельно <code>PR-0125</code> «После битвы с Фатикой (Нуар и отряд инквизиторов)» — 3022, ноль ссылок: это ровно та финальная сцена, которой заканчивается статья. И дубль: столпы злодеев заведены дважды — <code>MR-0196</code> (4551) и <code>PS-0367</code> (3270), плюс <code>SL-0145</code> «Расклад сил вселенной героев и злодеев» (2645) без статьи.</p>\n<p>В архив — за двумя вещами. За характером: 2025-12-06, id 393297, окно w0112 — прямая просьба «Поможешь?», ответа в записи нет; смотреть 393298 и дальше по окну, отвечал ли Миколай вообще. И за пропавшим лором: 2024-07-04, id 196273, Слава отсылает к более раннему разговору — «Я тебе писал про нуара», «Поищи мне лень». Этот разговор должен быть левее 194774, то есть до 2024-07-03 и до окна w0041.</p>\n<h3>Как развивалось</h3>\n<p>2024-07-03 заявлен как защитник второго острова с «растворением личности» — и в тот же день ограничен: остров уходит под воду, тьма держит воду, его смерть означает гибель острова. 2024-07-04–05 под него подводят общую механику (сосуд, грань, недельный откат) и тут же делают из неё исключение лично для него. 2024-12-13 остаётся одним именем в перечне сильнейших. 2025-11-17 переносится в Оам одной фразой про волны. 2025-12-06 назван одним из трёх сильнейших, характер по-прежнему не придуман. 2026-06-02 переписан под новый мир: четыре способности, ИС, столпы. 2026-06-03 введена Святая дева и в тот же день отменена. 2026-06-09 последняя сцена. Сосуд, грань, откат и волны в слое 2026 года не упоминаются и не отменяются.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Недельный откат после грани введён как общее правило — и сразу же с исключением для Нуара, с названной причиной: неделя без него = минус остров. По той же реплике (2024-07-05, id 197940) гранью пользуются ещё двое — кай и Имитатор, а Имитатор при этом тоже защитник острова, оазиса. Для них того же вопроса не поставлено: держат ли они что-нибудь постоянно и что делается с их островами в ту неделю, когда способность недоступна. Правило и цена исключения проговорены для одного носителя из трёх.</p>\n<h3>Отклик</h3>\n<p>Зацепила последняя сцена, 2026-06-09. Персонажа два года не удавалось наделить характером — прямо, вслух, «я не смог придумать ему характер» — и характер в итоге приходит не описанием, а поступком: ослеплённый, выжатый, он разворачивает тьму, в которой нет ни света, ни звука, ни понимания, стоишь ты или лежишь, и жрёт людей. И дано это не с его стороны, а глазами инквизитора, который бежит на «звук чавканья, липкий звук хруста», думая, что бежит к своим. Причина вынесена автором в скобки одной строкой — испугался, впервые за долгое время ощутил страх смерти. Скобки тут работают лучше, чем работал бы абзац. До этого в тексте были только перечни способностей с радиусами и процентами, а здесь впервые видно, что за существо их носит.</p></div>", "r": []}];</script>
