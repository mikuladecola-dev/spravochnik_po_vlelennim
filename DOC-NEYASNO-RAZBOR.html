<script>const BASE="";const DOCNAME="«Неясно»: разбор по периодам";

const CH=[{"t": "Что показал разбор", "a": ["DOC-NEYASNO-RAZBOR--chto-pokazal-razbor"], "h": "<p>Записей разобрано: <strong>247</strong>.</p>\n<p>Главное: «неясно» — это в основном <strong>не безымянный материал, а материал безымянных вселенных</strong>. Вы объявляли новую вселенную, работали в ней неделями, но имени ей так и не давали. По твоему же правилу вселенная определяется объявлением в чате и датой — значит, эти периоды существуют, просто у них нет названия.</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Периодов-без-имени</th>\n<th>Записей в них</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>14</td>\n<td>196</td>\n</tr>\n</tbody>\n</table></div>\n<p>Отдельно: <strong>51</strong> записей старше первого объявления вселенной вообще (до 2023-12-26) — это ранняя переписка, когда вселенных ещё не заводили.</p>", "r": []}, {"t": "Периоды", "a": ["DOC-NEYASNO-RAZBOR--periody"], "h": "<h3>простая вселенная — современный мир с героями и злодеями (название в чате не дано)</h3>\n<p><strong>Объявлено 2026-06-02, id 486999</strong>, окно w0120</p>\n<p>Что было объявлено: Слава просит не кидать тапками из-за смены вселенной и объявляет новую простую вселенную: Ассоциация, злодеи, Нимб, культ; из неё вышли новый персонаж Изб и улучшенный Нуар</p>\n<p>Записей «неясно» в этих датах: <strong>63</strong></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>id</th>\n<th>имя</th>\n<th>вид</th>\n<th>даты</th>\n<th>материал</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>ID-0169</code></td>\n<td>Чёрный цвет как поглотитель света</td>\n<td>идея</td>\n<td>2026-06-09 — 2026-06-09</td>\n<td><a href=\"kb/ID-0169-chernyy-cvet-kak-poglotitel-sveta.html\">запись</a></td>\n</tr>\n<tr>\n<td><code>IS-0090</code></td>\n<td>Инцидент с вирусом Нимба</td>\n<td>история</td>\n<td>2026-06-02 — 2026-06-02</td>\n<td><a href=\"IS-0090.html\">статья</a></td>\n</tr>\n<tr>\n<td><code>IS-0091</code></td>\n<td>Слом Изб</td>\n<td>история</td>\n<td>2026-06-02 — 2026-06-02</td>\n<td><a href=\"IS-0091.html\">стат  (без названия)</h3>\n<p><strong>Объявлено 2025-03-30, id 314483</strong>, окно w0086</p>\n<p>Что было объявлено: М вспоминает кильку (родилась 80 миллиардов лет назад, поглощает существ из других миров), С поправляет: «Это не килька. Это другая вселенная», и тут же задаёт основу текущей — «основой всего является Ом». То есть разговор идёт про новую вселенную, а килька осталась в старой.</p>\n<p>Записей «неясно» в этих датах: <strong>2</strong></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>id</th>\n<th>имя</th>\n<th>вид</th>\n<th>даты</th>\n<th>материал</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>MR-0130</code></td>\n<td>раса, связанная с ангелами</td>\n<td>мир</td>\n<td>2025-03-30 — 2025-03-30</td>\n<td><a href=\"MR-0130.html\">статья</a></td>\n</tr>\n<tr>\n<td><code>PS-0245</code></td>\n<td>Ангелы (как биологический вид)</td>\n<td>персонаж</td>\n<td>2025-03-30 — 2025-03-30</td>\n<td><a href=\"PS-0245.html\">статья</a></td>\n</tr>\n</tbody>\n</table></div>\n<h3>Апостол</h3>\n<p><strong>Объявлено 2025-09-12, id 364758</strong>, окно w0104</p>\n<p>Что было объявлено: старая вселенная «Апостол» откладывается «в долгий ящик» — не закрывается, автор просто отдыхает от неё, причина: слишком сложна и запутана, пугает множество миров</p>\n<p>Записей «неясно» в этих датах: <strong>1</strong></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>id</th>\n<th>имя</th>\n<th>вид</th>\n<th>даты</th>\n<th>материал</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>PR-0090</code></td>\n<td>Бетонный герой (главы: пробуждения, страх, неба, надежда?)</td>\n<td>проза</td>\n<td>2025-09-15 — 2025-09-15</td>\n<td><a href=\"kb/PR-0090-betonnyy-geroy-glavy-probuzhdeniya-strah-neba-nadezhda.html\">запись</a></td>\n</tr>\n</tbody>\n</table></div>", "r": []}, {"t": "До первого объявления вселенной (до 2023-12-26)", "a": ["DOC-NEYASNO-RAZBOR--do-pervogo-obyavleniya-vselennoy-do-2023"], "h": "<p>Первое объявление вселенной в переписке — «Падения небес», 2023-12-26, id 65981. Всё, что старше,
