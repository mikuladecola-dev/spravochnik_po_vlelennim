<script>const BASE="";const DOCNAME="Асеша";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0139-S01", "PS-0139--proishozhdenie"], "h": "<p>Асеша появляется в истории, которую Миколай написал и выложил в переписку 2024-08-11 (id 218119–218123, окно w0052). Перед текстом он предупреждает: «я написал историю». История ведётся от первого лица — от лица рассказчика, влюблённого в Асешу; сама она в переписке существует только через его пересказ.</p>\n<p>По рамке истории рассказчик собирался пригласить Асешу погулять «завтра», а в этот вечер вышел гулять в одно с ней время, «посмотрю, как она его проводит». То есть до событий истории они уже знакомы — насколько давно и откуда, в переписке не сказано.</p>\n<p>На следующий день, 2024-08-12 (id 218210–218215), Миколай оговаривает, что персонаж раскрыт не до конца: «ну епта по сюжету дальше будет известно кто такая гаргона и Асеша». Дальнейшего раскрытия в переписке нет.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0139-S02", "PS-0139--vneshnost"], "h": "<p>Прямого описания внешности нет — есть одна характеристика, данная по ходу рассуждения о том, сможет ли рассказчик поднять окаменевшую Асешу: «нет ну Асеша очень лёгкая, красивая и стройная, но из камень всегда тяжелее не обессудь, но факт, о весе нужно знать». Вес каменной статуи он оценивает в «не одну сотню килограмм» и говорит, что сам такой груз никогда не поднимет.</p>\n<p>После расколдовывания её состояние описано так: «весь камень отпал, она живая, мона дышит и тёплая». Мокрая и, по словам подруги-реакции, пахнет «мягко говоря неприятно» — от состава, которым её обливали.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0139-S03", "PS-0139--harakter"], "h": "<p>Всё, что о характере известно, дано через поступки:</p>\n<ul>\n<li>Гуляет с подругой и разговаривает «о буднях на рабочем месте и глупых штрафах от начальства» — конкретно про случай, когда человек уволился, а ему пригрозили ещё одним штрафом за неявку на смену через 2 дня, хотя он предупреждал, что едет на Байкал. Рассказчик добавляет от себя: «вот я бы отчитал её начальника, но в моём положении будет неуместно».</li>\n<li>Узнала рассказчика на улице и поздоровалась первой.</li>\n<li>На предложение встретиться завтра сразу согласилась.</li>\n<li>Попрощалась и пошла за подругой, потому что та «чет сильно задерживалась» в магазине.</li>\n<li>После того как подруга на ночёвке ей «твердила, что я ужасен», Асеша с ней не согласилась и «сказала, что хочет попробовать встретиться».</li>\n</ul>\n<p>Где она работает и кем — в переписке не сказано; разговор про штрафы идёт про её рабочее место, но должность не названа.</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0139-S04", "PS-0139--svyazi-s-drugimi"], "h": "<p><strong>Рассказчик истории про Горгону.</strong> Влюблён в неё, называет её «моя любимая Асеша», приглашение на свидание называет исполнением мечты: «моя мечта была исполнена». При встрече стыдится своего вида: «вообще не готов я был, не ухоженный совсем», «если обобщить концентрация стыда».</p>\n<p><strong>Подруга Асеши.</strong> Гуляет с ней, отходит в магазин «Тотал» за водой — именно в эти минуты Асеша остаётся с рассказчиком наедине и её обращают в камень. Задерживается в магазине 28 минут, потому что «там встретила подругу давнюю которая не переставая говорила и не отпускала её». Увидев Асешу на руках у рассказчика, спрашивает, что случилось и что он с ней сделал, выхватывает её, даёт рассказчику пощёчину и запрещает приближаться к её «малышке». На извинения отвечает, «что если бы ничего не было, то я бы не извинялся». Называет рассказчика ужасным при Асеше на ночёвке.</p>\n<p><strong>Горгона.</strong> Обращает Асешу в камень. В тексте она описана как женщина «с дредами в виде змей в белым брюхом, в может это и правда были змеи, как то странно они шевелились», очень странно одетая, идущая с опущенной головой, «что совсем подходило её образу». Рассказчик пытался её догнать, но она скрылась из виду.</p>\n<p><strong>Ник-Хан.</strong> Знакомый друг рассказчика, вампир, живёт в пещере за 2 тысячи километров от города; вызванный по телефону, оказался на месте «через 1 минуты и 34 секунды», благо была ночь. Он переносит рассказчика и статую к себе. Именно его гуано в виде летучей мыши идёт в состав средства, которым Асешу расколдовывают. С Асешей он больше ничем не связан, кроме того, что помогает донести её обратно к подруге.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S05", "PS-0139-S05", "PS-0139--kak-menyalsya"], "h": "<p><strong>2024-08-11 (id 218119–218123).</strong> Единственное развёрнутое появление. Асеша здесь — девушка, в которую влюблён рассказчик, объект спасения и адресат свидания. Внутри одного текста она проходит путь: встреча на улице → согласие на свидание → окаменение → расколдовывание → возвращение подруге → свидание, на которое рассказчик идёт в момент написания истории.</p>\n<p><strong>2024-08-12 (id 218210–218215).</strong> Прямого добавления к персонажу нет, есть только заявка на будущее раскрытие: «по сюжету дальше будет известно кто такая гаргона и Асеша» (218211). В этом же обмене Миколай защищает историю как жанр: «ну епта это трагедия, герой всё тянул с приглашением на свидание и вдруг эта залупа превращает в камень эту девушку. разве не страшно» (218210). Слава возражает по поводу правдоподобия обстановки: «Какого хуя по городу хочется Горгона а всем насрать» (218212). Миколай отвечает про горожан: «ну они это так называли» (218213), «ибо тупые» (218214), «не я писал» (218215) — то есть снимает с себя ответственность за реакцию мира, оставаясь в рамке «историю написал не я, а рассказчик».</p>", "r": []}, {"t": "Что с ним стало", "a": ["S06", "PS-0139-S06", "PS-0139--chto-s-nim-stalo"], "h": "<p>Внутри истории 2024-08-11:</p>\n<ol>\n<li>После согласия на свидание Асеша повернулась и пошла — «а она стала камнем». Рассказчик смотрел ей вслед и увидел, как мимо прошла Горгона.</li>\n<li>Каменную Асешу перенёс в пещеру Ник-Хан.</li>\n<li>Рассказчик приказал Ник-Хану превратиться в летучую мышь и оставить кучку прямо на полу. Обоснование: в гуано летучих мышей «очень высокое содержание нитратов которые способствуют разложению при контакте с неорганикой и увеличению энергии в контакте с органикой»; воздух пещеры «самый насыщенный по содержанию азота»; «окислительный слой конкретно его фекалий способствует ускоренной ферментации». Чтобы уменьшить концентрацию иных веществ, гуано развели со спиртом — с вином, которое рассказчик как раз купил в «Тотале» вместе с молоком. Пропорции определял на глаз, опираясь на книгу из коллекции Ник-Хана, где в картинках был показан процесс избавления от окаменения и состав нужной жидкости.</li>\n<li>При первом поливании по Асеше пошли глубокие трещины: «неужели она сейчас рассыпется». Ник-Хан помочь не мог — книгу он купил «потому что обложка красивая», а сам смотрит сериалы, экранизации этой книги ещё не было.</li>\n<li>Затем её положили в небольшую купальню, заполненную водой, и вылили смесь сверху: «так как плотность это смеси ниже она держалась на поверхности, мы аккуратно подняли статую и она всей площадью покрылась этим составом». Весь камень отпал, Асеша ожила.</li>\n<li>Ник-Хан помог унести её к подруге. Оставить её у себя на ночь рассказчик хотел, но «нужно было возвращать».</li>\n<li>Свидание не отменилось: Асеша сказала, что хочет попробовать встретиться. На момент окончания текста рассказчик идёт на это свидание: «надеюсь не опоздаю и надеюсь чего-то негативно непредвиденного не произойдёт и мы хорошо проведём время».</li>\n</ol>\n<p>Чем закончилось свидание, в переписке не сказано. Рассказчик только обещает: «даже если все пройдёт хорошо, а так они и будут, я также напишу историю» — такой истории в переписке нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0139-S07", "PS-0139--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Кто такая Асеша по существу — заявлено как будущее раскрытие («по сюжету дальше будет известно кто такая гаргона и Асеша», 218211), но раскрытия в переписке не последовало. Осталось нерешённым, обычный ли она человек.</li>\n<li>Фамилия, возраст, место работы не названы; профессия не названа, хотя разговор о штрафах идёт про её работу.</li>\n<li>Имя подруги не названо.</li>\n<li>Как Асеша и рассказчик познакомились до событий истории — не сказано.</li>\n<li>За что именно Горгона обратила её в камень и была ли это случайность — не сказано.</li>\n<li>Помнит ли Асеша сам момент окаменения и знает ли, что с ней было — в переписке не сказано; о её реакции на произошедшее не говорится ничего, кроме согласия всё-таки встретиться.</li>\n<li>Результат свидания не описан.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0139--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0139--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-11</td>\n<td>218119–218123</td>\n<td>w0052</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-08-12</td>\n<td>218210–218215</td>\n<td>w0052</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0139-asesha.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0139--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0139.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
