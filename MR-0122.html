<script>const BASE="";const DOCNAME="Агенты";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0122-S01", "MR-0122--ustroystvo"], "h": "<p>«Агенты» — организация, куда вербуют людей, столкнувшихся с чужемирцем. Всё, что о ней известно, изложено в двух сообщениях Славы от 2025-03-18 (id 305116–305117) и уточнено в диалоге М и С в тот же день (id 305333–305354).</p>\n<p>Вербовка устроена так. К человеку, только что пережившему встречу с чужемирцем, подходит агент и предлагает выбор из двух путей, дословно: «смотри у тебя есть два пути. Первый я подхожу тебя к остановки и ты едешь домой. Забыв обо всём этом и живя обычной жизнью. Второй- ты становишься агентом и сразаешься с подобными тварями, как сегодняшний. Выбор за тобой. Я не буду говорить плюс и минус». Рассказчик отмечает, что монолог был «явно выученный» — то есть это стандартная процедура, а не разовый случай.</p>\n<p>После первого согласия вербовщик уезжает, сказав, что перезвонит. Телефон новобранца организации известен заранее — рассказчик своего номера не давал, и на вопросы об этом вербовщик «отнекивался». Звонит уже не он, а другой человек: в описанном случае это был Михаил Саакашвили. По телефону назначается срок — заезд через три дня, к этому моменту человек должен дать точный ответ. Если ответ остаётся положительным, новобранца забирают в лагерь, где он должен прожить 6 месяцев «под тренировкам и впитыванием информации».</p>\n<p>Срок в лагере может быть сокращён. Рассказчик отучился только 3 недели — «так как я был в идеальном физической форме и мне оставалось только дать информацию и ресурсы и всё». То есть шесть месяцев — это полный курс с физической подготовкой; тому, кто уже в форме, остаётся информационная часть и выдача ресурсов.</p>\n<p>Обучение идёт группами. В группе рассказчика было 10 человек. Объяснение этому числу даётся сразу же: «Каждый агент может быть куратором только для 10 людей». Куратор — из числа агентов; куратором рассказчика был Михаил с кодовым прозвищем «Медведь». Помимо имени и фамилии у агентов есть кодовые прозвища.</p>\n<p>Организация следит за утечками информации. Запись рассказчика (тот самый текст 305116–305117) была удалена через 7 минут после публикации, удалил её Михаил, «а его отправитель был наказан».</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Отклик — не материал авторов</b>\n<p>Сильный ход — то, как здесь подана экспозиция. Устройство мира читатель узнаёт ровно в том виде и ровно в тот момент, в какой его узнаёт новобранец в лагере: «Ждёшь объяснение? Ладно давай обьясню». Ничего не объясняется просто так — всё, что мы знаем, кто-то кому-то был обязан рассказать по службе, а чего не рассказали, того и нет: «Мне об этом ритуале не рассказали по понятном причинам». И финал записи закрывает конструкцию наглухо — «Через 7 минут эта запись была удалена Михаилом. А его отправитель был наказан». Текст сам объясняет, почему он такой короткий, и заодно вводит организацию, которая следит за утечками, через факт утечки. Отдельно зацепила асимметрия перехода: «мы субъекты первого мира. Не модем его пикинуть. Ну вот никак. Ну вот чужемирцы попадають нам за раз плюнуть» — это про мир, в который можно только войти, и он оказывается нашим.</p></div>", "r": []}, {"t": "Население", "a": ["S02", "MR-0122-S02", "MR-0122--naselenie"], "h": "<p>Обычные люди, столкнувшиеся с чужемирцем. Прямой вопрос М (305352–305353): «значит они могут выбирать каких-то ебланов обычных кто столкнулся с чужемирцем? в агенты» — и подтверждение.</p>\n<p>Количество агентов на 2025-03-18: «Дохера» (305337). Точных чисел нет.</p>\n<p>Названные поимённо:</p>\n<ul>\n<li><strong>Михаил «Медведь» Саакашвили</strong> — куратор рассказчика, звонивший ему на второй день. Описан так: «По два метра ростом, в плечах почти также. Везде мыщцы и суровым лицом богатыря. Ходил он в кожанном плаще и был суров, но справедливым». Отметил навыки рассказчика, несмотря на то что тот его бесил. Он же удалил запись через 7 минут и наказал отправителя.</li>\n<li><strong>Вербовщик</strong> — мужчина «с 20 до 30», в белой рубашке и чёрных брюках, сквозь рубашку видны мышцы, «словно в рекламах», лицо симметричное, причёска «как у всех только чуть длинноватый волосы». Ездит на дорогой машине. Именно он убил трёх нападавших: вокруг головы Копьещика на мгновение образовалась белая цепь, и голова слетела; второй Копьещик стоял, дрожа, у дерева и взорвался «словно изнутри»; в момент взрыва за его спиной засветились белые глаза и исчезли; лучницу настигли в кустах. Имя в переписке не названо. Уезжая, он сказал, что спешит на встречу с новым апостолом по прозвищу «защитник».</li>\n<li><strong>Рассказчик</strong> — сам автор записи, попавший в организацию. Обладает восприятием времени («даже с моим восприятием времени я не мог собразит, что происходит»). На вопрос ответил сразу: «я стану агентом- твердо произнес я. Не скрывая улыбки», объяснив это про себя так: «Вся моя жизнь стремилась к этому моменту. К моменту веселья и риска. Я силён, а значит можно попробовать». Имя в переписке не названо.</li>\n</ul>\n<p>Что организация делает с агентами: «Отправляют сражаться» (305339).</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0122-S03", "MR-0122--mesto-vo-vselennoy"], "h": "<p>Организация принадлежит апостолам. М формулирует это в 305333: «я про то что у этих апостолов такая система получается» — и дальше в 305336: «ваще удобная система».</p>\n<p>Через лагерь агентов в переписку вводится общее устройство мира — то, чему новобранцев учат. В изложении рассказчика (305116):</p>\n<div class=\"q\"><p>«В начале всего было ничего. Потом появился первый мир &quot;Килька&quot;. И да это наш мир. А потом начали появляться другие миры. И в каждом этом мире был свой бог. Его называют Правителем. И вот эти миры появляются и по сей день. И между всеми мирами есть некая связь. Но у всех это связь более крепкая с &quot;Килькой&quot; С первом миром.»</p></div>\n<p>Здесь наш мир назван «Килькой». Обратите внимание: в более раннем изложении того же устройства (2025-01-06) наш мир назывался «Вселенной» — см. <a href=\"MR-0093.html\">Вселенная (наш мир)</a>. Переименование в переписке не объясняется и не обсуждается.</p>\n<p>Чужемирцы — «существо покинувший свой мир. По каким либо причинам. Чаще всего из-за того, что их ней миры суший ад. Или желанием захвата других миров. Ну грубо говоря почти всё чужемирцы жестокие психи. Для которых убийства это обыденная дело». У них есть разделение по видам способностей — рассказчик от разбора отказывается: «Ну это скука об этом говорить».</p>\n<p>Три известных способа попасть в наш мир (305117):</p>\n<ol>\n<li>Достигнуть границы своего мира. «Часто этот способ используют в маленьких мирах, который только недавно образовались. Опять же относительно \"кильке\"».</li>\n<li>С помощью ритуала — как с нашей стороны, так и с их. Подробностей нет: «Мне об этом ритуале не рассказали по понятном причинам».</li>\n<li>Самый редкий — «когда правитель сам тебя отправляет в другой мир».</li>\n</ol>\n<p>Асимметрия перехода названа рассказчиком как главный для него факт: «мы субъекты первого мира. Не модем его пикинуть. Ну вот никак. Ну вот чужемирцы попадають нам за раз плюнуть».</p>\n<p>Темы, которые рассказчик перечислил как оставшиеся нерассказанными: «альфа, апостолы, благословенный, силы зверя, классификация, арбетары, аномалия, существа и так далее». Ни одна из них в этом окне не раскрыта.</p>", "r": [["Вселенная (наш мир)", "MR-0093.html"]]}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0122-S04", "MR-0122--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-03-18 (id 305116–305117).</strong> Организация вводится изнутри, как рассказ завербованного: сцена спасения, выбор из двух путей, три дня на ответ, звонок Саакашвили, лагерь на 6 месяцев, сокращение до 3 недель, группа из 10, куратор «Медведь», ограничение «каждый агент может быть куратором только для 10 людей». Здесь же — основы устройства миров, которым учат в лагере. Заканчивается запись удалением: «Через 7 минут эта запись была удалена Михаилом. А его отправитель был наказан.»</p>\n<p><strong>Версия 2 — 2025-03-18, 16:19–16:30 (id 305333–305354).</strong> Обсуждение вне текста. Уточнено: агентов «дохера», их «отправляют сражаться», в агенты берут обычных людей, столкнувшихся с чужемирцем. М оценивает конструкцию как систему апостолов и называет её удобной. Здесь же подтверждается, что вербовщик — «и правда новый апостол» (305338, 305340), то есть тот самый «защитник», на встречу с которым он якобы спешил.</p>\n<p>Попутно обсуждается происхождение фамилий: С признаётся, что «мне т2 помогает фамилии придумывать» (305344), М отвечает, что имена и фамилии ему нравятся и он расстроится, если С станет делать иначе (305345–305346). М сначала прочитал фамилию Саакашвили как отсылку к Сталину или его приближённому (305347–305348); С возразил: «Саакашвили звучит по немецки» (305349), на что М указал, что на Википедии она значится грузинской (305350).</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0122-S05", "MR-0122--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имя вербовщика не названо. Известно только, что он новый апостол по прозвищу «защитник».</li>\n<li>Имя рассказчика не названо.</li>\n<li>Что происходит с теми, кто выбирает первый путь и едет домой, — не сказано. «Забыв обо всём этом» — забывают ли они сами или им стирают память, в переписке не разобрано.</li>\n<li>Откуда организация знает номер телефона новобранца — вопрос в тексте задан рассказчиком и остался без ответа, вербовщик «отнекивался».</li>\n<li>Чему конкретно учат 6 месяцев и что за «ресурсы» выдают — не расписано.</li>\n<li>Структура организации выше кураторов не описана. Как связаны агенты и апостолы, кто из них кому подчиняется — не сказано.</li>\n<li>Ритуал перехода (второй способ) — «мне об этом ритуале не рассказали по понятном причинам».</li>\n<li>Разделение чужемирцев по видам способностей упомянуто, но не раскрыто.</li>\n<li>Список «альфа, апостолы, благословенный, силы зверя, классификация, арбетары, аномалия, существа» назван как оставшийся на потом.</li>\n<li>Точное число агентов не названо — только «дохера».</li>\n<li>Как удаление записи через 7 минут технически произошло и в чём состояло наказание отправителя — не сказано.</li>\n<li>Соотношение названий «Килька» и «Вселенная» для нашего мира в переписке не оговорено.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0122--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0093.html\">Вселенная (наш мир)</a></li>\n<li><strong>Упомянут в мирах:</strong> <a href=\"MR-0093.html\">Вселенная (наш мир)</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0005.html\">Агенты (организация вербовки)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0122--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-03-18</td>\n<td>305116–305117</td>\n<td>w0082</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-18</td>\n<td>305333–305354</td>\n<td>w0082</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0122-agenty.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0122--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0122.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["MR-0122-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/MR-0122/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дороже всего — <code>SL-0054</code> «Список 12 апостолов»: три ссылки, статьи нет, а в базе под ним 234 052 знака, больше, чем под любой другой записью «Апостола». На него опираются <code>GR-0005</code> (это и есть группа агентов, парная к этой статье), <code>GR-0001</code>, <code>GR-0004</code>, <code>GR-0013</code>, <code>PS-0279</code>, <code>IS-0013</code>. Вся эта статья держится на том, что организация принадлежит апостолам, а вербовщик — «новый апостол по прозвищу защитник»; пока список апостолов не разобран в статью, ни один вопрос вида «кто именно» здесь закрыть нельзя, хотя материала под ним больше, чем под чем угодно другим.</p>\n<p>Второе — <code>SP-0264</code> «Белые глаза апостолов»: статьи нет, 2 260 знаков, ноль ссылок, вселенная помечена как неясная. Это единственная запись, которая подтверждала бы то, что в статье сказано осторожно: у вербовщика «за его спиной засветились белые глаза». Признак апостола лежит отдельной сущностью вне вселенной и ни с чем не связан.</p>\n<p>Третье, дешёвое, но мешающее: <code>ID-0126</code> «Нераскрытые термины: альфа, благословенный, силы зверя, классификация, арбетары, аномалия, существа» — 3 566 знаков, статьи нет, ноль ссылок. Это буквально тот самый список, который рассказчик перечисляет как оставшийся на потом, и в справочнике он висит как отдельная запись, на которую никто не ссылается, кроме <code>MR-0146</code>.</p>\n<h3>С чего начать</h3>\n<p>В базе, и одна вещь чинится прямо сейчас. Статья пишет: «Имя рассказчика не названо». Оно названо. Источники здесь взяты с 305116, а текст начинается с 305113: <code>PR-0060</code> «Блог Максима» (статья есть, база 31 165, сообщения 305113–305117) открывается словами «Я Максим». Дальше — <code>PS-0048</code> «Максим» (статья есть, база 70 202), где эта же вербовка уже разобрана целиком: 19 лет, родители в командировке, друг-лучник, три недели вместо шести месяцев, куратор «Медведь». Нижнюю границу окна надо двигать на 305113, и пробел снимается без похода в архив.</p>\n<p>Там же снимается часть второго пробела. В <code>PS-0048</code> реплика вербовщика про апостола дана в другом написании — «с новым апостооом по прозвищу „защитник“» — и сказана она в машине, то есть по времени и месту это уточняется, а не пересказывается.</p>\n<p>По «защитнику» материал в базе есть, но его надо сперва отождествить: <code>PR-0061</code> «Я житель одного технологического развитого мира» (статья, 34 415) — там защитник действующее лицо и у него есть имя, Александр; <code>PR-0049</code> «История защитника (переписанная)» (статья, 22 661). Тот ли это защитник, в переписке не заявлено — но проверять надо здесь, а не в архиве.</p>\n<p>В архив идти стоит за одним: за переименованием нашего мира. «Вселенная» (2025-01-06, окно w0070, id 279029–279038) и «Килька» (2025-03-18) — это два состояния одного объекта, и обе записи существуют отдельно: <code>MR-0093</code> (три ссылки, статья есть, база 12 112) и <code>MR-0207</code> «Килька» (68 896). Смотреть надо промежуток между 279038 и 305116, то есть январь–март, окна w0070–w0082.</p>\n<h3>Как развивалось</h3>\n<p>Всё уложилось в один день. 2025-03-18 днём — организация разворачивается изнутри, прозой: сцена, выбор из двух путей, три дня, лагерь, группа из десяти, куратор, предел «10 людей на агента», и заодно вся космология, поданная как то, чему учат в лагере. Вечером того же дня, 16:19–16:30, — вынос наружу: обсуждение вне текста, где уточняется масштаб («дохера», «отправляют сражаться») и подтверждается, что вербовщик — апостол. И там же разговор сворачивает на происхождение фамилий, Т2, Сталина и Википедию — и больше к агентам не возвращается: диапазон существования сущности начинается и заканчивается 2025-03-18. Развернули изнутри, обсудили снаружи, ушли на побочное, не вернулись.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Единственное точное число во всей организации — предел нагрузки: «Каждый агент может быть куратором только для 10 людей». Правило нормирования названо для обучения. Для боевой стороны, ради которой всё и существует, никакого нормирования нет: агентов «дохера», их «отправляют сражаться» — сколько агентов идёт на одного чужемирца, кто это решает, есть ли предел здесь, не сказано. Предел проговорён для наставничества и не проговорён для соседнего, главного случая.</p>\n<h3>Отклик</h3>\n<p>Сильный ход — то, как здесь подана экспозиция. Устройство мира читатель узнаёт ровно в том виде и ровно в тот момент, в какой его узнаёт новобранец в лагере: «Ждёшь объяснение? Ладно давай обьясню». Ничего не объясняется просто так — всё, что мы знаем, кто-то кому-то был обязан рассказать по службе, а чего не рассказали, того и нет: «Мне об этом ритуале не рассказали по понятном причинам». И финал записи закрывает конструкцию наглухо — «Через 7 минут эта запись была удалена Михаилом. А его отправитель был наказан». Текст сам объясняет, почему он такой короткий, и заодно вводит организацию, которая следит за утечками, через факт утечки. Отдельно зацепила асимметрия перехода: «мы субъекты первого мира. Не модем его пикинуть. Ну вот никак. Ну вот чужемирцы попадають нам за раз плюнуть» — это про мир, в который можно только войти, и он оказывается нашим.</p></div>", "r": []}];</script>
