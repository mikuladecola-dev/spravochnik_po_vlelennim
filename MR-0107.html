<script>const BASE="";const DOCNAME="Иерархия силы";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0107-S01", "MR-0107--ustroystvo"], "h": "<p>Иерархия силы — расстановка сил вселенной «Апостол», заданная Славой в окне w0072 (2025-01-23 — 2025-01-24). Строится она сверху вниз от главы организации злодеев (<a href=\"MR-0105.html\">Организация злодеев</a>).</p>\n<p>Порядок такой:</p>\n<ol>\n<li><strong>Глава организации</strong> — «единственный благословенный правителем нашего мира» (2025-01-23, id 284170). Слава сразу поясняет статус: «То бишь она будет грубо говоря сильнейшей» (id 284171). Глава — женщина («она»).</li>\n<li><strong>Семь грехов и божество</strong> — «Будет слабей главы этой организации но сильней благословенного» (id 284175). Оба звена стоят на одной ступени: грехи и божество названы вместе, одной репликой, без разделения между собой.</li>\n<li><strong>Благословенный</strong> — нижняя из названных ступеней.</li>\n</ol>\n<p>Отдельным уточнением идёт числовое правило, переводящее разницу ступеней в количество: «Но не забывай 7 грехов сильней благословенный и чтобы убить одного греха в максимум надо 3 благословенных именно Бога А для остальных благословенных надо будет 5» (2025-01-24, id 284276).</p>\n<p>То есть на одного греха «в максимуме» требуется:</p>\n<ul>\n<li>3 благословенных — если это благословенные именно Бога;</li>\n<li>5 — «для остальных благословенных».</li>\n</ul>\n<p>Формулировка «в максимум» относится к состоянию греха, а не к числу нападающих: речь о грехе на пике силы.</p>\n<p>Различение «благословенных именно Бога» и «остальных благословенных» опирается на разделение благословений Бога и дьявола (см. запись «Благословение Бога и дьявола»), но само это разделение внутри разговора об иерархии не разъясняется.</p>", "r": [["Организация злодеев", "MR-0105.html"]]}, {"t": "Население", "a": ["S02", "MR-0107-S02", "MR-0107--naselenie"], "h": "<p>В окне вместе с иерархией дважды перечисляется состав сил.</p>\n<p><strong>Семь грехов, версия от 2025-01-23</strong> (id 284176) — здесь Слава уточняет способности, отвечая на уже существовавшие наброски:</p>\n<ul>\n<li><strong>Похоть</strong>: «Контроль разума с ограничением. То бишь она может повысить какое то чувство или вызвать галлюцинаций или наоборот понизить какой то чувство».</li>\n<li><strong>Чревоугодие</strong>: «ок» — принято без изменений.</li>\n<li><strong>Алчность</strong>: «Я думал больше о способности поглощений чужой манный или объектов».</li>\n<li><strong>Лень</strong>: «я думал телекинез типа лень чё то делать вот и телекинез ( здесь ещё в придачу владений магий ветра, как никак они связаны)».</li>\n<li><strong>Гнев</strong>: «ну ок» — принято без изменений.</li>\n<li><strong>Зависть</strong>: «Полной перевоплощение тому кого завидуешь, под полный подразумевается полной копирование сил, магии, одежды, внешность но не характера». Копирование не распространяется на характер.</li>\n<li><strong>Гордыня</strong>: «Слово закон с ограничением».</li>\n</ul>\n<p><strong>Семь грехов, версия от 2025-01-24</strong> (id 284278) — тот же состав, но короткими подписями, и часть подписей не совпадает с предыдущим днём:</p>\n<ul>\n<li>Гнев 😡 (сила)</li>\n<li>Похоть 😵‍💫 (контроль разума)</li>\n<li>Зависть 👹👹 (полной копирование)</li>\n<li>Алчность ♾ (всё моей)</li>\n<li>Гордыня 👑</li>\n<li>Чероугодия ◼️ (поглощения)</li>\n<li>Лень 😴 (контроль территории)</li>\n</ul>\n<p>Расхождения между двумя днями не обсуждались и не отменялись: 23-го поглощение отдано Алчности, 24-го «поглощения» стоит у Чревоугодия, а Алчность подписана «всё моей»; Лень 23-го — телекинез плюс магия ветра, 24-го — «контроль территории»; у Гордыни во второй список ограничение не перенесено. Оба состояния зафиксированы.</p>\n<p><strong>Благословенные</strong> (2025-01-24, id 284278):</p>\n<p>Имитатор 🗡 (ветреной 🌬; электро ⚡️; птичка 🔈), Агрегат 🫥 (волк 🐺; экстримал ⏳; страдалец 🔪), Разрушительнитца 💪 (огненная 💥), Палач ☠️, Защитник 🤬 (ангел 👼), Дитя света ✨ (Теневые братья 🌘), Бессмертный выродок 🤪, Хулиган 💎 (слайм 7️⃣), Вибрация 🫨, Ученица???</p>\n<p>Знаки вопроса у Ученицы стоят в исходнике — на 2025-01-24 её содержание не определено.</p>\n<p><strong>Враг</strong> (там же):</p>\n<p>Доспехи 🏳️, Козлиха 🪓, Сестра 🚺, Огненный снайпер 🔥, Охотник 🔪, Божество 😵, Убийца 🩸, Зонтик 🩸, Леший 🌳, Пар 💨, Садистка ✂️, Насекомое 😡, Старик ➡️⬅️, Эльф 🌬.</p>\n<p>Божество, стоящее в иерархии рядом с семью грехами, в списке проходит по разделу «Враг».</p>\n<p><strong>Идеи</strong> (там же): Чёрный ящик, озеро перерождения, корень желаний.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0107-S03", "MR-0107--mesto-vo-vselennoy"], "h": "<p>Иерархия силы вырастает прямо из разговора об организации злодеев (<a href=\"MR-0105.html\">Организация злодеев</a>): реплики 284170–284176 входят в обе записи. Верхняя ступень иерархии — глава этой организации, и её первенство обосновано благословением от «правителя нашего мира».</p>\n<p>Записи, с которыми иерархия связана: Альфы, Благословение Бога и дьявола, Организация злодеев (<a href=\"MR-0105.html\">Организация злодеев</a>), Семь грехов.</p>\n<p>Разговор о положении Альф внутри этой шкалы в приведённых кусках не ведётся: Альфы названы как часть организации в соседней записи, но в саму лестницу «глава — грехи и божество — благословенный» не вписаны.</p>", "r": [["Организация злодеев", "MR-0105.html"]]}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0107-S04", "MR-0107--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-01-23</strong> (окно w0072, id 284170–284176).</p>\n<p>Задана трёхступенчатая расстановка: глава организации &gt; семь грехов и божество &gt; благословенный. Числовых правил ещё нет. В том же куске Слава расписывает способности семи грехов подробными формулировками. Между репликами Славы стоит ответ Миколая «я позже отвечу» (id 284174) — уточнение иерархии идёт без встречных возражений.</p>\n<p><strong>Версия 2 — 2025-01-24</strong> (окно w0072, id 284276–284279).</p>\n<p>Добавлено числовое правило убийства греха: 3 благословенных Бога, «а для остальных благословенных надо будет 5». Ступени при этом не пересматриваются, повторяется только «7 грехов сильней благословенный». Миколай спрашивает: «остальные грехи сейчас норм?» (id 284277), в ответ Слава присылает сводный список сил (id 284278) и подтверждает: «Ну да» (id 284279).</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0107-S05", "MR-0107--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Формулировка «а для остальных надо будет 5» читается неоднозначно: то ли речь про остальных грехов, то ли про остальных благословенных. В переписке это не разъяснено.</li>\n<li>Что означает «в максимум» применительно к греху — какое состояние считается максимумом и как в него входят — не сказано.</li>\n<li>Соотношение семи грехов и божества между собой не определено: они поставлены на одну ступень одной репликой.</li>\n<li>Место Альф в иерархии не названо.</li>\n<li>Не сказано, сколько всего благословенных Бога существует и достижимо ли требуемое число в принципе.</li>\n<li>Обратная сторона правила — сколько грехов нужно, чтобы убить главу или благословенного, — не рассматривалась.</li>\n<li>Расхождения в подписях грехов между 23-м и 24-м января остались неразрешёнными: какая версия способностей Алчности, Чревоугодия, Лени и Гордыни действующая, не сказано.</li>\n<li>Содержание Ученицы на момент окна не определено («Ученица???»).</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0107--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0105.html\">Организация злодеев</a></li>\n<li><strong>Упомянут в мирах:</strong> <a href=\"MR-0105.html\">Организация злодеев</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0002.html\">Семь грехов</a>, <a href=\"GR-0006.html\">Организация злодеев</a>, <a href=\"GR-0013.html\">Благословенные</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0107--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-01-23</td>\n<td>284170–284176</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-24</td>\n<td>284276–284279</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0107-ierarhiya-sily.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0107--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0107.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["MR-0107-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/MR-0107/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Не Альфы: <code>MR-0106</code> «Альфы» существует, две ссылки, статья на месте, база 28 881 — их место в лестнице не назвали, но материал под рукой.</p>\n<p>Дорого другое — реестры, из которых целиком сделан раздел «Население». <code>SL-0053</code> (шесть ссылок, статьи нет, база 20 313) и <code>SL-0051</code> (шесть ссылок, статьи нет, 9 834), рядом <code>SL-0090</code> и <code>SL-0089</code> (по четыре ссылки, статей нет). Это самые ссылаемые записи «Апостола», у которых нет статьи, и половина этой записи цитирует их напрямую.</p>\n<p>Следом — имена из этих списков, за которыми нет вообще ничего. «Ученица», «Дитя света», «Хулиган» упоминаются каждый в 17–18 статьях справочника, а сущностей с такими именами в базе нет: ни статьи, ни карточки, ни id. «Вибрация» есть только как <code>SP-0278</code> (ноль ссылок, статьи нет, 8 294, вселенная «неясно»). Нижняя ступень иерархии перечислена по именам, но на четверть не населена — и это тянет за собой всех, кто на список опирается.</p>\n<h3>С чего начать</h3>\n<p>В базе, и материал старше самой иерархии на месяц.</p>\n<p>Разбор способностей грехов лежит в w0068, 2024-12-24 — 25: <code>SP-0156</code> «Семь грехов (магия по грехам)» (четыре версии, статьи нет, база 11 757; ключевые сообщения 273906, встречный вариант 273920, разбор 274462–274472) и отдельные записи по каждому — <code>SP-0157</code>, <code>SP-0158</code>, <code>SP-0160</code>, <code>SP-0161</code>, <code>SP-0162</code>, по 7–8 КБ, статей нет, вселенная у всех проставлена как «неясно».</p>\n<p>Расхождение подписей между 23-м и 24-м января решается там же и адресно: «поглощение» разъехалось между Алчностью и Чревоугодием, а у Алчности запись <code>SP-0159</code> уже доведена до статьи (одна ссылка, база 11 808), у Чревоугодия <code>SP-0158</code> — нет. Сравнивать надо эти две.</p>\n<p>В архив — только за числовым правилом: w0072, 2025-01-24, вокруг 284276–284279, там же вопрос «остальные грехи сейчас норм?» и ответ «Ну да». Если после этого «Ну да» ничего нет, правило так и осталось одной репликой.</p>\n<h3>Как развивалось</h3>\n<p>2025-01-23 — заявили: три ступени сверху вниз, никаких чисел, в тот же заход подробно расписаны способности семи грехов. 2025-01-24 — ограничили: появилось числовое правило, 3 благословенных Бога или 5 остальных на одного греха «в максимуме»; ступени при этом не трогали. В тот же день — сводный список сил и «Ну да» в ответ на вопрос, всё ли в порядке. Дальше не возвращались: записи об иерархии после 2025-01-24 нет. Разговор о том же составе продолжился, но переехал в реестры — состав переписывали ещё не раз, лестницу не трогали ни разу.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Верхняя ступень определена через источник благословения: глава организации сильнейшая потому, что она «единственный благословенный правителем нашего мира». Нижняя ступень тоже разведена по источнику, и разница переведена в число: «именно Бога» — 3, «остальных благословенных» — 5.</p>\n<p>Для средней ступени — семь грехов и божество — вопрос об источнике не поставлен вообще. От кого они, благословлены ли, входят ли в ту же систему, что и остальные, — не спрашивается. Правило «сила задаётся тем, кто благословил» проговорено сверху и снизу, а посередине пропущено, и посередине как раз стоят те, ради кого написано числовое правило.</p>\n<h3>Отклик</h3>\n<p>Понравилась экономность: вся лестница помещается в три реплики, и сила там переведена в число не абстрактно, а через действие — сколько нужно, чтобы убить. «3 благословенных Бога, а остальных 5» говорит о разнице между ступенями больше, чем сказала бы любая таблица уровней, — и это притом что чёткие уровни силы месяцем раньше отбросили как идею сложную. Отказ от шкалы и это правило — по сути одно и то же решение, просто удачно повёрнутое.</p>\n<p>Зацепило и второе: Божество стоит в лестнице рядом с грехами и одновременно числится в списке под заголовком «Враг». Порядок мира описан здесь двумя способами сразу, они не сходятся, и обе записи оставлены как есть. Не выглядит ошибкой — выглядит как след того, что в этот момент мир думался с двух сторон одновременно и никто не стал выбирать.</p></div>", "r": []}];</script>
