<script>const BASE="";const DOCNAME="Новый главный герой";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0027-S01", "PS-0027--proishozhdenie"], "h": "<p>Персонаж Славы, изложенный целиком одним длинным сообщением 2024-01-18 (окно w0023, id 92316). В переписке проходит как «Новый гг», «новый гг», «гг». Имени нет.</p>\n<p>Биография задана так: «обычный мальчик который собственный родитель продали в организацию где его воспитывали как героя». Про то, как именно воспитывали, оговорено сразу и с нажимом: «сразу нет с ним там не сусукались его избивали, тренировали сутками напролет за каждую ошибку строго наказывали и промывали мозги».</p>\n<p>Дальше — выход в мир: «так он вырос и наконец-то вышел на сцену (то бишь в мир) там он сам себя убедил что быть героем хорошо». Формулировка «сам себя убедил» — авторская.</p>\n<p>Работа героем описана без геройского: «Нет он не просто спасал людей, его посылали в самую жопу где он чуть не полыхал терял команду плюсом ко всему этому ему не давали передышку и даже спать он мог неделями не спать».</p>\n<p>Перелом складывается из двух событий. Первое — встреча: «он встречается с человеком который говорит быть свободным но после он её убил так как она заразилась чем-то или типо того». Второе — пресс-конференция: «журналисты пытаются его обвинить в гибели уже 10 команды (ведь журналистом нужна сенсация)». На ней происходит срыв: «гг со от недосыпа и непонимания почему с ним так и от накопившего стресса срывается и устраивает резну после уходя в закат».</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0027-S02", "PS-0027--vneshnost"], "h": "<p>В переписке не описана.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0027-S03", "PS-0027--harakter"], "h": "<p>Характер задан двумя состояниями — до срыва и после.</p>\n<p>До: герой, убедивший сам себя, что «быть героем хорошо», работающий на износ, без сна и передышки, теряющий команду за командой.</p>\n<p>После: «Время спустя вот гг уже другой он стал высокомерным (так как считает людей лицемерами из за прошлого) и он чсв и он старается нарушить все правила (ведь раньше ему все запрещали)».</p>\n<p>Причины обоих свойств названы прямо в скобках самим автором: высокомерие — из-за того, что «считает людей лицемерами из за прошлого»; нарушение всех правил — «ведь раньше ему все запрещали».</p>\n<p>Прошлое из него не ушло: «у него до сих пор есть травмы».</p>\n<p>Отдельно зафиксировано, что он продолжает спасать людей, но не признаёт этого: «он часто спасает людей давая отговорку типо меня просто раздражала или из-за этого могло что-то произойти».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0027-S04", "PS-0027--sposobnosti"], "h": "<p>В переписке не названы. Что именно делало его героем как боевую единицу, не сказано.</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0027-S05", "PS-0027--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Организация</strong>, куда его продали родители и где «его воспитывали как героя». К концу изложенного она становится его целью: «он узнал что его не одного воспитывали по той методики и он решил уничтожить организацию».</li>\n<li><strong>Родители</strong> — «собственный родитель продали в организацию». Больше о них ничего не сказано.</li>\n<li><strong>Женщина, говорившая о свободе</strong> — «человек который говорит быть свободным», которого герой убил, «так как она заразилась чем-то или типо того». Ни имени, ни того, чем именно она заразилась, в переписке нет.</li>\n<li><strong>Команды</strong> — герой их терял; к моменту пресс-конференции речь идёт «о гибели уже 10 команды».</li>\n<li><strong>Журналисты</strong> — обвиняют его на пресс-конференции, мотив назван: «ведь журналистом нужна сенсация».</li>\n<li><strong>Другие воспитанники</strong> — «его не одного воспитывали по той методики». Именно это знание даёт ему цель.</li>\n<li><strong>Комикс Славы</strong> — сущность, с которой персонаж связан в базе.</li>\n</ul>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0027-S06", "PS-0027--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2024-01-18 (id 92316–92338).</strong> Полное изложение биографии одним сообщением: продажа в организацию, побои и промывка мозгов, потеря команд и бессонница, встреча с женщиной, говорившей о свободе, и её убийство, срыв на пресс-конференции, резня, уход. Вторая половина — высокомерие, нарушение правил, спасение людей под отговорки, цель уничтожить организацию.</p>\n<p>Реакция Миколая (id 92337): «персонаж хорошо проработан, однако хочу уточнить, в самой работе (произведении) он уже взрослый и просто потом покажешь его прошлое вкратце или будет проходить этап взросления? А вообще персонаж интересный, но чуток заурядный, однако пусть такой и останется, все норм, так и должно быть».</p>\n<p><strong>Версия 2 — 2024-01-18 (id 92337–92345).</strong> Уточнена подача. На вопрос о структуре повествования Слава ответил одним словом: «Флэшбек» (id 92338). То есть в произведении герой уже взрослый, а прошлое даётся флэшбеком, а не проживается по ходу.</p>\n<p>Предложение Миколая оставить персонажа «чуток заурядным» как есть — «пусть такой и останется, все норм, так и должно быть» — возражений не встретило и не обсуждалось дальше.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0027-S07", "PS-0027--chto-s-nim-stalo"], "h": "<p>Цель на момент окончания изложения: «он решил уничтожить организацию». Что из этого вышло, в переписке не сказано — разработка на этом остановилась, разговор ушёл на другие темы.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0027-S08", "PS-0027--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имени нет.</li>\n<li>Вселенная в самой переписке не названа; отнесение к «Падениям небес» дано по дате объявления.</li>\n<li>Способности не названы.</li>\n<li>Внешность не описана.</li>\n<li>Название организации не дано, устройство её не описано. Кто ею руководит, зачем она кует героев, кому они подчиняются — не сказано.</li>\n<li>Женщина, говорившая о свободе, не названа по имени; чем она заразилась — «чем-то или типо того», то есть не определено. Заражение и убийство никак не связаны с остальным сюжетом в тексте переписки.</li>\n<li>Мир, в котором всё происходит, не описан: ни того, от чего спасают героев, ни против кого посылают команды.</li>\n<li>Сколько времени прошло между резнёй и вторым состоянием, не сказано — только «Время спустя».</li>\n<li>Неясно, тот ли это герой, для которого позже (2024-01-30) искали мир с поглощением энергии, и как он связан с прежним гг из предыдущего окна (<a href=\"PS-0024.html\">Главный герой мира богов и аватаров</a>). В переписке связь не устанавливалась.</li>\n</ul></div>", "r": [["Главный герой мира богов и аватаров", "PS-0024.html"]]}, {"t": "Связи — всё вместе", "a": ["PS-0027--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0095.html\">Организация, ковавшая героев (из истории нового гг)</a></li>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0024.html\">Главный герой мира богов и аватаров</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0095.html\">Организация, ковавшая героев (из истории нового гг)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0009.html\">Падения небес</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0027--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-01-18</td>\n<td>92316–92338</td>\n<td>w0023</td>\n<td>Падения небес (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-01-18</td>\n<td>92337–92345</td>\n<td>w0023</td>\n<td>Падения небес (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0027-novyy-glavnyy-geroy.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0027--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0027.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
