<script>const BASE="";const DOCNAME="Медуза";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0255-S01", "PS-0255--proishozhdenie"], "h": "<p>Медуза — аномальный объект, появляющийся в материале о Нимбе (окно w0087, всё обсуждение уместилось в один день, 2025-04-08, id 317251–317542). Вводится не как отдельно придуманный персонаж, а внутри описания того, чем занимается сама организация: «Они типа сцп», «Ловят разный объекты виде чернышей и медузы» (2025-04-08, id 317251–317252). То есть медуза — один из объектов, которые Нимб ловит, наравне с чернышами (<a href=\"PS-0256.html\">Черныши</a>).</p>\n<p>Второе место, где медуза упомянута, — перечисление объектов: «Медуза, черныши, серафим,..» (2025-04-08 21:17, id 317440). Список оборван многоточием, полный состав объектов Нимба в переписке не назван.</p>\n<p>Откуда медуза берётся, кто её создал и почему она так называется — в переписке не сказано.</p>", "r": [["Черныши", "PS-0256.html"]]}, {"t": "Внешность", "a": ["S02", "PS-0255-S02", "PS-0255--vneshnost"], "h": "<p>Не описана. Название вводит в заблуждение: Миколай прямо спрашивает «че за медуза, я думал обычное животное» (2025-04-08 21:33, id 317534) — то есть до этого момента слово читалось как название обычного морского животного. В ответ Слава даёт не описание внешнего вида, а свойство (см. «Способности»). Как медуза выглядит, какого она размера и есть ли у неё вообще привычная медузе форма — осталось нерешённым.</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0255-S03", "PS-0255--sposobnosti"], "h": "<p>Ключевое и единственное названное свойство — внепространственность. Слава: «медуза находиться вне пространства этого мира» (2025-04-08 21:32, id 317530). По просьбе объяснить он разворачивает формулировку: «Чисто формально, но тела его в нашем мире, но законы физике действуют на него по правилам пространства другого мира» (2025-04-08 21:33, id 317536).</p>\n<p>То есть тело находится здесь, а физика к нему применяется чужая — того другого мира. Что это за другой мир, какие именно законы физики в нём действуют и как это проявляется наблюдаемо — в переписке не сказано.</p>\n<p>Второе свойство, названное не как способность, а как хозяйственная характеристика: медуза служит сырьём для препаратов. Первая формулировка — «И на основе их ней крови или чего-нибудь другого создають разный препараты» (2025-04-08 13:30, id 317253). Позже уточнено, что крови у медузы нет:</p>\n<ul>\n<li>Слава: «Медуза»</li>\n<li>Миколай: «это наблюдение и анализ»</li>\n<li>Слава: «Нет крови»</li>\n<li>Миколай: «схуяли»</li>\n<li>Слава: «Биологический жидкости»</li>\n</ul>\n<p>(2025-04-08 21:23–21:24, id 317486–317490)</p>\n<p>Итог: сырьё — «биологический жидкости», не кровь. Какие именно жидкости и какие препараты из них получают — не названо. Реплика Миколая «это наблюдение и анализ» стоит в этом же обмене, но к чему конкретно она относится — к обращению Нимба с медузой или к чему-то другому — из переписки не следует.</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0255-S04", "PS-0255--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Черныши (<a href=\"PS-0256.html\">Черныши</a>)</strong> — второй объект, с которым медузу называют в паре. Оба раза, когда медуза упомянута в списке улова, черныши стоят рядом (id 317252, id 317440). Характер связи между ними, кроме соседства в перечне, не назван.</li>\n<li><strong>Серафим</strong> — назван третьим в оборванном списке объектов (id 317440). Больше в связи с медузой не упоминается.</li>\n<li><strong>Нимб</strong> — организация, которая её ловит. Отношение одностороннее: Нимб добывает, медуза — добыча.</li>\n<li><strong>Препараты Нимба</strong> — конечный продукт, для которого медуза служит сырьём.</li>\n</ul>", "r": [["Черныши", "PS-0256.html"]]}, {"t": "Как менялся", "a": ["S05", "PS-0255-S05", "PS-0255--kak-menyalsya"], "h": "<p><strong>Версия 1 (2025-04-08 13:30, id 317252–317253).</strong> Медуза — один из объектов, которые ловит Нимб; из их «крови или чего-нибудь другого» создают препараты. Никаких свойств за медузой ещё не закреплено.</p>\n<p><strong>Версия 2 (2025-04-08 21:23–21:24, id 317486–317490).</strong> Уточнение по сырью: крови у медузы нет, есть «биологический жидкости». Формулировка версии 1 про кровь тем самым отменена именно для медузы; для чернышей она не пересматривалась.</p>\n<p><strong>Версия 3 (2025-04-08 21:32–21:34, id 317530–317542).</strong> Появляется главное свойство — нахождение вне пространства этого мира, тело здесь, физика по правилам другого мира. Слава сообщает, что материала по этой теме у него много: «Там я вообще поебоду придумал», «Расписывать дофига» (id 317538–317539). Миколай просит рассказывать («рассказывай», «поебать», «так и надо», id 317540–317542), но подробного разбора в чат не поступает.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S06", "PS-0255-S06", "PS-0255--chto-s-nim-stalo"], "h": "<p>Разработка остановилась на версии 3 того же дня. Обещанное подробное описание в переписку не попало — разбор был отложен, и дальше медуза не упоминается.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0255-S07", "PS-0255--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Внешний вид не описан вообще; известно только, что это не обычное животное.</li>\n<li>Не сказано, что за «другой мир», по правилам пространства которого на медузу действуют законы физики, и как эти правила отличаются от здешних.</li>\n<li>Не названо, какие «биологический жидкости» имеются в виду и какие препараты из них делают.</li>\n<li>Не сказано, разумна ли медуза, одна она или их много (в заголовке версий фигурирует и множественное «медузы»), где и как её ловят.</li>\n<li>Не описано, как медуза связана с чернышами и серафимом, кроме перечисления в одном ряду.</li>\n<li>Основной массив придуманного по этой теме («Расписывать дофига») в чат так и не попал — в переписке его нет.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0255--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0256.html\">Черныши</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0256.html\">Черныши</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0009.html\">Организация Нимб (НБО)</a>, <a href=\"GR-0076.html\">Черныши</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0255--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-04-08</td>\n<td>317252–317253</td>\n<td>w0087</td>\n<td>Нимб (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-04-08</td>\n<td>317486–317490</td>\n<td>w0087</td>\n<td>Нимб (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-04-08</td>\n<td>317530–317542</td>\n<td>w0087</td>\n<td>Нимб (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0255-meduza.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0255--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0255.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
