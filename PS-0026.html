<script>const BASE="";const DOCNAME="псих-кукловод";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0026-S01", "PS-0026--proishozhdenie"], "h": "<p>Персонаж возник вечером 4 января 2024 года как заявка Славы под его собственный мир (2024-01-04, окно w0022, id 77240–77248). Формулировка заявки: «В моём мире есть обычный люди и я хочу придумать психа который будет охотится на них используя мозг» (id 77242). То есть отправная точка — не сила, а мозг: охота ведётся головой.</p>\n<p>Уточняющий вопрос Миколая — «Используя мозг? Подробнее» (id 77244). Ответ Славы задаёт набор определений: «Но хитрец, манипулятор, и так далее ( куклод)» (id 77245), следом исправление опечатки — «Кукловод» (id 77246). Так закрепилось рабочее имя. В карточке варианты имени зафиксированы как «кукловод» и «куклод»; собственного имени у персонажа нет.</p>\n<p>Отдельно оговорено происхождение самого психа: «Он человек обычный» (id 77266). Это сказано Славой в конце разговора, после того как Миколай уже предложил механику с богиней плодородия.</p>\n<p>Разговор идёт на фоне обмена репликами про ментальную связь (id 77240–77241) — связь этой темы с персонажем в переписке не проговорена.</p>", "r": []}, {"t": "Характер", "a": ["S02", "PS-0026-S02", "PS-0026--harakter"], "h": "<p>Всё, что сказано о характере, — перечень из заявки: псих, хитрец, манипулятор, кукловод (id 77242, 77245–77246). Охотится на обычных людей своего мира. Мотивация, биография, возраст, происхождение в переписке не названы.</p>\n<p>Отдельно надо развести: в этом же окне Слава пишет про мотивацию главного героя — «вообще он чсв, эгоистичный , не прочь убить и считает себя избранным но у него все ровно есть мораль», «изначально в сюжете он просто веселиться набивая всем морду но дальше нужная какая то цель ?» (id 77263). Это реплика о ГГ, а не о психе-кукловоде; в переписке эти два персонажа не отождествлены.</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0026-S03", "PS-0026--sposobnosti"], "h": "<p>Способность предложена Миколаем, не Славой (2024-01-04, id 77256–77264). Схема такая: «Может например у чела будет богиня плодородия которая даст возможность создавать например афродизиак» (id 77258). То есть источник силы — богиня плодородия, а сама сила — создание афродизиака.</p>\n<p>Далее перечислено, как его применять: «А его по разному можно юзать» (id 77259), «Например контролировать влюблённых» (id 77260), «Давать им приказы» (id 77261). Крайний случай приказа описан так: «Например там можно было попросить умереть человека ради него и он себя убивал во имя любви» (id 77262). Ещё один набор применений — «он будет использовать афродизиак на людях, смотреть их половые акты и заставлять убивать друг друга» (id 77264).</p>\n<p>Обоснование, почему именно эта механика подходит психу, работающему мозгом: «Любов сильная штука» (id 77257).</p>\n<p>Механика при этом остаётся согласованной с тем, что сам персонаж — «человек обычный» (id 77266): сила приходит от богини, а не из его тела.</p>\n<p>Цена, ограничения, дальность действия, срок действия афродизиака, способ его применения (питьё, воздух, касание) в переписке не названы.</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0026-S04", "PS-0026--svyazi-s-drugimi"], "h": "<ul>\n<li>Богиня плодородия — источник способности (id 77258). В карточке связь помечена как «аватар бога плодородия»; в самой переписке этого окна слово «аватар» не звучит, сказано именно «богиня плодородия».</li>\n<li>Мир богов и аватаров — связь указана в карточке записи; в приведённых кусках переписки окна w0022 она не проговаривается.</li>\n<li>Мир Славы, где «есть обычный люди» (id 77242), — среда, в которой персонаж охотится.</li>\n<li>ГГ Славы (id 77263) — упомянут в том же разговоре; связь с психом-кукловодом в переписке не установлена.</li>\n</ul>\n<p>Как пример для разговора Миколай ссылается на постороннее произведение: «Ну знаешь, читал может ли смотрел платиновый предел?» (id 77247), Слава отвечает «Нет» (id 77248). По навигационной пометке окна, дальше Миколай пересказал для примера чужой сюжет про стрелу любви; сам этот пересказ в выписки версий не попал — между id 77248 и id 77256 в записи разрыв.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S05", "PS-0026-S05", "PS-0026--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2024-01-04 (окно w0022, id 77240–77248).</strong> Заявка без способностей. В мире есть обычные люди, на них охотится псих, охотится «используя мозг». Определения: хитрец, манипулятор, кукловод. Никакой сверхъестественной механики на этом этапе не заявлено — только тип поведения.</p>\n<p><strong>Версия 2 — 2024-01-04 (окно w0022, id 77256–77266).</strong> Тем же вечером добавляется механика от Миколая: богиня плодородия, дающая создавать афродизиак; контроль влюблённых, приказы им, самоубийство «во имя любви», наблюдение за половыми актами, принуждение убивать друг друга. Слава в этой же версии фиксирует, что сам псих — «человек обычный».</p>\n<p>Обе версии — один день, 4 января 2024 года, интервал примерно с 21:29 до 21:39. Первая версия второй не отменена: охота «мозгом», хитрость и манипуляция остаются, афродизиак к ним добавляется как инструмент.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0026-S06", "PS-0026--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Принят ли персонаж в мир — в окне не сказано; ветка обрывается решением сначала строить мир.</li>\n<li>Реакции Славы на предложение с богиней плодородия и афродизиаком в выписке нет. Единственная его реплика после предложения — про мотивацию ГГ (id 77263) и «Он человек обычный» (id 77266); принял ли он афродизиак как способность кукловода, не сказано.</li>\n<li>Имени у персонажа нет, есть только рабочее прозвище.</li>\n<li>Внешность не описана вообще.</li>\n<li>Возраст, биография, происхождение силы со стороны персонажа (почему богиня выбрала именно его) не названы.</li>\n<li>Ограничения и цена способности не обсуждались.</li>\n<li>Дальнейшая судьба персонажа в этом окне не прослеживается — что с ним стало, осталось нерешённым.</li>\n<li>Пересказ чужого сюжета про стрелу любви, служивший примером, в записи отсутствует: сообщения между id 77248 и id 77256 в выписки не вошли.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0026--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0093.html\">Аватары</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0093.html\">Аватары</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0009.html\">Падения небес</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0026--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-01-04</td>\n<td>77240–77248</td>\n<td>w0022</td>\n<td>Падения небес (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-01-04</td>\n<td>77256–77266</td>\n<td>w0022</td>\n<td>Падения небес (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0026-psih-kuklovod.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0026--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0026.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
