<script>const BASE="";const DOCNAME="Камень желания";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0244-S01", "SP-0244--mehanika"], "h": "<p>«Камень желание это пропитанное большим количеством оам кристаллы» (2025-10-20, id 376416).</p>\n<p>Действие запускается разрушением кристалла: «Что при разрушение способны попадать в живой организм делая его сильнее быстрее и д. т.» (2025-10-20, id 376416). Перечень усилений оборван самим автором на «и д. т.» — полный список не назван.</p>\n<p>Камень желания входит в более широкий класс, заданный в том же сообщении подряд: «Артефакты это предметы созданный из материалов, который находились близко к метеоритом, либо из осколков самого метеорита» (2025-10-20, id 376414).</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0244-S02", "SP-0244--ogranicheniya-i-cena"], "h": "<p>Плата названа сразу и вплотную к усилению: «Но медленно превращая его в камень желания» (2025-10-20, id 376416). То есть носитель, получивший силу и скорость, сам постепенно становится камнем желания. Скорость процесса определена только словом «медленно», сроки не названы.</p>\n<p>Против этого ищут средство. В окне 2026-06-07 Имет, узнав, что Доима поглотила камень желания, «делает всё возможное чтобы её никто не убил попутно исследуя её организм и ищет лекарство против камня желания» (id 488440). Найдено лекарство или нет — в переписке не сказано; существование лекарства как такового не подтверждено, названы только поиски.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0244-S03", "SP-0244--nositeli"], "h": "<p>Доима, дочь Имета: «узнав что Доима поглотили камень желания ( она и до камня желания была сл)» (2026-06-07, id 488440). Скобочное уточнение оборвано на «сл» — что имелось в виду, в переписке не расшифровано.</p>\n<p>Других носителей переписка не называет.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0244-S04", "SP-0244--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-10-20, id 376414–376418.</strong> Полное описание: кристаллы, пропитанные большим количеством оам; при разрушении попадают в живой организм, дают силу и скорость, медленно превращают его самого в камень желания. Тут же задан класс артефактов и рамка мира: «История будет происходит в современном мире, где давно забыли о существовании Оам. Лишь некоторый люди знают о нём и исследуют» (id 376417).</p>\n<p><strong>Версия 2 — 2026-06-07, id 488440–488442.</strong> Повтор прежней мысли. Камень упомянут как уже известная вещь, в связке с Доимой и Иметом; собственного описания камня в этом окне нет. Вселенная для этого окна помечена как неясная.</p>\n<p>Механика первой версии второй не отменена и не переписана.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0244-S05", "SP-0244--svyaz-s-drugimi-sposobnostyami"], "h": "<ul>\n<li>Артефакты — класс, к которому камень желания отнесён (предметы из материалов, бывших рядом с метеоритами, либо из осколков самого метеорита).</li>\n<li>Оам — материя, которой пропитан кристалл.</li>\n<li>Мир Оам — камень желания числится его частью.</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S06", "SP-0244-S06", "SP-0244--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Описания самого камня в окне w0121 нет, он подразумевается известным.</li>\n<li>Не сказано, как соотносятся «разрушение» кристалла (версия 1) и «поглощение» камня Доимой (версия 2) — одно ли это событие механически, осталось нерешённым.</li>\n<li>Полный перечень усилений не назван («и д. т.»).</li>\n<li>Обратим ли процесс окаменения, что происходит с носителем в конце — не сказано.</li>\n<li>Не сказано, сколько таких камней существует и откуда конкретно они берутся сверх общего правила про артефакты.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["SP-0244--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-10-20</td>\n<td>376414–376418</td>\n<td>w0107</td>\n<td>Оам (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-07</td>\n<td>488440–488442</td>\n<td>w0121</td>\n<td>неясно (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0244-kamen-zhelaniya.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0244--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0244.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
