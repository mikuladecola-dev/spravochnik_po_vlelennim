<script>const BASE="";const DOCNAME="Протобионты";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0280-S01", "PS-0280--proishozhdenie"], "h": "<p>Протобионты (в переписке также «Протобионт», «пробионты») — дети правителей. Определение дано одной фразой и с 2025-05-31 не менялось:</p>\n<p>«У правителей есть дети, которых зовут Протобионты . Это субъект, который был создан именно правителем, а не из-за особенности мира.»</p>\n<p>Ключевое различение — способ появления: протобионт создан лично правителем, а не возник как следствие устройства мира. Этим он отличается от прочих существ своего мира.</p>\n<p>Правители, чьими детьми они являются, описаны в том же куске: «Это не физические существа появившиеся в нигде и в ни чем. Они первыми, что появилось в пустоте. И именно они начали создавать мир. По своему желанию». Первым правителем был правитель кильке, вторым — правитель рая.</p>\n<p>На вопрос Миколая «а, у любого правителя есть пробионты» (2025-05-31, id 331656) Слава отвечает неуверенно: «Ну да наверное» (id 331657). Твёрдого решения по этому пункту нет.</p>", "r": []}, {"t": "Характер", "a": ["S02", "PS-0280-S02", "PS-0280--harakter"], "h": "<p>«Но большинство существ спокойный и миролюбивый. При этом они очень не любят покидать мир своего родителя.»</p>\n<p>Это всё, что сказано о нраве. Сказано именно про большинство — то есть исключения допускаются, но ни одного исключения в переписке не описано. Нежелание покидать мир родителя названо отдельной чертой.</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0280-S03", "PS-0280--sposobnosti"], "h": "<p>Сила протобионта задана через масштаб разрушения: «Подобные субъекты имеют огромную силу, которая в теории позволит уничтожить континент».</p>\n<p>2025-05-31 (окно w0099, id 331649–331657) эта оценка уточняется. Миколай пересчитывает масштаб: «то есть если килька это вселенная, там есть миллион галактик, у галактики миллион солнечных систем у солнечной системы от 1 до 50 планет, на планете например земля относительно среднего или даже небольшого размера 6-7 материков, так вот это существо может уничтожить Евразию 🤯 это огромная сила».</p>\n<p>Слава уточняет, что «континент» относился не ко всем протобионтам: «Я подразумевал существ среднего и малого мира. А вот из нашего то он вполне солнечную систему разрушит» (id 331655). То есть сила протобионта привязана к размеру мира, чьим правителем он порождён: протобионт малого или среднего мира — континент, протобионт «нашего» мира — солнечная система.</p>\n<p>Отдельно протобионт назван среди того, что можно обнаружить: сенсорика благословенных «позволяет ощущать других благослрвенных и арбетара или Протобионтов» (<a href=\"PS-0226.html\">Арбетары</a>).</p>\n<p>Никаких конкретных сил, кроме масштаба разрушения, не названо — что именно протобионт умеет делать, в переписке не сказано.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Как развивалось — не материал авторов</b>\n<p>2025-01-27 — заявили под именем «сущности», сразу с механикой: стихийное бедствие, прилёты, два исхода, отдача по родному миру, один спящий в Перимутском треугольнике. 2025-05-31 — переназвали в протобионтов и переопределили через способ появления: создан правителем, а не особенностью мира. Ограничили в тот же день и дважды: сначала нравом («большинство существ спокойный и миролюбивый», не любят покидать мир родителя), потом масштабом — после того как Миколай пересчитал «континент» в Евразию, Слава сузил оценку до существ среднего и малого мира. Забыли на четыре с половиной месяца. Вернулись 2025-10-18 — но возврат оформительский: Миколай собирает страницу на codepen и цитирует майское сообщение целиком, дословно; Слава отвечает «Очень круто», «Делай так». Уточнение того же мая в копию не вошло, в своде снова стоит «уничтожить континент».</p></div>", "r": [["Арбетары", "PS-0226.html"]]}, {"t": "Связи с другими", "a": ["S04", "PS-0280-S04", "PS-0280--svyazi-s-drugimi"], "h": "<p><strong>Правители.</strong> Протобионты — их дети, и запись отнесена к правителям как часть. Единственный названный способ появления протобионта — создание правителем.</p>\n<p><strong>Килька.</strong> Мир первого правителя. Существа кильке не способны покинуть свой мир никаким образом; благословение даётся только существам, живущим в кильке. Отдельно про протобионтов кильке ничего не сказано.</p>\n<p><strong>Благословение и благословенные.</strong> Прямая связь одна: сенсорика — четвёртая из основных способностей благословенных — ощущает протобионтов. В остальном протобионты и благословенные описаны как разные пути к силе: благословенный получает силу по связи, установленной правителем на мозге, и платит за это мозгом (средняя продолжительность жизни после получения благословения — 10 лет), протобионт же силу имеет как созданный правителем.</p>\n<p><strong>Арбетары (<a href=\"PS-0226.html\">Арбетары</a>).</strong> Стоят рядом в перечне того, что ощущает сенсорика.</p>\n<p><strong>Упырь и Защитник.</strong> На вопрос о масштабе силы Слава ссылается: «В истории было про упыря и битвой с защитником» (id 331654). Связь протобионтов с этим эпизодом в переписке не развёрнута.</p>", "r": [["Арбетары", "PS-0226.html"]]}, {"t": "Как менялся — состояния по датам", "a": ["S05", "PS-0280-S05", "PS-0280--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2025-05-31 (окно w0099, id 331635).</strong> Первое появление, внутри большого свода про правителей, выход существ из миров, благословение и апостолов. Даны: определение (дети правителей, созданные именно правителем, а не особенностью мира), сила «которая в теории позволит уничтожить континент», нрав («большинство существ спокойный и миролюбивый»), нежелание покидать мир родителя.</p>\n<p><strong>Версия 2 — 2025-05-31 (окно w0099, id 331649–331657).</strong> Уточнение силы после пересчёта масштаба Миколаем: «континент» относится к существам среднего и малого мира, протобионт нашего мира разрушит солнечную систему. Здесь же — незакреплённое согласие, что протобионты есть у любого правителя: «Ну да наверное».</p>\n<p><strong>Версия 3 — 2025-10-18 (окно w0106, id 375843–375852).</strong> Тот же текст про правителей, протобионтов и благословение приводится Миколаем целиком — он собирает по одному сообщению Славы черновую страницу («ваще простенький набросок», ссылка на codepen). Формулировки про протобионтов повторены дословно, без изменений. Слава принимает: «Очень круто», «Делай так». Уточнение из версии 2 (солнечная система, привязка к размеру мира) в этот свод не вошло — там снова стоит «уничтожить континент».</p>", "r": []}, {"t": "Пробелы — чего в переписке нет", "a": ["S06", "PS-0280-S06", "PS-0280--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Ни один конкретный протобионт не назван и не описан — есть только категория.</li>\n<li>Что именно протобионт умеет, кроме масштаба разрушения, — не сказано.</li>\n<li>Есть ли протобионты у любого правителя — не решено твёрдо, ответ «Ну да наверное».</li>\n<li>Сколько протобионтов бывает у одного правителя — не сказано.</li>\n<li>Как протобионты появляются на свет и по какой причине правитель их создаёт — не сказано.</li>\n<li>Что представляет собой меньшинство, не подпадающее под «большинство существ спокойный и миролюбивый», — не описано.</li>\n<li>Могут ли протобионты покидать мир родителя, если очень не любят это делать, и какими из перечисленных способов выхода из мира они пользуются, — не разобрано.</li>\n<li>Расхождение между версией 2 (солнечная система для существа нашего мира) и сводом от 2025-10-18 (снова континент) не оговорено и не устранено.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0280--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0226.html\">Арбетары</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0226.html\">Арбетары</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0024.html\">Протобионты (сущности, дети правителей)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0280--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-05-31</td>\n<td>331635–331635</td>\n<td>w0099</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-05-31</td>\n<td>331649–331657</td>\n<td>w0099</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-10-18</td>\n<td>375843–375852</td>\n<td>w0106</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0280-protobionty.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0280--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0280.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0280-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0280/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Особенность этой статьи в том, что висящих ссылок у неё нет: всё, на что она ссылается — <code>PS-0226</code> Арбетары, <code>GR-0024</code>, <code>PS-0278</code> Правители, <code>PS-0279</code> Правитель рая, <code>MR-0207</code> Килька, — статьи имеет. Дорогая дыра здесь другая и внутренняя: сущность разъехалась на четыре записи, и та из них, где лежит первый слой, с этой статьёй не связана.</p>\n<p>Первый слой — январь 2025, id 284852–284857. Он лежит в <code>MR-0108</code> «Сущность» (4 637 знаков, одна ссылка) и в <code>MN-0014</code> Перимутский треугольник (2 436, ноль ссылок), пересказан в <code>GR-0024</code>, и в <code>PS-0280</code> не попал вовсе — здесь даты начинаются с 2025-05-31. В этом слое: прежнее имя класса («сущность»), прежнее имя экземпляра («выродок»), счёт «один правитель — один выродок», действие как стихийное бедствие, развилка двух исходов после прилёта, обратная связь гибели с родным миром и — главное — единственный индивидуализированный протобионт, тот, что спит в Перимутском треугольнике. Статья пишет в пробелах «ни один конкретный протобионт не назван», при том что в базе он назван, просто под другим кодом и другим словом. Это и надо чинить первым: не искать материал, а свести четыре записи в одну линию.</p>\n<p>Отдельно — <code>MR-0108</code>: класс существ заведён с типом «мир». Пока он там, протобионты из раздела персонажей до него не дойдут.</p>\n<p>Второе по цене — <code>SL-0089</code> «Список категорий сил» (четыре ссылки, статьи нет, 1 753 знака) и рядом <code>SL-0051</code> (шесть ссылок, 9 834) и <code>SL-0053</code> (шесть ссылок, 20 313). В названии <code>SL-0089</code> перечислены благословенные, арбетары, альфы, чужемирцы, владельцы артефактов и фантазёры — протобионтов там нет, хотя сенсорика ловит их той же способностью, что и арбетаров. Категория есть в описании мира и отсутствует в реестре категорий.</p>\n<h3>С чего начать</h3>\n<p>В архив идти не нужно: материал весь в базе.</p>\n<p>Порядок такой. Прочесть <code>MR-0108</code> (4 637) и <code>MN-0014</code> (2 436) — это окно 2025-01-27, id 284852–284857. Свести с <code>GR-0024</code>, где январский и майский слои уже стоят рядом и где расхождение по счёту («у каждого правитель есть выродок» против «Ну да наверное» на вопрос о множественном числе) уже зафиксировано как нерешённое. После этого пробел «сколько протобионтов бывает у одного правителя» перестаёт быть пустым — он становится развилкой из двух датированных формулировок, а это другой разговор.</p>\n<p>Смежное, тоже в базе и тоже не подцеплено: <code>MR-0140</code> «Способы покинуть свой мир» (23 534, статья есть) — под пробел «могут ли протобионты покидать мир родителя»; <code>MR-0095</code> Рай (54 131) и <code>MR-0207</code> Килька (68 896) — под привязку силы к размеру мира; <code>PS-0278</code> Правители (26 811) — под нерешённое «есть ли протобионты у любого правителя», тот же вопрос стоит пробелом и в <code>PS-0279</code>.</p>\n<h3>Как развивалось</h3>\n<p>2025-01-27 — заявили под именем «сущности», сразу с механикой: стихийное бедствие, прилёты, два исхода, отдача по родному миру, один спящий в Перимутском треугольнике. 2025-05-31 — переназвали в протобионтов и переопределили через способ появления: создан правителем, а не особенностью мира. Ограничили в тот же день и дважды: сначала нравом («большинство существ спокойный и миролюбивый», не любят покидать мир родителя), потом масштабом — после того как Миколай пересчитал «континент» в Евразию, Слава сузил оценку до существ среднего и малого мира. Забыли на четыре с половиной месяца. Вернулись 2025-10-18 — но возврат оформительский: Миколай собирает страницу на codepen и цитирует майское сообщение целиком, дословно; Слава отвечает «Очень круто», «Делай так». Уточнение того же мая в копию не вошло, в своде снова стоит «уничтожить континент».</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Про выход из мира в тексте два правила разной силы. Для жителей кильки — запрет: они не способны покинуть свой мир «Не каким либо образом». Для протобионтов — нежелание: «очень не любят покидать мир своего родителя», а в январском слое прямо сказано, что они «иногда покидают минимиры и прилетають к нам». Протобионт кильки попадает под оба сразу: он житель кильки и он ребёнок её правителя. Какое из двух правил для него сильнее, не проговорено. То же ребро — с благословением: сказано, что оно даётся только живущим в кильке, но распространяется ли это на детей правителя, названо для жителей и не названо для них.</p>\n<h3>Отклик</h3>\n<p>Сильное место здесь — момент, когда правило меняют арифметикой вслух. Миколай раскладывает «континент» на миллион галактик, миллион солнечных систем, шесть-семь материков и выходит на «это существо может уничтожить Евразию 🤯», а Слава на это не защищает написанное, а тут же перекалибрует шкалу: «Я подразумевал существ среднего и малого мира. А вот из нашего то он вполне солнечную систему разрушит». Кто-то посчитал — и мир подвинулся. Это редкий тип правки: не автор передумал, а число оказалось больше, чем предполагалось на слух. И то, что через четыре месяца эта поправка не пережила копипаст — при вёрстке взяли исходное сообщение, где снова «континент», — по-своему точная деталь: уточнения, сказанные в разговоре, живут хуже, чем текст, который можно скопировать целиком. Сама категория при этом остаётся пустой: сила посчитана до солнечной системы, а существа, которое её применит, нет ни одного, кроме того, что спит.</p></div>", "r": []}];</script>
