<script>const BASE="";const DOCNAME="Правитель";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0120-S01", "MR-0120--ustroystvo"], "h": "<p>Правитель — бог отдельного мира. В базе запись проходит по виду «мир» и по двум вселенным — «Апостол» и «Правитель»; в переписке слово используется двояко: как обозначение фигуры-бога («в каждом этом мире был свой бог. Его называют Правителем») и как название вселенной, о которой авторы говорят отдельно («вселенная правитель», 2026-02-06, id 429344).</p>\n<p>Космогония изложена рассказчиком-агентом (2025-03-18, id 305116): «В начале всего было ничего. Потом появился первый мир \"Килька\". И да это наш мир. А потом начали появляться другие миры. И в каждом этом мире был свой бог. Его называют Правителем. И вот эти миры появляются и по сей день. И между всеми мирами есть некая связь. Но у всех это связь более крепкая с \"Килькой\" С первом миром.»</p>\n<p>То есть устройство такое:</p>\n<ul>\n<li>миры возникают последовательно, первым был Килька, появление новых миров продолжается «по сей день»;</li>\n<li>у каждого мира свой Правитель;</li>\n<li>между всеми мирами есть связь, и у всех она крепче именно с Килькой.</li>\n</ul>\n<p>Правитель как функция описан через благословение (2025-03-19, id 305856, слова имитатора): «и как я уже говорил в каждом мире есть правитель. И в нашем он тоже есть. И та сила который ты получил называется благословения. Правитель другого мира устанавливает с тобой связь и через эту связь даёт тебе силу. Но каждый правитель может дать ограниченной количество благословение.»</p>\n<p>Свойства благословения, названные там же:</p>\n<ul>\n<li>благословение даёт правитель другого мира — связь устанавливается с человеком, и сила идёт через эту связь;</li>\n<li>количество благословений, которое может дать один правитель, ограничено; сколько именно — в переписке не сказано;</li>\n<li>«Благословения можеть получать только разумный житель кильке. Первого мира. Не знаю точно с чем это связано. Но это просто факт» — причина в переписке не объяснена и прямо помечена самим персонажем как неизвестная;</li>\n<li>«Каждый правитель даёт разный способности. Но четыре базовых есть у всех. Это усиления, самоисцеления, энергия и сенсорика»;</li>\n<li>благословлённые одним правителем имеют одинаковые способности; исключение — апостолы, благословлённые правителем рая: «У нас апостолов в отличие от всех. Способность формируется. То бишь у каждого апостола уникальная способность»;</li>\n<li>связь устанавливается с мозгом: «Потому-что связь устанавливается с мозгом. И сила проходит через мозг. Повреждая его. Но не сильно. Именно из-за этого факта мы благословенный не можем использовать благословенния 24/7. И у нас благословенных есть предохранитель в голове. Который при случаи выгорания мозгов отключает благословенния. Но его можно —». Фраза про предохранитель в исходнике обрывается на «Но его можно», продолжения нет;</li>\n<li>внешний признак работы благословения правителя рая — белые глаза: «И его глаза стали белыми. Это был признак использования благословенния правителем рая» (id 305856).</li>\n</ul>\n<p>Переход между мирами. Способов известно три (2025-03-18, id 305117):</p>\n<ol>\n<li>«достигнуть границы своего мира. Часто этот способ используют в маленьких мирах, который только недавно образовались» — относительно Кильки;</li>\n<li>«спомощью ритуал, как с нашей стороны, как и с их ней» — сам ритуал рассказчику не объяснили: «Мне об этом ритуале не рассказали по понятном причинам»;</li>\n<li>«третий самый редкий. Когда правитель сам тебя отправляет в другой мир».</li>\n</ol>\n<p>Отдельно зафиксирована асимметрия: «мы субъекты первого мира. Не модем его пикинуть. Ну вот никак. Ну вот чужемирцы попадають нам за раз плюнуть». Почему жители первого мира не могут выйти — в переписке не сказано.</p>\n<p>Третий способ показан изнутри во второй версии: рассказчик-упырь видит за спиной чёрную дымку, которая тянет его к себе, и думает: «Это правитель пытается меня спасти. Отправив в другой мир» (id 305855). Это предположение персонажа, а не утверждение — он сопротивляется дымке и уходит в неё только потому, что в него влетает ангел.</p>\n<p>Правителю приписывается ещё два возможных действия, оба на уровне догадки рассказчика-упыря (2025-03-19, id 305854–305855):</p>\n<ul>\n<li>спасение выживших при расколе солнца: 17% людей уцелели, «Не знаю, каким чудом. Возможно наш правитель подсобил»;</li>\n<li>само появление упырей: «От чего вообще взялись упыри. Это заража из рая. Или это попытка правителя спасти людей. Не знаю.» Из двух версий ни одна не подтверждена.</li>\n</ul>\n<div class=\"mnote\"><b>⚙ машинная заметка · С чего начать — не материал авторов</b>\n<p>Там же, рядом, лежит и остальное разъехавшееся: устройство благословения — <code>SP-0163</code> (41 683 / 86 784), четыре базовых умения — <code>SP-0164</code> и <code>SP-0165</code>, уникальная способность правителя и связь между благословенными — <code>SP-0167</code>, <code>PS-0181</code>. В этой статье всё это пересказано коротко, потому что дано изнутри реплики имитатора; развёрнутые версии уже собраны отдельно.</p></div>", "r": []}, {"t": "Население", "a": ["S02", "MR-0120-S02", "MR-0120--naselenie"], "h": "<p>Правители — по одному на мир. Ни один правитель нигде в переписке не показан напрямую: он действует через благословение, через чёрную дымку и через предполагаемое спасение выживших. Ни описания, ни имени, ни разговора с правителем в тексте нет.</p>\n<p>Ниже — те, кто в описанной системе миров назван.</p>\n<p>Благословенные — жители Кильки, получившие силу от правителя какого-либо мира. У благословлённых одним правителем способности одинаковые. Базовых способностей четыре: усиление, самоисцеление, энергия, сенсорика.</p>\n<p>Апостолы — благословлённые правителем рая, второго мира. «Нас апостолов 21 во всём мире. Нас, именно нас благословенных правителем рая. Больше чем других благословенных другими правителями» (id 305856). У апостола способность формируется и уникальна. Названы двое: имитатор — «мужчина лет 20-30. В белой рубашке и в тёмных брюках по прозвищу \"имитатор\". Своей настоящей имя он никому не говорил. Да и помни ли он сам его. Спорный вопрос»; и защитник, он же Александр — новый апостол, у которого чужемирцы убили жену и дочь. Способность имитатора в тексте показана как белая цепь, возникающая вокруг головы или шеи противника, и как взрыв изнутри (id 305116, 305856).</p>\n<p>Агенты и структура вокруг них (2025-03-18, id 305116) — та часть населения Кильки, которая занимается чужемирцами. Вербовка идёт вживую, с выбором из двух путей: «Первый я подхожу тебя к остановки и ты едешь домой. Забыв обо всём этом и живя обычной жизнью. Второй — ты становишься агентом и сразаешься с подобными тварями». Дальше — звонок от Михаила Саакашвили, три дня на окончательный ответ, лагерь, шесть месяцев тренировок и «впитывания информации». Рассказчик отучился три недели, поскольку был в идеальной физической форме. Куратор — Михаил с кодовым прозвищем «Медведь», два метра ростом, в кожаном плаще, «суров, но справедливым». Правило: «Каждый агент может быть куратором только для 10 людей». Запись рассказчика была удалена Михаилом через 7 минут, «А его отправитель был наказан».</p>\n<p>Чужемирцы — «Это существо покинувший свой мир. По каким либо причинам. Чаще всего из-за того, что их ней миры суший ад. Или желанием захвата других миров. Ну грубо говоря почти всё чужемирцы жестокие психи. Для которых убийства это обыденная дело. У них там ещё разделения по видам способностей» (id 305116). Классификация по видам способностей упомянута, но не расписана — рассказчик обрывает тему словами «Ну это скука об этом говорить».</p>\n<p>Население разрушенного технологического мира (2025-03-19, id 305854–305855), из которого происходит рассказчик-упырь:</p>\n<ul>\n<li>люди этого мира до катастрофы — технологически развитая цивилизация, сосредоточенная на проблемах Земли, а не других планет; шесть учёных из выживших собрали экзоскелет;</li>\n<li>пераги — заражённые после раскола солнца: «Это люди, который обрастают белыми перьями. Словно они состоят из чистого серебра. Они становятся похожими на ангелов из мифов. Но лишь похожими.» Цель — «убить всё разумной на планете Земля». Коэффициент — 23 заражённых на одного человека. Название дано так: «этих зараженных, которых в других мирах называют Пераг»;</li>\n<li>упыри — 30–40% выживших. «Это не люди, которых тяжело убить»: их можно сбросить с небоскрёба, подорвать, жечь, продырявить череп, выпотрошить, утопить — выживут. При этом «Упырь не владеет, какой-то сверхчеловеческой силой или скоростью. Он просто живучий и всё». Два минуса: неутолимый голод, который утихает только от человечины, и потеря собственного «я» — деградация, которой в итоге не избегает никто, даже те, кто продержался три года или сумел вернуть себе «я»;</li>\n<li>ангел — существо, пришедшее в этот мир как ответ рая на сопротивление: «Гуманоид, состоящий только из белых перьев. Он был вытянутым. По два метра ростом. У него было две пары рук и две пары крыльев. И вертикальный глаз один. Но он был закрыть» — и нимб. Стреляет перьями из крыльев.</li>\n</ul>", "r": []}, {"t": "Место во вселенной — как связан с другими мирами", "a": ["S03", "MR-0120-S03", "MR-0120--mesto-vo-vselennoy"], "h": "<p>Килька — первый мир, «И да это наш мир». С ним у всех остальных миров связь крепче, чем между собой. Только разумный житель Кильки может получить благословение. Жители Кильки не могут покинуть свой мир, тогда как чужемирцы попадают в него легко.</p>\n<p>Рай — второй мир, появившийся после Кильки. Его правитель раздал благословения 21 апостолу — больше, чем любой другой правитель своим благословлённым. К раю же отнесены две линии подозрений из технологического мира: теория, что «все нападения на миры. Были устроены из Рая» (прямо помечено: «это опять же не точно. Лишь теория. Без стопроцентных фактов»), и версия происхождения упырей — «Это заража из рая». Ответ рая на сопротивление упыря — присланный ангел.</p>\n<p>Технологический мир рассказчика-упыря — имени у него в переписке нет. Его положение в системе: связь с другими мирами установлена, но неполная — «Мы могли получать обрывки информации, от разных миров... Но опять же она не было постоянной и стабильной. Да и мы ещё не до конца поняли принцип связи». Из этих обрывков там узнали, что первым миром считают Кильку и что существа могут покидать свои миры. Покидать свой не хотели: «большинство миров. О которых мы узнали информацию. Словно ад наяву. Поэтому мы лучше поживём в своём мире».</p>\n<p>Разрушенные миры. Зафиксирована повторяющаяся схема гибели мира: «У них разбивалось солнце. И начиналось эпидемия неизвестно болезнью в их нём мире». Так погибли три мира — «Ну точнее в трёх мирах в которых мы смогли это за фиксировать». Затем то же произошло с миром рассказчика, примерно через три года после того, как там узнали о разрушении других. Солнце треснуло «Словно стекло» и разбилось на миллиарды светящихся кусочков, накрывших 78% суши и 12% воды. Приведён расчёт: расстояние 149 597 870 700 метров осколки прошли за 3 минуты 36 секунд, то есть при постоянной скорости 694 444,44 км/с; на орбите объекты замедлились, предположительно раз в 10 или больше, поскольку 17% людей выжили. Бункеры, которые строили в качестве подготовки, не помогли: «Сейчас я прекрасно понимаю, что это не поможет. Лишь трата ресурсов». Второй волной пошло заражение — пераги.</p>\n<p>Переход между мирами показан в тексте один раз в обе стороны сразу: чёрная дымка, в которую упырь уходит вместе с влетевшим в него ангелом (id 305855), и чёрная дымка, из которой в мире апостолов вылетают два существа — ангел и упырь (id 305856). Имитатор ожидал одного чужемирца и «только в последние момент засек, что их будет двое».</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0120-S04", "MR-0120--kak-menyalsya-po-versiyam"], "h": "<p>Версия 1 — 2025-03-18 (id 305116–305117, окно w0082), вселенная «Апостол».\nВведено понятие: у каждого появившегося мира есть свой бог, Правитель. Задана последовательность миров от Кильки, связь всех миров с первым, три способа перехода, причём третий — «когда правитель сам тебя отправляет в другой мир» — назван самым редким. Правитель здесь только назван как бог мира; про благословение в этой версии ещё ничего нет. Рассказчик перечисляет темы, которых не успел коснуться: «альфа, апостолы, благословенный, силы зверя, классификация, арбетары, аномалия, существа и так далее». Из этого списка в справочнике далее раскрыты только апостолы и благословение; альфа, силы зверя, классификация, арбитры, аномалия и существа в этом окне остались одними названиями.</p>\n<p>Версия 2 — 2025-03-19 (id 305854–305856, окно w0083), вселенная «Апостол».\nПравитель перестаёт быть только именем бога и получает функцию: он устанавливает связь с человеком и через неё даёт благословение, причём каждый правитель ограничен в числе благословений и даёт свой набор способностей поверх четырёх базовых. Добавлено, что связь идёт через мозг и повреждает его, и что у благословенных есть предохранитель. Появляется правитель рая как отдельная фигура с 21 апостолом. Параллельно правителю приписаны два поступка, оба на уровне догадки персонажа: спасение 17% выживших после раскола солнца и попытка вытолкнуть упыря в другой мир чёрной дымкой. Здесь же — версия, что упыри вообще суть «попытка правителя спасти людей», конкурирующая с версией про «заражу из рая».</p>\n<p>Версия 3 — 2026-02-06 (id 429334–429347, окно w0115), вселенная объявлена как «Правитель».\nСодержания вселенной в переписке нет — только упоминание. Миколай кидает ссылку на документ, сгенерированный нейросетью, и говорит, что тестирует новую нейронку. Слава отвечает: «Давно не читал про вселенную правитель. Поэтому понравилась». Миколай: «тут она лучше раскрыла чем раньше и интереснее», «буду использовать дальше», «мб когда-нибудь документ будет». Никакого нового устройства мира это окно не добавляет; сама вселенная здесь впервые названа именем «Правитель» как отдельная от «Апостола».</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0120-S05", "MR-0120--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Сам Правитель нигде не показан: ни внешности, ни речи, ни прямого действия от первого лица. Все его поступки в тексте — предположения персонажей («Возможно наш правитель подсобил», «Это правитель пытается меня спасти»).</li>\n<li>Сколько именно благословений может дать один правитель — не сказано, только что количество ограничено.</li>\n<li>Почему благословение может получить только разумный житель Кильки — прямо помечено внутри текста как неизвестное: «Не знаю точно с чем это связано. Но это просто факт».</li>\n<li>Почему жители первого мира не могут покинуть свой мир, тогда как чужемирцы входят в него свободно, — не объяснено.</li>\n<li>Ритуал перехода (второй способ) не описан: «Мне об этом ритуале не рассказали по понятном причинам».</li>\n<li>Фраза про предохранитель в голове обрывается на «Но его можно —»; что с ним можно сделать, осталось нерешённым.</li>\n<li>Разделение чужемирцев по видам способностей упомянуто, но не расписано.</li>\n<li>Источник разрушения миров (раскол солнца и последующая эпидемия) остаётся теорией без подтверждения: нападения приписаны раю, но «Лишь теория. Без стопроцентных фактов».</li>\n<li>Происхождение упырей не выбрано между двумя названными версиями — зараза из рая или попытка правителя спасти людей.</li>\n<li>Мир рассказчика-упыря не назван; сколько всего миров существует, тоже нигде не сказано.</li>\n<li>Названия «альфа», «силы зверя», «классификация», «арбетары», «аномалия», «существа» перечислены рассказчиком как оставшаяся часть основы, но в этих окнах не раскрыты.</li>\n<li>Содержание вселенной «Правитель» в окне 2026-02-06 находится за ссылкой на сгенерированный документ; в переписке его нет. Документ по вселенной остался намерением: «мб когда-нибудь документ будет».</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0120--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0023.html\">Правители (правители миров, правители минимиров)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0120--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-03-18</td>\n<td>305116–305117</td>\n<td>w0082</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-19</td>\n<td>305854–305856</td>\n<td>w0083</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-02-06</td>\n<td>429334–429347</td>\n<td>w0115</td>\n<td>Правитель (объявлено)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0120-pravitel.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0120--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0120.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["MR-0120-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/MR-0120/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дороже всего — <code>VS-0010</code> «Правитель» как вселенная: статьи нет, в базе 648 знаков. Это самая пустая вселенная в справочнике; для сравнения, под <code>VS-0002</code> «Апостол» лежит 91 447, под <code>VS-0013</code> «вне вселенной» — 15 911, и даже у «Гигахрущевки» 805. При этом на неё уже смотрят: сама эта статья числится по двум вселенным сразу и в шапке помечает — «статьи ещё нет», и то же самое стоит у <code>PS-0217</code> «Правитель Кильки» и <code>PS-0279</code> «Правитель рая». Три записи привязаны к вселенной, содержания у которой в переписке нет вообще: оно за ссылкой на сгенерированный нейросетью документ.</p>\n<p>Второе — сама эта запись держит в себе две разные вещи. <code>MR-0120</code> числится миром, но описывает фигуру-бога, и одновременно несёт имя вселенной. Фигура при этом уже разобрана по соседям: <code>PS-0278</code> «Правители» (статья 24 168, 26 811 в базе), <code>PS-0279</code> «Правитель рая» (13 984, 23 121, две ссылки), <code>PS-0217</code> «Правитель Кильки» (17 189, 14 203, две ссылки), <code>MR-0097</code> «Правители миров», <code>MR-0103</code> «Правители минимиров», группа <code>GR-0023</code>. Шесть записей об одном, и седьмая, которая называется так же, как вселенная.</p>\n<p>Третье, мелкое, но прямо относящееся к тексту: <code>SP-0264</code> «Белые глаза апостолов» — статьи нет, 2 260 знаков, ноль ссылок, вселенная «неясно». Единственный внешний признак работы благословения, названный в этой статье, лежит отдельной неприписанной записью.</p>\n<h3>С чего начать</h3>\n<p>Начинать надо не с архива переписки — там этого нет. Материал по вселенной «Правитель» лежит за внешней ссылкой: 2026-02-06, окно w0115, id 429334–429347, Миколай кидает документ, сгенерированный нейросетью, Слава отвечает «Давно не читал про вселенную правитель. Поэтому понравилась». Дальше — «мб когда-нибудь документ будет». То есть в архиве обнаружится ровно то, что уже в статье: ссылка и оценка. Идти надо за самим документом, и до этого вселенной <code>VS-0010</code> в справочнике не будет.</p>\n<p>В базе же чинится другое, и сразу. Фраза про предохранитель обрывается на «Но его можно —», и статья справедливо ставит это в пробелы. Продолжение, скорее всего, есть: <code>SP-0204</code> «Предохранитель» — статья 8 877 знаков, 17 153 в базе, две ссылки. Смотреть туда до всякого архива.</p>\n<p>Там же, рядом, лежит и остальное разъехавшееся: устройство благословения — <code>SP-0163</code> (41 683 / 86 784), четыре базовых умения — <code>SP-0164</code> и <code>SP-0165</code>, уникальная способность правителя и связь между благословенными — <code>SP-0167</code>, <code>PS-0181</code>. В этой статье всё это пересказано коротко, потому что дано изнутри реплики имитатора; развёрнутые версии уже собраны отдельно.</p>\n<p>Если всё-таки идти в архив, то за одним промежутком: между 305856 (2025-03-19) и 429334 (2026-02-06) у этой сущности пусто — почти одиннадцать месяцев. Правители при этом за то же время обросли материалом в других записях (свод 2025-05-31, id 331635). Проверять надо, в какой момент слово «правитель» перестало быть именем бога и стало именем вселенной.</p>\n<h3>Как развивалось</h3>\n<p>18 марта 2025 понятие вводится одной строкой внутри лекции: у каждого мира есть свой бог, его называют Правителем. Ни функции, ни облика — только имя и место в порядке миров. На следующий день, 19 марта, у него появляется работа: он ставит связь с человеком и через неё даёт силу, количество благословений у каждого правителя ограничено, связь идёт через мозг и мозг повреждает, есть предохранитель. И тут же — три поступка, приписанных ему персонажами на уровне догадки: спас 17% выживших, «возможно наш правитель подсобил»; тянет упыря в чёрную дымку, «это правитель пытается меня спасти»; и, может быть, вообще породил упырей — или это была зараза из рая, «не знаю». Дальше почти год ничего. 6 февраля 2026 слово возвращается уже как имя отдельной вселенной, и возвращается вместе с чужим текстом: нейросетевой документ, «тут она лучше раскрыла чем раньше», «буду использовать дальше». Назвали — нагрузили функцией и догадками — оставили — вернулись, но не своим текстом.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Про то, как благословение видно снаружи, правило названо для одного правителя. «И его глаза стали белыми. Это был признак использования благословенния правителем рая» — признак привязан именно к правителю, а не к человеку, и это здесь же обосновано: благословлённые одним правителем имеют одинаковые способности, набор задаёт правитель. Раз признак — свойство правителя, у каждого правителя он свой, и это следует прямо из вашей же конструкции. Но названо это только для рая; ни для одного другого правителя внешнего признака работы благословения нет — при том что в мире действует организация, которая ловит чужемирцев и отличает своих от чужих, и опознавать благословенных ей чем-то надо. Правило для рая проговорено, для соседнего случая — для любого другого правителя — не проговорено.</p>\n<h3>Отклик</h3>\n<p>Самое интересное здесь — то, что Правителя нет. Ни одного появления, ни реплики, ни описания: всё, что он делает, дано через догадку персонажа, который лежит в развалинах и предполагает. «Не знаю, каким чудом. Возможно наш правитель подсобил». «Это правитель пытается меня спасти. Отправив в другой мир» — и он же сопротивляется, и уходит в дымку только потому, что в него влетел ангел. Даже происхождение упырей не выбрано между двумя версиями, и одна из них — что бог пытался людей спасти, а получились упыри. Бог, существующий исключительно в форме чужих предположений о нём, — это сильнее, чем если бы его показали. И отдельно зацепила обрубленная фраза про предохранитель: «Который при случаи выгорания мозгов отключает благословенния. Но его можно —». В тексте про предохранитель, стоящий между человеком и выгоранием мозга, обрыв на полуслове читается почти как эффект. Он, конечно, не задуман — но пока продолжение не найдено, работает именно так.</p></div>", "r": []}];</script>
