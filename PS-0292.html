<script>const BASE="";const DOCNAME="Лёха и Андрей";
const LEAD="<p>Двое из четверых друзей детства безымянного рассказчика «Бетонного героя» (<a href=\"PS-0291.html\">Герой-рассказчик (Бетонный герой)</a>). В карточке они сведены в одну запись; в тексте это два разных человека, упомянутых по разным поводам. Варианты написания в источнике: «Лёха» и «Леха», «Андрей». Весь материал — 2025-09-08, окно w0103, id 362528–362531.</p>";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0292-S01", "PS-0292--proishozhdenie"], "h": "<p>Оба — из одного двора с рассказчиком и Димой. Двор описан один раз: «Когда-то давно, когда я был ещё ребёнком, что не ходил в школу. Я часто гулял с друзьями с одной площадки. На той площадки была четыре квартиры и четыре ребёнка у каждого. И на удивление одного возраста. Дима, Леха и.. Андрей, ну и я. Четыре друга».</p>\n<p>То есть: четыре квартиры на площадке, в каждой по ребёнку, все четверо — ровесники. Дружба идёт с дошкольного возраста рассказчика.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0292-S02", "PS-0292--vneshnost"], "h": "<p>Не описана ни у одного из них.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0292-S03", "PS-0292--harakter"], "h": "<p>Индивидуальных черт ни у Лёхи, ни у Андрея не дано. Единственная характеристика — общая на всех четверых и относится к детству: «Не кто друг от друга особо не отличался. Как никак в детстве особо характер ещё не сформировался. Были лишь желания и инстинкты. В детстве больше всего были похоже на зверей».</p>\n<p>Отличающая черта в этом перечислении названа только у Димы (пристрастие к заброшкам), у Лёхи и Андрея — нет.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Что не сформулировано по вашей же логике — не материал авторов</b>\n<p>Правило про детство названо прямо и как общее: «Не кто друг от друга особо не отличался. Как никак в детстве особо характер ещё не сформировался. Были лишь желания и инстинкты». И тут же для одного из четверых сделано исключение — «Но даже так наш Дима уже имеет пристрастья к заброшенным зданиям». То есть правило введено и в том же абзаце нарушено, и нарушение отмечено союзом «даже так», то есть автор его видит. Для Лёхи и Андрея вторая часть не проговорена ни в какую сторону: не сказано ни что у них исключений не было, ни что были. Правило заявлено как общее, изъятие названо для одного, статус остальных двух не оговорён.</p></div>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0292-S04", "PS-0292--svyazi-s-drugimi"], "h": "<p><strong>Лёха и рассказчик (<a href=\"PS-0291.html\">Герой-рассказчик (Бетонный герой)</a>).</strong> Лёха — участник пятничной попойки, после которой рассказчик очнулся в бетонном мире: «Да я помню, как мы с Димой и Лёхой собрались в пятницу у Димы, и начали употрее алкоголь». Он же — один из тех, кого рассказчик ищет с первых минут: «И была ещё одна мысль - где Дима с Лёхой? - ведь именно с ними я вчера и выпил». Ранее, ещё не поняв, где находится, рассказчик думает о них так: «а друзья? Наверное ещё вчера ушли в пьяном угаре бросив меня».</p>\n<p>Ради них рассказчик обходит этажи здания, а потом бросает эту затею: «на последних этажах я плюнул на идею здесь кого-то найти».</p>\n<p><strong>Андрей и рассказчик.</strong> Андрей появляется только в воспоминании о площадке и в самой попойке не участвует — по крайней мере, среди собравшихся у Димы он не назван. В перечислении друзей его имя идёт после паузы: «Дима, Леха и.. Андрей, ну и я».</p>\n<p><strong>Дима.</strong> Четвёртый из компании, друг «ещё со школы», «любитель подобных мест. Заброшек я имею ввиду». В детстве «наш Дима уже имеет пристрастья к заброшенным зданиям», и он нашёл заброшенный дом, «большое и бетонные». В пятницу пили у него.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Дорогая дыра здесь не в Лёхе с Андреем, а в четвёртом. Статья сводит в одну запись двоих безымянных, а Диму — того же двора, той же площадки, той же пятницы — держит текстом в разделе «Связи с другими» и не выводит в связи. Между тем <code>PS-0050</code> «Дима» существует: статья есть, база 36 806 знаков, 2024-04-03 — 2025-11-21, три окна. Ссылок на него ноль — ни отсюда, ни из <code>PS-0291</code>. Получается, что запись про друзей детства не соединена с единственным из этих друзей, у кого есть собственный материал, включая карточку 2024 года со способностью и версию 2025-11-21 с описанием внешности. Чинить это первым: одна связь подтягивает 36 тысяч знаков к кусту, где сейчас всё висит с нулём входящих.</p></div>", "r": [["Герой-рассказчик (Бетонный герой)", "PS-0291.html"]]}, {"t": "Как менялся — состояния по датам", "a": ["S05", "PS-0292-S05", "PS-0292--kak-menyalsya"], "h": "<p>Версия одна, 2025-09-08, окно w0103, id 362528–362531. Внутри неё оба упоминаются в двух местах:</p>\n<p><strong>id 362528 и 362529.</strong> Лёха назван как участник вчерашней попойки и как один из пропавших друзей. Андрей здесь не упоминается.</p>\n<p><strong>id 362531.</strong> Воспоминание о детстве, где названы все четверо и указан состав двора: четыре квартиры, четверо детей-ровесников.</p>\n<p>Изменений замысла, переработок или отклонённых вариантов в переписке нет — оба вводятся сразу в том виде, в каком остаются.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S06", "PS-0292-S06", "PS-0292--chto-s-nim-stalo"], "h": "<p>Неизвестно. За весь текст рассказчик не находит ни Лёху, ни Андрея, ни Диму и вообще ни одного живого существа. Попали ли они в бетонный мир вместе с ним, в переписке не сказано.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0292-S07", "PS-0292--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Судьба Лёхи и Андрея в бетонном мире не раскрыта — герой их не нашёл (отмечено в карточке как неясность окна w0103).</li>\n<li>Был ли Андрей на пятничной попойке — не сказано; в перечне собравшихся его нет, но и прямого указания на отсутствие тоже нет.</li>\n<li>Фамилий, возраста (кроме того, что они ровесники рассказчика), внешности, занятий и характера ни у одного из них нет.</li>\n<li>Поддерживали ли они дружбу во взрослом возрасте все вчетвером или только Дима с Лёхой — не сказано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0292--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0291.html\">Герой-рассказчик (Бетонный герой)</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0291.html\">Герой-рассказчик (Бетонный герой)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0292--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-09-08</td>\n<td>362528–362531</td>\n<td>w0103</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0292-leha-i-andrey.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0292--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0292.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0292-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0292/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дорогая дыра здесь не в Лёхе с Андреем, а в четвёртом. Статья сводит в одну запись двоих безымянных, а Диму — того же двора, той же площадки, той же пятницы — держит текстом в разделе «Связи с другими» и не выводит в связи. Между тем <code>PS-0050</code> «Дима» существует: статья есть, база 36 806 знаков, 2024-04-03 — 2025-11-21, три окна. Ссылок на него ноль — ни отсюда, ни из <code>PS-0291</code>. Получается, что запись про друзей детства не соединена с единственным из этих друзей, у кого есть собственный материал, включая карточку 2024 года со способностью и версию 2025-11-21 с описанием внешности. Чинить это первым: одна связь подтягивает 36 тысяч знаков к кусту, где сейчас всё висит с нулём входящих.</p>\n<p>Второе, что стоит решить до, а не после: одноимённость. <code>PS-0132</code> «Андрей» — статьи нет, база 21 822, вселенные «Нимб» и «монстры», ссылок ноль. Это другой человек. Пока обе записи не разведены явно, любой поиск по имени будет их путать, а материал <code>PS-0132</code> при разборе легко утечёт сюда.</p>\n<h3>С чего начать</h3>\n<p>В базе. Весь материал этой карточки — 2025-09-08, id 362528–362531, окно w0103, и за его пределами в архиве по этим двоим ничего нет: ни Лёха, ни этот Андрей больше нигде не всплывают.</p>\n<p>Разъехалось оно по соседним записям. Дословка про площадку и про заброшенный дом лежит в <code>PS-0050</code> (36 806) — там же обе цитаты приведены целиком и добавлено «И вот он нашёл заброшенный дом большое и бетонные», которого в этой статье нет. Контекст сцены с попойкой — в <code>IS-0066</code> (61 184) и <code>PR-0088</code> (23 902); <code>PR-0090</code> (23 110, статьи нет) — по имени тот же самый набор четырёх глав, его надо сверить с <code>PR-0088</code>, прежде чем считать источником.</p>\n<p>Одна проверка стоит отдельно: 2025-09-15, id 365401–365404 — Миколай пересылает тот же текст четырьмя сообщениями. В <code>IS-0066</code> это записано как повтор. Сверить перечисление друзей в пересылке с оригиналом 362531 имеет смысл ровно потому, что вся карточка держится на одной фразе с многоточием.</p>\n<h3>Как развивалось</h3>\n<p>Внутри одного дня и в одну сторону. Сначала Лёха вводится как действующее лицо — участник пятничной попойки и один из тех, кого герой ищет (362528–362529). Потом, через два сообщения, оба сводятся в перечисление из детства (362531), где Андрей появляется впервые и сразу же в прошедшем времени. После 362531 ни один из них не возвращается: поиск друзей по этажам герой бросает раньше, чем вспоминает про площадку. Пересылка 2025-09-15 идёт без изменений. Заявили — сузили до одной строки воспоминания — не вернулись.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Правило про детство названо прямо и как общее: «Не кто друг от друга особо не отличался. Как никак в детстве особо характер ещё не сформировался. Были лишь желания и инстинкты». И тут же для одного из четверых сделано исключение — «Но даже так наш Дима уже имеет пристрастья к заброшенным зданиям». То есть правило введено и в том же абзаце нарушено, и нарушение отмечено союзом «даже так», то есть автор его видит. Для Лёхи и Андрея вторая часть не проговорена ни в какую сторону: не сказано ни что у них исключений не было, ни что были. Правило заявлено как общее, изъятие названо для одного, статус остальных двух не оговорён.</p>\n<h3>Отклик</h3>\n<p>Зацепило многоточие. «Дима, Леха и.. Андрей, ну и я» — две точки вместо трёх, пауза посреди перечисления, и она делает больше, чем сделала бы страница описания: человек вспоминает и на третьем имени спотыкается. Дальше Андрей в тексте не появляется вообще, и это выглядит не как недоработка, а как продолжение той же паузы. Не знаю, было ли так задумано, — по переписке этого не видно, — но работает. И арифметика двора хороша своей неправдоподобной ровностью: четыре квартиры, в каждой по ребёнку, все одного возраста, «И на удивление одного возраста» — герой сам отмечает, что это удивительно. Так и вспоминают детство: слишком аккуратно, чтобы быть правдой, и слишком конкретно, чтобы быть выдумкой.</p></div>", "r": []}];</script>
