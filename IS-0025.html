<script>const BASE="";const DOCNAME="Память забытому";
const LEAD="";
const CH=[{"t": "Содержание", "a": ["S01", "IS-0025-S01", "IS-0025--soderzhanie"], "h": "<p>Текст Миколая от 20 августа 2024 (id 220649–220650), одна версия. «Память забытому» — книга Захара Авгура, с которой он претендовал на Пулитцеровскую премию. Сам текст, присланный в переписку, — не книга, а монолог Захара от первого лица о дне трансляции церемонии награждения. Содержание самой книги в переписке не раскрыто.</p>\n<p><strong>Ожидание церемонии.</strong> Захар обращается к читателю напрямую и объясняет, что происходит: «я бы не сказал что прославился, до этого ещё далеко, но как минимум сегодня покажут ту самую церемонию». Речь о «презентации вручения Пулитцеровской премии», которую показывают не прямым эфиром — «это всё из-за особенностей церемонии». Он представляется: «да, моя фамилия похожа на название древних жрецов, всё верно. Захар Авгур, автор книги \"Память забытому\"».</p>\n<p><strong>Мотив.</strong> Захар прямо называет, зачем ему трансляция: «там должны показать меня для огромной аудитории, это даст надёжную репутацию, что в разы прибавит мне известность. а я, если честно, очень жажду славу». Его рассуждение о бессмертии: «думать о бессмертии физическом бесполезно, людей обладающих ей не существовало, так что, все последующие потуги также безнадёжны. но вот в историю своё имя вписали многие, а моя цель затмить их своим величием. это самая достойная форма бессмертия».</p>\n<p>О своей книге он говорит только в терминах успеха, не содержания: «в своей работе я реализовал все критерии известного опуса и создал её в форме, которая обязана возыметь огромную аудиторию, культовость и популярность. мой стиль значительно отличается от чужих, поэтому моё имя процитируют все издательства».</p>\n<p><strong>Новость перед эфиром.</strong> Трансляцию внезапно сменяет «новость о задержании похитителей человека с рыбьей мутацией». Захар это отвергает: «ладно, только не говори, что поверил в эту сказку. мистических явлений не существует по крайней мере по телевизору о них точно не будут так нелепо говорить».</p>\n<p><strong>Знакомый в капюшоне.</strong> В окно первого этажа кто-то стучит; Захар выходит и пугается — «там стоял темный злой силуэт в капюшоне. но это оказался мой знакомый». Он впускает его и предлагает вместе посмотреть церемонию, но знакомый встаёт перед телевизором и отчитывает Захара за то, что тот не читает почту. Захар объясняет, почему не читает: «но меня она так не волнует, я всё время пишу без конца и стараюсь улучшить навык, последний раз почту проверял, когда пригласили на церемонию».</p>\n<p>Про знакомого сказано, что он «помешан на всяких мистических существах». Захар когда-то рассказал ему «известную байку о неком монстре, вроде Беркут звать»: «с ним была какая-то тёмная история связана». После этого знакомый «пошёл весь в ярости и с улыбкой до ушей в тот город где обитает это существо». Теперь он утверждает, что «изгнал этого монстра», «спас детей того города и будущее теперь под его защитой», и зовёт Захара на какое-то задание.</p>\n<p>Захар в это не верит и объясняет почему: «да если бы он реально был героем, то о его подвигах знали бы все. как говорится \"герою - слава\". а о нём почти никто не знает, уличный парень. если бы я в этой истории его не упомянул, то и ты бы нигде больше о нем не услышал». И отдельная причина дружбы: «он мне не конкурент, поэтому мы с ним дружим».</p>\n<p><strong>Премия достаётся другому.</strong> На экране премию вручают не Захару, а Диферу Фрогу. Реакция: «да кто вообще посмел этого никчёмного графомана вообще пускать на телевизор, каждая его работа - третьесортная компиляция и подростковый опус. его работы достойны максимум четвёрки за урок по литературе и похвалу от матушки». Захар настаивает, что награждение уже состоялось: «он первый раз участвствует в этом конкурсе, я участвую шестнадцатый год, я всё сделал идеально. меня уже наградили, я присутствовал там». Свидетелей у него нет — «ну ладно, свидетелей из знакомых не было. но это точно не сон».</p>\n<p>Объяснение даёт знакомый: «мои работы через неделю признали экстремистскими и поэтому пришлось отдать место второму кандидату, не менее достойному». Захара об этом не предупредили, но «мне оказывается писали на почту».</p>\n<p><strong>Сговор.</strong> Захар сначала пробует извлечь пользу из провала: «стоп, может благодаря тому, что мою работу признали экстремистской это мне подарит известность. хотя..». Дальше знакомый излагает своё дело: «у нас по улицам ходит гибрид монстра и человека», его нужно поймать. Захар оценивает это как «человека похитить, он точно сумасшедший», и добавляет: «но его полный план на деле был куда мрачнее».</p>\n<p>Подкупает Захара то, что «все действия с этим существом (хотя явно этот поехавший просто выберет человека), будут транслироваться в даркнете». Отсюда его собственный расчёт: «а я хочу чтобы моё имя было известно на веки. он точно не спалится, а вот я. я придумаю план, как можно сделать так, чтобы нас разоблачили. да так, чтобы об этом узнал весь мир». Финальная реплика: «ну, я смогу заполучить славу, у меня это получиться в любом случае».</p>", "r": []}, {"t": "Персонажи", "a": ["S02", "IS-0025-S02", "IS-0025--personazhi"], "h": "<p><strong>Захар Авгур</strong> — автор книги «Память забытому», рассказчик текста. Сам отмечает, что фамилия «похожа на название древних жрецов». Участвует в конкурсе шестнадцатый год. Пишет постоянно — «я всё время пишу без конца и стараюсь улучшить навык» — и не читает почту. Цель у него названа прямо: слава как форма бессмертия, «моя цель затмить их своим величием. это самая достойная форма бессмертия». В мистику не верит и в конце соглашается на похищение живого существа ради известности, планируя устроить собственное разоблачение. «Память забытому» указана как часть материала о Захаре Авгуре.</p>\n<p><strong>Дифер Фрог</strong> — второй кандидат, которому досталась Пулитцеровская премия после того, как работы Захара признали экстремистскими. На конкурсе впервые. В оценке Захара — «никчёмный графоман», чьи работы «третьесортная компиляция и подростковый опус».</p>\n<p><strong>Знакомый в капюшоне</strong> — имя в переписке не названо. «Уличный парень», помешан на мистических существах, о его подвигах почти никто не знает. Утверждает, что изгнал монстра Беркута и спас детей города. Приносит Захару известие о признании работ экстремистскими и втягивает его в план с ловлей «гибрида монстра и человека» и трансляцией в даркнете.</p>\n<p><strong>Беркут</strong> — монстр из «известной байки», которую Захар рассказал знакомому. «с ним была какая-то тёмная история связана». Обитает в некоем городе. Дальше в переписке о нём ничего нет.</p>\n<p><strong>Человек с рыбьей мутацией</strong> — упомянут только в телевизионной новости о задержании его похитителей. Захар считает новость выдумкой.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "IS-0025-S03", "IS-0025--mesto-vo-vselennoy"], "h": "<p>Вселенная в переписке не названа; отнесение к «монстрам» сделано по дате.</p>\n<p>Мир текста устроен как обычный: телевидение, Пулитцеровская премия, признание работ экстремистскими, почта, даркнет. Монстры в нём существуют на положении баек и телевизионных нелепиц — Захар, находясь внутри этого мира, отрицает и мистику, и рассказы знакомого, при этом сам является источником байки о Беркуте. Названы три случая соприкосновения с монстрами: новость о задержании похитителей человека с рыбьей мутацией, изгнание Беркута из города, и «гибрид монстра и человека», ходящий по улицам.</p>\n<p>Отдельная линия — «герою - слава»: у Захара известность и есть мера подлинности, поэтому неизвестный знакомый для него не герой, а сумасшедший.</p>", "r": []}, {"t": "Состояние", "a": ["S04", "IS-0025-S04", "IS-0025--sostoyanie"], "h": "<p>Одна версия, 20 августа 2024, окно w0054, id 220649–220650. Текст прислан двумя сообщениями подряд и обрывается на решении Захара участвовать в плане. Что было дальше — в переписке нет. Отклика Славы, правок и второй редакции в материале тоже нет.</p>\n<p>Сама книга «Память забытому» внутри истории существует как готовая и уже отмеченная премией работа, которую через неделю после награждения признали экстремистской, из-за чего премию передали второму кандидату.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "IS-0025-S05", "IS-0025--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вселенная не названа.</li>\n<li>Содержание книги «Память забытому» не раскрыто — сказано только, что в ней «реализованы все критерии известного опуса».</li>\n<li>За что именно работы Захара признали экстремистскими — не сказано.</li>\n<li>Имя знакомого в капюшоне не названо.</li>\n<li>«Тёмная история», связанная с Беркутом, только упомянута; город, где он обитает, не назван; как именно знакомый его изгнал — не сказано.</li>\n<li>«Гибрид монстра и человека», которого предлагается поймать, не описан и не назван; тот же вопрос с планом, о котором сказано «но его полный план на деле был куда мрачнее» — в чём план, не раскрыто.</li>\n<li>Чем закончилась затея с трансляцией в даркнете и с задуманным разоблачением — в переписке нет.</li>\n<li>Расхождение между «меня уже наградили, я присутствовал там» и вручением премии Диферу Фрогу на записи не объяснено; свидетелей у Захара нет, и вопрос оставлен как есть.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["IS-0025--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-20</td>\n<td>220649–220650</td>\n<td>w0054</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/istorii/IS-0025-pamyat-zabytomu.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["IS-0025--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/IS-0025.md</code> — они переживают пересборку.</em></p>", "r":
