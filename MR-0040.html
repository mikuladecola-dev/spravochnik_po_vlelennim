<script>const BASE="";const DOCNAME="Деревни";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0040-S01", "MR-0040--ustroystvo"], "h": "<p>Деревни — отдельный от островов тип поселений в мире «7 островов». Введены Славой одной репликой: «Также помимо островов есть деревни» (2024-07-09, id 202444).</p>\n<p>Размер задан не напрямую, а через отрицания — Миколай перебирал знакомые образцы, Слава каждый раз отводил:</p>\n<ul>\n<li>«по типу конохи?» — «Нет они меньше» (id 202445–202450);</li>\n<li>«как зомби деревня в Майнкрафте?» — «Нет они больше» (id 202451–202453);</li>\n<li>«типо Чернобыля» — «Нет они не радиоактивный» (id 202454–202455).</li>\n</ul>\n<p>То есть деревни больше майнкрафтовской деревни, но меньше Конохи, и не радиоактивные. Никакого другого описания устройства — построек, уклада, числа деревень — в переписке нет.</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0040-S02", "MR-0040--naselenie"], "h": "<p>На вопрос «кто там живёт» ответ: «Люди и нелюди зависит от деревни» (2024-07-09, id 202456–202457). Кто именно относится к «нелюдям» и какие деревни чьи — не сказано.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0040-S03", "MR-0040--mesto-vo-vselennoy"], "h": "<p>Деревни существуют «помимо островов» и островам не принадлежат. Причину Миколай спросил прямо: «а почему они не принадлежат островам?» Слава ответил двумя репликами: «Ну они ближе островов находятся» и «Потому что защитник не всемогущий ему и так тяжело» (2024-07-09, id 202458–202460).</p>\n<p>Таким образом расположение (ближе островов) и непринадлежность объяснены пределом возможностей защитника, а не расстоянием и не политикой. Ближе к чему именно находятся деревни — в переписке не уточнено.</p>\n<p>Запись связана с сущностями «Защитники островов», «Мир островов (архипелаг защитников)», «Ультима туле»; сама деревни отнесены к части «Мир островов (архипелаг защитников)».</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0040-S04", "MR-0040--kak-menyalsya-po-versiyam"], "h": "<p>Версия одна — 2024-07-09, окно w0046, сообщения 202443–202461. Всё описание деревень уложилось в один заход около 23:13–23:16. Разговор оборвался на вопросе Миколая «насколько мир большой?» (id 202461), ответа в этом фрагменте нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0040-S05", "MR-0040--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Сколько деревень — не названо.</li>\n<li>Названия деревень отсутствуют.</li>\n<li>Кто такие «нелюди» — не расшифровано.</li>\n<li>Чем деревни живут, как управляются, есть ли у них свой защитник — в переписке не сказано.</li>\n<li>«Ближе островов» — относительно чего, осталось нерешённым.</li>\n<li>Вопрос о размере мира (id 202461) остался без ответа.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0040--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0040--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-09</td>\n<td>202443–202461</td>\n<td>w0046</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0040-derevni.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0040--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0040.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
