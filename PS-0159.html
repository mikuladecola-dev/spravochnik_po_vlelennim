<script>const BASE="";const DOCNAME="Крим";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0159-S01", "PS-0159--proishozhdenie"], "h": "<p>Персонаж Миколая. Появляется в истории, присланной 2024-09-17 в окне w0057 (текст целиком в id 230873). Историю Миколай отправляет с оговоркой, что она уже была написана до этого: «давай скину историю которая уже есть» (230869–230870), «она скучная и без Монстро» (230871), «но норм» (230872). После текста стоит пометка «потом раскрою» (230874).</p>\n<p>Имя звучит в самом тексте — в репликах мамы: «потише Крим», «Крими тише». Второе — уменьшительное от того же имени.</p>\n<p>Вселенная в окнах w0057 и w0058 не объявлена; отнесение к «монстрам» идёт по дате объявления.</p>", "r": []}, {"t": "Характер", "a": ["S02", "PS-0159-S02", "PS-0159--harakter"], "h": "<p>Крим — рассказчик истории, голос от первого лица детский. Устройство героя в том, что слова взрослых он понимает буквально и проверяет их как механики — не как речевые обороты, а как действующие правила.</p>\n<p>Разбор реплик матери идёт у него вслух, по шагам: «я тогда не понял, к чему это она, но походу из-за того что рядом люди она меня не хочет слушать. хотя, нет, при людях мама меня слушала, может это она сама с собой говорит, а меня не слышит или подумала, что я просто хотел её назвать?»</p>\n<p>Отговорку про деньги он проверяет и отвергает: «мне кажется, она меня обманывает, я знаю что за деньги всё можно купить и их было много много, а купила она не много».</p>\n<p>Когда мама просит «волшебное слово», он отвечает «ТРИПЛ ХУК» — и, услышав смех, немедленно вносит поправку в свою картину мира: «все, включая маму засмеялась, значит тут эта фраза не отбрасывает соперника ломая позвоночник, а заставляет смеяться, прикольно». То есть в известной ему системе «Трипл Хук» — приём, ломающий позвоночник соперника; в супермаркете он даёт другой эффект, и Крим просто фиксирует новое поведение той же фразы.</p>\n<p>Дальше он проверяет уже «пожалуйста» — подряд, на всех: на маме, на девушке у выхода, на мужчине со сливками, на девочке. Каждый раз срабатывает, и каждый раз он расширяет применение. Он не сомневается в правиле, он его исследует.</p>\n<p>Отношение к матери — без критики, но и без иллюзий: «мама скривила лицо, так, словно я какой-то псих. но мама это моя мама, всё хорошо». Девушку 16 лет он находит лучше матери: «она такая красивая, мягкая и молодая, не то, что мама».</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0159-S03", "PS-0159--sposobnosti"], "h": "<p>Собственных способностей у Крима в переписке нет. Работает у него слово «пожалуйста», а не он сам. Правило ему даёт мама (230873): «есть волшебное слово \"пожалуйста\", если его скажешь, то тебе всё отдадут что хочешь и сделают всё, что пожелаешь, попробуй. только помни, его нужно говорить спокойно, но чётко. сначала произносишь, что тебе нужно, а потом слово или наоборот».</p>\n<p>Крим применяет его буквально по инструкции и последовательно. Отдельно в тексте показано, что условие «спокойно» — рабочее: на крик «ОТПУСТИ ПОЖАЛУЙСТА» мама не отпускает и напоминает — «ну я же говорила, что надо спокойно говорить»; после спокойного «пожалуйста отпусти мою руку» отпускает.</p>\n<p>Природа этого разъяснена Миколаем в w0058 (232687–232690): «сейчас оно не волшебное, просто ебанутые взрослые решили подыграть», «а он поверил», и дальше — «вера порадила монстра».</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0159-S04", "PS-0159--svyazi-s-drugimi"], "h": "<ul>\n<li>Слово «пожалуйста» / Волшебное слово «пожалуйста» — главный элемент, с которым связан персонаж. Миколай прямо ставит слово выше героя: «а вообще пока самое главное в истории даже не гг», «а слово \"пожалуйста\"», «и то только сейчас» (232682–232684).</li>\n<li>История про Крима и волшебное слово «пожалуйста» — история, в которой он центральный герой и рассказчик.</li>\n<li>Мама — единственный названный близкий; она даёт правило и она же его ограничивает условием «спокойно».</li>\n<li>Колосс — супермаркет, в котором происходит вся история.</li>\n<li>Трипл Хук — фраза из другой известной Криму системы, где она «отбрасывает соперника ломая позвоночник».</li>\n<li>Монстро — упомянут Миколаем при отправке истории как то, чего в ней нет: «она скучная и без Монстро» (230871). Связан ли Крим с Монстро — неясно.</li>\n<li>Девушка 16 лет у выхода — в конце истории забирает Крима с собой по его просьбе со словом «пожалуйста». Возражение против её причисления к взрослым высказал Слава: «Взрослые 16 лет человек уже взрослый?» (232691). Прямого ответа на это не последовало.</li>\n</ul>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S05", "PS-0159-S05", "PS-0159--kak-menyalsya"], "h": "<p><strong>2024-09-17 (id 230867–230874, окно w0057). Первое появление.</strong> История прислана целиком (230873): имя, детский голос от первого лица, мама, супермаркет Колосс, батончик «Андромеда», реклама этого батончика утром по телевизору. Помечено, что персонаж будет раскрыт позже — «потом раскрою» (230874).</p>\n<p><strong>2024-09-18 (id 232678–232700, окно w0058). Уточнение природы.</strong> Обсуждается не текст, а устройство героя. Слава предполагает: «Типо его позитили» (232680). Миколай: «ну можно пока так считать» (232681) — то есть версия принята как временная, не как окончательная.</p>\n<p>На прямой вопрос Славы, действительно ли слово там волшебное (232686), Миколай отвечает, что нет: слово не волшебное, взрослые подыграли, «а он поверил» (232687–232688). Затем: «вера порадила монстра» (232690). На вопрос «Какого монстра от слова пожалуйста» (232693) ответа нет — «увидишь» (232695).</p>\n<p>Одновременно Миколай дважды понижает значимость самого героя и слова в общем замысле: «и то только сейчас» (232684) и «но опять-таки это не главный элемент всего сюжета» (232692).</p>\n<p>Оценка истории Славой по просьбе Миколая (232696–232699): «Ну норм без экшена но разговоры стали лучше», «Приемлимо».</p>", "r": []}, {"t": "Что с ним стало", "a": ["S06", "PS-0159-S06", "PS-0159--chto-s-nim-stalo"], "h": "<p>История заканчивается тем, что Крим просит девушку 16 лет: «забери меня с собой, пожалуйста» — «и она меня забрала с собой». Что было дальше, в переписке не сказано. Обещанное раскрытие персонажа («потом раскрою», 230874) и обещанный монстр («увидишь», 232695) в этих окнах не состоялись.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0159-S07", "PS-0159--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Возраст не назван, внешность не описана вообще. В навигации он обозначен как ребёнок и маленький мальчик, но в тексте истории признаков возраста нет, кроме поведения и того, что его берут на руки.</li>\n<li>Вселенная в w0057 и w0058 не объявлена.</li>\n<li>Связь с Монстро не оговорена — упомянут только как отсутствующий в этой истории.</li>\n<li>Не сказано, какой монстр рождён верой Крима и относится ли он к самому Криму или к слову.</li>\n<li>Не сказано, откуда Крим знает «Трипл Хук» и что за система, где эта фраза ломает позвоночник.</li>\n<li>Версия «его позитили» принята Миколаем условно («можно пока так считать») и осталась нерешённой.</li>\n<li>Не сказано, откуда взялся вопрос о статусе 16-летней как взрослой — он задан и оставлен без ответа.</li>\n<li>Имени в w0058 не звучит; оно взято из текста истории в w0057.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["PS-0159--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-09-17</td>\n<td>230867–230874</td>\n<td>w0057</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-09-18</td>\n<td>232678–232700</td>\n<td>w0058</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0159-krim.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0159--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0159.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
