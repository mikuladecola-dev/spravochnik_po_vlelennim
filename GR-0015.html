<script>const BASE="";const DOCNAME="Отряд сильнейших";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0015-S01", "GR-0015--chto-eto"], "h": "<p>Отряд, который Слава набирает из своих сильнейших персонажей. Объявлен тремя подряд идущими сообщениями утром (2024-05-07, id 166480–166482):</p>\n<div class=\"q\"><p>[166480] Слава: Отряд сильнейших<br>[166481] Слава: Провидец; бессмертный<br>[166482] Слава: И за пихая туда кого-нибудь</p></div>\n<p>То есть в одном сообщении названо само образование, во втором — двое, кто в него входит, в третьем — заявлено, что состав открыт и туда ещё будет кто-то «запихан». Ни задача отряда, ни его место в мире, ни то, на кого он работает, в переписке не сказано — названо только имя и двое бойцов.</p>\n<p>Оговорка о вселенной: реплика об отряде относится к отрезку вселенной «игра бога» (2024-05-07). В списке вселенной «Апостол» отряд как отдельная запись не значится — во вселенную «Апостол» перешли только два его бойца по отдельности.</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0015-S02", "GR-0015--sostav"], "h": "<ul>\n<li>Провидец <em>(статьи ещё нет — <a href=\"kb/ID-0050-providec.html\">исходник</a>)</em> — Провидец</li>\n<li><a href=\"IS-0013.html\">Бессмертный</a> — Бессмертный</li>\n</ul>\n<p>Оба названы в одном сообщении (166481) через точку с запятой, в порядке «Провидец; бессмертный». Третий и последующие участники не названы: заявлено только намерение «за пихая туда кого-нибудь» (166482).</p>\n<p>Отклонённый или неподтверждённый кандидат. Через пять минут после объявления Миколай предлагает персонажа (2024-05-07, id 166501–166505): «Несоразмерный», «Крч пиздец большой», «Или меняющий размер по желанию» — то есть либо просто огромный, либо меняющий размер по желанию. Взят он в отряд или нет — в переписке не сказано, ответа Славы на это предложение в окне нет. В тот же день Слава отклоняет какой-то вариант Миколая: «Не оставляю ( не знаю почему, просто как то не подходит)» (166762) — но к чему именно относится отказ, из текста не следует.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Дыра ровно одна, и она видна прямо в составе: нет статьи о Провидце. <code>ID-0050</code> — статьи нет, а в базе 14 549 знаков материала, и на него уже ссылаются. Из двух бойцов отряда один описан статьёй <code>IS-0013</code> (24 133 знака), а второй существует только как исходник — то есть половина группы состоит из ссылки в никуда.</p></div>", "r": [["Провидец", "kb/ID-0050-providec.html"], ["Бессмертный", "IS-0013.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0015-S03", "GR-0015--obschie-sposobnosti-gruppy"], "h": "<p>Общей способности, механики или источника силы, единого для всех участников, в переписке не названо. Единственный общий признак — принцип отбора, заявленный в самом названии: это «сильнейшие» персонажи Славы.</p>\n<p>Оба бойца в развёрнутом описании (166507) расписаны через бой и через дистанции: Провидец — «безумец, ни разу не проигравший в рукопашном бою или в стрельбе»; Бессмертный — «на любой дистанции хорош». Обобщения этого в единое свойство отряда авторы не делали.</p>", "r": []}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0015-S04", "GR-0015--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p>Развёрнуто оба описаны в одном сообщении Славы через двадцать шесть минут после объявления отряда (2024-05-07, id 166507), с пометкой «Для понятности».</p>\n<p>Провидец. Способность отматывать время, но с платой: «отматывая время превращается в петлю времени где он обязан 10 000 прожить один и тот же промежуток времени». Итог этого — «безумец, ни разу не проигравший в рукопашном бою или в стрельбе». То есть его сила и его безумие происходят из одного и того же: из многократно прожитого одного отрезка.</p>\n<p>Бессмертный. Бессмертие с условием на убийство: «которого может убить лишь сверхчеловек с идеальном контролям». Работа с телом описана шире, чем регенерация: «он способен не просто регенерировать повреждённый части, а изменять структуру своего тела или стрелять костями или с помощью плоти создавать разных существ». Разложено по дистанциям: «на дальнее и средней он может стрелять костями, создавать костенной сад, или чудовище, а на ближней дистанции неплохо сражаться и использует свой бессмертие на все сто».</p>\n<p>Соотношение сил между двоими не установлено: кто из них сильнее, в переписке не сказано.</p>", "r": []}, {"t": "Иерархия", "a": ["S05", "GR-0015-S05", "GR-0015--ierarhiya"], "h": "<p>Не названа. Командира, старшего, порядка подчинения в переписке нет. Порядок перечисления в 166481 — «Провидец; бессмертный» — как ранг нигде не оговаривается. Кто собирает отряд внутри вымышленного мира и по чьему приказу — тоже не сказано; на уровне авторов набор ведёт Слава.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S06", "GR-0015-S06", "GR-0015--otnosheniya-s-drugimi-gruppami"], "h": "<p>Отряд как целое ни с какой другой группой в переписке не соотнесён. Ниже — связи, которые есть у его участников по отдельности; отряд в них не упоминается.</p>\n<p>Сторонние силы (2025-01-28, id 285522). В списке вселенной «Апостол» Провидец стоит в разделе «Сторонний силы» — вместе с Породителем и Серафимом. Бессмертный в том же списке стоит в другом разделе, среди Благословенных, под именем «Бессмертный выродок». То есть к этой дате двое бойцов отряда числятся в разных разделах каталога, а самого отряда в списке нет. Миколай отдельно переспрашивает про Провидца (285539–285540) — ответа по сути в окне нет.</p>\n<p>Апостолы. Бессмертный проходит как Апостол: в описании Куры (Арбетара) сказано, что тот «в нынешней время является агентом и приближенным Апостола (Бессмертного)» (2025-05-31, id 331639).</p>\n<p>Отряд Старика, Рыжего, Доктора и Капитана. В истории «Бессмертный» есть другой отряд — русские солдаты, которые опасаются «монстра»; Слава уточняет: «Монстр это Бессмертный» (2025-03-10, id 300793). С отрядом сильнейших этот отряд в переписке никак не связан.</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S07", "GR-0015-S07", "GR-0015--kak-menyalas"], "h": "<p>2024-05-06/07, ночь и утро (id 166473, 166480–166482). Накануне в 23:32 Слава пишет «Сделал», после паузы почти в восемь часов утром объявляет отряд, называет двоих и оставляет состав открытым.</p>\n<p>2024-05-07, 07:33 (id 166501–166505). Миколай предлагает кандидата — «Несоразмерный», «пиздец большой» или «меняющий размер по желанию». Судьба предложения в окне не решена.</p>\n<p>2024-05-07, 07:54 (id 166507). Слава разворачивает обоих бойцов одним сообщением: механика петли у Провидца с числом 10 000 циклов, условие убийства и работа с плотью и костями у Бессмертного.</p>\n<p>2024-05-07, 15:41–15:45 (id 166753–166762). Миколай приносит фандомную классификацию условий бессмертия (ссылка на вики anime-characters-fight) и спрашивает: «Так какое условие бессмертности?» Слава отвечает одним знаком: «4». Что именно значит тип «4», в чате не расшифровано — только ссылка на внешнюю вики. В том же обмене Слава отклоняет вариант Миколая: «Не оставляю ( не знаю почему, просто как то не подходит)».</p>\n<p>2024-05-09, 18:31–18:32 (id 167343–167344). Миколай приносит машинный разбор способности Провидца — через «лиомат» и «сверхгенкод»: отматывание создаёт отдельную временную ветвь, которая потом «сшивается» с основной линией, а носитель заперт в ней на 10 000 циклов и оттачивает навыки. Текст машинный (обращение к автору на «вы»), собственная авторская формулировка в этом окне не звучит. Реакция Миколая: «Нейронка дала жизнь концепции». Отряд в этом обсуждении не упоминается — разбирается только один боец.</p>\n<p>2025-01-28 (id 285519–285545). В сводном списке вселенной «Апостол» отряда нет; двое его бойцов разнесены по разным разделам — Провидец в «Сторонних силах», Бессмертный (как «Бессмертный выродок») среди Благословенных.</p>\n<p>После 2024-05-09 отряд в переписке не упоминается. Дальнейшая разработка участников идёт по отдельности и без отсылок к нему: у Бессмертного — история деревни Лихой, Вторая мировая, спор о каноне (2025-03-10 — 2025-03-14, id 300757–302886), связь с Курой и вопрос о втором благословении (2025-05-31, id 331639–331662), опровержение деталей про дочь и репродуктивные органы (2024-07-25 и повторно 2026-02-06, id 211283–211426 и 429369–429375); у Провидца — только упоминание в списке 2025-01-28.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "GR-0015-S08", "GR-0015--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава сверх двух бойцов нет: третьего участника так и не назвали, «И за пихая туда кого-нибудь» осталось нереализованным.</li>\n<li>Кандидат Миколая («Несоразмерный» / «меняющий размер по желанию») повис: принят он или отклонён — в переписке не сказано.</li>\n<li>Иерархии нет: командир, старшинство, подчинение не названы.</li>\n<li>Цель и задача отряда не названы: зачем он собран, против кого действует, в каком сюжете участвует — не сказано.</li>\n<li>Место в мире не названо: к какой стороне (Благословенные, Враг, Церковь, Сторонние силы) отряд относится, не сказано; в каталоге вселенной «Апостол» отдельной записи об отряде нет.</li>\n<li>Вселенная отряда прямо не названа: реплика лежит на отрезке «игра бога», в список «Апостола» отряд не входит.</li>\n<li>Тип бессмертия «4» не расшифрован — в чате только ссылка на внешнюю вики.</li>\n<li>Соотношение сил внутри отряда не установлено.</li>\n<li>Собственной авторской формулировки петли времени (механизм ветви и сшивки) в переписке нет — она есть только в машинном разборе, значит, задумка звучала где-то раньше или голосом.</li>\n</ul></div>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Дороже её только то, что лежит рядом и вообще не подключено. <code>PS-0063</code> «Отряд сильнейших» — запись о том же самом отряде как о персонаже, вселенная «игра бога», статьи нет, ноль ссылок, в базе 29 087 знаков. Это вдвое больше, чем вся нынешняя статья группы (13 875). Пробелы «цель отряда», «место в мире», «третий участник» могут оказаться не пробелами, а нераспознанным материалом в соседней записи.</p></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0015--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает истории:</strong> <a href=\"IS-0013.html\">Бессмертный</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0088.html\">Сильнейший отряд (отряд Командира)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0012.html\">Цветной мир</a>, <a href=\"VS-0014.html\">игра бога</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0015--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0015.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0015-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0015/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дыра ровно одна, и она видна прямо в составе: нет статьи о Провидце. <code>ID-0050</code> — статьи нет, а в базе 14 549 знаков материала, и на него уже ссылаются. Из двух бойцов отряда один описан статьёй <code>IS-0013</code> (24 133 знака), а второй существует только как исходник — то есть половина группы состоит из ссылки в никуда.</p>\n<p>Дороже её только то, что лежит рядом и вообще не подключено. <code>PS-0063</code> «Отряд сильнейших» — запись о том же самом отряде как о персонаже, вселенная «игра бога», статьи нет, ноль ссылок, в базе 29 087 знаков. Это вдвое больше, чем вся нынешняя статья группы (13 875). Пробелы «цель отряда», «место в мире», «третий участник» могут оказаться не пробелами, а нераспознанным материалом в соседней записи.</p>\n<p>Третье — <code>ID-0051</code> «Несоразмерный»: статьи нет, 4 525 знаков базы, вселенная «игра бога». Это тот самый кандидат Миколая, про которого в статье сказано, что его судьба не решена. Материал под ним есть.</p>\n<h3>С чего начать</h3>\n<p>В базе, целиком. Три записи, все без статей: <code>PS-0063</code> (29 087), <code>ID-0050</code> (14 549), <code>ID-0051</code> (4 525). Начинать с <code>PS-0063</code> — если это тот же отряд, а не однофамилец, статья вырастает втрое и вопрос о вселенной («игра бога» или «Апостол») закрывается сам: у всех трёх записей проставлена «игра бога», у группы — «Апостол».</p>\n<p>Отдельно посмотреть, не разъехался ли Бессмертный: <code>IS-0013</code> (история, три ссылки), <code>PS-0184</code> «Бессмертный выродок» (четыре ссылки, 10 676 базы), <code>PS-0211</code> «Мальчик из братской могилы» (три ссылки, 58 295 базы). Который из них боец отряда — из статьи не следует, а в каталоге 2025-01-28 он числится как «Бессмертный выродок».</p>\n<p>В архив — только за одним: тип бессмертия «4». Ориентир узкий, 2024-05-07, 15:41–15:45, id 166753–166762, вокруг ссылки на вики. Ответ там дан одним знаком, и если расшифровка вообще где-то есть, она в соседних сообщениях того же вечера.</p>\n<h3>Как развивалось</h3>\n<p>Всё уложилось в двое суток. 2024-05-07 утром — заявили тремя сообщениями подряд: название, двое, «и запихая туда кого-нибудь». Через пять минут пришёл кандидат от Миколая — ответа нет. Через двадцать шесть минут — развернули обоих бойцов одним сообщением, с механикой и числами. К вечеру того же дня спор ушёл в классификацию бессмертия по внешней вики. 2024-05-09 — машинный разбор одного бойца, отряд в обсуждении уже не упоминается. Дальше не возвращались: 2025-01-28 в каталоге вселенной бойцы разнесены по разным разделам, а отряда в списке нет. Разработка продолжилась, но по участникам поодиночке.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>У Провидца сила названа вместе с платой, и плата встроена в саму механику: отматывание времени запирает в петле на 10 000 циклов, отсюда и мастерство, и безумие. У Бессмертного названо условие убийства («лишь сверхчеловек с идеальном контролям») и очень широкий набор — смена структуры тела, стрельба костями, костяной сад, создание существ из плоти. Платы нет никакой. Оба отобраны по одному признаку и описаны в одном сообщении; для первого правило «у силы есть цена» проговорено, для второго того же рода — нет.</p>\n<h3>Отклик</h3>\n<p>Отряда тут, честно говоря, нет — есть название и двое, и трогает не он. Зацепил Провидец: сила и безумие у него не связаны причиной, а являются одним и тем же. Десять тысяч раз прожить один и тот же отрезок — и «ни разу не проигравший в рукопашном бою или в стрельбе» читается уже не как достижение, а как описание того, что с человеком стало. Одна строчка делает и боевую механику, и характер, и цену, причём цена не приписана сбоку, а вытекает из способа. Обидно, что дальше эту фигуру не трогали: единственный подробный разбор петли — машинный, чужой, и в статье это прямо помечено. То есть самое живое место группы существует в пересказе, а не в собственных словах.</p></div>", "r": []}];</script>
