<script>const BASE="";const DOCNAME="Три факта Максима";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0202-S01", "SP-0202--mehanika"], "h": "<p>Способность заявлена одним куском в тексте от первого лица, который Слава выложил как запись блога Максима (2025-03-18, id 305113). Максим представляется словами «Я Максим. Лучший среди людей», и говорит, что это «не пустый слова», потому что у него есть «некоторые факты, которые доказывають мои слова. Всего их три».</p>\n<p>Первый факт — другое восприятие времени: «у меня другое восприятия времени. Для меня все разы медленнее чем вам». Этот факт назван исходным, из него, по словам Максима, «идёт два других».</p>\n<p>Второй факт — чувства: «у меня обострённые все пять чувств. Нет. Точнее будет сказать. Они у меня идеальный». Уточнение того, что это значит: «Я могу слышать за километры, и видить детально и лучше чем вы».</p>\n<p>Третий факт — мышцы: «я контролирую все мышцы в своём теле». Причина прямо названа: «Из-за того, что у меня восприятие времени замедлено». Как это выглядит в быту: «При хотьбе я контролирую куда наступать, как дышать. Я чувствую какие мышцы напрягаются». Глубина контроля и ощущения доведена до внутренних процессов: «Да я чуствовал как переносится моя же кровь в венах и артериях. Я чуствовал как бьётся моей сердце».</p>\n<p>Отдельно отмечено, как замедленное время воспринимается изнутри: «для меня лишь моргания эта тьма, на достаточно не малый промежуток времени». К этому состоянию Максим привык — «Я живу так и я к этому привык».</p>\n<p><strong>Как это работает в разных занятиях.</strong> В том же сообщении перечислено, что три факта дают на практике. Максим пробовал себя «почти что во всех видов спорта в учебе, в музыки», и «всё давалось мне относительно легкой».</p>\n<ul>\n<li>Учёба: «Просто слушай и запоминай». Контроль тела распространяется даже на позу — «для меня, который контролирует дажа то как он сидит. Не было напряга учиться хорошо».</li>\n<li>Спорт: «я чуствовал какие мышцы напрягаются в том или ином упражнении». Отсюда идеальное исполнение упражнений и понимание, «какие тренировки бесполезный, а какие хорошие». Контроль дыхания и выносливости даёт первенство на длинных дистанциях, а способность «сразу выдать максимум» — на коротких.</li>\n<li>Музыка: с идеальным слухом «я был как рыба в воде». Заучивание нот описано как единственная скучная часть.</li>\n</ul>\n<p>К 19 годам итог перечислен так: «преспективном спортсменом с красным дипломом и также преспективным музыкантом и актёром».</p>\n<p><strong>Работа способности в сцене со стрелой.</strong> В той же записи способность показана в действии. Максим идёт по тёмному району на окраине города, голова опущена, и он слышит «Натягивание тетивы» — звук, знакомый ему, потому что «У меня друг профессиональный лучник». Пока он поднимает голову, он уже определяет: стреляли из заброшенного двухэтажного дома; стрелявшая — девушка, «Хотя это не точно», «по слуху это девушка молодая лет до 20. Лёгкая, быстрая и ловкая». Всё это определено на слух за время подъёма головы.</p>\n<p>Стрелу он сначала не видит: она «полностью темной», и «разглядеть его в темноте, даже с моим идеальном зрением было сложно». Разглядев, он отмечает две вещи: лучница профессионал, потому что «стрела летела ровно в голову», и что стрела странная — «Она не только чёрная но и наконечник с деревяшкой словно единой». Уклонение описано как поворот головы вбок, выполненный одновременно с этими наблюдениями: «стрела пролетела мимо. Даже не задев щеку».</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0202-S02", "SP-0202--ogranicheniya-i-cena"], "h": "<p><strong>Только то, на что нужен навык и время.</strong> Ограничение сформулировал Миколай (2025-03-18, id 305260–305261): «ну тут не все к персу относится я считаю ибо он контролирует то на что может понадобиться навык и время», и как пример того, что под способность не подпадает: «регенерация например вряд ли про него».</p>\n<p><strong>Обычный человек.</strong> На вопрос Миколая «он просто человек?» (id 305263) Слава ответил «Да» (id 305266).</p>\n<p><strong>Скука как следствие.</strong> В самой записи цена сформулирована не как физическое ограничение, а как состояние: «Но вот мне стала скучна». Развёрнуто: «Простите это проблема всех гениях. Скука. Я зная, что я безграничный. И такому безграничному мне, нужно было двигаться вперед и встречаться с препятствиями. Но нет их. Этих препятствий. И поэтому мне скучно». Из этого прямо выведено поведение: Максим ходит в неблагополучный район не гулять, а искать, «с тем кем мог подраться», и вторую неделю никого не находит — «Они все испугались».</p>\n<p><strong>Провал слуха в конкретный момент.</strong> Миколай указал (2025-03-18, id 305298), что летящая стрела «наверняка громко резала воздух и че бы тебе не услышать местоположение в воздухе», и отдельно отметил, что реакция в сцене была только зрительная: «смог увидеть», «на слух чет не было реакции», «на слух ток натяжение» (id 305303–305305). Объяснение Славы (id 305301): «Дальше сможет, просто был удивлён и растерялся». То есть провал отнесён не к границе способности, а к разовому состоянию персонажа.</p>\n<p><strong>Скорость реакции не безгранична.</strong> На вопрос Миколая, почему Максим не кидает стрелы обратно — «мб глаз бы выколол» (id 305310) — Слава ответил: «Не успевает» (id 305311).</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0202-S03", "SP-0202--nositeli"], "h": "<p>Максим. Других носителей в переписке не названо.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0202-S04", "SP-0202--kak-menyalas-po-versiyam"], "h": "<p>Вся разработка уместилась в один день, 2025-03-18 (окно w0082), и представляет собой не переделку способности, а её последовательное уточнение вопросами Миколая.</p>\n<p><strong>2025-03-18, id 305113.</strong> Исходная формулировка: три факта (восприятие времени → идеальные пять чувств + полный контроль мышц), их следствия в спорте, учёбе и музыке, скука как итог, сцена со стрелой.</p>\n<p><strong>2025-03-18, id 305202–305218.</strong> Вопросы к механике. Миколай задал три (id 305207): «это постоянно? или когда он сосредоточен», «он хорошо различает звуки?», «по идее это должно сильно напрягать мозг, у этого персонажа сильный мозг?». Он оговорил, что ответы, возможно, будут дальше в тексте, но спрашивает всё равно, и что хочет «немного исследование провести» и продолжит читать (id 305208). Слава ответил, что «это дальше раскрывается» (id 305210), но сразу оговорил: «Но не все прям вопросы раскрываются» (id 305212). На просьбу Миколая «если есть мысли ответь на то что не раскрыл» (id 305217) Слава ответил «Подумаю нат ответом» (id 305218). Ответа в этом окне не последовало.</p>\n<p><strong>2025-03-18, id 305260–305266.</strong> Добавлено ограничение по объёму контроля (навык и время, регенерация не входит) и подтверждено, что Максим — просто человек.</p>\n<p><strong>2025-03-18, id 305298–305313.</strong> Уточнение работы слуха в конкретной сцене: неуслышанная стрела объяснена удивлением и растерянностью, «Дальше сможет». Также зафиксировано, что на бросок стрелы обратно он «Не успевает». Миколай при этом отметил, что его интересует не Максим, а лучница: «пока интересно че за лучница и человек ли она» (id 305302). Он также предположил, что она стреляет мимо специально — «я думал она специально так» (id 305312); подтверждения этому в окне нет.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0202-S05", "SP-0202--svyaz-s-drugimi-sposobnostyami"], "h": "<p>В переписке не названо. Три факта поданы как связка внутри самих себя: первый факт (восприятие времени) назван причиной двух других.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "SP-0202-S06", "SP-0202--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Осталось без ответа, работает ли способность постоянно или только при сосредоточении (вопрос id 305207).</li>\n<li>Осталось без ответа, насколько хорошо Максим различает звуки как отдельный параметр (вопрос id 305207).</li>\n<li>Осталось без ответа, нагружает ли это мозг и сильный ли у персонажа мозг (вопрос id 305207). Слава сказал «Подумаю нат ответом», ответ в окне не появился.</li>\n<li>Не сказано, есть ли верхний предел у замедления восприятия времени и управляется ли оно.</li>\n<li>Не сказано, откуда у Максима эти три факта — происхождение способности в переписке не обсуждалось.</li>\n<li>Кто такой Михаил, которого Максим упоминает в первых строках блога («чтобы возможно позлить Михаила»), в этом окне не раскрыто: на вопросы Миколая «кто такой Михаил!» и «новый перс?» (id 305203–305204) Слава ответил «Дальше», «В конце будет» (id 305205–305206).</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["SP-0202--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-03-18</td>\n<td>305113–305113</td>\n<td>w0082</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-18</td>\n<td>305202–305218</td>\n<td>w0082</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-18</td>\n<td>305260–305266</td>\n<td>w0082</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-18</td>\n<td>305298–305313</td>\n<td>w0082</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0202-tri-fakta-maksima.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0202--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0202.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["SP-0202-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/SP-0202/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — реестры вселенной. <code>SL-0053</code> «Список персонажей вселенной» и <code>SL-0051</code> «Каталог: благословенные, враги, грехи, оружие, артефакты»: статьи нет ни у одного, ссылаются по шесть записей на каждый. Здесь это дорого напрямую: главный факт статьи — ответ «Да» на вопрос «он просто человек?». «Просто человек» — это утверждение о разряде, а перечня разрядов в справочнике не существует. Следом <code>SL-0089</code> (четыре ссылки, 1.7 КБ базы, статьи нет) и <code>SL-0090</code> (четыре ссылки).</p>\n<p>Вторая — второй Михаил. <code>PS-0234</code> «Михаил»: статьи нет, 45.7 КБ базы, вселенные «Нимб» и «вне вселенной». Статья фиксирует, что Михаил из первых строк блога не раскрыт, при этом в справочнике два разных Михаила — <code>PS-0229</code> «Михаил „Медведь“ Саакашвили» (статья есть, 35.6 КБ базы, окна ровно этого дня) и <code>PS-0234</code> без статьи вовсе. Сведены они или это разные люди — не сказано нигде, а 45.7 КБ материала лежит неразобранным.</p>\n<h3>С чего начать</h3>\n<p>В базе, и почти всё. Расширять статью изнутри нечем — 13.8 КБ базы против 13.6 КБ статьи, сущность выбрана, — но разговор кончился не там, где кончается статья.</p>\n<p>Статья обрывается на id 305313, а окно w0082 идёт дальше, и продолжение уже разложено по соседям того же дня, 2025-03-18. <code>PS-0227</code> «Лучница» (23.5 КБ базы) держит 305314–305325 — это прямое продолжение реплики Миколая «пока интересно че за лучница и человек ли она». <code>PS-0048</code> «Максим» (70.2 КБ базы) держит 305279–305297 и 305422–305423 — единственное место, где стоит проверять три отложенных вопроса, потому что «Подумаю нат ответом» прозвучало в 305218, а ответа в этом окне нет. <code>PS-0229</code> «Михаил „Медведь“ Саакашвили» держит 305344–305351, и там же должно закрываться «В конце будет». Дословный текст блога целиком — <code>PR-0060</code> (31.2 КБ базы).</p>\n<p>В архив идти нужно за одним: связан ли <code>PS-0234</code> с этим Михаилом. Ориентир — окно w0084, 2025-03-21, id 306758–306765, где <code>PS-0229</code> уходит из вселенной «Апостол» во «вне вселенной»; и дальше по «Нимбу», куда <code>PS-0234</code> приписан. По одному дню 2025-03-18 этого не видно.</p>\n<h3>Как развивалось</h3>\n<p>Весь цикл уместился в 2025-03-18. Заявили одним куском — блог от первого лица, три факта, следствия, скука, сцена со стрелой (id 305113). Спросили три вопроса о механике (305207), получили отсрочку: «это дальше раскрывается», сразу с оговоркой «Но не все прям вопросы раскрываются», потом «Подумаю нат ответом» (305210–305218). Ограничили с краю (305260–305266): контроль распространяется только на то, «на что может понадобиться навык и время», регенерация не входит, носитель — просто человек. Затем залатали частный сбой (305298–305313): неуслышанная стрела отнесена не к границе способности, а к состоянию — «просто был удивлён и растерялся», «Дальше сможет». И ушли: в 305302 Миколай говорит, что ему интереснее лучница, и следующее окно уже её.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для восприятия правило названо, пусть и задним числом: чувство может не сработать из-за состояния носителя — стрелу он не услышал, потому что «был удивлён и растерялся». Для контроля мышц — того же рода правила нет. Третий факт выведен из первого прямым текстом («Из-за того, что у меня восприятие времени замедлено»), то есть они одной природы, но может ли растерянность так же сбить контроль тела, как она сбила слух, не проговорено ни разу.</p>\n<h3>Отклик</h3>\n<p>Три факта — не самое интересное, что тут есть. Интересна скука. Человек, у которого всё выходит с первого раза, вторую неделю ходит в плохой район искать, с кем подраться, и никого не находит: «Они все испугались». Способность описана через то, что она сломала, а не через то, что она даёт, — и это работает лучше, чем перечень из спорта, учёбы и музыки. Второе — как Миколай ловит текст на несходстве: идеальный слух заявлен, а в сцене сработало только зрение, и стрела «наверняка громко резала воздух и че бы тебе не услышать местоположение в воздухе». Ответ «был удивлён и растерялся» — заплатка, и её видно, но она честная: автор не стал переписывать сцену задним числом. И отдельно смешно, что после всего разбора идеального человека читателю оказалась интереснее девушка, которая один раз выстрелила из темноты и промахнулась.</p></div>", "r": []}];</script>
