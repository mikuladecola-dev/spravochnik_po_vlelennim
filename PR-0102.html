<script>const BASE="";const DOCNAME="Закат";
const LEAD="";
const CH=[{"t": "Об этом тексте", "a": ["S01", "PR-0102-S01", "PR-0102--ob-etom-tekste"], "h": "<ul>\n<li>Дата: 2025-11-21</li>\n<li>Сообщения: 387600–387601</li>\n<li>Состояние: брошено на середине (обрывается, когда герой с топором идёт к калитке)</li>\n<li>Действующие лица: рассказчик (я, безымянный), безликое существо без кожи («кусок мяса»)</li>\n</ul>", "r": []}, {"t": "Текст", "a": ["S02", "PR-0102-S02", "PR-0102--tekst"], "h": "<p>Закат<br>Какой же красивый закат в деревне. Когда небо не закрывает дым или многоэтажки. Ха называю красивым то, что давно перестали все называть красивым. Не знаю почему. Но в стихах и в книгах. Я давно перестал видеть строки о красивом закате. Закат все равно красивый. Словно горизонт горит, ярко-красным со смесью оранжевого огня.<br>И всю эту картину портит булькающие дыхание, этого куска мяса. Почему же он так дышит и почему он выглядит, как кусок мяса.<br>Да всё просто. Потому что этот жилистый мужчина, как понятно по его гениталиям. Не имеет кожи, носа и ушей. Вот поэтому это просто кусок мяса или жира, как ходите. И из его отверстие, который находится в том месте, где обычно находиться нос и рот. Вытекает, какая-то жидкость. То рывками, то медленно. Типо вдох и течёт меньше, а выдох и вся это жидкость, словно под давлением вылетает.<br>Схватив на кухни, что первая попалось. Чтобы наконец-то заткнуть это недоразумение.<br> Первая, что я схватил. Оказался кухонный нож. И это не джекпот. Если вдруг, кто не знал. Кухонный нож делают тонким. Поэтому если попытаться ударить человека. То он просто прогнëтся. &quot; Ну и пофиг&quot; Промелькнула у меня в голове.<br>А этот кусок мяса. Всё мнется у порога кухни. И вот он наконец собрал весь свой жировой дух. Бежит ко мне. Но его выпад. На столь вялый и медленный,  на что я медленно просто отхожу. И он врезается в кухонную мебель. Ну эти столики и гарнитуры, в которых хранится посуда.<br>Он разворачивается и ищет меня взглядом. А я вот, как тут. Хватаю его за руку и начал бить ножом в глаза. Молясь, чтобы хотя бы от этого он не сломался. Но он молодец держался и не ломался, как и этот кусок мяса. Я бил точно по глазам. Бил и бил. Пока в меня из этого месиво, в место глаз. Стрельнула струя жира? Ну это точно не кровь. Кровь красная. Иногда разных оттенков. Но красная. А то, что стрельнуло в меня было жёлтым и словно сопли липкими и тягучий.<br>И вот эта струя зарядили мне ровно в лицо. Больше часть попало именно рот. И я почувствовал кислый и с прикусом прокисшего молока вкус. Что застрял, словно прилип к моему языку и горлю. Я начал задыхаться. И еле сдержавшись, чтобы не блевануть. Я начал яростно бить его ножом.<br>Попутно приложившись на него всём своим весом. И я чувствовал, как руки тонут в это склизкой и фу, блять тёплой субстанций.<br>Повалив его. И так, лёжа на нём продолжил бить.<br>Перестал бить только, когда едва протирел  глаза и вижу нож прогнут. Отбросив это бесполезный кусок металла. Я попытался его задушить. Схватив руками его шею. И понял ещё один интересный факт. Невозможно задушить человека, вот так. Ведь он как бы не бездушная кукла. Он будет рыпаться, облеваться потом и вот так держа пальца на его шей. Ты его не задушишь. И это я понял, когда меня толчком откинули на кухонный гарнитур. Боль в спине от удара. Хоть и незначительная, но попробуй скажи это спине, которая начала уже изгибаться. Словно это поможет избавиться от боли.<br>Кусок мяса. Уже вскочил и почему-то начал оглядываться. &quot;Ты долбоеб. Тебе нечем оглядываться.&quot; Выругался я в голове. Хватая сковородку. И на бесшумно подхожу. К вертящиму туда сюда куску мяса. И замахнувшись. Ударяю прям в затылок. Он теряет равновесия падает.<br>На полу он начинает извиватьс  словно червяк. Из-за было сложней попасть по нему.<br>Но прижав его к полу ногой. Он перестал вертеться. Вот только кроссовки точно выкидывать.<br>Я прицелился по голове и замахнувшись, как можно сильнее. Ударил его сковородкой. Его голова словна лопнула. От моего удара. И оттуда во всё стороны брызнула кровь и розовый куски. Я убрал ногу с него и отошел.<br>Ведь он, ну наверное помер. Его пульс проверят фуу........ Не буду.  Хотя сам уже весь в его жире и крови. Но жира здесь всё равно больше. И до сих пор вкус жира во рту.<br>Я устало вздохнул. И именно сейчас на меня навалило усталость. И дыхания стало прерывистом.<br>Как не странно. Но мне захотелось встать у костра, вместе с кружкой тёплого и сладкого чая.<br>Я повертел головой. Ну эти мысли. Я подошёл к окну, у которого недавно стоял и наблюдал за красивым закатом. Солнце до сих пор медленно садилось. Но теперь горизонт был больше ало-красным.<br>Я окинул взглядом весь домик и остановившись на трупе. Подумал &quot;завтра будет жарка. Он же точно начнёт вонять и я вроде слышал, что трупы. От жары надуваются и лопаются&quot;<br>Я торопливо вышел из кухни. Не хватало мне еще, чтобы он взорвался.<br>Оказавшись на крыльце дома. Я нервно похлопал по карманным. Ищья сигареты.<br>- да блять- выругался я. Не найдя ничего в карманах.<br>Не конечно там был телефон, ключи, кошелёк и конфеты с мятой. Но здесь не было сигарет. И я вспомнил, что, как бы начал бросать курить.<br>Как же невовремя, я это начал. Промелькнуло в голове. Пока я пытался открыть фантик конфетки. Но руки дрожали, словно у пьяницы. И я забив на это. Просто кинул конфетку себе в рот.<br>Всё равно бумажный фантик. Перевариться, как нибудь.<br>Я начал оглядывать двор. Попутно пытаясь открыть фантик уже во рту.<br>Двор, как двор. Деревянная баня, трава, которая уже по колено. Огородик, на котором росли кусты и сорняки. И сиротливый топор, который лежал на траве, а вокруг него пару дровишек. Это я днём хотел баню затопить и начал рубить дрова. Но дрова особо не нарубишь, когда в твой затылок прожигает солнце. Да была жара, который днём почти достигала 40 градусов.<br>Как и говорил двор,  как двор. А вот за двором, за нерушимом забором была не просто деревня. Там был хаус, страх и ужас.<br>Было слышно множества криков, что переплетались в один. Этот крик был неутихаем. И вряд ли он утихнет. Пока всё живой, не погибнете в этой деревне.<br>Если честно. Эти месива без кожи, что бегали по всей деревне и даже трупы деревенских. Не были так страшны, как крики. Что резали словно нож. И резали они не тела, а что-то первобытное. Что-то, что осталось у каждого человека от предков.<br>Но вот у меня, он вызывал лишь раздражения. Ведь я хотел успокоить организм, а этот крик словно гром, бьёт точно по нервам.<br>Я торопливой походкой пошёл калитки. Но слегка остановившись у топора. Взял его, и вместе с ним уже пошёл к выходу из моего участка.<br>&lt;/content&gt;</p>", "r": []}, {"t": "Примечания и поправки", "a": ["PR-0102--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PR-0102.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
