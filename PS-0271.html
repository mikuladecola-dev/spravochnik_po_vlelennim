<script>const BASE="";const DOCNAME="Александр Титовский";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0271-S01", "PS-0271--proishozhdenie"], "h": "<p>Александр Титовский — главный герой и одновременно рассказчик истории «Вина» (2025-05-19, id 328111–328118, окно w0097). Весь материал по нему выложен Славой одним заходом 19 мая 2025 года: разгон биографии — 328111–328114, слом — 328116, разговор с начальником — 328118.</p>\n<p>Полное имя звучит в тексте один раз, в момент телефонного звонка из поликлиники: «Это Титовский Александер Иванович?». Начальник зовёт его Сашей, психолог — Александром.</p>\n<p>На момент начала событий ему двадцать лет. Он недавно переехал в новый город, до этого была, по его собственному определению, «бурная жизнь студента выскочки». Работает на заводе. На завод попал через связи отца, но узнаёт об этом только в самом конце (328118): начальник завода служил вместе с его отцом и после армии поддерживал с ним связь. От Александра это скрывали намеренно — «ты же у нас гордый. Человек, который хочет добиться всё сам. Человек думающий, что одних стараний будет достаточно. Вот поэтому не сказали. Твой отец хотел сохранить тебя тем. Радостным, энергичным и верующий, что всё сможет».</p>\n<p>Семья: отец, мать, младшая сестра. Сестра к моменту событий учится в седьмом классе и живёт в родительском доме — в деревне городского типа, в трёх часах езды на машине от города, где живёт Александр (при спешке он проезжает то же расстояние за два часа). Там же он родился и вырос. У него есть машина, подаренная отцом на восемнадцатилетие.</p>\n<p>Родители гибнут в автомобильной аварии; о смерти сообщает по телефону врач поликлиники номер шесть, «грубый мужской голос», прямо во время рабочей смены. Через несколько дней погибает сестра — вместе со всей деревней.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Самая дорогая дыра здесь — не «кто уничтожил деревню». У клоунов и левитирующего человека статья есть (<code>PS-0275</code>, 14.4 КБ статьи, 29.8 КБ базы), и внутри истории эта неясность заявлена автором намеренно. Дороже другое: <strong>у отца Александра нет сущности вообще</strong> — ни статьи, ни строки в <code>blockers.json</code>. При этом на нём держится финал <code>PS-0274</code> целиком (служба, устройство на завод, договорённость молчать), «Связи» и «Происхождение» этой статьи, и через него же — половина мотивировки <code>PS-0273</code>. Эпизодический шут получил запись (<code>PS-0276</code>), а человек, объясняющий, почему вся линия начальника вообще существует, — нет.</p></div>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0271-S02", "PS-0271--vneshnost"], "h": "<p>Прямых описаний внешности до катастрофы в переписке нет — только косвенные: «светлый, добрый паренёк. Полный энергий и жизни».</p>\n<p>Главная деталь внешности — два шрама, появившиеся после резни в деревне и психиатрической больницы: «Два шрама по щекам и глазам. Они напоминали слезы. Словно я недавно плакал». Их происхождение сам Александр не знает: «Не знаю откуда они появились. Возможно, тогда в деревне я сам их сделал или на что-то напоролся. Без разницы уже». В варианте с возвращением в прошлое (328117) шрамы оказываются единственным, что остаётся на лице — и это вызывает у него отдельный вопрос: «Почему они остались?».</p>\n<p>К моменту рассказа, после примерно четырёх месяцев запоя, у него седые волосы, морщины и уставшее лицо. Это выясняется от обратного: посмотрев на своё отражение в дверцах морговых ячеек после клинической смерти, он замечает, что «больше не было седых волос, морщин. И уставшего лица» — только шрамы.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0271-S03", "PS-0271--harakter"], "h": "<p>Исходное состояние (328111): «Двадцатилетний парень, любящий стабильность. Который мечтал только о спокойствие. В какой-то степени даже интроверт». Оговорка автора: интроверсия не столько черта, сколько обстоятельства — «ну как минимум в новом городе он не успел завести друзей. А со старыми, он как-то связь потерял». Сам он этим не тяготился, считая, что «в случае чего. С лёгкостью найдёт себе друга».</p>\n<p>Схема «работа, дом», которая для большинства людей тоска, для него была передышкой после студенческой жизни. Работу на заводе считал тяжёлой, но «мужской», гордился ею и говорил об этом коллегам. Трудоголик: погружался в механическое повторение операций, «словно он играл в любимую игрушку, а не работал», начальник ставил его в пример другим и делал лучшим работником месяца.</p>\n<p>Определение автора, замыкающее исходный портрет: «Человек, не успевший встретить настоящее невзгоды и страдания».</p>\n<p>После катастрофы главная и почти единственная черта — вина, вокруг которой строится вся история. Открывающий монолог: «Что может быть страшней вины?» Физическая боль с самокопанием не сравнится; потеря близкого — возможно, но и она несёт в себе вину: «Даже если ты не виноват. То всё равно отхватишь, это чувство вины. Словно ты мог, что-то сделать, чтобы предотвратить это. Но не сделал». Про себя он говорит: «Я тот кто разрушился. И так не собрался. Мне не хватило духа продолжить жить».</p>\n<p>Ключевое: он отказывается от вины избавляться, и это осознанная позиция. У психолога он кричит: «Я ВИНоват! . Я не ответил. Подумав что самый бедный», «именно Я Убил её. Я МОГ ЕЁ СПАСТИ. Если бы я тогда ответил. Если бы я поехал сразу домой. Если бы. Если бы.......И я не хочу отказываться от этого Чувство Вины. Ведь я виноват». А не вслух, про себя, формулирует причину: «И это вина словно для меня их оживляет. Не делай просто исчезнувшими. Словно делает их живыми для меня».</p>\n<p>Постоянная самооценка через уничижение: «Какой же жалкой ничтожества. Лишь думал, как плохо себе», «Жалкий эгоист, который не отвечал на звонки и не смотрел на сообщения».</p>\n<p>Отношение к собственной смерти: равнодушное и деловое. В больнице на слова начальника «а если ты умрёшь?» отвечает: «если я умру. Не кто не будет плакать». Лёжа на койке, формулирует единственную оставшуюся мысль как «Как бы убить себя?».</p>\n<p>Отдельно оговорена привычка не сопротивляться: «Да я никогда ничего не делал с ним. Просто принимало его и ждал» — про палача.</p>\n<p>Есть черта, которую он сам за собой отмечает как границу: наркотики он не пробовал. «Не знаю почему. Возможна эта граница, который я не хочу перешагивать» — при том, что таблетки по рецепту, по его словам, «бьют по разуму. Сильнее чем любая водка. Даже возможно лучше чем наркота».</p>\n<p>Способ существования после срыва — антидепрессанты и другие таблетки из аптечки горстями, запиваемые водкой. Эффект описан подробно: «Сумасшедший коктейль, который бьёт по мозгам. Который делает мысли тягучими, липкими. А также делает тебя более открытым. Потому что ты даже не можешь обдумать мысль, как уже что-то сделал». Забыться коктейль не помогает — наоборот, «он даёт чувством свободу». Последствия перечислены списком: разгромленная квартира, вещи, скинутые со второго этажа на асфальт, пробуждения в обезьяннике (соседи вызывали полицию), пробуждения в больнице — «потому-что решил скинуть не вещи, а себя», побои от соседа, к которому приставал. Смысл всего этого — несколько дней после всплеска эмоций: «Я несколько дней больше ничего не ощущаю. Не вины, не сожалений. И это хорошо».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0271-S04", "PS-0271--sposobnosti"], "h": "<p>Собственных сверхъестественных способностей у Александра в переписке не названо. С ним связаны две сущности — Палач и возвращение в прошлое после клинической смерти.</p>\n<p><strong>Палач.</strong> Определение дано в самом конце (328118), от лица Александра: «Палач это осколок моего сознания, которая стало самостоятельным. Его целью была всегда одно казнить и мстить. Тем кто виновен в смерти близких. А виновен был лишь я, когда-то. Но сейчас я не один виноват. А палач рад. Ему никогда не хватало лишь меня для казни».</p>\n<p>До того как он показывается, он присутствует звуком. Звук впервые слышен в морге, сразу после опознания родителей: «неприятный звук. Таскания чего-то тяжёлого и железного по бетону. Словно железный топор, которым мне отрубят голову. Но он был ещё далеко». Дальше звук работает как отсчёт: он приближается по мере ухудшения состояния Александра и предшествует каждой «казни».</p>\n<p>Облик описан в сцене безумия в деревне (328115): фигура высокого и плечистого человека, стоящая поодаль от плясок; одет во всё чёрное, кожаная одежда «была, как будто ему малой»; лицо «чудовищна. Словно слепленным безумцем» — кожи нет, только плоть и мышцы, нос отсутствует, из щёк выпирают острые наросты; лысый. В руках топор — «большое топор. В раза два больше чем обычный», полностью железный. Идёт медленно, «знал что не убегу». По дороге сносит головы монстрам и людям в масках, разрушая пляску. Формулировка Александра: «Он был моим палачом».</p>\n<p>Палач казнит Александра неоднократно: в деревне (328115), в момент передозировки (328116), в больнице после аварии (328117). Про больничный эпизод Александр заключает: «Так это сценка палача была, где он опять казнил меня. Опять эти новый сценки, что дают надежду, а после разрушает их. Ему нравится это. Он же палач».</p>\n<p>Финальное состояние: после разговора с начальником и решения мстить «палач, живший всё это время в Саше. Начал обретать свободу. И начал выбираться из сознания, который он казнил сотний раз. В настоящее мир».</p>\n<p><strong>Возвращение в прошлое после клинической смерти.</strong> После передозировки Александр очнулся на холодном полу морга. Состояние: голова не трещит, тело лёгкое, мысль чёткая — «Словно не было тех четырёх месяцев пьянок». Рядом два доктора и один полицейский, на кушетке — тела родителей, которых он в своём времени уже похоронил (хоронили другие родственники, пока он лежал в психбольнице, но у могил он был). Отражение в морговых ячейках — без седины и морщин. Вывод: «У меня была клиническая смерть. Поэтому я в морге», и следом — он вернулся в тот день, когда сестра ещё жива.</p>\n<p>Он выбегает из морга, заводит машину, звонит сестре — она не берёт трубку — и гонит по ночной дороге. В лесу он слышит тот же звук и видит фигуру с топором, отвлекается и не успевает затормозить на крутом повороте. Машину подбрасывает, бампер входит внутрь салона и придавливает ему ноги «до хруста костей».</p>\n<p>Очнувшись в больнице, он обнаруживает, что ноги целы, и заключает, что возвращения не было: «моё типо возвращение в прошлое. Лишь глюк. Это бред, мой бред. Придуманный моим рассудком. Что бы я перед смертью не чувствовал вину». И следом — «Назад не вернуться. Время нельзя перемотать и всё исправить. Это закон». Однозначно этот вопрос в переписке не закрыт: собственная трактовка Александра — глюк и очередная «сценка палача», но начальник в больнице говорит с ним как с человеком, которого он реально откачал из квартиры после передозировки, то есть события после морга в мире истории всё-таки произошли.</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0271-S05", "PS-0271--svyazi-s-drugimi"], "h": "<p><strong>Сестра Александра.</strong> Младшая, учится в седьмом классе. Единственная деталь детства, которую он вспоминает подробно: поездка семьёй в лес, костёр, невкусный суп, сваренный отцом, чай в вечерней мгле, звёзды — «когда звезды были, как будто так близко. Словно протянув руку я смогу их достать». Сестра тогда едва научилась ходить, родители часто оставляли её на старшего брата, и ему было интересно наблюдать её реакции: «Она на всё реагировала. Очень эмоционально и это было приятное. Словно я вместе с ней, что-то открываю новое». Он же забирал её из садика, готовил еду, когда родители уезжали.</p>\n<p>О гибели родителей он сообщает ей сам, приехав в родительский дом; она обнимает его, плачет, прижавшись к нему, и «ей нужно было в этот момент крепкой плечо. Но в тот момент моей плечо, таким не было».</p>\n<p>Ядро вины — не взятый звонок. Пока Александр тянул время в городе, чтобы не ехать на опознание, сестра звонила ему; он был раздражён тем, что она прервала тёплые воспоминания, и не ответил. Наутро — «более 30 пропущенных и почти что 100 сообщение», смысл каждого один: «Спаси братец».</p>\n<p>От сестры остаётся только цепочка, которую она не снимала и которую подарили ей на день рождения. Тела нет — «Кровь и плоть. Всё, что видел я. Там было ничего, что напоминала человека».</p>\n<p>Уже после срыва он читает её сообщения (328116) — они описывают происходившее в деревне: «в деревне всё кричат», «о человеке, что словно левитироваль. О клоунах, что скакали там и рвали всех людей. О груде тел, что лежали в одном мести. И этот груда достигал словно звезды». Кто это был и что произошло, в переписке не сказано; начальник в финале говорит только, что виновных не арестовали.</p>\n<p><strong>Начальник.</strong> Начальник Александра на заводе, единственный человек, который держит его в жизни. Служил вместе с отцом Александра, после армии поддерживал с ним связь, устроил сына друга на завод — и молчал об этом по просьбе отца.</p>\n<p>При известии о смерти родителей ведёт себя, по слову Александра, «по человеческий»: разгоняет мужиков из раздевалки, уводит его в кабинет, чтобы никто не видел слёз, наливает коньяк, не задаёт вопросов и ждёт, пока тот сам заговорит. Когда Александр вываливает всё, начальник «вдруг резко жал губы. Словно еле сдерживаясь, чтобы не заплакать», выпивает залпом четверть бутылки и говорит: «ты должен рассказать сестре». Оформляет оплачиваемый отпуск, силой ведёт к машине, везёт три часа до деревни и остаётся ночевать в машине у дома. После психбольницы не списывает Александра как работника, а делает оплачиваемый больничный; сам при этом «выглядел слегка уставшим. Словно только вчера напился».</p>\n<p>Он же спасает Александра при передозировке: приехал проведать, потому что тот давно не появлялся на работе, услышал через дверь хрип и падение бутылки, выбил дверь, вызвал скорую. Извиняется за дверь «ни разу не виноватом голосом».</p>\n<p>Разговор в больнице (328118) — поворотная точка истории. На вопрос Александра «зачем?» жить начальник долго колеблется, «словно знал ответ. Но боялся результато», и говорит: «я бы мог сейчас говорить. О том что ты можешь начать с начала. Завести семью. Но я понимаю, что психологии, тебя этим уже полностью облили. Поэтому скажу так. Отомсти тем кто убил твою сестру». Его внутренние рассуждения даны прямо: «Что лучше пусть мстит и на убивает. Не жили будет желать умереть», при этом «страх, что по его инициативе могут умереть люди и даже невиновный. Пугали. Но ведь это сын моего друга. Я не могу его бросить». В момент, когда он говорит, что виновных не арестовали, он «жимал кулаки. Прекрасно понимая, что сейчас возможно создаёт убийцу. Но и так же прекрасно понимал. Что не смог бы поступить по-другому». Последнее, что он добавляет: «но не забывай. Этим ты их не вернешь» — как попытка «поддержать его человеческую часть».</p>\n<p><strong>Родители.</strong> Отец подарил машину на восемнадцатилетие, чинил с сыном автомобиль («хотя, как мы. Я то просто подавал разный ключи. И боялся дать неправильный»), служил вместе с будущим начальником Александра и устроил его на завод, скрыв это. Мать отдельно не описана. То, чего Александр лишился с их смертью, перечислено списком: «Они больше не будут меня ругать. Не будут беспокоиться. Не спрашивать хорошо ли я питаюсь. Не корить меня, что я до сих пор не нашёл девушку. Не любить меня за то, что я просто есть».</p>\n<p><strong>Психолог.</strong> Обязательное ежемесячное посещение после выписки. Отношения зашли в тупик — «мы каждый раз оставались на этой мёртвой точки. Не было развития и прогресса». Психолог идёт на прямой, по оценке Александра грубый ход: «Александр вы наверное сами понимаете. Но мы уже несколько месяцев стоим на одной точке. Без прогресса..... Вздох. Я конечно соболезную. Но может хватит жить прошлым. Ваши близкие мертвы. Но с этим уже....» — и Александр бьёт по столу и срывается. О психологах вообще у него двойственное мнение: «психолог всё равно не помогает. Хотя всё равно есть плюс. Они мне рецепт выписывают».</p>\n<p><strong>Коллеги по заводу.</strong> Забеспокоились, когда «молодой трудоголик» исчез, нашли его в раздевалке сидящим без эмоций и глядящим в одну точку, били по щекам, кричали. В чувство его привёл начальник, плеснув ведро холодной воды — «Лучше бы не приходил. Лучше бы так и остался бы как овощ сидеть».</p>\n<p><strong>Палач.</strong> См. раздел «Способности». Отношения односторонние: Александр не сопротивляется, ждёт и принимает казнь; палач, по его словам, ждал только его — «Ему никогда не хватало лишь меня для казни».</p>", "r": []}, {"t": "Как менялся", "a": ["S06", "PS-0271-S06", "PS-0271--kak-menyalsya"], "h": "<p>Все четыре версии выложены в один день, 2025-05-19, и не переписывают друг друга, а идут подряд как части одного текста. Ниже — состояния героя по этим частям.</p>\n<p><strong>Версия 1 — 2025-05-19, id 328111–328112.</strong> Исходное состояние: двадцатилетний работяга, светлый интроверт-трудоголик, любящий стабильность, в новом городе, гордящийся «мужской работой» на заводе. Рамка рассказа задана сразу: рассказ ведётся из настоящего, из кресла, после водки с горстью антидепрессантов, «попутно погружаясь в воспоминания». В этой же части — звонок о гибели родителей, ступор в раздевалке, ведро воды, слёзы, коньяк в кабинете начальника и требование ехать к сестре.</p>\n<p><strong>Версия 2 — 2025-05-19, id 328113–328115.</strong> Сообщение сестре о смерти родителей; оттягивание опознания (нотариус, полиция, поездка за машиной); морг и первый звук топора; невзятый звонок сестры; тридцать пропущенных и сто сообщений «Спаси братец»; разрушенная деревня, наложение детских воспоминаний на кровь и погром, дверь дома, из-под которой течёт кровь, цепочка сестры, опарыши. Дальше — безумие, оговорённое автором как «не то что описали в фильмах, не то что написана в книгах. А реальная, субъективная»: круговорот прошлого, будущего и настоящего разом, монстры, люди с лицами козлов и мышей, краски, взрывающиеся салютом, существа, чьи лапы достигают солнца и которые «кидали солнце и луну в надежде всех поймать», шут, неумело жонглирующий огоньками надежды, — и посреди этого впервые появляется Палач. Итог части: два месяца в психиатрической больнице, прошедшие для Александра «как мгновение. Словно, Кто-то просто перемотал вперёд», выписка с диагнозом неуравновешенного, но не способного причинить вред окружающим и себе, обязательный психолог, появление шрамов-слёз и попытка утонуть в работе: «Я хотел утонуть в работе, чтобы не думать, не помнить». На этом этапе он ещё держится и не пьёт, понимая риск: «Ведь если я начну пить или хоть что-то принимать. То я же там погрязну и уже не вылезу».</p>\n<p><strong>Версия 3 — 2025-05-19, id 328116.</strong> Слом. Срыв на психолога, отказ отдавать вину, запой. Динамика падения расписана: «Сначала я просто раз в месяц устраивал пьянки. Считая этой наградой за хорошую работу на заводе. А после я начал награждать себя слишком часто. И всё меньше выходить на работы». Эта точка смыкается с рамкой рассказа — «Ну и вот с тех пор и началось та жизнь, который я живу по сей день». Дальше — чтение сообщений сестры про деревню, почти пустая аптечка, отказ тела, казнь Палача, и пробуждение на холодном полу морга: клиническая смерть, тела родителей на кушетке, лицо без седины и морщин.</p>\n<p><strong>Версия 4 — 2025-05-19, id 328117–328118.</strong> Попытка спасти сестру, авария на повороте, вывод о том, что возвращение было бредом, разговор с начальником в больнице, раскрытие связи отца с начальником, совет мстить — и выход Палача наружу.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0271-S07", "PS-0271--chto-s-nim-stalo"], "h": "<p>Последнее зафиксированное состояние (328118): Александр жив, лежит в больнице после аварии, ноги целы. Начальник назвал ему цель — месть тем, кто убил сестру, и добавил, что виновных не арестовали. Александр расширяет цель сам: «Александр уже думал о мести. Не только тем, кто убил сестры. Но и тем, кто виноват в аварии, в котором умерли его родители».</p>\n<p>Одновременно с этим Палач, до сих пор существовавший только внутри сознания, начинает выходить в реальный мир. Что происходит дальше — в переписке не сказано, история обрывается на этой точке.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0271-S08", "PS-0271--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Что именно случилось в деревне и кто её уничтожил — не названо. Есть только пересказ сообщений сестры: крики, «человек, что словно левитироваль», клоуны, которые «скакали там и рвали всех людей», груда тел до звёзд. Кто эти клоуны и левитирующий человек, связаны ли они друг с другом, — не сказано.</li>\n<li>Виновные в аварии, в которой погибли родители, не названы, и связь этой аварии с резнёй в деревне не установлена. Сам Александр «даже не интересовался, что стало с виновниками».</li>\n<li>Не решён вопрос, была ли клиническая смерть настоящим возвращением в прошлое. Александр объясняет её как бред и «сценку палача», однако события после пробуждения в морге в мире истории происходят. Прямого ответа в переписке нет.</li>\n<li>Происхождение шрамов не установлено — не только для читателя, но и для самого героя.</li>\n<li>Почему шрамы остались на «омоложенном» лице в морге — вопрос задан в тексте («Почему они остались?») и оставлен без ответа.</li>\n<li>Имя сестры не названо; имя, возраст и внешность начальника не названы; имена родителей не названы.</li>\n<li>Природа Палача описана только словами Александра («осколок моего сознания, которая стало самостоятельным»); как он существует после выхода «в настоящее мир», что при этом может и что происходит с самим Александром — не сказано.</li>\n<li>Фамилия и отчество даны один раз в форме «Титовский Александер Иванович»; в остальном тексте — Александр и Саша.</li>\n<li>Отклонённых вариантов и обсуждения замысла в переписке нет: весь материал — сплошной текст истории, выложенный Славой за один заход, без реплик соавтора.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["PS-0271--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-05-19</td>\n<td>328111–328112</td>\n<td>w0097</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-05-19</td>\n<td>328113–328115</td>\n<td>w0097</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-05-19</td>\n<td>328116–328116</td>\n<td>w0097</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-05-19</td>\n<td>328117–328118</td>\n<td>w0097</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0271-aleksandr-titovskiy.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0271--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0271.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0271-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0271/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Самая дорогая дыра здесь — не «кто уничтожил деревню». У клоунов и левитирующего человека статья есть (<code>PS-0275</code>, 14.4 КБ статьи, 29.8 КБ базы), и внутри истории эта неясность заявлена автором намеренно. Дороже другое: <strong>у отца Александра нет сущности вообще</strong> — ни статьи, ни строки в <code>blockers.json</code>. При этом на нём держится финал <code>PS-0274</code> целиком (служба, устройство на завод, договорённость молчать), «Связи» и «Происхождение» этой статьи, и через него же — половина мотивировки <code>PS-0273</code>. Эпизодический шут получил запись (<code>PS-0276</code>), а человек, объясняющий, почему вся линия начальника вообще существует, — нет.</p>\n<p>Вторая по цене — расхождение по Палачу. <code>PS-0171</code> — единственная сущность этого куста, на которую вообще ссылаются (4 ссылки, три вселенные, 39.4 КБ базы). Там определение «осколок моего сознания» отнесено к id 328132–328133 и помечено как отсутствующее в архиве — «единственное место статьи без дословной опоры». В этой статье та же цитата стоит с id 328118. Пока это не сведено, самый востребованный объект куста висит на спорной ссылке.</p>\n<p>Третье — весь куст изолирован: <code>ssylok_na_nego</code> = 0 у <code>PS-0271</code>, <code>PS-0272</code>, <code>PS-0273</code>, <code>PS-0274</code>, <code>PS-0275</code>, <code>PS-0276</code> и у <code>IS-0060</code>. Шесть статей, ни одной входящей ссылки; связи описаны текстом, но не проставлены.</p>\n<h3>С чего начать</h3>\n<p>В архив идти не надо — материал в базе, он просто разъехался. Отец собирается из четырёх мест: «Связи с другими» этой статьи, «Происхождение» и «Связи» в <code>PS-0274</code>, раздел «Персонажи» в <code>IS-0060</code> и полный текст <code>PR-0080</code> (328111–328118). Расхождение по Палачу закрывается там же: слова «Палач это осколок моего сознания» лежат в тексте <code>PR-0080</code> — значит, дословная опора есть, и пометку об отсутствии в <code>PS-0171</code> надо снимать, а не искать сообщения.</p>\n<p>В архив — только за одним: за тем, что было до выкладки. Окно w0095 (2025-05-16, id 326859–326868) — пролог, который Миколаю не скидывался; w0096 (2025-05-17, id 327121–327124) — «три раза изменил её концепцию», Миколай попросил рассказать что менялось, Слава ответил «Ок» и не рассказал. Если исходные версии героя где-то и названы, то в этих двух окнах.</p>\n<h3>Как развивалось</h3>\n<p>2025-05-15 — заявлено: «жди историю вины лишь на следующий недели», «Он у меня почти готов. Только финала нет». 05-17 — ограничено изнутри: шесть новых сценок, три смены концепции, осталась редактура. 05-18 — срок сдвинут, задача переформулирована: «Я как бы хочу сделать скачок. Маленький неумелый но скачек». 05-19 — весь герой выложен одним заходом, восемью сообщениями, без единой реплики соавтора. 05-26 — «ну я так и не дослушал». 05-27 — разбор. 06-06 — вопрос «вот ты думал вообще о чем пишешь и зачем?», ответа в кусках нет. Потом полгода тишины. 11-10 — упомянут как жанровый ориентир. 2026-02-08 — вернулись, но чужим голосом: разбор принесён из нейросети, и оттуда же в переписку возвращаются палач, звук железа и мысль про «делает их живыми».</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Про откат в морге правило названо по внешности: седина, морщины и усталость лица сняты, шрамы остались, и на шрамы вопрос задан прямо. Про память того же правила нет. Александр в откате помнит четыре месяца запоя, которых в той точке ещё не было, — то есть память переносится через откат так же, как шрамы, и это ровно тот же случай. Для лица спрошено, для памяти — не спрошено.</p>\n<h3>Отклик</h3>\n<p>Сильнее всего — что вина здесь не проблема, от которой герой лечится, а инструмент, который он держит сознательно. «И это вина словно для меня их оживляет. Не делай просто исчезнувшими» — сказано не вслух, психологу он кричит другое. Разведены крик и настоящая причина, и настоящая причина оставлена только читателю. Зацепило ещё, как устроен Палач до появления: сначала звук в морге, «но он был ещё далеко», и дальше он работает как счётчик — по громкости слышно, насколько плохо герою. Механика придумана раньше внешности и надёжнее внешности. А внешность, когда доходит до неё, — обычный человек в маленькой кожаной куртке, и это неожиданно точнее, чем всё безносое лицо с наростами.</p></div>", "r": []}];</script>
