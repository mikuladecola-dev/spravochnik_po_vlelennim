<script>const BASE="";const DOCNAME="Чужемирцы";
const LEAD="<p>Собирательная категория существ вселенной «Апостол» (<a href=\"PS-0198.html\">Чужемирцы</a>). В переписке встречается под написаниями «чужемирцы», «чужимирцы», «чудемирцы», в единственном числе — «чужемирец». Разрабатывалась с 2025-02-12 по 2025-05-30, восемь версий, окна w0075, w0080, w0082, w0099.</p>";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0198-S01", "PS-0198--proishozhdenie"], "h": "<p>Определение дано 2025-03-18 (id 305116), в монологе агента-рассказчика, объясняющего устройство мира: «И вот передем к самому важному чужемирцы. Это существо покинувший свой мир. По каким либо причинам. Чаще всего из-за того, что их ней миры суший ад. Или желанием захвата других миров.»</p>\n<p>Космология, внутри которой они существуют, изложена там же: «В начале всего было ничего. Потом появился первый мир \"Килька\". И да это наш мир. А потом начали появляться другие миры. И в каждом этом мире был свой бог. Его называют Правителем. И вот эти миры появляются и по сей день. И между всеми мирами есть некая связь. Но у всех это связь более крепкая с \"Килькой\" С первом миром.»</p>\n<p>Способы попадания в мир действия перечислены 2025-03-18 (id 305117), их три: «Первый- достигнуть границы своего мира. Часто этот способ используют в маленьких мирах, который только недавно образовались. Опять же относительно \"кильке\". Второй- спомощью ритуал, как с нашей стороны, как и с их ней. Ну здесь я сказать ничего не могу. Мне об этом ритуале не рассказали по понятном причинам. Ну и третий самый редкий. Когда правитель сам тебя отправляет в другой мир.»</p>\n<p>Отдельно зафиксирована односторонность перехода: «мы субъекты первого мира. Не модем его пикинуть. Ну вот никак. Ну вот чужемирцы попадають нам за раз плюнуть.»</p>\n<p>Первое появление чужемирцев в переписке — 2025-02-12 (id 288543–288545), задолго до того, как категория была названа и определена. Там рассказ ведётся от лица одного из них: он говорит о своей группе «нас», о «моём мире» и «не каждый из моего мира».</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0198-S02", "PS-0198--vneshnost"], "h": "<p>Единого облика нет: под категорию сведены существа разного вида.</p>\n<p><strong>Мелкие серые карлики</strong> (2025-02-12, id 288543). Влетают в окна дома. «В это же и соседней окно влетели ещё 3 подобных карлика, серый такие, ничего из себя не представляющей по отдельности.» Мелкие и быстрые: «Попасть в таких мелких, быстрых, скучающих крыс не так легко, тем более не умелыми руками.» Убиваются выстрелом в глаз, ударом головы об пол («Да-да это его черепушка треснулась»), избиением об пол. Рассказчик ставит себя над ними: «Даже в сравнение со мной это существо вообще нижая.»</p>\n<p><strong>Высокие твари</strong> (2025-02-12, id 288543). «Высокий, мускулистый, без одежды и волос, глаза у них были маленькие.» Ловкие и быстрые, с когтями: одна такая тварь «быстро схватив руку женщины заломили его, при этом проведя когтями по лицу женщины, лишев её зрения». Держат человека «крепко держала, как тиски».</p>\n<p><strong>Шестирукое чудовище</strong> (2025-02-12, id 288545). «Шесте рукой чудовище, который душила мужчину.» Защитник называет его в пересказе «паучок»; после того как ему порезали лапу и оторвали все конечности, «это паучок ничего не мог сделать».</p>\n<p><strong>Оборотень</strong> (2025-02-12, id 288545). «Тощий силуэт покрытой шерстью», ест в переулке — звук «как будто кто-то, что-то ест, при этом как животная». В тексте он же назван «недо обратная», «обратная», «оборотень».</p>\n<p><strong>Лучница и копьещики</strong> (2025-03-18, id 305116, 305316–305321). Копьещики бьют копьями, один из них назван «чернышом» («за спиной этого взорвоного черныша»). Лучница одета так, что Миколай отдельно на это указал: «у неё юбка и всё» и «откуда она стрелы берет» (id 305314–305315). Принадлежность обоих к чужемирцам подтверждена прямо: Миколай — «а, она чужемирец....», Слава — «Да» (id 305320–305321).</p>\n<p>Родство разных видов между собой в переписке не установлено. Рассказчик 2025-02-12 сам его не знает: «Если честно сам не могу сказать кем им приходится карлики. Может они родственники, а может просто подчинённый и слуга.»</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0198-S03", "PS-0198--harakter"], "h": "<p>Общая характеристика (2025-03-18, id 305116): «Ну грубо говоря почти всё чужемирцы жестокие психи. Для которых убийства это обыденная дело.»</p>\n<p>Через год с небольшим по внутренней хронологии переписки, 2025-05-29 (id 331072), в текст контракта АЗИП внесено прямое ограничение этой характеристики: «И не забывайте. Не всё чужемирцы опасны и хотят кому-то навредить.»</p>\n<p>Групповое поведение зафиксировано на карликах (2025-02-12, id 288543): они нападают семейством и мстят за убитого — «И сразу всё карлики попытались накинутся на убийцу своего брата ну или сестры.»</p>\n<p>Питание людьми для рассказчика — редкость и праздник: «Я ему уже благодарен тем, что мне даль вкуснейший пир перед смертью, не каждый из моего мира хотя бы раз в жизни так вкусно и сытно питался.»</p>\n<p>Рассказчик 2025-02-12 умеет читать воспоминания жертвы («я же вижу только воспоминания защитника») и оставляет Защитника в живых намеренно, хотя тот без сознания: «Ответ просто он переломал мне всё конечности и не только. Но если бы я даже мог бы, я бы ни за что этого не сделал ведь он должен жить узнать о чужемирцов, о благословенных, о артефактах он должен страдать и быть снова счастливым.»</p>\n<p>Его интересует не месть, а чувство вины Защитника: «А чувством вины за убийство не виновных чужемирцов. Хотя сейчас она маленькая, но она растет.» И сожаление у него о том же: «у меня есть сожаления, то что я не смогу увидеть дальше жизнь защитника не его страдания, не боли, не счастья и не смогу увидеть всё растущую вину».</p>\n<p>Перед смертью он говорит о подарке: «я уже подготовил для него подарок, нет не пакость, а настоящее подарок, он находится внутри меня и когда защитник будет рвать меня он получит этот подарок». Что это за подарок — в переписке не сказано.</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0198-S04", "PS-0198--sposobnosti"], "h": "<p>Ключевая механика названа 2025-03-18 (id 305316–305317), в ответ на вопрос Миколая, откуда лучница берёт стрелы:</p>\n<ul>\n<li>«В этом суть этих чудемирцов. Они могут создавать оружия из себя»</li>\n<li>«Но трансформировать тело не могут»</li>\n</ul>\n<p>Тут же Слава добавил: «Но здесь я виноват. Забыл добавить момент» — какой именно момент забыт и был ли он потом добавлен, в переписке не сказано.</p>\n<p>Существует внутреннее деление чужемирцев по способностям, но состав его не назван: «У них там ещё разделения по видам способностей. Ну это скука об этом говорить» (2025-03-18, id 305116).</p>\n<p>Из отдельных проявлений в тексте 2025-02-12 (id 288543–288545): чтение воспоминаний жертвы у рассказчика; когти, ловкость и хватка «как тиски» у высоких тварей; удушение шестируким чудовищем.</p>\n<p>Живучесть рассказчика — он говорит, продолжает вести рассказ и готовит «подарок» после того, как ему «переломал всё конечности и не только» Защитник.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Как развивалось — не материал авторов</b>\n<p>2025-02-12 — показали до называния: целый выводок тварей действует, слово «чужемирцы» в тексте звучит, что оно значит — не сказано. 2025-03-13 — вписали в чужие механики: материал ритуала арбетара и добыча Защитника, по-прежнему без определения. 2025-03-18 — определили (причина ухода, три способа перехода, Килька и Правители) и в тот же день ограничили физику: «Они могут создавать оружия из себя», «Но трансформировать тело не могут». Дальше два с лишним месяца тишины. 2025-05-28 — вернулись с другой стороны: чужемирец теперь не только цель, но и возможный агент АЗИП. 2025-05-29 — регламент, и в него вписано «Не всё чужемирцы опасны», рядом с мартовским «почти всё чужемирцы жестокие психи», без отмены. 2025-05-30 — вопрос про язык, ответа нет. 2025-05-31, уже за границей статьи, — способов перехода становится четыре.</p></div>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0198-S05", "PS-0198--svyazi-s-drugimi"], "h": "<p><strong>Защитник.</strong> Первый и самый развёрнутый противник. В версии 1 (2025-02-12, id 288543–288545) целая семья чужемирцев нападает на его дом: карлики влетают в окна, дочь выпотрошена карликом, жену высокая тварь ослепляет когтями, самого его держат и вырубают ударом по голове. Дальше — больница, полиция ему не поверила, психиатры, пять месяцев запоя, попытки самоубийства. Перелом наступает, когда он в переулке убивает оборотня бутылкой и «розочкой», притаскивает труп домой и наутро видит его: «И он всё понял. Всё сразу стала на свои места.» Два года тренировок, работа, оружие, «полномасштабную охоту на нас». Он отслеживает звонки полиции, ловит слово «монстр», калечит шестирукое чудовище и допрашивает его. Затем: «После всего этого он начал как то инстинктивно понимать, где находиться чужимирцы словно благословенный. Но он им не был.» В версии 3 (2025-03-13, id 301823) он назван со стороны: «защитник. Недавно появившаяся охотник за чужемирцами». В версии 4 (2025-03-18, id 305116) — «новым апостооом по прозвищу \"защитник\"».</p>\n<p><strong>Арбетары и ритуал становления.</strong> В версии 2 (2025-03-13, id 301806) чужемирцы перечислены среди материалов ритуала: «И один из этих материалов ты, и пару чужемирцов, и ещё один благословенный и самая сложная альфа.» По сложности добычи они стоят выше благословенного, но ниже альфы: «Сложнее было убить чужемирцов. Ну это так цветочки. Самым сложным, как я уже говорил был альфа.»</p>\n<p><strong>АЗИП и агенты.</strong> 2025-05-28 (id 330909) чужемирцы поставлены наравне с людьми по обе стороны организации: «Агент- это люди или чужемирцы, которых завербовали в организацию АЗИП. И их главная цель уничтожения опасных существ. Буть то люди или чужемирцы.»</p>\n<p><strong>Контракт агента.</strong> 2025-05-29 (id 331072) работа с чужемирцами оформлена как основная обязанность: «Вы будете обязаны встречать чужемирцов, который по какой-либо причины покинули свой мир. И либо зарегистрировать его, либо устранить если он проявит агрессию на вас.» Кандидатом в агенты может быть «будь то человек или чужемирец» (пункт 1). Для встречи у пространственной аномалии предписана заготовленная фраза: «Здравствуйте я представитель организаций АЗИП и мы не хотим вам навредить. Я знаю, что вы не понимаете, что происходит. Но попрошу последовать за мной, что бы вас зарегистрировали». Дальше: «Если на это чужемирец проявит агрессию. Постарайтесь его успокоить. Но если вашей жизни грозит опасность. То можете применить грубую силу.» Отдельно от чужемирцев в том же контракте идут «лиц, который имеют особенность и нарушающий закон» — благословение, артефакт — и «лица, который получают силу непосредственно самого себя Арбетар и фантазеры».</p>\n<p><strong>Килька.</strong> Первый мир, он же мир действия; связь всех миров с ним крепче, чем между собой.</p>\n<p><strong>Благословенные и апостолы.</strong> Стоят в тех же перечислениях, но к чужемирцам не отнесены. В версии 1 рассказчик перечисляет, о чём Защитнику ещё предстоит узнать: «о чужемирцов, о благословенных, о артефактах».</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0198-S06", "PS-0198--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2025-02-12 (окно w0075, id 288543–288545).</strong> Развёрнутое появление без названия категории: виды тварей, повадки, слабость карликов поодиночке, питание, существование группами. Всё подано изнутри — от лица одного из них, лежащего в лесу с переломанными конечностями рядом с телами своей группы. Термин «чужемирцы» в тексте уже звучит («о чужемирцов», «не виновных чужемирцов»), но что это такое, не объясняется. Устройство их мира не описано.</p>\n<p><strong>Версия 2 — 2025-03-13 (окно w0080, id 301806).</strong> Упоминание как материала ритуала становления Арбетаром, в монологе старика-арбетара: «и пару чужемирцов». Здесь чужемирцы впервые встроены в иерархию сложности добычи — между благословенным и альфой.</p>\n<p><strong>Версия 3 — 2025-03-13 (окно w0080, id 301823).</strong> Упоминание как добычи Защитника, со стороны арбетара, выбирающего себе цель для «тест-драйва» новой силы: «Каво бы? Аа точно, защитник. Недавно появившаяся охотник за чужемирцами.»</p>\n<p><strong>Версия 4 — 2025-03-18 (окно w0082, id 305116–305117).</strong> Даётся определение категории, причины ухода из своего мира, три способа перехода, космология с первым миром «Килька» и Правителями, односторонность перехода. Названо, что существует классификация по видам способностей. Перечислено, что ещё осталось необъяснённым: «альфа, апостолы, благословенный, силы зверя, классификация, арбетары, аномалия, существа и так далее». Запись подана как утечка: «Через 7 минут эта запись была удалена Михаилом. А его отправитель был наказан.»</p>\n<p><strong>Версия 5 — 2025-03-18 (окно w0082, id 305314–305321).</strong> Физика тела: «Они могут создавать оружия из себя», «Но трансформировать тело не могут». Лучница и копьещики из истории отнесены к чужемирцам.</p>\n<p><strong>Версия 6 — 2025-05-28 (окно w0099, id 330909).</strong> Чужемирцы названы как категория, из которой могут вербоваться агенты АЗИП, и одновременно как категория целей уничтожения — наравне с людьми в обоих случаях.</p>\n<p><strong>Версия 7 — 2025-05-29 (окно w0099, id 331072).</strong> Обращение с чужемирцами прописано регламентом: встреча, регистрация либо устранение при агрессии, обязательный отчёт «во избежание устранения невинных существ», заготовленная фраза при встрече у пространственной аномалии, требование сперва попытаться успокоить. Прямо сказано, что «не всё чужемирцы опасны и хотят кому-то навредить» — это смягчает формулировку версии 4 о «жестоких психах», но версия 4 не отменена: обе формулировки остаются в тексте.</p>\n<p><strong>Версия 8 — 2025-05-30 (окно w0099, id 331245).</strong> Миколай ставит вопрос к предписанной фразе: «а на каком языке это сказано? как чел из абсолютно другого мира поймёт речь одного из 300+ языков». Ответа в приведённой переписке нет; вопрос остался нерешённым.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0198-S07", "PS-0198--chto-s-nim-stalo"], "h": "<p>Категория остаётся действующей до последней зафиксированной даты (2025-05-30) — на ней держится работа АЗИП и контракт агента.</p>\n<p>Судьбы отдельных особей, названных в переписке:</p>\n<ul>\n<li>Четыре карлика в доме Защитника убиты (один — выстрелом жены в глаз, двое — самим Защитником, третьего застрелила жена); один карлик до этого успевает выпотрошить дочь.</li>\n<li>Оборотень в переулке убит бутылкой и «розочкой», труп притащен в дом и закопан в подвале.</li>\n<li>Шестирукое чудовище лишено всех конечностей, вывезено в дом Защитника и допрошено: «тот паучок знать-то ничего не знал, но защитник ломал его психологический и физический».</li>\n<li>Группа рассказчика перебита Защитником целиком: «И так однажды он наткнулся на нашу группу и порешал есть сам конечно получив тяжёлый ранения.» Сам рассказчик гибнет в конце монолога — «Эх ладно пок.... В лесу пронеся хруст ломающий черепушки».</li>\n<li>Копьещики и лучница из истории 2025-03-18 убиты появившимся апостолом: одному копьещику белая цепь снесла голову, второй взорвался изнутри, лучницу настигли при бегстве.</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0198-S08", "PS-0198--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Устройство мира (или миров), откуда приходят чужемирцы, не описано. В версии 1 название вселенной ещё не дано.</li>\n<li>Связь видов между собой не установлена: «Может они родственники, а может просто подчинённый и слуга» — рассказчик сам не знает.</li>\n<li>Классификация по видам способностей названа (2025-03-18, id 305116), но состав её не назван: «Ну это скука об этом говорить».</li>\n<li>Ритуал перехода из мира в мир не раскрыт: «Мне об этом ритуале не рассказали по понятном причинам».</li>\n<li>Что за «момент», который Слава признал забытым при объяснении механики создания оружия из себя (id 305318), в переписке не сказано.</li>\n<li>Что за «подарок» внутри рассказчика, который получит Защитник, разрывая его (id 288545), не сказано.</li>\n<li>Языковой вопрос остался нерешённым: на каком языке произносится предписанная контрактом фраза и как её поймёт существо из другого мира (2025-05-30, id 331245).</li>\n<li>Как соотносятся формулировки «почти всё чужемирцы жестокие психи» (версия 4) и «не всё чужемирцы опасны» (версия 7), в переписке не оговорено.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0198--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0019.html\">Чужемирцы</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0019.html\">Чужемирцы</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0198--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-02-12</td>\n<td>288543–288545</td>\n<td>w0075</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-13</td>\n<td>301806–301806</td>\n<td>w0080</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-13</td>\n<td>301823–301823</td>\n<td>w0080</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-18</td>\n<td>305116–305117</td>\n<td>w0082</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-18</td>\n<td>305314–305321</td>\n<td>w0082</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-05-28</td>\n<td>330909–330910</td>\n<td>w0099</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-05-29</td>\n<td>331072–331072</td>\n<td>w0099</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-05-30</td>\n<td>331245–331245</td>\n<td>w0099</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0198-chuzhemircy.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0198--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0198.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0198-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0198/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дороже всего не пробел внутри статьи, а то, что сама категория заведена четырьмя записями и три из четырёх уже выжаты: <code>PS-0198</code> (одна ссылка, статья 24 858 при базе 58 680 — запас ещё есть), <code>MR-0117</code> «Чужемирцы» (две ссылки, статья 4 529 при базе 1 818), <code>MR-0100</code> «Чужемирцы и аномальные люди» (две ссылки, 4 694 при 3 285), <code>GR-0019</code> — группа. Классификация по видам способностей, объявленная 2025-03-18 и закрытая репликой «ну это скука об этом говорить», не разобрана ни в одной из четырёх.</p>\n<p>Единственное место, где чужемирцы поставлены рядом с остальными силами, — <code>SL-0089</code> «Список категорий сил (Благословенный, Арбетары, Альфы, Чужемирцы, Владельцы артефактов, Фантазёры)»: четыре ссылки, статьи нет, 1 753 знака базы, одно окно w0094 (2025-05-10). На него опираются статьи об иерархии сил, а под ним материала меньше, чем в любой из четырёх карточек самой категории.</p>\n<p>Рядом — <code>ID-0126</code> «Нераскрытые термины: альфа, благословенный, силы зверя, классификация, арбетары, аномалия, существа»: статьи нет, 3 566, ноль ссылок. Это дословно тот список долгов, которым Максим заканчивает блог 2025-03-18; он заведён отдельной сущностью и не привязан ни к одной статье, включая эту.</p>\n<h3>С чего начать</h3>\n<p>В базе, и ближе, чем кажется. <code>MR-0140</code> «Способы покинуть свой мир» (одна ссылка, статья 15 932 при базе 23 534), окно w0099, id 331635–331636, 2025-05-31 — на следующий день после последней даты этой статьи. Там три способа перехода стали четырьмя: ритуал (помечен прямо в тексте «???»), прыжок за край маленького или среднего мира с объяснением, почему выносит именно в Кильку, пространственная аномалия и изгнание правителем. Там же переформулирована односторонность: «Любое существо может покинуть свой мир если будет знать способ. Но всё существа кильке не способны покинуть свой мир». И там же впервые в перечне стоит пространственная аномалия — та самая, у которой по контракту от 2025-05-29 агента ставят с заготовленной фразой. Версия 2 той же записи — 2025-10-18, id 375843–375852: весь свод миров и правителей переписан заново.</p>\n<p>За «забытым моментом» (id 305318) в базу идти незачем: <code>SP-0203</code> «Создание оружия из себя» — статья 3 872 при базе 2 067, и вся эта база есть ровно 305314–305318, то есть уже процитированный кусок. Здесь только архив: окно w0082, сразу после 305321.</p>\n<p>Устройство миров-источников, если оно вообще где-то проговорено, искать в <code>MR-0207</code> «Килька» (статья 32 324 при базе 68 896) и <code>MR-0120</code> «Правитель» (25 813 при 35 010) — вместе около сорока тысяч знаков, не попавших в статьи.</p>\n<h3>Как развивалось</h3>\n<p>2025-02-12 — показали до называния: целый выводок тварей действует, слово «чужемирцы» в тексте звучит, что оно значит — не сказано. 2025-03-13 — вписали в чужие механики: материал ритуала арбетара и добыча Защитника, по-прежнему без определения. 2025-03-18 — определили (причина ухода, три способа перехода, Килька и Правители) и в тот же день ограничили физику: «Они могут создавать оружия из себя», «Но трансформировать тело не могут». Дальше два с лишним месяца тишины. 2025-05-28 — вернулись с другой стороны: чужемирец теперь не только цель, но и возможный агент АЗИП. 2025-05-29 — регламент, и в него вписано «Не всё чужемирцы опасны», рядом с мартовским «почти всё чужемирцы жестокие психи», без отмены. 2025-05-30 — вопрос про язык, ответа нет. 2025-05-31, уже за границей статьи, — способов перехода становится четыре.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Правило выхода названо только с одной стороны. Для жителей первого мира оно жёсткое: «мы субъекты первого мира. Не модем его пикинуть. Ну вот никак», — а чужемирцам попасть сюда «за раз плюнуть». И все три (позже четыре) способа описаны как способы попасть. Может ли чужемирец, уже оказавшийся в Кильке, уйти обратно и действует ли на него, пока он здесь, тот же запрет, что и на местных, — не сказано. Для контракта это не отвлечённость: агенту предписано чужемирца «либо зарегистрировать, либо устранить», то есть оставить в мире насовсем или убить; третьего варианта в правилах нет, и что его нет — тоже не проговорено.</p>\n<h3>Отклик</h3>\n<p>Сильнее всего здесь видна чужая правка задним числом. В марте категория описана изнутри — «почти всё чужемирцы жестокие психи» говорит существо, которое ест людей и считает это праздником, и в его устах это даже не осуждение. В мае то же самое ложится на бумагу организации, и в служебный текст вписывается «И не забывайте. Не всё чужемирцы опасны и хотят кому-то навредить» — фраза ровно того сорта, какие появляются в инструкциях после того, как кого-то устранили зря. Две формулировки друг с другом не спорят, они просто из разных жанров, и обе остались лежать. И реплика Миколая 2025-05-30 — «а на каком языке это сказано? как чел из абсолютно другого мира поймёт речь одного из 300+ языков» — одной строкой обрушивает всю заготовленную вежливость контракта. Ответа нет, и это самое честное место в записи.</p></div>", "r": []}];</script>
