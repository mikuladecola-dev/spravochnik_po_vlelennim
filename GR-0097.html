<script>const BASE="";const DOCNAME="Ночные охотники (они же «тёмные охотники»)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0097-S01", "GR-0097--chto-eto"], "h": "<p>Ночные охотники — вид существ вселенной «Новый мир», описанный Славой одним сообщением 2024-06-03 (id 175797). Это не организация с именами и не отряд: в переписке они заданы как разновидность тварей тёмной энергии, у которой есть общее устройство и общий образ жизни, но нет ни названных участников, ни вожаков. По классификации разведки — «раса-сообщество: существа, сотканные из тёмной энергии, служащая прослойка при тёмных колдунах».</p>\n<p>Исходная формулировка Славы дословно: «Ночные охотники существо сотканный из темный энергий ( выглядят по разному ) питается людьми и страхами и болью».</p>\n<p>Три дня спустя, 2024-06-06 (id 176473), Слава называет их «тёмными охотниками» — в том же сообщении, где определяет роль главного героя. Отдельного объяснения, почему сменилось название, в переписке нет; в базе оба обозначения ведутся как варианты имени одной сущности (<a href=\"PS-0088.html\">Ночные охотники</a>).</p>\n<p>Появляются ночные охотники как ответ на вопрос, который Слава сам поставил чуть раньше, 2024-06-03 (id 175770): «Вот только какие именно твари темной энергий». То есть это первый конкретный вид, которым заполняется тёмная сторона мира после того, как объявлены три энергии и колдуны.</p>", "r": [["Ночные охотники", "PS-0088.html"]]}, {"t": "Общие способности группы", "a": ["S02", "GR-0097-S02", "GR-0097--obschie-sposobnosti-gruppy"], "h": "<p>Способности заданы через отрицание: сверхсил у ночных охотников нет. Слава пишет: «У них особо каких либо сверх сил сил не будет чисто физическая сила и уникальный строения тела».</p>\n<p>Что есть у всех:</p>\n<ul>\n<li><strong>Физическая сила.</strong> Единственная названная «сила» как таковая.</li>\n<li><strong>Уникальное строение тела.</strong> Перечислено с оговоркой «и т.п»: «типо крылья, многорукий, многоногий, большой рот». Список открытый, закрытым набором форм он не объявлен.</li>\n<li><strong>Питание людьми, страхами и болью.</strong> Три предмета питания названы в одном ряду: «питается людьми и страхами и болью». Разделения на основное и дополнительное питание нет.</li>\n<li><strong>Происхождение из тёмной энергии.</strong> «Существо сотканный из темный энергий» — не созданные из плоти, а сотканные.</li>\n</ul>\n<p>Кроме способностей у них названа общая уязвимость — свет. Важна точная формулировка Славы: свет «их не убивает а лишь причиняет невыносимую боль». То есть это не смертельное оружие против них, а мучение. Из этой уязвимости прямо выводится их образ жизни: «Поэтому часто скрываться в заброшенных домах или в нелюдных местах».</p>\n<p>По общей механике мира (2024-06-03, id 175790) у любого существа, способного думать, энергия либо смесь, либо тёмная, либо светлая, а у неспособного думать (растения, животные) — природная. Ночные охотники объявлены сотканными из тёмной энергии; отдельно вопрос, мыслящие они или нет, в переписке не поставлен и не решён. Ранее Миколай спрашивал про существ вообще: «Ну а вот они будут думать или тупо машины?» (2024-06-03, id 175787) — ответ Славы (id 175790) касался энергий, а не разумности как таковой.</p>", "r": []}, {"t": "Чем участники отличаются друг от друга", "a": ["S03", "GR-0097-S03", "GR-0097--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p>Единого облика у вида нет — это заявлено в первой же строке скобкой: «( выглядят по разному )». Различие между особями и есть их видовой признак: каждая получает своё «уникальное строения тела». Названные варианты — крылья, много рук, много ног, большой рот, и список оставлен открытым («и т.п»).</p>\n<p>Никаких других осей различия — по силе, по возрасту, по рангу, по подчинению разным колдунам — в переписке не проводится.</p>", "r": []}, {"t": "Иерархия", "a": ["S04", "GR-0097-S04", "GR-0097--ierarhiya"], "h": "<p>Внутренней иерархии у ночных охотников в переписке нет. Названо только их внешнее положение: «Часто прислуживают темным колдунам». Слово «часто» оставляет место для тех, кто не прислуживает, но такие в переписке не описаны.</p>\n<p>У колдунов, которым они прислуживают, деление на ранги есть: «Будут низший и также вышей» (2024-06-03, id 175775). На ночных охотников это деление не переносится — соответствия между рангом колдуна и его слугами не проведено.</p>\n<p>Численность вида, вожаки и внутреннее устройство не названы.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S05", "GR-0097-S05", "GR-0097--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>Тёмные колдуны (<a href=\"PS-0087.html\">Колдуны (тёмные и светлые)</a>).</strong> Основная названная связь: ночные охотники «часто прислуживают темным колдунам». Колдунов в мире немного, они «мега сильный не все но именно они будут двигать сюжет создавая новых существ», причём новых существ создают именно тёмные колдуны (2024-06-03, id 175772–175773). Прямо, что ночные охотники — создания тёмных колдунов, в переписке не сказано; сказано только, что они им прислуживают, и отдельно — что новых существ создают тёмные колдуны. Соединять эти два утверждения переписка не даёт.</p>\n<p><strong>ГГ-хранилище тёмных существ (<a href=\"PS-0091.html\">ГГ-хранилище тёмных существ</a>).</strong> Связь установлена 2024-06-06 (id 176473). Главный герой «станет хранилищем темных охотником и других существ с темной энергии» — потому что «владелец темный энергий перерождаться или в некоторым роде бессмертный, ну то бишь как проклятий в магичке» (отсылка к «Магической битве»). Дальше: «И он будет страдать поглощая их. После свой смерть он отправится в ад вместе с темными». Таким образом ночные охотники оказываются не просто противником ГГ, а содержимым, которое он в себе носит, и попутчиками после его смерти.</p>\n<p>До этого, 2024-06-03 (id 175768), завязка была сформулирована иначе и без имён: «тварь у которых темная энергия доминирует нападают на обычного гг и после этого весь мир гг переворачивается». Что нападающие твари — именно ночные охотники, не сказано: этот вид появится только двумя сообщениями позже.</p>\n<p><strong>Свет и светлая сторона.</strong> Отношение задано только через физику: свет причиняет невыносимую боль, но не убивает. Связи со светлыми колдунами, провидцами или другими существами светлой стороны не названы.</p>\n<p><strong>Соседний бестиарий (связь с ночными охотниками не названа).</strong> Сразу после ночных охотников Слава спрашивает: «И каких существ ещё можно добавить типо вампиров или оборотней только видео измененный концепт» (2024-06-03, id 175804). Миколай предлагает переосмысленных вампиров: «вампиры например охотятся на живых и сосут кровь, а эти только на свежих мёртвых, потому что хрупкие, и кровь пить будут отрывая конечности и делать это прилюдно чтобы была подпитка мощная» (id 175805), и ещё вид, похожий на обычных людей, живущий в обществе, но увеличивающийся и становящийся похожим на медведя, «если к ним люди проявят светлую сторону» (id 175806). Оба вида обсуждаются как отдельные от ночных охотников; родства или общего происхождения не заявлено.</p>", "r": [["Колдуны (тёмные и светлые)", "PS-0087.html"], ["ГГ-хранилище тёмных существ", "PS-0091.html"]]}, {"t": "Как менялась — по датам", "a": ["S06", "GR-0097-S06", "GR-0097--kak-menyalas"], "h": "<p><strong>2024-06-03, id 175795–175806 (окно w0036).</strong> Вид придуман и описан целиком в одном сообщении Славы (id 175797): происхождение из тёмной энергии, разный облик, питание людьми, страхами и болью, отсутствие сверхсил, физическая сила и уникальное строение тела, служба тёмным колдунам, боязнь света, укрытия в заброшенных домах и нелюдных местах. Реакция Миколая — «О, вот подпитка идея классная» (id 175798). Дополнений или правок к описанию он не вносит.</p>\n<p><strong>2024-06-06, id 176469–176477 (окно w0036).</strong> Слава возвращается к миру репликой «А кстати гг» и в id 176473 переименовывает вид в «тёмных охотников», одновременно встраивая его в судьбу главного героя: ГГ становится их хранилищем, страдает, поглощая их, и после смерти уходит с ними в ад. Само описание вида (облик, питание, свет, укрытия) при этом не пересматривается — оно остаётся в силе с 2024-06-03.</p>\n<p>Между этими двумя датами вид не обсуждался. 2024-06-05 (id 176191) Миколай спрашивает: «А в чёрно белом мире придумал что-то ещё?» — ответа на этот вопрос в переписке нет, разговор уходит в сторону.</p>\n<h3>Отклонённое и оборванное</h3>\n<p><strong>Реплика «Чёт мне это идея не нравится» (2024-06-03, id 175799).</strong> Идёт сразу после похвалы Миколая подпитке. Дальше Миколай отвечает: «Ну, так и думал», «А бля», «Прости», «Ну тогда забыли». К чему именно относится «это идея» — к подпитке ночных охотников или к утилитарной теории, которую Миколай развернул в id 175795 и предложил как призму для тёмных и светлых, — из текста не следует. В переписке это не прояснено. Описание ночных охотников после этой реплики не отменяется и не правится.</p>\n<p><strong>Список существ, забракованный целиком (2024-06-04, id 175848–175863).</strong> В ночь на 4 июня в чат попадает готовый перечень существ для тёмной, светлой и смешанной сторон — по пяти пунктов на сторону (тенеморфы, кошмарные твари, некромантские слуги, энергетические вампиры, тёмные шифтеры; целители, светящиеся стражи, мудрые древни, звёздные духи, животные-компаньоны; серые странники, стихийные духи, механические конструкты, космические сущности, полукровки). Утром Слава отвечает: «Чёт ничего не понравилась кроме серых странников» (id 175863). Пункты этого списка с ночными охотниками нигде не сопоставлены — ни как замена, ни как родственные виды.</p>\n<p><strong>Каменные существа (Поротай) и провидцы.</strong> Разрабатываются в том же окне (2024-06-03, id 175810; 2024-06-04, id 175864) как отдельные виды со своей механикой. С ночными охотниками не связаны.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "GR-0097-S07", "GR-0097--probely"], "h": "<div class=\"gaps\"><ul>\n<li><strong>Поимённого состава нет.</strong> Ни одного названного ночного охотника в переписке не появляется; список участников группы пуст.</li>\n<li><strong>Численность не названа.</strong> Сколько их в мире — не обсуждалось.</li>\n<li><strong>Вожаков и внутренней иерархии нет.</strong> Есть только внешнее подчинение тёмным колдунам, и то с оговоркой «часто».</li>\n<li><strong>Происхождение не объяснено.</strong> Откуда берутся новые ночные охотники — рождаются, создаются колдунами, возникают из тёмной энергии сами — не сказано. Утверждение, что новых существ создают тёмные колдуны, к этому виду прямо не отнесено.</li>\n<li><strong>Мыслящие они или нет — осталось нерешённым.</strong> Вопрос Миколая «Ну а вот они будут думать или тупо машины?» (id 175787) прямого ответа не получил.</li>\n<li><strong>Питание не расписано.</strong> Как именно они «питаются людьми и страхами и болью» — в чём разница между этими тремя, нужно ли убивать, — не уточнялось.</li>\n<li><strong>Причина переименования в «тёмных охотников» не названа.</strong> Смена обозначения между 2024-06-03 и 2024-06-06 никак не прокомментирована; какое из двух названий считается основным, не решено.</li>\n<li><strong>Что именно забраковано репликой id 175799 — не установлено.</strong> См. раздел «Отклонённое и оборванное».</li>\n<li><strong>Не сказано, кто напал на ГГ в завязке.</strong> «Твари, у которых тёмная энергия доминирует» (id 175768) остались без вида.</li>\n<li><strong>Внешность конкретных особей не описана.</strong> Названы только признаки-примеры (крылья, много рук, много ног, большой рот); отдельного облика ни у одной особи нет. Рисунков ночных охотников в переписке не упоминается.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0097--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0087.html\">Колдуны (тёмные и светлые)</a>, <a href=\"PS-0088.html\">Ночные охотники</a>, <a href=\"PS-0091.html\">ГГ-хранилище тёмных существ</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0097--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0097.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0097-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0097/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — <code>ID-0066</code> «Утилитарная призма для тёмных и светлых»: статьи нет, база 4 915, формальных входящих ссылок две, а по тексту её пересказывают шесть статей — <code>GR-0096</code>, <code>GR-0097</code>, <code>PS-0087</code>, <code>PS-0088</code>, <code>MR-0012</code>, <code>VS-0007</code>. Здесь на ней держится весь раздел «Отклонённое и оборванное»: что именно забраковано репликой 175799 — подпитка ночных охотников или призма Миколая, — решать негде, пока у призмы нет своей страницы. Это единственная дыра в статье, которая может изменить не объём, а прочтение.</p>\n<p>Второе — соседний бестиарий. <code>ID-0067</code> «Пожиратели свежих мертвецов» (база 2 530) и <code>ID-0068</code> «Существа, растущие от чужой доброты» (2 294): статей нет ни у одной, по одной входящей ссылке на каждую, при этом обе дословно процитированы здесь и ещё в <code>PS-0088</code>, <code>MR-0012</code>, <code>VS-0007</code>. То есть целый раздел этой статьи ссылается на сущности, у которых нет страниц, и каждая из них висит на одной нитке.</p>\n<h3>С чего начать</h3>\n<p>В базе, не в архиве. <code>ID-0066</code> (4 915) собирается в статью целиком, и там же лежит косвенный ответ на главный вопрос — в порядке реплик: 175795 (22:50, Миколай разворачивает утилитарную теорию) → 175797 (22:51, Слава пишет параллельно, про ночных охотников) → 175798 (22:52, «О, вот подпитка идея классная») → 175799 (22:53, «Чёт мне это идея не нравится») → 175800–175803 («Ну, так и думал», «А бля», «Прости», «Ну тогда забыли»). Извиняется Миколай — то есть сам он прочёл отказ как отказ от своей теории, а не от чужой подпитки. Прочтение это не доказывает, но оно в базе есть, а статья его не проводит; стоит либо провести с оговоркой, либо записать, почему не проводится.</p>\n<p><code>ID-0067</code> и <code>ID-0068</code> — оттуда же, из w0036, сообщения 175804–175806, материал целый и мелкий, чинится за один заход.</p>\n<p>В архив идти незачем: окно w0036 (174499–177144, 2024-06-02 — 06-08, 410 сообщений) помечено прочитанным целиком, и ответа на вопрос 175787 «Ну а вот они будут думать или тупо машины?» в нём нет. Если он вообще существует, то в следующем окне мира — w0037 (177470–181869, 2024-06-10 — 06-16), куда разговор о «Новом мире» перешёл.</p>\n<h3>Как развивалось</h3>\n<p>3 июня 22:30 — заявлена завязка без вида: «твари у которых темная энергия доминирует» (175768), и тут же собственный вопрос «Вот только какие именно твари темной энергий» (175770).</p>\n<p>22:51 — вид заявлен целиком одним сообщением (175797): происхождение, облик, питание, служба колдунам, свет, укрытия.</p>\n<p>Ограничение стоит внутри того же сообщения, не после: «сверх сил сил не будет», и свет «их не убивает а лишь причиняет невыносимую боль». Заявление и ограничение здесь — один акт.</p>\n<p>22:53–22:58 — ветку сворачивают («Ну тогда забыли») и уходят в соседний бестиарий. К охотникам не возвращаются.</p>\n<p>4 июня 07:00 — забракован список существ; с ночными охотниками ни один его пункт не сопоставлен. 5 июня — вопрос «А в чёрно белом мире придумал что-то ещё?» без ответа.</p>\n<p>6 июня 21:05 — возврат есть, но не к устройству вида: меняются имя («тёмные охотники») и функция (ГГ-хранилище). Описание от 3 июня не тронуто ни в одной строке.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Правило уязвимости названо и названо точно: свет тёмному существу причиняет невыносимую боль, но не убивает, — и из него прямо выведено поведение вида. Парного правила для другой стороны нет нигде: вредит ли тьма светлым существам, и если да, мучает или убивает, — не сказано ни про провидцев, введённых на следующий день, ни про кого-либо ещё. Физика прописана в одну сторону, хотя энергий в мире объявлено две симметричных.</p>\n<h3>Отклик</h3>\n<p>Сильное место — «а лишь». Обычный ход был бы «свет их убивает», и получилось бы оружие: фонарик, рассвет, вся известная оснастка жанра. Здесь вместо оружия — боль, и из боли в той же строке вырастает быт: заброшенные дома, нелюдные места. Одна оговорка превращает уязвимость в образ жизни, и делает это дешевле, чем любое отдельное описание среды обитания.</p>\n<p>Второе, что зацепило, — открытый список форм: «типо крылья, многорукий, многоногий, большой рот» с «и т.п» на конце. Вид держится не на облике, а на том, что облика у него нет, и «выглядят по разному» в первой же скобке — это не отговорка, а признак. Написано за одну минуту, посреди разговора совсем о другом, и с тех пор не правилось ни разу — что, в общем, тоже о чём-то говорит.</p></div>", "r": []}];</script>
