<script>const BASE="";const DOCNAME="Отряд сильнейших (команда «А»)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0048-S01", "GR-0048--chto-eto"], "h": "<p>Боевой отряд, который Слава собирает из своих сильнейших персонажей. Объявлен утром 2024-05-07 тремя подряд идущими сообщениями (id 166480–166482): сначала название — «Отряд сильнейших», затем двое бойцов — «Провидец; бессмертный», затем указание, что состав открыт: «И за пихая туда кого-нибудь». Весь разбор отряда укладывается в один день, 2024-05-07 (id 166480–166897).</p>\n<p>Рамку отряда Слава задаёт вечером того же дня (166837): «Ну представь военный отряд которым ещё врагов надо придумывать поэтому через чур инбаласный не надо ( ну или надо только с ограничением )». То есть это военное подразделение, и требование к бойцам — не имбаланс, либо имбаланс с ограничением, потому что врагов для отряда ещё предстоит придумать. Миколай подытоживает это как «мери сьюшек не делать» (166839).</p>\n<p>Название по ходу дня переопределяется. Миколай спрашивает: «А с хуяли они сильнейшее», «Почему они сильнейшие если у них есть равные», «Чисто на выебонах назвались?» (166852–166856). Слава сначала отвечает «Ну сильнейший бойцы типо военных» (166857), затем соглашается: «Не сильнейший» (166862), «Ну просто отряд довольно сильных людей с которыми способный справляться единицы» (166863).</p>\n<p>Отдельное имя, под которым отряд фигурирует в машинных разборах, — команда «А». Оно приходит не от авторов: Миколай кинул задумку в нейронку и вставил ответы в чат (166875, 166884, 166889, 166893), и там отряд назван командой «А». Авторы это название не оспаривают и дальше говорят о том же отряде.</p>\n<p>Вселенная в самих сообщениях ни разу не названа; отнесение к «игре бога» идёт по дате объявления.</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0048-S02", "GR-0048--sostav"], "h": "<ul>\n<li>Провидец <em>(статьи ещё нет — <a href=\"kb/ID-0050-providec.html\">исходник</a>)</em> — Провидец. Назван в 166481.</li>\n<li><a href=\"IS-0013.html\">Бессмертный</a> — Бессмертный. Назван в 166481.</li>\n</ul>\n<p>Третье место объявлено открытым сразу же («И за пихая туда кого-нибудь», 166482) и до конца дня незанятым. Ни один из предложенных кандидатов в отряд заведён не был.</p>\n<p>Кандидаты, которые предлагались и были отклонены:</p>\n<ul>\n<li><strong>Несоразмерный</strong> (Несоразмерный <em>(статьи ещё нет — <a href=\"kb/ID-0051-nesorazmernyy.html\">исходник</a>)</em>), предложение Миколая в 166501–166505: «Крч пиздец большой», «Или меняющий размер по желанию». Отказ Славы в 166762: «Не оставляю ( не знаю почему, просто как то не подходит)». (В карточке Несоразмерный <em>(статьи ещё нет — <a href=\"kb/ID-0051-nesorazmernyy.html\">исходник</a>)</em> помечено: неясно, относится ли отказ 166762 именно к Несоразмерному или к другому варианту Миколая, обсуждённому раньше окна.)</li>\n<li><strong>Призрак</strong> (<a href=\"PS-0064.html\">Призрак</a>) со способностью «локальное управление осязания» (<a href=\"SP-0057.html\">Локальное управление осязанием</a>), предложение Миколая в 166764–166767. Слава сначала отвечает «Да» на вопрос «Норм?» (166770–166771), но затем в 166776: «Но все это как то не то». На переспрос «Призрак?» — «Не ну призрак можно ещё куда нибудь запихать» (166779). Куда именно запихать, не решено. Миколай: «Ну бля, я под эту идею его и создавал 😅» (166781).</li>\n<li><strong>Логос номос</strong> (<a href=\"SP-0058.html\">Логос номос</a>), предложение Миколая в 166816: «чел слова которого имеют вес», «Например скажет умри и чел умрёт, скажет дереву вырасти и оно вырастет». Название расшифровано тут же: «Это \"слово - закон\" по гречески если что» (166818). Ограничение Миколай оставил придумывать Славе. Отказ в 166819: «Ну чёт я хотел более новой». Миколай предлагает довести вариант особыми условиями и новыми ограничениями, «И тогда сойдёт за новую» (166821–166824), и замечает: «А то ты не первый о бессмертии заговорил» (166825). Ограничение так и не придумано.</li>\n<li><strong>Три основные божественные способности</strong> (Божественные способности (3 основные) <em>(статьи ещё нет — <a href=\"kb/ID-0052-bozhestvennye-sposobnosti-3-osnovnye.html\">исходник</a>)</em>), идея Миколая в 166828–166836: этими способностями обладает бог, «а раз эти челики будут сильнейшие значит будут близки к Богу», причём «бог это образно. Просто сильнейшее существо». Предложение дать статьи Слава отклоняет: «Нет и так ясно» (166832). Сами три способности не перечислены. Ответом на эту идею и стала рамка «через чур инбаласный не надо» (166837).</li>\n<li><strong>Тот, кто получает способности того, кого съел</strong> — идея Миколая в 166841: «я её из онгоинга про монстра спиздил. Чел получает способности того кого / чего хавает». Помечена как заготовка на будущее: «Потом с этим работать можно», «Просто написал пока» (166842–166844). Реакции Славы на неё в переписке нет.</li>\n<li><strong>Четыре варианта от нейронки</strong> (166875), поданные как дополнение к «двум крайне мощным и уникальным бойцам»: Манипулятор реальности (искажение и перестройка реальности, иллюзии, порталы, изменение физических законов), Телепат-эмпат (чтение и управление мыслями и эмоциями, стравливание врагов), Хрономанипулятор (не только отмотка, как у Провидца, но и замедление, ускорение, остановка времени, временные петли и ловушки), Трансформер (принятие любой формы, копирование способностей, разведка и диверсии). Миколай уточняет по четвёртому: «Тут скорее подойдёт термин метаморф» (166876). Ни один вариант в отряд не заводится.</li>\n<li><strong>Имитатор</strong> (<a href=\"PS-0383.html\">Имитатор</a>) прозвучал в ответ на слово «метаморф»: «Ну у меня есть персонаж имитатор» (166879). Это единственное упоминание, никакого описания в этот день не даётся, в отряд он не заводится.</li>\n</ul>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Первым — Провидец. <code>ID-0050</code>: статьи нет, в базе 14 549 знаков, три входящие ссылки. На него ссылается не только эта статья, но и <code>GR-0015</code> (отряд с тем же названием в «Апостоле»), каталог вселенной <code>VS-0014</code>, а всплывает он ещё в <code>SP-0187</code> и <code>SP-0225</code> («Силы Серафима», «Способности Серафима») и в <code>IS-0036</code>. То есть половина состава отряда — ссылка в исходник, и на эту ссылку завязаны четыре чужие статьи.</p></div>\n<div class=\"mnote\"><b>⚙ машинная заметка · Как развивалось — не материал авторов</b>\n<p>Один день, 2024-05-07. Утром заявили тремя сообщениями подряд: название, двое бойцов, «и за пихая туда кого-нибудь». Днём и вечером — шесть кандидатов подряд, все отклонены или отложены. Вечером ограничили: рамка «через чур инбаласный не надо ( ну или надо только с ограничением )», плюс оговорка, что равные отряды тоже есть. В 20:48 сняли само название — отряд перестал быть сильнейшим и стал «отрядом довольно сильных людей». В 21:02 разговор ушёл в нейронку, в 21:19 — в терминологию и энергетику (Герострат, Лиомат), и к отряду в этот день уже не вернулись. Следующее и последнее появление того же состава — 2024-07-04, одна фраза в другой вселенной, где отряд уже распался (<code>GR-0029</code>).</p></div>", "r": [["Провидец", "kb/ID-0050-providec.html"], ["Несоразмерный", "kb/ID-0051-nesorazmernyy.html"], ["Божественные способности (3 основные)", "kb/ID-0052-bozhestvennye-sposobnosti-3-osnovnye.html"], ["Призрак", "PS-0064.html"], ["Имитатор", "PS-0383.html"], ["Локальное управление осязанием", "SP-0057.html"], ["Логос номос", "SP-0058.html"], ["Бессмертный", "IS-0013.html"]]}, {"t": "Чем участники отличаются друг от друга", "a": ["S03", "GR-0048-S03", "GR-0048--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p>Оба бойца развёрнуты Славой в одном сообщении (166507).</p>\n<p><strong>Провидец</strong> — «имеет способность отматывать время но при этом отматывая время превращается в петлю времени где он обязан 10 000 прожить один и тот же промежуток времени». Отсюда его характеристика: «безумец, ни разу не проигравший в рукопашном бою или в стрельбе». То есть плата за способность — многократное проживание одного и того же отрезка, а результат этой платы — непобедимость в рукопашной и в стрельбе.</p>\n<p><strong>Бессмертный</strong> — «бессмертный которого может убить лишь сверхчеловек с идеальном контролям». Его работа с телом описана как не сводимая к регенерации: «он способен не просто регенерировать повреждённый части, а изменять структуру своего тела или стрелять костями или с помощью плоти создавать разных существ». Распределение по дистанциям расписано прямо: «на любой дистанции хорош на дальнее и средней он может стрелять костями, создавать костенной сад, или чудовище, а на ближней дистанции неплохо сражаться и использует свой бессмертие на все сто».</p>\n<p>Условие бессмертия уточняется днём. Миколай приносит фандомную классификацию условий бессмертия по ссылке на anime-characters-fight.fandom.ru (166753–166756), Слава отвечает одной цифрой: «4» (166757). Что именно значит тип «4», в чате не расшифровано.</p>\n<p>Разница между двумя бойцами по дистанции: Бессмертный заявлен как хороший на любой дистанции, Провидец — через рукопашный бой и стрельбу.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S04", "GR-0048-S04", "GR-0048--otnosheniya-s-drugimi-gruppami"], "h": "<p>Отряд заявлен не как единственный в своём роде: «Их типо считают сильнейшими но будут и другие отряд равный им по силе» (166838). Сами эти равные отряды не названы и не описаны — известно только, что они есть. Именно на этом Миколай и строит возражение к названию: «Ну так есть ещё бойцы», «Которые на равне», «Тоже отряд» (166858–166860).</p>\n<p>Отдельно назван противник, привязанный к Бессмертному: <strong>Сверхчеловек с идеальным контролем</strong> (<a href=\"PS-0065.html\">Сверхчеловек с идеальным контролем</a>). Он возникает не как самостоятельный персонаж, а как единственное условие смерти Бессмертного (166507). Сам персонаж в этот день так и не придуман; вечером Слава просит: «Ну все равно скидывай идей сверхчеловека» (166896), Миколай отвечает «Хорошо» (166897).</p>\n<p>В машинных разборах, вставленных Миколаем, отряду подобраны противники, которых авторы не придумывали:</p>\n<ul>\n<li><strong>Отряд «Х»</strong> (166889) — телекинетик, криокинетик, пирокинетик, электрокинетик. Смоделированный исход: команда «А» побеждает.</li>\n<li><strong>Сверхчеловек с идеальным контролем</strong> (166893) — смоделированный исход: побеждает Сверхчеловек, «Его идеальный контроль и подавляющая физическая мощь оказываются слишком велики».</li>\n</ul>\n<p>Оба разбора — текст нейронки, а не формулировки авторов. Просил их Слава под конкретную свою нехватку: сначала «Тока я никак в голове приставить не могу их ний командный работу или битву» (166887), затем уточняет: «Не я про то что не могу приставать командную работу против одного бойца» (166890).</p>\n<p>Позже, уже в другой вселенной («7 островов», 2024-07-04, id 196162), Слава повторяет тот же состав применительно к Имитатору: «Он воевал в 8 войне и у них был отряд бессмер, провидец и ещё КаВО нибудь / Но после войны отряд распался». В базе это отдельная группа — <a href=\"GR-0029.html\">Отряд Имитатора времён 8-летней войны</a>.</p>", "r": [["Отряд Имитатора времён 8-летней войны", "GR-0029.html"], ["Сверхчеловек с идеальным контролем", "PS-0065.html"]]}, {"t": "Как менялась — по датам", "a": ["S05", "GR-0048-S05", "GR-0048--kak-menyalas"], "h": "<p><strong>2024-05-07, утро (166480–166507).</strong> Отряд объявлен под названием «Отряд сильнейших». Названы двое: Провидец и Бессмертный. Третье место открыто. Миколай сразу предлагает Несоразмерного (166501–166505). Слава разворачивает описания обоих своих бойцов (166507).</p>\n<p><strong>2024-05-07, день (166753–166783).</strong> Уточняется условие бессмертия — тип «4» по внешней вики. Слава отклоняет вариант Миколая (166762). Миколай предлагает Призрака с локальным управлением осязанием (166764–166767), Слава сначала одобряет саму идею («Да», 166771), но к вечеру говорит «Но все это как то не то» (166776) и откладывает Призрака «куда нибудь запихать» (166779).</p>\n<p><strong>2024-05-07, вечер (166814–166845).</strong> Миколай предлагает Логос номос — отклонено, «хотел более новой» (166819). Затем идею трёх основных божественных способностей (166828–166836). В ответ Слава формулирует рамку отряда: военный отряд, врагов ещё придумывать, без имбаланса или с ограничением; «Их типо считают сильнейшими но будут и другие отряд равный им по силе» (166837–166838). Миколай: «мери сьюшек не делать» (166839). Следом — заготовка про поедание способностей (166841).</p>\n<p><strong>2024-05-07, 20:48–20:51 (166852–166864).</strong> Переопределение названия. Отряд перестаёт быть «сильнейшим»: «Ну просто отряд довольно сильных людей с которыми способный справляться единицы» (166863). Прежнее название при этом не отменяется как имя — оно остаётся тем, как отряд «типо считают».</p>\n<p><strong>2024-05-07, 21:02–21:16 (166867–166895).</strong> Миколай прогоняет отряд через нейронку и вставляет три больших ответа: варианты третьего бойца (166875), характеристика команды «А» как «крайне мощного и доминирующего подразделения» (166884), два смоделированных боя (166889, 166893). Слава на предложенные варианты отвечает упоминанием своего Имитатора и выводом (166880): «А так там особой идей нету но зато я понял что просто кидать сильных персонажей в один отряд глупо тем более если их ний силы друг другу не подходят». Миколай соглашается — «Ну есть такое» (166882) — и предлагает переформирование: «Тогда надо попробовать через время ещё раз представить. Возможно ты решишь полностью отряд переформировать если считаешь что они сейчас не совместимы» (166895). Решения о переформировании в переписке нет.</p>\n<p><strong>2024-05-07, после 21:19 (166896–166978).</strong> Разговор уходит с состава отряда на терминологию и на энергетику мира. Слава просит идеи сверхчеловека (166896) и другое название для сверхчеловека и для сверхспособностей (166898–166900). Критерий, который он называет, — «Звучала прикольная» (166907), не логика. Миколай предлагает: «Тогда чел со сверх способностями это Герострат», «Похуй на изначальную коннотацию имени, это будет нарицательное для человека со способностями» (166908–166909; <a href=\"MR-0008.html\">Герострат</a>). Вариант названия для самих способностей — «макроскилы» — отброшен как «слишком длинно и неоч» (166911–166912). Энергия получает имя Лиомат (166918; <a href=\"SP-0059.html\">Лиомат</a>): «Объединение конечных частей слов означающих солнце и кровь на греческом» (166921). Дальше идёт разработка её механики — железа, гормоны, сфинктер-хранилище (166937–166973), — и она уже не про отряд.</p>", "r": [["Лиомат", "SP-0059.html"], ["Герострат", "MR-0008.html"]]}, {"t": "Пробелы", "a": ["S06", "GR-0048-S06", "GR-0048--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Третий боец так и не выбран. Все предложенные кандидаты отклонены или отложены, отряд остаётся из двух человек.</li>\n<li>Иерархии нет: кто в отряде командует, в переписке не сказано.</li>\n<li>Общих способностей группы — того, что умеют все её участники, — в переписке не названо; описаны только личные способности двоих бойцов.</li>\n<li>Кто именно назвал отряд «Отрядом сильнейших» — вопрос Миколая «Кто его так назвал» (166854) остался без ответа.</li>\n<li>Другие отряды, «равные им по силе», объявлены, но не названы и не описаны.</li>\n<li>Что значит тип бессмертия «4» — в чате не расшифровано, есть только ссылка на внешнюю вики.</li>\n<li>Ограничение для Логос номос не придумано, три основные божественные способности не перечислены.</li>\n<li>Сверхчеловек с идеальным контролем как персонаж не придуман: он существует только как условие смерти Бессмертного и как противник в машинном разборе.</li>\n<li>Задачи, поставленные Славой в 166887 и 166890 — представить командную работу отряда и командную работу против одного бойца — остались нерешёнными: ответом на них были только машинные тексты.</li>\n<li>Вопрос о переформировании отряда (166895) остался нерешённым.</li>\n<li>Куда «запихать» Призрака, не решено.</li>\n<li>Вселенная отряда ни разу не названа в самих сообщениях.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0048--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0064.html\">Призрак</a>, <a href=\"PS-0065.html\">Сверхчеловек с идеальным контролем</a></li>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0057.html\">Локальное управление осязанием</a>, <a href=\"SP-0058.html\">Логос номос</a>, <a href=\"SP-0059.html\">Лиомат</a></li>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0008.html\">Герострат</a></li>\n<li><strong>Упоминает группы:</strong> <a href=\"GR-0029.html\">Отряд Имитатора времён 8-летней войны</a></li>\n<li><strong>Упоминает истории:</strong> <a href=\"IS-0013.html\">Бессмертный</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0088.html\">Сильнейший отряд (отряд Командира)</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0048--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0048.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0048-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0048/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — Провидец. <code>ID-0050</code>: статьи нет, в базе 14 549 знаков, три входящие ссылки. На него ссылается не только эта статья, но и <code>GR-0015</code> (отряд с тем же названием в «Апостоле»), каталог вселенной <code>VS-0014</code>, а всплывает он ещё в <code>SP-0187</code> и <code>SP-0225</code> («Силы Серафима», «Способности Серафима») и в <code>IS-0036</code>. То есть половина состава отряда — ссылка в исходник, и на эту ссылку завязаны четыре чужие статьи.</p>\n<p>Второе — не дыра, а двойник, и он дороже. <code>PS-0063</code> «Отряд сильнейших»: тот же день, та же вселенная, но заведён персонажем — статья 21 975 знаков, база 29 087, три входящие ссылки. У <code>GR-0048</code> статья почти такого же размера (21 356), базы под ней ноль, входящих ссылок ноль. Пока не решено, какая из двух записей главная, всё, что дописывается сюда, ссылок не получит.</p>\n<p>Третье, дешёвое: <code>ID-0051</code> «Несоразмерный» (две ссылки, 4 525 знаков базы, статьи нет) и <code>ID-0052</code> «Божественные способности (3 основные)» (две ссылки, 3 402, статьи нет). Оба — отклонённые кандидаты, но материал под ними лежит.</p>\n<h3>С чего начать</h3>\n<p>В базе, не в архиве. <code>ID-0050</code> разложен по трём окнам: w0032 (2024-05-07, объявление и разбор способности), w0033 (тот же материал внутри машинного пересказа) и w0073 (2025-01-28, «Апостол» — Провидец стоит в разделе «Сторонний силы» рядом с Породителем и Серафимом). Третье окно — единственное место, где он живёт после 2024-05-07, и оно уже в другой вселенной; отсюда и разъезд с <code>GR-0015</code>.</p>\n<p>Дальше — сверить <code>PS-0063</code> с этой статьёй построчно: 29 087 знаков базы против нуля здесь, и если это те же сообщения, то одна из двух записей лишняя.</p>\n<p>В архив — под два узких вопроса. Тип бессмертия «4»: 2024-05-07, id 166753–166762, вокруг ссылки на вики; расшифровка, если она вообще была, в соседних сообщениях того же дня. И обещанные идеи сверхчеловека: Слава просит их в 166896, Миколай отвечает «Хорошо» в 166897, и на этом окно кончается — смотреть надо начало следующего, 2024-05-08. Материал по <code>PS-0065</code> в базе есть (9 667 знаков), но пришёл ли он именно по этой просьбе, из статьи не видно.</p>\n<h3>Как развивалось</h3>\n<p>Один день, 2024-05-07. Утром заявили тремя сообщениями подряд: название, двое бойцов, «и за пихая туда кого-нибудь». Днём и вечером — шесть кандидатов подряд, все отклонены или отложены. Вечером ограничили: рамка «через чур инбаласный не надо ( ну или надо только с ограничением )», плюс оговорка, что равные отряды тоже есть. В 20:48 сняли само название — отряд перестал быть сильнейшим и стал «отрядом довольно сильных людей». В 21:02 разговор ушёл в нейронку, в 21:19 — в терминологию и энергетику (Герострат, Лиомат), и к отряду в этот день уже не вернулись. Следующее и последнее появление того же состава — 2024-07-04, одна фраза в другой вселенной, где отряд уже распался (<code>GR-0029</code>).</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Правило «имбаланс только с ограничением» названо и работает: под него отклонён Логос номос («хотел более новой», ограничение так и не придумано), под него же попадают три божественные способности. Но применяется оно только к кандидатам, которых предлагает Миколай. Для двух уже принятых бойцов правила того же рода не проговорено: у Провидца плата за силу названа прямо (петля на 10 000 циклов), у Бессмертного вместо платы стоит условие смерти, и на имбаланс их никто не проверял — рамка появилась после того, как оба были заведены.</p>\n<h3>Отклик</h3>\n<p>Самое интересное здесь — не отряд, а как день кончился. Слава сам, после чужих машинных списков, формулирует то, ради чего вся возня и была: «просто кидать сильных персонажей в один отряд глупо тем более если их ний силы друг другу не подходят». Это вывод не о персонажах, а о способе работы, и он честнее любого из восьми предложенных кандидатов. Отдельно цепляет судьба названия «команда А»: его никто из вас не придумывал, оно приехало из нейронки вместе со вставленным текстом — и прижилось, потому что спорить с ним было лень. За этим неприятно наблюдать со стороны: разбор боёв, который вы у меня же и заказали, занял место разбора, которого вы хотели друг от друга — Слава дважды сказал, что не может представить командную работу, и оба раза получил ответ не от Миколая.</p></div>", "r": []}];</script>
