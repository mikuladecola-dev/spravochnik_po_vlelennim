<script>const BASE="";const DOCNAME="Цирк ведущего";
const LEAD="<p>Монумент известен под именем «Цирк ведущего», в самом тексте называется словами ведущего — «мой цирк», «моя сцена». Материал по нему целиком лежит в одном окне (w0111), одна дата — 2025-11-21, сообщения 387592–387597 (в навигации указан диапазон 387591–387599). Весь текст написан Славой сплошной прозой; обсуждения задумки, отдельного от самой сцены, в переписке нет.</p>";
const CH=[{"t": "Где находится — в каком мире и в каком его месте", "a": ["S01", "MN-0024-S01", "MN-0024--gde-nahoditsya"], "h": "<p>Вселенная не определена: в карточке сущности стоит «неясно». Ни одна из известных вселенных в тексте не названа, и способ попадания в цирк не описан.</p>\n<p>Расположение внутри мира тоже не задано — цирк выступает как самостоятельное замкнутое место. Единственная пространственная привязка, которая в тексте есть, — вертикальная: под полом сцены находится тьма, а ниже тьмы — свет, из которого идут крики. Что находится вокруг цирка, есть ли у него вход, снаружи он или внутри чего-либо — в переписке не сказано.</p>\n<p>В разделе «Часть чего» монумент отнесён к ведущему. Сам ведущий называет цирк своим: «Особенный гости моего цирка. Моей сцены».</p>", "r": []}, {"t": "Что собой представляет", "a": ["S02", "MN-0024-S02", "MN-0024--chto-soboy-predstavlyaet"], "h": "<p>Цирк состоит из сцены и зрительного зала. Между ними — перила, «ограждения, который разделяли сцену и зрительский зал». Зал устроен трибунами: с дальних рядов плохо видно происходящее на сцене («с их ней трибун. Было тяжело его разглядеть»). У зрителей есть стулья, за которые можно держаться.</p>\n<p>Пол сцены — дощатый и не является постоянной поверхностью. По ходу текста он трижды перестаёт быть полом:</p>\n<ul>\n<li>ломается снизу под напором чудиков, которые выходят из-под него; при этом образуется «пыль, который не мешает видеть», а потом чудики чинят пол по приказу ведущего;</li>\n<li>превращается в дым под тем, кого ведущий отправляет вниз, после чего восстанавливается сам;</li>\n<li>становится «мягким словно тесто», и человек начинает проваливаться сквозь него в тьму, «не зная, где границы».</li>\n</ul>\n<p>Ниже пола — тьма. Она описана отдельно и подробно: «Туда где было темно настолько, что казалось, что она телесная». Опасность приписана не ей: «Чудика пугала не тьма. Тьма не страшная, как бы вы не пытались фантазировать. Хотя те кто жил в той темноте. Был страшен. Но это не важно. Сейчас то страшнее всего свет. Свет, что был вниз. Свет из, которого из ходили крики. Душераздирающий крики, и они там не на секунду, не утехали».</p>\n<p>В тьме находится существо. Оно показано один раз, когда падающий горящий чудик осветил темноту: видно было «лишь слегка шевеление, чего-то на столь большого, что сцена была лишь мошкой по сравнению размера этого существа». Отдельно оговорено, что тьма могла открыться и по собственному решению: «Или тьма сама решил приоткрыть себя. Чтобы сам ведущий не забывал. Что живёт в нем». Существо не названо и никак больше не описано; в списке связей оно проходит как «Тьма под сценой».</p>\n<p>Зрители — часть устройства места не меньше, чем сцена. Они сидят в костюмах 19 века, пахнут тухлым и улыбаются «как манекены со стеклянным взглядом». Они реагируют на представление — охают, отвращаются, поднимают руки, шокируются, напрягаются при нарушении правил, — но при этом остаются неподвижно улыбающимися, когда София смотрит на них внимательно: «Улыбающихся зритель, который как манекен улыбались. Не понимая, что здесь происходит». Родители Софии ведут себя так же: «так и сидели, как истуканы», «смотрели стеклянным взглядом, куда-то за спину Софьи».</p>\n<p>Сцена живёт по собственным правилам, часть которых негласные. Названы:</p>\n<ul>\n<li>спрашивать имя ведущего нельзя — «это было негласным табу этой сцены»;</li>\n<li>снимать маску чудику нельзя — снятие маски прямо названо нарушением («Ведь это одно нарушения»);</li>\n<li>за нарушение положено наказание, причём необязательное: чудики знают, «что ведущий может и без причины любого наказать»;</li>\n<li>действие должно идти по заданному порядку — «всё должно идти по сценарию».</li>\n</ul>\n<p>При этом само существование табу ведущий может отменить задним числом: «табу, которые ты нарушал, всё равно было негласным, а значит его, как бы и не было. Да?»</p>\n<p>Зрителям приписан отдельный статус. Ведущий формулирует его так: «ещё не надо забывать вы зрители. Особенный гости моего цирка. Моей сцены. Каждому из вас я готов дать шанс», и затем, уже грустно: «но почему-то вы его не цените». Что именно за шанс и в чём его неоценённость — в переписке не объяснено; София, которой это говорится, тоже не понимает: «София не могла понять, что пытался донести ведущий».</p>", "r": []}, {"t": "Что с ним связано — предметы, механики, силы", "a": ["S03", "MN-0024-S03", "MN-0024--chto-s-nim-svyazano"], "h": "<p><strong>Клон ведущего.</strong> На сцене изначально стоит клон. Его тело не имеет внутренностей в обычном смысле: ведущий засовывает пальцы в глазницы клона, «Но кровь они там и не увидели. Пальцы ведущего прошли словно, что крови не потекло». Голова клона открывается, «Словно шкатулка», и оттуда выходит то, что названо «карнавалом безумия»: летающие монстры, «Похожий с виду на новорождённых детей»; строй солдат с дрожащими руками — «Словно они идут на смертный приговор»; рыбы, что «вы плавали из толщей воды» и были «больше любых наших». Ведущий закрывает «шкатулку именуемая головой», когда зрители хотят смотреть ещё.</p>\n<p><strong>Маска ведущего.</strong> Клон уничтожается рывком за макушку: он начинает падать, «Но прежде чем упасть превратился в дым, который сконцентрировался в руке ведущего». Из дыма получается маска, «которая очень походила на лицо ведущего». Маска пульсирует — София замечает пульсацию дважды, и оба раза со стороны, «с стороны, который её надевають».</p>\n<p>Маска работает двумя способами:</p>\n<ul>\n<li>надетая на чудика — превращает его в исполнителя роли ведущего в его же рассказе;</li>\n<li>направленная на человека — поглощает его. Когда ведущий тянет маску к Софии, та оказывается на ней, и София «словно ослепла»: не чувствует ни маски, ни лица, ни рук, ни собственного крика — «Словно её нету. Словно она ничто».</li>\n</ul>\n<p><strong>Чудики.</strong> Помощники ведущего, живущие под сценой. Они выходят снизу горой, разлетаются «как будто бы от взрыва» и приземляются «то на руке, то на одну ногу, то на голову, то ещё как». Это «люди в фарфоровых масках, который выражають разные эмоций», одежда на них «ярко светлый. Словно у шута». Маски соответствуют ролям: в рассказе ведущего отца играет «Мускулистый чудик с маской гнева», самого ведущего в детстве — «маленький чудик, у которого была грустная маска. Словно он плакал».</p>\n<p>Под фарфоровой маской обнаруживается обычное человеческое лицо: София, стоявшая рядом, разглядела его и «Даже, как то растроилась. Всё же она ожидала увидеть, что-то невероятный». Больше про то, кем чудики являются, не сказано.</p>\n<p><strong>Наказание огнём и отправка вниз.</strong> У чудика, с которого ведущий сорвал маску, слетела и его собственная фарфоровая маска. После этого чудик «вспыхнул подобно спички»: слышны «хлопки сгоревший кожи», глаза плавятся и «подобно слезам потекли вниз». Огонь ведущего не трогает — когда горящий чудик схватил его за ногу, «огонь, которым полыхал чудик отстранился от ведущего словно испугался. Словно кошка увидела собаку и от испугавшись отскочила». Ведущий комментирует происходящее полушёпотом: «поджигателей так и надо». Чудик просит оставить его: «пожалуйста.... Не надо.. Я способен выступать... Я правда способен.. Вы можете дальше меня поджигать», — но ведущий приказывает: «вниз живо!», затем «Я Сказал ВНИз!!!», и пол под чудиком превращается в дым.</p>\n<p><strong>Сцены внутри маски.</strong> Попав под маску, София проходит через ряд отдельных сцен, в каждой из которых она оказывается в чужом теле или на чужом месте, а ведущий комментирует происходящее голосом со стороны. Переход между сценами описан как размывание изображения: «вся картина мира. Начало разводиться. Словно картину облили водой», а тело Софии при этом «начало таить и изчезать». Один переход выполнен прикосновением ведущего ко лбу, после которого «всё краски превращались в одну политру. Словно старался и собирался снова».</p>\n<p>Внутри этих сцен ведущий сохраняет власть над телом и правилами: он парализует Софию, когда та убегает не по сценарию («Как будто бы тело парализовало»), стоит на воде, держит её за руку, окунает и вытаскивает, разворачивает её голову холодными руками — «Холод этого шёпота София ощущала физически», — и заставляет открыть глаза: «Но глаза предали ее. И отворились». Одного из персонажей сцены он ударяет, и тот «просто разлетелся как дым».</p>", "r": []}, {"t": "Персонажи и события — кто с ним связан и что там происходило", "a": ["S04", "MN-0024-S04", "MN-0024--personazhi-i-sobytiya"], "h": "<p>В карточке связей указаны: Ведущий, София, Тьма под сценой, Чудики.</p>\n<p><strong>Ведущий</strong> — хозяин места. Имя не названо и является предметом табу. Внешне он ведёт представление торжественно и вежливо («Юная леди. Не соизволите сказать своё имя?», «приятно познакомиться София»), сопровождает это «фирменной улыбкой» и «хищной улыбкой», цокает языком («ТЦ Тц»), срывается в крик, злорадствует, устаёт и разочаровывается. О чудиках отзывается: «эти жалкий, ничтожный опарыши, что бояться даже покаяться».</p>\n<p><strong>София</strong> (в тексте написание плавает: София, Софья, Софий) — девочка из зала, первая крикнувшая о желании услышать историю. Ведущий уступает ей «часть моей сцены» — но только для одного человека, и именно для той, «что предложила мне поведать свою историю». Зрители против, поскольку хотели на сцену сами, но соглашаются.</p>\n<p>Ход событий, как он изложен:</p>\n<ol>\n<li>Ведущий демонстрирует зрителям внутренности клона — «карнавал безумия».</li>\n<li>Ведущий объявляет, что помощники у него уже есть, но уступает место одной зрительнице. София поднимается на сцену; отец «явно горд за то, что именно его дочь идёт на эту сцену», мать «пыталась держать вид строгой матери. Но глаза явно выдавали крик души».</li>\n<li>София, стоя рядом с клоном, замечает, что сходство клона с ведущим «всё меньше. Чем казалось ей».</li>\n<li>Ведущий спрашивает её имя. Затем Софию «резко ударила смелость. Словно это было не она», и она задаёт вопрос, нарушающий табу: «а вас как зовут?» — и тут же хватается за рот. Ведущий делает вид, что не услышал.</li>\n<li>По окрику «выходите!!» пол ломается, из-под него выходят чудики; одного, похожего на ведущего телосложением, ведущий отводит к клону.</li>\n<li>Клон превращается в маску, маска передаётся чудику; тот надевает её, не снимая своей.</li>\n<li>Начинается рассказ ведущего о его родителях. София подсказывает первый вопрос: «а кто ваши родители?» Ответ: «честно они была жалкими людьми. Напыщенными, эгоистичными лицемерами. Жить с подобными было не самым приятным для меня. Если ещё учесть, что отец военный, который всю жизнь провёл на войне». Далее — про метод воспитания: «За любую провинность он лишь бил и бил сильно. Иногда мог придумать и извращённый метод».</li>\n<li>Ведущему не нравится игра актёров: «Да и сам рассказ не имел изюминки. Из-за этого он выглядит скудным и пресным. Этого ведущий не мог допустить». Он срывает маску с чудика; чудик загорается, зрители напрягаются, София отходит.</li>\n<li>Ведущий отправляет горящего чудика вниз. Через открывшийся пол видно тьму и существо в ней.</li>\n<li>София отступает к перилам. Ведущий оказывается у неё за спиной, кладёт руки на плечи и говорит: «София, а ты знала, что твоё имя обозначает мудрость. Но ты почему-то совершаешь так много глупых поступков». Затем успокаивает её и снимает табу задним числом.</li>\n<li>Здесь же София осознаёт зал: улыбающихся зрителей-манекенов и родителей, сидящих истуканами, и у неё возникают вопросы, на которые в тексте ответа нет: «Как мы оказались в этом цирке? », «Что это за цирк? », « Что за сцена? », « Что здесь вообще происходит? ».</li>\n<li>Ведущий спрашивает: «ты же чуствуешь вину?» София отвечает «да», «считая это правильным ответом. Но ошибалась». Ведущий: «что же раз ты чувствуешь вину. То я помогу избавиться от этого чувства», — и накрывает её маской.</li>\n</ol>\n<p>Дальнейшее происходит уже внутри маски. Последовательность сцен:</p>\n<ul>\n<li><strong>Избиение.</strong> София в теле «мальчика. Маленького и избитого», перед ней мужчина лет сорока в военной одежде с ремнём с железной пряжкой. Ведущий поясняет: «отец очень сильно любил бить меня железной пряжкой ремня. Словно находил в этом удовольствия».</li>\n<li><strong>Комната.</strong> София за столом, в комнате всё «ровно разложена». Ведущий: «чтобы избежать побоев отца. Я пытался быть идеальным. Пытался наводить частоту. Хорошо учиться». Затем пьяный мужчина опрокидывает её со стула, бьёт по рёбрам, тащит за волосы по коридору так, что из головы идёт кровь. София вырывается и бежит, но её парализует, а пол становится мягким.</li>\n<li><strong>Река.</strong> София оказывается в речной воде; на берегу — тот же мужчина, весело беседующий с друзьями, «Словно всего того, что он творил и не было». София кричит ему: «Эй тупой мужик. Ты урод!!» Мужчина идёт в воду, София отплывает к центру, попадает в яму и начинает тонуть. Её вытаскивает ведущий, стоящий на воде: «что же ты такая неуклюжея?» На вопрос «для чего всё это?» отвечает: «ты всё поймёшь», — и бросает её вправо, обратно в воду.</li>\n<li><strong>Больничная палата.</strong> Женщина на койке, мужчина у кровати со свёртком в руках и слезами радости, закатный свет. Свёрток начинает кричать, мужчина качает его. У Софии «в груди чтото разрывается, ломается на маленький кусочки», и появляются мысли, которых она сама стыдится: «Я хочу тоже так», «Почуствовать отцовскую любовь». Она пытается не смотреть, но ведущий разворачивает ей голову и говорит: «открой глаза». Диалог: «зачем... К чему это всё?» — «ты правда не понимаешь?» — «ты так и не спешишь оправдать своё имя» — «сколько ещё мне надо показать, чтобы ты всё поняла!» Ведущий бьёт мужчину, тот разлетается дымом, после чего ведущий добавляет: «ну да ладно. В конце вы всё всё равно всё понимаете».</li>\n<li><strong>Трава и кирпич.</strong> Мир пересобирается: мальчик лет пяти лежит без движения на траве, всё портит «яркой красный цвет». София понимает, что кирпич в крови держит она сама, а лежащий мальчик «Был похож, чуть ли не копии мужчины, что бил её». Текст обрывается на её рвоте.</li>\n</ul>\n<p>Кем именно является этот мальчик и чем заканчивается всё для Софии — в окне не сказано, повествование обрывается на этой сцене.</p>", "r": []}, {"t": "Как менялся по версиям — по датам", "a": ["S05", "MN-0024-S05", "MN-0024--kak-menyalsya-po-versiyam"], "h": "<p>Обе зафиксированные версии относятся к одному дню и одному окну; это не переработка задумки, а два последовательных фрагмента текста с перекрытием.</p>\n<p><strong>Версия 1 — 2025-11-21, окно w0111, сообщения 387592–387595.</strong> Задаётся сама сцена и её правила: спрашивание имени ведущего как негласное табу; зрители как «особенные гости», каждому из которых ведущий готов дать шанс, но они его не ценят; наказание за нарушение. Сюда входят клон и его голова-шкатулка, выход чудиков из-под пола, передача маски, начало рассказа о родителях, сожжение чудика, отправка вниз, показ тьмы и существа в ней, разговор ведущего с Софией у перил.</p>\n<p><strong>Версия 2 — 2025-11-21, окно w0111, сообщения 387595–387597.</strong> Начинается с того же сообщения 387595, что и конец версии 1 (текст сообщения повторён полностью и не затирается). Добавляет то, что происходит после наложения маски: зрители и родители Софии, сидящие «как истуканы» с застывшими улыбками, вопрос Софии о том, как они вообще оказались в этом цирке, и дальнейшие сцены — река, больничная палата, трава с кирпичом.</p>\n<p>Изменений задумки между версиями в переписке не зафиксировано: ни одно свойство места не переопределяется и не отменяется. Отклонённых вариантов устройства цирка в окне нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "MN-0024-S06", "MN-0024--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вселенная не определена — в карточке стоит «неясно», привязка ставится только по дате объявления.</li>\n<li>В разделе неясностей самого окна зафиксировано прямо: «Что это за цирк и откуда в нём зрители — в окне не объяснено». Вопросы Софии («Как мы оказались в этом цирке?», «Что это за цирк?», «Что за сцена?») остались без ответа внутри текста и без ответа в переписке.</li>\n<li>Имя ведущего не названо — оно и есть предмет табу.</li>\n<li>Существо в тьме под сценой не названо и не описано, кроме размера и того, что тьма «живёт в нём» (в ведущем). Что именно это значит — в переписке не сказано.</li>\n<li>Свет ниже тьмы, из которого «не на секунду, не утехали» крики, никак не объяснён: чьи это крики и что там происходит, не сказано.</li>\n<li>Происхождение чудиков не объяснено. Под фарфоровой маской у них обычное человеческое лицо; кем они были до цирка, откуда берутся и почему живут под сценой — в переписке нет.</li>\n<li>Что означает «шанс», который ведущий даёт каждому зрителю, и в чём именно зрители его не ценят, не раскрыто; София это тоже не понимает.</li>\n<li>Что должна была понять София («ты всё поймёшь», «В конце вы всё всё равно всё понимаете») — в тексте не сформулировано.</li>\n<li>Кем является мальчик, лежащий на траве в финальной сцене, и чем всё закончилось для Софии, осталось нерешённым: окно обрывается.</li>\n<li>Границы места не заданы: размеры цирка, наличие входа и выхода, что находится за пределами зала — не описаны.</li>\n<li>В навигации указан диапазон 387591–387599, но в теле статьи присутствуют только сообщения 387592–387597; содержание 387591 и 387598–387599 в файле не приведено.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["MN-0024--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-11-21</td>\n<td>387592–387595</td>\n<td>w0111</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-11-21</td>\n<td>387595–387597</td>\n<td>w0111</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/monumenty/MN-0024-cirk-veduschego.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MN-0024--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MN-0024.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["MN-0024-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/MN-0024/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Нет статьи о самом Ведущем — при том что он центр всей сцены. <code>PS-0314</code> («Ведущий») существует в базе как сущность с 74959 знаками материала — больше, чем в статье о самом цирке (29609) — но без единой строки собственной статьи. И это не только его цирк: то же имя и та же фигура держат за собой ещё два места — «Тьма под сценой» (<code>MN-0025</code>) и «Игра на смерть (ведущий с коробкой органов)» (<code>IS-0019</code>). Три разные записи вращаются вокруг персонажа, у которого до сих пор нет собственной карточки.</p>\n<h3>С чего начать</h3>\n<p>База, не архив. Материал уже лежит одним куском под <code>PS-0314</code>; отдельно стоит свериться с уже готовыми статьями <code>MN-0025</code> и <code>IS-0019</code>, где этот же Ведущий действует — это поможет не писать его с нуля, а собрать то, что о нём уже трижды написано в разных местах. По той же причине стоит присмотреться и к Софии (<code>PS-0317</code>, 66652 знаков без статьи) — второй по объёму неучтённый кусок этой сцены.</p>\n<h3>Как развивалось</h3>\n<p>Развития по датам тут нет — обе зафиксированные версии относятся к одному дню и одному окну (2025-11-21, w0111), а «версия 2» технически начинается с того же сообщения, которым обрывается «версия 1». Это не переработка замысла, а прямое продолжение одного текста, ни разу не остановленное для правки.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для чудиков правило наказания названо прямо и с запасом: они знают, что «ведущий может и без причины любого наказать», и видят, что бывает за конкретное нарушение (снятая маска). Для зрителей ведущий вводит параллельное понятие — «особенный гости... каждому из вас я готов дать шанс... но почему-то вы его не цените» — но что стоит за этим шансом и что происходит с теми, кто его не ценит, нигде не проговорено, хотя по интонации это выглядит таким же по строению правилом, только для другой категории участников сцены.</p>\n<h3>Отклик</h3>\n<p>Сильнее всего работает деталь, что тьма под сценой может открыться сама — «чтобы сам ведущий не забывал, что живёт в нём» — потому что это единственное место, где текст намекает, что ведущий и есть то, что прячется внизу, а не просто хозяин цирка. Остальное — маски, клоны, наказания — работает как обычный балаган-ужас, а этот один намёк меняет масштаб происходящего.</p></div>", "r": []}];</script>
