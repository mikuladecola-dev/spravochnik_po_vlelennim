<script>const BASE="";const DOCNAME="Брошенные дети (гоблины)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0039-S01", "GR-0039--chto-eto"], "h": "<p>Вид монстров из вселенной «монстры»: серокожие карлики с длинными когтями на руках и острыми зубами, «одеты как бомжи». Появляются и действуют только группой — в обоих текстах, где они есть, их несколько и они нападают вместе.</p>\n<p>Название придумано не автором как термин, а найдено героем внутри текста. Защитник, выживший после нападения, лежит в больнице и «начал искать информацию о этих карликах в мифологии»: «Ведь сука я был уверен что это не человек, это ебучий гоблины» (2024-08-11, id 217606). Мифологическое объяснение, которое он находит: «Брошенный дети, недоношенный дети которых просто выкидывали их же мамы, они становится злыми духами». Отсюда и оба названия — «брошенные дети» и «гоблины»; в самой сцене нападения они называются только «карлики».</p>\n<p>Что мифология описывает именно этих существ — утверждает герой, и он же оговаривается, что это его догадка: «Вот поэтому они не убили меня, ну точнее я так думаю». Подтверждения со стороны авторов в переписке нет.</p>\n<p>Вся информация о них идёт из двух прозаических текстов Славы (2024-08-11 и 2025-02-12). Отдельного обсуждения этой расы соавторами — вопросов, уточнений, правок — в переписке нет.</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0039-S02", "GR-0039--sostav"], "h": "<p>Поимённо не назван никто. Ни одна особь не получает имени, прозвища или отдельного описания.</p>\n<p>Численность по версиям:</p>\n<ul>\n<li>2024-08-11 (id 217605): число не названо. Указано только, что их много и действуют они скопом — «эти карлики к двери в, котором была моя дочь и жена посеменили всей толпой», «карлики не подходят бояться паскуды».</li>\n<li>2025-02-12 (id 288543): названо точное число — четверо. Первым в окно влетает один, «в это же и соседней окно влетели ещё 3 подобных карлика».</li>\n</ul>", "r": []}, {"t": "Общие способности группы", "a": ["S03", "GR-0039-S03", "GR-0039--obschie-sposobnosti-gruppy"], "h": "<p><strong>Проникновение.</strong> В дом входят через окна, разбивая стекло собственным телом: «неожиданно окно, своим телом разбил сука карлик» (2024-08-11, id 217605). В версии 2025-02-12 используются два окна сразу — то, в которое влетел первый, и соседнее. Полиция после нападения видит картину: «все стекла выбиты, а дверь цела», при этом дверь в комнату, где заперлись жена с дочерью, «расцарапаную и открытую».</p>\n<p><strong>Лазание по потолку.</strong> Удар по затылку прилетает сверху: «как вдруг сверху, ну то бишь как видимо с потолка, дал мне по затылку и я сразу упал» (2024-08-11, id 217605). Формулировка героя оставляет это предположением — он лежит лицом вниз и видел не сам удар, а его источник домыслил.</p>\n<p><strong>Когти и зубы.</strong> «Длинный когти на руках, и острый зубы». Когтями они кромсают: «начали кромсать лицо, грудь и руки, даже глаз мне выкалили».</p>\n<p><strong>Кромсают не убивая.</strong> Отдельно отмеченное свойство: «Но что характерно в шею не одна паскуда мне не поцарапала, словно просто хотели причинить боль не убивая» (2024-08-11, id 217605).</p>\n<p><strong>Потрошение.</strong> Жену Защитника они убивают и потрошат: «в центре комнаты женщина без пол головы, и ещё выпотрошенная. Не одного внутреннего органа не было внутри так и в доме». Органы не остаются на месте и в доме их нет; куда они делись, в тексте не сказано.</p>\n<p><strong>Избирательность целей.</strong> По мифологии, найденной героем (2024-08-11, id 217606): «ненавидят детей который получили заботу от родителей. Также ненавидят и всех женщин, а вот о мужчинах не слово, их всегда выкидывала именно мать». Из этого герой выводит, почему его самого оставили живым.</p>\n<p><strong>Мелкие и быстрые, поодиночке слабые.</strong> В версии 2025-02-12 (id 288543) рассказчик-монстр оценивает их как «ничего из себя не представляющей по отдельности», а одного называет «жалкого, мелкого недороска» и говорит, что Защитник «бы смог бы его без каких либо проблем победить». При этом попасть по ним трудно: «Попасть в таких мелких, быстрых, скучающих крыс не так легко, тем более не умелыми руками».</p>\n<p><strong>Уязвимость.</strong> В версии 2025-02-12 их убивают обычными средствами: одного жена застреливает из пистолета в глаз, одному Защитник ломает череп, придавив головой («что то хрустнула, Да-да это его черепушка треснулась»), третьего добивает выстрелом жена. В версии 2024-08-11 ни одна особь не гибнет.</p>\n<p><strong>Ненаходимость.</strong> «Полиция их искал как мою и дочь но после неудачных попыток, закинул это дело в долгий ящик». Герой полицию не винит: «эти тварь, мифологический тварь, поэтому поймать полиций их конечно невозможно» (2024-08-11, id 217606).</p>", "r": []}, {"t": "Иерархия", "a": ["S04", "GR-0039-S04", "GR-0039--ierarhiya"], "h": "<p>Внутри стаи иерархия не описана: вожака, старшего, отдающего команды нет, действуют они одинаково и одновременно.</p>\n<p>Родство между собой обозначено один раз, в версии 2025-02-12 (id 288543), через реакцию на гибель одного из них: «И сразу всё карлики попытались накинутся на убийцу своего брата ну или сестры». Пол убитого рассказчику неизвестен.</p>\n<p>Внешняя подчинённость оставлена нерешённой прямо в тексте. Там же, когда после карликов в дом влезают двое других существ — «высокий, мускулистый, без одежды и волос, глаза у них были маленькие», — рассказчик-монстр говорит: «Если честно сам не могу сказать кем им приходится карлики. Может они родственники, а может просто подчинённый и слуга». Вопрос так и не решён.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S05", "GR-0039-S05", "GR-0039--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>Защитник (<a href=\"IS-0017.html\">Защитник</a>).</strong> Единственная названная связь и завязка всей его линии. Нападение на его дом лишает его семьи, после чего он год тренируется, покупает ружьё и начинает охоту. Что он собирается с ними сделать, сказано прямо: «а так если я их найду то явно сделаю с ними довольно болезненный вещи» (2024-08-11, id 217606). В версии 2024 года он их так и не находит — «ведь я так не смог найти не одного чудовища, ни монстра ни чево» — и вместо них выходит на Беркута.</p>\n<p><strong>Беркут.</strong> Прямой связи нет. Беркут — другой монстр, на которого Защитник переключается, потеряв след карликов; в тексте они между собой никак не соотнесены.</p>\n<p><strong>Полиция.</strong> Дело о нападении заведено и закрыто, ловить их полиция неспособна (см. выше).</p>\n<p><strong>Двое высоких тварей</strong> (только версия 2025-02-12). Приходят в дом вторыми, после карликов, и заканчивают то, что карлики не смогли: заламывают Защитника и ослепляют его жену когтями. Родство или подчинение между ними и карликами не установлено — см. «Иерархия».</p>", "r": [["Защитник", "IS-0017.html"]]}, {"t": "Как менялась — по датам", "a": ["S06", "GR-0039-S06", "GR-0039--kak-menyalas"], "h": "<p><strong>2024-08-11, id 217605–217606 (текст «Я защитник», <a href=\"PR-0023.html\">Я защитник</a>).</strong> Первое и самое подробное появление. Стая неопределённой численности врывается через окно за ужином. Защитник отбивается тарелкой супа и стулом, они не подходят, потом получает удар с потолка. Он хватает одного за ногу и «начал долбить его по лицу», после чего остальные набрасываются и кромсают его, не трогая шею. Итог нападения: жена убита и выпотрошена, дочь исчезла — «Следователь сказал что её не было в доме и в окраинах», сам он изувечен, с выколотым глазом и шрамами на лице. Ни один карлик не убит. Здесь же вводится мифология брошенных и недоношенных детей.</p>\n<p>Внутри этой же версии зафиксировано сомнение самого героя в том, что нападавшие вообще были монстрами: «я уже начал думать, что может я глюк словил и на самом деле на нас напали не брошенный дети, а обычные люди».</p>\n<p><strong>2025-02-11, id 288410–288416.</strong> Слава объявляет: «Хочу исправить историю защитника слегка переписать Защитника оригинального». Миколай уточняет форму — «типа тот же сюжет но в более качественной форме и поправками или чисто оформленные поправки?». Ответ: «Не знаю пока точно». Формы переработки на этот момент нет.</p>\n<p><strong>2025-02-12, id 288543–288545 (переписанная история, подана от лица монстра-рассказчика).</strong> Нападение переписано целиком, старая версия при этом не отменяется, а существует рядом.</p>\n<p>Что изменилось:</p>\n<ul>\n<li>Место — не дом, где семья живёт, а частный домик, куда они приехали отдохнуть; за столом играют в настольную игру.</li>\n<li>Численность названа: четверо.</li>\n<li>Жена не убегает, а выходит с пистолетом и стреляет. Трое карликов гибнут: один от её выстрела в глаз, один с проломленным черепом, третьего она застреливает.</li>\n<li>Выживший четвёртый вбегает в комнату к дочери и убивает её — «видео выпотрошеную дочь». В версии 2024 года дочь пропадала, и герой был уверен, что она жива.</li>\n<li>Появляются двое высоких безволосых тварей, которых в версии 2024 года не было. Они заламывают Защитника и лишают жену зрения, проведя когтями по лицу. Жена в этой версии остаётся жива и слепа.</li>\n<li>Слово «гоблины» не звучит. Мифология брошенных детей в этой версии не приводится вовсе; вместо неё дальше по тексту работает объяснение через чужемирцев и другие миры.</li>\n<li>Появляется оценка карликов «снаружи», глазами другого монстра: «Даже в сравнение со мной это существо вообще нижая».</li>\n</ul>\n<p><strong>Позже 2025-03.</strong> В текстах о Защитнике нападавшие упоминаются только обобщённо — «те твари, который когда-то уничтожили его семью» (2025-03-19, id 305855). Названия «брошенные дети», «гоблины», «карлики» больше не используются, отдельного описания вида нет. К этому моменту в тексте мертвы обе — и жена, и дочь: их тела Защитник вытаскивает из речки (2025-03-19, id 305855) и хоронит в лесу в двух могилах (2025-03-14, id 302378).</p>", "r": [["Я защитник", "PR-0023.html"]]}, {"t": "Пробелы", "a": ["S07", "GR-0039-S07", "GR-0039--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет: ни один из них не назван и не выделен.</li>\n<li>Численность в версии 2024-08-11 не названа — только «всей толпой».</li>\n<li>Различий между отдельными особями не проводится нигде: внешне и по поведению они описаны как одинаковые.</li>\n<li>Иерархия внутри стаи не описана, вожак или командующий не назван.</li>\n<li>Кто ими руководит и руководит ли кто-то — в переписке не сказано. Связь карликов с двумя высокими тварями оставлена нерешённой самим текстом: «Может они родственники, а может просто подчинённый и слуга».</li>\n<li>Верна ли найденная героем мифология в мире — не подтверждено. Это версия персонажа со ссылкой на «мифологию», сопровождённая оговоркой «ну точнее я так думаю».</li>\n<li>Зачем в версии 2024 года унесли дочь и что с ней стало — не сказано. Она числится пропавшей, герой убеждён, что она жива; сама её судьба в этой версии не раскрыта.</li>\n<li>Куда делись внутренние органы убитой жены — не сказано, только то, что в доме их нет.</li>\n<li>Откуда именно они пришли, где живут, сколько их всего — не сказано.</li>\n<li>Судьба стаи после нападения не решена. В версии 2024 года Защитник их не находит; в версии 2025-02-12 трое из четверых убиты на месте, а что стало с четвёртым и с остальными — не сказано.</li>\n<li>Обсуждения этой расы соавторами в переписке нет. Миколай на неё нигде не отвечает и её не правит; всё, что о ней известно, содержится внутри прозаических текстов Славы.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0039--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает истории:</strong> <a href=\"IS-0017.html\">Защитник</a></li>\n<li><strong>Упоминает прозу:</strong> <a href=\"PR-0023.html\">Я защитник</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0039--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0039.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0039-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0039/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первое — двое высоких безволосых тварей из версии 2025-02-12. Записи о них нет вообще: ни статьи, ни строки в базе, ни идентификатора. При этом они держат единственный нерешённый вопрос иерархии в этой статье — «может они родственники, а может просто подчинённый и слуга» — и доделывают в сцене то, чего не смогли карлики. Дыра дорогая не сама по себе, а по тому, к чему прицеплена: вся сцена входит в <code>IS-0017</code> («Защитник») — восемь входящих ссылок, 139 КБ базы, пять вселенных, самый нагруженный узел во всём справочнике рядом с этой статьёй. Кто на кого нападал в завязке этой линии, не сведено.</p>\n<p>Второе — материал по второй версии нападения лежит не там, где статья. <code>PR-0049</code> («История защитника (переписанная)») — 22,7 КБ базы и ноль входящих ссылок; <code>PS-0196</code> («Семья Защитника (жена и дочь)») — 37,6 КБ и тоже ноль входящих; <code>PS-0197</code> («Рассказчик-монстр») — 26,6 КБ. Все три отнесены к вселенной «Апостол», тогда как <code>GR-0039</code> и <code>PR-0023</code> (15,3 КБ) стоят в «монстрах». Восемьдесят с лишним килобайт про то же нападение висят под другой вселенной и ни с чем не связаны, а статья ссылается только на <code>PR-0023</code>.</p>\n<p>Третье, помельче: сама раса заведена дважды — <code>PS-0136</code> (персонаж, 15,7 КБ базы, две входящие ссылки) и <code>GR-0039</code> (группа, база 0, ноль ссылок). Весь материал и обе ссылки ушли в запись под видом персонажа.</p>\n<h3>С чего начать</h3>\n<p>В базу, и там почти всё лежит готовым. Начать с <code>PR-0049</code> и <code>PS-0196</code>: обе записи сиротские (ноль входящих), обе про ту же сцену, и <code>PS-0196</code> уходит дальше статьи по материалу — статья цитирует <code>288543</code>–<code>288545</code>, а в записи о семье продолжение идёт до <code>288563</code>–<code>288565</code>. Именно там, скорее всего, лежит то, что статья числит нерешённым: что стало с четвёртым карликом и чем кончилась сцена. Следом <code>PS-0197</code> — оценка карликов «снаружи», глазами другого монстра, тоже уже расписана.</p>\n<p>Второй заход по базе — вопрос «верна ли найденная героем мифология». Ответ на него, возможно, не в архиве, а в соседних записях мира: <code>MR-0051</code> («Материализация монстров из желаний и веры», две ссылки, 14,4 КБ) и <code>MR-0052</code> («Монстры и вера», 13,3 КБ). Стыкуется ли найденный героем миф с тем, как в этом мире вообще заводятся монстры, — проверяется сверкой этих двух записей с текстом, без похода в архив. Копилка <code>MR-0157</code> («Монстры из мифологии», 7 КБ, статьи нет, вселенная «неясно») — туда же, третьим шагом.</p>\n<p>В архив — за формой переработки. Ориентир: 2025-02-11, <code>288410</code>–<code>288416</code>, где Слава объявил «Хочу исправить историю защитника», Миколай спросил, будет ли это тот же сюжет в лучшей форме или только поправки, и ответ был «Не знаю пока точно». Смотреть надо остаток февраля 2025: определились ли позже, отменяет ли версия 2025-02-12 версию 2024-08-11 или обе стоят рядом. От этого зависит, одна раса тут описана или две редакции одной.</p>\n<h3>Как развивалось</h3>\n<p>Заявили 2024-08-11 внутри прозы, и сразу с объяснением: внешность, повадки, мифология брошенных и недоношенных детей, правило избирательности и вывод, почему герой жив. В том же тексте и сами усомнились: «может я глюк словил и на самом деле на нас напали не брошенный дети, а обычные люди». Полгода тишины. 2025-02-11 объявили переписывание, формы не назвали. 2025-02-12 переписали: появилось точное число, появились смерти — трое из четверых убиты обычным пистолетом и головой, — появились двое высоких тварей, которых раньше не было, и исчезла мифология вместе со словом «гоблины». После 2025-03 названий не осталось вовсе: «те твари, который когда-то уничтожили его семью». Обсуждения расы соавторами нет ни в одной из точек — всё, что есть, лежит внутри прозы одного автора.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>В версии 2024 года правило избирательности названо прямо: ненавидят детей, получивших заботу, и всех женщин, а «о мужчинах не слово, их всегда выкидывала именно мать». Из него выведено, почему герою кромсали лицо, грудь и руки, но не тронули шею. В версии 2025-02-12 исход обратный: дочь убита, а женщина оставлена в живых — ослеплённой. Правила того же рода для этого исхода не названо, старое при этом не отменено, обе версии стоят рядом. Для первого нападения объяснено, кого и почему не убивают; для второго — нет.</p>\n<h3>Отклик</h3>\n<p>Держит одна деталь: «Но что характерно в шею не одна паскуда мне не поцарапала, словно просто хотели причинить боль не убивая». Не пощада и не милосердие — правило, которого сами твари, похоже, не выбирают. Оно страшнее прямого убийства, потому что превращает выжившего в оставленного, и вся линия Защитника растёт именно отсюда. Хорошо и то, что название расы не выдал автор, а нашёл персонаж — лёжа в больнице, гугля мифологию, с честной оговоркой «ну точнее я так думаю»: мир не объясняет себя сам, объясняет искалеченный человек, и объяснение может быть неверным. Отдельно любопытна переписанная версия: та же сцена с точки зрения другого монстра, для которого эти карлики — «нижая», мелочь, которую он не считает ровней. Смена оптики сделана без пояснений и работает. Жаль другого: во второй версии из текста ушла мифология, то есть ровно то, на чём держалась первая, — и нигде не сказано, потеряли её или отменили.</p></div>", "r": []}];</script>
