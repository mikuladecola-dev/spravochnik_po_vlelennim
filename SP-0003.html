<script>const BASE="";const DOCNAME="Слизь";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0003-S01", "SP-0003--mehanika"], "h": "<p>Слизь описана одной длинной репликой (2023-02-22, id 34303), и почти всё, что про неё известно, содержится в ней.</p>\n<p>Основа: слизь, «которая ест всякую дрянь и приобретает её свойства». Пищей может быть что угодно, включая людей, и от съеденного слизь получает его свойства. С людьми это работает как присвоение способностей: злодей «давал даже людей есть такой слизи и она брала бы их способности».</p>\n<p>Дальше перечислены свойства самой слизи:</p>\n<ul>\n<li><strong>Размножение и слияние.</strong> Слизь «плодилась и объединилась в одну большую» — сначала множество, потом одно крупное существо.</li>\n<li><strong>Превращение в человека.</strong> «могла превратиться в человека».</li>\n<li><strong>Набор опыта в бою.</strong> «при сражении получала много опыта».</li>\n<li><strong>Отсутствие усталости.</strong> «и так как слизь, не уставала» — неутомимость выведена прямо из того, что она слизь.</li>\n</ul>\n<p>Поведение в бою: «в бою с гг она пыталась бы хавать всякое» (id 34305) — то есть поедание работает не только как способ выращивания, но и как боевой приём прямо во время схватки.</p>\n<p>Слизь названа заимствованием: «сейчас же популярна слизь в аниме у гг, которая ест всякую дрянь и приобретает её свойства» (id 34303). То есть источник обозначен как популярный аниме-приём, и переносится он с изменением роли — в аниме такая слизь у главного героя, здесь она отдана злодею.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0003-S02", "SP-0003--ogranicheniya-i-cena"], "h": "<p>Ограничений у слизи в переписке не названо. Цена за её использование тоже не названа.</p>\n<p>Единственное, что задано как ограничение вокруг неё, — ограничение чужой способности: у слизи в бою нельзя украсть способности, потому что кража (<a href=\"SP-0002.html\">Кража способностей</a>) работает только у людей (id 34310–34311). То есть слизь описана скорее как то, обо что ломается механика противника.</p>\n<p>Отдельно названа усилительная линия, а не ограничительная: «злодей ей отправлял бы разные наркотики для улучшения» (id 34305). Что именно улучшают наркотики и есть ли от них отдача, не сказано.</p>", "r": [["Кража способностей", "SP-0002.html"]]}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0003-S03", "SP-0003--nositeli"], "h": "<p><strong>Главный злодей (слизевик).</strong> Слизь принадлежит ему, но не как личная способность в обычном смысле: он с её помощью «устраивал бы эксперименты», кормит её людьми и подкидывает ей наркотики во время боя (id 34303, 34305). Слизь при этом описана как отдельное существо со своим поведением — ест, плодится, объединяется, превращается, набирается опыта. Где проходит граница между злодеем и слизью — он ею управляет извне или он сам и есть эта слизь — в переписке не разграничено.</p>\n<p>Из соседнего разговора известно, что противник главного героя «жутко восстанавливается» после разрывания на куски (id 34289); отнесено ли это восстановление к слизи, прямо не сказано.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0003-S04", "SP-0003--kak-menyalas-po-versiyam"], "h": "<p>Вся разработка укладывается в несколько минут одного дня, 2023-02-22, окно w0010.</p>\n<p><strong>Версия 1, 15:03 (id 34300–34307).</strong> Полное описание одной репликой (id 34303): поедание с присвоением свойств, эксперименты злодея, скармливание людей и забор их способностей, размножение, слияние в одну большую, превращение в человека, набор опыта в бою, неутомимость. Реакция Славы — «😍» (id 34304) и «Прикольно» (id 34306), после чего он переводит разговор на героя: «А у гг какая способность?» (id 34307).</p>\n<p><strong>Версия 2, 15:05 (id 34303–34310).</strong> Добавлено поведение в бою и внешняя подпитка: слизь пытается есть всё подряд прямо в схватке с героем, злодей отправляет ей наркотики для улучшения (id 34305). Дальше в этом же куске появляется способность героя — кража способностей у людей (id 34308, 34310), и слизь оказывается тем, против чего эта кража не работает.</p>\n<p>Правок и отказов внутри разработки слизи нет: описание только дополнялось.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0003-S05", "SP-0003--svyaz-s-drugimi-sposobnostyami"], "h": "<p><strong>Кража способностей (<a href=\"SP-0002.html\">Кража способностей</a>).</strong> Парная способность на другой стороне конфликта — у главного героя. Обе присваивают чужие способности, но разными путями: кража берёт у людей напрямую, слизь получает через поедание, и берёт при этом не только способности, но и свойства всего съеденного вообще. Связь заявлена как прямое ограничение: «Если он может красть у людей, то у слизи в бою красть их не получится» (id 34311).</p>\n<p>Обе способности появились в одном разговоре в течение получаса, и вторая формулировалась уже с оглядкой на первую.</p>", "r": [["Кража способностей", "SP-0002.html"]]}, {"t": "Пробелы", "a": ["S06", "SP-0003-S06", "SP-0003--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вселенная не объявлена.</li>\n<li>Не сказано, сколько свойств слизь может держать одновременно и теряются ли они со временем.</li>\n<li>Не сказано, надолго ли превращение в человека, в кого именно она превращается и отличима ли она в этом виде.</li>\n<li>Не сказано, во что переходит «много опыта», получаемого в сражении: в силу, в размер, в новые свойства.</li>\n<li>Не назван состав наркотиков и не сказано, что именно они улучшают.</li>\n<li>Не разграничены злодей и слизь: неясно, управляет он ею или является ею.</li>\n<li>Не сказано, есть ли у слизи собственная воля и понимает ли она команды.</li>\n<li>Не сказано, можно ли её убить и что для этого нужно.</li>\n<li>Имена не даны: персонажи остаются «гг» и «злодей».</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0003--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0002.html\">Кража способностей</a></li>\n<li><strong>Упомянут в способностях:</strong> <a href=\"SP-0002.html\">Кража способностей</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0003--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2023-02-22</td>\n<td>34300–34307</td>\n<td>w0010</td>\n<td>неясно (не определено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2023-02-22</td>\n<td>34303–34310</td>\n<td>w0010</td>\n<td>неясно (не определено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0003-sliz.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0003--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0003.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
