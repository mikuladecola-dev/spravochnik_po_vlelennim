<script>const BASE="";const DOCNAME="Лихтспид";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0057-S01", "PS-0057--proishozhdenie"], "h": "<p>Лихтспид разработан целиком за один вечер 2024-04-06 (окно w0030, сообщения 154436–154484), вселенная — «игра бога».</p>\n<p>Отправная точка — реплика Славы про элемент: «Ну или элемент то бишь огонь молния» (154436). Первое предложение Миколая было другим (блуждающий огонь, см. ниже); после правки Славы персонаж стал чисто электрическим и скоростным.</p>\n<p>Итоговое описание Миколай получил через нейросеть и выложил в чат целиком: «Вот всё что я смог выцепить у нейронки пока она не крашнулась» (154458), затем «Тут я написал крч и описание и способности и трюки» (154472). Слава на текст: «Ну оно даёт почву для размышления» (154460).</p>\n<p>Лихтспид — не единственная особь, а представитель вида: в описании говорится о лихтспидах во множественном числе, с общей планетой, языком и образом жизни.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0057-S02", "PS-0057--vneshnost"], "h": "<p>Из карточки (154459):</p>\n<ul>\n<li>«стройный гуманоид с полностью черным телом, покрытым светящимся узором в виде фигур Лихтенберга»;</li>\n<li>тело гибкое и приспособлено для быстрого передвижения;</li>\n<li>может менять форму тела, делая его более обтекаемым для уменьшения сопротивления воздуха;</li>\n<li>может сжиматься до очень малых размеров.</li>\n</ul>\n<p>Вариант имени, под которым персонаж фигурирует, — «быстрый с узорами молний».</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0057-S03", "PS-0057--harakter"], "h": "<p>Отдельного характера конкретной особи в переписке нет — описаны свойства вида. Лихтспиды разумны, обладают быстрым метаболизмом, «постоянно находятся в движении и любят скорость». Их язык — «серия очень быстрых щелчков и треском, напоминающих электрические разряды». В карточке они названы «дети скорости и энергии, воплощение динамики и силы».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0057-S04", "PS-0057--sposobnosti"], "h": "<p><strong>Основа.</strong> «Главная особенность Лихтспидов - их невероятная скорость. Они могут резко менять упругость своего тела, что позволяет им совершать молниеносные рывки и маневры. В естественной среде они используют это для охоты и избегания опасностей» (154459).</p>\n<p>Также лихтспиды «способны заряжать окружающую среду узорами Лихтенберга», то есть «рисовать» электричеством.</p>\n<p><strong>Атаки:</strong></p>\n<ul>\n<li><em>Шторм Лихтенберга</em> — вокруг себя создаётся электрическая буря с хаотичными разрядами в виде узоров, поражающая всех врагов в радиусе действия.</li>\n<li><em>Резонансный взрыв</em> — «Лихтспид щекочет атомы цели на их резонансной частоте, вызывая мощный взрыв изнутри»; в исходной формулировке — способный уничтожить даже крупных и хорошо защищённых противников.</li>\n<li><em>Молния Лихтенберга</em> — разряды фокусируются в направленный луч; наносит урон и временно парализует цель.</li>\n<li><em>ЭМИ-импульс</em> — электромагнитный импульс, выводящий из строя электронику и механизмы в большом радиусе.</li>\n</ul>\n<p>Названа и связка: ослепить врагов вспышкой, поразить Штормом Лихтенберга, добить парализованных Резонансным взрывом.</p>\n<p><strong>Трюки (от смены упругости тела):</strong></p>\n<ul>\n<li><em>Молниеносный рывок</em> — резкая смена упругости мышц, многократное увеличение их силы, бросок в любом направлении; со стороны выглядит как мгновенное исчезновение и появление в другом месте с электрическим треском.</li>\n<li><em>Грозовой прыжок</em> — накопление энергии сжатием «подобно пружине» и резкое высвобождение, взлёт на большую высоту; в верхней точке иногда создаёт электрические узоры, зависая на мгновение.</li>\n<li>Сжатие до очень малых размеров, чтобы протискиваться сквозь щели и отверстия.</li>\n<li>Отталкивание от стен, потолка и других поверхностей — «его тело при этом работает как идеальный упругий мяч».</li>\n<li>Смена формы тела на обтекаемую в сочетании с электрической тягой ради предельной скорости.</li>\n</ul>\n<p><strong>Ослабление резонанса.</strong> Слава: «Да же какой то через чур инбаласный / Щекотать атомы» (154473). Миколай пояснил, что щекотание атомов придумал он, но нейросеть поняла это не так: «Я имел ввиду именно молния создаётся в атмосфере из-за того что атомы щекочат / Я так это понимаю / А тут он придумал делать резонанс» (154476–154478), и предложил: «Это прикольно но для баланса можно убрать или ослабить» (154479). Слава выбрал ослабление: «Ну можно что бы на людей он действовал слабей и если противник сильный то ещё слабее» (154480). Миколай добавил: «И врд на дистанции он атаки делает» (154482). После этого Слава оценил персонажа: «А так самый лучший» (154483).</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0057-S05", "PS-0057--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Щекотание атомов</strong> — механика, лежащая под электрическими способностями. По Миколаю, изначально означала природу молнии («молния создаётся в атмосфере из-за того что атомы щекочат»), у нейросети превратилась в резонансную атаку.</li>\n<li>В карточке базы Лихтспид числится связанным с <strong>Торфолихтом</strong> и <strong>многоликим</strong>, но в приведённых кусках переписки эти связи не проговорены.</li>\n</ul>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0057-S06", "PS-0057--kak-menyalsya"], "h": "<p><strong>2024-04-06, id 154436–154450 — досостояние (отклонено).</strong> Первый вариант Миколая: «Его способность создавать и управлять блуждающим огнём» (154440), «Но он умеет поглощать молнию и заряжать эти огни» (154441). Слава отклонил в пользу чистой молнии: «Не лучше наверное чисто молния / Наверное будет типо Флэша» (154442–154443), с обоснованием от изображений: «Типо посмотри на его изображения / Сразу видно бегун» (154445–154446). Реплики Славы «Нееееееет / Верни старого» (154449–154450) в переписке не поясняются — к чему именно относится «старый», из текста не следует.</p>\n<p><strong>2024-04-06, id 154457–154472 — карточка Лихтспида.</strong> Миколай объявляет прежнее описание неактуальным («Тогда все это описание не актуально», 154457) и выкладывает полученный от нейросети текст: внешность, планета с постоянными электрическими разрядами, язык из щелчков и треска, быстрый метаболизм, механика смены упругости тела, четыре атаки (Шторм Лихтенберга, Резонансный взрыв, Молния Лихтенберга, ЭМИ-импульс) и трюки (Молниеносный рывок, Грозовой прыжок, сжатие, отталкивание от поверхностей, обтекаемая форма).</p>\n<p><strong>2024-04-06, id 154473–154484 — правка баланса.</strong> Резонансный взрыв признан имбовым и ослаблен: слабее действует на людей и ещё слабее на сильного противника; атаки, вероятно, наносятся на дистанции. Слава относит персонажа к одобренным: «А так самый лучший».</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0057-S07", "PS-0057--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имени или отдельной биографии конкретной особи нет — описан вид.</li>\n<li>Планета лихтспидов названа только по признаку («планета с уникальной атмосферой, в которой постоянно происходят электрические разряды»), собственного названия у неё в переписке нет.</li>\n<li>Как Лихтспид попал в «игру бога», с кем взаимодействует и на чьей стороне — не сказано.</li>\n<li>Связи с Торфолихтом и многоликим, отмеченные в карточке базы, в приведённых кусках переписки не раскрыты.</li>\n<li>Ослабление резонансного взрыва принято на словах, числовых или более точных рамок не задано; «И врд на дистанции он атаки делает» осталось предположением без подтверждения.</li>\n<li>К чему относится «Верни старого» (154450), из переписки не следует.</li>\n<li>Слабостей и цены за использование способностей не обсуждали.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0057--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0014.html\">игра бога</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0057--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-04-06</td>\n<td>154436–154450</td>\n<td>w0030</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-04-06</td>\n<td>154457–154472</td>\n<td>w0030</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-04-06</td>\n<td>154473–154484</td>\n<td>w0030</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0057-lihtspid.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0057--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0057.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
