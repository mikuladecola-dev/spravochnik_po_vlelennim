<script>const BASE="";const DOCNAME="Голод упыря";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0208-S01", "SP-0208--mehanika"], "h": "<p>Первый из двух названных минусов упыря (2025-03-19, id 305854–305855, окно w0083). В базе способность проходит под именем «Голод упыря», в самой переписке названа одним словом: «Каннибализм».</p>\n<p>Устройство минуса рассказчик-упырь описывает так: «У них невероятный голод. Подобно... Не знаю с кем подобно. Это просто был голод, который не как не удовлетворить, что бы они не ели». Обычная еда голод не гасит вообще — никакое количество и никакой род пищи.</p>\n<p>Единственное, что работает, — человечина: «Но если они съедят человечину. Этот бесконечный голод утихнет. И они смогут стать счастливы».</p>\n<p>Отдельно оговорено расширение списка съедобного: пераги тоже годятся, потому что пераги — это люди. Формулировка дословно: «Ведь пераги это люди. Их можно есть. Жувать. Глотать». Эта оговорка подана как то, что делало бы жизнь упыря в принципе выносимой, будь голод единственным минусом: «Это не единственный минус. Будь-то он один. То можно было жить».</p>\n<p>Голод — минус, идущий в комплекте с живучестью упыря. Живучесть в том же сообщении описана перечислением: «Ты можешь скинуть его с небоскреба. Но он выживет. Ты можешь подорвать его или жечь. Он выживет. Ты можешь продырявить ему черепушки, что аж мозги будут видно. Но он выживет. Ты можешь выпотрошить или утопить его. Но он выживет. И так я могу перечислять до бесконечности». При этом «Упырь не владеет, какой-то сверхчеловеческой силой или скоростью. Он просто живучий и всё».</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0208-S02", "SP-0208--ogranicheniya-i-cena"], "h": "<p>Голод сам по себе и есть цена живучести — он подан именно как «минус», а не как способность в пользу носителя.</p>\n<p>Второй минус упыря, названный рядом с голодом, но отдельно от него: потеря себя. «Второй минус. В том что мы теряли своей собственной \"я\". Деградируя». Возврат «я» возможен, но не окончателен: «Нет кому-то удавалось вернуть своей \" Я\". А кому-то даже продержатся 3 года. Но по итогу всегда всё заканчивалась тем, что они теряли снова или первый раз. Без разницы. Они всë равно теряли своей \"я\"». Прямой причинной связи между тем, ест упырь человечину или нет, и тем, теряет он «я» или нет, в переписке не проведено — два минуса перечислены как два отдельных.</p>\n<p>Никакого механизма насыщения — сколько человечины нужно, на какой срок утихает голод, наступает ли откат — не описано.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0208-S03", "SP-0208--nositeli"], "h": "<p>Упыри. Появились среди выживших после катастрофы: «После катастрофы. Среди выживших начали появляется упыри. Это где-то 30-40 процентов выживших стали упырями». Определение дано короткое: «Это не люди, которых тяжело убить».</p>\n<p>Рассказчик сообщения — упырь, и он оговаривает себя как исключение по второму минусу, а не по голоду: «Я упырь. Но нет. Я не терял своей \" Я\". Почему же? Потому-что у меня была цель. Я должен был защитить тех 38 людей». Из этих 38 за 6 лет умерли 19 — «Половина».</p>\n<p>Тот же рассказчик надел собранный шестью учёными экзоскелет, который «Обычный человек его никогда в жизни не сможет одеть»: чтобы его надеть, «Нужно было отрезать несколько конечности. Вырвать органы и продырявить череп». Он отказался от обезболивающего — «Я же всё равно не умру от боли. Оставьте лучше для людей» — и терпел четырнадцать дней. Про то, как экзоскелет и операция сказались на голоде, не сказано ничего; связь идёт через живучесть упыря, не через голод.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0208-S04", "SP-0208--kak-menyalas-po-versiyam"], "h": "<p>Версия одна, 2025-03-19 (id 305854–305855, окно w0083). Голод введён сразу в готовом виде: неутолимость, человечина как единственное, что помогает, и отдельная оговорка про перагов как допустимую пищу. Переработок и более поздних состояний в базе нет.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0208-S05", "SP-0208--svyaz-s-drugimi-sposobnostyami"], "h": "<ul>\n<li>Живучесть упыря — голод назван «минусом» именно этого вида и перечислен сразу после списка того, что упыря не убивает. В базе способность помечена как «часть чего: Упыри».</li>\n<li>Пераги — связь через пищу: перагов можно есть, потому что они люди. Пераги здесь описаны как «люди, который обрастают белыми перьями. Словно они состоят из чистого серебра», похожие на ангелов, но по существу «чудища», у которых «главная цель убить всё разумной на планете Земля», и заражённых приходится «23 заражённых на одного человека».</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S06", "SP-0208-S06", "SP-0208--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Происхождение упырей и, соответственно, голода осталось нерешённым в самой переписке: «От чего вообще взялись упыри. Это заража из рая. Или это попытка правителя спасти людей. Не знаю». Оба варианта названы предположениями, выбор между ними не сделан.</li>\n<li>Не сказано, что происходит с упырём, который человечину не ест вовсе, — умирает ли он, слабеет, быстрее теряет «я».</li>\n<li>Не сказано, сколько нужно съесть и насколько надолго голод утихает.</li>\n<li>Не сказано, годится ли в пищу мясо других упырей.</li>\n<li>Не сказано, есть ли у голода внешние проявления — по описанию упыри опознаются не по виду, а по живучести.</li>\n<li>Связь между голодом и потерей «я» не проговорена: минусы названы первым и вторым, но не связаны друг с другом.</li>\n<li>«Стать счастливы» после человечины — состояние, о длительности и последствиях которого ничего не сказано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0208--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0021.html\">Упыри</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0208--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-03-19</td>\n<td>305854–305855</td>\n<td>w0083</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0208-golod-upyrya.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0208--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0208.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["SP-0208-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/SP-0208/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Мир, в котором всё это происходит. Он не назван нигде: рассказчик — «житель одного технологического развитого мира», и отдельной сущности под него нет ни в справочнике, ни в базе. Ближайшее — <code>MR-0123</code> «Раскол солнца» (статья есть, 18 152 базы), и на неё ссылок ноль, при том что текстом на катастрофу опираются как минимум восемь статей: эта, <code>SP-0207</code> Живучесть упыря (15 808), <code>SP-0209</code> Потеря «я» (15 890), <code>SP-0210</code> Экзоскелет (16 871), <code>PS-0231</code> Упыри (17 407), <code>PS-0232</code> Упырь-рассказчик (35 190), <code>PS-0199</code> Пераг (44 124), <code>PS-0233</code> Ангел (28 551). Около полутораста тысяч знаков висит на записи, к которой не проведено ни одной нитки. Про эту статью конкретно: «После катастрофы. Среди выживших начали появляется упыри» — первая же фраза раздела о носителях указывает туда, куда указателя нет.</p>\n<p>Вторая дыра дешевле, но она ровно про голод. <code>MN-0017</code> «Элитный ресторан с человечиной» — статья есть, 17 799 базы, ссылок ноль, та же вселенная, 2025-03-13, шестью днями раньше. Это единственная другая запись во всём наборе, где человечина работает как механика, а не как слово. Связаны эти два куска или нет, в переписке не сказано — но проверить это дешевле, чем что-либо ещё в узле, и делать это надо до того, как кто-то напишет третью статью про поедание людей.</p>\n<h3>С чего начать</h3>\n<p>В базе. Чужая реакция на голод существует, но лежит не здесь: <code>PS-0231</code>, версия 2, 2025-03-20, id 306134–306147 — Миколай читает монолог и отвечает «круто быть упырём», а следом даёт единственное сравнение, которое во всей переписке относится к каннибализму: «подобно Гулям из токийского гуля». В статье про голод этого нет, хотя реплика ровно про него.</p>\n<p>Дословный монолог целиком — <code>PR-0061</code> (34 415), одно сообщение 305854–305855. Оговорка про перагов как пищу разобрана с другой стороны в <code>PS-0199</code> (44 124), версия 5 — там те же id, но пераги описаны как вторая волна катастрофы с коэффициентом 23 к 1. Оба куска — из одного сообщения, и вопрос «можно ли есть заражённых, которых в 23 раза больше, чем людей» ни в одной из двух статей не задан, хотя обе половины лежат рядом.</p>\n<p>В архив — за одним: продолжалось ли обсуждение голода 2025-03-20. Окно w0083, id 306119–306147, читать целиком: там второй заход по всему кластеру, и по цифрам катастрофы, и по экзоскелету, и по упырям. Если про еду там что-то есть, оно в этом промежутке; если нет — тема закрыта одним сообщением и это надо зафиксировать, а не искать дальше.</p>\n<h3>Как развивалось</h3>\n<p>2025-03-19 — введён сразу целиком, без разгона и внутри художественного текста: неутолимость, человечина как единственное средство, пераги как расширение списка, и всё это в одном перечне с живучестью, потерей «я», экзоскелетом и катастрофой. Обсуждения до текста не было. 2025-03-20 — соседи по кластеру получили второй заход при чтении: по <code>MR-0123</code> разбирали цифры («чет вычисления странные»), по <code>SP-0210</code> объясняли, откуда экзоскелет («У них же более развитый мир»), по <code>PS-0231</code> шло сравнение с гулями. Голод второго захода не получил: его диапазон дат так и остался одним днём. Дальше не возвращались.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Исключение. Минусов названо два, и для второго — потери «я» — оговорено, что его можно держать, и чем именно: «Я упырь. Но нет. Я не терял своей \" Я\". Почему же? Потому-что у меня была цель. Я должен был защитить тех 38 людей». Там же дана и мера, на сколько этого хватает другим: «А кому-то даже продержатся 3 года». То есть для одного минуса сказано, что он не абсолютен, названо условие обхода и назван срок. Для первого, стоящего в том же перечне и подписанного как «невероятный голод», ничего того же рода нет: не сказано ни что бывает с упырём, который не ест, ни что кто-то держался, ни сколько. Рассказчик выносит себя за скобки по второму минусу и молчит про первый.</p>\n<h3>Отклик</h3>\n<p>Сильнее всего работает не сам голод, а как он взвешен. «Это не единственный минус. Будь-то он один. То можно было жить» — то есть каннибализм здесь уже пройденная стадия, терпимая часть сделки, и невыносимое начинается дальше. Автор не пугает поеданием людей, он его обесценивает, чтобы освободить место для настоящего ужаса, и это честнее любого нагнетания. Вторая вещь — «Ведь пераги это люди. Их можно есть. Жувать. Глотать»: три глагола подряд, разложенные по стадиям, там, где хватило бы одного. И третья — «этот бесконечный голод утихнет. И они смогут стать счастливы»: не насытятся, а станут счастливы. Голод описан не как физиология, а как форма несчастья, и вся вещь про упырей после этой фразы читается иначе.</p></div>", "r": []}];</script>
