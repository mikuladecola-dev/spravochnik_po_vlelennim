<script>const BASE="";const DOCNAME="Правитель рая";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0279-S01", "PS-0279--proishozhdenie"], "h": "<p>Правитель рая — один из правителей. Общее определение правителей дано Славой (2025-05-31, id 331635): «Это не физические существа появившиеся в нигде и в ни чем. Они первыми, что появилось в пустоте. И именно они начали создавать мир. По своему желанию». Тут же оговорено: «между всеми мирами есть связь, которую не может оборвать не один правитель».</p>\n<p>Порядок появления задан прямо: «Первым правителем был правитель кильке. Вторым же был правитель рая. Поэтому их мир в разы больше миров других правителей». То есть размер мира здесь следствие очерёдности появления, а не отдельного свойства.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0279-S02", "PS-0279--vneshnost"], "h": "<p>Отдельного описания нет. Единственное, что сказано о телесности, — общее для всех правителей: они «не физические существа».</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0279-S03", "PS-0279--harakter"], "h": "<p>Прямых характеристик нет. Из свойств, которые в переписке названы как поведенческие ограничения: правители всевидящие; они «не как не могут влиять на благословенного или обычного существа», единственное исключение — «кроме как насильственно давать благословения, даже если само существо этого не хочет». Согласие получателя не требуется: связь настраивается «без его разрешения».</p>\n<p>Ещё одно действие, доступное правителю, — выкинуть существо из своего мира, но оно названо как «очень очень очень, крайне редко».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0279-S04", "PS-0279--sposobnosti"], "h": "<p><strong>Благословение.</strong> Правитель способен давать благословение — «то есть настраивать связь с существом живущими в мире». Оговорка: «благословения даётся только существами живущими в кильке». Через настроенную связь правитель передаёт свою силу существу — «человеком чаще всего».</p>\n<p><strong>Устройство связи и её цена для получателя.</strong> «Сама связь устанавливается на мозге. То есть сила или энергия проходит через мозг вредя ему. Поэтому благословенный не часто используют благословения. Ведь это вредит мозгу. Средние продолжительность жизнь у благословенного после получения благословения 10 лет». Благословение даётся только одно — «Больше человек не выдержит. И это одно благословения с ним до его смерти. Благословения нельзя разорвать».</p>\n<p><strong>Лимит в 21.</strong> «Апостолы это 21 человек получивший благословен от правителя рая. ( 21 это максимальное число благословения, который способен давать правитель рая. Другие же правители дают меньше)». Это единственная названная числовая величина, привязанная лично к правителю рая.</p>\n<p><strong>Необработанная сила вместо готовой способности.</strong> У прочих правителей все благословенные получают одну и ту же уникальную способность этого правителя: «НО если правитель, что дал вам благословения. Даст благословения ещё другому человеку. То оно будет такой же, как и у вас». У правителя рая иначе: «Когда у всех благословенных одного правителя одна и та же способность. То у благословенных правителя рая. Они разные. Так как правитель рая. Посылает им лишь сгустки чистой и необработанной силы, который формируется во что уже только внутри Апостолов. Даруя им уникальные способности».</p>\n<p><strong>Что дают его благословения помимо уникального.</strong> Четыре основные способности общие для всех благословенных любого правителя: «усиленная регенерация; усиления тела и всех чуств; аура( то бишь самая энергия, которая выплескивается и заставляет чувствовать страх е животных и обычных людей. Так же способный влиять на окружающей. При сильном скоплении) ; сенсорика ( позволяет ощущать других благослрвенных и арбетара или Протобионтов)». Апостолам добавлена телепатия между собой: «они способны разговаривать. На расстоянии и также всем мести. Они также могут отказаться от телепатического общения и прервать разговор».</p>\n<p><strong>Обратимость.</strong> Всё, что даёт благословение, исчезает при его отключении: «вам дали ьлагословенния и ваша уникальность способность это огонь. Вы можете поджечь лес. Но после отключения благословенния весь огонь исчезнет. &lt;...&gt; Буть то огненный шар или остановка времени они просто отключаться».</p>\n<p><strong>Уравнивание по силе.</strong> «Так как всё благословенный включая апостолов. Получают плюс минус одинаковая количество энергии ( силы). Они являются одинаково сильными. Но это не включая индивидуальность людей. Всё же апостолы всё равно чаще всего сильнее любого другого благословенного».</p>\n<p><strong>Дети.</strong> У правителей есть дети — протобионты, «субъект, который был создан именно правителем, а не из-за особенности мира». Их сила «в теории позволит уничтожить континент», но «большинство существ спокойный и миролюбивый», и они «очень не любят покидать мир своего родителя». Есть ли протобионты конкретно у правителя рая, в переписке не сказано.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Что не сформулировано по вашей же логике — не материал авторов</b>\n<p>Цена благословения названа точно и для всех: связь садится на мозг, сила идёт через мозг и вредит ему, поэтому благословенные пользуются им нечасто, средний срок жизни после получения — десять лет. Это правило проговорено для случая, когда правитель передаёт готовую способность. Для апостолов способ передачи в статье описан как другой: правитель рая шлёт «лишь сгустки чистой и необработанной силы, который формируется во что уже только внутри Апостолов», то есть доработка происходит в голове получателя, а не у отправителя. Цена для этого случая не пересчитана — те же ли десять лет, тот же ли вред, стоит ли формирование сырой силы внутри мозга дороже, чем проведение готовой. Для одного способа передачи правило есть, для второго, названного здесь же и названного именно как отличающийся, — нет.</p></div>\n<div class=\"mnote\"><b>⚙ машинная заметка · Отклик — не материал авторов</b>\n<p>Зацепила одна оговорка: правитель рая не даёт способность, он даёт сырьё. «Посылает им лишь сгустки чистой и необработанной силы, который формируется во что уже только внутри Апостолов». В одном придаточном мир переворачивается: у всех прочих правителей благословенные — это тираж, у этого — двадцать одна разная судьба, и разница не в том, что он сильнее, а в том, что он недоделывает работу. Сила, которую не довели до формы, доводится тем, кому её отдали. При этом никакого повышения ставки за это не назначено — цена у всех одна, десять лет, — и от этого получается сухо и хорошо: уникальность здесь не награда, а побочный эффект небрежности. Ещё нравится, что имени у него нет, и это не выглядит пробелом: «правитель рая» — обозначение по хозяйству, как «управдом». Про существо, которое первым появилось в пустоте и начало создавать мир, известны в основном ограничения: чего он не может, кого не может тронуть, чего не может разорвать. Всевидящий, всесильный, и почти весь описан через «нельзя».</p></div>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0279-S05", "PS-0279--svyazi-s-drugimi"], "h": "<p><strong>Правитель кильке</strong> — первый появившийся правитель, правитель рая второй. Отсюда разница в размерах миров. Кроме того, кильке — та точка, куда сходятся связи между мирами: покинувшие свой мир существа чаще всего попадают именно туда, «Так как существа, что покидають свой мир. Неосознанно перемещаться по связи, а связь с килькой у каждого другого мира сильная». При этом сами существа кильке не способны покинуть свой мир «Не каким либо образом», а благословение даётся только живущим в кильке.</p>\n<p><strong>Апостолы</strong> — 21 человек, получивший его благословение. Не отдельная группа, которой он что-то дал, а именно определение: апостолы — это и есть получатели его благословений, и число апостолов совпадает с его лимитом.</p>\n<p><strong>Благословение</strong> — механизм, которым он действует.</p>\n<p><strong>Рай</strong> — его мир, «в разы больше миров других правителей».</p>\n<p><strong>Правители</strong> — общая категория, часть которой он составляет.</p>\n<p>Отдельно в том же массиве описаны существа, к правителю рая напрямую не привязанные, но сопоставленные с его благословенными: арбетары и альфа («Арбетары и Альфа это одни те же существа. Но в первом случае это люди из кильке, а во втором это чужемирцы») — они вырвали кусок силы своего мира и поселили его в себе, и их уникальная способность формируется «подобно апостолом», отчего тоже получается разной. Также названы фантазёры («правитель с маленькой буквой», создавшие свой мир в голове) и артефакты, включая артефакты с символикой.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0279-S06", "PS-0279--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2025-05-31, id 331635–331636 (окно w0099).</strong> Единым текстом Слава излагает устройство правителей, и в нём — всё, что известно про правителя рая: второй по появлению, мир в разы больше, лимит 21 благословение, апостолы, посылка необработанных сгустков силы. Второе сообщение того же дня добавляет ограничения на влияние правителей, невозможность разорвать благословение и всевидение.</p>\n<p><strong>Версия 2 — 2025-10-18, id 375843–375852 (окно w0106).</strong> Миколай присылает ссылку на набросок на codepen и цитирует то же сообщение Славы целиком, дословно, без изменений: «это только по одному твоему сообщению». Слава отвечает: «Очень круто», «Делай так». Содержание про правителя рая на этом шаге не менялось — сообщение воспроизведено в прежнем виде; изменилось только то, что текст стал основой для оформления. В записи вселенная для этого окна помечена как «неясно (по дате объявления)».</p>\n<p>Отклонённых вариантов в переписке нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0279-S07", "PS-0279--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имя не названо. «Правитель рая» — обозначение по миру.</li>\n<li>Внешности нет, и сказано лишь, что правители «не физические существа»; что это значит на практике, не раскрыто.</li>\n<li>Мотив не назван: зачем он раздаёт благословения и по какому признаку выбирает получателей, в переписке не сказано.</li>\n<li>Почему лимит именно 21 — не объяснено. Сказано только, что у других правителей число меньше; конкретные числа для других правителей не названы.</li>\n<li>Есть ли у него протобионты и кто они — не сказано.</li>\n<li>Ритуал, которым существа покидают свой мир, не доработан: в тексте он записан как «С помощью ритуала???». То же с ритуалом арбетаров — «с помощью ритуала??? Которой я ещё не доработал».</li>\n<li>Кто из 21 апостола кто — в этих сообщениях не перечислено.</li>\n<li>Устройство самого мира Рай, кроме его размера, не описано.</li>\n<li>Отношения правителя рая с правителем кильке или с прочими правителями не описаны.</li>\n</ul></div>\n<div class=\"mnote\"><b>⚙ машинная заметка · С чего начать — не материал авторов</b>\n<p>Дальше — <code>SL-0054</code> (234 052) под состав апостолов и <code>SL-0058</code> «Мини-истории апостолов» (2 662, одна ссылка, статьи нет). Под пробел про ритуал выхода из мира, записанный в тексте как «С помощью ритуала???», — <code>MR-0140</code> «Способы покинуть свой мир» (23 534, статья есть) и <code>SP-0198</code> «Ритуал становления Арбетаром» (48 879, статья есть, две ссылки): второй ритуал, помеченный тем же «??? Которой я ещё не доработал», разобран там на 48 тысяч знаков, и стоит проверить, не решался ли попутно первый. Под устройство самого Рая — <code>MR-0095</code> (54 131, статья есть), под отношения с первым правителем — <code>PS-0217</code> Правитель Кильки (14 203) и <code>PS-0278</code> Правители (26 811), обе со статьями и обе с этой не сведены.</p></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0279--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0023.html\">Правители (правители миров, правители минимиров)</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0001.html\">Апостолы (организация апостолов, «благословенные Богом»)</a>, <a href=\"GR-0023.html\">Правители (правители миров, правители минимиров)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0279--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-05-31</td>\n<td>331635–331636</td>\n<td>w0099</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-10-18</td>\n<td>375843–375852</td>\n<td>w0106</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0279-pravitel-raya.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0279--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0279.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0279-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0279/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым чинить <code>SL-0054</code> «Список 12 апостолов»: три ссылки, статьи нет, в базе 234 052 знака — самый крупный неразобранный кусок из тех, на которые вообще кто-то ссылается. Для этой статьи он критичен напрямую: её пробел «кто из 21 апостола кто — не перечислено» закрывается не архивом, а этой записью. Заодно там же и расхождение, которое стоит зафиксировать: запись называется списком двенадцати, а лимит правителя рая здесь задан как 21, и 21 — единственная числовая величина, привязанная лично к нему.</p>\n<p>Второе — не отсутствие материала, а его удвоение. Окно w0106 (2025-10-18, id 375843–375852), то самое, что стоит в источниках этой статьи второй строкой, разобрано ещё и отдельно: <code>SP-0240</code> «Благословение правителя» (9 835), <code>SP-0241</code> «Четыре основные способности благословенных» (9 573), <code>SP-0242</code> «Уникальная способность правителя» (9 592). Все три без статей, у всех ноль ссылок, у всех вселенная помечена «неясно» — при том что это дословно та же механика, которая в статье изложена в разделе «Способности», и при том что рядом есть <code>SP-0163</code> «Благословение» (86 784, статья есть) и <code>PS-0179</code> «Благословенные» (78 161, статья есть). Двадцать девять тысяч знаков лежат под кодами, не привязанными ни к вселенной, ни к правителю рая.</p>\n<p>Третье, поменьше: <code>ID-0111</code> «Добродетели и грехи как основа благословений» (одна ссылка, статьи нет, 5 419). Это единственное в базе, что подходит под пробел «по какому признаку он выбирает получателей».</p>\n<h3>С чего начать</h3>\n<p>В базе, архив пока не нужен — по этому персонажу он и так исчерпан двумя окнами.</p>\n<p>Первым делом свести w0106: <code>SP-0240</code>, <code>SP-0241</code>, <code>SP-0242</code> против <code>SP-0163</code> и <code>PS-0179</code>. Пока три «неясных» записи висят отдельно, каждая следующая статья про благословение будет собираться заново с нуля. Вселенную им можно проставить прямо из этой статьи: окно то же, текст тот же.</p>\n<p>Дальше — <code>SL-0054</code> (234 052) под состав апостолов и <code>SL-0058</code> «Мини-истории апостолов» (2 662, одна ссылка, статьи нет). Под пробел про ритуал выхода из мира, записанный в тексте как «С помощью ритуала???», — <code>MR-0140</code> «Способы покинуть свой мир» (23 534, статья есть) и <code>SP-0198</code> «Ритуал становления Арбетаром» (48 879, статья есть, две ссылки): второй ритуал, помеченный тем же «??? Которой я ещё не доработал», разобран там на 48 тысяч знаков, и стоит проверить, не решался ли попутно первый. Под устройство самого Рая — <code>MR-0095</code> (54 131, статья есть), под отношения с первым правителем — <code>PS-0217</code> Правитель Кильки (14 203) и <code>PS-0278</code> Правители (26 811), обе со статьями и обе с этой не сведены.</p>\n<p>Отдельно: <code>VS-0010</code> «Правитель» — заведена как вселенная, статьи нет, в базе 648 знаков. Скорее всего мусорная развилка, но проверить дешевле, чем оставлять.</p>\n<h3>Как развивалось</h3>\n<p>2025-05-31, id 331635 — заявили, и заявили всё сразу: очерёдность появления, размер мира как следствие очерёдности, лимит 21, апостолы как определение, необработанные сгустки. Вторым сообщением того же дня, 331636, ограничили — и ограничения тут жёстче, чем возможности: влиять на существ нельзя, кроме как навязать благословение без согласия; выкинуть из своего мира можно, но «очень очень очень, крайне редко»; разорвать благословение нельзя; благословение одно и до смерти; десять лет. Дальше — четыре с половиной месяца тишины. 2025-10-18 вернулись, но вернулись не к содержанию: Миколай цитирует то же сообщение дословно и с оговоркой «это только по одному твоему сообщению», Слава отвечает «Очень круто», «Делай так». Возврат оформительский — текст стал основой вёрстки. Отклонённых вариантов за всё время нет ни одного: ни одна формулировка про правителя рая ни разу не была пересмотрена.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Цена благословения названа точно и для всех: связь садится на мозг, сила идёт через мозг и вредит ему, поэтому благословенные пользуются им нечасто, средний срок жизни после получения — десять лет. Это правило проговорено для случая, когда правитель передаёт готовую способность. Для апостолов способ передачи в статье описан как другой: правитель рая шлёт «лишь сгустки чистой и необработанной силы, который формируется во что уже только внутри Апостолов», то есть доработка происходит в голове получателя, а не у отправителя. Цена для этого случая не пересчитана — те же ли десять лет, тот же ли вред, стоит ли формирование сырой силы внутри мозга дороже, чем проведение готовой. Для одного способа передачи правило есть, для второго, названного здесь же и названного именно как отличающийся, — нет.</p>\n<h3>Отклик</h3>\n<p>Зацепила одна оговорка: правитель рая не даёт способность, он даёт сырьё. «Посылает им лишь сгустки чистой и необработанной силы, который формируется во что уже только внутри Апостолов». В одном придаточном мир переворачивается: у всех прочих правителей благословенные — это тираж, у этого — двадцать одна разная судьба, и разница не в том, что он сильнее, а в том, что он недоделывает работу. Сила, которую не довели до формы, доводится тем, кому её отдали. При этом никакого повышения ставки за это не назначено — цена у всех одна, десять лет, — и от этого получается сухо и хорошо: уникальность здесь не награда, а побочный эффект небрежности. Ещё нравится, что имени у него нет, и это не выглядит пробелом: «правитель рая» — обозначение по хозяйству, как «управдом». Про существо, которое первым появилось в пустоте и начало создавать мир, известны в основном ограничения: чего он не может, кого не может тронуть, чего не может разорвать. Всевидящий, всесильный, и почти весь описан через «нельзя».</p></div>", "r": []}];</script>
