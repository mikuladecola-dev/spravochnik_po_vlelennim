<script>const BASE="";const DOCNAME="Технологичный остров";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0035-S01", "MR-0035--ustroystvo"], "h": "<p>Один из островов архипелага защитников, поставленный на место вулканического. Замена предложена Славой 2024-07-09: «Вулкан заменить на технологичный» (id 201608). Миколай подтвердил, что такое направление у него было изначально: «да, изначально я хотел чет технологичное сделать», «один остров» (id 201609–201610).</p>\n<p>Замена коснулась только одного острова — Миколай сначала решил, что островов станет четыре, потом уточнил сам: «а», «только один заменяем», «пон» (id 201613–201615). Слава подтвердил, что заменяется именно вулканический: «Вулкан твой», «Вулкан на технологию» (id 201623, 201626).</p>\n<p>На острове есть авиация: с него можно взлететь на самолёте — «я полетел», «на самолёте», «в технологичном мире», «на верх» (id 201882–201886).</p>\n<p>В обиходе авторов остров называется «техноложка» и «технология».</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0035-S02", "MR-0035--naselenie"], "h": "<p>Живут азиаты. Первая формулировка Миколая (id 201687): «ну в технологичном определённо живут японцы, пущай защитник будет осминоh. они же пиздец умные по логике технологии им принадлежать будут». На переспрос Славы «Японцем», «Ты серьезно» Миколай ответил «нет», «я угораю», «однако» (id 201690–201692). Слава возразил по существу: «Более развита у нас сейчас китай» (id 201693). Миколай ответил «ты ебать Токио видел», после чего сам расширил определение до «азиаты» (id 201696–201697), с чем Слава согласился («Азиаты», id 201698).</p>\n<p>Итоговая формулировка населения — азиаты, а обоснование технологичности острова сохранено то же: технологии по логике принадлежат им.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0035-S03", "MR-0035--mesto-vo-vselennoy"], "h": "<p>Остров входит в Мир островов (архипелаг защитников). Связан с Асгардом и с Защитником технологичного острова.</p>\n<p>Связь с Асгардом задана через полёт: Миколай взлетает на самолёте с технологичного острова «на верх», после чего спрашивает, движется ли Асгард. Слава отвечает: «Нет» (id 201888–201890).</p>\n<p>Рядом в том же окне разграничен другой остров — пустынный, со сталкером: «Сталкер остров пустыня. Наемники криминал наркотики все там» (id 201621). Это сказано в порядке уточнения, чтобы Миколай не спутал острова: «Ну это я чиста сказал чтобы ты знал» (id 201619). Промежуточная догадка Миколая «техно пустыня» (id 201629) была снята этим пояснением.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0035-S04", "MR-0035--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-07-09 (id 201606–201635).</strong> Остров введён взамен вулканического. Сразу поднят вопрос защитника: «защитник тот же?» — «Нет наверное» (id 201616–201617). Миколай делает из этого вывод: «то есть сталкера не будет в этой вселенной» (id 201618). Версия заканчивается тем, что Слава берётся объяснить устройство целиком: «Щя», «Все поясню» (id 201630–201631).</p>\n<p><strong>Версия 2 — 2024-07-09 (id 201687–201703).</strong> Определено население. Отклонённый вариант: японцы — снят самим Миколаем как шутка и заменён на «азиаты»; предложение Славы про Китай отдельным решением не стало, обе страны свёрнуты в общее «азиаты». Отклонён и вариант защитника: осьминог. Миколай предлагал его дважды — «пущай защитник будет осминоh» и «ну че осминоh? и азиаты» — Слава ответил «Не фига» (id 201701–201703). Осьминог принят не был.</p>\n<p><strong>Версия 3 — 2024-07-09 (id 201777–201790).</strong> У острова появляется правитель. Он опознан по присланному изображению: на вопрос «а 3 это который» Слава отвечает «Который руки подняли» (id 201777–201779). Миколай уточняет: «ну он короче правитель техноложки», «верно?» — «Да» (id 201782–201784). Имя правителя не названо, описание — только «который руки поднял» на изображении. Тут же Миколай переходит к следующему вопросу: «теперь бог», «че за вера вообще», «будем прорабатывать?» (id 201787–201790) — ответа в пределах версии нет.</p>\n<p><strong>Версия 4 — 2024-07-09 (id 201882–201890).</strong> Добавлена авиация и связь с Асгардом: с технологичного острова летят на самолёте наверх; Асгард при этом не движется.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0035-S05", "MR-0035--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Название острова так и не придумано; в списке островов он стоит как «Технологичный(??????)».</li>\n<li>Защитник не определён: «Нет наверное» — то есть не тот же, что у вулканического, но кто именно, не решено. Осьминог отклонён.</li>\n<li>Вера и бог острова остались непроработанными — вопрос задан и оставлен без ответа.</li>\n<li>Правитель обозначен только указанием на изображение («который руки подняли»), имени и описания в тексте нет.</li>\n<li>Что стало со сталкером, в переписке до конца не разобрано: Миколай предположил, что «сталкера не будет в этой вселенной», в ответ получил только пояснение про отдельный пустынный остров.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0035--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0035--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-09</td>\n<td>201606–201635</td>\n<td>w0046</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-09</td>\n<td>201687–201703</td>\n<td>w0046</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-09</td>\n<td>201777–201790</td>\n<td>w0046</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-09</td>\n<td>201882–201890</td>\n<td>w0046</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0035-tehnologichnyy-ostrov.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0035--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0035.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
