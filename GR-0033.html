<script>const BASE="";const DOCNAME="Рыба-люди";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0033-S01", "GR-0033--chto-eto"], "h": "<p>Рыба-люди — основное население подводного острова Нуара, сферы на дне океана. Появляются в переписке 2024-07-04 (id 196751), когда Слава говорит: «Вообще там по большей части жить будет рыба люди». Это не отряд и не организация, а раса-сообщество: население целого острова, а не поимённая группа. Поимённо из рыба-людей назван один персонаж — Солнышко.</p>\n<p>Слово «рыба-люди» вводится в двух разных контекстах и оба сохраняются:</p>\n<ol>\n<li>Как население сферы — те, кто живёт внутри барьера, рождается под огромным весом воды и физически к нему приспособлен (2024-07-04, id 196751–196777).</li>\n<li>Как сторона, которая может предъявить за загрязнение океана: «А рыба люди не чё не скажут / Типо почему загрязняется океан?» (2024-07-04, id 197036–197037). Идёт ли здесь речь о жителях сферы или о рыба-людях, живущих снаружи барьера, в переписке не сказано.</li>\n</ol>\n<p>Отдельно рядом стоит вопрос Славы «А как рыбы плавают?» (id 196747) — ответ Миколая «энергией делиться», то есть способность Солнышка делится энергией. Это сказано про рыб, не про рыба-людей; распространяется ли ответ на рыба-людей, в переписке не сказано.</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0033-S02", "GR-0033--sostav"], "h": "<ul>\n<li><a href=\"PS-0113.html\">Солнышко</a> — Солнышко, рыба-человек, императорша острова.</li>\n</ul>\n<p>Других участников поимённо в переписке нет. Общая численность не названа, сказано только, что остров населяют «по большей части» рыба-люди (id 196751).</p>", "r": [["Солнышко", "PS-0113.html"]]}, {"t": "Общие способности группы", "a": ["S03", "GR-0033-S03", "GR-0033--obschie-sposobnosti-gruppy"], "h": "<p>Все свойства, названные для рыба-людей, — физические, а не мета-способности.</p>\n<p><strong>Рождение и вес.</strong> «Ну они рождаются уже по ебейшим весом» (id 196752), «и из погружение обычно плавное» (id 196753). Приспособленность к давлению не приобретается позже, а идёт с рождения; погружение при этом всё равно плавное.</p>\n<p><strong>Физическая развитость.</strong> «Ну ебать они качки там будут все» (id 196774), «каждый с тренировками как для космонавта» (id 196775). Тренировки как для космонавта — свойство всего населения, а не отдельной подготовки для избранных.</p>\n<p><strong>Предел выносливости.</strong> За барьером сферы даёт о себе знать вес воды: «если ты за барьер выйдешь, а это сделает просто, тебя под весом воды к ебеням раздавит» (id 196744), «а тут, тя нахуй давят десятки тонн воды» (id 196757). Формулировка «обычного человека раздавит» относится к обычному человеку; выдерживают ли рыба-люди толщу воды напрямую, без труб, прямо не сказано — обсуждение сразу уходит в устройство труб.</p>\n<p><strong>Выход наружу через трубы.</strong> Вопрос ставит Слава: «Тогда как сделать чтобы они плавно выходили через барьер» (id 196758), уточняя — «Из барьера в воду» (id 196761). Миколай: «ну можно реализовать специальные каналы» (id 196762), «ну тобиж, не напрямую в воду, а как бы в барьере будут подобия труб» (id 196768), «или выходить можно через дно» (id 196769). Слава формулирует принцип: «Трубы где ты проходишь через неё давления плавно поднимается» (id 196770). Миколай подтверждает: «наружу естественно по каналам» (id 196771), «да, получается так» (id 196773). Позже это повторено как «с нормальным переходом давления» (2024-07-04, id 196836).</p>\n<p>Устройство труб разбиралось отдельно и подробно (<a href=\"MN-0001.html\">Трубы сферы</a>), см. раздел «Как менялась».</p>", "r": [["Трубы сферы", "MN-0001.html"]]}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0033-S04", "GR-0033--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p><strong>Дети и взрослые.</strong> «Ну детей там к хуям разорвёт» (id 196776), «так что родители будут за этим следить» (id 196777). Дети — единственная названная категория внутри рыба-людей, которая не выдерживает того, что выдерживают взрослые; надзор за ними лежит на родителях. С какого возраста ребёнок перестаёт быть уязвимым, в переписке не сказано.</p>\n<p><strong>Солнышко.</strong> Единственный названный поимённо рыба-человек, при этом носитель способности солнца (обсуждается как «человек со способностью солнца» ещё 2024-07-03, id 194830–194835). Способность Солнышка влияет на способность обычных растений выделять кислород (id 196739), благодаря чему «обычный фотосинтез» работает даже во тьме под водой (id 196746). Есть ли такие способности у других рыба-людей, в переписке не сказано.</p>\n<p><strong>Мета-люди.</strong> Отдельно от рыба-людей в том же окне вводится категория мета-людей: «Защитник — сильнейший человек на острове, есть другие мета-люди» (id 196706), «Мета — люди с энергий» (id 196712), «Способностью» (id 196713). Пересекаются ли множества «рыба-люди» и «мета-люди», в переписке не сказано.</p>", "r": []}, {"t": "Иерархия", "a": ["S05", "GR-0033-S05", "GR-0033--ierarhiya"], "h": "<p><strong>Режим правления острова менялся, обе версии зафиксированы:</strong></p>\n<ul>\n<li>2024-07-03 (id 194919–194922): Нуару даётся Федеративная республика. «Ну нуар хороший челик / А вообще можно одному из островов» — «тогда у него будет Федеративная республика».</li>\n<li>2024-07-04 (id 196704): «похуй, тут конституционная монархия».</li>\n</ul>\n<p><strong>Верх при конституционной монархии.</strong> «Есть солнышко» (id 196716), «он император» (id 196717). Слава уточняет: «Рыба человек» (id 196718) и «Императорша» (id 196721) — Миколай оба уточнения принимает («о», «норм», «оке»). То есть верхняя позиция среди рыба-людей занята рыба-человеком.</p>\n<p><strong>Защитник.</strong> Отдельная от монархии фигура: «Защитник — сильнейший человек на острове» (id 196706), причём «Он не один остров защищает» (id 196709). Гибель защитника — конец острова: «Вот только если он сдохнет будет пиздец острову» (2024-07-03, id 194817). Как соотносятся власть императорши и положение защитника, в переписке не разбиралось.</p>\n<p><strong>Семья.</strong> Родители следят за детьми при погружении (id 196777) — единственный названный уровень власти ниже верхнего.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S06", "GR-0033-S06", "GR-0033--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>Нуар.</strong> Нуар — тьма, держащая воду барьером (2024-07-03, id 194815). С Солнышком у него отношения: Миколай переспрашивает «то есть у них отношения?» (id 196724), Слава — «Не официальный» (id 196725), «Ну хочу чтобы были» (id 196726). Миколай называет это «симбиоз» (id 196727). Между кем именно отношения, прямо не сказано — переспрос остался без прямого ответа.</p>\n<p><strong>Оазис.</strong> «Так, это дно» (id 196778), «там ваще ловить нехуй» (id 196779), «все ресурсы они берут с оазиса» (id 196781) — по типу «железа, газа, нефти» (id 196787). Итог: «ну короче, они в очень развитых отношениях экономических и ресурсных с оазисом» (id 196808).</p>\n<p><strong>Загрязнение океана.</strong> Рыба-люди названы стороной, которая может задать вопрос о загрязнении океана (id 197036–197037). Ответ Миколая: «ну газы в воздух уходят это норм а пыль в естественных количествах уходит» (id 197038); проблема возникает при перегрузке — «если перебор типо внутри будет война» (id 197039), «тогда да, тогда будет не удобно» (id 197040), «типо слишком многое придётся сосать» (id 197042), «дыма и пыли из-за разрушений дохуя» (id 197043). Решение предлагает Слава: «Давай вся это грязь и пыль будет собираться в одном месте и они будут её вывозить?» (id 197044) — «да» (id 197045), «так оно и порешим» (id 197046). Дальше разговор уходит в мета-людей-утилизаторов, дриаду, межостровную корпорацию и сжигание мусора в солнце (id 197051–197099); участие рыба-людей в этой схеме не обсуждается.</p>\n<p><strong>Фауна острова.</strong> Рыбы, акулы, киты, губки и «какий нибудь твари» (id 196795–196801). Отношения рыба-людей с этой фауной в переписке не разбирались.</p>\n<p><strong>Враждующие стороны.</strong> Миколай ставит вопрос: «а что насчёт враждующих стран» (id 197101), «может кому-то вода ваще не нравится» (id 197102). Ответа в окне нет — Слава уходит смотреть Смешариков про звёзды (id 197103–197107). Осталось нерешённым.</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S07", "GR-0033-S07", "GR-0033--kak-menyalas"], "h": "<p><strong>2024-07-03 (id 194812–194835, 194919–194922).</strong> Рыба-люди ещё не названы. Готовится место: Нуара отправляют под воду («может нуара под воду пошлём? там темноты дохуя», id 194812), тьма держит воду как барьер (id 194815), разбирается снабжение — порты, транспорт, еда, и отсюда появляется идея человека со способностью солнца (id 194828–194834). Режим — Федеративная республика (id 194921).</p>\n<p><strong>2024-07-04, около 20:25–20:31 (id 196694–196735).</strong> Остров в воде, конституционная монархия (id 196704). Солнышко объявлен императором, тут же переопределён как рыба-человек и императорша (id 196716–196721). На острове «и воздух и вода» (id 196731–196734), «Тихо» (id 196735).</p>\n<p><strong>2024-07-04, 20:32–20:37 (id 196736–196753).</strong> Разбирается кислород: растений и водорослей много, способность Солнышка влияет на выделение кислорода обычными растениями, тьма его сосёт и фильтрует между дном и атмосферой (id 196739–196742). На вопрос «А как рыбы плавают?» — «энергией делиться» (id 196747–196748). Слава объявляет: «Вообще там по большей части жить будет рыба люди» (id 196751). Сразу же — рождение под огромным весом и плавное погружение (id 196752–196753).</p>\n<p><strong>2024-07-04, 20:38–20:42 (id 196757–196777).</strong> Ставится и решается вопрос выхода за барьер: каналы, «подобия труб» в самом барьере, выход через дно, плавный подъём давления (id 196758–196773). Отсюда следует физика населения: все качки, тренировки как для космонавта, детей разорвёт, за этим следят родители (id 196774–196777). Это версия 1 записи <a href=\"PS-0114.html\">Рыба-люди</a>.</p>\n<p><strong>2024-07-04, 20:43–20:49 (id 196778–196808).</strong> Экономика: на дне ловить нечего, все ресурсы берут с оазиса, отношения с оазисом «очень развитые экономические и ресурсные» (id 196779–196808). Фауна: рыбы, акулы, киты, губки, твари (id 196795–196801). Упоминается план «страх моря реализовать» (id 196802) — дальше не разворачивается.</p>\n<p><strong>2024-07-04, 20:47–20:55 (id 196805–196833).</strong> Внешний вид: очень глубокая яма в океане, изнутри сфера, снаружи тоже выглядит сферой (id 196812–196819); «На дне океана будет сфера с множество трубами» (id 196820), «Черными трубами» (id 196821). Трубы для выхода в воду направлены внутрь, вода удерживается внутри сферы, наружу «типо как дым» идут каналы (id 196823–196827). Сопровождается рисунком Миколая.</p>\n<p><strong>2024-07-04, 20:57–21:47 (id 196834–197035).</strong> Длинный спор об устройстве труб — что через какую идёт и как выводится углекислый газ, дым, пыль и грязь. Два конкурирующих варианта:</p>\n<ul>\n<li>Вариант Славы (id 196914, повторён id 196927), <strong>отклонён</strong>: четыре вида труб — 1) для поглощения кислорода, 2) для выкидывания углекислого газа, 3) для людей, 4) для выхода в океан. Миколай: «нет» (id 196930), «ты сейчас сам просто не понимаешь как у тебя всё сложно» (id 196965).</li>\n<li>Вариант Миколая (id 196922), <strong>принят</strong>: «так есть 2 вида труб: 1) внутрь для выхода в сам океан из сферы; 2) из чистой, хаотичной тьмы, она: а) сосёт воздух и фильтрует его, б) позволяет ресурсам и людям перемещаться между сферой и внешним миром».</li>\n</ul>\n<p>По ходу спора уточняется: дым — это то же самое, что тьма, «просто выглядит так» (id 196886–196887); барьер — концентрированная тьма, которую Нуар удерживает в форме, а в трубах концентрация меньше и форма не требуется, «лишь курс» — «иначе он сдохнет» (id 196888–196899). Люди заходят в трубу от стенки сферы, наружу — через порт (id 196956). «взаимодействие газов и людей по разному происходят» (id 196959). Итоговая формулировка Славы, принятая Миколаем («ну примерно так», «короче да так», id 197034–197035): «Тьма может поглощает все. С помощью этого трубы на суши качает воздух и они находятся внутри тьмы, и также люди. С помощью этого он может контролировать тех кто проходить через трубы. А сфера поглощает грязь и делает их в телесный комки и выкидывать океан» (id 197032).</p>\n<p><strong>2024-07-04, 21:47–21:50 (id 197036–197046).</strong> Рыба-люди появляются во второй роли — как сторона, которая может предъявить за загрязнение океана. Норма и перебор разграничены, решение — собирать грязь в одном месте и вывозить. Это версия 2 записи <a href=\"PS-0114.html\">Рыба-люди</a> и последнее, что о рыба-людях сказано.</p>", "r": [["Рыба-люди", "PS-0114.html"]]}, {"t": "Пробелы", "a": ["S08", "GR-0033-S08", "GR-0033--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет: назван один участник — Солнышко (<a href=\"PS-0113.html\">Солнышко</a>). Прочие рыба-люди существуют только как «основное население».</li>\n<li>Численность не названа; сказано только «по большей части».</li>\n<li>Внешний вид рыба-людей не описан вообще: ни жабр, ни плавников, ни чего-либо ещё в переписке нет.</li>\n<li>Не сказано, выдерживают ли сами рыба-люди толщу воды за барьером без труб. Формулировка про «раздавит» относится к обычному человеку.</li>\n<li>Не сказано, отвечает ли ответ «энергией делиться» (про то, как плавают рыбы) за рыба-людей тоже.</li>\n<li>Не сказано, есть ли среди рыба-людей мета-люди и есть ли у кого-то, кроме Солнышка, способность.</li>\n<li>Не сказано, живут ли рыба-люди снаружи барьера. Вопрос про загрязнение океана задан от их имени, но откуда именно — из сферы или снаружи — не уточнено.</li>\n<li>Не сказано, как соотносятся власть императорши и положение защитника.</li>\n<li>Возраст, с которого ребёнок перестаёт быть уязвимым к давлению, не назван.</li>\n<li>Название острова в окне не звучит; в исходном списке на его месте стояли вопросительные знаки.</li>\n<li>Вопрос «а что насчёт враждующих стран» / «может кому-то вода ваще не нравится» (id 197101–197102) остался нерешённым — разговор прервался.</li>\n<li>План «страх моря реализовать» (id 196802) упомянут и не развёрнут.</li>\n</ul></div>", "r": [["Солнышко", "PS-0113.html"]]}, {"t": "Связи — всё вместе", "a": ["GR-0033--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0113.html\">Солнышко</a>, <a href=\"PS-0114.html\">Рыба-люди</a></li>\n<li><strong>Упоминает монументы:</strong> <a href=\"MN-0001.html\">Трубы сферы</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0033--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0033.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0033-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0033/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первой чинить мусорную линию: <code>ID-0081</code> «Межостровная корпорация по вывозу мусора» и <code>ID-0085</code> «Конфликт из-за вывоза мусора». По две входящие ссылки на каждую, статей нет, 3,0 и 3,0 КБ. Именно туда уходит разговор, на котором эта статья обрывается фразой «участие рыба-людей в этой схеме не обсуждается». Рыба-люди введены во второй роли как сторона, которая предъявляет за загрязнение океана, — сторона названа, а механизм, к которому она предъявляет, лежит в двух записях без статей. Пока их нет, второе значение слова «рыба-люди» не к чему привязать. <code>ID-0085</code> при этом из следующего окна, w0044, того же дня: там конфликт из-за вывоза мусора предложен и тут же свёрнут решением «у каждого острова свой способ» — то есть продолжение разговора уже есть в базе, просто в соседнем окне.</p>\n<p>Второе — <code>SL-0020</code> «Сравнение силы защитников»: две ссылки, статьи нет, 4,7 КБ. Это единственный вход в вопрос, который статья ставит и оставляет открытым: как соотносятся власть императорши и положение защитника. В <code>SL-0020</code> Слава прикидывает силу защитников поимённо, и Наур в этом списке есть. Солнышка нет. Пока запись без статьи, сравнивать две вершины острова негде — они живут в разных местах справочника и нигде не встречаются.</p>\n<p>Третье, техническое: у <code>GR-0033</code> собственной базы 0 и ноль входящих ссылок, а 4,9 КБ и две ссылки лежат в <code>PS-0114</code> «Рыба-люди», заведённом как персонаж. Население острова числится и группой, и персонажем, и ссылаются на персонажа. Отдельно рядом висит <code>PS-0321</code> «Рыба-человек» — те же два слова, но вселенная «монстры».</p>\n<h3>С чего начать</h3>\n<p>В архив идти почти не нужно — весь материал в одном вечере, 2024-07-04, окна w0043 и w0044.</p>\n<p>По базе: <code>MR-0021</code> «Остров Нуара (подводный)» — 43 КБ, самая большая запись кластера, туда уехало устройство места. <code>MN-0001</code> «Трубы сферы» — 12,7 КБ, весь часовой спор про трубы. <code>MR-0025</code> «Режимы правления островов» — 9,6 КБ, там сидит перескок с федеративной республики на конституционную монархию. <code>MR-0029</code> «Мета-люди» и <code>SP-0084</code> «Мета-человек, утилизирующий мусор» — по три ссылки, статьи есть; вопрос «есть ли среди рыба-людей мета-люди» решается сведением этих двух с <code>PS-0114</code>, а не поиском в архиве.</p>\n<p>Что осталось необслуженным в том же окне и относится сюда напрямую: <code>ID-0082</code> «Страх моря» (одна ссылка, статьи нет, 1,8 КБ) и <code>ID-0083</code> «Враждующие страны, которым не нравится вода» (одна ссылка, статьи нет, 2,0 КБ). Оба — это ровно те два пробела, которыми кончается статья, и оба уже нарезаны как отдельные записи.</p>\n<p>В архив — только за внешним видом. В базе его нет нигде: за весь вечер слово «рыба-люди» произнесено дважды, и ни разу с описанием. Смотреть стоит промежуток 20:32–21:50 того же 2024-07-04 целиком и окна вокруг него — если описания нет и там, эту дыру надо не искать, а закрывать заново.</p>\n<h3>Как развивалось</h3>\n<p>2024-07-03 — место готовят без народа: Нуара отправляют под воду, тьма держит воду барьером, разбирается снабжение, оттуда появляется человек со способностью солнца. Режим правления — федеративная республика. 2024-07-04, 20:25 — режим переписан на конституционную монархию одним словом «похуй». 20:32 — народ заявлен: «Вообще там по большей части жить будет рыба люди». 20:38, через шесть минут, — уже ограничен: рождаются под весом, погружение плавное, детей разорвёт, наружу только по трубам. 20:43 — забыли: следующий час занимают экономика, фауна, внешний вид сферы и спор про трубы, рыба-люди в нём не участвуют. 21:47 — вернулись, но в другой роли: не население, а сторона, которая может задать вопрос про загрязнение океана. Через три минуты разговор ушёл в утилизаторов и корпорацию, и это последнее, что о рыба-людях сказано.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Возрастной порог давления для одной категории назван прямо: «Ну детей там к хуям разорвёт», «так что родители будут за этим следить». Ограничение есть, и есть тот, кто за него отвечает.</p>\n<p>Для основной категории правила такого же рода нет. Про толщу воды за барьером сказано: «если ты за барьер выйдешь &lt;...&gt; тебя под весом воды к ебеням раздавит» — но это сказано про обычного человека, и разговор сразу уходит в устройство труб. Выдерживает ли взрослый рыба-человек воду напрямую, без трубы, не названо ни разу. При этом весь смысл труб — плавный переход давления, то есть труба нужна кому-то; кому именно, детям или всем, из текста не следует. Порог назван для исключения и не назван для правила. Место — 196744 и 196757 против 196776.</p>\n<h3>Отклик</h3>\n<p>Час спора про трубы — лучшее, что тут есть. Слава предлагает четыре вида: кислород, углекислый газ, люди, выход в океан. Миколай: «нет», «ты сейчас сам просто не понимаешь как у тебя всё сложно» — и сводит к двум, причём второй вид вообще не труба, а тьма, которая сосёт воздух, фильтрует его и заодно пропускает людей и ресурсы. Попутно выясняется, что дым — это та же тьма, «просто выглядит так», и что в трубах Нуару не надо держать форму, только курс, «иначе он сдохнет». Инфраструктура острова оказывается физиологией одного персонажа, и это сказано мимоходом, между уточнениями про углекислый газ.</p>\n<p>А кончается спор тем, что итоговую формулировку пишет Слава — тот, чей вариант отклонили, — и Миколай её принимает: «ну примерно так», «короче да так». Ни одной попытки вернуться к четырём трубам. И где-то посреди всего этого стоит фраза, которая пережила всё окно: «каждый с тренировками как для космонавта». Целый народ описан одним сравнением, и оно работает лучше, чем два часа разговора про давление.</p></div>", "r": []}];</script>
