<script>const BASE="";const DOCNAME="Торфолихт";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0059-S01", "PS-0059--proishozhdenie"], "h": "<p>Торфолихт — пришелец вселенной «игра бога», оформленный Миколаем 2024-04-06 (окно w0030). Вариант имени в переписке — «пузырь».</p>\n<p>Появлению карточки предшествует обсуждение элементной основы персонажа: Слава — «Ну или элемент то бишь огонь молния» (154436, 18:17). Далее Миколай задаёт способность: «Его способность создавать и управлять блуждающим огнём» (154440), «Но он умеет поглощать молнию и заряжать эти огни» (154441).</p>\n<p>Связь этого раннего состояния с итоговой карточкой Торфолихта в переписке прямо не проговорена — склейка версий предположительная. Похоже, что Торфолихт — доведённая до карточки та самая идея блуждающего огня, которую Слава отклонил в пользу чистой молнии, но прямо это не сказано.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0059-S02", "PS-0059--vneshnost"], "h": "<p>«Внешне Торфолихт напоминает скопление зелёных шаров. Передвигается на реактивной тяге» (154599, 2024-04-06 21:12).</p>", "r": []}, {"t": "Происхождение и среда", "a": ["S03", "PS-0059-S03", "PS-0059--proishozhdenie-i-sreda"], "h": "<p>Торфолихты обитают на планете «с обширными торфяными болотами, богатыми метаном и другими газами». Газы используют «для защиты, охоты и ритуалов». Питаются растительностью и поглощают газы из атмосферы (154599).</p>", "r": []}, {"t": "Характер", "a": ["S04", "PS-0059-S04", "PS-0059--harakter"], "h": "<p>Отдельно характер не прописывался. Даны разумность и социальность вида (см. ниже), а также итоговая оценка Миколая: «Встреча с Торфолихтом однозначно произведет неизгладимое впечатление на любого землянина» (154599).</p>", "r": []}, {"t": "Способности", "a": ["S05", "PS-0059-S05", "PS-0059--sposobnosti"], "h": "<p>Итоговая формулировка: «Они способны создавать вокруг себя пузыри из газов, которые могут самовоспламеняться» (154599).</p>\n<p>Раннее состояние (см. раздел о версиях): создание блуждающего огня и управление им, плюс поглощение молнии и зарядка ею этих огней (154440–154441).</p>", "r": []}, {"t": "Общество", "a": ["S06", "PS-0059-S06", "PS-0059--obschestvo"], "h": "<p>Торфолихты разумны. Язык «напоминающий серию щелчков и свистов». Живут небольшими сообществами на болотах, строят хижины из местных материалов. «У них сложная социальная структура и своеобразная культура, основанная на поклонении огню и газам» (154599).</p>", "r": []}, {"t": "Связи с другими", "a": ["S07", "PS-0059-S07", "PS-0059--svyazi-s-drugimi"], "h": "<p>Связан с Лихтспидом и многоликим. Характер связи в исходном тексте не развёрнут.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S08", "PS-0059-S08", "PS-0059--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2024-04-06 (id 154436–154441).</strong> Если это он — досостояние: элемент «огонь молния», способность создавать блуждающий огонь и управлять им, поглощать молнию и заряжать ею эти огни. Внешность и планета ещё не названы.</p>\n<p><strong>Версия 2 — 2024-04-06 (id 154598–154601).</strong> Полная карточка: скопление зелёных шаров, реактивная тяга, торфяно-болотная метановая планета, питание растительностью и газами, разумность, язык из щелчков и свистов, небольшие сообщества, хижины, культ огня и газов. Способность переформулирована: самовоспламеняющиеся газовые пузыри вокруг себя. Молния и блуждающий огонь в этой версии не упоминаются.</p>\n<p>Здесь же Миколай показывает изображение: «тут он в действии почти оплёл небоскрёб» (154598, 21:02).</p>", "r": []}, {"t": "Что с ним стало", "a": ["S09", "PS-0059-S09", "PS-0059--chto-s-nim-stalo"], "h": "<p>На 2024-04-06 21:16 Миколай подводит итог по всему набору: «Всего 8 пришельцев из которых точно одобрено 3» (154600). Входит ли Торфолихт в число одобренных трёх — из окна не следует. На 154670 Слава называет его «пузырь», путая с быком.</p>", "r": []}, {"t": "Пробелы", "a": ["S10", "PS-0059-S10", "PS-0059--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Прямой связи между отвергнутым «блуждающим огнём» и Торфолихтом в тексте нет — отнесение версии 1 к этому персонажу предположительное.</li>\n<li>Судьба ранних способностей (управление блуждающим огнём, поглощение молнии) после переформулировки не оговорена: отменены они или дополняют пузыри — в переписке не сказано.</li>\n<li>Планета названием не наделена.</li>\n<li>Имя собственное персонажа и название вида не разделены: описание идёт то в единственном числе, то во множественном.</li>\n<li>Характер связи с Лихтспидом и многоликим не раскрыт.</li>\n<li>Одобрен ли персонаж — осталось нерешённым.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0059--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0014.html\">игра бога</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0059--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-04-06</td>\n<td>154436–154441</td>\n<td>w0030</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-04-06</td>\n<td>154598–154601</td>\n<td>w0030</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0059-torfoliht.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0059--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0059.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
