<script>const BASE="";const DOCNAME="Дрршмармшасьз";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0210-S01", "PS-0210--proishozhdenie"], "h": "<p>Персонаж Миколая из её собственной вселенной, названный в разговоре 2025-02-25 (id 295438–295468, окно w0077). Разговор начался с мысли Миколая: «БЛЯ ГЕНИАЛЬНО КСТАТИ ДЛЯ КАЖЛОГО ПЕРСА ПОДБИРАТЬ ПЕСНЮ» — и Дрршмармшасьз назван первым примером персонажа, к которому подобрана песня.</p>\n<p>Собеседник переспросил, кто это. Ответ Миколая: «Мой перс, но... Его рисунки забыты в веках». Изображений персонажа не сохранилось, всё описание идёт со слов автора по памяти.</p>\n<p>Вселенная, к которой персонаж принадлежит, в этом же разговоре описана отдельно: ей «больше 2-3 лет, конечно. Ну 5». Про авторство Миколай сказала: «Ну... Я создавала локации и сюжет. И половину персонажей, даже больше», рядом была бывшая подруга, потом помогала Юля, до этого — ещё одна девушка. Итог: «Поэтому это и моя, и их вселенная, конечно. Но я её мама и папа». Отдельно упомянуто, что однажды Миколай рассказывала эту вселенную отцу «ЧАСА ЧЕТЫРЕ», он устал слушать и засыпал, и от количества помнимых деталей решил, «что со мной не всё в порядке».</p>\n<p>Сокращённое имя, употреблённое самим автором в том же разговоре, — Дрршмар.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0210-S02", "PS-0210--vneshnost"], "h": "<p>Со слов автора: «Представь его, э... С длинными чёрными локонами, в тёплой красной шапочке с понпоном, синими яркими глазами».</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0210-S03", "PS-0210--harakter"], "h": "<p>«Такой простой и влюбчивый, но милый чел». Общая оценка автора: «Ваще пипцовый перс».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0210-S04", "PS-0210--sposobnosti"], "h": "<p>В переписке не сказано.</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0210-S05", "PS-0210--svyazi-s-drugimi"], "h": "<ul>\n<li>Лошадь: «А ещё у него есть лошадь». Ничего больше про неё не сказано.</li>\n<li>К персонажу привязана конкретная песня. Причина привязки названа так: «ПОЧЕМУ-ТО У ДРРШМАРА ТАКОЙ ВАЙБ БЫЛ, ЧТО Я ДАЖЕ ПОМНЮ ЭТУ ПЕСНЮ...». Название песни в переписке не приведено — на её месте стоит вложение.</li>\n<li>Персонаж относится к вселенной, обсуждаемой в том же окне как вселенная девочки с конкурса.</li>\n</ul>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0210-S06", "PS-0210--kak-menyalsya"], "h": "<p>Одна версия, 2025-02-25 (id 295438–295468). Персонаж назван, описан внешне и по характеру, привязан к песне. Дальнейших упоминаний в переписке нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0210-S07", "PS-0210--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Рисунков персонажа не существует — «Его рисунки забыты в веках». Внешность известна только по устному описанию.</li>\n<li>Пол персонажа: имя женское по звучанию не определяется, автор говорит о нём «он», «чел». Отдельно не оговорено.</li>\n<li>Роль в сюжете, возраст, происхождение внутри вселенной — в переписке не сказано.</li>\n<li>Способности не названы.</li>\n<li>Песня не названа по имени.</li>\n<li>История вселенной, которую Миколай обещала рассказать («Я ТЕБЕ МОГУ РАССКАЗАТЬ КАК-НИБУДЬ ИСТОРИЮ МОЕЙ ВСЕЛЕННОЙ»), в этом окне не рассказана.</li>\n<li>Материал переслан из другого чата, то есть это чужой по отношению к основной переписке фрагмент.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["PS-0210--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-02-25</td>\n<td>295438–295468</td>\n<td>w0077</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0210-drrshmarmshasz.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0210--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0210.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0210-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0210/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первое — не пробел в материале, а расхождение между статьями, и чинить надо его. Здесь сказано: «Персонаж Миколая из её собственной вселенной», и дальше вся история авторства («Я создавала локации и сюжет», «Но я её мама и папа») отнесена к Миколаю. Соседняя запись <code>MR-0112</code> «вселенная девочки с конкурса» разбирает тот же диапазон id 295448–295465 и пишет прямо противоположное: «Это не вселенная Миколая и Славы», а Дрршмармшасьз стоит в её населении вместе с Альгизом, Серафимой, Серпом и Земовой. <code>MR-0112</code> тут же называет и причину сбоя: все реплики в логе, включая вопрос «ты одна её создавала?», подписаны одним именем, и кто спрашивает, а кто отвечает, из записи не разделяется.</p>\n<p>Это блокирует не одну статью. На той же развилке стоят <code>PS-0204</code> Альгиз (8.9 КБ), <code>PS-0205</code> Алто, <code>PS-0206</code> «Приёмная дочь Альгиза», <code>PS-0207</code> Серп, <code>PS-0208</code> Земова, <code>PS-0209</code> Серафима — шесть карточек одного окна w0077, у которых от ответа зависит, чей это вообще материал. Причём <code>PS-0204</code> уже решил вопрос в другую сторону: «автор персонажа — девочка с конкурса, а не Миколай и не Слава». То есть внутри одного окна набор разошёлся сам с собой.</p>\n<p>Второе, дешевле: <code>ID-0144</code> «Своя вселенная Миколая» — 2.6 КБ базы, статьи нет. Если собственная вселенная Миколая существует как отдельная сущность, то вопрос из первого пункта решается сопоставлением этих 2.6 КБ с <code>MR-0112</code>, и больше ничем.</p>\n<h3>С чего начать</h3>\n<p>Не в архив. Всё нужное лежит в базе, просто в шести местах: <code>MR-0112</code> (статья 5.0 КБ при базе 3.7), <code>ID-0144</code> (2.6 КБ, статьи нет), <code>PS-0204</code> (7.3 КБ базы), <code>PS-0206</code>, <code>PS-0207</code>, <code>PS-0208</code>. Читать их надо не по одному, а подряд как один кусок w0077 — они и были одним куском.</p>\n<p>Песня: <code>ID-0119</code> «Песня для каждого персонажа», 1.8 КБ, статьи нет. Пробел «песня не названа по имени» закрывается либо там, либо нигде — в исходном сообщении на её месте вложение, и из архива текстом его не достать. Стоит заодно проверить, не тот ли это конкурс, что заведён как <code>SL-0112</code> «Чертова дюжина 2025» (6.4 КБ, статьи нет); по датам это разные вещи, но проверить дешевле, чем гадать.</p>\n<p>В архив идти только за одним и точечно: за границей пересылки. Материал переслан из другого чата, и нужно знать, с какого именно id начинается чужой текст и где он кончается. Смотреть 2025-02-25, окно w0077, диапазон 295438–295468 и чуть шире в обе стороны — важен не сам текст, а швы.</p>\n<h3>Как развивалось</h3>\n<p>Одна дата, 2025-02-25, и внутри неё персонаж проходит весь путь. Заявлен не как задумка, а как воспоминание — и сразу с потерей: «Его рисунки забыты в веках». Ограничен тем же движением: описание идёт по памяти, потому что смотреть уже не на что. Тут же имя сокращается до «Дрршмар» — в том же окне, тем же автором. Дальше не возвращались ни разу. Все три носителя этого персонажа — рисунок, песня и сюжет вселенной — на момент записи уже вне текста: первый утрачен, вторая приложена файлом, третий обещан на будущее и не рассказан.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для соседних персонажей того же окна правило происхождения материала названо прямо. <code>PS-0204</code>: «автор персонажа — девочка с конкурса, а не Миколай и не Слава». <code>PS-0206</code>: «В карточке этот материал помечен как чужой». <code>PS-0209</code>: «Материал чужой». Для Дрршмармшасьза статья фиксирует ровно тот же признак — «Материал переслан из другого чата, то есть это чужой по отношению к основной переписке фрагмент», — но выводит из него противоположное: персонаж остаётся Миколая. Признак назван, правило для соседних случаев названо, для этого случая правило не проговорено. Здесь только место; какой из двух ответов верный, из статьи не следует.</p>\n<h3>Отклик</h3>\n<p>Сильное здесь — «Его рисунки забыты в веках». Это сказано про собственного персонажа, без сожаления, почти торжественно, и в одной фразе делает то, чего не делает всё остальное описание: помещает персонажа в прошлое, у которого есть свой масштаб. Персонаж старше записи, и запись это признаёт. Рядом стоит второе: причина, по которой он вообще всплыл, — не сюжет, а «ПОЧЕМУ-ТО У ДРРШМАРА ТАКОЙ ВАЙБ БЫЛ, ЧТО Я ДАЖЕ ПОМНЮ ЭТУ ПЕСНЮ». Рисунки не сохранились, характер держится на трёх словах, а песня помнится — и именно она вытащила его из памяти пять лет спустя. И само имя: Дрршмармшасьз, которое автор в той же реплике сокращает до Дрршмара, — имя, которое не выдерживает собственной длины и сдаётся уже на втором упоминании.</p></div>", "r": []}];</script>
