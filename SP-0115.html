<script>const BASE="";const DOCNAME="Трипл Хук";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0115-S01", "SP-0115--mehanika"], "h": "<p>Трипл Хук — фраза-приём. Она появляется в истории, которую Миколай скинул в чат (2024-09-17, id 230869–230874), внутри текста истории (230873).</p>\n<p>По представлению Крима фраза «отбрасывает соперника ломая позвоночник». Это описание дано не как объяснение приёма, а как отрицание: Крим выкрикивает «ТРИПЛ ХУК» в супермаркете Колосс, все вокруг смеются, и он делает вывод — «значит тут эта фраза не отбрасывает соперника ломая позвоночник, а заставляет смеяться, прикольно». То есть отбрасывание с ломанием позвоночника — то, чего он ожидал, а не то, что произошло.</p>\n<p>Способ применения — выкрик фразы вслух, целиком, без дополнительных условий. Ни жеста, ни подготовки, ни цели-мишени в тексте не названо.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0115-S02", "SP-0115--ogranicheniya-i-cena"], "h": "<p>Прямых ограничений не сформулировано. Из сцены следует только то, что в этом месте приём не сработал так, как ожидалось: вместо отбрасывания соперника — смех окружающих. Крим объясняет это местом («значит тут эта фраза не...»), то есть в его прочтении результат зависит от того, где приём применён. Развёрнуто это правило нигде не подтверждено.</p>\n<p>Цены, отката или расхода за применение в переписке нет.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0115-S03", "SP-0115--nositeli"], "h": "<p>Единственный носитель в переписке — Крим. Он применяет фразу один раз.</p>\n<p>Откуда фраза у Крима, не сказано. То, что он ожидает от неё конкретного боевого действия, показывает, что приём ему знаком заранее, но источник знания не назван.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0115-S04", "SP-0115--kak-menyalas-po-versiyam"], "h": "<p>Версия одна.</p>\n<p><strong>2024-09-17 (id 230869–230874, окно w0057).</strong> Миколай выкладывает уже готовую историю: «давай скину историю», «которая уже есть», «она скучная и без Монстро», «но норм». Трипл Хук возникает внутри текста как ответ Крима на мамино условие «я тебе куплю, но только если скажешь волшебное слово»: Крим слова не знает и выкрикивает «ТРИПЛ ХУК». Дальше в этом окне приём не упоминается. После истории Миколай пишет «потом раскрою» (230874).</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0115-S05", "SP-0115--svyaz-s-drugimi-sposobnostyami"], "h": "<p><strong>Волшебное слово «пожалуйста» (<a href=\"SP-0116.html\">Волшебное слово «пожалуйста»</a>).</strong> Обе фразы поставлены в тексте как соперничающие «волшебные слова». Трипл Хук произнесён вместо «пожалуйста» и отклонён мамой прямо: «это не то слово которое нужно сказать, запомни есть волшебное слово \"пожалуйста\"». После этого Крим переходит на «пожалуйста», и оно срабатывает подряд несколько раз. Трипл Хук в тексте — не сработавший вариант, «пожалуйста» — сработавший.</p>", "r": [["Волшебное слово «пожалуйста»", "SP-0116.html"]]}, {"t": "Пробелы", "a": ["S06", "SP-0115-S06", "SP-0115--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Не сказано, откуда приём у Крима.</li>\n<li>Не сказано, работает ли он где-то по-настоящему: единственное применение дало смех, а «отбрасывает соперника ломая позвоночник» остаётся только ожиданием Крима.</li>\n<li>Не раскрыто, что означает само название и почему «трипл».</li>\n<li>Обещание «потом раскрою» (230874) в переписке не выполнено.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0115--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0116.html\">Волшебное слово «пожалуйста»</a></li>\n<li><strong>Упомянут в способностях:</strong> <a href=\"SP-0116.html\">Волшебное слово «пожалуйста»</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0115--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-09-17</td>\n<td>230869–230874</td>\n<td>w0057</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0115-tripl-huk.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0115--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0115.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
