<script>const BASE="";const DOCNAME="Апол";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0381-S01", "PS-0381--proishozhdenie"], "h": "<p>Апол появляется в переписке 2026-07-14 (id 502717–502719) сразу через готовый текст: Слава сообщает, что «изначально написал сказку про апола», а перед публикацией в чат попросил нейросеть её отредактировать. Отредактированный текст он называет «легендой о короле, который боялся свержения» и подаёт её как «страшную сказку, которую шепотом рассказывают в твоём мире».</p>\n<p>Сама сказка («Сказка о Короле, Который Боялся Свержения») строится не вокруг Апола, а вокруг короля, и Апол входит в неё только в конце. Содержание сказки: правая рука безумного короля видит «горы трупов», «реки нищеты» и «сотни тысяч глаз, что гасли просто так, по одной лишь прихоти безумца на троне», думает «Я был бы лучшим королем», собирает недовольных, врывается в тронный зал и убивает короля. Заняв трон, он через какое-то время видит сон, в котором его собственные соратники обнажают против него клинки, и после этого приказывает убить всех, кто потенциально мог бы занять трон: жжёт церкви, «оставив лишь себя высшей властью», убивает приближённых — «ибо они были точь-в-точь как он прежде», — и в конце убивает собственного сына, увидев в нём соперника. За жестокостью он прячет «парадоксальный страх, что сжирал его изнутри», и рассказать о своей боли ему больше некому — «лишь трупы».</p>\n<p>Дальше народ восстаёт против короля, «что возомнил себя Богом», король бросает против толпы войска, начинается «бессмысленная бойня, где каждый пытался что-то доказать», и единственным выжившим во дворце оказывается сам король, который «безразлично восседал на троне, смотря вдаль пустыми глазами». В тексте прямо сказано, что на этом история и закончилась бы, — и именно в этой точке появляется Апол: «в разбитые врата дворца ворвался трехголовый дракон, сшитый из разной плоти. И страшен был не он, а то, что восседало на нем. Белоглазое чудище. Апол.»</p>\n<p>Апол сходит с дракона, король «наконец увидел истину», после чего, по тексту сказки, «Апол не стал судить его. Он просто сожрал короля вместе с троном. А после улетел на своем верном сыне, оставив после себя лишь пустой дворец и кровь.»</p>\n<p>Завершается легенда формулировкой, которая задаёт статус персонажа в мире: «те, кто слышит ее, понимают: Апола нельзя будить. Ибо он — не спаситель и не каратель. Он — голод, который не утолить.»</p>\n<p>Сразу после публикации сказки (id 502719) Слава ставит задачу: «И теперь думай какую дать ему способность». То есть в момент появления у персонажа есть образ и легенда, но нет способности.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0381-S02", "PS-0381--vneshnost"], "h": "<p>Описание сведено к одной формуле из сказки — «белоглазое чудище». Больше никаких деталей внешности в переписке нет: ни роста, ни телосложения, ни лица, ни одежды.</p>\n<p>Отдельно описан не сам Апол, а то, на чём он передвигается: «трехголовый дракон, сшитый из разной плоти». В сказке подчёркнуто, что страшен не дракон, а всадник. Дракон назван «верным сыном» Апола.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0381-S03", "PS-0381--harakter"], "h": "<p>Характер задан отрицаниями и одним утверждением: Апол «не спаситель и не каратель», он — «голод, который не утолить». Он «не стал судить» короля — акт пожирания в сказке подан не как приговор и не как спасение мира от тирана.</p>\n<p>Второй устойчивый мотив — безразличие и нежелание тратиться. В обсуждении 15:05 (id 502788) Миколай выводит это из масштаба персонажа: «он не боится проиграть бой, он „боится“ тратить вечное на смертных — отсюда и его безразличие, и то, почему он не стирает всё подряд». Там же — формулировка о том, что вывод армии для него неприемлемо расточителен: «ему <em>западло</em> тратить трофеи тысячелетий на современников», и звери «выходят только против того, кого он признал достойным», причём такой выход армии «сам по себе высшая честь и приговор одновременно».</p>\n<p>Третий мотив — завоевание как природа, а не как средство: «звери Аполу не нужны для силы — они нужны, потому что он завоеватель по природе».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0381-S04", "PS-0381--sposobnosti"], "h": "<p>На 2026-07-14 у Апола зафиксировано несколько слоёв, часть из которых обещана, но не описана.</p>\n<p><strong>Личная сила.</strong> Слава фиксирует (id 502785): «Нихуя себе да он сильнейшего в современности отпиздил без способности». То есть сильнейшего персонажа современности Апол победил, не применяя способность вообще. Слава объясняет это статусом персонажа: «Так я не просто так называю его Богом прошлого» (id 502787). Итоговая формула, предложенная Миколаем и не оспоренная: «лично — почти непобедим».</p>\n<p><strong>Власть над живым (первая версия механики, от Миколая, id 502786).</strong> Апол «<em>ничего не создаёт с нуля</em>», он «работает только с тем, что уже живёт»; его сила — «не творение, а власть над живым». Сшивание химер при этом остаётся, но подаётся «не как создание жизни, а как <em>переплавку уже покорённых</em>» — «он не даёт жизнь, он распоряжается чужой». К этому предлагалось жёсткое правило: «Апол не властен над созданной жизнью» — тварей био-реконструкции он приручить не может, потому что они «фальшивые», «в них нет дикой души»; а обладатели био-реконструкции, в свою очередь, не могут воспроизвести его зверей, «потому что нельзя реконструировать тысячелетний опыт и верность».</p>\n<p><strong>Армия зверей.</strong> Собирается медленно, «каждый зверь — завоёванный лично», звери — «ветераны с историей, прокачанные, уникальные». После уточнения масштаба формулировка меняется: армия — «не костыль, а коллекция трофеев Бога прошлого», «каждый зверь — памятник победе», а дракон — «не транспорт и не щит, а знамя».</p>\n<p><strong>Души питомцев и создание тел (предложение Славы, id 502789).</strong> «Можно реализовать концепцию души, типа за ним вечно следует верный души его там питомца и питомца и он просто способен будет создавать им тела». Миколай принял это без правок: «да, более чем» (id 502792), «если считаешь что достаточно то норм» (id 502793).</p>\n<p><strong>Способность на контроль оам.</strong> Слава сообщает (id 502794): «Так у него поверх ещё способность связаны именно с контролем оам, о которых я тебе позже расскажу». Содержание этой способности в переписке не раскрыто — окно является концом архива.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S05", "PS-0381-S05", "PS-0381--ogranicheniya-i-cena"], "h": "<p>Ограничения обсуждались отдельно, после того как выяснился масштаб персонажа (id 502788).</p>\n<p><strong>Цена эпохи.</strong> «Он Бог <em>прошлого</em>. Его легендарные звери — существа вымерших эпох, и новых таких уже не появится.» Каждая потраченная на химеру душа, каждая безвозвратная ставка невосполнима: «Он сильнейший, но его сила конечна как музей: разграбить можно, пополнить — нечем.» Отдельно отмечено, что «современный мир мельче, и приручать в нём почти нечего достойного».</p>\n<p><strong>Ограничение по оам.</strong> «Раз призыв и воскрешение зверей жрут оам — вот честный лимит.» Сам Апол может быть непобедим в кулачном бою, «но развернуть всю армию Бога прошлого разом — расход, который даже он не тянет долго».</p>\n<p>Итоговая формула: «лично — почти непобедим, армия — абсолютна, но невосполнима и дорога в развёртке».</p>", "r": []}, {"t": "Связи с другими", "a": ["S06", "PS-0381-S06", "PS-0381--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Био-реконструкция и «те трое».</strong> Апол обсуждается в паре с тремя персонажами, владеющими био-реконструкцией (в файле они названы «те трое», у Славы — принадлежащие «другу»). Био-реконструкция «делает жизнь из мёртвого/неживого — армия из ничего»; их твари «безликие, новорождённые, без опыта», штампуются быстро и «из мусора». Апол задуман как принципиальная противоположность: «Они творцы, Апол — завоеватель», «качество против количества». Предполагаемый конфликт сформулирован как «армия творцов против армии пастыря, и ни один не может украсть силу другого», «война двух философий — „жизнь можно сделать“ против „жизнь можно только взять“».</li>\n<li><strong>Трёхголовый дракон.</strong> Ездовое существо, сшитое из разной плоти; в сказке названо «верным сыном» Апола, в обсуждении — «знаменем».</li>\n<li><strong>Оам.</strong> Ресурс, на котором завязаны призыв и воскрешение зверей, и предмет отдельной, не описанной способности Апола.</li>\n<li><strong>Сильнейший в современности.</strong> Персонаж, которого Апол победил без способности; кто это — в переписке не назван.</li>\n</ul>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S07", "PS-0381-S07", "PS-0381--kak-menyalsya"], "h": "<p><strong>2026-07-14, 11:47–11:48 (id 502717–502719) — версия 1.</strong> Апол существует только как образ из сказки: белоглазое чудище на трёхголовом драконе, пожирающее короля вместе с троном, «голод, который не утолить», «Апола нельзя будить». Способности нет — она поставлена как задача.</p>\n<p><strong>2026-07-14, 15:03–15:07 (id 502785–502799) — версия 2.</strong> Уточняется масштаб. Сначала Миколай предлагает балансировать Апола как «пастыря»: он слабее творцов в скорости, но его звери качественнее, а сам он не властен над созданной жизнью. Затем Слава уточняет статус («Бог прошлого», победа над сильнейшим современности голыми руками), и Миколай прямо снимает предыдущую конструкцию: «Ааа, окей, тогда я недооценил масштаб — беру слова назад. Если он голыми руками избил сильнейшего современности, то баланс через „слабого пастыря“ вообще не подходит.» Баланс переносится с силы на невосполнимость: цена эпохи и расход оам. Поверх этого добавляются души питомцев с созданием тел и заявлена отдельная способность на контроль оам.</p>\n<p>Отклонённое в ходе этого: «баланс через слабого пастыря» — снят автором предложения. При этом сами наработки о переплавке покорённых, о невластности над созданной жизнью и о невозможности воспроизвести его зверей отдельно не отменялись; в переписке не сказано, остаются они в силе или отпали вместе с балансом.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S08", "PS-0381-S08", "PS-0381--chto-s-nim-stalo"], "h": "<p>Обсуждение обрывается на согласии сторон и на обещании Славы позже рассказать про способность на контроль оам. Окно w0122 — конец архива, продолжения нет. Какое место Апол занимает в сюжете, чем занят в современности и вступает ли он в конфликт с обладателями био-реконструкции — не описано.</p>", "r": []}, {"t": "Пробелы", "a": ["S09", "PS-0381-S09", "PS-0381--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вселенная не названа: в файле стоит «неясно», привязка сделана только по дате объявления.</li>\n<li>Обещанная способность на контроль оам не описана — «о которых я тебе позже расскажу» не имеет продолжения, окно является концом архива.</li>\n<li>Вопрос Миколая «Норм направление, или у друга те трое — союзники Апола и конфликт не нужен?» остался без ответа: являются ли «те трое» противниками или союзниками Апола — не решено.</li>\n<li>Кто такой «сильнейший в современности», которого Апол избил без способности, не назван.</li>\n<li>Внешность за пределами определения «белоглазое чудище» не описана.</li>\n<li>Не сказано, откуда Апол взялся, сколько ему лет и что означает титул «Бог прошлого» буквально — божество ли он по природе или это прозвище.</li>\n<li>Не сказано, действует ли сказка о короле как событие внутренней истории мира или только как легенда, которую в мире рассказывают.</li>\n<li>Судьба ранних наработок о «пастыре» (переплавка покорённых, невластность над созданной жизнью) после отката баланса не проговорена.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["PS-0381--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-07-14</td>\n<td>502717–502719</td>\n<td>w0122</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-07-14</td>\n<td>502785–502799</td>\n<td>w0122</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0381-apol.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0381--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0381.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
