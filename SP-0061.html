<script>const BASE="";const DOCNAME="Миниклоны из крови";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0061-S01", "SP-0061--mehanika"], "h": "<p>Заготовка способности, прозвучавшая при подборе десятого персонажа (2024-05-11, id 167902–167908). Формулировка целиком: «чел который может из своей крови делать миниклонов и управлять ними» (id 167903).</p>\n<p>То есть носитель использует собственную кровь как материал для миниатюрных клонов и управляет ими. Размер, количество, срок существования клонов, их самостоятельность и способ управления — в переписке не сказано.</p>\n<p>При подаче идеи Миколай сам пометил её как заимствованную: «Опять идею спизжу» (id 167903). Откуда именно — не названо.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0061-S02", "SP-0061--ogranicheniya-i-cena"], "h": "<p>Не названы. Расход крови как ресурс прямо не обсуждался.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0061-S03", "SP-0061--nositeli"], "h": "<p>Предполагался десятый персонаж, о котором Слава спросил: «И последний 10 кто же он» (id 167902). Окончательно к персонажу способность не привязана — дальше разговор ушёл в целительство, и десятый персонаж закрепился как целитель.</p>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S04", "SP-0061-S04", "SP-0061--otklonennye-varianty"], "h": "<p>В том же сообщении Миколай дал альтернативу через «или»: «А может быть если что-то новое, то увеличивать размер своих Бактерий и использовать как фимильяров» (id 167903). Это вариант Бактерии-фамильяры — вторая заготовка для того же персонажа. Который из двух вариантов выбран, в переписке не решено; выбор остался нерешённым, а разговор перешёл к целительству.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0061-S05", "SP-0061--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Стоит в одной паре с заготовкой «Бактерии-фамильяры» — обе предложены как взаимоисключающие варианты для одного и того же (десятого) персонажа.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "SP-0061-S06", "SP-0061--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Не развита дальше одного сообщения.</li>\n<li>Не сказано, разумны ли миниклоны, повторяют ли облик носителя, для чего применяются (бой, разведка, работа).</li>\n<li>Не сказано, что происходит с клоном при уничтожении и возвращается ли кровь носителю.</li>\n<li>Источник заимствования не назван.</li>\n<li>Связь с итоговым обликом десятого персонажа (целителя) осталась нерешённой.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0061--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0014.html\">игра бога</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0061--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-05-11</td>\n<td>167902–167908</td>\n<td>w0034</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0061-miniklony-iz-krovi.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0061--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0061.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
