<script>const BASE="";const DOCNAME="Перо-меч Перага";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0184-S01", "SP-0184--mehanika"], "h": "<p>Из руки Перага вылезает огромное длинное перо, работающее как меч. Дословно (2025-02-24, id 293228): «замечаю, что с руки его вылазить огромное и длинное перо, словно меч. И с этим недомечом, он бежал на меня».</p>\n<p>Оружие используется на бегу: Пераг преследует рассказчика и рубит им сверху — «начал он махать крылом-мечом над моей головой». Перо режет не только по цели: в горящем здании одним из замахов Пераг задевает несущую опору, и она начинает шататься — «И в один момент задел опору он, и начала она шататься».</p>\n<p>В переписке способность называется тремя способами и все три идут от рассказчика: «перо, словно меч», «недомеч», «крыло-меч». Разъяснения, чем перо-меч отличается от обычного пера или от крыла, нет; выражение «крыло-меч» — единственное место, где перо связывается с крылом.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0184-S02", "SP-0184--ogranicheniya-i-cena"], "h": "<p>Не названы. Ни расхода, ни отката, ни условий появления пера в переписке нет — оно просто вылезает из руки.</p>\n<p>Единственное косвенно зафиксированное ограничение — среда: в горящем здании преимущество даёт не перо, а скорость и теснота, «ведь в здании горящим особо не побегаешь», и именно там Пераг начинает догонять.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0184-S03", "SP-0184--nositeli"], "h": "<p>Пераг. Других носителей не названо.</p>\n<p>К способности примыкает свойство самих перьев, отмеченное после гибели Перага: тело горит, перья — нет. «И всё горела, кроме перьев белых. И даже в красно-оранжевым огне, эти перье были белые». Связано ли негорючесть перьев с перо-мечом, в переписке не сказано.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0184-S04", "SP-0184--kak-menyalas-po-versiyam"], "h": "<p>Версия одна: 2025-02-24, окно w0076, сообщение 293228. Это первое и единственное описание. Изменений и переработок в материале нет.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0184-S05", "SP-0184--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Не проговорена. Сопоставлений с другими способностями вселенной в этом фрагменте нет.</p>\n<p>В той же сцене у рассказчика происходит нечто, названное силой: «И мне в голову пришло. Вместе с идеей пришло мне и словна сила. Ускорился, и побежал я к выходу». Названия этому не дано, и связь с перо-мечом в переписке не установлена.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "SP-0184-S06", "SP-0184--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Не сказано, откуда берётся перо, растёт ли оно из руки постоянно или появляется по желанию, и куда девается после.</li>\n<li>Не сказано, одно перо или их может быть несколько.</li>\n<li>Ограничения, цена и длительность не названы.</li>\n<li>Соотношение перо-меча с крыльями Перага не разъяснено, хотя оружие один раз названо «крыло-мечом».</li>\n<li>Прочность и режущие свойства описаны только через один эпизод с опорой; чем перо режет — краем, кончиком — не сказано.</li>\n<li>Связь между негорючестью белых перьев и способностью не установлена.</li>\n</ul></div>", "r": []}, {"t": "Контекст сцены", "a": ["S07", "SP-0184-S07", "SP-0184--kontekst-sceny"], "h": "<p>Способность известна по единственному эпизоду, целиком изложенному от первого лица (293228). Рассказчик роняет Перага, не успевает добить, Пераг опрокидывает его телом и достаёт перо-меч. Стрелять рассказчик не решается: «Прикинул в голове, что в магазине с натяжкой осталась 10 патронов. И если я сейчас их всех истрачу, то мне нужно будет перезаряжать автомат, а бегущий ПеРаг мне этого точно не даст». Он убегает в темноте, видит огонь и прыгает в горящее здание — старый музей, «который старши был меня». Пераг прыгает следом. Внутри Пераг догоняет, машет пером над головой и задевает опору; рассказчик разворачивается у выхода, всаживает в опору оставшиеся пули, вылетает сквозь горящую дверь, здание обрушивается. Пераг остаётся придавленным и горящим — «Я слышал крик, да и видел я его придавленного и горящего». Итог сформулирован рассказчиком так: «Музей, прошлой спасло меня от настоящего чудовища».</p>\n<p>Дальше в том же сообщении идёт не относящееся к способности: сбор припасов по магазинам, смена одежды ради возможности бегать («Ведь попробуйте побегать в пиджаке и в туфлях. Да и холодно, ведь солнце нет»), поиск рюкзака, уход из города и вывод, что людей нет: «Да, да, да людей та нету вот прям исчезли, словно спрятались всё от меня, словно я чудовище».</p>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0184--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0022.html\">Пераги</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0184--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-02-24</td>\n<td>293228–293228</td>\n<td>w0076</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0184-pero-mech-peraga.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0184--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0184.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["SP-0184-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/SP-0184/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Самая дорогая дыра здесь — <code>SL-0053</code>, реестр вселенной: шесть статей на него ссылаются, 20313 знаков лежат в базе, статьи нет. Именно в нём раздел «Оружие», а в разделе — «Крылатый мечи 🪽» и «Крылатый клинки 🪽», записанные 2025-02-25, на следующий день после перо-меча. Пока реестр не разобран, сопоставить перо-меч с оружейной номенклатурой вселенной физически не с чем. Рядом та же болезнь у <code>SL-0051</code> (шесть ссылок), <code>SL-0090</code> (четыре) и <code>SL-0089</code> (четыре).</p>\n<p>Вторая по цене — недобранный материал носителя: у <code>PS-0199</code> 44124 знака в базе против 19046 в статье. Перо-меч упомянут только в версии 2, а версии 3–6 в разбор не пошли, и проверить по ним оружие сейчас негде.</p>\n<h3>С чего начать</h3>\n<p>Материал есть в базе, он просто лежит в трёх разных записях.</p>\n<p><code>SP-0203</code> «Создание оружия из себя» (2025-03-18, id 305314–305321) — там правило про порождение оружия из тела сформулировано прямо и с ограничением. Это ближайший родственник перо-меча во всей вселенной, и связи между записями нет.</p>\n<p><code>SL-0053</code> (2025-02-25, id 295556–295560) — раздел «Оружие» с крылатыми мечами и клинками; сходство названий может ничего не значить, но проверить надо там.</p>\n<p><code>PS-0199</code>, версия 3 (2025-02-24, id 293229) — второй, связанный и живой пераг при рассказчике. Единственное место, где перо-меч можно было увидеть у другой особи; в переписке он там не всплывает, и это стоит подтвердить по архиву.</p>\n<p>В архив — за окном w0076, участок 293228–293229, стык двух сообщений одного дня: перо-меч появляется и исчезает внутри одного абзаца, и больше нигде не возвращается.</p>\n<h3>Как развивалось</h3>\n<p>Заявили и закрыли в одном сообщении, 2025-02-24, id 293228: перо вылезло, помахало, задело опору. Ограничение появилось не у способности, а у среды — «ведь в здании горящим особо не побегаешь»; преимущество даёт теснота, а не оружие. Забыли уже в следующем сообщении того же дня: в 293229 пераги идут фоном, а второй, живой пераг рассматривается вблизи без всякого пера. В поздних версиях, 2025-03-19 и 2025-03-20, перо-меч не упомянут ни разу. Вернулись — если вернулись — не сюда, а в реестр оружия 2025-02-25, где стоят крылатые мечи и клинки без привязки к кому-либо.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для чужемирцев правило названо вслух и с границей: «Они могут создавать оружия из себя», и сразу следом — «Но трансформировать тело не могут» (2025-03-18). Перо-меч — тот же самый случай: оружие вылезает из руки носителя. Считается ли это созданием оружия из себя, и считается ли вылезающее из руки перо трансформацией тела — не проговорено ни в одну сторону. Правило для одного класса существ есть, для соседнего, где происходит буквально то же движение, его не назвали.</p>\n<h3>Отклик</h3>\n<p>«Недомеч» — лучшее слово во всей записи. Человек бежит от твари, у твари из руки растёт клинок, и у него не находится нормального названия, поэтому он лепит уничижительное. Это точнее любого описания: страх, а не восхищение. Второе, что цепляет, — расчёт патронов посреди погони: с натяжкой десять, на перезарядку не дадут, значит не стрелять. Сцена держится на том, что герой считает, а не геройствует, и выигрывает он не силой, а тем, что подрубает опору чужим же замахом. И музей, «который старши был меня», — здание старше человека спасает человека от чудовища; фраза «Музей, прошлой спасло меня от настоящего чудовища» кривая, но попадает ровно туда, куда целились.</p></div>", "r": []}];</script>
