<script>const BASE="";const DOCNAME="Командир";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0077-S01", "PS-0077--proishozhdenie"], "h": "<p>Командир — персонаж вселенной «Цветной мир», предложенный Славой (2024-05-25, id 173147). Первое описание: «В той вселенной командир сильнейшего отряда. После развала команды построил приют для детей в отшибе от людей и жил там поживал. И он в теорий сильнейший».</p>\n<p>Он — первый удачный эксперимент по превращению бесцветного в цветного (2024-05-25, id 173148; <a href=\"MR-0010.html\">Эксперименты по превращению бесцветного в цветного</a>). Всего за 30–50 лет опытов удачных экземпляров вышло три: «Это командир, волк, Тен( многоликий)» (id 173165). Остальные — «Да больше миллиона умерло» или «Или не в состояний двигаться»; на уточнение Миколая Слава добавил: «Да некоторые умерли некоторый парализовала. А про мутантов вообще можно что нибудь замутить» (id 173166–173173). Тема мутантов дальше в этом окне не разрабатывалась.</p>\n<p>Отдельно зафиксировано: командир остановил войну между людьми и сверхлюдьми (2024-05-25, id 173175).</p>\n<p>При этом на прямой вопрос «Это человек?» Слава ответил «Да», а затем «Человек» и «Там все люди. Пока что» (id 173222–173230).</p>", "r": [["Эксперименты по превращению бесцветного в цветного", "MR-0010.html"]]}, {"t": "Внешность", "a": ["S02", "PS-0077-S02", "PS-0077--vneshnost"], "h": "<p>Вопрос о возрасте и внешности всплыл в разговоре о деконструкции образа (2024-05-25, id 173282–173286). Миколай спросил, сколько персонажу лет и видно ли это по внешности. Слава: «Ну вполне молодо выглядит», «Выглядит на 30. А на деле 56».</p>\n<p>Больше о внешности в переписке ничего не сказано.</p>\n<p>Для Миколая этот ответ оказался поворотным: «На самом деле этот вопрос всё решил. Просто персонаж то командир. Я на слове командор зациклился и внешка такая нежнаянудная в голове. И история и характер. а его образ плоским кажется. Но слово не персонаж» (id 173287–173291).</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0077-S03", "PS-0077--harakter"], "h": "<p>Слава свёл характер к перечню при попытке подобрать способность (2024-05-25, id 173241–173242): «Он плод эксперимента, любит детей раз построил приют, он сильнейший, он значит лишь добро и справедливость», «И он свободен».</p>\n<p>Раньше в разговоре сформулировано жёстче: «Грубо говоря он будет означать добро реальной добро» (id 173177). На вопрос Миколая «Всегда был добрый?» ответа не последовало — Миколай сам написал «Думаю пока» (id 173179–173182), тема осталась незакрытой.</p>\n<p>Свобода как черта пришла со стороны: Миколай сослался на аниме по манге «Ветролом» — «И сильнейший персонаж там по идеологии самый свободный. Вот, это может быть опорой» (id 173232–173235). Слава принял это как уже существующее: «Так он и так живёт отшельником после распада отряда» (id 173239).</p>\n<p>Ещё одна черта зафиксирована как поведение, а не как сила: он иногда направляет людей на путь истинный. Слава: «Ну вообще да он так иногда будет делать», но тут же — «Но это не способности» (id 173257–173259).</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0077-S04", "PS-0077--sposobnosti"], "h": "<p>Способность командира к концу окна w0035 не выбрана. Весь блок id 173147–173271 — это её поиск.</p>\n<p>Первые ассоциации Миколая на исходное описание (2024-05-25, id 173149–173151): «Ясен хуй дыра черная», «Фольга мятая», «Первые ассоциации». Дальше они не разрабатывались.</p>\n<p>По ходу перебора Миколай сформулировал общий подход: «Ну вообще часто как поступают авторы &lt;…&gt; Они делают очевидную способность единичной и тем самым мощной. Гнут вселенную под способность так сказать» (id 173174–173176).</p>\n<p>Установлено о его силе: он человек; он сильнее имитатора (<a href=\"PS-0383.html\">Имитатор</a>). Миколай: «имитатор один из сильнейших существ в той вселенной», «Тобиж не человек» — Слава: «Человек», «Там все люди. Пока что», «Имитатор слабей командира» (id 173225–173231).</p>\n<h3>Отклонённые варианты</h3>\n<ul>\n<li><strong>Вытягивание, концентрация и передача лиомата.</strong> Миколай: «Может он сосёт лиомат из каждого, может его концентрировать и возможно передавать», «По желанию». Отклонено Славой: «Ну он добро», «Нет как той», «Нет». Миколай подытожил: «Не берет и не дает энергию. Другая способность» (id 173243–173253).</li>\n<li><strong>Направлять людей на путь истинный.</strong> Миколай: «Ну типа если добро. Тогда может он умеет направлять людей на путь истинный», сразу же — «Тупые пока идеи идут», «Это не способность по сути». Слава согласился, что персонаж так иногда делает, но «это не способности» (id 173254–173259).</li>\n<li><strong>Манипуляция пространством / телепорт.</strong> Миколай: «Короче. Может манипуляции пространством», «Ну тпшкается парень», «тп - телепорт», «Ну это не сила так то». Слава: «Ну как то не особо» (id 173263–173268).</li>\n<li><strong>Манипуляция светом.</strong> Миколай: «По идее что. Если цвет есть значит есть свет. Может манипуляция светом». Отклонено: «Есть уже такой персонажей» (id 173269–173270). Какой именно персонаж имеется в виду — в переписке не сказано.</li>\n</ul>\n<p>После этого Миколай остановил перебор: «Тогда, мои полномочия всё. Сейчас точно ничего не скажу дельного. Лучше взять паузу тогда. Хотел по ходу дела чет придумать, но мысли не те идут» (id 173271).</p>", "r": [["Имитатор", "PS-0383.html"]]}, {"t": "Связи с другими", "a": ["S05", "PS-0077-S05", "PS-0077--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Волк (<a href=\"PS-0079.html\">Волк</a>) и Тен (<a href=\"PS-0078.html\">Тен</a>)</strong> — два других удачных экземпляра того же эксперимента; всего их трое за 30–50 лет (id 173165).</li>\n<li><strong>Эксперименты по превращению бесцветного в цветного (<a href=\"MR-0010.html\">Эксперименты по превращению бесцветного в цветного</a>)</strong> — командир их первый удачный результат (id 173148).</li>\n<li><strong>Имитатор (<a href=\"PS-0383.html\">Имитатор</a>)</strong> — слабее командира (id 173231).</li>\n<li><strong>Сильнейший отряд</strong> — командир возглавлял его; отряд развалился, после чего командир ушёл в отшельничество (id 173147, 173239).</li>\n<li><strong>Сильнейший человек без способностей (<a href=\"PS-0085.html\">Сильнейший человек без способностей (прототип командира)</a>)</strong> — персонаж, которого Слава делал «на подобие командира», но в другой вселенной (id 173184).</li>\n<li><strong>Паладин</strong> — название, которое Слава вывел прямо из образа командира: «Типо мы только что рассматривали командира а он типа добро» (2024-05-25, id 173318–173323). Ссылку Слава подкрепил ютуб-шортсом. Что именно названо Паладином — персонаж, класс или что-то ещё — в переписке не сказано.</li>\n<li><strong>Дети приюта</strong> — приют для детей на отшибе от людей, построен после развала команды (id 173147).</li>\n</ul>", "r": [["Волк", "PS-0079.html"], ["Тен", "PS-0078.html"], ["Имитатор", "PS-0383.html"], ["Сильнейший человек без способностей (прототип командира)", "PS-0085.html"], ["Эксперименты по превращению бесцветного в цветного", "MR-0010.html"]]}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0077-S06", "PS-0077--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2024-05-25, id 173145–173151.</strong> Появление персонажа. Командир сильнейшего отряда; после развала команды построил приют для детей на отшибе от людей; «в теорий сильнейший»; первый удачный эксперимент по превращению бесцветного в цветного. Поставлен вопрос: «И какую ему дать способность ?» Ответ Миколая — первые ассоциации: «дыра черная», «фольга мятая».</p>\n<p><strong>Версия 2 — 2024-05-25, id 173163–173182.</strong> Добавлено: он один из трёх удачных экземпляров за 30–50 лет наряду с волком и Теном (многоликим), при более чем миллионе погибших и парализованных; он остановил войну между людьми и сверхлюдьми; «Грубо говоря он будет означать добро реальной добро». На вопрос Миколая «Всегда был добрый?» ответа нет.</p>\n<p><strong>Версия 3 — 2024-05-25, id 173216–173271.</strong> Перебор способностей: отвергнуты лиомат (вытягивание/концентрация/передача), «направлять на путь истинный», манипуляция пространством и телепорт, манипуляция светом. Подтверждено: он человек, «там все люди. Пока что»; он сильнее имитатора; живёт отшельником после распада отряда; он свободен. Способность не найдена, перебор остановлен.</p>\n<p><strong>Версия 4 — 2024-05-25, id 173271–173292.</strong> Разговор смещается на деконструкцию образа. Миколай приводит определение: «Деконстру́кция — понятие современной философии и искусства, означающее понимание посредством разрушения стереотипа или включения в новый контекст. Исходит из предпосылки, что смысл конструируется в процессе прочтения, а привычное представление либо лишено глубины, либо навязано репрессивной инстанцией автора». В ходе этого выясняется возраст: выглядит на 30, на деле 56. Миколай признаёт, что зациклился на слове «командор» и оттого образ казался плоским: «Но слово не персонаж».</p>\n<p><strong>Версия 5 — 2024-05-25, id 173317–173327.</strong> Уточнение роли. Командир — не главный герой: «Он гг?» — «Нет», «Он будет редко появляться». Отсюда же Слава выводит «Паладин».</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0077-S07", "PS-0077--chto-s-nim-stalo"], "h": "<p>Внутри вселенной: после развала команды живёт отшельником в приюте для детей на отшибе от людей (id 173147, 173239).</p>\n<p>В разработке: главным героем не является, «будет редко появляться» (id 173324–173326). Способность так и не выбрана — окно w0035 закончилось на паузе, объявленной Миколаем.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0077-S08", "PS-0077--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Способность командира к концу окна не определена (w0035). Все предложенные варианты отвергнуты, новых не появилось.</li>\n<li>Всегда ли он был добрым — вопрос задан (id 173179), ответа нет; Слава ранее по другому поводу сказал «ещё не продумал» (id 173183).</li>\n<li>Внешность, кроме возраста (выглядит на 30, на деле 56), не описана.</li>\n<li>Кто такой уже существующий персонаж с манипуляцией светом, из-за которого вариант отклонён, — не назван.</li>\n<li>Что такое «Паладин» применительно к командиру и в каком статусе это название — в переписке не сказано.</li>\n<li>Тема мутантов из неудачных экспериментов («про мутантов вообще можно что нибудь замутить») осталась нерешённой.</li>\n<li>Как именно он остановил войну между людьми и сверхлюдьми — не рассказано.</li>\n<li>Состав и судьба сильнейшего отряда, причина развала команды — не названы.</li>\n<li>Ассоциации «дыра черная» и «фольга мятая» брошены без развития; сказаны ли они как заявка на способность или как шутка — из текста не следует.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0077--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0088.html\">Сильнейший отряд (отряд Командира)</a>, <a href=\"GR-0090.html\">Бесцветные и Цветные</a></li>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0078.html\">Тен</a>, <a href=\"PS-0079.html\">Волк</a>, <a href=\"PS-0085.html\">Сильнейший человек без способностей (прототип командира)</a>, <a href=\"PS-0383.html\">Имитатор</a></li>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0010.html\">Эксперименты по превращению бесцветного в цветного</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0085.html\">Сильнейший человек без способностей (прототип командира)</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0088.html\">Сильнейший отряд (отряд Командира)</a>, <a href=\"GR-0090.html\">Бесцветные и Цветные</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0077--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-05-25</td>\n<td>173145–173151</td>\n<td>w0035</td>\n<td>Цветной мир (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-05-25</td>\n<td>173163–173182</td>\n<td>w0035</td>\n<td>Цветной мир (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-05-25</td>\n<td>173216–173271</td>\n<td>w0035</td>\n<td>Цветной мир (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-05-25</td>\n<td>173271–173292</td>\n<td>w0035</td>\n<td>Цветной мир (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-05-25</td>\n<td>173317–173327</td>\n<td>w0035</td>\n<td>Цветной мир (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0077-komandir.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0077--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0077.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
