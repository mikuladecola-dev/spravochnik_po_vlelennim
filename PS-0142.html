<script>const BASE="";const DOCNAME="Ник-Хан";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0142-S01", "PS-0142--proishozhdenie"], "h": "<p>Персонаж появляется в истории Миколая про Горгону, написанной и выложенной в чат целиком за один раз (2024-08-11, id 218121–218123). Он вводится как «знакомый друг вампир» рассказчика — то есть уже существующий в жизни героя человек, а не встреченный по ходу истории. Рассказчик и есть главный герой истории: на прямой вопрос Славы «И кто гг? Кто он?» Миколай отвечает «рассказчик это гг» (2024-08-12, id 218207–218217).</p>\n<p>Имя вводится с отдельной оговоркой самого рассказчика: «Кстати, забыл совсем представить, его зовут Ник-Хан, более нелепого имени конечно не придумать, но что поделать, тогда это было достаточно красивое и редкое имя». В дальнейшем тексте истории он называется коротко — «Ник» и «Хан». Когда именно «тогда» имя было красивым и редким, в переписке не сказано; ни возраст, ни срок жизни персонажа не назван.</p>\n<p>Живёт он в пещере за две тысячи километров от города рассказчика. Пещера же служит ему жильём — рассказчик просит перенести их «к себе в комнату, ну точнее пещеру».</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0142-S02", "PS-0142--vneshnost"], "h": "<p>По истории у Ника-Хана ожирение, и на этом строится отдельное рассуждение рассказчика: «вы когда-нибудь видели вампиров с лишним весом. я в массовой культуре тоже не видел».</p>\n<p>Когда он появляется в пещере, описание меняется: «Ник выглядел сново необычно для вампира. представьте себе бодибилдера с мёртвой серой кожей. да, его метаболизм убрал весь жир, но мускулатуру зато очень возбудил и сделал невероятно объёмной». Оба описания стоят в одном и том же тексте одно за другим; как ожирение сочетается с телом бодибилдера без жира, в переписке не объясняется.</p>\n<p>В споре на следующий день Миколай сводит внешнее отличие персонажа к одному слову: на вопрос Славы «В чем не обычность» он отвечает «он толстый» (id 218197–218198).</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0142-S03", "PS-0142--harakter"], "h": "<p>Ник-Хан описан через быт, а не через поступки. Он «каждый день поедает тонны жареных сверчков за просмотром сериальчиков и за написанием рецензий по ним». Метаболизм у него при этом работает — «он его ограничивает».</p>\n<p>Книги он покупает по обложке. Когда рассказчик в панике кричит на него: «так у тебя же есть книга о том как людей от окамения спасать ты че её не читал», выясняется, что «он купил потому что обложка красивая, а так он сериалы смотрит. по этой книги экранизации ещё не было». Рассказчик комментирует: «я с него в шоке конечно был».</p>\n<p>На требование превратиться в летучую мышь и опорожниться на пол он реагирует шоком и отказом: «конечно он не хотел этого делать, это же мерзко, но я сильно настаивал и ему пришлось согласиться». Своей воли в этой сцене он не проявляет — соглашается под нажимом.</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0142-S04", "PS-0142--sposobnosti"], "h": "<p><strong>Сила.</strong> Рассказчик зовёт его именно потому, что не может поднять окаменевшую Асешу: «пришлось звонить знакомому другу вампиру, они очень сильные».</p>\n<p><strong>Метаболизм.</strong> Разобран подробно: «они все худые не из-за того что могут превращаться в летучих мышей. и от того они очень сильные. не поняли прикол, да? у мышей невероятно быстрый метаболизм и короткий кишечник, кстати у вампиров он тоже короткий, намного короче чем у людей. еда если ещё проще, то еда быстрее переваривается и выходит из организма, и эффективней его наделяет энергией». У Ника-Хана метаболизм «на самом деле даже сильнее чем у обычного вампира, только он не спит в гробу тысячелетиями» — а ожирение объясняется тем, что «он много ест и редко превращается в летучую мышь».</p>\n<p><strong>Превращение в летучую мышь.</strong> Есть, но используется редко — в этом и причина его состояния. В истории превращение происходит по прямому приказу рассказчика.</p>\n<p><strong>Скорость перемещения.</strong> «пусть он живёт в пещере за 2 тысячи километров от моего города, я через 1 минуты и 34 секунды он был на месте, благо ночь была». Оговорка про ночь стоит рядом со скоростью; связано ли это ограничение с самим перемещением, в переписке не сказано.</p>\n<p><strong>Перенос других.</strong> Он переносит рассказчика вместе с каменной Асешей к себе в пещеру, а позже помогает донести её обратно к подруге. Как именно устроен перенос, не описано.</p>\n<p><strong>Гуано.</strong> Не способность как таковая, но материал, который добывается из него: «в фекалиях летучих мышей(далее гуано) очень высокое содержание нитратов которые способствуют разложению при контакте с неорганикой и увеличению энергии в контакте с органикой». Указано и условие места: «воздух пещеры самый насыщенный по содержанию азота, поэтому прямой контакт с ним способствует более активному насыщено, тем более окислительный слой конкретно его фекалий способствует ускоренной ферментации». Смесь для снятия окаменения — гуано, разведённое спиртом (в истории — вином), пропорции рассказчик берёт «на глаз» из книги в коллекции Хана.</p>\n<p>В споре 2024-08-12 Миколай добавляет к перечню отличий: «он более сильный» (id 218240).</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0142-S05", "PS-0142--svyazi-s-drugimi"], "h": "<p><strong>Рассказчик (он же гг истории про Горгону).</strong> Друг, к которому обращаются за помощью ночью и по телефону. Отношения неравные: рассказчик приказывает («на нервах я был психованный, поэтому правильнее будет сказать приказал ему превратиться в летучую мышь отложить кучку прямо на полу»), а Ник-Хан подчиняется.</p>\n<p><strong>Асеша.</strong> Девушка, в которую влюблён рассказчик и которую Горгона обращает в камень. Ник-Хан переносит её в пещеру, участвует в расколдовывании (её опускают в купальню с водой, сверху выливают смесь, «так как плотность это смеси ниже она держалась на поверхности») и потом помогает отнести её обратно.</p>\n<p><strong>Горгона.</strong> Персонаж, из-за которого начинается вся история — женщина «с дредами в виде змей в белым брюхом». С Ником-Ханом напрямую не пересекается.</p>\n<p><strong>Книга о снятии окаменения.</strong> Стоит в его коллекции, но им не прочитана. Откуда она у него — предмет отдельного вопроса Славы (см. ниже), оставшегося без ответа.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0142-S06", "PS-0142--kak-menyalsya"], "h": "<p><strong>2024-08-11, id 218121–218123, окно w0052.</strong> Персонаж вводится целиком в одном тексте: пещера за две тысячи километров, скорость (1 минута 34 секунды), ожирение и его объяснение через метаболизм, сверчки и рецензии на сериалы, книга о снятии окаменения в коллекции, превращение в летучую мышь по требованию, тело бодибилдера с мёртвой серой кожей, участие в спасении Асеши, нелепое имя.</p>\n<p><strong>2024-08-12, id 218193–218244, окно w0052.</strong> Персонаж не дописывается, а разбирается в споре. Слава считает его пустым: «Сам вид монстров как вампир ничем не примечателен» (id 218201), «И снова же вампир обычный» (id 218224), «я про то что твой вампир ничем не выделяется» (id 218236). Миколай перечисляет отличия по одному: «он не самый обычный» (id 218193), «он толстый» (id 218198), «он более сильный» (id 218240). Отдельно он формулирует функцию персонажа в истории: «его роль срать красиво» (id 218229), «не более» (id 218230).</p>\n<p>В том же споре Слава возражает против самой книги: «И из какой хули библиотеки он достал книгу о окаменения» (id 218199), «Какой нормальный человек напишет книгу о снятии окаменения» (id 218206). Миколай отвечает отсылкой — «сука ты че доктор стоун не смотрел?» (id 218202) — и по существу вопрос не закрывает.</p>\n<p>Слава также ставит вопрос о статусе вампира во вселенной: «Так ты же добавил новый вид монстров в эту вселенную» (id 218232). Миколай отвечает: «нет это не так, конкретно у нашего героя есть знакомый вампир, хули» (id 218233) и «монстр понятие растяжимое» (id 218234). То есть вампир здесь заявлен не как введённый вид, а как частный знакомый героя.</p>\n<p>Про саму историю Миколай признаёт: «сука ну да, это угар был, но ты сам сказал что главное чтобы был монстр хули не нравится» (id 218237) и «это уже после мы начали делать такие работы» (id 218242).</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0142-S07", "PS-0142--chto-s-nim-stalo"], "h": "<p>В пределах истории он доводит дело до конца: после того как камень сходит и Асеша оказывается живой, «Ник помог унести её к подруге». Дальше он в тексте не появляется — сцена с подругой, пощёчиной и разговором о свидании идёт уже без него. Что с персонажем после этого, в переписке не сказано; продолжений с ним нет, последнее упоминание — спор 2024-08-12.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0142-S08", "PS-0142--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Возраст, срок жизни и происхождение вампиризма не названы. Оговорка «тогда это было достаточно красивое и редкое имя» ни к какому времени не привязана.</li>\n<li>Откуда у него книга о снятии окаменения — вопрос задан Славой дважды (id 218199, 218206) и остался без ответа.</li>\n<li>Совмещение ожирения и «бодибилдера с мёртвой серой кожей» в одном описании не объяснено.</li>\n<li>Оговорка «благо ночь была» рядом со скоростью перемещения не развёрнута: работает ли способность днём, не сказано.</li>\n<li>Механика самого переноса (как он забирает рассказчика и каменную Асешу за две тысячи километров) не описана.</li>\n<li>Откуда берутся жареные сверчки в тоннах, где публикуются рецензии, чем он занят помимо сериалов — в переписке нет.</li>\n<li>Питание кровью, слабости, отношение к другим вампирам не упоминаются вовсе; вся вампирская природа сведена к силе, метаболизму и превращению в мышь.</li>\n<li>Отношения с Асешей и с подругой Асеши после переноса не прописаны — реагирует на него в финальной сцене только рассказчик.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0142--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0044.html\">Вампиры</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0044.html\">Вампиры</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0142--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-11</td>\n<td>218121–218123</td>\n<td>w0052</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-08-12</td>\n<td>218193–218244</td>\n<td>w0052</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0142-nik-han.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0142--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0142.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
