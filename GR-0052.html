<script>const BASE="";const DOCNAME="Геростраты";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0052-S01", "GR-0052--chto-eto"], "h": "<p>Разведка занесла «Геростратов» в группы, но по переписке это не организация, не отряд и не фракция с составом. Это класс носителей силы — нарицательное название для человека со сверхспособностями, наравне с «благословенными» или «мета-людьми» в других вселенных. Соответственно ни штаба, ни командования, ни списка членов у Геростратов нет и быть не предполагалось: «Герострат» — это то, чем человек является, а не то, куда он вступил.</p>\n<p>Слово появилось 2024-05-07 (id 166898–166909) в конце длинного разговора об отряде сильнейших. Слава спросил: «Кстати а какой можно дать другой название сверхчеловека», «Ну или сверх способностям», «Типо я много думал ну не придумал». Миколай сначала прикинул источник — «Ну я бы щас побежал к греческому переводу», «Или латинскому», — а потом уточнил критерий: «Тебе обязательно нужна логика. Или главное чтоб звучало прикольно?». Слава ответил: «Звучала прикольная». После этого Миколай выдал: «Тогда чел со сверх способностями это Герострат», и сразу же оговорил условие использования слова: «Похуй на изначальную коннотацию имени, это будет нарицательное для человека со способностями». То есть историческая коннотация имени (поджигатель храма ради славы) отброшена сознательно и в мир не переносится; слово взято как звучание.</p>\n<p>Название принято без возражений. Дальше от него, как сказано в разметке базы, «пляшет вся энергетика»: уже через несколько сообщений Слава привязывает к Геростратам энергию, из которой они берут способности (166922): «Вообще смотри я хочу что бы это энергий была у Геростратов и типо они это энергий используют способности».</p>\n<p>Единственное имя, названное в базе как связанное с Геростратами по названию отдельной сущности, — мир <a href=\"MR-0008.html\">Герострат</a>; сама разработка проходит через способность «Лиомат» (<a href=\"SP-0059.html\">Лиомат</a>), отряд сильнейших (<a href=\"PS-0063.html\">Отряд сильнейших</a>) и сверхчеловека с идеальным контролем (<a href=\"PS-0065.html\">Сверхчеловек с идеальным контролем</a>).</p>", "r": [["Отряд сильнейших", "PS-0063.html"], ["Сверхчеловек с идеальным контролем", "PS-0065.html"], ["Лиомат", "SP-0059.html"], ["Герострат", "MR-0008.html"]]}, {"t": "Состав", "a": ["S02", "GR-0052-S02", "GR-0052--sostav"], "h": "<p>Поимённого состава Геростратов в переписке нет. Ни один персонаж прямо Геростратом не назван — ни бойцы отряда сильнейших (Провидец, Бессмертный, Имитатор), ни отвергнутые кандидаты (Несоразмерный, Призрак, Логос номос), ни сверхчеловек с идеальным контролем. Слово вводится как обозначение категории, а не как перечисление.</p>\n<p>В плане статьи список участников пуст.</p>", "r": []}, {"t": "Общие способности группы", "a": ["S03", "GR-0052-S03", "GR-0052--obschie-sposobnosti-gruppy"], "h": "<p>Общее у всех Геростратов — не конкретная сила, а механика её питания. Она разрабатывалась в тот же вечер, 2024-05-07 (id 166922–166973), и потом дважды была сведена в готовый текст 2024-05-09.</p>\n<p>Исходная постановка Славы (166922): энергия есть у Геростратов, и «типо они этой энергией используют способности».</p>\n<p>Разработка механики шла так (2024-05-07, id 166923–166973):</p>\n<ul>\n<li>Вопрос Славы: «И вопрос откуда берется энергия?». Первые варианты Миколая — «Ну в обычном мире», «Из солнца», «Или из еды». Слава отклонил: «Ненее», «Из желудка». Миколай развёл наш мир и их: «У нас с тобой так», «А вот у них», «Хз». На этом этапе Слава на варианте не остановился («Нет», 166936).</li>\n<li>Решение об анатомии: «Ну крч может новую железу им вывести пихнём и какую-то удалим» (166937). Слава предложил специальный орган, но упёрся в возражение: «только как тогда насильной пробуженый вырабатывают эту энергию» (166938). Ответ — орган был всегда, и это не орган, а железа: «Тогда можно сказать что он был всегда», «Не всё, как я и сказал», «Железу», «Не орган», «И эта энергия по сути гормоны» (166939–166944).</li>\n<li>Почему не у всех: Слава спросил, «почему некоторый сами пробуждаться а некоторый нет». Объяснение через гормональную аналогию: «И есть же депрессия, при которой у человека не вырабатываются некоторые гормоны и он навыки некоторые теряет», «И тут тоже самое но сильнее», «То бишь у большинства эти гормоны не вырабатываются» (166947–166950). Отсюда вывод Славы: «И нужен особой препараты».</li>\n<li>Как гормоны дают энергию: сначала через пример адреналина — «Если его прям много», «Человек может делать невероятное», значит «они её перерабатывают», «Направляют в нужное русло» (166953–166959). Слава поправил: «Они сами вырабатывают» (166960).</li>\n<li>Итоговая цепочка (166962–166973): пища, разлагаясь на микроэлементы, даёт энергию через кровь; кровь поступает в железу; там энергия «будет преобразовываться в другую которая отвечает за способности», «А также генерироваться или увеличиваться». У железы есть сфинктер: «Он будет как батарейка», «Хранить энергию».</li>\n</ul>\n<p>Энергия получила имя раньше механики — «Лиомат» (2024-05-07, id 166915–166921). Расшифровка: «Объединение конечных частей слов означающих солнце и кровь на греческом».</p>\n<p><strong>Сведённая концепция, вариант 1 (2024-05-09, id 167302–167305).</strong> Миколай: «Я короче концепцию энергии и способностей придумал систематизировал и написал». Содержание: у человека два вида энергии — обычная, получаемая от калорий, и энергия, от которой зависит сверхспособность, «лиомат». Лиомат — трансформированная обычная энергия, вырабатываемая в новой железе «абакра» и хранящаяся в сфинктере этой железы. 300000 лет назад железа постоянно генерировала «гелиогормоны», потому что были условия, при которых человеку жизненно необходимо использовать сверхспособность. Когда атмосфера Земли стала комфортнее, а условия пригоднее для мирной жизни, гелиогормоны перестали вырабатываться и железа осталась рудиментом. Учёные гадали, зачем она использовалась, но ответ «так и не был зафиксирован в научном мире». При этом существует «множество военных организаций с безумцами умеющими управлять гормональным фоном и стимулировать выработку гелиогормонов в этой железе», и тогда люди могут контролировать способность, «установленную генетическим кодом клеток». Комментарий автора: «Ну это пока первый вариант», «Хотя надеюсь что последний)».</p>\n<p><strong>Сведённая концепция, вариант 2 (2024-05-09, id 167321–167323).</strong> Миколай выложил второй вариант с пометкой «Некоторые недочёты и пробелы я заполнил». Первый вариант при этом не отменён — оба лежат рядом. Что добавилось и что изменилось:</p>\n<ul>\n<li>Биохимия преобразования: гелиогормоны синтезируются «макросоединением иденоновой кислоты» и циркулируют в «ангиолиях» — сосудах с АТФ, «которая не активна без гормонов». Конкретно: «соединение гелиогормонов с АТФ и приводит к появлению лиомата».</li>\n<li>Условие запуска: гелиогормоны начинают синтез при стимуляции симпатической нервной системы, и достаточная для ежедневного использования стимуляция «знакома только людям пережившим ситуации при которых можно заработать крайнюю форму птср, ну конечно без самого птср, при птср не возможно».</li>\n<li>Генетика: у человека с рождения есть клетки с генкодом, отвечающим за сверхспособности, «но без лиомата они не работают, а после 30 лет полностью исчезают без использования».</li>\n<li>Расход и рост: «При использовании способности клетки постепенно совершают метаморфозу и принимают нужную форму, а лиомат соответственно расходуется».</li>\n<li>Древность: срок сдвинут с 300000 на 150000 лет. Условия той эпохи расписаны: «вечный холод, макрофауна, озоновые дыры, общее состояние климата и состав воздуха отличались, постоянный стресс уже в первые годы рождения приводил к состоянию близкому птср».</li>\n<li>Учёные: ответ «так и не был зафиксирован в научном мире открыто» (добавлено слово «открыто»).</li>\n<li>Военные организации переописаны: «есть множество военных организаций где логично птср не редкость проводящих эксперименты над людьми со сверхспособностями».</li>\n</ul>", "r": []}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0052-S04", "GR-0052--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p>Различие между Геростратами задано не энергией — она у всех одна, — а тем, какая именно способность записана в клетках. По варианту 1 (2024-05-09) способность «установлена генетическим кодом клеток», и стимуляция железы даёт человеку контроль именно над ней.</p>\n<p>По варианту 2 (2024-05-09) происхождение конкретной способности расписано подробнее: «Этот генкод в режиме инкубации каждое поколение революционировал и способность определялась тем что человек ел, в том числе в контексте информации, а так же сами мечты человека до 5 лет влияют на предрасположенность к способности». То есть два фактора: съеденное — включая информацию, которую человек «ел», — и мечты до пяти лет.</p>\n<p>Кроме того, различается сама возможность быть Геростратом: у большинства людей гормоны не вырабатываются вовсе, поэтому кто-то пробуждается сам, а кому-то нужны «особой препараты» (2024-05-07, id 166945–166951) или работа военных организаций с гормональным фоном.</p>\n<p>Списка конкретных способностей Геростратов как класса в переписке нет: способности, которые обсуждались в те же дни (отматывание времени, бессмертие с костяными атаками, локальное управление осязанием, слово-закон, поедание чужих сил), разбирались как персонажи и кандидаты в отряд, а не как примеры Геростратов.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S05", "GR-0052-S05", "GR-0052--otnosheniya-s-drugimi-gruppami"], "h": "<p><strong>Насильно пробуждённые обычные люди.</strong> Названы прямо в том же сообщении, где Геростратам придана энергия (2024-05-07, id 166922): «При этом там будут насильно пробужденый обычный людий которых заставили пробудить данную энергию, при этом самой сверхсилый у них не будет, а только усиленный за счёт этой энергий». Это вторая категория рядом с Геростратами: та же энергия, но без сверхсилы, только усиление. Собственного названия она не получила, отдельной группой не заводится. Именно существование этой категории вынудило сделать абакру железой, которая была всегда, а не новым органом (166938–166943).</p>\n<p><strong>Военные организации.</strong> По варианту 1 (2024-05-09) — «множество военных организаций с безумцами умеющими управлять гормональным фоном и стимулировать выработку гелиогормонов»; по варианту 2 — «множество военных организаций где логично птср не редкость проводящих эксперименты над людьми со сверхспособностями». Как эти организации соотносятся с отрядом сильнейших, в переписке не сказано.</p>\n<p><strong>Отряд сильнейших (<a href=\"PS-0063.html\">Отряд сильнейших</a>).</strong> Разрабатывался в тот же вечер и непосредственно перед появлением слова «Герострат»; название «Герострат» возникло из просьбы Славы подобрать другое имя сверхчеловеку и сверхспособностям (166898–166908). Однако бойцы отряда нигде Геростратами не названы — связь по смыслу есть, прямого утверждения в переписке нет. Про сам отряд там же сказано, что это «военный отряд» и что рядом с ним существуют «другие отряд равный им по силе» (166837–166838), а название переопределено: не сильнейшие, а «просто отряд довольно сильных людей с которыми способный справляться единицы» (166863).</p>\n<p><strong>Сверхчеловек с идеальным контролем (<a href=\"PS-0065.html\">Сверхчеловек с идеальным контролем</a>).</strong> Введён как единственное условие смерти Бессмертного (2024-05-07, id 166507). Слово «Герострат» родилось из просьбы дать ему другое название (166898), но им он в итоге не назван — «Герострат» стал именем для класса, а не для этого персонажа. Является ли сверхчеловек Геростратом, в переписке не сказано; сам персонаж в окне так и не придуман.</p>", "r": [["Отряд сильнейших", "PS-0063.html"], ["Сверхчеловек с идеальным контролем", "PS-0065.html"]]}, {"t": "Как менялась — по датам", "a": ["S06", "GR-0052-S06", "GR-0052--kak-menyalas"], "h": "<p><strong>2024-05-07, id 166898–166909.</strong> Слово вводится. Поиск названия для сверхчеловека и сверхспособностей, критерий выбран в пользу звучания, а не логики. Итог: «Тогда чел со сверх способностями это Герострат» и оговорка про отброшенную коннотацию.</p>\n<p><strong>2024-05-07, id 166910–166914.</strong> Отклонённый вариант названия для самих способностей — «макроскилы». Оценка автора: «Но слишком длинно и неоч», затем «Хотя», «Не мне понравилось». Вопрос закрылся репликой Славы «Похую на название сверхспособности» — отдельное слово для сверхспособностей так и не выбрано.</p>\n<p><strong>2024-05-07, id 166915–166921.</strong> Названа энергия — «Лиомат», с греческой этимологией «солнце + кровь».</p>\n<p><strong>2024-05-07, id 166922.</strong> Энергия привязана к Геростратам; рядом объявлена вторая категория — насильно пробуждённые обычные люди без сверхсилы.</p>\n<p><strong>2024-05-07, id 166923–166973.</strong> Механика: отвергнуты варианты «из солнца», «из еды», «из желудка»; отвергнут «специальный орган» в пользу железы, которая была всегда; энергия приравнена к гормонам; объяснено, почему пробуждаются не все; выстроена цепочка «пища → микроэлементы → кровь → железа → преобразование и генерация → сфинктер как батарейка». Разговор оборвался на ночь (166974: «Ладно спокойной ночи»).</p>\n<p><strong>2024-05-09, id 167302–167305.</strong> Первый сведённый вариант концепции: два вида энергии, лиомат, железа «абакра», сфинктер-хранилище, гелиогормоны, 300000 лет назад, рудимент, военные организации, способность из генетического кода клеток.</p>\n<p><strong>2024-05-09, id 167321–167323.</strong> Второй вариант, старый не затирается. Добавлены иденоновая кислота, ангиолии, АТФ, запуск через симпатическую нервную систему и околоПТСР-состояние, исчезновение генкода после 30 лет без использования, зависимость способности от съеденного и от мечт до 5 лет, метаморфоза клеток при использовании; срок изменён с 300000 на 150000 лет; военные организации переописаны как проводящие эксперименты над людьми со сверхспособностями.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "GR-0052-S07", "GR-0052--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет. Ни один персонаж в переписке не назван Геростратом.</li>\n<li>Иерархии нет: ни рангов, ни ступеней силы, ни различия по «мощности» Геростратов не обсуждалось.</li>\n<li>Отдельного названия для самих сверхспособностей так и не выбрано; «макроскилы» отклонены, замены не предложено.</li>\n<li>Вторая категория — насильно пробуждённые обычные люди — названа, но имени не получила, и её отношения с Геростратами (подчинение, вражда, совместная служба) не описаны.</li>\n<li>Не сказано, как Геростраты соотносятся с военными организациями: служат в них, подвергаются экспериментам или и то и другое.</li>\n<li>Не сказано, является ли сверхчеловек с идеальным контролем Геростратом, и являются ли ими бойцы отряда сильнейших.</li>\n<li>Не сказано, сколько Геростратов в мире, известны ли они обществу и как их называют официально; при этом по концепции наука не зафиксировала назначение абакры «открыто» — что скрывается за словом «открыто», осталось нерешённым.</li>\n<li>Вселенная в самих окнах ни разу не названа: и в w0032, и в w0033 привязка к «игре бога» сделана по дате объявления, а не по прямому упоминанию.</li>\n<li>Два варианта концепции лиомата (2024-05-09) сосуществуют; какой из них считается итоговым, в переписке не решено — сказано только «Ну это пока первый вариант», «Хотя надеюсь что последний)» и «Некоторые недочёты и пробелы я заполнил».</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0052--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0063.html\">Отряд сильнейших</a>, <a href=\"PS-0065.html\">Сверхчеловек с идеальным контролем</a></li>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0059.html\">Лиомат</a></li>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0008.html\">Герострат</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0052--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0052.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0052-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0052/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Самая дорогая дыра рядом с этой статьёй — Провидец (<code>ID-0050</code>): три ссылки, 14,5 КБ базы, статьи нет. Он назван здесь среди бойцов отряда сильнейших, разбирался в те же дни, и через него в «игру бога» заходит сразу несколько записей. Пока его нет, любая правка по отряду и по составу класса тащит его за собой вручную.</p>\n<p>Второе — не отсутствие, а неправильный адрес. <code>SP-0064</code> («абакра») — та самая железа, на которой держится вся механика Геростратов, три входящие ссылки, 8,4 КБ базы — числится по вселенной «Цветной мир», а не по «игре бога». Статья про класс и запись про его орган разведены по разным вселенным. Это чинить дёшево и полезнее всего: сейчас ни один обход по вселенной их вместе не соберёт.</p>\n<p>Третье — два куска материала, которые в статью не попали вовсе: <code>ID-0056</code> («Мифы как летописи людей с активной абакрой», 2,2 КБ, одна ссылка) и <code>ID-0055</code> («макроскилы», 2 КБ, одна ссылка). Второй статья хотя бы упоминает как отклонённое название, первого нет нигде — при том что по концепции железа была активна 150000 лет назад, и запись про мифы как след тех людей это прямое продолжение той же мысли.</p>\n<h3>С чего начать</h3>\n<p>Всё три пункта — в базе, архив не нужен. По абакре 8,4 КБ, по лиомату (<code>SP-0059</code>) 18,3 КБ, по отряду сильнейших (<code>PS-0063</code>) 29 КБ — материала по механике больше, чем в самой статье. <code>ID-0056</code> и <code>ID-0055</code> короткие, их можно втянуть сразу.</p>\n<p>Что действительно требует архива — судьба слова после 2024-05-09. Оба сведённых варианта концепции выложены в один день, и на этом всё обрывается. Ориентир: окна после 2024-05-09, искать по «лиомат», «абакра», «гелиогормон» — если третий вариант или выбор между первыми двумя где-то есть, он там. Второе окно для архива — отдельное имя для сверхспособностей: «макроскилы» отклонены 2024-05-07, замены в этих материалах нет, но реплика Славы «Похую на название сверхспособности» закрывает тему не окончательно.</p>\n<h3>Как развивалось</h3>\n<p>Всё уложилось в три вечера. 2024-05-07 слово выбрали по звучанию, а не по логике — критерий проговорён вслух («Тебе обязательно нужна логика. Или главное чтоб звучало прикольно?» — «Звучала прикольная»), и историческая коннотация отброшена сразу же, в том же сообщении. Тем же вечером к слову привязали энергию и за полтора часа собрали механику через перебор отказов: не солнце, не еда, не желудок, не орган — железа. Разговор оборвался на ночь.</p>\n<p>2024-05-09 дважды подряд свели в текст. Второй вариант помечен как заполнение пробелов первого, первый при этом не отменён — они лежат рядом, и срок древности между ними меняется с 300000 на 150000 без объяснения. После 2024-05-09 к классу не возвращались.</p>\n<p>То есть: назвали — обстроили — оформили дважды — оставили оба варианта.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для Геростратов жизненный цикл силы прописан подробно: генкод есть с рождения, без лиомата клетки не работают, после 30 лет без использования исчезают полностью, при использовании совершают метаморфозу. Для второй категории — насильно пробуждённых обычных людей, которым дали ту же энергию, но сверхсилы у них нет, — ничего этого не сказано. Есть ли у них тот же генкод, просто не сработавший, или его нет вовсе; исчезает ли у них что-то после 30; расходуется ли лиомат так же, если способности нет. Категория названа в том же сообщении, что и привязка энергии, и именно из-за неё пришлось переделать орган в железу, которая была всегда, — то есть она уже один раз заставила переписать анатомию мира. Правило для одной стороны названо, для второй, того же рода, — нет.</p>\n<h3>Отклик</h3>\n<p>Сильный момент — тот, где сюжетное возражение переписало анатомию. Слава спрашивает: «только как тогда насильной пробуженый вырабатывают эту энергию», и в ответ орган перестаёт быть новым и становится железой, которая была всегда, плюс рудиментом. Это правка не ради красоты, а под конкретную дырку, и она пережила оба сведённых варианта — редко когда так видно, что мир достраивается от возражения, а не от замысла. Второе, что зацепило: условие запуска через симпатическую нервную систему и состояние «крайней формы птср, ну конечно без самого птср, при птср не возможно». Формулировка кривая, но в ней есть настоящая мысль — сила требует пережитого ужаса ровно до той границы, за которой ужас ломает носителя. Это дороже, чем вся биохимия с иденоновой кислотой вокруг.</p></div>", "r": []}];</script>
