<script>const BASE="";const DOCNAME="Кристал";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0121-S01", "SP-0121--mehanika"], "h": "<p>Кристал — первый пришелец из «Бен 10», которого разбирали под систему чёрного ящика (2024-11-17, id 258968–259056). Взят как пробный образец: «ну давай с одной из способностей поработаем», «например возьмем кристала» (id 258969–258970). М при этом мультсериала не смотрел («я не ебу сорян», позже прямо: «нет» на вопрос, видел ли он Кристала), описание всё время даёт С.</p>\n<p>Базовое описание способности от С (id 258973): «Кристал поглощает энергий и преобразует в радужную энергий способен стрелять ими, также может летать».</p>\n<p>Разбор М по частям (id 258974–258975): «допустим можно реализовать поглащение энергии», «типа оружие создавать затратно» — то есть поглощение проходит как реализуемое, а создание оружия из поглощённого идёт по высокой стоимости.</p>\n<p>Встраивание в общую систему (id 259002–259005): «кристал собирает энергию», «это одна из структур», «и она может быть в ящике», «восполняет сосуд». Поглощение здесь — механизм восполнения сосуда, а не отдельный эффект.</p>\n<p>Поглощение работает и по входящей атаке. Пример С (id 259018): «Я видел и помню как в него стрельнули лазером он его погладил но получил урон и отскочил», «Он так всегда», «Типо он поглощает энергий но урон получает». М сводит: «в если атакуют» «он получит урон и энергию» (id 259022–259023).</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0121-S02", "SP-0121--ogranicheniya-i-cena"], "h": "<p>Главное возражение поставил С сам: «Типо поглощает энергию», «Это же чит код» (id 259009–259010). М с этим согласился («не по сути да») и предложил решение через ранжирование: «поэтому систему ранжирования можно сделать» (id 259016).</p>\n<p>Итоговая цена, как её решил С (id 259028–259033): поглощает всю энергию, но поглощение не мгновенное, и в процессе он получает урон. Дословно: «Типо он не мгновенно поглащает и в этот момент получает урон», «Получает процентов наверное 65». М переспрашивает и фиксирует: «пока идет процесс поглащения получается» — «окей».</p>\n<p>Отдельная точка отключения — сочетание молнии и воды. Случай, от которого Кристал вырубился (id 259045): «в одной из серий его водой смыло в трансформатор и там он получил заряд электричество и походу он вырубился так как вода проводник а он весь был воде и по сути он получил урон со всех сторон». Ключ здесь — «урон со всех сторон»: вода как проводник снимает направленность атаки. С оговаривается: «Я сам не до конца понял». Поглотил ли он при этом энергию, неизвестно: «Он погладил наверное там не показано он же вырубился» (id 259047).</p>\n<p>Из этого М предложил вывести общий класс: «ну как будто можно из этого сделать слабость к способносте», «типа такое сочетание дебафит или отключает способность или пользователя», «молния + вода» (id 259049–259051). С отложил: «Ну это потом».</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0121-S03", "SP-0121--nositeli"], "h": "<p>Носитель один — сам Кристал, персонаж «Бен 10». Внутри вселенной «монстры» он на момент переписки числится разбираемым примером, а не утверждённым обитателем; вопрос о его включении остался открытым.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0121-S04", "SP-0121--kak-menyalas-po-versiyam"], "h": "<p>Все три версии — 2024-11-17, окно w0064, за один разговор.</p>\n<p><strong>Версия 1 — id 258968–258977.</strong> Кристал выбран как первый образец для разбора. Дано исходное описание (поглощение энергии, преобразование в радужную, стрельба ею, полёт). Первая прикидка М: поглощение реализуемо, создание оружия затратно.</p>\n<p><strong>Версия 2 — id 259002–259035.</strong> Способность встроена в систему: собирание энергии — «одна из структур», она может быть в ящике, восполняет сосуд. Здесь же возникает возражение про чит-код и спор о цене (см. ниже), который заканчивается формулой «поглощает всё, но не мгновенно и получает около 65% урона в процессе».</p>\n<p><strong>Версия 3 — id 259036–259056.</strong> Добавлен случай отключения через трансформатор и воду, и из него вытянут кандидат на общее правило «молния + вода». Разговор закрывается переходом к следующему пришельцу: «следующего пришельца припарируем?» (id 259056).</p>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S05", "SP-0121-S05", "SP-0121--otklonennye-varianty"], "h": "<p>Дозировка урона пополам. М предлагал (id 259025–259027): «но в 2 раза меньше например», «половину отсосёт», «половину получит уроном». С отклонил прямо: «Нет весь поглотит» (id 259028). На уточнение «а урон тоже весь?» С дал вариант с длительностью поглощения и 65%, который и остался.</p>\n<p>Версия причины отключения «от избытка» (М, id 259040) отклонена С: «Тока» (id 259041), то есть от тока.</p>\n<p>Правило «молния + вода» как отдельная слабость предложено, но не принято и не отвергнуто — отложено: «Ну это потом».</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S06", "SP-0121-S06", "SP-0121--svyaz-s-drugimi-sposobnostyami"], "h": "<ul>\n<li>Чёрный ящик — Кристал разбирался именно под него, его сборка энергии заявлена как «одна из структур», которая «может быть в ящике».</li>\n<li>Энергия, сосуд и структура — поглощение работает как восполнение сосуда.</li>\n<li>Слабость молния + вода — выведена из случая с Кристалом, задумана как общее правило, отключающее способность или пользователя.</li>\n<li>Система ранжирования — названа М как способ обойти чит-код (id 259016), детали в переписке не раскрыты.</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S07", "SP-0121-S07", "SP-0121--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Войдёт ли Кристал в итоговый список, не решено. С прямо сказал: «Ну да и вот Кристал здесь вообще не к месту» (id 259006), но разбор после этого продолжился.</li>\n<li>65% урона — прикидка С («процентов наверное 65»), точное число не закреплено.</li>\n<li>Не сказано, от чего зависит длительность поглощения и, соответственно, размер получаемого урона.</li>\n<li>Радужная энергия, стрельба ею и полёт после первого описания больше не разбирались: как именно преобразуется энергия и во что она обходится, в переписке не сказано.</li>\n<li>«Оружие создавать затратно» — во сколько именно, не названо.</li>\n<li>Система ранжирования упомянута одной строкой и не расписана.</li>\n<li>Поглощает ли Кристал энергию в момент отключения током — неизвестно, в источнике не показано.</li>\n<li>Правило «молния + вода» осталось нерешённым: отложено на «потом», результата в этом окне нет.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0121--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0121--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-11-17</td>\n<td>258968–258977</td>\n<td>w0064</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-11-17</td>\n<td>259002–259035</td>\n<td>w0064</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-11-17</td>\n<td>259036–259056</td>\n<td>w0064</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0121-kristal.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0121--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0121.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
