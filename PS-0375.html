<script>const BASE="";const DOCNAME="Доима (дочь Имета)";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0375-S01", "PS-0375--proishozhdenie"], "h": "<p>Доима введена целиком 2026-06-07 (id 488435–488444). Заходу предшествует заявление Славы: «Я наконец-то смог придумать нормальную мотивацию дочери имет. При этом не разрушив их отношения» (id 488437).</p>\n<p>Персонаж появляется внутри более общего решения — состарить апостолов: «Давай изменим возраст апостолов теперь им за 40». Там же оговорено, как это будет выглядеть для остальных: Звездочёт живёт отдельно от родителей, «да и под бинтами не особо видно изменение. Не видно старый он или нет»; Агрегат уехал путешествовать, а по возвращении домой «будет отшучиваться, типа гены у него хорошие»; родителям графа «вобще пофиг» — они только «желают что бы он поскорее дал потомство из-за его способности». Доима идёт следующим пунктом того же списка, с пометкой «Дочь имета. (Доима)».</p>\n<p>История её появления на свет: «У имитатора в подростковом возрасте была мелкая интрижка о которой он забыл. Он и не знал, что та девушка забеременила, поэтому он без беспокойство покинул данный город.»</p>\n<p>Дальше девушку захватил Нимб. Мотив организации назван прямо: «Им было интересно унаследует ли ребёнок апостола его способности.» Ребёнок родился, мать умерла. Над ребёнком «начали проводить всяческий эксперименты дабы выявить если у неё особенности апостолов».</p>\n<p>Когда ей исполнилось восемь лет, «ученный сдались и больше не тестировали её». Деть девочку было некуда: «Возраст уже вышел и проводить над ней эксперименты бесполезно. Поэтому они просто решили взрастить сотрудника, у них и так нехватка кадрова была.»</p>\n<p>Так она выросла и стала сотрудницей Нимба.</p>", "r": []}, {"t": "Характер", "a": ["S02", "PS-0375-S02", "PS-0375--harakter"], "h": "<p>Основная формулировка: «она так и осталась ребёнком, что мечтает о нормальной семьи. Она всё ещё та маленькая девочка что была заперта в белой комнате, читая книжки и мечтая о семье. И при этом весь этот мир ей кажется отвратным.»</p>\n<p>Отсюда цель: «Поэтому её цель воплотить свой мир. С родителями.»</p>\n<p>Отношение к Имету: «Она любит Имета считая его единственным дорогим и родным человеком.»</p>\n<p>Отдельно зафиксировано, как забота отца действует на неё в обратную сторону: «Доима же от заботы и беспокойство отца лишь больше утверждается изменить этот мир, чтобы отец был всегда рядом, как сейчас и чтобы у неё была мама.»</p>\n<p>Неприязнь к миру у неё не декларативная, а рабочая: дыру между мирами она открыла в центре города — «ей не нравится этот мир».</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0375-S03", "PS-0375--sposobnosti"], "h": "<p>Прямого перечня способностей нет. Известно следующее:</p>\n<ul>\n<li>Она СЛ. Это сказано попутно: «она и до камня желания была сл».</li>\n<li>Она поглотила камень желания. Что именно это ей даёт, в переписке не описано; описано только следствие — Имет «делает всё возможное чтобы её никто не убил попутно исследуя её организм и ищет лекарство против камня желания».</li>\n<li>Унаследовала ли она особенности апостолов — не установлено внутри самого мира: эксперименты Нимба над ней шли до восьми лет и закончились тем, что «ученный сдались».</li>\n<li>Для эксперимента с дырой между мирами она использовала артефакт; какой именно — не назван.</li>\n</ul>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0375-S04", "PS-0375--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Имет (Имитатор), отец.</strong> Апостол, не знавший о её существовании. Когда узнаёт, что у него есть дочь, «он не будет с ней драться или мешать ей он просто поговорить с ней по душам». Затем Доима предлагает ему стать союзниками «и создать тот мир где они вместе с матерью будут вместе, как и должно быть». Имет сперва отказывается — «ему это не особо интересно», — но, узнав о поглощённом камне желания, соглашается помогать. Его помощь описана как охрана и одновременно исследование: беречь её от смерти, изучать организм, искать лекарство против камня желания.</li>\n<li><strong>Мать.</strong> Девушка из подростковой интрижки Имета, захваченная Нимбом, умерла при родах. Имени нет. Она — часть цели Доимы: мир, который та хочет воплотить, включает мать.</li>\n<li><strong>Нимб.</strong> Организация, захватившая её мать, экспериментировавшая над ней до восьми лет и затем вырастившая её как сотрудницу. Доима работает на Нимб и одновременно ведёт от него собственную деятельность.</li>\n<li><strong>Собственная организация.</strong> «У неё своя организация ( это конечно громко сказано, там просто несколько сл и ис), о которой нимба неизвестно.» Состав, кроме «нескольких сл и ис», не назван.</li>\n<li><strong>Фантазёр-ключ.</strong> Схваченный ею фантазёр, «что был на грани провалиться в свой мир»; в ходе эксперимента он был «ключом, что держит дыру открытой». Имени нет, судьба не названа.</li>\n<li><strong>Столпы героев.</strong> Противостояли последствиям её эксперимента. Поимённо в описании того дня названы: нуар, Карен, Изб, праведник, Клед и граф — «Там вообще всё столпы участвовали».</li>\n</ul>", "r": []}, {"t": "Эксперимент с дырой между мирами", "a": ["S05", "PS-0375-S05", "PS-0375--eksperiment-s-dyroy-mezhdu-mirami"], "h": "<p>Описан как её первый эксперимент (id 488439). Суть цели названа прямо: «Суть этого эксперимента была, можно ли объединить миры.»</p>\n<p>Ход: она схватила фантазёра, который был на грани провала в свой мир, и с помощью артефакта «открыла путь из мира фантазера в наш». Открыла в центре города — по прямой причине: «ей не нравится этот мир». Со своей группой она защищала фантазёра как ключ, удерживающий дыру открытой.</p>\n<p>Из другого мира полезли существа: «некоторый из этих существ были очень сильными, и их также была десятки тысячи». Столпы героев в это время выводили людей и сражались.</p>\n<p>Отдельно описан ход того дня: «в тот день сначала поглотила тьма нуара» — нуар с помощью тьмы спасал граждан, убивал монстров и помогал другим героям в радиусе 3 км, при этом сам сражался с достаточно сильным существом и пытался убить фантазёра, «которого очень сильно защищали». Затем «мир окрасился черно белый и Карен начала вести ещё большую поддержку». Также участвовал Изб — «летал, спасал людей и бился с разными чудовищами», — праведник, Клед и граф.</p>\n<p>Результат: «Хотя он и не удался, доима осталась довольной результатом.» После этого предполагаются дальнейшие эксперименты: «После она также будет проводить мелкие и большие эксперименты.»</p>", "r": []}, {"t": "Как менялась — состояния по датам", "a": ["S06", "PS-0375-S06", "PS-0375--kak-menyalas"], "h": "<p><strong>2026-06-07 (id 488435–488444), окно w0121 — единственная версия.</strong> Персонаж введён целиком за один заход: происхождение, эксперименты Нимба, смерть матери, работа на Нимб, собственная тайная организация, мотивация и цель, эксперимент с дырой между мирами, разговор с Иметом по душам, союз с ним и поглощение камня желания. Отдельных более ранних состояний в архиве нет.</p>\n<p>Внутри этого же захода зафиксировано изменение общей рамки — возраст апостолов поднят до «за 40», и Доима вводится как следствие этого решения.</p>\n<p>Автор отдельно отмечает, что решённой задачей было не само появление дочери, а её мотивация: «Я наконец-то смог придумать нормальную мотивацию дочери имет. При этом не разрушив их отношения.»</p>\n<p>Реакция соавтора в окне ограничена репликами: «красавчик» (id 488438), «ебать старые» (id 488442) и переносом чтения на потом — «я немного позже прочту», «у меня тут пиздец завал на практике» (id 488443–488444). Разбор этого материала Миколаем в окне не появляется.</p>", "r": []}, {"t": "Что с ней стало", "a": ["S07", "PS-0375-S07", "PS-0375--chto-s-ney-stalo"], "h": "<p>Линия доведена до союза с Иметом и до продолжающихся экспериментов. Финал обозначен, но не раскрыт: «А в конце ну ты знаешь что будет.» Что именно происходит в конце, в переписке не сказано.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0375-S08", "PS-0375--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вселенная не названа: в файле стоит «неясно», привязка сделана по дате объявления.</li>\n<li>Концовка её линии оставлена ссылкой на устную договорённость соавторов — «ну ты знаешь что будет» — и в окне не раскрыта.</li>\n<li>Способности Доимы не перечислены: сказано только, что она СЛ и что она поглотила камень желания.</li>\n<li>Что даёт камень желания и от чего именно Имет ищет «лекарство», не описано.</li>\n<li>Состав её собственной организации не назван — только «несколько сл и ис».</li>\n<li>Артефакт, которым открыт путь из мира фантазёра, не назван.</li>\n<li>Мать не названа по имени; обстоятельства захвата и её смерти описаны одной фразой.</li>\n<li>Не сказано, унаследовала ли она что-либо от отца-апостола: эксперименты Нимба прекратили, «ученный сдались», результат не сформулирован.</li>\n<li>Не сказано, как и когда Имет узнаёт о дочери, — только то, что после этого он не будет драться, а поговорит по душам.</li>\n<li>Не сказано, знает ли Нимб о её целях и о союзе с Иметом; про организацию отдельно оговорено только, что о её собственной группе «нимба неизвестно».</li>\n<li>Судьба фантазёра-ключа после эксперимента не описана.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0375--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0104.html\">Нуар</a>, <a href=\"PS-0215.html\">Сестра имитатора</a>, <a href=\"PS-0324.html\">Дочь Имитатора</a>, <a href=\"PS-0383.html\">Имитатор</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0375--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-06-07</td>\n<td>488435–488444</td>\n<td>w0121</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0375-doima-doch-imeta.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0375--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0375.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
