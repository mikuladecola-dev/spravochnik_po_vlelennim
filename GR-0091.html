<script>const BASE="";const DOCNAME="Имитатор и Спартанец (напарники)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0091-S01", "GR-0091--chto-eto"], "h": "<p>Пара напарников во вселенной «Цветной мир»: Имитатор и Спартанец. Существование пары объявлено одной строкой 2024-05-25 (id 173137): «Кстати спартанец напарник имитатор ( имитатор один из сильнейших существ в той вселенной )». Имени паре не давали, отдельного названия у неё нет — в справочнике она проходит по именам участников.</p>\n<p>Строго говоря, это не отряд и не организация, а зафиксированный факт напарничества двух персонажей. Ни одной совместной сцены, ни одной общей задачи, ни общей структуры у пары в переписке нет: сказано только, что один — напарник другого. Весь материал по паре укладывается в одно окно одного дня (2024-05-25, id 173135–173232).</p>\n<p>Реплика 173137 возникла не как отдельная тема, а как ответ на вопрос Миколая «А спартанец?» (173136), заданный после перечисления способностей другого персонажа («Когти скорость инстинкты регенерация», 173135).</p>\n<p>Отдельно: у Имитатора есть отряд времён 8-летней войны, но он относится к вселенной «7 островов» (обсуждался 2024-07-04, id 196162) и с этой парой не связан.</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0091-S02", "GR-0091--sostav"], "h": "<ul>\n<li><a href=\"PS-0383.html\">Имитатор</a> — Имитатор</li>\n<li><a href=\"PS-0082.html\">Спартанец</a> — Спартанец</li>\n</ul>\n<p>Пара состоит ровно из этих двоих; третьих участников не называли.</p>", "r": [["Имитатор", "PS-0383.html"], ["Спартанец", "PS-0082.html"]]}, {"t": "Чем участники отличаются друг от друга", "a": ["S03", "GR-0091-S03", "GR-0091--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p><strong>Имитатор.</strong> «Имитатор один из сильнейших существ в той вселенной» (173137). Позже в тот же день уточнено, что он всё-таки человек: Миколай зацепился за формулировку — «имитатор один из сильнейших существ в той вселенной», «Тобиж не человек» (173225–173226), Слава ответил «Человек», «Там все люди», «Пока что» (173227–173230). Что именно он имитирует, в этом окне не проговорено — способность названа только по имени персонажа.</p>\n<p><strong>Спартанец.</strong> Определён через внешний вид: «Он будет ходить полностью голый только в железных ботинках, трусах и в шлеме» (173137). Способность ему подбирали в том же разговоре и так и не выбрали.</p>\n<p>Главное различие внутри пары на 2024-05-25: у Имитатора статус (один из сильнейших) есть, а у Спартанца нет ни способности, ни статуса — только облик.</p>\n<h3>Варианты способности Спартанца, предложенные и не принятые</h3>\n<p>Миколай: «Есть 2 концепции известные» (173140), после чего перечислил:</p>\n<ul>\n<li>«1 даже в той вселенной выдумка» (173141) — что именно имелось в виду, из текста не восстанавливается;</li>\n<li>«Или как Мга мышцы увеличивать» (173142) — увеличение мышц по образцу «Моей геройской академии»;</li>\n<li>«Или как в баки бесквит Оливер мышцы размером с остров прячет в маленьком теле» (173144) — по образцу Оливы из «Баки».</li>\n</ul>\n<p>Оценка Миколая: «По идее норм концепция, можно дополнить или объединить с другой» (173146). Слава ни один из вариантов не подтвердил и не отверг — вместо ответа перешёл к следующему вопросу: «И кстати раз пошли суда то ещё вопрос» (173145), после чего разговор ушёл на командира (173147). На этом обсуждение способности Спартанца оборвалось и больше не возобновлялось.</p>", "r": []}, {"t": "Иерархия", "a": ["S04", "GR-0091-S04", "GR-0091--ierarhiya"], "h": "<p>Внутри пары старшинство не названо: сказано только, что «спартанец напарник имитатор», кто у кого напарник и кто главнее — не уточняется.</p>\n<p>Наружу одна привязка есть: «Имитатор слабей командира» (173231, 2024-05-25 14:48).</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S05", "GR-0091-S05", "GR-0091--otnosheniya-s-drugimi-gruppami"], "h": "<p>Единственная названная внешняя точка отсчёта — командир, о котором Слава заговорил сразу после обсуждения Спартанца: «В той вселенной командир сильнейшего отряда. После развала команды построил приют для детей в отшибе от людей и жил там поживал. И он в теорий сильнейший. И какую ему дать способность ?» (173147). Позже — «Имитатор слабей командира» (173231).</p>\n<p>Отношений самой пары с этим отрядом (или с его командиром) в переписке не названо: соотнесены только силы Имитатора и командира, а не группы между собой. Никаких других групп «Цветного мира» рядом с парой не упоминается.</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S06", "GR-0091-S06", "GR-0091--kak-menyalas"], "h": "<p><strong>2024-05-25, 14:03 (id 173137).</strong> Пара объявлена одной строкой. Тогда же: Имитатор — один из сильнейших существ вселенной; Спартанец ходит полностью голым, только железные ботинки, трусы и шлем; вопрос «какую дать способности спартанцу» поставлен и открыт.</p>\n<p><strong>2024-05-25, 14:04–14:06 (id 173139–173146).</strong> Миколай предлагает две известные концепции мышечной силы (МГА, Олива из «Баки») и третью формулировку — «даже в той вселенной выдумка»; отмечает, что концепцию можно дополнить или объединить с другой. Выбор не сделан.</p>\n<p><strong>2024-05-25, 14:07–14:09 (id 173145–173147).</strong> Разговор уходит на командира сильнейшего отряда. К Спартанцу не возвращаются.</p>\n<p><strong>2024-05-25, 14:47–14:48 (id 173222–173231).</strong> Уточнения по Имитатору: он человек, «там все люди, пока что»; «Имитатор слабей командира».</p>\n<p>После 2024-05-25 к паре в переписке не возвращались. Имитатор продолжает разрабатываться дальше (с 2024-07-03 — как защитник Оазиса во вселенной «7 островов», затем в «Апостоле» и «Оам»), но уже без Спартанца и вне «Цветного мира». Спартанец после 2024-05-25 не упоминается вовсе.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "GR-0091-S07", "GR-0091--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Названия у пары нет — «имени паре не давали».</li>\n<li>Совместных сцен, задач, общих целей и общей структуры у пары в переписке нет; названо только само напарничество.</li>\n<li>Общих способностей группы не называли — ничего, что умели бы оба, не описано.</li>\n<li>Способность Спартанца осталась нерешённой: обсуждение оборвалось на переходе к командиру, ни один из трёх предложенных вариантов не принят и не отклонён явно.</li>\n<li>Что именно имитирует Имитатор, в этом окне не сказано.</li>\n<li>Внутренняя иерархия пары не названа: кто ведущий, кто ведомый — в переписке не сказано.</li>\n<li>Как пара сложилась, где действует, чем занимается — не сказано.</li>\n<li>Формулировка «1 даже в той вселенной выдумка» (173141) осталась нераскрытой.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0091--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0082.html\">Спартанец</a>, <a href=\"PS-0383.html\">Имитатор</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0091--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0091.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0091-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0091/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дыр вида «на сущность ссылаются, а статьи нет» у этой пары нет вообще: оба участника заведены и написаны — <code>PS-0383</code> Имитатор (статья 101 447, база 136 900, семь ссылок), <code>PS-0082</code> Спартанец (статья 7 650, база 3 332, одна ссылка). Чинить первым надо не содержание, а обрыв.</p>\n<p>Пара стоит нулём: <code>GR-0091</code> — ноль входящих ссылок, и наружу из неё ведут ровно две — на своих же двоих участников. При этом в тексте статьи названы две готовые соседние сущности, и ни одна не подцеплена. Первая — командир: он занимает весь раздел «Отношения с другими группами» и даёт единственную внешнюю привязку силы («Имитатор слабей командира»), а в базе это <code>PS-0077</code> Командир — статья есть, база 15 954, три ссылки. Вторая — <code>GR-0088</code> «Сильнейший отряд (отряд Командира)»: статья есть, база пустая, входящих ссылок ноль, то есть на сильнейший отряд «Цветного мира» не ссылается ни одна статья справочника, хотя именно его командир здесь и упомянут. Третья — <code>GR-0029</code> «Отряд Имитатора времён 8-летней войны»: назван в первом разделе прямым текстом, ссылки нет. Пока эти три связи не проставлены, статья читается как тупик, а <code>GR-0088</code> остаётся висеть без единого упоминания.</p>\n<p>Вторая по цене — сам Спартанец. Под ним 3 332 знака базы, весь он — одно окно одного дня, и единственная статья, которая на него ссылается, эта. Если способность не найдётся, он остаётся обликом.</p>\n<h3>С чего начать</h3>\n<p>В базе искать нечего: под группу материала ноль, под Спартанца — одно окно. Всё лежит в архиве, ориентир узкий и точный.</p>\n<p>Первое окно — 2024-05-25, id 173135–173232, целиком. Смотреть надо не начало (там всё уже вытащено), а место обрыва: id 173145–173147, где Слава на предложенные концепции не отвечает, а переходит на командира. Проверить, не всплывает ли ответ про Спартанца позже в том же окне, между 173147 и 173222 — этот кусок в статье не разобран, из него взяты только реплики про Имитатора на 14:47–14:48.</p>\n<p>Второе — 2024-07-04, id 196162, отряд Имитатора: оттуда идёт связь на <code>GR-0029</code>, и заодно видно, куда Имитатор ушёл из «Цветного мира».</p>\n<p>Третье, побочное — <code>ID-0062</code> «Деконструкция образа командира» (база 4 420, статьи нет, одна ссылка, «Цветной мир»). Если командира сюда всё-таки привязывать, эту запись стоит прочесть до того, а не после.</p>\n<h3>Как развивалось</h3>\n<p>2024-05-25, 14:03 — заявили одной строкой, в ответ на встречный вопрос, а не как отдельную тему: «Кстати спартанец напарник имитатор». Тогда же Имитатор получил статус, Спартанец — только внешний вид.</p>\n<p>14:04–14:06 — ограничили: Миколай сузил Спартанца до трёх известных концепций мышечной силы и сам оценил их как «норм концепция, можно дополнить или объединить с другой».</p>\n<p>14:07 — забыли: реплика «И кстати раз пошли суда то ещё вопрос», и разговор ушёл на командира. Ни один из трёх вариантов не принят и не отклонён.</p>\n<p>14:47–14:48 — вернулись, но только к одной половине пары: уточнили, что Имитатор человек, и что он слабей командира. Спартанец в возврат не попал.</p>\n<p>После этого дня Имитатор разрабатывается ещё два года и в четырёх вселенных, Спартанец не упоминается ни разу.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Сила Имитатора соотнесена с внешней точкой отсчёта: «Имитатор слабей командира». Это правило — мерить участника относительно командира — названо и применено. Для Спартанца, стоящего в той же паре, в той же вселенной и в том же разговоре, такого соотнесения нет: он напарник одного из сильнейших существ, но где он на той же шкале, не сказано. Место есть, шкала есть, второй случай под неё не подведён.</p>\n<h3>Отклик</h3>\n<p>Тут почти не за что зацепиться — вся группа это одна строка и полчаса разговора, и честнее это признать. Но одно место всё-таки держит: «Тобиж не человек» — «Человек» — «Там все люди» — «Пока что». Четыре реплики, из которых первые три закрывают вопрос, а четвёртая его заново открывает и оставляет открытым навсегда. И Спартанец — голый, в железных ботинках, трусах и шлеме. Порядок сборки виден насквозь: сначала придумали, как он выглядит, и только потом спохватились, что он должен что-то уметь. Умения так и не нашли, а ботинки остались. По-моему, это довольно точно про то, как персонажи на самом деле заводятся.</p></div>", "r": []}];</script>
