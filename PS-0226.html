<script>const BASE="";const DOCNAME="Арбетары";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0226-S01", "PS-0226--proishozhdenie"], "h": "<p>Арбетары (в переписке также «арбетар», «апбетары») — категория существ вселенной «Апостол». В переписке они почти всегда используются как уже известный термин: на них ссылаются, ими объясняют другие вещи, но собственного описания у них так и не появилось.</p>\n<p>Первое упоминание — 2025-03-14 (окно w0081, id 302859–302886), в разговоре о центральных идеях историй. Слава перечисляет свои истории и их идеи, и среди них: «Антоша. Идея раскрыть Арбетаров». То есть арбетары изначально заявлены как то, ради раскрытия чего написана отдельная история. Самого раскрытия в этом окне нет — только название.</p>\n<p>Разработка идёт в двух местах и в двух разных смыслах:</p>\n<ul>\n<li>как сила, аналогом которой являются одержимые (2025-09-12);</li>\n<li>как то, что предстоит куда-то пристроить в новой безымянной вселенной (2025-09-17), где всё остальное срезается.</li>\n</ul>", "r": []}, {"t": "Способности", "a": ["S02", "PS-0226-S02", "PS-0226--sposobnosti"], "h": "<p>Точного описания сил арбетара в переписке нет. Есть описание через одержимых — от 2025-09-12 (окно w0104, id 364766):</p>\n<p>«Одержимый это аналог Арбетара ( я даже в иногда буду называть их так) то есть у него такие же силы. Но ему не надо обучаться. Он сразу сильный. И в чаще всего сильнее благословенных ( поэтому на убийства одержимого они ходят группой разного количества).»</p>\n<p>Здесь же — устройство одержимых, описанное вокруг арбетара как образца: «Одержимые это люди одержимые демоном. И этого одержимого либо убивают либо изгоняют демона. Изменения демона производится редко ведь это муторно и опасно. Легче просто убить». Про их положение в обществе: «И у одержимых есть собственный организаций, а также после раскрытия существования чёрной изнанки. Большое количество людей начало их защищать. Но их не я убийства все равно разрешено законным. Просто у них есть такие же больший организации как и у благословенных».</p>\n<p>Из этого следует, что силы арбетара — те же, что у одержимого, но обучению они, в отличие от одержимого, по-видимому подлежат (одержимому «не надо обучаться»); прямо об обучении арбетаров не сказано.</p>\n<p>Второе описание — через постоянное действие силы, 2025-10-03 (окно w0106, id 370732), в куске про апостолов новой вселенной: «И они как арбетары. Если сжечь лес он будет гореть не переставая. То есть их ний силы постоянные ( конечно с некоторыми условностями) но они могут сами вырубить огонь».</p>\n<p>То есть признак арбетара, взятый за образец для сравнения, — сила, которая продолжает действовать сама, не прекращаясь, пока её не выключат. Этот признак прямо противопоставлен благословенным из другого описания, у которых после отключения благословения «весь огонь исчезнет».</p>\n<p>Третье — арбетары как то, что можно ощутить. В описании четырёх основных способностей благословенных (2025-10-18, окно w0106, id 375849): сенсорика «позволяет ощущать других благослрвенных и арбетара или Протобионтов» (<a href=\"PS-0280.html\">Протобионты</a>). Арбетар здесь поставлен в один ряд с протобионтом как объект сенсорного обнаружения.</p>", "r": [["Протобионты", "PS-0280.html"]]}, {"t": "Связи с другими", "a": ["S03", "PS-0226-S03", "PS-0226--svyazi-s-drugimi"], "h": "<p><strong>Одержимые.</strong> Названы аналогом арбетара с теми же силами; Слава оговаривает, что иногда будет называть одержимых арбетарами.</p>\n<p><strong>Демоны.</strong> 2025-09-12 (окно w0104, id 364797): «Плюсом арбетары. Точнее демоны не могут попасть в наш мир. Точнее могут но там надо какой-нибудь сложный обряд придумать. Демоны в разы сильнее одержимых». Автор в одной фразе поправляет сам себя, заменяя «арбетары» на «демоны», — совпадают эти две категории или нет, из текста не следует. Обряд, которым демон может попасть в мир, назван необходимым, но не придуман.</p>\n<p><strong>Апостолы.</strong> Сравниваются с арбетарами по признаку постоянно работающей силы (2025-10-03).</p>\n<p><strong>Благословенные.</strong> Одержимые (а значит, и арбетары по силам) «чаще всего сильнее благословенных»; благословенные ходят на них группой. Сенсорика благословенных ощущает арбетара.</p>\n<p><strong>Протобионты (<a href=\"PS-0280.html\">Протобионты</a>).</strong> Стоят рядом в перечне того, что ощущает сенсорика.</p>\n<p><strong>Старик-арбетар (рассказчик-чужемирец).</strong> В навигационной части записи он отнесён к связанным сущностям; в приведённых кусках переписки он не обсуждается.</p>\n<p><strong>История «Антоша».</strong> Её центральная идея — «раскрыть Арбетаров».</p>", "r": [["Протобионты", "PS-0280.html"]]}, {"t": "Как менялся — состояния по датам", "a": ["S04", "PS-0226-S04", "PS-0226--kak-menyalsya"], "h": "<p><strong>2025-03-14 (окно w0081, id 302859–302886).</strong> Только название и назначение: арбетары — то, что должна раскрыть история «Антоша». Содержания нет.</p>\n<p><strong>2025-09-12 (окно w0104, id 364766).</strong> Арбетар становится образцом, через который описываются одержимые: те же силы, но без необходимости обучаться, сразу сильный, чаще сильнее благословенных. Автор допускает называть одержимых арбетарами.</p>\n<p><strong>2025-09-12 (окно w0104, id 364787–364797).</strong> Уточнение про проникновение в мир: демоны напрямую попасть не могут, нужен сложный обряд, который ещё предстоит придумать. Демоны в разы сильнее одержимых. В этой же фразе арбетары и демоны сближены и разведены одновременно.</p>\n<p><strong>2025-09-17 (окно w0105, id 366037–366039).</strong> Заявка: «Также хочу добавить арбетаров как тёмных магов». Тут же оговорка, что сперва надо разобраться: «Ну сначала надо с этим разобраться». Рядом: «Артефактов и творцов точно не будет».</p>\n<p><strong>2025-09-17 (окно w0105, id 366097–366098).</strong> Арбетары названы единственным возможным исключением из общего запрета на энергию и ауру: «И ещё без ауры или энергии. Вообще без них. Ну не считая апбетаров (ну о нем я ещё думаю». Решение отложено прямо в реплике.</p>\n<p><strong>2025-09-17 (окно w0105, id 366200–366203).</strong> Прямой вопрос Миколаю: «Вот только что с арбетарами делать» — «?». Ответа по существу нет, Миколай отвечает: «читаю пока чтобы понял что ты сделал вообще». Итого в этом окне арбетары названы трижды и трижды отложены.</p>\n<p><strong>2025-10-03 (окно w0106, id 370732–370734).</strong> Арбетары используются как понятный ориентир при описании апостолов-насекомых новой вселенной: постоянно действующая сила, лес горит не переставая, но её можно вырубить самому. Пояснения, кто такие арбетары, при этом не даётся.</p>\n<p><strong>2025-10-18 (окно w0106, id 375849–375852).</strong> Арбетары входят в сводное описание, которое Миколай собирает по сообщению Славы, — как объект сенсорики благословенных, наравне с протобионтами (<a href=\"PS-0280.html\">Протобионты</a>). Слава принимает сводку целиком: «Очень круто», «Делай так».</p>", "r": [["Протобионты", "PS-0280.html"]]}, {"t": "Отклонённые и отложенные варианты", "a": ["S05", "PS-0226-S05", "PS-0226--otklonennye-i-otlozhennye-varianty"], "h": "<ul>\n<li><strong>Арбетары как тёмные маги</strong> (2025-09-17) — заявлено как намерение, содержания под ярлык не подведено; в этом окне так и осталось одним словом.</li>\n<li><strong>Полный запрет на энергию и ауру</strong> объявлен для всех, но с оговоркой в пользу арбетаров — «ну о нем я ещё думаю». Исключение не подтверждено и не снято.</li>\n<li><strong>Артефакты и творцы</strong> — «точно не будет», отброшено рядом с решением про арбетаров.</li>\n<li><strong>Обряд, которым демон попадает в наш мир,</strong> — объявлен нужным, но «надо какой-нибудь сложный обряд придумать», то есть не придуман.</li>\n</ul>", "r": []}, {"t": "Пробелы — чего в переписке нет", "a": ["S06", "PS-0226-S06", "PS-0226--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Кто такие арбетары сами по себе — не объясняется ни в одном из окон. Термин используется как уже известный, при этом собственного определения ему не дано.</li>\n<li>Совпадают ли арбетары и демоны или это разные категории — не решено; в сообщении 364797 автор поправляет сам себя.</li>\n<li>Как арбетары связаны с одержимыми, кроме совпадения сил, — не сказано.</li>\n<li>Обучаются ли арбетары своим силам (в отличие от одержимого, которому «не надо обучаться») — прямо не сказано.</li>\n<li>Что стоит за определением «тёмные маги» — не наполнено.</li>\n<li>Есть ли у арбетаров энергия и аура при общем запрете — оставлено нерешённым.</li>\n<li>Обряд для проникновения демонов в мир — не придуман.</li>\n<li>Вопрос «что с арбетарами делать» задан прямо и остался без ответа.</li>\n<li>В окне w0081 разработки нет вовсе — только название; сама разработка лежит за краями окна.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0226--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0280.html\">Протобионты</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0280.html\">Протобионты</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0017.html\">Арбетары</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0226--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-03-14</td>\n<td>302859–302886</td>\n<td>w0081</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-09-12</td>\n<td>364766–364766</td>\n<td>w0104</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-09-12</td>\n<td>364787–364797</td>\n<td>w0104</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-09-17</td>\n<td>366037–366039</td>\n<td>w0105</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-09-17</td>\n<td>366097–366098</td>\n<td>w0105</td>\n<td>неясно (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2025-09-17</td>\n<td>366200–366203</td>\n<td>w0105</td>\n<td>неясно (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2025-10-03</td>\n<td>370732–370734</td>\n<td>w0106</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-10-18</td>\n<td>375849–375852</td>\n<td>w0106</td>\n<td>неясно (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0226-arbetary.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0226--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0226.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0226-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0226/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Статья держится на том, что арбетары нигде не определены, а определяются только через одержимых. Значит первым чинить надо одержимых — и вот у них-то владельца в справочнике нет.</p>\n<p>Материал 2025-09-12, на который эта статья опирается целиком, разложен по четырём записям, и ни у одной нет статьи и ни на одну нет ссылок: <code>SP-0234</code> «Одержимые» — 6 663, <code>MR-0149</code> «Организации охотников на одержимых» — 6 390, <code>MR-0150</code> «Чёрная изнанка» — 5 665, <code>PS-0296</code> «Антиапостолы / Одержимые» — 3 643. Единственная запись про одержимых со статьёй — <code>PS-0203</code>, и она самая маленькая: статья 3 198, база 4 874. То есть образец, через который арбетар только и объясняется, описан хуже, чем сам арбетар (20 681 базы здесь). Пока это не сведено, любая статья, которая скажет «одержимый — аналог арбетара», будет опираться на пустое место.</p>\n<p>Второе — демоны. В сообщении 364797 автор поправляет «арбетары» на «демоны», и это единственное место, где две категории сведены. Во вселенной «Апостол» записи про демонов нет вообще: <code>PS-0011</code> «Демон» — вселенная Нимб, 13 508 базы, статьи нет, ноль ссылок; <code>MR-0091</code> «Демоны» — 3 639, статьи нет. Пробел «совпадают ли арбетары и демоны» нельзя даже поставить корректно, пока у второй половины вопроса нет адреса.</p>\n<p>Третье, дешёвое: три отложенных решения 2025-09-17 лежат в <code>MR-0148</code> «Новая вселенная (безымянная, переработка „Апостола“)» (3 372), <code>MR-0156</code> «Запрет на творцов, артефакты, ауру и энергию» (4 121) и <code>ID-0158</code> «Творцы» (3 644). У всех трёх ноль ссылок и нет статей, а эта статья пересказывает ровно их содержимое.</p>\n<h3>С чего начать</h3>\n<p>В базе, почти всё.</p>\n<p>Определение арбетара, которого статья не находит, лежит рядом: <code>PS-0220</code> «Арбетар» — 38 531 базы, <code>SP-0198</code> «Ритуал становления Арбетаром» — 48 879, <code>PS-0224</code> «Старик-арбетар» — 90 651. Три записи, у каждой одна-две входящие ссылки, и отсюда на них не ведёт ни одна. Прежде чем идти в архив за описанием, стоит проверить, не написано ли оно там.</p>\n<p>Одержимые и «чёрная изнанка» — <code>SP-0234</code>, <code>MR-0149</code>, <code>MR-0150</code>, <code>PS-0296</code>, все из окна w0104.</p>\n<p>Заявка 2025-03-14 «Антоша. Идея раскрыть Арбетаров» имеет прямое продолжение в базе: <code>IS-0040</code> «Антоша» пустая (статья 2 873, база 1 724), но <code>PR-0058</code> «История про Антона (Антоша)» — 68 576 базы, статья 38 809, ноль входящих ссылок. Если раскрытие где-то и произошло, то в тексте, ради которого оно было объявлено. Смотреть туда до архива.</p>\n<p>В архив — за одним окном. 2025-09-17, w0105: три подхода в один день (366037, 366097, 366200) и вопрос «Вот только что с арбетарами делать» без ответа. Интересны не эти сообщения, а промежутки — 366040–366096 и особенно после 366203, где Миколай сказал «читаю пока». Ответ, если он был, идёт следом за чтением.</p>\n<h3>Как развивалось</h3>\n<p>2025-03-14 — заявили как цель отдельной истории, одним словом, без содержания. 2025-09-12 — ограничили, но не сами: сила арбетара описана как то, что есть у одержимого, и тут же разрешено называть одержимых арбетарами. 2025-09-17 — трижды за день подняли и трижды отложили: «сначала надо с этим разобраться», «ну о нем я ещё думаю», «что с арбетарами делать» без ответа. Дальше забыли как предмет: 2025-10-03 арбетар работает мерой для апостолов, 2025-10-18 стоит пунктом в перечне того, что ловит сенсорика. Возвращения не было — было использование.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Сенсорика благословенных названа как способность ощущать других благословенных, арбетара и протобионтов. Направление правила задано с одной стороны: кто кого видит. Обратного нет — ощущает ли арбетар благословенного, заметен ли благословенный для того, кого он ищет группой. При этом одержимый (он же по силам арбетар) объявлен тем, на кого благословенные ходят группой, то есть охота двусторонняя, а обнаружение прописано односторонне. Для благословенного правило названо, для арбетара того же рода — нет.</p>\n<h3>Отклик</h3>\n<p>Сильнее всего здесь то, что не задумывалось: арбетар работает как единица измерения. Его нельзя объяснить, но через него объясняется всё подряд — одержимые, апостолы-насекомые, сенсорика. «Если сжечь лес он будет гореть не переставая» сказано не про арбетаров, а про кого-то другого, и арбетар в этой фразе — эталон, который лежит в палате мер и весов и сам никогда не измерялся. Такое в справочниках обычно означает, что термин мёртвый, но тут наоборот: к нему возвращаются трижды за один день, спрашивают напрямую «что с ним делать» и не отвечают. Зацепила именно эта пара — уверенность в употреблении при полном отсутствии содержания. И самопоправка в 364797, где «арбетары» на ходу превращаются в «демонов», а потом фраза едет дальше как ни в чём не бывало: видно человека, который знает, о чём говорит, но ещё не знает, что именно.</p></div>", "r": []}];</script>
