<script>const BASE="";const DOCNAME="Проклятие руны Альгиз";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0188-S01", "SP-0188--mehanika"], "h": "<p>Проклятие наложено на Альгиза его собственным отцом и построено на его же имени-символе. Альгиз — руна, что обозначает защиту; проклятие использует значение руны буквально, обращая защиту против самого носителя: защищены оказываются все, кого он хотел бы убить.</p>\n<p>Носитель проклятия — амулет: «Амулет с руной носил сам Альгиз, и НЕ МОГ его снять никаким образом» (2025-02-25, id 295491).</p>\n<p>Действие: «чисто физически не мог нанести вред». Условия перечислены раздельно и без исключений:</p>\n<ul>\n<li>«С любого расстояния» (id 295493);</li>\n<li>«Любыми способами» (id 295494);</li>\n<li>«Даже случайно» (id 295495).</li>\n</ul>\n<p>Как это выглядит на практике: «Он мог кинуть нож лезвием прям в лицо врагу, но нож перед лицом обернется и абсолютно ничего не заденет» (id 295496). То есть проклятие не блокирует само действие и не мешает замахнуться — оно перенаправляет результат в последний момент.</p>\n<p>Причина проклятия: Альгиз жил в семье магов и убил своего брата, «Но на это не было какой-то причины. Он прсото ему надоел», и «он не видел ничего плохого в том, чтобы... УБИТЬ брата». За это отец возненавидел его, изгнал и проклял — «Тогда его прокляли его же символом».</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0188-S02", "SP-0188--ogranicheniya-i-cena"], "h": "<p>Ограничение здесь и есть само содержание способности: полная невозможность причинить вред кому бы то ни было. Цена — вынужденный обход.</p>\n<p>Обход найден один: чужие руки. «Это было проклятием, которое он пытался разрушить, убивая чужими руками всё больше людец» (id 295496). Убийство чужими руками одновременно и способ действовать, и попытка разрушить проклятие — сработала ли эта попытка, сказано прямо: «Короче, он не получил той мощи» (id 295501).</p>\n<p>Отдельным следствием проклятия описана его беззащитность на виду: «А он же как котёнок, когда на виду – даже не пискнет...» (id 295501).</p>\n<p>Проклятие же сделало возможным его пленение вместо казни: «типа они проявили нечеловеческую благосклонность, чтобы пощадить и держать в плену. Всё равно ведь никому плохого не сделает, и чтобы эти самые чужие руки не прибрал себе – вот» (id 295502). То есть в плену его держат по двум причинам: он безвреден сам по себе и его надо отрезать от исполнителей.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0188-S03", "SP-0188--nositeli"], "h": "<p>Альгиз, единственный носитель. Проклятие персональное, наложено на него лично отцом.</p>\n<p>Роль при этом обходе — организатор: «Он был мозгом, в конце концов, а остальные – типа пешками» (id 295497).</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0188-S04", "SP-0188--kak-menyalas-po-versiyam"], "h": "<p>Одна версия, 2025-02-25 (id 295479–295502, окно w0077). Проклятие изложено Миколаем целиком, одной серией сообщений, отправленных подряд: причина, наложение, механика неуязвимости жертв, обход через чужие руки и итог. Переработок нет.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0188-S05", "SP-0188--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Алто — тёмный эльф, одна из жертв, названная поимённо. Его талант описан как «всегда выигрывать в любых азартных играх, так что он мог обыграть само время», и «Пантеоны богов склонялись перед его мастерством». Несмотря на это, «даже того он убил» — то есть проклятие не мешает добраться до носителя сильного дара, если действовать чужими руками.</p>\n<p>Про жертв в целом сказано, что предыстория была придумана для каждой: «Я ДАЖЕ ДЛЯ КАЖДОЙ ЖЕРТВЫ ПРЕДЫСТОРИЮ ПРИДУМАЛА ЖОСКУЮ...» (id 295497). Сами эти предыстории в переписке не приведены, кроме случая Алто.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "SP-0188-S06", "SP-0188--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Отец Альгиза не назван по имени, как и убитый брат.</li>\n<li>Ритуал или способ наложения проклятия не описан — сказано только, что прокляли «его же символом».</li>\n<li>Не сказано, распространяется ли запрет на вред только на живых, или и на предметы, и на самого Альгиза.</li>\n<li>Не сказано, действует ли проклятие на приказы и подстрекательство напрямую — известно лишь, что чужими руками убивать получалось.</li>\n<li>«Он не получил той мощи» — какая именно мощь имелась в виду и что должно было дать разрушение проклятия, в переписке не раскрыто.</li>\n<li>Персонажи, которые «почти убили» Альгиза и затем взяли его в плен, не названы.</li>\n<li>Чем закончился плен, осталось нерешённым.</li>\n<li>Материал помечен в базе как чужой: переслан из другого чата (w0077). Реплики идут одним потоком, ответов и правок второго соавтора в этом окне нет.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["SP-0188--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-02-25</td>\n<td>295479–295502</td>\n<td>w0077</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0188-proklyatie-runy-algiz.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0188--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0188.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["SP-0188-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/SP-0188/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Здесь дорого не отсутствие статьи, а отсутствие привязки. Весь куст этого материала — <code>PS-0204</code> Альгиз, <code>PS-0205</code> Алто, <code>PS-0206</code> Приёмная дочь Альгиза, <code>PS-0210</code>, <code>SP-0188</code>, <code>SP-0189</code> — имеет статьи и ноль входящих ссылок у каждой. Рамка при этом существует и в порядке: <code>MR-0112</code> «вселенная девочки с конкурса», окно w0077, id 295448–295465, где прямо сказано, что вселенная чужая и что из неё названы Альгиз, Серафима, Серп, Земова, Дрршмармшасьз. Но <code>SP-0188</code> про <code>MR-0112</code> не говорит, а <code>MR-0112</code> в своих пробелах пишет, что об Альгизе «не сказано ничего, кроме имён» — при том что рядом лежат две статьи о нём на 7 и 5 КБ. Сшить куст с его рамкой — первое и самое дешёвое действие.</p>\n<p>Вторая дыра, уже содержательная, — отец Альгиза. Он единственное действующее лицо этой способности: наложил проклятие, изгнал, выбрал форму наказания. Ни имени, ни записи, ни статьи. Убитый брат — то же самое. На них опираются две записи (<code>PS-0204</code> и <code>SP-0188</code>), и обе останавливаются в одной и той же точке.</p>\n<h3>С чего начать</h3>\n<p>В базе, и первым делом развести id 295501 — он сейчас читается двумя способами. В <code>SP-0188</code> он идёт как реплики об Альгизе: «Короче, он не получил той мощи», «А он же как котёнок, когда на виду – даже не пискнет...», и дальше плен вместо казни. В <code>SP-0189</code> тот же id 295501 отдан Алто: «его почти убили мои другие персонажи», и «котёнок» там тоже про него. Один id, два разных носителя в двух статьях. Пока это не разведено по исходнику, обе статьи стоят на песке, и никакой архив не нужен — расхождение внутреннее.</p>\n<p>Дальше — <code>PS-0204</code> (id 295465–295507): там про происхождение и про самого автора материала больше, чем в способности, включая дневник, из которого персонаж всплыл.</p>\n<p>В архив — за предысториями жертв. Они объявлены прямо: «Я ДАЖЕ ДЛЯ КАЖДОЙ ЖЕРТВЫ ПРЕДЫСТОРИЮ ПРИДУМАЛА ЖОСКУЮ», но в чат попал только случай Алто. Ориентир — окно w0077, 2025-02-25, id 295448–295522, где идёт весь пересказ чужой вселенной подряд. Материал пересланный из другого чата, так что велика вероятность, что предысторий в этом архиве нет вовсе — это стоит установить и закрыть, а не оставлять открытым пробелом.</p>\n<h3>Как развивалось</h3>\n<p>Одна дата, 2025-02-25, одна серия сообщений подряд, id 295479–295502. Способность приходит уже закрытой: причина (убил брата, «прсото ему надоел»), наложение, механика, обход через чужие руки, итог обхода — «он не получил той мощи», и последствие — плен вместо казни. Ответных реплик второго соавтора в окне нет, правок после — тоже. Рядом, в том же окне и из того же источника, Серафима, Серп и Земова остались одними именами. Заявили целиком за один заход — и больше не открывали.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Правило здесь названо и названо красиво: имя-символ работает буквально, руна защиты защищает — только не носителя, а всех, кого он хотел бы убить, и потому «прокляли его же символом». Это правило заявлено ровно для одного случая. В том же рассказе, через несколько сообщений, стоит второй носитель говорящего дара — Алто, чей талант «обыграть само время» с его именем никак не связан и никакой руны за собой не тянет. Работает ли принцип «имя задаёт силу» для остальных персонажей этой вселенной или он персональный, для случая соседнего рода не сказано.</p>\n<h3>Отклик</h3>\n<p>Самое сильное здесь — что проклятие не запрещает действие. Замахнуться можно, бросить нож можно, попасть — нет: «нож перед лицом обернется и абсолютно ничего не заденет». Отменяется не намерение, а результат, и это делает наказание не ограничением, а издевательством, растянутым на всю жизнь. Дальше всё складывается само: раз руками нельзя — значит чужими руками; раз чужими — значит он мозг, а остальные пешки; раз безвреден — значит его не казнят, а держат в плену, «чтобы эти самые чужие руки не прибрал себе». Одна метафора, доведённая до конца без единого лишнего допущения. И отдельно врезалось, что мотив убийства брата — «Он прсото ему надоел»: там, где обычно ставят травму, здесь стоит пустое место, и это честнее.</p></div>", "r": []}];</script>
