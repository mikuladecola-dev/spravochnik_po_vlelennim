<script>const BASE="";const DOCNAME="Способы покинуть свой мир";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0140-S01", "MR-0140--ustroystvo"], "h": "<p>Запись описывает не отдельный мир, а общее правило перехода между мирами, изложенное Славой в двух окнах (2025-05-31, id 331635–331636; 2025-10-18, id 375843–375852).</p>\n<p>Исходная рамка: правители — «не физические существа появившиеся в нигде и в ни чем». Они первое, что появилось в пустоте, и именно они начали создавать мир, по своему желанию. Между всеми мирами есть связь, «которую не может оборвать не один правитель». Первым правителем был правитель кильки, вторым — правитель рая, «поэтому их мир в разы больше миров других правителей».</p>\n<p>Способов покинуть свой мир названо четыре:</p>\n<ol>\n<li>«С помощью ритуала???» — способ записан сразу с тремя вопросительными знаками, механика не придумана.</li>\n<li>Дойти до края мира и прыгнуть за него. Работает, «если ваш мир маленький или средний». Прыжок за край переносит в другой мир, «чаще всего килькв» — потому что существа, покидающие свой мир, «неосознанно перемещаться по связи, а связь с килькой у каждого другого мира сильная».</li>\n<li>Попасть в пространственную аномалию.</li>\n<li>Быть выкинутым самим правителем — «очень очень очень, крайне редко».</li>\n</ol>\n<p>Общее условие: «Любое существо может покинуть свой мир если будет знать способ». Из этого правила одно исключение: «всё существа кильке не способны покинуть свой мир. Не каким либо образом».</p>\n<p>К этому же блоку относятся артефакты. Артефакт — объект, имеющий силу правителя: когда-то правитель пытался создать мир, «и не в состоянии полностью контролировать этот процесс наделили какой-либо объект через чур большой сил этот самый объект». Благословенные, альфы, арбетары и фантазёры не способны раскрыть всю мощь артефакта, «так как уже сами переполненный силой»; лучше всего мощь артефакта раскрывает обычный человек.</p>\n<p>Отдельный подкласс — артефакты с символикой: не созданы никем, появились вместе с правителями, имеют невероятную мощь, но «смертным существами некогда не раскрыть хотя бы 3 процентов всей мощи артефакт».</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0140-S02", "MR-0140--naselenie"], "h": "<p>В том же изложении перечислены категории существ, к которым правило перехода применяется.</p>\n<p><strong>Правители.</strong> Не физические существа, создатели миров. Могут давать благословение, но «не как не могут влиять на благословенного или обычного существа» — кроме как насильственно дать благословение, даже если само существо этого не хочет. При этом правители всевидящие.</p>\n<p><strong>Протобионты.</strong> Дети правителей — «субъект, который был создан именно правителем, а не из-за особенности мира». Имеют огромную силу, «которая в теории позволит уничтожить континент», но большинство спокойные и миролюбивые. «При этом они очень не любят покидать мир своего родителя».</p>\n<p><strong>Благословенные.</strong> Благословение — настройка связи правителя с существом, живущим в мире; в тексте оговорено, что «благословения даётся только существами живущими в кильке». Связь устанавливается без разрешения существа и «устанавливается на мозге»: сила проходит через мозг, вредя ему. Поэтому благословенные нечасто пользуются благословением. Средняя продолжительность жизни благословенного после получения благословения — 10 лет. Благословение даётся только одно, «больше человек не выдержит», оно остаётся с человеком до смерти, и «благословения нельзя разорвать».</p>\n<p>При активации благословения у всех благословенных есть четыре основные способности: усиленная регенерация; усиление тела и всех чувств; аура («то бишь самая энергия, которая выплескивается и заставляет чувствовать страх е животных и обычных людей. Так же способный влиять на окружающей. При сильном скоплении»); сенсорика, позволяющая ощущать других благословенных, арбетара или протобионтов.</p>\n<p>Сверх этого у благословенного есть уникальная способность правителя. Уникальность здесь относится к правителю, а не к человеку: если правитель даст благословение ещё кому-то, способность будет такая же. Всё, что сделано благословением, исчезает при его отключении: подожжённый лес гаснет, «буть то огненный шар или остановка времени они просто отключаться».</p>\n<p>Поскольку все благословенные, включая апостолов, получают «плюс минус одинаковая количество энергии», они одинаково сильны — не считая индивидуальности людей; «всё же апостолы всё равно чаще всего сильнее любого другого благословенного».</p>\n<p><strong>Апостолы.</strong> 21 человек, получивший благословение от правителя рая; 21 — «максимальное число благословения, который способен давать правитель рая», другие правители дают меньше. Дополнительная способность — телепатия между собой: могут говорить на расстоянии и все вместе, могут отказаться от телепатического общения и прервать разговор. Их способности, в отличие от благословенных других правителей, разные, потому что правитель рая посылает им «лишь сгустки чистой и необработанной силы, который формируется во что уже только внутри Апостолов».</p>\n<p><strong>Арбетары и Альфы.</strong> Одни и те же существа: арбетары — люди из кильки, альфы — чужемирцы. Это существа, которые «насильственно вырвали кусок силы своего мира» (тем самым недоработанным ритуалом), поселили его в себе и заставили выделять силу. Так как сила внутри них, они пользуются ею без ограничений — «по сути это благословенния только не через связь», в виде перегрузки мозга. Базовые умения те же четыре, причём регенерация «чаще всего превосходит благословенных». Уникальная способность у них тоже индивидуальная: даже если они схватили один и тот же кусок силы, кусок формируется внутри подобно апостольскому. Их эффекты не выключаются — подожжённый лес будет гореть, пока не выгорит или пока его не потушат: «Им не зачем отключат способность. У них даже нету такого понятия, как отключения». Зато им приходится учиться вырабатывать энергию, использовать способность и контролировать энергию, тогда как у благословенных «это выходит автоматический».</p>\n<p><strong>Фантазёры.</strong> «Правитель с маленькой буквой». Создали свой мир в голове и из-за этого видят мир, где находится их физическая оболочка, иначе. Пример: фантазёр, видящий мир в виде линий и колебаний — глядя на стену, он видит «лишь большо миллиона движущих линий, который за, что-то отвечают». Поэтому он может влиять на наш мир по законам своего: изменить колебание нитки, и стена станет воздухом, водой или взорвётся — смотря какую нитку потянули. На момент записи фантазёры — сильнейшие существа, но они могут просто исчезнуть, потеряв связь с нашим миром и полностью уйдя в свой. Из-за этого их очень мало: «Ведь нет не одной причины жить в мире правителя. Если ты можешь попасть в свой».</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Дороже всего <code>SL-0089</code> «Список категорий сил (Благословенный, Арбетары, Альфы, Чужемирцы, Владельцы артефактов, Фантазёры)»: статьи нет, в базе 1 753 знака, ссылок четыре. Раздел «Население» этой статьи — это и есть тот список, развёрнутый по пунктам: правители, протобионты, благословенные, апостолы, арбетары и альфы, фантазёры. На ту же служебную запись смотрят <code>MR-0146</code>, <code>MR-0121</code>, <code>MR-0117</code>, <code>MR-0100</code>, <code>MR-0107</code>, <code>GR-0013</code>, <code>GR-0017</code>, <code>GR-0018</code>, <code>GR-0019</code>, <code>PS-0281</code>, <code>PS-0270</code>, <code>PS-0278</code>, <code>PS-0280</code>. То есть каркас классификации сил во всей вселенной держится на записи без статьи и почти без материала, а его развёрнутая версия лежит внутри записи, которая по типу числится миром и называется «Способы покинуть свой мир».</p></div>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0140-S03", "MR-0140--mesto-vo-vselennoy"], "h": "<p>Правило держится на связи миров: связь есть между всеми мирами, ни один правитель её не рвёт, и по ней происходит неосознанное перемещение. Килька — узловая точка: связь с килькой у каждого другого мира сильная, поэтому прыгнувших за край чаще всего выносит именно туда. При этом сама килька — тупик: её обитатели не могут выйти никаким способом.</p>\n<p>Второй по времени мир — рай, мир второго правителя; вместе с килькой его мир «в разы больше миров других правителей».</p>\n<p>Связано с: Килька, Правители, Чужемирцы. Запись отнесена к правителям как часть.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0140-S04", "MR-0140--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-05-31 (окно w0099, id 331635–331636).</strong> Слава излагает всю систему целиком: правители, четыре способа покинуть мир, оговорка про кильку, протобионты, благословение и его цена, апостолы, арбетары и альфы, фантазёры, артефакты и артефакты с символикой. Вселенная на этот момент объявлена — Апостол.</p>\n<p><strong>Версия 2 — 2025-10-18 (окно w0106, id 375843–375852).</strong> Миколай присылает ссылку на набросок оформления (codepen) и предлагает: «что если так?», «ваще простенький набросок, но вот если так будет». Оговаривает, что набросок сделан «только по одному твоему сообщению», и цитирует текст версии 1 обратно. Процитированный фрагмент обрывается на абзаце про апостолов — часть про арбетаров, альф, фантазёров и артефакты (сообщение 331636) в него не входит. Слава отвечает: «Очень круто», «Делай так». Содержание правила при этом не менялось: перечень способов и оговорка про кильку воспроизведены дословно. Вселенная по дате объявления на этот момент неясна.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0140-S05", "MR-0140--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Ритуал — первый из четырёх способов — не придуман. В обоих окнах (w0099, w0106) он записан самим автором как «С помощью ритуала???», с вопросительными знаками прямо в тексте. Тот же нерешённый ритуал упоминается как механизм, которым арбетары и альфы вырывают кусок силы своего мира: «с помощью ритуала??? Которой я ещё не доработал».</li>\n<li>Что такое пространственная аномалия, откуда она берётся и где встречается — в переписке не сказано.</li>\n<li>Почему правитель кого-то выкидывает из мира и в каких случаях это происходит — не описано, указана только крайняя редкость.</li>\n<li>Причина, по которой существа кильки не могут покинуть свой мир, не объяснена; запрет дан как факт.</li>\n<li>Как соотносятся между собой запрет на выход из кильки и то, что арбетары — «люди из кильке», в переписке не разбиралось.</li>\n<li>Обсуждения способов перехода в окне w0106 не было: Слава принял текст как есть, вопросов Миколай не задавал.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0140--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0023.html\">Правители (правители миров, правители минимиров)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0140--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-05-31</td>\n<td>331635–331636</td>\n<td>w0099</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-10-18</td>\n<td>375843–375852</td>\n<td>w0106</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0140-sposoby-pokinut-svoy-mir.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0140--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0140.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["MR-0140-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/MR-0140/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дороже всего <code>SL-0089</code> «Список категорий сил (Благословенный, Арбетары, Альфы, Чужемирцы, Владельцы артефактов, Фантазёры)»: статьи нет, в базе 1 753 знака, ссылок четыре. Раздел «Население» этой статьи — это и есть тот список, развёрнутый по пунктам: правители, протобионты, благословенные, апостолы, арбетары и альфы, фантазёры. На ту же служебную запись смотрят <code>MR-0146</code>, <code>MR-0121</code>, <code>MR-0117</code>, <code>MR-0100</code>, <code>MR-0107</code>, <code>GR-0013</code>, <code>GR-0017</code>, <code>GR-0018</code>, <code>GR-0019</code>, <code>PS-0281</code>, <code>PS-0270</code>, <code>PS-0278</code>, <code>PS-0280</code>. То есть каркас классификации сил во всей вселенной держится на записи без статьи и почти без материала, а его развёрнутая версия лежит внутри записи, которая по типу числится миром и называется «Способы покинуть свой мир».</p>\n<p>Второе — сама эта путаница типа. <code>MR-0140</code> — не мир, это свод правил; в справочнике он проходит по мирам и стоит рядом с <code>MR-0121</code> «Три способа перехода между мирами» (статья, 4 234 в базе, одна ссылка), то есть с более ранней версией того же самого перечня. Две записи об одном правиле, разной длины, без связи между собой; на <code>MR-0140</code> ссылаются <code>PS-0179</code>, <code>PS-0198</code>, <code>PS-0279</code>, <code>PS-0280</code>, <code>SP-0181</code>, <code>MR-0138</code>, <code>MR-0093</code>, на <code>MR-0121</code> — свои.</p>\n<p>Третье — <code>ID-0126</code> «Нераскрытые термины: альфа, благословенный, силы зверя, классификация, арбетары, аномалия, существа»: статьи нет, 3 566 знаков, ноль ссылок. Этот свод закрывает почти весь тот список — кроме «сил зверя» и «классификации», которые так и остались словами.</p>\n<h3>С чего начать</h3>\n<p>В базе, и очень конкретно. Первый из четырёх способов записан как «С помощью ритуала???» и помечен самим автором как непридуманный. При этом ритуал в базе разобран — только в другой ветке и под другой задачей: <code>SP-0198</code> «Ритуал становления Арбетаром» (статья 26 429 знаков, 48 879 в базе, две ссылки) и <code>SP-0201</code> «Сила от ритуала (энергия старика)» (статья, 21 913 в базе). Связь между ними в самой статье уже названа — арбетары вырывают кусок силы «тем самым недоработанным ритуалом», — но проверять, насколько эти два ритуала один и тот же, надо по <code>SP-0198</code>, а не по архиву. Это самый большой кусок материала, лежащий вплотную к самой явной дыре.</p>\n<p>Второй адрес — «пространственная аномалия», о которой сказано, что неизвестно, что это. В базе есть <code>MR-0116</code> «Аномалия (мир внутри Кильки)» (статья 4 399, 2 088 в базе, ноль ссылок) и <code>MN-0009</code> «Озеро перерождения» (статья 16 268, 22 625 в базе). Совпадают ли «аномалия» и «пространственная аномалия», нигде не сказано — но обе записи уже существуют, и сводить их надо между собой.</p>\n<p>В архив за этой статьёй идти почти незачем: окон всего два, и второе — дословный повтор первого. Единственное, что там стоит поднять, — обрыв цитаты 2025-10-18: в набросок вошло только сообщение 331635, а 331636 (арбетары, альфы, фантазёры, артефакты) не вошло. Смотреть w0106, id 375843–375852, и проверять, знает ли об этом обрыве кто-нибудь, кроме статьи.</p>\n<h3>Как развивалось</h3>\n<p>Вся система изложена одним заходом 2025-05-31: правители, четыре способа, оговорка про Кильку, протобионты, благословение с ценой в десять лет жизни, апостолы, арбетары и альфы, фантазёры, артефакты, артефакты с символикой. Одно окно, два сообщения, законченный свод. Дальше четыре с половиной месяца ничего. 2025-10-18 текст возвращается — но не как содержание, а как вёрстка: Миколай приносит набросок страницы, цитирует свод обратно и оговаривает, что сделал его «только по одному твоему сообщению»; Слава отвечает «Очень круто», «Делай так». Вопросов нет, обсуждения нет, три вопросительных знака в первом способе за это время не убавились и не прибавились. Изложили целиком — замолчали — вернулись за оформлением, причём вернулись к половине текста.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Про судьбу последствий правило названо с двух сторон и не названо с третьей. У благословенных всё, сделанное силой, исчезает при отключении: «буть то огненный шар или остановка времени они просто отключаться», подожжённый лес гаснет. У арбетаров и альф — наоборот, и это тоже проговорено явно: лес будет гореть, пока не выгорит, «у них даже нету такого понятия, как отключения». Две категории, зеркальное правило, обе стороны названы. Фантазёры в том же перечне объявлены сильнейшими существами на момент записи, действуют они прямой переделкой мира — потянул нитку, и стена стала воздухом, — и при этом могут просто исчезнуть, полностью уйдя в свой мир. Что происходит с потянутыми нитками, когда фантазёр ушёл, не сказано. Для двух категорий из трёх вопрос «остаётся ли сделанное после ухода силы» решён в обе стороны, для третьей — не поставлен.</p>\n<h3>Отклик</h3>\n<p>Сильнее всего тут то, что вопросительные знаки не стёрли. «С помощью ритуала???» стоит первым пунктом в списке способов покинуть мир — не в черновике, а в тексте, который потом дословно цитируют обратно и верстают на страницу. Дырка в мире отмечена прямо в мире, знаком препинания, и в таком виде и живёт полгода. И рядом — фантазёры, которые мне тут понравились больше всего: «правитель с маленькой буквой», человек, который так плотно придумал себе мир, что здешний видит как миллион движущих линий, и может дёрнуть за любую. Но зацепило не это, а объяснение, почему их мало: «Ведь нет не одной причины жить в мире правителя. Если ты можешь попасть в свой». Самые сильные существа системы выбывают из неё не потому, что их убили, а потому, что им тут нечего делать — и это единственный способ уйти из мира, который в списке из четырёх пунктов не значится.</p></div>", "r": []}];</script>
