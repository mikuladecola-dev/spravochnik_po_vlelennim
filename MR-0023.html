<script>const BASE="";const DOCNAME="Остров сталкера";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0023-S01", "MR-0023--ustroystvo"], "h": "<p>Остров, закреплённый за защитником по имени Сталкер (<a href=\"PS-0097.html\">Сталкер</a>). Строй описан в первом же заходе (2024-07-03, id 194962–194979): «ну это будет анархичное государство», «это хаос полный», «каждый сам за себя». Перечень того, из чего состоит быт острова, дан Миколаем списком: «гетто», «банды», «преступность», «убийства».</p>\n<p>К этому сразу приложено ограничение, которое гасит всю перечисленную активность: «там пиздец жарко» — «поэтому там это всё редко происходит». То есть анархия на острове заявлена как строй, но в постоянном режиме не работает: жара не даёт ей разворачиваться.</p>\n<p>Строй острова относится к общему разбору режимов правления островов (<a href=\"MR-0025.html\">Режимы правления островов</a>).</p>\n<p>Биом на первом заходе не закреплён. На следующий день (2024-07-04, id 196057–196062) остров получает второе определение — «Остров сталкера. Это остров наемников», и на вопрос Миколая «в чем её преступление?» Слава отвечает: «В пустыни». Пустыня, таким образом, вводится позже анархии и поверх неё.</p>", "r": [["Сталкер", "PS-0097.html"], ["Режимы правления островов", "MR-0025.html"]]}, {"t": "Население", "a": ["S02", "MR-0023-S02", "MR-0023--naselenie"], "h": "<p>Жители — по описанию версии 1 те, кого держит на месте только жара. Их поведение расписано через то, что будет, если они окажутся вне острова: «но если они попадут к другим, то они будут как звери», «хватать базовые для жизни вещи».</p>\n<p>По версии 2 остров — «остров наемников».</p>\n<p>Сам Сталкер (<a href=\"PS-0097.html\">Сталкер</a>) на острове не сидит. В обсуждении 2024-07-04 (id 196119–196123) Миколай ставит требование ко всем защитникам сразу: «я вот не хочу чтобы защитки чисто сидели». Слава отвечает: «Сталкер наемник», и рядом — «Имитатор часто будет покидать остров по заданием», а про остальных: «А остальные твой челики не знаю». Про то, почему преступная организация оказывается повсюду («почему преступленая организация везде», «как они и зачем расселись везде»), Слава отвечает: «Они не везде есть группа людей и все».</p>", "r": [["Сталкер", "PS-0097.html"]]}, {"t": "Место во вселенной", "a": ["S03", "MR-0023-S03", "MR-0023--mesto-vo-vselennoy"], "h": "<p>Часть архипелага «7 островов» (<a href=\"MR-0018.html\">7 островов</a>). В файле указаны связи с «7 островов и их защитники», с разбором режимов правления островов (<a href=\"MR-0025.html\">Режимы правления островов</a>) и со Сталкером (<a href=\"PS-0097.html\">Сталкер</a>).</p>\n<p>Вылазки жителей на другие острова прописаны прямо: попав к другим, они «будут как звери» и станут «хватать базовые для жизни вещи». Сам защитник острова действует за его пределами как наёмник.</p>", "r": [["Сталкер", "PS-0097.html"], ["7 островов", "MR-0018.html"], ["Режимы правления островов", "MR-0025.html"]]}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0023-S04", "MR-0023--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-07-03 (окно w0041, id 194962–194979).</strong> Остров как анархичное государство: хаос, каждый сам за себя, гетто, банды, преступность, убийства — и жара, из-за которой всё это происходит редко. Поведение жителей вне острова: «как звери». Биом не назван; из разговора следует, что изначально речь шла про вулканы (см. ниже).</p>\n<p><strong>Версия 2 — 2024-07-04 (окно w0042, id 196057–196062).</strong> Остров переопределён как «остров наемников» и помещён в пустыню. Миколай спрашивает: «а че так, почему не вулканы как изначально». Ответа на этот вопрос не последовало — Слава переводит разговор на другое: «Вот этой нужно придумать. Их ней цель». Вулканы как исходный вариант биома, таким образом, зафиксированы только через этот вопрос и заменены пустыней без объяснения.</p>\n<p><strong>Версия 3 — 2024-07-04 (окно w0042, id 196119–196123).</strong> Уточняется, что Сталкер — наёмник и потому часто оказывается вне острова. Здесь же — общее возражение Миколая против того, чтобы защитники «чисто сидели», и ответ про то, что преступная организация не везде: «Они не везде есть группа людей и все».</p>\n<p>Ни одна из версий не отменяет предыдущую: анархия, жара, наёмники и пустыня лежат друг на друге.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0023-S05", "MR-0023--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Биом в окне w0041 не закреплён. Смена вулканов на пустыню (w0042) не объяснена — вопрос Миколая «почему не вулканы как изначально» остался без ответа.</li>\n<li>Цель, о которой Слава говорит «Вот этой нужно придумать. Их ней цель», в переписке не придумана.</li>\n<li>Про остальных защитников и их присутствие вне своих островов сказано прямо: «А остальные твой челики не знаю» — осталось нерешённым.</li>\n<li>Численность населения, устройство банд, отношения жителей со Сталкером в переписке не названы.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0023--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0097.html\">Сталкер</a></li>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0018.html\">7 островов</a>, <a href=\"MR-0025.html\">Режимы правления островов</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0023--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-03</td>\n<td>194962–194979</td>\n<td>w0041</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-04</td>\n<td>196057–196062</td>\n<td>w0042</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-04</td>\n<td>196119–196123</td>\n<td>w0042</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0023-ostrov-stalkera.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0023--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0023.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
