<script>const BASE="";const DOCNAME="Мерцание";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0280-S01", "SP-0280--mehanika"], "h": "<p>Мерцание даёт Избу неуязвимость, устроенную через убеждение самого носителя. Дословно (2026-06-14, id 489573):</p>\n<div class=\"q\"><p>«И изб неуязвим из-за мерцание у него никогда не пойдёт кровь. Но синики и переломы и внутренние повреждения могут быть.<br>Но крови никогда, это из-за того что он идеологически думает, что у героя не будет идти кровь»</p></div>\n<p>То есть действующая причина названа прямо: Изб «идеологически думает, что у героя не будет идти кровь» — и кровь у него не идёт. Не «не может пойти по физиологии», а не идёт из-за его собственной идеологической уверенности.</p>\n<p>Сама механика Мерцания — то, как способность работает помимо этого следствия, — в окне не описана и подразумевается уже известной. В базе это отмечено отдельной неясностью.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0280-S02", "SP-0280--ogranicheniya-i-cena"], "h": "<p>Неуязвимость неполная, и граница проведена точно: не идёт только кровь. Всё остальное сохраняется — «синики и переломы и внутренние повреждения могут быть». Крови при этом не бывает никогда: «Но крови никогда».</p>\n<p>Цена способности не названа.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0280-S03", "SP-0280--nositeli"], "h": "<p>Изб. В базе способность записана как часть Изба, вариант имени в записи — «Мерцание (Изб)».</p>\n<p>В том же окне, репликой раньше (id 489571), Слава сообщает: «Кстати гг теперь Изб» — то есть Изб на 2026-06-14 назначен главным героем.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0280-S04", "SP-0280--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2026-06-14 (окно w0121, id 489571–489584).</strong> Единственная версия. Здесь Мерцание названо причиной неуязвимости Изба, очерчены границы неуязвимости (кровь — никогда, синяки, переломы, внутренние повреждения — возможны) и названа природа эффекта — идеологическая.</p>\n<p>Ранее, 2026-06-02 (id 487018), у Изба была описана отдельная основная способность <strong>Неуязвимость</strong> (<a href=\"SP-0270.html\">Сверхчеловеческая сила</a> фиксирует тот же кусок переписки): «Он достаточно часто прошибает собой каких нибудь злодеев, монстров, неудачных экспериментов Нимба и т. Д. И при этом остаётся без царапинки. Ну в моё фантазии где я как бы кручу историю. У него так и не разу не пошла кровь». Там отсутствие крови отнесено к тому, как автор «крутит историю» в фантазии, а не к отдельной способности. 2026-06-14 отсутствие крови объяснено Мерцанием. Прямо связь между этими двумя описаниями в переписке не проговорена.</p>", "r": [["Сверхчеловеческая сила", "SP-0270.html"]]}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0280-S05", "SP-0280--svyaz-s-drugimi-sposobnostyami"], "h": "<ul>\n<li><strong>Неуязвимость Изба</strong> (описана 2026-06-02, id 487018, см. <a href=\"SP-0270.html\">Сверхчеловеческая сила</a>) — тот же признак «не идёт кровь». Как соотносятся Мерцание и Неуязвимость — одна ли это способность под двумя именами, или Мерцание объясняет Неуязвимость, — в переписке не сказано.</li>\n<li>Других связей в окне нет.</li>\n</ul>", "r": [["Сверхчеловеческая сила", "SP-0270.html"]]}, {"t": "Пробелы", "a": ["S06", "SP-0280-S06", "SP-0280--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Механика Мерцания как таковая не описана: в окне она подразумевается известной.</li>\n<li>Не сказано, откуда имя «Мерцание» и что именно мерцает.</li>\n<li>Не сказано, что происходит, если убеждение Изба поколеблется или изменится — при том, что именно убеждение названо причиной работы способности.</li>\n<li>Не сказано, распространяется ли идеологический механизм на что-то ещё, кроме крови.</li>\n<li>Цена и расход не названы.</li>\n<li>Не сказано, есть ли Мерцание у кого-то ещё.</li>\n<li>Вселенная записи в базе помечена как «неясно» — привязка проставлена по дате объявления.</li>\n<li>Остальная часть окна (id 489574–489584) к способности не относится: там обсуждение нейросетей и того, куда кидать материал.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0280--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0270.html\">Сверхчеловеческая сила</a></li>\n<li><strong>Упомянут в способностях:</strong> <a href=\"SP-0270.html\">Сверхчеловеческая сила</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0280--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-06-14</td>\n<td>489571–489584</td>\n<td>w0121</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0280-mercanie.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0280--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0280.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
