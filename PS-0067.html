<script>const BASE="";const DOCNAME="Псиклон";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0067-S01", "PS-0067--proishozhdenie"], "h": "<p>Псиклон появился как шестой пункт в списке пришельцев, который Слава набирал 2024-05-10 (окно w0033, id 167449–167450). Заявка была подана без облика: «6 образ не смог приставить». Слава сразу задал набор способностей — контроль разума, иллюзия, «может залезть в голову видит чужие воспоминания» — и передал задачу на визуализацию: «Запихай в нейронку для картинок. Он должен быть жутким страшными». В том же сообщении, следом, шла заявка на добор: «И надо ещё 4 пришельца» (id 167450).</p>\n<p>Имя «Псиклон» (Psiclone) появляется только в карточке, которую составил Миколай (id 167463). В варианты имени записаны также «6-й пришелец» и латинское написание «Psiclone».</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0067-S02", "PS-0067--vneshnost"], "h": "<p>Развёрнутое описание внешности дал Миколай 2024-05-10 в 08:54 (id 167463) как описание для генерации изображения. Общий тип — «Антропоморфный пришелец», основа — «Гуманоид с элементами насекомого и рептилии», особенность — «Жуткий, пугающий облик, внушающий страх и тревогу».</p>\n<p>Голова:</p>\n<ul>\n<li>«Форма напоминает смесь черепа человека и насекомого с заметными выпуклыми частями».</li>\n<li>«Крупные, многофасеточные глаза с яркими красными и зелеными оттенками, светящимися в темноте».</li>\n<li>«Широкий, зловещий оскал с двойным рядом острых зубов».</li>\n<li>«Длинные, заостренные уши, похожие на рога, направленные назад».</li>\n<li>«Длинные, извивающиеся усики, исходящие из области лба, подчеркивающие зловещий облик».</li>\n</ul>\n<p>Туловище:</p>\n<ul>\n<li>«Гибкое, покрытое темной, чешуйчатой кожей, будто у рептилии».</li>\n<li>«Изогнутый позвоночник, придающий существу хищный вид».</li>\n<li>«Хрупкие, но длинные руки и пальцы с когтями, напоминающими насекомых».</li>\n<li>«Дополнительные конечности-щупальца, скрытые за спиной, могут вытягиваться и манипулировать объектами».</li>\n</ul>\n<p>Нижняя часть тела:</p>\n<ul>\n<li>«Узкие бедра, переходящие в изогнутые ноги, напоминающие задние лапы хищного зверя».</li>\n<li>«Лапы с тремя длинными когтями, позволяющие легко карабкаться по вертикальным поверхностям».</li>\n</ul>\n<p>Отдельные особенности:</p>\n<ul>\n<li>«Постоянное свечение вокруг глаз, создающее эффект гипнотического взгляда».</li>\n<li>«Облако иллюзорного тумана, окружающее существо, искажающее его контуры и внушающее ужас».</li>\n<li>«Небольшие, но острые колючки на спине и плечах, испускающие легкий токсичный пар».</li>\n</ul>\n<p>Цветовая палитра — «Темные оттенки зеленого, коричневого и черного», плюс «Красные и зеленые светящиеся элементы на глазах и вокруг головы».</p>\n<p>Поза, заданная для изображения: «Существо стоит в темноте, слегка наклоняясь вперед, его длинные руки тянутся к зрителю, а глаза ярко светятся в темноте», «Тонкие щупальца извиваются вокруг головы, создавая иллюзорный туман», фон — «темный, с легким свечением, подчеркивающим зловещий силуэт существа».</p>\n<p>Эту внешность Слава отверг — см. раздел «Как менялся».</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0067-S03", "PS-0067--harakter"], "h": "<p>Отдельно характер в переписке не обсуждался. Есть только итоговая фраза из карточки Миколая (id 167463), сводящая образ: «Псиклон — зловещий пришелец с гипнотическим взглядом и длинными щупальцами, который внушает ужас и проникает в разумы своих жертв, используя их страхи против них самих».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0067-S04", "PS-0067--sposobnosti"], "h": "<p>Заявка Славы (id 167449): «способности контроль разума, иллюзия, может залезть в голову видит чужие воспоминания».</p>\n<p>Развёрнутая формулировка Миколая (id 167463):</p>\n<ul>\n<li>Контроль разума: «Глаза существа гипнотизируют жертву, делая ее послушной».</li>\n<li>Иллюзия: «Создает зловещие иллюзии вокруг себя, делая облик более пугающим».</li>\n<li>Видение воспоминаний: «При прикосновении к голове жертвы, видит ее воспоминания и страхи, используя их для манипуляции».</li>\n</ul>\n<p>Описание способностей соавтором не оспаривалось: на прямой вопрос Миколая «Тобиж внешка не зашла только? А описание способностей норм?» (id 167484) возражений по способностям не последовало — Слава ответил только про внешность (id 167485).</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0067-S05", "PS-0067--svyazi-s-drugimi"], "h": "<p>Псиклон — часть ростера пришельцев 1–6, который Слава собирал в окне w0033. Заявка на него (id 167449) идёт непосредственно перед заявкой на добор ещё четырёх пришельцев (id 167450), из которой затем вышла в том числе Пироманта (<a href=\"PS-0071.html\">Пироманта</a>).</p>\n<p>Дальнейшее обсуждение в этом же окне сразу переходит к следующим номерам списка: «7 изменять форму / 8 звук / 9 пиромат» (id 167464).</p>", "r": [["Пироманта", "PS-0071.html"]]}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0067-S06", "PS-0067--kak-menyalsya"], "h": "<p><strong>2024-05-10, id 167449–167450 (версия 1).</strong> Заявка Славы. Облик не придуман («6 образ не смог приставить»), заданы три способности и требование к образу: «Он должен быть жутким страшными».</p>\n<p><strong>2024-05-10, 08:54, id 167462–167467 (версия 2).</strong> Миколай выдаёт полную карточку под именем Псиклон (Psiclone): строение головы, туловища, конечностей, щупальца за спиной, свечение глаз, иллюзорный туман, токсичные колючки, цветовая палитра, поза для изображения и три способности в развёрнутой формулировке. В том же обмене Слава уходит к следующим номерам ростера и просит облики для них: «Как будут выглядеть?» (id 167465–167466), Миколай: «Ок, сейчас сделаю» (id 167467).</p>\n<p><strong>2024-05-10, 09:11–09:19, id 167479–167490 (версия 3).</strong> Слава отвергает внешность. На вопрос «Как те вешка» (id 167479) отвечает: «Слишком глупо не подходящий и вообще не нравится сам постараюсь что нибудь придумать а то нейронка похода так себе» (id 167480). На уточнение «Не один не зашёл?» — «Ну среди этих нет» (id 167482). Причины сформулированы отдельно: «Слишком сложный, И я представлял что то безформленной / Да и этот образ не подходит под способность» (id 167485). При этом позже показанный вариант (id 167488, «А этот?») был одобрен: «А ну этот норм» (id 167489).</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0067-S07", "PS-0067--chto-s-nim-stalo"], "h": "<p>На конец окна w0033 состояние такое: способности утверждены, словесное описание внешности от Миколая забраковано, один из показанных изображений-вариантов (id 167488) одобрен. Что именно на этом одобренном варианте изображено, в текстовом архиве не отражено. Слава заявил намерение придумать образ сам: «постараюсь что нибудь придумать» (id 167480) — результата этого намерения в переписке нет.</p>", "r": []}, {"t": "Отклонённые варианты", "a": ["S08", "PS-0067-S08", "PS-0067--otklonennye-varianty"], "h": "<p>Отвергнута вся внешность из карточки id 167463 целиком, с двумя названными причинами: «Слишком сложный» и «я представлял что то безформленной». Третья претензия — «этот образ не подходит под способность». Слава отдельно отметил качество генерации: «а то нейронка похода так себе» (id 167480).</p>", "r": []}, {"t": "Пробелы", "a": ["S09", "PS-0067-S09", "PS-0067--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Утверждено ли имя «Псиклон» соавтором — из окна w0033 не видно.</li>\n<li>Каким должен быть «бесформенный» облик, который Слава себе представлял, не описано.</li>\n<li>Что изображено на одобренном варианте (id 167488), в текстовом архиве не сохранено.</li>\n<li>Происхождение, биография, роль в сюжете, отношения с другими персонажами в переписке не обсуждались.</li>\n<li>Обсуждение ограничено одним днём, 2024-05-10; возвратов к персонажу в материале нет.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0067--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0071.html\">Пироманта</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0071.html\">Пироманта</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0014.html\">игра бога</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0067--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-05-10</td>\n<td>167449–167450</td>\n<td>w0033</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-05-10</td>\n<td>167462–167467</td>\n<td>w0033</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-05-10</td>\n<td>167479–167490</td>\n<td>w0033</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0067-psiklon.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0067--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0067.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
