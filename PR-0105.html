<script>const BASE="";const DOCNAME="Фанатик (обычный мир)";
const LEAD="";
const CH=[{"t": "Об этом тексте", "a": ["S01", "PR-0105-S01", "PR-0105--ob-etom-tekste"], "h": "<ul>\n<li>Дата: 2025-12-14</li>\n<li>Сообщения: 397758–397761</li>\n<li>Состояние: брошено на середине — первая глава четырьмя сообщениями подряд, обрывается на разговоре с Лукасом; сам автор говорит, что это заброшенный вариант</li>\n<li>Действующие лица: Дионис Бэлут (рассказчик, попал в чужое тело), черноволосая служанка, граф Эдгар Бэлут (отец), графиня Виктория Бэлут (мачеха), Лукас (младший брат, 10 лет), Алиса (младшая сестра, 7 лет), дворецкий</li>\n</ul>", "r": []}, {"t": "Текст", "a": ["S02", "PR-0105-S02", "PR-0105--tekst"], "h": "<p>Фанатик (обычный мир) </p>\n<p>Наверное многие мечтали попасть другое мир<br>Чаще всего об этом мечтают неудачники. <br>Почему-то в их голове возникла мысль. <br>Что в другом мире они будут лучше, станут смелее и воля их пробьет небеса. Ну что за бред. Они как и останутся неудачником в настоящим, так и в другом мире име будут. Смелость и воля не появится просто по волшебству. Тем более воля у людей, который всю жизнь просиживали дома. Прячешь от людей. <br>Я же никогда не мечтал о побеге. Тем более в другой мир.  Был готов жить нынешнее жизнью. Один на один с этой.... семье. <br>Ха-ха-ха семья даже звучит смешно, вот эти куски плоти, когда-то были моей семье. Уважаемые отец и миловидная мать. Сейчас не более чем.... - </p>\n<p>Так и жил с этими. Бросить их я не мог, как никак раньше они меня любили, да и воспитали. И бросить их будет неправильно. <br>Вот и пошли циклы моей жизни. Работа, дом и уход за этими. Тем больше проходила времени, чем больше я желал им смерти. </p>\n<p>Не выдерживая. Каждый день работая, для содержания моей семьи уходила много денег. Приходилось работать на нескольких работах. Наплевав на своё светлое будущее, что вещали мне  учителя. С этим я ещё мог справиться, но недосып, от того, что эти всю ночь вопили. Они всегда вопят. Вот только ночью они словно сходят с ума. Кричат, вопят и стукаются своими тушами. <br>Мыть эти разлагающие изнутри тела, которая дергаются каждый раз, когда я &#x27;случайно&#x27; сильно на давлю. Кормите и каждый раз натягивать улыбку, когда они выплёвывают еду. </p>\n<p>И в этой мерзкой реальности моей отдушиной стали книги. Сказки. Легкий, с простой моралью. Они нравились мне - человеку, что жил в гнилое реальности. Вроде кто-то говорил, чем глубже ты во тьме, чем ярчее даже самый тусклый свет. Этим светом стали книги. <br>Одна книга о герой справедливости, что побеждает все зло. Легко, просто и предсказуема, но да безумия запало в душу. Мой милый лучик света. Мой герой. </p>\n<p>И сейчас я стою у зеркала и рассматриваю  незнакомое лицо. Лицо была мужчины за 20 лет. Чёрные волосы, что были бы абсолютно чёрными если не седина. Острые черты лицо, с измученными красными глазами. И неподелная улыбка. <br>- Хаааха- ну что за бред былой кабылы. Но как же это волнительно. Мои руки слегка заметная дрожаля. Пока я окуратно поглаживали &#x27;свое&#x27; лицо. &quot;Я попал в другое мир&quot; Четкая мысль, которое даже не нужно было формировать. Вот только какое? Лицо, что я сейчас вижу. Вроде как не описывалась в романах, которых я читал. &quot;Чёрные волосы с сединой&quot; Такой бы запомнилась. Но это сейчас слабо волновала. Волнительные чувство, как перед открытием подарка на новый год. Прошибла все мои мозги и думать о таких мелочах было сложно.</p>\n<p>-Эй! - поправляла одежду крикнул я в сторону. <br>-да господин- приглушенная ответила фигура горничные, что скрывалась во тьме комнаты. Особо выдающим лицо её не было. Просто тьма во тьме. Чёрные глаза, с чёрными волосами скрытый в углу комнаты, как же приторно. <br>- Скажи-ка моя дорогая служанка, как же звать меня? Сколько мне лет? И какое сейчас число? - спросил я. Глубоко в душе переживая, что она явно, что-то заподозрет. Но я был настолько в хорошем настроении, что и не думал об этом. <br>Служанка же слегка кивнула головой. <br>- вы Дионис Бэлут старший сын графа Бэлута. В этом году вам исполнилась 23 года.  Сегодняшняя дата 28 июня 1417 год- без колебаний ответила служанка. Словно только ждала когда я задам этот вопрос. <br>&quot;Хм &#x27;Дионис&#x27; впервые слышу это имя. Да и семья Бэлут, что-то не припоминаю. 23 года примерно столько я ожидал. Хотя седина на волосах немного беспокоит ну ладно... Дата мне ничего не даёт. Вообще в романах очень редко пишут даты. Потому что авторы сами бояться в них запутаться &quot; Буря мысли, что ни к чему не привели. <br>Остаётся лишь одно. Самому расследовать, что же это за мир. <br>-пошли-  сказал я подзывая её рукой. <br>Мы удачно вышли из темное комнаты в светлые коридоры с большими окнами.<br>- покажи мне особняк и раскажика мне о моей сем... - слова застряла в горле. Хотелось выплюнуть его, как гнилой ком, но не получалась. <br>- хорошо господин- также бесстрастно ответила служанка начиная идти впереди меня прокладывая дорогу. <br>- что именно вас интересует в семье господин? - спросила она пока мы шли по длинейшему на свете коридору. <br>-кто вообще есть семья? - сказал я отряхивая пыль на груди. Горничная кивнула и начала рассказывать. <br>- Граф Эдгар Бэлут ваш отец и графиня Виктория Бэлут ваша мачеха.... <br>&quot;Что мачеха&quot; Я прочитал достаточно рассказов, чтобы понимать мачеха не сулит ничего хорошего. Продолжая отряхивать пыль уже с плеча я продолжил слушать. <br>-у вас также есть младший брат и младшая сестра от графине Виктории-<br>&quot;Это плоха, очень плоха&quot; Мне не хотелось устраивать политическую борьбу. Единственно, что я хотел это понаблюдать за главным героем. В независимости в каком я романе. <br>Глупа. Глупа. Глупа. Мысль о том что это бред моего сознания на почве стресса или сон. Никуда не ушли. Хоть и ослабли после того, как я потрогал и ощутил своё новое лицо. И этот идиотский коридор с множеств дверей, когда нибудь закончится? <br>***<br>Дальше особо ни-че-го интересного не было. Мы бродили по коридорам иногда посещая некоторые комнаты. Например библиотеку, кухню и пару залов. Сам интерьер, здесь как и ожидалось был средневековым. Разные узоры, где попало и не экономия пространства. Был только один большой плюс. Невероятная мягкий ковры. Мне захотелось снять обувь и пройтись по этим коврам. Ну я как достойный человек сдержался. Я и так уже веду себя подозрительно. <br>Моя черноволосая служанка по моей просьбе рассказала упрощённый вариант истории королевства Пиор. <br>Этой информации мне хватило, чтобы понять, что это за мир. <br>Удивительно, нет- это восхитительно. Я лютый грешник попал в тот самый лучик света. В ту б сказку о герой справедливости, что борется со всем злом на свете. <br>Я едва сдержал возбуждение. Даже если это сон, даже если это бред. Нужно увидеть героя. <br>Самая мысль о том, что я его увижу, того самого. Заставляло моей сердце биться сильнее. <br>Держась за колотишься сердце в саду. Я одной рукой опирался на фарфоровую скульптуру. <br>Служанка же стоял рядом со мной. Держа в руках стакан воды, который она достала из неоткуда. <br>- да ты нечто - переводя дух продолжил я. <br>- будь конкурс лучшей служанки. Ты бы заняла первое место- служанка на все мои пышные комплименты лишь кивнула головой. <br>-господин скоро будет ужин- <br>Я посмотрел на небо. И правда Солнца уже садиться. И я до сих пор не проснулся. Хорошая новость. <br>Но снова идти по этому лабиринту называемая особняком, до тошноты не хотелось. <br>Темная комнатушка уже казалось куда более заманчивой. <br>-тогда принеси ужин в мою ком.....в мои покои- махнул рукой отвечая. Служанка не ответила, заколебалась что-ли ? <br>-извините господин. Но вы ужинает вместе с графом и графиней- <br>&quot; Нет я собирался так рано встречать графа и графиню&quot; Я же даже не знаю каким был Дионис. <br>-скажи, что я не важно себя чувствую- выпалил я не раздумывая. <br>- простите господин. Но я уже сообщил графу, что сегодня у вас за долгое время хорошее настроение. Граф потребовал, чтобы вы сегодня были на ужине- негодования. Вот единственная эмоция, что я мог проявить сейчас. <br>- когда ты успела? - не понимал я. <br>-я сообщил через дворецкого, когда мы были в библиотеке- дворецкий я думал это был библиотекарь. <br>Вздох..  Ладно зачем уже паниковать. Нужно быть оптимистом - это единственный способ пережить что-то тяжелое. <br>Во-первых я узнаю отношения семьи Диониса к нему. <br>Во-вторых я увижу графа и возможно пойму, что это за семья такая. <br>В-третьих же рано и поздно мне все равно пришлось бы их увидеть. <br>Но густое и неприятная чувство. Сильно резал из-за того, что только недавно ощущал приятные эмоции.<br>-больше не делай что-либо без моего приказа. Ты же моя служанка? -сказал я отряхивая грудь от пыли. <br>- да господин я ваша служанка. Больше такого не повторится- сказала она низко наклонившись. <br>И вправду говорят &quot; Прощения получить легче, чем разрешение &quot;<br>**<br>Переодевшись с помощью служанки. Хотел бы сам. Но эти наряды, что-то с чем то. Слишком сложно одеваемый и без помощи дополнительных рук их не одеть. <br>Мы направлялись на ужин. Точнее я направлялся, а она лишь вела меня. <br>- как мне вести при них- задал я интересующий вопрос. Служанка бросила на меня взгляд и ответила. <br>- так же как и сейчас господин. Думаю они будут рады увидеть вас в хорошем здраве- ответила служанка не оборачиваясь. <br>-Аха тем более мачеха Виктория - служанка слегка с езжилась. <br>&quot;Блять&quot; Едва сдержался, чтобы не произнести привычное слова. Все было до ужаса очевидным. Моя милая служанка служит графине. <br>Мы подошли к большой двери украшенный золотыми узорами. По правилам на ужине присутствует только члены семьи и главный дворецкий, с несколькими своими приближёнными. <br>Поэтому черноволосая служанка наклонилась желая мне удачи. <br>Прежде чем зайти я сказал <br>-знаешь теперь я думаю. Ты займешь последнее место- служанка приподняла голову в недоумении. <br>*<br>Зайдя внутрь. На удивление первое что меня привекло это вкусный запах мяса специями. Похожа это тело давное не ела. <br>Второе что меня привлекло был граф. Моя копия, ну или я его копия. Как я только в разы крупней и с более суровым лицом, ну и с барадишкой. <br>Женщина рядом с графом. С шелковистыми и зелёными волосами. Пристойно смотрела на меня. <br>Ну и два черноволосых детеныша, что с удивленными глазами хлопали на меня. <br>Идеально. Прям все как я представлял <br>-Здравствуйте дорогая семья- сказал я искренне улыбаясь и отряхивая невидимую пыль с груди. <br>Раз так хотите сильно клоуна. То он будут лучшим из клоунов. <br>Не дожидаясь ответа. Я быстрыми, но при этом монотонными шагами двинулся на свободное место. Напротив моих младших. <br>Элегантно и спокойно сев на стол. Я начал понимать, что мои действия слишком элегантны для человека 21 века. Но сейчас не до этого. <br>Граф хранивший молчание заговорил. <br>-сегодня у тебя на удивление хорошое настроение Дионис. Произошло, что-то хорошое? -спросил граф поглядывая на меня своими краснаии глазами. <br>- вы как всегда проницательны граф. Сегодня было моей духовное рождение- с радостью сказал я не скрывая улыбки. <br>-духовное рождение? - с интересам произнесла графиня. <br>-да графиня духовно рождение или по другому. Я вижу свою путь. Четкая и ясна, как никогда- с гордостью произнёс я. Лицо графини слегка стало холодным и напряженым. <br>- и каков же твой путь-  спросил граф поглаживая бокал. <br>Я же отпустил прибор, который каким то чудом оказались в моих руках.<br>Мышечная память что-ли? Но сейчас это было не важно. <br>Я отряхнул грудь и продолжил <br>-мой путь мне виден с множество знакомств, а также наблюдением за невероятными событиями, что изменят историю. Граф- граф нахмурился и отпив вина спросил. <br>- наблюдать? - да что же вы так любите повторять мои слова. <br>-да наблюдать. Ну и возможно немного контралировать, чтобы события были именно таким, каким должны быть- ответил я. <br>Граф же перестал хмурится то ли от вина, то ли от моих слов. А после случилась чудо. Он слегка улыбнулся продолжая есть. <br>-графиня - повторил Виктория - Дион
