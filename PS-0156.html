<script>const BASE="";const DOCNAME="рука из кошмара";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0156-S01", "PS-0156--proishozhdenie"], "h": "<p>Рука — преследователь из повторяющегося сна в истории Славы. Впервые появляется в первой части истории (2024-08-21, id 222143): на 10-ю ночь после потери памяти рассказчику снится сон, «где я в непроглядной темноте бегу от руки». Развёрнуто механика её появлений задана во второй части (2024-08-27, id 225501, окно w0055).</p>\n<p>Откуда взялся сам образ руки, рассказчик объясняет так: «Откуда я вообще взял что это рука не знаю, как то подсознательно представил этот образ» (2024-08-21, id 222143). То есть рука не была увидена — её образ достроен подсознательно.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0156-S02", "PS-0156--vneshnost"], "h": "<p>Внешность в переписке не описана: ни размер, ни цвет, ни то, к чему она крепится. Единственное, что есть, — что это рука, и что рассказчик так представил себе этот образ сам. В первой части один раз названа «ручищя».</p>\n<p>Род существа рассказчик не определяет и перебирает варианты прямо в тексте: «он ну она или оно схватила меня за руку» (2024-08-27, id 225501). В базе как варианты имени зафиксированы «она», «оно», «это».</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0156-S03", "PS-0156--harakter"], "h": "<p>Характера, речи и мотивов у руки нет — она не разговаривает и ничего не сообщает. Всё её поведение сводится к преследованию и попыткам коснуться.</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0156-S04", "PS-0156--sposobnosti"], "h": "<p><strong>Сон, который не сон.</strong> Основное свойство: происходящее происходит не как во сне. Рассказчик приводит два доказательства. Первое — усталость работает: «после 8 минут такого бега я был готов лёгкий выплюнуть. Я задыхался дыша». Второе — время: «во сне время шло как не во сне. То бишь для меня это длилась и правду всю ночь» (2024-08-21, id 222143). Бег длится всю ночь.</p>\n<p><strong>Касание.</strong> Боли касание не даёт. Даёт другое: «Нет я не почувствовал боли. Я почувствовал, что куда странней, это ощущалась не как прикосновения к кожи, это сука ощущалась как та не понятно. Но при этом пугающий. Словно холодной рукой притронулись к моему сердцу. Это сука не романтично. Это страшно, что каждую клетка моего тела тряслась» (2024-08-21, id 222143). Во второй части та же формулировка повторена: касание, «которая заставила дребезжать каждую клетку моего тела» (2024-08-27, id 225501).</p>\n<p><strong>Хватка и последствия наяву.</strong> На 23-ю ночь рука схватила рассказчика за руку. Он вырвался: «Я как безумец начал пытаться выбраться и да сука я выбрался. Выбрался невероятным чудом как то раскрутился как гимнаст и вытянул руку». Наутро схваченная рука болела: «Болела так словно я крапиву взял и полностью её руку обвязал и каждый 10 минут менял на новую» (2024-08-27, id 225501).</p>\n<p><strong>Истощение.</strong> К 23-му дню рассказчик сбросил 7 кг — «я чутли не стал как скелет». Плюс «нервозность, раздражительность, вялый вид иииии мне показалось что во рту у меня начало что-то гнить, но это лишь мне показалось» (2024-08-27, id 225501). Последнее рассказчик сам помечает как показавшееся.</p>", "r": []}, {"t": "Расписание появлений", "a": ["S05", "PS-0156-S05", "PS-0156--raspisanie-poyavleniy"], "h": "<p>Механика возвращений задана во второй части (2024-08-27, id 225501) и построена на сокращении интервалов:</p>\n<ul>\n<li><strong>10-я ночь</strong> — первый сон, касание, бег всю ночь.</li>\n<li><strong>11-я ночь</strong> — сна нет. Рассказчик держался без сна до 04:47, потом вырубился, проснулся около 11:30 без сна о руке. Реакция: «Я прям расслабился подумав, а может быть это одноразовая херня и все больше она не как не сможет повторить подобного без прямого контакта со мной».</li>\n<li><strong>12, 13, 14, 16-я ночи</strong> — всё ок, сна нет.</li>\n<li><strong>15-я ночь</strong> — кошмар вернулся: «снова кошмар снова бег и снова пока лёгким и всей дыхательной системе». С одним исключением: «это сука не смогла меня коснуться». Проснулся обоссаный — в предыдущий раз этого не было, потому что ночью особо ничего не пил.</li>\n<li><strong>17-я ночь</strong> — следующее появление.</li>\n<li><strong>Дальше</strong> — «интервалы начали глобально уменьшаться», и кошмар стал происходить каждую ночь. Все эти ночи убегать удавалось.</li>\n<li><strong>23-я ночь</strong> — схватила за руку, рассказчик вырвался. «Это сука теперь мой не любимой число».</li>\n</ul>\n<p>Промежуток от 10-й до 15-й ночи — пять дней; дальше интервал сокращается до двух, потом до одного.</p>", "r": []}, {"t": "Связи с другими", "a": ["S06", "PS-0156-S06", "PS-0156--svyazi-s-drugimi"], "h": "<p><strong>Рассказчик истории Славы</strong> (в первой части назван Алеком — <a href=\"PS-0148.html\">Алек</a>) — единственный, кого рука преследует. Прямого контакта с ней наяву нет; она приходит только во сне, но последствия остаются наяву — боль в схваченной руке, потеря веса, нервозность.</p>\n<p><strong>Ведьма (красотка)</strong> (<a href=\"PS-0157.html\">ведьма (красотка)</a>) — связь предположена рассказчиком, не подтверждена. Он сам сводит два происшествия — потерю памяти и «сон который не сон» — и делает вывод: «Я как бы не мало мистический херни прочел, чтобы сразу подумать на ведьму. Ну типа та красотка оказалась ведьмой ну или суккубом как кому» (2024-08-27, id 225501). В базе это зафиксировано как неясность: чья это рука и связана ли она с ведьмой — в тексте только догадка героя.</p>\n<p>Отдельно рассказчик выдвигает предположение об условии повторения: что без прямого контакта с ним она не сможет повторить подобное. Это предположение опровергается сразу — на 15-ю ночь кошмар возвращается.</p>", "r": [["Алек", "PS-0148.html"], ["ведьма (красотка)", "PS-0157.html"]]}, {"t": "Как менялся — состояния по датам", "a": ["S07", "PS-0156-S07", "PS-0156--kak-menyalsya"], "h": "<p><strong>2024-08-21 (id 222143).</strong> Рука появляется как преследователь в единичном сне на 10-ю ночь. Задано: непроглядная темнота, бег, касание без боли, ощущение прикосновения к сердцу, бег всю ночь, реальная усталость и реальное течение времени. Дальнейшего расписания ещё нет — на этот момент это одна ночь.</p>\n<p><strong>2024-08-27 (id 225501).</strong> Добавлена вся механика повторений: пропуск после первой ночи, возвращение на 15-й день, сокращение интервалов до каждой ночи, промах на 15-ю ночь, хват на 23-ю и побег из хвата. Добавлены последствия наяву: боль в схваченной руке, минус 7 кг, нервозность, раздражительность, вялый вид, кажущееся гниение во рту. Добавлена догадка о ведьме как источнике.</p>\n<p>Старое не отменено: описание касания во второй части повторено в тех же словах, что и в первой («заставила дребезжать каждую клетку моего тела»).</p>", "r": []}, {"t": "Что с ним стало", "a": ["S08", "PS-0156-S08", "PS-0156--chto-s-nim-stalo"], "h": "<p>На конец второй части (2024-08-27, id 225501) рука продолжает приходить каждую ночь; рассказчик вырвался из хвата и жив. Поиски экспертов чёрной магии в интернете результата не дали: «нашел и очень много чего нашел но все это была либо явная кидавола, либо кидаволо но менее явная».</p>\n<p>После 23-й ночи, на прогулке, к рассказчику обращается мужчина, которого он сначала принял за бомжа: длинные волосы, двухнедельная щетина, мешковатая одежда, лицо с чертами мужественности, глаза «хоть и мутный как у пьяницы но также и тяжёлый», груда мышц, рост как минимум 185 см. Сравнение рассказчика — с медведем, «который одно лапой может меня прям здесь укокошить». Этот человек «поведал мне о причине моих несчастье», но сам его рассказ в сообщение не входит: текст обрывается на «и вот что он рассказал» и «Продолжение следует».</p>", "r": []}, {"t": "Пробелы", "a": ["S09", "PS-0156-S09", "PS-0156--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Чья это рука и связана ли она с ведьмой — не сказано, в тексте только догадка героя.</li>\n<li>Внешность руки не описана; к чему она крепится и есть ли у неё тело, не сказано.</li>\n<li>Род («он ну она или оно») сам рассказчик не определяет.</li>\n<li>Чего рука хочет и что произошло бы, не вырвись рассказчик из хвата, не сказано.</li>\n<li>Почему на 15-ю ночь коснуться не смогла — не объяснено.</li>\n<li>Почему кошмар пропустил 11–14-ю и 16-ю ночи — не объяснено.</li>\n<li>Причина несчастий, которую назвал мужчина на улице, в переписке не приведена — сообщение обрывается на «Продолжение следует».</li>\n<li>Связь описания руки этого мужчины («рука у него была гигантская и сука словно накаченая») с рукой из кошмара в переписке не проговорена.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0156--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0148.html\">Алек</a>, <a href=\"PS-0157.html\">ведьма (красотка)</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0148.html\">Алек</a>, <a href=\"PS-0157.html\">ведьма (красотка)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0156--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-27</td>\n<td>225501–225501</td>\n<td>w0055</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0156-ruka-iz-koshmara.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0156--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0156.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
