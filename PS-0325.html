<script>const BASE="";const DOCNAME="Босс группировки дочери";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0325-S01", "PS-0325--proishozhdenie"], "h": "<p>Введён 2025-12-06 (id 393461–393465, окно w0112) как глава группировки при дочери Имитатора: «И у неё будет босс ( обычный человек но с глубоким убеждением)». Вселенная Оам объявлена.</p>\n<p>Имени у персонажа нет.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0325-S02", "PS-0325--vneshnost"], "h": "<p>Не описана. На вопрос о том, каким он будет, Слава отвечает, что образ ещё не сложился: «Он человек и он реальный. Образ я продузумивал что я пока виду его пока как образ» (id 393464).</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0325-S03", "PS-0325--harakter"], "h": "<p>Два свойства, названные напрямую:</p>\n<ul>\n<li>«обычный человек но с глубоким убеждением» (2025-12-06, id 393462);</li>\n<li>«Это босс будет хитрым и уверенным. Хотя обычные человек.» (2025-12-06, id 393479).</li>\n</ul>\n<p>Подчёркивается дважды, что он обычный человек — без способностей, отличающих его от прочих.</p>\n<p>Во что именно он глубоко убеждён, в переписке не сказано.</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0325-S04", "PS-0325--svyazi-s-drugimi"], "h": "<ul>\n<li>Дочь Имитатора — он босс её группировки. Персонаж существует как часть её линии.</li>\n<li>Имит (Имитатор) — «Попытается наладить связь с Имитам» (id 393479). Причина названа отдельным сообщением: «Так как для правительства. Представитель Апостоловы именно Имит» (id 393480). То есть связь с Имитом нужна ему как выход на апостолов через того, кого правительство считает их представителем.</li>\n</ul>\n<p>Состоялась ли эта попытка и чем кончилась — в переписке не сказано, дальше идёт «ещё сейчас кину» (Миколай, id 393481), и тема обрывается.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S05", "PS-0325-S05", "PS-0325--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2025-12-06 (id 393461–393465, окно w0112).</strong> Появление: у дочери Имитатора будет босс, «обычный человек но с глубоким убеждением». Образ на этот момент только нащупывается — «Наверное ближе к этому. Но что именно» (id 393463), затем отказ от предложенного варианта и уточнение, что он человек и реальный.</p>\n<p>В том же куске переписки, сразу за репликой о боссе, идёт сообщение: «Матка. Находиться в церкви. И люди им поклоняются, а детей маток считают святыми» (id 393465). Относится ли оно к боссу или это переход к отдельной теме — из переписки не следует.</p>\n<p><strong>Версия 2 — 2025-12-06 (id 393479–393481, окно w0112).</strong> Добавлены свойства: хитрый и уверенный, при этом по-прежнему обычный человек. Добавлена задача — наладить связь с Имитом, и её обоснование через положение Имита как представителя апостолов для правительства.</p>", "r": []}, {"t": "Отклонённые варианты", "a": ["S06", "PS-0325-S06", "PS-0325--otklonennye-varianty"], "h": "<p>На реплику 393463 («Наверное ближе к этому. Но что именно») следует «Нет.» (id 393464) — какой-то предложенный вариант образа забракован. Что именно отклонили, в приведённом куске переписки не видно.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0325-S07", "PS-0325--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имени нет.</li>\n<li>Внешность не описана, образ на момент переписки не сложился.</li>\n<li>Содержание «глубокого убеждения» не раскрыто.</li>\n<li>Название группировки и её состав не названы.</li>\n<li>Чем кончилась попытка наладить связь с Имитом — осталось нерешённым.</li>\n<li>Связь сообщения про матку и церковь с этим персонажем не установлена.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0325--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0060.html\">Группировка сестры (она же группа злодеев дочери Имитатора)</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0060.html\">Группировка сестры (она же группа злодеев дочери Имитатора)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0008.html\">Оам</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0325--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-12-06</td>\n<td>393461–393465</td>\n<td>w0112</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-06</td>\n<td>393479–393481</td>\n<td>w0112</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0325-boss-gruppirovki-docheri.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0325--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0325.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
