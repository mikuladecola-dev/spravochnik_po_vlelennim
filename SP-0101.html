<script>const BASE="";const DOCNAME="злой дух";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0101-S01", "SP-0101--mehanika"], "h": "<p>Злой дух — состояние, в которое переходит материализованный монстр. Правило сформулировано Миколаем в общем своде «принципы материализации и её продуктов» (2024-08-12, id 218392, окно w0052) отдельным пятым пунктом:</p>\n<div class=\"q\"><p>5. злой дух<br>5.1. после первого нарушения одной заповеди дух становится злым<br>5.2. злой дух реализует мотивацию родителя через аморальные методы</p></div>\n<p>То есть переход происходит однократно и по формальному признаку — «после первого нарушения одной заповеди». Не после накопления нарушений, не по решению кого-либо: достаточно одного раза.</p>\n<p>Сама цель монстра при этом не меняется. Меняются методы: злой дух продолжает «реализовать мотивацию родителя», но «через аморальные методы». Мотивация задана родителем на фундаментальном уровне и в переходе не пересматривается.</p>\n<h3>Контекст свода, в котором задан пункт</h3>\n<p>Пятый пункт стоит в конце свода, и предыдущие пункты задают, откуда вообще берётся дух, который может стать злым. В том же сообщении (2024-08-12, id 218392):</p>\n<p>Для появления монстра нужен родитель, который:</p>\n<ul>\n<li>«обладает представлением о монстре(характеристики, характер, история)»,</li>\n<li>«имеет в воображении его образ(внешность, способности, ограничения)»,</li>\n<li>«имеет желание которое не может реализовать»,</li>\n<li>«хочет встретить это существо».</li>\n</ul>\n<p>Роль родителя: «определяет внешность, мотивы, характер и иные характеристики монстра на фундаментальном уровне».</p>\n<p>И нужен знающий, который:</p>\n<ul>\n<li>«знает от родителя о монстре и верит что он существует»,</li>\n<li>«испытывает сильную эмоцию при мыслях о монстре(КПТ на полную)»,</li>\n<li>«описывает галлюцинации связанные с монстром».</li>\n</ul>\n<p>Роль знающего: «напрямую материализует в мистическом пространстве монстра посредством накопления образов из галлюцинаций. может влиять на характер и образ монстра, но на поверхностном уровне».</p>\n<p>Сам материализованный монстр определён как «дух действующий в соответствии с один мотивом и сценарием сформированным консенсусом хаоса» и как «существо создание коллективным бессознательным». Жизнь материализации состоит из «изменения под влиянием представления», «стремления воплотить мотивы родителя», и её материализация — «духовное тело с которым можно взаимодействовать на духовном уровне».</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0101-S02", "SP-0101--ogranicheniya-i-cena"], "h": "<p>Ограничения, приложимые к злому духу, идут из общего свода и относятся к любому материализованному монстру:</p>\n<ul>\n<li>Сила зависит от количества знающих: «чем больше знающих, тем больше возможностей для взаимодействия с материальным и духовным миром есть у монстра». При минимальных условиях монстр «минимально может взаимодействовать с миром духов при 10 знающих».</li>\n<li>«сила реализации мотивов геометрически пропорциональна силе вклада знающих».</li>\n<li>«сила способностей геометрически пропорциональна эмоциям знающих».</li>\n<li>«качество вклада знающего обнуляется если он начинает рационализировать силу своих и чужих влияний».</li>\n<li>Жизнь существа поддерживается родителем: «если его не будет или он изменит мотивы, монстр навсегда исчезнет если развеять форму даже если остались знающие». Отдельным пунктом (в исходнике повторно пронумерованным как 4.4) — «при отсутствии знающий жизнь также перестаёт поддерживаться».</li>\n</ul>\n<p>В качестве потолка задано: «всегда идет стремление к идеалу. в идеале монстр может полностью взаимодействовать в духовным и реальным миром, а также совершать манипуляции различного характера на всех уровнях соответствующие его мотивам».</p>\n<p>Отдельной цены за сам переход в злого духа — платы, отката, ослабления — в переписке не названо.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0101-S03", "SP-0101--nositeli"], "h": "<p>Персонально злой дух ни к одному монстру в этих сообщениях не привязан. Пункт сформулирован как общее правило: злым может стать любой материализованный дух после первого нарушения заповеди.</p>\n<p>Косвенно носители появляются с другой стороны — со стороны людей, задетых злым духом. В версии 2 (2024-08-12, id 218412) Миколай добавляет в перечисление тех, кто может видеть монстров: «или взрослые в чью жизнь вмешался злой дух». Это относится к ограничению видения монстров, а не к самой способности: речь о людях, получивших зрение, а не о носителях злого духа.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0101-S04", "SP-0101--kak-menyalas-po-versiyam"], "h": "<h3>Версия 1 — 2024-08-12 (id 218383–218396, окно w0052)</h3>\n<p>Правило заявлено внутри полного свода «принципы материализации и её продуктов» (id 218392, 16:54): переход в злого духа после первого нарушения одной заповеди, реализация мотивации родителя аморальными методами.</p>\n<p>Сразу за сводом Слава высказывает возражение к правилам в целом (id 218394–218396, 16:57–16:59):</p>\n<ul>\n<li>«Во всех этих правилах мне не нравится именно вера других людей»;</li>\n<li>«Типо злой челик решит показать своего монстра по телеку или Ютуб и все начнут в него верить»;</li>\n<li>«И моснстор сразу может стать бог».</li>\n</ul>\n<p>Возражение направлено не на пункт о злом духе, а на зависимость силы от количества верящих. Ответа на него в этом окне нет.</p>\n<h3>Версия 2 — 2024-08-12 (id 218410–218414, окно w0052)</h3>\n<p>Слава продолжает ту же линию: «Ну или на худой конец заставить разрушить город показать перед толпой людей» (id 218411, 17:04). Миколай в ответ подаёт реплику, относящуюся к перечислению видящих монстров: «или взрослые в чью жизнь вмешался злой дух» (id 218412, 17:04). Дальше идут «ну как» и «епта» (id 218413–218414).</p>\n<p>Формулировка пунктов 5.1 и 5.2 между версиями не менялась — старая редакция остаётся единственной.</p>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S05", "SP-0101-S05", "SP-0101--otklonennye-varianty"], "h": "<p>Прямо забракованных вариантов самого пункта о злом духе в переписке нет. Зафиксировано незакрытое возражение Славы к механике веры (id 218394–218396, 218411): сценарий, при котором монстра показывают по телевизору или на Ютубе, все начинают верить, и «моснстор сразу может стать бог». Отклонено это возражение или принято — в переписке не сказано.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S06", "SP-0101-S06", "SP-0101--svyaz-s-drugimi-sposobnostyami"], "h": "<ul>\n<li>Принципы материализации и её продуктов — злой дух является пятым пунктом этого свода и в файле помечен как его часть («часть чего: принципы материализации и её продуктов»). Все ограничения силы и условия существования наследуются оттуда.</li>\n<li>Ограничение видения монстров — связь идёт через реплику «или взрослые в чью жизнь вмешался злой дух»: вмешательство злого духа попадает в перечень условий, при которых взрослый видит монстров.</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S07", "SP-0101-S07", "SP-0101--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Заповеди не перечислены. Сколько их, какие они и кем установлены — в переписке не сказано, хотя весь переход держится на нарушении одной из них.</li>\n<li>Не сказано, чьи это заповеди — монстров, родителя, общего устройства мира.</li>\n<li>Что считается «аморальными методами» и по чьей мерке — не определено.</li>\n<li>Обратим ли переход, может ли злой дух перестать быть злым, — не сказано.</li>\n<li>Меняются ли при переходе внешность, сила, ограничения монстра — не сказано; названо только изменение методов.</li>\n<li>Не сказано, как переход соотносится с влиянием родителя: может ли родитель предотвратить или отменить его.</li>\n<li>Ни один конкретный монстр в этих сообщениях не назван злым духом.</li>\n<li>Возражение Славы про веру толпы и монстра-бога осталось нерешённым.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["SP-0101--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-12</td>\n<td>218383–218396</td>\n<td>w0052</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-08-12</td>\n<td>218410–218414</td>\n<td>w0052</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0101-zloy-duh.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0101--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0101.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
