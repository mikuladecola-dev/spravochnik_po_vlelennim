<script>const BASE="";const DOCNAME="Пустота между мирами";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0104-S01", "MR-0104--ustroystvo"], "h": "<p>Пустота между мирами — то, куда попадают души после смерти. Она введена 2025-01-22 (id 283822–283828) как замена прежней посмертной схемы.</p>\n<p>Слава описывает её так: «после смерти наши души улетает в пустоту. Пустота между мирами, пустота это ничто и попадая в ней душа становится тоже ничем за ничем невозможно наблюдать ведь это ничто» (id 283827).</p>\n<p>Из этого следуют три положения, названные прямо:</p>\n<ul>\n<li>пустота есть ничто;</li>\n<li>попавшая в неё душа сама становится ничем;</li>\n<li>за ничем невозможно наблюдать — потому что это ничто.</li>\n</ul>\n<p>Последнее утверждение в переписке подано как объяснение того, почему пустота ненаблюдаема: не «никто не смотрел», а наблюдать не за чем в принципе.</p>\n<p>Никакой внутренней географии, обитателей или структуры у пустоты не описано — по определению, поскольку она ничто.</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0104-S02", "MR-0104--naselenie"], "h": "<p>Населения в обычном смысле у пустоты нет. Есть только то, что в неё попадает, — души.</p>\n<p>Правило распространяется не только на людей: «И не только наши души но и в всех существ попадает в пустоту» (id 283828). То есть в пустоту уходят души всех существ.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0104-S03", "MR-0104--mesto-vo-vselennoy"], "h": "<p>Пустота располагается между мирами — это следует из самого названия и из формулировки «Пустота между мирами». Отношение к конкретным мирам вселенной, границы, способ попадания туда кроме смерти — не описаны.</p>\n<p>В реестре пустота связана с междумирцами. Характер связи в самой переписке 2025-01-22 не проговаривается.</p>\n<p>Замена, которую вводит эта концепция, названа явно: «Раньше после смерти ты попадал в рай или ад или в другой мир» (id 283827). Таким образом, рай, ад и попадание в другой мир — это отменённая посмертная схема.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0104-S04", "MR-0104--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-01-22 (окно w0072, id 283820–283830).</strong> Единственная версия. Концепция смерти объявлена изменённой: «Я изменения концепцию смерти» (id 283823).</p>\n<p>Причина смены названа Славой прямо: прежняя схема (рай, ад или другой мир) «хуйня так как она грубо говоря обесценивает смерть». Формулировка приведена в контексте — Слава говорит, что понял это, «приставив у себя в голове весь сюжет» (id 283827).</p>\n<p>Отменённый вариант — рай, ад или другой мир после смерти — фиксируется как то, что было и от чего отказались.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0104-S05", "MR-0104--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вселенная, к которой относится смена концепции смерти, в чате не названа; в реестре пустота отнесена к «Апостолу» по дате объявления.</li>\n<li>Связь пустоты с междумирцами в переписке не объяснена — в разговоре 2025-01-22 они не упоминаются.</li>\n<li>Не сказано, есть ли исключения из правила: могут ли какие-то души не попасть в пустоту, можно ли оттуда вернуться.</li>\n<li>Не сказано, что происходит с душой по дороге — есть ли переход, время, что-либо между смертью и становлением ничем.</li>\n<li>Реакции Миколая на объявленное изменение в сохранённом куске нет: он пишет «пока еще подумаю сам» (id 283820) и «жду, чуть позже прочту если что» (id 283824), после чего обсуждение в этом окне не продолжается.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["MR-0104--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-01-22</td>\n<td>283820–283830</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0104-pustota-mezhdu-mirami.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0104--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0104.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
