<script>const BASE="";const DOCNAME="Вампиры";
const LEAD="<p>Вампиры (<a href=\"PS-0299.html\">Вампиры</a>) — раса вселенной Оам, разрабатывалась Славой с 2025-10-02 по 2025-12-06 (окна w0106, w0107, w0108, w0109, w0112), пять версий. Встречается также вариант названия «Вампиры, контролирующие кровь». Всё, что о них есть в переписке, произнесено Славой; Миколай по вампирам отдельно не высказывался.</p>";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0299-S01", "PS-0299--proishozhdenie"], "h": "<p>Впервые вампиры названы 2025-10-02 (id 370600–370613, окно w0106) в перечне тех, «кто есть пока что не в сформировавшиеся мире». Список состоял из: «Апостолы с сверхспособностями (насекомые)», «Каменный Поротой», «Азуриэль», «Допустим вампиры который могут контролировать кровь» и «дети мирового древа». На этом этапе вампиры — одна строка, формулировка с «допустим», то есть предложение, а не установленный факт. Разработка на этой версии дальше не идёт: Слава подробно расписывает детей мирового древа и предлагает Миколаю кидать идеи по улучшению, Миколай отвечает только общей реакцией на весь список.</p>\n<p>Полноценное происхождение вампиры получают 2025-10-20 (id 376399–376403, окно w0107), где они вписаны в общую историю появления Оам и в общий список мутантов. Согласно этой истории, когда-то, «во времена, когда были ещё племена по всему миру, а не государство», на землю приземлились метеориты, и из небесных тел «выпустились в воздух, триллион неизвестных частиц» — невидимых и неосязаемых, но существующих. Частицы заполонили весь мир, всё живое, что их вдыхало, гибло: «Лёгкие заполнялось Оам и медленно разрывались на куски». Иммунитет у людей и животных возник только через смену поколений, в ходе эволюции и адаптации. Частицы назвали Оам.</p>\n<p>В той же версии задана общая механика, внутри которой существуют вампиры: человек поглощает Оам через дыхание и через кожу, Оам расходится по кровеносной системе вместе с кислородом и где-то оседает, у каждого человека «своя ёмкость Оам», излишки выходят через споры, с выдохом, через кожу и другими выделениями. «В каждым человеке есть Оам но использовать его не как нельзя», и единственный способ — поглотить нечто с большой концентрацией Оам, после чего либо смерть (лопаются лёгкие или сосуды, останавливается сердце, убивает токсичность), либо человеку «удаётся почувствовать и обуздать Оам», сдержать его до выхода избытков и после этого пользоваться им.</p>\n<p>Вампиры отнесены к мутантам — «это животное и люди, у которых под воздействием Оам изменилось их физиология». Формулировка происхождения дословно: «Это люди у которых мутировала кровь и пищевая система под воздействием Оам». То есть вампиры — не отдельный биологический вид со стороны, а люди с двумя мутировавшими системами: кровью и пищевой системой.</p>", "r": []}, {"t": "Способности", "a": ["S02", "PS-0299-S02", "PS-0299--sposobnosti"], "h": "<p>Способности заданы 2025-10-20 (id 376402, окно w0107) и в неизменном виде повторены 2025-11-05 (id 382108, окно w0108). Их три, все завязаны на кровь:</p>\n<ol>\n<li>Доступ к Оам через выпитую кровь: «Из-за этого если они испьют кровь. То способны почуствовать Оам и так по итогу научиться его контролировать». То есть для вампира питьё крови заменяет тот опасный акт поглощения большой концентрации Оам, через который проходят обычные люди; у вампира это путь «почувствовать» и затем «по итогу научиться» контролировать — не мгновенное умение, а обучение.</li>\n<li>Пополнение запаса: «И также выпивая кровь они могут пополнять запасы Оам». Кровь работает как источник Оам, а не только как первичная инициация.</li>\n<li>Управление собственной кровью: «Их мутировшая кровь легко контролируемая подобно конечности». Сравнение именно с конечностью — кровь для них не оружие и не стихия, а часть тела, которой двигают.</li>\n</ol>\n<p>В самом раннем упоминании (2025-10-02, id 370605) способность сформулирована шире и без деталей — «вампиры который могут контролировать кровь», без уточнения, чья это кровь, своя или чужая. В версии от 2025-10-20 уточнено, что как конечность контролируется именно «их мутировшая кровь».</p>", "r": []}, {"t": "Связи с другими", "a": ["S03", "PS-0299-S03", "PS-0299--svyazi-s-drugimi"], "h": "<p>Вампиры всё время фигурируют не сами по себе, а в списке рядом с другими расами и мутантами.</p>\n<p>В списке от 2025-10-02 (id 370605): Апостолы с сверхспособностями (насекомые), Каменный Поротой, Азуриэль, дети мирового древа.</p>\n<p>В разборе мутантов от 2025-10-20 (id 376401–376402) и его повторе от 2025-11-05 (id 382108) вампиры идут последними после: Апостолов (люди с мутировавшей в утробе нервной системой, мозгом и глазами, «лучший контроль Оам», белые глаза), Аскизов (вечные дети от матки-аксолотля), Детей мирового древа (гуманоидные деревянные существа с оранжевой сердцевиной), Азуриэля (гуманоид-нейросканер), Поротая (мутировавший жук, дающий три исхода при съедении).</p>\n<p>В расстановке сил от 2025-11-17 (id 385768, окно w0109) и её повторе от 2025-12-06 (id 393287, окно w0112) вампиры входят в перечень «расы и организации который равны по силе с друг другом», то есть ниже котов (девять сильнейших) и Апостолов («21 вторая по силе раса на земле»), наравне с детьми мирового древа, Поротаями, Азуриэлями, группировкой сестры, правительской организацией, церковью с паладинами, организацией Виктора, Пернатыми и орденом для убийства котов.</p>\n<p>В служебной части исходника вампиры помечены как связанные с Мировым древом и Оам и как часть Оам. Никакого сюжетного взаимодействия вампиров с Мировым древом или с любой другой расой в переписке не описано — они только соседствуют в списках.</p>", "r": []}, {"t": "Как менялся", "a": ["S04", "PS-0299-S04", "PS-0299--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2025-10-02 (id 370600–370613, окно w0106).</strong> Одна строка в перечне обитателей несформировавшегося мира: «Допустим вампиры который могут контролировать кровь». Вселенная на этот момент по дате объявления неясна. Никакой разработки дальше в этом окне нет.</p>\n<p><strong>Версия 2 — 2025-10-20 (id 376399–376403, окно w0107).</strong> Первое полное описание расы, вписанное в общую систему Оам и в раздел «Мутанты»: мутация крови и пищевой системы, доступ к Оам через питьё крови, пополнение запаса Оам кровью, кровь как управляемая конечность. Сообщение завершается репликой «Пока что так».</p>\n<p><strong>Версия 3 — 2025-11-05 (id 382108, окно w0108).</strong> Текст о вампирах повторён дословно, без единого изменения относительно версии 2. Меняется только объём окружающего материала: сообщение начинается с середины описания Апостолов и содержит те же блоки про Аскизов, детей мирового древа, Азуриэля и Поротая.</p>\n<p><strong>Версия 4 — 2025-11-17 (id 385768–385769, окно w0109).</strong> Механика не расширяется — вместо неё задаётся общественное положение, одной строкой: «Вампиры просто аристократы». Строка стоит в списке сил мира между Пернатыми/орденом убийц котов и Аскизами. Про кровь, мутацию и Оам в этом сообщении не сказано ничего — старое описание не отменено, но и не упомянуто.</p>\n<p><strong>Версия 5 — 2025-12-06 (id 393286–393290, окно w0112).</strong> Список сил повторён дословно, включая строку «Вампиры просто аристократы». После списка Слава добавляет: «Давай вспомним» и «В нашем мире Оэм уже существует много сторон для конфликта» — здесь мир назван «Оэм». Иных сведений о вампирах в этом окне нет.</p>\n<p>Итого движение по версиям: от предположения («допустим») к развёрнутой биологической механике, затем — к социальной роли, заданной вместо дальнейшего расширения механики. Обе линии — кровь-как-механика и аристократия-как-положение — в переписке нигде не сведены друг с другом.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "PS-0299-S05", "PS-0299--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Внешность вампиров не описана ни в одной версии. Ни роста, ни кожи, ни клыков, ни отличий от обычного человека — при том, что для соседних рас (Аскизы, дети мирового древа, Азуриэль, Поротай, матка Аскизов) внешность прописана подробно.</li>\n<li>Характер, поведение, привычки, отношение к людям не названы.</li>\n<li>Не сказано, чью кровь они пьют — человеческую, животную или любую. Слово «кровь» употребляется без уточнения.</li>\n<li>Не сказано, обязательна ли кровь для жизни или только для Оам: описано только пополнение запаса Оам, о голоде и смерти без крови не говорится.</li>\n<li>Не сказано, как вампир становится вампиром: наследуется ли мутация, приобретается ли, можно ли обратить человека. Про Апостолов оговорено, что мутация происходит в утробе матери, про вампиров такой оговорки нет.</li>\n<li>Не сказано, контролируют ли они чужую кровь. Ранняя формулировка «могут контролировать кровь» этого не исключает, поздняя говорит только про «их мутировшая кровь».</li>\n<li>Не описано, в чём состоит мутация пищевой системы, кроме самого факта, что она мутировала.</li>\n<li>Не названы отдельные персонажи-вампиры: ни имён, ни числа, ни лидеров.</li>\n<li>Не сказано, где вампиры живут.</li>\n<li>Аристократами чего они являются — при каком государстве, в какой стране, с какой властью — не сказано; строка от 2025-11-17 и 2025-12-06 стоит без пояснений. В самом исходнике это помечено: «Кроме одной строки ничего нет».</li>\n<li>Как аристократическое положение сочетается с питьём крови и с мутацией — не обсуждалось.</li>\n<li>Не сказано, состоят ли вампиры в союзах или конфликтах с другими сторонами мира, хотя для Поротаев такой союз с апостолами назван.</li>\n<li>Миколай вампиров не комментировал и не дополнял ни в одном из пяти окон; ответы, отклонённые варианты и споры по этой расе в переписке отсутствуют.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0299--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0069.html\">Вампиры</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0008.html\">Оам</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0299--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-10-02</td>\n<td>370600–370613</td>\n<td>w0106</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-10-20</td>\n<td>376399–376403</td>\n<td>w0107</td>\n<td>Оам (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-11-05</td>\n<td>382108–382108</td>\n<td>w0108</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-11-17</td>\n<td>385768–385769</td>\n<td>w0109</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-06</td>\n<td>393286–393290</td>\n<td>w0112</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0299-vampiry.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0299--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0299.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
