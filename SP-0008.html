<script>const BASE="";const DOCNAME="Контроль грешников";
const LEAD="<p>Способность вселенной «7 островов». Даты появления в переписке: 2023-03-27 — 2024-07-10, окна w0011, w0013, w0020, w0047. Варианты названия, встречающиеся в исходнике: «контроль грешника», «контроль грешниками», «контроли грешнико».</p>";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0008-S01", "SP-0008--mehanika"], "h": "<p>Способность даёт власть над людьми, совершившими грехи, и сила этой власти прямо зависит от того, насколько человек грешен. Исходная формулировка Славы (2023-03-27, id 37532): «тем грешней человек тем лучше контролирует он их».</p>\n<p>В более поздней редакции того же правила (2023-05-20, id 41339) оно записано так: «контроль грешников(чем грешней человек тем лучше контролирует он их)».</p>\n<p>Объект контроля в переписке назван конкретно: это сверхлюди, совершающие грехи. В первой версии (id 37532) — «сверхлюдей который делали грехи на подобие безмысленного убийство или каких ещё грехов», в редакции 2023-05-20 (id 41339) — «сверхлюдей которые совершают каинов грех». Носитель способности избавляется от них в прямом эфире.</p>\n<p>Как именно выглядит контроль — что носитель может заставить грешника сделать, действует ли это на расстоянии, нужен ли контакт или взгляд — в переписке не сказано ни в одной из шести версий. Прописано только правило зависимости силы от греховности.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0008-S02", "SP-0008--ogranicheniya-i-cena"], "h": "<p>Прямых ограничений и цены за использование в переписке не названо. Единственное встроенное ограничение следует из самой формулировки: способность работает по грешным людям, и чем меньше греховность — тем хуже контроль. Нижнего порога (работает ли она вообще на негрешном человеке) в переписке не указано.</p>\n<p>Отдельно отмечено, что носитель «Чаще всего он пользуется пистолетом» (2023-03-27, id 37534) — то есть контроль грешников не является его единственным или основным рабочим инструментом. Связь между этим фактом и ограничениями способности в переписке не проговорена.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0008-S03", "SP-0008--nositeli"], "h": "<p>Основной носитель — Парень в белой маске с улыбкой. Его описание из первой версии (2023-03-27, id 37532): «17 летние нормального телосложения ходит в белой маски где нарисовано улыбка черный плащ». В редакции 2023-05-20 (id 41339): «17 летний парень нормального телосложения ходит в белой маске где нарисована улыбка, на его теле черный плащ». Контроль грешников у него всегда идёт под номером один в перечне из шести способностей — во всех редакциях перечня без исключений.</p>\n<p>В сводных перечнях способностей окна w0011 та же способность значится как первая и постоянная способность Демона. В обзорной части окна w0013 (2023-05-20, id 41339) она отмечена как первая и единственная авторская способность парня в белой маске — то есть единственная из шести, придуманная авторами, а не нейросетью.</p>\n<p>В окне w0020 (2023-12-14, id 63306) способность названа как одна из четырёх способностей персонажа, отсылающего к сообщению 37532; имя этого персонажа в самом окне не названо.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0008-S04", "SP-0008--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2023-03-27 (id 37530–37535, окно w0011).</strong> Исходная формулировка Славы: у персонажа «должно быть 6 способности первая способности контроли грешнико( тем грешней человек тем лучше контролирует он их )». Тут же задан вопрос «И какий ещё 5 способность ему дать?». Вселенная в этом окне не определена.</p>\n<p><strong>Версия 2 — 2023-03-27 (id 37546–37552, окно w0011).</strong> Повтор прежней мысли. Способность повторена как первая в перечне: «Первая контроль грешника вторая контроль интернета». Дальше идёт добор списка: «И ещё 4», «Ну регенерация», «Так да 3».</p>\n<p><strong>Версия 3 — 2023-03-27 (id 37572–37578, окно w0011).</strong> Повтор прежней мысли, две последовательные редакции перечня. Сначала (id 37573): «Его первая способность контроль грешниками его вторая ускорения( он может ускорять себя и другие неудушевленый предметы )». Затем (id 37577): «Первая контроль грешниками вторая ускорения третий контроль тела( он может как либо изменять тела и регенерировать)». В обеих контроль грешников остаётся первым номером.</p>\n<p><strong>Версия 4 — 2023-05-20 (id 41338–41341, окно w0013).</strong> Миколай возвращается к теме («Помнишь ты пытался придумать способности персонажу?») и переписывает карточку персонажа набело, сохранив зависимость силы контроля от степени греховности: «первая сверхспособность - контроль грешников(чем грешней человек тем лучше контролирует он их)». Отличие от версии 1: объект уточнён до тех, кто «совершают каинов грех». Остальные пять способностей в этом окне придуманы нейросетью по запросу Миколая.</p>\n<p><strong>Версия 5 — 2023-12-14 (id 63305–63310, окно w0020).</strong> Миколай просит нейросеть нарисовать персонажа и иконки для его способностей: «Сначала забыл упомянуть что должен быть аниме стиль и вышел жуткий чел, но прикольный». Перечень к иконкам: «Сверху слева на право: контроль грешниками, ускорение. Снизу: контроль тела, душа грешника». Контролю грешников соответствует верхняя левая иконка. В этой версии только название в перечне, механика не раскрывается.</p>\n<p><strong>Версия 6 — 2024-07-10 (id 202911–202915, окно w0047).</strong> Повтор прежней мысли. Миколай перевыкладывает старые сообщения («это второй врд»), дословно повторяя формулировку 2023 года: «первая способности контроли грешнико( тем грешней человек тем лучше контролирует он их )» и следом перечень «Первая контроль грешниками вторая ускорения третий контроль тела( он может как либо изменять тела и регенерировать)». Слава на это отвечает: «В чем смысл. Зачем я это написал ?». По дате объявления вселенная здесь — 7 островов; в более ранних окнах вселенная не определена.</p>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S05", "SP-0008-S05", "SP-0008--otklonennye-varianty"], "h": "<p>Сама способность ни разу не отклонялась — она сохраняется первым номером во всех шести версиях. Менялось её окружение: соседние способности в перечне из шести предлагались и не удерживались.</p>\n<p>Предложенное и не вошедшее в поздние перечни:</p>\n<ul>\n<li>Короткая невидимость — предложение Миколая (2023-03-27, id 37535): «Короткая невидимость, когда полиция находит место убийства грешников, для того чтобы он успел скрыться».</li>\n<li>Контроль интернета — второй номер в версии 2 (id 37547).</li>\n<li>Регенерация как отдельный пункт (id 37550); позже она уходит внутрь «контроля тела» (id 37577, 202913).</li>\n<li>Пять способностей, придуманных нейросетью (2023-05-20, id 41340): движение со скоростью света, энергетические взрывы, чтение мыслей, шоковая волна, фотогенез. В перечнях 2023-12-14 и 2024-07-10 ни одна из них не появляется.</li>\n</ul>\n<p>Прямого отказа от этих вариантов в переписке не сказано — зафиксировано только то, что в поздних перечнях их нет.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S06", "SP-0008-S06", "SP-0008--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Способность существует не сама по себе, а как первый пункт перечня из шести. Состав перечня по датам:</p>\n<ul>\n<li>2023-03-27 (id 37547): контроль грешника, контроль интернета, дальше «И ещё 4», из добора — регенерация.</li>\n<li>2023-03-27 (id 37573): контроль грешниками, ускорение («он может ускорять себя и другие неудушевленый предметы»).</li>\n<li>2023-03-27 (id 37577): контроль грешниками, ускорения, контроль тела («он может как либо изменять тела и регенерировать»).</li>\n<li>2023-05-20 (id 41340): контроль грешников плюс пять предложений нейросети.</li>\n<li>2023-12-14 (id 63306): контроль грешниками, ускорение, контроль тела, душа грешника — четыре способности, для которых нарисованы иконки.</li>\n<li>2024-07-10 (id 202913): контроль грешниками, ускорения, контроль тела.</li>\n</ul>\n<p>Заявлено шесть способностей, но полный список из шести в переписке ни разу не собран: максимум доведено до четырёх (2023-12-14) или до шести с нейросетевым добором (2023-05-20).</p>\n<p>По теме способность связана с Каиновым грехом — именно его совершают те, от кого носитель избавляется (id 41339).</p>\n<p>Со способностью «душа грешника» (id 63306) — соседняя по перечню и по корню названия — связь в переписке не проговорена, механика «души грешника» не описана.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "SP-0008-S07", "SP-0008--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Механика контроля не описана: что носитель может делать с грешником, на каком расстоянии, требуется ли контакт или взгляд — в переписке не сказано.</li>\n<li>Не сказано, как измеряется «греховность» и есть ли порог, ниже которого контроль не работает.</li>\n<li>Цена, откат, расход сил при использовании — не названы.</li>\n<li>Полный перечень из шести способностей персонажа не собран ни в одной версии.</li>\n<li>Соотношение носителей не прояснено: в w0011 способность подана как первая и постоянная способность Демона, в w0013 и w0047 — как способность парня в белой маске; связь между Демоном и парнем в белой маске в переписке не проговорена.</li>\n<li>В окне w0020 (2023-12-14) механика и вселенная не описаны; имя персонажа с иконками способностей в окне не названо, дана только отсылка к сообщению 37532.</li>\n<li>Вселенная в окнах w0011, w0013, w0020 не определена; принадлежность к «7 островам» проставлена только по дате объявления для версии 2024-07-10.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0008--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0008--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2023-03-27</td>\n<td>37530–37535</td>\n<td>w0011</td>\n<td>неясно (не определено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2023-03-27</td>\n<td>37546–37552</td>\n<td>w0011</td>\n<td>неясно (не определено)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2023-03-27</td>\n<td>37572–37578</td>\n<td>w0011</td>\n<td>неясно (не определено)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2023-05-20</td>\n<td>41338–41341</td>\n<td>w0013</td>\n<td>неясно (не определено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2023-12-14</td>\n<td>63305–63310</td>\n<td>w0020</td>\n<td>неясно (не определено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-10</td>\n<td>202911–202915</td>\n<td>w0047</td>\n<td>7 островов (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0008-kontrol-greshnikov.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0008--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0008.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
