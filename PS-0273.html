<script>const BASE="";const DOCNAME="Сестра Александра";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0273-S01", "PS-0273--proishozhdenie"], "h": "<p>Младшая сестра Александра Титовского, персонаж вселенной «Апостол». Появляется в тексте Славы от 2025-05-19 (окно w0097, id 328112–328116). Собственного имени в переписке не получила: в тексте она везде «сестра», «сестрёнка», сама к брату обращается «братец».</p>\n<p>На момент действия учится в седьмом классе. Живёт в родном для брата населённом пункте — в тексте он назван сначала деревушкой, потом уточнён: «Хотя какая деревушка, это было деревня городского типа. Она была большая и там жила не мало людей» (328114). Брат к этому времени живёт отдельно, в своей квартире, и работает на заводе; от его квартиры до дома сестры — около трёх часов на машине, при быстрой езде — два часа.</p>\n<p>Разница в возрасте между ней и братом большая. В воспоминании о детстве (328114) она «была ещё такой маленькой. Едва ли научилась ходить тогда», а он в это время уже старший брат, на которого родители «частенько скидывли сидения с сестрой».</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0273-S02", "PS-0273--vneshnost"], "h": "<p>Описания внешности в переписке нет. Единственная названная деталь предмета при ней — цепочка, «которая она не снимала. Который мы подарили ей на день рождения» (328114). По этой цепочке брат и опознаёт то, что осталось от тела.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0273-S03", "PS-0273--harakter"], "h": "<p>Прямых характеристик автор не даёт, характер виден только через сцены.</p>\n<p>В воспоминании о поездке в лес (328114) она — ребёнок, которому интересно всё, и брат следит за её реакциями: «одним из интересов было это реакция ещё маленькой сестры. Она на всё реагировала. Очень эмоционально и это было приятное. Словно я вместе с ней, что-то открываю новое».</p>\n<p>В сцене, когда брат приезжает сообщить о смерти родителей (328113), она сидит дома на диване и смотрит фильм; увидев брата, «радостно подбежала и обняла меня», а не получив ответной реакции — отодвинулась и спросила волнующимся голосом: «братец с тобой всё хорошо?». То есть сначала беспокоится о нём, а не о себе. Услышав про аварию, расплакалась и прижалась к брату — по формулировке автора, «Ей нужно было в этот момент крепкой плечо. Но в тот момент моей плечо, таким не было».</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0273-S04", "PS-0273--svyazi-s-drugimi"], "h": "<p><strong>Александр Титовский</strong> — старший брат. Статья отмечена как «часть чего: Александр Титовский», то есть сестра существует в материале как часть его линии. Отношения описаны с его стороны: в детстве он за ней приглядывал, ему её оставляли; ему же выпадает сообщить ей о гибели родителей, причём начальник настаивает на этом именно потому, что лучше от брата, «Не жили какой то незнакомец» (328112). В момент, когда она звонит и пишет ему с просьбой о помощи, он не отвечает — и вся его дальнейшая линия строится на вине за это.</p>\n<p><strong>Родители</strong> — погибают в автомобильной аварии до её гибели. О смерти ей сообщает брат.</p>\n<p><strong>Клоуны и левитирующий человек</strong> — те, кто устроил резню в посёлке. Известны только из её сообщений брату, пересказанных задним числом (328116). Никакого прямого контакта с ними в тексте не показано: она о них пишет, пока происходит нападение.</p>\n<p><strong>Начальник брата</strong> — с сестрой не встречается, но именно он везёт брата к ней и ждёт в машине у дома.</p>", "r": []}, {"t": "Как менялся", "a": ["S05", "PS-0273-S05", "PS-0273--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2025-05-19, id 328112–328114 (окно w0097).</strong></p>\n<p>Введена как младшая сестра-семиклассница, которой герой должен сообщить о смерти родителей. В этой же версии — воспоминание о семейной поездке в лес, где брат за ней приглядывал (костёр, суп отца — «Не вкусный правда», чай в вечерней мгле леса, звёзды, до которых будто можно дотянуться рукой). Воспоминание обрывается её звонком: «Все мои тёплый воспоминания, обрушил звонок сестры».</p>\n<p>Здесь же — её гибель. Брат не отвечает на звонок, думая, что она спрашивает, когда он приедет, и раздражаясь, что она прервала тёплые воспоминания. Утром он видит «более 30 пропущенных и почти что 100 сообщение», и «смысл каждого сообщение один. \"Спаси братец\"». Он едет и застаёт разрушенный посёлок: погром, кровь, запах железа, дерево в крови, разбитые окна, разнесённый гараж. Из-под двери родного дома течёт кровь. За дверью — «Кровь и плоть. Всё, что видел я. Там было ничего, что напоминала человека. Была лишь цепочка сестры». Сцена заканчивается тем, что он видит в останках шевеление — «не движение тела, а движение опарышие, который наслаждались трапезой».</p>\n<p><strong>Версия 2 — 2025-05-19, id 328116 (окно w0097).</strong></p>\n<p>Роль сестры расширена: её сообщения задним числом становятся единственным свидетельством о том, что происходило в посёлке. Брат листает телефон и перечитывает их. По этим сообщениям: «в деревне всё кричат», «там, что-то происходит», «О человеке, что словно левитироваль. О клоунах, что скакали там и рвали всех людей. О груде тел, что лежали в одном мести. И этот груда достигал словно звезды».</p>\n<p>Порядок событий в самих сообщениях не разложен: сказано только, что она это писала, а не в какой последовательности видела. Погибла ли она до того, как перестала писать, или сообщения оборвались раньше — в переписке не сказано.</p>\n<p>Между версиями образ сестры не переписывался: вторая версия ничего не отменяет в первой, а добавляет содержание её сообщений, которое в первой версии было сведено к одной фразе «Спаси братец».</p>", "r": []}, {"t": "Что с ним стало", "a": ["S06", "PS-0273-S06", "PS-0273--chto-s-nim-stalo"], "h": "<p>Погибла при резне в родном посёлке, вместе со всеми его жителями. Тела как такового не осталось — «Кровь и плоть», по которым брат не может опознать человека; опознание идёт по цепочке.</p>\n<p>Похорон сестры в тексте нет. В версии 2 брат вспоминает, что родителей похоронили другие родственники, пока он лежал в психушке, и что он был у их могил; про её могилу не сказано ничего.</p>\n<p>Дальнейшее её присутствие в тексте — через брата. Он говорит психологу: «именно Я Убил её. Я МОГ ЕЁ СПАСТИ. Если бы я тогда ответил. Если бы я поехал сразу домой» — и отказывается расставаться с виной: «И я не хочу отказываться от этого Чувство Вины. Ведь я виноват», а про себя добавляет: «И это вина словно для меня их оживляет. Не делай просто исчезнувшими. Словно делает их живыми для меня». В финале эпизода он перечитывает её сообщения, лёжа с почти пустой аптечкой, и теряет сознание от передозировки.</p>\n<p>Отдельно у брата проходит мысль о несоразмерности: «Усмехнулся тому, как же оказывается тяжело умереть. Хотя сестре с родителями легко умерли. Как то это даже не правильно. Словно шутка Бога или кого-то сверху».</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0273-S07", "PS-0273--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имя сестры в тексте не названо (отмечено в самом источнике как неясность окна w0097).</li>\n<li>Возраст назван только через класс — седьмой; точных лет нет.</li>\n<li>Внешность не описана.</li>\n<li>Способностей у неё нет; наличие или отсутствие чего-либо сверхъестественного в переписке не обсуждалось.</li>\n<li>С кем она жила после гибели родителей и жила ли одна — не сказано; в сцене приезда брата она дома одна, но об этом не говорится прямо.</li>\n<li>Сколько прошло времени между смертью родителей и резнёй — не указано.</li>\n<li>Содержание её сообщений дано пересказом брата; дословных текстов, кроме «Спаси братец», нет.</li>\n<li>Видела ли она клоунов и левитирующего человека вблизи, что с ней делали и как именно она погибла — не описано; в переписке есть только результат.</li>\n<li>Осталось нерешённым, есть ли связь между аварией, в которой погибли родители, и нападением на посёлок.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["PS-0273--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-05-19</td>\n<td>328112–328114</td>\n<td>w0097</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-05-19</td>\n<td>328116–328116</td>\n<td>w0097</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0273-sestra-aleksandra.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0273--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0273.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0273-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0273/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым чинить не имя. Дороже всего то, что её сообщения даны только пересказом: они — единственный источник о резне, и на них целиком стоит <code>PS-0275</code> «Клоуны и левитирующий человек» (14.4 КБ статьи, 29.8 КБ базы), на них же держится финал <code>PS-0274</code> («Отомсти тем кто убил твою сестру») и цель героя в <code>PS-0271</code>. Одна дыра под тремя статьями, и дословно из ста сообщений в переписке существует одна фраза — «Спаси братец».</p>\n<p>Дальше по цене — отец: сущности нет вовсе, ни статьи, ни строки в <code>blockers.json</code>, при том что он держит связку «начальник — семья», из-за которой её вообще везут к дому. Эпизодические шут (<code>PS-0276</code>) и клоуны запись получили, он — нет.</p>\n<p>И общий фон: у всего куста «Вины» <code>ssylok_na_nego</code> = 0 — у <code>PS-0271</code>, <code>PS-0272</code>, <code>PS-0273</code>, <code>PS-0274</code>, <code>PS-0275</code>, <code>PS-0276</code>, <code>IS-0060</code>. Статья честно пишет «часть чего: Александр Титовский», но в реестре эта часть ни к чему не привязана.</p>\n<h3>С чего начать</h3>\n<p>В базу, не в архив. Сцена 328116, где брат перечитывает переписку, входит в сплошной текст <code>PR-0080</code> (328111–328118) — там видно, что дословных сообщений нет в самом тексте истории, а не потеряно при сборке. То есть это пробел авторский, а не наш, и добывать нечего.</p>\n<p>Что реально можно поднять из архива — обсуждение этого места. Три окна: w0095 (2025-05-16, id 326859–326868) — пролог, который отдельно не скидывался; w0096 (2025-05-17, id 327121–327124) — «добавил 6 новых сценок. И три раза изменил её концепцию», подробностей Слава так и не дал; w0099 (2025-05-27, id 330692–330744) — разбор, где Миколай хвалит «эпизод с палачем и попытку спасти сестру» и отдельно жалуется на «наивность некоторых идей», но конкретику до конца не собирает и обрывает разбор по усталости. Если сцена с сотней сообщений где-то и обсуждалась, то там.</p>\n<h3>Как развивалось</h3>\n<p>2025-05-19, всё за один день, тремя шагами внутри одного окна. 328112–328114 — введена и в той же версии убита: семиклассница, воспоминание о лесе, звонок, тридцать пропущенных, разрушенный посёлок, цепочка. 328116 — роль расширена задним числом: её сообщения становятся единственным свидетельством о резне, но порядок событий в них не разложен. Дальше не возвращались: в разборе 05-27 обсуждались палач, начальник и открывающий вопрос; в нейросетевом разборе 2026-02-08 названы палач, звук железа, отказ сопротивляться и мысль «делает их живыми» — сестра ни в одном разборе не названа. Она нужна дважды: чтобы задать вину и чтобы принести сведения о деревне, и оба раза уже как факт.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для родителей смерть дана полным набором: тела, опознание в морге, похороны родственниками, могилы, у которых герой был. Для сестры того же ряда нет — тела нет, опознание идёт по цепочке, похорон в тексте нет, про могилу не сказано ничего, и герой этому нигде не удивляется. При этом соразмерность он отмечает вслух: «Хотя сестре с родителями легко умерли. Как то это даже не правильно». То есть сравнивать эти две смерти текст начинает — и на том, что осталось от одной и не осталось от другой, останавливается. Правило, по которому от жителей деревни не остаётся тел, названо для родителей и не названо для неё.</p>\n<h3>Отклик</h3>\n<p>Зацепило устройство вины, а не сама вина. Он не отвечает на звонок не из чёрствости — он в этот момент вспоминает её же, маленькую, у костра, и раздражается, что она перебила воспоминание о себе. Такую петлю трудно придумать нарочно, она похожа на найденную. И вторая вещь: сто сообщений сведены к одной фразе «Спаси братец» — это одновременно и самый сильный ход текста, и место, где текст экономит. Дословных сообщений нет; всё, что известно про её последний час, известно с чужих слов и задним числом, и герою при этом отдана роль единственного свидетеля того, чего он не видел. Отдельно отмечу деталь встречи: она сначала спрашивает, всё ли хорошо с ним. Ребёнок, который ещё не знает, беспокоится за взрослого, который уже знает.</p></div>", "r": []}];</script>
