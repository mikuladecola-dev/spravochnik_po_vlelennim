<script>const BASE="";const DOCNAME="Андрей";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0132-S01", "PS-0132--proishozhdenie"], "h": "<p>Имя названо Славой посреди обсуждения устройства общей вселенной (2024-08-08, id 215907–215916, окно w0050): «Кстати гг мой историй зовут Андрей». То есть Андрей вводится сразу как главный герой историй Славы, а не как второстепенная фигура. Никакой разработки в этом окне за именем не следует: реплика стоит между обсуждением границ общей вселенной («получается их объединяет одна вселенная и тематика монстров, больше границ нет», «через 600 лет») и посторонними репликами. Вселенная в этот момент объявлена как «монстры».</p>\n<p>Единственная добавка к имени в том же обмене — реплика Миколая (id 215916): «надеюсь Федореев». Фамилия нигде больше не появляется и не подтверждается.</p>\n<p>Три дня спустя (2024-08-11, id 217635–217641, окно w0051) Слава подводит счёт: «И теперь у нас из персонажей есть Андрей и защитник». Разработки в этом окне тоже нет — персонаж пришёл из более ранних окон, и в самом окне не раскрывается.</p>\n<p>Через восемь месяцев Андрей появляется уже как действующее лицо — в прологе Славы к историям про Максима (2025-05-04, id 323655–323659, окно w0090), а затем в переписанном прологе (2025-05-06, id 323930–323936, окно w0091). Вселенная в обоих случаях не объявлена; по дате объявления эти окна отнесены к «Нимбу». Совпадает ли этот Андрей с главным героем историй Славы 2024 года, в переписке прямо не сказано.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0132-S02", "PS-0132--vneshnost"], "h": "<p>Отдельного описания нет. Единственное, что сказано о его сложении, — чужая реплика в переписанном прологе (2025-05-06, id 323934), где собеседник противопоставляет себя ему: «я атлет, спортсмен, не смог за ним поспевать, а ты дохляк». Сам Андрей это отрицает встречным «сам ты дохляк». Возраст, рост, одежда, лицо не описаны нигде.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0132-S03", "PS-0132--harakter"], "h": "<p>Разработан только по прологам про Максима, и почти целиком через реплики в споре.</p>\n<p>В переписанном прологе (2025-05-06, id 323934) он охарактеризован рассказчиком одной формулировкой: «мой лучший друг, который привык делать всё наоборот».</p>\n<p>Поведение в споре одинаково в обеих редакциях: Андрей не понимает, чего от него хотят, и постепенно раздражается. «а чего такого-то? — не понимал мой друг Андрей»; «да скажи ты уже прямо. Почему не хочешь чтобы Максим с нами ехал — произнёс Андрей, начиная уже злиться». В первой редакции то же место звучит так: «да скажи уже прямо, что такого не так? — произнёс Андрей начиная уже явно злится».</p>\n<p>Он честно признаёт, что с Максимом в поход раньше не ходил («ну нет — ответил честно Андрей»; во второй редакции — «Мой друг нахмурил лицо и лишь слегка повертел головой в право влево»), и не берётся оценивать, поспеет ли за ним: «ну не знаю» / «не з-н-а-ю».</p>\n<p>Обидчивость показана во второй редакции: на «а ты дохляк» он отвечает «че, сам ты дохляк — явно обиделся слегка друг», и тут же огрызается в ответ: «ну раз ты у нас такой атлет. Так чего ты ноешь, Из-за быстрого темпа».</p>\n<p>Отдельная устойчивая черта — он слушает не то, что ему говорят. На перечисление того, что Максим натворил в прошлом походе, он реагирует бытовой деталью: «а так вот откуда у него медведь дома, а лису я не видел» (первая редакция) / «аааа вот откуда у него дома медведь, а лису то я не видел? — совсем о другом думал Андрей» (вторая). Собеседник обрывает: «да я не об этом».</p>\n<p>Заканчивает спор он в обеих редакциях защитой Максима и прекращением разговора: «ну так это же Максим, у него всё идеальное же выходит. Пошли уже. Собираться пора в походе уже» / «ну конечно. Он же Максим, совершённый во всём», при этом кладя руку собеседнику на плечо.</p>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0132-S04", "PS-0132--svyazi-s-drugimi"], "h": "<p><strong>Максим.</strong> Андрей — тот, кто позвал Максима в поход, сам с ним раньше не ходивший. Весь спор в прологе идёт вокруг этого приглашения. Про повадки Максима Андрей ничего не знает и узнаёт их по ходу разговора: скорость («он скакал, как заяц туда сюда»; во второй редакции — «это чупакабра шустрая, быстрая и ловкая. Скачет туда сюда. Бегает то на гору то на речку то на дерева»), похищенный у медведицы медвежонок, пещера, в которой компания заблудилась, пойманная и съеденная лиса. Отношение Андрея к Максиму — восхищение: «у него всё идеальное же выходит» / «совершённый во всём».</p>\n<p><strong>Саша (<a href=\"PS-0051.html\">Саша</a>).</strong> В первой редакции пролога (2025-05-04) спорит с Андреем именно Саша — он атлет, он ходил с Максимом раньше, он стёр ноги до крови. Отношения названы дружескими: «явное не понимая негодование друга».</p>\n<p><strong>Рассказчик историй про Максима.</strong> В переписанном прологе (2025-05-06) роль второй стороны спора занимает рассказчик от первого лица, а Андрей назван его лучшим другом. Имени у рассказчика в этом фрагменте нет. Тождественен ли он Саше, в переписке не сказано.</p>\n<p><strong>Защитник.</strong> Упомянут рядом с Андреем в перечислении наличных персонажей (2024-08-11, id 217636): «И теперь у нас из персонажей есть Андрей и защитник». Никакого взаимодействия между ними в переписке нет.</p>\n<p><strong>Истории про Максима</strong>, <strong>Пролог про Максима</strong> — тексты, в которых Андрей действует.</p>\n<p><strong>Вселенная из мини историй / наша книга монстров («Некрономикон наш»)</strong> — рамка, внутри обсуждения которой имя было названо в 2024 году.</p>", "r": [["Саша", "PS-0051.html"]]}, {"t": "Как менялся — состояния по датам", "a": ["S05", "PS-0132-S05", "PS-0132--kak-menyalsya"], "h": "<p><strong>2024-08-08, id 215907–215916, окно w0050, вселенная «монстры».</strong> Названо только имя и статус: главный герой историй Славы. Всё, что есть, — реплика «Кстати гг мой историй зовут Андрей» и не подтверждённая нигде дальше реплика про фамилию «Федореев».</p>\n<p><strong>2024-08-11, id 217635–217641, окно w0051, вселенная «монстры» по дате объявления.</strong> Повтор прежней мысли, без развития: «И теперь у нас из персонажей есть Андрей и защитник». В том же обмене Миколай говорит «мои персы все сдохли», Слава отвечает «Ну у тебя только одна история» и добавляет: «И вообще мне тоже надо начинать убивать». Кого именно он собирался убивать, не сказано.</p>\n<p><strong>2025-05-04, id 323655–323659, окно w0090.</strong> Первое появление в тексте — пролог к историям про Максима, присланный с условием «Только ты должен будешь сразу ответить». Андрей здесь друг Саши, инициатор приглашения Максима в поход, ничего не знающий о его повадках и злящийся на недомолвки. В самом присланном тексте пролога реплики распределены сбивчиво: почти все ремарки подписаны именем Саши, включая те, что по содержанию принадлежат Андрею. Вселенная в окне не названа.</p>\n<p><strong>2025-05-06, id 323930–323936, окно w0091.</strong> Пролог переписан. Слава объясняет причину: «С тем прологом я бы не смог продолжить». Изменения он сам оценивает так: «Изменения там не особо». Что изменилось для Андрея:</p>\n<ul>\n<li>спорящая с ним сторона — уже не Саша, а рассказчик от первого лица, чьим лучшим другом Андрей назван;</li>\n<li>добавлена характеристика «привык делать всё наоборот»;</li>\n<li>добавлена перепалка про «дохляка» и ответная обида, а также встречное огрызание «так чего ты ноешь, Из-за быстрого темпа»;</li>\n<li>ремарки распределены по говорящим внятно;</li>\n<li>в реплике Андрея о Максиме «у него всё идеальное же выходит» заменено на «совершённый во всём».</li>\n</ul>\n<p>Содержательно спор тот же: приглашение Максима, стёртые ноги, медвежонок, пещера, лиса, суп. Отличия в деталях прошлого похода: в первой редакции Максим завёл их в пещеру «а потом заблудился», во второй — «мы два дня не могли оттуда выйти». В новой редакции добавлено также, что в поход шли шестеро: «Нас тогда было шесть людей. Жалкая горстка людей, по сравнению с угрозой». Первая редакция при этом не отменена явно — Слава просто прислал новую.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0132-S06", "PS-0132--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Кто такой Андрей, в окнах 2024 года не раскрывается вообще: есть имя и статус главного героя, больше ничего.</li>\n<li>Совпадает ли Андрей из историй Славы 2024 года с Андреем из пролога про Максима 2025 года, в переписке не сказано.</li>\n<li>Вселенная в окнах w0090 и w0091 не объявлена.</li>\n<li>Фамилия «Федореев» произнесена один раз как реплика Миколая и нигде не подтверждена.</li>\n<li>Внешность, возраст и род занятий Андрея не описаны. Из контекста звучит только «нашего колледжа» — про Максима, не про Андрея.</li>\n<li>Способностей у него в переписке нет ни одной.</li>\n<li>Что с ним стало, не сказано: обе редакции пролога обрываются на сборах в поход, продолжения в переписке нет.</li>\n<li>В том же сообщении, где прислан первый пролог (2025-05-04, id 323659), Слава прислал отдельный текст от лица другого рассказчика — Алексея, выжившего после «инцидента». Связь этого текста с Андреем в переписке не названа.</li>\n<li>В первой редакции пролога (323658) именем Саша подписаны обе стороны диалога, так что часть реплик Андрея восстанавливается только по смыслу.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0132--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0051.html\">Саша</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0051.html\">Саша</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0132--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-08</td>\n<td>215907–215916</td>\n<td>w0050</td>\n<td>монстры (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-08-11</td>\n<td>217635–217641</td>\n<td>w0051</td>\n<td>монстры (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2025-05-04</td>\n<td>323655–323659</td>\n<td>w0090</td>\n<td>Нимб (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-05-06</td>\n<td>323930–323936</td>\n<td>w0091</td>\n<td>Нимб (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0132-andrey.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0132--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0132.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
