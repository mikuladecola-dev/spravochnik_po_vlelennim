<script>const BASE="";const DOCNAME="Сверхлюди (мнимые герои «Падения небес»)";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0094-S01", "GR-0094--chto-eto"], "h": "<p>Класс носителей сил во вселенной «Падения небес». В переписке названы «сверхлюди» и «сверх люди» (65959 «Хочу вселенную со сверхлюдьми», 65977 «А сверх люди не смогут помочь», 66005 «сверхлюди это обычные люди»), а также «герои» (66003 «Больше не верят героям»).</p>\n<p>Это не поимённо собранный отряд и не организация: разведка отнесла запись к группам, но в переписке речь идёт о категории людей внутри мира, а не о конкретном составе. Отдельных персонажей-сверхлюдей в базе не заведено, поимённого состава нет.</p>\n<p>Вся разработка уместилась в один заход утром 26 декабря 2023 года (2023-12-26, id 65959–66007). Заявка на вселенную принадлежит Славе, устройство сверхлюдей — Миколаю.</p>\n<p>По финальной версии Миколая способностей у сверхлюдей нет вообще: «Способностей нет на самом деле, носители сами их придумали» (65989). Всё, что видно зрителю, — «спец эффекты на камеру» (65990). Это фильм, «Который смотрят люди» и «думают что это правда» (65991–65993). «На самом деле в реальности никто не видел их подвигов» (65994) «И вообще этих людей» (65995).</p>\n<p>При этом угроза, на фоне которой они выступают, настоящая: «А угроза разрушения реальная проблема» (65996). Небо в этом мире буквально трескается и падает кусками, «Типо весь мир это замороженный мыльный пузырь» (65986–65988).</p>\n<p>Сверхлюди обещают справиться: «Люди со способностями говорят что все исправят» (65997). Зрители им верят (65998), «Мир рушится, а вера людей остаётся» (65999). Верят и учёные: «Ученые тоже верят в сверх людей» (66000), «Поэтому ничего не делают для спасения мира» (66001).</p>\n<p>Итог: «В итоге почти все люди умерли» (66002), «Больше не верят героям» (66003) — «Когда мира нет» (66004). Разгадка выдаётся в конце: «Мы узнаем что сверхлюди это обычные люди показывающие эти сцены на камеру возле этого шара» (66005). И после конца мира ничего не меняется: «Шара нет, а они продолжают это делать» (66006).</p>\n<p>Источник импульса назван прямо: «Атака титанов на идею толкнула» (66007).</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0094-S02", "GR-0094--sostav"], "h": "<p>Состав не назван. Поле участников пусто, отдельных персонажей-сверхлюдей в базе нет, ни одного имени, прозвища или числа участников в переписке не звучит.</p>\n<p>Единственное, что о составе сказано: это «обычные люди показывающие эти сцены на камеру возле этого шара» (66005).</p>", "r": []}, {"t": "Общие способности группы", "a": ["S03", "GR-0094-S03", "GR-0094--obschie-sposobnosti-gruppy"], "h": "<p>Реальных способностей нет ни у кого — это и есть общее свойство класса. «Способностей нет на самом деле, носители сами их придумали» (65989), «На самом деле это спец эффекты на камеру» (65990).</p>\n<p>Что общего для всех участников по переписке:</p>\n<ul>\n<li>сила существует только на плёнке, в виде снятых сцен;</li>\n<li>их никто не видел вживую — ни подвигов, ни самих людей (65994–65995);</li>\n<li>они дают обещание всё исправить (65997);</li>\n<li>их держит вера зрителей (65998) и учёных (66000);</li>\n<li>эта вера — причина бездействия остальных: учёные «ничего не делают для спасения мира» (66001);</li>\n<li>съёмки не прекращаются даже после гибели мира (66006).</li>\n</ul>\n<p>В первой завязке Миколая (65977) о них сказано отдельно: «А сверх люди не смогут помочь». Это сказано ещё до объяснения про спецэффекты, как свойство мира: сверхлюди бессильны перед падением неба.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S04", "GR-0094-S04", "GR-0094--otnosheniya-s-drugimi-gruppami"], "h": "<p>Названы три стороны, с которыми сверхлюди связаны в тексте.</p>\n<p><strong>Зрители.</strong> Смотрят фильм и принимают его за правду (65992–65993), верят сверхлюдям (65998). Вера держится дольше мира: «Мир рушится, а вера людей остаётся» (65999). Отпадает только в конце: «Больше не верят героям» (66003) — «Когда мира нет» (66004).</p>\n<p><strong>Учёные.</strong> «Ученые тоже верят в сверх людей» (66000), «Поэтому ничего не делают для спасения мира» (66001). Это единственная названная в переписке причинная связь между сверхлюдьми и гибелью человечества.</p>\n<p><strong>Атлант (Атлант <em>(статьи ещё нет — <a href=\"kb/ID-0025-atlant.html\">исходник</a>)</em>).</strong> В первой завязке Миколая поставлен как цель сюжета рядом с бессилием сверхлюдей: «А сверх люди не смогут помочь» (65977), «И главная миссия найти атланта» (65978). Кто такой атлант и как он связан с падающим небом — не сказано. Сразу за этим идёт реплика 65980 «Ну походу это другое», и дальше атлант не развёрнут.</p>\n<p>Связь сверхлюдей с сущностью «Карма как вера» проставлена в служебных связях базы, но в прочитанных кусках переписки не раскрыта.</p>", "r": [["Атлант", "kb/ID-0025-atlant.html"]]}, {"t": "Как менялась — по датам", "a": ["S05", "GR-0094-S05", "GR-0094--kak-menyalas"], "h": "<p><strong>Заявка, 2023-12-26, id 65959–65961 (Слава).</strong> «Хочу вселенную со сверхлюдьми только там должна быть изюминка только какая?» — вселенная в современности, но нужно на что-то опереться. Никакого устройства сил на этом шаге нет.</p>\n<p><strong>Первая завязка, 2023-12-26, id 65974–65980 (Миколай).</strong> Небо падает и ломается, «Когда полностью сломается всё исчезнет» (65976). Сверхлюди здесь существуют как настоящие носители сил, но бесполезны: «А сверх люди не смогут помочь» (65977). Главная миссия — найти атланта (65978).</p>\n<p><strong>Версия с метеоритами, 2023-12-26, id 65981–65984 (Слава).</strong> Название «Падения небес» дано здесь. За один день падает больше миллиарда метеоритов, «больше 3 миллиардов смертей» (65981). Происхождение сверхлюдей предложено одним из трёх вариантов продолжения (65983–65984): из метеоритов лезут монстры / метеориты выпускают споры и заражают людей / «Или он просто наделил способностями». Последний вариант — единственная в переписке версия происхождения сил у сверхлюдей. Ни один из трёх вариантов не принят и не отклонён прямо.</p>\n<p><strong>Финальная версия, 2023-12-26, id 65985–66007 (Миколай).</strong> Способностей у сверхлюдей нет вовсе, они актёры со спецэффектами возле шара-мира; вера зрителей и учёных приводит к бездействию и гибели почти всех людей; съёмки продолжаются после конца мира. Мир при этом — «замороженный мыльный пузырь» (65988), небо трескается и падает по кусочкам (65986–65987).</p>\n<p>Отклонённые и несведённые варианты:</p>\n<ul>\n<li>монстры из метеоритов (65983) — дальше не используется;</li>\n<li>споры из метеоритов, заражающие людей (65983) — дальше не используется;</li>\n<li>метеориты наделяют способностями (65984) — не согласуется с финальной версией, где способностей нет; прямо не отменено;</li>\n<li>сверхлюди как настоящие носители сил, которые просто «не смогут помочь» (65977) — заменено версией со спецэффектами, но не оговорено как замена.</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S06", "GR-0094-S06", "GR-0094--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет. Ни имён, ни числа сверхлюдей, ни одного отдельного персонажа этого класса в переписке не появляется.</li>\n<li>Иерархия не описана. Кто главный среди сверхлюдей, есть ли главные вообще — в переписке не сказано.</li>\n<li>Различий между участниками нет. Какие именно «способности» они себе придумали, чем один отличается от другого, есть ли у них амплуа — в переписке не сказано.</li>\n<li>Кто снимает фильм, кто заказчик, зачем сверхлюди это делают и зачем продолжают после гибели мира — не сказано.</li>\n<li>Как сверхлюди появились — осталось нерешённым: происхождение предложено только внутри версии Славы с метеоритами (65984) и с финальной версией Миколая не сведено.</li>\n<li>Две версии катастрофы (метеориты у Славы и трескающееся небо-пузырь у Миколая) не сведены, прямо не сказано, какая принята. Название «Падения небес» дано Славой до второй версии и относится к его версии.</li>\n<li>Кто такой атлант и как он связан с падающим небом — не сказано; реплика 65980 «Ну походу это другое» может относиться к нему.</li>\n<li>Отношение сверхлюдей к атланту не описано: сказано только, что они не смогут помочь, а миссия — найти атланта; связаны ли эти два факта, в переписке не сказано.</li>\n</ul></div>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0094--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0094.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0094-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0094/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым чинить атланта. <code>ID-0025</code> — статьи нет, база 2 181, а ссылаются на него двое: эта статья и <code>VS-0009</code>. Это единственная ссылка <code>GR-0094</code> наружу, и ведёт она в пустоту — причём стоит в самом заряженном месте текста, там, где названа главная миссия сюжета.</p>\n<p>Второе, и по числам оно даже дороже: у <code>SP-0033</code> «Карма как вера» база 5 760 при статье 4 187 — в базе лежит на треть больше, чем вычитано. Именно про эту связь <code>GR-0094</code> пишет, что она проставлена в служебных связях, но в прочитанных кусках переписки не раскрыта. Разница между базой и статьёй ровно там, где статья расписывается в незнании.</p>\n<p>Третье — связность. <code>GR-0094</code> — ноль входящих ссылок при статье 12 465. Рядом стоит <code>SP-0032</code> «Сверхлюди-актёры» (статья 6 534, база 3 800, две ссылки) — это та же самая механика, разведённая на две записи: одна собирает входящие, вторая не собирает ничего.</p>\n<h3>С чего начать</h3>\n<p><code>SP-0033</code> — в базе, читать целиком, там 5 760 знаков против 4 187 вычитанных.</p>\n<p>Для атланта в базу идти незачем: 2 181 знак — это ровно те же шесть реплик 65976–65981, что уже приведены в статье, ничего сверх. Поиск по всему архиву даёт слово «атлант» ровно в одном окне — w0021 (2023-12-19 — 2023-12-29, id 64151–69480). То есть дыра материалом не закрывается: её надо не чинить, а зафиксировать как окончательную. Единственное, что там ещё стоит вычитать построчно, — участок 65978–65985, утро 26 декабря, 06:27–07:00: между «главная миссия найти атланта» и версией Славы с метеоритами стоит реплика 65980 «Ну походу это другое», и к чему она относится, определяется только по соседним строкам окна, а не по карточке.</p>\n<h3>Как развивалось</h3>\n<p>Всё уместилось в один час утра 26 декабря 2023.</p>\n<p>Заявили — 65959, Слава: хочу вселенную со сверхлюдьми, нужна изюминка.\nОграничили — 65974–65980, Миколай: небо ломается, сверхлюди не смогут помочь, миссия — найти атланта.\nПереписали — 65981–65984, Слава: метеориты, название «Падения небес», три версии происхождения сил.\nПеревернули — 65985–66007, Миколай: способностей нет вовсе, это съёмка.</p>\n<p>Ни один шаг не отменён вслух. Каждый следующий просто встал поверх предыдущего, и предыдущий остался лежать. Возвращения не было — ни в этот день, ни позже.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Срок веры. Для зрителей он назван прямо и дважды: вера держится дольше мира (65999) и отпадает только тогда, когда мира нет (66003–66004). Учёные поставлены в том же тексте рядом и по тому же основанию: верят (66000), поэтому ничего не делают (66001). Но что стало с их верой в конце — не сказано. Два случая одного устройства, у одного срок проговорён, у второго нет.</p>\n<h3>Отклик</h3>\n<p>Зацепила последняя реплика — 66006, «Шара нет, а они продолжают это делать». Всё, что до неё, ещё можно пересказать как схему: обман, вера, бездействие, гибель. А тут схема кончается и остаётся картинка, которая ни из чего не следует и ничего не объясняет. Никто не смотрит, мира нет, снимать не для кого — и они снимают. Это уже не про обман, это про то, что человек не умеет перестать, даже когда перестало иметь смысл.</p>\n<p>Рядом стоит 65995 — «И вообще этих людей». Пятое слово, приписанное вдогонку к предыдущей реплике: сначала сказано, что никто не видел их подвигов, и тут же добавлено, что и их самих никто не видел. Добавка на ходу, но она переворачивает всё сказанное до неё: не герои соврали про подвиги, а героев вообще не существовало как людей, которых можно встретить. И это единственная строчка, после которой финальная сцена работает.</p></div>", "r": []}];</script>
