<script>const BASE="";const DOCNAME="подруга Асеши";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0140-S01", "PS-0140--proishozhdenie"], "h": "<p>Персонаж Миколая, появляется в истории про Горгону, написанной от первого лица (2024-08-11, id 218122–218123, окно w0052). Отдельно её не придумывали: она возникает внутри текста истории как спутница Асеши. Имени у неё в тексте нет — в справочнике она проходит как «подруга Асеши».</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0140-S02", "PS-0140--vneshnost"], "h": "<p>Не описана.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0140-S03", "PS-0140--harakter"], "h": "<p>Единственное, что о ней известно, — по поведению в двух сценах.</p>\n<p>Разговорчива и вязнет в разговорах: в магазине она задержалась на 28 минут, потому что «там встретила подругу давнюю которая не переставая говорила и не отпускала её».</p>\n<p>Резка и не разбирается: увидев Асешу мокрой и дурно пахнущей на руках у рассказчика, она сразу же выхватывает подругу, даёт рассказчику пощёчину и запрещает подходить к её «малышке». На извинение отвечает логикой, которую рассказчик приводит дословно: «а она сказала, что если бы ничего не было, то я бы не извинялся».</p>\n<p>Опекает Асешу и после этого: на ночёвке «подруга ей твердила, что я ужасен».</p>\n<p>Асеша называется её словом «малышка».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0140-S04", "PS-0140--sposobnosti"], "h": "<p>Способностей не названо. Обычный человек.</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0140-S05", "PS-0140--svyazi-s-drugimi"], "h": "<p><strong>Асеша.</strong> Подруга, которую она сопровождает и опекает. Вместе идут домой, разговаривают «о буднях на рабочем месте и глупых штрафах от начальства». В переписке приведён их разговор по содержанию: человек уволился, а ему говорят, что если через 2 дня не придёт на смену, накинут ещё штраф, при том что он предупреждал об отъезде на Байкал. Рассказчик комментирует, что отчитал бы её начальника, но «в моём положении будет неуместно» — из текста не следует, чьего именно начальника, её или Асеши, и не сказано, кто из двух девушек уволился.</p>\n<p><strong>Рассказчик истории про Горгону.</strong> Влюблён в Асешу, наблюдает за ней. Подруга — препятствие: сначала бытовое (при ней он не может остаться с Асешей наедине и не может унести окаменевшую Асешу, «подруга тоже может что-то заподозрить»), потом прямое (пощёчина, запрет приближаться, уговоры на ночёвке).</p>\n<p><strong>Давняя знакомая в магазине.</strong> Женщина, встреченная в «Тотале», из-за которой подруга задержалась. Больше о ней ничего не сказано.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0140-S06", "PS-0140--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2024-08-11, id 218122–218123.</strong> Единственное состояние, весь материал сразу.</p>\n<p>Роль в сюжете: она уходит в магазин «Тотал» за водой, и ровно на время её отсутствия происходит вся история. Пока её нет, Асеша договаривается с рассказчиком о встрече на следующий день, а затем её обращает в камень Горгона — женщина с дредами в виде змей с белым брюхом, прошедшая мимо с опущенной головой. Рассказчик прямо формулирует, чем ему грозит её возвращение: «подруга совсем скоро придёт и что она подумает.. боже, че за проблемы».</p>\n<p>К моменту, когда рассказчик возвращает Асешу расколдованной, прошло 28 минут — подруга всё это время говорила со старой знакомой.</p>\n<p>Финальная сцена: подруга выходит из магазина, видит Асешу на руках у рассказчика, спрашивает, что случилось и что он с ней сделал, выхватывает её, даёт пощёчину, запрещает приближаться.</p>\n<p>Последнее, что о ней известно: на ночёвке она отговаривает Асешу от свидания, но Асеша с ней не соглашается — «она была с ней не согласна и сказала, что хочет попробовать встретиться».</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0140-S07", "PS-0140--chto-s-nim-stalo"], "h": "<p>Больше не появляется. На момент конца истории рассказчик идёт на свидание с Асешей, состоявшееся вопреки её уговорам.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0140-S08", "PS-0140--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имени в тексте нет.</li>\n<li>Внешность не описана.</li>\n<li>Возраст, род занятий, откуда они с Асешей знакомы — не сказано.</li>\n<li>Из разговора о штрафах и увольнении не следует, кто из двоих уволился и чей начальник обсуждается.</li>\n<li>Не сказано, узнала ли она когда-нибудь, что произошло на самом деле.</li>\n<li>Дальнейшая её роль в переписке не появлялась.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["PS-0140--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-11</td>\n<td>218122–218123</td>\n<td>w0052</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0140-podruga-aseshi.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0140--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0140.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
