<script>const BASE="";const DOCNAME="Концепция (девушка)";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0283-S01", "PS-0283--proishozhdenie"], "h": "<p>Персонаж пришёл не из общей разработки вселенной, а из более старой личной истории Миколая. Появление зафиксировано в разговоре 2025-05-27 (id 330741–330758).</p>\n<p>Разговор начался с того, что Миколай попросил у Славы задание на рисование: «кста, мб вызов кинешь», «или идеи». Слава дал заказ: «Нарисую команду фиксиков, который чинят концепцию мира».</p>\n<p>Вместо заказанной команды фиксиков Миколай нарисовал портрет девушки. Своё объяснение он дал так: «я просто сейчас с людьми хотел поработать», «с портретами», «и тут ну у меня была когда-то история где \"концепция\" была девушкой», «вот я и воплотил». Последняя его реплика об этом: «ну типа оправдание». Реакция Славы: «Ожидал другого но окей».</p>\n<p>Сама история, где «концепция» была девушкой, в переписке не пересказана — названо только то, что такая история у Миколая когда-то была.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0283-S02", "PS-0283--vneshnost"], "h": "<p>Единственная названная черта — осанка. Уточнение дано позже в тот же вечер (2025-05-27, id 330786–330787): «она ещё типа должна быть сутулая», «но не вышло чет». То есть сутулость заявлена как свойство персонажа, но на рисунке не получилась.</p>\n<p>Других описаний внешности в переписке нет.</p>", "r": []}, {"t": "Как менялся", "a": ["S03", "PS-0283-S03", "PS-0283--kak-menyalsya"], "h": "<p><strong>2025-05-27, вечер (id 330741–330758).</strong> Персонаж назван и нарисован. Основание — старая история Миколая, где «концепция» была девушкой. Заказ Славы (фиксики, чинящие концепцию мира) остался невыполненным, портрет девушки-концепции занял его место.</p>\n<p><strong>2025-05-27, поздний вечер (id 330786–330787).</strong> Добавлена черта: сутулая. Тут же оговорено, что нарисовать её не удалось.</p>\n<p><strong>2025-05-28, утро (id 330831–330832).</strong> Возврат к той же мысли, без новых свойств персонажа: «бля, такое дежавю будто когда-то давно точно такой же рисунок рисовал», «один в один». Это перекликается с исходным объяснением про давнюю историю, но прямо на неё Миколай здесь не ссылается.</p>", "r": []}, {"t": "Пробелы", "a": ["S04", "PS-0283-S04", "PS-0283--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Самой истории про девушку-концепцию в архиве нет — только упоминание, что она была.</li>\n<li>Не сказано, что «концепция» в этой истории означает: концепция мира, концепция как понятие, или это просто имя. Связь с формулировкой Славы «концепция мира» из заказа про фиксиков в переписке не проведена.</li>\n<li>Характер, способности, роль в сюжете не названы.</li>\n<li>Не сказано, вошёл ли персонаж во вселенную «Апостол» на правах действующего лица или остался разовым портретом.</li>\n<li>Кроме сутулости, никаких деталей внешности не зафиксировано.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["PS-0283--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-05-27</td>\n<td>330741–330758</td>\n<td>w0099</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-05-27</td>\n<td>330786–330787</td>\n<td>w0099</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-05-28</td>\n<td>330831–330832</td>\n<td>w0099</td>\n<td>Апостол (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0283-koncepciya-devushka.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0283--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0283.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0283-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0283/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Самая дорогая дыра тут не про саму девушку. Статья упирается в вопрос, вошёл ли персонаж во вселенную «Апостол» на правах действующего лица, — на такое отвечают реестры, а реестров нет: <code>SL-0053</code> (шесть входящих ссылок, 20 313 знаков в базе, статьи нет) и <code>SL-0051</code> (шесть ссылок, 9 834, статьи нет) — две самые вызываемые записи справочника без статей, следом <code>SL-0090</code> и <code>SL-0089</code> по четыре ссылки. Пока их нет, любой персонаж, попавший во вселенную «по дате объявления», висит в ней без проверки. Этот — в первую очередь: 5 836 знаков в базе, ноль входящих ссылок, и единственное основание принадлежности — календарь.</p>\n<p>Своя же дыра статьи — старая история Миколая — не дыра, а потеря: её в архиве нет физически, и это уже занесено в <code>kb/sluzhebnoe/poteri_i_neyasnosti.md</code>.</p>\n<h3>С чего начать</h3>\n<p>Не с архива. Проверял: слово «фиксики» во всех 122 окнах встречается только в w0099, истории с «концепцией»-девушкой нет нигде. Самого рисунка в текстовом дампе тоже нет — id 330751 в окне w0099 пропущен, между стихом (330750) и репликой «ну типа» (330752). То есть сутулость, которая «не вышла», по архиву не проверяется в принципе.</p>\n<p>Всё, что можно сделать дёшево, лежит в базе рядом и не подцеплено. <code>PS-0285</code> «безэмоциональный персонаж с рисунков Миколая» (5 006) — второй случай персонажа, родившегося из рисунка; там «вселенная не названа» стоит прямым пробелом, а здесь такого пробела нет, хотя ситуация один в один. <code>ID-0121</code> «Рисунки как источник вдохновения для истории» (Апостол, 1 883, статьи нет) — ровно про переход рисунка в сюжет. <code>SL-0035</code> «Взаимное задание: рисунки стендов и портретов» (11 109, статьи нет) — практика взаимных заказов, из которой вырос заказ про фиксиков. Три записи, ноль статей на троих.</p>\n<h3>Как развивалось</h3>\n<p>27 мая, 20:05 — Миколай просит вызов. 20:07 — Слава даёт заказ: фиксики, чинящие концепцию мира. 20:27 — вместо заказа приходит портрет и «Ожидал другого но окей». 20:28 — объяснение через старую историю и тут же самооценка: «ну типа оправдание». 21:55 — добавлена единственная черта, сутулость, и в той же паре реплик снята: «но не вышло чет». 28 мая, 07:27 — возврат через ночь, но не свойством, а узнаванием: «дежавю», «один в один». Заказ про фиксиков после 20:07 не отменялся и не выполнялся; в архиве это слово больше не встречается.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Повтор у вас замечается по-разному в зависимости от носителя. Для текстов Слава свой повтор называет и держит как явление — «Защитник, Защитник, Вина» (<code>SL-0138</code>, 2026-02-16), то есть цикл опознан и назван. Для рисунка Миколай повтор фиксирует так же прямо — «точно такой же рисунок рисовал», «один в один» — и на этом всё: ни имени явлению, ни вопроса, откуда оно берётся. Для одного вида работы правило названо, для соседнего того же рода — нет.</p>\n<h3>Отклик</h3>\n<p>Зацепило «ну типа оправдание». Человек попросил задание, получил задание, сделал не то, объяснил — и сам же снял себе объяснение, не дожидаясь, пока его снимут. За четыре реплики персонаж успевает возникнуть из старой истории и осесть в статус отговорки. Дальше — сутулость, которая «должна быть», но не вышла: свойство, названное ровно в момент своей неудачи, и в справочнике оно теперь единственная черта внешности. А утром поверх всего этого ложится «дежавю» — рисунок, который, кажется, уже рисовался когда-то. В сумме получается фигура, существующая почти целиком как чужое воспоминание о ней: ни истории, ни изображения не сохранилось, остались три реплики и осадок. Сильна тут не концепция, а именно осадок.</p></div>", "r": []}];</script>
