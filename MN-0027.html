<script>const BASE="";const DOCNAME="Пустой город";
const LEAD="";
const CH=[{"t": "Где находится — в каком мире и в каком его месте", "a": ["S01", "MN-0027-S01", "MN-0027--gde-nahoditsya"], "h": "<p>Вселенная — Иссекай (объявлено). Монумент входит в историю «Любимый город» (окно w0117) — в разделе «Часть чего» город указан как часть «Любимого города».</p>\n<p>Внутри самого города место действия — конкретная пятиэтажка, на крыше которой герой приходит в себя, и улицы вокруг неё. Где эта пятиэтажка стоит относительно остального города, в переписке не сказано. Как герой туда попал, тоже не объясняется: он просыпается уже там.</p>\n<p>Сам герой опознаёт место как чужое по траве: «В городе — в тем более в моём — травы на его улицах хрень найдешь, а значит я где-то в лесу». То есть город, где герой жил, и город, в котором он очнулся, — разные, и второй не назван.</p>", "r": []}, {"t": "Что собой представляет", "a": ["S02", "MN-0027-S02", "MN-0027--chto-soboy-predstavlyaet"], "h": "<p>Город без людей, машин и птиц. Выйдя из подъезда, герой оглядывается: «Нифига. Никого не было. Ни взглядов отвращения из-за грязных штанов. Ни гула машин. Ни даже песни наших младших пернатых братьев. Ничего». Тишина отдельно отмечена: «Настолько тихо, что звенит в ушах или это потому что я всё же плохо прикрыл голову и стукнулся».</p>\n<p>Части города, названные в переписке:</p>\n<p><strong>Крыша пятиэтажки.</strong> На крыше — подстриженный газон: лужайка «строго постриженная, словно прическа солдата». Бортиков у крыши нет — герой отмечает это отдельно, как опасность: «Я находился на крыше, без бортиков, то есть, кто нибудь из этих спящих бедолаг в принципе мог перевернуться и выпасть». Кроме травы, на крыше есть бетонное сооружение с железной дверью и надписью «Выход с крыши».</p>\n<p><strong>Подъезд и лестница.</strong> Внутри — застоявшийся воздух: дверь открывается, «обдавая меня застоявшимся воздухом», бежать по такому помещению «охренеть как приятное, когда вдыхаешь пыльный и вонючий воздух, и чувствуешь как пылинки оседают в твоих лёгких. При этом душно до ужаса». Здание опознаётся как заброшка: «Нет здесь людей, вещей которые бы обозначали, что здесь живут». Есть перила, ступеньки, бетонный пол внизу, открытая дверь на улицу.</p>\n<p><strong>«Магазин 24».</strong> Маленький магазин с вывеской «магазин 24», на вид работающий. Железная дверь не заперта. Внутри темно, но «магазин как магазин, стеклянный витрины за которым разная продукция», причём воздух здесь, в отличие от подъезда, не застоявшийся. Есть прилавок, бутылки с водой, холодильник для напитков с алкоголем. Товар на месте, продавца нет.</p>\n<p><strong>Ночной переулок.</strong> Отдельно назван переулок, в котором герой приходит в себя уже ночью. Отмечено, что темнота города не даёт пробиться лунному свету: «В темноте города, что не давали пробиться луному цвету, не было видно цвет жидкости».</p>", "r": []}, {"t": "Что с ним связано — предметы, механики, силы", "a": ["S03", "MN-0027-S03", "MN-0027--chto-s-nim-svyazano"], "h": "<p><strong>Открывающиеся двери.</strong> Все двери герою открываются. Это проходит через текст дважды и оба раза отмечено как везение, а не как объяснённое свойство места. Дверь с крыши: «Я дергаю дверь. И о чуда она открылась». Дверь магазина: «Я с надёжной дёрнул железную дверь и... Почему то на двери мне сегодня везёт. Хотя я всегда был везунчиком». Механика как механика в переписке не объявлена — она только зафиксирована в навигации записи как свойство города («Все двери герою открываются»).</p>\n<p><strong>Работающий на вид магазин при пустом городе.</strong> Продукция на витринах, вода и алкоголь в наличии, воздух свежий — при том, что жилое здание рядом заброшено. Расхождение не комментируется.</p>", "r": []}, {"t": "Персонажи и события — кто с ним связан и что там происходило", "a": ["S04", "MN-0027-S04", "MN-0027--personazhi-i-sobytiya"], "h": "<p><strong>Герой-рассказчик.</strong> Имя не названо. О себе сообщает, что жизнь его «не назвать удачной»: «пару горячительных напитков и интересные таблеточки, конечно и сигареты»; в азартные игры не играл, «потому что чаще всего выигравал»; сердцеедом не был, «потому что болела голова от попыток угодить другому человеку». Телефон у него кнопочный — «телефон у меня кирпич», геолокацию не показывает («В армию же можно с кирпечем, а значит он не показывает геолокацию»).</p>\n<p>Просыпается на крыше с похмельем: сухое горло, рвотные позывы, пульсирующая голова. Себя на подстриженном газоне определяет как чужого: «мне мясоеду не место на зелёной лужайке», «единственный я белая ворона».</p>\n<p><strong>Шесть человек на газоне.</strong> Кроме героя, на крыше лежат без сознания шестеро — «старики и дети, женщины и мужчины»: мужчина средних лет с обручальным кольцом на пальце, пацан лет десяти, подросток, молодая женщина в отключке, старичок, девчуля-подросток. Герой описывает состав как «Идеальная команда для семейного конкурса» и отмечает, что все «такие ухоженные». Присутствие десятилетнего мальчика для него — довод против версии, что это чей-то розыгрыш: «\"Прикольно приколист решил пьяных людей сюда притащить\" — подумал бы я. Если бы здесь не было десятилетнего мальчика».</p>\n<p><strong>Жених.</strong> Мужчина в чёрной кофте — тот самый, с обручальным кольцом. Просыпается вторым, захлопывает дверь на крыше, быстро сбегает по лестнице мимо упавшего героя, на мгновение останавливается, «но быстро потеряв ко мне интерес побежал дальше вниз». Герой считывает его лицо как «уж слишком собраным и полным надежд» и делает вывод: «\"И куда он так целеустремленно несётся\" — появление это мысли обозначало бы, что Жених что-то знает. Ну или он психанул, когда очнулся на крыше и просто начал бежать». Куда он бежал и что знал, в переписке не сказано.</p>\n<p><strong>Ход событий.</strong> Герой уходит с крыши первым — по принципу «Бей, беги, замри» выбирает бег, потому что оставаться в группе, «в которой я очнулся первым, и в которой я самый подозрительный, не лучшая идея». На лестнице слышит хлопок двери и топот сверху, бежит, прыгает через ступеньки, неправильно рассчитывает расстояние, падает, разбивается о бетонный пол, его рвёт на собственные штаны. Мимо пробегает Жених. Герой выходит на улицу, обнаруживает пустой город, идёт искать воду («Каким бы не был ты героем, ты не сможешь совершать великий подвиги не утолив свои билогический хателки»), находит «магазин 24», перелезает через прилавок и пьёт воду.</p>\n<p>Вода его разочаровывает: «в моих фантазиях вкус воды был таким приятным, а на деле просто безвкусная вода». Дальше он берёт пиво из холодильника — соблазн подан как голос напитков: «Эй дружек выпей нас. Тебе сразу полегчает». Далее — запой прямо в магазине: пустые банки и стеклянные бутылки на полу, дебош («Бить ветрины, разбивать бутылки»), справил нужду в магазине, пел. Эти события даны как обрывки: «воспоминания начали тускнеть, и то что произошло дальше, лишь кадроми проносятся в голове».</p>\n<p>Приходит в себя ночью в переулке, в луже тёплой жидкости, с болью в боку. Мысли идут в порядке: «Че я за свинья под себя сходил», потом «Бок...болит», потом «кровь?!». Он отползает от лужи. Цвета жидкости не видно из-за темноты, «Но в моёй голове цвет уже был ярко красным». Чем закончился этот эпизод, кто его ранил и ранил ли, в приведённом куске не сказано — текст обрывается здесь.</p>", "r": []}, {"t": "Как менялся по версиям — по датам", "a": ["S05", "MN-0027-S05", "MN-0027--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2026-02-14 (окно w0117, id 432538–432540).</strong> Первое и основное описание: крыша с газоном без бортиков, шесть спящих людей, дверь «Выход с крыши», застоявшийся воздух заброшенной пятиэтажки, пустые улицы без людей, машин и птиц, «магазин 24» с товаром и незапертой дверью, ночной переулок. Всё, что известно о городе, задано здесь.</p>\n<p><strong>Версия 2 — 2026-02-16 (окно w0117, id 433182–433184).</strong> Единственное уточнение касается размера газона на крыше. Миколай прикидывает: «насколько она широкая интересно, 150 м²». Слава отвечает: «Хрен знает». Площадь так и осталась неуточнённой.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "MN-0027-S06", "MN-0027--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Природа города не объяснена: иной мир, симуляция или опустевшая реальность — в переписке не сказано. Вопросы героя («Что это за город?», «Почему здесь никого нет?», «Как я здесь оказался?») остаются без ответа в тексте.</li>\n<li>Название города не дано.</li>\n<li>Площадь газона на крыше осталась нерешённой: предложено 150 м², не подтверждено.</li>\n<li>Почему все двери открываются, не объяснено — герой списывает на везение.</li>\n<li>Куда бежал Жених и что он знал, не сказано.</li>\n<li>Что стало с остальными пятью людьми на крыше, не сказано.</li>\n<li>Откуда рана в боку и кто в городе мог её нанести — на приведённом куске не раскрыто; при этом город описан как совершенно пустой.</li>\n<li>Почему в магазине воздух свежий, а в жилом доме застоявшийся, не комментируется.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MN-0027--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0087.html\">Группа на крыше (шесть спящих и рассказчик)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0005.html\">Иссекай</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MN-0027--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-02-14</td>\n<td>432538–432540</td>\n<td>w0117</td>\n<td>Иссекай (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-02-16</td>\n<td>433182–433184</td>\n<td>w0117</td>\n<td>Иссекай (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/monumenty/MN-0027-pustoy-gorod.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MN-0027--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MN-0027.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
