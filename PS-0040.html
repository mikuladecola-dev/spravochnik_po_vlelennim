<script>const BASE="";const DOCNAME="Нерадио Попов";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0040-S01", "PS-0040--proishozhdenie"], "h": "<p>Персонаж вселенной «игра бога», придуман Миколаем. Появляется одним сообщением — готовой карточкой (2024-04-02, id 153328, окно w0029). Карточка подана целиком за один раз: имя, возраст, короткое описание человека и блок способности с механикой. Других версий у персонажа нет, к нему не возвращались.</p>\n<p>Возраст в карточке указан как «20 годиков».</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0040-S02", "PS-0040--vneshnost"], "h": "<p>Внешность отдельно не описана. Из карточки есть только состояние тела: «Слабый по здоровью человек».</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0040-S03", "PS-0040--harakter"], "h": "<p>Наркоман и наркодилер. Про род занятий сказано двумя словами сразу — «наркоман и нарко диллер».</p>\n<p>«любит шутки о суициде говоря о том что не достоин жить делая те ужасы которые может» — то есть шутки про суицид у него завязаны на собственные поступки: он считает, что не достоин жить из-за того, что способен делать. При этом «пытается казаться сильным и крутым».</p>\n<p>Что именно из «тех ужасов» он делал, в переписке не сказано — названа только сама способность и её механика.</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0040-S04", "PS-0040--sposobnosti"], "h": "<p>Одна способность — поглощение души прикосновением, с жёстким счётчиком касаний.</p>\n<p>Базовая формулировка: «при прикосновении поглощает душу, в месяц одна».</p>\n<p>Счётчик касаний внутри месяца устроен так: «Если раз коснётся за 1 месяц, то добытая душа уйдёт, если 3 раз то его уже душа уйдёт». То есть за пределами одной души в месяц каждое следующее касание отбирает — сначала добытое, потом своё. Первое лишнее касание стоит ему уже полученной души, следующее — собственной.</p>\n<p>Отдельная ветка механики — заряжание наркотиков душами: «Души можно добавлять в наркотики и всякий кто их употребит на 20 минут будет во власти души хранящейся в наркотике». Власть над употребившим держится 20 минут и принадлежит не самому Попову, а душе, которая хранится в наркотике.</p>\n<p>За использование души таким образом он платит сдвигом собственного лимита: «Если отдал душу наркоте, то смерть будет уже от 2 прикосновения, а не 3». Отданная в наркотик душа уменьшает запас касаний на одно — смертельным становится второе, а не третье.</p>\n<p>Способность и род занятий у него сцеплены: он наркодилер, и его сила напрямую работает через наркотики.</p>", "r": []}, {"t": "Как менялся", "a": ["S05", "PS-0040-S05", "PS-0040--kak-menyalsya"], "h": "<p>Одно состояние.</p>\n<ul>\n<li><strong>2024-04-02 (id 153328, окно w0029)</strong> — полная карточка сразу: возраст, слабое здоровье, наркоман и наркодилер, шутки о суициде, попытка казаться сильным и крутым; способность поглощения души прикосновением, одна душа в месяц, счётчик касаний (второе касание уводит добытую душу, третье — его собственную), души в наркотиках дают 20 минут власти над употребившим, отдача души наркотику сдвигает смерть на второе прикосновение.</li>\n</ul>\n<p>Правок и переработок после этого не было.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0040-S06", "PS-0040--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Внешность не описана — есть только «слабый по здоровью».</li>\n<li>«те ужасы которые может» не раскрыты: что конкретно он делал, в переписке не сказано.</li>\n<li>Связи с другими персонажами не названы. С кем он взаимодействует, кому подчиняется, есть ли у него окружение — не сказано.</li>\n<li>Не сказано, что происходит с поглощённой душой, если её не пускать в наркотик: где она хранится, можно ли её потратить иначе.</li>\n<li>Не сказано, отсчитывается ли месяц календарно или от первого касания.</li>\n<li>Не сказано, что происходит после третьего касания технически — «его уже душа уйдёт» не расшифровано (смерть, поглощение кем-то, что-то иное); при этом в пункте про наркотики то же самое названо словом «смерть».</li>\n<li>Не сказано, работает ли способность на любое прикосновение или требует намерения.</li>\n<li>Судьба персонажа не описана — что с ним стало, в переписке нет.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0040--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0049.html\">Команда Миколая (10 персонажей игры бога)</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0049.html\">Команда Миколая (10 персонажей игры бога)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0014.html\">игра бога</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0040--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-04-02</td>\n<td>153328–153328</td>\n<td>w0029</td>\n<td>игра бога (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0040-neradio-popov.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0040--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0040.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
