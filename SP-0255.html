<script>const BASE="";const DOCNAME="Власть";
const LEAD="<p>Способность апостола Графа. Разрабатывалась с 2025-12-06 по 2026-06-02 (окна w0112, w0120), шесть версий. Вселенная Оам — объявлена в окне w0112; в окне w0120 вселенная в чате не названа.</p>";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0255-S01", "SP-0255--mehanika"], "h": "<p>Власть — это область, внутри которой Граф контролирует всё. При заведении (2025-12-06, id 393298) сказано коротко: «Его способность власть. Контроль всего, что есть в определенном радиусе».</p>\n<p>Через полгода Слава возвращается к способности специально, чтобы снять неверное прочтение (2026-06-02, id 487011): «Граф. Я говорил что его способность власть ну толком не описал ее. Ты наверное думал что это просто телекинез. И сейчас я тебе всё объясню». Развёрнутое объяснение (id 487012): «Во первых под властью имеется виду область, в который Граф всё контролирует. Абсолютно все».</p>\n<p>Контроль не сводится к перемещению предметов: в область входит в том числе температура (id 487013). Под контроль попадает и собственное тело Графа, если он покрывает властью себя (id 487014).</p>\n<p>Способов применения три (id 487012: «Поэтому у него есть три способа использования власти»).</p>\n<p><strong>Первый способ (id 487013).</strong> «Просто покрыть область властью. Область примерно 10 метров. Ну и все. В данное области он абсолютно всё контролирует. Даже температуру. Ну и он также получает дохрена информацие. Данные способ удерживать очень сложно». Это самая сильная и самая тяжёлая форма: полный контроль десятиметровой области, но с максимальным потоком информации.</p>\n<p><strong>Второй способ (id 487014).</strong> «Это просто покрыть властью своё тело плёнкой. То бишь он получает всю информацию о своём теле. И так же поверх получает физическая увеличения силы и полета. Потому что он полностью контролирует своё тело и может составить его летать или усилить властью». Даёт усиление физической силы и полёт, при этом «дохрена силы и информацию получаемые куда меньше».</p>\n<p><strong>Третий способ (id 487015).</strong> «Это создания обсласти власти отдельно от себя. Создать область власти 1 метр. Но на расстоянии от себя на 1 км. И контролировать всё что находиться в этой власти. Ну и также получать информацию об о всем в данное области». Это не самостоятельный режим, а дополнение: «Третий способ это просто дополнение которое используется в комбинации с первым или со вторым».</p>\n<p>Заявленный уровень силы (2025-12-06, id 393298): «Достаточно силён, чтобы разнести гору».</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0255-S02", "SP-0255--ogranicheniya-i-cena"], "h": "<p><strong>Информационная перегрузка — основной дефект.</strong> Слава называет его прямо (2026-06-02, id 487012): «И так сказать дефект. В данное область где Граф использует власть. Он также получает всю информацию. Информацию до атома, до мельчайшего движения он получает абсолютно всю информацию о данное области. Представляешь как это напрягает мозг. Поэтому он не способен использовать власть очень долго. Потому что у него просто мозги расплавиться». Контроль и информация неразделимы: за всё, что Граф контролирует, он расплачивается тем, что всё это узнаёт до атома. Отсюда и три способа — они различаются тем, сколько информации приходится вынести.</p>\n<p><strong>Ограничения по способам.</strong></p>\n<ul>\n<li>Первый способ (область 10 метров): «Данные способ удерживать очень сложно» — максимум информации, минимум времени удержания.</li>\n<li>Второй способ (плёнка по телу): информации меньше, но «данные способ является плох именно в защите. Потому что ты просто можешь не успеть защититься если атака будет быстрое». В сравнении с ним первый способ защищает лучше: «Но если власть у тебя будет областью 10 метров то ты успеш остановить атаку. Схватить человека не давая ему вообще двигаться. Или просто уклониться от атаки».</li>\n<li>Третий способ (метровая область на расстоянии до 1 км): «сам Граф в это время останется беззащитным. И поэтому его надо совмещать с другим вариантам».</li>\n</ul>\n<p><strong>Плёнка сверхлюдей (2026-06-02, id 487170, раздел «Условности»).</strong> «У сверхлюдей есть как бы плёнка что защищает от воздействия других способности. Чем сильнее сверхчеловек тем больше плёнка. Поэтому граф против особо сильных не может раздавить их просто или остановить сердца». Это ограничение введено не для власти отдельно, а как общее правило мира, и власть подпадает под него: против сильного противника прямое убийственное применение контроля не работает. Там же (id 487174) даны свойства плёнки: «Плёнка есть у всех и развивается она с возрастом. То есть с психическом росте. Ну это у обычных людей. У сверхлюдей способные её чувствовать. И поэтому они прокачивають её с помощью тренировок, а не психического роста».</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0255-S03", "SP-0255--nositeli"], "h": "<p>Единственный носитель — апостол Граф. При заведении (2025-12-06, id 393298) он описан как «высокомерный и беспечный апостол, что веселиться», у которого «своя банда ( просто для развлечения) грубо говоря он король преступного мира». Там же ему приписано ещё одно свойство помимо власти: «плюсом он быстрейший апостол ( хотя этот титул носит другой Апостол. Ну по факту он быстрее)». Граф назван одним из трёх сильнейших — наряду с Нуаром из котов и девушкой на стороне людей, которая «одна из немногих, что может изменять законы мира».</p>\n<p>Других носителей власти в переписке нет.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0255-S04", "SP-0255--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-12-06 (окно w0112, id 393297–393300), вселенная Оам.</strong> Власть заведена одной фразой внутри перечня трёх сильнейших: «Его способность власть. Контроль всего, что есть в определенном радиусе. Достаточно силён, чтобы разнести гору». Ни радиус, ни ограничения, ни цена не заданы. В той же реплике сказано, что у Графа «в будущем появиться девушка для стабилизации его нарцисцеческого характера» (id 393299).</p>\n<p><strong>Версия 2 — 2026-06-02 (окно w0120, id 487010–487012).</strong> Слава возвращается к способности через полгода, начиная с отвода неверного толкования — власть это не телекинез. Введены два ключевых пункта: область, в которой контролируется абсолютно всё, и дефект в виде полной информации об этой области «до атома, до мельчайшего движения», из-за чего власть нельзя держать долго. Объявлено, что способов применения три. Разговор идёт в паре с разбором способностей Нуара (кровь, слова, молния, тьма) в предыдущей реплике.</p>\n<p><strong>Версия 3 — 2026-06-02 (окно w0120, id 487013).</strong> Первый способ: область около 10 метров, полный контроль всего внутри, включая температуру, максимум информации, удерживать очень сложно.</p>\n<p><strong>Версия 4 — 2026-06-02 (окно w0120, id 487014).</strong> Второй способ: власть плёнкой поверх собственного тела. Даёт физическое усиление силы и полёт, информации получает значительно меньше, но плохо защищает от быстрых атак. Тут же — сравнение с первым способом по защите.</p>\n<p><strong>Версия 5 — 2026-06-02 (окно w0120, id 487015–487016).</strong> Третий способ как дополнение: отделённая от себя область власти в 1 метр на расстоянии до 1 км, с тем же контролем и той же информацией; в это время сам Граф беззащитен, поэтому применяется только в комбинации с первым или вторым.</p>\n<p><strong>Версия 6 — 2026-06-02 (окно w0120, id 487170–487175).</strong> Раздел «Условности», где ограничения раздаются сразу нескольким способностям. Для власти введён потолок: из-за плёнки сверхлюдей Граф «против особо сильных не может раздавить их просто или остановить сердца». В том же куске Миколай сбрасывает ссылку на страницу про баланс (id 487173, telegra.ph/balans-06-02-3), и Слава добавляет правила про плёнку и предлагает продолжить: «Ну это не плохая пищя для размышлений. Придумаю способность и тебе скину. И ты идей кидай. Ок?» (id 487175).</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S05", "SP-0255-S05", "SP-0255--svyaz-s-drugimi-sposobnostyami"], "h": "<ul>\n<li><strong>Плёнка сверхлюдей</strong> — общее правило мира, ограничивающее власть: чем сильнее сверхчеловек, тем толще его плёнка и тем хуже на него действует контроль Графа.</li>\n<li><strong>Способности Нуара</strong> (управление собственной кровью, слова-приказы, молния, тьма) разбираются в том же разговоре 2026-06-02 и в том же разделе «Условности» получают свои ограничения — Нуар «больше не превращает воздух во тьму. Он превращает только твёрдые и жидкие вещества». Прямого взаимодействия власти и тьмы в переписке не описано, кроме общего правила про плёнку.</li>\n<li><strong>Способность девушки, изменяющей мир волнами</strong> (2025-12-06, id 393300: «Помнишь фантазера с волнами. Вот её способность. По сути она одна из немногих, что может изменять законы мира») названа в том же перечне трёх сильнейших; как она соотносится с властью — не сказано.</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S06", "SP-0255-S06", "SP-0255--probely"], "h": "<div class=\"gaps\"><ul>\n<li>В окне w0112 радиус власти и ограничения не заданы — они появляются только через полгода.</li>\n<li>В окне w0120 вселенная в чате не названа.</li>\n<li>Не сказано, сколько именно Граф может удерживать власть — «очень долго» и «удерживать очень сложно» не переведены ни в какую меру времени.</li>\n<li>Не сказано, можно ли комбинировать первый и второй способы между собой; в комбинации описано только применение третьего как дополнения.</li>\n<li>Не сказано, как соотносится «достаточно силён, чтобы разнести гору» (2025-12-06) с десятиметровым радиусом первого способа (2026-06-02).</li>\n<li>Не сказано, как власть получена и есть ли она у кого-то ещё.</li>\n<li>Не описано, что происходит при превышении предела — «мозги расплавиться» сказано как оборот, последствия не расписаны.</li>\n<li>Не сказано, насколько толстая плёнка нужна, чтобы полностью защититься от власти, и есть ли способ её пробить.</li>\n<li>Девушка «для стабилизации его нарцисцеческого характера» упомянута как будущая линия; в связи со способностью не разобрана.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0255--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0071.html\">Банда Графа</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0255--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-12-06</td>\n<td>393297–393300</td>\n<td>w0112</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-02</td>\n<td>487010–487012</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-02</td>\n<td>487013–487013</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-02</td>\n<td>487014–487014</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-02</td>\n<td>487015–487016</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-06-02</td>\n<td>487170–487175</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0255-vlast.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0255--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0255.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
