<script>const BASE="";const DOCNAME="История про трубадура";
const LEAD="";
const CH=[{"t": "Содержание", "a": ["S01", "IS-0021-S01", "IS-0021--soderzhanie"], "h": "<p>О чём история — в переписке не сказано. В окне w0050 она только названа: Миколай сообщает, что «и ещё историю про трубадура написал» (2024-08-08, id 215933). Ни пересказа, ни отрывка, ни имени героя, кроме самого слова «трубадур», в окне нет.</p>\n<p>Сам текст в окне w0050 не приводится — он выложен позже, в окне w0051 (id 217672), в стихотворной форме. Стихи в справочник не идут, поэтому текст здесь не воспроизводится.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S02", "IS-0021-S02", "IS-0021--mesto-vo-vselennoy"], "h": "<p>Вселенная — «монстры», по дате объявления (2024-08-08).</p>\n<p>В том же коротком куске переписки история названа в одном ряду с двумя другими: сразу после трубадура Миколай говорит «и про мотылька» (id 215934), а непосредственно перед этим речь шла про «цветы, воспитание» и «романтику» (id 215930). На реплику Славы «Стих» (id 215931) Миколай отвечает «ну частично» (id 215932). Таким образом история про трубадура связана с «Историей про мотылька» и «Историей про цветы, воспитание и романтику» — но связь эта только перечислительная: все три названы как недавно написанные, каких-либо сюжетных или мировых связей между ними в переписке не названо.</p>", "r": []}, {"t": "Состояние", "a": ["S03", "IS-0021-S03", "IS-0021--sostoyanie"], "h": "<p>К 2024-08-08 история уже написана — Миколай упоминает её в прошедшем времени, как одну из недавно законченных (2024-08-08, id 215930–215940). Переписывалась ли она, версий не зафиксировано: у записи один вариант, одно окно (w0050), один день.</p>\n<p>Текст выложен в следующем окне, w0051 (id 217672), в стихотворной форме.</p>", "r": []}, {"t": "Пробелы", "a": ["S04", "IS-0021-S04", "IS-0021--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Содержание истории неизвестно: в окне w0050 текст за краем окна.</li>\n<li>Персонажи не названы — кроме обозначения «трубадур» в самом названии, ничего нет; кто он, в переписке не сказано.</li>\n<li>Место действия, мир, время — не названы.</li>\n<li>Обсуждения истории между соавторами нет: Слава на упоминание не отвечает, разговор сразу уходит на другую тему (id 215936 и далее).</li>\n<li>Отклонённых вариантов, промежуточных состояний и правок в переписке не зафиксировано.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["IS-0021--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-08</td>\n<td>215930–215940</td>\n<td>w0050</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/istorii/IS-0021-istoriya-pro-trubadura.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["IS-0021--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/IS-0021.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
