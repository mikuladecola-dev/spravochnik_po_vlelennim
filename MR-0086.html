<script>const BASE="";const DOCNAME="Религия и церковь";
const LEAD="<p>Ветка о религии средневекового мира (<a href=\"MR-0084.html\">Средневековый мир</a>): почему её надо переделать относительно реальной и есть ли в мире бог. Обсуждалась 21 декабря 2024 года (2024-12-21, id 272346–272514, окно w0067).</p>";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0086-S01", "MR-0086--ustroystvo"], "h": "<p>Исходная посылка: религию мира нельзя брать из реальности как есть. Миколай: «религию», «надо изменить», «ибо из-за религии пидарасы церковные сжигали \"магов\"» (id 272346–272348). Механику реального обвинения он разложил так: «а всё потому что бог один», «а маги язычники», «тобиж многобожники» (id 272351–272353).</p>\n<p>Развёрнутый вид того же рассуждения — вечером: «в средневековье магов жгли и если читать почему», «одна из тем обвинения», «язычество», «многобожество то есть», «типа», «у тих в религии богов много», «хотя повсеместно популярно христианство», «и один бог», «церковь имеет власть», «и сильнее государство» (id 272363–272373).</p>\n<p>В придуманном мире эта расстановка не работает, потому что маги слишком сильны. Слава: «Сейчас маги имеет большой влияний в королевстве и магии обучают даже солдат поэтому церковь ничего не может сделать» (id 272372). Отсюда вывод Миколая: «и это отражено в религии», «она другая», «100%» (id 272374–272376), с согласием Славы: «Да» (id 272377). Чем именно религия мира отличается — в переписке не сказано, зафиксировано только то, что она другая.</p>\n<p>Бог в мире есть. На вопросы Миколая «а бог вообще есть?» и «а может его убили?» (id 272451–272452, с пояснением «ну да примитивно но интересно че ты думаешь», id 272453) Слава ответил «Есть» (id 272509), а на «а где он?» (id 272512) — «В небесах» (id 272513). Предложение Миколая «тогда помимо магии будет скверна» (id 272510) Слава отклонил: «Нет» (id 272511). Ещё одно «Нет» стоит последней репликой (id 272514) — к чему оно относится, из переписки не следует.</p>\n<p>В середину этого обмена попадает формулировка Миколая о табу: «Табу - это запреты, направленные на защиту маны и предотвращение ее загрязнения или утечки» (id 272508). Связана ли она с религией и церковью или относится к отдельной теме маны, в переписке не оговорено; обсуждения этой формулировки в окне нет.</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0086-S02", "MR-0086--naselenie"], "h": "<p>Церковь как сторона мира названа в итоговой реплике дня по конструкции мира: «Стороны церковь эльфы король и т п» (id 272882, см. <a href=\"MR-0084.html\">Средневековый мир</a>). В самой этой ветке церковь описана только через отношение к магам: в реальном средневековье она «имеет власть» и «сильнее государство», в придуманном мире «ничего не может сделать».</p>", "r": [["Средневековый мир", "MR-0084.html"]]}, {"t": "Место во вселенной — как связан с другими мирами", "a": ["S03", "MR-0086-S03", "MR-0086--mesto-vo-vselennoy"], "h": "<p>Часть средневекового мира <a href=\"MR-0084.html\">Средневековый мир</a>. Напрямую сцеплена с положением магов в обществе (<a href=\"MR-0085.html\">Маги в обществе</a>): вывод о том, что религия другая, сделан именно из влияния магов в королевстве. Также в окне названа Мана — как через вопрос Славы о её происхождении, так и через определение табу.</p>", "r": [["Средневековый мир", "MR-0084.html"], ["Маги в обществе", "MR-0085.html"]]}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0086-S04", "MR-0086--kak-menyalsya-po-versiyam"], "h": "<p><strong>2024-12-21, 15:16 (id 272346–272359).</strong> Первая постановка: религию надо изменить, потому что в реальности церковь жгла «магов» — бог один, а маги многобожники. Здесь же Слава спросил: «Типо мана это сила дарованная высшим ?» (id 272354). Миколай ответил «хз», «посморим», «ща», «позже» (id 272355–272358). Слава: «Оба» (id 272359). Вопрос остался открытым.</p>\n<p><strong>2024-12-21, 16:31–16:33 (id 272361–272377).</strong> Развёрнутое обоснование через реальную историю и вывод: раз маги влиятельны и магии обучают даже солдат, религия в мире другая «100%».</p>\n<p><strong>2024-12-21, 19:24–19:57 (id 272451–272514).</strong> Бог есть, его не убивали, он «В небесах». Скверна как добавка к магии отклонена.</p>", "r": []}, {"t": "Отклонённые варианты", "a": ["S05", "MR-0086-S05", "MR-0086--otklonennye-varianty"], "h": "<ul>\n<li>«а может его убили?» (id 272452) — вариант с убитым богом не принят: бог есть и он в небесах.</li>\n<li>«тогда помимо магии будет скверна» (id 272510) — скверна как вторая сила помимо магии отклонена Славой (id 272511).</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S06", "MR-0086-S06", "MR-0086--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Чем именно религия мира отличается от реальной, не сказано: зафиксировано только «она другая», «100%».</li>\n<li>Сколько богов в мире, как устроен культ, что делает церковь вместо сожжений — в переписке нет.</li>\n<li>Происхождение маны осталось нерешённым: на «мана это сила дарованная высшим ?» ответ был «хз», «позже».</li>\n<li>Определение табу (id 272508) стоит без контекста: к религии оно относится или к отдельной теме маны, не оговорено, и обсуждения не последовало.</li>\n<li>Реплика «Нет» (id 272514) в конце обмена ни к чему в тексте не привязана.</li>\n<li>Отношения церкви с королём и эльфами не обсуждались — стороны названы только позже и без разбора.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0086--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0084.html\">Средневековый мир</a>, <a href=\"MR-0085.html\">Маги в обществе</a></li>\n<li><strong>Упомянут в мирах:</strong> <a href=\"MR-0084.html\">Средневековый мир</a>, <a href=\"MR-0085.html\">Маги в обществе</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0086--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-12-21</td>\n<td>272346–272359</td>\n<td>w0067</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-21</td>\n<td>272361–272377</td>\n<td>w0067</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-21</td>\n<td>272451–272514</td>\n<td>w0067</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0086-religiya-i-cerkov.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0086--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0086.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
