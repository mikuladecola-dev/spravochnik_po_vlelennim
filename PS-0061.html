<script>const BASE="";const DOCNAME="Монстр-маньяк";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0061-S01", "PS-0061--proishozhdenie"], "h": "<p>Персонаж появился 2024-04-08 (окно w0031, сообщения 155056–155115) как рисунок Миколая, сделанный по ранее заключённой договорённости соавторов. Договорённость озвучивает Слава: «Мы же договорились в понедельник монстров нарисовать» (155058). То есть монстр рисуется не под конкретный сюжет, а внутри общего уговора рисовать монстров.</p>\n<p>Миколай сразу оговаривает, что работа не закончена: «Ну если что, я ток начал, поэтому да, немного позже скину» (155071). Готовый вариант он показывает примерно через час, со словами «Ну какая то такая задумка» (155073). Сам рисунок — изображение; в тексте архива его нет, есть только описания вокруг него.</p>\n<p>Отдельно указано, что образ рисовался с натурного источника: «По этой фотке рисовал» (155082), и что при этом опробована техника, которой Миколай раньше почти не пользовался — «Карандаш боком положил, где грифель толстой стороной и так выходили более широкие мазки» (155084), с оговоркой «Ну это база. Но я такое почти никогда не юзал» (155085–155086).</p>\n<p>Варианты имени, зафиксированные в базе: «маньяк убийца», «монстр», «монстр-маньяк (\"Человек - это самый страшный монстр\")». Собственного имени персонажу не дано.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0061-S02", "PS-0061--vneshnost"], "h": "<p>Заявленное телосложение — жирный и одновременно мускулистый. Слава реагирует на рисунок вопросом «А чё я такой жирный» (155074) — то есть монстр рисовался с него как с модели или в его образе; в переписке это прямо не разъяснено. Миколай отвечает цепочкой обоснований: «Изначальный набросок» (155075), «Потому что урод» (155076), «Ну» / «Монстр» / «Монстры все уроды» (155077–155079), «Вот и думал как тя приукрасить» (155080), «Подумал что жирные дядьки жуткие» (155081). То есть полнота здесь — не небрежность рисунка, а сознательно выбранный источник жути.</p>\n<p>Мускулатура при этом заявлена как настоящая, а не как противоречие полноте: «На самом деле люди с таким телосложением очень сильные» (155094), «И мускул много» (155095). Слава возражает — «Не всегда» (155096), Миколай сужает утверждение до одного случая: «Но в данном случае да» (155097). Слава подтверждает, что на рисунке это читается: «Мускулистый прям видна» (155089).</p>\n<p>Поза на рисунке описана как момент нападения на зрителя: «сейчас он тянет к тебе руки чтобы прикончить» (155087).</p>\n<p>Раса — «полу эльф полу гоблин полу человек» (155090). Формулировка дана Миколаем сразу после тезиса о человеке как самом страшном монстре, с оговоркой «Но в данном случае».</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0061-S03", "PS-0061--harakter"], "h": "<p>Отдельно характер не проговаривался. Вся характеристика сводится к роду занятий: «маньяк убийца» (155087). Психология, мотивы, речь, привычки в переписке не обсуждались.</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0061-S04", "PS-0061--sposobnosti"], "h": "<p>Способностей в смысле сверхсил персонажу не приписано. Названы только физические качества: «очень сильный и мускулистый» (155087). Сила объясняется телосложением, а не даром.</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0061-S05", "PS-0061--svyazi-s-drugimi"], "h": "<p>В базе указана связь с персонажем Славы (с глазами психа). В самих сообщениях окна w0031 эта связь не проговаривается — она проходит по служебному полю записи.</p>\n<p>Тематически рядом стоит образ мясокомбината, который Миколай вводит как пояснение к идее монстра: «Типа есть же мясокомбинат» (155106), «И там туши коров на крюки вешают» (155107), «А тут людишки» (155108). Отдельной сущностью мясокомбинат в переписке не оформлен — он звучит как объяснение того, что должно было получиться на рисунке.</p>", "r": []}, {"t": "Как менялся", "a": ["S06", "PS-0061-S06", "PS-0061--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2024-04-08, сообщения 155056–155090.</strong>\nПервый набросок и заявленная задумка. Монстр как урод; жирный дядька как источник жути; техника — карандаш боком. Здесь же названа раса: полуэльф-полугоблин-получеловек (155090). До этого Миколай отдельно просил не идти по какому-то заданному принципу: «Го не по принципу» (155062), «Не по этой штуке» (155064) — о чём именно речь, в переписке не сказано.</p>\n<p><strong>Версия 2 — 2024-04-08, сообщения 155087–155115.</strong>\nСмысловое ядро формулируется словами: «задумка в том что это маньяк убийца, очень сильный и мускулистый, и сейчас он тянет к тебе руки чтобы прикончить» (155087) и «Человек - это самый страшный монстр» (155088). Обсуждение силы полных людей (155094–155097). Затем — признание Миколая, что образ не сработал так, как задумывался: «У меня не удалось передать идею так как хотел» (155099), «Не удалось донести эту мысль» (155100), «В следующий раз я лучше постараюсь и не облажаю» (155101), «Но сейчас я хз как улучшить» (155102). Реплика Славы «Бля я думаю ну нет, ты же не совсем, а это человечки» (155104) вызывает пояснение про мясокомбинат (155106–155108) — люди на крюках вместо коровьих туш.</p>\n<p>Между версиями задумка не переписывалась и не отменялась: вторая версия — это доформулировка и разбор первой в тот же вечер.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0061-S07", "PS-0061--chto-s-nim-stalo"], "h": "<p>Обсуждение закрывается вечером того же дня прощанием (155109–155110). Персонаж больше не разрабатывался: даты записи — 2024-04-08 — 2024-04-08, окно одно (w0031). Последняя относящаяся к рисунку реплика — оценка Миколаем чужой работы, а не продолжение персонажа: «Не, на самом деле лица у тебя уже выходят охуенно и стиль некий выработан» (155115).</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0061-S08", "PS-0061--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имени персонажу не дано.</li>\n<li>Вселенная в самой переписке не объявлена; принадлежность к «игре бога» проставлена по дате объявления.</li>\n<li>Не сказано, задумывался ли он как персонаж общей вселенной или только как образ для учебного рисунка.</li>\n<li>Не разъяснено, почему монстр рисовался в образе Славы и значит ли это что-либо для персонажа.</li>\n<li>Не сказано, что именно означает «Не по этой штуке» (155064) — от какого принципа предлагалось отойти.</li>\n<li>Характер, имя, происхождение внутри мира, место действия не обсуждались.</li>\n<li>Как соотносится раса «полуэльф-полугоблин-получеловек» с тезисом «Человек - это самый страшный монстр», не проговорено.</li>\n<li>Мясокомбинат с людьми на крюках назван, но не привязан ни к какому месту или сюжету.</li>\n<li>Сам рисунок — изображение, в тексте архива его нет.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["PS-0061--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-04-08</td>\n<td>155056–155090</td>\n<td>w0031</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-04-08</td>\n<td>155087–155115</td>\n<td>w0031</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0061-monstr-manyak.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0061--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0061.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
