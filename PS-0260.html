<script>const BASE="";const DOCNAME="Обитатели корабля";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0260-S01", "PS-0260--proishozhdenie"], "h": "<p>Обитатели корабля (в переписке отдельного названия не имеют, по ходу текста именуются «медведь» и «гуманоид») появляются во второй брошенной истории — прозаическом фрагменте, который Слава выложил одним заходом 2025-04-21 (id 320984–320988, окно w0088). Версия одна, других состояний у записи нет.</p>\n<p>Место действия — Заброшенный корабль исполняющего желания. Люди попали на него по письмам: «я как бы письмо получил. Там в этом письме об этом месте и говорилось», письмо от «организации \"нимб\"». Ника формулирует это так: «Одна из крупнейших организаций всего мира написала нам о корабль. Разве это не странно». Корабль стоит «посреди моря». Откуда на корабле взялись сами существа, кто их туда поместил и связаны ли они с организацией «Нимб» — в переписке не сказано.</p>\n<p>Повествование идёт от первого лица, от лица участника группы; в карточке записи он указан как Артём, но в самом тексте фрагмента имя рассказчика не названо.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0260-S02", "PS-0260--vneshnost"], "h": "<p>Существа показаны в два приёма, и оба раза — не целиком.</p>\n<p>Первое появление — только лапа за углом коридора: «Едва показалось рука?. Нееет лапа зверя. Медведь? Не знаю». Размер лапы рассказчик оценивает так: «даже она была по размеру, как моя голова». Вид животного остаётся догадкой самого рассказчика, в тексте он всё дальнейшее время называет существо «медведь» и «монстр».</p>\n<p>Второе появление — в тёмной комнате, где остановилась группа. Здесь описание подробнее: «Что-то двигалось во тьме, как бы сюрреалтстичной это не звучало бы. Но во тьме двигалось тьма. Как бы это сказать в обычной тьме помещения передвигался гуманоид, который был ещё черней чем тьма вокруг». Форма — гуманоидная, конечности с когтями («Схватил своей когтистой лапой ногу Ники»). Телосложение: «Хоть он был и тощим. Но спина выглядела сильной». Спина отдельно отмечена как чёрная: «Чёрная спина его было».</p>\n<p>Тело после смерти меняет свойства: «Тело его стало мягким и податливым».</p>\n<p>Одно ли это существо в обоих эпизодах или разные — в переписке не сказано, это отмечено и в самой записи как неясность.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0260-S03", "PS-0260--harakter"], "h": "<p>Повадки описаны только через действия, речи или намерений существу не приписано.</p>\n<p>Гуманоид действует в полной темноте и бесшумно — рассказчик обнаруживает его только тогда, когда «ещё не привыкшем зрением увидел движения», уже после того, как двое из группы исчезли. Он не нападает на спящего рассказчика, а вытаскивает людей поодиночке: Игорь и Паша к этому моменту уже пропали, Нику существо тащит за ногу «куда-то», не убивая на месте. Вывод рассказчика: «Получается их это существо утащил во мрак корабля, а я здесь».</p>\n<p>При ударе ножом существо ревёт («Он заревел») и пытается достать нападающего руками: «Лишь махал руками, который не могли до меня до тянуться». Сопротивляется недолго — «Он не долго барахтался».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0260-S04", "PS-0260--sposobnosti"], "h": "<p>Прямо как способности в переписке они не оформлены; из текста следует только следующее.</p>\n<p>Существо перемещается в темноте и остаётся при этом чернее темноты. Оно физически сильно настолько, чтобы утаскивать взрослых людей — Игоря (описан как «высокий мужчина в очках», «Не смотря на длинный рост был худым») и школьника Пашу оно уносит целиком, Нику тащит за ногу. При этом «тощим» телосложением сила не объясняется, отмечена только спина.</p>\n<p>Уязвимость обычная: удар ножом между лопаток убивает. «Ночь свободно прошёл между лопаток» (в тексте опечатка, речь о ноже — дальше: «я держал нож в спине», «я быстро вынул нож из спины»). Способ фиксации — удержание за шею с ножом в спине: «В таком положении он ничего не сделает».</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0260-S05", "PS-0260--svyazi-s-drugimi"], "h": "<p><strong>Заброшенный корабль исполняющего желания</strong> — существа обитают внутри корабля, запись отнесена к кораблю как часть. Отдельно от корабля они нигде не появляются.</p>\n<p><strong>Ника</strong> — студентка «одетая в джинсы и в рубашку», волосы крашеные, «желто-розовый или как то так». Гуманоид тащит её за ногу; на момент его смерти она «всё ещё было без сознания». Что было дальше — фрагмент обрывается.</p>\n<p><strong>Игорь</strong> — «клерк», сам представляется первым; получил письмо об этом месте. Унесён существом во мрак корабля, момент этого в тексте не показан.</p>\n<p><strong>Паша</strong> — «пацан. Вообще школьник кажись», не умеет плавать, к концу боится и говорит «я хочу домой». Унесён вместе с Игорем, момент не показан.</p>\n<p><strong>Рассказчик (в карточке — Артём)</strong> — единственный, кто существ видел и опознал заранее, единственный с фонариком, и единственный, кто убил гуманоида. Про себя он сообщает: «Я привык быть в чужих органах и крови», «Мой шедевр, где-то там, а я здесь, чтобы зделать, то что нужно», и упоминает жену и дочь дома.</p>\n<p>Кроме того, в том же фрагменте есть две вещи, чья связь с обитателями корабля в переписке не оговорена:</p>\n<ul>\n<li><strong>Выпотрошенное тело в коридоре.</strong> Пол коридора булькает под ногами, рассказчик спотыкается и падает лицом в «выпотрошенном теле без кожи», ломая ему ребро. Кто снял кожу и выпотрошил тело — не сказано.</li>\n<li><strong>«Холод».</strong> Когда группа останавливается на отдых, на рассказчика накатывает тоска: «Тоска этого место залазила мне словно в грудь», холод спускается ниже, «Касаясь уже не сердце, а как будто бы самой моей естество». Дальше он назван как действующее лицо: «\"Холод\" Не знал какой же я. Не знал мою извращенную натуру. Не знал, что я не сожалею. Он думал, что найдёт уязвимость. Но сам же утонул в безумий красок, волн, взрывов. Там был фестиваль, всё взрывалось. Было цветной море. Холоду здесь было не месту». Является ли «Холод» одним из обитателей корабля, отдельной сущностью или состоянием — в переписке не сказано.</li>\n<li><strong>Тени.</strong> «тени начали кидаться под ноги. Мы спотыкались на ровном месте» — при движении по коридору с единственным фонариком. Отнесены ли тени к существам, не сказано.</li>\n</ul>", "r": []}, {"t": "Как менялся", "a": ["S06", "PS-0260-S06", "PS-0260--kak-menyalsya"], "h": "<p><strong>2025-04-21 (id 320984–320988, окно w0088), версия 1.</strong> Единственное состояние. Введены обе формы: лапа-«медведь» за углом коридора и чёрный гуманоид в тёмной комнате, показаны его повадки и смерть от ножа. Позднее к записи авторы не возвращались; в переписке правок и переработок нет.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0260-S07", "PS-0260--chto-s-nim-stalo"], "h": "<p>Гуманоид, напавший на группу в комнате, убит: нож между лопаток, рёв, короткое сопротивление, «Тело его стало мягким и податливым». Рассказчик вынимает нож и поворачивается к Нике.</p>\n<p>Существо, чья лапа мелькнула за углом в начале, из текста больше не появляется; сведено ли оно с гуманоидом — не сказано.</p>\n<p>Сама история брошена — фрагмент заканчивается на моменте после убийства, следующее сообщение в переписке — реплика Миколая «спасибо что скинул» (id 320988). Продолжения нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0260-S08", "PS-0260--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Одно это существо или разные — прямо отмечено как неясность в записи, в переписке не сказано.</li>\n<li>Происхождение существ, их природа и связь с организацией «Нимб» не названы.</li>\n<li>Не сказано, что стало с Игорем и Пашей после того, как их унесли: живы, мертвы, где именно «мрак корабля» — всё осталось нерешённым.</li>\n<li>Не сказано, кто выпотрошил тело в коридоре и связано ли оно с этими существами.</li>\n<li>Не сказано, что такое «Холод» и относится ли он к обитателям корабля.</li>\n<li>Сколько существ на корабле, есть ли у них язык, разум, цель — не обсуждалось.</li>\n<li>Судьба Ники после убийства гуманоида не показана: история обрывается, пока она без сознания.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0260--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0074.html\">Четверо на корабле («супер группа»)</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0260--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-04-21</td>\n<td>320984–320988</td>\n<td>w0088</td>\n<td>Нимб (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0260-obitateli-korablya.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0260--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0260.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
