<script>const BASE="";const DOCNAME="Дети мирового древа";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0067-S01", "GR-0067--chto-eto"], "h": "<p>Раса гуманоидных деревянных существ во вселенной «Оам». Не отряд и не организация с поимённым составом: в переписке «Дети мирового древа» появляются только как народ целиком, отдельных представителей у них нет ни одного.</p>\n<p>Первое появление — в перечне обитателей ещё не сформировавшегося мира (2025-10-02, id 370605), рядом с апостолами, Каменным Поротоем, Азуриэлем и вампирами: «И дети мирового древа».</p>\n<p>Внешность и устройство описаны одной формулировкой, которая дальше повторяется почти без изменений: «гуманноидный деревянный существо с оранжевой сердцевинной, в котором как раз и хранится Оам» (2025-10-20, id 376401). Оранжевая сердцевина — место хранения Оам внутри тела.</p>\n<p>Происхождение в переписке названо двумя способами, и они не сведены между собой:</p>\n<ul>\n<li>(2025-10-02, id 370600) «Существо порождённым мировым древом», и там же: «Так как они из дерева мирового древа».</li>\n<li>(2025-10-20, id 376401) «Произошли от мутировшого дерева из-за Большого количества Оам».</li>\n</ul>\n<p>Какое из двух объяснений отменяет другое и является ли «мутировшое дерево» самим мировым древом — в переписке не сказано. Само мировое древо как объект мира отдельно не расписано.</p>\n<p>В общем разборе мира они отнесены к промежуточным злодеям (2025-12-06, id 393305).</p>", "r": []}, {"t": "Общие способности группы", "a": ["S02", "GR-0067-S02", "GR-0067--obschie-sposobnosti-gruppy"], "h": "<p>Полный набор дан в первом же описании (2025-10-02, id 370605) и затем повторён дословно 2025-10-20 (id 376401), 2025-11-05 (id 382108):</p>\n<ul>\n<li>Смена облика: «Они могут изменить образ на человеческий».</li>\n<li>Прочность: «Хрен ты их пробьешь, не кто из апостоловы не сможет нормально их ранить». Прочность прямо объясняется материалом: «Так как они из дерева мирового древа».</li>\n<li>Регенерация: «а если ранят они будут регенерировать».</li>\n<li>Физическая сила: «они сверхсильный (сильнейший наверное в физическом плане)».</li>\n<li>Передвижение: «Они могут передвигаться в земле и внутри деревьях».</li>\n<li>Огнестойкость: «Огонь их не перед. Сам огонь на них тухнет» (2025-10-02, id 370605). В версии от 2025-10-20 (id 376401) та же строка записана как «Огонь им не вредит. Сам огонь на них тухнет».</li>\n<li>Бой: «они могут выпускать корни туда сюда ими драться».</li>\n</ul>\n<p>Оам хранится в оранжевой сердцевине (2025-10-20, id 376401). Как именно они его расходуют, поглощают или применяют — в переписке не сказано; описанная там же общая механика Оам (ёмкость, поглощение, выброс излишков) расписана для людей, а не для них.</p>", "r": []}, {"t": "Иерархия", "a": ["S03", "GR-0067-S03", "GR-0067--ierarhiya"], "h": "<p>Внутренняя иерархия расы в переписке не описана — ни вождей, ни старших, ни разделения на касты не названо.</p>\n<p>Место расы в иерархии сил мира задано в общем перечне (2025-11-17, id 385768; повторено 2025-12-06, id 393287): сильнейшие — коты, «Апостолы 21 вторая по силе раса на земле», а дальше идут «расы и организации который равны по силе с друг другом», и Дети мирового древа перечислены первыми в этом равном ряду — вместе с Поротоем, Азуриэлем, группировкой сестры, правительской организацией, церковью с паладинами, организацией Виктора, пернатыми, вампирами и Аскизами.</p>\n<p>Отдельно отмечено, что оговорка про расы не покрывает всех: «опять раса, в мире есть просто индивиды который могут быть сильными» (2025-11-17, id 385768).</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S04", "GR-0067-S04", "GR-0067--otnosheniya-s-drugimi-gruppami"], "h": "<ul>\n<li>Апостолы. Названы единственной стороной, чьё отношение к Детям мирового древа проговорено прямо, и только в терминах прочности: «не кто из апостоловы не сможет нормально их ранить» (2025-10-02, id 370605; повторено 2025-10-20, id 376401). Ни союза, ни вражды с апостолами не названо.</li>\n<li>Клан крылатых (Серафим), церкви, люди, Виктор. Поставлены с Детьми мирового древа в один разряд — промежуточных злодеев: «Вообще промежуточными злодеями будут Дети мирового древа И клан крылатых ( Серафим)» (2025-12-06, id 393305), затем «Ну или церкви, да и люди иногда» (id 393306) и «Да еще и Виктор, что воскрешает трупы, ну точнее делает из них марионеток» (id 393308). Это общий разряд, а не союз: взаимодействий между ними не описано.</li>\n<li>Прочие расы и организации ряда (Поротой, Азуриэль, вампиры, Аскизы и остальные). Связаны с Детьми мирового древа только равенством по силе. Союзы в этом перечне отмечены у других — «Проротой каменный челике. Владеют преступное организацию. Некий союз с апостолами» — у Детей мирового древа никаких союзов не указано.</li>\n<li>Основные злодеи (дочь Имитатора Имита и Бог красок, 2025-12-06, id 393313–393314) с Детьми мирового древа в переписке никак не связаны.</li>\n</ul>", "r": []}, {"t": "Как менялась — по датам", "a": ["S05", "GR-0067-S05", "GR-0067--kak-menyalas"], "h": "<p><strong>2025-10-02, id 370600–370613.</strong> Введены в первом перечне обитателей мира: «Кто есть пока что не в сформировавшиеся мире». Сразу же дано полное описание — облик, оранжевая сердцевина, смена образа, непробиваемость, регенерация, сверхсила, движение в земле и в деревьях, огнестойкость, бой корнями. Происхождение — от мирового древа. Тут же просьба: «Если есть идея по их улучшения кидай» (id 370606). Ответ Миколая — «идеи крутые и ура есть мир» (id 370613); никаких идей по улучшению расы дальше в переписке не поступает.</p>\n<p><strong>2025-10-20, id 376399–376403.</strong> Раса описана заново внутри большого разбора Оам и мутантов, в одном ряду с апостолами, Аскизами, Азуриэлем, Поротаем и вампирами. Изменения против первой версии два: добавлено происхождение «Произошли от мутировшого дерева из-за Большого количества Оам» и уточнено, что в оранжевой сердцевине «как раз и хранится Оам». Строка про огонь переформулирована: было «Огонь их не перед», стало «Огонь им не вредит». Завершено репликой «Пока что так» (id 376403).</p>\n<p><strong>2025-11-05, id 382108.</strong> Тот же блок про Детей мирового древа повторён дословно в составе перечня мутантов. Нового про расу нет.</p>\n<p><strong>2025-11-17, id 385768–385769.</strong> Добавлено место обитания: «Дети мирового древа. Живут в мести которой мутировала от Оам». Здесь же раса впервые поставлена в иерархию сил — в ряд рас и организаций, равных друг другу, ниже котов и апостолов. Ни описания самой местности, ни её названия нет.</p>\n<p><strong>2025-12-06, id 393286–393290.</strong> Перечень сил и место обитания повторены без изменений. В этом же окне мир называется «Оэм»: «В нашем мире Оэм уже существует много сторон для конфликта» (id 393290), при том что в самой строке про расу написано «мутировала от Оам». Написание Оам/Оэм в переписке разное, различие между ними не объясняется.</p>\n<p><strong>2025-12-06, id 393304–393310.</strong> Раса отнесена к промежуточным злодеям вместе с кланом крылатых, а следом к тому же разряду добавлены церкви, люди и Виктор. Чем именно они злодействуют, против кого и с какой мотивацией — не сказано; далее разговор уходит к двум основным злодеям и к котам.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "GR-0067-S06", "GR-0067--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет. Ни одного представителя расы за всю переписку не названо, имён нет.</li>\n<li>Численность не названа — в отличие от котов («Их 9») и апостолов («Апостолы 21»), для Детей мирового древа число не указано.</li>\n<li>Внутренняя иерархия не описана: ни правителей, ни старших, ни делений внутри расы.</li>\n<li>Место обитания названо только как «место, которое мутировало от Оам» (2025-11-17, id 385768) — без названия, географии и описания.</li>\n<li>Мировое древо как объект мира отдельно не расписано; связь между «мировым древом» и «мутировшим деревом» осталась нерешённой.</li>\n<li>Размножение, продолжительность жизни, численность поколений — в переписке не сказано (в отличие от Аскизов, где вопрос рождения хотя бы поставлен: «Как они рождаются я ещё не придумал»).</li>\n<li>Не сказано, как раса пользуется хранящимся в сердцевине Оам и есть ли у неё способности Оам сверх перечисленных телесных.</li>\n<li>Роль «промежуточных злодеев» не раскрыта: цель, мотивация и противники не названы.</li>\n<li>Просьба «Если есть идея по их улучшения кидай» (2025-10-02, id 370606) осталась без ответа по существу — предложений по расе от Миколая в переписке нет.</li>\n<li>Отклонённых вариантов по этой расе в переписке нет: ни одна её черта не была предложена и забракована, описание от версии к версии только повторяется и дополняется.</li>\n</ul></div>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0067--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0067.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0067-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0067/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>По числам самая дорогая дыра в этом кусте одна — <code>SL-0054</code>, «Список 12 апостолов»: статьи нет, 234 КБ базы, семь ссылающихся статей. Для этой статьи она не посторонняя: апостолы — единственная сторона, чьё отношение к расе проговорено прямо («не кто из апостоловы не сможет нормально их ранить»), и держится это отношение на нераспакованном коме. Заодно там несостыковка с местным перечнем: здесь апостолов 21, а в списке — 12.</p>\n<p>Второе — обратный случай, и чинится дешевле всего. <code>MN-0021</code>, «Мировое древо»: статья есть, 3,1 КБ базы, входящих ссылок ноль, вселенная помечена «неясно». То есть объект, из которого раса выведена и по которому названа, лежит в базе отдельной статьей, не привязанной ни к Оаму, ни сюда. Здешний пробел «мировое древо отдельно не расписано» верен по переписке, но по базе выглядит иначе: расписано, только оторвано. Рядом второй кусок того же — <code>MR-0158</code> («Славянская мифология: небеса, остров Буян, мировое древо»), 5,3 КБ, статьи нет, ссылок ноль.</p>\n<p>Третье: <code>MR-0161</code> — запись-двойник этой статьи, тоже «Дети мирового древа», 32,8 КБ базы и две входящие ссылки, тогда как сюда не ведёт ни одна. Два входа в одно и то же.</p>\n<h3>С чего начать</h3>\n<p>В базе, не в архиве. Порядок такой: <code>MR-0161</code> (32,8 КБ по той же расе), <code>MN-0021</code> (древо), <code>MR-0158</code> (второй кусок про древо). Прежде чем что-то дописывать, надо решить, одна это сущность или три, — сейчас происхождение расы описано дважды и по-разному именно потому, что материал живёт в разных записях.</p>\n<p>По Оаму как веществу — <code>MR-0164</code> (39,5 КБ) и <code>MR-0182</code> (40,1 КБ, 16 входящих ссылок). Механика ёмкости, поглощения и выброса излишков расписана там для людей; вопрос «как раса пользуется Оамом из сердцевины» надо задавать этим записям, а не архиву.</p>\n<p>По нерешённому — <code>SL-0125</code>, «Список нерешённых вопросов по миру Оэм» (3,9 КБ, статьи нет): авторы сами вели такой список, и он до сих пор не развёрнут.</p>\n<p>В архив идти стоит за одним — за местом обитания. Строка «Живут в мести которой мутировала от Оам» появляется 2025-11-17 (id 385768) и больше не разворачивается; смотреть надо окно вокруг неё и окно 2025-10-20 (id 376399–376403), где Оам разбирается подробно и где эта местность могла быть названа.</p>\n<h3>Как развивалось</h3>\n<p>Заявили сразу целиком. 2025-10-02 — полный набор в одном сообщении: облик, сердцевина, смена образа, непробиваемость, регенерация, сверхсила, движение в земле, огнестойкость, бой корнями, и тут же просьба «Если есть идея по их улучшения кидай». Ответ — «идеи крутые и ура есть мир», по существу расы предложений нет.</p>\n<p>2025-10-20 — переописание: добавлено второе происхождение (мутация от Оама) и хранение Оама в сердцевине, строка про огонь переформулирована. 2025-11-05 — блок повторён дословно, нового нет. 2025-11-17 — приписаны место обитания и место в иерархии сил. 2025-12-06 — перечень повторён, раса отнесена к промежуточным злодеям.</p>\n<p>Внутрь расы после 20 октября не возвращались: всё, что добавлялось дальше, добавлялось снаружи — где живут, какое место в ряду, какая роль в конфликте. Ни одна черта за всё время не отменена.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Правило вывода свойства из происхождения проговорено прямо: «Так как они из дерева мирового древа. Хрен ты их пробьешь». Прочность не постулирована, а выведена из материала — и на ней же висят регенерация и физическая сила.</p>\n<p>Второе происхождение — «Произошли от мутировшого дерева из-за Большого количества Оам» — такого вывода не получило. Что раса получает от Оама, не сказано ни одной строкой, хотя Оам у неё хранится внутри, в оранжевой сердцевине, и для людей механика Оама расписана подробно. Один источник объясняет свойства, второй источник того же рода стоит рядом и ничего не объясняет.</p>\n<h3>Отклик</h3>\n<p>Сильное здесь — экономия: «Так как они из дерева мирового древа. Хрен ты их пробьешь». Одна придаточная связка, и дальше половина расы выводится сама — раз древесина, значит и регенерация, и корни, и хождение внутри деревьев. Это не список способностей, это одна идея, развёрнутая до тела. И оранжевая сердцевина хороша именно тем, что уязвимость в ней не названа: место хранения силы описано, а вывод, который напрашивается, не сделан ни разу за три месяца повторений.</p>\n<p>Что цепляет иначе — «Если есть идея по их улучшения кидай» и ответ «идеи крутые и ура есть мир». Просьбу не услышали, и с того дня раса только переписывается набело: 20 октября, 5 ноября, 6 декабря — одни и те же строки, иногда с новым словом про огонь. Целый народ, у которого за всё время не появилось ни одного лица и ни одного имени, но появился ранг в таблице сил.</p></div>", "r": []}];</script>
