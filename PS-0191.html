<script>const BASE="";const DOCNAME="Зависть (грех)";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0191-S01", "PS-0191--proishozhdenie"], "h": "<p>Один из семи грехов вселенной «Апостол». Появляется в окне w0072 в общей раскладке грехов, которую Слава пишет 2025-01-23 (id 284175–284177): сначала объявляется группа целиком — «7 грехов и божество ( помнишь его)» — а следующим сообщением расписываются способности по каждому греху отдельно.</p>\n<p>Место группы в иерархии силы задано одной фразой на всех: «Будет слабей главы этой организации но сильней благословенного» (2025-01-23, id 284175). Зависть, как часть семи грехов, стоит на этом уровне. Кто глава организации — не названо.</p>", "r": []}, {"t": "Способности", "a": ["S02", "PS-0191-S02", "PS-0191--sposobnosti"], "h": "<p>Полное перевоплощение в того, кому завидуешь. Дословно (2025-01-23, id 284176):</p>\n<div class=\"q\"><p>«Зависть:<br>Полной перевоплощение тому кого завидуешь, под полный подразумевается полной копирование сил, магии, одежды, внешность но не характера»</p></div>\n<p>То есть в копирование входит:</p>\n<ul>\n<li>силы;</li>\n<li>магия;</li>\n<li>одежда;</li>\n<li>внешность.</li>\n</ul>\n<p>И прямо оговорено, что <strong>не</strong> копируется: характер.</p>\n<p>В каталоге от 2025-01-24 (id 284278) способность записана короткой пометкой: «Зависть 👹👹( полной копирование)».</p>\n<p>Условие срабатывания названо через саму зависть — перевоплощение идёт «тому кого завидуешь», то есть привязано к объекту зависти, а не к произвольной цели. Насколько сильной должна быть зависть, можно ли завидовать по своему выбору, сколько держится перевоплощение — в переписке не сказано.</p>", "r": []}, {"t": "Связи с другими", "a": ["S03", "PS-0191-S03", "PS-0191--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Семь грехов</strong> — Зависть входит в группу из семи. Соседи по списку и их способности в той же раскладке (2025-01-23, id 284176): Похоть (<a href=\"PS-0188.html\">Похоть</a>) — контроль разума с ограничением; Чревоугодие — «ок» без пояснения, позже помечено как «поглощения»; Алчность — «способности поглощений чужой манный или объектов», позже «всё моей»; Лень — телекинез плюс магия ветра, позже «контроль территории»; Гнев — «ну ок», позже «сила»; Гордыня — «Слово закон с ограничением».</li>\n<li><strong>Божество (<a href=\"PS-0193.html\">Божество</a>)</strong> — существо того же уровня силы, объявлено с грехами одной репликой.</li>\n<li><strong>Благословенные</strong> — слабее семи грехов, значит и слабее Зависти.</li>\n<li>Объект перевоплощения в переписке не назван: конкретного персонажа, которому Зависть завидует, нет.</li>\n</ul>", "r": [["Похоть", "PS-0188.html"], ["Божество", "PS-0193.html"]]}, {"t": "Как менялся — состояния по датам, старое не затирается", "a": ["S04", "PS-0191-S04", "PS-0191--kak-menyalsya"], "h": "<h3>2025-01-23 (id 284175–284177) — введена с полным перевоплощением</h3>\n<p>Первая и подробная формулировка: полное перевоплощение в объект зависти, с копированием сил, магии, одежды и внешности, но не характера.</p>\n<h3>2025-01-24 (id 284278–284279) — в сводном каталоге</h3>\n<p>Зависть попадает в каталог персонажей, где семь грехов вынесены отдельным блоком после «Благословенный:» и «Враг:»:</p>\n<div class=\"q\"><p>Семь грехов:<br>Гнев 😡( сила)<br>Похоть 😵‍💫(контроль разума)<br>Зависть 👹👹( полной копирование)<br>Алчность ♾(всё моей)<br>Гордыня 👑<br>Чероугодия ◼️( поглощения)<br>Лень😴( контроль территории)</p></div>\n<p>Здесь способность сжата до «полной копирование», знак — 👹👹. Оговорка про характер в каталоге не повторена, но и не отменена: версия от 2025-01-23 остаётся в силе, каталог её просто сокращает. Гордыня в этом каталоге идёт вообще без пометки способности, хотя днём раньше у неё было «Слово закон с ограничением».</p>\n<p>Каталог закрывается репликой «Ну да» (Слава, id 284279).</p>\n<p>Семь грехов в каталоге стоят отдельным блоком, не внутри «Врагов» и не внутри «Благословенных». Как эти три блока соотносятся между собой по сюжету, в переписке не сказано.</p>", "r": []}, {"t": "Пробелы — чего в переписке нет", "a": ["S05", "PS-0191-S05", "PS-0191--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Внешность не описана; есть только эмодзи-метка 👹👹 в каталоге.</li>\n<li>Характер не описан. При этом характер отдельно оговорён как то, что способность <strong>не</strong> копирует, — но какой характер у самой Зависти, не сказано.</li>\n<li>Пол персонажа не назван.</li>\n<li>Происхождение, имя, биография отсутствуют.</li>\n<li>Ограничения способности не заданы: длительность перевоплощения, откат, число целей, можно ли копировать несколько объектов, что происходит при смерти объекта — ничего из этого в переписке нет.</li>\n<li>Не сказано, копируются ли вместе с силами их ограничения и слабости.</li>\n<li>Не названо, кому Зависть завидует.</li>\n<li>Что с персонажем стало дальше — в переписке не сказано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0191--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0002.html\">Семь грехов</a></li>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0188.html\">Похоть</a>, <a href=\"PS-0193.html\">Божество</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0188.html\">Похоть</a>, <a href=\"PS-0193.html\">Божество</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0002.html\">Семь грехов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0191--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-01-23</td>\n<td>284175–284177</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-24</td>\n<td>284278–284279</td>\n<td>w0072</td>\n<td>Апостол (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0191-zavist-greh.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0191--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0191.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0191-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0191/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — не пробелы статьи, а второй номер того же персонажа. <code>SP-0161</code> «Зависть (грех)»: статьи нет, ноль ссылок, база 8 056, три версии, окно w0068, 2024-12-24 — 2024-12-25. Это на месяц раньше всего, что статья считает первым появлением, и там та же способность рождается в споре: Миколай предлагает стирание родословной у всех и навязывание статуса плюс магию льда, Слава отвечает полным перевоплощением. Вдвое больше материала, чем в самой статье, и ни одной ссылки на него.</p>\n<p>Рядом тот же разлом по всей семёрке: <code>SP-0156</code> «Семь грехов (магия по грехам)» — 11 757, статьи нет; <code>SP-0157</code> — 7 256; <code>SP-0158</code> — 7 117; <code>SP-0160</code> — 8 291; <code>SP-0162</code> — 7 454. Больше пятидесяти тысяч знаков декабрьского окна, на которые не ссылается никто, при том что персонажные номера грехов держат по четыре тысячи каждый.</p>\n<p>Второе — <code>SL-0051</code> «Каталог: благословенные, враги, грехи, оружие, артефакты»: шесть ссылок, статьи нет, база 9 834. Каталог 284278, из которого статья берёт «Зависть 👹👹( полной копирование)» и всю сводку по семёрке. Самый цитируемый объект набора и без статьи.</p>\n<p>Третье, дешёвое: соседи по семёрке в справочнике есть, а связей на них нет. <code>PS-0177</code> «Гнев (грех)» (две ссылки, статья есть, 11 005), <code>PS-0192</code> «Гордыня» (8 262), <code>SP-0159</code> «Алчность» (11 808) названы в тексте статьи и не стоят в её связях; сцеплены только Похоть и Божество. Половина семёрки читается как несуществующая.</p>\n<h3>С чего начать</h3>\n<p>В базе, в архив не надо.</p>\n<ul>\n<li><code>SP-0161</code> (8 056) — декабрьские версии и спор с Миколаем. Половина пробелов статьи про ограничения способности имеет шанс закрыться именно там: у Миколая в его варианте ограничение названо (объект забывает свои желания), и видно, что сторона ограничений в этом разговоре вообще обсуждалась.</li>\n<li><code>SP-0156</code> (11 757) — постановка задачи и разбор: 273906 (ответ Миколая целиком), 273920 (встречный вариант Славы), 274462–274472 (разбор). Одно место, где вся семёрка обсуждается как система, а не раздаётся списком.</li>\n<li><code>SL-0051</code> (9 834) — каталог 284278 целиком, вместе с авторской оговоркой, что у всех перечисленных продумано только вид, способность и плюс-минус характер. Это и есть ответ на «внешность не описана, характер не описан».</li>\n<li><code>MR-0107</code> «Иерархия силы» (четыре ссылки, статья есть, 5 534) — та же реплика 284175 плюс цена: три благословенных Бога на одного греха.</li>\n<li><code>SL-0053</code> (шесть ссылок, статьи нет, 20 313) — повторы реестра, w0073/w0077/w0079, вплоть до 298846–298857, где предлагают грехи из списка убрать.</li>\n</ul>\n<p>В архив — только если понадобится ответ на «кому Зависть завидует»: смотреть после 2025-01-24 и до 2025-03-06, промежуток между каталогом и разговором о цели злодеев. По базе видно, что за этот промежуток семёрка ни разу не разбирается поимённо, так что вероятность низкая.</p>\n<h3>Как развивалось</h3>\n<p>2025-01-23 — заявили подробно и с пределом в той же фразе: полное копирование сил, магии, одежды, внешности, и отдельно оговорено, что характер не копируется. Ограничили в тот же момент, когда объявили. 2025-01-24 — сжали до трёх слов в каталоге: «полной копирование». Оговорку про характер не повторили и не отменили; в том же каталоге Гордыня осталась вообще без пометки, хотя днём раньше у неё было «Слово закон с ограничением». Обсуждение закрыто репликой «Ну да». Забывания и возврата в охвате статьи нет — есть сжатие, после которого более полная версия живёт только в предыдущем дне.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>У Зависти назван предел вторжения: копируется всё, кроме характера. То есть сказано, что именно остаётся объекту неотчуждаемым.</p>\n<p>У Похоти в той же раскладке, тем же сообщением 284176 — «контроль разума с ограничением». Способность того же рода: вторжение в чужую личность. Что при контроле разума остаётся человеку — не сказано ни словом, и само «с ограничением» не раскрыто. Для одной способности граница проведена по характеру, для соседней граница объявлена существующей и не проведена нигде.</p>\n<h3>Отклик</h3>\n<p>«Полной копирование сил, магии, одежды, внешность но не характера» — тут интересна одежда. Её незачем перечислять: если копируется внешность, одежда как бы прилагается. Значит, человек представлял себе не механику, а картинку — как один встаёт напротив другого и они одинаковые с точностью до пуговиц. И в том же перечислении, после одежды, идёт единственное исключение, и оно не про силу, а про то, кем ты остаёшься. Скопировать можно всё, чем человек владеет, и ничего из того, что он есть. Для строчки из списка, написанной за минуту вместе с шестью такими же, это неожиданно точный выбор границы. Второе, что зацепило, — что на следующий день от всего этого осталось «полной копирование», и никто не заметил потери. Оговорка прожила ровно сутки и не была отменена, её просто не переписали.</p></div>", "r": []}];</script>
