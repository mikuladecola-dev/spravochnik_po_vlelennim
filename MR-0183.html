<script>const BASE="";const DOCNAME="Мир истории «Страх»";
const LEAD="<p>Мир, в котором происходит история «Страх». Собственного названия у мира в переписке нет. Всё, что о нём известно, сказано в окне w0113 за один день (2025-12-09, id 394451–394553).</p>";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0183-S01", "MR-0183--ustroystvo"], "h": "<p>Средневековое фэнтези. Первым сеттинг назвал Миколай: «ок, сеттинг, средние века походу» (394451). Позже Слава уточнил вид мира: «это фэнтези с магией и другими расами» (394531). То есть в мире есть магия и есть нечеловеческие расы; какие именно расы и как устроена магия — не сказано.</p>\n<p>Мир не сочинялся отдельно, а взят готовым. На прямой вопрос Миколая «зачем ты начал эту историю? как ты её придумал… ну мир этот» (394544–394546) Слава ответил: «Клише из клише фэнтези мир» (394547) и «Не придумал просто взял существующий» (394550). Причину такого выбора он назвал неуверенно: «Комедия» (394552), «Наверное» (394553).</p>\n<p>Идёт война, есть осада крепости. Фронт под крепостью — «одна из самых опасных мест», где «пролилось уже литр крови» и который «славился высокой смертностью». Причина высокой смертности названа изнутри текста: туда посылают новобранцев, «зелёных щенков», которые «даже не разу не убивали», при общей нехватке людей.</p>\n<p>Отдельно зафиксировано сословное правило, которое Слава повторял дважды. Первый раз: «Ну его как аристократа могли отправить в безопасное место. Например в столицу или просто в тылу. Как типо резервный солдаты, который балту пинают» (394459). Второй раз, уже как установленную норму мира: «Я же сказал что Аристократов если и посылают на войну то в безопасные места» (394518). Отправка аристократа именно на передовую — нарушение этого правила, и в истории это работает как завязка: Бенжимена Бэнуара отправляют «не куда-то в тыл или в штаб. И даже не на спокойную точку, а на передовую».</p>\n<p>Мир населён неславянскими персонажами: «и перс не русский» (394452). Миколай отдельно оговорил, что не разбирается в подобных сеттингах: «не обсираю но мне нужна такая заметка», «не разбираюсь в этих местах, поэтому хз ваще» (394453–394454).</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0183-S02", "MR-0183--naselenie"], "h": "<p>Названо сословное деление: дворяне (графы, их первенцы и наследники) и армия — офицеры с боевым опытом и новобранцы. Из аристократии в переписке фигурируют Бенжимен Бэнуар, «первенец и ближайшее на замену отцу дворянина», его отец-граф, новая супруга графа (мачеха) и их дети.</p>\n<p>Из военных описан безымянный командир, вышедший из палатки: «грозный мужчина. Его лицо было покрыта шрамами, а глаза были твердыми и холодными. Было видно, что этот мужчина пережил много сражений». Он же держит внутреннее недовольство тем, что новобранцев «сюда посылали на убой», и знает, что его жалобы никто не слушает. Формулировку «твёрдые глаза» Миколай выделил отдельно (394524).</p>\n<p>Новобранцы под крепостью: «Многие из них дрожали, а некоторые плакали».</p>\n<p>Магия и другие расы объявлены, но ни один носитель магии и ни один представитель нечеловеческой расы в переписке не показан. Про главного героя специально сказано обратное: «Гг не будет владеть магией. Чисто хладнокровием и мечом будет шататься» (394531).</p>\n<p>Вопрос о том, есть ли у Бенжимена братья, Миколай задал («а братья есть интересно покачто3», 394458), но в дальнейшем в переписке ответа нет — при этом в самом тексте истории упомянуты дети графа от новой жены.</p>", "r": []}, {"t": "Место во вселенной — как связан с другими мирами", "a": ["S03", "MR-0183-S03", "MR-0183--mesto-vo-vselennoy"], "h": "<p>Мир отнесён к вселенной Феня по дате объявления. Связей с другими мирами вселенной в переписке нет: ни Оам, ни Феня как мир, ни семь островов здесь не упоминаются, и мир истории «Страх» ни с чем из них не соотнесён.</p>\n<p>Внутри вселенной он привязан к истории «Страх» (мир указан как её часть) и к персонажу Бенжимен Бэнуар.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0183-S04", "MR-0183--kak-menyalsya-po-versiyam"], "h": "<p><strong>2025-12-09, версия 1 (id 394451–394459).</strong> Сеттинг определён как средние века. Персонаж — не русский. Названа крепость. Введено правило про аристократов в тылу и в резерве: «резервный солдаты, который балту пинают». Магия и другие расы ещё не названы.</p>\n<p><strong>2025-12-09, версия 2 (id 394518–394553).</strong> Правило про аристократов повторено как уже сказанное. Мир объявлен фэнтезийным — с магией и другими расами, при этом главный герой магией не владеет. Слава добавил, что хочет развить в истории «недопонимания», и по итогу разговора с Миколаем решил дописать сцену: «нужно добавить сценку где будет говориться как он туда так легко попал» (394531). В том же окне выложен текст самой истории, из которого берутся детали фронта, осады и командира. Происхождение мира зафиксировано как заимствование готового клише.</p>\n<p>Реакция Миколая на выложенный текст в этих же сообщениях: сначала «хуйня полнейшая переделывай» (394538), сразу следом «да ладно, щас посмотрю ещё» (394539). Отдельно он отметил детали: «ты круто прописываешь детали» (394530).</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0183-S05", "MR-0183--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Название мира не даётся (w0113).</li>\n<li>Какие именно «другие расы» существуют — не названо.</li>\n<li>Как устроена магия, кто ею владеет, какие есть ограничения — не сказано.</li>\n<li>Страна, королевство, кто с кем воюет и из-за чего — не названо. Названы только «столица», «тыл», «фронт» и «крепость».</li>\n<li>Что за крепость осаждают и кто её обороняет — не сказано.</li>\n<li>Вопрос Миколая про братьев Бенжимена (394458) остался без ответа в переписке.</li>\n<li>Причина, по которой Слава взял именно этот мир, названа предположительно: «Комедия», «Наверное».</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0183--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0011.html\">Феня</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0183--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-12-09</td>\n<td>394451–394459</td>\n<td>w0113</td>\n<td>Феня (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-09</td>\n<td>394518–394553</td>\n<td>w0113</td>\n<td>Феня (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0183-mir-istorii-strah.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0183--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0183.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
