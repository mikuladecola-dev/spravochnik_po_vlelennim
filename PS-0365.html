<script>const BASE="";const DOCNAME="Апик";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0365-S01", "PS-0365--proishozhdenie"], "h": "<p>Персонаж введён Славой 29 апреля 2026 года (окно w0120, id 468992–469048). Материал относится к вселенной, объявленной 2026-04-25 (id 466476) — своего имени в переписке эта вселенная не получила («вселенная объявлена тогда-то, имени в переписке ей не дали»); сам файл персонажа помечает его вселенную как «неясно».</p>\n<p>Слава подаёт персонажа как «вкид»: «Апик... Персонажей основа... Лучше персонажей... Который теперь будет в каждой вселенной... Персонажей превзошедший имитатора... Персонажей на вершине... Он самый ключевой персонаж... Персонаже иного порядка... Персонажей что есть везде... Он один и самый ключевой, основа и крепкая опора моя». Имя себе персонаж придумал сам.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0365-S02", "PS-0365--vneshnost"], "h": "<p>«Странный парень в свитере и с большими не мограющими глазами, с безэмоциональным лицом. Но он вежлив, он может улыбаться. Он может предложить конфеты из возникшей бумажном пакете.»</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0365-S03", "PS-0365--harakter"], "h": "<p>Вежлив, может улыбаться. Ни на что не отвечает: по словам Славы, появляясь перед главными персонажами и даже разговаривая с ними, он «потом сразу исчезнет ни на что не ответив».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0365-S04", "PS-0365--sposobnosti"], "h": "<p>Непобедим: «Он не победим. Даже боги его не победят». Причина непобедимости не в силе, а в отказе от боя: «Он не победит потому что он никогда не дерётся. Он просто исчезнет». Итоговая формулировка Славы: «Он не победит, но и не поиграет [проиграет]. Он просто существует.»</p>\n<p>Ключевая особенность — отсутствие влияния на сюжет: «Это персонаж просто есть и все. Всё его действия ни на что не влияют. Абсолютное любой действий не влияет на сюжета. При этом этого персонажа нету. Он не входит в сюжет. Он будет появляться там далеко в толпе или на фоне. Иногда крайне редко он будет появляться перед главными персонажами и даже разговаривать с ними. Но потом сразу исчезнет ни на что не ответив.»</p>\n<p>Превзошёл Имитатора («Персонажей превзошедший имитатора»), но механика этого превосхождения в переписке не раскрыта.</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0365-S05", "PS-0365--svyazi-s-drugimi"], "h": "<p>Связан с Имитатором — персонажем, которого Апик превзошёл. Подробности связи (что за Имитатор, как именно произошло превосхождение) в переписке не даны.</p>", "r": []}, {"t": "Как менялся", "a": ["S06", "PS-0365-S06", "PS-0365--kak-menyalsya"], "h": "<p>Единственная версия — 2026-04-29 (id 468992–469048, окно w0120). Других состояний персонажа в переписке нет.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0365-S07", "PS-0365--chto-s-nim-stalo"], "h": "<p>На прямой вопрос Миколая «а нах он нужен? имитатора только сносить?» Слава подтверждает отсутствие функции: «Вот именно. Он ни на что не влияет... Он просто есть... Он просто существует.» Миколай завершает диалог репликой «хорошо, у меня ещё вопросы, но позже задам» — эти вопросы в переписке заданы не были.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0365-S08", "PS-0365--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Своего имени вселенная, к которой отнесён этот материал, не получила: объявлена 2026-04-25, id 466476; в файле персонажа вселенная помечена «неясно».</li>\n<li>Не решено окончательно, один ли это персонаж: Миколай спрашивал «один персонаж? или несколько или тв про имитатора» — Слава ответила «Он один и самый ключевой, основа и крепкая опора моя», но развёрнутого пояснения не последовало.</li>\n<li>Вопросы Миколая, отложенные фразой «но позже задам», остались без ответа в прочитанном фрагменте переписки.</li>\n<li>Природа связи с Имитатором и обстоятельства «превзошедший» не раскрыты.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["PS-0365--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-04-29</td>\n<td>468992–469048</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0365-apik.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0365--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0365.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
