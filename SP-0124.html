<script>const BASE="";const DOCNAME="Глазки";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0124-S01", "SP-0124--mehanika"], "h": "<p>Глазки — одна из комбинаций в системе трёх элементов. Слава формулирует основу системы так: «Есть три элемента / Сосуд тело структура» (2024-11-30, id 263677). Дальше он же расписывает, что даёт сложение элементов: «Структура+тела=глазки / Сосуд+тело=изменяющую сосуд» (2024-11-30, id 263680).</p>\n<p>Таким образом глазки закреплены как результат комбинации структура + тело.</p>\n<p>Сама механика глаз — что они делают, как выглядят, что дают носителю — в переписке не раскрыта. Зафиксировано только их место в системе комбинаций.</p>\n<p>Другое название, которым пользуется Миколай, — «наследственные структуры по типу глаз» (2024-11-30, id 263678). Слово «наследственные» относится к тому, что они передаются, но механика наследования не описана.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S02", "SP-0124-S02", "SP-0124--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-11-30 (id 263590–263592).</strong> Первое упоминание. Миколай уточняет, о чём именно Слава просил идею: «ты про глазки идею просил или про 2 новые?» (id 263592). Из этого следует, что просьба продумать глазки прозвучала раньше, но сама разработка на этот момент ещё не сделана. В том же куске Миколай спрашивает про растения: «ты про растения чет придумал или отложил» (id 263591) — отдельная тема, идущая рядом.</p>\n<p><strong>Версия 2 — 2024-11-30 (id 263677–263680).</strong> В тот же вечер, через восемнадцать минут, глазки получают место в системе. Слава называет три элемента — сосуд, тело, структура. Миколай добавляет к перечню «и некоторые наследственые структуры по типу глаз» (id 263678), то есть сначала предлагает их как отдельную, четвёртую позицию рядом с тремя элементами. Тут же сам от этого отказывается: «но это можно в структуру кинуть лан» (id 263679). Слава закрывает вопрос формулой «Структура+тела=глазки».</p>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S03", "SP-0124-S03", "SP-0124--otklonennye-varianty"], "h": "<p>Миколай предложил считать глазки самостоятельной позицией в перечне — «некоторые наследственые структуры по типу глаз» рядом с сосудом, телом и структурой — и сам же снял предложение в следующем сообщении: «но это можно в структуру кинуть лан» (2024-11-30, id 263678–263679). В итоге глазки не отдельный элемент, а комбинация уже имеющихся.</p>\n<p>Отдельная разработка глазок была отложена: на момент id 263592 Миколай ещё только уточняет, про них ли просили идею, и до подробного описания дело в этом окне не дошло.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S04", "SP-0124-S04", "SP-0124--svyaz-s-drugimi-sposobnostyami"], "h": "<p>Глазки — часть системы трёх элементов (сосуд, тело, структура), которая, в свою очередь, относится к теме Семьи.</p>\n<p>Рядом с глазками в том же сообщении названа вторая комбинация: «Сосуд+тело=изменяющую сосуд» (2024-11-30, id 263680). Что она собой представляет, здесь не описано.</p>\n<p>Комбинация «структура + сосуд» в переписке не названа.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "SP-0124-S05", "SP-0124--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Что глазки делают — не сказано. Раскрыто только их место в системе комбинаций.</li>\n<li>Как выглядят и где расположены — не сказано.</li>\n<li>У кого они есть, кто носитель — не названо.</li>\n<li>Каким образом «наследственные» — механика передачи не описана.</li>\n<li>Что означает элемент «структура» и элемент «тело» по отдельности — в этом окне не разобрано.</li>\n<li>Ограничений и платы за способность не названо.</li>\n<li>Просьба Славы придумать глазки прозвучала до 2024-11-30, но самой просьбы в материале нет — она восстанавливается только по уточняющему вопросу Миколая.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0124--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0040.html\">Семья</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0124--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-11-30</td>\n<td>263590–263592</td>\n<td>w0065</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-11-30</td>\n<td>263677–263680</td>\n<td>w0065</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0124-glazki.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0124--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0124.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
