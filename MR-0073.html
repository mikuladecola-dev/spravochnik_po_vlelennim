<script>const BASE="";const DOCNAME="Кристаллизация энергии";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0073-S01", "MR-0073--ustroystvo"], "h": "<p>Закон мира, изложенный Миколаем одним куском 30 ноября 2024 года (2024-11-30, id 263717–263728). Формулируется как продолжение и уточнение уже существовавшего у соавторов концепта сосуда и структуры (<a href=\"MR-0070.html\">Энергия, сосуд и структура</a>): «как я раньше обозвал твою структуру - кристаллы».</p>\n<p>Основа: «энергия в сосуде жидкая с рождения и всегда, но конкретно до 7 лет кристаллизуется часть энергии, на этом кристалле написаны данные отраженные в опыте и определяющие способность». То есть жидкое состояние энергии — это постоянное, базовое состояние, оно никуда не девается; кристаллизуется только часть, и только в первые семь лет жизни.</p>\n<p>Записывает данные на кристалл не кто-то извне. Миколай отдельно фиксирует это уже после основной выкладки, отмечая, что упустил это раньше: «я тогда забыл то что не просто кто-то пишет способность а это результат опыта» (id 263728).</p>\n<p>Процесс кристаллизации в принципе обратим: «для выращивания настоящих кристаллов есть свой алгоритм, но это процесс обратимый». Но обратимость не означает доступности. Сложность зависит от того, какой это кристалл: «в разных кристаллах сложность разная, например процессоры это монокристаллы и информацией и их не целесообразно и не практично плавить и кристализировать заново, после записывая информацию, проще чистое вещество взять». Отсюда следует общее правило мира: «поэтому никто из людей не может менять свою структуру, это невероятно сложно».</p>\n<p>Второй обязательный элемент механики — затравка. Без неё кристалл не формируется вообще: «даже если другие расплавят этот кристал они не создадут его заново не за что ибо для формирования нужна так называемая затравка. при рождении она появляется и благодаря ней появляется возможность кристаллизовать энергию через опыт». Затравка, таким образом, даётся при рождении и однократно — именно она делает возможной кристаллизацию опыта в способность.</p>\n<p>Отдельно оговорено, каким бывает детский опыт (2024-11-30, id 263734): «детский опыт довольно мистический, но не всегда сильный». Из этого следует, что способность, полученная от рождения, не обязательно сильная, и что способности, созданные позже, «намного сложнее тех что появляются с рождения».</p>", "r": [["Энергия, сосуд и структура", "MR-0070.html"]]}, {"t": "Население", "a": ["S02", "MR-0073-S02", "MR-0073--naselenie"], "h": "<p>Общее правило касается всех людей: обычные люди свою структуру менять не могут. Миколай проговаривает это дважды и в обоих случаях как приговор, а не как ограничение силы: «обычные не могут менять способность и обречены жить с тем что есть».</p>\n<p>Исключение — одна семья (в переписке названа как «эта семья», «моя семья», собственного имени в этом фрагменте у неё нет). Её устройство:</p>\n<ul>\n<li>У семьи есть наследственная структура — «у них есть структура наследственная, с механизмом упрощающим этот процесс, которых для других невозможен изв сложности».</li>\n<li>Механизм смены агрегатного состояния: «они в течении 2 дней могут давить в определённую точку для изменения агрегатного состояния структуры способности». Двое суток давления на определённую точку — и структура плавится.</li>\n<li>Последствие расплавления: «расплавив они лишаются структуры способности и по сути становятся как новорождённые».</li>\n<li>Наследственная структура умеет то, чего не умеет никто: «наследственная структура имеет возможность создать искусственно затравку». Это и есть то, что отличает семью от всех остальных — не сама возможность расплавить кристалл, а возможность заново получить затравку.</li>\n<li>Цена: «я, не просто так сказал что они как новорождённые. для кристаллизации новой структуры им нужно то же время что и с момента рождения и она также будет неразвита». То есть новая структура требует тех же лет и рождается такой же неразвитой.</li>\n<li>Разброс внутри семьи: «у разных членов семьи разное допущение с разными параметрами поиграть может будет». Какие именно параметры и у кого — в переписке не сказано, формулировка оставлена как заготовка на будущее.</li>\n</ul>\n<p>Второй путь, оговорённый в тот же вечер (id 263734): «в осознанном возрасте они могут пройти традиционное семейное обучение 2 года, а после развиваться так как пожелают, что позволит создать способности намного сложнее тех что появляются с рождения». Традиционное семейное обучение — два года; после него развитие свободное.</p>\n<p>Отдельно зафиксирована установка автора на баланс. Сначала о семье сказано «они невъебено могучая» (id 263733), а через пять минут это оговаривается: «и ваще не хочу я делать их имбалансными. это обычные люди со способностями, не обязательно семейники самые сильные, это нечестно». Преимущество семьи — не в силе, а в свободе: «моя семья способна изменить на более привлекательную и крутую в основном возрасте».</p>", "r": []}, {"t": "Место во вселенной — как связан с другими мирами", "a": ["S03", "MR-0073-S03", "MR-0073--mesto-vo-vselennoy"], "h": "<p>Прямое продолжение системы «Энергия, сосуд и структура» (<a href=\"MR-0070.html\">Энергия, сосуд и структура</a>): та описывает сосуд, энергию и то, что энергия становится структурной примерно в 7 лет, эта — что физически происходит с энергией в этот момент и почему результат необратим для обычного человека. Семилетний рубеж в обеих выкладках один и тот же.</p>\n<p>В файле как связанные названы: Затравка, Наследственный механизм смены структуры, Семья, Три элемента: сосуд, тело, структура.</p>", "r": [["Энергия, сосуд и структура", "MR-0070.html"]]}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0073-S04", "MR-0073--kak-menyalsya-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-11-30 (id 263717–263728), окно w0065.</strong> Полная выкладка механики одним сообщением после предупреждения «одну деталь ток щас вспомнил», «я думал типа всё умный, но вспомнил кое че». Сюда входит: жидкая энергия, кристаллизация до 7 лет, запись опыта на кристалле, аналогия с процессорами-монокристаллами, обратимость процесса, наследственная структура семьи, двухдневное давление в точку, затравка, срок отращивания новой структуры. Отдельным сообщением — оговорка про происхождение способности из опыта, а не из чьей-то записи.</p>\n<p><strong>Версия 2 — 2024-11-30 (id 263733–263735), окно w0065.</strong> Через несколько минут после первой. Добавлено: качество детского опыта («мистический, но не всегда сильный»), традиционное семейное обучение на два года в осознанном возрасте, тезис о том, что поздние способности сложнее врождённых, и оговорка про баланс — семья не должна быть имбалансной. Завершается вопросом Миколая «че думаешь?» (id 263735).</p>\n<p>Обе версии выложены в один вечер, за полчаса. Первая версия второй не отменяется — вторая только дополняет.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0073-S05", "MR-0073--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вселенная в этом окне не объявлена; отнесение к «монстрам» сделано по дате.</li>\n<li>Имя семьи не названо. В переписке она проходит как «эта семья» и «моя семья».</li>\n<li>«Разное допущение с разными параметрами» у разных членов семьи только заявлено — какие параметры и у кого, не сказано; сама формулировка оставлена как возможность («поиграть может будет»).</li>\n<li>Что представляет собой «определённая точка», в которую давят два дня, — не описано: ни где она, ни на теле это или на структуре.</li>\n<li>Алгоритм выращивания настоящих кристаллов упомянут («для выращивания настоящих кристаллов есть свой алгоритм»), но не изложен.</li>\n<li>Как именно наследственная структура создаёт искусственную затравку — не сказано, только что она это может.</li>\n<li>Ответа Славы на вопрос «че думаешь?» в этом фрагменте нет; обсуждение обрывается на нём.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0073--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0070.html\">Энергия, сосуд и структура</a></li>\n<li><strong>Упомянут в мирах:</strong> <a href=\"MR-0070.html\">Энергия, сосуд и структура</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0040.html\">Семья</a>, <a href=\"GR-0042.html\">Сверхлюди (люди с сосудом)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0073--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-11-30</td>\n<td>263717–263728</td>\n<td>w0065</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-11-30</td>\n<td>263733–263735</td>\n<td>w0065</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0073-kristallizaciya-energii.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0073--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0073.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
