<script>const BASE="";const DOCNAME="многоликий";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0052-S01", "PS-0052--proishozhdenie"], "h": "<p>Персонаж заявлен Славой 2024-04-06 (окно w0030, сообщение 154386) внутри разговора, шедшего о другом: «Кстати раз уж начали / Новый перс многоликий ( способности перевоплощаться в 10 разных существ) то бишь Бен 10».</p>\n<p>Образец назван прямо — «Бен 10», — но с оговоркой, что формы должны быть собственные: «Ну я хочу личных 10 пришельцев вот только в голову вообще ничего не прилетает точней прилетает но этой чисто пришельцы беная а я хочу личных / Не подкинишь идей ?» (154386). Миколай отвечает «О, это я могу» (154387), и вокруг этого запроса строится вся вторая половина окна: Миколай подкидывает пришельцев одного за другим, Слава принимает или отклоняет.</p>\n<p>Собственного имени у персонажа нет — только обозначение «многоликий». Вариант имени, зафиксированный в базе: «Новый перс многоликий».</p>", "r": []}, {"t": "Характер", "a": ["S02", "PS-0052-S02", "PS-0052--harakter"], "h": "<p>Характер задан Славой отдельно, по прямой просьбе Миколая: «Тогда, ммм подскажи че да как к челику там должно быть» (154420), «Ну то есть чтобы я понимал что лучше добавить к персу, чтобы гармонично было» (154421).</p>\n<p>Ответ: «Кратко типо Бен 10 только более взрослый характер ( но также игривый, издевательский, недотёпа в некоторых местах, с юмором )» (154422).</p>\n<p>Тут же обозначена граница допустимого для него: «Но что бы паразитировать на ком то для него слишком жёстко» (154423). Эта граница работает как фильтр форм — именно из-за неё не подошёл Витрофунгус (см. ниже).</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0052-S03", "PS-0052--sposobnosti"], "h": "<p>Единственная способность — «перевоплощаться в 10 разных существ» (154386). Число форм задано сразу и в окне не менялось.</p>\n<p>Устройство самого перевоплощения — как оно включается, сколько длится, что происходит с сознанием и телом носителя в форме — в переписке не обсуждалось.</p>\n<p>К набору форм в ходе окна сформулированы правила:</p>\n<ul>\n<li>Больше половины форм должны быть гуманоидными: «Ну я хочу что бы большей половины были гуманноидыми» (154390). При этом первую негуманоидную форму (змей из цепи) Слава принимает: «Норм что змея» (154390).</li>\n<li>Не повторяться: «Ну по сути я не хотел повторяться / Там же у нас уже есть качок» (154434). Отсюда запрос на недостающие роли: «Может сейчас кого с дальний атакой» (154435), «Ну или элемент то бишь огонь молния» (154436).</li>\n<li>Форма не должна требовать паразитирования на ком-то (154423).</li>\n</ul>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0052-S04", "PS-0052--svyazi-s-drugimi"], "h": "<p>В служебном поле записи перечислены связанные сущности: Бабуинохвост, Витрофунгус, Керагуар, Лихтспид, Сордекваксус, Тардибовин, Торфолихт, змей из цепи, перевоплощение в 10 разных существ. В приведённых кусках переписки сами эти названия не звучат — существа там описываются без имён, кроме змея из цепи.</p>\n<p><strong>Змей из цепи</strong> — первый предложенный пришелец: «Пришелец это змей из цепи, созданной по принципу ленты Мёбиуса. И перемещается она так: с зайди укорачивается, впереди генерируется или тупо того, может один конец приостановить, то есть остановиться больше или меньше» (154389). Миколай сразу спрашивает, годится ли негуманоид: «Те норм что змея или хочешь кого-то антропоморфного?» — Слава принимает. Уточняющий вопрос Славы: «А способность я не до конца понял то бишь увеличивается ?» (154391), ответ Миколая: «Да, увеличивается» (154392). Про саму идею Миколай оговаривается, что она пришла первой и заняла место: «Вот первая идея пришла и засела, так что пока не напишу, не придут новые, а так потом на всякий жеский штурм проведу» (154389).</p>\n<p><strong>Существо со стеклянными костями и грибами</strong> (по служебному полю записи — Витрофунгус) описано Миколаем так: «Тут просто прикол в том, что кости из стекла, а значит типо резня жёсткая, и может оставлять грибы и они лишают важных для жизни штук, но в тоже время стекло хрупкое, как-то так» (154424), «Сами грибы живущие в симбиозе на костях паразитируют при попадании на жертву» (154425). Слава отклоняет его именно как форму, не как существо: «Ну как отдельный персонаж крутой / А как часть способности человека , как та не подходит» (154418). Миколай соглашается: «Ну так-то, да» (154419).</p>\n<p><strong>Существо-бык/козёл</strong> (по служебному полю — Тардибовин; в переписке Слава называет его «Пузырь»): «Вообще прикол быка не в силе, а выносливости, он может выдержать экстремальные условия, большой холод или наоборот мощное пламя, или даже атомный взрыв» (154668). Происхождение свойств: «Такие способности ему достались от скрещивания с тихоходкой» (154673). Слава уточняет, о ком речь: «Это кто» / «Пузырь» (154669–154670), Миколай подтверждает: «Он» (154671). Далее Слава предлагает расширить: «Аааа ну туда можно ещё и силу кинуть с ловкостью» (154674). Миколай принимает половину: «Ну думаю он не про ловкость» (154675), «Он как танк будет скорее» (154676), «Маленький но танк» (154677), «А вот силу да, силу можно» (154678).</p>\n<p><strong>Быстрый с узорами молний</strong> и <strong>лягуха с крыльями</strong> названы только при подсчёте одобренных (154664–154665); их описаний в приведённых кусках нет.</p>\n<p><strong>Качок</strong> — форма, которая на момент 154434 уже есть в наборе; кто это, в приведённых кусках не сказано.</p>", "r": []}, {"t": "Как менялся", "a": ["S05", "PS-0052-S05", "PS-0052--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2024-04-06, сообщения 154384–154392.</strong>\nЗаявка персонажа: 10 личных пришельцев вместо беновских. Требование, чтобы больше половины были гуманоидами. Первая форма — змей из цепи по принципу ленты Мёбиуса.</p>\n<p><strong>Версия 2 — 2024-04-06, сообщения 154418–154427.</strong>\nУточнён характер носителя: как Бен 10, но взрослее — игривый, издевательский, недотёпа местами, с юмором. Введён предел жёсткости: паразитирование на ком-то для него слишком жёстко. По этому пределу отсеивается существо со стеклянными костями и грибами. Кусок обрывается на реакции Миколая: «Ааааааааа» / «Я понял» (154426–154427) — что именно он понял, в приведённом фрагменте не сказано.</p>\n<p><strong>Версия 3 — 2024-04-06, сообщения 154434–154436.</strong>\nСформулировано правило набора: не повторяться, качок уже есть; нужен кто-то с дальней атакой или с элементом — огонь, молния.</p>\n<p><strong>Версия 4 — 2024-04-07, сообщения 154664–154678.</strong>\nПодсчёт результатов. По сводке записи: из 8 предложенных пришельцев одобрено 3. В самой переписке перечислены эти трое: «Три это быстрый с узорами молний, бык или козел; а третий кто» (154664), «Ну я подумал что лягуху с крыльями ты тож одобрил» (154665). Миколай отмечает, что ему понравились все: «А мне лично все понравились» (154666). Причина отказа остальным — не качество, а формат: «Ну мне тоже ну там чисто как отдельный виды расы а не часть челика» (154667). То есть отклонённые существа не выброшены, а переведены в разряд самостоятельных видов/рас.</p>", "r": []}, {"t": "Отклонённые варианты", "a": ["S06", "PS-0052-S06", "PS-0052--otklonennye-varianty"], "h": "<ul>\n<li>Существо со стеклянными костями и симбиотическими грибами — отклонено как форма многоликого, сохранено как отдельный персонаж (154418).</li>\n<li>Пять из восьми предложенных пришельцев — отклонены как формы, но приняты как «отдельный виды расы а не часть челика» (154667). Какие именно это существа, в приведённых кусках не перечислено.</li>\n<li>Ловкость как свойство быка/козла — отклонена Миколаем, сила принята (154675–154678).</li>\n</ul>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0052-S07", "PS-0052--chto-s-nim-stalo"], "h": "<p>Набор форм остался неполным: из десяти заявленных одобрено три. Даты записи — 2024-04-06 — 2024-04-07, окно одно (w0030). Дальше персонаж в этих материалах не появляется.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0052-S08", "PS-0052--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вселенная в переписке не названа; принадлежность к «игре бога» проставлена по дате объявления.</li>\n<li>Имени у персонажа нет, только обозначение «многоликий».</li>\n<li>Не сказано, связан ли он с более ранней серией персонажей и турниром из w0029.</li>\n<li>Набор форм не добран: одобрено 3 из 10.</li>\n<li>Требование «большей половины гуманоидов» с итоговым набором не сверялось.</li>\n<li>Механика самого перевоплощения не описана.</li>\n<li>Внешность и происхождение носителя не обсуждались.</li>\n<li>Имена пришельцев из служебного поля записи (Бабуинохвост, Керагуар, Лихтспид, Сордекваксус, Торфолихт и прочие) в приведённых кусках переписки не встречаются, и какое имя какому существу соответствует — из них не следует.</li>\n<li>Что именно Миколай «понял» в 154427, не сказано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0052--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0014.html\">игра бога</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0052--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-04-06</td>\n<td>154384–154392</td>\n<td>w0030</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-04-06</td>\n<td>154418–154427</td>\n<td>w0030</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-04-06</td>\n<td>154434–154436</td>\n<td>w0030</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-04-07</td>\n<td>154664–154678</td>\n<td>w0030</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0052-mnogolikiy.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0052--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0052.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
