<script>const BASE="";const DOCNAME="Пролог про апокалипсис";
const LEAD="";
const CH=[{"t": "Содержание", "a": ["S01", "IS-0053-S01", "IS-0053--soderzhanie"], "h": "<p>Пролог — монолог выжившего Алексея, обращённый к слушателям уже после катастрофы, и его же рассказ о самом дне удара (2025-05-04, id 323659–323660).</p>\n<p>Начинается с прямого обращения и вопроса: «Скажите вы мне честно. Не надо врать или лицемерить. Это лишь вопрос. Вы ценили то время в котором жили мы?» Ответ рассказчик даёт сам: «Хотя ответ я и так прекрасно знаю. Нет».</p>\n<p>Дальше — описание того времени, которое не ценили:</p>\n<ul>\n<li>время, «где могли учиться, развиваться и мечтать»;</li>\n<li>время, «где хаус и неразбериху. Упорядочил порядок и закон»;</li>\n<li>«Где ясно было где плохой, а где хороший»;</li>\n<li>«Где ты мог стать хоть кем угодно».</li>\n</ul>\n<p>Возражение «мы не могли стать кем хотели» рассказчик отводит: «Ведь это бред. Мы могли стать кем угодно, если бы возжелали этого. Да даже президентом стать могли. А также мы могли мечтать и надеяться на лучшей».</p>\n<p>Формулировка про порядок: «Мы жили в том порядке, который наши предки собрали за миллионы лет истории. Но ничто не вечно. И весь порядок собранный так долго, тщательно, был разрушен в один миг».</p>\n<p>Заявка на способ рассказа: «Хотите знать, что же было и что прошло? Я отвечу честно. Не буду врать или искажать историю. Ведь ты, вы обязаны знать. Но не ждите чудо, пафоса и интриги. Я обычный человек. Держите это в голове».</p>\n<p>Представление: «Я Алексей выживший. В том мире, в котором жиле мы до инцидента я был просто офисный сотрудник».</p>\n<p>Дальше — день удара, по порядку:</p>\n<ul>\n<li>Он просыпается от будильника — «От такого самого Би Би Би. Ха такой бесячий звон, который наверное всё ненавидят. Но я скучаю».</li>\n<li>Просыпается раздражённым, выходной. Будильник заведён по одной причине — день рождения племянницы.</li>\n<li>О себе: детей и «хотя бы подружки» нет, «Не сложилась как-то». Сестра в 20 вышла замуж и родила племянницу; к племяннице он относится хорошо — и потому выключает будильник и ложится спать дальше.</li>\n<li>Звонит племянница. Разговор: «дядя! Вы проснулись? Мама сказала позвонить, иначе вы не проснетесь». Он спросонья спрашивает «кто это?», в ответ получает крик «ДяДЯ!! Вы же шутите!», от которого чуть не подпрыгивает с кровати и окончательно просыпается — «наступило осознания, который ударил как булавой по затылку».</li>\n<li>Он врёт, что пошутил, смотрит на время — 8:23, обещает быть «ближе к 12»; племянница обиженно поправляет — «в 11», он соглашается постараться.</li>\n<li>Племянница просит помочь маме в готовке, добавляя «Если что это не она попросила спросить»; про себя он отмечает: «Да-да не она попросила».</li>\n<li>Она продолжает монолог — приедут подруги Катя и Лера, у них красивые куклы и домик для кукол, «а ещё щеночек, такой пушистый и милый».</li>\n<li>Чтобы прервать монолог, он врёт, что садится за руль. Дальше — молчаливое противостояние, кто первым бросит трубку: оба редко кладут первыми, ждут минуты две, выигрывает он — трубку забрала и отключила сестра, «Привыкла она к нашим противостоянием».</li>\n<li>Он одевается, вбивает в телефон запрос «детский магазин», ставит чайник, ест хлеб с майонезом и колбасой, садится в машину, пару минут «тупит» над маршрутом, строит карту в голове и едет в магазин детских товаров.</li>\n<li>По дороге замечает, что людей на улице очень мало, и объясняет это себе субботним утром.</li>\n<li>Мысль, от которой не удаётся избавиться: «что-то не так». «Мой разум, что-то понял. Заметил мелкую размытую причину этой мысли. Но осознать еë не мог».</li>\n<li>Светофор горит жёлтым, людей нет, но он решает «что не зачем нарушать закон», останавливается, отпускает руль, ложится на сиденье и закрывает глаза.</li>\n<li>Услышав звук светофора, смотрит вверх и видит в небе «Линий в воздухе, как от самолёта. Вот только их было сотни если не тысячи. Словно всё страны мира решили разом запустить всё имеющий боеголовки». Он удивляется, что не заметил их раньше.</li>\n<li>Удар: «Не было сигнала или голоса, который говорил бы о запуске ракеты на нас. Не было паники, истерики. Была просто тишина. Пока не прогремел ударь». Дальше — сотрясение земли, гудящие здания, волна, от которой трещат окна и зеркала, обрушение зданий.</li>\n<li>Финал пролога: здание падает на его машину, он ещё в сознании, «А после тьма и тишина. Словно умер я и лежу в могиле».</li>\n</ul>", "r": []}, {"t": "Персонажи", "a": ["S02", "IS-0053-S02", "IS-0053--personazhi"], "h": "<ul>\n<li><strong>Алексей</strong> — рассказчик и выживший; до инцидента «просто офисный сотрудник»; ни детей, ни девушки; ведёт рассказ от первого лица и настаивает, что он обычный человек.</li>\n<li><strong>Племянница</strong> — дочь сестры, в этот день у неё день рождения; звонит Алексею и говорит почти без пауз, «Словно пулемёт, а не ребёнок»; имя в тексте не названо.</li>\n<li><strong>Сестра</strong> — вышла замуж в 20, мать племянницы; в сцене забирает у дочери телефон и кладёт трубку.</li>\n<li><strong>Катя и Лера</strong> — подруги племянницы, которые должны приехать на день рождения; в сцене не появляются.</li>\n</ul>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "IS-0053-S03", "IS-0053--mesto-vo-vselennoy"], "h": "<p>Пролог — один из трёх, начатых Славой одновременно (2025-05-04, id 323648–323651). В списке Славы (id 323651) он идёт первым, с пометкой «апокалипсис (всё же решил попробовать ещё раз)» — то есть это не первый подход к теме. Второй в списке — пролог про Максима (<a href=\"IS-0052.html\">Пролог про Максима</a>), третий — «автопилот», не показанный.</p>\n<p>Отправлен вторым из двух присланных (id 323659–323660, сразу после пролога про Максима).</p>\n<p>В базе история связана с событием «Инцидент (ядерный удар)» и с «Опрос: какой апокалипсис страшней»; сам рассказчик называет событие «инцидентом» и описывает его как одновременный залп боеголовок.</p>\n<p>Вселенная в переписке не объявлена; в базе история отнесена к Нимбу по дате объявления.</p>", "r": [["Пролог про Максима", "IS-0052.html"]]}, {"t": "Состояние", "a": ["S04", "IS-0053-S04", "IS-0053--sostoyanie"], "h": "<p><strong>2025-05-04, id 323659–323660</strong> — пролог написан и показан соавтору двумя сообщениями.</p>\n<p><strong>2025-05-04, id 323661</strong> — Миколай: «мне второй больше нравится, поэтому предлагаю продолжить первый». Больше понравился этот пролог, но продолжать он предлагает пролог про Максима (<a href=\"IS-0052.html\">Пролог про Максима</a>).</p>\n<p><strong>2025-05-04, id 323667</strong> — объяснение, почему нравится: «я просканировал и чувствую что я буду это читать и мне будет легко, кажется такое сложно поддерживать долго». Причина, по которой продолжать он предлагает другой: «мне интересно во что в конечном итоге это выйдет. и кажется диалоги развивать сложнее, а я уважаю выбор в сторону усложнения».</p>\n<p><strong>2025-05-04, id 323672</strong> — отдельная поправка про этот пролог: «справедливости ради и во втором есть диалоги, но впечатление я дал по началу, как одно и как другое зацепило».</p>\n<p>Продолжения в переписке нет: выбор для продолжения сделан в пользу <a href=\"IS-0052.html\">Пролог про Максима</a>.</p>", "r": [["Пролог про Максима", "IS-0052.html"]]}, {"t": "Пробелы", "a": ["S05", "IS-0053-S05", "IS-0053--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вселенная при написании не объявлена; отнесение к Нимбу — по дате.</li>\n<li>«Всё же решил попробовать ещё раз» — предыдущая попытка написать апокалипсис здесь не описана.</li>\n<li>Имя племянницы не названо.</li>\n<li>Кто и по кому нанёс удар, и что стало с Алексеем после того, как на машину упало здание, — в прологе не сказано; продолжения нет.</li>\n<li>В нумерации Славы апокалипсис первый, а отправлен вторым; слова Миколая «первый»/«второй» отдельно не расшифрованы.</li>\n<li>Третий пролог, «автопилот», не показан.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["IS-0053--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает истории:</strong> <a href=\"IS-0052.html\">Пролог про Максима</a></li>\n<li><strong>Упомянут в историях:</strong> <a href=\"IS-0052.html\">Пролог про Максима</a>, <a href=\"IS-0054.html\">История про лесоруба</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["IS-0053--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-05-04</td>\n<td>323648–323672</td>\n<td>w0090</td>\n<td>Нимб (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/istorii/IS-0053-prolog-pro-apokalipsis.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["IS-0053--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/IS-0053.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
