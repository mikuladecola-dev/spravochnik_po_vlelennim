<script>const BASE="";const DOCNAME="Благословенные";
const LEAD="<p>Категория носителей силы во вселенной «Апостол», проходящая через всю переписку с 2025-01-13 по 2026-04-25 (16 версий, окна w0071, w0075, w0077, w0080, w0094, w0103, w0104, w0120). В переписке употребляется и во множественном («благословенные», «благословенный» как собирательное), и как обозначение отдельного носителя. Отдельные благословенные названы по прозвищам; сильнейшие из них — апостолы.</p>";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0179-S01", "PS-0179--proishozhdenie"], "h": "<p>Сила благословенного — не своя, а выданная. Первое положение о ней (2025-01-13, id 281368): «Сразу всё благословенный равны по силе, путь то благословенный Богом, дьяволом, или другими правителем минимиров». То есть источником благословения могут быть Бог, дьявол или иные правители минимиров, и происхождение силы на её величину не влияет.</p>\n<p>Прошлое категории проговорено в том же окне (2025-01-13, id 281373–281376) как один из вариантов ответа на вопрос Славы, откуда во вселенной берутся артефакты. Миколай: «раньше веков 15 назад благословенные были мощее но типа их реже призывали поэтому они оставляли силу потомкам», «и заключали её в артефактах». Дальше он же снимает часть собственного утверждения: «ну мб про мощь убрать можно», и оставляет мотив без указания на большую силу — «просто думали что благословенных больше не будет и заботились о будущем». Кто и как «призывает» благословенных, в окне не раскрыто.</p>\n<p>Взгляд на происхождение силы со стороны врага дан в тексте Славы устами старика-арбетара (2025-03-13, id 301806, повтор в развёрнутом виде — id 301821): «Ведь по правде говоря вся их сила, и не их вообще. Жалкий благословенный получивший силу лишь потому что понравились правителем, но сами они эту силу не добывали. Лишь мелкий пизжоны». Там же названа причина, по которой старик выделяет апостолов: «Эти апостолы не пойми кем себя возомнили и везде понаставили свои порядки, на чужой силе».</p>\n<p>К 2025-08-30 (id 359681) формулировка положения благословенных в мире такая: это «Людей, что лишь своё силой и авторитетом поддерживают мир». Благословение при этом выдаёт конкретный правитель, и носитель привязан к нему: «Есть сестра благословенная правителем Кильке» (id 359684).</p>\n<p>2025-09-12 (id 364764) источник силы переопределён целиком: «Благословенный всё также но силы у всех благословенных получен от небес». Прежняя схема с разными правителями (Бог, дьявол, правители минимиров) этой репликой не отменена вслух, но сила у всех сведена к одному источнику.</p>\n<p>2026-04-19 (id 462205) понятие вводится заново, уже для нового мира без энергии: «Благословенный это люди, что способны чувствовать присутствия когото. Кого именно неизвестно, может бог, может ещё какое-то существо». Слава прямо говорит, что благословенные и одарённые «пока что основой послужат» (id 462204).</p>", "r": []}, {"t": "Характер", "a": ["S02", "PS-0179-S02", "PS-0179--harakter"], "h": "<p>Отдельного описания нрава у категории нет; в переписке характеризуется поведение апостолов как группы, и делается это дважды.</p>\n<p>В монологе старика (2025-03-13, id 301806) — с ненавистью и с признанием: «как бы я ненавидел апостолов. Но не могу не признать, что свою работу они выполняють слишком идеально. Ну даже в идеальной системе есть единичные пробои».</p>\n<p>В описании раскрытия изнанки (2025-09-12, id 364774) — через их публичные действия: «когда апостолы устроили охоту на одну религиозную организацию по всему миру. И делали они это особо не скрываясь. Да какой там скрываться. Они могли в центре города разнести церковь или многоэтажку которая принадлежал той организации. Апостола ещё могли публично устроить казнь десятков а то и сотни людей».</p>", "r": []}, {"t": "Способности", "a": ["S03", "PS-0179-S03", "PS-0179--sposobnosti"], "h": "<p><strong>Общая механика (2025-01-13).</strong> Благословение временно и не запасается: «Благословений это временная сила, типа еë нельзя долго сохранять. Например огонь стрельнуть по дереву оно горит, а после отключение благословенной огонь сразу исчезает» (id 281379). И: «Благословений не может быть активным постоянная, это тратит выносливость» (id 281382). На это Миколай отвечает предположением, оставшимся без развития: «ну мб раньше был способ» (id 281380) — то есть допущение, что сохранять силу когда-то умели, увязанное с версией об артефактах и передаче силы потомкам.</p>\n<p><strong>Чего благословенные не могут (2025-03-13, id 301867–301868).</strong> На вопрос Миколая, умрёт ли Антон, если способность пропадёт, Слава отвечает «Лекарствами и бинтами» и напоминает: «Я же говорил вроде апостолы не способны лечить и влиять на разум», сразу расширяя запрет на всю категорию — «Благословенный вообще все».</p>\n<p><strong>Уязвимость (2025-03-13, id 301806).</strong> «благословенный не могут использовать благословенния долга, поэтому можно просто неожидано напасть и убить и всё». Что такое «благословение долга» — в окне не раскрыто. Противопоставление даётся через альф и арбетаров: «у альфа и арбетатов похожий силый. Они как и мы может использовать свою силу 24/7 без риска повредить мозг. А если сила всегда активна и его защищает, то просто неожиданная атака, на нём не проканает». Отсюда же следует, что убить благословенного проще, чем чужемирца, и намного проще, чем альфу: «благословенного убить было легко», «Сложнее было убить чужемирцов. Ну это так цветочки. Самым сложным, как я уже говорил был альфа».</p>\n<p><strong>Тело как материал (2025-03-13, id 301806, 301821).</strong> Мозг благословенного входит в набор материалов ритуала становления Арбетаром: «один из этих материалов ты, и пару чужемирцов, и ещё один благословенный и самая сложная альфа». Функция мозга в ритуале названа: «я использую мозг благословенного, чтобы он начал собирать силу. И тело Альфы дабы он его пресовал. А всё остальные компоненты служат активаторами».</p>\n<p><strong>Ранжирование силы (2025-08-30).</strong> Апостолы — «Сильнейший среди благословенных» (id 359681). Отдельные благословенные могут превосходить отдельных апостолов: «Есть сестра благословенная правителем Кильке. Да она сильнее одного апостола. Но дальше че. Это не та сила, что поставит на колени весь мир. А её подручный всё слабее апостолов. Каждый из них один на один против апостолов продует» (id 359684).</p>\n<p><strong>Сравнение с одержимыми (2025-09-12, id 364766).</strong> «Одержимый это аналог Арбетара (я даже в иногда буду называть их так) то есть у него такие же силы. Но ему не надо обучаться. Он сразу сильный. И в чаще всего сильнее благословенных (поэтому на убийства одержимого они ходят группой разного количества)».</p>\n<p><strong>Механика 2026-04-19 (id 462205).</strong> В новой редакции способность одна на всех — чувствовать присутствие «когото», — но каждый чувствует его по-своему, и у каждого есть свой плюс (почти невозможность умереть) и свой дебафф за неповиновение зову. Перечислены поимённо:</p>\n<ul>\n<li><strong>Герой</strong> — слышит шёпот: «герой молю спаси...», «Герой помоги», «Герой, герой герой». Слышит, когда людям нужна помощь и они внутренне обращаются к нему; помощь имеется в виду «материальная, физическая и духовна». Шёпот отчасти предсказывает будущее: «если человека должа сбить машина, то Герой заранее услышат мольбу о помощи». Минус: если не спасёт тех, кто молил, ему будут сниться кошмары, «настоль страшный, что просто думать о с ней будет пугать Героя». Плюс: каждый раз при смертельном ранении («ему голову пристрелили или машина сбила или он упал с десяти этажки») он вырубается, слышит «герой пора вставать» и просыпается в больнице живой, «А врачи диву даются».</li>\n<li><strong>Мистер белая рубашка, он же Александор (Саша)</strong> — «невероятно везучий»: при попытке застрелить «либо промажуть, либо Саша сам как-то споткнеться, либо пистолет заклинит и даст осечку», «десять из десяти выигрывает». Дебафф — за нерискованное поведение: «Но если он не рискует. То если он попытается поесть, в его горло словно че я та рука залезет и спуститься в желудок, и начнёт его выворачивать. И Сашу конечно стошнит».</li>\n<li><strong>Юра</strong> — «тоже вроде Героя в каком-то роде может будущее предсказывать»: видит две белые точки, «то бишь глаза не понятного существа», что означает близкую опасность. Не способен умереть: заранее знает об опасности и может её избежать, а если попадёт — «как-то спасется, иногда опасность самая может устранить себя». Удачлив в опасности, «конечно не так как Саша, ну вполне достаточно чтобы выжить».</li>\n<li><strong>Четвёртый</strong> (имя не названо) — чувствует запах, напоминающий дом: «вот долго жил в своём доме и вдруг ты оттуда надолго уходишь. А когда возвращаясь то чувствуешь вроде привычный но словно незнакомый запах, но он тебя всё равно успокаивает». Запах может меняться, по нему определяется, «ждёт их хорошая или плохое», и идти за ним нужно в любом случае: «иначе запах станет смердящим. Настолько что его будет тошнит и он будет вырубаться».</li>\n<li><strong>Пятый, Азуриэль</strong> — чувствует эмоции людей, а иногда «чётко ощутить эмоции нечто, который опять же его куда-то ведут». Дебафф: если не пойдёт, «то его способности умиляться и он более отчётливо начнёт осушать чужие чувствовать, а так как их много он начнёт сходить с ума от этого».</li>\n<li><strong>Седьмой, Максим</strong> — «Он сверхчеловек». Восприятие ускорено: «для него всё люди медленный. Их голоса, машины, самолёт для него всё медленная». Каждое движение точно, «ведь он просто чуствует, как каждая клетка его тела напрягается при прыжки, чусвтует как лучше напрячь мышцы, что выше прыгнуть». Присутствие ощущает через сердцебиение и должен «идти по зову сердца»: если идёт туда, куда ведёт сердце, «он по чуствует как приятно бьётся сердца и словно чём-то тёплый руки обнимают его», если не следует — «его сердца начнёт больно екать, и ему будет холодно». О смерти: «ну невозможно, он как бы почти сверхчеловек».</li>\n</ul>\n<p>Шестой в перечислении пропущен — после четвёртого идёт пятый Азуриэль, за ним сразу седьмой Максим. Слава завершает список словами «Ну принцип ты понял» (id 462206).</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Отклик — не материал авторов</b>\n<p>Зацепила редакция 2026-04-19, и именно тем, чем она устроена. Способность у всех шестерых — не действие, а адресация: кто-то к тебе обращается, и ты обязан пойти. А расплата за отказ идёт не наказанием сверху, а тем же самым чувством, вывернутым внутрь тела: запах становится смердящим, эмоции чужих начинают затапливать, сердце «больно екает» и делается холодно. Лучшее — Саша: не рискнул, повёл себя осторожно — и не может есть, потому что в горло лезет рука. Дебафф привязан не к морали, а к характеру, и наказывает ровно за то, чтобы перестать быть собой. Плюс при этом у всех один и тот же — не умирать; различаются только способы, которыми мир не даёт им уйти. Шесть человек, у которых бессмертие не награда, а условие того, что зов не прекратится, — это сильнее, чем весь предыдущий аппарат с правителями и процентами силы. И рядом стоит собственная реплика автора про всю категорию: «Ну я их везде пихаю».</p></div>", "r": []}, {"t": "Связи с другими", "a": ["S04", "PS-0179-S04", "PS-0179--svyazi-s-drugimi"], "h": "<p><strong>Апостолы.</strong> Сильнейшие из благословенных (2025-08-30, id 359681). В списках 2025-02-25 и 2025-05-14 заголовок над одним и тем же перечнем меняется с «Благословенный:» на «Апостолы:» — то есть перечень апостолов и перечень благословенных в этих сообщениях совпадают.</p>\n<p><strong>Организация Азип (АЗИП).</strong> «у них есть нерушимая организация Азип, которой уже более сотней лет» (2025-08-30, id 359681).</p>\n<p><strong>Одержимые.</strong> Названы рядом с благословенными как парная категория: «Во первых вообще кто есть благословенные и одержимые» (2025-09-12, id 364764). Одержимые — «люди одержимые демоном», их либо убивают, либо изгоняют демона; изгнание редко, «ведь это муторно и опасно. Легче просто убить». У одержимых есть собственные организации, «такие же больший организации как и у благословенных», после раскрытия чёрной изнанки их начали защищать, но убийство остаётся законным. Благословенные ходят на убийство одержимого группой. Ещё раньше (2025-02-25, id 295553–295557) Слава напоминает Миколаю про одержимого и «Благословенный ада / Которых 9».</p>\n<p><strong>Арбетары и Альфы.</strong> Отдельная сила, устроенная иначе: сила активна круглосуточно, что делает внезапную атаку неэффективной (2025-03-13, id 301806). Мозг благословенного и тело альфы — материалы ритуала становления Арбетаром.</p>\n<p><strong>Категории носителей сил (2025-05-10, id 324541).</strong> Благословенный, Арбетары, Альфы, Чужемирцы, Владельцы артефактов, Фантазёры.</p>\n<p><strong>Силы мира (2025-08-30, id 359697–359707).</strong> Слава предлагает «придумать третью силу. Наподобие благословенных?», Миколай уточняет, какая вторая, и получает перечень: «Благословенный / Арбетаров и Альфы / Творцы (фантазёры)». Слава тут же поправляется: «То есть четвёртую».</p>\n<p><strong>Защитник.</strong> Персонаж, чьё чутьё сравнивается с чутьём благословенного, но благословенным он не является (2025-02-12, id 288545): «После всего этого он начал как то инстинктивно понимать, где находиться чужимирцы словно благословенный. Но он им не был». Ему предстоит узнать «о чужимирцов, о благословенных, о артефактах». В том же монологе старика (2025-03-13, id 301806) защитник выбран как «манекен для проверки мой новый силы» — при этом отвергнут вариант испытать силу на апостолах («С ними ещё рано») и на благословенных («Хотя нет я ещё не научился пользоваться силю»).</p>\n<p><strong>Сестра.</strong> Благословлена правителем Кильке, сильнее одного апостола, назначена ключевым злодеем: «Нет сестра так и останется ключевым злодеем. Но кто в её команде должен быть настолько сильном что перевернёт хот битвы» (2025-08-30, id 359688).</p>\n<p><strong>Серафим.</strong> Рассматривался как злодей и отклонён в этой роли: «Есть Серафим. Но это одноразовый босс. Что появится, когда будет война с раем» (id 359686). Существа из рая тоже отклонены: «не подходят на злодеев. Во первых нет так таковой цели, кроме мести. Во вторых не какой группироаонной работы не будет их же в разный места раскидает» (id 359687).</p>\n<p><strong>Чёрные (тёмные) места.</strong> Второй аспект нового мира наравне с благословенными: «в которых если войти, то выйдешь уже не ты, а монстор» (2026-04-19, id 462207).</p>\n<h3>Кура</h3>\n<p>Имя, появившееся в списке апостолов под номером 11 (2026-02-09, id 430400), где раньше позиция была пустой; в самом окне вокруг имени ничего не разрабатывается. Развёрнутая карточка написана раньше, 2025-05-31 (id 331639), под заголовком «Способности Куры (Арбетара)».</p>\n<p>Внешность и возраст: мужчина, выглядит на 30 лет, точный возраст неизвестен, рост 185. «Носить маску курицы с красным гребнем, зелёно-оранжевый плащ с ромбовидным узором, кожаные аксессуары, пояс с разноцветными украшениями и сапоги. И зеленные короткий меч на поясе».</p>\n<p>Характер: «игривым и импульсивным». «Из-за частого чтения чужих воспоминаний. Он сомневается, что нынешний он это он. И в попытках доказать себе, что он прежний он творит разные безумные вещи пытаясь удержать своё я». Любит танцевать и плясать, любит динамичную музыку, «которая заставляет, что-то внутри него забиться». Не любит всё, что требует ждать и проявлять терпение.</p>\n<p>Положение: некоторое время был начальником одного из дополнительных филиалов АЗИП, «Но был отстранён из-за проявления своего безумия и игривого характера». На момент карточки — агент и приближённый Апостола (Бессмертного).</p>\n<p>Три способности:</p>\n<ul>\n<li><strong>Водоворот событий.</strong> Создаёт вокруг владельца водоворот воды радиусом 15 метров, затягивая ближайших противников; «водоворот достаточной сильный, чтобы затянуть апостола или арбетара». Затем схлопывается, физические тела владельца и затянутых исчезают, а разум переносится «в рандомное события владельца или полученного им воспоминания». Попавший видит событие так, как видел его владелец, и с теми же чувствами, участвует в нём и может пытаться изменить, «Но итог события всегда будет один и тот же». Так проживаются события вместе с владельцем, пока водоворот не остановится; момент остановки владелец не контролирует, «Он останавливается в рандомной время». Внутри нельзя умереть: попав в событие с гибельным исходом, «Ты просто переключается на другое события». По окончании всех выталкивает водой туда, откуда втянуло.</li>\n<li><strong>Чтение воспоминаний.</strong> Читает чужие воспоминания прикосновением к голове; прикосновение должно быть долгим и сконцентрированным. Выбрать нужное воспоминание нельзя — «Он будет получать их рандомное». Можно прочесть воспоминания недавно погибшего, «Главная, чтобы он умер недавно и была цела голова».</li>\n<li><strong>Реконструкция.</strong> Преобразует опыт и воспоминания в энергию зелёного цвета, усиливая носителя: повышает все физические показатели и защиту, даёт полёт, позволяет проецировать двойника, выглядящего как голограмма, и создавать объекты в виде голограмм, которые «всё ещё могут причинить физические вред». Примечание автора: энергия по итогу рассеивается, «Но после того, как она рассеяться то она будет делать всё возможное, чтобы воссоединиться с владельцем. Возвращая ему утеренный воспоминания и опыт».</li>\n</ul>\n<p>Реакция Миколая (2025-05-31, id 331664–331665): «хочу», «ну в целом крайне интересно».</p>\n<h3>Липкий и иссушающий</h3>\n<p>Два рабочих названия, дописанные Миколаем в пустые позиции списка апостолов (2026-01-31, id 426535): «липкий / иссушающий». На вопрос Славы «Че за липкий» (id 426554) Миколай отвечает через полтора часа: «придумаю позже», «пока как заполнение» (id 426562–426563). Содержания за названиями нет.</p>", "r": []}, {"t": "Как менялся", "a": ["S05", "PS-0179-S05", "PS-0179--kak-menyalsya"], "h": "<p><strong>2025-01-13 (w0071, id 281365–281386).</strong> Первое обсуждение. Равенство силы независимо от источника благословения (Бог, дьявол, правители минимиров). Прошлое: 15 веков назад мощнее, реже призывали, оставляли силу потомкам, заключая её в артефактах, потому что «думали что благословенных больше не будет и заботились о будущем». Оговорка Миколая: «ну мб про мощь убрать можно». Механика: благословение временно, не сохраняется, постоянно активным быть не может, тратит выносливость.</p>\n<p><strong>2025-02-12 (w0075, id 288545).</strong> Категория дважды упомянута внутри художественного текста без объяснения: чутьё защитника на чужемирцев сравнивается с чутьём благословенного, и благословенные перечислены среди того, о чём защитнику ещё предстоит узнать.</p>\n<p><strong>2025-02-25 (w0077, id 295551–295560).</strong> Слава напоминает про одержимого и «Благословенный ада / Которых 9», после чего присылает список под заголовком «Благословенный:» из четырнадцати нумерованных позиций с прозвищами и пометками сил в скобках:</p>\n<ol>\n<li>Имитатор (ветреной; электро; птичка)</li>\n<li>Агрегат (теневые братья; экстримал; страдалец)</li>\n<li>Разрушительница (огненная)</li>\n<li>Палач (тварь)</li>\n<li>Защитник (ангел)</li>\n<li>Дитя света (военный)</li>\n<li>Бессмертный выродок</li>\n<li>Хулиган (слайм)</li>\n<li>Вибрация</li>\n<li>Ученица???</li>\n<li>Масочник</li>\n<li>Сон</li>\n<li>Небесная</li>\n<li>Маэстро</li>\n</ol>\n<p>В том же сообщении идут отдельные перечни: одержимый (Гурман); враги (Доспехи, Козлиха, Сестра, Огненный снайпер, Охотник, Божество, Убийца, Зонтик, Леший, Пар, Садистка, Насекомое, Старик, Эльф); церковь (Священнослужитель, Многоглазый); военные (Зеркальный, Очкарик); сторонние силы (Породитель, Провидец, Серафим — «манипуляция сознанием; контроль времент; управлений светом; огонь Божий»); семь грехов; аномалии; оружие; артефакты; идеи. Ответ Миколая: «всё это время в голове держу».</p>\n<p><strong>2025-03-13 (w0080, id 301806, 301821).</strong> Описание категории изнутри истории, устами старика-арбетара: сила чужая и выданная за симпатию правителя, невозможность использовать «благословение долга» и вытекающая уязвимость к внезапной атаке, мозг благословенного как материал ритуала, отдельная ненависть к апостолам с признанием их работы. Сообщение 301821 — повтор того же текста в более полной версии.</p>\n<p><strong>2025-03-13 (w0080, id 301865–301874).</strong> Запрет на лечение и влияние на разум распространён со всех апостолов на всех благословенных.</p>\n<p><strong>2025-05-09 (w0094, id 324457–324462).</strong> Слава объявляет: «Я возвращаюсь к благословенным». Тогда же решается не привязывать истории к одной вселенной — «Истории писать именно о вселенной или похую разный истории в разных вселенных. То бишь не ограничивать себя», ответ Миколая: «не ограничивай».</p>\n<p><strong>2025-05-10 (w0094, id 324541).</strong> Благословенные поставлены первыми в перечне из шести категорий носителей сил.</p>\n<p><strong>2025-05-14 (w0094, id 325798–325808).</strong> Тот же реестр, что 2025-02-25, но перечень из четырнадцати позиций озаглавлен уже «Апостолы:», а из списка врагов исчез Зонтик. Слава добавляет: «Он жив», «Ну и нужно исправления». На уточняющие вопросы Миколая («убрать кого-то? добавить») отвечает: «Добавления организация нимб и фантазеров / И перераспределение сил».</p>\n<p><strong>2025-08-30 (w0103, id 359681–359711).</strong> Благословенные — «Людей, что лишь своё силой и авторитетом поддерживают мир», апостолы — сильнейшие среди них, при них организация Азип старше ста лет. Благословение выдаёт конкретный правитель. Обсуждается нехватка злодея, способного напугать масштабом: сестра и её подручные не тянут, Серафим — одноразовый босс, существа из рая не подходят. Благословенные помещены в перечень сил мира первыми: «Благословенный / Арбетаров и Альфы / Творцы (фантазёры)».</p>\n<p><strong>2025-09-12 (w0104, id 364763–364782).</strong> Источник силы переопределён — у всех благословенных сила получена от небес; остальное «всё также». Одержимые описаны как аналог арбетаров и чаще сильнее благословенных. Описано раскрытие изнанки апостолами и три следствия: подписан «публичный договор обозначающий права и обязанности благословенных. А также их не я, не участия в военных конфликтах»; большинство организаций раскрылись, их можно нанимать для убийства одержимого (для родственников одержимого бесплатно, изгнание демона — платно); в эти организации теперь можно вступить. Схватки одержимых и благословенных стали обыкновенными.</p>\n<p><strong>2026-01-31 (w0115, id 426535–426563).</strong> В пустые позиции списка апостолов Миколаем дописаны «липкий» и «иссушающий» как заполнение без содержания.</p>\n<p><strong>2026-02-09 (w0116, id 430400).</strong> Список апостолов из двенадцати позиций: 1. Имитатор, 2. Агрегат, 3. Защитник, 4. Бессмертный выродок, 5. Граф, 6. Вибрация, 7. (пусто), 8. Звездачет, 9. Небесная, 10. Палач, 11. Кура, 12. Избранный. Реакция Миколая: «Читал. В принципе неплохо».</p>\n<p><strong>2026-04-19 (w0120, id 462204–462207).</strong> Понятие вводится заново для мира без энергии: благословенные — люди, способные чувствовать чьё-то присутствие, причём каждый чувствует по-своему; у каждого свой плюс, сводящийся к почти невозможности умереть, и свой дебафф за то, что он не идёт за зовом. Названы Герой, Александор, Юра, четвёртый (запах), Азуриэль, Максим. Слава: «пока что в нашем мире есть только два аспекта: Благословенный и чёрные места».</p>\n<p><strong>2026-04-25 (w0120, id 466469–466505).</strong> Повтор того же положения дел: «Идеи для мира с тёмными местами и благословенным», «Там были только благословенный и тёмные места».</p>", "r": []}, {"t": "Что с ним стало", "a": ["S06", "PS-0179-S06", "PS-0179--chto-s-nim-stalo"], "h": "<p>На последней дате переписки (2026-04-25) благословенные остаются одним из двух аспектов нового мира наряду с тёмными местами и стоят в основе задумки. Слава заявляет намерение вернуть к ним апостолов: «Хочу опять добавить апостолов» (id 466476). Миколай на это отвечает не по существу задумки, а по своей занятости: «ну вот когда мне все это делать», «я не знаю» (id 466474–466475), позже — «а, благословенные, точно» (id 466504). Слава ожидал возражений: «Я думал критика будет» (id 466499), и подводит итог собственной работе с категорией: «Ну я их везде пихаю» (id 466505). Дальнейшего развития в переписке нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0179-S07", "PS-0179--probely"], "h": "<div class=\"gaps\"><ul>\n<li><strong>Вселенная не названа в нескольких окнах.</strong> В w0071 вселенная не объявлена, в w0103 тоже; в w0104 и w0120 принадлежность вселенной неясна — версии 13–16 отнесены к вселенной по дате объявления, а не по прямому указанию.</li>\n<li><strong>Кто и как «призывает» благословенных</strong> (2025-01-13) — не раскрыто.</li>\n<li><strong>Кем благословлены</strong> — в w0075 благословенные названы дважды и не объяснены вовсе.</li>\n<li><strong>Расхождение в счёте (2025-02-25).</strong> Сказано «Благословенный ада / Которых 9», а в присланном следом списке четырнадцать позиций. Расхождение в переписке не обсуждается.</li>\n<li><strong>Ученица???</strong> — позиция 10 списка помечена знаками вопроса самим автором, содержания за ней нет.</li>\n<li><strong>«Благословение долга»</strong> — названо как то, чего благословенные не могут использовать, но что это такое, в окне не раскрыто и позже не объясняется.</li>\n<li><strong>Соотношение источников силы.</strong> Схема 2025-01-13 (Бог, дьявол, правители минимиров) и формула 2025-09-12 («силы у всех благословенных получен от небес») друг с другом в переписке не сведены; какая версия отменяет какую, не сказано.</li>\n<li><strong>Как связаны редакция до 2025-09-12 и редакция 2026-04-19</strong> — прямо не сказано; в 2026-04-19 понятие вводится заново, «пока что основой послужат», без ссылки на прежние правила (временность силы, выносливость, запрет на лечение).</li>\n<li><strong>Шестой носитель (2026-04-19)</strong> в перечислении пропущен: после пятого (Азуриэль) идёт седьмой (Максим).</li>\n<li><strong>Имя четвёртого носителя</strong> (тот, что чувствует запах) не названо.</li>\n<li><strong>«Перераспределение сил»</strong> заявлено 2025-05-14 как нужная правка, но в переписке не выполнено.</li>\n<li><strong>Организация Нимб и фантазёры</strong> заявлены к добавлению 2025-05-14; что они собой представляют применительно к благословенным, в окне не сказано.</li>\n<li><strong>Злодей сильнее апостолов</strong> — задача поставлена 2025-08-30 («кто в её команде должен быть настолько сильном что перевернёт хот битвы») и осталась нерешённой.</li>\n<li><strong>Разница между списками 2025-02-25/2025-05-14 и 2026-02-09</strong> (пропавшие Разрушительница, Дитя света, Хулиган, Ученица, Масочник, Сон, Маэстро; появившиеся Граф, Звездачет, Кура, Избранный; пустая позиция 7) в переписке не комментируется.</li>\n<li><strong>«Липкий» и «иссушающий»</strong> остались названиями без содержания.</li>\n</ul></div>\n<div class=\"mnote\"><b>⚙ машинная заметка · С чего начать — не материал авторов</b>\n<p>Что там: связь ставится правителем на мозге и мозгу вредит; «Средние продолжительность жизнь у благословенного после получения благословения 10 лет»; четыре базовые способности у всех — регенерация, усиление тела и чувств, аура, сенсорика; сверх них уникальная способность от правителя, одинаковая у всех благословенных одного правителя; апостолы — «21 человек получивший благословен от правителя рая», у них способности разные, потому что правитель рая шлёт «лишь сгустки чистой и необработанной силы». Это закрывает или переопределяет сразу несколько пунктов из «Пробелов» — про призыв, про источник силы, про соотношение апостолов и прочих. При этом из <code>PS-0179</code> на <code>SP-0163</code> нет ни одной ссылки: две большие статьи об одном предмете не знают друг о друге.</p></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0179--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0006.html\">Организация злодеев</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0006.html\">Организация злодеев</a>, <a href=\"GR-0013.html\">Благословенные</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0179--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-01-13</td>\n<td>281365–281386</td>\n<td>w0071</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-02-12</td>\n<td>288545–288545</td>\n<td>w0075</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-02-25</td>\n<td>295551–295560</td>\n<td>w0077</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-13</td>\n<td>301806–301807</td>\n<td>w0080</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-13</td>\n<td>301821–301821</td>\n<td>w0080</td>\n<td>Апостол (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2025-03-13</td>\n<td>301865–301874</td>\n<td>w0080</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-05-09</td>\n<td>324457–324462</td>\n<td>w0094</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-05-10</td>\n<td>324539–324541</td>\n<td>w0094</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-05-14</td>\n<td>325798–325801</td>\n<td>w0094</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-05-14</td>\n<td>325805–325808</td>\n<td>w0094</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-08-30</td>\n<td>359681–359688</td>\n<td>w0103</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-08-30</td>\n<td>359697–359711</td>\n<td>w0103</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-09-12</td>\n<td>364763–364766</td>\n<td>w0104</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-09-12</td>\n<td>364774–364782</td>\n<td>w0104</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-04-19</td>\n<td>462204–462207</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-04-25</td>\n<td>466469–466505</td>\n<td>w0120</td>\n<td>неясно (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0179-blagoslovennye.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0179--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0179.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0179-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0179/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первое — апостолы. Статья держит их сквозной темой: сильнейшие среди благословенных, два перечня под меняющимися заголовками, «Хочу опять добавить апостолов» на последней дате. Отдельной сущности со статьёй при этом нет: весь материал лежит в служебной записи <code>SL-0054</code> «Список 12 апостолов» — 234 052 знака базы, статьи нет, ссылок по счётчику три; по тексту на неё опираются <code>PS-0211</code>, <code>PS-0279</code>, <code>PS-0183</code>, <code>IS-0013</code>, <code>SP-0127</code>. Это крупнейшая запись без статьи во всём наборе, и половина этой статьи упирается в неё.</p>\n<p>Второе — вся редакция 2026-04-19, то есть то, чем статья заканчивается. Шесть носителей разложены по отдельным записям, у всех вселенная «неясно», статьи нет, ссылок ноль: <code>PS-0359</code> Герой (15 064), <code>PS-0360</code> Александор (8 070), <code>PS-0361</code> Юра (7 884), <code>PS-0362</code> «Четвёртый благословенный (запах дома)» (8 179). Плюс продолжение линии Героя — <code>PS-0372</code> Праведник (8 228) и <code>SP-0274</code> «Способность Праведника» (5 573). Около 53 000 знаков ровно про действующее состояние понятия, и ни одной ссылки.</p>\n<p>Третье — механика от 2025-05-31, которой в статье нет вовсе: <code>SP-0240</code> «Благословение правителя» (9 835), <code>SP-0241</code> «Четыре основные способности благословенных» (9 573), <code>SP-0242</code> «Уникальная способность правителя» (9 592). Три записи без статей, без вселенной, без ссылок.</p>\n<h3>С чего начать</h3>\n<p>В базе. Ключ — id 331635–331636, 2025-05-31, окно w0099. В записи <code>PS-0179</code> этого сообщения нет: версия 10 кончается 2025-05-14, версия 11 начинается 2025-08-30, и в этот зазор попал самый систематический текст Славы про благословенных. Лежит он в <code>SL-0054</code>, <code>SP-0163</code> «Благословение» (статья есть, 41 683 при базе 86 784), <code>PS-0278</code>, <code>PS-0279</code>, <code>PS-0280</code>, <code>MR-0140</code>, <code>MR-0207</code>.</p>\n<p>Что там: связь ставится правителем на мозге и мозгу вредит; «Средние продолжительность жизнь у благословенного после получения благословения 10 лет»; четыре базовые способности у всех — регенерация, усиление тела и чувств, аура, сенсорика; сверх них уникальная способность от правителя, одинаковая у всех благословенных одного правителя; апостолы — «21 человек получивший благословен от правителя рая», у них способности разные, потому что правитель рая шлёт «лишь сгустки чистой и необработанной силы». Это закрывает или переопределяет сразу несколько пунктов из «Пробелов» — про призыв, про источник силы, про соотношение апостолов и прочих. При этом из <code>PS-0179</code> на <code>SP-0163</code> нет ни одной ссылки: две большие статьи об одном предмете не знают друг о друге.</p>\n<p>В архив — за именами и за концом линии. Имя четвёртого носителя (того, что чувствует запах) в базе не встречается: <code>PS-0362</code> собран из тех же 462204–462206, ничего сверх статьи там нет. Искать надо правее внутри w0120, окно тянется до 487178 и обрывается на «идей мало приходит». Продолжение — в w0121: с 487514 Слава даёт Герою имя Праведник и полное описание способности, там же рядом разбирается старик с гравитацией (487192–487235). То есть перечень 2026-04-19 не заброшен, он просто дописывается за краем прочитанного.</p>\n<h3>Как развивалось</h3>\n<p>2025-01-13 — заявили: все благословенные равны по силе, источник (Бог, дьявол, правители минимиров) на величину не влияет. 2025-03-13 — ограничили: не лечат и не влияют на разум, силу нельзя держать включённой, внезапная атака работает; тогда же благословенный впервые описан не как носитель, а как материал для чужого ритуала. 2025-05-31 — механику расписали целиком, но в линию «благословенные» она не вернулась. 2025-09-12 — источник переопределён одной фразой, «силы у всех благословенных получен от небес», прежняя схема вслух не отменена. 2026-04-19 — понятие введено заново, для мира без энергии, без ссылки на прежние правила: «пока что основой послужат». 2026-04-25 — повтор того же положения дел, «Хочу опять добавить апостолов» и «Ну я их везде пихаю»; Миколай отвечает про свою занятость.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>В редакции 2026-04-19 правило объявлено общим: у каждого носителя есть плюс, сводящийся к почти невозможности умереть, и дебафф за то, что он не пошёл за зовом. По самому перечню оно проведено неровно. У Героя, у Саши и у Максима названы обе половины. У Юры назван только плюс — не умирает, заранее видит опасность, везучий, — а чем он платит, если не пойдёт от двух белых точек, не сказано. У четвёртого (запах) и у Азуриэля наоборот: дебафф выписан подробно, до тошноты и обмороков, а плюса, который заявлен для всех, у них нет. Правило названо, и для половины списка вторая его половина не проговорена.</p>\n<h3>Отклик</h3>\n<p>Зацепила редакция 2026-04-19, и именно тем, чем она устроена. Способность у всех шестерых — не действие, а адресация: кто-то к тебе обращается, и ты обязан пойти. А расплата за отказ идёт не наказанием сверху, а тем же самым чувством, вывернутым внутрь тела: запах становится смердящим, эмоции чужих начинают затапливать, сердце «больно екает» и делается холодно. Лучшее — Саша: не рискнул, повёл себя осторожно — и не может есть, потому что в горло лезет рука. Дебафф привязан не к морали, а к характеру, и наказывает ровно за то, чтобы перестать быть собой. Плюс при этом у всех один и тот же — не умирать; различаются только способы, которыми мир не даёт им уйти. Шесть человек, у которых бессмертие не награда, а условие того, что зов не прекратится, — это сильнее, чем весь предыдущий аппарат с правителями и процентами силы. И рядом стоит собственная реплика автора про всю категорию: «Ну я их везде пихаю».</p></div>", "r": []}];</script>
