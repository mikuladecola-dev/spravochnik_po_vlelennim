<script>const BASE="";const DOCNAME="Дочь Бога красок";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0337-S01", "PS-0337--proishozhdenie"], "h": "<p>Дочь Бога красок. Появляется 2025-12-17 (id 399516–399535, окно w0114) не как отдельно задуманный персонаж, а как приписка при перечислении того, кто в мире ещё остался из крупных фигур.</p>\n<p>Слава перечисляет: «Вряд ли у на ещё остался Бог красок» (399516) — и отдельной репликой: «И дочь» (399518). Второй раз она названа так же, следом за отцом: «Ну как бы у нас Бог красок. И дочь. Хотя у Серафима уже понятно цель. Перезапустите человечества» (399530).</p>\n<p>Кроме родства и статуса, ничего не задано. Имени у неё нет — в переписке она только «дочь».</p>", "r": []}, {"t": "Связи с другими", "a": ["S02", "PS-0337-S02", "PS-0337--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Бог красок</strong> — отец. Единственная названная связь. В чём она выражается, действует ли дочь вместе с ним или отдельно, — не сказано.</li>\n<li><strong>Серафим</strong> — назван рядом с ней в том же перечислении как третья фигура. У него, в отличие от неё, цель уже есть: «Перезапустите человечества» (399530). Контраст здесь прямой: цель Серафима «уже понятно», у Бога красок и дочери — нет.</li>\n</ul>\n<p>В том же разговоре, следом, Слава начал разрабатывать окружение Бога красок: «К Богу красок я хотел подставить 4 главных последователя ( как их назвать?) Они будут одарены его благословением и будут чудовищна сильные» (399534). Миколай предложил названия — «триколор / радуга / градиент / монохром» (399541) и способность «хромокей» (399542) у радуги (399543). К дочери эти четверо в переписке никак не привязаны: соотношение её и главных последователей не обсуждалось.</p>", "r": []}, {"t": "Как менялась", "a": ["S03", "PS-0337-S03", "PS-0337--kak-menyalas"], "h": "<p><strong>2025-12-17 (id 399516–399535, окно w0114)</strong> — единственная версия. Она названа в составе группы злодеев: «Ну это уже интересно 3 злодея. Двое из которых это иной уровень сил» (399533). Кто из троих — эти двое «иного уровня сил», в переписке не уточняется.</p>\n<p>Переработок и отклонённых вариантов нет — обсуждение сразу ушло с неё на апостола, которого Слава назначил жертвой (<a href=\"PS-0336.html\">Апостол, ставший чудовищем</a>), и на главных последователей Бога красок.</p>", "r": [["Апостол, ставший чудовищем", "PS-0336.html"]]}, {"t": "Пробелы", "a": ["S04", "PS-0337-S04", "PS-0337--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имени нет.</li>\n<li>Внешность не описана.</li>\n<li>Характер не задан.</li>\n<li>Способностей не названо. Отнесена ли она к тем двоим «иного уровня сил» — из реплики не следует.</li>\n<li>Планов и мотивов нет. Прямо противопоставлена Серафиму, у которого цель есть.</li>\n<li>Не сказано, действует ли она заодно с отцом или самостоятельно.</li>\n<li>Связь с четырьмя главными последователями Бога красок не установлена.</li>\n<li>Кроме факта существования и статуса злодея, ничего не задано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0337--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0336.html\">Апостол, ставший чудовищем</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0337--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-12-17</td>\n<td>399516–399535</td>\n<td>w0114</td>\n<td>Феня (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0337-doch-boga-krasok.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0337--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0337.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
