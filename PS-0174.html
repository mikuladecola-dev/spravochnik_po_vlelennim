<script>const BASE="";const DOCNAME="Маг ветра";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0174-S01", "PS-0174--proishozhdenie"], "h": "<p>Персонаж Славы, появившийся в разговоре о составе команды наёмников (2024-12-23, id 273216). Заявлен словами: «Про команду я не знаю / Пока в голове у меня есть маг ветра который мечник». То есть в момент появления команда ещё не была придумана, а персонаж уже был.</p>\n<p>Раса — человек: «Мой перс человек / И твой эльф ещё сколько надо» (2024-12-23, id 273300). Договорились на четырёх персонажах в команде — «2 моих и 2 твоих» (id 273321).</p>\n<p>Имени персонажу в окне не дали; он проходит как «маг ветра который мечник» и «мой перс».</p>", "r": []}, {"t": "Способности", "a": ["S02", "PS-0174-S02", "PS-0174--sposobnosti"], "h": "<p>Слава сразу разделил заклинания на быстрые и медленные — это разделение задано с первой же версии и позже (2024-12-25) ставится как требование персонажу Миколая.</p>\n<p>Заклинания, которые «он может применить достаточно быстра»:</p>\n<ul>\n<li>ветреной щит — «щит создаёт вокруг ветер из за этого например стрелы изменят свою траекторию»;</li>\n<li>ветренный разрез — «ну здесь понятно»;</li>\n<li>ветренный толчок.</li>\n</ul>\n<p>Заклинания, «который есть но он применяет их медленно»:</p>\n<ul>\n<li>ветреной взрыв — «создаёт шар ветра который может взрываться»;</li>\n<li>ветренная стрела.</li>\n</ul>\n<p>Отдельно названа «магий материализации».</p>\n<p>Уровни владения (2024-12-23, id 273222): «Он хорошо в магии барьеров и в стихийной магии и в магии материализации / На данный момент пытается овладеть магий исцеление». То есть исцеление на момент описания ещё не освоено, персонаж им овладевает.</p>\n<p>При объяснении устройства магии Миколаю Слава разобрал на этом персонаже механику сохранения заклинания в мече (2024-12-23, id 273383): «Например ветренный разрез ( просто запускается ветер виде разреза) и вот он может сохранить эту атаку в самом мече, что очень помогает когда нужно мгновенно использовать заклинание / Но при этом он способен сохранять лишь одну способности». На вопрос Миколая «взмах -&gt; заклинание ?» Слава ответил: «А вот это я не знаю в мой голове он просто по желаний может использовать сохранённую способность». Вывод Славы из этого разбора: «Значит он хорош не только в базовой стихийной но и в его отклонений».</p>\n<h3>Артефакты</h3>\n<p>«Ещё у него два артефакта» (2024-12-23, id 273225):</p>\n<ol>\n<li>Меч, сохраняющий заклинание — «Первый его меч имеет способность сохранить его заклинание и использовать его дистанционно». Ограничение названо отдельно: сохранять он может лишь одну способность.</li>\n<li>Бусы с магией света — «Бусы на руке имеет магию свет для освещения или ослепления врага». Про такие артефакты Слава заметил: «Так он не сам её не использует это артефакт просто светиться и все» (id 273401).</li>\n</ol>", "r": []}, {"t": "Связи с другими", "a": ["S03", "PS-0174-S03", "PS-0174--svyazi-s-drugimi"], "h": "<ul>\n<li>Учитель мага ветра (<a href=\"PS-0175.html\">Учитель мага ветра</a>) — наставник, «который вечно пихает ему задание и посылает на лысый гору». Задания приходят не через доску объявлений: «Ну его учитель просто связывается с ним и выдает задание» (2024-12-23, id 273314–273320). Доска объявлений при этом существует, но она «для обычных наемников». Иногда персонаж находит работу сам: «Ну сам находит где а иногда ему кто говорит, по разному» (id 273337).</li>\n<li>Тёмный эльф (<a href=\"PS-0176.html\">Тёмный эльф</a>) — персонаж Миколая, в той же команде. Миколай правил стихии своего персонажа так, чтобы не пересекаться с магом ветра: «я не читал / значит просто свет и земля» (2024-12-23, id 273372–273373).</li>\n<li>Команда (группа наёмников) — четыре персонажа, по два от автора.</li>\n</ul>", "r": [["Учитель мага ветра", "PS-0175.html"], ["Тёмный эльф", "PS-0176.html"]]}, {"t": "Как менялся — состояния по датам, старое не затирается", "a": ["S04", "PS-0174-S04", "PS-0174--kak-menyalsya"], "h": "<p><strong>2024-12-23, id 273216–273226.</strong> Полное первое описание: быстрые и медленные заклинания, материализация, сильные стороны (барьеры, стихийная, материализация), осваиваемое исцеление, два артефакта. Описание сразу вышло законченным и в дальнейшем не переписывалось.</p>\n<p><strong>2024-12-23, id 273300–273301.</strong> Уточнение: персонаж — человек. Плюс оговорка Славы про команду: «И если что магии наделять всех не надо».</p>\n<p><strong>2024-12-23, id 273313–273322.</strong> Добавлен учитель как источник заданий, названа лысая гора как место, куда тот его посылает.</p>\n<p><strong>2024-12-23, id 273362–273368.</strong> Слава пересылает всё описание заново, поскольку Миколай его не читал («я прпуснил видимо»). Текст повторён дословно, изменений нет.</p>\n<p><strong>2024-12-25, id 274526–274530.</strong> Персонаж используется как мерка баланса при разборе персонажа Миколая: «Ты типо прочти моего перса он не сильный но и не слабый у него нет заклинание который супер супер по типу твоего водяного».</p>", "r": []}, {"t": "Пробелы — чего в переписке нет", "a": ["S05", "PS-0174-S05", "PS-0174--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имени у персонажа в окне нет.</li>\n<li>Внешность, одежда и возраст не описаны — тот список вопросов (оружие, характер, одежда, цель, артефакт, заклинания), который Слава задавал Миколаю, к своему персонажу он не применял.</li>\n<li>Характер не описан.</li>\n<li>Цель персонажа не названа.</li>\n<li>Не сказано, как именно активируется сохранённое в мече заклинание: «А вот это я не знаю в мой голове он просто по желаний может использовать сохранённую способность» — осталось нерешённым.</li>\n<li>Не сказано, чем занята вторая половина заявленной пары «2 моих» — второй персонаж Славы в этом окне не описан.</li>\n<li>Не сказано, при каких условиях и когда он овладеет исцелением.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0174--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0175.html\">Учитель мага ветра</a>, <a href=\"PS-0176.html\">Тёмный эльф</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0175.html\">Учитель мага ветра</a>, <a href=\"PS-0176.html\">Тёмный эльф</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0174--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-12-23</td>\n<td>273216–273226</td>\n<td>w0068</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-23</td>\n<td>273300–273301</td>\n<td>w0068</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-23</td>\n<td>273314–273322</td>\n<td>w0068</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-12-23</td>\n<td>273362–273368</td>\n<td>w0068</td>\n<td>неясно (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2024-12-25</td>\n<td>274526–274530</td>\n<td>w0068</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0174-mag-vetra.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0174--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0174.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
