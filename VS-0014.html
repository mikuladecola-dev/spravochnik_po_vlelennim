<script>const BASE="";const DOCNAME="игра бога";
const LEAD="";
const CH=[{"t": "Зарождение", "a": ["S01", "VS-0014-S01", "VS-0014--zarozhdenie"], "h": "<p>Вселенная объявлена Славой поздним вечером 2024-04-02 (id 153132, окно w0029). Отрезок жизни в базе поставлен с 2024-04-02 по 2024-05-25, основание — «закрытие 153126 «Сносим вселенную» и тут же объявление 153132 — «игра бога»». Файл вселенной (<code>/home/claude/kb/vselennye/[игра бога](VS-0014-igra-boga.md)-igra-boga.md</code>, id <a href=\"VS-0014.html\">игра бога</a>) дважды повторяет служебную оговорку о том, как поставлены границы: «Границы поставлены по объявлению в чате плюс дате, а не по содержанию. Отрезки могут быть несмежными — это нормально.» То есть внутрь отрезка попадает всё, что датировано этим промежутком, независимо от того, относится ли содержание к игре. В шапке того же файла стоит другой диапазон — 2024-03-12 — 2024-05-12 (по датам вложенных сущностей); расхождение с отрезком в материале не объяснено.</p>\n<h3>Что было до</h3>\n<p>Непосредственно перед «игрой бога» шла линия вселенной, у которой собственного имени в чате не было.</p>\n<p><strong>2024-04-01, id 150631</strong> (диапазон 150629–150675) — Слава объявляет отказ от прошлой вселенной: «Построить новую вселенную, прошлая про сверсилы как та уже надоело. Эту вселенную я хочу затолкать зло против добра. Типо вот есть организация которая ловит обнаглевших или совершивший преступлений существ ( при этом эти существа могут работать в этой организации). И вот этих существ я хочу добавить ну много.»</p>\n<p><strong>2024-04-02, id 152594</strong> (диапазон 152590–152605, 19:46) — смена концепции: «Вообще какую концепцию туда вбахать вообще изначально я хотел что была организация которая борется с злом то бишь добро и зло но сейчас думая мне как то не нравится / Лучшей будет создать концепцию scp только вбухать туда и сверхсила типо петли и закона, и экспериментах на людях / И другую расу которая будет нам помогать / Вообще концепция охота на аномалий».</p>\n<p><strong>2024-04-02, id 153126</strong> (диапазон 153120–153132, 21:48) — закрытие: «Сносим вселенную». В хронологии вселенных причина сформулирована так: «Слава сворачивает всю линию вселенной с организацией после того, как Миколай так ничего и не придумал». Дословно:</p>\n<pre><code class=\"language-chat\">[153120] 2024-04-02 21:47 Слава: Кстати что на счёт вселенный придумал что нибудь\n[153121] 2024-04-02 21:47 Слава: Желательно способности\n[153122] 2024-04-02 21:47 Миколай: Ну эмм\n[153123] 2024-04-02 21:47 Миколай: Я пиццу покушал\n[153124] 2024-04-02 21:48 Миколай: И\n[153125] 2024-04-02 21:48 Миколай: Всё\n[153126] 2024-04-02 21:48 Слава: Сносим вселенную\n[153127] 2024-04-02 21:48 Миколай: Вот только закончил\n[153128] 2024-04-02 21:48 Миколай: Аххахах\n[153129] 2024-04-02 21:48 Миколай: Что\n[153130] 2024-04-02 21:48 Миколай: Типо прикол\n[153131] 2024-04-02 21:48 Миколай: Да\n</code></pre>\n<p>Закрытие и объявление «игры бога» идут подряд, в одну минуту (21:48), без паузы между ними: id 153126 — «Сносим вселенную», id 153132 — «Новая и более лёгкая». Из чего выросла «игра бога» — в переписке прямо не сказано. Ни один элемент снесённой линии (организация, петля, закон, помогающая раса, охота на аномалии) в объявлении не упоминается и явным образом не переносится.</p>\n<h3>Объявление (2024-04-02, id 153132–153148, окно w0029)</h3>\n<pre><code class=\"language-chat\">[153132] 2024-04-02 21:48 Слава: Новая и более лёгкая\n[153133] 2024-04-02 21:49 Слава: 20 человек  оказались на какой-то территории и их поделили на 2  группы и т.п\n[153134] 2024-04-02 21:50 Слава: То бишь соревнование и испытания\nТо бишь игра бога\n[153135] 2024-04-02 21:50 Слава: И у всех них есть способности\n[153136] 2024-04-02 21:50 Слава: Хочешь сыграть\n[153137] 2024-04-02 21:50 Слава: ?\n[153138] 2024-04-02 21:50 Миколай: Го\n[153139] 2024-04-02 21:51 Миколай: Моя способность лежать 24 на 7\n[153140] 2024-04-02 21:51 Слава: От тебя 10 человека любых можешь взять из своего окружения и превратить в персонажа желательно\n[153141] 2024-04-02 21:52 Слава: И также их способности что бы подходили под характер ну хотя бы чуть чуть и чтобы не были прям нарушающий баланс\n[153142] 2024-04-02 21:53 Миколай: Оке, собираю команду\n[153145] 2024-04-02 21:55 Слава: Аааа\n[153146] 2024-04-02 21:55 Слава: Так же фотки людей которых ты брал персонажа\n[153147] 2024-04-02 21:55 Слава: Все\n[153148] 2024-04-02 21:55 Миколай: Оке оке\n</code></pre>\n<p>Исходные положения вселенной, в формулировках авторов (2024-04-02, id 153132–153147):</p>\n<ul>\n<li>вселенная объявлена как «Новая и более лёгкая» (153132);</li>\n<li>«20 человек оказались на какой-то территории и их поделили на 2 группы и т.п» (153133);</li>\n<li>«То бишь соревнование и испытания. То бишь игра бога» (153134);</li>\n<li>«И у всех них есть способности» (153135);</li>\n<li>набор персонажей: «От тебя 10 человека любых можешь взять из своего окружения и превратить в персонажа желательно» (153140) — по 10 человек от каждого автора, 20 суммарно;</li>\n<li>ограничение на способности: «И также их способности что бы подходили под характер ну хотя бы чуть чуть и чтобы не были прям нарушающий баланс» (153141);</li>\n<li>отдельное требование к материалу: «Так же фотки людей которых ты брал персонажа» (153146). Фотографий в текстовом архиве нет.</li>\n</ul>\n<p>Реплика Миколая «Моя способность лежать 24 на 7» (153139) ни к какому персонажу в переписке не привязана.</p>\n<p>Территория, на которой оказались 20 человек, в объявлении не названа и не описана: «на какой-то территории». Кто делит участников на группы и кто выступает «богом» игры — в объявлении не сказано.</p>\n<h3>Названия и рабочие обозначения</h3>\n<ul>\n<li><strong>«игра бога»</strong> — единственное имя вселенной. Возникает внутри описания формата, как пояснение: «То бишь соревнование и испытания / То бишь игра бога» (2024-04-02, id 153134). Это же имя закреплено за вселенной в каноническом списке: «объявлена 2024-04-02 (msg 153132) как «более лёгкая» вселенная-игра».</li>\n<li><strong>«Новая и более лёгкая»</strong> (2024-04-02, id 153132) — не имя, а характеристика при объявлении: вселенная противопоставлена только что снесённой линии как более лёгкая.</li>\n<li><strong>«Началась игра бога»</strong> (2024-04-03, id 153456) — то же имя, употреблённое Миколаем уже как название идущей игры.</li>\n</ul>\n<p>Других названий, переименований или синонимов у вселенной нет. По всему корпусу окон сочетание «игра бога» встречается ровно дважды — id 153134 и id 153456. В таблице соответствий имён есть единственная запись «игра бога → игра бога». Во всех остальных окнах отрезка (w0030, w0032, w0033, w0034) вселенная не названа ни разу, и метка «игра бога» проставлена по дате — это помечено в неясностях почти каждой записи.</p>\n<h3>Порядок игры, заданный на следующий день (2024-04-03, окно w0029)</h3>\n<p>Утром 2024-04-03 Слава спрашивает, что делать дальше, и объясняет происхождение идеи (id 153408, 10:57): «Кстати и что дальше вот мы про всех персов рассказам и что дальше ( Я та про игру сказал в полусонном состояния когда спать ложился поэтому не знаю что дальше)». Через несколько минут — запасной вариант (id 153417): «Не пиши / Просто как идея ( можно на друг друга скидывать монстров с характеристиками и способностями, а другая .......) я не знаю чё дальше». Фраза оборвана многоточием и не развёрнута; из неё Миколай позже развернул отдельную идею — рисовать друг друга в виде монстров (Рисовать друг друга в виде монстров <em>(статьи ещё нет — <a href=\"kb/ID-0043-risovat-drug-druga-v-vide-monstrov.html\">исходник</a>)</em>).</p>\n<p>Днём порядок задаёт Миколай (id 153452–153506, 12:30–12:45):</p>\n<pre><code class=\"language-chat\">[153453] Миколай: Крч, ну в общем игра значит\n[153454] Миколай: Мы придумали персов\n[153456] Миколай: Началась игра бога\n[153457] Миколай: Мы должны прописать взаимоотношения в своей команде\n[153458] Миколай: Кто главный кто баласт и т.д\n[153459] Миколай: А потом будут они соревноваться\n[153481] Миколай: Крч будем делать так\n[153482] Миколай: Придумаем турнир какой-нибудь\n[153485] Миколай: Мы идею турнира кидаем нейронке\n[153486] Миколай: А потом прописываем наш ход\n[153488] Миколай: И потом в контексте тура пишем нейронке\n[153489] Миколай: Она сама пропишет исход\n[153491] Миколай: И типо кто и как победит\n[153497] Миколай: А приз, лист Шакоропаля\n[153498] Миколай: По сути это будет макгафин\n[153504] Миколай: Участникам об этом знать не нужно\n</code></pre>\n<p>Порядок: сначала «прописать взаимоотношения в своей команде», «кто главный кто баласт и т.д»; потом «придумаем турнир какой-нибудь», «ну и пропишем идею»; идею турнира «кидаем нейронке», свой ход авторы прописывают в чат, «и потом в контексте тура пишем нейронке», «она сама пропишет исход и действия», «и типо кто и как победит». Отдельно (id 153494–153495): «Так что начинай отношения прописывать пораньше. И я начну». Слава отвечает «Хорошо» (153493).</p>\n<p>Приз — <strong>лист Шакоропаля</strong> (Лист Шакоропаля <em>(статьи ещё нет — <a href=\"kb/ID-0042-list-shakoropalya.html\">исходник</a>)</em>): «А приз, лист Шакоропаля» (153497), «По сути это будет макгафин» (153498), «Только тсс» (153503), «Участникам об этом знать не нужно» (153504). На вопрос Славы «Че за лист» (153499) ответ — «Если интересно погугли» (153500). Что это за лист, в чате не объяснено; в записи Лист Шакоропаля <em>(статьи ещё нет — <a href=\"kb/ID-0042-list-shakoropalya.html\">исходник</a>)</em> помечено, что по замыслу и не должно быть раскрыто.</p>\n<p>Ни отношения внутри команд, ни сам турнир в окне так и не прописаны — это прямо зафиксировано в разделе «Неясности» файла истории <a href=\"IS-0012.html\">Игра бога</a>: «Ни отношения в командах, ни сам турнир в окне так и не прописаны». Ни одного хода, ни одного прогона турнира через нейронку в материале нет.</p>", "r": [["Рисовать друг друга в виде монстров", "kb/ID-0043-risovat-drug-druga-v-vide-monstrov.html"], ["Лист Шакоропаля", "kb/ID-0042-list-shakoropalya.html"], ["Игра бога", "IS-0012.html"]]}, {"t": "Масштаб", "a": ["S02", "VS-0014-S02", "VS-0014--masshtab"], "h": "<p>Отдельных миров как мест во вселенной не перечислено ни одного. Множественности миров, счёта миров, деления вселенной на миры в переписке нет. Три записи, помеченные в базе видом «мир», — не территории, а три разных подхода к устройству вселенной в целом:</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>id</th>\n<th>имя</th>\n<th>даты</th>\n<th>версий</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><a href=\"MR-0006.html\">Организация по отлову существ-преступников</a></td>\n<td>Организация по отлову существ-преступников</td>\n<td>2024-04-01–2024-04-02</td>\n<td>v2</td>\n</tr>\n<tr>\n<td><a href=\"MR-0007.html\">Концепция scp / охота на аномалий</a></td>\n<td>Концепция scp / охота на аномалий</td>\n<td>2024-04-02–2024-04-02</td>\n<td>v1</td>\n</tr>\n<tr>\n<td><a href=\"MR-0008.html\">Герострат</a></td>\n<td>Герострат</td>\n<td>2024-05-07–2024-05-07</td>\n<td>v1</td>\n</tr>\n</tbody>\n</table></div>\n<p>Первые две сменяют друг друга в течение одних суток и обе сносятся вечером 2024-04-02. Третья — нарицательное имя для человека со сверхспособностями, относится к маю. Слово «мир» в этом наборе — служебная пометка вида сущности в базе, а не объект внутри вымысла.</p>\n<h3>Место действия</h3>\n<p>Единственное указание на место — «какая-то территория» из объявления игры (2024-04-02, id 153133): «20 человек оказались на какой-то территории и их поделили на 2 группы и т.п». Территория не описана: ни размера, ни границ, ни ландшафта, ни того, откуда участники на неё попали и кто их поделил. В переписке об этом не сказано.</p>\n<p>Второй слой пространства — обычная Земля с обычной историей. Он появляется позже, в концепции энергии (2024-05-09, id 167303 и 167322): железа «абакра» осталась рудиментом после того, как «атмосфера земли стала комфортнее, а жизненные условия пригоднее для мирной жизни»; действуют учёные, генетика, «множество военных организаций». То есть на май 2024 вселенная — это наш мир с добавленной физиологией сверхспособностей, а не отдельный сеттинг с картой.</p>\n<p>Третий слой — планеты инопланетных рас, но только как места происхождения форм многоликого (окно w0030, 2024-04-06). Лихтспиды «обитают на планете с уникальной атмосферой, в которой постоянно происходят электрические разряды и другие необычные явления» (<a href=\"PS-0057.html\">Лихтспид</a>). Торфолихты «обитают на планете с обширными торфяными болотами, богатыми метаном и другими газами» (<a href=\"PS-0059.html\">Торфолихт</a>). Эти планеты названы только в карточках существ; в устройство вселенной они не встроены, между собой и с «территорией» игры не связаны — в переписке об этом не сказано.</p>\n<h3>Перемещение</h3>\n<p>Перемещения между мирами в переписке нет — как нет и самих миров во множественном числе. Ни портала, ни прохода, ни призыва, ни переноса не описано. Формально близкие вещи, встречающиеся в материале, к межмировому переходу отношения не имеют:</p>\n<ul>\n<li>звуковой телепорт Омниграфа (<a href=\"PS-0068.html\">Омниграф</a>, 2024-05-10): «Омниграф может исчезнуть в одном месте и появиться в другом, словно передаваясь через звуковую волну» — перемещение внутри одной сцены;</li>\n<li>способность Кирилла (<a href=\"PS-0049.html\">Кирилл</a>, 2024-04-03): телепортировать одного человека, которого он видел, только к себе;</li>\n<li>способность Ната Магнова (<a href=\"PS-0043.html\">Нат Магнов</a>, 2024-04-02): создание прохода в секретный подземный бункер;</li>\n<li>«порталы» упоминаются один раз (id 166875, 2024-05-07) внутри текста, который Миколай получил от нейронки как перечень возможных бойцов для отряда («Манипулятор реальности… может создавать иллюзии, порталы, изменять физические законы»). В состав отряда этот вариант не вошёл.</li>\n</ul>\n<p>Собственные имена во вселенной есть только у людей (Герострат как нарицательное), у энергии (лиомат, гелиогормоны), у железы (абакра), у приза (лист Шакоропаля) и у персонажей. Ни один мир именем не назван.</p>\n<h3>Соседство в хронологии вселенных</h3>\n<ul>\n<li>2024-04-01 — 2024-04-02 | вселенная неясна | объявление 150631 — отказ от прошлой вселенной, линия с организацией (добро/зло); 2024-04-02 смена 152594 на scp-концепцию; имени вселенной в чате нет.</li>\n<li>2024-04-02 — 2024-05-25 | <strong>игра бога</strong> | закрытие 153126 «Сносим вселенную» и тут же объявление 153132.</li>\n<li>2024-05-25 — 2024-06-03 | Цветной мир | объявление 173118 (за основу берут концепцию Миколая, систему сил «абакра»), возврат 173216 «Перейдем к нашей», предложение имени «Паладин» (173318, не закреплено), объявление 173342 — принято название «Цветной мир»: «Слава предлагает «Цветной мир», Миколай: «Оооо, идеально»».</li>\n</ul>\n<p>Записи <a href=\"MR-0006.html\">Организация по отлову существ-преступников</a> и <a href=\"MR-0007.html\">Концепция scp / охота на аномалий</a> датами относятся к предыдущему, безымянному отрезку, а во вселенную «игра бога» попали по правилу отнесения по дате; в файле <a href=\"MR-0006.html\">Организация по отлову существ-преступников</a> версия 1 так и помечена — «вселенная: неясно (по дате объявления)». Железа абакра, названная внутри «игры бога», дальше уходит в следующую вселенную и там даёт название всей системе сил (<a href=\"SP-0064.html\">абакра</a>, 2024-05-25, вселенная «Цветной мир»); реплики, объявляющей этот переход, в материале нет.</p>", "r": [["Лихтспид", "PS-0057.html"], ["Торфолихт", "PS-0059.html"], ["Омниграф", "PS-0068.html"], ["Кирилл", "PS-0049.html"], ["Нат Магнов", "PS-0043.html"], ["абакра", "SP-0064.html"], ["Организация по отлову существ-преступников", "MR-0006.html"], ["Концепция scp / охота на аномалий", "MR-0007.html"], ["Герострат", "MR-0008.html"]]}, {"t": "Организации и сообщества", "a": ["S03", "VS-0014-S03", "VS-0014--organizacii-i-soobschestva"], "h": "<p>Орденов, компаний, служб и государств в этой вселенной не придумано. Поименованных организаций здесь ровно две, обе — заготовки первых дней, обе описаны одним-двумя сообщениями и обе сняты. Всё остальное, что похоже на организацию, — боевые отряды и наборы персонажей: две команды игроков, «отряд сильнейших» и ростер из десяти пришельцев. Отдельной строкой стоят «военные организации», упомянутые внутри концепции энергии. Правителей, королей, богов-распорядителей в переписке не названо ни одного.</p>\n<h3>Организация по отлову существ-преступников (<a href=\"MR-0006.html\">Организация по отлову существ-преступников</a>, 2024-04-01 — 2024-04-02, id 150629–150675 и 152590–152605, окно w0029)</h3>\n<p>Варианты имени в базе: «Организация, ловящая обнаглевших существ», «зло против добра», «организация».</p>\n<p>Устройство, как оно заявлено (id 150631): организация ловит существ, которые обнаглели или совершили преступление, и при этом сами существа могут в ней работать. Пример, данный Славой через час, «просто что было легче понимать» (id 150659, 09:43): есть вампиры и оборотни; «вот какой нибудь вампир начал гасить людей, а не питаться мертвыми», и организация обязана его устранить — «вот они посылают человека или вампира или оборотня ну кто есть». Тем самым деление проходит не по видовому признаку, а по поведению; исполнителем может быть и человек, и представитель того же вида.</p>\n<p>Тут же оговорка о статусе заготовки: «Это не та вселенная которой я хочу здесь чисто принцип» (id 150659).</p>\n<p>Реакция Миколая: «Ну, вообще по сути да» / «Но в принципе я чет пон» / «Будет крч время, я покумекаю. А пока уроки, перемены короткие» (id 150632–150637). Разработки с его стороны в окне нет.</p>\n<p>Версия 2 — уже отказ: «изначально я хотел что была организация которая борется с злом то бишь добро и зло но сейчас думая мне как то не нравится» (id 152594, 2024-04-02 19:46).</p>\n<p>Как организация называется, кто ею руководит, на кого работает, сколько в ней людей и существ, где находится — не сказано. Названия у вселенной на тот момент тоже нет; в записи базы помечено: «Название вселенной в чате так и не прозвучало».</p>\n<p>В базе за <a href=\"MR-0006.html\">Организация по отлову существ-преступников</a> проставлены связи: Агенты, берущие силу от животных; Закон; Концепция scp / охота на аномалий; Петля. Запись Поротая (<a href=\"PS-0036.html\">Поротай</a>) ссылается на организацию обратно, но чем эта связь обоснована, в переписке не сказано — обе записи просто идут в одном окне w0029 одного дня.</p>\n<h3>Концепция scp / охота на аномалий (<a href=\"MR-0007.html\">Концепция scp / охота на аномалий</a>, 2024-04-02, id 152590–152605, окно w0029)</h3>\n<p>Варианты имени: «концепция scp», «охота на аномалий». Заявлена одним сообщением (id 152594): «Лучшей будет создать концепцию scp только вбухать туда и сверхсила типо петли и закона, и экспериментах на людях. И другую расу которая будет нам помогать. Вообще концепция охота на аномалий».</p>\n<p>Состав концепции, как он назван: организация в духе scp; сверхсилы, уже существующие у авторов, — петля (<a href=\"SP-0051.html\">Петля</a>) и закон (<a href=\"PS-0031.html\">Закон</a>); эксперименты на людях; «другая раса, которая будет нам помогать»; аномалии как объект охоты.</p>\n<p>Приглашение соавтору внутрь концепции (id 152603, 20:18): «Концепцию та я придумал ну ты можешь туда что нибудь добавить типо объект или вид или способность или т.д». То есть от Миколая ожидаются не правила организации, а её содержимое — объект, вид, способность. Ответ Миколая в этом месте — про режим работы, а не про концепцию (id 152599): «мне прям штурмануть на часика 3 надо мозг, чтобы понимать, что хочу и как… так что ты там уточни несколько моментов, которые я попросил выше и напиши как по срочности, чтобы я ну как-то чувствовал рамочки».</p>\n<p>Ни устройства организации, ни её названия, ни отделов, ни классификации аномалий по образцу scp в переписке нет — названа только рамка. Концепция снесена в тот же вечер: в 21:48 идёт «Сносим вселенную» (id 153126).</p>\n<p><strong>Раса-помощник</strong> (Раса-помощник <em>(статьи ещё нет — <a href=\"kb/ID-0040-rasa-pomoschnik.html\">исходник</a>)</em>, id 152592–152600) — отдельная запись под одну строку из той же реплики: «И другую расу которая будет нам помогать». Кто эта раса, чем помогает и кому именно «нам» — не сказано; никакой разработки не было.</p>\n<p><strong>Агенты, берущие силу от животных</strong> (Агенты, берущие силу от животных <em>(статьи ещё нет — <a href=\"kb/ID-0039-agenty-beruschie-silu-ot-zhivotnyh.html\">исходник</a>)</em>, 2024-04-02, id 151856–151860, 06:58) — заготовка того же дня, в одном перечне с петлёй и законом: «Вообще я хочу туда закидать петлю (то бишь перемотка времени на 10 секунд 10000 раз). Также люди берущий свою силу от животных то бишь агенты среди людей. Также туда можно и закон закидать». Варианты имени в базе: «агенты среди людей», «люди берущие силу от животных». Как именно сила берётся от животного — не сказано. Слово «агенты» здесь единственное, что отсылает к службе; на кого они работают и агентами чего являются, не названо.</p>\n<h3>Военные организации (внутри <a href=\"SP-0059.html\">Лиомат</a> «Лиомат», 2024-05-07 — 2024-05-09, окна w0032–w0033)</h3>\n<p>Единственное место, где во вселенной появляются действующие организации с функцией. По имени они не названы и существуют как класс — «множество военных организаций».</p>\n<p>Первая формулировка — от Славы, сразу после того, как энергия получила имя (id 166922, 2024-05-07 21:29): «Вообще смотри я хочу что бы это энергий была у Геростратов и типо они это энергий используют способности. При этом там будут насильно пробужденый обычный людий которых заставили пробудить данную энергию, при этом самой сверхсилый у них не будет, а только усиленный за счёт этой энергий». Кто заставляет — в этой реплике не сказано.</p>\n<p>Первый сведённый вариант концепции (id 167303, 2024-05-09 12:41): «Однако есть множество военных организаций с безумцами умеющими управлять гормональным фоном и стимулировать выработку гелиогормонов в этой железе и тогда люди могут контролировать способность установленную генетическим кодом клеток».</p>\n<p>Второй вариант того же дня (id 167322, 14:19), с пометкой автора «Некоторые недочёты и пробелы я заполнил»: «Однако есть множество военных организаций где логично птср не редкость проводящих эксперименты над людьми со сверхспособностями».</p>\n<p>Разница между вариантами: в первом организации умеют стимулировать железу и через это дают людям контроль над способностью; во втором они ставят эксперименты над людьми со сверхспособностями, а связка с ПТСР идёт через то, что гелиогормоны запускаются при стимуляции симпатической нервной системы. Какой вариант считается принятым, не решено; реакции Славы на оба текста в окне нет.</p>\n<p>Формулировка «эксперименты над людьми» смыкается с «экспериментах на людях» из scp-концепции 2024-04-02 (<a href=\"MR-0007.html\">Концепция scp / охота на аномалий</a>), но авторы этой связи вслух не делают. Ни числа, ни имён, ни страновой принадлежности, ни отношений между военными организациями нет.</p>\n<h3>Две команды по десять (<a href=\"IS-0012.html\">Игра бога</a>, 2024-04-02 — 2024-04-03, окно w0029)</h3>\n<p>Структура, заданная объявлением: две группы по десять, у каждого автора своя команда, все со способностями, территория не названа, кто их туда поместил и поделил — не сказано.</p>\n<p>Ролевые отношения, названные прямо, — только те, что стоят внутри карточек:</p>\n<ul>\n<li>в команде Миколая: <strong>Нат Магнов</strong> — «Лидер группы»; <strong>Терор Мачилович</strong> — «стратег, казначей»; <strong>Перо Кладович</strong> — «Ну так, чисто кабанчик на побегушках»;</li>\n<li>в команде Славы: <strong>Максим</strong> — «Высокого роста, лидер».</li>\n</ul>\n<p>Больше ролевых отношений не названо, хотя прописать их авторы поставили себе задачей 2024-04-03 («Кто главный кто баласт и т.д»). Ни одного столкновения между командами не описано.</p>\n<p>Состав команд неполон: против десяти карточек Миколая (все за 2024-04-02 23:02, id 153325–153334) в базе только пять карточек Славы (id 153365, 153366, 153368, 153530, 153531). Остальные пять не выложены и не отменены. Заявленные «20 человек» и «2 группы» остались числом из объявления.</p>\n<h3>Отряд сильнейших (<a href=\"PS-0063.html\">Отряд сильнейших</a>, 2024-05-07, id 166473–166897, окно w0032)</h3>\n<p>Самая объёмная запись вселенной по части коллективных единиц. В базе заведена как персонаж, с пометкой в неясностях: «Тип сущности спорный: это коллективная единица (боевой отряд), а не одиночный персонаж, при этом разработка вокруг неё есть». Варианты имени: «команда \"А\"», «отряд». Вселенная в самом окне не названа ни разу.</p>\n<p><strong>Объявление</strong> — тремя сообщениями подряд утром 2024-05-07 (id 166480–166482, 07:28–07:29): «Отряд сильнейших» / «Провидец; бессмертный» / «И за пихая туда кого-нибудь». Больше двоих поимённо в отряде так и не появилось.</p>\n<p>Через двадцать шесть минут Слава разворачивает обоих одним сообщением с пометкой «Для понятности» (id 166507, 07:54):</p>\n<ul>\n<li><strong>Провидец</strong> (Провидец <em>(статьи ещё нет — <a href=\"kb/ID-0050-providec.html\">исходник</a>)</em>): «имеет способность отматывать время но при этом отматывая время превращается в петлю времени где он обязан 10 000 прожить один и тот же промежуток времени ( безумец, ни разу не проигравший в рукопашном бою или в стрельбе)».</li>\n<li><strong>Бессмертный</strong> (<a href=\"IS-0013.html\">Бессмертный</a>): «бессмертный которого может убить лишь сверхчеловек с идеальном контролям, он способен не просто регенерировать повреждённый части, а изменять структуру своего тела или стрелять костями или с помощью плоти создавать разных существ ( на любой дистанции хорош на дальнее и средней он может стрелять костями, создавать костенной сад, или чудовище, а на ближней дистанции неплохо сражаться и использует свой бессмертие на все сто)».</li>\n</ul>\n<p>Кто из двоих сильнее и есть ли между ними старшинство — не сказано. Командира у отряда нет. Кто внутри мира собирает отряд и по чьему приказу — не сказано; на уровне авторов набор ведёт Слава, а Миколай подкидывает кандидатов.</p>\n<p><strong>Условие бессмертия</strong> (id 166753–166757, 15:41–15:43): Миколай приносит фандомную классификацию — «Так какое условие бессмертности?», ссылка на anime-characters-fight.fandom.com, «Тут все возможные условия прописаны. Может у тебя чет отличающиеся». Слава отвечает одним знаком: «4». Что означает тип «4», в чате не расшифровано.</p>\n<p><strong>Кандидаты и отказы</strong> (все в тот же день):</p>\n<ul>\n<li><strong>Несоразмерный</strong> (Несоразмерный <em>(статьи ещё нет — <a href=\"kb/ID-0051-nesorazmernyy.html\">исходник</a>)</em>, id 166501–166505, 07:33) — «Несоразмерный» / «Крч пиздец большой» / «Или меняющий размер по желанию». Прямого ответа в окне нет; в 15:45 Слава пишет: «Не оставляю ( не знаю почему, просто как то не подходит)» (id 166762). В базе помечено, что неясно, относится ли этот отказ именно к Несоразмерному или к другому варианту, обсуждавшемуся вне окна.</li>\n<li><strong>Призрак</strong> (<a href=\"PS-0064.html\">Призрак</a>, <a href=\"SP-0057.html\">Локальное управление осязанием</a>, id 166764–166782, 15:49) — «Есть идея о призраке. И способность его будет: локальное управление осязания. Ну тобиж он может проходить сквозь всё, и может контролировать какая часть его тела будет доступна для прикосновения. Даже если это маленькие участки или участки внутри тела», плюс «мощное боевое искусство». Пример применения: «например может сделать иглы из костей осязаемыми и ими зарезать других». Слабое место назвал сам автор: «Ну и логично как его победить, просто атаковать осязаемую часть тела». Слава сначала отвечает «Да» на вопрос «Норм?» (166770–166771), через час: «Но все это как то не то» и «Не ну призрак можно ещё куда нибудь запихать» (166776–166779). Миколай: «Ну бля, я под эту идею его и создавал 😅. Ладненько придумаю ещё что-нибудь». Куда «запихать» призрака, не решено.</li>\n<li><strong>Логос номос</strong> (<a href=\"SP-0058.html\">Логос номос</a>, id 166816–166827, 19:51) — «чел слова которого имеют вес, ну тобиж как чел из магичеки говорящий морепродуктами. Например скажет умри и чел умрёт, скажет дереву вырасти и оно вырастет. Ну а ограничение попробуй сам придумать интересное», расшифровка тут же: «Это \"слово - закон\" по гречески если что». Слава: «Ну чёт я хотел более новой». Миколай защищает: «Но можно условия добавить», «Особенные», «И ограничения новые», «И тогда сойдёт за новую», «А то ты не первый о бессмертии заговорил». Итог: «Ну можно, ну ты ещё чего-нибудь подкинь». Ограничение так и не придумано.</li>\n<li><strong>Божественные способности, 3 основные</strong> (Божественные способности (3 основные) <em>(статьи ещё нет — <a href=\"kb/ID-0052-bozhestvennye-sposobnosti-3-osnovnye.html\">исходник</a>)</em>, id 166828–166840) — «Вщ есть божественные способности», «3 основные», «Дать статьи?»; «Вот, ими крч бог обладает, а раз эти челики будут сильнейшие значит будут близки к Богу», «Ну бог это образно. Просто сильнейшее существо». Слава: «Нет и так ясно». Сами три способности не названы.</li>\n<li><strong>Способность получать силы съеденного</strong> (Способность получать силы съеденного <em>(статьи ещё нет — <a href=\"kb/ID-0053-sposobnost-poluchat-sily-sedennogo.html\">исходник</a>)</em>, id 166841–166844) — «Бля, просто подкину идею, я её из онгоинга про монстра спиздил. Чел получает способности того кого / чего хавает», «Потом с этим работать можно». Ответа Славы нет.</li>\n</ul>\n<p><strong>Рамка, заданная Славой</strong> (id 166837–166838, 19:57–19:58): «Ну представь военный отряд которым ещё врагов надо придумывать поэтому через чур инбаласный не надо ( ну или надо только с ограничением )»; «Их типо считают сильнейшими но будут и другие отряд равный им по силе». Ответ Миколая: «Оке пон, мери сьюшек не делать. Учту». Здесь впервые сказано, что отряд не один; ни один из равных отрядов не назван и не описан.</p>\n<p><strong>Переопределение названия</strong> (id 166852–166864, 20:48–20:51). Миколай упирается в само слово: «А с хуяли они сильнейшее», «Типа почему так называется отряд», «Кто его так назвал», «Почему они сильнейшие если у них есть равные», «Чисто на выебонах назвались?». Слава: «Ну сильнейший бойцы типо военных». Миколай: «Ну так есть ещё бойцы которые на равне. Тоже отряд». Слава уступает: «Ладно ладно», «Не сильнейший», <strong>«Ну просто отряд довольно сильных людей с которыми способный справляться единицы»</strong> (id 166863). Это итоговое определение отряда.</p>\n<p><strong>Команда «А» и отряд «Х»</strong> (id 166867–166893, 21:02–21:14). Миколай признаётся: «Бля. Я зависимый. Ну и поху. Главное что задача решается. Я не сдержался», «И в нейронку кинул идею», «Жеско проработал». Дальше в чат идут машинные тексты; названия «команда \"А\"» и «отряд \"Х\"» — из них, а не из авторской речи:</p>\n<ol>\n<li>четыре предложения на добор состава (166875): Манипулятор реальности (искажать и перестраивать реальность, иллюзии, порталы, изменение физических законов); Телепат-эмпат; Хрономанипулятор; Трансформер. Комментарий Миколая: «Тут скорее подойдёт термин метаморф» (166876), ответ Славы: «Ну у меня есть персонаж имитатор» (166879);</li>\n<li>разбор команды «А» (166884): два бойца названы «крайне мощным и доминирующим подразделением», вывод — чтобы справиться, нужен «действительно исключительный противник, обладающий сверхчеловеческими способностями и идеальным контролем». Миколай: «Ну те которых ты выбрал по мнению нейронки подходят»;</li>\n<li>смоделированный бой против <strong>отряда «Х»</strong> (166889) в составе Телекинетик, Криокинетик, Пирокинетик, Электрокинетик — отряд «Х» занимает оборону, ставит ледяные ловушки, силовые барьеры и электрические сети, команда «А» побеждает. Это единственная в материале вторая боевая группа, и она целиком машинная: авторы её не заявляли и потом к ней не возвращались;</li>\n<li>смоделированный бой команды «А» против одного Сверхчеловека с идеальным контролем (166893) — Сверхчеловек побеждает.</li>\n</ol>\n<p>Вывод дня, ради которого, судя по тексту, весь разговор и шёл (id 166880): «А так там особой идей нету но зато я понял что просто кидать сильных персонажей в один отряд глупо тем более если их ний силы друг другу не подходят». И следом: «Тока я никак в голове приставить не могу их ний командный работу или битву» (166887), «Не я про то что не могу приставать командную работу против одного бойца» (166890).</p>\n<p>Ответ Миколая — про способ, а не про мир (166891): «Вообще, Шекспир великий драматург не чурался подглядывать чужие работы, современные авторы пиздят идеи у Шекспира. А изначально все пиздили из летописей и реального мира. В общем ты и не представишь ничего, то что ты хочешь надо подглядеть в имеющихся реализованных ситуациях». И затем (166895): «В общем. Тогда надо попробовать через время ещё раз представить. Возможно ты решишь полностью отряд переформировать если считаешь что они сейчас не совместимы». Переформирования в материале нет; после 2024-05-09 отряд в переписке не упоминается.</p>\n<p><strong>Где двое бойцов оказались потом.</strong> Провидец и Бессмертный ушли во вселенную «Апостол» и там разошлись по разным разделам каталога. В сводном списке Славы от 2025-01-28 (id 285522, окно w0073) Провидец стоит в разделе «Сторонний силы», а Бессмертный числится среди Благословенных под именем «Бессмертный выродок». Самого отряда в этом списке нет. Миколай переспрашивает: «и провидец?» (285539–285540) — по сути ответа в окне нет.</p>\n<h3>Ростер из десяти пришельцев (2024-04-06 — 2024-05-11, окна w0030, w0033, w0034)</h3>\n<p>Формально это не организация, а набор форм одного персонажа — многоликого (<a href=\"PS-0052.html\">многоликий</a>), но собирается он как команда и обсуждается как команда. Подробный состав и критерии отбора — в разделе «Население и классы».</p>\n<p>Обращает на себя внимание местоимение в обсуждении десятого участника (id 167926, 2024-05-11 12:03): «Вообще у нас нету не кого с исцеляющий абилкой» — состав здесь обсуждается как команда, а не как набор форм одного носителя. Прямо этот вопрос в переписке не проговаривается. Связь ростера 1–10 (<a href=\"PS-0066.html\">Пришельцы (ростер 1–6)</a>, 2024-05-10) с многоликим (<a href=\"PS-0052.html\">многоликий</a>, 2024-04-06) в переписке не заявлена: записи друг на друга не ссылаются, совпадают только число (10) и характер («личные пришельцы»).</p>\n<h3>Сводка отношений, названных в переписке</h3>\n<ul>\n<li><strong>Организация по отлову существ-преступников ↔ существа</strong>: организация ловит и устраняет тех, кто «обнаглел» или совершил преступление; те же существа могут в ней работать; на устранение посылают «человека или вампира или оборотня ну кто есть». Это единственное описанное в материале отношение «организация — её люди».</li>\n<li><strong>Организация по отлову ↔ scp-концепция</strong>: вторая заменила первую вечером 2024-04-02 по прямому заявлению Славы. Отношение замены, а не сосуществования.</li>\n<li><strong>Военные организации ↔ Геростраты и насильно пробуждённые</strong>: организации умеют стимулировать выработку гелиогормонов в абакре (вариант 1) и ставят эксперименты над людьми со сверхспособностями (вариант 2). Насильно пробуждённые сверхсилы не имеют, только усиление за счёт энергии; кто именно их пробуждает, вслух не связано с военными организациями.</li>\n<li><strong>Команда Миколая ↔ команда Славы</strong>: две группы по десять, соревнование и испытания, приз — лист Шакоропаля.</li>\n<li><strong>Отряд сильнейших ↔ другие отряды</strong>: «Их типо считают сильнейшими но будут и другие отряд равный им по силе».</li>\n<li><strong>Отряд сильнейших ↔ Сверхчеловек с идеальным контролем</strong>: тот, кто единственный может убить Бессмертного, и, по машинному сценарию, побеждает обоих бойцов.</li>\n<li><strong>Внутри отряда</strong>: иерархии нет, командира нет, соотношение сил между Провидцем и Бессмертным не установлено.</li>\n<li><strong>Поротаи</strong>: низший «теряешь личностей и слушаещя высшего Поротая», у высшего среди способностей — «контроль над низшими». Это единственное отношение подчинения, прописанное прямо.</li>\n<li><strong>Ростер пришельцев</strong>: отношения между формами не описаны; единственное соображение о составе — «у нас нету не кого с исцеляющий абилкой».</li>\n</ul>\n<div class=\"mnote\"><b>⚙ машинная заметка · С чего начать — не материал авторов</b>\n<p>Провидец в базе есть, но разъехался по трём соседним записям, и все три жирные: <code>PS-0063</code> «Отряд сильнейших» (29 087), <code>IS-0013</code> «Бессмертный» (44 010), <code>SP-0059</code> «Лиомат» (18 344). Всё из двух окон — w0032 (2024-05-07, id 166473–166897) и w0033 (2024-05-09, id 167303–167343). Сшивать надо оттуда. Важная оговорка: развёрнутая механика петли на 10 000 циклов в w0033 — машинный текст с обращением на «вы», авторской формулировки там нет. Значит, если она вообще была, она в архиве раньше 2024-05-07 или в голосовых.</p></div>", "r": [["Раса-помощник", "kb/ID-0040-rasa-pomoschnik.html"], ["берущие силу от животных", "kb/ID-0039-agenty-beruschie-silu-ot-zhivotnyh.html"], ["Провидец", "kb/ID-0050-providec.html"], ["Несоразмерный", "kb/ID-0051-nesorazmernyy.html"], ["Божественные способности (3 основные)", "kb/ID-0052-bozhestvennye-sposobnosti-3-osnovnye.html"], ["Способность получать силы съеденного", "kb/ID-0053-sposobnost-poluchat-sily-sedennogo.html"], ["Поротай", "PS-0036.html"], ["Закон", "PS-0031.html"], ["Отряд сильнейших", "PS-0063.html"], ["Призрак", "PS-0064.html"], ["многоликий", "PS-0052.html"], ["Пришельцы (ростер 1–6)", "PS-0066.html"], ["Петля", "SP-0051.html"], ["Лиомат", "SP-0059.html"], ["Локальное управление осязанием", "SP-0057.html"], ["Логос номос", "SP-0058.html"], ["Организация по отлову существ-преступников", "MR-0006.html"], ["Концепция scp / охота на аномалий", "MR-0007.html"], ["Игра бога", "IS-0012.html"], ["Бессмертный", "IS-0013.html"]]}, {"t": "Население и классы", "a": ["S04", "VS-0014-S04", "VS-0014--naselenie-i-klassy"], "h": "<h3>Двадцать человек: команда Миколая</h3>\n<p>Десять карточек выложены подряд, одним заходом, в тот же вечер, когда игра была объявлена (2024-04-02, id 153325–153334, 23:02). Формат карточки: имя, короткая характеристика с возрастом, способность.</p>\n<ol>\n<li><strong>Дядон Гомбевский</strong> (<a href=\"PS-0037.html\">Дядон Гомбевский</a>, id 153325) — «Среднего роста и крупного телосложения мужчина 45 лет». Две способности: «превращать руки в медвежьи и направлять туды всю массу» и «невидимость если слышит больше 3 голосов».</li>\n<li><strong>Ояш Бичевский</strong> (<a href=\"PS-0038.html\">Ояш Бичевский</a>, id 153326) — «Обычный тихий, пожилой 54 года, общительный». Способность: «Чем слабее удар, тем больше урона, вреда тому что/кого он ударил».</li>\n<li><strong>Адам Тихой</strong> (<a href=\"PS-0039.html\">Адам Тихой</a>, id 153327) — «Неуравновешенный но талантливый мужчина лет 25». Способность: «За каждый ответ на его подъебку тот кто ответил получает адскую головную боль».</li>\n<li><strong>Нерадио Попов</strong> (<a href=\"PS-0040.html\">Нерадио Попов</a>, id 153328) — «Слабый по здоровью человек, наркоман и нарко диллер, любит шутки о суициде говоря о том что не достоин жить делая те ужасы которые может, пытается казаться сильным и крутым 20 годиков». Способность: «при прикосновении поглощает душу, в месяц одна. Если раз коснётся за 1 месяц, то добытая душа уйдёт, если 3 раз то его уже душа уйдёт. Души можно добавлять в наркотики и всякий кто их употребит на 20 минут будет во власти души хранящейся в наркотике. Если отдал душу наркоте, то смерть будет уже от 2 прикосновения, а не 3».</li>\n<li><strong>Пил Пончик</strong> (<a href=\"PS-0041.html\">Пил Пончик</a>, id 153329) — «Максимально серьёзный, но выходки делает смешные, 16 лет». Способность: «кто услышит его игру на гитаре перестаёт двигаться».</li>\n<li><strong>Войс Патина</strong> (<a href=\"PS-0042.html\">Войс Патина</a>, id 153330) — «Делает всё и во всём успевает, со всеми могёт и короче летает, 33 года». Отдельной строки со способностью в карточке нет; в записи помечено как неясность — входит ли «летает» в характер или это и есть сила.</li>\n<li><strong>Нат Магнов</strong> (<a href=\"PS-0043.html\">Нат Магнов</a>, id 153331) — «Лидер группы, хороший оратор с широким спектром знаний, 28 лет». Способность: «создание прохода в секретный подземный бункер».</li>\n<li><strong>Терор Мачилович</strong> (<a href=\"PS-0044.html\">Терор Мачилович</a>, id 153332) — «Спокойный и уравновешенный стратег, казначей, 30 лет». Способность: «для самого себя делать людей или предметы не существующими».</li>\n<li><strong>Каваи Навалов</strong> (<a href=\"PS-0045.html\">Каваи Навалов</a>, id 153333) — «Для него все конкуренты или ступени для возвышения по лестнице успеха, 28 лет». Способность: «слова буквально имеют вес, чем больше говорит, тем тяжелее удары».</li>\n<li><strong>Перо Кладович</strong> (<a href=\"PS-0046.html\">Перо Кладович</a>, id 153334) — «Ну так, чисто кабанчик на побегушках, 698 лет». Способность: «копия способностей и использование 1 раз без людей, потом чтобы снова использовать надо увидеть в реальности этого человека и повторить процесс». Формулировка «использование 1 раз без людей» помечена в базе как неоднозначная.</li>\n</ol>\n<p>Возраст в этой десятке разбросан от 16 до 698 лет; кто такой 698-летний в мире, где остальные — обычные люди из окружения автора, в переписке не объясняется.</p>\n<h3>Двадцать человек: персонажи Славы</h3>\n<p>Выложены не одним блоком, а в два приёма 2024-04-03: три утром (05:45–06:54) и две днём (13:56–13:59).</p>\n<ol>\n<li><strong>Аполлон</strong> (<a href=\"PS-0047.html\">Аполлон</a>, id 153365) — «Мужчина 34 лет общительный, крупного телосложения». Способность: «мастер на все руки ( мастер любого оружия, боевые искусства, механик, электрик, то бишь мастер любого физического труда )».</li>\n<li><strong>Максим</strong> (<a href=\"PS-0048.html\">Максим</a>, id 153366) — «Высокого роста, лидер». Способность: «власть ( любой кто находится в 70 м должен подчиняться любому закону сказанная Максимам, минус в том что Максиму тоже надо подчиняться закону )».</li>\n<li><strong>Кирилл</strong> (<a href=\"PS-0049.html\">Кирилл</a>, id 153368) — «Спокойный, тихий. Спортивный». Способность: «телепортировать 1 человека, которого он видел он способен телепортировать его только рядом собой. То бишь он может призвать врага или наоборот если его окружат будет способен телепортировать друга».</li>\n<li><strong>Дима</strong> (<a href=\"PS-0050.html\">Дима</a>, id 153530) — «Разговорчивый, приставучий». Способность: «кровавая палец ( может стрелять кровью из пальца 3 раза максимум)».</li>\n<li><strong>Саша</strong> (<a href=\"PS-0051.html\">Саша</a>, id 153531) — «Умный, разговорчивый». Способность: «деление( может делить объекты на равный части только неоудешевленный предметы, чем большой объект делить чем больше устаешь)».</li>\n</ol>\n<p>Остальных пяти персонажей Славы в материале нет — ни отказа от них, ни объяснения.</p>\n<p>Способность Максима «власть» — та же механика, что и отдельно существующая способность «Закон» (<a href=\"PS-0031.html\">Закон</a>, с 2024-03-12, до объявления вселенной). Связь «Закон → Максим» в переписке прямо не проговорена; в базе она помечена как предположительная («возможно, из этой заготовки позже вырос персонаж Максим»).</p>\n<p>Четверо из пяти персонажей Славы позже ушли в другие вселенные: Максим — в «Апостол» и «Нимб», Дима — в «Апостол», Саша — в «Нимб», Кирилл — в «монстры». Связи этих поздних версий с «игрой бога» в переписке не проводится; из игры бога у них берётся только имя.</p>\n<h3>Пристав (<a href=\"PS-0060.html\">пристав</a>, 2024-04-05 — 2024-04-06, id 154291–154338, окно w0030)</h3>\n<p>Заявка Славы одной строкой (2024-04-05, id 154291): «Вот пристав богатый наглый высокомерный. И какая у него должна быть способность».</p>\n<p>Ответ Миколая (2024-04-06, id 154298) — единственный в материале случай, когда способность выводится из социального положения. Он сам помечает: «Попробовал провести анализ. А то не особо умею я способности давать кому-то учитывая критерии». Разбор целиком его, не нейронки: «Ну есть 2 варианта его богатства: 1. Он сам всё заработал. 2. Он мажор и деньги ему легко достались и были с рождения».</p>\n<p>Первый тип: «причина наглости в том, что он идёт по головам чтобы сохранить своё состояние и расширить его, у него есть свои принципы и убеждения, которые он ни за, что не нарушит и не позволит другим. Ещё он высокомерный и как я понял причина в его приобретённых филках и статусе, он горд тем что смог добиться этого положения. Он может себе позволить подобное поведение, ибо не переживает за последствия а значит он чувствует себя под защитой либо денег, либо способности, но пускай будет всё сразу. Лучшая защита это нападение, может тогда его способность будет ну допустим делать человека банкротом по желанию (я хотел написать убивать по желанию😅) и он уже давно обнародовал эту способность, о ней все знают и боятся этого». Эта способность вынесена отдельной записью (банкротство по желанию <em>(статьи ещё нет — <a href=\"kb/ID-0046-bankrotstvo-po-zhelaniyu.html\">исходник</a>)</em>); существенная деталь механики — она работает не скрытно, а публично.</p>\n<p>Второй тип: «с другим типом богатства способность точно не придаёт ему этих фич, поэтому мож быть совершенно любая, ну пускай будет передача мыслей кому хочет или реген мгновенный, от гематом и других садин небольших». То есть у унаследованного богатства связь «характер ↔ способность» разрывается.</p>\n<p>Решение Славы (id 154331) не использует ни один из вариантов: «этот персонаж будет иметь способность окаменения (то бишь усиливать себя и повышать защиту) и заражения (то бишь заражать окаменением и контролировать их) но дальше по сюжету я хочу дать ему ещё способность не обязательно что бы она сочеталось с окаменением». Третья способность так и не названа.</p>\n<p>Слово «пристав» — единственная в материале отсылка к должности при государстве, и как должность оно не разворачивается: ни суда, ни службы, ни того, чьим приставом он является, в переписке нет. В базе помечено: «неясно, из той ли он серии персонажей, что шла в w0029», то есть входит ли он в двадцатку.</p>\n<h3>Герострат и разряды носителей энергии</h3>\n<p><strong>Герострат</strong> (<a href=\"MR-0008.html\">Герострат</a>, 2024-05-07, id 166905–166922, окно w0032) — нарицательное имя для человека со сверхспособностями. Родилось из прямого запроса Славы (166898–166900): «Кстати а какой можно дать другой название сверхчеловека… Ну или сверх способностям… Типо я много думал ну не придумал». Миколай уточняет критерий: «Тебе обязательно нужна логика. Или главное чтоб звучало прикольно?» — Слава: «Звучала прикольная». Итог (166908–166909): «Тогда чел со сверх способностями это Герострат», «Похуй на изначальную коннотацию имени, это будет нарицательное для человека со способностями».</p>\n<p>Это единственный класс, для которого есть собственное имя-нарицательное. Ни для не-Геростратов, ни для насильно пробуждённых отдельного слова в переписке не появилось.</p>\n<p>Разряды, заявленные Славой в постановке задачи по энергии (id 166922):</p>\n<ol>\n<li><strong>Геростраты</strong> — есть энергия и есть сверхспособность, которая через эту энергию и работает;</li>\n<li><strong>насильно пробуждённые обычные люди</strong> — «которых заставили пробудить данную энергию, при этом самой сверхсилый у них не будет, а только усиленный за счёт этой энергий»;</li>\n<li><strong>все остальные</strong> — по умолчанию; у них железа абакра тоже есть, но она рудимент и гелиогормоны в ней не вырабатываются.</li>\n</ol>\n<p>Разряд «насильно пробуждённые» после 166922 отдельно не разрабатывается: во втором сведённом варианте текста они не упомянуты. Совместим ли механизм «И нужен особой препараты» (166951) с механизмом околоПТСР-стимуляции (167322), в переписке не сказано.</p>\n<p>Что из концепции лиомата следует для устройства населения, по прямо сказанному:</p>\n<ul>\n<li>железа абакра есть у всех людей, а не только у Геростратов;</li>\n<li>способность задана генетическим кодом клеток от рождения, но без лиомата не работает;</li>\n<li>генкод «после 30 лет полностью исчезают без использования» — то есть класс пополняется только за счёт тех, кого успели пробудить до этого возраста;</li>\n<li>какая именно будет способность, зависит от того, что человек ел, «в том числе в контексте информации», и о чём мечтал до 5 лет.</li>\n</ul>\n<p><strong>Мифологические боги как бывшие Геростраты</strong> (Мифы как летописи людей с активной абакрой <em>(статьи ещё нет — <a href=\"kb/ID-0056-mify-kak-letopisi-lyudey-s-aktivnoy-abakroy.html\">исходник</a>)</em>, 2024-05-10, id 167791–167801) — финальная мысль окна, брошенная Миколаем поздно вечером с пометкой «Бля идея пришла, похуй что заезженная, но интересная»: «Я же говорил что абакра раньше норм работала а теперь рудимент. Так вот. Есть же мифы о богах греческих или скандинавских. Это летописи о людях с активной абакрой. Тобиж это не боги, а люди со сверхспособностями». Реакции соавтора в окне нет.</p>\n<p><strong>Сверхчеловек с идеальным контролем</strong> (<a href=\"PS-0065.html\">Сверхчеловек с идеальным контролем</a>, 2024-05-07) возник не как персонаж, а как ограничение: единственное, что может убить Бессмертного (166507). Слава просил придумать его отдельно: «Ну все равно скидывай идей сверхчеловека» (166896), Миколай ответил «Хорошо» — и разговор тут же ушёл на поиск названия, из которого вышел «Герострат». Сам персонаж в окне так и не придуман.</p>\n<p><strong>Имитатор</strong> (<a href=\"PS-0383.html\">Имитатор</a>) во вселенной только упомянут: «Ну у меня есть персонаж имитатор» (166879), плюс «А так там особой идей нету». Описания здесь нет; вся механика имитации разработана в других вселенных.</p>\n<h3>Поротай (<a href=\"PS-0036.html\">Поротай</a>, 2024-04-02, id 152572–152606, окно w0029)</h3>\n<p>Вид, который получается из человека. Первое и полное описание (id 152575, 18:42), дословно:</p>\n<div class=\"q\"><p>Придумал один вид Поротай. Короче есть жуг ты его съедаеш и у тебя 3 варианта<br>1) смерть, все твои внутренности превращаются в камень и отказывают<br>2) превращаются в низший Поротай (горбатого двух лицого, полукаменного-полуплоти, и ты теряешь личностей и слушаещя высшего Поротая) способности крепкость, реген, сверхсила<br>3) превращается высшего Поротая сохраняешь свой человеческий образ и личность. Способности реген, контроль над низшими, превращать части тела в твердый камень, сверхчеловеческая сила<br>Дебафф у тебя появляется вторая личность жестокая, кровожадная, алочная и т.д. И она составляет чаще всего становится жестоким кровожадным и т.д</p></div>\n<p>Устройство вида: вход — поедание жуга (<a href=\"SP-0052.html\">Жуг</a>); три исхода, вероятности не названы; низший — горбатый, двуликий, полукаменный-полуплотяной, без личности, подчиняется высшему; высший — сохраняет человеческий образ и личность, но получает вторую личность, которая «чаще всего» берёт верх. Личность работает как разделительный признак: низший её теряет полностью, высший сохраняет свою.</p>\n<p>Сразу после выкладки Слава спросил: «Какую ещё способность добавить к выше Поротаем» (152576). Миколай ответил отказом (152599): «Ты точно чет хочешь добавить у Поротая как по мне и так много способностей, а концепцию ты придумал, в чем вопрос не пон». Мотив Славы (152603): «Поротая низший владеет почти идентичными способностями Поротая высшего вот поэтому я думал может ещё че добавить». Дополнительной способности высшему в «игре бога» так и не добавлено.</p>\n<p>К «игре бога» относятся версии 1 и 2 (2024-04-02); остальные версии — переносы того же описания в другие вселенные («Новый мир», «вне вселенной», Оам), в том числе повтор 2024-06-03 (id 175808–175813), когда Слава пересылает карточку заново, потому что Миколай её не помнит, и 2025-03-26 (id 311278–311281). В базе отмечено, что вид придуман ровно в тот момент, когда концепция вселенной менялась.</p>\n<h3>Пришельцы: формы одного человека или отдельные расы</h3>\n<p>Основной массив нечеловеческого населения появился не как население, а как набор форм для одного персонажа — <strong>многоликого</strong> (<a href=\"PS-0052.html\">многоликий</a>, 2024-04-06 — 2024-04-07, id 154384–154678).</p>\n<p>Заявка Славы (id 154386, 15:51): «Новый перс многоликий ( способности перевоплощаться в 10 разных существ) то бишь Бен 10. Ну я хочу личных 10 пришельцев вот только в голову вообще ничего не прилетает точней прилетает но этой чисто пришельцы беная а я хочу личных. Не подкинишь идей?» Миколай: «О, это я могу».</p>\n<p>Правила отбора, названные Славой по ходу:</p>\n<ul>\n<li>«Ну я хочу что бы большей половины были гуманноидыми» (154390);</li>\n<li>характер носителя: «Кратко типо Бен 10 только более взрослый характер (но также игривый, издевательский, недотёпа в некоторых местах, с юмором)» (154422);</li>\n<li>«Но что бы паразитировать на ком то для него слишком жёстко» (154423) — этим отклонён Витрофунгус;</li>\n<li>«Ну по сути я не хотел повторяться. Там же у нас уже есть качок. Может сейчас кого с дальний атакой. Ну или элемент то бишь огонь молния» (154434–154436) — этим отклонён Бабуинохвост.</li>\n</ul>\n<p>Главное различение, выведенное авторами явно, — форма против расы. О Витрофунгусе (<a href=\"PS-0056.html\">Витрофунгус</a>, гуманоид с грибницей вместо кожи и стеклянными костями, питается паразитируя): «Ну как отдельный персонаж крутой. А как часть способности человека, как та не подходит» (154418). Итоговая ревизия (2024-04-07, id 154664–154667): из восьми предложенных одобрены три — «быстрый с узорами молний» (Лихтспид, <a href=\"PS-0057.html\">Лихтспид</a>), «бык или козел» (Тардибовин, <a href=\"PS-0054.html\">Тардибовин</a>) и «лягуха с крыльями» (Сордекваксус, <a href=\"PS-0055.html\">Сордекваксус</a>); про остальных Слава говорит: «Ну мне тоже ну там чисто как отдельный виды расы а не часть челика».</p>\n<p>Тем самым в материале существуют две категории нечеловеческих существ, различённые самими авторами: годные как форма многоликого и годные только как отдельный вид. Витрофунгус, Бабуинохвост, Керагуар (<a href=\"PS-0058.html\">Керагуар</a>), Торфолихт (<a href=\"PS-0059.html\">Торфолихт</a>), змей из цепи (<a href=\"PS-0053.html\">змей из цепи</a>) отнесены во вторую категорию — но что эти расы делают во вселенной, где живут и как соотносятся с людьми, в переписке не сказано. Змей из цепи одобрен Славой, но карточки и имени у него так и не появилось.</p>\n<p><strong>Тардибовин</strong> (<a href=\"PS-0054.html\">Тардибовин</a>, 2024-04-06 — 2024-04-07, id 154392–154679) — единственная запись во всём материале «игры бога», написанная в форме описания расы, а не персонажа. Способ сборки назван прямо (154396): «Я придумал кого скрестить, нейронка дала четкое описание по заданию»; скрещены тихоходка и вол/бык — «Тардибовин (от лат. Tardigrade - тихоходка, bovine - бычий)». Карточка: «Тардибовины - раса пришельцев ростом около 1.5 метров с крепким телосложением, напоминающим миниатюрную версию вола или быка»; толстая морщинистая серо-коричневая кожа, два небольших рога, загнутых назад, антропоморфные черты лица; массивные конечности, передвижение на двух ногах, две руки с 4 пальцами, включая противопоставленный большой; неторопливые движения. Способности: невероятная выносливость (экстремальные температуры, радиация, обезвоживание), анабиоз с понижением метаболизма почти до нуля, огромная физическая сила, телепатическое общение, смена плотности тела, регенерация на клеточном уровне. Правки Славы (154397): «Все понравилась кроме внешкий и телепатией» — телепатия вычеркнута («Оке, телепатию заборт»), внешность отправлена на переделку. Смещение акцента на следующий день (154668–154678): «Вообще прикол быка не в силе, а выносливости, он может выдержать экстремальные условия, большой холод или наоборот мощное пламя, или даже атомный взрыв»; «Такие способности ему достались от скрещивания с тихоходкой»; ловкость Миколай отклоняет — «Ну думаю он не про ловкость. Он как танк будет скорее. Маленький но танк. А вот силу да, силу можно». Не сказано прямо, он ли тот «наш качок»/«силач» из соседних реплик окна.</p>\n<p><strong>Ростер 1–10.</strong> Через месяц набор пересобран как нумерованный список. Согласованная шестёрка (<a href=\"PS-0066.html\">Пришельцы (ростер 1–6)</a>, 2024-05-10, id 167448–167450, 08:40–08:43), выложенная Славой одним сообщением как повтор ранее придуманного:</p>\n<div class=\"q\"><p>1 козел сильный физический выносливый и дохуя живучий<br>2 молния типо Флэша с контролем электричества и взрывом атомов<br>3 летающий с щупальцами из плеч<br>4 шарик бессмертие, не осязаемость не прибиваемость, мгновенное восстановление, также 0 атака но 100 защита<br>5 кольцо, может делать кольцо из спины который могут стрелять взрываться ликвидировать, изменять форму</p></div>\n<p>И шестой (167449): «6 образ не смог приставить. Но способности контроль разума, иллюзия, может залезть в голову видит чужие воспоминания. Запихай в нейронку для картинок. Он должен быть жутким страшными». Затем: «И надо ещё 4 пришельца» (167450). Разработки первых шести в соседних окнах нет; номера 4 и 5 нигде отдельно не разрабатывались. Соответствие номеров 1–3 апрельской тройке в переписке не проговорено.</p>\n<p>Первый добор, предложение Миколая (id 167451): <strong>Омниграф</strong> (<a href=\"PS-0068.html\">Омниграф</a>) — генерация и контроль звуковых волн «от легкого головокружения до разрушительных землетрясений», манипуляция вибрациями, сбор информации через резонанс; <strong>Хроматер</strong> (<a href=\"PS-0069.html\">Хроматер</a>) — полиморфизм, манипуляция светом, поглощение света для усиления; <strong>Металлоид</strong> (<a href=\"PS-0070.html\">Металлоид</a>) — металломорфизм, контроль металла, быстрое восстановление; <strong>Пироманта</strong> (<a href=\"PS-0071.html\">Пироманта</a>) — пирокинез, плазменная форма, тепловое видение; <strong>Нейроглиф</strong> (<a href=\"PS-0072.html\">Нейроглиф</a>) — нейропрограммирование, гипноз, ментальная сеть с союзниками.</p>\n<p>Второй, параллельный добор (<a href=\"PS-0073.html\">Пришельцы 7–10 (второй вариант)</a>, id 167452) под теми же номерами: <strong>Изменяющий форму</strong> — имитация внешнего вида любого живого существа или предмета; <strong>Телекинетик</strong>; <strong>Мастер времени</strong> — замедление или ускорение времени вокруг себя или в локации; <strong>Энергетический вампир</strong> — поглощение жизненной силы или магической энергии противников. Пометка Миколая: «2 мощные нейронки сгенерировали предложения пока что» (167454).</p>\n<p>Отбор Славы (id 167464–167466): «7 изменять форму / 8 звук / 9 пиромат / Как будут выглядеть?» То есть седьмой — Изменяющий форму (из второго списка), восьмой — Омниграф, девятый — Пироманта. В записи <a href=\"PS-0073.html\">Пришельцы 7–10 (второй вариант)</a> помечено: «Изменяющий форму дублирует полиморфизм Хроматера; какой из двух остался в ростере, из окна не ясно».</p>\n<p>Шестого Миколай оформил как <strong>Псиклон</strong> (<a href=\"PS-0067.html\">Псиклон</a>) — гуманоид с чертами насекомого и рептилии, многофасеточные глаза, щупальца за спиной, иллюзорный туман; внешность Слава отверг. Под девятым номером отдельно шёл поиск огненного образа: восемь вариантов огненного существа (Восемь образов огненного существа <em>(статьи ещё нет — <a href=\"kb/ID-0058-vosem-obrazov-ognennogo-suschestva.html\">исходник</a>)</em>: пепельный призрак, лавовый червь, звёздный феникс, пламенная роща, сердце вулкана, солнечный крокодил, пламенный зиккурат, огненный водоворот — ни один не выбран), собственный вариант Миколая «каменный чел с магмой на конечностях, по типу вулкана» (Огненный пришелец — каменный чел с магмой <em>(статьи ещё нет — <a href=\"kb/ID-0057-ognennyy-prishelec-kamennyy-chel-s-magmoy.html\">исходник</a>)</em>) и Пиромант Эшер (<a href=\"PS-0074.html\">Пиромант Эшер</a>) — через управление теплом, а не пламенем.</p>\n<p><strong>Десятый</strong> (<a href=\"PS-0076.html\">10-й персонаж (целитель)</a>, 2024-05-11, id 167902–168323, окно w0034). Слава: «И последний 10 кто же он». Миколай предлагает миниклонов из крови (<a href=\"SP-0061.html\">Миниклоны из крови</a>) или увеличенные бактерии-фамильяры (Бактерии-фамильяры <em>(статьи ещё нет — <a href=\"kb/ID-0059-bakterii-familyary.html\">исходник</a>)</em>): «Опять идею спизжу. Крч чел который может из своей крови делать миниклонов и управлять ними. А может быть если что-то новое, то увеличивать размер своих Бактерий и использовать как фимильяров». Дальше — единственное в материале рассуждение о составе через нехватку роли (167926–167927): «Вообще у нас нету не кого с исцеляющий абилкой», «Но при этом что бы он сам за себя постоял ему нужно ещё что то». Миколай: «Маг целитель новый старт», Слава: «Через чур имбовый», Миколай: «Ну можно урезать. Логику спиздить и подстроить». Внешность прописывает Слава (167936): «Гуманоид человеческого роста синий кожей( не точно может розовый) с острыми ушами как у эльфа. Также на лице красивый узоры разного цвета. Одежда зимняя. Сам он гибкий», позже — «Только зимня одежда старый веков а не нового» и «Не с длинными волосами красивее». Вторая форма — «режим оленя» (<a href=\"SP-0062.html\">Режим оленя</a>), название дал Слава.</p>\n<p>При переходе от апрельского набора к майскому ростеру различение «форма многоликого / отдельная раса» исчезло: список 1–10 подаётся просто как «пришельцы», и к кому они относятся — к способности многоликого или к населению мира — в майских окнах не проговорено.</p>\n<h3>Как классы соотносятся между собой</h3>\n<p>Единой расстановки авторы не делали. Вселенная за полтора месяца трижды меняла устройство, и разные наборы населения принадлежат разным её состояниям.</p>\n<p><strong>Состояние 1 — организация и существа (2024-04-01 — 2024-04-02).</strong> Люди и существа (вампиры, оборотни) сосуществуют; существа могут работать в организации; деление проходит не по виду, а по поведению. Плюс объявленные, но не раскрытые: раса-помощник, агенты от животных, подопытные люди из экспериментов, аномалии.</p>\n<p><strong>Состояние 2 — двадцать человек в двух группах (2024-04-02 — 2024-04-07).</strong> Население — обычные люди с одной-двумя способностями каждый, набранные из окружения авторов; внутри группы предполагалась иерархия; группы соревнуются в турнире. К этому же состоянию примыкают пристав, многоликий с его формами и Поротай. Единственная расовая линия, доработанная здесь, — Поротай.</p>\n<p><strong>Состояние 3 — Геростраты, лиомат, военные отряды (2024-05-07 — 2024-05-11).</strong> Единственная построенная система соотношений: всё население — люди, у всех есть железа абакра; у большинства она рудимент; Геростраты — те, у кого абакра работает; насильно пробуждённые — промежуточный разряд; военные организации — институт, который пробуждает и ставит эксперименты; отряды — единица организации, причём равных отрядов несколько; сверхчеловек с идеальным контролем — верхняя ступень, определённая только через отношение к Бессмертному; боги греческих и скандинавских мифов — Геростраты прошлого.</p>\n<p>Как соотносятся состояния 2 и 3 — двадцать человек с турниром и Геростраты с военными отрядами — в переписке не сказано ни разу. Соотношение Поротая и пришельцев с системой лиомата тоже не обсуждалось: Поротай получает силы от поедания жуга, а не от абакры.</p>\n<p>Единственное количественное соотношение сил, названное в материале: Бессмертный и Провидец вдвоём непобедимы для обычного отряда, но проигрывают одиночному сверхчеловеку с идеальным контролем. Эта расстановка получена от нейронки (166889, 166893) и Славой прямо не подтверждена — он ответил, что не может представить командную работу против одного бойца.</p>", "r": [["банкротство по желанию", "kb/ID-0046-bankrotstvo-po-zhelaniyu.html"], ["Мифы как летописи людей с активной абакрой", "kb/ID-0056-mify-kak-letopisi-lyudey-s-aktivnoy-abakroy.html"], ["Восемь образов огненного существа", "kb/ID-0058-vosem-obrazov-ognennogo-suschestva.html"], ["Огненный пришелец — каменный чел с магмой", "kb/ID-0057-ognennyy-prishelec-kamennyy-chel-s-magmoy.html"], ["Бактерии-фамильяры", "kb/ID-0059-bakterii-familyary.html"], ["Дядон Гомбевский", "PS-0037.html"], ["Ояш Бичевский", "PS-0038.html"], ["Адам Тихой", "PS-0039.html"], ["Нерадио Попов", "PS-0040.html"], ["Пил Пончик", "PS-0041.html"], ["Войс Патина", "PS-0042.html"], ["Нат Магнов", "PS-0043.html"], ["Терор Мачилович", "PS-0044.html"], ["Каваи Навалов", "PS-0045.html"], ["Перо Кладович", "PS-0046.html"], ["Аполлон", "PS-0047.html"], ["Максим", "PS-0048.html"], ["Кирилл", "PS-0049.html"], ["Дима", "PS-0050.html"], ["Саша", "PS-0051.html"], ["Закон", "PS-0031.html"], ["пристав", "PS-0060.html"], ["Сверхчеловек с идеальным контролем", "PS-0065.html"], ["Имитатор", "PS-0383.html"], ["Поротай", "PS-0036.html"], ["многоликий", "PS-0052.html"], ["Витрофунгус", "PS-0056.html"], ["Лихтспид", "PS-0057.html"], ["Тардибовин", "PS-0054.html"], ["Сордекваксус", "PS-0055.html"], ["Керагуар", "PS-0058.html"], ["Торфолихт", "PS-0059.html"], ["змей из цепи", "PS-0053.html"], ["Пришельцы (ростер 1–6)", "PS-0066.html"], ["Омниграф", "PS-0068.html"], ["Хроматер", "PS-0069.html"], ["Металлоид", "PS-0070.html"], ["Пироманта", "PS-0071.html"], ["Нейроглиф", "PS-0072.html"], ["Пришельцы 7–10 (второй вариант)", "PS-0073.html"], ["Псиклон", "PS-0067.html"], ["Пиромант Эшер", "PS-0074.html"], ["10-й персонаж (целитель)", "PS-0076.html"], ["Жуг", "SP-0052.html"], ["Миниклоны из крови", "SP-0061.html"], ["Режим оленя", "SP-0062.html"], ["Герострат", "MR-0008.html"]]}, {"t": "Система способностей", "a": ["S05", "VS-0014-S05", "VS-0014--sistema-sposobnostey"], "h": "<h3>Два несвязанных слоя</h3>\n<p>В переписке вселенная распадается на два слоя, которые между собой прямо не сшиты.</p>\n<p><strong>Слой первый, апрель 2024 — сама игра.</strong> Способность здесь — свойство карточки персонажа, её происхождение не объясняется вообще: «И у всех них есть способности» (153135). Единственное общее требование при наборе — «также их способности что бы подходили под характер ну хотя бы чуть чуть и чтобы не были прям нарушающий баланс» (153141).</p>\n<p><strong>Слой второй, май 2024 — энергетика Геростратов.</strong> С 2024-05-07 (id 166480 и далее) идёт разработка отряда, а затем сквозной системы: как сверхспособность вообще возможна биологически. Здесь появляются Герострат, лиомат, абакра, гелиогормоны, сверхгенкод.</p>\n<p>Связь между слоями в переписке не названа. Ни один из двадцати персонажей апрельской игры не описан как Герострат, и лиомат к ним не применяется. Одна это вселенная в замысле авторов или две — не сказано.</p>\n<h3>Терминология</h3>\n<p>Подбиралась 2024-05-07 вечером (id 166898–166922) по прямому запросу Славы. Миколай: «Ну я бы щас побежал к греческому переводу», «Или латинскому».</p>\n<ul>\n<li><strong>Герострат</strong> — название носителя (166908–166909), см. раздел «Население и классы».</li>\n<li><strong>Макроскилы</strong> (макроскилы <em>(статьи ещё нет — <a href=\"kb/ID-0055-makroskily.html\">исходник</a>)</em>, id 166911) — вариант названия для самих способностей, отброшенный тем же автором: «Но слишком длинно и неоч» (166912), затем «Хотя», «Не мне понравилось» (166913–166914). Слава прекращает поиск: «Похую на название сверхспособности» (166916).</li>\n<li><strong>Лиомат</strong> (id 166918) — название энергии, с этимологией тут же: «У этого даже смысл есть», «Объединение конечных частей слов означающих солнце и кровь на греческом» (166920–166921).</li>\n<li><strong>Абакра</strong> — имя железы, появляется в сведённом тексте 2024-05-09.</li>\n</ul>\n<h3>Лиомат: откуда берётся сила (<a href=\"SP-0059.html\">Лиомат</a>, пять версий, 2024-05-07 — 2024-05-09, окна w0032–w0033)</h3>\n<p>Разработка идёт двумя заходами: черновая сборка вечером 2024-05-07 (id 166915–166978) и два сведённых письменных варианта 2024-05-09.</p>\n<p><strong>Постановка задачи</strong> (id 166922): «Вообще смотри я хочу что бы это энергий была у Геростратов и типо они это энергий используют способности. При этом там будут насильно пробужденый обычный людий которых заставили пробудить данную энергию, при этом самой сверхсилый у них не будет, а только усиленный за счёт этой энергий». Вопрос Славы: «И вопрос откуда берется энергия?» Варианты Миколая: «Ну в обычном мире», «Из солнца», «Или из еды». Слава: «Ненее», «Из желудка». Миколай: «У нас с тобой так. А вот у них — хз». Решения на этом этапе нет: «Получается ты определился / Или наоборот» — «Нет».</p>\n<p><strong>Железа, а не орган</strong> (id 166937–166973). Миколай: «Ну крч может новую железу им вывести пихнём и какую-то удалим». Возражение Славы от механики насильного пробуждения: «Вообще можно специальный орган но только как тогда насильной пробужденый вырабатывают эту энергию». Ответ: «Тогда можно сказать что он был всегда», «Железу», «Не орган», «И эта энергия по сути гормоны». Это единственное место, где механика мира прямо выведена из существования класса.</p>\n<p>Почему не у всех (166947–166950): «И есть же депрессия, при которой у человека не вырабатываются некоторые гормоны и он навыки некоторые теряет», «И тут тоже самое но сильнее», «То бишь у большинства эти гормоны не вырабатываются». Слава достраивает: «И нужен особой препараты» (166951).</p>\n<p>Как гормоны вырабатывают энергию (166952–166973): через пример адреналина — «Ну вот есть например адреналин. Если его прям много — человек может делать невероятное»; Миколай колеблется между «они её перерабатывают» и «направляют в нужное русло», Слава решает: «Они сами вырабатывают». Итоговая цепочка: «Вот пища, разлагаясь на микроэлементы, даёт энергию через кровь. А тут кров будет поступать в эту железу, и энергия будет преобразовываться в другую которая отвечает за способности, а также генерироваться или увеличиваться». И хранилище: «Ну и у этой железы будет сфинктер. Он будет как батарейка. Хранить энергию».</p>\n<p><strong>Вариант 1 сведённого текста</strong> (2024-05-09, id 167303), с предисловием «Я короче концепцию энергии и способностей придумал систематизировал и написал»:</p>\n<div class=\"q\"><p>есть у человека два вида энергии обычная которая получается от калорий и энергия от которой зависит сверх способность, пусть называется «лиомат». Так вот, лиомат это трансформированная обычная энергия, вырабатываемая в новой железе «абакра» и хранящаяся в сфинктере этой железы. Раньше, 300000 лет назад эта железа постоянно генерировала гелиогормоны, ибо были такие условия при которых человеку жизненно необходимо использовать сверхспособность. Но как только атмосфера земли стала комфортнее, а жизненные условия пригоднее для мирной жизни, гелиогормоны перестали вырабатываться и железа осталась рудиментом. Многие учёные гадали зачем она использовалась, но ответ так и не был зафиксирован в научном мире. Однако есть множество военных организаций с безумцами умеющими управлять гормональным фоном и стимулировать выработку гелиогормонов в этой железе и тогда люди могут контролировать способность установленную генетическим кодом клеток.</p></div>\n<p>Помечено самим автором: «Ну это пока первый вариант», «Хотя надеюсь что последний)».</p>\n<p><strong>Вариант 2</strong> (2024-05-09, id 167322), через полтора часа, с припиской «Некоторые недочёты и пробелы я заполнил»:</p>\n<div class=\"q\"><p>есть у человека два вида энергии обычная которая получается от калорий и энергия от которой зависит сверх способность она называется «лиомат». Так вот, лиомат это трансформированная обычная энергия, вырабатываемая в новой железе «абакра» и хранящаяся в сфинктере этой железы. Преобразование происходит посредством выработки гелиогормонов синтезируемых макросоединением иденоновой кислоты и циркулирующих в ангиолиях(сосудов с атф но, которая не активна без гормонов). Если конкретнее соединение гелиогормонов с АТФ и приводит к появлению лиомата.<br>Гелиогормоны начинают синтез при стимуляции симпатической нервной системы и сейчас достаточная стимуляция для ежедневного использования знакома только людям пережившим ситуации при которых можно заработать крайнюю форму птср, ну конечно без самого птср, при птср не возможно.<br>У человека с рождения есть клетки с генкодом отвечающим за сверх способности, но без лиомата они не работают, а после 30 лет полностью исчезают без использования. Этот генкод в режиме инкубации каждое поколение революционировал и способность определялась тем что человек ел, в том числе в контексте информации, а так же сами мечты человека до 5 лет влияют на предрасположенность к способности. При использовании способности клетки постепенно совершают метаморфозу и принимают нужную форму, а лиомат соответственно расходуется.<br>Раньше, 150000 лет назад абакра постоянно генерировала гелиогормоны, ибо были такие условия при которых человеку жизненно необходимо использовать сверхспособность: вечный холод, макрофауна, озоновые дыры, общее состояние климата и состав воздуха отличались, постоянный стресс уже в первые годы рождения приводил к состоянию близкому птср. Но как только атмосфера земли стала комфортнее, а жизненные условия пригоднее для мирной жизни, гелиогормоны перестали вырабатываться и железа осталась рудиментом. Многие учёные гадали зачем она использовалась, но ответ так и не был зафиксирован в научном мире открыто. Однако есть множество военных организаций где логично птср не редкость проводящих эксперименты над людьми со сверхспособностями.</p></div>\n<p>Отличия второго варианта от первого, по тексту: добавлены иденоновая кислота, ангиолии и АТФ; введён механизм запуска через симпатическую нервную систему и околоПТСР-состояние с прямым запретом «при птср не возможно»; срок изменён с 300000 на 150000 лет и расписаны условия среды; введён сверхгенкод, срок его исчезновения 30 лет без использования и зависимость способности от того, что человек ел «в том числе в контексте информации» и о чём мечтал до 5 лет; введена метаморфоза клеток при использовании и прямая трата лиомата; формулировка про военные организации переписана. Реакция Славы на оба варианта в окне не зафиксирована.</p>\n<p>Свод по пунктам:</p>\n<ul>\n<li><strong>откуда берётся</strong>: обычная энергия от калорий → кровь с микроэлементами → железа абакра → трансформация в лиомат через соединение гелиогормонов с АТФ;</li>\n<li><strong>где хранится</strong>: в сфинктере железы, «он будет как батарейка»;</li>\n<li><strong>почему не у всех</strong>: гелиогормоны у большинства не вырабатываются, «как при депрессии, но сильнее»; железа — рудимент;</li>\n<li><strong>что задаёт конкретную способность</strong>: генетический код клеток (вариант 1) / сверхгенкод с предрасположенностью от еды, информации и детских мечтаний до 5 лет (вариант 2);</li>\n<li><strong>цена</strong>: лиомат расходуется, клетки при использовании совершают метаморфозу;</li>\n<li><strong>срок годности</strong>: сверхгенкод «после 30 лет полностью исчезают без использования».</li>\n</ul>\n<h3>Способы получения силы</h3>\n<p>Названо три, между собой не согласованных.</p>\n<ol>\n<li><strong>Самопробуждение</strong> — «некоторый сами пробуждаться» (166945); условие во втором варианте — пережитая ситуация уровня крайней формы ПТСР, но без самого ПТСР.</li>\n<li><strong>Насильное пробуждение</strong> — «насильно пробужденый обычный людий которых заставили пробудить данную энергию» (166922); «И нужен особой препараты» (166951), что за препараты, не расписано.</li>\n<li><strong>Поедание жуга</strong> (<a href=\"SP-0052.html\">Жуг</a>) — отдельная линия, к лиомату не привязана. Что такое сам жуг — гриб, существо, предмет, плод — не сказано ни в одном из трёх заходов (2024-04-02, 2024-06-03, 2025-03-26).</li>\n</ol>\n<p>Фигуры «дающего» — божества, наставника, системы — во вселенной нет. Слово «бог» встречается в названии игры и в реплике «Ну бог это образно. Просто сильнейшее существо» (id 166836).</p>\n<h3>Ограничения и цена у отдельных носителей</h3>\n<p>Ограничители, зафиксированные в «игре бога»:</p>\n<ul>\n<li><strong>Провидец</strong> (Провидец <em>(статьи ещё нет — <a href=\"kb/ID-0050-providec.html\">исходник</a>)</em>, id 166507): цена и выгода — одно и то же, платой за отмотку служит петля на 10 000 проживаний одного промежутка, а из петли он выходит «безумцем, ни разу не проигравшим в рукопашном бою или в стрельбе». Механика петли расписана 2024-05-09 (id 167343) уже в машинном разборе: отмотка создаёт отдельную временную ветвь, отделяющуюся от основной линии континуума, ветвь потом «сшивается» с основной, носитель заперт в ней на 10000 циклов и оттачивает навыки до идеала. Реакция Миколая: «Нейронка дала жизнь концепции». В неясностях окна w0033 отмечено, что собственной авторской формулировки провидца и 10000 циклов там нет — обращение в машинном тексте на «вы», значит, задумка звучала раньше или голосом.</li>\n<li><strong>Бессмертный</strong> (<a href=\"IS-0013.html\">Бессмертный</a>, id 166507): убить может лишь сверхчеловек с идеальным контролем; на дальней и средней дистанции — кости, «костенной сад», чудовище, на ближней — «использует свой бессмертие на все сто». Тип условия бессмертия — «4» по фандомной классификации, без расшифровки.</li>\n<li><strong>Петля</strong> (<a href=\"SP-0051.html\">Петля</a>, 2024-04-02, id 151858): «перемотка времени на 10 секунд 10000 раз». Ограничение — только число повторов и длина отрезка. Кто носитель — не сказано.</li>\n<li><strong>Закон</strong> (<a href=\"PS-0031.html\">Закон</a>): механика разрабатывалась 2024-03-12 (id 138166–138220) до объявления вселенной, а в «игру бога» затянута названием — «Также туда можно и закон закидать» (id 151858) и «сверхсила типо петли и закона» (id 152594); в этих окнах механику не повторяли. Из мартовской разработки: радиус 70 метров, любой закон обязателен к исполнению, за нарушение наказание («не прыгать — если прыгнешь твой весь увеличиться на 1 тонну плюс минус»; «не убивать — за хочешь убить и нападешь то не сможешь двигаться н количество времени»). Слава сам ставит задачу: «И вот это способности нужны слабости». Предложение Миколая (138169–138179): цель должна услышать закон, знать язык и понимать требован
