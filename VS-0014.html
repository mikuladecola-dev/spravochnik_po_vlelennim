ие, закон должен быть «сказан чётко и стандартизировано», иначе «можно уши закрыть». Слава отклоняет: «закон будет действовать в радиусе 70 метров и там без разницы услышал ты или нет пока не покинул радиус». Миколай настаивает ради противодействия: «Ну без этого я хз как противостоять челу с такой способностью. Скажет, умри — и я убью себя. А если уши закрою, мне збс». Принятые ограничения: закон может только запрещать («Нет закон что то запрещает только», 138188); носитель сам обязан следовать сказанному закону (138204). Разработка обрывается репликой Миколая (138218): «Слава, я не буду погружаться и усложнять, все гениальное просто».</li>\n<li><strong>Максим</strong> (<a href=\"PS-0048.html\">Максим</a>): та же схема в карточке участника игры, с минусом «Максиму тоже надо подчиняться закону».</li>\n<li><strong>Нерадио Попов</strong> (<a href=\"PS-0040.html\">Нерадио Попов</a>): самая подробная система цены в апрельском слое — счётчик касаний, потеря собственной души от третьего прикосновения, а при передаче души наркотику — от второго.</li>\n<li><strong>Перо Кладович</strong> (<a href=\"PS-0046.html\">Перо Кладович</a>): копия способностей и однократное использование, для повтора надо снова увидеть носителя в реальности.</li>\n<li><strong>Дядон Гомбевский</strong> (<a href=\"PS-0037.html\">Дядон Гомбевский</a>): невидимость работает по внешнему условию — «если слышит больше 3 голосов».</li>\n<li><strong>Ояш Бичевский</strong> (<a href=\"PS-0038.html\">Ояш Бичевский</a>): обратная зависимость от собственного усилия — «Чем слабее удар, тем больше урона».</li>\n<li><strong>Каваи Навалов</strong> (<a href=\"PS-0045.html\">Каваи Навалов</a>): «чем больше говорит, тем тяжелее удары».</li>\n<li><strong>Адам Тихой</strong> (<a href=\"PS-0039.html\">Адам Тихой</a>): срабатывает только по чужому действию — за ответ на его подъёбку.</li>\n<li><strong>Пил Пончик</strong> (<a href=\"PS-0041.html\">Пил Пончик</a>): условие слышимости игры на гитаре.</li>\n<li><strong>Терор Мачилович</strong> (<a href=\"PS-0044.html\">Терор Мачилович</a>): эффект замкнут на носителя — «для самого себя».</li>\n<li><strong>Кирилл</strong> (<a href=\"PS-0049.html\">Кирилл</a>): цель должна быть ранее увидена, точка выхода всегда рядом с носителем.</li>\n<li><strong>Дима</strong> (<a href=\"PS-0050.html\">Дима</a>): жёсткий счётчик — «3 раза максимум».</li>\n<li><strong>Саша</strong> (<a href=\"PS-0051.html\">Саша</a>): запрет на одушевлённое плюс усталость по массе.</li>\n<li><strong>Аполлон</strong> (<a href=\"PS-0047.html\">Аполлон</a>) и <strong>Войс Патина</strong> (<a href=\"PS-0042.html\">Войс Патина</a>): ограничений не названо.</li>\n<li><strong>Призрак</strong> (<a href=\"SP-0057.html\">Локальное управление осязанием</a>): слабое место названо самим автором — «просто атаковать осязаемую часть тела».</li>\n<li><strong>Щекотание атомов / Лихтспид</strong> (<a href=\"SP-0054.html\">щекотание атомов</a>, 2024-04-06) — единственный спор о балансе в окне. Слава (154473): «Да же какой то через чур инбаласный. Щекотать атомы». Миколай уточняет авторство и исходный смысл (154474–154478): «Это я придумал», «Ну он не совсем верно понял», «Я имел ввиду именно молния создаётся в атмосфере из-за того что атомы щекочат», «А тут он придумал делать резонанс». Оценка машинной трактовки: «Это прикольно но для баланса можно убрать или ослабить» (154479). Правило ослабления даёт Слава (154480): <strong>«Ну можно что бы на людей он действовал слабей и если противник сильный то ещё слабее»</strong>. Итог (154483): «А так самый лучший».</li>\n<li><strong>Управление кератином / Керагуар</strong> (<a href=\"SP-0055.html\">управление кератином</a>, 2024-04-06): «может по желанию выделять кератин и манипулировать его формой и твёрдостью, создавая оружие, доспехи, инструменты или сооружения. Он может менять агрегатное состояние кератина от твёрдого до жидкого» (154485). Аналогия (154494–154496): «Типо есть персы которые бьют землю и из неё вырастают глыбы камня», «Или персы из железа чет создают», «А у него тоже самое, ток из кератина». Вопрос Славы об источнике (154505–154506): «И вообще этот кератин будет появляться из отверстий или от куда», «Типо если из его рук появится это херня это будет как та глупо». Ответ (154507): «Он может управлять агрегатным состоянием кератина, он может сделать жидкие ногти и выделить нужное количество кератина». Слава сравнивает с алмазным персонажем (154509–154511): «Типо алмаз он весь из алмазов и может делать алмаз из себя», «А здесь чёт даже не понятно», и сам переписывает решение (154529): отверстия в спине и в кистях, откуда выходит жидкое вещество, «которой будет становится твердым, упругим, или также жидким». Свойства (154589–154598): «Нити из кератина тоже пиздец прочные», «Он бесформенный», «Его трудно контролировать», цвет чёрный по решению Славы, «Кератиновый блок», применение как гарпуна — «тут он в действии почти оплёл небоскрёб».</li>\n<li><strong>Окаменение и заражение</strong> (<a href=\"SP-0056.html\">окаменение и заражение</a>, 2024-04-06, id 154331): заявлено одной репликой и больше не развивалось; не сказано, идёт ли заражение дальше по цепочке и обратимо ли оно.</li>\n<li><strong>Перевоплощение в 10 разных существ</strong> (<a href=\"SP-0053.html\">перевоплощение в 10 разных существ</a>): механика самого превращения — как переключается, есть ли ограничение по времени — нигде не проговорена; всё окно занято подбором форм.</li>\n<li><strong>Режим оленя</strong> (<a href=\"SP-0062.html\">Режим оленя</a>, 2024-05-11, id 167939–167955): постановка Славы — «Ну вот он такой миленький добренький. И какая у него должна быть защитная или атакующая способность»; предложение Миколая — «Может биполярку ебанём?», «И как у героя щита у него будет режим гнева»; название дал Слава. Вечером того же дня (168319–168323): «Ты продумал режим оленя?» — «Нет ещё». Механика не описана.</li>\n<li><strong>Миниклоны из крови</strong> (<a href=\"SP-0061.html\">Миниклоны из крови</a>, 2024-05-11): «чел который может из своей крови делать миниклонов и управлять ними», с пометкой «Опять идею спизжу». К персонажу окончательно не привязана.</li>\n</ul>\n<p><strong>Числовых характеристик</strong> в «игре бога» нет — карточки со шкалами появляются в других вселенных. Единственная числовая пара внутри окна w0033 — пришелец-«шарик» из ростера (2024-05-10, id 167448): «бессмертие, не осязаемость не прибиваемость, мгновенное восстановление, также 0 атака но 100 защита».</p>\n<h3>Правила баланса, проговорённые как правила</h3>\n<ul>\n<li>«также их способности что бы подходили под характер ну хотя бы чуть чуть и чтобы не были прям нарушающий баланс» (2024-04-02, id 153141);</li>\n<li>«И вот это способности нужны слабости» (2024-03-12, id 138166 — сказано о Законе до объявления вселенной);</li>\n<li>«Ну представь военный отряд которым ещё врагов надо придумывать поэтому через чур инбаласный не надо (ну или надо только с ограничением)» (2024-05-07, id 166837);</li>\n<li>«Оке пон, мери сьюшек не делать» (id 166839);</li>\n<li>«Ну а ограничение попробуй сам придумать интересное» (id 166816);</li>\n<li>«Но можно условия добавить», «Особенные», «И ограничения новые», «И тогда сойдёт за новую» (id 166821–166824) — ограничение предложено как способ сделать заезженную способность новой;</li>\n<li>«Ну можно что бы на людей он действовал слабей и если противник сильный то ещё слабее» (2024-04-06, id 154480);</li>\n<li>«просто кидать сильных персонажей в один отряд глупо тем более если их ний силы друг другу не подходят» (2024-05-07, id 166880);</li>\n<li>«Тока я никак в голове приставить не могу их ний командный работу или битву» (id 166887) и «Не я про то что не могу приставать командную работу против одного бойца» (id 166890);</li>\n<li>о ловкости (Ловкость <em>(статьи ещё нет — <a href=\"kb/ID-0054-lovkost.html\">исходник</a>)</em>, id 166772–166774): «Оказывается ловкость имбовая штука», далее определение Н. А. Бернштейна, взятое с фандома: «способность двигательно выйти из любого положения» — правильно, быстро, рационально, находчиво.</li>\n</ul>\n<h3>Предложенное и отклонённое</h3>\n<ul>\n<li><strong>Макроскилы</strong> (макроскилы <em>(статьи ещё нет — <a href=\"kb/ID-0055-makroskily.html\">исходник</a>)</em>) — отброшено самим предложившим.</li>\n<li><strong>Логос номос</strong> (<a href=\"SP-0058.html\">Логос номос</a>) — «Ну чёт я хотел более новой»; ограничение не придумано, окончательно не принято и не отвергнуто.</li>\n<li><strong>Несоразмерный</strong> (Несоразмерный <em>(статьи ещё нет — <a href=\"kb/ID-0051-nesorazmernyy.html\">исходник</a>)</em>) — «Не оставляю (не знаю почему, просто как то не подходит)».</li>\n<li><strong>Призрак</strong> (<a href=\"SP-0057.html\">Локальное управление осязанием</a> / <a href=\"PS-0064.html\">Призрак</a>) — принят по механике («Норм?» — «Да»), но отклонён для отряда: «Но все это как то не то».</li>\n<li><strong>Три основные божественные способности</strong> (Божественные способности (3 основные) <em>(статьи ещё нет — <a href=\"kb/ID-0052-bozhestvennye-sposobnosti-3-osnovnye.html\">исходник</a>)</em>) — названы числом, не перечислены.</li>\n<li><strong>Способность получать силы съеденного</strong> (Способность получать силы съеденного <em>(статьи ещё нет — <a href=\"kb/ID-0053-sposobnost-poluchat-sily-sedennogo.html\">исходник</a>)</em>) — «Просто написал пока», ответа нет.</li>\n<li><strong>Банкротство по желанию</strong> (банкротство по желанию <em>(статьи ещё нет — <a href=\"kb/ID-0046-bankrotstvo-po-zhelaniyu.html\">исходник</a>)</em>) — не принято и не отвергнуто, осталось без ответа.</li>\n<li><strong>Кристаллокинез</strong> (внутри <a href=\"SP-0056.html\">окаменение и заражение</a>, id 154338) — машинное предложение приставу с оговоренным недостатком «зависимость от наличия кристаллических материалов поблизости»; в переписке не подхвачено.</li>\n<li><strong>Резонансный взрыв</strong> (<a href=\"SP-0054.html\">щекотание атомов</a>) — не отклонён, а ослаблен.</li>\n<li><strong>Витрофунгус</strong> (<a href=\"PS-0056.html\">Витрофунгус</a>) — отклонён как форма многоликого при одобрении как отдельного персонажа.</li>\n<li><strong>Бабуинохвост</strong> (Бабуинохвост <em>(статьи ещё нет — <a href=\"kb/ID-0045-babuinohvost.html\">исходник</a>)</em>) — отклонён сразу как повтор качка.</li>\n<li><strong>Добавочная способность высшему Поротаю</strong> — запрос Славы отклонён Миколаем: «как по мне и так много способностей».</li>\n<li><strong>Добавочная способность приставу</strong> — заявлена как намерение, не выбрана.</li>\n<li><strong>Агенты, берущие силу от животных</strong> (Агенты, берущие силу от животных <em>(статьи ещё нет — <a href=\"kb/ID-0039-agenty-beruschie-silu-ot-zhivotnyh.html\">исходник</a>)</em>) и <strong>раса-помощник</strong> (Раса-помощник <em>(статьи ещё нет — <a href=\"kb/ID-0040-rasa-pomoschnik.html\">исходник</a>)</em>) — названы и не разрабатывались.</li>\n</ul>\n<h3>Формат разрешения споров о силе</h3>\n<p>Механика уровня игры, не мира: идею турнира кидают нейронке, свой ход пишут в чат, исход и победителя расписывает нейронка (Турнир <em>(статьи ещё нет — <a href=\"kb/ID-0041-turnir.html\">исходник</a>)</em>, 2024-04-03). Тот же приём применён к оценке отряда 2024-05-07 (id 166874–166893). Комментарий Миколая по поводу собственного пользования нейросетью (id 166867–166872): «Я зависимый», «Ну и поху. Главное что задача решается». Значительная часть карточек (Тардибовин, Витрофунгус, пришельцы 7–10, расстановки сил отряда) написана нейронкой по заданию авторов; авторство задания при этом фиксируется отдельно — «Я придумал кого скрестить, нейронка дала четкое описание по заданию».</p>\n<p>Рядом стоят два служебных приёма придумывания, записанные внутри отрезка: <strong>«вдохновение эмодзи»</strong> (Приём «вдохновение эмодзи» <em>(статьи ещё нет — <a href=\"kb/SL-0011-priem-vdohnovenie-emodzi.html\">исходник</a>)</em>, 2024-05-12) — берётся сочетание эмодзи и по уловленной из него идее собирается персонаж, пример-затравка «🐟💋🕯️»; и задание <strong>«разгляди в изображении оригинальную идею»</strong> (задание «разгляди в изображении оригинальную идею» <em>(статьи ещё нет — <a href=\"kb/SL-0010-zadanie-razglyadi-v-izobrazhenii-originalnuyu-ideyu.html\">исходник</a>)</em>, 2024-04-08 — 2024-04-10) — смотришь на картинку и высасываешь из неё оригинальную идею, потом автор задания называет деталь, которую разглядел сам.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Следом — <code>ID-0041</code> «Турнир»: три ссылки, статьи нет, 4 216 знаков. Это тем дороже, что турнир и есть форма всей вселенной: игра объявлена как «соревнование и испытания», порядок расписан по шагам (отношения в командах → турнир → нейронка пишет исход), приз назначен. Ни одного хода в материале нет. И <code>ID-0039</code> «Агенты, берущие силу от животных» — три ссылки при 1 877 знаках: на неё ссылаются, а под ней меньше абзаца.</p></div>", "r": [["макроскилы", "kb/ID-0055-makroskily.html"], ["Провидец", "kb/ID-0050-providec.html"], ["Ловкость", "kb/ID-0054-lovkost.html"], ["Несоразмерный", "kb/ID-0051-nesorazmernyy.html"], ["Божественные способности (3 основные)", "kb/ID-0052-bozhestvennye-sposobnosti-3-osnovnye.html"], ["Способность получать силы съеденного", "kb/ID-0053-sposobnost-poluchat-sily-sedennogo.html"], ["банкротство по желанию", "kb/ID-0046-bankrotstvo-po-zhelaniyu.html"], ["Бабуинохвост", "kb/ID-0045-babuinohvost.html"], ["берущие силу от животных", "kb/ID-0039-agenty-beruschie-silu-ot-zhivotnyh.html"], ["Раса-помощник", "kb/ID-0040-rasa-pomoschnik.html"], ["Турнир", "kb/ID-0041-turnir.html"], ["Приём «вдохновение эмодзи»", "kb/SL-0011-priem-vdohnovenie-emodzi.html"], ["задание «разгляди в изображении оригинальную идею»", "kb/SL-0010-zadanie-razglyadi-v-izobrazhenii-originalnuyu-ideyu.html"], ["Закон", "PS-0031.html"], ["Максим", "PS-0048.html"], ["Нерадио Попов", "PS-0040.html"], ["Перо Кладович", "PS-0046.html"], ["Дядон Гомбевский", "PS-0037.html"], ["Ояш Бичевский", "PS-0038.html"], ["Каваи Навалов", "PS-0045.html"], ["Адам Тихой", "PS-0039.html"], ["Пил Пончик", "PS-0041.html"], ["Терор Мачилович", "PS-0044.html"], ["Кирилл", "PS-0049.html"], ["Дима", "PS-0050.html"], ["Саша", "PS-0051.html"], ["Аполлон", "PS-0047.html"], ["Войс Патина", "PS-0042.html"], ["Призрак", "PS-0064.html"], ["Витрофунгус", "PS-0056.html"], ["Лиомат", "SP-0059.html"], ["Жуг", "SP-0052.html"], ["Петля", "SP-0051.html"], ["Локальное управление осязанием", "SP-0057.html"], ["щекотание атомов", "SP-0054.html"], ["управление кератином", "SP-0055.html"], ["окаменение и заражение", "SP-0056.html"], ["перевоплощение в 10 разных существ", "SP-0053.html"], ["Режим оленя", "SP-0062.html"], ["Миниклоны из крови", "SP-0061.html"], ["Логос номос", "SP-0058.html"], ["Бессмертный", "IS-0013.html"]]}, {"t": "Кончина", "a": ["S06", "VS-0014-S06", "VS-0014--konchina"], "h": "<p>Кончина «игры бога» в переписке не объявлена. Нет ни сообщения, сворачивающего эту вселенную, ни фразы вроде «Сносим вселенную», которая закрыла предыдущую линию. Записей типа «смена», «закрытие», «переименование» или «возврат», относящихся к «игре бога», в файле вселенной нет; в общей хронологии вселенных их тоже нет. Вселенная перестаёт быть текущей молча, границу отрезка ставит объявление следующей вселенной 2024-05-25 (окно w0035): объявление id 173118 — за основу берут концепцию Миколая, систему сил «абакра»; возврат id 173216 — «Перейдем к нашей»; предложение имени «Паладин» id 173318, не закреплённое; объявление id 173342 — принято название «Цветной мир». Ни даты кончины, ни причины, ни дословной реплики автора о конце в материале нет.</p>\n<p>Ближайшее к сворачиванию высказывание внутри отрезка — признание Славы на следующий день после объявления (2024-04-03, id 153408): «Кстати и что дальше вот мы про всех персов рассказам и что дальше ( Я та про игру сказал в полусонном состояния когда спать ложился поэтому не знаю что дальше)». Это не закрытие: игра после этого продолжает обсуждаться.</p>\n<p>Возвратов к «игре бога» после 2024-05-25 в переписке нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "VS-0014-S07", "VS-0014--probely"], "h": "<div class=\"gaps\"><p><strong>Границы и состав отрезка</strong></p>\n<ol>\n<li>Кончина не объявлена вообще; отрезок обрывается объявлением следующей вселенной.</li>\n<li>Из чего выросла «игра бога» — не сказано. Закрытие предыдущей линии (id 153126) и объявление (id 153132) идут подряд в одну минуту 2024-04-02 21:48, но связи между ними, кроме соседства, в чате не проведено.</li>\n<li>Расхождение в самом файле: в шапке даты 2024-03-12 — 2024-05-12, а объявленный отрезок 2024-04-02 — 2024-05-25. Причина расхождения в материале не объяснена.</li>\n<li>Из 83 сущностей отрезка связь с игрой заявлена только для 17, перечисленных в «Связано с» истории <a href=\"IS-0012.html\">Игра бога</a> (Адам Тихой, Аполлон, Войс Патина, Дима, Дядон Гомбевский, Каваи Навалов, Кирилл, Лист Шакоропаля, Максим, Нат Магнов, Нерадио Попов, Ояш Бичевский, Перо Кладович, Пил Пончик, Саша, Терор Мачилович, Турнир). Остальные, включая крупные («Усиление Имитатора» — 33 версии, «Бессмертный» — 15 версий, «Отряд сильнейших», ростеры пришельцев за 2024-05-10), попали в отрезок по дате; их отношение к «игре бога» в переписке не названо.</li>\n<li>Сущности с датами раньше начала отрезка — «Закон» (<a href=\"PS-0031.html\">Закон</a>, с 2024-03-12) и «Организация по отлову существ-преступников» (<a href=\"MR-0006.html\">Организация по отлову существ-преступников</a>, с 2024-04-01) — числятся внутри вселенной, хотя относятся к снесённой линии. Как они соотносятся с «игрой бога», не сказано. Мир «Концепция scp / охота на аномалий» (<a href=\"MR-0007.html\">Концепция scp / охота на аномалий</a>) относится к линии, которую снесли сообщением 153126.</li>\n<li>Название вселенной звучит только при объявлении и один раз на следующий день (153134, 153456). Во всех остальных окнах отрезка вселенная не названа, метка проставлена по дате.</li>\n<li>Связь двух слоёв вселенной — апрельской игры и майской энергетики Геростратов — в переписке нигде не проведена. Одна это вселенная или две, не сказано.</li>\n</ol>\n<p><strong>Сама игра</strong></p>\n<ol start=\"8\">\n<li>Территория не названа и не описана: «на какой-то территории». Кто поместил на неё 20 человек, кто поделил на 2 группы, по какому принципу, сколько испытаний и какие правила соревнования — не сказано.</li>\n<li>Кто такой «бог» в названии — не сказано ни разу.</li>\n<li>Отношения внутри команд («кто главный кто баласт») и сам турнир, объявленные порядком работы 2024-04-03 (id 153457–153482), так и не прописаны — прямо зафиксировано в «Неясностях» <a href=\"IS-0012.html\">Игра бога</a>.</li>\n<li>Схема «идею турнира кидаем нейронке, она сама пропишет исход» (153485–153491) ни разу не применена: ни одного хода, ни одного тура, победителя нет.</li>\n<li>Приз — лист Шакоропаля — объявлен макгафином, но что это за лист, не объяснено: на вопрос «Че за лист» ответ был «Если интересно погугли».</li>\n<li>Пятерых из десяти персонажей Славы в базе нет — ни отказа, ни объяснения. «20 человек» и «2 группы» остались числом из объявления.</li>\n<li>Фотографии прототипов, которые Слава требовал прислать (153146), в материале отсутствуют.</li>\n<li>Реплика Миколая «Моя способность лежать 24 на 7» (153139) ни к какому персонажу не привязана.</li>\n<li>Персонаж 698 лет (Перо Кладович) в мире, где остальные — обычные люди из окружения авторов, никак не объяснён. Формулировка «использование 1 раз без людей» в его карточке помечена как неоднозначная.</li>\n<li>У Войс Патины отдельной строки со способностью нет; входит ли «летает» в характер или это и есть сила — помечено как неясность.</li>\n<li>Входит ли пристав в двадцатку — не сказано; третья способность пристава обещана «дальше по сюжету» и не названа.</li>\n<li>Связь «Закон (<a href=\"PS-0031.html\">Закон</a>) → способность Максима \"власть\"» в переписке прямо не названа; в базе стоит как предположение.</li>\n</ol>\n<p><strong>Организации</strong></p>\n<ol start=\"20\">\n<li>Организация по отлову существ-преступников: нет названия, руководства, численности, места, подчинения. Автор сам пометил её как «чисто принцип».</li>\n<li>scp-концепция: названа только рамка — ни классификации аномалий, ни отделов, ни названия организации.</li>\n<li>Раса-помощник: кто она, чем помогает и кому именно «нам» — не сказано.</li>\n<li>Агенты, берущие силу от животных: как сила берётся от животного и чьи это агенты — не сказано.</li>\n<li>Военные организации: без имён, числа, страны, отношений между собой. Два варианта текста расходятся; какой окончательный, не решено. Кто заставляет «насильно пробуждённых», прямо с ними не связано.</li>\n<li>Связь Поротаев с организацией по отлову существ проставлена в базе, но чем обоснована — в переписке не сказано.</li>\n</ol>\n<p><strong>Отряд</strong></p>\n<ol start=\"26\">\n<li>Поимённого состава сверх двух бойцов нет: «И за пихая туда кого-нибудь» не реализовано. Цель отряда, на кого работает, против кого действует — не сказано. Иерархии и командира нет, соотношение сил между Провидцем и Бессмертным не установлено.</li>\n<li>«Другие отряды, равные им по силе» заявлены, но ни один не назван. Отряд «Х» — из машинного текста, к нему не возвращались.</li>\n<li>Переформирование отряда обсуждалось и не сделано; после 2024-05-09 отряд в переписке не упоминается.</li>\n<li>Судьба кандидата «Несоразмерный»: отказ 166762 может относиться к нему, а может к другому варианту, обсуждавшемуся вне окна.</li>\n<li>Призрак признан «не то» для отряда и оставлен с формулировкой «можно ещё куда нибудь запихать» — куда, не решено.</li>\n<li>Ограничение для Логос номоса не придумано.</li>\n<li>Три основные божественные способности названы числом, но не перечислены.</li>\n<li>Тип бессмертия «4» не расшифрован — в чате только цифра и ссылка на внешнюю вики.</li>\n<li>Сверхчеловек с идеальным контролем существует только как условие смерти Бессмертного; сам персонаж не придуман.</li>\n<li>Собственной авторской формулировки Провидца и 10000 циклов в окне w0033 нет — там только машинный разбор с обращением на «вы».</li>\n<li>Имитатор во вселенной только упомянут, не описан и в отряд не заявлен.</li>\n</ol>\n<p><strong>Силы и биология</strong></p>\n<ol start=\"37\">\n<li>Реакции Славы на оба сведённых варианта концепции лиомата нет; какой вариант принят, не решено.</li>\n<li>Расхождение внутри концепции не устранено: в варианте 1 срок — 300000 лет, в варианте 2 — 150000 лет.</li>\n<li>«Особые препараты» для насильного пробуждения названы одним словом и не расписаны; совместимость с околоПТСР-механизмом не обсуждалась. Сам разряд насильно пробуждённых во втором варианте текста уже не упоминается.</li>\n<li>Что такое жуг — не сказано ни в одном из трёх заходов; вероятности трёх исходов не названы; обратимость превращения не названа; связь жуга с лиоматом/абакрой не проводится.</li>\n<li>Претензия Славы «Поротая низший владеет почти идентичными способностями Поротая высшего» осталась без исправления.</li>\n<li>Носитель Петли не назван; ограничений, кроме 10 секунд и 10000 повторов, нет.</li>\n<li>Механика превращения многоликого — как переключается, есть ли ограничение по времени и числу — нигде не проговорена.</li>\n<li>Механика «режима оленя» не описана: «Ты продумал режим оленя?» — «Нет ещё».</li>\n<li>Заражение (<a href=\"SP-0056.html\">окаменение и заражение</a>): не сказано, распространяется ли дальше по цепочке и обратимо ли.</li>\n<li>Миниклоны из крови не развиты дальше одного сообщения и к персонажу окончательно не привязаны.</li>\n<li>Единой лестницы разрядов носителей авторы не строили: Геростраты, насильно пробуждённые, низший и высший Поротай, «отряд довольно сильных людей с которыми способный справляться единицы», сверхчеловек с идеальным контролем названы в разных местах и между собой не соотнесены.</li>\n<li>Числовых шкал характеристик нет; единственная числовая пара — «0 атака но 100 защита» у пришельца-«шарика».</li>\n<li>Как Поротай и пришельцы соотносятся с системой лиомата/абакры — не обсуждалось.</li>\n<li>Сходство способностей пристава (окаменение плюс заражение с контролем заражённых) со способностями высшего Поротая (окаменение частей тела плюс контроль над низшими) авторами не отмечено.</li>\n</ol>\n<p><strong>Пришельцы</strong></p>\n<ol start=\"51\">\n<li>Связь ростера 1–10 с многоликим в переписке не заявлена; в обсуждении десятого звучит «у нас нету не кого с исцеляющий абилкой», то есть состав обсуждается как команда, но прямо это не проговорено.</li>\n<li>Соответствие апрельской тройки номерам 1–3 майского ростера прямо не проговорено; номера 4 (шарик) и 5 (кольцо) нигде отдельно не разрабатывались; разработки первых шести в соседних окнах нет.</li>\n<li>Изменяющий форму дублирует полиморфизм Хроматера; какой из двух остался в ростере, из окна не ясно. В утверждении ростера Слава назвал только номера 7, 8 и 9.</li>\n<li>Пришельцы, отклонённые как формы и отнесённые к «отдельным видам расы» (Витрофунгус, Бабуинохвост, Керагуар, Торфолихт, змей из цепи), нигде не размещены во вселенной: где живут, как относятся к людям — не сказано. Змей из цепи одобрен, но карточки и имени не получил.</li>\n<li>Про Тардибовина не сказано прямо, он ли тот «наш качок»/«силач» из соседних реплик окна.</li>\n<li>Планеты Лихтспидов и Торфолихтов существуют только в карточках форм; связи с местом действия и способа попасть туда нет.</li>\n<li>Часть материала по десятому персонажу — картинки (id 167940, 167945, 167954), которых в текстовом архиве нет.</li>\n</ol>\n<p><strong>Прочее</strong></p>\n<ol start=\"58\">\n<li>Мифы как летописи людей с активной абакрой (Мифы как летописи людей с активной абакрой <em>(статьи ещё нет — <a href=\"kb/ID-0056-mify-kak-letopisi-lyudey-s-aktivnoy-abakroy.html\">исходник</a>)</em>): заявлено, реакции соавтора нет, дальше пауза.</li>\n<li>Собранная статья группы <a href=\"GR-0015.html\">Отряд сильнейших</a> «Отряд сильнейших» проставлена по вселенной «Апостол», а записи <a href=\"PS-0063.html\">Отряд сильнейших</a>, Провидец <em>(статьи ещё нет — <a href=\"kb/ID-0050-providec.html\">исходник</a>)</em>, Несоразмерный <em>(статьи ещё нет — <a href=\"kb/ID-0051-nesorazmernyy.html\">исходник</a>)</em> — по «игре бога»; в каталоге «Апостола» от 2025-01-28 отряда как записи нет, туда перешли только двое его бойцов по отдельности и в разные разделы.</li>\n<li>Терминология лиомата и абакры уходит дальше по хронологии в «Цветной мир» (<a href=\"SP-0064.html\">абакра</a>, Тезаурус вселенной <em>(статьи ещё нет — <a href=\"kb/SL-0012-tezaurus-vselennoy.html\">исходник</a>)</em>, Список персонажей Славы <em>(статьи ещё нет — <a href=\"kb/SL-0013-spisok-personazhey-slavy.html\">исходник</a>)</em>, 2024-05-25), но реплики, объявляющей этот переход, в материале нет.</li>\n</ol></div>", "r": [["Мифы как летописи людей с активной абакрой", "kb/ID-0056-mify-kak-letopisi-lyudey-s-aktivnoy-abakroy.html"], ["Провидец", "kb/ID-0050-providec.html"], ["Несоразмерный", "kb/ID-0051-nesorazmernyy.html"], ["Тезаурус вселенной", "kb/SL-0012-tezaurus-vselennoy.html"], ["Список персонажей Славы", "kb/SL-0013-spisok-personazhey-slavy.html"], ["Отряд сильнейших", "GR-0015.html"], ["Закон", "PS-0031.html"], ["Отряд сильнейших", "PS-0063.html"], ["окаменение и заражение", "SP-0056.html"], ["абакра", "SP-0064.html"], ["Организация по отлову существ-преступников", "MR-0006.html"], ["Концепция scp / охота на аномалий", "MR-0007.html"], ["Игра бога", "IS-0012.html"]]}, {"t": "Связи — всё вместе", "a": ["VS-0014--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0031.html\">Закон</a>, <a href=\"PS-0036.html\">Поротай</a>, <a href=\"PS-0037.html\">Дядон Гомбевский</a>, <a href=\"PS-0038.html\">Ояш Бичевский</a>, <a href=\"PS-0039.html\">Адам Тихой</a>, <a href=\"PS-0040.html\">Нерадио Попов</a>, <a href=\"PS-0041.html\">Пи поминает миры:</strong> <a href=\"MR-0006.html\">Организация по отлову существ-преступников</a>, <a href=\"MR-0007.html\">Концепция scp / охота на аномалий</a>, <a href=\"MR-0008.html\">Герострат</a></li>\n<li><strong>Упоминает группы:</strong> <a href=\"GR-0015.html\">Отряд сильнейших</a></li>\n<li><strong>Упоминает истории:</strong> <a href=\"IS-0012.html\">Игра бога</a>, <a href=\"IS-0013.html\">Бессмертный</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0049.html\">Команда Миколая (10 персонажей игры бога)</a>, <a href=\"GR-0050.html\">Команда Славы (персонажи игры бога)</a></li>\n<li><strong>Группы:</strong> <a href=\"GR-0048.html\">Отряд сильнейших (команда «А»)</a>, <a href=\"GR-0049.html\">Команда Миколая (10 персонажей игры бога)</a>, <a href=\"GR-0050.html\">Команда Славы (персонажи игры бога)</a>, <a href=\"GR-0051.html\">Поротаи (низшие и высшие)</a>, <a href=\"GR-0052.html\">Геростраты</a>, <a href=\"GR-0053.html\">Организация, ловящая обнаглевших существ</a>, <a href=\"GR-0054.html\">Раса-помощник («другая раса»)</a>, <a href=\"GR-0055.html\">Агенты, берущие силу от животных</a></li>\n<li><strong>Персонажи:</strong> <a href=\"PS-0031.html\">Закон</a>, <a href=\"PS-0036.html\">Поротай</a>, <a href=\"PS-0037.html\">Дядон Гомбевский</a>, <a href=\"PS-0038.html\">Ояш Бичевский</a>, <a href=\"PS-0039.html\">Адам Тихой</a>, <a href=\"PS-0040.html\">Нерадио Попов</a>, <a href=\"PS-0041.html\">Пил Пончик</a>, <a href=\"PS-0042.html\">Войс Патина</a>, <a href=\"PS-0043.html\">Нат Магнов</a>, <a href=\"PS-0044.html\">Терор Мачилович</a>, <a href=\"PS-0045.html\">Каваи Навалов</a>, <a href=\"PS-0046.html\">Перо Кладович</a>, <a href=\"PS-0047.html\">Аполлон</a>, <a href=\"PS-0048.html\">Максим</a>, <a href=\"PS-0049.html\">Кирилл</a>, <a href=\"PS-0050.html\">Дима</a>, <a href=\"PS-0051.html\">Саша</a>, <a href=\"PS-0052.html\">многоликий</a>, <a href=\"PS-0053.html\">змей из цепи</a>, <a href=\"PS-0054.html\">Тардибовин</a>, <a href=\"PS-0055.html\">Сордекваксус</a>, <a href=\"PS-0056.html\">Витрофунгус</a>, <a href=\"PS-0057.html\">Лихтспид</a>, <a href=\"PS-0058.html\">Керагуар</a>, <a href=\"PS-0059.html\">Торфолихт</a>, <a href=\"PS-0060.html\">пристав</a>, <a href=\"PS-0061.html\">Монстр-маньяк</a>, <a href=\"PS-0062.html\">персонаж Славы (с глазами психа)</a>, <a href=\"PS-0063.html\">Отряд сильнейших</a>, <a href=\"PS-0064.html\">Призрак</a>, <a href=\"PS-0065.html\">Сверхчеловек с идеальным контролем</a>, <a href=\"PS-0383.html\">Имитатор</a>, <a href=\"PS-0066.html\">Пришельцы (ростер 1–6)</a>, <a href=\"PS-0067.html\">Псиклон</a>, <a href=\"PS-0068.html\">Омниграф</a>, <a href=\"PS-0069.html\">Хроматер</a>, <a href=\"PS-0070.html\">Металлоид</a>, <a href=\"PS-0071.html\">Пироманта</a>, <a href=\"PS-0072.html\">Нейроглиф</a>, <a href=\"PS-0073.html\">Пришельцы 7–10 (второй вариант)</a>, <a href=\"PS-0074.html\">Пиромант Эшер</a>, <a href=\"PS-0075.html\">Дымовой чел</a>, <a href=\"PS-0076.html\">10-й персонаж (целитель)</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["VS-0014--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/VS-0014.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["VS-0014-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/VS-0014/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым чинить <code>ID-0050</code> «Провидец»: три ссылки, статьи нет, 14 549 знаков — крупнейший неразобранный кусок этой вселенной. Он же единственный отсюда, кто ушёл дальше: в реестре «Апостола» от 2025-01-28 Провидец стоит в разделе «Сторонний силы». То есть дыра тянет не только местные записи, но и соседнюю вселенную.</p>\n<p>Следом — <code>ID-0041</code> «Турнир»: три ссылки, статьи нет, 4 216 знаков. Это тем дороже, что турнир и есть форма всей вселенной: игра объявлена как «соревнование и испытания», порядок расписан по шагам (отношения в командах → турнир → нейронка пишет исход), приз назначен. Ни одного хода в материале нет. И <code>ID-0039</code> «Агенты, берущие силу от животных» — три ссылки при 1 877 знаках: на неё ссылаются, а под ней меньше абзаца.</p>\n<p>Отдельная дыра, которую не закрыть ничем, кроме архива: пятеро персонажей Славы. Против десяти карточек Миколая (все за 2024-04-02, id 153325–153334) в базе пять — id 153365, 153366, 153368, 153530, 153531. Заявленные «20 человек» и «2 группы» существуют только как число в объявлении, и на этом числе стоит вся конструкция.</p>\n<h3>С чего начать</h3>\n<p>Провидец в базе есть, но разъехался по трём соседним записям, и все три жирные: <code>PS-0063</code> «Отряд сильнейших» (29 087), <code>IS-0013</code> «Бессмертный» (44 010), <code>SP-0059</code> «Лиомат» (18 344). Всё из двух окон — w0032 (2024-05-07, id 166473–166897) и w0033 (2024-05-09, id 167303–167343). Сшивать надо оттуда. Важная оговорка: развёрнутая механика петли на 10 000 циклов в w0033 — машинный текст с обращением на «вы», авторской формулировки там нет. Значит, если она вообще была, она в архиве раньше 2024-05-07 или в голосовых.</p>\n<p>Турнир — в архив, и адрес узкий: 2024-04-03, id 153452–153506, где схема задана, и дальше по 2024-04-08 (там уже лежит <code>SL-0010</code>, задание про изображение, то есть авторы переключились). Если хотя бы один ход был сделан, он в этом промежутке. Если нет — это надо зафиксировать как факт, а не как пробел.</p>\n<p>Пятеро персонажей Славы — архив после id 153531 (2024-04-03, 13:59) и 2024-04-05. Там же искать, входит ли пристав (<code>PS-0060</code>, 10 690) в двадцатку: он заявлен 2024-04-05, и в базе это помечено как неясность.</p>\n<p>Тип бессмертия «4» (id 166757) — единственный случай, когда ответ лежит не в архиве и не в базе, а во внешней вики, на которую дана ссылка. Расшифровка стоит одного клика.</p>\n<h3>Как развивалось</h3>\n<p>Заявили 2024-04-02 в 21:48, ровно через минуту после «Сносим вселенную» — закрытие предыдущей линии и объявление этой идут подряд, в одну минуту, и связи между ними в чате нет.</p>\n<p>Ограничили в ту же ночь: по десять человек от каждого, персонажи берутся из своего окружения, «способности что бы подходили под характер ну хотя бы чуть чуть и чтобы не были прям нарушающий баланс», плюс требование фотографий прототипов.</p>\n<p>Забыли на следующее утро — и признались вслух: «Я та про игру сказал в полусонном состояния когда спать ложился поэтому не знаю что дальше» (153408). Порядок игры Миколай расписал днём того же дня; после этого к нему не возвращались.</p>\n<p>Вернулись 2024-05-07, но уже не к игре: отряд сильнейших, поиск названия для сверхчеловека (Герострат), лиомат, абакра, гелиогормоны. За два дня написана биология сверхспособностей на два сведённых текста подряд. С двадцаткой апреля этот слой не связан ни одной репликой. Кончину не объявили: 2024-05-25 просто началась следующая вселенная.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для отряда правило баланса названо прямо и работает: «через чур инбаласный не надо ( ну или надо только с ограничением )» (166837), «Оке пон, мери сьюшек не делать» (166839), и дальше каждый кандидат проходит по нему — Логос номосу требуют ограничение, Призраку слабое место называет сам автор, щекотание атомов ослабляют отдельным правилом.</p>\n<p>Для двадцати участников игры правила того же рода нет. Там сказано только «чтобы не были прям нарушающий баланс» — без требования слабости, без разбора. И результат виден в карточках: у Аполлона «мастер любого оружия, боевые искусства, механик, электрик, то бишь мастер любого физического труда», у Войс Патины строки со способностью нет вообще. При этом драться между собой должны были именно они, а не отряд. Место показано, дальше не иду.</p>\n<h3>Отклик</h3>\n<p>Двадцатка — лучшее, что тут есть, и именно она осталась неразыгранной. «Чем слабее удар, тем больше урона», «за каждый ответ на его подъебку тот кто ответил получает адскую головную боль», «кто услышит его игру на гитаре перестаёт двигаться» — это способности, выведенные не из физики и не из стихий, а из того, как человек ведёт себя в компании. Персонажи собраны из знакомых, и сила у каждого — доведённая до абсурда черта характера. Такое обычно и есть самое живучее в любительском вымысле, и здесь оно продержалось ровно одну ночь: наутро игра сдулась, а через месяц авторы уже писали про гелиогормоны и иденоновую кислоту. Отдельно нравится Перо Кладович — «Ну так, чисто кабанчик на побегушках, 698 лет». Возраст не объяснён, не обыгран и ни к чему не привязан, и от этого он хорош; объяснять его было бы хуже.</p></div>", "r": []}];</script>
