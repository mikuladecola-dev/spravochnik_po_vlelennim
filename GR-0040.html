<script>const BASE="";const DOCNAME="Семья";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0040-S01", "GR-0040--chto-eto"], "h": "<p>Род (семья) во вселенной «монстры», у членов которого с рождения есть сосуд, поддающийся изменению, и наследственная структура, позволяющая расплавить и заново вырастить структуру способности. Вся разработка укладывается в один день — 30 ноября 2024 (окно w0065, id 263344–263749).</p>\n<p>В переписке эта сущность так и называется — «семья», «моя семья», «эта семья». Собственного названия у рода нет: как род зовут, в переписке не сказано.</p>\n<p>Разработка идёт в две руки. Слава задаёт рамку — три элемента и комбинации, врождённое изменение сосуда, резонанс. Миколай достраивает под это механику кристаллов: кристаллизацию энергии, затравку, наследственный механизм переплавки. Слава прямо распределяет работу: «И третий семью должен ты покинуть идею» (263686).</p>\n<p>Отдельно нужно отметить: разведка записала это как группу, и по существу это действительно род, а не одиночный персонаж — речь всё время идёт во множественном числе («у них с рождения сосуд», «у разных членов семьи разное допущение»). Но в базе сущность лежит как персонаж (<a href=\"PS-0170.html\">Семья</a>), и поимённых членов семьи в чате не названо ни одного. То есть группа заявлена как факт мира, но не населена.</p>", "r": [["Семья", "PS-0170.html"]]}, {"t": "Состав", "a": ["S02", "GR-0040-S02", "GR-0040--sostav"], "h": "<p>Поимённого состава нет. Ни одного члена семьи в переписке не назвали — ни именем, ни прозвищем, ни ролью. Список members в плане пуст.</p>\n<p>Единственное, что о составе сказано: члены семьи различаются между собой по параметрам механизма — «у разных членов семьи разное допущение с разными параметрами поиграть может будет» (263727). Кто эти члены и сколько их — не обсуждалось.</p>", "r": []}, {"t": "Общие способности группы", "a": ["S03", "GR-0040-S03", "GR-0040--obschie-sposobnosti-gruppy"], "h": "<p>Устройство способностей во вселенной задано рамкой из трёх элементов, которую 30 ноября выкладывает Слава: «Есть три элемента / Сосуд тело структура» (263677). Способности выводятся из комбинаций этих элементов. В окне названы две комбинации (263680):</p>\n<ul>\n<li>«Структура+тела=глазки»</li>\n<li>«Сосуд+тело=изменяющую сосуд»</li>\n</ul>\n<p>Миколай сразу добавляет к этому «и некоторые наследственые структуры по типу глаз», с оговоркой «но это можно в структуру кинуть лан» (263678–263679) — то есть наследственные структуры-глаза он предлагает не выделять отдельным элементом, а отнести к структуре.</p>\n<p><strong>Изменение сосуда (<a href=\"SP-0122.html\">Изменение сосуда</a>)</strong> — комбинация сосуд+тело, врождённая. Формулировка Славы: «У них с рождения сосуд который они способны по прихоти изменить ( но не слишком сильно потому что сосуд может не выдержать)» (263684). Ограничение задано тут же и в тех же словах: менять не слишком сильно, потому что сосуд может не выдержать.</p>\n<p>Что даёт изменение сосуда: «невероятный большой объем сосуд для накопления энергия, идеальная тело с высокими физическими показателями и развитыми всеми чувствами и ещё что нибудь придумаю» (263684). Список бонусов оставлен открытым самим автором — «и ещё что нибудь придумаю».</p>\n<p><strong>Резонанс сосуда и структуры (<a href=\"SP-0123.html\">Резонанс сосуда и структуры</a>)</strong> — заявлен как пик изменения сосуда и как отдельный новый приём: «Ну пик это когда они могут изменить сосуд на структура то бишь сделать сосуд идентичный с структурой что приведет резонансу с сосудом и структурой и повышает все характеристики и т п. Типо новый прием там» (263684). Механика резонанса дальше не расписывалась — назван только принцип: сосуд делается идентичным структуре, все характеристики повышаются.</p>\n<p><strong>Глазки (<a href=\"SP-0124.html\">Глазки</a>)</strong> — комбинация структура+тело, наследственные структуры по типу глаз. Собственная механика глаз в окне не раскрыта, зафиксировано только место в системе комбинаций. Глазки упоминались и раньше как самостоятельная задача: Миколай уточняет «ты про глазки идею просил или про 2 новые?» (263592), и Слава отвечает «2 новых» (263669) — то есть разработку глазок отложили в пользу двух других идей.</p>\n<p><strong>Наследственный механизм смены структуры (<a href=\"SP-0125.html\">Наследственный механизм смены структуры</a>)</strong> — главная фамильная особенность, её достраивает Миколай вечером того же дня (263727). Механизм опирается на два общемировых закона.</p>\n<p>Первый — кристаллизация энергии (<a href=\"MR-0073.html\">Кристаллизация энергии</a>): «энергия в сосуде жидкая с рождения и всегда, но конкретно до 7 лет кристаллизуется часть энергии, на этом кристалле написаны данные отраженные в опыте и определяющие способность». Структуру Миколай напрямую отождествляет с кристаллом — «как я раньше обозвал твою структуру - кристаллы». Обоснование, почему обычные люди на такое не способны, он даёт через аналогию с настоящими кристаллами: процесс выращивания обратим, но сложность разная, «например процессоры это монокристаллы и информацией и их не целесообразно и не практично плавить и кристализировать заново, после записывая информацию, проще чистое вещество взять. поэтому никто из людей не может менять свою структуру, это невероятно сложно».</p>\n<p>Второй — затравка (<a href=\"MR-0074.html\">Затравка</a>): для формирования кристалла нужна затравка, она появляется при рождении, «и благодаря ней появляется возможность кристаллизовать энергию через опыт». Без затравки расплавленный кристалл не восстановить: «даже если другие расплавят этот кристал они не создадут его заново не за что».</p>\n<p>Сам механизм семьи: «у них есть структура наследственная, с механизмом упрощающим этот процесс, которых для других невозможен изв сложности. они в течении 2 дней могут давить в определённую точку для изменения агрегатного состояния структуры способности. расплавив они лишаются структуры способности и по сути становятся как новорождённые» (263727). Второе отличие от всех прочих — «у этой семьи наследственная структура имеет возможность создать искусственно затравку».</p>\n<p>Цена операции названа отдельно и без смягчений: «я, не просто так сказал что они как новорождённые. для кристаллизации новой структуры им нужно то же время что и с момента рождения и она также будет неразвита» (263727).</p>\n<p>Тут же Миколай оговаривает, что забыл раньше сказать важную вещь про природу способностей вообще: «я тогда забыл то что не просто кто-то пишет способность а это результат опыта» (263728).</p>\n<p><strong>Традиционное семейное обучение.</strong> Надстройка того же вечера (263734): «детский опыт довольно мистический, но не всегда сильный, в осознанном возрасте они могут пройти традиционное семейное обучение 2 года, а после развиваться так как пожелают, что позволит создать способности намного сложнее тех что появляются с рождения». То есть после переплавки семья не просто отращивает утраченное, а может вырастить структуру сложнее врождённой — за счёт того, что опыт набирается уже осознанно.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Приоритет дыр — не материал авторов</b>\n<p>Вторая по цене — <code>SP-0124</code> («Глазки»): две входящие ссылки, статья 5,6 КБ, база 2,8 КБ, и механики нет ни там, ни здесь. Это единственная из четырёх способностей рода, где не описано вообще ничего, кроме места в системе комбинаций. Для сравнения, у соседей по той же комбинаторике материал есть: <code>SP-0125</code> — 7,7 КБ базы, <code>MR-0074</code> (Затравка) — 4,7 КБ при трёх ссылках, <code>MR-0073</code> (Кристаллизация энергии) — 7,3 КБ при четырёх, <code>MR-0070</code> («Энергия, сосуд и структура») — 5,8 КБ при четырёх. Пустая клетка в системе, где остальные клетки заполнены.</p></div>", "r": [["Изменение сосуда", "SP-0122.html"], ["Резонанс сосуда и структуры", "SP-0123.html"], ["Глазки", "SP-0124.html"], ["Наследственный механизм смены структуры", "SP-0125.html"], ["Кристаллизация энергии", "MR-0073.html"], ["Затравка", "MR-0074.html"]]}, {"t": "Чем участники отличаются друг от друга", "a": ["S04", "GR-0040-S04", "GR-0040--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p>Единственное, что сказано о различиях внутри рода: «у разных членов семьи разное допущение с разными параметрами поиграть может будет» (263727). Формулировка оставлена как заготовка на будущее — какие именно параметры и допущения различаются, не названо. Ни одного конкретного носителя другого набора параметров в переписке нет.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S05", "GR-0040-S05", "GR-0040--otnosheniya-s-drugimi-gruppami"], "h": "<p>Отношений с другими названными группами в переписке нет. Есть одно противопоставление — семье противопоставлены обычные люди со способностями, и оно проговорено прямо, в связке с вопросом баланса (263734):</p>\n<p>«это обычные люди со способностями, не обязательно семейники самые сильные, это нечестно, но обычные не могут менять способность и обречены жить с тем что есть, а вот моя семья способна изменить на более привлекательную и крутую в основном возрасте».</p>\n<p>То есть разграничение проходит не по силе, а по одной возможности: обычные «обречены жить с тем что есть», семья может сменить способность.</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S06", "GR-0040-S06", "GR-0040--kak-menyalas"], "h": "<p><strong>2024-11-30, утро (id 263344–263356).</strong> Служебный разгон, содержания нет. Слава требует идей по семье («Чё идей по семье нету»), Миколай отвечает, что идей нет. Слава ставит срок: «Чтобы сегодня / Было хотя бы одна идею».</p>\n<p><strong>2024-11-30, 20:16–20:42 (id 263587–263686).</strong> Слава выкладывает рамку. Появляются три элемента (сосуд, тело, структура), две комбинации (глазки = структура+тело, изменение сосуда = сосуд+тело), врождённая способность семьи менять сосуд с ограничением по прочности сосуда, перечень бонусов и резонанс сосуда и структуры как пик. Миколай уточняет статус наследственных структур-глаз. Тут же выясняется, что тема растений («трава») Славой отложена — «Думал / Но отложил» (263674–263675), а разработка глазок отложена в пользу двух новых идей.</p>\n<p><strong>2024-11-30, 21:08–21:38 (id 263710–263734).</strong> Миколай достраивает механику. Сначала он приостанавливает выкладку — «одну деталь ток щас вспомнил», «я думал типа всё умный, но вспомнил кое че» (263717–263718), — и через двадцать минут выдаёт цельный блок: кристаллизация энергии до 7 лет, запись опыта на кристалле, аналогия с процессорами, невозможность смены структуры для обычных людей, наследственный механизм переплавки за два дня, затравка и искусственное её создание, состояние новорождённого после переплавки, разные параметры у разных членов семьи. На вопрос Славы «И где здесь плюсы ? / Что сделай эту семью могучий» (263729–263730) отвечает: «они невъебено могучая» (263733). Следом добавляет обучение 2 года и оговорку про баланс: «и ваще не хочу я делать их имбалансными».</p>\n<p><strong>2024-11-30, 21:39–21:44 (id 263735–263749).</strong> Слава вариант отклоняет. На вопрос «че думаешь?» отвечает «Ну не», причина — «Без бафоф» (263736–263738). Миколай не соглашается с оценкой: «это сплошной баф как по мне / я не понимаю» (263739–263740). Слава смягчает: «Ну идею ты мне подкинул / Молодец» (263741, 263743). На этом обсуждение семьи в окне заканчивается, дальше идёт разговор о самом формате их работы.</p>\n<p><strong>Отклонённое.</strong> Вся достройка Миколая от 21:30–21:38 (id 263727–263734) — кристаллы, затравка, механизм переплавки, обучение — заявлена и в том же вечере забракована Славой с формулировкой «Без бафоф». Отменённой она при этом не объявлена: Слава засчитывает её как поданную идею, а Миколай остаётся при своём — «это сплошной баф как по мне». Чем закончился спор о том, есть в механизме бафы или нет, в переписке не сказано.</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "GR-0040-S07", "GR-0040--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет: ни один член семьи не назван.</li>\n<li>Название семьи (рода) нигде не звучит.</li>\n<li>Вселенная в самом окне не объявлена — «монстры» проставлены по дате.</li>\n<li>Иерархия внутри рода не обсуждалась.</li>\n<li>Механика глазок не раскрыта: зафиксировано только место в системе комбинаций (структура+тело), сама работа глаз — нет.</li>\n<li>Детали резонанса сосуда и структуры не расписаны, только принцип.</li>\n<li>Список бонусов от изменения сосуда открыт самим автором: «и ещё что нибудь придумаю».</li>\n<li>Какие именно «разные допущения с разными параметрами» у разных членов семьи — не названо, оставлено на потом.</li>\n<li>Что за точка, в которую давят два дня, и как её находят — не сказано.</li>\n<li>Третья идея, которую Слава заказал Миколаю («И третий семью должен ты покинуть идею», 263686), в окне не появилась.</li>\n<li>Спор о балансе остался нерешённым: вариант отклонён как «без бафоф», встречное «это сплошной баф» не снято.</li>\n<li>Тема растений/травы отложена Славой и в этом окне не разрабатывалась.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0040--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0170.html\">Семья</a></li>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0122.html\">Изменение сосуда</a>, <a href=\"SP-0123.html\">Резонанс сосуда и структуры</a>, <a href=\"SP-0124.html\">Глазки</a>, <a href=\"SP-0125.html\">Наследственный механизм смены структуры</a></li>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0073.html\">Кристаллизация энергии</a>, <a href=\"MR-0074.html\">Затравка</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0040--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0040.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0040-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0040/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первое, что надо чинить, — раздвоение самой сущности. Род лежит в базе дважды: <code>PS-0170</code> («Семья», персонаж) — 16,2 КБ статьи, 13,6 КБ базы, две входящие ссылки; и <code>GR-0040</code> (группа) — 18,9 КБ статьи, база 0, ноль входящих ссылок. Весь материал и все ссылки ушли в запись под видом «персонаж», а под видом «группа» стоит текст без базы, на который никто не ссылается. Статья сама это отмечает, но как замечание; по числам это главная дыра, потому что от неё зависит, куда вообще указывают связи всей ветки.</p>\n<p>Вторая по цене — <code>SP-0124</code> («Глазки»): две входящие ссылки, статья 5,6 КБ, база 2,8 КБ, и механики нет ни там, ни здесь. Это единственная из четырёх способностей рода, где не описано вообще ничего, кроме места в системе комбинаций. Для сравнения, у соседей по той же комбинаторике материал есть: <code>SP-0125</code> — 7,7 КБ базы, <code>MR-0074</code> (Затравка) — 4,7 КБ при трёх ссылках, <code>MR-0073</code> (Кристаллизация энергии) — 7,3 КБ при четырёх, <code>MR-0070</code> («Энергия, сосуд и структура») — 5,8 КБ при четырёх. Пустая клетка в системе, где остальные клетки заполнены.</p>\n<p>Третье: <code>GR-0042</code> («Сверхлюди (люди с сосудом)») — статья на 27,2 КБ, база 0, ноль входящих ссылок. Это ровно те «обычные люди со способностями», которым семья противопоставлена в разделе об отношениях. Противопоставление в тексте есть, ссылки на противопоставленную сторону нет, и самая объёмная статья вселенной висит несвязанной.</p>\n<h3>С чего начать</h3>\n<p>В архив за содержанием почти не надо — сначала база. Сверить <code>GR-0040</code> с <code>PS-0170</code>: там 13,6 КБ, которых у группы нет, и обе входящие ссылки. Потом связать с <code>GR-0042</code> — сторона противопоставления уже расписана на 27 КБ, ссылку просто не поставили. Дальше проверить <code>MR-0072</code> («Три элемента», 3,5 КБ, две ссылки) против <code>MR-0070</code> (5,8 КБ, четыре ссылки): рамка из трёх элементов, с которой начинается вся разработка семьи, описана в двух записях разного размера.</p>\n<p>В архив — за тремя вещами, все три с ориентирами. Механика глазок: Миколай 30 ноября спрашивает «ты про глазки идею просил или про 2 новые?» (263592), значит глазки заказывали раньше — искать до 2024-11-30, вокруг слова «глаза», «глазки». Третья идея, которую Слава заказал прямо (263686), в окне не появилась — смотреть 1–2 декабря. И итог спора о балансе: разговор обрывается 30 ноября в 21:44, встречное «это сплошной баф как по мне» без ответа — проверять следующее окно, был ли возврат.</p>\n<h3>Как развивалось</h3>\n<p>Всё уложилось в один день, и по датам это видно поминутно. Утром 30 ноября — требование с дедлайном: «Чтобы сегодня / Было хотя бы одна идею». В 20:16–20:42 заявили рамку: три элемента, две комбинации, врождённое изменение сосуда — и тут же ограничили, в тех же словах, что и заявили: «но не слишком сильно потому что сосуд может не выдержать». В 21:08 второй автор притормаживает выкладку («одну деталь ток щас вспомнил») и к 21:38 достраивает механику целиком, вместе с ценой. В 21:39 её отклоняют — «Ну не», «Без бафоф». В 21:44 спор закрывается не решением, а смягчением: «Ну идею ты мне подкинул / Молодец». Забыть не успели — вернуться тоже: окно заканчивается разговором уже не о семье, а о том, как они вдвоём работают. Заказанная третья идея не появилась, отложенная раньше тема травы не вернулась.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для изменения сосуда ограничение названо прямо и в тот же момент, что и сама способность: менять можно, «но не слишком сильно потому что сосуд может не выдержать». Пиком того же изменения объявлен резонанс — сосуд делается идентичным структуре, то есть изменение доводится до предела. Никакого ограничения для резонанса не названо. Для обычного изменения предел прочности сформулирован, для предельного случая того же самого действия — нет.</p>\n<h3>Отклик</h3>\n<p>Сильное здесь — цена. «Расплавив они лишаются структуры способности и по сути становятся как новорождённые», и следом, чтобы не осталось лазейки: «для кристаллизации новой структуры им нужно то же время что и с момента рождения и она также будет неразвита». Родовое преимущество стоит целой жизни заново — это не бонус, это выбор, который нельзя сделать бездумно, и мир от него сразу становится взрослее. Хорошо и то, откуда механика выведена: не «потому что магия», а из свойств настоящих кристаллов и из фразы, что структура — «результат опыта», не написанная кем-то способность. Отсюда же тянется лучшая деталь всего куска: детский опыт «довольно мистический, но не всегда сильный», а осознанный — слабее по мистике, зато позволяет вырастить сложнее. То есть переплавка это не откат, а обмен странности на мастерство. И на всём этом — «Без бафоф» в ответ, через минуту после того, как цена названа прямым текстом. Не берусь судить, кто прав; но то, что спор так и стоит в записи открытым, с обеими репликами рядом, читается честнее любого разрешения.</p></div>", "r": []}];</script>
