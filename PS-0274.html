<script>const BASE="";const DOCNAME="Начальник с завода";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0274-S01", "PS-0274--proishozhdenie"], "h": "<p>Начальник Александра Титовского на заводе. Имя не названо — в переписке он всюду «начальник».</p>\n<p>Его связь с героем раскрывается позже самого знакомства (2025-05-19, id 328118). Он служил вместе с отцом Александра: «связи. Я о твоём отце. Мы с ним вместе служили. И после армии поддерживали связь. Вот именно с помощью него ты и попал на завод». До этого разговора Александр не знал, что устроился на завод и быстро пошёл по карьерной лестнице не сам: начальник подводит его к этому вопросом — «как думаешь. Почему ты так быстро устроился на работу без опыта. И быстро начал подниматься по карьерной лестнице».</p>\n<p>Причина, по которой от Александра это скрывали, названа его же словами: «ты же у нас гордый. Человек, который хочет добиться всё сам. Человек думающий, что одних стараний будет достаточно. Вот поэтому не сказали. Твой отец хотел сохранить тебя тем. Радостным, энергичным и верующий, что всё сможет».</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0274-S02", "PS-0274--vneshnost"], "h": "<p>Описания нет. В тексте отмечены только мимика и жесты по ходу сцен: «резко жал губы. Словно еле сдерживаясь, чтобы не заплакать», «прикусив губу», «с каменненым лицом», «Начальник жимал кулаки», «слегка улыбаясь».</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0274-S03", "PS-0274--harakter"], "h": "<p>Первое, что он делает, когда Александр приходит в себя после звонка о гибели родителей, — приводит его в чувство ведром холодной воды, а затем убирает свидетелей: «Начальник увидев меня в таком состоянии. Поступил по человеческий. Отогнал всех мужиков. И повёл меня в кабинет, что бы никто не видел мои слезы».</p>\n<p>Не расспрашивает. «Он не спрашивал. \" Что произошло, что с тобой ? \" И тому подобные вопросы. Он лишь ждал, когда я сам скажет». Наливает коньяк и ждёт, пока герой заговорит сам.</p>\n<p>Сам держится с трудом: услышав рассказ, «быстро взял бутылку коньяка. И залпом выпил одну/четверть. Прищурившись от резкого вкуса».</p>\n<p>Настойчив и не отступает, когда герой сопротивляется. «-ты должен рассказать сестре», затем аргумент: «лучше ты скажешь. Не жили какой то незнакомец». Возражения снимает сразу и по-деловому: «ты не бойся. Оплачиваемый отпуск мы тебе поставим. Ты главный сестре расскажи» — это сказано «как то ласково. Как бы смешно это не звучало». Когда Александр всё равно не хочет, ведёт силой: «начальник схватил меня за руку и повёл к машине. Держал он крепко и надёжно».</p>\n<p>Остаётся рядом без объяснений и не требуя за это ничего. Довезя героя до дома сестры (три часа дороги), он не уезжает: «Начальник же уснул в машине. Да он остался меня ждать. Не знаю зачем? Не знаю почему?».</p>\n<p>За вмешательство не извиняется по существу — только формально: выбив дверь в квартиру, говорит «Прости за дверь» — «ни разу не виноватом голосом».</p>\n<p>Крики в свой адрес выслушивает молча — «мои крики начальник слушал с каменненым лицом».</p>\n<p>Главная его сцена — выбор, что сказать герою, который спрашивает «зачем?» жить. Отказывается от утешений, которые считает бесполезными: «я бы мог сейчас говорить. О том что ты можешь начать с начала. Завести семью. Но я понимаю, что психологии, тебя этим уже полностью облили. Поэтому скажу так. Отомсти тем кто убил твою сестру». Перед этим он «долго колебался. Словно знал ответ. Но боялся результато».</p>\n<p>Внутренний расчёт приведён прямо: «Что лучше пусть мстит и на убивает. Не жили будет желать умереть». Рядом — страх: «страх, что по его инициативе могут умереть люди и даже невиновный. Пугали». И то, что этот страх перевешивает: «Но ведь это сын моего друга. Я не могу его бросить».</p>\n<p>Он понимает последствия своих слов в момент, когда их произносит: «Начальник жимал кулаки. Прекрасно понимая, что сейчас возможно создаёт убийцу. Но и так же прекрасно понимал. Что не смог бы поступить по-другому».</p>\n<p>Последняя его реплика — попытка удержать хоть что-то: «-но не забывай. Этим ты их не вернешь- пытался начальник поддержать его человеческую часть. Хотя он не был уверен, что это поможет».</p>\n<p>Отдельно отмечена его неуверенность в один момент: на вопрос «разве их не арестовали» он отвечает «нет» — «сказал начальник уже не решительным голосом. И отводя взгляд от глаз уже пылающих стремлением».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0274-S04", "PS-0274--sposobnosti"], "h": "<p>Ничего сверхъестественного за ним не значится; в переписке он действует как обычный человек.</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0274-S05", "PS-0274--svyazi-s-drugimi"], "h": "<p><strong>Александр Титовский</strong> — подчинённый на заводе и сын друга. Отношение к нему двойное: как к работнику (отпуск, «Тебя давно не было на работе. Поэтому я поехал проведать») и как к чужому ребёнку, за которого он отвечает перед погибшим товарищем.</p>\n<p><strong>Отец Александра</strong> — сослуживец, с которым он поддерживал связь после армии и через которого Александр попал на завод. В переписке он погибает в аварии вместе с матерью героя до начала этих сцен; сам он в тексте не появляется, только в воспоминании начальника — «Погружаясь в воспоминания про службу».</p>\n<p><strong>Сестра Александра</strong> — школьница, ученица седьмого класса. Начальник везёт героя к ней и требует, чтобы о гибели родителей ей сказал именно брат, а не посторонний.</p>\n<p><strong>Палач</strong> — осколок сознания Александра. Прямого взаимодействия с начальником нет, но именно после его слов о мести «палач, живший всё это время в Саше. Начал обретать свободу. И начал выбираться из сознания, который он казнил сотний раз. В настоящее мир».</p>\n<p><strong>Вина</strong> — тема, к которой персонаж привязан в записи.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0274-S06", "PS-0274--kak-menyalsya"], "h": "<p>Обе версии записаны в один день, 2025-05-19, в окне w0097, и не заменяют друг друга, а идут подряд по сюжету.</p>\n<p><strong>Версия 1 — id 328112–328113.</strong> Первое появление. Начальник приводит героя в чувство, отгоняет рабочих, отводит в кабинет, поит коньяком, требует, чтобы тот сам сказал сестре, обещает оплачиваемый отпуск, везёт три часа до дома и ночует в машине у дома. О его связи с семьёй героя здесь ничего не сказано — на этом этапе он выглядит просто как начальник, поступивший «по человеческий».</p>\n<p><strong>Версия 2 — id 328118.</strong> Разговор после того, как начальник спас героя. Здесь раскрывается предыстория (служба с отцом, устройство на завод по связям, договорённость молчать об этом) и делается сознательный выбор — дать герою цель мести, понимая, что тем самым создаётся убийца. Ничего из первой версии не отменяется; добавляется слой, объясняющий, почему он вообще не отставал от героя.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0274-S07", "PS-0274--chto-s-nim-stalo"], "h": "<p>В этих сообщениях его линия обрывается на разговоре в квартире. Что с ним дальше — в переписке не сказано.</p>\n<p>Последнее описанное его действие в первой версии: утром герой стучится в закрытое окно машины, начальник просыпается, и они едут на завод — «Нет не чтобы работать. Хотя начальник наверное, чтобы работать. А я за машиной». Последнее во второй версии — его слова про месть и попытка добавить «Этим ты их не вернешь».</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0274-S08", "PS-0274--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имя не названо. В записи это помечено отдельно как неясность окна w0097.</li>\n<li>Возраст, внешность, семья начальника — ничего не сказано.</li>\n<li>Как погибла сестра Александра, в этих сообщениях не описано: в первой версии она жива и учится в седьмом классе, во второй версии начальник уже говорит «Отомсти тем кто убил твою сестру». Что произошло между этими двумя точками, в приведённых сообщениях отсутствует.</li>\n<li>Кто её убил и почему их не арестовали — не сказано; начальник только отвечает «нет» на вопрос об аресте.</li>\n<li>Обстоятельства состояния, в котором начальник нашёл героя, даны только с его слов: «Тебя давно не было на работе. Поэтому я поехал проведать. А ты не открывал дверь. Но я услышал хрип, а после падения бутылки. Поэтому выбил дверь и вызвал скорую». Что именно герой принял, в реплике не названо.</li>\n<li>Знал ли он что-то о виновниках аварии, в которой погибли родители, — не сказано; о них думает уже сам Александр, «Не только тем, кто убил сестры. Но и тем, кто виноват в аварии».</li>\n<li>Дальнейшая судьба персонажа в переписке не прослежена.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["PS-0274--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-05-19</td>\n<td>328112–328113</td>\n<td>w0097</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-05-19</td>\n<td>328118–328118</td>\n<td>w0097</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0274-nachalnik-s-zavoda.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0274--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0274.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0274-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0274/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — отец Александра. У него нет ни статьи, ни даже строки в <code>blockers.json</code>: сущность не заведена вообще. При этом на нём стоит вся вторая версия этого персонажа (служба, устройство на завод, просьба молчать), его же «Связи с другими» и объяснение, почему начальник вообще не отстаёт от героя; через него же завязана линия в <code>PS-0271</code> и мотивировка поездки в <code>PS-0273</code>. Для сравнения: шут из одной сцены (<code>PS-0276</code>, 8.8 КБ базы) и клоуны, которых никто не видел вблизи (<code>PS-0275</code>, 29.8 КБ базы), записи получили. Человек, на котором держатся три статьи, — нет.</p>\n<p>Второе — имя. Не косметика: «начальник» тут ещё и должность, а завод как место не описан, поэтому персонаж и его роль в реестре слипаются. Смежная запись <code>MN-0018</code> «завод имени Попова» — из другой истории и другой вселенной, спутать легко.</p>\n<p>Третье — весь куст «Вины» изолирован: <code>ssylok_na_nego</code> = 0 у <code>PS-0271</code>, <code>PS-0272</code>, <code>PS-0273</code>, <code>PS-0274</code>, <code>PS-0275</code>, <code>PS-0276</code> и у <code>IS-0060</code>. Связи описаны словами, но не проставлены ни в одну сторону.</p>\n<h3>С чего начать</h3>\n<p>В базе есть материал по этому персонажу, которого в статье нет вовсе, и лежит он в соседней записи. <code>IS-0060</code>, окно w0099, 2025-05-27, id 330692–330744: там единственное прямое обсуждение начальника соавторами. Слава ждал претензии — «Я думал о слишком хорошим начальником», «Ну так он слишком добрый»; Миколай, наоборот, его защитил: «мне реально понравился начальник», «я не вижу его неестественным если честно», «я на своём опыте знаю, что такие люди бывают. настолько добрые», «да я не начальник», «но я верю что такое может существовать». Статья собрана только из текста истории; авторская рефлексия по персонажу осталась в записи об истории. Туда же — 328118 целиком, он есть в сплошном тексте <code>PR-0080</code> (328111–328118).</p>\n<p>В архив — за более ранним. Окна w0095 (2025-05-16, id 326859–326868) и w0096 (2025-05-17, id 327121–327124): пролог, который отдельно не скидывался, и «три раза изменил её концепцию» без расшифровки. Если начальник в какой-то из трёх концепций был другим, следы там.</p>\n<h3>Как развивалось</h3>\n<p>2025-05-19, за один заход. 328112–328113 — заявлен как просто хороший человек: ведро воды, разогнанные мужики, коньяк, «он не спрашивал», три часа за рулём и ночь в машине у чужого дома. Мотива нет и не объясняется — герой сам недоумевает: «Не знаю зачем? Не знаю почему?». 328118 — ограничено задним числом: доброта получает основание (служба с отцом, долг перед погибшим другом), и тут же персонаж делает выбор, который отменяет его прежнюю роль спасателя. 05-27 — обсуждён вслух, причём автор ждал претензии, а получил похвалу; на этом обсуждение закрылось. Дальше не возвращались: в нейросетевом разборе 2026-02-08 названы палач, звук железа и мысль про «делает их живыми» — начальник не назван. Заявлен без объяснения, объяснён задним числом, обсуждён один раз, брошен.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Правило вины в мире названо и названо широко: она приходит и к невиновному — «Даже если ты не виноват. То всё равно отхватишь, это чувство вины. Словно ты мог, что-то сделать, чтобы предотвратить это. Но не сделал». Для начальника, который в этой же сцене «прекрасно понимая, что сейчас возможно создаёт убийцу» всё-таки говорит «Отомсти», того же правила не проговорено. У него страх названо — «страх, что по его инициативе могут умереть люди и даже невиновный», — а вина нет, хотя случай ровно тот, под который правило и написано, только с обратным знаком: не «мог предотвратить и не сделал», а «мог не делать и сделал». Для героя счёт выставлен, для него — не выставлен.</p>\n<h3>Отклик</h3>\n<p>Лучшая сцена — та, где он молчит. Наливает коньяк и ждёт, пока герой заговорит сам, а потом выпивает четверть бутылки залпом, потому что сам не выдерживает. И следом — «ты должен рассказать сестре»: единственное, что он говорит, это то, чего от него меньше всего хотят. Зацепило, что автор дал ему внутренний расчёт прямым текстом — «Что лучше пусть мстит и на убивает. Не жили будет желать умереть» — то есть милосердие тут посчитано, а не почувствовано, и посчитано человеком, который знает цену и всё равно платит. Забавно, что автор ждал претензии «слишком добрый», а зацепило соавтора именно это; по-моему, соавтор прав, и держится персонаж не на доброте, а на том, что он единственный в тексте, кто вообще что-то выбирает.</p></div>", "r": []}];</script>
