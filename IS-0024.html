<script>const BASE="";const DOCNAME="История о защитнике";
const LEAD="";
const CH=[{"t": "Содержание", "a": ["S01", "IS-0024-S01", "IS-0024--soderzhanie"], "h": "<p>История о защитнике — текст, написанный одним из соавторов и обсуждавшийся 2024-08-12 (id 218318–218322, окно w0052). Самого текста истории в переписке нет, есть только разговор о нём.</p>\n<p>Разговор начинается с того, что автор перечитывает написанное «вдумываясь что читаясь сам вспоминая некоторый момент», а «не на отьебись», и по итогам перечитывания находит пропуск.</p>\n<p>Пропущенное — сцена разговора главного героя с другом. В ней должна была быть вспышка гнева. Назначение сцены сформулировано так: «я забыл добавить момент когда он говорит с другом вспышку гнева, что бы показать что гг пострадал и психический». То есть вспышка гнева в разговоре с другом нужна как показатель того, что герой пострадал не только физически.</p>\n<p>Отдельно зафиксировано свойство героя, существующее независимо от пропущенной сцены: «у него довольно часто бывают вспышки гнева».</p>\n<p>Про саму историю сказано, что она была написана без предварительного продумывания: «про историю о защитнике я не подумав просто написал историю».</p>", "r": []}, {"t": "Персонажи", "a": ["S02", "IS-0024-S02", "IS-0024--personazhi"], "h": "<ul>\n<li>Главный герой — защитник. О нём известно: он пострадал, в том числе психически; у него часто бывают вспышки гнева. Имени в переписке нет.</li>\n<li>Друг главного героя — участник той сцены, которая должна была быть и которой в тексте не оказалось. О нём в переписке не сказано ничего, кроме факта разговора.</li>\n</ul>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "IS-0024-S03", "IS-0024--mesto-vo-vselennoy"], "h": "<p>Отнесена ко вселенной «монстры» по дате объявления. В переписке история связывается с критериями отбора историй для сборника — обсуждение сразу переходит к вопросу, берут её в сборник или нет.</p>", "r": []}, {"t": "Состояние", "a": ["S04", "IS-0024-S04", "IS-0024--sostoyanie"], "h": "<p>История написана и существует как законченный текст, но с признанным автором пропуском (недостающая сцена со вспышкой гнева). Дописывать её в переписке не договариваются.</p>\n<p>Дальше разговор идёт о судьбе истории в сборнике: «мы просто не берём эту историю в сборник, я правильно понял?» — и о готовности её выбросить: «моя история не более чем реализация той идеи которая ко мне пришла в голову. все что я хотел написать я сделал, если она не подходит мы её выбрасываем, думаю я достаточно критериев услышал на которые буду опираться при создании новой истории». Завершается репликой «я сразу говорил».</p>\n<p>Таким образом, на 2024-08-12 история существует, но её включение в сборник поставлено под вопрос, а автор говорит о готовности вместо неё написать новую — уже с опорой на услышанные критерии. Была ли она в итоге выброшена и была ли написана новая — в переписке не сказано.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "IS-0024-S05", "IS-0024--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Самого текста истории в окне нет — известно только то, что о нём сказано в разговоре.</li>\n<li>Авторство в переписке двоится: реплика про пропущенную сцену принадлежит Славе, а следом Миколай говорит про «мою историю» в том же обсуждении. Кто из соавторов написал историю о защитнике, из текста однозначно не следует.</li>\n<li>Сюжет истории не изложен: неизвестно, от чего или кого герой защитник, что с ним произошло, чем всё кончается.</li>\n<li>Не названо, каковы именно «критерии историй для сборника», которых автор «достаточно услышал».</li>\n<li>Решение по сборнику осталось нерешённым: вопрос «мы просто не берём эту историю в сборник, я правильно понял?» ответа в переписке не получает.</li>\n<li>Что означает «я сразу говорил» — к чему именно относится, не сказано.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["IS-0024--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-12</td>\n<td>218318–218322</td>\n<td>w0052</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/istorii/IS-0024-istoriya-o-zaschitnike.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["IS-0024--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/IS-0024.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
