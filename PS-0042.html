<script>const BASE="";const DOCNAME="Войс Патина";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0042-S01", "PS-0042--proishozhdenie"], "h": "<p>Персонаж вселенной «игра бога», карточку составил Миколай (2024-04-02, id 153330, окно w0029). Появляется одним сообщением, готовой карточкой. Происхождение персонажа внутри мира не описано.</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0042-S02", "PS-0042--vneshnost"], "h": "<p>33 года. Никаких других черт внешности в карточке нет — ни телосложения, ни описания лица, ни одежды.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0042-S03", "PS-0042--harakter"], "h": "<p>Формулировка Миколая целиком: «Делает всё и во всём успевает, со всеми могёт и короче летает, 33 года».</p>\n<p>«Делает всё и во всём успевает» и «со всеми могёт» даны как описание того, каков персонаж, а не как отдельная строка способности.</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0042-S04", "PS-0042--sposobnosti"], "h": "<p>Отдельной строки со способностью в карточке нет — в отличие от других карточек того же окна, где способность выписана после описания. Единственное, что похоже на силу, — слово «летает», но оно стоит внутри той же фразы, что и «делает всё и во всём успевает».</p>\n<p>Осталось нерешённым: входит ли «летает» в описание характера (в разговорном смысле — про темп жизни) или это и есть его сила. В переписке этот вопрос не разбирался.</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S05", "PS-0042-S05", "PS-0042--kak-menyalsya"], "h": "<ul>\n<li><strong>2024-04-02 (id 153330, окно w0029)</strong> — единственное состояние. Карточка без выделенной способности: имя, возраст 33, строка «делает всё и во всём успевает, со всеми могёт и короче летает». Переработок и отклонённых вариантов в переписке нет.</li>\n</ul>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0042-S06", "PS-0042--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Способность не выписана отдельно; статус слова «летает» не определён.</li>\n<li>Внешность не описана, кроме возраста.</li>\n<li>Связи с другими персонажами не названы.</li>\n<li>Дальнейшая судьба персонажа в переписке не появляется.</li>\n<li>Происхождение имени «Войс Патина» не объяснялось.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0042--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0049.html\">Команда Миколая (10 персонажей игры бога)</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0049.html\">Команда Миколая (10 персонажей игры бога)</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0014.html\">игра бога</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0042--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-04-02</td>\n<td>153330–153330</td>\n<td>w0029</td>\n<td>игра бога (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0042-voys-patina.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0042--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0042.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
