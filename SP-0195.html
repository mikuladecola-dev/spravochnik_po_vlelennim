<script>const BASE="";const DOCNAME="Альтер-эго ГГ";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0195-S01", "SP-0195--mehanika"], "h": "<p>Способность главного героя новой истории, заявленная Славой одним блоком (2025-03-12, id 301405–301410). Формулировка автора: «У гг будет альтро-эго, это не раздвоение личности, ты просто будешь видеть самого себя и можешь с ним говорить, но он не сможет захватить контроль».</p>\n<p>То есть работает это так: герой видит самого себя — второго себя — и может с ним разговаривать. Раздвоением личности это прямо не является, автор оговаривает это отдельно и в первую очередь.</p>\n<p>Имя способности в переписке звучит как «альтро-эго».</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0195-S02", "SP-0195--ogranicheniya-i-cena"], "h": "<ul>\n<li>Второй «не сможет захватить контроль» — перехват тела или воли альтер-эго недоступен.</li>\n<li>«Они всё равно одна личность» (id 301410). Разделения на двух отдельных субъектов нет.</li>\n<li>«Тем более там такого разделения не будет» (id 301409) — сказано о разделении в тексте, то есть в самом повествовании реплики двоих не будут размечаться как принадлежащие разным лицам.</li>\n</ul>\n<p>Цена способности — то, чем герой за неё платит, — в переписке не названа.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0195-S03", "SP-0195--nositeli"], "h": "<p>Главный герой «новой истории» — так он обозначен в переписке. Именем герой здесь не назван, и сама история тоже не названа.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0195-S04", "SP-0195--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2025-03-12 (id 301405–301413).</strong> Слава заявляет механику целиком: видение самого себя, возможность говорить, невозможность перехвата контроля, единство личности. В том же заходе он задаёт вопрос о подаче: «Тебе обозначить кто из них кто?» — и сам же склоняется к отрицательному ответу: «Ну по тексту мне лично вполне ясно кто из них кто». Миколай отвечает не сразу: «тааак», «подожди» (id 301412–301413).</p>\n<p><strong>Версия 2 — 2025-03-12, в тот же день (id 301459–301460).</strong> Миколай возвращается к вопросу и отвечает: «пока не надо я в тексте увижу». Механика при этом не меняется — меняется только решение о разметке в тексте.</p>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S05", "SP-0195-S05", "SP-0195--otklonennye-varianty"], "h": "<p>Предлагалось обозначать в тексте, кто из двоих сейчас говорит — герой или альтер-эго. Вариант отклонён, но с оговоркой «пока»: Миколай сказал «пока не надо я в тексте увижу», то есть решение принято до появления текста и оставлено открытым к пересмотру.</p>", "r": []}, {"t": "Связь с другими способностями", "a": ["S06", "SP-0195-S06", "SP-0195--svyaz-s-drugimi-sposobnostyami"], "h": "<p>В карточке способность отнесена к Арбетару. Чем именно связаны альтер-эго и Арбетар, в переписке не сказано.</p>\n<p>Способность помечена как часть «ГГ следующей истории».</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "SP-0195-S07", "SP-0195--probely"], "h": "<div class=\"gaps\"><ul>\n<li>О каком именно герое и о какой истории речь — в окне прямо не сказано.</li>\n<li>Как альтер-эго появилось у героя, врождённое оно или приобретённое, — не сказано.</li>\n<li>Видят ли альтер-эго другие люди — не сказано.</li>\n<li>Что альтер-эго может, кроме как говорить, — не сказано.</li>\n<li>Характер связи с Арбетаром не раскрыт.</li>\n<li>Вопрос о разметке в тексте оставлен нерешённым до появления самого текста.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["SP-0195--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-03-12</td>\n<td>301405–301413</td>\n<td>w0079</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-03-12</td>\n<td>301459–301460</td>\n<td>w0079</td>\n<td>Апостол (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0195-alter-ego-gg.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0195--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0195.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["SP-0195-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/SP-0195/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — не пробел, а неверная приписка. Статья сообщает, что в карточке способность отнесена к Арбетару, и честно пишет, что связь не раскрыта. Связи нет потому, что приписка не туда: <code>PS-0220</code> «Арбетар» — одна ссылка, база 38 531, а носитель альтер-эго лежит в <code>PS-0222</code> «Альтер-эго Антона (брат)» — база 72 757, ссылок ноль, и в <code>PS-0221</code> «Антон Смирнов» — база 74 390, одна ссылка. Полторы сотни тысяч знаков про ту самую способность стоят в стороне, а статья на 3 022 базы отправлена в чужой раздел. Это самая дешёвая починка из всех четырёх записей марта.</p>\n<p>Вторая: <code>SL-0091</code> «Хронология историй Славы» — статьи нет, база 14 910, ссылок ноль. По числам не блокер, по содержанию ключ: там 2025-05-15, id 326430, Слава сам нумерует свои вещи, и «Четвёртая альтро эго» стоит между «Третья Бессмертный» и «Пятая битва защитника и арьетара». Это единственное место, где безымянная «новая история» из этой статьи получает место в ряду. Пока список не разобран, <code>IS-0038</code>, <code>SL-0063</code> и обе прозы, <code>PR-0058</code> и <code>PR-0059</code>, висят без порядка.</p>\n<h3>С чего начать</h3>\n<p>В архив идти незачем — материал уже в базе, и он буквально отвечает на два пробела статьи. <code>PS-0222</code>, id 301841–301848 и 301857–301861 (2025-03-13, окно w0080). Там Миколай спрашивает прямо: «и что для тебя значит альтер эго как ты это понимаешь», и Слава отвечает: «Ну типа вображаемый друг, которого не кто не видят, кроме тебя, но при этом он выглядит как ты». Это закрывает пробел «видят ли альтер-эго другие люди». Там же, 301844 и 301857–301860: «тут типа раздельный разум, ну как минимум это есть?», «то есть можно сказать полноценный человек, относительно» — «Ну можно и так сказать».</p>\n<p>Ни один из этих участков в источниках <code>SP-0195</code> не значится. Заходов в архив за самой механикой не нужно вовсе: 2025-03-12, id 301405–301413 и 301459–301460 — это весь объём, и он вычитан.</p>\n<h3>Как развивалось</h3>\n<p>Заявили 2025-03-12 одним блоком: видит себя, говорит с собой, контроль не перехватывается, личность одна. В тот же день ограничили — но не механику, а подачу: «пока не надо я в тексте увижу». Через сутки, 2025-03-13, вернулись — и заявленное поплыло. «Они всё равно одна личность» от 03-12 стоит рядом с «полноценный человек, относительно» от 03-13 и с переопределением альтер-эго в душу брата. Ни одна из формулировок другую не отменяла. Ещё через два месяца, 2025-05-15, вернулись третий раз — но уже как к названию готовой вещи в списке, не к устройству.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Запрет назван в одну сторону: второй «не сможет захватить контроль». Для обратного направления правила нет. Может ли герой заглушить второго, прогнать его, отказаться разговаривать, есть ли у него над ним хоть какая-то власть — не сказано. При этом сюжетно вторая сторона в решающий момент как раз молчит и не отвечает. Правило асимметрии заявлено для одной половины пары и не заявлено для другой.</p>\n<h3>Отклик</h3>\n<p>Самая короткая из четырёх записей и самая живая по интонации. Автор заявляет механику и тут же сам себя перебивает вопросом о подаче — «Тебе обозначить кто из них кто?» — и сам же на него отвечает «ну по тексту мне лично вполне ясно». Это редкий момент, когда видно, как человек думает про читателя раньше, чем про мир. Ответ соавтора — «пока не надо я в тексте увижу» — тоже хорош: решение принято не по логике, а по доверию к тексту, которого ещё нет. И зацепило, что через сутки от «это не раздвоение личности, они всё равно одна личность» не осталось почти ничего: второй оказался отдельным человеком, мёртвым братом, с собственным планом и собственной смертью. Оговорка, поставленная в самое начало и первым делом, продержалась один день.</p></div>", "r": []}];</script>
