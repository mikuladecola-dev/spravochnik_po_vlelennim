<script>const BASE="";const DOCNAME="Смерть";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0178-S01", "PS-0178--proishozhdenie"], "h": "<p>Смерть создана «существом» — правителем нашего мира. Формулировка Славы (2025-01-06, id 278883): «Существо являющий правителем нашего мира создала смерть которая таскает души в разный миры».</p>\n<p>Появляется она в самом первом изложении устройства вселенной (2025-01-06, id 278852), где Слава описывает мироустройство целиком: наш мир — «Вселенная», он самый большой и появился первым; на втором месте по размеру «рай» и «ад»; кроме них существует множество минимиров, которые «чаще всего пытаются копировать нашей мир». Смерть вводится в этом описании как ответ на вопрос, почему после смерти существо из нашего мира вдруг оказывается в других мирах.</p>\n<p>Дословно: «И вообще почему мы существо из нашего мира вдруг после смерти отправляемся в других мира, из за \"смерти\" она после нашей кончины не даёт остаться в нашем мире и вечно отправлять нам куда-то».</p>", "r": []}, {"t": "Способности", "a": ["S02", "PS-0178-S02", "PS-0178--sposobnosti"], "h": "<p>Функция у Смерти одна и названа дважды.</p>\n<p>Первая формулировка (id 278852): после кончины человека она «не даёт остаться в нашем мире и вечно отправлять нам куда-то».</p>\n<p>Вторая, короче (id 278875): «Смерть таскает наши души в других миры».</p>\n<p>Куда именно попадает душа — определяется общим устройством мира, а не отдельно оговорёнными действиями Смерти: «мы умираем и отправляемся в рай или ад, ну или в минимирок ну это случается крайне редко».</p>\n<p>Предмет её работы — душа. Определение души дал Слава там же (id 278892): «Это мы, наш фантомный облик».</p>", "r": []}, {"t": "Связи с другими", "a": ["S03", "PS-0178-S03", "PS-0178--svyazi-s-drugimi"], "h": "<p><strong>Существо.</strong> Создатель Смерти, правитель нашего мира. О его возможностях сказано: «Он может изменять этот мир как хочешь ведь это его мир». Сам он никем не создан — на вопрос Миколая «а наш кто создал?» Слава отвечает «Нет», затем «Существо». Того, кто контролировал бы все миры сразу, нет: «Нет», «Но самым сильном является \" существо\"».</p>\n<p><strong>Правители миров.</strong> «И вообще почти во всех мирах есть правитель( существо правящий этим миров )». Правители могут дать своё благословение, но «только людям из нашего мира».</p>\n<p><strong>Рай, ад, минимиры.</strong> Пункты назначения душ. Из рая, «по понятным причинам», никто не хочет сбегать, а из ада грешники сбегают; дьявол, правитель ада, при этом «добрый, типо он карает грешников».</p>\n<p><strong>Живые.</strong> Пока человек жив, он в другой мир попасть не может: «Мы же пока живы не можем попасть в другой мир». Обратный переход существует — существа из минимиров попадают в наш мир «через край своего мира», и все мистические монстры (драконы, упырь, оборотни, леший) — это они.</p>", "r": []}, {"t": "Пробелы", "a": ["S04", "PS-0178-S04", "PS-0178--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Мотив не установлен. Миколай спрашивал прямо (id 278877): «ей платят за это? нахуя она это делает? вредная привычка?» — ответа на этот вопрос в переписке нет.</li>\n<li>Пол, облик, характер не описаны. В тексте Славы попадаются и женский род («она после нашей кончины не даёт»), и мужской при описании правителя («как он правит»), но об облике самой Смерти не сказано ничего.</li>\n<li>Не сказано, одна она или их много, и есть ли у неё имя помимо слова «смерть».</li>\n<li>Не сказано, по какому принципу распределяются души между раем, адом и минимирами, и участвует ли Смерть в этом выборе или только переносит.</li>\n<li>Слово «вечно» в формулировке «вечно отправлять нам куда-то» не разъяснено.</li>\n<li>После 2025-01-06 персонаж в переписке не возвращался — обе версии укладываются в один день, в одно окно.</li>\n</ul></div>", "r": []}, {"t": "Источники", "a": ["PS-0178--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-01-06</td>\n<td>278852–278852</td>\n<td>w0070</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-06</td>\n<td>278875–278892</td>\n<td>w0070</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0178-smert.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0178--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0178.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0178-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0178/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первое — существо. Создателя Смерти как отдельной сущности в наборе нет, а его материал разложен по двум записям с разной судьбой. <code>MR-0093</code> «Вселенная (наш мир)» — 12 112 базы, статья 12 106, три ссылки; там существо расписано подробнее, чем здесь, с id на каждую формулировку (278868, 278883, 278885, 278889). <code>MR-0068</code> «Существо с длинными руками» — 18 447 базы, статья 15 170, одна ссылка; и эта запись держит три разных значения слова сразу: тварь из вселенной «монстры» (2024-11-13), правитель нашего мира (2025-01-06) и термин «Существо это ребёнок правителя, который имеет физическую оболочку» (2025-03-10). Пока они не разведены, фраза «создана существом» указывает в три стороны одновременно, а Смерть — единственное, что это существо в переписке вообще сделало.</p>\n<p>Второе — душа. <code>MR-0098</code> «Душа»: база 1 596, статья 3 378, ссылок ноль. Предмет работы Смерти описан одной репликой — «Это мы, наш фантомный облик» (278892). Рядом в том же справочнике: <code>SP-0199</code> «Проводник (чистая душа)» — 39 325, <code>SP-0197</code> «Две души в одном теле» — 21 778, у Антона в <code>PS-0221</code> чистота души измерена в процентах (89). Январская душа — фантомный облик, который куда-то уносят; мартовская — ресурс с качеством, через который пропускают силу. Одно слово, две механики, ни одной связи между ними.</p>\n<p>Третье, дешёвое и чисто навигационное: сама запись выбрана целиком — база 5 826 при статье 5 728, дочитывать нечего, — и при этом на неё не ссылается никто. Её работу описывают <code>MR-0093</code> (три ссылки), <code>MR-0094</code> «Минимиры» (12 462), <code>MR-0095</code> «Рай» (54 131), <code>MR-0096</code> «Ад» (8 308). Четыре статьи объясняют, куда деваются души, и ни одна не показывает на того, кто их носит.</p>\n<h3>С чего начать</h3>\n<p>В базе. Всё содержимое — одно окно w0070, 2025-01-06, id 278852–278892, и этот же кусок разобран трижды: здесь, в <code>MR-0093</code> и в <code>MR-0068</code>. Сверять надо по одним и тем же id, а не искать заново.</p>\n<p>За вторым значением существа — <code>MR-0068</code>, версия 2025-03-10, окно w0079: там определение через ребёнка правителя, и туда же существо попадает в список чужемирцев.</p>\n<p>За душой — не по слову «смерть», а по «душа», «проводник», «чистота»: окно w0080, 2025-03-13, id 301805–301924 (<code>PS-0221</code>, <code>SP-0198</code> «Ритуал становления Арбетаром», 48 879). Это и есть то место, где душа перестала быть фантомным обликом.</p>\n<p>В архив — только за мотивом. Вопрос 278877 внутри окна не отвечен и в этом окне ответа иметь не может. Смотреть там, где Слава заново раскладывал устройство миров: w0079 (2025-03-10) и w0083 (2025-03-19).</p>\n<h3>Как развивалось</h3>\n<p>Заявили и ограничили в одном часе, а забыли навсегда. 2025-01-06: в 278852 Смерть вводится не сама по себе, а как затычка в объяснении — почему умерший не остаётся здесь. В 278875 та же функция сжимается до одной строки: «Смерть таскает наши души в других миры». В 278883 добавляется происхождение — её создало существо. В 278892 определяется предмет работы — душа. Между этим, в 278877, Миколай спрашивает про мотив и ответа не получает. Возврата нет: 2025-01-06 — единственная дата записи, обе версии внутри одного окна.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для людей нашего мира правило после смерти названо до конца: душа здесь не остаётся, её уносит Смерть, и делает это «вечно». Названо и встречное направление — существа минимиров приходят к нам через край своего мира, и живому человеку в обратную сторону нельзя.</p>\n<p>Чужемирцы в нашем мире гибнут постоянно, и это не догадка, а целый корпус записей: <code>PS-0198</code> «Чужемирцы» (58 680), <code>PS-0199</code> «Пераг» (44 124), <code>PS-0231</code> «Упыри» (17 407), карлики и твари из истории Защитника. Что происходит с ними, когда их убивают здесь, — забирает ли их Смерть, возвращаются ли они в свой мир, есть ли у них душа в том же смысле, — не спрошено ни разу. Для своих мертвецов маршрут прописан, для чужих того же рода — нет.</p>\n<h3>Отклик</h3>\n<p>Смерть здесь входит в мир не как фигура, а как заплатка на логической дыре: Слава раскладывает устройство миров, упирается в вопрос, почему после смерти мы оказываемся не здесь, и тут же заводит того, кто нас отсюда выносит. Ни лица, ни имени, ни пола — в одной реплике «она», в соседней про правителя «он», — и функция ровно одна, транспортная. Мир, в котором смерть не событие и не персонаж, а служба вывоза, — это довольно жёсткая штука, и она получилась побочно, из потребности свести концы.</p>\n<p>И лучшая реплика окна — Миколая: «ей платят за это? нахуя она это делает? вредная привычка?» Он спрашивает у логистики про мотив, то есть проверяет, персонаж перед ним или механизм. Ответа нет, и молчание тут само по себе ответ. Ещё цепляет слово «вечно» в «вечно отправлять нам куда-то»: оно читается не как «навсегда», а как «раз за разом», и от этого у неё вдруг появляется что-то вроде графика.</p></div>", "r": []}];</script>
