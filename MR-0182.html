<script>const BASE="";const DOCNAME="Оэм";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0182-S01", "MR-0182--ustroystvo"], "h": "<p>ОЭМ — одновременно мир и субстанция. Название пишется в переписке двояко: Слава пишет «Оэм», Миколай и нейросеть — «Оам». В шапке записи оба варианта учтены как варианты имени, третий вариант написания — «ОЭМ» заглавными.</p>\n<p>Как субстанция Оэм назван в двух местах. Первое — место обитания одной из рас: «Дети мирового древа. Живут в мести которой мутировала от Оам» (2025-12-06, id 393287). Второе — состав котов: «Кстати коты будут типо, что-то духов. То бишь они будут состоять из Оэм. Из-за этого понимания, объём и контроль Оэм у них выше чем у любого» (2025-12-06, id 393315). То есть Оэм — то, из чего коты состоят, и то, чем измеряется их превосходство: у них выше и «объём», и «контроль». Что такое объём и контроль Оэм у остальных обитателей мира — в переписке не сказано. Природа субстанции в самом чате не объясняется.</p>\n<p>В навигационной части записи указано также, что «апостолы его видят», но в приведённых кусках переписки это не проговорено.</p>\n<p>Иерархия сил в мире выстроена сверху вниз (2025-12-06, id 393287):</p>\n<ol>\n<li>Коты. Их 9, они сильнейшие. «Уникальный особенности, я для них не придумал помоги» — на момент разговора особенности котов не придуманы, Слава просит помощи. Коты есть в каждую эпоху; если один кот умрёт, родится новый, и «всегда их будет 9». «Они вообще никуда не вмешиваться».</li>\n<li>Апостолы. Их 21, «вторая по силе раса на земле». К слову «раса» тут же дана оговорка: «опять раса, в мире есть просто индивиды который могут быть сильными» — то есть сильные существа не обязаны принадлежать расе.</li>\n<li>Дальше — «расы и организации который равны по силе с друг другом».</li>\n</ol>\n<p>Отдельно оговорена роль апостолов в устройстве мира: «Апостолы очень часто устраивают без порядок разрушая укорененый баланс между всеми. Из-за них по итогу в современном мире раскроется существования тёмный изнанки но это будет в будущем в будущем» (id 393287). Таким образом, в мире есть укоренённый баланс между всеми сторонами, есть тёмная изнанка, существование которой пока не раскрыто, и раскрытие это отнесено в будущее.</p>\n<p>Слава фиксирует состояние мира формулой: «В нашем мире Оэм уже существует много сторон для конфликта» (id 393290). Из этого он сразу выводит следующую задачу: «Ну нам нужный главные злодей» (id 393291).</p>", "r": []}, {"t": "Население", "a": ["S02", "MR-0182-S02", "MR-0182--naselenie"], "h": "<p>Расы и организации, равные между собой по силе, перечислены единым списком (2025-12-06, id 393287):</p>\n<ul>\n<li><strong>Дети мирового древа.</strong> «Живут в мести которой мутировала от Оам».</li>\n<li><strong>Проротой каменный челике</strong> (написание Славы). «Владеют преступное организацию. Некий союз с апостолами».</li>\n<li><strong>Азуриэль.</strong> «Как народ что прячется от цивилизации. Но некоторый всё же живут среди людей».</li>\n<li><strong>Группировка сестры.</strong> Сестра «теперь будет дочерью Имитатора». «И я не знаю какие у неё будет цель» — цель группировки на этот момент не назначена.</li>\n<li><strong>Правителская организация по контролю всех этих.</strong> «Сильнейшая там девченка что может изменять мир волнами». Имя девчонки не названо.</li>\n<li><strong>Церковь с паладинами.</strong> Паладины — «мёртвыми рыцарями которых оживил один челик, для верующих». «Паладины до хрена сильный но их ней движения предсказуемый. Они больше как роботы с повторяющими движениями».</li>\n<li><strong>Организация челика который и оживил паладинов.</strong> Тут же он получает имя: «Давай челика назовём Виктор». «Ну и Виктор верит в красный ток что оживляет людей. И он многих оживил, но разум так и не смог в них оживить».</li>\n<li><strong>Пернатые</strong> (Серафим, Пераги «и кто-нибуть ещё» — состав до конца не назван).</li>\n<li><strong>Орден предназначеный для убийства котов.</strong> Формулировка «так же появиться» — то есть на момент разговора ордена ещё нет, он должен появиться.</li>\n<li><strong>Вампиры просто аристократы.</strong></li>\n<li><strong>Аскизы.</strong> «Матка Аскизов стало предметом веры для какой-то верологий». Какой именно — не названо. Отдельным сообщением: «Ну и Аскизы. Я не знаю где они живут» (id 393288).</li>\n</ul>\n<p>Над этим списком стоят коты (9) и апостолы (21).</p>\n<h3>Стороны конфликта</h3>\n<p>Разбор сторон Слава начинает с добра: «Во первых сначала с добрых» (id 393292).</p>\n<p><strong>Добро.</strong> «Вообще апостолы на стороне добра. Ну будут устраивать геноциды и теракты. Плюсом они высокомерны, хотя прямо этого не показывать. Ну они как бы с рождения лучшей людей, поэтому в полне ясно почему они высокомерные. Ну кроме бессмертного (у него как бы не все в порядке с мозгами если ты помнишь)» (2025-12-06, id 393293). И далее: «И вот добрики и другие добряки есть. Но апостолы все же главные» (id 393294).</p>\n<p><strong>Промежуточные злодеи</strong> (2025-12-06, id 393305–393308):</p>\n<ul>\n<li>Дети мирового древа;</li>\n<li>клан крылатых (Серафим);</li>\n<li>«ну или церкви, да и люди иногда»;</li>\n<li>«Да еще и Виктор, что воскрешает трупы, ну точнее делает из них марионеток» — уточнение к прежней формулировке про оживление.</li>\n</ul>\n<p><strong>Два основных злодея</strong> (id 393309, 393313–393314):</p>\n<ul>\n<li><strong>Сестра, «ну теперь дочь имитатора (Имита)».</strong> «В вселенной правителя её целью было объединить миры и вызвать Апокалипсис. У неё даже есть своя группа злодеев. Ну теперь я не знаю какая у неё цель в мире Оэм». То есть цель перенесена не полностью: старая цель принадлежит вселенной Правителя, новая для Оэм не придумана. Отдельно закреплено: «Не забывая она также грех Череугодия (то бишь голодная для знания) как её отец (имитатора)».</li>\n<li><strong>Человек (Бог красок).</strong> «Второй появиться только не давно. Человек (Бог красок) лишь образ. Он будет злодеем ну каким я не знаю».</li>\n</ul>\n<h3>Предложенное и не принятое</h3>\n<p>На вопрос, кто будут основными злодеями, Миколай предположил котов («котов?», id 393310, следом эмодзи 😼) и «червивоглазых?» (id 393312). Прямого ответа на эти предположения в переписке нет — перечень основных злодеев Слава даёт независимо от них, называя дочь Имитатора и Бога красок. Ни коты, ни «червивоглазые» в этот перечень не вошли.</p>\n<p>Задача, поставленная в конце разбора и оставшаяся нерешённой в этом окне: «Так мне нужна цель и мотивация двух сильнейших за мир. И цель и мотивация двух сильнейших злодеев» (id 393316). Следом Слава просит: «Прежде чем разбирать злодеев. Давай сначала проясним сильнейших» (id 393295) — в приведённых кусках отдельного разбора сильнейших нет.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S03", "MR-0182-S03", "MR-0182--mesto-vo-vselennoy"], "h": "<p>В шапке записи ОЭМ отнесён сразу к двум вселенным: «7 островов» и «Оам». Версии 1 и 2 (2025-12-06) объявлены как вселенная Оам, версии 3 и 4 (2026-02-06 и 2026-02-07) отнесены к 7 островам по дате объявления.</p>\n<p>Прямых связей мира с другими мирами в переписке названо две:</p>\n<ul>\n<li><strong>Вселенная Правителя.</strong> У дочери Имитатора «в вселенной правителя её целью было объединить миры и вызвать Апокалипсис» — то есть персонаж приходит в Оэм из вселенной Правителя, и её прежняя цель осталась там (id 393313).</li>\n<li><strong>Семь островов.</strong> «Оказывается вселенная семь островов это вселенная в которой два мира столкнулись» (2026-02-06, id 429363). Какие именно два мира столкнулись и входит ли в них Оэм — в переписке не сказано.</li>\n</ul>\n<p><strong>Тёмная изнанка</strong> названа как то, чьё существование раскроется в современном мире Оэм из-за апостолов (id 393287); отдельного описания в этом окне нет.</p>\n<p>В списке «Связано с» записи стоят: Апостолы, Коты, Правитель, Семь островов, Тёмная изнанка.</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S04", "MR-0182-S04", "MR-0182--kak-menyalsya-po-versiyam"], "h": "<h3>Версия 1 — 2025-12-06 (окно w0112, id 393287–393296)</h3>\n<p>Разложен состав мира: иерархия сил (коты — апостолы — прочие расы и организации, равные между собой), перечень рас и организаций, оговорка про сильных индивидов вне рас. Заявлено, что «в нашем мире Оэм уже существует много сторон для конфликта» и что нужен главный злодей. Особенности котов на этот момент не придуманы.</p>\n<h3>Версия 2 — 2025-12-06 (окно w0112, id 393301–393317)</h3>\n<p>Поверх состава мира разложены стороны конфликта: добро с апостолами во главе, промежуточные злодеи, два основных злодея. Здесь же коты получают связь с субстанцией мира: они «типо, что-то духов», состоят из Оэм, и потому объём и контроль Оэм у них выше, чем у любого (id 393315). Это добавление к версии 1, где про состав котов ничего не было.</p>\n<p>Изменение внутри версии: группировка сестры из версии 1 здесь уточняется — сестра стала дочерью Имитатора и получила имя Имита, при этом её цель в мире Оэм по-прежнему не назначена.</p>\n<h3>Версия 3 — 2026-02-06 (окно w0115, id 429348–429387)</h3>\n<p>Первая попытка собрать материал по ОЭМ в отдельный документ. Слава просит: «Можешь туда Оэм закинуть?» (id 429348), Миколай берётся сделать это между парами («но после пар», «ну или между», id 429351–429352) и уточняет, «нейронке это подкинуть? или это другое всё-таки» (id 429359–429360). Слава в это время «в Нейра кит скидываю первую вселенную» — «те старые 7 островов» (id 429361–429365). Миколай спрашивает, старые острова или новые: «ну ты врд пытался вернуть острова как-то»; порядок работы определён так: «Ну сначала старое а потом новое» (id 429368–429370).</p>\n<p>Отдельно Слава перечисляет три претензии по невыполненному (id 429371–429375): «Первая где сука документ»; «Второй ну посмотри ты скибиди туалеты. Он же сука не такой длинный чтобы на него забить»; «Третий для тебя бессмертный». Третья претензия правит факт о персонаже: «Ты сука сказал что у бессмера отрезали реботрутивный органы (член и яйца) и у него есть дочь пиздешь у него нет дочери и ему ничего не отрезали» (id 429375). То есть на 2026-02-06 у Бессмертного нет дочери и ничего не отрезано.</p>\n<p>Сообщением id 429376–429377 Слава вставляет в чат сводку нейросети по вселенной «Семь островов». Это не авторский текст, а машинный разбор их материала, помещённый в переписку; ниже — его содержание.</p>\n<p><em>Основные законы мира по этой сводке:</em> слияние технологического и фэнтезийного мира, обладающего Энергией, — теперь есть и высокие технологии, и магические способности. Источник сверхспособностей — внутренняя энергия; у людей есть «сосуд», который её содержит, у сосуда есть лимит, его нужно опустошать, «иначе он может разорваться». «Грань» — продвинутое состояние: при достаточно сильном сосуде носитель на время получает огромную силу, может видоизменять способности и себя, после чего способности блокируются на неделю (правило обходит только Нуар). Мета-люди — родившиеся со способностью использовать Энергию. Насильно пробуждённые — обычные люди, которых заставили пробудить способности особым препаратом или гормоном: сверхсил они не получают, но физические параметры усиливаются за счёт Энергии. Терминология: остров — крупный город-государство; Ультима Туле — опасные дикие территории между островами (радиация, монстры, мёртвые земли), источник ресурсов; деревни — мелкие поселения, не дотягивающие до уровня островов.</p>\n<p><em>Острова и защитники по сводке:</em></p>\n<ol>\n<li>Оазис (Имитатор) — гористая местность, обычный мирный город, главный приют для беженцев после 8-летней войны, лабораторных «крыс» и всех, кому некуда идти, жёсткий контроль на въезде против преступников; власть полностью у Имитатора, он и защитник, и правитель; конфликты — мелкие стычки из-за попыток других островов вернуть сбежавших подопытных или граждан.</li>\n<li>Калор (Нуар) — под водой, окружён барьером из Тьмы, удерживающим воду; экосистема на системе труб через барьер: забор кислорода, выброс CO2 и дыма, транспортировка людей и ресурсов, сброс отходов (сфера на дне перерабатывает мусор в комки и выбрасывает в океан); уязвимость — если Нуар погибнет, барьер падёт и остров будет уничтожен.</li>\n<li>Асгард (Избранный) — парит в небе, теократическое тоталитарное государство с радикальной религией, себя считают «посланниками богов», остальных — «одержимыми демонами», неверующие истреблены, население молится и работает в небесных рудниках; наращивают силы для будущей войны под лозунгом «очищения мира»; с края острова можно прыгнуть.</li>\n<li>Лёд (Снегурочка?) — ледяная местность, известны только название и местность.</li>\n<li>Болот (Друид) — болота, джунгли, известны название, местность и кличка защитника.</li>\n<li>Пректри (Сталкер) — пустыня, остров наёмников, криминала и чёрного рынка, независимый и опасный.</li>\n<li>Седьмой остров — название и защитник не указаны, местность не указана; технологичный остров, возможно центр разработок, в том числе препарата для насильственного пробуждения, упоминались «революционеры» и «тайное сотрудничество».</li>\n</ol>\n<p><em>Персонажи по сводке:</em> Имитатор (Оазис, 32 года, «ответственный трудяга, отец города», инструмент — жидкая масса, имитирующая образ и свойства других инструментов, способность — имитировать одну способность за раз, в Грани внешне похож на серафима, союзник — Нуар); Нуар (Калор) — блок с его описанием в переписке ушёл в следующее сообщение и там перепутан с описанием Избранного: под номером 2 идёт «посланник богов» 15 лет, ребёнок, с детства обработанный пропагандой Асгарда, пешка в руках взрослых, инструмент не указан, способность — контроль и изменение атомов, от рождения обладает самым мощным сосудом и второй личностью (Гранью), которая, вероятно, и контролирует Тьму и остров, единственный, кто может обходить правило недельной потери сил; Избранный (Асгард, 15 лет, религиозный фанатик, слабее Нуара и Имитатора, способность «Азбука (Азуенная?)» — требуется уточнение); Снегурочка (Лёд) и Друид (Болот) — только имя или прозвище и остров; Сталкер (Пректри, около 40, мужчина в кибермаске и плаще, хладнокровный наёмник, инструмент — глаза с тепловидением, оружие — снайперская винтовка, два пистолета, нож, стреляет сгустками огня без патронов, способность огонь: огненная пуля, огненные цепи, «Подземный ад» — огненные столбы из земли в радиусе 100 м); Кай (не защитник, 29 лет, любитель драк, «преступный сброд», инструмент — рога, чем больше, тем сильнее, способность огонь: регенерация, удар, файерболы, копьё, полёт, огненный аватар, плюс способность «Закон» — в радиусе 70 метров устанавливает правило, которому обязаны подчиняться все, включая его самого, пока не покинут зону; «Закон только запрещает что-либо»).</p>\n<p><em>Другие силы по сводке:</em> преступная организация без названия, действующая независимо от островов, возможно базирующаяся на Пректри или в Ультима Туле; лаборатории, создающие насильно пробуждённых, вероятно связанные с технологичным островом; межостровные отношения — союз Имитатора и Нуара, будущий агрессор Асгард, нейтральная криминальная зона Пректри.</p>\n<p><em>Вопросы, которые сводка оставила открытыми:</em> истинное имя Нуара; имена защитников Льда и Болот; название, местность и защитник седьмого острова; что конкретно делает способность «Азуенная» у Избранного; как работает препарат для насильственного пробуждения; название и структура независимой преступной организации; как выглядело объединение миров 8 лет назад — война или катаклизм.</p>\n<p>Миколай скидывает ссылку на собранный документ (codepen, id 429381: <code>https://cdpn.io/pen/debug/xbOabVL?authentication_hash=XBAGRmqPwOor</code>) с указанием «нажми», «потом пролистни», после чего Слава подводит итог: «Че то мало информация оказывается о ОЭМ» (id 429386). Миколай: «ой, ч не все чет кинул видимо» (id 429387). То есть версия 3 фиксирует не новое содержание мира, а неполноту собранного: материала по ОЭМ в документе оказалось мало.</p>\n<h3>Версия 4 — 2026-02-07 (окно w0115, id 429565–429816)</h3>\n<p>Версия начинается с признания перерыва в работе: «я же доделывал», «и чет остановился», «щас» (2026-02-06 вечером, id 429565–429568). После паузы около 11 часов и постороннего разговора документ доделан. Миколай кидает вторую ссылку (codepen, id 429804: <code>https://cdpn.io/pen/debug/xbOaaYP?authentication_hash=nqAwvdWZwwmr</code>) и описывает состав: «тут уже про сам мир есть» и «и дополнительное» (id 429808–429809). Про процесс: «бля, было не оч удобно ибо много материала — ну я знал что так будет» (id 429806) и «я еще пару раз лоханулся и не скинул всё прям» (id 429807). На вопрос «норм?» (id 429811) Слава принимает: «Ну нор» / «М» (id 429815–429816).</p>\n<p>Содержание самих документов в переписке не приведено — оно осталось за codepen-ссылками, поэтому что именно «про сам мир» туда вошло, из чата не восстанавливается.</p>\n<p>В этом же окне (id 429769–429791) идёт разговор, с миром не связанный: медицинский разбор того, что бывает, если ребёнка не извлечь из утробы, и метафора Миколая про отношения, которые не отпускают, — «пихаешь ребёнка обратно в матку», «может окаменеть буквально». К ОЭМ этот кусок в переписке не привязан.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "MR-0182-S05", "MR-0182--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Природа субстанции Оэм в чате не объясняется: сказано, что коты из неё состоят и что место обитания Детей мирового древа от неё мутировало, но что она такое — не сказано.</li>\n<li>Уникальные особенности котов не придуманы: «я для них не придумал помоги» (id 393287). В приведённых кусках переписки ответа на эту просьбу нет.</li>\n<li>Цель и мотивация двух сильнейших за мир и двух сильнейших злодеев запрошены (id 393316) и в окне w0112 не даны.</li>\n<li>Цель дочери Имитатора (Имиты) в мире Оэм не назначена: старая цель принадлежит вселенной Правителя.</li>\n<li>Каким злодеем будет Бог красок — не решено: «Он будет злодеем ну каким я не знаю».</li>\n<li>Цель группировки сестры не названа.</li>\n<li>Где живут Аскизы — прямо сказано: «Я не знаю где они живут». Какая именно вера сделала матку Аскизов предметом поклонения — не названо.</li>\n<li>Состав пернатых не закрыт: «Серафим, Пераги и кто-нибуть ещё».</li>\n<li>Имя сильнейшей в Правительской организации («девченка что может изменять мир волнами») не названо.</li>\n<li>Как Оэм соотносится с вселенной «Семь островов» — в переписке не сказано; сказано только, что семь островов это вселенная, в которой столкнулись два мира.</li>\n<li>Разное написание Оэм/Оам не разрешено; в окне w0115 не объясняется даже, что такое ОЭМ — вселенная, персонаж или проект.</li>\n<li>Содержание итоговых документов по ОЭМ в переписку не попало: оно только за codepen-ссылками, и Миколай сам отмечает, что скинул не всё.</li>\n<li>«Проротой каменный челике» — расшифровки написания или пояснения, что это за раса или группа, в переписке нет; известно только про преступную организацию и «некий союз с апостолами».</li>\n<li>Тёмная изнанка названа, но не описана: сказано только, что её существование раскроется в современном мире из-за апостолов.</li>\n<li>Орден для убийства котов назван без имени, состава и срока: «так же появиться орден предназначеный для убийства котов».</li>\n<li>Соотношение «пернатых» (Серафим, Пераги) и «клана крылатых (Серафим)» из разбора злодеев прямо не оговорено; обе строки указывают на Серафима, но приравнены ли эти группы — не сказано.</li>\n<li>Имя Виктора назначено по ходу разговора («Давай челика назовём Виктор») и в дальнейшем в этом материале не подтверждалось.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0182--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0056.html\">Апостолы (21 апостол; «насекомые»)</a>, <a href=\"GR-0057.html\">Коты (девять котов)</a>, <a href=\"GR-0058.html\">Орден по убийству котов</a>, <a href=\"GR-0059.html\">Правительственная организация по контролю</a>, <a href=\"GR-0060.html\">Группировка сестры (она же группа злодеев дочери Имитатора)</a>, <a href=\"GR-0061.html\">Церковь с паладинами</a>, <a href=\"GR-0063.html\">Организация Виктора</a>, <a href=\"GR-0064.html\">Пророки каменные («Проротой каменный челике», Поротаи)</a>, <a href=\"GR-0065.html\">Пернатые (клан крылатых)</a>, <a href=\"GR-0066.html\">Аскизы</a>, <a href=\"GR-0067.html\">Дети мирового древа</a>, <a href=\"GR-0068.html\">Азуриэль (народ)</a>, <a href=\"GR-0069.html\">Вампиры</a>, <a href=\"GR-0071.html\">Банда Графа</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a>, <a href=\"VS-0008.html\">Оам</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0182--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-12-06</td>\n<td>393287–393296</td>\n<td>w0112</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-12-06</td>\n<td>393301–393317</td>\n<td>w0112</td>\n<td>Оам (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-02-06</td>\n<td>429348–429387</td>\n<td>w0115</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-02-07</td>\n<td>429565–429816</td>\n<td>w0115</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0182-oem.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0182--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0182.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["MR-0182-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/MR-0182/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Оэм — самый нагруженный узел из всего, что я вижу: на него ссылаются 16 статей. Поэтому чинить надо не его, а то, на чём он провисает.</p>\n<p>Первое — дочь Имитатора. Она заведена дважды: <code>PS-0324</code> «Дочь Имитатора» — пять ссылок, статья есть, 9403 знака, вселенная Оам; и <code>PS-0375</code> «Доима (дочь Имета)» — четыре ссылки, статьи нет, 9036 знаков, вселенная «неясно». Один персонаж, два id, почти одинаковый объём, и на второй — четыре ссылки в пустоту. При этом она названа одним из двух основных злодеев мира, а цель у неё не назначена ни там, ни там. Сначала свести две записи, потом искать цель — иначе цель будет найдена в одной, а ссылаться будут на другую.</p>\n<p>Второе — снова <code>SL-0054</code> «Список 12 апостолов»: семь ссылок, статьи нет, 234052 знака, и Оам с семью островами в числе привязанных вселенных. В Оэм апостолы — вторая ступень иерархии и «главные» на стороне добра, их 21. Разбирать список придётся всё равно.</p>\n<p>Третье, техническое, но оно блокирует именно эту статью: содержание итоговых документов. <code>SL-0126</code> «Документ по материалу на codepen» — 2974, <code>SL-0113</code> «Сайт-вики по вселенной (codepen)» — 6843, <code>SL-0115</code> «Сайт с историей и ассистентом» — 3919, <code>SL-0125</code> «Список нерешённых вопросов по миру Оэм» — 3899. У всех четырёх статьи нет, у всех по одной ссылке. Это единственное место, где могло осесть то, «что уже про сам мир есть».</p>\n<h3>С чего начать</h3>\n<p>В базе — <code>PS-0375</code> и <code>PS-0324</code>, сверка двух записей по 9 тысяч знаков. Потом <code>SL-0125</code>: список нерешённых вопросов по этому же миру уже кем-то составлен, и с ним стоит свериться прежде, чем составлять свой.</p>\n<p>Чего в базе нет: содержимое двух codepen-документов. Ссылки лежат в переписке — id 429381 (2026-02-06) и id 429804 (2026-02-07), окно w0115. Сам текст туда не попал, и Миколай это подтверждает: «я еще пару раз лоханулся и не скинул всё прям». Если страницы ещё живы, это единственный источник; архив переписки здесь не поможет, там только ссылки.</p>\n<h3>Как развивалось</h3>\n<p>2025-12-06, одно окно w0112: разложен состав мира — иерархия, полтора десятка рас и организаций, стороны конфликта, два основных злодея. И в этом же окне поставлена задача: «Так мне нужна цель и мотивация двух сильнейших за мир. И цель и мотивация двух сильнейших злодеев» (id 393316). Задача осталась внутри того же окна без ответа. Дальше два месяца молчания. 2026-02-06 вернулись — но не к содержанию, а к сборке: «Можешь туда Оэм закинуть?», и итог того же дня «Че то мало информация оказывается о ОЭМ». 2026-02-07 после перерыва документ доделан и принят: «Ну нор» / «М». Разложили — сразу назвали, чего не хватает — два месяца не возвращались — вернулись к упаковке.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для котов сказано, из чего они состоят: «они будут состоять из Оэм. Из-за этого понимания, объём и контроль Оэм у них выше чем у любого». То есть введены две мерки — объём и контроль, — и по ним верхняя ступень объявлена сильнейшей. Для апостолов, стоящих на второй ступени той же лестницы, ни объём, ни контроль не названы: про них сказано только, что их 21 и что они вторая по силе раса. Лестница выстроена по силе, а единственная названная мерка силы приложена только к её верху.</p>\n<p>Ещё одно место того же рода: про сестру прямо оговорено, что старая цель осталась во вселенной Правителя и в Оэм не переносится. Про Нуара, пришедшего в тот же мир из семи островов, такой оговорки нет — переносится с ним прежнее или нет, не сказано.</p>\n<h3>Отклик</h3>\n<p>Сильнее всего кусок с тремя претензиями подряд. Две про работу — где документ, почему забил на скибиди туалеты, — а третья вдруг не про работу, а про факт: «Ты сука сказал что у бессмера отрезали реботрутивный органы и у него есть дочь пиздешь у него нет дочери и ему ничего не отрезали». В одном списке невыполненных дел, между документом и роликом, лежит правка канона, и подана она с той же интонацией. Мир тут существует ровно в том же регистре, что и просрочка по задачам, и это честнее, чем если бы его берегли отдельно. Отдельно любопытно, что версии 3 и 4 — это версии не мира, а его тары: содержание не изменилось, изменилось только, влезло оно в документ или нет. И не влезло.</p></div>", "r": []}];</script>
