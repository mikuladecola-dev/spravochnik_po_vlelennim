<script>const BASE="";const DOCNAME="Рыжеволосый мальчишка";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0287-S01", "PS-0287--proishozhdenie"], "h": "<p>Персонаж наброска «Бетонный герой», выложенного Славой одним куском 2025-08-08 (id 354014–354016). Имени у него в тексте нет: он всё время назван по волосам — «рыжеволосый мальчишка», «рыжеволосый мальчуган», «рыжеволосый», «рыжик». Последнее — единственное, что звучит как обращение, и произносится оно в авторской речи, а не другим персонажем.</p>\n<p>Он один из двух беспризорных детей; второй — Свят (<a href=\"PS-0286.html\">Свят</a>), названный в тексте «его единственный друг». Про Свята сказано, что для «брошенного ребёнка» хватает короткого имени; отдельно про рыжеволосого этого не сказано, но живут и голодают они одинаково.</p>\n<p>Действие идёт не на Земле. Земля осталась в прошлом: «Много лет назад людям пришлось покинуть землю. Причины неизвестные или их скрывают». Рыжеволосый это знает и держится за это знание: «Мы с тобой не на Земле. Так что забудь уже».</p>", "r": [["Свят", "PS-0286.html"]]}, {"t": "Внешность", "a": ["S02", "PS-0287-S02", "PS-0287--vneshnost"], "h": "<p>Рыжие волосы — единственная названная черта, по ней он и именуется. Тело истощённое: в сцене погони оба мальчишки названы «двумя истощёнными мальчишками», а когда он бросается спасать друга, «тела не было готовой, к такой нагрузке. Плохо удерживало своего хозяина в равновесии». Цвет глаз, рост, возраст не названы.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0287-S03", "PS-0287--harakter"], "h": "<p>Определяющее состояние — голод, и через голод описано почти всё остальное. Небо, Земля, красота его не занимают: «Ему было без разница на небо и землю. На красоту о которой говорит его друг. Его интересовал лишь бурлящий желудок, что требовал его покормить». Голод показан физиологически: «Желудок скручивался, давил выжимал кислоты и продолжил переваривать самого себя. И мальчишка правда хотел его накормить. Но не мог».</p>\n<p>Злость у него идёт оттуда же, и текст это прямо оговаривает: когда он вспыхивает на друга («ну дурак и ты серьезно им поверил»), сказано, что «в душе понимая, что гнев был вызван не глупостью или наивностью его друга, а тем что желудок больно кольнул», и что боль и кислоту «он хотел выплюнуть хоть на кого-то».</p>\n<p>Скептик по отношению к рассказам старших: «Они даже не родились на земли, откуда им знать, как было раньше». Небо для него закрытая тема — «какой нахрен небо».</p>\n<p>При этом на друга реагирует мгновенно и телом раньше головы. Когда Свят перевешивается через перила, «его сердце забилось сильнее. Готовя тело действовать»; собственный рвотный позыв от кислоты он в этот момент не замечает — «Но рыжеволосый этого не заметил. Ни того не другого. Он просто бежал». После спасения сначала кричит («На кой ты за перила полез!!!»), потом протягивает руку, чтобы помочь встать.</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0287-S04", "PS-0287--sposobnosti"], "h": "<p>Никаких способностей у него в тексте нет. Сцена спасения решена наоборот — через нехватку сил: он тянет друга «со всех своих последних сил».</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0287-S05", "PS-0287--svyazi-s-drugimi"], "h": "<ul>\n<li><strong>Свят (<a href=\"PS-0286.html\">Свят</a>)</strong> — единственный друг, названный так прямо. Рыжеволосый разговаривает с ним резко, спорит про небо, но вытаскивает его с перил и делит с ним украденный хлеб.</li>\n<li><strong>Старшики</strong> — те, кто рассказывает Святу про синее небо и белые облака. Рыжеволосый им не верит и подозревает, что они могли Святу что-то дать: «Свят... Тебе.. Что-то старшики дали?». Свят отвечает: «да они, как будто дадут хоть, что-то».</li>\n<li><strong>Торговец</strong> — жилистый мужчина, у которого мальчишки крадут «всего-лишь хлеб. Кусочек даже», и который гонится за ними с криком «ЛОВИТе ВОРА!».</li>\n<li><strong>Обладатель мозолистой руки</strong> — неизвестный, кто перехватывает рыжеволосого раньше торговца: «Неизвестная мозолистая рука схватила мальца». Кто это, в наброске не сказано.</li>\n</ul>", "r": [["Свят", "PS-0286.html"]]}, {"t": "Что с ним стало", "a": ["S06", "PS-0287-S06", "PS-0287--chto-s-nim-stalo"], "h": "<p>Набросок обрывается на том, что рыжеволосого схватила чужая рука, а торговец «упал и купером покатился по бетонному полу». Продолжения нет: сразу после текста Слава пишет — «Это набросок, который я не продолжу» (2025-08-08, id 354016).</p>", "r": []}, {"t": "Пробелы", "a": ["S07", "PS-0287-S07", "PS-0287--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имени нет вовсе; в файле сущности это зафиксировано отдельно — «имени персонажа в тексте не дано».</li>\n<li>Возраст, внешность помимо цвета волос, происхождение, родители — не названы.</li>\n<li>Кто схватил его в конце и что было дальше — не сказано, набросок на этом кончается.</li>\n<li>Связь этого наброска с остальной вселенной «Апостол» (благословенные, грехи, организация) в переписке не проговорена.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0287--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0286.html\">Свят</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0286.html\">Свят</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0287--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-08-08</td>\n<td>354014–354016</td>\n<td>w0102</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0287-ryzhevolosyy-malchishka.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0287--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0287.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0287-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0287/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Дороже всего — «старшики». Сущности с таким именем в реестре нет вообще: ни id, ни статьи, ни строки базы. При этом на них стоит вся линия спора в двух статьях сразу — здесь («Рыжеволосый им не верит и подозревает, что они могли Святу что-то дать») и в <code>PS-0286</code>, где они названы единственным источником знания о синем небе, и ещё в <code>IS-0066</code>. Три статьи ссылаются на группу, которой в справочнике не существует. Всё, чем рыжеволосый занят в диалоге, — это опровержение старшиков; опровергать нечего, потому что предмета нет.</p>\n<p>Второе — не пробел, а обрыв связей. Кластер «Бетонного героя» весь стоит с нулём входящих: <code>IS-0066</code> (статья 29 129, база 61 184, ссылок 0), <code>MR-0147</code> (11 665 / 24 232, ссылок 0), <code>PR-0086</code> (8 762 / 9 358, ссылок 0), <code>PR-0088</code> (22 628 / 23 902, ссылок 0). Эта статья не ведёт ни в историю, из которой персонаж взят, ни в прозу с полным текстом — только в <code>PS-0286</code> и обратно. Плюс <code>PR-0090</code> (23 110 знаков базы, статьи нет, вселенная «неясно») — это дубль того же сентябрьского текста, что в <code>PR-0088</code>.</p>\n<h3>С чего начать</h3>\n<p>В базе, в архив идти незачем: набросок выложен одним куском и закрыт автором в тот же вечер.</p>\n<p><code>PR-0086</code>, id 354014–354018 — полный текст наброска. В нём есть вступление, которого нет ни в этой статье, ни в <code>PS-0286</code>: про героев, уведших людей с Земли и выродившихся в «жирных свиней», и про «Работа найдётся для всех».</p>\n<p><code>IS-0066</code>, версия 1, id 354017–354032. Статья обрывается на 354016 («Это набросок, который я не продолжу»), а дальше идут 354017 («Просто скажи я лучше начал писать?»), 354018 («Ну скоро на эту тему будет другой набросок а может и полноценная история») и разбор Миколая 354029 — про стиль, про «пусть и несколько пустые» описания и про то, что он «прочитал всё, но понял не много».</p>\n<p>Слово «старшики» в архиве встречается второй раз, и это ближайший ориентир к тому, что оно значит: id 311074, 2025-03-25, окно w0085 — «-старшики рассказали- не понятно зачем уточняет Игорь». Тот же приём: непроверяемый источник, за которым дети идут проверять. Лежит в <code>SP-0213</code>, <code>IS-0044</code> (55 525 знаков базы, статьи нет, вселенная «неясно») и <code>PS-0237</code> (79 461, статьи нет).</p>\n<p>Если искать обещанное продолжение — ориентир 2025-09-04, id 361477–361479 («Пишу историю», «Бетонный герой») и 2025-09-08, id 362520–362532. Название то же, отождествления с августовским обещанием в переписке нет.</p>\n<h3>Как развивалось</h3>\n<p>Одна дата: 2025-08-08, 21:41. В одном сообщении заявлен мир (Земля покинута, причины скрывают) и запущена пара мальчишек; в том же сообщении погоня обрывается на чужой руке. Через минуту, id 354016, автор закрывает: «Это набросок, который я не продолжу», — и тут же, id 354018, обещает вернуться к теме. Через месяц под тем же названием выходит другой текст, с другим героем и другим миром; связь не проговорена. Возврата к рыжеволосому в прочитанных окнах нет.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Про Свята правило именования названо прямо: «Святославом его конечно же не кто не звал. Просто Свят и все, что нужно для брошенного ребёнка». То есть проговорено, почему у брошенного ребёнка от имени остаётся половина. Рыжеволосый — брошенный ребёнок ровно того же положения, живёт и голодает так же, и у него не остаётся даже половины: имени нет вовсе, он назван по волосам. Почему одному хватило укороченного имени, а второму не досталось никакого, не сказано. Правило названо для одного случая, для соседнего того же рода — нет.</p>\n<h3>Отклик</h3>\n<p>Сильное здесь — как устроена его злость. Он орёт на друга, и текст тут же говорит, что орёт не по адресу: «в душе понимая, что гнев был вызван не глупостью или наивностью его друга, а тем что желудок больно кольнул». Персонаж сам знает, что несправедлив, и всё равно продолжает, потому что кислоту надо «выплюнуть хоть на кого-то». Это не оправдание и не осуждение, просто механика. И работает она в обе стороны: когда Свят перевешивается через перила, у рыжеволосого идёт рвотный позыв от той же кислоты — и «рыжеволосый этого не заметил. Ни того не другого. Он просто бежал». Тело, которое всю сцену только требовало и мешало, на одну минуту отменяется целиком. А потом он кричит на спасённого и тянет ему руку — в том же порядке, в каком это делают живые люди.</p></div>", "r": []}];</script>
