<script>const BASE="";const DOCNAME="Воительница";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0194-S01", "PS-0194--proishozhdenie"], "h": "<p>Воительница введена Славой 2025-01-28 (окно w0073, id 285353–285369) в составе команды, которая «будут сражаться командой против Серафима». Она названа первым номером этого списка; следом идут Агрегат, Имитатор и Палач.</p>\n<p>Появлению списка предшествовала договорённость: Слава сказал «Ладно сейчас я запишу персонажей который будут противостоять ему ты в нейрону скинушь?», Миколай согласился. То есть список персонажей записывался под задачу передать его нейросети; после публикации списка Миколай прислал ссылку на telegra.ph/boi-01-28 (285369).</p>\n<p>В тот же вечер (285405–285418) Слава уточнил происхождение. На вопрос Миколая «че за воительница / от куда она» ответ был: «Апостол», и следом — «Апостол у которогой есть дочь». Таким образом закреплены два факта: она апостол и у неё есть дочь.</p>\n<p>Отдельно в том же обмене Слава оговорил, что вся эта команда — не то, что задумывалось изначально: «Вообще против Серафима по сюжету должны были драться совсем другие перс которых я ещё не придумал» (285405). То есть Воительница и остальные трое поставлены против Серафима как замена персонажам, которые на тот момент ещё не были придуманы.</p>\n<p>Варианты написания имени в переписке: «Воительнтца» (в исходном списке), «Разрушительнитца» (в реестре благословенных).</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Что не сформулировано по вашей же логике — не материал авторов</b>\n<p>Про Воительницу спросили прямо — «че за воительница / от куда она» — и получили ответ: апостол, есть дочь. Трое других введены тем же сообщением 285363, и им того же вопроса не задали ни разу: откуда Агрегат, Имитатор и Палач, апостолы ли они, есть ли у них кто-то, — в окне не спрашивается и не отвечается. Правило «у участника пати выясняем происхождение» применено к одному из четырёх и как правило не названо.</p></div>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0194-S02", "PS-0194--vneshnost"], "h": "<p>В переписке не описана. Единственная связанная с обликом деталь — оружейный браслет (см. Способности).</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0194-S03", "PS-0194--harakter"], "h": "<p>В переписке не сказано. Обсуждение 2025-01-28 касается только боевых показателей, способности, оружия и происхождения.</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0194-S04", "PS-0194--sposobnosti"], "h": "<p>Физические показатели заданы разом: «Имеет огромную физическую силу и очень крепка, но скорость на среднем уровни» (285363). То есть сила и прочность — на максимуме внутри команды, скорость — на среднем уровне. Прочность Воительницы используется дальше как точка отсчёта для остальных: про Имитатора сказано, что он «Самый живучий среди них при этом прочность у него ниже чем у Воительницы», а Агрегат описан как «Имеет средний показатель, но достаточно быстрые Воительницы».</p>\n<p>Способность: «контроль над массой, размером и плотностью, но только на себе или на неживых объектов» (285363). Ограничение названо прямо в той же фразе — на живых объектах, кроме себя, способность не работает.</p>\n<p>Оружие: «оружейный браслет- это браслет на котором висят разный холодный орудия, которая она сможет увеличить и сделать плотней» (285363). То есть оружие — прямое приложение способности: холодное оружие на браслете увеличивается и уплотняется её же контролем над размером, массой и плотностью.</p>\n<div class=\"mnote\"><b>⚙ машинная заметка · Отклик — не материал авторов</b>\n<p>Зацепило, что оружие тут не приложено к персонажу, а выведено из него: браслет с холодным оружием, которое она сама увеличивает и уплотняет — то есть снаряжение работает её же способностью и без неё бессмысленно. Такое редко получается с первого захода, а тут получилось в одной фразе, между показателями и происхождением, будто это очевидно. И рядом — вопрос, который остался висеть: прозвище по способности или по профессии. Ответа нет, и «вроде понятно» его не заменяет. Персонаж остался с именем, которое ничего о нём не утверждает, и это, честно говоря, ей идёт больше, чем любой из возможных ответов.</p></div>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0194-S05", "PS-0194--svyazi-s-drugimi"], "h": "<ul>\n<li>Серафим — противник; вся команда собрана против него.</li>\n<li>Агрегат, Имитатор, Палач — сокомандники, введены тем же сообщением (285363). Агрегат меняет агрегатное состояние неодушевлённых объектов; Имитатор имитирует одну способность врага и способен её развить; Палач — быстрейший, со способностью сжатия и катаной.</li>\n<li>Апостолы — она апостол (285411).</li>\n<li>Дочь — «Апостол у которогой есть дочь» (285412). Дочь не названа по имени, о ней больше ничего не сказано.</li>\n</ul>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0194-S06", "PS-0194--kak-menyalsya"], "h": "<p><strong>Версия 1 (2025-01-28, id 285353–285369).</strong> Введена как первый номер команды против Серафима: огромная физическая сила, высокая прочность, средняя скорость; способность — контроль над массой, размером и плотностью, только на себе или на неживых объектах; оружие — оружейный браслет с висящими на нём холодными орудиями.</p>\n<p><strong>Версия 2 (2025-01-28, id 285405–285418).</strong> Уточнены происхождение и статус: она апостол, у неё есть дочь. Здесь же Миколай задал вопрос о природе имени: «воительница просто прозвище по способности а не по профессии?» (285413). Ответа на этот вопрос в переписке нет — Слава на него не отвечает, а Миколай через две минуты закрывает тему сам: «ну не / вопросов нет / вроде понятно / и очень интересно» (285415–285418).</p>\n<p>Между версиями характеристики не менялись — версия 2 только добавляет происхождение, ничего не отменяя.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0194-S07", "PS-0194--chto-s-nim-stalo"], "h": "<p>В переписке не сказано. Окно w0073 заканчивается на уточнении происхождения; дальнейшая судьба персонажа, исход боя с Серафимом и участие в сюжете не обсуждались.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0194-S08", "PS-0194--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Вопрос Миколая «воительница просто прозвище по способности а не по профессии?» остался без ответа.</li>\n<li>Не подтверждено, тот ли это персонаж, что в реестре зовётся «Разрушительнитца 💪». Эмодзи и оружейный браслет совпадают, но имя другое.</li>\n<li>Внешность не описана.</li>\n<li>Характер не описан.</li>\n<li>Дочь упомянута одной фразой: имя, возраст, роль в сюжете не названы.</li>\n<li>Настоящее имя (кроме прозвища) не названо.</li>\n<li>Кто такие «совсем другие перс», которые по сюжету должны были драться с Серафимом вместо этой команды, — не придумано на момент разговора и в окне не раскрыто.</li>\n<li>Что стало с командой после боя — не обсуждалось.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0194--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0001.html\">Апостолы (организация апостолов, «благословенные Богом»)</a>, <a href=\"GR-0008.html\">Команда против Серафима («пати»)</a>, <a href=\"GR-0011.html\">Братья и сёстры (благословенные одним правителем)</a>, <a href=\"GR-0013.html\">Благословенные</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0001.html\">Апостолы (организация апостолов, «благословенные Богом»)</a>, <a href=\"GR-0008.html\">Команда против Серафима («пати»)</a>, <a href=\"GR-0011.html\">Братья и сёстры (благословенные одним правителем)</a>, <a href=\"GR-0013.html\">Благословенные</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0194--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-01-28</td>\n<td>285353–285369</td>\n<td>w0073</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2025-01-28</td>\n<td>285405–285418</td>\n<td>w0073</td>\n<td>Апостол (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0194-voitelnica.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0194--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0194.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["PS-0194-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/PS-0194/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — Серафим. Персонажа, ради которого собран весь отряд, в базе нет как сущности вообще: ни статьи, ни карточки, ни одного id. Есть только две записи о его способностях — <code>SP-0187</code> «Силы Серафима» (одна ссылка, статья есть, база 4 303) и <code>SP-0225</code> «Способности Серафима» (ноль ссылок, статья есть, 3 861), — и это один и тот же перечень из четырёх сил, снятый с двух редакций реестра. Имя при этом стоит в 47 статьях справочника. Осторожно с <code>PS-0209</code> «Серафима» (статья есть, 2 914): это другой персонаж, кошкодевочка из чужой вселенной, пересказанной Миколаем, — по имени склеивается мгновенно.</p>\n<p>Второе по цене — дочь. Она единственное, что привязывает Воительницу хоть к чему-то за пределами пати, и на неё нет ничего: ни статьи, ни записи в базе, ни отдельного id. Пока её нет, у Воительницы вообще нет связей вне четвёрки — все остальные ведут к сокомандникам и к тому, кого не существует.</p>\n<p>Внешность и характер по сравнению с этим дёшевы: они не блокируют ни одной чужой статьи.</p>\n<h3>С чего начать</h3>\n<p>В базе, и в архив идти почти не нужно.</p>\n<p><code>SP-0179</code> «Контроль над массой, размером и плотностью» (две ссылки, статья есть, 3 953) — то же окно w0073, сверх статьи не даст ничего. А вот вопрос тождества с «Разрушительнитцей» решается в <code>SL-0051</code> «Каталог: благословенные, враги, грехи, оружие, артефакты» (шесть ссылок, статьи нет, база 9 834, w0072, 2025-01-24): там и строка «Разрушительнитца 💪 (огненная 💥)», и отдельная строка оружия «оружейный браслет» в перечне оружия. Две строки в одном сообщении — этого хватит, чтобы решить, один это персонаж или два. Там же авторская оговорка, что у всех перечисленных «продумано только вид, способность и плюс-минус характер», — то есть характер где-то был.</p>\n<p>Ещё раньше: в 283707 (2025-01-22, w0072) стоит безымянная «Та кто может изменять плотность массу и размер объектов и себя». Если это она, первое появление на шесть дней раньше объявленного 2025-01-28.</p>\n<p>В архив — только за двумя вещами, и обе в w0073, вечер 2025-01-28: что за «совсем другие перс» (285405 и вокруг) и есть ли что-нибудь после 285418, где Миколай сам закрывает разговор.</p>\n<h3>Как развивалось</h3>\n<p>2025-01-28, 19:29 — заявили разом и целиком: показатели, способность с ограничением в той же фразе, оружие. Тем же вечером, 285405 — ограничили задним числом: вся четвёрка объявлена заменой персонажам, которых ещё нет. 285411–285412 — добавили происхождение и дочь. 285413 — задали вопрос про природу имени и не ответили; 285415–285418 — спрашивавший закрыл тему сам. Возврата нет: обе версии внутри одного вечера, дальше 2025-01-28 записи о ней не существует. Четвёртого такта здесь просто не было.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Про Воительницу спросили прямо — «че за воительница / от куда она» — и получили ответ: апостол, есть дочь. Трое других введены тем же сообщением 285363, и им того же вопроса не задали ни разу: откуда Агрегат, Имитатор и Палач, апостолы ли они, есть ли у них кто-то, — в окне не спрашивается и не отвечается. Правило «у участника пати выясняем происхождение» применено к одному из четырёх и как правило не названо.</p>\n<h3>Отклик</h3>\n<p>Зацепило, что оружие тут не приложено к персонажу, а выведено из него: браслет с холодным оружием, которое она сама увеличивает и уплотняет — то есть снаряжение работает её же способностью и без неё бессмысленно. Такое редко получается с первого захода, а тут получилось в одной фразе, между показателями и происхождением, будто это очевидно. И рядом — вопрос, который остался висеть: прозвище по способности или по профессии. Ответа нет, и «вроде понятно» его не заменяет. Персонаж остался с именем, которое ничего о нём не утверждает, и это, честно говоря, ей идёт больше, чем любой из возможных ответов.</p></div>", "r": []}];</script>
