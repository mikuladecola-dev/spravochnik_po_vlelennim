<script>const BASE="";const DOCNAME="писатель";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0151-S01", "PS-0151--proishozhdenie"], "h": "<p>Персонаж Миколая, введённый в историю от 2024-08-26 (id 224938–224975, окно w0055). Отдельного представления у него нет — он опознаётся по способу записи диалога. Историю Миколай выложил одним сообщением (224940), где реплики двух персонажей идут вперемешку, и разделены только кавычками. Через два часа он это пояснил напрямую:</p>\n<div class=\"q\"><p>«в кавычках говорит твой спасатель» (224962)<br>«без них мой писатель» (224963)</p></div>\n<p>То есть весь текст без кавычек в 224940 — речь писателя. Своего имени в окне он не получает ни разу.</p>\n<p>Имя «писатель» — авторское обозначение из этого пояснения. В переписке он же называется «парнишка» и «паренёк» (226088), но неясно, о нём ли идёт речь в этих местах (см. Пробелы).</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0151-S02", "PS-0151--vneshnost"], "h": "<p>Прямого описания в его собственных сценах нет. Всё, что есть, идёт со стороны спасателя в тексте от 2024-08-29 (226088), при встрече на складе:</p>\n<div class=\"q\"><p>«ты такой маленький конечно, не в обиду.. в баскетбол наверное играешь? хахахах. ладно, прости. таких маленьких давно не видел, сколько рост? ну 165 в 27 лет это забавно конечно. ой, прости не хотел плечо отбивать, это уже инстинктивно получилось»</p></div>\n<p>Отсюда: рост 165 при 27 годах. Кем именно является собеседник в этой сцене, в переписке не уточнено — см. Пробелы.</p>\n<p>Отдельная физиологическая деталь из 224940: у него красная кровь. Спасатель проверяет его дозой, которая должна отключать монстров, доза не срабатывает. Писатель объясняет это так: «боже, да просто у меня другая группа крови». Спасатель отвечает: «у тебя в кровь красная, у него синяя. ты хоть одного человека видел, в чьей крови течёт гемоцианин?».</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0151-S03", "PS-0151--harakter"], "h": "<p>Складывается целиком из его реплик в 224940.</p>\n<p><strong>Жалеет пленника и не понимает опытов.</strong> Начинает с недоумения по поводу пойманного: «бро, мы походу голубец поймали. зачем он мне в любви признаётся. видно что в сознании и адекватен». Дальше прямо: «и вообще, я не понимаю что тебе этот человек сделал и зачем такие странные эксперименты».</p>\n<p><strong>Сопротивляется насилию, но уступает.</strong> На предложение спасателя стереть пленнику память «народными методами» реагирует: «стой, ну не обязательно наверное, кирпичем по голове». Получает в ответ «ты че такой весь правильный, мы и так по локоть в меазмах» — и соглашается: «эх, делай».</p>\n<p><strong>Разговорчивый и, по оценке спасателя, душный.</strong> На отказ отвечать про стокгольмский синдром говорит: «че такой душный, я так-то поговорить хотел». Спасатель раздражается на его вопросы: «реально, от куда ты так подробно всё знаешь, тебе че делать нечего?» — эту фразу произносит как раз писатель, обвиняя спасателя в том, что тот не работает, а «воображаешь там себе эти идеи».</p>\n<p><strong>Спорит о том, что «монстр» — это ярлык.</strong> Основная линия его позиции: наличие необычных свойств не делает существо монстром. На довод про пролом стен: «да я и сам бы такое сделал, но это же не значит что я монстр». На довод про гемоцианин: «это особенность природы, почему сразу монстр». Спасатель на это отвечает развёрнутой лекцией о том, что монстры — «один из доменов живых существ. в ряду с бактериями, археями или эукариотами».</p>\n<p><strong>Мыслит через аниме.</strong> Спрашивает про главаря монстров прямо в терминах аниме: «и где их мао садао?», потом расшифровывает: «ты че аниме не смотришь, ну где их тёмный повелитель, самый главный кого ты хочешь одолеть, герой наш?». Спасатель это обесценивает: «так бы сразу и говорил, а то свои мау сау тут начал. пересмотрел своих аниме теперь реальность выдумываешь».</p>\n<p><strong>Цепляется за оговорки.</strong> Услышав «хочешь чтобы я снова на тебя монстра натравил?», не отпускает тему: «в смысле снова?», а после ухода от ответа — «че ты имел блин ввиду под 'снова'? эй, не игнорь!». По пояснению Миколая, это место — точка частичного раскрытия спасателя: «он раскрылся, да не совсем» (224973).</p>\n<p><strong>Уточняет классификацию по мелочам.</strong> На предложение нарезать «тушку рыбомонстра» замечает: «ну осётр своего рода монстр, но он же из домена эукариотов. шизик».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0151-S04", "PS-0151--sposobnosti"], "h": "<p>Отдельных способностей у него не описано. Что есть:</p>\n<ul>\n<li>Доза спасателя, отключающая монстров, на нём не срабатывает. Объяснения два, и они противоречат друг другу: его собственное — «другая группа крови», спасателя — красная кровь против синей (гемоцианина). Чем этот факт кончается, в переписке не сказано.</li>\n<li>Ведёт эфир. Из-за этого возникает завязка сцены: спасатель проговаривается при пленнике, пленник понимает, что шёл эфир, а «вызывать амнезию не одно из наших веществ не умеет».</li>\n<li>Ему приписывают способность к вычислениям и к сбору денег в интернете — в 226088 спасатель планирует: «тот паренёк займётся вычислениями пока не надоест, деньги сможет с глубин интернета собрать на исследование». Идёт ли речь о писателе, в переписке не уточнено.</li>\n</ul>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0151-S05", "PS-0151--svyazi-s-drugimi"], "h": "<p><strong>Спасатель</strong> (персонаж Славы — «в кавычках говорит твой спасатель»). Основной собеседник и оппонент. Отношения асимметричные: спасатель бьёт его по ходу разговора («э, ты че меня бьёшь» — «я с тобой серьёзно говорю, зачем ты всё это делаешь»), тыкает иглой с дозой («эй, ты че делаешь. убери иглу, больно же»), угрожает натравить монстра. Он же объясняет писателю устройство мира. Мотив спасателя, названный им самим: «эти твари мои враги и я их же использую для мести», и позже, в 226088: «я. я хочу увидеть дочку. я устал видеть эти мерзкие лица, устал каждого уничтожать».</p>\n<p><strong>Пойманный монстр («голубец»).</strong> Выглядит человеком, в сознании и адекватен, признаётся писателю в любви — сам объясняет это стокгольмским синдромом. Синяя кровь, гемоцианин; после удара о землю в отключке каждый раз ломает стены. По словам спасателя, он писателя пожалел.</p>\n<p><strong>Монстры как домен живых существ.</strong> Понятие, которое писателю объясняют. Из этого же объяснения: предводителя у монстров нет, «их(существов) слишком много и нормально все живут вместе», инстинкт велит прятаться от людей, но люди и монстры «связаны ментальными сигналами», зависят друг от друга, и это обычно никак не отражается.</p>\n<p><strong>Эфир писателя.</strong> Вещание, которое он ведёт при пленнике и по требованию спасателя останавливает: «ты эфир остановил?» — «нет» — «тогда че ты спрашиваешь!?» — «ладно всё, я остановил».</p>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0151-S06", "PS-0151--kak-menyalsya"], "h": "<p><strong>2024-08-26, версия 1 (id 224938–224975).</strong> Первое появление. Писатель здесь — наивная сторона диалога: тот, кто задаёт вопросы про монстров и получает ответы, тот, кто жалеет пленника, и тот, кто ведёт эфир. Все сведения о нём даны изнутри спора.</p>\n<p>В обсуждении после текста Слава задал два вопроса: «Это он натравил карликов ?» (224957) и «И чё такая короткая» (224958). На второй Миколай ответил, почему история вышла короткой: «хез, я не знал уже о чем и как писал, я последние дни с бабушкой отношения пытался наладить», «и всё забыл» (224959–224960). Первый вопрос остался без ответа: Миколай сначала ответил не на него, потом написал «я ща на улице, неправильно прочитал» (224970) и перевёл разговор на слово «снова». Про карликов в этом окне больше ничего не сказано.</p>\n<p>Разъяснение, которое дал Миколай про «снова»: «спасатель натравил тех кто иллюзию по телеку покажет» (224967).</p>\n<p>Планы автора на момент окна: «я хочу ещё многое раскрыть, так что планирую ещё писать истории» (224975).</p>\n<p><strong>2024-08-29, версия 2 (id 226086–226102).</strong> Текст написан от лица спасателя — «один из повседневности спасателя» (226094), «хотел характер раскрыть» (226095). Писатель здесь виден только снаружи и только предположительно. Спасатель по телефону жалуется подруге: «да надоел этот парень спорить о том, что люди и монстры не связаны, утверждая что это отдельный вид. согласен, это совсем не аргумент. ещё говорит, что ауры не существует. ну ладно, это правда. но зачем всё услож...». Здесь спор развёрнут в другую сторону, чем в версии 1: там писатель доказывал, что монстр — ярлык, здесь ему приписывают тезис, что люди и монстры не связаны и что монстры — отдельный вид. Спасатель этот довод считает не аргументом, а тезис про ауру признаёт верным («ну ладно, это правда»).</p>\n<p>Дальше в том же тексте приходит собеседник ростом 165 в 27 лет, которому показывают склад, и упоминается «тот паренёк», который «займётся вычислениями пока не надоест». Совпадают ли все три (парнишка по телефону, пришедший на склад, паренёк для вычислений) — в переписке не сказано.</p>\n<p>Своей работой в этот день Миколай остался недоволен и сказал об этом сразу после текста: «боже», «прости», «я не могу», «я не умею писать», «я не знаю что мне делать» (226089–226093).</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0151-S07", "PS-0151--chto-s-nim-stalo"], "h": "<p>Дальнейших появлений в материале окна нет. Последнее, что о нём известно, — планы спасателя загрузить его вычислениями и сбором денег на исследование рыбочеловека (226088), и намерение автора продолжать: «планирую ещё писать истории» (224975). Выполнено ли это, из окна w0055 не видно.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0151-S08", "PS-0151--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имя персонажа в окне ни разу не названо. В подсказке триажа он назван Захаром — в тексте окна этого нет.</li>\n<li>Неясно, он ли «тот паренёк» из 226088 и он ли пришедший на склад собеседник ростом 165 — или это кто-то другой, в том числе пойманный монстр. Прямого отождествления в переписке нет.</li>\n<li>Что такое его эфир — где он идёт, для кого, о чём — не сказано; сказано только, что он был включён при пленнике и его остановили.</li>\n<li>Чем кончилась история с пленником, понявшим про эфир, и применили ли кирпич — в переписке не сказано, хотя писатель произносит «эх, делай».</li>\n<li>Противоречие в объяснении, почему на него не действует доза (группа крови против цвета крови), не разрешено.</li>\n<li>Вопрос Славы «Это он натравил карликов?» (224957) остался без ответа.</li>\n<li>Отношения писателя и спасателя — кто кому кем приходится, как они познакомились — не описаны; известно только, что они работают вместе и что спасатель уже натравливал на писателя монстра («снова»).</li>\n<li>Какие именно опыты ставит спасатель и зачем — не объяснено; сам писатель этого тоже не понимает.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0151--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0151--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-26</td>\n<td>224938–224975</td>\n<td>w0055</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-08-29</td>\n<td>226086–226102</td>\n<td>w0055</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0151-pisatel.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0151--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0151.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
