<script>const BASE="";const DOCNAME="Режим оленя";
const LEAD="";
const CH=[{"t": "Механика — как работает", "a": ["S01", "SP-0062-S01", "SP-0062--mehanika"], "h": "<p>Вторая форма десятого персонажа — целителя. Задача, из которой способность выросла, поставлена Славой: «Ну вот он такой миленький добренький / И какая у него должна быть защитная или атакующая способность» (2024-05-11, id 167939). То есть форма закрывает для доброго целителя нехватку защиты и атаки.</p>\n<p>Предложение Миколая: «Может биполярку ебанём? / И как у героя щита у него будет режим гнева» (id 167942–167943). Механика опирается на смену состояния — переключение в гнев, — а образцом назван режим гнева героя щита.</p>\n<p>Название дал Слава, ответив на уточнение Миколая «Я про защиту» (id 167946) словами «Режим оленя» (id 167949).</p>\n<p>Как режим работает — что даёт, чем включается, чем выключается — в переписке не описано.</p>", "r": []}, {"t": "Ограничения и цена", "a": ["S02", "SP-0062-S02", "SP-0062--ogranicheniya-i-cena"], "h": "<p>Не названы.</p>", "r": []}, {"t": "Носители — у кого есть", "a": ["S03", "SP-0062-S03", "SP-0062--nositeli"], "h": "<p>Десятый персонаж, целитель. По описанию Славы — «такой миленький добренький» (id 167939). Отдельным именем персонаж в этом окне не назван.</p>", "r": []}, {"t": "Как менялась по версиям — по датам", "a": ["S04", "SP-0062-S04", "SP-0062--kak-menyalas-po-versiyam"], "h": "<p><strong>Версия 1 — 2024-05-11, день (id 167939–167955, окно w0034).</strong> Постановка задачи и первое оформление: биполярка, режим гнева «как у героя щита», переименование в «режим оленя». В том же куске переписки идёт параллельный разговор о внешности персонажа — упрощение рисунков на голове, зимняя одежда «старых веков а не нового», длинные волосы; Миколай при этом отмечает, что «специально решил для стиня современную впизнуть» (id 167950). К механике режима это не относится.</p>\n<p><strong>Версия 2 — 2024-05-11, вечер (id 168319–168323, окно w0034).</strong> Повторный заход в тот же день. Миколай спрашивает: «Ты продумал режим оленя?» — Слава: «Нет ещё» (id 168321–168322). Новых деталей нет; на этом разработка в окне обрывается.</p>", "r": []}, {"t": "Отклонённые варианты — что предлагали и забраковали", "a": ["S05", "SP-0062-S05", "SP-0062--otklonennye-varianty"], "h": "<p>Отклонённых вариантов в переписке нет. Названия «биполярка» и «режим гнева» не забракованы, а вытеснены названием «режим оленя»; в записи они значатся вариантами имени.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "SP-0062-S06", "SP-0062--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Механика режима так и не описана.</li>\n<li>Не сказано, защитная это форма, атакующая или обе сразу, — вопрос Славы был про «защитную или атакующую», а Миколай уточнял «Я про защиту» (id 167946), но ответа по существу нет.</li>\n<li>Не объяснено, что именно берётся от режима гнева героя щита.</li>\n<li>Не объяснено, при чём тут олень и почему такое название.</li>\n<li>Не сказано, как режим связан с «биполяркой» — это две стороны одного состояния или разные вещи.</li>\n<li>Прямо зафиксировано, что на 2024-05-11 вечера способность не продумана.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["SP-0062--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0014.html\">игра бога</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["SP-0062--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-05-11</td>\n<td>167939–167955</td>\n<td>w0034</td>\n<td>игра бога (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-05-11</td>\n<td>168319–168323</td>\n<td>w0034</td>\n<td>игра бога (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/sposobnosti/SP-0062-rezhim-olenya.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["SP-0062--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/SP-0062.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
