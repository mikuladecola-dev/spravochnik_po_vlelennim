<script>const BASE="";const DOCNAME="Другие исследователи";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0358-S01", "PS-0358--proishozhdenie"], "h": "<p>Другие исследователи (в переписке также «другие люди», «исследователи») — остальные люди, очутившиеся в бесконечном данже и спускающиеся по нему. Появились в разговоре как часть постановки вопроса о системе прокачки: «Допустим там есть другие исследователи ( ну то бишь люди который здесь очутились и спускаються по данжу, но без возможности вернуться в прошлое). И вот система прокачки. Типа навыки и очки, ну и деньги.?» (2026-04-11, id 457515).</p>\n<p>На прямой вопрос, откуда они берутся — «а другие люди умирающие откуда появляются?», «спавн?» (id 457561–457562), — дан ответ: «Они не помнят» (id 457564). То есть механизм их появления в данже в переписке не назван; зафиксировано только отсутствие у них памяти о том, откуда они пришли.</p>\n<p>У каждого исследователя есть своя начальная комната: «Смысли, ну начальная комната в которой выдаются базовое оружие / У каждого начальная комната своя» (id 457566).</p>", "r": []}, {"t": "Способности", "a": ["S02", "PS-0358-S02", "PS-0358--sposobnosti"], "h": "<p>Отдельных способностей у них не описано. Зафиксировано:</p>\n<ul>\n<li>в начальной комнате выдаётся базовое оружие (id 457566);</li>\n<li>на них распространяется общая система прокачки — «Типа навыки и очки, ну и деньги» (id 457515); ради того, чтобы такая общая система имела смысл, они и были введены;</li>\n<li>ключевое отличие от главного героя — отсутствие возврата в прошлое: они «без возможности вернуться в прошлое» (id 457515), «Другие люди навсегда умирают если что» (id 457567).</li>\n</ul>", "r": []}, {"t": "Связи с другими", "a": ["S03", "PS-0358-S03", "PS-0358--svyazi-s-drugimi"], "h": "<ul>\n<li>Главный герой — противопоставлены ему по признаку петли: у него возврат в прошлое есть, у них нет.</li>\n<li>Данж — общий для всех: на уточняющий вопрос «а как / просто у каждого свой данж» (id 457573) дан ответ «Нет у них один данж, но свои комнаты» (id 457574). Поэтому «они могут пересекаться с другими людьми» (id 457572).</li>\n<li>Система прокачки — введены как те, ради кого нужна общая система прокачки.</li>\n</ul>", "r": []}, {"t": "Как менялся", "a": ["S04", "PS-0358-S04", "PS-0358--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2026-04-11 (id 457515).</strong> Введены одной репликой при постановке вопроса о системе прокачки: люди, очутившиеся здесь и спускающиеся по данжу, без возможности вернуться в прошлое. Тем же сообщением оговорено, что уровни данжа будут придумываться на ходу, «это не так уж и важно Из-за его вычных изменений условий».</p>\n<p><strong>Версия 2 — 2026-04-11 (id 457561–457575).</strong> Уточнения в ответ на вопросы Миколая:</p>\n<ul>\n<li>откуда появляются — «Они не помнят» (id 457564);</li>\n<li>у каждого своя начальная комната с базовым оружием (id 457566);</li>\n<li>умирают навсегда (id 457567);</li>\n<li>на вопрос «они начинают с первого уровня или рандомно? или можно вечно вверх идти тоже» (id 457568) — «Ну там нету первого уровня. У каждого свои данжы. Но они подобраны так чтобы все-таки был шанс на выживание при твоём текущем состоянии» (id 457571);</li>\n<li>пути могут пересекаться (id 457572), при этом данж один, а комнаты — свои (id 457574). Формулировка «у каждого свои данжы» (id 457571) через две реплики поправлена на «у них один данж, но свои комнаты» (id 457574).</li>\n</ul>", "r": []}, {"t": "Что с ним стало", "a": ["S05", "PS-0358-S05", "PS-0358--chto-s-nim-stalo"], "h": "<p>Смерть для них окончательна: «Другие люди навсегда умирают если что» (id 457567). Никакого механизма возврата, воскрешения или переноса для них в переписке не названо.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0358-S06", "PS-0358--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Внешность не описана.</li>\n<li>Характер, поведение, отношение к главному герою и друг к другу не обсуждались.</li>\n<li>Механизм появления в данже не назван: на вопрос «спавн?» ответа по существу нет, сказано только, что сами они не помнят.</li>\n<li>Численность, встречались ли конкретные исследователи с героем, есть ли среди них именованные — в переписке не сказано.</li>\n<li>Как именно «подбираются» подземелья под текущее состояние и кто их подбирает — осталось нерешённым.</li>\n<li>Возможность идти по данжу вверх, о которой спросил Миколай (id 457568), отдельного ответа не получила.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0358--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0005.html\">Иссекай</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0358--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-04-11</td>\n<td>457515–457515</td>\n<td>w0119</td>\n<td>Иссекай (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2026-04-11</td>\n<td>457561–457575</td>\n<td>w0119</td>\n<td>Иссекай (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0358-drugie-issledovateli.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0358--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0358.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
