<script>const BASE="";const DOCNAME="Тен";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0078-S01", "PS-0078--proishozhdenie"], "h": "<p>Тен — один из результатов эксперимента по превращению бесцветного в цветного. По словам Славы (2024-05-25, id 173165), «вообще в этом эксперименте только 3 удачных экземпляра / Это командир, волк, Тен( многоликий) / За все 30-50 лет». То есть Тен входит в тройку удачных экземпляров, набранную за срок в 30–50 лет.</p>\n<p>Остальной итог эксперимента назван тут же: на вопрос Миколая «А неудачные умерли?» Слава отвечает «Да больше миллиона умерло» и добавляет «Или не в состояний двигаться» (id 173166–173168).</p>\n<p>Впервые Тен появляется в перечне персонажей, который Слава выписывает по памяти (2024-05-25, id 173128): «Энергет, прятки, закон, петля, феникс, Тен, волк, дракон, ци, имитатор, спартанец, вампир, драгоценность, бессмерт, жук, лёд, Дилан, граница, солнце». Список составлен со словами «Надо потихоньку записывать а то я по тихонько забываю» (id 173129), то есть как опись уже придуманного, а не как придумывание на месте.</p>", "r": []}, {"t": "Способности", "a": ["S02", "PS-0078-S02", "PS-0078--sposobnosti"], "h": "<p>Расшифровка при первом же уточняющем вопросе Миколая «Кто такие» — «Тен 10 форм» (2024-05-25, id 173132). Второе имя — «многоликий» (id 173165), оно же вынесено в варианты имени.</p>\n<p>Что это за десять форм, в переписке не сказано. Ни одна из форм не названа и не описана.</p>", "r": []}, {"t": "Связи с другими", "a": ["S03", "PS-0078-S03", "PS-0078--svyazi-s-drugimi"], "h": "<ul>\n<li>Волк (<a href=\"PS-0079.html\">Волк</a>) — «Волк командир команды тена с способностю как у волка» (2024-05-25, id 173132). То есть у Тена есть команда, и командует ею Волк. Состав команды, кроме этих двоих, не назван.</li>\n<li>Эксперименты по превращению бесцветного в цветного — Тен один из трёх удачных экземпляров (id 173165).</li>\n<li>Энергетик (<a href=\"PS-0083.html\">Энергетик</a>) — связь не сюжетная, а внешняя: оба рассматривались как кандидаты в главные герои (id 173337).</li>\n</ul>", "r": [["Волк", "PS-0079.html"], ["Энергетик", "PS-0083.html"]]}, {"t": "Как менялся", "a": ["S04", "PS-0078-S04", "PS-0078--kak-menyalsya"], "h": "<p><strong>2024-05-25, id 173128–173136 (окно w0035).</strong> Появление в списке персонажей и расшифровка: «Тен 10 форм». В том же обмене сообщениями расшифровываются соседние персонажи — Волк, Дракон («женщина способна превращаться в дракона частично или полностью»), Ци («владелец не контролирующий энергий использует посых для контроля»).</p>\n<p><strong>2024-05-25, id 173163–173168 (окно w0035).</strong> Тен помещён в контекст эксперимента: один из трёх удачных экземпляров за 30–50 лет, помечен как «многоликий».</p>\n<p><strong>2024-05-25, id 173330–173340 (окно w0035).</strong> Тен рассматривается как кандидат в главные герои. Слава: «Да у меня даже нет гг чтобы пихнуть ему двигатель сюжета», «Ну у меня они все как гг почти», «Поэтому я ещё не определился кто может стать гг», «Типо Тен вполне может и энергетик» (id 173332, 173335–173337). Решение принято в пользу энергетика: «Ну ладно пусть будет пока энергетик» (id 173338). Слово «пока» в реплике сохраняется — выбор обозначен как временный.</p>", "r": []}, {"t": "Отклонённые варианты", "a": ["S05", "PS-0078-S05", "PS-0078--otklonennye-varianty"], "h": "<p>Кандидатура Тена на роль главного героя — предложена и не выбрана (2024-05-25, id 173337–173338). Отклонение сформулировано не как отказ от Тена, а как временное предпочтение энергетика.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "PS-0078-S06", "PS-0078--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Что именно за 10 форм — не раскрыто. Ни одна форма не названа.</li>\n<li>Внешность Тена не описана.</li>\n<li>Характер не описан.</li>\n<li>Что с ним стало по сюжету — в переписке не сказано; сюжета на момент этих сообщений нет, Слава прямо говорит: «мы только персонажей и систему сил продумали» (id 173331).</li>\n<li>В списке трёх удачных экземпляров названы «командир, волк, Тен» — при том что Волк сам описан как командир команды Тена. Совпадают ли «командир» и «волк» в этом перечне или это два разных лица, в переписке не проговорено.</li>\n<li>Состав команды Тена не назван.</li>\n<li>Как Тен попал в эксперимент, был ли он до него бесцветным — не сказано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0078--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0089.html\">Команда Тена</a>, <a href=\"GR-0090.html\">Бесцветные и Цветные</a></li>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0079.html\">Волк</a>, <a href=\"PS-0083.html\">Энергетик</a></li>\n<li><strong>Упомянут в персонажах:</strong> <a href=\"PS-0077.html\">Командир</a>, <a href=\"PS-0079.html\">Волк</a>, <a href=\"PS-0083.html\">Энергетик</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0089.html\">Команда Тена</a>, <a href=\"GR-0090.html\">Бесцветные и Цветные</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0078--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-05-25</td>\n<td>173128–173136</td>\n<td>w0035</td>\n<td>Цветной мир (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-05-25</td>\n<td>173163–173168</td>\n<td>w0035</td>\n<td>Цветной мир (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-05-25</td>\n<td>173330–173340</td>\n<td>w0035</td>\n<td>Цветной мир (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0078-ten.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0078--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0078.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
