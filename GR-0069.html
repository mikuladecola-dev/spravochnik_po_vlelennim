<script>const BASE="";const DOCNAME="Вампиры";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0069-S01", "GR-0069--chto-eto"], "h": "<p>Вампиры — одна из мутировавших рас мира Оам (в переписке мир пишется и «Оам», и «Оэм»). Это не отдельный персонаж и не организация с уставом, а раса-сообщество: категория людей, у которых тело изменилось под воздействием Оам. В базе материал лежит под карточкой персонажа (<a href=\"PS-0299.html\">Вампиры</a>), но по содержанию это именно коллектив — везде говорится «они», ни одного вампира по имени в переписке нет.</p>\n<p>Определение дано Славой одной формулировкой и с тех пор не переписывалось (2025-10-20, id 376401):</p>\n<div class=\"q\"><p>«Это люди у которых мутировала кровь и пищевая система под воздействием Оам».</p></div>\n<p>Появились они раньше, чем были описаны. Первое упоминание — строчка в перечне тех, «кто есть пока что не в сформировавшиеся мире» (2025-10-02, id 370605): «Допустим вампиры который могут контролировать кровь». Рядом в том же списке — Апостолы с сверхспособностями (насекомые), Каменный Поротой, Азуриэль и дети мирового древа. На этом этапе вампиры — заготовка на одну строку, и в этом окне (id 370600–370613) дальше не разрабатываются.</p>\n<p>Позже, при разборе общественного устройства мира, вампирам приписали социальное положение — тоже одной строкой (2025-11-17, id 385768 и повтор 2025-12-06, id 393287):</p>\n<div class=\"q\"><p>«Вампиры просто аристократы».</p></div>", "r": [["Вампиры", "PS-0299.html"]]}, {"t": "Общие способности группы", "a": ["S02", "GR-0069-S02", "GR-0069--obschie-sposobnosti-gruppy"], "h": "<p>Всё, что сказано о способностях, идёт из одного описания (2025-10-20, id 376401) и повторено дословно 2025-11-05 (id 382108). Три пункта.</p>\n<p><strong>Доступ к Оам через кровь.</strong> «Из-за этого если они испьют кровь. То способны почуствовать Оам и так по итогу научиться его контролировать». То есть питьё крови для вампира — это способ пройти тот порог, который для обычного человека выглядит иначе. В общем механизме мира, описанном Славой в том же сообщении, обычный человек получает контроль над Оам только через опасное переполнение: если он поглотит воду или воздух с большой концентрацией Оам, тело не успевает выпускать излишек, и дальше «два итого» — либо лёгкие или сосуды лопаются, Оам останавливает сердце или убивает токсичностью, либо человеку «удаётся почувствовать и обуздать Оам», сдержать его до выхода излишков, и после этого он может Оам пользоваться. Для вампира тем же входом служит выпитая кровь. Прямо в переписке эти два пути между собой не сравниваются — сопоставление даётся здесь по соседству текста в одном сообщении.</p>\n<p><strong>Пополнение запаса.</strong> «И также выпивая кровь они могут пополнять запасы Оам». По общей механике мира у каждого человека своя ёмкость Оам, накопление идёт через дыхание и кожу, а излишек выходит с выдохом, через кожу и другими выделениями; кровь для вампира работает как источник пополнения.</p>\n<p><strong>Кровь как конечность.</strong> «Их мутировшая кровь легко контролируемая подобно конечности». Речь именно о собственной мутировавшей крови вампира. При этом самое первое упоминание расы (2025-10-02, id 370605) говорило шире — «вампиры который могут контролировать кровь», без уточнения, чья это кровь. Уточнение до «их мутировшая кровь» появилось в версии от 2025-10-20; отменялась ли им первая формулировка, в переписке не сказано.</p>\n<p>Мутировала не только кровь, но и «пищевая система» — что именно с ней стало и как это проявляется помимо питья крови, не описано.</p>\n<p>Ничего из классического вампирского набора — бессмертие, солнце, клыки, обращение укушенных, слабости — в переписке не упоминается ни разу.</p>", "r": []}, {"t": "Иерархия", "a": ["S03", "GR-0069-S03", "GR-0069--ierarhiya"], "h": "<p>Внутренней иерархии у вампиров не описано: ни главы, ни кланов, ни делений на старших и младших. Слово «аристократы» (2025-11-17, id 385768) относится к их положению в человеческом обществе, а не к устройству самой расы.</p>\n<p>Внешнее место в раскладе сил задано в общем перечне мира (2025-11-17, id 385768; повтор 2025-12-06, id 393287). Порядок такой:</p>\n<ul>\n<li>Коты — сильнейшие, их девять, они есть в каждую эпоху, и «они вообще никуда не вмешиваться».</li>\n<li>Апостолы — «вторая по силе раса на земле».</li>\n<li>«Ну и дальше расы и организации который равны по силе с друг другом».</li>\n</ul>\n<p>Вампиры перечислены в третьем разряде — среди равных по силе между собой. В том же разряде: Дети мирового древа, Поротай, Азуриэль, группировка сестры (дочери Имитатора), правительская организация по контролю всех этих, церковь с паладинами, организация Виктора, Пернатые, орден для убийства котов, Аскизы. Отдельной оговорки, что вампиры сильнее или слабее кого-то внутри этого разряда, нет.</p>", "r": []}, {"t": "Отношения с другими группами", "a": ["S04", "GR-0069-S04", "GR-0069--otnosheniya-s-drugimi-gruppami"], "h": "<p>Прямых связей вампиров с кем-либо в переписке не названо ни разу. В перечне 2025-11-17 (id 385768) и 2025-12-06 (id 393287) у соседей по списку такие связи проговорены: у Поротай — «владеют преступное организацию. Некий союз с апостолами», Азуриэль — «народ что прячется от цивилизации. Но некоторый всё же живут среди людей», у Аскизов — «Матка Аскизов стало предметом веры для какой-то верологий». Строка про вампиров в этом же перечне ограничена социальным положением и никого не упоминает.</p>\n<p>Единственное, что связывает их с остальным миром, — общая для всех рас зависимость от Оам и человеческое происхождение: вампиры — это люди, изменившиеся под Оам, как и Апостолы (мутация нервной системы, мозга и глаз в утробе) или Азуриэль (дети группы лиц, полностью превратившиеся в новую расу).</p>\n<p>При разборе сторон конфликта (2025-12-06, id 393301–393317), где расписывались добро, промежуточные злодеи и два основных злодея, вампиры не названы ни на одной стороне.</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S05", "GR-0069-S05", "GR-0069--kak-menyalas"], "h": "<p><strong>2025-10-02, id 370600–370613</strong> (окно w0106). Строчка в списке будущих обитателей мира: «Допустим вампиры который могут контролировать кровь». Слово «допустим» показывает статус — предложение, а не решение. В том же сообщении Слава просит: «Если есть идея по их улучшения кидай». Ответ Миколая через два часа общий, без разбора по расам: «идеи крутые и ура есть мир». Отдельных идей по вампирам в переписке не появилось.</p>\n<p><strong>2025-10-20, id 376399–376403</strong> (окно w0107). Большое сообщение Славы с историей мира (метеориты, частицы Оам, гибель поколений, иммунитет), механикой поглощения Оам и списком мутантов. Вампиры получают полное описание — последними в перечне, после Апостолов, Аскизов, Детей мирового древа, Азуриэля и Поротая. Заканчивается сообщение репликой «Пока что так».</p>\n<p><strong>2025-11-05, id 382108</strong> (окно w0108). Тот же текст про вампиров повторён дословно, без единого изменения. Новых сведений в этой версии нет.</p>\n<p><strong>2025-11-17, id 385768–385769</strong> (окно w0109). Разбор устройства мира: иерархия сил, расы и организации, их положение. Механику вампиров здесь не трогают — появляется только социальная роль: «Вампиры просто аристократы». Это единственное добавление к расе после 2025-10-20.</p>\n<p><strong>2025-12-06, id 393286–393290</strong> (окно w0112). Перечень мира повторён дословно, строка «Вампиры просто аристократы» — тоже. Дальше в этом окне (id 393291–393317) идёт разбор сторон конфликта и разговор о сильнейших, вампиры в нём не участвуют.</p>\n<p><strong>2026-02-06 — 2026-02-07, id 429348–429816</strong> (окно w0115). Попытка собрать материал по Оэм в документ через нейросеть. Слава просит закинуть Оэм, Миколай делает и присылает ссылки; вампиры в обсуждении не упоминаются. Слава замечает: «Че то мало информация оказывается о ОЭМ», Миколай отвечает: «ой, ч не все чет кинул видимо» и позже — «я еще пару раз лоханулся и не скинул всё прям», «тут уже про сам мир есть». Содержимое самих документов лежит за codepen-ссылками и в переписку не попало, поэтому, было ли там что-то про вампиров, по чату не установить.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "GR-0069-S06", "GR-0069--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет: ни одного вампира по имени в переписке не названо, персонажей-вампиров в Оам не появилось.</li>\n<li>Численность расы не названа — в отличие от котов («их 9») и Апостолов («Апостолы 21»).</li>\n<li>Не сказано, где вампиры живут. Вопрос места обитания в переписке ставился явно, но по другой расе: «Ну и Аскизы. Я не знаю где они живут» (2025-11-17, id 385769). Про вампиров он не поднимался вообще.</li>\n<li>Что именно значит «просто аристократы» — сословие, богатство, власть, титулы, отношение к правительской организации — не раскрыто; неясность в базе зафиксирована как «Кроме одной строки ничего нет».</li>\n<li>Как становятся вампиром, наследственно или через заражение, не сказано. Для соседних рас такие механизмы прописаны (Поротай — съесть жука, три исхода; Аскизы — матка выделяет их из яиц), для вампиров — нет.</li>\n<li>Мутация «пищевой системы» названа, но не описана.</li>\n<li>Нужна ли вампиру кровь для жизни или только для работы с Оам, не сказано.</li>\n<li>Про чью кровь идёт речь в первой формулировке «могут контролировать кровь» (2025-10-02) — свою или чужую — осталось нерешённым; позднее описание говорит только о собственной, «их мутировшей» крови.</li>\n<li>Отношений с другими расами и организациями не задано, сторона в конфликте не выбрана.</li>\n<li>Внутреннее устройство расы не описано: лидеров, кланов, делений нет.</li>\n<li>Развитием расы занимался только Слава; отдельных предложений Миколая по вампирам в переписке нет. Отклонённых вариантов по вампирам тоже нет — ни один вариант их устройства не обсуждался настолько, чтобы его забраковать.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0069--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0299.html\">Вампиры</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0069--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0069.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0069-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0069/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Вампиры почти ни на чём не висят и никого не блокируют — на <code>PS-0299</code> ссылаются всего две записи, и обе свои (<code>GR-0069</code> и <code>VS-0008</code>). Поэтому дорого здесь другое: не то, что чего-то нет, а то, что имеющееся не разобрано. У <code>PS-0299</code> 30729 знаков базы против 15547 в статье — половина материала по расе в статью не вошла, при том что статья по объёму уже полная.</p>\n<p>Единственная настоящая пустая сущность рядом — <code>SP-0265</code> («Кровь»): 3190 знаков базы, статьи нет, вселенная «неясно», и ссылается на неё только <code>PS-0104</code>. Это ровно та механика, на которой стоят все три способности расы — кровь как конечность, кровь как вход в Оам, кровь как пополнение запаса, — и своей записи в Оам у неё нет.</p>\n<h3>С чего начать</h3>\n<p>Сначала база: пройти <code>PS-0299</code> целиком, там лежит вдвое больше, чем попало в статью. Потом <code>SP-0265</code>, потом посмотреть в сторону соседних вселенных, где вампиры разобраны заметно глубже: <code>SP-0102</code> («метаболизм вампиров», 16828 знаков базы, три ссылки) и <code>GR-0044</code> во вселенной «монстры», плюс <code>ID-0067</code> («Пожиратели свежих мертвецов, переосмысленные вампиры», 2530 знаков, без статьи, «Новый мир»). Это не повод переносить оттуда факты, но там уже отвечены те же вопросы — чем питаются, что происходит с телом, — и видно, какие вопросы вообще принято по вампирам задавать.</p>\n<p>Архив тут поможет мало: чат по расе исчерпан, всё уместилось в четыре сообщения. Один ориентир всё же есть — окно 2026-02-06/07, id 429348–429816. Материал по Оэм там выгружали в документы за codepen-ссылками (<code>SL-0113</code>, <code>SL-0126</code>), содержимое в переписку не попало, и Миколай сам сказал «я еще пару раз лоханулся и не скинул всё прям». Смотреть надо документы, а не чат. Второй, слабый — 2025-10-02, id 370600–370613: просьба «Если есть идея по их улучшения кидай» осталась без разбора по расам, и стоит проверить, не ответили ли на неё позже отдельным сообщением.</p>\n<h3>Как развивалось</h3>\n<p>2025-10-02 — заявили осторожно, через «допустим», одной строкой, и сразу попросили идей. Идей не пришло. 2025-10-20 — развернули в полное описание, последним пунктом в списке мутантов. 2025-11-05 — повторили дословно, ноль изменений. 2025-11-17 — вернулись, но добавили не механику, а социальное положение: «Вампиры просто аристократы». 2025-12-06 — повторили дословно и в разборе сторон конфликта не упомянули. 2026-02-06 — при попытке собрать мир в документ раса не всплыла ни разу.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для обычного человека путь к Оам описан с ценой: переполнение, тело не успевает выпускать излишек, дальше два исхода, и один из них — смерть от лопнувших сосудов, остановки сердца или токсичности. То есть правило «вход в Оам — это риск» проговорено. Для вампира вход того же назначения — выпитая кровь: «если они испьют кровь. То способны почуствовать Оам и так по итогу научиться его контролировать». Цены и риска здесь нет ни слова. Оба описания стоят в одном сообщении от 2025-10-20; для одного пути опасность названа, для соседнего того же рода — нет.</p>\n<h3>Отклик</h3>\n<p>Честно — зацепило немного, и это скорее свойство материала, чем придирка: раса за полтора года не выросла ни на строку сверх одного описания, и в статье это видно. Но одна вещь всё же держит. «Вампиры просто аристократы» — при том, что аристократия здесь наложена не на замки и родословные, а на мутацию пищеварения: кровь у них не ритуал и не проклятие, а способ дозаправки. Получается сословие, которое стало сословием потому, что у него есть доступ к ресурсу мира, а не потому, что кто-то кого-то завоевал. Слово «просто» тут делает больше, чем от него ждёшь. И «их мутировшая кровь легко контролируемая подобно конечности» — хороший образ, точный и без пафоса.</p></div>", "r": []}];</script>
