<script>const BASE="";const DOCNAME="Провидцы";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0099-S01", "GR-0099--chto-eto"], "h": "<p>Провидцы — вид существ вселенной «Новый мир», введённый Славой одним сообщением (2024-06-04, id 175864). В базе материал заведён карточкой персонажа (<a href=\"PS-0089.html\">Провидцы</a>), но описан он именно как вид, а не как отдельное действующее лицо: речь идёт о целой популяции, у которой есть общая способность и общая судьба. Поимённых носителей ни в одном сообщении нет.</p>\n<p>Определяющая формулировка дана целиком в одной реплике: «Ещё один вид в сторону добра провидцы вымирающий вид ( потому что они сходят с ума из за своей способности и по итогу чаще всего заканчиваются суицидом ) Их способность петля времени ( надеюсь ты не забыл )» (175864).</p>\n<p>Из этой фразы фиксируются четыре вещи:</p>\n<ol>\n<li>Сторона названа прямо — «в сторону добра». В системе мира это привязывает вид к светлой энергии из трёх энергий, объявленных Славой 2024-06-03 (тёмная, светлая, природная, id 175763).</li>\n<li>Вид вымирающий.</li>\n<li>Причина вымирания названа и она внутренняя, а не внешняя: они «сходят с ума из за своей способности и по итогу чаще всего заканчиваются суицидом». То есть популяцию сокращает не враг, а собственная способность.</li>\n<li>Способность — петля времени.</li>\n</ol>\n<p>Слова «Ещё один вид» стоят в реплике, идущей сразу за отбраковкой большого списка существ: провидцы предложены как замена отвергнутому, а не как дополнение к принятому (см. раздел «Как менялась»).</p>", "r": [["Провидцы", "PS-0089.html"]]}, {"t": "Общие способности группы", "a": ["S02", "GR-0099-S02", "GR-0099--obschie-sposobnosti-gruppy"], "h": "<p>Единственная названная способность — «петля времени». Она приписана виду целиком, без разделения на сильных и слабых носителей.</p>\n<p>Механика петли времени в этих записях не разобрана. Слава ссылается на неё как на уже известную соавтору: «( надеюсь ты не забыл )». Ни в <a href=\"PS-0089.html\">Провидцы</a>, ни в <a href=\"MR-0012.html\">Новый мир</a>, ни в <a href=\"PS-0090.html\">Серые странники</a> нет ни описания того, как петля запускается, ни её длительности, ни того, помнит ли провидец предыдущие витки, ни есть ли у неё ограничения. Карточка <a href=\"PS-0089.html\">Провидцы</a> помечает это отдельно: способность упомянута как уже знакомая, её разработка лежит в более ранних окнах переписки, не входящих в эти записи.</p>\n<p>Второе свойство, вытекающее из той же реплики и названное там же, — способность разрушает носителя. Безумие и самоубийство поданы не как отдельный признак вида, а как следствие обладания петлёй времени: вид вымирает «потому что они сходят с ума из за своей способности». Как именно способность сводит с ума — в переписке не сказано.</p>", "r": [["Провидцы", "PS-0089.html"], ["Серые странники", "PS-0090.html"], ["Новый мир", "MR-0012.html"]]}, {"t": "Отношения с другими группами", "a": ["S03", "GR-0099-S03", "GR-0099--otnosheniya-s-drugimi-gruppami"], "h": "<p>Единственная названная привязка — сторона: «в сторону добра». Прямых отношений провидцев с другими видами и объединениями «Нового мира» в переписке не описано ни одного.</p>\n<p>Не названы отношения:</p>\n<ul>\n<li>с колдунами (тёмными и светлыми, низшими и высшими; 2024-06-03, id 175772–175778) — в частности, не сказано, видит ли колдун провидца как «цвет», как он видит людей;</li>\n<li>с ночными охотниками (2024-06-03, id 175797), существами, сотканными из тёмной энергии;</li>\n<li>с Поротай, каменными существами (2024-06-03, id 175810);</li>\n<li>с серыми странниками (<a href=\"PS-0090.html\">Серые странники</a>), при том что оба вида — провидцы и серые странники — вошли в мир в пределах одной пары сообщений 2024-06-04 (id 175863–175864). Единственное, что их связывает в тексте, — соседство реплик: серых странников Слава оставил из чужого списка, провидцев тут же добавил от себя;</li>\n<li>с ГГ, который позднее определён как хранилище тёмных охотников и других существ тёмной энергии (2024-06-06, id 176473).</li>\n</ul>", "r": [["Серые странники", "PS-0090.html"]]}, {"t": "Как менялась — по датам", "a": ["S04", "GR-0099-S04", "GR-0099--kak-menyalas"], "h": "<p><strong>2024-06-03 (id 175718–175813) — до появления вида.</strong> Слава разворачивает «Новый мир»: три энергии, борьба тёмной и светлой внутри человека, колдуны, ночные охотники, Поротай. Провидцы в этот вечер не упоминаются. Ставится задача, из которой они потом и вырастут: «И здесь вопрос каких существ запихать в темную сторону или светлую или как людей смесь. Типо надо существ придумывать» (175783–175784).</p>\n<p><strong>2024-06-04, 01:49 (id 175848) — отвергнутый вариант заполнения светлой стороны.</strong> В чат приходит длинный список существ по трём сторонам. Для светлой стороны там предложены: целители, светящиеся стражи, мудрые древни, звёздные духи, животные-компаньоны. Ни один из этих пяти в мир не вошёл.</p>\n<p><strong>2024-06-04, 07:00–07:01 (id 175863–175864) — введение вида.</strong> Слава отбраковывает список целиком, кроме одного пункта: «Чёт ничего не понравилась кроме серых странников» (175863). Следующей репликой он вводит провидцев (175864). Это единственное сообщение о виде во всём материале; никаких уточнений, вопросов Миколая по нему и ответов на них дальше нет.</p>\n<p><strong>2024-06-05 (id 176188–176192).</strong> Миколай спрашивает: «А в чёрно белом мире придумал что-то ещё?» (176191). Ответа по существу в записях нет, к провидцам разговор не возвращается.</p>\n<p><strong>2024-06-06 (id 176469–176477).</strong> Последнее в этих записях обсуждение мира — роль ГГ как хранилища тёмных существ. Провидцы не упоминаются.</p>\n<p>Версия вида, таким образом, одна: заданное 2024-06-04 состояние не пересматривалось и не дополнялось. Переработок и отклонённых вариантов самих провидцев в переписке нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "GR-0099-S05", "GR-0099--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет: ни одного провидца по имени не названо, отдельных носителей вида не выделено.</li>\n<li>Различий между участниками вида нет: сильнее или слабее, старше или младше, по-разному ли владеют петлёй времени — в переписке не сказано.</li>\n<li>Иерархии нет: вожаков, старших, структуры сообщества не описано. Не сказано даже, живут ли провидцы вместе или поодиночке.</li>\n<li>Численность не названа: сказано только, что вид вымирающий, без указания, сколько их осталось.</li>\n<li>Механика петли времени не разобрана — упомянута как уже известная («надеюсь ты не забыл»), её разработка в эти записи не входит.</li>\n<li>Внешность не описана.</li>\n<li>Ареал не описан: где живут провидцы, в переписке не сказано.</li>\n<li>Не сказано, наследуется ли способность, рождаются ли провидцы с ней или получают её.</li>\n<li>Не сказано, что происходит с провидцем в промежутке между обретением способности и самоубийством: есть только «сходят с ума» и «чаще всего заканчиваются суицидом», без описания стадий и без указания, что бывает с теми, кто в это «чаще всего» не попал.</li>\n<li>Отношения с любыми другими группами мира остались нерешёнными — ни союзов, ни вражды, ни контактов не названо.</li>\n<li>Роль в сюжете не определена: пересекаются ли провидцы с ГГ, участвуют ли в завязке — не сказано.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0099--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0089.html\">Провидцы</a>, <a href=\"PS-0090.html\">Серые странники</a></li>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0012.html\">Новый мир</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0099--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0099.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0099-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0099/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — <code>ID-0050</code> «Провидец»: статьи нет, база 14 549 (самая крупная дыра во всём этом кусте), три входящие ссылки, окна w0032, w0033, w0073. Это ровно та сущность, на которую указывает «( надеюсь ты не забыл )»: 2024-05-07, id 166507, слова Славы — «Провидец имеет способность отматывать время но при этом отматывая время превращается в петлю времени где он обязан 10 000 прожить один и тот же промежуток времени ( безумец, ни разу не проигравший в рукопашном бою или в стрельбе)». Статья целиком держится на способности, у источника которой нет страницы, а материала под неё лежит втрое больше, чем в самой статье.</p>\n<p>Второе — расщепление имени. «Петля» заведена трижды и в трёх разных вселенных: <code>SP-0050</code> «отмотка времени (петля)» (2024-03-29, вселенная «неясно», две ссылки), <code>SP-0051</code> «Петля» (2024-04-02, «игра бога», три ссылки), <code>ID-0050</code> (Апостол и «игра бога»). В «Новом мире» — ни одной записи. Статья ссылается на способность, которой в её собственной вселенной формально не существует, и раздел «Общие способности» вынужден описывать отсутствие.</p>\n<h3>С чего начать</h3>\n<p>В базе, адресно. <code>ID-0050</code>, версия 1, окно w0032, сообщения 166473–166510 — авторская формулировка целиком, оттуда собирается и статья, и недостающая механика. Дальше главное: слово «безумец» стоит там уже 7 мая, за месяц до провидцев, а 4 июня оно разворачивается в «сходят с ума из за своей способности». Связь между майским бойцом-одиночкой и июньским вымирающим видом в базе не проведена ни в одну сторону. Либо это один замысел, переехавший в другой мир, либо два разных — решать надо явно, потому что от этого зависит, можно ли тянуть сюда 10 000 циклов.</p>\n<p>Осторожно с w0033 (167300–167801, 2024-05-09 — 05-10). Развёрнутая механика петли — ветвление и сшивка с основной линией — лежит там внутри машинного разбора, и в файле потерь это помечено прямо: «авторская формулировка провидца, петли времени и 10000 циклов существует только внутри машинного разбора». Число циклов авторское (166507), объяснение механики — нет; в статью его брать нельзя.</p>\n<p>В архив — только за одним: где и почему одиночный боец стал видом. Между двумя формулировками лежат ровно два окна, w0034 (167902–170094, 2024-05-11 — 05-17) и w0035 (170516–174244, 05-19 — 05-30); если переход проговаривался, то там. Само окно статьи, w0036, прочитано целиком, и провидцы в нём — одна реплика.</p>\n<h3>Как развивалось</h3>\n<p>7 мая, 166507 — заявили: один боец отряда, отмотка времени, 10 000 циклов, «безумец».</p>\n<p>9 мая, 167343 — ограничили: механика разобрана до ветви и сшивки, но авторским голосом не переписана.</p>\n<p>Дальше почти месяц вид не упоминается.</p>\n<p>4 июня 07:00 — забраковали чужой список; 07:01, следующей репликой, вернулись — но иначе: то же слово стало названием вымирающего вида «в сторону добра», а безумие из характеристики бойца превратилось в причину сокращения популяции.</p>\n<p>После 07:01 — ничего: ни уточняющих вопросов Миколая, ни ответов, ни второй версии. 5 июня вопрос про мир остаётся без ответа, 6 июня разговор уходит к ГГ.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Для ночных охотников из цены выведен быт: свет причиняет боль — «Поэтому часто скрываться в заброшенных домах или в нелюдных местах» (175797). Ход прямой: цена, поведение, место. У провидцев цена названа сильнее, она носителя убивает, — но того же хода из неё не сделано ни на шаг: где живут, поодиночке или вместе, прячутся ли, как вид с такой ценой вообще держится в мире. Правило «из цены следует образ жизни» применено к виду, введённому 3 июня, и не применено к виду, введённому 4-го.</p>\n<h3>Отклик</h3>\n<p>Зацепила экономия скобки: «вымирающий вид ( потому что они сходят с ума из за своей способности и по итогу чаще всего заканчиваются суицидом )». Причина вымирания убрана внутрь скобки и при этом она внутренняя — вид уничтожает не враг и не охота, а ровно то, что делает его видом. Вымирающих обычно придумывают через гонимость, здесь наоборот, и это дороже стоит.</p>\n<p>И «чаще всего» — оговорка, которая случайно открывает единственную дверь в этом описании: значит, кто-то до суицида не доходит, и вот про него как раз и можно писать. Отдельно нравится «( надеюсь ты не забыл )»: вся механика способности отдана на память соавтора, а из майского материала в июнь дожило одно слово — «безумец», и из него выросла судьба целого вида. Похоже, что непреднамеренно; получилось всё равно хорошо.</p></div>", "r": []}];</script>
