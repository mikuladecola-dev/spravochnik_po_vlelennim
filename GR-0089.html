<script>const BASE="";const DOCNAME="Команда Тена";
const LEAD="";
const CH=[{"t": "Что это", "a": ["S01", "GR-0089-S01", "GR-0089--chto-eto"], "h": "<p>Команда во вселенной «Цветной мир». Как группа она названа в переписке прямо, одной строкой при расшифровке списка персонажей: «Волк командир команды тена с способностю как у волка» (2024-05-25, id 173132). То есть команда названа по имени Тена, а командует ею Волк.</p>\n<p>Это единственное упоминание команды как таковой. Всё остальное, что о ней известно, — это то, что сказано про двух названных в этой строке персонажей. Ни численности, ни задач, ни того, чем команда занимается, в переписке нет.</p>", "r": []}, {"t": "Состав", "a": ["S02", "GR-0089-S02", "GR-0089--sostav"], "h": "<ul>\n<li><a href=\"PS-0078.html\">Тен</a> — Тен, по имени которого названа команда.</li>\n<li><a href=\"PS-0079.html\">Волк</a> — Волк, командир команды.</li>\n</ul>\n<p>Больше никто в состав не записан. Остальной состав не назван: в переписке не сказано, входит ли в команду ещё кто-нибудь и сколько в ней человек.</p>", "r": [["Тен", "PS-0078.html"], ["Волк", "PS-0079.html"]]}, {"t": "Чем участники отличаются друг от друга", "a": ["S03", "GR-0089-S03", "GR-0089--chem-uchastniki-otlichayutsya-drug-ot-dr"], "h": "<p>Тен — «Тен 10 форм» (id 173132). Позже, при перечислении удачных экземпляров эксперимента, он помечен как «Тен( многоликий)» (id 173165). Что именно за 10 форм — не раскрыто, в переписке об этом не сказано.</p>\n<p>Волк — «командир команды тена с способностю как у волка» (id 173132). Миколай уточнил набор: «Способности волка: когти, клыки, вой?» (id 173134). Слава ответил другим набором: «Когти скорость инстинкты регенерация» (id 173135). Клыки и вой из предложенного Миколаем перечня в ответ не вошли — то есть вариант «когти, клыки, вой» остался незакреплённым, принят ответ Славы.</p>\n<p>Общее у обоих — происхождение. Оба входят в число трёх удачных экземпляров эксперимента по превращению бесцветного в цветного: «Вообще в этом эксперименте только 3 удачных экземпляра / Это командир, волк, Тен( многоликий) / За все 30-50 лет» (2024-05-25, id 173165). На вопрос Миколая «А неудачные умерли?» Слава ответил: «Да больше миллиона умерло» и «Или не в состояний двигаться» (id 173166–173168).</p>\n<p>При этом в перечислении трёх удачных экземпляров «командир» стоит отдельным пунктом, рядом с «волк» и «Тен». Волк же в id 173132 назван командиром команды Тена. Совпадают ли «командир» из тройки и Волк-командир, в переписке не проговорено; авторы этот вопрос не поднимали.</p>", "r": []}, {"t": "Иерархия", "a": ["S04", "GR-0089-S04", "GR-0089--ierarhiya"], "h": "<p>Командир — Волк: «Волк командир команды тена» (id 173132). Это всё, что сказано об устройстве команды. Положение Тена внутри команды не описано — команда названа его именем, но кем он в ней является, в переписке не сказано.</p>", "r": []}, {"t": "Как менялась — по датам", "a": ["S05", "GR-0089-S05", "GR-0089--kak-menyalas"], "h": "<p><strong>2024-05-25, 13:58 (id 173128).</strong> Слава выкладывает список имён персонажей одной строкой: «Энергет, прятки, закон, петля, феникс, Тен, волк, дракон, ци, имитатор, спартанец, вампир, драгоценность, бессмерт, жук, лёд, Дилан, граница, солнце», с пояснением «Надо потихоньку записывать а то я по тихонько забываю» (id 173129). Тен и волк идут в списке подряд, как отдельные пункты; о том, что они связаны в команду, здесь ещё не сказано.</p>\n<p><strong>2024-05-25, 13:58–14:02 (id 173130–173136).</strong> Миколай выбирает из списка пять имён — «Тен, волк, дракон, ци, спартанец» — и спрашивает «Кто такие». В ответе Славы (id 173132) команда и появляется: «Тен 10 форм / Волк командир команды тена с способностю как у волка». Дальше — уточнение про волчьи способности (id 173134–173135).</p>\n<p><strong>2024-05-25, 14:14–14:16 (id 173163–173168).</strong> Оба участника команды оказываются привязаны к эксперименту бесцветный→цветной: они входят в тройку удачных экземпляров за 30–50 лет.</p>\n<p><strong>2024-05-25, 15:26–15:29 (id 173330–173340).</strong> Обсуждается, кто станет главным героем. Слава: «Да у меня даже нет гг чтобы пихнуть ему двигатель сюжета», «Ну у меня они все как гг почти», «Поэтому я ещё не определился кто может стать гг». Тен назван кандидатом: «Типо Тен вполне может и энергетик» (id 173337). Выбор сделан в пользу другого персонажа: «Ну ладно пусть будет пока энергетик» (id 173338). То есть вариант «Тен — главный герой» был предложен и отклонён в тот же вечер, с оговоркой «пока».</p>\n<p><strong>2024-09-24 (id 235517–235544).</strong> Список персонажей выписывается заново целиком, Тен и волк в нём остаются. Разбирается, что часть пунктов списка авторы не помнят («И блядь что значит Дилан», «И граница»). Тена и волка это не касается — Слава прямо ссылается на прошлую переписку: «Ты же в той переписки спрашивал чё такой ци и чё такое тен» (id 235543). Ничего нового о команде здесь не добавлено.</p>\n<p><strong>2026-06-09 (id 488786–488789).</strong> Список выложен ещё раз, тем же составом. Слава проверяет по нему память: «Всех помню кроме границы и дилана» (id 488788) — то есть Тен и волк спустя два года остаются в числе помнимых. Новых сведений о команде нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S06", "GR-0089-S06", "GR-0089--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Поимённого состава нет: кроме Тена и Волка, никто в команду не записан, численность не названа.</li>\n<li>Чем команда занимается, где действует, против кого — в переписке не сказано.</li>\n<li>Что за 10 форм у Тена — не раскрыто.</li>\n<li>Роль самого Тена в команде, названной его именем, не описана.</li>\n<li>Совпадает ли Волк с «командиром» из тройки удачных экземпляров эксперимента, или это разные персонажи, — осталось нерешённым, вопрос не поднимался.</li>\n<li>С отрядом Командира авторы эту команду не связывали; никаких отношений с другими группами в переписке не названо.</li>\n<li>Команда упомянута ровно один раз (id 173132) и больше в переписке не возвращается — ни в разборе списка 2024-09-24, ни в 2026-06-09.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["GR-0089--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает персонажей:</strong> <a href=\"PS-0078.html\">Тен</a>, <a href=\"PS-0079.html\">Волк</a></li>\n</ul>", "r": []}, {"t": "Примечания и поправки", "a": ["GR-0089--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/GR-0089.md</code> — они переживают пересборку.</em></p>", "r": []}, {"t": "⚙ Машинные заметки — сводка. Это НЕ материал авторов", "a": ["GR-0089-zametki"], "h": "<div class=\"mnote\"><b>⚙ машинный слой — не материал авторов</b><p>Всё, что ниже этой черты, написала модель.</p>\n<p>Это <strong>не то, что придумали Миколай и Слава</strong>, и в базу это не входит.\nЗаметки не влияют на связи между статьями, не попадают в реестры и указатели,\nи при каждой пересборке переписываются заново.\nПрошлые версии не пропадают: они складываются в <code>_sistema/zametki_arhiv/GR-0089/</code>.\nИдентификаторы здесь даны простым кодом, а не ссылкой, — чтобы машинный текст\nничем не походил на авторский.</p>\n<p>Здесь заметка целиком. Те её куски, что относятся к конкретному разделу,\nпродублированы выше под этим разделом — читать сорок страниц до конца не нужно.</p>\n<h3>Приоритет дыр</h3>\n<p>Первым — <code>SL-0013</code>, «Список персонажей Славы»: статьи нет, 10 КБ базы, четыре входящие ссылки (в тексте справочника на него ссылаются <code>VS-0012</code>, <code>VS-0014</code>, <code>VS-0015</code>). Эта статья целиком висит на нём: единственное упоминание команды, id 173132, — реплика внутри расшифровки того самого списка. Пока у списка нет статьи, у команды нет и контекста: не видно, что имена надиктованы одной строкой по памяти, что расшифрованы из девятнадцати только восемь и что расшифровка шла по выбору Миколая («Тен, волк, дракон, ци, спартанец»), а не по важности. Дороже этого во вселенной сейчас ничего нет.</p>\n<p>Второе — <code>PS-0078</code>, «Тен»: пять входящих ссылок, статья 6 КБ, базы 5,1 КБ. По числу ссылок он второй персонаж вселенной после Имитатора, а материала под ним меньше, чем у любого, кто на него ссылается. Команда названа его именем — и упирается в самое тонкое место.</p>\n<p>Третье — <code>SL-0012</code>, «Тезаурус вселенной»: статьи нет, 5,5 КБ, две ссылки. Тут это косвенно, но именно там сказано, что термины и названия решили вести системно, и там же видно, что не повели.</p>\n<h3>С чего начать</h3>\n<p>Не в архив, а в базу, и не туда, где ждёшь. Пробел «что за 10 форм у Тена» надо проверять по <code>PS-0052</code> — запись называется «многоликий», лежит в «игре бога», 9 КБ базы, одна входящая ссылка. Там, окно w0030, 2024-04-06, id 154386: «Новый перс многоликий ( способности перевоплощаться в 10 разных существ) то бишь Бен 10», и дальше полокна Миколай выдаёт этих десятерых поимённо — Тардибовин, Керагуар, Лихтспид и прочие, с описаниями. Тен помечен как «многоликий» в 173165. Связь авторами не проговорена, решать за них нельзя — но искать надо сначала здесь, а не в переписке.</p>\n<p>Остальное по базе: <code>SL-0013</code> (173127–173136, 235514–235555, 488786–488789), <code>PS-0079</code> — там сцена с уточнением волчьих способностей целиком, <code>PS-0077</code> — тройка удачных экземпляров.</p>\n<p>По самой команде архив, скорее всего, пуст: с 2024-05-25 до закрытия вселенной 2024-07-31 (<code>VS-0012</code>, id 213577) о ней не говорят, а в двух перечитываниях списка её нет. Если всё же идти, то влево от 25 мая: w0030 (2024-04-05/07, персонажи выкладываются пачкой) и w0032 (2024-05-07, id 166880 — Слава про то, что «кидать сильных персонажей в один отряд глупо тем более если их ний силы друг другу не подходят»; ближайшая реплика о том, как он вообще собирает группы).</p>\n<h3>Как развивалось</h3>\n<p>13:58 — имена списком, Тен и волк стоят рядом как два отдельных пункта, ничем не связанные. 14:00 — команда возникает придаточным в ответе на вопрос «кто такие»: «Волк командир команды тена». Заявлена и тут же ограничена — следующая реплика Миколая уже про способности Волка, не про команду. 14:15 — оба участника уходят в другую рамку, тройку удачных экземпляров эксперимента, и там команда не упоминается. 15:26 — Тен предложен в главные герои и в тот же вечер отставлен: «Ну ладно пусть будет пока энергетик». Забыли: 2024-09-24 список перечитан целиком, спорят о «Дилане» и «границе» — про команду ни слова. Вернулись 2026-06-09 — снова список, «Всех помню кроме границы и дилана». Через два года держатся имена; связка между ними не возвращается ни разу.</p>\n<h3>Что не сформулировано по вашей же логике</h3>\n<p>Правило Слава называет прямо здесь же, в 173129: «Надо потихоньку записывать а то я по тихонько забываю». И оно работает — список выложен ещё дважды, по нему проверяют память, по нему видно, что именно выпало. Но правило названо для имён. Для того, что имена связывает — команд, отрядов, пар, — такого правила нет: команда Тена родилась в реплике-расшифровке списка, в сам список не попала и потому ни в одну проверку памяти не входила. Запись заведена на единицы, а не на отношения между ними, и для второго вида это нигде не проговорено.</p>\n<h3>Отклик</h3>\n<p>Сильное здесь — масштаб несоответствия. Шесть слов, «Волк командир команды тена с способностю как у волка», сказанные вскользь, между «Тен 10 форм» и «Дракон женщина», создают боевое подразделение с именем и командиром — и это всё, что от него когда-либо будет. Причём назвали её по одному, а командует другой: сама формулировка обещает историю (почему команда носит имя не командира?), которую никто не собирался рассказывать.</p>\n<p>И отдельно — 2026-06-09. «Всех помню кроме границы и дилана». Вселенную отложили в июле 2024-го, а список имён человек всё ещё листает через два года и сверяется с ним, как с записной книжкой. Из всей конструкции пережила не команда, не эксперимент и не система сил, а девятнадцать слов в одну строку — то, что было заведено просто чтобы не забыть.</p></div>", "r": []}];</script>
