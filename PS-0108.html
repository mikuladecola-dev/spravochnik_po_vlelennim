<script>const BASE="";const DOCNAME="Дриада великан";
const LEAD="";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0108-S01", "PS-0108--proishozhdenie"], "h": "<p>Дриада великан появляется в переписке 2024-07-03 (окно w0041, id 194785–194794) как второй пункт в списке из четырёх защитников, который перечисляет Миколай:</p>\n<div class=\"q\"><p>«1. блуждающий огненный гриб<br>2. дриада великан<br>3. тот пламенный перс<br>4. юкиона с миниганом в котором снаряд сосульки»</p></div>\n<p>Список назван без пояснений — просто перечисление. Тут же рядом Слава уточняет по третьему пункту: «Или ты про сталкера ?», Миколай подтверждает («ага»), Слава отвечает «Ну можно, ну он уже наемник хотя можно». К самой дриаде это уточнение не относится.</p>\n<p>В навигационной части записи дриада обозначена как «второй из четырёх защитников от М» — то есть предложенный Миколаем.</p>\n<p>Вариант имени, встречающийся в переписке: «дриада».</p>", "r": []}, {"t": "Внешность", "a": ["S02", "PS-0108-S02", "PS-0108--vneshnost"], "h": "<p>Развёрнутое описание дано 2024-07-03 (id 194802). Миколай выкладывает текст, а следом (id 194804) сам помечает его происхождение: «хз, нейронка быстро набросала». То есть описание сгенерировано нейросетью и внесено в переписку как есть:</p>\n<div class=\"q\"><p>«Эта могучая лесная нимфа достигает высоты 10 метров. Её кожа покрыта корой и мхом, а волосы напоминают ветви с листьями. Глаза светятся мягким зелёным светом. Дриада обладает невероятной силой и способна управлять растениями вокруг себя. Она является хранительницей леса и защищает его от незваных гостей.»</p></div>\n<p>Отсюда: рост 10 метров, кожа покрыта корой и мхом, волосы напоминают ветви с листьями, глаза светятся мягким зелёным светом.</p>\n<p>В том же сообщении рядом идут описания других пунктов списка — блуждающего огненного гриба и юкионы с миниганом. Третий пункт («тот пламенный перс» / сталкер) в этом сгенерированном тексте пропущен.</p>", "r": []}, {"t": "Характер", "a": ["S03", "PS-0108-S03", "PS-0108--harakter"], "h": "<p>Отдельно характер не обсуждался. Из сгенерированного описания есть только роль: «Она является хранительницей леса и защищает его от незваных гостей».</p>", "r": []}, {"t": "Способности", "a": ["S04", "PS-0108-S04", "PS-0108--sposobnosti"], "h": "<p>Названы две:</p>\n<ul>\n<li>«невероятная сила»;</li>\n<li>«способна управлять растениями вокруг себя».</li>\n</ul>\n<p>Обе — из сгенерированного нейронкой описания (id 194802). Механика управления растениями не разбиралась.</p>", "r": []}, {"t": "Связи с другими", "a": ["S05", "PS-0108-S05", "PS-0108--svyazi-s-drugimi"], "h": "<ul>\n<li>Входит в список из четырёх защитников вместе с блуждающим огненным грибом, «тем пламенным персом» (он же сталкер, он же, по словам Славы, «уже наемник») и юкионой с миниганом на снарядах-сосульках (2024-07-03, id 194785).</li>\n<li>Связана с темой режимов правления островов: у её острова разбирается государственный строй (2024-07-03, id 194984–194985).</li>\n</ul>", "r": []}, {"t": "Как менялся — состояния по датам", "a": ["S06", "PS-0108-S06", "PS-0108--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2024-07-03 (окно w0041, id 194785–194794).</strong> Только имя в списке защитников: «дриада великан». Ни внешности, ни способностей, ни привязки к острову.</p>\n<p><strong>Версия 2 — 2024-07-03 (окно w0041, id 194802–194804).</strong> Появляется развёрнутое описание: лесная нимфа 10 метров, кора и мох, волосы-ветви, светящиеся зелёным глаза, невероятная сила, управление растениями, хранительница леса. Миколай сразу помечает источник: «хз, нейронка быстро набросала».</p>\n<p><strong>Версия 3 — 2024-07-03 (окно w0041, id 194980–194987).</strong> Разбор государственного строя. Миколай идёт по островам: «теперь болото» → «ну, эт унитарная республика», затем «о у дриады получается будет авторитарная монархия» и «тож Федеративная». Тут же сам оценивает результат: «ну так, сомнительно кнш» — то есть вариант помечен автором как сомнительный, а не утверждён. Дальше он переходит к следующему вопросу: «че там ещё по вопросам политики есть».</p>\n<p>Обратить внимание: в версии 3 названы два строя подряд — «авторитарная монархия» и «тож Федеративная». Как они соотносятся между собой, в переписке не разъяснено.</p>", "r": []}, {"t": "Что с ним стало", "a": ["S07", "PS-0108-S07", "PS-0108--chto-s-nim-stalo"], "h": "<p>Вся работа над персонажем укладывается в один день, 2024-07-03, окно w0041. Дальнейшего развития в материале нет.</p>", "r": []}, {"t": "Пробелы", "a": ["S08", "PS-0108-S08", "PS-0108--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Не сказано, на каком именно острове или в каком биоме живёт дриада. В записи это отмечено отдельно: реплики про болото (id 194980–194981) и про дриаду (id 194984) идут подряд, но связь между ними неявная — «не до конца ясно, дриада сидит на болоте или на отдельном биоме».</li>\n<li>От кого или от чего защитники защищают, в переписке не сказано.</li>\n<li>Строй помечен самим Миколаем как «сомнительно кнш» — окончательного решения нет.</li>\n<li>Соотношение «авторитарной монархии» и «федеративной» не объяснено.</li>\n<li>Имя собственное у персонажа отсутствует, только видовое обозначение.</li>\n<li>Характер, происхождение внутри мира, история — не обсуждались.</li>\n<li>Описание внешности и способностей не авторское: оно сгенерировано нейросетью, и авторы никак его не подтверждали и не правили.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0108--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Входит в группы:</strong> <a href=\"GR-0030.html\">Защитники островов</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0030.html\">Защитники островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0108--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-07-03</td>\n<td>194785–194794</td>\n<td>w0041</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-03</td>\n<td>194802–194804</td>\n<td>w0041</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-07-03</td>\n<td>194980–194987</td>\n<td>w0041</td>\n<td>7 островов (объявлено)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0108-driada-velikan.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0108--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0108.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
