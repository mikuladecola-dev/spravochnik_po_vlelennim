<script>const BASE="";const DOCNAME="ГГ с особой ДНК (донор)";
const LEAD="<p>Главный герой сюжета про пришельцев, разработан за два дня (2024-08-07 — 2024-08-08, id 215643–215796). Собственного имени в переписке не получил, авторы называют его «гг особый ДНК» и «донор».</p>";
const CH=[{"t": "Происхождение", "a": ["S01", "PS-0130-S01", "PS-0130--proishozhdenie"], "h": "<p>Персонаж возник из вопроса Славы о пришельцах: «И вопрос был что за особую ДНК ищет пришельцы в людях» (2024-08-07, id 215643). Ответом на этот вопрос и стал герой — носитель той самой ДНК.</p>\n<p>На следующий день Миколай уточнил происхождение искомого гена: «но на самом деле этой информации 563 миллиона лет» (2024-08-08, id 215791). Из всего человечества нужный ген сохранился у одного: «и вот 1 человек остался нужном геном производящим нужную кровь, единственную в своём роде» (id 215792). Именно поэтому пришельцам он нужен живым: «вот он будет донором» (id 215793).</p>", "r": []}, {"t": "Способности", "a": ["S02", "PS-0130-S02", "PS-0130--sposobnosti"], "h": "<p>Способность заложена в биологии героя и описана в версии от 2024-08-08 (id 215794): «клетки его организма способны к невероятно мощному термоядерному синтезу, превращая каждый атом воздуха кроме углерода в кислород, что позволяет в 99 раз увеличить питание организма полезными веществами, его кровь невероятно сильно насыщается». Отдельно оговорено исключение — углерод синтезом не затрагивается.</p>\n<p>Кровь, насыщенная таким образом, и есть то, ради чего героя ловят: она «единственная в своём роде» (id 215792). Способность описана в базе как <a href=\"SP-0096.html\">Термоядерный синтез клеток донора</a> (Термоядерный синтез клеток донора), сам ген и кровь — как <a href=\"SP-0095.html\">Особая ДНК / золотая кровь</a> (Особая ДНК / золотая кровь).</p>\n<p>Цена способности названа сразу же: «но ему надо невъебенно много хавать» (id 215795). Масштаб потребности проиллюстрирован эпизодом из детства: «когда маленький был, он от двух дневного голода целый город схавал» (id 215796). Два дня без еды — и съеден целый город.</p>", "r": [["Термоядерный синтез клеток донора", "SP-0096.html"], ["Особая ДНК / золотая кровь", "SP-0095.html"]]}, {"t": "Связи с другими", "a": ["S03", "PS-0130-S03", "PS-0130--svyazi-s-drugimi"], "h": "<ul>\n<li><a href=\"MR-0047.html\">Мир, захваченный пришельцами</a> (Мир, захваченный пришельцами) — мир, в котором разворачивается сюжет; пришельцы ищут в людях особую ДНК и охотятся за героем.</li>\n<li><a href=\"SP-0095.html\">Особая ДНК / золотая кровь</a> (Особая ДНК / золотая кровь) — ген и кровь, носителем которых он остался единственным.</li>\n<li><a href=\"SP-0096.html\">Термоядерный синтез клеток донора</a> (Термоядерный синтез клеток донора) — механика, работающая в его клетках.</li>\n</ul>\n<p>Других персонажей рядом с ним в переписке не появляется: ни семьи, ни союзников, ни конкретных противников с именами.</p>", "r": [["Особая ДНК / золотая кровь", "SP-0095.html"], ["Термоядерный синтез клеток донора", "SP-0096.html"], ["Мир, захваченный пришельцами", "MR-0047.html"]]}, {"t": "Как менялся", "a": ["S04", "PS-0130-S04", "PS-0130--kak-menyalsya"], "h": "<p><strong>Версия 1 — 2024-08-07 (id 215643–215644), окно w0050.</strong> Заявлена сюжетная канва без биологических подробностей. Слава: «Сам сюжет гг особый ДНК его хватают потом он сбегает и ныкается в разных местах попутно сражаясь, добывает информацию, раскрывает секреты, устраивать бунты». То есть на первом шаге персонаж — это последовательность действий: хватают, сбегает, ныкается, сражается, добывает информацию, раскрывает секреты, устраивает бунты. Вселенная на этой дате в базе помечена как неясная (по дате объявления).</p>\n<p><strong>Версия 2 — 2024-08-08 (id 215791–215796), окно w0050.</strong> Миколай достраивает биологию: возраст информации (563 миллиона лет), единственность носителя, роль донора, термоядерный синтез клеток, аппетит и город, съеденный в детстве. Канва первой версии при этом не отменяется и не переписывается — она просто не упоминается повторно. Вселенная на этой дате объявлена как «монстры».</p>", "r": []}, {"t": "Пробелы", "a": ["S05", "PS-0130-S05", "PS-0130--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Имени у героя в окне нет.</li>\n<li>Не сказано, как связаны между собой два состояния: происходит ли поедание города до захвата пришельцами, после побега, или это отдельный эпизод предыстории. Хронология не выстроена.</li>\n<li>Не сказано, чем «золотая кровь» полезна пришельцам — что именно они с ней делают, получив донора.</li>\n<li>Что означает «этой информации 563 миллиона лет» — идёт ли речь о возрасте гена, о возрасте сведений у пришельцев или о чём-то третьем — в переписке не разъяснено.</li>\n<li>Внешность, характер, возраст на момент основного действия не описаны.</li>\n<li>Судьба героя (чем кончается сюжет) осталась нерешённой: линия обрывается на перечислении того, что он делает.</li>\n<li>Не сказано, откуда берётся столько еды при его потребностях в обычном ходе сюжета, и есть ли у него из-за этого проблемы с людьми.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["PS-0130--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упоминает способности:</strong> <a href=\"SP-0095.html\">Особая ДНК / золотая кровь</a>, <a href=\"SP-0096.html\">Термоядерный синтез клеток донора</a></li>\n<li><strong>Упоминает миры:</strong> <a href=\"MR-0047.html\">Мир, захваченный пришельцами</a></li>\n<li><strong>Упомянут в группах:</strong> <a href=\"GR-0043.html\">Пришельцы</a></li>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0015.html\">монстры</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["PS-0130--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-08-07</td>\n<td>215643–215644</td>\n<td>w0050</td>\n<td>неясно (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-08-08</td>\n<td>215791–215796</td>\n<td>w0050</td>\n<td>монстры (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/personazhi/PS-0130-gg-s-osoboy-dnk-donor.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["PS-0130--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/PS-0130.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
