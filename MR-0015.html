<script>const BASE="";const DOCNAME="Инструменты";
const LEAD="";
const CH=[{"t": "Устройство", "a": ["S01", "MR-0015-S01", "MR-0015--ustroystvo"], "h": "<p>Инструменты (также «артефакты», «инструмент», «орудие») — центральная механика мира. Люди рождаются с силой, но не могут её контролировать; сила разрушает носителя изнутри; инструмент останавливает саморазрушение, помогает направлять и развивать силу.</p>\n<p><strong>Исходный образ — Тор.</strong> Формулировка Славы (2024-06-17, id 183162): «Концепций Тора бог грома который и без молота может сражаться но молот помогает направлять силу, вот и здесь люди рождаются с силами но не способны их контролировать и в помощь инструменты ( вот только они берутся, надо придумать )». Там же: «Также есть исключения виде способности петли и прятки».</p>\n<p><strong>Развёрнутая механика</strong> (2024-06-17, id 183188), дословно:</p>\n<div class=\"q\"><p>Сила большая + инструмент &gt;&gt;&gt;&gt;&gt;сила маленькая<br>И вот получив огромную силу с рождения она допустим ограничивается подсознательно потому что ты сдохнешь в любом возрасте если будешь использовать её полностью<br>И если ты будешь использовать силу без инструмент ты вредишь самому себе так как хоть ты подсознательно его сдерживает но этого не хватает и ты получаешь урон<br>А вот с инструментом который помогает контролировать силу помаленьку он также помогает её развивать<br>И сразу если они используют всю свою силу даже с инструментом они мгновенно сдохнут не успев применить и половины</p></div>\n<p>По пунктам:</p>\n<ul>\n<li>большая сила с инструментом сильнее маленькой силы;</li>\n<li>полученная с рождения огромная сила ограничивается подсознательно, иначе носитель умрёт в любом возрасте;</li>\n<li>применение силы без инструмента наносит урон самому носителю: подсознательного сдерживания не хватает;</li>\n<li>инструмент помогает контролировать силу помаленьку и одновременно развивать её;</li>\n<li>полное применение всей силы даже с инструментом — мгновенная смерть, «не успев применить и половины».</li>\n</ul>\n<p><strong>Образ сосуда.</strong> Слава (2024-06-17, id 183189): «Так сказать люди слишком маленькие бокал и поэтому сила их уничтожает а вот инструмент помогает остановить это саморазрушение».</p>\n<p><strong>Сжатая формулировка того же дня</strong> (2024-06-17, id 183238): «Более полная концепция / Сила разрушает хозяина а инструмент останавливает это разрушение». Слава пояснил, зачем сокращал: «В своем прошлом предложение было слишком но а сейчас из стало поменьше» (id 183240).</p>\n<p><strong>Изменение концепции через два дня.</strong> 2024-06-19 (id 184081) акцент смещается с удержания на увеличение выброса:</p>\n<div class=\"q\"><p>Изменения концепций оружие помогает использовать больший силы<br>Пример человек маленький кран а инструмент большой ( то бишь большой выброс энергий)<br>Если они долго будут без инструмента то сосуд будет ломаться так как сила идёт а выпускается мало</p></div>\n<p>То есть человек — маленький кран, инструмент — большой; без инструмента сосуд ломается не от применения силы, а от того, что сила идёт, а выпускается мало.</p>", "r": []}, {"t": "Место во вселенной", "a": ["S02", "MR-0015-S02", "MR-0015--mesto-vo-vselennoy"], "h": "<p>Инструменты — часть Новой вселенной; в справочнике механика отнесена к вселенной «7 островов».</p>\n<p>Связана с сюжетами: «Дух выбирает носителя», «Неизлечимые раны от перенапряжения силы», «Откуда берутся инструменты». Последнее было поставлено вопросом с самого начала — Слава сразу пометил: «вот только они берутся, надо придумать» (id 183162).</p>\n<p><strong>Заимствование из «проклятых».</strong> 2024-06-17 (id 183174–183187) Миколай предложил опереться на уже существующий образец: «Так есть эти / Проклятые / Или как их», «Они тоже не умеют контролировать способности с рождения / И там законтрить это помогла тату / Мы же хотим инструмент». Затем поправился: «Не тату, а заклинание, ну да ладно». Предложение к заимствованию: «ну недостатки у этих проклятых спиздить можно», «Поведение там без оружия. Поведение способностей» (id 183186–183187). Что именно из этих недостатков взяли — в переписке не сказано.</p>\n<p><strong>Отправная точка разговора.</strong> До концепции Тора Миколай предлагал другой подход (2024-06-17, id 183158): «Виды способностей. Сосредоточиться на физических и ментальных усилениях - сверхсила, скорость, регенерация, телепатия, телекинез и т.д. Разные комбинации и уровни развития способностей у людей». Слава ответил на это концепцией Тора, и дальше работа шла по ней. Реакция Миколая на концепцию инструментов: «Ага, я понял куда ты клонишь. Где-то такой концепт я уже видел. Я так понял ты на нём хочешь сосредоточиться», «Сильная идея в принципе» (id 183190–183192).</p>", "r": []}, {"t": "Как менялся по версиям", "a": ["S03", "MR-0015-S03", "MR-0015--kak-menyalsya-po-versiyam"], "h": "<p><strong>2024-06-17, id 183157–183169 (версия 1).</strong> Концепция Тора: бог грома может драться и без молота, но молот направляет силу. Люди рождаются с силами, не способны их контролировать, в помощь — инструменты. Названы исключения: «способности петли и прятки». Сразу помечено, что происхождение инструментов надо придумать.</p>\n<p><strong>2024-06-17, id 183170–183187 (версия 2).</strong> Аналогия с «проклятыми»: они тоже не контролируют силу с рождения, там помогло заклинание (сначала было сказано «тату»), а здесь нужен именно инструмент. Предложено позаимствовать у них недостатки и поведение силы без оружия.</p>\n<p><strong>2024-06-17, id 183188–183192 (версия 3).</strong> Развёрнутая механика: соотношение «большая сила + инструмент &gt; маленькая сила», подсознательное ограничение, урон себе без инструмента, контроль и развитие с инструментом, мгновенная смерть при полном применении. Образ: люди — слишком маленький бокал.</p>\n<p><strong>2024-06-17, id 183237–183244 (версия 4, повтор прежней мысли).</strong> Сжатая формулировка дня: «Сила разрушает хозяина а инструмент останавливает это разрушение». Прежняя развёрнутая версия не отменяется, а сокращается.</p>\n<p><strong>2024-06-19, id 184081 (версия 5).</strong> Смена акцента: инструмент не столько сдерживает, сколько позволяет использовать бо́льшую силу. Человек — маленький кран, инструмент — большой, то есть больший выброс энергии. Долгое отсутствие инструмента ломает сосуд, потому что сила идёт, а выпускается мало.</p>", "r": []}, {"t": "Пробелы", "a": ["S04", "MR-0015-S04", "MR-0015--probely"], "h": "<div class=\"gaps\"><ul>\n<li>Откуда берутся инструменты — не придумано. Помечено самим Славой при первом же изложении концепции: «вот только они берутся, надо придумать» (id 183162).</li>\n<li>«Способности петли и прятки» названы как исключения из правила, но нигде не раскрыты.</li>\n<li>Какие именно недостатки «проклятых» заимствуются и как ведёт себя сила без оружия — предложено, но не расписано.</li>\n<li>Как соотносятся версия от 2024-06-17 (инструмент останавливает саморазрушение) и версия от 2024-06-19 (инструмент увеличивает выброс) — заменяет ли вторая первую или дополняет её, в переписке не сказано.</li>\n<li>Кто носители инструментов, сколько их, как инструмент достаётся конкретному человеку — в этом окне не обсуждалось.</li>\n</ul></div>", "r": []}, {"t": "Связи — всё вместе", "a": ["MR-0015--svyazi"], "h": "<p><em>Сводный список. Под каждым разделом выше есть свой блок связей — только то, что упомянуто в нём. Связи сквозные и двусторонние.</em></p>\n<ul>\n<li><strong>Упомянут в статье о вселенной:</strong> <a href=\"VS-0001.html\">7 островов</a></li>\n</ul>", "r": []}, {"t": "Источники", "a": ["MR-0015--istochniki"], "h": "<p><em>Диапазоны id ведут в архив переписки; дословные куски лежат в базе первого этапа.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дата</th>\n<th>Сообщения</th>\n<th>Окно</th>\n<th>Вселенная</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-06-17</td>\n<td>183157–183169</td>\n<td>w0038</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-06-17</td>\n<td>183170–183187</td>\n<td>w0038</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-06-17</td>\n<td>183188–183192</td>\n<td>w0038</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n<tr>\n<td>2024-06-17</td>\n<td>183237–183244</td>\n<td>w0038</td>\n<td>7 островов (по дате объявления)</td>\n<td>повтор</td>\n</tr>\n<tr>\n<td>2024-06-19</td>\n<td>184081–184081</td>\n<td>w0038</td>\n<td>7 островов (по дате объявления)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Исходник в базе: <code>kb/sushnosti/miry/MR-0015-instrumenty.md</code></p>", "r": []}, {"t": "Примечания и поправки", "a": ["MR-0015--primechaniya-i-popravki"], "h": "<p><em>Пока пусто. Правки пиши в <code>_sistema/pravki/MR-0015.md</code> — они переживают пересборку.</em></p>", "r": []}];</script>
